<!doctype html>
<html lang="uk" data-style="calm-studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>js learning lab · visuals demo</title>
<style>
  body { margin: 0; background: var(--ll-bg); color: var(--ll-ink); font-family: var(--ll-font-ui); }
  .demo-bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center; padding: 0.6rem 1rem; background: var(--ll-panel); border-bottom: 1px solid var(--ll-line); font-size: 0.85rem; }

  .demo-sample h2 { font-family: var(--ll-font-head); font-weight: var(--ll-head-weight); letter-spacing: var(--ll-head-tracking); font-size: 1.15rem; margin: 0 0 0.6rem; }
  .demo-kind { font-size: 0.72rem; color: var(--ll-dim); background: var(--ll-soft); padding: 0.1rem 0.4rem; border-radius: 4px; font-family: var(--ll-font-mono); vertical-align: middle; }
  .demo-text { margin-top: 0.6rem; font-size: 0.9rem; color: var(--ll-dim); }
  .demo-text p { color: var(--ll-ink); line-height: 1.5; }
