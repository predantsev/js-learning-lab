id: js-11-07-inheritance-vs-composition
unit: JS-11
title:
  uk: "Успадкування чи композиція"
  en: "Inheritance or composition"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Реалізувати одну поведінку двічі: підкласом через `extends`/`super` і складеним об’єктом, що делегує колаборатору."
    en: "Implement the same behavior once as a subclass with `extends`/`super` and once as a composed object that delegates to a collaborator."
  - uk: "Пояснити для заданої зміни вимог, яке рішення ламає менше місць, і назвати проблему крихкого базового класу."
    en: "Explain for a given change request which design breaks fewer callers, naming the fragile base class problem."
  - uk: "Порівняти клас, фабрику із замиканням і прості дані з функціями за приватністю, тестованістю й серіалізацією."
    en: "Compare a class, a factory with closures and plain data plus functions by privacy, testability and serialization."
prerequisites: [js-11-06-getters-setters-descriptors, js-03-06-higher-order-callbacks]
subskills:
  - { family: J-06, skill: "inheritance vs composition", depth: intro }
  - { family: J-06, skill: "object model tradeoffs", depth: intro }
glossary: [inheritance, subclass, composition, delegation, adapter]
selfCheck: [predict-double-count, logging-store]

blocks:
  - id: extends-super
    kind: explanation
    title:
      uk: "extends і super: підклас"
      en: "extends and super: a subclass"
    body:
      uk: |
        Клас можна збудувати на основі іншого: це [[inheritance|успадкування]]. Новий клас — [[subclass|підклас]]; він отримує все, що має базовий, і може щось змінити:

        ```js
        class ItemList {
          items = [];
          add(item) {
            this.items.push(item);
          }
          addAll(list) {
            for (const item of list) {
              this.items.push(item);
            }
          }
        }

        class CountingList extends ItemList {
          count = 0;
          add(item) {
            this.count += 1;
            super.add(item);        // run the base version of add
          }
          addAll(list) {
            this.count += list.length;
            super.addAll(list);
          }
        }
        ```

        `extends` робить так, що `CountingList.prototype` веде до `ItemList.prototype`: це знайомий ланцюжок прототипів, тож метод, якого немає в підкласі, шукається в базовому. Свій метод підкласу **перекриває** базовий (затінення на рівні прототипів), а `super.add(item)` викликає базову версію з тим самим `this`. Якщо в підкласу є свій `constructor`, у ньому треба викликати `super(…)` до першого звернення до `this`.

        Тут усе працює: `addAll` на трьох речах дає `count` 3. Питання в тому, що буде, коли хтось зміняє базовий клас.
      en: |
        A class can be built on another one: this is [[inheritance|inheritance]]. The new class is a [[subclass|subclass]]; it gets everything the base class has and may change something:

        ```js
        class ItemList {
          items = [];
          add(item) {
            this.items.push(item);
          }
          addAll(list) {
            for (const item of list) {
              this.items.push(item);
            }
          }
        }

        class CountingList extends ItemList {
          count = 0;
          add(item) {
            this.count += 1;
            super.add(item);        // run the base version of add
          }
          addAll(list) {
            this.count += list.length;
            super.addAll(list);
          }
        }
        ```

        `extends` makes `CountingList.prototype` lead to `ItemList.prototype`: this is the familiar prototype chain, so a method that is missing in the subclass is looked up in the base class. A subclass’s own method **overrides** the base one (shadowing at the level of prototypes), and `super.add(item)` calls the base version with the same `this`. If the subclass has its own `constructor`, it must call `super(…)` before it first touches `this`.

        Everything works here: `addAll` with three things gives `count` 3. The question is what happens when somebody changes the base class.

  - id: predict-double-count
    kind: prediction
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
    prompt:
      uk: "Базовий клас «покращили»: тепер `addAll` викликає `this.add` для кожного елемента. Підклас лишився як був. Що з’явиться в консолі?"
      en: "The base class was “improved”: `addAll` now calls `this.add` for every element. The subclass stayed as it was. What appears in the console?"
    code: |
      class ItemList {
        items = [];

        add(item) {
          this.items.push(item);
        }

        addAll(list) {
          for (const item of list) {
            this.add(item);
          }
        }
      }

      class CountingList extends ItemList {
        count = 0;

        add(item) {
          this.count += 1;
          super.add(item);
        }

        addAll(list) {
          this.count += list.length;
          super.addAll(list);
        }
      }

      const list = new CountingList();
      list.addAll(["%%lamp%%", "%%mug%%", "%%tickets%%"]);
      console.log(list.items.length);
      console.log(list.count);
    verify:
      logs: ["3", "6"]
    answer:
      type: choice
      options:
        - id: double
          code: "3\n6"
        - id: unchanged
          code: "3\n3"
          why:
            uk: "Підклас рахує двічі: `addAll` підкласу додає `list.length`, а потім `super.addAll` викликає `this.add` — і це вже `add` підкласу, бо `this` — об’єкт `CountingList`. Кожна річ рахується ще раз."
            en: "The subclass counts twice: the subclass’s `addAll` adds `list.length`, and then `super.addAll` calls `this.add` — and that is already the subclass’s `add`, because `this` is the `CountingList` object. Every thing is counted once more."
        - id: items-doubled
          code: "6\n6"
          why:
            uk: "Речей у списку рівно три: `add` підкласу викликає `super.add`, який кладе кожну річ один раз. Подвоюється лише лічильник."
            en: "There are exactly three things in the list: the subclass’s `add` calls `super.add`, which puts each thing in once. Only the counter is doubled."
        - id: error
          code: "TypeError"
          why:
            uk: "Помилки немає: `super.add` і `super.addAll` — звичайні виклики методів базового класу, обидва існують."
            en: "There is no error: `super.add` and `super.addAll` are ordinary calls of the base class’s methods, and both exist."
      correct: [double]
    explanation:
      uk: "У `super.addAll` змінна `this` — це `CountingList`, тому `this.add(item)` знаходить **перекритий** `add` підкласу, і кожен елемент рахується двічі: раз у `addAll`, раз в `add`. Підклас покладався на те, що базовий `addAll` не викликає `add`, — а це внутрішня деталь, яку без попередження змінили. Це проблема [[inheritance|крихкого базового класу]]: підклас залежить від того, **як** базовий клас працює всередині, а не лише від того, що він робить."
      en: "In `super.addAll` the variable `this` is the `CountingList`, so `this.add(item)` finds the subclass’s **overridden** `add`, and every element is counted twice: once in `addAll`, once in `add`. The subclass relied on the base `addAll` not calling `add` — an internal detail that was changed without warning. This is the **fragile base class** problem: a subclass depends on **how** the base class works inside, not only on what it does."

  - id: two-designs
    kind: visual
    visual: diagram
    title:
      uk: "Одна зміна — два рішення"
      en: "One change — two designs"
    textEquivalent:
      uk: "Схема порівнює два рішення одного завдання. У першому, успадкуванні, підклас CountingList сполучений зв’язком extends з базовим класом ItemList. У другому, композиції, об’єкт countingList() тримає всередині окремий ItemList і викликає його методи. Зміна вимог така: базовий addAll тепер викликає this.add для кожного елемента. Вона відбувається всередині ItemList. У рішенні з успадкуванням this у базовому addAll — це підклас, тож this.add знаходить add підкласу, і лічильник збільшується двічі: 6 замість 3. У рішенні з композицією обгортка викликає list.addAll(items), і всередині цього виклику this — звичайний ItemList, тож його this.add — власний add списку, про який обгортка не чує. Лічильник лишається правильним: 3."
      en: "The diagram compares two designs of one task. In the first, inheritance, the subclass CountingList is joined to the base class ItemList by an extends link. In the second, composition, the object countingList() holds a separate ItemList inside and calls its methods. The change request is this: the base addAll now calls this.add for every element. It happens inside ItemList. In the inheritance design this in the base addAll is the subclass, so this.add finds the subclass’s add and the counter grows twice: 6 instead of 3. In the composition design the wrapper calls list.addAll(items), and inside that call this is an ordinary ItemList, so its this.add is the list’s own add, which the wrapper never hears about. The counter stays right: 3."
    spec:
      layout: tb
      groups:
        - { id: inh, label: { uk: "Успадкування", en: "Inheritance" } }
        - { id: comp, label: { uk: "Композиція", en: "Composition" } }
      nodes:
        - { id: sub, group: inh, label: "CountingList", w: 130 }
        - { id: base, group: inh, label: "ItemList", w: 110 }
        - { id: wrap, group: comp, label: "countingList()", w: 130 }
        - { id: inner, group: comp, label: "ItemList", w: 110 }
      edges:
        - { id: sub->base, from: sub, to: base, label: "extends" }
        - { id: wrap->inner, from: wrap, to: inner, label: "holds" }
      steps:
        - caption:
            uk: "Те саме завдання — рахувати додане — двома способами: підклас (`extends`) і обгортка, що **тримає** список."
            en: "The same task — counting what is added — in two ways: a subclass (`extends`) and a wrapper that **holds** a list."
        - caption:
            uk: "Зміна вимог: базовий `addAll` тепер викликає `this.add`. Правка торкається лише `ItemList`."
            en: "The change request: the base `addAll` now calls `this.add`. The edit touches only `ItemList`."
          highlight: [base]
          dim: [sub, wrap, inner]
          annotate:
            - { id: base, text: { uk: "тут правка", en: "edit here" } }
        - caption:
            uk: "Успадкування: у базовому `addAll` змінна `this` — це `CountingList`, тож `this.add` знаходить `add` підкласу, і лічильник росте вдвічі: **6 замість 3**."
            en: "Inheritance: in the base `addAll` the variable `this` is the `CountingList`, so `this.add` finds the subclass’s `add` and the counter grows twice: **6 instead of 3**."
          highlight: [sub, sub->base, base]
          dim: [wrap, inner]
          annotate:
            - { id: sub, text: { uk: "рахує двічі", en: "counts twice" } }
        - caption:
            uk: "Композиція: обгортка викликає `list.addAll(items)`. Усередині `this` — звичайний `ItemList`, його `this.add` — власний `add` списку. Обгортка про нього не чує: лічильник лишається **3**."
            en: "Composition: the wrapper calls `list.addAll(items)`. Inside it `this` is an ordinary `ItemList`, and its `this.add` is the list’s own `add`. The wrapper never hears about it: the counter stays **3**."
          highlight: [wrap, wrap->inner, inner]
          dim: [sub, base]
          annotate:
            - { id: wrap, text: { uk: "рахує раз", en: "counts once" } }

  - id: composition-instead
    kind: explanation
    title:
      uk: "Композиція: тримай, а не успадковуй"
      en: "Composition: hold, do not inherit"
    body:
      uk: |
        [[composition|Композиція]] будує поведінку з частин: об’єкт **тримає** інший об’єкт (його називають колаборатором) і пересилає йому виклики. Це [[delegation|делегування]]:

        ```js
        function countingList(list) {
          let count = 0;
          return {
            add(item) {
              count += 1;
              list.add(item);        // delegate to the held list
            },
            addAll(items) {
              count += items.length;
              list.addAll(items);
            },
            get count() {
              return count;
            },
          };
        }
        ```

        Обгортка залежить лише від **публічного інтерфейсу** списку (`add`, `addAll`), а не від того, чи викликає один метод інший. Коли базовий `addAll` змінили, нічого не зламалося. Якщо у списку з’явиться новий метод, обгортка його не показує назовні, поки ти цього не захочеш: помилка буде видимою (`TypeError`), а не тихою. Такий об’єкт, що стоїть між твоїм кодом і чимось чужим і дає інтерфейс, який тобі зручний, часто називають [[adapter|адаптером]]: репозиторій над `localStorage` — типовий приклад.

        Успадкування доречне, коли справді «є різновидом» (`TextField` — це `Field`) і базовий клас під твоїм контролем та стабільний. В інших випадках за замовчуванням обирай композицію.

        Три способи зробити об’єкт зі станом і методами:

        | | клас | фабрика із замиканням | дані + функції |
        |---|---|---|---|
        | приватність | `#поле` | змінні замикання | немає: усе видно |
        | тестування | `new` + підміна залежності | залежність — аргумент | виклик із даними |
        | JSON | методів немає; дані — поля | стан замикання не видно | дані без змін |
        | `instanceof` | працює | не працює | не працює |
      en: |
        [[composition|Composition]] builds behavior from parts: an object **holds** another object (called a collaborator) and forwards calls to it. This is [[delegation|delegation]]:

        ```js
        function countingList(list) {
          let count = 0;
          return {
            add(item) {
              count += 1;
              list.add(item);        // delegate to the held list
            },
            addAll(items) {
              count += items.length;
              list.addAll(items);
            },
            get count() {
              return count;
            },
          };
        }
        ```

        The wrapper depends only on the **public interface** of the list (`add`, `addAll`), not on whether one method calls another. When the base `addAll` was changed, nothing broke. If the list gets a new method, the wrapper does not pass it on to its users until you want it to: the mistake will be visible (a `TypeError`), not silent. An object that stands between your code and something foreign and gives an interface that suits you is often called an [[adapter|adapter]]: a repository over `localStorage` is a typical example.

        Inheritance fits when it is really “is a kind of” (`TextField` is a `Field`) and the base class is under your control and stable. In other cases choose composition by default.

        Three ways to make an object with state and methods:

        | | class | factory with a closure | data + functions |
        |---|---|---|---|
        | privacy | `#field` | closure variables | none: all visible |
        | testing | `new` + a fake dependency | the dependency is an argument | call with data |
        | JSON | no methods; data are fields | closure state is invisible | data unchanged |
        | `instanceof` | works | does not work | does not work |

  - id: double-count
    kind: example
    runtime: browser-js
    dir: double-count
    entry: index.js
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
    title:
      uk: "Дефект подвійного підрахунку і його усунення"
      en: "The double-count defect and its repair"
    body:
      uk: |
        У файлі обидва рішення: підклас `CountingList` і обгортка `countingList(list)`. Перемикач `useComposition` обирає, яке з них працює. Натисни **Запустити** й порівняй кількість речей і лічильник.
      en: |
        The file holds both designs: the subclass `CountingList` and the wrapper `countingList(list)`. The switch `useComposition` chooses which one runs. Press **Run** and compare the number of things with the counter.
    tryIt:
      uk: |
        1. Консоль: `3` і `6`. Речей три, а підклас порахував шість — дефект, який ти передбачив.
        2. Заміни `const useComposition = false;` на `true` і запусти: тепер `3` і `3`. Обгортка делегує списку й не залежить від того, що відбувається всередині `ItemList.addAll`.
        3. У `ItemList.addAll` заміни `this.add(item);` на `this.items.push(item);` і запусти з обома значеннями перемикача: тепер усюди `3` і `3`. Підклас працював лише доти, доки базовий клас не викликав `add` сам.
      en: |
        1. Console: `3` and `6`. There are three things, but the subclass counted six — the defect you predicted.
        2. Replace `const useComposition = false;` with `true` and run: now `3` and `3`. The wrapper delegates to the list and does not depend on what happens inside `ItemList.addAll`.
        3. In `ItemList.addAll` replace `this.add(item);` with `this.items.push(item);` and run with both values of the switch: now it is `3` and `3` everywhere. The subclass worked only as long as the base class did not call `add` itself.

  - id: recall
    kind: review
    title:
      uk: "Згадай: поведінка як аргумент"
      en: "Recall: behavior as an argument"
    items:
      - id: function-argument
        from: js-03-06-higher-order-callbacks
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          function applyTwice(change, value) {
            return change(change(value));
          }

          console.log(applyTwice((price) => price + 3, 10));
          console.log(applyTwice((text) => text + "!", "ok"));
        verify:
          logs: ["16", "ok!!"]
        answer:
          type: choice
          options:
            - id: twice
              code: "16\nok!!"
            - id: once
              code: "13\nok!"
              why:
                uk: "Функцію `change` викликають двічі: результат першого виклику стає аргументом другого."
                en: "The function `change` is called twice: the result of the first call becomes the argument of the second."
            - id: not-a-function
              code: "TypeError"
              why:
                uk: "Функція — таке саме значення, як число чи текст: її можна передати параметром і викликати всередині."
                en: "A function is a value like a number or text: it can be passed as a parameter and called inside."
          correct: [twice]
        explanation:
          uk: "`applyTwice` не знає, що саме робить `change`: вона лише викликає її. Саме так обгортка з композиції працює зі своїм колаборатором — через те, що той вміє, а не через те, як він це робить."
          en: "`applyTwice` does not know what exactly `change` does: it only calls it. This is exactly how a wrapper in composition works with its collaborator — through what it can do, not how it does it."

  - id: logging-store
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: logging-store
    entry: index.js
    editable: [index.js]
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    title:
      uk: "Обгортка, що веде журнал"
      en: "A wrapper that keeps a log"
    instructions:
      uk: |
        У файлі `store.js` лише для читання лежить готове сховище `MemoryStore` з методами `get(key)` і `set(key, value)`. Допиши в `index.js` функцію `withLogging(store, log)`, яка **обгортає** будь-яке таке сховище:

        - вона повертає **новий** об’єкт із методами `get(key)` і `set(key, value)`;
        - кожен виклик спершу передає `log` повідомлення `"get <key>"` або `"set <key>"`, а потім пересилає виклик такому самому методові сховища й повертає те, що відповіло сховище;
        - саме сховище не змінюється, а новий об’єкт не успадковує від нього: він його **тримає**.

        Методи `MemoryStore` використовують `this`, тож їх треба викликати на самому сховищі. Унизу файла готовий код: у консолі має з’явитися збережена назва й `set w-01 | get w-01`.
      en: |
        The read-only file `store.js` holds a ready store `MemoryStore` with the methods `get(key)` and `set(key, value)`. In `index.js` complete the function `withLogging(store, log)` that **wraps** any such store:

        - it returns a **new** object with the methods `get(key)` and `set(key, value)`;
        - every call first passes `log` the message `"get <key>"` or `"set <key>"`, then forwards the call to the same method of the store and returns whatever the store answered;
        - the store itself is not changed, and the new object does not inherit from it: it **holds** it.

        The methods of `MemoryStore` use `this`, so they must be called on the store itself. At the bottom of the file there is ready code: the console must show the stored name and `set w-01 | get w-01`.
    testTitles:
      "the program prints the stored value and the two log lines":
        uk: "Програма друкує збережену назву й два записи журналу"
        en: "The program prints the stored value and the two log lines"
      "get and set reach the store and return its answers":
        uk: "get і set доходять до сховища й повертають його відповіді"
        en: "get and set reach the store and return its answers"
      "every call is logged first and then passed on, in order":
        uk: "Кожен виклик спершу заноситься в журнал, а потім передається далі"
        en: "Every call is logged first and then passed on, in order"
      "the store itself is left alone and not inherited from":
        uk: "Саме сховище не змінене й не є прототипом обгортки"
        en: "The store itself is left alone and not inherited from"
    hints:
      nudge:
        uk: "Що має бути в замиканні нового об’єкта, щоб його методи могли дістатися до сховища? І на якому об’єкті треба викликати методи сховища, які використовують `this`?"
        en: "What must be in the closure of the new object so that its methods can reach the store? And on which object must the methods of the store that use `this` be called?"
      explanation:
        uk: "Поверни звичайний об’єкт із двома методами. Параметр `store` доступний у них через замикання, тож кожен метод спершу викликає `log(…)`, а потім `store.get(…)` чи `store.set(…)` — через крапку, на самому сховищі, щоб `this` усередині нього був правильним. Відповідь сховища повертай далі. Не присвоюй нічого в `store.…`: сховище не змінюють."
        en: "Return an ordinary object with two methods. The parameter `store` is available in them through the closure, so each method first calls `log(…)` and then `store.get(…)` or `store.set(…)` — through a dot, on the store itself, so that `this` inside it is right. Pass the store’s answer on. Do not assign anything to `store.…`: the store is not changed."
    solutionNote:
      uk: "Обгортка тримає сховище в замиканні й делегує йому через `store.get(…)` та `store.set(…)`: так `this` у методах сховища — саме воно. Нова поведінка (журнал) додана без наслідування й без правки сховища, тож обгортка працює з будь-яким об’єктом, що має `get` і `set`."
      en: "The wrapper holds the store in its closure and delegates through `store.get(…)` and `store.set(…)`: that way `this` in the store’s methods is the store itself. The new behavior (the log) is added without inheritance and without editing the store, so the wrapper works with any object that has `get` and `set`."
    feedback:
      - when: { test: "the program prints the stored value and the two log lines" }
        message:
          uk: "Ця перевірка очікує в консолі два рядки: збережену назву й `set w-01 | get w-01`. Якщо програма впала ще на завантаженні, перевір, що `withLogging` повертає об’єкт і що методи сховища викликають на самому сховищі."
          en: "This check expects two console lines: the stored name and `set w-01 | get w-01`. If the program crashed while loading, check that `withLogging` returns an object and that the store’s methods are called on the store itself."
      - when: { test: "get and set reach the store and return its answers" }
        message:
          uk: "Ця перевірка записує значення через обгортку, очікує його в самому сховищі й очікує, що `get` повертає те, що дало сховище (для відсутнього ключа — `undefined`)."
          en: "This check writes a value through the wrapper, expects it in the store itself, and expects `get` to return what the store gave (`undefined` for a missing key)."
      - when: { test: "every call is logged first and then passed on, in order" }
        message:
          uk: "Ця перевірка очікує порядок: запис журналу `set a`, виклик `set` сховища, запис `get a`, виклик `get` сховища. Журнал заповнюється **перед** тим, як виклик іде далі."
          en: "This check expects the order: the log entry `set a`, the store’s `set`, the entry `get a`, the store’s `get`. The log is written **before** the call is passed on."
      - when: { test: "the store itself is left alone and not inherited from" }
        message:
          uk: "Ця перевірка очікує, що обгортка — новий об’єкт, прототип якого не сховище, а методи `get` і `set` самого сховища лишилися тими самими функціями. Нова поведінка живе в обгортці, а не у сховищі."
          en: "This check expects the wrapper to be a new object whose prototype is not the store, and the store’s own `get` and `set` to be the same functions as before. The new behavior lives in the wrapper, not in the store."

  - id: to-project
    kind: transfer
    capstoneStep: JS-11
    body:
      uk: "У кроці проєкту ти зробиш репозиторій двічі: класом із приватним списком і фабрикою `create…Repository(storage)`, що тримає сховище в замиканні. Фабрика приймає сховище параметром, тож у тестах підставляєш підробне, а обгортка на кшталт `withLogging` додається без жодної правки репозиторію."
      en: "In the project step you will build the repository twice: as a class with a private list and as a factory `create…Repository(storage)` that holds the storage in a closure. The factory takes the storage as a parameter, so in tests you pass a fake one, and a wrapper like `withLogging` is added without touching the repository."
