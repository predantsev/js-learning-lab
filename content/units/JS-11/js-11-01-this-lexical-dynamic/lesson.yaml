id: js-11-01-this-lexical-dynamic
unit: JS-11
title:
  uk: "this: стрілкові функції беруть його з коду навколо, звичайні — з місця виклику"
  en: "this: arrows take it from the code around, regular functions from the call"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачити, на що вказує `this`, коли той самий метод викликають як `obj.method()`, як відокремлену функцію й як callback у модулі (строгий режим)."
    en: "Predict what `this` refers to when the same method is called as `obj.method()`, as a detached function and as a callback, in a module (strict mode)."
  - uk: "Пояснити, чому стрілкова функція бере `this` із коду навколо себе, а звичайна — з місця виклику."
    en: "Explain why an arrow function takes `this` from the surrounding code while a regular function gets it from the call."
prerequisites: [js-03-03-arrow-functions, js-04-05-objects-properties]
subskills:
  - { family: J-04, skill: "lexical vs dynamic this", depth: intro }
glossary: [this-binding, lexical-this, detached-method]
selfCheck: [predict-three-calls, predict-arrow-method, tally-add-all]

blocks:
  - id: who-is-this
    kind: explanation
    title:
      uk: "this: що стоїть перед крапкою"
      en: "this: what stands before the dot"
    body:
      uk: |
        Ти вже користувався методами масивів: `prices.push(18)`. Звичайні об’єкти теж можуть мати **методи** — функції в полях:

        ```js
        const wish = {
          name: "Настільна лампа",
          label() {
            return "Бажання: " + this.name;
          },
        };
        wish.label(); // "Бажання: Настільна лампа"
        ```

        Запис `label() { … }` — скорочення від `label: function () { … }`. Усередині методу слово [[this-binding|`this`]] означає «той об’єкт, з яким цю функцію викликали». У `wish.label()` це те, що стоїть **перед крапкою**, — `wish`.

        Головне: `this` визначається **в момент виклику**, а не там, де функцію записано. Одна й та сама функція при різних викликах отримує різний `this`. Файли на цій платформі — модулі, а модулі завжди працюють у [[strict-mode|строгому режимі]]: якщо перед викликом немає жодного об’єкта, `this` дорівнює `undefined`.
      en: |
        You already use array methods: `prices.push(18)`. Ordinary objects can have **methods** too — functions stored in fields:

        ```js
        const wish = {
          name: "Desk lamp",
          label() {
            return "Wish: " + this.name;
          },
        };
        wish.label(); // "Wish: Desk lamp"
        ```

        The notation `label() { … }` is a short form of `label: function () { … }`. Inside a method the word [[this-binding|`this`]] means “the object this function was called on”. In `wish.label()` that is whatever stands **before the dot** — `wish`.

        The key point: `this` is decided **at the moment of the call**, not where the function is written. The same function gets a different `this` in different calls. Files on this platform are modules, and modules always run in [[strict-mode|strict mode]]: when nothing stands before the call, `this` is `undefined`.

  - id: predict-three-calls
    kind: prediction
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      prefix: { uk: "Бажання:", en: "Wish:" }
    prompt:
      uk: "Той самий метод `label` викликають трьома способами. Що з’явиться в консолі?"
      en: "The same method `label` is called in three ways. What appears in the console?"
    code: |
      const wish = {
        name: "%%headphones%%",
        label() {
          return "%%prefix%% " + this.name;
        },
      };

      console.log(wish.label());

      const detached = wish.label;
      try {
        console.log(detached());
      } catch (error) {
        console.log(error.name);
      }

      const other = { name: "%%lamp%%", label: wish.label };
      console.log(other.label());
    verify:
      logs: ["%%prefix%% %%headphones%%", "TypeError", "%%prefix%% %%lamp%%"]
    answer:
      type: choice
      options:
        - id: decided-by-call
          code: "%%prefix%% %%headphones%%\nTypeError\n%%prefix%% %%lamp%%"
        - id: always-wish
          code: "%%prefix%% %%headphones%%\n%%prefix%% %%headphones%%\n%%prefix%% %%headphones%%"
          why:
            uk: "Функція не пам’ятає, у якому об’єкті її записано. `this` береться з кожного виклику окремо: `detached()` викликано без об’єкта, а в `other.label()` перед крапкою стоїть `other`."
            en: "A function does not remember which object it was written in. `this` is taken from each call separately: `detached()` is called with no object, and in `other.label()` the thing before the dot is `other`."
        - id: all-errors
          code: "%%prefix%% %%headphones%%\nTypeError\nTypeError"
          why:
            uk: "У `other.label()` перед крапкою стоїть `other`, тож `this` — це `other`, і в нього є поле `name`. Помилка буде лише там, де `this` порожній."
            en: "In `other.label()` the thing before the dot is `other`, so `this` is `other`, and it has a `name` field. The error happens only where `this` is empty."
        - id: undefined-text
          code: "%%prefix%% %%headphones%%\n%%prefix%% undefined\n%%prefix%% %%lamp%%"
          why:
            uk: "Коли `this` дорівнює `undefined`, прочитати з нього `name` неможливо: це не «порожнє» поле, а `TypeError`."
            en: "When `this` is `undefined`, reading `name` from it is impossible: that is not an “empty” field but a `TypeError`."
      correct: [decided-by-call]
    explanation:
      uk: "`wish.label()` — перед крапкою `wish`, тож `this` — це `wish`. `const detached = wish.label` копіює лише функцію, без об’єкта: виклик `detached()` не має нічого перед крапкою, у строгому режимі `this` дорівнює `undefined`, а `this.name` кидає `TypeError`. А в `other.label()` перед крапкою `other` — і та сама функція читає `name` з нього."
      en: "In `wish.label()` the thing before the dot is `wish`, so `this` is `wish`. `const detached = wish.label` copies only the function, without the object: the call `detached()` has nothing before the dot, in strict mode `this` is `undefined`, and `this.name` throws a `TypeError`. In `other.label()` the thing before the dot is `other` — and the same function reads `name` from it."

  - id: this-in-frames
    kind: visual
    visual: code-trace
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      prefix: { uk: "Бажання:", en: "Wish:" }
    title:
      uk: "Крок за кроком: що отримує this у кожному виклику"
      en: "Step by step: what this is in every call"
    textEquivalent:
      uk: "Об’єкт wish має поле name і два методи: label та labelLater. Перший виклик wish.label() має перед крапкою wish, тож у кадрі label змінна this вказує на об’єкт wish і метод повертає «%%prefix%% %%lamp%%». Другий виклик wish.labelLater() теж має this = wish. Усередині нього стрілкова функція inner викликає this.label(): стрілка не має власного this, тож бере той, що був у labelLater, — знову wish, і label отримує this = wish, бо перед крапкою стоїть this, тобто wish. Далі const detached = wish.label копіює лише функцію. Виклик detached() не має перед крапкою нічого, тож у кадрі label this дорівнює undefined, і читання this.name кидає TypeError. try/catch перехоплює помилку, і в консолі з’являється TypeError."
      en: "The object wish has a name field and two methods: label and labelLater. The first call wish.label() has wish before the dot, so in the frame of label the variable this points at the object wish and the method returns “%%prefix%% %%lamp%%”. The second call wish.labelLater() has this = wish too. Inside it the arrow function inner calls this.label(): an arrow has no this of its own, so it uses the one from labelLater — wish again — and label gets this = wish, because the thing before the dot is this, that is wish. Then const detached = wish.label copies only the function. The call detached() has nothing before the dot, so in the frame of label this is undefined, and reading this.name throws a TypeError. try/catch catches the error and TypeError appears in the console."
    spec:
      file: visuals/this-in-frames.js
      captions:
        - at: { line: 11 }
          text:
            uk: "Об’єкт `wish` створено. Зараз буде виклик `wish.label()` — перед крапкою стоїть `wish`."
            en: "The object `wish` exists. Now comes the call `wish.label()` — `wish` stands before the dot."
        - at: { line: 3, kind: call, hit: 1 }
          text:
            uk: "У кадрі `label` серед змінних з’явився `this`: він вказує на `wish` (#1) — об’єкт, з яким викликали."
            en: "In the frame of `label` a variable `this` appeared: it points at `wish` (#1) — the object the call was made on."
        - at: { line: 6, kind: call }
          text:
            uk: "`wish.labelLater()` — знову `this` = `wish`. Усередині метод створить стрілкову функцію `inner`."
            en: "`wish.labelLater()` — again `this` is `wish`. Inside, the method will create the arrow function `inner`."
        - at: { line: 7, kind: call }
          text:
            uk: "Викликано стрілку `inner`. Власного `this` вона не має: `this` у її тілі — той самий, що в `labelLater` (#1). Його не вирішував виклик `inner()`."
            en: "The arrow `inner` is called. It has no `this` of its own: the `this` in its body is the same one as in `labelLater` (#1). The call `inner()` did not decide it."
        - at: { line: 3, kind: call, hit: 2 }
          text:
            uk: "`this.label()` — перед крапкою стоїть `this`, тобто `wish`. Тому в кадрі `label` знову `this` = `wish`."
            en: "`this.label()` — the thing before the dot is `this`, that is `wish`. So in the frame of `label` `this` is `wish` again."
        - at: { line: 15 }
          text:
            uk: "`const detached = wish.label` скопіювало лише функцію. Тепер виклик `detached()` — без нічого перед крапкою."
            en: "`const detached = wish.label` copied only the function. Now the call `detached()` has nothing before the dot."
        - at: { line: 3, kind: call, hit: 3 }
          text:
            uk: "Та сама функція `label`, але `this` дорівнює `undefined`: виклик не назвав жодного об’єкта."
            en: "The same function `label`, but `this` is `undefined`: the call named no object."
        - at: { line: 4, kind: throw }
          text:
            uk: "`this.name` — читання поля з `undefined`: `TypeError`."
            en: "`this.name` reads a field of `undefined`: a `TypeError`."
        - at: { line: 18, kind: end }
          text:
            uk: "`catch` перехопив помилку. У консолі два рядки з назвою бажання й `TypeError`."
            en: "`catch` caught the error. The console holds two lines with the wish name and `TypeError`."

  - id: arrow-this
    kind: explanation
    title:
      uk: "Стрілка не має власного this"
      en: "An arrow has no this of its own"
    body:
      uk: |
        Стрілкова функція не отримує `this` від виклику. Вона бере його з коду навколо себе — з місця, де її **записано**. Це [[lexical-this|лексичний `this`]], так само як замикання бере змінні з місця створення.

        Це дуже зручно для функцій усередині методу. Метод `forEach` викликає функцію для кожного елемента масиву (і нічого не повертає):

        ```js
        const receipt = {
          prefix: "Позиція: ",
          showAll(lines) {
            lines.forEach((line) => {
              console.log(this.prefix + line); // this is the receipt: taken from showAll
            });
          },
        };
        ```

        Якби тут стояла звичайна `function (line) { … }`, `forEach` викликав би її без об’єкта: `this` був би `undefined`, а `this.prefix` кинуло б `TypeError`.

        Зворотний бік: стрілка не годиться на роль самого методу. У `label: () => this.name` стрілка бере `this` із верхнього рівня файла, а там у модулі `this` дорівнює `undefined`. Метод пиши звичайним записом `label() { … }`, а функції всередині нього — стрілками.
      en: |
        An arrow function does not get `this` from the call. It takes it from the code around it — from the place where it is **written**. This is [[lexical-this|lexical `this`]], just as a closure takes variables from where it was created.

        This is very handy for functions inside a method. The method `forEach` calls a function for every element of an array (and returns nothing):

        ```js
        const receipt = {
          prefix: "Item: ",
          showAll(lines) {
            lines.forEach((line) => {
              console.log(this.prefix + line); // this is the receipt: taken from showAll
            });
          },
        };
        ```

        If a regular `function (line) { … }` stood here, `forEach` would call it with no object: `this` would be `undefined`, and `this.prefix` would throw a `TypeError`.

        The flip side: an arrow is no good as the method itself. In `label: () => this.name` the arrow takes `this` from the top level of the file, and in a module `this` there is `undefined`. Write the method in the regular form `label() { … }`, and the functions inside it as arrows.

  - id: predict-arrow-method
    kind: prediction
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
    prompt:
      uk: "В об’єкта два методи: один записано звичайно, другий — стрілкою. Обидва викликають через крапку. Що з’явиться в консолі?"
      en: "An object has two methods: one written in the regular way, the other as an arrow. Both are called through a dot. What appears in the console?"
    code: |
      const wish = {
        name: "%%headphones%%",
        regular() {
          return this === wish;
        },
        arrow: () => this === wish,
      };

      console.log(wish.regular());
      console.log(wish.arrow());
    verify:
      logs: ["true", "false"]
    answer:
      type: choice
      options:
        - id: arrow-from-file
          code: "true\nfalse"
        - id: arrow-like-regular
          code: "true\ntrue"
          why:
            uk: "Стрілка — не просто коротший запис. Вона не бере `this` з виклику, тож `wish` перед крапкою для неї нічого не значить: `this` у ній той, що на верхньому рівні файла, — у модулі це `undefined`."
            en: "An arrow is not just shorter notation. It does not take `this` from the call, so `wish` before the dot means nothing to it: its `this` is the one at the top level of the file — `undefined` in a module."
        - id: both-false
          code: "false\nfalse"
          why:
            uk: "`regular` — звичайна функція, і в `wish.regular()` перед крапкою стоїть `wish`, тож `this === wish`."
            en: "`regular` is a regular function, and in `wish.regular()` the thing before the dot is `wish`, so `this === wish`."
        - id: swapped
          code: "false\ntrue"
          why:
            uk: "Навпаки: звичайна функція отримує `this` від виклику (`wish`), а стрілка бере його з коду навколо — з верхнього рівня файла."
            en: "The other way round: the regular function gets `this` from the call (`wish`), and the arrow takes it from the code around it — the top level of the file."
      correct: [arrow-from-file]
    explanation:
      uk: "`wish.regular()` — звичайний метод, перед крапкою `wish`, тож `this === wish`. Стрілку `arrow` записано на верхньому рівні модуля (літерал об’єкта не створює власного `this`), тому її `this` — `undefined`, хоч її й викликали через `wish.`. Для методів — звичайний запис, для функцій усередині методів — стрілки."
      en: "`wish.regular()` is a regular method with `wish` before the dot, so `this === wish`. The arrow `arrow` is written at the top level of the module (an object literal does not create a `this` of its own), so its `this` is `undefined`, even though it was called through `wish.`. Use the regular form for methods and arrows for the functions inside them."

  - id: three-calls
    kind: example
    runtime: browser-js
    dir: three-calls
    entry: index.js
    strings:
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      prefix: { uk: "Бажання:", en: "Wish:" }
    title:
      uk: "Один метод, три виклики"
      en: "One method, three calls"
    body:
      uk: |
        Метод `label`, ще один метод із вкладеною стрілкою й відокремлена копія `detached`. Натисни **Запустити** і для кожного рядка консолі скажи, що стояло перед крапкою й чому `this` саме такий.
      en: |
        The method `label`, one more method with a nested arrow and a detached copy `detached`. Press **Run** and for each console line say what stood before the dot and why `this` is what it is.
    tryIt:
      uk: |
        1. У консолі два рядки з назвою бажання, а третій — `TypeError`. Помилку зловив `catch`, тож програма дійшла до кінця.
        2. У `labelLater` заміни рядок коду `const inner = () => this.label();` на `const inner = function () { return this.label(); };` і запусти. Тепер `inner` — звичайна функція, її викликають без об’єкта, і програма падає вже на другому виклику: `this` у ній `undefined`. Поверни стрілку (Ctrl+Z, на Mac — Cmd+Z).
        3. Наприкінці файла додай `const other = { name: "Чашка", label: wish.label };` і `console.log(other.label());`. Та сама функція, інший об’єкт перед крапкою — і в консолі з’являється `Бажання: Чашка`.
      en: |
        1. The console has two lines with the wish name, and the third is a `TypeError`. `catch` caught the error, so the program reached the end.
        2. In `labelLater` replace the line `const inner = () => this.label();` with `const inner = function () { return this.label(); };` and run. Now `inner` is a regular function, it is called with no object, and the program crashes on the second call: `this` in it is `undefined`. Put the arrow back (Ctrl+Z, or Cmd+Z on a Mac).
        3. At the end of the file add `const other = { name: "Mug", label: wish.label };` and `console.log(other.label());`. The same function, another object before the dot — and `Wish: Mug` appears in the console.

  - id: recall
    kind: review
    title:
      uk: "Згадай: що тримає замикання"
      en: "Recall: what a closure keeps"
    items:
      - id: closure-count
        from: js-03-05-closures
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          function makeCounter() {
            let count = 0;
            return () => {
              count = count + 1;
              return count;
            };
          }

          const first = makeCounter();
          const second = makeCounter();
          first();
          first();
          console.log(first());
          console.log(second());
        verify:
          logs: ["3", "1"]
        answer:
          type: choice
          options:
            - id: own-count
              code: "3\n1"
            - id: shared-count
              code: "3\n4"
              why:
                uk: "Кожен виклик `makeCounter()` створює **власну** змінну `count`. `second` тримає зв’язок з іншою змінною, ніж `first`."
                en: "Every call of `makeCounter()` creates its **own** variable `count`. `second` is linked to a different variable than `first`."
            - id: reset
              code: "1\n1"
              why:
                uk: "`count = 0` виконується один раз — під час `makeCounter()`. Виклики `first()` не повертаються до цього рядка, а лише збільшують ту саму змінну."
                en: "`count = 0` runs once — during `makeCounter()`. Calls of `first()` do not go back to that line; they only increase the same variable."
          correct: [own-count]
        explanation:
          uk: "Стрілка всередині `makeCounter` тримає зв’язок зі змінною `count` з місця свого створення. У кожної пари «виклик `makeCounter` + стрілка» свій `count`. Лексичний `this` працює так само: стрілка бере його з коду навколо — з місця, де її записано, а не з місця, звідки викликають."
          en: "The arrow inside `makeCounter` keeps a link to the variable `count` from the place where it was created. Every pair “call of `makeCounter` + arrow” has its own `count`. Lexical `this` works the same way: an arrow takes it from the code around it — from where it is written, not from where it is called."

  - id: tally-add-all
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: tally-add-all
    entry: index.js
    title:
      uk: "Лічильник виконаних справ"
      en: "A counter of finished tasks"
    instructions:
      uk: |
        Об’єкт `board` рахує виконані справи планувальника. Допиши метод `markDone(ids)`: для кожного id зі списку він збільшує поле `doneCount` на 1.

        - Список проходь методом `forEach` зі стрілковою функцією — або будь-яким іншим циклом, який тобі зручний.
        - Метод має працювати з **будь-яким** об’єктом, на якому його викликали, тож пиши `this.doneCount`, а не `board.doneCount`: перевірка позичає метод іншому об’єктові.
        - Порожній список нічого не змінює.

        Унизу файла виклик для трьох id: у консолі має з’явитися `3`.
      en: |
        The object `board` counts the finished tasks of a planner. Complete the method `markDone(ids)`: for every id in the list it increases the field `doneCount` by 1.

        - Walk the list with `forEach` and an arrow function — or with any other loop you like.
        - The method must work with **any** object it is called on, so write `this.doneCount`, not `board.doneCount`: the check lends the method to another object.
        - An empty list changes nothing.

        At the bottom of the file there is a call for three ids: the console must show `3`.
    testTitles:
      "the program counts three finished tasks":
        uk: "Програма рахує три виконані справи"
        en: "The program counts three finished tasks"
      "markDone counts on whatever object it is called on":
        uk: "markDone рахує на тому об’єкті, на якому його викликали"
        en: "markDone counts on whatever object it is called on"
      "markDone leaves board alone when called on another object":
        uk: "markDone не чіпає board, коли його викликали на іншому об’єкті"
        en: "markDone leaves board alone when called on another object"
      "an empty list changes nothing":
        uk: "Порожній список нічого не змінює"
        en: "An empty list changes nothing"
    hints:
      nudge:
        uk: "У якому місці коду `this` має правильне значення — у самому методі чи в функції, яку ти віддаєш `forEach`? Яка форма функції бере `this` з місця, де її записано?"
        en: "Where in the code does `this` have the right value — in the method itself or in the function you give to `forEach`? Which form of function takes `this` from where it is written?"
      explanation:
        uk: "Усередині `markDone` `this` — це об’єкт, на якому метод викликали. Функцію для `forEach` запиши стрілкою: вона візьме цей `this` із `markDone`, і в її тілі `this.doneCount` вказуватиме на потрібне поле. Звичайна `function` отримала б `undefined`."
        en: "Inside `markDone`, `this` is the object the method was called on. Write the function for `forEach` as an arrow: it takes this `this` from `markDone`, and `this.doneCount` in its body points at the right field. A regular `function` would get `undefined`."
    solutionNote:
      uk: "Стрілка всередині методу бере `this` із `markDone`, а `markDone` отримує його від виклику — тож метод рахує на тому об’єкті, на якому його викликали. Якщо замість `this.doneCount` написати `board.doneCount`, код працюватиме лише для одного об’єкта."
      en: "The arrow inside the method takes `this` from `markDone`, and `markDone` gets it from the call — so the method counts on the object it was called on. If you write `board.doneCount` instead of `this.doneCount`, the code works for one object only."
    feedback:
      - when: { test: "the program counts three finished tasks" }
        message:
          uk: "Ця перевірка очікує, що після виклику внизу файла в консолі рівно один рядок — `3`. Якщо бачиш `NaN` чи `0`, перевір, у яке саме поле збільшується лічильник."
          en: "This check expects exactly one console line after the call at the bottom of the file — `3`. If you see `NaN` or `0`, check which field the counter is increased in."
      - when: { test: "markDone counts on whatever object it is called on" }
        message:
          uk: "Ця перевірка позичає `markDone` в іншого об’єкта з `doneCount: 10` і викликає `other.markDone([\"a\", \"b\"])`; очікує, що в `other.doneCount` стане 12. Метод має збільшувати `this.doneCount`, де `this` — об’єкт перед крапкою."
          en: "This check lends `markDone` to another object with `doneCount: 10` and calls `other.markDone([\"a\", \"b\"])`; it expects `other.doneCount` to become 12. The method must increase `this.doneCount`, where `this` is the object before the dot."
      - when: { test: "markDone leaves board alone when called on another object" }
        message:
          uk: "Ця перевірка очікує, що виклик на іншому об’єкті не змінить `board.doneCount`: у `board` лишається 3. Метод має рахувати на `this`, а не на змінній `board`."
          en: "This check expects a call on another object to leave `board.doneCount` alone: `board` keeps 3. The method must count on `this`, not on the variable `board`."
      - when: { test: "an empty list changes nothing" }
        message:
          uk: "Ця перевірка викликає `markDone([])` й очікує, що `doneCount` не зміниться."
          en: "This check calls `markDone([])` and expects `doneCount` not to change."
      - when: { error: TypeError }
        message:
          uk: "Повідомлення `Cannot read properties of undefined` часто означає, що `this` порожній. У функції, яку викликає `forEach` без об’єкта, `this` — `undefined`: перевір, яка форма функції стоїть усередині `markDone`. Якщо ж не проходить одразу кожна перевірка, програма, найімовірніше, зупинилася ще під час завантаження: спершу виправ першу помилку в консолі."
          en: "A message like `Cannot read properties of undefined` often means `this` is empty. In a function that `forEach` calls with no object, `this` is `undefined`: check which form of function stands inside `markDone`. If every check fails at once, the program most likely stopped while loading: fix the first error in the console first."

  - id: to-project
    kind: transfer
    capstoneStep: JS-11
    body:
      uk: "У проєкті обробники кнопок («Отримано», «Виконано», «Видалити») — це функції, які викликає браузер, а не ти: перед крапкою в тебе там нічого немає. У кроці проєкту ти загорнеш репозиторій у клас і перевіриш, що `this` у таких обробниках не губиться."
      en: "In your project the button handlers (“Acquired”, “Done”, “Delete”) are functions called by the browser, not by you: there is nothing before the dot on your side. In the project step you will wrap the repository in a class and check that `this` is not lost in such handlers."
