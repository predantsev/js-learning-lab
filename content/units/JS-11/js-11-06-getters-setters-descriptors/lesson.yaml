id: js-11-06-getters-setters-descriptors
unit: JS-11
title:
  uk: "Getters, setters і дескриптори властивостей (читання)"
  en: "Getters, setters and property descriptors (reading)"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Прочитати getter і setter в наявному коді й передбачити, коли кожен із них виконується."
    en: "Read a getter and a setter in existing code and predict when each one runs."
  - uk: "Прочитати дескриптор через `Object.getOwnPropertyDescriptor` і пояснити, що змінюють `writable`, `enumerable` та `configurable`."
    en: "Read a descriptor with `Object.getOwnPropertyDescriptor` and explain what `writable`, `enumerable` and `configurable` change."
prerequisites: [js-11-05-classes-private-static]
subskills:
  - { family: J-06, skill: "methods/getters/setters/property descriptors reading", depth: intro }
glossary: [getter, setter, property-descriptor]
selfCheck: [predict-accessors, predict-hidden, expense-display]

blocks:
  - id: property-with-code
    kind: explanation
    title:
      uk: "Властивість, що виконує код"
      en: "A property that runs code"
    body:
      uk: |
        Зазвичай читання `obj.name` просто бере збережене значення. Але властивість може **виконувати функцію** — для цього є [[getter|getter]] (`get`) і [[setter|setter]] (`set`):

        ```js
        class Cart {
          #prices = [];
          #limit = 100;
          get count() {                // runs when you READ cart.count
            return this.#prices.length;
          }
          set limit(value) {           // runs when you ASSIGN cart.limit = …
            if (value >= 0) {
              this.#limit = value;
            }
          }
        }
        const cart = new Cart();
        cart.count;        // no brackets: the getter runs
        cart.limit = 3;    // looks like a field, but the setter runs
        ```

        Ззовні вони виглядають як звичайні поля: читаєш `cart.count` без дужок, присвоюєш `cart.limit = 3`. Але всередині — функція, тому:

        - getter виконується **щоразу** при читанні: значення нічого не «запам’ятовує» й може бути іншим;
        - setter може перевірити значення й відмовитися його брати;
        - getter без setter — властивість **лише для читання**: присвоєння кидає `TypeError` (у модулях і класах — строгий режим).

        У класі getter і setter лежать на прототипі, як і методи.
      en: |
        Usually reading `obj.name` just takes the stored value. But a property can **run a function** — for that there are a [[getter|getter]] (`get`) and a [[setter|setter]] (`set`):

        ```js
        class Cart {
          #prices = [];
          #limit = 100;
          get count() {                // runs when you READ cart.count
            return this.#prices.length;
          }
          set limit(value) {           // runs when you ASSIGN cart.limit = …
            if (value >= 0) {
              this.#limit = value;
            }
          }
        }
        const cart = new Cart();
        cart.count;        // no brackets: the getter runs
        cart.limit = 3;    // looks like a field, but the setter runs
        ```

        From outside they look like ordinary fields: you read `cart.count` without brackets and assign `cart.limit = 3`. But inside there is a function, so:

        - a getter runs on **every** read: the value remembers nothing and may be different;
        - a setter may check the value and refuse to take it;
        - a getter without a setter is a **read-only** property: an assignment throws a `TypeError` (modules and classes are in strict mode).

        In a class the getter and the setter lie on the prototype, like methods.

  - id: predict-accessors
    kind: prediction
    prompt:
      uk: "Клас із getter `total`, який друкує повідомлення, і setter `price`, який відхиляє від’ємні значення. У якому порядку з’являться рядки в консолі?"
      en: "A class with a getter `total` that prints a message, and a setter `price` that rejects negative values. In what order do the lines appear in the console?"
    code: |
      class Item {
        #price = 10;

        get price() {
          return this.#price;
        }

        set price(value) {
          console.log("setting " + value);
          if (value < 0) {
            console.log("rejected");
            return;
          }
          this.#price = value;
        }

        get total() {
          console.log("reading total");
          return this.#price * 3;
        }
      }

      const item = new Item();
      console.log(item.total);
      console.log(item.total);
      item.price = -5;
      item.price = 7;
      console.log(item.price);
    verify:
      logs: ["reading total", "30", "reading total", "30", "setting -5", "rejected", "setting 7", "7"]
    answer:
      type: choice
      options:
        - id: runs-every-time
          code: "reading total\n30\nreading total\n30\nsetting -5\nrejected\nsetting 7\n7"
        - id: cached
          code: "reading total\n30\n30\nsetting -5\nrejected\nsetting 7\n7"
          why:
            uk: "Getter не кешує результат: це звичайна функція, і вона виконується при кожному читанні. Тому «reading total» з’являється двічі."
            en: "A getter does not cache its result: it is an ordinary function and runs on every read. That is why “reading total” appears twice."
        - id: plain-assignment
          code: "reading total\n30\nreading total\n30\n7"
          why:
            uk: "Присвоєння `item.price = …` не просто записує значення: коли для `price` є setter, воно викликає його — звідси «setting …» і «rejected»."
            en: "The assignment `item.price = …` does not just store a value: when `price` has a setter, it calls it — hence “setting …” and “rejected”."
        - id: throws
          code: "reading total\n30\nreading total\n30\nTypeError"
          why:
            uk: "Присвоєння кидало б `TypeError`, лише якби в `price` був getter **без** setter. Тут setter є, і він сам вирішує, чи брати значення."
            en: "The assignment would throw a `TypeError` only if `price` had a getter **without** a setter. Here a setter exists, and it decides for itself whether to take the value."
      correct: [runs-every-time]
    explanation:
      uk: "Кожне читання `item.total` запускає getter, тому «reading total» друкується двічі. Присвоєння `-5` запускає setter: він друкує «setting -5» і «rejected» та нічого не змінює. `7` setter приймає, і останній `console.log(item.price)` читає 7 через getter `price`."
      en: "Every read of `item.total` runs the getter, so “reading total” is printed twice. Assigning `-5` runs the setter: it prints “setting -5” and “rejected” and changes nothing. The setter accepts `7`, and the last `console.log(item.price)` reads 7 through the getter `price`."

  - id: descriptors
    kind: explanation
    title:
      uk: "Дескриптор: паспорт властивості"
      en: "A descriptor: a property’s passport"
    body:
      uk: |
        Кожна властивість має [[property-descriptor|дескриптор]] — набір прапорців. Прочитати його можна так:

        ```js
        const task = { id: "t-01", title: "Water the plants" };
        Object.getOwnPropertyDescriptor(task, "title");
        // { value: "Water the plants", writable: true, enumerable: true, configurable: true }
        ```

        - `writable` — чи можна змінити значення (`false` → присвоєння кидає `TypeError`);
        - `enumerable` — чи бачать властивість `Object.keys`, цикл `for…in`, spread і `JSON.stringify`;
        - `configurable` — чи можна властивість видалити або перевизначити.

        Властивість-аксесор замість `value` і `writable` має `get` і `set` (`undefined`, якщо їх немає). Методи, getter і setter класу мають `enumerable: false` і лежать на прототипі — тому їх немає в `Object.keys` і в JSON.

        Властивість, якої не видно в `Object.keys`, **існує**: `enumerable: false` лише ховає її зі списків. Читання й оператор `in` її бачать. Прапорець можна змінити через `Object.defineProperty(obj, "name", { enumerable: false })` — зараз ми це використаємо лише для досліду.

        Зверни увагу: `JSON.stringify` дескриптора-аксесора пропустить `get` і `set` (функції в JSON не потрапляють), тому тип getter перевіряй через `typeof descriptor.get`.
      en: |
        Every property has a [[property-descriptor|descriptor]] — a set of flags. You can read it like this:

        ```js
        const task = { id: "t-01", title: "Water the plants" };
        Object.getOwnPropertyDescriptor(task, "title");
        // { value: "Water the plants", writable: true, enumerable: true, configurable: true }
        ```

        - `writable` — whether the value can be changed (`false` → an assignment throws a `TypeError`);
        - `enumerable` — whether `Object.keys`, the `for…in` loop, spread and `JSON.stringify` see the property;
        - `configurable` — whether the property can be deleted or redefined.

        An accessor property has `get` and `set` instead of `value` and `writable` (`undefined` when missing). Methods, getters and setters of a class have `enumerable: false` and lie on the prototype — that is why they are missing from `Object.keys` and from JSON.

        A property that does not show in `Object.keys` **exists**: `enumerable: false` only hides it from lists. Reading and the `in` operator see it. The flag can be changed with `Object.defineProperty(obj, "name", { enumerable: false })` — we use it now only for an experiment.

        Note that `JSON.stringify` of an accessor descriptor skips `get` and `set` (functions do not get into JSON), so check the type of a getter with `typeof descriptor.get`.

  - id: predict-hidden
    kind: prediction
    prompt:
      uk: "Властивість `secret` зробили неперелічуваною. Що з’явиться в консолі?"
      en: "The property `secret` was made non-enumerable. What appears in the console?"
    code: |
      const task = { id: "t-01", secret: "x" };
      Object.defineProperty(task, "secret", { enumerable: false });

      console.log(Object.keys(task).join());
      console.log(JSON.stringify(task));
      console.log(task.secret);
      console.log("secret" in task);
    verify:
      logs: ["id", "{\"id\":\"t-01\"}", "x", "true"]
    answer:
      type: choice
      options:
        - id: hidden-exists
          code: "id\n{\"id\":\"t-01\"}\nx\ntrue"
        - id: deleted
          code: "id\n{\"id\":\"t-01\"}\nundefined\nfalse"
          why:
            uk: "`enumerable: false` не видаляє властивість, а лише ховає її зі списків. Значення на місці: `task.secret` читається, а `\"secret\" in task` — `true`."
            en: "`enumerable: false` does not delete the property, it only hides it from lists. The value is in place: `task.secret` can be read and `\"secret\" in task` is `true`."
        - id: json-keeps
          code: "id\n{\"id\":\"t-01\",\"secret\":\"x\"}\nx\ntrue"
          why:
            uk: "`JSON.stringify` бере лише перелічувані власні властивості, тож `secret` до JSON не потрапляє."
            en: "`JSON.stringify` takes only own enumerable properties, so `secret` does not get into the JSON."
        - id: keys-keep
          code: "id,secret\n{\"id\":\"t-01\"}\nx\ntrue"
          why:
            uk: "`Object.keys` повертає саме перелічувані власні назви, тож `secret` серед них немає."
            en: "`Object.keys` returns exactly the own enumerable names, so `secret` is not among them."
      correct: [hidden-exists]
    explanation:
      uk: "Прапорець `enumerable: false` прибирає `secret` з `Object.keys` і з JSON, але властивість лишається: читання повертає `\"x\"`, а `in` каже `true`. «Не видно в списку» — не те саме, що «не існує»."
      en: "The flag `enumerable: false` removes `secret` from `Object.keys` and from JSON, but the property stays: reading returns `\"x\"` and `in` says `true`. “Not visible in a list” is not the same as “does not exist”."

  - id: descriptors-lab
    kind: example
    runtime: browser-js
    dir: descriptors
    entry: index.js
    strings:
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
    title:
      uk: "Дескриптори поля й getter-а"
      en: "Descriptors of a field and a getter"
    body:
      uk: |
        Клас `Wish` із getter `isPriced`. Натисни **Запустити** й порівняй дескриптор звичайного поля `name` (на самому об’єкті) із дескриптором getter-а (на прототипі).
      en: |
        A class `Wish` with a getter `isPriced`. Press **Run** and compare the descriptor of the ordinary field `name` (on the object itself) with the descriptor of the getter (on the prototype).
    tryIt:
      uk: |
        1. Консоль: `true true`; `function undefined false` (getter є, setter немає, на перелік не впливає); `false`; `name,price`; JSON без `isPriced`.
        2. Наприкінці файла додай `wish.price = 30;` і `console.log(wish.isPriced);`. Тепер `true`: getter виконується щоразу й бачить нову ціну.
        3. Додай `Object.defineProperty(wish, "price", { enumerable: false });`, а після нього `console.log(Object.keys(wish).join());`, `console.log(JSON.stringify(wish));` і `console.log(wish.price);`. `price` зникла зі списку й з JSON, але читається: `30`.
        4. Додай `wish.isPriced = true;`: програма падає з `TypeError` — getter без setter не приймає значень. Видали цей рядок.
      en: |
        1. Console: `true true`; `function undefined false` (a getter exists, no setter, not enumerable); `false`; `name,price`; JSON without `isPriced`.
        2. At the end of the file add `wish.price = 30;` and `console.log(wish.isPriced);`. Now `true`: the getter runs every time and sees the new price.
        3. Add `Object.defineProperty(wish, "price", { enumerable: false });`, and after it `console.log(Object.keys(wish).join());`, `console.log(JSON.stringify(wish));` and `console.log(wish.price);`. `price` disappeared from the list and from JSON, but it can be read: `30`.
        4. Add `wish.isPriced = true;`: the program crashes with a `TypeError` — a getter without a setter accepts no values. Remove this line.

  - id: recall
    kind: review
    title:
      uk: "Згадай: що лишає JSON.stringify"
      en: "Recall: what JSON.stringify keeps"
    items:
      - id: json-keeps
        from: js-07-04-json
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          const habit = {
            id: "h-01",
            note: undefined,
            check() {
              return true;
            },
            days: ["2026-03-01"],
          };
          console.log(JSON.stringify(habit));
        verify:
          logs: ["{\"id\":\"h-01\",\"days\":[\"2026-03-01\"]}"]
        answer:
          type: choice
          options:
            - id: skips-both
              code: "{\"id\":\"h-01\",\"days\":[\"2026-03-01\"]}"
            - id: all-fields
              code: "{\"id\":\"h-01\",\"note\":null,\"check\":null,\"days\":[\"2026-03-01\"]}"
              why:
                uk: "У JSON немає ні `undefined`, ні функцій: `JSON.stringify` просто пропускає такі поля в об’єкті."
                en: "JSON has neither `undefined` nor functions: `JSON.stringify` simply skips such fields in an object."
            - id: error
              code: "TypeError"
              why:
                uk: "Функція в полі не заважає: `JSON.stringify` мовчки пропускає її, а не кидає помилку."
                en: "A function in a field does not get in the way: `JSON.stringify` skips it silently instead of throwing an error."
          correct: [skips-both]
        explanation:
          uk: "`JSON.stringify` пропускає поля зі значенням `undefined` і функції. Те саме стосується й методів та getter-ів класу, що лежать на прототипі: їх у JSON не буде, бо це не власні перелічувані дані об’єкта."
          en: "`JSON.stringify` skips fields whose value is `undefined` and functions. The same applies to the methods and getters of a class that lie on the prototype: they will not be in JSON, because they are not the object’s own enumerable data."

  - id: expense-display
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: expense-display
    entry: index.js
    strings:
      lunch: { uk: "Обід", en: "Lunch" }
    title:
      uk: "Читабельний текст витрати"
      en: "A readable line for an expense"
    instructions:
      uk: |
        У класі `Expense` витрата зберігає `label` і `amountMinor` — суму в найменших одиницях (копійках). Додай getter `display`, лише для читання:

        - він повертає назву, двокрапку з пробілом і суму в основних одиницях із двома знаками після коми — наприклад, `Обід: 210.50` для 21050 (`amountMinor / 100`, а два знаки дає `toFixed(2)`);
        - значення **обчислюється щоразу** з поточних `label` та `amountMinor`, а не зберігається в екземплярі: коли сума зміниться, `display` зміниться разом із нею;
        - setter не потрібен: присвоєння `expense.display = …` має кидати `TypeError`.

        Перевірка прочитає дескриптор `display` на `Expense.prototype`: там має бути getter і не має бути setter. Унизу файла готовий код: у консолі `Обід: 210.50`, `Обід: 250.00` і `label,amountMinor`.
      en: |
        In the class `Expense` an expense stores `label` and `amountMinor` — the amount in the smallest units (kopiykas). Add a read-only getter `display`:

        - it returns the label, a colon with a space and the amount in major units with two decimals — for example `Lunch: 210.50` for 21050 (`amountMinor / 100`, and `toFixed(2)` gives two decimals);
        - the value is **computed on every read** from the current `label` and `amountMinor`, not stored in the instance: when the amount changes, `display` changes with it;
        - no setter is needed: an assignment `expense.display = …` must throw a `TypeError`.

        The check reads the descriptor of `display` on `Expense.prototype`: there must be a getter and no setter. At the bottom of the file there is ready code: the console shows `Lunch: 210.50`, `Lunch: 250.00` and `label,amountMinor`.
    testTitles:
      "the program prints both displays and the own fields":
        uk: "Програма друкує обидва рядки й власні поля"
        en: "The program prints both displays and the own fields"
      "display shows the current amount":
        uk: "display показує поточну суму"
        en: "display shows the current amount"
      "display is a getter without a setter on the prototype":
        uk: "display — getter без setter на прототипі"
        en: "display is a getter without a setter on the prototype"
      "display is not stored in the instance":
        uk: "display не зберігається в екземплярі"
        en: "display is not stored in the instance"
      "assigning to display is refused":
        uk: "Присвоєння display відхиляється"
        en: "Assigning to display is refused"
    hints:
      nudge:
        uk: "Чим у записі класу відрізняється getter від звичайного методу — і чим getter відрізняється від поля, у яке значення записали в конструкторі?"
        en: "How does a getter differ from an ordinary method in the notation of a class — and how does it differ from a field that was filled in the constructor?"
      explanation:
        uk: "Перед назвою в тілі класу пиши слово `get`: тоді код у фігурних дужках виконується щоразу, коли хтось читає цю властивість, і викликати її з дужками не треба. Збирай результат із `this.label` та `this.amountMinor` усередину самого getter-а. Setter не оголошуй: без нього присвоєння в строгому режимі кидає `TypeError`."
        en: "Write the word `get` before the name in the body of the class: then the code in the braces runs whenever someone reads this property, and you do not call it with brackets. Build the result from `this.label` and `this.amountMinor` inside the getter itself. Do not declare a setter: without one an assignment in strict mode throws a `TypeError`."
    solutionNote:
      uk: "Getter на прототипі обчислює рядок із поточних полів, тому нічого не застаріває й `display` не потрапляє в `Object.keys`. Оскільки setter немає, присвоєння кидає `TypeError`: властивість лише для читання."
      en: "A getter on the prototype computes the line from the current fields, so nothing goes stale and `display` does not get into `Object.keys`. Since there is no setter, an assignment throws a `TypeError`: the property is read-only."
    feedback:
      - when: { test: "the program prints both displays and the own fields" }
        message:
          uk: "Ця перевірка очікує три рядки консолі: назва, двокрапка, пробіл і сума з двома знаками (`… 210.50`), те саме після зміни суми (`… 250.00`) і `label,amountMinor` — власні поля без `display`."
          en: "This check expects three console lines: the label, a colon, a space and the amount with two decimals (`… 210.50`), the same after the amount changed (`… 250.00`) and `label,amountMinor` — the own fields without `display`."
      - when: { test: "display shows the current amount" }
        message:
          uk: "Ця перевірка створює витрату на 5 одиниць і очікує, що `display` дасть `назва: 0.05`, а після зміни `amountMinor` на 12345 — `назва: 123.45`. Прочитане значення має відображати поточну суму."
          en: "This check creates an expense of 5 units and expects `display` to give `label: 0.05`, and `label: 123.45` after `amountMinor` changes to 12345. The value read must reflect the current amount."
      - when: { test: "display is a getter without a setter on the prototype" }
        message:
          uk: "Ця перевірка читає `Object.getOwnPropertyDescriptor(Expense.prototype, \"display\")` і очікує там функцію `get` та жодного `set`. Для цього в тілі класу пишуть `get display() { … }`."
          en: "This check reads `Object.getOwnPropertyDescriptor(Expense.prototype, \"display\")` and expects a `get` function and no `set` there. For that, `get display() { … }` is written in the body of the class."
      - when: { test: "display is not stored in the instance" }
        message:
          uk: "Ця перевірка очікує, що власні назви витрати — лише `label` і `amountMinor`, а `display` власною властивістю екземпляра не є."
          en: "This check expects the own names of an expense to be only `label` and `amountMinor`, and `display` not to be an own property of the instance."
      - when: { test: "assigning to display is refused" }
        message:
          uk: "Ця перевірка присвоює `expense.display = \"x\"` і очікує `TypeError`, а `label` має лишитися без змін. Властивість лише для читання не має setter."
          en: "This check assigns `expense.display = \"x\"` and expects a `TypeError`, with `label` left unchanged. A read-only property has no setter."

  - id: to-project
    kind: transfer
    capstoneStep: JS-11
    body:
      uk: "Getter зручний для похідних значень у репозиторії: `get totalWantedPrice` чи `get pendingCount` не потрібно зберігати окремо, і вони не застаріють. Пам’ятай лише, що getter не потрапляє в `JSON.stringify`, тож у `localStorage` зберігай самі дані, а похідне обчислюй наново."
      en: "A getter is handy for derived values in a repository: a `get totalWantedPrice` or `get pendingCount` does not need to be stored separately, and it cannot go stale. Just remember that a getter does not get into `JSON.stringify`, so store only the data in `localStorage` and compute the derived value again."
