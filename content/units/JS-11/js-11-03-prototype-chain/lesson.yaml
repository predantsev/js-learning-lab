id: js-11-03-prototype-chain
unit: JS-11
title:
  uk: "Ланцюжок прототипів"
  en: "The prototype chain"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Простежити читання властивості вздовж ланцюжка прототипів і назвати об’єкт, на якому пошук зупиняється, або дійти до `null`."
    en: "Trace a property read along the prototype chain and name the object where the lookup stops, or reach `null`."
  - uk: "Відрізнити власну властивість від успадкованої через `Object.hasOwn` та оператор `in`."
    en: "Tell an own property from an inherited one with `Object.hasOwn` and the `in` operator."
  - uk: "Пояснити, чому присвоєння успадкованій назві створює власну властивість, а не змінює прототип."
    en: "Explain why assigning to an inherited name creates an own property instead of changing the prototype."
prerequisites: [js-11-02-call-apply-bind, js-04-05-objects-properties]
subskills:
  - { family: J-06, skill: "prototype chain and own properties", depth: intro }
glossary: [prototype, prototype-chain, property-shadowing]
selfCheck: [predict-lookups, predict-assign, where-from]

blocks:
  - id: hidden-link
    kind: explanation
    title:
      uk: "Де насправді живуть методи"
      en: "Where methods really live"
    body:
      uk: |
        Пам’ятаєш приховане посилання `[[Prototype]]`, через яке будь-який об’єкт знаходить `toString`? Воно веде до іншого об’єкта — [[prototype|прототипа]]. Коли властивості немає в самому об’єкті, JavaScript шукає її в прототипі. Створити об’єкт із потрібним прототипом можна через `Object.create(proto)`:

        ```js
        const proto = {
          describe() {
            return "Item: " + this.name;
          },
        };
        const task = Object.create(proto);
        task.name = "Water the plants";
        task.describe(); // "Item: Water the plants"
        ```

        `describe` лежить **в одному місці** — у `proto`. Об’єкт `task` свого `describe` не має, і ніхто його не копіював. А `this` — це, як і раніше, те, що стоїть перед крапкою: `task`, хоч сам метод знайдено в прототипі.

        Читання властивості — це пошук уздовж [[prototype-chain|ланцюжка прототипів]]: спершу сам об’єкт, потім його прототип, потім прототип прототипа… Ланцюжок завершує `Object.prototype` (там живе `toString`), а за ним — `null`: далі шукати ніде, і результат — `undefined`.

        Власну властивість від [[inherited-property|успадкованої]] відрізняють так: `Object.hasOwn(task, "describe")` дивиться лише на сам об’єкт (`false`), а `"describe" in task` — на весь ланцюжок (`true`).
      en: |
        Remember the hidden link `[[Prototype]]` through which every object finds `toString`? It leads to another object — the [[prototype|prototype]]. When a property is not in the object itself, JavaScript looks for it in the prototype. You can create an object with the prototype you want using `Object.create(proto)`:

        ```js
        const proto = {
          describe() {
            return "Item: " + this.name;
          },
        };
        const task = Object.create(proto);
        task.name = "Water the plants";
        task.describe(); // "Item: Water the plants"
        ```

        `describe` lives **in one place** — in `proto`. The object `task` has no `describe` of its own, and nobody copied it. And `this` is, as before, whatever stands before the dot: `task`, even though the method was found in the prototype.

        Reading a property is a search along the [[prototype-chain|prototype chain]]: the object itself first, then its prototype, then the prototype of the prototype… The chain ends at `Object.prototype` (where `toString` lives), and after it comes `null`: there is nowhere left to look, and the result is `undefined`.

        An own property is told from an [[inherited-property|inherited]] one like this: `Object.hasOwn(task, "describe")` looks only at the object itself (`false`), while `"describe" in task` looks along the whole chain (`true`).

  - id: predict-lookups
    kind: prediction
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    prompt:
      uk: "Об’єкт `item` створено з прототипом `proto`. Що з’явиться в консолі?"
      en: "The object `item` is created with the prototype `proto`. What appears in the console?"
    code: |
      const proto = {
        describe() {
          return "Item: " + this.name;
        },
      };
      const item = Object.create(proto);
      item.name = "%%lamp%%";

      console.log(item.describe());
      console.log(Object.hasOwn(item, "describe"));
      console.log("describe" in item);
      console.log(typeof item.toString);
    verify:
      logs: ["Item: %%lamp%%", "false", "true", "function"]
    answer:
      type: choice
      options:
        - id: chain
          code: "Item: %%lamp%%\nfalse\ntrue\nfunction"
        - id: own-copy
          code: "Item: %%lamp%%\ntrue\ntrue\nfunction"
          why:
            uk: "`item` не носить власної копії `describe`: метод лежить лише в `proto`, а `item` знаходить його через прихований зв’язок. Тому `Object.hasOwn(item, \"describe\")` — `false`."
            en: "`item` carries no copy of `describe` of its own: the method lives only in `proto`, and `item` finds it through the hidden link. So `Object.hasOwn(item, \"describe\")` is `false`."
        - id: in-own-only
          code: "Item: %%lamp%%\nfalse\nfalse\nfunction"
          why:
            uk: "Оператор `in` шукає не лише в самому об’єкті, а й по всьому ланцюжку прототипів, тож `\"describe\" in item` — `true`."
            en: "The `in` operator looks not only in the object itself but along the whole prototype chain, so `\"describe\" in item` is `true`."
        - id: no-tostring
          code: "Item: %%lamp%%\nfalse\ntrue\nundefined"
          why:
            uk: "`toString` є в кінці ланцюжка, в `Object.prototype`, а ланцюжок `item` туди доходить: `item` → `proto` → `Object.prototype`."
            en: "`toString` is at the end of the chain, in `Object.prototype`, and the chain of `item` reaches it: `item` → `proto` → `Object.prototype`."
      correct: [chain]
    explanation:
      uk: "`item.describe` не знайдено в `item`, тому пошук іде до `proto` — там метод і запускається, з `this` = `item`. `hasOwn` дивиться тільки на сам `item` (`false`), `in` — на весь ланцюжок (`true`). Для `toString` пошук проходить `item` → `proto` → `Object.prototype` і знаходить функцію."
      en: "`item.describe` is not found in `item`, so the search goes on to `proto` — the method is found and runs there, with `this` = `item`. `hasOwn` looks only at `item` itself (`false`), `in` at the whole chain (`true`). For `toString` the search passes `item` → `proto` → `Object.prototype` and finds a function."

  - id: chain-diagram
    kind: visual
    visual: diagram
    title:
      uk: "Пошук уздовж ланцюжка"
      en: "A search along the chain"
    textEquivalent:
      uk: "Чотири об’єкти стоять у ряд, і кожен веде до наступного через посилання [[Prototype]]: item з власною властивістю name, proto з методом describe, Object.prototype із вбудованою toString і наприкінці null. Пошук item.describe починається в item: там є лише name, тож пошук іде за посиланням до proto, де describe знайдено, і на цьому він зупиняється. Пошук item.toString проходить item і proto, нічого не знаходить і доходить до Object.prototype, де toString є. Пошук item.color проходить усі три об’єкти й упирається в null: далі шукати ніде, тож результат undefined."
      en: "Four objects stand in a row, and each leads to the next through a [[Prototype]] link: item with its own property name, proto with the method describe, Object.prototype with the built-in toString, and finally null. The search item.describe starts in item: it has only name, so the search follows the link to proto, where describe is found, and it stops there. The search item.toString passes item and proto, finds nothing and reaches Object.prototype, where toString exists. The search item.color passes all three objects and hits null: there is nowhere left to look, so the result is undefined."
    spec:
      layout: tb
      nodes:
        - { id: item, label: "item: name", w: 190 }
        - { id: proto, label: "proto: describe", w: 190 }
        - { id: op, label: "Object.prototype: toString", w: 190 }
        - { id: nul, label: "null", shape: pill, w: 190 }
      edges:
        - { id: item->proto, from: item, to: proto, label: "[[Prototype]]" }
        - { id: proto->op, from: proto, to: op, label: "[[Prototype]]" }
        - { id: op->nul, from: op, to: nul, label: "[[Prototype]]" }
      steps:
        - caption:
            uk: "Чотири ланки ланцюжка. Кожен об’єкт веде до наступного через приховане посилання `[[Prototype]]`; ланцюжок завершується на `null`."
            en: "Four links of the chain. Each object leads to the next through the hidden `[[Prototype]]` link; the chain ends at `null`."
        - caption:
            uk: "`item.describe`: пошук починається в самому `item`. Там лише `name` — `describe` немає."
            en: "`item.describe`: the search starts in `item` itself. It has only `name` — no `describe`."
          highlight: [item]
          dim: [proto, op, nul]
        - caption:
            uk: "Пошук іде за посиланням до `proto`: `describe` **знайдено**, і пошук зупиняється. Далі по ланцюжку дивитись уже не треба."
            en: "The search follows the link to `proto`: `describe` is **found**, and the search stops. There is no need to look further along the chain."
          highlight: [item->proto, proto]
          dim: [item, op, nul]
        - caption:
            uk: "`item.toString`: ні в `item`, ні в `proto` його немає, тож пошук іде далі по ланцюжку."
            en: "`item.toString`: it is neither in `item` nor in `proto`, so the search goes further along the chain."
          highlight: [item, proto, item->proto, proto->op]
          dim: [op, nul]
        - caption:
            uk: "Дійшли до `Object.prototype`: `toString` **знайдено**. Тому кожен звичайний об’єкт має цей метод."
            en: "The search reaches `Object.prototype`: `toString` is **found**. That is why every ordinary object has this method."
          highlight: [op, proto->op]
          dim: [item, proto, nul]
        - caption:
            uk: "`item.color`: пошук проходить усі три об’єкти й доходить до `null`. Ланцюжок скінчився — результат `undefined`, а не помилка."
            en: "`item.color`: the search passes all three objects and reaches `null`. The chain is over — the result is `undefined`, not an error."
          highlight: [item, proto, op, nul, item->proto, proto->op, op->nul]

  - id: writes-go-home
    kind: explanation
    title:
      uk: "Запис іде в сам об’єкт"
      en: "Writes go to the object itself"
    body:
      uk: |
        Читання шукає вздовж ланцюжка, а **запис** — ні. Присвоєння `item.kind = "custom"` завжди створює (або змінює) **власну** властивість `item`, навіть якщо така назва є в прототипі. Прототип лишається недоторканим. Власна властивість при цьому затуляє успадковану з тією самою назвою — це [[property-shadowing|затінення]].

        ```js
        const proto = { kind: "base" };
        const task = Object.create(proto);
        task.kind = "custom";   // an own property is created on task
        task.kind;              // "custom"
        proto.kind;             // "base" — untouched
        delete task.kind;       // remove the own property
        task.kind;              // "base" — the inherited one shows again
        ```

        Є одне застереження. Присвоєння змінює саме посилання в **власній** властивості. Якщо успадкована властивість веде до **масиву чи об’єкта**, то `task.list.push(…)` шукає `list` по ланцюжку, знаходить спільний масив у прототипі й змінює його — для всіх, хто його успадковує. Це пастка, до якої ми повернемося.
      en: |
        Reading searches along the chain, but **writing** does not. The assignment `item.kind = "custom"` always creates (or changes) an **own** property of `item`, even if the prototype has the same name. The prototype stays untouched. The own property hides the inherited one with the same name — this is [[property-shadowing|shadowing]].

        ```js
        const proto = { kind: "base" };
        const task = Object.create(proto);
        task.kind = "custom";   // an own property is created on task
        task.kind;              // "custom"
        proto.kind;             // "base" — untouched
        delete task.kind;       // remove the own property
        task.kind;              // "base" — the inherited one shows again
        ```

        There is one caveat. An assignment changes the reference in an **own** property. If the inherited property leads to an **array or object**, then `task.list.push(…)` looks `list` up along the chain, finds the shared array in the prototype and changes it — for everyone who inherits it. That is a trap we will come back to.

  - id: predict-assign
    kind: prediction
    prompt:
      uk: "Два об’єкти мають спільний прототип. Що з’явиться в консолі?"
      en: "Two objects share a prototype. What appears in the console?"
    code: |
      const proto = { kind: "base" };
      const first = Object.create(proto);
      const second = Object.create(proto);

      first.kind = "custom";

      console.log(first.kind);
      console.log(second.kind);
      console.log(proto.kind);
      console.log(Object.hasOwn(second, "kind"));
    verify:
      logs: ["custom", "base", "base", "false"]
    answer:
      type: choice
      options:
        - id: shadow
          code: "custom\nbase\nbase\nfalse"
        - id: changes-proto
          code: "custom\ncustom\ncustom\nfalse"
          why:
            uk: "Присвоєння не йде в прототип: воно створює власну властивість `kind` у `first`. `proto` і `second` її не бачать."
            en: "The assignment does not go to the prototype: it creates an own property `kind` in `first`. `proto` and `second` do not see it."
        - id: copies-to-all
          code: "custom\ncustom\nbase\ntrue"
          why:
            uk: "`second` власної `kind` не отримав: запис змінив лише `first`. Тому `second.kind` і далі береться з прототипа."
            en: "`second` got no `kind` of its own: the write changed only `first`. So `second.kind` is still taken from the prototype."
        - id: own-first-only
          code: "custom\nbase\nbase\ntrue"
          why:
            uk: "`Object.hasOwn(second, \"kind\")` — `false`: власної властивості `kind` у `second` немає, він лише успадковує її від `proto`."
            en: "`Object.hasOwn(second, \"kind\")` is `false`: `second` has no own property `kind`, it only inherits it from `proto`."
      correct: [shadow]
    explanation:
      uk: "`first.kind = \"custom\"` створює власну властивість у `first` й затінює успадковану. `proto` не змінюється, а `second` і далі читає `kind` з прототипа — власної в нього немає."
      en: "`first.kind = \"custom\"` creates an own property in `first` and shadows the inherited one. `proto` does not change, and `second` still reads `kind` from the prototype — it has no own one."

  - id: lookups
    kind: example
    runtime: browser-js
    dir: lookups
    entry: index.js
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    title:
      uk: "Пошук, затінення й delete"
      en: "Lookups, shadowing and delete"
    body:
      uk: |
        Об’єкт `item` і його прототип `proto`. Натисни **Запустити** й скажи для кожного рядка консолі, де саме був знайдений результат: у `item` чи в `proto`.
      en: |
        An object `item` and its prototype `proto`. Press **Run** and for each console line say where exactly the result was found: in `item` or in `proto`.
    tryIt:
      uk: |
        1. Консоль: `base: Настільна лампа` (чи `Desk lamp`), `false`, `true`, `true` і `undefined` для неіснуючої `color`.
        2. Наприкінці файла додай `item.describe = function () { return "own version"; };`, потім `console.log(item.describe());`, `console.log(Object.hasOwn(item, "describe"));` і `console.log(proto.describe === item.describe);`. Тепер `item` має власний `describe`, що затінює метод прототипа: `own version`, `true`, `false`.
        3. Додай ще `delete item.describe;` і `console.log(item.describe());` — повернувся метод прототипа: `base: …`.
      en: |
        1. Console: `base: Desk lamp` (or its Ukrainian version), `false`, `true`, `true` and `undefined` for the nonexistent `color`.
        2. At the end of the file add `item.describe = function () { return "own version"; };`, then `console.log(item.describe());`, `console.log(Object.hasOwn(item, "describe"));` and `console.log(proto.describe === item.describe);`. Now `item` has its own `describe` that shadows the prototype’s method: `own version`, `true`, `false`.
        3. Add `delete item.describe;` and `console.log(item.describe());` — the prototype’s method is back: `base: …`.

  - id: recall
    kind: review
    title:
      uk: "Згадай: кому належить властивість"
      en: "Recall: who owns a property"
    items:
      - id: own-or-reachable
        from: js-04-05-objects-properties
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          const wish = { id: "w-01", price: 80 };
          console.log(Object.hasOwn(wish, "price"));
          console.log("toString" in wish);
          console.log(Object.hasOwn(wish, "toString"));
        verify:
          logs: ["true", "true", "false"]
        answer:
          type: choice
          options:
            - id: own-and-inherited
              code: "true\ntrue\nfalse"
            - id: all-true
              code: "true\ntrue\ntrue"
              why:
                uk: "`toString` не лежить у самому `wish`: його об’єкт отримує через приховане посилання на `Object.prototype`. `Object.hasOwn` рахує лише власні властивості."
                en: "`toString` does not lie in `wish` itself: the object gets it through the hidden link to `Object.prototype`. `Object.hasOwn` counts only own properties."
            - id: in-own-only
              code: "true\nfalse\nfalse"
              why:
                uk: "Оператор `in` бачить і успадковані властивості, тож `\"toString\" in wish` — `true`."
                en: "The `in` operator sees inherited properties too, so `\"toString\" in wish` is `true`."
          correct: [own-and-inherited]
        explanation:
          uk: "`price` — власна, тому `hasOwn` каже `true`. `toString` об’єкт не має сам, але отримує з `Object.prototype`: `in` каже `true`, а `hasOwn` — `false`. Тепер ти знаєш, що за цим стоїть: ланцюжок прототипів."
          en: "`price` is own, so `hasOwn` says `true`. The object has no `toString` of its own but gets it from `Object.prototype`: `in` says `true`, while `hasOwn` says `false`. Now you know what stands behind it: the prototype chain."

  - id: where-from
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: where-from
    entry: index.js
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    title:
      uk: "Звідки взялася властивість?"
      en: "Where did the property come from?"
    instructions:
      uk: |
        Запис бажання створено через `Object.create(wishDefaults)`: частину полів він має сам, а решту успадковує. Напиши дві функції:

        - `originOf(record, name)` повертає текст `"own"`, якщо властивість є в самому записі, `"inherited"`, якщо її видно лише через ланцюжок прототипів, і `"missing"` — якщо її немає ніде. Власна властивість зі значенням `undefined` усе одно власна.
        - `inheritedNames(record)` повертає масив назв **перелічуваних** властивостей, які запис отримує лише від прототипів, у порядку, у якому їх обходить цикл `for…in`. Затінена властивість успадкованою не рахується.

        Записи функції не змінюють. Унизу файла готовий виклик: у консолі має з’явитися `own`, `own`, `inherited`, `inherited`, `missing` і `category`.
      en: |
        A wish record is created with `Object.create(wishDefaults)`: it has some fields itself and inherits the rest. Write two functions:

        - `originOf(record, name)` returns the text `"own"` if the property is in the record itself, `"inherited"` if it is visible only through the prototype chain, and `"missing"` if it is nowhere. An own property whose value is `undefined` is still own.
        - `inheritedNames(record)` returns an array of the names of **enumerable** properties the record gets only from its prototypes, in the order a `for…in` loop walks them. A shadowed property does not count as inherited.

        The functions do not change the record. At the bottom of the file there is a ready call: the console must show `own`, `own`, `inherited`, `inherited`, `missing` and `category`.
    testTitles:
      "the program prints the origin of every property":
        uk: "Програма виводить походження кожної властивості"
        en: "The program prints the origin of every property"
      "originOf says own for a property the record has itself":
        uk: "originOf каже own для властивості, що є в самому записі"
        en: "originOf says own for a property the record has itself"
      "originOf says own even when the value is undefined":
        uk: "originOf каже own, навіть коли значення undefined"
        en: "originOf says own even when the value is undefined"
      "originOf says inherited for what comes from a prototype":
        uk: "originOf каже inherited для того, що прийшло від прототипа"
        en: "originOf says inherited for what comes from a prototype"
      "originOf says missing for a name nowhere in the chain":
        uk: "originOf каже missing для назви, якої немає в ланцюжку"
        en: "originOf says missing for a name nowhere in the chain"
      "inheritedNames lists only enumerable inherited names":
        uk: "inheritedNames перелічує лише успадковані перелічувані назви"
        en: "inheritedNames lists only enumerable inherited names"
      "the functions do not change the record":
        uk: "Функції не змінюють запис"
        en: "The functions do not change the record"
    hints:
      nudge:
        uk: "`Object.hasOwn` відповідає на одне запитання, а `in` — на інше. Яка комбінація їхніх відповідей відрізняє «власну» від «успадкованої» й від «немає»?"
        en: "`Object.hasOwn` answers one question and `in` answers another. Which combination of their answers tells “own” from “inherited” and from “missing”?"
      explanation:
        uk: "У `originOf` спершу спитай, чи властивість власна; якщо ні — чи вона видна взагалі; і лише тоді «немає». Не порівнюй значення з `undefined`: власна властивість може його містити. Цикл `for…in` обходить і власні, і успадковані перелічувані назви; для `inheritedNames` пропускай ті, що є в самому записі, — так само, як ти відфільтровував би непотрібне з будь-якого списку."
        en: "In `originOf` first ask whether the property is own; if not, whether it is visible at all; and only then “missing”. Do not compare the value with `undefined`: an own property may hold it. A `for…in` loop walks both own and inherited enumerable names; in `inheritedNames` skip the ones that are in the record itself — as you would filter out the unwanted ones from any list."
    solutionNote:
      uk: "`Object.hasOwn` ловить лише власні властивості, `in` — усі, що видно через ланцюжок. Порядок питань і дає три відповіді. `for…in` бачить і успадковані назви, тож відфільтрований за `hasOwn` обхід залишає тільки їх; затінена назва в обході одна й вважається власною."
      en: "`Object.hasOwn` catches only own properties, `in` catches all visible through the chain. The order of the questions gives the three answers. `for…in` sees inherited names too, so a walk filtered by `hasOwn` leaves only them; a shadowed name appears once in the walk and counts as own."
    feedback:
      - when: { test: "the program prints the origin of every property" }
        message:
          uk: "Ця перевірка очікує в консолі шість рядків: `own`, `own`, `inherited`, `inherited`, `missing` і `category`. Якщо їх немає, функції ще не повертають очікуваних відповідей."
          en: "This check expects six console lines: `own`, `own`, `inherited`, `inherited`, `missing` and `category`. If they are not there, the functions do not return the expected answers yet."
      - when: { test: "originOf says own for a property the record has itself" }
        message:
          uk: "Ця перевірка питає про `name` і про `acquired`, яку запис має сам і яка затінює значення з прототипа. Обидві власні: `\"own\"`."
          en: "This check asks about `name` and about `acquired`, which the record has itself and which shadows the value from the prototype. Both are own: `\"own\"`."
      - when: { test: "originOf says own even when the value is undefined" }
        message:
          uk: "Ця перевірка питає про власну властивість, у якої значення `undefined`. Власна властивість існує, навіть коли в ній `undefined`, тож очікується `\"own\"`."
          en: "This check asks about an own property whose value is `undefined`. An own property exists even when it holds `undefined`, so `\"own\"` is expected."
      - when: { test: "originOf says inherited for what comes from a prototype" }
        message:
          uk: "Ця перевірка питає про `category`, що лежить у `wishDefaults`, і про `toString`, що лежить в `Object.prototype`. Обидві видно в записі, але власними вони не є: `\"inherited\"`."
          en: "This check asks about `category`, which lies in `wishDefaults`, and about `toString`, which lies in `Object.prototype`. Both are visible on the record, but neither is own: `\"inherited\"`."
      - when: { test: "originOf says missing for a name nowhere in the chain" }
        message:
          uk: "Ця перевірка питає про `price`, якої немає ні в записі, ні в його прототипах: `\"missing\"`."
          en: "This check asks about `price`, which is neither in the record nor in its prototypes: `\"missing\"`."
      - when: { test: "inheritedNames lists only enumerable inherited names" }
        message:
          uk: "Ця перевірка очікує `[\"category\"]` для запису з власними `id`, `name`, `acquired`, `note` і порожній масив для звичайного об’єкта. `acquired` затінена — вона власна, а не успадкована."
          en: "This check expects `[\"category\"]` for a record with own `id`, `name`, `acquired`, `note`, and an empty array for a plain object. `acquired` is shadowed — it is own, not inherited."
      - when: { test: "the functions do not change the record" }
        message:
          uk: "Ця перевірка викликає обидві функції й очікує, що в записі й у `wishDefaults` лишаються ті самі назви властивостей."
          en: "This check calls both functions and expects the record and `wishDefaults` to keep the same property names."

  - id: to-project
    kind: transfer
    capstoneStep: JS-11
    body:
      uk: "Записи твого проєкту — звичайні об’єкти, а `JSON.parse` повертає їх із прототипом `Object.prototype` і без жодних методів, які могли б лежати в іншому прототипі. У класах, які ти побачиш далі, методи лежать саме в прототипі, — і ти знатимеш, чому їх немає серед `Object.keys` і в JSON."
      en: "The records in your project are ordinary objects, and `JSON.parse` returns them with the prototype `Object.prototype` and without any methods that could live in another prototype. In the classes you will see next, methods live in the prototype — and you will know why they are missing from `Object.keys` and from JSON."
