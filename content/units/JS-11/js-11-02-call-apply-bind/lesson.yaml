id: js-11-02-call-apply-bind
unit: JS-11
title:
  uk: "Методи call, apply і bind"
  en: "call, apply and bind"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Викликати функцію з явно вказаним `this` через `call` і `apply` та сказати, чим відрізняються їхні списки аргументів."
    en: "Call a function with an explicit `this` using `call` and `apply`, and state how their argument lists differ."
  - uk: "Створити прив’язану функцію через `bind` для обробника події й передбачити, що повторний `bind` її `this` не змінює."
    en: "Create a bound function with `bind` for an event handler and predict that binding it again does not change its `this`."
prerequisites: [js-11-01-this-lexical-dynamic, js-03-02-parameters-default-rest]
subskills:
  - { family: J-04, skill: "call/apply/bind", depth: intro }
glossary: [bound-function, partial-application]
selfCheck: [predict-call-apply-bind, predict-rebind, wire-buttons]

blocks:
  - id: choose-this
    kind: explanation
    title:
      uk: "Обрати this власноруч"
      en: "Choosing this by hand"
    body:
      uk: |
        Минулого уроку `this` залежав від виклику. Але його можна вказати й **самому**: функції — теж об’єкти, і в кожної є методи `call`, `apply` та `bind`.

        ```js
        function describe(prefix) {
          return prefix + " " + this.title;
        }
        const task = { title: "Water the plants" };

        describe.call(task, "Task:");    // "Task: Water the plants"
        describe.apply(task, ["Task:"]); // the same result
        const bound = describe.bind(task);
        ```

        - `call(об’єкт, a, b)` викликає функцію **негайно**, а `this` у ній — вказаний об’єкт. Аргументи йдуть списком через кому.
        - `apply(об’єкт, [a, b])` робить те саме, але аргументи передають **одним масивом**.
        - `bind(об’єкт)` **нічого не викликає**: він повертає нову функцію, у якої `this` уже закріплено за цим об’єктом. Викликати її можна коли завгодно.

        Перший аргумент усіх трьох — майбутній `this`.
      en: |
        Last lesson `this` depended on the call. But you can also set it **yourself**: functions are objects too, and each has the methods `call`, `apply` and `bind`.

        ```js
        function describe(prefix) {
          return prefix + " " + this.title;
        }
        const task = { title: "Water the plants" };

        describe.call(task, "Task:");    // "Task: Water the plants"
        describe.apply(task, ["Task:"]); // the same result
        const bound = describe.bind(task);
        ```

        - `call(object, a, b)` calls the function **at once**, and `this` in it is the given object. The arguments follow as a list separated by commas.
        - `apply(object, [a, b])` does the same, but the arguments are passed **as one array**.
        - `bind(object)` **calls nothing**: it returns a new function whose `this` is already fixed to that object. You can call it whenever you like.

        The first argument of all three is the future `this`.

  - id: predict-call-apply-bind
    kind: prediction
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    prompt:
      uk: "Що з’явиться в консолі?"
      en: "What appears in the console?"
    code: |
      function describe(prefix) {
        return prefix + " " + this.name;
      }
      const item = { name: "%%lamp%%" };

      console.log(describe.call(item, "->"));
      console.log(describe.apply(item, ["->"]));
      const bound = describe.bind(item);
      console.log(typeof bound);
    verify:
      logs: ["-> %%lamp%%", "-> %%lamp%%", "function"]
    answer:
      type: choice
      options:
        - id: bind-waits
          code: "-> %%lamp%%\n-> %%lamp%%\nfunction"
        - id: bind-runs
          code: "-> %%lamp%%\n-> %%lamp%%\n-> %%lamp%%"
          why:
            uk: "`bind` лише готує нову функцію й нічого не викликає. У третьому рядку консолі друкується `typeof bound` — тип значення, яке `bind` повернув."
            en: "`bind` only prepares a new function and calls nothing. The third line prints `typeof bound` — the type of the value `bind` returned."
        - id: bind-object
          code: "-> %%lamp%%\n-> %%lamp%%\nobject"
          why:
            uk: "`bind` повертає **функцію**, а не копію об’єкта `item`: її можна викликати пізніше."
            en: "`bind` returns a **function**, not a copy of the object `item`: you can call it later."
        - id: apply-needs-list
          code: "-> %%lamp%%\nTypeError\nfunction"
          why:
            uk: "`apply` саме й чекає аргументи **масивом**: `[\"->\"]` — правильний запис. Помилка була б, якби масиву там не було."
            en: "`apply` is exactly the one that expects the arguments **as an array**: `[\"->\"]` is the right form. An error would come if there were no array there."
      correct: [bind-waits]
    explanation:
      uk: "`call` і `apply` викликають `describe` одразу, з `this` = `item`: обидва результати однакові, різниця лише в тому, як передано аргумент. `bind` нічого не виконує, а повертає нову функцію, тож `typeof bound` — `\"function\"`."
      en: "`call` and `apply` call `describe` at once, with `this` = `item`: both lines are the same, the only difference is how the argument is passed. `bind` runs nothing and returns a new function, so `typeof bound` is `\"function\"`."

  - id: call-bind-trace
    kind: visual
    visual: code-trace
    strings:
      water: { uk: "Пити воду", en: "Drink water" }
    title:
      uk: "Крок за кроком: call негайно, bind — на потім"
      en: "Step by step: call at once, bind for later"
    textEquivalent:
      uk: "Об’єкт habit має лічильник count і метод done, який збільшує this.count. Функція fire(handler) просто викликає handler() без жодного об’єкта перед крапкою — так з функцією поводяться таймер чи клік. Спершу habit.done.call(habit) негайно запускає done з this = habit, і count стає 1. Потім fire(habit.done) передає лише функцію: handler() викликає done без об’єкта, this дорівнює undefined, і this.count кидає TypeError, який перехоплює catch. Далі habit.done.bind(habit) нічого не викликає — повертає нову функцію bound, у якої this закріплено за habit. Коли fire(bound) викликає handler(), done знову отримує this = habit, і count стає 2. Наприкінці в консолі: TypeError і 2."
      en: "The object habit has a counter count and a method done that increases this.count. The function fire(handler) simply calls handler() with no object before the dot — this is how a timer or a click treats a function. First habit.done.call(habit) runs done at once with this = habit, and count becomes 1. Then fire(habit.done) passes the bare function: handler() calls done with no object, this is undefined, and this.count throws a TypeError that catch catches. Next habit.done.bind(habit) calls nothing — it returns a new function bound whose this is fixed to habit. When fire(bound) calls handler(), done gets this = habit again, and count becomes 2. At the end the console shows TypeError and 2."
    spec:
      file: visuals/call-bind.js
      captions:
        - at: { line: 13 }
          text:
            uk: "`call` **негайно** запускає `done`, а першим аргументом ми самі вказуємо, чим буде `this`."
            en: "`call` runs `done` **at once**, and with the first argument we choose what `this` is."
        - at: { line: 4, kind: call, hit: 1 }
          text:
            uk: "У кадрі `done` змінна `this` — `habit` (#2). Це ми її вказали, а не виклик «через крапку»."
            en: "In the frame of `done` the variable `this` is `habit` (#2). We chose it ourselves; it did not come from a call “through a dot”."
        - at: { line: 15 }
          text:
            uk: "`fire(habit.done)` передає лише функцію. `fire` викличе її як `handler()` — без об’єкта, як зробив би таймер чи клік."
            en: "`fire(habit.done)` passes only the function. `fire` will call it as `handler()` — with no object, as a timer or a click would."
        - at: { line: 4, kind: call, hit: 2 }
          text:
            uk: "Той самий метод `done`, але `this` — `undefined`: перед крапкою нічого немає."
            en: "The same method `done`, but `this` is `undefined`: there is nothing before the dot."
        - at: { line: 5, kind: throw }
          text:
            uk: "`this.count` читає поле з `undefined` — `TypeError`. `catch` його перехопить."
            en: "`this.count` reads a field of `undefined` — a `TypeError`. `catch` will catch it."
        - at: { line: 20 }
          text:
            uk: "`bind` нічого не запустив: у `done` не з’явилося нового кадру. Він повернув **нову функцію** (#5) з уже закріпленим `this`."
            en: "`bind` ran nothing: no new frame of `done` appeared. It returned a **new function** (#5) with `this` already fixed."
        - at: { line: 4, kind: call, hit: 3 }
          text:
            uk: "`fire` викликає `handler()` без об’єкта — але `handler` це `bound`, тож `done` отримує `this` = `habit` (#2)."
            en: "`fire` calls `handler()` with no object — but `handler` is `bound`, so `done` gets `this` = `habit` (#2)."
        - at: { line: 21, kind: end }
          text:
            uk: "Консоль: `TypeError` і `2` — два успішні виклики `done`, один невдалий."
            en: "Console: `TypeError` and `2` — two successful calls of `done`, one failed."

  - id: bound-stays
    kind: explanation
    title:
      uk: "Прив’язана функція не міняє this"
      en: "A bound function keeps its this"
    body:
      uk: |
        [[bound-function|Прив’язана функція]] — це **нова** функція. Оригінал `bind` не чіпає: `describe` і далі можна викликати з будь-яким `this`. А ось прив’язане `this` змінити вже не можна: `bound.call(other)` чи `bound.bind(other)` його ігнорують.

        Саме для цього `bind` і потрібен: коли функцію віддають комусь, хто викличе її без об’єкта, — таймеру чи слухачу події.

        ```js
        saveButton.addEventListener("click", store.save.bind(store));
        ```

        Стрілка, що викликає метод сама, теж спрацює — як ти бачив у попередньому уроці, вона бере потрібне зі свого оточення. Стрілку не можна «перенаправити»: `call` і `bind` її `this` теж не міняють, бо в неї його немає.

        У `bind` є ще одна властивість: решта аргументів закріплюється теж. Це [[partial-application|часткове застосування]]:

        ```js
        function add(a, b) { return a + b; }
        const addTen = add.bind(null, 10); // this is not needed, so null
        addTen(5); // 15
        ```
      en: |
        A [[bound-function|bound function]] is a **new** function. `bind` does not touch the original: `describe` can still be called with any `this`. But the bound `this` can no longer be changed: `bound.call(other)` or `bound.bind(other)` ignore it.

        That is exactly what `bind` is for: when you hand a function to someone who will call it with no object — a timer or an event listener.

        ```js
        saveButton.addEventListener("click", store.save.bind(store));
        ```

        An arrow that calls the method itself works too — as you saw last lesson, it takes what it needs from its surroundings. An arrow cannot be “redirected”: `call` and `bind` do not change its `this` either, because it has none.

        `bind` has one more feature: it can fix the remaining arguments too. This is [[partial-application|partial application]]:

        ```js
        function add(a, b) { return a + b; }
        const addTen = add.bind(null, 10); // this is not needed, so null
        addTen(5); // 15
        ```

  - id: predict-rebind
    kind: prediction
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
    prompt:
      uk: "Функцію прив’язали до одного об’єкта, а потім спробували прив’язати до другого. Що з’явиться в консолі?"
      en: "A function was bound to one object, and then someone tried to bind it to a second one. What appears in the console?"
    code: |
      function describe(prefix) {
        return prefix + " " + this.name;
      }
      const first = { name: "%%lamp%%" };
      const second = { name: "%%mug%%" };

      const bound = describe.bind(first);
      const rebound = bound.bind(second);

      console.log(bound("->"));
      console.log(rebound("->"));
      console.log(describe.call(second, "->"));
    verify:
      logs: ["-> %%lamp%%", "-> %%lamp%%", "-> %%mug%%"]
    answer:
      type: choice
      options:
        - id: first-wins
          code: "-> %%lamp%%\n-> %%lamp%%\n-> %%mug%%"
        - id: rebind-works
          code: "-> %%lamp%%\n-> %%mug%%\n-> %%mug%%"
          why:
            uk: "У прив’язаної функції `this` уже закріплено. Другий `bind` створює ще одну функцію, яка всередині викликає першу, — і та використовує свій `first`."
            en: "A bound function already has its `this` fixed. A second `bind` creates yet another function that calls the first one inside — and that one uses its own `first`."
        - id: bind-changes-original
          code: "-> %%lamp%%\n-> %%lamp%%\n-> %%lamp%%"
          why:
            uk: "`bind` не змінює оригінал, а повертає нову функцію. Тому `describe.call(second, \"->\")` працює з `second`."
            en: "`bind` does not change the original; it returns a new function. That is why `describe.call(second, \"->\")` works with `second`."
        - id: all-second
          code: "-> %%mug%%\n-> %%mug%%\n-> %%mug%%"
          why:
            uk: "Останній `bind` не «перебиває» попередній, а перший `bound` взагалі прив’язаний до `first`."
            en: "The last `bind` does not “override” the earlier one, and the first `bound` is bound to `first` anyway."
      correct: [first-wins]
    explanation:
      uk: "`bound` і `rebound` обидві прив’язані до `first`: перше закріплення `this` остаточне. Оригінальна `describe` лишилася незмінною, тож `describe.call(second, \"->\")` дає `second`."
      en: "`bound` and `rebound` are both bound to `first`: the first fixing of `this` is final. The original `describe` stayed unchanged, so `describe.call(second, \"->\")` gives `second`."

  - id: bind-lab
    kind: example
    runtime: browser-js
    dir: bind-lab
    entry: index.js
    title:
      uk: "call, bind і відокремлена копія"
      en: "call, bind and a detached copy"
    body:
      uk: |
        Лічильник із методом `increment`. Він викликається трьома способами: через `call`, через прив’язану копію `bound` і як відокремлена функція `detached`. Натисни **Запустити** й простеж, як змінюється `counter.count`.
      en: |
        A counter with a method `increment`. It is called in three ways: through `call`, through the bound copy `bound` and as the detached function `detached`. Press **Run** and watch how `counter.count` changes.
    tryIt:
      uk: |
        1. У консолі `1`, `2`, `3`, потім `TypeError` від `detached()` і підсумок `3`: відокремлена копія нічого не змінила.
        2. Перед рядком коду `console.log(counter.count);` додай `const other = { count: 100 };`, `const again = bound.bind(other);` і `console.log(again(), other.count);`. У консолі `4 100`: `again` усе одно змінила `counter`, бо перше закріплення `this` остаточне, а `other` лишився зі своїми 100.
      en: |
        1. The console shows `1`, `2`, `3`, then `TypeError` from `detached()` and the total `3`: the detached copy changed nothing.
        2. Before the line `console.log(counter.count);` add `const other = { count: 100 };`, `const again = bound.bind(other);` and `console.log(again(), other.count);`. The console shows `4 100`: `again` still changed `counter`, because the first fixing of `this` is final, and `other` kept its 100.

  - id: recall
    kind: review
    title:
      uk: "Згадай: що отримує слухач події"
      en: "Recall: what a listener receives"
    items:
      - id: listener-argument
        from: js-06-10-events-default-behavior
        prompt:
          uk: "`button.click()` імітує клік. Що виведе програма?"
          en: "`button.click()` imitates a click. What does the program print?"
        code: |
          const button = document.createElement("button");
          button.addEventListener("click", (event) => {
            console.log(event.type);
            console.log(event.target === button);
          });
          button.click();
        verify:
          logs: ["click", "true"]
        answer:
          type: choice
          options:
            - id: event-object
              code: "click\ntrue"
            - id: button-itself
              code: "undefined\nfalse"
              why:
                uk: "Слухач отримує **об’єкт події** з описом того, що сталося: `event.type` — `\"click\"`, а `event.target` — елемент, на якому це сталося, тобто `button`."
                en: "A listener receives an **event object** describing what happened: `event.type` is `\"click\"`, and `event.target` is the element it happened on, that is `button`."
            - id: nothing
              code: "TypeError"
              why:
                uk: "Браузер викликає слухача з одним аргументом — об’єктом події. Параметр `event` не порожній."
                en: "The browser calls the listener with one argument — the event object. The parameter `event` is not empty."
          correct: [event-object]
        explanation:
          uk: "Коли подія трапляється, браузер викликає слухача й передає йому об’єкт події. Сам слухач викликають без об’єкта перед крапкою, тому звичайна функція-слухач отримує `this` = елемент, на якому його зареєстровано, — а метод, відокремлений від свого об’єкта, нічого цінного в `this` не знайде. Це й виправляє `bind`."
          en: "When the event happens, the browser calls the listener and passes it the event object. The listener itself is called with no object before the dot, so a regular listener function gets `this` = the element it was registered on — and a method detached from its object finds nothing useful in `this`. That is what `bind` fixes."

  - id: wire-buttons
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: wire-buttons
    entry: index.js
    strings:
      water: { uk: "Пити воду", en: "Drink water" }
    title:
      uk: "Дві кнопки — одна звичка"
      en: "Two buttons — one habit"
    instructions:
      uk: |
        У звички `habit` є метод `markDone`, що збільшує `completed`. Допиши функцію `wire(first, second)`: вона має зробити `habit.markDone` обробником кліку на обох кнопках.

        - На `first` — через `bind`.
        - На `second` — через стрілкову функцію, що викликає метод сама.
        - Обидва кліки рахуються на `habit`; на самих кнопках нічого не записується.
        - Сама функція `wire` метод **не викликає**: лічильник збільшують лише кліки.

        Унизу файла дві кнопки, `wire` і два кліки: у консолі має з’явитися `2`.
      en: |
        The habit `habit` has a method `markDone` that increases `completed`. Complete the function `wire(first, second)`: it must make `habit.markDone` the click handler on both buttons.

        - On `first` — with `bind`.
        - On `second` — with an arrow function that calls the method itself.
        - Both clicks are counted on `habit`; nothing is written onto the buttons themselves.
        - The function `wire` does **not** call the method: only clicks increase the counter.

        At the bottom of the file there are two buttons, `wire` and two clicks: the console must show `2`.
    testTitles:
      "the program ends with two completions":
        uk: "Програма завершується з двома виконаннями"
        en: "The program ends with two completions"
      "wiring the buttons runs nothing yet":
        uk: "Підключення кнопок ще нічого не рахує"
        en: "Wiring the buttons runs nothing yet"
      "each click counts once on the habit":
        uk: "Кожен клік рахується один раз на звичці"
        en: "Each click counts once on the habit"
      "a click does not write onto the button":
        uk: "Клік нічого не записує на кнопку"
        en: "A click does not write onto the button"
    hints:
      nudge:
        uk: "`addEventListener` чекає саму **функцію**, яку викличуть пізніше. Що саме ти їй передаєш — функцію чи результат виклику? І хто стоїть перед крапкою, коли браузер викличе передану функцію?"
        en: "`addEventListener` expects the **function** itself, to be called later. What do you pass to it — a function or the result of a call? And what stands before the dot when the browser calls the function you passed?"
      explanation:
        uk: "Для першої кнопки зроби з методу прив’язану функцію: `метод.bind(власник)` повертає нову функцію, яку можна передати слухачу, наприклад `printer.print.bind(printer)`. Для другої напиши стрілку без параметрів, у тілі якої метод викликається через крапку: `() => власник.метод()`."
        en: "For the first button turn the method into a bound function: `method.bind(owner)` returns a new function you can give to the listener, for example `printer.print.bind(printer)`. For the second one write an arrow with no parameters whose body calls the method through a dot: `() => owner.method()`."
    solutionNote:
      uk: "`habit.markDone.bind(habit)` — це готова функція з закріпленим `this`. Стрілка `() => habit.markDone()` у момент кліку сама викликає метод через `habit.`, тож `this` — це `habit`. Якщо передати слухачу голий `habit.markDone`, браузер викличе його з `this` = кнопка, і лічильник habit не зміниться."
      en: "`habit.markDone.bind(habit)` is a ready function with `this` fixed. The arrow `() => habit.markDone()` calls the method through `habit.` itself at click time, so `this` is `habit`. If you pass the bare `habit.markDone` to the listener, the browser calls it with `this` = the button, and the counter of the habit does not change."
    feedback:
      - when: { test: "the program ends with two completions" }
        message:
          uk: "Ця перевірка очікує, що після двох кліків унизу файла в консолі один рядок — `2`. `habit.completed` має зрости на обох кнопках."
          en: "This check expects one console line — `2` — after the two clicks at the bottom of the file. `habit.completed` must grow on both buttons."
      - when: { test: "wiring the buttons runs nothing yet" }
        message:
          uk: "Ця перевірка скидає `habit.completed` у 0, викликає `wire` для двох нових кнопок і очікує, що лічильник усе ще 0. До обробника слід передати саму функцію, а не результат її виклику."
          en: "This check resets `habit.completed` to 0, calls `wire` for two new buttons and expects the counter still to be 0. The listener must get the function itself, not the result of calling it."
      - when: { test: "each click counts once on the habit" }
        message:
          uk: "Ця перевірка клікає по кнопках по черзі й очікує, що `habit.completed` стає 1, а потім 2. Кожна кнопка має збільшувати лічильник звички."
          en: "This check clicks the buttons one after another and expects `habit.completed` to become 1 and then 2. Each button must increase the counter of the habit."
      - when: { test: "a click does not write onto the button" }
        message:
          uk: "Ця перевірка очікує, що на кнопках після кліків немає поля `completed`. Воно з’являється, коли метод викликають з `this` = кнопка, а не звичка."
          en: "This check expects the buttons to have no field `completed` after the clicks. It appears when the method is called with `this` = the button instead of the habit."

  - id: to-project
    kind: transfer
    capstoneStep: JS-11
    body:
      uk: "Кнопка «Видалити» чи «Отримано» в твоєму проєкті викликає метод репозиторію. Передати його слухачу «голим» не можна — буде загублений `this`. У кроці проєкту ти зробиш це через `bind` або стрілку й перевіриш, що обидва варіанти оновлюють один і той самий репозиторій."
      en: "The “Delete” or “Acquired” button in your project calls a method of the repository. You cannot hand it to a listener “bare” — `this` would be lost. In the project step you will do it with `bind` or an arrow and check that both variants update the same repository."
