id: js-11-05-classes-private-static
unit: JS-11
title:
  uk: "Класи: поля, приватні та статичні члени"
  en: "Classes: fields, private and static members"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Переписати конструктор із методами на прототипі як клас і показати, що методи класу так само лежать на прототипі."
    en: "Rewrite a constructor with prototype methods as a class and show that its methods still live on the prototype."
  - uk: "Захистити інваріант (умову, яка має виконуватися завжди) приватним полем `#…` і створювати екземпляри через статичну фабрику, передбачаючи, що станеться при доступі ззовні."
    en: "Protect an invariant (a condition that must always hold) with a `#private` field and create instances through a static factory, predicting what access from outside does."
prerequisites: [js-11-04-constructor-new]
subskills:
  - { family: J-06, skill: "classes/private/static fields", depth: intro }
glossary: [class-syntax, class-field, private-field, static-member]
selfCheck: [predict-class-members, bounded-counter]

blocks:
  - id: class-is-a-block
    kind: explanation
    title:
      uk: "Клас — конструктор і прототип в одному блоці"
      en: "A class — constructor and prototype in one block"
    body:
      uk: |
        У минулому уроці конструктор і методи прототипа писали окремо. [[class-syntax|Клас]] збирає їх в один блок:

        ```js
        class Task {
          done = false;            // a field: every instance gets its own
          constructor(title) {
            this.title = title;
          }
          finish() {               // a method: lies on Task.prototype
            this.done = true;
          }
        }
        const task = new Task("Полити квіти");
        ```

        Це той самий механізм, а не нова система: `typeof Task` — `"function"`, метод `finish` лежить на `Task.prototype` (в екземплярі його немає), а `Object.keys(task)` покаже лише поля `done` і `title`. Різниці корисні: клас **не можна** викликати без `new` — буде `TypeError`, а тіло класу завжди працює в строгому режимі.

        [[class-field|Поле класу]] (`done = false;`) створює власну властивість у кожного екземпляра ще до того, як запрацює конструктор.
      en: |
        In the last lesson the constructor and the prototype methods were written separately. A [[class-syntax|class]] puts them into one block:

        ```js
        class Task {
          done = false;            // a field: every instance gets its own
          constructor(title) {
            this.title = title;
          }
          finish() {               // a method: lies on Task.prototype
            this.done = true;
          }
        }
        const task = new Task("Water the plants");
        ```

        This is the same mechanism, not a new system: `typeof Task` is `"function"`, the method `finish` lies on `Task.prototype` (the instance does not have it), and `Object.keys(task)` shows only the fields `done` and `title`. The differences are useful: a class **cannot** be called without `new` — that gives a `TypeError` — and the body of a class always runs in strict mode.

        A [[class-field|class field]] (`done = false;`) creates an own property in every instance before the constructor starts.

  - id: private-and-static
    kind: explanation
    title:
      uk: "Приватні поля й статичні члени"
      en: "Private fields and static members"
    body:
      uk: |
        Поле, назва якого починається з `#`, — [[private-field|приватне]]: його видно лише всередині тіла класу.

        ```js
        class PiggyBank {
          #savedMinor = 0;                 // private
          save(amountMinor) {
            if (amountMinor > 0) {
              this.#savedMinor += amountMinor;
            }
          }
          static fromJSON(data) {          // static
            const bank = new PiggyBank();
            bank.save(data.savedMinor);
            return bank;
          }
        }
        ```

        Звернення `bank.#savedMinor` поза класом — не `undefined`, а помилка **ще до запуску**: програма взагалі не стартує. Тож клас гарантує свої правила: ніхто не запише від’ємну суму в обхід `save`. А підкреслення на початку назви (`_savedMinor`) — лише домовленість між людьми: така властивість звичайна й публічна, її видно в `Object.keys` і можна змінити ззовні.

        [[static-member|Статичний]] член (`static`) належить самому класові, а не екземплярам: `PiggyBank.fromJSON(data)` працює, а `bank.fromJSON(data)` — `TypeError`. Типовий приклад — **статична фабрика**: вона перевіряє дані й сама створює екземпляр.
      en: |
        A field whose name starts with `#` is [[private-field|private]]: it is visible only inside the body of the class.

        ```js
        class PiggyBank {
          #savedMinor = 0;                 // private
          save(amountMinor) {
            if (amountMinor > 0) {
              this.#savedMinor += amountMinor;
            }
          }
          static fromJSON(data) {          // static
            const bank = new PiggyBank();
            bank.save(data.savedMinor);
            return bank;
          }
        }
        ```

        Writing `bank.#savedMinor` outside the class is not `undefined`, it is an error **before the program starts**: the program does not start at all. So the class guarantees its rules: nobody can write a negative amount around `save`. An underscore at the start of a name (`_savedMinor`) is only an agreement between people: such a property is ordinary and public, it shows in `Object.keys` and can be changed from outside.

        A [[static-member|static]] member (`static`) belongs to the class itself, not to its instances: `PiggyBank.fromJSON(data)` works, while `bank.fromJSON(data)` is a `TypeError`. A typical use is a **static factory**: it checks the data and creates the instance itself.

  - id: predict-class-members
    kind: prediction
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      gift: { uk: "подарунок", en: "gift" }
    prompt:
      uk: "Клас із приватним полем, полем із підкресленням і статичною фабрикою. Що з’явиться в консолі?"
      en: "A class with a private field, an underscore field and a static factory. What appears in the console?"
    code: |
      class Basket {
        #items = [];
        _note = "%%gift%%";

        static fromList(names) {
          const basket = new Basket();
          for (const name of names) {
            basket.add(name);
          }
          return basket;
        }

        add(name) {
          this.#items.push(name);
        }

        count() {
          return this.#items.length;
        }
      }

      const basket = Basket.fromList(["%%lamp%%", "%%mug%%"]);
      console.log(basket.count());
      console.log(basket._note);
      console.log(basket["#items"]);
      console.log(Object.keys(basket).join());
      try {
        basket.fromList([]);
      } catch (error) {
        console.log(error.name);
      }
    verify:
      logs: ["2", "%%gift%%", "undefined", "_note", "TypeError"]
    answer:
      type: choice
      options:
        - id: private-hidden
          code: "2\n%%gift%%\nundefined\n_note\nTypeError"
        - id: underscore-private
          code: "2\nundefined\nundefined\n\nTypeError"
          why:
            uk: "Підкреслення нічого не ховає: `_note` — звичайна публічна властивість, тож `basket._note` читається, а `Object.keys` її показує."
            en: "An underscore hides nothing: `_note` is an ordinary public property, so `basket._note` can be read and `Object.keys` shows it."
        - id: hash-visible
          code: "2\n%%gift%%\nundefined\n_note,#items\nTypeError"
          why:
            uk: "Приватне поле — не властивість із назвою `\"#items\"`: ні `basket[\"#items\"]`, ні `Object.keys` його не бачать."
            en: "A private field is not a property named `\"#items\"`: neither `basket[\"#items\"]` nor `Object.keys` can see it."
        - id: static-on-instance
          code: "2\n%%gift%%\nundefined\n_note"
          why:
            uk: "Статичний метод не потрапляє в екземпляри: `basket.fromList` не існує, і виклик `basket.fromList([])` кидає `TypeError` (його перехоплює `catch`), тож п’ятий рядок усе-таки з’являється."
            en: "A static method does not get into instances: `basket.fromList` does not exist, and the call `basket.fromList([])` throws a `TypeError` (the `catch` catches it), so the fifth line does appear."
      correct: [private-hidden]
    explanation:
      uk: "Статична фабрика `Basket.fromList` створює кошик із двома речами (`count()` — 2). `_note` — публічне поле, тому читається й потрапляє в `Object.keys`; приватний `#items` не видно ні як `\"#items\"`, ні в `Object.keys`. А `fromList` належить класові: на екземплярі його немає — `TypeError`."
      en: "The static factory `Basket.fromList` creates a basket with two things (`count()` is 2). `_note` is a public field, so it can be read and appears in `Object.keys`; the private `#items` is visible neither as `\"#items\"` nor in `Object.keys`. And `fromList` belongs to the class: the instance does not have it — a `TypeError`."

  - id: class-layout
    kind: visual
    visual: diagram
    title:
      uk: "Куди потрапляє кожна частина класу"
      en: "Where each line of a class lands"
    textEquivalent:
      uk: "Клас Basket — це один блок коду, але його частини живуть у різних місцях. На схемі три об’єкти зверху вниз: екземпляр, Basket.prototype і сам клас — функція Basket; екземпляр веде до прототипа посилання [[Prototype]], а прототип через службове поле constructor указує назад на клас. Статичний метод fromList належить самій функції-класу Basket. Звичайні методи add і count лежать один раз на Basket.prototype, і всі екземпляри ведуть до нього приховане посилання [[Prototype]]. Поля класу — публічне _note та приватне #items — створюються окремо в кожному екземплярі; приватне видно лише коду всередині класу, а _note є звичайною властивістю. Тому new Basket() дає екземпляр, який має власні поля, а методи знаходить на прототипі."
      en: "The class Basket is one block of code, but its parts live in different places. The picture has three objects from top to bottom: an instance, Basket.prototype and the class itself — the function Basket; the instance leads a [[Prototype]] link to the prototype, and the prototype points back at the class through the service field constructor. The static method fromList belongs to the class function Basket itself. The ordinary methods add and count lie once on Basket.prototype, and every instance leads a hidden [[Prototype]] link to it. The class fields — the public _note and the private #items — are created separately in every instance; the private one is visible only to code inside the class, while _note is an ordinary property. So new Basket() gives an instance that has its own fields and finds the methods on the prototype."
    spec:
      layout: tb
      nodes:
        - { id: cls, label: "Basket: static fromList", w: 190 }
        - { id: proto, label: "Basket.prototype: add, count", w: 190 }
        - { id: inst, label: "instance: _note, #items", w: 190 }
      edges:
        - { id: inst->proto, from: inst, to: proto, label: "[[Prototype]]" }
        - { id: proto->cls, from: proto, to: cls, label: "constructor" }
      steps:
        - caption:
            uk: "Один клас — три місця. Екземпляр веде `[[Prototype]]` до `Basket.prototype`, а там службове поле `constructor` указує назад на сам клас — функцію `Basket`."
            en: "One class — three places. An instance leads `[[Prototype]]` to `Basket.prototype`, and there the service field `constructor` points back at the class itself — the function `Basket`."
        - caption:
            uk: "`static fromList(…)` — на самій функції-класі. Екземпляри його не успадковують, тож `basket.fromList` — `TypeError`."
            en: "`static fromList(…)` is on the class function itself. Instances do not inherit it, so `basket.fromList` is a `TypeError`."
          highlight: [cls]
          dim: [proto, inst]
        - caption:
            uk: "`add(name)` і `count()` — на `Basket.prototype`, **один раз**. Усі екземпляри користуються тими самими функціями."
            en: "`add(name)` and `count()` are on `Basket.prototype`, **once**. All instances use the same functions."
          highlight: [proto]
          dim: [cls, inst]
        - caption:
            uk: "Поля `_note` та `#items` створюються **в кожному екземплярі**. `_note` — звичайна властивість, а `#items` — приватна: її видно лише коду всередині класу."
            en: "The fields `_note` and `#items` are created **in every instance**. `_note` is an ordinary property, while `#items` is private: only code inside the class can see it."
          highlight: [inst]
          dim: [cls, proto]
        - caption:
            uk: "`new Basket()` дає екземпляр із власними полями, а методи він знаходить на прототипі — за посиланням `[[Prototype]]`."
            en: "`new Basket()` gives an instance with its own fields, and it finds the methods on the prototype — through the `[[Prototype]]` link."
          highlight: [inst, inst->proto, proto]
          dim: [cls]

  - id: budget-class
    kind: example
    runtime: browser-js
    dir: budget-class
    entry: index.js
    title:
      uk: "Приватна сума, що її не видно ззовні"
      en: "A private sum that cannot be seen from outside"
    body:
      uk: |
        Клас `Budget` рахує витрачене в `amountMinor` — найменших одиницях (копійках). Сума лежить у приватному полі `#spentMinor`. Натисни **Запустити** й зверни увагу: власних властивостей немає, а `budget.spentMinor` — `undefined`.
      en: |
        The class `Budget` counts what was spent in `amountMinor` — the smallest units (kopiykas). The sum lies in the private field `#spentMinor`. Press **Run** and note that there are no own properties and `budget.spentMinor` is `undefined`.
    tryIt:
      uk: |
        1. Консоль: `0`, `undefined`, `function`. Витрати є, але ззовні їх не видно.
        2. У кінці файла додай `console.log(budget.#spentMinor);` і запусти. Тепер замість запуску з’являється картка «Код не вдалося запустити» з оригінальним повідомленням `Private name #spentMinor is not defined.`, а консоль порожня — не виконався навіть перший рядок. Видали доданий рядок.
        3. Усередині класу, під `spend`, додай метод `total() { return this.#spentMinor; }`, а в кінці файла — `console.log(budget.total());`. Метод класу має доступ до приватного поля, тож виводиться `27990`.
      en: |
        1. Console: `0`, `undefined`, `function`. The expenses are there, but they cannot be seen from outside.
        2. At the end of the file add `console.log(budget.#spentMinor);` and run. Now instead of running, the card “The code could not start” appears with the original message `Private name #spentMinor is not defined.`, and the console is empty — not even the first line ran. Remove the added line.
        3. Inside the class, below `spend`, add a method `total() { return this.#spentMinor; }`, and at the end of the file `console.log(budget.total());`. A method of the class has access to the private field, so `27990` is printed.

  - id: recall
    kind: review
    title:
      uk: "Згадай: що лишається приватним у модулі"
      en: "Recall: what stays private in a module"
    items:
      - id: not-exported
        from: js-07-06-esm-import-export
        prompt:
          uk: "Файл `store.js` оголошує `const secret = 42;` і `export function readSecret() { return secret; }`. Інший файл імпортує звідти. Який варіант правильно описує, що йому доступно?"
          en: "The file `store.js` declares `const secret = 42;` and `export function readSecret() { return secret; }`. Another file imports from it. Which option correctly describes what it can reach?"
        answer:
          type: choice
          options:
            - id: only-exported
              text:
                uk: "Лише `readSecret`: `secret` не експортовано, тож інший файл бачить його лише через цю функцію."
                en: "Only `readSecret`: `secret` is not exported, so the other file sees it only through that function."
            - id: both
              text:
                uk: "І `readSecret`, і `secret`: усі змінні файла-модуля доступні тим, хто його імпортує."
                en: "Both `readSecret` and `secret`: every variable of a module file is available to whoever imports it."
              why:
                uk: "Імпортувати можна лише те, що експортовано. Змінна без `export` лишається в модулі."
                en: "Only what is exported can be imported. A variable without `export` stays inside the module."
            - id: underscore
              text:
                uk: "Лише `readSecret`, але тільки якщо назву `secret` змінити на `_secret`."
                en: "Only `readSecret`, but only if the name `secret` is changed to `_secret`."
              why:
                uk: "Приватність у модулі дає відсутність `export`, а не назва змінної."
                en: "Privacy in a module comes from the absence of `export`, not from the name of the variable."
          correct: [only-exported]
        explanation:
          uk: "Модуль ховає все, що не експортовано, а функція `readSecret` — «вікно» у приховане. Приватне поле класу робить те саме на рівні об’єкта: ззовні його не видно, а методи класу — це «вікна» до нього."
          en: "A module hides everything that is not exported, and the function `readSecret` is a “window” into the hidden part. A private class field does the same at the level of an object: it is not visible from outside, and the methods of the class are the “windows” into it."

  - id: bounded-counter
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: bounded-counter
    entry: index.js
    title:
      uk: "Лічильник, що не виходить за межі"
      en: "A counter that stays within bounds"
    instructions:
      uk: |
        Допиши клас `BoundedCounter` — лічильник, що завжди лежить між 0 і найбільшим значенням (наприклад, виконання звички за тиждень).

        - Лічильник і максимум зберігай у **приватних** полях.
        - `new BoundedCounter(max)` створює лічильник зі значенням 0 і найбільшим значенням `max`.
        - `increment()` додає 1, але не вище за максимум; `decrement()` віднімає 1, але не нижче за 0.
        - `value()` повертає поточне значення.
        - Статичний метод `fromJSON(data)` отримує `{ count, max }` і повертає лічильник із цим значенням та максимумом. Якщо `max` — не ціле число від 1, або `count` — не ціле число від 0 до `max`, він кидає `RangeError`.

        Унизу файла готовий код: у консолі має з’явитися `3`, `2` і `RangeError`.
      en: |
        Complete the class `BoundedCounter` — a counter that always lies between 0 and a maximum value (for example the completions of a habit in a week).

        - Keep the count and the maximum in **private** fields.
        - `new BoundedCounter(max)` creates a counter with the value 0 and the maximum `max`.
        - `increment()` adds 1 but not above the maximum; `decrement()` subtracts 1 but not below 0.
        - `value()` returns the current value.
        - The static method `fromJSON(data)` receives `{ count, max }` and returns a counter with that value and maximum. If `max` is not a whole number of at least 1, or `count` is not a whole number from 0 to `max`, it throws a `RangeError`.

        At the bottom of the file there is ready code: the console must show `3`, `2` and `RangeError`.
    testTitles:
      "the program prints 3, 2 and RangeError":
        uk: "Програма друкує 3, 2 і RangeError"
        en: "The program prints 3, 2 and RangeError"
      "the counter starts at 0 and stops at the maximum":
        uk: "Лічильник стартує з 0 і зупиняється на максимумі"
        en: "The counter starts at 0 and stops at the maximum"
      "decrement stops at 0":
        uk: "decrement зупиняється на 0"
        en: "decrement stops at 0"
      "fromJSON restores a valid counter":
        uk: "fromJSON відновлює правильний лічильник"
        en: "fromJSON restores a valid counter"
      "fromJSON rejects invalid data with a RangeError":
        uk: "fromJSON відхиляє неправильні дані через RangeError"
        en: "fromJSON rejects invalid data with a RangeError"
      "the count and the maximum are private":
        uk: "Значення й максимум приватні"
        en: "The count and the maximum are private"
      "fromJSON belongs to the class, not to its instances":
        uk: "fromJSON належить класові, а не екземплярам"
        en: "fromJSON belongs to the class, not to its instances"
      "two counters keep their own counts":
        uk: "Два лічильники мають власні значення"
        en: "Two counters keep their own counts"
    hints:
      nudge:
        uk: "Де в класі оголошують приватне поле і як до нього звертаються з методів? А що відрізняє статичний метод від звичайного в записі?"
        en: "Where in a class is a private field declared, and how do methods refer to it? And what makes a static method different from an ordinary one in the notation?"
      explanation:
        uk: "Оголоси `#назва` в тілі класу й читай та змінюй її в методах як `this.#назва`. Перед зміною значення перевір межу: додавати лише тоді, коли є куди. `static` ставлять перед назвою методу; усередині статичного методу `this` немає екземпляра, тож новий лічильник створюй через `new BoundedCounter(…)`. Статичний метод — частина класу, тож приватне поле створеного ним екземпляра йому доступне."
        en: "Declare `#name` in the body of the class and read and change it in methods as `this.#name`. Check the boundary before changing the value: add only when there is room. `static` goes before the name of the method; inside a static method `this` is not an instance, so create a new counter with `new BoundedCounter(…)`. A static method is part of the class, so the private field of an instance it created is accessible to it."
    solutionNote:
      uk: "Приватні `#count` і `#max` недоступні ззовні, тож жодний код не збреше лічильнику в обхід `increment`. Статична `fromJSON` перевіряє дані й лише потім створює екземпляр; оскільки вона записана в тілі класу, їй дозволено писати в приватне поле створеного лічильника."
      en: "The private `#count` and `#max` are unreachable from outside, so no code can lie to the counter around `increment`. The static `fromJSON` checks the data and only then creates the instance; since it is written inside the body of the class, it is allowed to write into the private field of the counter it created."
    feedback:
      - when: { test: "the program prints 3, 2 and RangeError" }
        message:
          uk: "Ця перевірка очікує в консолі три рядки: `3` (п’ять збільшень при максимумі 3), `2` (відновлений лічильник) і `RangeError` (дані з `count: 9` при `max: 5`)."
          en: "This check expects three console lines: `3` (five increments with the maximum 3), `2` (the restored counter) and `RangeError` (the data with `count: 9` and `max: 5`)."
      - when: { test: "the counter starts at 0 and stops at the maximum" }
        message:
          uk: "Ця перевірка створює `new BoundedCounter(2)`, очікує 0, а після трьох `increment()` — 2: більше за максимум лічильник не росте."
          en: "This check creates `new BoundedCounter(2)`, expects 0, and after three `increment()` calls expects 2: the counter does not grow above the maximum."
      - when: { test: "decrement stops at 0" }
        message:
          uk: "Ця перевірка додає 1, а потім двічі віднімає й очікує 0: нижче за 0 лічильник не опускається."
          en: "This check adds 1, then subtracts twice and expects 0: the counter does not go below 0."
      - when: { test: "fromJSON restores a valid counter" }
        message:
          uk: "Ця перевірка викликає `BoundedCounter.fromJSON({ count: 4, max: 5 })` і очікує екземпляр `BoundedCounter` зі значенням 4, що після двох `increment()` зупиняється на 5."
          en: "This check calls `BoundedCounter.fromJSON({ count: 4, max: 5 })` and expects a `BoundedCounter` instance with the value 4 that stops at 5 after two `increment()` calls."
      - when: { test: "fromJSON rejects invalid data with a RangeError" }
        message:
          uk: "Ця перевірка дає `fromJSON` шість неправильних наборів даних (`count` більший за `max`, від’ємний, дробовий, текстовий або відсутній; `max` рівний 0) і очікує для кожного саме `RangeError`."
          en: "This check gives `fromJSON` six invalid sets of data (`count` above `max`, negative, fractional, text or missing; `max` equal to 0) and expects exactly a `RangeError` for each."
      - when: { test: "the count and the maximum are private" }
        message:
          uk: "Ця перевірка очікує, що в лічильника немає власних властивостей: ні `count`, ні `_count`, ні інших. Приватні поля оголошують із `#` і не видно в `Object.getOwnPropertyNames`."
          en: "This check expects the counter to have no own properties: neither `count`, nor `_count`, nor any other. Private fields are declared with `#` and do not appear in `Object.getOwnPropertyNames`."
      - when: { test: "fromJSON belongs to the class, not to its instances" }
        message:
          uk: "Ця перевірка очікує, що `BoundedCounter.fromJSON` є функцією, а `counter.fromJSON` на екземплярі — `undefined`. Для цього метод оголошують зі словом `static`."
          en: "This check expects `BoundedCounter.fromJSON` to be a function and `counter.fromJSON` on an instance to be `undefined`. A method is declared with the word `static` for that."
      - when: { test: "two counters keep their own counts" }
        message:
          uk: "Ця перевірка збільшує один лічильник і очікує, що другий лишається на 0: кожен екземпляр має власне приватне значення."
          en: "This check increments one counter and expects the other to stay at 0: every instance has its own private value."

  - id: to-project
    kind: transfer
    capstoneStep: JS-11
    body:
      uk: "У проєкті репозиторій записів — природний клас: у приватному `#items` (`#tasks`, `#habits`, `#expenses`) лежить список, а публічні методи `add`, `remove` чи `toggle…` — єдиний спосіб його змінити. Статична `fromJSON` відновлює репозиторій із того, що ти зберіг у `localStorage`."
      en: "In the project the repository of records is a natural class: the private `#items` (`#tasks`, `#habits`, `#expenses`) holds the list, and the public methods `add`, `remove` or `toggle…` are the only way to change it. A static `fromJSON` restores the repository from what you saved in `localStorage`."
