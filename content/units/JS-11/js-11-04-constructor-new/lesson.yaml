id: js-11-04-constructor-new
unit: JS-11
title:
  uk: "Функції-конструктори й оператор new"
  en: "Constructor functions and the new operator"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Перелічити, що робить `new` — створює об’єкт, зв’язує його прототип, запускає конструктор із `this` на цьому об’єкті й повертає його, — і передбачити, що буде, коли `new` забули."
    en: "List what `new` does — creates an object, links its prototype, runs the constructor with `this` set to it and returns it — and predict what happens when `new` is forgotten."
  - uk: "Показати, що методи на `Constructor.prototype` спільні для всіх екземплярів і не копіюються."
    en: "Show that methods on `Constructor.prototype` are shared by every instance rather than copied."
prerequisites: [js-11-03-prototype-chain]
subskills:
  - { family: J-06, skill: "constructor/new", depth: intro }
glossary: [constructor-function, new-operator, instance]
selfCheck: [predict-new, habit-log]

blocks:
  - id: factory-of-objects
    kind: explanation
    title:
      uk: "Функція, що будує об’єкти"
      en: "A function that builds objects"
    body:
      uk: |
        Якщо потрібно багато однотипних об’єктів з тими самими методами, їх будують [[constructor-function|функцією-конструктором]]. За традицією її назва починається з великої літери, а викликають її з [[new-operator|оператором `new`]]:

        ```js
        function Item(name, price) {
          this.name = name;
          this.price = price;
        }
        Item.prototype.describe = function () {
          return this.name + ": " + this.price;
        };

        const lamp = new Item("Настільна лампа", 45);
        lamp.describe(); // "Настільна лампа: 45"
        ```

        `new Item(…)` робить чотири кроки:

        1. Створює новий порожній об’єкт.
        2. Зв’язує його прототип з `Item.prototype`.
        3. Запускає `Item` із `this`, що вказує на цей новий об’єкт, — конструктор наповнює його власними полями.
        4. Повертає цей об’єкт.

        Об’єкт, створений через `new`, називають [[instance|екземпляром]] цього конструктора: `lamp instanceof Item` — `true`. Методи лежать один раз на `Item.prototype`, а не в кожному екземплярі — ти бачив це в уроці про ланцюжок прототипів.
      en: |
        When you need many objects of the same kind with the same methods, you build them with a [[constructor-function|constructor function]]. By tradition its name starts with a capital letter, and it is called with the [[new-operator|operator `new`]]:

        ```js
        function Item(name, price) {
          this.name = name;
          this.price = price;
        }
        Item.prototype.describe = function () {
          return this.name + ": " + this.price;
        };

        const lamp = new Item("Desk lamp", 45);
        lamp.describe(); // "Desk lamp: 45"
        ```

        `new Item(…)` does four steps:

        1. It creates a new empty object.
        2. It links the object’s prototype to `Item.prototype`.
        3. It runs `Item` with `this` pointing at the new object — the constructor fills it with own fields.
        4. It returns that object.

        An object created with `new` is called an [[instance|instance]] of that constructor: `lamp instanceof Item` is `true`. Methods lie once on `Item.prototype`, not in every instance — you saw this in the lesson on the prototype chain.

  - id: new-steps
    kind: visual
    visual: memory-graph
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
    title:
      uk: "new Item(…) крок за кроком"
      en: "new Item(…) step by step"
    textEquivalent:
      uk: "Спершу є функція Item, а в неї — властивість prototype, що веде до об’єкта Item.prototype; у ньому лежить спільний метод describe. Перший new Item створює новий порожній об’єкт і зв’язує його прихований [[Prototype]] з Item.prototype. На час виконання конструктора this вказує на цей об’єкт. Конструктор записує в нього власні name і price, і після завершення об’єкт потрапляє в змінну lamp. Другий new Item створює ще один об’єкт, у mug, з тими самими власними полями, але іншими значеннями. Обидва об’єкти ведуть [[Prototype]] до одного Item.prototype, тому метод describe існує один раз, а lamp.describe === mug.describe дає true."
      en: "First there is the function Item, and it has a property prototype that leads to the object Item.prototype; the shared method describe lies in it. The first new Item creates a new empty object and links its hidden [[Prototype]] to Item.prototype. While the constructor runs, this points at that object. The constructor writes its own name and price into it, and when it finishes the object lands in the variable lamp. The second new Item creates another object, into mug, with the same kinds of own fields but different values. Both objects lead their [[Prototype]] to one Item.prototype, so the method describe exists once, and lamp.describe === mug.describe gives true."
    spec:
      code: |
        function Item(name, price) {
          this.name = name;
          this.price = price;
        }
        Item.prototype.describe = function () {
          return this.name + ": " + this.price;
        };
        const lamp = new Item("%%lamp%%", 45);
        const mug = new Item("%%mug%%", 18);
      states:
        - caption:
            uk: "Функція `Item` має властивість `prototype`: вона веде до об’єкта, де житимуть спільні методи. Поки що там лише службове поле `constructor`."
            en: "The function `Item` has a property `prototype`: it leads to the object where shared methods will live. For now it holds only the service field `constructor`."
          line: 1
          bindings:
            - { name: Item, kind: function, value: { ref: itemFn } }
          heap:
            itemFn: { kind: object, ctor: "function Item", props: { prototype: { ref: proto } } }
            proto: { kind: object, ctor: "Item.prototype", props: { constructor: { ref: itemFn } } }
        - caption:
            uk: "Присвоєння поклало в `Item.prototype` метод `describe`. Він лежить **один раз** — поки що жоден екземпляр не створено."
            en: "The assignment put the method `describe` into `Item.prototype`. It lies **once** — no instance exists yet."
          line: 5
          bindings:
            - { name: Item, kind: function, value: { ref: itemFn } }
          heap:
            itemFn: { kind: object, ctor: "function Item", props: { prototype: { ref: proto } } }
            proto: { kind: object, ctor: "Item.prototype", props: { constructor: { ref: itemFn }, describe: { ref: describeFn } } }
            describeFn: { kind: function, name: describe }
        - caption:
            uk: "`new Item(…)` — кроки 1 і 2: створено порожній об’єкт, а його `[[Prototype]]` указує на `Item.prototype`. `this` у конструкторі вказує саме на нього."
            en: "`new Item(…)` — steps 1 and 2: an empty object is created and its `[[Prototype]]` points at `Item.prototype`. `this` in the constructor points at exactly this object."
          line: 8
          bindings:
            - { name: Item, kind: function, value: { ref: itemFn } }
            - { name: this, kind: param, value: { ref: lampObj } }
          heap:
            itemFn: { kind: object, ctor: "function Item", props: { prototype: { ref: proto } } }
            proto: { kind: object, ctor: "Item.prototype", props: { constructor: { ref: itemFn }, describe: { ref: describeFn } } }
            describeFn: { kind: function, name: describe }
            lampObj: { kind: object, props: { "[[Prototype]]": { ref: proto } } }
        - caption:
            uk: "Крок 3: конструктор записав у `this` власні `name` і `price`. Крок 4: об’єкт повернуто, і він потрапив у `lamp`. `describe` у ньому **немає** — лише посилання на прототип."
            en: "Step 3: the constructor wrote its own `name` and `price` into `this`. Step 4: the object was returned and landed in `lamp`. It has **no** `describe` in it — only the link to the prototype."
          line: 8
          bindings:
            - { name: Item, kind: function, value: { ref: itemFn } }
            - { name: lamp, kind: const, value: { ref: lampObj } }
          heap:
            itemFn: { kind: object, ctor: "function Item", props: { prototype: { ref: proto } } }
            proto: { kind: object, ctor: "Item.prototype", props: { constructor: { ref: itemFn }, describe: { ref: describeFn } } }
            describeFn: { kind: function, name: describe }
            lampObj: { kind: object, props: { name: "%%lamp%%", price: 45, "[[Prototype]]": { ref: proto } } }
        - caption:
            uk: "Другий `new Item(…)` дав ще один об’єкт. Обидва ведуть `[[Prototype]]` до **одного** `Item.prototype`, тож `lamp.describe === mug.describe` — `true`: метод не скопіювали."
            en: "The second `new Item(…)` gave one more object. Both lead their `[[Prototype]]` to **one** `Item.prototype`, so `lamp.describe === mug.describe` is `true`: the method was not copied."
          line: 9
          bindings:
            - { name: Item, kind: function, value: { ref: itemFn } }
            - { name: lamp, kind: const, value: { ref: lampObj } }
            - { name: mug, kind: const, value: { ref: mugObj } }
          heap:
            itemFn: { kind: object, ctor: "function Item", props: { prototype: { ref: proto } } }
            proto: { kind: object, ctor: "Item.prototype", props: { constructor: { ref: itemFn }, describe: { ref: describeFn } } }
            describeFn: { kind: function, name: describe }
            lampObj: { kind: object, props: { name: "%%lamp%%", price: 45, "[[Prototype]]": { ref: proto } } }
            mugObj: { kind: object, props: { name: "%%mug%%", price: 18, "[[Prototype]]": { ref: proto } } }

  - id: predict-new
    kind: prediction
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
    prompt:
      uk: "Конструктор `Item` і два екземпляри. Що з’явиться в консолі?"
      en: "A constructor `Item` and two instances. What appears in the console?"
    code: |
      function Item(name, price) {
        this.name = name;
        this.price = price;
      }
      Item.prototype.describe = function () {
        return this.name + " " + this.price;
      };

      const first = new Item("%%lamp%%", 45);
      const second = new Item("%%mug%%", 18);

      console.log(first.describe === second.describe);
      console.log(Object.getPrototypeOf(first) === Item.prototype);
      console.log(Object.hasOwn(first, "describe"));
      try {
        Item("x", 1);
        console.log("created");
      } catch (error) {
        console.log(error.name);
      }
    verify:
      logs: ["true", "true", "false", "TypeError"]
    answer:
      type: choice
      options:
        - id: shared-and-fails
          code: "true\ntrue\nfalse\nTypeError"
        - id: copied
          code: "false\ntrue\ntrue\nTypeError"
          why:
            uk: "`new` не копіює методи в екземпляри: `describe` лежить один раз в `Item.prototype`, і обидва екземпляри знаходять саме її — тому `true`, а власної `describe` в екземплярі немає — `false`."
            en: "`new` does not copy methods into instances: `describe` lies once in `Item.prototype`, and both instances find that very function — hence `true`, while the instance has no own `describe` — `false`."
        - id: without-new-works
          code: "true\ntrue\nfalse\ncreated"
          why:
            uk: "Без `new` `Item(\"x\", 1)` — звичайний виклик без об’єкта перед крапкою: `this` дорівнює `undefined`, і `this.name = name` кидає `TypeError`. Жодного об’єкта ніхто не створює."
            en: "Without `new`, `Item(\"x\", 1)` is an ordinary call with no object before the dot: `this` is `undefined`, and `this.name = name` throws a `TypeError`. Nobody creates an object."
        - id: wrong-prototype
          code: "true\nfalse\nfalse\nTypeError"
          why:
            uk: "Саме `new` зв’язує прототип створеного об’єкта з `Item.prototype`, тож `Object.getPrototypeOf(first) === Item.prototype` — `true`."
            en: "It is `new` that links the created object’s prototype to `Item.prototype`, so `Object.getPrototypeOf(first) === Item.prototype` is `true`."
      correct: [shared-and-fails]
    explanation:
      uk: "Обидва екземпляри через прототип знаходять одну й ту саму функцію `describe` (`true`), а прототип кожного з них — `Item.prototype` (`true`). Власної `describe` у `first` немає (`false`). А виклик без `new` — це звичайний виклик: `this` порожній, і запис `this.name = …` кидає `TypeError`."
      en: "Through the prototype both instances find one and the same function `describe` (`true`), and the prototype of each is `Item.prototype` (`true`). `first` has no own `describe` (`false`). And a call without `new` is an ordinary call: `this` is empty, and the write `this.name = …` throws a `TypeError`."

  - id: forgotten-new
    kind: explanation
    title:
      uk: "Коли new забули"
      en: "When new is forgotten"
    body:
      uk: |
        Конструктор — звичайна функція, і JavaScript не зупинить тебе, якщо викликати її без `new`. Тоді не буде ні нового об’єкта, ні зв’язку з прототипом, а `this` визначатиметься за звичайними правилами — з першого уроку цього розділу. У модулі це `undefined`, і перше ж `this.name = name` кине `TypeError`, що добре: помилку видно одразу. У не-строгому коді (наприклад, у старому скрипті, підключеному без `type="module"`) `this` був би глобальним об’єктом сторінки `window`, і властивості мовчки з’явилися б **на ньому**: після `Item("Lamp", 45)` ти знайшов би `"Lamp"` у `window.name`. Це один з найвідоміших ляпів старого JavaScript.

        Те, що конструктор можна викликати без `new`, — слабке місце цього способу. У наступному уроці ти побачиш `class`, який без `new` викликати не дозволяє.

        Стрілкову функцію конструктором зробити не можна: у неї немає ні власного `this`, ні `prototype`, і `new` на ній кидає `TypeError`.
      en: |
        A constructor is an ordinary function, and JavaScript will not stop you from calling it without `new`. Then there is no new object and no link to a prototype, and `this` follows the usual rules — from the first lesson of this unit. In a module it is `undefined`, and the very first `this.name = name` throws a `TypeError`, which is good: the mistake shows at once. In non-strict code (for example an old script loaded without `type="module"`) `this` would be the page’s global object `window`, and the properties would silently appear **on it**: after `Item("Lamp", 45)` you would find `"Lamp"` in `window.name`. This is one of the most famous slips of old JavaScript.

        That a constructor can be called without `new` is the weak spot of this approach. In the next lesson you will see `class`, which does not allow a call without `new`.

        An arrow function cannot be a constructor: it has neither its own `this` nor a `prototype`, and `new` on it throws a `TypeError`.

  - id: shared-methods
    kind: example
    runtime: browser-js
    dir: shared-methods
    entry: index.js
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
    title:
      uk: "Спільний метод чи копія в кожному?"
      en: "A shared method or a copy in each?"
    body:
      uk: |
        Конструктор `Item` з методом на прототипі й два екземпляри. Натисни **Запустити**: зверни увагу на третій рядок консолі (`lamp.describe === mug.describe`) і на четвертий — які власні поля має `lamp`.
      en: |
        A constructor `Item` with a method on the prototype and two instances. Press **Run**: look at the third console line (`lamp.describe === mug.describe`) and at the fourth — which own fields `lamp` has.
    tryIt:
      uk: |
        1. Консоль: два описи, `true`, `name, price` і `true`. Метод спільний і не входить у власні поля.
        2. Видали блок `Item.prototype.describe = function () { … };`, а всередину `Item` додай рядок коду `this.describe = function () { return this.name + ": " + this.price; };`. Запусти: тепер `false` — кожен екземпляр має **власну** копію функції, а в списку полів з’явився `describe`.
        3. Поверни метод на прототип (Ctrl+Z, на Mac — Cmd+Z): копій знову немає.
      en: |
        1. Console: two descriptions, `true`, `name, price` and `true`. The method is shared and is not among the own fields.
        2. Delete the block `Item.prototype.describe = function () { … };` and add the line `this.describe = function () { return this.name + ": " + this.price; };` inside `Item`. Run: now it is `false` — every instance has its **own** copy of the function, and `describe` appeared in the list of fields.
        3. Put the method back on the prototype (Ctrl+Z, or Cmd+Z on a Mac): there are no copies again.

  - id: recall
    kind: review
    title:
      uk: "Згадай: дві назви — один об’єкт"
      en: "Recall: two names, one object"
    items:
      - id: same-object
        from: js-04-07-reference-identity
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          const first = { price: 45 };
          const second = first;
          const third = { price: 45 };
          second.price = 60;
          console.log(first.price);
          console.log(first === second);
          console.log(first === third);
        verify:
          logs: ["60", "true", "false"]
        answer:
          type: choice
          options:
            - id: reference
              code: "60\ntrue\nfalse"
            - id: copy
              code: "45\nfalse\nfalse"
              why:
                uk: "`const second = first` не копіює об’єкт, а копіює **посилання**: обидві змінні ведуть до одного об’єкта, тож зміна через `second` видна й через `first`."
                en: "`const second = first` does not copy the object, it copies the **reference**: both names lead to one object, so a change through `second` is visible through `first` too."
            - id: by-content
              code: "60\ntrue\ntrue"
              why:
                uk: "`===` для об’єктів порівнює не вміст, а те, чи це той самий об’єкт. `third` — окремий об’єкт, хоч і з тією самою ціною."
                en: "For objects `===` compares not the contents but whether it is the same object. `third` is a separate object, even with the same price."
          correct: [reference]
        explanation:
          uk: "Кожен літерал `{ … }` створює новий об’єкт, і кожен `new Item(…)` теж: два екземпляри з однаковими полями — різні об’єкти. А от метод на прототипі — це **один** об’єкт-функція, на який посилаються всі екземпляри."
          en: "Every literal `{ … }` creates a new object, and so does every `new Item(…)`: two instances with identical fields are different objects. A method on the prototype, on the other hand, is **one** function object that every instance refers to."

  - id: habit-log
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: habit-log
    entry: index.js
    strings:
      water: { uk: "Пити воду", en: "Drink water" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
    title:
      uk: "Журнал звички"
      en: "A habit log"
    instructions:
      uk: |
        Напиши конструктор `HabitLog` для трекера звичок.

        - `new HabitLog(name)` створює журнал із власними полями `name` та `dates` — порожнім масивом дат.
        - `markDone(date)` запам’ятовує дату, але **лише раз**: повторний запис тієї самої дати нічого не змінює.
        - `count()` повертає, скільки різних дат запам’ятовано.
        - Методи `markDone` і `count` мають лежати на `HabitLog.prototype`, а масив дат — у кожного журналу свій.

        Унизу файла два журнали: `water` отримує три виклики (дві різні дати), `walk` — жодного. У консолі має з’явитися `2` і `0`.
      en: |
        Write a constructor `HabitLog` for a habit tracker.

        - `new HabitLog(name)` creates a log with own fields `name` and `dates` — an empty array of dates.
        - `markDone(date)` remembers the date, but **only once**: writing the same date again changes nothing.
        - `count()` returns how many different dates are remembered.
        - The methods `markDone` and `count` must lie on `HabitLog.prototype`, while the array of dates is separate for every log.

        At the bottom of the file there are two logs: `water` gets three calls (two different dates), `walk` gets none. The console must show `2` and `0`.
    testTitles:
      "the program prints two dates for water and none for walk":
        uk: "Програма друкує дві дати для води й жодної для прогулянки"
        en: "The program prints two dates for water and none for walk"
      "a new log starts with its name and no dates":
        uk: "Новий журнал починається з назви й без дат"
        en: "A new log starts with its name and no dates"
      "markDone remembers each date once":
        uk: "markDone запам’ятовує кожну дату один раз"
        en: "markDone remembers each date once"
      "two logs count independently":
        uk: "Два журнали рахують незалежно"
        en: "Two logs count independently"
      "markDone and count are shared through the prototype":
        uk: "markDone і count спільні через прототип"
        en: "markDone and count are shared through the prototype"
    hints:
      nudge:
        uk: "Що має бути **власним** у кожного журналу, а що — спільним для всіх? Де ці два види речей записують: у тілі конструктора чи на прототипі?"
        en: "What must be **own** to every log, and what shared by all? Where are these two kinds of things written: in the body of the constructor or on the prototype?"
      explanation:
        uk: "У тілі конструктора через `this.…` створюють поля, які є в кожного екземпляра окремо: `name` і масив дат. Методи присвоюють через `HabitLog.prototype.…`, і вони читають поля свого екземпляра через `this`. Масив, створений на прототипі, був би спільним для всіх журналів. Щоб запам’ятати дату один раз, спершу перевір, чи вона вже є в масиві."
        en: "In the body of the constructor, `this.…` creates the fields that every instance has separately: `name` and the array of dates. Methods are assigned through `HabitLog.prototype.…` and read the fields of their instance through `this`. An array created on the prototype would be shared by all logs. To remember a date once, first check whether it is already in the array."
    solutionNote:
      uk: "Конструктор створює власні `name` і `dates` для кожного екземпляра, а методи лежать на прототипі й працюють із `this`. Якщо створити масив `dates` на прототипі, усі журнали ділитимуть один масив і рахуватимуть спільно."
      en: "The constructor creates own `name` and `dates` for every instance, and the methods lie on the prototype and work with `this`. If the array `dates` is created on the prototype, all logs will share one array and count together."
    feedback:
      - when: { test: "the program prints two dates for water and none for walk" }
        message:
          uk: "Ця перевірка очікує в консолі два рядки: `2` (для `water`) і `0` (для `walk`). Дві різні дати рахуються, повтор — ні, а `walk` ніхто не чіпав."
          en: "This check expects two console lines: `2` (for `water`) and `0` (for `walk`). Two different dates count, a repeat does not, and nobody touched `walk`."
      - when: { test: "a new log starts with its name and no dates" }
        message:
          uk: "Ця перевірка створює новий журнал через `new HabitLog(...)` і очікує в ньому поле `name` та `count()`, що дорівнює 0."
          en: "This check creates a new log with `new HabitLog(...)` and expects the field `name` and a `count()` equal to 0."
      - when: { test: "markDone remembers each date once" }
        message:
          uk: "Ця перевірка двічі записує одну дату й очікує `count()` = 1, а після другої, іншої дати — 2."
          en: "This check writes one date twice and expects `count()` = 1, and 2 after a second, different date."
      - when: { test: "two logs count independently" }
        message:
          uk: "Ця перевірка записує дату в один новий журнал і очікує, що в іншому новому `count()` лишається 0: кожен журнал має свій масив дат."
          en: "This check writes a date into one new log and expects `count()` to stay 0 in another new log: every log has its own array of dates."
      - when: { test: "markDone and count are shared through the prototype" }
        message:
          uk: "Ця перевірка очікує, що прототип журналу — `HabitLog.prototype`, що `markDone` та `count` двох журналів — одна й та сама функція і що в самого журналу їх немає серед власних властивостей."
          en: "This check expects the prototype of a log to be `HabitLog.prototype`, `markDone` and `count` of two logs to be one and the same function, and neither of them to be an own property of a log."

  - id: to-project
    kind: transfer
    capstoneStep: JS-11
    body:
      uk: "Репозиторій твого проєкту можна зібрати саме так: конструктор зі сховищем у власному полі й методами на прототипі. Далі ти запишеш те саме коротше — через `class`, а також приватним полем сховаєш дані від випадкової зміни."
      en: "The repository of your project can be built exactly like this: a constructor with storage in an own field and methods on the prototype. Next you will write the same thing more briefly with `class`, and hide the data from accidental changes with a private field."
