id: js-11-09-independent-adapters
unit: JS-11
title:
  uk: "Самостійно: адаптер-клас і композиційний адаптер"
  en: "Independent: a class adapter and a compositional adapter"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Перевірка без підказок: чи вмієш ти сам реалізувати одне сховище двічі — класом із приватним полем, getter-ом і статичною фабрикою та фабрикою, що тримає колаборатора, — щоб один набір перевірок проходили обидва варіанти, і чи можеш обґрунтувати вибір між ними для нової вимоги. Це саме те, що ти зробиш з репозиторієм свого проєкту."
  en: "A check without hints: can you implement one store twice on your own — as a class with a private field, a getter and a static factory, and as a factory that holds a collaborator — so that both designs pass one set of checks, and can you justify the choice between them for a new requirement? This is exactly what you will do with the repository of your project."
objectives:
  - uk: "Самостійно реалізувати сховище «ключ — значення» двічі: класом із приватним полем, getter-ом лише для читання та статичною фабрикою, і фабрикою, що тримає колаборатора-сховище, — так, щоб один набір перевірок проходили обидва варіанти."
    en: "Implement, without hints, one key-value store twice — as a class with a private field, a read-only getter and a static factory, and as a factory function that holds a storage collaborator — so that one shared set of checks passes for both."
  - uk: "Обґрунтувати, який варіант залишити для заданої нової вимоги, і назвати компроміс кожного з них."
    en: "Justify which design to keep for a stated change request, and name a tradeoff for each design."
prerequisites: [js-11-08-debug-lost-this-inherited]
subskills:
  - { family: J-06, skill: "methods/getters/setters/property descriptors reading", depth: assess }
  - { family: J-06, skill: "classes/private/static fields", depth: assess }
  - { family: J-06, skill: "inheritance vs composition", depth: assess }
  - { family: J-06, skill: "object model tradeoffs", depth: assess }
glossary: []

blocks:
  - id: key-value-store
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: key-value-store
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
    title:
      uk: "Сховище «ключ — значення» двома способами"
      en: "A key-value store in two ways"
    instructions:
      uk: |
        Реалізуй те саме сховище «ключ — значення» двічі. Обидва варіанти мають поводитися однаково, тож одні й ті самі перевірки проганяють на обох. Підказок у цьому завданні немає.

        **1. Клас `KeyValueStore`** (конструктор без аргументів):

        - записи тримай у **приватному** полі: у самого об’єкта не має бути жодної власної властивості;
        - `get(key)` повертає значення або `undefined`, якщо такого ключа немає, — у тому числі для назв, які об’єкти успадковують, як-от `"toString"`;
        - `set(key, value)` записує значення; повторний запис того самого ключа замінює його;
        - `delete(key)` прибирає запис і повертає `true`; якщо ключа не було — повертає `false`;
        - `size` — getter лише для читання: кількість записів; присвоєння `store.size = …` має кидати `TypeError`;
        - статичний метод `KeyValueStore.fromEntries(entries)` будує сховище зі списку пар `[ключ, значення]`; для повторного ключа діє пізніший запис. Якщо `entries` — не масив, або елемент — не масив із двох значень, або ключ — не текст, він кидає `TypeError`.

        **2. Фабрика `createKeyValueStore(storage)`.** Параметр `storage` — об’єкт із методами `load()` (повертає **нову** копію: звичайний об’єкт з усіма записами) і `save(data)` (замінює всі записи на `data`). Фабрика повертає об’єкт з тими самими `get`, `set`, `delete` і `size`, що й клас. Вона не тримає власної копії записів: кожен виклик питає сховище, а зміни записує назад у нього.

        Унизу файла готове демо: у консолі має з’явитися `3`, потім нова назва й `1`.
      en: |
        Implement the same key-value store twice. Both designs must behave the same, so the same checks run against both. There are no hints in this task.

        **1. The class `KeyValueStore`** (a constructor with no arguments):

        - keep the entries in a **private** field: the object itself must have no own properties;
        - `get(key)` returns the value, or `undefined` if there is no such key — including for names that objects inherit, like `"toString"`;
        - `set(key, value)` stores the value; writing the same key again replaces it;
        - `delete(key)` removes the entry and returns `true`; if the key was not there, it returns `false`;
        - `size` is a read-only getter: the number of entries; assigning `store.size = …` must throw a `TypeError`;
        - the static method `KeyValueStore.fromEntries(entries)` builds a store from a list of `[key, value]` pairs; for a repeated key the later entry wins. If `entries` is not an array, or an item is not an array of two values, or the key is not text, it throws a `TypeError`.

        **2. The factory `createKeyValueStore(storage)`.** The parameter `storage` is an object with the methods `load()` (returns a **fresh** copy: an ordinary object with all the entries) and `save(data)` (replaces all the entries with `data`). The factory returns an object with the same `get`, `set`, `delete` and `size` as the class. It keeps no copy of the entries of its own: every call asks the storage, and changes are written back into it.

        At the bottom of the file there is a ready demo: the console must show `3`, then the new name and `1`.
    testTitles:
      "the program prints 3, the new name and 1":
        uk: "Програма друкує 3, нову назву й 1"
        en: "The program prints 3, the new name and 1"
      "both designs store, read and overwrite entries":
        uk: "Обидва варіанти записують, читають і перезаписують"
        en: "Both designs store, read and overwrite entries"
      "both designs answer undefined for a missing key, even for inherited names":
        uk: "Обидва варіанти дають undefined для відсутнього ключа, навіть для успадкованих назв"
        en: "Both designs answer undefined for a missing key, even for inherited names"
      "both designs delete an entry and say whether it existed":
        uk: "Обидва варіанти видаляють запис і кажуть, чи він був"
        en: "Both designs delete an entry and say whether it existed"
      "both designs count their entries in size":
        uk: "Обидва варіанти рахують записи в size"
        en: "Both designs count their entries in size"
      "size is a read-only getter in both designs":
        uk: "size — getter лише для читання в обох варіантах"
        en: "size is a read-only getter in both designs"
      "class: the entries are private":
        uk: "Клас: записи приватні"
        en: "Class: the entries are private"
      "class: fromEntries is a static factory that builds a store":
        uk: "Клас: fromEntries — статична фабрика, що будує сховище"
        en: "Class: fromEntries is a static factory that builds a store"
      "class: fromEntries rejects malformed input with a TypeError":
        uk: "Клас: fromEntries відхиляє неправильні дані через TypeError"
        en: "Class: fromEntries rejects malformed input with a TypeError"
      "factory: it reads from and writes through the storage it holds":
        uk: "Фабрика: читає зі сховища й записує в нього"
        en: "Factory: it reads from and writes through the storage it holds"
      "factory: it keeps no copy of its own, so two stores over one storage agree":
        uk: "Фабрика: не тримає власної копії, тож два сховища над одним зберіганням узгоджені"
        en: "Factory: it keeps no copy of its own, so two stores over one storage agree"
      "factory: stores over different storages stay independent":
        uk: "Фабрика: сховища над різними зберіганнями незалежні"
        en: "Factory: stores over different storages stay independent"
    solutionNote:
      uk: "Клас ховає записи в `#data`, а `size` — getter на прототипі без setter. Для відсутнього ключа `get` питає `Object.hasOwn`, щоб успадковане `toString` не вважалося записом; `fromEntries` перевіряє форму даних, перш ніж створити екземпляр. Фабрика не зберігає нічого сама: кожен виклик бере свіжу копію через `storage.load()`, а зміни повертає через `storage.save(…)`. Тому два об’єкти над одним сховищем бачать зміни одне одного, а `size` — власний getter без setter у літералі."
      en: "The class hides the entries in `#data`, and `size` is a getter on the prototype with no setter. For a missing key `get` asks `Object.hasOwn`, so that an inherited `toString` does not count as an entry; `fromEntries` checks the shape of the data before creating an instance. The factory stores nothing itself: every call takes a fresh copy through `storage.load()` and puts changes back through `storage.save(…)`. That is why two objects over one storage see each other’s changes, and `size` is an own getter with no setter in the literal."
    feedback:
      - when: { test: "the program prints 3, the new name and 1" }
        message:
          uk: "Ця перевірка очікує три рядки консолі: `3` (розмір сховища після `fromEntries` і `set`), назву, яку записали останньою для `w-01` через фабрику, і `1` (розмір сховища фабрики)."
          en: "This check expects three console lines: `3` (the size of the store after `fromEntries` and `set`), the name written last for `w-01` through the factory, and `1` (the size of the factory’s store)."
      - when: { test: "both designs store, read and overwrite entries" }
        message:
          uk: "Ця перевірка записує й читає значення для обох варіантів, перезаписує той самий ключ і зберігає `null`. `get` має повертати те, що записали останнім."
          en: "This check writes and reads values for both designs, overwrites the same key and stores `null`. `get` must return what was written last."
      - when: { test: "both designs answer undefined for a missing key, even for inherited names" }
        message:
          uk: "Ця перевірка питає в порожніх сховищ про ключі `\"w-09\"`, `\"toString\"` і `\"constructor\"` і очікує `undefined`. Назви, які об’єкти успадковують, не є записами сховища."
          en: "This check asks the empty stores about the keys `\"w-09\"`, `\"toString\"` and `\"constructor\"` and expects `undefined`. Names that objects inherit are not entries of the store."
      - when: { test: "both designs delete an entry and say whether it existed" }
        message:
          uk: "Ця перевірка очікує, що `delete` повертає `true` для наявного ключа, після цього `get` дає `undefined`, а повторний `delete` і `delete(\"toString\")` для ненаписаного ключа повертають `false`."
          en: "This check expects `delete` to return `true` for an existing key, `get` to give `undefined` afterwards, and a repeated `delete` and `delete(\"toString\")` for a key that was never set to return `false`."
      - when: { test: "both designs count their entries in size" }
        message:
          uk: "Ця перевірка очікує `size` рівним 0 у порожнього сховища, 2 після трьох записів у два ключі й 1 після видалення. `size` читають як число, без дужок."
          en: "This check expects `size` to be 0 for an empty store, 2 after three writes to two keys and 1 after a delete. `size` is read as a number, without brackets."
      - when: { test: "size is a read-only getter in both designs" }
        message:
          uk: "Ця перевірка шукає дескриптор `size` у самого об’єкта чи в його прототипах: має бути функція `get` і жодного `set`; присвоєння `store.size = 99` має кидати `TypeError`."
          en: "This check looks for the descriptor of `size` on the object itself or in its prototypes: there must be a `get` function and no `set`; assigning `store.size = 99` must throw a `TypeError`."
      - when: { test: "class: the entries are private" }
        message:
          uk: "Ця перевірка очікує, що в екземпляра `KeyValueStore` немає жодної власної властивості (навіть після `set`) і що `JSON.stringify` дає `{}`. Для цього записи тримають у приватному полі `#…`."
          en: "This check expects an instance of `KeyValueStore` to have no own properties (even after `set`) and `JSON.stringify` to give `{}`. For that the entries are kept in a private `#…` field."
      - when: { test: "class: fromEntries is a static factory that builds a store" }
        message:
          uk: "Ця перевірка викликає `KeyValueStore.fromEntries` із трьома парами, двома різними ключами, і очікує екземпляр `KeyValueStore` із розміром 2, де для повторного ключа діє пізніший запис; на екземплярі `fromEntries` бути не має."
          en: "This check calls `KeyValueStore.fromEntries` with three pairs and two different keys and expects a `KeyValueStore` instance of size 2 where the later entry wins for the repeated key; an instance must not have `fromEntries`."
      - when: { test: "class: fromEntries rejects malformed input with a TypeError" }
        message:
          uk: "Ця перевірка дає `fromEntries` шість неправильних вхідних значень — текст, `undefined`, пару з одним чи трьома елементами, ключ не текстом і елемент, що не є масивом, — і очікує для кожного саме `TypeError`."
          en: "This check gives `fromEntries` six malformed inputs — text, `undefined`, a pair with one or three items, a key that is not text and an entry that is not an array — and expects exactly a `TypeError` for each."
      - when: { test: "factory: it reads from and writes through the storage it holds" }
        message:
          uk: "Ця перевірка дає фабриці сховище, у якому вже є запис, і очікує, що `get` та `size` його бачать, а після `set` і `delete` у самому сховищі (`storage.data`) лежать саме очікувані записи."
          en: "This check gives the factory a storage that already holds an entry and expects `get` and `size` to see it, and after `set` and `delete` the storage itself (`storage.data`) to hold exactly the expected entries."
      - when: { test: "factory: it keeps no copy of its own, so two stores over one storage agree" }
        message:
          uk: "Ця перевірка створює два об’єкти над одним сховищем: другий має прочитати те, що записав перший, а перший — побачити видалення, зроблене другим. Кожен виклик має питати сховище, а не користуватися копією, зробленою раніше."
          en: "This check creates two objects over one storage: the second must read what the first wrote, and the first must see a deletion made by the second. Every call must ask the storage, not use a copy made earlier."
      - when: { test: "factory: stores over different storages stay independent" }
        message:
          uk: "Ця перевірка створює два об’єкти над різними сховищами, записує в один і очікує, що другий лишається порожнім, а його сховище — `{}`."
          en: "This check creates two objects over different storages, writes into one and expects the other to stay empty, and its storage to be `{}`."

  - id: recall
    kind: review
    title:
      uk: "Згадай: підроблене сховище чи справжній доказ"
      en: "Recall: a fake storage versus real evidence"
    items:
      - id: fake-versus-real
        from: js-09-05-mocks-vs-real
        prompt:
          uk: "Перевірки фабрики `createKeyValueStore` працюють із підробним сховищем у пам’яті. Усі вони зелені. Який висновок це виправдовує?"
          en: "The checks of the factory `createKeyValueStore` work with a fake in-memory storage. All of them are green. Which conclusion does that justify?"
        answer:
          type: choice
          options:
            - id: logic-only
              text:
                uk: "Логіка фабрики — читання, запис, лічильник — працює з інтерфейсом `load`/`save`, який ми припустили. Те, що справжнє сховище (наприклад, `localStorage`, де лежить лише текст) поводиться так само, ця перевірка не доводить."
                en: "The logic of the factory — reading, writing, counting — works with the `load`/`save` interface we assumed. That a real storage (for example `localStorage`, which holds only text) behaves the same, this check does not prove."
            - id: works-everywhere
              text:
                uk: "Фабрика працюватиме з будь-яким справжнім сховищем, бо підробне було таким самим."
                en: "The factory will work with any real storage, because the fake one was the same."
              why:
                uk: "Підробка поводиться лише так, як її написали. Справжнє сховище може мати обмеження (текстові значення, ліміт місця, помилки запису), яких у підробки немає."
                en: "A fake behaves only as it was written. A real storage may have limits (text-only values, a size limit, write errors) that the fake does not have."
            - id: proves-nothing
              text:
                uk: "Ці перевірки нічого не доводять, бо сховище підроблене."
                en: "These checks prove nothing, because the storage is fake."
              why:
                uk: "Підробка якраз і дає змогу перевірити власну логіку швидко й без побічних ефектів. Просто її доказ має межі, і справжнє сховище перевіряють окремо."
                en: "A fake is exactly what lets you check your own logic quickly and with no side effects. Its evidence just has limits, and the real storage is checked separately."
          correct: [logic-only]
        explanation:
          uk: "Підробне сховище доводить, що **твоя** логіка правильна щодо припущеного інтерфейсу, і робить перевірки швидкими й повторюваними. Справжню поведінку `localStorage` доводить лише запуск із ним, наприклад ручна перевірка в проєкті на сторінці. Дві різні межі доказу — не плутай їх."
          en: "A fake storage proves that **your** logic is right against the assumed interface, and makes the checks fast and repeatable. The real behavior of `localStorage` is proven only by running with it, for example a manual check in the project on the page. These are two different limits of evidence — do not mix them up."

  - id: choose-for-expiry
    kind: prediction
    prompt:
      uk: "Нова вимога: записи сховища мають **спливати** через заданий час (наприклад, 60 секунд). Який план порушить найменше з наявного коду й чому?"
      en: "A new requirement: the store’s entries must **expire** after a set time (say, 60 seconds). Which plan disturbs the least of the existing code, and why?"
    answer:
      type: choice
      options:
        - id: wrap
          text:
            uk: "Написати обгортку `withExpiry(store, seconds, now)`: вона тримає наявне сховище, пам’ятає час запису й делегує йому `get`, `set`, `delete`. Час `now` передається параметром, тож у перевірках його підміняють."
            en: "Write a wrapper `withExpiry(store, seconds, now)`: it holds the existing store, remembers the time of writing and delegates `get`, `set` and `delete` to it. The time `now` is passed in as a parameter, so checks can replace it."
        - id: subclass
          text:
            uk: "Зробити `ExpiringStore extends KeyValueStore` і перекрити `get` та `set`: викликачі нічого не помітять."
            en: "Make `ExpiringStore extends KeyValueStore` and override `get` and `set`: callers will notice nothing."
          why:
            uk: "Підклас залежить від того, як базовий клас працює всередині: що робить `fromEntries`, чи викликає `size` чи `delete` інші методи. Зміна в базовому легко порушить підклас (як із подвійним підрахунком), а приватне `#data` йому недоступне."
            en: "A subclass depends on how the base class works inside: what `fromEntries` does, whether `size` or `delete` call other methods. A change in the base can easily break the subclass (as with the double count), and the private `#data` is not available to it."
        - id: edit-class
          text:
            uk: "Дописати час спливання в кожен запис усередині `KeyValueStore` і змінити формат збереження."
            en: "Add an expiry time to every entry inside `KeyValueStore` and change the storage format."
          why:
            uk: "Це змінює і клас, і дані: усі збережені раніше записи не мають часу спливання, а фабрика й клас розійдуться. Нова поведінка не має зачіпати наявні модулі."
            en: "That changes both the class and the data: all entries saved earlier have no expiry time, and the factory and the class will drift apart. A new behavior should not touch the existing modules."
        - id: clock-inside
          text:
            uk: "Викликати `Date.now()` прямо в `get` обох варіантів, нічого більше не змінюючи."
            en: "Call `Date.now()` straight inside the `get` of both designs and change nothing else."
          why:
            uk: "Без збереженого часу запису нема з чим порівнювати, а прихований виклик годинника робить перевірки нестабільними: результат залежить від того, коли їх запустили."
            en: "Without a stored time of writing there is nothing to compare with, and a hidden clock call makes checks unstable: the result depends on when they were run."
      correct: [wrap]
    explanation:
      uk: "Обгортка (композиція) залежить лише від публічного інтерфейсу `get`/`set`/`delete`, тож працює з класом і з фабрикою однаково, а передача часу параметром робить її тестованою. Підклас прив’язаний до внутрішніх деталей базового класу — це проблема крихкого базового класу."
      en: "A wrapper (composition) depends only on the public interface `get`/`set`/`delete`, so it works with the class and with the factory alike, and passing the time as a parameter makes it testable. A subclass is tied to the internal details of the base class — the fragile base class problem."

  - id: tradeoffs
    kind: prediction
    prompt:
      uk: "Обери **всі** правильні твердження про два рішення з цього уроку: клас із `#data` і фабрику з колаборатором."
      en: "Choose **all** the true statements about the two designs of this lesson: the class with `#data` and the factory with a collaborator."
    answer:
      type: multi
      options:
        - id: json-empty
          text:
            uk: "`JSON.stringify` екземпляра класу з лише приватними полями дає `{}`: щоб зберегти його, потрібен власний метод, що віддає дані."
            en: "`JSON.stringify` of a class instance with only private fields gives `{}`: to save it you need a method of your own that hands out the data."
        - id: closure-privacy
          text:
            uk: "Фабрика теж ховає стан — у змінних замикання й у колаборатора, — тож приватність не вимагає класу; але `instanceof` до її результату не застосуєш."
            en: "A factory hides state too — in closure variables and in the collaborator — so privacy does not require a class; but `instanceof` cannot be applied to its result."
        - id: fake-collaborator
          text:
            uk: "Фабрику легко перевіряти: колаборатора передають параметром, тож у перевірках підставляють підробного."
            en: "A factory is easy to check: the collaborator is passed in as a parameter, so checks substitute a fake one."
        - id: subclass-safe
          text:
            uk: "Підклас безпечно перекриває будь-який метод, навіть не знаючи, як базовий клас ним користується."
            en: "A subclass can safely override any method without knowing how the base class uses it."
          why:
            uk: "Саме це й ламається: базовий клас може викликати перекритий метод всередині, а підклас про це не знає."
            en: "That is exactly what breaks: the base class may call the overridden method inside, and the subclass does not know that."
        - id: composition-worse
          text:
            uk: "Композиція завжди дає більше коду, тож для невеликих моделей це гірший вибір."
            en: "Composition always means more code, so it is a worse choice for small models."
          why:
            uk: "Кількість рядків — не критерій: обгортка зазвичай коротка, а ціна успадкування з’являється пізніше, коли базовий клас змінюють."
            en: "The number of lines is not the criterion: a wrapper is usually short, and the cost of inheritance appears later, when the base class is changed."
      correct: [json-empty, closure-privacy, fake-collaborator]
    explanation:
      uk: "Приватні поля класу не потрапляють у JSON, тож серіалізацію пишуть окремо. Приватність дають і замикання, а колаборатор, переданий параметром, полегшує тестування. Підклас, що перекриває методи наосліп, — це крихкий базовий клас, а «більше коду» не робить композицію гіршою."
      en: "The private fields of a class do not get into JSON, so serialization is written separately. Closures give privacy too, and a collaborator passed in as a parameter makes testing easier. A subclass that overrides methods blindly is a fragile base class, and “more code” does not make composition worse."
