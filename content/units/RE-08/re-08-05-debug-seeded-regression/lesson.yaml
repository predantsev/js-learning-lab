id: re-08-05-debug-seeded-regression
unit: RE-08
title:
  uk: "Налагодження: закладена регресія"
  en: "Debug: a seeded regression"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "За допомогою тесту, що падає, знайти закладену регресію: ефект без cleanup дублює підписку, і список показує подвоєні рядки."
    en: "Find, with a failing behavioral test, a seeded regression where an effect without cleanup duplicates a subscription and the list shows doubled rows."
  - uk: "Виправити її, не вимикаючи Strict Mode, і додати тест, який упіймав би цю регресію."
    en: "Repair it and add a test that would have caught it, with Strict Mode left on."
prerequisites: [re-08-04-verify-locally-explain, re-03-05-strict-mode-rechecks]
subskills:
  - { family: R-10, skill: "behavioral component/integration/user tests", depth: assess }
  - { family: R-10, skill: "effect cleanup", depth: assess }
glossary: []
selfCheck: [rows-after-publish, repair-feed]

blocks:
  - id: seeded
    kind: explanation
    title:
      uk: "Регресія: те, що працювало, зламалося"
      en: "A regression: what worked is broken"
    body:
      uk: |
        **Регресія** — це дефект там, де все вже працювало: хтось «прибрав зайве» в ефекті, і стара поведінка зламалася. У цьому уроці регресію **закладено** навмисно: у стрічці виконань звичок кожне нове виконання раптом з’являється двічі.

        Порядок роботи той самий, що й на контрольній точці:

        1. **Відтворити**: запустити застосунок і тест, що падає.
        2. **Знайти причину**, а не симптом: що саме подвоює рядок.
        3. **Виправити** причину.
        4. **Залишити тест**, який упіймав би цю регресію, — [[regression-test|регресійний тест]]. Він має дивитися на те, що бачить людина, і падати на старому коді.
      en: |
        A **regression** is a defect where everything already worked: someone “removed the extra bits” in an effect, and old behavior broke. In this lesson the regression is **seeded** on purpose: in the habit completions feed every new completion suddenly appears twice.

        The way to work is the same as at the checkpoint:

        1. **Reproduce**: run the app and a failing test.
        2. **Find the cause**, not the symptom: what exactly doubles the row.
        3. **Fix** the cause.
        4. **Keep a test** that would have caught this regression — a [[regression-test]]. It must look at what a person sees and fail on the old code.

  - id: rows-after-publish
    kind: prediction
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
    prompt:
      uk: "`HabitFeed` змонтовано в `<StrictMode>` під час розробки. `subscribe` викликає кожного свого підписника з кожним новим виконанням. Стрічка отримує одне виконання «Ранкова зарядка». Скільки рядків з’явиться в списку?"
      en: "`HabitFeed` is mounted inside `<StrictMode>` during development. `subscribe` calls every one of its subscribers with every new completion. The feed receives one completion “Morning exercise”. How many rows appear in the list?"
    code: |
      function HabitFeed() {
        const [records, setRecords] = useState([]);

        useEffect(() => {
          subscribe((record) => {
            setRecords((current) => [...current, record]);
          });
        }, []);

        return (
          <ul>
            {records.map((record) => (
              <li key={record.id}>{record.habit}</li>
            ))}
          </ul>
        );
      }
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: two
          text: { uk: "Два однакові рядки", en: "Two identical rows" }
        - id: one
          text: { uk: "Один рядок", en: "One row" }
          why:
            uk: "StrictMode запускає ефект за схемою setup → cleanup → setup. Ефект нічого не повертає, тож прибрати першу підписку нічим: на стрічці дві підписки, і кожна додає запис."
            en: "StrictMode runs the effect as setup → cleanup → setup. The effect returns nothing, so there is nothing to remove the first subscription: the feed has two subscriptions, and each appends the record."
        - id: one-throws-away
          text: { uk: "Один рядок, бо React відкидає результат першого setup", en: "One row, because React throws away the result of the first setup" }
          why:
            uk: "React нічого не відкочує за тебе. Скасувати першу підписку може лише cleanup, який повертає ефект, — а його тут немає."
            en: "React rolls nothing back for you. Only a cleanup returned by the effect can cancel the first subscription — and there is none here."
        - id: zero
          text: { uk: "Жодного: другий setup скасовує перший", en: "None: the second setup cancels the first" }
          why:
            uk: "Другий setup — це просто ще один виклик тієї самої функції: він додає ще одну підписку, а не скасовує першу."
            en: "The second setup is just another call of the same function: it adds one more subscription, it does not cancel the first."
      correct: [two]
    explanation:
      uk: "Дві підписки — два виклики `setRecords` з тим самим записом — два однакові рядки. Перевірено в пісочниці з React 19.3: у списку два `<li>`, а консоль показує помилку React про два елементи з однаковим `key`. Подвоєння видно лише під час розробки, але причина — підписка без cleanup — є і в production: там вона «витікає» щоразу, коли стрічку ховають і показують знову."
      en: "Two subscriptions — two calls of `setRecords` with the same record — two identical rows. Checked in the sandbox with React 19.3: the list has two `<li>`, and the console shows a React error about two children with the same `key`. The doubling is visible only in development, but the cause — a subscription without a cleanup — is in production too: there it “leaks” every time the feed is hidden and shown again."

  - id: seeded-timeline
    kind: visual
    visual: render-timeline
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
    title:
      uk: "Як StrictMode показує підписку без cleanup"
      en: "How StrictMode shows a subscription without a cleanup"
    textEquivalent:
      uk: >-
        Під час розробки StrictMode двічі викликає функцію HabitFeed з порожнім records, і React
        показує порожній список. Потім ефект: setup підписується на стрічку слухачем A. StrictMode
        імітує зняття компонента, але ефект не повернув cleanup, тож нічого не скасовується, і setup
        запускається вдруге — слухач B. Стрічка надсилає одне виконання «Ранкова зарядка»: обидва
        слухачі ставлять у чергу додавання того самого запису. Наступний рендер бачить два однакові
        записи, і список показує два рядки «Ранкова зарядка». Cleanup, що повертає функцію відписки, зробив
        би з setup → cleanup → setup рівно одну підписку.
      en: >-
        During development StrictMode calls the HabitFeed function twice with an empty records, and
        React shows an empty list. Then the effect: the setup subscribes to the feed with listener A.
        StrictMode imitates removing the component, but the effect returned no cleanup, so nothing is
        cancelled, and the setup runs a second time — listener B. The feed sends one completion
        “Morning exercise”: both listeners queue an append of the same record. The next render sees two
        identical records, and the list shows two “Morning exercise” rows. A cleanup that returns the
        unsubscribe function would turn setup → cleanup → setup into exactly one subscription.
    spec:
      component: HabitFeed
      code: |
        function HabitFeed() {
          const [records, setRecords] = useState([]);
          useEffect(() => {
            subscribe((record) => {
              setRecords((current) => [...current, record]);
            });
          }, []);
          return <ul>{records.map((r) => <li key={r.id}>{r.habit}</li>)}</ul>;
        }
      steps:
        - phase: render
          render: 1
          line: 2
          reason: { uk: "перший показ", en: "first display" }
          snapshot: { state: { records: [] } }
          caption:
            uk: "StrictMode викликає `HabitFeed()` уперше: `records` порожній."
            en: "StrictMode calls `HabitFeed()` for the first time: `records` is empty."
        - phase: render
          render: 2
          line: 2
          reason: { uk: "повторний виклик StrictMode (лише під час розробки)", en: "StrictMode's repeated call (development only)" }
          snapshot: { state: { records: [] } }
          caption:
            uk: "І ще раз — з тим самим знімком. Рендер чистий, тож це нічого не змінює."
            en: "And once more — with the same snapshot. The render is pure, so this changes nothing."
        - phase: commit
          render: 2
          line: 8
          dom: "<ul></ul>"
          caption:
            uk: "Commit: на екрані порожній список."
            en: "Commit: an empty list on the screen."
        - phase: effect
          render: 2
          line: 4
          run: ["subscribe(listener A)"]
          caption:
            uk: "Setup: підписка зі слухачем A. Ефект нічого не повертає — cleanup немає."
            en: "Setup: a subscription with listener A. The effect returns nothing — there is no cleanup."
        - phase: effect
          render: 2
          line: 4
          cleanup: []
          run: ["subscribe(listener B)"]
          caption:
            uk: "StrictMode імітує зняття компонента: викликати нічого, підписка A лишається. Setup удруге — слухач B. На стрічці дві підписки."
            en: "StrictMode imitates removing the component: there is nothing to call, subscription A stays. The setup runs again — listener B. The feed has two subscriptions."
        - phase: event
          name: "publish c-01"
          line: 5
          sees: { records: [] }
          actions: ["A: setRecords(append c-01)", "B: setRecords(append c-01)"]
          queued: { records: ["c-01", "c-01"] }
          caption:
            uk: "Стрічка надсилає одне виконання. Кожен слухач ставить у чергу додавання того самого запису."
            en: "The feed sends one completion. Each listener queues an append of the same record."
        - phase: render
          render: 3
          line: 2
          reason: { uk: "у черзі два додавання", en: "two appends are queued" }
          snapshot: { state: { records: ["c-01", "c-01"] } }
          caption:
            uk: "Наступний рендер бачить два однакові записи."
            en: "The next render sees two identical records."
        - phase: commit
          render: 3
          line: 8
          dom: "<ul><li>%%exercise%%</li><li>%%exercise%%</li></ul>"
          caption:
            uk: "Два рядки «Ранкова зарядка». Причина — не StrictMode, а відсутній cleanup: StrictMode лише показав її одразу."
            en: "Two “Morning exercise” rows. The cause is not StrictMode but the missing cleanup: StrictMode just showed it right away."

  - id: seeded-app
    kind: example
    runtime: browser-react
    dir: seeded-app
    entry: main.jsx
    strings:
      feedHeading: { uk: "Стрічка виконань", en: "Completions feed" }
      empty: { uk: "Поки що нічого не виконано.", en: "Nothing completed yet." }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      publish: { uk: "Надіслати виконання", en: "Publish a completion" }
      hide: { uk: "Сховати стрічку", en: "Hide the feed" }
      show: { uk: "Показати стрічку", en: "Show the feed" }
      tOneSubscription: { uk: "поки стрічку показано, вона тримає одну підписку", en: "while shown, the feed keeps one subscription" }
      mSubscriptions: { uk: "нових підписок після показу", en: "new subscriptions after showing" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rNotFound: { uk: "на екрані немає", en: "not on the screen:" }
      rStillMissing: { uk: "так і не з’явилося", en: "never appeared" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Відтвори регресію"
      en: "Reproduce the regression"
    body:
      uk: |
        Закладена регресія. `feed.js` — несправжня стрічка: `subscribe` додає слухача й друкує, скільки їх тепер, а функція, яку він повертає, слухача знімає. `HabitFeed.test.jsx` дивиться на **причину** — скільки підписок тримає показана стрічка. `main.jsx` спершу запускає тест, потім показує застосунок у `<StrictMode>`.

        Натисни **Запустити** й подивись у **Консоль**: `subscribe → 1`, `subscribe → 2`, тест `✗` з «очікувалося 1, отримано 2», а потім `subscribe → 3` і `subscribe → 4` — це вже сторінка. Копію з тесту давно знято зі сторінки, а її дві підписки досі на стрічці.
      en: |
        The seeded regression. `feed.js` is a fake feed: `subscribe` adds a listener and prints how many there are now, and the function it returns removes the listener. `HabitFeed.test.jsx` looks at the **cause** — how many subscriptions the shown feed keeps. `main.jsx` first runs the test, then shows the app inside `<StrictMode>`.

        Press **Run** and look at the **Console**: `subscribe → 1`, `subscribe → 2`, the test `✗` with “expected 1, got 2”, and then `subscribe → 3` and `subscribe → 4` — that is the page. The test's copy was taken off the page long ago, but its two subscriptions are still on the feed.
    tryIt:
      uk: |
        1. Натисни «Надіслати виконання»: у списку два однакові рядки «Ранкова зарядка», а в консолі — помилка React про два елементи з однаковим `key`.
        2. У `main.jsx` заміни `<StrictMode><App /></StrictMode>` на просто `<App />` і запусти. Сторінка тепер підписується один раз, «Надіслати виконання» дає один рядок — ніби полагоджено. Але тест і далі `✗`: він монтує копію в `<StrictMode>`. А тепер тричі натисни «Сховати стрічку» і «Показати стрічку»: кожен показ друкує ще один `subscribe →`, і жоден не друкує `unsubscribe`. Підписки накопичуються. Поверни `<StrictMode>`.
      en: |
        1. Press “Publish a completion”: the list has two identical “Morning exercise” rows, and the console has a React error about two children with the same `key`.
        2. In `main.jsx` replace `<StrictMode><App /></StrictMode>` with just `<App />` and run. The page now subscribes once, and “Publish a completion” gives one row — as if fixed. But the test is still `✗`: it mounts its copy inside `<StrictMode>`. Now press “Hide the feed” and “Show the feed” three times: every show prints one more `subscribe →`, and none prints `unsubscribe`. The subscriptions pile up. Put `<StrictMode>` back.

  - id: strict-off
    kind: prediction
    prompt:
      uk: "Колега пропонує прибрати `<StrictMode>` з `main.jsx`: «тоді рядки не дублюються». Що насправді зміниться?"
      en: "A teammate suggests removing `<StrictMode>` from `main.jsx`: “then the rows are not doubled”. What really changes?"
    answer:
      type: choice
      options:
        - id: hidden
          text:
            uk: "Дубль зникне з очей, але підписка так і не знімається: кожен новий показ стрічки додає ще одну, яку ніхто не прибере"
            en: "The duplicate disappears from view, but the subscription is still never removed: every new display of the feed adds one more that nobody will clean up"
        - id: fixed
          text:
            uk: "Регресію виправлено: без подвійного запуску ефекту підписка одна"
            en: "The regression is fixed: without the double run of the effect there is one subscription"
          why:
            uk: "Подвійний запуск лише імітує те, що стається в житті: компонент знімають і показують знову. Без cleanup кожен такий показ лишає підписку на стрічці."
            en: "The double run only imitates what happens in real life: a component is removed and shown again. Without a cleanup every such display leaves a subscription on the feed."
        - id: worse-prod
          text:
            uk: "У production-збірці з’являться дублікати, бо StrictMode їх там прибирав"
            en: "Duplicates appear in the production build, because StrictMode removed them there"
          why:
            uk: "StrictMode працює лише під час розробки й нічого не прибирає — він навпаки показує проблеми. Production-збірка однакова з ним і без нього."
            en: "StrictMode works only during development and removes nothing — on the contrary, it shows problems. The production build is the same with or without it."
      correct: [hidden]
    explanation:
      uk: "Вимкнути StrictMode — те саме, що вимкнути пожежну сигналізацію: тихо, але не безпечніше. Виправляють ефект: його cleanup має скасувати те, що зробив setup, — тоді setup → cleanup → setup лишає рівно одну підписку, а прихована стрічка не лишає жодної."
      en: "Turning StrictMode off is like turning off a fire alarm: quiet, but no safer. You fix the effect: its cleanup must undo what the setup did — then setup → cleanup → setup leaves exactly one subscription, and a hidden feed leaves none."

  - id: cause-and-screen
    kind: explanation
    title:
      uk: "Виправити причину, перевірити екран"
      en: "Fix the cause, check the screen"
    body:
      uk: |
        **Причина**: ефект підписується, але не повертає cleanup. `subscribe` уже повертає функцію, що знімає саме цю підписку, — її й має отримати React як cleanup. Прапорець «вже підписано» поза компонентом не допоможе: він пропустить другий setup у StrictMode, але після справжнього зняття й нового показу стрічка взагалі не підпишеться.

        **Тест.** Тест у прикладі дивиться на причину: кількість підписок. Це корисно під час пошуку, але для рубрики потрібен [[user-action-test|тест поведінки]]: те, що бачить людина. Покажи стрічку, надішли **одне** виконання, дочекайся рядка й порахуй рядки — має бути рівно один. `render` у `testing.js` монтує в `<StrictMode>`, тож на старому коді такий тест упаде, а `main.jsx` нехай і далі обгортає застосунок у `<StrictMode>`.
      en: |
        **The cause**: the effect subscribes but returns no cleanup. `subscribe` already returns a function that removes exactly this subscription — that is what React should get as the cleanup. A “has already subscribed” flag outside the component does not help: it skips StrictMode's second setup, but after a real removal and a new display the feed does not subscribe at all.

        **The test.** The test in the example looks at the cause: the number of subscriptions. That is useful while searching, but the rubric needs a [[user-action-test|behavior test]]: what a person sees. Show the feed, publish **one** completion, wait for the row and count the rows — there must be exactly one. `render` in `testing.js` mounts inside `<StrictMode>`, so such a test fails on the old code, and `main.jsx` keeps wrapping the app in `<StrictMode>`.

  - id: repair-feed
    kind: exercise
    mode: debug
    runtime: browser-react
    dir: repair-feed
    entry: main.jsx
    editable: [HabitFeed.jsx, HabitFeed.test.jsx]
    strings:
      feedHeading: { uk: "Стрічка виконань", en: "Completions feed" }
      empty: { uk: "Поки що нічого не виконано.", en: "Nothing completed yet." }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      publish: { uk: "Надіслати виконання", en: "Publish a completion" }
      hide: { uk: "Сховати стрічку", en: "Hide the feed" }
      show: { uk: "Показати стрічку", en: "Show the feed" }
      tEmpty: { uk: "порожня стрічка каже, що нічого не виконано", en: "an empty feed says nothing is completed" }
      tOneRow: { uk: "одне виконання — рівно один рядок", en: "one completion — exactly one row" }
      mEmpty: { uk: "повідомлення про порожню стрічку", en: "the empty-feed message" }
      mRows: { uk: "рядки списку", en: "the list rows" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rNotFound: { uk: "на екрані немає", en: "not on the screen:" }
      rStillMissing: { uk: "так і не з’явилося", en: "never appeared" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Полагодь стрічку й залиш регресійний тест"
      en: "Repair the feed and keep a regression test"
    instructions:
      uk: |
        Це той самий застосунок із закладеною регресією, без друку з `feed.js`. Зроби дві речі:

        1. **Виправ `HabitFeed.jsx`**, щоб кожне виконання з’являлося рівно один раз — і під час першого показу в `<StrictMode>`, і після того, як стрічку сховали й показали знову, — а прихована стрічка не лишала на `feed.js` жодної підписки. `main.jsx` не редагується, і виправлення не там: перевірки монтують власні копії `HabitFeed` у `<StrictMode>`.
        2. **Допиши в `HabitFeed.test.jsx` тест поведінки**, що проходить на твоєму виправленому коді й падає на закладеній регресії: надішли виконання через `publish({ id, habit, date })` з `feed.js` і перевір, що бачить людина. Рядок списку виглядає як `Ранкова зарядка — 2026-03-01`.

        Перевірки дивляться на стрічку (рядки й кількість підписок), а тоді запускають твої тести з твоїм `HabitFeed` і з тим, у якому регресію відтворено.
      en: |
        This is the same app with the seeded regression, without the printing in `feed.js`. Do two things:

        1. **Fix `HabitFeed.jsx`** so that every completion appears exactly once — on the first display under `<StrictMode>` and after the feed was hidden and shown again — and a hidden feed leaves no subscription on `feed.js`. `main.jsx` is not editable, and the fix is not there: the checks mount their own copies of `HabitFeed` inside `<StrictMode>`.
        2. **Add a behavior test to `HabitFeed.test.jsx`** that passes on your fixed code and fails on the seeded regression: publish a completion with `publish({ id, habit, date })` from `feed.js` and check what a person sees. A list row looks like `Morning exercise — 2026-03-01`.

        The checks look at the feed (the rows and the number of subscriptions), then run your tests with your `HabitFeed` and with one in which the regression is reproduced.
    testTitles:
      "one published completion shows exactly one row under StrictMode":
        uk: "Одне виконання в `<StrictMode>` — рівно один рядок"
        en: "One published completion shows exactly one row under `<StrictMode>`"
      "hiding the feed ends its subscription":
        uk: "Прихована стрічка не лишає підписки"
        en: "Hiding the feed ends its subscription"
      "showing the feed again still gives one row per completion":
        uk: "Після повторного показу — так само один рядок на виконання"
        en: "Showing the feed again still gives one row per completion"
      "your tests pass with your HabitFeed":
        uk: "Твої тести проходять із твоїм `HabitFeed`"
        en: "Your tests pass with your `HabitFeed`"
      "one of your tests fails with the seeded HabitFeed":
        uk: "Один із твоїх тестів падає на закладеній регресії"
        en: "One of your tests fails with the seeded `HabitFeed`"
    hints:
      nudge:
        uk: "Що повертає `subscribe`? І що React робить із функцією, яку повертає ефект?"
        en: "What does `subscribe` return? And what does React do with a function that an effect returns?"
      explanation:
        uk: |
          React викликає функцію, яку повернув ефект, перед повторним setup і коли компонент знімають. Якщо ефект щось відкриває, він має повернути функцію, що це закриває. Схоже, з іншою задачею: `useEffect(() => { const stopWatching = watchBattery(showLevel); return stopWatching; }, []);`.

          Для тесту пройди сценарій як людина: стрічка показана, прийшло одне виконання — скільки рядків має бути? Дочекайся рядка через `screen.findByText(…)`, а тоді порахуй `screen.queryAllByRole("listitem")`. Лише «рядок з’явився» не впіймає дубля.
        en: |
          React calls the function returned by an effect before the setup runs again and when the component is removed. If an effect opens something, it must return a function that closes it. Similar, with a different task: `useEffect(() => { const stopWatching = watchBattery(showLevel); return stopWatching; }, []);`.

          For the test, walk the scenario as a person: the feed is shown, one completion arrived — how many rows must there be? Wait for the row with `screen.findByText(…)`, then count `screen.queryAllByRole("listitem")`. “The row appeared” alone does not catch a duplicate.
    solutionNote:
      uk: "Ефект повертає функцію відписки, яку дав `subscribe`, тож setup → cleanup → setup у StrictMode лишає одну підписку, а прихована стрічка — жодної. Тест надсилає одне виконання, чекає рядка й перевіряє, що рядок рівно один: на закладеній регресії їх два, і тест падає. Прапорець «вже підписано» пройшов би перший показ, але після повторного показу стрічка мовчала б."
      en: "The effect returns the unsubscribe function that `subscribe` gave it, so setup → cleanup → setup under StrictMode leaves one subscription, and a hidden feed leaves none. The test publishes one completion, waits for the row and checks that there is exactly one row: on the seeded regression there are two, and the test fails. A “has already subscribed” flag would pass the first display, but after a new display the feed would stay silent."
    feedback:
      - when: { test: "one published completion shows exactly one row under StrictMode" }
        message:
          uk: "Ця перевірка монтує власну копію `HabitFeed` у `<StrictMode>` (що б не стояло в `main.jsx`), надсилає одне виконання й очікує рівно один рядок. Два рядки означають, що після setup → cleanup → setup лишилося дві підписки — ефект має повернути cleanup, що знімає свою підписку: React викликає cleanup, тож він сам має викликати функцію відписки (`() => unsubscribe` її лише повертає й нічого не знімає). Жодного рядка — що копія не підписалася зовсім (наприклад, її пропустив прапорець поза компонентом)."
          en: "This check mounts its own copy of `HabitFeed` inside `<StrictMode>` (whatever `main.jsx` has), publishes one completion and expects exactly one row. Two rows mean that two subscriptions were left after setup → cleanup → setup — the effect must return a cleanup that removes its subscription: React calls the cleanup, so it must itself call the unsubscribe function (`() => unsubscribe` only returns it and removes nothing). No row means the copy did not subscribe at all (for example, a flag outside the component skipped it)."
      - when: { test: "hiding the feed ends its subscription" }
        message:
          uk: "Ця перевірка показує й ховає копію стрічки й очікує, що на `feed.js` не лишилося жодної її підписки. Коли компонент знімають, React викликає cleanup ефекту — він має зняти підписку."
          en: "This check shows and hides a copy of the feed and expects none of its subscriptions to be left on `feed.js`. When a component is removed, React calls the effect's cleanup — it must remove the subscription."
      - when: { test: "showing the feed again still gives one row per completion" }
        message:
          uk: "Ця перевірка показує стрічку, ховає, показує знову, надсилає одне виконання й очікує рівно один рядок. Якщо рядків немає, повторний показ не підписався (прапорець «вже підписано» поза компонентом не скидається); якщо два — стара підписка не знята."
          en: "This check shows the feed, hides it, shows it again, publishes one completion and expects exactly one row. If there is no row, the new display did not subscribe (a “has already subscribed” flag outside the component is never reset); if there are two, the old subscription was not removed."
      - when: { test: "your tests pass with your HabitFeed" }
        message:
          uk: "Ця перевірка запускає твої тести з твоїм `HabitFeed` і очікує щонайменше два тести, і жоден не має впасти. Подивись у **Консоль**: рядок `✗` каже, який тест упав і чому. Якщо падає твій новий тест — спершу виправ `HabitFeed.jsx`: на закладеній регресії він і має падати. Якщо всі перевірки падають разом, а рядків `✗` немає, спершу виправ першу помилку в консолі: тоді файл тестів не завантажився, і твої тести не запускалися."
          en: "This check runs your tests with your `HabitFeed` and expects at least two tests, none of them failing. Look at the **Console**: a `✗` line says which test failed and why. If your new test fails, fix `HabitFeed.jsx` first: on the seeded regression it is supposed to fail. If every check fails at once and there are no `✗` lines, fix the first console error first: then the test file did not load, and your tests never ran."
      - when: { test: "one of your tests fails with the seeded HabitFeed" }
        message:
          uk: "Спершу твої тести мають пройти з твоїм `HabitFeed` (попередня перевірка). Ця перевірка підставляє закладену регресію й очікує, що хоча б один тест упаде. Тест має надіслати виконання й перевірити кількість рядків, а не лише те, що рядок з’явився."
          en: "First your tests must pass with your `HabitFeed` (the previous check). This check puts in the seeded regression and expects at least one test to fail. The test must publish a completion and check the number of rows, not only that a row appeared."
      - when: { error: ReferenceError }
        message:
          uk: "Картка `ReferenceError: … is not defined` показує назву, якої немає там, де її використано, а також файл і рядок. Найчастіше це помилка в назві чи забутий імпорт: перевір цей рядок та імпорти на початку файла. Така сама помилка **всередині** твого тесту картки не дає: курсовий запускач її ловить, і в консолі з’являється рядок `✗` цього тесту з `ReferenceError` — наприклад, коли `publish` не імпортовано з `feed.js`."
          en: "A `ReferenceError: … is not defined` card shows a name that does not exist where it is used, together with the file and the line. Most often it is a misspelled name or a forgotten import: check that line and the imports at the top of the file. The same mistake **inside** your test gives no card: the course runner catches it, and the console shows that test's `✗` line with `ReferenceError` — for example when `publish` is not imported from `feed.js`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: switch-lists
        from: re-03-03-dependencies-cleanup
        prompt:
          uk: "Без StrictMode компонент показано з `listId = \"home\"`; потім `listId` стає `\"work\"`, а тоді знову `\"home\"`. Скільки підписок відкрито наприкінці і до якого списку?"
          en: "Without StrictMode the component is shown with `listId = \"home\"`; then `listId` becomes `\"work\"`, and then `\"home\"` again. How many subscriptions are open at the end, and to which list?"
        code: |
          useEffect(() => {
            const unsubscribe = subscribeToList(listId, showRecords);
            return unsubscribe;
          }, [listId]);
        lang: jsx
        runnable: false
        answer:
          type: choice
          options:
            - id: one-home
              text: { uk: "Одна, до `home`", en: "One, to `home`" }
            - id: three
              text: { uk: "Три: `home`, `work`, `home`", en: "Three: `home`, `work`, `home`" }
              why:
                uk: "Cleanup запускається не лише під час зняття компонента, а й перед **кожним** повторним setup — тобто при кожній зміні `listId`. Стара підписка знімається, перш ніж відкривається нова."
                en: "The cleanup runs not only when the component is removed but before **every** repeated setup — that is, on every change of `listId`. The old subscription is removed before the new one opens."
            - id: one-work
              text: { uk: "Одна, до `work`", en: "One, to `work`" }
              why:
                uk: "Остання зміна повернула `\"home\"`: React викликав cleanup підписки на `work` і запустив setup з `home`."
                en: "The last change brought back `\"home\"`: React called the cleanup of the `work` subscription and ran the setup with `home`."
          correct: [one-home]
        explanation:
          uk: "Cleanup іде перед кожним повторним запуском ефекту й під час зняття компонента. Тому ефект із правильним cleanup завжди тримає рівно одну підписку — до поточного списку."
          en: "The cleanup comes before every repeated run of the effect and when the component is removed. So an effect with a correct cleanup always keeps exactly one subscription — to the current list."

  - id: to-project
    kind: transfer
    capstoneStep: RE-08
    body:
      uk: "У своєму проєкті знайди кожен ефект, що підписується, додає listener чи запускає таймер, і переконайся, що його cleanup знімає саме те, що відкрив setup. Для одного такого ефекту залиш тест поведінки в `<StrictMode>`, що падає без cleanup, — це доказ рядка «Cleanup ефектів» у CP-RE. `<StrictMode>` у `main.jsx` залишається."
      en: "In your project find every effect that subscribes, adds a listener or starts a timer, and make sure its cleanup removes exactly what the setup opened. For one such effect keep a behavior test under `<StrictMode>` that fails without the cleanup — that is the evidence for the “Effect cleanup” row of CP-RE. `<StrictMode>` in `main.jsx` stays."

