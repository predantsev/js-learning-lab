id: re-08-04-verify-locally-explain
unit: RE-08
title:
  uk: "Перевірити CP-RE локально й пояснити state і closures"
  en: "Verify CP-RE locally and explain state/closure"
kind: local-task
minutes: 25
contentVersion: 1
purpose:
  uk: "Це друга половина контрольної точки CP-RE. Ти запускаєш React-версію свого проєкту з чистого встановлення, доводиш кожен рядок рубрики командою чи проходом і записуєш, що побачив, а тоді без підказок пояснюєш на рядках власного коду, як працюють знімок state і closure в ефекті. Платформа цього не перевіряє: доказ — файли в репозиторії й commit."
  en: "This is the second half of the checkpoint CP-RE. You run the React version of your project from a clean install, prove every rubric row with a command or a walk-through and record what you saw, then, without hints, explain on lines of your own code how a state snapshot and a closure in an effect work. The platform does not check this: the evidence is the files in your repository and a commit."
objectives:
  - uk: "Запустити React-проєкт із чистого встановлення, звірити поведінку й збережені дані з рубрикою та записати докази."
    en: "Run the React capstone from a clean install, confirm behavior and retained data against the rubric, and record the evidence."
  - uk: "Своїми словами, вказуючи на рядки власного коду, пояснити одну поведінку знімка state і один closure, який захоплює ефект чи обробник."
    en: "Explain in your own words, pointing to lines in your code, one state-snapshot behavior and one closure captured by an effect or handler."
prerequisites: [re-08-03-capstone-cp-re-enhancement]
subskills:
  - { family: R-10, skill: "cumulative explanation", depth: assess }
glossary: []

blocks:
  - id: evidence-not-impressions
    kind: explanation
    title:
      uk: "Докази, а не враження"
      en: "Evidence, not impressions"
    body:
      uk: |
        «У мене працює» — це враження. Контрольна точка просить **докази**: команду, яку можна повторити, і те, що вона показала. Сьогодні ти зробиш дві речі у своєму проєкті й закріпиш їх одним commit:

        1. **Перевіриш проєкт за [[checkpoint-rubric|рубрикою]]** з чистого встановлення й запишеш кожен рядок у `docs/cp-re-evidence.md`: що запускав і що побачив.
        2. **Поясниш власний код** у `docs/cp-re-explanation.md`: один обробник, що читає знімок state, і один ефект, чий closure щось захоплює, — з файлом і номером рядка.

        Чисте встановлення важливе: тека `node_modules` у тебе могла накопичити пакети, яких немає в lockfile. Рецензент чи CI встановлюватимуть **лише** з lockfile — перевір, що проєкт працює саме так.
      en: |
        “It works on my machine” is an impression. The checkpoint asks for **evidence**: a command that can be repeated and what it showed. Today you do two things in your project and seal them with one commit:

        1. **Check the project against the [[checkpoint-rubric|rubric]]** from a clean install and record every row in `docs/cp-re-evidence.md`: what you ran and what you saw.
        2. **Explain your own code** in `docs/cp-re-explanation.md`: one handler that reads a state snapshot and one effect whose closure captures something — with the file and the line number.

        A clean install matters: your `node_modules` folder may have collected packages that are not in the lockfile. A reviewer or CI will install **only** from the lockfile — check that the project works exactly that way.

  - id: verify-locally
    kind: local-task
    runtime: local-web
    title:
      uk: "Чисте встановлення й рубрика рядок за рядком"
      en: "A clean install and the rubric row by row"
    intro:
      uk: |
        Працюй у теці React-версії свого проєкту. Команди нижче написано для «Списку бажань» у `~/js-course/wishlist`; для свого проєкту підстав його теку. Якщо React-версія живе в іншій теці, перейди саме туди.

        Ми виконали ці команди в macOS на тестовому проєкті: шаблон `npm create vite@latest` з `--template react-ts` (create-vite 9.2.1, Vite 8.3.2, React 19.3.0, TypeScript 6.0.3), Node.js v25.2.1, npm 11.6.2, Git 2.51.0, Chrome. Дані CP-JS — експорт із платформи (`data/exported-storage.json` і `tools/restore-data.html`). Числа пакетів, тестів і записів у тебе будуть інші. У Linux команди ті самі; у Windows виконуй їх у Git Bash, де працюють `rm -rf` і `echo $?` (у PowerShell код завершення показує `$LASTEXITCODE`). У Linux і Windows ми їх не запускали.

        **Що показує крок 2** (у нашому проєкті; у твоєму можуть бути інші скрипти):

        ```text
        {
          "dev": "vite",
          "build": "tsc -b && vite build",
          "lint": "oxlint",
          "preview": "vite preview",
          "test": "node run-tests.js",
          "typecheck": "tsc -b"
        }
        ```

        **Що показує крок 3:**

        ```text
        added 28 packages, and audited 29 packages in 709ms
        …
        found 0 vulnerabilities
        ```

        **Що показує крок 4, коли в коді є помилка типу** (для порівняння: ми додали тимчасовий файл із параметром без типу; у шаблоні Vite з TypeScript 6 строгий режим увімкнено за замовчуванням):

        ```text
        > wishlist@0.0.0 typecheck
        > tsc -b

        src/probe.ts(1,23): error TS7006: Parameter 'prices' implicitly has an 'any' type.
        src/probe.ts(5,16): error TS18047: 'maybe' is possibly 'null'.
        ```

        і `echo $?` друкує `2`. Без помилок `tsc -b` не друкує нічого, крім двох рядків заголовка, а `echo $?` друкує `0`.

        **Що показує крок 6:**

        ```text
        > wishlist@0.0.0 dev
        > vite

          VITE v8.3.2  ready in 820 ms

          ➜  Local:   http://localhost:5173/
          ➜  Network: use --host to expose
        ```

        **Заготовка `docs/cp-re-evidence.md` для кроку 9** — заповни останній стовпчик тим, що побачив сам:

        ```markdown
        # Докази CP-RE

        | Рядок | Команда чи прохід | Що я побачив |
        |---|---|---|
        | Чисте встановлення | `npm ci` | |
        | Типи | `npm run typecheck`, `echo $?` | |
        | Поведінка | `npm test`, `echo $?` | |
        | Cleanup ефектів | тест для cleanup; він же без рядка cleanup | |
        | Доступні маршрути | прохід клавіатурою на адресі dev-сервера | |
        | Дані CP-JS | сторінка відновлення, потім головна сторінка | |
        | Покращення | прохід і тести нового маршруту | |
        ```
      en: |
        Work in the folder of your project's React version. The commands below are written for the wishlist in `~/js-course/wishlist`; for your project use its folder. If the React version lives in another folder, go exactly there.

        We ran these commands on macOS on a test project: the `npm create vite@latest` template with `--template react-ts` (create-vite 9.2.1, Vite 8.3.2, React 19.3.0, TypeScript 6.0.3), Node.js v25.2.1, npm 11.6.2, Git 2.51.0, Chrome. The CP-JS data is the export from the platform (`data/exported-storage.json` and `tools/restore-data.html`). Your numbers of packages, tests and records will differ. On Linux the commands are the same; on Windows run them in Git Bash, where `rm -rf` and `echo $?` work (in PowerShell `$LASTEXITCODE` shows the exit code). We did not run them on Linux or Windows.

        **What step 2 shows** (in our project; yours may have other scripts):

        ```text
        {
          "dev": "vite",
          "build": "tsc -b && vite build",
          "lint": "oxlint",
          "preview": "vite preview",
          "test": "node run-tests.js",
          "typecheck": "tsc -b"
        }
        ```

        **What step 3 shows:**

        ```text
        added 28 packages, and audited 29 packages in 709ms
        …
        found 0 vulnerabilities
        ```

        **What step 4 shows when the code has a type error** (for comparison: we added a temporary file with a parameter without a type; in the Vite template with TypeScript 6 strict mode is on by default):

        ```text
        > wishlist@0.0.0 typecheck
        > tsc -b

        src/probe.ts(1,23): error TS7006: Parameter 'prices' implicitly has an 'any' type.
        src/probe.ts(5,16): error TS18047: 'maybe' is possibly 'null'.
        ```

        and `echo $?` prints `2`. Without errors `tsc -b` prints nothing but the two header lines, and `echo $?` prints `0`.

        **What step 6 shows:**

        ```text
        > wishlist@0.0.0 dev
        > vite

          VITE v8.3.2  ready in 820 ms

          ➜  Local:   http://localhost:5173/
          ➜  Network: use --host to expose
        ```

        **A template of `docs/cp-re-evidence.md` for step 9** — fill the last column with what you saw yourself:

        ```markdown
        # CP-RE evidence

        | Row | Command or walk-through | What I saw |
        |---|---|---|
        | Clean install | `npm ci` | |
        | Types | `npm run typecheck`, `echo $?` | |
        | Behavior | `npm test`, `echo $?` | |
        | Effect cleanup | the cleanup test; the same test without the cleanup line | |
        | Accessible routes | keyboard walk-through at the dev server address | |
        | CP-JS data | the restore page, then the main page | |
        | Enhancement | walk-through and tests of the new route | |
        ```
    tools:
      - { name: "Node.js", version: "22 or newer (run: v25.2.1)", note: { uk: "Разом із npm (у нас 11.6.2).", en: "Together with npm (ours: 11.6.2)." } }
      - { name: "Git", version: "2.51.0", note: { uk: "Для стану проєкту й commit.", en: "For the project state and the commit." } }
      - { name: "VS Code", version: "any current", note: { uk: "Щоб відкривати файли й шукати рядки для пояснення.", en: "To open files and find lines for the explanation." } }
      - { name: "Chrome", version: "any current", note: { uk: "Для проходу клавіатурою й даних CP-JS.", en: "For the keyboard walk-through and the CP-JS data." } }
    steps:
      - text:
          uk: "Перейди в теку проєкту й переконайся, що робоча тека чиста: перевірка має стосуватися саме того, що збережено в commit."
          en: "Go to the project folder and make sure the working tree is clean: the check must be about exactly what is committed."
        command: "cd ~/js-course/wishlist\ngit status"
        expect:
          uk: "`nothing to commit, working tree clean`. Якщо ні — спершу зроби commit своїх змін."
          en: "`nothing to commit, working tree clean`. If not, commit your changes first."
      - text:
          uk: "Подивись, які скрипти визначає проєкт. Для рубрики потрібні три: `dev`, `test` і перевірка типів. Якщо окремого `typecheck` немає, а `build` починається з `tsc -b`, додай його: `npm pkg set scripts.typecheck=\"tsc -b\"`."
          en: "See which scripts the project defines. The rubric needs three: `dev`, `test` and a type check. If there is no separate `typecheck` but `build` starts with `tsc -b`, add it: `npm pkg set scripts.typecheck=\"tsc -b\"`."
        command: "npm pkg get scripts"
        expect:
          uk: "Об’єкт зі скриптами, як у вступі (крок 2). Якщо `test` немає, рядок «Поведінка» поки не доведено — запиши це в докази як знахідку."
          en: "An object with the scripts, as in the introduction (step 2). If there is no `test`, the “Behavior” row is not proved yet — record that in the evidence as a finding."
      - text:
          uk: "Чисте встановлення: видали `node_modules` і встанови пакети рівно з lockfile. `npm ci` не змінює `package-lock.json` і зупиняється з помилкою, якщо він не збігається з `package.json`."
          en: "A clean install: delete `node_modules` and install the packages exactly from the lockfile. `npm ci` does not change `package-lock.json` and stops with an error if it does not match `package.json`."
        command: "rm -rf node_modules\nnpm ci"
        expect:
          uk: "`added … packages, and audited … packages in …` і `found 0 vulnerabilities`, як у вступі (крок 3)."
          en: "`added … packages, and audited … packages in …` and `found 0 vulnerabilities`, as in the introduction (step 3)."
      - text:
          uk: "Рядок «Типи»: строга перевірка типів і код завершення."
          en: "The “Types” row: the strict type check and its exit code."
        command: "npm run typecheck\necho $?"
        expect:
          uk: "Лише два рядки заголовка (`> … typecheck`, `> tsc -b`) і `0`. Помилки виглядають як `src/….tsx(рядок,стовпчик): error TS…` і дають `2` (вступ, крок 4)."
          en: "Only the two header lines (`> … typecheck`, `> tsc -b`) and `0`. Errors look like `src/….tsx(line,column): error TS…` and give `2` (introduction, step 4)."
      - text:
          uk: "Рядок «Поведінка»: тести проєкту й код завершення. Потім доведи рядок «Cleanup ефектів»: тимчасово прибери `return` із cleanup в ефекті, який перевіряє твій тест для cleanup, знову запусти `npm test` і переконайся, що цей тест падає, а тоді поверни файл командою `git restore` з його шляхом."
          en: "The “Behavior” row: the project's tests and the exit code. Then prove the “Effect cleanup” row: temporarily remove the `return` of the cleanup in the effect that your cleanup test checks, run `npm test` again and make sure that test fails, then bring the file back with `git restore` and its path."
        command: "npm test\necho $?"
        expect:
          uk: "Рядок `✓` на кожен тест, підсумок без невдалих (у нашому курсовому запускачі — `Пройшли: 13 · не пройшли: 0`) і `0`. Без cleanup — рядок `✗` у твого тесту для cleanup і код `1`."
          en: "A `✓` line for every test, a summary with no failures (with our course runner, `Passed: 13 · failed: 0`) and `0`. Without the cleanup — a `✗` line for your cleanup test and the code `1`."
      - text:
          uk: "Запусти dev-сервер і відкрий у Chrome **точно ту адресу, яку він надрукував**. Це нове джерело зі своїм сховищем: дані CP-JS лежать у сховищі адреси, де працював проєкт JS-етапу (ту адресу друкував `npm start` у JS-10, там — `http://127.0.0.1:4310/` з портом із `.env`), тож тут список спершу порожній або показує початкові дані."
          en: "Start the dev server and open in Chrome **exactly the address it printed**. It is a new origin with its own storage: the CP-JS data lives in the storage of the address where the JavaScript-stage project ran (the address `npm start` printed in JS-10, there `http://127.0.0.1:4310/` with the port from `.env`), so here the list is empty or shows starting data at first."
        command: "npm run dev"
        expect:
          uk: "`VITE v… ready in … ms` і `➜  Local:   http://localhost:5173/` (вступ, крок 6). Сервер працює, доки ти не натиснеш Ctrl+C; наступні кроки роби в браузері."
          en: "`VITE v… ready in … ms` and `➜  Local:   http://localhost:5173/` (introduction, step 6). The server runs until you press Ctrl+C; do the next steps in the browser."
      - text:
          uk: "Рядок «Дані CP-JS»: відкрий сторінку відновлення з експорту на адресі dev-сервера, `http://localhost:5173/tools/restore-data.html` — Vite віддає файли з теки проєкту — і натисни «Відновити дані». Тоді відкрий `http://localhost:5173/` і порівняй записи з тими, що були в CP-JS."
          en: "The “CP-JS data” row: open the restore page from the export at the dev server's address, `http://localhost:5173/tools/restore-data.html` — Vite serves the files of the project folder — and press “Restore data”. Then open `http://localhost:5173/` and compare the records with those you had in CP-JS."
        expect:
          uk: "Сторінка відновлення каже `Дані буде записано для адреси http://localhost:5173.`, а після кнопки — `Готово: записано 1. Відкрий проєкт, щоб побачити ті самі дані.` Головна сторінка показує ті самі записи з тими самими полями (у нашому проєкті — 7 бажань)."
          en: "The restore page says `The data will be written for http://localhost:5173.`, and after the button `Done: 1 written. Open the project to see the same data.` The main page shows the same records with the same fields (7 wishes in our project)."
      - text:
          uk: "Рядки «Доступні маршрути» й «Покращення»: відклади мишу. Пройди кожен маршрут лише клавіатурою — Tab і Shift+Tab, Enter на посиланнях і кнопках: додай, відредагуй і видали запис, відкрий новий маршрут свого покращення, після кожного переходу подивись, де стоїть фокус і чи видно його. Перезавантаж сторінку на глибокій адресі (наприклад, на сторінці одного запису) — вона має відкритися."
          en: "The “Accessible routes” and “Enhancement” rows: put the mouse away. Walk every route with the keyboard only — Tab and Shift+Tab, Enter on links and buttons: add, edit and delete a record, open the new route of your enhancement, and after every navigation look where the focus is and whether it is visible. Reload the page on a deep address (for example, the page of one record) — it must open."
        expect:
          uk: "Кожну дію виконано без миші; після переходу фокус стоїть на заголовку нової сторінки чи на першому полі; перезавантаження на глибокій адресі показує ту саму сторінку, а зміни лишаються."
          en: "Every action is done without the mouse; after a navigation the focus stands on the new page's heading or on the first field; a reload on a deep address shows the same page, and the changes stay."
      - text:
          uk: "Зупини сервер (Ctrl+C), створи `docs/cp-re-evidence.md` із заготовки у вступі й заповни кожен рядок тим, що побачив: код завершення, кількість тестів, кількість записів, де стояв фокус. Рядок, який не вдалося довести, так і запиши — разом із причиною."
          en: "Stop the server (Ctrl+C), create `docs/cp-re-evidence.md` from the template in the introduction and fill every row with what you saw: the exit code, the number of tests, the number of records, where the focus stood. A row you could not prove is recorded as such — with the reason."
        expect:
          uk: "Файл із сімома заповненими рядками. `git status --short` показує `?? docs/`."
          en: "A file with seven filled rows. `git status --short` shows `?? docs/`."
    verify:
      - id: clean-install
        text: { uk: "`npm ci` встановив пакети з lockfile без помилок.", en: "`npm ci` installed the packages from the lockfile without errors." }
      - id: types-zero
        text: { uk: "`npm run typecheck` завершився з кодом `0`.", en: "`npm run typecheck` finished with the code `0`." }
      - id: tests-zero
        text: { uk: "`npm test` завершився з кодом `0`, а без рядка cleanup мій тест для cleanup упав.", en: "`npm test` finished with the code `0`, and without the cleanup line my cleanup test failed." }
      - id: data-retained
        text: { uk: "На адресі dev-сервера відкриваються ті самі записи, що були в CP-JS.", en: "The dev server's address opens the same records that I had in CP-JS." }
      - id: keyboard-walk
        text: { uk: "Я пройшов кожен маршрут, включно з новим, лише клавіатурою.", en: "I walked every route, the new one included, with the keyboard only." }
      - id: evidence-file
        text: { uk: "`docs/cp-re-evidence.md` містить команду й побачене для кожного рядка рубрики.", en: "`docs/cp-re-evidence.md` holds the command and what I saw for every rubric row." }
    troubleshooting:
      - problem:
          uk: "`npm ci` пише `` `npm ci` can only install packages when your package.json and package-lock.json or npm-shrinkwrap.json are in sync `` і перелічує `Missing: … from lock file`."
          en: "`npm ci` says `` `npm ci` can only install packages when your package.json and package-lock.json or npm-shrinkwrap.json are in sync `` and lists `Missing: … from lock file`."
        fix:
          uk: "Хтось змінив `package.json`, не оновивши lockfile. Виконай `npm install` — він оновить `package-lock.json`, — зроби commit обох файлів і знову запусти `npm ci`. Запиши це в докази: саме таку помилку побачив би рецензент."
          en: "Someone changed `package.json` without updating the lockfile. Run `npm install` — it updates `package-lock.json` — commit both files and run `npm ci` again. Record it in the evidence: this is exactly the error a reviewer would have seen."
      - problem:
          uk: "`npm error Missing script: \"typecheck\"` (або `\"test\"`)."
          en: "`npm error Missing script: \"typecheck\"` (or `\"test\"`)."
        fix:
          uk: "Такого скрипта немає. Для перевірки типів додай `npm pkg set scripts.typecheck=\"tsc -b\"`. Скрипт `test` додає крок проєкту про тести; поки його немає, рядок «Поведінка» не доведено — так і запиши."
          en: "There is no such script. For the type check add `npm pkg set scripts.typecheck=\"tsc -b\"`. The `test` script comes from the project's testing step; while it is missing, the “Behavior” row is not proved — record exactly that."
      - problem:
          uk: "Після відновлення головна сторінка все одно порожня."
          en: "After the restore the main page is still empty."
        fix:
          uk: "Відновлення записалося в сховище іншої адреси. Відкривай і сторінку відновлення, і застосунок саме за адресою з терміналу. `localhost` і `127.0.0.1` для браузера — різні джерела; у нашому запуску Vite слухав лише `localhost` (`[::1]`), і `http://127.0.0.1:5173/` узагалі не відкривався."
          en: "The restore was written into the storage of another address. Open both the restore page and the app exactly at the address from the terminal. `localhost` and `127.0.0.1` are different origins for the browser; in our run Vite listened only on `localhost` (`[::1]`), and `http://127.0.0.1:5173/` did not open at all."
      - problem:
          uk: "`/tools/restore-data.html` показує порожню сторінку чи 404: у проєкті вже немає `tools/` і `data/exported-storage.json`."
          en: "`/tools/restore-data.html` shows an empty page or 404: the project no longer has `tools/` and `data/exported-storage.json`."
        fix:
          uk: "Вони є в історії Git. `git log --oneline --diff-filter=D -- data/exported-storage.json` показує commit, який їх видалив; поверни їх зі стану перед ним: `git restore --source=<commit>~1 -- tools data` (замість `<commit>` — номер із першого стовпчика). Перевірено на тестовому проєкті: обидві теки повертаються як нові файли."
          en: "They are in the Git history. `git log --oneline --diff-filter=D -- data/exported-storage.json` shows the commit that deleted them; bring them back from the state before it: `git restore --source=<commit>~1 -- tools data` (instead of `<commit>`, the id from the first column). Checked on the test project: both folders come back as new files."
    recovery:
      uk: "Ці кроки нічого не змінюють у коді: `npm ci` лише перевстановлює `node_modules`, а тимчасове прибирання cleanup повертає `git restore`. Нові лише файли в `docs/`. Якщо заплутався, `git status` покаже, що змінено, а `git restore <файл>` поверне файл до останнього commit."
      en: "These steps change nothing in the code: `npm ci` only reinstalls `node_modules`, and `git restore` brings back the temporarily removed cleanup. Only the files in `docs/` are new. If you get lost, `git status` shows what changed, and `git restore <file>` brings a file back to the last commit."

  - id: recall
    kind: review
    title:
      uk: "Пригадай перед поясненням"
      en: "Recall before you explain"
    items:
      - id: closure-sees-object
        from: js-03-05-closures
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          function makeReminder(task) {
            return () => console.log(task.title);
          }
          const task = { id: "t-01", title: "A" };
          const remind = makeReminder(task);
          task.title = "B";
          remind();
        verify:
          logs: ["B"]
        answer:
          type: choice
          options:
            - id: b
              text: { uk: "`B`", en: "`B`" }
            - id: a
              text: { uk: "`A`", en: "`A`" }
              why:
                uk: "Closure пам’ятає **змінну** `task`, а не копію об’єкта на момент створення. Змінна вказує на той самий об’єкт, і його поле змінили до виклику."
                en: "A closure remembers the **variable** `task`, not a copy of the object from the moment it was created. The variable points to the same object, and its field was changed before the call."
            - id: undefined
              text: { uk: "`undefined`: `makeReminder` уже завершилася", en: "`undefined`: `makeReminder` has already finished" }
              why:
                uk: "Саме в цьому сила closure: змінні функції, що завершилася, живуть далі, поки їх пам’ятає створена в ній функція."
                en: "That is exactly the power of a closure: the variables of a finished function live on while a function created in it remembers them."
          correct: [b]
        explanation:
          uk: "Closure пам’ятає змінні місця народження, а ті можуть вказувати на об’єкти, які змінюються. У React це пояснює дві речі: обробник бачить змінні **свого** рендеру (нові значення state — це нові змінні в новому рендері), а якщо state змінити мутацією того самого об’єкта, старий closure побачить зміну, а React — ні."
          en: "A closure remembers the variables of its birthplace, and they may point to objects that change. In React this explains two things: a handler sees the variables of **its own** render (new state values are new variables in a new render), and if state is changed by mutating the same object, an old closure sees the change while React does not."

  - id: explain-your-code
    kind: local-task
    runtime: local-web
    title:
      uk: "Без підказок: поясни state і closure у своєму коді"
      en: "Without hints: explain state and a closure in your code"
    intro:
      uk: |
        Це самостійна частина: підказок і зразка відповіді немає. Пиши своїми словами й лише про свій код — пояснення з загальних фраз нічого не доводить.

        **Заготовка `docs/cp-re-explanation.md`:**

        ```markdown
        # CP-RE: state і closures у моєму коді

        ## Знімок state в обробнику
        Файл і рядок:
        Що робить обробник:
        Яке значення state він бачить і чому:
        Що зламалося б, якби тут прочитати state одразу після виклику setter і розраховувати на нове значення:

        ## Closure в ефекті
        Файл і рядок:
        Що ефект синхронізує:
        Які значення захоплює його closure і які з них є в залежностях:
        Що прибирає cleanup і коли React його викликає:
        Що зламалося б, якби прибрати одну залежність або cleanup:
        ```
      en: |
        This is the independent part: there are no hints and no sample answer. Write in your own words and only about your code — an explanation made of general phrases proves nothing.

        **A template of `docs/cp-re-explanation.md`:**

        ```markdown
        # CP-RE: state and closures in my code

        ## A state snapshot in a handler
        File and line:
        What the handler does:
        Which state value it sees, and why:
        What would break if it read state right after calling the setter and counted on the new value:

        ## A closure in an effect
        File and line:
        What the effect synchronizes:
        Which values its closure captures, and which of them are in the dependencies:
        What the cleanup removes, and when React calls it:
        What would break if one dependency or the cleanup were removed:
        ```
    tools:
      - { name: "VS Code", version: "any current", note: { uk: "Номер рядка видно ліворуч від коду.", en: "The line number is shown to the left of the code." } }
      - { name: "Chrome DevTools", version: "any current", note: { uk: "Щоб перевірити своє пояснення тимчасовим `console.log`.", en: "To check your explanation with a temporary `console.log`." } }
    steps:
      - text:
          uk: "Знайди у своєму коді обробник, що викликає setter і після цього ще читає state або передає його далі, та ефект із масивом залежностей, чий код читає props чи state. Запиши в заготовку файл і номер рядка кожного."
          en: "Find in your code a handler that calls a setter and after that still reads state or passes it on, and an effect with a dependency array whose code reads props or state. Write the file and line number of each into the template."
        expect:
          uk: "Два місця з твого проєкту з файлом і рядком, наприклад `src/ItemForm.tsx:42`."
          en: "Two places from your project with a file and a line, for example `src/ItemForm.tsx:42`."
      - text:
          uk: "Заповни обидва розділи заготовки своїми словами. Перш ніж стверджувати, яке значення бачить обробник чи ефект, перевір це: додай тимчасовий `console.log`, запусти `npm run dev`, виконай дію в браузері й подивись у DevTools **Console**. Потім прибери рядок (`git restore` з шляхом файла) і запиши в пояснення, що саме побачив."
          en: "Fill both sections of the template in your own words. Before you claim which value a handler or an effect sees, check it: add a temporary `console.log`, run `npm run dev`, do the action in the browser and look at the DevTools **Console**. Then remove the line (`git restore` with the file's path) and write into the explanation what exactly you saw."
        expect:
          uk: "Кожне твердження в поясненні спирається на рядок коду або на те, що надрукувала консоль; `git status --short` не показує змінених файлів у `src/`."
          en: "Every claim in the explanation rests on a line of code or on what the console printed; `git status --short` shows no changed files in `src/`."
      - text:
          uk: "Зафіксуй контрольну точку одним commit, повідомлення якого каже, що зроблено."
          en: "Record the checkpoint in one commit whose message says what was done."
        command: "git status --short\ngit add docs\ngit commit -m \"CP-RE: record the rubric evidence and the state/closure explanation\"\ngit log --oneline\ngit status"
        expect:
          uk: "`git status --short` показує лише `?? docs/`; commit — `[main …] CP-RE: …` і `2 files changed`, `create mode 100644 docs/cp-re-evidence.md` та `docs/cp-re-explanation.md`; новий commit угорі `git log --oneline`; `git status` — `nothing to commit, working tree clean`."
          en: "`git status --short` shows only `?? docs/`; the commit says `[main …] CP-RE: …` and `2 files changed`, `create mode 100644 docs/cp-re-evidence.md` and `docs/cp-re-explanation.md`; the new commit is on top of `git log --oneline`; `git status` says `nothing to commit, working tree clean`."
    verify:
      - id: two-places
        text: { uk: "Пояснення називає два місця мого коду з файлом і номером рядка.", en: "The explanation names two places of my code with a file and a line number." }
      - id: snapshot-why
        text: { uk: "Я пояснив, яке значення state бачить обробник і чому — через знімок рендеру, у якому його створено.", en: "I explained which state value the handler sees and why — through the snapshot of the render that created it." }
      - id: closure-deps
        text: { uk: "Я пояснив, що захоплює closure ефекту, як це пов’язано із залежностями й що робить cleanup.", en: "I explained what the effect's closure captures, how that relates to its dependencies and what the cleanup does." }
      - id: checked-claims
        text: { uk: "Я перевірив свої твердження тимчасовим `console.log` і прибрав його.", en: "I checked my claims with a temporary `console.log` and removed it." }
      - id: committed
        text: { uk: "Докази й пояснення — в одному commit, робоча тека чиста.", en: "The evidence and the explanation are in one commit, and the working tree is clean." }
    troubleshooting:
      - problem:
          uk: "У проєкті немає обробника, що читає state після виклику setter."
          en: "The project has no handler that reads state after calling a setter."
        fix:
          uk: "Візьми будь-який обробник, що читає state, і поясни, яке значення він бачить під час кліку й коли з’явиться нове. Тимчасовий `console.log` одразу після setter покаже старе значення — це й є знімок."
          en: "Take any handler that reads state and explain which value it sees during the click and when the new one appears. A temporary `console.log` right after the setter shows the old value — that is the snapshot."
      - problem:
          uk: "Після тимчасового `console.log` `git status --short` показує ` M src/…`."
          en: "After the temporary `console.log`, `git status --short` shows ` M src/…`."
        fix:
          uk: "Поверни файл до останнього commit: `git restore src/…` (той самий шлях). У commit контрольної точки мають потрапити лише файли з `docs/`."
          en: "Bring the file back to the last commit: `git restore src/…` (the same path). Only the files from `docs/` belong in the checkpoint commit."
    recovery:
      uk: "Якщо commit уже зроблено, а в нього випадково потрапив змінений файл із `src/`, не переписуй історію: поверни файл (`git restore --source=HEAD~1 src/…`) і зроби ще один commit із поясненням."
      en: "If the commit is made and a changed file from `src/` slipped into it, do not rewrite history: bring the file back (`git restore --source=HEAD~1 src/…`) and make one more commit with an explanation."
