id: re-08-04-verify-locally-explain
unit: RE-08
title:
  uk: "Перевірити CP-RE локально й пояснити state і closures"
  en: "Verify CP-RE locally and explain state/closure"
kind: local-task
minutes: 25
contentVersion: 1
purpose:
  uk: "Це друга половина контрольної точки CP-RE. Ти запускаєш React-версію свого проєкту з чистого встановлення, доводиш кожен рядок рубрики командою чи проходом і записуєш, що побачив, а тоді без підказок пояснюєш на рядках власного коду, як працюють знімок state і closure в ефекті. Платформа цього не перевіряє: доказ — файли в репозиторії й commit."
  en: "This is the second half of the checkpoint CP-RE. You run the React version of your project from a clean install, prove every rubric row with a command or a walk-through and record what you saw, then, without hints, explain on lines of your own code how a state snapshot and a closure in an effect work. The platform does not check this: the evidence is the files in your repository and a commit."
objectives:
  - uk: "Запустити React-проєкт із чистого встановлення, звірити поведінку й збережені дані з рубрикою та записати докази."
    en: "Run the React capstone from a clean install, confirm behavior and retained data against the rubric, and record the evidence."
  - uk: "Своїми словами, вказуючи на рядки власного коду, пояснити одну поведінку знімка state і один closure, який захоплює ефект чи обробник."
    en: "Explain in your own words, pointing to lines in your code, one state-snapshot behavior and one closure captured by an effect or handler."
prerequisites: [re-08-03-capstone-cp-re-enhancement]
subskills:
  - { family: R-10, skill: "cumulative explanation", depth: assess }
glossary: []

blocks:
  - id: evidence-not-impressions
    kind: explanation
    title:
      uk: "Докази, а не враження"
      en: "Evidence, not impressions"
    body:
      uk: |
        «У мене працює» — це враження. Контрольна точка просить **докази**: команду, яку можна повторити, і те, що вона показала. Сьогодні ти зробиш дві речі у своєму проєкті й закріпиш їх одним commit:

        1. **Перевіриш проєкт за [[checkpoint-rubric|рубрикою]]** з чистого встановлення й запишеш кожен рядок у `docs/cp-re-evidence.md`: що запускав і що побачив.
        2. **Поясниш власний код** у `docs/cp-re-explanation.md`: один обробник, що читає знімок state, і один ефект, чий closure щось захоплює, — з файлом і номером рядка.

        Чисте встановлення важливе: тека `node_modules` у тебе могла накопичити пакети, яких немає в lockfile. Рецензент чи CI встановлюватимуть **лише** з lockfile — перевір, що проєкт працює саме так.
      en: |
        “It works on my machine” is an impression. The checkpoint asks for **evidence**: a command that can be repeated and what it showed. Today you do two things in your project and seal them with one commit:

        1. **Check the project against the [[checkpoint-rubric|rubric]]** from a clean install and record every row in `docs/cp-re-evidence.md`: what you ran and what you saw.
        2. **Explain your own code** in `docs/cp-re-explanation.md`: one handler that reads a state snapshot and one effect whose closure captures something — with the file and the line number.

        A clean install matters: your `node_modules` folder may have collected packages that are not in the lockfile. A reviewer or CI will install **only** from the lockfile — check that the project works exactly that way.

  - id: verify-locally
    kind: local-task
    runtime: local-web
    title:
      uk: "Чисте встановлення й рубрика рядок за рядком"
      en: "A clean install and the rubric row by row"
    intro:
      uk: |
        Працюй у теці свого проєкту. Команди нижче написано для «Списку бажань» у `~/js-course/wishlist`; для свого проєкту підстав його теку.

        **Що цей урок вважає про твій проєкт.** Це той самий проєкт під Git, який ти будуєш у кроках курсу: після експорту JS-10 у ньому лишилися `tools/restore-data.html` і `data/exported-storage.json`, а кроки React-етапу перетворили його на застосунок React, який збирає esbuild (не Vite). Вхід — `main.tsx`, компоненти — у `ui/`, маршрути живуть в адресі після `#` (`#/items/w-01`). Скрипти: `npm start` збирає застосунок і тести дій користувача та запускає сервер на `http://127.0.0.1:4310/` — на тій самій адресі, що й CP-JS, тож React-версія читає те саме сховище й той самий ключ (`jsll.wishlist.v1` для «Списку бажань»); `npm test` — це `node run-tests.js`, тести Node.js без DOM (домен, сховище, reducer); `npm run typecheck` — це `tsc -p .`. Тести дій користувача працюють лише в браузері, на сторінці `http://127.0.0.1:4310/tests.html`. Скрипта `dev` немає: `npm run dev` закінчується `npm error Missing script: "dev"`. Якщо щось у тебе інакше — крок, який на це спирається, запиши в докази як знахідку.

        Ми виконали ці команди в macOS на копії еталона кроку CP-RE «Списку бажань»: Node.js v25.2.1, npm 11.6.2, Git 2.51.0, TypeScript 7.0.2, esbuild 0.28.2, React 19.3.0, Chrome 154. Вивід `npm test`, `tests.html` і прибраного cleanup узято з перевірки самого кроку CP-RE. Числа пакетів, тестів і записів у тебе будуть інші. У Linux команди ті самі; у Windows виконуй їх у Git Bash, де працюють `rm -rf` і `echo $?` (у PowerShell код завершення показує `$LASTEXITCODE`). У Linux і Windows ми їх не запускали.

        **Що показує крок 2:**

        ```text
        {
          "start": "npm run build && npm run build:tests && node --env-file=.env serve.mjs",
          "lint": "eslint .",
          "format": "prettier --write main.tsx ui",
          "build": "esbuild main.tsx --bundle --splitting --sourcemap --format=esm --outdir=dist --entry-names=app",
          "test": "node run-tests.js",
          "typecheck": "tsc -p .",
          "build:tests": "esbuild tests/ui-run.tsx --bundle --sourcemap --format=esm --outfile=dist/tests.js"
        }
        ```

        **Що показує крок 3:**

        ```text
        added 90 packages, and audited 91 packages in 877ms
        …
        found 0 vulnerabilities
        ```

        **Що показує крок 4, коли в коді є помилки типів** (для порівняння: ми додали тимчасовий файл `ui/probe.ts` із параметром без типу й зі значенням, яке може бути `null`; `tsconfig.json` проєкту вмикає строгий режим — `"strict": true`):

        ```text
        > js-learning-lab-wishlist@1.0.0 typecheck
        > tsc -p .

        ui/probe.ts:1:23 - error TS7006: Parameter 'prices' implicitly has an 'any' type.

        1 export function total(prices) {
                                ~~~~~~

        ui/probe.ts:5:10 - error TS18047: 'maybe' is possibly 'null'.

        5   return maybe.length;
                   ~~~~~


        Found 2 errors in the same file, starting at: ui/probe.ts:1
        ```

        і `echo $?` друкує `1`. Так `tsc` пише в терміналі (і у вбудованому терміналі VS Code): файл, рядок і стовпчик, під ними — рядок коду з позначкою. Якщо вивід іде не в термінал, а у файл чи іншу програму, ті самі помилки мають коротший вигляд: `ui/probe.ts(1,23): error TS7006: …`. Без помилок `tsc -p .` не друкує нічого, крім двох рядків заголовка, а `echo $?` друкує `0`.

        **Що показує крок 6** (після рядків збирання esbuild):

        ```text
        Проєкт працює: http://127.0.0.1:4310/
        Відновити збережені дані: http://127.0.0.1:4310/tools/restore-data.html
        Зупинити: Ctrl+C
        ```

        **Заготовка `docs/cp-re-evidence.md` для кроку 10** — заповни останній стовпчик тим, що побачив сам:

        ```markdown
        # Докази CP-RE

        | Рядок | Команда чи прохід | Що я побачив |
        |---|---|---|
        | Чисте встановлення | `npm ci` | |
        | Типи | `npm run typecheck`, `echo $?` | |
        | Поведінка (логіка) | `npm test`, `echo $?` | |
        | Поведінка (дії користувача) | `http://127.0.0.1:4310/tests.html` | |
        | Cleanup ефектів | тест для cleanup у `tests.html`; він же без рядка cleanup | |
        | Доступні маршрути | прохід клавіатурою на `http://127.0.0.1:4310/` | |
        | Дані CP-JS | головна сторінка на `http://127.0.0.1:4310/` | |
        | Покращення | прохід і тести нового маршруту | |
        ```
      en: |
        Work in your project's folder. The commands below are written for the wishlist in `~/js-course/wishlist`; for your project use its folder.

        **What this lesson assumes about your project.** It is the same project under Git that you build in the course steps: after the JS-10 export it still has `tools/restore-data.html` and `data/exported-storage.json`, and the React-stage steps turned it into a React app built by esbuild (not Vite). The entry is `main.tsx`, the components are in `ui/`, and the routes live in the address after `#` (`#/items/w-01`). The scripts: `npm start` builds the app and the user-action tests and starts the server at `http://127.0.0.1:4310/` — the same address as CP-JS, so the React version reads the same storage and the same key (`jsll.wishlist.v1` for the wishlist); `npm test` is `node run-tests.js`, the Node.js tests without a DOM (domain, storage, reducer); `npm run typecheck` is `tsc -p .`. The user-action tests run only in the browser, on the page `http://127.0.0.1:4310/tests.html`. There is no `dev` script: `npm run dev` ends with `npm error Missing script: "dev"`. If something is different for you, record the step that relies on it as a finding in the evidence.

        We ran these commands on macOS on a copy of the wishlist's reference of the CP-RE step: Node.js v25.2.1, npm 11.6.2, Git 2.51.0, TypeScript 7.0.2, esbuild 0.28.2, React 19.3.0, Chrome 154. The output of `npm test`, `tests.html` and the removed cleanup comes from the check of the CP-RE step itself. Your numbers of packages, tests and records will differ. On Linux the commands are the same; on Windows run them in Git Bash, where `rm -rf` and `echo $?` work (in PowerShell `$LASTEXITCODE` shows the exit code). We did not run them on Linux or Windows.

        **What step 2 shows:**

        ```text
        {
          "start": "npm run build && npm run build:tests && node --env-file=.env serve.mjs",
          "lint": "eslint .",
          "format": "prettier --write main.tsx ui",
          "build": "esbuild main.tsx --bundle --splitting --sourcemap --format=esm --outdir=dist --entry-names=app",
          "test": "node run-tests.js",
          "typecheck": "tsc -p .",
          "build:tests": "esbuild tests/ui-run.tsx --bundle --sourcemap --format=esm --outfile=dist/tests.js"
        }
        ```

        **What step 3 shows:**

        ```text
        added 90 packages, and audited 91 packages in 877ms
        …
        found 0 vulnerabilities
        ```

        **What step 4 shows when the code has type errors** (for comparison: we added a temporary file `ui/probe.ts` with a parameter without a type and a value that may be `null`; the project's `tsconfig.json` turns strict mode on — `"strict": true`):

        ```text
        > js-learning-lab-wishlist@1.0.0 typecheck
        > tsc -p .

        ui/probe.ts:1:23 - error TS7006: Parameter 'prices' implicitly has an 'any' type.

        1 export function total(prices) {
                                ~~~~~~

        ui/probe.ts:5:10 - error TS18047: 'maybe' is possibly 'null'.

        5   return maybe.length;
                   ~~~~~


        Found 2 errors in the same file, starting at: ui/probe.ts:1
        ```

        and `echo $?` prints `1`. This is how `tsc` writes in a terminal (the VS Code integrated terminal included): the file, line and column, and under them the line of code with a marker. When the output goes to a file or another program instead of a terminal, the same errors look shorter: `ui/probe.ts(1,23): error TS7006: …`. Without errors `tsc -p .` prints nothing but the two header lines, and `echo $?` prints `0`.

        **What step 6 shows** (after the esbuild build lines):

        ```text
        The project is running: http://127.0.0.1:4310/
        Restore saved data: http://127.0.0.1:4310/tools/restore-data.html
        Stop with Ctrl+C
        ```

        **A template of `docs/cp-re-evidence.md` for step 10** — fill the last column with what you saw yourself:

        ```markdown
        # CP-RE evidence

        | Row | Command or walk-through | What I saw |
        |---|---|---|
        | Clean install | `npm ci` | |
        | Types | `npm run typecheck`, `echo $?` | |
        | Behavior (logic) | `npm test`, `echo $?` | |
        | Behavior (user actions) | `http://127.0.0.1:4310/tests.html` | |
        | Effect cleanup | the cleanup test in `tests.html`; the same test without the cleanup line | |
        | Accessible routes | keyboard walk-through at `http://127.0.0.1:4310/` | |
        | CP-JS data | the main page at `http://127.0.0.1:4310/` | |
        | Enhancement | walk-through and tests of the new route | |
        ```
    tools:
      - { name: "Node.js", version: { uk: "22.13 або новіший (запущено на v25.2.1)", en: "22.13 or newer (run: v25.2.1)" }, note: { uk: "Разом із npm (у нас 11.6.2).", en: "Together with npm (ours: 11.6.2)." } }
      - { name: "Git", version: "2.51.0", note: { uk: "Для стану проєкту й commit.", en: "For the project state and the commit." } }
      - { name: "VS Code", version: { uk: "будь-яка актуальна", en: "any current" }, note: { uk: "Щоб відкривати файли й шукати рядки для пояснення.", en: "To open files and find lines for the explanation." } }
      - { name: "Chrome", version: { uk: "154 (будь-яка актуальна)", en: "154 (any current)" }, note: { uk: "Для `tests.html`, проходу клавіатурою й даних CP-JS.", en: "For `tests.html`, the keyboard walk-through and the CP-JS data." } }
    steps:
      - text:
          uk: "Перейди в теку проєкту й переконайся, що робоча тека чиста: перевірка має стосуватися саме того, що збережено в commit."
          en: "Go to the project folder and make sure the working tree is clean: the check must be about exactly what is committed."
        command: "cd ~/js-course/wishlist\ngit status"
        expect:
          uk: "`nothing to commit, working tree clean`. Якщо ні — спершу зроби commit своїх змін."
          en: "`nothing to commit, working tree clean`. If not, commit your changes first."
      - text:
          uk: "Подивись, які скрипти визначає проєкт. Для рубрики потрібні три: `start` (застосунок і `tests.html`), `test` і `typecheck`."
          en: "See which scripts the project defines. The rubric needs three: `start` (the app and `tests.html`), `test` and `typecheck`."
        command: "npm pkg get scripts"
        expect:
          uk: "Об’єкт зі скриптами, як у вступі (крок 2): `\"typecheck\": \"tsc -p .\"`, `\"test\": \"node run-tests.js\"`, а `start` запускає `build`, `build:tests` і сервер. Якщо якогось із трьох немає, рядок, що на нього спирається, поки не доведено — запиши це в докази як знахідку."
          en: "An object with the scripts, as in the introduction (step 2): `\"typecheck\": \"tsc -p .\"`, `\"test\": \"node run-tests.js\"`, and `start` runs `build`, `build:tests` and the server. If one of the three is missing, the row that relies on it is not proved yet — record that in the evidence as a finding."
      - text:
          uk: "Чисте встановлення: видали `node_modules` і встанови пакети рівно з lockfile. `npm ci` не змінює `package-lock.json` і зупиняється з помилкою, якщо він не збігається з `package.json`."
          en: "A clean install: delete `node_modules` and install the packages exactly from the lockfile. `npm ci` does not change `package-lock.json` and stops with an error if it does not match `package.json`."
        command: "rm -rf node_modules\nnpm ci"
        expect:
          uk: "`added … packages, and audited … packages in …` і `found 0 vulnerabilities`, як у вступі (крок 3)."
          en: "`added … packages, and audited … packages in …` and `found 0 vulnerabilities`, as in the introduction (step 3)."
      - text:
          uk: "Рядок «Типи»: строга перевірка типів і код завершення."
          en: "The “Types” row: the strict type check and its exit code."
        command: "npm run typecheck\necho $?"
        expect:
          uk: "Лише два рядки заголовка (`> … typecheck`, `> tsc -p .`) і `0`. Помилки виглядають як `ui/….tsx:рядок:стовпчик - error TS…` з рядком коду під ними й підсумком `Found … errors…` і дають `1` (вступ, крок 4)."
          en: "Only the two header lines (`> … typecheck`, `> tsc -p .`) and `0`. Errors look like `ui/….tsx:line:column - error TS…` with the line of code under them and the summary `Found … errors…`, and give `1` (introduction, step 4)."
      - text:
          uk: "Рядок «Поведінка», частина без браузера: тести Node.js — домен, сховище, reducer — і код завершення."
          en: "The “Behavior” row, the part without a browser: the Node.js tests — domain, storage, reducer — and the exit code."
        command: "npm test\necho $?"
        expect:
          uk: "Рядок `✓` для кожного тесту, підсумок `Пройшли: … · не пройшли: 0` (у перевірці кроку CP-RE — `Пройшли: 37 · не пройшли: 0`) і `0`."
          en: "A `✓` line for every test, the summary `Passed: … · failed: 0` (`Passed: 37 · failed: 0` in the check of the CP-RE step) and `0`."
      - text:
          uk: "Запусти проєкт. `npm start` спершу збирає застосунок і тести дій користувача, а тоді запускає сервер на тій самій адресі, що й у CP-JS."
          en: "Start the project. `npm start` first builds the app and the user-action tests, then starts the server at the same address as in CP-JS."
        command: "npm start"
        expect:
          uk: "Рядки збирання esbuild, а тоді `Проєкт працює: http://127.0.0.1:4310/` (вступ, крок 6). Сервер працює, доки ти не натиснеш Ctrl+C; наступні кроки роби в браузері, а команди — в іншому терміналі в тій самій теці."
          en: "The esbuild build lines, then `The project is running: http://127.0.0.1:4310/` (introduction, step 6). The server runs until you press Ctrl+C; do the next steps in the browser, and the commands in another terminal in the same folder."
      - text:
          uk: "Рядки «Поведінка» (дії користувача) й «Cleanup ефектів»: відкрий `http://127.0.0.1:4310/tests.html` — тести дій користувача під `<StrictMode>`. Потім тимчасово прибери з файла в `ui/` рядок cleanup в ефекті, який перевіряє твій тест для cleanup, збери тести знову (`npm run build:tests` в іншому терміналі) і перезавантаж сторінку: цей тест має впасти. Тоді поверни файл командою `git restore` з його шляхом, знову `npm run build:tests` і перезавантаж."
          en: "The “Behavior” (user actions) and “Effect cleanup” rows: open `http://127.0.0.1:4310/tests.html` — the user-action tests under `<StrictMode>`. Then temporarily remove from the file in `ui/` the cleanup line of the effect that your cleanup test checks, build the tests again (`npm run build:tests` in another terminal) and reload the page: that test must fail. Then bring the file back with `git restore` and its path, run `npm run build:tests` again and reload."
        expect:
          uk: "Спершу всі рядки `✓` і `не пройшли: 0` (у перевірці кроку CP-RE — 13 рядків `✓`). Без cleanup — `✗` твого тесту для cleanup (у кроці CP-RE без `controller.abort()` у cleanup ефекту запиту списку — `✗ … очікувалося [\"aborted\"], отримано [\"answered\"]`). Після `git restore` і нового збирання — знову `не пройшли: 0`."
          en: "First every line `✓` and `failed: 0` (13 `✓` lines in the check of the CP-RE step). Without the cleanup — a `✗` of your cleanup test (in the CP-RE step, without `controller.abort()` in the cleanup of the list query effect — `✗ … expected [\"aborted\"], got [\"answered\"]`). After `git restore` and a new build — `failed: 0` again."
      - text:
          uk: "Рядок «Дані CP-JS»: відкрий `http://127.0.0.1:4310/` і порівняй записи з тими, що були в CP-JS. React-версія працює на тій самій адресі й читає той самий ключ, тож записи, збережені в CP-JS у цьому браузері, уже на місці. Якщо дані CP-JS лишилися лише в платформі, відкрий `http://127.0.0.1:4310/tools/restore-data.html` і натисни «Відновити дані»; експорт тримає дані на момент експорту JS-10."
          en: "The “CP-JS data” row: open `http://127.0.0.1:4310/` and compare the records with those you had in CP-JS. The React version runs at the same address and reads the same key, so the records saved in CP-JS in this browser are already in place. If the CP-JS data stayed only in the platform, open `http://127.0.0.1:4310/tools/restore-data.html` and press “Restore data”; the export holds the data as of the JS-10 export."
        expect:
          uk: "Головна сторінка показує ті самі записи з тими самими полями. Сторінка відновлення, якщо вона знадобилася, каже, що дані буде записано для адреси `http://127.0.0.1:4310`, а після кнопки — `Готово: записано 1. Відкрий проєкт, щоб побачити ті самі дані.`"
          en: "The main page shows the same records with the same fields. The restore page, if you needed it, says the data will be written for `http://127.0.0.1:4310`, and after the button `Done: 1 written. Open the project to see the same data.`"
      - text:
          uk: "Рядки «Доступні маршрути» й «Покращення»: відклади мишу. Пройди кожен маршрут лише клавіатурою — Tab і Shift+Tab, Enter на посиланнях і кнопках: додай, відредагуй і видали запис, відкрий новий маршрут свого покращення, після кожного переходу подивись, де стоїть фокус і чи видно його. Перезавантаж сторінку на глибокій адресі (наприклад, `http://127.0.0.1:4310/#/items/w-01`) — вона має відкритися."
          en: "The “Accessible routes” and “Enhancement” rows: put the mouse away. Walk every route with the keyboard only — Tab and Shift+Tab, Enter on links and buttons: add, edit and delete a record, open the new route of your enhancement, and after every navigation look where the focus is and whether it is visible. Reload the page on a deep address (for example, `http://127.0.0.1:4310/#/items/w-01`) — it must open."
        expect:
          uk: "Кожну дію виконано без миші; після переходу фокус стоїть на заголовку нового екрана, а вкладка показує його назву; перезавантаження на глибокій адресі показує той самий екран, а зміни лишаються."
          en: "Every action is done without the mouse; after a navigation the focus stands on the new screen's heading, and the tab shows its name; a reload on a deep address shows the same screen, and the changes stay."
      - text:
          uk: "Зупини сервер (Ctrl+C), створи `docs/cp-re-evidence.md` із заготовки у вступі й заповни кожен рядок тим, що побачив: код завершення, кількість тестів, кількість записів, де стояв фокус. Рядок, який не вдалося довести, так і запиши — разом із причиною."
          en: "Stop the server (Ctrl+C), create `docs/cp-re-evidence.md` from the template in the introduction and fill every row with what you saw: the exit code, the number of tests, the number of records, where the focus stood. A row you could not prove is recorded as such — with the reason."
        expect:
          uk: "Файл із вісьмома заповненими рядками. `git status --short` показує `?? docs/cp-re-evidence.md` (тека `docs/` уже є в проєкті з попередніх кроків)."
          en: "A file with eight filled rows. `git status --short` shows `?? docs/cp-re-evidence.md` (the project already has the `docs/` folder from earlier steps)."
    verify:
      - id: clean-install
        text: { uk: "`npm ci` встановив пакети з lockfile без помилок.", en: "`npm ci` installed the packages from the lockfile without errors." }
      - id: types-zero
        text: { uk: "`npm run typecheck` завершився з кодом `0`.", en: "`npm run typecheck` finished with the code `0`." }
      - id: tests-zero
        text: { uk: "`npm test` завершився з кодом `0`, `tests.html` показав `не пройшли: 0`, а без рядка cleanup мій тест для cleanup упав.", en: "`npm test` finished with the code `0`, `tests.html` showed `failed: 0`, and without the cleanup line my cleanup test failed." }
      - id: data-retained
        text: { uk: "На `http://127.0.0.1:4310/` відкриваються ті самі записи, що були в CP-JS.", en: "`http://127.0.0.1:4310/` opens the same records that I had in CP-JS." }
      - id: keyboard-walk
        text: { uk: "Я пройшов кожен маршрут, включно з новим, лише клавіатурою.", en: "I walked every route, the new one included, with the keyboard only." }
      - id: evidence-file
        text: { uk: "`docs/cp-re-evidence.md` містить команду й побачене для кожного рядка рубрики.", en: "`docs/cp-re-evidence.md` holds the command and what I saw for every rubric row." }
    troubleshooting:
      - problem:
          uk: "`npm ci` пише `` `npm ci` can only install packages when your package.json and package-lock.json or npm-shrinkwrap.json are in sync `` і далі, наприклад, `Invalid: lock file's prettier@3.9.9 does not satisfy prettier@3.9.8` чи `Missing: … from lock file`."
          en: "`npm ci` says `` `npm ci` can only install packages when your package.json and package-lock.json or npm-shrinkwrap.json are in sync `` and then, for example, `Invalid: lock file's prettier@3.9.9 does not satisfy prettier@3.9.8` or `Missing: … from lock file`."
        fix:
          uk: "Хтось змінив `package.json`, не оновивши lockfile. Виконай `npm install` — він оновить `package-lock.json`, — зроби commit обох файлів і знову запусти `npm ci`. Запиши це в докази: саме таку помилку побачив би рецензент."
          en: "Someone changed `package.json` without updating the lockfile. Run `npm install` — it updates `package-lock.json` — commit both files and run `npm ci` again. Record it in the evidence: this is exactly the error a reviewer would have seen."
      - problem:
          uk: "`npm error Missing script: \"dev\"` (або `\"typecheck\"`, `\"test\"`)."
          en: "`npm error Missing script: \"dev\"` (or `\"typecheck\"`, `\"test\"`)."
        fix:
          uk: "`dev` у цьому проєкті немає й не треба: сервер запускає `npm start`. `typecheck` (`tsc -p .`) і `test` (`node run-tests.js`) додали кроки проєкту; якщо їх немає, порівняй `package.json` з еталоном кроку CP-RE, а поки скрипта немає, рядок, що на нього спирається, не доведено — так і запиши."
          en: "This project has no `dev`, and needs none: `npm start` starts the server. `typecheck` (`tsc -p .`) and `test` (`node run-tests.js`) were added by the project steps; if they are missing, compare `package.json` with the reference of the CP-RE step, and while a script is missing, the row that relies on it is not proved — record exactly that."
      - problem:
          uk: "`tests.html` показує старі тести або досі `✓` після того, як ти прибрав рядок cleanup."
          en: "`tests.html` shows old tests, or still `✓` after you removed the cleanup line."
        fix:
          uk: "Тести збираються лише під час `npm start` або `npm run build:tests`: збери їх знову й перезавантаж сторінку."
          en: "The tests are built only on `npm start` or `npm run build:tests`: build them again and reload the page."
      - problem:
          uk: "Головна сторінка показує лише початкові записи, а не ті, що були в CP-JS."
          en: "The main page shows only the starting records, not the ones you had in CP-JS."
        fix:
          uk: "Сторінку відкрито не на `http://127.0.0.1:4310` — наприклад, на іншому порту після `npm start -- --port 4311`, коли 4310 був зайнятий. Інша адреса чи порт — інше сховище. Відкривай застосунок і сторінку відновлення на адресі, яку надрукував `npm start`: сторінка відновлення сама каже, для якої адреси запише дані."
          en: "The page is not open at `http://127.0.0.1:4310` — for example, on another port after `npm start -- --port 4311` when 4310 was busy. Another address or port is another storage. Open the app and the restore page at the address `npm start` printed: the restore page itself says which address it writes the data for."
      - problem:
          uk: "`/tools/restore-data.html` відповідає `Not found`: у проєкті вже немає `tools/` і `data/exported-storage.json`."
          en: "`/tools/restore-data.html` answers `Not found`: the project no longer has `tools/` and `data/exported-storage.json`."
        fix:
          uk: "Вони є в історії Git. `git log --oneline --diff-filter=D -- data/exported-storage.json` показує commit, який їх видалив; поверни їх зі стану перед ним: `git restore --source=<commit>~1 -- tools data` (замість `<commit>` — номер із першого стовпчика). Ми перевірили це на копії проєкту: файли повертаються як нові, ще не додані (`?? data/exported-storage.json`, `?? tools/`), тож зроби commit (`git add tools data`, потім `git commit`), щоб робоча тека знову була чиста."
          en: "They are in the Git history. `git log --oneline --diff-filter=D -- data/exported-storage.json` shows the commit that deleted them; bring them back from the state before it: `git restore --source=<commit>~1 -- tools data` (instead of `<commit>`, the id from the first column). We checked this on a copy of the project: the files come back as new, untracked files (`?? data/exported-storage.json`, `?? tools/`), so commit them (`git add tools data`, then `git commit`) to make the working tree clean again."
    recovery:
      uk: "Ці кроки нічого не змінюють у коді: `npm ci` лише перевстановлює `node_modules`, збирання пише лише в `dist/`, якого немає в Git, а тимчасово прибраний cleanup повертає `git restore`. Нові лише файли в `docs/`. Якщо заплутався, `git status` покаже, що змінено, а `git restore <файл>` поверне файл до останнього commit."
      en: "These steps change nothing in the code: `npm ci` only reinstalls `node_modules`, the builds write only into `dist/`, which is not in Git, and `git restore` brings back the temporarily removed cleanup. Only the files in `docs/` are new. If you get lost, `git status` shows what changed, and `git restore <file>` brings a file back to the last commit."

  - id: recall
    kind: review
    title:
      uk: "Пригадай перед поясненням"
      en: "Recall before you explain"
    items:
      - id: closure-sees-object
        from: js-03-05-closures
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          function makeReminder(task) {
            return () => console.log(task.title);
          }
          const task = { id: "t-01", title: "A" };
          const remind = makeReminder(task);
          task.title = "B";
          remind();
        verify:
          logs: ["B"]
        answer:
          type: choice
          options:
            - id: b
              text: { uk: "`B`", en: "`B`" }
            - id: a
              text: { uk: "`A`", en: "`A`" }
              why:
                uk: "Closure пам’ятає **змінну** `task`, а не копію об’єкта на момент створення. Змінна вказує на той самий об’єкт, і його поле змінили до виклику."
                en: "A closure remembers the **variable** `task`, not a copy of the object from the moment it was created. The variable points to the same object, and its field was changed before the call."
            - id: undefined
              text: { uk: "`undefined`: `makeReminder` уже завершилася", en: "`undefined`: `makeReminder` has already finished" }
              why:
                uk: "Саме в цьому сила closure: змінні функції, що завершилася, живуть далі, поки їх пам’ятає створена в ній функція."
                en: "That is exactly the power of a closure: the variables of a finished function live on while a function created in it remembers them."
          correct: [b]
        explanation:
          uk: "Closure пам’ятає змінні місця народження, а ті можуть вказувати на об’єкти, які змінюються. У React це пояснює дві речі: обробник бачить змінні **свого** рендеру (нові значення state — це нові змінні в новому рендері), а якщо state змінити мутацією того самого об’єкта, старий closure побачить зміну, а React — ні."
          en: "A closure remembers the variables of its birthplace, and they may point to objects that change. In React this explains two things: a handler sees the variables of **its own** render (new state values are new variables in a new render), and if state is changed by mutating the same object, an old closure sees the change while React does not."

  - id: explain-your-code
    kind: local-task
    runtime: local-web
    title:
      uk: "Без підказок: поясни state і closure у своєму коді"
      en: "Without hints: explain state and a closure in your code"
    intro:
      uk: |
        Це самостійна частина: підказок і зразка відповіді немає. Пиши своїми словами й лише про свій код — пояснення з загальних фраз нічого не доводить.

        **Заготовка `docs/cp-re-explanation.md`:**

        ```markdown
        # CP-RE: state і closures у моєму коді

        ## Знімок state в обробнику
        Файл і рядок:
        Що робить обробник:
        Яке значення state він бачить і чому:
        Що зламалося б, якби тут прочитати state одразу після виклику setter і розраховувати на нове значення:

        ## Closure в ефекті
        Файл і рядок:
        Що ефект синхронізує:
        Які значення захоплює його closure і які з них є в залежностях:
        Що прибирає cleanup і коли React його викликає:
        Що зламалося б, якби прибрати одну залежність або cleanup:
        ```
      en: |
        This is the independent part: there are no hints and no sample answer. Write in your own words and only about your code — an explanation made of general phrases proves nothing.

        **A template of `docs/cp-re-explanation.md`:**

        ```markdown
        # CP-RE: state and closures in my code

        ## A state snapshot in a handler
        File and line:
        What the handler does:
        Which state value it sees, and why:
        What would break if it read state right after calling the setter and counted on the new value:

        ## A closure in an effect
        File and line:
        What the effect synchronizes:
        Which values its closure captures, and which of them are in the dependencies:
        What the cleanup removes, and when React calls it:
        What would break if one dependency or the cleanup were removed:
        ```
    tools:
      - { name: "VS Code", version: { uk: "будь-яка актуальна", en: "any current" }, note: { uk: "Номер рядка видно ліворуч від коду.", en: "The line number is shown to the left of the code." } }
      - { name: "Chrome DevTools", version: { uk: "будь-яка актуальна", en: "any current" }, note: { uk: "Щоб перевірити своє пояснення тимчасовим `console.log`.", en: "To check your explanation with a temporary `console.log`." } }
    steps:
      - text:
          uk: "Знайди у своєму коді обробник, що викликає setter і після цього ще читає state або передає його далі, та ефект із масивом залежностей, чий код читає props чи state. Запиши в заготовку файл і номер рядка кожного."
          en: "Find in your code a handler that calls a setter and after that still reads state or passes it on, and an effect with a dependency array whose code reads props or state. Write the file and line number of each into the template."
        expect:
          uk: "Два місця з твого проєкту з файлом і рядком, наприклад `ui/ItemForm.tsx:42`."
          en: "Two places from your project with a file and a line, for example `ui/ItemForm.tsx:42`."
      - text:
          uk: "Заповни обидва розділи заготовки своїми словами. Перш ніж стверджувати, яке значення бачить обробник чи ефект, перевір це: додай тимчасовий `console.log`, збери застосунок (`npm start`, або `npm run build`, якщо сервер уже працює), перезавантаж `http://127.0.0.1:4310/`, виконай дію й подивись у DevTools **Console**. Сам сервер змін у файлах не стежить: без нового збирання сторінка показує старий код. Потім прибери рядок (`git restore` з шляхом файла) і запиши в пояснення, що саме побачив."
          en: "Fill both sections of the template in your own words. Before you claim which value a handler or an effect sees, check it: add a temporary `console.log`, build the app (`npm start`, or `npm run build` if the server is already running), reload `http://127.0.0.1:4310/`, do the action and look at the DevTools **Console**. The server itself does not watch the files: without a new build the page shows the old code. Then remove the line (`git restore` with the file's path) and write into the explanation what exactly you saw."
        expect:
          uk: "Кожне твердження в поясненні спирається на рядок коду або на те, що надрукувала консоль; `git status --short` не показує змінених файлів у `ui/`."
          en: "Every claim in the explanation rests on a line of code or on what the console printed; `git status --short` shows no changed files in `ui/`."
      - text:
          uk: "Зафіксуй контрольну точку одним commit, повідомлення якого каже, що зроблено."
          en: "Record the checkpoint in one commit whose message says what was done."
        command: "git status --short\ngit add docs\ngit commit -m \"CP-RE: record the rubric evidence and the state/closure explanation\"\ngit log --oneline\ngit status"
        expect:
          uk: "`git status --short` показує лише два рядки `?? docs/cp-re-evidence.md` і `?? docs/cp-re-explanation.md`; commit — `[main …] CP-RE: …` (замість `main` — назва твоєї гілки) і `2 files changed`, `create mode 100644 docs/cp-re-evidence.md` та `docs/cp-re-explanation.md`; новий commit угорі `git log --oneline`; `git status` — `nothing to commit, working tree clean`."
          en: "`git status --short` shows only the two lines `?? docs/cp-re-evidence.md` and `?? docs/cp-re-explanation.md`; the commit says `[main …] CP-RE: …` (your branch name instead of `main`) and `2 files changed`, `create mode 100644 docs/cp-re-evidence.md` and `docs/cp-re-explanation.md`; the new commit is on top of `git log --oneline`; `git status` says `nothing to commit, working tree clean`."
    verify:
      - id: two-places
        text: { uk: "Пояснення називає два місця мого коду з файлом і номером рядка.", en: "The explanation names two places of my code with a file and a line number." }
      - id: snapshot-why
        text: { uk: "Я пояснив, яке значення state бачить обробник і чому — через знімок рендеру, у якому його створено.", en: "I explained which state value the handler sees and why — through the snapshot of the render that created it." }
      - id: closure-deps
        text: { uk: "Я пояснив, що захоплює closure ефекту, як це пов’язано із залежностями й що робить cleanup.", en: "I explained what the effect's closure captures, how that relates to its dependencies and what the cleanup does." }
      - id: checked-claims
        text: { uk: "Я перевірив свої твердження тимчасовим `console.log` і прибрав його.", en: "I checked my claims with a temporary `console.log` and removed it." }
      - id: committed
        text: { uk: "Докази й пояснення — в одному commit, робоча тека чиста.", en: "The evidence and the explanation are in one commit, and the working tree is clean." }
    troubleshooting:
      - problem:
          uk: "У проєкті немає обробника, що читає state після виклику setter."
          en: "The project has no handler that reads state after calling a setter."
        fix:
          uk: "Візьми будь-який обробник, що читає state, і поясни, яке значення він бачить під час кліку й коли з’явиться нове. Тимчасовий `console.log` одразу після setter покаже старе значення — це й є знімок."
          en: "Take any handler that reads state and explain which value it sees during the click and when the new one appears. A temporary `console.log` right after the setter shows the old value — that is the snapshot."
      - problem:
          uk: "Після тимчасового `console.log` `git status --short` показує ` M ui/…`."
          en: "After the temporary `console.log`, `git status --short` shows ` M ui/…`."
        fix:
          uk: "Поверни файл до останнього commit: `git restore ui/…` (той самий шлях). У commit контрольної точки мають потрапити лише нові файли в `docs/`."
          en: "Bring the file back to the last commit: `git restore ui/…` (the same path). Only the new files in `docs/` belong in the checkpoint commit."
    recovery:
      uk: "Якщо commit уже зроблено, а в нього випадково потрапив змінений файл із `ui/`, не переписуй історію. `git log --oneline -2` покаже твій commit і той, що перед ним; поверни файл зі стану того, що перед ним: `git restore --source=<номер> ui/…` (замість `<номер>` — перший стовпчик другого рядка), і зроби ще один commit із поясненням."
      en: "If the commit is made and a changed file from `ui/` slipped into it, do not rewrite history. `git log --oneline -2` shows your commit and the one before it; bring the file back from the state of the one before it: `git restore --source=<id> ui/…` (instead of `<id>`, the first column of the second line), and make one more commit with an explanation."
