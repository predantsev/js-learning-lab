id: re-08-02-what-the-checkpoint-checks
unit: RE-08
title:
  uk: "Що перевіряє CP-RE"
  en: "What CP-RE checks"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Зіставити кожен рядок рубрики CP-RE (тести поведінки, строгі типи, cleanup ефектів, доступні маршрути, збережені дані CP-JS) з доказом, який його підтверджує."
    en: "Map each CP-RE criterion (behavioral tests, strict types, effect cleanup, accessible routes, retained CP-JS data) to the evidence that proves it."
  - uk: "Пояснити, що можуть довести тести компонентів на фікстурах і що показує лише запуск у справжньому браузері."
    en: "Explain what fixture-backed component tests can prove and what only an end-to-end run in a real browser can show."
prerequisites: [re-08-01-checkpoint-review, re-06-08-testing-user-actions]
subskills:
  - { family: R-10, skill: "behavioral component/integration/user tests", depth: intro }
  - { family: R-10, skill: "typed UI", depth: intro }
  - { family: R-10, skill: "effect cleanup", depth: intro }
  - { family: R-10, skill: "accessible routes", depth: intro }
  - { family: R-10, skill: "fixture vs browser E2E limits", depth: intro }
glossary: [checkpoint-rubric]
selfCheck: [click-through, empty-on-dev-server]

blocks:
  - id: five-rows
    kind: explanation
    title:
      uk: "П’ять рядків, п’ять доказів"
      en: "Five rows, five pieces of evidence"
    body:
      uk: |
        Контрольна точка CP-RE оцінюється за [[checkpoint-rubric|рубрикою]] — списком рядків, і кожен рядок закриває **свій** доказ:

        | Рядок | Що він стверджує | Доказ |
        |---|---|---|
        | Поведінка | користувач бачить правильний результат своїх дій | [[user-action-test\|тести дій користувача]] проходять, `npm test` завершується з кодом `0` |
        | Типи | props, state і події описано строгими типами | `tsc` у строгому режимі: 0 помилок |
        | Cleanup ефектів | кожен ефект прибирає за собою | тест у `<StrictMode>`, який падає без cleanup |
        | Доступні маршрути | кожен маршрут досяжний і зрозумілий із клавіатури | твій прохід клавіатурою в браузері: Tab, Enter, фокус після переходу |
        | Дані CP-JS | записи, збережені в CP-JS, відкриваються без змін | ті самі записи на адресі, де працює React-версія |

        Один доказ не закриває чужого рядка: зелені тести нічого не кажуть про типи, а `tsc` — про те, що бачить людина.
      en: |
        The checkpoint CP-RE is assessed with a [[checkpoint-rubric]] — a list of rows, and each row is closed by **its own** evidence:

        | Row | What it claims | Evidence |
        |---|---|---|
        | Behavior | the user sees the right result of their actions | [[user-action-test\|user-action tests]] pass, `npm test` exits with code `0` |
        | Types | props, state and events are described with strict types | `tsc` in strict mode: 0 errors |
        | Effect cleanup | every effect cleans up after itself | a test under `<StrictMode>` that fails without the cleanup |
        | Accessible routes | every route is reachable and understandable from the keyboard | your keyboard walk-through in a browser: Tab, Enter, focus after navigation |
        | CP-JS data | records saved in CP-JS open unchanged | the same records at the address where the React version runs |

        One piece of evidence does not close another row: green tests say nothing about types, and `tsc` says nothing about what a person sees.

  - id: rubric-map
    kind: visual
    visual: diagram
    title:
      uk: "Рубрика CP-RE і її докази"
      en: "The CP-RE rubric and its evidence"
    textEquivalent:
      uk: >-
        Ліворуч п’ять рядків рубрики CP-RE, праворуч — доказ кожного. Поведінку доводять тести дій
        користувача через npm test. Типи доводить tsc у строгому режимі: пісочниця курсу типи лише
        прибирає. Cleanup ефектів доводить тест, що монтує компонент у StrictMode і падає, якщо
        cleanup бракує. Доступні маршрути доводить твій прохід клавіатурою у справжньому браузері, а
        збережені дані CP-JS — ті самі записи, відкриті в браузері на адресі dev-сервера. Ці два
        останні зв’язки пунктирні: тести на фікстурах їх не доводять, бо не мають ні справжнього
        фокуса й переходів, ні сховища тієї адреси.
      en: >-
        On the left are the five rows of the CP-RE rubric, on the right the evidence for each.
        User-action tests run with npm test prove the behavior. tsc in strict mode proves the types:
        the course sandbox only removes types. A test that mounts the component under StrictMode and
        fails when the cleanup is missing proves the effect cleanup. Your keyboard walk-through in a
        real browser proves the accessible routes, and the same records opened in a browser at the
        dev server's address prove the retained CP-JS data. These last two links are dashed:
        fixture tests do not prove them, because they have neither real focus and navigation nor
        the storage of that address.
    spec:
      layout: grid
      groups:
        - { id: rubric, label: { uk: "Рядок рубрики", en: "Rubric row" } }
        - { id: proof, label: { uk: "Доказ", en: "Evidence" } }
      nodes:
        - { id: behavior, group: rubric, label: { uk: "Поведінка", en: "Behavior" }, col: 0, row: 0 }
        - { id: types, group: rubric, label: { uk: "Типи", en: "Types" }, col: 0, row: 1 }
        - { id: cleanup, group: rubric, label: "Cleanup", col: 0, row: 2 }
        - { id: routes, group: rubric, label: { uk: "Маршрути", en: "Routes" }, col: 0, row: 3 }
        - { id: data, group: rubric, label: { uk: "Дані CP-JS", en: "CP-JS data" }, col: 0, row: 4 }
        - { id: tests, group: proof, label: "npm test", shape: round, col: 1, row: 0 }
        - { id: tsc, group: proof, label: "tsc", shape: round, col: 1, row: 1 }
        - { id: strict, group: proof, label: { uk: "тест StrictMode", en: "StrictMode test" }, shape: round, col: 1, row: 2 }
        - { id: walk, group: proof, label: { uk: "прохід Tab", en: "Tab walk" }, shape: round, col: 1, row: 3 }
        - { id: browser, group: proof, label: { uk: "dev-адреса", en: "dev address" }, shape: round, col: 1, row: 4 }
      edges:
        - { id: e-behavior, from: behavior, to: tests }
        - { id: e-types, from: types, to: tsc }
        - { id: e-cleanup, from: cleanup, to: strict }
        - { id: e-routes, from: routes, to: walk, kind: dashed }
        - { id: e-data, from: data, to: browser, kind: dashed }
      steps:
        - caption:
            uk: "П’ять рядків рубрики — п’ять окремих доказів. Жоден із них не замінює інших."
            en: "Five rubric rows — five separate pieces of evidence. None of them replaces the others."
        - highlight: [behavior, tests, e-behavior]
          dim: [types, cleanup, routes, data, tsc, strict, walk, browser, e-types, e-cleanup, e-routes, e-data]
          caption:
            uk: "**Поведінка**: тести дій користувача, запущені через `npm test`. Прохід руками по CRUD — лише частина цього рядка, і її не повториш автоматично."
            en: "**Behavior**: user-action tests run with `npm test`. Clicking through the CRUD by hand is only part of this row, and you cannot repeat it automatically."
        - highlight: [types, tsc, e-types]
          dim: [behavior, cleanup, routes, data, tests, strict, walk, browser, e-behavior, e-cleanup, e-routes, e-data]
          caption:
            uk: "**Типи**: лише `tsc`. Пісочниця курсу прибирає типи, нічого не перевіряючи, тож зелені тести тут нічого не доводять."
            en: "**Types**: only `tsc`. The course sandbox removes types without checking anything, so green tests prove nothing here."
        - highlight: [cleanup, strict, e-cleanup]
          dim: [behavior, types, routes, data, tests, tsc, walk, browser, e-behavior, e-types, e-routes, e-data]
          caption:
            uk: "**Cleanup**: тест, що монтує компонент у `<StrictMode>` і **падає**, якщо cleanup бракує. Компонент, який «просто працює», цього не доводить."
            en: "**Cleanup**: a test that mounts the component under `<StrictMode>` and **fails** when the cleanup is missing. A component that “just works” does not prove it."
        - highlight: [routes, walk, data, browser, e-routes, e-data]
          dim: [behavior, types, cleanup, tests, tsc, strict, e-behavior, e-types, e-cleanup]
          annotate:
            - { id: e-routes, text: { uk: "лише справжній браузер", en: "only a real browser" } }
            - { id: e-data, text: { uk: "лише справжній браузер", en: "only a real browser" } }
          caption:
            uk: "Пунктир — те, чого тести на фікстурах не доводять: справжній фокус і переходи між маршрутами та сховище саме тієї адреси, де працює застосунок."
            en: "Dashed is what fixture tests do not prove: real focus and navigation between routes, and the storage of exactly the address where the app runs."

  - id: click-through
    kind: prediction
    prompt:
      uk: "Ти запустив React-версію проєкту, руками додав, відредагував і видалив запис — усе працює. Які рядки рубрики CP-RE це закриває?"
      en: "You started the React version of your project and added, edited and deleted a record by hand — everything works. Which rows of the CP-RE rubric does this close?"
    answer:
      type: choice
      options:
        - id: none-fully
          text:
            uk: "Жодного повністю: це частина рядка «Поведінка», без тестів, які можна повторити"
            en: "None fully: it is part of the “Behavior” row, without tests that can be repeated"
        - id: all
          text:
            uk: "Усі: якщо CRUD працює, контрольну точку пройдено"
            en: "All of them: if the CRUD works, the checkpoint is passed"
          why:
            uk: "Клік мишею не перевіряє типів, не монтує компонент двічі, як StrictMode, не проходить маршрути клавіатурою й не відкриває даних CP-JS. Кожен із цих рядків потребує свого доказу."
            en: "A mouse click does not check types, does not mount the component twice like StrictMode, does not walk the routes with the keyboard and does not open the CP-JS data. Each of these rows needs its own evidence."
        - id: behavior-and-cleanup
          text:
            uk: "«Поведінку» й «Cleanup»: якби ефект не прибирав за собою, я б побачив дублікати"
            en: "“Behavior” and “Cleanup”: if an effect did not clean up after itself, I would have seen duplicates"
          why:
            uk: "Не обов’язково: зайвий listener чи підписка нічим не видні, доки не станеться саме та подія, на яку вони чекають, — натискання клавіші, повідомлення ззовні. Прохід мишею по CRUD може її жодного разу не викликати. Cleanup доводить тест, який викликає цю подію й **падає** без cleanup."
            en: "Not necessarily: an extra listener or subscription is invisible until exactly the event it waits for happens — a key press, a message from outside. A mouse pass through the CRUD may never trigger it. Cleanup is proved by a test that triggers that event and **fails** without the cleanup."
        - id: behavior
          text:
            uk: "Рядок «Поведінка» повністю"
            en: "The “Behavior” row fully"
          why:
            uk: "Рядок вимагає тестів, які можна запускати знову й знову (`npm test`), а не одного проходу руками, який доводить лише те, що це спрацювало зараз і в тебе."
            en: "The row requires tests that can run again and again (`npm test`), not one pass by hand, which proves only that it worked now and for you."
      correct: [none-fully]
    explanation:
      uk: "Прохід руками — гарний перший сигнал, але він не повторюється автоматично й не бачить того, що не видно мишею: типів, повторного монтування, клавіатури, даних на іншій адресі. Для CP-RE кожен рядок рубрики має власний доказ."
      en: "A pass by hand is a good first signal, but it does not repeat automatically and does not see what a mouse cannot: types, a second mount, the keyboard, the data at another address. For CP-RE every rubric row has its own evidence."

  - id: rubric-suite
    kind: example
    runtime: browser-react
    dir: rubric-suite
    entry: main.jsx
    strings:
      heading: { uk: "Справи", en: "Tasks" }
      showDone: { uk: "Показати виконані", en: "Show done tasks" }
      shortcutHint: { uk: "Клавіша F теж показує або ховає виконані справи.", en: "The F key also shows or hides the done tasks." }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      wardrobe: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
      tBehavior: { uk: "[поведінка] позначка «Показати виконані» показує виконані справи", en: "[behavior] ticking “Show done tasks” shows the done tasks" }
      tCleanup: { uk: "[cleanup] одне натискання F у StrictMode показує виконані справи", en: "[cleanup] one press of F under StrictMode shows the done tasks" }
      tAccessible: { uk: "[доступність] фільтр має видимий підпис", en: "[accessible] the filter has a visible label" }
      mRows: { uk: "кількість справ у списку", en: "the number of tasks in the list" }
      mField: { uk: "поле з підписом «Показати виконані»", en: "the field labelled “Show done tasks”" }
      noteTypes: { uk: "… [типи] тут не перевіряється: пісочниця прибирає типи — доказ дає tsc на твоєму комп’ютері", en: "… [types] not checked here: the sandbox removes types — tsc on your computer gives the evidence" }
      noteData: { uk: "… [дані CP-JS] тут не перевіряється: потрібен справжній браузер на адресі твого dev-сервера", en: "… [CP-JS data] not checked here: it needs a real browser at your dev server's address" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rNotFound: { uk: "на екрані немає", en: "not on the screen:" }
      rStillMissing: { uk: "так і не з’явилося", en: "never appeared" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Рубрика в пісочниці"
      en: "The rubric in the sandbox"
    body:
      uk: |
        `TaskBoard` — список справ із фільтром «Показати виконані» і клавішею F, яка робить те саме: ефект додає на `window` listener `keydown`, а cleanup його знімає. `rubric.test.jsx` перевіряє три рядки рубрики; позначка на початку назви тесту каже, який саме.

        `testing.js` — курсовий запускач тестів із RE-06 з двома змінами: `render` тепер показує компонент усередині `<StrictMode>`, як `main.jsx`, а `user.press("f")` натискає клавішу. Натисни **Запустити** й подивись у **Консоль**: три рядки `✓`, підсумок `Пройшли: 3 · не пройшли: 0` і дві примітки про рядки, яких пісочниця не перевіряє.
      en: |
        `TaskBoard` is a task list with a “Show done tasks” filter and an F key that does the same: an effect adds a `keydown` listener to `window`, and the cleanup removes it. `rubric.test.jsx` checks three rubric rows; the tag at the start of each test name says which one.

        `testing.js` is the course test runner from RE-06 with two changes: `render` now shows the component inside `<StrictMode>`, like `main.jsx`, and `user.press("f")` presses a key. Press **Run** and look at the **Console**: three `✓` lines, the summary `Passed: 3 · failed: 0` and two notes about rows that the sandbox does not check.
    tryIt:
      uk: |
        1. У `TaskBoard.jsx` видали рядок `return () => window.removeEventListener("keydown", handleKey);` і запусти. Червоніє лише `[cleanup]`: StrictMode залишив два listeners, і одне натискання F двічі перемикає фільтр — назад. А клік по позначці працює, тож прохід мишею помилки не показав би. Поверни рядок.
        2. Видали елемент `<label htmlFor="show-done">…</label>` і запусти. Тепер червоніє `[доступність]`: поле досі працює й тест `[поведінка]` зелений, але людина з програмою зчитування з екрана не дізнається, що це за позначка. Поверни підпис.
      en: |
        1. In `TaskBoard.jsx` delete the line `return () => window.removeEventListener("keydown", handleKey);` and run. Only `[cleanup]` turns red: StrictMode left two listeners, and one press of F toggles the filter twice — back again. Clicking the checkbox still works, so a pass with the mouse would not have shown the bug. Put the line back.
        2. Delete the element `<label htmlFor="show-done">…</label>` and run. Now `[accessible]` turns red: the field still works and the `[behavior]` test is green, but a person using a screen reader does not learn what the checkbox is for. Put the label back.

  - id: fixture-limits
    kind: explanation
    title:
      uk: "Що доводить фікстура, а що — лише справжній браузер"
      en: "What a fixture proves, and what only a real browser shows"
    body:
      uk: |
        Тести вище працюють на [[test-fixture|фікстурах]]: дані з файла, компонент у порожньому контейнері, події, створені кодом тесту. Так вони швидкі й детерміновані — і доводять **логіку**: що бачить людина після дії, чи прибирає ефект за собою.

        Але фікстура — не твій застосунок у браузері. Вона не доводить:

        - **сховища потрібної адреси.** Дані CP-JS лежать у `localStorage` адреси, де працював проєкт JS-етапу. Інший порт — інше сховище, а тест узагалі бере дані з фікстури.
        - **справжньої клавіатури й фокуса.** Подія, яку створив код (як у `user.press`), запускає лише твої listeners: браузер не переводить фокус на Tab і не натискає кнопку на Enter.
        - **справжніх переходів між маршрутами**: адресного рядка, кнопки «Назад», перезавантаження на глибокій адресі.

        Тож для рядків «Маршрути» й «Дані CP-JS» потрібен запуск у справжньому браузері — твій прохід руками або [[end-to-end-test|end-to-end тест]].
      en: |
        The tests above work on [[test-fixture|fixtures]]: data from a file, a component in an empty container, events created by the test's code. That makes them fast and deterministic — and they prove **the logic**: what a person sees after an action, whether an effect cleans up after itself.

        But a fixture is not your app in a browser. It does not prove:

        - **the storage of the right address.** The CP-JS data lives in the `localStorage` of the address where the JavaScript-stage project ran. Another port is another storage, and the test takes its data from a fixture anyway.
        - **the real keyboard and focus.** An event created by code (as in `user.press`) only runs your listeners: the browser does not move the focus on Tab and does not press a button on Enter.
        - **real navigation between routes**: the address bar, the Back button, a reload on a deep address.

        So the rows “Routes” and “CP-JS data” need a run in a real browser — your pass by hand or an [[end-to-end-test]].

  - id: empty-on-dev-server
    kind: prediction
    prompt:
      uk: "Усі тести React-версії проєкту зелені: вони показують список із 6 записів із файла-фікстури. У CP-JS ти зберіг 9 записів на `http://127.0.0.1:4310`. Тепер ти вперше відкриваєш dev-сервер React-версії на `http://localhost:5173` — і список порожній. Чому?"
      en: "All tests of your project's React version are green: they show a list of 6 records from a fixture file. In CP-JS you saved 9 records at `http://127.0.0.1:4310`. Now you open the React version's dev server at `http://localhost:5173` for the first time — and the list is empty. Why?"
    answer:
      type: choice
      options:
        - id: origin
          text:
            uk: "Сховище браузера окреме для кожної адреси й порту, а тести брали дані з фікстури, не зі сховища цієї адреси"
            en: "Browser storage is separate for every address and port, and the tests took their data from a fixture, not from this address's storage"
        - id: tests-wrong
          text:
            uk: "Тести хибні: якби вони були правильні, список не був би порожній"
            en: "The tests are wrong: if they were right, the list would not be empty"
          why:
            uk: "Тести можуть бути цілком правильні — вони доводять логіку на фікстурі. Про сховище адреси `localhost:5173` вони нічого не знають."
            en: "The tests can be completely right — they prove the logic on a fixture. They know nothing about the storage of the address `localhost:5173`."
        - id: react-clears
          text:
            uk: "React очищає `localStorage`, коли застосунок монтується вперше"
            en: "React clears `localStorage` when the app mounts for the first time"
          why:
            uk: "React не чіпає `localStorage` — це робить лише твій код. Просто на новій адресі твій код читає інше, порожнє сховище."
            en: "React does not touch `localStorage` — only your code does. At the new address your code simply reads another, empty storage."
        - id: same-host
          text:
            uk: "`127.0.0.1` і `localhost` — той самий комп’ютер, тож дані мали з’явитися; це помилка dev-сервера"
            en: "`127.0.0.1` and `localhost` are the same computer, so the data should have appeared; it is a dev server bug"
          why:
            uk: "Комп’ютер той самий, але для браузера це різні [[origin|джерела]]: інша назва вузла й інший порт. У кожного джерела — власне сховище."
            en: "It is the same computer, but for the browser these are different [[origin|origins]]: another host name and another port. Every origin has its own storage."
      correct: [origin]
    explanation:
      uk: "Рядок «Дані CP-JS» доводиться лише в браузері на тій адресі, де працює React-версія: спершу перенеси туди дані CP-JS, тоді переконайся, що відкриваються ті самі записи. Зелені тести на фікстурі цього рядка не закривають — і не повинні."
      en: "The “CP-JS data” row is proved only in a browser at the address where the React version runs: first bring the CP-JS data there, then make sure the same records open. Green fixture tests do not close this row — and they should not."

  - id: month-shortcut
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: month-shortcut
    entry: main.jsx
    editable: [MonthTotals.test.jsx]
    strings:
      monthWord: { uk: "Місяць", en: "Month" }
      shortcutHint: { uk: "Стрілки ← і → перемикають місяць.", en: "The ← and → arrow keys switch the month." }
      countLabel: { uk: "Витрат:", en: "Expenses:" }
      totalLabel: { uk: "разом", en: "total" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      lunch: { uk: "Обід", en: "Lunch" }
      tOpensOnMarch: { uk: "[поведінка] сторінка відкривається на березні 2026 з трьома витратами", en: "[behavior] the page opens on March 2026 with three expenses" }
      tOnePress: { uk: "[cleanup] стрілка перемикає рівно на один місяць", en: "[cleanup] an arrow key moves exactly one month" }
      mHeading: { uk: "заголовок місяця", en: "the month heading" }
      mRows: { uk: "кількість витрат у списку", en: "the number of expenses in the list" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rNotFound: { uk: "на екрані немає", en: "not on the screen:" }
      rStillMissing: { uk: "так і не з’явилося", en: "never appeared" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Доказ для рядка «Cleanup»"
      en: "Evidence for the “Cleanup” row"
    instructions:
      uk: |
        `MonthTotals` показує витрати одного місяця: заголовок `Місяць 2026-03`, кількість, суму й список. Стрілки → і ← на клавіатурі перемикають місяць на один уперед чи назад: ефект додає listener `keydown` на `window`, а cleanup його знімає. Сторінка відкривається на березні 2026; у лютому 2026 теж три витрати, в інших місяцях — жодної.

        У `MonthTotals.test.jsx` уже є тест для рядка «Поведінка». Допиши тест для рядка «Cleanup ефектів» — такий, що **проходить** із правильним `MonthTotals` і **падає**, якщо cleanup не знімає listener. Пам’ятай: `render` монтує компонент у `<StrictMode>`, а `user.press("ArrowRight")` натискає клавішу.

        Перевірки запускають твої тести з правильним `MonthTotals` і з трьома зламаними: без cleanup, з cleanup, що знімає не ту функцію, і з клавішами, які нічого не роблять. На кожній зламаній версії хоча б один твій тест має впасти.
      en: |
        `MonthTotals` shows the expenses of one month: the heading `Month 2026-03`, the count, the total and the list. The → and ← arrow keys move the month one forward or back: an effect adds a `keydown` listener to `window`, and the cleanup removes it. The page opens on March 2026; February 2026 also has three expenses, the other months none.

        `MonthTotals.test.jsx` already has a test for the “Behavior” row. Add a test for the “Effect cleanup” row — one that **passes** with the correct `MonthTotals` and **fails** when the cleanup does not remove the listener. Remember: `render` mounts the component inside `<StrictMode>`, and `user.press("ArrowRight")` presses a key.

        The checks run your tests with the correct `MonthTotals` and with three broken ones: without the cleanup, with a cleanup that removes a different function, and with arrow keys that do nothing. On each broken version at least one of your tests must fail.
    testTitles:
      "your tests pass with the correct MonthTotals":
        uk: "Твої тести проходять із правильним `MonthTotals`"
        en: "Your tests pass with the correct `MonthTotals`"
      "one of your tests fails when the cleanup is missing":
        uk: "Один із твоїх тестів падає, коли cleanup немає"
        en: "One of your tests fails when the cleanup is missing"
      "one of your tests fails when the cleanup removes a different function":
        uk: "Один із твоїх тестів падає, коли cleanup знімає не ту функцію"
        en: "One of your tests fails when the cleanup removes a different function"
      "one of your tests fails when the arrow keys do nothing":
        uk: "Один із твоїх тестів падає, коли стрілки нічого не роблять"
        en: "One of your tests fails when the arrow keys do nothing"
    hints:
      nudge:
        uk: "Що побачить людина, якщо після setup → cleanup → setup на `window` лишилося **два** listeners і вона натиснула стрілку один раз?"
        en: "What does a person see if, after setup → cleanup → setup, **two** listeners are left on `window` and they press an arrow key once?"
      explanation:
        uk: |
          Зайвий listener не видно, доки ти не дієш: тест має натиснути клавішу й перевірити **точний** результат, а не лише те, що «щось змінилося», — два listeners теж щось змінюють, просто вдвічі більше. Обережно з «туди й назад»: два кроки вперед і два назад теж повертають до початку.

          Схоже, з іншою задачею: якщо клавіша `+` збільшує масштаб на один крок, тест натискає її раз і чекає точно наступного кроку: `await user.press("+"); expect(screen.getByRole("status").textContent).toBe("110%");`.
        en: |
          An extra listener is invisible until you act: the test must press the key and check the **exact** result, not just that “something changed” — two listeners change something too, just twice as much. Careful with “there and back”: two steps forward and two back also return to the start.

          Similar, with a different task: if the `+` key zooms in by one step, the test presses it once and expects exactly the next step: `await user.press("+"); expect(screen.getByRole("status").textContent).toBe("110%");`.
    solutionNote:
      uk: "Тест натискає стрілку один раз і чекає точно наступного місяця, `Місяць 2026-04`. У StrictMode без cleanup лишаються два listeners, і місяць стрибає на два — тест падає; з cleanup, що знімає іншу функцію, — так само; якщо клавіші нічого не роблять, лишається березень — тест теж падає. Підійдуть і два натискання з очікуванням травня, чи одне назад із лютим і трьома витратами."
      en: "The test presses an arrow key once and expects exactly the next month, `Month 2026-04`. Under StrictMode without the cleanup two listeners remain and the month jumps by two — the test fails; with a cleanup that removes another function — the same; if the keys do nothing, March stays — the test fails too. Two presses expecting May, or one back expecting February with three expenses, work as well."
    feedback:
      - when: { test: "your tests pass with the correct MonthTotals" }
        message:
          uk: "Ця перевірка запускає твої тести з правильним `MonthTotals` і очікує щонайменше два тести, і жоден не має впасти. Подивись у **Консоль**: рядок `✗` каже, який тест упав і чому. Звір очікуваний заголовок із тим, що справді показує сторінка після твоїх натискань. Якщо всі перевірки падають разом, а рядків `✗` немає, спершу виправ першу помилку в консолі: тоді файл тестів не завантажився, і твої тести не запускалися."
          en: "This check runs your tests with the correct `MonthTotals` and expects at least two tests, none of them failing. Look at the **Console**: a `✗` line says which test failed and why. Compare the expected heading with what the page really shows after your key presses. If every check fails at once and there are no `✗` lines, fix the first console error first: then the test file did not load, and your tests never ran."
      - when: { test: "one of your tests fails when the cleanup is missing" }
        message:
          uk: "Спершу твої тести мають пройти з правильним `MonthTotals` (перша перевірка). Ця перевірка підставляє версію без cleanup — у StrictMode там два listeners — і очікує, що хоча б один тест упаде. Тест має натиснути стрілку й перевірити точний місяць; «місяць змінився» чи «туди й назад» пройдуть і з двома listeners."
          en: "First your tests must pass with the correct `MonthTotals` (the first check). This check puts in a version without the cleanup — under StrictMode it has two listeners — and expects at least one test to fail. The test must press an arrow key and check the exact month; “the month changed” or “there and back” pass with two listeners too."
      - when: { test: "one of your tests fails when the cleanup removes a different function" }
        message:
          uk: "Спершу твої тести мають пройти з правильним `MonthTotals` (перша перевірка). Ця перевірка підставляє версію, де cleanup викликає `removeEventListener` з новою стрілковою функцією — справжній listener лишається. Вона очікує, що хоча б один тест упаде: той самий тест на точний місяць ловить і цю поломку."
          en: "First your tests must pass with the correct `MonthTotals` (the first check). This check puts in a version whose cleanup calls `removeEventListener` with a new arrow function — the real listener stays. It expects at least one test to fail: the same exact-month test catches this fault too."
      - when: { test: "one of your tests fails when the arrow keys do nothing" }
        message:
          uk: "Спершу твої тести мають пройти з правильним `MonthTotals` (перша перевірка). Ця перевірка підставляє версію, яка не реагує на стрілки, і очікує, що хоча б один тест упаде. Тест має натиснути клавішу й перевірити, що місяць став іншим — саме тим, який має бути."
          en: "First your tests must pass with the correct `MonthTotals` (the first check). This check puts in a version that ignores the arrow keys and expects at least one test to fail. The test must press a key and check that the month became different — exactly the one it should be."
      - when: { error: ReferenceError }
        message:
          uk: "Картка `ReferenceError` означає, що файл тестів зупинився ще під час завантаження, до запуску тестів: назву, потрібну на верхньому рівні файла, не імпортовано чи написано з помилкою (наприклад, `test is not defined`). Перевір рядок `import { … } from \"./testing.js\"` на початку `MonthTotals.test.jsx`. Така сама помилка **всередині** тесту картки не дає: курсовий запускач її ловить, і в консолі з’являється рядок `✗` цього тесту з `ReferenceError: … is not defined`."
          en: "A `ReferenceError` card means that the test file stopped while loading, before any test ran: a name needed at the top level of the file is not imported or is misspelled (for example `test is not defined`). Check the line `import { … } from \"./testing.js\"` at the top of `MonthTotals.test.jsx`. The same mistake **inside** a test gives no card: the course runner catches it, and the console shows that test's `✗` line with `ReferenceError: … is not defined`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: boundary-months
        from: js-09-03-boundary-cases
        prompt:
          uk: "Функція `shiftMonth(month, step)` зсуває рядок `\"РРРР-ММ\"` на `step` місяців. Тести вже перевіряють `shiftMonth(\"2026-03\", 1)`. Який із цих тестів **найкорисніше** додати?"
          en: "The function `shiftMonth(month, step)` moves a `\"YYYY-MM\"` string by `step` months. The tests already check `shiftMonth(\"2026-03\", 1)`. Which of these tests is **most useful** to add?"
        answer:
          type: choice
          options:
            - id: year-edge
              code: "expect(shiftMonth(\"2026-12\", 1)).toBe(\"2027-01\");"
            - id: same-kind
              code: "expect(shiftMonth(\"2026-04\", 1)).toBe(\"2026-05\");"
              why:
                uk: "Це той самий випадок, що вже перевірено: середина року, крок уперед. Новий тест має перевіряти **межу**, де код найлегше помилитися."
                en: "This is the same case that is already checked: the middle of the year, one step forward. A new test should check a **boundary**, where code most easily goes wrong."
            - id: many
              code: "for (let m = 1; m <= 11; m += 1) expect(shiftMonth(`2026-0${m}`, 1)).toBeDefined();"
              why:
                uk: "Багато перевірок не роблять тест кращим, якщо вони не перевіряють точного результату й оминають межу року (до того ж для `m ≥ 10` рядок виходить неправильний — `2026-010`)."
                en: "Many checks do not make a test better if they do not check the exact result and avoid the year boundary (besides, for `m ≥ 10` the string comes out wrong — `2026-010`)."
          correct: [year-edge]
        explanation:
          uk: "[[boundary-case|Граничні випадки]] — порожньо, один, багато, кінець діапазону — там, де ховаються помилки. Для місяців межа — перехід через рік в обидва боки: `2026-12` → `2027-01` і `2026-01` → `2025-12`."
          en: "[[boundary-case|Boundary cases]] — empty, one, many, the end of a range — are where bugs hide. For months the boundary is crossing a year in both directions: `2026-12` → `2027-01` and `2026-01` → `2025-12`."

  - id: to-project
    kind: transfer
    capstoneStep: RE-08
    body:
      uk: "Перш ніж братися за покращення проєкту, склади у своєму репозиторії список доказів CP-RE: для кожного з п’яти рядків — команду, тест або прохід, який його доводить, і що саме ти маєш побачити. Для «Cleanup» назви ефект, який підписується на щось зовнішнє, і тест у StrictMode, що падає без cleanup; для «Дані CP-JS» — адресу, на якій працює React-версія, і як ти перенесеш туди дані."
      en: "Before you start the project's enhancement, write the CP-RE evidence list in your repository: for each of the five rows, the command, test or walk-through that proves it and what exactly you must see. For “Cleanup” name an effect that subscribes to something outside and a StrictMode test that fails without its cleanup; for “CP-JS data”, the address where the React version runs and how you will bring the data there."

