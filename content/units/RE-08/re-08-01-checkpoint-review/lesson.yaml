id: re-08-01-checkpoint-review
unit: RE-08
title:
  uk: "Повторення перед контрольною точкою: відкладене пригадування JS і React"
  en: "Checkpoint review: delayed JS/React retrieval"
kind: review
minutes: 20
contentVersion: 1
purpose:
  uk: "Перед контрольною точкою CP-RE ти з пам’яті відповідаєш на питання про механізми, які вивчав тижні тому: closures, посилання на об’єкти, порядок promise, знімки state, cleanup ефектів, гонки відповідей і відкат. Без конспекту й без запуску — так видно, що тримається надійно, а що варто перечитати, перш ніж пояснювати це на власному коді."
  en: "Before the checkpoint CP-RE you answer, from memory, questions about mechanisms you learned weeks ago: closures, object references, promise order, state snapshots, effect cleanup, response races and rollback. No notes and no running first — that shows what has stayed reliable and what is worth rereading before you explain it in your own code."
objectives:
  - uk: "Без конспекту пригадати, як поводяться знімки state, closures, ідентичність посилань, cleanup ефектів і застарілі відповіді, і передбачити результат коротких змішаних фрагментів JS і React."
    en: "Recall without notes how state snapshots, closures, reference identity, effect cleanup and stale responses behave, and predict the output of short mixed JS/React snippets."
prerequisites: [re-02-02-state-snapshots, re-03-04-stale-closures-in-effects, js-04-07-reference-identity]
subskills:
  - { family: R-10, skill: "cumulative explanation", depth: intro }
glossary: []
selfCheck: [three-calls, interval-empty-deps]

blocks:
  - id: from-memory
    kind: explanation
    title:
      uk: "Спершу з пам’яті"
      en: "From memory first"
    body:
      uk: |
        Етап React закінчується [[checkpoint|контрольною точкою]] CP-RE. На ній ти не лише покажеш, що застосунок працює, а й **пояснюватимеш** власний код: чому обробник бачить старе значення state, що «пам’ятає» ефект, коли запускається cleanup.

        Пояснити можна лише те, що пам’ятаєш. Тому цей урок — **відкладене пригадування**: питання про те, що ти вивчав тижні тому:

        - відповідай **до** запуску коду й без конспекту — навіть якщо не впевнений;
        - помилка тут — не провал, а адреса: пояснення до кожного питання називає механізм, а таблиця наприкінці — урок, який варто перечитати;
        - приклад у середині уроку дає запустити два перші питання й перевірити себе.
      en: |
        The React stage ends with the [[checkpoint]] CP-RE. There you will not only show that the app works, you will also **explain** your own code: why a handler sees an old state value, what an effect “remembers”, when a cleanup runs.

        You can only explain what you remember. So this lesson is **delayed retrieval**: questions about things you learned weeks ago:

        - answer **before** running the code and without notes — even when you are not sure;
        - a mistake here is not a failure but an address: the explanation of every question names the mechanism, and the table at the end names the lesson worth rereading;
        - the example in the middle of the lesson lets you run the first two questions and check yourself.

  - id: three-calls
    kind: prediction
    strings:
      votes: { uk: "Голоси:", en: "Votes:" }
    prompt:
      uk: "Кнопка показує `Голоси: 0`. Користувач клікає по ній один раз. Що надрукує консоль і що покаже кнопка після цього кліку?"
      en: "The button shows `Votes: 0`. The user clicks it once. What does the console print, and what does the button show after this click?"
    code: |
      function WishVotes() {
        const [votes, setVotes] = useState(0);

        function handleVote() {
          setVotes(votes + 1);
          setVotes(votes + 1);
          setVotes(votes + 1);
          console.log("votes in the handler:", votes);
        }

        return <button onClick={handleVote}>%%votes%% {votes}</button>;
      }
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: zero-one
          text:
            uk: "Консоль: `votes in the handler: 0`; кнопка: `Голоси: 1`"
            en: "Console: `votes in the handler: 0`; button: `Votes: 1`"
        - id: three-three
          text:
            uk: "Консоль: `votes in the handler: 3`; кнопка: `Голоси: 3`"
            en: "Console: `votes in the handler: 3`; button: `Votes: 3`"
          why:
            uk: "`setVotes` не змінює змінну `votes` — він просить React про наступний рендер. У цьому обробнику `votes` — знімок рендеру, у якому його створено, тобто `0`, аж до кінця функції."
            en: "`setVotes` does not change the variable `votes` — it asks React for the next render. In this handler `votes` is the snapshot of the render that created it, `0`, until the end of the function."
        - id: zero-three
          text:
            uk: "Консоль: `votes in the handler: 0`; кнопка: `Голоси: 3`"
            en: "Console: `votes in the handler: 0`; button: `Votes: 3`"
          why:
            uk: "Консоль ти вгадав, а кнопку — ні. Усі три виклики обчислюють `0 + 1` з одного знімка, тож React тричі ставить у чергу «зроби 1». Щоб додати три, потрібна функція-оновлювач: `setVotes((v) => v + 1)`."
            en: "You got the console right, but not the button. All three calls compute `0 + 1` from the same snapshot, so React queues “make it 1” three times. To add three you need an updater function: `setVotes((v) => v + 1)`."
        - id: one-one
          text:
            uk: "Консоль: `votes in the handler: 1`; кнопка: `Голоси: 1`"
            en: "Console: `votes in the handler: 1`; button: `Votes: 1`"
          why:
            uk: "Кнопку ти вгадав, а консоль — ні. Новий рендер із `votes = 1` настане лише після обробника; сам обробник до кінця бачить `0`."
            en: "You got the button right, but not the console. The new render with `votes = 1` happens only after the handler; the handler itself sees `0` to the end."
      correct: [zero-one]
    explanation:
      uk: "[[state-snapshot|Знімок state]]: кожен рендер має власне значення `votes`, і обробник, створений у ньому, бачить саме його. Три виклики `setVotes(votes + 1)` — це три однакові прохання «зроби 1»; React [[batching|групує]] їх в один наступний рендер. Перевірено в пісочниці з React 19.3: після одного кліку консоль друкує `votes in the handler: 0`, а кнопка показує `Голоси: 1`."
      en: "[[state-snapshot|State is a snapshot]]: every render has its own value of `votes`, and a handler created in it sees exactly that value. Three calls of `setVotes(votes + 1)` are three identical requests “make it 1”; React [[batching|batches]] them into one next render. Checked in the sandbox with React 19.3: after one click the console prints `votes in the handler: 0` and the button shows `Votes: 1`."

  - id: interval-empty-deps
    kind: prediction
    strings:
      done: { uk: "Виконано:", en: "Done:" }
    prompt:
      uk: "Користувач двічі клікає по кнопці, і вона показує `Виконано: 2`. Що надрукує наступний «тік» інтервалу?"
      en: "The user clicks the button twice, and it shows `Done: 2`. What does the next tick of the interval print?"
    code: |
      function HabitTicker() {
        const [done, setDone] = useState(0);

        useEffect(() => {
          const id = setInterval(() => console.log(`tick: done = ${done}`), 1000);
          return () => clearInterval(id);
        }, []);

        return <button onClick={() => setDone(done + 1)}>%%done%% {done}</button>;
      }
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: zero
          text:
            uk: "`tick: done = 0`"
            en: "`tick: done = 0`"
        - id: two
          text:
            uk: "`tick: done = 2`"
            en: "`tick: done = 2`"
          why:
            uk: "Callback інтервалу створено один раз — в ефекті після першого рендеру, коли `done` був `0`. Closure пам’ятає змінну **того** рендеру; нові рендери створюють нові змінні `done`, але цей callback їх не бачить."
            en: "The interval callback was created once — in the effect after the first render, when `done` was `0`. The closure remembers the variable of **that** render; new renders create new `done` variables, but this callback does not see them."
        - id: restarts
          text:
            uk: "`tick: done = 2`, бо після кожного рендеру ефект перезапускає інтервал"
            en: "`tick: done = 2`, because the effect restarts the interval after every render"
          why:
            uk: "Так було б без масиву залежностей або з `[done]`. Порожній масив `[]` каже React: запусти ефект лише після монтування (у StrictMode — setup, cleanup, setup одразу при монтуванні), а далі не перезапускай."
            en: "That would happen with no dependency array or with `[done]`. The empty array `[]` tells React: run the effect only after mounting (under StrictMode: setup, cleanup, setup right at mount), and do not run it again after that."
        - id: nothing
          text:
            uk: "Нічого: після другого рендеру інтервал зупинено"
            en: "Nothing: the interval was stopped after the second render"
          why:
            uk: "Cleanup із `clearInterval` запускається перед повторним запуском ефекту або під час демонтування. З `[]` ефект не перезапускається, а компонент залишається на сторінці, тож інтервал працює далі."
            en: "The cleanup with `clearInterval` runs before the effect runs again or on unmount. With `[]` the effect does not run again, and the component stays on the page, so the interval keeps going."
      correct: [zero]
    explanation:
      uk: "Це [[stale-closure|застаріле замикання]] в ефекті. Ефект із `[]` створив callback один раз, і той назавжди бачить `done` першого рендеру — `0`. Перевірено в пісочниці з React 19.3: після двох кліків кнопка показує `Виконано: 2`, а інтервал і далі друкує `tick: done = 0`. Виправлення — додати `done` у залежності (тоді cleanup зупинить старий інтервал, а setup створить новий зі свіжим знімком) або читати значення через функцію-оновлювач."
      en: "This is a [[stale-closure]] in an effect. The effect with `[]` created the callback once, and it sees the `done` of the first render — `0` — forever. Checked in the sandbox with React 19.3: after two clicks the button shows `Done: 2`, and the interval keeps printing `tick: done = 0`. The fix is to add `done` to the dependencies (then the cleanup stops the old interval and the setup creates a new one with a fresh snapshot) or to read the value through an updater function."

  - id: see-it-run
    kind: example
    runtime: browser-react
    dir: see-it-run
    entry: main.jsx
    strings:
      votes: { uk: "Голоси:", en: "Votes:" }
      done: { uk: "Виконано:", en: "Done:" }
    title:
      uk: "Перевір обидві відповіді"
      en: "Check both answers"
    body:
      uk: |
        Тут обидва компоненти з двох попередніх питань, змонтовані в `<StrictMode>`, як у `main.tsx` твого проєкту. Натисни **Запустити**, клікни один раз по «Голоси: 0» і двічі по «Виконано: 0», а тоді подивись у **Консоль**.

        Інтервал друкує рядок щосекунди, поки компонент на сторінці.
      en: |
        Here are both components from the two previous questions, mounted inside `<StrictMode>` as in your project's `main.tsx`. Press **Run**, click “Votes: 0” once and “Done: 0” twice, then look at the **Console**.

        The interval prints a line every second while the component is on the page.
    tryIt:
      uk: |
        1. У `App.jsx`, у `WishVotes`, заміни три виклики на `setVotes((v) => v + 1);` і запусти знову. Один клік тепер дає `Голоси: 3`, але `console.log` в обробнику й далі друкує `0`: знімок не змінився, змінилося те, що стоїть у черзі.
        2. У `HabitTicker` заміни `[]` на `[done]` і запусти. Після кожного кліку тік друкує нове значення: React викликає cleanup (зупиняє старий інтервал) і запускає setup із новим знімком.
      en: |
        1. In `App.jsx`, in `WishVotes`, replace the three calls with `setVotes((v) => v + 1);` and run again. One click now gives `Votes: 3`, but the `console.log` in the handler still prints `0`: the snapshot did not change, what changed is what is queued.
        2. In `HabitTicker` replace `[]` with `[done]` and run. After every click the tick prints the new value: React calls the cleanup (stops the old interval) and runs the setup with the new snapshot.

  - id: delayed-recall
    kind: review
    title:
      uk: "Пригадай без підказок"
      en: "Recall without hints"
    items:
      - id: two-counters
        from: js-03-05-closures
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          function makeCounter() {
            let count = 0;
            return () => {
              count += 1;
              return count;
            };
          }
          const wishes = makeCounter();
          const tasks = makeCounter();
          wishes();
          wishes();
          console.log(wishes(), tasks());
        verify:
          logs: ["3 1"]
        answer:
          type: choice
          options:
            - id: three-one
              text: { uk: "`3 1`", en: "`3 1`" }
            - id: three-four
              text: { uk: "`3 4`", en: "`3 4`" }
              why:
                uk: "Кожен виклик `makeCounter()` створює **нову** змінну `count`. `tasks` має власну, і вона ще ніколи не збільшувалася."
                en: "Every call of `makeCounter()` creates a **new** `count` variable. `tasks` has its own, and it has never been increased."
            - id: one-one
              text: { uk: "`1 1`", en: "`1 1`" }
              why:
                uk: "`count` не скидається між викликами `wishes()`: функція, яку повернув `makeCounter`, тримає ту саму змінну, і кожен виклик її збільшує."
                en: "`count` is not reset between calls of `wishes()`: the function returned by `makeCounter` keeps the same variable, and every call increases it."
          correct: [three-one]
        explanation:
          uk: "[[closure|Closure]] пам’ятає змінні місця, де функцію створено. Два виклики `makeCounter` — два окремі місця, дві змінні `count`. Так само кожен рендер React створює нові змінні, і обробник пам’ятає змінні **свого** рендеру."
          en: "A [[closure]] remembers the variables of the place where the function was created. Two calls of `makeCounter` are two separate places with two `count` variables. In the same way every React render creates new variables, and a handler remembers the variables of **its** render."

      - id: same-task
        from: js-04-07-reference-identity
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const task = { id: "t-01", done: false };
          const sameTask = task;
          const copy = { ...task };
          sameTask.done = true;
          console.log(task.done, copy.done, task === sameTask, task === copy);
        verify:
          logs: ["true false true false"]
        answer:
          type: choice
          options:
            - id: right
              text: { uk: "`true false true false`", en: "`true false true false`" }
            - id: names-are-copies
              text: { uk: "`false false false false`", en: "`false false false false`" }
              why:
                uk: "`const sameTask = task` не копіює об’єкт — це друга назва **того самого** об’єкта. Зміна через `sameTask` видна й через `task`."
                en: "`const sameTask = task` does not copy the object — it is a second name for **the same** object. A change through `sameTask` is visible through `task` too."
            - id: copy-shares
              text: { uk: "`true true true true`", en: "`true true true true`" }
              why:
                uk: "Розгортання `{ ...task }` створює **новий** об’єкт із тими самими полями на момент копіювання. Пізніша зміна `done` в оригіналі копію не зачіпає, і `===` для двох різних об’єктів дає `false`."
                en: "The spread `{ ...task }` creates a **new** object with the same fields as at the moment of copying. A later change of `done` in the original does not touch the copy, and `===` on two different objects gives `false`."
            - id: equal-content
              text: { uk: "`true false true true`", en: "`true false true true`" }
              why:
                uk: "`===` порівнює об’єкти за ідентичністю, а не за вмістом. До того ж поля вже різні: у `copy` лишився `done: false`."
                en: "`===` compares objects by identity, not by content. Besides, the fields already differ: `copy` still has `done: false`."
          correct: [right]
        explanation:
          uk: "Дві назви — один об’єкт; розгортання — новий об’єкт. Саме тому в React оновлюють state новим об’єктом: React порівнює старе й нове значення через `Object.is`, тобто за [[reference-identity|ідентичністю]]."
          en: "Two names — one object; a spread — a new object. That is why React state is updated with a new object: React compares the old and the new value with `Object.is`, that is, by [[reference-identity|identity]]."

      - id: promise-order
        from: js-08-04-microtasks-vs-tasks
        prompt:
          uk: "У якому порядку з’являться літери?"
          en: "In what order do the letters appear?"
        code: |
          console.log("A");
          setTimeout(() => console.log("B"), 0);
          Promise.resolve().then(() => console.log("C"));
          console.log("D");
        verify:
          logs: ["A", "D", "C", "B"]
        answer:
          type: choice
          options:
            - id: adcb
              text: { uk: "A, D, C, B", en: "A, D, C, B" }
            - id: abcd
              text: { uk: "A, B, C, D", en: "A, B, C, D" }
              why:
                uk: "Callbacks таймера й promise не виконуються одразу: спершу до кінця йде синхронний код — `A` і `D`."
                en: "The timer and promise callbacks do not run at once: the synchronous code runs to the end first — `A` and `D`."
            - id: adbc
              text: { uk: "A, D, B, C", en: "A, D, B, C" }
              why:
                uk: "Нуль мілісекунд не робить таймер першим. Callback `then` — це [[microtask]]: усі мікрозадачі виконуються до наступної задачі з черги таймерів."
                en: "Zero milliseconds does not put the timer first. A `then` callback is a [[microtask]]: all microtasks run before the next task from the timer queue."
          correct: [adcb]
        explanation:
          uk: "Спершу синхронний код (`A`, `D`), потім мікрозадачі (`C`), потім задачі з черги, як-от таймер (`B`). Тому `await` у обробнику React продовжиться пізніше, ніж завершиться сам обробник."
          en: "First the synchronous code (`A`, `D`), then the microtasks (`C`), then the tasks from the queue, such as the timer (`B`). That is why an `await` in a React handler continues later than the handler itself ends."

      - id: updater-three
        from: re-02-03-updater-queue-batching
        prompt:
          uk: "`votes` дорівнює `0`, і кнопка показує це число. Яке число вона покаже після одного кліку, що викликає `handleVote`? Впиши лише число."
          en: "`votes` is `0`, and the button shows that number. What number does it show after one click that calls `handleVote`? Type only the number."
        code: |
          function handleVote() {
            setVotes((v) => v + 1);
            setVotes((v) => v + 1);
            setVotes((v) => v + 1);
          }
        lang: jsx
        runnable: false
        answer:
          type: text
          accept: ["3"]
          placeholder: { uk: "число", en: "a number" }
        explanation:
          uk: "Кожна [[updater-function|функція-оновлювач]] отримує результат попередньої з черги: 0 → 1 → 2 → 3. React застосовує всю чергу в одному наступному рендері."
          en: "Every [[updater-function]] receives the result of the previous one in the queue: 0 → 1 → 2 → 3. React applies the whole queue in one next render."

      - id: cleanup-sees-old
        from: re-03-03-dependencies-cleanup
        prompt:
          uk: "Компонент змонтовано без StrictMode з `listId = \"home\"`, потім батько передає `listId = \"work\"`. Що надрукує консоль за весь цей час?"
          en: "The component is mounted without StrictMode with `listId = \"home\"`, then the parent passes `listId = \"work\"`. What does the console print over this whole time?"
        code: |
          function ListSync({ listId }) {
            useEffect(() => {
              console.log(`setup ${listId}`);
              return () => console.log(`cleanup ${listId}`);
            }, [listId]);
            return null;
          }
        lang: jsx
        runnable: false
        answer:
          type: choice
          options:
            - id: right
              text: { uk: "`setup home`, `cleanup home`, `setup work`", en: "`setup home`, `cleanup home`, `setup work`" }
            - id: cleanup-new
              text: { uk: "`setup home`, `cleanup work`, `setup work`", en: "`setup home`, `cleanup work`, `setup work`" }
              why:
                uk: "Cleanup — це функція, створена під час **попереднього** запуску ефекту. Вона пам’ятає `listId` того рендеру — `home`."
                en: "The cleanup is the function created during the **previous** run of the effect. It remembers the `listId` of that render — `home`."
            - id: cleanup-after
              text: { uk: "`setup home`, `setup work`, `cleanup home`", en: "`setup home`, `setup work`, `cleanup home`" }
              why:
                uk: "React спершу прибирає за старим запуском і лише потім запускає новий: cleanup іде **перед** кожним повторним setup, а не лише під час демонтування."
                en: "React first cleans up after the old run and only then starts the new one: the cleanup comes **before** every repeated setup, not only on unmount."
            - id: no-cleanup
              text: { uk: "`setup home`, `setup work`", en: "`setup home`, `setup work`" }
              why:
                uk: "Компонент не знімали зі сторінки, але залежність змінилася — і цього досить, щоб React викликав cleanup старого запуску."
                en: "The component was not removed from the page, but a dependency changed — and that is enough for React to call the cleanup of the old run."
          correct: [right]
        explanation:
          uk: "[[effect-cleanup|Cleanup]] запускається перед кожним повторним setup і під час демонтування, і бачить знімок свого рендеру. Тому він закриває саме те, що відкрив його setup."
          en: "The [[effect-cleanup|cleanup]] runs before every repeated setup and on unmount, and it sees the snapshot of its own render. That is why it closes exactly what its own setup opened."

      - id: slow-answer-wins
        from: re-06-02-races-cancellation
        prompt:
          uk: "Ефект завантажує бажання для фільтра й кладе відповідь у state; cleanup нічого не скасовує й не ігнорує. Користувач перемикає фільтр з «усі» на «отримані». Запит «усі» відповідає за 900 мс, запит «отримані» — за 100 мс. Що буде в списку через секунду?"
          en: "An effect loads wishes for a filter and puts the answer into state; its cleanup cancels and ignores nothing. The user switches the filter from “all” to “acquired”. The “all” request answers in 900 ms, the “acquired” request in 100 ms. What is in the list after one second?"
        answer:
          type: choice
          options:
            - id: all
              text:
                uk: "Усі бажання, хоча вибрано «отримані»"
                en: "All wishes, although “acquired” is selected"
            - id: acquired
              text:
                uk: "Лише отримані — останній вибір перемагає"
                en: "Only the acquired ones — the last choice wins"
              why:
                uk: "Перемагає не останній **запит**, а остання **відповідь**. Відповідь «усі» приходить через 900 мс — пізніше — і перезаписує правильний список."
                en: "What wins is not the last **request** but the last **answer**. The “all” answer arrives after 900 ms — later — and overwrites the correct list."
            - id: error
              text:
                uk: "Помилку: React не дозволяє двох запитів одночасно"
                en: "An error: React does not allow two requests at once"
              why:
                uk: "React нічого не знає про твої запити — він лише запускає ефект. Обидва запити виконуються, і кожен викликає setter, коли відповідає."
                en: "React knows nothing about your requests — it only runs the effect. Both requests run, and each calls the setter when it answers."
          correct: [all]
        explanation:
          uk: "Це [[stale-response|застаріла відповідь]]. Cleanup має або скасувати старий запит (`AbortController`), або позначити його відповідь як непотрібну ([[ignore-flag|прапорець ігнорування]]) — тоді setter викликає лише відповідь на поточний фільтр."
          en: "This is a [[stale-response]]. The cleanup must either cancel the old request (`AbortController`) or mark its answer as unwanted (an [[ignore-flag]]) — then only the answer for the current filter calls the setter."

      - id: rollback
        from: re-06-06-optimistic-rollback
        prompt:
          uk: "Справу позначили виконаною [[optimistic-update|оптимістично]]: галочка з’явилася одразу, а запит на сервер ще в дорозі. Сервер відповідає помилкою 503. Що має побачити користувач?"
          en: "A task was marked done [[optimistic-update|optimistically]]: the tick appeared at once, while the request to the server is still on its way. The server answers with error 503. What should the user see?"
        answer:
          type: choice
          options:
            - id: rolled-back
              text:
                uk: "Галочка зникає (справа знову невиконана), і з’являється озвучене повідомлення про помилку"
                en: "The tick disappears (the task is pending again), and an announced error message appears"
            - id: keep
              text:
                uk: "Галочка лишається — користувач уже бачив, що справу виконано"
                en: "The tick stays — the user has already seen the task as done"
              why:
                uk: "Тоді екран бреше: сервер зміни не прийняв. Після перезавантаження справа «раптом» знову невиконана."
                en: "Then the screen lies: the server did not accept the change. After a reload the task is “suddenly” pending again."
            - id: clear
              text:
                uk: "Список очищається й завантажується заново, без повідомлення"
                en: "The list is emptied and loaded again, with no message"
              why:
                uk: "Користувач втрачає контекст і не дізнається, що його дія не вдалася. Відкат повертає лише змінений запис до збереженого раніше значення."
                en: "The user loses the context and never learns that their action failed. A rollback returns only the changed record to the value kept before."
          correct: [rolled-back]
        explanation:
          uk: "Оптимістичне оновлення спершу зберігає попереднє значення, показує нове одразу, а коли сервер відмовляє, — [[optimistic-rollback|відкочує]] запис до збереженого значення й повідомляє про це."
          en: "An optimistic update first keeps the previous value, shows the new one at once, and when the server refuses it [[optimistic-rollback|rolls]] the record back to the kept value and says so."

  - id: what-to-reread
    kind: explanation
    title:
      uk: "Що перечитати"
      en: "What to reread"
    body:
      uk: |
        Познач питання, де ти помилився або вгадав. Ось куди повернутися:

        | Питання про… | Урок |
        |---|---|
        | три виклики `setVotes`, функцію-оновлювач | «Стан — це знімок кожного рендеру» і «Функції-оновлювачі, черга й батчинг» (RE-02) |
        | інтервал із `[]`, cleanup зі старим `listId` | «Залежності та cleanup» і «Застарілі замикання в ефектах» (RE-03) |
        | два лічильники | «Closures: функції пам’ятають, де народилися» (JS-03) |
        | дві назви одного об’єкта | «Дві змінні, один об’єкт: тотожність посилань» (JS-04) |
        | порядок A, D, C, B | «Спочатку microtasks, потім tasks» (JS-08) |
        | повільну відповідь, відкат | «Гонки запитів і скасування», «Оптимістичні оновлення та відкат» (RE-06) |

        На контрольній точці тобі знадобляться передусім два перші рядки: ти пояснюватимеш знімок state в одному з обробників свого проєкту й closure в одному з ефектів.
      en: |
        Mark the questions where you made a mistake or guessed. Here is where to go back:

        | Question about… | Lesson |
        |---|---|
        | three `setVotes` calls, the updater function | “State is a snapshot per render” and “Updater functions, queues and batching” (RE-02) |
        | the interval with `[]`, the cleanup with the old `listId` | “Dependencies and cleanup” and “Stale closures in effects” (RE-03) |
        | two counters | “Closures: functions remember their birthplace” (JS-03) |
        | two names for one object | “Two names, one object: reference identity” (JS-04) |
        | the order A, D, C, B | “Microtasks before tasks” (JS-08) |
        | the slow answer, the rollback | “Races and cancellation”, “Optimistic updates and rollback” (RE-06) |

        At the checkpoint you will need the first two rows most: you will explain a state snapshot in one of your project's handlers and a closure in one of its effects.
