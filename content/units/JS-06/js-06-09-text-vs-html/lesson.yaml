id: js-06-09-text-vs-html
unit: JS-06
title:
  uk: "textContent проти innerHTML"
  en: "textContent vs innerHTML"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити, як `textContent` і `innerHTML` покажуть один і той самий рядок із розміткою."
    en: "Predict how textContent and innerHTML render the same string that contains markup."
  - uk: "Показувати текст записів, якому не можна довіряти, через `textContent` або `createElement` і пояснити, чому `innerHTML` з введеними даними — небезпечне місце (повна картина атак — у JS-16)."
    en: "Render untrusted record text with textContent or createElement, and explain why innerHTML with entered data is an unsafe sink (the full attack picture comes in JS-16)."
prerequisites: [js-06-08-dom-query-create-update, js-01-02-numbers-and-text]
subskills:
  - { family: W-03, skill: "safe text vs HTML", depth: intro }
glossary: [text-content, inner-html, unsafe-sink]
selfCheck: [text-or-markup, safe-name]

blocks:
  - id: two-ways
    kind: explanation
    title:
      uk: "Два способи покласти рядок у вузол"
      en: "Two ways to put a string into a node"
    body:
      uk: |
        Рядок (string) можна покласти у вузол двома способами, і результати дуже різні:

        ```js
        note.textContent = "Ціна <i>орієнтовна</i>";  // на сторінці: Ціна <i>орієнтовна</i>
        note.innerHTML = "Ціна <i>орієнтовна</i>";    // на сторінці: Ціна орієнтовна (курсивом)
        ```

        - [[text-content|textContent]] кладе символи **як є**. `<` і `>` — просто знаки, жодних нових елементів.
        - [[inner-html|innerHTML]] віддає рядок **розбирачеві HTML**: теги стають справжніми елементами, атрибути — атрибутами, а все, що було у вузлі раніше, зникає.

        Тобто `innerHTML` — не «швидший `textContent`», а зовсім інша дія: рядок стає частиною сторінки.
      en: |
        A string can go into a node in two ways, with very different results:

        ```js
        note.textContent = "Price <i>approximate</i>";  // on the page: Price <i>approximate</i>
        note.innerHTML = "Price <i>approximate</i>";    // on the page: Price approximate (in italics)
        ```

        - [[text-content|textContent]] puts the characters in **as they are**. `<` and `>` are just signs; no new elements appear.
        - [[inner-html|innerHTML]] hands the string to the **HTML parser**: tags become real elements, attributes become attributes, and whatever was in the node before disappears.

        So `innerHTML` is not “a faster `textContent`” but a different action altogether: the string becomes part of the page.

  - id: text-or-markup
    kind: prediction
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    prompt:
      uk: "Що виведе цей код?"
      en: "What does this code print?"
    code: |
      const safe = document.createElement("p");
      safe.textContent = "<b>%%lamp%%</b>";
      const parsed = document.createElement("p");
      parsed.innerHTML = "<b>%%lamp%%</b>";
      console.log(safe.textContent);
      console.log(parsed.textContent);
      console.log(safe.children.length, parsed.children.length);
    verify:
      logs: ["<b>%%lamp%%</b>", "%%lamp%%", "0 1"]
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "`<b>Настільна лампа</b>`, потім `Настільна лампа`, потім `0 1`"
            en: "`<b>Desk lamp</b>`, then `Desk lamp`, then `0 1`"
        - id: both-parsed
          text:
            uk: "Двічі `Настільна лампа`, потім `0 0`"
            en: "`Desk lamp` twice, then `0 0`"
          why:
            uk: "`textContent` нічого не розбирає: теги лишаються символами в тексті вузла."
            en: "`textContent` parses nothing: the tags stay as characters in the node’s text."
        - id: both-text
          text:
            uk: "Двічі `<b>Настільна лампа</b>`, потім `0 0`"
            en: "`<b>Desk lamp</b>` twice, then `0 0`"
          why:
            uk: "`innerHTML` розбирає рядок як HTML: усередині з’являється елемент `<b>`, а текст вузла — лише «Настільна лампа»."
            en: "`innerHTML` parses the string as HTML: a `<b>` element appears inside, and the node’s text is just “Desk lamp”."
        - id: reversed
          text:
            uk: "`Настільна лампа`, потім `<b>Настільна лампа</b>`, потім `1 0`"
            en: "`Desk lamp`, then `<b>Desk lamp</b>`, then `1 0`"
          why:
            uk: "Навпаки: саме `innerHTML` створює елементи, а `textContent` зберігає символи."
            en: "The other way round: it is `innerHTML` that creates elements, while `textContent` keeps the characters."
      correct: [right]
    explanation:
      uk: "`textContent` поклав у перший абзац сім символів тегів разом із назвою — дочірніх елементів 0. `innerHTML` розібрав рядок: у другому абзаці з’явився елемент `<b>` (1 дочірній елемент), а текст вузла — сама назва."
      en: "`textContent` put the tag characters into the first paragraph along with the name — 0 child elements. `innerHTML` parsed the string: the second paragraph got a `<b>` element (1 child element), and the node’s text is just the name."

  - id: unsafe-sink
    kind: explanation
    title:
      uk: "Чому innerHTML з даними небезпечний"
      en: "Why innerHTML with data is dangerous"
    body:
      uk: |
        Назва запису приходить із форми, зі сховища, з файлу чи за посиланням — тобто її міг набрати будь-хто. Припустимо, хтось увів таку «назву»:

        ```text
        Навушники <img src="x" onerror="alert(1)">
        ```

        Через `innerHTML` вона стане справжнім `<img>`. Картинка не завантажиться, і браузер виконає код з атрибута `onerror` **усередині твоєї сторінки** — з усіма її можливостями: читати дані, змінювати сторінку, кудись їх надсилати.

        Місце, де текст перетворюється на розмітку чи код, називають [[unsafe-sink|небезпечним місцем]] (unsafe sink). «Я ж сам вводив» не рятує: текст копіюють звідкись, діляться списками, збережені дані можна підмінити. Повну картину атак ти побачиш у JS-16, а правило просте вже зараз:

        - дані — лише через `textContent` або `createElement`;
        - `innerHTML` — тільки для власної незмінної розмітки, ніколи разом із даними.
      en: |
        A record name comes from a form, from storage, from a file or through a link — so anyone could have typed it. Suppose someone entered this “name”:

        ```text
        Headphones <img src="x" onerror="alert(1)">
        ```

        Through `innerHTML` it becomes a real `<img>`. The picture fails to load, and the browser runs the code from the `onerror` attribute **inside your page** — with all of the page’s powers: reading data, changing the page, sending things elsewhere.

        A place where text turns into markup or code is called an [[unsafe-sink]]. “But I typed it myself” does not help: text gets copied from somewhere, lists get shared, stored data can be replaced. You will see the full picture of attacks in JS-16, and the rule is simple already:

        - data goes only through `textContent` or `createElement`;
        - `innerHTML` is only for your own fixed markup, never together with data.

  - id: two-renderers
    kind: example
    runtime: browser-js
    dir: two-renderers
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Одна назва — два способи", en: "One name, two ways" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      sale: { uk: "знижка", en: "on sale" }
      ran: { uk: "Цей код прийшов разом із назвою!", en: "This code came with the name!" }
      elements: { uk: "елементів усередині", en: "elements inside" }
    title:
      uk: "textContent і innerHTML поруч"
      en: "textContent and innerHTML side by side"
    body:
      uk: |
        Програма показує ту саму назву бажання двома способами. Запусти й подивись на сторінку, а потім на вкладку **Консоль**: повідомлення з позначкою `alert` — це код, що прийшов разом із назвою й виконався.
      en: |
        The program shows the same wish name in two ways. Run it and look at the page, then at the **Console** tab: the message tagged `alert` is code that came with the name and ran.
    tryIt:
      uk: |
        1. Порівняй два рядки на сторінці: зверху теги видно як символи, знизу — жирне слово й значок зламаної картинки.
        2. Заміни в `index.js` `innerHTML` на `textContent` і запусти: обидва рядки однакові, у консолі — 0 елементів у кожному, і жодного виклику `alert`.
        3. Поверни `innerHTML`, але прибери з назви весь фрагмент `<img …>`: жирне слово лишилося, а код більше не виконується. Проте покладатися на «чисті» назви не можна — їх набирають люди.
      en: |
        1. Compare the two rows on the page: the top one shows the tags as characters, the bottom one a bold word and a broken-image icon.
        2. In `index.js`, replace `innerHTML` with `textContent` and run: both rows are the same, the console reports 0 elements in each, and there is no `alert` call.
        3. Put `innerHTML` back, but remove the whole `<img …>` fragment from the name: the bold word stays, and no code runs anymore. Still, you cannot rely on “clean” names — people type them.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: рядок — це лише текст"
      en: "Recall: a string is just text"
    items:
      - id: string-until-parsed
        from: js-01-02-numbers-and-text
        prompt:
          uk: "Ціна бажання збережена як рядок. Що виведе цей код?"
          en: "A wish price is stored as a string. What does this code print?"
        code: |
          const price = "45";
          console.log(price + 5);
          console.log(Number(price) + 5);
        verify:
          logs: ["455", "50"]
        answer:
          type: choice
          options:
            - id: right
              text:
                uk: "`455`, потім `50`"
                en: "`455`, then `50`"
            - id: both-sum
              text:
                uk: "Двічі `50`"
                en: "`50` twice"
              why:
                uk: "`\"45\"` у лапках — рядок із двох символів. З рядком `+` склеює, а не додає."
                en: "`\"45\"` in quotes is a string of two characters. With a string, `+` joins instead of adding."
            - id: both-glued
              text:
                uk: "Двічі `455`"
                en: "`455` twice"
              why:
                uk: "`Number(price)` розбирає рядок як число, тож у другому рядку коду додаються числа 45 і 5."
                en: "`Number(price)` parses the string as a number, so the second line of code adds the numbers 45 and 5."
          correct: [right]
        explanation:
          uk: "Рядок лишається текстом, доки його щось не розбере: `Number` розбирає його як число. Так само `innerHTML` розбирає рядок як HTML, а `textContent` лишає текстом."
          en: "A string stays text until something parses it: `Number` parses it as a number. In the same way, `innerHTML` parses a string as HTML, while `textContent` keeps it as text."

  - id: safe-name
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: safe-name
    entry: index.html
    editable: [index.js]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Попередній перегляд бажання", en: "Wish preview" }
      intro: { uk: "Так виглядатиме назва, яку ти вводиш у форму.", en: "This is how the name you type into the form will look." }
      typed: { uk: "Навушники <img src=\"x\" onerror=\"alert(1)\">", en: "Headphones <img src=\"x\" onerror=\"alert(1)\">" }
      word: { uk: "Лампа", en: "Lamp" }
      first: { uk: "Велосипед", en: "Bicycle" }
      second: { uk: "Термочашка", en: "Travel mug" }
    title:
      uk: "Безпечний показ назви"
      en: "Showing a name safely"
    instructions:
      uk: |
        Попередній перегляд бажання має показувати будь-яку назву, яку людина ввела, — навіть із символами `<` і `>`. Допиши у `index.js` дві функції:

        1. `renderName(container, name)` показує назву в контейнері як звичайний текст і замінює те, що там було раніше.
        2. `renderBold(container, name)` робить те саме, але назва жирна: вона лежить в елементі `<strong>`, який ти створюєш через `document.createElement`.

        Назва з `<img …>` у прикладі має з’явитися на сторінці як текст — без картинки й без виклику `alert`.
      en: |
        The wish preview must show any name a person typed — even one with the characters `<` and `>`. Complete two functions in `index.js`:

        1. `renderName(container, name)` shows the name in the container as plain text and replaces whatever was there before.
        2. `renderBold(container, name)` does the same, but the name is bold: it sits in a `<strong>` element that you create with `document.createElement`.

        The name with `<img …>` in the program must appear on the page as text — no picture and no `alert` call.
    testTitles:
      "the page shows the typed name as text when the program runs":
        uk: "Після запуску введена назва видна як текст"
        en: "After a run the typed name shows as text"
      "renderName shows markup in a name as plain characters":
        uk: "renderName показує розмітку в назві як звичайні символи"
        en: "renderName shows markup in a name as plain characters"
      "renderName replaces what the container showed before":
        uk: "renderName замінює те, що було в контейнері"
        en: "renderName replaces what the container showed before"
      "renderBold shows the name inside one strong element":
        uk: "renderBold показує назву в одному елементі strong"
        en: "renderBold shows the name inside one strong element"
    hints:
      nudge:
        uk: "Яка властивість кладе рядок у вузол як символи, не розбираючи його? І що вона робить зі старим вмістом вузла?"
        en: "Which property puts a string into a node as characters without parsing it? And what does it do with the node’s old content?"
      explanation:
        uk: "Присвоєння `textContent` замінює весь вміст вузла символами рядка — розмітка лишається текстом. Для жирного варіанта створи елемент, дай йому текст так само й постав у контейнер замість старого вмісту: наприклад, `const em = document.createElement(\"em\"); em.textContent = note; box.replaceChildren(em);` робить курсив. Склеювати HTML-рядок на кшталт `\"<strong>\" + name + \"</strong>\"` не можна: тоді розмітку з назви теж розберуть."
        en: "Assigning `textContent` replaces the whole content of a node with the string’s characters — markup stays text. For the bold variant, create an element, give it the text in the same way and put it into the container instead of the old content: for example, `const em = document.createElement(\"em\"); em.textContent = note; box.replaceChildren(em);` makes italics. Gluing an HTML string such as `\"<strong>\" + name + \"</strong>\"` is not allowed: the markup from the name would be parsed too."
    solutionNote:
      uk: "`textContent` нічого не розбирає, тому `<img …>` у назві лишається символами. Жирний варіант будує розмітку не з рядка, а з вузлів: елемент `<strong>` створює `createElement`, а назва потрапляє в нього знову через `textContent`. `replaceChildren` замінює старий вміст контейнера новим."
      en: "`textContent` parses nothing, so the `<img …>` in the name stays characters. The bold variant builds its markup from nodes, not from a string: `createElement` creates the `<strong>` element, and the name goes into it through `textContent` again. `replaceChildren` replaces the container’s old content with the new one."
    feedback:
      - when: { test: "the page shows the typed name as text when the program runs" }
        message:
          uk: "Ця перевірка чекає, що після запуску в `#preview` видно рівно введену назву, а `<img>` з неї не став елементом. Якщо на сторінці з’явилася картинка, назву розібрали як HTML."
          en: "This check expects `#preview` to show exactly the typed name after a run, with no element made from the `<img>` in it. If a picture appears on the page, the name was parsed as HTML."
      - when: { test: "renderName shows markup in a name as plain characters" }
        message:
          uk: "Ця перевірка передає в `renderName` назву з `<b>` та `<img>` і чекає, що контейнер покаже всі її символи як текст і не матиме елементів `<b>` чи `<img>`."
          en: "This check passes `renderName` a name with `<b>` and `<img>` and expects the container to show all of its characters as text, with no `<b>` or `<img>` elements."
      - when: { test: "renderName replaces what the container showed before" }
        message:
          uk: "Ця перевірка двічі викликає `renderName` з різними назвами й чекає, що в контейнері лишиться лише друга. Якщо видно обидві, новий показ додається до старого замість того, щоб його замінити."
          en: "This check calls `renderName` twice with different names and expects only the second one in the container. If both are visible, the new display is added to the old one instead of replacing it."
      - when: { test: "renderBold shows the name inside one strong element" }
        message:
          uk: "Ця перевірка двічі викликає `renderBold` і чекає в контейнері один `<strong>`, у якому вся друга назва лишилася текстом. Якщо всередині з’явилися `<b>` чи `<img>`, розмітку з назви розібрали — HTML-рядок склеювати не можна."
          en: "This check calls `renderBold` twice and expects one `<strong>` in the container, holding the whole second name as text. If `<b>` or `<img>` appear inside, the markup from the name was parsed — an HTML string must not be glued together."

  - id: to-project
    kind: transfer
    capstoneStep: JS-06
    body:
      uk: "Назви, категорії й примітки твого проєкту вводять люди, тож у картках вони потраплятимуть на сторінку лише через `textContent` або `createElement`. Шукай у своєму коді `innerHTML` поруч із даними — це місце треба переписати."
      en: "The names, categories and notes in your project are typed by people, so in the cards they reach the page only through `textContent` or `createElement`. Look for `innerHTML` next to data in your code — that place has to be rewritten."
