<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%appName%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="top">
      <a href="#today" class="brand">%%appName%%</a>
    </header>
    <nav class="menu">
      <a href="#today">%%today%%</a>
      <a href="#week">%%week%%</a>
    </nav>
    <main class="content">
      <!-- The title only looks like a heading: it is still a div, so the page has no h1. -->
      <div class="title">%%title%%</div>
      <h2 id="today">%%today%%</h2>
      <p>%%task1%%</p>
      <button type="button">%%markDone%%</button>
      <h2 id="week">%%week%%</h2>
      <p>%%task2%%</p>
    </main>
  </body>
</html>
