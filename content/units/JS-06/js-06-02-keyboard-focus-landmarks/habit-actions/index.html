<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%appName%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="top">
      <a href="#today" class="brand">%%appName%%</a>
    </header>
    <nav class="menu" aria-label="%%sections%%">
      <a href="#today">%%today%%</a>
      <a href="#stats">%%stats%%</a>
    </nav>
    <main class="content">
      <h1 id="today">%%title%%</h1>
      <p>%%habit%%</p>
      <div class="actions">
        <button type="button" class="mark">%%markDone%%</button>
        <div class="skip">%%skipToday%%</div>
      </div>
      <label class="note">%%note%% <input name="note"></label>
      <h2 id="stats">%%stats%%</h2>
      <p>%%streak%%</p>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
