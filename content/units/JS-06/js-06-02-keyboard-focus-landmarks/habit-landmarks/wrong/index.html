<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%appName%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- The structure is right, but styles.css still switches the focus frame off. -->
    <header class="top">
      <a href="#today" class="brand">%%appName%%</a>
    </header>
    <nav class="menu">
      <a href="#today">%%today%%</a>
      <a href="#stats">%%stats%%</a>
    </nav>
    <main class="content">
      <h1 class="title">%%title%%</h1>
      <h2 id="today">%%today%%</h2>
      <p>%%habit%%</p>
      <button type="button">%%markDone%%</button>
      <h2 id="stats">%%stats%%</h2>
      <p>%%streak%%</p>
    </main>
  </body>
</html>
