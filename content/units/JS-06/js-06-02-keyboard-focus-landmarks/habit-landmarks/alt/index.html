<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%appName%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- The navigation may also live inside the header. -->
    <header class="top">
      <a href="#today" class="brand">%%appName%%</a>
      <nav class="menu" aria-label="%%sections%%">
        <a href="#today">%%today%%</a>
        <a href="#stats">%%stats%%</a>
      </nav>
    </header>
    <main class="content">
      <h1>%%title%%</h1>
      <section>
        <h2 id="today">%%today%%</h2>
        <p>%%habit%%</p>
        <button type="button">%%markDone%%</button>
      </section>
      <section>
        <h2 id="stats">%%stats%%</h2>
        <p>%%streak%%</p>
      </section>
    </main>
  </body>
</html>
