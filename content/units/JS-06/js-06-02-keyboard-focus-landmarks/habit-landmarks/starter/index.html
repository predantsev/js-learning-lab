<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%appName%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="top">
      <a href="#today" class="brand">%%appName%%</a>
    </div>
    <div class="menu">
      <a href="#today">%%today%%</a>
      <a href="#stats">%%stats%%</a>
    </div>
    <div class="content">
      <div class="title">%%title%%</div>
      <h2 id="today">%%today%%</h2>
      <p>%%habit%%</p>
      <!-- Someone wanted this button to be "first" for the keyboard. -->
      <button type="button" tabindex="1">%%markDone%%</button>
      <h2 id="stats">%%stats%%</h2>
      <p>%%streak%%</p>
    </div>
  </body>
</html>
