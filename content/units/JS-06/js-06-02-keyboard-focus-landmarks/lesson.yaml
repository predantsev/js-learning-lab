id: js-06-02-keyboard-focus-landmarks
unit: JS-06
title:
  uk: "Фокус клавіатури та орієнтири (landmarks)"
  en: "Keyboard focus and landmarks"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити порядок Tab на сторінці з порядку елементів у HTML і визначити, які елементи отримують фокус."
    en: "Predict the Tab order of a page from its DOM order and identify which elements are focusable."
  - uk: "Залишити індикатор фокусу видимим і дати сторінці орієнтири `header`, `nav` і `main`, між якими може переходити людина з клавіатурою чи програмою екранного читання."
    en: "Keep the focus indicator visible and give a page header, nav and main landmarks that a keyboard and screen-reader user can move between."
prerequisites: [js-06-01-forms-inputs-labels, js-01-06-html-elements-attributes]
subskills:
  - { family: W-01, skill: "keyboard focus", depth: intro }
  - { family: W-01, skill: "document structure/headings/landmarks", depth: practice }
glossary: [keyboard-focus, tab-order, focus-indicator, accessibility-tree]
selfCheck: [tab-path, planner-landmarks]

blocks:
  - id: moving-with-keys
    kind: explanation
    title:
      uk: "Клавіатура: Tab, Enter, Пробіл"
      en: "The keyboard: Tab, Enter, Space"
    body:
      uk: |
        Багато людей користуються сторінками без миші: через травму чи хворобу, разом із програмою екранного читання або просто тому, що так швидше. Вони рухаються клавішами:

        - **Tab** переносить [[keyboard-focus|фокус]] на наступний елемент, **Shift+Tab** — на попередній;
        - **Enter** переходить за посиланням чи натискає кнопку, **Пробіл** натискає кнопку чи ставить позначку.

        Фокус отримують лише елементи, з якими можна щось зробити: посилання з `href`, кнопки, поля форми. Вони шикуються в [[tab-order|порядок Tab]] — **у тому порядку, в якому стоять у HTML**.

        Де зараз фокус, показує [[focus-indicator|індикатор фокусу]] — рамка навколо елемента. Без неї людина з клавіатурою не бачить, де вона на сторінці.
      en: |
        Many people use pages without a mouse: because of an injury or illness, together with a screen reader, or simply because it is faster. They move with keys:

        - **Tab** moves the [[keyboard-focus|focus]] to the next element, **Shift+Tab** to the previous one;
        - **Enter** follows a link or presses a button, **Space** presses a button or ticks a checkbox.

        Only elements you can do something with receive focus: links with `href`, buttons, form fields. They line up in the [[tab-order]] — **in the order they appear in the HTML**.

        The [[focus-indicator]] — a frame around the element — shows where the focus is now. Without it a keyboard user cannot see where they are on the page.

  - id: tab-path
    kind: prediction
    lang: html
    runnable: false
    strings:
      stats: { uk: "Статистика", en: "Statistics" }
      markDone: { uk: "Відмітити виконаним", en: "Mark as done" }
      skipToday: { uk: "Пропустити сьогодні", en: "Skip today" }
      note: { uk: "Нотатка", en: "Note" }
    prompt:
      uk: "На цій сторінці трекера звичок CSS показує поле «Нотатка» **ліворуч** від кнопки, а код змушує «Пропустити сьогодні» реагувати на клік мишею. Ти клацаєш перед посиланням і кілька разів натискаєш Tab. Яким шляхом піде фокус?"
      en: "On this habit tracker page, CSS shows the “Note” field **to the left** of the button, and code makes “Skip today” react to mouse clicks. You click just before the link and press Tab several times. Which path does the focus take?"
    code: |
      <a href="#stats">%%stats%%</a>
      <div class="row">
        <button type="button">%%markDone%%</button>
        <div class="skip">%%skipToday%%</div>
        <label>%%note%% <input name="note"></label>
      </div>
    answer:
      type: choice
      options:
        - id: dom-order
          text:
            uk: "Посилання → «Відмітити виконаним» → поле «Нотатка»"
            en: "The link → “Mark as done” → the “Note” field"
        - id: screen-order
          text:
            uk: "Посилання → поле «Нотатка» → «Відмітити виконаним»"
            en: "The link → the “Note” field → “Mark as done”"
          why:
            uk: "Tab іде за порядком у HTML, а не за тим, куди CSS поставив елементи на екрані. Тому візуальний порядок і порядок у HTML мають збігатися."
            en: "Tab follows the order in the HTML, not where CSS put the elements on screen. That is why the visual order and the HTML order should match."
        - id: with-div
          text:
            uk: "Посилання → «Відмітити виконаним» → «Пропустити сьогодні» → поле «Нотатка»"
            en: "The link → “Mark as done” → “Skip today” → the “Note” field"
          why:
            uk: "Реакція на клік не робить `<div>` фокусованим: клавіатура його не бачить. Для дії потрібна кнопка."
            en: "Reacting to clicks does not make a `<div>` focusable: the keyboard never reaches it. An action needs a button."
        - id: no-field
          text:
            uk: "Посилання → «Відмітити виконаним», а в поле потрапляють лише кліком"
            en: "The link → “Mark as done”, and the field is reached only by clicking"
          why:
            uk: "Поля форми отримують фокус — інакше людина з клавіатурою не змогла б у них писати."
            en: "Form fields receive focus — otherwise a keyboard user could not type into them."
      correct: [dom-order]
    explanation:
      uk: "Tab відвідує фокусовані елементи — посилання з `href`, кнопки, поля — у порядку HTML. `<div>` пропущено: реакція на клік не робить його фокусованим, а програма екранного читання не назве його кнопкою. CSS, що переставляє елементи на екрані, порядку Tab не змінює."
      en: "Tab visits focusable elements — links with `href`, buttons, fields — in HTML order. The `<div>` is skipped: reacting to clicks does not make it focusable, and a screen reader does not call it a button. CSS that moves elements around on screen does not change the Tab order."

  - id: clickable-is-not-reachable
    kind: explanation
    title:
      uk: "Клікабельне — ще не досяжне"
      en: "Clickable is not the same as reachable"
    body:
      uk: |
        `<div>`, якому код додав реакцію на клік, працює лише для миші. Для дії бери `<button>`: фокус, Enter і Пробіл він уміє сам, а програма екранного читання називає його кнопкою.

        Атрибут `tabindex` змінює поведінку фокусу:

        | Значення | Що робить |
        |---|---|
        | `tabindex="0"` | елемент стає в порядок Tab на своєму місці в HTML |
        | `tabindex="-1"` | у порядок Tab не стає, але код може перевести на нього фокус |
        | `tabindex="1"` і більше | елемент стрибає **поперед усіх**, і порядок перестає збігатися зі сторінкою |

        Додатний `tabindex` — пастка: щоб змінити порядок, переставляють елементи в HTML.

        Так само з рамкою фокусу: `outline: none` робить сторінку «чистішою» лише для того, хто користується мишею. Хочеш іншу рамку — не вимикай її, а задай свою для `:focus-visible`. Це **псевдоклас**: селектор `button:focus-visible` вибирає кнопку лише тоді, коли вона у фокусі й браузер вирішив показати рамку — наприклад, коли людина рухається клавіатурою.
      en: |
        A `<div>` that code made react to clicks works only for the mouse. For an action, take a `<button>`: it handles focus, Enter and Space by itself, and screen readers call it a button.

        The `tabindex` attribute changes how focus behaves:

        | Value | What it does |
        |---|---|
        | `tabindex="0"` | the element joins the Tab order at its place in the HTML |
        | `tabindex="-1"` | it does not join the Tab order, but code can move the focus to it |
        | `tabindex="1"` and more | the element jumps **ahead of everything**, so the order no longer matches the page |

        A positive `tabindex` is a trap: to change the order, rearrange the elements in the HTML.

        The same goes for the focus frame: `outline: none` makes the page “cleaner” only for mouse users. If you want a different frame, do not switch it off — give `:focus-visible` your own. It is a **pseudo-class**: the selector `button:focus-visible` selects a button only while it has focus and the browser decided to show the frame — for example, when the person moves with the keyboard.

  - id: landmarks-tree
    kind: explanation
    title:
      uk: "Орієнтири й дерево доступності"
      en: "Landmarks and the accessibility tree"
    body:
      uk: |
        З HTML браузер будує [[accessibility-tree|дерево доступності]]: для кожного важливого елемента — роль («кнопка», «посилання», «заголовок») та ім’я. Саме його читає програма екранного читання.

        Три елементи створюють [[landmark|орієнтири]] — великі ділянки, між якими можна стрибати однією клавішею:

        | Елемент | Орієнтир |
        |---|---|
        | `<header>` для всієї сторінки | banner — шапка з назвою сайту |
        | `<nav>` | navigation — посилання на розділи |
        | `<main>` | main — головний вміст, один на сторінку |

        Разом з одним `<h1>` і заголовками розділів орієнтири дають людині зміст сторінки ще до того, як вона почне читати. Дерево видно в інструментах розробника: правою кнопкою миші по елементу → у меню браузера **Перевірити** (Inspect) → вкладка **Accessibility**.
      en: |
        From the HTML the browser builds an [[accessibility-tree]]: a role (“button”, “link”, “heading”) and a name for every important element. That is what a screen reader reads.

        Three elements create [[landmark|landmarks]] — large regions you can jump between with a single key:

        | Element | Landmark |
        |---|---|
        | `<header>` of the whole page | banner — the top bar with the site name |
        | `<nav>` | navigation — links to the sections |
        | `<main>` | main — the main content, one per page |

        Together with one `<h1>` and the section headings, landmarks give a person the outline of the page before they start reading. You can see the tree in the developer tools: right-click an element → **Inspect** in the browser’s menu → the **Accessibility** tab.

  - id: focus-tree
    kind: visual
    visual: diagram
    title:
      uk: "Дерево доступності й шлях Tab"
      en: "The accessibility tree and the Tab path"
    textEquivalent:
      uk: >-
        Сторінку трекера звичок з прикладу нижче можна намалювати як частину дерева доступності. Ліворуч — три
        орієнтири: header (banner), nav (navigation) і main. Праворуч — елементи в порядку HTML, кожен зі своєю роллю та ім’ям:
        у header — посилання «Трекер звичок»; у nav — посилання «Сьогодні» і «Статистика»; у main — заголовок «Мої
        звички», кнопка «Відмітити», div «Пропустити» і текстове поле «Нотатка». Перший Tab ставить фокус на
        посилання в шапці, другий і третій — на посилання меню, четвертий — на кнопку: заголовок не фокусований.
        П’ятий Tab перестрибує через div «Пропустити», бо реакція на клік не робить його фокусованим, і ставить фокус
        у поле «Нотатка». Людина з програмою екранного читання може ще й стрибати між орієнтирами та заголовками.
      en: >-
        The habit tracker page from the example below can be drawn as part of the accessibility tree. On the left are three
        landmarks: header (banner), nav (navigation) and main. On the right are the elements in HTML order, each with its role
        and name: in the header, the link “Habit tracker”; in nav, the links “Today” and “Statistics”; in main, the heading “My
        habits”, the button “Mark as done”, the div “Skip today” and the text field “Note”. The first Tab puts the focus on the
        header link, the second and third on the menu links, the fourth on the button: the heading is not focusable. The fifth
        Tab jumps over the div “Skip today”, because reacting to clicks does not make it focusable, and puts the focus into the
        “Note” field. A screen reader user can also jump between the landmarks and the headings.
    spec:
      layout: grid
      nodes:
        - { id: header, label: "<header>", shape: pill, col: 0, row: 0, w: 90 }
        - { id: nav, label: "<nav>", shape: pill, col: 0, row: 1, w: 90 }
        - { id: main, label: "<main>", shape: pill, col: 0, row: 3, w: 90 }
        - { id: brand, label: { uk: "1 · link «Трекер звичок»", en: "1 · link “Habit tracker”" }, col: 1, row: 0, w: 210 }
        - { id: today, label: { uk: "2 · link «Сьогодні»", en: "2 · link “Today”" }, col: 1, row: 1, w: 210 }
        - { id: stats, label: { uk: "3 · link «Статистика»", en: "3 · link “Statistics”" }, col: 1, row: 2, w: 210 }
        - { id: heading, label: { uk: "heading «Мої звички»", en: "heading “My habits”" }, col: 1, row: 3, w: 210 }
        - { id: mark, label: { uk: "4 · button «Відмітити»", en: "4 · button “Mark as done”" }, col: 1, row: 4, w: 210 }
        - { id: skip, label: { uk: "div «Пропустити»", en: "div “Skip today”" }, shape: note, col: 1, row: 5, w: 210 }
        - { id: note, label: { uk: "5 · textbox «Нотатка»", en: "5 · textbox “Note”" }, col: 1, row: 6, w: 210 }
      edges:
        - { from: header, to: brand }
        - { from: nav, to: today }
        - { from: nav, to: stats }
        - { from: main, to: heading }
        - { from: main, to: mark }
        - { from: main, to: skip, kind: dashed }
        - { from: main, to: note }
      steps:
        - caption:
            uk: "Ліворуч — орієнтири, які браузер створив із `<header>`, `<nav>` і `<main>`. Праворуч — елементи в порядку HTML: роль та ім’я кожного; число — на котрому натисканні Tab до елемента дійде фокус. Це частина дерева доступності."
            en: "On the left are the landmarks the browser made from `<header>`, `<nav>` and `<main>`. On the right are the elements in HTML order: the role and name of each; the number says on which Tab press the focus reaches it. This is part of the accessibility tree."
        - highlight: [brand, header->brand]
          caption:
            uk: "Перший **Tab**: фокус стає на перший фокусований елемент у HTML — посилання в шапці."
            en: "The first **Tab**: the focus lands on the first focusable element in the HTML — the link in the header."
        - highlight: [today, nav->today]
          caption:
            uk: "Другий **Tab** — перше посилання меню в `<nav>`."
            en: "The second **Tab** — the first menu link in `<nav>`."
        - highlight: [stats, nav->stats]
          caption:
            uk: "Третій **Tab** — друге посилання меню."
            en: "The third **Tab** — the second menu link."
        - highlight: [mark, main->mark]
          dim: [heading]
          caption:
            uk: "Четвертий **Tab** — кнопка. Заголовок фокусу не отримує й номера не має: з ним нічого не зробиш (програма екранного читання доходить до заголовків власними клавішами)."
            en: "The fourth **Tab** — the button. The heading gets no focus and no number: there is nothing to do with it (screen readers reach headings with their own keys)."
        - highlight: [note, main->note]
          dim: [skip, main->skip]
          caption:
            uk: "П’ятий **Tab** перестрибує через `<div>` «Пропустити» просто в поле «Нотатка». Мишею по div клацнути можна, а клавіатурою до нього не дістатися — людина без миші цієї дії не має."
            en: "The fifth **Tab** jumps over the `<div>` “Skip today” straight into the “Note” field. You can click the div with a mouse, but the keyboard cannot reach it — a person without a mouse simply does not have this action."
        - highlight: [header, nav, main, heading]
          caption:
            uk: "Програма екранного читання вміє ще й стрибати між орієнтирами (banner, navigation, main) і заголовками. Тому структура сторінки важить, навіть коли на екрані її не видно."
            en: "A screen reader can also jump between landmarks (banner, navigation, main) and headings. That is why the page structure matters even when the screen does not show it."

  - id: habit-actions
    kind: example
    runtime: browser-js
    dir: habit-actions
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      appName: { uk: "Трекер звичок", en: "Habit tracker" }
      sections: { uk: "Розділи", en: "Sections" }
      today: { uk: "Сьогодні", en: "Today" }
      stats: { uk: "Статистика", en: "Statistics" }
      title: { uk: "Мої звички", en: "My habits" }
      habit: { uk: "Пити воду — 8 склянок на день.", en: "Drink water — 8 glasses a day." }
      markDone: { uk: "Відмітити виконаним", en: "Mark as done" }
      skipToday: { uk: "Пропустити сьогодні", en: "Skip today" }
      note: { uk: "Нотатка", en: "Note" }
      streak: { uk: "Серія: 3 дні поспіль.", en: "Streak: 3 days in a row." }
      markedLog: { uk: "Звичку відмічено.", en: "Habit marked as done." }
      skippedLog: { uk: "Сьогодні пропущено.", en: "Today skipped." }
    title:
      uk: "Пройди сторінку клавіатурою"
      en: "Walk the page with the keyboard"
    body:
      uk: |
        Запусти сторінку, клацни на порожньому місці в зеленій шапці, праворуч від назви, і натискай **Tab**. Фокус кудись іде, але ти цього не бачиш: у кінці `styles.css` хтось вимкнув рамку.

        `index.js` лише змушує дві дії писати в консоль — як він це робить, дізнаєшся за кілька уроків.
      en: |
        Run the page, click an empty spot in the green header, to the right of the name, and keep pressing **Tab**. The focus moves somewhere, but you cannot see it: someone switched the frame off at the end of `styles.css`.

        `index.js` only makes the two actions print to the console — how it does that comes in a few lessons.
    tryIt:
      uk: |
        1. Видали правило `:focus { outline: none; }` у кінці `styles.css`, запусти й знову натискай Tab: тепер видно, де фокус.
        2. Клацни мишею «Пропустити сьогодні» і відкрий вкладку **Консоль**: там з’явилося повідомлення. Тепер спробуй дійти туди клавіатурою — не вийде.
        3. Заміни `<div class="skip">…</div>` на `<button type="button" class="skip">…</button>` і запусти: Tab доходить, а Enter і Пробіл натискають кнопку.
        4. Додай полю нотатки `tabindex="1"`, запусти, клацни в шапці й натискай Tab: після кнопок фокус уже не йде в поле, а виходить зі сторінки прикладу. Поле тепер стоїть у порядку Tab першим — раніше за шапку й меню, хоча на екрані воно нижче. Прибери атрибут.
      en: |
        1. Delete the `:focus { outline: none; }` rule at the end of `styles.css`, run and press Tab again: now you can see where the focus is.
        2. Click “Skip today” with the mouse and open the **Console** tab: a message appeared there. Now try to reach it with the keyboard — you cannot.
        3. Replace `<div class="skip">…</div>` with `<button type="button" class="skip">…</button>` and run: Tab reaches it, and Enter and Space press it.
        4. Give the note field `tabindex="1"`, run, click in the header and keep pressing Tab: after the buttons the focus no longer goes into the field but leaves the example page. The field now comes first in the Tab order — before the header and the menu, although it is lower on the screen. Remove the attribute.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: посилання чи кнопка"
      en: "Recall: link or button"
    items:
      - id: go-or-do
        from: js-01-07-links-buttons-images-tables
        prompt:
          uk: "У трекері звичок є «Статистика» (відкриває розділ статистики) і «Відмітити виконаним» (позначає звичку тут же). Якими елементами їх зробити?"
          en: "The habit tracker has “Statistics” (opens the statistics section) and “Mark as done” (marks the habit right here). Which elements should they be?"
        answer:
          type: choice
          options:
            - id: link-button
              text:
                uk: "«Статистика» — посилання `<a href>`, «Відмітити виконаним» — кнопка `<button>`"
                en: "“Statistics” — a link, `<a href>`; “Mark as done” — a button, `<button>`"
            - id: both-buttons
              text:
                uk: "Обидва — кнопки: так однаково виглядає"
                en: "Both buttons: they look the same that way"
              why:
                uk: "Вигляд не вирішує. Перехід до іншого місця — це посилання: програма екранного читання оголосить «посилання», і людина чекатиме переходу."
                en: "Looks do not decide. Going to another place is a link: a screen reader announces “link”, and the person expects to go somewhere."
            - id: both-links
              text:
                uk: "Обидва — посилання: на них однаково натискають Enter"
                en: "Both links: Enter works on both"
              why:
                uk: "Дія на сторінці — це кнопка. Пробіл натискає лише кнопку, а програма екранного читання пообіцяє перехід, якого не буде."
                en: "An action on the page is a button. Space presses only a button, and a screen reader would promise a navigation that never happens."
            - id: div-button
              text:
                uk: "«Статистика» — посилання, а «Відмітити» — `<div>` з реакцією на клік"
                en: "“Statistics” — a link, and “Mark as done” — a `<div>` that reacts to clicks"
              why:
                uk: "Реакція на клік не робить `<div>` фокусованим: клавіатурою до нього не дійти, і програма екранного читання не назве його кнопкою."
                en: "Reacting to clicks does not make a `<div>` focusable: the keyboard cannot reach it, and a screen reader does not call it a button."
          correct: [link-button]
        explanation:
          uk: "Питай: «Куди я потраплю?» чи «Що станеться тут?». Перехід — посилання, дія — кнопка. І посилання, і кнопка самі отримують фокус і реагують на клавіатуру."
          en: "Ask: “Where will I end up?” or “What will happen here?”. Going somewhere is a link, an action is a button. Both links and buttons receive focus and respond to the keyboard on their own."

  - id: planner-landmarks
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: planner-landmarks
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      appName: { uk: "Планувальник", en: "Planner" }
      sections: { uk: "Розділи", en: "Sections" }
      today: { uk: "Сьогодні", en: "Today" }
      week: { uk: "Цей тиждень", en: "This week" }
      title: { uk: "Мої справи", en: "My tasks" }
      task1: { uk: "Полити квіти — до вечора.", en: "Water the plants — by tonight." }
      markDone: { uk: "Позначити виконаною", en: "Mark as done" }
      task2: { uk: "Записатися до стоматолога — до 10 березня.", en: "Book a dentist visit — by March 10." }
    title:
      uk: "Орієнтири й видимий фокус"
      en: "Landmarks and a visible focus"
    instructions:
      uk: |
        Сторінка планувальника виглядає охайно, але для клавіатури й програми екранного читання вона — купа `<div>`.

        1. Шапку (`div.top`) зроби орієнтиром `<header>`, меню (`div.menu`) — `<nav>`, а вміст (`div.content`) — `<main>`. Класи залиш: стилі тримаються за них.
        2. Назва «Мої справи» має бути єдиним заголовком першого рівня.
        3. Прибери `tabindex="1"` з кнопки — нехай стоїть у природному порядку.
        4. У `styles.css` хтось вимкнув рамку фокусу. Зроби фокус на посиланнях і кнопці добре помітним.

        Потім клацни по сторінці й пройди її **лише клавіатурою**: Tab, Shift+Tab, Enter.
      en: |
        The planner page looks tidy, but for the keyboard and for screen readers it is a pile of `<div>`s.

        1. Turn the top bar (`div.top`) into a `<header>` landmark, the menu (`div.menu`) into `<nav>`, and the content (`div.content`) into `<main>`. Keep the classes: the styles rely on them.
        2. The title “My tasks” must be the only first-level heading.
        3. Remove `tabindex="1"` from the button — let it stand in the natural order.
        4. In `styles.css` someone switched the focus frame off. Make the focus on the links and the button clearly visible.

        Then click on the page and walk through it **with the keyboard only**: Tab, Shift+Tab, Enter.
    testTitles:
      "the page has a header landmark":
        uk: "Сторінка має орієнтир header із посиланням на назву"
        en: "The page has a header landmark with the name link"
      "the section links are inside a nav landmark":
        uk: "Посилання на розділи лежать у nav"
        en: "The section links are inside nav"
      "the main content is inside a main landmark":
        uk: "Головний вміст лежить у main"
        en: "The main content is inside main"
      "the page has exactly one first-level heading":
        uk: "На сторінці рівно один h1 — «Мої справи»"
        en: "The page has exactly one h1 — “My tasks”"
      "no element jumps the tab order with a positive tabindex":
        uk: "Жоден елемент не має додатного tabindex"
        en: "No element has a positive tabindex"
      "focus is clearly visible on every link and button":
        uk: "Фокус помітний на кожному посиланні й кнопці"
        en: "Focus is clearly visible on every link and button"
    hints:
      nudge:
        uk: "Які три елементи створюють орієнтири шапки, меню й головного вмісту? І що робить рамку фокусу невидимою?"
        en: "Which three elements create the landmarks for a top bar, a menu and the main content? And what makes the focus frame invisible?"
      explanation:
        uk: "Роль ділянці дає тег, а вигляд — клас, тож тег міняють, а клас лишають: бічна панель `<div class=\"side\">` стала б `<aside class=\"side\">` (і закривальний тег теж). Так само великий текст стає заголовком, коли міняється тег, а не стиль. Рамку фокусу не вимикають, а задають для `:focus-visible` — скажімо, `input:focus-visible { outline: 2px solid navy; }` для полів."
        en: "A tag gives a region its role and a class gives it its look, so you change the tag and keep the class: a side panel `<div class=\"side\">` would become `<aside class=\"side\">` (the closing tag too). Big text likewise becomes a heading when the tag changes, not the style. The focus frame is not switched off but styled for `:focus-visible` — say, `input:focus-visible { outline: 2px solid navy; }` for fields."
    solutionNote:
      uk: "На екрані майже нічого не змінилося, але дерево доступності тепер має орієнтири banner, navigation і main та один заголовок першого рівня. Кнопка стоїть у природному порядку Tab, а `:focus-visible` малює рамку саме тоді, коли людина рухається клавіатурою. `currentColor` — колір тексту самого елемента: рамка біла в темній шапці й темна на світлому тлі. Рамка через `box-shadow` теж підходить — головне, щоб фокус було видно."
      en: "Almost nothing changed on screen, but the accessibility tree now has the banner, navigation and main landmarks and one first-level heading. The button stands in the natural Tab order, and `:focus-visible` draws the frame exactly when the person moves with the keyboard. `currentColor` is the element’s own text color: the frame is white in the dark header and dark on the light background. A ring made with `box-shadow` works too — what matters is that the focus is visible."
    feedback:
      - when: { test: "the page has a header landmark" }
        message:
          uk: "Ця перевірка шукає `<header>` для всієї сторінки — не всередині `main`, `section`, `article`, `aside` чи `nav` — і посилання «Планувальник» у ньому."
          en: "This check looks for a `<header>` of the whole page — not inside `main`, `section`, `article`, `aside` or `nav` — with the link “Planner” in it."
      - when: { test: "the section links are inside a nav landmark" }
        message:
          uk: "Ця перевірка шукає посилання «Сьогодні» і «Цей тиждень» усередині елемента `<nav>`."
          en: "This check looks for the links “Today” and “This week” inside a `<nav>` element."
      - when: { test: "the main content is inside a main landmark" }
        message:
          uk: "Ця перевірка чекає, що кнопка й розділ «Цей тиждень» лежать усередині елемента `<main>`."
          en: "This check expects the button and the “This week” section to lie inside a `<main>` element."
      - when: { test: "the page has exactly one first-level heading" }
        message:
          uk: "Ця перевірка чекає на сторінці рівно один `<h1>` із текстом «Мої справи». Великий жирний текст у `<div>` заголовком не вважається, а заголовки розділів — це `<h2>`."
          en: "This check expects exactly one `<h1>` on the page, with the text “My tasks”. Big bold text in a `<div>` does not count as a heading, and section headings are `<h2>`."
      - when: { test: "no element jumps the tab order with a positive tabindex" }
        message:
          uk: "Ця перевірка чекає, що жоден елемент не має `tabindex`, більшого за 0: порядок Tab має задавати порядок елементів у HTML."
          en: "This check expects no element to have a `tabindex` greater than 0: the order of the elements in the HTML must set the Tab order."
      - when: { test: "focus is clearly visible on every link and button" }
        message:
          uk: "Ця перевірка по черзі ставить фокус на кожне посилання й кнопку і чекає помітної зміни: рамки `outline`, тіні `box-shadow`, іншого тла чи рамки. Якщо десь лишилося `outline: none`, рамку треба не вимикати, а задати власну."
          en: "This check focuses every link and button in turn and expects a visible change: an `outline` frame, a `box-shadow` ring, another background or border. If `outline: none` is still somewhere, the frame must not be switched off but replaced with your own."

  - id: to-project
    kind: transfer
    capstoneStep: JS-06
    body:
      uk: "Сторінка твого проєкту вже тримає вміст у `<main>`; шапку чи меню можеш додати сам, а рамку фокусу не прибирай. Коли додаватимеш картки й форму, перевіряй їх клавіатурою: кожна дія має бути кнопкою, до якої доходить Tab."
      en: "Your project’s page already keeps its content in `<main>`; you may add a header or a menu yourself, and do not remove the focus frame. When you add the cards and the form, check them with the keyboard: every action must be a button that Tab reaches."
