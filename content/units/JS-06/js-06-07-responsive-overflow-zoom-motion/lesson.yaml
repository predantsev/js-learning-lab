id: js-06-07-responsive-overflow-zoom-motion
unit: JS-06
title:
  uk: "Адаптивність, переповнення, масштаб і зменшений рух"
  en: "Responsive, overflow, zoom and reduced motion"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Додати медіазапит, щоб твій сайт перебудовував картки й форму у вузькому вікні й лишався зручним на масштабі 200%."
    en: "Add a media query so that the learner's own site reflows its cards and form at a narrow viewport and stays usable at 200% zoom."
  - uk: "Виправити горизонтальне переповнення від довгого тексту без пробілів і широкого вмісту, а анімації загорнути в медіазапит `prefers-reduced-motion`."
    en: "Fix horizontal overflow caused by long unbroken text and wide content, and wrap animations in a prefers-reduced-motion query."
prerequisites: [js-06-06-spacing-typography-maintainable, js-06-05-flexbox-grid]
subskills:
  - { family: W-02, skill: "responsive media queries", depth: intro }
  - { family: W-02, skill: "overflow and zoom", depth: intro }
  - { family: W-02, skill: "reduced motion", depth: intro }
glossary: [media-query, viewport, overflow, responsive-breakpoint, reduced-motion]
selfCheck: [what-breaks, responsive-wishes]

blocks:
  - id: one-page
    kind: explanation
    title:
      uk: "Одна сторінка для будь-якої ширини"
      en: "One page for any width"
    body:
      uk: |
        Сайт відкривають на телефоні, планшеті, ноутбуці й великому моніторі. [[viewport|Вікно перегляду]] (viewport) — видима частина сторінки — буває завширшки від 320 до понад 2000 пікселів. Адаптивний сайт — це **одна** сторінка з тим самим HTML, чиї стилі пристосовуються до ширини. Окрема «мобільна версія» не потрібна.

        Багато що вже пристосовується само: `max-width`, `flex-wrap`, `auto-fill`. Решту вмикає [[media-query|медіазапит]] — правила, що діють лише за певної умови:

        ```css
        .fields { display: grid; gap: 1rem; }

        @media (min-width: 40rem) {
          .fields { grid-template-columns: 1fr 1fr; }
        }
        ```

        Базові стилі розраховані на вузький екран, а медіазапит ставить поля попарно, коли вікно має щонайменше 40rem. Ширину, де розкладка змінюється, називають [[responsive-breakpoint|точкою перелому]] (breakpoint). Обирай її там, де вмістові стає тісно, а не під конкретний телефон.

        Щоб телефон показував сторінку у своїй справжній ширині, у `<head>` додають `<meta name="viewport" content="width=device-width, initial-scale=1">`.
      en: |
        Sites are opened on phones, tablets, laptops and big monitors. The [[viewport]] — the visible part of the page — can be anything from 320 to over 2000 pixels wide. A responsive site is **one** page with the same HTML whose styles adapt to the width. A separate “mobile version” is not needed.

        A lot adapts by itself already: `max-width`, `flex-wrap`, `auto-fill`. A [[media-query]] switches on the rest — rules that apply only under a condition:

        ```css
        .fields { display: grid; gap: 1rem; }

        @media (min-width: 40rem) {
          .fields { grid-template-columns: 1fr 1fr; }
        }
        ```

        The base styles are made for a narrow screen, and the media query puts the fields in pairs once the window is at least 40rem wide. The width where the layout changes is called a [[responsive-breakpoint|breakpoint]]. Choose it where the content starts to feel cramped, not for one particular phone.

        To make a phone show the page at its real width, the `<head>` gets `<meta name="viewport" content="width=device-width, initial-scale=1">`.

  - id: what-breaks
    kind: prediction
    prompt:
      uk: "На сторінці бажань є: посилання для спільного доступу (одне довге слово без пробілів), таблиця з `width: 30rem` (480px), блок-порада з `height: 3rem` і сітка карток з `repeat(auto-fill, minmax(10rem, 1fr))`. На моніторі на 100% масштабу все гаразд. Що зіпсується у вікні завширшки 320px? Познач усе."
      en: "A wishlist page has: a share link (one long word without spaces), a table with `width: 30rem` (480px), a tip box with `height: 3rem` and a card grid with `repeat(auto-fill, minmax(10rem, 1fr))`. On a monitor at 100% zoom everything is fine. What breaks in a window 320px wide? Mark everything."
    answer:
      type: multi
      options:
        - id: link
          text:
            uk: "Посилання вилізе праворуч, і з’явиться горизонтальна прокрутка"
            en: "The link sticks out to the right, and a horizontal scrollbar appears"
        - id: table
          text:
            uk: "Таблиця вилізе праворуч"
            en: "The table sticks out to the right"
        - id: tip
          text:
            uk: "Текст поради вилізе з блоку донизу"
            en: "The tip’s text spills out of its box at the bottom"
        - id: cards
          text:
            uk: "Сітка карток вилізе праворуч"
            en: "The card grid sticks out to the right"
          why:
            uk: "`auto-fill` сам зменшує кількість стовпців: у 320px лишиться один, і картки стануть одна під одною."
            en: "`auto-fill` reduces the number of columns by itself: at 320px one is left, and the cards stack one under another."
        - id: nothing
          text:
            uk: "Нічого: на моєму моніторі все гаразд, а браузер сам зменшить сторінку"
            en: "Nothing: it looks fine on my monitor, and the browser shrinks the page by itself"
          why:
            uk: "Браузер нічого не стискає сам. Те, що вміщається в 1440 пікселів, нічого не каже про 320."
            en: "The browser does not squeeze anything by itself. What fits into 1440 pixels says nothing about 320."
      correct: [link, table, tip]
    explanation:
      uk: "У вікні завширшки 320px вмісту дістається 320 CSS-пікселів мінус відступи. Слово без пробілів не може перенестися, фіксована ширина не зменшується, а фіксована висота не росте, коли текстові потрібно більше рядків. Лише сітка з `auto-fill` пристосовується сама."
      en: "In a window 320px wide the content gets 320 CSS pixels minus the padding. A word without spaces cannot wrap, a fixed width does not shrink, and a fixed height does not grow when the text needs more lines. Only the grid with `auto-fill` adapts by itself."

  - id: overflow-zoom
    kind: explanation
    title:
      uk: "Переповнення й масштаб"
      en: "Overflow and zoom"
    body:
      uk: |
        [[overflow|Переповнення]] (overflow) — це вміст, що не вміщається у свій блок і вилазить за нього. Три часті причини й ліки:

        | Причина | Ліки |
        |---|---|
        | довге слово чи посилання без пробілів | `overflow-wrap: anywhere` дозволяє розірвати його будь-де |
        | фіксована ширина, наприклад `width: 480px` | `max-width: 100%`; широку таблицю — в обгортку з `overflow-x: auto`, щоб вона прокручувалася всередині себе |
        | фіксована висота (`height`) | `min-height`: блок росте, коли тексту більше |

        **Масштаб** діє так само, як вужче вікно. На 200% кожен CSS-піксель удвічі більший, тож вікно завширшки 1280 пікселів екрана має лише 640 CSS-пікселів, а на 400% — 320. Медіазапити бачать саме CSS-пікселі. Тому сторінка, що працює у 320px, працює й на великому масштабі — так її бачать люди, яким потрібен великий текст.
      en: |
        [[overflow|Overflow]] is content that does not fit into its box and sticks out of it. Three common causes and their cures:

        | Cause | Cure |
        |---|---|
        | a long word or link without spaces | `overflow-wrap: anywhere` allows breaking it anywhere |
        | a fixed width such as `width: 480px` | `max-width: 100%`; put a wide table into a wrapper with `overflow-x: auto` so it scrolls inside itself |
        | a fixed height (`height`) | `min-height`: the box grows when there is more text |

        **Zoom** works just like a narrower window. At 200% every CSS pixel is twice as big, so a window 1280 screen pixels wide has only 640 CSS pixels, and at 400% — 320. Media queries see exactly those CSS pixels. That is why a page that works at 320px also works at a large zoom — the way people who need large text see it.

  - id: widths-and-motion
    kind: visual
    visual: diagram
    title:
      uk: "Ширина, масштаб і рух"
      en: "Width, zoom and motion"
    textEquivalent:
      uk: >-
        Вікно завширшки 1280 пікселів екрана на масштабі 100% дає сторінці 1280 CSS-пікселів, на 200% — 640, на 400% — 320.
        Сайт має базовий стиль з одним стовпцем карток і два медіазапити: з 40rem — два стовпці, з 60rem — три. Тому за
        1280 CSS-пікселів видно три стовпці, за 640 — два, за 320 — один: той самий HTML, той самий CSS, інша розкладка. У
        320 CSS-пікселях довге посилання без пробілів не може перенестися й вилазить праворуч, доки йому не дозволять
        розриватися через overflow-wrap. Нарешті, коли людина вмикає в системі «Зменшити рух», починає діяти медіазапит
        prefers-reduced-motion: reduce, і картка змінюється одразу, без анімації.
      en: >-
        A window 1280 screen pixels wide gives the page 1280 CSS pixels at 100% zoom, 640 at 200% and 320 at 400%. The site has
        a base style with one column of cards and two media queries: two columns from 40rem, three from 60rem. So 1280 CSS
        pixels show three columns, 640 show two, 320 show one: the same HTML, the same CSS, a different layout. In 320 CSS
        pixels a long link without spaces cannot wrap and sticks out to the right until overflow-wrap allows breaking it.
        Finally, when a person turns on “Reduce motion” in the system, the media query prefers-reduced-motion: reduce starts
        to apply, and the card changes at once, without animation.
    spec:
      layout: grid
      nodes:
        - { id: z100, label: "100% → 1280px", col: 0, row: 0, w: 150 }
        - { id: z200, label: "200% → 640px", col: 0, row: 1, w: 150 }
        - { id: z400, label: "400% → 320px", col: 0, row: 2, w: 150 }
        - { id: narrow, label: { uk: "320px, довге слово", en: "320px, a long word" }, col: 0, row: 3, w: 150 }
        - { id: motion, label: { uk: "«Зменшити рух»", en: "“Reduce motion”" }, col: 0, row: 4, w: 150 }
        - { id: three, label: { uk: "3 стовпці", en: "3 columns" }, shape: round, col: 1, row: 0, w: 150 }
        - { id: two, label: { uk: "2 стовпці", en: "2 columns" }, shape: round, col: 1, row: 1, w: 150 }
        - { id: one, label: { uk: "1 стовпець", en: "1 column" }, shape: round, col: 1, row: 2, w: 150 }
        - { id: sticks, label: { uk: "вилазить праворуч", en: "sticks out right" }, shape: note, col: 1, row: 3, w: 150 }
        - { id: still, label: { uk: "картка без анімації", en: "no card animation" }, shape: round, col: 1, row: 4, w: 150 }
      edges:
        - { from: z100, to: three }
        - { from: z200, to: two }
        - { from: z400, to: one }
        - { from: narrow, to: sticks }
        - { from: motion, to: still }
      steps:
        - caption:
            uk: "Вікно завширшки 1280 пікселів екрана. Масштаб робить CSS-пікселі більшими, тож сторінці їх дістається менше: на 200% — 640, на 400% — 320. Медіазапити бачать саме CSS-пікселі."
            en: "A window 1280 screen pixels wide. Zoom makes CSS pixels bigger, so the page gets fewer of them: 640 at 200%, 320 at 400%. Media queries see exactly those CSS pixels."
        - highlight: [z100, three, z100->three]
          caption:
            uk: "Базовий стиль — один стовпець, `@media (min-width: 40rem)` дає два, `@media (min-width: 60rem)` — три. За 1280 CSS-пікселів діють обидва медіазапити: **три** стовпці."
            en: "The base style is one column, `@media (min-width: 40rem)` gives two, `@media (min-width: 60rem)` three. At 1280 CSS pixels both media queries apply: **three** columns."
        - highlight: [z200, two, z200->two]
          caption:
            uk: "На 200% лишається 640 CSS-пікселів: умова 60rem (960px) уже хибна, тож **два** стовпці. Той самий HTML і CSS — інша розкладка."
            en: "At 200% only 640 CSS pixels remain: the 60rem (960px) condition is false now, so **two** columns. The same HTML and CSS — a different layout."
        - highlight: [z400, one, z400->one]
          caption:
            uk: "На 400% — або на телефоні завширшки 320px — не діє жоден медіазапит: базовий стиль дає **один** стовпець. Тому базові стилі мусять працювати у 320px."
            en: "At 400% — or on a phone 320px wide — no media query applies: the base style gives **one** column. That is why the base styles must work at 320px."
        - highlight: [narrow, sticks, narrow->sticks]
          caption:
            uk: "У 320px довге посилання без пробілів не може перенестися й вилазить праворуч — з’являється горизонтальна прокрутка. `overflow-wrap: anywhere` дозволяє розірвати його."
            en: "At 320px a long link without spaces cannot wrap and sticks out to the right — a horizontal scrollbar appears. `overflow-wrap: anywhere` allows breaking it."
        - highlight: [motion, still, motion->still]
          caption:
            uk: "Людина вмикає в системі «Зменшити рух» — і починає діяти `@media (prefers-reduced-motion: reduce)`: картка змінюється одразу, без анімації."
            en: "A person turns on “Reduce motion” in the system — and `@media (prefers-reduced-motion: reduce)` starts to apply: the card changes at once, without animation."

  - id: reduced-motion
    kind: explanation
    title:
      uk: "Рух — на вибір людини"
      en: "Motion is the person’s choice"
    body:
      uk: |
        Рух на сторінці — картка підстрибує, панель виїжджає — комусь приємний, а в когось викликає запаморочення й нудоту. Такі люди вмикають у налаштуваннях системи «Зменшити рух». CSS бачить це налаштування через медіазапит:

        ```css
        .panel { transition: transform 0.3s; }
        .panel:hover { transform: translateY(-4px); }

        @media (prefers-reduced-motion: reduce) {
          .panel { transition: none; }
        }
        ```

        - `transition` робить зміну стилю плавною протягом заданого часу.
        - `transform: translateY(-4px)` зсуває елемент на 4px угору.
        - Правила в медіазапиті діють лише для людей, які попросили [[reduced-motion|зменшити рух]]: зміна відбувається одразу, без анімації.
      en: |
        Motion on a page — a card jumps up, a panel slides out — is pleasant for some people and makes others dizzy and sick. Those people turn on “Reduce motion” in their system settings. CSS sees that setting through a media query:

        ```css
        .panel { transition: transform 0.3s; }
        .panel:hover { transform: translateY(-4px); }

        @media (prefers-reduced-motion: reduce) {
          .panel { transition: none; }
        }
        ```

        - `transition` makes a change of style smooth over the given time.
        - `transform: translateY(-4px)` shifts the element 4px up.
        - The rules inside the media query apply only to people who asked to [[reduced-motion|reduce motion]]: the change happens at once, without animation.

  - id: wish-site
    kind: example
    runtime: browser-js
    dir: wish-site
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      viewerTitle: { uk: "Перегляд сайту", en: "Site viewer" }
      widthGroup: { uk: "Ширина вікна", en: "Window width" }
      reduceLabel: { uk: "Імітувати «Зменшити рух»", en: "Imitate “Reduce motion”" }
      frameTitle: { uk: "Сайт списку бажань", en: "The wishlist site" }
      statusPrefix: { uk: "Вікно завширшки", en: "Window width:" }
      scaled: { uk: "(показано зменшеним, щоб умістилося)", en: "(shown scaled down to fit)" }
      title: { uk: "Список бажань", en: "Wishlist" }
      search: { uk: "Пошук", en: "Search" }
      category: { uk: "Категорія", en: "Category" }
      all: { uk: "Усі", en: "All" }
      home: { uk: "Дім", en: "Home" }
      tech: { uk: "Техніка", en: "Tech" }
      shareNote: { uk: "Поділитися списком:", en: "Share the list:" }
      wish1: { uk: "Навушники", en: "Headphones" }
      wish2: { uk: "Настільна лампа", en: "Desk lamp" }
      wish3: { uk: "Велосипед", en: "Bicycle" }
      currency: { uk: "грн", en: "UAH" }
      tip: { uk: "Порада: додавай ціну хоча б приблизно — так легше планувати покупки.", en: "Tip: add a price, even a rough one — it makes planning purchases easier." }
      pricesCaption: { uk: "Де дешевше", en: "Where it is cheaper" }
      colWish: { uk: "Бажання", en: "Wish" }
      colPrice: { uk: "Ціна", en: "Price" }
      colShop: { uk: "Магазин", en: "Shop" }
      shop1: { uk: "Магазин біля дому", en: "The shop next door" }
      shop2: { uk: "Великий спортивний магазин", en: "The big sports store" }
    title:
      uk: "Сайт у трьох ширинах"
      en: "A site at three widths"
    body:
      uk: |
        Сайт списку бажань — це файли `site.html` і `site.css`. Файли `index.html`, `viewer.js` і `reduce-motion.js` — помічник: він показує сайт у рамці обраної ширини. Рамка — окреме вікно, тож медіазапити `site.css` бачать саме її ширину. Помічник використовує речі, які з’являться пізніше в курсі, — змінюй лише `site.html` і `site.css`.
      en: |
        The wishlist site is the files `site.html` and `site.css`. The files `index.html`, `viewer.js` and `reduce-motion.js` are a helper: it shows the site in a frame of the chosen width. The frame is a separate window, so the media queries of `site.css` see exactly its width. The helper uses things that appear later in the course — change only `site.html` and `site.css`.
    tryIt:
      uk: |
        1. Натискай `320px`, `480px` і `960px`. На вузьких ширинах посилання й таблиця вилазять праворуч, а текст поради — з блоку донизу. 480px — це вікно 960px на масштабі 200%.
        2. Додай у кінець `site.css` медіазапит, що з 40rem ставить поля фільтра поруч: `@media (min-width: 40rem) { .filters { grid-template-columns: 1fr 1fr; } }`. Запусти й порівняй 960px і 320px.
        3. Полагодь переповнення: додай `.note { overflow-wrap: anywhere; }`; у `site.html` обгорни таблицю в `<div class="table-wrap">…</div>` і додай `.table-wrap { overflow-x: auto; }`; у `.tip` заміни `height` на `min-height`.
        4. Наведи мишу на картку — вона плавно збільшується. Увімкни «Імітувати „Зменшити рух“» і наведи знову: тепер зміна миттєва — це працює правило з кінця `site.css`. Справжнє налаштування живе в системі, а в інструментах розробника його можна ввімкнути на панелі **Rendering**.
      en: |
        1. Press `320px`, `480px` and `960px`. At the narrow widths the link and the table stick out to the right, and the tip’s text spills out of its box at the bottom. 480px is a 960px window at 200% zoom.
        2. Add a media query at the end of `site.css` that puts the filter fields side by side from 40rem: `@media (min-width: 40rem) { .filters { grid-template-columns: 1fr 1fr; } }`. Run it and compare 960px with 320px.
        3. Fix the overflow: add `.note { overflow-wrap: anywhere; }`; in `site.html`, wrap the table in `<div class="table-wrap">…</div>` and add `.table-wrap { overflow-x: auto; }`; in `.tip`, replace `height` with `min-height`.
        4. Hover over a card — it grows smoothly. Turn on “Imitate ‘Reduce motion’” and hover again: now the change is instant — that is the rule at the end of `site.css` at work. The real setting lives in the operating system, and the developer tools can switch it on in the **Rendering** panel.

  - id: responsive-wishes
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: responsive-wishes
    entry: index.html
    editable: [styles.css]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Список бажань", en: "Wishlist" }
      shareLabel: { uk: "Код для спільного доступу:", en: "Share code:" }
      wish1: { uk: "Навушники", en: "Headphones" }
      wish2: { uk: "Настільна лампа", en: "Desk lamp" }
      wish3: { uk: "Велосипед", en: "Bicycle" }
      wish4: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      wish5: { uk: "Квитки на концерт", en: "Concert tickets" }
      wish6: { uk: "Термочашка", en: "Travel mug" }
      currency: { uk: "грн", en: "UAH" }
      noPrice: { uk: "без ціни", en: "no price" }
    title:
      uk: "Адаптивний список бажань"
      en: "A responsive wishlist"
    instructions:
      uk: |
        Сторінка бажань гарна на широкому екрані, але не вміє пристосовуватися. Пиши лише у `styles.css`, де позначено коментарями:

        1. Картки стоять в один стовпець. З ширини 40rem (640px) покажи їх у два стовпці, а з 60rem (960px) — у три.
        2. Довгий код для спільного доступу не має вилазити за край вузького вікна.
        3. Картки плавно підстрибують, коли на них наводять мишу. Для людей, які попросили зменшити рух, вимкни цю анімацію — `transition` картки.

        Перевірка відкриє сторінку у вікнах завширшки 320, 640, 700 і 1000px і ввімкне налаштування «Зменшити рух».
      en: |
        The wishlist page looks good on a wide screen but cannot adapt. Write only in `styles.css`, where the comments show:

        1. The cards stand in one column. From a width of 40rem (640px) show them in two columns, and from 60rem (960px) in three.
        2. The long share code must not stick out of a narrow window.
        3. The cards jump up smoothly when the mouse hovers over them. For people who asked to reduce motion, switch this animation off — the cards’ `transition`.

        The check opens the page in windows 320, 640, 700 and 1000px wide and turns on the “Reduce motion” setting.
    testTitles:
      "one column of cards in a 320px window":
        uk: "У вікні 320px картки стоять в один стовпець"
        en: "In a 320px window the cards stand in one column"
      "several columns of cards in a wider window":
        uk: "У ширших вікнах карток кілька в ряд"
        en: "In wider windows there are several cards in a row"
      "nothing sticks out at 320px or at 200% zoom":
        uk: "Нічого не вилазить у 320px і на масштабі 200%"
        en: "Nothing sticks out at 320px or at 200% zoom"
      "the cards still move smoothly for people who did not ask to reduce motion":
        uk: "Для решти людей картки й далі рухаються плавно"
        en: "For everyone else the cards still move smoothly"
      "the cards do not animate when reduced motion is requested":
        uk: "Коли просять зменшити рух, картки не анімуються"
        en: "When reduced motion is requested, the cards do not animate"
    hints:
      nudge:
        uk: "Базовий стиль уже дає один стовпець. Які правила мають додаватися, коли вікно ширшає, — і як записати умову «щонайменше така ширина»?"
        en: "The base style already gives one column. Which rules must be added as the window gets wider — and how do you write the condition “at least this wide”?"
      explanation:
        uk: "Умову «щонайменше 50rem» записують як `@media (min-width: 50rem) { … }`, а всередину кладуть звичайні правила; для кількох точок перелому — кілька медіазапитів, від вужчого до ширшого. Слову без пробілів дозволяє розриватися властивість `overflow-wrap`. Налаштування руху перевіряє медіазапит `prefers-reduced-motion` зі значенням `reduce`."
        en: "The condition “at least 50rem” is written as `@media (min-width: 50rem) { … }`, with ordinary rules inside; for several breakpoints — several media queries, from narrower to wider. The `overflow-wrap` property lets a word without spaces break. The motion setting is checked by the `prefers-reduced-motion` media query with the value `reduce`."
    solutionNote:
      uk: "Базовий стиль — для найвужчого екрана, а медіазапити з `min-width` додають стовпці, коли вистачає місця: це підхід «спершу мобільний». `overflow-wrap: anywhere` прибирає горизонтальну прокрутку, тому сторінка витримує і 320px, і масштаб 200%. Рух лишився для всіх, хто його не вимикав, а для решти зміна відбувається одразу."
      en: "The base style is for the narrowest screen, and media queries with `min-width` add columns when there is room: the “mobile first” approach. `overflow-wrap: anywhere` removes the horizontal scrolling, so the page survives both 320px and 200% zoom. Motion stays for everyone who did not switch it off, and for the rest the change happens at once."
    feedback:
      - when: { test: "one column of cards in a 320px window" }
        message:
          uk: "У вікні 320px карток більше, ніж одна в ряд. Перевір умови медіазапитів: `min-width` означає «щонайменше така ширина», а `max-width` — «щонайбільше»."
          en: "In a 320px window there is more than one card in a row. Check the media query conditions: `min-width` means “at least this wide”, and `max-width` means “at most this wide”."
      - when: { test: "several columns of cards in a wider window" }
        message:
          uk: "У вікнах 700px і 1000px має бути щонайменше два й три стовпці. Потрібні медіазапити з умовою на мінімальну ширину, що змінюють `grid-template-columns` у `.cards`."
          en: "Windows 700px and 1000px wide need at least two and three columns. You need media queries with a minimum-width condition that change `grid-template-columns` of `.cards`."
      - when: { test: "nothing sticks out at 320px or at 200% zoom" }
        message:
          uk: "Сторінка ширша за вузьке вікно — з’являється горизонтальна прокрутка. Найчастіше винне довге слово без пробілів: дозволь йому розриватися через `overflow-wrap`."
          en: "The page is wider than a narrow window — a horizontal scrollbar appears. Most often a long word without spaces is to blame: let it break with `overflow-wrap`."
      - when: { test: "the cards still move smoothly for people who did not ask to reduce motion" }
        message:
          uk: "Анімація зникла для всіх. Вимикай її лише всередині `@media (prefers-reduced-motion: reduce)`, а не для всіх і не в умові `no-preference`."
          en: "The animation is gone for everyone. Switch it off only inside `@media (prefers-reduced-motion: reduce)`, not for everyone and not in the `no-preference` condition."
      - when: { test: "the cards do not animate when reduced motion is requested" }
        message:
          uk: "Коли людина просить зменшити рух, у карток лишається `transition`. Додай медіазапит `prefers-reduced-motion: reduce`, який вимикає його."
          en: "When the person asks to reduce motion, the cards keep their `transition`. Add a `prefers-reduced-motion: reduce` media query that switches it off."

  - id: to-project
    kind: transfer
    capstoneStep: JS-06
    body:
      uk: "Перевір свій проєкт у вузькому вікні й на масштабі 200%: картки мають перебудовуватися, форма — лишатися зручною, а довгі назви — не вилазити за край. Будь-яку анімацію одразу загорни в `prefers-reduced-motion`."
      en: "Check your project in a narrow window and at 200% zoom: the cards must reflow, the form must stay usable, and long names must not stick out. Wrap any animation in `prefers-reduced-motion` right away."
