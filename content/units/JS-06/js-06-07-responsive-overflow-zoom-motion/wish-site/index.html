<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%viewerTitle%%</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0.5rem; }
      .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
      .controls button { font: inherit; padding: 0.25rem 0.75rem; }
      .controls button[aria-pressed="true"] { background: #2c5282; color: white; }
      .status { margin: 0.5rem 0; color: #4a5568; }
      .stage { overflow: hidden; border: 1px solid #a0aec0; }
      #site { display: block; border: 0; height: 640px; transform-origin: top left; background: white; }
    </style>
  </head>
  <body>
    <div class="controls" role="group" aria-label="%%widthGroup%%">
      <button type="button" data-width="320">320px</button>
      <button type="button" data-width="480">480px</button>
      <button type="button" data-width="960">960px</button>
      <label><input type="checkbox" id="reduce"> %%reduceLabel%%</label>
    </div>
    <p id="status" class="status"></p>
    <div class="stage"><iframe id="site" title="%%frameTitle%%"></iframe></div>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
