id: js-06-08-dom-query-create-update
unit: JS-06
title:
  uk: "DOM: знаходимо, створюємо, змінюємо, видаляємо"
  en: "The DOM: query, create, update, remove"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Знаходити вузли через `querySelector` і `querySelectorAll`, а також створювати, змінювати й видаляти вузли з JavaScript."
    en: "Select nodes with querySelector and querySelectorAll, and create, update and remove nodes from JavaScript."
  - uk: "Пояснити, чому зміна DOM не змінює текст HTML-файлу і чому `querySelector` повертає `null` для відсутнього елемента."
    en: "Explain why changing the DOM does not change the HTML source text, and why querySelector returns null for a missing element."
prerequisites: [js-04-05-objects-properties, js-01-06-html-elements-attributes]
subskills:
  - { family: W-03, skill: "query/create/update/remove nodes", depth: intro }
glossary: [dom, dom-tree, dom-node, query-selector]
selfCheck: [query-results, status-messages]

blocks:
  - id: page-as-tree
    kind: explanation
    title:
      uk: "Сторінка — це дерево об’єктів"
      en: "The page is a tree of objects"
    body:
      uk: |
        Коли браузер завантажує сторінку, він читає HTML і будує з нього [[dom|DOM]] (Document Object Model) — [[dom-tree|дерево]] об’єктів у пам’яті. Кожен елемент стає [[dom-node|вузлом]]: об’єктом із властивостями, як ті об’єкти, що ти вже створював у JavaScript. Екран показує саме DOM, а не текст файлу.

        До DOM JavaScript дістається через об’єкт `document`:

        ```js
        const list = document.querySelector("#tasks");     // перший елемент за селектором
        const items = document.querySelectorAll(".task");  // усі такі елементи
        const first = list.querySelector("li");            // пошук лише всередині list
        ```

        [[query-selector|querySelector]] приймає той самий селектор, що й CSS, і повертає перший знайдений вузол — або `null`, якщо такого немає. `querySelectorAll` повертає список усіх знайдених; скільки їх, каже `.length`.
      en: |
        When the browser loads a page, it reads the HTML and builds the [[dom|DOM]] (Document Object Model) from it — a [[dom-tree|tree]] of objects in memory. Every element becomes a [[dom-node|node]]: an object with properties, like the objects you have already created in JavaScript. The screen shows the DOM, not the text of the file.

        JavaScript reaches the DOM through the `document` object:

        ```js
        const list = document.querySelector("#tasks");     // the first element matching the selector
        const items = document.querySelectorAll(".task");  // all such elements
        const first = list.querySelector("li");            // search only inside list
        ```

        [[query-selector|querySelector]] takes the same selector as CSS and returns the first node it finds — or `null` if there is none. `querySelectorAll` returns a list of everything it found; `.length` tells how many.

  - id: create-change-remove
    kind: explanation
    title:
      uk: "Створити, змінити, прибрати"
      en: "Create, change, remove"
    body:
      uk: |
        ```js
        const item = document.createElement("li");  // новий вузол, поки поза сторінкою
        item.textContent = "Полити квіти";          // текст усередині вузла
        list.append(item);                          // приєднати в кінець list: тепер видно
        item.remove();                              // від’єднати від дерева: зник зі сторінки
        ```

        - `document.createElement` створює вузол, але на сторінку він потрапляє лише після `append`.
        - `textContent` — властивість вузла з його текстом: прочитаєш — отримаєш текст, присвоїш — заміниш.
        - Файл `index.html` від цього не змінюється. Перезавантаж сторінку — і браузер збудує DOM заново з того самого файлу.
      en: |
        ```js
        const item = document.createElement("li");  // a new node, not on the page yet
        item.textContent = "Water the plants";      // the text inside the node
        list.append(item);                          // attach at the end of list: now visible
        item.remove();                              // detach from the tree: gone from the page
        ```

        - `document.createElement` creates a node, but it reaches the page only after `append`.
        - `textContent` is the node’s property holding its text: read it to get the text, assign it to replace the text.
        - The file `index.html` does not change because of this. Reload the page, and the browser builds the DOM again from the same file.

  - id: query-results
    kind: prediction
    strings:
      habit1: { uk: "Ранкова зарядка", en: "Morning exercise" }
      habit2: { uk: "Пити воду", en: "Drink water" }
    prompt:
      uk: "Перша частина коду будує на сторінці список із двох звичок. Що виведуть чотири `console.log` у кінці?"
      en: "The first part of the code builds a list of two habits on the page. What do the four `console.log` calls at the end print?"
    code: |
      // Setup: a list with two habits.
      const list = document.createElement("ul");
      list.id = "habits";
      document.body.append(list);
      for (const name of ["%%habit1%%", "%%habit2%%"]) {
        const item = document.createElement("li");
        item.className = "habit";
        item.textContent = name;
        list.append(item);
      }

      // The question starts here.
      const saved = document.querySelectorAll(".habit");
      const extra = document.createElement("li");
      extra.className = "habit";
      list.append(extra);

      console.log(document.querySelector(".habit").textContent);
      console.log(document.querySelector("#streaks"));
      console.log(saved.length);
      console.log(document.querySelectorAll(".habit").length);
    verify:
      logs: ["%%habit1%%", "null", "2", "3"]
    answer:
      type: choice
      options:
        - id: snapshot
          text:
            uk: "«Ранкова зарядка», `null`, `2`, `3`"
            en: "“Morning exercise”, `null`, `2`, `3`"
        - id: live
          text:
            uk: "«Ранкова зарядка», `null`, `3`, `3`"
            en: "“Morning exercise”, `null`, `3`, `3`"
          why:
            uk: "`querySelectorAll` повертає знімок: список, збережений у `saved`, містить ті два вузли, що були на сторінці в ту мить. Новий вузол він сам не підхоплює."
            en: "`querySelectorAll` returns a snapshot: the list saved in `saved` holds the two nodes that were on the page at that moment. It does not pick up the new node by itself."
        - id: error
          text:
            uk: "«Ранкова зарядка», а потім помилка: елемента `#streaks` немає"
            en: "“Morning exercise”, then an error: there is no `#streaks` element"
          why:
            uk: "Для відсутнього елемента `querySelector` повертає `null`, а вивести `null` можна. Помилка була б, якби код спробував прочитати властивість у `null`, наприклад `.textContent`."
            en: "For a missing element `querySelector` returns `null`, and printing `null` is fine. An error would come if the code tried to read a property of `null`, such as `.textContent`."
        - id: last
          text:
            uk: "«Пити воду», `null`, `2`, `3`"
            en: "“Drink water”, `null`, `2`, `3`"
          why:
            uk: "`querySelector` повертає **перший** вузол у порядку сторінки, а не останній."
            en: "`querySelector` returns the **first** node in page order, not the last one."
      correct: [snapshot]
    explanation:
      uk: "`querySelector` знаходить перший вузол із класом `habit` — «Ранкова зарядка». Елемента `#streaks` немає, тож результат — `null`. `saved` зберігає знімок з двох вузлів, і новий вузол до нього не додається; а свіжий `querySelectorAll` шукає знову й знаходить уже три."
      en: "`querySelector` finds the first node with the class `habit` — “Morning exercise”. There is no `#streaks` element, so the result is `null`. `saved` keeps a snapshot of two nodes, and the new node does not join it; a fresh `querySelectorAll` searches again and finds three."

  - id: source-and-dom
    kind: visual
    visual: diagram
    title:
      uk: "Текст файлу й живе дерево DOM"
      en: "The file text and the live DOM tree"
    textEquivalent:
      uk: >-
        Ліворуч — рядки коду з index.html: список ul з id habits і два пункти li, «Зарядка» і «Вода». Праворуч — DOM, дерево
        об’єктів, яке браузер збудував із цього тексту: вузол ul#habits і два вузли li в ньому. querySelector("#habits li")
        повертає перший вузол li — сам об’єкт, а не копію тексту. createElement створює третій вузол li «Читати», а append
        приєднує його до дерева, і він з’являється на сторінці, хоча у файлі такого рядка немає. Присвоєння textContent
        змінює текст одного вузла, і сторінка одразу показує новий текст, а рядок у файлі лишається старим. remove від’єднує
        вузол від дерева, і він зникає зі сторінки. Після перезавантаження браузер знову будує DOM з незмінного файлу — з
        двома пунктами.
      en: >-
        On the left are the lines of code of index.html: a ul list with the id habits and two li items, “Exercise” and
        “Water”. On the right is the DOM, the tree of objects the browser built from that text: a ul#habits node with two li
        nodes in it. querySelector("#habits li") returns the first li node — the object itself, not a copy of the text.
        createElement creates a third li node, “Reading”, and append attaches it to the tree, so it appears on the page, although
        the file has no such line. Assigning textContent changes the text of one node, and the page shows the new text at once,
        while the line in the file keeps the old one. remove detaches a node from the tree, and it disappears from the page.
        After a reload the browser builds the DOM again from the unchanged file — with two items.
    spec:
      layout: grid
      nodes:
        - { id: src-ul, label: "<ul id=\"habits\">", shape: note, col: 0, row: 0, w: 140 }
        - { id: src-li1, label: { uk: "<li>Зарядка</li>", en: "<li>Exercise</li>" }, shape: note, col: 0, row: 1, w: 140 }
        - { id: src-li2, label: { uk: "<li>Вода</li>", en: "<li>Water</li>" }, shape: note, col: 0, row: 2, w: 140 }
        - { id: dom-ul, label: "ul#habits", shape: round, col: 1, row: 0, w: 160 }
        - { id: dom-li1, label: { uk: "├ li «Зарядка»", en: "├ li “Exercise”" }, shape: round, col: 1, row: 1, w: 160 }
        - { id: dom-li2, label: { uk: "├ li «Вода»", en: "├ li “Water”" }, shape: round, col: 1, row: 2, w: 160 }
        - { id: dom-li3, label: { uk: "└ li «Читати»", en: "└ li “Reading”" }, shape: round, col: 1, row: 3, w: 160 }
      edges:
        - { from: src-ul, to: dom-ul, kind: dashed }
        - { from: src-li1, to: dom-li1, kind: dashed }
        - { from: src-li2, to: dom-li2, kind: dashed }
      hidden: [dom-li3]
      steps:
        - caption:
            uk: "Ліворуч — текст файлу `index.html`. Праворуч — DOM, дерево об’єктів, яке браузер збудував із цього тексту. JavaScript працює лише з правою частиною."
            en: "On the left is the text of the file `index.html`. On the right is the DOM, the tree of objects the browser built from that text. JavaScript works only with the right side."
        - highlight: [dom-li1]
          caption:
            uk: "`document.querySelector(\"#habits li\")` знаходить **перший** відповідний вузол і повертає його — сам об’єкт, а не копію тексту."
            en: "`document.querySelector(\"#habits li\")` finds the **first** matching node and returns it — the object itself, not a copy of the text."
        - show: [dom-li3]
          highlight: [dom-li3]
          caption:
            uk: "`document.createElement(\"li\")` створює вузол, а `list.append(item)` приєднує його до дерева — він з’являється на сторінці. Ліворуч такого рядка немає й не буде."
            en: "`document.createElement(\"li\")` creates a node, and `list.append(item)` attaches it to the tree — it appears on the page. The left side has no such line, and never will."
        - highlight: [dom-li2]
          dim: [src-li2]
          caption:
            uk: "`item.textContent = \"Вода · 8 склянок\"` змінює текст одного вузла. Сторінка одразу показує новий текст, а рядок у файлі лишається старим."
            en: "`item.textContent = \"Water · 8 glasses\"` changes the text of one node. The page shows the new text at once, while the line in the file keeps the old one."
        - dim: [dom-li3]
          caption:
            uk: "`item.remove()` від’єднує вузол від дерева — він зникає зі сторінки. Сам об’єкт існує, доки на нього вказує змінна, просто вже не в документі."
            en: "`item.remove()` detaches the node from the tree — it disappears from the page. The object itself exists while a variable points to it; it is just no longer in the document."
        - highlight: [src-ul, src-li1, src-li2]
          dim: [dom-li3]
          caption:
            uk: "Перезавантаж сторінку — і браузер знову збудує DOM з незмінного файлу: два пункти. Зміни, зроблені JavaScript, живуть лише у відкритій сторінці."
            en: "Reload the page, and the browser builds the DOM again from the unchanged file: two items. Changes made by JavaScript live only in the open page."

  - id: habit-dom
    kind: example
    runtime: browser-js
    dir: habit-dom
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер звичок", en: "Habit tracker" }
      habit1: { uk: "Ранкова зарядка", en: "Morning exercise" }
      habit2: { uk: "Пити воду", en: "Drink water" }
      newHabit: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      statusStart: { uk: "Скрипт ще не працював.", en: "The script has not run yet." }
      statusCount: { uk: "Звичок у списку:", en: "Habits in the list:" }
    title:
      uk: "Змінюємо сторінку з JavaScript"
      en: "Changing the page from JavaScript"
    body:
      uk: |
        У `index.html` два пункти списку, а `index.js` додає третій і змінює текст під списком. Запусти й порівняй сторінку з файлом.
      en: |
        `index.html` has two list items, and `index.js` adds a third one and changes the text under the list. Run it and compare the page with the file.
    tryIt:
      uk: |
        1. Запусти: у списку три звички. Клацни по списку правою кнопкою миші й обери в меню браузера **Перевірити** (Inspect): на вкладці **Elements** три `<li>`, а в `index.html` їх і далі два.
        2. Допиши в кінець `index.js` рядок коду `item.remove();` і запусти: нова звичка зникла, а напис і далі каже «3» — його порахували ще до видалення.
        3. Зміни текст першої звички: `list.querySelector("li").textContent = "…";`.
        4. Зроби одруківку: `document.querySelector("#habit")` замість `"#habits"`. Запусти й прочитай помилку: `querySelector` нічого не знайшов і повернув `null`, а в `null` немає методу `append`. Виправ одруківку назад.
      en: |
        1. Run it: the list has three habits. Right-click the list and choose **Inspect** in the browser’s menu: the **Elements** tab shows three `<li>`, while `index.html` still has two.
        2. Add the line of code `item.remove();` at the end of `index.js` and run: the new habit is gone, but the text still says “3” — it was counted before the removal.
        3. Change the text of the first habit: `list.querySelector("li").textContent = "…";`.
        4. Make a typo: `document.querySelector("#habit")` instead of `"#habits"`. Run it and read the error: `querySelector` found nothing and returned `null`, and `null` has no `append` method. Fix the typo again.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: властивості об’єкта"
      en: "Recall: an object’s properties"
    strings:
      habit1: { uk: "Ранкова зарядка", en: "Morning exercise" }
    items:
      - id: read-set-properties
        from: js-04-05-objects-properties
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const habit = { name: "%%habit1%%", done: false };
          const key = "done";
          habit[key] = true;
          habit.streak = 3;
          console.log(habit.done, habit.streak, habit.note);
        verify:
          logs: ["true 3 undefined"]
        answer:
          type: choice
          options:
            - id: right
              code: "true 3 undefined"
            - id: key-literal
              code: "false 3 undefined"
              why:
                uk: "`habit[key]` бере назву властивості зі змінної `key`, тобто змінює саме `done`."
                en: "`habit[key]` takes the property name from the variable `key`, so it changes `done` itself."
            - id: null-missing
              code: "true 3 null"
              why:
                uk: "Читання властивості, якої немає, дає `undefined`, а не `null`."
                en: "Reading a property that does not exist gives `undefined`, not `null`."
            - id: error
              code: "TypeError"
              why:
                uk: "Додати нову властивість до об’єкта можна будь-коли, а прочитати відсутню — теж: отримаєш `undefined`."
                en: "You can add a new property to an object at any time, and reading a missing one is allowed too: you get `undefined`."
          correct: [right]
        explanation:
          uk: "Властивості читають і змінюють через крапку чи квадратні дужки, а нові з’являються простим присвоєнням. Вузли DOM — такі самі об’єкти: `item.textContent = \"…\"` — це присвоєння властивості, а браузер одразу показує результат на сторінці."
          en: "Properties are read and changed with a dot or square brackets, and new ones appear through a plain assignment. DOM nodes are objects just like that: `item.textContent = \"…\"` is a property assignment, and the browser shows the result on the page at once."

  - id: status-messages
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: status-messages
    entry: index.html
    editable: [index.js]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер звичок", en: "Habit tracker" }
      intro: { uk: "Тут з’являються повідомлення про твої звички.", en: "Messages about your habits appear here." }
      saved: { uk: "Звичку «Ранкова зарядка» відмічено.", en: "“Morning exercise” is marked as done." }
      streak: { uk: "Серія: 4 дні поспіль!", en: "Streak: 4 days in a row!" }
      extra: { uk: "Нову звичку додано.", en: "A new habit was added." }
    title:
      uk: "Повідомлення на сторінці"
      en: "Messages on the page"
    instructions:
      uk: |
        Трекер звичок показує короткі повідомлення в ділянці `<section id="messages">`. Допиши у `index.js` дві функції:

        1. `addMessage(text)` створює абзац `<p>`, кладе в нього текст і приєднує його в кінець ділянки повідомлень. Кожен виклик додає **новий** абзац.
        2. `clearMessages()` прибирає з ділянки всі повідомлення, але саму ділянку лишає на сторінці — у неї ще додаватимуть нові.

        Програма вже викликає `addMessage` двічі, тож після запуску на сторінці мають бути два повідомлення. Перевірка викликатиме обидві функції й сама.
      en: |
        The habit tracker shows short messages in the area `<section id="messages">`. Complete two functions in `index.js`:

        1. `addMessage(text)` creates a `<p>` paragraph, puts the text into it and attaches it at the end of the messages area. Every call adds a **new** paragraph.
        2. `clearMessages()` removes all messages from the area but keeps the area itself on the page — new messages will still be added to it.

        The program already calls `addMessage` twice, so after a run the page must show two messages. The check will call both functions too.
    testTitles:
      "the page shows its two messages when the program runs":
        uk: "Після запуску на сторінці два повідомлення"
        en: "After a run the page shows two messages"
      "addMessage adds a new paragraph with the given text":
        uk: "addMessage додає новий абзац із переданим текстом"
        en: "addMessage adds a new paragraph with the given text"
      "clearMessages removes every message but keeps the area":
        uk: "clearMessages прибирає всі повідомлення, а ділянку лишає"
        en: "clearMessages removes every message but keeps the area"
      "messages added after clearing appear on the page":
        uk: "Повідомлення, додане після очищення, видно на сторінці"
        en: "A message added after clearing appears on the page"
    hints:
      nudge:
        uk: "Повідомлення — це новий вузол. Як створити вузол, дати йому текст і приєднати до іншого? А як від’єднати вузол?"
        en: "A message is a new node. How do you create a node, give it text and attach it to another one? And how do you detach a node?"
      explanation:
        uk: "Новий вузол дає `document.createElement(\"…\")`, текст — властивість `textContent`, а в кінець батьківського вузла його ставить `parent.append(node)`. Наприклад, пункт меню: `const link = document.createElement(\"a\"); link.textContent = \"Тиждень\"; menu.append(link);`. Щоб прибрати кілька вузлів, знайди їх через `area.querySelectorAll(\"…\")` і для кожного виклич `.remove()` — так ділянка лишиться на місці."
        en: "`document.createElement(\"…\")` gives a new node, the `textContent` property gives it text, and `parent.append(node)` puts it at the end of its parent. For example, a menu item: `const link = document.createElement(\"a\"); link.textContent = \"Week\"; menu.append(link);`. To remove several nodes, find them with `area.querySelectorAll(\"…\")` and call `.remove()` on each — that way the area itself stays in place."
    solutionNote:
      uk: "`addMessage` щоразу створює окремий вузол `<p>` і приєднує його до ділянки, тож попередні повідомлення лишаються. `clearMessages` від’єднує абзаци по одному, а не саму ділянку: якби зникла вона, нові повідомлення приєднувалися б до вузла, якого вже немає на сторінці. `replaceChildren()` без аргументів теж прибирає всіх дітей одразу."
      en: "`addMessage` creates a separate `<p>` node every time and attaches it to the area, so earlier messages stay. `clearMessages` detaches the paragraphs one by one, not the area itself: if the area disappeared, new messages would be attached to a node that is no longer on the page. `replaceChildren()` without arguments also removes all children at once."
    feedback:
      - when: { test: "the page shows its two messages when the program runs" }
        message:
          uk: "Ця перевірка чекає, що після запуску в ділянці `#messages` стоять два абзаци `<p>` із текстами двох викликів `addMessage`, саме в такому порядку."
          en: "This check expects the `#messages` area to hold two `<p>` paragraphs with the texts of the two `addMessage` calls after a run, in that order."
      - when: { test: "addMessage adds a new paragraph with the given text" }
        message:
          uk: "Ця перевірка ще раз викликає `addMessage` і чекає, що абзаців стало на один більше, а останній має переданий текст. Кожен виклик має додавати новий абзац, а не замінювати текст усієї ділянки."
          en: "This check calls `addMessage` once more and expects one more paragraph, the last one holding the given text. Every call must add a new paragraph, not replace the text of the whole area."
      - when: { test: "clearMessages removes every message but keeps the area" }
        message:
          uk: "Ця перевірка викликає `clearMessages` і чекає, що ділянка `#messages` лишилася на сторінці, але без жодного абзацу."
          en: "This check calls `clearMessages` and expects the `#messages` area to stay on the page without a single paragraph."
      - when: { test: "messages added after clearing appear on the page" }
        message:
          uk: "Ця перевірка викликає `clearMessages`, а потім `addMessage` і чекає, що нове повідомлення видно на сторінці. Якщо його немає, перевір, чи `clearMessages` не прибирає саму ділянку."
          en: "This check calls `clearMessages`, then `addMessage`, and expects the new message to be visible on the page. If it is not, check whether `clearMessages` removes the area itself."
      - when: { error: TypeError }
        message:
          uk: "Програма зупинилася з помилкою [[type-error|TypeError]] — дію не можна виконати з таким значенням. Якщо в повідомленні є «Cannot read properties of null», то `querySelector` нічого не знайшов і повернув `null`: перевір селектор — `#` для `id`, крапка для класу."
          en: "The program stopped with a [[type-error|TypeError]] — an action cannot be done with such a value. If the message says “Cannot read properties of null”, `querySelector` found nothing and returned `null`: check the selector — `#` for an `id`, a dot for a class."

  - id: to-project
    kind: transfer
    capstoneStep: JS-06
    body:
      uk: "Записи твого проєкту поки що живуть у масиві. Далі ти навчишся перетворювати їх на вузли DOM: створювати картку для кожного запису, міняти її текст і прибирати, коли запис видаляють."
      en: "Your project’s records still live in an array. Next you will learn to turn them into DOM nodes: create a card for every record, change its text and remove it when the record is deleted."
