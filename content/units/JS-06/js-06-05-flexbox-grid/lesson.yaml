id: js-06-05-flexbox-grid
unit: JS-06
title:
  uk: "Flexbox і Grid"
  en: "Flexbox and Grid"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Обрати Flexbox для ряду чи стовпчика в одному напрямку, а Grid — для сітки карток у двох напрямках."
    en: "Choose Flexbox for a one-dimensional row or column and Grid for a two-dimensional card layout."
  - uk: "Скласти рядок форми й сітку карток, які переносяться й не вилазять за межі, за допомогою `gap`, `flex-wrap` і `repeat(auto-fill, minmax())`."
    en: "Lay out a form row and a card grid that wrap without overflowing, using gap, flex-wrap and repeat(auto-fill, minmax())."
prerequisites: [js-06-04-box-model-sizing]
subskills:
  - { family: W-02, skill: "Flexbox/Grid", depth: intro }
glossary: [flexbox, css-grid, main-axis, cross-axis, grid-track]
selfCheck: [column-spread, wish-layout]

blocks:
  - id: flex-axis
    kind: explanation
    title:
      uk: "Flexbox: елементи вздовж однієї осі"
      en: "Flexbox: items along one axis"
    body:
      uk: |
        Оголошення `display: flex` робить елемент flex-контейнером ([[flexbox|Flexbox]]). Його **прямі** дочірні елементи — flex-елементи — шикуються вздовж [[main-axis|головної осі]]:

        ```css
        .filters {
          display: flex;
          flex-direction: row;          /* головна вісь: зліва направо */
          justify-content: flex-start;  /* розподіл уздовж головної осі */
          align-items: center;          /* вирівнювання вздовж поперечної осі */
          gap: 8px;                     /* проміжок між елементами */
          flex-wrap: wrap;              /* не влазять — переходять у новий ряд */
        }
        ```

        - `flex-direction: row` — головна вісь іде зліва направо, `column` — згори донизу.
        - `justify-content` розподіляє елементи **вздовж головної осі**: `flex-start`, `center`, `space-between`.
        - `align-items` вирівнює їх **уздовж** [[cross-axis|поперечної осі]] — тієї, що перетинає головну: `stretch` (типово — розтягнути), `center`, `flex-start`.
        - Без `flex-wrap: wrap` елементи тиснуться в один ряд, навіть якщо вилазять за контейнер.
      en: |
        The declaration `display: flex` makes an element a flex container ([[flexbox]]). Its **direct** children — flex items — line up along the [[main-axis]]:

        ```css
        .filters {
          display: flex;
          flex-direction: row;          /* main axis: left to right */
          justify-content: flex-start;  /* distribution along the main axis */
          align-items: center;          /* alignment along the cross axis */
          gap: 8px;                     /* space between the items */
          flex-wrap: wrap;              /* items that do not fit move to a new row */
        }
        ```

        - `flex-direction: row` makes the main axis run left to right, `column` — top to bottom.
        - `justify-content` distributes the items **along the main axis**: `flex-start`, `center`, `space-between`.
        - `align-items` aligns them **along** the [[cross-axis]] — the one that crosses the main axis: `stretch` (the default), `center`, `flex-start`.
        - Without `flex-wrap: wrap` the items squeeze into one row, even if they stick out of the container.

  - id: column-spread
    kind: prediction
    lang: css
    runnable: false
    prompt:
      uk: "Три кнопки планувальника стоять у flex-контейнері заввишки 240px. Із `flex-direction: row` вони розійшлися: перша ліворуч, третя праворуч. Що станеться, коли правило набуде такого вигляду?"
      en: "Three planner buttons stand in a flex container 240px tall. With `flex-direction: row` they moved apart: the first on the left, the third on the right. What happens when the rule looks like this?"
    code: |
      .toolbar {
        display: flex;
        justify-content: space-between;
        height: 240px;
        flex-direction: column;
      }
    answer:
      type: choice
      options:
        - id: vertical-spread
          text:
            uk: "Кнопки стануть одна під одною й розійдуться по висоті: перша вгорі, третя внизу"
            en: "The buttons stack and spread over the height: the first at the top, the third at the bottom"
        - id: stay-row
          text:
            uk: "Кнопки лишаться в ряд, розставлені по ширині: `justify-content` завжди працює горизонтально"
            en: "The buttons stay in a row, spread across the width: `justify-content` always works horizontally"
          why:
            uk: "`justify-content` працює вздовж головної осі, а `flex-direction: column` повертає її донизу."
            en: "`justify-content` works along the main axis, and `flex-direction: column` turns it downward."
        - id: top-stack
          text:
            uk: "Кнопки стануть одна під одною вгорі, а внизу лишиться порожнеча"
            en: "The buttons stack at the top, leaving empty space below"
          why:
            uk: "Так було б, якби в контейнера не лишалося вільної висоти. Тут він заввишки 240px, і `space-between` розподіляє вільну висоту між кнопками."
            en: "That would happen if the container had no free height. Here it is 240px tall, and `space-between` distributes the free height between the buttons."
        - id: centered
          text:
            uk: "Кнопки зберуться стовпчиком посередині"
            en: "The buttons gather in a column in the middle"
          why:
            uk: "`space-between` не центрує: він притискає перший і останній елементи до країв."
            en: "`space-between` does not center: it pushes the first and the last item to the edges."
      correct: [vertical-spread]
    explanation:
      uk: "`flex-direction` задає головну вісь, а `justify-content` завжди працює вздовж неї. У стовпчику головна вісь іде донизу, тож `space-between` розносить кнопки по всій висоті 240px. А ще вони розтягнуться на всю ширину: `align-items`, що працює вздовж поперечної осі, типово дорівнює `stretch`."
      en: "`flex-direction` sets the main axis, and `justify-content` always works along it. In a column the main axis runs downward, so `space-between` spreads the buttons over the whole 240px height. They also stretch to the full width: `align-items`, which works along the cross axis, is `stretch` by default."

  - id: grid-tracks
    kind: explanation
    title:
      uk: "Grid: рядки й стовпці одночасно"
      en: "Grid: rows and columns at once"
    body:
      uk: |
        [[css-grid|Grid]] розкладає елементи в рядки **і** стовпці водночас:

        ```css
        .gallery {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
          gap: 8px;
        }
        ```

        - `grid-template-columns` описує стовпці — [[grid-track|доріжки]] (tracks) сітки. `repeat(3, 1fr)` дав би три рівні стовпці: `fr` — частка вільного місця.
        - `minmax(120px, 1fr)` — доріжка не вужча за 120px, а все, що лишилося, ділиться порівну.
        - `auto-fill` — стільки доріжок, скільки вміщається. Вужчий контейнер — менше стовпців, і ті самі картки перетікають у нові рядки. Медіазапити для цього не потрібні.
      en: |
        [[css-grid|Grid]] lays items out in rows **and** columns at the same time:

        ```css
        .gallery {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
          gap: 8px;
        }
        ```

        - `grid-template-columns` describes the columns — the [[grid-track|tracks]] of the grid. `repeat(3, 1fr)` would give three equal columns: `fr` is a fraction of the free space.
        - `minmax(120px, 1fr)` — a track is at least 120px wide, and whatever is left is shared equally.
        - `auto-fill` — as many tracks as fit. A narrower container means fewer columns, and the same cards flow into new rows. No media queries are needed for that.

  - id: axes-and-tracks
    kind: visual
    visual: diagram
    title:
      uk: "Осі flex-контейнера й доріжки сітки"
      en: "Flex axes and grid tracks"
    textEquivalent:
      uk: >-
        Угорі три елементи стоять у flex-контейнері з flex-direction: row: головна вісь іде зліва направо, і
        justify-content: space-between притискає перший елемент до лівого краю, а третій — до правого. Поперечна вісь
        вертикальна: align-items вирівнює елементи по висоті. Нижче ті самі три елементи з flex-direction: column: головна
        вісь іде згори донизу, тож justify-content тепер розподіляє елементи по висоті, а align-items працює по ширині й
        типово розтягує їх. Унизу — сітка Grid з repeat(auto-fill, minmax(160px, 1fr)): три доріжки-стовпці, і п’ять
        елементів займають клітинки по черзі: 1, 2, 3, а потім наступний рядок. Коли контейнер вужчає, доріжок
        уміщається менше, і ті самі елементи перетікають у нові рядки.
      en: >-
        At the top, three items stand in a flex container with flex-direction: row: the main axis runs from left to right, and
        justify-content: space-between pushes the first item to the left edge and the third to the right one. The cross axis
        is vertical: align-items aligns the items by height. Below are the same three items with flex-direction: column: the
        main axis runs from top to bottom, so justify-content now distributes the items by height, and align-items works
        across the width and stretches them by default. At the bottom is a grid with repeat(auto-fill, minmax(160px, 1fr)):
        three column tracks, and five items take the cells in turn: 1, 2, 3, then the next row. When the container gets
        narrower, fewer tracks fit, and the same items flow into new rows.
    spec:
      layout: grid
      nodes:
        - { id: r1, label: "1", col: 0, row: 0, w: 64 }
        - { id: r2, label: "2", col: 1, row: 0, w: 64 }
        - { id: r3, label: "3", col: 2, row: 0, w: 64 }
        - { id: c1, label: "1", col: 0, row: 1, w: 64 }
        - { id: c2, label: "2", col: 0, row: 2, w: 64 }
        - { id: c3, label: "3", col: 0, row: 3, w: 64 }
        - { id: g1, label: "1", shape: round, col: 0, row: 4, w: 64 }
        - { id: g2, label: "2", shape: round, col: 1, row: 4, w: 64 }
        - { id: g3, label: "3", shape: round, col: 2, row: 4, w: 64 }
        - { id: g4, label: "4", shape: round, col: 0, row: 5, w: 64 }
        - { id: g5, label: "5", shape: round, col: 1, row: 5, w: 64 }
      edges:
        - { id: row-main-1, from: r1, to: r2, label: { uk: "головна", en: "main" } }
        - { id: row-main-2, from: r2, to: r3 }
        - { id: col-main-1, from: c1, to: c2, label: { uk: "головна", en: "main" } }
        - { id: col-main-2, from: c2, to: c3 }
      hidden: [c1, c2, c3, col-main-1, col-main-2, g1, g2, g3, g4, g5]
      steps:
        - caption:
            uk: "`display: flex` шикує дочірні елементи вздовж **головної осі**. З `flex-direction: row` (так типово) вона йде зліва направо."
            en: "`display: flex` lines the children up along the **main axis**. With `flex-direction: row` (the default) it runs from left to right."
        - highlight: [r1, r3]
          annotate:
            - { id: r2, text: "space-between" }
          caption:
            uk: "`justify-content` розподіляє елементи **вздовж головної осі**: `space-between` притискає перший до початку, останній — до кінця, а вільне місце ділить між ними."
            en: "`justify-content` distributes the items **along the main axis**: `space-between` pushes the first to the start, the last to the end and shares the free space between them."
        - highlight: [r1, r2, r3]
          caption:
            uk: "`align-items` вирівнює елементи вздовж **поперечної осі**, що перетинає головну. Для ряду вона вертикальна: вгорі, посередині, внизу або на всю висоту контейнера."
            en: "`align-items` aligns the items along the **cross axis**, which crosses the main one. For a row it is vertical: top, middle, bottom or the full height of the container."
        - show: [c1, c2, c3, col-main-1, col-main-2]
          highlight: [c1, c2, c3, col-main-1, col-main-2]
          dim: [r1, r2, r3, row-main-1, row-main-2]
          caption:
            uk: "`flex-direction: column` повертає головну вісь донизу. Тепер `justify-content` розподіляє елементи **по висоті** (якщо контейнер вищий за них), а `align-items` працює по ширині — і типово розтягує їх на всю ширину."
            en: "`flex-direction: column` turns the main axis downward. Now `justify-content` distributes the items **by height** (if the container is taller than them), and `align-items` works across the width — stretching them to the full width by default."
        - show: [g1, g2, g3, g4, g5]
          highlight: [g1, g2, g3, g4, g5]
          dim: [r1, r2, r3, row-main-1, row-main-2, c1, c2, c3, col-main-1, col-main-2]
          caption:
            uk: "Grid розкладає елементи в рядки й стовпці одночасно. `repeat(auto-fill, minmax(160px, 1fr))` створює стільки доріжок-стовпців щонайменше по 160px, скільки вміщається, — тут три. Елементи займають клітинки по черзі: 1, 2, 3, а далі — новий рядок."
            en: "Grid lays items out in rows and columns at once. `repeat(auto-fill, minmax(160px, 1fr))` creates as many column tracks of at least 160px as fit — three here. The items take the cells in turn: 1, 2, 3, then a new row."
        - highlight: [g1, g4]
          dim: [r1, r2, r3, row-main-1, row-main-2, c1, c2, c3, col-main-1, col-main-2, g2, g3, g5]
          caption:
            uk: "Коли контейнер вужчає, доріжок уміщається менше — дві, потім одна, — і ті самі елементи перетікають у нові рядки. Сітка рахує доріжки сама, без медіазапитів."
            en: "When the container narrows, fewer tracks fit — two, then one — and the same items flow into new rows. The grid counts the tracks itself, without media queries."

  - id: both-together
    kind: explanation
    title:
      uk: "Flexbox чи Grid? Обидва"
      en: "Flexbox or Grid? Both"
    body:
      uk: |
        Grid не замінює Flexbox — вони розв’язують різні задачі й чудово поєднуються:

        | Задача | Інструмент |
        |---|---|
        | ряд кнопок, рядок форми, шапка з назвою й меню | Flexbox: один напрямок |
        | сітка карток, розкладка сторінки на ділянки | Grid: рядки й стовпці разом |

        Часто вони вкладені одне в одне: сторінка — сітка карток (Grid), кожна картка — стовпчик із заголовком і рядом кнопок (Flexbox). Обидва вміють `gap`, тож відступи між елементами задають там, а не через `margin` у кожного.
      en: |
        Grid does not replace Flexbox — they solve different tasks and combine well:

        | Task | Tool |
        |---|---|
        | a row of buttons, a form row, a header with a title and a menu | Flexbox: one direction |
        | a grid of cards, splitting a page into regions | Grid: rows and columns together |

        They are often nested: the page is a grid of cards (Grid), each card is a column with a heading and a row of buttons (Flexbox). Both support `gap`, so the spacing between items is set there instead of a `margin` on each item.

  - id: planner-layout
    kind: example
    runtime: browser-js
    dir: planner-layout
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Планувальник", en: "Planner" }
      resizeTip: { uk: "Потягни правий нижній кут пунктирної рамки, щоб зробити її вужчою чи ширшою.", en: "Drag the bottom-right corner of the dashed frame to make it narrower or wider." }
      search: { uk: "Пошук", en: "Search" }
      status: { uk: "Стан", en: "Status" }
      all: { uk: "Усі", en: "All" }
      pending: { uk: "Невиконані", en: "Pending" }
      done: { uk: "Виконані", en: "Done" }
      find: { uk: "Знайти", en: "Find" }
      task1: { uk: "Полити квіти", en: "Water the plants" }
      task2: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      task3: { uk: "Написати бабусі", en: "Write to grandma" }
      task4: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      task5: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      task6: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
      noDate: { uk: "без терміну", en: "no due date" }
    title:
      uk: "Панель пошуку й сітка справ"
      en: "A search bar and a task grid"
    body:
      uk: |
        Панель пошуку вже є flex-рядом, а справи поки що стоять одна під одною. Запусти й потягни кут пунктирної рамки: вона працює як вікно, яке можна звузити.
      en: |
        The search bar is already a flex row, and the tasks still stand one under another. Run it and drag the corner of the dashed frame: it works like a window you can narrow.
    tryIt:
      uk: |
        1. Зміни в `.toolbar` значення `row` на `column` і запусти: головна вісь пішла донизу. Поверни `row`.
        2. Звузь рамку: поле й кнопка вилазять за край. Додай у `.toolbar` оголошення `flex-wrap: wrap;` і `gap: 8px;` — тепер вони переходять у новий ряд.
        3. Зроби зі справ сітку: додай у `.tasks` оголошення `display: grid;`, `grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));` і `gap: 12px;`, а з `.task` прибери `margin-bottom`. Потягни рамку: стовпці з’являються й зникають.
      en: |
        1. In `.toolbar`, change `row` to `column` and run: the main axis now runs downward. Put `row` back.
        2. Narrow the frame: the field and the button stick out of the edge. Add `flex-wrap: wrap;` and `gap: 8px;` to `.toolbar` — now they move to a new row.
        3. Turn the tasks into a grid: add `display: grid;`, `grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));` and `gap: 12px;` to `.tasks`, and remove `margin-bottom` from `.task`. Drag the frame: columns appear and disappear.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: вкладені елементи"
      en: "Recall: nested elements"
    strings:
      search: { uk: "Пошук", en: "Search" }
      find: { uk: "Знайти", en: "Find" }
    items:
      - id: direct-children
        from: js-01-06-html-elements-attributes
        lang: html
        runnable: false
        prompt:
          uk: "Форма `.toolbar` має `display: flex`. Які елементи стануть її flex-елементами — тими, що шикуються вздовж головної осі?"
          en: "The form `.toolbar` has `display: flex`. Which elements become its flex items — the ones lined up along the main axis?"
        code: |
          <form class="toolbar">
            <label>%%search%% <input name="q"></label>
            <select name="status">…</select>
            <button>%%find%%</button>
          </form>
        answer:
          type: choice
          options:
            - id: direct
              text:
                uk: "`<label>`, `<select>` і `<button>`"
                en: "`<label>`, `<select>` and `<button>`"
            - id: with-input
              text:
                uk: "`<label>`, `<input>`, `<select>` і `<button>`"
                en: "`<label>`, `<input>`, `<select>` and `<button>`"
              why:
                uk: "`<input>` вкладений у `<label>`: це дочірній елемент підпису, а не форми. Flex-елементами стають лише прямі дочірні елементи контейнера."
                en: "The `<input>` is nested in the `<label>`: it is a child of the label, not of the form. Only the direct children of the container become flex items."
            - id: everything
              text:
                uk: "Усі елементи всередині форми, разом із варіантами `<option>`"
                en: "Every element inside the form, including the `<option>`s"
              why:
                uk: "Елементи вкладаються, як коробки в коробки. Flex розставляє лише ті коробки, що лежать просто у формі."
                en: "Elements nest like boxes in boxes. Flex arranges only the boxes that lie directly in the form."
            - id: form-only
              text:
                uk: "Лише сама форма"
                en: "Only the form itself"
              why:
                uk: "`display: flex` змінює те, як контейнер розставляє своїх дітей, а не саму форму."
                en: "`display: flex` changes how the container arranges its children, not the form itself."
          correct: [direct]
        explanation:
          uk: "Прямі дочірні елементи форми — `<label>`, `<select>` і `<button>`; поле `<input>` лежить глибше, усередині підпису. Тому на головній осі три елементи, а поле рухається разом зі своїм підписом."
          en: "The direct children of the form are `<label>`, `<select>` and `<button>`; the `<input>` lies deeper, inside the label. So there are three items on the main axis, and the field moves together with its label."

  - id: wish-layout
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: wish-layout
    entry: index.html
    editable: [styles.css]
    strings:
      lang: { uk: "uk", en: "en" }
