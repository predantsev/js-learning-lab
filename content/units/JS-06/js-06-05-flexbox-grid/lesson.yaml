    title:
      uk: "Рядок форми й сітка бажань"
      en: "A form row and a wish grid"
    instructions:
      uk: |
        Пунктирна рамка — це простір, який має сторінка: широкий на комп’ютері, вузький на телефоні. Пиши лише у `styles.css`, де позначено коментарями:

        1. Форма `.add-wish`: три поля й кнопка стоять в один ряд, з проміжками між ними, а коли місця бракує — переходять у новий ряд.
        2. Список `.wishes`: сітка, у якій стільки стовпців, скільки вміщається, кожен щонайменше 160px завширшки, з проміжками між картками.

        Перевірка звузить рамку до 260px і розширить до 900px: нічого не має вилазити за межі.
      en: |
        The dashed frame is the space the page has: wide on a computer, narrow on a phone. Write only in `styles.css`, where the comments show:

        1. The form `.add-wish`: the three fields and the button stand in one row with gaps between them, and when space runs out they move to a new row.
        2. The list `.wishes`: a grid with as many columns as fit, each at least 160px wide, with gaps between the cards.

        The check narrows the frame to 260px and widens it to 900px: nothing may stick out.
    testTitles:
      "the form is a flex row that keeps its items on one line when there is room":
        uk: "Форма — flex-ряд, і в широкій рамці все стоїть в один ряд"
        en: "The form is a flex row, and in a wide frame everything stands in one row"
      "the form wraps instead of overflowing in a narrow frame":
        uk: "У вузькій рамці форма переноситься, а не вилазить"
        en: "In a narrow frame the form wraps instead of sticking out"
      "the wish list is a grid with several columns when there is room":
        uk: "Список бажань — сітка з кількома стовпцями в широкій рамці"
        en: "The wish list is a grid with several columns in a wide frame"
      "the grid falls back to one column in a narrow frame":
        uk: "У вузькій рамці сітка має один стовпець"
        en: "In a narrow frame the grid has one column"
      "form items and cards are separated by gaps":
        uk: "Між полями й між картками є проміжки"
        en: "There are gaps between the fields and between the cards"
    hints:
      nudge:
        uk: "Форма — це один напрямок, а картки — рядки й стовпці. Який інструмент для чого? І що змушує елементи переходити в новий ряд?"
        en: "The form is one direction, and the cards are rows and columns. Which tool is for which? And what makes items move to a new row?"
      explanation:
        uk: "Ряд фільтрів, що переноситься, виглядав би так: `.filters { display: flex; flex-wrap: wrap; gap: 8px; }`. Галерея фото, де стовпців стільки, скільки вміщається, а кожен щонайменше 120px: `.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px; }`. Перенеси ці ідеї на форму й список бажань зі своїми числами."
        en: "A row of filters that wraps would look like `.filters { display: flex; flex-wrap: wrap; gap: 8px; }`. A photo gallery with as many columns as fit, each at least 120px: `.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px; }`. Carry these ideas over to the form and the wish list with your own numbers."
    solutionNote:
      uk: "Форма — один напрямок, тож це Flexbox: `flex-wrap: wrap` переносить поля, коли місця бракує, а `gap` тримає проміжки. Картки — рядки й стовпці, тож це Grid: `repeat(auto-fill, minmax(160px, 1fr))` сам рахує, скільки стовпців уміщається. Ніде немає фіксованої кількості стовпців чи ширини в px для всієї розкладки — тому вона пристосовується до будь-якої рамки."
      en: "The form is one direction, so it is Flexbox: `flex-wrap: wrap` moves fields to a new row when space runs out, and `gap` keeps the spacing. The cards are rows and columns, so it is Grid: `repeat(auto-fill, minmax(160px, 1fr))` counts by itself how many columns fit. Nowhere is there a fixed number of columns or a px width for the whole layout — that is why it adapts to any frame."
    feedback:
      - when: { test: "the form is a flex row that keeps its items on one line when there is room" }
        message:
          uk: "Форма має бути flex-контейнером (`display: flex`), і в широкій рамці поля з кнопкою мають стояти в один ряд."
          en: "The form must be a flex container (`display: flex`), and in a wide frame the fields and the button must stand in one row."
      - when: { test: "the form wraps instead of overflowing in a narrow frame" }
        message:
          uk: "У рамці завширшки 260px форма вилазить за межі або все ще тисне все в один ряд. Flex-елементам треба дозволити переходити в новий ряд."
          en: "In a 260px frame the form sticks out or still squeezes everything into one row. Flex items need permission to move to a new row."
      - when: { test: "the wish list is a grid with several columns when there is room" }
        message:
          uk: "Список `.wishes` має бути сіткою (`display: grid`), а в рамці завширшки 900px — мати щонайменше три стовпці."
          en: "The list `.wishes` must be a grid (`display: grid`) and have at least three columns in a 900px frame."
      - when: { test: "the grid falls back to one column in a narrow frame" }
        message:
          uk: "У рамці завширшки 260px має лишитися один стовпець. Фіксована кількість стовпців так не вміє — кількість має залежати від того, скільки доріжок щонайменше по 160px уміщається."
          en: "A 260px frame must leave one column. A fixed number of columns cannot do that — the count must depend on how many tracks of at least 160px fit."
      - when: { test: "form items and cards are separated by gaps" }
        message:
          uk: "Проміжки між елементами flex-ряду й сітки задає властивість `gap` самого контейнера."
          en: "The spacing between the items of a flex row and of a grid is set by the container’s own `gap` property."

  - id: to-project
    kind: transfer
    capstoneStep: JS-06
    body:
      uk: "Записи твого проєкту стануть сіткою карток на Grid, а форма — рядом полів на Flexbox, що переноситься. Тоді сторінка однаково добре виглядатиме і в широкому вікні, і на вузькому екрані."
      en: "Your project’s records will become a grid of cards built with Grid, and the form a wrapping row of fields built with Flexbox. Then the page looks equally good in a wide window and on a narrow screen."
