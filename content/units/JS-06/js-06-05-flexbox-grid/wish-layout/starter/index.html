<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <div class="frame">
        <form class="add-wish">
          <div class="field">
            <label for="name">%%nameLabel%%</label>
            <input id="name" name="name" required>
          </div>
          <div class="field">
            <label for="price">%%priceLabel%%</label>
            <input id="price" name="price" type="number" min="0">
          </div>
          <div class="field">
            <label for="category">%%categoryLabel%%</label>
            <select id="category" name="category">
              <option value="">%%noCategory%%</option>
              <option value="home">%%home%%</option>
              <option value="tech">%%tech%%</option>
            </select>
          </div>
          <button>%%add%%</button>
        </form>
        <ul class="wishes">
          <li class="wish"><h2>%%wish1%%</h2><p>80 %%currency%%</p></li>
          <li class="wish"><h2>%%wish2%%</h2><p>45 %%currency%%</p></li>
          <li class="wish"><h2>%%wish3%%</h2><p>240 %%currency%%</p></li>
          <li class="wish"><h2>%%wish4%%</h2><p>25 %%currency%%</p></li>
          <li class="wish"><h2>%%wish5%%</h2><p>%%noPrice%%</p></li>
          <li class="wish"><h2>%%wish6%%</h2><p>18 %%currency%%</p></li>
        </ul>
      </div>
    </main>
  </body>
</html>
