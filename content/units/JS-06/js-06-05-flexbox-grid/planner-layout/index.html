<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <p class="tip">%%resizeTip%%</p>
      <div class="frame">
        <form class="toolbar">
          <label for="q">%%search%%</label>
          <input id="q" name="q">
          <select name="status" aria-label="%%status%%">
            <option>%%all%%</option>
            <option>%%pending%%</option>
            <option>%%done%%</option>
          </select>
          <button type="button">%%find%%</button>
        </form>
        <ul class="tasks">
          <li class="task"><strong>%%task1%%</strong><span>2026-03-02</span></li>
          <li class="task"><strong>%%task2%%</strong><span>2026-03-01</span></li>
          <li class="task"><strong>%%task3%%</strong><span>%%noDate%%</span></li>
          <li class="task"><strong>%%task4%%</strong><span>2026-02-27</span></li>
          <li class="task"><strong>%%task5%%</strong><span>2026-03-10</span></li>
          <li class="task"><strong>%%task6%%</strong><span>2026-03-05</span></li>
        </ul>
      </div>
    </main>
  </body>
</html>
