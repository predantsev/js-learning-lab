<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <style>
      body { font-family: system-ui, sans-serif; }
      form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: end; }
      label { display: flex; flex-direction: column; }
      input, button { font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <form id="expense-form">
        <label>%%labelLabel%% <input name="label"></label>
        <label>%%amountLabel%% <input name="amount" type="number" step="0.01" min="0"></label>
        <button>%%add%%</button>
      </form>
      <ul id="expenses"></ul>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
