<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <style>
      body { font-family: system-ui, sans-serif; }
      .field { margin-bottom: 0.75rem; }
      label { display: block; }
      input, select, button { font: inherit; }
      .error { margin: 0.25rem 0 0; color: #9b2c2c; }
    </style>
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <!-- novalidate: the browser shows no bubbles of its own, so the messages of validate appear instead. -->
      <form id="expense-form" novalidate>
        <div class="field">
          <label for="label">%%labelLabel%%</label>
          <input id="label" name="label" aria-describedby="label-error">
          <p id="label-error" class="error"></p>
        </div>
        <div class="field">
          <label for="amount">%%amountLabel%%</label>
          <input id="amount" name="amount" type="number" step="0.01" aria-describedby="amount-error">
          <p id="amount-error" class="error"></p>
        </div>
        <div class="field">
          <label for="category">%%categoryLabel%%</label>
          <select id="category" name="category">
            <option value="food">%%food%%</option>
            <option value="transport">%%transport%%</option>
            <option value="home">%%home%%</option>
            <option value="fun">%%fun%%</option>
          </select>
        </div>
        <button>%%add%%</button>
      </form>
      <ul id="expenses"></ul>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
