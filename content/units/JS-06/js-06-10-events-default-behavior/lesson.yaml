id: js-06-10-events-default-behavior
unit: JS-06
title:
  uk: "Події, типова поведінка браузера і форми"
  en: "Events, default behavior and forms"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Додати формі слухача події `submit`, прочитати значення полів і скасувати типове перезавантаження сторінки."
    en: "Attach a submit listener to a form, read the form's values and prevent the default page reload."
  - uk: "Пояснити, чому форму обробляє слухач `submit`, а не слухач `click` на кнопці, — і для Enter, і для кліку."
    en: "Explain why a submit listener, not a click listener on the button, handles both Enter and button clicks."
  - uk: "Зняти слухача тією самою функцією, коли його частина інтерфейсу зникає, і передбачити, чому нову стрілкову функцію зняти не вийде."
    en: "Remove a listener with the same function reference when its part of the UI goes away, and predict why a fresh arrow cannot be removed."
prerequisites: [js-06-09-text-vs-html, js-06-01-forms-inputs-labels, js-03-06-higher-order-callbacks]
subskills:
  - { family: W-03, skill: "default behavior", depth: intro }
  - { family: W-03, skill: "forms and event cleanup", depth: intro }
glossary: [event, event-listener, default-action, prevent-default, listener-cleanup]
selfCheck: [enter-and-click, expense-submit]

blocks:
  - id: events-and-listeners
    kind: explanation
    title:
      uk: "Подія й слухач"
      en: "An event and a listener"
    body:
      uk: |
        [[event|Подія]] — це щось, що сталося на сторінці: клік, натискання клавіші, надсилання форми. Щоб відреагувати на неї, елементу додають [[event-listener|слухача]] — функцію, яку браузер викличе, **коли** подія станеться:

        ```js
        const more = document.querySelector("#more");
        more.addEventListener("click", (event) => {
          console.log("клік!", event.type);
        });
        ```

        - `addEventListener` приймає назву події й функцію — [[callback]].
        - Твій код цю функцію не викликає: її викличе браузер — пізніше й щоразу, коли подія станеться.
        - Браузер передає їй об’єкт події з подробицями: `event.type` — назва події, `event.target` — елемент, з якого вона почалася.
      en: |
        An [[event]] is something that happened on the page: a click, a key press, a form submission. To react to it, an element gets an [[event-listener]] — a function the browser calls **when** the event happens:

        ```js
        const more = document.querySelector("#more");
        more.addEventListener("click", (event) => {
          console.log("click!", event.type);
        });
        ```

        - `addEventListener` takes the event name and a function — a [[callback]].
        - Your code does not call that function: the browser calls it — later, and every time the event happens.
        - The browser passes it an event object with details: `event.type` is the event name, `event.target` the element where it started.

  - id: default-action
    kind: explanation
    title:
      uk: "Типова дія і форми"
      en: "The default action and forms"
    body:
      uk: |
        Багато подій мають [[default-action|типову дію]] — те, що браузер робить сам: клік по посиланню веде на іншу сторінку, а надсилання форми відправляє її дані й **перезавантажує сторінку**. Виклик [[prevent-default|`event.preventDefault()`]] у слухачі скасовує цю дію.

        Форму обробляють подією `submit` на самій формі:

        ```js
        const search = document.querySelector("#search-form");
        search.addEventListener("submit", (event) => {
          event.preventDefault();
          const query = search.elements.query.value; // поле з name="query"
          console.log(query);
        });
        ```

        - `submit` настає один раз на кожне надсилання — чи то клік по кнопці, чи Enter у полі.
        - Він настає лише після того, як пройшли вбудовані перевірки (`required`, `min`…).
        - `form.elements.query` знаходить поле за його атрибутом `name`, а `.value` — це завжди текст у лапках, навіть для `type="number"`.
      en: |
        Many events have a [[default-action]] — something the browser does by itself: a click on a link opens another page, and submitting a form sends its data and **reloads the page**. Calling [[prevent-default|`event.preventDefault()`]] in a listener cancels that action.

        A form is handled with the `submit` event on the form itself:

        ```js
        const search = document.querySelector("#search-form");
        search.addEventListener("submit", (event) => {
          event.preventDefault();
          const query = search.elements.query.value; // the field with name="query"
          console.log(query);
        });
        ```

        - `submit` happens once per submission — whether it was a button click or Enter in a field.
        - It happens only after the built-in checks passed (`required`, `min`…).
        - `form.elements.query` finds the field by its `name` attribute, and `.value` is always a string, even for `type="number"`.

  - id: enter-and-click
    kind: prediction
    prompt:
      uk: "У формі витрат є кнопка «Додати», яка надсилає форму. Хтось повісив на цю кнопку слухача `click`: він додає витрату в список, а `preventDefault` не викликає. Людина вводить суму й натискає **Enter** у полі. Що станеться у звичайному браузері?"
      en: "An expense form has an “Add” button that submits the form. Someone put a `click` listener on that button: it adds the expense to the list and does not call `preventDefault`. A person types an amount and presses **Enter** in the field. What happens in an ordinary browser?"
    answer:
      type: choice
      options:
        - id: no-run
          text:
            uk: "Слухач не спрацює: Enter — не клік"
            en: "The listener does not run: Enter is not a click"
          why:
            uk: "Браузер перетворює Enter у полі на клік кнопки, що надсилає форму, — тож слухач спрацює. Біда в тому, що відбувається далі."
            en: "The browser turns Enter in a field into a click on the button that submits the form — so the listener does run. The trouble is what happens next."
        - id: reload
          text:
            uk: "Слухач додасть витрату, а потім браузер надішле форму й перезавантажить сторінку — і нового рядка не стане"
            en: "The listener adds the expense, then the browser submits the form and reloads the page — and the new row is gone"
        - id: stays
          text:
            uk: "Слухач додасть витрату, і сторінка лишиться як є"
            en: "The listener adds the expense, and the page stays as it is"
          why:
            uk: "Надсилання форми — типова дія кнопки. Браузер виконує її після твого слухача, якщо її не скасувати."
            en: "Submitting the form is the button’s default action. The browser carries it out after your listener unless it is cancelled."
        - id: nothing
          text:
            uk: "Нічого: без слухача `submit` форма не працює"
            en: "Nothing: a form does not work without a `submit` listener"
          why:
            uk: "Форма надсилається й без жодного JavaScript — це її типова дія."
            en: "A form is submitted even without any JavaScript — that is its default action."
      correct: [reload]
    explanation:
      uk: "Enter у полі браузер перетворює на клік кнопки, що надсилає форму, тому слухач `click` спрацює. Але далі браузер виконає типову дію: надішле форму й перезавантажить сторінку, і доданий рядок зникне. До того ж `click` спрацьовує ще **до** вбудованих перевірок. Слухач `submit` на формі ловить і Enter, і клік, настає лише після перевірок, а `event.preventDefault()` у ньому скасовує саме перезавантаження."
      en: "The browser turns Enter in a field into a click on the button that submits the form, so the `click` listener runs. But then the browser carries out the default action: it submits the form and reloads the page, and the added row disappears. Besides, `click` runs **before** the built-in checks. A `submit` listener on the form catches both Enter and the click, runs only after the checks, and `event.preventDefault()` in it cancels exactly the reload."

  - id: submit-sequence
    kind: visual
    visual: sequence
    title:
      uk: "Шлях однієї події submit"
      en: "The path of one submit event"
    textEquivalent:
      uk: >-
        Учасників двоє: браузер і твій код — слухач, зареєстрований через addEventListener. Людина натискає Enter у полі суми
        (клік по кнопці «Додати» веде туди ж). Браузер спершу виконує вбудовані перевірки; якби щось не пройшло, на цьому
        все й скінчилося б. Перевірки пройдено, тож браузер створює подію submit і викликає слухача onSubmit, передаючи йому
        об’єкт події. Слухач викликає event.preventDefault() — це скасовує надсилання й перезавантаження. Далі слухач читає
        поля, викликає validate і оновлює сторінку. Коли слухач закінчив, браузер бачить, що типову дію скасовано, і сторінка
        лишається з новим рядком. Пізніше цю частину сторінки закривають. Виклик removeEventListener з новою стрілковою
        функцією нічого не знімає: це інший об’єкт, навіть якщо код у ній той самий. Виклик removeEventListener з тією
        самою функцією onSubmit знімає слухача.
      en: >-
        There are two participants: the browser and your code — the listener registered with addEventListener. The person
        presses Enter in the amount field (a click on the “Add” button leads to the same place). The browser first runs the
        built-in checks; had anything failed, everything would stop here. The checks passed, so the browser creates a submit
        event and calls the listener onSubmit, passing it the event object. The listener calls event.preventDefault(), which
        cancels the sending and the reload. Then the listener reads the fields, calls validate and updates the page. When the
        listener has finished, the browser sees that the default action was cancelled, and the page stays with the new row.
        Later this part of the page is closed. Calling removeEventListener with a new arrow function removes nothing: it is
        another object, even if its code is the same. Calling removeEventListener with the same function onSubmit removes the
        listener.
    spec:
      actors:
        - { id: browser, label: { uk: "Браузер", en: "Browser" } }
        - { id: code, label: { uk: "Твій код: слухач", en: "Your code: listener" } }
      intro:
        uk: "Двоє учасників: браузер, що стежить за сторінкою й діями людини, і твій код — слухач `onSubmit`, доданий через `form.addEventListener(\"submit\", onSubmit)`."
        en: "Two participants: the browser, which watches the page and the person’s actions, and your code — the listener `onSubmit`, added with `form.addEventListener(\"submit\", onSubmit)`."
      messages:
        - from: browser
          to: browser
          kind: note
          label: { uk: "Людина натискає Enter у полі суми", en: "The person presses Enter in the amount field" }
          caption:
            uk: "Enter у полі — або клік по «Додати» — означає «надішли форму». Обидва шляхи ведуть в одне місце."
            en: "Enter in a field — or a click on “Add” — means “submit the form”. Both paths lead to the same place."
        - from: browser
          to: browser
          kind: note
          label: { uk: "Вбудовані перевірки пройдено", en: "Built-in checks passed" }
          caption:
            uk: "Спершу браузер виконує вбудовані перевірки (`required`, `min`…). Якби правило було порушене, усе скінчилося б тут — без події `submit`."
            en: "First the browser runs the built-in checks (`required`, `min`…). Had a rule been broken, everything would stop here — with no `submit` event."
        - from: browser
          to: code
          label: "submit → onSubmit(event)"
          caption:
            uk: "Браузер створює подію `submit` і викликає твого слухача, передаючи йому об’єкт події. `onSubmit` викликав не твій код, а браузер."
            en: "The browser creates a `submit` event and calls your listener, passing it the event object. Not your code but the browser called `onSubmit`."
        - from: code
          to: browser
          label: "event.preventDefault()"
          caption:
            uk: "Слухач скасовує типову дію: форму не буде надіслано, сторінку — перезавантажено."
            en: "The listener cancels the default action: the form will not be sent, and the page will not reload."
        - from: code
          to: browser
          label: { uk: "оновлює сторінку (DOM)", en: "updates the page (DOM)" }
          note:
            uk: "Перед цим читає поля й викликає validate."
            en: "Before that it reads the fields and calls validate."
          caption:
            uk: "Тепер твій код читає поля, викликає `validate` і змінює сторінку: повідомлення біля поля або новий рядок."
            en: "Now your code reads the fields, calls `validate` and changes the page: a message next to a field or a new row."
        - from: browser
          to: browser
          kind: note
          label: { uk: "Типову дію скасовано: сторінка лишається", en: "Default action cancelled: the page stays" }
          caption:
            uk: "Коли слухач закінчив, браузер перевіряє: типову дію скасовано — сторінка лишається, з новим рядком."
            en: "When the listener has finished, the browser checks: the default action was cancelled — the page stays, with the new row."
        - from: code
          to: browser
          label: "removeEventListener(\"submit\", (e) => onSubmit(e))"
          note:
            uk: "Нова стрілка — інший об’єкт. Нічого не знято."
            en: "A new arrow is another object. Nothing is removed."
          caption:
            uk: "Пізніше цю частину сторінки закривають. Нова стрілкова функція — навіть з тим самим кодом — це **інший** об’єкт: браузер не знаходить такого слухача, і старий працює далі."
            en: "Later this part of the page is closed. A new arrow function — even with the same code — is **another** object: the browser finds no such listener, and the old one keeps working."
        - from: code
          to: browser
          label: "removeEventListener(\"submit\", onSubmit)"
          caption:
            uk: "Зняти можна лише **ту саму** функцію, яку додали. `onSubmit` — той самий об’єкт, тож тепер слухача знято."
            en: "Only **the same** function that was added can be removed. `onSubmit` is that very object, so now the listener is removed."

  - id: cleanup
    kind: explanation
    title:
      uk: "Прибирати за собою"
      en: "Cleaning up after yourself"
    body:
      uk: |
        Слухач працює, доки його не зняли. Тому два правила:

        - **Не додавай того самого слухача двічі.** Якщо код налаштування запускається знову й щоразу створює нову стрілкову функцію, кожна подія оброблятиметься двічі, тричі… Ту саму функцію браузер удруге не додасть.
        - **Знімай слухача, коли його частина інтерфейсу зникає.** Для цього [[listener-cleanup|прибирання]] потрібен той самий об’єкт функції, тож тримай його в назві:

        ```js
        function onKey(event) {
          console.log(event.key);
        }
        document.addEventListener("keydown", onKey);
        // пізніше, коли ця частина сторінки закривається:
        document.removeEventListener("keydown", onKey);
        ```
      en: |
        A listener works until it is removed. Hence two rules:

        - **Do not add the same listener twice.** If setup code runs again and creates a new arrow function each time, every event is handled twice, three times… The browser does not add the same function a second time.
        - **Remove a listener when its part of the interface goes away.** This [[listener-cleanup|cleanup]] needs the same function object, so keep it under a name:

        ```js
        function onKey(event) {
          console.log(event.key);
        }
        document.addEventListener("keydown", onKey);
        // later, when this part of the page is closed:
        document.removeEventListener("keydown", onKey);
        ```

  - id: expense-events
    kind: example
    runtime: browser-js
    dir: expense-events
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер витрат", en: "Expense tracker" }
      labelLabel: { uk: "Назва", en: "Label" }
      amountLabel: { uk: "Сума, грн", en: "Amount, UAH" }
      add: { uk: "Додати", en: "Add" }
      submitted: { uk: "Надіслано:", en: "Submitted:" }
      currency: { uk: "грн", en: "UAH" }
    title:
      uk: "Форма, що не перезавантажується"
      en: "A form that does not reload"
    body:
      uk: |
        Форма витрат має слухача `submit`. Запусти, введи назву й суму і надішли форму — спершу клавішею Enter, потім кнопкою. Стеж за сторінкою й за вкладкою **Консоль**.
      en: |
        The expense form has a `submit` listener. Run it, type a label and an amount and submit the form — first with Enter, then with the button. Watch the page and the **Console** tab.
    tryIt:
      uk: |
        1. Кожне надсилання дає один рядок у консолі й один новий рядок у списку — і для Enter, і для кнопки.
        2. Видали рядок коду `event.preventDefault();` і надішли форму: у консолі з’явиться повідомлення, що форма надіслалась би, а сторінка перезавантажилася б. У звичайному браузері новий рядок зник би разом зі сторінкою. Поверни рядок коду.
        3. Допиши ще один виклик `setup();` у кінець файлу й надішли форму: тепер кожне надсилання дає два рядки в консолі й два в списку — слухають дві різні стрілкові функції. Заміни в `setup` стрілку на саму функцію: `form.addEventListener("submit", onSubmit);` — і знову один рядок: ту саму функцію браузер удруге не додає.
        4. Додай у кінець `form.removeEventListener("submit", onSubmit);` і надішли форму: слухача знято, тож у консолі лише повідомлення про перезавантаження. Прибери цей рядок коду.
      en: |
        1. Every submission gives one line in the console and one new row in the list — for Enter and for the button alike.
        2. Delete the line of code `event.preventDefault();` and submit the form: the console reports that the form would be sent and the page reloaded. In an ordinary browser the new row would vanish together with the page. Put the line of code back.
        3. Add one more `setup();` call at the end of the file and submit: now every submission gives two console lines and two rows — two different arrow functions are listening. In `setup`, replace the arrow with the function itself: `form.addEventListener("submit", onSubmit);` — and you get one line again: the browser does not add the same function twice.
        4. Add `form.removeEventListener("submit", onSubmit);` at the end and submit: the listener is removed, so the console shows only the note about the reload. Remove that line of code.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: функції як значення"
      en: "Recall: functions as values"
    items:
      - id: who-calls-callback
        from: js-03-06-higher-order-callbacks
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          function forBoth(callback) {
            callback("A");
            callback("B");
          }
          console.log("start");
          forBoth((letter) => console.log(letter));
          console.log("end");
        verify:
          logs: ["start", "A", "B", "end"]
        answer:
          type: order
          items:
            - { id: start, code: "start" }
            - { id: a, code: "A" }
            - { id: b, code: "B" }
            - { id: end, code: "end" }
        explanation:
          uk: "Стрілкова функція виконується не там, де її написано, а тоді, коли її викликає `forBoth`, — двічі, з `\"A\"` і `\"B\"`. Слухач події — теж такий callback, тільки викликає його браузер, коли подія стається."
          en: "The arrow function does not run where it is written but when `forBoth` calls it — twice, with `\"A\"` and `\"B\"`. An event listener is a callback like that too, only the browser calls it when the event happens."
      - id: same-function
        from: js-04-07-reference-identity
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const a = () => 1;
          const b = () => 1;
          const c = a;
          console.log(a === b, a === c);
        verify:
          logs: ["false true"]
        answer:
          type: choice
          options:
            - id: right
              code: "false true"
            - id: same-code
              code: "true true"
              why:
                uk: "Однаковий код не робить функції однією: кожен вираз `() => 1` створює новий об’єкт функції."
                en: "The same code does not make functions one: every `() => 1` expression creates a new function object."
            - id: copy
              code: "false false"
              why:
                uk: "`const c = a` не копіює функцію, а дає ще одну назву тому самому об’єкту."
                en: "`const c = a` does not copy the function; it gives the same object one more name."
            - id: reversed
              code: "true false"
              why:
                uk: "`===` для функцій, як і для об’єктів, порівнює, чи це той самий об’єкт, а не однаковість коду."
                en: "For functions, as for objects, `===` checks whether it is the same object, not whether the code is equal."
          correct: [right]
        explanation:
          uk: "Функції — об’єкти, і `===` перевіряє тотожність посилань. Тому `removeEventListener` знімає слухача лише тоді, коли отримує той самий об’єкт функції, що й `addEventListener`."
          en: "Functions are objects, and `===` checks reference identity. That is why `removeEventListener` removes a listener only when it gets the same function object that `addEventListener` got."

  - id: expense-submit
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: expense-submit
    entry: index.html
    editable: [index.js]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Нова витрата", en: "A new expense" }
      labelLabel: { uk: "Назва", en: "Label" }
      amountLabel: { uk: "Сума, грн", en: "Amount, UAH" }
      categoryLabel: { uk: "Категорія", en: "Category" }
      food: { uk: "Їжа", en: "Food" }
      transport: { uk: "Транспорт", en: "Transport" }
      home: { uk: "Дім", en: "Home" }
      fun: { uk: "Розваги", en: "Fun" }
      add: { uk: "Додати", en: "Add" }
      currency: { uk: "грн", en: "UAH" }
      required: { uk: "Заповни це поле.", en: "Fill in this field." }
      notNumber: { uk: "Введи число.", en: "Enter a number." }
      notPositive: { uk: "Сума має бути більшою за нуль.", en: "The amount must be greater than zero." }
      lunch: { uk: "Обід", en: "Lunch" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
    title:
      uk: "Обробник надсилання форми"
      en: "A form submit handler"
    instructions:
      uk: |
        Форма нової витрати вже має підписи, абзаци для повідомлень під полями й готові функції `validate` і `addExpense`. Атрибут `novalidate` у формі вимикає власні підказки браузера, щоб показувати повідомлення `validate`. Допиши в кінець `index.js` обробку надсилання:

        1. Форма не має надсилатися й перезавантажувати сторінку — ні за кліком на кнопку, ні за Enter у полі.
        2. Прочитай назву, суму й категорію та передай їх у `validate`.
        3. Покажи текст кожної помилки (з об’єкта `MESSAGES`) в абзаці під її полем — `#label-error` чи `#amount-error`, а абзаци полів без помилки очисти.
        4. Якщо витрата правильна, додай її через `addExpense` і очисти форму викликом `form.reset()`.
      en: |
        The new-expense form already has labels, paragraphs for messages under the fields and the ready-made functions `validate` and `addExpense`. The `novalidate` attribute on the form switches off the browser’s own hints so that the messages of `validate` can be shown. Add the submit handling at the end of `index.js`:

        1. The form must not be sent and must not reload the page — neither on a button click nor on Enter in a field.
        2. Read the label, the amount and the category and pass them to `validate`.
        3. Show the text of every error (from the `MESSAGES` object) in the paragraph under its field — `#label-error` or `#amount-error` — and empty the paragraphs of fields without an error.
        4. If the expense is valid, add it with `addExpense` and clear the form by calling `form.reset()`.
    testTitles:
      "submitting the form does not reload the page":
        uk: "Надсилання форми не перезавантажує сторінку"
        en: "Submitting the form does not reload the page"
      "an empty label shows its message next to the label field":
        uk: "Порожня назва — повідомлення під полем назви"
        en: "An empty label shows its message under the label field"
      "a zero amount shows its message next to the amount field":
        uk: "Нульова сума — повідомлення під полем суми"
        en: "A zero amount shows its message under the amount field"
      "a valid expense is added once and the messages are cleared":
        uk: "Правильна витрата додається один раз, а повідомлення зникають"
        en: "A valid expense is added once, and the messages disappear"
      "pressing Enter in a field submits through the same listener":
        uk: "Enter у полі надсилає форму через того самого слухача"
        en: "Enter in a field submits the form through the same listener"
    hints:
      nudge:
        uk: "На якому елементі й на яку подію треба слухати, щоб спіймати і клік, і Enter? І що в слухачі скасовує типову дію?"
        en: "On which element and for which event must you listen to catch both the click and Enter? And what in the listener cancels the default action?"
      explanation:
        uk: "Слухай подію `submit` на самій формі — як форма пошуку в поясненні, де перший рядок коду слухача скасовує типову дію. Поле читають через `form.elements.<name>.value`. Результат `validate` має `ok`; якщо `ok` хибне, в `errors` лежать ключі на кшталт `\"required\"`, а `MESSAGES[key]` дає текст. Пройди циклом по `[\"label\", \"amount\"]` і для кожного поля запиши в його абзац або текст помилки, або порожній рядок."
        en: "Listen for the `submit` event on the form itself — like the search form in the explanation, where the first line of the listener cancels the default action. A field is read with `form.elements.<name>.value`. The result of `validate` has `ok`; when `ok` is false, `errors` holds keys such as `\"required\"`, and `MESSAGES[key]` gives the text. Loop over `[\"label\", \"amount\"]` and, for each field, write either the error text or an empty string into its paragraph."
    solutionNote:
      uk: "Слухач `submit` на формі спрацьовує і для кліку, і для Enter, а `event.preventDefault()` скасовує перезавантаження. Повідомлення ставляться біля своїх полів і очищаються, щойно поле стає правильним, — інакше стара помилка висіла б і після виправлення. Слухача додано один раз, тож одна подія — одна витрата."
      en: "The `submit` listener on the form runs for both the click and Enter, and `event.preventDefault()` cancels the reload. The messages appear next to their fields and are cleared as soon as a field becomes valid — otherwise an old error would stay after the fix. The listener is added once, so one event means one expense."
    feedback:
      - when: { test: "submitting the form does not reload the page" }
        message:
          uk: "Ця перевірка надсилає форму й чекає, що під час події `submit` типову дію скасовано. Слухач `click` на кнопці тут не допоможе: перевірка надсилає форму без кліку."
          en: "This check submits the form and expects the default action to be cancelled during the `submit` event. A `click` listener on the button does not help here: the check submits the form without a click."
      - when: { test: "an empty label shows its message next to the label field" }
        message:
          uk: "Ця перевірка надсилає форму з порожньою назвою й правильною сумою і чекає в `#label-error` текст для ключа `required`, а `#amount-error` — порожнім."
          en: "This check submits the form with an empty label and a valid amount and expects the text for the `required` key in `#label-error` and an empty `#amount-error`."
      - when: { test: "a zero amount shows its message next to the amount field" }
        message:
          uk: "Ця перевірка надсилає правильну назву із сумою `0` і чекає в `#amount-error` текст для ключа `not-positive`, а `#label-error` — порожнім. Якщо там лишилося старе повідомлення, абзаци полів без помилки не очищаються."
          en: "This check submits a valid label with the amount `0` and expects the text for the `not-positive` key in `#amount-error` and an empty `#label-error`. If an old message is still there, the paragraphs of fields without an error are not emptied."
      - when: { test: "a valid expense is added once and the messages are cleared" }
        message:
          uk: "Ця перевірка спершу надсилає порожню форму, а потім правильну витрату й чекає рівно один новий рядок у списку та порожні абзаци повідомлень. Якщо рядків два, одне надсилання обробили два слухачі."
          en: "This check first submits an empty form, then a valid expense, and expects exactly one new row in the list and empty message paragraphs. If there are two rows, two listeners handled one submission."
      - when: { test: "pressing Enter in a field submits through the same listener" }
        message:
          uk: "Ця перевірка імітує Enter у полі суми: надсилає форму без кліку по кнопці — і чекає рівно один новий рядок у списку. Слухач `submit` на формі ловить кожне надсилання, а слухач `click` на кнопці цього надсилання не почує."
          en: "This check imitates Enter in the amount field: it submits the form without a click on the button — and expects exactly one new row in the list. A `submit` listener on the form catches every submission, while a `click` listener on the button never hears this one."

  - id: to-project
    kind: transfer
    capstoneStep: JS-06
    body:
      uk: "Форма твого проєкту отримає слухача `submit`: він скасує перезавантаження, прочитає поля, викличе твою функцію `validate` і покаже її повідомлення біля полів. Слухача додавай один раз, а знімай тією самою функцією, коли форма зникає."
      en: "Your project’s form gets a `submit` listener: it cancels the reload, reads the fields, calls your `validate` function and shows its messages next to the fields. Add the listener once, and remove it with the same function when the form goes away."
