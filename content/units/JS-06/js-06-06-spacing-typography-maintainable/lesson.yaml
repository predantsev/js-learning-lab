id: js-06-06-spacing-typography-maintainable
unit: JS-06
title:
  uk: "Відступи, типографіка й підтримувані стилі"
  en: "Spacing, typography and maintainable styles"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Визначити невелику шкалу відступів і шкалу шрифтів як користувацькі властивості в `rem` і послідовно їх застосувати."
    en: "Define a small spacing scale and type scale as custom properties in rem and apply them consistently."
  - uk: "Перебудувати файл стилів так, щоб зміна одного токена оновлювала кожне місце, де він використаний."
    en: "Restructure a stylesheet so that changing one token updates every place that uses it."
prerequisites: [js-06-05-flexbox-grid, js-06-03-cascade-specificity]
subskills:
  - { family: W-02, skill: "spacing/typography", depth: intro }
  - { family: W-02, skill: "maintainable styles", depth: intro }
glossary: [custom-property, design-token, rem-unit, type-scale]
selfCheck: [token-scope, expense-tokens]

blocks:
  - id: magic-numbers
    kind: explanation
    title:
      uk: "Числа без назви й токени з назвою"
      en: "Numbers without names and tokens with names"
    body:
      uk: |
        Типовий файл стилів: `16px` у дванадцяти місцях, `#2b6cb0` — у п’яти. Такі числа без назви називають «магічними»: незрозуміло, чому саме 16 і де ще воно мусить збігатися. Сьогодні сторінка виглядає добре, але щоб збільшити відступи, доведеться знайти всі 16 — і не зачепити ті, що означають щось інше.

        CSS дозволяє назвати значення один раз — [[custom-property|користувацькою властивістю]] (custom property):

        ```css
        :root {
          --gap-m: 1rem;
          --brand: #2b6cb0;
        }
        .panel { padding: var(--gap-m); }
        .link { color: var(--brand); }
        ```

        - Назва починається з двох дефісів: `--gap-m`.
        - `:root` вибирає корінь сторінки — елемент `<html>`, тож значення видно всюди.
        - `var(--gap-m)` підставляє значення туди, де воно потрібне.

        Такі іменовані рішення дизайну — відступи, розміри шрифту, кольори, заокруглення — називають [[design-token|дизайн-токенами]]. Не лише кольори.
      en: |
        A typical stylesheet: `16px` in twelve places, `#2b6cb0` in five. Such unnamed numbers are called “magic”: it is unclear why exactly 16 and where else it has to match. The page looks fine today, but to enlarge the spacing you have to find every 16 — without touching the ones that mean something else.

        CSS lets you name a value once — with a [[custom-property]]:

        ```css
        :root {
          --gap-m: 1rem;
          --brand: #2b6cb0;
        }
        .panel { padding: var(--gap-m); }
        .link { color: var(--brand); }
        ```

        - The name starts with two hyphens: `--gap-m`.
        - `:root` selects the root of the page — the `<html>` element — so the value is visible everywhere.
        - `var(--gap-m)` substitutes the value wherever it is needed.

        Such named design decisions — spacing, font sizes, colors, corner radii — are called [[design-token|design tokens]]. Not only colors.

  - id: token-scope
    kind: prediction
    lang: css
    runnable: false
    prompt:
      uk: |
        На сторінці бажань дві картки й підсумок: `<article class="card featured">` із заголовком `<h2>` усередині, `<article class="card">` і `<p class="summary">`. Стилі такі:

        ```css
        :root { --space-2: 8px; }
        .card { padding: var(--space-2); }
        .card h2 { margin-bottom: var(--space-2); }
        .summary { gap: var(--space-2); }
        .featured { --space-2: 24px; }
        ```

        Які відступи стануть 24px? Познач усі.
      en: |
        A wishlist page has two cards and a summary: `<article class="card featured">` with an `<h2>` heading inside, `<article class="card">` and `<p class="summary">`. The styles are:

        ```css
        :root { --space-2: 8px; }
        .card { padding: var(--space-2); }
        .card h2 { margin-bottom: var(--space-2); }
        .summary { gap: var(--space-2); }
        .featured { --space-2: 24px; }
        ```

        Which spacings become 24px? Mark all of them.
    answer:
      type: multi
      options:
        - id: featured-padding
          text:
            uk: "Внутрішній відступ картки з класом `featured`"
            en: "The padding of the card with the class `featured`"
        - id: featured-heading
          text:
            uk: "Відступ під заголовком усередині цієї картки"
            en: "The margin under the heading inside that card"
        - id: other-card
          text:
            uk: "Внутрішній відступ другої картки"
            en: "The padding of the second card"
          why:
            uk: "Нове значення діє лише на `.featured` і на все всередині неї. Друга картка й далі бачить 8px із `:root`."
            en: "The new value applies only to `.featured` and everything inside it. The second card still sees 8px from `:root`."
        - id: summary
          text:
            uk: "Проміжок у підсумку `.summary`"
            en: "The gap in the `.summary`"
          why:
            uk: "Підсумок не лежить усередині `.featured`, тож його `var(--space-2)` і далі бере 8px із `:root`."
            en: "The summary is not inside `.featured`, so its `var(--space-2)` still takes 8px from `:root`."
      correct: [featured-padding, featured-heading]
    explanation:
      uk: "Користувацькі властивості успадковуються, як `color`: значення йде від елемента, де його задано, до всіх його нащадків. `:root` — вершина сторінки, тож значення звідти доходить усюди: зміниш його там — і зміняться всі три відступи разом. Значення на `.featured` діє лише на цю картку й те, що в ній."
      en: "Custom properties are inherited, like `color`: the value travels from the element where it is set down to all its descendants. `:root` is the top of the page, so a value there reaches everything: change it there, and all three spacings change together. A value on `.featured` covers only that card and what is inside it."

  - id: rem-and-scales
    kind: explanation
    title:
      uk: "rem і шкали замість випадкових чисел"
      en: "rem and scales instead of random numbers"
    body:
      uk: |
        Розміри шрифтів і відступів зручно задавати в [[rem-unit|rem]]: `1rem` дорівнює розміру шрифту кореня сторінки — типово 16px. Людина, якій важко читати, може збільшити базовий шрифт у налаштуваннях браузера, і все в `rem` збільшиться разом із ним. Розміри в `px` лишаться дрібними.

        Токенів має бути небагато — шкала з кількох кроків, а не нове число щоразу:

        | Шкала | Кроки | Приблизно |
        |---|---|---|
        | відступи | `0.5rem`, `1rem`, `1.5rem` | 8, 16, 24px |
        | шрифти | `0.875rem`, `1rem`, `1.5rem`, `2rem` | 14, 16, 24, 32px |

        Шкалу розмірів шрифту називають [[type-scale|шкалою шрифтів]]. Для тексту ще задають `line-height` — висоту рядка тексту. Число без одиниць, наприклад `1.5`, означає «у півтора раза більше за розмір шрифту», тож висота рядків росте разом зі шрифтом.
      en: |
        Font sizes and spacing are best set in [[rem-unit|rem]]: `1rem` equals the font size of the page root — 16px by default. A person who finds reading hard can raise the base font size in the browser settings, and everything in `rem` grows with it. Sizes in `px` stay small.

        There should be few tokens — a scale of a few steps, not a new number every time:

        | Scale | Steps | Roughly |
        |---|---|---|
        | spacing | `0.5rem`, `1rem`, `1.5rem` | 8, 16, 24px |
        | font sizes | `0.875rem`, `1rem`, `1.5rem`, `2rem` | 14, 16, 24, 32px |

        A scale of font sizes is called a [[type-scale]]. Text also gets a `line-height` — the height of a line of text. A number without units, such as `1.5`, means “one and a half times the font size”, so the line height grows with the font.

  - id: wish-tokens
    kind: example
    runtime: browser-js
    dir: wish-tokens
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Список бажань", en: "Wishlist" }
      lead: { uk: "Речі, які хочеться отримати.", en: "Things I would like to have." }
      wish1: { uk: "Навушники", en: "Headphones" }
      wish2: { uk: "Настільна лампа", en: "Desk lamp" }
      currency: { uk: "грн", en: "UAH" }
      tech: { uk: "Техніка", en: "Tech" }
      home: { uk: "Дім", en: "Home" }
    title:
      uk: "Сторінка на токенах"
      en: "A page built on tokens"
    body:
      uk: |
        Усі розміри й кольори цієї сторінки названо один раз — у правилі `:root` на початку `styles.css`. Решта правил лише посилаються на токени через `var()`. Запусти й змінюй самі токени.
      en: |
        Every size and color of this page is named once — in the `:root` rule at the top of `styles.css`. All other rules only refer to the tokens with `var()`. Run it and change the tokens themselves.
    tryIt:
      uk: |
        1. Зміни в `:root` значення `font-size: 100%` на `125%` і запусти: заголовки, текст і навіть відступи в `rem` виросли разом.
        2. Зміни `--line-height` з `1.5` на `1.8`: рядки тексту розступилися по всій сторінці.
        3. Зміни `--space-2` на `2rem`: змінилися і проміжок між картками, і відступи всередині них.
        4. Зміни `--color-accent` — ціни перефарбуються в обох картках.
      en: |
        1. In `:root`, change `font-size: 100%` to `125%` and run: headings, text and even the spacing in `rem` grew together.
        2. Change `--line-height` from `1.5` to `1.8`: the lines of text spread apart across the whole page.
        3. Change `--space-2` to `2rem`: both the gap between the cards and the spacing inside them changed.
        4. Change `--color-accent` — the prices in both cards change color.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: назва для значення"
      en: "Recall: a name for a value"
    items:
      - id: const-reassign
        from: js-02-01-const-let
        prompt:
          uk: "Цей код намагається змінити відступ, названий через `const`. Що станеться під час запуску?"
          en: "This code tries to change a spacing named with `const`. What happens when it runs?"
        code: |
          const space = 8;
          space = 16;
          console.log(space);
        verify:
          logs: []
          error: TypeError
        answer:
          type: choice
          options:
            - id: error
              text:
                uk: "Помилка `TypeError`: назві з `const` не можна присвоїти нове значення"
                en: "A `TypeError`: a name declared with `const` cannot be given a new value"
            - id: new-value
              code: "16"
              why:
                uk: "Так було б із `let`. `const` прив’язує назву до значення назавжди."
                en: "That would happen with `let`. `const` binds the name to its value for good."
            - id: old-value
              code: "8"
              why:
                uk: "JavaScript не пропускає невдале присвоєння мовчки: він зупиняється з помилкою, і до `console.log` справа не доходить."
                en: "JavaScript does not skip the failed assignment silently: it stops with an error, and `console.log` is never reached."
            - id: undefined
              code: "undefined"
              why:
                uk: "Значення `8` нікуди не зникло — просто назві `space` не можна дати нове."
                en: "The value `8` did not vanish — the name `space` just cannot get a new one."
          correct: [error]
        explanation:
          uk: "`const` називає значення один раз, і ця назва не може вказувати на інше значення — присвоєння кидає `TypeError`. Користувацька властивість CSS поводиться інакше: будь-яке правило може дати тій самій назві нове значення для свого елемента й усього, що в ньому, — наприклад, `.featured { --space-2: 24px; }`."
          en: "`const` names a value once, and the name cannot point to another value — the assignment throws a `TypeError`. A CSS custom property behaves differently: any rule can give the same name a new value for its element and everything inside it — for example, `.featured { --space-2: 24px; }`."

  - id: expense-tokens
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: expense-tokens
    entry: index.html
    editable: [styles.css]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер витрат", en: "Expense tracker" }
      total: { uk: "Разом:", en: "Total:" }
      currency: { uk: "грн", en: "UAH" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      food: { uk: "Їжа", en: "Food" }
      transport: { uk: "Транспорт", en: "Transport" }
      note: { uk: "Суми — у гривнях, за 1 березня.", en: "Amounts in hryvnias, for March 1." }
    title:
      uk: "Токени для трекера витрат"
      en: "Tokens for the expense tracker"
    instructions:
      uk: |
        Файл стилів трекера витрат повен повторюваних чисел і кольорів. Заміни їх токенами — пиши лише в `styles.css`.

        1. У правилі `:root` визнач дев’ять токенів:

           | Токени | Значення | Замінюють |
           |---|---|---|
           | `--space-1`, `--space-2`, `--space-3` | `0.5rem`, `1rem`, `1.5rem` | відступи 8, 16, 24px |
           | `--text-sm`, `--text-base`, `--text-lg`, `--text-xl` | `0.875rem`, `1rem`, `1.5rem`, `2rem` | шрифти 14, 16, 24, 32px |
           | `--color-accent`, `--color-muted` | `#2b6cb0`, `#4a5568` | ті самі кольори |

        2. У правилах нижче заміни кожен такий відступ, розмір шрифту й колір на `var()` з відповідним токеном. Рамки (`border`, `border-radius`) і `line-height` залиш як є.

        Перевірка змінюватиме токени й розмір шрифту кореня та дивитиметься, чи змінюються всі місця, які мають змінитися.
      en: |
        The expense tracker’s stylesheet is full of repeated numbers and colors. Replace them with tokens — write only in `styles.css`.

        1. In the `:root` rule, define nine tokens:

           | Tokens | Values | Replace |
           |---|---|---|
           | `--space-1`, `--space-2`, `--space-3` | `0.5rem`, `1rem`, `1.5rem` | spacing of 8, 16, 24px |
           | `--text-sm`, `--text-base`, `--text-lg`, `--text-xl` | `0.875rem`, `1rem`, `1.5rem`, `2rem` | font sizes of 14, 16, 24, 32px |
           | `--color-accent`, `--color-muted` | `#2b6cb0`, `#4a5568` | the same colors |

        2. In the rules below, replace every such spacing, font size and color with `var()` and the matching token. Leave the borders (`border`, `border-radius`) and `line-height` as they are.

        The check will change the tokens and the root font size and see whether every place that should change does.
    testTitles:
      "all nine tokens are defined on :root":
        uk: "Усі дев’ять токенів визначено в :root"
        en: "All nine tokens are defined on :root"
      "every spacing comes from a space token":
        uk: "Кожен відступ бере значення з токена --space"
        en: "Every spacing takes its value from a --space token"
      "accent and muted colors come from the color tokens":
        uk: "Кольори беруться з токенів --color"
        en: "The colors come from the --color tokens"
      "font sizes come from the text tokens":
        uk: "Розміри шрифтів беруться з токенів --text"
        en: "The font sizes come from the --text tokens"
      "the type scale follows the root font size":
        uk: "Шкала шрифтів росте разом зі шрифтом кореня"
        en: "The type scale grows with the root font size"
    hints:
      nudge:
        uk: "Почни з `:root`: впиши туди всі дев’ять токенів. Потім іди правилами згори донизу й шукай 8, 16, 24, 14, 32 і два кольори."
        en: "Start with `:root`: write all nine tokens there. Then go through the rules from top to bottom and look for 8, 16, 24, 14, 32 and the two colors."
      explanation:
        uk: "Токен визначають у `:root`, як звичайне оголошення: `--line-thin: 1px;`. Використовують через `var()` будь-де, де стояло б значення, — і в скороченнях теж, по кілька в одному оголошенні: `padding: var(--space-1) var(--space-2);`. Якщо котрийсь відступ не змінюється разом з токеном, у ньому лишилося старе число."
        en: "A token is defined in `:root` like an ordinary declaration: `--line-thin: 1px;`. It is used through `var()` anywhere a value would stand — in shorthands too, several in one declaration: `padding: var(--space-1) var(--space-2);`. If some spacing does not change with its token, an old number is still sitting in it."
    solutionNote:
      uk: "Тепер кожне рішення дизайну записане один раз. Щоб збільшити всі звичайні відступи, досить змінити `--space-2`; щоб змінити фірмовий колір — `--color-accent`. А шрифти в `rem` ростуть разом із розміром шрифту, який обрала людина."
      en: "Now every design decision is written once. To enlarge all regular spacing, it is enough to change `--space-2`; to change the brand color, `--color-accent`. And the font sizes in `rem` grow with the font size the person chose."
    feedback:
      - when: { test: "all nine tokens are defined on :root" }
        message:
          uk: "Визнач усі дев’ять токенів саме в правилі `:root`. Токен, визначений на `main` чи іншому елементі, не дійде до елементів поза ним — наприклад, до `header`."
          en: "Define all nine tokens in the `:root` rule itself. A token defined on `main` or another element does not reach elements outside it — the `header`, for example."
      - when: { test: "every spacing comes from a space token" }
        message:
          uk: "Коли змінюється токен `--space-…`, деякі відступи лишаються такими самими — у них досі стоїть число. Знайди 8, 16 і 24px у `padding`, `margin` і `gap` та заміни їх на `var()`."
          en: "When a `--space-…` token changes, some spacings stay the same — they still hold a number. Find the 8, 16 and 24px in `padding`, `margin` and `gap` and replace them with `var()`."
      - when: { test: "accent and muted colors come from the color tokens" }
        message:
          uk: "Деякі кольори не змінюються разом із `--color-accent` чи `--color-muted`. Шукай `#2b6cb0` і `#4a5568` у `color` і `background`."
          en: "Some colors do not change with `--color-accent` or `--color-muted`. Look for `#2b6cb0` and `#4a5568` in `color` and `background`."
      - when: { test: "font sizes come from the text tokens" }
        message:
          uk: "Деякі розміри шрифту не змінюються разом із токенами `--text-…`. Не забудь `body`: його 16px — це `--text-base`."
          en: "Some font sizes do not change with the `--text-…` tokens. Do not forget `body`: its 16px is `--text-base`."
      - when: { test: "the type scale follows the root font size" }
        message:
          uk: "Розміри шрифту не ростуть разом зі шрифтом кореня. Значення токенів `--text-…` мають бути в `rem`, а не в `px`."
          en: "The font sizes do not grow with the root font size. The values of the `--text-…` tokens must be in `rem`, not `px`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-06
    body:
      uk: "Заведи у своєму проєкті ті самі шкали: кілька відступів, кілька розмірів шрифту в `rem` і кольори — як токени в `:root`. Коли картки й форма використовуватимуть лише їх, зміна вигляду всього проєкту займе один рядок коду."
      en: "Set up the same scales in your project: a few spacings, a few font sizes in `rem` and the colors — as tokens in `:root`. When the cards and the form use only them, changing the look of the whole project takes one line of code."
