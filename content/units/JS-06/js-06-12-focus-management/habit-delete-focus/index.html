<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <style>
      body { font-family: system-ui, sans-serif; }
      #habits { list-style: none; padding: 0; display: grid; gap: 0.5rem; max-width: 26rem; }
      #habits li { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.75rem; border: 1px solid #a0aec0; border-radius: 8px; }
      button { font: inherit; }
      :focus-visible { outline: 3px solid #2c5282; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1 tabindex="-1">%%title%%</h1>
      <ul id="habits"></ul>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
