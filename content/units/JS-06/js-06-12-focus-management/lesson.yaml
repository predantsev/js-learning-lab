id: js-06-12-focus-management
unit: JS-06
title:
  uk: "Зберігаємо фокус, коли інтерфейс перемальовується"
  en: "Keeping focus when the UI re-renders"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити, куди дінеться фокус, коли елемент із фокусом видаляють або замінюють під час перебудови списку."
    en: "Predict where focus goes when the focused element is removed or replaced by a re-render."
  - uk: "Переводити фокус на доречний елемент після зміни DOM: на відредаговану картку, на наступний пункт після видалення або на перше поле з помилкою."
    en: "Move focus to a sensible element after the DOM changes: the edited card, the next item after a delete, or the first invalid field."
prerequisites: [js-06-11-bubbling-capture-delegation, js-06-02-keyboard-focus-landmarks, js-04-07-reference-identity]
subskills:
  - { family: W-03, skill: "focus management", depth: intro }
glossary: [focus-management, active-element]
selfCheck: [focus-after-removal, restore-focus]

blocks:
  - id: who-has-focus
    kind: explanation
    title:
      uk: "Хто зараз у фокусі"
      en: "Who has focus right now"
    body:
      uk: |
        [[keyboard-focus|Фокус]] — це елемент, який отримує натискання клавіш: Enter на кнопці з фокусом натискає саме її. Tab переводить фокус далі, а код — метод `element.focus()`.

        Який елемент у фокусі зараз, каже властивість [[active-element|`document.activeElement`]]. Коли жоден елемент фокусу не має, це `body`. А властивість `tagName` дає назву тегу елемента великими літерами:

        ```js
        // <button id="save">…</button>
        const save = document.querySelector("#save");
        save.focus();
        console.log(document.activeElement === save); // true
        console.log(document.activeElement.tagName);  // BUTTON
        ```

        Тепер питання. Що станеться з фокусом, коли код видалить кнопку, на якій він стоїть? А коли перебудує весь список — навіть із тих самих даних? Передбач, перш ніж читати далі.
      en: |
        [[keyboard-focus|Focus]] is the element that receives key presses: Enter on the focused button presses that very button. Tab moves focus on, and code moves it with the method `element.focus()`.

        The property [[active-element|`document.activeElement`]] tells which element has focus right now. When no element has focus, it is `body`. And the property `tagName` gives an element’s tag name in capital letters:

        ```js
        // <button id="save">…</button>
        const save = document.querySelector("#save");
        save.focus();
        console.log(document.activeElement === save); // true
        console.log(document.activeElement.tagName);  // BUTTON
        ```

        Now a question. What happens to focus when code removes the button it sits on? And when code rebuilds the whole list — even from the same data? Predict before reading on.

  - id: focus-after-removal
    kind: prediction
    strings:
      coffee: { uk: "Кава", en: "Coffee" }
      tickets: { uk: "Квитки в кіно", en: "Cinema tickets" }
    prompt:
      uk: "Перший `console.log` виводить `BUTTON`: фокус на кнопці останньої картки. Що виведуть два наступні?"
      en: "The first `console.log` prints `BUTTON`: focus is on the last card’s button. What do the next two print?"
    code: |
      // Setup: a list of two expenses, one button in each card.
      document.body.innerHTML = '<ul id="list"></ul>';
      const list = document.querySelector("#list");
      const expenses = ["%%coffee%%", "%%tickets%%"];
      function rebuild() {
        list.replaceChildren(); // removes every old card
        for (const name of expenses) {
          const item = document.createElement("li");
          const button = document.createElement("button");
          button.textContent = name;
          item.append(button);
          list.append(item);
        }
      }

      rebuild();
      const lastCard = list.querySelectorAll("li")[1]; // the second, last card
      lastCard.querySelector("button").focus();
      console.log(document.activeElement.tagName);
      lastCard.remove(); // the focused card is deleted
      console.log(document.activeElement.tagName);

      list.querySelector("button").focus();
      rebuild(); // the same expenses, built again
      console.log(document.activeElement.tagName);
    verify:
      logs: ["BUTTON", "BODY", "BODY"]
    answer:
      type: choice
      options:
        - id: body-body
          text:
            uk: "`BODY`, потім `BODY`"
            en: "`BODY`, then `BODY`"
        - id: button-button
          text:
            uk: "`BUTTON`, потім `BUTTON`"
            en: "`BUTTON`, then `BUTTON`"
          why:
            uk: "Браузер не переносить фокус ні на сусідню кнопку, ні на нову кнопку з тим самим текстом. Кнопка з фокусом пішла з документа — і фокус падає на `body`."
            en: "The browser moves focus neither to a neighbouring button nor to a new button with the same text. The focused button left the document — and focus falls back to `body`."
        - id: ul-ul
          text:
            uk: "`UL`, потім `UL`"
            en: "`UL`, then `UL`"
          why:
            uk: "Фокус не переходить до батька: список без `tabindex` фокусу взагалі не приймає. Він падає на `body`."
            en: "Focus does not move to the parent: a list without `tabindex` does not take focus at all. It falls back to `body`."
        - id: body-button
          text:
            uk: "`BODY`, потім `BUTTON`"
            en: "`BODY`, then `BUTTON`"
          why:
            uk: "Перебудова створила нові кнопки з тими самими текстами, але фокус на них ніхто не ставив. Стара кнопка, на якій він був, зникла разом зі старим списком."
            en: "The rebuild created new buttons with the same texts, but nobody put focus on them. The old button that had it disappeared with the old list."
      correct: [body-body]
    explanation:
      uk: "Коли елемент із фокусом зникає з документа, браузер не шукає йому заміни: `document.activeElement` стає `body`. Так буває і після `remove()`, і після перебудови: `replaceChildren()` прибирає старі кнопки, а нові — це вже інші елементи, хоч і з тим самим текстом."
      en: "When the focused element leaves the document, the browser does not look for a replacement: `document.activeElement` becomes `body`. That happens both after `remove()` and after a rebuild: `replaceChildren()` removes the old buttons, and the new ones are different elements, even with the same text."

  - id: lost-place
    kind: explanation
    title:
      uk: "Фокус не повертається сам"
      en: "Focus does not come back by itself"
    body:
      uk: |
        Перебудова з тих самих даних не рятує. Нова кнопка — **інший об’єкт** із тим самим текстом, як два однакові об’єкти в JavaScript ([[reference-identity|тотожність посилань]]). Браузер не знає, що для людини це «та сама» кнопка.

        Для людини з клавіатурою це не косметика, а втрачене місце на сторінці:

        - [[focus-indicator|Індикатора фокусу]] ніде немає, і Enter нічого не натискає.
        - Куди поведе наступний Tab, вирішує браузер. Chrome, наприклад, починає з першого пункту перебудованого списку: хто видаляв тридцяту звичку, знову йде від першої.
      en: |
        Rebuilding from the same data does not help. The new button is a **different object** with the same text, like two equal-looking objects in JavaScript ([[reference-identity]]). The browser does not know that for the person it is “the same” button.

        For a keyboard user this is not cosmetic but a lost place on the page:

        - There is no [[focus-indicator]] anywhere, and Enter presses nothing.
        - Where the next Tab leads is up to the browser. Chrome, for example, starts from the first item of the rebuilt list: someone who was deleting the thirtieth habit starts again from the first.

  - id: lost-and-restored
    kind: visual
    visual: sequence
    title:
      uk: "Як губиться фокус — і як його повернути"
      en: "How focus gets lost — and how to bring it back"
    textEquivalent:
      uk: >-
        Учасників двоє: твій код (слухач кліків і функція rebuildList) і сторінка — дерево DOM, яке знає, на якому елементі
        фокус (document.activeElement). Людина з клавіатурою стоїть на кнопці «Пауза» звички h-02 і натискає Enter, а браузер
        викликає слухача. Слухач змінює масив і викликає rebuildList: усі старі пункти й кнопки зникають із документа, на їхньому
        місці з’являються нові з тим самим текстом. Кнопка, на якій був фокус, пішла з документа, тож document.activeElement
        стає body — фокус загублено. Виправлений код перед перебудовою запам’ятовує, де був фокус, — текстом: data-id звички
        (h-02) і data-action кнопки (toggle). Після rebuildList фокус так само на body, але код знаходить у новому списку кнопку з
        тими самими data-id і data-action і викликає на ній focus(). Тепер document.activeElement — нова кнопка «Відновити» тієї
        самої звички, і людина продовжує з того самого місця. Якби звички вже не було, код поставив би фокус на запасний
        елемент — заголовок списку.
      en: >-
        There are two participants: your code (the click listener and the function rebuildList) and the page — the DOM tree,
        which knows which element has focus (document.activeElement). A keyboard user is on the “Pause” button of habit h-02
        and presses Enter, and the browser calls the listener. The listener changes the array and calls rebuildList: all old
        items and buttons leave the document, and new ones with the same text appear in their place. The button that had focus
        left the document, so document.activeElement becomes body — focus is lost. The fixed code remembers where focus was
        before the rebuild — as text: the habit’s data-id (h-02) and the button’s data-action (toggle). After rebuildList focus
        is on body again, but the code finds the button with the same data-id and data-action in the new list and calls focus()
        on it. Now document.activeElement is the new “Resume” button of the same habit, and the person continues from the same
        place. Had the habit been gone, the code would have put focus on a fallback element — the list heading.
    spec:
      actors:
        - { id: code, label: { uk: "Твій код", en: "Your code" } }
        - { id: page, label: { uk: "Сторінка (DOM)", en: "Page (DOM)" } }
      intro:
        uk: "Двоє учасників: твій код — слухач кліків і `rebuildList()` — і сторінка: дерево DOM разом із `document.activeElement`, елементом, на якому зараз фокус."
        en: "Two participants: your code — the click listener and `rebuildList()` — and the page: the DOM tree together with `document.activeElement`, the element that has focus right now."
      messages:
        - from: page
          to: code
          label: { uk: "click: «Пауза» звички h-02", en: "click: “Pause” of habit h-02" }
          caption:
            uk: "Людина з клавіатурою стоїть на кнопці «Пауза» звички h-02 і натискає Enter. Браузер викликає слухача кліків. Зараз `document.activeElement` — ця кнопка."
            en: "A keyboard user is on the “Pause” button of habit h-02 and presses Enter. The browser calls the click listener. Right now `document.activeElement` is that button."
        - from: code
          to: page
          label: "rebuildList()"
          note: { uk: "старі пункти зникають, з’являються нові", en: "old items go, new ones appear" }
          caption:
            uk: "Слухач змінює масив і перебудовує список: усі старі `<li>` і кнопки зникають із документа, а на їхньому місці з’являються нові — з тим самим текстом."
            en: "The listener changes the array and rebuilds the list: all old `<li>` and buttons leave the document, and new ones appear in their place — with the same text."
        - from: page
          to: code
          kind: return
          label: "activeElement: body"
          caption:
            uk: "Кнопка з фокусом пішла з документа, тож фокус падає на `body`. Нова кнопка цієї звички — інший об’єкт, і браузер не знає, що для людини це «та сама»."
            en: "The focused button left the document, so focus falls back to `body`. The habit’s new button is a different object, and the browser does not know that for the person it is “the same” one."
        - from: code
          to: code
          kind: note
          label: { uk: "Виправлено: спершу запам’ятати h-02 і toggle", en: "Fixed: first remember h-02 and toggle" }
          caption:
            uk: "Виправлений код **перед** перебудовою запам’ятовує, де був фокус, — текстом: `data-id` звички й `data-action` кнопки. Сам вузол запам’ятовувати марно: він зараз зникне."
            en: "The fixed code remembers where focus was **before** the rebuild — as text: the habit’s `data-id` and the button’s `data-action`. Remembering the node itself is pointless: it is about to disappear."
        - from: code
          to: page
          label: "rebuildList()"
          caption:
            uk: "Перебудова та сама: старі вузли зникають, і фокус знову на `body`."
            en: "The same rebuild: the old nodes disappear, and focus is on `body` again."
        - from: code
          to: page
          label: { uk: "focus() на новій кнопці h-02", en: "focus() on h-02’s new button" }
          caption:
            uk: "Код шукає в новому списку кнопку з тими самими `data-id` і `data-action` і викликає на ній `focus()`."
            en: "The code looks in the new list for the button with the same `data-id` and `data-action` and calls `focus()` on it."
        - from: page
          to: code
          kind: return
          label: { uk: "activeElement: «Відновити» h-02", en: "activeElement: “Resume” of h-02" }
          caption:
            uk: "Тепер `document.activeElement` — нова кнопка «Відновити» тієї самої звички: людина продовжує з того місця, де була. Якби звички вже не було, код поставив би фокус на запасний елемент — заголовок списку."
            en: "Now `document.activeElement` is the new “Resume” button of the same habit: the person continues where they were. Had the habit been gone, the code would have put focus on a fallback element — the list heading."

  - id: where-to-put-it
    kind: explanation
    title:
      uk: "Куди ставити фокус"
      en: "Where to put focus"
    body:
      uk: |
        Куди перевести фокус після зміни, вирішує твій код. Це [[focus-management|керування фокусом]]. Правило просте: туди, де людина продовжить роботу.

        | Що сталося | Куди фокус |
        |---|---|
        | Запис відредаговано, список перебудовано | на нову кнопку **того самого** запису |
        | Запис видалено | на кнопку наступного пункту; якщо видалено останній — попереднього; якщо список порожній — на заголовок списку |
        | Перевірка форми не пройшла | на перше поле з повідомленням про помилку |

        Порядок дій під час перебудови:

        1. **Перед** перебудовою запам’ятай, де був фокус, — даними, а не вузлом: `data-id` запису, номер пункту в списку. Старі вузли зараз зникнуть.
        2. Перебудуй список.
        3. Знайди в новому списку потрібний елемент і виклич на ньому `focus()`.
        4. Якщо такого елемента немає, візьми запасний. Заголовок із `tabindex="-1"` приймає фокус від коду, хоч у порядок Tab і не стає.

        Перенось фокус лише тоді, коли людина була саме тут. Якщо фокус був деінде — скажімо, людина друкує в полі форми, а список тим часом оновився, — не чіпай його.

        З формою ще простіше: поля нікуди не зникають, тож шукати нові вузли не треба:

        ```js
        const errors = validate(record);
        if (errors.name) {
          nameInput.focus();
        } else if (errors.price) {
          priceInput.focus();
        }
        ```
      en: |
        Where focus goes after a change is decided by your code. This is [[focus-management]]. The rule is simple: to where the person will carry on.

        | What happened | Where focus goes |
        |---|---|
        | A record was edited, the list rebuilt | to the new button of **the same** record |
        | A record was deleted | to the next item’s button; if the last one was deleted, the previous one’s; if the list is empty, the list heading |
        | The form check failed | to the first field with an error message |

        The order of steps around a rebuild:

        1. **Before** the rebuild, remember where focus was — as data, not as a node: the record’s `data-id`, the item’s position in the list. The old nodes are about to disappear.
        2. Rebuild the list.
        3. Find the element you need in the new list and call `focus()` on it.
        4. If there is no such element, take a fallback. A heading with `tabindex="-1"` takes focus from code, even though it does not join the Tab order.

        Move focus only when the person was right here. If focus was somewhere else — say, the person is typing in a form field while the list updates — leave it alone.

        A form is even simpler: the fields do not go anywhere, so there are no new nodes to look for:

        ```js
        const errors = validate(record);
        if (errors.name) {
          nameInput.focus();
        } else if (errors.price) {
          priceInput.focus();
        }
        ```

  - id: habit-delete-focus
    kind: example
    runtime: browser-js
    dir: habit-delete-focus
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер звичок", en: "Habit tracker" }
      habit1: { uk: "Ранкова зарядка", en: "Morning stretch" }
      habit2: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      habit3: { uk: "Пити воду", en: "Drink water" }
      habit4: { uk: "Прогулянка після обіду", en: "Walk after lunch" }
      delete: { uk: "Видалити", en: "Delete" }
      focusNow: { uk: "Фокус зараз:", en: "Focus now:" }
    title:
      uk: "Видалення з клавіатури"
      en: "Deleting with the keyboard"
    body:
      uk: |
        Кожна кнопка «Видалити» перебудовує список із масиву, а останній рядок коду в слухачі пише в консоль, на якому елементі фокус. Спробуй лише з клавіатурою.
      en: |
        Every “Delete” button rebuilds the list from the array, and the last line of code in the listener prints which element has focus. Try it with the keyboard only.
    tryIt:
      uk: |
        1. На вкладці **Сторінка** клацни по заголовку «Трекер звичок» — далі лише клавіатура. Натисни Tab двічі: фокус стане на «Видалити» другої звички. Натисни Enter. Консоль пише `BODY`: фокус зник разом зі старою кнопкою. Натисни Tab ще раз — у Chrome фокус опиниться на першій звичці, а не на наступній за видаленою.
        2. У слухачі одразу після рядка коду `rebuildList();` додай:

        ```js
        const buttons = list.querySelectorAll("button");
        const next = buttons[index] ?? buttons[index - 1] ?? document.querySelector("h1");
        next.focus();
        ```

        3. Запусти знову й видали другу звичку з клавіатури: консоль пише `BUTTON`, а фокус стоїть на «Видалити» наступної звички — тепер вона на тій самій позиції `index`.
        4. Тисни Enter далі, доки список не спорожніє: коли видалено останню звичку в списку, фокус переходить на попередню, а коли звичок не лишилося — на заголовок, і консоль пише `H1`.
      en: |
        1. On the **Page** tab click the heading “Habit tracker” — from now on, the keyboard only. Press Tab twice: focus lands on “Delete” of the second habit. Press Enter. The console prints `BODY`: focus disappeared with the old button. Press Tab once more — in Chrome focus lands on the first habit, not on the one after the deleted habit.
        2. In the listener, right after the line of code `rebuildList();`, add:

        ```js
        const buttons = list.querySelectorAll("button");
        const next = buttons[index] ?? buttons[index - 1] ?? document.querySelector("h1");
        next.focus();
        ```

        3. Run it again and delete the second habit with the keyboard: the console prints `BUTTON`, and focus is on “Delete” of the next habit — it is now at the same position `index`.
        4. Keep pressing Enter until the list is empty: when the last habit in the list is deleted, focus moves to the previous one, and when no habits are left — to the heading, and the console prints `H1`.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: однакові, але не ті самі"
      en: "Recall: equal-looking, but not the same"
    strings:
      pause: { uk: "Пауза", en: "Pause" }
    items:
      - id: new-node-new-object
        from: js-04-07-reference-identity
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const before = document.createElement("button");
          before.textContent = "%%pause%%";
          const after = document.createElement("button");
          after.textContent = "%%pause%%";
          console.log(before === after);
          console.log(before.textContent === after.textContent);
        verify:
          logs: ["false", "true"]
        answer:
          type: choice
          options:
            - id: false-true
              text:
                uk: "`false`, потім `true`"
                en: "`false`, then `true`"
            - id: true-true
              text:
                uk: "`true`, потім `true`"
                en: "`true`, then `true`"
              why:
                uk: "Для об’єктів `===` перевіряє, чи це той самий об’єкт, а не чи однаковий вміст. Кожен `createElement` створює новий."
                en: "For objects `===` checks whether it is the same object, not whether the contents are equal. Every `createElement` creates a new one."
            - id: false-false
              text:
                uk: "`false`, потім `false`"
                en: "`false`, then `false`"
              why:
                uk: "Тексти — примітиви, і `===` порівнює їх за значенням: однакові тексти рівні."
                en: "Texts are primitives, and `===` compares them by value: equal texts are equal."
          correct: [false-true]
        explanation:
          uk: "Кожен виклик `createElement` дає новий об’єкт, тож `before === after` — `false`, хоч кнопки виглядають однаково. Тексти — примітиви, вони рівні за значенням. Тому після перебудови нову кнопку знаходять за даними — текстом `data-id`, — а не тримаючи старий вузол."
          en: "Every call to `createElement` gives a new object, so `before === after` is `false`, even though the buttons look the same. Texts are primitives, equal by value. That is why after a rebuild the new button is found by data — the text of a `data-id` — rather than by holding on to the old node."

  - id: restore-focus
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: restore-focus
    entry: index.html
    editable: [index.js]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Мої звички", en: "My habits" }
      listTitle: { uk: "Список звичок", en: "Habit list" }
      habit1: { uk: "Медитація", en: "Meditation" }
      habit2: { uk: "Вивчати 10 слів", en: "Learn 10 words" }
      habit3: { uk: "Без телефона перед сном", en: "No phone before bed" }
      pause: { uk: "Пауза", en: "Pause" }
      resume: { uk: "Відновити", en: "Resume" }
      delete: { uk: "Видалити", en: "Delete" }
    title:
      uk: "Фокус лишається там, де людина працює"
      en: "Focus stays where the person works"
    instructions:
      uk: |
        Список звичок перебудовується після кожної дії: `rebuildList()` щоразу створює нові `<li>` і кнопки. Через це людина з клавіатурою після «Пауза» чи «Видалити» губить фокус. Слухач уже готовий: після кожної зміни він викликає `refresh()`.

        Допиши `refresh()`, щоб вона:

        1. Перед перебудовою запам’ятала, у якій звичці (`data-id`) і на якій кнопці (`data-action`) був фокус, — якщо він був у списку.
        2. Після перебудови поставила фокус на кнопку з тим самим `data-action` у новій картці тієї самої звички.
        3. Якщо цієї звички більше немає, поставила фокус на заголовок списку `#habits-title`.
        4. Якщо фокус був поза списком (як під час першого запуску), не чіпала його.
      en: |
        The habit list is rebuilt after every action: `rebuildList()` creates new `<li>` and buttons each time. Because of this, a keyboard user loses focus after “Pause” or “Delete”. The listener is ready: after every change it calls `refresh()`.

        Complete `refresh()` so that it:

        1. Before the rebuild, remembers in which habit (`data-id`) and on which button (`data-action`) focus was — if it was in the list.
        2. After the rebuild, puts focus on the button with the same `data-action` in the same habit’s new card.
        3. If that habit is gone, puts focus on the list heading `#habits-title`.
        4. If focus was outside the list (as on the first run), leaves it alone.
    testTitles:
      "pausing a habit keeps the focus on its new toggle button":
        uk: "Після «Пауза» фокус стоїть на новій кнопці тієї самої звички"
        en: "After Pause, focus is on the same habit’s new button"
      "deleting a habit moves the focus to the list heading":
        uk: "Після видалення звички фокус переходить на заголовок списку"
        en: "After a habit is deleted, focus moves to the list heading"
      "a refresh with the focus outside the list leaves the focus where it was":
        uk: "Якщо фокус був поза списком, refresh() його не переносить"
        en: "If focus was outside the list, refresh() does not move it"
    hints:
      nudge:
        uk: "Що варто запам’ятати перед перебудовою: саму кнопку — чи те, за чим нову кнопку можна знайти, коли старої вже не буде?"
        en: "What is worth remembering before the rebuild: the button itself — or something to find the new button by once the old one is gone?"
      explanation:
        uk: "Старий вузол після перебудови відірваний від документа, і `focus()` на ньому нічого не робить. Тексти ж переживають перебудову: `data-id` картки й `data-action` кнопки. Чи був фокус у списку, підкаже `closest`: від `body` чи від заголовка `document.activeElement.closest(\"li\")` дає `null`. Після перебудови склади з запам’ятованих текстів селектор — так само, як `[data-id=\"h-07\"] [data-action=\"delete\"]` знаходить кнопку видалення звички h-07. Якщо `querySelector` повернув `null`, звички вже немає — тоді потрібен запасний елемент."
        en: "After the rebuild the old node is detached from the document, and `focus()` on it does nothing. Texts survive the rebuild, though: the card’s `data-id` and the button’s `data-action`. `closest` tells whether focus was in the list: from `body` or from the heading, `document.activeElement.closest(\"li\")` gives `null`. After the rebuild, build a selector from the remembered texts — just as `[data-id=\"h-07\"] [data-action=\"delete\"]` finds the delete button of habit h-07. If `querySelector` returned `null`, the habit is gone — then a fallback element is needed."
    solutionNote:
      uk: "Перед перебудовою код запам’ятовує не вузол — він зараз зникне, — а тексти `data-id` і `data-action`. Після перебудови за ними знаходиться нова кнопка тієї самої звички. Якщо звички вже немає, фокус іде на заголовок із `tabindex=\"-1\"`, а якщо фокус був поза списком, код його не чіпає: людина могла саме працювати деінде."
      en: "Before the rebuild the code remembers not the node — it is about to disappear — but the texts `data-id` and `data-action`. After the rebuild they lead to the same habit’s new button. If the habit is gone, focus goes to the heading with `tabindex=\"-1\"`, and if focus was outside the list, the code leaves it alone: the person may have been working somewhere else."
    feedback:
      - when: { test: "pausing a habit keeps the focus on its new toggle button" }
        message:
          uk: "Ця перевірка ставить фокус на «Пауза» звички h-02 і натискає Enter, а потім ще раз. Вона чекає, що кнопка цієї звички щоразу змінює текст («Відновити», потім «Пауза») і що `document.activeElement` — саме нова кнопка. Стару кнопку перебудова вже прибрала з документа, тож `focus()` на ній нічого не робить."
          en: "This check puts focus on “Pause” of habit h-02 and presses Enter, then once more. It expects the habit’s button to change its text each time (“Resume”, then “Pause”) and `document.activeElement` to be exactly the new button. The rebuild has already removed the old button from the document, so `focus()` on it does nothing."
      - when: { test: "deleting a habit moves the focus to the list heading" }
        message:
          uk: "Ця перевірка ставить фокус на «Видалити» звички h-01 і натискає Enter. Вона чекає, що звичка зникне, а фокус опиниться на заголовку `#habits-title`: кнопок цієї звички більше немає."
          en: "This check puts focus on “Delete” of habit h-01 and presses Enter. It expects the habit to disappear and focus to land on the heading `#habits-title`: this habit has no buttons any more."
      - when: { test: "a refresh with the focus outside the list leaves the focus where it was" }
        message:
          uk: "Ця перевірка ставить фокус спершу на `body`, потім на заголовок списку і щоразу викликає `refresh()`. Вона чекає, що фокус лишиться там, де був: переносити його треба, лише коли перед перебудовою він був у списку."
          en: "This check puts focus first on `body`, then on the list heading, and calls `refresh()` each time. It expects focus to stay where it was: it should move only when it was in the list before the rebuild."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` про `null` означає, що код читає властивість чи викликає метод від `null`. Під час першого виклику `refresh()` фокус на `body`, і `closest(\"li\")` від нього дає `null`."
          en: "A `TypeError` about `null` means the code reads a property of `null` or calls a method on it. On the first call of `refresh()` focus is on `body`, and `closest(\"li\")` from there gives `null`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-06
    body:
      uk: "Твій проєкт теж перебудовуватиме список карток після кожного редагування й видалення. Запам’ятовуй `data-id` перед перебудовою й повертай фокус на ту саму картку, на наступну після видалення або на перше поле з помилкою — тоді з проєктом зручно працювати й без миші."
      en: "Your project will also rebuild its list of cards after every edit and delete. Remember the `data-id` before the rebuild and return focus to the same card, to the next one after a delete or to the first field with an error — then the project is comfortable to use without a mouse too."
