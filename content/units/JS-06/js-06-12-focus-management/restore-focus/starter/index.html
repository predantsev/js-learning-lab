<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <style>
      body { font-family: system-ui, sans-serif; }
      #habits { list-style: none; padding: 0; display: grid; gap: 0.5rem; max-width: 30rem; }
      #habits li { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; border: 1px solid #a0aec0; border-radius: 8px; }
      #habits .name { flex: 1; }
      .paused { color: #4a5568; font-style: italic; }
      button { font: inherit; }
      :focus-visible { outline: 3px solid #2c5282; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <!-- tabindex="-1": not in the Tab order, but code may move the focus here. -->
      <h2 id="habits-title" tabindex="-1">%%listTitle%%</h2>
      <ul id="habits"></ul>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
