<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <style>
      body { font-family: system-ui, sans-serif; }
      #tasks { list-style: none; padding: 0; display: grid; gap: 0.5rem; max-width: 26rem; }
      #tasks li { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; border: 1px solid #a0aec0; border-radius: 8px; }
      button { font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <ul id="tasks">
        <li data-id="t-01"><span>%%task1%%</span> <button type="button">%%done%%</button></li>
        <li data-id="t-02"><span>%%task2%%</span> <button type="button">%%done%%</button></li>
        <li data-id="t-03"><span>%%task3%%</span> <button type="button">%%done%%</button></li>
      </ul>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
