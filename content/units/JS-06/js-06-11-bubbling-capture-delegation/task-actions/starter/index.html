<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <style>
      body { font-family: system-ui, sans-serif; }
      #tasks { list-style: none; padding: 0; display: grid; gap: 0.5rem; max-width: 30rem; }
      #tasks li { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; border: 1px solid #a0aec0; border-radius: 8px; }
      #tasks .title { flex: 1; }
      button { font: inherit; }
      #status { min-height: 1.5rem; color: #2c5282; }
    </style>
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <p id="status" aria-live="polite"></p>
      <!-- data-id names the task, data-action names what a button does.
           aria-label gives every button a name that says which task it belongs to. -->
      <ul id="tasks">
        <li data-id="t-01">
          <span class="title">%%task1%%</span>
          <button type="button" data-action="edit" aria-label="%%edit%%: %%task1%%"><span aria-hidden="true">✎</span> %%edit%%</button>
          <button type="button" data-action="delete" aria-label="%%delete%%: %%task1%%"><span aria-hidden="true">✕</span> %%delete%%</button>
        </li>
        <li data-id="t-02">
          <span class="title">%%task2%%</span>
          <button type="button" data-action="edit" aria-label="%%edit%%: %%task2%%"><span aria-hidden="true">✎</span> %%edit%%</button>
          <button type="button" data-action="delete" aria-label="%%delete%%: %%task2%%"><span aria-hidden="true">✕</span> %%delete%%</button>
        </li>
        <li data-id="t-03">
          <span class="title">%%task3%%</span>
          <button type="button" data-action="edit" aria-label="%%edit%%: %%task3%%"><span aria-hidden="true">✎</span> %%edit%%</button>
          <button type="button" data-action="delete" aria-label="%%delete%%: %%task3%%"><span aria-hidden="true">✕</span> %%delete%%</button>
        </li>
      </ul>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
