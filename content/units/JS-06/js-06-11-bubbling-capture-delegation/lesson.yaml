id: js-06-11-bubbling-capture-delegation
unit: JS-06
title:
  uk: "Шлях події: спливання, перехоплення, делегування"
  en: "Event path: bubbling, capture, delegation"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачити, у якому порядку спрацюють слухачі перехоплення й спливання на вкладених елементах для одного кліку."
    en: "Predict the order in which capture and bubble listeners on nested elements run for one click."
  - uk: "Замінити слухачів на кожному пункті одним делегованим слухачем, що знаходить запис через `closest()` і data-атрибут та ігнорує кліки поза пунктами."
    en: "Replace per-item listeners with one delegated listener that finds the clicked record through closest() and a data attribute, ignoring clicks outside any item."
prerequisites: [js-06-10-events-default-behavior]
subskills:
  - { family: W-03, skill: "bubbling/capture/delegation", depth: intro }
glossary: [event-bubbling, capture-phase, event-delegation, event-target, data-attribute]
selfCheck: [click-path, task-actions]

blocks:
  - id: event-path
    kind: explanation
    title:
      uk: "Подія мандрує деревом"
      en: "An event travels through the tree"
    body:
      uk: |
        Клік по кнопці «✕» у картці справи стається не лише на кнопці. Подія проходить шлях деревом DOM:

        1. **Перехоплення** ([[capture-phase|capture]]) — згори вниз: `document` → список → картка → кнопка.
        2. **Ціль** — сама кнопка, елемент, з якого все почалося: [[event-target|`event.target`]].
        3. **Спливання** ([[event-bubbling|bubbling]]) — назад угору: картка → список → `document`.

        Звичайний слухач (`addEventListener("click", …)`) спрацьовує під час спливання, а з третім аргументом `{ capture: true }` — під час перехоплення. Тому клік у картці чують і слухачі картки, і слухачі списку.

        Для кожного слухача `event.target` — той самий елемент, де клікнули, а `event.currentTarget` — елемент, до якого прив’язаний саме цей слухач. Виклик `event.stopPropagation()` зупиняє подальшу подорож події.
      en: |
        A click on the “✕” button in a task card does not happen only on the button. The event travels a path through the DOM tree:

        1. **Capture** ([[capture-phase]]) — from the top down: `document` → the list → the card → the button.
        2. **Target** — the button itself, the element where it all started: [[event-target|`event.target`]].
        3. **Bubbling** ([[event-bubbling]]) — back up: the card → the list → `document`.

        An ordinary listener (`addEventListener("click", …)`) runs during bubbling, and with a third argument `{ capture: true }` — during capture. That is why a click in a card is heard both by the card’s listeners and by the list’s.

        For every listener `event.target` is the same element, the one that was clicked, while `event.currentTarget` is the element this particular listener is attached to. Calling `event.stopPropagation()` stops the event’s further journey.

  - id: click-path
    kind: prediction
    strings:
      listCapture: { uk: "список: перехоплення", en: "list: capture" }
      buttonTarget: { uk: "кнопка", en: "button" }
      cardBubble: { uk: "картка: спливання", en: "card: bubbling" }
      listBubble: { uk: "список: спливання", en: "list: bubbling" }
    prompt:
      uk: "У списку `#list` лежить картка `#card`, а в ній кнопка `#remove`. Що й у якому порядку виведе цей код? Розстав рядки."
      en: "The list `#list` holds the card `#card`, which holds the button `#remove`. What does this code print, and in which order? Arrange the lines."
    code: |
      // Setup: a list with one card, the card with one button.
      document.body.innerHTML = '<ul id="list"><li id="card"><button id="remove">✕</button></li></ul>';
      const list = document.querySelector("#list");
      const card = document.querySelector("#card");
      const button = document.querySelector("#remove");

      list.addEventListener("click", () => console.log("%%listBubble%%"));
      card.addEventListener("click", () => console.log("%%cardBubble%%"));
      button.addEventListener("click", () => console.log("%%buttonTarget%%"));
      list.addEventListener("click", () => console.log("%%listCapture%%"), { capture: true });

      button.click();
    verify:
      logs: ["%%listCapture%%", "%%buttonTarget%%", "%%cardBubble%%", "%%listBubble%%"]
    answer:
      type: order
      items:
        - { id: list-capture, code: "%%listCapture%%" }
        - { id: button, code: "%%buttonTarget%%" }
        - { id: card-bubble, code: "%%cardBubble%%" }
        - { id: list-bubble, code: "%%listBubble%%" }
    explanation:
      uk: "Спершу подія йде згори вниз — тут спрацьовує лише слухач списку з `{ capture: true }`, хоч його й додали останнім. Потім ціль — кнопка. Далі спливання: картка, а за нею список. Порядок задає шлях події деревом, а не порядок рядків коду. А клік не лише на кнопці: його чують усі предки, крізь яких він проходить."
      en: "First the event goes from the top down — only the list’s listener with `{ capture: true }` runs here, although it was added last. Then the target — the button. Then bubbling: the card, and after it the list. The order comes from the event’s path through the tree, not from the order of the lines of code. And the click does not stay on the button: every ancestor it passes through hears it."

  - id: path-diagram
    kind: visual
    visual: diagram
    title:
      uk: "Шлях одного кліку"
      en: "The path of one click"
    textEquivalent:
      uk: >-
        Клік по кнопці «✕» у картці справи t-02, що лежить у списку ul#tasks. Ліворуч — етап перехоплення: подія йде від
        document через список і картку вниз до кнопки, і тут спрацьовують слухачі з capture: true, спершу зовнішні. Унизу —
        ціль: сама кнопка; для кожного слухача event.target — ця кнопка (або значок усередині неї). Праворуч — спливання: подія
        повертається вгору через картку до списку й document, і тут спрацьовують звичайні слухачі — спершу картки, потім
        списку. Тому делегований слухач на списку чує кліки в будь-якій картці: у ньому event.currentTarget — список, а
        event.target.closest("[data-id]") піднімається від кнопки до картки й читає її data-id, t-02. Якщо слухач картки
        викличе event.stopPropagation(), спливання зупиниться на картці, і слухач списку цього кліку не почує.
      en: >-
        A click on the “✕” button in the card of task t-02, which lies in the list ul#tasks. On the left is the capture phase:
        the event goes from document through the list and the card down to the button, and listeners with capture: true run
        here, the outer ones first. At the bottom is the target: the button itself; for every listener event.target is this
        button (or the icon inside it). On the right is bubbling: the event goes back up through the card to the list and
        document, and ordinary listeners run here — first the card’s, then the list’s. That is why a delegated listener on the
        list hears clicks in any card: in it event.currentTarget is the list, and event.target.closest("[data-id]") climbs from
        the button up to the card and reads its data-id, t-02. If the card’s listener calls event.stopPropagation(), bubbling
        stops at the card, and the list’s listener never hears this click.
    spec:
      layout: grid
      nodes:
        - { id: c-doc, label: "document", shape: round, col: 0, row: 0, w: 150 }
        - { id: c-ul, label: "ul#tasks", col: 0, row: 1, w: 150 }
        - { id: c-li, label: "li[data-id=t-02]", col: 0, row: 2, w: 150 }
        - { id: c-btn, label: "button ✕", shape: pill, col: 0, row: 3, w: 150 }
        - { id: b-doc, label: "document", shape: round, col: 1, row: 0, w: 150 }
        - { id: b-ul, label: "ul#tasks", col: 1, row: 1, w: 150 }
        - { id: b-li, label: "li[data-id=t-02]", col: 1, row: 2, w: 150 }
        - { id: b-btn, label: "button ✕", shape: pill, col: 1, row: 3, w: 150 }
      edges:
        - { from: c-doc, to: c-ul }
        - { from: c-ul, to: c-li }
        - { from: c-li, to: c-btn }
        - { from: c-btn, to: b-btn, label: { uk: "ціль", en: "target" } }
        - { from: b-btn, to: b-li }
        - { from: b-li, to: b-ul }
        - { from: b-ul, to: b-doc }
      steps:
        - caption:
            uk: "Клік по кнопці «✕» у картці справи t-02. Ліворуч — шлях униз, праворуч — шлях угору: це ті самі елементи, через які подія проходить двічі."
            en: "A click on the “✕” button in the card of task t-02. On the left is the way down, on the right the way up: the same elements, which the event passes through twice."
        - highlight: [c-doc, c-ul, c-li, c-btn, c-doc->c-ul, c-ul->c-li, c-li->c-btn]
          caption:
            uk: "**Перехоплення**: від `document` униз до кнопки. Тут спрацьовують слухачі з `{ capture: true }` — спершу зовнішні."
            en: "**Capture**: from `document` down to the button. Listeners with `{ capture: true }` run here — the outer ones first."
        - highlight: [c-btn, b-btn, c-btn->b-btn]
          caption:
            uk: "**Ціль**: сама кнопка, її слухачі. Для кожного слухача на шляху `event.target` — ця кнопка (або значок, по якому влучили всередині неї)."
            en: "**Target**: the button itself and its listeners. For every listener on the path `event.target` is this button (or the icon inside it that was hit)."
        - highlight: [b-li, b-ul, b-doc, b-btn->b-li, b-li->b-ul, b-ul->b-doc]
          caption:
            uk: "**Спливання**: назад угору. Тут спрацьовують звичайні слухачі — спершу картки, потім списку. Тому слухач на списку чує кліки в будь-якій картці."
            en: "**Bubbling**: back up. Ordinary listeners run here — first the card’s, then the list’s. That is why a listener on the list hears clicks in any card."
        - highlight: [b-ul, b-li, b-li->b-ul]
          annotate:
            - { id: b-ul, text: "currentTarget" }
          caption:
            uk: "Делегований слухач на списку: `event.currentTarget` — список, `event.target` — кнопка. `event.target.closest(\"[data-id]\")` піднімається від кнопки до картки й читає її `data-id`: t-02."
            en: "A delegated listener on the list: `event.currentTarget` is the list, `event.target` the button. `event.target.closest(\"[data-id]\")` climbs from the button up to the card and reads its `data-id`: t-02."
        - highlight: [b-li]
          dim: [b-ul, b-doc, b-li->b-ul, b-ul->b-doc]
          caption:
            uk: "Якщо слухач картки викличе `event.stopPropagation()`, спливання зупиниться на картці — і слухач списку цього кліку не почує."
            en: "If the card’s listener calls `event.stopPropagation()`, bubbling stops at the card — and the list’s listener never hears this click."

  - id: delegation
    kind: explanation
    title:
      uk: "Делегування: один слухач на весь список"
      en: "Delegation: one listener for the whole list"
    body:
      uk: |
        Замість слухача на кожній кнопці можна повісити **один** слухач на список: кліки спливають до нього з будь-якого пункту. Це [[event-delegation|делегування]]. Лишається дізнатися, по чому саме клікнули:

        ```js
        habits.addEventListener("click", (event) => {
          const item = event.target.closest("li[data-id]");
          if (item === null) return; // клік поза будь-яким пунктом
          console.log("клікнули звичку", item.dataset.id);
        });
        ```

        - `closest(selector)` іде від елемента вгору й повертає найближчого предка (або сам елемент), що відповідає селектору, — або `null`.
        - [[data-attribute|Data-атрибути]] на кшталт `data-id="h-02"` зберігають у розмітці дані для коду; JavaScript читає їх через `element.dataset.id`.
        - Слухач працює й для пунктів, доданих пізніше: вони теж лежать у списку.
      en: |
        Instead of a listener on every button you can put **one** listener on the list: clicks bubble up to it from any item. This is [[event-delegation]]. What is left is to find out what exactly was clicked:

        ```js
        habits.addEventListener("click", (event) => {
          const item = event.target.closest("li[data-id]");
          if (item === null) return; // a click outside any item
          console.log("clicked habit", item.dataset.id);
        });
        ```

        - `closest(selector)` goes up from the element and returns the nearest ancestor (or the element itself) that matches the selector — or `null`.
        - [[data-attribute|Data attributes]] such as `data-id="h-02"` keep data for the code in the markup; JavaScript reads them through `element.dataset.id`.
        - The listener also works for items added later: they lie in the list too.

  - id: task-clicks
    kind: example
    runtime: browser-js
    dir: task-clicks
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Планувальник", en: "Planner" }
      task1: { uk: "Полити квіти", en: "Water the plants" }
      task2: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      task3: { uk: "Написати бабусі", en: "Write to grandma" }
      task5: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      done: { uk: "Готово", en: "Done" }
      marked: { uk: "Позначено:", en: "Marked:" }
    title:
      uk: "Слухачі на кнопках проти одного на списку"
      en: "Listeners on buttons versus one on the list"
    body:
      uk: |
        Тут кожна кнопка «Готово» отримує власного слухача в циклі, а четверту справу програма додає вже після циклу. Запусти, понатискай кнопки й стеж за вкладкою **Консоль**.
      en: |
        Here every “Done” button gets its own listener in a loop, and the program adds the fourth task after the loop. Run it, press the buttons and watch the **Console** tab.
    tryIt:
      uk: |
        1. Натисни «Готово» в кожній справі: перші три пишуть у консоль свій `data-id`, а четверта (t-05) мовчить — її кнопки ще не було, коли працював цикл.
        2. Заміни весь цикл `for` одним слухачем на списку: `list.addEventListener("click", (event) => { const button = event.target.closest("button"); if (button === null) return; console.log("…", button.closest("li").dataset.id); });` — і тепер відповідає й t-05.
        3. Клацни на порожньому місці між справами: нічого не стається й помилок немає — це завдяки перевірці на `null`.
        4. Додай першій справі слухача, що зупиняє подію: `list.querySelector("li").addEventListener("click", (event) => event.stopPropagation());` — тепер її кнопка не пише в консоль. Прибери цей рядок коду.
      en: |
        1. Press “Done” in every task: the first three print their `data-id` to the console, and the fourth (t-05) stays silent — its button did not exist yet when the loop ran.
        2. Replace the whole `for` loop with one listener on the list: `list.addEventListener("click", (event) => { const button = event.target.closest("button"); if (button === null) return; console.log("…", button.closest("li").dataset.id); });` — and now t-05 answers too.
        3. Click an empty spot between the tasks: nothing happens and there are no errors — thanks to the check for `null`.
        4. Give the first task a listener that stops the event: `list.querySelector("li").addEventListener("click", (event) => event.stopPropagation());` — now its button prints nothing. Remove that line of code.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: коли значення може бракувати"
      en: "Recall: when a value may be missing"
    strings:
      none: { uk: "немає", en: "none" }
    items:
      - id: optional-chain-null
        from: js-02-04-nullish-optional-chaining
        prompt:
          uk: "`closest` нічого не знайшов і повернув `null`. Що виведе цей код?"
          en: "`closest` found nothing and returned `null`. What does this code print?"
        code: |
          const card = null;
          console.log(card?.dataset.id);
          console.log(card?.dataset.id ?? "%%none%%");
        verify:
          logs: ["undefined", "%%none%%"]
        answer:
          type: choice
          options:
            - id: right
              text:
                uk: "`undefined`, потім `немає`"
                en: "`undefined`, then `none`"
            - id: error
              text:
                uk: "Помилку `TypeError` вже в першому рядку коду"
                en: "A `TypeError` already on the first line of code"
              why:
                uk: "`?.` зупиняє ланцюжок, щойно ліворуч `null` чи `undefined`, і дає `undefined` замість помилки."
                en: "`?.` stops the chain as soon as there is `null` or `undefined` on the left and gives `undefined` instead of an error."
            - id: null-twice
              text:
                uk: "`null`, потім `null`"
                en: "`null`, then `null`"
              why:
                uk: "Обірваний ланцюжок `?.` дає `undefined`, а `??` замінює його значенням праворуч."
                en: "A chain cut short by `?.` gives `undefined`, and `??` replaces it with the value on the right."
          correct: [right]
        explanation:
          uk: "`card?.dataset` бачить `null` і обриває весь ланцюжок — результат `undefined`. `??` підставляє запасне значення для `null` чи `undefined`. Так само безпечно читати `event.target.closest(\"[data-id]\")?.dataset.id`, коли клік міг влучити повз будь-який пункт."
          en: "`card?.dataset` sees `null` and cuts the whole chain short — the result is `undefined`. `??` substitutes a fallback for `null` or `undefined`. The same way, `event.target.closest(\"[data-id]\")?.dataset.id` is safe to read when a click may have missed every item."

  - id: task-actions
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: task-actions
    entry: index.html
    editable: [index.js]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Справи на сьогодні", en: "Today’s tasks" }
      task1: { uk: "Полити квіти", en: "Water the plants" }
      task2: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      task3: { uk: "Написати бабусі", en: "Write to grandma" }
      task9: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
      edit: { uk: "Редагувати", en: "Edit" }
      delete: { uk: "Видалити", en: "Delete" }
      editing: { uk: "Редагуємо:", en: "Editing:" }
      deleted: { uk: "Видалено:", en: "Deleted:" }
    title:
      uk: "Один слухач для всіх кнопок"
      en: "One listener for all buttons"
    instructions:
      uk: |
        Кожна справа — це `<li data-id="…">` з двома кнопками: у кнопок є `data-action="edit"` чи `data-action="delete"`, а всередині — значок у `<span>`. Функції `editTask(item)` і `deleteTask(item)` уже готові: їм треба передати `<li>` справи.

        Допиши в кінець `index.js` **один** слухач кліків на списку `#tasks`:

        1. Знайди кнопку з `data-action`, по якій клікнули, — навіть якщо клікнули по значку всередині неї.
        2. Знайди її справу й виклич `editTask` або `deleteTask` залежно від `data-action`.
        3. Клік по назві справи чи по порожньому місцю нічого не змінює й не спричиняє помилок.

        Справи, які додадуть пізніше, мають працювати з тим самим слухачем.
      en: |
        Every task is an `<li data-id="…">` with two buttons: the buttons have `data-action="edit"` or `data-action="delete"`, and an icon in a `<span>` inside. The functions `editTask(item)` and `deleteTask(item)` are ready: pass them the task’s `<li>`.

        Add **one** click listener on the list `#tasks` at the end of `index.js`:

        1. Find the button with `data-action` that was clicked — even if the click hit the icon inside it.
        2. Find its task and call `editTask` or `deleteTask` according to `data-action`.
        3. A click on a task’s title or on an empty spot changes nothing and causes no errors.

        Tasks added later must work with the same listener.
    testTitles:
      "clicking the delete icon removes only that task":
        uk: "Клік по значку «Видалити» прибирає лише цю справу"
        en: "A click on the delete icon removes only that task"
      "clicking edit reports that task and keeps it":
        uk: "Клік по «Редагувати» називає цю справу й лишає її"
        en: "A click on Edit names that task and keeps it"
      "a task added later works with the same listener":
        uk: "Справа, додана пізніше, працює з тим самим слухачем"
        en: "A task added later works with the same listener"
      "clicks outside the buttons change nothing":
        uk: "Кліки повз кнопки нічого не змінюють"
        en: "Clicks outside the buttons change nothing"
    hints:
      nudge:
        uk: "Що буде `event.target`, якщо клікнути по значку всередині кнопки? Як від нього дістатися до самої кнопки й до її справи?"
        en: "What is `event.target` when the click hits the icon inside a button? How do you get from there to the button itself and to its task?"
      explanation:
        uk: "`event.target` — найглибший елемент, по якому влучили, тож для кліку по значку це `<span>`. `closest` піднімається від нього до найближчого предка за селектором: так, як у поясненні знаходили `li[data-id]`, можна знайти й кнопку за її атрибутом, а від кнопки — справу. Якщо `closest` повернув `null`, клік був повз кнопки — тоді просто вийди зі слухача. Значення атрибута `data-action` читається як `button.dataset.action`."
        en: "`event.target` is the deepest element that was hit, so for a click on the icon it is the `<span>`. `closest` climbs from it to the nearest ancestor matching a selector: just as the explanation found `li[data-id]`, you can find the button by its attribute, and the task from the button. If `closest` returned `null`, the click missed the buttons — then simply leave the listener. The value of the `data-action` attribute is read as `button.dataset.action`."
    solutionNote:
      uk: "Один слухач на списку чує кліки з усіх справ — і тих, що додадуть пізніше. `closest(\"button[data-action]\")` знаходить кнопку, навіть коли клікнули по значку всередині неї, а перевірка на `null` відсікає кліки повз кнопки. `data-action` і `data-id` дають усе, що треба знати про клік."
      en: "One listener on the list hears clicks from every task — including those added later. `closest(\"button[data-action]\")` finds the button even when the click hit the icon inside it, and the check for `null` filters out clicks that missed the buttons. `data-action` and `data-id` tell everything there is to know about the click."
    feedback:
      - when: { test: "clicking the delete icon removes only that task" }
        message:
          uk: "Ця перевірка клацає по значку `✕` всередині кнопки «Видалити» справи t-02 і чекає, що зникне лише ця справа, а `#status` назве її. Коли клацають по значку, `event.target` — це `<span>`, а не кнопка."
          en: "This check clicks the `✕` icon inside the Delete button of task t-02 and expects only that task to disappear and `#status` to name it. When the icon is clicked, `event.target` is the `<span>`, not the button."
      - when: { test: "clicking edit reports that task and keeps it" }
        message:
          uk: "Ця перевірка натискає «Редагувати» справи t-03 і чекає, що `#status` назве цю справу, а сама вона лишиться в списку."
          en: "This check presses Edit on task t-03 and expects `#status` to name that task while the task stays in the list."
      - when: { test: "a task added later works with the same listener" }
        message:
          uk: "Ця перевірка додає нову справу вже після запуску програми й клацає по її значку «Видалити». Справа має зникнути, а це можливо, лише коли слухач висить на списку, а не на кожній кнопці окремо."
          en: "This check adds a new task after the program has run and clicks its delete icon. The task must disappear, which is possible only when the listener sits on the list rather than on every button separately."
      - when: { test: "clicks outside the buttons change nothing" }
        message:
          uk: "Ця перевірка клацає по назві справи, по самій картці й по списку і чекає, що ні список, ні `#status` не зміняться й не виникне помилок. У жодному з цих кліків `closest` не знаходить кнопки й повертає `null` — слухач має зупинитися, перш ніж щось читати з результату."
          en: "This check clicks a task’s title, the card itself and the list and expects neither the list nor `#status` to change and no errors. In none of these clicks does `closest` find a button: it returns `null` — and the listener has to stop before reading anything from the result."

  - id: to-project
    kind: transfer
    capstoneStep: JS-06
    body:
      uk: "Картки твого проєкту отримають `data-id`, а їхні кнопки — `data-action`. Тоді один слухач на списку обслужить і редагування, і видалення — і для карток, що з’являться пізніше."
      en: "Your project’s cards get a `data-id`, and their buttons a `data-action`. Then one listener on the list serves both editing and deleting — also for the cards that appear later."
