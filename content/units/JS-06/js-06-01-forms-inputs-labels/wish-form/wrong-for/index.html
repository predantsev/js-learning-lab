<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <form>
        <label for="name">%%nameLabel%%</label>
        <input id="name" name="name" required>

        <!-- The label says for="price", but the field's id is "cost": the two are not connected. -->
        <label for="price">%%priceLabel%%</label>
        <input id="cost" name="price" type="number" min="0" aria-describedby="price-hint">
        <p id="price-hint" class="hint">%%priceHint%%</p>

        <label for="category">%%categoryLabel%%</label>
        <select id="category" name="category">
          <option value="">%%noCategory%%</option>
          <option value="home">%%home%%</option>
          <option value="tech">%%tech%%</option>
          <option value="books">%%books%%</option>
        </select>

        <!-- The checkbox and its text sit side by side, but nothing connects them. -->
        <p><input type="checkbox" name="acquired"> %%acquiredLabel%%</p>

        <button>%%save%%</button>
      </form>
    </main>
  </body>
</html>
