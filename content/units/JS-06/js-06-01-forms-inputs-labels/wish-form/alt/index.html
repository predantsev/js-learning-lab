<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <form>
        <!-- Every field is wrapped in its label: no for/id pairs needed. -->
        <label>%%nameLabel%% <input name="name" type="text" required></label>

        <label>%%priceLabel%% <input name="price" type="number" min="0" step="1" aria-describedby="price-hint"></label>
        <p id="price-hint" class="hint">%%priceHint%%</p>

        <label>%%categoryLabel%%
          <select id="category" name="category">
            <option value="">%%noCategory%%</option>
            <option value="home">%%home%%</option>
            <option value="tech">%%tech%%</option>
            <option value="books">%%books%%</option>
          </select>
        </label>

        <label><input type="checkbox" name="acquired"> %%acquiredLabel%%</label>

        <button>%%save%%</button>
      </form>
    </main>
  </body>
</html>
