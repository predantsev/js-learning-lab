<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <form>
        <!-- The name field relies on its placeholder: the text disappears as soon as the user types. -->
        <input id="name" name="name" placeholder="%%nameLabel%%" required>

        <label for="price">%%priceLabel%%</label>
        <input id="price" name="price" type="number" min="0" aria-describedby="price-hint">
        <p id="price-hint" class="hint">%%priceHint%%</p>

        <label for="category">%%categoryLabel%%</label>
        <select id="category" name="category">
          <option value="">%%noCategory%%</option>
          <option value="home">%%home%%</option>
          <option value="tech">%%tech%%</option>
          <option value="books">%%books%%</option>
        </select>

        <label><input type="checkbox" name="acquired"> %%acquiredLabel%%</label>

        <button>%%save%%</button>
      </form>
    </main>
  </body>
</html>
