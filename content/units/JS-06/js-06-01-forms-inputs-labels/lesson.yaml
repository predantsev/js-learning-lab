id: js-06-01-forms-inputs-labels
unit: JS-06
title:
  uk: "Форми: поля, підписи та вбудована валідація"
  en: "Forms: inputs, labels, built-in validation"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Зв’язати кожне поле з видимим підписом (через `for`/`id` або обгортанням) і передбачити доступне ім’я, яке оголосить програма екранного читання."
    en: "Connect every input to a visible label (for/id or wrapping) and predict the accessible name a screen reader announces."
  - uk: "Додати вбудовані обмеження (`required`, `type`, `min`, `maxlength`) і пов’язати підказку чи повідомлення про помилку з полем через `aria-describedby`."
    en: "Add built-in constraints (required, type, min, maxlength) and tie an inline hint or error message to its field with aria-describedby."
  - uk: "Пояснити, чому вбудована валідація допомагає людині, але не замінює функцію `validate` у коді."
    en: "Explain why built-in validation helps the user but does not replace a validate function in code."
prerequisites: [js-01-07-links-buttons-images-tables, js-02-11-independent-validation]
subskills:
  - { family: W-01, skill: "inputs/labels/validation", depth: intro }
glossary: [form, label, accessible-name, constraint-validation, inline-validation]
selfCheck: [names-heard, wish-form]

blocks:
  - id: fields-and-labels
    kind: explanation
    title:
      uk: "Форма — це поля з підписами"
      en: "A form is fields with labels"
    body:
      uk: |
        Досі сторінки лише показували дані. [[form|Форма]] дає людині змогу їх **вводити**: назву справи, суму витрати, дату.

        ```html
        <form>
          <label for="title">Назва справи</label>
          <input id="title" name="title">
          <button>Зберегти</button>
        </form>
        ```

        - `<input>` — поле введення. Закривального тегу в нього немає, як і в `<img>`.
        - `<label>` — [[label|підпис]]: видимий текст, що називає поле. Атрибут `for` зв’язує підпис із полем, у якого такий самий `id`.
        - `name` — ключ, під яким значення поля піде разом із формою. Людина його не бачить.
        - `<button>` усередині форми надсилає її.

        Підпис можна зв’язати з полем і без `for`/`id` — обгорнути ним поле: `<label>Термін <input type="date"></label>`.

        Зв’язаний підпис працює двічі: клік по ньому ставить курсор у поле, а програма екранного читання оголошує його текст як [[accessible-name|доступне ім’я]] (accessible name) поля.
      en: |
        So far pages only showed data. A [[form]] lets a person **enter** it: a task title, an expense amount, a date.

        ```html
        <form>
          <label for="title">Task title</label>
          <input id="title" name="title">
          <button>Save</button>
        </form>
        ```

        - `<input>` is a field to type into. It has no closing tag, just like `<img>`.
        - `<label>` is a [[label]]: visible text that names a field. The `for` attribute connects it to the field with the same `id`.
        - `name` is the key under which the field’s value travels with the form. People never see it.
        - A `<button>` inside a form submits it.

        A label can also be connected without `for`/`id` — by wrapping the field: `<label>Due date <input type="date"></label>`.

        A connected label works twice: clicking it puts the cursor into the field, and a screen reader announces its text as the field’s [[accessible-name]].

  - id: names-heard
    kind: prediction
    lang: html
    runnable: false
    strings:
      taskTitle: { uk: "Назва справи", en: "Task title" }
      dueDate: { uk: "Термін", en: "Due date" }
      priority: { uk: "Пріоритет", en: "Priority" }
    prompt:
      uk: "Людина з програмою екранного читання переходить між чотирма полями форми планувальника. Яке ім’я програма оголосить для кожного поля?"
      en: "A screen reader user moves through the four fields of this planner form. What name does the screen reader announce for each field?"
    code: |
      <label for="title">%%taskTitle%%</label>
      <input id="title" name="title">

      <label>%%dueDate%% <input type="date" name="dueDate"></label>

      <input name="priority" placeholder="%%priority%%">

      <input name="note">
    answer:
      type: choice
      options:
        - id: three-names
          text:
            uk: "«Назва справи», «Термін», «Пріоритет», а четверте поле — без імені"
            en: "“Task title”, “Due date”, “Priority”, and the fourth field has no name"
        - id: placeholder-ignored
          text:
            uk: "«Назва справи», «Термін», а третє й четверте — без імені"
            en: "“Task title”, “Due date”, and the third and fourth have no name"
          why:
            uk: "Коли підпису немає, браузер бере ім’я з `placeholder` як запасний варіант. Тож третє поле ім’я має — проблема з ним інша, про неї далі."
            en: "When there is no label, the browser falls back to the `placeholder` for the name. So the third field does have a name — its problem is a different one, covered next."
        - id: wrap-ignored
          text:
            uk: "«Назва справи», «Пріоритет», а друге й четверте — без імені"
            en: "“Task title”, “Priority”, and the second and fourth have no name"
          why:
            uk: "Підпис, що обгортає поле, теж із ним зв’язаний — `for` і `id` тут не потрібні."
            en: "A label that wraps its field is connected to it too — no `for` and `id` needed."
        - id: name-attribute
          text:
            uk: "Імена мають усі чотири: четверте поле зветься «note»"
            en: "All four have names: the fourth field is called “note”"
          why:
            uk: "Атрибут `name` — ключ для даних форми, а не підпис. Програма екранного читання його не оголошує."
            en: "The `name` attribute is a key for the form data, not a label. Screen readers do not announce it."
      correct: [three-names]
    explanation:
      uk: "Підпис із `for`/`id` і підпис-обгортка дають полю доступне ім’я. Без підпису Chrome бере ім’я з `placeholder` — як запасний варіант. Поле без жодного з них програма оголосить просто як «поле редагування», і людина не знатиме, що туди вводити."
      en: "A label with `for`/`id` and a wrapping label both give a field its accessible name. Without a label, Chrome falls back to the `placeholder`. A field with neither is announced just as “edit text”, and the person cannot know what to type there."

  - id: placeholder-is-not-a-label
    kind: explanation
    title:
      uk: "Placeholder — не підпис, а підказка — через aria-describedby"
      en: "A placeholder is not a label; hints go through aria-describedby"
    body:
      uk: |
        `placeholder` дав полю ім’я, але підписом він не стає:

        - він **зникає**, щойно людина почне вводити, — і на екрані вже не видно, що це за поле;
        - його блідий текст важко прочитати, а клік по ньому нічого особливого не робить.

        Тому кожне поле отримує видимий `<label>`, а `placeholder`, якщо потрібен, — лише приклад значення.

        Підказку до поля зв’язує атрибут `aria-describedby` зі значенням `id` елемента з текстом:

        ```html
        <label for="price">Ціна, грн</label>
        <input id="price" type="number" aria-describedby="price-hint">
        <p id="price-hint">Цілими гривнями.</p>
        ```

        Програма екранного читання прочитає «Ціна, грн», а слідом — «Цілими гривнями». Так само біля поля показують повідомлення про помилку: це [[inline-validation|валідація біля поля]].
      en: |
        The `placeholder` gave the field a name, but it does not become a label:

        - it **disappears** as soon as the person starts typing — and the screen no longer shows what the field is for;
        - its pale text is hard to read, and clicking it does nothing special.

        So every field gets a visible `<label>`, and a `placeholder`, if any, is only an example value.

        A hint is connected to a field with the `aria-describedby` attribute, whose value is the `id` of the element holding the text:

        ```html
        <label for="price">Price, UAH</label>
        <input id="price" type="number" aria-describedby="price-hint">
        <p id="price-hint">Whole hryvnias.</p>
        ```

        A screen reader reads “Price, UAH” and then “Whole hryvnias”. Error messages are shown next to a field in the same way: that is [[inline-validation]].

  - id: built-in-checks
    kind: explanation
    title:
      uk: "Браузер сам перевіряє прості правила"
      en: "The browser checks simple rules itself"
    body:
      uk: |
        Кілька атрибутів вмикають [[constraint-validation|вбудовану валідацію]]:

        | Атрибут | Що робить браузер |
        |---|---|
        | `required` | не надсилає форму, поки поле порожнє |
        | `type="number"`, `type="date"`, `type="email"` | приймає лише число, дату, адресу пошти |
        | `min="0"`, `max="…"` | не надсилає форму, якщо число чи дата поза межами |
        | `maxlength="80"` | просто не дає ввести більше символів |

        Коли правило порушене, браузер не надсилає форму, а показує повідомлення біля поля. Перевір це сам у прикладі.
      en: |
        A few attributes turn on [[constraint-validation|built-in validation]]:

        | Attribute | What the browser does |
        |---|---|
        | `required` | does not submit the form while the field is empty |
        | `type="number"`, `type="date"`, `type="email"` | accepts only a number, a date, an email address |
        | `min="0"`, `max="…"` | does not submit the form when the number or date is out of range |
        | `maxlength="80"` | simply does not let you type more characters |

        When a rule is broken, the browser does not submit the form and shows a message next to the field. Try it yourself in the example.

  - id: task-form
    kind: example
    runtime: browser-js
    dir: task-form
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Планувальник", en: "Planner" }
      taskTitle: { uk: "Назва справи", en: "Task title" }
      dueDate: { uk: "Термін", en: "Due date" }
      priority: { uk: "Пріоритет", en: "Priority" }
      low: { uk: "Низький", en: "Low" }
      normal: { uk: "Звичайний", en: "Normal" }
      high: { uk: "Високий", en: "High" }
      minutes: { uk: "Скільки хвилин займе", en: "How many minutes it takes" }
      minutesHint: { uk: "Ціле число, щонайменше 1.", en: "A whole number, at least 1." }
      note: { uk: "Примітка", en: "Note" }
      done: { uk: "Уже виконано", en: "Already done" }
      save: { uk: "Зберегти", en: "Save" }
    title:
      uk: "Форма справи"
      en: "A task form"
    body:
      uk: |
        Запусти форму планувальника й поклацай по підписах: курсор стрибає в поле, а клік по «Уже виконано» ставить позначку. Поле «Примітка» навмисно має лише `placeholder`.

        Щоб побачити, що чує програма екранного читання, клацни правою кнопкою по полю на сторінці, обери **Перевірити** (Inspect) і відкрий вкладку **Accessibility** праворуч: рядок **Name** — це доступне ім’я.
      en: |
        Run the planner form and click the labels: the cursor jumps into the field, and clicking “Already done” ticks the box. The “Note” field deliberately has only a `placeholder`.

        To see what a screen reader hears, right-click a field on the page, choose **Inspect** and open the **Accessibility** tab on the right: the **Name** row is the accessible name.
    tryIt:
      uk: "1) Введи щось у «Примітку»: підказка зникла, і вже не видно, що це за поле. 2) Додай полю назви справи `required` і натисни **Зберегти** з порожнім полем: браузер покаже повідомлення й не надішле форму. Заповни поле й натисни ще раз — у консолі з’явиться повідомлення, що сторінка перезавантажилася б: форма пішла. 3) Додай `maxlength=\"20\"` і спробуй ввести довшу назву. 4) Введи `0` у поле хвилин і збережи: спрацює `min=\"1\"`."
      en: "1) Type something into “Note”: the hint is gone, and nothing on screen says what the field is for. 2) Add `required` to the task title field and press **Save** with the field empty: the browser shows a message and does not submit the form. Fill the field and press again — the console reports that the page would reload: the form was sent. 3) Add `maxlength=\"20\"` and try to type a longer title. 4) Type `0` into the minutes field and save: `min=\"1\"` kicks in."

  - id: browser-and-code
    kind: explanation
    title:
      uk: "Вбудовані перевірки допомагають, а вирішує твій код"
      en: "Built-in checks help; your code decides"
    body:
      uk: |
        Вбудована валідація — підмога для людини: помилку видно ще до надсилання. Але функцію `validate` у коді вона не замінює:

        - перевірки працюють лише тоді, коли форму надсилає браузер. Дані зі сховища, з файлу чи з іншої програми повз форму не проходять;
        - будь-хто може прибрати `required` в інструментах розробника — сторінка ж працює на його комп’ютері;
        - браузер не знає правил твого домену: «назва — від 1 до 80 символів **без пробілів по краях**», «такий запис уже є».

        Тож роботу ділять так: атрибути — швидка підказка людині, `validate` у JavaScript — остаточне рішення, а її помилки показують біля відповідних полів.
      en: |
        Built-in validation is a help for the person: the mistake is visible before sending. But it does not replace the `validate` function in your code:

        - the checks run only when the browser submits the form. Data from storage, from a file or from another program never passes through the form;
        - anyone can remove `required` in the developer tools — the page runs on their computer, after all;
        - the browser does not know your domain’s rules: “the name has 1 to 80 characters **without the spaces at the ends**”, “this record already exists”.

        So the work is split: attributes give the person a quick hint, `validate` in JavaScript makes the final decision, and its errors are shown next to the matching fields.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: результат валідації"
      en: "Recall: a validation result"
    items:
      - id: per-field-errors
        from: js-02-11-independent-validation
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          function validate(input) {
            const errors = {};
            if (input.name === "") {
              errors.name = "required";
            }
            if (input.price !== null && input.price < 0) {
              errors.price = "negative";
            }
            const ok = errors.name === undefined && errors.price === undefined;
            return ok ? { ok: true, value: input } : { ok: false, errors: errors };
          }

          console.log(validate({ name: "", price: -5 }));
        verify:
          logs: ['{ok: false, errors: {name: "required", price: "negative"}}']
        answer:
          type: choice
          options:
            - id: both
              code: '{ ok: false, errors: { name: "required", price: "negative" } }'
            - id: first-only
              code: '{ ok: false, errors: { name: "required" } }'
              why:
                uk: "Перевірки не зупиняються на першій помилці: кожне поле перевіряється окремо, тож помилок дві."
                en: "The checks do not stop at the first problem: every field is checked on its own, so there are two errors."
            - id: one-message
              code: '"required"'
              why:
                uk: "Функція повертає об’єкт-результат з помилкою для кожного поля, а не одне повідомлення."
                en: "The function returns a result object with an error per field, not a single message."
            - id: ok-true
              code: '{ ok: true, value: { name: "", price: -5 } }'
              why:
                uk: "Порожня назва й від’ємна ціна порушують обидві умови, тож `ok` буде `false`."
                en: "An empty name and a negative price break both conditions, so `ok` is `false`."
          correct: [both]
        explanation:
          uk: "Кожне поле отримує власний ключ в `errors`. Такий результат зручно показувати у формі: `errors.name` — під полем назви, `errors.price` — під ціною, і кожне повідомлення зв’язане зі своїм полем через `aria-describedby`."
          en: "Every field gets its own key in `errors`. Such a result is easy to show in a form: `errors.name` under the name field, `errors.price` under the price, each message tied to its field with `aria-describedby`."

  - id: wish-form
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: wish-form
    entry: index.html
    editable: [index.html]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Нове бажання", en: "A new wish" }
      nameLabel: { uk: "Назва", en: "Name" }
      priceLabel: { uk: "Ціна, грн", en: "Price, UAH" }
      priceHint: { uk: "Цілими гривнями. Залиш порожнім, якщо ціна невідома.", en: "Whole hryvnias. Leave it empty if the price is unknown." }
      categoryLabel: { uk: "Категорія", en: "Category" }
      noCategory: { uk: "Без категорії", en: "No category" }
      home: { uk: "Дім", en: "Home" }
      tech: { uk: "Техніка", en: "Tech" }
      books: { uk: "Книжки", en: "Books" }
      acquiredLabel: { uk: "Уже отримано", en: "Already acquired" }
      save: { uk: "Зберегти", en: "Save" }
    title:
      uk: "Форма для бажання"
      en: "A form for a wish"
    instructions:
      uk: |
        Збери форму, через яку в список бажань додають нове бажання. Коментарі в `index.html` показують, куди що писати.

        1. **Назва** — текстове поле з підписом. Без назви форму не можна надіслати.
        2. **Ціна, грн** — поле для числа з підписом, яке не приймає від’ємних чисел (нуль — можна: подарунок буває безкоштовним). Абзац-підказку під ним зв’яжи з полем.
        3. **Категорія** — список уже є, дай йому підпис.
        4. **Уже отримано** — прапорець із підписом.

        Кожне поле має отримати **видимий** підпис: через `for`/`id` або обгортанням. Не забудь атрибути `name` — під цими ключами дані підуть з формою.
      en: |
        Build the form used to add a new wish to the wishlist. The comments in `index.html` show where everything goes.

        1. **Name** — a text field with a label. The form cannot be sent without a name.
        2. **Price, UAH** — a number field with a label that does not accept negative numbers (zero is fine: a gift can be free). Connect the hint paragraph under it to the field.
        3. **Category** — the list is already there; give it a label.
        4. **Already acquired** — a checkbox with a label.

        Every field needs a **visible** label: through `for`/`id` or by wrapping. Do not forget the `name` attributes — the data travels with the form under those keys.
    testTitles:
      "the name field has a visible label":
        uk: "Поле назви має видимий підпис"
        en: "The name field has a visible label"
      "the name field is required":
        uk: "Без назви форму не надіслати"
        en: "The form cannot be sent without a name"
      "the price field is a number field with a visible label":
        uk: "Ціна — поле для числа з видимим підписом"
        en: "The price is a number field with a visible label"
      "the price field does not accept negative numbers":
        uk: "Ціна не приймає від’ємних чисел, а нуль приймає"
        en: "The price rejects negative numbers but accepts zero"
      "the price hint is connected to the price field":
        uk: "Підказку зв’язано з полем ціни через aria-describedby"
        en: "The hint is connected to the price field with aria-describedby"
      "the category list has a visible label":
        uk: "Список категорій має видимий підпис"
        en: "The category list has a visible label"
      "the acquired checkbox has a visible label":
        uk: "Прапорець «Уже отримано» має видимий підпис"
        en: "The “Already acquired” checkbox has a visible label"
    hints:
      nudge:
        uk: "Подивись на форму з прикладу: як там зв’язані «Назва справи», «Термін» і «Уже виконано» зі своїми полями?"
        en: "Look at the form in the example: how are “Task title”, “Due date” and “Already done” connected to their fields?"
      explanation:
        uk: "Пара `<label for=\"name\">Назва</label>` і `<input id=\"name\" name=\"name\" required>` зв’язана однаковим значенням `for` і `id`. Для ціни потрібні `type=\"number\"`, `min=\"0\"` і `aria-describedby=\"price-hint\"`. Список уже має `id=\"category\"` — підпису досить вказати його у `for`. Прапорець зручно обгорнути: `<label><input type=\"checkbox\" name=\"acquired\"> Уже отримано</label>`."
        en: "The pair `<label for=\"name\">Name</label>` and `<input id=\"name\" name=\"name\" required>` is connected by equal `for` and `id` values. The price needs `type=\"number\"`, `min=\"0\"` and `aria-describedby=\"price-hint\"`. The list already has `id=\"category\"` — the label only has to name it in `for`. The checkbox is easiest to wrap: `<label><input type=\"checkbox\" name=\"acquired\"> Already acquired</label>`."
    solutionNote:
      uk: "Кожен підпис зв’язаний зі своїм полем, тож клік по ньому ставить курсор у поле, а програма екранного читання оголошує його як ім’я поля. `required` і `min=\"0\"` — вбудовані перевірки браузера, а `aria-describedby` додає до імені ціни підказку. Обгортання і `for`/`id` однаково правильні."
      en: "Every label is connected to its field, so clicking it puts the cursor into the field, and a screen reader announces it as the field’s name. `required` and `min=\"0\"` are the browser’s built-in checks, and `aria-describedby` adds the hint to the price’s name. Wrapping and `for`/`id` are equally correct."
    feedback:
      - when: { test: "the name field has a visible label" }
        message:
          uk: "Полю назви потрібен видимий `<label>`, зв’язаний через `for`/`id` або обгортанням. Самого `placeholder` замало: він зникає, щойно людина почне вводити."
          en: "The name field needs a visible `<label>`, connected through `for`/`id` or by wrapping. A `placeholder` alone is not enough: it disappears as soon as the person starts typing."
      - when: { test: "the name field is required" }
        message:
          uk: "Додай полю назви атрибут `required` — тоді браузер не надішле форму з порожньою назвою."
          en: "Add the `required` attribute to the name field — then the browser does not send the form with an empty name."
      - when: { test: "the price field is a number field with a visible label" }
        message:
          uk: "Потрібне `<input type=\"number\">` з видимим підписом. Перевір, що значення `for` у підписі й `id` у полі однакові до літери: `for=\"price\"` не знайде поле з `id=\"cost\"`."
          en: "You need an `<input type=\"number\">` with a visible label. Check that the `for` value of the label and the `id` of the field match letter for letter: `for=\"price\"` does not find a field with `id=\"cost\"`."
      - when: { test: "the price field does not accept negative numbers" }
        message:
          uk: "Атрибут `min=\"0\"` не дасть надіслати від’ємну ціну, а нуль лишить дозволеним."
          en: "The `min=\"0\"` attribute stops a negative price from being sent and keeps zero allowed."
      - when: { test: "the price hint is connected to the price field" }
        message:
          uk: "Значення `aria-describedby` має точно збігатися з `id` абзацу-підказки: `price-hint`."
          en: "The `aria-describedby` value must match the `id` of the hint paragraph exactly: `price-hint`."
      - when: { test: "the category list has a visible label" }
        message:
          uk: "Список `<select>` уже має `id=\"category\"`. Додай перед ним `<label for=\"category\">…</label>` або обгорни його підписом."
          en: "The `<select>` already has `id=\"category\"`. Add `<label for=\"category\">…</label>` before it or wrap it in a label."
      - when: { test: "the acquired checkbox has a visible label" }
        message:
          uk: "Текст поруч із прапорцем — ще не підпис. Обгорни прапорець і текст у `<label>` або зв’яжи їх через `for`/`id`."
          en: "Text next to a checkbox is not a label yet. Wrap the checkbox and the text in a `<label>` or connect them with `for`/`id`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-06
    body:
      uk: "У проєкті ти зробиш таку саму форму для записів свого домену: кожне поле з видимим підписом, вбудовані перевірки там, де вони доречні, а помилки з твоєї функції `validate` — біля відповідних полів."
      en: "In your project you will build the same kind of form for your domain’s records: every field with a visible label, built-in checks where they fit, and the errors of your `validate` function next to the matching fields."
