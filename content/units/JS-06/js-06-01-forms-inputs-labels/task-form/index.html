<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <form>
        <label for="title">%%taskTitle%%</label>
        <input id="title" name="title">

        <label>%%dueDate%% <input type="date" name="dueDate"></label>

        <label for="priority">%%priority%%</label>
        <select id="priority" name="priority">
          <option value="low">%%low%%</option>
          <option value="normal" selected>%%normal%%</option>
          <option value="high">%%high%%</option>
        </select>

        <label for="minutes">%%minutes%%</label>
        <input id="minutes" name="minutes" type="number" min="1" aria-describedby="minutes-hint">
        <p id="minutes-hint" class="hint">%%minutesHint%%</p>

        <input name="note" placeholder="%%note%%">

        <label><input type="checkbox" name="done"> %%done%%</label>

        <button>%%save%%</button>
      </form>
    </main>
  </body>
</html>
