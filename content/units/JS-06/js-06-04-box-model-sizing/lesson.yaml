id: js-06-04-box-model-sizing
unit: JS-06
title:
  uk: "Блокова модель і розміри"
  en: "Box model and sizing"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Обчислити ширину елемента на екрані з `width`, `padding` і `border` за `content-box` і за `border-box`."
    en: "Compute an element's rendered width from width, padding and border under content-box and border-box."
  - uk: "Застосувати `padding`, `margin` і `max-width` так, щоб вміст картки ніколи не вилазив за її контейнер."
    en: "Use padding, margin and max-width so a card's content never overflows its container."
prerequisites: [js-06-03-cascade-specificity]
subskills:
  - { family: W-02, skill: "box model/sizing", depth: intro }
glossary: [box-model, padding, margin, box-sizing, margin-collapse]
selfCheck: [card-width, fit-card]

blocks:
  - id: four-layers
    kind: explanation
    title:
      uk: "Кожен елемент — коробка з чотирьох шарів"
      en: "Every element is a box of four layers"
    body:
      uk: |
        Для браузера кожен елемент — прямокутник. Його [[box-model|блокова модель]] має чотири шари, зсередини назовні:

        | Шар | Що це |
        |---|---|
        | вміст (content) | текст, картинка, дочірні елементи |
        | [[padding]] | внутрішній відступ: відсуває вміст від рамки, має тло елемента |
        | `border` | рамка |
        | [[margin]] | зовнішній відступ: прозорий, відштовхує сусідів |

        ```css
        .note {
          width: 240px;
          padding: 12px;
          border: 1px solid teal;
          margin: 8px;
        }
        ```

        Одне значення `padding: 12px` діє з усіх чотирьох боків. Ці шари видно в інструментах розробника: правою кнопкою миші по елементу → у меню браузера **Перевірити** (Inspect) → вкладка **Computed** → прямокутник із розмірами.
      en: |
        To the browser, every element is a rectangle. Its [[box-model]] has four layers, from the inside out:

        | Layer | What it is |
        |---|---|
        | content | text, an image, child elements |
        | [[padding]] | inner spacing: moves the content away from the border, shows the element’s background |
        | `border` | the frame |
        | [[margin]] | outer spacing: transparent, pushes neighbors away |

        ```css
        .note {
          width: 240px;
          padding: 12px;
          border: 1px solid teal;
          margin: 8px;
        }
        ```

        A single value, `padding: 12px`, applies to all four sides. You can see these layers in the developer tools: right-click an element → **Inspect** in the browser’s menu → the **Computed** tab → the rectangle with sizes.

  - id: card-width
    kind: prediction
    lang: css
    runnable: false
    prompt:
      uk: "Дві картки мають однакові правила, різниться лише `box-sizing`. Якої ширини буде кожна картка на екрані — від лівого краю рамки до правого?"
      en: "Two cards share the same rules; only `box-sizing` differs. How wide is each card on screen — from the left edge of its border to the right edge?"
    code: |
      .card {
        width: 300px;
        padding: 20px;
        border: 2px solid green;
      }
      .first { box-sizing: content-box; }
      .second { box-sizing: border-box; }
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "Перша — 344px, друга — 300px"
            en: "The first 344px, the second 300px"
        - id: both-300
          text:
            uk: "Обидві — 300px: так написано в `width`"
            en: "Both 300px: that is what `width` says"
          why:
            uk: "За `content-box` (так браузер рахує без підказок) `width` задає лише вміст, а `padding` і `border` додаються зверху."
            en: "Under `content-box` (what the browser uses unless told otherwise) `width` sets only the content, and `padding` and `border` are added on top."
        - id: no-border
          text:
            uk: "Перша — 340px, друга — 300px"
            en: "The first 340px, the second 300px"
          why:
            uk: "Рамка теж займає місце: по 2px з кожного боку."
            en: "The border takes space too: 2px on each side."
        - id: content-256
          text:
            uk: "Перша — 344px, друга — 256px"
            en: "The first 344px, the second 256px"
          why:
            uk: "256px — це ширина **вмісту** другої картки. На екрані вона займає рівно 300px разом із відступами й рамкою."
            en: "256px is the width of the second card’s **content**. On screen it takes exactly 300px including the padding and the border."
      correct: [right]
    explanation:
      uk: "За `content-box` ширина вмісту — 300px, і до неї додаються `padding` і `border` з обох боків: 300 + 20 + 20 + 2 + 2 = 344px. За `border-box` значення `width` охоплює все до рамки включно: картка займає 300px, а вміст стискається до 300 − 40 − 4 = 256px."
      en: "Under `content-box` the content is 300px wide, and `padding` and `border` are added on both sides: 300 + 20 + 20 + 2 + 2 = 344px. Under `border-box` the `width` covers everything up to and including the border: the card takes 300px, and the content shrinks to 300 − 40 − 4 = 256px."

  - id: two-widths
    kind: visual
    visual: diagram
    title:
      uk: "Одна й та сама width, дві різні картки"
      en: "The same width, two different cards"
    textEquivalent:
      uk: >-
        Дві картки мають однакові правила: width 300px, padding 20px, border 2px і margin 16px; відрізняється лише
        box-sizing. Шари кожної картки намальовано згори вниз, ззовні всередину: margin, border, padding, вміст. За
        content-box значення width задає тільки вміст — 300px, а padding і border додаються з обох боків, тож на екрані картка
        займає 344px. За border-box значення width охоплює вміст, padding і border разом: картка займає рівно 300px, а вміст
        стискається до 256px. Margin в обох випадках лежить поза рамкою, у ширину не входить і лише відштовхує сусідів.
      en: >-
        Two cards share the same rules: width 300px, padding 20px, border 2px and margin 16px; only box-sizing differs. The
        layers of each card are drawn from top to bottom, from the outside in: margin, border, padding, content. Under
        content-box the width sets only the content — 300px, and padding and border are added on both sides, so the card takes
        344px on screen. Under border-box the width covers the content, padding and border together: the card takes exactly
        300px, and the content shrinks to 256px. In both cases the margin lies outside the border, is not part of the width and
        only pushes the neighbors away.
    spec:
      layout: grid
      nodes:
        - { id: cb-mode, label: "content-box", shape: pill, col: 0, row: 0, w: 150 }
        - { id: cb-margin, label: { uk: "margin 16+16 зовні", en: "margin 16+16 outside" }, shape: note, col: 0, row: 1, w: 150 }
        - { id: cb-border, label: "border 2+2", col: 0, row: 2, w: 150 }
        - { id: cb-padding, label: "padding 20+20", col: 0, row: 3, w: 150 }
        - { id: cb-content, label: { uk: "вміст 300 = width", en: "content 300 = width" }, col: 0, row: 4, w: 150 }
        - { id: cb-total, label: { uk: "на екрані: 344px", en: "on screen: 344px" }, shape: round, col: 0, row: 5, w: 150 }
        - { id: bb-mode, label: "border-box", shape: pill, col: 1, row: 0, w: 150 }
        - { id: bb-margin, label: { uk: "margin 16+16 зовні", en: "margin 16+16 outside" }, shape: note, col: 1, row: 1, w: 150 }
        - { id: bb-border, label: "border 2+2", col: 1, row: 2, w: 150 }
        - { id: bb-padding, label: "padding 20+20", col: 1, row: 3, w: 150 }
        - { id: bb-content, label: { uk: "вміст 256", en: "content 256" }, col: 1, row: 4, w: 150 }
        - { id: bb-total, label: { uk: "на екрані: 300px", en: "on screen: 300px" }, shape: round, col: 1, row: 5, w: 150 }
      steps:
        - caption:
            uk: "Дві картки з тими самими правилами: `width: 300px; padding: 20px; border: 2px solid; margin: 16px`. Відрізняється лише `box-sizing`. Шари йдуть згори вниз — ззовні всередину."
            en: "Two cards with the same rules: `width: 300px; padding: 20px; border: 2px solid; margin: 16px`. Only `box-sizing` differs. The layers go from top to bottom — from the outside in."
        - highlight: [cb-mode, cb-content]
          dim: [bb-mode, bb-margin, bb-border, bb-padding, bb-content, bb-total]
          caption:
            uk: "За `content-box` (так браузер рахує без підказок) `width` задає **лише вміст**: 300px."
            en: "Under `content-box` (what the browser uses unless told otherwise) `width` sets **only the content**: 300px."
        - highlight: [cb-padding, cb-border, cb-total]
          dim: [bb-mode, bb-margin, bb-border, bb-padding, bb-content, bb-total]
          caption:
            uk: "`padding` і `border` додаються з обох боків: 300 + 40 + 4 = **344px** на екрані. Картка ширша за написане у `width`."
            en: "`padding` and `border` are added on both sides: 300 + 40 + 4 = **344px** on screen. The card is wider than its `width`."
        - highlight: [bb-mode, bb-total]
          dim: [cb-mode, cb-margin, cb-border, cb-padding, cb-content, cb-total]
          caption:
            uk: "За `border-box` значення `width` охоплює вміст, `padding` і `border` разом: на екрані рівно **300px**."
            en: "Under `border-box` the `width` covers the content, `padding` and `border` together: exactly **300px** on screen."
        - highlight: [bb-content, bb-padding, bb-border]
          dim: [cb-mode, cb-margin, cb-border, cb-padding, cb-content, cb-total]
          caption:
            uk: "Щоб відступи й рамка вмістилися, стискається вміст: 300 − 40 − 4 = **256px**."
            en: "To make room for the padding and the border, the content shrinks: 300 − 40 − 4 = **256px**."
        - highlight: [cb-margin, bb-margin]
          caption:
            uk: "`margin` — поза рамкою в обох випадках. У ширину він не входить, лише відштовхує сусідів."
            en: "`margin` lies outside the border in both cases. It is not part of the width; it only pushes the neighbors away."

  - id: border-box
    kind: explanation
    title:
      uk: "border-box, max-width і різниця між padding і margin"
      en: "border-box, max-width and padding versus margin"
    body:
      uk: |
        Рахувати `content-box` у голові незручно: кожна зміна відступу змінює ширину картки. Тому в більшості проєктів одразу вмикають [[box-sizing]] `border-box` для всіх елементів (селектор `*` вибирає будь-який елемент):

        ```css
        * {
          box-sizing: border-box;
        }
        ```

        Тепер `width: 100%` справді означає «на всю ширину батька» — разом із відступами й рамкою. А `max-width: 360px` не дає картці розростатися на широкому екрані, хоча у вузькому стовпці вона спокійно стає вужчою.

        Як вибрати відступ: **padding** — простір усередині картки, між її рамкою і текстом. **margin** — простір між карткою та її сусідами.
      en: |
        Doing `content-box` arithmetic in your head is awkward: every change of spacing changes the card’s width. That is why most projects switch [[box-sizing]] to `border-box` for every element right away (the selector `*` selects any element):

        ```css
        * {
          box-sizing: border-box;
        }
        ```

        Now `width: 100%` really means “as wide as the parent” — padding and border included. And `max-width: 360px` stops the card from spreading across a wide screen, while in a narrow column it calmly gets narrower.

        Choosing the spacing: **padding** is the space inside the card, between its border and the text. **margin** is the space between the card and its neighbors.

  - id: collapse
    kind: explanation
    title:
      uk: "Вертикальні margin не завжди додаються"
      en: "Vertical margins do not always add up"
    body:
      uk: |
        Якщо дві картки стоять одна під одною, у першої `margin-bottom: 24px`, а в другої `margin-top: 16px`, між ними буде **24px**, а не 40. Сусідні вертикальні margin блоків зливаються в один — більший з двох. Це [[margin-collapse|злиття відступів]] (margin collapse).

        Зливаються лише вертикальні margin звичайних блоків, що стоять один під одним. Горизонтальні margin, а також padding і рамки додаються завжди. Злиття не буває й між елементами всередині [[flexbox|flex]]- чи [[css-grid|grid]]-контейнера — про ці розкладки наступний урок.
      en: |
        If two cards stand one under the other, the first with `margin-bottom: 24px` and the second with `margin-top: 16px`, the gap between them is **24px**, not 40. Adjacent vertical margins of blocks merge into one — the larger of the two. This is [[margin-collapse]].

        Only the vertical margins of ordinary blocks stacked on top of each other collapse. Horizontal margins, padding and borders always add up. There is no collapsing between items inside a [[flexbox|flex]] or [[css-grid|grid]] container either — those layouts come in the next lesson.

  - id: habit-cards
    kind: example
    runtime: browser-js
    dir: habit-cards
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер звичок", en: "Habit tracker" }
      habit1: { uk: "Ранкова зарядка", en: "Morning exercise" }
      note1: { uk: "Щодня, 10 хвилин.", en: "Every day, 10 minutes." }
      habit2: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      note2: { uk: "Щовечора перед сном.", en: "Every evening before bed." }
    title:
      uk: "Картка ширша за лінійку"
      en: "A card wider than the ruler"
    body:
      uk: |
        Над картками стоїть жовта лінійка завширшки рівно 300px, а в карток `width: 300px`. Запусти й порівняй: картки ширші за лінійку.

        Клацни по картці правою кнопкою миші й обери в меню браузера **Перевірити** (Inspect), а тоді вкладку **Computed**: прямокутник покаже вміст 300, `padding` 20 і `border` 2 з кожного боку.
      en: |
        Above the cards stands a yellow ruler exactly 300px wide, and the cards have `width: 300px`. Run it and compare: the cards are wider than the ruler.

        Right-click a card, choose **Inspect** in the browser’s menu, then the **Computed** tab: the rectangle shows the content 300, `padding` 20 and `border` 2 on each side.
    tryIt:
      uk: |
        1. Заміни `content-box` на `border-box` і запусти: картки збігаються з лінійкою.
        2. Збільш `padding` до `40px`: за `border-box` картка лишається 300px завширшки, а текст стискається.
        3. Між картками 24px: `margin-bottom` першої (24) і `margin-top` другої (16) злилися. Зміни `margin-top` на `30px` — проміжок стане 30px, а не 54.
      en: |
        1. Replace `content-box` with `border-box` and run: the cards match the ruler.
        2. Raise `padding` to `40px`: under `border-box` the card stays 300px wide, and the text gets squeezed.
        3. The gap between the cards is 24px: the first card’s `margin-bottom` (24) and the second’s `margin-top` (16) collapsed. Change `margin-top` to `30px` — the gap becomes 30px, not 54.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: порядок дій"
      en: "Recall: the order of operations"
    items:
      - id: total-width
        from: js-01-03-arithmetic-precedence
        prompt:
          uk: "Цей рядок коду рахує ширину вмісту картки завширшки 360px за `border-box`: `padding` 16px і рамка 4px з кожного боку. Що він виведе?"
          en: "This line of code computes the content width of a 360px card under `border-box`: 16px of `padding` and a 4px border on each side. What does it print?"
        code: |
          console.log(360 - 2 * 16 - 2 * 4);
        verify:
          logs: ["320"]
        answer:
          type: choice
          options:
            - id: right
              code: "320"
            - id: left-to-right
              code: "22904"
              why:
                uk: "Множення виконується раніше за віднімання, а не просто зліва направо: спершу `2 * 16` і `2 * 4`, потім різниця."
                en: "Multiplication runs before subtraction, not simply left to right: first `2 * 16` and `2 * 4`, then the difference."
            - id: one-side
              code: "340"
              why:
                uk: "`2 * 16` — це 32: відступ з обох боків, а не з одного; так само з рамкою."
                en: "`2 * 16` is 32: the padding on both sides, not on one; the same goes for the border."
          correct: [right]
        explanation:
          uk: "`*` має вищий пріоритет, ніж `-`: JavaScript спершу обчислює `2 * 16 = 32` і `2 * 4 = 8`, а потім віднімає зліва направо: 360 − 32 − 8 = 320."
          en: "`*` has higher precedence than `-`: JavaScript first computes `2 * 16 = 32` and `2 * 4 = 8`, then subtracts from left to right: 360 − 32 − 8 = 320."

  - id: fit-card
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: fit-card
    entry: index.html
    editable: [styles.css]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер звичок", en: "Habit tracker" }
      habit: { uk: "Вчити англійські слова", en: "Learn English words" }
      note: { uk: "По 10 нових слів щодня, повторення в неділю.", en: "Ten new words a day, a review on Sunday." }
      streak: { uk: "Серія: 5 днів поспіль", en: "Streak: 5 days in a row" }
    title:
      uk: "Картка, що вміщається"
      en: "A card that fits"
    instructions:
      uk: |
        Картка звички стоїть у вузькому стовпці завширшки 260px (його межу показує пунктир). Запусти: картка вилазить за пунктир.

        Допиши правило `.card` у `styles.css`:

        1. Зроби так, щоб `padding` і `border` входили в ширину картки.
        2. На широкому екрані картка не має ставати ширшою за 360px.
        3. Залиш тексту зручний внутрішній відступ від рамки — щонайменше 12px з кожного боку.

        Перевірка поставить картку у стовпці завширшки 220, 260 і 800px.
      en: |
        The habit card stands in a narrow column 260px wide (the dashed line shows its edge). Run it: the card sticks out past the dashed line.

        Complete the `.card` rule in `styles.css`:

        1. Make `padding` and `border` count inside the card’s width.
        2. On a wide screen the card must not get wider than 360px.
        3. Keep comfortable inner spacing between the text and the border — at least 12px on every side.

        The check puts the card into columns 220, 260 and 800px wide.
    testTitles:
      "the card fits inside a narrow column":
        uk: "Картка вміщається у вузькому стовпці"
        en: "The card fits inside a narrow column"
      "the card never grows wider than 360px":
        uk: "Картка не ширша за 360px навіть у широкому стовпці"
        en: "The card is never wider than 360px, even in a wide column"
      "the text keeps comfortable spacing from the border":
        uk: "Текст має відступ щонайменше 12px від рамки"
        en: "The text keeps at least 12px from the border"
      "padding and border count inside the width":
        uk: "padding і border входять у ширину (border-box)"
        en: "padding and border count inside the width (border-box)"
    hints:
      nudge:
        uk: "У картки `width: 100%`, тобто 260px. Що до цієї ширини додає браузер за `content-box`?"
        en: "The card has `width: 100%`, that is 260px. What does the browser add to that width under `content-box`?"
      explanation:
        uk: "Візьмімо панель `.panel { width: 100%; padding: 16px; border: 2px solid; }` у стовпці завширшки 300px: за `content-box` вона займе 300 + 32 + 4 = 336px. Перемкни для неї `box-sizing` на режим, який рахує відступи й рамку всередині ширини, — і панель займе рівно 300px. Межу зверху задає властивість `max-width`, і вона теж охоплює рамку лише в цьому режимі."
        en: "Take a panel, `.panel { width: 100%; padding: 16px; border: 2px solid; }`, in a column 300px wide: under `content-box` it takes 300 + 32 + 4 = 336px. Switch its `box-sizing` to the mode that counts padding and border inside the width — and the panel takes exactly 300px. The `max-width` property sets the upper limit, and it covers the border only in that mode too."
    solutionNote:
      uk: "`box-sizing: border-box` робить `width: 100%` справжньою шириною стовпця разом із відступами й рамкою, а `max-width: 360px` зупиняє картку на широкому екрані. За `content-box` той самий `max-width` обмежив би лише вміст, і картка займала б 360 + 48 = 408px."
      en: "`box-sizing: border-box` makes `width: 100%` the real width of the column, padding and border included, and `max-width: 360px` stops the card on a wide screen. Under `content-box` the same `max-width` would limit only the content, and the card would take 360 + 48 = 408px."
    feedback:
      - when: { test: "the card fits inside a narrow column" }
        message:
          uk: "Ця перевірка ставить картку в стовпці завширшки 260 і 220px і чекає, що її правий край не вийде за стовпець. Якщо виходить, перевір, чи не додаються `padding` і рамка зверху до ширини картки (`box-sizing`) і чи не заважає їй стиснутися фіксована ширина в px."
          en: "This check puts the card into columns 260 and 220px wide and expects its right edge to stay inside the column. If it sticks out, check whether `padding` and the border are added on top of the card’s width (`box-sizing`) and whether a fixed width in px stops it from shrinking."
      - when: { test: "the card never grows wider than 360px" }
        message:
          uk: "Ця перевірка ставить картку в стовпець завширшки 800px і чекає, що разом із рамкою вона займе не більше 360px. Межу зверху задає `max-width`, а рамку й відступи ця межа охоплює лише тоді, коли вони входять у ширину."
          en: "This check puts the card into a column 800px wide and expects it to take no more than 360px including the border. The upper limit comes from `max-width`, and it covers the border and the padding only when they count inside the width."
      - when: { test: "the text keeps comfortable spacing from the border" }
        message:
          uk: "Ця перевірка чекає внутрішній відступ (`padding`) картки щонайменше 12px з кожного боку. Зовнішній `margin` сюди не зараховується: він відсуває саму картку від сусідів."
          en: "This check expects the card’s inner spacing (`padding`) to be at least 12px on every side. An outer `margin` does not count: it moves the card itself away from its neighbors."
      - when: { test: "padding and border count inside the width" }
        message:
          uk: "Ця перевірка чекає, що властивість `box-sizing` картки має режим, у якому `padding` і рамка входять у ширину, а не додаються до неї."
          en: "This check expects the card’s `box-sizing` to be the mode in which `padding` and the border count inside the width instead of being added to it."

  - id: to-project
    kind: transfer
    capstoneStep: JS-06
    body:
      uk: "Картки твого проєкту теж мусять уміщатися і в широкому вікні, і у вузькому стовпці. Увімкни `border-box` для всіх елементів, обмеж картки через `max-width`, а відступи всередині картки задавай через `padding`."
      en: "Your project’s cards must fit both a wide window and a narrow column too. Turn on `border-box` for every element, limit the cards with `max-width`, and set the spacing inside a card with `padding`."
