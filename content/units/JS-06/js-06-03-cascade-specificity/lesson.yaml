id: js-06-03-cascade-specificity
unit: JS-06
title:
  uk: "Каскад і специфічність"
  en: "The cascade and specificity"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачити, яке оголошення перемагає для елемента: спершу порівнявши специфічність, а потім — порядок у файлі."
    en: "Predict which declaration wins for an element by comparing specificity first and source order second."
  - uk: "Відрізнити успадковувані властивості (`color`, `font`) від неуспадковуваних (`border`, `padding`) і розв’язати конфлікт, знизивши специфічність селектора замість `!important`."
    en: "Tell inherited properties (color, font) from non-inherited ones (border, padding), and fix a conflict by lowering a selector's specificity instead of adding !important."
prerequisites: [js-06-02-keyboard-focus-landmarks, js-01-08-css-selectors-text]
subskills:
  - { family: W-02, skill: "cascade/inheritance/specificity", depth: intro }
glossary: [cascade, specificity, css-inheritance, computed-style]
selfCheck: [button-color, expense-cards]

blocks:
  - id: which-rule-wins
    kind: explanation
    title:
      uk: "Каскад: хто перемагає"
      en: "The cascade: who wins"
    body:
      uk: |
        Коли кілька правил задають елементові ту саму властивість, браузер обирає одне значення. Цей відбір називають [[cascade|каскадом]]. Для правил твого файлу стилів він працює так:

        1. Порівнюється [[specificity|специфічність]] селекторів — наскільки точно вони вказують на елемент.
        2. Лише за **рівної** специфічності перемагає правило, записане нижче.

        Специфічність рахують трьома числами: **id · класи · теги**.

        | Селектор | id | класи | теги |
        |---|---|---|---|
        | `button` | 0 | 0 | 1 |
        | `.btn-primary` | 0 | 1 | 0 |
        | `main .btn` | 0 | 1 | 1 |
        | `#save` | 1 | 0 | 0 |

        Числа порівнюють зліва направо: один id переважає будь-яку кількість класів, а один клас — будь-яку кількість тегів.
      en: |
        When several rules give an element the same property, the browser picks one value. This selection is called the [[cascade]]. For the rules of your stylesheet it works like this:

        1. The [[specificity]] of the selectors is compared — how precisely they point at the element.
        2. Only when specificity is **equal** does the rule written lower win.

        Specificity is counted as three numbers: **ids · classes · tags**.

        | Selector | ids | classes | tags |
        |---|---|---|---|
        | `button` | 0 | 0 | 1 |
        | `.btn-primary` | 0 | 1 | 0 |
        | `main .btn` | 0 | 1 | 1 |
        | `#save` | 1 | 0 | 0 |

        The numbers are compared from left to right: one id beats any number of classes, and one class beats any number of tags.

  - id: button-color
    kind: prediction
    lang: css
    runnable: false
    prompt:
      uk: "Кнопку `<button id=\"save\" class=\"btn-primary btn-danger\">` стилізують чотири правила. Якого кольору буде її текст?"
      en: "The button `<button id=\"save\" class=\"btn-primary btn-danger\">` is styled by four rules. What color is its text?"
    code: |
      button { color: black; }
      .btn-primary { color: green; }
      #save { color: red; }
      .btn-danger { color: orange; }
    answer:
      type: choice
      options:
        - id: black
          text:
            uk: "Чорного: `button` стосується кожної кнопки"
            en: "Black: `button` applies to every button"
          why:
            uk: "Селектор тегу найслабший (0,0,1): будь-який клас чи id його перебиває."
            en: "A tag selector is the weakest (0,0,1): any class or id overrides it."
        - id: green
          text:
            uk: "Зеленого: `.btn-primary` — перший клас кнопки"
            en: "Green: `.btn-primary` is the button’s first class"
          why:
            uk: "Порядок класів в атрибуті `class` нічого не важить. Важать специфічність і порядок правил у файлі."
            en: "The order of classes in the `class` attribute does not matter. Specificity and the order of rules in the file do."
        - id: red
          text:
            uk: "Червоного"
            en: "Red"
        - id: orange
          text:
            uk: "Помаранчевого: це правило записане останнім"
            en: "Orange: that rule is written last"
          why:
            uk: "Порядок вирішує лише між однаково специфічними селекторами. `#save` має id (1,0,0) і перемагає обидва класи (0,1,0), хоч і стоїть вище."
            en: "Order decides only between equally specific selectors. `#save` has an id (1,0,0) and beats both classes (0,1,0), even though it stands higher."
      correct: [red]
    explanation:
      uk: "Усі чотири правила стосуються кнопки. Перша колонка специфічності — id — є лише в `#save`, тож він перемагає одразу, і до порядку правил справа не доходить. Якби правила `#save` не було, два класи мали б рівну специфічність 0,1,0, і тоді переміг би нижчий — `.btn-danger`."
      en: "All four rules apply to the button. Only `#save` has something in the first column of specificity — an id — so it wins at once, and the order of the rules never comes into play. Without the `#save` rule the two classes would tie at 0,1,0, and then the lower one, `.btn-danger`, would win."

  - id: specificity-ladder
    kind: visual
    visual: diagram
    title:
      uk: "Драбина специфічності й успадкування"
      en: "The specificity ladder and inheritance"
    textEquivalent:
      uk: >-
        Ліворуч стоять правила, що змагаються за колір кнопки button#save, впорядковані за специфічністю від
        найсильнішого: #save (1,0,0, червоний), .btn-danger (0,1,0, помаранчевий), .btn-primary (0,1,0, зелений) і button
        (0,0,1, чорний). Усі чотири стрілки ведуть до кнопки. Числа порівнюють зліва направо, тож id перемагає
        одразу: кнопка червона, хоч .btn-danger записане нижче у файлі. Якби правила з id не було, два класи
        зрівнялися б, і тоді вирішив би порядок у файлі — переміг би нижчий .btn-danger. Тег button програє будь-якому
        класу. Окремо внизу — успадкування: правило .panel задає color: navy, і абзац усередині панелі, якому жодне правило
        кольору не задає, теж стає синім. Рамка панелі не успадковується.
      en: >-
        On the left stand the rules competing for the color of the button button#save, ordered by specificity from the
        strongest: #save (1,0,0, red), .btn-danger (0,1,0, orange), .btn-primary (0,1,0, green) and button (0,0,1, black). All
        four arrows lead to the button. The numbers are compared from left to right, so the id wins at once: the button is red,
        although .btn-danger is written lower in the file. Without the id rule the two classes would tie, and then the file
        order would decide — the lower .btn-danger would win. The tag button loses to any class. Separately, at the bottom,
        there is inheritance: the .panel rule sets color: navy, and a paragraph inside the panel, which no rule colors, turns
        navy too. The panel’s border is not inherited.
    spec:
      layout: grid
      nodes:
        - { id: rule-id, label: "#save · 1,0,0 · red", col: 0, row: 0, w: 210 }
        - { id: rule-danger, label: ".btn-danger · 0,1,0 · orange", col: 0, row: 1, w: 210 }
        - { id: rule-primary, label: ".btn-primary · 0,1,0 · green", col: 0, row: 2, w: 210 }
        - { id: rule-type, label: "button · 0,0,1 · black", col: 0, row: 3, w: 210 }
        - { id: rule-panel, label: ".panel · color: navy", col: 0, row: 4, w: 210 }
        - { id: button, label: "button#save", shape: round, col: 1, row: 1, w: 90 }
        - { id: paragraph, label: "<p> …", shape: round, col: 1, row: 4, w: 90 }
      edges:
        - { from: rule-id, to: button }
        - { from: rule-danger, to: button }
        - { from: rule-primary, to: button }
        - { from: rule-type, to: button }
        - { from: rule-panel, to: paragraph, kind: dashed }
      steps:
        - caption:
            uk: "Чотири правила стосуються однієї кнопки `<button id=\"save\" class=\"btn-primary btn-danger\">`, і кожне задає `color`. Вони впорядковані за специфічністю: id · класи · теги."
            en: "Four rules apply to the same `<button id=\"save\" class=\"btn-primary btn-danger\">`, and each sets `color`. They are ordered by specificity: ids · classes · tags."
        - highlight: [rule-id, rule-id->button, button]
          dim: [rule-danger, rule-primary, rule-type, rule-danger->button, rule-primary->button, rule-type->button]
          caption:
            uk: "Порівнюємо зліва направо. Лише `#save` має одиницю в першій колонці — він перемагає, хоч `.btn-danger` записане нижче. Кнопка **червона**."
            en: "Compare from left to right. Only `#save` has a one in the first column — it wins, although `.btn-danger` is written lower. The button is **red**."
        - highlight: [rule-danger, rule-primary, rule-danger->button]
          dim: [rule-id, rule-type, rule-id->button, rule-type->button, rule-primary->button]
          caption:
            uk: "Прибери правило з id — і два класи зрівняються: 0,1,0 і 0,1,0. Лише тепер вирішує порядок у файлі: перемагає нижчий `.btn-danger`, кнопка стала б помаранчевою."
            en: "Remove the id rule, and the two classes tie: 0,1,0 and 0,1,0. Only now does the file order decide: the lower `.btn-danger` wins, and the button would turn orange."
        - highlight: [rule-type]
          dim: [rule-id, rule-danger, rule-primary, rule-id->button, rule-danger->button, rule-primary->button]
          caption:
            uk: "Тег `button` (0,0,1) програє будь-якому класу. Його колір дістанеться лише кнопкам, яких не стосується жодне правило з класом чи id."
            en: "The tag `button` (0,0,1) loses to any class. Its color reaches only buttons that no class or id rule applies to."
        - highlight: [rule-panel, rule-panel->paragraph, paragraph]
          dim: [rule-id, rule-danger, rule-primary, rule-type, button, rule-id->button, rule-danger->button, rule-primary->button, rule-type->button]
          caption:
            uk: "Успадкування: `.panel` задає `color: navy`. Абзац усередині панелі кольору від жодного правила не отримує — і **успадковує** синій від батька. А от рамка панелі на абзац не переходить: `border` не успадковується."
            en: "Inheritance: `.panel` sets `color: navy`. The paragraph inside the panel gets no color from any rule — so it **inherits** navy from its parent. The panel’s border does not pass to the paragraph: `border` is not inherited."

  - id: inheritance
    kind: explanation
    title:
      uk: "Успадкування й обчислений стиль"
      en: "Inheritance and the computed style"
    body:
      uk: |
        Деякі властивості **успадковуються**: елемент отримує значення від батька, якщо жодне правило не задає йому цієї властивості. Це [[css-inheritance|успадкування]]. Так передаються властивості тексту: `color`, `font-family`, `font-size`, `line-height`, `text-align`.

        Рамки, відступи й тло (`border`, `padding`, `margin`, `background`) не успадковуються — інакше рамка секції повторилася б навколо кожного абзацу в ній.

        Остаточне значення кожної властивості — [[computed-style|обчислений стиль]] — показують інструменти розробника: **Перевірити** → вкладка **Computed**. Вкладка **Styles** показує всі правила, що змагалися, і закреслює оголошення, які програли.
      en: |
        Some properties are **inherited**: an element takes the value from its parent if no rule gives it that property. This is [[css-inheritance|inheritance]]. Text properties pass down this way: `color`, `font-family`, `font-size`, `line-height`, `text-align`.

        Borders, spacing and backgrounds (`border`, `padding`, `margin`, `background`) are not inherited — otherwise a section’s border would repeat around every paragraph inside it.

        The final value of every property — the [[computed-style|computed style]] — is shown in the developer tools: **Inspect** → the **Computed** tab. The **Styles** tab shows all the rules that competed and strikes through the declarations that lost.

  - id: save-button
    kind: example
    runtime: browser-js
    dir: save-button
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер витрат", en: "Expense tracker" }
      week: { uk: "Цей тиждень", en: "This week" }
      total: { uk: "Разом:", en: "Total:" }
      currency: { uk: "грн", en: "UAH" }
      add: { uk: "Додати витрату", en: "Add expense" }
      clear: { uk: "Скинути фільтри", en: "Reset filters" }
    title:
      uk: "Чому кнопка не зеленіє"
      en: "Why the button does not turn green"
    body:
      uk: |
        Команда вирішила, що головні кнопки мають бути зеленими, і дописала правило `.btn-primary` у кінець `styles.css`. Запусти: «Додати витрату» досі червона.

        Клацни по кнопці правою кнопкою миші → **Перевірити**. На вкладці **Styles** видно обидва правила; фон і колір із `.btn-primary` закреслено.
      en: |
        The team decided that primary buttons should be green and added a `.btn-primary` rule at the end of `styles.css`. Run it: “Add expense” is still red.

        Right-click the button → **Inspect**. The **Styles** tab shows both rules; the background and color from `.btn-primary` are struck through.
    tryIt:
      uk: "1) Допиши `!important` до фону в `.btn-primary`: кнопка позеленіє — але тепер жодне звичайне правило цей фон уже не змінить. Прибери `!important`. 2) Правильний ремонт: видали правило `#add-expense` — і `.btn-primary` переможе без жодних хитрощів. 3) Подивись на секцію: заголовок і текст усередині неї сині — успадкували `color`. А рамка є лише навколо самої секції."
      en: "1) Add `!important` to the background in `.btn-primary`: the button turns green — but now no normal rule can change that background anymore. Remove `!important`. 2) The proper repair: delete the `#add-expense` rule — and `.btn-primary` wins without any tricks. 3) Look at the section: the heading and the text inside it are blue — they inherited `color`. The border, however, surrounds only the section itself."

  - id: no-important
    kind: explanation
    title:
      uk: "Знижуй специфічність замість !important"
      en: "Lower specificity instead of !important"
    body:
      uk: |
        Коли стиль «не застосовується», хочеться дописати `!important`. Таке оголошення перебиває всі звичайні, хоч би якими точними були їхні селектори. Але наступна зміна знову не застосується, і знадобиться ще один `!important` — це війна, яку стилі програють.

        Спокійніший шлях — тримати специфічність низькою й однаковою:

        - стилізуй **класами**, а не id: `.btn-primary`, а не `#add-expense`;
        - пиши короткі селектори з одного класу;
        - загальні правила став вище, а уточнення — **модифікатори** на кшталт `.btn-danger` — нижче. За рівної специфічності тоді завжди перемагає уточнення.
      en: |
        When a style “does not apply”, it is tempting to add `!important`. Such a declaration overrides all normal ones, however precise their selectors. But the next change will not apply either, and you will need another `!important` — a war your styles lose.

        The calmer way is to keep specificity low and equal:

        - style with **classes**, not ids: `.btn-primary`, not `#add-expense`;
        - write short selectors of a single class;
        - put general rules higher and refinements — **modifiers** such as `.btn-danger` — lower. With equal specificity the refinement then always wins.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: з чого складається правило"
      en: "Recall: what a rule is made of"
    items:
      - id: missing-semicolon
        from: js-01-08-css-selectors-text
        lang: css
        runnable: false
        prompt:
          uk: "Це правило не змінює заголовок узагалі: ні колір, ні вирівнювання. Чому?"
          en: "This rule does not change the heading at all: neither the color nor the alignment. Why?"
        code: |
          h1 {
            color: teal
            text-align: center;
          }
        answer:
          type: choice
          options:
            - id: semicolon
              text:
                uk: "Між оголошеннями бракує крапки з комою, тож браузер відкидає обидва"
                en: "A semicolon is missing between the declarations, so the browser drops both"
            - id: selector
              text:
                uk: "Селектор має бути `.h1`"
                en: "The selector must be `.h1`"
              why:
                uk: "`h1` — селектор тегу, він знаходить усі `<h1>`. Крапка означала б клас `h1`."
                en: "`h1` is a tag selector that finds every `<h1>`. A dot would mean a class called `h1`."
            - id: one-property
              text:
                uk: "В одному правилі можна задати лише одну властивість"
                en: "A rule can set only one property"
              why:
                uk: "У фігурних дужках може бути скільки завгодно оголошень — кожне закінчується крапкою з комою."
                en: "The curly braces can hold any number of declarations — each ending with a semicolon."
            - id: specificity
              text:
                uk: "Його перебиває правило браузера для заголовків"
                en: "The browser’s own heading rule overrides it"
              why:
                uk: "Правила твого файлу стилів сильніші за вбудовані стилі браузера. Проблема в самому правилі."
                en: "Your stylesheet’s rules are stronger than the browser’s built-in styles. The problem is in the rule itself."
          correct: [semicolon]
        explanation:
          uk: "Правило — це селектор і оголошення `властивість: значення;`. Без крапки з комою браузер читає `teal text-align: center` як одне значення кольору, не розуміє його й відкидає все оголошення."
          en: "A rule is a selector plus declarations of the form `property: value;`. Without the semicolon the browser reads `teal text-align: center` as a single color value, cannot understand it and drops the whole declaration."

  - id: expense-cards
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: expense-cards
    entry: index.html
    editable: [styles.css]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Витрати за тиждень", en: "This week’s expenses" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      currency: { uk: "грн", en: "UAH" }
    title:
      uk: "Картки витрат із модифікатором"
      en: "Expense cards with a modifier"
    instructions:
      uk: |
        HTML уже готовий: три картки `.expense`, а велика витрата має ще й класи-модифікатори `expense-large` і `amount-large`. Пиши лише в `styles.css`, у порядку коментарів:

        1. `.expense` — рамка, внутрішній відступ (`padding`) і світле тло для кожної картки.
        2. `.amount` — кожна сума жирна й темно-сіра (`#333`).
        3. `.expense-large` — рамка картки великої витрати іншого, помітного кольору.
        4. `.amount-large` — її сума червона.

        Лише селектори з класів і **без `!important`**: модифікатор має перемагати базове правило тим, що стоїть нижче.
      en: |
        The HTML is ready: three `.expense` cards, and the large expense also has the modifier classes `expense-large` and `amount-large`. Write only in `styles.css`, in the order of the comments:

        1. `.expense` — a border, inner spacing (`padding`) and a light background for every card.
        2. `.amount` — every amount is bold and dark gray (`#333`).
        3. `.expense-large` — the card of a large expense gets a border of another, noticeable color.
        4. `.amount-large` — its amount is red.

        Use class selectors only and **no `!important`**: the modifier must beat the base rule by standing lower.
    testTitles:
      "every card has a border and inner spacing":
        uk: "Кожна картка має рамку й внутрішній відступ"
        en: "Every card has a border and inner spacing"
      "every amount is bold":
        uk: "Кожна сума жирна"
        en: "Every amount is bold"
      "the large card has an accent border":
        uk: "Рамка картки великої витрати іншого кольору"
        en: "The large expense’s card has a border of another color"
      "the large amount is red while the other amounts stay dark gray":
        uk: "Велика сума виділена кольором, решта — темно-сірі"
        en: "The large amount has its own color, the rest stay dark gray"
      "the styles follow the classes, not the position of a card":
        uk: "Стилі прив’язані до класів, а не до місця картки"
        en: "The styles follow the classes, not the position of a card"
      "no declaration uses !important":
        uk: "Жодне оголошення не має !important"
        en: "No declaration uses !important"
    hints:
      nudge:
        uk: "Селектори `.expense` і `.expense-large` однаково специфічні. Що тоді вирішує, яке з них переможе?"
        en: "The selectors `.expense` and `.expense-large` are equally specific. What decides which one wins then?"
      explanation:
        uk: "За рівної специфічності перемагає правило, записане нижче. Тож спершу базові `.expense { border: 2px solid #cbd5e0; padding: 12px 16px; background: #f7fafc; }` і `.amount { font-weight: bold; color: #333; }`, а під ними модифікатори `.expense-large { border-color: #c53030; }` і `.amount-large { color: #c53030; }`."
        en: "With equal specificity the rule written lower wins. So first the base rules `.expense { border: 2px solid #cbd5e0; padding: 12px 16px; background: #f7fafc; }` and `.amount { font-weight: bold; color: #333; }`, and under them the modifiers `.expense-large { border-color: #c53030; }` and `.amount-large { color: #c53030; }`."
    solutionNote:
      uk: "Усі селектори мають специфічність 0,1,0, тому перемагає нижчий. Модифікатор змінює лише те, що відрізняється (колір рамки й суми), а решту бере з базового правила. Нова картка з тими самими класами одразу виглядатиме правильно — стилі прив’язані до класів, а не до id чи місця на сторінці."
      en: "All selectors have specificity 0,1,0, so the lower one wins. A modifier changes only what differs (the border and amount color) and takes everything else from the base rule. A new card with the same classes looks right at once — the styles follow classes, not ids or the place on the page."
    feedback:
      - when: { test: "every card has a border and inner spacing" }
        message:
          uk: "Правилу `.expense` потрібні і рамка (наприклад, `border: 2px solid #cbd5e0;`), і `padding`."
          en: "The `.expense` rule needs both a border (for example `border: 2px solid #cbd5e0;`) and `padding`."
      - when: { test: "every amount is bold" }
        message:
          uk: "Додай у `.amount` оголошення `font-weight: bold;`."
          en: "Add the declaration `font-weight: bold;` to `.amount`."
      - when: { test: "the large card has an accent border" }
        message:
          uk: "Колір рамки великої картки такий самий, як у звичайної. Якщо `.expense-large` стоїть вище за `.expense`, скорочення `border` у базовому правилі перезаписує колір — перенеси модифікатор нижче."
          en: "The large card’s border has the same color as a plain one. If `.expense-large` stands above `.expense`, the `border` shorthand in the base rule overwrites the color — move the modifier lower."
      - when: { test: "the large amount is red while the other amounts stay dark gray" }
        message:
          uk: "Звичайні суми мають бути `#333`, а велика — іншого кольору. Однакова специфічність означає: правило `.amount-large` має стояти **під** `.amount`."
          en: "Plain amounts must be `#333`, and the large one another color. Equal specificity means the `.amount-large` rule must stand **below** `.amount`."
      - when: { test: "the styles follow the classes, not the position of a card" }
        message:
          uk: "Нова картка з класами `expense expense-large` виглядає не так, як велика картка на сторінці. Стилізуй модифікатор його класом, а не позицією (`:nth-of-type`) чи id."
          en: "A new card with the classes `expense expense-large` does not look like the large card on the page. Style the modifier by its class, not by position (`:nth-of-type`) or id."
      - when: { test: "no declaration uses !important" }
        message:
          uk: "Прибери `!important` і натомість постав правила-модифікатори нижче за базові."
          en: "Remove `!important` and put the modifier rules below the base rules instead."

  - id: to-project
    kind: transfer
    capstoneStep: JS-06
    body:
      uk: "Картки твого проєкту стилізуй так само: базовий клас для кожної картки й модифікатори для особливих станів — отримане бажання, виконана справа, пауза звички чи велика витрата. Без id у стилях і без `!important`."
      en: "Style your project’s cards the same way: a base class for every card and modifiers for special states — an acquired wish, a finished task, a paused habit or a large expense. No ids in the styles and no `!important`."
