<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <style>
      :root {
        --space: 0.75rem;
        --radius: 8px;
        --border: #718096;
        --text: #1a202c;
        --error: #9b2c2c;
        --focus: #2c5282;
      }
      body { margin: 0; font-family: system-ui, sans-serif; font-size: 1rem; line-height: 1.5; color: var(--text); }
      header, main { padding: var(--space) calc(var(--space) * 2); }
      nav ul { display: flex; flex-wrap: wrap; gap: var(--space); list-style: none; padding: 0; margin: 0; }
      form { display: flex; flex-wrap: wrap; gap: var(--space); align-items: start; }
      .field { display: flex; flex-direction: column; }
      .error { color: var(--error); margin: 0; min-height: 1.5em; }
      button, input { font: inherit; }
      #habits { list-style: none; padding: 0; display: grid; gap: var(--space); grid-template-columns: repeat(2, 1fr); }
      #habits li { box-sizing: border-box; padding: var(--space); border: 1px solid var(--border); border-radius: var(--radius); overflow-wrap: anywhere; }
      #habits li:focus-within { box-shadow: 0 0 0 3px var(--focus); }
      #habits button { margin-right: calc(var(--space) / 2); }
      @media (prefers-reduced-motion: no-preference) {
        #habits li { transition: box-shadow 0.2s; }
      }
      table { border-collapse: collapse; margin-top: var(--space); }
      th, td { border: 1px solid var(--border); padding: calc(var(--space) / 2) var(--space); text-align: left; }
      caption { text-align: left; font-weight: bold; }
      :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>%%title%%</h1>
      <nav aria-label="%%navLabel%%">
        <ul>
          <li><a href="#habit-form">%%navForm%%</a></li>
          <li><a href="#habits-title">%%navList%%</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <form id="habit-form" novalidate>
        <div class="field">
          <label for="name">%%nameLabel%%</label>
          <input id="name" name="name" aria-describedby="name-error">
          <p id="name-error" class="error"></p>
        </div>
        <div class="field">
          <label for="minutes">%%minutesLabel%%</label>
          <input id="minutes" name="minutes" type="number" aria-describedby="minutes-error">
          <p id="minutes-error" class="error"></p>
        </div>
        <button type="submit">%%save%%</button>
      </form>
      <h2 id="habits-title" tabindex="-1">%%listTitle%%</h2>
      <ul id="habits"></ul>
      <table id="summary">
        <caption>%%summary%%</caption>
        <thead>
          <tr><th scope="col">%%countHeader%%</th><th scope="col">%%minutesHeader%%</th></tr>
        </thead>
        <tbody>
          <tr><td id="summary-count"></td><td id="summary-minutes"></td></tr>
        </tbody>
      </table>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
