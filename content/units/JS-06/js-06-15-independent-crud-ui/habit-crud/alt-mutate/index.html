<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <style>
      /* Another valid approach: auto-fill columns instead of a media query, messages created by code,
         the summary table built by code and the habits array changed in place. */
      :root {
        --gap: 1rem;
        --pad: 0.75rem;
        --line: #4a5568;
        --danger: #9b2c2c;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 0 var(--gap); font-family: system-ui, sans-serif; line-height: 1.45; color: #1a202c; }
      nav a { margin-right: var(--gap); }
      .field { margin-bottom: var(--pad); }
      .field label { display: block; font-weight: 600; }
      .message { color: var(--danger); margin: 0.25rem 0 0; }
      button, input { font: inherit; }
      #habits {
        list-style: none;
        padding: 0;
        display: grid;
        gap: var(--gap);
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr));
      }
      #habits > li { padding: var(--pad); border: 2px solid var(--line); border-radius: 6px; overflow-wrap: anywhere; }
      #habits > li:hover { transform: translateY(-2px); }
      @media (prefers-reduced-motion: no-preference) {
        #habits > li { transition: transform 150ms ease-out; }
      }
      th, td { border: 1px solid var(--line); padding: 0.25rem var(--pad); }
      :focus-visible { outline: 3px solid #2b6cb0; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>%%title%%</h1>
      <nav aria-label="%%navLabel%%">
        <a href="#habit-form">%%navForm%%</a>
        <a href="#habits-title">%%navList%%</a>
      </nav>
    </header>
    <main>
      <form id="habit-form" novalidate>
        <div class="field">
          <label for="name">%%nameLabel%%</label>
          <input id="name" name="name">
        </div>
        <div class="field">
          <label for="minutes">%%minutesLabel%%</label>
          <input id="minutes" name="minutes" type="number">
        </div>
        <button type="submit">%%save%%</button>
      </form>
      <h2 id="habits-title" tabindex="-1">%%listTitle%%</h2>
      <ul id="habits"></ul>
      <div id="summary-area"></div>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
