id: js-06-15-independent-crud-ui
unit: JS-06
title:
  uk: "Самостійно: доступний CRUD-інтерфейс із делегуванням"
  en: "Independent: accessible CRUD UI with delegation"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Самостійно зібрати все з цього розділу в одному інтерфейсі — розмітку з орієнтирами, форму з підписами й перевіркою, рендеринг із даних, делегування, керування фокусом і стилі, що витримують вузьке вікно, масштаб 200% і запит на менше руху, — і показати, що ним можна користуватися лише клавіатурою."
  en: "Bring everything from this unit together in one interface on your own — markup with landmarks, a form with labels and validation, rendering from data, delegation, focus management and styles that survive a narrow window, 200% zoom and a request for less motion — and show that it can be used with the keyboard only."
objectives:
  - uk: "Без підказок побудувати доступний CRUD-інтерфейс для синтетичних записів: орієнтири, форма з підписами, один делегований слухач списку, безпечне виведення тексту й адаптивна сітка карток."
    en: "Build, without hints, an accessible CRUD interface for synthetic records with landmarks, a labeled form, one delegated list listener, safe text rendering and a responsive card layout."
  - uk: "Показати створення, редагування й видалення лише клавіатурою та роботу при масштабі 200%."
    en: "Demonstrate keyboard-only create, edit and delete and a 200% zoom check."
prerequisites: [js-06-14-debug-dom-defects]
subskills:
  - { family: W-03, skill: "query/create/update/remove nodes", depth: assess }
  - { family: W-03, skill: "safe text vs HTML", depth: assess }
  - { family: W-03, skill: "default behavior", depth: assess }
  - { family: W-01, skill: "document structure/headings/landmarks", depth: assess }
  - { family: W-01, skill: "keyboard focus", depth: assess }
  - { family: W-01, skill: "tables/images/alt", depth: assess }
  - { family: W-01, skill: "safe accessible form semantics", depth: assess }
  - { family: W-02, skill: "box model/sizing", depth: assess }
  - { family: W-02, skill: "Flexbox/Grid", depth: assess }
  - { family: W-02, skill: "spacing/typography", depth: assess }
  - { family: W-02, skill: "responsive media queries", depth: assess }
  - { family: W-02, skill: "reduced motion", depth: assess }
  - { family: W-02, skill: "maintainable styles", depth: assess }
glossary: []

blocks:
  - id: the-task
    kind: explanation
    title:
      uk: "Що перевіряє цей урок"
      en: "What this lesson checks"
    body:
      uk: |
        Тут ти працюєш **без підказок**: лише умова, редактор і перевірки. Знадобиться все з цього розділу: орієнтири й заголовки, форма з підписами, перевірка полів, `render` із даних, делегування, фокус після змін, каскад, Grid чи Flexbox, власні властивості, медіазапити й менше руху на запит.

        Перевірки працюють так, як працювала б людина **лише з клавіатурою**: ставлять фокус, натискають Enter, заповнюють поля. Вони відкривають копію сторінки у вікні шириною 320px — таким воно стає при масштабі 200% у вузькій панелі — і в ширшому вікні. А ще додають звичку, у назві якої є HTML-розмітка.

        Якщо перевірка не проходить, прочитай її назву й повідомлення: вони кажуть, *що* очікувалося, а не *як* це написати. Перш ніж здавати, пройди сам чотири перевірки з попереднього уроку: мишею, клавіатурою, деревом доступності, стилями й масштабом.
      en: |
        Here you work **without hints**: just the task, the editor and the checks. You will need everything from this unit: landmarks and headings, a form with labels, field validation, `render` from data, delegation, focus after changes, the cascade, Grid or Flexbox, custom properties, media queries and less motion on request.

        The checks work the way a person using **the keyboard only** would: they put focus, press Enter, fill in fields. They open a copy of the page in a 320px wide window — which is what it becomes at 200% zoom in a narrow panel — and in a wider window. They also add a habit whose name contains HTML markup.

        If a check fails, read its title and message: they say *what* was expected, not *how* to write it. Before you hand it in, run the four checks from the previous lesson yourself: with a mouse, with the keyboard, with the accessibility tree, with styles and zoom.

  - id: habit-crud
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: habit-crud
    entry: index.html
    editable: [index.html, index.js]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер звичок", en: "Habit tracker" }
      navLabel: { uk: "Розділи", en: "Sections" }
      navForm: { uk: "Нова звичка", en: "New habit" }
      navList: { uk: "Мої звички", en: "My habits" }
      nameLabel: { uk: "Назва звички", en: "Habit name" }
      minutesLabel: { uk: "Хвилин на день", en: "Minutes a day" }
      save: { uk: "Зберегти", en: "Save" }
      listTitle: { uk: "Мої звички", en: "My habits" }
      summary: { uk: "Підсумок", en: "Summary" }
      countHeader: { uk: "Звичок", en: "Habits" }
      minutesHeader: { uk: "Хвилин на день", en: "Minutes a day" }
      habit1: { uk: "Читати", en: "Read" }
      habit2: { uk: "Розтяжка", en: "Stretching" }
      minutesShort: { uk: "хв", en: "min" }
      edit: { uk: "Редагувати", en: "Edit" }
      delete: { uk: "Видалити", en: "Delete" }
      nameRequired: { uk: "Введи назву звички", en: "Enter the habit name" }
      minutesRange: { uk: "Від 1 до 240 хвилин", en: "From 1 to 240 minutes" }
      added: { uk: "Пити воду", en: "Drink water" }
      added2: { uk: "Медитація", en: "Meditation" }
      added3: { uk: "Прогулянка", en: "Walk" }
      renamed: { uk: "Читати вголос", en: "Read aloud" }
    title:
      uk: "Трекер звичок: створити, змінити, видалити"
      en: "Habit tracker: create, edit, delete"
    instructions:
      uk: |
        Збудуй трекер звичок у `index.html` (розмітка й стилі в `<style>`) та `index.js`. Початкові дані — масив `habits` в `index.js`; назву `habits` не змінюй і тримай у ньому актуальні записи.

        **Структура.** `<header>` з єдиним на сторінці `<h1>` і `<nav>` із посиланнями на форму й список; решта — у `<main>`.

        **Форма** `#habit-form` з атрибутом `novalidate`:

        - поля `#name` (назва) і `#minutes` (хвилин на день), кожне з підписом, і кнопка надсилання з `type="submit"`;
        - надсилання — кнопкою чи Enter у полі — скасовує типову дію й перевіряє поля сам: назва не порожня, хвилини — ціле число від 1 до 240;
        - якщо є помилки: нічого не додається, біля кожного хибного поля з’являється повідомлення, пов’язане з ним через `aria-describedby`, а фокус переходить на перше хибне поле;
        - якщо помилок немає: повідомлення зникають, звичка додається (або зберігається відредагована), форма очищується.

        **Список** `#habits` (`<ul>`): для кожної звички — `<li data-id="…">` з назвою й хвилинами, виведеними як текст, і двома кнопками `type="button"` з `data-action="edit"` і `data-action="delete"`, чиї доступні імена містять «Редагувати» чи «Видалити» і назву звички. Обидві дії обслуговує **один** слухач на `#habits`.

        - «Редагувати» заповнює форму цією звичкою й ставить фокус у `#name`; наступне вдале надсилання змінює саме цю звичку, а не додає нову.
        - «Видалити» прибирає звичку й переводить фокус на «Видалити» наступної звички, якщо її немає — попередньої, якщо список порожній — на заголовок списку з `tabindex="-1"`.

        **Підсумок** — таблиця `#summary` з `<caption>`, рядком заголовків `<th scope="col">` і рядком, де стоять кількість звичок і сума хвилин. Вона оновлюється після кожної зміни.

        **Стилі:**

        - власні властивості (наприклад, `--space`) задають відступи, і правила для `#habits` чи карток ними користуються;
        - `#habits` — Grid або Flexbox: одна колонка карток у вікні шириною 320px, дві й більше — від 760px, без горизонтальної прокрутки;
        - картки з `box-sizing: border-box`, `line-height` тексту сторінки — щонайменше 1.4;
        - у карток є короткий перехід (`transition`), увімкнений лише тоді, коли людина не просила менше руху.
      en: |
        Build a habit tracker in `index.html` (markup, and styles in `<style>`) and `index.js`. The starting data is the `habits` array in `index.js`; keep the name `habits` and keep the current records in it.

        **Structure.** A `<header>` with the page’s only `<h1>` and a `<nav>` with links to the form and the list; everything else in `<main>`.

        **The form** `#habit-form` with the `novalidate` attribute:

        - fields `#name` (the name) and `#minutes` (minutes a day), each with a label, and a submit button with `type="submit"`;
        - submitting — with the button or Enter in a field — cancels the default action and checks the fields itself: the name is not empty, the minutes are a whole number from 1 to 240;
        - if there are errors: nothing is added, a message appears next to every wrong field, tied to it with `aria-describedby`, and focus moves to the first wrong field;
        - if there are none: the messages disappear, the habit is added (or the edited one saved), and the form is cleared.

        **The list** `#habits` (a `<ul>`): for every habit an `<li data-id="…">` with the name and minutes put in as text, and two `type="button"` buttons with `data-action="edit"` and `data-action="delete"` whose accessible names contain “Edit” or “Delete” and the habit’s name. **One** listener on `#habits` serves both actions.

        - “Edit” fills the form with this habit and puts focus into `#name`; the next successful submit changes exactly this habit instead of adding a new one.
        - “Delete” removes the habit and moves focus to “Delete” of the next habit, if there is none — of the previous one, if the list is empty — to the list heading with `tabindex="-1"`.

        **The summary** — a table `#summary` with a `<caption>`, a header row of `<th scope="col">` and a row holding the number of habits and the sum of minutes. It is updated after every change.

        **Styles:**

        - custom properties (for example, `--space`) set the spacing, and the rules for `#habits` or its cards use them;
        - `#habits` is Grid or Flexbox: one column of cards in a 320px wide window, two or more from 760px, with no horizontal scrolling;
        - cards with `box-sizing: border-box`, the page text’s `line-height` at least 1.4;
        - the cards have a short `transition`, switched on only when the person has not asked for less motion.
    testTitles:
      "the page has header, nav and main landmarks and one h1 in the header":
        uk: "На сторінці є header, nav і main та один h1 у header"
        en: "The page has header, nav and main landmarks and one h1 in the header"
      "the form fields have labels and the form has a submit button":
        uk: "Поля форми мають підписи, а форма — кнопку надсилання"
        en: "The form fields have labels and the form has a submit button"
      "on load every habit is a card with its name, minutes and named buttons":
        uk: "Після запуску кожна звичка — картка з назвою, хвилинами й названими кнопками"
        en: "On load every habit is a card with its name, minutes and named buttons"
      "the summary table shows the number of habits and the total minutes":
        uk: "Таблиця підсумку показує кількість звичок і суму хвилин"
        en: "The summary table shows the number of habits and the total minutes"
      "the cards are a Grid or Flexbox layout with one column at 320px and two or more at 760px":
        uk: "Картки — це Grid чи Flexbox: одна колонка при 320px, дві й більше при 760px"
        en: "The cards are a Grid or Flexbox layout: one column at 320px, two or more at 760px"
      "custom properties define the spacing and the list layout uses them":
        uk: "Власні властивості задають відступи, і їх використовує розкладка списку"
        en: "Custom properties set the spacing, and the list layout uses them"
      "cards use border-box sizing and the body text has a line-height of at least 1.4":
        uk: "Картки мають border-box, а текст сторінки — line-height щонайменше 1.4"
        en: "Cards use border-box, and the page text has a line-height of at least 1.4"
      "cards move only when the person has not asked to reduce motion":
        uk: "Картки рухаються, лише коли людина не просила менше руху"
        en: "Cards move only when the person has not asked for less motion"
      "Enter in the form adds a habit and the default action is prevented":
        uk: "Enter у формі додає звичку, а типову дію скасовано"
        en: "Enter in the form adds a habit, and the default action is cancelled"
      "a name with markup is shown as text":
        uk: "Назва з розміткою показується як текст"
        en: "A name with markup is shown as text"
      "invalid input shows messages next to the fields, adds nothing and focuses the first invalid field":
        uk: "Хибні дані: повідомлення біля полів, нічого не додано, фокус на першому хибному полі"
        en: "Invalid input: messages next to the fields, nothing added, focus on the first invalid field"
      "Edit with the keyboard fills the form and the next submit updates the same habit":
        uk: "«Редагувати» з клавіатури заповнює форму, і наступне надсилання змінює ту саму звичку"
        en: "Edit with the keyboard fills the form, and the next submit updates the same habit"
      "Delete with the keyboard removes one habit and moves the focus to the next Delete button":
        uk: "«Видалити» з клавіатури прибирає одну звичку й переводить фокус на наступну кнопку «Видалити»"
        en: "Delete with the keyboard removes one habit and moves focus to the next Delete button"
    solutionNote:
      uk: "Дані живуть у масиві `habits`, а `render` щоразу будує з нього картки й підсумок через `createElement` і `textContent`. Слухачі `submit` і делегований слухач списку додаються один раз. Перевірка повертає об’єкт помилок, повідомлення пов’язані з полями через `aria-describedby`, а фокус після помилки, редагування й видалення переходить туди, де людина продовжить. Сітка карток спирається на власні властивості, змінюється медіазапитом, а перехід увімкнено лише для `prefers-reduced-motion: no-preference`."
      en: "The data lives in the `habits` array, and `render` builds the cards and the summary from it each time with `createElement` and `textContent`. The `submit` listener and the delegated list listener are added once. Validation returns an errors object, the messages are tied to the fields with `aria-describedby`, and after an error, an edit or a delete focus moves to where the person will carry on. The card grid rests on custom properties, changes with a media query, and the transition is on only for `prefers-reduced-motion: no-preference`."
    feedback:
      - when: { test: "the page has header, nav and main landmarks and one h1 in the header" }
        message:
          uk: "Ця перевірка чекає на сторінці елементи `<header>`, `<nav>` і `<main>` та рівно один `<h1>`, і той — усередині `<header>`."
          en: "This check expects `<header>`, `<nav>` and `<main>` elements on the page and exactly one `<h1>`, inside the `<header>`."
      - when: { test: "the form fields have labels and the form has a submit button" }
        message:
          uk: "Ця перевірка чекає форму `#habit-form`, поля `#name` і `#minutes` з доступними іменами (наприклад, через `<label for>`) і кнопку з `type=\"submit\"` у формі."
          en: "This check expects the form `#habit-form`, the fields `#name` and `#minutes` with accessible names (for example, through `<label for>`) and a button with `type=\"submit\"` in the form."
      - when: { test: "on load every habit is a card with its name, minutes and named buttons" }
        message:
          uk: "Ця перевірка чекає в `#habits` по одному `<li>` на кожну звичку з масиву `habits`, у тому самому порядку: з `data-id`, назвою й хвилинами та двома кнопками `type=\"button\"` з `data-action` `edit` і `delete`, чиї доступні імена містять «Редагувати» чи «Видалити» і назву звички."
          en: "This check expects one `<li>` in `#habits` for every habit in the `habits` array, in the same order: with a `data-id`, the name and minutes, and two `type=\"button\"` buttons with `data-action` `edit` and `delete` whose accessible names contain “Edit” or “Delete” and the habit’s name."
      - when: { test: "the summary table shows the number of habits and the total minutes" }
        message:
          uk: "Ця перевірка чекає елемент `<table id=\"summary\">` з непорожнім `<caption>`, щонайменше двома `<th scope=\"col\">` і клітинками, що починаються з кількості звичок і з суми їхніх хвилин."
          en: "This check expects a `<table id=\"summary\">` with a non-empty `<caption>`, at least two `<th scope=\"col\">` and cells that start with the number of habits and with the sum of their minutes."
      - when: { test: "the cards are a Grid or Flexbox layout with one column at 320px and two or more at 760px" }
        message:
          uk: "Ця перевірка чекає, що `#habits` має `display` grid чи flex, а копія сторінки показує одну колонку карток без горизонтальної прокрутки у вікні шириною 320px і щонайменше дві колонки у вікні 760px."
          en: "This check expects `#habits` to have `display` grid or flex, and a copy of the page to show one column of cards without horizontal scrolling in a 320px wide window and at least two columns in a 760px window."
      - when: { test: "custom properties define the spacing and the list layout uses them" }
        message:
          uk: "Ця перевірка шукає в стилях правило, що задає власну властивість (`--…`), і правило для `#habits` чи його карток, що використовує її через `var(--…)`."
          en: "This check looks in the styles for a rule that defines a custom property (`--…`) and a rule for `#habits` or its cards that uses one through `var(--…)`."
      - when: { test: "cards use border-box sizing and the body text has a line-height of at least 1.4" }
        message:
          uk: "Ця перевірка чекає, що обчислений `box-sizing` картки — `border-box`, а обчислений `line-height` елемента `body`, поділений на його `font-size`, — щонайменше 1.4."
          en: "This check expects a card’s computed `box-sizing` to be `border-box`, and the computed `line-height` of `body` divided by its `font-size` to be at least 1.4."
      - when: { test: "cards move only when the person has not asked to reduce motion" }
        message:
          uk: "Ця перевірка імітує обидва налаштування руху: без запиту картка має мати `transition` чи анімацію, а з `prefers-reduced-motion: reduce` — жодного руху."
          en: "This check imitates both motion settings: with no request a card must have a `transition` or an animation, and with `prefers-reduced-motion: reduce` no motion at all."
      - when: { test: "Enter in the form adds a habit and the default action is prevented" }
        message:
          uk: "Ця перевірка заповнює поля й натискає Enter у полі хвилин, а потім надсилає форму ще раз. Вона чекає щоразу на одну нову картку в кінці списку і скасовану типову дію надсилання."
          en: "This check fills in the fields and presses Enter in the minutes field, then submits the form once more. It expects one new card at the end of the list each time and the submit’s default action cancelled."
      - when: { test: "a name with markup is shown as text" }
        message:
          uk: "Ця перевірка додає звичку з назвою `<img src=\"x\" onerror=\"…\">` і чекає, що назва видна як текст, елемента `<img>` у списку немає, а код із назви не виконується."
          en: "This check adds a habit named `<img src=\"x\" onerror=\"…\">` and expects the name to show as text, no `<img>` element in the list and the code in the name not to run."
      - when: { test: "invalid input shows messages next to the fields, adds nothing and focuses the first invalid field" }
        message:
          uk: "Ця перевірка надсилає форму з порожньою назвою й нулем хвилин. Вона чекає, що карток не додалося, обидва поля мають непорожні повідомлення через `aria-describedby`, а фокус — у `#name`. Потім вона надсилає правильні дані й чекає нову картку та порожні повідомлення."
          en: "This check submits the form with an empty name and zero minutes. It expects no card added, non-empty messages for both fields through `aria-describedby` and focus in `#name`. Then it submits valid data and expects a new card and empty messages."
      - when: { test: "Edit with the keyboard fills the form and the next submit updates the same habit" }
        message:
          uk: "Ця перевірка ставить фокус на «Редагувати» першої картки й натискає Enter. Вона чекає назву цієї звички в `#name` і фокус там же. Після нової назви й Enter вона чекає ту саму кількість карток і нову назву в картці з тим самим `data-id`."
          en: "This check puts focus on “Edit” of the first card and presses Enter. It expects this habit’s name in `#name` and focus there. After a new name and Enter it expects the same number of cards and the new name in the card with the same `data-id`."
      - when: { test: "Delete with the keyboard removes one habit and moves the focus to the next Delete button" }
        message:
          uk: "Ця перевірка ставить фокус на «Видалити» першої картки й натискає Enter. Вона чекає на одну картку й один запис у `habits` менше і фокус на кнопці «Видалити» картки, що стояла другою."
          en: "This check puts focus on “Delete” of the first card and presses Enter. It expects one card and one record in `habits` fewer and focus on the “Delete” button of the card that was second."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: пошук і незмінні оновлення"
      en: "Recall: searching and immutable updates"
    items:
      - id: find-or-filter
        from: js-05-02-filter-find
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const habits = [{ id: "h-1", minutes: 10 }, { id: "h-2", minutes: 20 }];
          console.log(habits.find((habit) => habit.id === "h-2").minutes);
          console.log(habits.filter((habit) => habit.id === "h-9").length);
          console.log(habits.find((habit) => habit.id === "h-9"));
        verify:
          logs: ["20", "0", "undefined"]
        answer:
          type: choice
          options:
            - id: right
              text:
                uk: "`20`, `0`, `undefined`"
                en: "`20`, `0`, `undefined`"
            - id: null-result
              text:
                uk: "`20`, `0`, `null`"
                en: "`20`, `0`, `null`"
              why:
                uk: "`find`, що нічого не знайшов, повертає `undefined`, а не `null`."
                en: "A `find` that found nothing returns `undefined`, not `null`."
            - id: array
              text:
                uk: "`[20]`, `0`, `undefined`"
                en: "`[20]`, `0`, `undefined`"
              why:
                uk: "`find` повертає сам перший відповідний запис, а не масив; масив повертає `filter`."
                en: "`find` returns the first matching record itself, not an array; `filter` returns an array."
          correct: [right]
        explanation:
          uk: "`find` дає перший запис, що підходить, або `undefined`; `filter` — завжди масив, можливо порожній. Тому після `find` треба перевіряти, чи щось знайшлося."
          en: "`find` gives the first record that matches, or `undefined`; `filter` always gives an array, possibly empty. That is why after `find` you check whether anything was found."
      - id: update-returns-new
        from: js-04-10-immutable-updates
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const before = [{ id: "h-1", minutes: 10 }, { id: "h-2", minutes: 20 }];
          const after = before.map((habit) => (habit.id === "h-2" ? { ...habit, minutes: 25 } : habit));
          console.log(before[1].minutes, after[1].minutes);
          console.log(before[0] === after[0], before[1] === after[1]);
        verify:
          logs: ["20 25", "true false"]
        answer:
          type: choice
          options:
            - id: right
              text:
                uk: "`20 25`, потім `true false`"
                en: "`20 25`, then `true false`"
            - id: mutated
              text:
                uk: "`25 25`, потім `true true`"
                en: "`25 25`, then `true true`"
              why:
                uk: "`{ ...habit, minutes: 25 }` — новий об’єкт; старий запис не змінюється."
                en: "`{ ...habit, minutes: 25 }` is a new object; the old record does not change."
            - id: all-new
              text:
                uk: "`20 25`, потім `false false`"
                en: "`20 25`, then `false false`"
              why:
                uk: "Записи, які не змінювалися, `map` повертає як є — це ті самі об’єкти."
                en: "Records that did not change are returned by `map` as they are — they are the same objects."
          correct: [right]
        explanation:
          uk: "Незмінне оновлення створює новий масив і новий об’єкт лише для зміненого запису; решта записів — ті самі об’єкти. Масив `before` лишився таким, яким був."
          en: "An immutable update creates a new array and a new object only for the changed record; the other records are the same objects. The `before` array stays as it was."

  - id: to-project
    kind: transfer
    capstoneStep: JS-06
    body:
      uk: "Наступний крок — те саме для твого проєкту: картки записів, форма створення й редагування з повідомленнями біля полів і видалення з підтвердженням — і все це лише з клавіатури."
      en: "The next step is the same for your project: record cards, a create and edit form with messages next to the fields, and a delete with a confirmation — all of it with the keyboard only."
