<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1.5rem; }
      #wishes ul { list-style: none; padding: 0; display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); }
      #wishes li { border: 1px solid #a0aec0; border-radius: 8px; padding: 0.75rem; }
      #wishes img { width: 4rem; height: 4rem; }
      #wishes h3 { margin: 0.25rem 0; font-size: 1.1rem; }
      #wishes p { margin: 0 0 0.5rem; color: #4a5568; }
      button { font: inherit; margin-right: 0.25rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <h2>%%listTitle%%</h2>
      <div id="wishes"></div>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
