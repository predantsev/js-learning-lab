id: js-06-13-render-list-from-data
unit: JS-06
title:
  uk: "Рендеримо список із даних"
  en: "Rendering a list from data"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Написати `render(records)`, що перебудовує список чи таблицю з даних через `createElement` і `textContent`, разом із повідомленням для порожнього списку."
    en: "Write render(records) that rebuilds a list or a table from data with createElement and textContent, including an empty-state message."
  - uk: "Давати однаковим кнопкам у різних картках різні доступні імена й явний `type`, і вирішувати, коли записам краще бути в таблиці, ніж у списку."
    en: "Give repeated controls distinct accessible names and explicit button types, and decide when records belong in a table rather than a list."
prerequisites: [js-06-12-focus-management, js-05-01-map, js-06-09-text-vs-html]
subskills:
  - { family: W-03, skill: "query/create/update/remove nodes", depth: practice }
  - { family: W-01, skill: "tables/images/alt", depth: practice }
  - { family: W-01, skill: "safe accessible form semantics", depth: intro }
glossary: [render-function]
selfCheck: [button-in-form, wish-cards]

blocks:
  - id: render-idea
    kind: explanation
    title:
      uk: "Одна функція робить сторінку схожою на дані"
      en: "One function makes the page match the data"
    body:
      uk: |
        Досі код змінював сторінку шматками: додав пункт, прибрав пункт. Коли записів багато, а змін ще більше, простіше інакше: тримати дані в масиві, а сторінку щоразу **перебудовувати з даних**. Функцію, що це робить, називають [[render-function|функцією рендерингу]], зазвичай `render(records)`:

        ```js
        function render(tasks) {
          const list = document.createElement("ul");
          list.append(...tasks.map(createTaskItem)); // one <li> per record
          area.replaceChildren(list);                // old content out, new content in, in one step
        }
        ```

        - `createTaskItem(task)` створює вузол одного запису через `createElement` і заповнює його через `textContent` — тож будь-який текст із даних лишається текстом.
        - `tasks.map(…)` дає масив вузлів: стільки ж, скільки записів, у тому самому порядку. `...` передає елементи масиву в `append` як окремі аргументи.
        - `replaceChildren` прибирає старий вміст ділянки й ставить новий.

        Змінилися дані — зміни масив і знову виклич `render`. Якщо масив порожній, замість порожнього списку покажи повідомлення на кшталт «Справ немає» — це **порожній стан**.
      en: |
        So far code changed the page piece by piece: add an item, remove an item. When there are many records and even more changes, another way is simpler: keep the data in an array and **rebuild the page from the data** every time. A function that does this is called a [[render-function]], usually `render(records)`:

        ```js
        function render(tasks) {
          const list = document.createElement("ul");
          list.append(...tasks.map(createTaskItem)); // one <li> per record
          area.replaceChildren(list);                // old content out, new content in, in one step
        }
        ```

        - `createTaskItem(task)` creates one record’s node with `createElement` and fills it with `textContent` — so any text from the data stays text.
        - `tasks.map(…)` gives an array of nodes: as many as there are records, in the same order. `...` passes the array’s elements to `append` as separate arguments.
        - `replaceChildren` removes the area’s old content and puts in the new one.

        When the data changes, change the array and call `render` again. If the array is empty, show a message such as “No tasks” instead of an empty list — this is the **empty state**.

  - id: record-to-card
    kind: visual
    visual: diagram
    title:
      uk: "Один запис — одна картка"
      en: "One record — one card"
    textEquivalent:
      uk: >-
        Ліворуч — поля одного запису бажання: id w-03, name «Глобус», price null і image — назва файлу картинки. Праворуч —
        вузли, які функція createCard створює для цього запису. id стає атрибутом data-id елемента li: за ним делегований
        слухач знайде запис. name потрапляє в заголовок h3 через textContent. price дорівнює null, тож абзац p показує «без
        ціни», а не слово null. image стає атрибутом src картинки img, а її alt — назва бажання, бо alt каже, що на картинці.
        Із name зроблено й імена кнопок: «Редагувати Глобус» і «Видалити Глобус», обидві з type="button". Далі records.map
        створює по картці на кожен запис, і replaceChildren ставить їх у ділянку замість старого вмісту за один крок. Для
        порожнього масиву render показує замість списку абзац із повідомленням — порожній стан.
      en: >-
        On the left are the fields of one wish record: id w-03, name “Globe”, price null and image — the picture’s file
        name. On the right are the nodes the function createCard creates for this record. id becomes the data-id attribute
        of the li element: a delegated listener will find the record by it. name goes into the h3 heading through
        textContent. price is null, so the p paragraph shows “no price” rather than the word null. image becomes the src
        attribute of the img picture, and its alt is the wish’s name, because alt says what is in the picture. The button
        names are made from name too: “Edit Globe” and “Delete Globe”, both with type="button". Then records.map creates a
        card for every record, and replaceChildren puts them into the area in place of the old content in one step. For an
        empty array render shows a paragraph with a message instead of the list — the empty state.
    spec:
      layout: grid
      nodes:
        - { id: f-id, label: "id: w-03", col: 0, row: 0, w: 128 }
        - { id: f-name, label: { uk: "name: Глобус", en: "name: Globe" }, col: 0, row: 1, w: 128 }
        - { id: f-price, label: "price: null", col: 0, row: 2, w: 128 }
        - { id: f-image, label: "image", col: 0, row: 3, w: 128 }
        - { id: f-name2, label: { uk: "name: Глобус", en: "name: Globe" }, col: 0, row: 4, w: 128 }
        - { id: n-li, label: "li data-id=w-03", col: 1, row: 0, w: 172 }
        - { id: n-h3, label: { uk: "h3 «Глобус»", en: "h3 “Globe”" }, col: 1, row: 1, w: 172 }
        - { id: n-p, label: { uk: "p «без ціни»", en: "p “no price”" }, col: 1, row: 2, w: 172 }
        - { id: n-img, label: { uk: "img alt «Глобус»", en: "img alt “Globe”" }, col: 1, row: 3, w: 172 }
        - { id: n-btn, label: { uk: "«Видалити Глобус»", en: "“Delete Globe”" }, shape: pill, col: 1, row: 4, w: 172 }
        - { id: c-map, label: "records.map", shape: round, col: 0, row: 5, w: 128 }
        - { id: n-area, label: "replaceChildren", col: 1, row: 5, w: 172 }
        - { id: c-empty, label: "[ ]", shape: round, col: 0, row: 6, w: 128 }
        - { id: n-empty, label: { uk: "p: порожній стан", en: "p: empty state" }, col: 1, row: 6, w: 172 }
      edges:
        - { from: f-id, to: n-li }
        - { from: f-name, to: n-h3 }
        - { from: f-price, to: n-p }
        - { from: f-image, to: n-img }
        - { from: f-name2, to: n-btn }
        - { from: c-map, to: n-area }
        - { from: c-empty, to: n-empty }
      hidden: [c-map, n-area, c-map->n-area, c-empty, n-empty, c-empty->n-empty]
      steps:
        - caption:
            uk: "Ліворуч — поля одного запису бажання, праворуч — вузли, які `createCard(wish)` для нього створює. Кожна стрілка показує, куди йде поле."
            en: "On the left are the fields of one wish record, on the right the nodes `createCard(wish)` creates for it. Every arrow shows where a field goes."
        - highlight: [f-id, n-li, f-id->n-li]
          caption:
            uk: "`id` стає атрибутом `data-id` елемента `<li>`: за ним делегований слухач знайде запис, а код після перебудови — нову картку."
            en: "`id` becomes the `data-id` attribute of the `<li>`: a delegated listener finds the record by it, and code finds the new card after a rebuild."
        - highlight: [f-name, n-h3, f-name->n-h3, f-price, n-p, f-price->n-p]
          caption:
            uk: "`name` і ціна потрапляють у вузли через `textContent`. Ціна `null` — це «немає ціни», тож абзац показує «без ціни», а не слово `null`."
            en: "`name` and the price go into the nodes through `textContent`. A `null` price means “no price”, so the paragraph shows “no price”, not the word `null`."
        - highlight: [f-image, n-img, f-image->n-img]
          caption:
            uk: "`image` стає `src` картинки. Її `alt` — назва бажання: він каже, що на картинці, тим, хто її не бачить."
            en: "`image` becomes the picture’s `src`. Its `alt` is the wish’s name: it tells those who cannot see the picture what is in it."
        - highlight: [f-name2, n-btn, f-name2->n-btn]
          caption:
            uk: "Кнопки отримують `type=\"button\"` та імена з назвою запису: «Редагувати Глобус», «Видалити Глобус». Так десять кнопок «Видалити» на сторінці перестають звучати однаково."
            en: "The buttons get `type=\"button\"` and names with the record’s name: “Edit Globe”, “Delete Globe”. That way ten “Delete” buttons on a page stop sounding the same."
        - show: [c-map, n-area, c-map->n-area]
          highlight: [c-map, n-area, c-map->n-area]
          caption:
            uk: "`records.map(createCard)` робить по картці на кожен запис, у тому самому порядку, а `replaceChildren` ставить їх у ділянку замість старого вмісту — за один крок."
            en: "`records.map(createCard)` makes a card for every record, in the same order, and `replaceChildren` puts them into the area in place of the old content — in one step."
        - show: [c-empty, n-empty, c-empty->n-empty]
          highlight: [c-empty, n-empty, c-empty->n-empty]
          caption:
            uk: "Порожній масив — порожній стан: замість списку `render` показує один абзац із повідомленням, наприклад «Бажань поки немає»."
            en: "An empty array means the empty state: instead of a list `render` shows one paragraph with a message, for example “No wishes yet”."

  - id: render-empty-and-two
    kind: prediction
    strings:
      none: { uk: "Витрат немає", en: "No expenses" }
      coffee: { uk: "Кава", en: "Coffee" }
      bus: { uk: "Автобус", en: "Bus" }
    prompt:
      uk: "Що виведуть два `console.log`?"
      en: "What do the two `console.log` calls print?"
    code: |
      // Setup: one area for the expenses.
      document.body.innerHTML = '<section id="expenses"></section>';
      const area = document.querySelector("#expenses");

      function render(expenses) {
        if (expenses.length === 0) {
          const message = document.createElement("p");
          message.textContent = "%%none%%";
          area.replaceChildren(message);
          return;
        }
        const list = document.createElement("ul");
        list.append(...expenses.map((expense) => {
          const item = document.createElement("li");
          item.textContent = expense.what;
          return item;
        }));
        area.replaceChildren(list);
      }

      render([{ what: "%%coffee%%" }, { what: "%%bus%%" }]);
      console.log(area.children.length, area.querySelectorAll("li").length);
      render([]);
      console.log(area.children.length, area.querySelectorAll("li").length);
    verify:
      logs: ["1 2", "1 0"]
    answer:
      type: choice
      options:
        - id: one-two-one-zero
          text:
            uk: "`1 2`, потім `1 0`"
            en: "`1 2`, then `1 0`"
        - id: two-two
          text:
            uk: "`2 2`, потім `1 0`"
            en: "`2 2`, then `1 0`"
          why:
            uk: "Пункти `<li>` лежать усередині `<ul>`, а в самої ділянки одна дитина — список. `children` рахує лише прямих дітей."
            en: "The `<li>` items lie inside the `<ul>`, and the area itself has one child — the list. `children` counts only direct children."
        - id: kept-old
          text:
            uk: "`1 2`, потім `2 2`"
            en: "`1 2`, then `2 2`"
          why:
            uk: "`replaceChildren` не додає до старого вмісту, а замінює його: старий список зникає, лишається один абзац."
            en: "`replaceChildren` does not add to the old content, it replaces it: the old list disappears, and one paragraph remains."
        - id: zero-zero
          text:
            uk: "`1 2`, потім `0 0`"
            en: "`1 2`, then `0 0`"
          why:
            uk: "Для порожнього масиву ділянка не порожня: у ній абзац із повідомленням — порожній стан."
            en: "For an empty array the area is not empty: it holds a paragraph with a message — the empty state."
      correct: [one-two-one-zero]
    explanation:
      uk: "Після першого виклику в ділянці одна дитина — `<ul>`, а в ньому два `<li>`. Другий виклик з порожнім масивом заміняє весь вміст одним абзацом: дитина знову одна, пунктів — нуль. Кожен виклик `render` будує вміст наново, а не дописує."
      en: "After the first call the area has one child — the `<ul>`, which holds two `<li>`. The second call, with an empty array, replaces all the content with one paragraph: again one child, zero items. Every call of `render` builds the content anew instead of adding to it."

  - id: button-in-form
    kind: prediction
    strings:
      edit: { uk: "Редагувати", en: "Edit" }
    prompt:
      uk: "Кнопка «Редагувати» лежить у формі, і в неї немає атрибута `type`. Що виведе консоль після кліку?"
      en: "The “Edit” button lies in a form and has no `type` attribute. What does the console show after the click?"
    code: |
      // Setup: a form with a text field and a button without type.
      document.body.innerHTML = '<form id="wish-form"><input name="title"><button>%%edit%%</button></form>';
      const form = document.querySelector("#wish-form");
      const button = form.querySelector("button");

      button.addEventListener("click", () => console.log("click"));
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        console.log("submit");
      });

      button.click();
    verify:
      logs: ["click", "submit"]
    answer:
      type: choice
      options:
        - id: click-submit
          text:
            uk: "`click`, потім `submit`"
            en: "`click`, then `submit`"
        - id: click-only
          text:
            uk: "Лише `click`"
            en: "Only `click`"
          why:
            uk: "Кнопка без `type` у формі — це кнопка надсилання: після слухача кліку браузер ще й надсилає форму."
            en: "A button without `type` in a form is a submit button: after the click listener the browser also submits the form."
        - id: submit-only
          text:
            uk: "Лише `submit`"
            en: "Only `submit`"
          why:
            uk: "Клік відбувається на кнопці, тож її слухач спрацьовує першим. Надсилання — це вже типова дія після кліку."
            en: "The click happens on the button, so its listener runs first. Submitting is the default action after the click."
      correct: [click-submit]
    explanation:
      uk: "У формі `<button>` без `type` має `type=\"submit\"`. Слухач кліку спрацьовує, а потім браузер виконує типову дію — надсилає форму, і з’являється подія `submit`. Кнопка робить не лише те, що каже твій слухач."
      en: "In a form, a `<button>` without `type` has `type=\"submit\"`. The click listener runs, and then the browser performs the default action — it submits the form, and a `submit` event appears. The button does more than your listener says."

  - id: buttons-names-tables
    kind: explanation
    title:
      uk: "Кнопки, імена, картинки й таблиці"
      en: "Buttons, names, pictures and tables"
    body:
      uk: |
        Кілька правил для вузлів, які створює `render`:

        - **Явний `type`.** Кнопка, що не надсилає форму, отримує `type="button"`. Навіть якщо зараз форми довкола немає: картки можуть потрапити у форму пізніше.
        - **Різні [[accessible-name|доступні імена]].** Десять кнопок «Видалити» на око розрізняє картка, а програма екранного читання в переліку кнопок назве їх однаково. Додай назву запису — для справи в планувальнику це `doneButton.setAttribute("aria-label", "Готово " + task.title)`. Видиме слово лишай на початку імені — так людина знайде кнопку за тим, що бачить.
        - **`alt` для картинки** каже, що на ній: для фото речі — її назву. Суто декоративна картинка отримує `alt=""`.

        **Список чи таблиця?** Якщо в записів ті самі поля і їх порівнюють між собою — дата, назва, сума, — це таблиця: `<caption>` з назвою таблиці й рядок заголовків `<th scope="col">`, який називає кожен стовпчик. Якщо кожен запис — окрема картка з картинкою й діями, це список.
      en: |
        A few rules for the nodes `render` creates:

        - **An explicit `type`.** A button that does not submit a form gets `type="button"`. Even if there is no form around it now: the cards may end up inside a form later.
        - **Distinct [[accessible-name|accessible names]].** On screen the card tells ten “Delete” buttons apart, but a screen reader listing the buttons names them all the same. Add the record’s name — for a task in a planner that is `doneButton.setAttribute("aria-label", "Done " + task.title)`. Keep the visible word at the start of the name — then a person finds the button by what they see.
        - **The `alt` of a picture** says what is in it: for a photo of a thing — its name. A purely decorative picture gets `alt=""`.

        **A list or a table?** If the records have the same fields and are compared with each other — a date, a name, an amount — it is a table: a `<caption>` with the table’s name and a header row of `<th scope="col">` that names every column. If each record is a separate card with a picture and actions, it is a list.

  - id: expense-table
    kind: example
    runtime: browser-js
    dir: expense-table
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Витрати за березень", en: "Expenses for March" }
      coffee: { uk: "Кава", en: "Coffee" }
      bus: { uk: "Автобус", en: "Bus" }
      books: { uk: "Книжки", en: "Books" }
      currency: { uk: "грн", en: "UAH" }
      empty: { uk: "Витрат поки немає", en: "No expenses yet" }
      caption: { uk: "Витрати за березень", en: "Expenses for March" }
      date: { uk: "Дата", en: "Date" }
      what: { uk: "Що", en: "What" }
      amount: { uk: "Сума", en: "Amount" }
    title:
      uk: "Ті самі витрати списком і таблицею"
      en: "The same expenses as a list and as a table"
    body:
      uk: |
        `render` будує список витрат із масиву `expenses`. А в `table.js` уже є `renderTable(area, records)`, що будує з тих самих записів таблицю.
      en: |
        `render` builds a list of expenses from the `expenses` array. And `table.js` already has `renderTable(area, records)`, which builds a table from the same records.
    tryIt:
      uk: |
        1. Запусти: у списку три витрати.
        2. Додай у масив `expenses` четвертий запис, наприклад `{ id: "e-04", date: "05.03", what: "Обід", amount: 180 }`, і запусти знову: пункт з’явився, хоча `render` ти не змінював.
        3. Заміни останній рядок коду на `render([]);` і запусти: замість списку — повідомлення порожнього стану. Поверни `render(expenses);`.
        4. Заміни `render(expenses);` на `renderTable(area, expenses);` і запусти: ті самі записи стали таблицею з підписом і рядком заголовків. Суми тепер стоять одна під одною, і їх легко порівняти.
      en: |
        1. Run it: the list has three expenses.
        2. Add a fourth record to the `expenses` array, for example `{ id: "e-04", date: "05.03", what: "Lunch", amount: 180 }`, and run again: the item appeared, although you did not change `render`.
        3. Replace the last line of code with `render([]);` and run: instead of the list there is the empty-state message. Put `render(expenses);` back.
        4. Replace `render(expenses);` with `renderTable(area, expenses);` and run: the same records became a table with a caption and a header row. The amounts now stand one under another and are easy to compare.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: map"
      en: "Recall: map"
    strings:
      currency: { uk: "грн", en: "UAH" }
    items:
      - id: map-same-length
        from: js-05-01-map
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const prices = [1200, 850];
          const labels = prices.map((price) => price + " %%currency%%");
          console.log(labels.length, prices.length);
          console.log(labels[1]);
        verify:
          logs: ["2 2", "850 %%currency%%"]
        answer:
          type: choice
          options:
            - id: right
              text:
                uk: "`2 2`, потім `850 грн`"
                en: "`2 2`, then `850 UAH`"
            - id: changed
              text:
                uk: "`2 0`, потім `850 грн`"
                en: "`2 0`, then `850 UAH`"
              why:
                uk: "`map` не забирає елементів з початкового масиву: він створює новий, а `prices` лишається як був."
                en: "`map` takes no elements out of the original array: it creates a new one, and `prices` stays as it was."
            - id: first
              text:
                uk: "`2 2`, потім `1200 грн`"
                en: "`2 2`, then `1200 UAH`"
              why:
                uk: "Індекси починаються з нуля: `labels[1]` — другий підпис, тобто для 850."
                en: "Indexes start at zero: `labels[1]` is the second label, the one for 850."
          correct: [right]
        explanation:
          uk: "`map` повертає новий масив тієї самої довжини й порядку, а початковий не змінює. Так і `records.map(createCard)` дає рівно по одній картці на запис, у тому самому порядку."
          en: "`map` returns a new array of the same length and order and does not change the original. Likewise `records.map(createCard)` gives exactly one card per record, in the same order."

  - id: wish-cards
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: wish-cards
    entry: index.html
    editable: [index.js]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Мій список бажань", en: "My wishlist" }
      listTitle: { uk: "Бажання", en: "Wishes" }
      globe: { uk: "Глобус", en: "Globe" }
      puzzle: { uk: "Пазл на 1000 деталей", en: "1000-piece puzzle" }
      kettle: { uk: "Чайник", en: "Kettle" }
      currency: { uk: "грн", en: "UAH" }
      noPrice: { uk: "без ціни", en: "no price" }
      edit: { uk: "Редагувати", en: "Edit" }
      delete: { uk: "Видалити", en: "Delete" }
      empty: { uk: "Бажань поки немає", en: "No wishes yet" }
    title:
      uk: "Картки бажань із даних"
      en: "Wish cards from data"
    instructions:
      uk: |
        Допиши `render(records)`, щоб вона перебудовувала вміст `#wishes` з масиву `records`, який отримує як аргумент:

        1. Для кожного запису — пункт `<li>` у списку `<ul>`. У пункті:
            - картинка `<img>`: `src` — поле `image`, `alt` — назва бажання;
            - назва в заголовку `<h3>`;
            - абзац із ціною: `1200 грн`, а для `price: null` — `без ціни`;
            - кнопки «Редагувати» і «Видалити» з `type="button"` і доступними іменами на кшталт «Видалити Глобус».
        2. Тексти з даних став лише через `textContent`.
        3. Для порожнього масиву — замість списку абзац «Бажань поки немає».
        4. Кожен виклик замінює старий вміст `#wishes`, а не дописує до нього.
      en: |
        Complete `render(records)` so that it rebuilds the content of `#wishes` from the `records` array it receives as an argument:

        1. For every record — an `<li>` item in a `<ul>` list. In the item:
            - an `<img>` picture: `src` is the `image` field, `alt` is the wish’s name;
            - the name in an `<h3>` heading;
            - a paragraph with the price: `1200 UAH`, and for `price: null` — `no price`;
            - “Edit” and “Delete” buttons with `type="button"` and accessible names such as “Delete Globe”.
        2. Put texts from the data in only through `textContent`.
        3. For an empty array — instead of the list, a paragraph “No wishes yet”.
        4. Every call replaces the old content of `#wishes` instead of adding to it.
    testTitles:
      "on load every wish becomes one card with its name and price":
        uk: "Після запуску кожне бажання — одна картка з назвою й ціною"
        en: "On load every wish becomes one card with its name and price"
      "a wish without a price says so instead of null":
        uk: "Бажання без ціни каже про це, а не показує null"
        en: "A wish without a price says so instead of showing null"
      "every image shows its wish file and has alt text with the wish name":
        uk: "Кожна картинка показує свій файл і має alt із назвою бажання"
        en: "Every picture shows its file and has alt text with the wish name"
      "every card has Edit and Delete buttons named after its wish":
        uk: "У кожній картці кнопки «Редагувати» і «Видалити» з назвою бажання в імені"
        en: "Every card has Edit and Delete buttons named after its wish"
      "every button has type button":
        uk: "Кожна кнопка має type=\"button\""
        en: "Every button has type=\"button\""
      "a name with markup is shown as text":
        uk: "Назва з розміткою показується як текст"
        en: "A name with markup is shown as text"
      "an empty list shows the message and the cards come back afterwards":
        uk: "Порожній масив показує повідомлення, а потім картки повертаються"
        en: "An empty array shows the message, and the cards come back afterwards"
      "render replaces the old cards instead of adding to them":
        uk: "render заміняє старі картки, а не дописує нові"
        en: "render replaces the old cards instead of adding new ones"
    hints:
      nudge:
        uk: "Розбий роботу на дві функції: одна створює картку одного бажання, друга вирішує, що показати, — список карток чи повідомлення."
        en: "Split the work into two functions: one creates the card of one wish, the other decides what to show — a list of cards or the message."
      explanation:
        uk: "Функція картки повторює те, що ти вже робив: `createElement` для кожного вузла, `textContent` для текстів, `append`, щоб скласти їх у `<li>`, і `return item`. Ціну вибирає умова: `null` дає «без ціни», інакше — число й «грн». Ім’я кнопки задає `aria-label`, а тип — властивість `type`, як `link.href` задає адресу посилання. `render` спершу перевіряє `records.length`, а потім ставить у `#wishes` або абзац, або список, зібраний через `records.map(…)`, — через `replaceChildren`."
        en: "The card function repeats what you have done before: `createElement` for every node, `textContent` for texts, `append` to put them into the `<li>`, and `return item`. A condition picks the price: `null` gives “no price”, otherwise the number and “UAH”. A button’s name is set by `aria-label`, its type by the `type` property, just as `link.href` sets a link’s address. `render` first checks `records.length`, then puts either the paragraph or the list built with `records.map(…)` into `#wishes` — with `replaceChildren`."
    solutionNote:
      uk: "`createCard` будує картку одного бажання лише через `createElement` і `textContent`, тож назва з розміткою лишається текстом. Ім’я кожної кнопки містить назву бажання, а `type=\"button\"` не дасть кнопці надіслати форму, якщо картки колись опиняться в ній. `render` або показує порожній стан, або складає список через `map` і ставить його через `replaceChildren` замість старого вмісту."
      en: "`createCard` builds one wish’s card only with `createElement` and `textContent`, so a name with markup stays text. Every button’s name contains the wish’s name, and `type=\"button\"` keeps a button from submitting a form if the cards ever end up in one. `render` either shows the empty state or builds the list with `map` and puts it in with `replaceChildren` in place of the old content."
    feedback:
      - when: { test: "on load every wish becomes one card with its name and price" }
        message:
          uk: "Ця перевірка чекає, що після запуску в `#wishes` лежить стільки `<li>`, скільки бажань у масиві, у тому самому порядку, а в кожному — `<h3>` з назвою і ціна у вигляді `1200 грн` (для бажання без ціни — `без ціни`)."
          en: "This check expects `#wishes` to hold as many `<li>` as there are wishes in the array after the program runs, in the same order, each with an `<h3>` holding the name and the price as `1200 UAH` (`no price` for the wish without a price)."
      - when: { test: "a wish without a price says so instead of null" }
        message:
          uk: "Ця перевірка чекає, що картка бажання з `price: null` містить текст `без ціни` і не містить слова `null`."
          en: "This check expects the card of the wish with `price: null` to contain the text `no price` and not the word `null`."
      - when: { test: "every image shows its wish file and has alt text with the wish name" }
        message:
          uk: "Ця перевірка чекає в кожній картці `<img>`, чий `src` — поле `image` цього бажання, а `alt` містить його назву."
          en: "This check expects an `<img>` in every card whose `src` is the wish’s `image` field and whose `alt` contains its name."
      - when: { test: "every card has Edit and Delete buttons named after its wish" }
        message:
          uk: "Ця перевірка чекає в кожній картці дві кнопки, чиї доступні імена містять «Редагувати» чи «Видалити» і назву саме цього бажання — наприклад, через `aria-label`."
          en: "This check expects two buttons in every card whose accessible names contain “Edit” or “Delete” and the name of exactly this wish — for example, through `aria-label`."
      - when: { test: "every button has type button" }
        message:
          uk: "Ця перевірка чекає по дві кнопки на картку, і в кожної атрибут `type` має значення `button`."
          en: "This check expects two buttons per card, each with the `type` attribute set to `button`."
      - when: { test: "a name with markup is shown as text" }
        message:
          uk: "Ця перевірка викликає `render` з бажанням, чия назва — `<em>Lamp</em>`, і чекає, що `<h3>` показує ці символи як текст, а елемента `<em>` у картці не з’являється."
          en: "This check calls `render` with a wish named `<em>Lamp</em>` and expects the `<h3>` to show these characters as text, with no `<em>` element appearing in the card."
      - when: { test: "an empty list shows the message and the cards come back afterwards" }
        message:
          uk: "Ця перевірка викликає `render([])` і чекає в `#wishes` текст «Бажань поки немає» без жодного `<li>`, а потім `render(wishes)` — і чекає знову всі картки без цього тексту."
          en: "This check calls `render([])` and expects the text “No wishes yet” in `#wishes` with no `<li>`, then calls `render(wishes)` and expects all the cards again, without that text."
      - when: { test: "render replaces the old cards instead of adding to them" }
        message:
          uk: "Ця перевірка викликає `render(wishes)` двічі, а потім `render` з одним бажанням, і щоразу чекає в `#wishes` рівно стільки карток, скільки записів отримав останній виклик."
          en: "This check calls `render(wishes)` twice and then `render` with one wish, and each time expects exactly as many cards in `#wishes` as the last call received records."

