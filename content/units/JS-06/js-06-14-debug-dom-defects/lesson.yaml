id: js-06-14-debug-dom-defects
unit: JS-06
title:
  uk: "Налагодження: дубльовані слухачі, втрачений фокус, поля без підписів"
  en: "Debug: duplicate listeners, lost focus, missing labels"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Знайти й виправити закладені вади інтерфейсу: видалення, яке обробляють і слухач кнопки, і слухач списку; слухач submit, що додається знову при кожній перебудові; фокус, утрачений після перебудови; поле без підпису; посилання в ролі кнопки; правило з id, що перебиває клас; картку, що вилазить за край при масштабі 200%."
    en: "Diagnose and repair seeded UI defects: a delete handled twice by a button listener and a bubbling list listener, a submit listener added again on every render, focus lost after a re-render, an unlabeled input, a link used as an action, an id rule overriding a class, and a card that overflows at 200% zoom."
  - uk: "Перевіряти кожне виправлення клавіатурою, деревом доступності або обчисленими стилями."
    en: "Verify each repair with the keyboard, the accessibility tree or the computed styles."
prerequisites: [js-06-13-render-list-from-data]
subskills:
  - { family: W-03, skill: "bubbling/capture/delegation", depth: assess }
  - { family: W-03, skill: "focus management", depth: assess }
  - { family: W-03, skill: "forms and event cleanup", depth: assess }
  - { family: W-01, skill: "links/buttons", depth: assess }
  - { family: W-01, skill: "inputs/labels/validation", depth: assess }
  - { family: W-02, skill: "cascade/inheritance/specificity", depth: assess }
  - { family: W-02, skill: "overflow and zoom", depth: assess }
glossary: []
selfCheck: [who-notices, fix-expenses]

blocks:
  - id: mouse-is-not-enough
    kind: explanation
    title:
      uk: "Працює мишею — ще не означає, що працює"
      en: "Working with a mouse does not mean it works"
    body:
      uk: |
        Частину вад видно одразу, а частина ховається від того, хто перевіряє лише мишею на великому екрані. Тому перевіряй інтерфейс чотирма способами:

        1. **Мишею** — чи робить кожна дія рівно те, що обіцяє, один раз.
        2. **Лише клавіатурою** — Tab, Shift+Tab, Enter, пробіл: чи до всього можна дістатися і чи не губиться [[keyboard-focus|фокус]] після змін.
        3. **Деревом доступності** — у меню браузера **Перевірити** (Inspect), панель **Accessibility**: яке [[accessible-name|доступне ім’я]] має кожне поле й кнопка і звідки воно взялося (з підпису чи лише з `placeholder`), і чи правильна роль (кнопка — `button`, посилання — `link`).
        4. **Обчисленими стилями й масштабом** — вкладка **Computed** показує, яке правило перемогло, а збільшений масштаб — чи вміщується сторінка у вузькому вікні. Масштаб збільшує Ctrl і «+» (на Mac — Cmd і «+»): кожне натискання — на один крок, тож до 200% тиснути доведеться кілька разів.

        Налагодження йде тим самим колом: відтвори ваду, знайди причину, виправ, перевір тим способом, яким її знайдено.
      en: |
        Some defects show at once, and some hide from anyone who tests only with a mouse on a large screen. So check an interface in four ways:

        1. **With a mouse** — does every action do exactly what it promises, once.
        2. **With the keyboard only** — Tab, Shift+Tab, Enter, Space: can everything be reached, and does [[keyboard-focus|focus]] stay in place after changes.
        3. **With the accessibility tree** — **Inspect** in the browser’s menu, the **Accessibility** pane: which [[accessible-name]] every field and button has and where it came from (a label or only a `placeholder`), and whether the role is right (a button is `button`, a link is `link`).
        4. **With computed styles and zoom** — the **Computed** tab shows which rule won, and a larger zoom shows whether the page fits a narrow window. Ctrl and “+” zooms in (Cmd and “+” on a Mac): every press is one step, so reaching 200% takes several presses.

        Debugging goes around the same circle: reproduce the defect, find the cause, repair it, check it the way it was found.

  - id: who-notices
    kind: prediction
    prompt:
      uk: "У застосунку для витрат сім вад. Які з них людина помітить, якщо користується лише мишею при звичайному масштабі на широкому екрані? Познач усі."
      en: "The expense app has seven defects. Which of them will a person notice when using only a mouse at normal zoom on a wide screen? Mark all."
    answer:
      type: multi
      options:
        - id: double-delete
          text:
            uk: "Видалення обробляють два слухачі, і лічильник видалених росте на 2"
            en: "Two listeners handle a delete, and the deleted counter grows by 2"
        - id: repeat-submit
          text:
            uk: "Слухач `submit` додається при кожній перебудові, і з’являються порожні записи"
            en: "A `submit` listener is added on every rebuild, and empty records appear"
        - id: specificity
          text:
            uk: "Правило з `#expenses li` перебиває клас `.over-budget`, і дорогі витрати не підсвічуються"
            en: "A rule with `#expenses li` overrides the `.over-budget` class, and expensive items are not highlighted"
        - id: lost-focus
          text:
            uk: "Після видалення фокус падає на `body`"
            en: "After a delete focus falls back to `body`"
          why:
            uk: "Миша не користується фокусом: наступний клік однаково влучить куди треба. Втрату видно лише з клавіатурою."
            en: "A mouse does not use focus: the next click lands where it should anyway. The loss shows only with the keyboard."
        - id: no-label
          text:
            uk: "У поля суми є лише `placeholder`, без підпису"
            en: "The amount field has only a `placeholder`, no label"
          why:
            uk: "Зрячий бачить підказку в порожньому полі. Проблему видно після введення, коли підказка зникає, і в дереві доступності: ім’я поле отримує лише з `placeholder`, підпису немає."
            en: "A sighted person sees the hint in the empty field. The problem shows after typing, when the hint disappears, and in the accessibility tree: the field gets its name only from the `placeholder`, and there is no label."
        - id: link-action
          text:
            uk: "«Очистити все» — посилання, а не кнопка"
            en: "“Clear all” is a link, not a button"
          why:
            uk: "Клік мишею по посиланню теж запускає слухача. Але програма екранного читання оголошує його як посилання, а пробіл його не натискає."
            en: "A mouse click on a link runs the listener too. But a screen reader announces it as a link, and Space does not press it."
        - id: zoom
          text:
            uk: "Картка завширшки 360px вилазить за край вузького вікна"
            en: "A 360px wide card overflows a narrow window"
          why:
            uk: "На широкому екрані при звичайному масштабі місця вистачає. Вада з’являється, лише коли вікно вузьке або масштаб великий."
            en: "On a wide screen at normal zoom there is enough room. The defect appears only when the window is narrow or the zoom is large."
      correct: [double-delete, repeat-submit, specificity]
    explanation:
      uk: "Мишею видно лише три вади з семи: подвійний лічильник, порожні записи й відсутню підсвітку. Решту знаходять інші перевірки: втрачений фокус — клавіатура, поле без підпису й посилання замість кнопки — дерево доступності, картку, що вилазить, — вузьке вікно або великий масштаб. Тому «працює мишею» — це лише перша з чотирьох перевірок."
      en: "Only three of the seven defects show with a mouse: the double counter, the empty records and the missing highlight. The other checks find the rest: lost focus — the keyboard, the field without a label and the link instead of a button — the accessibility tree, the overflowing card — a narrow window or a large zoom. That is why “works with a mouse” is only the first of four checks."

  - id: defects-map
    kind: visual
    visual: diagram
    title:
      uk: "Сім вад: причина й наслідок"
      en: "Seven defects: cause and effect"
    textEquivalent:
      uk: >-
        Ліворуч — причини, праворуч — що з ними відбувається. Один клік по «Видалити» спливає й доходить до двох слухачів:
        слухача самої кнопки й делегованого слухача списку, тож запис видаляється двічі, а лічильник росте на 2. render
        щоразу додає новий слухач submit — нову стрілкову функцію, тож після трьох перебудов форма має три слухачі, і зайві
        додають порожні записи. Перебудова прибирає кнопку з фокусом, і document.activeElement стає body. У дереві
        доступності поле суми має ім’я лише з placeholder — підпису в нього немає, а «Очистити все» з a href="#" — посилання,
        а не кнопка. Правило #expenses li має специфічність 1-0-1 і перебиває .over-budget зі специфічністю 0-1-0, тож фон
        попередження не з’являється. Картка шириною 360px не вміщується у вікно шириною 320px — такої ширини екран телефона,
        а також вікно 1280 пікселів на масштабі 400%, — і з’являється горизонтальна прокрутка.
      en: >-
        On the left are the causes, on the right what they lead to. One click on “Delete” bubbles and reaches two listeners:
        the button’s own listener and the list’s delegated listener, so the record is deleted twice and the counter grows by
        2. render adds a new submit listener every time — a new arrow function — so after three rebuilds the form has three
        listeners, and the extra ones add empty records. A rebuild removes the focused button, and document.activeElement
        becomes body. In the accessibility tree the amount field gets its name only from the placeholder — it has no label,
        and “Clear all” made with a href="#" is a link, not a button. The rule #expenses li has specificity 1-0-1 and overrides
        .over-budget with specificity 0-1-0, so the warning background never appears. A 360px wide card does not fit a 320px
        wide window — the width of a phone, or of a 1280-pixel window at 400% zoom — and horizontal scrolling appears.
    spec:
      layout: grid
      nodes:
        - { id: click, label: { uk: "клік «Видалити»", en: "click “Delete”" }, shape: pill, col: 0, row: 0, w: 150 }
        - { id: h-button, label: { uk: "слухач кнопки", en: "button listener" }, col: 1, row: 0, w: 150 }
        - { id: h-list, label: { uk: "слухач списку", en: "list listener" }, col: 1, row: 1, w: 150 }
        - { id: renders, label: "render() × 3", col: 0, row: 2, w: 150 }
        - { id: submits, label: { uk: "3 слухачі submit", en: "3 submit listeners" }, col: 1, row: 2, w: 150 }
        - { id: rebuild, label: { uk: "перебудова", en: "rebuild" }, col: 0, row: 3, w: 150 }
        - { id: body, label: "activeElement: body", col: 1, row: 3, w: 150 }
        - { id: input, label: "input placeholder", col: 0, row: 4, w: 150 }
        - { id: no-name, label: { uk: "ім’я лише з placeholder", en: "name only from placeholder" }, col: 1, row: 4, w: 150 }
        - { id: link, label: "a href=\"#\"", col: 0, row: 5, w: 150 }
        - { id: link-role, label: { uk: "роль: link", en: "role: link" }, col: 1, row: 5, w: 150 }
        - { id: id-rule, label: "#expenses li 1-0-1", col: 0, row: 6, w: 150 }
        - { id: class-rule, label: ".over-budget 0-1-0", col: 1, row: 6, w: 150 }
        - { id: width, label: "width: 360px", col: 0, row: 7, w: 150 }
        - { id: window, label: { uk: "вікно 320px", en: "320px window" }, col: 1, row: 7, w: 150 }
      edges:
        - { from: click, to: h-button }
        - { from: click, to: h-list }
        - { from: renders, to: submits }
        - { from: rebuild, to: body }
        - { from: input, to: no-name }
        - { from: link, to: link-role }
        - { from: id-rule, to: class-rule, label: { uk: "перебиває", en: "overrides" } }
        - { from: width, to: window, label: { uk: "ширше", en: "wider" } }
      steps:
        - caption:
            uk: "Ліворуч — причини, праворуч — до чого вони призводять. Пройдімо по рядках."
            en: "On the left are the causes, on the right what they lead to. Let us go row by row."
        - highlight: [click, h-button, h-list, click->h-button, click->h-list]
          caption:
            uk: "Один клік по «Видалити» спливає й доходить до **двох** слухачів: кнопки й делегованого слухача списку. Запис видаляється двічі — лічильник росте на 2."
            en: "One click on “Delete” bubbles up and reaches **two** listeners: the button’s and the list’s delegated one. The record is deleted twice — the counter grows by 2."
        - highlight: [renders, submits, renders->submits]
          caption:
            uk: "`render` щоразу викликає `addEventListener(\"submit\", …)` з новою стрілковою функцією. Після трьох перебудов слухачів три, і зайві додають порожні записи."
            en: "`render` calls `addEventListener(\"submit\", …)` with a new arrow function every time. After three rebuilds there are three listeners, and the extra ones add empty records."
        - highlight: [rebuild, body, rebuild->body]
          caption:
            uk: "Перебудова прибирає кнопку з фокусом, і `document.activeElement` стає `body`: людина з клавіатурою губить місце."
            en: "The rebuild removes the focused button, and `document.activeElement` becomes `body`: a keyboard user loses their place."
        - highlight: [input, no-name, input->no-name, link, link-role, link->link-role]
          caption:
            uk: "Дерево доступності: ім’я поля суми Chrome бере лише з `placeholder` — підпису немає, і щойно людина почне вводити, підказка зникне з екрана. А «Очистити все» — посилання, хоча виконує дію на сторінці."
            en: "The accessibility tree: Chrome takes the amount field’s name only from the `placeholder` — there is no label, and as soon as the person starts typing, the hint disappears from the screen. And “Clear all” is a link, although it performs an action on the page."
        - highlight: [id-rule, class-rule, id-rule->class-rule]
          caption:
            uk: "Каскад: `#expenses li` (1-0-1) сильніший за `.over-budget` (0-1-0), тож білий фон перебиває фон попередження."
            en: "The cascade: `#expenses li` (1-0-1) is stronger than `.over-budget` (0-1-0), so the white background overrides the warning background."
        - highlight: [width, window, width->window]
          caption:
            uk: "Картка шириною 360px не влазить у вікно 320px — такої ширини екран телефона, а також вікно 1280 пікселів на масштабі 400%. З’являється горизонтальна прокрутка."
            en: "A 360px wide card does not fit a 320px window — the width of a phone, or of a 1280-pixel window at 400% zoom. Horizontal scrolling appears."

  - id: expense-defects
    kind: example
    runtime: browser-js
    dir: expense-defects
    entry: index.html
    strings: &strings
      lang: { uk: "uk", en: "en" }
      title: { uk: "Витрати за місяць", en: "Monthly expenses" }
      whatLabel: { uk: "На що", en: "What for" }
      amountLabel: { uk: "Сума, грн", en: "Amount, UAH" }
      add: { uk: "Додати", en: "Add" }
      listTitle: { uk: "Список витрат", en: "Expense list" }
      deletedLabel: { uk: "Видалено записів:", en: "Records deleted:" }
      clearAll: { uk: "Очистити все", en: "Clear all" }
      coffee: { uk: "Кава", en: "Coffee" }
      gym: { uk: "Абонемент у спортзал", en: "Gym membership" }
      books: { uk: "Книжки", en: "Books" }
      currency: { uk: "грн", en: "UAH" }
      delete: { uk: "Видалити", en: "Delete" }
      lunch: { uk: "Обід", en: "Lunch" }
      taxi: { uk: "Таксі", en: "Taxi" }
      laptop: { uk: "Ноутбук", en: "Laptop" }
    title:
      uk: "Відтвори кожну ваду"
      en: "Reproduce every defect"
    body:
      uk: |
        Це застосунок із семи вад. Нічого не виправляй — спершу знайди кожен симптом і зістав його зі своїм передбаченням.
      en: |
        This is the app with the seven defects. Do not fix anything yet — first find every symptom and match it with your prediction.
    tryIt:
      uk: |
        1. **Мишею.** Натисни «Видалити» біля кави: лічильник показує 2. Тепер додай витрату через форму: разом із нею з’являються порожні записи «— 0 грн». Абонемент дорожчий за 1000 грн, але його картка не підсвічена.
        2. **Клавіатурою.** Клацни по заголовку «Список витрат», натискай Tab, доки фокус не стане на «Видалити», і натисни Enter: фокус зникає. Поверни фокус на «Очистити все» (Shift+Tab) і натисни пробіл: нічого не стається — пробіл не натискає посилань.
        3. **Деревом доступності.** Клацни правою кнопкою миші по полю суми й обери в меню браузера **Перевірити** (Inspect), далі панель **Accessibility**: ім’я «Сума, грн» поле має, але взяте воно з `placeholder`, а не з підпису. Так само перевір «Очистити все»: його роль — `link`.
        4. **Стилями й масштабом.** Відкрий так само картку абонемента, у вкладці **Computed** знайди `background-color` і розгорни його (трикутник ліворуч від назви): переміг білий фон із правила `#expenses li`, а фон із `.over-budget` закреслено. Тепер збільшуй масштаб (Ctrl і «+», на Mac — Cmd і «+»), доки картки не почнуть вилазити за правий край панелі: у вікні завширшки 1280 пікселів це станеться на 200%, у ширшому — на 250–300%. Поверни масштаб на 100% (Ctrl або Cmd і «0»).
      en: |
        1. **With a mouse.** Press “Delete” next to the coffee: the counter shows 2. Now add an expense through the form: empty records “— 0 UAH” appear along with it. The gym membership costs more than 1000 UAH, but its card is not highlighted.
        2. **With the keyboard.** Click the heading “Expense list”, press Tab until focus is on “Delete”, then Enter: focus disappears. Bring focus back to “Clear all” (Shift+Tab) and press Space: nothing happens — Space does not press links.
        3. **With the accessibility tree.** Right-click the amount field and choose **Inspect** in the browser’s menu, then the **Accessibility** pane: the field does have the name “Amount, UAH”, but it comes from the `placeholder`, not from a label. Check “Clear all” the same way: its role is `link`.
        4. **With styles and zoom.** Inspect the gym card the same way, find `background-color` in the **Computed** tab and expand it (the triangle left of the name): the white background from the rule `#expenses li` won, and the background from `.over-budget` is struck through. Now zoom in (Ctrl and “+”, Cmd and “+” on a Mac) until the cards start to stick out past the right edge of the panel: in a 1280-pixel wide window that happens at 200%, in a wider one at 250–300%. Set the zoom back to 100% (Ctrl or Cmd and “0”).

  - id: recall
    kind: review
    title:
      uk: "Пригадай: кнопка чи посилання"
      en: "Recall: a button or a link"
    items:
      - id: action-or-navigation
        from: js-01-07-links-buttons-images-tables
        prompt:
          uk: "Який елемент підходить для «Позначити все прочитаним» — дії, що змінює дані на цій самій сторінці?"
          en: "Which element fits “Mark all as read” — an action that changes data on the same page?"
        answer:
          type: choice
          options:
            - id: button
              text:
                uk: "`<button type=\"button\">`"
                en: "`<button type=\"button\">`"
            - id: link
              text:
                uk: "`<a href=\"#\">` зі слухачем кліку"
                en: "`<a href=\"#\">` with a click listener"
              why:
                uk: "Посилання веде на іншу адресу. Для дії воно звучить як перехід, не натискається пробілом і додає `#` до адреси."
                en: "A link leads to another address. For an action it sounds like navigation, is not pressed by Space and adds `#` to the address."
            - id: div
              text:
                uk: "`<div>` зі слухачем кліку"
                en: "`<div>` with a click listener"
              why:
                uk: "До `<div>` не дістатися клавіатурою, і в нього немає ролі: для програми екранного читання це просто текст."
                en: "A `<div>` cannot be reached with the keyboard and has no role: for a screen reader it is just text."
          correct: [button]
        explanation:
          uk: "Кнопка — для дії на сторінці, посилання — для переходу на іншу адресу. Кнопка сама потрапляє в порядок Tab, натискається Enter і пробілом і оголошується як кнопка."
          en: "A button is for an action on the page, a link for going to another address. A button joins the Tab order by itself, is pressed by Enter and Space and is announced as a button."

  - id: fix-expenses
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: fix-expenses
    entry: index.html
    editable: [index.html, index.js]
    strings: *strings
    title:
      uk: "Виправ сім вад"
      en: "Repair the seven defects"
    instructions:
      uk: |
        Виправ застосунок витрат так, щоб він поводився, як задумано, — і мишею, і клавіатурою, і при масштабі 200%:

        1. Один клік по «Видалити» видаляє один запис, і лічильник видалених росте на 1.
        2. Кожне надсилання форми додає рівно одну витрату — скільки б разів список не перебудовувався.
        3. Після видалення фокус переходить на «Видалити» наступної витрати; якщо видалено останню — попередньої; якщо список порожній — на заголовок списку.
        4. Поле суми має видимий підпис.
        5. «Очистити все» — кнопка з `type="button"`.
        6. Картки дорожчі за 1000 грн мають фон попередження з правила `.over-budget`.
        7. Картки вміщуються у вікно шириною 320px без горизонтальної прокрутки.

        Решту поведінки не змінюй: ті самі тексти, кольори й делегований слухач списку.
      en: |
        Repair the expense app so that it behaves as intended — with a mouse, with the keyboard and at 200% zoom:

        1. One click on “Delete” deletes one record, and the deleted counter grows by 1.
        2. Every form submit adds exactly one expense — however many times the list has been rebuilt.
        3. After a delete, focus moves to “Delete” of the next expense; if the last one was deleted — of the previous one; if the list is empty — to the list heading.
        4. The amount field has a visible label.
        5. “Clear all” is a button with `type="button"`.
        6. Cards over 1000 UAH have the warning background from the `.over-budget` rule.
        7. The cards fit a 320px wide window without horizontal scrolling.

        Keep the rest of the behavior: the same texts, colors and the list’s delegated listener.
    testTitles:
      "one click on Delete removes one expense and counts one deletion":
        uk: "Один клік по «Видалити» прибирає одну витрату й додає 1 до лічильника"
        en: "One click on Delete removes one expense and adds 1 to the counter"
      "adding two expenses in a row adds exactly two cards":
        uk: "Дві витрати поспіль додають рівно дві картки"
        en: "Two expenses in a row add exactly two cards"
      "after a delete the focus moves to the next Delete button":
        uk: "Після видалення фокус переходить на наступну кнопку «Видалити»"
        en: "After a delete, focus moves to the next Delete button"
      "deleting the last expense moves the focus to the Delete button before it":
        uk: "Після видалення останньої витрати фокус переходить на «Видалити» попередньої"
        en: "After the last expense is deleted, focus moves to Delete of the one before it"
      "the amount field has a label":
        uk: "Поле суми має видимий підпис"
        en: "The amount field has a visible label"
      "an expense over the budget gets the warning background":
        uk: "Витрата понад бюджет отримує фон попередження"
        en: "An expense over the budget gets the warning background"
      "the cards fit a 320px wide window without horizontal scrolling":
        uk: "Картки вміщуються у вікно шириною 320px без горизонтальної прокрутки"
        en: "The cards fit a 320px wide window without horizontal scrolling"
      "Clear all is a button and empties the list":
        uk: "«Очистити все» — кнопка з type=\"button\", і вона спорожнює список"
        en: "Clear all is a button with type=\"button\", and it empties the list"
    hints:
      nudge:
        uk: "Іди по одній ваді: відтвори її, знайди рядок коду чи правило, що її спричиняє, виправ і перевір так само, як знайшов. Для подвійного видалення спитай себе, скільки слухачів чує один клік."
        en: "Go one defect at a time: reproduce it, find the line of code or the rule that causes it, repair it and check it the same way you found it. For the double delete, ask yourself how many listeners hear one click."
      explanation:
        uk: |
          - Слухач, доданий усередині `render`, додається при кожній перебудові. Слухачі, що мають жити весь час, додають один раз — поза `render`.
          - Коли той самий клік чують кнопка й список, лиши один обробник: делегований на списку.
          - Позицію запису запам’ятай до видалення, а фокус постав після перебудови — як у прикладі з видаленням звички.
          - Підпис і кнопку робить розмітка: `<label for="…">` і `<button type="button">`.
          - Щоб клас переміг, правило для звичайної картки має бути не сильнішим за нього: порівняй специфічності.
          - Фіксована ширина не стискається; найбільша дозволена ширина — стискається.
        en: |
          - A listener added inside `render` is added again on every rebuild. Listeners that must live the whole time are added once — outside `render`.
          - When the button and the list hear the same click, keep one handler: the delegated one on the list.
          - Remember the record’s position before the delete, and set focus after the rebuild — as in the example with deleting a habit.
          - The markup makes the label and the button: `<label for="…">` and `<button type="button">`.
          - For the class to win, the rule for an ordinary card must be no stronger than it: compare the specificities.
          - A fixed width does not shrink; a largest allowed width does.
    solutionNote:
      uk: "Обидва слухачі — `submit` і делегований на списку — додаються один раз, поза `render`, тож перебудови їх не множать, а клік обробляється один раз. Позиція видаленого запису запам’ятовується до видалення, і після перебудови фокус переходить на сусідню кнопку чи на заголовок. Підпис і кнопка — це розмітка. Правило `.expense` має ту саму специфічність, що й `.over-budget`, тож перемагає те, що нижче, а `max-width` дозволяє картці стискатися."
      en: "Both listeners — `submit` and the delegated one on the list — are added once, outside `render`, so rebuilds do not multiply them and a click is handled once. The deleted record’s position is remembered before the delete, and after the rebuild focus moves to the neighbouring button or the heading. The label and the button are markup. The `.expense` rule has the same specificity as `.over-budget`, so the one lower down wins, and `max-width` lets a card shrink."
    feedback:
      - when: { test: "one click on Delete removes one expense and counts one deletion" }
        message:
          uk: "Ця перевірка клацає «Видалити» в першій картці й чекає на одну картку менше і лічильник `#deleted-count`, більший рівно на 1."
          en: "This check clicks “Delete” in the first card and expects one card fewer and the `#deleted-count` counter greater by exactly 1."
      - when: { test: "adding two expenses in a row adds exactly two cards" }
        message:
          uk: "Ця перевірка двічі поспіль заповнює й надсилає форму і чекає рівно на дві нові картки, остання з них — таксі."
          en: "This check fills in and submits the form twice in a row and expects exactly two new cards, the last of them the taxi."
      - when: { test: "after a delete the focus moves to the next Delete button" }
        message:
          uk: "Ця перевірка ставить фокус на «Видалити» першої картки й натискає Enter. Вона чекає фокус на кнопці «Видалити» картки, що стояла другою."
          en: "This check puts focus on “Delete” of the first card and presses Enter. It expects focus on the “Delete” button of the card that was second."
      - when: { test: "deleting the last expense moves the focus to the Delete button before it" }
        message:
          uk: "Ця перевірка ставить фокус на «Видалити» останньої картки й натискає Enter. Наступної кнопки після неї немає, тож перевірка чекає фокус на кнопці «Видалити» картки, що стояла передостанньою."
          en: "This check puts focus on “Delete” of the last card and presses Enter. There is no next button after it, so the check expects focus on the “Delete” button of the card that was second to last."
      - when: { test: "the amount field has a label" }
        message:
          uk: "Ця перевірка чекає, що поле `#amount` має видимий підпис `<label>`, зв’язаний із ним через `for`/`id` або обгортанням. `placeholder` вона не зараховує: Chrome бере з нього ім’я лише як запасний варіант, а сама підказка зникає, щойно людина почне вводити."
          en: "This check expects the `#amount` field to have a visible `<label>` connected to it through `for`/`id` or by wrapping. A `placeholder` does not count: Chrome takes a name from it only as a fallback, and the hint itself disappears as soon as the person starts typing."
      - when: { test: "an expense over the budget gets the warning background" }
        message:
          uk: "Ця перевірка додає витрату на 25000 і чекає, що її картка має клас `over-budget` і обчислений фон `#fed7d7` — `rgb(254, 215, 215)`."
          en: "This check adds an expense of 25000 and expects its card to have the class `over-budget` and the computed background `#fed7d7` — `rgb(254, 215, 215)`."
      - when: { test: "the cards fit a 320px wide window without horizontal scrolling" }
        message:
          uk: "Ця перевірка відкриває копію сторінки у вікні шириною 320px і чекає, що сторінка вміщується без горизонтальної прокрутки."
          en: "This check opens a copy of the page in a 320px wide window and expects the page to fit without horizontal scrolling."
      - when: { test: "Clear all is a button and empties the list" }
        message:
          uk: "Ця перевірка чекає, що `#clear` — елемент `<button>` з `type=\"button\"`, і що клік по ньому прибирає всі картки."
          en: "This check expects `#clear` to be a `<button>` element with `type=\"button\"` and a click on it to remove every card."
      - when: { error: TypeError }
        message:
          uk: "[[type-error|TypeError]] означає, що дію не можна виконати з таким значенням. «Cannot read properties of undefined (reading 'focus')» або «… of null» з’являється, коли код ставить фокус на кнопку, якої немає: після видалення останньої витрати наступної кнопки вже немає, а після видалення єдиної — жодної. Для цих випадків потрібен запасний варіант."
          en: "A [[type-error|TypeError]] means an action cannot be done with such a value. “Cannot read properties of undefined (reading 'focus')” or “… of null” appears when code focuses a button that does not exist: after the last expense is deleted there is no next button, and after the only one is deleted there is none at all. These cases need a fallback."

