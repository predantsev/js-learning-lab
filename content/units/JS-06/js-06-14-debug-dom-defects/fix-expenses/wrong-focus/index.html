<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; }
      form { display: flex; flex-wrap: wrap; gap: 0 1rem; align-items: end; }
      #expenses { list-style: none; padding: 0; display: grid; gap: 0.5rem; }
      .expense { max-width: 360px; padding: 0.5rem 0.75rem; border: 1px solid #a0aec0; border-radius: 8px; background: white; }
      .over-budget { background: #fed7d7; border-color: #9b2c2c; }
      button, input { font: inherit; }
      :focus-visible { outline: 3px solid #2c5282; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <form id="expense-form">
        <p><label for="what">%%whatLabel%%</label><br><input id="what" name="what" required></p>
        <p><label for="amount">%%amountLabel%%</label><br><input id="amount" name="amount" type="number" min="1" required></p>
        <p><button>%%add%%</button></p>
      </form>
      <h2 id="list-title" tabindex="-1">%%listTitle%%</h2>
      <p>%%deletedLabel%% <span id="deleted-count">0</span> · <button type="button" id="clear">%%clearAll%%</button></p>
      <ul id="expenses"></ul>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
