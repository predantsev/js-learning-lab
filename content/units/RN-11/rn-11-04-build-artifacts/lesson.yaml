id: rn-11-04-build-artifacts
unit: RN-11
title:
  uk: "Артефакти збірки"
  en: "Build artifacts"
kind: local-task
minutes: 20
contentVersion: 1
purpose:
  uk: "Досі ти бачив release лише в імітаціях. Тут ти збереш справжній підписаний release навчального застосунку для своєї заявленої цілі, поставиш його й перевіриш сам артефакт: ідентифікатор, версію, підпис, розмір і те, що в ньому немає debug-гілок і ключів. Якщо native-інструментів немає, завдання позначається як невиконане, а наступні уроки відкриті."
  en: "So far you have seen a release only in simulations. Here you build a real signed release of the lab app for your declared target, install it and check the artifact itself: its id, version, signature, size, and that it carries no debug branches and no keys. With no native tooling the task is marked as not performed, and the next lessons stay open."
objectives:
  - uk: "Зібрати підписаний release-артефакт для заявленої цілі (APK або збірку для iOS-симулятора) і встановити його на емулятор чи пристрій."
    en: "Build a signed release artifact for the declared target (an APK, or a build for the iOS simulator) and install it on the emulator or device."
  - uk: "Перевірити ідентифікатор, версію, підпис і розмір артефакту та переконатися, що він працює з вимкненим dev-сервером і не містить debug-прапорців чи секретів."
    en: "Inspect the artifact's id, version, signature and size, and confirm it runs with the dev server stopped and contains no debug flags or secrets."
prerequisites: [rn-11-03-signing-key-hygiene]
subskills:
  - { family: N-11, skill: "build artifacts", depth: intro }
glossary: [apk, android-app-bundle, ipa]
selfCheck: [predict-installable]

blocks:
  - id: four-artifacts
    kind: explanation
    title:
      uk: "Що виходить зі збирання"
      en: "What comes out of a build"
    body:
      uk: |
        Release-збирання дає один файл чи теку — артефакт. Різних артефактів чотири, і ставляться вони по-різному:

        | Артефакт | Платформа | Куди йде |
        |---|---|---|
        | [[apk\|APK]] | Android | прямо на емулятор чи телефон (`adb install`) |
        | [[android-app-bundle\|AAB]] | Android | лише в Google Play; на телефон сам не ставиться |
        | тека `.app` | iOS-симулятор | на симулятор, без облікового запису Apple |
        | [[ipa\|IPA]] | iPhone | на пристрої чи в App Store Connect; потрібен обліковий запис Apple Developer |

        Курс не вимагає ні облікових записів, ні магазинів, тож ти збираєш те, що ставиться на твою заявлену ціль: APK для Android або `.app` для iOS-симулятора.

        Як і з вебзбіркою в RE-12, перевіряють **артефакт**, а не вихідний код: той самий код з іншим `app.json`, іншим ключем чи debug-гілками дав би інший файл. Тому після встановлення ти читаєш з нього все назад — ідентифікатор, версію, підпис, розмір — і шукаєш у вбудованому bundle те, чого там бути не повинно.
      en: |
        A release build produces one file or folder — the artifact. There are four kinds, and they install differently:

        | Artifact | Platform | Where it goes |
        |---|---|---|
        | [[apk\|APK]] | Android | directly to an emulator or a phone (`adb install`) |
        | [[android-app-bundle\|AAB]] | Android | to Google Play only; it does not install on a phone by itself |
        | a `.app` folder | iOS simulator | to the simulator, with no Apple account |
        | [[ipa\|IPA]] | iPhone | to devices or App Store Connect; an Apple Developer account is needed |

        The course requires no accounts and no stores, so you build what installs on your declared target: an APK for Android or a `.app` for the iOS simulator.

        As with the web build in RE-12, you check the **artifact**, not the source: the same code with another `app.json`, another key or debug branches would give a different file. So after installing you read everything back from it — the id, the version, the signature, the size — and search the embedded bundle for what must not be there.

  - id: artifact-pipeline
    kind: visual
    visual: diagram
    title:
      uk: "З чого складається артефакт і як це прочитати"
      en: "What the artifact is made of, and how to read it back"
    textEquivalent:
      uk: "Вихідний код і app.json проходять чотири етапи. Metro збирає JavaScript у bundle — його перевіряють пошуком тексту в цьому файлі. Gradle чи Xcode компілюють native-код і додають ресурси та маніфест з ідентифікатором і версіями — їх читають adb shell dumpsys package або plutil -p. Пакування дає APK чи теку .app, і його розмір показує ls -lh. Останній етап — підпис: apksigner verify --print-certs показує відбиток сертифіката, який має збігтися з відбитком твого keystore з keytool -list."
      en: "The source code and app.json go through four stages. Metro bundles the JavaScript — it is checked by searching for text in that file. Gradle or Xcode compile the native code and add resources and the manifest with the id and versions — adb shell dumpsys package or plutil -p reads them. Packaging gives an APK or a .app folder, and ls -lh shows its size. The last stage is the signature: apksigner verify --print-certs shows the certificate fingerprint, which must match your keystore's fingerprint from keytool -list."
    spec:
      layout: grid
      nodes:
        - { id: source, label: "App.tsx + app.json", shape: note, w: 170, col: 0, row: 0 }
        - { id: bundle, label: { uk: "Metro: JS-bundle", en: "Metro: JS bundle" }, w: 170, col: 0, row: 1 }
        - { id: native, label: { uk: "Gradle / Xcode: native", en: "Gradle / Xcode: native" }, w: 170, col: 0, row: 2 }
        - { id: package, label: { uk: "пакет: APK / .app", en: "package: APK / .app" }, w: 170, col: 0, row: 3 }
        - { id: sign, label: { uk: "підпис", en: "signature" }, shape: round, w: 170, col: 0, row: 4 }
      edges:
        - { id: s-b, from: source, to: bundle }
        - { id: b-n, from: bundle, to: native }
        - { id: n-p, from: native, to: package }
        - { id: p-s, from: package, to: sign }
      steps:
        - caption:
            uk: "Чотири етапи між твоїм кодом і файлом, який ставиться на ціль."
            en: "Four stages between your code and the file that installs on the target."
        - caption:
            uk: "**Metro** збирає JavaScript у вбудований bundle: гілок `__DEV__` там уже немає. Перевірка — пошук тексту у файлі bundle (`grep -a -F`)."
            en: "**Metro** bundles the JavaScript into the embedded bundle: the `__DEV__` branches are already gone. The check is a text search in the bundle file (`grep -a -F`)."
          highlight: [bundle, s-b]
          dim: [native, package, sign]
          annotate:
            - { id: bundle, text: "grep -a -F" }
        - caption:
            uk: "**Gradle** чи **Xcode** компілюють native-код і вписують маніфест: ідентифікатор і версії з `app.json`. Їх читають `adb shell dumpsys package` чи `plutil -p`."
            en: "**Gradle** or **Xcode** compile the native code and write the manifest: the id and versions from `app.json`. `adb shell dumpsys package` or `plutil -p` reads them."
          highlight: [native, b-n]
          dim: [source, package, sign]
          annotate:
            - { id: native, text: "dumpsys / plutil" }
        - caption:
            uk: "**Пакування** складає все в APK чи теку `.app`. Його розмір — `ls -lh` чи `du -sh`."
            en: "**Packaging** puts everything into an APK or a `.app` folder. Its size: `ls -lh` or `du -sh`."
          highlight: [package, n-p]
          dim: [source, bundle, sign]
          annotate:
            - { id: package, text: "ls -lh" }
        - caption:
            uk: "**Підпис** — останнім. `apksigner verify --print-certs` показує відбиток сертифіката; він має збігтися з відбитком твого keystore з `keytool -list`."
            en: "The **signature** comes last. `apksigner verify --print-certs` shows the certificate fingerprint; it must match your keystore's fingerprint from `keytool -list`."
          highlight: [sign, p-s]
          dim: [source, bundle, native]
          annotate:
            - { id: sign, text: "apksigner" }

  - id: predict-installable
    kind: prediction
    prompt:
      uk: "Твоя заявлена ціль — Android-емулятор. Після збирання в тебе є `app-release.aab` і `app-release.apk`, а колега надіслав `.ipa` свого iOS-застосунку. Що з цього можна поставити на твій емулятор?"
      en: "Your declared target is an Android emulator. After the build you have `app-release.aab` and `app-release.apk`, and a teammate sent the `.ipa` of their iOS app. Which of them can you install on your emulator?"
    runnable: false
    answer:
      type: choice
      options:
        - id: apk-only
          text:
            uk: "Лише `app-release.apk`"
            en: "Only `app-release.apk`"
        - id: apk-aab
          text:
            uk: "`app-release.apk` і `app-release.aab`: обидва — для Android"
            en: "`app-release.apk` and `app-release.aab`: both are for Android"
          why:
            uk: "AAB — формат для завантаження в Google Play. З нього магазин збирає APK під кожен пристрій, а сам він на телефон не ставиться."
            en: "An AAB is a format for uploading to Google Play. The store builds APKs for each device from it; it does not install on a phone by itself."
        - id: all
          text:
            uk: "Усі три: емулятор ставить будь-який пакет застосунку"
            en: "All three: an emulator installs any app package"
          why:
            uk: "IPA — пакет для iOS. Android його не відкриє, а на iPhone він потребує підпису з обліковим записом Apple."
            en: "An IPA is a package for iOS. Android cannot open it, and on an iPhone it needs a signature made with an Apple account."
      correct: [apk-only]
    explanation:
      uk: "На Android-ціль прямо ставиться лише APK. AAB знадобиться, якщо колись публікуватимеш у Google Play, а IPA — справа iOS і облікового запису Apple Developer."
      en: "Only an APK installs directly on an Android target. An AAB is needed if you ever publish to Google Play, and an IPA belongs to iOS and an Apple Developer account."

  - id: recall-artifact-check
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: test-the-artifact
        from: re-12-06-artifact-verification
        prompt:
          uk: "Усі тести React-застосунку на Vitest зелені. Чому перед release його все одно проганяють через `npm run preview`?"
          en: "All Vitest tests of a React app are green. Why is it still run through `npm run preview` before a release?"
        answer:
          type: choice
          options:
            - id: artifact-differs
              text:
                uk: "Тести бачать вихідні модулі, а люди отримають зібраний `dist` — з вписаними значеннями, хешованими файлами й lazy-модулями"
                en: "The tests see the source modules, while people get the built `dist` — with written-in values, hashed files and lazy modules"
            - id: faster
              text:
                uk: "`npm run preview` швидший за тести"
                en: "`npm run preview` is faster than the tests"
              why:
                uk: "Справа не в швидкості: це перевірка іншого об’єкта — того файлу, що поїде до людей."
                en: "It is not about speed: it checks a different object — the file that goes to people."
            - id: tests-wrong
              text:
                uk: "Тести на Vitest часто брешуть, тому їм не довіряють"
                en: "Vitest tests often lie, so they are not trusted"
              why:
                uk: "Тести кажуть правду про вихідний код. Вони просто не бачать того, що з’являється лише після збирання."
                en: "The tests tell the truth about the source. They just do not see what appears only after the build."
          correct: [artifact-differs]
        explanation:
          uk: "Те саме з native-застосунком, і ще сильніше: release має свій bundle, свій маніфест і свій підпис. Тому ти перевіряєш встановлений артефакт, а не те, що бачив у debug."
          en: "The same holds for a native app, even more so: a release has its own bundle, its own manifest and its own signature. So you check the installed artifact, not what you saw in debug."

  - id: build-and-inspect
    kind: local-task
    runtime: local-native
    title:
      uk: "Збери, встанови й перевір release"
      en: "Build, install and inspect a release"
    intro:
      uk: |
        Кроки 1–5 — для всіх. Далі виконуй кроки своєї цілі: **A** — Android-емулятор чи Android-телефон, **I** — iOS-симулятор (лише macOS). Для справжнього iPhone потрібен обліковий запис Apple Developer — курс його не вимагає, тож таку ціль запиши як непідтриману для release.

        **Що перевірено під час підготовки уроку** (macOS, Node.js v25.2.1, JDK 21, Expo SDK 57, React Native 0.86.3): кроки 1–5, генерація keystore з кроку 6A і `prebuild` з плагіном з кроку 7A — з дослівним виводом нижче. `npx tsc --noEmit` для файлів з кроку 3 завершився без повідомлень, а `npx expo export --platform android` зібрав bundle `.hbc` на 1,4 МБ, у якому `grep -a -F` знайшов `Build: release` і англійські назви бажань, але не знайшов `[dev] wishes` і `Build: debug`. **Шукай у bundle лише латинський текст:** текст з українськими літерами Hermes зберігає в іншому кодуванні (UTF-16), і `grep` його не знаходить — `'Збірка: release'` у тому самому bundle `grep` не побачив, хоч цей текст там є. **Збирання native-частини, встановлення й усі команди з `adb`, `apksigner`, `xcrun` і `plutil` не перевірено** — Android SDK, емулятора й Xcode там немає. Що покажуть вони в тебе, запиши сам.

        Якщо native-інструментів немає, натисни **«У мене немає емулятора чи пристрою»**: завдання запишеться як не виконане.

        **Крок 2 — поля в `app.json`** (усередині `"expo"`; решту не чіпай):

        ```json
        "name": "Release lab",
        "version": "1.0.0",
        "android": { "package": "com.example.jsll.releaselab", "versionCode": 1 },
        "ios": { "bundleIdentifier": "com.example.jsll.releaselab", "buildNumber": "1" }
        ```

        У `"android"` і `"ios"` уже є інші поля (`adaptiveIcon`, `supportsTablet` тощо) — додай нові поруч, не видаляючи їх.

        **Крок 3 — `wishes.json`** (новий файл поруч з `App.tsx`):

        ```json
        [
          { "id": "w-01", "name": "Навушники", "price": 80, "acquired": false },
          { "id": "w-02", "name": "Настільна лампа", "price": 45, "acquired": false },
          { "id": "w-03", "name": "Велосипед", "price": 240, "acquired": false },
          { "id": "w-04", "name": "Книжка про JavaScript", "price": 25, "acquired": true },
          { "id": "w-05", "name": "Квитки на концерт", "price": null, "acquired": false },
          { "id": "w-06", "name": "Термочашка", "price": 18, "acquired": true }
        ]
        ```

        **Крок 3 — `App.tsx`** (повністю заміни ним файл):

        ```tsx
        // RN-11 release lab: the bundled wishes, the wanted total and the build mode.
        import { StyleSheet, Text, View } from 'react-native';
        import wishes from './wishes.json';

        const wantedTotal = wishes
          .filter((wish) => !wish.acquired && wish.price !== null)
          .reduce((sum, wish) => sum + (wish.price ?? 0), 0);

        export default function App() {
          if (__DEV__) console.log('[dev] wishes in wishes.json:', wishes.length);
          return (
            <View style={styles.screen}>
              <Text style={styles.heading}>Release lab</Text>
              <Text>{__DEV__ ? 'Збірка: debug' : 'Збірка: release'}</Text>
              {wishes.map((wish) => <Text key={wish.id}>{wish.name}</Text>)}
              <Text style={styles.total}>Бажане разом: {wantedTotal}</Text>
            </View>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, paddingTop: 64, paddingHorizontal: 16, gap: 8, backgroundColor: '#ffffff' },
          heading: { fontSize: 20, fontWeight: '600' },
          total: { marginTop: 8, fontWeight: '600' },
        });
        ```

        **Крок 6A — рядки для `~/.gradle/gradle.properties`** (файл поза проєктом; створи, якщо його немає; заміни `ТВІЙ_ПАРОЛЬ` і шлях до домашньої теки — Gradle не розуміє `~` у шляхах):

        ```text
        MYAPP_UPLOAD_STORE_FILE=/Users/твоє-ім’я/keys/rn11-lab-upload.keystore
        MYAPP_UPLOAD_KEY_ALIAS=rn11-lab-upload
        MYAPP_UPLOAD_STORE_PASSWORD=ТВІЙ_ПАРОЛЬ
        MYAPP_UPLOAD_KEY_PASSWORD=ТВІЙ_ПАРОЛЬ
        ```

        Обидва паролі однакові: у сховищі PKCS12 пароль ключа збігається з паролем сховища. На Windows шлях має вигляд `C:\\Users\\твоє-ім’я\\keys\\rn11-lab-upload.keystore` (подвійні зворотні скісні риски).

        **Крок 7A — release-підпис через config plugin.** [Документація React Native 0.86 («Publishing to Google Play Store»)](https://reactnative.dev/docs/0.86/signed-apk-android) каже додати блок `release` у `signingConfigs` файлу `android/app/build.gradle`. Але в проєкті Expo цей файл генерує `prebuild`: ми додали блок руками, запустили звичайний `npx expo prebuild` — і блок зник, а release знову підписувався `debug`: у Expo SDK 57 `prebuild` за замовчуванням створює теку наново (`--no-clean` це вимикає, але лише на твоєму комп’ютері). До того ж тека `android/` ігнорується Git (рядок `/android` у `.gitignore`). Тому той самий блок додає маленький **config plugin** — функція, яку `prebuild` викликає щоразу, коли генерує native-файли. Новий файл `plugins/with-release-signing.js`:

        ```js
        // Config plugin: on every `npx expo prebuild`, adds the release signing config from the
        // React Native 0.86 guide to android/app/build.gradle. The values come from ~/.gradle/gradle.properties.
        const { withAppBuildGradle } = require('expo/config-plugins');

        const RELEASE_SIGNING = `        release {
                    if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                        storeFile file(MYAPP_UPLOAD_STORE_FILE)
                        storePassword MYAPP_UPLOAD_STORE_PASSWORD
                        keyAlias MYAPP_UPLOAD_KEY_ALIAS
                        keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                    }
                }
        `;

        module.exports = function withReleaseSigning(config) {
          return withAppBuildGradle(config, (mod) => {
            if (mod.modResults.language !== 'groovy') throw new Error('with-release-signing: build.gradle is not Groovy');
            let gradle = mod.modResults.contents;
            if (!gradle.includes('MYAPP_UPLOAD_STORE_FILE')) {
              gradle = gradle.replace('    signingConfigs {\n', (start) => start + RELEASE_SIGNING);
            }
            gradle = gradle.replace(
              /(buildTypes \{[\s\S]*?\n        release \{[\s\S]*?)signingConfig signingConfigs\.debug/,
              '$1signingConfig signingConfigs.release',
            );
            // Fail loudly instead of silently signing release with the debug key if the template changed.
            if (!gradle.includes('MYAPP_UPLOAD_STORE_FILE') || !gradle.includes('signingConfig signingConfigs.release')) {
              throw new Error('with-release-signing: the template of build.gradle changed; release signing was not added');
            }
            mod.modResults.contents = gradle;
            return mod;
          });
        };
        ```

        І в `app.json` усередині `"expo"` — рядок, що його вмикає:

        ```json
        "plugins": ["./plugins/with-release-signing"]
        ```

        Дві перевірки (`throw`) зупиняють `prebuild` з помилкою, якщо файл не той чи шаблон колись зміниться і блок не додасться, — інакше release тихо підписувався б ключем `debug`. Плагін і рядок у `app.json` лежать у репозиторії: паролів і ключа в них немає, лише назви властивостей.

        **Крок 10 — `release-evidence.md`** у корені проєкту (приклад; заповни своїми даними, без паролів):

        ```text
        # Release evidence — build 1
        Target: Android emulator, Pixel 9, Android 16
        Artifact: android/app/build/outputs/apk/release/app-release.apk, <size>
        Id / versions: com.example.jsll.releaselab, versionName 1.0.0, versionCode 1
        Signer SHA-256 matches keytool -list: yes
        Dev server stopped, app reopened: 6 wishes, "Збірка: release", total 365
        "[dev]" in the bundle: 0 times; no .keystore inside the artifact
        Install outcome: installed, launched
        ```
      en: |
        Steps 1–5 are for everyone. After that, do the steps of your target: **A** — an Android emulator or an Android phone, **I** — the iOS simulator (macOS only). A real iPhone needs an Apple Developer account — the course does not require one, so record such a target as unsupported for a release.

        **What was checked while preparing this lesson** (macOS, Node.js v25.2.1, JDK 21, Expo SDK 57, React Native 0.86.3): steps 1–5, the keystore generation of step 6A and `prebuild` with the plugin of step 7A — with their verbatim output below. `npx tsc --noEmit` for the files of step 3 finished without messages, and `npx expo export --platform android` built a 1.4 MB `.hbc` bundle in which `grep -a -F` found `Build: release` and the wish names but not `[dev] wishes` or `Build: debug`. **Search the bundle only for Latin text:** Hermes stores text with non-Latin letters (Ukrainian, for example) in another encoding (UTF-16), and `grep` does not find it — `grep` did not see `'Збірка: release'` in the same bundle, although the string is there. **Building the native part, installing, and every command with `adb`, `apksigner`, `xcrun` and `plutil` were not checked** — there is no Android SDK, emulator or Xcode there. Write down yourself what they show for you.

        If you have no native tooling, press **“I have no emulator or device”**: the task is recorded as not performed.

        **Step 2 — fields in `app.json`** (inside `"expo"`; leave the rest alone):

        ```json
        "name": "Release lab",
        "version": "1.0.0",
        "android": { "package": "com.example.jsll.releaselab", "versionCode": 1 },
        "ios": { "bundleIdentifier": "com.example.jsll.releaselab", "buildNumber": "1" }
        ```

        `"android"` and `"ios"` already have other fields (`adaptiveIcon`, `supportsTablet` and so on) — add the new ones next to them without deleting anything.

        **Step 3 — `wishes.json`** (a new file next to `App.tsx`):

        ```json
        [
          { "id": "w-01", "name": "Headphones", "price": 80, "acquired": false },
          { "id": "w-02", "name": "Desk lamp", "price": 45, "acquired": false },
          { "id": "w-03", "name": "Bicycle", "price": 240, "acquired": false },
          { "id": "w-04", "name": "A book about JavaScript", "price": 25, "acquired": true },
          { "id": "w-05", "name": "Concert tickets", "price": null, "acquired": false },
          { "id": "w-06", "name": "Travel mug", "price": 18, "acquired": true }
        ]
        ```

        **Step 3 — `App.tsx`** (replace the whole file with it):

        ```tsx
        // RN-11 release lab: the bundled wishes, the wanted total and the build mode.
        import { StyleSheet, Text, View } from 'react-native';
        import wishes from './wishes.json';

        const wantedTotal = wishes
          .filter((wish) => !wish.acquired && wish.price !== null)
          .reduce((sum, wish) => sum + (wish.price ?? 0), 0);

        export default function App() {
          if (__DEV__) console.log('[dev] wishes in wishes.json:', wishes.length);
          return (
            <View style={styles.screen}>
              <Text style={styles.heading}>Release lab</Text>
              <Text>{__DEV__ ? 'Build: debug' : 'Build: release'}</Text>
              {wishes.map((wish) => <Text key={wish.id}>{wish.name}</Text>)}
              <Text style={styles.total}>Wanted total: {wantedTotal}</Text>
            </View>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, paddingTop: 64, paddingHorizontal: 16, gap: 8, backgroundColor: '#ffffff' },
          heading: { fontSize: 20, fontWeight: '600' },
          total: { marginTop: 8, fontWeight: '600' },
        });
        ```

        **Step 6A — lines for `~/.gradle/gradle.properties`** (a file outside the project; create it if it does not exist; replace `YOUR_PASSWORD` and the home folder path — Gradle does not understand `~` in paths):

        ```text
        MYAPP_UPLOAD_STORE_FILE=/Users/your-name/keys/rn11-lab-upload.keystore
        MYAPP_UPLOAD_KEY_ALIAS=rn11-lab-upload
        MYAPP_UPLOAD_STORE_PASSWORD=YOUR_PASSWORD
        MYAPP_UPLOAD_KEY_PASSWORD=YOUR_PASSWORD
        ```

        Both passwords are the same: in a PKCS12 store the key password equals the store password. On Windows the path looks like `C:\\Users\\your-name\\keys\\rn11-lab-upload.keystore` (doubled backslashes).

        **Step 7A — release signing through a config plugin.** [The React Native 0.86 docs (“Publishing to Google Play Store”)](https://reactnative.dev/docs/0.86/signed-apk-android) say to add a `release` block to `signingConfigs` in `android/app/build.gradle`. But in an Expo project `prebuild` generates that file: we added the block by hand, ran a plain `npx expo prebuild` — and the block was gone, with release signed by `debug` again: in Expo SDK 57 `prebuild` recreates the folder by default (`--no-clean` turns that off, but only on your computer). On top of that, Git ignores the `android/` folder (the `/android` line in `.gitignore`). So the same block is added by a small **config plugin** — a function `prebuild` calls every time it generates the native files. A new file `plugins/with-release-signing.js`:

        ```js
        // Config plugin: on every `npx expo prebuild`, adds the release signing config from the
        // React Native 0.86 guide to android/app/build.gradle. The values come from ~/.gradle/gradle.properties.
        const { withAppBuildGradle } = require('expo/config-plugins');

        const RELEASE_SIGNING = `        release {
                    if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                        storeFile file(MYAPP_UPLOAD_STORE_FILE)
                        storePassword MYAPP_UPLOAD_STORE_PASSWORD
                        keyAlias MYAPP_UPLOAD_KEY_ALIAS
                        keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                    }
                }
        `;

        module.exports = function withReleaseSigning(config) {
          return withAppBuildGradle(config, (mod) => {
            if (mod.modResults.language !== 'groovy') throw new Error('with-release-signing: build.gradle is not Groovy');
            let gradle = mod.modResults.contents;
            if (!gradle.includes('MYAPP_UPLOAD_STORE_FILE')) {
              gradle = gradle.replace('    signingConfigs {\n', (start) => start + RELEASE_SIGNING);
            }
            gradle = gradle.replace(
              /(buildTypes \{[\s\S]*?\n        release \{[\s\S]*?)signingConfig signingConfigs\.debug/,
              '$1signingConfig signingConfigs.release',
            );
            // Fail loudly instead of silently signing release with the debug key if the template changed.
            if (!gradle.includes('MYAPP_UPLOAD_STORE_FILE') || !gradle.includes('signingConfig signingConfigs.release')) {
              throw new Error('with-release-signing: the template of build.gradle changed; release signing was not added');
            }
            mod.modResults.contents = gradle;
            return mod;
          });
        };
        ```

        And in `app.json` inside `"expo"`, the line that turns it on:

        ```json
        "plugins": ["./plugins/with-release-signing"]
        ```

        Two checks (`throw`) stop `prebuild` with an error if the file is not the expected one or if the template ever changes and the block is not added — otherwise release would quietly be signed with the `debug` key. The plugin and the `app.json` line live in the repository: they hold no passwords and no key, only property names.

        **Step 10 — `release-evidence.md`** in the project root (an example; fill in your own data, no passwords):

        ```text
        # Release evidence — build 1
        Target: Android emulator, Pixel 9, Android 16
        Artifact: android/app/build/outputs/apk/release/app-release.apk, <size>
        Id / versions: com.example.jsll.releaselab, versionName 1.0.0, versionCode 1
        Signer SHA-256 matches keytool -list: yes
        Dev server stopped, app reopened: 6 wishes, "Build: release", total 365
        "[dev]" in the bundle: 0 times; no .keystore inside the artifact
        Install outcome: installed, launched
        ```
    tools:
      - { name: "Node.js", version: "22.13 or newer", note: { uk: "мінімум для Expo SDK 57", en: "the minimum for Expo SDK 57" } }
      - { name: "Expo SDK", version: "57 (React Native 0.86)", note: { uk: "ставиться командою з кроку 1", en: "installed by the command in step 1" } }
      - { name: "JDK", version: "17 or newer", note: { uk: "для `keytool` і Gradle (ціль A); ми перевіряли `keytool` з JDK 21", en: "for `keytool` and Gradle (target A); we checked `keytool` from JDK 21" } }
      - { name: "Android Studio", note: { uk: "ціль A: Android SDK з Build-Tools (у них `apksigner`) і емулятор з RN-01", en: "target A: the Android SDK with Build-Tools (they contain `apksigner`) and the emulator from RN-01" } }
      - { name: "Xcode", version: "26.4 or newer", note: { uk: "лише ціль I і лише macOS", en: "target I only, and only on macOS" } }
    steps:
      - text:
          uk: "Створи навчальний проєкт у теці `~/js-course`."
          en: "Create the lab project in the `~/js-course` folder."
        command: "cd ~/js-course\nnpx create-expo-app@latest rn11-lab --template blank-typescript@sdk-57 --no-agents-md\ncd rn11-lab"
        expect:
          uk: "`✔ Downloaded and extracted project files.`, потім `npm install`; з’являється тека `rn11-lab`, у `package.json` — `expo` ~57 і `react-native` 0.86.x (у нас — `~57.0.26` і `0.86.3`)."
          en: "`✔ Downloaded and extracted project files.`, then `npm install`; a `rn11-lab` folder appears, and `package.json` lists `expo` ~57 and `react-native` 0.86.x (ours: `~57.0.26` and `0.86.3`)."
      - text:
          uk: "Додай в `app.json` ідентифікатори й версії з кроку 2 вступу. Без них `prebuild` вигадає тимчасовий `com.anonymous.rn11lab` — з ним release не випускають."
          en: "Add the ids and versions from step 2 of the intro to `app.json`. Without them `prebuild` makes up a placeholder `com.anonymous.rn11lab` — no release ships with that."
      - text:
          uk: "Створи `wishes.json` і заміни `App.tsx` кодом кроку 3 вступу. Перевір типи."
          en: "Create `wishes.json` and replace `App.tsx` with the step 3 code from the intro. Check the types."
        command: "npx tsc --noEmit"
        expect:
          uk: "Команда завершується без жодного повідомлення."
          en: "The command finishes without any message."
      - text:
          uk: "Ще до native-збирання подивись, який JavaScript потрапить у release: збери лише bundle й пошукай у ньому рядки з коду."
          en: "Before the native build, look at which JavaScript will get into the release: build only the bundle and search it for strings from the code."
        command: "npx expo export --platform android --output-dir release-check\ngrep -c -a -F \"[dev] wishes\" release-check/_expo/static/js/android/*.hbc\ngrep -c -a -F \"Release lab\" release-check/_expo/static/js/android/*.hbc\nrm -r release-check"
        expect:
          uk: "`export` друкує `Android Bundled …` і `_expo/static/js/android/index-….hbc (1.4MB)`. Перший `grep` дає `0` — гілки `__DEV__` в release немає, другий — `1`. Остання команда прибирає тимчасову теку `release-check`, щоб вона не потрапила в commit."
          en: "`export` prints `Android Bundled …` and `_expo/static/js/android/index-….hbc (1.4MB)`. The first `grep` gives `0` — the `__DEV__` branch is not in the release; the second gives `1`. The last command removes the temporary `release-check` folder so that it does not get into a commit."
      - text:
          uk: "Закоміть зміни, щоб наступні кроки було видно в `git diff`."
          en: "Commit the changes so that the next steps show up in `git diff`."
        command: "git add -A\ngit commit -m \"Set up the release lab app\""
      - text:
          uk: "**A.** Створи keystore у теці **поза** проєктом. `keytool` двічі спитає пароль (у нас — `Enter keystore password:` і `Re-enter new password:`). Потім додай рядки кроку 6A вступу в `~/.gradle/gradle.properties`. Якщо `keytool` не знайдено, див. «Якщо щось пішло не так»."
          en: "**A.** Create the keystore in a folder **outside** the project. `keytool` asks for the password twice (for us: `Enter keystore password:` and `Re-enter new password:`). Then add the step 6A lines from the intro to `~/.gradle/gradle.properties`. If `keytool` is not found, see “If something goes wrong”."
        command: "mkdir -p ~/keys\ncd ~/keys\nkeytool -genkeypair -v -storetype PKCS12 -keystore rn11-lab-upload.keystore -alias rn11-lab-upload -keyalg RSA -keysize 2048 -validity 10000 -dname \"CN=Release lab\"\nkeytool -list -keystore rn11-lab-upload.keystore\ncd ~/js-course/rn11-lab"
        expect:
          uk: "`Generating 2,048 bit RSA key pair and self-signed certificate (SHA384withRSA) with a validity of 10,000 days` і `[Storing rn11-lab-upload.keystore]`. `keytool -list` (ще раз пароль) друкує `Certificate fingerprint (SHA-256): …` — запиши цей відбиток."
          en: "`Generating 2,048 bit RSA key pair and self-signed certificate (SHA384withRSA) with a validity of 10,000 days` and `[Storing rn11-lab-upload.keystore]`. `keytool -list` (the password once more) prints `Certificate fingerprint (SHA-256): …` — note this fingerprint."
      - text:
          uk: "**A.** Створи `plugins/with-release-signing.js` і додай рядок `\"plugins\"` в `app.json`, як у кроці 7A вступу. Потім згенеруй теку `android/` і перевір, чим підписується кожен варіант. Закоміть плагін."
          en: "**A.** Create `plugins/with-release-signing.js` and add the `\"plugins\"` line to `app.json` as in step 7A of the intro. Then generate the `android/` folder and check what signs each variant. Commit the plugin."
        command: "npx expo prebuild --platform android\ngrep -n \"signingConfig signingConfigs\" android/app/build.gradle\ngit add -A\ngit commit -m \"Sign release builds with the upload key\""
        expect:
          uk: "`✔ Created native directory`, `✔ Updated package.json` і `✔ Finished prebuild`. `grep` показує два рядки: `signingConfig signingConfigs.debug` (для debug) і `signingConfig signingConfigs.release` (для release). У `android/app/build.gradle` також `applicationId 'com.example.jsll.releaselab'`, `versionCode 1`, `versionName \"1.0.0\"`. У нас було саме так — і після повторного `prebuild`, і після `prebuild --no-clean`, що застосовує плагін до вже зміненого файла: блок `release` не подвоюється."
          en: "`✔ Created native directory`, `✔ Updated package.json` and `✔ Finished prebuild`. `grep` shows two lines: `signingConfig signingConfigs.debug` (for debug) and `signingConfig signingConfigs.release` (for release). `android/app/build.gradle` also has `applicationId 'com.example.jsll.releaselab'`, `versionCode 1`, `versionName \"1.0.0\"`. That is exactly what we got — also after a repeated `prebuild` and after `prebuild --no-clean`, which applies the plugin to the already changed file: the `release` block is not doubled."
      - text:
          uk: "**A.** Запусти емулятор (або підключи телефон) і збери та встав release. Команда сама ставить і відкриває застосунок. Не перевірено під час підготовки уроку; перше збирання триває кілька хвилин."
          en: "**A.** Start the emulator (or connect the phone), then build and install the release. The command installs and opens the app by itself. Not checked while preparing this lesson; the first build takes several minutes."
        command: "npx expo run:android --variant release"
        expect:
          uk: "Застосунок відкривається з написом «Збірка: release», шістьма бажаннями й «Бажане разом: 365». APK зазвичай лежить в `android/app/build/outputs/apk/release/app-release.apk`; якщо ні — `find android/app/build/outputs -name \"*.apk\"`."
          en: "The app opens showing “Build: release”, six wishes and “Wanted total: 365”. The APK usually lands in `android/app/build/outputs/apk/release/app-release.apk`; if not, `find android/app/build/outputs -name \"*.apk\"`."
      - text:
          uk: "**A.** Переконайся, що release не потребує dev-сервера: закрий усі термінали з `npx expo start`, зупини застосунок і відкрий його знову з меню емулятора. Потім прочитай з артефакту ідентифікатор, версії, підпис і розмір та пошукай у вбудованому bundle debug-рядок і ключ. Заміни `<версія>` на теку з `$ANDROID_HOME/build-tools`. Жодну з цих команд тут не запускали."
          en: "**A.** Make sure the release needs no dev server: close every terminal running `npx expo start`, stop the app and open it again from the emulator's launcher. Then read the id, versions, signature and size back from the artifact, and search the embedded bundle for the debug string and for a key. Replace `<version>` with the folder from `$ANDROID_HOME/build-tools`. None of these commands was run here."
        command: "adb shell am force-stop com.example.jsll.releaselab\nadb shell dumpsys package com.example.jsll.releaselab | grep -E \"versionCode|versionName\"\n$ANDROID_HOME/build-tools/<version>/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk\nls -lh android/app/build/outputs/apk/release/app-release.apk\nunzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E \"index.android.bundle|keystore\"\nunzip -p android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle | grep -c -a -F \"[dev] wishes\""
        expect:
          uk: "Після повторного відкриття — той самий екран. У рядках, які `dumpsys` видасть для `versionCode` і `versionName`, мають стояти `1` і `1.0.0` (точного формату ми не бачили). `apksigner` друкує відбиток SHA-256 підписувача — це той самий відбиток, що з `keytool -list`, лише малими літерами й без двокрапок. `unzip -l` знаходить `assets/index.android.bundle` і жодного keystore, а останній `grep` дає `0`. Формати виводу взято з документації інструментів, а назву файлу bundle — з шаблону React Native; якщо в тебе інакше, запиши, що побачив."
          en: "After reopening — the same screen. The lines `dumpsys` prints for `versionCode` and `versionName` should carry `1` and `1.0.0` (we have not seen the exact format). `apksigner` prints the signer's SHA-256 fingerprint — the same fingerprint as from `keytool -list`, only lowercase and without colons. `unzip -l` finds `assets/index.android.bundle` and no keystore, and the last `grep` gives `0`. The output formats come from the tools' documentation and the bundle file name from the React Native template; if yours differ, write down what you saw."
      - text:
          uk: "**I.** Лише macOS. Згенеруй теку `ios/` (команда ставить і CocoaPods-залежності), збери та встав release на симулятор, потім прочитай версії з `Info.plist` встановленого застосунку, його розмір і пошукай debug-рядок у `main.jsbundle`. Не перевірено під час підготовки уроку."
          en: "**I.** macOS only. Generate the `ios/` folder (the command also installs the CocoaPods dependencies), build and install the release on the simulator, then read the versions from the installed app's `Info.plist`, its size, and search `main.jsbundle` for the debug string. Not checked while preparing this lesson."
        command: "npx expo prebuild --platform ios\nnpx expo run:ios --configuration Release\nAPP=$(xcrun simctl get_app_container booted com.example.jsll.releaselab)\nplutil -p \"$APP/Info.plist\" | grep -E \"CFBundleIdentifier|CFBundleVersion|CFBundleShortVersionString\"\ndu -sh \"$APP\"\ngrep -c -a -F \"[dev] wishes\" \"$APP/main.jsbundle\""
        expect:
          uk: "Симулятор відкриває застосунок з «Збірка: release». `plutil` показує `com.example.jsll.releaselab`, `CFBundleVersion` `1` і `CFBundleShortVersionString` `1.0.0`; `grep` дає `0`. Збірка для симулятора не має підпису для розповсюдження — у `release-evidence.md` так і запиши."
          en: "The simulator opens the app with “Build: release”. `plutil` shows `com.example.jsll.releaselab`, `CFBundleVersion` `1` and `CFBundleShortVersionString` `1.0.0`; `grep` gives `0`. A simulator build has no distribution signature — write exactly that in `release-evidence.md`."
      - text:
          uk: "Створи `release-evidence.md` за зразком кроку 10 вступу й закоміть його. Ні keystore, ні паролів у ньому немає — перевір `git status` перед комітом."
          en: "Create `release-evidence.md` following the step 10 sample in the intro and commit it. It holds neither the keystore nor passwords — check `git status` before committing."
        command: "git status --short\ngit add release-evidence.md\ngit commit -m \"Record release evidence for build 1\""
        expect:
          uk: "`git status` показує `?? release-evidence.md` (на цілі I ще `M package.json`: `prebuild` змінив у ньому скрипти — його теж можна закомітити). Жодного `.keystore` у списку."
          en: "`git status` shows `?? release-evidence.md` (on target I also `M package.json`: `prebuild` changed its scripts — you may commit it too). No `.keystore` in the list."
    verify:
      - id: release-installed
        text:
          uk: "Release встановлено на мою заявлену ціль, і після повторного відкриття з вимкненим dev-сервером він показує «Збірка: release», шість бажань і суму 365."
          en: "The release is installed on my declared target, and after reopening with the dev server stopped it shows “Build: release”, six wishes and the total 365."
      - id: artifact-read-back
        text:
          uk: "Я прочитав з артефакту ідентифікатор і обидві версії, а на Android — ще й відбиток підпису, і він збігся з відбитком мого keystore."
          en: "I read the id and both versions back from the artifact, and on Android also the signature fingerprint, which matched my keystore's fingerprint."
      - id: no-debug-no-keys
        text:
          uk: "У вбудованому bundle тексту `[dev] wishes` немає, у артефакті немає keystore, а в репозиторії — ні ключа, ні паролів."
          en: "The embedded bundle has no `[dev] wishes` string, the artifact has no keystore, and the repository has neither the key nor passwords."
      - id: evidence-committed
        text:
          uk: "`release-evidence.md` закомічено з ціллю, артефактом, розміром і результатом встановлення."
          en: "`release-evidence.md` is committed with the target, the artifact, its size and the install outcome."
    troubleshooting:
      - problem:
          uk: "`command not found: keytool`"
          en: "`command not found: keytool`"
        fix:
          uk: "`keytool` входить у JDK. Встанови JDK 17 чи новіший (документація React Native радить Zulu 17) або скористайся JDK, вбудованим в Android Studio, — його теку показує Settings → Build, Execution, Deployment → Build Tools → Gradle → Gradle JDK. Цих шляхів тут не перевіряли."
          en: "`keytool` comes with a JDK. Install JDK 17 or newer (the React Native docs suggest Zulu 17) or use the JDK built into Android Studio — Settings → Build, Execution, Deployment → Build Tools → Gradle → Gradle JDK shows its folder. These paths were not checked here."
      - problem:
          uk: "Збирання release зупиняється з помилкою про keystore чи signing config `release`"
          en: "The release build stops with an error about the keystore or the `release` signing config"
        fix:
          uk: "Перевір, що в `~/.gradle/gradle.properties` є всі чотири рядки `MYAPP_UPLOAD_…`, шлях повний (без `~`) і файл за ним існує: `ls -l /Users/твоє-ім’я/keys/rn11-lab-upload.keystore`. Точного тексту помилки ми не бачили — збирання тут не запускали; знайди в журналі перший рядок `FAILURE` чи `What went wrong`."
          en: "Check that `~/.gradle/gradle.properties` has all four `MYAPP_UPLOAD_…` lines, the path is full (no `~`) and the file exists there: `ls -l /Users/your-name/keys/rn11-lab-upload.keystore`. We have not seen the exact error text — the build was not run here; find the first `FAILURE` or `What went wrong` line in the log."
      - problem:
          uk: "Release не ставиться поверх debug-збірки того самого застосунку"
          en: "The release does not install over a debug build of the same app"
        fix:
          uk: "Debug-збірку підписано `debug.keystore`, release — твоїм ключем: для пристрою це різні підписи. Документація React Native 0.86 радить спершу видалити попередню версію: `adb uninstall com.example.jsll.releaselab` (дані навчального застосунку зникнуть, у ньому лише фікстури)."
          en: "The debug build is signed with `debug.keystore`, the release with your key: for the device these are different signatures. The React Native 0.86 docs advise uninstalling the previous version first: `adb uninstall com.example.jsll.releaselab` (the lab app's data goes away; it holds only fixtures)."
      - problem:
          uk: "`apksigner: No such file or directory`"
          en: "`apksigner: No such file or directory`"
        fix:
          uk: "`apksigner` лежить у теці конкретної версії Build-Tools: подивись `ls $ANDROID_HOME/build-tools` і підстав назву теки замість `<версія>`. Якщо Build-Tools немає, встанови їх в Android Studio (SDK Tools)."
          en: "`apksigner` lives in the folder of a specific Build-Tools version: look at `ls $ANDROID_HOME/build-tools` and put that folder name in place of `<version>`. If there are no Build-Tools, install them in Android Studio (SDK Tools)."
    recovery:
      uk: "Проєкт створено з Git-репозиторієм, і крок 5 закомітив робочий стан. Якщо тека `android/` заплуталася, `npx expo prebuild --platform android --clean` створює її наново з `app.json`, і плагін з кроку 7A знову додає release-підпис. Keystore лежить у `~/keys` поза проєктом і від цього не страждає. Встановлений release прибирає `adb uninstall com.example.jsll.releaselab`."
      en: "The project was created with a Git repository, and step 5 committed a working state. If the `android/` folder gets tangled, `npx expo prebuild --platform android --clean` creates it anew from `app.json`, and the plugin from step 7A adds the release signing again. The keystore sits in `~/keys` outside the project and is unaffected. `adb uninstall com.example.jsll.releaselab` removes the installed release."

  - id: to-project
    kind: transfer
    capstoneStep: RN-11
    body:
      uk: "Для release свого проєкту в тебе тепер є перевірений порядок: ідентифікатори в `app.json`, keystore поза проєктом, release-підпис через config plugin, збирання й встановлення на заявлену ціль, а потім читання артефакту назад і запис у `RELEASE.md` проєкту."
      en: "For your project's release you now have a checked order: ids in `app.json`, a keystore outside the project, release signing through a config plugin, building and installing on the declared target, and then reading the artifact back and recording it in the project's `RELEASE.md`."
