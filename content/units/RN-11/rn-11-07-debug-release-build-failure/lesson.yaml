id: rn-11-07-debug-release-build-failure
unit: RN-11
title:
  uk: "Налагодження: збій release-збірки"
  en: "Debug: a release build failure"
kind: local-task
minutes: 25
contentVersion: 1
purpose:
  uk: "Release ламається інакше, ніж debug: не червоним екраном з рядком коду, а відмовою Gradle, відмовою встановлення чи застосунком, що закривається одразу після запуску. Три типові причини — keystore, якого немає за шляхом, номер збірки, що не зріс, і код лише для розробки, що опинився в release. Ти спершу знайдеш і полагодиш усі три в навчальній імітації, а потім відтвориш їх на своїй заявленій цілі й полагодиш так, щоб жоден ключ чи пароль не потрапив у репозиторій."
  en: "A release breaks differently from debug: not with a red screen and a line of code, but with Gradle refusing, the installation refusing, or an app that closes right after starting. Three typical causes are a keystore that is not at its path, a build number that did not grow, and development-only code that ended up in the release. You first find and repair all three in a lab simulation, then reproduce them on your declared target and repair them so that no key or password gets into the repository."
objectives:
  - uk: "Знайти причину підготовленого збою, що є лише в release, на заявленій цілі: номер збірки, що не зріс, конфігурацію підпису з відсутнім ключем і залежність лише для розробки."
    en: "Diagnose a seeded release-only failure on the declared target: a version code that did not increase, a signing config that points at a missing key and a dev-only dependency."
  - uk: "Полагодити його, не закомітивши ключа чи пароля, і підтвердити встановлене оновлення на цілі."
    en: "Repair it without committing a key or password, and confirm the installed update on the target."
prerequisites: [rn-11-06-compatibility-rollback]
subskills:
  - { family: N-11, skill: "Android/iOS config/package ids/versions", depth: assess }
  - { family: N-11, skill: "debug/release", depth: assess }
  - { family: N-11, skill: "signing/key hygiene", depth: assess }
glossary: []
selfCheck: [seeded-release]

blocks:
  - id: three-stages
    kind: explanation
    title:
      uk: "Три етапи — три місця, де шукати"
      en: "Three stages, three places to look"
    body:
      uk: |
        `npx expo run:android --variant release` робить три речі поспіль і зупиняється на першому збої. Тому й шукати треба по черзі:

        | Етап | Типова причина | Де видно |
        |---|---|---|
        | збирання й підпис | keystore не за тим шляхом, не той alias чи пароль | журнал збирання Gradle, блок `What went wrong` |
        | встановлення | номер збірки менший за встановлений (рівний перевстановиться, але магазин його не прийме); інший ключ підпису | вивід команди: установлювач Android повертає код помилки на кшталт `INSTALL_FAILED_…` |
        | запуск | код лише для розробки, що в release кидає помилку | журнал пристрою (`adb logcat`), а не термінал Metro — його в release немає |

        Полагодивши один етап, ти доходиш до наступного — і бачиш наступну причину. Тож лагодь по одній і щоразу запускай ту саму команду.
      en: |
        `npx expo run:android --variant release` does three things in a row and stops at the first failure. So you look in order too:

        | Stage | Typical cause | Where it shows |
        |---|---|---|
        | build and signing | the keystore is not at the path, a wrong alias or password | Gradle's build log, the `What went wrong` block |
        | installation | the build number is lower than the installed one (an equal one reinstalls, but a store refuses it); another signing key | the command's output: Android's installer returns an error code like `INSTALL_FAILED_…` |
        | start | development-only code that throws in release | the device log (`adb logcat`), not the Metro terminal — a release has none |

        Repairing one stage lets you reach the next — and see the next cause. So repair one at a time and run the same command every time.

  - id: seeded-release
    kind: exercise
    mode: debug
    runtime: concept-preview
    dir: seeded-release
    entry: main.jsx
    editable: [app-config.js, user-gradle-properties.js, start.js]
    strings:
      title: { uk: "Release на імітованій цілі", en: "A release on the simulated target" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      mug: { uk: "Термочашка", en: "Travel mug" }
    title:
      uk: "Release, що не доходить до екрана"
      en: "A release that never reaches the screen"
    instructions:
      uk: |
        На цілі встановлено збірку 4 навчального застосунку, підписану ключем `rn11-lab-upload` (`target.js`). Новий release не доходить до екрана. `simulated-release.js` — **імітація** `npx expo run:android --variant release`: підпис Gradle, встановлення поверх збірки 4 і запуск з `__DEV__`, рівним `false`. Запусти й прочитай перший червоний рядок.

        Полагодь три причини в трьох файлах, по одній, щоразу запускаючи знову:

        - `user-gradle-properties.js` — це `~/.gradle/gradle.properties` **поза** репозиторієм: release має підписуватися тим самим ключем, що й збірка 4 (ключі на комп’ютері перелічено в `target.js`);
        - `app-config.js` — скопійовано з торішньої гілки: release має ставитися як оновлення збірки 4;
        - `start.js` — release має стартувати з шістьма бажаннями з `wishes.json` і не викликати `seedDemoWishes` взагалі. Перевіряй `__DEV__` усередині `startApp`: в імітації `__DEV__` з’являється, коли файли вже завантажено, і стає `false` лише на час запуску release, тож угорі файла його ще немає (`ReferenceError`). У справжній збірці `__DEV__` під час роботи не змінюється, і там спрацювало б і так.

        Паролів і шляхів до keystore у `app-config.js` та `start.js` бути не повинно: ці файли в репозиторії.
      en: |
        The target has build 4 of the lab app installed, signed with the `rn11-lab-upload` key (`target.js`). The new release never reaches the screen. `simulated-release.js` is a **simulation** of `npx expo run:android --variant release`: Gradle signing, installing over build 4, and starting with `__DEV__` set to `false`. Run it and read the first red line.

        Repair three causes in three files, one at a time, running again each time:

        - `user-gradle-properties.js` is `~/.gradle/gradle.properties` **outside** the repository: the release must be signed with the same key as build 4 (the keys on the computer are listed in `target.js`);
        - `app-config.js` was copied from last year's branch: the release must install as an update of build 4;
        - `start.js` — the release must start with the six wishes from `wishes.json` and not call `seedDemoWishes` at all. Check `__DEV__` inside `startApp`: in the simulation `__DEV__` appears only after the files are loaded and becomes `false` only for the release start, so at the top of the file it does not exist yet (`ReferenceError`). In a real build `__DEV__` never changes while the app runs, and either way would work there.

        `app-config.js` and `start.js` must hold no passwords and no keystore paths: these files are in the repository.
    testTitles:
      "the release is signed with the key of the installed build":
        uk: "Release підписано ключем встановленої збірки"
        en: "The release is signed with the key of the installed build"
      "the release installs as an update over build 4":
        uk: "Release ставиться як оновлення збірки 4"
        en: "The release installs as an update over build 4"
      "the release starts without running dev-only code":
        uk: "Release стартує без коду лише для розробки"
        en: "The release starts without running dev-only code"
      "no key path or password sits in the tracked files":
        uk: "У файлах репозиторію немає ні шляху до keystore, ні пароля"
        en: "No key path or password sits in the tracked files"
    hints:
      nudge:
        uk: "Ланцюжок зупиняється на першому збої, тож за раз видно лише одну причину. Прочитай червоний рядок: який етап — `[build]`, `[install]` чи `[launch]` — і що саме він називає?"
        en: "The chain stops at the first failure, so you see only one cause at a time. Read the red line: which stage — `[build]`, `[install]` or `[launch]` — and what exactly does it name?"
      explanation:
        uk: |
          Підпис: шлях у `MYAPP_UPLOAD_STORE_FILE` має вести до keystore, що справді є на цьому комп’ютері, — і саме до того, яким підписано встановлену збірку: інший ключ телефон відхилить. Номер: оновлення — це номер, більший за встановлений, а не за той, що був у старій гілці. Запуск: виклик, потрібний лише для розробки, має стояти за `__DEV__`, як `if (__DEV__) loadDevMenuExtras()` в іншому застосунку; приховати його помилку `try`/`catch` — не те саме, бо код усе одно виконується.
        en: |
          Signing: the path in `MYAPP_UPLOAD_STORE_FILE` must lead to a keystore that really exists on this computer — and exactly to the one that signed the installed build: the phone refuses another key. Number: an update is a number higher than the installed one, not than the one on the old branch. Start: a call needed only for development must sit behind `__DEV__`, like `if (__DEV__) loadDevMenuExtras()` in another app; hiding its error in `try`/`catch` is not the same, because the code still runs.
    solutionNote:
      uk: "Ключ — той самий `rn11-lab-upload`, лише за правильним шляхом; «новий» ключ підписав би збірку, але телефон відхилив би оновлення. `versionCode` 5 — більший за встановлений 4, а не за старий 3. А демонстраційні бажання лишилися інструментом debug: у release `startApp` повертає вбудовані бажання, не торкаючись `seedDemoWishes`. Паролі живуть лише в `~/.gradle/gradle.properties`, поза репозиторієм."
      en: "The key is the same `rn11-lab-upload`, only at the right path; a “new” key would sign the build, but the phone would refuse the update. `versionCode` 5 is higher than the installed 4, not than the old 3. And the demo wishes stayed a debug tool: in release `startApp` returns the bundled wishes without touching `seedDemoWishes`. The passwords live only in `~/.gradle/gradle.properties`, outside the repository."
    feedback:
      - when: { test: "the release is signed with the key of the installed build" }
        message:
          uk: "Ця перевірка чекає, що `MYAPP_UPLOAD_STORE_FILE` веде до keystore з `target.js`, alias збігається, паролі задано, а сертифікат той самий, що в збірки 4. Новий ключ підпише збірку, але встановити її поверх 4 не вийде."
          en: "This check expects `MYAPP_UPLOAD_STORE_FILE` to lead to a keystore from `target.js`, the alias to match, the passwords to be set, and the certificate to be the same as build 4's. A new key signs the build, but it will not install over 4."
      - when: { test: "the release installs as an update over build 4" }
        message:
          uk: "Ця перевірка чекає `android.versionCode` більший за 4 — номер встановленої збірки — і ідентифікатор `com.example.jsll.releaselab`. Номер, рівний 4, — не оновлення."
          en: "This check expects `android.versionCode` higher than 4 — the installed build's number — and the id `com.example.jsll.releaselab`. A number equal to 4 is not an update."
      - when: { test: "the release starts without running dev-only code" }
        message:
          uk: "Ця перевірка запускає `startApp` з `__DEV__`, рівним `false`, і чекає шість бажань з `wishes.json` та жодного виклику `seedDemoWishes`. Перехоплена помилка теж рахується як виклик."
          en: "This check runs `startApp` with `__DEV__` set to `false` and expects the six wishes from `wishes.json` and no call of `seedDemoWishes`. A caught error still counts as a call."
      - when: { test: "no key path or password sits in the tracked files" }
        message:
          uk: "Ця перевірка, як сканер секретів, чекає, що в `app-config.js` і `start.js` немає жодного пароля підпису (значень `MYAPP_UPLOAD_…_PASSWORD`) і шляху до файла `.keystore`. Коментар про те, де живуть паролі, не заважає. Усе для підпису живе в `user-gradle-properties.js`, тобто поза репозиторієм."
          en: "Like a secret scanner, this check expects `app-config.js` and `start.js` to hold no signing password (the `MYAPP_UPLOAD_…_PASSWORD` values) and no path to a `.keystore` file. A comment about where the passwords live is fine. Everything for signing lives in `user-gradle-properties.js`, that is, outside the repository."
      - when: { error: ReferenceError }
        message:
          uk: "Програма впала під час завантаження: вона звернулася до назви, якої ще немає. Якщо повідомлення називає `__DEV__`, читай його всередині `startApp`, а не вгорі файла; інакше перевір назву, яку воно називає."
          en: "The program crashed while loading: it used a name that does not exist yet. If the message names `__DEV__`, read it inside `startApp`, not at the top of the file; otherwise check the name it mentions."
      - when: { error: SyntaxError }
        message:
          uk: "Програма не змогла запуститися. Перевір лапки й дужки у файлах, які змінював; у `user-gradle-properties.js` текст стоїть між зворотними лапками."
          en: "The program could not start. Check the quotes and brackets in the files you changed; in `user-gradle-properties.js` the text sits between backticks."
    limits:
      uk: "Імітація в перегляді react-native-web. `simulated-release.js` не запускає Gradle, установлювач Android і пристрій: він застосовує їхні правила до об’єктів, а повідомлення — власні, не дослівні. Справжні тексти помилок ти побачиш на своїй цілі в завданні нижче."
      en: "A simulation in the react-native-web preview. `simulated-release.js` does not run Gradle, Android's installer or a device: it applies their rules to objects, and its messages are its own, not verbatim. You will see the real error texts on your target in the task below."

  - id: recall-first-error
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: first-not-last
        from: rn-07-01-native-logs-build-errors
        prompt:
          uk: "Gradle-збирання впало, і журнал на 400 рядків закінчується кількома червоними рядками `BUILD FAILED`. Де шукати причину?"
          en: "A Gradle build failed, and its 400-line log ends with a few red `BUILD FAILED` lines. Where do you look for the cause?"
        answer:
          type: choice
          options:
            - id: first-error
              text:
                uk: "Перший справжній блок помилки вище — там, де названо задачу, файл чи налаштування"
                en: "The first real error block higher up — where a task, a file or a setting is named"
            - id: last-line
              text:
                uk: "Останній червоний рядок: він підсумовує все"
                en: "The last red line: it sums everything up"
              why:
                uk: "Останні рядки лише кажуть, що збирання не вдалося. Причину названо раніше, у першому блоці помилки."
                en: "The last lines only say the build failed. The cause is named earlier, in the first error block."
            - id: metro
              text:
                uk: "Термінал Metro: там видно всі помилки"
                en: "The Metro terminal: all errors show there"
              why:
                uk: "Metro показує помилки JavaScript. Помилка збирання native-частини — у журналі Gradle."
                en: "Metro shows JavaScript errors. A native build error is in the Gradle log."
          correct: [first-error]
        explanation:
          uk: "У release-збиранні це особливо важливо: помилка підпису може потягнути за собою кілька наступних. Полагодь першу — і запусти знову."
          en: "This matters even more in a release build: a signing error can drag several more after it. Repair the first one — and run again."

  - id: on-target
    kind: local-task
    runtime: local-native
    title:
      uk: "Три збої release на твоїй заявленій цілі"
      en: "Three release failures on your declared target"
    intro:
      uk: |
        Завдання — для навчального проєкту `~/js-course/rn11-lab` з уроку про артефакти збірки: з плагіном підпису, keystore у `~/keys` і встановленою збіркою 1. Якщо проєкту чи встановленої збірки немає, спершу виконай кроки 1–8 того уроку.

        **Що перевірено під час підготовки уроку** (macOS, Node.js v25.2.1, Expo SDK 57, React Native 0.86.3): файли з кроків 3 і 7 проходять `npx tsc --noEmit` без повідомлень, а `npx expo export --platform android` збирає їх; у bundle з кроку 3 є рядок `dev/seed.ts must not run in a release build`, тобто код збою справді потрапляє в release. Звичайний `npx expo prebuild` переносить новий `versionCode` з `app.json` у `android/app/build.gradle`, а плагін підпису після нього лишається на місці. **Збирання, встановлення, журнали Gradle і пристрою не перевірено** — нативних інструментів там немає. Записуй дослівно те, що побачиш сам.

        Ціль **I** (iOS-симулятор): причини 1 і 2 стосуються Android — підпис симулятору не потрібен, а `versionCode` там немає. Виконай кроки, позначені для всіх, і причину 3; про 1 і 2 запиши, що на твоїй цілі їх не відтворити, — вправа вище їх уже закрила.

        Якщо native-інструментів немає, натисни **«У мене немає емулятора чи пристрою»**.

        **Крок 2 — `app.json`, збірка 2:** `"version": "1.1.0"`, `"versionCode": 2` в `"android"`, `"buildNumber": "2"` в `"ios"`.

        **Крок 3 — три підготовлені збої.**

        Причина 1, `app.json` («скопійовано зі старої гілки»): `"versionCode": 1`.

        Причина 2, `~/.gradle/gradle.properties`: спершу збережи копію (команда кроку 3), потім заміни шлях у рядку `MYAPP_UPLOAD_STORE_FILE` на неіснуючий:

        ```text
        MYAPP_UPLOAD_STORE_FILE=/Users/твоє-ім’я/old-laptop/rn11-lab-upload.keystore
        ```

        Причина 3, новий файл `dev/seed.ts`:

        ```ts
        // Development helper: adds 50 demo wishes for testing long lists. Must never run in a release build.
        type Wish = { id: string; name: string; price: number | null; acquired: boolean };

        export function seedDemoWishes(wishes: Wish[]): Wish[] {
          if (!__DEV__) throw new Error('dev/seed.ts must not run in a release build');
          const demo = Array.from({ length: 50 }, (_, i) => ({ id: `demo-${i + 1}`, name: `Demo ${i + 1}`, price: 10, acquired: false }));
          return [...wishes, ...demo];
        }
        ```

        і в `App.tsx` — імпорт після `import wishes from './wishes.json';`:

        ```tsx
        import { seedDemoWishes } from './dev/seed';
        ```

        рядок одразу після рядка з `if (__DEV__) console.log(…)`:

        ```tsx
          const shown = seedDemoWishes(wishes); // seeded defect: runs in every build
        ```

        і `wishes.map(` у розмітці заміни на `shown.map(`.

        **Крок 7 — ремонт причини 3** у `App.tsx`:

        ```tsx
          const shown = __DEV__ ? seedDemoWishes(wishes) : wishes;
        ```

        **Крок 9 — `DEBUG-NOTES.md`** у корені проєкту (зразок; заповни тим, що побачив):

        ```text
        # Release failures on <your target>
        1. Signing — seen in: Gradle log, "What went wrong": <first lines>
           Fix: MYAPP_UPLOAD_STORE_FILE points at ~/keys again (outside the repository)
        2. Version — seen in: install output: <message>
           Fix: versionCode 3 (installed: 2)
        3. Dev-only code — seen in: device log: <line>
           Fix: seedDemoWishes only under __DEV__; release installed as versionCode 4
        ```
      en: |
        The task is for the lab project `~/js-course/rn11-lab` from the build-artifacts lesson: with the signing plugin, the keystore in `~/keys` and build 1 installed. If the project or the installed build is missing, do steps 1–8 of that lesson first.

        **What was checked while preparing this lesson** (macOS, Node.js v25.2.1, Expo SDK 57, React Native 0.86.3): the files from steps 3 and 7 pass `npx tsc --noEmit` without messages, and `npx expo export --platform android` bundles them; the bundle from step 3 contains the string `dev/seed.ts must not run in a release build`, so the failing code really gets into the release. A plain `npx expo prebuild` carries the new `versionCode` from `app.json` into `android/app/build.gradle`, and the signing plugin stays in place afterwards. **Building, installing, and the Gradle and device logs were not checked** — there are no native tools there. Write down verbatim what you see yourself.

        Target **I** (iOS simulator): causes 1 and 2 are about Android — the simulator needs no signing, and it has no `versionCode`. Do the steps marked for everyone and cause 3; for 1 and 2 write down that your target cannot reproduce them — the exercise above has covered them.

        If you have no native tooling, press **“I have no emulator or device”**.

        **Step 2 — `app.json`, build 2:** `"version": "1.1.0"`, `"versionCode": 2` in `"android"`, `"buildNumber": "2"` in `"ios"`.

        **Step 3 — three seeded failures.**

        Cause 1, `app.json` (“copied from an old branch”): `"versionCode": 1`.

        Cause 2, `~/.gradle/gradle.properties`: first save a copy (the step 3 command), then replace the path in the `MYAPP_UPLOAD_STORE_FILE` line with one that does not exist:

        ```text
        MYAPP_UPLOAD_STORE_FILE=/Users/your-name/old-laptop/rn11-lab-upload.keystore
        ```

        Cause 3, a new file `dev/seed.ts`:

        ```ts
        // Development helper: adds 50 demo wishes for testing long lists. Must never run in a release build.
        type Wish = { id: string; name: string; price: number | null; acquired: boolean };

        export function seedDemoWishes(wishes: Wish[]): Wish[] {
          if (!__DEV__) throw new Error('dev/seed.ts must not run in a release build');
          const demo = Array.from({ length: 50 }, (_, i) => ({ id: `demo-${i + 1}`, name: `Demo ${i + 1}`, price: 10, acquired: false }));
          return [...wishes, ...demo];
        }
        ```

        and in `App.tsx` — the import after `import wishes from './wishes.json';`:

        ```tsx
        import { seedDemoWishes } from './dev/seed';
        ```

        a line right after the line with `if (__DEV__) console.log(…)`:

        ```tsx
          const shown = seedDemoWishes(wishes); // seeded defect: runs in every build
        ```

        and replace `wishes.map(` in the markup with `shown.map(`.

        **Step 7 — repairing cause 3** in `App.tsx`:

        ```tsx
          const shown = __DEV__ ? seedDemoWishes(wishes) : wishes;
        ```

        **Step 9 — `DEBUG-NOTES.md`** in the project root (a sample; fill in what you saw):

        ```text
        # Release failures on <your target>
        1. Signing — seen in: Gradle log, "What went wrong": <first lines>
           Fix: MYAPP_UPLOAD_STORE_FILE points at ~/keys again (outside the repository)
        2. Version — seen in: install output: <message>
           Fix: versionCode 3 (installed: 2)
        3. Dev-only code — seen in: device log: <line>
           Fix: seedDemoWishes only under __DEV__; release installed as versionCode 4
        ```
    tools:
      - { name: "rn11-lab", version: { uk: "з уроку про артефакти збірки", en: "from the build-artifacts lesson" }, note: { uk: "з плагіном підпису й keystore у `~/keys`", en: "with the signing plugin and the keystore in `~/keys`" } }
      - { name: "Expo SDK", version: "57 (React Native 0.86)" }
      - { name: "Declared target", version: "from RN-01", note: { uk: "емулятор Android чи Android-телефон (усі три причини) або iOS-симулятор (причина 3)", en: "an Android emulator or Android phone (all three causes) or the iOS simulator (cause 3)" } }
    steps:
      - text:
          uk: "Перейди в проєкт і переконайся, що робоче дерево чисте, а останній commit — підпис release з уроку про артефакти."
          en: "Go into the project and make sure the working tree is clean and the last commit is the release signing from the build-artifacts lesson."
        command: "cd ~/js-course/rn11-lab\ngit status --short\ngit log --oneline -3"
        expect:
          uk: "`git status --short` нічого не друкує; серед останніх комітів — «Record release evidence for build 1» чи «Sign release builds with the upload key»."
          en: "`git status --short` prints nothing; the last commits include “Record release evidence for build 1” or “Sign release builds with the upload key”."
      - text:
          uk: "**A.** Спершу правильне оновлення: зміни `app.json` на збірку 2 (крок 2 вступу), перенеси номери в native-файли й встав release поверх збірки 1. Закоміть. Не перевірено під час підготовки уроку."
          en: "**A.** First a correct update: change `app.json` to build 2 (step 2 of the intro), carry the numbers into the native files and install the release over build 1. Commit. Not checked while preparing this lesson."
        command: "npx expo prebuild --platform android\nnpx expo run:android --variant release\ngit add -A\ngit commit -m \"Release build 2\""
        expect:
          uk: "Release ставиться без видалення збірки 1 — той самий ключ, більший номер — і показує «Збірка: release». `adb shell dumpsys package com.example.jsll.releaselab | grep versionCode` показує `versionCode=2`."
          en: "The release installs without removing build 1 — the same key, a higher number — and shows “Build: release”. `adb shell dumpsys package com.example.jsll.releaselab | grep versionCode` shows `versionCode=2`."
      - text:
          uk: "Підготуй три збої з кроку 3 вступу (на цілі I — лише причину 3). Перша команда зберігає копію твого `gradle.properties`. Потім перевір типи й теку для журналів поза проєктом."
          en: "Seed the three failures from step 3 of the intro (on target I, only cause 3). The first command saves a copy of your `gradle.properties`. Then check the types and make a folder for logs outside the project."
        command: "cp ~/.gradle/gradle.properties ~/.gradle/gradle.properties.backup\nnpx tsc --noEmit\nmkdir -p ~/js-course/rn11-logs"
        expect:
          uk: "`tsc` завершується без повідомлень — помилки цього уроку типи не ловлять."
          en: "`tsc` finishes without messages — types do not catch this lesson's failures."
      - text:
          uk: "**A.** Збери release і збережи журнал. Знайди перший блок помилки й запиши його в нотатки. Не перевірено під час підготовки уроку."
          en: "**A.** Build the release and save the log. Find the first error block and write it into your notes. Not checked while preparing this lesson."
        command: "npx expo prebuild --platform android\nnpx expo run:android --variant release 2>&1 | tee ~/js-course/rn11-logs/release-1.log\ngrep -n -A4 \"What went wrong\" ~/js-course/rn11-logs/release-1.log"
        expect:
          uk: "Збирання зупиняється на підписі: перший блок помилки називає файл `…/old-laptop/rn11-lab-upload.keystore` і конфігурацію підпису `release`. Точного тексту ми не бачили."
          en: "The build stops at signing: the first error block names the file `…/old-laptop/rn11-lab-upload.keystore` and the `release` signing config. We have not seen the exact text."
      - text:
          uk: "**A.** Полагодь причину 2, повернувши збережену копію, і збери знову. Тепер має дійти до встановлення. Не перевірено під час підготовки уроку."
          en: "**A.** Repair cause 2 by restoring the saved copy, and build again. Now it should get as far as installing. Not checked while preparing this lesson."
        command: "cp ~/.gradle/gradle.properties.backup ~/.gradle/gradle.properties\nnpx expo run:android --variant release 2>&1 | tee ~/js-course/rn11-logs/release-2.log\ngrep -n \"INSTALL_FAILED\" ~/js-course/rn11-logs/release-2.log"
        expect:
          uk: "Збирання вдається. Чи вдасться встановлення, залежить від цілі: Expo CLI ставить APK командою `adb install -r -d` (ми прочитали це в її коді, `@expo/cli`, файл `adb.js`), а `-d` просить дозволити downgrade. На телефоні та на образі емулятора з Google Play він для release, найімовірніше, не спрацює, і у виводі буде код на кшталт `INSTALL_FAILED_VERSION_DOWNGRADE` (назва коду помилки встановлювача Android; на пристрої ми його не бачили). На налагоджуваному образі емулятора (наприклад, «Google APIs» без Play) downgrade може пройти. Запиши, що сталося саме в тебе: магазин `versionCode` 1 після 2 не прийняв би в будь-якому разі. Якщо `grep` нічого не знайшов, прочитай кінець `release-2.log`."
          en: "The build succeeds. Whether the installation succeeds depends on the target: Expo CLI installs the APK with `adb install -r -d` (we read this in its code, `@expo/cli`, the file `adb.js`), and `-d` asks to allow a downgrade. On a phone and on an emulator image with Google Play it most likely does not work for a release, and the output has a code like `INSTALL_FAILED_VERSION_DOWNGRADE` (the name of an Android installer error code; we have not seen it on a device). On a debuggable emulator image (for example “Google APIs” without Play) the downgrade may go through. Write down what happened for you: a store would refuse `versionCode` 1 after 2 either way. If `grep` finds nothing, read the end of `release-2.log`."
      - text:
          uk: "**A.** Полагодь причину 1: `\"versionCode\": 3` (і `\"version\": \"1.2.0\"`, `\"buildNumber\": \"3\"`) в `app.json`. Перенеси, збери й встав. Застосунок закриється одразу після старту — прочитай журнал пристрою. Не перевірено під час підготовки уроку."
          en: "**A.** Repair cause 1: `\"versionCode\": 3` (and `\"version\": \"1.2.0\"`, `\"buildNumber\": \"3\"`) in `app.json`. Carry it over, build and install. The app closes right after starting — read the device log. Not checked while preparing this lesson."
        command: "npx expo prebuild --platform android\nnpx expo run:android --variant release\nadb logcat -d | grep -n \"must not run in a release build\""
        expect:
          uk: "Збірка 3 встановилася як оновлення, але застосунок закрився чи показав порожній екран. У журналі пристрою є рядок з `dev/seed.ts must not run in a release build`. Термінал Metro тут нічого не покаже: release з ним не з’єднується."
          en: "Build 3 installed as an update, but the app closed or showed an empty screen. The device log has a line with `dev/seed.ts must not run in a release build`. The Metro terminal shows nothing here: a release does not connect to it."
      - text:
          uk: "Полагодь причину 3 рядком з кроку 7 вступу. Збірка 3 вже стоїть на цілі, тож виправлення отримує **наступний** номер: `\"versionCode\": 4`, `\"version\": \"1.2.1\"`, `\"buildNumber\": \"4\"`. Збери й встав. На цілі I: `npx expo run:ios --configuration Release` замість двох Android-команд. Не перевірено під час підготовки уроку."
          en: "Repair cause 3 with the line from step 7 of the intro. Build 3 is already on the target, so the fix gets the **next** number: `\"versionCode\": 4`, `\"version\": \"1.2.1\"`, `\"buildNumber\": \"4\"`. Build and install. On target I: `npx expo run:ios --configuration Release` instead of the two Android commands. Not checked while preparing this lesson."
        command: "npx tsc --noEmit\nnpx expo prebuild --platform android\nnpx expo run:android --variant release"
        expect:
          uk: "Застосунок відкривається з «Збірка: release», шістьма бажаннями й «Бажане разом: 365» — без 50 демонстраційних. Він встановився поверх збірки 3 як оновлення."
          en: "The app opens with “Build: release”, six wishes and “Wanted total: 365” — without the 50 demo ones. It installed over build 3 as an update."
      - text:
          uk: "Переконайся, що в репозиторії немає ні ключа, ні пароля, і що змінено лише очікувані файли."
          en: "Make sure the repository has neither the key nor a password, and that only the expected files changed."
        command: "git status --short\ngit diff --stat\ngit grep -n -i \"password\" -- . \":!node_modules\""
        expect:
          uk: "Змінено `app.json` і `App.tsx`, новий — `dev/seed.ts`. `git grep` нічого не знаходить: паролі лежать лише в `~/.gradle/gradle.properties`."
          en: "`app.json` and `App.tsx` are changed, `dev/seed.ts` is new. `git grep` finds nothing: the passwords live only in `~/.gradle/gradle.properties`."
      - text:
          uk: "Запиши `DEBUG-NOTES.md` за зразком кроку 9 вступу — дослівні рядки з журналів, де ти їх побачив, і ремонт — та закоміть усе разом."
          en: "Write `DEBUG-NOTES.md` following the step 9 sample of the intro — the verbatim lines from the logs, where you saw them, and the repair — and commit everything together."
        command: "git add -A\ngit commit -m \"Repair release signing, version and dev-only seeding\""
    verify:
      - id: three-traces
        text:
          uk: "Я записав(-ла), де саме з’явилася кожна причина (журнал Gradle, вивід встановлення, журнал пристрою) — або що на моїй цілі причини 1 і 2 не відтворити."
          en: "I wrote down where exactly each cause appeared (the Gradle log, the install output, the device log) — or that causes 1 and 2 cannot be reproduced on my target."
      - id: update-installed
        text:
          uk: "Виправлений release встановився як оновлення поверх попередньої збірки й показує «Збірка: release» та шість бажань."
          en: "The repaired release installed as an update over the previous build and shows “Build: release” and six wishes."
      - id: no-secrets
        text:
          uk: "`git grep` не знайшов пароля, а keystore лишився в `~/keys`, поза репозиторієм."
          en: "`git grep` found no password, and the keystore stayed in `~/keys`, outside the repository."
    troubleshooting:
      - problem:
          uk: "Після зміни `app.json` у `build.gradle` досі старий `versionCode`"
          en: "After changing `app.json`, `build.gradle` still has the old `versionCode`"
        fix:
          uk: "`npx expo run:android` не запускає `prebuild`, коли тека `android/` уже є. Виконай `npx expo prebuild --platform android` і перевір `grep -n versionCode android/app/build.gradle` (так ми й перевіряли перенесення номера)."
          en: "`npx expo run:android` does not run `prebuild` when the `android/` folder already exists. Run `npx expo prebuild --platform android` and check `grep -n versionCode android/app/build.gradle` (that is how we checked that the number carries over)."
      - problem:
          uk: "`INSTALL_FAILED_UPDATE_INCOMPATIBLE` чи інша відмова через підпис"
          en: "`INSTALL_FAILED_UPDATE_INCOMPATIBLE` or another refusal because of the signature"
        fix:
          uk: "Release підписано не тим ключем, що попередню збірку: перевір шлях і alias у `~/.gradle/gradle.properties` і порівняй `keytool -list` з відбитком у `release-evidence.md`. Видалити застосунок і поставити заново можна лише для навчальної збірки — її дані зникнуть."
          en: "The release is signed with a different key than the previous build: check the path and the alias in `~/.gradle/gradle.properties` and compare `keytool -list` with the fingerprint in `release-evidence.md`. Uninstalling and reinstalling is fine only for the lab build — its data goes away."
      - problem:
          uk: "`adb logcat -d | grep` нічого не знаходить, хоча застосунок закривається"
          en: "`adb logcat -d | grep` finds nothing although the app closes"
        fix:
          uk: "Журнал пристрою обмежений за розміром і міг перезаписатися. Очисти його (`adb logcat -c`), відкрий застосунок ще раз і одразу повтори команду. Перевір, що підключено саме твою ціль: `adb devices`."
          en: "The device log is limited in size and may have been overwritten. Clear it (`adb logcat -c`), open the app once more and repeat the command right away. Check that exactly your target is connected: `adb devices`."
    recovery:
      uk: "Кожен крок закінчується комітом чи може бути скасований: `git restore app.json App.tsx` повертає файли до останнього коміту, `cp ~/.gradle/gradle.properties.backup ~/.gradle/gradle.properties` — твої налаштування підпису. Keystore у `~/keys` у цьому уроці не змінюється. Якщо на цілі заплуталися збірки, `adb uninstall com.example.jsll.releaselab` прибирає навчальний застосунок разом з його даними."
      en: "Every step ends with a commit or can be undone: `git restore app.json App.tsx` returns the files to the last commit, `cp ~/.gradle/gradle.properties.backup ~/.gradle/gradle.properties` restores your signing settings. The keystore in `~/keys` does not change in this lesson. If the builds on the target get tangled, `adb uninstall com.example.jsll.releaselab` removes the lab app together with its data."

  - id: to-project
    kind: transfer
    capstoneStep: RN-11
    body:
      uk: "Коли release твого проєкту не дійде до екрана, іди тим самим порядком: журнал Gradle, вивід встановлення, журнал пристрою — по одній причині. І кожне виправлення, що вже встановлювалося на ціль, отримує наступний номер збірки."
      en: "When your project's release does not reach the screen, go in the same order: the Gradle log, the install output, the device log — one cause at a time. And every fix after something was already installed on the target gets the next build number."
