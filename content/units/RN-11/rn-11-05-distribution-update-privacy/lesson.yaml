id: rn-11-05-distribution-update-privacy
unit: RN-11
title:
  uk: "Розповсюдження, оновлення й основи приватності"
  en: "Distribution, updates and privacy basics"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Описати шляхи розповсюдження (перевірка магазином, тестові канали, поступовий випуск, встановлення в обхід магазину, over-the-air оновлення JavaScript) і що кожен може й чого не може змінити."
    en: "Describe the distribution paths (store review, test tracks, staged rollout, sideloading, over-the-air JS updates) and what each can and cannot change."
  - uk: "Заповнити декларацію приватності (які дані, навіщо, з ким) для синтетичного застосунку за його діаграмою потоків даних, а платформу, яку твій комп’ютер не збирає, розібрати за наданими артефактами."
    en: "Fill a privacy declaration (data collected, purpose, sharing) for a synthetic app from its data-flow diagram, using supplied artifacts for the platform your workstation cannot build."
prerequisites: [rn-11-04-build-artifacts, rn-09-03-privacy-minimum-data]
subskills:
  - { family: N-11, skill: "distribution/store/update/privacy basics", depth: intro }
glossary: [staged-rollout, ota-update, privacy-label, sideloading]
selfCheck: [predict-ota, lab-privacy]

blocks:
  - id: five-paths
    kind: explanation
    title:
      uk: "П’ять шляхів до людей"
      en: "Five paths to people"
    body:
      uk: |
        Збірку, яку ти поставив на емулятор у попередньому уроці, людям можна доставити п’ятьма шляхами:

        | Шлях | Що це | Що може змінити |
        |---|---|---|
        | Магазин з перевіркою | Google Play чи App Store перевіряють кожну нову збірку | усе — це новий пакет |
        | Тестовий канал | внутрішнє тестування в Play Console, TestFlight в Apple | усе, але лише для запрошених людей |
        | [[staged-rollout\|Поступовий випуск]] | магазин дає оновлення спершу частині людей | усе; частку можна зупинити, але не забрати збірку в тих, хто вже оновився |
        | [[sideloading\|В обхід магазину]] | APK-файл чи `adb install` на Android; на чужий iPhone без магазину — лише з обліковим записом Apple | усе — але оновлення теж ставиш сам, з тим самим підписом |
        | [[ota-update\|Over-the-air оновлення]] | `expo-updates` замінює JavaScript і ресурси встановленого застосунку | **лише** JavaScript і ресурси |

        Останній рядок — найчастіша пастка. [Документація Expo про runtime versions](https://docs.expo.dev/eas-update/runtime-versions/) пояснює: у збірці є native-шар, вбудований у бінарний файл, і шар оновлень, який можна замінити. Новий native-код, нові дозволи, нова іконка — це native-шар, тож потрібна нова збірка через магазин. Оновлення ще й мусить збігатися з native-частиною збірки (`runtimeVersion`): інакше воно викличе код, якого в збірці немає.
      en: |
        The build you installed on the emulator in the previous lesson can reach people along five paths:

        | Path | What it is | What it can change |
        |---|---|---|
        | A store with review | Google Play or the App Store review every new build | everything — it is a new package |
        | A test track | internal testing in Play Console, TestFlight at Apple | everything, but only for invited people |
        | [[staged-rollout\|Staged rollout]] | the store gives the update to a share of people first | everything; the share can be halted, but the build is not taken back from those who already updated |
        | [[sideloading\|Sideloading]] | an APK file or `adb install` on Android; onto someone's iPhone without a store, only with an Apple account | everything — but you install the updates yourself too, with the same signature |
        | [[ota-update\|Over-the-air update]] | `expo-updates` replaces the JavaScript and assets of the installed app | **only** JavaScript and assets |

        The last row is the most common trap. [The Expo docs on runtime versions](https://docs.expo.dev/eas-update/runtime-versions/) explain: a build has a native layer built into the binary and an update layer that can be swapped. New native code, new permissions, a new icon belong to the native layer, so they need a new build through the store. An update must also match the build's native part (`runtimeVersion`): otherwise it calls code that does not exist in the build.

  - id: predict-ota
    kind: prediction
    prompt:
      uk: "Планувальник уже в магазині й підтримує over-the-air оновлення. Які з цих змін можна доставити людям оновленням, **без** нової збірки? Обери всі."
      en: "The planner is already in the store and supports over-the-air updates. Which of these changes can reach people as an update, **without** a new build? Choose all that apply."
    runnable: false
    answer:
      type: multi
      options:
        - id: copy
          text:
            uk: "Виправити друкарську помилку в тексті кнопки"
            en: "Fix a typo in a button's text"
        - id: screen
          text:
            uk: "Новий екран статистики, зібраний лише з компонентів React Native, що вже є в збірці"
            en: "A new statistics screen built only from React Native components already in the build"
        - id: module
          text:
            uk: "Нова бібліотека з native-модулем для календаря"
            en: "A new library with a native module for the calendar"
          why:
            uk: "Native-модуль компілюється в бінарний файл. Оновлення JavaScript, що його викликає, у старій збірці наткнеться на код, якого немає."
            en: "A native module is compiled into the binary. A JavaScript update that calls it would hit code that does not exist in the old build."
        - id: permission
          text:
            uk: "Дозвіл на камеру для фото чеків"
            en: "A camera permission for receipt photos"
          why:
            uk: "Дозвіл на камеру записано в маніфесті Android (`android.permission.CAMERA`) і в `Info.plist` (`NSCameraUsageDescription`) — це native-шар. Їх змінює лише нова збірка."
            en: "The camera permission is written in the Android manifest (`android.permission.CAMERA`) and in `Info.plist` (`NSCameraUsageDescription`) — the native layer. Only a new build changes them."
        - id: icon
          text:
            uk: "Нова іконка застосунку"
            en: "A new app icon"
          why:
            uk: "Іконку `prebuild` кладе в native-ресурси пакета, і показує її система ще до запуску JavaScript. Потрібна нова збірка."
            en: "`prebuild` puts the icon into the package's native resources, and the system shows it before any JavaScript runs. A new build is needed."
      correct: [copy, screen]
    explanation:
      uk: "Over-the-air оновлення замінює лише шар JavaScript і ресурсів. Текст і новий екран із наявних компонентів — це JavaScript. Native-модуль, дозвіл та іконка живуть у бінарному файлі, тож їм потрібна нова збірка — і перевірка магазином."
      en: "An over-the-air update replaces only the JavaScript-and-assets layer. A text and a new screen from existing components are JavaScript. A native module, a permission and an icon live in the binary, so they need a new build — and store review."

  - id: other-platform
    kind: explanation
    title:
      uk: "Платформа, якої ти не збираєш"
      en: "The platform you do not build"
    body:
      uk: |
        Твій комп’ютер збирає одну платформу. Друга — iOS без Mac чи Android без Android SDK — однаково отримає ті самі ідентифікатори й версії з `app.json`. Розібрати її можна без збирання, за наданими артефактами — файлами, що згенерував `npx expo prebuild`.

        Найпомітніша різниця — дозволи. На Android це рядки `<uses-permission>` у маніфесті. На iOS списку дозволів немає: більшість захищених ресурсів (камера, мікрофон, геолокація, фото) потребує ключа `NS…UsageDescription` в `Info.plist` з поясненням для людини. Без нього iOS не покаже запиту, а [завершить застосунок](https://developer.apple.com/documentation/uikit/requesting-access-to-protected-resources), щойно той звернеться до ресурсу.
      en: |
        Your computer builds one platform. The other — iOS without a Mac, or Android without the Android SDK — gets the same ids and versions from `app.json` anyway. You can examine it without building, from supplied artifacts — the files `npx expo prebuild` generated.

        The most visible difference is permissions. On Android they are `<uses-permission>` lines in the manifest. iOS has no permission list: most protected resources (camera, microphone, location, photos) need an `NS…UsageDescription` key in `Info.plist` with an explanation for a person. Without it iOS shows no request but [terminates the app](https://developer.apple.com/documentation/uikit/requesting-access-to-protected-resources) as soon as it accesses the resource.

  - id: artifact-viewer
    kind: example
    runtime: concept-preview
    dir: artifact-viewer
    entry: main.jsx
    strings:
      title: { uk: "Твоя збірка й надана", en: "Your build and the supplied one" }
      idLabel: { uk: "Ідентифікатор", en: "Id" }
      versionLabel: { uk: "Версія для людей", en: "Version for people" }
      buildLabel: { uk: "Номер збірки", en: "Build number" }
      permissionsLabel: { uk: "Дозволи", en: "Permissions" }
      same: { uk: "однаково", en: "same" }
      different: { uk: "різниться", en: "different" }
      none: { uk: "жодного ключа NS…UsageDescription", en: "no NS…UsageDescription key" }
    title:
      uk: "Надані артефакти іншої платформи"
      en: "Supplied artifacts of the other platform"
    body:
      uk: |
        `supplied-artifacts.js` — справжні уривки файлів, які `npx expo prebuild` згенерував для навчального застосунку з попереднього уроку (Expo SDK 57). `my-build.js` — твоя Android-збірка, як ти прочитав її з артефакту. `simulated-reader.js` — **імітація** інструментів читання артефактів (`dumpsys`, `plutil -p`): він лише витягує кілька полів регулярними виразами. Натисни **Запустити**.
      en: |
        `supplied-artifacts.js` holds real excerpts of the files `npx expo prebuild` generated for the lab app of the previous lesson (Expo SDK 57). `my-build.js` is your Android build, as you read it back from the artifact. `simulated-reader.js` is a **simulation** of the artifact-reading tools (`dumpsys`, `plutil -p`): it only pulls a few fields out with regular expressions. Press **Run**.
    tryIt:
      uk: |
        Ідентифікатор, версія й номер збірки однакові: обидві платформи взяли їх з одного `app.json`. У `my-build.js`:

        1. Зміни `build` на `'2'` — рядок «Номер збірки» тепер «різниться». Це нормально: номери збірок рахуються окремо на кожній платформі. Поверни `'1'`.
        2. Додай у `permissions` рядок `'android.permission.CAMERA'`. В iOS-колонці — жодного `NS…UsageDescription`: щоб iOS-збірка теж могла попросити камеру, їй потрібен ключ `NSCameraUsageDescription`.
        3. Зміни `platform` на `'ios'` (а `permissions` — на `[]`) — тепер переглядач показує Android-артефакт як «чужий».
      en: |
        The id, the version and the build number are the same: both platforms took them from one `app.json`. In `my-build.js`:

        1. Change `build` to `'2'` — the “Build number” row now says “different”. That is fine: build numbers are counted separately on each platform. Put `'1'` back.
        2. Add the line `'android.permission.CAMERA'` to `permissions`. The iOS column has no `NS…UsageDescription`: for the iOS build to ask for the camera too, it needs an `NSCameraUsageDescription` key.
        3. Change `platform` to `'ios'` (and `permissions` to `[]`) — now the viewer shows the Android artifact as the “other” one.
    limits:
      uk: "Концептуальний перегляд через react-native-web. Артефакти — текстові уривки згенерованих файлів, а не зібрані APK чи `.app`: у справжньому APK маніфест ще й об’єднується з маніфестами бібліотек, тож дозволів там може бути більше. `simulated-reader.js` не замінює `dumpsys` чи `plutil`; збирання, підпису й пристрою тут немає."
      en: "A concept preview through react-native-web. The artifacts are text excerpts of generated files, not a built APK or `.app`: in a real APK the manifest is also merged with the libraries' manifests, so there may be more permissions. `simulated-reader.js` does not replace `dumpsys` or `plutil`; there is no building, signing or device here."

  - id: privacy-label-rules
    kind: explanation
    title:
      uk: "Декларація приватності описує код"
      en: "A privacy declaration describes the code"
    body:
      uk: |
        Обидва магазини просять [[privacy-label|декларацію приватності]]: [App Privacy](https://developer.apple.com/app-store/app-privacy-details/) в App Store Connect і [Data safety](https://support.google.com/googleplay/android-developer/answer/10787469) в Play Console. Правила в них близькі:

        - **«Збирати»** — це передавати дані за межі пристрою (Apple уточнює: так, що їх зберігають довше, ніж потрібно на сам запит). Apple: дані, що обробляються лише на пристрої, не «збираються» й не декларуються. Google так само не вимагає декларувати обробку лише на пристрої.
        - **Сторонні бібліотеки — твоя відповідальність.** Якщо бібліотека звітів про збої надсилає модель пристрою, це збирає твій застосунок.
        - **Для кожного типу даних — мета** зі списку магазину: функціональність застосунку, аналітика, персоналізація, реклама.

        Тож декларація — не паперова формальність, а опис того, що робить код. Найпростіше заповнювати її з діаграми потоків даних з RN-09: кожна стрілка, що веде з телефона, — рядок «збирається».
      en: |
        Both stores ask for a [[privacy-label|privacy declaration]]: [App Privacy](https://developer.apple.com/app-store/app-privacy-details/) in App Store Connect and [Data safety](https://support.google.com/googleplay/android-developer/answer/10787469) in Play Console. Their rules are close:

        - **“Collect”** means sending data off the device (Apple adds: so that it is kept longer than the request itself needs). Apple: data processed only on the device is not “collected” and is not declared. Google likewise does not require declaring on-device-only processing.
        - **Third-party libraries are your responsibility.** If a crash-report library sends the device model, your app collects it.
        - **Each data type has a purpose** from the store's list: app functionality, analytics, personalisation, advertising.

        So a declaration is not paperwork but a description of what the code does. It is easiest to fill from the data-flow diagram of RN-09: every arrow leading off the phone is a “collected” line.

  - id: recall-minimum-data
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: just-in-case
        from: rn-09-03-privacy-minimum-data
        prompt:
          uk: "Функція «нотатка з фото» надсилає на сервер текст, фото й координати, де зроблено фото, — «раптом знадобляться для мапи згодом». Мапи в застосунку немає. Що робити з координатами?"
          en: "The “note with photo” feature sends the text, the photo and the coordinates where the photo was taken to the server — “in case we need them for a map later”. The app has no map. What should happen to the coordinates?"
        answer:
          type: choice
          options:
            - id: strip
              text:
                uk: "Прибрати їх ще на пристрої: функції вони не потрібні"
                en: "Strip them on the device: the feature does not need them"
            - id: keep
              text:
                uk: "Лишити: зайві дані нікому не шкодять, а мапа може з’явитися"
                en: "Keep them: extra data harms nobody, and a map may appear"
              why:
                uk: "Кожна зайва копія — ризик: витік, журнал, резервна копія. Дані збирають тоді, коли з’являється функція, якій вони потрібні."
                en: "Every extra copy is a risk: a leak, a log, a backup. Data is collected when a feature that needs it appears."
            - id: encrypt
              text:
                uk: "Лишити, але шифрувати на сервері"
                en: "Keep them, but encrypt them on the server"
              why:
                uk: "Шифрування не робить непотрібні дані потрібними. Найкращий захист даних, яких функція не використовує, — не мати їх."
                en: "Encryption does not make unneeded data needed. The best protection for data a feature does not use is not to have it."
          correct: [strip]
        explanation:
          uk: "Мінімум даних — те, що потрібне функції зараз. Прибрані на пристрої координати не з’являться й у декларації приватності: вони не залишають телефона."
          en: "Minimum data is what the feature needs now. Coordinates stripped on the device do not appear in the privacy declaration either: they never leave the phone."

  - id: lab-privacy
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: lab-privacy
    entry: main.jsx
    editable: [declaration.js]
    strings:
      collected: { uk: "Збирається", en: "Collected" }
      notCollected: { uk: "Не збирається", en: "Not collected" }
    title:
      uk: "Декларація приватності для лабораторії з RN-09"
      en: "A privacy declaration for the RN-09 lab"
    instructions:
      uk: |
        `data-flow.js` — діаграма потоків даних функції «Бекап» трекера витрат з лабораторії розділу RN-09 (витрата з фото чека) після того, як з неї прибрали зайве, плюс бібліотека звітів про збої, яку додав release. Діаграму записано таблицею: для кожного поля там сказано, куди воно йде (`destination`) і навіщо (`purpose`).

        У `declaration.js` напиши декларацію: **один рядок на кожне поле** таблиці, з полями:

        - `collected` — `true`, якщо дані залишають телефон, хоч би хто їх надсилав;
        - `where` — `'sent'` (залишають телефон), `'device'` (лишаються на ньому) чи `'none'` (прибрано ще під час створення);
        - `purpose` — для того, що збирається, мета з таблиці (одна з `PURPOSES`), для решти — `null`.

        У стартовому файлі вже є один рядок — перевір і його.
      en: |
        `data-flow.js` is the data-flow diagram of the expense tracker's Backup feature from the unit RN-09 lab (an expense with a receipt photo) after the extra data was removed from it, plus the crash-reporting library the release added. It is written as a table: for each field it says where it goes (`destination`) and why (`purpose`).

        In `declaration.js` write the declaration: **one line per field** of the table, with the fields:

        - `collected` — `true` if the data leaves the phone, whoever sends it;
        - `where` — `'sent'` (leaves the phone), `'device'` (stays on it) or `'none'` (removed already at creation);
        - `purpose` — for what is collected, the purpose from the table (one of `PURPOSES`); for the rest, `null`.

        The starter file already has one line — check that one too.
    testTitles:
      "every field of the data flow has exactly one line":
        uk: "Кожне поле діаграми має рівно один рядок"
        en: "Every field of the data flow has exactly one line"
      "data that leaves the phone is declared collected and sent":
        uk: "Дані, що залишають телефон, позначено як «збирається» і `'sent'`"
        en: "Data that leaves the phone is declared collected and `'sent'`"
      "data that stays on the phone or is removed is not declared collected":
        uk: "Дані, що лишаються на телефоні чи прибрані, не позначено як «збирається»"
        en: "Data that stays on the phone or is removed is not declared collected"
      "each collected field carries the purpose from the data flow":
        uk: "Кожне зібране поле має мету з діаграми"
        en: "Each collected field carries the purpose from the data flow"
    hints:
      nudge:
        uk: "Пройди по `destination` кожного рядка й спитай: ці дані залишають телефон? Хто саме їх надсилає — неважливо."
        en: "Go through the `destination` of each row and ask: does this data leave the phone? Who exactly sends it does not matter."
      explanation:
        uk: "Для магазину «зібрано» — усе, що пішло з пристрою, і через твій сервіс, і через сторонню бібліотеку. Наприклад, якби бібліотека аналітики надсилала назви відкритих екранів, це був би рядок `collected: true` з метою `'analytics'`, хоча твій код нічого не надсилав. А налаштування, яке живе лише в сховищі на пристрої, — `collected: false`."
        en: "For a store, “collected” is everything that left the device, through your own service or through a third-party library. For example, if an analytics library sent the names of opened screens, that would be a `collected: true` line with the purpose `'analytics'`, even though your code sent nothing. A setting that lives only in on-device storage is `collected: false`."
    solutionNote:
      uk: "Збирається три поля: запис витрати й фото чека йдуть у mock-сервіс, а звіт про збій надсилає бібліотека — і це теж збір твого застосунку. Тема лишається на телефоні, а координати прибрано ще під час створення, тож вони не потрапляють ні в декларацію, ні кудись іще. Якщо колись додаси функцію, що надсилає більше, декларацію змінюють разом з кодом."
      en: "Three fields are collected: the expense record and the receipt photo go to the mock service, and the crash report is sent by a library — that is your app collecting too. The theme stays on the phone, and the coordinates are stripped at creation, so they get neither into the declaration nor anywhere else. If you ever add a feature that sends more, the declaration changes together with the code."
    feedback:
      - when: { test: "every field of the data flow has exactly one line" }
        message:
          uk: "Ця перевірка чекає в `declaration` рівно п’ять рядків — по одному на кожне поле `data-flow.js`, з тим самим `field`. Поля, що не збираються, теж мають свій рядок."
          en: "This check expects exactly five lines in `declaration` — one per field of `data-flow.js`, with the same `field`. Fields that are not collected get a line too."
      - when: { test: "data that leaves the phone is declared collected and sent" }
        message:
          uk: "Ця перевірка чекає `collected: true` і `where: 'sent'` для полів, що йдуть у `mock-service` чи `crash-library`. Звіт про збій надсилає бібліотека, але для магазину це збирає твій застосунок."
          en: "This check expects `collected: true` and `where: 'sent'` for the fields that go to `mock-service` or `crash-library`. The crash report is sent by a library, but for the store your app collects it."
      - when: { test: "data that stays on the phone or is removed is not declared collected" }
        message:
          uk: "Ця перевірка чекає `collected: false` для полів з `destination` `'device'` (тоді `where: 'device'`) і `'removed'` (тоді `where: 'none'`). Дані, що лишаються на телефоні, у декларацію як зібрані не входять."
          en: "This check expects `collected: false` for the fields with `destination` `'device'` (then `where: 'device'`) and `'removed'` (then `where: 'none'`). Data that stays on the phone does not go into the declaration as collected."
      - when: { test: "each collected field carries the purpose from the data flow" }
        message:
          uk: "Ця перевірка чекає для кожного зібраного поля `purpose` таку саму, як у `data-flow.js`, — одне зі значень `PURPOSES`, текстом у лапках."
          en: "This check expects every collected field's `purpose` to be the same as in `data-flow.js` — one of the `PURPOSES` strings in quotes."
      - when: { error: SyntaxError }
        message:
          uk: "Програма не змогла запуститися. Перевір фігурні дужки й коми між рядками масиву в `declaration.js`."
          en: "The program could not start. Check the braces and the commas between the array's lines in `declaration.js`."
    limits:
      uk: "Концептуальний перегляд через react-native-web. Тут немає App Store Connect і Play Console, а їхні форми мають більше питань (тип даних, зв’язок з людиною, шифрування під час передачі, видалення на запит). Діаграма потоків даних — синтетична таблиця, а не аналіз справжнього застосунку."
      en: "A concept preview through react-native-web. There is no App Store Connect or Play Console here, and their forms have more questions (the data type, linking to a person, encryption in transit, deletion on request). The data-flow diagram is a synthetic table, not an analysis of a real app."

  - id: to-project
    kind: transfer
    capstoneStep: RN-11
    body:
      uk: "У release-нотатці свого проєкту запиши шлях оновлення (у курсі — встановлення в обхід магазину), що з наступних змін зможе прийти лише новою збіркою, і короткий підсумок приватності: які дані проєкту лишаються на телефоні, а які — якщо такі є — його залишають."
      en: "In your project's release note, write down the update path (in the course: sideloading), which of the next changes could only arrive with a new build, and a short privacy summary: which of the project's data stays on the phone and which — if any — leaves it."
