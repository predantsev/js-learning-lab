id: rn-11-06-compatibility-rollback
unit: RN-11
title:
  uk: "Сумісність і межі відкату"
  en: "Compatibility and rollback limits"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Пояснити, чому native-release не відкотиш, як статичний сайт: встановлені збірки лишаються на пристроях, номер збірки не може зменшитися, а збережені дані вже могли бути перенесені в нову схему."
    en: "Explain why a native release cannot be rolled back like a static site: installed builds stay on devices, version codes cannot go down and stored data may already be migrated."
  - uk: "Спланувати виправлення наперед і вікно сумісності (мінімальна версія ОС, версія схеми, контракт API) для синтетичного оновлення."
    en: "Plan a forward fix and a compatibility window (minimum OS version, schema version, API contract) for a synthetic update."
prerequisites: [rn-11-05-distribution-update-privacy, re-12-04-static-delivery-rollback]
subskills:
  - { family: N-11, skill: "compatibility and rollback limitations", depth: intro }
glossary: [minimum-os-version, forward-fix, version-downgrade]
selfCheck: [predict-build-4, habits-release-note]

blocks:
  - id: no-folder-to-repoint
    kind: explanation
    title:
      uk: "Немає теки, на яку перемкнутися"
      en: "No folder to switch back to"
    body:
      uk: |
        У RE-12 відкат вебзастосунку займав хвилини: сервер перемикали на теку попереднього випуску. У native-застосунку такої теки немає — є мільйони телефонів, і на кожному свій встановлений пакет. Тому «відкотити» release неможливо з трьох причин:

        - **Встановлене лишається.** Хто вже оновився, той на новій збірці, доки не отримає наступну.
        - **Номер збірки не йде назад.** Стару збірку не поставиш поверх нової — це [[version-downgrade|повернення до старішої збірки]]. «Старий код» можна лише випустити як **нову** збірку з більшим номером.
        - **Дані вже перенесено.** Якщо нова збірка перенесла збережені дані в нову схему (як у RN-05), старий код може їх не прочитати.

        Тож на поганий release відповідають [[forward-fix|виправленням наперед]] — збіркою з більшим номером. Швидше може бути лише «вимикач» (kill switch): віддалений прапорець, що вимикає зламану функцію без нової збірки, — але тільки якщо збірка вже вміє цей прапорець читати.
      en: |
        In RE-12 rolling back a web app took minutes: the server was switched to the previous release's folder. A native app has no such folder — it has millions of phones, each with its own installed package. So a release cannot be “rolled back”, for three reasons:

        - **What is installed stays.** Whoever already updated is on the new build until they get the next one.
        - **The build number does not go back.** An old build cannot be installed over a new one — that is a [[version-downgrade|version downgrade]]. “Old code” can only be released as a **new** build with a higher number.
        - **The data is already migrated.** If the new build moved stored data to a new schema (as in RN-05), the old code may be unable to read it.

        So a bad release is answered with a [[forward-fix|forward fix]] — a build with a higher number. The only thing faster is a “kill switch”: a remote flag that turns a broken feature off without a new build — but only if the build already knows how to read that flag.

  - id: predict-build-4
    kind: prediction
    prompt:
      uk: |
        Планувальник, на телефоні людини — збірка 3. Вона перенесла збережені справи в схему v2: замінила поле `done` полем `status`. У збірці 3 знайшли помилку, і команда «відкочує» release: випускає код збірки 2 як збірку 4 (`versionCode` 4).

        Код збірки 2 розуміє лише схему v1, а новішу схему не перезаписує — так, як ти вчив у RN-05. Що побачить людина після оновлення до збірки 4?
      en: |
        A planner; the person's phone has build 3. It moved the stored tasks to schema v2: it replaced the `done` field with a `status` field. A bug is found in build 3, and the team “rolls back” the release: it ships build 2's code as build 4 (`versionCode` 4).

        Build 2's code understands only schema v1 and does not overwrite a newer schema — the way you learned in RN-05. What does the person see after updating to build 4?
    runnable: false
    answer:
      type: choice
      options:
        - id: unreadable
          text:
            uk: "Збірка 4 ставиться як оновлення, але не може прочитати дані v2: список справ порожній, хоча дані лишилися на телефоні"
            en: "Build 4 installs as an update but cannot read the v2 data: the task list is empty, although the data is still on the phone"
        - id: as-before
          text:
            uk: "Повертається збірка 2 зі справами такими, як були до збірки 3"
            en: "Build 2 comes back with the tasks as they were before build 3"
          why:
            uk: "Код збірки 2 повернувся, а дані — ні: збірка 3 вже перенесла їх у v2, і назад їх ніхто не переносив."
            en: "Build 2's code came back, but the data did not: build 3 already moved it to v2, and nobody moved it back."
        - id: refused
          text:
            uk: "Телефон відмовить у встановленні: код старіший за встановлений"
            en: "The phone refuses the installation: the code is older than the installed one"
          why:
            uk: "Телефон порівнює номер збірки, а не вік коду. `versionCode` 4 більший за 3, тож це звичайне оновлення."
            en: "The phone compares the build number, not the age of the code. `versionCode` 4 is higher than 3, so it is an ordinary update."
        - id: auto-back
          text:
            uk: "Сховище саме повернеться до схеми v1"
            en: "Storage returns to schema v1 by itself"
          why:
            uk: "Міграції йдуть лише вперед. Щоб повернути дані до v1, хтось мав би написати й випустити зворотну міграцію — у новій збірці."
            en: "Migrations only go forward. To bring the data back to v1 someone would have to write and ship a reverse migration — in a new build."
      correct: [unreadable]
    explanation:
      uk: "«Відкат» у native — це нова збірка зі старим кодом, а не повернення в минуле. Дані v2 лишаються на телефоні, а старий код чесно відмовляється їх читати. Тому погана міграція — найнебезпечніша частина release: її не скасуєш, можна лише заздалегідь зробити її читабельною для старих збірок."
      en: "A “rollback” in native is a new build with old code, not a trip back in time. The v2 data stays on the phone, and the old code honestly refuses to read it. That is why a bad migration is the most dangerous part of a release: it cannot be undone; it can only be made readable for old builds in advance."

  - id: rollback-replay
    kind: example
    runtime: concept-preview
    dir: rollback-replay
    entry: main.jsx
    strings:
      title: { uk: "Один телефон, три збірки", en: "One phone, three builds" }
      build: { uk: "Збірка", en: "Build" }
      saved: { uk: "дані збережено", en: "data saved" }
      migrated: { uk: "дані перенесено", en: "data migrated" }
      read: { uk: "дані прочитано", en: "data read" }
      unreadable: { uk: "дані не прочитано", en: "data not readable" }
      tasks: { uk: "справ", en: "tasks" }
      done: { uk: "виконано", en: "done" }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      wardrobe: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
    title:
      uk: "Відкат на одному телефоні"
      en: "A rollback on one phone"
    body:
      uk: |
        `simulated-timeline.js` — **імітація** одного телефона: магазин ставить збірки одна поверх одної, а сховище на пристрої лишається спільним. Збірка 1 зберігає три справи (дві виконані), збірка 3 переносить їх міграцією з `migration-v2.js`, а збірка 4 — це код збірки 2 з `reader-build2.js`.

        Читач збірки 2 дивиться на поле `minReaderVersion`: це обіцянка нової схеми «збірки, що розуміють цю версію, можуть мене читати». Натисни **Запустити**.
      en: |
        `simulated-timeline.js` is a **simulation** of one phone: the store installs builds one over another, and the on-device storage stays shared. Build 1 saves three tasks (two done), build 3 migrates them with `migration-v2.js`, and build 4 is build 2's code from `reader-build2.js`.

        Build 2's reader looks at the `minReaderVersion` field: it is the new schema's promise “builds that understand this version can read me”. Press **Run**.
    tryIt:
      uk: |
        Збірка 4 каже «дані не прочитано», справ 0 — як у передбаченні. Змінюй лише `migration-v2.js`:

        1. Заміни `minReaderVersion: 2` на `minReaderVersion: 1` і запусти: справ 3, але виконано 0 — читач повірив обіцянці, а поля `done` вже немає. Обіцянка без сумісних даних гірша, ніж чесна відмова.
        2. Тепер збережи й `done`: заміни `({ done, ...task }) => ({ ...task, status: done ? 'done' : 'pending' })` на `(task) => ({ ...task, status: task.done ? 'done' : 'pending' })`. Запусти: справ 3, виконано 2. Міграція лише **додала** поле — і стала читабельною для старої збірки.
      en: |
        Build 4 says “data not readable”, 0 tasks — as in the prediction. Change only `migration-v2.js`:

        1. Replace `minReaderVersion: 2` with `minReaderVersion: 1` and run: 3 tasks, but 0 done — the reader trusted the promise, and the `done` field is gone. A promise without compatible data is worse than an honest refusal.
        2. Now keep `done` too: replace `({ done, ...task }) => ({ ...task, status: done ? 'done' : 'pending' })` with `(task) => ({ ...task, status: task.done ? 'done' : 'pending' })`. Run: 3 tasks, 2 done. The migration only **added** a field — and became readable for the old build.
    limits:
      uk: "Концептуальний перегляд через react-native-web. Магазину, встановлення й справжнього сховища тут немає: `simulated-timeline.js` лише викликає функції міграції й читання по черзі, як це відбулося б на одному телефоні. Справжній розподіл людей між збірками, затримки оновлень і поведінку конкретного сховища (RN-05) тут не видно."
      en: "A concept preview through react-native-web. There is no store, no installation and no real storage here: `simulated-timeline.js` only calls the migration and reading functions in turn, as it would happen on one phone. The real spread of people across builds, update delays and the behaviour of a particular storage (RN-05) do not show here."

  - id: compatibility-window
    kind: explanation
    title:
      uk: "Вікно сумісності"
      en: "The compatibility window"
    body:
      uk: |
        Скасувати release не можна, тож до нього готуються заздалегідь — вікном сумісності. Воно каже, з якими телефонами, даними й сервером ще працює кожна збірка:

        - [[minimum-os-version|мінімальна версія ОС]] — хто її не має, лишається на попередній збірці, доки ОС на телефоні не оновиться (а старі телефони часто вже не оновлюються);
        - **версія схеми** — міграції додають поля, а не перейменовують, і кажуть, з якої версії старі збірки ще можуть читати дані (як `minReaderVersion` у прикладі);
        - **контракт API** — сервер тримає старі адреси й поля, доки на телефонах є старі збірки.
      en: |
        A release cannot be undone, so you prepare for it in advance — with a compatibility window. It says which phones, data and server each build still works with:

        - the [[minimum-os-version|minimum OS version]] — whoever does not have it stays on the previous build until the phone's OS is updated (and old phones often no longer get updates);
        - the **schema version** — migrations add fields rather than rename them, and say from which version old builds can still read the data (like `minReaderVersion` in the example);
        - the **API contract** — the server keeps the old addresses and fields while old builds remain on phones.

  - id: recall-static-rollback
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: how-web-rolls-back
        from: re-12-04-static-delivery-rollback
        prompt:
          uk: "Як найшвидше й найбезпечніше відкотити статичний вебзастосунок, якщо кожен випуск лежить у своїй теці?"
          en: "What is the fastest and safest way to roll back a static web app when every release lives in its own folder?"
        answer:
          type: choice
          options:
            - id: repoint
              text:
                uk: "Перемкнути сервер на теку попереднього випуску — той самий артефакт, який уже перевіряли"
                en: "Switch the server to the previous release's folder — the same artifact that was already checked"
            - id: rebuild
              text:
                uk: "Перейти на старий commit і зібрати його заново"
                en: "Check out the old commit and build it again"
              why:
                uk: "Нове збирання може взяти інші значення з `.env` чи інші версії пакетів — і «старий» артефакт виявиться новим і неперевіреним."
                en: "A new build may take other values from `.env` or other package versions — and the “old” artifact turns out new and unchecked."
            - id: wait
              text:
                uk: "Нічого не робити: браузери самі повернуться до кешованої версії"
                en: "Do nothing: browsers return to the cached version by themselves"
              why:
                uk: "Браузер питає `index.html` щоразу й отримує новий випуск. Сам він назад не повернеться."
                en: "The browser asks for `index.html` every time and gets the new release. It will not go back by itself."
          correct: [repoint]
        explanation:
          uk: "У вебі сервер вирішує, що отримає кожен наступний відвідувач. У native вирішує встановлений на телефоні пакет — тому відкату, як у вебі, там немає."
          en: "On the web the server decides what every next visitor gets. In native the package installed on the phone decides — that is why there is no web-style rollback there."

  - id: habits-release-note
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: habits-release-note
    entry: main.jsx
    editable: [release-note.js]
    strings:
      title: { uk: "Release-нотатка", en: "Release note" }
      window: { uk: "Вікно сумісності", en: "Compatibility window" }
      leftBehind: { uk: "Лишаються на збірці 6 (Android API)", en: "Stay on build 6 (Android API)" }
      incidentLabel: { uk: "Якщо зламалося", en: "If it breaks" }
      cannotUndo: { uk: "Не скасувати", en: "Cannot be undone" }
      incidentText: { uk: "Збірка 7 падає на частині Android-телефонів, щойно збережено час нагадування.", en: "Build 7 crashes on some Android phones as soon as a reminder time is saved." }
    title:
      uk: "Release-нотатка для збірки 7 трекера звичок"
      en: "A release note for build 7 of the habit tracker"
    instructions:
      uk: |
        `update.js` описує збірку 6, яку люди вже мають, нову збірку 7 і те, що пішло не так після її виходу. Заповни в `release-note.js` нотатку:

        - `compatibility` — мінімальні версії Android (API) та iOS для збірки 7, версію схеми, яку вона пише, і рівні Android API, що вже не отримають збірку 7 (`leftBehindAndroidApis`);
        - `ifBroken` — що команда робить зі зламаною збіркою 7 (`action`: `'forward-fix'`, `'kill-switch'` чи `'reinstall-previous'`) і який `versionCode` отримає наступна збірка;
        - `cannotUndo` — слова з `UNDO_WORDS` для всього, що після виходу збірки 7 скасувати не можна, і нічого зайвого.
      en: |
        `update.js` describes build 6, which people already have, the new build 7 and what went wrong after it shipped. Fill in the note in `release-note.js`:

        - `compatibility` — the minimum Android (API) and iOS versions for build 7, the schema version it writes, and the Android API levels that will no longer get build 7 (`leftBehindAndroidApis`);
        - `ifBroken` — what you do about the broken build 7 (`action`: `'forward-fix'`, `'kill-switch'` or `'reinstall-previous'`) and which `versionCode` the next build gets;
        - `cannotUndo` — the words from `UNDO_WORDS` for everything that cannot be undone after build 7 shipped, and nothing extra.
    testTitles:
      "the compatibility window matches build 7":
        uk: "Вікно сумісності відповідає збірці 7"
        en: "The compatibility window matches build 7"
      "the Android versions left on build 6 are named":
        uk: "Названо версії Android, що лишаються на збірці 6"
        en: "The Android versions left on build 6 are named"
      "a broken build 7 is answered going forward, with a higher versionCode":
        uk: "На зламану збірку 7 відповідають наперед, з більшим `versionCode`"
        en: "A broken build 7 is answered going forward, with a higher `versionCode`"
      "what cannot be undone is listed":
        uk: "Перелічено все, що не скасувати"
        en: "What cannot be undone is listed"
    hints:
      nudge:
        uk: "Порівняй `previous` і `update` поле за полем: що змінилося, те й визначає вікно сумісності. А для `cannotUndo` спитай про кожне слово: чи можна це змінити наступною збіркою чи в консолі магазину?"
        en: "Compare `previous` and `update` field by field: whatever changed defines the compatibility window. And for `cannotUndo` ask about each word: can it be changed by the next build or in the store's console?"
      explanation:
        uk: |
          Якби, скажімо, збірка 12 піднімала мінімум з API 23 до API 26, то на попередній збірці лишилися б телефони з API 23, 24 і 25 — усі рівні від старого мінімуму до нового, без нього самого.

          Відповідь на зламаний release завжди йде вперед: номер наступної збірки більший за всі використані. Вимикач допомагає, лише коли зламана функція вже читає віддалений прапорець. Не скасувати те, що вже сталося на телефонах, — а те, що наступна збірка чи консоль магазину можуть змінити, у цей список не входить.
        en: |
          If, say, build 12 raised the minimum from API 23 to API 26, the phones left on the previous build would be API 23, 24 and 25 — every level from the old minimum up to the new one, without the new one itself.

          The answer to a broken release always goes forward: the next build's number is higher than every one used. A kill switch helps only when the broken feature already reads a remote flag. What cannot be undone is whatever already happened on the phones — and what the next build or the store console can change does not belong on the list.
    solutionNote:
      uk: "Збірка 7 підняла мінімум до API 26, тож телефони з API 24 і 25 лишаються на збірці 6, доки на них не з’явиться новіший Android (а на таких старих телефонах він рідко з’являється) — їх варто назвати в нотатці, щоб сервер ще довго підтримував контракт збірки 6. На збій відповідають збіркою 8; оскільки збірка 7 читає прапорець `reminders`, можна ще й одразу вимкнути нагадування, поки збірка 8 проходить магазин. Встановлені збірки, перенесені в v3 дані й використаний `versionCode` 7 скасувати не можна — і саме тому v3 лише додає поле, а не перейменовує."
      en: "Build 7 raised the minimum to API 26, so phones with API 24 and 25 stay on build 6 until they get a newer Android (which such old phones rarely do) — worth naming in the note, so that the server keeps build 6's contract for a long time. The crash is answered with build 8; since build 7 reads the `reminders` flag, you can also switch reminders off at once while build 8 goes through the store. Installed builds, data migrated to v3 and the used `versionCode` 7 cannot be undone — and that is exactly why v3 only adds a field rather than renaming one."
    feedback:
      - when: { test: "the compatibility window matches build 7" }
        message:
          uk: "Ця перевірка чекає `minAndroidApi: 26`, `minIos: '16.4'` і `schemaWritten: 3` — значення збірки 7 з `update.js`, а не збірки 6."
          en: "This check expects `minAndroidApi: 26`, `minIos: '16.4'` and `schemaWritten: 3` — build 7's values from `update.js`, not build 6's."
      - when: { test: "the Android versions left on build 6 are named" }
        message:
          uk: "Ця перевірка чекає в `leftBehindAndroidApis` числа `24` і `25`: рівні Android API від старого мінімуму збірки 6 до нового мінімуму збірки 7, без нього самого."
          en: "This check expects the numbers `24` and `25` in `leftBehindAndroidApis`: the Android API levels from build 6's old minimum up to build 7's new minimum, without the new one itself."
      - when: { test: "a broken build 7 is answered going forward, with a higher versionCode" }
        message:
          uk: "Ця перевірка чекає `action` `'forward-fix'` або `'kill-switch'` і `nextVersionCode` більший за 7. Збірку 6 поставити поверх 7 не можна, а її код у новій збірці не прочитає дані v3."
          en: "This check expects `action` to be `'forward-fix'` or `'kill-switch'` and `nextVersionCode` to be higher than 7. Build 6 cannot be installed over 7, and its code in a new build would not read the v3 data."
      - when: { test: "what cannot be undone is listed" }
        message:
          uk: "Ця перевірка чекає в `cannotUndo` рівно три слова з `UNDO_WORDS`: усе, що вже сталося на телефонах і з номерами збірок. Текст сторінки в магазині й іконку можна змінити наступним release."
          en: "This check expects exactly three words from `UNDO_WORDS` in `cannotUndo`: everything that already happened on phones and to the build numbers. The store page's text and the icon can be changed by the next release."
      - when: { error: SyntaxError }
        message:
          uk: "Програма не змогла запуститися. Перевір коми, лапки й квадратні дужки в `release-note.js`."
          en: "The program could not start. Check the commas, quotes and square brackets in `release-note.js`."
    limits:
      uk: "Концептуальний перегляд через react-native-web. Збірки 6 і 7, інцидент і прапорець — синтетичний сценарій; магазину, телефонів і сервера тут немає, а перевірки бачать лише значення в нотатці."
      en: "A concept preview through react-native-web. Builds 6 and 7, the incident and the flag are a synthetic scenario; there is no store, no phones and no server here, and the checks see only the values in the note."

  - id: to-project
    kind: transfer
    capstoneStep: RN-11
    body:
      uk: "Коли ставитимеш збірку 2 свого проєкту поверх збірки 1, запиши в release-нотатці, що станеться, якщо збірка 2 виявиться поганою: який номер отримає виправлення і чи зможе код збірки 1 прочитати дані, які збереже збірка 2."
      en: "When you install your project's build 2 over build 1, write in the release note what happens if build 2 turns out bad: which number the fix gets, and whether build 1's code could read the data build 2 saves."
