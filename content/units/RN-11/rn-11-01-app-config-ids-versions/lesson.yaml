id: rn-11-01-app-config-ids-versions
unit: RN-11
title:
  uk: "Конфігурація застосунку, ідентифікатори й версії"
  en: "App config, ids and versions"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Знайти, де задано Android applicationId, versionCode і versionName та iOS bundle identifier, номер збірки й версію для користувачів, і сказати, які з них мусять зростати з кожним release."
    en: "Identify where the Android applicationId, versionCode and versionName and the iOS bundle identifier, build number and marketing version are set, and which of them must increase with every release."
  - uk: "Пояснити, чому ідентифікатор пакета не можна змінювати, коли користувачі вже встановили застосунок."
    en: "Explain why the package id must never change once users have installed the app."
prerequisites: [re-12-03-versions-artifacts-updates, rn-01-03-env-versions-debug-release]
subskills:
  - { family: N-11, skill: "Android/iOS config/package ids/versions", depth: intro }
glossary: [application-id, bundle-identifier, version-code, build-number]
selfCheck: [predict-update, planner-releases]

blocks:
  - id: one-identity
    kind: explanation
    title:
      uk: "Одна особа й два номери"
      en: "One identity and two numbers"
    body:
      uk: |
        До цього розділу ти запускав застосунок з dev-сервера. Тепер мова про збірку, яку отримують люди, і тут операційна система та магазин питають про три речі.

        **Хто це?** На Android — [[application-id|applicationId]], на iOS — [[bundle-identifier|bundle identifier]]. Зазвичай це той самий текст у формі перевернутого домену: `com.example.jsll.wishlist`. За ним телефон і магазин розпізнають «той самий застосунок».

        **Чи це новіше?** На Android — ціле число [[version-code|versionCode]], на iOS — [[build-number|номер збірки]] (`CFBundleVersion`). Їх користувач не бачить, але порівнюють саме їх.

        **Що показати людям?** `versionName` на Android і `CFBundleShortVersionString` на iOS — наприклад, `1.1.0`. ОС і Google Play цей текст не порівнюють; лише App Store Connect вимагає, щоб нова версія для App Store була вищою за попередню схвалену.

        У проєкті Expo все це задається в `app.json`, а команда `npx expo prebuild` переносить значення в native-файли. Ми перевірили це на Expo SDK 57:

        | `app.json` (у `"expo"`) | Android, `android/app/build.gradle` | iOS, `Info.plist` |
        |---|---|---|
        | `android.package` / `ios.bundleIdentifier` | `applicationId` | `CFBundleIdentifier` (через `PRODUCT_BUNDLE_IDENTIFIER` у `project.pbxproj`) |
        | `android.versionCode` (число) | `versionCode` | — |
        | `ios.buildNumber` (текст, `"2"`) | — | `CFBundleVersion` |
        | `version` | `versionName` | `CFBundleShortVersionString` |

        Якщо ідентифікатора в `app.json` немає, `prebuild` сам вигадав нам `com.anonymous.rn11lab` — тимчасову назву, з якою не можна випускати застосунок.
      en: |
        Until this unit you ran the app from the dev server. Now we are talking about the build people get, and here the operating system and the store ask about three things.

        **Who is this?** On Android it is the [[application-id|applicationId]], on iOS the [[bundle-identifier|bundle identifier]]. Usually it is the same string in reversed-domain form: `com.example.jsll.wishlist`. By it a phone and a store recognise “the same app”.

        **Is this newer?** On Android the whole number [[version-code|versionCode]], on iOS the [[build-number|build number]] (`CFBundleVersion`). The user never sees them, but these are what gets compared.

        **What do people see?** `versionName` on Android and `CFBundleShortVersionString` on iOS — for example `1.1.0`. The OS and Google Play do not compare this text; only App Store Connect requires a new App Store version to be higher than the previously approved one.

        In an Expo project all of this is set in `app.json`, and the command `npx expo prebuild` carries the values into the native files. We checked it on Expo SDK 57:

        | `app.json` (inside `"expo"`) | Android, `android/app/build.gradle` | iOS, `Info.plist` |
        |---|---|---|
        | `android.package` / `ios.bundleIdentifier` | `applicationId` | `CFBundleIdentifier` (through `PRODUCT_BUNDLE_IDENTIFIER` in `project.pbxproj`) |
        | `android.versionCode` (a number) | `versionCode` | — |
        | `ios.buildNumber` (text, `"2"`) | — | `CFBundleVersion` |
        | `version` | `versionName` | `CFBundleShortVersionString` |

        With no id in `app.json`, `prebuild` made one up for us: `com.anonymous.rn11lab` — a placeholder you must not release an app with.

  - id: identity-map
    kind: visual
    visual: diagram
    title:
      uk: "Звідки беруться ідентифікатор і номери"
      en: "Where the id and the numbers come from"
    textEquivalent:
      uk: "Файл app.json задає ідентифікатор, номер збірки й версію для користувачів. Для Android вони стають applicationId, versionCode і versionName у build.gradle, для iOS — CFBundleIdentifier, CFBundleVersion і CFBundleShortVersionString в Info.plist. Між першим і другим release ідентифікатори не змінюються: com.example.jsll.wishlist лишається тим самим на обох платформах. Номери збірки зростають з 1 до 2 — саме їх порівнюють магазин і Android, щоб вирішити, що новіше. Версія для людей змінюється з 1.0.0 на 1.1.0, але ОС її не порівнює: вона для показу (лише App Store Connect вимагає, щоб вона зростала). Якщо ж змінити ідентифікатор, для телефона й магазину це вже інший застосунок."
      en: "The app.json file sets the id, the build number and the version for people. For Android they become applicationId, versionCode and versionName in build.gradle, for iOS CFBundleIdentifier, CFBundleVersion and CFBundleShortVersionString in Info.plist. Between the first and the second release the ids do not change: com.example.jsll.wishlist stays the same on both platforms. The build numbers grow from 1 to 2 — they are what the store and Android compare to decide what is newer. The version for people changes from 1.0.0 to 1.1.0, but the OS does not compare it: it is for display (only App Store Connect requires it to grow). If the id changes, the phone and the store see a different app."
    spec:
      layout: grid
      groups:
        - { id: android, label: "Android: build.gradle" }
        - { id: ios, label: "iOS: Info.plist" }
      nodes:
        - { id: config, label: "app.json", shape: pill, w: 120, col: 0, row: 0 }
        - { id: a-id, group: android, label: "applicationId", w: 110, col: 0, row: 1 }
        - { id: a-code, group: android, label: "versionCode", w: 110, col: 0, row: 2 }
        - { id: a-name, group: android, label: "versionName", w: 110, col: 0, row: 3 }
        - { id: i-id, group: ios, label: "CFBundleIdentifier", w: 150, col: 1, row: 1 }
        - { id: i-build, group: ios, label: "CFBundleVersion", w: 150, col: 1, row: 2 }
        - { id: i-short, group: ios, label: "CFBundleShortVers…", w: 150, col: 1, row: 3 }
      edges:
        - { id: to-android, from: config, to: a-id, label: "prebuild" }
        - { id: to-ios, from: config, to: i-id, label: "prebuild" }
      steps:
        - caption:
            uk: "`app.json` — одне місце для обох платформ. `npx expo prebuild` переносить значення в `build.gradle` і `Info.plist` (останнє поле повністю — `CFBundleShortVersionString`)."
            en: "`app.json` is one place for both platforms. `npx expo prebuild` carries the values into `build.gradle` and `Info.plist` (the last field in full is `CFBundleShortVersionString`)."
        - caption:
            uk: "**Особа** застосунку: `com.example.jsll.wishlist` в обох release. Цей ідентифікатор не змінюється ніколи."
            en: "The app's **identity**: `com.example.jsll.wishlist` in both releases. This string never changes."
          highlight: [a-id, i-id]
          dim: [a-code, a-name, i-build, i-short]
          annotate:
            - { id: a-id, text: { uk: "без змін", en: "unchanged" } }
            - { id: i-id, text: { uk: "без змін", en: "unchanged" } }
        - caption:
            uk: "**Номери збірки** зростають: 1 → 2. Саме їх порівнюють магазин і Android, щоб вирішити, що новіше."
            en: "The **build numbers** grow: 1 → 2. These are what the store and Android compare to decide what is newer."
          highlight: [a-code, i-build]
          dim: [config, a-id, a-name, i-id, i-short, to-android, to-ios]
          annotate:
            - { id: a-code, text: "1 → 2" }
            - { id: i-build, text: "\"1\" → \"2\"" }
        - caption:
            uk: "**Версія для людей**: 1.0.0 → 1.1.0. Вона з’являється в магазині й у налаштуваннях телефона, але ОС її не порівнює."
            en: "The **version for people**: 1.0.0 → 1.1.0. It appears in the store and in the phone's settings, but the OS does not compare it."
          highlight: [a-name, i-short]
          dim: [config, a-id, a-code, i-id, i-build, to-android, to-ios]
          annotate:
            - { id: a-name, text: "1.0.0 → 1.1.0" }
            - { id: i-short, text: "1.0.0 → 1.1.0" }
        - caption:
            uk: "Інший ідентифікатор — інший застосунок: телефон поставить його **поруч** зі старим, а дані старого лишаться в старому."
            en: "A different id is a different app: the phone installs it **next to** the old one, and the old one's data stays in the old one."
          highlight: [a-id, i-id]
          dim: [a-code, a-name, i-build, i-short]
          annotate:
            - { id: a-id, text: { uk: "інший = новий застосунок", en: "different = a new app" } }

  - id: predict-update
    kind: prediction
    prompt:
      uk: "У людей встановлено список бажань: `version` `1.0.0`, Android `versionCode` `1`, ідентифікатор `com.example.jsll.wishlist`. Ти готуєш release 2. Яка зміна в `app.json` дасть їм його **як оновлення** — магазин прийме збірку, а телефон поставить її поверх release 1?"
      en: "People have the wishlist installed: `version` `1.0.0`, Android `versionCode` `1`, id `com.example.jsll.wishlist`. You are preparing release 2. Which change in `app.json` gets it to them **as an update** — the store accepts the build and the phone installs it over release 1?"
    runnable: false
    answer:
      type: choice
      options:
        - id: name-only
          text:
            uk: "`version` → `1.1.0`, а `versionCode` лишити `1`"
            en: "`version` → `1.1.0`, keeping `versionCode` at `1`"
          why:
            uk: "Рядок `1.1.0` бачать люди, але ні Android, ні Google Play його не порівнюють. Збірка з тим самим `versionCode` для магазину — дублікат, і він її не прийме."
            en: "People see the text `1.1.0`, but neither Android nor Google Play compares it. A build with the same `versionCode` is a duplicate for the store, and it will not accept it."
        - id: bump-code
          text:
            uk: "`version` → `1.1.0` і `versionCode` → `2`"
            en: "`version` → `1.1.0` and `versionCode` → `2`"
        - id: new-id
          text:
            uk: "`versionCode` → `2` і новий ідентифікатор `com.example.jsll.wishes`, бо назву змінили"
            en: "`versionCode` → `2` and a new id `com.example.jsll.wishes`, because the name changed"
          why:
            uk: "Інший ідентифікатор — інший застосунок. Він з’явиться поруч зі старим, а не замість нього, і старі бажання лишаться в старому."
            en: "A different id is a different app. It appears next to the old one, not instead of it, and the old wishes stay in the old one."
        - id: lower-code
          text:
            uk: "`version` → `1.1.0` і `versionCode` → `0`, щоб почати рахунок заново"
            en: "`version` → `1.1.0` and `versionCode` → `0`, to restart the count"
          why:
            uk: "Android не ставить збірку з меншим `versionCode`, ніж уже встановлена: це захист від повернення до старішої версії."
            en: "Android will not install a build with a lower `versionCode` than the installed one: it is a protection against going back to an older version."
      correct: [bump-code]
    explanation:
      uk: "Оновлення — це той самий ідентифікатор і більший номер збірки. [Документація Android](https://developer.android.com/studio/publish/versioning) прямо каже, що `versionCode` визначає, яка версія новіша, і що система не дає встановити менший; користувач цього числа не бачить. Версію `1.1.0` теж варто підняти — але для людей, а не для системи."
      en: "An update is the same id and a higher build number. [The Android documentation](https://developer.android.com/studio/publish/versioning) says plainly that `versionCode` decides which version is newer and that the system refuses a lower one; the user never sees that number. Raising the version to `1.1.0` is right too — for people, not for the system."

  - id: ship-check
    kind: example
    runtime: concept-preview
    dir: ship-check
    entry: main.jsx
    strings:
      title: { uk: "Перевірка release", en: "Release check" }
      update: { uk: "Оновлення: поставиться поверх встановленої збірки", en: "Update: installs over the installed build" }
      sameBuild: { uk: "Відмова: такий номер збірки вже був", en: "Refused: this build number was already used" }
      lowerBuild: { uk: "Відмова: номер збірки менший, ніж у встановленої", en: "Refused: the build number is lower than the installed one" }
      separateApp: { uk: "Інший застосунок: стане поруч зі старим", en: "A different app: installs next to the old one" }
      incomplete: { uk: "Бракує ідентифікатора чи номера збірки", en: "An id or a build number is missing" }
    title:
      uk: "Що буде з release 2"
      en: "What happens to release 2"
    body:
      uk: |
        `releases.js` описує встановлений release і наступний — у тій самій формі, що й `app.json`. `simulated-store.js` — **імітація**: він застосовує задокументовані правила магазинів (Google Play Console, App Store Connect) і встановлювача пакетів Android (PackageManager) до звичайних об’єктів. Справжньої перевірки тут немає. Натисни **Запустити**.
      en: |
        `releases.js` describes the installed release and the next one — in the same shape as `app.json`. `simulated-store.js` is a **simulation**: it applies the documented rules of the stores (Google Play Console, App Store Connect) and of Android's package installer (PackageManager) to plain objects. No real check happens here. Press **Run**.
    tryIt:
      uk: |
        Змінюй лише `next` у `releases.js` і запускай після кожного кроку:

        1. `versionCode: 2` заміни на `versionCode: 1` — рядок Android каже «такий номер збірки вже був», а iOS досі «оновлення».
        2. Тепер `versionCode: 0` — «номер збірки менший». Поверни `2`.
        3. У `next` заміни обидва `'com.example.jsll.wishlist'` на `'com.example.jsll.wishes'` — обидва рядки кажуть «інший застосунок». Поверни як було.
        4. Зміни лише `version` на `'9.9.9'` — нічого не змінюється: версію для людей імітація не порівнює, як і Android та Google Play. (App Store Connect порівнює її з останньою схваленою версією — це правило магазину, а не встановлення; імітація його не відтворює.)
      en: |
        Change only `next` in `releases.js` and run after every step:

        1. Replace `versionCode: 2` with `versionCode: 1` — the Android row says “this build number was already used”, while iOS still says “update”.
        2. Now `versionCode: 0` — “the build number is lower”. Put `2` back.
        3. In `next` replace both `'com.example.jsll.wishlist'` with `'com.example.jsll.wishes'` — both rows say “a different app”. Put them back.
        4. Change only `version` to `'9.9.9'` — nothing changes: the simulation does not compare the version for people, and neither do Android and Google Play. (App Store Connect compares it with the last approved version — a store rule, not an install rule; the simulation does not reproduce it.)
    limits:
      uk: "Концептуальний перегляд через react-native-web, а не збірка. Немає магазину, телефона й встановлення: `simulated-store.js` лише застосовує правила з документації до об’єктів. Справжній Android ще й перевіряє підпис збірки (про нього — в одному з наступних уроків), а встановлення на iOS-пристрій тут не відтворено зовсім. Жодних native view, жестів і продуктивності телефона."
      en: "A concept preview through react-native-web, not a build. There is no store, no phone and no installation: `simulated-store.js` only applies the documented rules to objects. Real Android also checks the build's signature (a later lesson covers it), and installing on an iOS device is not reproduced here at all. No native views, gestures or phone performance."

  - id: recall-semver
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: which-part-grows
        from: js-15-04-install-lockfile-semver
        prompt:
          uk: "Планувальник версії `2.3.4` отримує новий екран зі статистикою, а все старе працює як раніше. Якою має бути наступна версія за semver?"
          en: "The planner at version `2.3.4` gets a new statistics screen, and everything old works as before. What should the next version be under semver?"
        answer:
          type: choice
          options:
            - id: minor
              text: { uk: "`2.4.0`", en: "`2.4.0`" }
            - id: patch
              text: { uk: "`2.3.5`", en: "`2.3.5`" }
              why:
                uk: "PATCH — для виправлень без нового. Новий екран — це нова можливість."
                en: "PATCH is for fixes with nothing new. A new screen is a new feature."
            - id: major
              text: { uk: "`3.0.0`", en: "`3.0.0`" }
              why:
                uk: "MAJOR кажуть тоді, коли старе може перестати працювати. Тут старе працює як раніше."
                en: "MAJOR says that old things may stop working. Here the old things work as before."
            - id: minor-keep
              text: { uk: "`2.4.4`", en: "`2.4.4`" }
              why:
                uk: "Коли зростає MINOR, PATCH повертається до нуля."
                en: "When MINOR grows, PATCH goes back to zero."
          correct: [minor]
        explanation:
          uk: "Нова можливість без поломок — MINOR, а PATCH скидається: `2.4.0`. Це текст `version` для людей. Номер збірки (`versionCode`, `buildNumber`) від semver не залежить: він просто зростає з кожною збіркою."
          en: "A new feature without breakage is MINOR, and PATCH resets: `2.4.0`. That is the `version` text for people. The build number (`versionCode`, `buildNumber`) does not follow semver: it simply grows with every build."

  - id: planner-releases
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: planner-releases
    entry: main.jsx
    editable: [releases.js]
    strings:
      title: { uk: "План release планувальника", en: "Planner release plan" }
      update: { uk: "Оновлення: поставиться поверх встановленої збірки", en: "Update: installs over the installed build" }
      sameBuild: { uk: "Відмова: такий номер збірки вже був", en: "Refused: this build number was already used" }
      lowerBuild: { uk: "Відмова: номер збірки менший, ніж у встановленої", en: "Refused: the build number is lower than the installed one" }
      separateApp: { uk: "Інший застосунок: стане поруч зі старим", en: "A different app: installs next to the old one" }
      incomplete: { uk: "Бракує ідентифікатора чи номера збірки", en: "An id or a build number is missing" }
    title:
      uk: "Перші два release планувальника"
      en: "The planner's first two releases"
    instructions:
      uk: |
        У `releases.js` заповни `first` і `second` — перші два release планувальника — у формі `app.json`:

        - ідентифікатор на обох платформах — `com.example.jsll.planner`;
        - до першого release команда вже надіслала в магазини збірки 1 і 2 для тестувальників (на обох платформах), і магазини їх пам’ятають; перший release для людей — версія `1.0.0`;
        - другий release лише виправляє помилку в підрахунку справ на сьогодні — нових можливостей немає; версію й номери збірки для нього визнач сам;
        - `android.versionCode` — ціле число, `ios.buildNumber` — текст із цифр (так їх очікує конфігурація Expo).

        Потім у `rules` напиши для кожного поля по одному рядку: що з ним можна робити від release до release. Перевірка бачить лише, що рядок є й він один, — порівняй свої правила з поясненням до розв’язку.

        Екран показує те саме, що й імітація з прикладу: що станеться, коли `second` отримають люди з `first`.
      en: |
        In `releases.js` fill in `first` and `second` — the planner's first two releases — in the shape of `app.json`:

        - the id on both platforms is `com.example.jsll.planner`;
        - before the first release the team already sent builds 1 and 2 to the stores for testers (on both platforms), and the stores remember them; the first release for people is version `1.0.0`;
        - the second release only fixes a bug in counting today's tasks — no new features; work out its version and build numbers yourself;
        - `android.versionCode` is a whole number, `ios.buildNumber` is text made of digits (that is how the Expo config expects them).

        Then in `rules` write one line for each field: what may happen to it from release to release. The check only sees that the line is there and that it is one line — compare your rules with the note to the solution.

        The screen shows the same as the simulation in the example: what happens when people who have `first` get `second`.
    testTitles:
      "the first release is 1.0.0, with build numbers above the testers builds":
        uk: "Перший release — `1.0.0`, а номери збірки більші за збірки тестувальників"
        en: "The first release is `1.0.0`, with build numbers above the testers' builds"
      "the second release keeps the app identity":
        uk: "Другий release зберігає ідентифікатор застосунку"
        en: "The second release keeps the app identity"
      "the bug-fix release shows users version 1.0.1":
        uk: "Release з виправленням показує людям версію `1.0.1`"
        en: "The bug-fix release shows users version `1.0.1`"
      "the second release ships as an update on both platforms":
        uk: "Другий release іде як оновлення на обох платформах"
        en: "The second release ships as an update on both platforms"
      "versionCode is a whole number and buildNumber is text of digits":
        uk: "`versionCode` — ціле число, `buildNumber` — текст із цифр"
        en: "`versionCode` is a whole number and `buildNumber` is text of digits"
      "every field has a one-line rule":
        uk: "Для кожного поля є правило в один рядок"
        en: "Every field has a one-line rule"
    hints:
      nudge:
        uk: "Запусти й подивись на два рядки екрана. Ідентифікатор відповідає на «хто це?», номер збірки — на «чи це новіше за все, що вже бачив магазин?», версія — на «що показати людям?»."
        en: "Run it and look at the two rows of the screen. The id answers “who is this?”, the build number “is this newer than everything the store has already seen?”, the version “what do people see?”."
      explanation:
        uk: |
          Магазин пам’ятає кожну надіслану збірку, і тестову теж, тож номер нової збірки має бути більшим за всі, що туди вже йшли. Для трекера звичок з ідентифікатором `com.example.jsll.habits`, у якого вийшла версія `2.3.0` зі збіркою 14, а потім ще збірка 15 пішла лише тестувальникам, наступний release з новою можливістю мав би версію `2.4.0`, `versionCode: 16` і `buildNumber: '16'`, а ідентифікатор — той самий. Зверни увагу на лапки: на Android номер збірки — число, на iOS — текст. Яку частину semver піднімає виправлення без нових можливостей, ти пригадав щойно.
        en: |
          A store remembers every build sent to it, test builds included, so a new build's number must be higher than all that went there before. For a habit tracker with the id `com.example.jsll.habits` that shipped version `2.3.0` with build 14, and then sent build 15 to testers only, the next release with a new feature would have version `2.4.0`, `versionCode: 16` and `buildNumber: '16'`, and the same id. Mind the quotes: on Android the build number is a number, on iOS it is text. Which part of semver a fix without new features raises, you have just recalled.
    solutionNote:
      uk: |
        Ідентифікатор однаковий в обох release — це один застосунок. Збірки 1 і 2 магазини вже бачили, тож перший release — збірка 3, а виправлення — збірка 4: магазини й Android бачать новішу збірку. Версія `1.0.1` — для людей: лише виправлення, тому зріс PATCH. Можливі правила:

        - `version` — для людей; зростає з кожним release за semver; ОС її не порівнює, а App Store Connect вимагає, щоб вона росла;
        - `android.package` і `ios.bundleIdentifier` — особа застосунку; після першого встановлення не змінюються ніколи;
        - `versionCode` — ціле число; кожна збірка, надіслана в магазин, отримує більше, інакше магазин відмовить;
        - `buildNumber` — цифри в лапках; кожна збірка, надіслана в магазин, отримує більший номер.

        Номер збірки може й «стрибнути» (з 3 на 10) — головне, щоб він лише зростав.
      en: |
        The id is the same in both releases — it is one app. The stores have already seen builds 1 and 2, so the first release is build 3 and the fix is build 4: the stores and Android see a newer build. The version `1.0.1` is for people: only a fix, so PATCH grew. Possible rules:

        - `version` — for people; grows with every release by semver; the OS does not compare it, and App Store Connect requires it to grow;
        - `android.package` and `ios.bundleIdentifier` — the app's identity; never change after the first install;
        - `versionCode` — a whole number; every build sent to the store gets a higher one, or the store refuses it;
        - `buildNumber` — digits in quotes; every build sent to the store gets a higher number.

        A build number may also “jump” (from 3 to 10) — what matters is that it only grows.
    feedback:
      - when: { test: "the first release is 1.0.0, with build numbers above the testers builds" }
        message:
          uk: "Ця перевірка чекає в `first` версію `'1.0.0'`, ідентифікатор `'com.example.jsll.planner'` в `android.package` і в `ios.bundleIdentifier`, а номери збірки — більші за 2: збірки 1 і 2 магазини вже бачили від тестувальників."
          en: "This check expects `first` to have version `'1.0.0'`, the id `'com.example.jsll.planner'` in `android.package` and in `ios.bundleIdentifier`, and build numbers above 2: the stores have already seen builds 1 and 2 from the testers."
      - when: { test: "the second release keeps the app identity" }
        message:
          uk: "Ця перевірка чекає в `second` той самий ідентифікатор `'com.example.jsll.planner'` на обох платформах. Інший ідентифікатор — це вже інший застосунок, навіть якщо змінилася лише одна літера."
          en: "This check expects `second` to have the same id `'com.example.jsll.planner'` on both platforms. Any other string is a different app, even if only one letter changed."
      - when: { test: "the bug-fix release shows users version 1.0.1" }
        message:
          uk: "Ця перевірка чекає `second.version` рівним `'1.0.1'` — текстом у лапках: виправлення без нових можливостей піднімає PATCH."
          en: "This check expects `second.version` to be `'1.0.1'` — text in quotes: a fix with no new features raises PATCH."
      - when: { test: "the second release ships as an update on both platforms" }
        message:
          uk: "Ця перевірка чекає, що на обох рядках екрана буде «Оновлення». Для цього ідентифікатор лишається тим самим, а номер збірки в `second` більший, ніж у `first`, — і на Android, і на iOS. Сама версія `1.0.1` для цього нічого не важить."
          en: "This check expects both rows of the screen to say “Update”. For that the id stays the same, and the build number in `second` is higher than in `first` — on Android and on iOS. The version `1.0.1` itself counts for nothing here."
      - when: { test: "versionCode is a whole number and buildNumber is text of digits" }
        message:
          uk: "Ця перевірка чекає в обох release `android.versionCode` як число без лапок (`2`), а `ios.buildNumber` — як текст у лапках, що складається з цифр (`'2'`)."
          en: "This check expects, in both releases, `android.versionCode` as a number without quotes (`2`) and `ios.buildNumber` as text in quotes made of digits (`'2'`)."
      - when: { test: "every field has a one-line rule" }
        message:
          uk: "Ця перевірка чекає непорожній текст у лапках для кожного з п’яти полів у `rules` — по одному реченню, без переносу рядка."
          en: "This check expects a non-empty string for each of the five fields in `rules` — one sentence each, with no line break."
      - when: { error: SyntaxError }
        message:
          uk: "Програма не змогла запуститися. Перевір коми між полями об’єкта й лапки навколо тексту в `releases.js`."
          en: "The program could not start. Check the commas between the object's fields and the quotes around text in `releases.js`."
    limits:
      uk: "Концептуальний перегляд через react-native-web, а не збірка. `simulated-store.js` лише застосовує задокументовані правила до об’єктів: магазину, телефона й встановлення тут немає, а підпис збірки не перевіряється. Справжні значення потраплять у native-файли лише після `npx expo prebuild` у твоєму проєкті."
      en: "A concept preview through react-native-web, not a build. `simulated-store.js` only applies the documented rules to objects: there is no store, no phone and no installation here, and the build's signature is not checked. Real values reach the native files only after `npx expo prebuild` in your project."

  - id: to-project
    kind: transfer
    capstoneStep: RN-11
    body:
      uk: "У проєктному кроці цього розділу ти заміниш тимчасовий ідентифікатор на власний для свого домену й задаси перший release: версію `1.0.0` і збірку 1. Наступна збірка, яку ти поставиш поверх неї, отримає вищий номер — а ідентифікатор лишиться тим самим."
      en: "In this unit's project step you will replace the placeholder id with your own for your domain and set the first release: version `1.0.0` and build 1. The next build you install over it gets a higher number — while the id stays the same."
