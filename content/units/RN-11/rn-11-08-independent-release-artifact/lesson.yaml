id: rn-11-08-independent-release-artifact
unit: RN-11
title:
  uk: "Самостійно: release-артефакт і нотатки з відновлення"
  en: "Independent: release artifact and recovery notes"
kind: assessment
minutes: 40
contentVersion: 1
purpose:
  uk: "Перевірити, що ти без підказок випускаєш native-застосунок: перевіряєш кандидата в release за ідентифікатором, номером, підписом і вмістом, знаєш, що може прийти без нової збірки, а потім сам збираєш, ставиш як оновлення й описуєш release незнайомого застосунку — разом з приватністю, відкатом і другою платформою, без облікового запису в магазині."
  en: "To check that you release a native app without hints: you check a release candidate by its id, number, signature and contents, you know what can arrive without a new build, and then you build, install as an update and document the release of an unfamiliar app yourself — including privacy, rollback and the other platform, without a store account."
objectives:
  - uk: "Без підказок зібрати підписаний release-артефакт наданого синтетичного застосунку для заявленої цілі, встановити й перевірити його та написати нотатки про оновлення й відкат."
    en: "Produce, without hints, a signed release artifact of a supplied synthetic app for the declared target, install and test it, and write its update and rollback notes."
  - uk: "Пояснити обмеження підпису й розповсюдження іншої платформи за наданими артефактами, без платного облікового запису й завантаження в магазин."
    en: "Explain the other platform's signing and distribution constraints from supplied artifacts, without a paid account or a store upload."
prerequisites: [rn-11-07-debug-release-build-failure]
subskills:
  - { family: N-11, skill: "build artifacts", depth: assess }
  - { family: N-11, skill: "distribution/store/update/privacy basics", depth: assess }
  - { family: N-11, skill: "compatibility and rollback limitations", depth: assess }
glossary: []
selfCheck: [release-gate]

blocks:
  - id: what-is-checked
    kind: explanation
    title:
      uk: "Що перевіряється"
      en: "What is checked"
    body:
      uk: |
        Тема — синтетичний застосунок «позики в бібліотеці», якого не було в уроках. Підказок немає: користуйся тим, що вивчив у цьому розділі.

        Дві частини:

        1. **У курсі** — «ворота release»: функція, що читає встановлену збірку й кандидата та каже, що з кандидатом не так, і функція, що вирішує, як доставити набір змін. Автоматичні перевірки.
        2. **На заявленій цілі** — release цього застосунку: збірка 1, потім збірка 2 як оновлення, перевірка артефакту й release-нотатка. Якщо native-інструментів немає, другу частину можна позначити як не виконану.
      en: |
        The topic is a synthetic “library loans” app that did not appear in the lessons. There are no hints: use what you learned in this unit.

        Two parts:

        1. **In the course** — a “release gate”: a function that reads the installed build and a candidate and says what is wrong with the candidate, and a function that decides how to deliver a set of changes. Automatic checks.
        2. **On your declared target** — a release of this app: build 1, then build 2 as an update, an artifact check and a release note. With no native tooling, the second part can be marked as not performed.

  - id: release-gate
    kind: exercise
    mode: independent
    assessment: true
    runtime: concept-preview
    dir: release-gate
    entry: main.jsx
    editable: [release-gate.js]
    strings:
      title: { uk: "Ворота release", en: "Release gate" }
      noProblems: { uk: "Проблем немає", en: "No problems" }
      leftBehind: { uk: "Лишаються на встановленій збірці (Android API)", en: "Stay on the installed build (Android API)" }
      delivery: { uk: "Зміна тексту й зображення", en: "A text and image change" }
      heading: { uk: "Позики в бібліотеці", en: "Library loans" }
      overdue: { uk: "Прострочено", en: "Overdue" }
    title:
      uk: "Ворота release для «позик у бібліотеці»"
      en: "A release gate for “library loans”"
    instructions:
      uk: |
        `candidates.js` описує встановлену збірку застосунку й двох кандидатів, як їх прочитано з артефактів. У `release-gate.js` напиши дві функції.

        **`releaseCheck(installed, candidate)`** повертає `{ problems, leftBehindApis }`.

        `problems` — коди в **такому порядку** (лише ті, що стосуються кандидата):

        | Код | Коли |
        |---|---|
        | `'id-changed'` | `id` кандидата інший |
        | `'version-not-higher'` | `versionCode` кандидата не більший за встановлений |
        | `'signer-differs'` | `signer` інший |
        | `'debuggable'` | `debuggable` дорівнює `true` |
        | `'cleartext'` | `usesCleartextTraffic` дорівнює `true` |
        | `'dev-code-in-bundle'` | хоч один рядок `bundleStrings` містить `[dev]` |
        | `'secret-in-bundle'` | хоч один рядок `bundleStrings` містить `secret`, `password` чи `sk_live_` (великі й малі літери однаково) |

        `leftBehindApis` — рівні Android API, з якими можна було встановити попередню збірку, але не можна кандидата: від `installed.minAndroidApi` до `candidate.minAndroidApi`, без нього самого, за зростанням. Якщо мінімум не піднято — `[]`.

        **`deliveryPath(changes)`** отримує масив змін `{ kind }` (`'js'`, `'asset'`, `'icon'`, `'permission'`, `'native-module'`) і повертає `'over-the-air'`, якщо всі зміни можна доставити без нової збірки, `'new-build'` — якщо ні, і `'nothing'` для порожнього масиву.
      en: |
        `candidates.js` describes the app's installed build and two candidates, as read back from their artifacts. Write two functions in `release-gate.js`.

        **`releaseCheck(installed, candidate)`** returns `{ problems, leftBehindApis }`.

        `problems` are codes in **this order** (only those that apply to the candidate):

        | Code | When |
        |---|---|
        | `'id-changed'` | the candidate's `id` differs |
        | `'version-not-higher'` | the candidate's `versionCode` is not higher than the installed one |
        | `'signer-differs'` | the `signer` differs |
        | `'debuggable'` | `debuggable` is `true` |
        | `'cleartext'` | `usesCleartextTraffic` is `true` |
        | `'dev-code-in-bundle'` | at least one `bundleStrings` entry contains `[dev]` |
        | `'secret-in-bundle'` | at least one `bundleStrings` entry contains `secret`, `password` or `sk_live_` (in any letter case) |

        `leftBehindApis` are the Android API levels that could install the previous build but cannot install the candidate: from `installed.minAndroidApi` up to `candidate.minAndroidApi`, without the latter, in ascending order. If the minimum was not raised: `[]`.

        **`deliveryPath(changes)`** gets an array of changes `{ kind }` (`'js'`, `'asset'`, `'icon'`, `'permission'`, `'native-module'`) and returns `'over-the-air'` if every change can be delivered without a new build, `'new-build'` if not, and `'nothing'` for an empty array.
    testTitles:
      "a clean candidate passes with no problems":
        uk: "Чистий кандидат проходить без проблем"
        en: "A clean candidate passes with no problems"
      "the identity and the version code are checked":
        uk: "Перевіряються ідентифікатор і `versionCode`"
        en: "The identity and the `versionCode` are checked"
      "a different signer is a problem":
        uk: "Інший підписувач — проблема"
        en: "A different signer is a problem"
      "debug leftovers in the artifact are problems":
        uk: "Залишки debug в артефакті — проблеми"
        en: "Debug leftovers in the artifact are problems"
      "several problems are reported in the stated order":
        uk: "Кілька проблем — у заданому порядку"
        en: "Several problems are reported in the stated order"
      "Android versions below a raised minimum are listed as left behind":
        uk: "Версії Android нижче піднятого мінімуму названо"
        en: "Android versions below a raised minimum are listed as left behind"
      "only JavaScript and asset changes can go over the air":
        uk: "Без нової збірки — лише JavaScript і ресурси"
        en: "Only JavaScript and asset changes can go over the air"
    solutionNote:
      uk: "Ворота читають артефакт, а не вихідний код: ідентифікатор і номер вирішують «той самий і новіший», підписувач — «від того самого автора», а рядки bundle й прапорці маніфесту показують, чи не потрапили в release debug-залишки й секрети. `versionCode`, рівний встановленому, — теж проблема: це не оновлення. Піднятий мінімум не блокує release, але назавжди лишає частину людей на попередній збірці, тож його треба назвати. А іконка й дозволи — native-шар: без нової збірки їх не доставиш."
      en: "The gate reads the artifact, not the source: the id and the number decide “the same and newer”, the signer “from the same author”, and the bundle strings and manifest flags show whether debug leftovers and secrets got into the release. A `versionCode` equal to the installed one is a problem too: it is not an update. A raised minimum does not block the release, but it leaves some people on the previous build for good, so it has to be named. And the icon and permissions are the native layer: they cannot be delivered without a new build."
    limits:
      uk: "Концептуальний перегляд через react-native-web. Кандидати — синтетичні записи, начебто прочитані з артефактів; справжнього APK, маніфесту, підпису й магазину тут немає, а `bundleStrings` — лише вибірка рядків, не весь bundle."
      en: "A concept preview through react-native-web. The candidates are synthetic records as if read back from artifacts; there is no real APK, manifest, signature or store here, and `bundleStrings` is only a sample of strings, not the whole bundle."

  - id: recall-device-checks
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: mock-cannot-prove
        from: rn-07-03-mocks-vs-device-checks
        prompt:
          uk: "Усі тести застосунку зелені, а native-модуль сховища в них замінено mock-ом. Що з цього тести **не** доводять, тож це треба перевірити на заявленій цілі?"
          en: "All of the app's tests are green, and the native storage module is replaced with a mock in them. Which of these do the tests **not** prove, so it must be checked on the declared target?"
        answer:
          type: choice
          options:
            - id: restart
              text:
                uk: "Що дані переживають перезапуск і оновлення встановленої збірки"
                en: "That the data survives a restart and an update of the installed build"
            - id: contract
              text:
                uk: "Що код викликає модуль сховища з правильними аргументами"
                en: "That the code calls the storage module with the right arguments"
              why:
                uk: "Саме це mock і доводить: контракт виклику видно в тесті."
                en: "That is exactly what the mock proves: the call contract is visible in the test."
            - id: errors
              text:
                uk: "Що помилку читання показано людині"
                en: "That a read error is shown to the person"
              why:
                uk: "Mock може повернути помилку, і тест побачить, що з’явилося на екрані. Це перевірка коду, а не пристрою."
                en: "A mock can return an error, and the test sees what appeared on the screen. That checks the code, not the device."
          correct: [restart]
        explanation:
          uk: "Справжнє сховище, перезапуск і встановлення поверх старої збірки існують лише на пристрої. Тому смоук-перевірка release включає перезапуск і оновлення, а не лише перший запуск."
          en: "Real storage, a restart and an install over the old build exist only on the device. That is why a release smoke check includes a restart and an update, not only the first start."

  - id: on-target
    kind: local-task
    runtime: local-native
    title:
      uk: "Release «позик у бібліотеці» на заявленій цілі"
      en: "A release of “library loans” on your declared target"
    intro:
      uk: |
        Без підказок. Нижче — наданий застосунок і вимоги; як їх виконати, вирішуєш ти, спираючись на уроки цього розділу.

        **Що перевірено під час підготовки уроку:** файли застосунку проходять `npx tsc --noEmit` у проєкті з шаблону `blank-typescript@sdk-57` (Expo SDK 57, React Native 0.86.3), а `npx expo prebuild --platform android` і `npx expo prebuild --platform ios --no-install` згенерували native-файли на комп’ютері без Android SDK і без Xcode. Збирання, встановлення й перевірку артефакту не перевірено.

        Якщо native-інструментів немає, натисни **«У мене немає емулятора чи пристрою»**.

        **`loans.json`:**

        ```json
        [
          { "id": "l-01", "title": "Мова JavaScript", "due": "2026-02-27" },
          { "id": "l-02", "title": "Атлас зоряного неба", "due": "2026-03-05" },
          { "id": "l-03", "title": "Збірка оповідань", "due": "2026-03-01" }
        ]
        ```

        **`App.tsx`:**

        ```tsx
        // RN-11 assessment app: book loans from the bundled loans.json.
        import { StyleSheet, Text, View } from 'react-native';
        import loans from './loans.json';

        const TODAY = '2026-03-02'; // a fixed day, so every build shows the same count
        const overdue = loans.filter((loan) => loan.due < TODAY).length;

        export default function App() {
          return (
            <View style={styles.screen}>
              <Text style={styles.heading}>Позики в бібліотеці</Text>
              {loans.map((loan) => <Text key={loan.id}>{loan.title} — {loan.due}</Text>)}
              <Text style={styles.total}>Прострочено на {TODAY}: {overdue}</Text>
            </View>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, paddingTop: 64, paddingHorizontal: 16, gap: 8, backgroundColor: '#ffffff' },
          heading: { fontSize: 20, fontWeight: '600' },
          total: { marginTop: 8, fontWeight: '600' },
        });
        ```

        **Вимоги:**

        - новий проєкт `~/js-course/rn11-loans` з шаблону `blank-typescript@sdk-57`; ідентифікатор `com.example.jsll.loans` на обох платформах;
        - збірка 1: версія `1.0.0`; збірка 2: четверта позика в `loans.json` (вигадай її сам) і правильні номери;
        - release підписано твоїм ключем; ключ і паролі — поза репозиторієм (для цілі I — збірка Release для симулятора);
        - збірку 2 встановлено **поверх** збірки 1 як оновлення, без видалення;
        - у репозиторії `RELEASE.md` з розділами нижче й закомічена історія; жодного ключа чи пароля.

        **Розділи `RELEASE.md`:**

        ```text
        # Library loans — release notes
        ## Artifact evidence (build 1 and build 2)
        ## Smoke checklist (first start, restart, update over build 1, dev server stopped)
        ## Privacy declaration (one line per piece of data)
        ## Update path (what could change over the air, what needs a new build)
        ## Rollback limits (what you would do if build 2 were bad)
        ## The other platform (from its generated files: ids, versions, signing, distribution)
        ```
      en: |
        No hints. Below are the supplied app and the requirements; how to meet them is your decision, based on this unit's lessons.

        **What was checked while preparing this lesson:** the app's files pass `npx tsc --noEmit` in a project from the `blank-typescript@sdk-57` template (Expo SDK 57, React Native 0.86.3), and `npx expo prebuild --platform android` and `npx expo prebuild --platform ios --no-install` generated the native files on a computer with neither the Android SDK nor Xcode. Building, installing and the artifact check were not checked.

        If you have no native tooling, press **“I have no emulator or device”**.

        **`loans.json`:**

        ```json
        [
          { "id": "l-01", "title": "The JavaScript Language", "due": "2026-02-27" },
          { "id": "l-02", "title": "A Star Atlas", "due": "2026-03-05" },
          { "id": "l-03", "title": "Collected Short Stories", "due": "2026-03-01" }
        ]
        ```

        **`App.tsx`:**

        ```tsx
        // RN-11 assessment app: book loans from the bundled loans.json.
        import { StyleSheet, Text, View } from 'react-native';
        import loans from './loans.json';

        const TODAY = '2026-03-02'; // a fixed day, so every build shows the same count
        const overdue = loans.filter((loan) => loan.due < TODAY).length;

        export default function App() {
          return (
            <View style={styles.screen}>
              <Text style={styles.heading}>Library loans</Text>
              {loans.map((loan) => <Text key={loan.id}>{loan.title} — {loan.due}</Text>)}
              <Text style={styles.total}>Overdue on {TODAY}: {overdue}</Text>
            </View>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, paddingTop: 64, paddingHorizontal: 16, gap: 8, backgroundColor: '#ffffff' },
          heading: { fontSize: 20, fontWeight: '600' },
          total: { marginTop: 8, fontWeight: '600' },
        });
        ```

        **Requirements:**

        - a new project `~/js-course/rn11-loans` from the `blank-typescript@sdk-57` template; the id `com.example.jsll.loans` on both platforms;
        - build 1: version `1.0.0`; build 2: a fourth loan in `loans.json` (make it up yourself) and the right numbers;
        - the release is signed with your key; the key and passwords are outside the repository (for target I: a Release build for the simulator);
        - build 2 is installed **over** build 1 as an update, without uninstalling;
        - the repository has `RELEASE.md` with the sections below and a committed history; no key and no password.

        **Sections of `RELEASE.md`:**

        ```text
        # Library loans — release notes
        ## Artifact evidence (build 1 and build 2)
        ## Smoke checklist (first start, restart, update over build 1, dev server stopped)
        ## Privacy declaration (one line per piece of data)
        ## Update path (what could change over the air, what needs a new build)
        ## Rollback limits (what you would do if build 2 were bad)
        ## The other platform (from its generated files: ids, versions, signing, distribution)
        ```
    tools:
      - { name: "Expo SDK", version: "57 (React Native 0.86)" }
      - { name: "Declared target", version: "from RN-01" }
      - { name: "Your keystore", version: { uk: "з уроку про артефакти збірки чи новий", en: "from the build-artifacts lesson or a new one" }, note: { uk: "поза репозиторієм", en: "outside the repository" } }
    steps:
      - text:
          uk: "Створи проєкт, додай файли й ідентифікатори та підготуй підпис release — так, як вирішиш сам."
          en: "Create the project, add the files and the ids, and set up release signing — the way you decide."
        command: "cd ~/js-course\nnpx create-expo-app@latest rn11-loans --template blank-typescript@sdk-57 --no-agents-md"
      - text:
          uk: "Збери, встав і перевір збірку 1; запиши докази в `RELEASE.md`."
          en: "Build, install and check build 1; record the evidence in `RELEASE.md`."
      - text:
          uk: "Підготуй збірку 2, встав її поверх збірки 1 як оновлення й повтори перевірку, разом з перезапуском."
          en: "Prepare build 2, install it over build 1 as an update and repeat the check, restart included."
      - text:
          uk: "Згенеруй native-файли другої платформи (iOS-файли можна згенерувати з `--no-install` і без Xcode) і опиши її в останньому розділі. Самих файлів не коміть: шаблон ігнорує `/ios` і `/android`."
          en: "Generate the other platform's native files (the iOS files can be generated with `--no-install` and without Xcode) and describe it in the last section. Do not commit the files themselves: the template ignores `/ios` and `/android`."
      - text:
          uk: "Допиши `RELEASE.md`, переконайся, що в репозиторії немає ключа й пароля, і закоміть."
          en: "Finish `RELEASE.md`, make sure the repository has no key and no password, and commit."
    verify:
      - id: two-builds
        text:
          uk: "Збірки 1 і 2 зібрано й підписано моїм ключем; збірка 2 стала оновленням збірки 1 на заявленій цілі."
          en: "Builds 1 and 2 are built and signed with my key; build 2 became an update of build 1 on my declared target."
      - id: smoke
        text:
          uk: "Смоук-перевірку виконано на кожній збірці: перший запуск, перезапуск, вимкнений dev-сервер; кількість прострочених збігається з очікуваною."
          en: "The smoke check ran on each build: first start, restart, dev server stopped; the overdue count matches the expected one."
      - id: release-note
        text:
          uk: "`RELEASE.md` має всі шість розділів, зокрема декларацію приватності, межі відкату й другу платформу."
          en: "`RELEASE.md` has all six sections, including the privacy declaration, the rollback limits and the other platform."
      - id: no-secrets
        text:
          uk: "У репозиторії немає ні keystore, ні паролів (перевірено `git grep` і `git status`)."
          en: "The repository has neither a keystore nor passwords (checked with `git grep` and `git status`)."
    troubleshooting:
      - problem:
          uk: "Збірка 2 не ставиться поверх збірки 1"
          en: "Build 2 does not install over build 1"
        fix:
          uk: "Пройди ті самі ворота, що й у першій частині: ідентифікатор, номер збірки, підписувач — і запиши в `RELEASE.md`, котрий з них не збігся. Видалення збірки 1 — не розв’язок: людям ти його не запропонуєш."
          en: "Go through the same gate as in the first part: the id, the build number, the signer — and write down in `RELEASE.md` which of them did not match. Uninstalling build 1 is not a solution: you could not offer that to people."
      - problem:
          uk: "`npx expo prebuild --platform ios` зупиняється на встановленні CocoaPods (наприклад, не на macOS)"
          en: "`npx expo prebuild --platform ios` stops at installing CocoaPods (for example, not on macOS)"
        fix:
          uk: "Для опису платформи залежності не потрібні: `npx expo prebuild --platform ios --no-install` генерує лише файли. Ми запускали цю команду на macOS без Xcode; на Windows і Linux її не перевіряли."
          en: "Describing the platform does not need the dependencies: `npx expo prebuild --platform ios --no-install` generates only the files. We ran this command on macOS without Xcode; it was not checked on Windows and Linux."
    recovery:
      uk: "Проєкт новий і окремий: якщо щось заплуталося, теку `rn11-loans` можна видалити й створити знову, а встановлений застосунок прибрати з цілі (`adb uninstall com.example.jsll.loans`). Keystore поза проєктом від цього не залежить — не видаляй його разом з проєктом."
      en: "The project is new and separate: if things get tangled, the `rn11-loans` folder can be deleted and created again, and the installed app removed from the target (`adb uninstall com.example.jsll.loans`). The keystore outside the project does not depend on it — do not delete it together with the project."
