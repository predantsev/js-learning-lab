id: rn-01-06-debug-setup-failure
unit: RN-01
title:
  uk: "Налагодження: навмисно зламане середовище"
  en: "Debug: a seeded environment failure"
kind: local-task
minutes: 20
contentVersion: 1
purpose:
  uk: "Native-проєкт ламається не лише через код: версія пакета, яка не пасує до Expo SDK, чи dev-сервер не на тому порту дають помилки, що виглядають загадково. Ти сам зламаєш hello-проєкт двома такими змінами, запишеш точний вивід інструментів, полагодиш обидві причини задокументованим способом і знову запустиш екран на своїй заявленій цілі."
  en: "A native project breaks not only because of code: a package version that does not match the Expo SDK, or a dev server on the wrong port, produce errors that look mysterious. You break the hello project yourself with two such changes, record the tools' exact output, repair both causes the documented way and run the screen on your declared target again."
objectives:
  - uk: "Діагностувати навмисно внесений збій середовища — непідтримувану версію пакета й недосяжний dev-сервер — за справжнім виводом інструментів, а не навздогад."
    en: "Diagnose a seeded environment failure — an unsupported version pin and an unreachable dev server — from the actual error output rather than by guessing."
  - uk: "Полагодити його, знову запустити hello-екран на заявленій цілі й записати, що змінилося."
    en: "Repair it, re-run the hello screen on the declared target and record what changed."
prerequisites: [rn-01-05-hello-screen]
subskills:
  - { family: N-01, skill: "environment/version support and debug vs release", depth: assess }
glossary: []
selfCheck: [predict-repair-pin]

blocks:
  - id: who-complains
    kind: explanation
    title:
      uk: "Хто скаржиться і на що"
      en: "Who complains, and about what"
    body:
      uk: |
        Expo SDK — це набір версій, перевірених разом: SDK 57 очікує саме `react-native` 0.86.3 (так записав шаблон). Інша версія, навіть новіша, — непідтримана пара. Expo має два інструменти, які це бачать:

        - `npx expo install --check` порівнює встановлені версії з тими, що очікує SDK, і називає кожну розбіжність;
        - `npx expo-doctor` проганяє ширший набір перевірок проєкту.

        Dev-сервер перевіряють з комп’ютера: Metro відповідає на адресу `/status`. `curl -sS http://localhost:8081/status` надрукує `packager-status:running`, якщо сервер слухає цей порт, і `curl: (7) Failed to connect …`, якщо ні.

        Порядок той самий, що й у розділі про інструменти: **спершу записати** кожне повідомлення, потім лагодити по одній причині й перевіряти тією самою командою. І лише задокументованим способом: версії під SDK вирівнює `npx expo install --fix`, а застарілий кеш bundler’а чистить `npx expo start --clear`.
      en: |
        An Expo SDK is a set of versions tested together: SDK 57 expects exactly `react-native` 0.86.3 (that is what the template wrote). Any other version, even a newer one, is an unsupported pair. Expo has two tools that see this:

        - `npx expo install --check` compares the installed versions with those the SDK expects and names every mismatch;
        - `npx expo-doctor` runs a wider set of project checks.

        The dev server is checked from the computer: Metro answers at the address `/status`. `curl -sS http://localhost:8081/status` prints `packager-status:running` if the server listens on that port, and `curl: (7) Failed to connect …` if not.

        The order is the same as in the tooling unit: **first write down** every message, then repair one cause at a time and check with the same command. And only the documented way: `npx expo install --fix` aligns versions with the SDK, and `npx expo start --clear` clears the bundler's stale cache.

  - id: recall-record-first
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: first-move
        from: js-15-13-debug-broken-setup
        prompt:
          uk: "Колега отримав від тебе проєкт, і в нього `npm start` падає з довгим повідомленням. Він пропонує одразу видалити `node_modules` і `package-lock.json` та встановити все наново. Що зробити насамперед?"
          en: "A colleague got the project from you, and `npm start` fails for them with a long message. They suggest deleting `node_modules` and `package-lock.json` right away and installing everything anew. What do you do first?"
        answer:
          type: choice
          options:
            - id: record
              text:
                uk: "Записати повідомлення повністю й з’ясувати, хто скаржиться і на що, нічого не змінюючи"
                en: "Write down the full message and work out who complains about what, without changing anything"
            - id: delete
              text:
                uk: "Видалити обидва й перевстановити: це лагодить більшість проблем"
                en: "Delete both and reinstall: that fixes most problems"
              why:
                uk: "Так губиться перше повідомлення, яке точно каже, що не так. А видалений lockfile ще й прибирає зафіксовані версії."
                en: "That loses the first message, which says exactly what is wrong. And a deleted lockfile also throws away the pinned versions."
            - id: force
              text:
                uk: "Запустити `npm install --force`"
                en: "Run `npm install --force`"
              why:
                uk: "`--force` змушує npm ігнорувати конфлікти — він ховає причину, а не прибирає її."
                en: "`--force` makes npm ignore conflicts — it hides the cause instead of removing it."
          correct: [record]
        explanation:
          uk: "Перше повідомлення — найцінніше: у ньому назва script, версія, файл чи змінна. Записавши його, лагодь по одній причині й перевіряй тією самою командою."
          en: "The first message is the most valuable: it holds a script name, a version, a file or a variable. Once it is written down, repair one cause at a time and check with the same command."

  - id: predict-repair-pin
    kind: prediction
    prompt:
      uk: "У проєкті на Expo SDK 57 команда `npx expo install --check` надрукувала `react-native@0.79.2 - expected version: 0.86.3`. Що з цього правильно її лагодить?"
      en: "In an Expo SDK 57 project the command `npx expo install --check` printed `react-native@0.79.2 - expected version: 0.86.3`. Which of these repairs it correctly?"
    runnable: false
    answer:
      type: choice
      options:
        - id: expo-fix
          code: "npx expo install --fix"
        - id: latest
          code: "npm install react-native@latest"
          why:
            uk: "`latest` — це найновіший React Native, а не той, що пасує до SDK. Коли урок перевіряли, `latest` був 0.87.1, тобто знову не 0.86.3."
            en: "`latest` is the newest React Native, not the one that matches the SDK. When this lesson was checked, `latest` was 0.87.1 — again not 0.86.3."
        - id: reinstall
          code: "rm -rf node_modules && npm install"
          why:
            uk: "У `package.json` лишається `0.79.2`, тож npm встановить ту саму неправильну версію ще раз."
            en: "`package.json` still says `0.79.2`, so npm installs the same wrong version again."
        - id: audit-force
          code: "npm audit fix --force"
          why:
            uk: "`npm audit` дбає про вразливості, а не про сумісність із SDK, а `--force` дозволяє зміни, що ламають сумісність."
            en: "`npm audit` cares about vulnerabilities, not SDK compatibility, and `--force` allows breaking changes."
      correct: [expo-fix]
    explanation:
      uk: "`npx expo install --fix` встановлює для кожного пакета ту версію, яку очікує встановлений Expo SDK. У нашій перевірці він надрукував `› Installing 1 SDK 57.0.0 compatible native module using npm` і повернув у `package.json` `\"react-native\": \"0.86.3\"`."
      en: "`npx expo install --fix` installs, for every package, the version the installed Expo SDK expects. In our check it printed `› Installing 1 SDK 57.0.0 compatible native module using npm` and put `\"react-native\": \"0.86.3\"` back into `package.json`."

  - id: seeded-failure
    kind: local-task
    runtime: local-native
    title:
      uk: "Зламай, запиши, полагодь"
      en: "Break it, record it, repair it"
    intro:
      uk: |
        Працюєш у `~/js-course/rn-hello` з уроку про hello-екран. Якщо цієї теки немає, створи її кроками 1–3 того уроку. Потрібен інтернет (npm завантажить іншу версію React Native).

        Усі команди на комп’ютері виконано на macOS з Node.js v25.2.1, npm 11.6.2, expo 57.0.26 і expo-doctor 1.20.4 — їхній вивід нижче справжній. Кроки на цілі (5 і 9) там виконати не було на чому: що покаже Expo Go, перевір сам і запиши дослівно.

        Збережи вивід кожного кроку у файл `~/js-course/rn-hello/DEBUG-NOTES.md` — команду й те, що вона надрукувала.

        **Крок 4 — що надрукував `npm start` після змін (уривок):**

        ```text
        > rn-hello@1.0.0 start
        > expo start --port 8090
        …
        › Metro: exp://192.168.0.201:8090
        ```

        Рядок `1 package may need updating. Run npx expo install --check for details.` ми бачили, коли Metro запускали без інтерактивного терміналу; у твоєму терміналі він може з’явитися не одразу або не з’явитися зовсім.

        **Крок 6 — `npx expo install --check`:**

        ```text
        The following packages should be updated for best compatibility with the installed expo version:
          react-native@0.79.2 - expected version: 0.86.3
        Your project may not work correctly until you install the expected versions of the packages.
        Found outdated dependencies
        ```

        **Крок 6 — `npx expo-doctor` (уривок):**

        ```text
        Running 21 checks on your project...
        20/21 checks passed. 1 checks failed. Possible issues detected:
        …
        ✖ Check that packages match versions required by installed Expo SDK

        ⚠️ Minor version mismatches
        package       expected  found
        react-native  0.86.3    0.79.2
        …
        ```

        **Крок 7 — два порти, поки працює `npm start`:**

        ```text
        $ curl -sS http://localhost:8081/status
        curl: (7) Failed to connect to localhost port 8081 after 0 ms: Couldn't connect to server
        $ curl -sS http://localhost:8090/status
        packager-status:running
        ```
      en: |
        You work in `~/js-course/rn-hello` from the hello screen lesson. If that folder does not exist, create it with steps 1–3 of that lesson. You need internet access (npm downloads another React Native version).

        All computer-side commands were run on macOS with Node.js v25.2.1, npm 11.6.2, expo 57.0.26 and expo-doctor 1.20.4 — their output below is real. The steps on the target (5 and 9) could not be run there for lack of a target: check what Expo Go shows yourself and write it down word for word.

        Save the output of every step into the file `~/js-course/rn-hello/DEBUG-NOTES.md` — the command and what it printed.

        **Step 4 — what `npm start` printed after the changes (an excerpt):**

        ```text
        > rn-hello@1.0.0 start
        > expo start --port 8090
        …
        › Metro: exp://192.168.0.201:8090
        ```

        The line `1 package may need updating. Run npx expo install --check for details.` was seen when Metro ran without an interactive terminal; in your terminal it may appear later or not at all.

        **Step 6 — `npx expo install --check`:**

        ```text
        The following packages should be updated for best compatibility with the installed expo version:
          react-native@0.79.2 - expected version: 0.86.3
        Your project may not work correctly until you install the expected versions of the packages.
        Found outdated dependencies
        ```

        **Step 6 — `npx expo-doctor` (an excerpt):**

        ```text
        Running 21 checks on your project...
        20/21 checks passed. 1 checks failed. Possible issues detected:
        …
        ✖ Check that packages match versions required by installed Expo SDK

        ⚠️ Minor version mismatches
        package       expected  found
        react-native  0.86.3    0.79.2
        …
        ```

        **Step 7 — the two ports while `npm start` is running:**

        ```text
        $ curl -sS http://localhost:8081/status
        curl: (7) Failed to connect to localhost port 8081 after 0 ms: Couldn't connect to server
        $ curl -sS http://localhost:8090/status
        packager-status:running
        ```
    tools:
      - { name: "rn-hello", note: { uk: "проєкт з уроку про hello-екран, усе закомічено", en: "the project from the hello screen lesson, everything committed" } }
      - { name: "Expo SDK", version: "57" }
      - { name: "expo-doctor", version: "1.20.4", note: { uk: "запускається через npx, окремо не встановлюється", en: "runs through npx, no separate install" } }
      - { name: "curl", note: { uk: "є в macOS, Linux і Windows 10/11", en: "ships with macOS, Linux and Windows 10/11" } }
    steps:
      - text:
          uk: "Перейди в проєкт і переконайся, що все закомічено: тоді `git diff` потім покаже рівно твій ремонт."
          en: "Go into the project and make sure everything is committed: then `git diff` will later show exactly your repair."
        command: "cd ~/js-course/rn-hello\ngit status"
        expect:
          uk: "`nothing to commit, working tree clean`. Якщо ні — спершу закоміть свої зміни."
          en: "`nothing to commit, working tree clean`. If not, commit your changes first."
      - text:
          uk: "Внеси навмисні збої: закріпи непідтримувану версію React Native і перенеси dev-сервер на порт 8090. `npm pkg set` змінює `package.json` і нічого не друкує."
          en: "Seed the failures: pin an unsupported React Native version and move the dev server to port 8090. `npm pkg set` changes `package.json` and prints nothing."
        command: "npm pkg set dependencies.react-native=0.79.2 scripts.start=\"expo start --port 8090\"\nnpm install"
        expect:
          uk: "Вивід `npm install` (додані й прибрані пакети, рядок про вразливості). `grep react-native package.json` тепер показує `\"react-native\": \"0.79.2\"`."
          en: "The `npm install` output (packages added and removed, a line about vulnerabilities). `grep react-native package.json` now shows `\"react-native\": \"0.79.2\"`."
      - text:
          uk: "Закоміть зламаний стан, щоб відрізнити його від ремонту."
          en: "Commit the broken state so it can be told apart from the repair."
        command: "git commit -am \"Seed a broken native setup\""
      - text:
          uk: "Запусти dev-сервер і запиши в `DEBUG-NOTES.md`, на якому порту він слухає (рядок `› Metro: …`) і чи є рядок про пакети, що потребують оновлення."
          en: "Start the dev server and write in `DEBUG-NOTES.md` which port it listens on (the `› Metro: …` line) and whether there is a line about packages that need updating."
        command: "npm start"
        expect:
          uk: "Як у кроці 4 вступу: `> expo start --port 8090` і `› Metro: exp://<твоя IP-адреса>:8090`."
          en: "As in step 4 of the intro: `> expo start --port 8090` and `› Metro: exp://<your IP address>:8090`."
      - text:
          uk: "На цілі відкрий Expo Go і запусти проєкт **зі списку нещодавно відкритих** — той запис, що лишився з уроку про hello-екран (з портом 8081). Запиши дослівно, що покаже Expo Go."
          en: "On the target open Expo Go and start the project **from the recently opened list** — the entry left from the hello screen lesson (with port 8081). Write down word for word what Expo Go shows."
        expect:
          uk: "Застосунок не може дістатися dev-сервера: на порту 8081 ніхто не слухає. Точний текст помилки в Expo Go тут не перевірено — запиши свій."
          en: "The app cannot reach the dev server: nothing listens on port 8081. The exact error text in Expo Go was not checked here — write down yours."
      - text:
          uk: "У **другому** терміналі (перший зайнятий `npm start`) перейди в `rn-hello` і запусти обидві перевірки версій. Запиши їхній вивід."
          en: "In a **second** terminal (the first is busy with `npm start`) go into `rn-hello` and run both version checks. Write down their output."
        command: "npx expo install --check\nnpx expo-doctor"
        expect:
          uk: "Як у кроці 6 вступу: `react-native@0.79.2 - expected version: 0.86.3` і `✖ Check that packages match versions required by installed Expo SDK`."
          en: "As in step 6 of the intro: `react-native@0.79.2 - expected version: 0.86.3` and `✖ Check that packages match versions required by installed Expo SDK`."
      - text:
          uk: "У тому самому другому терміналі перевір, який порт відповідає як Metro."
          en: "In the same second terminal check which port answers as Metro."
        command: "curl -sS http://localhost:8081/status\ncurl -sS http://localhost:8090/status"
        expect:
          uk: "Як у кроці 7 вступу: на 8081 — `curl: (7) Failed to connect …`, на 8090 — `packager-status:running`."
          en: "As in step 7 of the intro: on 8081 `curl: (7) Failed to connect …`, on 8090 `packager-status:running`."
      - text:
          uk: "Зупини сервер (Ctrl+C у першому терміналі) і полагодь обидві причини: версію вирівняй під SDK, а script `start` поверни до стандартного порту."
          en: "Stop the server (Ctrl+C in the first terminal) and repair both causes: align the version with the SDK and put the `start` script back to the default port."
        command: "npx expo install --fix\nnpm pkg set scripts.start=\"expo start\""
        expect:
          uk: "`› Installing 1 SDK 57.0.0 compatible native module using npm`, далі вивід `npm install`. `grep react-native package.json` знову показує `\"react-native\": \"0.86.3\"`."
          en: "`› Installing 1 SDK 57.0.0 compatible native module using npm`, then the `npm install` output. `grep react-native package.json` shows `\"react-native\": \"0.86.3\"` again."
      - text:
          uk: "Запусти сервер з очищеним кешем bundler’а (у кеші лишилися модулі старої версії), відкрий проєкт на цілі **новим** способом — клавішею `a`/`i` або QR-кодом — і запиши результат."
          en: "Start the server with a cleared bundler cache (the cache still holds modules of the old version), open the project on the target in a **fresh** way — the `a`/`i` key or the QR code — and write down the result."
        command: "npx expo start --clear"
        expect:
          uk: "Серед перших рядків — `warning: Bundler cache is empty, rebuilding (this may take a minute)`, далі `› Metro: exp://<твоя IP-адреса>:8081`. На цілі знову відкривається hello-екран (на цілі не перевірено)."
          en: "Among the first lines, `warning: Bundler cache is empty, rebuilding (this may take a minute)`, then `› Metro: exp://<your IP address>:8081`. The hello screen opens on the target again (not checked on a target)."
      - text:
          uk: "Переконайся, що перевірки чисті, подивись на свій ремонт і закоміть його."
          en: "Make sure the checks are clean, look at your repair and commit it."
        command: "npx expo install --check\ngit diff --stat\ngit add -A\ngit commit -m \"Repair the version pin and the dev server port\""
        expect:
          uk: "`Dependencies are up to date`; `git diff --stat` показує зміни лише в `package.json` і `package-lock.json` (новий `DEBUG-NOTES.md` Git ще не відстежує, тож у цьому списку його немає; `git add -A` додасть його в commit)."
          en: "`Dependencies are up to date`; `git diff --stat` shows changes only in `package.json` and `package-lock.json` (Git does not track the new `DEBUG-NOTES.md` yet, so it is not in this list; `git add -A` puts it into the commit)."
    verify:
      - id: recorded
        text:
          uk: "У `DEBUG-NOTES.md` записано дослівний вивід `npx expo install --check`, двох `curl` і повідомлення Expo Go до ремонту."
          en: "`DEBUG-NOTES.md` holds the verbatim output of `npx expo install --check`, the two `curl` calls and Expo Go's message before the repair."
      - id: repaired
        text:
          uk: "Після ремонту `npx expo install --check` пише `Dependencies are up to date`, а Metro слухає порт 8081."
          en: "After the repair `npx expo install --check` prints `Dependencies are up to date`, and Metro listens on port 8081."
      - id: runs-again
        text:
          uk: "Hello-екран знову відкрився на моїй заявленій цілі, і я записав, що змінилося."
          en: "The hello screen opened on my declared target again, and I wrote down what changed."
    troubleshooting:
      - problem:
          uk: "`npx expo install --fix` після ремонту знову щось пропонує оновити"
          en: "`npx expo install --fix` offers to update something again after the repair"
        fix:
          uk: "Прочитай, які саме пакети він називає. Якщо серед них є не лише `react-native`, ти змінив більше, ніж у кроці 2: порівняй `package.json` з комітом `Seed a broken native setup` (`git diff HEAD~1 -- package.json`)."
          en: "Read which packages exactly it names. If there is more than `react-native`, you changed more than in step 2: compare `package.json` with the `Seed a broken native setup` commit (`git diff HEAD~1 -- package.json`)."
      - problem:
          uk: "Обидва `curl` пишуть `Failed to connect`"
          en: "Both `curl` calls say `Failed to connect`"
        fix:
          uk: "Dev-сервер зараз не працює: `curl` треба запускати в другому терміналі, поки в першому працює `npm start`."
          en: "The dev server is not running right now: run `curl` in a second terminal while `npm start` runs in the first."
      - problem:
          uk: "Після ремонту ціль досі показує стару помилку"
          en: "After the repair the target still shows the old error"
        fix:
          uk: "Ти відкрив старий запис зі списку нещодавніх, а сервер ще не запущено, або кеш не очищено. Запусти `npx expo start --clear` і відкрий проєкт клавішею `a`/`i` чи новим скануванням QR-коду."
          en: "You opened an old entry from the recent list while the server was not running yet, or the cache was not cleared. Run `npx expo start --clear` and open the project with the `a`/`i` key or a fresh QR scan."
      - problem:
          uk: "`git diff --stat` показує зміни не лише в `package.json` і `package-lock.json`"
          en: "`git diff --stat` shows changes beyond `package.json` and `package-lock.json`"
        fix:
          uk: "Ти змінив ще щось, крім ремонту. Подивись, що саме: `git diff <файл>`. Зайве поверни командою `git restore <файл>`, а потім роби commit."
          en: "You changed something besides the repair. See what exactly with `git diff <file>`. Put back anything extra with `git restore <file>`, then commit."
    recovery:
      uk: "Перед зламом усе було в commit, а зламаний стан — у commit `Seed a broken native setup`. Якщо ремонт заплутався, `git restore package.json package-lock.json` повертає файли до зламаного стану, а `git restore --source=HEAD~1 package.json package-lock.json` і потім `npm install` — до робочого стану з уроку про hello-екран."
      en: "Before the breakage everything was in a commit, and the broken state is in the `Seed a broken native setup` commit. If the repair gets tangled, `git restore package.json package-lock.json` returns the files to the broken state, and `git restore --source=HEAD~1 package.json package-lock.json` followed by `npm install` returns them to the working state from the hello screen lesson."

  - id: to-project
    kind: transfer
    capstoneStep: RN-01
    body:
      uk: "Перш ніж запускати native-підпроєкт свого проєкту, перевір його тими самими командами: `npx expo install --check` має сказати `Dependencies are up to date`, а Metro — відповідати на порту, який відкриває Expo Go."
      en: "Before you run your project's native subproject, check it with the same commands: `npx expo install --check` must say `Dependencies are up to date`, and Metro must answer on the port Expo Go opens."
