id: rn-01-01-native-vs-web
unit: RN-01
title:
  uk: "Нативний рендеринг проти вебу"
  en: "Native vs web rendering"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Пояснити, чому дерево компонентів React Native під час commit стає платформними view, а не DOM-вузлами, і назвати, що лишається тим самим: компоненти, props, state, доменний код."
    en: "Explain why a React Native component tree is committed to platform views rather than DOM nodes, and name what stays the same (components, props, state, domain code)."
  - uk: "Розкласти рядки екрана на спільну доменну логіку, логіку React і платформний UI та сказати, що з цього може і чого не може перевірити концептуальний перегляд у браузері."
    en: "Classify lines of a screen as shared domain logic, React logic or platform-bound UI, and state which of them a browser concept preview can and cannot verify."
prerequisites: [re-01-06-render-vs-commit, re-09-04-reuse-boundaries]
subskills:
  - { family: N-01, skill: "native vs DOM", depth: intro }
glossary: [native-renderer, native-view, react-native-web]
selfCheck: [predict-on-phone, task-card]

blocks:
  - id: same-tree
    kind: explanation
    title:
      uk: "Той самий React, інша ціль commit"
      en: "The same React, a different commit target"
    body:
      uk: |
        У React-розділі ти бачив два кроки: [[render-phase|render]] обчислює новий опис екрана, а [[commit-phase|commit]] вносить різницю в DOM. Сам React не знає, що таке DOM: це робота **рендерера**. У вебі рендерер — `react-dom`.

        React Native — це **інший** рендерер. Під час commit він створює не `<div>`, а [[native-view|native view]] — справжні елементи інтерфейсу операційної системи: на Android це `android.view.View`, на iOS — `UIView`. Браузера в застосунку немає зовсім, тож немає ні DOM, ні HTML-тегів, ні CSS-файлів.

        Тому й компоненти інші:

        | Веб | React Native |
        |---|---|
        | `<div>` | `<View>` |
        | `<p>`, `<h2>`, `<span>` | `<Text>` — **увесь** текст лише в ньому |
        | `<button onClick>` | `<Pressable onPress>` |
        | `className` + CSS | проп `style` з об’єктом стилів |

        А от функціональні компоненти, props, state, хуки й твій доменний код (`formatWish`, `validateItem`) лишаються **тими самими**. Змінюється лише те, що отримує commit.
      en: |
        In the React unit you saw two steps: [[render-phase|render]] computes a new description of the screen, and [[commit-phase|commit]] applies the difference to the DOM. React itself does not know what the DOM is: that is the job of a **renderer**. On the web the renderer is `react-dom`.

        React Native is **another** renderer. During commit it creates not a `<div>` but a [[native-view|native view]] — real interface elements of the operating system: `android.view.View` on Android, `UIView` on iOS. There is no browser in the app at all, so there is no DOM, no HTML tags and no CSS files.

        That is why the components differ:

        | Web | React Native |
        |---|---|
        | `<div>` | `<View>` |
        | `<p>`, `<h2>`, `<span>` | `<Text>` — **all** text lives only inside it |
        | `<button onClick>` | `<Pressable onPress>` |
        | `className` + CSS | the `style` prop with a style object |

        But function components, props, state, hooks and your domain code (`formatWish`, `validateItem`) stay **the same**. Only what the commit produces changes.

  - id: stage-and-film
    kind: analogy
    body:
      uk: "Один сценарій ставлять у театрі й знімають для кіно. Репліки й сюжет спільні, а сцену, світло й те, що може зробити глядач, для кожного носія будують заново. Сценарій — це твої компоненти й доменний код; сцена в театрі — веб-сторінка, кінознімання — native-застосунок на телефоні."
      en: "One script is staged in a theatre and filmed for the screen. The lines and the plot are shared, but the set, the lighting and what the audience can do are rebuilt for each medium. The script is your components and domain code; the theatre stage is a web page, the filming is a native app on a phone."
    limits:
      uk: "Переходить лише сценарій — доменна логіка й логіка компонентів. Верстку, жести й поведінку платформи будують окремо для кожної платформи, тож генеральна репетиція в театрі (перегляд у браузері) нічого не доводить про відзнятий фільм на пристрої. І ще: у кіно грають ті самі актори, що й у театрі, а в React Native «актори» інші — замість `div` і `button` грають `View` і `Pressable`. Веб-сторінку ніхто не переносить на телефон."
      en: "Only the script transfers — the domain and component logic. Layout, gestures and platform behaviour are rebuilt per platform, so the dress rehearsal on stage (the browser preview) proves nothing about the filmed version on a device. Also, a film keeps the theatre's actors, while in React Native the “actors” change — `View` and `Pressable` play instead of `div` and `button`. Nobody moves a web page onto the phone."

  - id: recall-commit
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: commit-same-result
        from: re-01-06-render-vs-commit
        prompt:
          uk: "Батьківський компонент пройшов повторний рендер, і дочірній компонент повернув рівно той самий опис, що й минулого разу. Що зробить commit із DOM цього дочірнього компонента?"
          en: "A parent component re-rendered, and a child component returned exactly the same description as last time. What does the commit do to that child's DOM?"
        answer:
          type: choice
          options:
            - id: nothing
              text:
                uk: "Нічого не змінить: різниці немає"
                en: "It changes nothing: there is no difference"
            - id: rebuild
              text:
                uk: "Створить DOM-вузли дочірнього компонента заново"
                en: "It recreates the child's DOM nodes"
              why:
                uk: "Render — це обчислення. Commit вносить у DOM лише знайдену різницю; немає різниці — немає змін."
                en: "Render is a computation. Commit applies only the difference found; no difference, no changes."
            - id: skip-render
              text:
                uk: "Commit узагалі не дійде до дочірнього компонента, бо React його не викликав"
                en: "The commit never reaches the child, because React did not call it"
              why:
                uk: "React викликав дочірній компонент: під час re-render він викликає компонент і всіх його нащадків. Просто результат вийшов той самий."
                en: "React did call the child: on a re-render it calls the component and all its descendants. The result just came out the same."
          correct: [nothing]
        explanation:
          uk: "Render обчислює опис, commit вносить лише різницю. У React Native працює той самий поділ, тільки commit вносить різницю не в DOM, а в native view."
          en: "Render computes a description, commit applies only the difference. React Native keeps the same split; its commit applies the difference to native views instead of the DOM."

  - id: predict-on-phone
    kind: prediction
    prompt:
      uk: "Ці фрагменти написано всередині компонента React Native (`View`, `Text` і `Pressable` імпортовано з `react-native`). Які з них працюватимуть **на телефоні** так, як задумано? Обери всі."
      en: "These fragments are written inside a React Native component (`View`, `Text` and `Pressable` are imported from `react-native`). Which of them work **on a phone** as intended? Choose all that apply."
    runnable: false
    answer:
      type: multi
      options:
        - id: div
          code: "<div className=\"card\">…</div>"
          why:
            uk: "У React Native немає компонента `div`, а `className` нічого не означає: CSS-файлів немає. Замість цього — `<View style={styles.card}>`."
            en: "React Native has no `div` component, and `className` means nothing: there are no CSS files. Use `<View style={styles.card}>` instead."
        - id: bare-text
          code: "<View>{wish.name}</View>"
          why:
            uk: "Текст можна класти лише в `<Text>`. Документація React Native прямо каже: текстовий вузол не може бути дочірнім елементом `<View>`. У debug-збірці React Native 0.86 на це пише помилку `Text strings must be rendered within a <Text> component.` Правильно: `<View><Text>{wish.name}</Text></View>`."
            en: "Text may sit only inside `<Text>`. The React Native docs say it plainly: a text node cannot be a direct child of a `<View>`. In a debug build React Native 0.86 reports the error `Text strings must be rendered within a <Text> component.` Correct: `<View><Text>{wish.name}</Text></View>`."
        - id: onclick
          code: "<View onClick={select}>…</View>"
          why:
            uk: "Дотик пальцем на телефоні `onClick` не викликає: у React Native 0.86 `onClick` у `View` — експериментальна подія, за замовчуванням вимкнена. Для натискань є `<Pressable onPress={select}>`."
            en: "A finger tap on a phone does not call `onClick`: in React Native 0.86 `onClick` on a `View` is an experimental event, switched off by default. Taps go through `<Pressable onPress={select}>`."
        - id: text-ok
          code: "<Text style={styles.title}>{formatWish(wish, labels)}</Text>"
        - id: pressable-ok
          code: "<Pressable onPress={select}><Text>{labels.toggle}</Text></Pressable>"
      correct: [text-ok, pressable-ok]
    explanation:
      uk: "На телефоні працюють лише native-компоненти: текст у `Text`, натискання через `Pressable` і `onPress`, вигляд через `style`. Вебового `div` і `className` у React Native немає, а `onClick` дотик не викликає. Виклик доменної функції `formatWish` — звичайний JavaScript, він працює всюди."
      en: "On a phone only native components work: text in `Text`, taps through `Pressable` and `onPress`, looks through `style`. React Native has no web `div` or `className`, and a tap does not call `onClick`. The call to the domain function `formatWish` is plain JavaScript and works everywhere."

  - id: what-the-preview-is
    kind: explanation
    title:
      uk: "Що таке перегляд у браузері"
      en: "What the browser preview is"
    body:
      uk: |
        У курсі компоненти React Native запускаються в **концептуальному перегляді**. Він працює через [[react-native-web]] — бібліотеку, яка перекладає `View`, `Text` і `Pressable` у DOM-вузли браузера. Тобто дерево компонентів те саме, а commit іде в DOM, а не в native view.

        Корисно, але підступно: браузер **поблажливий**. Перевірено в цьому перегляді:

        - `<div>` з’являється на сторінці, бо браузер його знає;
        - `onClick` на `View` спрацьовує;
        - текст просто у `View` теж видно — лише в консолі з’являється помилка `Unexpected text node … A text node cannot be a child of a <View>`.

        На телефоні жоден із цих трьох випадків не працює. Тому чесно ділимо рядки екрана на три групи:

        | Що | Приклад | Чи доводить перегляд? |
        |---|---|---|
        | Доменна логіка | `formatWish(wish, labels)` | так: це звичайний JavaScript |
        | Логіка React | `useState`, `onPress={() => setAcquired(…)}` | так: React той самий |
        | Платформний UI | як виглядає `View`, шрифти, дотики, клавіатура | **ні**: це перевіряють на емуляторі чи пристрої |

        І ще одне: файл `main.jsx` у прикладах — службовий код перегляду. Він кладе компонент у сторінку через `createRoot`. Справжній застосунок Expo реєструє головний компонент інакше: у шаблоні, з якого ти створиш проєкт, це `registerRootComponent(App)` у файлі `index.ts`.
      en: |
        In the course, React Native components run in a **concept preview**. It works through [[react-native-web]] — a library that translates `View`, `Text` and `Pressable` into browser DOM nodes. So the component tree is the same, but the commit goes to the DOM, not to native views.

        Useful, but tricky: the browser is **forgiving**. Checked in this preview:

        - a `<div>` shows up on the page, because the browser knows it;
        - `onClick` on a `View` fires;
        - text placed straight into a `View` is visible too — only the console shows the error `Unexpected text node … A text node cannot be a child of a <View>`.

        On a phone none of these three works. So we split the lines of a screen honestly into three groups:

        | What | Example | Does the preview prove it? |
        |---|---|---|
        | Domain logic | `formatWish(wish, labels)` | yes: it is plain JavaScript |
        | React logic | `useState`, `onPress={() => setAcquired(…)}` | yes: React is the same |
        | Platform UI | how a `View` looks, fonts, touches, the keyboard | **no**: that is checked on an emulator or a device |

        One more thing: the `main.jsx` file in the examples is the preview's plumbing. It puts the component into the page with `createRoot`. A real Expo app registers its root component differently: in the template you will create your project from, it is `registerRootComponent(App)` in the file `index.ts`.

  - id: two-commit-targets
    kind: visual
    visual: diagram
    title:
      uk: "Одне дерево — дві цілі commit"
      en: "One tree, two commit targets"
    textEquivalent:
      uk: "Угорі — спільна частина: доменна функція formatWish і дерево компонентів WishCard з View, Text і Pressable. formatWish дає текст для Text. Під час commit те саме дерево йде двома шляхами. У перегляді курсу react-native-web створює DOM-вузли: div для View, h1 для Text із роллю heading, button для Pressable. На пристрої native-рендерер React Native створює платформні view: android.view.View на Android або UIView на iOS. Доменна функція й дерево компонентів не змінюються; змінюється лише те, у що commit перетворює дерево. Тому правильний вигляд у перегляді нічого не доводить про вигляд на пристрої."
      en: "At the top is the shared part: the domain function formatWish and the component tree WishCard with View, Text and Pressable. formatWish supplies the text for Text. During commit the same tree takes two paths. In the course preview, react-native-web creates DOM nodes: a div for View, an h1 for Text with the heading role, a button for Pressable. On a device, React Native's native renderer creates platform views: android.view.View on Android or UIView on iOS. The domain function and the component tree do not change; only what the commit turns the tree into changes. That is why a correct look in the preview proves nothing about the look on a device."
    spec:
      layout: grid
      groups:
        - { id: shared, label: { uk: "Спільне", en: "Shared" } }
        - { id: preview, label: { uk: "Перегляд у браузері", en: "Browser preview" } }
        - { id: device, label: { uk: "Пристрій", en: "Device" } }
      nodes:
        - { id: domain, group: shared, label: "formatWish()", shape: round, w: 136, col: 0, row: 0 }
        - { id: tree, group: shared, label: "WishCard", w: 130, col: 1, row: 0 }
        - { id: rnw, group: preview, label: "react-native-web", w: 136, col: 0, row: 1 }
        - { id: dom, group: preview, label: "div · h1 · button", shape: note, w: 136, col: 0, row: 2 }
        - { id: renderer, group: device, label: { uk: "native-рендерер", en: "native renderer" }, w: 130, col: 1, row: 1 }
        - { id: views, group: device, label: "View / UIView", shape: note, w: 130, col: 1, row: 2 }
      edges:
        - { id: domain-tree, from: domain, to: tree, label: { uk: "текст", en: "text" } }
        - { id: tree-rnw, from: tree, to: rnw, label: "commit" }
        - { id: tree-renderer, from: tree, to: renderer, label: "commit" }
        - { id: rnw-dom, from: rnw, to: dom }
        - { id: renderer-views, from: renderer, to: views }
      steps:
        - caption:
            uk: "Спільна частина: доменна функція `formatWish` і дерево компонентів `WishCard`. Обидві існують лише як JavaScript."
            en: "The shared part: the domain function `formatWish` and the component tree `WishCard`. Both exist only as JavaScript."
          highlight: [domain, tree, domain-tree]
          dim: [rnw, dom, renderer, views]
        - caption:
            uk: "У перегляді курсу commit виконує **react-native-web**: `View` стає `div`, `Text` з роллю heading — `h1`, `Pressable` — `button`. Це DOM браузера."
            en: "In the course preview the commit is done by **react-native-web**: `View` becomes a `div`, `Text` with the heading role an `h1`, `Pressable` a `button`. This is the browser's DOM."
          highlight: [tree-rnw, rnw, rnw-dom, dom]
          dim: [renderer, views, tree-renderer, renderer-views]
        - caption:
            uk: "На пристрої те саме дерево отримує **native-рендерер** React Native: він створює `android.view.View` на Android або `UIView` на iOS. DOM тут немає."
            en: "On a device the same tree goes to React Native's **native renderer**: it creates `android.view.View` on Android or `UIView` on iOS. There is no DOM here."
          highlight: [tree-renderer, renderer, renderer-views, views]
          dim: [rnw, dom, tree-rnw, rnw-dom]
          annotate:
            - { id: views, text: { uk: "інша платформа", en: "another platform" } }
        - caption:
            uk: "Код угорі однаковий для обох шляхів; різні лише результати commit. Тому правильний вигляд ліворуч нічого не доводить про вигляд праворуч."
            en: "The code at the top is the same for both paths; only the commit results differ. So a correct look on the left proves nothing about the look on the right."
          highlight: [domain, tree, dom, views]

  - id: wish-card
    kind: example
    runtime: concept-preview
    dir: wish-card
    entry: main.jsx
    strings:
      wishName: { uk: "Навушники", en: "Headphones" }
      noPrice: { uk: "без ціни", en: "no price" }
      currency: { uk: "грн", en: "UAH" }
      wanted: { uk: "Ще хочу", en: "Still wanted" }
      acquired: { uk: "Уже отримано", en: "Already got it" }
      toggle: { uk: "Змінити позначку", en: "Toggle the mark" }
    title:
      uk: "Картка бажання в перегляді"
      en: "A wish card in the preview"
    body:
      uk: |
        `WishCard.jsx` — компонент React Native: `View`, `Text` і `Pressable`, стилі через `StyleSheet.create`, назва з доменної функції `formatWish`. Натисни **Запустити**. На вкладці **Сторінка** — картка, а в **Консолі** — DOM-вузли, які створив react-native-web: по одному елементу в рядку, з першим CSS-класом.

        Зверни увагу: кожен `View` став `div` із класом `css-view-…`, кожен `Text` — елементом із класом `css-text-…`. Саме так перегляд підміняє native view.
      en: |
        `WishCard.jsx` is a React Native component: `View`, `Text` and `Pressable`, styles through `StyleSheet.create`, the title from the domain function `formatWish`. Press **Run**. The **Page** tab shows the card, and the **Console** lists the DOM nodes react-native-web created: one element per line, with its first CSS class.

        Notice: every `View` became a `div` with a `css-view-…` class, every `Text` an element with a `css-text-…` class. That is how the preview stands in for native views.
    tryIt:
      uk: |
        1. У `WishCard.jsx` прибери `role="heading"` з першого `Text` і запусти: у консолі `h1` стане `div`. Поверни `role="heading"`.
        2. У `styles.button` зміни `backgroundColor` на `'#7c2d12'` і запусти: колір кнопки змінився, а в консолі ті самі вузли — стиль перетворився на CSS-класи.
        3. Додай у `View` рядок `<div>web</div>` і запусти: перегляд покаже слово «web», хоча на телефоні такого компонента немає. Прибери цей рядок.
        4. Запиши дві речі, яких цей перегляд не може показати: наприклад, справжній клас native view, шрифти пристрою, дотик пальцем.
      en: |
        1. In `WishCard.jsx` remove `role="heading"` from the first `Text` and run: in the console the `h1` becomes a `div`. Put `role="heading"` back.
        2. In `styles.button` change `backgroundColor` to `'#7c2d12'` and run: the button colour changed, while the console shows the same nodes — the style turned into CSS classes.
        3. Add the line `<div>web</div>` inside the `View` and run: the preview shows the word “web”, although a phone has no such component. Remove the line.
        4. Write down two things this preview cannot show: for example, the real native view class, the device's fonts, a touch with a finger.
    limits:
      uk: "Це концептуальний перегляд у браузері через react-native-web, а не native-застосунок. Він не показує native view (`android.view.View`, `UIView`), шрифтів і вигляду платформи, справжніх дотиків і жестів (лише мишу й клавіатуру), native-модулів пристрою, навігаційного стека платформи й продуктивності телефона. Браузер приймає `div`, `onClick` і текст поза `Text`, яких React Native на телефоні не приймає. Правильний результат тут — не перевірка на пристрої."
      en: "This is a concept preview in the browser through react-native-web, not a native app. It does not show native views (`android.view.View`, `UIView`), the platform's fonts and look, real touches and gestures (only mouse and keyboard), the device's native modules, the platform's navigation stack or phone performance. The browser accepts `div`, `onClick` and text outside `Text`, which React Native on a phone does not. A correct result here is not a device check."

  - id: task-card
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: task-card
    entry: main.jsx
    editable: [TaskCard.jsx]
    strings:
      taskTitle: { uk: "Полити квіти", en: "Water the plants" }
      noDueDate: { uk: "без терміну", en: "no due date" }
      toggle: { uk: "Виконано", en: "Done" }
    title:
      uk: "Перепиши картку справи для React Native"
      en: "Rewrite a task card for React Native"
    instructions:
      uk: |
        `TaskCard.jsx` написано для вебу: `<div>`, `<h2>` і `<button onClick>`. Запусти — у перегляді все працює, бо це браузер. На телефоні ж цей компонент працювати не буде.

        Перепиши його на компоненти React Native:

        - зовнішній контейнер — `View`;
        - назва справи — `Text` з `role="heading"`;
        - кнопка — `Pressable` з `role="button"` і `onPress`, а підпис кнопки — у своєму `Text`.

        Виклик `formatLabel(task, labels)` не змінюй: доменний код спільний для вебу й телефона. `View`, `Text` і `Pressable` імпортуй з `'react-native'`.

        Крім клацання в перегляді, перевірки імітують дотик телефона: викликають `onPress` кнопки.
      en: |
        `TaskCard.jsx` is written for the web: `<div>`, `<h2>` and `<button onClick>`. Run it — in the preview everything works, because it is a browser. On a phone this component would not work.

        Rewrite it with React Native components:

        - the outer container is a `View`;
        - the task title is a `Text` with `role="heading"`;
        - the button is a `Pressable` with `role="button"` and `onPress`, and the button's label sits in its own `Text`.

        Do not change the call `formatLabel(task, labels)`: domain code is shared by the web and the phone. Import `View`, `Text` and `Pressable` from `'react-native'`.

        Besides a click in the preview, the checks simulate a phone's tap: they call the button's `onPress`.
    testTitles:
      "every element of the card is drawn by a React Native component":
        uk: "Кожен елемент картки намальовано компонентом React Native"
        en: "Every element of the card is drawn by a React Native component"
      "the heading shows the task through formatLabel":
        uk: "Заголовок показує справу через `formatLabel`"
        en: "The heading shows the task through `formatLabel`"
      "pressing the button toggles the task as done":
        uk: "Натискання кнопки позначає справу виконаною"
        en: "Pressing the button marks the task as done"
      "a tap on a phone reaches the button through onPress":
        uk: "Дотик на телефоні доходить до кнопки через `onPress`"
        en: "A tap on a phone reaches the button through `onPress`"
    hints:
      nudge:
        uk: "Порівняй таблицю «Веб — React Native» з першого пояснення уроку з кожним тегом у `TaskCard.jsx`."
        en: "Compare the “Web — React Native” table from the lesson's first explanation with each tag in `TaskCard.jsx`."
      explanation:
        uk: "Кожен вебовий тег має native-відповідник: контейнер стає `View`, текст — `Text`, кнопка — `Pressable`. Обробник переходить з `onClick` в `onPress`, а текст кнопки потрапляє у вкладений `Text`. Наприклад, вебовий рядок `<p>{price}</p>` у React Native стає `<Text>{price}</Text>`. Атрибут `className` прибери: стилів через CSS тут немає."
        en: "Every web tag has a native counterpart: a container becomes a `View`, text a `Text`, a button a `Pressable`. The handler moves from `onClick` to `onPress`, and the button's text goes into a nested `Text`. For example, the web line `<p>{price}</p>` becomes `<Text>{price}</Text>` in React Native. Remove `className`: there is no CSS styling here."
    solutionNote:
      uk: "Props, виклик `formatLabel` і обробник `onToggle` лишилися ті самі — змінилися лише компоненти, у які йде commit. `Pressable` з `onPress` — native-спосіб обробити дотик; `role` дає скрінрідеру й перевіркам роль заголовка й кнопки. Підійде й старіший запис `accessibilityRole=\"header\"` / `\"button\"`."
      en: "The props, the `formatLabel` call and the `onToggle` handler stayed the same — only the components the commit targets changed. `Pressable` with `onPress` is the native way to handle a touch; `role` gives screen readers and the checks the heading and button roles. The older `accessibilityRole=\"header\"` / `\"button\"` works too."
    feedback:
      - when: { test: "every element of the card is drawn by a React Native component" }
        message:
          uk: "Ця перевірка очікує, що кожен елемент картки створено через `View`, `Text` або `Pressable`. Якщо в картці лишився `<div>`, `<h2>` чи `<button>`, перегляд його покаже, бо це браузер, але на телефоні такого компонента немає — заміни його native-відповідником."
          en: "This check expects every element of the card to come from `View`, `Text` or `Pressable`. If a `<div>`, `<h2>` or `<button>` is left in the card, the preview shows it, because it is a browser, but a phone has no such component — replace it with its native counterpart."
      - when: { test: "the heading shows the task through formatLabel" }
        message:
          uk: "Ця перевірка шукає елемент із роллю heading і текстом, який повертає `formatLabel(task, labels)`. Дай назві `role=\"heading\"` і не змінюй виклик `formatLabel`."
          en: "This check looks for an element with the heading role and the text that `formatLabel(task, labels)` returns. Give the title `role=\"heading\"` and do not change the `formatLabel` call."
      - when: { test: "pressing the button toggles the task as done" }
        message:
          uk: "Ця перевірка шукає кнопку з назвою «Виконано», клацає її в перегляді й чекає, що позначка ✓ у заголовку з’явиться або зникне. Кнопкою елемент робить `role=\"button\"`, а натискання обробляє `Pressable` з `onPress={onToggle}`."
          en: "This check looks for a button named “Done”, clicks it in the preview and waits for the ✓ mark in the heading to appear or disappear. `role=\"button\"` makes the element a button, and a `Pressable` with `onPress={onToggle}` handles the press."
      - when: { test: "a tap on a phone reaches the button through onPress" }
        message:
          uk: "Ця перевірка доставляє дотик так, як це робить телефон: шукає над кнопкою «Виконано» компонент із пропом `onPress`, викликає його й чекає зміни позначки ✓. У перегляді спрацьовує й `onClick`, але на телефоні дотик пальцем його не викликає — потрібен `Pressable` з `onPress={onToggle}`."
          en: "This check delivers a tap the way a phone does: it looks above the “Done” button for a component with an `onPress` prop, calls it and waits for the ✓ mark to change. In the preview `onClick` fires too, but on a phone a finger tap does not call it — you need a `Pressable` with `onPress={onToggle}`."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити. Найчастіше причина — незакритий тег: кожен `<View>`, `<Text>` і `<Pressable>` потрібно закрити відповідним `</View>`, `</Text>`, `</Pressable>`."
          en: "The code could not start. The usual cause is an unclosed tag: every `<View>`, `<Text>` and `<Pressable>` needs its matching `</View>`, `</Text>`, `</Pressable>`."
    limits:
      uk: "Перевірки запускають компонент у перегляді react-native-web і дивляться на DOM-вузли, які він створив: клас `css-view-…` чи `css-text-…` означає, що вузол прийшов із `View` чи `Text`. Дотик телефона вони лише імітують — викликають `onPress`, записаний для кнопки. Вони не доводять, що картка так само виглядає й реагує на дотик на телефоні: немає native view, шрифтів пристрою й справжніх жестів."
      en: "The checks run the component in the react-native-web preview and look at the DOM nodes it created: a `css-view-…` or `css-text-…` class means the node came from a `View` or a `Text`. A phone's tap is only simulated — the checks call the `onPress` recorded for the button. They do not prove that the card looks and responds to touch the same way on a phone: there are no native views, device fonts or real gestures."

  - id: to-project
    kind: transfer
    capstoneStep: RN-01
    body:
      uk: "У проєктному кроці цього розділу ти створиш [[native-subproject|нативний підпроєкт]] — окремий проєкт Expo в теці `~/js-course/<проєкт>-native` поруч із веб-клієнтом. Доменні функції з `domain/` перейдуть туди незмінними копіями, а компоненти ти напишеш заново — з `View`, `Text` і `Pressable` замість тегів HTML."
      en: "In this unit's project step you will create the [[native-subproject|native subproject]], a separate Expo project in the folder `~/js-course/<project>-native` next to the web client. The domain functions from `domain/` move there as unchanged copies, while the components are written anew — with `View`, `Text` and `Pressable` instead of HTML tags."
