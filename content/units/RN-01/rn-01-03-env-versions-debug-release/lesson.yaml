id: rn-01-03-env-versions-debug-release
unit: RN-01
title:
  uk: "Середовище, версії, debug проти release"
  en: "Environment, versions, debug vs release"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити, яка поведінка відрізняється в debug-збірці (dev-сервер, попередження на екрані, швидке оновлення) і в release-збірці (JavaScript зібрано в застосунок, dev-сервера немає, попереджень розробника немає)."
    en: "Predict which behaviors differ between a debug build (dev server, warning overlay, fast reload) and a release build (bundled JavaScript, no dev server, no dev warnings)."
  - uk: "Прочитати таблицю підтримки версій і вирішити, чи підтримано версії ОС і інструментів заявленої цілі."
    en: "Read a version-labeled support table and decide whether a declared target's OS and toolchain versions are supported."
  - uk: "Пояснити, чому значення конфігурації потрапляють у застосунок під час збирання, а не читаються з env-файлу на пристрої."
    en: "Explain why config values reach the app at build time rather than being read from an env file on the device."
prerequisites: [rn-01-02-toolchain-setup, js-15-06-build-env-sourcemaps]
subskills:
  - { family: N-01, skill: "environment/version support and debug vs release", depth: intro }
glossary: [debug-build, release-build, version-support-matrix]
selfCheck: [predict-release, device-config]

blocks:
  - id: two-builds
    kind: explanation
    title:
      uk: "Звідки застосунок бере JavaScript"
      en: "Where the app gets its JavaScript"
    body:
      uk: |
        Native-застосунок React Native — це native-оболонка плюс твій JavaScript. Звідки береться JavaScript, залежить від режиму збирання.

        У [[debug-build|debug-збірці]] JavaScript живе на твоєму комп’ютері. Команда `npx expo start` запускає dev-сервер **Metro** (порт 8081), і застосунок на телефоні чи емуляторі завантажує з нього [[bundle]]. Звідси зручності: попередження розробника прямо на екрані, оновлення одразу після збереження файлу, `console.log` у терміналі. Глобальна змінна `__DEV__` дорівнює `true`.

        У [[release-build|release-збірці]] — тій, що отримують користувачі, — dev-сервера немає. Увесь JavaScript заздалегідь зібрано й покладено всередину застосунку. Команда `npx expo export --platform android` показує, що саме туди йде: у нашій перевірці (Expo SDK 57) це один файл `index-….hbc` на 1,4 МБ — JavaScript, скомпільований у байт-код рушія Hermes. `__DEV__` тут `false`, і збирач **вирізає** код під `if (__DEV__) { … }`: у зібраному файлі його вже немає.

        | | debug | release |
        |---|---|---|
        | JavaScript | з dev-сервера Metro | усередині застосунку |
        | `__DEV__` | `true` | `false` |
        | Попередження розробника, швидке оновлення | є | немає |

        Тому «працює в debug на моєму емуляторі» ще не означає «працює в release»: це інший код (без гілок `__DEV__`) в іншому режимі.
      en: |
        A React Native app is a native shell plus your JavaScript. Where that JavaScript comes from depends on the build mode.

        In a [[debug-build|debug build]] the JavaScript lives on your computer. The command `npx expo start` starts the **Metro** dev server (port 8081), and the app on a phone or an emulator downloads the [[bundle]] from it. That gives the conveniences: developer warnings right on the screen, an update as soon as you save a file, `console.log` output in the terminal. The global variable `__DEV__` is `true`.

        In a [[release-build|release build]] — the one users get — there is no dev server. All the JavaScript is bundled in advance and placed inside the app. The command `npx expo export --platform android` shows what goes there: in our check (Expo SDK 57) it is a single file `index-….hbc` of 1.4 MB — JavaScript compiled to bytecode for the Hermes engine. `__DEV__` is `false` here, and the bundler **cuts out** the code under `if (__DEV__) { … }`: it is no longer in the built file.

        | | debug | release |
        |---|---|---|
        | JavaScript | from the Metro dev server | inside the app |
        | `__DEV__` | `true` | `false` |
        | Developer warnings, fast updates | yes | no |

        So “it works in debug on my emulator” does not yet mean “it works in release”: it is different code (without the `__DEV__` branches) in a different mode.

  - id: predict-release
    kind: prediction
    prompt:
      uk: "Застосунок Expo читає адресу сервера як `process.env.EXPO_PUBLIC_API_URL` (значення записано в `.env`) і має в коді рядки з `console.log`, частину з них — усередині `if (__DEV__)`. Що з переліченого відбувається в **release-збірці**? Обери всі."
      en: "An Expo app reads the server address as `process.env.EXPO_PUBLIC_API_URL` (the value is written in `.env`) and has `console.log` lines in its code, some of them inside `if (__DEV__)`. Which of these happen in a **release build**? Choose all that apply."
    runnable: false
    answer:
      type: multi
      options:
        - id: overlay
          text:
            uk: "Попередження розробника з’являються поверх екрана"
            en: "Developer warnings appear on top of the screen"
          why:
            uk: "Попередження на екрані — інструмент debug-збірки. Користувачі release-версії їх не бачать."
            en: "On-screen warnings are a debug-build tool. Users of the release version do not see them."
        - id: fast-reload
          text:
            uk: "Після збереження файлу на комп’ютері застосунок оновлюється сам"
            en: "After you save a file on the computer, the app updates by itself"
          why:
            uk: "Швидке оновлення працює через dev-сервер, а в release-збірці його немає: JavaScript уже всередині застосунку."
            en: "Fast updates work through the dev server, and a release build has none: the JavaScript is already inside the app."
        - id: from-dev-server
          text:
            uk: "JavaScript завантажується з dev-сервера Metro на твоєму комп’ютері"
            en: "The JavaScript is downloaded from the Metro dev server on your computer"
          why:
            uk: "Так працює лише debug-збірка. Release-збірка несе зібраний JavaScript у собі й не знає про твій комп’ютер."
            en: "Only a debug build works that way. A release build carries its bundled JavaScript inside and knows nothing about your computer."
        - id: dev-branch
          text:
            uk: "Виконується код усередині `if (__DEV__) { … }`"
            en: "The code inside `if (__DEV__) { … }` runs"
          why:
            uk: "У release `__DEV__` дорівнює `false`, і збирач узагалі вирізає цей код: у файлі, який робить `npx expo export`, його немає."
            en: "In release `__DEV__` is `false`, and the bundler cuts this code out entirely: it is not in the file `npx expo export` produces."
        - id: public-env
          text:
            uk: "Застосунок має значення `EXPO_PUBLIC_API_URL` з `.env`"
            en: "The app has the value of `EXPO_PUBLIC_API_URL` from `.env`"
        - id: plain-log
          text:
            uk: "Виконується виклик `console.log` поза `if (__DEV__)`"
            en: "A `console.log` call outside `if (__DEV__)` runs"
      correct: [public-env, plain-log]
    explanation:
      uk: "Release-збірка — це зібраний JavaScript без dev-сервера: без попереджень на екрані, без швидкого оновлення, без гілок `if (__DEV__)`. Значення `EXPO_PUBLIC_…` збирач **вписав у код** під час збирання, тож воно є. Звичайний `console.log` у зібраному файлі лишився й виконується — просто терміналу Metro, який би його показав, поруч уже немає."
      en: "A release build is bundled JavaScript without a dev server: no on-screen warnings, no fast updates, no `if (__DEV__)` branches. The bundler **wrote the `EXPO_PUBLIC_…` value into the code** during the build, so it is there. An ordinary `console.log` stayed in the built file and runs — there is just no Metro terminal next to it to show it."

  - id: build-mode
    kind: example
    runtime: concept-preview
    dir: build-mode
    entry: main.jsx
    strings:
      habitName: { uk: "Ранкова зарядка", en: "Morning exercise" }
      done: { uk: "Виконань", en: "Completions" }
      debug: { uk: "Режим: debug", en: "Mode: debug" }
      release: { uk: "Режим: release", en: "Mode: release" }
    title:
      uk: "Імітація __DEV__ у перегляді"
      en: "Simulating __DEV__ in the preview"
    body:
      uk: |
        `HabitScreen.jsx` має один `console.log` без умови й два виклики під `if (__DEV__)`. Перегляд у браузері не є збіркою, тому `__DEV__` тут задає службовий файл `build-mode.js` — це **імітація**. Натисни **Запустити** й порівняй консоль з кодом.
      en: |
        `HabitScreen.jsx` has one `console.log` without a condition and two calls under `if (__DEV__)`. A browser preview is not a build, so here `__DEV__` is set by the helper file `build-mode.js` — this is a **simulation**. Press **Run** and compare the console with the code.
    tryIt:
      uk: "У `build-mode.js` заміни `'debug'` на `'release'` і запусти: лишається лише рядок `render: …`, а на екрані — «Режим: release». Справжню release-збірку ти перевіриш пізніше на своїй заявленій цілі; тут ти лише бачиш, як поводяться гілки `__DEV__`. Поверни `'debug'`."
      en: "In `build-mode.js` replace `'debug'` with `'release'` and run: only the `render: …` line is left, and the screen says “Mode: release”. You will check a real release build later on your declared target; here you only see how the `__DEV__` branches behave. Put `'debug'` back."
    limits:
      uk: "Концептуальний перегляд через react-native-web, а не збірка. `__DEV__` задає файл-імітація; справжній збирач ще й вирізає код під `if (__DEV__)` з release-файлу, чого тут не відбувається. Немає dev-сервера Metro, попереджень на екрані пристрою, швидкого оновлення, байт-коду Hermes, native view, жестів і продуктивності телефона."
      en: "A concept preview through react-native-web, not a build. `__DEV__` is set by a simulation file; a real bundler also cuts the code under `if (__DEV__)` out of the release file, which does not happen here. There is no Metro dev server, no on-screen device warnings, no fast updates, no Hermes bytecode, no native views, gestures or phone performance."

  - id: build-time-config
    kind: explanation
    title:
      uk: "Конфігурація потрапляє в застосунок під час збирання"
      en: "Config reaches the app at build time"
    body:
      uk: |
        Скрипт Node.js читає `process.env` у момент запуску: значення бере операційна система комп’ютера. На телефоні так не буде: `.env` лежить на твоєму комп’ютері, а не в застосунку.

        Тому Expo **вписує** значення під час збирання. Перевірено командою `npx expo export` з таким `.env`:

        ```text
        EXPO_PUBLIC_API_URL=http://192.168.1.20:4000
        API_URL=http://hidden.example
        ```

        У зібраному файлі вийшло так:

        - `process.env.EXPO_PUBLIC_API_URL` замінено рядком `"http://192.168.1.20:4000"`;
        - `process.env.API_URL` лишився як є — без префікса `EXPO_PUBLIC_` Expo нічого не підставляє, і на пристрої значення немає;
        - `const { EXPO_PUBLIC_API_URL } = process.env` теж лишився як є: документація Expo вимагає писати саме `process.env.НАЗВА` через крапку.

        Звідси два правила. Значення для застосунку — лише з префіксом `EXPO_PUBLIC_` і лише через крапку. І все, що вписано, кожен може прочитати в застосунку, тож секретів там бути не може. Ще одна деталь: шаблон Expo ігнорує в Git лише `.env*.local`, тож звичайний `.env` потрапить у commit.
      en: |
        A Node.js script reads `process.env` at the moment it runs: the values come from the computer's operating system. A phone does not work that way: `.env` sits on your computer, not in the app.

        So Expo **writes the values in** during the build. Checked with `npx expo export` and this `.env`:

        ```text
        EXPO_PUBLIC_API_URL=http://192.168.1.20:4000
        API_URL=http://hidden.example
        ```

        The built file came out like this:

        - `process.env.EXPO_PUBLIC_API_URL` was replaced with the string `"http://192.168.1.20:4000"`;
        - `process.env.API_URL` stayed as it was — without the `EXPO_PUBLIC_` prefix Expo substitutes nothing, and on the device there is no value;
        - `const { EXPO_PUBLIC_API_URL } = process.env` stayed as it was too: the Expo docs require writing exactly `process.env.NAME` with a dot.

        Hence two rules. Values for the app — only with the `EXPO_PUBLIC_` prefix and only with a dot. And anything written in can be read from the app by anyone, so no secrets there. One more detail: the Expo template ignores only `.env*.local` in Git, so a plain `.env` ends up in a commit.

  - id: recall-env
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: read-at-run-time
        from: js-15-06-build-env-sourcemaps
        prompt:
          uk: "Обидва варіанти читають `process.env.APP_TITLE` з того самого `.env`: (А) програма, запущена командою `node --env-file-if-exists=.env main.mjs`; (Б) bundle `dist/app.js`, який зібрав esbuild і завантажує браузер. Ти змінив `APP_TITLE` у `.env` і **нічого не перезбирав**. Хто побачить нове значення?"
          en: "Both read `process.env.APP_TITLE` from the same `.env`: (A) a program started with `node --env-file-if-exists=.env main.mjs`; (B) the bundle `dist/app.js` built by esbuild and loaded by a browser. You changed `APP_TITLE` in `.env` and **rebuilt nothing**. Who sees the new value?"
        answer:
          type: choice
          options:
            - id: node-only
              text:
                uk: "Лише (А), після наступного запуску"
                en: "Only (A), after its next start"
            - id: both
              text:
                uk: "Обидва: вони читають той самий файл"
                en: "Both: they read the same file"
              why:
                uk: "Браузер `.env` не читає. Значення вписали в `dist/app.js` під час збирання; без нового збирання там лишилося старе."
                en: "The browser does not read `.env`. The value was written into `dist/app.js` during the build; without a new build the old one is still there."
            - id: bundle-only
              text:
                uk: "Лише (Б), бо bundle завантажується щоразу заново"
                en: "Only (B), because the bundle is downloaded anew every time"
              why:
                uk: "Браузер завантажує той самий зібраний файл зі старим значенням. А Node.js читає `.env` під час кожного запуску."
                en: "The browser downloads the same built file with the old value. Node.js, by contrast, reads `.env` on every start."
          correct: [node-only]
        explanation:
          uk: "Node.js читає `.env` у момент запуску, а збирач вписує значення в bundle. Застосунок React Native поводиться як (Б): нове значення приходить лише з новим збиранням (у debug його робить dev-сервер)."
          en: "Node.js reads `.env` at the moment it starts, while a bundler writes the value into the bundle. A React Native app behaves like (B): a new value arrives only with a new build (in debug, the dev server makes it)."

  - id: support-table
    kind: prediction
    prompt:
      uk: |
        Уривок [[version-support-matrix|таблиці підтримки версій]] з документації Expo (сторінка для SDK 57):

        | Expo SDK | React Native | Node.js | iOS | Android | Xcode |
        |---|---|---|---|---|---|
        | 57 | 0.86 | 22.13+ | 16.4+ | 7+ | 26.4+ |
        | 55 | 0.83 | 20.19+ | 15.1+ | 7+ | 26.2+ |

        Проєкт створено на Expo SDK 57. Заявлена ціль — iPhone з iOS 16.2, а на комп’ютері Node.js 22.13. Що з цього випливає?
      en: |
        An excerpt of the [[version-support-matrix|version support table]] from the Expo docs (the SDK 57 page):

        | Expo SDK | React Native | Node.js | iOS | Android | Xcode |
        |---|---|---|---|---|---|
        | 57 | 0.86 | 22.13+ | 16.4+ | 7+ | 26.4+ |
        | 55 | 0.83 | 20.19+ | 15.1+ | 7+ | 26.2+ |

        The project was created with Expo SDK 57. The declared target is an iPhone on iOS 16.2, and the computer has Node.js 22.13. What follows?
    runnable: false
    answer:
      type: choice
      options:
        - id: ios-unsupported
          text:
            uk: "iOS 16.2 нижча за мінімум 16.4: для SDK 57 ця ціль не підтримана; Node.js підходить"
            en: "iOS 16.2 is below the 16.4 minimum: this target is not supported for SDK 57; Node.js is fine"
        - id: all-fine
          text:
            uk: "Усе підтримано: 16.2 і 16.4 — та сама шістнадцята версія"
            en: "Everything is supported: 16.2 and 16.4 are the same version sixteen"
          why:
            uk: "Мінімум — саме 16.4. Версія 16.2 менша, хоч і з тим самим першим числом."
            en: "The minimum is exactly 16.4. Version 16.2 is lower, even with the same first number."
        - id: node-too-old
          text:
            uk: "Не підходить Node.js: потрібен 22.13 або новіший"
            en: "Node.js does not fit: 22.13 or newer is needed"
          why:
            uk: "22.13 — це і є мінімум, тож він підходить. Проблема в іншій колонці."
            en: "22.13 is exactly the minimum, so it fits. The problem is in another column."
        - id: debug-only
          text:
            uk: "У debug-збірці підтримано, лише release вимагає 16.4"
            en: "It is supported in a debug build; only release requires 16.4"
          why:
            uk: "Таблиця не розрізняє режими збирання: мінімальна версія ОС стосується застосунку загалом."
            en: "The table does not distinguish build modes: the minimum OS version applies to the app as a whole."
      correct: [ios-unsupported]
    explanation:
      uk: "Читай рядок своєї версії SDK і порівнюй кожну колонку з тим, що маєш. iOS 16.2 < 16.4, тож цей iPhone для SDK 57 не підходить: запиши його як непідтриману ціль і обери іншу (або онови iOS на пристрої). Node.js 22.13 дорівнює мінімуму — підходить."
      en: "Read the row of your SDK version and compare each column with what you have. iOS 16.2 < 16.4, so this iPhone does not fit SDK 57: record it as an unsupported target and choose another (or update iOS on the device). Node.js 22.13 equals the minimum — it fits."

  - id: device-config
    kind: exercise
    mode: debug
    runtime: concept-preview
    dir: device-config
    entry: main.jsx
    editable: [config.js, domain/summarize.js]
    strings:
      title: { uk: "Налаштування", en: "Settings" }
      server: { uk: "Сервер", en: "Server" }
      total: { uk: "Разом", en: "Total" }
      currency: { uk: "грн", en: "UAH" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      lunch: { uk: "Обід", en: "Lunch" }
    title:
      uk: "Адреса undefined і зайвий лог у спільному коді"
      en: "An undefined address and a stray log in shared code"
    instructions:
      uk: |
        Екран налаштувань трекера витрат показує `Сервер: undefined`, а в консолі є рядок `summarizeExpenses input: …`. Запусти й подивись сам.

        Тут дві помилки:

        - `config.js` читає адресу так, ніби застосунок відкриває `.env` на телефоні, як Node.js. Ось що записано в `.env` проєкту:

          ```text
          EXPO_PUBLIC_EXPENSES_URL=http://192.168.1.20:4000
          ```

          Подивись, як названо значення, і читай його так, щоб збирач Expo вписав його під час збирання.
        - `domain/summarize.js` — спільний код, його виконує й веб-клієнт. Прибери з нього налагоджувальний вивід. `__DEV__` тут не допоможе: у вебі такої змінної немає. Якщо такий рядок потрібен, йому місце в native-коді — як `if (__DEV__)` у `SettingsScreen.jsx`.

        `simulated-device.js` — імітація пристрою, його не змінюй.
      en: |
        The expense tracker's settings screen shows `Server: undefined`, and the console has a `summarizeExpenses input: …` line. Run it and see for yourself.

        There are two defects:

        - `config.js` reads the address as if the app opened `.env` on the phone, like Node.js. This is what the project's `.env` contains:

          ```text
          EXPO_PUBLIC_EXPENSES_URL=http://192.168.1.20:4000
          ```

          Look at how the value is named, and read it in the form the Expo bundler writes in at build time.
        - `domain/summarize.js` is shared code; the web client runs it too. Remove the debug output from it. `__DEV__` does not help here: the web has no such variable. If you need such a line, it belongs in native code — like the `if (__DEV__)` in `SettingsScreen.jsx`.

        `simulated-device.js` simulates the device; do not change it.
    testTitles:
      "the screen shows the server address from the build":
        uk: "Екран показує адресу сервера, вписану під час збирання"
        en: "The screen shows the server address from the build"
      "summarizeExpenses returns the total in minor units":
        uk: "`summarizeExpenses` повертає суму в копійках"
        en: "`summarizeExpenses` returns the total in minor units"
      "summarizeExpenses prints nothing":
        uk: "`summarizeExpenses` нічого не виводить"
        en: "`summarizeExpenses` prints nothing"
      "summarizeExpenses works without __DEV__, as in the web client":
        uk: "`summarizeExpenses` працює без `__DEV__`, як у веб-клієнті"
        en: "`summarizeExpenses` works without `__DEV__`, as in the web client"
    hints:
      nudge:
        uk: "Порівняй назву в `.env` проєкту (вона є в умові) з назвою, яку читає `config.js`. А потім подумай, хто ще, крім застосунку на телефоні, викликає `summarizeExpenses`."
        en: "Compare the name in the project's `.env` (it is in the task) with the name `config.js` reads. Then think about who else, apart from the app on the phone, calls `summarizeExpenses`."
      explanation:
        uk: "Expo підставляє лише значення з префіксом `EXPO_PUBLIC_`, записані через крапку: наприклад, `process.env.EXPO_PUBLIC_SUPPORT_EMAIL`. Будь-яка інша назва лишається в коді без значення. Спільний модуль має працювати однаково в браузері й на телефоні, тому не звертається ні до консолі для налагодження, ні до `__DEV__`, якого браузер не знає."
        en: "Expo substitutes only values with the `EXPO_PUBLIC_` prefix written with a dot: for example, `process.env.EXPO_PUBLIC_SUPPORT_EMAIL`. Any other name stays in the code without a value. A shared module must work the same in a browser and on a phone, so it touches neither the console for debugging nor `__DEV__`, which a browser does not know."
    solutionNote:
      uk: "`process.env.EXPO_PUBLIC_EXPENSES_URL` збирач Expo замінює рядком з `.env` під час збирання — у debug це робить dev-сервер, у release значення вже у файлі застосунку. Спільна `summarizeExpenses` тепер лише рахує: налагоджувальний вивід лишився в native-екрані під `if (__DEV__)`, де він є тільки в debug."
      en: "The Expo bundler replaces `process.env.EXPO_PUBLIC_EXPENSES_URL` with the string from `.env` at build time — in debug the dev server does it, in release the value is already in the app's file. The shared `summarizeExpenses` now only computes: the debug output stays in the native screen under `if (__DEV__)`, where it exists only in debug."
    feedback:
      - when: { test: "the screen shows the server address from the build" }
        message:
          uk: "Ця перевірка очікує на екрані `Сервер: http://192.168.1.20:4000`. Якщо там `undefined`, `config.js` читає назву, якої збирач не підставляє: значення в `.env` має префікс `EXPO_PUBLIC_`, і читати його треба саме так, через крапку."
          en: "This check expects `Server: http://192.168.1.20:4000` on the screen. If it shows `undefined`, `config.js` reads a name the bundler does not substitute: the value in `.env` has the `EXPO_PUBLIC_` prefix, and it must be read exactly like that, with a dot."
      - when: { test: "summarizeExpenses returns the total in minor units" }
        message:
          uk: "Ця перевірка очікує, що для витрат на 9990 і 21050 копійок `summarizeExpenses` поверне 31040. Прибираючи вивід, не чіпай обчислення суми."
          en: "This check expects `summarizeExpenses` to return 31040 for expenses of 9990 and 21050 minor units. While removing the output, leave the sum calculation alone."
      - when: { test: "summarizeExpenses prints nothing" }
        message:
          uk: "Ця перевірка очікує, що виклик `summarizeExpenses` нічого не друкує в консоль. Спільний код не має налагоджувального виводу — прибери з нього `console.log`, навіть під умовою."
          en: "This check expects a call to `summarizeExpenses` to print nothing to the console. Shared code has no debug output — remove the `console.log` from it, even under a condition."
      - when: { test: "summarizeExpenses works without __DEV__, as in the web client" }
        message:
          uk: "Ця перевірка викликає `summarizeExpenses` без глобальної `__DEV__`, як це буде у веб-клієнті. Якщо вона падає з `ReferenceError: __DEV__ is not defined`, у спільному коді лишилося звертання до `__DEV__` — прибери його звідти."
          en: "This check calls `summarizeExpenses` without a global `__DEV__`, as the web client will. If it fails with `ReferenceError: __DEV__ is not defined`, shared code still refers to `__DEV__` — remove it from there."
    limits:
      uk: "Імітація в перегляді react-native-web. `simulated-device.js` заздалегідь дає `process.env` лише значення з префіксом `EXPO_PUBLIC_` — так виглядає результат роботи збирача. Справжній збирач ще й вимагає запису через крапку: варіант із деструктуризацією (`const { … } = process.env`) тут спрацює, а в Expo — ні. Перевір конфігурацію на своїй заявленій цілі."
      en: "A simulation in the react-native-web preview. `simulated-device.js` gives `process.env` only the values with the `EXPO_PUBLIC_` prefix in advance — that is what the bundler's work looks like. A real bundler also requires the dot form: a destructuring version (`const { … } = process.env`) works here but not in Expo. Check the config on your declared target."

  - id: to-project
    kind: transfer
    capstoneStep: RN-01
    body:
      uk: "У native-підпроєкті проєкту доменний пакет лишиться без `__DEV__` і без налагоджувальних логів, а все, що залежить від режиму збирання чи `.env`, житиме в native-коді. Режим збирання (debug) ти запишеш разом із підтвердженням із заявленої цілі."
      en: "In the project's native subproject the domain package stays free of `__DEV__` and debug logs, while everything that depends on the build mode or `.env` lives in native code. You will record the build mode (debug) together with the confirmation from your declared target."
