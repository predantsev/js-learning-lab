id: rn-01-07-independent-explain-boundary
unit: RN-01
title:
  uk: "Самостійно: перевірка типів спільної моделі та пояснення межі"
  en: "Independent: typecheck the shared model and explain the boundary"
kind: assessment
minutes: 20
contentVersion: 1
purpose:
  uk: "Перевірка вмінь розділу без підказок. Ти очистиш від вебових звичок незнайомий компонент React Native, пояснюватимеш, чого не може довести перегляд у браузері, і на своєму комп’ютері змусиш строгий `tsc` знайти доменний імпорт, що тягне за собою DOM."
  en: "A check of the unit's skills without hints. You clean web habits out of an unfamiliar React Native component, explain what a browser preview cannot prove, and on your own computer make strict `tsc` find a domain import that drags the DOM along."
objectives:
  - uk: "Перевірити спільну доменну модель строгим `tsc` з native-проєкту й прибрати імпорт, який тягне за собою тип DOM."
    en: "Typecheck the shared domain model with strict tsc from the native project and remove any import that drags in a DOM type."
  - uk: "Пояснити своїми словами, чому перегляд верстки в браузері не може перевірити native API, з двома конкретними прикладами зі свого hello-екрана."
    en: "Explain in your own words why a browser layout preview cannot verify native APIs, with two concrete examples from your own hello screen."
prerequisites: [rn-01-06-debug-setup-failure, rn-01-04-shared-domain-code]
subskills:
  - { family: N-01, skill: "native vs DOM", depth: assess }
glossary: []
selfCheck: [wish-summary]

blocks:
  - id: how-it-works
    kind: explanation
    title:
      uk: "Як влаштовано перевірку"
      en: "How this check works"
    body:
      uk: |
        Три частини, усі без підказок:

        1. **Компонент у перегляді.** Перенеси незнайомий екран на native-компоненти — перевірки оцінять поведінку.
        2. **Що доводить перегляд.** Три короткі питання про екрани, які «добре виглядають у браузері».
        3. **Локально.** Строгий `tsc` з native-проєкту знайде доменний модуль, який тягне за собою DOM, а ти запишеш дві речі, які бачив лише на заявленій цілі.

        Якщо native-інструментів у тебе немає, третю частину познач кнопкою «У мене немає емулятора чи пристрою» — перші дві від цього не залежать.
      en: |
        Three parts, all without hints:

        1. **A component in the preview.** Move an unfamiliar screen onto native components — the checks assess behaviour.
        2. **What the preview proves.** Three short questions about screens that “look fine in the browser”.
        3. **Locally.** Strict `tsc` run from the native project finds a domain module that drags the DOM along, and you write down two things you saw only on your declared target.

        If you have no native tooling, mark the third part with the “I have no emulator or device” button — the first two do not depend on it.

  - id: recall-type-import
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: empty-import-loads
        from: js-14-07-modules-type-imports
        prompt:
          uk: "У `domain/format.ts` є рядок `import { type CardProps } from \"../web/card.ts\";` — це єдине, що він імпортує. `tsconfig.json` має `verbatimModuleSyntax`. Чи завантажиться `web/card.ts`, коли застосунок виконає зібраний `domain/format.js`?"
          en: "`domain/format.ts` has the line `import { type CardProps } from \"../web/card.ts\";` — the only thing it imports. `tsconfig.json` has `verbatimModuleSyntax`. Will `web/card.ts` be loaded when the app runs the compiled `domain/format.js`?"
        answer:
          type: choice
          options:
            - id: loads
              text:
                uk: "Так: лишається `import {} from \"../web/card.js\"`, і модуль виконується"
                en: "Yes: `import {} from \"../web/card.js\"` remains, and the module runs"
            - id: removed
              text:
                uk: "Ні: імпорт лише типу зникає повністю"
                en: "No: an import of only a type disappears completely"
              why:
                uk: "Повністю зникає `import type { … }`. Слово `type` усередині фігурних дужок прибирає лише одну назву, а сам рядок імпорту лишається."
                en: "What disappears completely is `import type { … }`. The word `type` inside the braces removes only one name; the import line itself stays."
            - id: error
              text:
                uk: "Ні: `tsc` відмовиться компілювати такий рядок"
                en: "No: `tsc` refuses to compile such a line"
              why:
                uk: "`tsc` компілює цей рядок без помилок — він просто лишає порожній імпорт."
                en: "`tsc` compiles this line without errors — it just leaves an empty import."
          correct: [loads]
        explanation:
          uk: "Після `tsc` порожній імпорт усе одно завантажує модуль, а з ним — і DOM-код `web/card.ts`. Збирач Expo компілює TypeScript інакше: у нашій перевірці `npx expo export` (SDK 57) прибрав такий імпорт повністю, навіть із `verbatimModuleSyntax`. Покладатися на різницю інструментів не варто: з платформних модулів беруть типи лише через `import type` — тоді рядок зникає всюди."
          en: "After `tsc` the empty import still loads the module, and with it the DOM code of `web/card.ts`. The Expo bundler compiles TypeScript differently: in our check `npx expo export` (SDK 57) removed such an import completely, even with `verbatimModuleSyntax`. Do not rely on the difference between tools: types from platform modules are taken only through `import type` — then the line disappears everywhere."

  - id: wish-summary
    kind: exercise
    mode: independent
    assessment: true
    runtime: concept-preview
    dir: wish-summary
    entry: main.jsx
    editable: [WishSummary.jsx]
    strings:
      title: { uk: "Мої бажання", en: "My wishes" }
      total: { uk: "Бажане з ціною", en: "Wanted with a price" }
      toggle: { uk: "Показати й отримані", en: "Show acquired too" }
      w01: { uk: "Навушники", en: "Headphones" }
      w02: { uk: "Настільна лампа", en: "Desk lamp" }
      w03: { uk: "Велосипед", en: "Bicycle" }
      w04: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      w05: { uk: "Квитки на концерт", en: "Concert tickets" }
      w06: { uk: "Термочашка", en: "Travel mug" }
    title:
      uk: "Підсумок списку бажань для телефона"
      en: "A wishlist summary for the phone"
    instructions:
      uk: |
        `WishSummary.jsx` перенесли з веб-клієнта поспіхом. У перегляді він виглядає майже правильно, але на телефоні не запрацює.

        Зроби так, щоб компонент працював і на телефоні, не змінюючи того, що він показує:

        - заголовок з роллю heading;
        - рядок «Бажане з ціною: …» з сумою, яку дає `summarizeItems`;
        - кнопка «Показати й отримані», що перемикає, чи показувати вже отримані бажання;
        - назви видимих бажань.

        Перевірки оцінюють те, що компонент малює в перегляді, і помилки, які react-native-web друкує в консоль, а дотик телефона імітують — викликають `onPress` кнопки.
      en: |
        `WishSummary.jsx` was ported from the web client in a hurry. In the preview it looks almost right, but on a phone it would not work.

        Make the component work on a phone too, without changing what it shows:

        - a title with the heading role;
        - the line “Wanted with a price: …” with the total from `summarizeItems`;
        - a “Show acquired too” button that toggles whether acquired wishes are shown;
        - the names of the visible wishes.

        The checks assess what the component draws in the preview and the errors react-native-web prints to the console, and they simulate a phone's tap by calling the button's `onPress`.
    testTitles:
      "every element of the summary is drawn by a React Native component":
        uk: "Кожен елемент підсумку намальовано компонентом React Native"
        en: "Every element of the summary is drawn by a React Native component"
      "no text sits outside a Text component":
        uk: "Жоден текст не стоїть поза `Text`"
        en: "No text sits outside a `Text` component"
      "the summary shows the total of wanted wishes with a price":
        uk: "Підсумок показує суму бажаного з ціною"
        en: "The summary shows the total of wanted wishes with a price"
      "pressing the toggle also shows the acquired wishes":
        uk: "Натискання перемикача показує й отримані бажання"
        en: "Pressing the toggle also shows the acquired wishes"
      "a tap on a phone reaches the toggle through onPress":
        uk: "Дотик на телефоні доходить до перемикача через `onPress`"
        en: "A tap on a phone reaches the toggle through `onPress`"
    solutionNote:
      uk: "Кожен вебовий елемент замінено native-відповідником: `ul`/`li` — `View` і `Text`, клацання по `View` — `Pressable` з `onPress`, `className` — `style`. Рядок із сумою тепер у власному `Text`. Доменна `summarizeItems` лишилася без змін — переписано лише платформний UI."
      en: "Every web element was replaced by its native counterpart: `ul`/`li` by `View` and `Text`, a click on a `View` by `Pressable` with `onPress`, `className` by `style`. The total line now sits in its own `Text`. The domain `summarizeItems` stayed unchanged — only the platform UI was rewritten."
    feedback:
      - when: { test: "every element of the summary is drawn by a React Native component" }
        message:
          uk: "Ця перевірка очікує, що кожен елемент створено через `View`, `Text` або `Pressable`. Вебові теги на кшталт `<ul>`, `<li>` чи `<div>` перегляд покаже, бо він працює в браузері, але на телефоні їх немає."
          en: "This check expects every element to come from `View`, `Text` or `Pressable`. Web tags such as `<ul>`, `<li>` or `<div>` show up in the preview because it runs in a browser, but a phone has none of them."
      - when: { test: "no text sits outside a Text component" }
        message:
          uk: "Ця перевірка шукає в консолі помилку react-native-web `Unexpected text node … A text node cannot be a child of a <View>`. На телефоні текст поза `Text` — помилка: кожен шматок тексту має бути всередині `Text`."
          en: "This check looks for the react-native-web console error `Unexpected text node … A text node cannot be a child of a <View>`. On a phone, text outside `Text` is an error: every piece of text must sit inside a `Text`."
      - when: { test: "the summary shows the total of wanted wishes with a price" }
        message:
          uk: "Ця перевірка очікує на екрані «Бажане з ціною: 365» — суму, яку повертає `summarizeItems` для шести бажань. Не змінюй обчислення, лише те, у що загорнуто рядок."
          en: "This check expects “Wanted with a price: 365” on the screen — the total `summarizeItems` returns for the six wishes. Do not change the calculation, only what the line is wrapped in."
      - when: { test: "pressing the toggle also shows the acquired wishes" }
        message:
          uk: "Ця перевірка шукає кнопку з назвою «Показати й отримані», клацає її в перегляді й чекає на отримані бажання в списку. Кнопкою елемент робить `role=\"button\"` (або `accessibilityRole=\"button\"`), а натискання обробляє `Pressable` з `onPress`."
          en: "This check looks for a button named “Show acquired too”, clicks it in the preview and waits for the acquired wishes in the list. `role=\"button\"` (or `accessibilityRole=\"button\"`) makes the element a button, and a `Pressable` with `onPress` handles the press."
      - when: { test: "a tap on a phone reaches the toggle through onPress" }
        message:
          uk: "Ця перевірка доставляє дотик так, як це робить телефон: шукає над кнопкою «Показати й отримані» компонент із пропом `onPress`, викликає його й чекає, що отримані бажання з’являться в списку або зникнуть. У перегляді спрацьовує й `onClick`, але на телефоні дотик пальцем його не викликає."
          en: "This check delivers a tap the way a phone does: it looks above the “Show acquired too” button for a component with an `onPress` prop, calls it and waits for the acquired wishes to appear in the list or disappear. In the preview `onClick` fires too, but on a phone a finger tap does not call it."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити. Найчастіше причина — незакритий тег після заміни: кожен `<View>`, `<Text>` і `<Pressable>` потрібно закрити своїм тегом."
          en: "The code could not start. The usual cause is an unclosed tag after a replacement: every `<View>`, `<Text>` and `<Pressable>` needs its own closing tag."
    limits:
      uk: "Перевірки запускають компонент у перегляді react-native-web: вони бачать, із чого він складається (класи `css-view-…`, `css-text-…`), і помилки консолі, а дотик телефона лише імітують викликом `onPress`. Вони не доводять, як підсумок виглядає й реагує на дотик на телефоні: там інші шрифти, native view і жести."
      en: "The checks run the component in the react-native-web preview: they see what it is made of (the `css-view-…` and `css-text-…` classes) and the console errors, and they only simulate a phone's tap by calling `onPress`. They do not prove how the summary looks and responds to touch on a phone: there the fonts, native views and gestures differ."

  - id: preview-keyboard
    kind: prediction
    prompt:
      uk: "Екран входу з полем «Пошта» внизу. У перегляді в браузері поле видно, і в нього можна друкувати. Що з цього перегляд **не** може перевірити?"
      en: "A sign-in screen with an “Email” field at the bottom. In the browser preview the field is visible and you can type into it. What can the preview **not** verify?"
    runnable: false
    answer:
      type: choice
      options:
        - id: keyboard
          text:
            uk: "Чи не закриє поле екранна клавіатура телефона"
            en: "Whether the phone's on-screen keyboard covers the field"
        - id: state
          text:
            uk: "Чи оновлюється стан компонента, коли в поле вводять текст"
            en: "Whether the component's state updates when text is typed into the field"
          why:
            uk: "Стан — логіка React, вона в перегляді та сама. Це перегляд якраз перевіряє."
            en: "State is React logic, and it is the same in the preview. That is exactly what the preview does check."
        - id: validation
          text:
            uk: "Чи доменна функція відхиляє порожню пошту"
            en: "Whether the domain function rejects an empty email"
          why:
            uk: "Доменна функція — звичайний JavaScript, у перегляді вона виконується так само, як на телефоні."
            en: "A domain function is plain JavaScript; it runs in the preview exactly as on a phone."
      correct: [keyboard]
    explanation:
      uk: "У браузері на комп’ютері екранної клавіатури немає, тож перекриття поля видно лише на емуляторі чи пристрої. Логіку стану й доменні функції перегляд перевіряє чесно."
      en: "A browser on a computer has no on-screen keyboard, so a covered field shows up only on an emulator or a device. The preview checks state logic and domain functions honestly."

  - id: preview-notch
    kind: prediction
    prompt:
      uk: "Заголовок списку справ стоїть у самому верху екрана. У перегляді в браузері його видно повністю. Що з цього випливає для iPhone з вирізом угорі?"
      en: "A task list's title sits at the very top of the screen. In the browser preview it is fully visible. What follows for an iPhone with a notch at the top?"
    runnable: false
    answer:
      type: choice
      options:
        - id: unknown
          text:
            uk: "Нічого: безпечних зон пристрою (safe-area insets) перегляд не має, тож перевірити це можна лише на цілі"
            en: "Nothing: the preview has no device safe-area insets, so this can be checked only on a target"
        - id: fine
          text:
            uk: "На iPhone заголовок теж буде видно повністю"
            en: "On the iPhone the title will be fully visible too"
          why:
            uk: "Вікно браузера прямокутне й без вирізу. Чи заходить виріз на заголовок, видно лише на пристрої чи симуляторі з таким екраном."
            en: "A browser window is rectangular and has no notch. Whether the notch overlaps the title shows only on a device or a simulator with such a screen."
        - id: always-covered
          text:
            uk: "На iPhone виріз точно закриє заголовок"
            en: "On the iPhone the notch will definitely cover the title"
          why:
            uk: "Це теж здогадка: перегляд не дає даних ні в той, ні в інший бік. Відповідь дає лише перевірка на цілі."
            en: "That is a guess too: the preview gives no data either way. Only a check on a target answers it."
      correct: [unknown]
    explanation:
      uk: "Перегляд не знає про виріз, рамку й системні панелі телефона. Безпечні зони — тема наступного розділу, і перевіряють їх на заявленій цілі."
      en: "The preview knows nothing about the phone's notch, corners and system bars. Safe areas are a topic of the next unit, and they are checked on the declared target."

  - id: preview-views
    kind: prediction
    prompt:
      uk: "Ти відкрив DevTools для перегляду картки React Native і бачиш `<div class=\"css-view-…\">`. Що це означає?"
      en: "You opened DevTools on a React Native card preview and see `<div class=\"css-view-…\">`. What does it mean?"
    runnable: false
    answer:
      type: choice
      options:
        - id: rnw-output
          text:
            uk: "Так react-native-web намалював `View` у браузері; на телефоні на цьому місці буде native view, а не `div`"
            en: "That is how react-native-web drew a `View` in the browser; on a phone there will be a native view in its place, not a `div`"
        - id: same-on-phone
          text:
            uk: "На телефоні буде той самий `div` з тим самим класом"
            en: "The phone will have the same `div` with the same class"
          why:
            uk: "На телефоні немає ні DOM, ні CSS-класів: native-рендерер створює `android.view.View` чи `UIView`."
            en: "A phone has neither a DOM nor CSS classes: the native renderer creates an `android.view.View` or a `UIView`."
        - id: bug
          text:
            uk: "Компонент написано неправильно: у React Native не має бути `div`"
            en: "The component is written wrongly: there must be no `div` in React Native"
          why:
            uk: "У коді стоїть `View` — `div` з’явився під час commit у перегляді. Помилкою був би `div`, написаний у коді власноруч."
            en: "The code has a `View` — the `div` appeared during the commit in the preview. A `div` written in the code by hand would be the mistake."
      correct: [rnw-output]
    explanation:
      uk: "DOM у перегляді — результат commit через react-native-web. Він показує структуру дерева, але не native view, які створить телефон."
      en: "The DOM in the preview is the result of a commit through react-native-web. It shows the tree's structure, but not the native views the phone will create."

  - id: typecheck-boundary
    kind: local-task
    runtime: local-native
    title:
      uk: "Строгий tsc із native-проєкту й пояснення межі"
      en: "Strict tsc from the native project, and the boundary explained"
    intro:
      uk: |
        Без підказок. Працюєш у `~/js-course`: `rn-hello` з уроку про hello-екран — native-проєкт, а нова тека `shared-lab` грає роль робочого простору з `domain/` і `web/`. Створи два файли нижче точно так, як написано: доменний модуль навмисно імпортує вебовий.

        Завдання:

        - налаштуй `rn-hello/tsconfig.json` так, щоб строгий `tsc` перевіряв і `../shared-lab/domain/**/*.ts`, і щоб типи DOM **не** були доступні (у базовому `tsconfig` Expo вони є: `"lib": ["DOM", "ESNext"]`);
        - запусти `npx tsc --noEmit` у `rn-hello`, запиши помилку дослівно й з’ясуй, який імпорт затягнув DOM;
        - прибери цей імпорт так, щоб `formatWish` лишилася доменною функцією, а `tsc` завершився без помилок;
        - у `~/js-course/rn-hello/EVIDENCE.md` додай розділ «Межа»: своїми словами — чому перегляд у браузері не перевіряє native API, і дві речі, які ти бачив лише на своїй заявленій цілі (наприклад, значення `Platform.OS`, системний шрифт, рядок статусу, поведінку дотику).

        Перевірено на macOS з TypeScript 6.0.3 із шаблону Expo SDK 57: з типами DOM `tsc` цю помилку пропускає, без них — знаходить.

        **`~/js-course/shared-lab/domain/format.ts`:**

        ```ts
        import { showInTitle } from '../web/browser-title';

        export type Wish = {
          readonly id: string;
          name: string;
          price: number | null;
          acquired: boolean;
        };

        // Formats one wish for any client: plain data in, plain text out.
        export function formatWish(wish: Wish, noPrice: string): string {
          const label = `${wish.name} — ${wish.price === null ? noPrice : wish.price}`;
          showInTitle(label);
          return label;
        }
        ```

        **`~/js-course/shared-lab/web/browser-title.ts`:**

        ```ts
        // Web-only helper: shows a text in the browser tab.
        export function showInTitle(text: string): void {
          document.title = text;
        }
        ```
      en: |
        No hints. You work in `~/js-course`: `rn-hello` from the hello screen lesson is the native project, and a new folder `shared-lab` plays the workspace with `domain/` and `web/`. Create the two files below exactly as written: the domain module deliberately imports a web one.

        The task:

        - configure `rn-hello/tsconfig.json` so that strict `tsc` also checks `../shared-lab/domain/**/*.ts`, and so that the DOM types are **not** available (Expo's base `tsconfig` has them: `"lib": ["DOM", "ESNext"]`);
        - run `npx tsc --noEmit` in `rn-hello`, write down the error word for word and work out which import dragged the DOM in;
        - remove that import so that `formatWish` stays a domain function and `tsc` finishes without errors;
        - in `~/js-course/rn-hello/EVIDENCE.md` add a section “Boundary”: in your own words, why a browser preview does not verify native APIs, and two things you saw only on your declared target (for example the value of `Platform.OS`, the system font, the status bar, how a touch behaves).

        Checked on macOS with TypeScript 6.0.3 from the Expo SDK 57 template: with the DOM types `tsc` lets this error through, without them it finds it.

        **`~/js-course/shared-lab/domain/format.ts`:**

        ```ts
        import { showInTitle } from '../web/browser-title';

        export type Wish = {
          readonly id: string;
          name: string;
          price: number | null;
          acquired: boolean;
        };

        // Formats one wish for any client: plain data in, plain text out.
        export function formatWish(wish: Wish, noPrice: string): string {
          const label = `${wish.name} — ${wish.price === null ? noPrice : wish.price}`;
          showInTitle(label);
          return label;
        }
        ```

        **`~/js-course/shared-lab/web/browser-title.ts`:**

        ```ts
        // Web-only helper: shows a text in the browser tab.
        export function showInTitle(text: string): void {
          document.title = text;
        }
        ```
    tools:
      - { name: "TypeScript", version: "6.0.3", note: { uk: "з шаблону Expo SDK 57 у `rn-hello`, запускається через `npx tsc`", en: "from the Expo SDK 57 template in `rn-hello`, run through `npx tsc`" } }
      - { name: "rn-hello", note: { uk: "проєкт з уроку про hello-екран", en: "the project from the hello screen lesson" } }
    steps:
      - text:
          uk: "Створи теки `shared-lab/domain` і `shared-lab/web` у `~/js-course` і два файли з вступу."
          en: "Create the folders `shared-lab/domain` and `shared-lab/web` in `~/js-course` and the two files from the intro."
        command: "mkdir -p ~/js-course/shared-lab/domain ~/js-course/shared-lab/web"
      - text:
          uk: "Налаштуй `tsconfig.json`, запусти строгу перевірку в `rn-hello` і запиши вивід."
          en: "Configure `tsconfig.json`, run the strict check in `rn-hello` and write down the output."
        command: "cd ~/js-course/rn-hello\nnpx tsc --noEmit"
      - text:
          uk: "Прибери імпорт, що тягне DOM, повтори перевірку до чистого результату й допиши розділ «Межа» в `EVIDENCE.md`. Закоміть зміни в `rn-hello`."
          en: "Remove the import that drags the DOM in, repeat the check until it is clean and add the “Boundary” section to `EVIDENCE.md`. Commit the changes in `rn-hello`."
    verify:
      - id: dom-found
        text:
          uk: "Строгий `tsc` без типів DOM показав помилку про `document` у вебовому модулі, і я записав її дослівно."
          en: "Strict `tsc` without the DOM types showed an error about `document` in the web module, and I wrote it down word for word."
      - id: clean
        text:
          uk: "Після ремонту `npx tsc --noEmit` у `rn-hello` завершується без жодного рядка виводу, а `formatWish` повертає ту саму мітку."
          en: "After the repair `npx tsc --noEmit` in `rn-hello` finishes without a single line of output, and `formatWish` returns the same label."
      - id: boundary
        text:
          uk: "У `EVIDENCE.md` є пояснення межі своїми словами й дві речі, які я бачив лише на заявленій цілі."
          en: "`EVIDENCE.md` has the boundary explained in my own words and two things I saw only on my declared target."
    troubleshooting:
      - problem:
          uk: "`npx tsc --noEmit` нічого не пише ще до ремонту"
          en: "`npx tsc --noEmit` prints nothing even before the repair"
        fix:
          uk: "Тоді `tsc` або не бачить файлів `shared-lab`, або досі має типи DOM. Перевір обидві настройки, про які йдеться в завданні, у своєму `tsconfig.json`."
          en: "Then `tsc` either does not see the `shared-lab` files or still has the DOM types. Check both settings the task talks about in your `tsconfig.json`."
      - problem:
          uk: "Після ремонту `tsc` скаржиться на `App.tsx` чи інші файли `rn-hello`"
          en: "After the repair `tsc` complains about `App.tsx` or other `rn-hello` files"
        fix:
          uk: "Прочитай повідомлення: файл, рядок і назву помилки. Якщо це твоя зміна з hello-екрана, виправ її; якщо зміни не твої — `git diff` покаже, що змінилося від останнього commit."
          en: "Read the message: the file, the line and the error name. If it is your change from the hello screen, fix it; if the changes are not yours, `git diff` shows what changed since the last commit."
    recovery:
      uk: "Тека `shared-lab` окрема, а зміни в `rn-hello` — лише `tsconfig.json` і `EVIDENCE.md`. `git restore tsconfig.json` повертає закомічену версію; файли `shared-lab` можна створити заново з вступу."
      en: "The `shared-lab` folder is separate, and the only changes in `rn-hello` are `tsconfig.json` and `EVIDENCE.md`. `git restore tsconfig.json` brings back the committed version; the `shared-lab` files can be created again from the intro."
