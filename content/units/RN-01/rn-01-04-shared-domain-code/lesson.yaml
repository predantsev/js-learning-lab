id: rn-01-04-shared-domain-code
unit: RN-01
title:
  uk: "Спільний доменний код для різних платформ"
  en: "Shared domain code across platforms"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Визначити, які модулі робочого простору (`domain/` чи `web/`) native-застосунок може імпортувати без змін і чому: без DOM, без сховища браузера, без глобальних об’єктів платформи."
    en: "Identify which modules of the exported workspace (domain/ versus web/) native/ can import unchanged, and why: no DOM, no browser storage, no platform globals."
  - uk: "Запустити чисте доменне перетворення в курсі й переконатися, що воно дає той самий результат для обох клієнтів."
    en: "Run a pure domain transform in-course and confirm it yields the same output it gave in the web client."
  - uk: "Винести виклик, доступний лише в браузері, з доменної функції в параметр, щоб функція лишилася платформно-нейтральною."
    en: "Move a browser-only call out of a domain helper behind a parameter so the helper stays platform-neutral."
prerequisites: [rn-01-03-env-versions-debug-release, re-09-04-reuse-boundaries]
subskills:
  - { family: N-01, skill: "TS/domain reuse", depth: intro }
glossary: [shared-domain-package, platform-neutral-module]
selfCheck: [predict-native-imports, due-count]

blocks:
  - id: what-moves
    kind: explanation
    title:
      uk: "Що переходить у native без змін"
      en: "What moves to native unchanged"
    body:
      uk: |
        Доменний код (типи, валідатори, чисті перетворення) окремо від платформного (React-компоненти, адаптер сховища) — цю межу ти вже проводив у React-розділі. У цьому уроці доменну частину називаємо `domain/`, а платформну частину веб-клієнта — `web/`; у твоєму проєкті ці теки можуть називатися інакше. Native-застосунок стане третьою частиною поруч. Що він може взяти?

        - **З `domain/` — усе, що працює лише з даними**: `summarizeHabit`, `validateHabit`, типи, фікстури. Це [[shared-domain-package|спільний доменний пакет]]: його імпортують, а не копіюють.
        - **З `web/` — нічого.** Компоненти з `<li>` і `<button>` на телефоні не працюють, а React Native-компоненти пишуть заново. Копіювати веб-компоненти й міняти теги — це писати ту саму логіку двічі.

        Модуль спільний лише тоді, коли він [[platform-neutral-module|платформно-нейтральний]]: не торкається `document`, `window`, `localStorage` чи `__DEV__`. На телефоні немає ні DOM, ні `localStorage` (там своє сховище), а в браузері немає `__DEV__`.

        І пастка: TypeScript тут **не захищає**. Шаблон Expo підключає типи DOM (`"lib": ["DOM", "ESNext"]` у базовому `tsconfig`), тож `tsc` спокійно пропустить `document.title = …` у доменному коді. Помилку ти побачиш уже на телефоні.
      en: |
        Domain code (types, validators, pure transforms) kept apart from platform code (React components, the storage adapter) — you already drew this boundary in the React unit. In this lesson the domain part is called `domain/` and the web client's platform part `web/`; in your project these folders may have other names. The native app will become a third part next to them. What can it take?

        - **From `domain/` — everything that works only with data**: `summarizeHabit`, `validateHabit`, types, fixtures. This is the [[shared-domain-package|shared domain package]]: it is imported, not copied.
        - **From `web/` — nothing.** Components with `<li>` and `<button>` do not work on a phone, and React Native components are written anew. Copying web components and swapping the tags means writing the same logic twice.

        A module is shared only when it is [[platform-neutral-module|platform-neutral]]: it does not touch `document`, `window`, `localStorage` or `__DEV__`. A phone has no DOM and no `localStorage` (it has its own storage), and a browser has no `__DEV__`.

        And a trap: TypeScript does **not** protect you here. The Expo template includes the DOM types (`"lib": ["DOM", "ESNext"]` in its base `tsconfig`), so `tsc` happily lets `document.title = …` through in domain code. You will see the error only on the phone.

  - id: recall-boundary
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: which-import-breaks
        from: re-09-04-reuse-boundaries
        prompt:
          uk: "Який із цих рядків, дописаний у файл `domain/expenses.ts`, порушує межу повторного використання?"
          en: "Which of these lines, added to the file `domain/expenses.ts`, breaks the reuse boundary?"
        answer:
          type: choice
          options:
            - id: react-import
              code: "import { useState } from \"react\";"
            - id: type-import
              code: "import type { Expense } from \"./types\";"
              why:
                uk: "`import type` після компіляції зникає повністю: тип не тягне за собою жодного модуля, тож межу не порушує."
                en: "`import type` disappears completely after compiling: a type drags no module along, so it does not break the boundary."
            - id: domain-import
              code: "import { toMinor } from \"./money\";"
              why:
                uk: "Імпорт з іншого доменного модуля лишає код у домені. Межу порушує лише імпорт платформного коду."
                en: "An import from another domain module keeps the code inside the domain. Only an import of platform code breaks the boundary."
          correct: [react-import]
        explanation:
          uk: "Домен нічого не імпортує з платформи: ні React, ні `react-dom`, ні сховища, ні маршрутів. Платформний код імпортує домен — не навпаки."
          en: "The domain imports nothing from the platform: no React, no `react-dom`, no storage, no routes. Platform code imports the domain — never the other way round."
      - id: pure-same-result
        from: js-03-07-pure-vs-side-effects
        prompt:
          uk: "`const label = (expense) => expense.label.trim() + \" · \" + Date.now();` Чому цю функцію не можна назвати чистою?"
          en: "`const label = (expense) => expense.label.trim() + \" · \" + Date.now();` Why can this function not be called pure?"
        answer:
          type: choice
          options:
            - id: not-deterministic
              text:
                uk: "З тим самим аргументом вона щоразу повертає інший результат"
                en: "With the same argument it returns a different result each time"
            - id: trim-mutates
              text:
                uk: "`trim()` змінює рядок `expense.label`"
                en: "`trim()` changes the string `expense.label`"
              why:
                uk: "`trim()` повертає **новий** рядок і нічого не змінює в оригіналі."
                en: "`trim()` returns a **new** string and changes nothing in the original."
            - id: arrow
              text:
                uk: "Стрілкові функції не бувають чистими"
                en: "Arrow functions are never pure"
              why:
                uk: "Чистота залежить від того, що функція робить, а не від форми запису."
                en: "Purity depends on what a function does, not on how it is written."
          correct: [not-deterministic]
        explanation:
          uk: "`Date.now()` щоразу інший, тож результат залежить не лише від аргументу. Саме тому в доменних функціях курсу поточний день завжди передають параметром."
          en: "`Date.now()` differs every time, so the result depends on more than the argument. That is exactly why the course's domain functions always receive the current day as a parameter."

  - id: predict-native-imports
    kind: prediction
    prompt:
      uk: |
        Файл `domain/tasks.ts` планувальника експортує чотири функції:

        ```ts
        export function countDueTasks(tasks: Task[], today: string): number { … }      // лише фільтрує масив
        export function validateTask(input: TaskInput): Validation { … }             // лише перевіряє поля
        export function loadTasks(): Task[] { return JSON.parse(localStorage.getItem("jsll.planner.v1") ?? "{}").records; }
        export function showDueCount(count: number): void { document.title = `(${count})`; }
        ```

        Які з них native-застосунок може викликати без змін?
      en: |
        The planner's `domain/tasks.ts` file exports four functions:

        ```ts
        export function countDueTasks(tasks: Task[], today: string): number { … }      // only filters an array
        export function validateTask(input: TaskInput): Validation { … }             // only checks fields
        export function loadTasks(): Task[] { return JSON.parse(localStorage.getItem("jsll.planner.v1") ?? "{}").records; }
        export function showDueCount(count: number): void { document.title = `(${count})`; }
        ```

        Which of them can the native app call unchanged?
    runnable: false
    answer:
      type: choice
      options:
        - id: two-pure
          text:
            uk: "`countDueTasks` і `validateTask`"
            en: "`countDueTasks` and `validateTask`"
        - id: all-typed
          text:
            uk: "Усі чотири: файл на TypeScript, і `tsc` його пропускає"
            en: "All four: the file is TypeScript, and `tsc` accepts it"
          why:
            uk: "`tsc` пропускає їх, бо шаблон Expo підключає типи DOM. Але на телефоні немає ні `localStorage`, ні `document`: виклик `loadTasks` чи `showDueCount` там упаде."
            en: "`tsc` accepts them because the Expo template includes the DOM types. But a phone has neither `localStorage` nor `document`: calling `loadTasks` or `showDueCount` fails there."
        - id: storage-ok
          text:
            uk: "`countDueTasks`, `validateTask` і `loadTasks`: сховище є і на телефоні"
            en: "`countDueTasks`, `validateTask` and `loadTasks`: a phone has storage too"
          why:
            uk: "Сховище на телефоні є, але це не `localStorage` браузера: у React Native такого глобального об’єкта немає. Для нього пишуть окремий native-адаптер."
            en: "A phone does have storage, but not the browser's `localStorage`: React Native has no such global. It gets its own native adapter."
        - id: none-copy
          text:
            uk: "Жодної: для native-застосунку код переписують заново"
            en: "None: code is rewritten from scratch for the native app"
          why:
            uk: "Заново пишуть лише UI. Чисті функції, що працюють із даними, переходять без змін — у цьому й сенс спільного домену."
            en: "Only the UI is written anew. Pure functions that work with data move over unchanged — that is the whole point of a shared domain."
      correct: [two-pure]
    explanation:
      uk: "Спільне те, що працює лише з даними: `countDueTasks` і `validateTask`. `loadTasks` залежить від `localStorage`, а `showDueCount` — від `document`; їм місце в `web/`, а native-застосунок отримає власні адаптери."
      en: "What works only with data is shared: `countDueTasks` and `validateTask`. `loadTasks` depends on `localStorage` and `showDueCount` on `document`; they belong in `web/`, and the native app gets its own adapters."

  - id: workspace-graph
    kind: visual
    visual: diagram
    title:
      uk: "Хто імпортує domain/"
      en: "Who imports domain/"
    textEquivalent:
      uk: "У робочому просторі три частини. web/ і native/ обидві імпортують domain/, де лежать чисті функції, типи й фікстури. Веб-клієнт працює з localStorage через власний адаптер у web/. Якщо доменна функція сама звернеться до localStorage, domain/ почне залежати від браузера, і стрілка від native/ до domain/ зламається: на телефоні localStorage немає. Виправлення: виклик сховища повертається в адаптер web/, а доменна функція отримує записи параметром. Тоді обидва клієнти знову імпортують domain/ без змін."
      en: "The workspace has three parts. web/ and native/ both import domain/, which holds pure functions, types and fixtures. The web client works with localStorage through its own adapter in web/. If a domain function reaches for localStorage itself, domain/ starts to depend on the browser, and the arrow from native/ to domain/ breaks: a phone has no localStorage. The fix: the storage call goes back into the web/ adapter, and the domain function receives the records as a parameter. Then both clients import domain/ unchanged again."
    spec:
      layout: grid
      nodes:
        - { id: web, label: "web/", w: 120, col: 0, row: 0 }
        - { id: native, label: "native/", w: 120, col: 1, row: 0 }
        - { id: domain, label: "domain/", shape: round, w: 120, col: 0, row: 1 }
        - { id: storage, label: "localStorage", shape: cylinder, w: 120, col: 1, row: 1 }
      edges:
        - { id: web-domain, from: web, to: domain, label: "import" }
        - { id: native-domain, from: native, to: domain, label: "import" }
        - { id: web-storage, from: web, to: storage, label: { uk: "адаптер", en: "adapter" } }
        - { id: domain-storage, from: domain, to: storage, kind: dashed }
      hidden: [storage, web-storage, domain-storage]
      steps:
        - caption:
            uk: "`web/` і `native/` імпортують той самий `domain/`: чисті функції, типи, фікстури. Домен не імпортує нічого з платформи."
            en: "`web/` and `native/` import the same `domain/`: pure functions, types, fixtures. The domain imports nothing from a platform."
          highlight: [web, native, domain, web-domain, native-domain]
        - caption:
            uk: "Веб-клієнт зберігає записи в `localStorage` через **власний адаптер** у `web/`. Домен про це не знає."
            en: "The web client stores records in `localStorage` through **its own adapter** in `web/`. The domain knows nothing about it."
          show: [storage, web-storage]
          highlight: [web, web-storage, storage]
          dim: [native, native-domain]
        - caption:
            uk: "Хтось дописав у доменну функцію `localStorage.getItem(…)`. Тепер `domain/` залежить від браузера, і імпорт із `native/` ламається: на телефоні `localStorage` немає."
            en: "Someone added `localStorage.getItem(…)` to a domain function. Now `domain/` depends on the browser, and the import from `native/` breaks: a phone has no `localStorage`."
          show: [domain-storage]
          highlight: [domain-storage, native-domain, domain]
          annotate:
            - { id: native-domain, text: { uk: "ламається", en: "breaks" } }
        - caption:
            uk: "Виправлення: виклик сховища повертається в адаптер `web/`, а доменна функція отримує записи **параметром**. Обидва клієнти знову імпортують `domain/` без змін."
            en: "The fix: the storage call goes back into the `web/` adapter, and the domain function receives the records **as a parameter**. Both clients import `domain/` unchanged again."
          highlight: [web-domain, native-domain, web-storage]
          dim: [domain-storage]

  - id: two-clients
    kind: example
    runtime: browser-js
    dir: two-clients
    entry: index.ts
    strings:
      h01: { uk: "Ранкова зарядка", en: "Morning exercise" }
      h03: { uk: "Пити воду", en: "Drink water" }
      h06: { uk: "Прогулянка", en: "Go for a walk" }
    title:
      uk: "Одна доменна функція — два клієнти"
      en: "One domain function, two clients"
    body:
      uk: |
        Тут справжній JavaScript у браузері, без перегляду React Native. `domain/habits.ts` — чисті `summarizeHabit` і `validateHabit` трекера звичок. `web/row.ts` описує рядок, який намалював би веб-клієнт, а `native/row.ts` — рядок для native-екрана. Обидва отримують **той самий** результат `summarizeHabit`.

        Натисни **Запустити**: для кожної звички в консолі два рядки з однаковими даними, а наприкінці — результат `validateHabit` з ключами повідомлень.
      en: |
        This is real JavaScript in the browser, no React Native preview. `domain/habits.ts` holds the habit tracker's pure `summarizeHabit` and `validateHabit`. `web/row.ts` describes the row the web client would draw, and `native/row.ts` the row for a native screen. Both get **the same** result of `summarizeHabit`.

        Press **Run**: for each habit the console shows two lines with the same data, and at the end the result of `validateHabit` with message keys.
    tryIt:
      uk: |
        1. У `domain/fixtures.ts` додай звичці `h-06` дату `'2026-03-01'` у `completions` і запусти: обидва рядки `h-06` змінилися однаково — `1 ✓`.
        2. В `index.ts` заміни `day` на `'2026-02-28'` і запусти: позначку ✓ тепер має лише звичка `h-01` — знову в обох клієнтах однаково. Чиста функція з тими самими аргументами дає той самий результат будь-де.
        3. Перевір валідацію: передай у `validateHabit` назву `'Stretch'` і частоту `'weekly'` — консоль покаже `ok: true`.
      en: |
        1. In `domain/fixtures.ts` add the date `'2026-03-01'` to the `completions` of habit `h-06` and run: both `h-06` lines changed the same way — `1 ✓`.
        2. In `index.ts` change `day` to `'2026-02-28'` and run: only habit `h-01` has the ✓ mark now — again the same in both clients. A pure function with the same arguments gives the same result anywhere.
        3. Try the validation: pass the name `'Stretch'` and the frequency `'weekly'` to `validateHabit` — the console shows `ok: true`.

  - id: due-count
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: due-count
    entry: index.ts
    editable: [domain/tasks.ts, index.ts]
    strings:
      dueLabel: { uk: "На сьогодні справ", en: "Tasks due today" }
      t01: { uk: "Полити квіти", en: "Water the plants" }
      t02: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      t03: { uk: "Написати бабусі", en: "Write to grandma" }
      t04: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      t05: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
    title:
      uk: "Винеси localStorage з доменної функції"
      en: "Move localStorage out of a domain function"
    instructions:
      uk: |
        `countDueTasks` у `domain/tasks.ts` сама читає `localStorage`. У вебі це працює, а native-застосунок її викликати не зможе.

        Зроби її платформно-нейтральною:

        - нова сигнатура — `countDueTasks(tasks, today)`: функція отримує масив справ параметром і нічого не читає зі сховища;
        - в `index.ts` передай їй справи, які повертає `loadTasks()` з адаптера `web/storage.ts`.

        Програма має й далі друкувати `На сьогодні справ: 2`.
      en: |
        `countDueTasks` in `domain/tasks.ts` reads `localStorage` itself. On the web that works, but the native app cannot call it.

        Make it platform-neutral:

        - the new signature is `countDueTasks(tasks, today)`: the function receives the array of tasks as a parameter and reads nothing from storage;
        - in `index.ts` pass it the tasks returned by `loadTasks()` from the `web/storage.ts` adapter.

        The program must still print `Tasks due today: 2`.
    testTitles:
      "countDueTasks counts the tasks it is given":
        uk: "`countDueTasks` рахує справи, які отримала"
        en: "`countDueTasks` counts the tasks it is given"
      "countDueTasks ignores what localStorage holds":
        uk: "`countDueTasks` не зважає на вміст `localStorage`"
        en: "`countDueTasks` ignores what `localStorage` holds"
      "the web entry prints the due count of the stored tasks":
        uk: "Вхідний файл вебу друкує кількість справ зі сховища"
        en: "The web entry prints the due count of the stored tasks"
    hints:
      nudge:
        uk: "Звідки `countDueTasks` бере справи зараз? А хто в проєкті вже вміє читати їх зі сховища?"
        en: "Where does `countDueTasks` get its tasks now? And who in the project already knows how to read them from storage?"
      explanation:
        uk: "Платформну залежність виносять у параметр: функція отримує дані, а не йде по них сама. Для прикладу з іншого домену: `totalSpent(expenses)` замість функції, яка сама читає витрати зі сховища. Тоді виклик сховища лишається в адаптері `web/`, а вхідний файл передає результат цього виклику доменній функції."
        en: "A platform dependency is moved into a parameter: the function receives the data instead of fetching it itself. An example from another domain: `totalSpent(expenses)` instead of a function that reads the expenses from storage on its own. Then the storage call stays in the `web/` adapter, and the entry file passes its result to the domain function."
    solutionNote:
      uk: "Тепер `countDueTasks` — чиста функція: справи й день приходять параметрами, тож її так само викличе native-екран зі справами з власного сховища. `localStorage` знає лише адаптер `web/storage.ts`."
      en: "`countDueTasks` is now a pure function: the tasks and the day arrive as parameters, so a native screen can call it the same way with tasks from its own storage. Only the `web/storage.ts` adapter knows about `localStorage`."
    feedback:
      - when: { test: "countDueTasks counts the tasks it is given" }
        message:
          uk: "Ця перевірка викликає `countDueTasks(tasks, \"2026-03-02\")` з чотирма справами й очікує 2, а для порожнього масиву — 0. Справи — перший параметр, день — другий."
          en: "This check calls `countDueTasks(tasks, \"2026-03-02\")` with four tasks and expects 2, and 0 for an empty array. The tasks are the first parameter, the day the second."
      - when: { test: "countDueTasks ignores what localStorage holds" }
        message:
          uk: "Ця перевірка кладе в `localStorage` порожній список і очікує, що `countDueTasks` порахує саме передані справи. Функція не має читати сховище взагалі — навіть «якщо там щось є»."
          en: "This check puts an empty list into `localStorage` and expects `countDueTasks` to count exactly the tasks passed in. The function must not read storage at all — not even “if something is there”."
      - when: { test: "the web entry prints the due count of the stored tasks" }
        message:
          uk: "Ця перевірка кладе у сховище три справи (одна з них на сьогодні), запускає `index.ts` заново й очікує рядок `На сьогодні справ: 1`. Якщо всі перевірки падають разом, виправ спершу першу помилку в консолі: найімовірніше, `index.ts` ще викликає `countDueTasks` по-старому, з одним аргументом."
          en: "This check puts three tasks into storage (one of them due today), runs `index.ts` again and expects the line `Tasks due today: 1`. If every check fails at once, fix the first error in the console first: most likely `index.ts` still calls `countDueTasks` the old way, with one argument."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` часто означає, що `countDueTasks` отримала не той аргумент: наприклад, рядок дня замість масиву справ. Перевір виклик в `index.ts`: спершу справи, потім день."
          en: "A `TypeError` often means `countDueTasks` got the wrong argument: for example, the day string instead of the array of tasks. Check the call in `index.ts`: the tasks first, then the day."

  - id: to-project
    kind: transfer
    capstoneStep: RN-01
    body:
      uk: "У проєктному кроці native-підпроєкт імпортуватиме твій `domain/` за шляхом у робочому просторі, без копіювання. Перед цим перевір, що жодна доменна функція не звертається до `localStorage`, `document` чи `__DEV__`: такі виклики винеси в адаптери, як щойно в `countDueTasks`."
      en: "In the project step the native subproject will import your `domain/` by its path in the workspace, without copying. Before that, check that no domain function touches `localStorage`, `document` or `__DEV__`: move such calls into adapters, as you just did with `countDueTasks`."
