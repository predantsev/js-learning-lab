id: rn-01-02-toolchain-setup
unit: RN-01
title:
  uk: "Налаштовуємо toolchain, емулятор і пристрій"
  en: "Toolchain, emulator and device setup"
kind: local-task
minutes: 45
contentVersion: 1
purpose:
  uk: "Перегляд у браузері не показує native view, тож далі в цьому розділі тобі потрібна справжня ціль: Android-емулятор, iOS-симулятор або власний телефон. Ти обереш одну, встановиш для неї задокументовані інструменти й запишеш, що саме маєш і чого твій комп’ютер не підтримує. Якщо native-інструментів у тебе немає, ти позначиш завдання як невиконане й підеш далі — пізніше до нього можна повернутися."
  en: "The browser preview does not show native views, so the rest of this unit needs a real target: an Android emulator, an iOS simulator or your own phone. You choose one, install the documented tools for it and write down what exactly you have and what your computer does not support. If you have no native tooling, you mark the task as not performed and move on — you can come back to it later."
objectives:
  - uk: "Встановити задокументований для курсу native-toolchain і заявити одну ціль (Android-емулятор, iOS-симулятор або фізичний пристрій) з версією її ОС."
    en: "Install the course's documented native toolchain and declare one target (Android emulator, iOS simulator or physical device) with its OS version."
  - uk: "Записати кожну ціль, яку твій комп’ютер не підтримує (наприклад, iOS-симулятор не на macOS), як непідтриману — так, щоб це не блокувало наступних уроків."
    en: "Record every target your machine cannot support (for example an iOS simulator on a non-macOS computer) as unsupported, without blocking later lessons."
prerequisites: [rn-01-01-native-vs-web, js-15-03-node-and-package-manifest]
subskills:
  - { family: N-01, skill: "toolchain/emulator/device", depth: intro }
glossary: [emulator, simulator, physical-device, declared-target]
selfCheck: [predict-windows-targets]

blocks:
  - id: four-targets
    kind: explanation
    title:
      uk: "Одна ціль, а не всі одразу"
      en: "One target, not all of them"
    body:
      uk: |
        Курс працює з **Expo SDK 57** (у ньому React Native 0.86 і React 19.2). Для перших запусків тобі знадобиться застосунок **Expo Go**: він завантажує твій JavaScript з dev-сервера, тож native-частину збирати поки не треба.

        Ціль можна обрати одну з чотирьох:

        | Ціль | Комп’ютер | Що встановити |
        |---|---|---|
        | [[emulator\|Android-емулятор]] | macOS, Windows, Linux | Android Studio з Android SDK Platform 36 |
        | [[simulator\|iOS-симулятор]] | лише macOS | Xcode (для SDK 57 — 26.4 або новіший) |
        | Android-телефон | будь-який | Expo Go з Google Play, та сама Wi‑Fi |
        | iPhone | будь-який | Expo Go з App Store і вхід в обліковий запис Expo |

        Останній варіант — єдиний, для якого документація Expo вимагає входу в обліковий запис Expo і в Expo Go, і на комп’ютері. Курс жодного облікового запису не вимагає, тож якщо не хочеш його створювати, обери іншу ціль.

        Обрана ціль — твоя [[declared-target|заявлена ціль]]: тип, назва й версія ОС. Усі native-підтвердження далі стосуються саме її. Цілі, яких твій комп’ютер не підтримує, ти записуєш як **непідтримані** — це не провал, а чесний запис.

        Немає можливості встановити жодну? Натисни під завданням **«У мене немає емулятора чи пристрою»**. Завдання лишиться невиконаним, але наступні уроки відкриті.
      en: |
        The course works with **Expo SDK 57** (it ships React Native 0.86 and React 19.2). For the first runs you need the **Expo Go** app: it loads your JavaScript from the dev server, so you do not have to build the native part yet.

        You can pick one of four targets:

        | Target | Computer | What to install |
        |---|---|---|
        | [[emulator\|Android emulator]] | macOS, Windows, Linux | Android Studio with Android SDK Platform 36 |
        | [[simulator\|iOS simulator]] | macOS only | Xcode (26.4 or newer for SDK 57) |
        | Android phone | any | Expo Go from Google Play, the same Wi‑Fi |
        | iPhone | any | Expo Go from the App Store and signing in to an Expo account |

        The last option is the only one for which the Expo docs require an Expo account in Expo Go and on the computer. The course requires no account at all, so if you do not want to create one, choose another target.

        The chosen target is your [[declared-target|declared target]]: its kind, name and OS version. Every native confirmation from now on is about exactly that target. Targets your computer does not support are recorded as **unsupported** — not a failure, an honest record.

        No way to install any of them? Press **“I have no emulator or device”** under the task. The task stays not performed, but the next lessons are open.

  - id: predict-windows-targets
    kind: prediction
    prompt:
      uk: "У тебе комп’ютер з Windows і Android-телефон. Які цілі ти можеш заявити, а які запишеш як непідтримані?"
      en: "You have a Windows computer and an Android phone. Which targets can you declare, and which do you record as unsupported?"
    answer:
      type: choice
      options:
        - id: android-yes-ios-no
          text:
            uk: "Android-емулятор і Android-телефон можна; iOS-симулятор — непідтриманий"
            en: "The Android emulator and the Android phone are possible; the iOS simulator is unsupported"
        - id: all
          text:
            uk: "Усі: Xcode можна встановити й на Windows"
            en: "All of them: Xcode can be installed on Windows too"
          why:
            uk: "Xcode і iOS-симулятор працюють лише в macOS. На Windows це непідтримана ціль."
            en: "Xcode and the iOS simulator run only on macOS. On Windows it is an unsupported target."
        - id: phone-only
          text:
            uk: "Лише телефон: емулятор потребує Mac"
            en: "Only the phone: an emulator needs a Mac"
          why:
            uk: "Android Studio з емулятором встановлюється на macOS, Windows і Linux. Mac потрібен лише для iOS-симулятора."
            en: "Android Studio with its emulator installs on macOS, Windows and Linux. A Mac is needed only for the iOS simulator."
        - id: blocked
          text:
            uk: "Без Mac native-частину розділу пройти не можна взагалі"
            en: "Without a Mac the native part of the unit cannot be done at all"
          why:
            uk: "Для Android Mac не потрібен. А якщо native-інструментів немає зовсім, завдання позначають як невиконане, і навчання триває."
            en: "Android does not need a Mac. And with no native tooling at all, the task is marked as not performed and learning goes on."
      correct: [android-yes-ios-no]
    explanation:
      uk: "Обери одну з можливих цілей — наприклад, емулятор, бо з ним найменше залежностей від мережі, — а iOS-симулятор запиши як непідтриманий на цьому комп’ютері."
      en: "Pick one of the possible targets — for example the emulator, since it depends least on the network — and record the iOS simulator as unsupported on this computer."

  - id: toolchain-path
    kind: visual
    visual: diagram
    title:
      uk: "Шлях від редактора до цілі"
      en: "The path from the editor to the target"
    textEquivalent:
      uk: "Ти пишеш код у VS Code. npm і npx встановлюють пакети й запускають Expo CLI. Команда npx expo start запускає dev-сервер Metro на порту 8081, який збирає JavaScript. Інструменти платформи — Android SDK з Android Studio або Xcode — потрібні, щоб запустити емулятор чи симулятор і поставити на нього Expo Go. Ціль — емулятор, симулятор або телефон — отримує JavaScript від Metro. Якщо інструментів платформи немає, їх треба встановити; iOS-симулятор поза macOS не підтримується зовсім. Для телефона з Expo Go інструменти платформи не потрібні: досить Metro й тієї самої Wi‑Fi-мережі."
      en: "You write code in VS Code. npm and npx install packages and run the Expo CLI. The command npx expo start starts the Metro dev server on port 8081, which bundles the JavaScript. The platform tools — the Android SDK from Android Studio, or Xcode — are needed to start an emulator or simulator and put Expo Go on it. The target — an emulator, a simulator or a phone — gets the JavaScript from Metro. If the platform tools are missing, they have to be installed; an iOS simulator outside macOS is not supported at all. A phone with Expo Go needs no platform tools: Metro and the same Wi‑Fi network are enough."
    spec:
      layout: grid
      nodes:
        - { id: editor, label: "VS Code", w: 130, col: 0, row: 0 }
        - { id: npm, label: "npm / npx", w: 130, col: 1, row: 0 }
        - { id: metro, label: "Metro :8081", shape: round, w: 130, col: 0, row: 1 }
        - { id: tools, label: "SDK / Xcode", w: 130, col: 1, row: 1 }
        - { id: target, label: { uk: "заявлена ціль", en: "declared target" }, shape: pill, w: 150, col: 0, row: 2 }
      edges:
        - { id: editor-npm, from: editor, to: npm, label: { uk: "команди", en: "commands" } }
        - { id: npm-metro, from: npm, to: metro, label: "expo start" }
        - { id: tools-target, from: tools, to: target, label: { uk: "запуск", en: "launch" } }
        - { id: metro-target, from: metro, to: target, label: "JavaScript" }
      steps:
        - caption:
            uk: "Увесь шлях: редактор, npm і Expo CLI, dev-сервер Metro, інструменти платформи й ціль."
            en: "The whole path: the editor, npm and the Expo CLI, the Metro dev server, the platform tools and the target."
        - caption:
            uk: "`npx expo start` запускає **Metro** на порту 8081. Ця частина однакова на будь-якому комп’ютері: потрібен лише Node.js."
            en: "`npx expo start` starts **Metro** on port 8081. This part is the same on any computer: it needs only Node.js."
          highlight: [editor, npm, metro, editor-npm, npm-metro]
          dim: [tools, target, tools-target, metro-target]
        - caption:
            uk: "Емулятору й симулятору потрібні **інструменти платформи**: Android SDK з Android Studio або Xcode. Якщо їх немає — це «бракує, треба встановити»."
            en: "An emulator and a simulator need the **platform tools**: the Android SDK from Android Studio, or Xcode. If they are missing, that is “missing, install it”."
          highlight: [tools, tools-target, target]
          dim: [editor, npm, editor-npm, npm-metro]
          annotate:
            - { id: tools, text: { uk: "є чи бракує?", en: "present or missing?" } }
        - caption:
            uk: "Xcode і iOS-симулятор існують лише для macOS. На Windows і Linux ця ціль **непідтримана** — її записують, а не «лагодять»."
            en: "Xcode and the iOS simulator exist only for macOS. On Windows and Linux this target is **unsupported** — you record it rather than “fix” it."
          highlight: [tools]
          dim: [editor, npm, metro, editor-npm, npm-metro, metro-target]
          annotate:
            - { id: tools, text: { uk: "iOS лише на macOS", en: "iOS on macOS only" } }
        - caption:
            uk: "Телефону з Expo Go інструменти платформи не потрібні: він отримує JavaScript від Metro через ту саму Wi‑Fi-мережу."
            en: "A phone with Expo Go needs no platform tools: it gets the JavaScript from Metro over the same Wi‑Fi network."
          highlight: [metro, metro-target, target]
          dim: [tools, tools-target]

  - id: recall-safe
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: sudo-from-message
        from: js-15-02-safe-commands
        prompt:
          uk: "Під час налаштування термінал пропонує виконати `sudo xcode-select -s /Applications/Xcode.app/Contents/Developer`. Що робиш насамперед?"
          en: "During setup the terminal suggests running `sudo xcode-select -s /Applications/Xcode.app/Contents/Developer`. What do you do first?"
        answer:
          type: choice
          options:
            - id: find-out
              text:
                uk: "Зупиняюся й з’ясовую, звідки ця порада і що саме команда змінить, а вже потім вирішую"
                en: "I stop and find out where the advice comes from and what exactly the command changes, and only then decide"
            - id: run-it
              text:
                uk: "Виконую одразу: її показав сам інструмент"
                en: "I run it at once: the tool itself showed it"
              why:
                uk: "`sudo` дає команді права на всю систему. Навіть порада від інструмента потребує розуміння: що зміниться і чи можна обійтися без пароля адміністратора."
                en: "`sudo` gives a command rights over the whole system. Even advice from a tool needs understanding: what changes, and whether you can do without the administrator password."
            - id: never
              text:
                uk: "Ніколи не виконую жодної команди з `sudo`, навіть розібравшись"
                en: "I never run any command with `sudo`, even after finding out"
              why:
                uk: "Правило — не виконувати `sudo` зі вставленого тексту наосліп. Розібравшись, що команда змінює, рішення ухвалюєш ти сам; часто є спосіб без `sudo`."
                en: "The rule is not to run `sudo` from a paste blindly. Once you understand what the command changes, the decision is yours; there is often a way without `sudo`."
          correct: [find-out]
        explanation:
          uk: "`sudo` — знак «стоп». Ця команда змінює, яким Xcode користуються інструменти командного рядка в усій системі. Те саме можна зробити без терміналу: у Xcode → Settings → Locations обрати Command Line Tools — так і радить документація Expo."
          en: "`sudo` is a stop sign. This command changes which Xcode the command-line tools use across the whole system. The same can be done without the terminal: in Xcode → Settings → Locations choose the Command Line Tools — exactly what the Expo docs recommend."

  - id: setup-target
    kind: local-task
    runtime: local-native
    title:
      uk: "Встанови інструменти й заяви ціль"
      en: "Install the tools and declare your target"
    intro:
      uk: |
        Кроки 1–2 — для всіх. Далі виконуй лише кроки своєї цілі: **A** — Android-емулятор, **I** — iOS-симулятор, **P** — телефон. Наприкінці (крок 7) запиши результат.

        Кроки для інструментів платформи взято з документації Expo для SDK 57 («Set up your environment», розділи Expo Go). На комп’ютері, де перевіряли урок (macOS, Node.js v25.2.1, npm 11.6.2), Android Studio, Xcode й емулятора не було, тож кроки A, I і P звідти не виконували — їх результати описано за документацією, без дослівного виводу.

        **Крок 4A — рядки для `~/.zshrc` (macOS) або `~/.bashrc` (Linux):**

        ```sh
        export ANDROID_HOME=$HOME/Library/Android/sdk
        export PATH=$PATH:$ANDROID_HOME/emulator
        export PATH=$PATH:$ANDROID_HOME/platform-tools
        ```

        У Linux перший рядок — `export ANDROID_HOME=$HOME/Android/Sdk`. У Windows змінні задають у Control Panel → User Accounts → User Accounts → Change my environment variables: нова змінна `ANDROID_HOME` зі значенням `%LOCALAPPDATA%\Android\Sdk`, а в `Path` — новий рядок `%LOCALAPPDATA%\Android\Sdk\platform-tools`.

        **Крок 7 — вміст `~/js-course/native-target.md` (приклад, заповни своїми даними):**

        ```text
        # Native target
        Declared target: Android emulator, Pixel 9, Android 16
        Computer: Windows 11
        Unsupported here: iOS simulator (needs macOS)
        Tools: Node.js 22.14.0, Android Studio with SDK Platform 36
        ```
      en: |
        Steps 1–2 are for everyone. After that, do only the steps of your target: **A** — Android emulator, **I** — iOS simulator, **P** — phone. At the end (step 7) write the result down.

        The platform-tool steps follow the Expo documentation for SDK 57 (“Set up your environment”, the Expo Go sections). The computer this lesson was checked on (macOS, Node.js v25.2.1, npm 11.6.2) had no Android Studio, Xcode or emulator, so steps A, I and P were not run there — their results are described from the documentation, without verbatim output.

        **Step 4A — lines for `~/.zshrc` (macOS) or `~/.bashrc` (Linux):**

        ```sh
        export ANDROID_HOME=$HOME/Library/Android/sdk
        export PATH=$PATH:$ANDROID_HOME/emulator
        export PATH=$PATH:$ANDROID_HOME/platform-tools
        ```

        On Linux the first line is `export ANDROID_HOME=$HOME/Android/Sdk`. On Windows the variables are set in Control Panel → User Accounts → User Accounts → Change my environment variables: a new variable `ANDROID_HOME` with the value `%LOCALAPPDATA%\Android\Sdk`, and in `Path` a new entry `%LOCALAPPDATA%\Android\Sdk\platform-tools`.

        **Step 7 — the content of `~/js-course/native-target.md` (an example; fill in your own data):**

        ```text
        # Native target
        Declared target: Android emulator, Pixel 9, Android 16
        Computer: Windows 11
        Unsupported here: iOS simulator (needs macOS)
        Tools: Node.js 22.14.0, Android Studio with SDK Platform 36
        ```
    tools:
      - { name: "Node.js", version: "22.13 or newer", note: { uk: "мінімум для Expo SDK 57 за таблицею підтримки Expo", en: "the minimum for Expo SDK 57 according to Expo's support table" } }
      - { name: "Expo Go", note: { uk: "ставиться на емулятор чи симулятор автоматично під час першого запуску; на телефон — з магазину застосунків", en: "installed on an emulator or simulator automatically on the first run; on a phone, from the app store" } }
      - { name: "Android Studio", note: { uk: "лише для цілі A: Android SDK Platform 36 (Android 16) і Android Emulator", en: "target A only: Android SDK Platform 36 (Android 16) and the Android Emulator" } }
      - { name: "Xcode", version: "26.4 or newer", note: { uk: "лише для цілі I і лише в macOS", en: "target I only, and only on macOS" } }
    steps:
      - text:
          uk: "Перевір Node.js: Expo SDK 57 потребує версії 22.13 або новішої."
          en: "Check Node.js: Expo SDK 57 needs version 22.13 or newer."
        command: "node --version"
        expect:
          uk: "Рядок на кшталт `v22.13.0` або новіший (там, де перевіряли урок, — `v25.2.1`). Якщо версія старіша, онови Node.js з nodejs.org."
          en: "A line like `v22.13.0` or newer (where the lesson was checked: `v25.2.1`). If the version is older, update Node.js from nodejs.org."
      - text:
          uk: "Виріши, яка ціль твоя: подивись на таблицю з пояснення й на свій комп’ютер. Запиши для себе назву ОС комп’ютера й ціль, яку обираєш."
          en: "Decide which target is yours: look at the table in the explanation and at your computer. Note your computer's OS and the target you choose."
      - text:
          uk: "**A.** Встанови Android Studio (тип установлення «Standard», прийми ліцензії). У Settings → Languages & Frameworks → Android SDK на вкладці SDK Platforms познач Android SDK Platform 36 і Sources for Android 36, а на вкладці SDK Tools — Android SDK Build-Tools і Android Emulator."
          en: "**A.** Install Android Studio (installation type “Standard”, accept the licences). In Settings → Languages & Frameworks → Android SDK, on the SDK Platforms tab tick Android SDK Platform 36 and Sources for Android 36, and on the SDK Tools tab Android SDK Build-Tools and Android Emulator."
      - text:
          uk: "**A.** Додай змінні середовища з кроку 4A вступу у свій файл налаштувань shell, перезавантаж його й перевір, що `adb` знайдено. У Windows відкрий новий PowerShell після зміни змінних."
          en: "**A.** Add the environment variables from step 4A of the intro to your shell config file, reload it and check that `adb` is found. On Windows open a new PowerShell after changing the variables."
        command: "source $HOME/.zshrc\nadb --version"
        expect:
          uk: "`adb` друкує свою версію замість `command not found`. (Не перевірено на машині автора уроку: там Android SDK не встановлено.)"
          en: "`adb` prints its version instead of `command not found`. (Not checked on the lesson author's machine: it has no Android SDK.)"
      - text:
          uk: "**A.** В Android Studio відкрий More Actions → Virtual Device Manager → Create virtual device, обери телефон Pixel, завантаж образ системи й натисни Finish. Запусти емулятор кнопкою Play у Device Manager і запиши версію Android з його налаштувань."
          en: "**A.** In Android Studio open More Actions → Virtual Device Manager → Create virtual device, pick a Pixel phone, download a system image and press Finish. Start the emulator with the Play button in the Device Manager and note the Android version from its settings."
        expect:
          uk: "Вікно з екраном Android-телефона. Команда `adb devices` показує його у списку під `List of devices attached` (формат із документації Android; тут не перевірено)."
          en: "A window with an Android phone screen. The command `adb devices` lists it under `List of devices attached` (the format from the Android docs; not checked here)."
      - text:
          uk: "**I.** Лише в macOS: встанови Xcode з Mac App Store. У Xcode → Settings → Locations обери найновішу версію в списку Command Line Tools, а в Settings → Components у Platform Support → iOS натисни Get. Потім перевір версію Xcode."
          en: "**I.** macOS only: install Xcode from the Mac App Store. In Xcode → Settings → Locations choose the newest version in the Command Line Tools list, and in Settings → Components, under Platform Support → iOS, press Get. Then check the Xcode version."
        command: "xcodebuild -version"
        expect:
          uk: "Перший рядок — `Xcode` і номер версії, для SDK 57 — 26.4 або новіший. Якщо натомість бачиш `xcode-select: error: tool 'xcodebuild' requires Xcode, but active developer directory '/Library/Developer/CommandLineTools' is a command line tools instance`, Xcode не встановлено або не обрано в Locations (цю помилку бачили на машині без Xcode)."
          en: "The first line is `Xcode` and a version number, 26.4 or newer for SDK 57. If you see `xcode-select: error: tool 'xcodebuild' requires Xcode, but active developer directory '/Library/Developer/CommandLineTools' is a command line tools instance` instead, Xcode is not installed or not selected in Locations (this error was seen on a machine without Xcode)."
      - text:
          uk: "**P.** На Android-телефоні встанови Expo Go з Google Play, на iPhone — з App Store (для iPhone документація Expo вимагає ще й увійти в обліковий запис Expo). Підключи телефон до тієї самої Wi‑Fi-мережі, що й комп’ютер, і запиши модель та версію ОС з налаштувань телефона."
          en: "**P.** On an Android phone install Expo Go from Google Play, on an iPhone from the App Store (for an iPhone the Expo docs also require signing in to an Expo account). Connect the phone to the same Wi‑Fi network as the computer, and note the model and OS version from the phone's settings."
      - text:
          uk: "Створи в теці `~/js-course` файл `native-target.md` (у VS Code: File → New File, збережи туди) і запиши в нього заявлену ціль, її версію ОС, свій комп’ютер, непідтримані цілі та версії інструментів — за зразком з кроку 7 вступу. Якщо теки `~/js-course` ще немає, створи її командою нижче."
          en: "Create the file `native-target.md` in the folder `~/js-course` (in VS Code: File → New File, save it there) and write down your declared target, its OS version, your computer, the unsupported targets and the tool versions — following the sample in step 7 of the intro. If the folder `~/js-course` does not exist yet, create it with the command below."
        command: "mkdir -p ~/js-course"
        expect:
          uk: "Нічого не виводиться: `-p` не скаржиться, якщо тека вже є."
          en: "Nothing is printed: `-p` does not complain if the folder already exists."
    verify:
      - id: node-ok
        text:
          uk: "`node --version` показав 22.13 або новішу версію."
          en: "`node --version` showed version 22.13 or newer."
      - id: target-ready
        text:
          uk: "Моя заявлена ціль працює: емулятор чи симулятор запущено, або на телефоні встановлено Expo Go і він у тій самій Wi‑Fi-мережі."
          en: "My declared target works: the emulator or simulator is running, or Expo Go is installed on the phone and it is on the same Wi‑Fi network."
      - id: target-recorded
        text:
          uk: "У `~/js-course/native-target.md` записано тип цілі, її назву й версію ОС, а також непідтримані на моєму комп’ютері цілі."
          en: "`~/js-course/native-target.md` records the target's kind, name and OS version, and the targets my computer does not support."
    troubleshooting:
      - problem:
          uk: "`command not found: adb` (або в PowerShell — що `adb` не розпізнано)"
          en: "`command not found: adb` (or, in PowerShell, that `adb` is not recognised)"
        fix:
          uk: "Змінні середовища ще не діють у цьому терміналі. Перевір рядки з кроку 4A у файлі налаштувань shell, виконай `source $HOME/.zshrc` або відкрий новий термінал. У Windows після зміни змінних відкрий новий PowerShell і перевір `Get-ChildItem -Path Env:`."
          en: "The environment variables are not active in this terminal yet. Check the step 4A lines in your shell config file, run `source $HOME/.zshrc` or open a new terminal. On Windows, open a new PowerShell after changing the variables and check `Get-ChildItem -Path Env:`."
      - problem:
          uk: "`xcode-select: error: tool 'xcodebuild' requires Xcode, but active developer directory '/Library/Developer/CommandLineTools' is a command line tools instance`"
          en: "`xcode-select: error: tool 'xcodebuild' requires Xcode, but active developer directory '/Library/Developer/CommandLineTools' is a command line tools instance`"
        fix:
          uk: "Встановлено лише Command Line Tools, без Xcode, або Xcode не обрано. Встанови Xcode з Mac App Store, відкрий його один раз і в Settings → Locations обери Command Line Tools з його версією."
          en: "Only the Command Line Tools are installed, without Xcode, or Xcode is not selected. Install Xcode from the Mac App Store, open it once and choose its Command Line Tools in Settings → Locations."
      - problem:
          uk: "Мій комп’ютер не підтримує жодної цілі (немає місця, прав адміністратора чи Android-телефона)"
          en: "My computer supports no target (no disk space, no administrator rights or no Android phone)"
        fix:
          uk: "Запиши в `native-target.md`, що native-ціль недоступна і чому, і натисни «У мене немає емулятора чи пристрою». Наступні уроки відкриті, а завдання лишиться позначеним як невиконане, доки не повернешся до нього."
          en: "Write in `native-target.md` that no native target is available and why, and press “I have no emulator or device”. The next lessons are open, and the task stays marked as not performed until you come back to it."
      - problem:
          uk: "Версія ОС моєї цілі нижча за мінімум у таблиці підтримки Expo"
          en: "My target's OS version is below the minimum in Expo's support table"
        fix:
          uk: "Для SDK 57 мінімум — iOS 16.4 і Android 7. Онови ОС пристрою, створи емулятор із новішим образом системи або запиши цю ціль як непідтриману й обери іншу."
          en: "For SDK 57 the minimum is iOS 16.4 and Android 7. Update the device's OS, create an emulator with a newer system image, or record this target as unsupported and choose another."
    recovery:
      uk: "Цей урок не змінює твоїх проєктів: він лише встановлює програми й додає змінні середовища. Щоб скасувати змінні, прибери рядки з кроку 4A з файлу налаштувань shell (у Windows — видали змінну в тому самому вікні) і відкрий новий термінал. Android Studio й Xcode видаляються звичайним способом твоєї ОС."
      en: "This lesson does not change your projects: it only installs programs and adds environment variables. To undo the variables, remove the step 4A lines from your shell config file (on Windows, delete the variable in the same window) and open a new terminal. Android Studio and Xcode are removed the usual way for your OS."

  - id: to-project
    kind: transfer
    capstoneStep: RN-01
    body:
      uk: "Hello-екран проєкту ти запускатимеш саме на цій заявленій цілі, а записані в `native-target.md` дані підуть у підтвердження до проєктного кроку."
      en: "You will run your project's hello screen on exactly this declared target, and the data in `native-target.md` goes into the confirmation for the project step."
