id: rn-01-05-hello-screen
unit: RN-01
title:
  uk: "Hello-екран на твоїй заявленій цілі"
  en: "Hello screen on your declared target"
kind: local-task
minutes: 30
contentVersion: 1
purpose:
  uk: "Перший справжній native-запуск: ти створиш застосунок Expo, відкриєш його в debug-режимі на своїй заявленій цілі й збережеш підтвердження — що, де й у якому режимі запущено. Потім самостійно зміниш екран і з’ясуєш, які зміни приходять через dev-сервер, а які потребують native-перезбирання."
  en: "The first real native run: you create an Expo app, open it in debug mode on your declared target and keep the evidence — what ran, where and in which mode. Then, on your own, you change the screen and work out which changes arrive through the dev server and which need a native rebuild."
objectives:
  - uk: "Створити, зібрати й запустити hello-екран на заявленій цілі та записати підтвердження: ціль, версію ОС, режим збирання й знімок екрана або рядок журналу."
    en: "Create, build and launch a hello screen on the declared target and record learner-confirmed evidence: target, OS version, build mode and a screenshot or log line."
  - uk: "Змінити текст екрана, переконатися, що зміна прийшла через dev-сервер, і назвати, які зміни натомість потребують native-перезбирання."
    en: "Change the screen text, confirm the update arrives through the dev server, and name which kinds of edits need a native rebuild instead."
prerequisites: [rn-01-04-shared-domain-code, rn-01-02-toolchain-setup]
subskills:
  - { family: N-01, skill: "toolchain/emulator/device", depth: assess }
  - { family: N-01, skill: "environment/version support and debug vs release", depth: practice }
glossary: [native-rebuild]
selfCheck: [predict-rebuild]

blocks:
  - id: first-run
    kind: explanation
    title:
      uk: "Що відбувається під час першого запуску"
      en: "What happens on the first run"
    body:
      uk: |
        `npx create-expo-app` створює теку проєкту з `App.tsx`, `index.ts`, `app.json` і `package.json`, встановлює пакети й робить перший Git-commit. `npm start` запускає `expo start` — dev-сервер Metro. Ось що він вивів, коли урок перевіряли (QR-код вище пропущено, IP-адреса у тебе своя):

        ```text
        › Scan the QR code above to open in Expo Go.
        › Metro: exp://192.168.0.201:8081

        › Using Expo Go
        › Press s │ switch to development build

        › Press a │ open Android
        › Press i │ open iOS simulator
        › Press w │ open web
        …
        Logs for your project will appear below. Press Ctrl+C to exit.
        ```

        `exp://…:8081` — адреса, за якою Expo Go на цілі забирає JavaScript. Клавіша `a` відкриває Android-емулятор, `i` — iOS-симулятор, а телефон відкриває проєкт через QR-код. Коли ціль попросить bundle, у терміналі з’явиться рядок на кшталт `Android Bundled 2393ms index.ts (728 modules)` — разом зі знімком екрана це й буде підтвердження.

        Зміни в JavaScript (`App.tsx`, стилі, доменні модулі) приходять через Metro, щойно ти збережеш файл. А от native-частину Expo Go не змінює: нова бібліотека з native-кодом, якої в Expo Go немає (бібліотеки Expo SDK він уже містить), зміна конфігурації застосунку (`app.json`: іконка, назва, дозволи) чи нова версія Expo SDK потребують [[native-rebuild|native-перезбирання]] — так каже документація Expo про development builds.
      en: |
        `npx create-expo-app` creates a project folder with `App.tsx`, `index.ts`, `app.json` and `package.json`, installs the packages and makes the first Git commit. `npm start` runs `expo start` — the Metro dev server. Here is what it printed when this lesson was checked (the QR code above is left out; your IP address will differ):

        ```text
        › Scan the QR code above to open in Expo Go.
        › Metro: exp://192.168.0.201:8081

        › Using Expo Go
        › Press s │ switch to development build

        › Press a │ open Android
        › Press i │ open iOS simulator
        › Press w │ open web
        …
        Logs for your project will appear below. Press Ctrl+C to exit.
        ```

        `exp://…:8081` is the address from which Expo Go on the target fetches the JavaScript. The `a` key opens the Android emulator, `i` the iOS simulator, and a phone opens the project through the QR code. When the target asks for the bundle, the terminal shows a line like `Android Bundled 2393ms index.ts (728 modules)` — together with a screenshot, that is your evidence.

        JavaScript changes (`App.tsx`, styles, domain modules) arrive through Metro as soon as you save the file. Expo Go does not change its native part, though: a new library with native code that Expo Go does not already contain (it ships the Expo SDK libraries), a change of the app config (`app.json`: icon, name, permissions) or a new Expo SDK version needs a [[native-rebuild|native rebuild]] — so says the Expo documentation on development builds.

  - id: recall-where
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: cd-before-start
        from: js-10-02-export-open-install-run
        prompt:
          uk: "Ти щойно виконав у теці `~/js-course` команду, яка створила вкладену теку проєкту `rn-hello` з `package.json`. Термінал досі стоїть у `~/js-course`. Що потрібно зробити перед `npm start`?"
          en: "You have just run, in the folder `~/js-course`, a command that created a nested project folder `rn-hello` with a `package.json`. The terminal is still in `~/js-course`. What must you do before `npm start`?"
        answer:
          type: choice
          options:
            - id: cd-in
              code: "cd rn-hello"
            - id: nothing
              text:
                uk: "Нічого: npm сам знайде `package.json` у вкладеній теці"
                en: "Nothing: npm finds `package.json` in the nested folder by itself"
              why:
                uk: "npm шукає `package.json` у поточній теці та вище, але ніколи не у вкладених."
                en: "npm looks for `package.json` in the current folder and above, but never in nested ones."
            - id: npm-install
              code: "npm install"
              why:
                uk: "У `~/js-course` немає `package.json`, тож і `npm install` там не має з чим працювати. Спершу перейди в теку проєкту."
                en: "`~/js-course` has no `package.json`, so `npm install` has nothing to work with there either. Go into the project folder first."
          correct: [cd-in]
        explanation:
          uk: "npm діє в теці, де стоїть термінал, і шукає `package.json` там або вище. Тому спершу `cd rn-hello`, а для певності — `ls package.json`."
          en: "npm acts in the folder the terminal is in and looks for `package.json` there or above. So first `cd rn-hello`, and to be sure, `ls package.json`."

  - id: predict-rebuild
    kind: prediction
    prompt:
      uk: "Застосунок Expo відкрито в Expo Go в debug-режимі. Які з цих змін **не** прийдуть через dev-сервер і потребуватимуть native-перезбирання? Обери всі."
      en: "An Expo app is open in Expo Go in debug mode. Which of these changes will **not** arrive through the dev server and need a native rebuild? Choose all that apply."
    runnable: false
    answer:
      type: multi
      options:
        - id: text
          text:
            uk: "Інший текст у `<Text>` в `App.tsx`"
            en: "Different text in a `<Text>` in `App.tsx`"
          why:
            uk: "Це зміна JavaScript: Metro збере новий bundle, і Expo Go покаже її після збереження файлу."
            en: "This is a JavaScript change: Metro builds a new bundle, and Expo Go shows it once you save the file."
        - id: style
          text:
            uk: "Новий колір у `StyleSheet.create`"
            en: "A new colour in `StyleSheet.create`"
          why:
            uk: "Стилі — теж JavaScript, тож вони приходять через dev-сервер."
            en: "Styles are JavaScript too, so they arrive through the dev server."
        - id: domain
          text:
            uk: "Новий файл у `domain/` з чистою функцією"
            en: "A new file in `domain/` with a pure function"
          why:
            uk: "Доменний модуль — звичайний JavaScript/TypeScript, Metro додасть його в bundle."
            en: "A domain module is plain JavaScript/TypeScript; Metro adds it to the bundle."
        - id: icon
          text:
            uk: "Нова іконка застосунку в `app.json`"
            en: "A new app icon in `app.json`"
        - id: native-lib
          text:
            uk: "Встановлена бібліотека з native-кодом, якої немає в Expo Go"
            en: "An installed library with native code that Expo Go does not contain"
      correct: [icon, native-lib]
    explanation:
      uk: "Документація Expo: коли змінюєш лише TypeScript/JavaScript, native-застосунок перезбирати не треба. Перезбирання потрібне, коли встановлюєш чи оновлюєш бібліотеку з native-кодом, змінюєш конфігурацію застосунку або оновлюєш Expo SDK. Expo Go — готовий застосунок із власним набором native-бібліотек (бібліотеки Expo SDK у ньому вже є), тож бібліотеки поза цим набором чи власної іконки в ньому не буде — для цього знадобиться власна development build (пізніше в курсі)."
      en: "The Expo docs: when you change only TypeScript/JavaScript, the native app does not need rebuilding. A rebuild is needed when you install or update a library with native code, change the app config or upgrade the Expo SDK. Expo Go is a ready-made app with its own set of native libraries (the Expo SDK libraries are already in it), so a library outside that set or your own icon will not appear in it — that needs your own development build (later in the course)."

  - id: hello-run
    kind: local-task
    runtime: local-native
    title:
      uk: "Створи й запусти hello-екран"
      en: "Create and launch the hello screen"
    intro:
      uk: |
        Потрібна заявлена ціль з уроку про toolchain: запущений емулятор чи симулятор або телефон з Expo Go в тій самій Wi‑Fi-мережі. Потрібен інтернет (npm завантажить близько 470 пакетів), облікові записи — ні (крім iPhone, див. той урок).

        Кроки 1–4 і commit із кроку 8 виконано на macOS з Node.js v25.2.1 і npm 11.6.2 — вивід у них справжній. Кроки 5–7 (відкриття на цілі, знімок екрана, оновлення після збереження) там виконати не було на чому: їх описано за документацією Expo.

        **Крок 6 — файл `~/js-course/rn-hello/EVIDENCE.md` (приклад, заповни своїми даними):**

        ```text
        # Hello screen evidence
        Target: Android emulator, Pixel 9, Android 16
        Build mode: debug (Expo Go, npm start)
        Expo SDK: 57
        Log line: Android Bundled 2393ms index.ts (728 modules)
        Screenshot: hello-android.png
        ```
      en: |
        You need the declared target from the toolchain lesson: a running emulator or simulator, or a phone with Expo Go on the same Wi‑Fi network. You need internet access (npm downloads about 470 packages), but no accounts (except for an iPhone, see that lesson).

        Steps 1–4 and the commit of step 8 were run on macOS with Node.js v25.2.1 and npm 11.6.2 — their output is real. Steps 5–7 (opening on the target, the screenshot, the update after saving) could not be run there for lack of a target: they are described from the Expo documentation.

        **Step 6 — the file `~/js-course/rn-hello/EVIDENCE.md` (an example; fill in your own data):**

        ```text
        # Hello screen evidence
        Target: Android emulator, Pixel 9, Android 16
        Build mode: debug (Expo Go, npm start)
        Expo SDK: 57
        Log line: Android Bundled 2393ms index.ts (728 modules)
        Screenshot: hello-android.png
        ```
    tools:
      - { name: "Node.js", version: { uk: "22.13 або новіший", en: "22.13 or newer" } }
      - { name: "Expo SDK", version: "57", note: { uk: "шаблон `blank-typescript@sdk-57`: expo ~57.0.26, react-native 0.86.3, React 19.2.3, TypeScript ~6.0.3", en: "the `blank-typescript@sdk-57` template: expo ~57.0.26, react-native 0.86.3, React 19.2.3, TypeScript ~6.0.3" } }
      - { name: "create-expo-app", version: "5.0.0" }
      - { name: "Expo Go", note: { uk: "на заявленій цілі", en: "on the declared target" } }
    steps:
      - text:
          uk: "Перейди в теку курсу (команда створить її, якщо її ще немає)."
          en: "Go to the course folder (the command creates it if it does not exist yet)."
        command: "mkdir -p ~/js-course\ncd ~/js-course"
      - text:
          uk: "Створи проєкт із шаблону TypeScript саме для Expo SDK 57. Прапорець `--no-agents-md` пропускає службові файли для AI-помічників, які тут не потрібні."
          en: "Create the project from the TypeScript template for exactly Expo SDK 57. The `--no-agents-md` flag skips helper files for AI assistants that are not needed here."
        command: "npx create-expo-app@latest rn-hello --template blank-typescript@sdk-57 --no-agents-md"
        expect:
          uk: "Спершу `Creating rn-hello using the blank-typescript@sdk-57 template.`, потім вивід `npm install`, наприкінці `✅ Your project is ready!` і список команд `- cd rn-hello`, `- npm run android`, `- npm run ios`, `- npm run web`. Рядок про вразливості (у нашій перевірці — `23 vulnerabilities (7 moderate, 16 high)`) теж може бути — `npm audit fix --force` не запускай (див. «Якщо щось пішло не так»)."
          en: "First `Creating rn-hello using the blank-typescript@sdk-57 template.`, then the `npm install` output, and at the end `✅ Your project is ready!` with the command list `- cd rn-hello`, `- npm run android`, `- npm run ios`, `- npm run web`. A line about vulnerabilities (in our check, `23 vulnerabilities (7 moderate, 16 high)`) may appear too — do not run `npm audit fix --force` (see “If something went wrong”)."
      - text:
          uk: "Перейди в проєкт і подивись, що шаблон уже створив Git-репозиторій із першим commit."
          en: "Go into the project and see that the template has already created a Git repository with a first commit."
        command: "cd rn-hello\ngit log --oneline"
        expect:
          uk: "Один рядок `… Initial commit` (замість `…` — короткий хеш)."
          en: "One line `… Initial commit` (with a short hash in place of `…`)."
      - text:
          uk: "Запусти dev-сервер. Термінал не закривай: сервер працює, доки ти його не зупиниш (Ctrl+C)."
          en: "Start the dev server. Keep the terminal open: the server runs until you stop it (Ctrl+C)."
        command: "npm start"
        expect:
          uk: "`> rn-hello@1.0.0 start`, `> expo start`, QR-код, рядок `› Metro: exp://<твоя IP-адреса>:8081`, `› Using Expo Go`, список клавіш і `Logs for your project will appear below. Press Ctrl+C to exit.` (див. пояснення вище)."
          en: "`> rn-hello@1.0.0 start`, `> expo start`, a QR code, the line `› Metro: exp://<your IP address>:8081`, `› Using Expo Go`, the key list and `Logs for your project will appear below. Press Ctrl+C to exit.` (see the explanation above)."
      - text:
          uk: "Відкрий застосунок на заявленій цілі: для Android-емулятора натисни в терміналі `a`, для iOS-симулятора — `i` (Expo CLI сам поставить туди Expo Go), на Android-телефоні відскануй QR-код в Expo Go, на iPhone — відкрий проєкт у своїй збірці Expo Go, увійшовши в той самий обліковий запис Expo, що й `npx expo login` (див. урок про toolchain; тут не перевірено)."
          en: "Open the app on your declared target: for the Android emulator press `a` in the terminal, for the iOS simulator `i` (the Expo CLI installs Expo Go there itself), on an Android phone scan the QR code in Expo Go, on an iPhone open the project in your own Expo Go build, signed in to the same Expo account as `npx expo login` (see the toolchain lesson; not checked here)."
        expect:
          uk: "На цілі — білий екран із текстом `Open up App.tsx to start working on your app!` (цей текст стоїть у `App.tsx` шаблону), а в терміналі — рядок `Android Bundled …ms index.ts (… modules)` або його iOS-варіант. Сам екран на цілі тут не перевірено."
          en: "On the target, a white screen with the text `Open up App.tsx to start working on your app!` (that text is in the template's `App.tsx`), and in the terminal a line `Android Bundled …ms index.ts (… modules)` or its iOS variant. The screen on a target itself was not checked here."
      - text:
          uk: "Збережи підтвердження: зроби знімок екрана цілі (поклади його в теку `rn-hello`) і створи `EVIDENCE.md` за зразком з кроку 6 вступу — ціль, версія ОС, режим `debug (Expo Go, npm start)`, рядок `… Bundled …` з терміналу й назва знімка."
          en: "Keep the evidence: take a screenshot of the target (put it into the `rn-hello` folder) and create `EVIDENCE.md` following the sample in step 6 of the intro — the target, the OS version, the mode `debug (Expo Go, npm start)`, the `… Bundled …` line from the terminal and the screenshot's name."
      - text:
          uk: "Зміни текст у `<Text>` в `App.tsx` на `Hello from rn-hello` і збережи файл. Нічого не перезапускай."
          en: "Change the text in the `<Text>` in `App.tsx` to `Hello from rn-hello` and save the file. Restart nothing."
        expect:
          uk: "Документація Expo: за замовчуванням застосунок оновлюється сам після збереження файлу. Якщо цього не сталося — розділ «Якщо щось пішло не так»."
          en: "The Expo docs: by default the app reloads by itself after you save a file. If it did not — see “If something went wrong”."
      - text:
          uk: "Зупини сервер (Ctrl+C) і закоміть зміни разом із підтвердженням."
          en: "Stop the server (Ctrl+C) and commit the changes together with the evidence."
        command: "git add -A\ngit commit -m \"Show a hello screen on the declared target\""
        expect:
          uk: "Рядок `[master …] Show a hello screen on the declared target` (або `[main …]` — назва гілки залежить від твоїх налаштувань Git) і кількість змінених файлів."
          en: "A line `[master …] Show a hello screen on the declared target` (or `[main …]` — the branch name depends on your Git settings) and the number of files changed."
    verify:
      - id: opened
        text:
          uk: "Hello-екран відкрився на моїй заявленій цілі в Expo Go."
          en: "The hello screen opened on my declared target in Expo Go."
      - id: evidence
        text:
          uk: "`EVIDENCE.md` містить ціль, версію ОС, режим збирання (debug) і рядок журналу або знімок екрана, які я справді бачив."
          en: "`EVIDENCE.md` holds the target, the OS version, the build mode (debug) and a log line or a screenshot I really saw."
      - id: live-update
        text:
          uk: "Новий текст `Hello from rn-hello` з’явився на цілі без перезапуску застосунку."
          en: "The new text `Hello from rn-hello` appeared on the target without restarting the app."
    troubleshooting:
      - problem:
          uk: "Після `a`: `Failed to resolve the Android SDK path. Default install location not found: … Use ANDROID_HOME to set the Android SDK location.` і `Error: spawn adb ENOENT`"
          en: "After `a`: `Failed to resolve the Android SDK path. Default install location not found: … Use ANDROID_HOME to set the Android SDK location.` and `Error: spawn adb ENOENT`"
        fix:
          uk: "Android SDK не встановлено або змінна `ANDROID_HOME` не діє в цьому терміналі (саме цей вивід ми бачили на машині без Android SDK). Повернися до кроків A уроку про toolchain, відкрий новий термінал і знову запусти `npm start`."
          en: "The Android SDK is not installed, or `ANDROID_HOME` is not active in this terminal (this exact output was seen on a machine without the Android SDK). Go back to the A steps of the toolchain lesson, open a new terminal and run `npm start` again."
      - problem:
          uk: "Після `i`: питання `Xcode must be fully installed before you can continue. … Continue to the App Store?`"
          en: "After `i`: the question `Xcode must be fully installed before you can continue. … Continue to the App Store?`"
        fix:
          uk: "Xcode немає або його не обрано. Дай відповідь «ні», встанови Xcode за кроками I уроку про toolchain і обери його Command Line Tools у Xcode → Settings → Locations. Команду `sudo xcode-select …`, яку пропонує це повідомлення, не виконуй, не розібравшись."
          en: "Xcode is missing or not selected. Answer “no”, install Xcode following the I steps of the toolchain lesson and choose its Command Line Tools in Xcode → Settings → Locations. Do not run the `sudo xcode-select …` command this message suggests without understanding it."
      - problem:
          uk: "Телефон не відкриває проєкт за QR-кодом або довго нічого не відбувається"
          en: "The phone does not open the project from the QR code, or nothing happens for a long time"
        fix:
          uk: "Документація Expo: комп’ютер і телефон мають бути в одній Wi‑Fi-мережі. Якщо мережа однакова, а з’єднання все одно немає, запусти `npx expo start --tunnel` — повільніше, але через інтернет."
          en: "The Expo docs: the computer and the phone must be on the same Wi‑Fi network. If the network is the same and there is still no connection, run `npx expo start --tunnel` — slower, but through the internet."
      - problem:
          uk: "`npm audit` пише про вразливості й радить `npm audit fix --force`"
          en: "`npm audit` reports vulnerabilities and suggests `npm audit fix --force`"
        fix:
          uk: "Сам npm пише, що `--force` виправляє «including breaking changes»: він може замінити версії пакетів на несумісні з SDK 57. Не запускай його в цьому проєкті; версії під SDK узгоджує `npx expo install --check`."
          en: "npm itself says that `--force` fixes issues “including breaking changes”: it can replace package versions with ones incompatible with SDK 57. Do not run it in this project; `npx expo install --check` aligns versions with the SDK."
      - problem:
          uk: "Після збереження файлу на цілі нічого не змінилося"
          en: "Nothing changed on the target after saving the file"
        fix:
          uk: "Перевір, що сервер ще працює (в терміналі немає `Stopped server`) і що файл справді збережено. Натисни в терміналі `r` (reload app). Документація Expo радить також перевірити, що Fast Refresh увімкнено в меню розробника (клавіша `m` у терміналі)."
          en: "Check that the server is still running (no `Stopped server` in the terminal) and that the file really was saved. Press `r` (reload app) in the terminal. The Expo docs also suggest checking that Fast Refresh is on in the developer menu (the `m` key in the terminal)."
    recovery:
      uk: "Шаблон зробив commit `Initial commit`, тож будь-яку зміну файлу повертає `git restore <файл>`. Якщо проєкт зовсім заплутався, тека `rn-hello` окрема: її можна перейменувати (`mv rn-hello rn-hello-old`) і створити заново кроком 2 — нічого з інших проєктів це не зачепить."
      en: "The template made an `Initial commit`, so `git restore <file>` brings back any file. If the project gets badly tangled, the `rn-hello` folder is separate: rename it (`mv rn-hello rn-hello-old`) and create it again with step 2 — nothing in other projects is affected."

  - id: on-your-own
    kind: local-task
    runtime: local-native
    title:
      uk: "Самостійно: привітання й назва платформи"
      en: "On your own: a greeting and the platform name"
    intro:
      uk: "Без підказок зміни hello-екран так, щоб він показував привітання мовою, якою ти вчишся (українською чи англійською, текст обираєш сам), і назву платформи з `Platform.OS` (`Platform` імпортується з `react-native`). Перевір результат на своїй заявленій цілі в debug-режимі. Потім допиши в `EVIDENCE.md` список змін, які **потребували б** native-перезбирання, і тих, що приходять через dev-сервер: окремо для JavaScript-коду, для зображень, які імпортує JavaScript, і для native-конфігурації в `app.json`. Закоміть результат."
      en: "Without hints, change the hello screen so it shows a greeting in the language you are learning in (Ukrainian or English, your own text) and the platform name from `Platform.OS` (`Platform` is imported from `react-native`). Check the result on your declared target in debug mode. Then add to `EVIDENCE.md` a list of the changes that **would need** a native rebuild and of those that arrive through the dev server: separately for JavaScript code, for images imported by JavaScript and for native configuration in `app.json`. Commit the result."
    tools:
      - { name: "rn-hello", note: { uk: "проєкт із попереднього завдання", en: "the project from the previous task" } }
    steps:
      - text:
          uk: "Зміни екран, запусти `npm start`, відкрий застосунок на цілі й подивись на результат."
          en: "Change the screen, run `npm start`, open the app on the target and look at the result."
      - text:
          uk: "Допиши в `EVIDENCE.md` значення `Platform.OS`, яке ти побачив на цілі, і список змін із поясненням."
          en: "Add to `EVIDENCE.md` the value of `Platform.OS` you saw on the target and the list of changes with explanations."
      - text:
          uk: "Закоміть зміни з власним повідомленням."
          en: "Commit the changes with your own message."
    verify:
      - id: greeting-platform
        text:
          uk: "На заявленій цілі екран показує моє привітання й назву платформи (`android` чи `ios`), а не `web`."
          en: "On the declared target the screen shows my greeting and the platform name (`android` or `ios`), not `web`."
      - id: rebuild-list
        text:
          uk: "У `EVIDENCE.md` є список: які зміни приходять через dev-сервер, а які потребують native-перезбирання — з поясненням чому."
          en: "`EVIDENCE.md` has a list of which changes arrive through the dev server and which need a native rebuild — with the reason why."
      - id: committed
        text:
          uk: "Зміни закомічено."
          en: "The changes are committed."
    troubleshooting:
      - problem:
          uk: "На екрані цілі помилка, у якій згадано `Platform`"
          en: "An error on the target screen that mentions `Platform`"
        fix:
          uk: "Найімовірніше, `Platform` не імпортовано. Додай його до імпорту з `react-native` поруч із `Text` і `View`. Читай назву помилки, файл і рядок, як у вебі."
          en: "Most likely `Platform` is not imported. Add it to the import from `react-native` next to `Text` and `View`. Read the error name, the file and the line, as on the web."
      - problem:
          uk: "Екран показує `web`"
          en: "The screen shows `web`"
        fix:
          uk: "Застосунок відкрито не на цілі, а в браузері (клавіша `w`). Так ти бачиш перегляд, а не native-запуск: відкрий його на заявленій цілі."
          en: "The app was opened in a browser (the `w` key), not on the target. That is a preview, not a native run: open it on your declared target."
    recovery:
      uk: "Попередній commit збережено: `git restore App.tsx` повертає екран до стану після першого завдання, а `git log --oneline` показує всі кроки."
      en: "The previous commit is kept: `git restore App.tsx` returns the screen to its state after the first task, and `git log --oneline` shows all the steps."

  - id: to-project
    kind: transfer
    capstoneStep: RN-01
    body:
      uk: "У проєктному кроці ти зробиш те саме у своєму нативному проєкті `~/js-course/<проєкт>-native`, окремому від React-проєкту: hello-екран покаже один справжній запис через спільний форматер, а підтвердження з заявленої цілі ти запишеш у `EVIDENCE.md` так само — ціль, ОС, режим і знімок чи рядок журналу."
      en: "In the project step you will do the same in your native project `~/js-course/<project>-native`, separate from the React project: the hello screen will show one real record through the shared formatter, and you will record the evidence from the declared target in `EVIDENCE.md` the same way — target, OS, mode and a screenshot or log line."
