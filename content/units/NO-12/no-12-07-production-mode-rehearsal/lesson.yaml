id: no-12-07-production-mode-rehearsal
unit: NO-12
title:
  uk: "Репетиція production-режиму на loopback"
  en: "Loopback production-mode rehearsal"
kind: local-task
minutes: 25
contentVersion: 1
purpose:
  uk: "Зібрати все, що було в попередніх уроках розділу, в одну справжню процедуру на твоєму комп’ютері: перевірити артефакт за контрольною сумою, запустити його в production-режимі на loopback, переконатися через health, метрики й навантаження, що він працює, коректно зупинити під навантаженням — і записати докази кожного кроку. Жодної хмари: усе відбувається на `127.0.0.1`."
  en: "To put everything from the previous lessons of this unit into one real procedure on your computer: verify the artifact by its checksum, start it in production mode on loopback, make sure through health, metrics and load that it works, stop it gracefully under load — and record evidence of every step. No cloud: everything happens on `127.0.0.1`."
objectives:
  - uk: "Запускати зібраний артефакт у production-режимі на loopback на власному комп’ютері, перевіряти health, метрики й логи та коректно його зупиняти."
    en: "Start the built artifact in production mode on loopback on your own machine, verify health, metrics and logs, and stop it gracefully."
  - uk: "Записувати підтверджені власноруч докази кожного кроку (команди, вивід, контрольна сума) у журнал репетиції."
    en: "Record learner-confirmed evidence of every step (commands, outputs, checksum) in a rehearsal log."
prerequisites: [no-12-06-health-lifecycle-shutdown]
subskills:
  - { family: B-10, skill: "loopback production-mode rehearsal", depth: intro }
glossary: [production-mode-rehearsal]

blocks:
  - id: why-rehearse
    kind: explanation
    title:
      uk: "Репетиція: те саме, що в production, лише на loopback"
      en: "A rehearsal: the same as production, only on loopback"
    body:
      uk: |
        **[[production-mode-rehearsal|Репетиція production-режиму]]** — це запуск рівно того, що піде до людей, рівно тим способом, яким воно запускатиметься, але на твоєму комп’ютері й на `127.0.0.1`:

        1. **Артефакт, а не `src`.** Береш архів із CI (урок про CI) і спершу перевіряєш його sha256 за записом релізу.
        2. **Production-конфігурація.** `NODE_ENV=production`, `PORT`, `HOST=127.0.0.1`, абсолютний `DATA_DIR` — лише через змінні середовища (урок про конфігурацію).
        3. **Здоров’я й метрики.** `/livez`, `/readyz`, `/metrics` (уроки про метрики й health).
        4. **Навантаження й зупинка під ним.** `SIGTERM` посеред потоку запитів: жоден підтверджений запис не має загубитися, код виходу — `0`.
        5. **Докази.** Кожна команда й її вивід — у файл `rehearsal.md`. Те, чого не записано, не перевірено.

        Що лишається поза репетицією: інша машина, мережа, проксі з TLS, справжні користувачі. Репетиція не доводить, що реліз безпечний, — вона доводить, що процедура запуску, перевірки й зупинки працює й ти знаєш, як вона виглядає, коли все гаразд.
      en: |
        A **[[production-mode-rehearsal]]** means running exactly what will go to people, exactly the way it will be run, but on your computer and on `127.0.0.1`:

        1. **The artifact, not `src`.** You take the archive from CI (the CI lesson) and first verify its sha256 against the release record.
        2. **Production configuration.** `NODE_ENV=production`, `PORT`, `HOST=127.0.0.1`, an absolute `DATA_DIR` — through environment variables only (the configuration lesson).
        3. **Health and metrics.** `/livez`, `/readyz`, `/metrics` (the lessons on metrics and health).
        4. **Load, and a stop under it.** `SIGTERM` in the middle of a stream of requests: no confirmed write may be lost, the exit code is `0`.
        5. **Evidence.** Every command and its output goes into the file `rehearsal.md`. What is not recorded is not checked.

        What stays outside the rehearsal: another machine, the network, a proxy with TLS, real users. A rehearsal does not prove a release is safe — it proves that the procedure for starting, checking and stopping works and that you know what it looks like when everything is fine.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: перевіряють те, що отримають люди"
      en: "Recall: you check what people will get"
    items:
      - id: preview-origin
        from: re-12-06-artifact-verification
        prompt:
          uk: "У RE-12 перед релізом клієнта ти запускав `npm run preview` і проходив наскрізний сценарій у браузері. Чому не вистачало тестів, що пройшли на вихідних модулях?"
          en: "In RE-12, before releasing the client, you ran `npm run preview` and went through an end-to-end scenario in the browser. Why were tests that passed on the source modules not enough?"
        answer:
          type: choice
          options:
            - id: artifact-differs
              text:
                uk: "Збірка змінює те, що бачать люди: хешовані файли, ліниві модулі, вписані значення `.env` — тести на вихідних модулях цього не бачать"
                en: "The build changes what people see: hashed files, lazy modules, written-in `.env` values — tests on source modules do not see that"
            - id: tests-flaky
              text:
                uk: "Тести на jsdom нестабільні, тому їм не можна вірити"
                en: "Tests on jsdom are flaky, so they cannot be trusted"
              why:
                uk: "Справа не в нестабільності: тести перевіряють вихідний код, а люди отримують інший файл — результат збірки. Перевіряти треба саме його."
                en: "It is not about flakiness: the tests check the source code, while people receive another file — the result of the build. That is what has to be checked."
            - id: no-need
              text:
                uk: "Вистачало б, якби тести були повні; preview — лише звичка"
                en: "They would be enough if the tests were complete; preview is just a habit"
              why:
                uk: "Навіть повні тести на вихідних модулях не бачать файлів, які створює лише збірка. Тому перевіряють сам артефакт."
                en: "Even complete tests on source modules do not see the files that only the build creates. That is why the artifact itself is checked."
          correct: [artifact-differs]
        explanation:
          uk: "Для сервера правило те саме: репетиція запускає розпакований артефакт `package/server.js` зі звичайним JavaScript, а не `src/*.ts`. Якби збірка загубила файл чи переписала імпорт, тести на `src` цього б не помітили, а репетиція помітить."
          en: "For a server the rule is the same: the rehearsal runs the unpacked artifact `package/server.js` with plain JavaScript, not `src/*.ts`. If the build lost a file or rewrote an import wrongly, the tests on `src` would not notice, but the rehearsal will."

  - id: planner-1-4
    kind: example
    runtime: isolated-node
    dir: planner-1-4
    entry: index.js
    capabilities: { network: loopback }
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      during: { uk: "під час завершення", en: "during shutdown" }
    title:
      uk: "Планувальник 1.4.0: health, метрики, коректне завершення"
      en: "Planner 1.4.0: health, metrics, graceful shutdown"
    body:
      uk: |
        Версія 1.4.0 лабораторного проєкту `~/js-course/no12-lab` з уроку про CI. Нове:

        - `src/metrics.ts` і маршрут `/metrics` — лічильник за маршрутом і статусом, p50 і p95;
        - `/livez` і `/readyz` у `src/app.ts`; під час завершення readiness — `503`, а відповіді — з `Connection: close`;
        - `src/server.ts` — коректне завершення на `SIGTERM`/`SIGINT` з крайнім строком 5 с; стартовий рядок друкує версію, `pid` і `NODE_ENV`;
        - `src/store.ts` — збереження йдуть одне за одним (без цього навантаження з одночасними POST давало помилки 500: під час підготовки уроку — 23 з 6503 запитів);
        - `scripts/load.mjs` — синтетичне навантаження, що рахує, як закінчився кожен запит.

        `upgrade-lab-1.4.mjs` переносить ці файли у твій проєкт. Натисни **Запустити**: `index.js` показує health і метрики версії 1.4.0 у пісочниці.
      en: |
        Version 1.4.0 of the lab project `~/js-course/no12-lab` from the CI lesson. New:

        - `src/metrics.ts` and the route `/metrics` — a counter per route and status, p50 and p95;
        - `/livez` and `/readyz` in `src/app.ts`; during a shutdown readiness is `503` and answers carry `Connection: close`;
        - `src/server.ts` — a graceful shutdown on `SIGTERM`/`SIGINT` with a 5 s deadline; the start line prints the version, the `pid` and `NODE_ENV`;
        - `src/store.ts` — saves run one after another (without it, a load with concurrent POSTs gave 500 errors: 23 of 6503 requests while preparing the lesson);
        - `scripts/load.mjs` — a synthetic load that counts how each request ended.

        `upgrade-lab-1.4.mjs` brings these files into your project. Press **Run**: `index.js` shows the health and metrics of version 1.4.0 in the sandbox.

  - id: rehearse
    kind: local-task
    runtime: local-node
    title:
      uk: "Репетиція: артефакт 1.4.0 у production-режимі на 127.0.0.1"
      en: "Rehearsal: artifact 1.4.0 in production mode on 127.0.0.1"
    intro:
      uk: |
        Тобі знадобляться проєкт `~/js-course/no12-lab` з уроку «CI-перевірки й артефакти» (версія 1.3.0, збережена в git), два термінали й curl. Якщо проєкту немає, спершу пройди кроки 1–5 локального завдання того уроку. Порт `7330` — той самий, що в лабораторних цього розділу; якщо він зайнятий, бери `7331` у всіх командах.

        Під час підготовки уроку всі кроки виконано на macOS з Node.js v25.2.1 (npm 11.6.2) і повторно з v22.23.3 (npm 10.9.9), curl 8.7.1; вивід нижче — з v25.2.1 і англійської версії файлів, номери `pid`, мілісекунди й кількості запитів у тебе будуть свої. Windows і Linux не перевіряли; у Windows немає `kill -TERM` — там зупиняй сервер через Ctrl+C у його терміналі (це `SIGINT`, той самий обробник).

        **Крок 4 — CI версії 1.4.0 (уривок):**

        ```text
        ▶ test: node --test test/app.test.ts
        …
        ℹ pass 4
        ℹ fail 0
        …
        ✔ CI passed: artifacts/no12-lab-1.4.0.tgz
          sha256 fb54f32760830b2a322307553ec4659cb2b0bd702caf607558c980d1599e2605
        ```

        **Крок 7 — старт артефакту (термінал 1):**

        ```text
        planner 1.4.0 (pid 31194, NODE_ENV=production) listening on http://127.0.0.1:7330
        ```

        **Кроки 8–9 — health, навантаження й метрики (термінал 2):**

        ```text
        $ curl -sS http://127.0.0.1:7330/readyz
        {"status":"ready"}
        $ node scripts/load.mjs http://127.0.0.1:7330 3
        answered {"200":7079,"201":786}, refused 0, broken 0; p50 0.9 ms, p95 4.5 ms
        $ curl -sS http://127.0.0.1:7330/metrics
        …
        http_requests_total{route="/tasks",status="200"} 7079
        http_requests_total{route="/tasks",status="201"} 786
        http_request_duration_ms{route="/tasks",quantile="0.5"} 0.2
        http_request_duration_ms{route="/tasks",quantile="0.95"} 2.1
        ```

        p95 у `load.mjs` більший, ніж у `/metrics`: клієнт міряє ще й мережу та чергу з чотирьох одночасних запитів, а сервер — лише свою роботу.

        **Кроки 10–11 — `SIGTERM` під навантаженням (свіжий `DATA_DIR`, три прогони на v25.2.1; уривок одного):**

        ```text
        термінал 2: answered {"200":4563,"201":507}, refused 140, broken 2; p50 0.6 ms, p95 2.6 ms
        термінал 1: SIGTERM: draining requests in flight (deadline 5000 ms)
                    drained; the store is already on disk; exit 0
        $ node -e "console.log(require(process.argv[1]).records.length)" ~/js-course/no12-data/tasks.json
        511
        ```

        Як це читати: `refused` — запити після `server.close()`, їх не прийняли (так і має бути). `broken` — кілька запитів, надісланих по вже вільному keep-alive з’єднанню саме тоді, коли сервер його закривав; до обробника вони не дійшли й нічого не записали. Доказ — 511 записів на диску = 4 початкові справи + 507 відповідей `201`: **кожен підтверджений POST на місці**. У всіх трьох прогонах на v25.2.1 і в прогоні на v22.23.3 (292 = 4 + 288) рівність виконалася, `broken` було від 2 до 4. Тому в production перед сервісом стоїть проксі чи балансувальник, що спершу бачить `/readyz` → 503 і перестає надсилати запити, а клієнти повторюють ідемпотентні запити (NO-11).

        **Крок 12 — шаблон `rehearsal.md`:**

        ```markdown
        # Rehearsal: no12-lab 1.4.0 — <date>
        - Node: <node --version>, OS: <your OS>
        - Artifact: artifacts/no12-lab-1.4.0.tgz, sha256 from record: <…>, shasum: <…> (match: yes/no)
        - Start command: <…>
        - Start line: <…>
        - /livez: <…>  /readyz: <…>
        - Load (3 s): <line from load.mjs>
        - /metrics (/tasks lines): <…>
        - SIGTERM under load: load line <…>; server lines <…>; exit code <…>
        - Records on disk vs 201 answers: <…> = 4 + <…> (match: yes/no)
        ```
      en: |
        You need the project `~/js-course/no12-lab` from the lesson “CI checks and artifacts” (version 1.3.0, saved in git), two terminals and curl. If the project is missing, first do steps 1–5 of that lesson’s local task. Port `7330` is the same as in this unit’s labs; if it is busy, use `7331` in every command.

        While preparing this lesson every step was run on macOS with Node.js v25.2.1 (npm 11.6.2) and again with v22.23.3 (npm 10.9.9), curl 8.7.1; the output below is from v25.2.1 and the English version of the files, and your `pid`, milliseconds and request counts will differ. Windows and Linux were not checked; Windows has no `kill -TERM` — there stop the server with Ctrl+C in its terminal (that is `SIGINT`, the same handler).

        **Step 4 — CI of version 1.4.0 (an excerpt):**

        ```text
        ▶ test: node --test test/app.test.ts
        …
        ℹ pass 4
        ℹ fail 0
        …
        ✔ CI passed: artifacts/no12-lab-1.4.0.tgz
          sha256 fb54f32760830b2a322307553ec4659cb2b0bd702caf607558c980d1599e2605
        ```

        **Step 7 — the artifact starts (terminal 1):**

        ```text
        planner 1.4.0 (pid 31194, NODE_ENV=production) listening on http://127.0.0.1:7330
        ```

        **Steps 8–9 — health, load and metrics (terminal 2):**

        ```text
        $ curl -sS http://127.0.0.1:7330/readyz
        {"status":"ready"}
        $ node scripts/load.mjs http://127.0.0.1:7330 3
        answered {"200":7079,"201":786}, refused 0, broken 0; p50 0.9 ms, p95 4.5 ms
        $ curl -sS http://127.0.0.1:7330/metrics
        …
        http_requests_total{route="/tasks",status="200"} 7079
        http_requests_total{route="/tasks",status="201"} 786
        http_request_duration_ms{route="/tasks",quantile="0.5"} 0.2
        http_request_duration_ms{route="/tasks",quantile="0.95"} 2.1
        ```

        p95 in `load.mjs` is larger than in `/metrics`: the client also measures the network and the queue of four concurrent requests, the server only its own work.

        **Steps 10–11 — `SIGTERM` under load (a fresh `DATA_DIR`, three runs on v25.2.1; an excerpt of one):**

        ```text
        terminal 2: answered {"200":4563,"201":507}, refused 140, broken 2; p50 0.6 ms, p95 2.6 ms
        terminal 1: SIGTERM: draining requests in flight (deadline 5000 ms)
                    drained; the store is already on disk; exit 0
        $ node -e "console.log(require(process.argv[1]).records.length)" ~/js-course/no12-data/tasks.json
        511
        ```

        How to read it: `refused` are requests after `server.close()`; they were not accepted (as it should be). `broken` are a few requests sent over an already idle keep-alive connection exactly while the server was closing it; they never reached the handler and wrote nothing. The proof: 511 records on disk = 4 initial tasks + 507 `201` answers — **every confirmed POST is there**. In all three runs on v25.2.1 and in the run on v22.23.3 (292 = 4 + 288) the equality held, and `broken` was 2 to 4. That is why in production a proxy or load balancer in front of the service first sees `/readyz` → 503 and stops sending requests, and clients retry idempotent requests (NO-11).

        **Step 12 — a `rehearsal.md` template:**

        ```markdown
        # Rehearsal: no12-lab 1.4.0 — <date>
        - Node: <node --version>, OS: <your OS>
        - Artifact: artifacts/no12-lab-1.4.0.tgz, sha256 from record: <…>, shasum: <…> (match: yes/no)
        - Start command: <…>
        - Start line: <…>
        - /livez: <…>  /readyz: <…>
        - Load (3 s): <line from load.mjs>
        - /metrics (/tasks lines): <…>
        - SIGTERM under load: load line <…>; server lines <…>; exit code <…>
        - Records on disk vs 201 answers: <…> = 4 + <…> (match: yes/no)
        ```
    tools:
      - { name: "Node.js", version: { uk: "22.13 або новіший", en: "22.13 or newer" }, note: { uk: "перевірено з v25.2.1 і v22.23.3", en: "checked with v25.2.1 and v22.23.3" } }
      - { name: "git", note: { uk: "перевірено з 2.51.0", en: "checked with 2.51.0" } }
      - { name: "curl", version: "8.7.1", note: { uk: "у PowerShell — `curl.exe`", en: "in PowerShell: `curl.exe`" } }
    steps:
      - text:
          uk: "Перейди в лабораторний проєкт і переконайся, що він на версії 1.3.0 без незбережених змін."
          en: "Go to the lab project and make sure it is on version 1.3.0 with no unsaved changes."
        command: "cd ~/js-course/no12-lab\ngit status --short\ngit log --oneline -1"
        expect:
          uk: "`git status --short` нічого не друкує, а останній коміт — `planner lab 1.3.0`."
          en: "`git status --short` prints nothing, and the last commit is `planner lab 1.3.0`."
      - text:
          uk: "Створи в VS Code файл `~/js-course/upgrade-lab-1.4.mjs` — **поруч** із проєктом, не в ньому, бо скрипт відмовляється працювати, коли в git є незбережені файли, — і встав у нього вміст вкладки `upgrade-lab-1.4.mjs` з прикладу «Планувальник 1.4.0». Запусти його з теки проєкту."
          en: "In VS Code, create the file `~/js-course/upgrade-lab-1.4.mjs` — **next to** the project, not in it, because the script refuses to work when git has unsaved files — and paste into it the content of the `upgrade-lab-1.4.mjs` tab from the example “Planner 1.4.0”. Run it from the project folder."
        command: "node ../upgrade-lab-1.4.mjs"
        expect:
          uk: "`Upgraded no12-lab to 1.4.0: eslint.config.js, src/store.ts, src/metrics.ts, src/app.ts, src/server.ts, scripts/load.mjs, test/app.test.ts, package.json`."
          en: "`Upgraded no12-lab to 1.4.0: eslint.config.js, src/store.ts, src/metrics.ts, src/app.ts, src/server.ts, scripts/load.mjs, test/app.test.ts, package.json`."
      - text:
          uk: "Збережи нову версію в git."
          en: "Save the new version in git."
        command: "git add -A\ngit commit -m \"planner lab 1.4.0: health, metrics, graceful shutdown\""
      - text:
          uk: "Запусти CI. Він залишить другий артефакт поруч із першим."
          en: "Run CI. It leaves a second artifact next to the first one."
        command: "node scripts/ci.mjs\nls artifacts"
        expect:
          uk: "`✔ CI passed: artifacts/no12-lab-1.4.0.tgz` і `ℹ pass 4`, як у кроці 4 вступу; в `artifacts` — архіви й записи обох версій, 1.3.0 і 1.4.0."
          en: "`✔ CI passed: artifacts/no12-lab-1.4.0.tgz` and `ℹ pass 4`, as in step 4 of the introduction; `artifacts` holds the archives and records of both versions, 1.3.0 and 1.4.0."
      - text:
          uk: "Перевір архів за записом релізу, перш ніж його запускати."
          en: "Verify the archive against its release record before starting it."
        command: "grep sha256 artifacts/no12-lab-1.4.0.release.json\nshasum -a 256 artifacts/no12-lab-1.4.0.tgz"
        expect:
          uk: "Обидва рядки показують той самий sha256. Якщо ні — не запускай цей архів: перезапусти CI."
          en: "Both lines show the same sha256. If not, do not start this archive: run CI again."
      - text:
          uk: "Розпакуй артефакт в окрему теку запуску. `npm pack` кладе файли в підтеку `package`."
          en: "Unpack the artifact into a separate run folder. `npm pack` puts the files into the subfolder `package`."
        command: "mkdir -p ~/js-course/no12-run/1.4.0\ntar -xzf artifacts/no12-lab-1.4.0.tgz -C ~/js-course/no12-run/1.4.0\nls ~/js-course/no12-run/1.4.0/package"
        expect:
          uk: "`app.js  config.js  metrics.js  package.json  server.js  store.js  tasks.js` — лише JavaScript, без `src` і `node_modules`."
          en: "`app.js  config.js  metrics.js  package.json  server.js  store.js  tasks.js` — JavaScript only, no `src` and no `node_modules`."
      - text:
          uk: "У терміналі 1 запусти артефакт у production-режимі й не закривай цей термінал."
          en: "In terminal 1, start the artifact in production mode and keep this terminal open."
        command: "cd ~/js-course/no12-run/1.4.0/package\nNODE_ENV=production PORT=7330 HOST=127.0.0.1 DATA_DIR=$HOME/js-course/no12-data node server.js"
        expect:
          uk: "Рядок `planner 1.4.0 (pid …, NODE_ENV=production) listening on http://127.0.0.1:7330`, як у кроці 7 вступу. Запиши собі `pid`."
          en: "The line `planner 1.4.0 (pid …, NODE_ENV=production) listening on http://127.0.0.1:7330`, as in step 7 of the introduction. Note the `pid`."
      - text:
          uk: "У терміналі 2 перевір health."
          en: "In terminal 2, check the health."
        command: "curl -sS http://127.0.0.1:7330/livez\ncurl -sS http://127.0.0.1:7330/readyz"
        expect:
          uk: "`{\"status\":\"alive\"}` і `{\"status\":\"ready\"}`."
          en: "`{\"status\":\"alive\"}` and `{\"status\":\"ready\"}`."
      - text:
          uk: "Дай сервісу 3 секунди навантаження й прочитай метрики."
          en: "Give the service 3 seconds of load and read the metrics."
        command: "cd ~/js-course/no12-lab\nnode scripts/load.mjs http://127.0.0.1:7330 3\ncurl -sS http://127.0.0.1:7330/metrics"
        expect:
          uk: "`refused 0, broken 0`, жодного статусу `500`, а в `/metrics` лічильники `/tasks` з тими самими кількостями `200` і `201`, що надрукував `load.mjs`, як у кроках 8–9 вступу."
          en: "`refused 0, broken 0`, no status `500`, and in `/metrics` the `/tasks` counters with the same numbers of `200` and `201` that `load.mjs` printed, as in steps 8–9 of the introduction."
      - text:
          uk: "Зупини сервер під навантаженням. Спершу зупини сервер у терміналі 1 через Ctrl+C, видали дані попереднього прогону й запусти сервер ще раз командою з кроку 7 — так кількість записів на диску можна буде порівняти з відповідями. Потім у терміналі 2 запусти навантаження на 4 секунди у фоні й одразу надішли `SIGTERM` процесу з його `pid` (підстав свій номер замість `<pid>`)."
          en: "Stop the server under load. First stop the server in terminal 1 with Ctrl+C, delete the previous run’s data and start the server again with the command of step 7 — that way the records on disk can be compared with the answers. Then in terminal 2 start the load for 4 seconds in the background and right away send `SIGTERM` to the process by its `pid` (put your number instead of `<pid>`)."
        command: "rm -rf ~/js-course/no12-data\n# … start the server again in terminal 1 (step 7), note its new pid …\nnode scripts/load.mjs http://127.0.0.1:7330 4 &\nsleep 1; kill -TERM <pid>; wait"
        expect:
          uk: "Термінал 1: `SIGTERM: draining requests in flight (deadline 5000 ms)` і `drained; the store is already on disk; exit 0`; термінал 2: рядок `load.mjs` з `refused` більше нуля, як у кроках 10–11 вступу."
          en: "Terminal 1: `SIGTERM: draining requests in flight (deadline 5000 ms)` and `drained; the store is already on disk; exit 0`; terminal 2: the `load.mjs` line with `refused` above zero, as in steps 10–11 of the introduction."
      - text:
          uk: "Перевір код виходу в терміналі 1 і порівняй записи на диску з відповідями `201`."
          en: "Check the exit code in terminal 1 and compare the records on disk with the `201` answers."
        command: "echo $?\nnode -e \"console.log(require(process.argv[1]).records.length)\" ~/js-course/no12-data/tasks.json"
        expect:
          uk: "`echo $?` у терміналі 1 друкує `0`. Кількість записів дорівнює 4 + кількість `201` з рядка `load.mjs`."
          en: "`echo $?` in terminal 1 prints `0`. The number of records equals 4 + the number of `201` from the `load.mjs` line."
      - text:
          uk: "Створи `~/js-course/no12-run/rehearsal.md` за шаблоном із кроку 12 вступу й заповни кожен рядок тим, що ти справді бачив, — скопіюй вивід, а не переказуй його."
          en: "Create `~/js-course/no12-run/rehearsal.md` from the template of step 12 of the introduction and fill in every line with what you really saw — copy the output instead of retelling it."
        expect:
          uk: "У файлі немає жодного порожнього `<…>`, а рядки «match» — `yes`."
          en: "The file has no empty `<…>` left, and the “match” lines say `yes`."
    verify:
      - id: artifact-verified
        text:
          uk: "Я перевірив sha256 архіву 1.4.0 за записом релізу до запуску й запускав розпакований артефакт, а не `src`."
          en: "I verified the sha256 of the 1.4.0 archive against its release record before starting, and I ran the unpacked artifact, not `src`."
      - id: health-metrics
        text:
          uk: "`/livez`, `/readyz` і `/metrics` відповіли, а навантаження пройшло без `500`, `refused` і `broken`."
          en: "`/livez`, `/readyz` and `/metrics` answered, and the load passed without `500`, `refused` or `broken`."
      - id: clean-stop
        text:
          uk: "Після `SIGTERM` під навантаженням сервер вийшов із кодом 0, а кількість записів на диску дорівнює 4 + кількість відповідей `201`."
          en: "After `SIGTERM` under load the server exited with code 0, and the records on disk equal 4 + the number of `201` answers."
      - id: log-written
        text:
          uk: "Мій `rehearsal.md` містить справжній вивід кожного кроку."
          en: "My `rehearsal.md` holds the real output of every step."
    troubleshooting:
      - problem:
          uk: "`upgrade-lab-1.4.mjs` пише `Commit or undo these changes first; nothing was changed:` і список файлів."
          en: "`upgrade-lab-1.4.mjs` says `Commit or undo these changes first; nothing was changed:` and a list of files."
        fix:
          uk: "У проєкті є незбережені зміни — часто це сам скрипт, покладений усередину `no12-lab`. Перенеси його в `~/js-course` (`mv upgrade-lab-1.4.mjs ..`), закоміть або відкинь решту змін і запусти `node ../upgrade-lab-1.4.mjs` знову. Саме цей випадок ми відтворили під час підготовки."
          en: "The project has unsaved changes — often the script itself, placed inside `no12-lab`. Move it to `~/js-course` (`mv upgrade-lab-1.4.mjs ..`), commit or discard the other changes and run `node ../upgrade-lab-1.4.mjs` again. We reproduced exactly this case while preparing."
      - problem:
          uk: "Сервер пише `Invalid configuration:` і `DATA_DIR must be an absolute path: \"\"`."
          en: "The server says `Invalid configuration:` and `DATA_DIR must be an absolute path: \"\"`."
        fix:
          uk: "Змінні треба задати в тому самому рядку, що й `node server.js`, як у кроці 7. `$HOME` дає абсолютний шлях, а `~` усередині значення змінної оболонка розгортає не завжди."
          en: "The variables must be set on the same line as `node server.js`, as in step 7. `$HOME` gives an absolute path, while the shell does not always expand `~` inside a variable’s value."
      - problem:
          uk: "Старт закінчується `Error: listen EADDRINUSE: address already in use 127.0.0.1:7330`."
          en: "The start ends with `Error: listen EADDRINUSE: address already in use 127.0.0.1:7330`."
        fix:
          uk: "Порт зайнятий іншим процесом — наприклад, сервером із попереднього кроку, якого ти не зупинив. Зупини його через Ctrl+C у його терміналі або використовуй `PORT=7331` (і `7331` у всіх командах терміналу 2)."
          en: "The port is busy with another process — for example, the server from an earlier step that you did not stop. Stop it with Ctrl+C in its terminal, or use `PORT=7331` (and `7331` in every command of terminal 2)."
    recovery:
      uk: "Репетиція нічого не змінює в проєкті, крім коміту версії 1.4.0. Дані й розпакований артефакт лежать окремо, у `~/js-course/no12-data` і `~/js-course/no12-run` — їх можна будь-коли видалити й почати з кроку 6. Повернутися до 1.3.0 у проєкті можна через `git log --oneline`, щоб знайти коміт `planner lab 1.3.0`, і `git switch --detach <коміт>`; архів 1.3.0 лежить в `artifacts` і запускається так само."
      en: "The rehearsal changes nothing in the project except the commit of version 1.4.0. The data and the unpacked artifact live separately, in `~/js-course/no12-data` and `~/js-course/no12-run` — you can delete them at any time and start from step 6. To get back to 1.3.0 in the project, find the commit `planner lab 1.3.0` with `git log --oneline` and run `git switch --detach <commit>`; the 1.3.0 archive is in `artifacts` and starts the same way."
