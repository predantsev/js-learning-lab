id: no-14-02-cumulative-review
unit: NO-14
title:
  uk: "Накопичувальне повторення всіх чотирьох етапів"
  en: "Cumulative review across four stages"
kind: review
minutes: 30
contentVersion: 1
purpose:
  uk: "Перед фінальним гейтом ти без нотаток пригадуєш головний механізм кожного етапу — замикання й цикл подій, знімки стану, межу native і web, потоки й власника даних — і передбачаєш, чим закінчаться п’ять незнайомих фрагментів, де ці механізми змішано. Кожне питання називає урок, до якого варто повернутися; наприкінці ти обираєш одну тему, яку повториш перед гейтом."
  en: "Before the final gate you recall without notes the core mechanism of each stage — closures and the event loop, state snapshots, the native/web boundary, streams and who owns the data — and predict how five unseen snippets that mix these mechanisms end. Every question names the lesson to return to; at the end you pick the one topic you will revisit before the gate."
objectives:
  - uk: "Без нотаток пригадати головний механізм кожного етапу (замикання й цикл подій, знімки стану й ефекти, межа native/web, потоки й власник даних між клієнтом і сервером) і передбачити його дію в коротких незнайомих фрагментах."
    en: "Retrieve without notes the core mechanism of each stage (closures and the event loop, state snapshots and effects, the native/web boundary, streams and client/server ownership) and predict its effect in short unseen snippets."
  - uk: "Оцінити себе за критеріями гейту й назвати одну тему, яку треба повторити перед завданнями гейту."
    en: "Self-assess against the gate criteria and name the one area to revisit before the gate tasks."
prerequisites: [no-14-01-focused-labs-closure]
subskills: []
glossary: []
selfCheck: [predict-awaited-loop, predict-no-drain, predict-stale-list]

blocks:
  - id: how-to-review
    kind: explanation
    title:
      uk: "Як проходити це повторення"
      en: "How to go through this review"
    body:
      uk: |
        Нового матеріалу тут немає. Є питання з усіх чотирьох етапів — JavaScript, React, React Native і Node.js — і п’ять фрагментів, де механізми різних етапів зустрічаються в одному коді.

        - Відповідай **до** пояснення й без нотаток: саме спроба пригадати закріплює знання, навіть невдала.
        - Під кожним питанням указано урок, з якого воно. Помилився — запиши назву уроку: вона знадобиться наприкінці.
        - Платформа по-справжньому запускає код двох питань і трьох фрагментів, тож їхній вивід перевірено. Фрагмент про `node:stream` наприкінці уроку можна запустити як справжній Node.js.

        Далі три уроки гейту. Підказок там не буде.
      en: |
        There is no new material here. There are questions from all four stages — JavaScript, React, React Native and Node.js — and five snippets in which the mechanisms of different stages meet in one piece of code.

        - Answer **before** the explanation and without notes: the very attempt to recall is what makes the knowledge stick, even a failed one.
        - Every question names the lesson it comes from. If you got it wrong, write down the lesson's name: you will need it at the end.
        - The platform really runs the code of two questions and three snippets, so their output is verified. The `node:stream` snippet can be run as real Node.js at the end of the lesson.

        Next come the three lessons of the gate. There will be no hints there.

  - id: recall-javascript
    kind: review
    title:
      uk: "JavaScript"
      en: "JavaScript"
    items:
      - id: fixed-today
        from: js-18-03-unseen-transfer
        prompt:
          uk: "У гейті JavaScript правило «Полити сьогодні» отримувало сьогоднішню дату параметром, а тести брали зафіксовану дату. Що було б, якби функція сама викликала `new Date()`?"
          en: "In the JavaScript gate the “Water today” rule got today's date as a parameter, and the tests used a fixed date. What would happen if the function called `new Date()` itself?"
        answer:
          type: choice
          options:
            - id: flaky
              text: { uk: "Результат тестів залежав би від дня, коли їх запускають: сьогодні зелені, завтра — ні", en: "The test results would depend on the day they are run: green today, not tomorrow" }
            - id: same
              text: { uk: "Нічого: дата однакова, хоч де її взяти", en: "Nothing: the date is the same wherever it comes from" }
              why:
                uk: "`new Date()` дає момент запуску. Тест, написаний 1 березня, наступного тижня перевіряє вже інший день — і «полити сьогодні» відповідає інакше."
                en: "`new Date()` gives the moment of the run. A test written on 1 March checks another day next week — and “water today” answers differently."
            - id: faster
              text: { uk: "Тести стали б швидшими: менше параметрів", en: "The tests would get faster: fewer parameters" }
              why:
                uk: "Кількість параметрів на швидкість не впливає. Справа в детермінованості: однаковий вхід — однаковий результат будь-якого дня."
                en: "The number of parameters does not affect speed. It is about determinism: the same input gives the same result on any day."
          correct: [flaky]
        explanation:
          uk: "Детерміновані фікстури — одна з вимог того гейту: «сьогодні» передають ззовні. У прикладі попереднього уроку сервер так само передає дату в рендер, а клієнт бере її з даних сторінки."
          en: "Deterministic fixtures were one of that gate's requirements: “today” is passed in from outside. In the previous lesson's example the server passes the date into the render in the same way, and the client takes it from the page data."

      - id: microtask-order
        from: js-08-04-microtasks-vs-tasks
        prompt:
          uk: "У якому порядку з’являться рядки?"
          en: "In which order do the lines appear?"
        code: |
          setTimeout(() => console.log("timer"), 0);
          Promise.resolve().then(() => console.log("then"));
          queueMicrotask(() => console.log("micro"));
          console.log("sync");
        verify:
          logs: ["sync", "then", "micro", "timer"]
        answer:
          type: choice
          options:
            - id: right
              code: "sync\nthen\nmicro\ntimer"
            - id: written-order
              code: "timer\nthen\nmicro\nsync"
              why:
                uk: "Колбеки не виконуються там, де їх записано. Спершу доходить до кінця синхронний код, тож `sync` — перший."
                en: "Callbacks do not run where they are written. The synchronous code runs to the end first, so `sync` comes first."
            - id: timer-first
              code: "sync\ntimer\nthen\nmicro"
              why:
                uk: "Таймер із `0` — це task. Перед наступним task черга microtasks спорожнюється повністю: `then` і `micro` встигають раніше."
                en: "A timer with `0` is a task. Before the next task the microtask queue is emptied completely: `then` and `micro` get in first."
          correct: [right]
        explanation:
          uk: "Синхронний код → усі microtasks у порядку постановки → наступний task. У Node.js діє те саме правило: колбеки promises виконуються раніше за таймери."
          en: "Synchronous code → every microtask in the order queued → the next task. The same rule holds in Node.js: promise callbacks run before timers."

      - id: two-tallies
        from: js-03-05-closures
        prompt:
          uk: "Що виведе `console.log`?"
          en: "What does `console.log` print?"
        code: |
          function makeTally() {
            let total = 0;
            return () => (total += 2);
          }
          const pages = makeTally();
          const minutes = makeTally();
          pages();
          pages();
          console.log(pages(), minutes());
        verify:
          logs: ["6 2"]
        answer:
          type: choice
          options:
            - id: right
              code: "6 2"
            - id: shared
              code: "6 8"
              why:
                uk: "Кожен виклик `makeTally()` створює власну коробку з власним `total`. `minutes` не бачить коробки `pages`."
                en: "Every call of `makeTally()` creates its own box with its own `total`. `minutes` does not see the box of `pages`."
            - id: reset
              code: "2 2"
              why:
                uk: "`total` живе не у виклику стрілкової функції, а в коробці виклику `makeTally`, яка переживає ці виклики й накопичує значення."
                en: "`total` lives not in the call of the arrow function but in the box of the `makeTally` call, which outlives those calls and accumulates the value."
          correct: [right]
        explanation:
          uk: "Функція тримає живе посилання на коробку, де народилася. Дві фабрики — дві коробки. Це основа і серверних таймерів, і обробників React."
          en: "A function keeps a live link to the box it was born in. Two factory calls — two boxes. This underlies both server timers and React handlers."

  - id: recall-react-native
    kind: review
    title:
      uk: "React і React Native"
      en: "React and React Native"
    items:
      - id: artifact-walkthrough
        from: re-12-09-gate-independent-e2e
        prompt:
          uk: "У гейті React ти проходив сценарій `docs/e2e-walkthrough.md` наново на preview-сервері для 0.2.0, хоча `npm test` уже був зелений. Що додає цей прохід?"
          en: "In the React gate you went through the scenario `docs/e2e-walkthrough.md` again on the preview server for 0.2.0, although `npm test` was already green. What does that walk-through add?"
        answer:
          type: choice
          options:
            - id: artifact
              text: { uk: "Перевіряє саме зібраний артефакт у браузері — те, що отримають люди, а не вихідний код, на якому йшли тести", en: "It checks the built artifact itself in a browser — what people get, not the source code the tests ran on" }
            - id: nothing
              text: { uk: "Нічого: якщо тести зелені, збірка теж правильна", en: "Nothing: if the tests are green, the build is right too" }
              why:
                uk: "Тести запускали вихідний код. Збірка додає своє: змінні середовища, шляхи, мініфікацію. Тому в тому гейті ще й шукали приватне значення в `dist`."
                en: "The tests ran the source code. The build adds its own things: environment variables, paths, minification. That is why that gate also searched `dist` for a private value."
            - id: speed
              text: { uk: "Перевіряє лише швидкість завантаження", en: "It checks only the load speed" }
              why:
                uk: "Сценарій — це кроки людини й очікувані результати, тобто поведінка зібраного застосунку, а не замір часу."
                en: "The scenario is a person's steps and expected results — the behavior of the built app, not a timing."
          correct: [artifact]
        explanation:
          uk: "Доказ випуску — перевірка того, що випускають. У гейті Node.js так само: сервер перевіряють справжніми запитами й справжнім перезапуском, а не лише модульними тестами."
          en: "Release evidence is a check of what is released. The same in the Node.js gate: the server is checked with real requests and a real restart, not only with unit tests."

      - id: mock-gap
        from: rn-12-06-gate-independent-native-quality
        prompt:
          uk: "У нативному гейті компонентні тести з mock-модулем сповіщень пройшли, а емулятора чи пристрою в тебе немає. Що потрапляє в докази?"
          en: "In the native gate the component tests with a mocked notifications module passed, and you have no emulator or device. What goes into the evidence?"
        answer:
          type: choice
          options:
            - id: gap-and-skip
              text: { uk: "Прогалина mock-у в списку й перевірка на пристрої, записана як невиконана", en: "The mock gap in the list and the device check recorded as not performed" }
            - id: passed
              text: { uk: "Перевірку на пристрої можна позначити пройденою: mock поводиться як модуль", en: "The device check can be marked passed: the mock behaves like the module" }
              why:
                uk: "Mock поводиться так, як його написали, а не як нативний модуль на телефоні. Що саме він не доводить — це і є прогалина, яку перевіряють на цілі."
                en: "A mock behaves the way it was written, not like the native module on a phone. What exactly it does not prove is the gap that is checked on the target."
            - id: omit
              text: { uk: "Нічого: без пристрою про нативну частину краще не згадувати", en: "Nothing: without a device it is better not to mention the native part" }
              why:
                uk: "Тиша схожа на «все гаразд». Чесний запис «не виконано» каже читачеві, що перевірку ще треба зробити."
                en: "Silence looks like “all fine”. An honest “not performed” record tells the reader that the check still has to be done."
          correct: [gap-and-skip]
        explanation:
          uk: "Перевірка на заявленій цілі або виконана й записана, або записана як невиконана. Те саме правило діє в останньому завданні цього розділу."
          en: "A check on the declared target is either performed and recorded, or recorded as not performed. The same rule applies in the last task of this unit."

      - id: device-address
        from: no-06-05-web-native-adapters
        prompt:
          uk: "Вебклієнт і сервер на одному комп’ютері працюють через `http://127.0.0.1:7330`. Ту саму адресу отримав нативний адаптер в Android-емуляторі. Що станеться?"
          en: "The web client and the server on one computer work through `http://127.0.0.1:7330`. The native adapter in the Android emulator got the same address. What happens?"
        answer:
          type: choice
          options:
            - id: emulator-itself
              text: { uk: "Запити не дійдуть до сервера: `127.0.0.1` в емуляторі — це сам емулятор; до комп’ютера веде `10.0.2.2`", en: "The requests do not reach the server: `127.0.0.1` in the emulator is the emulator itself; `10.0.2.2` leads to the computer" }
            - id: works
              text: { uk: "Усе працює: це ж той самий комп’ютер", en: "Everything works: it is the same computer" }
              why:
                uk: "Емулятор має власну мережу. Його loopback — він сам, а loopback комп’ютера доступний через псевдонім `10.0.2.2`."
                en: "The emulator has its own network. Its loopback is itself, and the computer's loopback is reachable through the alias `10.0.2.2`."
            - id: cors
              text: { uk: "Сервер відмовить через CORS", en: "The server refuses because of CORS" }
              why:
                uk: "CORS — правило браузера. Нативний застосунок його не застосовує, а тут запит навіть не доходить до сервера."
                en: "CORS is a browser rule. A native app does not apply it, and here the request does not even reach the server."
          correct: [emulator-itself]
        explanation:
          uk: "Спільна логіка — одна, адаптер і адреса — свої для кожної цілі. Це та сама межа native і web, що й на початку етапу React Native."
          en: "The shared logic is one, the adapter and the address are per target. This is the same native/web boundary as at the start of the React Native stage."

  - id: recall-node
    kind: review
    title:
      uk: "Node.js"
      en: "Node.js"
    items:
      - id: false-means-wait
        from: no-11-01-streams-backpressure
        prompt:
          uk: "`writable.write(chunk)` повернув `false`. Що має зробити код, який пише?"
          en: "`writable.write(chunk)` returned `false`. What should the writing code do?"
        answer:
          type: choice
          options:
            - id: wait-drain
              text: { uk: "Зупинитися, доки writable stream не надішле `'drain'`; цей шматок уже в черзі", en: "Stop until the writable stream emits `'drain'`; this chunk is already in the queue" }
            - id: retry
              text: { uk: "Записати той самий шматок ще раз: його не прийняли", en: "Write the same chunk again: it was not accepted" }
              why:
                uk: "`false` не означає «втрачено». Шматок уже стоїть у черзі; записати його вдруге — записати двічі."
                en: "`false` does not mean “lost”. The chunk is already queued; writing it again means writing it twice."
            - id: ignore
              text: { uk: "Нічого: потік сам притримає виробника", en: "Nothing: the stream will hold the producer back by itself" }
              why:
                uk: "Writable stream лише повідомляє. Хто ігнорує `false`, той наповнює чергу в пам’яті без межі."
                en: "A writable stream only reports. Whoever ignores `false` fills the queue in memory without a limit."
          correct: [wait-drain]
        explanation:
          uk: "Це backpressure: сигнал «повільніше» від споживача. Один із фрагментів нижче показує, що буває, коли його не чути."
          en: "That is backpressure: a “slow down” signal from the consumer. One of the snippets further on shows what happens when nobody listens to it."

      - id: server-owns
        from: no-06-01-client-server-boundary
        prompt:
          uk: "Після інтеграції вебклієнт тримає список, завантажений із сервера. Тим часом інша вкладка додала запис через API. Чий список правильний?"
          en: "After the integration the web client keeps the list it loaded from the server. Meanwhile another tab added a record through the API. Whose list is right?"
        answer:
          type: choice
          options:
            - id: server
              text: { uk: "Серверний: клієнт тримає лише кеш, що застаріває, щойно запис змінив хтось інший", en: "The server's: the client keeps only a cache that goes stale as soon as someone else changes a record" }
            - id: client
              text: { uk: "Клієнтський: його показано людині, отже, він і є правдою", en: "The client's: it is what the person sees, so it is the truth" }
              why:
                uk: "Показане — це копія на момент завантаження. Що сервер зберіг, те й правда; клієнт має знову запитати сервер."
                en: "What is shown is a copy from the moment of loading. What the server stored is what is true; the client has to ask the server again."
            - id: last-writer
              text: { uk: "Того, хто писав останнім", en: "Whoever wrote last" }
              why:
                uk: "Клієнт тут нічого не писав — він лише тримає старе читання. Джерело істини — сервер."
                en: "The client wrote nothing here — it only keeps an old read. The source of truth is the server."
          correct: [server]
        explanation:
          uk: "Сервер — джерело істини, клієнт — кеш. Це знадобиться і в рев’ю PR про офлайн-синхронізацію в гейті."
          en: "The server is the source of truth, the client is a cache. You will need this in the review of the offline sync PR in the gate."

  - id: mixed-snippets
    kind: explanation
    title:
      uk: "П’ять фрагментів, де етапи зустрічаються"
      en: "Five snippets where the stages meet"
    body:
      uk: |
        Далі — п’ять коротких фрагментів, яких у курсі ще не було. У кожному механізм одного етапу працює всередині коду іншого: таймер на сервері, цикл з `await`, обробник React, потік Node.js, кеш клієнта.

        Спершу передбач, потім дивись пояснення. Помилки записуй разом з уроком, який названо в поясненні.
      en: |
        Next come five short snippets the course has not had yet. In each, the mechanism of one stage works inside the code of another: a timer on a server, a loop with `await`, a React handler, a Node.js stream, a client cache.

        Predict first, then read the explanation. Write down your mistakes together with the lesson the explanation names.

  - id: predict-timer-config
    kind: prediction
    prompt:
      uk: "Сервер планує щоденний звіт таймером і тримає налаштування в об’єкті. До спрацювання таймера налаштування змінюють двічі. Що надрукує таймер?"
      en: "A server schedules a daily digest with a timer and keeps its settings in an object. Before the timer fires, the settings change twice. What does the timer print?"
    code: |
      let config = { hour: 8 };
      const atStart = config;

      setTimeout(() => console.log(atStart.hour, config.hour), 20);

      config.hour = 9;        // the same object changes
      config = { hour: 10 };  // the variable gets a new object
    verify:
      logs: ["9 10"]
    answer:
      type: choice
      options:
        - id: right
          code: "9 10"
        - id: copies
          code: "8 8"
          why:
            uk: "Колбек не фотографує значення в момент створення: він читає змінні `atStart` і `config` тоді, коли таймер спрацьовує."
            en: "The callback does not take a snapshot when it is created: it reads the variables `atStart` and `config` when the timer fires."
        - id: same-object
          code: "10 10"
          why:
            uk: "`atStart` досі вказує на перший об’єкт: присвоєння `config = …` змінило лише змінну `config`. А зміну `config.hour = 9` бачать обидві, бо тоді вони ще вказували на той самий об’єкт."
            en: "`atStart` still points at the first object: the assignment `config = …` changed only the variable `config`. And both see the change `config.hour = 9`, because at that moment they still pointed at the same object."
        - id: mutation-only
          code: "9 9"
          why:
            uk: "Замикання тримає живе посилання на змінну `config`, тож бачить і її нове значення — об’єкт з `hour: 10`."
            en: "The closure keeps a live link to the variable `config`, so it sees its new value too — the object with `hour: 10`."
      correct: [right]
    explanation:
      uk: "Замикання бачить **змінні**, а не копії значень (JS-03, «Closures: функції пам’ятають, де народилися»). Зміна вмісту об’єкта видна всім змінним, що на нього вказують; нове присвоєння змінює лише одну змінну. Таймер, що має бачити свіжі налаштування, читає їх з тієї змінної, яку оновлюють."
      en: "A closure sees **variables**, not copies of values (JS-03, “Closures: functions remember their birthplace”). A change of an object's contents is visible to every variable pointing at it; a new assignment changes one variable only. A timer that must see fresh settings reads them from the variable that gets updated."

  - id: predict-awaited-loop
    kind: prediction
    prompt:
      uk: "Три очікування по 60, 20 і 40 мс — спершу по черзі в циклі, потім разом. Що надрукують три виклики `console.log`?"
      en: "Three waits of 60, 20 and 40 ms — first one by one in a loop, then together. What do the three `console.log` calls print?"
    code: |
      const wait = (ms) => new Promise((resolve) => setTimeout(() => resolve(ms), ms));

      const inLoop = [];
      for (const ms of [60, 20, 40]) inLoop.push(await wait(ms));
      console.log(inLoop.join(" "));

      const together = await Promise.all([60, 20, 40].map(wait));
      console.log(together.join(" "));

      const finished = [];
      await Promise.all([60, 20, 40].map(async (ms) => finished.push(await wait(ms))));
      console.log(finished.join(" "));
    verify:
      logs: ["60 20 40", "60 20 40", "20 40 60"]
    answer:
      type: choice
      options:
        - id: right
          code: "60 20 40\n60 20 40\n20 40 60"
        - id: all-by-finish
          code: "60 20 40\n20 40 60\n20 40 60"
          why:
            uk: "`Promise.all` повертає результати в порядку **вхідного масиву**, хоч би хто завершився першим. Порядок завершення видно лише тоді, коли кожен сам дописує себе в спільний масив."
            en: "`Promise.all` returns the results in the order of the **input array**, whoever finishes first. The finishing order shows only when each one appends itself to a shared array."
        - id: loop-by-finish
          code: "20 40 60\n60 20 40\n20 40 60"
          why:
            uk: "`await` у циклі чекає кожне очікування до кінця, перш ніж почати наступне, тож вони йдуть по черзі — 60, потім 20, потім 40 — і загалом займають 120 мс, а не 60."
            en: "`await` in a loop waits for each wait to the end before starting the next, so they run one by one — 60, then 20, then 40 — and take 120 ms in total, not 60."
      correct: [right]
    explanation:
      uk: "Цикл з `await` виконує роботу по черзі; `Promise.all` — одночасно, але зберігає порядок входу (JS-08, «all/allSettled/race/any; послідовно чи паралельно»). На сервері це різниця між трьома запитами до бази по черзі й разом."
      en: "A loop with `await` does the work one by one; `Promise.all` — at the same time, but it keeps the input order (JS-08, “all/allSettled/race/any; sequential vs concurrent”). On a server this is the difference between three database requests one by one and together."

  - id: predict-read-after-set
    kind: prediction
    prompt:
      uk: "Компонент лічить прочитані сторінки. На кнопці зараз `40`. Людина клацає один раз. Що з’явиться в консолі й що буде на кнопці?"
      en: "A component counts pages read. The button now shows `40`. A person clicks once. What appears in the console, and what is on the button?"
    lang: jsx
    runnable: false
    code: |
      function PagesRead() {
        const [pages, setPages] = useState(40);

        function handleAdd() {
          setPages((current) => current + 10);
          console.log("logged", pages);
        }

        return <button onClick={handleAdd}>{pages}</button>;
      }
    answer:
      type: choice
      options:
        - id: right
          text: { uk: "У консолі `logged 40`, на кнопці `50`", en: "The console shows `logged 40`, the button `50`" }
        - id: updater-is-instant
          text: { uk: "У консолі `logged 50`, на кнопці `50`", en: "The console shows `logged 50`, the button `50`" }
          why:
            uk: "Функція-оновлювач рахує **наступний** стан, але не змінює `pages` цього рендеру. `pages` — `const` знімка, у якому створено обробник."
            en: "The updater function computes the **next** state, but it does not change `pages` of this render. `pages` is a `const` of the snapshot the handler was created in."
        - id: nothing-changes
          text: { uk: "У консолі `logged 40`, на кнопці `40`", en: "The console shows `logged 40`, the button `40`" }
          why:
            uk: "Сетер просить React про новий рендер, і той отримає `50`. Старим лишається лише значення в уже запущеному обробнику."
            en: "The setter asks React for a new render, and it gets `50`. Only the value inside the handler that is already running stays old."
      correct: [right]
    explanation:
      uk: "Стан — це знімок кожного рендеру (RE-02, «Стан — це знімок кожного рендеру»). Оновлювач правильно рахує наступне значення, але код після сетера в тому самому обробнику бачить старе. Якщо нове значення треба ще й відправити чи записати, його обчислюють один раз у змінну й використовують і в сетері, і далі."
      en: "State is a snapshot per render (RE-02, “State is a snapshot per render”). The updater computes the next value correctly, but the code after the setter in the same handler sees the old one. If the new value must also be sent or stored, compute it once into a variable and use it both in the setter and after it."

  - id: predict-no-drain
    kind: prediction
    prompt:
      uk: "Writable stream з лімітом 32 байти зберігає кожен шматок 5 мс. Цикл пише п’ять шматків по 16 байтів і не дивиться на відповідь `write()`, лише рахує відмови. Що надрукує `console.log`?"
      en: "A writable stream with a 32-byte limit stores each chunk in 5 ms. A loop writes five 16-byte chunks and does not look at the answer of `write()` — it only counts the refusals. What does `console.log` print?"
    code: |
      import { Writable } from "node:stream";

      const slow = new Writable({
        highWaterMark: 32,
        write(chunk, encoding, done) {
          setTimeout(done, 5);
        },
      });

      let refused = 0;
      for (let i = 0; i < 5; i++) {
        if (!slow.write("x".repeat(16))) refused += 1;
      }
      console.log(refused, slow.writableLength);
    runnable: false
    answer:
      type: choice
      options:
        - id: right
          code: "4 80"
        - id: capped
          code: "4 32"
          why:
            uk: "Ліміт не обрізає чергу: кожен `write()` додає шматок, навіть коли відповідає `false`. У черзі всі п’ять шматків — 80 байтів."
            en: "The limit does not cut the queue: every `write()` adds its chunk, even when it answers `false`. All five chunks are queued — 80 bytes."
        - id: one-refused
          code: "3 80"
          why:
            uk: "Після першого шматка в черзі 16 байтів — менше за 32, тож `true`. Уже після другого — 32, а це не менше за ліміт: `false`. Відмов чотири."
            en: "After the first chunk the queue holds 16 bytes — below 32, so `true`. Already after the second it holds 32, which is not below the limit: `false`. Four refusals."
        - id: never-refused
          code: "0 80"
          why:
            uk: "`write()` відповідає `false`, щойно черга доходить до ліміту, — навіть якщо код цю відповідь ігнорує."
            en: "`write()` answers `false` as soon as the queue reaches the limit — even if the code ignores the answer."
      correct: [right]
    explanation:
      uk: "Без очікування `'drain'` черга росте на кожен шматок (NO-11, «Потоки й backpressure»). Двадцять шматків тримали б 320 байтів, двадцять тисяч — мегабайти. Приклад цього уроку «Потік без очікування й з очікуванням» запускає це по-справжньому."
      en: "Without waiting for `'drain'` the queue grows with every chunk (NO-11, “Streams and backpressure”). Twenty chunks would hold 320 bytes, twenty thousand — megabytes. This lesson’s example “A stream without and with the wait” runs this for real."

  - id: predict-stale-list
    kind: prediction
    prompt:
      uk: "Клієнт завантажив список витрат і тримає його в змінній. Потім інший пристрій додає витрату через API. Що надрукує `console.log`?"
      en: "A client loaded the list of expenses and keeps it in a variable. Then another device adds an expense through the API. What does `console.log` print?"
    code: |
      const stored = ["e-01", "e-02"];
      const api = {
        list: async () => [...stored],
        add: async (id) => {
          stored.push(id);
        },
      };

      const shown = await api.list();
      await api.add("e-03"); // another device
      console.log(shown.length, (await api.list()).length);
    verify:
      logs: ["2 3"]
    answer:
      type: choice
      options:
        - id: right
          code: "2 3"
        - id: live
          code: "3 3"
          why:
            uk: "`list` повертає **копію** (`[...stored]`), тож `shown` — знімок на момент завантаження. Нової витрати в ньому немає, доки клієнт не запитає знову."
            en: "`list` returns a **copy** (`[...stored]`), so `shown` is a snapshot from the moment of loading. The new expense is not in it until the client asks again."
        - id: lost
          code: "2 2"
          why:
            uk: "Сервер зберіг `e-03`: новий виклик `api.list()` отримує три записи. Застаріла лише копія клієнта."
            en: "The server stored `e-03`: a new call of `api.list()` gets three records. Only the client's copy is stale."
      correct: [right]
    explanation:
      uk: "Сервер — джерело істини, клієнт — кеш (NO-06, «Межа клієнт/сервер і власність даних»). Свіжість не настає сама: клієнт запитує знову після власного запису, після повернення онлайн чи за таймером."
      en: "The server is the source of truth, the client is a cache (NO-06, “The client/server boundary and ownership”). Freshness does not come by itself: the client asks again after its own write, after coming back online or on a timer."

  - id: drain-check
    kind: example
    runtime: isolated-node
    dir: drain-check
    entry: index.js
    strings:
      without: { uk: "Без очікування 'drain' найбільша черга:", en: "Without waiting for 'drain' the largest queue:" }
      with: { uk: "З очікуванням 'drain' найбільша черга:", en: "Waiting for 'drain' the largest queue:" }
      bytes: { uk: "байтів", en: "bytes" }
    title:
      uk: "Потік без очікування й з очікуванням"
      en: "A stream without and with the wait"
    body:
      uk: |
        Фрагмент про `write()` — як справжній Node.js. Той самий повільний writable stream (ліміт 32 байти, 5 мс на шматок) отримує двадцять шматків по 16 байтів двічі: спершу код ігнорує `false`, потім чекає `'drain'`. Програма друкує найбільшу довжину черги (`writableLength`) кожного разу.

        Натисни **Запустити**.
      en: |
        The `write()` snippet as real Node.js. The same slow writable stream (a 32-byte limit, 5 ms per chunk) gets twenty 16-byte chunks twice: first the code ignores `false`, then it waits for `'drain'`. The program prints the largest queue length (`writableLength`) each time.

        Press **Run**.
    tryIt:
      uk: |
        1. Заміни `i < 20` на `i < 200`: без очікування черга виростає вдесятеро, з очікуванням лишається 32.
        2. Заміни `highWaterMark: 32` на `highWaterMark: 64`: з очікуванням найбільша черга — 64. Ліміт задає, скільки можна тримати, а не скільки записати.
      en: |
        1. Replace `i < 20` with `i < 200`: without the wait the queue grows tenfold, with the wait it stays at 32.
        2. Replace `highWaterMark: 32` with `highWaterMark: 64`: with the wait the largest queue is 64. The limit sets how much may be held, not how much may be written.

  - id: before-the-gate
    kind: explanation
    title:
      uk: "Перед гейтом: обери одну тему"
      en: "Before the gate: pick one topic"
    body:
      uk: |
        Гейт — три уроки, кожен перевіряє своє, і підказок у них немає:

        | Урок гейту | Що перевіряють | Що із цього повторення там знадобиться |
        |---|---|---|
        | Незнайомий дефект і тести | відтворити, знайти причину, виправити, довести тестом, що падає до й проходить після | SQL-запит, знімок стану, замикання в таймері |
        | Дизайн-рев’ю, PR і runbook | знайти пропущену вимогу й найризикованіший компроміс, написати коментарі, рішення й відкат | власник даних, кеш клієнта, runbook |
        | Самостійне завдання | функція від запиту до сторінки з тестами, доказами й записом пропусків | усе, плюс одна з фокусних лабораторних |

        Подивись на свої помилки. Якщо їх кілька, обери **одну** тему — ту, що стоїть у найбільшій кількості рядків таблиці, — і повтори названий урок до гейту. Якщо помилок немає, переходь далі.
      en: |
        The gate is three lessons; each checks its own thing, and none has hints:

        | Gate lesson | What is checked | What from this review it needs |
        |---|---|---|
        | Unseen defect and tests | reproduce, find the cause, fix, prove with a test that fails before and passes after | an SQL query, a state snapshot, a closure in a timer |
        | Design review, PR and runbook | find the missed requirement and the riskiest trade-off, write the comments, the decision and the rollback | who owns the data, the client cache, the runbook |
        | Independent task | a feature from the request to the page with tests, evidence and skip records | all of it, plus one of the focused labs |

        Look at your mistakes. If there are several, pick **one** topic — the one that appears in the most rows of the table — and review the named lesson before the gate. If there are none, move on.
