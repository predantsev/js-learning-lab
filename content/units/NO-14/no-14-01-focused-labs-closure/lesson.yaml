id: no-14-01-focused-labs-closure
unit: NO-14
title:
  uk: "Підсумок фокусних лабораторних: SQL, автентифікація, SSR"
  en: "Closing the focused labs: SQL, auth, SSR"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Пояснити для кожної фокусної лабораторної (SQL, автентифікація, SSR), які вміння перейшли в проєкт, які за задумом лишилися в синтетичній лабораторній і чому."
    en: "Explain for each focused lab (SQL, auth, SSR) which skills transferred to the capstone, which stayed in the synthetic lab by design, and why."
  - uk: "Повторно запустити по одній перевірці з кожної лабораторної на свіжих синтетичних даних, спершу передбачивши її результат."
    en: "Rerun one check from each lab on fresh synthetic data and predict its result before running it."
prerequisites: [no-08-05-troubleshoot-explain, no-13-07-independent-ssr-lab]
subskills:
  - { family: B-13, skill: "SQL/auth/SSR focused labs", depth: intro }
glossary: []
selfCheck: [predict-idle-owner, transfer-notes]

blocks:
  - id: why-three-labs
    kind: explanation
    title:
      uk: "Три лабораторні поруч із проєктом"
      en: "Three labs next to the project"
    body:
      uk: |
        Три розділи етапу Node.js не змінювали твій проєкт — і це було навмисно:

        | Лабораторна | Що ти будував | Чому не в проєкті |
        |---|---|---|
        | NO-09, SQL | базу записів на заняття: ключі, з’єднання, індекс, міграцію | після NO-04 проєкт тримає записи в одному файлі (NO-05 дозволяє обрати й SQLite) |
        | NO-10, автентифікація | сервіс закладок: хеш пароля, сесії, власність, ліміти | проєкт однокористувацький, входу немає |
        | NO-13, SSR | сторінку списку читання з гідратацією | за планом курсу частина SSR переходить у проєкт |

        Це не додаткові вправи «для охочих». Фінальний гейт перевіряє ці вміння як обов’язкові: у самостійному завданні наприкінці розділу тобі знадобиться одне з них, а про решту треба буде пояснити, де вони не застосовні.

        І ще одне: те, що лабораторна колись пройшла, не доводить, що вміння досі з тобою. Доводить свіжа перевірка — на даних, яких ти не бачив, із результатом, який ти спершу передбачив.
      en: |
        Three units of the Node.js stage did not change your project — on purpose:

        | Lab | What you built | Why not in the project |
        |---|---|---|
        | NO-09, SQL | a session booking database: keys, joins, an index, a migration | after NO-04 the project keeps its records in one file (NO-05 also allows SQLite) |
        | NO-10, auth | a bookmarks service: a password hash, sessions, ownership, limits | the project is single-user, there is no login |
        | NO-13, SSR | a reading-list page with hydration | in the course plan part of SSR moves into the project |

        These are not extra exercises “for the keen”. The final gate checks these skills as required: in the independent task at the end of this unit you will need one of them, and for the others you will have to explain where they do not apply.

        One more thing: a lab you passed once does not prove that the skill is still with you. A fresh check does — on data you have not seen, with a result you predicted first.

  - id: labs-to-project
    kind: visual
    visual: diagram
    title:
      uk: "Що з лабораторних перейшло в проєкт"
      en: "What moved from the labs into the project"
    textEquivalent:
      uk: "Ліворуч три лабораторні: NO-09 SQL, NO-10 автентифікація, NO-13 SSR. Праворуч дві цілі: server/ твого проєкту і «лишається в лабораторній». Від SQL суцільна стрілка до server/ — версії схеми й покрокові міграції; пунктирна — до «лишається»: з’єднання, індекси й SQL-параметри, бо записи лежать в одному файлі. Від автентифікації суцільна стрілка до server/ — ліміти розміру й часу та секрети з конфігурації; пунктирна — до «лишається»: паролі, сесії й перевірка власника, бо користувач один. Від SSR суцільна стрілка до server/ — рендер на сервері, безпечні початкові дані й гідратація з даних сторінки; пунктирна — до «лишається»: серверні компоненти React, бо для них немає ні бандлера, ні середовища. Останній крок: вміння, що лишилося в лабораторній, не зникло, і його доводять свіжою перевіркою з передбаченням."
      en: "On the left, three labs: NO-09 SQL, NO-10 auth, NO-13 SSR. On the right, two targets: your project's server/ and “stays in the lab”. From SQL a solid arrow to server/ — schema versions and step-by-step migrations; a dashed one to “stays”: joins, indexes and SQL parameters, because the records live in one file. From auth a solid arrow to server/ — size and time limits and secrets from configuration; a dashed one to “stays”: passwords, sessions and owner checks, because there is one user. From SSR a solid arrow to server/ — server rendering, safe initial data and hydration from the page data; a dashed one to “stays”: React Server Components, because there is neither a bundler nor an environment for them. The last step: a skill that stayed in the lab has not vanished, and a fresh check with a prediction proves it."
    spec:
      layout: grid
      nodes:
        - { id: sql, label: "NO-09 · SQL", w: 130, col: 0, row: 0 }
        - { id: auth, label: "NO-10 · auth", w: 130, col: 0, row: 1 }
        - { id: ssr, label: "NO-13 · SSR", w: 130, col: 0, row: 2 }
        - { id: server, label: "server/", shape: cylinder, w: 150, col: 1, row: 0 }
        - { id: stays, label: { uk: "лишається в лабораторній", en: "stays in the lab" }, shape: note, w: 190, col: 1, row: 2 }
      edges:
        - { id: sql-in, from: sql, to: server }
        - { id: sql-out, from: sql, to: stays, kind: dashed }
        - { id: auth-in, from: auth, to: server }
        - { id: auth-out, from: auth, to: stays, kind: dashed }
        - { id: ssr-in, from: ssr, to: server }
        - { id: ssr-out, from: ssr, to: stays, kind: dashed }
      steps:
        - caption:
            uk: "Три лабораторні й дві цілі. Суцільна стрілка — вміння, яке проєкт за планом курсу використовує; пунктирна — вміння, яке лишається в лабораторній, бо проєкт його не потребує."
            en: "Three labs and two targets. A solid arrow is a skill the project uses in the course plan; a dashed one is a skill that stays in the lab, because the project does not need it."
        - caption:
            uk: "SQL: у проєкт ідуть версії схеми й покрокові міграції — ту саму ідею має файл даних. З’єднання, індекс і параметри SQL лишаються: таблиць у проєкті немає, записи лежать в одному файлі."
            en: "SQL: schema versions and step-by-step migrations go into the project — the data file has the same idea. Joins, the index and SQL parameters stay: the project has no tables, its records live in one file."
          highlight: [sql, server, stays, sql-in, sql-out]
          annotate:
            - { id: sql-out, text: { uk: "один файл", en: "one file" } }
        - caption:
            uk: "Автентифікація: ліміти розміру й часу та секрети з конфігурації потрібні будь-якому серверу. Паролі, сесії й перевірка власника лишаються: користувач один, і немає чужих даних, які треба захищати від нього."
            en: "Auth: size and time limits and secrets from configuration are needed by any server. Passwords, sessions and the owner check stay: there is one user, and no one else's data to protect from them."
          highlight: [auth, server, stays, auth-in, auth-out]
          annotate:
            - { id: auth-out, text: { uk: "один користувач", en: "one user" } }
        - caption:
            uk: "SSR: рендер на сервері, безпечні початкові дані й гідратація з даних сторінки — за планом курсу частина проєкту. Серверні компоненти React лишаються поясненням: для них потрібні бандлер і середовище, яких у проєкті немає."
            en: "SSR: server rendering, safe initial data and hydration from the page data are part of the project in the course plan. React Server Components stay an explanation: they need a bundler and an environment the project does not have."
          highlight: [ssr, server, stays, ssr-in, ssr-out]
          annotate:
            - { id: ssr-out, text: { uk: "немає RSC", en: "no RSC" } }
        - caption:
            uk: "Пунктир не означає «забуто». Вміння з лабораторної перевіряє гейт, тож його доводять свіжою перевіркою: спершу передбачення, потім запуск."
            en: "Dashed does not mean “forgotten”. The gate checks the lab skills, so they are proven with a fresh check: a prediction first, then a run."
          highlight: [stays, sql-out, auth-out, ssr-out]

  - id: predict-left-join
    kind: prediction
    strings:
      stretch: { uk: "Розтяжка", en: "Stretching" }
      journal: { uk: "Щоденник", en: "Journal" }
      noPhone: { uk: "Вечір без телефона", en: "An evening without the phone" }
    prompt:
      uk: "У таблиці `habits` три звички: `h-11` («%%stretch%%»), `h-12` («%%journal%%»), `h-13` («%%noPhone%%»). У `checkins` — відмітки `h-11` за 29 квітня, 2 і 3 травня та `h-12` за 3 травня; у `h-13` відміток немає. Скільки рядків поверне цей запит із параметром `'2026-05-01'` і які в них `done`?"
      en: "The table `habits` has three habits: `h-11` (“%%stretch%%”), `h-12` (“%%journal%%”), `h-13` (“%%noPhone%%”). `checkins` has marks of `h-11` for 29 April, 2 and 3 May and of `h-12` for 3 May; `h-13` has none. How many rows does this query return with the parameter `'2026-05-01'`, and what is their `done`?"
    lang: sql
    code: |
      SELECT h.name AS name, COUNT(c.day) AS done
      FROM habits h
      LEFT JOIN checkins c ON c.habitId = h.id
      WHERE c.day >= ?
      GROUP BY h.id
      ORDER BY done DESC, h.id
    runnable: false
    answer:
      type: choice
      options:
        - id: two-rows
          text: { uk: "Два рядки: `done` 2 і 1", en: "Two rows: `done` 2 and 1" }
        - id: three-rows
          text: { uk: "Три рядки: `done` 2, 1 і 0", en: "Three rows: `done` 2, 1 and 0" }
          why:
            uk: "`LEFT JOIN` дає `h-13` рядок із `c.day = NULL`, але `WHERE` іде після з’єднання: `NULL >= '2026-05-01'` — не істина, тож рядок `h-13` відкинуто. Щоб нуль лишився, умову про день ставлять в `ON`."
            en: "`LEFT JOIN` gives `h-13` a row with `c.day = NULL`, but `WHERE` comes after the join: `NULL >= '2026-05-01'` is not true, so the `h-13` row is dropped. To keep the zero, the condition on the day goes into `ON`."
        - id: counts-all
          text: { uk: "Три рядки: `done` 3, 1 і 0", en: "Three rows: `done` 3, 1 and 0" }
          why:
            uk: "Відмітку за 29 квітня відкидає умова `c.day >= ?`, тож `h-11` має 2, а не 3. І `h-13` не дійде до результату: його рядок із `NULL` теж не проходить `WHERE`."
            en: "The condition `c.day >= ?` drops the mark for 29 April, so `h-11` has 2, not 3. And `h-13` does not reach the result: its row with `NULL` does not pass `WHERE` either."
      correct: [two-rows]
    explanation:
      uk: "Звичка без відміток отримує від `LEFT JOIN` рядок із `NULL`, а `WHERE c.day >= ?` його відкидає: `LEFT JOIN` мовчки стає звичайним з’єднанням. Умова в `ON c.habitId = h.id AND c.day >= ?` лишає `h-13` з нулем — так написано перевірку в прикладі цього уроку. Повтори `LEFT JOIN` і `NULL` в уроках NO-09, якщо відповідь не далася."
      en: "A habit without marks gets a row with `NULL` from `LEFT JOIN`, and `WHERE c.day >= ?` drops it: the `LEFT JOIN` silently becomes an ordinary join. The condition in `ON c.habitId = h.id AND c.day >= ?` keeps `h-13` with a zero — that is how the check in this lesson's example is written. Review `LEFT JOIN` and `NULL` in the NO-09 lessons if the answer did not come."

  - id: predict-idle-owner
    kind: prediction
    prompt:
      uk: "Сесія простою не довше 30 хвилин (межа включно). Що виведуть три виклики `console.log`?"
      en: "A session may be idle for at most 30 minutes (the limit inclusive). What do the three `console.log` calls print?"
    code: |
      const IDLE_MS = 30 * 60 * 1000;
      const session = { userId: 'u-21', lastSeenAt: 0 };
      const wishlist = { id: 'l-1', ownerId: 'u-21' };

      function statusFor(session, wishlist, now) {
        if (now - session.lastSeenAt > IDLE_MS) return 401;
        if (wishlist.ownerId !== session.userId) return 404;
        return 200;
      }

      console.log(statusFor(session, wishlist, IDLE_MS));
      console.log(statusFor({ ...session, userId: 'u-22' }, wishlist, IDLE_MS));
      console.log(statusFor(session, wishlist, IDLE_MS + 1));
    verify:
      logs: ["200", "404", "401"]
    answer:
      type: choice
      options:
        - id: right
          code: "200\n404\n401"
        - id: boundary-expired
          code: "401\n404\n401"
          why:
            uk: "Рівно 30 хвилин — ще не простій понад межу: `IDLE_MS > IDLE_MS` хибне. Сесія закінчується лише на 1 мс пізніше."
            en: "Exactly 30 minutes is not yet idle beyond the limit: `IDLE_MS > IDLE_MS` is false. The session ends only 1 ms later."
        - id: forbidden
          code: "200\n403\n401"
          why:
            uk: "Код повертає `404`, бо власник — частина пошуку: чужий список має виглядати як відсутній, щоб відповідь не підтверджувала, що він існує."
            en: "The code returns `404`, because the owner is part of the lookup: someone else's list must look like a missing one, so the answer does not confirm that it exists."
        - id: owner-first
          code: "200\n404\n404"
          why:
            uk: "Перевірка сесії стоїть першою. Протермінована сесія — `401`, хоч би чий був список."
            en: "The session check comes first. An expired session is `401`, whoever owns the list."
      correct: [right]
    explanation:
      uk: "Спершу брама автентифікації (сесія жива? межа включно), потім брама авторизації (чий список?). Чужий і відсутній список дають однакові `404`. Це перевірки з лабораторної NO-10, тут — на інших даних."
      en: "First the authentication gate (is the session alive? the limit inclusive), then the authorization gate (whose list?). Someone else's list and a missing one give the same `404`. These are the checks of the NO-10 lab, here on other data."

  - id: retention-checks
    kind: example
    runtime: isolated-node
    dir: retention-checks
    entry: index.js
    capabilities: { network: loopback }
    strings:
      stretch: { uk: "Розтяжка", en: "Stretching" }
      journal: { uk: "Щоденник", en: "Journal" }
      noPhone: { uk: "Вечір без телефона", en: "An evening without the phone" }
      birthday: { uk: "На день народження", en: "For my birthday" }
      newHome: { uk: "Для нової квартири", en: "For the new flat" }
      dueTitle: { uk: "Сьогодні до", en: "Due on" }
      callPlumber: { uk: "Викликати сантехніка", en: "Call the plumber" }
      buyTickets: { uk: "Купити квитки на потяг", en: "Buy the train tickets" }
      own: { uk: "свій список", en: "own list" }
      foreign: { uk: "чужий", en: "someone else's" }
      afterIdle: { uk: "свій через 30 хв + 1 мс", en: "own after 30 min + 1 ms" }
      markupMatch: { uk: "розмітка сервера й клієнта збігається:", en: "server and client markup match:" }
    title:
      uk: "Три перевірки з трьох лабораторних"
      en: "Three checks from three labs"
    body:
      uk: |
        По одній перевірці з кожної лабораторної — на даних, яких там не було: звички замість записів на заняття, списки бажань замість закладок, справи на сьогодні замість списку читання.

        - `sql-check.js` — справжній `node:sqlite`: з’єднання з агрегатом і параметром, нулі теж;
        - `auth-check.js` — справжній сервер `node:http` на `127.0.0.1` із сесією, що закінчується після 30 хвилин простою, і пошуком за власником; годинник передається в сервер, тож перевірка пересуває час, не чекаючи;
        - `ssr-check.js` — сервер рендерить справи з датою, яку **передає** сам, кладе ті самі дані в сторінку, а перший рендер клієнта бере їх звідти. `mini-react.js` — навчальна заміна React із NO-13 без змін; чим вона відрізняється від справжнього, написано вгорі файла.

        Натисни **Запустити**.
      en: |
        One check from each lab — on data the labs did not have: habits instead of session bookings, wishlists instead of bookmarks, today's tasks instead of a reading list.

        - `sql-check.js` — real `node:sqlite`: a join with an aggregate and a parameter, zeros included;
        - `auth-check.js` — a real `node:http` server on `127.0.0.1` with a session that ends after 30 idle minutes and a lookup by owner; the clock is passed into the server, so the check moves time without waiting;
        - `ssr-check.js` — the server renders the tasks with a date it **passes in** itself, puts the same data into the page, and the client's first render takes them from there. `mini-react.js` is the teaching stand-in for React from NO-13, unchanged; how it differs from the real one is written at the top of the file.

        Press **Run**.
    tryIt:
      uk: |
        Зміни по одному вхідному значенню в кожній перевірці так, щоб вона «впала», і поясни чому. Після кожного кроку поверни як було.

        1. У `sql-check.js` перенеси `AND c.day >= ?` з рядка `LEFT JOIN` у новий рядок `WHERE c.day >= ?` одразу перед `GROUP BY`. Рядок SQL зникає: у «%%noPhone%%» немає відміток, і `WHERE` відкидає її рядок із `NULL`.
        2. В `index.js` заміни `clock.time += IDLE_MS + 1;` на `clock.time += IDLE_MS;`. Третій статус стає `200`: межа включно. А тепер видали в `auth-check.js` частину `&& list.ownerId === session.userId` — чужий список відповідає `200`, і це вже витік чужих даних.
        3. В `index.js` заміни `clientRender(fromPage)` на `clientRender({ ...fromPage, today: '2026-05-05' })` — так поводився б клієнт, що бере дату з власного годинника, коли в нього вже 5 травня. Рядок SSR друкує `false`: у заголовку інша дата, а зі списку зникла справа на 4 травня.
      en: |
        Change one input in each check so that it “fails”, and explain why. After each step put it back.

        1. In `sql-check.js` move `AND c.day >= ?` from the `LEFT JOIN` line to a new line `WHERE c.day >= ?` right before `GROUP BY`. A row of the SQL line disappears: “%%noPhone%%” has no marks, and `WHERE` drops its row with `NULL`.
        2. In `index.js` replace `clock.time += IDLE_MS + 1;` with `clock.time += IDLE_MS;`. The third status becomes `200`: the limit is inclusive. Now delete the part `&& list.ownerId === session.userId` in `auth-check.js` — someone else's list answers `200`, and that is a leak of someone else's data.
        3. In `index.js` replace `clientRender(fromPage)` with `clientRender({ ...fromPage, today: '2026-05-05' })` — that is how a client taking the date from its own clock would behave when it is already 5 May there. The SSR line prints `false`: the heading has another date, and the task for 4 May is gone from the list.

  - id: recall-labs
    kind: review
    title:
      uk: "Пригадай лабораторні"
      en: "Recall the labs"
    items:
      - id: key-not-index
        from: no-09-10-independent-schema-design
        prompt:
          uk: "У лабораторній із записами на заняття еталонна таблиця `bookings` мала первинний ключ `(sessionId, attendee)`, а запит шукав усі записи однієї людини: `WHERE attendee = ?`. Що показує план такого запиту без окремого індексу?"
          en: "In the session booking lab the reference table `bookings` had the primary key `(sessionId, attendee)`, and a query looked up all bookings of one person: `WHERE attendee = ?`. What does the plan of that query show without a separate index?"
        answer:
          type: choice
          options:
            - id: scan
              text: { uk: "Перегляд усієї `bookings`: ключ починається з `sessionId`, тож за `attendee` він не допомагає", en: "A scan of the whole `bookings`: the key starts with `sessionId`, so it does not help a search by `attendee`" }
            - id: uses-key
              text: { uk: "Пошук за ключем: `attendee` входить у первинний ключ", en: "A search by the key: `attendee` is part of the primary key" }
              why:
                uk: "Складений ключ упорядковано спершу за `sessionId`. Шукати лише за другим стовпцем — як шукати в телефонній книзі за ім’ям без прізвища."
                en: "A composite key is ordered by `sessionId` first. Searching by the second column alone is like searching a phone book by first name without the surname."
            - id: no-difference
              text: { uk: "План однаковий за будь-якої схеми — SQLite сам вирішує", en: "The plan is the same whatever the schema — SQLite decides by itself" }
              why:
                uk: "SQLite обирає з того, що є. Без індексу, що починається з `attendee`, йому лишається лише перегляд таблиці."
                en: "SQLite chooses from what exists. Without an index that starts with `attendee`, only a table scan is left."
          correct: [scan]
        explanation:
          uk: "Тому в лабораторній був потрібен індекс на `attendee` — або ключ `(attendee, sessionId)`, який дає цей пошук сам."
          en: "That is why the lab needed an index on `attendee` — or the key `(attendee, sessionId)`, which gives that search by itself."
      - id: same-401
        from: no-10-10-independent-auth-lab
        prompt:
          uk: "У сервісі закладок невідомий користувач і хибний пароль мали отримувати однакову відповідь `401`. Навіщо?"
          en: "In the bookmarks service an unknown user and a wrong password had to get the same `401` answer. Why?"
        answer:
          type: choice
          options:
            - id: enumeration
              text: { uk: "Щоб відповідь не підказувала, які облікові записи існують", en: "So the answer does not reveal which accounts exist" }
            - id: simpler
              text: { uk: "Щоб код був коротшим: одна гілка замість двох", en: "To keep the code shorter: one branch instead of two" }
              why:
                uk: "Довжина коду тут ні до чого. Різні відповіді дозволили б перебрати назви й дізнатися, хто зареєстрований, — це перелік користувачів."
                en: "Code length has nothing to do with it. Different answers would let someone try names and learn who is registered — that is user enumeration."
            - id: rate
              text: { uk: "Щоб обмеження спроб рахувало обидва випадки разом", en: "So the login throttling counts both cases together" }
              why:
                uk: "Ліміт невдалих входів у лабораторній і так рахує за обліковим записом і за адресою. Однакова відповідь захищає від іншого — від з’ясування, хто існує."
                en: "The lab's failed-login limit counts per account and per address anyway. The same answer protects against something else — finding out who exists."
          correct: [enumeration]
        explanation:
          uk: "Тому еталон лабораторної ще й перевіряє невідомого користувача проти справжнього запису scrypt: обидві невдачі коштують однаково й за часом."
          en: "That is why the lab's reference also checks an unknown user against a real scrypt record: both failures cost the same in time too."
      - id: script-in-title
        from: no-13-07-independent-ssr-lab
        prompt:
          uk: "У SSR-лабораторній назва книжки могла містити `</script>`, а початкові дані лежали в `<script id=\"initial-data\" type=\"application/json\">`. Що вимагало завдання від JSON у сторінці?"
          en: "In the SSR lab a book title could contain `</script>`, and the initial data sat in `<script id=\"initial-data\" type=\"application/json\">`. What did the task require of the JSON in the page?"
        answer:
          type: choice
          options:
            - id: escaped
              text: { uk: "Жодного сирого `<`, `>`, `&`, U+2028 чи U+2029 — лише їхні екранування JSON, і `JSON.parse` дає ті самі дані", en: "No raw `<`, `>`, `&`, U+2028 or U+2029 — only their JSON escapes, and `JSON.parse` gives the same data" }
            - id: stringify
              text: { uk: "Досить `JSON.stringify`: він сам екранує все небезпечне", en: "`JSON.stringify` is enough: it escapes everything dangerous by itself" }
              why:
                uk: "`JSON.stringify` лишає `<` і `/` як є, тож `</script>` у назві закрив би тег даних. Екранувати для місця в HTML треба окремо."
                en: "`JSON.stringify` leaves `<` and `/` as they are, so `</script>` in a title would close the data tag. Escaping for the place in HTML is a separate step."
            - id: strip
              text: { uk: "Прибрати з назв усі теги, а решту лишити", en: "Remove every tag from the titles and keep the rest" }
              why:
                uk: "Тоді сторінка показала б не ту назву, яку зберіг користувач, а `&` і роздільник рядків U+2028 лишилися б сирими. Дані не змінюють — їх кодують для місця в HTML."
                en: "Then the page would show a different title from the one the user saved, and `&` and the U+2028 line separator would stay raw. The data is not changed — it is encoded for its place in HTML."
          correct: [escaped]
        explanation:
          uk: "HTML-безпечний JSON кодує небезпечні символи як `\\u003c` тощо: браузер не бачить у них розмітки, а `JSON.parse` повертає ту саму назву."
          en: "HTML-safe JSON encodes the dangerous characters as `\\u003c` and so on: the browser sees no markup in them, and `JSON.parse` returns the same title."

  - id: transfer-notes
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: transfer-notes
    entry: index.js
    editable: [notes.js]
    capabilities: { network: loopback }
    strings:
      stretch: { uk: "Розтяжка", en: "Stretching" }
      journal: { uk: "Щоденник", en: "Journal" }
      noPhone: { uk: "Вечір без телефона", en: "An evening without the phone" }
      dueTitle: { uk: "Сьогодні до", en: "Due on" }
      cardUser: { uk: "Проєктом користується одна людина; входу немає.", en: "One person uses the project; there is no login." }
      cardFile: { uk: "Записи лежать в одному файлі JSON, який сервер читає цілим.", en: "The records live in one JSON file that the server reads whole." }
      cardLoopback: { uk: "Сервер слухає лише 127.0.0.1.", en: "The server listens only on 127.0.0.1." }
      cardLimit: { uk: "Тіло запиту понад 4096 байтів отримує 413.", en: "A request body over 4096 bytes gets 413." }
      cardConfig: { uk: "Налаштування приходять зі змінних середовища й перевіряються під час старту.", en: "Settings come from environment variables and are checked at startup." }
      cardMigrations: { uk: "Файл даних має schemaVersion і покрокові міграції.", en: "The data file has a schemaVersion and step-by-step migrations." }
      cardRender: { uk: "GET / рендериться на сервері й гідратується в браузері; RSC немає.", en: "GET / is rendered on the server and hydrated in the browser; there is no RSC." }
      reasonUser: { uk: "одна людина: немає чужих даних і немає кому входити", en: "one person: no one else's data and nobody to log in" }
      reasonFile: { uk: "один файл JSON: немає таблиць, з’єднань і SQL", en: "one JSON file: no tables, joins or SQL" }
      reasonRsc: { uk: "немає бандлера й середовища для протоколу RSC", en: "no bundler or environment for the RSC protocol" }
      skillParams: { uk: "параметри в запитах SQL", en: "parameters in SQL queries" }
      skillJoins: { uk: "з’єднання таблиць і агрегати", en: "table joins and aggregates" }
      skillIndex: { uk: "індекс, обґрунтований планом запиту", en: "an index justified by the query plan" }
      skillMigrations: { uk: "версія схеми й покрокові міграції", en: "a schema version and step-by-step migrations" }
