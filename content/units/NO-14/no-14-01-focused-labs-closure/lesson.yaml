      yourPrediction: { uk: "твоє передбачення", en: "your prediction" }
      yourRecord: { uk: "твій запис", en: "your record" }
      revisit: { uk: "передбачення не збіглося — повернися до уроку", en: "the prediction did not match — go back to lesson" }
      predictFirst: { uk: "спершу запиши передбачення в predicted", en: "write your prediction into predicted first" }
      paraSql: { uk: "У проєкт перейшла версія схеми з покроковими міграціями, а з’єднання, індекси й параметри SQL лишилися в лабораторній, бо записи лежать в одному файлі. Свіжа перевірка з нулем для звички без відміток пройшла так, як я передбачив.", en: "The schema version with step-by-step migrations moved into the project, while joins, indexes and SQL parameters stayed in the lab, because the records live in one file. The fresh check with a zero for a habit without marks went as I predicted." }
      paraAuth: { uk: "У проєкті є ліміти розміру й часу та секрети з конфігурації; паролі, сесії й перевірка власника лишилися в лабораторній, бо користувач один. Я передбачив 401 після 58 хвилин, але кожен запит оновлює простій — повторю урок про строки сесій.", en: "The project has size and time limits and secrets from configuration; passwords, sessions and the owner check stayed in the lab, because there is one user. I predicted 401 after 58 minutes, but every request refreshes the idle time — I will review the lesson on session limits." }
      paraSsr: { uk: "Рендер на сервері, безпечні початкові дані й гідратація з даних сторінки за планом переходять у проєкт, а RSC лишаються поясненням без бандлера. Клієнт із власною датою дав іншу розмітку, як я й чекав: дату треба брати з даних сторінки.", en: "Server rendering, safe initial data and hydration from the page data move into the project in the plan, while RSC stay an explanation without a bundler. A client with its own date gave other markup, as I expected: the date has to come from the page data." }
      altSql: { uk: "Міграції з версією схеми потрібні й файлу даних проєкту. SQL — з’єднання, індекс, параметри — потрібен лише там, де є таблиці, а в проєкті один файл. Я чекав 2, 1, 0, бо забув, що день 2 травня тепер раніше за межу.", en: "Migrations with a schema version are needed by the project's data file too. SQL — joins, an index, parameters — is needed only where there are tables, and the project has one file. I expected 2, 1, 0, because I forgot that 2 May is now before the limit." }
      altAuth: { uk: "Ліміти й секрети з конфігурації — для будь-якого сервера, тож вони в проєкті. Решта автентифікації чекає на випадок, коли користувачів стане більше за одного. Ковзний простій я передбачив правильно: кожен запит його оновлює.", en: "Limits and secrets from configuration are for any server, so they are in the project. The rest of auth waits for the day there is more than one user. I predicted the sliding idle limit right: every request refreshes it." }
      altSsr: { uk: "SSR переходить у проєкт: сервер рендерить, сторінка несе безпечні дані, клієнт гідратує з них. RSC потребують бандлера, якого немає. Я думав, що дата не вплине на розмітку, — помилився: вона в заголовку й у фільтрі.", en: "SSR moves into the project: the server renders, the page carries safe data, the client hydrates from it. RSC need a bundler there is none of. I thought the date would not affect the markup — wrong: it is in the heading and in the filter." }
    title:
      uk: "Записка про перенесення з трьох лабораторних"
      en: "A transfer note for three labs"
    instructions:
      uk: |
        Заповни `notes.js` — по запису для кожної лабораторної (`sql`, `auth`, `ssr`). Картка проєкту, перелік вмінь і причини — у `project.js` (лише для читання).

        1. **Розклади вміння.** Кожне вміння лабораторної з `skills` — рівно в одному списку: `applied` (ідентифікатор вміння, яке використовує проєкт із картки) або `stayed` (`{ skill, because }`, де `because` — ідентифікатор причини з `reasons`, тобто властивість картки, через яку вміння проєкту не потрібне).
        2. **Спершу передбач.** До запуску запиши в `predicted` результат свіжої перевірки з `fresh-checks.js`: для `sql` — масив `done` у порядку рядків, для `auth` — масив трьох статусів, для `ssr` — `true` чи `false`.
        3. **Потім запусти** й перепиши справжній результат у `observed`. **Запустити** показує справжній результат перевірки лише тоді, коли передбачення вже записано. Передбачення не виправляй: якщо воно не збіглося, **Запустити** назве урок, до якого варто повернутися.
        4. **Абзац** `paragraph` для кожної лабораторної — щонайменше 80 символів, свій для кожної: що перейшло, що лишилося й чому, і що показала свіжа перевірка.
      en: |
        Fill in `notes.js` — one entry per lab (`sql`, `auth`, `ssr`). The project card, the list of skills and the reasons are in `project.js` (read-only).

        1. **Sort the skills.** Every skill of the lab in `skills` goes into exactly one list: `applied` (the id of a skill the project on the card uses) or `stayed` (`{ skill, because }`, where `because` is a reason id from `reasons` — the card property that makes the skill unnecessary for the project).
        2. **Predict first.** Before running, write into `predicted` the result of the fresh check in `fresh-checks.js`: for `sql` the array of `done` in row order, for `auth` an array of three statuses, for `ssr` `true` or `false`.
        3. **Then run** and copy the real result into `observed`. **Run** shows the real result of a check only once its prediction is written. Do not correct the prediction: if it did not match, **Run** names the lesson to go back to.
        4. **A paragraph** `paragraph` for every lab — at least 80 characters, a different one for each: what moved, what stayed and why, and what the fresh check showed.
    testTitles:
      "every skill of each lab is in exactly one list":
        uk: "Кожне вміння лабораторної — рівно в одному списку"
        en: "Every skill of each lab is in exactly one list"
      "skills the project card uses are applied":
        uk: "Вміння, які використовує проєкт із картки, — в `applied`"
        en: "Skills the project on the card uses are in `applied`"
      "each skill that stays names the card property that makes it unnecessary":
        uk: "Кожне вміння в `stayed` називає властивість картки, через яку воно не потрібне"
        en: "Each skill in `stayed` names the card property that makes it unnecessary"
      "each lab records the observed result of its fresh check":
        uk: "Кожна лабораторна має в `observed` справжній результат свіжої перевірки"
        en: "Each lab has the real result of its fresh check in `observed`"
      "each lab records a prediction of the same shape":
        uk: "Кожна лабораторна має передбачення тієї самої форми"
        en: "Each lab has a prediction of the same shape"
      "each lab has its own paragraph of at least 80 characters":
        uk: "Кожна лабораторна має свій абзац щонайменше на 80 символів"
        en: "Each lab has its own paragraph of at least 80 characters"
    hints:
      nudge:
        uk: "Для кожного вміння спитай: чи є в картці рядок, якому це вміння потрібне? Якщо так — `applied`. Якщо ні — яка властивість картки робить його зайвим?"
        en: "For each skill ask: is there a line on the card that needs this skill? If so — `applied`. If not — which property of the card makes it unnecessary?"
      explanation:
        uk: "Приклад з іншої галузі: кухар, який учився пекти хліб у печі, приходить у кафе із самою мікрохвильовкою. Уміння відміряти й зважувати переходить; випікання лишається — бо «немає печі», а не «не люблю хліб». Причина завжди — властивість місця. Так і тут: причина вміння в `stayed` — це ідентифікатор властивості картки з `reasons`. А `observed` бери лише з виводу **Запустити**: перевірка порівнює його зі справжнім запуском."
        en: "An example from elsewhere: a cook who learned to bake bread in an oven comes to a café that has only a microwave. Measuring and weighing move with them; baking stays — because “there is no oven”, not “I dislike bread”. The reason is always a property of the place. Same here: the reason of a skill in `stayed` is the id of a card property from `reasons`. And take `observed` only from the output of **Run**: the check compares it with a real run."
    solutionNote:
      uk: "Картка вирішує все: один користувач робить зайвими паролі, сесії й перевірку власника; один файл — з’єднання, індекс і параметри SQL; без бандлера RSC немає. Ліміти, секрети з конфігурації, міграції з версією схеми й увесь SSR без RSC проєкт із картки використовує. Передбачення може не збігтися з `observed` — чесний запис і повернення до уроку цінніші за вгаданий результат."
      en: "The card decides everything: one user makes passwords, sessions and the owner check unnecessary; one file — joins, the index and SQL parameters; without a bundler there is no RSC. The project on the card uses the limits, secrets from configuration, migrations with a schema version and all of SSR except RSC. A prediction may differ from `observed` — an honest record and a return to the lesson are worth more than a guessed result."
    feedback:
      - when: { test: "every skill of each lab is in exactly one list" }
        message:
          uk: "Ця перевірка збирає для кожної лабораторної ідентифікатори з `applied` і поля `skill` з `stayed` і очікує всі вміння з `skills` цієї лабораторної — кожне рівно раз. Ідентифікатори пиши так, як у `project.js`."
          en: "This check collects, for each lab, the ids in `applied` and the `skill` fields in `stayed` and expects every skill of that lab in `skills` — each exactly once. Write the ids as in `project.js`."
      - when: { test: "skills the project card uses are applied" }
        message:
          uk: "Ця перевірка очікує в `applied` саме ті вміння, яким відповідає рядок картки. Вміння, без якого проєкт із картки обходиться, належить до `stayed`, навіть якщо воно корисне."
          en: "This check expects in `applied` exactly the skills that a line of the card corresponds to. A skill the project on the card does without belongs in `stayed`, even if it is useful."
      - when: { test: "each skill that stays names the card property that makes it unnecessary" }
        message:
          uk: "Ця перевірка дивиться на `because` кожного вміння в `stayed`: це має бути ідентифікатор із `reasons` саме тієї властивості картки, через яку вміння не потрібне. Кожна лабораторна має хоча б одне таке вміння."
          en: "This check looks at the `because` of every skill in `stayed`: it must be the id in `reasons` of exactly the card property that makes the skill unnecessary. Every lab has at least one such skill."
      - when: { test: "each lab records the observed result of its fresh check" }
        message:
          uk: "Ця перевірка сама запускає три свіжі перевірки й порівнює результати з `observed`. Переписуй значення з рядка «перевірка» у виводі **Запустити**, а не з передбачення."
          en: "This check runs the three fresh checks itself and compares the results with `observed`. Copy the values from the “check” line of the **Run** output, not from the prediction."
      - when: { test: "each lab records a prediction of the same shape" }
        message:
          uk: "Ця перевірка не порівнює передбачення з результатом — лише форму: для `sql` і `auth` масив із трьох чисел, для `ssr` — `true` або `false`."
          en: "This check does not compare the prediction with the result — only its shape: an array of three numbers for `sql` and `auth`, `true` or `false` for `ssr`."
      - when: { test: "each lab has its own paragraph of at least 80 characters" }
        message:
          uk: "Ця перевірка очікує в кожному `paragraph` щонайменше 80 символів (без пробілів на краях) і три різні абзаци."
          en: "This check expects at least 80 characters in each `paragraph` (without spaces at the ends) and three different paragraphs."

  - id: to-your-project
    kind: transfer
    checkpoint: CP-NO
    body:
      uk: "Склади таку саму записку для свого проєкту: відкрий `server/` і для кожного вміння з трьох лабораторних знайди файл, який його використовує, — або властивість проєкту, через яку воно не потрібне. Кроки проєкту після NO-04 ще не написані, тож картка цієї вправи описує план курсу; якщо твій проєкт уже інший (наприклад, зберігає записи в SQLite), твоя записка буде іншою — і це правильно. Цю записку знадобиться пояснити в самостійному завданні наприкінці розділу."
      en: "Write the same note for your own project: open `server/` and for each skill of the three labs find the file that uses it — or the property of the project that makes it unnecessary. The project steps after NO-04 are not written yet, so this exercise's card describes the course plan; if your project is already different (for example, it keeps its records in SQLite), your note will differ — and that is right. You will need to explain this note in the independent task at the end of the unit."
