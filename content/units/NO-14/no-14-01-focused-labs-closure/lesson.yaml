      skillSessions: { uk: "сесії з простоєм і повним строком", en: "sessions with idle and absolute limits" }
      skillOwnership: { uk: "перевірка власника в кожному пошуку", en: "an owner check in every lookup" }
      skillSecrets: { uk: "секрети з конфігурації, а не з коду", en: "secrets from configuration, not from code" }
      skillLimits: { uk: "ліміти розміру й часу запиту", en: "request size and time limits" }
      skillRender: { uk: "рендер сторінки на сервері", en: "rendering the page on the server" }
      skillSafeJson: { uk: "HTML-безпечні початкові дані", en: "HTML-safe initial data" }
      skillHydration: { uk: "гідратація з даних сторінки", en: "hydration from the page data" }
      skillRsc: { uk: "серверні компоненти React (RSC)", en: "React Server Components (RSC)" }
      applied: { uk: "перейшло", en: "applied" }
      stayed: { uk: "лишилося", en: "stayed" }
      unsorted: { uk: "ще не розкладено", en: "not sorted yet" }
