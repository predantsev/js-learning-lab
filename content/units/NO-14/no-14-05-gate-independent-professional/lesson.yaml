      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      market: { uk: "Ринок", en: "Market" }
      taxi: { uk: "Таксі з вокзалу", en: "A taxi from the station" }
      food: { uk: "Їжа", en: "Food" }
      transport: { uk: "Транспорт", en: "Transport" }
      home: { uk: "Дім", en: "Home" }
      fun: { uk: "Розваги", en: "Fun" }
      heading: { uk: "Витрати за", en: "Spending in" }
      total: { uk: "Разом", en: "Total" }
      lang: { uk: "uk", en: "en" }
      pageTitle: { uk: "Підсумок місяця", en: "Month summary" }
      badMonth: { uk: "Це не місяць: напиши РРРР-ММ.", en: "This is not a month: write YYYY-MM." }
      errorTitle: { uk: "Щось пішло не так", en: "Something went wrong" }
      errorText: { uk: "Ідентифікатор запиту:", en: "Request id:" }
      whyNoAuth: { uk: "Трекером користується одна людина на своєму комп’ютері, а сервер слухає лише 127.0.0.1: немає інших користувачів, чиї дані треба відокремлювати, тож вхід і перевірка власника тут нічого не захищають.", en: "One person uses the tracker on their own computer, and the server listens only on 127.0.0.1: there are no other users whose data must be kept apart, so a login and an owner check protect nothing here." }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у summary.test.js.", en: "No tests yet: add test(…) to summary.test.js." }
    title:
      uk: "Місячний підсумок від запиту до сторінки"
      en: "A month summary from the request to the page"
    instructions:
      uk: |
        Дані — у `expenses-db.js` (лише для читання): таблиця `expenses (id, label, amountMinor, date, category)`; суми — цілі копійки, дати — текст `'YYYY-MM-DD'`; `freshLedger('назва')` створює файл `назва.db` із фікстурами. `MonthSummary.js` і `mini-react.js` (навчальна заміна React із NO-13; чим вона відрізняється від справжнього React, написано вгорі файла) — лише для читання.

        **`summary.js`** — `monthSummary(db, month, top)` для `month` у форматі `'YYYY-MM'` повертає `{ month, total, categories }`:

        - лише витрати цього місяця — від першого до останнього дня включно;
        - `total` — сума **всіх** витрат місяця; `categories` — до `top` категорій як `{ category, total, count, largest }`, де `largest` — `label` найбільшої витрати категорії в цьому місяці (за рівних сум — менший `id`); порядок — більша сума спершу, за рівних — за назвою категорії;
        - місяць без витрат — `{ month, total: 0, categories: [] }`;
        - `month` — лише дані, ніколи не частина тексту SQL.

        **`app.js`** — `createApp({ db, log })` повертає сервер `node:http`:

        - `GET /api/summary?month=…&top=…` → `200` JSON підсумку; `month` — від `2000-01` до `2099-12`, `top` — ціле від 1 до 10 (за замовчуванням 5), інших параметрів немає; інакше `400` з `{ error: { code: "VALIDATION_FAILED", details } }`;
        - `GET /summary/:month` → `200` `text/html`: `<div id="root">` з рендером `MonthSummary` для `{ summary }`, одразу за ним `<script id="initial-data" type="application/json">` з `{ summary }` без сирих `<`, `>`, `&`, U+2028, U+2029; неправильний місяць — `400`;
        - помилка під час відповіді → `500`: безпечна сторінка з ідентифікатором запиту (з `x-request-id` або новий), без подробиць помилки й без розмітки із запиту;
        - кожна відповідь — рівно один виклик `log({ requestId, method, path, status })`, де `path` — шлях без рядка запиту; інші адреси — `404`;
        - `requestTimeout` і `headersTimeout` сервера — не більше 5000 мс.

        **`summary.test.js`** — твої тести через `test(…)` з `./testing.js`: усі проходять на твоєму `summary.js`; перевірки ще запускають їх проти двох зламаних підсумків, і на кожному хоча б один твій тест має впасти. Які саме зламано — не сказано; кожна зламана версія порушує одне з правил `monthSummary` вище.

        **`notes.js`** — `labs.used`: ідентифікатори фокусних лабораторних, які ця функція застосовує (`'sql'`, `'auth'`, `'ssr'`); `labs.notUsed`: для кожної іншої — `{ lab, why }`, де `why` (щонайменше 60 символів) пояснює, чому її вміння тут не потрібне.
      en: |
        The data is in `expenses-db.js` (read-only): the table `expenses (id, label, amountMinor, date, category)`; amounts are whole cents, dates are text `'YYYY-MM-DD'`; `freshLedger('name')` creates a file `name.db` with the fixtures. `MonthSummary.js` and `mini-react.js` (the teaching stand-in for React from NO-13; how it differs from real React is written at the top of the file) are read-only.

        **`summary.js`** — `monthSummary(db, month, top)` for `month` in the form `'YYYY-MM'` returns `{ month, total, categories }`:

        - only the expenses of that month — from the first to the last day inclusive;
        - `total` is the sum of **all** the month's expenses; `categories` — up to `top` categories as `{ category, total, count, largest }`, where `largest` is the `label` of the category's largest expense in that month (for equal amounts the smaller `id`); the order — the larger sum first, for equal sums by category name;
        - a month without expenses is `{ month, total: 0, categories: [] }`;
        - `month` is only data, never part of the SQL text.

        **`app.js`** — `createApp({ db, log })` returns a `node:http` server:

        - `GET /api/summary?month=…&top=…` → `200` with the summary as JSON; `month` from `2000-01` to `2099-12`, `top` an integer from 1 to 10 (5 by default), no other parameters; otherwise `400` with `{ error: { code: "VALIDATION_FAILED", details } }`;
        - `GET /summary/:month` → `200` `text/html`: `<div id="root">` with the `MonthSummary` render for `{ summary }`, followed directly by `<script id="initial-data" type="application/json">` with `{ summary }` and no raw `<`, `>`, `&`, U+2028, U+2029; a wrong month — `400`;
        - an error while answering → `500`: a safe page with the request id (from `x-request-id`, or a new one), with no error details and no markup taken from the request;
        - every response is exactly one call `log({ requestId, method, path, status })`, where `path` is the path without the query string; other addresses — `404`;
        - the server's `requestTimeout` and `headersTimeout` are at most 5000 ms.

        **`summary.test.js`** — your tests through `test(…)` from `./testing.js`: all of them pass on your `summary.js`; the checks also run them against two broken summaries, and on each at least one of your tests must fail. Which ones are broken is not said; each broken version breaks one of the `monthSummary` rules above.

        **`notes.js`** — `labs.used`: the ids of the focused labs this feature applies (`'sql'`, `'auth'`, `'ssr'`); `labs.notUsed`: for each other one `{ lab, why }`, where `why` (at least 60 characters) explains why its skill is not needed here.
