        Файли робочого простору для локального завдання. Твої `summary.js`, `app.js`, `summary.test.js` і `notes.js` береш із вправи «Місячний підсумок від запиту до сторінки»; решта — тут:

        - `expenses-db.js`, `MonthSummary.js`, `mini-react.js`, `testing.js` — ті самі, що у вправі;
        - `server.mjs` — твій `app.js` над файлом `ledger.db` на `127.0.0.1:7362`; на кожну відповідь друкує рядок JSON із часом і полями твого `log`; `--fresh` записує фікстури заново; Ctrl+C зупиняє;
        - `add-expense.mjs` — додає витрату у `ledger.db`;
        - `smoke.mjs` — три справжні запити до твого `app.js` на вільному порту; код виходу `1`, якщо відповідь не така, як у контракті;
        - `run-tests.js` — запускає твій `summary.test.js`;
        - `package.json` (скрипти `start`, `test`, `smoke`, `typecheck`), `tsconfig.json` і `.gitignore`.

        Платформа не тримає сервер у фоні й не встановлює пакетів, тож **Запустити** лише перелічує ці файли — відкрий їх у редакторі.
      en: |
        The workspace files for the local task. Your `summary.js`, `app.js`, `summary.test.js` and `notes.js` come from the exercise “A month summary from the request to the page”; the rest is here:

        - `expenses-db.js`, `MonthSummary.js`, `mini-react.js`, `testing.js` — the same as in the exercise;
        - `server.mjs` — your `app.js` over the file `ledger.db` on `127.0.0.1:7362`; for every response it prints a JSON line with the time and the fields of your `log`; `--fresh` writes the fixtures again; Ctrl+C stops it;
        - `add-expense.mjs` — adds an expense to `ledger.db`;
        - `smoke.mjs` — three real requests to your `app.js` on a free port; the exit code is `1` if an answer is not what the contract says;
        - `run-tests.js` — runs your `summary.test.js`;
        - `package.json` (the scripts `start`, `test`, `smoke`, `typecheck`), `tsconfig.json` and `.gitignore`.

        The platform does not keep a server running or install packages, so **Run** only lists these files — open them in the editor.

  - id: deliver-it
    kind: local-task
    runtime: local-node
    title:
      uk: "Доставка: CI, типи, лог, перезапуск, runbook і докази"
      en: "Delivery: CI, types, the log, a restart, a runbook and evidence"
    intro:
      uk: |
        Підказок немає: що зробити — нижче, як — ти вже робив в етапі Node.js. Працюй у **новому** робочому просторі `~/js-course/no-14-summary`: попередні лабораторні й твій проєкт лишаються такими, як були. Якщо хочеш додати підсумок і до свого проєкту, роби це окремою гілкою після цього завдання: кроки проєкту після NO-04 ще не написані, тож його вигляд у курсі не описано.

        Кроки виконано під час підготовки уроку на macOS з Node.js v25.2.1, npm 11.6.2, TypeScript 7.0.2, @types/node 22.20.5, curl 8.7.1 і Git 2.51.0; вивід нижче справжній (час, id commit і порядок виводу npm у тебе можуть відрізнятися). `node run-tests.js`, `node smoke.mjs` і `tsc -p .` повторено з Node.js v22.23.3, а `npm run ci`, `server.mjs` із запитами `curl`, `add-expense.mjs` і перезапуск — з v22.13.1 (мінімум курсу), з тим самим результатом. За [документацією Node.js 22](https://nodejs.org/docs/latest-v22.x/api/sqlite.html) `node:sqlite` працює без прапорця з v22.13.0, але досі експериментальний: кожен процес, що відкриває базу (`npm test`, `npm run smoke`, `server.mjs`), друкує в stderr `ExperimentalWarning: SQLite is an experimental feature and might change at any time` — це попередження, не помилка, і в наведеному нижче виводі ці рядки пропущено.

        **Як `tsc` перевіряє файли `.js`.** `tsconfig.json` робочого простору має `allowJs: true` і `checkJs: false`: TypeScript перевіряє лише ті файли з `include`, що починаються з коментаря `// @ts-check`; файл без нього `tsc` пропускає мовчки — навіть із помилкою типів (у нас `app.js` без `// @ts-check` із числом замість місяця дав порожній вивід). Файли, які імпортує твій код (`mini-react.js`, `MonthSummary.js`, `expenses-db.js`), теж не перевіряються. Типи в `.js` пишуть у коментарях JSDoc — наприклад, `/** @param {number} cents @returns {string} */` над функцією. Через `strict: true` кожен параметр перевіреного файла потребує типу: без нього `tsc` пише `error TS7006: Parameter '…' implicitly has an 'any' type.` Тип бази з Node — `import('node:sqlite').DatabaseSync`. У Linux і Windows не перевірялося; команди `curl` — для терміналу macOS чи Linux.

        **Що має бути наприкінці (кожен пункт — у `EVIDENCE.md`: команда, де виконано, що побачено):**

        1. **Типи.** `summary.js` і `app.js` починаються з `// @ts-check` і мають JSDoc-типи параметрів і результатів; `npm run typecheck` нічого не друкує після рядка `> tsc -p .`. Перевір, що перевірка справжня: тимчасово передай у `monthSummary` число замість місяця — у нас `tsc` відповів `error TS2345: Argument of type 'number' is not assignable to parameter of type 'string'.` — і поверни як було.
        2. **CI.** Скрипт `ci` у `package.json` запускає `typecheck`, `test` і `smoke` саме в такому порядку й зупиняється на першому провалі; `npm run ci` завершується кодом `0` (`echo $?`).
        3. **Справжні запити й лог.** Сервер на `127.0.0.1:7362`, три запити `curl` з власними `x-request-id` — успішний, `400` і сторінка; у `EVIDENCE.md` — рядки логу сервера із цими ідентифікаторами.
        4. **Доказ перезапуску.** Зупини сервер, додай витрату за березень через `add-expense.mjs`, запусти сервер **без** `--fresh` і доведи запитом, що `total` березня виріс рівно на її суму.
        5. **Runbook.** `RUNBOOK.md` — запис «Сторінка підсумку відповідає 500»: сигнал, перевірки (рядок логу за `requestId`, `ledger.db`), рішення, дія, підтвердження.
        6. **Межа лабораторних.** У `EVIDENCE.md` — два-три речення з `notes.js`: які лабораторні застосовано і чому автентифікація тут не потрібна.
        7. **Робочі простори й нативні перевірки.** `git status` попередніх лабораторних цього розділу чистий; у `EVIDENCE.md` — рядок про нативну перевірку: підсумок на телефоні чи емуляторі ти або перевірив (ціль, збірка, що побачив), або записав «не виконано» з причиною. Ця функція нативного екрана не має, тож «не виконано» тут — чесна відповідь, а не провал.

        **Наш вивід — `npm run ci`:**

        ```text
        > ci
        > npm run typecheck && npm test && npm run smoke

        > typecheck
        > tsc -p .

        > test
        > node run-tests.js

        ✓ March counts 1 and 31 March, but not 28 February or 1 April
        ✓ top keeps the largest categories, the total keeps every category
        ✓ a month without expenses has a zero total
        Пройшли: 3 · не пройшли: 0

        > smoke
        > node smoke.mjs

        ✓ GET /api/summary?month=2026-03 → 200 (expected 200)
        ✓ GET /api/summary?month=2026-13 → 400 (expected 400)
        ✓ GET /summary/2026-03 → 200 (expected 200)
        ```

        **Наші рядки логу сервера (пункти 3 і 4):**

        ```text
        summary lab listening on http://127.0.0.1:7362
        {"time":"2026-10-04T17:20:50.345Z","requestId":"evidence-1","method":"GET","path":"/api/summary","status":200}
        {"time":"2026-10-04T17:20:50.358Z","requestId":"evidence-2","method":"GET","path":"/api/summary","status":400}
        {"time":"2026-10-04T17:20:50.367Z","requestId":"evidence-3","method":"GET","path":"/summary/2026-03","status":200}
        summary lab stopped
        summary lab listening on http://127.0.0.1:7362
        {"time":"2026-10-04T17:20:51.953Z","requestId":"evidence-4","method":"GET","path":"/api/summary","status":200}
        ```

        До перезапуску `total` березня був `69790`, після `node add-expense.mjs e-08 1500 2026-03-28 fun …` і перезапуску — `71290`.
      en: |
        There are no hints: what to do is below; how — you have already done it in the Node.js stage. Work in a **new** workspace `~/js-course/no-14-summary`: the earlier labs and your project stay as they were. If you want to add the summary to your own project too, do it on a separate branch after this task: the project steps after NO-04 are not written yet, so the course does not describe its layout.

        The steps were run while preparing the lesson on macOS with Node.js v25.2.1, npm 11.6.2, TypeScript 7.0.2, @types/node 22.20.5, curl 8.7.1 and Git 2.51.0; the output below is real (your times, commit ids and npm's output order may differ). `node run-tests.js`, `node smoke.mjs` and `tsc -p .` were repeated with Node.js v22.23.3, and `npm run ci`, `server.mjs` with the `curl` requests, `add-expense.mjs` and the restart with v22.13.1 (the course minimum), with the same result. According to the [Node.js 22 documentation](https://nodejs.org/docs/latest-v22.x/api/sqlite.html) `node:sqlite` works without a flag since v22.13.0 but is still experimental: every process that opens the database (`npm test`, `npm run smoke`, `server.mjs`) prints `ExperimentalWarning: SQLite is an experimental feature and might change at any time` to stderr — a warning, not an error, and the output quoted below leaves those lines out.

        **How `tsc` checks `.js` files.** The workspace's `tsconfig.json` has `allowJs: true` and `checkJs: false`: TypeScript checks only the files in `include` that start with the comment `// @ts-check`; a file without it is skipped silently — even with a type error (for us, `app.js` without `// @ts-check` and with a number instead of a month gave empty output). The files your code imports (`mini-react.js`, `MonthSummary.js`, `expenses-db.js`) are not checked either. In `.js` files, types are written in JSDoc comments — for example, `/** @param {number} cents @returns {string} */` above a function. Because of `strict: true`, every parameter of a checked file needs a type: without one `tsc` prints `error TS7006: Parameter '…' implicitly has an 'any' type.` Node's database type is `import('node:sqlite').DatabaseSync`. Not checked on Linux or Windows; the `curl` commands are for a macOS or Linux terminal.

        **What there has to be at the end (every item in `EVIDENCE.md`: the command, where it ran, what was seen):**

        1. **Types.** `summary.js` and `app.js` start with `// @ts-check` and have JSDoc types for parameters and results; `npm run typecheck` prints nothing after the line `> tsc -p .`. Make sure the check is real: for a while pass a number instead of a month to `monthSummary` — for us `tsc` answered `error TS2345: Argument of type 'number' is not assignable to parameter of type 'string'.` — and put it back.
        2. **CI.** The `ci` script in `package.json` runs `typecheck`, `test` and `smoke` in exactly that order and stops at the first failure; `npm run ci` ends with code `0` (`echo $?`).
        3. **Real requests and the log.** The server on `127.0.0.1:7362`, three `curl` requests with your own `x-request-id` — a success, a `400` and the page; in `EVIDENCE.md` the server's log lines with those ids.
        4. **Restart proof.** Stop the server, add a March expense with `add-expense.mjs`, start the server **without** `--fresh` and prove with a request that March's `total` grew by exactly its amount.
        5. **Runbook.** `RUNBOOK.md` — the entry “The summary page answers 500”: the signal, the checks (the log line by `requestId`, `ledger.db`), the decision, the action, the confirmation.
        6. **The labs' boundary.** In `EVIDENCE.md` two or three sentences from `notes.js`: which labs were applied, and why auth is not needed here.
        7. **Workspaces and native checks.** `git status` of this unit's earlier labs is clean; `EVIDENCE.md` has a line about the native check: you either checked the summary on a phone or an emulator (target, build, what you saw) or recorded “not performed” with the reason. This feature has no native screen, so “not performed” is an honest answer here, not a failure.

        **Our output — `npm run ci`:**

        ```text
        > ci
        > npm run typecheck && npm test && npm run smoke

        > typecheck
        > tsc -p .

        > test
        > node run-tests.js

        ✓ March counts 1 and 31 March, but not 28 February or 1 April
        ✓ top keeps the largest categories, the total keeps every category
        ✓ a month without expenses has a zero total
        Passed: 3 · failed: 0

        > smoke
        > node smoke.mjs

        ✓ GET /api/summary?month=2026-03 → 200 (expected 200)
        ✓ GET /api/summary?month=2026-13 → 400 (expected 400)
        ✓ GET /summary/2026-03 → 200 (expected 200)
        ```

        **Our server log lines (items 3 and 4):**

        ```text
        summary lab listening on http://127.0.0.1:7362
        {"time":"2026-10-04T17:20:50.345Z","requestId":"evidence-1","method":"GET","path":"/api/summary","status":200}
        {"time":"2026-10-04T17:20:50.358Z","requestId":"evidence-2","method":"GET","path":"/api/summary","status":400}
        {"time":"2026-10-04T17:20:50.367Z","requestId":"evidence-3","method":"GET","path":"/summary/2026-03","status":200}
        summary lab stopped
        summary lab listening on http://127.0.0.1:7362
        {"time":"2026-10-04T17:20:51.953Z","requestId":"evidence-4","method":"GET","path":"/api/summary","status":200}
        ```

        Before the restart March's `total` was `69790`; after `node add-expense.mjs e-08 1500 2026-03-28 fun …` and the restart it was `71290`.
    tools:
      - name: "Node.js"
        version: { uk: "22.13 або новіший", en: "22.13 or newer" }
        note:
          uk: "Під час підготовки — v25.2.1, v22.23.3 і v22.13.1."
          en: "v25.2.1, v22.23.3 and v22.13.1 while preparing."
      - name: "npm"
        version: { uk: "та, що йде з Node.js", en: "the one that comes with Node.js" }
        note:
          uk: "Під час підготовки — 11.6.2. Потрібна мережа один раз — для встановлення TypeScript; облікового запису не треба."
          en: "11.6.2 while preparing. The network is needed once — to install TypeScript; no account is needed."
      - name: "typescript, @types/node"
        version: "7.0.2, 22.20.5"
        note:
          uk: "Установлюються в робочий простір як devDependencies."
          en: "Installed into the workspace as devDependencies."
      - name: "Git, curl"
        version: { uk: "будь-які сучасні", en: "any current versions" }
        note:
          uk: "Під час підготовки — Git 2.51.0 і curl 8.7.1."
          en: "Git 2.51.0 and curl 8.7.1 while preparing."
    steps:
      - text:
          uk: "Створи новий робочий простір: файли прикладу «Робочий простір для доставки» (крім `index.js`) і свої чотири файли з вправи. Зафіксуй його й установи пакети для перевірки типів."
          en: "Create a new workspace: the files of the example “The workspace for delivery” (except `index.js`) and your four files from the exercise. Commit it and install the packages for the type check."
        command: "mkdir -p ~/js-course/no-14-summary\ncd ~/js-course/no-14-summary\ngit init\ngit add -A\ngit commit -m \"Add the monthly summary feature\"\nnpm install --save-dev typescript@7.0.2 @types/node@22.20.5\nnpm ls --depth=0"
        expect:
          uk: "`added 4 packages` і `found 0 vulnerabilities`; `npm ls` показує `@types/node@22.20.5` і `typescript@7.0.2`. Теку `node_modules/` `.gitignore` не пускає в Git."
          en: "`added 4 packages` and `found 0 vulnerabilities`; `npm ls` shows `@types/node@22.20.5` and `typescript@7.0.2`. `.gitignore` keeps the `node_modules/` folder out of Git."
      - text:
          uk: "Додай типи (пункт 1) і переконайся, що перевірка типів чиста й справді ловить помилку."
          en: "Add the types (item 1) and make sure the type check is clean and really catches a mistake."
        command: "npm run typecheck"
        expect:
          uk: "Після `> tsc -p .` нічого; із числом замість місяця — `error TS2345`, як у пункті 1 вступу."
          en: "Nothing after `> tsc -p .`; with a number instead of a month — `error TS2345`, as in item 1 of the introduction."
      - text:
          uk: "Додай скрипт `ci` (пункт 2) і запусти його."
          en: "Add the `ci` script (item 2) and run it."
        command: "npm pkg set scripts.ci=\"npm run typecheck && npm test && npm run smoke\"\nnpm run ci\necho $?"
        expect:
          uk: "Вивід, як у «Наш вивід — `npm run ci`», і `0` від `echo $?`."
          en: "Output as in “Our output — `npm run ci`”, and `0` from `echo $?`."
      - text:
          uk: "У першому терміналі запусти сервер зі свіжими даними, у другому надішли три запити (пункт 3)."
          en: "In the first terminal start the server with fresh data, in the second send three requests (item 3)."
        command: "node server.mjs --fresh\ncurl -s -H \"x-request-id: evidence-1\" \"http://127.0.0.1:7362/api/summary?month=2026-03&top=2\"\ncurl -s -o /dev/null -w \"%{http_code}\\n\" -H \"x-request-id: evidence-2\" \"http://127.0.0.1:7362/api/summary?month=2026-13\"\ncurl -s -o /dev/null -w \"%{http_code}\\n\" -H \"x-request-id: evidence-3\" \"http://127.0.0.1:7362/summary/2026-03\""
        expect:
          uk: "JSON березня з `\"total\":69790`, потім `400` і `200`; у першому терміналі — три рядки логу з `evidence-1`, `evidence-2`, `evidence-3`."
          en: "March's JSON with `\"total\":69790`, then `400` and `200`; in the first terminal three log lines with `evidence-1`, `evidence-2`, `evidence-3`."
      - text:
          uk: "Доведи перезапуск (пункт 4): Ctrl+C у першому терміналі, додай витрату, запусти сервер без `--fresh` і запитай березень знову."
          en: "Prove the restart (item 4): Ctrl+C in the first terminal, add an expense, start the server without `--fresh` and ask for March again."
        command: "node add-expense.mjs e-08 1500 2026-03-28 fun \"Board game\"\nnode server.mjs\ncurl -s -H \"x-request-id: evidence-4\" \"http://127.0.0.1:7362/api/summary?month=2026-03&top=2\""
        expect:
          uk: "`added e-08: 1500 on 2026-03-28 (fun)`, а після перезапуску — `\"total\":71290`: на 1500 більше, ніж до."
          en: "`added e-08: 1500 on 2026-03-28 (fun)`, and after the restart `\"total\":71290`: 1500 more than before."
      - text:
          uk: "Зупини сервер, напиши `RUNBOOK.md` і `EVIDENCE.md` (пункти 5–7), перевір попередні лабораторні й зафіксуй усе."
          en: "Stop the server, write `RUNBOOK.md` and `EVIDENCE.md` (items 5–7), check the earlier labs and commit everything."
        command: "git -C ~/js-course/no-14-club-lab status --short\ngit -C ~/js-course/no-14-sync-review status --short\ngit add -A\ngit commit -m \"Add CI, type checks, runbook and evidence for the monthly summary\"\ngit status --short"
        expect:
          uk: "Перші дві команди нічого не друкують (або, якщо якоїсь із цих лабораторних у тебе немає, `fatal: cannot change to …` — тоді запиши це в `EVIDENCE.md`); commit створено; останній `git status --short` порожній."
          en: "The first two commands print nothing (or, if you do not have one of those labs, `fatal: cannot change to …` — then write that into `EVIDENCE.md`); the commit is created; the last `git status --short` is empty."
    verify:
      - id: types-ci
        text:
          uk: "`npm run typecheck` чистий і ловить навмисну помилку; `npm run ci` завершився кодом 0."
          en: "`npm run typecheck` is clean and catches a deliberate mistake; `npm run ci` ended with code 0."
      - id: log-evidence
        text:
          uk: "У `EVIDENCE.md` — справжні рядки логу сервера з моїми `x-request-id` для `200`, `400` і сторінки."
          en: "`EVIDENCE.md` holds real server log lines with my `x-request-id`s for `200`, `400` and the page."
      - id: restart-proof
        text:
          uk: "Після перезапуску без `--fresh` `total` березня виріс рівно на суму доданої витрати."
          en: "After a restart without `--fresh` March's `total` grew by exactly the amount of the added expense."
      - id: runbook-boundary
        text:
          uk: "`RUNBOOK.md` має запис «Сторінка підсумку відповідає 500» від сигналу до підтвердження; `EVIDENCE.md` пояснює межу лабораторних."
          en: "`RUNBOOK.md` has the entry “The summary page answers 500” from the signal to the confirmation; `EVIDENCE.md` explains the labs' boundary."
      - id: workspaces-native
        text:
          uk: "Попередні робочі простори не змінено, а нативна перевірка записана як виконана на заявленій цілі або як «не виконано» з причиною."
          en: "The earlier workspaces are unchanged, and the native check is recorded as performed on the declared target or as “not performed” with the reason."
    troubleshooting:
      - problem:
          uk: "`npm install` не може дістатися реєстру npm (немає мережі)."
          en: "`npm install` cannot reach the npm registry (no network)."
        fix:
          uk: "Без мережі TypeScript не встановити. Продовжуй без нього: прибери `npm run typecheck && ` зі скрипта `ci`, а в `EVIDENCE.md` запиши перевірку типів як «не виконано» з причиною; решта завдання від пакетів не залежить."
          en: "Without a network TypeScript cannot be installed. Continue without it: remove `npm run typecheck && ` from the `ci` script, and in `EVIDENCE.md` record the type check as “not performed” with the reason; the rest of the task does not depend on packages."
      - problem:
          uk: "`node server.mjs` пише `Error: listen EADDRINUSE: address already in use 127.0.0.1:7362`."
          en: "`node server.mjs` prints `Error: listen EADDRINUSE: address already in use 127.0.0.1:7362`."
        fix:
          uk: "Порт зайнятий — найчастіше сервером з іншого вікна. Зупини його Ctrl+C або запусти `PORT=7363 node server.mjs` і в `curl` теж пиши `7363`."
          en: "The port is taken — most often by the server in another window. Stop it with Ctrl+C, or start `PORT=7363 node server.mjs` and write `7363` in the `curl` commands too."
    recovery:
      uk: "Перший commit тримає функцію такою, якою вона прийшла з вправи: `git diff` показує все, що ти додав для доставки. Дані повертає `node server.mjs --fresh`; `node_modules/` відновлює `npm install`."
      en: "The first commit holds the feature as it came from the exercise: `git diff` shows everything you added for delivery. `node server.mjs --fresh` brings the data back; `npm install` restores `node_modules/`."
