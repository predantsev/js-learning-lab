        en: "The lab note names the labs the feature applies and explains each other one"
    solutionNote:
      uk: "Еталон рахує місяць як півінтервал `[перший день, перший день наступного)` двома параметрами `?` — так 31-ше число входить, а 1-ше наступного ні, і грудень переходить у січень наступного року; `substr(date, 1, 7) = ?` з одним параметром теж правильний. `largest` — корельований підзапит, `total` — сума всіх рядків до `slice(0, top)`. Маршрут перевіряє весь запит за allowlist параметрів, дає одну форму помилки й рівно один запис у лозі з `requestId` на кожну відповідь; сторінка — той самий `MonthSummary` і HTML-безпечний JSON, як у NO-13; `500` екранує ідентифікатор і не показує повідомлення помилки. Тести мають створити саме ті умови, де підсумок ламається: витрати на межах місяця й `top`, менший за кількість категорій. Автентифікація не застосовна, бо користувач один, а сервер — на loopback; якщо трекер колись стане спільним, межа зміниться."
      en: "The reference counts a month as the half-open interval `[first day, first day of the next)` with two `?` parameters — so the 31st is in and the next month's 1st is not, and December rolls over into January of the next year; `substr(date, 1, 7) = ?` with one parameter is right too. `largest` is a correlated subquery, `total` the sum of all rows before `slice(0, top)`. The route checks the whole query against an allowlist of parameters, gives one error shape and exactly one log entry with a `requestId` per response; the page is the same `MonthSummary` and HTML-safe JSON as in NO-13; the `500` escapes the id and does not show the error message. The tests have to create exactly the conditions where a summary breaks: expenses on the month's edges and a `top` smaller than the number of categories. Auth does not apply because there is one user and the server is on loopback; if the tracker ever becomes shared, the boundary moves."
    feedback:
      - when: { test: "monthSummary totals one month by category, most spent first, with the largest expense" }
        message:
          uk: "Ця перевірка створює власний журнал витрат і для `2026-06` очікує `total` 54200 і категорії `home` (50900, 2), `food` (3000, 2), `transport` (300, 1) з їхніми `largest`. Якщо всі перевірки падають одночасно, спершу виправ першу помилку з виводу **Запустити**."
          en: "This check creates its own ledger and for `2026-06` expects `total` 54200 and the categories `home` (50900, 2), `food` (3000, 2), `transport` (300, 1) with their `largest`. If every check fails at once, fix the first error in the **Run** output first."
      - when: { test: "the first and the last day count, the days around the month do not" }
        message:
          uk: "Ця перевірка має витрати 31 травня, 1 і 30 червня та 1 липня й очікує для травня лише 700, для липня лише 4000, а для грудня — нуль і порожні категорії."
          en: "This check has expenses on 31 May, 1 and 30 June and 1 July and expects only 700 for May, only 4000 for July, and zero with no categories for December."
      - when: { test: "top limits the categories, the total keeps every category" }
        message:
          uk: "Ця перевірка просить `top` 1 і очікує одну категорію, `home`, але `total` — суму всіх витрат червня, 54200."
          en: "This check asks for `top` 1 and expects one category, `home`, but a `total` of all June's expenses, 54200."
      - when: { test: "ties: the smaller id is the largest expense, equal totals go by category name" }
        message:
          uk: "Ця перевірка має в серпні дві витрати `food` по 500 (`t-02` додано раніше за `t-01`) і три категорії з рівними сумами 1000; вона очікує порядок `food`, `fun`, `home` і `largest` для `food` — витрату `t-01`."
          en: "This check has two `food` expenses of 500 in August (`t-02` inserted before `t-01`) and three categories with equal totals of 1000; it expects the order `food`, `fun`, `home` and the `t-01` expense as the `largest` of `food`."
      - when: { test: "the month is only data in the SQL" }
        message:
          uk: "Ця перевірка передає місяць `1999-01' OR date > '0` (у журналі немає жодної витрати 1999 року) і очікує `total` 0 (кинута помилка теж годиться). Якщо місяць вклеєно в текст SQL, запит рахує інші витрати."
          en: "This check passes the month `1999-01' OR date > '0` (the ledger has no expense from 1999) and expects `total` 0 (a thrown error is fine too). If the month is glued into the SQL text, the query counts other expenses."
      - when: { test: "GET /api/summary answers 200 with the JSON summary" }
        message:
          uk: "Ця перевірка надсилає `GET /api/summary?month=2026-06&top=2` і чекає `200`, `content-type` з `application/json` і підсумок червня з двома категоріями."
          en: "This check sends `GET /api/summary?month=2026-06&top=2` and expects `200`, a `content-type` with `application/json` and June's summary with two categories."
      - when: { test: "GET /api/summary refuses a wrong month, top or parameter with 400 VALIDATION_FAILED" }
        message:
          uk: "Ця перевірка очікує `400` і `VALIDATION_FAILED` для `month=2026-6`, `2026-13`, `1999-12`, для `top` 0, 11 і 2.5, для невідомого параметра `sort` і для запиту без `month`."
          en: "This check expects `400` and `VALIDATION_FAILED` for `month=2026-6`, `2026-13`, `1999-12`, for `top` 0, 11 and 2.5, for an unknown parameter `sort` and for a request without `month`."
      - when: { test: "the server limits how long a request may take to arrive: at most 5 s" }
        message:
          uk: "Ця перевірка читає `requestTimeout` і `headersTimeout` сервера з `createApp` і чекає для обох від 1 до 5000 мс."
          en: "This check reads `requestTimeout` and `headersTimeout` of the server from `createApp` and expects 1 to 5000 ms for both."
      - when: { test: "GET /summary/:month renders the summary on the server with safe initial data" }
        message:
          uk: "Ця перевірка чекає на `GET /summary/2026-06` `200` і `text/html`, `#root`, що дорівнює рендеру `MonthSummary` для `{ summary }` і за яким іде `<script`, `#initial-data` без сирих `<`, `>`, `&`, U+2028, U+2029, що розбирається в `{ summary }`, і `400` для `/summary/2026-6`. Одна назва витрати тут містить `</script>` і `&`."
          en: "This check expects for `GET /summary/2026-06` `200` and `text/html`, a `#root` equal to the `MonthSummary` render for `{ summary }` and followed by `<script`, an `#initial-data` with no raw `<`, `>`, `&`, U+2028, U+2029 that parses to `{ summary }`, and `400` for `/summary/2026-6`. One expense label here contains `</script>` and `&`."
      - when: { test: "a failing summary answers a safe 500 with the request id and logs it" }
        message:
          uk: "Ця перевірка закриває базу, надсилає запит з `x-request-id: req-gate-5` і чекає `500`, `req-gate-5` на сторінці, жодних подробиць помилки й запис у `log` із цим `requestId` і статусом 500; а для `x-request-id` з тегом `<img` — сторінку без цього тегу."
          en: "This check closes the database, sends a request with `x-request-id: req-gate-5` and expects `500`, `req-gate-5` on the page, no error details and a `log` entry with that `requestId` and status 500; and for an `x-request-id` with an `<img` tag — a page without that tag."
      - when: { test: "every request is logged once with its request id, method, path and status" }
        message:
          uk: "Ця перевірка надсилає три запити (`200`, `400`, `404`) і очікує рівно три записи в `log`, по одному на відповідь, з `requestId`, `method`, `path` без рядка запиту й `status`."
          en: "This check sends three requests (`200`, `400`, `404`) and expects exactly three `log` entries, one per response, with `requestId`, `method`, `path` without the query string and `status`."
      - when: { test: "after a restart over the same file the summary includes a new expense" }
        message:
          uk: "Ця перевірка додає витрату у файл одним з’єднанням, закриває його, відкриває нове й чекає в `GET /api/summary?month=2026-06&top=10` `total` 55300."
          en: "This check adds an expense to the file through one connection, closes it, opens a new one and expects `total` 55300 from `GET /api/summary?month=2026-06&top=10`."
      - when: { test: "your tests pass on your summary.js" }
        message:
          uk: "Ця перевірка запускає твій `summary.test.js` поруч із твоїм `summary.js` і очікує хоча б один тест і жодного провалу. **Запустити** показує той самий вивід."
          en: "This check runs your `summary.test.js` next to your `summary.js` and expects at least one test and no failures. **Run** shows the same output."
      - when: { test: "your tests fail on the first broken summary" }
        message:
          uk: "Ця перевірка запускає твої тести проти зламаного підсумку, що порушує одне з правил `monthSummary` з умови, і очікує, що хоча б один твій тест упаде. Це гейт: яке правило зламано, перевірка не каже."
          en: "This check runs your tests against a broken summary that breaks one of the `monthSummary` rules of the task, and expects at least one of your tests to fail. This is the gate: the check does not say which rule is broken."
      - when: { test: "your tests fail on the second broken summary" }
        message:
          uk: "Ця перевірка запускає твої тести проти іншого зламаного підсумку, що порушує інше правило `monthSummary` з умови, і очікує, що хоча б один твій тест упаде."
          en: "This check runs your tests against another broken summary that breaks another `monthSummary` rule of the task, and expects at least one of your tests to fail."
      - when: { test: "the lab note names the labs the feature applies and explains each other one" }
        message:
          uk: "Ця перевірка очікує в `labs.used` рівно ті лабораторні, вміння яких ця функція застосовує, а для кожної іншої — запис у `labs.notUsed` з `why` щонайменше на 60 символів."
          en: "This check expects in `labs.used` exactly the labs whose skills this feature applies, and for each other one an entry in `labs.notUsed` with a `why` of at least 60 characters."

