        uk: "`GET /summary/:month` рендерить підсумок на сервері з безпечними початковими даними"
        en: "`GET /summary/:month` renders the summary on the server with safe initial data"
      "a failing summary answers a safe 500 with the request id and logs it":
        uk: "Підсумок, що впав, дає безпечну `500` з ідентифікатором запиту й запис у лозі"
        en: "A failing summary answers a safe `500` with the request id and logs it"
      "every request is logged once with its request id, method, path and status":
