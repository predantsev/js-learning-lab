id: no-14-05-gate-independent-professional
unit: NO-14
title:
  uk: "Гейт: самостійне професійне завдання"
  en: "Gate: independent professional task"
kind: assessment
minutes: 60
contentVersion: 1
purpose:
  uk: "Остання частина фінального гейту — і кінець курсу. Без підказок ти будуєш незнайому функцію від запиту до сторінки: місячний підсумок витрат із запитом SQL, перевіреним API-маршрутом із лімітами, сторінкою, відрендереною на сервері, журналом запитів і власними тестами, що ловлять зламані версії. Потім доставляєш її у своєму терміналі: CI-скрипт, перевірка типів, справжні рядки логу, доказ перезапуску, запис runbook і пакет доказів — не чіпаючи попередніх робочих просторів і чесно записуючи кожну нативну перевірку."
  en: "The last part of the final gate — and the end of the course. Without hints you build an unseen feature from the request to the page: a monthly expense summary with an SQL query, a validated API route with limits, a server-rendered page, a request log and your own tests that catch broken versions. Then you deliver it in your terminal: a CI script, a type check, real log lines, restart proof, a runbook entry and an evidence bundle — without touching earlier workspaces, and recording every native check honestly."
objectives:
  - uk: "Без підказок спроєктувати, збудувати, протестувати, захистити й доставити невелику незнайому функцію від початку до кінця з перевіреними доказами роботи."
    en: "Design, build, test, secure and deliver a small unseen feature end to end without hints, with verified runtime evidence."
  - uk: "Застосувати вміння з фокусної лабораторної (SQL, автентифікація чи SSR), якого потребує завдання, і пояснити межу, де вміння з лабораторної не застосовне."
    en: "Apply the focused-lab skill (SQL, auth or SSR) the task needs and explain the boundary where a lab skill does not apply."
  - uk: "Зберегти попередні робочі простори й докази та записати кожну нативну перевірку як виконану на заявленій цілі або як невиконану."
    en: "Keep earlier workspaces and evidence intact, and record each native check as performed on the declared target or as unperformed."
prerequisites: [no-14-04-gate-design-review]
subskills:
  - { family: B-13, skill: "design/build/debug/test/secure/deliver/maintain", depth: assess }
  - { family: B-13, skill: "SQL/auth/SSR focused labs", depth: assess }
  - { family: B-13, skill: "retained domain/workspaces", depth: assess }
glossary: []
selfCheck: [monthly-summary]

blocks:
  - id: the-task
    kind: explanation
    title:
      uk: "Завдання: місячний підсумок витрат"
      en: "The task: a monthly expense summary"
    body:
      uk: |
        Трекер витрат просить нову функцію: **підсумок місяця** — скільки витрачено загалом, по категоріях (найбільші спершу) і яка витрата в кожній категорії найбільша. Його треба віддавати двома шляхами:

        - `GET /api/summary?month=2026-03&top=5` — JSON для інших клієнтів;
        - `GET /summary/2026-03` — сторінка, відрендерена на сервері, з початковими даними для гідратації.

        Дві частини, підказок немає:

        1. **На платформі.** Функція над справжнім файлом SQLite і справжнім `node:http`. Перевірки надсилають справжні запити й запускають твої тести проти двох зламаних версій підсумку.
        2. **У твоєму терміналі.** Та сама функція в новому робочому просторі: CI-скрипт, перевірка типів, сервер із журналом, перезапуск, runbook і `EVIDENCE.md`.

        Знадобиться весь етап Node.js, а найбільше — NO-04 (контракт API), NO-07 (ліміти й безпечні помилки), NO-09 (SQL), NO-12 (CI й runbook) і NO-13 (SSR).
      en: |
        The expense tracker asks for a new feature: a **month summary** — how much was spent in total, by category (the largest first), and which expense in each category is the largest. It has to be served two ways:

        - `GET /api/summary?month=2026-03&top=5` — JSON for other clients;
        - `GET /summary/2026-03` — a page rendered on the server, with initial data for hydration.

        Two parts, no hints:

        1. **On the platform.** The feature over a real SQLite file and real `node:http`. The checks send real requests and run your tests against two broken versions of the summary.
        2. **In your terminal.** The same feature in a new workspace: a CI script, a type check, a server with a log, a restart, a runbook and `EVIDENCE.md`.

        You will need the whole Node.js stage, most of all NO-04 (the API contract), NO-07 (limits and safe errors), NO-09 (SQL), NO-12 (CI and runbooks) and NO-13 (SSR).

  - id: recall
    kind: review
    title:
      uk: "Пригадай перед стартом"
      en: "Recall before you start"
    items:
      - id: evidence-per-item
        from: no-08-02-integration-plan-tradeoffs
        prompt:
          uk: "У плані інтеграції кожна вимога мала компонент, кроки перевірки й доказ. Чому «я перевірив руками, усе працює» — не доказ?"
          en: "In the integration plan every requirement had a component, check steps and evidence. Why is “I checked by hand, it all works” not evidence?"
        answer:
          type: choice
          options:
            - id: repeatable
              text: { uk: "Його не можна повторити й перевірити: доказ — це команда чи файл із результатом, який інша людина отримає знову", en: "It cannot be repeated or checked: evidence is a command or a file with its result that another person gets again" }
            - id: enough
              text: { uk: "Це доказ, якщо перевіряв досвідчений розробник", en: "It is evidence if an experienced developer checked" }
              why:
                uk: "Досвід не робить перевірку повторюваною. Рецензентові потрібні кроки й результат, а не довіра."
                en: "Experience does not make a check repeatable. A reviewer needs the steps and the result, not trust."
          correct: [repeatable]
        explanation:
          uk: "`EVIDENCE.md` цього завдання — це саме такі записи: команда, де її виконано, що побачено."
          en: "This task's `EVIDENCE.md` consists of exactly such records: the command, where it ran, what was seen."
      - id: safe-500
        from: no-07-03-safe-errors-redaction
        prompt:
          uk: "Запит до бази впав. Що має побачити людина на сторінці 500?"
          en: "A database query failed. What should a person see on the 500 page?"
        answer:
          type: choice
          options:
            - id: id-only
              text: { uk: "Коротке повідомлення й ідентифікатор запиту; подробиці — лише в лозі сервера поруч із тим самим ідентифікатором", en: "A short message and the request id; the details only in the server log next to the same id" }
            - id: stack
              text: { uk: "Повідомлення помилки й стек — так швидше знайти причину", en: "The error message and the stack — that finds the cause faster" }
              why:
                uk: "Стек і текст помилки розкривають будову сервера кожному, хто відкрив сторінку. Причину шукають у лозі за ідентифікатором."
                en: "The stack and the error text reveal the server's insides to anyone who opens the page. The cause is found in the log by the id."
          correct: [id-only]
        explanation:
          uk: "Безпечна відповідь про помилку й структурований лог із request id — пара, яку перевіряє і цей гейт."
          en: "A safe error response and a structured log with a request id — a pair this gate checks as well."

  - id: monthly-summary
    kind: exercise
    mode: independent
    assessment: true
    runtime: isolated-node
    dir: monthly-summary
    entry: index.js
    editable: [summary.js, app.js, summary.test.js, notes.js]
    capabilities: { network: loopback, timeoutMs: 30000 }
    strings:
      groceries: { uk: "Продукти на вихідні", en: "Weekend groceries" }
      transit: { uk: "Проїзний на місяць", en: "Monthly transit pass" }
