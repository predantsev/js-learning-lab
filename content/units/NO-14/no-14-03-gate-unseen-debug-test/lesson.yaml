      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у regression.test.js.", en: "No tests yet: add test(…) to regression.test.js." }
    title:
      uk: "Лабораторія клубу для твого терміналу"
      en: "The club lab for your terminal"
    body:
      uk: |
        Файли для локального завдання — версія зі скарги:

        - `app.js`, `repo.js`, `club-data.js`, `lab.js`, `testing.js` — ті самі, що у вправі «Сторінки, що подвоюються за ніч» до твоїх змін;
        - `server.mjs` — сервер клубу на `127.0.0.1:7360` над файлом `club.db`; `--fresh` записує фікстури заново; Ctrl+C зупиняє його;
        - `lab-client.mjs` — справжні запити: `log` записує 30 сторінок для Олі й показує рядок сторінки клубу, `show` — рядок Олі з підсумку сервера;
        - `run-regression.mjs` — запускає твій `regression.test.js` у терміналі;
        - `package.json` і `.gitignore` — щоб файли `.js` були ES-модулями, а файли бази не потрапляли в commit.

        Платформа не тримає сервер у фоні, тож **Запустити** виконує той самий сценарій в одному процесі.
      en: |
        The files for the local task — the version from the complaint:

        - `app.js`, `repo.js`, `club-data.js`, `lab.js`, `testing.js` — the same as in the exercise “Pages that double overnight” before your changes;
        - `server.mjs` — the club's server on `127.0.0.1:7360` over the file `club.db`; `--fresh` writes the fixtures again; Ctrl+C stops it;
        - `lab-client.mjs` — real requests: `log` logs 30 pages for Olya and shows the club page's line, `show` — Olya's line from the server's summary;
        - `run-regression.mjs` — runs your `regression.test.js` in the terminal;
        - `package.json` and `.gitignore` — so that the `.js` files are ES modules and the database files stay out of commits.

        The platform does not keep a server running in the background, so **Run** plays the same scenario in one process.

  - id: prove-it-locally
    kind: local-task
    runtime: local-node
    title:
      uk: "Відтвори й доведи справжнім сервером і перезапуском"
      en: "Reproduce and prove with a real server and restart"
    intro:
      uk: |
        Тепер та сама лабораторія як справжній процес у твоєму терміналі: сервер над файлом `club.db`, який ти зупиняєш Ctrl+C і запускаєш знову, і справжні HTTP-запити до нього. Потрібні лише Node.js, Git і два вікна терміналу — жодних npm-пакетів: `node:sqlite` вбудований у Node.js.

        Кроки виконано під час підготовки уроку на macOS з Node.js v25.2.1 і Git 2.51.0; вивід нижче справжній (час у рядках логу в тебе інший — сервер друкує його за UTC — і id commit теж). Запуск сервера, `log`, перезапуск, `show` і `run-regression.mjs` повторено з Node.js v22.23.3 — з тим самим результатом. За [документацією Node.js 22](https://nodejs.org/docs/latest-v22.x/api/sqlite.html) `node:sqlite` працює без прапорця з v22.13.0, але досі експериментальний, тож Node друкує `ExperimentalWarning: SQLite is an experimental feature and might change at any time` — це попередження, не помилка. У Linux і Windows ці кроки не перевірялися.

        **Крок 1 — файли.** Скопіюй у нову теку всі файли прикладу «Лабораторія клубу для твого терміналу», крім `index.js`, з тими самими назвами (редактор уже показує їх із текстом твоєю мовою), а з вправи «Сторінки, що подвоюються за ніч» — свій `regression.test.js`. `repo.js` бери з прикладу: спершу треба відтворити скаргу.

        **Крок 3 — вивід `node lab-client.mjs log` (у нас):**

        ```text
        POST /reads → 201
        сторінка клубу: Оля — сторінок: 30, голосів: 2
        ```

        а в першому терміналі — рядки логу сервера:

        ```text
        club lab listening on http://127.0.0.1:7360
        17:03:27.808 GET /summary → 200
        17:03:27.815 POST /reads → 201
        ```

        **Крок 4 — після Ctrl+C, `node server.mjs` і `node lab-client.mjs show`:**

        ```text
        підсумок сервера: Оля — сторінок: 60, голосів: 2
        ```

        **Крок 7 — `node run-regression.mjs` на версії зі скарги (у нас, з еталонним тестом):**

        ```text
        ✗ pages of a member with two votes are counted once after a restart — pages and votes of m-03 after the restart: очікувалося [30, 2], отримано [60, 2]
        Пройшли: 0 · не пройшли: 1
        ```

        **Крок 8 — `ROOT-CAUSE.md`:** три речення — що бачила учасниця, яка причина й у якому шарі, і що тепер не дає їй повторитися (виправлення й тест). Без коду: так, щоб це зрозумів рецензент PR.
      en: |
        Now the same lab as a real process in your terminal: a server over the file `club.db` that you stop with Ctrl+C and start again, and real HTTP requests to it. You need only Node.js, Git and two terminal windows — no npm packages: `node:sqlite` is built into Node.js.

        The steps were run while preparing the lesson on macOS with Node.js v25.2.1 and Git 2.51.0; the output below is real (the times in your log lines differ — the server prints them in UTC — and so do the commit ids). The server start, `log`, the restart, `show` and `run-regression.mjs` were repeated with Node.js v22.23.3 — with the same result. According to the [Node.js 22 documentation](https://nodejs.org/docs/latest-v22.x/api/sqlite.html) `node:sqlite` works without a flag since v22.13.0 but is still experimental, so Node prints `ExperimentalWarning: SQLite is an experimental feature and might change at any time` — a warning, not an error. These steps were not checked on Linux or Windows.

        **Step 1 — the files.** Copy all the files of the example “The club lab for your terminal” except `index.js` into a new folder under the same names (the editor already shows them with the text in your language), and from the exercise “Pages that double overnight” — your `regression.test.js`. Take `repo.js` from the example: first you need to reproduce the complaint.

        **Step 3 — the output of `node lab-client.mjs log` (ours):**

        ```text
        POST /reads → 201
        the club page: Olya — pages: 30, votes: 2
        ```

        and in the first terminal — the server's log lines:

        ```text
        club lab listening on http://127.0.0.1:7360
        17:04:05.613 GET /summary → 200
        17:04:05.619 POST /reads → 201
        ```

        **Step 4 — after Ctrl+C, `node server.mjs` and `node lab-client.mjs show`:**

        ```text
        the server's summary: Olya — pages: 60, votes: 2
        ```

        **Step 7 — `node run-regression.mjs` on the version from the complaint (ours, with the reference test):**

        ```text
        ✗ pages of a member with two votes are counted once after a restart — pages and votes of m-03 after the restart: expected [30, 2], got [60, 2]
        Passed: 0 · failed: 1
        ```

        **Step 8 — `ROOT-CAUSE.md`:** three sentences — what the member saw, what the cause is and in which layer, and what now keeps it from coming back (the fix and the test). No code: so that a PR reviewer understands it.
    tools:
      - name: "Node.js"
        version: { uk: "22.13 або новіший", en: "22.13 or newer" }
        note:
          uk: "Мінімум курсу; під час підготовки — v25.2.1 і v22.23.3."
          en: "The course minimum; v25.2.1 and v22.23.3 while preparing."
      - name: "Git"
        version: { uk: "будь-яка сучасна", en: "any current version" }
        note:
          uk: "Під час підготовки — 2.51.0."
          en: "2.51.0 while preparing."
      - name: { uk: "Два вікна терміналу", en: "Two terminal windows" }
        note:
          uk: "У першому працює сервер, у другому — запити."
          en: "The server runs in the first, the requests in the second."
    steps:
      - text:
          uk: "Створи теку лабораторії, поклади в неї файли з кроку 1 вступу й зафіксуй версію зі скарги окремим commit."
          en: "Create the lab folder, put the files from step 1 of the introduction into it and commit the version from the complaint on its own."
        command: "mkdir -p ~/js-course/no-14-club-lab\ncd ~/js-course/no-14-club-lab\ngit init\ngit add -A\ngit commit -m \"Add the NO-14 book-club lab as reported\""
        expect:
          uk: "Рядок на кшталт `[master (root-commit) 7cc2c8e] Add the NO-14 book-club lab as reported` (назва гілки й id commit у тебе можуть бути інші); `git status` каже, що робоче дерево чисте."
          en: "A line like `[master (root-commit) 7cc2c8e] Add the NO-14 book-club lab as reported` (your branch name and commit id may differ); `git status` says the working tree is clean."
      - text:
          uk: "У першому терміналі запусти сервер (з тієї самої теки)."
          en: "In the first terminal start the server (from the same folder)."
        command: "node server.mjs"
        expect:
          uk: "`club lab listening on http://127.0.0.1:7360`, і термінал лишається зайнятим. Якщо порт зайнятий, запусти з іншим: `PORT=7361 node server.mjs`, і тоді в другому терміналі теж став `PORT=7361` перед кожною командою."
          en: "`club lab listening on http://127.0.0.1:7360`, and the terminal stays busy. If the port is taken, start with another one: `PORT=7361 node server.mjs`, and then put `PORT=7361` before every command in the second terminal too."
      - text:
          uk: "У другому терміналі (у тій самій теці) запиши 30 сторінок для Олі й подивись на обидва термінали."
          en: "In the second terminal (in the same folder) log 30 pages for Olya and look at both terminals."
        command: "node lab-client.mjs log"
        expect:
          uk: "`POST /reads → 201` і рядок сторінки клубу з 30 сторінками; у першому терміналі — рядки `GET /summary` і `POST /reads`, як у кроці 3 вступу."
          en: "`POST /reads → 201` and the club page's line with 30 pages; in the first terminal the `GET /summary` and `POST /reads` lines, as in step 3 of the introduction."
      - text:
          uk: "Перезапусти сервер: у першому терміналі Ctrl+C (з’явиться `club lab stopped`) і знову `node server.mjs`. Потім у другому — `show`. Запиши, що бачиш."
          en: "Restart the server: Ctrl+C in the first terminal (`club lab stopped` appears) and `node server.mjs` again. Then `show` in the second. Write down what you see."
        command: "node lab-client.mjs show"
        expect:
          uk: "60 сторінок замість 30 — хоча нового запису не було. Скаргу відтворено справжніми запитами й справжнім перезапуском."
          en: "60 pages instead of 30 — although there was no new reading. The complaint is reproduced with real requests and a real restart."
      - text:
          uk: "Зупини сервер (Ctrl+C), заміни `repo.js` своїм виправленим із вправи й переконайся, що змінився лише він."
          en: "Stop the server (Ctrl+C), replace `repo.js` with your fixed one from the exercise and make sure it is the only change."
        command: "git diff --stat"
        expect:
          uk: "У списку лише `repo.js` (числа рядків у тебе свої)."
          en: "Only `repo.js` is listed (your line counts differ)."
      - text:
          uk: "Повтори кроки 2–4 з виправленням, але запусти сервер із `--fresh`, щоб почати з фікстур: `node server.mjs --fresh`, потім `log`, Ctrl+C, `node server.mjs`, `show`."
          en: "Repeat steps 2–4 with the fix, but start the server with `--fresh` to begin from the fixtures: `node server.mjs --fresh`, then `log`, Ctrl+C, `node server.mjs`, `show`."
        command: "node server.mjs --fresh"
        expect:
          uk: "Після перезапуску `show` друкує 30 сторінок і 2 голоси — те саме, що показувала сторінка клубу."
          en: "After the restart `show` prints 30 pages and 2 votes — the same as the club page showed."
      - text:
          uk: "Зупини сервер. Запусти свій регресійний тест на виправленні, зафіксуй виправлення, а потім доведи, що тест ловить дефект: тимчасово поверни `repo.js` із першого commit (його id покаже `git log --oneline -2`, другий рядок), запусти тест і поверни виправлення."
          en: "Stop the server. Run your regression test on the fix, commit the fix, then prove that the test catches the defect: bring back `repo.js` from the first commit for a while (`git log --oneline -2` shows its id, the second line), run the test and bring the fix back."
        command: "node run-regression.mjs\ngit add -A\ngit commit -m \"Count each club total once in the summary\"\ngit log --oneline -2\ngit checkout <id-of-the-first-commit> -- repo.js\nnode run-regression.mjs\ngit checkout HEAD -- repo.js\nnode run-regression.mjs"
        expect:
          uk: "Перший і останній запуск — `Пройшли: 1 · не пройшли: 0` (чи скільки в тебе тестів); запуск на версії зі скарги — `✗` і `не пройшли: 1`, як у кроці 7 вступу. Після останньої команди `git status` чистий: файли `.db` не потрапляють у Git завдяки `.gitignore`."
          en: "The first and the last run — `Passed: 1 · failed: 0` (or however many tests you have); the run on the version from the complaint — `✗` and `failed: 1`, as in step 7 of the introduction. After the last command `git status` is clean: the `.db` files stay out of Git thanks to `.gitignore`."
      - text:
          uk: "Напиши `ROOT-CAUSE.md` (три речення, як у кроці 8 вступу) і зафіксуй його."
          en: "Write `ROOT-CAUSE.md` (three sentences, as in step 8 of the introduction) and commit it."
        command: "git add ROOT-CAUSE.md\ngit commit -m \"Explain the root cause of the doubled pages\""
        expect:
          uk: "Commit створено; `git log --oneline` показує три commit."
          en: "The commit is created; `git log --oneline` shows three commits."
    verify:
      - id: reproduced
        text:
          uk: "Я бачив `201` і 30 сторінок на сторінці клубу, а після справжнього перезапуску сервер показав 60."
          en: "I saw `201` and 30 pages on the club page, and after a real restart the server showed 60."
      - id: fixed-across-restart
        text:
          uk: "З моїм `repo.js` після перезапуску сервер показує ті самі 30 сторінок і 2 голоси."
          en: "With my `repo.js` the server shows the same 30 pages and 2 votes after a restart."
      - id: test-catches
        text:
          uk: "Мій регресійний тест пройшов на виправленні й упав на `repo.js` із першого commit."
          en: "My regression test passed on the fix and failed on the `repo.js` from the first commit."
      - id: root-cause
        text:
          uk: "`ROOT-CAUSE.md` має три речення — що бачила учасниця, причина з її шаром і що не дасть їй повторитися, — і все зафіксовано."
          en: "`ROOT-CAUSE.md` has three sentences — what the member saw, the cause with its layer and what keeps it from coming back — and everything is committed."
    troubleshooting:
      - problem:
          uk: "`node server.mjs` пише `Error: listen EADDRINUSE: address already in use 127.0.0.1:7360`."
          en: "`node server.mjs` prints `Error: listen EADDRINUSE: address already in use 127.0.0.1:7360`."
        fix:
          uk: "Порт зайнятий — часто це сервер лабораторії з іншого вікна, який ти не зупинив (так само на v25.2.1 і v22.23.3). Зупини його Ctrl+C у тому вікні або запусти з іншим портом: `PORT=7361 node server.mjs`, і тоді `PORT=7361 node lab-client.mjs show`."
          en: "The port is taken — often by the lab server in another window you did not stop (the same on v25.2.1 and v22.23.3). Stop it with Ctrl+C in that window, or start with another port: `PORT=7361 node server.mjs`, and then `PORT=7361 node lab-client.mjs show`."
      - problem:
          uk: "`node lab-client.mjs show` падає з `TypeError: fetch failed` і `connect ECONNREFUSED 127.0.0.1:7360`."
          en: "`node lab-client.mjs show` fails with `TypeError: fetch failed` and `connect ECONNREFUSED 127.0.0.1:7360`."
        fix:
          uk: "Сервер не працює: його зупинили й ще не запустили знову, або він слухає інший порт. Запусти `node server.mjs` у першому терміналі й повтори."
          en: "The server is not running: it was stopped and not started again, or it listens on another port. Start `node server.mjs` in the first terminal and repeat."
      - problem:
          uk: "Після виправлення `show` усе одно показує 60."
          en: "After the fix `show` still shows 60."
        fix:
          uk: "У `club.db` досі дані з першого прогону, а сервер ще старий. Зупини сервер, переконайся через `git diff`, що `repo.js` справді твій виправлений, і запусти з `--fresh`: виправлений запит рахує ті самі рядки правильно, але повторний `log` додає ще 30 сторінок."
          en: "`club.db` still holds the data of the first pass, and the server is still the old one. Stop the server, check with `git diff` that `repo.js` really is your fixed one, and start with `--fresh`: the fixed query counts the same rows correctly, but a repeated `log` adds another 30 pages."
    recovery:
      uk: "Перший commit тримає версію зі скарги, тож `git diff` завжди показує саме твої зміни, а `git checkout HEAD -- repo.js` повертає останню зафіксовану версію. Дані лабораторії відновлює `node server.mjs --fresh`."
      en: "The first commit holds the version from the complaint, so `git diff` always shows exactly your changes, and `git checkout HEAD -- repo.js` brings back the last committed version. `node server.mjs --fresh` restores the lab data."
