id: no-14-03-gate-unseen-debug-test
unit: NO-14
title:
  uk: "Гейт: незнайомий дефект і тести, що його ловлять"
  en: "Gate: unseen defect, tests that catch it"
kind: assessment
minutes: 45
contentVersion: 1
purpose:
  uk: "Перша частина фінального гейту. У незнайомому застосунку книжкового клубу — клієнт, API на Node.js і сховище SQLite — ти без підказок відтворюєш скаргу, знаходиш корінну причину, виправляєш її в тому шарі, де вона є, і пишеш тест потрібного рівня, який падає до виправлення й проходить після. Потім закриваєш два дефекти, які показало відтворення, і доводиш виправлення справжнім сервером і справжнім перезапуском у своєму терміналі."
  en: "The first part of the final gate. In an unfamiliar book-club app — a client, a Node.js API and SQLite storage — you reproduce a complaint without hints, find the root cause, fix it in the layer where it is, and write a test at the right level that fails before the fix and passes after it. Then you close two defects the reproduction exposed, and prove the fix with a real server and a real restart in your own terminal."
objectives:
  - uk: "Без підказок відтворити й виправити незнайомий дефект у незнайомому синтетичному застосунку з клієнтом, сервером і сховищем."
    en: "Reproduce and repair an unseen defect in an unfamiliar synthetic full-stack app without hints."
  - uk: "Написати тести потрібного рівня (unit, справжній HTTP чи інтеграційний), що падають до виправлення й проходять після."
    en: "Write tests at the right level (unit, real-HTTP or integration) that fail before the fix and pass after it."
prerequisites: [no-14-02-cumulative-review]
subskills:
  - { family: B-13, skill: "no-hint defect", depth: assess }
glossary: []
selfCheck: [club-totals]

blocks:
  - id: the-complaint
    kind: explanation
    title:
      uk: "Скарга від книжкового клубу"
      en: "A complaint from the book club"
    body:
      uk: |
        Книжковий клуб — новий для тебе застосунок, не твій проєкт: сторінка клубу (`client.js` робить те саме, що вона, без розмітки), API на `node:http` (`app.js`) і сховище — файл SQLite (`repo.js`, `club-data.js`). У підсумку клубу для кожного учасника — скільки сторінок він прочитав і скільки голосів віддав за наступну книжку. Учасниця пише:

        > «Увечері я записала 30 сторінок — на сторінці клубу так і було: 30. Зранку відкриваю — у мене 60. Я нічого не додавала».

        Інші учасники кажуть, що в них усе правильно. Підказок немає. Перевірки надсилають справжні HTTP-запити й «перезапускають» сервер — відкривають нове з’єднання з тим самим файлом бази.

        Що здати:

        1. Виправлення в тому шарі, де причина. Решта контракту API не змінюється.
        2. `regression.test.js` — [[regression-test|регресійний тест]] потрібного рівня, що падає на версії зі скарги (її копія — у `seeded/`, лише для читання) і проходить на твоїй. **Запустити** відтворює скаргу, а потім запускає твій тест.
        3. Корінну причину трьома реченнями — у локальному завданні наприкінці уроку.
      en: |
        The book club is an app new to you, not your project: the club's page (`client.js` does what it does, without the markup), an API on `node:http` (`app.js`) and the storage — an SQLite file (`repo.js`, `club-data.js`). The club's summary shows, for every member, how many pages they read and how many votes they gave for the next book. A member writes:

        > “In the evening I logged 30 pages — the club page said exactly that: 30. In the morning I open it — I have 60. I added nothing.”

        Other members say everything is right for them. There are no hints. The checks send real HTTP requests and “restart” the server — they open a new connection to the same database file.

        What to hand in:

        1. A fix in the layer where the cause is. The rest of the API contract does not change.
        2. `regression.test.js` — a [[regression-test]] at the right level that fails on the version from the complaint (its copy is in `seeded/`, read-only) and passes on yours. **Run** replays the complaint and then runs your test.
        3. The root cause in three sentences — in the local task at the end of the lesson.

  - id: club-totals
    kind: exercise
    mode: independent
    assessment: true
    runtime: isolated-node
    dir: club-totals
    entry: index.js
    editable: [repo.js, app.js, client.js, regression.test.js]
    capabilities: { network: loopback, timeoutMs: 20000 }
    strings:
      lina: { uk: "Ліна", en: "Lina" }
      denys: { uk: "Денис", en: "Denys" }
      olya: { uk: "Оля", en: "Olya" }
      yarema: { uk: "Ярема", en: "Yarema" }
      sofia: { uk: "Софія", en: "Sofia" }
      harbour: { uk: "Тиха гавань", en: "The Quiet Harbour" }
      windMap: { uk: "Карта вітрів", en: "The Wind Map" }
      hundredSteps: { uk: "Сто кроків", en: "A Hundred Steps" }
      pages: { uk: "сторінок", en: "pages" }
      votes: { uk: "голосів", en: "votes" }
      atStart: { uk: "сторінка клубу на початку:", en: "the club page at the start:" }
      onPage: { uk: "сторінка клубу після запису 30 сторінок:", en: "the club page after logging 30 pages:" }
      afterReload: { uk: "зранку, після перезапуску й нового завантаження:", en: "in the morning, after a restart and a reload:" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у regression.test.js.", en: "No tests yet: add test(…) to regression.test.js." }
    title:
      uk: "Сторінки, що подвоюються за ніч"
      en: "Pages that double overnight"
    instructions:
      uk: |
        Виправ застосунок так, щоб виконувалися всі правила:

        1. Після будь-яких записів `POST /reads` кожна сума в `GET /summary` порахована рівно раз: `pagesRead` — сума сторінок усіх записів учасника, `votes` — кількість його голосів. Так і до перезапуску, і після.
        2. Два записи з однаковою кількістю сторінок рахуються обидва.
        3. Учасник без записів і без голосів є в підсумку з `0` і `0`; порядок — за `id`.
        4. Сторінка клубу (`client.js`) після запису сторінок показує ті самі суми, що й щойно завантажена наново.
        5. Решта контракту не змінюється: `pages` — ціле число від 1 до 2000, інакше `400`; невідомий учасник чи книжка — `404`; зламаний JSON — `400`; після відмови в базі нічого не змінюється.
        6. `regression.test.js` реєструє хоча б один тест через `test(…)` з `./testing.js`; на версії з `seeded/` хоча б один твій тест падає, а на твоїй версії всі проходять.

        `repo.js`, `app.js`, `client.js` і `regression.test.js` можна змінювати; `club-data.js` (`freshClub`), `lab.js` (`serve`), `testing.js` і `seeded/` — лише для читання. `freshClub('назва')` створює в теці вправи новий файл `назва.db` зі схемою й фікстурами.
      en: |
        Repair the app so that all the rules hold:

        1. After any `POST /reads` requests, every total in `GET /summary` is counted exactly once: `pagesRead` is the sum of the pages of all the member's readings, `votes` the number of their votes. So before a restart and after it.
        2. Two readings with the same number of pages both count.
        3. A member without readings and without votes is in the summary with `0` and `0`; the order is by `id`.
        4. The club page (`client.js`) after logging pages shows the same totals as one loaded anew.
        5. The rest of the contract does not change: `pages` is an integer from 1 to 2000, otherwise `400`; an unknown member or book — `404`; broken JSON — `400`; after a refusal nothing changes in the database.
        6. `regression.test.js` registers at least one test through `test(…)` from `./testing.js`; on the version in `seeded/` at least one of your tests fails, and on your version all of them pass.

        `repo.js`, `app.js`, `client.js` and `regression.test.js` can be changed; `club-data.js` (`freshClub`), `lab.js` (`serve`), `testing.js` and `seeded/` are read-only. `freshClub('name')` creates a new file `name.db` with the schema and the fixtures in the exercise folder.
    testTitles:
      "after logging, every total is counted once, also after a restart":
        uk: "Після записів кожну суму пораховано раз — і після перезапуску"
        en: "After logging, every total is counted once — also after a restart"
      "two readings with the same number of pages both count":
        uk: "Два записи з однаковою кількістю сторінок рахуються обидва"
        en: "Two readings with the same number of pages both count"
      "a member who logged nothing and voted for nothing is listed with zeros":
        uk: "Учасник без записів і голосів є в підсумку з нулями"
        en: "A member who logged nothing and voted for nothing is listed with zeros"
      "the page and a reloaded page show the same totals after logging pages":
        uk: "Сторінка й наново завантажена сторінка показують ті самі суми після запису"
        en: "The page and a reloaded page show the same totals after logging pages"
      "invalid readings still get 400 or 404, and nothing is stored":
        uk: "Некоректні записи досі отримують `400` чи `404`, і нічого не зберігається"
        en: "Invalid readings still get `400` or `404`, and nothing is stored"
      "your regression test fails on the version as reported":
        uk: "Твій регресійний тест падає на версії зі скарги (`seeded/`)"
        en: "Your regression test fails on the version from the complaint (`seeded/`)"
      "your regression test passes on your version":
        uk: "Твій регресійний тест проходить на твоїй версії"
        en: "Your regression test passes on your version"
    solutionNote:
      uk: "Підсумок з’єднував з учасником і записи, і голоси одним запитом. З’єднання дає рядок на кожну пару, що збіглася: один запис Олі × два її голоси — два рядки, тож `SUM(pages)` подвоївся; у Ліни два записи × один голос подвоїли `COUNT` голосів. Поки в учасника з голосами не було записів (або навпаки), суми були правильні — тому дефект з’являвся «за ніч», після першого запису. Сторінка рахувала суму сама й показувала правду; підсумок із сервера — ні. Виправлення — у `repo.js`: кожну суму рахують окремо (підзапитом чи окремим згрупованим запитом). `SUM(DISTINCT pages)` — хибний шлях: два записи по 25 сторінок злилися б в один. Виправлення в клієнті нічого не дає: сервер і далі віддає 60. Тест має створити саме цю умову — учасника з двома голосами, який записує сторінки, — і прочитати підсумок після перезапуску; тест лише на фікстурах дефекту не бачить. Тест над `repo.js` без HTTP теж правильний: причина в запиті."
      en: "The summary joined both the readings and the votes to the member in one query. A join gives a row for every pair that matched: one reading of Olya × her two votes is two rows, so `SUM(pages)` doubled; Lina's two readings × one vote doubled the `COUNT` of votes. As long as a member with votes had no readings (or the other way round), the totals were right — that is why the defect appeared “overnight”, after the first reading. The page computed the sum itself and showed the truth; the summary from the server did not. The fix is in `repo.js`: each total is computed separately (with a subquery or a separate grouped query). `SUM(DISTINCT pages)` is a wrong path: two readings of 25 pages would merge into one. A fix in the client changes nothing: the server still sends 60. The test has to create exactly this condition — a member with two votes who logs pages — and read the summary after a restart; a test on the fixtures alone does not see the defect. A test over `repo.js` without HTTP is right too: the cause is in the query."
    feedback:
      - when: { test: "after logging, every total is counted once, also after a restart" }
        message:
          uk: "Ця перевірка записує 30 сторінок для `m-03` і 10 — для `m-01`, а потім очікує в `GET /summary` до й після перезапуску рівно `m-01 50/1`, `m-02 55/0`, `m-03 30/2`, `m-04 12/0`, `m-05 0/0` (сторінки/голоси). Якщо всі перевірки падають одночасно, спершу виправ першу помилку з виводу **Запустити**."
          en: "This check logs 30 pages for `m-03` and 10 for `m-01`, then expects in `GET /summary`, before and after a restart, exactly `m-01 50/1`, `m-02 55/0`, `m-03 30/2`, `m-04 12/0`, `m-05 0/0` (pages/votes). If every check fails at once, fix the first error in the **Run** output first."
      - when: { test: "two readings with the same number of pages both count" }
        message:
          uk: "Ця перевірка додає `m-02` ще один запис на 25 сторінок (у нього вже є 25 і 30) і очікує `pagesRead` 80. Сума, що відкидає однакові значення, дасть 55."
          en: "This check adds another 25-page reading to `m-02` (who already has 25 and 30) and expects `pagesRead` 80. A sum that drops equal values gives 55."
      - when: { test: "a member who logged nothing and voted for nothing is listed with zeros" }
        message:
          uk: "Ця перевірка очікує в підсумку всіх п’ятьох учасників за `id`, а `m-05` — з `0` сторінок і `0` голосів (числа, не `null`)."
          en: "This check expects all five members in the summary by `id`, and `m-05` with `0` pages and `0` votes (numbers, not `null`)."
      - when: { test: "the page and a reloaded page show the same totals after logging pages" }
        message:
          uk: "Ця перевірка завантажує сторінку (`createClient`), записує 30 сторінок для `m-03` і порівнює її суми із сумами щойно завантаженої наново сторінки."
          en: "This check loads the page (`createClient`), logs 30 pages for `m-03` and compares its totals with the totals of a page loaded anew."
      - when: { test: "invalid readings still get 400 or 404, and nothing is stored" }
        message:
          uk: "Ця перевірка очікує `400` для `pages` 0, 2001 і `\"30\"`, `404` для `m-99` і `b-99`, `400` для зламаного JSON, а після перезапуску — ті самі суми, що й на початку."
          en: "This check expects `400` for `pages` 0, 2001 and `\"30\"`, `404` for `m-99` and `b-99`, `400` for broken JSON, and after a restart the same totals as at the start."
      - when: { test: "your regression test fails on the version as reported" }
        message:
          uk: "Ця перевірка запускає твій `regression.test.js` поруч із файлами з `seeded/` і очікує щонайменше один тест і щонайменше один провал. Якщо твій тест проходить на версії зі скарги, він не створює умови, за якої скаргу видно, — подумай, чому в інших учасників усе правильно."
          en: "This check runs your `regression.test.js` next to the files from `seeded/` and expects at least one test and at least one failure. If your test passes on the version from the complaint, it does not create the condition under which the complaint shows — think about why everything is right for the other members."
      - when: { test: "your regression test passes on your version" }
        message:
          uk: "Ця перевірка запускає твій `regression.test.js` поруч із твоїми `app.js`, `repo.js` і `client.js` і очікує, що всі тести проходять. Повідомлення про невдачу називає тест і його помилку; **Запустити** показує той самий вивід."
          en: "This check runs your `regression.test.js` next to your `app.js`, `repo.js` and `client.js` and expects every test to pass. The failure message names the test and its error; **Run** shows the same output."

  - id: second-finding
    kind: explanation
    title:
      uk: "Друга знахідка: сервер на крок позаду"
      en: "A second finding: the server one step behind"
    body:
      uk: |
        Поки ти відтворював скаргу, у лозі сервера трапилося дивне: на сторінці прогресу Оля натискає «+10» — на екрані 50, а сервер записує 40. Натискає ще раз — на екрані 60, на сервері 50. Сервер завжди на один крок позаду.

        Це інший дефект і інший шар — компонент React на сторінці клубу. Тут підказки є: це налагодження, а не гейт.
      en: |
        While you were reproducing the complaint, something odd showed up in the server log: on the progress page Olya presses “+10” — the screen shows 50, while the server stores 40. She presses again — 60 on the screen, 50 on the server. The server is always one step behind.

        This is a different defect in a different layer — a React component on the club's page. There are hints here: this is debugging, not the gate.

  - id: progress-save
    kind: exercise
    mode: debug
    runtime: browser-react
    dir: progress-save
    entry: main.jsx
    editable: [ReadingProgress.jsx]
    strings:
      title: { uk: "Мій прогрес у книжці", en: "My progress in the book" }
      readSoFar: { uk: "Прочитано сторінок", en: "Pages read" }
    title:
      uk: "Прогрес, який зберігається на крок пізніше"
      en: "Progress that is saved one step late"
    instructions:
      uk: |
        Сервер тут — імітація в сторінці (`progressServer.js`, лише для читання): на кожне збереження вона друкує в **Консолі** рядок `server: PUT /progress …` — це лог сервера цього перегляду. Чим вона відрізняється від справжнього сервера, написано вгорі файла.

        Відтвори: натисни «+10» двічі й порівняй число на сторінці з рядками `server:`. Потім виправ `ReadingProgress.jsx`:

        1. Після кожного натискання `onSave` отримує `{ memberId, bookId, pages }`, де `pages` — саме та сума, яку тепер показує сторінка.
        2. Одне натискання — рівно одне збереження; сторінка рендериться під `StrictMode`, як у `main.jsx`.
        3. До першого натискання нічого не зберігається.

        Перевірки монтують власний `ReadingProgress` з `initialPages` 12 і власним `onSave`.
      en: |
        The server here is a simulation in the page (`progressServer.js`, read-only): for every save it prints a `server: PUT /progress …` line in the **Console** — the server log of this preview. How it differs from a real server is written at the top of the file.

        Reproduce: press “+10” twice and compare the number on the page with the `server:` lines. Then fix `ReadingProgress.jsx`:

        1. After every press `onSave` gets `{ memberId, bookId, pages }`, where `pages` is exactly the total the page now shows.
        2. One press is exactly one save; the page renders under `StrictMode`, as in `main.jsx`.
        3. Nothing is saved before the first press.

        The checks mount their own `ReadingProgress` with `initialPages` 12 and their own `onSave`.
    limits:
      uk: "Сервер тут — імітація в сторінці, а не процес Node.js: збереження не йде мережею, а «лог сервера» — це Консоль."
      en: "The server here is a simulation in the page, not a Node.js process: a save does not go over the network, and the “server log” is the Console."
    testTitles:
      "one press saves the total the page now shows":
        uk: "Одне натискання зберігає ту суму, яку тепер показує сторінка"
        en: "One press saves the total the page now shows"
      "two presses save 37 and then 47":
        uk: "Два натискання зберігають 37, а потім 47 — по одному разу"
        en: "Two presses save 37 and then 47 — once each"
      "nothing is saved before the first press":
        uk: "До першого натискання нічого не зберігається"
        en: "Nothing is saved before the first press"
    hints:
      nudge:
        uk: "Яке значення `pages` бачить обробник у момент, коли викликає `onSave`? Чи змінює сетер змінну, яку обробник уже тримає?"
        en: "Which value of `pages` does the handler see at the moment it calls `onSave`? Does the setter change the variable the handler already holds?"
      explanation:
        uk: "Обробник створено в рендері, і `pages` у ньому — `const` цього рендеру: сетер просить про **наступний** рендер, а не переписує змінну. Наприклад, кошик, що має і показати, і надіслати нову кількість, рахує її один раз: `const count = items + 1;` — і передає `count` і сетеру, і запиту. Оновлювач `setX((x) => …)` правильно рахує наступний стан, але код після нього все одно бачить старий знімок; а збереження всередині оновлювача — побічний ефект, який `StrictMode` у розробці викликає двічі."
        en: "The handler was created in a render, and `pages` in it is a `const` of that render: the setter asks for the **next** render rather than rewriting the variable. For example, a cart that has to both show and send the new quantity computes it once: `const count = items + 1;` — and passes `count` both to the setter and to the request. An updater `setX((x) => …)` computes the next state correctly, but the code after it still sees the old snapshot; and a save inside an updater is a side effect that `StrictMode` calls twice in development."
    solutionNote:
      uk: "Нову суму обчислено один раз (`const next = pages + amount`) і передано і в `setPages`, і в `onSave`: обидва отримують те саме число, а збереження лишається в обробнику події — один раз на натискання. Оновлювач лише з `onSave({ pages })` після нього надсилає старий знімок; `onSave` усередині оновлювача під `StrictMode` спрацьовує двічі; ефект, що зберігає за `[pages]`, зберігає вже під час монтування. Двічі написаний вираз `pages + amount` теж правильний."
      en: "The new total is computed once (`const next = pages + amount`) and passed both to `setPages` and to `onSave`: both get the same number, and the save stays in the event handler — once per press. An updater with `onSave({ pages })` after it still sends the old snapshot; `onSave` inside the updater fires twice under `StrictMode`; an effect that saves on `[pages]` saves already on mount. Writing the expression `pages + amount` twice is correct too."
    feedback:
      - when: { test: "one press saves the total the page now shows" }
        message:
          uk: "Ця перевірка натискає «+10» на копії з 12 сторінками й очікує на сторінці 22, а в останньому тілі для `onSave` — `{ memberId: \"m-04\", bookId: \"b-03\", pages: 22 }`. Якщо всі перевірки падають одночасно, спершу виправ першу помилку в консолі."
          en: "This check presses “+10” on a copy with 12 pages and expects 22 on the page, and `{ memberId: \"m-04\", bookId: \"b-03\", pages: 22 }` as the last body sent to `onSave`. If every check fails at once, fix the first error in the console first."
      - when: { test: "two presses save 37 and then 47" }
        message:
          uk: "Ця перевірка натискає «+25», потім «+10» і очікує, що `onSave` отримав рівно два тіла — з 37 і з 47. Зайве тіло з’являється, коли збереження стоїть там, що React під `StrictMode` викликає двічі."
          en: "This check presses “+25”, then “+10” and expects `onSave` to have got exactly two bodies — with 37 and with 47. An extra body appears when the save sits where React calls code twice under `StrictMode`."
      - when: { test: "nothing is saved before the first press" }
        message:
          uk: "Ця перевірка монтує компонент і, нічого не натискаючи, очікує, що `onSave` не викликали жодного разу."
          en: "This check mounts the component and, without pressing anything, expects `onSave` to have been called not even once."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: знімки й замикання"
      en: "Recall: snapshots and closures"
    items:
      - id: setter-in-handler
        from: re-02-02-state-snapshots
        prompt:
          uk: "`days` дорівнює `0`. Обробник викликає `setDays(days + 1)`, а одразу за ним — `console.log(days)`. Що надрукує `console.log`?"
          en: "`days` is `0`. A handler calls `setDays(days + 1)` and right after it `console.log(days)`. What does `console.log` print?"
        answer:
          type: choice
          options:
            - id: old
              text: { uk: "`0`: сетер не змінив `const` цього рендеру", en: "`0`: the setter did not change this render's `const`" }
            - id: new
              text: { uk: "`1`: сетер одразу записав нове значення", en: "`1`: the setter wrote the new value at once" }
              why:
                uk: "Сетер просить React про наступний рендер — новий виклик компонента з новою `days`. У вже запущеному обробнику `days` лишається `0`."
                en: "The setter asks React for the next render — a new call of the component with a new `days`. In the handler that is already running `days` stays `0`."
          correct: [old]
        explanation:
          uk: "Стан — знімок кожного рендеру: усе, що створено в рендері, бачить лише його значення."
          en: "State is a snapshot per render: everything created in a render sees only its values."
      - id: live-link
        from: js-03-05-closures
        prompt:
          uk: "`let discount = 10;` Функцію `applyDiscount = (price) => price - discount` створено, потім виконано `discount = 25;`. Що поверне `applyDiscount(100)`?"
          en: "`let discount = 10;` The function `applyDiscount = (price) => price - discount` is created, then `discount = 25;` runs. What does `applyDiscount(100)` return?"
        code: |
          let discount = 10;
          const applyDiscount = (price) => price - discount;
          discount = 25;
          console.log(applyDiscount(100));
        verify:
          logs: ["75"]
        answer:
          type: choice
          options:
            - id: current
              text: { uk: "`75`", en: "`75`" }
            - id: snapshot
              text: { uk: "`90`", en: "`90`" }
              why:
                uk: "Функція не фотографує `10` у момент створення: вона тримає посилання на саму змінну `discount` і читає її під час виклику."
                en: "The function does not take a snapshot of `10` when it is created: it keeps a link to the variable `discount` itself and reads it when called."
          correct: [current]
        explanation:
          uk: "Closure тримає живе посилання на **змінну**. Тому важливо, яку саме змінну вона тримає: якщо це параметр, якому значення передали один раз, нове присвоєння іншій змінній його не змінить."
          en: "A closure keeps a live link to the **variable**. So it matters which variable it holds: if it is a parameter that got its value once, a new assignment to another variable does not change it."

  - id: third-finding
    kind: explanation
    title:
      uk: "Третя знахідка: налаштування, що не доходять до таймера"
      en: "A third finding: settings that never reach the timer"
    body:
      uk: |
        І ще одне з того самого логу. Сервер клубу щогодини надсилає дайджест — найактивніших читачів. Адміністраторка перемкнула дайджест на англійську, на двох читачів і на кожні 30 хвилин, і сервер перечитав налаштування (`reload`). Запит налаштувань показує нові значення — а дайджести й далі приходять українською, з трьома читачами й раз на годину. Аж до перезапуску.

        Годинник тут не справжній: вправа й перевірки рухають годинник самі (`fake-timers.js`), тож година минає миттєво.
      en: |
        And one more thing from the same log. The club server sends a digest every hour — the most active readers. The admin switched the digest to English, to two readers and to every 30 minutes, and the server read the settings again (`reload`). Asking for the settings shows the new values — yet the digests keep coming in Ukrainian, with three readers and once an hour. Until a restart.

        The clock here is not a real one: the exercise and the checks move the clock themselves (`fake-timers.js`), so an hour passes at once.

  - id: digest-timer
    kind: exercise
    mode: debug
    runtime: isolated-node
    dir: digest-timer
    entry: index.js
    editable: [digest.js]
    strings:
      lina: { uk: "Ліна", en: "Lina" }
      denys: { uk: "Денис", en: "Denys" }
      olya: { uk: "Оля", en: "Olya" }
      yarema: { uk: "Ярема", en: "Yarema" }
      reloaded: { uk: "налаштування перечитано:", en: "settings reloaded:" }
      timersLeft: { uk: "таймерів після stop():", en: "timers after stop():" }
    title:
      uk: "Дайджест, що не чує нових налаштувань"
      en: "A digest that does not hear the new settings"
    instructions:
      uk: |
        `createDigest` у `digest.js` запускає таймер дайджесту. `loadConfig()` щоразу повертає поточні налаштування `{ language, topCount, everyMs }`; `timers` — об’єкт із `setInterval` і `clearInterval` (у вправі — фальшивий годинник із `fake-timers.js`, лише для читання). **Запустити** відтворює скаргу: 90 хвилин зі старими налаштуваннями, `reload()`, ще 90 хвилин.

        Виправ `digest.js` так, щоб:

        1. До `reload()` дайджести йшли за першими налаштуваннями.
        2. Після `reload()` наступний дайджест мав нову мову (`language`) і нову кількість читачів (`topCount`).
        3. Якщо після `reload()` змінився `everyMs`, дайджести йшли з новим інтервалом.
        4. Після будь-якої кількості `reload()` працював рівно один таймер, а після `stop()` — жодного.
      en: |
        `createDigest` in `digest.js` starts the digest timer. `loadConfig()` returns the current settings `{ language, topCount, everyMs }` every time; `timers` is an object with `setInterval` and `clearInterval` (in the exercise a fake clock from `fake-timers.js`, read-only). **Run** replays the complaint: 90 minutes with the old settings, `reload()`, 90 more minutes.

        Fix `digest.js` so that:

        1. Before `reload()` the digests follow the first settings.
        2. After `reload()` the next digest has the new language (`language`) and the new number of readers (`topCount`).
        3. If `everyMs` changed at `reload()`, the digests follow the new interval.
        4. After any number of `reload()` calls exactly one timer runs, and after `stop()` none.
    testTitles:
      "before a reload, digests follow the first settings":
        uk: "До `reload()` дайджести йдуть за першими налаштуваннями"
        en: "Before a `reload()`, digests follow the first settings"
      "after a reload, the next digest uses the new language and top count":
        uk: "Після `reload()` наступний дайджест має нові мову й кількість читачів"
        en: "After a `reload()`, the next digest uses the new language and top count"
      "after a reload with a new interval, digests follow it":
        uk: "Після `reload()` з новим інтервалом дайджести йдуть за ним"
        en: "After a `reload()` with a new interval, digests follow it"
      "exactly one timer is live after reloads, and none after stop()":
        uk: "Після кількох `reload()` живий рівно один таймер, а після `stop()` — жодного"
        en: "Exactly one timer is live after reloads, and none after `stop()`"
    hints:
      nudge:
        uk: "Яку змінну читає колбек таймера: `config` чи щось інше? Що з тієї змінної бачить `reload()`, і що змінює?"
        en: "Which variable does the timer's callback read: `config` or something else? What of that variable does `reload()` see, and what does it change?"
      explanation:
        uk: "Колбек тримає живе посилання на змінні місця, де народився. Параметр функції — окрема змінна, якій значення дали під час виклику; нове присвоєння іншій змінній її не зачіпає. Наприклад, `function watch(limit) { setInterval(() => check(limit), 1000); }`, викликана як `watch(current)`, бачитиме старий `limit`, хоч би скільки разів потім виконали `current = …`. А інтервал таймера взагалі фіксується під час `setInterval`: щоб змінити його, таймер замінюють — зупиняють старий і запускають новий."
        en: "A callback keeps a live link to the variables of the place it was born in. A function's parameter is a separate variable that got its value at the call; a new assignment to another variable does not touch it. For example, `function watch(limit) { setInterval(() => check(limit), 1000); }`, called as `watch(current)`, keeps seeing the old `limit` however many times `current = …` runs later. And the timer's interval is fixed at `setInterval` altogether: to change it, the timer is replaced — the old one stopped and a new one started."
    solutionNote:
      uk: "Колбек таймера читав параметр `settings` — змінну, якій значення дали під час `schedule(config)`. `reload()` присвоював нове значення **іншій** змінній, `config`, тож таймер бачив старі налаштування до перезапуску, а `settings()` уже показував нові. Виправлення: у `reload()` зупинити старий таймер і запланувати новий із новими налаштуваннями — так змінюється й інтервал. Варіант, у якому колбек читає змінну `config`, виправляє мову й кількість, але не інтервал: тоді таймер замінюють лише тоді, коли змінився `everyMs`. Новий таймер без `clearInterval` — дві паралельні розсилки, і стара досі зі старими налаштуваннями."
      en: "The timer's callback read the parameter `settings` — a variable that got its value at `schedule(config)`. `reload()` assigned a new value to **another** variable, `config`, so the timer kept seeing the old settings until a restart, while `settings()` already showed the new ones. The fix: in `reload()` stop the old timer and schedule a new one with the new settings — that changes the interval too. A version in which the callback reads the variable `config` fixes the language and the count, but not the interval: then the timer is replaced only when `everyMs` changed. A new timer without `clearInterval` means two parallel mailings, and the old one still has the old settings."
    feedback:
      - when: { test: "before a reload, digests follow the first settings" }
        message:
          uk: "Ця перевірка без жодного `reload()` пересуває годинник на 125 хвилин і очікує два дайджести — на 60-й і 120-й хвилинах, `uk`, троє читачів `B`, `C`, `A`. Якщо всі перевірки падають одночасно, спершу виправ першу помилку з виводу **Запустити**."
          en: "This check moves the clock 125 minutes without any `reload()` and expects two digests — at minutes 60 and 120, `uk`, three readers `B`, `C`, `A`. If every check fails at once, fix the first error in the **Run** output first."
      - when: { test: "after a reload, the next digest uses the new language and top count" }
        message:
          uk: "Ця перевірка на 10-й хвилині ставить `en`, двох читачів і той самий інтервал, викликає `reload()` і за наступні 60 хвилин очікує рівно один дайджест: `en`, `B`, `C`. Хвилина дайджесту тут не важлива."
          en: "This check sets `en`, two readers and the same interval at minute 10, calls `reload()` and over the next 60 minutes expects exactly one digest: `en`, `B`, `C`. The minute of the digest does not matter here."
      - when: { test: "after a reload with a new interval, digests follow it" }
        message:
          uk: "Ця перевірка на 10-й хвилині ставить інтервал 20 хвилин і викликає `reload()`; до 70-ї хвилини очікує дайджести рівно на 30-й, 50-й і 70-й хвилинах."
          en: "This check sets a 20-minute interval at minute 10 and calls `reload()`; up to minute 70 it expects digests at exactly minutes 30, 50 and 70."
      - when: { test: "exactly one timer is live after reloads, and none after stop()" }
        message:
          uk: "Ця перевірка двічі викликає `reload()` з новими інтервалами й очікує один живий таймер, а після `stop()` — нуль."
          en: "This check calls `reload()` twice with new intervals and expects one live timer, and zero after `stop()`."

