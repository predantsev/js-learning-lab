id: rn-08-01-checkpoint-review
unit: RN-08
title:
  uk: "Огляд контрольної точки: відкладене повторення React і JS"
  en: "Checkpoint review: delayed React/JS retrieval"
kind: review
minutes: 20
contentVersion: 1
purpose:
  uk: "Перед контрольною точкою CP-RN ти з пам’яті відповідаєш на питання про механізми, які вивчав місяці тому: знімки state, cleanup ефектів, `reduce` і closures — тепер у коді нативного проєкту. Саме вони ламають перевірки CP-RN: старий знімок губить зміну після перезапуску, забутий cleanup дублює оновлення після повернення на екран. Наприкінці уроку — шість перевірок CP-RN і різниця між «пройдено» й «пропущено»."
  en: "Before the checkpoint CP-RN you answer, from memory, questions about mechanisms you learned months ago: state snapshots, effect cleanup, `reduce` and closures — now in native project code. These are exactly what breaks the CP-RN checks: an old snapshot loses a change after a restart, a forgotten cleanup doubles an update after returning to a screen. At the end of the lesson: the six CP-RN checks and the difference between “passed” and “skipped”."
objectives:
  - uk: "Без конспекту пригадати, як поводяться знімки state, cleanup ефектів, `reduce` і closures, і передбачити їхній вплив у коді нативного проєкту."
    en: "Retrieve, without notes, how state snapshots, effect cleanup, `reduce` and closures behave, and predict their effect in native capstone code."
  - uk: "Перелічити категорії доказів контрольної точки (перезапуск, офлайн, життєвий цикл, безпека, доступність, продуктивність) і пояснити, що вважається пропуском, а не проходженням."
    en: "List the checkpoint's evidence categories (restart, offline, lifecycle, security, accessibility, performance) and say what counts as a skip rather than a pass."
prerequisites: [rn-11-09-capstone-release-build, re-02-02-state-snapshots, re-03-03-dependencies-cleanup, js-05-04-reduce, js-03-05-closures]
subskills:
  - { family: N-12, skill: "restart/offline/lifecycle/security/a11y/performance", depth: intro }
  - { family: N-12, skill: "unsupported target and skip evidence", depth: intro }
glossary: []
selfCheck: [saved-snapshot, covered-screen, skip-or-fail]

blocks:
  - id: from-memory
    kind: explanation
    title:
      uk: "Спершу з пам’яті"
      en: "From memory first"
    body:
      uk: |
        Етап React Native закінчується [[checkpoint|контрольною точкою]] CP-RN: ти сам, без підказок, додаєш у нативний проєкт нову можливість і доводиш на своїй [[declared-target|заявленій цілі]], що вона переживає перезапуск, офлайн, перехід у фон і назад та роботу зі screen reader.

        Такі перевірки рідко ламає щось нове. Їх ламають старі механізми: знімок state, cleanup ефекту, `reduce`, closure. Тому цей урок — **відкладене пригадування**:

        - відповідай **до** запуску коду й без конспекту — навіть якщо не впевнений;
        - помилка тут — адреса: пояснення називає механізм, а таблиця наприкінці — урок, який варто перечитати;
        - приклад посередині уроку дає запустити три перші питання в перегляді й перевірити себе.
      en: |
        The React Native stage ends with the [[checkpoint]] CP-RN: on your own, without hints, you add a new feature to the native project and prove on your [[declared-target]] that it survives a restart, offline use, going to the background and back, and use with a screen reader.

        Such checks are rarely broken by something new. They are broken by old mechanisms: a state snapshot, an effect cleanup, `reduce`, a closure. So this lesson is **delayed retrieval**:

        - answer **before** running the code and without notes — even when you are not sure;
        - a mistake here is an address: the explanation names the mechanism, and the table at the end names the lesson worth rereading;
        - the example in the middle of the lesson lets you run the first three questions in the preview and check yourself.

  - id: saved-snapshot
    kind: prediction
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
    prompt:
      uk: "Список бажань має три записи, і лише «%%book%%» позначено ✓ (отримано). Користувач торкається «%%headphones%%», і на екрані біля нього з’являється ✓. Потім застосунок повністю закривають і запускають знову; після запуску список відновлюється зі сховища. Які записи мають ✓ після перезапуску?"
      en: "A wishlist has three records, and only “%%book%%” is marked ✓ (acquired). The user taps “%%headphones%%”, and a ✓ appears next to it on the screen. Then the app is closed completely and started again; on launch the list is restored from storage. Which records have a ✓ after the restart?"
    code: |
      function markAcquired(id) {
        setWishes(wishes.map((wish) => (wish.id === id ? { ...wish, acquired: true } : wish)));
        storage.setItem(KEY, JSON.stringify({ schemaVersion: 1, records: wishes }));
      }
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: book-only
          text:
            uk: "Лише «%%book%%» — позначка навушників загубилася"
            en: "Only “%%book%%” — the headphones mark is lost"
        - id: both
          text:
            uk: "«%%book%%» і «%%headphones%%»"
            en: "“%%book%%” and “%%headphones%%”"
          why:
            uk: "`setWishes` не змінює змінну `wishes` — він просить React про наступний рендер. На наступному рядку `wishes` — ще знімок цього рендеру, без нової позначки, і саме його записано в сховище. Екран показує ✓, бо його намалював новий рендер; диск має старий список."
            en: "`setWishes` does not change the variable `wishes` — it asks React for the next render. On the next line `wishes` is still this render’s snapshot, without the new mark, and that is what goes to storage. The screen shows ✓ because a new render drew it; the disk has the old list."
        - id: none
          text:
            uk: "Жодного — після перезапуску список порожній"
            en: "None — the list is empty after the restart"
          why:
            uk: "Перезапуск втрачає лише те, що жило в пам’яті. Список записано в сховище (`setItem` викликано), тож він відновлюється — питання лише в тому, яку версію списку записано."
            en: "A restart loses only what lived in memory. The list was written to storage (`setItem` was called), so it is restored — the only question is which version of the list was written."
        - id: headphones-only
          text:
            uk: "Лише «%%headphones%%»"
            en: "Only “%%headphones%%”"
          why:
            uk: "`map` змінює лише запис із потрібним `id`, решта копіюються як є, тож позначка книжки нікуди не дівається. А нову позначку в сховище не записано взагалі."
            en: "`map` changes only the record with the matching `id`, the rest are copied as they are, so the book’s mark does not go anywhere. And the new mark was never written to storage at all."
      correct: [book-only]
    explanation:
      uk: "[[state-snapshot|Знімок state]]: обробник бачить `wishes` того рендеру, у якому його створено, аж до кінця функції. Записати треба той самий новий масив, який іде в `setWishes`: збережи його в змінну й передай і туди, і в `setItem`. Перевірено в перегляді (react-native-web, імітоване сховище): після торкання консоль друкує `wishes: acquired before saving = 1`, а після «перезапуску» ✓ лише біля книжки. На CP-RN саме така помилка провалює перевірку перезапуску."
      en: "[[state-snapshot|State is a snapshot]]: a handler sees the `wishes` of the render that created it, until the end of the function. What must be written is the same new array that goes into `setWishes`: keep it in a variable and pass it both there and to `setItem`. Checked in the preview (react-native-web, simulated store): after the tap the console prints `wishes: acquired before saving = 1`, and after the “restart” only the book has a ✓. At CP-RN exactly this mistake fails the restart check."

  - id: covered-screen
    kind: prediction
    prompt:
      uk: "Екран «Сьогодні» лежить у нативному стеку навігації (React Navigation 7, без StrictMode). Після першого показу консоль має два рядки: `Today: mounted`, `Today: listening`. Користувач відкриває екран деталей звички поверх нього, а потім повертається «Назад». Які рядки з’являться в консолі за цей час?"
      en: "The “Today” screen sits in a native navigation stack (React Navigation 7, without StrictMode). After it is first shown the console has two lines: `Today: mounted`, `Today: listening`. The user opens a habit’s detail screen on top of it and then goes “Back”. Which lines appear in the console during this time?"
    code: |
      useEffect(() => {
        console.log("Today: mounted");
        return () => console.log("Today: unmounted");
      }, []);

      useFocusEffect(
        useCallback(() => {
          console.log("Today: listening");
          return () => console.log("Today: stopped");
        }, []),
      );
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: stopped-listening
          text:
            uk: "`Today: stopped`, потім `Today: listening`"
            en: "`Today: stopped`, then `Today: listening`"
        - id: nothing
          text:
            uk: "Нічого: екран лишився змонтованим, а cleanup запускається лише під час демонтування"
            en: "Nothing: the screen stayed mounted, and a cleanup runs only on unmount"
          why:
            uk: "Так поводиться `useEffect`, і тому рядка `Today: unmounted` справді не буде. Але `useFocusEffect` прив’язаний до [[screen-focus|фокуса]]: коли екран деталей закриває «Сьогодні», той отримує [[screen-blur|blur]], і cleanup фокус-ефекту запускається."
            en: "That is how `useEffect` behaves, and that is why there is indeed no `Today: unmounted` line. But `useFocusEffect` is tied to [[screen-focus|focus]]: when the detail screen covers “Today”, it gets a [[screen-blur|blur]], and the focus effect’s cleanup runs."
        - id: remount
          text:
            uk: "`Today: stopped`, `Today: unmounted`, а після повернення — `Today: mounted`, `Today: listening`"
            en: "`Today: stopped`, `Today: unmounted`, and after returning `Today: mounted`, `Today: listening`"
          why:
            uk: "Екран, закритий іншим екраном стеку, не демонтується: він лишається в стеку зі своїм state, лише невидимий. Демонтування буде, коли сам «Сьогодні» знімуть зі стеку."
            en: "A screen covered by another stack screen is not unmounted: it stays in the stack with its state, just invisible. It is unmounted when “Today” itself is removed from the stack."
      correct: [stopped-listening]
    explanation:
      uk: "Монтування й фокус — різні події. Екран під іншим екраном лишається змонтованим, але втрачає фокус: `useFocusEffect` прибирає за собою на blur і запускається знову на focus. Перевірено в перегляді з імітованим стеком (`navSim.jsx`, поводиться як React Navigation 7): відкриття деталей друкує `Today: stopped`, повернення — `Today: listening`, а `Today: unmounted` не з’являється. Тому підписку, яка потрібна лише видимому екрану, відкривають у фокус-ефекті й закривають у його cleanup."
      en: "Mounting and focus are different events. A screen under another screen stays mounted but loses focus: `useFocusEffect` cleans up on blur and runs again on focus. Checked in the preview with the simulated stack (`navSim.jsx`, behaves like React Navigation 7): opening the detail prints `Today: stopped`, returning prints `Today: listening`, and `Today: unmounted` never appears. That is why a subscription only the visible screen needs is opened in a focus effect and closed in its cleanup."

  - id: stale-due
    kind: prediction
    strings:
      due: { uk: "Справ на сьогодні:", en: "Tasks due today:" }
    prompt:
      uk: "Головний екран планувальника показує `%%due%% 2`. Користувач додає справу з терміном на сьогодні, і екран показує `%%due%% 3`. Потім застосунок іде у фон і повертається. Що надрукує консоль?"
      en: "The planner’s home screen shows `%%due%% 2`. The user adds a task due today, and the screen shows `%%due%% 3`. Then the app goes to the background and comes back. What does the console print?"
    code: |
      // PlannerHome({ initialTasks, today }): both come in as props.
      const [tasks, setTasks] = useState(initialTasks);

      useEffect(() => {
        const subscription = AppState.addEventListener("change", (next) => {
          if (next === "active") console.log("planner: due on return =", countDueTasks(tasks, today));
        });
        return () => subscription.remove();
      }, []);
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: two
          text: { uk: "`planner: due on return = 2`", en: "`planner: due on return = 2`" }
        - id: three
          text: { uk: "`planner: due on return = 3`", en: "`planner: due on return = 3`" }
          why:
            uk: "Обробник створено один раз — в ефекті після першого рендеру, і він пам’ятає змінну `tasks` **того** рендеру, з двома справами. Кожен новий рендер має нову змінну `tasks`, але цей обробник її не бачить."
            en: "The handler was created once — in the effect after the first render, and it remembers the `tasks` variable of **that** render, with two tasks. Every new render has a new `tasks` variable, but this handler does not see it."
        - id: nothing
          text:
            uk: "Нічого: підписку прибрано після другого рендеру"
            en: "Nothing: the subscription was removed after the second render"
          why:
            uk: "Cleanup ефекту з `[]` запускається лише під час демонтування. Екран на місці, тож підписка жива й реагує на повернення."
            en: "The cleanup of an effect with `[]` runs only on unmount. The screen is still there, so the subscription is alive and reacts to the return."
      correct: [two]
    explanation:
      uk: "Це [[stale-closure|застаріле замикання]]: порожній масив залежностей заморозив `tasks` першого рендеру в обробнику. Виправлення — додати `tasks` і `today` у залежності (cleanup прибере стару підписку, setup створить нову зі свіжим знімком) або читати свіжі дані з місця, яке не залежить від рендеру. Перевірено в перегляді з імітованим `AppState` (`appStateSim.jsx`)."
      en: "This is a [[stale-closure]]: the empty dependency array froze the first render’s `tasks` inside the handler. The fix is to add `tasks` and `today` to the dependencies (the cleanup removes the old subscription, the setup makes a new one with a fresh snapshot) or to read fresh data from a place that does not depend on the render. Checked in the preview with the simulated `AppState` (`appStateSim.jsx`)."

  - id: run-the-three
    kind: example
    runtime: concept-preview
    dir: snippets
    entry: main.jsx
    strings:
      q1: { uk: "1. Бажання й перезапуск", en: "1. Wishes and a restart" }
      q2: { uk: "2. Звички: фокус і стек", en: "2. Habits: focus and the stack" }
      q4: { uk: "3. Планувальник і повернення у застосунок", en: "3. Planner and returning to the app" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      tech: { uk: "Техніка", en: "Tech" }
      home: { uk: "Дім", en: "Home" }
      books: { uk: "Книжки", en: "Books" }
      loading: { uk: "Завантаження…", en: "Loading…" }
      killed: { uk: "процес завершено, запуск знову", en: "process killed, starting again" }
      kill: { uk: "Імітувати перезапуск застосунку", en: "Simulate an app restart" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      due: { uk: "Справ на сьогодні:", en: "Tasks due today:" }
      addDue: { uk: "Додати справу на сьогодні", en: "Add a task due today" }
      newTask: { uk: "Нова справа", en: "New task" }
      simHeaderBack: { uk: "Назад", en: "Back" }
      simStack: { uk: "Стек (імітація)", en: "Stack (simulated)" }
      simHardwareBack: { uk: "Android: «Назад»", en: "Android: Back" }
      simSwipeBack: { uk: "iOS: свайп назад", en: "iOS: swipe back" }
      simAppState: { uk: "Стан застосунку (імітація)", en: "App state (simulated)" }
      simLeaveIos: { uk: "iOS: піти із застосунку", en: "iOS: leave the app" }
      simLeaveAndroid: { uk: "Android: піти із застосунку", en: "Android: leave the app" }
      simReturn: { uk: "Повернутися", en: "Come back" }
    title:
      uk: "Перевір три відповіді в перегляді"
      en: "Check three answers in the preview"
    body:
      uk: |
        Тут код трьох попередніх питань у перегляді react-native-web. Усе «пристроєве» в ньому — імітація, як і в попередніх розділах: `native-store.js` замінює асинхронне сховище (AsyncStorage), `navSim.jsx` — нативний стек React Navigation 7, `appStateSim.jsx` — `AppState` React Native. Код екранів — у `WishList.jsx`, `HabitScreens.jsx` і `PlannerHome.jsx`.

        Натисни **Запустити** й відтвори кожне питання, стежачи за **Консоллю**:

        1. Торкнися «Навушники», потім натисни «Імітувати перезапуск застосунку».
        2. Відкрий «Ранкова зарядка» й повернися «‹ Назад».
        3. Натисни «Додати справу на сьогодні», потім «Android: піти із застосунку» й «Повернутися».
      en: |
        Here is the code of the three previous questions in the react-native-web preview. Everything “device-like” in it is simulated, as in the earlier units: `native-store.js` stands in for the async store (AsyncStorage), `navSim.jsx` for the React Navigation 7 native stack, `appStateSim.jsx` for React Native’s `AppState`. The screens’ code is in `WishList.jsx`, `HabitScreens.jsx` and `PlannerHome.jsx`.

        Press **Run** and replay each question while watching the **Console**:

        1. Tap “Headphones”, then press “Simulate an app restart”.
        2. Open “Morning exercise” and go “‹ Back”.
        3. Press “Add a task due today”, then “Android: leave the app” and “Come back”.
    tryIt:
      uk: |
        1. У `WishList.jsx` виправ `markAcquired`: обчисли новий масив один раз у змінну `next` і передай `next` і в `setWishes`, і в `setItem`. Запусти знову, торкнися «Настільна лампа» й «перезапусти»: тепер ✓ лишається.
        2. У `PlannerHome.jsx` заміни `[]` на `[tasks, today]`, запусти знову й повтори третій сценарій: після повернення консоль друкує `3`.
      en: |
        1. In `WishList.jsx` fix `markAcquired`: compute the new array once into a variable `next` and pass `next` both to `setWishes` and to `setItem`. Run again, tap “Desk lamp” and “restart”: now the ✓ stays.
        2. In `PlannerHome.jsx` replace `[]` with `[tasks, today]`, run again and repeat the third scenario: after returning the console prints `3`.
    limits:
      uk: "Перегляд у браузері через react-native-web, а не нативний застосунок. «Перезапуск» лише демонтує й заново монтує React-дерево, а «сховище» живе в пам’яті сторінки; стек і стан застосунку імітовано кнопками. Справжні перезапуск, фон і нативне сховище перевіряють на заявленій цілі в контрольній точці."
      en: "A browser preview through react-native-web, not a native app. The “restart” only unmounts and mounts the React tree again, and the “store” lives in the page’s memory; the stack and the app state are simulated with buttons. The real restart, background and native storage are checked on the declared target at the checkpoint."

  - id: total-without-return
    kind: prediction
    prompt:
      uk: "Що надрукує цей підсумок витрат без розваг?"
      en: "What does this total of expenses without fun print?"
    code: |
      const expenses = [
        { id: "e-01", amountMinor: 84550, category: "food" },
        { id: "e-03", amountMinor: 18000, category: "fun" },
        { id: "e-06", amountMinor: 21050, category: "food" },
      ];

      const total = expenses.reduce((sum, expense) => {
        if (expense.category === "fun") return sum;
        sum + expense.amountMinor;
      }, 0);

      console.log(total);
    verify:
      logs: ["undefined"]
    answer:
      type: choice
      options:
        - id: undefined
          text: { uk: "`undefined`", en: "`undefined`" }
        - id: sum
          text: { uk: "`105600`", en: "`105600`" }
          why:
            uk: "Вираз `sum + expense.amountMinor` обчислюється, але ніде не зберігається: callback без `return` повертає `undefined`, і саме це стає новим [[accumulator|акумулятором]]."
            en: "The expression `sum + expense.amountMinor` is computed but kept nowhere: a callback without `return` returns `undefined`, and that becomes the new [[accumulator]]."
        - id: nan
          text: { uk: "`NaN`", en: "`NaN`" }
          why:
            uk: "`NaN` дало б додавання з `undefined`, якби результат кудись записувався. Але останній виклик callback теж нічого не повертає, тож `reduce` віддає `undefined`."
            en: "Adding to `undefined` would give `NaN` if the result were kept anywhere. But the last call of the callback returns nothing either, so `reduce` gives `undefined`."
        - id: all
          text: { uk: "`123600`", en: "`123600`" }
          why:
            uk: "Гілка з `fun` повертає `sum` без додавання, тож 18000 не враховано б навіть у робочому коді. А тут і решта сум губиться без `return`."
            en: "The `fun` branch returns `sum` without adding, so 18000 would not be counted even in working code. And here the other amounts are lost too, with no `return`."
      correct: [undefined]
    explanation:
      uk: "`reduce` передає в наступний виклик те, що повернув попередній. Перший запис (`food`) нічого не повертає → акумулятор `undefined`; гілка `fun` повертає той самий `undefined`; останній запис знову нічого не повертає. Потрібен `return sum + expense.amountMinor;`. У проєкті витрат така помилка в `summarizeExpenses` дає `undefined` замість підсумку, а суми там — цілі числа в копійках, тому їх додають без округлень."
      en: "`reduce` passes the next call whatever the previous one returned. The first record (`food`) returns nothing → the accumulator is `undefined`; the `fun` branch returns that same `undefined`; the last record again returns nothing. It needs `return sum + expense.amountMinor;`. In the expense project this mistake in `summarizeExpenses` gives `undefined` instead of a total, and the amounts there are whole numbers of minor units, so they are added without rounding."

  - id: delayed-recall
    kind: review
    title:
      uk: "Пригадай без підказок"
      en: "Recall without hints"
    items:
      - id: double-then-add
        from: re-02-02-state-snapshots
        prompt:
          uk: "`count` у цьому рендері дорівнює `4`. Користувач торкається кнопки, і обробник виконує ці два рядки коду. Яке число покаже екран після цього? Впиши лише число."
          en: "`count` in this render is `4`. The user taps the button, and the handler runs these two lines of code. What number does the screen show afterwards? Type only the number."
        code: |
          setCount(count * 2);
          setCount(count + 1);
        lang: jsx
        runnable: false
        answer:
          type: text
          accept: ["5"]
          placeholder: { uk: "число", en: "a number" }
        explanation:
          uk: "Обидва виклики обчислено з того самого знімка `count = 4`: React ставить у чергу «зроби 8», а потім «зроби 5». Перемагає останнє значення — `5`."
          en: "Both calls are computed from the same snapshot `count = 4`: React queues “make it 8” and then “make it 5”. The last value wins — `5`."

      - id: cleanup-count
        from: re-03-03-dependencies-cleanup
        prompt:
          uk: "Компонент з ефектом із залежністю `[category]` змонтовано без StrictMode з `category = \"food\"`. Далі батько передає `\"fun\"`, потім знову `\"fun\"` (новий рендер із тим самим значенням), потім `\"home\"`, а потім компонент знімають з екрана. Скільки разів за весь цей час запуститься cleanup ефекту? Впиши лише число."
          en: "An effect with the dependency `[category]` is in a component mounted without StrictMode with `category = \"food\"`. Then the parent passes `\"fun\"`, then `\"fun\"` again (a new render with the same value), then `\"home\"`, and then the component is removed from the screen. How many times does the effect’s cleanup run over this whole time? Type only the number."
        answer:
          type: text
          accept: ["3"]
          placeholder: { uk: "число", en: "a number" }
        explanation:
          uk: "[[effect-cleanup|Cleanup]] запускається перед кожним повторним запуском ефекту і під час демонтування. Повтори: `food` → `fun` і `fun` → `home` (два), рендер із тим самим `fun` ефект не перезапускає, плюс демонтування — разом три."
          en: "The [[effect-cleanup|cleanup]] runs before every repeated run of the effect and on unmount. Repeats: `food` → `fun` and `fun` → `home` (two), the render with the same `fun` does not rerun the effect, plus the unmount — three in total."

      - id: empty-month
        from: js-05-04-reduce
        prompt:
          uk: "За місяць витрат ще немає. Що станеться, коли цей код виконається?"
          en: "There are no expenses for the month yet. What happens when this code runs?"
        code: |
          const monthExpenses = [];
          const total = monthExpenses.reduce((sum, expense) => sum + expense.amountMinor);
          console.log(total);
        verify:
          logs: []
          error: TypeError
        answer:
          type: choice
          options:
            - id: type-error
              text:
                uk: "Помилка `TypeError`: порожній масив і немає початкового значення"
                en: "A `TypeError`: an empty array and no initial value"
            - id: zero
              text: { uk: "Друкує `0`", en: "Prints `0`" }
              why:
                uk: "`0` з’явився б, якби його передали другим аргументом. Без [[initial-value|початкового значення]] `reduce` бере перший елемент як акумулятор, а в порожньому масиві його немає."
                en: "`0` would appear if it were passed as the second argument. Without an [[initial-value]] `reduce` takes the first element as the accumulator, and an empty array has none."
            - id: undefined
              text: { uk: "Друкує `undefined`", en: "Prints `undefined`" }
              why:
                uk: "`reduce` не повертає `undefined` для порожнього масиву без початкового значення — він кидає помилку, і `console.log` уже не виконується."
                en: "`reduce` does not return `undefined` for an empty array with no initial value — it throws, and the `console.log` never runs."
          correct: [type-error]
        explanation:
          uk: "Без початкового значення `reduce` на порожньому масиві кидає `TypeError: Reduce of empty array with no initial value`. Підсумок суми завжди починають із `0`: `reduce(…, 0)` — тоді порожній місяць дає `0`."
          en: "Without an initial value `reduce` on an empty array throws `TypeError: Reduce of empty array with no initial value`. A sum always starts from `0`: `reduce(…, 0)` — then an empty month gives `0`."

      - id: currency-binding
        from: js-03-05-closures
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          let currency = "UAH";
          const formatAmount = (amountMinor) => `${(amountMinor / 100).toFixed(2)} ${currency}`;
          currency = "EUR";
          console.log(formatAmount(1250));
        verify:
          logs: ["12.50 EUR"]
        answer:
          type: choice
          options:
            - id: eur
              text: { uk: "`12.50 EUR`", en: "`12.50 EUR`" }
            - id: uah
              text: { uk: "`12.50 UAH`", en: "`12.50 UAH`" }
              why:
                uk: "Функція не копіює значення `currency` в момент створення — вона пам’ятає саму змінну. На час виклику в змінній уже `\"EUR\"`."
                en: "The function does not copy the value of `currency` when it is created — it remembers the variable itself. By the time of the call the variable already holds `\"EUR\"`."
            - id: cents
              text: { uk: "`1250 EUR`", en: "`1250 EUR`" }
              why:
                uk: "`amountMinor / 100` переводить найменші одиниці (копійки, центи) в цілі, а `toFixed(2)` залишає два знаки після крапки."
                en: "`amountMinor / 100` turns minor units into whole units, and `toFixed(2)` keeps two digits after the point."
          correct: [eur]
        explanation:
          uk: "[[closure|Closure]] тримає зв’язок зі змінною, а не її копію. Тому в React обробник бачить «старе» значення не через копіювання, а тому, що кожен рендер створює **нову** змінну, а обробник пам’ятає змінну свого рендеру."
          en: "A [[closure]] keeps a link to the variable, not a copy of it. So in React a handler sees an “old” value not because of copying, but because every render creates a **new** variable, and the handler remembers the variable of its own render."

      - id: what-survives
        from: rn-05-05-restart-recovery-shared-models
        prompt:
          uk: "Система завершила процес застосунку, поки той був у фоні, і користувач запускає його знову. Що із цього буде на місці без жодного твого коду відновлення? Познач усе, що підходить."
          en: "The system killed the app’s process while it was in the background, and the user starts it again. Which of these are still there without any restore code of yours? Select all that apply."
        answer:
          type: multi
          options:
            - id: stored
              text:
                uk: "Значення, записане через `setItem` в асинхронне сховище"
                en: "A value written with `setItem` to the async store"
            - id: state
              text:
                uk: "Значення `useState` на екрані списку"
                en: "A `useState` value on the list screen"
              why:
                uk: "State живе в пам’яті процесу; [[process-death|завершення процесу]] стирає його разом з усім React-деревом."
                en: "State lives in the process’s memory; [[process-death]] wipes it together with the whole React tree."
            - id: draft
              text:
                uk: "Напівнабраний текст у `TextInput`"
                en: "Half-typed text in a `TextInput`"
              why:
                uk: "Текст поля — теж пам’ять процесу. Щоб чернетка вижила, її треба записувати в сховище й відновлювати під час запуску."
                en: "The field’s text is process memory too. For a draft to survive, it has to be written to storage and restored on launch."
            - id: stack
              text:
                uk: "Відкритий екран деталей у стеку навігації"
                en: "The open detail screen on the navigation stack"
              why:
                uk: "Стек теж живе в пам’яті. Без збереження стану навігації застосунок стартує з початкового екрана."
                en: "The stack lives in memory too. Without persisting the navigation state the app starts on its initial screen."
          correct: [stored]
        explanation:
          uk: "Після завершення процесу на місці лише те, що лежить на диску. Усе інше [[restore-on-launch|відновлюють під час запуску]] з диска. Перевірка перезапуску на CP-RN перевіряє саме це: кожна зміна, яку бачив користувач, мусить бути на диску до того, як процес зникне."
          en: "After the process is killed only what is on disk is still there. Everything else is [[restore-on-launch|restored on launch]] from disk. The CP-RN restart check tests exactly that: every change the user saw must be on disk before the process is gone."

  - id: six-checks
    kind: explanation
    title:
      uk: "Шість перевірок CP-RN: пройдено, провалено чи пропущено"
      en: "The six CP-RN checks: passed, failed or skipped"
    body:
      uk: |
        На CP-RN нова можливість проходить шість перевірок на заявленій цілі — на тій [[release-build|release-збірці]], яку ти зібрав у RN-11:

        | Перевірка | Що робиш на цілі |
        |---|---|
        | перезапуск | змінюєш дані, повністю закриваєш застосунок, відкриваєш знову — зміни на місці |
        | офлайн | без мережі змінюєш дані й перезапускаєш — зміни на місці, а екран чесно каже, що збережено лише на пристрої |
        | життєвий цикл | відправляєш застосунок у фон і назад, ідеш з екрана й повертаєшся — дані свіжі, жодних подвійних оновлень |
        | безпека | у коді, конфігурації й [[embedded-bundle\|вбудованому bundle]] немає секретів; токени лише в захищеному сховищі |
        | доступність | користуєшся можливістю зі screen reader: кожен елемент керування має назву й роль |
        | продуктивність | робиш одне [[release-profiling\|вимірювання на release-збірці]], не на debug |

        У кожної перевірки три можливі результати:

        - **пройдено** — ти виконав її на заявленій цілі й бачив очікуваний результат;
        - **провалено** — виконав і побачив інше. Це не пропуск: це дефект, який треба виправити й перевірити знову;
        - **пропущено** — перевірку не виконано: ціль її не підтримує (наприклад, iOS на комп’ютері з Windows) або ти не встиг. Пропуск записують явно, з причиною й тим, що потрібно, щоб повернутися. Пропуск ніколи не стає «пройдено» — навіть якщо код спільний для обох платформ.
      en: |
        At CP-RN the new feature goes through six checks on the declared target — on the [[release-build]] you made in RN-11:

        | Check | What you do on the target |
        |---|---|
        | restart | change data, close the app completely, open it again — the changes are there |
        | offline | change data with no network and restart — the changes are there, and the screen honestly says they are saved only on the device |
        | lifecycle | send the app to the background and back, leave a screen and return — fresh data, no doubled updates |
        | security | no secrets in the code, the configuration or the [[embedded-bundle\|embedded bundle]]; tokens only in secure storage |
        | accessibility | use the feature with a screen reader: every control has a name and a role |
        | performance | take one [[release-profiling\|measurement on the release build]], not on debug |

        Every check has three possible results:

        - **passed** — you performed it on the declared target and saw the expected result;
        - **failed** — you performed it and saw something else. That is not a skip: it is a defect to fix and check again;
        - **skipped** — the check was not performed: the target does not support it (for example iOS on a Windows computer) or you ran out of time. A skip is recorded explicitly, with the reason and what it takes to come back. A skip never becomes “passed” — not even when the code is shared by both platforms.

  - id: skip-or-fail
    kind: prediction
    prompt:
      uk: "Учень працює на Windows, заявлена ціль — Android-емулятор. Які із цих чотирьох ситуацій треба записати як **пропуск** (а не як «пройдено» чи «провалено»)? Познач усе, що підходить."
      en: "A learner works on Windows, and the declared target is an Android emulator. Which of these four situations must be recorded as a **skip** (rather than as “passed” or “failed”)? Select all that apply."
    answer:
      type: multi
      options:
        - id: ios-reader
          text:
            uk: "Перевірка з VoiceOver на iOS — запустити iOS-симулятор на Windows неможливо"
            en: "The VoiceOver check on iOS — an iOS simulator cannot run on Windows"
        - id: no-time
          text:
            uk: "Вимірювання продуктивності, яке учень не встиг зробити"
            en: "The performance measurement the learner did not get to"
        - id: restart-lost
          text:
            uk: "Перевірка перезапуску на емуляторі, після якої зміни зникли"
            en: "The restart check on the emulator after which the changes vanished"
          why:
            uk: "Перевірку виконано, і результат інший, ніж очікувано, — це **провал**. Його виправляють і перевіряють знову, а не ховають у пропусках."
            en: "The check was performed, and the result differs from the expected one — that is a **failure**. It is fixed and checked again, not hidden among skips."
        - id: offline-ok
          text:
            uk: "Перевірка офлайну на емуляторі, після якої зміни на місці"
            en: "The offline check on the emulator after which the changes are there"
          why:
            uk: "Виконано на заявленій цілі з очікуваним результатом — це **пройдено**."
            en: "Performed on the declared target with the expected result — that is **passed**."
      correct: [ios-reader, no-time]
    explanation:
      uk: "Пропуск — це **невиконана** перевірка: ціль недоступна або не дійшли руки. Провал — виконана перевірка з неправильним результатом. Обидва чесні записи, але означають різне: пропуск чекає на ціль чи час, провал — на виправлення."
      en: "A skip is an **unperformed** check: the target is unavailable or you did not get to it. A failure is a performed check with the wrong result. Both are honest records, but they mean different things: a skip waits for a target or time, a failure waits for a fix."

  - id: what-to-reread
    kind: explanation
    title:
      uk: "Що перечитати"
      en: "What to reread"
    body:
      uk: |
        Познач питання, де ти помилився або вгадав. Ось куди повернутися:

        | Питання про… | Урок |
        |---|---|
        | позначку, що зникла після перезапуску; `count * 2` | «Стан — це знімок кожного рендеру» (RE-02) |
        | екран під екраном деталей | «Фокус екрана проти монтування» (RN-04) |
        | обробник `AppState` зі старими справами; cleanup за зміни `category` | «Залежності та cleanup» (RE-03), «Прибираємо підписки» (RN-04) |
        | `reduce` без `return`; порожній місяць | «reduce: згортаємо список в одне значення» (JS-05) |
        | валюту, змінену після створення функції | «Closures: функції пам’ятають, де народилися» (JS-03) |
        | що переживає завершення процесу | «Перезапуск, відновлення та спільні TS-моделі» (RN-05) |

        На CP-RN тобі знадобляться передусім перші три рядки: саме вони відповідають за перевірки перезапуску й життєвого циклу.
      en: |
        Mark the questions where you made a mistake or guessed. Here is where to go back:

        | Question about… | Lesson |
        |---|---|
        | the mark lost after a restart; `count * 2` | “State is a snapshot per render” (RE-02) |
        | the screen under the detail screen | “Screen focus vs mount” (RN-04) |
        | the `AppState` handler with old tasks; the cleanup on `category` changes | “Dependencies and cleanup” (RE-03), “Subscription cleanup” (RN-04) |
        | `reduce` without `return`; the empty month | “reduce: fold a list into one value” (JS-05) |
        | the currency changed after the function was created | “Closures: functions remember their birthplace” (JS-03) |
        | what survives a killed process | “Restart, recovery and shared TS models” (RN-05) |

        At CP-RN you will need the first three rows most: they are what the restart and lifecycle checks depend on.
