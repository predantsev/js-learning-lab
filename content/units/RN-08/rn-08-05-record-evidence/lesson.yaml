id: rn-08-05-record-evidence
unit: RN-08
title:
  uk: "Фіксуємо докази й пропуски"
  en: "Record evidence and skips"
kind: local-task
minutes: 15
contentVersion: 1
purpose:
  uk: "Останній крок CP-RN — записати, що саме ти перевірив, на якій збірці й на якій цілі, а що лишилося невиконаним. Ти зчитаєш id, версію й відбиток підпису своєї release-збірки з git і із самого артефакту, а потім без шаблону напишеш набір доказів CP-RN: запис для кожної перевірки й записи пропуску для всього, що не виконано. Саме за цим набором інша людина — чи ти сам через місяць — зможе повторити кожну перевірку."
  en: "The last step of CP-RN is to record what exactly you checked, on which build and on which target, and what stayed unperformed. You read the id, version and signing fingerprint of your release build from git and from the artifact itself, and then, without a template, you write the CP-RN evidence set: a record for every check and skip records for everything not performed. With this set another person — or you a month later — can repeat every check."
objectives:
  - uk: "Записати докази контрольної точки з походженням збірки (id, версія, відбиток підпису, ціль) і явним записом пропуску, до якого можна повернутися, для кожної непідтримуваної цілі чи невиконаної перевірки."
    en: "Record the checkpoint’s evidence with build provenance (id, version, signature fingerprint, target) and an explicit, revisitable skip record for every unsupported target or unperformed check."
prerequisites: [rn-08-04-debug-seeded-native-regression, rn-08-02-provenance-unsupported-targets]
subskills:
  - { family: N-12, skill: "signed/build provenance", depth: assess }
  - { family: N-12, skill: "unsupported target and skip evidence", depth: assess }
glossary: []
selfCheck: [dirty-tree, after-rebuild]

blocks:
  - id: three-sources
    kind: explanation
    title:
      uk: "Доказ прив’язаний до збірки"
      en: "Evidence is tied to a build"
    body:
      uk: |
        Запис доказу стверджує: «на **цій** збірці, на **цій** цілі я зробив ось це й побачив ось що». Тому поля збірки беруть не з пам’яті й не з конфігурації, а з трьох джерел, які не можуть розійтися з тим, що встановлено:

        | Поле | Звідки | Чому саме звідти |
        |---|---|---|
        | id збірки | `git rev-parse --short HEAD` за **чистого** робочого дерева | commit точно називає код, з якого зібрано |
        | версія | сам артефакт (`.apk` чи `.app`) | конфігурація каже, що ти **хотів** зібрати; артефакт — що зібрано |
        | відбиток підпису | підпис артефакту | інший ключ — інший відбиток, навіть для того самого коду |
        | ціль | налаштування самої цілі | версія ОС — та, на якій ти справді перевіряв |

        Якщо якесь поле прочитати не вдається, його не вигадують: пишуть, чого бракує й чому. Це теж чесний запис.
      en: |
        An evidence record claims: “on **this** build, on **this** target I did this and saw that”. So the build fields are taken not from memory and not from the configuration, but from three sources that cannot drift away from what is installed:

        | Field | From where | Why from there |
        |---|---|---|
        | build id | `git rev-parse --short HEAD` with a **clean** working tree | a commit names exactly the code it was built from |
        | version | the artifact itself (`.apk` or `.app`) | the configuration says what you **meant** to build; the artifact says what was built |
        | signing fingerprint | the artifact’s signature | a different key gives a different fingerprint, even for the same code |
        | target | the target’s own settings | the OS version is the one you really checked on |

        If a field cannot be read, it is not invented: you write what is missing and why. That is an honest record too.

  - id: dirty-tree
    kind: prediction
    prompt:
      uk: "Ти зібрав release, коли `git status --short` показував ` M src/WeekScreen.tsx` (змінений файл без commit). `git rev-parse --short HEAD` дає `a41c9e2`. Чи можна записати `a41c9e2` як id цієї збірки?"
      en: "You built the release while `git status --short` showed ` M src/WeekScreen.tsx` (a changed file with no commit). `git rev-parse --short HEAD` gives `a41c9e2`. Can you record `a41c9e2` as this build’s id?"
    answer:
      type: choice
      options:
        - id: no
          text:
            uk: "Ні: збірка містить зміни, яких у `a41c9e2` немає. Зроби commit, збери знову й перевір на новій збірці"
            en: "No: the build contains changes that are not in `a41c9e2`. Commit, build again and check on the new build"
        - id: yes
          text:
            uk: "Так: `HEAD` — це поточний commit, а отже й поточна збірка"
            en: "Yes: `HEAD` is the current commit, and so the current build"
          why:
            uk: "`HEAD` — останній commit, а збірка взяла файли з робочого дерева, разом зі зміненим `WeekScreen.tsx`. Хтось, хто збере `a41c9e2`, отримає інший застосунок."
            en: "`HEAD` is the last commit, while the build took the files from the working tree, including the changed `WeekScreen.tsx`. Someone who builds `a41c9e2` gets a different app."
        - id: with-note
          text:
            uk: "Так, якщо дописати в запис «плюс незакомічені зміни»"
            en: "Yes, if the record adds “plus uncommitted changes”"
          why:
            uk: "Чесно, але не повторювано: незакомічених змін ніхто, крім тебе, не має, і через тиждень їх може не бути й у тебе. Id має вказувати на код, який можна отримати знову."
            en: "Honest, but not repeatable: nobody but you has the uncommitted changes, and in a week you may not have them either. An id must point to code that can be obtained again."
      correct: [no]
    explanation:
      uk: "Id збірки чогось вартий, лише коли робоче дерево було чистим: тоді commit і збірка — один і той самий код. Тому перед release-збіркою спершу `git status --short` (порожньо), потім збірка, потім `git rev-parse --short HEAD`."
      en: "A build id is worth something only when the working tree was clean: then the commit and the build are the same code. So before a release build: first `git status --short` (empty), then the build, then `git rev-parse --short HEAD`."

  - id: after-rebuild
    kind: prediction
    prompt:
      uk: "Ти записав шість перевірок для збірки `1.1.0 (3)`. Потім виправив одне слово в підписі кнопки, зробив commit і зібрав `1.1.0 (4)` — саме її віддаватимеш користувачам. Скільки із шести записів є доказами для `1.1.0 (4)`?"
      en: "You recorded six checks for build `1.1.0 (3)`. Then you fixed one word in a button label, committed and built `1.1.0 (4)` — that is the one you will give to users. How many of the six records are evidence for `1.1.0 (4)`?"
    answer:
      type: choice
      options:
        - id: none
          text:
            uk: "Жодного: кожен запис називає збірку `(3)`"
            en: "None: every record names build `(3)`"
        - id: five
          text:
            uk: "П’ять: змінився лише екран із кнопкою, тож переробити треба тільки перевірку доступності"
            en: "Five: only the screen with the button changed, so only the accessibility check needs redoing"
          why:
            uk: "Звучить розумно, але записи все одно називають `(3)`. Ти **припускаєш**, що зміна нічого більше не зачепила, — а доказ якраз і потрібен замість припущення."
            en: "It sounds reasonable, but the records still name `(3)`. You **assume** the change touched nothing else — and evidence is exactly what replaces an assumption."
        - id: six
          text:
            uk: "Усі шість: одне слово не змінює поведінки"
            en: "All six: one word does not change behavior"
          why:
            uk: "Нова збірка — новий артефакт: інший id, інша версія. Записи для `(3)` лишаються правдою про `(3)`, але про `(4)` нічого не кажуть."
            en: "A new build is a new artifact: a different id, a different version. The records for `(3)` stay true about `(3)`, but say nothing about `(4)`."
      correct: [none]
    explanation:
      uk: "Запис доказу — правда про одну збірку. Для збірки, яку віддаєш, перевірки повторюють на ній: шість перевірок CP-RN — це хвилини, а не дні. Старі записи не видаляють: вони лишаються історією збірки `(3)`."
      en: "An evidence record is the truth about one build. For the build you ship, the checks are repeated on it: the six CP-RN checks take minutes, not days. The old records are not deleted: they stay as the history of build `(3)`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: own-row
        from: re-08-02-what-the-checkpoint-checks
        prompt:
          uk: "Unit-тести `summarizeHabit` проходять на твоєму комп’ютері. Який рядок CP-RN — перезапуск, офлайн, життєвий цикл, безпека, доступність чи продуктивність — вони закривають?"
          en: "The unit tests of `summarizeHabit` pass on your computer. Which CP-RN row — restart, offline, lifecycle, security, accessibility or performance — do they close?"
        answer:
          type: choice
          options:
            - id: none
              text:
                uk: "Жодного: кожен рядок закривається своїм доказом на заявленій цілі"
                en: "None: every row is closed by its own evidence on the declared target"
            - id: restart
              text:
                uk: "Перезапуск: функція правильно рахує збережені звички"
                en: "Restart: the function counts the saved habits correctly"
              why:
                uk: "Тест доводить, що функція рахує правильно. Чи збереглися звички після справжнього перезапуску, він не перевіряє: там сховище, процес і пристрій."
                en: "The test proves the function counts correctly. Whether the habits survived a real restart it does not check: that involves the store, the process and the device."
            - id: all
              text:
                uk: "Усі шість: без правильної логіки жоден рядок не пройде"
                en: "All six: without correct logic no row passes"
              why:
                uk: "Правильна логіка потрібна, але недостатня. Як і на CP-RE, один доказ не закриває чужого рядка."
                en: "Correct logic is necessary but not enough. As at CP-RE, one piece of evidence does not close another row."
          correct: [none]
        explanation:
          uk: "Як у [[checkpoint-rubric|рубриці]] CP-RE: зелені тести не кажуть нічого про типи, так і тут вони не кажуть нічого про перезапуск на пристрої. Тести — окремий, корисний доказ, але рядки CP-RN закриває перевірка на цілі."
          en: "As in the CP-RE [[checkpoint-rubric]]: green tests say nothing about types, and here they say nothing about a restart on a device. Tests are separate, useful evidence, but the CP-RN rows are closed by a check on the target."

      - id: supplied-not-mine
        from: rn-08-02-provenance-unsupported-targets
        prompt:
          uk: "Однокурсник із Mac зібрав твій проєкт із твого commit і надіслав запис екрана: iPhone-симулятор, VoiceOver читає всі підписи. Як записати це у твоєму наборі доказів?"
          en: "A classmate with a Mac built your project from your commit and sent you a screen recording: an iPhone simulator, VoiceOver reads every label. How do you record this in your evidence set?"
        answer:
          type: choice
          options:
            - id: supplied
              text:
                uk: "Як наданий доказ (`supplied`) поруч із твоїм записом пропуску для iOS — пропуск лишається"
                en: "As supplied evidence (`supplied`) next to your iOS skip record — the skip stays"
            - id: passed
              text:
                uk: "Як пройдену перевірку доступності на iOS"
                en: "As a passed accessibility check on iOS"
              why:
                uk: "Перевіряв не ти й не на твоїй заявленій цілі. Наданий доказ корисний як довідка, але твоїм проходженням не стає."
                en: "You did not check it, and not on your declared target. Supplied evidence is useful information but does not become your pass."
            - id: ignore
              text:
                uk: "Ніяк: чужі докази в наборі не потрібні"
                en: "Not at all: other people’s evidence does not belong in the set"
              why:
                uk: "Його варто зберегти — він каже щось про iOS, чого ти сам не бачив. Головне — чесно позначити походження."
                en: "It is worth keeping — it says something about iOS you have not seen yourself. What matters is to mark the provenance honestly."
          correct: [supplied]
        explanation:
          uk: "Наданий доказ записують з його походженням (`supplied`), хто й на якій збірці його зробив. Твій запис пропуску для iOS лишається: перевірки на iOS ти не виконував."
          en: "Supplied evidence is recorded with its provenance (`supplied`), who made it and on which build. Your iOS skip record stays: you did not perform the iOS check."

  - id: read-provenance
    kind: local-task
    runtime: local-native
    title:
      uk: "Зчитай походження своєї release-збірки"
      en: "Read the provenance of your release build"
    intro:
      uk: |
        Тобі потрібна release-збірка твого нативного проєкту, яку ти встановив на заявлену ціль на CP-RN (як у RN-11), і термінал у теці цього проєкту — там, де лежить його `app.json`. Шляхи до артефактів нижче — типові для `npx expo run:android --variant release` (APK) і для `.app`, який збирає Xcode; якщо твоя збірка лежить деінде, підстав свій шлях.

        > [!warning]
        > Цю частину описано за документацією **Expo SDK 57**, **React Native 0.86**, Android (`apksigner`, `aapt2`) і Apple (`codesign`, `plutil`). Під час підготовки уроку запускали лише `codesign -dvvv` і `plutil -p` на системних файлах macOS 26: вони друкують рядки `CDHash=…`, `Authority=…` (або `Signature=adhoc` для підпису без сертифіката) і пари `"CFBundleShortVersionString" => …`. Решту команд не запускали: нативних інструментів не було. Записуй те, що бачиш сам.

        Якщо release-збірки чи цілі в тебе немає, натисни **«У мене немає емулятора чи пристрою»**: завдання запишеться як невиконане, а в наступному завданні ти запишеш це як пропуски.

        **Збери все в один чернетковий файл** `provenance.txt` у корені проєкту: кожен крок нижче додає туди рядок. Наприкінці ці рядки підуть у записи доказів.
      en: |
        You need the release build of your native project that you installed on your declared target at CP-RN (as in RN-11), and a terminal in that project’s folder — where its `app.json` lies. The artifact paths below are the usual ones for `npx expo run:android --variant release` (an APK) and for the `.app` that Xcode builds; if your build lies elsewhere, use your path.

        > [!warning]
        > This part is described from the documentation of **Expo SDK 57**, **React Native 0.86**, Android (`apksigner`, `aapt2`) and Apple (`codesign`, `plutil`). While preparing the lesson only `codesign -dvvv` and `plutil -p` were run, on macOS 26 system files: they print the lines `CDHash=…`, `Authority=…` (or `Signature=adhoc` for a signature without a certificate) and pairs like `"CFBundleShortVersionString" => …`. The other commands were not run: there were no native tools. Record what you see yourself.

        If you have no release build or no target, press **“I have no emulator or device”**: the task is recorded as not performed, and in the next task you record that as skips.

        **Collect everything in one scratch file** `provenance.txt` in the project root: each step below adds a line to it. At the end these lines go into the evidence records.
    tools:
      - name: "Git"
        note:
          uk: "Для id збірки."
          en: "For the build id."
      - name: "Android SDK Build-Tools"
        note:
          uk: "Лише для Android: `apksigner` і `aapt2` лежать у `$ANDROID_HOME/build-tools/<версія>/`; на Windows — `apksigner.bat` і `aapt2.exe`."
          en: "Android only: `apksigner` and `aapt2` live in `$ANDROID_HOME/build-tools/<version>/`; on Windows they are `apksigner.bat` and `aapt2.exe`."
      - name: "Xcode"
        version: "26.4 or newer"
        note:
          uk: "Лише для iOS і лише в macOS: `codesign` і `plutil` уже є в системі."
          en: "iOS only, and only on macOS: `codesign` and `plutil` are already part of the system."
    steps:
      - text:
          uk: "Переконайся, що робоче дерево чисте, і зчитай commit, з якого зібрано release. Якщо `git status --short` щось друкує, зроби commit і збери release знову — інакше id нічого не означає."
          en: "Make sure the working tree is clean and read the commit the release was built from. If `git status --short` prints anything, commit and build the release again — otherwise the id means nothing."
        command: "git status --short\ngit rev-parse --short HEAD"
        expect:
          uk: "Перша команда не друкує нічого, друга — короткий id commit (сім символів, наприклад `a41c9e2`). Допиши його в `provenance.txt`."
          en: "The first command prints nothing, the second a short commit id (seven characters, for example `a41c9e2`). Add it to `provenance.txt`."
      - text:
          uk: "Android: знайди версію build-tools і прочитай версію із самого APK. Підстав замість `36.0.0` назву теки, яку показала перша команда."
          en: "Android: find the build-tools version and read the version from the APK itself. Put the folder name the first command showed in place of `36.0.0`."
        command: "ls \"$ANDROID_HOME/build-tools\"\n\"$ANDROID_HOME/build-tools/36.0.0/aapt2\" dump badging android/app/build/outputs/apk/release/app-release.apk | head -n 1"
        expect:
          uk: "Рядок, що починається з `package:` і містить `name='…'`, `versionCode='…'` і `versionName='…'`. Це id застосунку й версія — допиши їх у `provenance.txt` і порівняй із `app.json`."
          en: "A line starting with `package:` that contains `name='…'`, `versionCode='…'` and `versionName='…'`. These are the app id and the version — add them to `provenance.txt` and compare them with `app.json`."
      - text:
          uk: "Android: прочитай сертифікат, яким підписано APK."
          en: "Android: read the certificate the APK is signed with."
        command: "\"$ANDROID_HOME/build-tools/36.0.0/apksigner\" verify --print-certs android/app/build/outputs/apk/release/app-release.apk"
        expect:
          uk: "Рядки `Signer #1 certificate …`; рядок із `SHA-256 digest` — відбиток. Скопіюй його повністю. Якщо це відбиток debug-ключа (той самий, що в debug-збірки), твій release підписано не release-ключем з RN-11 — запиши це як провал, а не як доказ."
          en: "Lines `Signer #1 certificate …`; the line with `SHA-256 digest` is the fingerprint. Copy it whole. If it is the debug key’s fingerprint (the same as the debug build’s), your release is not signed with the RN-11 release key — record that as a failure, not as evidence."
      - text:
          uk: "iOS (лише macOS): прочитай версію й підпис зібраного `.app`. Підстав шлях до свого `.app` замість `ReleaseApp.app`."
          en: "iOS (macOS only): read the version and the signature of the built `.app`. Put the path to your `.app` in place of `ReleaseApp.app`."
        command: "plutil -p ReleaseApp.app/Info.plist | grep -E \"CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion\\\"\"\ncodesign -dvvv ReleaseApp.app 2>&1 | grep -E \"^(CDHash|Authority|Signature|TeamIdentifier)\""
        expect:
          uk: "Ідентифікатор bundle, marketing version і build number; потім `CDHash=…` і або рядки `Authority=…` (сертифікат підпису), або `Signature=adhoc` (збірку підписано без сертифіката, як буває для симулятора). Скопіюй ці рядки дослівно, хоч би що там було."
          en: "The bundle identifier, the marketing version and the build number; then `CDHash=…` and either `Authority=…` lines (the signing certificate) or `Signature=adhoc` (the build is signed without a certificate, as happens for a simulator). Copy these lines word for word, whatever they say."
      - text:
          uk: "Запиши ціль: тип (емулятор, симулятор чи телефон), назву й версію ОС — з налаштувань самої цілі (на Android зазвичай це розділ About phone чи About emulated device, на iOS — General → About; назви пунктів залежать від мови системи). Порівняй із тим, що заявив у RN-01."
          en: "Record the target: the type (emulator, simulator or phone), the name and the OS version — from the target’s own settings (on Android usually the About phone or About emulated device section, on iOS General → About; the item names depend on the system language). Compare it with what you declared in RN-01."
        expect:
          uk: "У `provenance.txt` є id commit, версія з артефакту, відбиток підпису й ціль — або для кожного поля, яке не вдалося прочитати, пояснення, чого бракує."
          en: "`provenance.txt` holds the commit id, the version from the artifact, the signing fingerprint and the target — or, for every field that could not be read, an explanation of what is missing."
    verify:
      - id: clean-id
        text:
          uk: "Я зчитав id commit за чистого робочого дерева."
          en: "I read the commit id with a clean working tree."
      - id: artifact-fields
        text:
          uk: "Версію й відбиток підпису я взяв із самого артефакту, а не з `app.json`, і вони збігаються з тим, що я збирався зібрати (або я записав розбіжність)."
          en: "I took the version and the signing fingerprint from the artifact itself, not from `app.json`, and they match what I meant to build (or I recorded the mismatch)."
      - id: target-read
        text:
          uk: "Тип, назву й версію ОС цілі я взяв із налаштувань самої цілі."
          en: "I took the target’s type, name and OS version from the target’s own settings."
    troubleshooting:
      - problem:
          uk: "`ls \"$ANDROID_HOME/build-tools\"` каже, що теки немає."
          en: "`ls \"$ANDROID_HOME/build-tools\"` says there is no such folder."
        fix:
          uk: "Змінна `ANDROID_HOME` не задана в цьому терміналі. Відкрий новий термінал або виконай `source` для файла профілю, як у RN-01, і перевір `echo $ANDROID_HOME`."
          en: "The `ANDROID_HOME` variable is not set in this terminal. Open a new terminal or `source` your profile file as in RN-01, and check `echo $ANDROID_HOME`."
      - problem:
          uk: "Файла `app-release.apk` за цим шляхом немає."
          en: "There is no `app-release.apk` at this path."
        fix:
          uk: "Release зібрано інакше (наприклад, як `.aab`) або в іншу теку. Знайди артефакт, який ти справді встановив на ціль, і використай його шлях; якщо встановлено не APK, а щось інше, запиши в `provenance.txt`, звідки й чим ти прочитав поля."
          en: "The release was built differently (for example as an `.aab`) or into another folder. Find the artifact you actually installed on the target and use its path; if what you installed is not an APK, write in `provenance.txt` where and with what you read the fields."
    recovery:
      uk: "Ці кроки лише читають: жодна команда тут не змінює ні проєкту, ні збірки. `provenance.txt` — чернетка; якщо щось пішло не так, видали її й пройди кроки знову."
      en: "These steps only read: no command here changes the project or the build. `provenance.txt` is a draft; if something went wrong, delete it and go through the steps again."

  - id: evidence-set
    kind: local-task
    runtime: local-native
    title:
      uk: "Самостійно: набір доказів CP-RN"
      en: "Independent: the CP-RN evidence set"
    intro:
      uk: |
        Тепер без шаблону й без підказок напиши у файлі `EVIDENCE.md` у корені свого нативного проєкту набір доказів CP-RN. Форму запису обираєш сам — список, таблиця, розділи. Набір має відповідати на все, що потрібно іншій людині, щоб повторити кожну перевірку й зрозуміти, чого не перевірено:

        - кожна із шести перевірок CP-RN (перезапуск, офлайн, життєвий цикл, безпека, доступність, продуктивність) на заявленій цілі має **свій** запис: виконаний — з усіма полями з уроку про походження доказів і полями збірки з `provenance.txt`, або пропуск;
        - для іншої платформи, яку твій комп’ютер не підтримує, і для кожної перевірки, яку ти не виконав, є **запис пропуску**: що, на якій цілі, чому й що потрібно, щоб повернутися;
        - провал записано як провал, а не як пропуск і не як «пройдено»;
        - наданий кимось доказ, якщо він є, позначено як наданий.

        Немає нативних інструментів? Набір однаково пишеться: шість записів пропуску для заявленої цілі й записи пропуску для іншої платформи — з причиною й планом повернення. Після цього натисни **«У мене немає емулятора чи пристрою»**: жодної перевірки не виконано, тож завдання лишиться невиконаним, але твій набір чесно це показує.

        Цю частину описано за документацією **Expo SDK 57** і **React Native 0.86**; виводу тут немає, бо записуєш ти сам.
      en: |
        Now, without a template and without hints, write the CP-RN evidence set in the file `EVIDENCE.md` in your native project’s root. You choose the record format yourself — a list, a table, sections. The set must answer everything another person needs to repeat every check and to understand what was not checked:

        - each of the six CP-RN checks (restart, offline, lifecycle, security, accessibility, performance) on the declared target has **its own** record: performed — with every field from the lesson on provenance and the build fields from `provenance.txt` — or a skip;
        - for the other platform your computer does not support, and for every check you did not perform, there is a **skip record**: what, on which target, why and what it takes to come back;
        - a failure is recorded as a failure, not as a skip and not as “passed”;
        - evidence supplied by someone else, if there is any, is marked as supplied.

        No native tooling? The set is written all the same: six skip records for the declared target and skip records for the other platform — with a reason and a way back. Then press **“I have no emulator or device”**: no check was performed, so the task stays not performed, but your set shows that honestly.

        This part is described from the documentation of **Expo SDK 57** and **React Native 0.86**; there is no output here, because you write the records yourself.
    tools:
      - name: "Git"
        note:
          uk: "Для commit набору доказів."
          en: "To commit the evidence set."
      - name: "VS Code"
        note:
          uk: "Або будь-який редактор тексту для `EVIDENCE.md`."
          en: "Or any text editor for `EVIDENCE.md`."
    steps:
      - text:
          uk: "Напиши `EVIDENCE.md` за вимогами вище."
          en: "Write `EVIDENCE.md` to the requirements above."
        expect:
          uk: "Шість записів для заявленої цілі й записи пропуску для іншої платформи; кожне поле збірки збігається з `provenance.txt`."
          en: "Six records for the declared target and skip records for the other platform; every build field matches `provenance.txt`."
      - text:
          uk: "Перечитай набір очима людини, яка не бачила твого екрана: чи зможе вона повторити кожну перевірку на тій самій збірці? Допиши, чого бракує."
          en: "Reread the set through the eyes of a person who has not seen your screen: could they repeat every check on the same build? Add whatever is missing."
        expect:
          uk: "Кожен виконаний запис називає збірку, ціль, дії й побачене; кожен пропуск — причину й план повернення."
          en: "Every performed record names the build, the target, the procedure and what was seen; every skip names the reason and the way back."
      - text:
          uk: "Зафіксуй набір доказів окремим commit. `provenance.txt` — чернетка: видали її або не додавай у commit."
          en: "Commit the evidence set on its own. `provenance.txt` is a draft: delete it or leave it out of the commit."
        command: "git add EVIDENCE.md\ngit commit -m \"Record the CP-RN evidence and skips\""
        expect:
          uk: "Commit створено, і в ньому лише `EVIDENCE.md`."
          en: "The commit is created, and it holds only `EVIDENCE.md`."
    verify:
      - id: six-records
        text:
          uk: "Кожна із шести перевірок на заявленій цілі має власний запис — виконаний з усіма полями чи пропуск."
          en: "Each of the six checks on the declared target has its own record — performed with every field, or a skip."
      - id: skips-revisitable
        text:
          uk: "Кожна невиконана перевірка й непідтримувана ціль має запис пропуску з причиною й планом повернення, і жоден пропуск не заявляє результату."
          en: "Every unperformed check and unsupported target has a skip record with a reason and a way back, and no skip claims a result."
      - id: build-matches
        text:
          uk: "Поля збірки у виконаних записах збігаються з тим, що я зчитав із git і з артефакту."
          en: "The build fields in the performed records match what I read from git and from the artifact."
      - id: committed
        text:
          uk: "`EVIDENCE.md` зафіксовано окремим commit."
          en: "`EVIDENCE.md` is committed on its own."
    troubleshooting:
      - problem:
          uk: "Під час запису виявилося, що одну перевірку ти робив на debug-збірці."
          en: "While writing, it turned out you did one check on the debug build."
        fix:
          uk: "Такий запис не доказ для release. Повтори перевірку на release-збірці й запиши результат; якщо зараз не можеш — запиши пропуск із причиною «перевірено лише на debug-збірці»."
          en: "Such a record is not evidence for the release. Repeat the check on the release build and record the result; if you cannot now, record a skip with the reason “checked only on the debug build”."
    recovery:
      uk: "`EVIDENCE.md` — звичайний текстовий файл у git: `git diff EVIDENCE.md` покаже, що змінилося від останнього commit, а `git restore EVIDENCE.md` поверне зафіксовану версію."
      en: "`EVIDENCE.md` is an ordinary text file in git: `git diff EVIDENCE.md` shows what changed since the last commit, and `git restore EVIDENCE.md` brings back the committed version."
