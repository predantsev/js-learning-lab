id: rn-08-02-provenance-unsupported-targets
unit: RN-08
title:
  uk: "Походження доказів і непідтримувані цілі"
  en: "Provenance and unsupported targets"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Розрізнити докази, зроблені самостійно, з допомогою, надані іншими й пропущені, і пояснити, чому пропущена нативна перевірка ніколи не зараховується як пройдена."
    en: "Classify evidence as learner-authored, assisted, supplied or skipped, and explain why a skipped native check never counts as a pass."
  - uk: "Написати запис доказу для однієї перевірки: перевірка, id і версія збірки, відбиток підпису, що зроблено, що побачено, ціль і походження."
    en: "Write an evidence record for one check: the check, build id and version, signature fingerprint, procedure, observed output, target and provenance."
  - uk: "Окреслити самостійне вдосконалення, яке вміщується в 60 хвилин, і назвати перевірки, які воно має пройти."
    en: "Scope an independent enhancement that fits a 60-minute session and name the checks it must pass."
prerequisites: [rn-08-01-checkpoint-review, rn-07-05-e2e-platform-deployment-concepts]
subskills:
  - { family: N-12, skill: "signed/build provenance", depth: intro }
  - { family: N-12, skill: "independent native enhancement", depth: intro }
glossary: [build-provenance, skip-record]
selfCheck: [five-records, habit-records]

blocks:
  - id: what-a-record-holds
    kind: explanation
    title:
      uk: "Платформа не бачить твого емулятора"
      en: "The platform does not see your emulator"
    body:
      uk: |
        Перевірки CP-RN ти робиш на своїй заявленій цілі, і платформа їх не бачить. Вона бачить лише твій **запис доказу**. Хороший запис відповідає на сім питань:

        - **яка перевірка** — перезапуск, офлайн, життєвий цикл, безпека, доступність чи продуктивність;
        - **на якій цілі** — тип, назва й версія ОС;
        - **на якій збірці** — id (commit, з якого її зібрано), версія (`versionName` і `versionCode` на Android, marketing version і build number на iOS — ті самі поля, що в RN-11) і відбиток сертифіката підпису: SHA-256 сертифіката, яким підписано збірку. Інший ключ — інший відбиток, навіть для того самого commit;
        - **що ти зробив** і **що побачив** — словами, а не лише знімком екрана;
        - **результат** — `pass` чи `fail`;
        - **чия це робота** — походження.

        Ці відповіді разом — [[build-provenance|походження збірки й доказу]]: за ними інша людина може повторити перевірку на тій самій збірці.
      en: |
        You do the CP-RN checks on your declared target, and the platform does not see them. All it sees is your **evidence record**. A good record answers seven questions:

        - **which check** — restart, offline, lifecycle, security, accessibility or performance;
        - **on which target** — type, name and OS version;
        - **on which build** — the id (the commit it was built from), the version (`versionName` and `versionCode` on Android, the marketing version and build number on iOS — the same fields as in RN-11) and the signing certificate fingerprint: the SHA-256 of the certificate that signed the build. A different key gives a different fingerprint, even for the same commit;
        - **what you did** and **what you saw** — in words, not just a screenshot;
        - **the outcome** — `pass` or `fail`;
        - **whose work it is** — the provenance.

        Together these answers are the [[build-provenance]]: with them another person can repeat the check on the same build.

  - id: four-provenances
    kind: explanation
    title:
      uk: "Чотири походження"
      en: "Four provenances"
    body:
      uk: |
        | Походження | Що означає | Чи це твоє проходження |
        |---|---|---|
        | `learner-authored` | ти виконав перевірку сам | так |
        | `assisted` | ти виконав її з підказкою чи після перегляду розв’язку | так, із позначкою «з допомогою» |
        | `supplied` | доказ дав хтось інший: курс, однокурсник, чужий запис екрана | ні — це довідка, не твоя перевірка |
        | `skipped` | перевірку **не виконано** | ні — це [[skip-record\|запис пропуску]] |

        Найчастіша пастка: «iOS у мене не запускається, але код спільний із Android — позначу як пройдено». Спільний JavaScript не робить спільною поведінку: VoiceOver і TalkBack читають екран по-різному, безпечні зони й дозволи різняться (RN-02, RN-09). Чесний запис для такої цілі — пропуск: перевірка, ціль, **причина** й **план повернення**. Він лишається видимо невиконаним, поки ти не повернешся до нього на потрібній цілі.
      en: |
        | Provenance | What it means | Is it your pass |
        |---|---|---|
        | `learner-authored` | you performed the check yourself | yes |
        | `assisted` | you performed it with a hint or after viewing the solution | yes, marked “with help” |
        | `supplied` | someone else gave the evidence: the course, a classmate, another person’s screen recording | no — it is information, not your check |
        | `skipped` | the check was **not performed** | no — it is a [[skip-record]] |

        The most common trap: “iOS does not run here, but the code is shared with Android — I will mark it passed.” Shared JavaScript does not make the behavior shared: VoiceOver and TalkBack read a screen differently, safe areas and permissions differ (RN-02, RN-09). The honest record for such a target is a skip: the check, the target, the **reason** and the **way back**. It stays visibly unperformed until you come back to it on the right target.

  - id: record-boxes
    kind: visual
    visual: diagram
    title:
      uk: "Звідки береться кожне поле запису"
      en: "Where each field of a record comes from"
    textEquivalent:
      uk: "Запис доказу складається з полів: перевірка, ціль, збірка (id, версія, відбиток підпису), що зроблено, що побачено, результат і походження. Перевірка на заявленій цілі заповнює всі поля: ціль — з налаштувань пристрою, збірку — з release-збірки, яку встановлено, дії й побачене — з того, що ти робив і бачив, результат — твоє порівняння з очікуваним. Для цілі, яку твій комп’ютер не підтримує, ці поля нічим заповнити: перевірку не виконано. Замість вигаданого результату з’являється запис пропуску: перевірка, ціль, причина й план повернення, без результату. Він лишається невиконаним і видимим, щоб до нього повернутися. Перегляд у браузері може заповнити поля «зроблено» й «побачено», але ціль у нього не нативна, тож такий запис не приймають як нативний доказ."
      en: "An evidence record consists of fields: check, target, build (id, version, signing fingerprint), procedure, observed, outcome and provenance. A check on the declared target fills every field: the target from the device settings, the build from the installed release build, procedure and observed from what you did and saw, the outcome from your comparison with the expected result. For a target your computer does not support there is nothing to fill these fields with: the check was not performed. Instead of an invented result there is a skip record: the check, the target, the reason and the way back, with no outcome. It stays unperformed and visible so you can come back to it. A browser preview can fill the procedure and observed fields, but its target is not native, so such a record is not accepted as native evidence."
    spec:
      layout: grid
      nodes:
        - { id: run, label: { uk: "Заявлена ціль", en: "Declared target" }, shape: pill, w: 160, col: 0, row: 0 }
        - { id: other, label: { uk: "Непідтримувана ціль", en: "Unsupported target" }, shape: pill, w: 160, col: 1, row: 0 }
        - { id: record, label: { uk: "Запис: усі поля", en: "Record: every field" }, w: 160, col: 0, row: 1 }
        - { id: skip, label: { uk: "Запис пропуску", en: "Skip record" }, shape: note, w: 160, col: 1, row: 1 }
        - { id: pass, label: { uk: "pass або fail", en: "pass or fail" }, shape: round, w: 160, col: 0, row: 2 }
        - { id: revisit, label: { uk: "Не виконано, повернутися", en: "Unperformed, revisit" }, shape: round, w: 160, col: 1, row: 2 }
      edges:
        - { id: run-record, from: run, to: record, label: { uk: "виконано", en: "performed" } }
        - { id: record-pass, from: record, to: pass }
        - { id: other-skip, from: other, to: skip, label: { uk: "не виконано", en: "not performed" } }
        - { id: skip-revisit, from: skip, to: revisit }
        - { id: skip-pass, from: skip, to: pass, kind: dashed }
      hidden: [skip, revisit, skip-revisit, other-skip, skip-pass]
      steps:
        - caption:
            uk: "Перевірка на **заявленій цілі** заповнює всі поля запису: ціль, збірку з відбитком підпису, дії, побачене, результат і походження."
            en: "A check on the **declared target** fills every field of the record: target, build with its signing fingerprint, procedure, observed, outcome and provenance."
          highlight: [run, record, run-record]
          dim: [other]
        - caption:
            uk: "Лише заповнений запис має результат — `pass` або `fail`. Провал теж чесний результат: його виправляють і перевіряють знову."
            en: "Only a filled record has an outcome — `pass` or `fail`. A failure is an honest outcome too: it is fixed and checked again."
          highlight: [record, pass, record-pass]
        - caption:
            uk: "Ціль, яку комп’ютер не підтримує, нічого не заповнює: перевірку **не виконано**. Замість результату — запис пропуску з причиною й планом повернення."
            en: "A target the computer does not support fills nothing: the check was **not performed**. Instead of an outcome there is a skip record with a reason and a way back."
          show: [skip, other-skip]
          highlight: [other, skip, other-skip]
          dim: [run, record, run-record]
        - caption:
            uk: "Пропуск лишається видимо **невиконаним**, і до нього можна повернутися. Стрілки від пропуску до `pass` немає: спільний код її не малює."
            en: "The skip stays visibly **unperformed**, and you can come back to it. There is no arrow from the skip to `pass`: shared code does not draw one."
          show: [revisit, skip-revisit, skip-pass]
          highlight: [skip, revisit, skip-revisit]
          annotate:
            - { id: skip-pass, text: { uk: "ніколи", en: "never" } }

  - id: five-records
    kind: prediction
    prompt:
      uk: |
        Заявлена ціль учня — Android-емулятор, CP-RN стосується release-збірки `1.3.0 (5)` планувальника. Ось п’ять записів:

        - **A.** Перезапуск · заявлений емулятор · release-збірка, відбиток збігається · дії й побачене описано · `pass` · зроблено самостійно.
        - **B.** Доступність · iOS-симулятор · пропущено · причина: Windows не запускає iOS-симулятор · план: повторити на Mac.
        - **C.** Офлайн · заявлений емулятор · release-збірка · лише знімок екрана, без опису дій і побаченого.
        - **D.** Життєвий цикл · заявлений емулятор · debug-збірка того самого commit, інший відбиток · дії й побачене описано · `pass`.
        - **E.** Продуктивність · перегляд у браузері · дії й побачене описано · `pass`.

        Які з них контрольна точка приймає як **пройдені**?
      en: |
        The learner’s declared target is an Android emulator, and CP-RN is about the planner’s release build `1.3.0 (5)`. Here are five records:

        - **A.** Restart · the declared emulator · the release build, fingerprint matches · procedure and observed written · `pass` · done by the learner.
        - **B.** Accessibility · iOS simulator · skipped · reason: Windows cannot run the iOS simulator · way back: repeat on a Mac.
        - **C.** Offline · the declared emulator · the release build · only a screenshot, no procedure and nothing observed.
        - **D.** Lifecycle · the declared emulator · the debug build of the same commit, a different fingerprint · procedure and observed written · `pass`.
        - **E.** Performance · the browser preview · procedure and observed written · `pass`.

        Which of them does the checkpoint accept as **passed**?
    answer:
      type: multi
      options:
        - id: a
          text: { uk: "A", en: "A" }
        - id: b
          text: { uk: "B", en: "B" }
          why:
            uk: "B — правильний запис, але **пропуску**: його приймають як пропущену перевірку, а не як пройдену. Спільний код не перетворює невиконану перевірку на виконану."
            en: "B is a correct record, but of a **skip**: it is accepted as a skipped check, not as a passed one. Shared code does not turn an unperformed check into a performed one."
        - id: c
          text: { uk: "C", en: "C" }
          why:
            uk: "Знімок не каже, що саме зроблено перед ним і що на ньому видно: чи вимкнено мережу, чи був перезапуск. Без опису дій і побаченого запис не приймають."
            en: "A screenshot does not say what was done before it or what it shows: whether the network was off, whether there was a restart. Without the procedure and the observation the record is not accepted."
        - id: d
          text: { uk: "D", en: "D" }
          why:
            uk: "Debug-збірка — не та збірка, про яку CP-RN: вона підписана іншим ключем і поводиться інакше (RN-11). Перевірку повторюють на release-збірці."
            en: "The debug build is not the build CP-RN is about: it is signed with another key and behaves differently (RN-11). The check is repeated on the release build."
        - id: e
          text: { uk: "E", en: "E" }
          why:
            uk: "Перегляд у браузері працює через react-native-web: це не нативний застосунок і не пристрій, тож він не доводить нативної поведінки, а продуктивності — тим паче."
            en: "The browser preview runs through react-native-web: it is not a native app and not a device, so it proves no native behavior, let alone performance."
      correct: [a]
    explanation:
      uk: "Пройдено лише A: заявлена ціль, правильна збірка, дії, побачене, результат і самостійна робота. B приймають як **пропуск**, а C, D і E не приймають: знімок без опису, не та збірка, не нативна ціль."
      en: "Only A is passed: the declared target, the right build, procedure, observed, outcome and the learner’s own work. B is accepted as a **skip**, while C, D and E are rejected: a screenshot without a description, the wrong build, a non-native target."

  - id: record-preview
    kind: example
    runtime: concept-preview
    dir: record-preview
    entry: main.jsx
    strings:
      restartProcedure: { uk: "Додав витрату «Обід» на 210,50, повністю закрив застосунок і відкрив знову.", en: "Added the expense “Lunch” for 210.50, closed the app completely and opened it again." }
      restartObserved: { uk: "«Обід» на місці, підсумок «Їжа» за березень — 1056,00.", en: "“Lunch” is there, the March total for “Food” is 1,056.00." }
      offlineProcedure: { uk: "Увімкнув режим польоту, змінив «Проїзний» на 480,00, перезапустив застосунок.", en: "Turned on airplane mode, changed “Transit pass” to 480.00, restarted the app." }
      offlineObserved: { uk: "Сума 480,00 на місці, рядок позначено «збережено на пристрої».", en: "The amount 480.00 is there, the row says “saved on this device”." }
      iosReason: { uk: "Комп’ютер на Windows: iOS-симулятор працює лише на macOS.", en: "A Windows computer: the iOS simulator runs only on macOS." }
      iosRevisit: { uk: "Повторити на Mac або на iPhone, коли буде доступ.", en: "Repeat on a Mac or on an iPhone when one is available." }
      statusPassed: { uk: "пройдено", en: "passed" }
      statusAssisted: { uk: "пройдено з допомогою", en: "passed with help" }
      statusFailed: { uk: "провалено — виправ і перевір знову", en: "failed — fix and check again" }
      statusSupplied: { uk: "надано іншими — не твоє проходження", en: "supplied — not your pass" }
      statusSkipped: { uk: "пропущено — не виконано, можна повернутися", en: "skipped — not performed, can be revisited" }
      statusRejected: { uk: "не прийнято", en: "rejected" }
      reasonUnknownCheck: { uk: "невідома перевірка", en: "unknown check" }
      reasonUnknownProvenance: { uk: "невідоме походження", en: "unknown provenance" }
      reasonSkipWithoutReason: { uk: "у пропуску бракує цілі, причини чи плану повернення", en: "the skip lacks a target, a reason or a way back" }
      reasonSkipClaimsResult: { uk: "пропуск заявляє результат", en: "a skip claims a result" }
      reasonNotNative: { uk: "не нативний доказ (перегляд у браузері)", en: "not native evidence (browser preview)" }
      reasonScreenshotOnly: { uk: "лише знімок екрана, без опису дій і побаченого", en: "only a screenshot, no procedure or observation" }
      reasonIncomplete: { uk: "бракує дій, побаченого чи результату", en: "procedure, observation or outcome missing" }
      reasonWrongBuild: { uk: "не та збірка", en: "wrong build" }
      reasonWrongTarget: { uk: "не заявлена ціль", en: "not the declared target" }
    title:
      uk: "Записи доказів і їхні статуси"
      en: "Evidence records and their statuses"
    body:
      uk: |
        Тут три записи трекера витрат (`records.js`) і правила курсу для одного запису (`evidence.js`, функція `judge`). Картка показує статус, який `judge` дає кожному запису. `build.js` — картка release-збірки й заявлена ціль.

        Натисни **Запустити**: два записи пройдено, а запис для iOS — пропуск.
      en: |
        Here are three records of the expense tracker (`records.js`) and the course’s rules for one record (`evidence.js`, the `judge` function). Each card shows the status `judge` gives the record. `build.js` is the release build card and the declared target.

        Press **Run**: two records are passed, and the iOS record is a skip.
    tryIt:
      uk: |
        1. У записі `offline` заміни `target: declaredTarget` на `target: previewTarget` і запусти: «не прийнято: не нативний доказ». Дії й результат ті самі — змінилася лише ціль.
        2. Поверни `declaredTarget` і заміни `provenance` на `'supplied'`: запис став довідкою, а не твоїм проходженням.
        3. У запис для iOS додай `outcome: 'pass'`: «пропуск заявляє результат». Пропуск не має результату, бо перевірки не було.
      en: |
        1. In the `offline` record replace `target: declaredTarget` with `target: previewTarget` and run: “rejected: not native evidence”. The procedure and the outcome are the same — only the target changed.
        2. Put `declaredTarget` back and change `provenance` to `'supplied'`: the record became information, not your pass.
        3. Add `outcome: 'pass'` to the iOS record: “a skip claims a result”. A skip has no outcome, because there was no check.
    limits:
      uk: "Перегляд react-native-web у браузері. Він лише застосовує правила курсу до записів: жодної збірки не встановлено, жодної перевірки на пристрої не виконано, а відбитки підписів і версії тут синтетичні. Справжні записи ти пишеш про свою release-збірку на заявленій цілі."
      en: "A react-native-web preview in the browser. It only applies the course’s rules to records: no build is installed, no check is performed on a device, and the signing fingerprints and versions here are synthetic. You write the real records about your release build on your declared target."

  - id: sixty-minutes
    kind: explanation
    title:
      uk: "Вдосконалення на 60 хвилин"
      en: "An enhancement for 60 minutes"
    body:
      uk: |
        На CP-RN ти маєш близько години на одне вдосконалення свого проєкту. Окресли його заздалегідь, у трьох рядках:

        1. **Що саме:** вдосконалення твого домену — фільтр за категорією з підсумками (бажання), розділ прострочених справ (планувальник), семиденна сітка звички (звички) чи місячний підсумок за категоріями (витрати).
        2. **Що воно зачіпає:** екрани, доменну функцію (`summarizeItems`, `countDueTasks`, `summarizeHabit` чи `summarizeExpenses`) і адаптер сховища.
        3. **Які перевірки:** усі шість — і одразу познач, які з них на твоєму комп’ютері стануть пропусками.

        Якщо в три рядки не вміщується, вдосконалення завелике для години: залиш його ядро, решту запиши на потім.
      en: |
        At CP-RN you have about an hour for one enhancement of your project. Scope it in advance, in three lines:

        1. **What exactly:** your domain’s enhancement — a category filter with totals (wishlist), an overdue section (planner), a seven-day habit grid (habits) or a monthly summary by category (expenses).
        2. **What it touches:** the screens, the domain function (`summarizeItems`, `countDueTasks`, `summarizeHabit` or `summarizeExpenses`) and the storage adapter.
        3. **Which checks:** all six — and mark right away which of them become skips on your computer.

        If it does not fit into three lines, the enhancement is too big for an hour: keep its core and write the rest down for later.

  - id: habit-records
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: habit-records
    entry: main.jsx
    editable: [records.js]
    strings:
      lifecycleProcedure: { uk: "Позначив «Ранкова зарядка» на сьогодні, згорнув застосунок на 10 с і повернувся, відкрив деталі звички й повернувся «Назад».", en: "Marked “Morning exercise” for today, sent the app to the background for 10 s and came back, opened the habit’s detail and went Back." }
      lifecycleObserved: { uk: "Сітка показує позначку один раз, тижневий відсоток після повернень не змінився.", en: "The grid shows the mark once, the weekly rate did not change after the returns." }
      iosReason: { uk: "Комп’ютер на Windows: iOS-симулятор працює лише на macOS.", en: "A Windows computer: the iOS simulator runs only on macOS." }
      iosRevisit: { uk: "Повторити в режимі польоту на iPhone або на Mac, коли буде доступ.", en: "Repeat in airplane mode on an iPhone or on a Mac when one is available." }
      sharedProcedure: { uk: "Не перевіряв окремо: код екрана спільний з Android.", en: "Not checked separately: the screen’s code is shared with Android." }
      sharedObserved: { uk: "Має працювати так само, як на Android.", en: "Should work the same as on Android." }
      statusPassed: { uk: "пройдено", en: "passed" }
      statusAssisted: { uk: "пройдено з допомогою", en: "passed with help" }
      statusFailed: { uk: "провалено — виправ і перевір знову", en: "failed — fix and check again" }
      statusSupplied: { uk: "надано іншими — не твоє проходження", en: "supplied — not your pass" }
      statusSkipped: { uk: "пропущено — не виконано, можна повернутися", en: "skipped — not performed, can be revisited" }
      statusRejected: { uk: "не прийнято", en: "rejected" }
      reasonUnknownCheck: { uk: "невідома перевірка", en: "unknown check" }
      reasonUnknownProvenance: { uk: "невідоме походження", en: "unknown provenance" }
      reasonSkipWithoutReason: { uk: "у пропуску бракує цілі, причини чи плану повернення", en: "the skip lacks a target, a reason or a way back" }
      reasonSkipClaimsResult: { uk: "пропуск заявляє результат", en: "a skip claims a result" }
      reasonNotNative: { uk: "не нативний доказ (перегляд у браузері)", en: "not native evidence (browser preview)" }
      reasonScreenshotOnly: { uk: "лише знімок екрана, без опису дій і побаченого", en: "only a screenshot, no procedure or observation" }
      reasonIncomplete: { uk: "бракує дій, побаченого чи результату", en: "procedure, observation or outcome missing" }
      reasonWrongBuild: { uk: "не та збірка", en: "wrong build" }
      reasonWrongTarget: { uk: "не заявлена ціль", en: "not the declared target" }
    title:
      uk: "Два записи для трекера звичок"
      en: "Two records for the habit tracker"
    instructions:
      uk: |
        Учень на Windows додав у трекер звичок семиденну сітку. Його заявлена ціль, release-збірка й debug-збірка того самого commit — у `build.js`. Допиши в `records.js` два записи за правилами з `evidence.js`:

        1. `lifecycleRecord` — перевірка життєвого циклу (`check: 'lifecycle'`), виконана самостійно на заявленій цілі з **release**-збіркою, з результатом `pass`. Дії й побачене опиши своїми словами: наприклад, що відбувається із сіткою, коли застосунок іде у фон і повертається.
        2. `iosSkip` — перевірка офлайну (`check: 'offline'`) на iOS-симуляторі `iosSimulator`, якого цей комп’ютер не запускає: запис пропуску з причиною й планом повернення.

        Картки праворуч показують статус кожного запису. Натисни **Перевірити**, коли перша картка скаже «пройдено», а друга — «пропущено».
      en: |
        A learner on Windows added a seven-day grid to the habit tracker. Their declared target, the release build and the debug build of the same commit are in `build.js`. Finish two records in `records.js` following the rules in `evidence.js`:

        1. `lifecycleRecord` — the lifecycle check (`check: 'lifecycle'`), performed by the learner on the declared target with the **release** build, with the outcome `pass`. Describe the procedure and what was observed in your own words: for example, what happens to the grid when the app goes to the background and comes back.
        2. `iosSkip` — the offline check (`check: 'offline'`) on the iOS simulator `iosSimulator`, which this computer cannot run: a skip record with a reason and a way back.

        The cards on the right show the status of each record. Press **Check** when the first card says “passed” and the second says “skipped”.
    testTitles:
      "the lifecycle record is accepted as passed":
        uk: "`lifecycleRecord` прийнято як пройдений"
        en: "`lifecycleRecord` is accepted as passed"
      "the lifecycle record names the lifecycle check":
        uk: "`lifecycleRecord` стосується перевірки `lifecycle`"
        en: "`lifecycleRecord` is about the `lifecycle` check"
      "the iOS record is accepted as a skip":
        uk: "`iosSkip` прийнято як пропуск"
        en: "`iosSkip` is accepted as a skip"
      "the iOS record is about the offline check on the iOS simulator":
        uk: "`iosSkip` стосується перевірки `offline` на `iosSimulator`"
        en: "`iosSkip` is about the `offline` check on `iosSimulator`"
    hints:
      nudge:
        uk: "Прочитай коментар на початку `evidence.js`: там дві форми запису — для виконаної перевірки й для пропуску. Картка праворуч називає причину, з якої запис не прийнято."
        en: "Read the comment at the top of `evidence.js`: it shows two shapes of a record — for a performed check and for a skip. The card on the right names the reason a record is rejected."
      explanation:
        uk: "Виконана перевірка має всі поля: `check`, `target`, `build`, `procedure`, `observed`, `outcome` і `provenance`; ціль і збірку бери з `build.js`, а не вписуй навмання. Пропуск має лише `check`, `target`, `provenance: 'skipped'`, `reason` і `revisit` — і жодного `outcome` чи `observed`. Наприклад, пропуск вимірювання продуктивності, на яке забракло часу, виглядав би так: `{ check: 'performance', target: declaredTarget, provenance: 'skipped', reason: '…', revisit: '…' }`."
        en: "A performed check has every field: `check`, `target`, `build`, `procedure`, `observed`, `outcome` and `provenance`; take the target and the build from `build.js` rather than typing them at random. A skip has only `check`, `target`, `provenance: 'skipped'`, `reason` and `revisit` — and no `outcome` or `observed`. For example, a skip of a performance measurement there was no time for would look like this: `{ check: 'performance', target: declaredTarget, provenance: 'skipped', reason: '…', revisit: '…' }`."
    solutionNote:
      uk: "Виконана перевірка посилається на `declaredTarget` і `build` — release-збірку, бо саме вона йде до користувачів; у `debugBuild` той самий commit, але інший відбиток підпису. Пропуск чесно каже, що перевірки не було: без результату, з причиною й планом повернення."
      en: "The performed check refers to `declaredTarget` and `build` — the release build, because that is what reaches users; `debugBuild` has the same commit but a different signing fingerprint. The skip honestly says there was no check: no outcome, with a reason and a way back."
    feedback:
      - when: { test: "the lifecycle record is accepted as passed" }
        message:
          uk: "Ця перевірка очікує від `judge(lifecycleRecord)` статус «пройдено». Картка називає причину відмови: «лише знімок екрана» — допиши `procedure` і `observed`; «не та збірка» — потрібна `build`, а не `debugBuild`; «не заявлена ціль» — потрібна `declaredTarget`; також потрібні `outcome: 'pass'` і `provenance: 'learner-authored'`."
          en: "This check expects the status “passed” from `judge(lifecycleRecord)`. The card names the reason for rejection: “only a screenshot” — add `procedure` and `observed`; “wrong build” — it needs `build`, not `debugBuild`; “not the declared target” — it needs `declaredTarget`; it also needs `outcome: 'pass'` and `provenance: 'learner-authored'`."
      - when: { test: "the lifecycle record names the lifecycle check" }
        message:
          uk: "Ця перевірка очікує `check: 'lifecycle'` у `lifecycleRecord`: запис має називати саме ту перевірку, яку описано."
          en: "This check expects `check: 'lifecycle'` in `lifecycleRecord`: the record must name exactly the check it describes."
      - when: { test: "the iOS record is accepted as a skip" }
        message:
          uk: "Ця перевірка очікує від `judge(iosSkip)` статус «пропущено»: `provenance: 'skipped'`, ціль, непорожні `reason` і `revisit` і **жодного** `outcome` чи `observed`. Перевірку на iOS не виконано, тож позначити її як пройдену через спільний код не можна."
          en: "This check expects the status “skipped” from `judge(iosSkip)`: `provenance: 'skipped'`, a target, non-empty `reason` and `revisit`, and **no** `outcome` or `observed`. The iOS check was not performed, so it cannot be marked passed because of shared code."
      - when: { test: "the iOS record is about the offline check on the iOS simulator" }
        message:
          uk: "Ця перевірка очікує в `iosSkip` поля `check: 'offline'` і `target: iosSimulator` з `build.js`."
          en: "This check expects `check: 'offline'` and `target: iosSimulator` from `build.js` in `iosSkip`."
    limits:
      uk: "Перегляд react-native-web у браузері, що лише застосовує правила курсу до твоїх записів. Жодної перевірки на пристрої тут не виконано; збірки й відбитки синтетичні."
      en: "A react-native-web preview in the browser that only applies the course’s rules to your records. No check is performed on a device here; the builds and fingerprints are synthetic."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: component-test-cell
        from: rn-07-05-e2e-platform-deployment-concepts
        prompt:
          uk: "Компонентний тест екрана звичок проходить на твоєму комп’ютері (у test runner, без емулятора). Яку клітинку матриці покриття платформ він може заповнити?"
          en: "A component test of the habits screen passes on your computer (in the test runner, without an emulator). Which cell of the platform coverage matrix can it fill?"
        answer:
          type: choice
          options:
            - id: host
              text:
                uk: "Лише стовпець test runner на комп’ютері"
                en: "Only the host test runner column"
            - id: target
              text:
                uk: "Стовпець заявленої цілі — код той самий"
                en: "The declared target column — the code is the same"
              why:
                uk: "Компонентний тест не запускає нативного застосунку: ні нативних view, ні справжнього сховища, ні screen reader. Стовпець цілі заповнює лише перевірка на цілі."
                en: "A component test does not run the native app: no native views, no real storage, no screen reader. The target column is filled only by a check on the target."
            - id: both
              text:
                uk: "Обидва стовпці пристроїв, бо тест не залежить від платформи"
                en: "Both device columns, because the test does not depend on the platform"
              why:
                uk: "Незалежність від платформи — якраз причина, чому тест нічого не каже про платформи. Пристроєві стовпці лишаються порожніми чи невиконаними."
                en: "Being platform-independent is exactly why the test says nothing about the platforms. The device columns stay empty or unperformed."
          correct: [host]
        explanation:
          uk: "У матриці покриття кожна клітинка має своє джерело. Невиконані клітинки лишаються видимими — так само, як записи пропуску на CP-RN."
          en: "In the coverage matrix every cell has its own source. Unperformed cells stay visible — just like skip records at CP-RN."

      - id: linux-ios
        from: rn-01-02-toolchain-setup
        prompt:
          uk: "Твій комп’ютер працює на Linux. Що правильно записати про ціль «iOS-симулятор» на самому початку етапу React Native?"
          en: "Your computer runs Linux. What is the right record about the “iOS simulator” target at the very start of the React Native stage?"
        answer:
          type: choice
          options:
            - id: unsupported
              text:
                uk: "Непідтримувана на цьому комп’ютері — і це не блокує наступних уроків"
                en: "Unsupported on this computer — and that does not block the next lessons"
            - id: blocked
              text:
                uk: "Без iOS-симулятора етап React Native далі пройти не можна"
                en: "Without an iOS simulator the React Native stage cannot go on"
              why:
                uk: "Достатньо однієї заявленої цілі: Android-емулятора чи власного телефона. Непідтримувана ціль записується й не блокує навчання."
                en: "One declared target is enough: an Android emulator or your own phone. An unsupported target is recorded and does not block learning."
            - id: same
              text:
                uk: "Нічого: iOS перевіряється разом з Android, бо код спільний"
                en: "Nothing: iOS is checked together with Android because the code is shared"
              why:
                uk: "Спільний код не робить iOS перевіреним. Непідтримувану ціль записують явно, щоб пізніше було видно, чого не перевірено."
                en: "Shared code does not make iOS checked. An unsupported target is recorded explicitly so that it stays visible later what was not checked."
          correct: [unsupported]
        explanation:
          uk: "iOS-симулятор працює лише на macOS. Запис про непідтримувану ціль із RN-01 — перший запис пропуску в курсі: він не блокує навчання й не стає «пройдено»."
          en: "The iOS simulator runs only on macOS. The unsupported-target record from RN-01 is the first skip record of the course: it does not block learning and does not become “passed”."

  - id: to-project
    kind: transfer
    capstoneStep: RN-08
    body:
      uk: "На CP-RN ти побудуєш вдосконалення свого домену на заявленій цілі й пройдеш шість перевірок. Окресли вдосконалення в трьох рядках, як у цьому уроці, а для кожної перевірки, якої твій комп’ютер не підтримує, одразу заготуй запис пропуску з причиною й планом повернення."
      en: "At CP-RN you will build your domain’s enhancement on the declared target and go through the six checks. Scope the enhancement in three lines, as in this lesson, and for every check your computer does not support prepare a skip record with a reason and a way back right away."
