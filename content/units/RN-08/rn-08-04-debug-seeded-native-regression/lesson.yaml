        command: "mkdir -p ~/js-course\ncd ~/js-course\nnpx create-expo-app@latest rn-08-seeded-habits --template blank@sdk-57 --no-agents-md"
        expect:
          uk: "Перший рядок виводу — `Creating rn-08-seeded-habits using the blank@sdk-57 template.`, наприкінці — `✅ Your project is ready!`; у `package.json` залежність `expo` версії ~57."
          en: "The first output line is `Creating rn-08-seeded-habits using the blank@sdk-57 template.`, near the end `✅ Your project is ready!`; `package.json` lists `expo` at version ~57."
      - text:
          uk: "Перейди в проєкт і встанови сховище й навігацію."
          en: "Change into the project and install the store and the navigation."
        command: "cd rn-08-seeded-habits\nnpx expo install @react-native-async-storage/async-storage @react-navigation/native @react-navigation/native-stack react-native-screens react-native-safe-area-context"
        expect:
          uk: "У `package.json` з’явилися п’ять нових залежностей."
          en: "Five new dependencies appeared in `package.json`."
      - text:
          uk: "Поклади в корінь проєкту файли з кроку 3 вступу (три з вправи, дві закладені версії, `seed.js`, новий `App.js`) і зафіксуй закладений стан окремим commit. Якщо `git status` каже, що це не репозиторій, спершу виконай `git init`."
