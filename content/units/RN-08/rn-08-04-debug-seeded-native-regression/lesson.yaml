          en: "The first complaint. Run the app on your declared target, press “Lab: 1.x data”, then close the app **completely** (Android: remove it from the recent apps; iOS: swipe it up in the app switcher) and open it again. Record what the list shows."
        command: "npx expo start"
        expect:
          uk: "«Звичок поки немає.», хоча дані 1.x записано, — перша скарга відтворена."
          en: "“No habits yet.” although the 1.x data was written — the first complaint is reproduced."
      - text:
          uk: "Друга скарга. Натисни «Лабораторія: дані 2.0.0» і повністю перезапусти застосунок — знімок версії 2 закладена версія читає, і звички з’являються. Відкрий «Тиждень», повернися й познач звичку, стежачи за терміналом, де працює `npx expo start`. Потім відкрий і закрий «Тиждень» ще двічі, відкрий його вчетверте, перейди в деталі звички й натисни «Позначити сьогодні». Запиши, скільки рядків `week: recalculated` дає кожне натискання."
          en: "The second complaint. Press “Lab: 2.0.0 data” and fully restart the app — the seeded version does read a version 2 snapshot, and the habits appear. Open “Week”, go back and mark a habit while watching the terminal where `npx expo start` runs. Then open and close “Week” twice more, open it a fourth time, go to a habit’s detail and press “Mark today”. Record how many `week: recalculated` lines each press gives."
        expect:
          uk: "Позначка в списку після того, як «Тиждень» закрито, усе одно друкує `week: recalculated`, а з кожним відвідуванням рядків на одне натискання стає більше — друга скарга відтворена."
          en: "A mark on the list after “Week” was closed still prints `week: recalculated`, and with every visit there are more lines per press — the second complaint is reproduced."
      - text:
          uk: "Перенеси обидва свої виправлення з вправи: увесь `snapshot.js` і `WeekSummary.jsx` (у ньому заміни `./navSim.jsx` на `@react-navigation/native`). Натисни «Лабораторія: дані 1.x» і повністю перезапусти застосунок; потім познач одну звичку й перезапусти ще раз. Далі: «Тиждень» → назад → позначка в списку; тричі «Тиждень» → назад; «Тиждень» → деталі → «Позначити сьогодні» → назад. Нарешті, на «Тижні» відправ застосунок у фон (на головний екран телефона), повернися й познач звичку в деталях. Запиши все, що бачив."
          en: "Bring over both of your fixes from the exercise: the whole `snapshot.js` and `WeekSummary.jsx` (in it replace `./navSim.jsx` with `@react-navigation/native`). Press “Lab: 1.x data” and fully restart the app; then mark one habit and restart again. Next: “Week” → back → a mark on the list; three times “Week” → back; “Week” → detail → “Mark today” → back. Finally, on “Week” send the app to the background (go to the phone’s home screen), come back and mark a habit in the detail. Record everything you saw."
        expect:
          uk: "Після перезапуску — три звички, і позначка переживає ще один перезапуск. Позначка в списку після «Тижня» не друкує нічого; повернення на «Тиждень» друкує один рядок і показує новий відсоток; перехід у фон і назад нічого не подвоює."
          en: "After the restart — three habits, and the mark survives another restart. A mark on the list after “Week” prints nothing; returning to “Week” prints one line and shows the new rate; going to the background and back doubles nothing."
      - text:
          uk: "Переконайся, що виправлення торкнулося лише двох файлів, запиши в `EVIDENCE.md` два записи (перезапуск і життєвий цикл) за вступом і зафіксуй роботу."
          en: "Make sure the fix touched only the two files, write two records (restart and lifecycle) into `EVIDENCE.md` following the introduction, and commit the work."
        command: "git diff --stat\ngit add -A\ngit commit -m \"Repair the RN-08 seeded migration and focus subscription\""
        expect:
          uk: "`git diff --stat` називає лише `snapshot.js` і `WeekSummary.jsx` (`EVIDENCE.md` — новий файл, тож його там немає); commit створено."
          en: "`git diff --stat` names only `snapshot.js` and `WeekSummary.jsx` (`EVIDENCE.md` is a new file, so it is not listed); the commit is created."
    verify:
      - id: reproduced-both
        text:
          uk: "На своїй цілі я бачив порожній список після запису даних 1.x і перезапуску, а також рядки `week: recalculated` після того, як «Тиждень» закрито, — більше з кожним відвідуванням."
          en: "On my target I saw an empty list after writing the 1.x data and restarting, and `week: recalculated` lines after “Week” was closed — more with every visit."
      - id: restart-proven
        text:
          uk: "Після виправлення три звички 1.x з’явилися після перезапуску, а моя позначка пережила ще один повний перезапуск."
          en: "After the fix the three 1.x habits appeared after a restart, and my mark survived another full restart."
      - id: focus-proven
        text:
          uk: "Після виправлення «Тиждень» не реагував на зміни, коли його закрито чи покинуто, повернення показувало поточний відсоток, а фон і повернення нічого не подвоювали."
          en: "After the fix “Week” did not react to changes while covered or left, returning showed the current rate, and the background and return doubled nothing."
      - id: evidence-written
        text:
          uk: "`EVIDENCE.md` має два записи із ціллю, збіркою, діями, побаченим, результатом і походженням, і обидва commit створено."
          en: "`EVIDENCE.md` has two records with the target, build, procedure, observed, outcome and provenance, and both commits are created."
    troubleshooting:
      - problem:
          uk: "У тебе немає нативної цілі або її не вдається запустити."
          en: "You have no native target, or it does not start."
        fix:
          uk: "Натисни «У мене немає емулятора чи пристрою»: завдання запишеться як невиконане, а частину в перегляді вже перевірено. Повернися сюди, коли налаштуєш ціль за RN-01."
          en: "Press “I have no emulator or device”: the task is recorded as not performed, and the preview part is already checked. Come back here once you have set up a target following RN-01."
      - problem:
          uk: "Після виправлення список досі порожній."
          en: "After the fix the list is still empty."
        fix:
          uk: "Знімок читається лише під час запуску, тож виправлення діє з наступного запуску. Натисни «Лабораторія: дані 1.x» ще раз і **повністю** перезапусти застосунок, як у кроці 4."
          en: "The snapshot is read only on launch, so the fix takes effect from the next launch. Press “Lab: 1.x data” again and restart the app **completely**, as in step 4."
      - problem:
          uk: "У терміналі `npx expo start` немає рядків `week: recalculated`."
          en: "The `npx expo start` terminal shows no `week: recalculated` lines."
        fix:
          uk: "За документацією Expo рядки `console.log` застосунку в режимі розробки з’являються в терміналі, де працює `npx expo start`; під час підготовки уроку цього не перевіряли. Якщо термінал мовчить, натисни в ньому `j`, щоб відкрити React Native DevTools, і подивись вкладку Console. Із `--no-dev` рядків у терміналі не буде."
          en: "According to the Expo documentation, the app’s `console.log` lines appear in development mode in the terminal where `npx expo start` runs; this was not checked while preparing the lesson. If the terminal stays silent, press `j` in it to open React Native DevTools and look at the Console tab. With `--no-dev` there are no lines in the terminal."
      - problem:
          uk: "Список показує «Не вдалося прочитати збережені звички»."
          en: "The list shows “Could not read the saved habits”."
        fix:
          uk: "Твій `restoreSnapshot` правильно не ховає збій, але не довів знімок 1.x до версії 2. Перевір крок `1` у `steps`: він має повертати масив звичок."
          en: "Your `restoreSnapshot` correctly does not hide the failure, but it did not bring the 1.x snapshot to version 2. Check step `1` in `steps`: it must return an array of habits."
    recovery:
      uk: "Перший commit тримає закладений стан, тож `git diff` завжди показує саме твої виправлення, а `git restore <файл>` повертає закладену версію файла. Дані на цілі відновлюють кнопки «Лабораторія: …» і повний перезапуск."
      en: "The first commit holds the seeded state, so `git diff` always shows exactly your fixes, and `git restore <file>` brings back the seeded version of a file. The “Lab: …” buttons and a full restart restore the data on the target."
