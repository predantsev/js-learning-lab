id: no-07-09-independent-harden-test
unit: NO-07
title:
  uk: "Самостійно: зміцни й протестуй"
  en: "Independent: harden and test"
kind: assessment
minutes: 35
contentVersion: 1
purpose:
  uk: "Перевірити без підказок, чи вмієш ти зібрати захист межі з усієї теми в один сервер: ліміти розміру, часу й частоти, loopback за замовчуванням, довіру лише до відомого проксі й CORS, що не підміняє автентифікацію, — і довести його власними тестами, моделлю загроз і журналом."
  en: "To check without hints whether you can put the edge protections of this whole topic into one server: size, time and rate limits, loopback by default, trust in a known proxy only and CORS that does not stand in for authentication — and to prove it with your own tests, a threat model and the log."
objectives:
  - uk: "Без підказок зміцнити незнайомий синтетичний API: ліміти розміру, часу й частоти, типова адреса loopback, обробка довіреного проксі й CORS, налаштований так, щоб не вважатися авторизацією."
    en: "Harden an unseen synthetic API without hints: size, time and rate limits, a loopback default bind, trusted-proxy handling and CORS configured without treating it as authorization."
  - uk: "Написати модель загроз на одну сторінку й довести захист тестами через справжній HTTP і журналом JSON без секретів, у якому відхилений запит знаходиться за його id."
    en: "Write a one-page threat model and prove the hardening with real-HTTP tests and redacted JSON logs that trace one rejected request by its id."
prerequisites: [no-07-08-debug-security-defects, no-10-08-threat-model-cors-not-auth]
subskills:
  - { family: B-07, skill: "rate/size/time limits", depth: assess }
  - { family: B-07, skill: "CORS not auth", depth: assess }
  - { family: B-07, skill: "TLS/proxy trust/context", depth: assess }
  - { family: B-07, skill: "threat model", depth: assess }
  - { family: B-09, skill: "unit/integration/realHTTP/DB tests", depth: assess }
  - { family: B-09, skill: "structured logs/redaction/request IDs", depth: assess }
glossary: []
selfCheck: [harden-notes]

blocks:
  - id: the-task
    kind: explanation
    title:
      uk: "Що на тебе чекає"
      en: "What awaits you"
    body:
      uk: |
        Дві частини, обидві без підказок:

        1. **На платформі** — зміцни межу синтетичного API нотаток у `harden.js`. Прихована перевірка надсилає справжні запити: великі, повільні, часті, з підробленими заголовками й чужим `Origin`.
        2. **На своєму комп’ютері** — перенеси розв’язок у теку проєкту, напиши власні тести на `node:test`, модель загроз і збережи рядок журналу відхиленого запиту.

        API нотаток сам перевіряє токен сесії (`notes.js`), а від тебе — усе, що має статися **до** нього. Повна відповідь з’явиться лише після того, як пройдуть усі перевірки.
      en: |
        Two parts, both without hints:

        1. **On the platform** — harden the edge of a synthetic notes API in `harden.js`. A hidden check sends real requests: large, slow, frequent, with forged headers and a foreign `Origin`.
        2. **On your computer** — move the solution into a project folder, write your own tests with `node:test`, a threat model, and keep the log line of a rejected request.

        The notes API checks the session token itself (`notes.js`); everything that must happen **before** it is up to you. The full solution appears only after every check passes.

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: cors-vs-curl
        from: no-10-08-threat-model-cors-not-auth
        prompt:
          uk: "API відповідає лише з `Access-Control-Allow-Origin: http://127.0.0.1:4310` і не перевіряє сесію. Хто зможе прочитати `GET /notes`?"
          en: "An API answers only with `Access-Control-Allow-Origin: http://127.0.0.1:4310` and does not check a session. Who can read `GET /notes`?"
        answer:
          type: choice
          options:
            - id: page-and-curl
              text:
                uk: "Сторінка з `http://127.0.0.1:4310` і будь-яка програма поза браузером (`curl`, скрипт, інший сервер)"
                en: "A page from `http://127.0.0.1:4310` and any program outside a browser (`curl`, a script, another server)"
            - id: page-only
              text:
                uk: "Лише сторінка з `http://127.0.0.1:4310`"
                en: "Only a page from `http://127.0.0.1:4310`"
              why:
                uk: "CORS — правило для **браузера**: чи дозволити сторінці прочитати відповідь. `curl` і сервери цих заголовків не виконують і отримують дані."
                en: "CORS is a rule for the **browser**: whether to let a page read the answer. `curl` and servers do not enforce these headers and get the data."
            - id: nobody
              text:
                uk: "Ніхто, поки немає сесії"
                en: "Nobody, as long as there is no session"
              why:
                uk: "Сесію API якраз не перевіряє. Без перевірки на сервері відповідь отримає кожен, хто надішле запит."
                en: "The API does not check a session at all. Without a check on the server, everyone who sends the request gets the answer."
          correct: [page-and-curl]
        explanation:
          uk: "CORS вирішує, чи браузер покаже відповідь сторінці з іншого походження. Хто взагалі має право на дані, вирішує лише перевірка на сервері — токен, сесія, власник запису."
          en: "CORS decides whether a browser shows an answer to a page from another origin. Who has a right to the data at all is decided only by a check on the server — a token, a session, the record's owner."

  - id: harden-notes
    kind: exercise
    mode: independent
    assessment: true
    runtime: isolated-node
    dir: harden-notes
    entry: index.js
    editable: [harden.js]
    capabilities: { network: loopback }
    strings:
      note1: { uk: "Купити лампочки", en: "Buy light bulbs" }
      note2: { uk: "Подзвонити в бібліотеку", en: "Call the library" }
    title:
      uk: "Зміцни API нотаток"
      en: "Harden the notes API"
    instructions:
      uk: |
        `harden.js` експортує `createHardenedServer({ log, trustedProxies, allowedOrigin })` і `bindHost(env, log)`. Числа — в об’єкті `LIMITS`. Зроби так, щоб:

        - тіло понад `maxBodyBytes` (2048 байтів) отримувало `413`;
        - клієнт, що надсилає заголовки довше за `headersTimeoutMs` (500 мс), отримував `408`, а весь запит обмежувався `requestTimeoutMs` (1000 мс);
        - понад `maxRequests` (5) запитів за `windowMs` (1000 мс) від одного клієнта отримували `429` із `Retry-After` (секунди, щонайменше 1);
        - клієнтом вважалась адреса сокета, а `X-Forwarded-For` — лише коли сокет належить проксі з `trustedProxies` (тоді — правий запис, що не є довіреним проксі);
        - `Access-Control-Allow-Origin` з’являвся лише для `Origin`, рівного `allowedOrigin`; запит `OPTIONS` із цього походження отримував `204` з `Access-Control-Allow-Methods` (щонайменше `GET, POST`) і `Access-Control-Allow-Headers` (щонайменше `authorization, content-type`);
        - CORS не замінював автентифікацію: доступ вирішує токен у `notes.js`, з `Origin` чи без нього;
        - `bindHost` повертав `env.HOST` або `127.0.0.1` за замовчуванням і писав через `log` запис з `level: "warn"` для адреси поза `127.0.0.1`, `::1`, `localhost`;
        - кожен запит давав рівно один виклик `log` з об’єктом `{ time, level, requestId, method, route, status, durationMs }`, `requestId` збігався із заголовком відповіді `X-Request-Id`, а `route` не містив query; жодних заголовків чи токенів у журналі.
      en: |
        `harden.js` exports `createHardenedServer({ log, trustedProxies, allowedOrigin })` and `bindHost(env, log)`. The numbers are in the `LIMITS` object. Make sure that:

        - a body over `maxBodyBytes` (2048 bytes) gets `413`;
        - a client that sends its headers for longer than `headersTimeoutMs` (500 ms) gets `408`, and the whole request is limited by `requestTimeoutMs` (1000 ms);
        - more than `maxRequests` (5) requests within `windowMs` (1000 ms) from one client get `429` with `Retry-After` (seconds, at least 1);
        - the client is the socket's address, and `X-Forwarded-For` counts only when the socket belongs to a proxy from `trustedProxies` (then the rightmost entry that is not a trusted proxy);
        - `Access-Control-Allow-Origin` appears only for an `Origin` equal to `allowedOrigin`; an `OPTIONS` request from that origin gets `204` with `Access-Control-Allow-Methods` (at least `GET, POST`) and `Access-Control-Allow-Headers` (at least `authorization, content-type`);
        - CORS does not replace authentication: the token in `notes.js` decides access, with or without `Origin`;
        - `bindHost` returns `env.HOST`, or `127.0.0.1` by default, and writes an entry with `level: "warn"` through `log` for an address other than `127.0.0.1`, `::1`, `localhost`;
        - every request gives exactly one call of `log` with an object `{ time, level, requestId, method, route, status, durationMs }`, `requestId` matches the answer's `X-Request-Id` header, and `route` holds no query; no headers or tokens in the log.
    testTitles:
      "an authenticated client can list and create notes":
        uk: "Клієнт із токеном може читати й створювати нотатки"
        en: "An authenticated client can list and create notes"
      "a body over 2048 bytes answers 413":
        uk: "Тіло понад 2048 байтів дає `413`"
        en: "A body over 2048 bytes answers `413`"
      "a client that sends its headers too slowly gets 408":
        uk: "Клієнт, що надто повільно надсилає заголовки, отримує `408`"
        en: "A client that sends its headers too slowly gets `408`"
      "a client whose body never finishes gets 408":
        uk: "Клієнт, чиє тіло так і не закінчується, отримує `408`"
        en: "A client whose body never finishes gets `408`"
      "the sixth request within a second from one client answers 429 with Retry-After":
        uk: "Шостий запит за секунду від одного клієнта дає `429` з `Retry-After`"
        en: "The sixth request within a second from one client answers `429` with `Retry-After`"
      "a forged X-Forwarded-For does not dodge the limit when the peer is not a trusted proxy":
        uk: "Підроблений `X-Forwarded-For` не обходить ліміт, коли сокет не належить довіреному проксі"
        en: "A forged `X-Forwarded-For` does not dodge the limit when the peer is not a trusted proxy"
      "behind a trusted proxy each client address gets its own limit":
        uk: "За довіреним проксі кожна адреса клієнта має свій ліміт"
        en: "Behind a trusted proxy each client address gets its own limit"
      "CORS allows exactly the configured origin":
        uk: "CORS дозволяє рівно налаштоване походження"
        en: "CORS allows exactly the configured origin"
      "CORS is not authentication: the token decides, with or without Origin":
        uk: "CORS — не автентифікація: вирішує токен, з `Origin` чи без"
        en: "CORS is not authentication: the token decides, with or without `Origin`"
      "a preflight from the allowed origin answers 204 with the allowed methods and headers":
        uk: "Попередній запит (preflight) із дозволеного походження дає `204` з дозволеними методами й заголовками"
        en: "A preflight from the allowed origin answers `204` with the allowed methods and headers"
      "bindHost defaults to 127.0.0.1 and warns about any other address":
        uk: "`bindHost` за замовчуванням дає `127.0.0.1` і попереджає про будь-яку іншу адресу"
        en: "`bindHost` defaults to `127.0.0.1` and warns about any other address"
      "one JSON log entry per request, with the request id and no secrets":
        uk: "Один запис журналу на запит, з request id і без секретів"
        en: "One log entry per request, with the request id and no secrets"
    solutionNote:
      uk: "Порядок на межі має значення: id і журнал — першими, щоб кожна відмова теж мала свій рядок; CORS і preflight — до ліміту частоти; ліміт частоти — за адресою з `clientIp`, тож підроблений заголовок нічого не дає; розмір — до читання тіла. Автентифікація лишається в `notes.js`, і CORS її не обходить."
      en: "The order at the edge matters: the id and the log come first, so every refusal also has its own line; CORS and the preflight come before the rate limit; the rate limit counts by the address from `clientIp`, so a forged header gains nothing; the size check comes before reading the body. Authentication stays in `notes.js`, and CORS does not get around it."

  - id: harden-locally
    kind: local-task
    runtime: local-node
    title:
      uk: "Тести, модель загроз і журнал на своєму комп’ютері"
      en: "Tests, a threat model and the log on your computer"
    intro:
      uk: |
        Тут ти доводиш свій захист сам — без прихованих перевірок. Пакетів не потрібно: `node:test`, `node:assert` і `fetch` вбудовані в Node.js. Ми виконали ці кроки на macOS із curl 8.7.1 двічі: з Node.js 25.2.1 (npm 11.6.2) і з Node.js 22.13.1 (npm 10.9.2); на Windows і Linux — не перевіряли.

        Що має бути в теці наприкінці:

        - `harden.js`, `body.js`, `notes.js` — скопійовані з вправи (у `notes.js` заміни текст першої нотатки на звичайний, без `%%`);
        - `harden.test.js` — щонайменше чотири тести через справжній HTTP, по одному на правило: `413`, `429` з підробленим `X-Forwarded-For`, CORS без токена → `401`, і запис журналу відхиленого запиту, знайдений за `X-Request-Id`, без токена; кожен тест запускає сервер на порту `0` і закриває його в `t.after`;
        - `start.js` — запускає сервер на `bindHost(process.env, log)` і порту `4320`, коли сервер слухає, друкує `notes API on http://<адреса>:4320`, а `log` друкує кожен запис одним рядком JSON;
        - `THREAT-MODEL.md` — таблиця на одну сторінку: щонайменше п’ять загроз (велике тіло, повільний клієнт, сплеск запитів, підроблений `X-Forwarded-For`, виклик із чужого `Origin`), для кожної — точка входу, захист і тест, що його доводить.
      en: |
        Here you prove your protection yourself — without hidden checks. No packages are needed: `node:test`, `node:assert` and `fetch` are built into Node.js. We did these steps on macOS with curl 8.7.1 twice: with Node.js 25.2.1 (npm 11.6.2) and with Node.js 22.13.1 (npm 10.9.2); we did not check them on Windows or Linux.

        What the folder holds at the end:

        - `harden.js`, `body.js`, `notes.js` — copied from the exercise (in `notes.js` replace the first note's text with a plain one, without `%%`);
        - `harden.test.js` — at least four tests over real HTTP, one per rule: `413`, `429` with a forged `X-Forwarded-For`, CORS without the token → `401`, and the log entry of a rejected request, found by `X-Request-Id`, without the token; each test starts the server on port `0` and closes it in `t.after`;
        - `start.js` — starts the server at `bindHost(process.env, log)` and port `4320`, prints `notes API on http://<address>:4320` once the server listens, and `log` prints every entry as one line of JSON;
        - `THREAT-MODEL.md` — a one-page table: at least five threats (a large body, a slow client, a burst of requests, a forged `X-Forwarded-For`, a call from a foreign `Origin`), and for each the entry point, the protection and the test that proves it.
    tools:
      - { name: "Node.js", version: { uk: "22.13 або новіший (перевірено на 25.2.1 і 22.13.1)", en: "22.13 or newer (checked on 25.2.1 and 22.13.1)" } }
      - { name: "npm", version: { uk: "з Node.js (перевірено 11.6.2 і 10.9.2)", en: "bundled with Node.js (checked 11.6.2 and 10.9.2)" } }
      - { name: "curl", version: { uk: "будь-яка (перевірено 8.7.1)", en: "any (checked 8.7.1)" } }
    steps:
      - text:
          uk: "Створи теку проєкту й перейди в неї."
          en: "Create the project folder and go into it."
        command: "mkdir -p ~/js-course/no-07-harden && cd ~/js-course/no-07-harden"
      - text:
          uk: "Створи `package.json` і познач файли як ES-модулі. npm 11 сам пише `\"type\": \"commonjs\"`, а npm 10 (з Node.js 22.13.1) не пише поля `type` зовсім, тож другу команду не пропускай."
          en: "Create `package.json` and mark the files as ES modules. npm 11 writes `\"type\": \"commonjs\"` by itself, and npm 10 (bundled with Node.js 22.13.1) writes no `type` field at all, so do not skip the second command."
        command: "npm init -y && npm pkg set type=module"
        expect:
          uk: "`package.json` з рядком `\"type\": \"module\"`."
          en: "A `package.json` with the line `\"type\": \"module\"`."
      - text:
          uk: "Скопіюй у теку `harden.js`, `body.js` і `notes.js` з вправи, напиши `harden.test.js` і запусти тести. `node --test` сам знаходить файли з назвою на `.test.js`."
          en: "Copy `harden.js`, `body.js` and `notes.js` from the exercise into the folder, write `harden.test.js` and run the tests. `node --test` finds files whose names end in `.test.js` by itself."
        command: "node --test"
        expect:
          uk: "Рядок `✔` для кожного тесту й наприкінці `ℹ fail 0` (так виглядає звіт у терміналі на Node.js 25.2.1 і 22.13.1)."
          en: "A `✔` line for every test and `ℹ fail 0` at the end (that is how the report looks in a terminal on Node.js 25.2.1 and 22.13.1)."
      - text:
          uk: "Напиши `start.js` і запусти сервер. Термінал лишається зайнятим — наступні команди виконуй у другому вікні терміналу в тій самій теці."
          en: "Write `start.js` and start the server. The terminal stays busy — run the next commands in a second terminal window in the same folder."
        command: "node start.js"
        expect:
          uk: "`notes API on http://127.0.0.1:4320` — адреса loopback, бо `HOST` не задано."
          en: "`notes API on http://127.0.0.1:4320` — a loopback address, because `HOST` is not set."
      - text:
          uk: "Створи тіло на 3 000 символів і надішли його: це запит, який межа має відхилити."
          en: "Create a body of 3,000 characters and send it: this is a request the edge must refuse."
        command: |
          node -e "console.log(JSON.stringify({ text: 'x'.repeat(3000) }))" > big.json
          curl -i -X POST http://127.0.0.1:4320/notes -H "Authorization: Bearer demo-notes-token" -H "Content-Type: application/json" --data @big.json
        expect:
          uk: "`HTTP/1.1 413 Payload Too Large` із заголовком `x-request-id: …` (і `connection: close`, якщо твоя відповідь `413` закриває з’єднання, як в уроці про ліміти), а в першому вікні — рядок JSON зі `\"status\":413` і тим самим `requestId`, без токена."
          en: "`HTTP/1.1 413 Payload Too Large` with the header `x-request-id: …` (and `connection: close` if your `413` answer closes the connection, as in the lesson on limits), and in the first window a JSON line with `\"status\":413` and the same `requestId`, without the token."
      - text:
          uk: "Перевір, що CORS — не захист: запит із чужим `Origin` і правильним токеном."
          en: "Check that CORS is not a protection: a request with a foreign `Origin` and the right token."
        command: "curl -i http://127.0.0.1:4320/notes -H \"Origin: http://evil.test\" -H \"Authorization: Bearer demo-notes-token\""
        expect:
          uk: "`HTTP/1.1 200 OK` з нотатками й **без** `Access-Control-Allow-Origin`: браузер не показав би цю відповідь сторінці з `evil.test`, але `curl` отримав дані, бо вирішує токен."
          en: "`HTTP/1.1 200 OK` with the notes and **without** `Access-Control-Allow-Origin`: a browser would not show this answer to a page from `evil.test`, but `curl` got the data, because the token decides."
      - text:
          uk: "Зупини сервер (Ctrl+C у першому вікні) і напиши `THREAT-MODEL.md`. Для кожної загрози вкажи тест із `harden.test.js` або крок цього завдання, що її доводить."
          en: "Stop the server (Ctrl+C in the first window) and write `THREAT-MODEL.md`. For every threat name the test from `harden.test.js` or the step of this task that proves it."
    verify:
      - id: tests-pass
        text:
          uk: "`node --test` пройшов щонайменше чотири мої тести через справжній HTTP, і кожен закриває свій сервер."
          en: "`node --test` passed at least four of my tests over real HTTP, and each one closes its server."
      - id: rejected-traced
        text:
          uk: "Я знайшов рядок журналу відхиленого запиту за його `x-request-id`: у ньому `\"status\":413` і немає токена."
          en: "I found the log line of the rejected request by its `x-request-id`: it has `\"status\":413` and no token."
      - id: threat-model
        text:
          uk: "`THREAT-MODEL.md` має щонайменше п’ять загроз, і для кожної названо захист і тест, що його доводить."
          en: "`THREAT-MODEL.md` has at least five threats, and each names its protection and the test that proves it."
    troubleshooting:
      - problem:
          uk: "`node --test` пише `SyntaxError: Cannot use import statement outside a module`."
          en: "`node --test` says `SyntaxError: Cannot use import statement outside a module`."
        fix:
          uk: "У `package.json` немає `\"type\": \"module\"` (npm 11 пише `\"commonjs\"`). Виконай `npm pkg set type=module`. Відтворено з `\"type\": \"commonjs\"`: перед помилкою йде попередження — на Node.js 25.2.1 `Failed to load the ES module`, на 22.13.1 `To load an ES module, set \"type\": \"module\"` — а звіт показує, що файл `harden.test.js` упав."
          en: "`package.json` has no `\"type\": \"module\"` (npm 11 writes `\"commonjs\"`). Run `npm pkg set type=module`. Reproduced with `\"type\": \"commonjs\"`: a warning comes before the error — `Failed to load the ES module` on Node.js 25.2.1, `To load an ES module, set \"type\": \"module\"` on 22.13.1 — and the report shows that the file `harden.test.js` failed."
      - problem:
          uk: "`node --test` друкує результати тестів, але не завершується."
          en: "`node --test` prints the test results but does not finish."
        fix:
          uk: "Якийсь тест не закриває свій сервер. Додай `t.after(() => server.close())` у кожен тест, що викликає `listen`."
          en: "Some test does not close its server. Add `t.after(() => server.close())` to every test that calls `listen`."
      - problem:
          uk: "`node start.js` падає з `EADDRINUSE`."
          en: "`node start.js` crashes with `EADDRINUSE`."
        fix:
          uk: "Порт `4320` уже зайнятий — найчастіше сервером із попереднього запуску в іншому вікні. Зупини його Ctrl+C або зміни порт у `start.js` і в командах `curl`."
          en: "Port `4320` is already taken — most often by a server from an earlier run in another window. Stop it with Ctrl+C or change the port in `start.js` and in the `curl` commands."
    recovery:
      uk: "Усе в цій теці можна відтворити: файли сервера знову скопіюй з вправи на платформі, а свої `harden.test.js` і `THREAT-MODEL.md` збережи окремо, перш ніж щось видаляти."
      en: "Everything in this folder can be recreated: copy the server files from the exercise on the platform again, and keep your own `harden.test.js` and `THREAT-MODEL.md` aside before deleting anything."
