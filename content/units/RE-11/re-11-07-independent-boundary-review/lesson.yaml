id: re-11-07-independent-boundary-review
unit: RE-11
title:
  uk: "Самостійно: обрати межу на дизайн-рев’ю"
  en: "Independent: choose the boundary in a design review"
kind: assessment
minutes: 25
contentVersion: 1
purpose:
  uk: "Перевірити без підказок, що ти вмієш на новому застосунку обрати стратегію рендерингу для кожної сторінки, провести межу клієнт/сервер, знайти пропси, які її не перетнуть, і секрети, які не повинні її перетинати, та відрізнити стабільні API React від експериментальних і від правил фреймворку."
  en: "To check without hints that, on a new app, you can choose a rendering strategy for each page, draw the client/server boundary, find the props that will not cross it and the secrets that must not cross it, and tell stable React APIs from experimental ones and from framework rules."
objectives:
  - uk: "Обрати без підказок стратегію рендерингу для кожної сторінки й межу клієнт/сервер для незнайомого застосунку на дизайн-рев’ю, перелічивши, що ніколи не повинно її перетинати і чому."
    en: "Choose, without hints, a rendering strategy per page and the client/server boundary for an unseen app in a design review, listing what must never cross it and why."
prerequisites: [re-11-06-debug-hydration-trace]
subskills:
  - { family: R-09, skill: "CSR vs SSR/static rendering", depth: assess }
  - { family: R-09, skill: "server/client components and serialization", depth: assess }
  - { family: R-09, skill: "RSC framework/stability awareness", depth: assess }
glossary: []
selfCheck: [boundary-review]

blocks:
  - id: how-it-works
    kind: explanation
    title:
      uk: "Як проходить рев’ю"
      en: "How the review works"
    body:
      uk: |
        Застосунок «Зустрічі» — афіша подій спільноти з реєстрацією. Команда хоче перенести його у фреймворк з серверними компонентами й просить твого рев’ю. Відповіді ти запишеш у `review.js`, а сторінка покаже їх таблицею.

        Тут немає підказок: усе, що потрібно, — у фактах завдання й у попередніх уроках цього блоку. Читай факти кожної сторінки уважно: правильна стратегія випливає саме з них, а не з того, яка «сучасніша».
      en: |
        The “Meetups” app is a community events listing with registration. The team wants to move it to a framework with server components and asks for your review. You will write the answers into `review.js`, and the page will show them as a table.

        There are no hints here: everything you need is in the task’s facts and in the earlier lessons of this unit. Read each page’s facts carefully: the right strategy follows from them, not from which one is “more modern”.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: що сервер бачить у запиті"
      en: "Recall: what the server sees in a request"
    items:
      - id: who-is-visiting
        from: js-16-03-cookies-storage-origins
        prompt:
          uk: "Особиста сторінка рендериться на сервері на кожен запит. Щоб показати квитки саме цього відвідувача вже в першому HTML, звідки сервер дізнається, хто прийшов?"
          en: "A personal page is rendered on the server on every request. To show this visitor’s own tickets already in the first HTML, where does the server learn who has come?"
        answer:
          type: choice
          options:
            - id: cookie
              text: { uk: "З cookie сесії, яку браузер сам додає до запиту сторінки", en: "From the session cookie, which the browser adds to the page request by itself" }
            - id: local-storage
              text: { uk: "З токена в `localStorage`: сервер прочитає його під час рендеру", en: "From a token in `localStorage`: the server reads it during the render" }
              why:
                uk: "`localStorage` живе лише в браузері, і сам браузер його нікуди не надсилає. Прочитати його може тільки JavaScript на сторінці — тобто вже після першого HTML."
                en: "`localStorage` lives only in the browser, and the browser sends it nowhere by itself. Only JavaScript on the page can read it — that is, after the first HTML."
            - id: effect
              text: { uk: "З ефекту, що після монтування надішле токен на сервер", en: "From an effect that sends the token to the server after mount" }
              why:
                uk: "Ефект виконується в браузері після гідратації. Для першого HTML уже запізно — сервер мав знати відвідувача ще до рендеру."
                en: "An effect runs in the browser after hydration. That is too late for the first HTML — the server had to know the visitor before rendering."
          correct: [cookie]
        explanation:
          uk: "До запиту сторінки браузер сам додає лише cookie цього сайту. Тому SSR-сторінки, що залежать від відвідувача, спираються на cookie сесії (найкраще з `HttpOnly`), а не на `localStorage`."
          en: "The only thing the browser adds to a page request by itself is this site’s cookies. So SSR pages that depend on the visitor rely on a session cookie (best with `HttpOnly`), not on `localStorage`."

  - id: boundary-review
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-react
    dir: boundary-review
    entry: main.jsx
    editable: [review.js]
    strings:
      title: { uk: "Рев’ю межі: «Зустрічі»", en: "Boundary review: “Meetups”" }
      pages: { uk: "Сторінки", en: "Pages" }
      components: { uk: "Компоненти", en: "Components" }
      cannotCross: { uk: "Не перетнуть межу", en: "Cannot cross" }
      secrets: { uk: "Ніколи не до браузера", en: "Never to the browser" }
      labels: { uk: "Позначки API", en: "API labels" }
    title:
      uk: "Дизайн-рев’ю застосунку «Зустрічі»"
      en: "Design review of the “Meetups” app"
    instructions:
      uk: |
        Заповни `review.js` за фактами нижче. Назви ключів і пропсів лишай англійською, як у файлі; поля `why` пиши своїми словами.

        **1. Сторінки** — у `PAGES` для кожної `strategy` (`"csr"`, `"ssr"` чи `"static"`) і `why` — одне власне речення, щонайменше 20 символів:

        - `catalog` (`/events`): однакова для всіх відвідувачів; організатори публікують події кілька разів на тиждень, і після кожної публікації сайт збирають заново; пошукові системи мають читати її без виконання JavaScript.
        - `dashboard` (`/me`): показує реєстрації відвідувача, що ввійшов; більшість відкриває її на повільних телефонах біля входу на подію й має побачити код квитка вже в першому HTML, до завантаження JavaScript.
        - `admin` (`/admin/new`): за входом, ним користуються троє працівників на настільних комп’ютерах; форма з перевіркою полів під час введення; швидкий перший показ нікому не потрібен, пошуковикам її бачити не можна.

        **2. Компоненти** — у `COMPONENTS` для кожного `"server"` чи `"client"`:

        ```text
        EventsPage                        reads published events from the database
          EventList({ events })           lays out the cards
            EventCard({ event })          title, venue, date
              RegisterButton({ eventId, seatsLeft, onRegistered })
                                          onClick sends a registration, then shows "Registered"
              CountdownBadge({ startsAt }) "starts in 2 h 15 min", updated every minute by setInterval
          CategoryFilter({ categories, selected })
                                          a <select>; keeps the chosen category in state
        DashboardPage                     reads the visitor's registrations
          MyRegistrations({ items })      the list of tickets with their codes
            CancelButton({ registration }) onClick cancels this registration
        AdminPage                         checks that the visitor is an admin
          AdminEventForm({ venues, adminToken })
                                          fields with live validation, onSubmit
        ```

        **3. Перетин межі.** Серверні батьки передають клієнтським дітям такі пропси:

        ```text
        EventCard -> RegisterButton:    eventId: "ev-07", seatsLeft: 12, onRegistered: () => refreshSeats("ev-07")
        EventCard -> CountdownBadge:    startsAt: new Date("2026-03-14T18:00:00Z")
        EventsPage -> CategoryFilter:   categories: new Set(["music", "tech", "sport"]), selected: "tech"
        MyRegistrations -> CancelButton: registration: new Registration("r-31", "ev-07")   // a class with a cancel() method
        AdminPage -> AdminEventForm:    venues: [{ id: "v-1", name: "Library hall" }], adminToken: "demo-ADM1-not-a-real-token"
        ```

        У `CANNOT_CROSS` — назви пропсів, які React **не зможе** серіалізувати. У `SECRETS` — назви пропсів, які серіалізуються, але **не повинні** потрапити в браузер.

        **4. API з туторіалу**, на який посилається команда. У `LABELS` для кожного — `"stable"`, `"canary"`, `"experimental"` або `"framework"`, якщо це правило фреймворку, а не API React:

        - `useServer` — директива `"use server"` над функцією, що зберігає реєстрацію;
        - `taintObjectReference` — `experimental_taintObjectReference(…)`, щоб об’єкт користувача не потрапив до клієнта;
        - `serverOnlyPackage` — рядок `import "server-only"` на початку `db.js`.
      en: |
        Fill in `review.js` from the facts below. Keep the key and prop names in English, as in the file; write the `why` fields in your own words.

        **1. Pages** — in `PAGES`, for each one a `strategy` (`"csr"`, `"ssr"` or `"static"`) and a `why` — one sentence of your own, at least 20 characters:

        - `catalog` (`/events`): the same for every visitor; organizers publish events a few times a week, and the site is rebuilt after each publication; search engines must read it without running JavaScript.
        - `dashboard` (`/me`): shows the registrations of the visitor who logged in; most people open it on slow phones at the door of the venue and must see the ticket code in the first HTML, before any JavaScript loads.
        - `admin` (`/admin/new`): behind login, used by three staff members on desktop computers; a form with validation while typing; nobody needs a fast first view, and search engines must not see it.

        **2. Components** — in `COMPONENTS`, `"server"` or `"client"` for each:

        ```text
        EventsPage                        reads published events from the database
          EventList({ events })           lays out the cards
            EventCard({ event })          title, venue, date
              RegisterButton({ eventId, seatsLeft, onRegistered })
                                          onClick sends a registration, then shows "Registered"
              CountdownBadge({ startsAt }) "starts in 2 h 15 min", updated every minute by setInterval
          CategoryFilter({ categories, selected })
                                          a <select>; keeps the chosen category in state
        DashboardPage                     reads the visitor's registrations
          MyRegistrations({ items })      the list of tickets with their codes
            CancelButton({ registration }) onClick cancels this registration
        AdminPage                         checks that the visitor is an admin
          AdminEventForm({ venues, adminToken })
                                          fields with live validation, onSubmit
        ```

        **3. Crossing the boundary.** Server parents pass their client children these props:

        ```text
        EventCard -> RegisterButton:    eventId: "ev-07", seatsLeft: 12, onRegistered: () => refreshSeats("ev-07")
        EventCard -> CountdownBadge:    startsAt: new Date("2026-03-14T18:00:00Z")
        EventsPage -> CategoryFilter:   categories: new Set(["music", "tech", "sport"]), selected: "tech"
        MyRegistrations -> CancelButton: registration: new Registration("r-31", "ev-07")   // a class with a cancel() method
        AdminPage -> AdminEventForm:    venues: [{ id: "v-1", name: "Library hall" }], adminToken: "demo-ADM1-not-a-real-token"
        ```

        In `CANNOT_CROSS` — the names of the props React **cannot** serialize. In `SECRETS` — the names of the props that do serialize but **must not** reach the browser.

        **4. APIs from the tutorial** the team refers to. In `LABELS`, for each one `"stable"`, `"canary"`, `"experimental"`, or `"framework"` if it is a framework’s rule rather than a React API:

        - `useServer` — the `"use server"` directive above a function that saves a registration;
        - `taintObjectReference` — `experimental_taintObjectReference(…)`, so that the user object does not reach the client;
        - `serverOnlyPackage` — the line `import "server-only"` at the top of `db.js`.
    testTitles:
      "each page gets the strategy its facts call for":
        uk: "Кожна сторінка отримує стратегію, якої вимагають її факти"
        en: "Each page gets the strategy its facts call for"
      "each page choice has its own reason of at least 20 characters":
        uk: "Кожен вибір має власне пояснення щонайменше на 20 символів"
        en: "Each page choice has its own reason of at least 20 characters"
      "components that need the browser are client components, the rest are server components":
        uk: "Компоненти, яким потрібен браузер, — клієнтські, решта — серверні"
        en: "Components that need the browser are client components, the rest are server components"
      "CANNOT_CROSS names exactly the props React cannot serialize":
        uk: "`CANNOT_CROSS` називає саме ті пропси, які React не серіалізує"
        en: "`CANNOT_CROSS` names exactly the props React cannot serialize"
      "SECRETS names the prop that serializes but must never reach the browser":
        uk: "`SECRETS` називає пропс, що серіалізується, але не повинен потрапити в браузер"
        en: "`SECRETS` names the prop that serializes but must never reach the browser"
      "LABELS give each tutorial API its stability or mark it as a framework rule":
        uk: "`LABELS` дає кожному API з туторіалу його стабільність або позначає правило фреймворку"
        en: "`LABELS` give each tutorial API its stability or mark it as a framework rule"
    solutionNote:
      uk: |
        - **Сторінки.** Каталог однаковий для всіх і змінюється лише з новою збіркою — статична генерація, і пошуковики бачать готовий HTML. Кабінет особистий і має показати квиток у першому HTML — SSR (відвідувача сервер упізнає за cookie). Адмінка — інтерактивна форма без вимог до першого показу — CSR.
        - **Компоненти.** Клієнтські — ті, що мають обробники, стан чи таймер: `RegisterButton`, `CategoryFilter`, `CountdownBadge`, `CancelButton`, `AdminEventForm`. Сторінки, списки й `EventCard` лише показують дані — серверні; `AdminPage` перевіряє права, і це якраз має лишитися на сервері.
        - **Межа.** `onRegistered` — звичайна функція, `registration` — екземпляр класу з методом: їх React не передасть. `Date` і `Set` пройдуть. А `adminToken` — текст, React передасть його без жодної помилки, і саме тому це найнебезпечніше: токен потрапив би в бандл і в HTML. Він лишається на сервері, а форма надсилає дані на сервер, що перевіряє права сам.
        - **Позначки.** `"use server"` — stable з React 19; taint API — experimental; `import "server-only"` — правило фреймворку (Next.js), а не API React.
      en: |
        - **Pages.** The catalog is the same for everyone and changes only with a new build — static generation, and search engines see ready HTML. The dashboard is personal and must show the ticket in the first HTML — SSR (the server recognises the visitor by a cookie). The admin page — an interactive form with no first-view requirements — CSR.
        - **Components.** The client ones are those with handlers, state or a timer: `RegisterButton`, `CategoryFilter`, `CountdownBadge`, `CancelButton`, `AdminEventForm`. The pages, the lists and `EventCard` only show data — server; `AdminPage` checks permissions, which is exactly what must stay on the server.
        - **The boundary.** `onRegistered` is an ordinary function, `registration` a class instance with a method: React will not pass them. `Date` and `Set` get through. And `adminToken` is text — React would pass it without any error, and that is exactly why it is the most dangerous: the token would land in the bundle and in the HTML. It stays on the server, and the form sends its data to the server, which checks the permissions itself.
        - **Labels.** `"use server"` is stable since React 19; the taint APIs are experimental; `import "server-only"` is a framework rule (Next.js), not a React API.
    feedback:
      - when: { test: "each page gets the strategy its facts call for" }
        message:
          uk: "Ця перевірка порівнює `strategy` кожної сторінки з її фактами: однаковість для всіх і нова збірка після публікації, особисті дані в першому HTML, інтерактивна форма без вимог до першого показу. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check compares each page’s `strategy` with its facts: the same for everyone and rebuilt after publishing, personal data in the first HTML, an interactive form with no first-view requirements. If every check fails at once, fix the first error in the console first."
      - when: { test: "each page choice has its own reason of at least 20 characters" }
        message:
          uk: "Ця перевірка чекає в кожному `why` щонайменше 20 символів і три різні пояснення — по одному на сторінку, з її власних фактів."
          en: "This check expects at least 20 characters in every `why` and three different reasons — one per page, from its own facts."
      - when: { test: "components that need the browser are client components, the rest are server components" }
        message:
          uk: "Ця перевірка називає компоненти з неправильною чи порожньою стороною. Клієнтським компонент робить власний стан, обробник, ефект чи таймер, а не те, що він рендерить клієнтських дітей."
          en: "This check names the components with a wrong or empty side. A component is made a client component by its own state, handler, effect or timer, not by rendering client children."
      - when: { test: "CANNOT_CROSS names exactly the props React cannot serialize" }
        message:
          uk: "Ця перевірка чекає в `CANNOT_CROSS` рівно ті назви пропсів із переліку перетинів, які React не серіалізує. Текст, числа, `Date`, `Set` і масиви звичайних об’єктів він передає."
          en: "This check expects `CANNOT_CROSS` to hold exactly the prop names from the list of crossings that React does not serialize. Text, numbers, `Date`, `Set` and arrays of plain objects it passes."
      - when: { test: "SECRETS names the prop that serializes but must never reach the browser" }
        message:
          uk: "Ця перевірка чекає в `SECRETS` назву пропса, який React передасть без помилки, але який дає доступ і тому не повинен потрапити в браузер."
          en: "This check expects `SECRETS` to hold the name of the prop that React would pass without an error but that grants access and so must not reach the browser."
      - when: { test: "LABELS give each tutorial API its stability or mark it as a framework rule" }
        message:
          uk: "Ця перевірка порівнює `LABELS` з довідкою React: яка позначка в директиви, у taint API і чи є `import \"server-only\"` API React взагалі."
          en: "This check compares `LABELS` with the React reference: which label the directive has, which the taint API has, and whether `import \"server-only\"` is a React API at all."
