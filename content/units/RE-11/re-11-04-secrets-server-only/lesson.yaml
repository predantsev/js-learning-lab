id: re-11-04-secrets-server-only
unit: RE-11
title:
  uk: "Секрети й код лише для сервера"
  en: "Secrets and server-only code"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Визначити код і значення, які мають лишатися на сервері (API-ключі, доступ до бази даних, привілейовані перевірки), і простежити, як один імпорт із клієнтського компонента відправив би їх у браузер."
    en: "Identify code and values that must stay on the server (API keys, database access, privileged checks) and trace how one import from a client component would ship them to the browser."
  - uk: "Застосувати явну межу модулів лише для сервера й правило назв для публічних значень, щоб секрети не потрапили в клієнтський код."
    en: "Apply an explicit server-only module boundary and a public-value naming rule to keep secrets out of client code."
prerequisites: [re-11-03-server-client-components, js-16-08-secrets-storage-privacy]
subskills:
  - { family: R-09, skill: "secrets/server-only code", depth: intro }
glossary: [server-only-code]
selfCheck: [predict-which-bundle, predict-env-prefix, send-reminder]

blocks:
  - id: imports-carry
    kind: explanation
    title:
      uk: "Бандл іде за імпортами, а не за коментарями"
      en: "A bundle follows imports, not comments"
    body:
      uk: |
        З JS-16 ти знаєш: усе, що читає клієнтський код, лежить у [[bundle|бандлі]], і будь-хто може його відкрити. Тепер — як секрет туди потрапляє, коли ніхто його туди не клав.

        Бандлер починає з клієнтського модуля й іде **кожним імпортом** далі. Якщо клієнтський компонент імпортує `task-utils.js`, а той — `reminders.js` з API-ключем, то ключ у бандлі. Коментар «цей файл працює на сервері» нічого не змінює: бандлер не читає коментарів, а функцію, яку клієнт справді викликає, він мусить узяти разом з усім, що вона використовує.

        Тому [[server-only-code|код лише для сервера]] позначають **так, щоб збірка могла відмовити**:

        - у Next.js з App Router (так описано в документації Next.js 16) на початку модуля пишуть `import "server-only";` — імпорт такого модуля з клієнтського компонента дає помилку під час збірки;
        - у React Router 7 у режимі фреймворку файл називають `*.server.ts` (або кладуть у теку `.server/`) — збірка падає, якщо такий файл опиняється в клієнтському графі модулів.

        Це правила фреймворків, не самого React, і в майбутніх версіях вони можуть змінитися — перевіряй документацію своєї версії.
      en: |
        From JS-16 you know: everything client code reads lies in the [[bundle]], and anyone can open it. Now — how a secret gets there when nobody put it there.

        A bundler starts at a client module and follows **every import** onwards. If a client component imports `task-utils.js`, and that imports `reminders.js` with an API key, the key is in the bundle. A comment saying “this file runs on the server” changes nothing: the bundler does not read comments, and a function the client really calls must be taken together with everything it uses.

        So [[server-only-code]] is marked **in a way that lets the build refuse**:

        - in Next.js with the App Router (as the Next.js 16 documentation describes it) the module starts with `import "server-only";` — importing such a module from a client component gives a build-time error;
        - in React Router 7 in framework mode the file is named `*.server.ts` (or put into a `.server/` folder) — the build fails if such a file ends up in the client module graph.

        These are framework rules, not React’s own, and future versions may change them — check the documentation of your version.

  - id: import-graph
    kind: visual
    visual: diagram
    title:
      uk: "Як ключ потрапляє в клієнтський бандл"
      en: "How a key gets into the client bundle"
    textEquivalent:
      uk: >-
        Граф імпортів: клієнтський компонент ReminderButton імпортує task-utils.js, а task-utils.js
        імпортує reminders.js, де лежить ключ і функція sendReminder. Бандлер іде від ReminderButton
        кожним імпортом і кладе в клієнтський бандл усі три файли — разом із текстом ключа, хоча
        ReminderButton ключа не згадує. Якщо reminders.js назвати reminders.server.js, той самий
        ланцюжок імпортів зупиняє збірку з помилкою: файл лише для сервера не може потрапити в
        клієнтський граф. Тоді кнопка звертається до власного сервера через reminder-client.js, і
        ключ лишається на сервері.
      en: >-
        The import graph: the client component ReminderButton imports task-utils.js, and task-utils.js
        imports reminders.js, which holds the key and the function sendReminder. The bundler follows
        every import from ReminderButton and puts all three files into the client bundle — including
        the text of the key, although ReminderButton never mentions it. If reminders.js is renamed
        reminders.server.js, the same import chain stops the build with an error: a server-only file
        cannot get into the client graph. Then the button calls our own server through
        reminder-client.js, and the key stays on the server.
    spec:
      layout: tb
      groups:
        - { id: client, label: { uk: "Клієнтський код", en: "Client code" } }
        - { id: shared, label: { uk: "Спільний модуль", en: "Shared module" } }
        - { id: server, label: { uk: "Код із ключем", en: "Code with the key" } }
      nodes:
        - { id: button, group: client, label: "ReminderButton.jsx" }
        - { id: bundle, group: client, label: { uk: "бандл: …demo-REM1…", en: "bundle: …demo-REM1…" }, shape: note, w: 200 }
        - { id: utils, group: shared, label: "task-utils.js" }
        - { id: reminders, group: server, label: "reminders.js: KEY", w: 180 }
      edges:
        - { from: button, to: utils, label: "import" }
        - { from: utils, to: reminders, label: "import" }
      hidden: [bundle]
      steps:
        - caption:
            uk: "`ReminderButton` імпортує допоміжний `task-utils.js`, а той — `reminders.js`, де лежать ключ і `sendReminder`."
            en: "`ReminderButton` imports the helper `task-utils.js`, and that imports `reminders.js`, which holds the key and `sendReminder`."
        - highlight: [button, utils, reminders, button->utils, utils->reminders]
          caption:
            uk: "Бандлер іде від клієнтського модуля кожним імпортом. Кнопка викликає `remindAbout`, той — `sendReminder`, а `sendReminder` використовує ключ: усе це потрібне браузеру, щоб код працював."
            en: "The bundler follows every import from the client module. The button calls `remindAbout`, that calls `sendReminder`, and `sendReminder` uses the key: the browser needs all of it for the code to work."
        - show: [bundle]
          highlight: [bundle, reminders]
          caption:
            uk: "У клієнтському бандлі опиняється текст ключа — хоча `ReminderButton` його не згадує, а `reminders.js` має коментар «працює на сервері»."
            en: "The text of the key ends up in the client bundle — although `ReminderButton` never mentions it, and `reminders.js` carries the comment “runs on the server”."
        - highlight: [utils->reminders]
          dim: [bundle]
          annotate:
            - { id: utils->reminders, text: { uk: "reminders.server.js — помилка збірки", en: "reminders.server.js — build error" } }
          caption:
            uk: "Якщо модуль із ключем позначено як серверний (`reminders.server.js` чи `import \"server-only\"`), цей самий імпорт зупиняє збірку. Помилка з’являється в тебе, а не ключ — у відвідувачів."
            en: "If the module with the key is marked server-only (`reminders.server.js` or `import \"server-only\"`), this same import stops the build. The error appears for you, instead of the key appearing for visitors."

  - id: predict-which-bundle
    kind: prediction
    lang: text
    runnable: false
    prompt:
      uk: "Три проєкти, той самий клієнтський компонент `ReminderButton`. У якому клієнтський бандл міститиме текст ключа `demo-REM1-not-a-real-key`?"
      en: "Three projects, the same client component `ReminderButton`. In which one will the client bundle contain the text of the key `demo-REM1-not-a-real-key`?"
    code: |
      A: ReminderButton -> format-date.js           (formats "2026-03-10"; no other imports)
         reminders.js holds the key; only the server's route handler imports it

      B: ReminderButton -> task-utils.js -> reminders.js
         reminders.js starts with the comment "// runs on the server" and holds the key;
         the button calls remindAbout(), which calls sendReminder(), which uses the key

      C: ReminderButton -> reminder-client.js       (fetch("/api/reminders", { method: "POST" }))
         the server's /api/reminders handler imports reminders.js with the key
    answer:
      type: choice
      options:
        - { id: b, text: { uk: "Лише B", en: "Only B" } }
        - id: none
          text: { uk: "Жоден: ключ лежить у файлі, який позначено як серверний", en: "None: the key is in a file marked as server code" }
          why:
            uk: "У B файл «позначено» лише коментарем, а бандлер коментарів не читає. Він іде імпортами: кнопка → `task-utils.js` → `reminders.js`, і функція, що використовує ключ, потрібна кнопці."
            en: "In B the file is “marked” only by a comment, and the bundler does not read comments. It follows imports: button → `task-utils.js` → `reminders.js`, and the function that uses the key is needed by the button."
        - id: b-and-c
          text: { uk: "B і C: в обох ланцюжках є `reminders.js`", en: "B and C: both chains contain `reminders.js`" }
          why:
            uk: "У C `reminders.js` імпортує обробник маршруту на **сервері**. Від клієнтського компонента до нього не веде жоден імпорт — лише HTTP-запит, а запит передає дані, не код."
            en: "In C `reminders.js` is imported by a route handler on the **server**. No import leads to it from the client component — only an HTTP request, and a request carries data, not code."
        - id: all
          text: { uk: "Усі три: ключ лежить у тому самому проєкті", en: "All three: the key is in the same project" }
          why:
            uk: "У бандл потрапляє не весь проєкт, а лише те, до чого ведуть імпорти від клієнтського входу. У A і C такого шляху немає."
            en: "Not the whole project gets into the bundle, only what imports lead to from the client entry. In A and C there is no such path."
      correct: [b]
    explanation:
      uk: "Вирішує граф імпортів від клієнтського входу. У B він доходить до `reminders.js`, і функцію з ключем справді викликає кнопка — ключ у бандлі. У C кнопка лише надсилає запит власному серверу, а ключ додає сервер."
      en: "The import graph from the client entry decides. In B it reaches `reminders.js`, and the function with the key really is called by the button — the key is in the bundle. In C the button only sends a request to our own server, and the server adds the key."

  - id: reminder-leak
    kind: example
    runtime: browser-react
    dir: reminder-leak
    entry: main.jsx
    strings:
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      remind: { uk: "Нагадати", en: "Remind me" }
      bundleFiles: { uk: "клієнтський бандл", en: "client bundle" }
      containsKey: { uk: "містить ключ", en: "contains the key" }
      "yes": { uk: "так", en: "yes" }
      "no": { uk: "ні", en: "no" }
    title:
      uk: "Знайти ключ у клієнтському бандлі"
      en: "Finding the key in the client bundle"
    body:
      uk: |
        Пісочниця не збирає бандл, тож `bundle.js` його імітує: починає з `ReminderButton.jsx`, іде кожним імпортом файлу проєкту й збирає всі досяжні файли — те, що завантажив би браузер. Як React Router, він відмовляється брати файл `*.server.*`. Як справжній бандлер, коментарі він пропускає. Мініфікації й tree shaking він не робить: імпорт, який ніде не використано, однаково тягне файл у бандл.

        `main.jsx` показує кнопку й друкує, які файли потрапили б у клієнтський бандл і чи є серед них ключ.
      en: |
        The sandbox does not build a bundle, so `bundle.js` imitates one: it starts at `ReminderButton.jsx`, follows every import of a project file and collects every file it reaches — what the browser would download. Like React Router, it refuses to take a `*.server.*` file. Like a real bundler, it skips comments. It does no minifying and no tree shaking: an import that is never used still pulls its file into the bundle.

        `main.jsx` shows the button and prints which files would get into the client bundle and whether the key is among them.
    tryIt:
      uk: |
        1. Запусти: бандл — `ReminderButton.jsx, task-utils.js, reminders.js`, ключ — «так». Сама кнопка ключа не згадує.
        2. У `ReminderButton.jsx` заміни `import { remindAbout } from "./task-utils";` на `import { requestReminder } from "./reminder-client";`, а `remindAbout(taskId)` — на `requestReminder(taskId)`. Запусти: у бандлі лише `ReminderButton.jsx, reminder-client.js`, ключа немає. Натисни «Нагадати»: консоль показує запит до власного сервера `/api/reminders`.
        3. Тепер маркер. Під імпортами в `ReminderButton.jsx` додай рядок `import { sendReminder } from "./reminders.server";` і запусти: замість списку — `BuildError … reminders.server.js is server-only, but the client imports it: ReminderButton.jsx → reminders.server.js`. Прибери цей рядок.
      en: |
        1. Run it: the bundle is `ReminderButton.jsx, task-utils.js, reminders.js`, the key — “yes”. The button itself never mentions the key.
        2. In `ReminderButton.jsx` replace `import { remindAbout } from "./task-utils";` with `import { requestReminder } from "./reminder-client";`, and `remindAbout(taskId)` with `requestReminder(taskId)`. Run: the bundle holds only `ReminderButton.jsx, reminder-client.js`, and no key. Press “Remind me”: the console shows a request to our own server, `/api/reminders`.
        3. Now the marker. Below the imports in `ReminderButton.jsx` add the line `import { sendReminder } from "./reminders.server";` and run: instead of the list you get `BuildError … reminders.server.js is server-only, but the client imports it: ReminderButton.jsx → reminders.server.js`. Remove that line.

  - id: public-names
    kind: explanation
    title:
      uk: "Змінна середовища — не секрет сама собою"
      en: "An environment variable is not a secret by itself"
    body:
      uk: |
        [[environment-variable|Змінна середовища]] прибирає значення з коду, але не з бандла: усе, що клієнтський код читає зі змінних, збірка **вписує** в бандл (згадай `define` з JS-16). Тому фреймворки розділяють змінні за назвою:

        - у Vite клієнтському коду через `import.meta.env` за замовчуванням доступні лише змінні з префіксом `VITE_` (інший префікс задає параметр `envPrefix`);
        - у Next.js (за документацією версії 16) у клієнтський бандл ідуть лише змінні з `NEXT_PUBLIC_`.

        Ми зібрали маленький проєкт Vite 8.3.2 з `.env`, де є `VITE_APP_NAME=Planner`, `VITE_REMINDER_KEY=demo-VITE-not-a-real-key` і `REMINDER_API_KEY=demo-REM1-not-a-real-key`. У зібраному файлі `dist/assets/index-….js` стоїть:

        ```text
        textContent=`Planner / demo-VITE-not-a-real-key / undefined`
        ```

        Префікс — це **оголошення «публічне»**, а не захист: ключ із `VITE_` опинився в бандлі відкритим текстом. Правило просте: публічні значення — з публічним префіксом в окремому модулі, секрети — без префікса й лише в коді для сервера.
      en: |
        An [[environment-variable]] removes a value from the code, but not from the bundle: whatever client code reads from variables, the build **writes into** the bundle (remember `define` from JS-16). So frameworks split variables by name:

        - in Vite, by default, only variables prefixed `VITE_` are available to client code through `import.meta.env` (the `envPrefix` option sets another prefix);
        - in Next.js (according to the version 16 documentation) only variables with `NEXT_PUBLIC_` go into the client bundle.

        We built a small Vite 8.3.2 project with a `.env` holding `VITE_APP_NAME=Planner`, `VITE_REMINDER_KEY=demo-VITE-not-a-real-key` and `REMINDER_API_KEY=demo-REM1-not-a-real-key`. The built file `dist/assets/index-….js` contains:

        ```text
        textContent=`Planner / demo-VITE-not-a-real-key / undefined`
        ```

        A prefix is a **declaration “this is public”**, not a protection: the key with `VITE_` ended up in the bundle as plain text. The rule is simple: public values get the public prefix and live in a separate module; secrets get no prefix and live only in server code.

  - id: predict-env-prefix
    kind: prediction
    prompt:
      uk: "У проєкті Vite хтось переніс ключ сервісу нагадувань з коду в `.env` як `VITE_REMINDER_KEY=…`, а клієнтський компонент читає `import.meta.env.VITE_REMINDER_KEY`. Чи став ключ секретним?"
      en: "In a Vite project someone moved the reminder service key from the code into `.env` as `VITE_REMINDER_KEY=…`, and a client component reads `import.meta.env.VITE_REMINDER_KEY`. Has the key become secret?"
    answer:
      type: choice
      options:
        - id: still-public
          text: { uk: "Ні: префікс `VITE_` означає «вписати в клієнтський бандл», і ключ там відкритим текстом", en: "No: the `VITE_` prefix means “write into the client bundle”, and the key is there as plain text" }
        - id: secret-now
          text: { uk: "Так: його більше немає у вихідному коді, а `.env` не комітять", en: "Yes: it is no longer in the source code, and `.env` is not committed" }
          why:
            uk: "`.env` не потрапляє в Git, але потрапляє у збірку: Vite підставляє значення `VITE_`-змінної в бандл, який завантажує кожен відвідувач."
            en: "`.env` does not get into Git, but it does get into the build: Vite substitutes the value of a `VITE_` variable into the bundle every visitor downloads."
        - id: undefined
          text: { uk: "Ключ узагалі не потрапить у браузер: Vite не дає клієнту змінних середовища", en: "The key will not reach the browser at all: Vite gives the client no environment variables" }
          why:
            uk: "Так Vite робить зі змінними **без** префікса — у нашому запуску там був `undefined`. Змінні з `VITE_` він навмисно віддає клієнту."
            en: "That is what Vite does with variables **without** the prefix — in our run they gave `undefined`. Variables with `VITE_` it hands to the client on purpose."
      correct: [still-public]
    explanation:
      uk: "Змінна середовища ховає значення з коду, але не з бандла. Якщо значення читає клієнтський код, воно публічне, хоч як його назвати. Секрет має лишатися без префікса й читатися лише в коді для сервера, а браузер звертається до твого сервера."
      en: "An environment variable hides a value from the code, but not from the bundle. If client code reads the value, it is public, whatever it is called. A secret must stay without the prefix and be read only in server code, while the browser asks your server."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: секрети в клієнті"
      en: "Recall: secrets in the client"
    items:
      - id: minified-key
        from: js-16-08-secrets-storage-privacy
        prompt:
          uk: "Бандл мініфіковано, source map на сайт не викладено, а ключ у бандлі стоїть у лапках усередині адреси запиту. Чи може відвідувач його прочитати?"
          en: "The bundle is minified, no source map is put on the site, and the key sits in quotes inside a request address in the bundle. Can a visitor read it?"
        answer:
          type: choice
          options:
            - id: can
              text: { uk: "Так: текст у лапках мініфікація не змінює", en: "Yes: minification does not change text in quotes" }
            - id: cannot
              text: { uk: "Ні: без source map код не прочитати", en: "No: without a source map the code cannot be read" }
              why:
                uk: "Source map повертає назви й файли твоїх модулів. Сам бандл браузер однаково завантажує, і рядок із ключем у ньому видно."
                en: "A source map brings back the names and files of your modules. The browser downloads the bundle itself anyway, and the string with the key is visible in it."
          correct: [can]
        explanation:
          uk: "Мініфікація перейменовує змінні, а рядки лишає. Тому єдиний захист — щоб ключа в клієнтському бандлі не було взагалі: він живе на сервері."
          en: "Minification renames variables but leaves strings. So the only protection is that the key is not in the client bundle at all: it lives on the server."

  - id: send-reminder
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: send-reminder
    entry: main.tsx
    editable: [ReminderButton.tsx, public-config.ts, reminders.server.ts, config.ts]
    strings:
      appName: { uk: "Планувальник", en: "Planner" }
      limit: { uk: "Нагадувань на справу:", en: "Reminders per task:" }
      remind: { uk: "Нагадати", en: "Remind me" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      bundleFiles: { uk: "клієнтський бандл", en: "client bundle" }
      keyFoundIn: { uk: "ключ знайдено в", en: "key found in" }
    title:
      uk: "Розділити конфіг на публічний і серверний"
      en: "Split the config into public and server parts"
    instructions:
      uk: |
        `config.ts` тримає разом публічні значення й ключ сервісу нагадувань, а клієнтський `ReminderButton.tsx` імпортує з нього все — і ключ їде в браузер. Консоль показує, які файли потрапили б у клієнтський бандл і де знайдено ключ.

        Розділи код:

        - `public-config.ts` експортує `APP_NAME` і `MAX_REMINDERS` — і нічого секретного;
        - `reminders.server.ts` містить ключ і експортує `sendReminder(taskId)`, яка повертає те саме, що зараз у `config.ts`; ключ лишається **лише** в цьому модулі — у жодному іншому твоєму файлі його тексту немає;
        - `ReminderButton.tsx` бере значення з `public-config.ts`, а нагадування просить через `requestReminder(taskId)` з `reminder-client.ts` (запит до власного сервера) і показує його відповідь у `<output>`.

        Перевірки будують клієнтський бандл від `ReminderButton.tsx` тим самим `bundle.js`: у ньому не має бути ні тексту ключа, ні файлу `*.server.*`. А кожен твій модуль, що містить ключ, `bundle.js` мусить відмовитися брати в клієнтський код.
      en: |
        `config.ts` keeps the public values and the reminder service key together, and the client `ReminderButton.tsx` imports everything from it — so the key travels to the browser. The console shows which files would get into the client bundle and where the key was found.

        Split the code:

        - `public-config.ts` exports `APP_NAME` and `MAX_REMINDERS` — and nothing secret;
        - `reminders.server.ts` holds the key and exports `sendReminder(taskId)`, which returns the same as it does in `config.ts` now; the key stays **only** in this module — none of your other files contains its text;
        - `ReminderButton.tsx` takes the values from `public-config.ts`, asks for a reminder through `requestReminder(taskId)` from `reminder-client.ts` (a request to our own server) and shows its answer in `<output>`.

        The checks build the client bundle from `ReminderButton.tsx` with the same `bundle.js`: it must contain neither the text of the key nor a `*.server.*` file. And every one of your modules that holds the key must be one `bundle.js` refuses to take into client code.
    testTitles:
      "the client bundle includes no .server module":
        uk: "У клієнтському бандлі немає модуля `.server`"
        en: "The client bundle includes no `.server` module"
      "the client bundle does not contain the reminder key":
        uk: "Клієнтський бандл не містить ключа нагадувань"
        en: "The client bundle does not contain the reminder key"
      "every module that holds the key is server-only: a client import of it stops the build":
        uk: "Кожен модуль із ключем — лише для сервера: клієнтський імпорт його зупиняє збірку"
        en: "Every module that holds the key is server-only: a client import of it stops the build"
      "public-config.ts exports APP_NAME and MAX_REMINDERS, and no value equal to the key":
        uk: "`public-config.ts` експортує `APP_NAME` і `MAX_REMINDERS` і жодного значення, рівного ключу"
        en: "`public-config.ts` exports `APP_NAME` and `MAX_REMINDERS`, and no value equal to the key"
      "sendReminder from reminders.server.ts still uses the key":
        uk: "`sendReminder` з `reminders.server.ts` і далі використовує ключ"
        en: "`sendReminder` from `reminders.server.ts` still uses the key"
      "the page shows the app name and the limit, and the button queues a reminder":
        uk: "Сторінка показує назву й ліміт, а кнопка ставить нагадування в чергу"
        en: "The page shows the app name and the limit, and the button queues a reminder"
    hints:
      nudge:
        uk: "Пройдися імпортами від `ReminderButton.tsx`: до яких файлів вони ведуть і що лежить у кожному? Що з цього справді потрібно кнопці в браузері?"
        en: "Walk the imports from `ReminderButton.tsx`: which files do they lead to, and what lies in each? Which of it does the button really need in the browser?"
      explanation:
        uk: |
          Браузеру потрібні лише публічні значення й спосіб **попросити** сервер щось зробити. Секрет і функція, що його використовує, переїжджають у модуль лише для сервера, якого не імпортує жоден клієнтський файл — ні напряму, ні через посередника. Схожий поділ для іншої функції:

          ```ts
          // public-limits.ts — у браузер
          export const MAX_UPLOAD_MB = 5;
          // storage.server.ts — лише сервер
          const STORAGE_TOKEN = "…";
          ```

          Реекспорт (`export { … } from "./config"`) не рятує: імпорт однаково веде у файл з ключем.
        en: |
          The browser needs only the public values and a way to **ask** the server to do something. The secret and the function that uses it move into a server-only module that no client file imports — neither directly nor through a middleman. A similar split for another feature:

          ```ts
          // public-limits.ts — goes to the browser
          export const MAX_UPLOAD_MB = 5;
          // storage.server.ts — server only
          const STORAGE_TOKEN = "…";
          ```

          A re-export (`export { … } from "./config"`) does not help: the import still leads into the file with the key.
    solutionNote:
      uk: "Клієнтський граф тепер — `ReminderButton.tsx`, `public-config.ts`, `reminder-client.ts`: ні ключа, ні серверного модуля. Ключ і `sendReminder` живуть у `reminders.server.ts`, який викличе лише обробник `/api/reminders` на сервері (його ти напишеш у Node.js-етапі). Назва `.server` робить помилку гучною: якщо хтось колись імпортує цей файл із клієнта, збірка зупиниться. У Next.js ту саму роль грає `import \"server-only\"`."
      en: "The client graph is now `ReminderButton.tsx`, `public-config.ts`, `reminder-client.ts`: no key and no server module. The key and `sendReminder` live in `reminders.server.ts`, which only the `/api/reminders` handler on the server will call (you will write it in the Node.js stage). The `.server` name makes the mistake loud: if someone ever imports this file from the client, the build stops. In Next.js `import \"server-only\"` plays the same role."
    feedback:
      - when: { test: "the client bundle includes no .server module" }
        message:
          uk: "Ця перевірка будує бандл від `ReminderButton.tsx` і чекає, що жоден імпорт — прямий чи через інший файл — не веде до `reminders.server.ts`. Браузер має просити нагадування через `requestReminder` з `reminder-client.ts`. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check builds the bundle from `ReminderButton.tsx` and expects that no import — direct or through another file — leads to `reminders.server.ts`. The browser has to ask for a reminder through `requestReminder` from `reminder-client.ts`. If every check fails at once, fix the first error in the console first."
      - when: { test: "the client bundle does not contain the reminder key" }
        message:
          uk: "Ця перевірка чекає, що в жодному файлі клієнтського бандла немає тексту `demo-REM1-not-a-real-key`. Консоль показує, у якому файлі його знайдено: імпорт якого файлу з клієнтського коду туди веде?"
          en: "This check expects that no file of the client bundle contains the text `demo-REM1-not-a-real-key`. The console shows which file it was found in: which import from client code leads there?"
      - when: { test: "every module that holds the key is server-only: a client import of it stops the build" }
        message:
          uk: "Ця перевірка шукає текст `demo-REM1-not-a-real-key` у `ReminderButton.tsx`, `public-config.ts`, `reminders.server.ts` і `config.ts` і чекає, що кожен такий файл `bundle.js` відмовиться взяти в клієнтський бандл. Ключ, що лишився в звичайному модулі (наприклад, у старому `config.ts`), — за один необережний імпорт від браузера: залиш його лише в `reminders.server.ts`."
          en: "This check looks for the text `demo-REM1-not-a-real-key` in `ReminderButton.tsx`, `public-config.ts`, `reminders.server.ts` and `config.ts`, and expects `bundle.js` to refuse each such file as client code. A key left in an ordinary module (for example, in the old `config.ts`) is one careless import away from the browser: keep it only in `reminders.server.ts`."
      - when: { test: "public-config.ts exports APP_NAME and MAX_REMINDERS, and no value equal to the key" }
        message:
          uk: "Ця перевірка чекає з `public-config.ts` експорти `APP_NAME` (назва застосунку) і `MAX_REMINDERS` (число 3) і що жоден експорт не дорівнює ключу."
          en: "This check expects `public-config.ts` to export `APP_NAME` (the app name) and `MAX_REMINDERS` (the number 3), and no export equal to the key."
      - when: { test: "sendReminder from reminders.server.ts still uses the key" }
        message:
          uk: "Ця перевірка імпортує `sendReminder` з `reminders.server.ts` (як імпортував би сервер) і чекає для `\"t-05\"` відповідь `sent t-05 (key demo…)`. Перенеси туди функцію разом із ключем."
          en: "This check imports `sendReminder` from `reminders.server.ts` (as the server would) and expects the answer `sent t-05 (key demo…)` for `\"t-05\"`. Move the function there together with the key."
      - when: { test: "the page shows the app name and the limit, and the button queues a reminder" }
        message:
          uk: "Ця перевірка чекає заголовок із назвою застосунку, текст «Нагадувань на справу: 3», а після кліку на «Нагадати» — `queued t-05` в `<output>`. Ця відповідь приходить від `requestReminder`, не від `sendReminder`."
          en: "This check expects a heading with the app name, the text “Reminders per task: 3”, and after a click on “Remind me” — `queued t-05` in `<output>`. That answer comes from `requestReminder`, not from `sendReminder`."

  - id: to-project
    kind: transfer
    capstoneStep: RE-11
    body:
      uk: "У твоєму проєкті поки немає ключів — і добре. Але в кроці проєкту ти запишеш, що ніколи не повинно перетинати межу: доступ до сховища, будь-який майбутній API-ключ. Для кожного пункту одразу вкажи, як це забезпечиш: окремий модуль лише для сервера, публічний префікс лише для публічних значень."
      en: "Your project has no keys yet — and that is good. But in the project step you will write down what must never cross the boundary: storage access, any future API key. For each item, note right away how you will ensure it: a separate server-only module, a public prefix only for public values."
