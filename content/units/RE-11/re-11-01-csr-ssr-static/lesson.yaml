id: re-11-01-csr-ssr-static
unit: RE-11
title:
  uk: "CSR, SSR і статичний рендеринг"
  en: "CSR vs SSR vs static"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Простежити, що браузер отримує першим і коли сторінка стає інтерактивною за рендерингу на клієнті, рендерингу на сервері на кожен запит і статичної генерації під час збірки."
    en: "Trace what the browser receives first and when the page becomes interactive under client-side rendering, per-request server rendering and build-time static generation."
  - uk: "Обрати стратегію рендерингу для сторінки за свіжістю її даних, персоналізацією й потребами першого показу та назвати, чим доводиться платити за кожен вибір."
    en: "Choose a rendering strategy for a page from its data freshness, personalisation and first-view needs, and state what each choice costs."
prerequisites: [re-01-06-render-vs-commit, js-16-02-http-methods-status-headers, re-10-01-lazy-suspense]
subskills:
  - { family: R-09, skill: "CSR vs SSR/static rendering", depth: intro }
glossary: [client-side-rendering, server-side-rendering, static-generation]
selfCheck: [predict-add-responds, predict-static-fresh, help-page]

blocks:
  - id: three-ways
    kind: explanation
    title:
      uk: "Та сама сторінка — три способи її зробити"
      en: "The same page, three ways to make it"
    body:
      uk: |
        Досі твої React-застосунки працювали так: сервер віддає майже порожній HTML — `<div id="root"></div>` і посилання на JavaScript, — а все інше будує React у браузері. Це [[client-side-rendering|рендеринг на клієнті (CSR)]]. Але React уміє рендерити й там, де немає DOM: рендер лише **описує** інтерфейс, а описати його можна й у вигляді тексту HTML. Звідси ще два способи:

        | Стратегія | Хто рендерить і коли | Що браузер отримує першим |
        |---|---|---|
        | CSR | браузер, після завантаження JavaScript | порожню оболонку |
        | [[server-side-rendering\|SSR]] | сервер, **на кожен запит** | HTML з уже підставленими даними |
        | [[static-generation\|статична генерація]] | збірка, **один раз** до публікації | готовий файл HTML, однаковий для всіх |

        Головне питання цього уроку — не «що швидше», а **що людина бачить** і **коли кнопки починають працювати**. Це два різні моменти, і стратегії зсувають їх по-різному.
      en: |
        So far your React apps worked like this: the server sends almost empty HTML — `<div id="root"></div>` and a link to the JavaScript — and React builds everything else in the browser. That is [[client-side-rendering]] (CSR). But React can render where there is no DOM too: a render only **describes** the interface, and a description can also take the form of HTML text. Hence two more ways:

        | Strategy | Who renders, and when | What the browser receives first |
        |---|---|---|
        | CSR | the browser, after the JavaScript has loaded | an empty shell |
        | [[server-side-rendering\|SSR]] | the server, **on every request** | HTML with the data already filled in |
        | [[static-generation]] | the build, **once** before publishing | a ready HTML file, the same for everyone |

        The main question of this lesson is not “which is faster” but **what the person sees** and **when the buttons start working**. Those are two different moments, and the strategies move them differently.

  - id: rendering-sequence
    kind: visual
    visual: sequence
    title:
      uk: "Що приходить першим: CSR, SSR і статична сторінка"
      en: "What arrives first: CSR, SSR and a static page"
    textEquivalent:
      uk: >-
        Учасники: збірка, сервер і браузер. CSR: браузер запитує /wishlist і отримує HTML з порожнім
        div id="root" — людина не бачить нічого корисного. Браузер завантажує app.js; коли код
        виконався, React рендерить «Завантаження…», і кнопка «Додати» вже працює. Потім код запитує
        /api/items, і лише після відповіді з’являється список. SSR: браузер запитує /wishlist, сервер
        сам бере дані, рендерить React у HTML для цього запиту й надсилає сторінку зі списком —
        людина одразу бачить вміст, але кнопка ще мертва. Браузер завантажує app.js, React у браузері
        проходить готовий HTML і чіпляє обробники (гідратація) — лише тепер кнопка працює.
        Статична сторінка: під час збірки React один раз рендерить help.html, файл викладають на
        сервер; браузер запитує /help і отримує той самий готовий файл, що й усі відвідувачі.
      en: >-
        Participants: the build, the server and the browser. CSR: the browser requests /wishlist and
        gets HTML with an empty div id="root" — the person sees nothing useful. The browser downloads
        app.js; once the code has run, React renders “Loading…”, and the Add button already works.
        Then the code requests /api/items, and only after the answer does the list appear. SSR: the
        browser requests /wishlist, the server fetches the data itself, renders React to HTML for
        this request and sends the page with the list — the person sees the content at once, but the
        button is still dead. The browser downloads app.js, React in the browser walks the ready HTML
        and attaches handlers (hydration) — only now does the button work. Static page: during the
        build React renders help.html once, the file is uploaded to the server; the browser requests
        /help and gets the same ready file as every other visitor.
    spec:
      actors:
        - { id: build, label: { uk: "Збірка", en: "Build" } }
        - { id: server, label: { uk: "Сервер", en: "Server" } }
        - { id: browser, label: { uk: "Браузер", en: "Browser" } }
      intro:
        uk: "Три способи показати сторінку. Стеж за двома моментами: коли людина вперше бачить вміст і коли вперше спрацьовує кнопка «Додати»."
        en: "Three ways to show a page. Watch two moments: when the person first sees content and when the Add button first works."
      messages:
        - from: browser
          to: server
          label: "GET /wishlist"
          caption:
            uk: "**CSR.** Браузер запитує сторінку списку бажань."
            en: "**CSR.** The browser requests the wishlist page."
        - from: server
          to: browser
          kind: return
          label: "<div id=\"root\"></div>"
          note: { uk: "екран порожній", en: "the screen is empty" }
          caption:
            uk: "Сервер віддає оболонку: порожній `div` і посилання на `app.js`. Людина поки не бачить нічого корисного."
            en: "The server sends the shell: an empty `div` and a link to `app.js`. The person sees nothing useful yet."
        - from: browser
          to: server
          label: "GET /assets/app.js"
          caption:
            uk: "Браузер завантажує бандл — на повільному телефоні це може тривати секунди."
            en: "The browser downloads the bundle — on a slow phone this can take seconds."
        - from: server
          to: browser
          kind: return
          label: "app.js"
          note: { uk: "«Завантаження…», кнопка працює", en: "“Loading…”, the button works" }
          caption:
            uk: "Код виконався: React рендерить перший раз — «Завантаження…». Обробники вже на місці, тож кнопка «Додати» працює з цієї миті."
            en: "The code has run: React renders for the first time — “Loading…”. The handlers are already in place, so the Add button works from this moment."
        - from: browser
          to: server
          label: "GET /api/items"
          caption:
            uk: "Лише тепер код дізнається, що показувати, і запитує дані."
            en: "Only now does the code find out what to show, and it requests the data."
        - from: server
          to: browser
          kind: return
          label: "JSON"
          note: { uk: "список на екрані", en: "the list is on the screen" }
          caption:
            uk: "Дані прийшли — з’являється список. У CSR перший корисний вміст і інтерактивність приходять разом, але пізно."
            en: "The data has arrived — the list appears. In CSR the first useful content and interactivity come together, but late."
        - from: browser
          to: server
          label: "GET /wishlist"
          caption:
            uk: "**SSR.** Той самий запит до сервера, що рендерить на кожен запит."
            en: "**SSR.** The same request, to a server that renders on every request."
        - from: server
          to: server
          kind: note
          label: { uk: "дані + рендер у HTML", en: "data + render to HTML" }
          caption:
            uk: "Сервер сам бере дані й запускає React: рендер стає текстом HTML. Обробників у тексті немає — функцію в HTML не запишеш."
            en: "The server fetches the data itself and runs React: the render becomes HTML text. There are no handlers in the text — a function cannot be written into HTML."
        - from: server
          to: browser
          kind: return
          label: { uk: "HTML зі списком", en: "HTML with the list" }
          note: { uk: "вміст видно, кнопка мертва", en: "content visible, button dead" }
          caption:
            uk: "Людина **одразу** бачить список. Але кнопка «Додати» поки лише намальована: клік нічого не робить."
            en: "The person sees the list **at once**. But the Add button is only drawn so far: a click does nothing."
        - from: browser
          to: server
          label: "GET /assets/app.js"
          caption:
            uk: "Браузер завантажує той самий бандл, що й у CSR. Його розмір від SSR не зменшився."
            en: "The browser downloads the same bundle as in CSR. SSR did not make it any smaller."
        - from: server
          to: browser
          kind: return
          label: "app.js"
          caption:
            uk: "Код прийшов і виконався."
            en: "The code has arrived and run."
        - from: browser
          to: browser
          kind: note
          label: { uk: "гідратація", en: "hydration" }
          note: { uk: "тепер кнопка працює", en: "now the button works" }
          caption:
            uk: "React у браузері проходить готовий HTML і чіпляє обробники — це [[hydration|гідратація]], про неї наступний урок. Лише тепер «Додати» реагує: SSR пришвидшив **перший показ**, а не інтерактивність."
            en: "React in the browser walks the ready HTML and attaches handlers — that is [[hydration]], the topic of the next lesson. Only now does Add respond: SSR sped up the **first view**, not interactivity."
        - from: build
          to: build
          kind: note
          label: { uk: "рендер help.html", en: "render help.html" }
          caption:
            uk: "**Статична сторінка.** Ще до публікації збірка один раз рендерить сторінку довідки в готовий файл `help.html`."
            en: "**Static page.** Before publishing, the build renders the help page once into a ready file, `help.html`."
        - from: build
          to: server
          kind: async
          label: { uk: "викласти файли", en: "upload the files" }
          caption:
            uk: "Файл викладають на сервер чи CDN. Сервер більше нічого не рендерить — лише віддає файл."
            en: "The file is uploaded to a server or a CDN. The server renders nothing any more — it only serves the file."
        - from: browser
          to: server
          label: "GET /help"
          caption:
            uk: "Відвідувач запитує довідку."
            en: "A visitor requests the help page."
        - from: server
          to: browser
          kind: return
          label: "help.html"
          note: { uk: "той самий файл для всіх", en: "the same file for everyone" }
          caption:
            uk: "Відповідь миттєва й однакова для всіх, доки сайт не зберуть знову. Якщо на сторінці є кнопки, їм так само потрібен JavaScript."
            en: "The answer is instant and the same for everyone until the site is built again. If the page has buttons, they need JavaScript just the same."

  - id: newsroom
    kind: analogy
    body:
      uk: "Уяви газету. **Статична сторінка** — надрукований уночі номер: його вже чекає купа примірників, кожен отримує той самий. **SSR** — працівник на стійці друкує тобі виписку саме зараз, саме для тебе: читати можна одразу, але щоб щось у ній змінити, треба дочекатися, поки він увімкне термінал. **CSR** — тобі дають чистий аркуш і набір для друку: поки не збереш його сам, читати нічого, зате потім усе в твоїх руках."
      en: "Think of a newspaper. A **static page** is the issue printed overnight: a stack of copies is already waiting, and everyone gets the same one. **SSR** is a clerk at the counter printing a statement right now, just for you: you can read it at once, but to change anything in it you have to wait until they switch on the terminal. **CSR** is being handed a blank sheet and a printing kit: there is nothing to read until you assemble it yourself, but then everything is in your hands."
    limits:
      uk: "Аналогія не показує, що один сайт часто змішує всі три способи — статичну довідку, серверну сторінку списку й клієнтські віджети. «Термінал» — це завантажений JavaScript і гідратація; «друк» у SSR не повторюється в браузері: React не перемальовує вже отриманий HTML. А статичну сторінку можна «передрукувати» будь-коли новою збіркою."
      en: "The analogy does not show that one site often mixes all three ways — a static help page, a server-rendered list page and client widgets. The “terminal” is the downloaded JavaScript and hydration; the “printing” of SSR is not repeated in the browser: React does not redraw the HTML it received. And a static page can be “reprinted” at any time by a new build."

  - id: predict-add-responds
    kind: prediction
    lang: text
    runnable: false
    prompt:
      uk: "Ось траса сторінки, яку сервер відрендерив для цього запиту. Коли людина **вперше** зможе натиснути «Додати» так, щоб щось сталося?"
      en: "Here is a trace of a page the server rendered for this request. When can the person **first** press Add and have something happen?"
    code: |
      0 ms    GET /wishlist       -> 200 text/html, 6 KB
              <h1>Wishlist</h1><ul><li>Headphones</li>…</ul><button>Add</button>
      120 ms  the browser shows the list and the button
      140 ms  GET /assets/app.js  -> 200, 180 KB, finished at 900 ms
      930 ms  React in the browser has attached the handlers
    answer:
      type: choice
      options:
        - id: at-930
          text: { uk: "Близько 930 мс — коли код завантажився і React приєднав обробники", en: "At about 930 ms — when the code has loaded and React has attached the handlers" }
        - id: at-120
          text: { uk: "Близько 120 мс — кнопку вже видно, отже вона працює", en: "At about 120 ms — the button is already visible, so it works" }
          why:
            uk: "Сервер надіслав лише текст HTML. Обробник `onClick` — функція, а функцію в HTML не запишеш; її приносить `app.js`. До 930 мс кнопка лише намальована."
            en: "The server sent only HTML text. An `onClick` handler is a function, and a function cannot be written into HTML; `app.js` brings it. Until 930 ms the button is only drawn."
        - id: at-0
          text: { uk: "Одразу: клік обробляє сервер, тож JavaScript у браузері не потрібен", en: "At once: the server handles the click, so no JavaScript is needed in the browser" }
          why:
            uk: "Сервер рендерить і відповідає на запити, але клік у браузері обробляє лише JavaScript у браузері. Після надсилання HTML сервер про цю сторінку вже нічого не знає."
            en: "The server renders and answers requests, but a click in the browser is handled only by JavaScript in the browser. Once the HTML is sent, the server knows nothing more about this page."
        - id: at-900
          text: { uk: "Ніколи: сторінку відрендерено на сервері, тож у браузері вона залишиться статичною", en: "Never: the page was rendered on the server, so it stays static in the browser" }
          why:
            uk: "Після завантаження `app.js` React у браузері підхоплює сторінку, і далі вона працює, як звичайний React-застосунок."
            en: "Once `app.js` has loaded, React in the browser takes over the page, and from then on it works like an ordinary React app."
      correct: [at-930]
    explanation:
      uk: "SSR пришвидшує **перший показ**: список видно вже на 120 мс. Але інтерактивність чекає на той самий бандл, що й у CSR, — тут до 930 мс. Між цими моментами людина бачить кнопку, яка не реагує. Тому SSR не робить сторінку інтерактивною швидше, а лише раніше показує вміст."
      en: "SSR speeds up the **first view**: the list is visible as early as 120 ms. But interactivity waits for the same bundle as in CSR — here until 930 ms. Between those moments the person sees a button that does not respond. So SSR does not make a page interactive sooner; it only shows the content earlier."

  - id: csr-timeline
    kind: example
    runtime: browser-react
    dir: csr-timeline
    entry: main.jsx
    strings:
      htmlArrived: { uk: "HTML прийшов — на сторінці лише <div id=\"root\"></div>", en: "HTML arrived — the page holds only <div id=\"root\"></div>" }
      jsRan: { uk: "JavaScript виконався — React рендерить уперше", en: "JavaScript ran — React renders for the first time" }
      dataArrived: { uk: "дані прийшли — список на екрані", en: "data arrived — the list is on the screen" }
      clickHandled: { uk: "клік оброблено", en: "click handled" }
      title: { uk: "Список бажань", en: "Wishlist" }
      add: { uk: "Додати", en: "Add" }
      pressed: { uk: "Натиснуто «Додати»:", en: "Add pressed:" }
      loading: { uk: "Завантаження…", en: "Loading…" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
    title:
      uk: "Рендеринг на клієнті з часовою шкалою"
      en: "Client-side rendering with a timeline"
    body:
      uk: |
        Пісочниця вміє лише одне з трьох: рендерити на клієнті. Сервера, який рендерить React, тут немає, тож CSR — єдина стратегія, яку цей урок **справді** запускає.

        `main.jsx` — це «бандл»: таймер на `BUNDLE_MS` мілісекунд підміняє завантаження JavaScript мережею (у пісочниці всі файли вже є). `App.jsx` після першого рендеру «запитує» дані, що приходять через `DATA_MS`. Консоль друкує, на якій мілісекунді сталася кожна подія.

        Натисни **Запустити** й дивись на вкладку «Сторінка» та консоль.
      en: |
        The sandbox can do only one of the three: render on the client. There is no server rendering React here, so CSR is the only strategy this lesson **actually** runs.

        `main.jsx` is “the bundle”: a timer of `BUNDLE_MS` milliseconds stands in for downloading the JavaScript over the network (in the sandbox every file is already there). After the first render `App.jsx` “requests” the data, which arrives after `DATA_MS`. The console prints the millisecond at which each event happened.

        Press **Run** and watch the Page tab and the console.
    tryIt:
      uk: |
        1. Запусти й одразу дивись на сторінку: перші ~600 мс вона порожня. Потім з’являються заголовок, «Завантаження…» й кнопка, ще за ~400 мс — список.
        2. Запусти ще раз і натисни «Додати», поки видно «Завантаження…». Клік оброблено: у CSR кнопка працює з тієї миті, коли її видно.
        3. У `main.jsx` зміни `BUNDLE_MS` на `1200`, а в `App.jsx` `DATA_MS` на `800`. Запусти: порожній екран тримається вдвічі довше, а список з’являється аж на ~2 с. Саме цю порожнечу SSR і статична сторінка заповнюють готовим HTML — але кнопка в них однаково чекала б на `app.js`.
      en: |
        1. Run it and watch the page right away: for the first ~600 ms it is empty. Then the heading, “Loading…” and the button appear, and ~400 ms later the list.
        2. Run it again and press Add while “Loading…” is visible. The click is handled: in CSR the button works from the moment it is visible.
        3. In `main.jsx` change `BUNDLE_MS` to `1200`, and in `App.jsx` change `DATA_MS` to `800`. Run: the empty screen lasts twice as long, and the list appears only at ~2 s. This emptiness is exactly what SSR and a static page fill with ready HTML — but their button would still wait for `app.js`.

  - id: choosing
    kind: explanation
    title:
      uk: "Як обрати: свіжість, персоналізація, перший показ"
      en: "How to choose: freshness, personalisation, first view"
    body:
      uk: |
        Постав сторінці три запитання:

        - **Чи однакова вона для всіх і чи рідко змінюється?** Довідка, лендінг, список статей — статична генерація: найдешевше й найшвидше, але зміна з’явиться лише після нової збірки.
        - **Чи залежить вона від того, хто запитує, або від даних «саме зараз», і чи важливий перший показ?** Публічна сторінка товару з актуальною ціною, сторінка, яку мають бачити пошукові системи, — SSR. Платиш сервером, що працює на кожен запит, і затримкою, поки він рендерить.
        - **Чи вона за входом, особиста й дуже інтерактивна?** Особистий кабінет, редактор — CSR підходить: пошуковикам її не видно, а людина й так чекає на дані про себе. Платиш порожнім екраном на початку.

        Статична сторінка не «заморожена»: те, що змінюється, клієнтський компонент може дочитати вже в браузері. А SSR не скасовує бандл — кнопки в усіх трьох стратегіях оживлює той самий JavaScript.
      en: |
        Ask a page three questions:

        - **Is it the same for everyone and does it rarely change?** A help page, a landing page, a list of articles — static generation: cheapest and fastest, but a change appears only after a new build.
        - **Does it depend on who asks or on data “right now”, and does the first view matter?** A public product page with the current price, a page search engines must see — SSR. You pay with a server working on every request, and with a delay while it renders.
        - **Is it behind a login, personal and highly interactive?** A personal dashboard, an editor — CSR fits: search engines cannot see it anyway, and the person is waiting for data about themselves regardless. You pay with an empty screen at the start.

        A static page is not “frozen”: whatever changes can be fetched by a client component in the browser. And SSR does not cancel the bundle — in all three strategies the buttons are brought to life by the same JavaScript.

  - id: predict-static-fresh
    kind: prediction
    prompt:
      uk: "Сторінку довідки трекера звичок зібрано статично 1 березня. У ній є маленький клієнтський компонент, який після завантаження запитує `/api/status` і показує, чи працює синхронізація. Сьогодні синхронізація зламалася. Що побачить відвідувач, який відкрив довідку сьогодні?"
      en: "The help page of the habit tracker was built statically on 1 March. It contains a small client component that requests `/api/status` after loading and shows whether syncing works. Today syncing broke. What does a visitor who opens the help page today see?"
    answer:
      type: choice
      options:
        - id: help-plus-today
          text: { uk: "Текст довідки з 1 березня і сьогоднішній стан: «синхронізація не працює»", en: "The help text from 1 March and today’s status: “syncing is not working”" }
        - id: frozen
          text: { uk: "Стан на 1 березня: статична сторінка не може показати нічого, що змінилося після збірки", en: "The status as of 1 March: a static page cannot show anything that changed after the build" }
          why:
            uk: "Статичним є лише HTML, зроблений під час збірки. JavaScript у браузері працює на ній так само, як на будь-якій сторінці, і може запитати свіжі дані."
            en: "Only the HTML made during the build is static. JavaScript in the browser works on it like on any page and can request fresh data."
        - id: rebuilt
          text: { uk: "Сервер помітить зміну й перезбере сторінку для цього відвідувача", en: "The server notices the change and rebuilds the page for this visitor" }
          why:
            uk: "Так працював би SSR. Статичний файл сервер лише віддає; новий HTML з’явиться після нової збірки."
            en: "That is how SSR would work. A static file is only served; new HTML appears after a new build."
      correct: [help-plus-today]
    explanation:
      uk: "Статичний HTML однаковий для всіх і змінюється лише новою збіркою — але це стосується тільки того, що відрендерено під час збірки. Клієнтський компонент на статичній сторінці дочитує свіжі дані в браузері, як у CSR. Такі змішані сторінки — звичайна практика."
      en: "Static HTML is the same for everyone and changes only with a new build — but that concerns only what was rendered during the build. A client component on a static page fetches fresh data in the browser, as in CSR. Such mixed pages are common practice."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: рендер і commit"
      en: "Recall: render and commit"
    items:
      - id: server-has-no-dom
        from: re-01-06-render-vs-commit
        prompt:
          uk: "На сервері немає DOM: ні `document`, ні елементів на екрані. Яку частину роботи React можна виконати там, щоб отримати HTML?"
          en: "There is no DOM on a server: no `document`, no elements on a screen. Which part of React’s work can be done there to produce HTML?"
        answer:
          type: choice
          options:
            - id: render
              text: { uk: "Рендер: виклик компонентів, що описує, яким має бути інтерфейс", en: "Render: calling the components, which describes what the interface should be" }
            - id: commit
              text: { uk: "Commit: внесення змін у DOM", en: "Commit: applying the changes to the DOM" }
              why:
                uk: "Commit змінює справжні вузли DOM. На сервері їх немає — там опис інтерфейсу перетворюють на текст HTML."
                en: "Commit changes real DOM nodes. There are none on a server — there the description of the interface is turned into HTML text."
            - id: effects
              text: { uk: "Ефекти: вони запускаються першими й готують дані", en: "Effects: they run first and prepare the data" }
              why:
                uk: "Ефекти запускаються після commit, тобто вже в браузері. На сервері вони не виконуються взагалі."
                en: "Effects run after commit, so in the browser. They do not run on a server at all."
          correct: [render]
        explanation:
          uk: "Рендер — це чисті виклики компонентів, які повертають опис інтерфейсу. Такий опис можна перетворити на HTML без жодного DOM. Саме тому компонент, який рендериться на сервері, мусить бути чистим: не читати годинник браузера, `localStorage` чи `window`."
          en: "A render is pure calls of components that return a description of the interface. Such a description can be turned into HTML without any DOM. That is exactly why a component that is rendered on a server must be pure: not read the browser’s clock, `localStorage` or `window`."

  - id: help-page
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: help-page
    entry: main.jsx
    editable: [HelpPage.jsx]
    strings:
      title: { uk: "Довідка", en: "Help" }
      updated: { uk: "Оновлено", en: "Updated" }
      qAdd: { uk: "Як додати бажання?", en: "How do I add a wish?" }
      aAdd: { uk: "Введи назву й, за бажанням, ціну, а потім натисни «Додати».", en: "Enter a name and, if you like, a price, then press “Add”." }
      qAcquired: { uk: "Що означає «Отримано»?", en: "What does “Acquired” mean?" }
      aAcquired: { uk: "Бажання вже здійснилося; воно лишається в списку, але не входить у суму.", en: "The wish has come true; it stays in the list but is not counted in the total." }
      qStorage: { uk: "Де зберігаються мої бажання?", en: "Where are my wishes stored?" }
      aStorage: { uk: "Лише в цьому браузері, на твоєму комп’ютері.", en: "Only in this browser, on your computer." }
    title:
      uk: "Довідка, яку можна зібрати статично"
      en: "A help page that can be built statically"
    instructions:
      uk: |
        `HelpPage` має стати сторінкою, яку збірка може відрендерити **один раз** і віддавати всім. Зараз її розмітка залежить від годинника браузера й від `localStorage` — на сервері збірки такого немає, а в різних людей воно різне.

        Перепиши `HelpPage.jsx` так, щоб розмітка залежала **лише від пропсів**:

        - заголовок `title`;
        - рядок «Оновлено: …» з датою з пропа `updatedOn` (без перетворень);
        - кожне запитання з `questions` **разом із відповіддю** — не лише «відкрите». Щоб відповіді можна було згортати без JavaScript, придасться HTML-пара `<details>` / `<summary>`, але це не обов’язково.

        Перевірки рендерять `HelpPage` двічі з тими самими пропсами: один раз — із годинником, переведеним на 400 днів уперед, другий — з іншими значеннями в `localStorage`. Розмітка має збігатися до символу.
      en: |
        `HelpPage` should become a page that the build can render **once** and serve to everyone. Right now its markup depends on the browser’s clock and on `localStorage` — the build server has neither, and they differ from person to person.

        Rewrite `HelpPage.jsx` so that the markup depends **only on props**:

        - the `title` heading;
        - an “Updated: …” line with the date from the `updatedOn` prop (unchanged);
        - every question from `questions` **together with its answer** — not just the “open” one. The HTML pair `<details>` / `<summary>` lets answers fold without any JavaScript, but it is not required.

        The checks render `HelpPage` twice with the same props: once with the clock moved 400 days ahead, once with other values in `localStorage`. The markup must match character for character.
    testTitles:
      "shows the title, the date from updatedOn and every question with its answer":
        uk: "Видно заголовок, дату з `updatedOn` і кожне запитання з відповіддю"
        en: "Shows the title, the date from `updatedOn` and every question with its answer"
      "the same props give the same markup when the clock changes":
        uk: "Ті самі пропси дають ту саму розмітку, коли змінюється годинник"
        en: "The same props give the same markup when the clock changes"
      "the same props give the same markup when stored values change":
        uk: "Ті самі пропси дають ту саму розмітку, коли змінюються значення в `localStorage`"
        en: "The same props give the same markup when stored values change"
    hints:
      nudge:
        uk: "Знайди в компоненті кожен рядок, що бере значення **не** з пропсів. Звідки сторінка, зібрана 1 березня, може знати дату оновлення?"
        en: "Find every line in the component that takes a value **not** from the props. Where can a page built on 1 March know its update date from?"
      explanation:
        uk: |
          Компонент для статичної збірки — чиста функція пропсів: усе, що він показує, приходить ззовні. Дата «оновлено» — це дата, коли текст написали, а не «сьогодні». А «яке запитання відкрити» — це рішення конкретної людини в її браузері; статична сторінка показує всі відповіді й дає браузеру їх згортати. Схожий приклад для іншої сторінки:

          ```jsx
          function Changelog({ version, releasedOn, notes }) {
            return <p>{`${version} — ${releasedOn}`}</p>; // releasedOn приходить пропом
          }
          ```
        en: |
          A component for a static build is a pure function of its props: everything it shows comes from outside. The “updated” date is the date the text was written, not “today”. And “which question to open” is a decision of a particular person in their browser; a static page shows every answer and lets the browser fold them. A similar example for another page:

          ```jsx
          function Changelog({ version, releasedOn, notes }) {
            return <p>{`${version} — ${releasedOn}`}</p>; // releasedOn comes in as a prop
          }
          ```
    solutionNote:
      uk: "Тепер розмітка — функція лише пропсів, тож збірка може відрендерити сторінку один раз, і в кожного відвідувача вона буде та сама. `<details>` згортає відповіді засобами самого браузера: для цього не потрібен ні JavaScript, ні збережений стан. Те, що справді залежить від людини (останнє відкрите запитання), можна додати пізніше маленьким клієнтським компонентом, що читає `localStorage` вже після показу."
      en: "Now the markup is a function of the props only, so the build can render the page once, and it is the same for every visitor. `<details>` folds the answers with the browser’s own means: neither JavaScript nor stored state is needed for that. What really depends on the person (the question opened last) can be added later by a small client component that reads `localStorage` after the page is shown."
    feedback:
      - when: { test: "shows the title, the date from updatedOn and every question with its answer" }
        message:
          uk: "Ця перевірка чекає в тексті сторінки заголовок «Довідка», рядок «Оновлено: 2026-03-01» і **всі три** запитання з відповідями. Якщо видно лише одну відповідь, прибери умову, що показує тільки «відкрите» запитання. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check expects the page text to contain the heading “Help”, the line “Updated: 2026-03-01” and **all three** questions with their answers. If only one answer is visible, remove the condition that shows only the “open” question. If every check fails at once, fix the first error in the console first."
      - when: { test: "the same props give the same markup when the clock changes" }
        message:
          uk: "Ця перевірка рендерить сторінку двічі, вдруге — з годинником на 400 днів уперед, і чекає однакову розмітку. Значення з `new Date()` чи `Date.now()` у рендері її змінюють; дата має прийти з пропа `updatedOn`."
          en: "This check renders the page twice, the second time with the clock 400 days ahead, and expects the same markup. A value from `new Date()` or `Date.now()` in the render changes it; the date has to come from the `updatedOn` prop."
      - when: { test: "the same props give the same markup when stored values change" }
        message:
          uk: "Ця перевірка рендерить сторінку двічі з різними значеннями в `localStorage` і чекає однакову розмітку. Будь-яке читання `localStorage` у рендері — навіть лише для атрибута `open` — робить сторінку різною для різних людей."
          en: "This check renders the page twice with different values in `localStorage` and expects the same markup. Any read of `localStorage` in the render — even just for the `open` attribute — makes the page differ from person to person."

  - id: to-project
    kind: transfer
    capstoneStep: RE-11
    body:
      uk: "Подумай про сторінки свого проєкту: список, форму, підсумки. Яка з них однакова для всіх, яка залежить від даних «саме зараз», а яка особиста? У кроці проєкту цього блоку ти позначиш межу клієнт/сервер у дереві компонентів на папері — уже зараз запиши, які компоненти рендеряться лише з пропсів, а які читають годинник, `localStorage` чи обробляють кліки."
      en: "Think about the pages of your project: the list, the form, the totals. Which of them is the same for everyone, which depends on data “right now”, and which is personal? In this unit’s project step you will mark the client/server boundary in the component tree on paper — already now, note which components render from props only and which read the clock, `localStorage` or handle clicks."
