id: re-11-03-server-client-components
unit: RE-11
title:
  uk: "Серверні й клієнтські компоненти та серіалізація"
  en: "Server/client components and serialization"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Позначити, які компоненти дерева мусять бути клієнтськими (стан, ефекти, обробники подій, браузерні API), а які можуть лишитися серверними."
    en: "Mark which components in a tree must be client components (state, effects, event handlers, browser APIs) and which can stay server components."
  - uk: "Передбачити, які пропси можуть перейти від серверного компонента до клієнтського (звичайні дані, масиви, `Date`, `Map`, `Set`), а які ні (звичайні функції, екземпляри класів)."
    en: "Predict which props can cross from a server to a client component (plain data, arrays, Date, Map, Set) and which cannot (ordinary functions, class instances)."
prerequisites: [re-11-02-hydration-mismatch, js-07-04-json]
subskills:
  - { family: R-09, skill: "server/client components and serialization", depth: intro }
glossary: [server-component, client-component, serialization-boundary]
selfCheck: [predict-use-client, predict-crossing, crossable]

blocks:
  - id: two-kinds
    kind: explanation
    title:
      uk: "Два види компонентів і межа між ними"
      en: "Two kinds of components and the boundary between them"
    body:
      uk: |
        SSR рендерить на сервері **все** дерево, а потім браузер завантажує код **усього** дерева, щоб його гідратувати. Навіть компонент, що лише показує текст, їде в бандл. React Server Components ділять дерево на два види:

        - [[server-component|Серверний компонент]] рендериться лише на сервері (чи під час збірки) і в бандл не потрапляє. Може читати дані напряму, але не має стану, ефектів чи обробників — бо в браузері його немає.
        - [[client-component|Клієнтський компонент]] — компонент із модуля, що починається рядком коду `"use client"`, або з модуля, який такий модуль імпортує. Його код їде в браузер, тож він може мати `useState`, `useEffect`, `onClick` і браузерні API. Важливо: на першому завантаженні фреймворк **теж** рендерить його в HTML на сервері, а в браузері гідратує. `"use client"` означає «цей код є і в браузері», а не «лише в браузері».

        Серверний компонент передає клієнтському пропси. Але функції в HTML чи в мережевій відповіді не передаси — тож через цю [[serialization-boundary|межу серіалізації]] проходять лише дані.
      en: |
        SSR renders the **whole** tree on the server, and then the browser downloads the code of the **whole** tree to hydrate it. Even a component that only shows text goes into the bundle. React Server Components split the tree into two kinds:

        - A [[server-component]] renders only on the server (or during the build) and does not get into the bundle. It may read data directly, but it has no state, effects or handlers — because it does not exist in the browser.
        - A [[client-component]] is a component from a module that starts with the line `"use client"`, or from a module such a module imports. Its code goes to the browser, so it can have `useState`, `useEffect`, `onClick` and browser APIs. Important: on the first load a framework **also** renders it to HTML on the server, and hydrates it in the browser. `"use client"` means “this code exists in the browser too”, not “only in the browser”.

        A server component passes props to a client component. But a function cannot be sent in HTML or in a network response — so only data crosses this [[serialization-boundary]].

  - id: parcel
    kind: analogy
    body:
      uk: "Межа — як посилка з сервера до браузера. У коробку можна покласти речі: текст, числа, списки, дату в календарі, набір карток. А от «зателефонуй мені, коли натиснеш» у коробку не покладеш: дзвінок — не річ. Тому той, хто отримав посилку, має власний телефон — клієнтський компонент сам володіє своїм обробником."
      en: "The boundary is like a parcel from the server to the browser. You can put things in the box: text, numbers, lists, a date on a calendar, a set of cards. But “call me when you press it” cannot go in the box: a call is not a thing. So whoever receives the parcel has their own phone — a client component owns its handler itself."
    limits:
      uk: "React пакує більше, ніж JSON: `Date`, `Map`, `Set`, проміси й JSX проходять. Є й виняток для функцій — Server Functions з `\"use server\"`: через межу йде не сама функція, а посилання на неї, ніби номер телефону, за яким браузер дзвонить на сервер. А код самих клієнтських компонентів їде окремо — у бандлі, не в «посилці» пропсів."
      en: "React packs more than JSON: `Date`, `Map`, `Set`, promises and JSX get through. There is an exception for functions too — Server Functions marked `\"use server\"`: what crosses is not the function itself but a reference to it, like a phone number the browser calls the server on. And the code of the client components travels separately — in the bundle, not in the “parcel” of props."

  - id: boundary-diagram
    kind: visual
    visual: diagram
    strings:
      fnLabel: { uk: "onToggle: ƒ — не проходить", en: "onToggle: ƒ — rejected" }
    title:
      uk: "Дерево списку бажань: де проходить межа"
      en: "The wishlist tree: where the boundary runs"
    textEquivalent:
      uk: >-
        Дерево сторінки списку бажань у застосунку з серверними компонентами. Серверна частина:
        WishlistPage читає бажання, ItemList розкладає їх, Totals рахує суму, ItemCard показує одне
        бажання — жоден не має стану чи обробників. Клієнтська частина: AddItemForm (стан полів,
        onSubmit) і AcquiredToggle (стан, onClick). Стрілки через межу несуть дані: WishlistPage
        передає AddItemForm список категорій (масив), ItemCard передає AcquiredToggle id (текст) і
        acquired (булеве значення). Стрілка, що несла б від ItemCard до AcquiredToggle функцію
        onToggle, не проходить: функцію не можна серіалізувати. Тому AcquiredToggle сам володіє
        обробником.
      en: >-
        The tree of the wishlist page in an app with server components. The server part: WishlistPage
        reads the wishes, ItemList lays them out, Totals sums them, ItemCard shows one wish — none of
        them has state or handlers. The client part: AddItemForm (field state, onSubmit) and
        AcquiredToggle (state, onClick). Arrows across the boundary carry data: WishlistPage passes
        AddItemForm the list of categories (an array), ItemCard passes AcquiredToggle an id (text)
        and acquired (a boolean). An arrow that would carry the function onToggle from ItemCard to
        AcquiredToggle is rejected: a function cannot be serialized. So AcquiredToggle owns its
        handler itself.
    spec:
      layout: tb
      groups:
        - { id: server, label: { uk: "Сервер: без стану й обробників", en: "Server: no state, no handlers" } }
        - { id: client, label: { uk: "Клієнт: \"use client\"", en: "Client: \"use client\"" } }
      nodes:
        - { id: page, group: server, label: "WishlistPage" }
        - { id: list, group: server, label: "ItemList" }
        - { id: totals, group: server, label: "Totals" }
        - { id: card, group: server, label: "ItemCard" }
        - { id: form, group: client, label: "AddItemForm" }
        - { id: toggle, group: client, label: "AcquiredToggle" }
      edges:
        - { from: page, to: list }
        - { from: page, to: totals }
        - { from: list, to: card }
        - { id: categories, from: page, to: form, label: "categories: [ … ]" }
        - { id: data, from: card, to: toggle, label: "id, acquired: false" }
        - { id: fn, from: card, to: toggle, label: "%%fnLabel%%", kind: dashed }
      hidden: [fn]
      steps:
        - caption:
            uk: "Дерево сторінки списку бажань. Верхня рамка — серверні компоненти, нижня — клієнтські."
            en: "The tree of the wishlist page. The upper frame holds server components, the lower one client components."
        - highlight: [page, list, totals, card]
          dim: [form, toggle]
          caption:
            uk: "`WishlistPage`, `ItemList`, `Totals`, `ItemCard` лише показують дані: ні стану, ні обробників. Вони можуть лишитися на сервері, і їхнього коду в бандлі не буде."
            en: "`WishlistPage`, `ItemList`, `Totals` and `ItemCard` only show data: no state, no handlers. They can stay on the server, and their code will not be in the bundle."
        - highlight: [form, toggle]
          dim: [page, list, totals, card]
          caption:
            uk: "`AddItemForm` має стан полів і `onSubmit`, `AcquiredToggle` — стан і `onClick`. Їм потрібен браузер, тому їхні модулі починаються з `\"use client\"`."
            en: "`AddItemForm` has field state and `onSubmit`, `AcquiredToggle` has state and `onClick`. They need the browser, so their modules start with `\"use client\"`."
        - highlight: [categories, data]
          caption:
            uk: "Через межу йдуть дані: масив категорій, текстовий `id`, булеве `acquired`. React серіалізує їх і відтворює в браузері."
            en: "Data crosses the boundary: an array of categories, a text `id`, a boolean `acquired`. React serializes them and recreates them in the browser."
        - show: [fn]
          highlight: [fn]
          annotate:
            - { id: fn, text: { uk: "функцію не серіалізувати", en: "a function cannot be serialized" } }
          caption:
            uk: "А пропс `onToggle` — функція — не пройде: її код живе на сервері, і в браузер його не передати. Тому обробник створює сам `AcquiredToggle`."
            en: "But the `onToggle` prop — a function — is rejected: its code lives on the server and cannot be handed to the browser. So `AcquiredToggle` creates the handler itself."

  - id: predict-use-client
    kind: prediction
    lang: jsx
    runnable: false
    prompt:
      uk: "Дерево планувальника в застосунку з серверними компонентами. Які компоненти **мусять** бути клієнтськими (`\"use client\"`)? Познач усі."
      en: "The planner tree in an app with server components. Which components **must** be client components (`\"use client\"`)? Mark all of them."
    code: |
      PlannerPage({ today })      // reads tasks from the database, renders TaskList and DueCount
      DueCount({ tasks, today })  // returns the number of tasks due on or before `today`
      TaskList({ tasks })         // tasks.map(task => <TaskRow task={task} />)
      TaskRow({ task })           // title, due date, <DoneToggle />, <PrioritySelect />
      DoneToggle({ id, done })    // useState(done); onChange saves the new value
      PrioritySelect({ id, value }) // <select onChange={…}>
      DueDateLabel({ iso })       // shows iso, then in useEffect: the date in the reader's language
    answer:
      type: multi
      options:
        - { id: page, code: "PlannerPage" }
        - { id: due-count, code: "DueCount" }
        - { id: task-list, code: "TaskList" }
        - { id: task-row, code: "TaskRow" }
        - { id: done-toggle, code: "DoneToggle" }
        - { id: priority, code: "PrioritySelect" }
        - { id: due-label, code: "DueDateLabel" }
      correct: [done-toggle, priority, due-label]
    explanation:
      uk: "`DoneToggle` має стан і обробник, `PrioritySelect` — обробник `onChange`: обидва потребують браузера. `DueDateLabel` використовує ефект, щоб після монтування показати дату мовою читача, — серверний компонент ефектів не має. Решта лише показує дані з пропсів: `TaskRow` рендерить клієнтських дітей, але сам може лишитися серверним. `DueCount` рахує від переданого `today`, а не від годинника, тож теж серверний."
      en: "`DoneToggle` has state and a handler, `PrioritySelect` an `onChange` handler: both need the browser. `DueDateLabel` uses an effect to show the date in the reader’s language after mount — a server component has no effects. The rest only shows data from props: `TaskRow` renders client children but can itself stay a server component. `DueCount` counts from the passed-in `today`, not from the clock, so it is a server component too."

  - id: what-crosses
    kind: explanation
    title:
      uk: "Що проходить межу"
      en: "What crosses the boundary"
    body:
      uk: |
        За довідкою React (`"use client"`), від серверного компонента до клієнтського проходять:

        - примітиви: текст, числа, `bigint`, булеві, `null`, `undefined`;
        - масиви, `Map`, `Set` і **звичайні** об’єкти (створені через `{ … }`) — якщо всередині теж лише такі значення;
        - `Date`, проміси, JSX і Server Functions (`"use server"`).

        **Не** проходять: звичайні функції (обробники, колбеки сортування), класи та екземпляри класів (`new Budget(…)` — разом із методами).

        Це ширше, ніж [[serialization|JSON]]: `JSON.stringify` перетворює `Date` на текст, а `Map` — на `{}`, а React їх відтворює. Але принцип той самий: межу перетинає **значення**, а не код.
      en: |
        According to the React reference (`"use client"`), these cross from a server component to a client component:

        - primitives: text, numbers, `bigint`, booleans, `null`, `undefined`;
        - arrays, `Map`, `Set` and **plain** objects (created with `{ … }`) — if everything inside is such values too;
        - `Date`, promises, JSX and Server Functions (`"use server"`).

        These do **not** cross: ordinary functions (handlers, sort callbacks), classes and class instances (`new Budget(…)` — together with its methods).

        This is wider than [[serialization|JSON]]: `JSON.stringify` turns a `Date` into text and a `Map` into `{}`, while React recreates them. But the principle is the same: what crosses the boundary is a **value**, not code.

  - id: predict-crossing
    kind: prediction
    lang: jsx
    runnable: false
    prompt:
      uk: "Серверний компонент рендерить клієнтський `<HabitCard … />` з такими пропсами. Які пропси **не** пройдуть межу? Познач усі."
      en: "A server component renders the client `<HabitCard … />` with these props. Which props will **not** cross the boundary? Mark all of them."
    code: |
      class Streak {
        constructor(days) { this.days = days; }
        isLong() { return this.days >= 7; }
      }

      <HabitCard
        id="h-01"
        completions={["2026-02-27", "2026-02-28", "2026-03-01"]}
        startedOn={new Date("2026-02-01")}
        weekdays={new Set([1, 3, 5])}
        streak={new Streak(3)}
        onComplete={() => markDone("h-01")}
        sortDays={(a, b) => a.localeCompare(b)}
      />
    answer:
      type: multi
      options:
        - { id: id, code: "id" }
        - { id: completions, code: "completions" }
        - { id: started, code: "startedOn" }
        - { id: weekdays, code: "weekdays" }
        - { id: streak, code: "streak" }
        - { id: on-complete, code: "onComplete" }
        - { id: sort-days, code: "sortDays" }
      correct: [streak, on-complete, sort-days]
    explanation:
      uk: "`onComplete` і `sortDays` — звичайні функції, `streak` — екземпляр класу з методом `isLong`. Ці три не пройдуть. `Date` і `Set` пройдуть, хоча JSON їх зіпсував би. Як виправити: передай `streakDays={3}` замість об’єкта, а обробник і сортування нехай створює сам клієнтський `HabitCard`."
      en: "`onComplete` and `sortDays` are ordinary functions, `streak` is a class instance with an `isLong` method. These three will not cross. `Date` and `Set` will, although JSON would spoil them. The fix: pass `streakDays={3}` instead of the object, and let the client `HabitCard` create the handler and the sorting itself."

  - id: item-card
    kind: example
    runtime: browser-react
    dir: item-card
    entry: main.jsx
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      acquired: { uk: "отримано", en: "acquired" }
      wanted: { uk: "бажане", en: "wanted" }
    title:
      uk: "Картка з обробником від батька — і без нього"
      en: "A card with a handler from its parent — and without one"
    body:
      uk: |
        Тут усе — звичайний клієнтський React: пісочниця не вміє серверних компонентів. Але структуру можна підготувати. `ItemList` хотілося б зробити серверним, проте він тримає стан і створює для кожної картки функцію `onToggle`. `ItemCard` друкує в консоль, якого типу кожен його пропс.

        `AcquiredToggle.jsx` уже готовий, але поки не використовується. Рядок `"use client"` у ньому у фреймворку позначив би межу; тут він нічого не змінює.
      en: |
        Everything here is ordinary client React: the sandbox cannot do server components. But the structure can be prepared. We would like `ItemList` to be a server component, but it keeps state and creates an `onToggle` function for every card. `ItemCard` prints the type of each of its props to the console.

        `AcquiredToggle.jsx` is ready but not used yet. The `"use client"` line in it would mark the boundary in a framework; here it changes nothing.
    tryIt:
      uk: |
        1. Запусти: консоль показує `item: object, onToggle: function`. Функцію серверний компонент передати не зможе.
        2. У `ItemCard.jsx` додай угорі `import AcquiredToggle from "./AcquiredToggle";`, заміни `const { item, onToggle } = props;` на `const { item } = props;`, а весь `<button …>…</button>` — на `<AcquiredToggle id={item.id} initialAcquired={item.acquired} />`.
        3. У `ItemList.jsx` видали ` onToggle={() => toggle(item.id)}`. Запусти: тепер `ItemCard` отримує лише `item: object`, а клік і далі перемикає й друкує `PATCH …`.
        4. Тепер стан і `toggle` у `ItemList` нікому не потрібні: видали рядок з `useState`, функцію `toggle`, імпорти `useState` і `saveAcquired`, а `list.map` заміни на `items.map`. Запусти: усе працює, а `ItemList` і `ItemCard` більше не мають ні стану, ні обробників — їх можна було б зробити серверними.
      en: |
        1. Run it: the console shows `item: object, onToggle: function`. A server component could not pass the function.
        2. In `ItemCard.jsx` add `import AcquiredToggle from "./AcquiredToggle";` at the top, replace `const { item, onToggle } = props;` with `const { item } = props;`, and the whole `<button …>…</button>` with `<AcquiredToggle id={item.id} initialAcquired={item.acquired} />`.
        3. In `ItemList.jsx` delete ` onToggle={() => toggle(item.id)}`. Run: now `ItemCard` gets only `item: object`, and a click still toggles and prints `PATCH …`.
        4. Now nobody needs the state and `toggle` in `ItemList`: delete the `useState` line, the `toggle` function, the imports of `useState` and `saveAcquired`, and replace `list.map` with `items.map`. Run: everything works, and `ItemList` and `ItemCard` no longer have state or handlers — they could be made server components.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: JSON і запити з сервера"
      en: "Recall: JSON and requests from a server"
    items:
      - id: json-loses
        from: js-07-04-json
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const task = { id: "t-01", due: new Date(Date.UTC(2026, 2, 1)), onDone() {}, note: undefined };
          console.log(JSON.stringify(task));
        verify: { logs: ['{"id":"t-01","due":"2026-03-01T00:00:00.000Z"}'] }
        answer:
          type: choice
          options:
            - { id: right, code: "{\"id\":\"t-01\",\"due\":\"2026-03-01T00:00:00.000Z\"}" }
            - id: keeps-all
              code: "{\"id\":\"t-01\",\"due\":\"2026-03-01T00:00:00.000Z\",\"note\":null}"
              why:
                uk: "Властивість зі значенням `undefined` JSON пропускає повністю, а не перетворює на `null`."
                en: "JSON skips a property whose value is `undefined` entirely; it does not turn it into `null`."
            - id: date-object
              code: "{\"id\":\"t-01\",\"due\":{},\"note\":null}"
              why:
                uk: "`Date` має метод `toJSON`, тож стає текстом дати, а не порожнім об’єктом."
                en: "`Date` has a `toJSON` method, so it becomes the date text, not an empty object."
          correct: [right]
        explanation:
          uk: "JSON губить функції й `undefined`, а дату перетворює на текст. React на межі серверних компонентів відтворює `Date` як дату, але функцію — так само ні."
          en: "JSON loses functions and `undefined` and turns a date into text. At the server component boundary React recreates a `Date` as a date, but a function — still no."
      - id: cors-on-server
        from: js-16-04-same-origin-cors
        prompt:
          uk: "Серверний компонент під час рендеру робить `fetch(\"https://rates.example/today\")`. Цей API не надсилає жодних заголовків CORS. Чи отримає компонент відповідь?"
          en: "During its render a server component calls `fetch(\"https://rates.example/today\")`. This API sends no CORS headers at all. Does the component get the answer?"
        answer:
          type: choice
          options:
            - id: works
              text: { uk: "Так: CORS застосовує браузер, а запит іде із сервера", en: "Yes: CORS is enforced by browsers, and this request comes from the server" }
            - id: blocked
              text: { uk: "Ні: без `Access-Control-Allow-Origin` відповідь заблокують", en: "No: without `Access-Control-Allow-Origin` the answer is blocked" }
              why:
                uk: "Блокує відповідь браузер, щоб чужа сторінка не прочитала дані від твого імені. Сервер — не браузер, і цієї перевірки там немає."
                en: "The browser blocks the answer so that a foreign page cannot read data in your name. A server is not a browser, and this check does not exist there."
          correct: [works]
        explanation:
          uk: "CORS — правило браузера. Запит із серверного компонента виконується на сервері, тож CORS його не стосується. А от той самий `fetch` у клієнтському компоненті впреться в CORS."
          en: "CORS is a browser rule. A request from a server component runs on the server, so CORS does not apply to it. The same `fetch` in a client component, however, runs into CORS."

  - id: crossable
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: crossable
    entry: main.jsx
    editable: [crossable.js]
    strings:
      plainCard: { uk: "Картка з даними", en: "Card with data" }
      richCard: { uk: "Картка з об’єктом і обробником", en: "Card with an object and a handler" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      food: { uk: "Їжа", en: "Food" }
      fun: { uk: "Розваги", en: "Fun" }
      weekly: { uk: "щотижня", en: "weekly" }
      crosses: { uk: "проходить межу", en: "crosses the boundary" }
      blocked: { uk: "не проходить", en: "blocked" }
    title:
      uk: "Перевірка пропсів перед межею"
      en: "Checking props before the boundary"
    instructions:
      uk: |
        Напиши в `crossable.js` функцію `assertCrossable(props)`, яка перевіряє, чи пропси можна передати від серверного компонента до клієнтського.

        - Можна: текст, числа, `bigint`, булеві, `null`, `undefined`, `Date`, масиви, `Map`, `Set` і звичайні об’єкти (`Object.getPrototypeOf(value) === Object.prototype`) — **якщо все всередині теж можна**. У `Map` перевіряй і ключі, і значення.
        - Не можна: функції й будь-які інші об’єкти — екземпляри класів, як `new Budget(…)` з `budget.js`.
        - Якщо все можна, функція повертає `true`. Інакше кидає `TypeError`, повідомлення якого містить **назву пропса** верхнього рівня, що не проходить.

        `main.jsx` перевіряє дві картки витрат і показує вердикт на сторінці.
      en: |
        Write the function `assertCrossable(props)` in `crossable.js`. It checks whether props can be passed from a server component to a client component.

        - Allowed: text, numbers, `bigint`, booleans, `null`, `undefined`, `Date`, arrays, `Map`, `Set` and plain objects (`Object.getPrototypeOf(value) === Object.prototype`) — **if everything inside is allowed too**. In a `Map` check both keys and values.
        - Not allowed: functions and any other objects — class instances such as `new Budget(…)` from `budget.js`.
        - If everything is allowed, the function returns `true`. Otherwise it throws a `TypeError` whose message contains the **name of the top-level prop** that does not cross.

        `main.jsx` checks two expense cards and shows the verdict on the page.
    testTitles:
      "accepts plain data: text, numbers, booleans, null, undefined, arrays and plain objects":
        uk: "Пропускає звичайні дані: текст, числа, булеві, `null`, `undefined`, масиви й звичайні об’єкти"
        en: "Accepts plain data: text, numbers, booleans, `null`, `undefined`, arrays and plain objects"
      "accepts Date, Map and Set, also inside other data":
        uk: "Пропускає `Date`, `Map` і `Set`, також усередині інших даних"
        en: "Accepts `Date`, `Map` and `Set`, also inside other data"
      "rejects a function prop with a TypeError that names it":
        uk: "Відхиляє пропс-функцію через `TypeError` з його назвою"
        en: "Rejects a function prop with a `TypeError` that names it"
      "rejects a class instance with a TypeError that names it":
        uk: "Відхиляє екземпляр класу через `TypeError` з назвою пропса"
        en: "Rejects a class instance with a `TypeError` that names it"
      "finds a function or a class instance inside arrays, objects, Map and Set":
        uk: "Знаходить функцію чи екземпляр класу всередині масивів, об’єктів, `Map` і `Set`"
        en: "Finds a function or a class instance inside arrays, objects, `Map` and `Set`"
    hints:
      nudge:
        uk: "Для кожного значення спершу виріши «можна чи ні», а для контейнерів (масив, `Map`, `Set`, звичайний об’єкт) — перевір так само кожен їхній елемент. Яка функція може викликати сама себе?"
        en: "For every value first decide “allowed or not”, and for containers (an array, a `Map`, a `Set`, a plain object) check each of their elements the same way. Which function can call itself?"
      explanation:
        uk: |
          Зручно мати допоміжну рекурсивну функцію `(value) => boolean`, а в `assertCrossable` пройти `Object.entries(props)` і кинути `TypeError` з назвою першого поганого пропса. Звичайний об’єкт від екземпляра класу відрізняє прототип. Наприклад, так можна відрізнити масив від інших об’єктів у схожій задачі:

          ```js
          const isList = (value) => Array.isArray(value);
          const isDate = (value) => value instanceof Date;
          ```

          `typeof` тут замало: і для `{}`, і для `new Budget(1)`, і для `new Map()` він каже `"object"`.
        en: |
          A recursive helper `(value) => boolean` is handy, and `assertCrossable` then walks `Object.entries(props)` and throws a `TypeError` with the name of the first bad prop. The prototype tells a plain object from a class instance. For example, this is how an array can be told from other objects in a similar task:

          ```js
          const isList = (value) => Array.isArray(value);
          const isDate = (value) => value instanceof Date;
          ```

          `typeof` is not enough here: for `{}`, for `new Budget(1)` and for `new Map()` alike it says `"object"`.
    solutionNote:
      uk: "Рекурсія перевіряє кожне значення так само, як React перевіряє дані на межі: примітиви й `Date` — так, контейнери — якщо все всередині можна, звичайний об’єкт — за прототипом, решта — ні. Справжній React дозволяє ще проміси, JSX і Server Functions; наш спрощений перевіряльник їх не розрізняє. Друга картка в `main.jsx` не проходить через `budget`: передай замість об’єкта `budgetLimitMinor: 500000`, а `onDelete` нехай створює сам клієнтський компонент."
      en: "The recursion checks every value the way React checks data at the boundary: primitives and `Date` — yes, containers — if everything inside is allowed, a plain object — by its prototype, the rest — no. Real React also allows promises, JSX and Server Functions; our simplified checker does not tell them apart. The second card in `main.jsx` is blocked because of `budget`: pass `budgetLimitMinor: 500000` instead of the object, and let the client component create `onDelete` itself."
    feedback:
      - when: { test: "accepts plain data: text, numbers, booleans, null, undefined, arrays and plain objects" }
        message:
          uk: "Ця перевірка чекає `true` для пропсів із текстом, числами, `10n`, `true`, `null`, `undefined`, масивом і вкладеним звичайним об’єктом. Якщо функція кидає помилку, подивись, яке значення вона вважає поганим. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check expects `true` for props with text, numbers, `10n`, `true`, `null`, `undefined`, an array and a nested plain object. If the function throws, look at which value it considers bad. If every check fails at once, fix the first error in the console first."
      - when: { test: "accepts Date, Map and Set, also inside other data" }
        message:
          uk: "Ця перевірка чекає `true` для `Date`, `Map`, `Set` і масиву об’єктів, що містять `Date` та `Set`. Перевірка через JSON тут не годиться: `JSON.stringify` робить з `Map` і `Set` порожній `{}`, а React їх передає."
          en: "This check expects `true` for a `Date`, a `Map`, a `Set` and an array of objects holding a `Date` and a `Set`. A JSON-based check does not work here: `JSON.stringify` turns a `Map` and a `Set` into an empty `{}`, while React passes them."
      - when: { test: "rejects a function prop with a TypeError that names it" }
        message:
          uk: "Ця перевірка передає `{ id, onDelete: () => {} }` і чекає `TypeError`, у повідомленні якого є `onDelete`."
          en: "This check passes `{ id, onDelete: () => {} }` and expects a `TypeError` whose message contains `onDelete`."
      - when: { test: "rejects a class instance with a TypeError that names it" }
        message:
          uk: "Ця перевірка передає `{ id, budget: new Budget(500000) }` і чекає `TypeError` зі словом `budget` у повідомленні. `typeof` для екземпляра класу каже `\"object\"`, як і для звичайного об’єкта, — відрізни їх за прототипом."
          en: "This check passes `{ id, budget: new Budget(500000) }` and expects a `TypeError` with `budget` in its message. `typeof` says `\"object\"` for a class instance, just as for a plain object — tell them apart by the prototype."
      - when: { test: "finds a function or a class instance inside arrays, objects, Map and Set" }
        message:
          uk: "Ця перевірка ховає функцію чи екземпляр класу в масив, у звичайний об’єкт, у значення `Map`, у ключ `Map` і в `Set` і щоразу чекає `TypeError` з назвою пропса верхнього рівня. Перевіряй уміст контейнерів тим самим правилом, що й сам пропс, — у `Map` і ключі, і значення."
          en: "This check hides a function or a class instance in an array, in a plain object, in a `Map` value, in a `Map` key and in a `Set`, and each time expects a `TypeError` with the name of the top-level prop. Check the contents of containers with the same rule as the prop itself — in a `Map` both keys and values."

  - id: to-project
    kind: transfer
    capstoneStep: RE-11
    body:
      uk: "Пройдися деревом компонентів свого проєкту: у кого є `useState`, `useEffect`, обробники чи браузерні API — той клієнтський. Для кожного пропса, що йде від «серверного» батька до клієнтського компонента, запитай себе, чи пройде він межу. Колбек на кшталт `onToggle` — ні: такий компонент має сам володіти обробником."
      en: "Walk through your project’s component tree: whatever has `useState`, `useEffect`, handlers or browser APIs is a client component. For every prop going from a “server” parent to a client component, ask whether it would cross the boundary. A callback such as `onToggle` would not: such a component has to own its handler itself."
