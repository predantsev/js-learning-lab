id: re-11-05-rsc-frameworks-stability
unit: RE-11
title:
  uk: "RSC, фреймворки й стабільність: огляд"
  en: "RSC, frameworks and stability awareness"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Пояснити, що React Server Components потребують інтеграції з фреймворком чи бандлером і що цей курс жодного з них не вимагає."
    en: "Explain that React Server Components need a framework or bundler integration, and that this course does not mandate one."
  - uk: "Читати позначки стабільності (stable, canary, experimental) для API, пов’язаних з RSC, і вирішувати, чи стосується API з туторіалу конкретного налаштування проєкту."
    en: "Read stability labels (stable, canary, experimental) for RSC-related features and decide whether a tutorial's API applies to a given project setup."
prerequisites: [re-11-04-secrets-server-only, re-10-04-modern-form-actions-awareness]
subskills:
  - { family: R-09, skill: "RSC framework/stability awareness", depth: intro }
glossary: [react-server-components, meta-framework]
selfCheck: [predict-setups, habit-card]

blocks:
  - id: not-a-switch
    kind: explanation
    title:
      uk: "Серверні компоненти — не перемикач у React"
      en: "Server components are not a switch in React"
    body:
      uk: |
        Щоб [[react-server-components|React Server Components]] працювали, потрібні три речі, яких сам пакет `react` не дає:

        - **бандлер, що ділить граф модулів** на серверний і клієнтський за `"use client"` і будує окремі бандли;
        - **середовище, де серверні компоненти виконуються**: сервер на кожен запит або крок збірки (тоді сервер не потрібен — сторінки рендеряться заздалегідь);
        - **протокол**, яким результат серверних компонентів разом із пропсами клієнтських доходить до браузера.

        Усе це робить [[meta-framework|мета-фреймворк]] або бандлер з підтримкою RSC — наприклад, Next.js (App Router). Звичайний Vite-SPA, як твої проєкти, і пісочниця курсу — це лише клієнтський React.

        Курс не вимагає жодного фреймворку. Межа клієнт/сервер, серіалізація пропсів, секрети лише на сервері, ризики гідратації — однакові скрізь; різняться назви API. Справжній сервер ти напишеш у Node.js-етапі.
      en: |
        For [[react-server-components]] to work, three things are needed that the `react` package alone does not provide:

        - **a bundler that splits the module graph** into server and client parts at `"use client"` and builds separate bundles;
        - **an environment where server components run**: a server on every request, or a build step (then no server is needed — pages are rendered ahead of time);
        - **a protocol** that carries the result of the server components, together with the props of the client components, to the browser.

        All of that is done by a [[meta-framework]] or a bundler with RSC support — for example, Next.js (App Router). A plain Vite SPA, like your projects, and the course sandbox are client React only.

        The course does not require any framework. The client/server boundary, props serialization, server-only secrets, hydration risks — they are the same everywhere; the API names differ. You will write a real server in the Node.js stage.

  - id: predict-setups
    kind: prediction
    prompt:
      uk: "Туторіал показує серверний компонент `async function Page() { const tasks = await db.tasks.list(); … }`. У яких налаштуваннях він запрацює без переписування? Познач усі."
      en: "A tutorial shows a server component `async function Page() { const tasks = await db.tasks.list(); … }`. In which setups will it work without rewriting? Mark all of them."
    answer:
      type: multi
      options:
        - id: vite-spa
          text: { uk: "Звичайний застосунок Vite + React (SPA), як твій проєкт", en: "A plain Vite + React app (SPA), like your project" }
          why:
            uk: "Vite-SPA — лише клієнтський React: немає ні поділу графа модулів, ні місця, де компонент виконався б на сервері. У браузері React відхилить async-компонент."
            en: "A Vite SPA is client React only: there is no module graph split and no place where the component would run on a server. In the browser React rejects an async component."
        - id: framework
          text: { uk: "Фреймворк з підтримкою RSC, наприклад Next.js App Router", en: "A framework with RSC support, for example the Next.js App Router" }
        - id: static-export
          text: { uk: "Той самий фреймворк у режимі статичного експорту — якщо список береться під час збірки", en: "The same framework in static export mode — if the list is taken during the build" }
        - id: node-ssr
          text: { uk: "Власний Node-сервер, що рендерить React у HTML (SSR) без підтримки RSC", en: "Your own Node server rendering React to HTML (SSR) without RSC support" }
          why:
            uk: "SSR рендерить у HTML, але не ділить код на серверні й клієнтські модулі: кожен компонент там клієнтський, його код їде в браузер для гідратації, а клієнтський React відхиляє async-компонент. І доступу до бази в браузері немає. SSR і RSC — різні речі."
            en: "SSR renders to HTML, but it does not split the code into server and client modules: every component there is a client component, its code goes to the browser for hydration, and client React rejects an async component. Nor is there database access in the browser. SSR and RSC are different things."
      correct: [framework, static-export]
    explanation:
      uk: "Серверним компонентам потрібна інтеграція. Фреймворк з RSC виконує їх на сервері на кожен запит або — за довідкою React — під час збірки, коли вебсервер не потрібен: тоді `tasks` буде таким, яким був на момент збірки. Vite-SPA і SSR без RSC такого компонента не виконають."
      en: "Server components need an integration. A framework with RSC runs them on the server on every request or — according to the React docs — during the build, when no web server is needed: then `tasks` is what it was at build time. A Vite SPA and SSR without RSC cannot run such a component."

  - id: expense-card
    kind: example
    runtime: browser-react
    dir: expense-card
    entry: main.jsx
    strings:
      title: { uk: "Витрата", en: "Expense" }
      loading: { uk: "Завантаження…", en: "Loading…" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      currency: { uk: "грн", en: "UAH" }
    title:
      uk: "Картка як клієнтський компонент — і чого тут немає"
      en: "The card as a client component — and what is missing here"
    body:
      uk: |
        `ExpenseCard` — звичайний клієнтський компонент: дані він завантажує в ефекті, після першого рендеру. У фреймворку з RSC ту саму картку можна було б написати серверною:

        ```jsx
        export default async function ExpenseCard({ id }) {
          const expense = await loadExpense(id); // на сервері: напряму з бази
          return <p>…</p>;
        }
        ```

        Ні стану, ні ефекту, а дані — ще до того, як HTML вирушив у браузер. Спробуй, що на це скаже клієнтський React.
      en: |
        `ExpenseCard` is an ordinary client component: it loads its data in an effect, after the first render. In a framework with RSC the same card could be written as a server component:

        ```jsx
        export default async function ExpenseCard({ id }) {
          const expense = await loadExpense(id); // on the server: straight from the database
          return <p>…</p>;
        }
        ```

        No state, no effect, and the data is there before the HTML leaves for the browser. Try what client React says to that.
    tryIt:
      uk: |
        1. Запусти: спершу «Завантаження…», за ~150 мс — витрата. Консоль друкує версію React — тут 19.3.0, у якій серверні компоненти стабільні. Але працюють вони не тут.
        2. Перепиши `ExpenseCard.jsx` у серверному стилі: додай `async` перед `function ExpenseCard`, заміни все від `const [expense, setExpense]` до рядка з `if (expense === null)` включно одним рядком `const expense = await loadExpense(id);` і видали перший рядок з імпортом `useEffect, useState`. Останній `return` лишається.
        3. Запусти: консоль каже «ExpenseCard is an async Client Component. Only Server Components can be async at the moment», а сторінка лишається порожньою — у нашому запуску не з’явився навіть заголовок. Версія React та сама; бракує інтеграції. Поверни ефект (Ctrl+Z або ⌘Z).
      en: |
        1. Run it: first “Loading…”, after ~150 ms the expense. The console prints the React version — 19.3.0 here, in which server components are stable. But they do not work here.
        2. Rewrite `ExpenseCard.jsx` in the server style: add `async` before `function ExpenseCard`, replace everything from `const [expense, setExpense]` up to and including the line with `if (expense === null)` with the single line `const expense = await loadExpense(id);`, and delete the first line, the import of `useEffect, useState`. The last `return` stays.
        3. Run: the console says “ExpenseCard is an async Client Component. Only Server Components can be async at the moment”, and the page stays empty — in our run not even the heading appeared. The React version is the same; the integration is missing. Put the effect back (Ctrl+Z or ⌘Z).

  - id: stability
    kind: explanation
    title:
      uk: "Позначки стабільності: stable, canary, experimental"
      en: "Stability labels: stable, canary, experimental"
    body:
      uk: |
        React випускає код трьома каналами: **stable** (звичайні версії з npm, `react@19.x`), **canary** (те, що готують до наступного релізу) і **experimental** (`react@experimental`, «не для продакшну»). Довідка react.dev над такими API ставить помітне попередження про канал.

        | API | Позначка (за react.dev) |
        |---|---|
        | серверні компоненти, async-компоненти на сервері | stable з React 19 |
        | директиви `"use client"`, `"use server"` | stable з React 19 |
        | `experimental_taintUniqueValue`, `experimental_taintObjectReference` | experimental: лише в `react@experimental` |
        | API, якими бандлер чи фреймворк **реалізує** RSC | не дотримуються semver і можуть ламатися між мінорними версіями 19.x |

        Звідси дві звички. Перед тим як узяти API з туторіалу, перевір канал на його сторінці в довідці й **налаштування проєкту**: стабільний серверний компонент однаково не запрацює у Vite-SPA. А назви на кшталт `import "server-only"` чи файлів `.server.ts` — це правила конкретного фреймворку, не React: у кожному фреймворку свій спосіб сказати те саме.
      en: |
        React ships code in three channels: **stable** (the ordinary versions on npm, `react@19.x`), **canary** (what is being prepared for the next release) and **experimental** (`react@experimental`, “not for production”). The react.dev reference puts a visible channel notice above such APIs.

        | API | Label (according to react.dev) |
        |---|---|
        | server components, async components on the server | stable since React 19 |
        | the `"use client"` and `"use server"` directives | stable since React 19 |
        | `experimental_taintUniqueValue`, `experimental_taintObjectReference` | experimental: only in `react@experimental` |
        | the APIs a bundler or framework uses to **implement** RSC | do not follow semver and may break between 19.x minor versions |

        Hence two habits. Before taking an API from a tutorial, check the channel on its reference page and the **project setup**: a stable server component still will not work in a Vite SPA. And names such as `import "server-only"` or `.server.ts` files are rules of a particular framework, not of React: every framework has its own way of saying the same thing.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: позначка версії"
      en: "Recall: a version label"
    items:
      - id: installed-version
        from: re-10-04-modern-form-actions-awareness
        prompt:
          uk: "У `package.json` проєкту стоїть `\"react\": \"^19.2.8\"`. Як дізнатися, яка версія React **справді** встановлена?"
          en: "A project’s `package.json` says `\"react\": \"^19.2.8\"`. How do you find out which React version is **actually** installed?"
        answer:
          type: choice
          options:
            - id: npm-ls
              text: { uk: "Запустити `npm ls react` у теці проєкту", en: "Run `npm ls react` in the project folder" }
            - id: read-json
              text: { uk: "Прочитати `package.json`: там і є версія — 19.2.8", en: "Read `package.json`: the version is right there — 19.2.8" }
              why:
                uk: "`^19.2.8` — це діапазон: будь-яка 19.x, не нижча за 19.2.8. Встановленою може бути й новіша мінорна версія."
                en: "`^19.2.8` is a range: any 19.x not lower than 19.2.8. A newer minor version may well be installed."
            - id: latest
              text: { uk: "Подивитися найновішу версію на npm: встановлюється завжди вона", en: "Look up the newest version on npm: that is always what gets installed" }
              why:
                uk: "Встановлюється те, що дозволяє діапазон і що записано в `package-lock.json`, — а не обов’язково найновіше. Наприклад, React 20 діапазон `^19.2.8` не дозволить."
                en: "What gets installed is what the range allows and what `package-lock.json` records — not necessarily the newest. React 20, for example, is not allowed by the range `^19.2.8`."
          correct: [npm-ls]
        explanation:
          uk: "`npm ls react` показує встановлену версію, а в коді її дає `import { version } from \"react\"`. Для RSC-API цього мало: потрібна ще й інтеграція — фреймворк чи бандлер, — тож перевіряй і версію, і налаштування."
          en: "`npm ls react` shows the installed version, and in code `import { version } from \"react\"` gives it. For RSC APIs that is not enough: an integration — a framework or a bundler — is needed too, so check both the version and the setup."

  - id: habit-card
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: habit-card
    entry: main.jsx
    editable: [HabitCard.jsx]
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      completions: { uk: "Виконань:", en: "Completions:" }
      markDone: { uk: "Позначити виконаною сьогодні", en: "Mark done today" }
      doneToday: { uk: "Виконано сьогодні", en: "Done today" }
    title:
      uk: "Картка звички, готова до поділу"
      en: "A habit card ready to be split"
    instructions:
      uk: |
        `HabitCard` зараз — один клієнтський компонент. Підготуй його до майбутнього фреймворку з RSC, щоб він **уже сьогодні** працював як звичайний клієнтський компонент. У `HabitCard.jsx`:

        - `HabitSummary({ habit })` показує назву звички й «Виконань: N» (N — кількість дат у `completions`) — лише з пропсів: без хуків і без `async`. Це частина, що переїхала б у серверний компонент.
        - `CompleteButton({ habitId, initiallyDone })` сам тримає стан «виконано сьогодні» й перемикає його кліком між «Позначити виконаною сьогодні» і «Виконано сьогодні». Це клієнтський компонент.
        - `HabitCard` складає їх і передає кнопці лише дані: `habit.id` і `habit.completions.includes(today)`.
        - У `RSC_LABELS` впиши позначку стабільності (`"stable"`, `"canary"` чи `"experimental"`) для серверних компонентів, `"use client"` і `experimental_taintUniqueValue` — за таблицею цього уроку.

        Перевірки викликають `HabitSummary` як звичайну функцію поза React, рендерять `CompleteButton` окремо й клікають кнопку на сторінці.
      en: |
        `HabitCard` is one client component now. Prepare it for a future framework with RSC so that it **already today** works as an ordinary client component. In `HabitCard.jsx`:

        - `HabitSummary({ habit })` shows the habit’s name and “Completions: N” (N is the number of dates in `completions`) — from props only: no hooks and no `async`. This is the part that would move into a server component.
        - `CompleteButton({ habitId, initiallyDone })` keeps the “done today” state itself and switches it with a click between “Mark done today” and “Done today”. This is a client component.
        - `HabitCard` puts them together and passes the button only data: `habit.id` and `habit.completions.includes(today)`.
        - In `RSC_LABELS` fill in the stability label (`"stable"`, `"canary"` or `"experimental"`) for server components, `"use client"` and `experimental_taintUniqueValue` — from this lesson’s table.

        The checks call `HabitSummary` as a plain function outside React, render `CompleteButton` on its own and click the button on the page.
    testTitles:
      "HabitSummary works as a plain function of props: no hooks, not async":
        uk: "`HabitSummary` працює як звичайна функція пропсів: без хуків і не `async`"
        en: "`HabitSummary` works as a plain function of props: no hooks, not `async`"
      "CompleteButton keeps its own state: a click switches it and back":
        uk: "`CompleteButton` тримає власний стан: клік перемикає його туди й назад"
        en: "`CompleteButton` keeps its own state: a click switches it and back"
      "the card on the page shows the summary and a working button":
        uk: "Картка на сторінці показує підсумок і робочу кнопку"
        en: "The card on the page shows the summary and a working button"
      "RSC_LABELS match the React documentation":
        uk: "`RSC_LABELS` відповідають довідці React"
        en: "`RSC_LABELS` match the React documentation"
    hints:
      nudge:
        uk: "Яка частина картки лише показує дані, а яка щось пам’ятає між кліками? Серверний компонент не має стану — тож де мусить жити `useState`?"
        en: "Which part of the card only shows data, and which remembers something between clicks? A server component has no state — so where must `useState` live?"
      explanation:
        uk: |
          Розріж компонент по межі: усе, що читає лише пропси, — в один компонент, усе зі станом і обробниками — в інший. Батько передає клієнтській частині прості значення, а не функції. Схожий поділ для картки бажання:

          ```jsx
          function WishInfo({ wish }) { return <h2>{wish.name}</h2>; } // лише пропси
          function AcquiredSwitch({ wishId, initiallyAcquired }) { /* useState тут */ }
          ```

          Позначки шукай у таблиці «Позначки стабільності» цього уроку.
        en: |
          Cut the component along the boundary: everything that reads only props into one component, everything with state and handlers into another. The parent passes the client part plain values, not functions. A similar split for a wish card:

          ```jsx
          function WishInfo({ wish }) { return <h2>{wish.name}</h2>; } // props only
          function AcquiredSwitch({ wishId, initiallyAcquired }) { /* useState goes here */ }
          ```

          Look up the labels in this lesson’s “Stability labels” table.
    solutionNote:
      uk: "`HabitSummary` — чиста функція пропсів, тож у фреймворку з RSC вона стала б серверним компонентом без змін, а потім могла б стати `async` і читати звичку з бази. `CompleteButton` отримав власний файл із `\"use client\"` і отримує лише `id` та булеве значення — обидва проходять межу. Сьогодні все це працює як звичайний клієнтський React."
      en: "`HabitSummary` is a pure function of props, so in a framework with RSC it would become a server component unchanged, and later it could become `async` and read the habit from a database. `CompleteButton` would get its own file with `\"use client\"` and receives only an `id` and a boolean — both cross the boundary. Today all of it works as ordinary client React."
    feedback:
      - when: { test: "HabitSummary works as a plain function of props: no hooks, not async" }
        message:
          uk: "Ця перевірка викликає `HabitSummary({ habit })` поза React і чекає елемент (не проміс), що показує назву звички й «Виконань: 3». Хук у ній кидає помилку поза рендером, а `async` повертає проміс — серверний компонент у цій ролі не має ні того, ні іншого. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check calls `HabitSummary({ habit })` outside React and expects an element (not a promise) showing the habit’s name and “Completions: 3”. A hook in it throws outside a render, and `async` returns a promise — in this role it has neither. If every check fails at once, fix the first error in the console first."
      - when: { test: "CompleteButton keeps its own state: a click switches it and back" }
        message:
          uk: "Ця перевірка рендерить `<CompleteButton habitId=\"h-03\" initiallyDone={true} />` і чекає «Виконано сьогодні», після кліку — «Позначити виконаною сьогодні», після другого — знову «Виконано сьогодні». Початкове значення стану бери з `initiallyDone`."
          en: "This check renders `<CompleteButton habitId=\"h-03\" initiallyDone={true} />` and expects “Done today”, after a click “Mark done today”, after a second click “Done today” again. Take the initial state from `initiallyDone`."
      - when: { test: "the card on the page shows the summary and a working button" }
        message:
          uk: "Ця перевірка чекає на сторінці «Виконань: 3» і кнопку «Позначити виконаною сьогодні» (сьогодні — `2026-03-02`, цієї дати в `completions` немає), а після кліку — «Виконано сьогодні». Якщо сторінка порожня, перевір, чи не став якийсь компонент `async`."
          en: "This check expects “Completions: 3” on the page and a “Mark done today” button (today is `2026-03-02`, which is not in `completions`), and after a click “Done today”. If the page is empty, check whether some component became `async`."
      - when: { test: "RSC_LABELS match the React documentation" }
        message:
          uk: "Ця перевірка порівнює три значення `RSC_LABELS` з таблицею «Позначки стабільності» цього уроку. Кожне значення — одне зі слів `\"stable\"`, `\"canary\"` чи `\"experimental\"`, малими літерами."
          en: "This check compares the three values of `RSC_LABELS` with this lesson’s “Stability labels” table. Each value is one of the words `\"stable\"`, `\"canary\"` or `\"experimental\"`, in lower case."

  - id: to-project
    kind: transfer
    capstoneStep: RE-11
    body:
      uk: "Твій проєкт — Vite-SPA, і переводити його на фреймворк не треба. У кроці проєкту ти лише позначиш на папері, які компоненти **могли б** стати серверними, якби проєкт колись переїхав у фреймворк з RSC, і які лишилися б клієнтськими. Поділ «лише пропси / стан і обробники», як у вправі, — хороша підготовка вже сьогодні."
      en: "Your project is a Vite SPA, and there is no need to move it to a framework. In the project step you will only mark on paper which components **could** become server components if the project ever moved to a framework with RSC, and which would stay client components. A split into “props only / state and handlers”, as in the exercise, is good preparation already today."
