id: re-11-02-hydration-mismatch
unit: RE-11
title:
  uk: "Гідратація та причини розбіжностей"
  en: "Hydration and mismatch causes"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Пояснити гідратацію як рендер того самого дерева в браузері, під час якого React чіпляє стан і обробники до наявного серверного HTML, а не створює DOM заново."
    en: "Explain hydration as React rendering the same tree on the client and attaching state and handlers to existing server HTML, not re-creating the DOM."
  - uk: "Передбачити за наданою трасою симптом кожної типової причини розбіжності: поточний час чи випадкові значення, форматування за локаллю, читання `window` чи `localStorage` під час рендеру, неправильна вкладеність тегів."
    en: "Predict the symptom of each common mismatch cause (current time or random values, locale formatting, window or localStorage read during render, invalid nesting) in a supplied trace."
prerequisites: [re-11-01-csr-ssr-static, re-03-02-effects-synchronize-external]
subskills:
  - { family: R-09, skill: "hydration and mismatch causes", depth: intro }
glossary: [hydration, hydration-mismatch]
selfCheck: [predict-stored-filter, predict-attribute, client-only-date]

blocks:
  - id: what-hydration-does
    kind: explanation
    title:
      uk: "Гідратація: не замінити HTML, а підхопити його"
      en: "Hydration: not replacing the HTML, but taking it over"
    body:
      uk: |
        Після SSR у браузері вже є готовий HTML. Щоб кнопки ожили, React запускають не через `createRoot`, а так:

        ```jsx
        hydrateRoot(document.getElementById("root"), <App />);
        ```

        Це [[hydration|гідратація]]. React рендерить те саме дерево, що й сервер, але DOM **не створює**: він іде вузлами, які вже є на сторінці, зіставляє кожен зі своїм рендером і чіпляє до них обробники й стан. HTML вдруге не завантажується і не замінюється — людина бачить ту саму сторінку, яка просто починає реагувати.

        Звідси головна вимога: **перший рендер у браузері має дати точно ту саму розмітку, що й сервер**. Ефекти виконуються вже після гідратації, тож у них можна робити те, що відрізняється.

        > [!note]
        > У пісочниці React-сервера немає. «Серверний HTML» у цьому уроці — текст у `index.html`, написаний так, як його видав би серверний рендер React. Сама гідратація — справжня, React 19. Справжній сервер ти запустиш у NO-13.
      en: |
        After SSR the browser already has ready HTML. To bring the buttons to life, React is started not with `createRoot` but like this:

        ```jsx
        hydrateRoot(document.getElementById("root"), <App />);
        ```

        This is [[hydration]]. React renders the same tree the server did, but it does **not** create the DOM: it walks the nodes already on the page, matches each with its own render and attaches handlers and state to them. The HTML is neither downloaded a second time nor replaced — the person sees the same page, which simply starts responding.

        Hence the main requirement: **the first render in the browser must produce exactly the same markup as the server**. Effects run after hydration, so whatever differs can be done in them.

        > [!note]
        > There is no React server in the sandbox. The “server HTML” in this lesson is text in `index.html`, written the way React’s server renderer would produce it. The hydration itself is real, React 19. You will run a real server in NO-13.

  - id: hydration-sequence
    kind: visual
    visual: sequence
    title:
      uk: "Розбіжність на одній мітці часу"
      en: "A mismatch on one time label"
    textEquivalent:
      uk: >-
        Учасники: сервер, браузер і React у браузері. Сервер рендерить сторінку о 09:00:00 і надсилає HTML
        з міткою «Оновлено о 09:00:00» та кнопкою. Браузер одразу показує цей HTML. Потім приходить
        app.js, і React викликає hydrateRoot: він рендерить те саме дерево, але компонент знову
        обчислює час — тепер 09:00:02. React іде вузлами сторінки й на текстовому вузлі мітки бачить
        інший текст. Він повідомляє про розбіжність гідратації (у development-збірці — з позначками
        «+» для клієнта й «−» для сервера), відкидає серверний HTML цього дерева й будує його заново
        на клієнті. Лише після цього виконуються ефекти. Якби час обчислювався в ефекті, перший рендер
        дав би 09:00:00, гідратація пройшла б без розбіжностей, а ефект оновив би мітку.
      en: >-
        Participants: the server, the browser and React in the browser. The server renders the page at
        09:00:00 and sends HTML with the label “Updated at 09:00:00” and a button. The browser shows
        this HTML at once. Then app.js arrives and React calls hydrateRoot: it renders the same tree,
        but the component computes the time again — now 09:00:02. React walks the page nodes and at
        the label’s text node finds different text. It reports a hydration mismatch (in the
        development build with “+” marks for the client and “−” for the server), throws away the
        server HTML of this tree and builds it again on the client. Only after that do the effects
        run. Had the time been computed in an effect, the first render would have produced 09:00:00,
        hydration would have passed without a mismatch, and the effect would have updated the label.
    spec:
      actors:
        - { id: server, label: { uk: "Сервер", en: "Server" } }
        - { id: browser, label: { uk: "Браузер", en: "Browser" } }
        - { id: react, label: { uk: "React у браузері", en: "React in the browser" } }
      messages:
        - from: server
          to: server
          kind: note
          label: { uk: "рендер о 09:00:00", en: "render at 09:00:00" }
          caption:
            uk: "Сервер рендерить компонент, який показує поточний час: `Оновлено о 09:00:00`."
            en: "The server renders a component that shows the current time: `Updated at 09:00:00`."
        - from: server
          to: browser
          kind: return
          label: "HTML"
          note: { uk: "<span>09:00:00</span>", en: "<span>09:00:00</span>" }
          caption:
            uk: "Браузер отримує HTML і одразу його показує. Кнопка видна, але ще не реагує."
            en: "The browser receives the HTML and shows it at once. The button is visible but does not respond yet."
        - from: browser
          to: react
          label: "hydrateRoot(root, <App />)"
          caption:
            uk: "Прийшов `app.js`. React починає гідратацію: рендерить те саме дерево ще раз, уже в браузері."
            en: "`app.js` has arrived. React starts hydration: it renders the same tree once more, now in the browser."
        - from: react
          to: react
          kind: note
          label: { uk: "рендер о 09:00:02", en: "render at 09:00:02" }
          caption:
            uk: "Компонент знову читає годинник — минуло дві секунди. Клієнтський рендер дає `09:00:02`."
            en: "The component reads the clock again — two seconds have passed. The client render produces `09:00:02`."
        - from: react
          to: browser
          label: { uk: "зіставити вузли", en: "match the nodes" }
          note: { uk: "+ 09:00:02 / - 09:00:00", en: "+ 09:00:02 / - 09:00:00" }
          caption:
            uk: "React іде наявними вузлами. `<p>` і `<span>` збіглися, а текст у `<span>` — ні. Це [[hydration-mismatch|розбіжність гідратації]]."
            en: "React walks the existing nodes. `<p>` and `<span>` match, but the text in the `<span>` does not. That is a [[hydration-mismatch]]."
        - from: react
          to: browser
          label: { uk: "відкинути й побудувати заново", en: "throw away and rebuild" }
          caption:
            uk: "Через різний текст React 19 відкидає серверний HTML цього дерева й будує DOM заново на клієнті. Користь від SSR для цієї частини втрачено, а в консолі — помилка."
            en: "Because of the different text, React 19 throws away the server HTML of this tree and builds the DOM again on the client. The benefit of SSR for this part is lost, and the console shows an error."
        - from: react
          to: react
          kind: note
          label: { uk: "ефекти", en: "effects" }
          caption:
            uk: "Лише тепер виконуються ефекти. Якби час читали тут, перший рендер дав би `09:00:00`, гідратація пройшла б чисто, а ефект оновив би мітку."
            en: "Only now do the effects run. Had the time been read here, the first render would have produced `09:00:00`, hydration would have passed cleanly, and the effect would have updated the label."

  - id: predict-stored-filter
    kind: prediction
    lang: jsx
    runnable: false
    strings:
      showing: { uk: "Показано", en: "Showing" }
      allTasks: { uk: "усі справи", en: "all tasks" }
      pendingTasks: { uk: "невиконані", en: "pending" }
    prompt:
      uk: "Сервер не бачить `localStorage` відвідувача, тож надіслав `<b>усі справи</b>`. У браузері цього відвідувача збережено `\"pending\"`. Компонент гідратують через `hydrateRoot`. Що станеться?"
      en: "The server cannot see the visitor’s `localStorage`, so it sent `<b>all tasks</b>`. This visitor’s browser has `\"pending\"` saved. The component is hydrated with `hydrateRoot`. What happens?"
    code: |
      function TaskFilter() {
        const [filter, setFilter] = useState(() => localStorage.getItem("planner.filter") ?? "all");
        return (
          <p>
            %%showing%%: <b>{filter === "all" ? "%%allTasks%%" : "%%pendingTasks%%"}</b>
          </p>
        );
      }
    answer:
      type: choice
      options:
        - id: mismatch-rebuild
          text: { uk: "React повідомляє про розбіжність у тексті `<b>` і будує це дерево заново на клієнті — уже з «невиконані»", en: "React reports a mismatch in the text of `<b>` and builds this tree again on the client — now with “pending”" }
        - id: fine-in-browser
          text: { uk: "Нічого поганого: компонент працює в браузері, а там `localStorage` є", en: "Nothing bad: the component runs in a browser, and `localStorage` exists there" }
          why:
            uk: "`localStorage` справді є, і саме тому клієнтський рендер дає «невиконані», а сервер дав «усі справи». Проблема не в тому, чи існує API, а в тому, що перший рендер у браузері відрізняється від серверного."
            en: "`localStorage` does exist, and that is exactly why the client render produces “pending” while the server produced “all tasks”. The problem is not whether the API exists but that the first render in the browser differs from the server’s."
        - id: replaced-anyway
          text: { uk: "Нічого помітного: гідратація однаково завантажує HTML заново й замінює сторінку", en: "Nothing noticeable: hydration downloads the HTML again and replaces the page anyway" }
          why:
            uk: "Гідратація нічого не завантажує й нічого не замінює — вона підхоплює вузли, що вже є. Тому різниця між серверним і клієнтським рендером і стає помилкою."
            en: "Hydration downloads nothing and replaces nothing — it takes over the nodes that are already there. That is why a difference between the server and client renders becomes an error."
        - id: patched-quietly
          text: { uk: "React тихо виправляє текст `<b>` і більше нічого не робить", en: "React quietly fixes the text of `<b>` and does nothing else" }
          why:
            uk: "Для різного тексту React 19 не латає один вузол: він повідомляє про помилку й будує заново все дерево аж до найближчої межі."
            en: "For different text React 19 does not patch a single node: it reports an error and rebuilds the whole tree up to the nearest boundary."
      correct: [mismatch-rebuild]
    explanation:
      uk: "Ми запустили цей компонент у пісочниці з `hydrateRoot`: консоль показала, що серверний `<b>` зник зі сторінки (`isConnected` став `false`), а помилка «Hydration failed because the server rendered text didn't match the client» у development-збірці вказала на `<b>` з `+ невиконані` (клієнт) і `- усі справи` (сервер)."
      en: "We ran this component in the sandbox with `hydrateRoot`: the console showed that the server’s `<b>` left the page (`isConnected` became `false`), and the error “Hydration failed because the server rendered text didn't match the client” in the development build pointed at `<b>` with `+ pending` (client) and `- all tasks` (server)."

  - id: stored-filter
    kind: example
    runtime: browser-react
    dir: stored-filter
    entry: index.html
    expectError: true
    strings:
      title: { uk: "Планувальник", en: "Planner" }
      showing: { uk: "Показано", en: "Showing" }
      allTasks: { uk: "усі справи", en: "all tasks" }
      pendingTasks: { uk: "невиконані", en: "pending" }
      onlyPending: { uk: "Лише невиконані", en: "Pending only" }
      showAll: { uk: "Показати всі", en: "Show all" }
      serverShows: { uk: "серверний HTML показує", en: "the server HTML shows" }
      sameNode: { uk: "серверний <b> досі на сторінці", en: "the server's <b> is still on the page" }
    title:
      uk: "Збережений фільтр: читання в рендері й у ефекті"
      en: "A saved filter: reading in render and in an effect"
    body:
      uk: |
        `index.html` містить «серверний» HTML: фільтр за замовчуванням, бо сервер не бачить `localStorage`. `main.jsx` кладе в `localStorage` вибір відвідувача — `"pending"` — і гідратує `TaskFilter`. Зараз `TaskFilter` читає збережений вибір **під час рендеру**, у початковому значенні `useState`.

        Натисни **Запустити**: з’явиться картка помилки гідратації, а консоль покаже два рендери й те, чи лишився серверний `<b>` на сторінці.
      en: |
        `index.html` holds the “server” HTML: the default filter, because the server cannot see `localStorage`. `main.jsx` puts the visitor’s choice — `"pending"` — into `localStorage` and hydrates `TaskFilter`. Right now `TaskFilter` reads the saved choice **during render**, in the initial value of `useState`.

        Press **Run**: a hydration error card appears, and the console shows two renders and whether the server’s `<b>` stayed on the page.
    tryIt:
      uk: |
        1. Прочитай помилку: під `<b>` рядок з `+` — те, що дав клієнт, з `-` — те, що прийшло із сервера. Останній рядок консолі каже `false`: серверний вузол викинуто й замінено новим.
        2. Перенеси читання в ефект. У `TaskFilter.jsx` заміни рядок із `useState` на `const [filter, setFilter] = useState("all");`, а під ним додай `useEffect(() => { const saved = localStorage.getItem("planner.filter"); if (saved !== null) setFilter(saved); }, []);` (і додай `useEffect` до імпорту з `"react"`).
        3. Запусти. Помилки немає, консоль показує рендер з `"all"` і потім з `"pending"`, а серверний `<b>` лишився на сторінці (`true`). Перший рендер збігся із сервером, а ефект після гідратації показав збережений вибір.
        4. Натисни кнопку кілька разів і запусти знову: ефект щоразу відновлює останній вибір.
      en: |
        1. Read the error: under `<b>` the line with `+` is what the client produced, the line with `-` is what came from the server. The last console line says `false`: the server node was thrown away and replaced by a new one.
        2. Move the read into an effect. In `TaskFilter.jsx` replace the `useState` line with `const [filter, setFilter] = useState("all");`, and below it add `useEffect(() => { const saved = localStorage.getItem("planner.filter"); if (saved !== null) setFilter(saved); }, []);` (and add `useEffect` to the import from `"react"`).
        3. Run. There is no error, the console shows a render with `"all"` and then with `"pending"`, and the server’s `<b>` stayed on the page (`true`). The first render matched the server, and the effect after hydration showed the saved choice.
        4. Press the button a few times and run again: the effect restores the last choice every time.

  - id: causes
    kind: explanation
    title:
      uk: "Звідки беруться розбіжності"
      en: "Where mismatches come from"
    body:
      uk: |
        Усі причини мають одне спільне: рендер залежить від чогось, що на сервері й у браузері різне.

        | Причина в рендері | Чому відрізняється |
        |---|---|
        | `new Date()`, `Date.now()`, `Math.random()` | сервер і браузер викликають їх у різні моменти |
        | `toLocaleString()`, `Intl` без явної локалі | у сервера одна мова й часовий пояс, у читача — інші |
        | `window`, `localStorage`, `navigator`, розмір вікна | на сервері їх немає, у браузері є |
        | неправильна вкладеність, як `<p>` у `<p>` | браузер **сам** виправляє такий HTML під час розбору: ми виміряли, що `<p>x<p>inner</p></p>` стає `<p>x</p><p>inner</p><p></p>` |

        Симптом залежить від того, **що** розійшлося. Різний текст — React 19 повідомляє про помилку й будує дерево заново. Різний атрибут — лише попередження в консолі, і React **не виправляє** його: у нашому запуску сервер дав `class="server"`, клієнт — `className="client"`, і на сторінці лишився `class="server"`. Тож попередження про гідратацію — не косметика.

        Виправлення одне: перший рендер має збігатися із сервером, а все «тільки з браузера» показуй після монтування, в ефекті.
      en: |
        All the causes share one thing: the render depends on something that differs between the server and the browser.

        | Cause in render | Why it differs |
        |---|---|
        | `new Date()`, `Date.now()`, `Math.random()` | the server and the browser call them at different moments |
        | `toLocaleString()`, `Intl` without an explicit locale | the server has one language and time zone, the reader others |
        | `window`, `localStorage`, `navigator`, the window size | they do not exist on the server, they do in the browser |
        | invalid nesting, such as `<p>` inside `<p>` | the browser **itself** fixes such HTML while parsing it: we measured that `<p>x<p>inner</p></p>` becomes `<p>x</p><p>inner</p><p></p>` |

        The symptom depends on **what** diverged. Different text — React 19 reports an error and rebuilds the tree. A different attribute — only a warning in the console, and React does **not** fix it: in our run the server gave `class="server"`, the client `className="client"`, and `class="server"` stayed on the page. So a hydration warning is not cosmetic.

        The fix is always the same: the first render must match the server, and anything “browser only” is shown after mount, in an effect.

  - id: predict-attribute
    kind: prediction
    lang: jsx
    runnable: false
    prompt:
      uk: "Сервер надіслав `<p class=\"theme-light\">Hi</p>`. Перший рендер у браузері дає `<p className={\"theme-\" + localStorage.getItem(\"theme\")}>Hi</p>`, а збережено `\"dark\"`. Текст однаковий, розійшовся лише атрибут. Що буде на сторінці після гідратації?"
      en: "The server sent `<p class=\"theme-light\">Hi</p>`. The first render in the browser produces `<p className={\"theme-\" + localStorage.getItem(\"theme\")}>Hi</p>`, and `\"dark\"` is saved. The text is the same; only the attribute diverged. What is on the page after hydration?"
    answer:
      type: choice
      options:
        - id: stays-light
          text: { uk: "`class=\"theme-light\"` і попередження в консолі: атрибут React не виправляє", en: "`class=\"theme-light\"` and a warning in the console: React does not fix the attribute" }
        - id: becomes-dark
          text: { uk: "`class=\"theme-dark\"`: React виправив атрибут, попередження лише інформує", en: "`class=\"theme-dark\"`: React fixed the attribute, the warning is just for information" }
          why:
            uk: "Для атрибутів React 19 нічого не латає. Його повідомлення так і каже: «This won't be patched up». Сторінка лишається зі старим класом, доки щось не змусить React відрендерити цей елемент знову з іншим значенням."
            en: "For attributes React 19 patches nothing. Its message says exactly that: “This won't be patched up”. The page keeps the old class until something makes React render that element again with a different value."
        - id: rebuilt
          text: { uk: "`class=\"theme-dark\"`: React відкинув серверний HTML і побудував дерево заново", en: "`class=\"theme-dark\"`: React threw away the server HTML and rebuilt the tree" }
          why:
            uk: "Так React 19 робить, коли розходиться текст. Для атрибутів дерево не перебудовується — лише попередження."
            en: "That is what React 19 does when the text diverges. For attributes the tree is not rebuilt — just a warning."
      correct: [stays-light]
    explanation:
      uk: "Ми перевірили це в пісочниці: консоль показала «A tree hydrated but some attributes of the server rendered HTML didn't match the client properties. This won't be patched up.», а на сторінці лишився серверний клас. Людина бачить світлу тему, хоча обрала темну, — і жодної помилки на екрані."
      en: "We checked this in the sandbox: the console showed “A tree hydrated but some attributes of the server rendered HTML didn't match the client properties. This won't be patched up.”, and the server class stayed on the page. The person sees the light theme although they chose the dark one — and no error on the screen."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: коли виконується ефект"
      en: "Recall: when an effect runs"
    items:
      - id: effect-after-commit
        from: re-03-02-effects-synchronize-external
        prompt:
          uk: "Компонент викликає `setTheme(saved)` усередині `useEffect(() => { … }, [])`. Коли цей код виконується вперше?"
          en: "A component calls `setTheme(saved)` inside `useEffect(() => { … }, [])`. When does this code run for the first time?"
        answer:
          type: choice
          options:
            - id: after-commit
              text: { uk: "Після того, як перший рендер потрапив на екран", en: "After the first render has reached the screen" }
            - id: during-render
              text: { uk: "Під час першого рендеру, перед `return`", en: "During the first render, before `return`" }
              why:
                uk: "Під час рендеру React лише запам’ятовує функцію ефекту. Викликає він її пізніше."
                en: "During render React only remembers the effect function. It calls it later."
            - id: before-render
              text: { uk: "Ще до першого рендеру, щоб перший рендер уже мав збережене значення", en: "Before the first render, so that the first render already has the saved value" }
              why:
                uk: "Ефект не може виконатися до рендеру: він оголошується саме в рендері. Тому перший рендер завжди бачить початковий стан."
                en: "An effect cannot run before the render: it is declared in the render itself. So the first render always sees the initial state."
          correct: [after-commit]
        explanation:
          uk: "Ефект виконується після commit — а під час гідратації після того, як React підхопив серверний HTML. Саме тому ефект — правильне місце для всього, що є лише в браузері: перший рендер лишається таким, як на сервері."
          en: "An effect runs after commit — and during hydration, after React has taken over the server HTML. That is exactly why an effect is the right place for everything that exists only in the browser: the first render stays as it was on the server."

  - id: client-only-date
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: client-only-date
    entry: index.html
    editable: [ClientOnlyDate.jsx]
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      lastDone: { uk: "Останнє виконання", en: "Last completed" }
    title:
      uk: "Дата у форматі читача без розбіжності"
      en: "A date in the reader's format without a mismatch"
    instructions:
      uk: |
        Сервер не знає мови читача, тому надрукував у `index.html` дату як є: `2026-03-01`. Зараз `ClientOnlyDate` форматує її через `formatDay` (з `format.js`) уже в першому рендері — гідратація розходиться, і в консолі помилка.

        Зміни `ClientOnlyDate.jsx`:

        - перший рендер показує в `<time dateTime={iso}>` той самий текст, що й сервер, — `iso`;
        - після монтування той самий елемент показує `formatDay(iso)`.

        Перевірки гідратують сторінку, збирають помилки, про які повідомив React, перевіряють, що серверні `<time>` лишилися на сторінці, і що потім кожна дата показана у форматі читача.
      en: |
        The server does not know the reader’s language, so it printed the date in `index.html` as it is: `2026-03-01`. Right now `ClientOnlyDate` formats it with `formatDay` (from `format.js`) already in the first render — hydration diverges, and the console shows an error.

        Change `ClientOnlyDate.jsx`:

        - the first render shows in `<time dateTime={iso}>` the same text as the server — `iso`;
        - after mount the same element shows `formatDay(iso)`.

        The checks hydrate the page, collect the errors React reported, check that the server’s `<time>` elements stayed on the page, and that afterwards every date is shown in the reader’s format.
    testTitles:
      "hydration reports no mismatch":
        uk: "Гідратація не повідомляє про розбіжності"
        en: "Hydration reports no mismatch"
      "the <time> elements from the server stay on the page":
        uk: "Серверні елементи `<time>` лишаються на сторінці"
        en: "The `<time>` elements from the server stay on the page"
      "after mount every date shows in the reader's format":
        uk: "Після монтування кожна дата показана у форматі читача"
        en: "After mount every date shows in the reader’s format"
    hints:
      nudge:
        uk: "Що має показати найперший рендер у браузері, щоб він збігся з `index.html`? І який механізм React запускає код лише **після** того, як рендер потрапив на сторінку?"
        en: "What must the very first render in the browser show to match `index.html`? And which React mechanism runs code only **after** a render has reached the page?"
      explanation:
        uk: |
          Потрібні два проходи: перший рендер дає стабільне значення, однакове на сервері й у браузері, а ефект після монтування міняє стан на «браузерне» значення, і React рендерить ще раз. Схожий приклад — розмір вікна:

          ```jsx
          const [width, setWidth] = useState(null); // на сервері розміру вікна немає
          useEffect(() => setWidth(window.innerWidth), []);
          ```

          Перевірка `typeof window !== "undefined"` тут не допоможе: у браузері `window` є й під час гідратаційного рендеру.
        en: |
          Two passes are needed: the first render produces a stable value that is the same on the server and in the browser, and an effect after mount changes the state to the “browser” value, and React renders once more. A similar example is the window size:

          ```jsx
          const [width, setWidth] = useState(null); // a server has no window size
          useEffect(() => setWidth(window.innerWidth), []);
          ```

          A `typeof window !== "undefined"` check does not help here: in the browser `window` exists during the hydration render too.
    solutionNote:
      uk: "Перший рендер дає `iso` — рівно те, що надрукував сервер, тож гідратація проходить чисто й серверні вузли лишаються. Ефект виконується вже після гідратації й міняє текст на формат читача. Ціна — короткий момент, коли видно `2026-03-01`; зате немає помилки й перебудови дерева. Варіант із прапорцем `mounted` працює так само."
      en: "The first render produces `iso` — exactly what the server printed, so hydration passes cleanly and the server nodes stay. The effect runs after hydration and changes the text to the reader’s format. The price is a short moment in which `2026-03-01` is visible; in return there is no error and no rebuilt tree. A variant with a `mounted` flag works the same way."
    feedback:
      - when: { test: "hydration reports no mismatch" }
        message:
          uk: "Ця перевірка чекає, що React не повідомить жодної розбіжності гідратації. Перший рендер `<time>` має містити той самий текст, що й `index.html`, — `iso`, а не `formatDay(iso)`. Перевірка `typeof window` цього не дає: у браузері `window` є вже під час гідратації. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check expects React to report no hydration mismatch. The first render of `<time>` must contain the same text as `index.html` — `iso`, not `formatDay(iso)`. A `typeof window` check does not give that: in the browser `window` exists already during hydration. If every check fails at once, fix the first error in the console first."
      - when: { test: "the <time> elements from the server stay on the page" }
        message:
          uk: "Ця перевірка чекає, що обидва серверні `<time>` лишаться на сторінці. Якщо гідратація розійшлася, React викидає серверні вузли й створює нові — спершу прибери розбіжність."
          en: "This check expects both server `<time>` elements to stay on the page. If hydration diverged, React throws the server nodes away and creates new ones — remove the mismatch first."
      - when: { test: "after mount every date shows in the reader's format" }
        message:
          uk: "Ця перевірка чекає, що після монтування кожен `<time>` показує `formatDay(iso)`. Якщо там досі `2026-03-01`, текст ніщо не оновлює: потрібен ефект, що після монтування змінює стан."
          en: "This check expects every `<time>` to show `formatDay(iso)` after mount. If it still shows `2026-03-01`, nothing updates the text: an effect that changes the state after mount is needed."

  - id: to-project
    kind: transfer
    capstoneStep: RE-11
    body:
      uk: "Пошукай у своєму проєкті рендер, що читає годинник, `localStorage` чи форматує числа й дати за мовою браузера: ціну в списку бажань, «на сьогодні» в планувальнику, серію звички, суму витрат. Це й будуть ризики гідратації, один з яких ти запишеш у кроці проєкту — у NO-13 його перевірять на справжньому сервері."
      en: "Look in your project for a render that reads the clock or `localStorage`, or formats numbers and dates in the browser’s language: a price in the wishlist, “due today” in the planner, a habit streak, an expense total. Those are the hydration risks, one of which you will record in the project step — in NO-13 it will be checked on a real server."
