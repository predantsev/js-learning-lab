id: no-01-04-event-loop-phases
unit: NO-01
title:
  uk: "Фази event loop у Node (оглядово)"
  en: "Event loop phases (awareness)"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачити порядок `process.nextTick`, колбека проміса, `setTimeout(…, 0)` і `setImmediate`, запланованих усередині колбека вводу-виводу."
    en: "Predict the order of `process.nextTick`, a promise callback, `setTimeout(…, 0)` and `setImmediate` scheduled inside an I/O callback."
  - uk: "Пояснити, чому порядок тайм-ауту й `setImmediate` не гарантований на верхньому рівні головного модуля, але гарантований усередині колбека вводу-виводу."
    en: "Explain why timeout-versus-immediate order is not guaranteed in the main module but is guaranteed inside an I/O callback."
  - uk: "Назвати фазу (timers, poll, check, close), у якій виконується даний колбек, — на рівні загального розуміння."
    en: "Name the phase (timers, poll, check, close) in which a given callback runs, at awareness level."
prerequisites: [no-01-03-modules-resolution, js-08-04-microtasks-vs-tasks]
subskills:
  - { family: B-01, skill: "async event loop phases awareness", depth: intro }
glossary: [event-loop-phase, set-immediate, next-tick-queue]
selfCheck: [predict-io-order, import-steps]

blocks:
  - id: rounds-and-phases
    kind: explanation
    title:
      uk: "Цикл Node ходить по колу фаз"
      en: "Node’s loop goes round its phases"
    body:
      uk: |
        У браузері ти бачив [[event-loop|event loop]] з однією чергою задач і [[microtask-queue|чергою мікрозадач]]. У Node цикл влаштований інакше: він ходить **по колу** через кілька [[event-loop-phase|фаз]], і кожна фаза має власну чергу колбеків:

        - **timers** — колбеки `setTimeout` і `setInterval`, чий час уже настав;
        - **poll** — колбеки вводу-виводу: файл прочитано (`readFile`), прийшли дані з мережі;
        - **check** — колбеки [[set-immediate|`setImmediate`]];
        - **close** — колбеки закриття, наприклад подія `'close'` у сокета.

        Між **будь-якими двома колбеками** Node спершу спорожнює [[next-tick-queue|чергу `process.nextTick`]], а потім — мікрозадачі промісів. Тож колбек `then` чи `nextTick` ніколи не чекає наступної фази. (Документація Node.js 22 позначає `process.nextTick` як Legacy і радить у новому коді `queueMicrotask`; але в бібліотеках і чужому коді ти його ще зустрінеш.)

        Це урок на загальне розуміння: справжній цикл має ще кілька службових фаз, але для передбачення порядку вистачає цих чотирьох.
      en: |
        In the browser you saw the [[event-loop|event loop]] with one task queue and the [[microtask-queue|microtask queue]]. Node’s loop is built differently: it goes **round** through several [[event-loop-phase|phases]], and each phase has its own queue of callbacks:

        - **timers** — `setTimeout` and `setInterval` callbacks whose time has come;
        - **poll** — I/O callbacks: a file was read (`readFile`), data arrived from the network;
        - **check** — [[set-immediate|`setImmediate`]] callbacks;
        - **close** — close callbacks, for example a socket’s `'close'` event.

        Between **any two callbacks** Node first empties the [[next-tick-queue|`process.nextTick` queue]], then the promise microtasks. So a `then` or `nextTick` callback never waits for the next phase. (The Node.js 22 documentation marks `process.nextTick` as Legacy and recommends `queueMicrotask` for new code; you will still meet it in libraries and other people’s code.)

        This lesson is for general understanding: the real loop has a few more internal phases, but these four are enough to predict the order.

  - id: guard-rounds
    kind: analogy
    body:
      uk: "Уяви охоронця, що обходить чотири кімнати завжди в тому самому порядку: «годинники» (timers), «пошта» (poll), «негайні записки» (check), «вихід» (close). У кожній кімнаті він виконує доручення, які там уже чекають. А після **кожного** доручення спершу перечитує свій блокнот термінових справ (`nextTick`), потім звичайні записки (проміси) — і лише тоді йде далі. Записка `setImmediate` лежить у кімнаті check: охоронець дійде туди одразу після пошти, а до «годинників» — лише на наступному колі."
      en: "Picture a guard who walks through four rooms, always in the same order: “clocks” (timers), “mail” (poll), “immediate notes” (check), “exit” (close). In each room he carries out the jobs already waiting there. And after **every** job he first rereads his notebook of urgent tasks (`nextTick`), then the ordinary notes (promises) — only then does he move on. A `setImmediate` note lies in the check room: the guard gets there right after the mail, but reaches the clocks only on the next round."
    limits:
      uk: "Охоронець не чекає в порожній кімнаті, а справжній цикл може зачекати у фазі poll, доки не прийде ввід-вивід або не настане час таймера. І коли саме охоронець «почав обхід» на старті програми, залежить від годинника комп’ютера, — тому порядок на верхньому рівні не гарантований."
      en: "The guard does not wait in an empty room, but the real loop may wait in the poll phase until I/O arrives or a timer is due. And exactly when the guard “starts his round” at program start depends on the computer’s clock — that is why the order at the top level is not guaranteed."

  - id: predict-io-order
    kind: prediction
    prompt:
      uk: "Чотири колбеки заплановано всередині колбека `readFile`, тобто у фазі poll. Розстав їх у тому порядку, у якому вони виконаються."
      en: "Four callbacks are scheduled inside a `readFile` callback, that is, in the poll phase. Put them in the order they run."
    code: |
      readFile("expenses.json", "utf8", () => {
        setTimeout(() => console.log("setTimeout 0"), 0);
        setImmediate(() => console.log("setImmediate"));
        Promise.resolve().then(() => console.log("promise"));
        process.nextTick(() => console.log("nextTick"));
      });
    runnable: false
    answer:
      type: order
      items:
        - { id: tick, code: "nextTick" }
        - { id: promise, code: "promise" }
        - { id: immediate, code: "setImmediate" }
        - { id: timeout, code: "setTimeout 0" }
    explanation:
      uk: "Коли колбек `readFile` закінчується, Node спершу спорожнює чергу `nextTick`, потім мікрозадачі промісів. Далі цикл виходить із poll і йде у check — там `setImmediate`. До timers він дійде лише на наступному колі, тож `setTimeout(…, 0)` — останній, хоч його й заплановано першим. «Immediate» не означає «раніше за все»: проміси й `nextTick` випереджають його."
      en: "When the `readFile` callback ends, Node first empties the `nextTick` queue, then the promise microtasks. Then the loop leaves poll and goes to check — that is `setImmediate`. It reaches timers only on the next round, so `setTimeout(…, 0)` is last, even though it was scheduled first. “Immediate” does not mean “before everything”: promises and `nextTick` come before it."

  - id: phases-ring
    kind: visual
    visual: diagram
    title:
      uk: "Одне коло циклу після `readFile`"
      en: "One round of the loop after `readFile`"
    textEquivalent:
      uk: "Чотири фази стоять по колу: timers, poll, check, close, а потім знову timers. Окремо — дві черги, які Node спорожнює після кожного колбека: спершу nextTick, потім проміси. Коли файл прочитано, у фазі poll виконується колбек readFile і планує чотири колбеки. Щойно він закінчується, спрацьовують nextTick, потім promise. Далі цикл переходить у check і виконує setImmediate. Фаза close порожня. На наступному колі у фазі timers виконується setTimeout з нулем мілісекунд. На верхньому рівні модуля, до першого кола, порядок setTimeout і setImmediate залежить від того, чи минула вже одна мілісекунда, коли цикл вперше дійшов до timers."
      en: "Four phases stand in a circle: timers, poll, check, close, then timers again. Apart from them are two queues that Node empties after every callback: first nextTick, then promises. When the file has been read, the readFile callback runs in the poll phase and schedules four callbacks. As soon as it ends, nextTick runs, then promise. Next the loop moves to check and runs setImmediate. The close phase is empty. On the next round, in the timers phase, the zero-millisecond setTimeout runs. At the top level of a module, before the first round, the order of setTimeout and setImmediate depends on whether one millisecond has already passed when the loop first reaches timers."
    spec:
      layout: grid
      nodes:
        - { id: timers, label: "timers", shape: round, w: 130, col: 0, row: 0 }
        - { id: poll, label: "poll (I/O)", shape: round, w: 130, col: 1, row: 0 }
        - { id: close, label: "close", shape: round, w: 130, col: 0, row: 1 }
        - { id: check, label: "check", shape: round, w: 130, col: 1, row: 1 }
        - { id: queues, label: "nextTick → promise", shape: note, w: 170, col: 1, row: 2 }
      edges:
        - { id: timers-poll, from: timers, to: poll }
        - { id: poll-check, from: poll, to: check }
        - { id: check-close, from: check, to: close }
        - { id: close-timers, from: close, to: timers, label: { uk: "нове коло", en: "next round" } }
        - { id: after-callback, from: check, to: queues, kind: dashed, label: { uk: "після колбека", en: "after a callback" } }
      steps:
        - caption:
            uk: "Цикл ходить по колу: timers → poll → check → close → знову timers. Після кожного колбека Node спорожнює дві черги: спершу `nextTick`, потім проміси."
            en: "The loop goes round: timers → poll → check → close → timers again. After every callback Node empties two queues: first `nextTick`, then promises."
        - caption:
            uk: "Файл прочитано: у фазі **poll** виконується колбек `readFile`. Він планує `setTimeout(…, 0)`, `setImmediate`, `then` і `nextTick`."
            en: "The file has been read: the `readFile` callback runs in the **poll** phase. It schedules `setTimeout(…, 0)`, `setImmediate`, `then` and `nextTick`."
          highlight: [poll]
          dim: [timers, check, close, queues]
        - caption:
            uk: "Колбек закінчився — до будь-якої фази Node спорожнює черги: друкується `nextTick`, потім `promise`."
            en: "The callback has ended — before any phase, Node empties the queues: `nextTick` is printed, then `promise`."
          highlight: [queues]
          dim: [timers, close]
        - caption:
            uk: "Цикл виходить із poll і йде у **check**: друкується `setImmediate`. Таймер тим часом чекає у фазі timers, яку цикл уже минув на цьому колі."
            en: "The loop leaves poll and goes to **check**: `setImmediate` is printed. Meanwhile the timer waits in the timers phase, which the loop already passed on this round."
          highlight: [check, poll-check]
          dim: [timers, close, queues]
        - caption:
            uk: "Фаза **close** порожня. Нове коло починається з **timers**: друкується `setTimeout 0` — останнім, хоч його заплановано першим."
            en: "The **close** phase is empty. The next round starts with **timers**: `setTimeout 0` is printed — last, even though it was scheduled first."
          highlight: [close, close-timers, timers]
          dim: [poll, check, queues]
        - caption:
            uk: "На верхньому рівні модуля цикл ще не почав коло. `setTimeout(…, 0)` насправді чекає 1 мс: якщо вона минула до першого заходу в timers — тайм-аут перший, якщо ні — першим буде `setImmediate`."
            en: "At the top level of a module the loop has not started a round yet. `setTimeout(…, 0)` really waits 1 ms: if it has passed by the first visit to timers, the timeout is first; if not, `setImmediate` is."
          highlight: [timers, check]
          dim: [poll, close, queues]

  - id: four-callbacks
    kind: example
    runtime: isolated-node
    dir: four-callbacks
    entry: index.js
    strings:
      readDone: { uk: "Файл прочитано, витрат", en: "File read, expenses" }
      insideIo: { uk: "У колбеку readFile", en: "Inside the readFile callback" }
      topLevel: { uk: "На верхньому рівні", en: "At the top level" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
    title:
      uk: "Ті самі чотири колбеки з двох місць"
      en: "The same four callbacks from two places"
    body:
      uk: |
        `scheduleFour` планує чотири колбеки й друкує один рядок — порядок, у якому вони виконалися. Зараз її викликає лише колбек `readFile`.

        Натисни **Запустити** кілька разів і порівняй рядок «У колбеку readFile» зі своєю відповіддю. Він щоразу той самий: після poll цикл завжди йде в check.
      en: |
        `scheduleFour` schedules four callbacks and prints one line — the order they ran in. Right now only the `readFile` callback calls it.

        Press **Run** a few times and compare the line “Inside the readFile callback” with your answer. It is the same every time: after poll the loop always goes to check.
    tryIt:
      uk: |
        1. В останньому рядку `index.js` прибери `// ` перед `scheduleFour(...)` і запусти кілька разів. Рядок «На верхньому рівні» починається з `promise → nextTick`: в ES-модулі код верхнього рівня сам виконується як мікрозадача, тож проміси випереджають `nextTick` (документація Node.js 22, розділ про `process.nextTick`, показує саме таку різницю між ES-модулями й CommonJS).
        2. Подивись на кінець цього рядка. Порядок `setImmediate` і `setTimeout 0` тут **не гарантований**: під час підготовки уроку в терміналі (Node.js 25.2.1) він змінювався від запуску до запуску, а на платформі шість запусків поспіль дали `setImmediate` першим. Покладатися на нього не можна. Та й сам рядок може з’явитися до або після «Файл прочитано».
      en: |
        1. In the last line of `index.js` remove the `// ` before `scheduleFour(...)` and run a few times. The line “At the top level” starts with `promise → nextTick`: in an ES module the top-level code itself runs as a microtask, so promises come before `nextTick` (the Node.js 22 documentation, in the section about `process.nextTick`, shows exactly this difference between ES modules and CommonJS).
        2. Look at the end of that line. The order of `setImmediate` and `setTimeout 0` there is **not guaranteed**: while this lesson was prepared, in a terminal (Node.js 25.2.1) it changed from run to run, while on the platform six runs in a row put `setImmediate` first. You cannot rely on it. The line itself may also appear before or after “File read”.

  - id: recall-loop
    kind: review
    title:
      uk: "Пригадай: таймери й мікрозадачі в браузері"
      en: "Recall: timers and microtasks in the browser"
    items:
      - id: stack-before-timer
        from: js-08-01-timers-and-the-event-loop
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          setTimeout(() => console.log("timer"), 0);
          for (let i = 0; i < 3; i += 1) console.log(i);
        verify: { logs: ["0", "1", "2", "timer"] }
        answer:
          type: choice
          options:
            - id: loop-first
              code: "0 1 2 timer"
            - id: timer-first
              code: "timer 0 1 2"
              why:
                uk: "Нуль мілісекунд — не «зараз». Колбек таймера чекає, доки стек викликів спорожніє, тобто доки закінчиться весь синхронний код."
                en: "Zero milliseconds is not “now”. A timer callback waits until the call stack is empty, that is, until all the synchronous code has finished."
            - id: timer-inside
              code: "0 timer 1 2"
              why:
                uk: "Таймер не може вклинитися в цикл: поки виконується синхронний код, колбеки не запускаються."
                en: "A timer cannot squeeze into the loop: no callback starts while synchronous code is running."
          correct: [loop-first]
        explanation:
          uk: "Спершу весь синхронний код: `0`, `1`, `2`. Колбек таймера отримує чергу, лише коли стек порожній. У Node це правило те саме."
          en: "First all the synchronous code: `0`, `1`, `2`. The timer callback gets its turn only when the stack is empty. The rule is the same in Node."
      - id: microtask-before-task
        from: js-08-04-microtasks-vs-tasks
        prompt:
          uk: "Що виведе цей код у браузері?"
          en: "What does this code print in a browser?"
        code: |
          setTimeout(() => console.log("task"), 0);
          Promise.resolve().then(() => console.log("microtask"));
          console.log("sync");
        verify: { logs: ["sync", "microtask", "task"] }
        answer:
          type: choice
          options:
            - id: sync-micro-task
              code: "sync microtask task"
            - id: in-order
              code: "task microtask sync"
              why:
                uk: "Порядок рядків коду не визначає порядку виводу: синхронний код іде першим, а колбеки чекають у чергах."
                en: "The order of the lines of code does not decide the order of the output: synchronous code goes first, and callbacks wait in queues."
            - id: task-before-micro
              code: "sync task microtask"
              why:
                uk: "Черга мікрозадач спорожнюється повністю до наступної задачі, тому колбек проміса випереджає таймер."
                en: "The microtask queue is emptied completely before the next task, so the promise callback comes before the timer."
          correct: [sync-micro-task]
        explanation:
          uk: "Синхронний код, потім усі мікрозадачі, потім наступна задача. У Node до цього додаються фази й черга `nextTick`, але правило «мікрозадачі раніше за таймер» лишається."
          en: "Synchronous code, then all microtasks, then the next task. Node adds phases and the `nextTick` queue on top, but the rule “microtasks before the timer” stays."

  - id: import-steps
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: import-steps
    entry: index.js
    editable: [app.js]
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
    title:
      uk: "Імпорт витрат у передбачуваному порядку"
      en: "An expense import in a predictable order"
    instructions:
      uk: |
        `runImport(file, log)` читає файл витрат і викликає `log('read')`. Допиши в колбек `readFile` після `log('read')` чотири кроки, щоб `log` отримав їх **у такому порядку**: `'validate'`, `'total'`, `'save'`, `'report'`.

        - Кожен крок заплануй **окремим** інструментом, по одному разу: `process.nextTick`, колбек проміса (`Promise.resolve().then` або `queueMicrotask`), `setImmediate` і `setTimeout(…, 0)`. Перевірка рахує виклики `process.nextTick`, `setImmediate` і `setTimeout` усередині колбека.
        - Біля кожного рядка коду напиши коментар: з якої черги чи фази виконається цей колбек.

        Порядок має бути гарантованим, а не випадковим, — тому все плануй усередині колбека `readFile`.
      en: |
        `runImport(file, log)` reads the expense file and calls `log('read')`. In the `readFile` callback, after `log('read')`, add four steps so that `log` receives them **in this order**: `'validate'`, `'total'`, `'save'`, `'report'`.

        - Schedule each step with a **different** tool, once each: `process.nextTick`, a promise callback (`Promise.resolve().then` or `queueMicrotask`), `setImmediate` and `setTimeout(…, 0)`. The check counts the calls of `process.nextTick`, `setImmediate` and `setTimeout` inside the callback.
        - Next to each line of code, write a comment: which queue or phase this callback runs from.

        The order must be guaranteed, not lucky — so schedule everything inside the `readFile` callback.
    testTitles:
      "logs read, validate, total, save and report in this order":
        uk: "`log` отримує `read`, `validate`, `total`, `save`, `report` у цьому порядку"
        en: "`log` receives `read`, `validate`, `total`, `save`, `report` in this order"
      "uses process.nextTick, setImmediate and setTimeout once each":
        uk: "У колбеку по одному виклику `process.nextTick`, `setImmediate` і `setTimeout`"
        en: "The callback calls `process.nextTick`, `setImmediate` and `setTimeout` once each"
    hints:
      nudge:
        uk: "Розстав чотири інструменти за тим, коли вони спрацьовують після колбека вводу-виводу: що ще до будь-якої фази, а що — у check і timers?"
        en: "Order the four tools by when they fire after an I/O callback: which run before any phase, and which in check and in timers?"
      explanation:
        uk: "Після колбека з фази poll першою спорожнюється черга `nextTick`, за нею — мікрозадачі промісів. Потім цикл іде у фазу check (`setImmediate`), а timers (`setTimeout`) буде лише на наступному колі. Тобто найраніший крок дай інструменту, що спрацьовує найраніше, і так далі. Порядок рядків коду значення не має — лише інструмент."
        en: "After a callback from the poll phase, the `nextTick` queue is emptied first, followed by the promise microtasks. Then the loop goes to the check phase (`setImmediate`), and timers (`setTimeout`) come only on the next round. So give the earliest step to the tool that fires earliest, and so on. The order of the lines of code does not matter — only the tool."
    solutionNote:
      uk: "`validate` — черга `nextTick`, `total` — мікрозадача проміса, `save` — фаза check (`setImmediate`), `report` — фаза timers наступного кола. Усередині колбека вводу-виводу цей порядок гарантований; на верхньому рівні модуля `setTimeout` і `setImmediate` могли б помінятися місцями."
      en: "`validate` is the `nextTick` queue, `total` a promise microtask, `save` the check phase (`setImmediate`), `report` the timers phase of the next round. Inside an I/O callback this order is guaranteed; at the top level of a module `setTimeout` and `setImmediate` could swap places."
    feedback:
      - when: { test: "logs read, validate, total, save and report in this order" }
        message:
          uk: "Ця перевірка чекає, що `log` отримає рівно `read`, `validate`, `total`, `save`, `report` — у цьому порядку. `setImmediate` спрацьовує не «негайно», а у фазі check: після `nextTick` і промісів."
          en: "This check expects `log` to receive exactly `read`, `validate`, `total`, `save`, `report` — in this order. `setImmediate` does not fire “immediately” but in the check phase: after `nextTick` and promises."
      - when: { test: "uses process.nextTick, setImmediate and setTimeout once each" }
        message:
          uk: "Ця перевірка рахує виклики в колбеку `readFile` після `log('read')` і чекає по одному `process.nextTick`, `setImmediate` і `setTimeout`. Правильний порядок без цих інструментів (усе синхронно чи два тайм-аути) не рахується."
          en: "This check counts the calls in the `readFile` callback after `log('read')` and expects one each of `process.nextTick`, `setImmediate` and `setTimeout`. The right order without these tools (everything synchronous, or two timeouts) does not count."

  - id: to-project
    kind: transfer
    capstoneStep: NO-01
    body:
      uk: "За планом скрипт у кроці проєкту лише завантажує фікстури й друкує підсумок, тож порядок фаз на його результат, найімовірніше, не вплине. Знадобиться він у наступних розділах, коли сервер читатиме файли й відповідатиме на запити одночасно."
      en: "As planned, the script in the project step only loads fixtures and prints a summary, so the order of phases will most likely not affect its result. You will need it in the next units, when the server reads files and answers requests at the same time."
