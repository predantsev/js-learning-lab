id: no-01-01-node-vs-browser
unit: NO-01
title:
  uk: "Node і браузер: два середовища для одного JavaScript"
  en: "Node vs browser"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Розкласти `document`, `localStorage`, `fetch`, `process`, `fs`, `setTimeout` і `URL` на «лише браузер», «лише Node» та «обидва» й передбачити, що дасть звертання до кожного в іншому середовищі."
    en: "Sort `document`, `localStorage`, `fetch`, `process`, `fs`, `setTimeout` and `URL` into browser-only, Node-only and both, and predict what referencing each in the other runtime does."
  - uk: "Пояснити, чому Node-програма не має сторінки, DOM і пісочниці same-origin, але може читати файли й відкривати мережеві з’єднання з правами користувача."
    en: "Explain why a Node script has no page, no DOM and no same-origin sandbox, yet can read files and open network connections with the user’s permissions."
prerequisites: [js-15-03-node-and-package-manifest, js-06-08-dom-query-create-update]
subskills:
  - { family: B-01, skill: "Node vs browser APIs", depth: intro }
glossary: [host-api]
selfCheck: [predict-typeof, which-host]

blocks:
  - id: two-hosts
    kind: explanation
    title:
      uk: "Одна мова, два господарі"
      en: "One language, two hosts"
    body:
      uk: |
        Ти вже запускав файли командою `node file.mjs` ([[node-runtime|Node.js]]). Тепер цілий етап курсу — про те, що вміє JavaScript поза браузером.

        Мова скрізь та сама: `if`, функції, масиви, `Promise`, `JSON`. Але мова сама нічого не показує й не зберігає. Усе, що торкається світу навколо, дає **середовище**, у якому код виконується, — це [[host-api|host API]]:

        - **браузер** дає сторінку: `document` (DOM), `window`, `localStorage`;
        - **Node.js** дає процес і комп’ютер: `process` (аргументи, змінні оточення, код завершення), модулі `node:fs` (файли) і `node:http` (сервери);
        - **обидва** дають `setTimeout`, `URL`, `fetch` і `console`, хоча влаштовані вони всередині по-різному.

        У Node немає сторінки, тому немає й `document`: це не «браузер без вікна», а інша програма з іншим набором API.
      en: |
        You have already run files with `node file.mjs` ([[node-runtime|Node.js]]). Now a whole stage of the course is about what JavaScript can do outside the browser.

        The language is the same everywhere: `if`, functions, arrays, `Promise`, `JSON`. But the language on its own shows nothing and stores nothing. Everything that touches the world around it comes from the **environment** the code runs in — its [[host-api|host APIs]]:

        - the **browser** gives a page: `document` (the DOM), `window`, `localStorage`;
        - **Node.js** gives a process and the computer: `process` (arguments, environment variables, exit code), the modules `node:fs` (files) and `node:http` (servers);
        - **both** give `setTimeout`, `URL`, `fetch` and `console`, even though they work differently inside.

        Node has no page, so it has no `document` either: it is not “a browser without a window” but a different program with a different set of APIs.

  - id: predict-typeof
    kind: prediction
    prompt:
      uk: "Цей рядок коду виконує справжній Node.js. Що він виведе? (Оператор `typeof` для назви, якої взагалі немає, повертає `\"undefined\"` і не кидає помилку.)"
      en: "Real Node.js runs this line of code. What does it print? (For a name that does not exist at all, `typeof` returns `\"undefined\"` and does not throw.)"
    code: |
      console.log(typeof document, typeof process, typeof fetch, typeof setTimeout);
    runnable: false
    answer:
      type: choice
      options:
        - id: node-host
          code: "undefined object function function"
        - id: headless-browser
          code: "object object function function"
          why:
            uk: "Node — не браузер без вікна. Сторінки там немає взагалі, тож немає й `document`: DOM-код у Node не «працює без екрана», а не має на чому працювати."
            en: "Node is not a browser without a window. There is no page at all, so there is no `document`: DOM code in Node does not “run headless”, it has nothing to run on."
        - id: no-fetch
          code: "undefined object undefined function"
          why:
            uk: "`fetch` — глобальна функція в Node.js із версії 18, а в Node.js 22, який потрібен курсу, — стабільна частина середовища."
            en: "`fetch` has been a global function in Node.js since version 18, and in Node.js 22, which the course requires, it is a stable part of the host."
        - id: throws
          code: "ReferenceError: document is not defined"
          why:
            uk: "`typeof` — єдиний спосіб звернутися до неіснуючої назви без помилки. `ReferenceError` дасть читання `document.title`, а не `typeof document`."
            en: "`typeof` is the one way to refer to a missing name without an error. Reading `document.title` gives a `ReferenceError`, `typeof document` does not."
      correct: [node-host]
    explanation:
      uk: "У Node немає сторінки, тож `document` немає (`undefined`). `process` — об’єкт, який Node дає кожній програмі. `fetch` і `setTimeout` є в обох середовищах, тому це функції. Справжній Node.js друкує саме це (перевірено під час підготовки уроку)."
      en: "Node has no page, so there is no `document` (`undefined`). `process` is an object Node gives every program. `fetch` and `setTimeout` exist in both hosts, so they are functions. Real Node.js prints exactly this (checked while this lesson was prepared)."

  - id: probe
    kind: example
    runtime: isolated-node
    dir: probe
    entry: index.js
    strings:
      firstLine: { uk: "Перший рядок цього файлу", en: "First line of this file" }
    title:
      uk: "Запитай середовище, що в ньому є"
      en: "Ask the host what it has"
    body:
      uk: |
        Цей приклад виконує **справжній Node.js** на твоєму комп’ютері: платформа запускає його окремим процесом, а вивід показує в **Консолі**. Сторінки тут немає — лише текст, який друкує програма.

        Натисни **Запустити**. Перший рядок — версія Node.js, далі — що повертає `typeof` для шести назв, а в кінці програма читає перший рядок власного файлу через `node:fs`. У браузері так не можна: сторінка не має доступу до файлів на диску.
      en: |
        This example runs in **real Node.js** on your computer: the platform starts it as a separate process and shows the output in the **Console**. There is no page here — only the text the program prints.

        Press **Run**. The first line is the Node.js version, then what `typeof` returns for six names, and at the end the program reads the first line of its own file through `node:fs`. A browser cannot do that: a page has no access to files on the disk.
    tryIt:
      uk: |
        1. Додай у кінець файлу рядок коду `console.log(document.title);` і запусти. Програма зупиниться з `ReferenceError: document is not defined`: читання неіснуючої назви — помилка, на відміну від `typeof`. Видали цей рядок.
        2. Додай `console.log(typeof localStorage);` і запусти. Результат залежить від версії Node.js (перший рядок виводу): у Node.js 22 цієї назви немає (`undefined`); у Node.js 25.2.1, на якому готували урок, вона є (`object`), але без спеціального параметра запуску нічого не зберігає й друкує червоне попередження. Сховище браузера, прив’язане до адреси сторінки, Node не має.
      en: |
        1. Add the line of code `console.log(document.title);` at the end of the file and run. The program stops with `ReferenceError: document is not defined`: reading a missing name is an error, unlike `typeof`. Delete that line.
        2. Add `console.log(typeof localStorage);` and run. The result depends on the Node.js version (the first line of the output): in Node.js 22 the name does not exist (`undefined`); in Node.js 25.2.1, which this lesson was prepared with, it exists (`object`) but stores nothing without a special start option and prints a red warning. The browser’s storage tied to a page’s address is something Node does not have.

  - id: hosts-map
    kind: visual
    visual: diagram
    title:
      uk: "Хто що дає: мова, браузер, Node"
      en: "Who provides what: the language, the browser, Node"
    textEquivalent:
      uk: "Три рамки. Угорі — браузер: document, window і localStorage. Посередині — те, що є в обох середовищах: setTimeout, fetch, URL, а також сама мова (Promise, JSON, масиви), яку виконує рушій JavaScript. Унизу — Node.js: process, node:fs і node:http. Назва з рамки браузера в Node не існує: typeof дає undefined, а читання document.title кидає ReferenceError. Назви з рамки Node не існують на сторінці. Назви із середньої рамки працюють в обох, але кожне середовище реалізує їх по-своєму: fetch у Node не обмежений правилами same-origin, бо навколо нього немає сторінки."
      en: "Three frames. At the top is the browser: document, window and localStorage. In the middle is what both hosts have: setTimeout, fetch, URL, plus the language itself (Promise, JSON, arrays), run by the JavaScript engine. At the bottom is Node.js: process, node:fs and node:http. A name from the browser frame does not exist in Node: typeof gives undefined, and reading document.title throws a ReferenceError. Names from the Node frame do not exist on a page. Names in the middle frame work in both, but each host implements them its own way: fetch in Node is not limited by same-origin rules, because there is no page around it."
    spec:
      layout: grid
      groups:
        - { id: browser, label: { uk: "Лише браузер", en: "Browser only" } }
        - { id: both, label: { uk: "Обидва", en: "Both" } }
        - { id: node, label: { uk: "Лише Node.js", en: "Node.js only" } }
      nodes:
        - { id: page, group: browser, label: "document · window", w: 136, col: 0, row: 0 }
        - { id: storage, group: browser, label: "localStorage", col: 1, row: 0 }
        - { id: timers, group: both, label: "setTimeout", col: 0, row: 1 }
        - { id: fetch, group: both, label: "fetch · URL", col: 1, row: 1 }
        - { id: language, group: both, label: "Promise · JSON", shape: round, col: 0, row: 2 }
        - { id: modules, group: node, label: "node:fs · node:http", w: 144, col: 0, row: 3 }
        - { id: process, group: node, label: "process", col: 1, row: 3 }
      steps:
        - caption:
            uk: "Три рамки: що є лише на сторінці, що є в обох середовищах і що є лише в Node.js."
            en: "Three frames: what exists only on a page, what exists in both hosts and what exists only in Node.js."
        - caption:
            uk: "`document`, `window` і `localStorage` дає сторінка. У Node `typeof document` — `\"undefined\"`, а `document.title` кидає `ReferenceError`."
            en: "`document`, `window` and `localStorage` come from the page. In Node `typeof document` is `\"undefined\"`, and `document.title` throws a `ReferenceError`."
          highlight: [page, storage]
          dim: [timers, fetch, language, process, modules]
        - caption:
            uk: "`process` і вбудовані модулі `node:fs`, `node:http` дає Node.js. На сторінці їх немає: браузер не пускає код до файлів і не дає відкрити сервер."
            en: "`process` and the built-in modules `node:fs` and `node:http` come from Node.js. A page has none of them: the browser does not let code reach files or open a server."
          highlight: [process, modules]
          dim: [page, storage, timers, fetch, language]
        - caption:
            uk: "`setTimeout`, `fetch` і `URL` є в обох, але кожне середовище робить їх по-своєму: `fetch` у Node не обмежений правилами same-origin, бо навколо нього немає сторінки."
            en: "`setTimeout`, `fetch` and `URL` exist in both, but each host builds them its own way: `fetch` in Node is not limited by same-origin rules, because there is no page around it."
          highlight: [timers, fetch]
          dim: [page, storage, language, process, modules]
        - caption:
            uk: "Сама мова — `Promise`, `JSON`, масиви — однакова скрізь: її виконує рушій JavaScript, а не середовище."
            en: "The language itself — `Promise`, `JSON`, arrays — is the same everywhere: the JavaScript engine runs it, not the host."
          highlight: [language]
          dim: [page, storage, timers, fetch, process, modules]

  - id: no-sandbox
    kind: explanation
    title:
      uk: "Без сторінки — і без пісочниці сторінки"
      en: "No page — and no page sandbox"
    body:
      uk: |
        Код сторінки браузер тримає в суворих межах: він не бачить файлів на диску, а `fetch` до іншого сайту підкоряється правилам [[same-origin-policy|same-origin]]. Так браузер захищає тебе від сайтів, які ти відкриваєш.

        Node-програма — звичайна програма на твоєму комп’ютері. Команда `node file.js` у терміналі запускає її **з правами твого користувача**: вона може читати й видаляти твої файли, відкривати з’єднання з будь-якою адресою, читати змінні оточення. Жодної сторінки, жодного same-origin.

        > [!warning]
        > На цій платформі Node-програма бачить лише теку вправи, а мережу — лише на твоєму комп’ютері. Це обмеження **платформи** (дозволи, з якими вона запускає Node), а не самого Node. У терміналі таких меж немає, тому запускай лише код, якому довіряєш.
      en: |
        The browser keeps a page’s code within strict limits: it cannot see files on the disk, and a `fetch` to another site obeys the [[same-origin-policy|same-origin]] rules. That is how the browser protects you from the sites you open.

        A Node program is an ordinary program on your computer. The command `node file.js` in a terminal starts it **with your user’s permissions**: it can read and delete your files, open connections to any address, read environment variables. No page, no same-origin.

        > [!warning]
        > On this platform a Node program sees only the exercise folder, and the network only on your computer. That limit comes from the **platform** (the permissions it starts Node with), not from Node itself. A terminal has no such limits, so only run code you trust.

  - id: predict-permissions
    kind: prediction
    prompt:
      uk: "Ти скачав із форуму файл `cleanup.js` і запускаєш у своєму терміналі `node cleanup.js`. До яких файлів він може дістатися?"
      en: "You downloaded `cleanup.js` from a forum and run `node cleanup.js` in your own terminal. Which files can it reach?"
    answer:
      type: choice
      options:
        - id: user-files
          text:
            uk: "До всіх, які може читати й змінювати твій обліковий запис"
            en: "All the files your user account can read and change"
        - id: page-sandbox
          text:
            uk: "До жодних: Node, як сторінка, ізольований від диска"
            en: "None: like a page, Node is isolated from the disk"
          why:
            uk: "Ізоляція від диска — властивість сторінки в браузері. Node — звичайна програма, і читання файлів — одна з головних її задач."
            en: "Isolation from the disk is a property of a page in a browser. Node is an ordinary program, and reading files is one of its main jobs."
        - id: own-folder
          text:
            uk: "Лише до теки, у якій лежить `cleanup.js`"
            en: "Only the folder where `cleanup.js` lies"
          why:
            uk: "Так поводиться платформа курсу, бо сама запускає Node з обмеженими дозволами. Команда `node` у терміналі таких обмежень не додає."
            en: "That is how the course platform behaves, because it starts Node with limited permissions itself. The `node` command in a terminal adds no such limits."
      correct: [user-files]
    explanation:
      uk: "Node-програма в терміналі має права користувача, який її запустив. Саме тому вона може бути сервером, інструментом збірки чи скриптом резервного копіювання — і саме тому чужий код у Node треба читати, перш ніж запускати."
      en: "A Node program in a terminal has the permissions of the user who started it. That is exactly why it can be a server, a build tool or a backup script — and exactly why code from strangers must be read before you run it in Node."

  - id: recall-storage
    kind: review
    title:
      uk: "Пригадай: сховище браузера"
      en: "Recall: browser storage"
    items:
      - id: storage-belongs-to
        from: js-07-05-persist-reload
        prompt:
          uk: "Список бажань зберіг записи в `localStorage`, відкритий за адресою `http://127.0.0.1:4310`. Той самий застосунок у тому самому браузері відкривають за адресою `http://localhost:4310`. Що він знайде у своєму сховищі?"
          en: "The wishlist saved its records in `localStorage`, opened at `http://127.0.0.1:4310`. The same app in the same browser is opened at `http://localhost:4310`. What does it find in its storage?"
        answer:
          type: choice
          options:
            - id: empty
              text:
                uk: "Порожнє сховище: дані належать адресі сторінки в цьому браузері"
                en: "An empty storage: the data belongs to the page’s address in this browser"
            - id: same
              text:
                uk: "Ті самі записи: це той самий комп’ютер і той самий порт"
                en: "The same records: it is the same computer and the same port"
              why:
                uk: "Для браузера `127.0.0.1` і `localhost` — різні адреси, а `localStorage` прив’язаний саме до адреси сторінки."
                en: "To the browser `127.0.0.1` and `localhost` are different addresses, and `localStorage` is tied to the page’s exact address."
            - id: file
              text:
                uk: "Ті самі записи, бо `localStorage` — файл у теці проєкту"
                en: "The same records, because `localStorage` is a file in the project folder"
              why:
                uk: "`localStorage` живе всередині браузера, а не в теці проєкту. Сторінка взагалі не має доступу до файлів проєкту на диску."
                en: "`localStorage` lives inside the browser, not in the project folder. A page has no access to the project’s files on the disk at all."
          correct: [empty]
        explanation:
          uk: "Сховище сторінки належить її адресі в конкретному браузері. Node такого сховища не має: дані між запусками він зберігає у файлах (або в базі даних), і про це — наступні розділи."
          en: "A page’s storage belongs to its address in a particular browser. Node has no such storage: between runs it keeps data in files (or in a database), which the next units cover."

  - id: which-host
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: which-host
    entry: index.js
    editable: [host.js]
    strings:
      realLabel: { uk: "Справжнє середовище", en: "The real host" }
      pageLabel: { uk: "Об’єкт, схожий на сторінку", en: "A page-like object" }
      olderNodeLabel: { uk: "Об’єкт, схожий на Node.js 20", en: "A Node.js 20-like object" }
      emptyLabel: { uk: "Порожній об’єкт", en: "An empty object" }
    title:
      uk: "Визнач середовище за його API"
      en: "Tell the host by its APIs"
    instructions:
      uk: |
        Бібліотека, що працює і в браузері, і в Node, часто мусить дізнатися, де вона. Допиши `detectHost(host)` у `host.js`. Параметр `host` — глобальний об’єкт для перевірки: за замовчуванням справжній `globalThis`, а в перевірках — об’єкти, зроблені вручну.

        - Поверни `'node'`, якщо в `host` є об’єкт `process` із текстовим полем `versions.node`.
        - Поверни `'browser'`, якщо в `host` є і `window`, і `document`.
        - В усіх інших випадках поверни `'unknown'`.

        Не покладайся на текст `navigator.userAgent`: у Node.js 20 `navigator` немає взагалі, а web worker у браузері каже «Mozilla», хоча сторінки (`window`, `document`) не має.
      en: |
        A library that works both in the browser and in Node often has to find out where it is. Finish `detectHost(host)` in `host.js`. The parameter `host` is the global object to inspect: the real `globalThis` by default, and hand-made objects in the checks.

        - Return `'node'` when `host` has a `process` object with a text field `versions.node`.
        - Return `'browser'` when `host` has both `window` and `document`.
        - In every other case return `'unknown'`.

        Do not rely on the text of `navigator.userAgent`: Node.js 20 has no `navigator` at all, and a web worker in a browser says “Mozilla” even though it has no page (`window`, `document`).
    testTitles:
      "returns node for the real Node.js global":
        uk: "Для справжнього глобального об’єкта Node.js повертає `'node'`"
        en: "Returns `'node'` for the real Node.js global"
      "returns node for a Node.js version without navigator":
        uk: "Повертає `'node'` для Node.js 20, де немає `navigator`"
        en: "Returns `'node'` for Node.js 20, which has no `navigator`"
      "returns browser for a page global":
        uk: "Повертає `'browser'`, коли є `window` і `document`"
        en: "Returns `'browser'` when there are `window` and `document`"
      "returns unknown when neither host is recognized":
        uk: "Повертає `'unknown'` для web worker і для порожнього об’єкта"
        en: "Returns `'unknown'` for a web worker and for an empty object"
    hints:
      nudge:
        uk: "Шукай те, що є лише в одного середовища: який об’єкт є в Node і відсутній на сторінці? Які два об’єкти є лише на сторінці?"
        en: "Look for what only one host has: which object does Node have that a page lacks? Which two objects exist only on a page?"
      explanation:
        uk: "Перевіряй наявність властивостей, а не текст. Ланцюжок `settings?.theme?.dark` повертає `undefined`, якщо будь-якої ланки немає, і не кидає помилку — так само можна пройти вглиб `host` до версії Node. Умова з `&&` справджується, лише коли є обидві частини."
        en: "Check for properties, not for text. The chain `settings?.theme?.dark` returns `undefined` when any link is missing and does not throw — you can walk into `host` down to the Node version the same way. A condition with `&&` holds only when both parts are there."
    solutionNote:
      uk: "Рішення перевіряє, **що середовище дає**: версію Node у `process.versions.node` або пару `window` + `document`. Такий підхід називають feature detection. Текст `userAgent` будь-хто може змінити, а в старіших версіях Node його немає взагалі."
      en: "The solution checks **what the host provides**: a Node version in `process.versions.node`, or the pair `window` + `document`. This is called feature detection. Anyone can change the `userAgent` text, and older Node versions do not have it at all."
    feedback:
      - when: { test: "returns node for a Node.js version without navigator" }
        message:
          uk: "Ця перевірка дає об’єкт `{ process: { versions: { node: '20.11.1' } } }` — без `navigator` — і чекає `'node'`. Рішення має спиратися на `process.versions.node`, а не на `userAgent`."
          en: "This check passes the object `{ process: { versions: { node: '20.11.1' } } }` — with no `navigator` — and expects `'node'`. The decision must rest on `process.versions.node`, not on `userAgent`."
      - when: { test: "returns unknown when neither host is recognized" }
        message:
          uk: "Ця перевірка дає об’єкт web worker (лише `navigator` з «Mozilla») і порожній `{}` та чекає `'unknown'` для обох. Відсутність `window` ще не означає Node, а «Mozilla» в `userAgent` ще не означає сторінку."
          en: "This check passes a web worker object (only a `navigator` saying “Mozilla”) and an empty `{}` and expects `'unknown'` for both. A missing `window` does not mean Node yet, and “Mozilla” in `userAgent` does not mean a page."
      - when: { test: "returns browser for a page global" }
        message:
          uk: "Ця перевірка дає об’єкт із `window`, `document` і `navigator` та чекає `'browser'`."
          en: "This check passes an object with `window`, `document` and `navigator` and expects `'browser'`."
      - when: { error: TypeError }
        message:
          uk: "Схоже, код читає властивість у того, чого немає (наприклад, `host.process.versions`, коли `process` відсутній). Використовуй `?.`, щоб ланцюжок зупинявся на відсутній ланці."
          en: "It looks like the code reads a property of something missing (for example `host.process.versions` when there is no `process`). Use `?.` so the chain stops at a missing link."

  - id: to-project
    kind: transfer
    capstoneStep: NO-01
    body:
      uk: "За планом кроку проєкту цього розділу твій проєкт отримає першу частину, яку виконує Node.js, а не браузер: скрипт, що читає фікстури твого домену й друкує підсумок у терміналі. Доменні функції, які ти писав для браузера, там працюватимуть без змін — вони користуються лише мовою, а не `document`."
      en: "As this unit’s project step is planned, your project gets its first part that Node.js runs instead of the browser: a script that reads your domain’s fixtures and prints a summary in the terminal. The domain functions you wrote for the browser will work there unchanged — they use only the language, not `document`."
