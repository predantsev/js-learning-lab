id: no-01-03-modules-resolution
unit: NO-01
title:
  uk: "Модулі: ESM, CJS і пошук пакетів"
  en: "Modules: ESM, CJS and package resolution"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачити, чи завантажиться файл як ES-модуль чи як CommonJS, за його розширенням і полем `type` найближчого `package.json`."
    en: "Predict whether a file loads as ESM or CommonJS from its extension and the nearest `package.json` `type` field."
  - uk: "Простежити, як голий specifier знаходить пакет через `node_modules` і карту `exports`, і пояснити, чому відносному імпорту в ESM потрібне розширення файлу."
    en: "Trace how a bare specifier resolves through `node_modules` and a package’s `exports` map, and why a relative ESM import needs its file extension."
  - uk: "Імпортувати модуль CommonJS з ES-модуля й пояснити, чому імпорт за замовчуванням працює завжди, а іменовані — не завжди."
    en: "Import a CommonJS module from ESM and explain why the default import always works while named imports may not."
prerequisites: [no-01-02-scripts-process-env, js-07-06-esm-import-export]
subskills:
  - { family: B-01, skill: "ESM/CJS/package resolution", depth: intro }
glossary: [package-type-field, bare-specifier, exports-map]
selfCheck: [predict-loaders, three-imports]

blocks:
  - id: two-systems
    kind: explanation
    title:
      uk: "Дві системи модулів — і правило для кожного файлу"
      en: "Two module systems — and a rule for every file"
    body:
      uk: |
        Ти вже знаєш ES-модулі (`import`/`export`) і вмієш читати [[commonjs|CommonJS]] (`require`/`module.exports`). У браузері є лише перші. Node виконує **обидві** системи, тож для кожного файлу він спершу вирішує, яким завантажувачем його обробити:

        | Файл | Завантажувач |
        |---|---|
        | `*.mjs` | завжди ES-модуль |
        | `*.cjs` | завжди CommonJS |
        | `*.js` | за [[package-type-field\|полем `type`]] найближчого `package.json`: `"module"` — ES-модуль, `"commonjs"` — CommonJS |

        «Найближчий» — той, що лежить у теці файлу або в найближчій теці вище. Тому `import` і `require` — не два написання одного й того самого: у файлі, який Node завантажує як CommonJS, `import` — синтаксична помилка, а в ES-модулі немає `require`.

        > [!tip]
        > Якщо `type` не вказано, Node.js 22 (від 22.7) і новіші пробують угадати систему за синтаксисом. Коли `package.json` є, але без `type`, а файл виявляється ES-модулем, Node при цьому друкує попередження `MODULE_TYPELESS_PACKAGE_JSON` (так було на Node.js 25.2.1). Не покладайся на здогадку: пиши `"type": "module"` явно.
      en: |
        You already know ES modules (`import`/`export`) and can read [[commonjs|CommonJS]] (`require`/`module.exports`). The browser has only the former. Node runs **both** systems, so for every file it first decides which loader handles it:

        | File | Loader |
        |---|---|
        | `*.mjs` | always an ES module |
        | `*.cjs` | always CommonJS |
        | `*.js` | by the [[package-type-field\|`type` field]] of the nearest `package.json`: `"module"` means ES module, `"commonjs"` means CommonJS |

        “Nearest” means the one in the file’s folder or in the closest folder above it. That is why `import` and `require` are not two spellings of the same thing: in a file Node loads as CommonJS, `import` is a syntax error, and an ES module has no `require`.

        > [!tip]
        > When `type` is missing, Node.js 22 (from 22.7) and newer try to guess the system from the syntax. When there is a `package.json` without `type` and the file turns out to be an ES module, Node prints the warning `MODULE_TYPELESS_PACKAGE_JSON` while doing it (as Node.js 25.2.1 did). Do not rely on the guess: write `"type": "module"` explicitly.

  - id: predict-loaders
    kind: prediction
    prompt:
      uk: "У теці лежать `package.json` з `\"type\": \"module\"` і файли `a.js`, `b.cjs`, `c.mjs`, `helpers.js`. Який завантажувач обробить кожен із трьох перших файлів і чи спрацює в `a.js` рядок коду `import { x } from './helpers';`?"
      en: "A folder holds a `package.json` with `\"type\": \"module\"` and the files `a.js`, `b.cjs`, `c.mjs`, `helpers.js`. Which loader handles each of the first three files, and does the line of code `import { x } from './helpers';` in `a.js` work?"
    answer:
      type: choice
      options:
        - id: by-extension
          text:
            uk: "`a.js` — ES-модуль, `b.cjs` — CommonJS, `c.mjs` — ES-модуль; імпорт `./helpers` не знайде файл"
            en: "`a.js` — ES module, `b.cjs` — CommonJS, `c.mjs` — ES module; the import of `./helpers` finds no file"
        - id: all-esm
          text:
            uk: "Усі три — ES-модулі, бо `type` діє на всю теку; імпорт `./helpers` спрацює"
            en: "All three are ES modules, because `type` applies to the whole folder; the import of `./helpers` works"
          why:
            uk: "`type` вирішує лише для файлів `.js`. Розширення `.cjs` і `.mjs` сильніші за нього: вони завжди означають CommonJS і ES-модуль."
            en: "`type` decides only for `.js` files. The extensions `.cjs` and `.mjs` override it: they always mean CommonJS and ES module."
        - id: guesses-extension
          text:
            uk: "`a.js` — ES-модуль, `b.cjs` — CommonJS, `c.mjs` — ES-модуль; імпорт `./helpers` спрацює, бо Node допише `.js`"
            en: "`a.js` — ES module, `b.cjs` — CommonJS, `c.mjs` — ES module; the import of `./helpers` works, because Node adds `.js`"
          why:
            uk: "Дописувати розширення вміють бандлери й `require` у CommonJS. ES-модуль у Node шукає файл, що називається **точно** `helpers`, — і падає з `ERR_MODULE_NOT_FOUND`."
            en: "Bundlers and CommonJS `require` add the extension. An ES module in Node looks for a file named **exactly** `helpers` — and fails with `ERR_MODULE_NOT_FOUND`."
        - id: js-is-cjs
          text:
            uk: "`a.js` — CommonJS, бо `.js` у Node завжди CommonJS; `b.cjs` — CommonJS, `c.mjs` — ES-модуль"
            en: "`a.js` — CommonJS, because `.js` in Node is always CommonJS; `b.cjs` — CommonJS, `c.mjs` — ES module"
          why:
            uk: "Для `.js` вирішує поле `type` найближчого `package.json`. Тут воно `\"module\"`, тож `a.js` — ES-модуль."
            en: "For `.js` the `type` field of the nearest `package.json` decides. Here it is `\"module\"`, so `a.js` is an ES module."
      correct: [by-extension]
    explanation:
      uk: "Розширення `.mjs`/`.cjs` вирішують самі, а `.js` слухає `type`. Відносний specifier в ES-модулі мусить називати файл точно, з розширенням. Справжній Node.js завантажує таку теку саме так (перевірено під час підготовки уроку)."
      en: "The `.mjs`/`.cjs` extensions decide on their own, while `.js` follows `type`. A relative specifier in an ES module must name the file exactly, extension included. Real Node.js loads such a folder exactly this way (checked while this lesson was prepared)."

  - id: three-loaders
    kind: example
    runtime: isolated-node
    dir: three-loaders
    entry: index.js
    strings:
      streakLabel: { uk: "Серія «Ранкова зарядка» станом на 2026-03-01", en: "“Morning exercise” streak as of 2026-03-01" }
    title:
      uk: "Три файли — три завантажувачі"
      en: "Three files — three loaders"
    body:
      uk: |
        Кожен файл перевіряє, чи є в ньому об’єкт `module` (його має лише CommonJS), і повідомляє, хто його завантажив. Відкрий `package.json`: там `"type": "module"` і карта `exports` — до неї повернемося за хвилину.

        Натисни **Запустити** й порівняй три рядки з тим, що ти передбачив.
      en: |
        Each file checks whether it has a `module` object (only CommonJS has one) and reports who loaded it. Open `package.json`: it has `"type": "module"` and an `exports` map — we will come back to that in a moment.

        Press **Run** and compare the three lines with your prediction.
    tryIt:
      uk: |
        1. У `index.js` заміни `'./a.js'` на `'./a'` і запусти. Node зупиниться з `ERR_MODULE_NOT_FOUND` і в кінці повідомлення підкаже `Did you mean to import "./a.js"?`. Поверни розширення.
        2. У `package.json` заміни `"module"` на `"commonjs"` і запусти. Тепер і `index.js` — CommonJS, тож уже перший `import` дає `SyntaxError: Cannot use import statement outside a module`. Поверни `"module"`.
      en: |
        1. In `index.js` replace `'./a.js'` with `'./a'` and run. Node stops with `ERR_MODULE_NOT_FOUND` and at the end of the message suggests `Did you mean to import "./a.js"?`. Put the extension back.
        2. In `package.json` replace `"module"` with `"commonjs"` and run. Now `index.js` is CommonJS too, so the very first `import` gives `SyntaxError: Cannot use import statement outside a module`. Put `"module"` back.

  - id: specifiers
    kind: explanation
    title:
      uk: "Звідки Node бере файл: три види specifier"
      en: "Where Node gets the file: three kinds of specifier"
    body:
      uk: |
        Текст після `from` — [[module-specifier|specifier]]. Node розрізняє три види:

        - **Відносний** — `./a.js`, `../domain/habits.js`: файл відносно теки того модуля, що імпортує. В ES-модулі — точна назва з розширенням, без здогадок.
        - **Вбудований** — `node:fs`, `node:path`: модуль усередині самого Node, диск не потрібен.
        - **Голий** ([[bare-specifier|bare specifier]]) — `habit-kit/streak`: назва пакета й, можливо, шлях усередині нього. Node шукає теку `node_modules/habit-kit` поруч із модулем, потім у батьківській теці, потім ще вище — аж до кореня диска. (Пакет може звернутися й сам до себе за власною назвою — так робить наш приклад, бо в теці вправи немає `node_modules`.)

        Знайшовши пакет, Node читає його `package.json`. Поле [[exports-map|`exports`]] — це перелік дверей у пакет: імпортувати можна лише перелічені шляхи. У прикладі є лише `./streak`, тож `habit-kit/streak` веде до `src/streak.js`, а `habit-kit/src/streak.js` падає з `ERR_PACKAGE_PATH_NOT_EXPORTED`, хоча файл існує. Коли пакет не має `exports`, Node бере його поле `main` (або `index.js`).
      en: |
        The text after `from` is the [[module-specifier|specifier]]. Node tells three kinds apart:

        - **Relative** — `./a.js`, `../domain/habits.js`: a file relative to the folder of the importing module. In an ES module it is the exact name with its extension, no guessing.
        - **Built-in** — `node:fs`, `node:path`: a module inside Node itself, no disk needed.
        - **Bare** ([[bare-specifier]]) — `habit-kit/streak`: a package name and maybe a path inside it. Node looks for the folder `node_modules/habit-kit` next to the module, then in the parent folder, then higher — up to the root of the disk. (A package can also refer to itself by its own name — our example does that, because the exercise folder has no `node_modules`.)

        Once it finds the package, Node reads its `package.json`. The [[exports-map|`exports`]] field is the list of doors into the package: only the listed paths can be imported. The example lists only `./streak`, so `habit-kit/streak` leads to `src/streak.js`, while `habit-kit/src/streak.js` fails with `ERR_PACKAGE_PATH_NOT_EXPORTED`, even though the file exists. When a package has no `exports`, Node takes its `main` field (or `index.js`).

  - id: resolution-walk
    kind: visual
    visual: diagram
    title:
      uk: "Шлях одного імпорту"
      en: "The walk of one import"
    textEquivalent:
      uk: "Імпорт починається зі specifier, і Node спершу визначає його вид. Вбудований specifier, як node:fs, веде до модуля всередині самого Node. Відносний, як ./a.js, веде до файлу поруч із модулем, що імпортує, — точно з такою назвою. Голий, як habit-kit/streak, змушує Node шукати теку node_modules/habit-kit, піднімаючись від теки модуля до кореня диска; у знайденому пакеті поле exports перелічує дозволені шляхи й називає файл, тут src/streak.js. Коли файл знайдено, Node обирає завантажувач: .mjs — ES-модуль, .cjs — CommonJS, .js — за полем type найближчого package.json."
      en: "An import starts with a specifier, and Node first works out its kind. A built-in specifier such as node:fs leads to a module inside Node itself. A relative one such as ./a.js leads to the file next to the importing module, with exactly that name. A bare one such as habit-kit/streak makes Node look for the folder node_modules/habit-kit, climbing from the module’s folder up to the root of the disk; in the package it finds, the exports field lists the allowed paths and names the file, here src/streak.js. Once the file is found, Node picks the loader: .mjs means ES module, .cjs CommonJS, .js follows the type field of the nearest package.json."
    spec:
      layout: grid
      nodes:
        - { id: spec, label: "from '…'", shape: round, w: 150, col: 0, row: 0 }
        - { id: builtin, label: "node:fs", shape: pill, w: 150, col: 1, row: 0 }
        - { id: relative, label: "./a.js", w: 150, col: 0, row: 1 }
        - { id: bare, label: "habit-kit/streak", w: 150, col: 1, row: 1 }
        - { id: file, label: { uk: "файл поруч", en: "file next to it" }, shape: note, w: 150, col: 0, row: 2 }
        - { id: modules, label: "node_modules/…", shape: cylinder, w: 150, col: 1, row: 2 }
        - { id: loader, label: { uk: "завантажувач", en: "loader" }, shape: round, w: 150, col: 0, row: 3 }
        - { id: exports, label: "exports → src/…", shape: note, w: 150, col: 1, row: 3 }
      edges:
        - { id: to-builtin, from: spec, to: builtin }
        - { id: to-relative, from: spec, to: relative }
        - { id: to-bare, from: spec, to: bare }
        - { id: relative-file, from: relative, to: file }
        - { id: bare-modules, from: bare, to: modules, label: { uk: "вгору", en: "climb" } }
        - { id: modules-exports, from: modules, to: exports }
        - { id: file-loader, from: file, to: loader }
        - { id: exports-loader, from: exports, to: loader }
      steps:
        - caption:
            uk: "Кожен імпорт починається зі specifier — тексту після `from`. Спершу Node визначає його вид."
            en: "Every import starts with a specifier — the text after `from`. First Node works out its kind."
          highlight: [spec]
          dim: [builtin, relative, bare, file, modules, loader, exports]
        - caption:
            uk: "`node:fs` — вбудований модуль. Його Node має всередині себе, на диск не ходить."
            en: "`node:fs` is a built-in module. Node has it inside itself and does not go to the disk."
          highlight: [builtin, to-builtin]
          dim: [relative, bare, file, modules, loader, exports]
        - caption:
            uk: "`./a.js` — відносний: файл у теці модуля, що імпортує, **з точно такою назвою**. `./a` шукав би файл `a` без розширення й упав би з `ERR_MODULE_NOT_FOUND`."
            en: "`./a.js` is relative: a file in the importing module’s folder **with exactly that name**. `./a` would look for a file `a` without an extension and fail with `ERR_MODULE_NOT_FOUND`."
          highlight: [relative, to-relative, file, relative-file]
          dim: [builtin, bare, modules, exports]
        - caption:
            uk: "`habit-kit/streak` — голий: Node шукає `node_modules/habit-kit` у теці модуля, потім у кожній теці вище, аж до кореня диска."
            en: "`habit-kit/streak` is bare: Node looks for `node_modules/habit-kit` in the module’s folder, then in every folder above it, up to the root of the disk."
          highlight: [bare, to-bare, modules, bare-modules]
          dim: [builtin, relative, file]
        - caption:
            uk: "У знайденому пакеті `exports` перелічує дозволені шляхи: `./streak` веде до `src/streak.js`. Шлях, якого там немає, дає `ERR_PACKAGE_PATH_NOT_EXPORTED`."
            en: "In the package found, `exports` lists the allowed paths: `./streak` leads to `src/streak.js`. A path not listed there gives `ERR_PACKAGE_PATH_NOT_EXPORTED`."
          highlight: [exports, modules-exports]
          dim: [builtin, relative, file]
        - caption:
            uk: "Файл знайдено — тепер завантажувач: `.mjs` — ES-модуль, `.cjs` — CommonJS, `.js` — за `type` найближчого `package.json`."
            en: "The file is found — now the loader: `.mjs` means ES module, `.cjs` CommonJS, `.js` follows `type` of the nearest `package.json`."
          highlight: [loader, file-loader, exports-loader]
          dim: [spec, builtin]

  - id: cjs-from-esm
    kind: explanation
    title:
      uk: "CommonJS з ES-модуля: імпорт за замовчуванням працює завжди"
      en: "CommonJS from an ES module: the default import always works"
    body:
      uk: |
        ES-модуль може імпортувати файл CommonJS через `import`. Тоді:

        - **імпорт за замовчуванням** (`import loader from './loader.cjs'`) — це весь об’єкт `module.exports`. Він працює **завжди**;
        - **іменований імпорт** (`import { load } from './loader.cjs'`) працює, лише якщо Node може побачити назви експортів, **ще не виконуючи** файл: коли там написано `exports.load = …` або `module.exports = { load, count }`.

        Якщо ж об’єкт експортів складається поступово й присвоюється наприкінці (`module.exports = api`), Node назв наперед не бачить. Тоді іменований імпорт падає ще до запуску з `SyntaxError`. Під час підготовки уроку Node.js 25.2.1 формулював її двома способами:

        - коли такий імпорт стоїть у файлі, який ти запускаєш: `Named export 'load' not found. The requested module './loader.cjs' is a CommonJS module, which may not support all module.exports as named exports.`;
        - коли він стоїть у модулі, який імпортує інший модуль: `The requested module './loader.cjs' does not provide an export named 'load'`.

        Node.js 22, судячи з його вихідного коду, має в обох випадках друкувати першу форму (на Node.js 22 це не перевіряли). Вихід один: імпорт за замовчуванням, а потім деструктуризація.
      en: |
        An ES module can import a CommonJS file with `import`. Then:

        - the **default import** (`import loader from './loader.cjs'`) is the whole `module.exports` object. It works **always**;
        - a **named import** (`import { load } from './loader.cjs'`) works only if Node can see the export names **without running** the file: when it says `exports.load = …` or `module.exports = { load, count }`.

        If the exports object is built up step by step and assigned at the end (`module.exports = api`), Node cannot see the names in advance. Then the named import fails before anything runs, with a `SyntaxError`. While this lesson was prepared, Node.js 25.2.1 phrased it in two ways:

        - when such an import sits in the file you start: `Named export 'load' not found. The requested module './loader.cjs' is a CommonJS module, which may not support all module.exports as named exports.`;
        - when it sits in a module that another module imports: `The requested module './loader.cjs' does not provide an export named 'load'`.

        Node.js 22, judging by its source code, should print the first form in both cases (this was not checked on Node.js 22). The way out is the same: a default import, then destructuring.

  - id: recall-cjs
    kind: review
    title:
      uk: "Пригадай: читаємо CommonJS"
      en: "Recall: reading CommonJS"
    items:
      - id: cjs-to-export
        from: js-07-08-cjs-and-load-failures
        prompt:
          uk: "Файл CommonJS закінчується рядком коду `module.exports = { total, format };`. Який рядок робить те саме в ES-модулі?"
          en: "A CommonJS file ends with the line of code `module.exports = { total, format };`. Which line does the same in an ES module?"
        answer:
          type: choice
          options:
            - id: named
              code: "export { total, format };"
            - id: default-object
              code: "export default { total, format };"
              why:
                uk: "Так вийде один експорт за замовчуванням з об’єктом. Інші модулі тоді не зможуть написати `import { total }` — лише взяти весь об’єкт."
                en: "That gives one default export holding an object. Other modules then cannot write `import { total }` — only take the whole object."
            - id: exports-keyword
              code: "exports = { total, format };"
              why:
                uk: "В ES-модулі немає змінної `exports`. Експорт там — ключове слово `export`."
                en: "An ES module has no `exports` variable. Exporting there is done with the keyword `export`."
          correct: [named]
        explanation:
          uk: "`module.exports = { total, format }` дає два іменовані значення, і `export { total, format };` — їхній відповідник в ES-модулі. А в Node такий літерал — якраз той випадок, коли іменований `import` з CommonJS теж спрацює."
          en: "`module.exports = { total, format }` provides two named values, and `export { total, format };` is their ES-module counterpart. In Node such a literal is exactly the case where a named `import` from CommonJS works too."
      - id: env-text
        from: no-01-02-scripts-process-env
        prompt:
          uk: "Скрипт запущено як `LIMIT=5 node report.mjs`. Що дасть `process.env.LIMIT + 1`?"
          en: "A script is started as `LIMIT=5 node report.mjs`. What does `process.env.LIMIT + 1` give?"
        answer:
          type: choice
          options:
            - id: text
              code: '"51"'
            - id: number
              code: "6"
              why:
                uk: "Змінні оточення — завжди текст. `\"5\" + 1` — склеювання текстів, а не додавання."
                en: "Environment variables are always text. `\"5\" + 1` joins texts, it does not add."
            - id: nan
              code: "NaN"
              why:
                uk: "`NaN` вийшов би з віднімання чи множення тексту, що не є числом. `+` з текстом склеює."
                en: "`NaN` would come from subtracting or multiplying non-numeric text. `+` with text joins."
          correct: [text]
        explanation:
          uk: "`\"5\" + 1` — `\"51\"`. Тому `loadConfig` перетворює числові змінні на числа один раз, на старті."
          en: "`\"5\" + 1` is `\"51\"`. That is why `loadConfig` converts numeric variables to numbers once, at the start."

  - id: three-imports
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: three-imports
    entry: index.js
    editable: [app.js]
    strings:
      morning: { uk: "Ранкова зарядка", en: "Morning exercise" }
      water: { uk: "Пити воду", en: "Drink water" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
    title:
      uk: "Три імпорти, які справді працюють"
      en: "Three imports that really work"
    instructions:
      uk: |
        У `app.js` готова функція `summarize()`, але бракує імпортів. Допиши їх на початку файлу:

        - `join` — з вбудованого модуля шляхів;
        - `countCompletions` і `isActive` — з доменного модуля `domain/habits.js`;
        - `loadFixtures` — зі старого файлу CommonJS `fixtures-loader.cjs` (його не змінюй: він лише для читання).

        Відкрий `fixtures-loader.cjs` і подивись, **як** він експортує — від цього залежить, яка форма імпорту спрацює. **Запустити** друкує підсумок трьох активних звичок.
      en: |
        `summarize()` in `app.js` is ready, but the imports are missing. Add them at the top of the file:

        - `join` — from the built-in path module;
        - `countCompletions` and `isActive` — from the domain module `domain/habits.js`;
        - `loadFixtures` — from the older CommonJS file `fixtures-loader.cjs` (do not change it: it is read-only).

        Open `fixtures-loader.cjs` and see **how** it exports — that decides which form of import works. **Run** prints the summary of the three active habits.
    testTitles:
      "prints one line per active habit with its completion count":
        uk: "`summarize()` повертає рядок для кожної активної звички з кількістю виконань"
        en: "`summarize()` returns a line for each active habit with its completion count"
    hints:
      nudge:
        uk: "Почни з повідомлення про помилку: воно називає код чи суть (`ERR_MODULE_NOT_FOUND`, `does not provide an export named`) і specifier, який не спрацював. Перевір кожен specifier за правилами уроку."
        en: "Start from the error message: it names a code or the gist (`ERR_MODULE_NOT_FOUND`, `does not provide an export named`) and the specifier that failed. Check each specifier against the rules of the lesson."
      explanation:
        uk: |
          Три правила, кожне — на іншому прикладі:

          - вбудований модуль пишуть із префіксом: `import { readFile } from 'node:fs/promises';`
          - відносний шлях в ES-модулі — з розширенням: `import { formatPrice } from './domain/money.js';`
          - з файлу CommonJS, що присвоює `module.exports = api` наприкінці, бери імпорт за замовчуванням і діставай функцію з об’єкта: `import legacy from './legacy.cjs';` а потім `const { parse } = legacy;`
        en: |
          Three rules, each on a different example:

          - a built-in module is written with its prefix: `import { readFile } from 'node:fs/promises';`
          - a relative path in an ES module has its extension: `import { formatPrice } from './domain/money.js';`
          - from a CommonJS file that assigns `module.exports = api` at the end, take the default import and get the function out of the object: `import legacy from './legacy.cjs';` and then `const { parse } = legacy;`
    solutionNote:
      uk: "`node:path` — вбудований модуль. `./domain/habits.js` — відносний шлях із розширенням. `fixtures-loader.cjs` складає експорти поступово й присвоює `module.exports = api`, тому Node не бачить назву `loadFixtures` наперед: працює імпорт за замовчуванням (весь `module.exports`) і деструктуризація. Так само підходить `createRequire` з `node:module`."
      en: "`node:path` is a built-in module. `./domain/habits.js` is a relative path with its extension. `fixtures-loader.cjs` builds its exports step by step and assigns `module.exports = api`, so Node cannot see the name `loadFixtures` in advance: the default import (the whole `module.exports`) plus destructuring works. `createRequire` from `node:module` works too."
    feedback:
      - when: { test: "prints one line per active habit with its completion count" }
        message:
          uk: "Ця перевірка викликає `summarize()` і чекає три рядки: «Ранкова зарядка: 3», «Пити воду: 1», «Прогулянка: 0». Якщо в консолі є `ReferenceError` про `join`, `loadFixtures`, `isActive` чи `countCompletions`, цієї назви бракує серед імпортів; `require` в ES-модулі немає."
          en: "This check calls `summarize()` and expects three lines: “Morning exercise: 3”, “Drink water: 1”, “Go for a walk: 0”. If the console shows a `ReferenceError` about `join`, `loadFixtures`, `isActive` or `countCompletions`, that name is missing from the imports; an ES module has no `require`."
      - when: { error: SyntaxError }
        message:
          uk: "Програма не змогла завантажитися. Якщо повідомлення каже, що `./fixtures-loader.cjs` `does not provide an export named …` (або `Named export … not found`), імпортуй цей файл за замовчуванням і діставай функцію з об’єкта. Інакше повідомлення називає файл і рядок, де помилка."
          en: "The program could not load. If the message says that `./fixtures-loader.cjs` `does not provide an export named …` (or `Named export … not found`), import that file by default and take the function out of the object. Otherwise the message names the file and line of the error."
      - when: { error: ReferenceError }
        message:
          uk: "Код звертається до назви, якої в модулі немає. Перевір, що кожна з `join`, `isActive`, `countCompletions`, `loadFixtures` імпортована на початку `app.js`, і що там немає `require` — в ES-модулі його не існує."
          en: "The code refers to a name the module does not have. Check that each of `join`, `isActive`, `countCompletions`, `loadFixtures` is imported at the top of `app.js`, and that there is no `require` there — it does not exist in an ES module."

  - id: to-project
    kind: transfer
    capstoneStep: NO-01
    body:
      uk: "За планом кроку проєкту тека `server/` матиме власний `package.json` із `\"type\": \"module\"`, а скрипт імпортуватиме спільний доменний код і фікстури за відносними шляхами з розширенням — так само, як ти щойно зробив."
      en: "As the project step is planned, the `server/` folder gets its own `package.json` with `\"type\": \"module\"`, and the script imports the shared domain code and fixtures by relative paths with their extensions — just as you did now."
