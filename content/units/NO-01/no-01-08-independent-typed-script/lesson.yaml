id: no-01-08-independent-typed-script
unit: NO-01
title:
  uk: "Самостійно: типізований локальний скрипт із перевіреною конфігурацією"
  en: "Independent: typed local script with validated config"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Перевірити без підказок, що ти вмієш зібрати ідеї розділу в одну Node-програму: перевірена конфігурація з аргументів і оточення, читання файлу через емітер, що прибирає за собою слухачів, осмислений код завершення — і пояснити, що із цього перевіряє `tsc`, а що лише виконання."
  en: "Check, without hints, that you can bring the unit’s ideas together in one Node program: validated config from arguments and the environment, reading a file through an emitter that cleans up its listeners, a meaningful exit code — and explain which of it `tsc` checks and which only the run does."
objectives:
  - uk: "Без підказок побудувати типізований Node-скрипт, що перевіряє конфігурацію з оточення й аргументів, читає синтетичний файл даних, повідомляє про хід роботи через емітер, який прибирає своїх слухачів, і завершується осмисленим кодом."
    en: "Build, without hints, a typed Node script that validates config from env and arguments, reads a synthetic data file, reports progress through an emitter that cleans up its listeners and exits with a meaningful code."
  - uk: "Пояснити, якими API скрипт користується, яких немає в браузері, передбачити порядок його відкладених колбеків і сказати, які вади спіймав `tsc`, а які — перевірка під час виконання."
    en: "Explain which APIs it uses that a browser lacks, predict the order of its deferred callbacks, and state which faults `tsc` caught versus which the runtime check caught."
  - uk: "Назвати, на які знання попередніх етапів спирається етап Node, і підтвердити, що пропущене native-завдання лишається записаним як невиконане, а не як виконане чи таке, що блокує."
    en: "State which supplied earlier-stage prerequisites the Node stage relies on, and confirm that a skipped native practical stays recorded as unperformed rather than passed or blocking."
prerequisites: [no-01-07-debug-module-listener]
subskills:
  - { family: B-01, skill: "process/env/config", depth: assess }
  - { family: B-01, skill: "Node vs browser APIs", depth: assess }
  - { family: B-01, skill: "async event loop phases awareness", depth: assess }
  - { family: B-01, skill: "TS build/runtime distinction", depth: assess }
glossary: []

blocks:
  - id: what-is-assessed
    kind: explanation
    title:
      uk: "Що тут перевіряється"
      en: "What is assessed here"
    body:
      uk: |
        Це самостійна робота розділу: підказок немає, а розв’язок відкривається лише після того, як усі перевірки пройдено. Вона має три частини:

        1. **Програма на платформі** — підсумок витрат у `summary.ts`: конфігурація, файл через емітер, код завершення.
        2. **Пояснення** — три питання про порядок колбеків, межу між `tsc` і виконанням та API, яких немає в браузері, а також два питання про те, на чому стоїть етап Node.
        3. **Той самий підхід у твоєму терміналі** — власний скрипт `summarize.ts`, який ти запустиш із хибним оточенням, без `LOCALE` і з відсутнім файлом.
      en: |
        This is the unit’s independent work: there are no hints, and the solution opens only after every check has passed. It has three parts:

        1. **A program on the platform** — an expense summary in `summary.ts`: config, a file through an emitter, an exit code.
        2. **Explanations** — three questions about callback order, the line between `tsc` and the run, and APIs a browser lacks, plus two questions about what the Node stage stands on.
        3. **The same approach in your terminal** — your own script `summarize.ts`, which you run with an invalid environment, without `LOCALE` and with a missing file.

  - id: expense-summary
    kind: exercise
    mode: independent
    assessment: true
    runtime: isolated-node
    dir: expense-summary
    entry: index.ts
    editable: [summary.ts]
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      lunch: { uk: "Обід", en: "Lunch" }
    title:
      uk: "Підсумок витрат"
      en: "An expense summary"
    instructions:
      uk: |
        Напиши в `summary.ts` функцію `summarize(argv, env, out)`, що повертає проміс із кодом завершення (`0` або `1`). `argv` — аргументи командного рядка, `env` — змінні оточення (текст або `undefined`), `out.log` і `out.error` — замість `console.log` і `console.error`. Інші файли лише для читання.

        **Конфігурація** — перевір її повністю **до** відкриття файлу:

        - `--limit N` в `argv`: ціле число від 1 до 10, без аргументу — 3;
        - `LOCALE`: `uk` або `en`, без змінної — `uk`;
        - `DATA_FILE`: шлях до файлу, без змінної — `expenses.json`.

        Хибне значення: рядок через `out.error` із цим значенням, код `1`, файл **не** відкривається, `out.log` не викликається.

        **Дані**: відкрий файл через `openExpenses(file)` з `expenses-source.js`. Він повертає `EventEmitter` з подіями `'record'` (одна витрата), `'end'` і `'error'`. Підсумуй `amountMinor` за кожною категорією й виведи через `out.log` найбільші категорії (не більше `limit`, від більшої до меншої) рядками `formatLine(category, amountMinor, locale)`, а потім `formatTotal(сума всіх витрат, locale)` з `money.js`. Код `0`.

        **Помилка файлу**: рядок через `out.error`, що містить шлях файлу, код `1`.

        **Слухачі**: і після `'end'`, і після `'error'` на джерелі не має лишитися твоїх слухачів `'record'`, `'end'` і `'error'`.
      en: |
        In `summary.ts` write the function `summarize(argv, env, out)` that returns a promise of the exit code (`0` or `1`). `argv` is the command-line arguments, `env` the environment variables (text or `undefined`), `out.log` and `out.error` stand in for `console.log` and `console.error`. The other files are read-only.

        **Config** — check it completely **before** opening the file:

        - `--limit N` in `argv`: a whole number from 1 to 10, 3 without the argument;
        - `LOCALE`: `uk` or `en`, `uk` without the variable;
        - `DATA_FILE`: the path to the file, `expenses.json` without the variable.

        An invalid value: a line via `out.error` containing that value, code `1`, the file is **not** opened, `out.log` is not called.

        **Data**: open the file with `openExpenses(file)` from `expenses-source.js`. It returns an `EventEmitter` with the events `'record'` (one expense), `'end'` and `'error'`. Sum `amountMinor` per category and print through `out.log` the largest categories (at most `limit`, largest first) as lines `formatLine(category, amountMinor, locale)`, then `formatTotal(sum of all expenses, locale)` from `money.js`. Code `0`.

        **A file error**: a line via `out.error` that contains the file’s path, code `1`.

        **Listeners**: after `'end'` and after `'error'` alike, none of your `'record'`, `'end'` and `'error'` listeners may remain on the source.
    testTitles:
      "prints the three largest categories and the total by default":
        uk: "Без `--limit` і `LOCALE` — три найбільші категорії, разом і код `0`"
        en: "Without `--limit` and `LOCALE` — the three largest categories, the total and code `0`"
      "follows --limit and LOCALE":
        uk: "Слухається `--limit 2` і `LOCALE=en`"
        en: "Follows `--limit 2` and `LOCALE=en`"
      "rejects an invalid --limit with exit code 1 before opening the file":
        uk: "Хибний `--limit` (`two`, `0`, `11`, `2.5`): код `1`, повідомлення зі значенням, файл не відкрито"
        en: "An invalid `--limit` (`two`, `0`, `11`, `2.5`): code `1`, a message with the value, the file not opened"
      "rejects an invalid LOCALE with exit code 1":
        uk: "`LOCALE=ua`: код `1`, повідомлення зі значенням, файл не відкрито"
        en: "`LOCALE=ua`: code `1`, a message with the value, the file not opened"
      "reports a missing data file with exit code 1":
        uk: "`DATA_FILE=missing.json`: код `1` і повідомлення з назвою файлу"
        en: "`DATA_FILE=missing.json`: code `1` and a message with the file name"
      "removes its listeners from the source after end and after error":
        uk: "Після `'end'` і після `'error'` твоїх слухачів на джерелі не лишилося"
        en: "After `'end'` and after `'error'` none of your listeners remain on the source"
    solutionNote:
      uk: "`loadConfig` перевіряє все до будь-якої роботи й повертає перелік помилок (fail fast). Читання загорнуто в проміс, що слухає `'record'`, `'end'` і `'error'` і в обох фіналах знімає саме ці три функції через `off`. Слухач `'error'` водночас рятує процес від падіння й перетворює збій файлу на код `1`. TypeScript описує форми (`Config`, `Env`), але `--limit two` чи відсутній файл ловить лише код, що працює під час виконання."
      en: "`loadConfig` checks everything before any work and returns a list of errors (fail fast). The reading is wrapped in a promise that listens to `'record'`, `'end'` and `'error'` and in both endings removes exactly those three functions with `off`. The `'error'` listener both saves the process from crashing and turns a file failure into code `1`. TypeScript describes the shapes (`Config`, `Env`), but `--limit two` or a missing file is caught only by code that runs."
    feedback:
      - when: { test: "rejects an invalid --limit with exit code 1 before opening the file" }
        message:
          uk: "Ця перевірка для `--limit` `two`, `0`, `11` і `2.5` чекає код `1`, рядок `out.error` зі значенням, жодного `out.log` і жодного відкритого файлу (`openExpenses` не викликано)."
          en: "For `--limit` `two`, `0`, `11` and `2.5` this check expects code `1`, an `out.error` line with the value, no `out.log` at all and no file opened (`openExpenses` not called)."
      - when: { test: "rejects an invalid LOCALE with exit code 1" }
        message:
          uk: "Ця перевірка для `LOCALE=ua` чекає код `1`, рядок `out.error` з `ua` і жодного відкритого файлу."
          en: "For `LOCALE=ua` this check expects code `1`, an `out.error` line containing `ua` and no file opened."
      - when: { test: "reports a missing data file with exit code 1" }
        message:
          uk: "Ця перевірка для `DATA_FILE=missing.json` чекає код `1`, рядок `out.error` з `missing.json` і жодного `out.log`. Якщо вона падає з необробленою помилкою, на джерелі немає слухача `'error'`."
          en: "For `DATA_FILE=missing.json` this check expects code `1`, an `out.error` line containing `missing.json` and no `out.log`. If it fails with an uncaught error, the source has no `'error'` listener."
      - when: { test: "removes its listeners from the source after end and after error" }
        message:
          uk: "Ця перевірка чекає 0 слухачів `'record'`, `'end'` і `'error'` на джерелі і після успішного запуску, і після відсутнього файлу."
          en: "This check expects 0 `'record'`, `'end'` and `'error'` listeners on the source both after a successful run and after a missing file."
      - when: { test: "prints the three largest categories and the total by default" }
        message:
          uk: "Ця перевірка без аргументів і змінних чекає чотири рядки `out.log` українською: Їжа, Транспорт, Розваги (від більшої суми), потім «Разом», і код `0`. Суми — цілі копійки за категорією."
          en: "With no arguments or variables this check expects four `out.log` lines in Ukrainian: Food, Transport, Fun (largest first), then the total, and code `0`. Sums are whole minor units per category."

  - id: predict-callback-order
    kind: prediction
    prompt:
      uk: "Скрипт читає файл через `readFile`, а в його колбеку виконує ці рядки. У якому порядку з’являться чотири рядки виводу?"
      en: "A script reads a file with `readFile` and runs these lines in its callback. In what order do the four output lines appear?"
    code: |
      readFile("expenses.json", "utf8", () => {
        setImmediate(() => console.log("immediate"));
        Promise.resolve().then(() => console.log("promise"));
        process.nextTick(() => console.log("tick"));
        console.log("callback");
      });
    runnable: false
    answer:
      type: order
      items:
        - { id: callback, code: "callback" }
        - { id: tick, code: "tick" }
        - { id: promise, code: "promise" }
        - { id: immediate, code: "immediate" }
    explanation:
      uk: "Спершу синхронний код колбека (`callback`). Коли колбек закінчився, Node спорожнює чергу `nextTick`, потім мікрозадачі промісів. Лише тоді цикл переходить із фази poll у check, де чекає `setImmediate`."
      en: "First the callback’s synchronous code (`callback`). When the callback has ended, Node empties the `nextTick` queue, then the promise microtasks. Only then does the loop move from the poll phase to check, where `setImmediate` waits."

  - id: predict-tsc-catches
    kind: prediction
    prompt:
      uk: "У проєкті з підсумком витрат є чотири вади. Які з них знайде `npx tsc --noEmit`? Обери всі."
      en: "The expense summary project has four faults. Which of them does `npx tsc --noEmit` find? Choose all."
    answer:
      type: multi
      options:
        - id: number-in-argv
          code: 'summarize(["--limit", 2], {}, out);'
        - id: config-literal
          code: 'const config: Config = { limit: "3", locale: "uk", dataFile: "expenses.json" };'
        - id: env-locale
          code: "LOCALE=ua node summary.ts"
          why:
            uk: "`tsc` ніколи не бачить оточення конкретного запуску. `ua` з’являється лише під час виконання — його ловить `loadConfig`."
            en: "`tsc` never sees the environment of a particular run. `ua` appears only at run time — `loadConfig` catches it."
        - id: missing-file
          code: "DATA_FILE=missing.json node summary.ts"
          why:
            uk: "Чи існує файл, з’ясовується лише під час виконання. Від цього захищає слухач `'error'`, а не типи."
            en: "Whether a file exists is found out only at run time. An `'error'` listener protects against that, not types."
      correct: [number-in-argv, config-literal]
    explanation:
      uk: "`tsc` бачить лише код: число в масиві `string[]` і текст `\"3\"` у полі `limit: number`. Значення з оточення й стан диска з’являються тільки під час виконання — їх перевіряє код, що виконується."
      en: "`tsc` sees only code: a number in a `string[]` array and the text `\"3\"` in the field `limit: number`. Values from the environment and the state of the disk appear only at run time — code that runs checks them."

  - id: predict-browser-lacks
    kind: prediction
    prompt:
      uk: "Яких із цих засобів, якими користується скрипт, немає в браузері? Обери всі."
      en: "Which of these tools the script uses does a browser lack? Choose all."
    answer:
      type: multi
      options:
        - id: fs
          code: 'import { readFile } from "node:fs";'
        - id: env
          code: "process.env.LOCALE"
        - id: immediate
          code: "setImmediate(callback)"
        - id: json
          code: "JSON.parse(text)"
          why:
            uk: "`JSON` — частина самої мови, він однаковий у браузері й у Node."
            en: "`JSON` is part of the language itself; it is the same in the browser and in Node."
        - id: map
          code: "new Map()"
          why:
            uk: "`Map` — теж частина мови, а не середовища."
            en: "`Map` is part of the language too, not of the host."
      correct: [fs, env, immediate]
    explanation:
      uk: "`node:fs` і `process` дає лише Node: сторінка не читає файлів і не має змінних оточення. `setImmediate` — функція Node (у Chrome її немає). `JSON` і `Map` — мова, вони є скрізь."
      en: "Only Node provides `node:fs` and `process`: a page does not read files and has no environment variables. `setImmediate` is a Node function (Chrome does not have it). `JSON` and `Map` are the language; they exist everywhere."

  - id: recall-foundations
    kind: review
    title:
      uk: "На чому стоїть етап Node"
      en: "What the Node stage stands on"
    items:
      - id: assertion-no-check
        from: js-14-08-compile-time-vs-runtime
        prompt:
          uk: "Скрипт читає файл і пише `const expenses = JSON.parse(text) as Expense[];`. Що гарантує, що у файлі справді масив витрат?"
          en: "A script reads a file and writes `const expenses = JSON.parse(text) as Expense[];`. What guarantees that the file really holds an array of expenses?"
        answer:
          type: choice
          options:
            - id: nothing
              text:
                uk: "Нічого: `as` лише каже `tsc` повірити; потрібна перевірка під час виконання"
                en: "Nothing: `as` only tells `tsc` to believe it; a check at run time is needed"
            - id: tsc
              text:
                uk: "`tsc` перевірить вміст файлу під час `--noEmit`"
                en: "`tsc` checks the file’s content during `--noEmit`"
              why:
                uk: "`tsc` бачить код, а не дані: вміст файлу з’являється лише під час виконання."
                en: "`tsc` sees code, not data: the file’s content appears only at run time."
            - id: node
              text:
                uk: "Node перевірить тип `Expense[]`, коли виконуватиме `.ts`"
                en: "Node checks the `Expense[]` type when it runs the `.ts` file"
              why:
                uk: "Node вирізає типи й нічого не перевіряє. `as Expense[]` після вирізання просто зникає."
                en: "Node cuts out the types and checks nothing. `as Expense[]` simply disappears after cutting."
          correct: [nothing]
        explanation:
          uk: "Твердження типу — обіцянка, яку ніхто не перевіряє. Дані ззовні (файл, оточення, мережа) перевіряє лише код, що працює під час виконання."
          en: "A type assertion is a promise nobody checks. Outside data (a file, the environment, the network) is checked only by code that runs at run time."
      - id: skipped-native
        from: rn-01-02-toolchain-setup
        prompt:
          uk: "У розділі React Native ти позначив native-завдання кнопкою «У мене немає емулятора чи пристрою». Що з ним тепер і чи закриває це етап Node?"
          en: "In the React Native stage you marked a native task with the button “I have no emulator or device”. What is its status now, and does that close off the Node stage?"
        answer:
          type: choice
          options:
            - id: unperformed-open
              text:
                uk: "Воно записане як невиконане й не зараховане, а етап Node відкритий: native-практика не є його передумовою"
                en: "It is recorded as not performed and not counted as done, while the Node stage is open: native practice is not its prerequisite"
            - id: passed
              text:
                uk: "Воно зараховане як виконане, бо причина поважна"
                en: "It counts as done, because the reason is valid"
              why:
                uk: "Курс не зараховує того, чого не було зроблено: позначка каже «не виконано, бо немає інструментів», і повернутися до завдання можна будь-коли."
                en: "The course does not count what was not done: the mark says “not performed, no tooling”, and you can return to the task at any time."
            - id: blocked
              text:
                uk: "Етап Node закритий, доки native-завдання не виконано"
                en: "The Node stage is closed until the native task is done"
              why:
                uk: "Етап Node спирається на JavaScript, TypeScript, асинхронність і модель даних React, а не на запуск на пристрої. Невиконана native-практика його не блокує."
                en: "The Node stage relies on JavaScript, TypeScript, async code and React’s data model, not on running on a device. Unperformed native practice does not block it."
          correct: [unperformed-open]
        explanation:
          uk: "Платформа пише про таке завдання: «Позначено: не виконано (немає native-інструментів). Це не зараховано як виконане». Це чесний запис, а не бар’єр: етап Node використовує знання з JavaScript, TypeScript, асинхронного коду й React, а native-завдання чекає, доки з’являться емулятор чи пристрій."
          en: "The platform says about such a task: “Marked: not performed (no native tooling). It is not counted as done”. That is an honest record, not a barrier: the Node stage uses what you know from JavaScript, TypeScript, async code and React, while the native task waits until an emulator or a device is available."
      - id: node-prerequisites
        from: js-14-08-compile-time-vs-runtime
        prompt:
          uk: "Що з попередніх етапів курсу потрібно, щоб упевнено писати скрипти цього розділу?"
          en: "What from the earlier stages of the course do you need to write this unit’s scripts with confidence?"
        answer:
          type: choice
          options:
            - id: js-ts-async
              text:
                uk: "JavaScript і TypeScript (типи проти перевірки під час виконання), проміси й event loop, асинхронна модель даних React"
                en: "JavaScript and TypeScript (types versus run-time checks), promises and the event loop, React’s async data model"
            - id: native
              text:
                uk: "Лише успішний запуск застосунку React Native на пристрої"
                en: "Only a successful run of a React Native app on a device"
              why:
                uk: "Жоден скрипт цього розділу не торкається пристрою. Native-запуск — окрема практика, не передумова етапу Node."
                en: "No script in this unit touches a device. A native run is separate practice, not a prerequisite of the Node stage."
            - id: nothing-new
              text:
                uk: "Нічого: Node — зовсім інша мова"
                en: "Nothing: Node is a completely different language"
              why:
                uk: "Мова та сама — змінилося лише середовище. Без промісів, модулів і типів скрипти цього розділу не написати."
                en: "The language is the same — only the host changed. Without promises, modules and types this unit’s scripts cannot be written."
          correct: [js-ts-async]
        explanation:
          uk: "Скрипти розділу — це JavaScript і TypeScript (JS-14), асинхронний код і черги (JS-08) та звичка відокремлювати дані від їхнього завантаження (RE-06). Решту дає нове середовище — Node."
          en: "This unit’s scripts are JavaScript and TypeScript (JS-14), async code and queues (JS-08) and the habit of separating data from how it loads (RE-06). The new host — Node — supplies the rest."

  - id: summarize-locally
    kind: local-task
    runtime: local-node
    title:
      uk: "Твій скрипт summarize.ts у терміналі"
      en: "Your summarize.ts script in the terminal"
    intro:
      uk: |
        Тепер напиши такий скрипт сам — у своєму терміналі, без готового коду. Скористайся текою `~/js-course/no01-ts` з уроку «TypeScript у Node»: там уже є `package.json` з `"type": "module"`, `tsconfig.json`, TypeScript і `@types/node`. Якщо ти її не створював, повтори кроки 1–4 того уроку (у кроці 4 потрібен лише `tsconfig.json`). `tsc` перевіряє всі файли `.ts` у теці, тож файли того уроку теж мають бути без помилок типів — або видали їх.

        **Що має робити `summarize.ts`:**

        - читати конфігурацію з `process.env`: `LIMIT` (ціле число від 1, за замовчуванням 3), `LOCALE` (`uk` або `en`, за замовчуванням `uk`), `DATA_FILE` (за замовчуванням `expenses.json`), через власний `loadConfig`;
        - на хибній конфігурації — зрозуміле повідомлення в stderr і `process.exitCode = 1`, нічого не читаючи;
        - читати файл даних (`node:fs/promises`), рахувати суму за кожною категорією в цілих копійках і друкувати не більше `LIMIT` найбільших;
        - повідомляти про хід роботи через власний `EventEmitter` (наприклад, подія `'step'`), а наприкінці — і на успіху, і на помилці — знімати свого слухача;
        - на відсутньому файлі — повідомлення в stderr і код завершення `1`.

        **Файл `expenses.json`** (поклади його в ту саму теку):

        ```json
        [
          { "id": "e-01", "amountMinor": 84550, "category": "food" },
          { "id": "e-02", "amountMinor": 52000, "category": "transport" },
          { "id": "e-03", "amountMinor": 18000, "category": "fun" },
          { "id": "e-04", "amountMinor": 9990, "category": "home" },
          { "id": "e-05", "amountMinor": 30000, "category": "fun" },
          { "id": "e-06", "amountMinor": 21050, "category": "food" }
        ]
        ```

        **Як виглядав вивід під час підготовки уроку** (macOS, Node.js v25.2.1, власна версія скрипта автора; твої тексти повідомлень можуть бути іншими, а рядки `[progress]` — це stderr):

        ```text
        $ LIMIT=abc node summarize.ts; echo "exit $?"
        LIMIT must be a whole number from 1, got "abc"
        exit 1
        $ node summarize.ts; echo "exit $?"
        [progress] reading expenses.json
        [progress] summed 6 expenses
        food: 1056.00
        transport: 520.00
        fun: 480.00
        [progress] listeners left: 0
        exit 0
        $ DATA_FILE=missing.json node summarize.ts; echo "exit $?"
        [progress] reading missing.json
        cannot read missing.json: ENOENT: no such file or directory, open 'missing.json'
        [progress] listeners left: 0
        exit 1
        ```

        Команди з `LIMIT=…` і `echo $?` — для терміналів macOS і Linux; Windows під час підготовки не перевіряли.
      en: |
        Now write such a script yourself — in your own terminal, with no ready-made code. Use the folder `~/js-course/no01-ts` from the lesson “TypeScript in Node”: it already has a `package.json` with `"type": "module"`, a `tsconfig.json`, TypeScript and `@types/node`. If you did not create it, repeat steps 1–4 of that lesson (step 4 needs only `tsconfig.json`). `tsc` checks every `.ts` file in the folder, so that lesson’s files must be free of type errors too — or delete them.

        **What `summarize.ts` must do:**

        - read its config from `process.env`: `LIMIT` (a whole number from 1, default 3), `LOCALE` (`uk` or `en`, default `uk`), `DATA_FILE` (default `expenses.json`), through your own `loadConfig`;
        - on an invalid config — a readable message on stderr and `process.exitCode = 1`, without reading anything;
        - read the data file (`node:fs/promises`), sum each category in whole minor units and print at most `LIMIT` of the largest;
        - report progress through your own `EventEmitter` (for example a `'step'` event), and at the end — on success and on failure alike — remove your listener;
        - on a missing file — a message on stderr and exit code `1`.

        **The file `expenses.json`** (put it in the same folder):

        ```json
        [
          { "id": "e-01", "amountMinor": 84550, "category": "food" },
          { "id": "e-02", "amountMinor": 52000, "category": "transport" },
          { "id": "e-03", "amountMinor": 18000, "category": "fun" },
          { "id": "e-04", "amountMinor": 9990, "category": "home" },
          { "id": "e-05", "amountMinor": 30000, "category": "fun" },
          { "id": "e-06", "amountMinor": 21050, "category": "food" }
        ]
        ```

        **What the output looked like while this lesson was prepared** (macOS, Node.js v25.2.1, the author’s own version of the script; your message texts may differ, and the `[progress]` lines are stderr):

        ```text
        $ LIMIT=abc node summarize.ts; echo "exit $?"
        LIMIT must be a whole number from 1, got "abc"
        exit 1
        $ node summarize.ts; echo "exit $?"
        [progress] reading expenses.json
        [progress] summed 6 expenses
        food: 1056.00
        transport: 520.00
        fun: 480.00
        [progress] listeners left: 0
        exit 0
        $ DATA_FILE=missing.json node summarize.ts; echo "exit $?"
        [progress] reading missing.json
        cannot read missing.json: ENOENT: no such file or directory, open 'missing.json'
        [progress] listeners left: 0
        exit 1
        ```

        The commands with `LIMIT=…` and `echo $?` are for macOS and Linux terminals; Windows was not checked while preparing.
    tools:
      - { name: "Node.js", version: { uk: "22.18 або новіший", en: "22.18 or newer" }, note: { uk: "перевірено з v25.2.1", en: "checked with v25.2.1" } }
      - { name: "TypeScript", version: "7.0.2", note: { uk: "з теки уроку «TypeScript у Node»", en: "from the folder of the lesson “TypeScript in Node”" } }
      - { name: { uk: "Редактор коду", en: "A code editor" }, version: "VS Code", note: { uk: "або будь-який інший", en: "or any other" } }
    steps:
      - text:
          uk: "Перейди в теку лабораторії й поклади поруч файл `expenses.json` із вступу."
          en: "Go to the lab folder and put the file `expenses.json` from the introduction next to the others."
        command: "mkdir -p ~/js-course/no01-ts\ncd ~/js-course/no01-ts"
      - text:
          uk: "Напиши `summarize.ts` за вимогами зі вступу й перевір типи."
          en: "Write `summarize.ts` to the requirements in the introduction and check the types."
        command: "npx tsc --noEmit"
        expect:
          uk: "`tsc` нічого не друкує. Якщо друкує помилки — виправ їх: так ти розділяєш те, що ловлять типи, і те, що ловитиме перевірка під час виконання."
          en: "`tsc` prints nothing. If it prints errors, fix them: that is how you separate what types catch from what the run-time check will catch."
      - text:
          uk: "Запусти з хибним `LIMIT` і подивись на код завершення."
          en: "Run with an invalid `LIMIT` and look at the exit code."
        command: "LIMIT=abc node summarize.ts; echo \"exit $?\""
        expect:
          uk: "Зрозуміле повідомлення про `LIMIT` зі значенням `abc` і `exit 1`; дані не читалися (жодного рядка про файл)."
          en: "A readable message about `LIMIT` with the value `abc` and `exit 1`; no data was read (not a single line about the file)."
      - text:
          uk: "Запусти без `LOCALE` (якщо в тебе ця змінна задана глобально, додай перед командою `env -u LOCALE`)."
          en: "Run without `LOCALE` (if you have that variable set globally, put `env -u LOCALE` before the command)."
        command: "node summarize.ts; echo \"exit $?\""
        expect:
          uk: "Три найбільші категорії: food 1056.00, transport 520.00, fun 480.00 (форма рядків — твоя), повідомлення про хід роботи, `0` слухачів наприкінці й `exit 0`."
          en: "The three largest categories: food 1056.00, transport 520.00, fun 480.00 (the form of the lines is yours), the progress messages, `0` listeners at the end and `exit 0`."
      - text:
          uk: "Запусти з файлом, якого немає."
          en: "Run with a file that does not exist."
        command: "DATA_FILE=missing.json node summarize.ts; echo \"exit $?\""
        expect:
          uk: "Повідомлення з назвою `missing.json` (у Node це помилка `ENOENT`), `0` слухачів наприкінці й `exit 1` — без необробленого стеку помилки."
          en: "A message naming `missing.json` (in Node this is the `ENOENT` error), `0` listeners at the end and `exit 1` — without an unhandled error stack."
    verify:
      - id: bad-env-exit
        text:
          uk: "`LIMIT=abc` дав зрозуміле повідомлення й `exit 1`, і файл даних при цьому не читався."
          en: "`LIMIT=abc` gave a readable message and `exit 1`, and the data file was not read."
      - id: default-locale
        text:
          uk: "Без `LOCALE` скрипт надрукував три найбільші категорії й завершився з `exit 0`."
          en: "Without `LOCALE` the script printed the three largest categories and ended with `exit 0`."
      - id: missing-file-exit
        text:
          uk: "З `DATA_FILE=missing.json` скрипт надрукував повідомлення з назвою файлу й завершився з `exit 1`, а слухачів не лишилося."
          en: "With `DATA_FILE=missing.json` the script printed a message with the file name and ended with `exit 1`, with no listeners left."
      - id: tsc-clean
        text:
          uk: "`npx tsc --noEmit` для мого `summarize.ts` нічого не надрукував."
          en: "`npx tsc --noEmit` printed nothing for my `summarize.ts`."
    troubleshooting:
      - problem:
          uk: "`tsc` пише `error TS2591: Cannot find name 'process'` (або `'node:fs/promises'`) і радить установити типи для node"
          en: "`tsc` says `error TS2591: Cannot find name 'process'` (or `'node:fs/promises'`) and suggests installing the types for node"
        fix:
          uk: "Типам бракує опису Node: у теці мають бути встановлені `@types/node`, а в `tsconfig.json` — `\"types\": [\"node\"]`, як у кроках 3–4 уроку «TypeScript у Node». Під час підготовки уроку (TypeScript 7.0.2) саме цю помилку дав `tsconfig.json` з `\"types\": []`."
          en: "The types lack a description of Node: the folder must have `@types/node` installed and `tsconfig.json` must have `\"types\": [\"node\"]`, as in steps 3–4 of the lesson “TypeScript in Node”. While this lesson was prepared (TypeScript 7.0.2), a `tsconfig.json` with `\"types\": []` gave exactly this error."
    recovery:
      uk: "Скрипт лише читає `expenses.json` і нічого не записує. Якщо заплутався, почни `summarize.ts` наново з `loadConfig`: спершу доведи до правильного коду завершення хибний `LIMIT`, потім — читання файлу, потім — слухачів."
      en: "The script only reads `expenses.json` and writes nothing. If you get tangled, start `summarize.ts` over from `loadConfig`: first make an invalid `LIMIT` give the right exit code, then add reading the file, then the listeners."

  - id: to-project
    kind: transfer
    capstoneStep: NO-01
    body:
      uk: "За планом крок проєкту цього розділу — те саме для твого домену: тека `server/` із типізованим скриптом, що імпортує спільні доменні функції й фікстури, читає перевірену конфігурацію з оточення й друкує підсумок."
      en: "As planned, this unit’s project step is the same thing for your domain: a `server/` folder with a typed script that imports the shared domain functions and fixtures, reads a validated config from the environment and prints a summary."
