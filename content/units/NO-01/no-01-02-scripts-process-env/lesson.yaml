id: no-01-02-scripts-process-env
unit: NO-01
title:
  uk: "Запуск скриптів: process, env і конфігурація"
  en: "Running scripts: process, env and config"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачити `process.argv`, значення `process.env` і код завершення програми для заданого командного рядка й оточення."
    en: "Predict `process.argv`, `process.env` values and the exit code of a script for a given command line and environment."
  - uk: "Написати `loadConfig(env)`, що перетворює текст зі змінних оточення на типізовані значення зі значеннями за замовчуванням і одразу зупиняє роботу зрозумілим повідомленням, якщо значення хибне."
    en: "Implement `loadConfig(env)` that parses env strings into typed values with defaults and fails fast with a readable message on an invalid value."
prerequisites: [no-01-01-node-vs-browser, js-15-06-build-env-sourcemaps]
subskills:
  - { family: B-01, skill: "process/env/config", depth: intro }
glossary: [process-argv, process-env, process-exit-code, fail-fast]
selfCheck: [predict-command-line, load-config]

blocks:
  - id: process-inputs
    kind: explanation
    title:
      uk: "Що процес отримує й що віддає"
      en: "What a process receives and gives back"
    body:
      uk: |
        Коли ти пишеш у терміналі

        ```sh
        PORT=3000 node summary.mjs --limit 3
        ```

        операційна система запускає **процес** Node і передає йому три речі:

        - [[process-argv|`process.argv`]] — список слів командного рядка: шлях до `node`, шлях до файлу, далі твої аргументи. Тому свої аргументи беруть як `process.argv.slice(2)` — тут `['--limit', '3']`.
        - [[process-env|`process.env`]] — [[environment-variable|змінні оточення]]: об’єкт, де **кожне значення — текст**. `PORT` прийде як `"3000"`, а не число. Змінна, якої не задали, — `undefined`.
        - `process.cwd()` — робоча тека, від якої рахуються відносні шляхи.

        Назад процес віддає вивід (`console.log` іде в stdout, `console.error` — у stderr) і [[process-exit-code|код завершення]]: `0` — успіх, будь-яке інше число — збій.

        Запис `PORT=3000 node …` працює в терміналах macOS і Linux.
      en: |
        When you type in a terminal

        ```sh
        PORT=3000 node summary.mjs --limit 3
        ```

        the operating system starts a Node **process** and hands it three things:

        - [[process-argv|`process.argv`]] — the list of words on the command line: the path to `node`, the path to the file, then your arguments. That is why your arguments are taken as `process.argv.slice(2)` — here `['--limit', '3']`.
        - [[process-env|`process.env`]] — the [[environment-variable|environment variables]]: an object where **every value is text**. `PORT` arrives as `"3000"`, not as a number. A variable nobody set is `undefined`.
        - `process.cwd()` — the working directory that relative paths start from.

        The process gives back its output (`console.log` goes to stdout, `console.error` to stderr) and an [[process-exit-code|exit code]]: `0` means success, any other number means failure.

        The `PORT=3000 node …` form works in macOS and Linux terminals.

  - id: predict-command-line
    kind: prediction
    prompt:
      uk: "Файл `summary.mjs` запускають командою `PORT=3000 node summary.mjs --limit 3`, а змінну `LOCALE` ніхто не задавав. Що виведуть три `console.log`?"
      en: "The file `summary.mjs` is started with `PORT=3000 node summary.mjs --limit 3`, and nobody set the variable `LOCALE`. What do the three `console.log` calls print?"
    code: |
      console.log(process.argv.slice(2));
      console.log(typeof process.env.PORT);
      console.log(process.env.LOCALE);
    runnable: false
    answer:
      type: choice
      options:
        - id: all-text
          text:
            uk: "`[ '--limit', '3' ]`, потім `string`, потім `undefined`"
            en: "`[ '--limit', '3' ]`, then `string`, then `undefined`"
        - id: typed
          text:
            uk: "`[ '--limit', 3 ]`, потім `number`, потім `undefined`"
            en: "`[ '--limit', 3 ]`, then `number`, then `undefined`"
          why:
            uk: "Командний рядок і оточення — це текст. Node не вгадує, що `3` чи `3000` мали бути числами: перетворювати їх — твоя робота."
            en: "The command line and the environment are text. Node does not guess that `3` or `3000` were meant to be numbers: converting them is your job."
        - id: with-file
          text:
            uk: "`[ 'summary.mjs', '--limit', '3' ]`, потім `string`, потім `undefined`"
            en: "`[ 'summary.mjs', '--limit', '3' ]`, then `string`, then `undefined`"
          why:
            uk: "`process.argv[0]` — шлях до `node`, `process.argv[1]` — шлях до файлу. `slice(2)` пропускає обидва й лишає тільки твої аргументи."
            en: "`process.argv[0]` is the path to `node`, `process.argv[1]` the path to the file. `slice(2)` skips both and keeps only your arguments."
        - id: empty-text
          text:
            uk: "`[ '--limit', '3' ]`, потім `string`, потім порожній рядок"
            en: "`[ '--limit', '3' ]`, then `string`, then an empty line"
          why:
            uk: "Незадана змінна в `process.env` відсутня зовсім, тож її значення — `undefined`, а не порожній текст."
            en: "A variable that was not set is missing from `process.env` altogether, so its value is `undefined`, not empty text."
      correct: [all-text]
    explanation:
      uk: "Усе, що процес отримує ззовні, — текст: аргументи `'--limit'` і `'3'` та змінна `PORT` зі значенням `\"3000\"`. Незадана `LOCALE` — `undefined`. Перевірено справжнім Node.js у терміналі з тією самою командою."
      en: "Everything a process receives from outside is text: the arguments `'--limit'` and `'3'` and the variable `PORT` with the value `\"3000\"`. The unset `LOCALE` is `undefined`. Checked with real Node.js in a terminal with the same command."

  - id: process-boundary
    kind: visual
    visual: diagram
    title:
      uk: "Межа процесу: текст усередину, вивід і код назовні"
      en: "The process boundary: text in, output and a code out"
    textEquivalent:
      uk: "Угорі — що процес отримує: аргументи командного рядка (process.argv, тут --limit 3) і змінні оточення (process.env, тут PORT зі значенням \"3000\"). Обидва — лише текст. Посередині — сама програма summary.mjs і функція loadConfig. Аргументи йдуть просто в програму, а змінні оточення — у loadConfig, яка перетворює текст на типізовану конфігурацію (число 3000) або повертає помилку ще до початку роботи. Унизу — що процес віддає: вивід у stdout і stderr та код завершення: 0 — успіх, інше число — збій."
      en: "At the top is what the process receives: the command-line arguments (process.argv, here --limit 3) and the environment variables (process.env, here PORT with the value \"3000\"). Both are only text. In the middle are the program summary.mjs and the function loadConfig. The arguments go straight into the program, and the environment variables into loadConfig, which turns the text into a typed config (the number 3000) or returns an error before any work starts. At the bottom is what the process gives back: output on stdout and stderr, and the exit code: 0 for success, another number for failure."
    spec:
      layout: grid
      groups:
        - { id: inputs, label: { uk: "Отримує (текст)", en: "Receives (text)" } }
        - { id: program, label: { uk: "Процес Node", en: "Node process" } }
        - { id: outputs, label: { uk: "Віддає", en: "Gives back" } }
      nodes:
        - { id: argv, group: inputs, label: "argv: --limit 3", w: 128, col: 0, row: 0 }
        - { id: env, group: inputs, label: "env: PORT=\"3000\"", w: 128, col: 1, row: 0 }
        - { id: script, group: program, label: "summary.mjs", w: 128, col: 0, row: 1 }
        - { id: config, group: program, label: "loadConfig(env)", shape: round, w: 128, col: 1, row: 1 }
        - { id: output, group: outputs, label: "stdout · stderr", w: 128, col: 0, row: 2 }
        - { id: code, group: outputs, label: { uk: "код завершення", en: "exit code" }, shape: pill, w: 128, col: 1, row: 2 }
      edges:
        - { id: argv-script, from: argv, to: script }
        - { id: env-config, from: env, to: config }
        - { id: config-script, from: config, to: script, label: "3000" }
        - { id: script-output, from: script, to: output }
        - { id: script-code, from: script, to: code }
      steps:
        - caption:
            uk: "Процес Node посередині: угорі те, що він отримує, унизу те, що віддає."
            en: "The Node process in the middle: what it receives at the top, what it gives back at the bottom."
        - caption:
            uk: "`process.argv.slice(2)` — твої аргументи: `['--limit', '3']`. Це два тексти, а не текст і число."
            en: "`process.argv.slice(2)` holds your arguments: `['--limit', '3']`. That is two texts, not a text and a number."
          highlight: [argv, argv-script]
          dim: [env, config, output, code]
        - caption:
            uk: "`process.env.PORT` — `\"3000\"`, текст. Змінна, якої не задали, — `undefined`."
            en: "`process.env.PORT` is `\"3000\"`, text. A variable nobody set is `undefined`."
          highlight: [env]
          dim: [argv, script, output, code]
        - caption:
            uk: "`loadConfig` один раз на старті перетворює текст на типізовану конфігурацію — або повертає помилку, і програма зупиняється, ще нічого не зробивши."
            en: "`loadConfig` turns the text into a typed config once, at the start — or returns an error, and the program stops before doing anything."
          highlight: [env-config, config, config-script]
          dim: [argv, output, code]
        - caption:
            uk: "Назад: `console.log` пише в stdout, `console.error` — у stderr, а код завершення каже терміналу (і `npm`), чи все вдалося: `0` — так, інше число — ні."
            en: "Back out: `console.log` writes to stdout, `console.error` to stderr, and the exit code tells the terminal (and `npm`) whether it worked: `0` yes, another number no."
          highlight: [output, code, script-output, script-code]
          dim: [argv, env, config]

  - id: fail-fast-exit
    kind: explanation
    title:
      uk: "Зупинись одразу — але не обривай"
      en: "Stop early — but do not cut off"
    body:
      uk: |
        Хибне значення в конфігурації краще помітити **на старті**, ніж через годину роботи. Це правило [[fail-fast]]: перевір усі змінні одразу, а якщо щось не так — надрукуй зрозуміле повідомлення в stderr і заверши процес із кодом, відмінним від `0`.

        Для коду завершення в Node є два інструменти:

        - `process.exitCode = 1` лише **записує** код. Node доробить усе, що вже заплановано (таймери, вивід), і завершиться сам — уже із цим кодом.
        - `process.exit(1)` завершує процес **негайно**: заплановане не виконається, а частина виводу може не встигнути надрукуватися. Документація Node.js 22 (`process.exit`) радить замість нього ставити `process.exitCode`.

        Тож звичайний шлях — `process.exitCode`, а `process.exit()` — для рідкісних випадків, коли чекати справді не можна.
      en: |
        An invalid config value is better noticed **at the start** than after an hour of work. That is the [[fail-fast]] rule: check every variable at once, and if something is wrong, print a readable message to stderr and end the process with a code other than `0`.

        Node has two tools for the exit code:

        - `process.exitCode = 1` only **records** the code. Node finishes everything already scheduled (timers, output) and ends on its own — with that code.
        - `process.exit(1)` ends the process **at once**: scheduled work does not run, and part of the output may not get printed. The Node.js 22 documentation (`process.exit`) recommends setting `process.exitCode` instead.

        So the usual way is `process.exitCode`, and `process.exit()` is for the rare case when waiting is really not an option.

  - id: predict-exit
    kind: prediction
    prompt:
      uk: "Що надрукує цей файл у Node.js?"
      en: "What does this file print in Node.js?"
    code: |
      setTimeout(() => console.log("saved"), 0);
      console.log("done");
      process.exit(0);
    runnable: false
    answer:
      type: choice
      options:
        - id: done-only
          text:
            uk: "Лише `done`"
            en: "Only `done`"
        - id: both
          text:
            uk: "`done`, потім `saved`"
            en: "`done`, then `saved`"
          why:
            uk: "Так було б із `process.exitCode`. `process.exit()` завершує процес одразу, і таймер, що вже чекав у черзі, не виконається."
            en: "That would happen with `process.exitCode`. `process.exit()` ends the process at once, and the timer that was already waiting never runs."
        - id: saved-first
          text:
            uk: "`saved`, потім `done`"
            en: "`saved`, then `done`"
          why:
            uk: "Навіть з нулем мілісекунд таймер чекає, доки закінчиться синхронний код. А тут синхронний код закінчується викликом `process.exit()`."
            en: "Even with zero milliseconds, a timer waits until the synchronous code is over. And here the synchronous code ends with a call to `process.exit()`."
      correct: [done-only]
    explanation:
      uk: "`done` друкується синхронно, а `process.exit(0)` завершує процес раніше, ніж таймер отримав свою чергу. Перевірено справжнім Node.js: вивід — один рядок `done`, код завершення `0`."
      en: "`done` is printed synchronously, and `process.exit(0)` ends the process before the timer gets its turn. Checked with real Node.js: the output is the single line `done`, exit code `0`."

  - id: command-lines
    kind: example
    runtime: isolated-node
    dir: command-lines
    entry: index.js
    expectError: true
    strings:
      badLimit: { uk: "--limit має бути цілим числом від 1, а отримано", en: "--limit must be a whole number from 1, got" }
      checkedAll: { uk: "Усі три командні рядки перевірено.", en: "All three command lines checked." }
    title:
      uk: "Три командні рядки й обірваний кінець"
      en: "Three command lines and a cut-off ending"
    body:
      uk: |
        Платформа запускає `node index.js` без твоїх аргументів і майже без змінних оточення — це видно з першого рядка виводу. Тому `index.js` сам передає `runSummary(argv, env)` три набори, як три запуски в терміналі. Така функція з параметрами ще й легко перевіряється.

        Натисни **Запустити**. Третій набір має `--limit two`: `runSummary` друкує помилку червоним (stderr) і викликає `process.exit(1)`. Подивись, чи з’явився останній рядок `index.js` і який код завершення показала платформа.
      en: |
        The platform runs `node index.js` without arguments of yours and with almost no environment variables — the first line of the output shows it. So `index.js` passes three sets to `runSummary(argv, env)` itself, like three runs in a terminal. A function with parameters like this is also easy to check.

        Press **Run**. The third set has `--limit two`: `runSummary` prints an error in red (stderr) and calls `process.exit(1)`. See whether the last line of `index.js` appeared and which exit code the platform showed.
    tryIt:
      uk: |
        1. У `summary.js` заміни `process.exit(1);` двома рядками коду: `process.exitCode = 1;` і `return;`. Запусти: тепер з’являється й останній рядок «Усі три командні рядки перевірено.», а код завершення все одно `1`.
        2. У `index.js` заміни `'two'` на `'4'` і запусти: помилок немає, третій рядок показує всі чотири справи, а код завершення — `0`.
      en: |
        1. In `summary.js` replace `process.exit(1);` with two lines of code: `process.exitCode = 1;` and `return;`. Run: now the last line “All three command lines checked.” appears too, and the exit code is still `1`.
        2. In `index.js` replace `'two'` with `'4'` and run: there are no errors, the third line shows all four tasks, and the exit code is `0`.

  - id: recall-validation
    kind: review
    title:
      uk: "Пригадай: перевірка введення"
      en: "Recall: checking input"
    items:
      - id: number-of-text
        from: js-02-11-independent-validation
        prompt:
          uk: "Що виведе цей рядок коду? Подумай, що це означає для змінної `PORT=` без значення."
          en: "What does this line of code print? Think about what it means for a variable `PORT=` with no value."
        code: |
          console.log(Number(""), Number("abc"), Number("8080"));
        verify: { logs: ["0 NaN 8080"] }
        answer:
          type: choice
          options:
            - id: zero-nan
              code: "0 NaN 8080"
            - id: nan-nan
              code: "NaN NaN 8080"
              why:
                uk: "Порожній текст `Number` перетворює на `0`, а не на `NaN`. Саме тому перевірка «це не `NaN`» пропускає порожнє значення."
                en: "`Number` turns empty text into `0`, not `NaN`. That is exactly why a “not `NaN`” check lets an empty value through."
            - id: zero-zero
              code: "0 0 8080"
              why:
                uk: "Текст, що не є числом, дає `NaN`. `0` виходить лише з порожнього (або із самих пробілів) тексту."
                en: "Text that is not a number gives `NaN`. `0` comes only from empty (or whitespace-only) text."
          correct: [zero-nan]
        explanation:
          uk: "`Number(\"\")` — `0`, `Number(\"abc\")` — `NaN`. Тому числову змінну оточення перевіряють за формою тексту (лише цифри) і за діапазоном, а не лише «чи вийшло число»."
          en: "`Number(\"\")` is `0`, `Number(\"abc\")` is `NaN`. That is why a numeric environment variable is checked by the shape of its text (digits only) and by range, not only by “did a number come out”."
      - id: result-not-crash
        from: js-02-11-independent-validation
        prompt:
          uk: "Навіщо функції перевірки повертати `{ ok: false, errors }` замість того, щоб кидати помилку на першому ж хибному полі?"
          en: "Why should a validation function return `{ ok: false, errors }` instead of throwing at the very first invalid field?"
        answer:
          type: choice
          options:
            - id: all-at-once
              text:
                uk: "Щоб повідомити про всі хибні поля разом, а викликач сам вирішив, що робити"
                en: "So it reports all invalid fields together and the caller decides what to do"
            - id: faster
              text:
                uk: "Бо `throw` працює помітно повільніше за `return`"
                en: "Because `throw` is noticeably slower than `return`"
              why:
                uk: "Швидкість тут ні до чого: перевірка виконується один раз. Важливо, що результат несе всі помилки й не обриває програму."
                en: "Speed has nothing to do with it: the check runs once. What matters is that the result carries every error and does not break off the program."
            - id: no-errors
              text:
                uk: "Щоб програма працювала далі навіть із хибними даними"
                en: "So the program keeps working even with invalid data"
              why:
                uk: "Навпаки: з `ok: false` викликач **не** продовжує роботу, а показує помилки. Різниця лише в тому, що рішення ухвалює він, а не виняток."
                en: "On the contrary: with `ok: false` the caller does **not** carry on, it shows the errors. The difference is only that the caller decides, not an exception."
          correct: [all-at-once]
        explanation:
          uk: "Результат з `ok` і `errors` називає всі проблеми одразу. Скрипт тоді друкує їх у stderr і ставить код завершення — це й є fail fast."
          en: "A result with `ok` and `errors` names all problems at once. A script then prints them to stderr and sets the exit code — that is fail fast."

  - id: load-config
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: load-config
    entry: index.js
    editable: [config.js]
    strings:
      okLabel: { uk: "Конфігурація:", en: "Config:" }
      errorLabel: { uk: "Помилки:", en: "Errors:" }
    title:
      uk: "Конфігурація зі змінних оточення"
      en: "A config from environment variables"
    instructions:
      uk: |
        Допиши `loadConfig(env)` у `config.js`. Параметр `env` має вигляд `process.env`: кожне значення — текст або `undefined`.

        - `PORT`: якщо не задано — число `3000`. Інакше дозволені лише цифри, число від 1 до 65535; поверни його **як число**.
        - `LOCALE`: якщо не задано — `'uk'`. Інакше лише `'uk'` або `'en'`.
        - `TODAY`: обов’язкова дата у формі `YYYY-MM-DD` (рік — 4 цифри, місяць `01`–`12`, день `01`–`31`).

        Якщо все гаразд, поверни `{ ok: true, value: { port, locale, today } }`. Інакше — `{ ok: false, errors }`, де ключ — назва хибної змінної (`PORT`, `LOCALE` чи `TODAY`), а значення — текст повідомлення, який містить отримане хибне значення (мова повідомлення — на твій вибір).

        **Запустити** викликає `loadConfig` із трьома оточеннями; **Перевірити** — з багатьма іншими.
      en: |
        Finish `loadConfig(env)` in `config.js`. The parameter `env` looks like `process.env`: every value is text or `undefined`.

        - `PORT`: when unset, the number `3000`. Otherwise only digits are allowed, a number from 1 to 65535; return it **as a number**.
        - `LOCALE`: when unset, `'uk'`. Otherwise only `'uk'` or `'en'`.
        - `TODAY`: a required date in the form `YYYY-MM-DD` (a 4-digit year, month `01`–`12`, day `01`–`31`).

        If everything is fine, return `{ ok: true, value: { port, locale, today } }`. Otherwise return `{ ok: false, errors }`, where a key is the name of an invalid variable (`PORT`, `LOCALE` or `TODAY`) and its value is a message text that contains the invalid value received (the message language is up to you).

        **Run** calls `loadConfig` with three environments; **Check** calls it with many others.
    testTitles:
      "uses the defaults for PORT and LOCALE":
        uk: "Без `PORT` і `LOCALE` бере `3000` і `'uk'`"
        en: "Without `PORT` and `LOCALE` it uses `3000` and `'uk'`"
      "turns PORT into a number":
        uk: "`PORT` `\"8080\"` стає числом `8080`"
        en: "`PORT` `\"8080\"` becomes the number `8080`"
      "rejects a PORT that is not a whole number from 1 to 65535":
        uk: "Відхиляє `PORT` `abc`, `0`, `70000` і `30.5`"
        en: "Rejects `PORT` `abc`, `0`, `70000` and `30.5`"
      "rejects a LOCALE other than uk or en":
        uk: "Відхиляє `LOCALE` `ua` і `de`"
        en: "Rejects `LOCALE` `ua` and `de`"
      "rejects a missing or impossible TODAY":
        uk: "Відхиляє відсутню `TODAY` і дати `2026-13-01`, `2026-03-32`, `01.03.2026`, `2026-3-1`"
        en: "Rejects a missing `TODAY` and the dates `2026-13-01`, `2026-03-32`, `01.03.2026`, `2026-3-1`"
    hints:
      nudge:
        uk: "Почни з типу: усе в `env` — текст або `undefined`. Для кожної змінної спершу виріши, що робити з `undefined`, а потім — як перевірити текст."
        en: "Start with the type: everything in `env` is text or `undefined`. For each variable, first decide what to do with `undefined`, then how to check the text."
      explanation:
        uk: |
          Ось схожа перевірка для іншої змінної — `RETRIES`, від 0 до 5, за замовчуванням 2:

          ```js
          const retries = env.RETRIES === undefined ? 2 : Number(env.RETRIES);
          if (env.RETRIES !== undefined && (!/^\d+$/.test(env.RETRIES) || retries > 5)) {
            errors.RETRIES = `RETRIES must be 0–5, got "${env.RETRIES}"`;
          }
          ```

          Регулярний вираз `/^\d+$/` пропускає лише текст із самих цифр: так відпадають `abc`, `30.5` і порожній текст. Для дати групи в дужках `/^(\d{4})-(\d{2})-(\d{2})$/` дають рік, місяць і день окремо — їх можна перетворити на числа й порівняти з межами. Збирай помилки в об’єкт `errors` і наприкінці подивись, чи він порожній.
        en: |
          Here is a similar check for another variable — `RETRIES`, from 0 to 5, default 2:

          ```js
          const retries = env.RETRIES === undefined ? 2 : Number(env.RETRIES);
          if (env.RETRIES !== undefined && (!/^\d+$/.test(env.RETRIES) || retries > 5)) {
            errors.RETRIES = `RETRIES must be 0–5, got "${env.RETRIES}"`;
          }
          ```

          The regular expression `/^\d+$/` lets through only text made of digits: that rules out `abc`, `30.5` and empty text. For the date, the groups in parentheses of `/^(\d{4})-(\d{2})-(\d{2})$/` give the year, month and day separately — you can turn them into numbers and compare them with the limits. Collect errors in an `errors` object and at the end see whether it is empty.
    solutionNote:
      uk: "Рішення читає кожну змінну один раз: `undefined` замінює значенням за замовчуванням, текст перевіряє за формою й межами, а `PORT` перетворює на число. Усі помилки збираються в `errors`, тож одне повідомлення називає кожну хибну змінну. Такий `loadConfig` викликають на старті програми — до будь-якої роботи."
      en: "The solution reads each variable once: it replaces `undefined` with the default, checks the text by its shape and limits, and turns `PORT` into a number. All errors are collected in `errors`, so one message names every invalid variable. Such a `loadConfig` is called at the start of a program — before any work."
    feedback:
      - when: { test: "uses the defaults for PORT and LOCALE" }
        message:
          uk: "Ця перевірка викликає `loadConfig({ TODAY: '2026-03-01' })` і чекає `{ ok: true, value: { port: 3000, locale: 'uk', today: '2026-03-01' } }`. Незадана змінна — `undefined`, і саме її треба замінити значенням за замовчуванням."
          en: "This check calls `loadConfig({ TODAY: '2026-03-01' })` and expects `{ ok: true, value: { port: 3000, locale: 'uk', today: '2026-03-01' } }`. An unset variable is `undefined`, and that is what must be replaced with the default."
      - when: { test: "turns PORT into a number" }
        message:
          uk: "Ця перевірка дає `PORT: '8080'` і чекає в `value.port` число `8080`, а не текст `\"8080\"`. Зі змінної оточення завжди приходить текст — перетвори його."
          en: "This check passes `PORT: '8080'` and expects the number `8080` in `value.port`, not the text `\"8080\"`. An environment variable always arrives as text — convert it."
      - when: { test: "rejects a PORT that is not a whole number from 1 to 65535" }
        message:
          uk: "Ця перевірка чекає `ok: false` і текст у `errors.PORT`, що містить отримане значення, для `abc`, `0`, `70000` і `30.5`. `Number('abc')` дає `NaN`, а `Number('0')` — `0`: перевір і форму тексту, і межі."
          en: "This check expects `ok: false` and a text in `errors.PORT` containing the value received, for `abc`, `0`, `70000` and `30.5`. `Number('abc')` gives `NaN` and `Number('0')` gives `0`: check both the shape of the text and the limits."
      - when: { test: "rejects a LOCALE other than uk or en" }
        message:
          uk: "Ця перевірка чекає `ok: false` і текст у `errors.LOCALE` з отриманим значенням для `ua` і `de`. Зверни увагу: код української мови — `uk`, а `ua` — код країни."
          en: "This check expects `ok: false` and a text in `errors.LOCALE` with the value received, for `ua` and `de`. Note: the code of the Ukrainian language is `uk`, while `ua` is a country code."
      - when: { test: "rejects a missing or impossible TODAY" }
        message:
          uk: "Ця перевірка чекає `ok: false` і текст у `errors.TODAY`, коли `TODAY` немає, а також для `2026-13-01`, `2026-03-32`, `01.03.2026` і `2026-3-1` (з отриманим значенням у тексті). Правильна форма ще не означає правильну дату: перевір межі місяця й дня."
          en: "This check expects `ok: false` and a text in `errors.TODAY` when `TODAY` is missing, and for `2026-13-01`, `2026-03-32`, `01.03.2026` and `2026-3-1` (with the value received in the text). The right shape does not yet mean a valid date: check the month and day limits."

  - id: to-project
    kind: transfer
    capstoneStep: NO-01
    body:
      uk: "За планом кроку проєкту скрипт читатиме `LOCALE` (а в планувальнику й трекері звичок ще й `TODAY`) саме так: через функцію на зразок `loadConfig`, що на старті перевіряє оточення й із кодом завершення `1` зупиняє скрипт, якщо значення хибне."
      en: "As the project step is planned, the script will read `LOCALE` (and, in the planner and the habit tracker, `TODAY` too) exactly like this: through a function like `loadConfig` that checks the environment at the start and stops the script with exit code `1` when a value is invalid."
