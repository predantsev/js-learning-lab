id: js-01-07-links-buttons-images-tables
unit: JS-01
title:
  uk: "Посилання, кнопки, зображення, таблиці"
  en: "Links, buttons, images, tables"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Обрати посилання для переходу, а кнопку для дії, і пояснити різницю для людини, яка користується клавіатурою."
    en: "Choose a link for navigation and a button for an action, and explain the difference to a keyboard user."
  - uk: "Додати зображення зі змістовним alt і невелику таблицю з рядком заголовків."
    en: "Add an image with meaningful alt text and a small table with a header row."
prerequisites: [js-01-06-html-elements-attributes]
subskills:
  - { family: W-01, skill: "links/buttons", depth: intro }
  - { family: W-01, skill: "tables/images/alt", depth: intro }
glossary: [link, button, alt-text, table]
selfCheck: [link-or-button, expense-table]

blocks:
  - id: go-or-do
    kind: explanation
    title:
      uk: "Посилання веде, кнопка діє"
      en: "A link goes, a button does"
    body:
      uk: |
        [[link|Посилання]] і [[button|кнопку]] можна зробити схожими на вигляд, але це різні елементи з різними обіцянками.

        ```html
        <a href="https://example.com/help">Довідка</a>
        <button type="button">Додати витрату</button>
        ```

        - **Посилання** `<a>` веде **кудись**: на іншу сторінку або в інше місце цієї. Адресу задає атрибут `href`; без нього `<a>` — уже не посилання.
        - **Кнопка** `<button>` **робить дію** тут: додати, видалити, надіслати. `type="button"` позначає просту кнопку дії. Поки наші кнопки нічого не роблять — дію їм дасть JavaScript трохи згодом.

        Для людини з клавіатурою різниця відчутна: до обох можна дійти клавішею Tab, обидва спрацьовують на Enter, але **пробіл** натискає лише кнопку. А програма екранного читання оголошує «посилання» чи «кнопка» — і людина чекає або переходу, або дії.
      en: |
        A [[link]] and a [[button]] can be made to look alike, but they are different elements that make different promises.

        ```html
        <a href="https://example.com/help">Help</a>
        <button type="button">Add expense</button>
        ```

        - A **link**, `<a>`, takes you **somewhere**: to another page or to another place on this one. The `href` attribute sets the address; without it, `<a>` is no longer a link.
        - A **button**, `<button>`, **does something** here: add, delete, send. `type="button"` marks a plain action button. For now our buttons do nothing — JavaScript will give them actions a bit later.

        For a keyboard user the difference is real: Tab reaches both, and both react to Enter, but **Space** presses only the button. A screen reader announces “link” or “button” — and the person expects either to go somewhere or for something to happen.

  - id: link-or-button
    kind: prediction
    prompt:
      uk: "На сторінці трекера витрат чотири елементи керування. Які з них мають бути **кнопками**? Познач усі."
      en: "The expense tracker page has four controls. Which of them should be **buttons**? Mark all of them."
    answer:
      type: multi
      options:
        - id: add
          text:
            uk: "«Додати витрату» — додає новий рядок у таблицю"
            en: "“Add expense” — adds a new row to the table"
        - id: march
          text:
            uk: "«Витрати за березень» — відкриває іншу сторінку"
            en: "“March expenses” — opens another page"
          why:
            uk: "Це перехід на іншу сторінку, тобто посилання `<a href>`."
            en: "It goes to another page, so it is a link, `<a href>`."
        - id: delete
          text:
            uk: "«Видалити» — прибирає витрату зі списку"
            en: "“Delete” — removes an expense from the list"
        - id: help
          text:
            uk: "«Як рахуються підсумки» — веде до розділу довідки"
            en: "“How totals are counted” — leads to a help section"
          why:
            uk: "Перехід до іншого місця — це посилання, навіть якщо його оформлять як кнопку."
            en: "Going to another place is a link, even if it is styled to look like a button."
      correct: [add, delete]
    explanation:
      uk: "Питай себе: «Куди я потраплю?» чи «Що станеться тут?». Перехід — посилання, дія на сторінці — кнопка. Вигляд не вирішує: посилання можна зробити схожим на кнопку, але для клавіатури й програм екранного читання воно залишиться посиланням."
      en: "Ask yourself: “Where will I end up?” or “What will happen here?” Going somewhere is a link; an action on the page is a button. Looks do not decide: a link can be styled like a button, but for the keyboard and for screen readers it stays a link."

  - id: images-tables
    kind: explanation
    title:
      uk: "Зображення з alt і таблиця із заголовками"
      en: "Images with alt, tables with headers"
    body:
      uk: |
        Зображення вставляє елемент `<img>` — у нього немає закривального тегу:

        ```html
        <img src="coffee.jpg" alt="Чашка кави">
        ```

        `src` — звідки взяти картинку, `alt` — [[alt-text|альтернативний текст]]: що на ній видно. Його зачитує програма екранного читання і показує браузер, коли картинка не завантажилась. Пиши, **що видно**, а не «картинка» чи назву файлу. Суто декоративне зображення отримує порожній `alt=""` — тоді його пропускають.

        [[table|Таблиця]] — для даних у рядках і стовпцях. Кожен рядок — `<tr>`; у першому — клітинки-заголовки `<th>`, далі — клітинки з даними `<td>`:

        ```html
        <table>
          <tr><th>Витрата</th><th>Сума, грн</th></tr>
          <tr><td>Кава з друзями</td><td>180</td></tr>
        </table>
        ```

        Коли людина переходить між клітинками, програма екранного читання називає заголовок стовпця: «Сума, грн — 180».
      en: |
        An image is added with the `<img>` element — it has no closing tag:

        ```html
        <img src="coffee.jpg" alt="A cup of coffee">
        ```

        `src` says where to get the picture; `alt` is the [[alt-text]]: what the picture shows. A screen reader reads it, and the browser shows it when the picture fails to load. Write **what is visible**, not “picture” or a file name. A purely decorative image gets an empty `alt=""` — then it is skipped.

        A [[table]] is for data in rows and columns. Each row is a `<tr>`; the first one holds header cells, `<th>`, and the next ones hold data cells, `<td>`:

        ```html
        <table>
          <tr><th>Expense</th><th>Amount, UAH</th></tr>
          <tr><td>Coffee with friends</td><td>180</td></tr>
        </table>
        ```

        When a person moves between the cells, a screen reader names the column header: “Amount, UAH — 180”.

  - id: announce
    kind: prediction
    lang: html
    runnable: false
    prompt:
      uk: "На якомусь сайті є такий фрагмент. Що почує людина, якій програма екранного читання зачитує його?"
      en: "Some website contains this fragment. What does a person hear when a screen reader reads it aloud?"
    code: |
      <img src="IMG_2041.jpg">
      <button type="button">🗑️</button>
    answer:
      type: choice
      options:
        - id: guessed
          text:
            uk: "«Чашка кави, зображення» і «Видалити, кнопка»"
            en: "“A cup of coffee, image” and “Delete, button”"
          why:
            uk: "Програма не бачить картинки й не здогадується, навіщо кнопка: вона читає лише те, що записано в коді."
            en: "The program cannot see the picture or guess what the button is for: it reads only what is written in the code."
        - id: useless
          text:
            uk: "Назву файлу або просто «зображення», потім назву символу (щось на кшталт «кошик для сміття») і «кнопка»"
            en: "The file name or just “image”, then the symbol’s name (something like “wastebasket”) and “button”"
        - id: silent
          text:
            uk: "Нічого: елементи без тексту програма пропускає"
            en: "Nothing: the program skips elements without text"
          why:
            uk: "Пропускає лише зображення з порожнім `alt=\"\"`. Без `alt` картинку оголошують — але без корисної інформації. Кнопку теж оголошують."
            en: "It skips only an image with an empty `alt=\"\"`. Without `alt` the image is announced — just without useful information. The button is announced too."
      correct: [useless]
    explanation:
      uk: "Програма екранного читання знає тільки те, що написано в коді. Без `alt` вона здебільшого читає назву файлу (`IMG_2041.jpg`) або просто «зображення», а кнопку з самим значком називає за назвою символу. Виправлення просте: `alt=\"Чашка кави\"` і зрозумілий текст у кнопці — `Видалити`."
      en: "A screen reader knows only what is written in the code. Without `alt` it usually reads the file name (`IMG_2041.jpg`) or just “image”, and it names an icon-only button after the symbol. The fix is simple: `alt=\"A cup of coffee\"` and clear text in the button — `Delete`."

  - id: expense-page
    kind: example
    runtime: browser-js
    dir: expense-page
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер витрат", en: "Expense tracker" }
      help: { uk: "Як рахуються підсумки", en: "How totals are counted" }
      coffeeAlt: { uk: "Чашка кави", en: "A cup of coffee" }
      colExpense: { uk: "Витрата", en: "Expense" }
      colAmount: { uk: "Сума, грн", en: "Amount, UAH" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      add: { uk: "Додати витрату", en: "Add expense" }
    title:
      uk: "Посилання, кнопка, картинка й таблиця"
      en: "A link, a button, a picture and a table"
    body:
      uk: |
        Запусти сторінку й знайди в коді кожен елемент. Довгий текст у `src` — це сама картинка, записана текстом: у пісочниці немає інтернету, тож зображення «живе» прямо в сторінці. На звичайному сайті там стояла б адреса файлу, наприклад `coffee.jpg`. Через це `alt` стоїть першим — його видно без прокручування.
      en: |
        Run the page and find every element in the code. The long text in `src` is the picture itself, written as text: the sandbox has no internet, so the image lives right inside the page. On a normal website there would be a file address instead, such as `coffee.jpg`. That is why `alt` comes first — you can see it without scrolling.
    tryIt:
      uk: |
        1. Клацни на сторінці й натискай Tab: фокус — рамка, що показує, з яким елементом зараз працює клавіатура, — перейде на посилання, потім на кнопку (у Safari на Mac натискай Option+Tab). Натисни Enter на посиланні — у консолі з’явиться повідомлення, що перехід заблоковано: пісочниця не дає піти зі сторінки, щоб не зупинити твою програму.
        2. Заміни `<button type="button">` на `<a>`, а `</button>` — на `</a>`, і запусти: тепер це текст без `href`, і Tab його пропускає. Поверни кнопку.
        3. Зітри в `src` слово `data:` і запусти: картинка не завантажиться, і замість неї браузер покаже текст з `alt`.
      en: |
        1. Click on the page and press Tab: the focus — the outline that shows which element the keyboard is working with — moves to the link, then to the button (in Safari on a Mac, press Option+Tab). Press Enter on the link — the console reports that following it was blocked: the sandbox does not let the page leave, so your program keeps running.
        2. Replace `<button type="button">` with `<a>` and `</button>` with `</a>`, then run: now it is text without `href`, and Tab skips it. Put the button back.
        3. Delete the word `data:` in `src` and run: the picture does not load, and the browser shows the `alt` text in its place.

  - id: expense-table
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: expense-table
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер витрат", en: "Expense tracker" }
      coffeeAlt: { uk: "Чашка кави", en: "A cup of coffee" }
      coffeeAltLong: { uk: "Коричнева чашка кави з парою", en: "A brown cup of steaming coffee" }
      colExpense: { uk: "Витрата", en: "Expense" }
      colAmount: { uk: "Сума, грн", en: "Amount, UAH" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      caption: { uk: "Розваги за тиждень", en: "Fun this week" }
    title:
      uk: "Таблиця витрат і картинка з описом"
      en: "An expense table and a described picture"
    instructions:
      uk: |
        На сторінці трекера витрат є картинка без опису, а таблиці ще немає.

        1. Додай картинці атрибут `alt`, який описує, **що на ній видно**. Пиши його одразу після `<img`, щоб не прокручувати довгий `src`.
        2. Під картинкою, на місці коментаря, створи таблицю: рядок заголовків `Витрата` і `Сума, грн`, а під ним два рядки витрат — `Кава з друзями` за `180` і `Квитки в кіно` за `300`.
      en: |
        The expense tracker page has a picture without a description, and no table yet.

        1. Give the picture an `alt` attribute that describes **what it shows**. Write it right after `<img`, so you do not have to scroll through the long `src`.
        2. Below the picture, in place of the comment, build a table: a header row `Expense` and `Amount, UAH`, and under it two expense rows — `Coffee with friends` for `180` and `Cinema tickets` for `300`.
    testTitles:
      "the image has a meaningful alt text":
        uk: "У картинки є змістовний alt"
        en: "The image has a meaningful alt text"
      "the first table row holds header cells":
        uk: "Перший рядок таблиці складається з клітинок-заголовків th"
        en: "The first table row holds header cells (th)"
      "the table has two rows of expenses":
        uk: "У таблиці два рядки витрат"
        en: "The table has two rows of expenses"
      "every expense row has a cell for each column":
        uk: "У кожному рядку витрати є заповнена клітинка для кожного стовпця"
        en: "Every expense row has a filled-in cell for each column"
    hints:
      nudge:
        uk: "Подивись на приклад таблиці в поясненні: з яких елементів складається рядок заголовків, а з яких — рядок даних?"
        en: "Look at the table example in the explanation: which elements make up the header row, and which make up a data row?"
      explanation:
        uk: "Кожен рядок — `<tr>…</tr>`. У першому рядку дві клітинки `<th>` з назвами стовпців, у наступних двох — по дві клітинки `<td>`: назва витрати й сума. Усе це — між `<table>` і `</table>`. Атрибут `alt` додай у тег `<img>`, наприклад: `<img alt=\"Чашка кави\" …>`."
        en: "Every row is `<tr>…</tr>`. The first row holds two `<th>` cells with the column names, the next two rows hold two `<td>` cells each: the expense name and the amount. All of it goes between `<table>` and `</table>`. Add the `alt` attribute inside the `<img>` tag, for example: `<img alt=\"A cup of coffee\" …>`."
    solutionNote:
      uk: "`alt` описує зміст картинки, тож людина, яка її не бачить, отримає ту саму інформацію. Перший рядок таблиці складається з `<th>` — це заголовки, які програма екранного читання називатиме разом із кожною клітинкою."
      en: "`alt` describes what the picture shows, so a person who cannot see it gets the same information. The first table row is made of `<th>` cells — headers that a screen reader names together with every cell."
    feedback:
      - when: { test: "the image has a meaningful alt text" }
        message:
          uk: "Опиши кількома словами, що видно на картинці, — наприклад, «Чашка кави». Назва файлу чи слово «картинка» людині, яка не бачить зображення, нічого не скажуть. Атрибут пишеться всередині тегу: `<img alt=\"…\" …>`."
          en: "Describe in a few words what the picture shows — for example, “A cup of coffee”. A file name or the word “picture” tells nothing to a person who cannot see the image. The attribute goes inside the tag: `<img alt=\"…\" …>`."
      - when: { test: "the first table row holds header cells" }
        message:
          uk: "Клітинки першого рядка мають бути `<th>`, а не `<td>` із жирним текстом: саме `<th>` каже браузеру й програмі екранного читання, що це заголовки стовпців."
          en: "The cells of the first row must be `<th>`, not `<td>` with bold text: it is `<th>` that tells the browser and screen readers that these are column headers."
      - when: { test: "the table has two rows of expenses" }
        message:
          uk: "Під рядком заголовків потрібні два рядки `<tr>` із клітинками `<td>` — по одному на кожну витрату. Перевір, що вони стоять між `<table>` і `</table>`."
          en: "Under the header row you need two `<tr>` rows with `<td>` cells — one per expense. Check that they stand between `<table>` and `</table>`."
      - when: { test: "every expense row has a cell for each column" }
        message:
          uk: "У кожному рядку має бути стільки клітинок, скільки стовпців у заголовку, і в кожній — текст: назва витрати й сума."
          en: "Every row needs as many cells as there are columns in the header, each with text in it: the expense name and the amount."

  - id: to-project
    kind: transfer
    capstoneStep: JS-01
    body:
      uk: "На стартову сторінку проєкту ти додаси зображення — йому теж знадобиться змістовний `alt`. А коли згодом з’являться «Додати» чи «Видалити», ти вже знатимеш: дія — це кнопка, перехід — посилання."
      en: "You will add an image to your project’s starter page — it needs a meaningful `alt` too. And when “Add” or “Delete” appear later, you will already know: an action is a button, going somewhere is a link."
