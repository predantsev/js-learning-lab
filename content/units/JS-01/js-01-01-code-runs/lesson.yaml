id: js-01-01-code-runs
unit: JS-01
title:
  uk: "Що робить програма: запусти, зміни, подивись"
  en: "What a program does: run, change, see"
kind: instructional
minutes: 8
contentVersion: 1
objectives:
  - uk: "Запустити готову програму й знайти її результат у консолі."
    en: "Run a prepared program and find its output in the console."
  - uk: "Змінити значення в програмі й передбачити, як зміниться результат."
    en: "Change a value in the program and predict how the output changes."
prerequisites: []
subskills: []
glossary: [program, console, run]
selfCheck: [order, own-line]

blocks:
  - id: instructions
    kind: explanation
    title:
      uk: "Програма — це інструкції"
      en: "A program is instructions"
    body:
      uk: |
        [[program|Програма]] — це текст з інструкціями для комп’ютера. Комп’ютер виконує їх **по черзі, згори донизу**, і робить рівно те, що написано.

        Ось програма з однієї інструкції:

        ```js
        console.log("Привіт, світе!");
        ```

        `console.log(...)` означає «покажи те, що в дужках». Результат з’являється в [[console|консолі]] — панелі, куди програма виводить текст.

        Поки програму не [[run|запущено]], це просто текст. Запустімо її.
      en: |
        A [[program]] is text with instructions for the computer. The computer carries them out **one after another, top to bottom**, and does exactly what is written.

        Here is a program with a single instruction:

        ```js
        console.log("Hello, world!");
        ```

        `console.log(...)` means “show what is inside the brackets”. The result appears in the [[console]] — the panel where a program prints text.

        Until a program is [[run]], it is just text. Let’s run it.

  - id: first-run
    kind: example
    runtime: browser-js
    dir: first-run
    entry: index.js
    strings:
      hello: { uk: "Привіт, світе!", en: "Hello, world!" }
    title:
      uk: "Запусти першу програму"
      en: "Run your first program"
    body:
      uk: |
        Праворуч — редактор із програмою з двох інструкцій. Натисни **Запустити** під редактором і подивись на вкладку **Консоль**: там з’являться два рядки.
      en: |
        On the right is the editor with a program of two instructions. Press **Run** under the editor and look at the **Console** tab: two lines appear there.
    tryIt:
      uk: "Заміни `3` на інше число й запусти ще раз. Потім зміни текст у лапках. Консоль щоразу показує те, що ти написав зараз."
      en: "Replace `3` with another number and run again. Then change the text inside the quotes. The console always shows what you wrote just now."

  - id: order
    kind: prediction
    strings:
      one: { uk: "раз", en: "one" }
      two: { uk: "два", en: "two" }
    prompt:
      uk: "Не запускаючи код, вирішуй: що з’явиться в консолі?"
      en: "Without running the code, decide: what appears in the console?"
    code: |
      console.log("%%one%%");
      console.log("%%two%%");
      console.log(10 + 5);
    verify:
      logs: ["%%one%%", "%%two%%", "15"]
    answer:
      type: choice
      options:
        - id: in-order
          text:
            uk: "Три рядки по черзі: «раз», «два», `15`"
            en: "Three lines in order: “one”, “two”, `15`"
        - id: math-first
          text:
            uk: "Спочатку `15`, потім «раз» і «два»"
            en: "First `15`, then “one” and “two”"
          why:
            uk: "Обчислення не «перестрибують» уперед: третя інструкція виконується третьою."
            en: "Calculations do not jump ahead: the third instruction runs third."
        - id: not-computed
          text:
            uk: "«раз», «два», `10 + 5`"
            en: "“one”, “two”, `10 + 5`"
          why:
            uk: "Без лапок `10 + 5` — це обчислення: JavaScript спершу рахує, потім показує результат."
            en: "Without quotes, `10 + 5` is a calculation: JavaScript computes first, then shows the result."
        - id: last-only
          text:
            uk: "Лише останній рядок: `15`"
            en: "Only the last line: `15`"
          why:
            uk: "Кожен `console.log` додає в консоль новий рядок; попередні не зникають."
            en: "Every `console.log` adds a new line to the console; earlier lines stay."
      correct: [in-order]
    explanation:
      uk: "Комп’ютер виконує інструкції по черзі, згори донизу. Третя інструкція містить обчислення `10 + 5`: JavaScript спершу отримує результат `15`, а тоді виводить його."
      en: "The computer carries out instructions in order, top to bottom. The third instruction contains the calculation `10 + 5`: JavaScript first gets the result `15` and then prints it."

  - id: literal
    kind: explanation
    title:
      uk: "Комп’ютер не здогадується"
      en: "The computer does not guess"
    body:
      uk: |
        Людина зрозуміє тебе навіть з помилкою. Комп’ютер — ні: він виконує **те, що написано**, а не те, що ти мав на увазі.

        Порівняй дві інструкції:

        ```js
        console.log(2 + 3);   // 5
        console.log("2 + 3"); // 2 + 3
        ```

        Різниця — лише лапки. У лапках — текст, який показується як є. Без лапок — обчислення. Дрібниця в коді змінює результат, тому програмісти постійно роблять одне й те саме: **запускають, дивляться, змінюють**.
      en: |
        A person understands you even when you make a mistake. A computer does not: it does **what is written**, not what you meant.

        Compare two instructions:

        ```js
        console.log(2 + 3);   // 5
        console.log("2 + 3"); // 2 + 3
        ```

        The only difference is the quotes. Inside quotes is text, shown as it is. Without quotes it is a calculation. A small detail in code changes the result, so programmers keep doing the same thing: **run, look, change**.

  - id: own-line
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: own-line
    entry: index.js
    strings:
      mine: { uk: "Я вчуся програмувати", en: "I am learning to program" }
    title:
      uk: "Напиши власний рядок"
      en: "Write your own line"
    instructions:
      uk: |
        Допиши в редакторі одну інструкцію, яка виводить у консоль **твій власний текст** — ім’я, улюблене слово, що завгодно.

        Натисни **Запустити**, щоб побачити результат, і **Перевірити**, коли будеш готовий.
      en: |
        Add one instruction in the editor that prints **your own text** to the console — your name, a favourite word, anything.

        Press **Run** to see the result and **Check** when you are ready.
    testTitles:
      "prints something":
        uk: "Програма щось виводить у консоль"
        en: "The program prints something to the console"
      "prints your own text":
        uk: "Перше, що виводить програма, — текст"
        en: "The first thing the program prints is text"
    hints:
      nudge:
        uk: "Подивись на перший приклад уроку: з чого починається інструкція, яка щось показує?"
        en: "Look at the first example of the lesson: how does an instruction that shows something begin?"
      explanation:
        uk: "Напиши `console.log(...)`, а в дужках постав свій текст **у лапках**. Рядок, що починається з `//`, — коментар для людей: комп’ютер його пропускає, тому свою інструкцію пиши з нового рядка."
        en: "Write `console.log(...)` and put your text **in quotes** inside the brackets. A line that starts with `//` is a comment for people: the computer skips it, so write your instruction on a new line."
    solutionNote:
      uk: "Підійде будь-який текст у лапках. `console.log` виводить те, що стоїть у дужках; лапки кажуть JavaScript, що це текст, а не обчислення."
      en: "Any text in quotes works. `console.log` prints what is inside the brackets; the quotes tell JavaScript that it is text, not a calculation."
    feedback:
      - when: { test: "prints something" }
        message:
          uk: "Консоль порожня. Перевір, що в коді є `console.log(...)` і що рядок не починається з `//` — коментарі комп’ютер пропускає."
          en: "The console is empty. Check that the code has `console.log(...)` and that the line does not start with `//` — the computer skips comments."
      - when: { test: "prints your own text" }
        message:
          uk: "Програма щось виводить, але перше значення — не текст. Постав свої слова в лапки: `console.log(\"...\")`."
          en: "The program prints something, but the first value is not text. Put your words in quotes: `console.log(\"...\")`."
      - when: { error: ReferenceError }
        message:
          uk: "Схоже, текст написано без лапок. Слово без лапок JavaScript вважає назвою, якої він не знає. Візьми текст у лапки."
          en: "It looks like the text has no quotes. JavaScript treats a word without quotes as a name it does not know. Put the text in quotes."

  - id: to-project
    kind: transfer
    capstoneStep: JS-01
    body:
      uk: "Наприкінці розділу ти відкриєш стартову сторінку свого проєкту й зробиш із нею те саме: запустиш, зміниш, подивишся на результат."
      en: "At the end of this unit you will open the starter page of your project and do the same with it: run it, change it, look at the result."
