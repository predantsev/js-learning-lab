id: js-01-08-css-selectors-text
unit: JS-01
title:
  uk: "Оформлюємо текст селекторами"
  en: "Styling text with selectors"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Записати CSS-правило як селектор і оголошення та вибрати елементи за тегом, класом і id."
    en: "Write a CSS rule as selector + declarations and target elements by tag, class and id."
  - uk: "Змінити колір, розмір і вирівнювання тексту й пояснити, яке правило перемогло."
    en: "Change color, font size and alignment of text and explain which rule won."
prerequisites: [js-01-07-links-buttons-images-tables]
subskills: []
glossary: [selector, css-rule, css-class, declaration]
selfCheck: [which-green, style-habits]

blocks:
  - id: css-rule
    kind: explanation
    title:
      uk: "CSS: як виглядає сторінка"
      en: "CSS: how the page looks"
    body:
      uk: |
        HTML каже, **що** є на сторінці; CSS — **як** воно виглядає. Стилі зазвичай живуть в окремому файлі `styles.css`, який сторінка підключає в `<head>`:

        ```html
        <link rel="stylesheet" href="styles.css">
        ```

        Файл стилів складається з [[css-rule|правил]]:

        ```css
        h1 {
          color: teal;
          text-align: center;
        }
        ```

        - `h1` — [[selector|селектор]]: **які** елементи стилізувати. Тут — усі `<h1>` на сторінці, скільки б їх не було.
        - У фігурних дужках — [[declaration|оголошення]] у форматі `властивість: значення;`. Крапка з комою відділяє одне оголошення від наступного; якщо її забути, браузер відкине обидва.

        Для тексту знадобляться `color` (колір), `font-size` (розмір, наприклад `24px`), `text-align` (вирівнювання: `left`, `center`, `right`) і `font-weight: bold` (жирний).
      en: |
        HTML says **what** is on the page; CSS says **how** it looks. Styles usually live in a separate file, `styles.css`, which the page connects in its `<head>`:

        ```html
        <link rel="stylesheet" href="styles.css">
        ```

        A stylesheet is made of [[css-rule|rules]]:

        ```css
        h1 {
          color: teal;
          text-align: center;
        }
        ```

        - `h1` is the [[selector]]: **which** elements to style. Here — every `<h1>` on the page, however many there are.
        - Inside the curly braces are [[declaration|declarations]] written as `property: value;`. A semicolon separates one declaration from the next; forget it, and the browser drops both.

        For text you will need `color`, `font-size` (for example `24px`), `text-align` (`left`, `center`, `right`) and `font-weight: bold`.

  - id: three-selectors
    kind: explanation
    title:
      uk: "Тег, клас, id"
      en: "Tag, class, id"
    body:
      uk: |
        Селектори розрізняються тим, що вони вибирають:

        | Селектор | Що вибирає | Який HTML він знайде |
        |---|---|---|
        | `p` | усі абзаци | `<p>…</p>` |
        | `.done` | усі елементи з класом `done` | `<p class="done">`, `<h2 class="done">` |
        | `#title` | один елемент з `id="title"` | `<h1 id="title">` |

        [[css-class|Клас]] — це назва, яку ти даєш елементам атрибутом `class`. Його можуть мати **багато** елементів, і одне правило `.done { … }` змінить їх усі одразу. А `id` на сторінці унікальний: він лише в одного елемента.

        Якщо два правила задають ту саму властивість одному елементу, перемагає **точніший** селектор: id точніший за клас, клас — за тег. Коли селектори однаково точні, перемагає правило, записане **нижче**.
      en: |
        Selectors differ in what they select:

        | Selector | What it selects | HTML it finds |
        |---|---|---|
        | `p` | all paragraphs | `<p>…</p>` |
        | `.done` | all elements with the class `done` | `<p class="done">`, `<h2 class="done">` |
        | `#title` | the one element with `id="title"` | `<h1 id="title">` |

        A [[css-class|class]] is a name you give to elements with the `class` attribute. **Many** elements can share it, and one rule, `.done { … }`, changes them all at once. An `id`, by contrast, is unique on the page: only one element has it.

        If two rules set the same property on one element, the **more specific** selector wins: an id is more specific than a class, a class more specific than a tag. When the selectors are equally specific, the rule written **lower** wins.

  - id: which-green
    kind: prediction
    prompt:
      uk: |
        Ось сторінка планувальника і її стилі:

        ```html
        <h1>Планувальник</h1>
        <p>Полити квіти</p>
        <p class="done">Оплатити інтернет</p>
        <p class="done">Розібрати шафу</p>
        <h2 class="done">Готово за тиждень</h2>
        ```

        ```css
        p { color: gray; }
        .done { color: green; }
        ```

        Які елементи стануть **зеленими**? Познач усі.
      en: |
        Here is a planner page and its styles:

        ```html
        <h1>Planner</h1>
        <p>Water the plants</p>
        <p class="done">Pay the internet bill</p>
        <p class="done">Tidy the wardrobe</p>
        <h2 class="done">Done this week</h2>
        ```

        ```css
        p { color: gray; }
        .done { color: green; }
        ```

        Which elements turn **green**? Mark all of them.
    answer:
      type: multi
      options:
        - id: title
          text:
            uk: "Заголовок «Планувальник»"
            en: "The heading “Planner”"
          why:
            uk: "У нього немає класу `done`, і він не абзац — жодне з двох правил його не стосується."
            en: "It has no `done` class and it is not a paragraph — neither rule applies to it."
        - id: plants
          text:
            uk: "«Полити квіти»"
            en: "“Water the plants”"
          why:
            uk: "Це абзац без класу: до нього застосовується лише `p { color: gray; }`, тож він сірий."
            en: "It is a paragraph without a class: only `p { color: gray; }` applies, so it is gray."
        - id: internet
          text:
            uk: "«Оплатити інтернет»"
            en: "“Pay the internet bill”"
        - id: wardrobe
          text:
            uk: "«Розібрати шафу»"
            en: "“Tidy the wardrobe”"
        - id: week
          text:
            uk: "Заголовок «Готово за тиждень»"
            en: "The heading “Done this week”"
      correct: [internet, wardrobe, week]
    explanation:
      uk: "Правило `.done` знаходить **кожен** елемент із класом `done` — і обидва абзаци, і заголовок. Абзаци з класом отримують два правила одночасно (`p` і `.done`), але клас точніший за тег, тож перемагає зелений. «Полити квіти» класу не має — він сірий, а `<h1>` жодне правило не зачіпає."
      en: "The `.done` rule finds **every** element with the class `done` — both paragraphs and the heading. The paragraphs with the class get two rules at once (`p` and `.done`), but a class is more specific than a tag, so green wins. “Water the plants” has no class — it is gray, and no rule touches the `<h1>`."

  - id: planner-style
    kind: example
    runtime: browser-js
    dir: planner-style
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Планувальник", en: "Planner" }
      task1: { uk: "Полити квіти", en: "Water the plants" }
      task2: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      task3: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
      task4: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
    title:
      uk: "Стилі планувальника"
      en: "Styling the planner"
    body:
      uk: |
        Сторінка має два файли — `index.html` і `styles.css`; перемикайся між ними над редактором. Запусти й знайди, яке правило дало кожному рядку його вигляд. Виконані справи мають клас `done`, а важлива справа — клас `high`.
      en: |
        The page has two files — `index.html` and `styles.css`; switch between them above the editor. Run it and find which rule gave each line its look. Finished tasks have the class `done`, and the important task has the class `high`.
    tryIt:
      uk: "1) У `styles.css` зміни колір `h1` на `purple` і запусти. 2) Заміни селектор `.done` на `p`: посіріють **усі** абзаци — крім важливого, бо клас `.high` точніший за тег. Поверни `.done`. 3) Допиши правило `#page-title { font-size: 40px; }` — воно діє лише на один елемент."
      en: "1) In `styles.css`, change the color of `h1` to `purple` and run. 2) Replace the selector `.done` with `p`: **all** paragraphs turn gray — except the important one, because the class `.high` is more specific than a tag. Put `.done` back. 3) Add the rule `#page-title { font-size: 40px; }` — it affects only one element."

  - id: style-habits
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: style-habits
    entry: index.html
    editable: [styles.css]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер звичок", en: "Habit tracker" }
      habit1: { uk: "Ранкова зарядка", en: "Morning exercise" }
      habit2: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      days: { uk: "дні поспіль", en: "days in a row" }
    title:
      uk: "Виділи серію звички"
      en: "Highlight a habit streak"
    instructions:
      uk: |
        На сторінці трекера звичок одне значення позначено класом: `<span class="highlight">3</span>`. HTML уже готовий — пиши лише у файлі `styles.css` (рядки між `/*` і `*/` — коментарі).

        1. Правило для **тегу** `h1`: вирівняй заголовок по центру й дай йому колір.
        2. Правило для **класу** `highlight`: виділи значення — кольором, жирністю або тлом (`background`).

        Друге число на сторінці виділятися не повинно.
      en: |
        On the habit tracker page one value is marked with a class: `<span class="highlight">3</span>`. The HTML is ready — write only in `styles.css` (lines between `/*` and `*/` are comments).

        1. A rule for the **tag** `h1`: center the heading and give it a color.
        2. A rule for the **class** `highlight`: make the value stand out — with a color, bold text or a background (`background`).

        The second number on the page must not stand out.
    testTitles:
      "the heading is centered":
        uk: "Заголовок вирівняно по центру"
        en: "The heading is centered"
      "the heading has its own color":
        uk: "Заголовок має власний колір"
        en: "The heading has its own color"
      "the highlighted value stands out":
        uk: "Значення з класом highlight виділяється"
        en: "The value with the highlight class stands out"
      "the other value stays plain":
        uk: "Друге значення залишилося звичайним"
        en: "The other value stays plain"
    hints:
      nudge:
        uk: "Тобі потрібні два правила: одне з селектором тегу, друге — з селектором класу. Як записується кожен із них?"
        en: "You need two rules: one with a tag selector, the other with a class selector. How is each of them written?"
      explanation:
        uk: "Правило — це селектор і фігурні дужки з оголошеннями: `h1 { text-align: center; color: teal; }`. Селектор класу — це крапка й назва класу: `.highlight { … }`. Кожне оголошення закінчуй крапкою з комою."
        en: "A rule is a selector plus curly braces with declarations: `h1 { text-align: center; color: teal; }`. A class selector is a dot followed by the class name: `.highlight { … }`. End every declaration with a semicolon."
    solutionNote:
      uk: "Правило `h1` стосується всіх заголовків першого рівня, а `.highlight` — лише елементів із цим класом, тому друге число лишилося звичайним. Якби селектором був тег `span`, змінилися б обидва числа."
      en: "The `h1` rule applies to every first-level heading, while `.highlight` applies only to elements with that class, so the second number stays plain. With the tag `span` as the selector, both numbers would change."
    feedback:
      - when: { test: "the heading is centered" }
        message:
          uk: "Додай у правило для `h1` оголошення `text-align: center;`. Перевір, що між оголошеннями стоять крапки з комою: без них браузер відкидає оголошення."
          en: "Add the declaration `text-align: center;` to the `h1` rule. Check that semicolons separate the declarations: without them the browser drops the declarations."
      - when: { test: "the heading has its own color" }
        message:
          uk: "Дай заголовку колір, відмінний від звичайного тексту, наприклад `color: teal;`."
          en: "Give the heading a color different from normal text, for example `color: teal;`."
      - when: { test: "the highlighted value stands out" }
        message:
          uk: "Селектор класу починається з крапки: `.highlight`. Без крапки браузер шукає тег `<highlight>`, а такого на сторінці немає."
          en: "A class selector starts with a dot: `.highlight`. Without the dot, the browser looks for a `<highlight>` tag, and the page has none."
      - when: { test: "the other value stays plain" }
        message:
          uk: "Змінилися обидва числа: селектор тегу `span` вибирає **всі** `<span>`. Щоб виділити лише одне, використай клас: `.highlight`."
          en: "Both numbers changed: the tag selector `span` selects **every** `<span>`. To highlight only one, use the class: `.highlight`."

  - id: recall
    kind: review
    title:
      uk: "Згадай JavaScript"
      en: "Recall JavaScript"
    strings:
      label: { uk: "Днів поспіль: ", en: "Days in a row: " }
    items:
      - id: label-glue
        from: js-01-03-arithmetic-precedence
        prompt:
          uk: "Що виведе цей рядок?"
          en: "What does this line print?"
        code: |
          console.log("%%label%%" + 1 + 2);
        verify:
          logs: ["%%label%%12"]
        answer:
          type: choice
          options:
            - id: added
              text:
                uk: "`Днів поспіль: 3`"
                en: "`Days in a row: 3`"
              why:
                uk: "Підпис-рядок стоїть першим, а однакові `+` виконуються зліва направо: спершу текст і `1`, потім текст і `2`. Щоб числа додалися, візьми їх у дужки."
                en: "The label string comes first, and equal `+` run from left to right: first the text and `1`, then the text and `2`. To add the numbers, put them in parentheses."
            - id: glued
              text:
                uk: "`Днів поспіль: 12`"
                en: "`Days in a row: 12`"
            - id: error
              text:
                uk: "Помилку: текст і числа не можна поєднувати"
                en: "An error: text and numbers cannot be combined"
              why:
                uk: "Можна: з рядком `+` склеює."
                en: "They can: with a string, `+` joins."
          correct: [glued]
        explanation:
          uk: "Однакові оператори виконуються зліва направо, а щойно ліворуч текст, `+` склеює. `\"Днів поспіль: \" + (1 + 2)` дало б `Днів поспіль: 3`."
          en: "Equal operators run from left to right, and as soon as there is text on the left, `+` joins. `\"Days in a row: \" + (1 + 2)` would give `Days in a row: 3`."
      - id: empty-on-purpose
        from: js-01-04-booleans-null-undefined
        prompt:
          uk: "Звичку «Прогулянка» ще жодного разу не виконано, і ти навмисно записуєш, що дати останнього виконання немає. Яке значення підходить?"
          en: "The habit “Go for a walk” has never been done yet, and you deliberately record that there is no last completion date. Which value fits?"
        answer:
          type: choice
          options:
            - id: null-value
              code: "null"
            - id: undefined-value
              code: "undefined"
              why:
                uk: "`undefined` означає «ще не задано» — його дає сам JavaScript. Навмисну порожнечу позначають `null`."
                en: "`undefined` means “not set yet” — JavaScript produces it by itself. Deliberate emptiness is marked with `null`."
            - id: null-text
              code: "\"null\""
              why:
                uk: "У лапках це текст із чотирьох літер, а не порожнє значення."
                en: "In quotes it is a text of four letters, not an empty value."
            - id: zero
              code: "0"
              why:
                uk: "`0` — справжнє число, а не «нічого»."
                en: "`0` is a real number, not “nothing”."
          correct: [null-value]
        explanation:
          uk: "Коли значення немає навмисно, програміст пише `null`. `undefined` з’являється сам, коли значення ще не задали."
          en: "When there is deliberately no value, the programmer writes `null`. `undefined` appears by itself when a value has not been set yet."

  - id: to-project
    kind: transfer
    capstoneStep: JS-01
    body:
      uk: "Стилі твого проєкту працюватимуть так само: одне правило для всіх заголовків, клас — для особливих значень, як-от ціна, сума чи серія днів."
      en: "Your project’s styles will work the same way: one rule for all headings, a class for special values such as a price, an amount or a streak of days."
