id: js-01-03-arithmetic-precedence
unit: JS-01
title:
  uk: "Арифметика й порядок дій"
  en: "Arithmetic and precedence"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Обчислювати вирази з додаванням, відніманням, множенням, діленням, остачею і дужками в тому самому порядку, що й JavaScript."
    en: "Evaluate expressions with addition, subtraction, multiplication, division, remainder and parentheses in the same order JavaScript does."
  - uk: "Пояснити, чому \"1\" + 2 дає \"12\", а 1 + 2 дає 3."
    en: "Explain why \"1\" + 2 gives \"12\" while 1 + 2 gives 3."
prerequisites: [js-01-02-numbers-and-text]
subskills:
  - { family: J-01, skill: "arithmetic/logical/assignment/ternary precedence", depth: intro }
glossary: [expression, operator, precedence]
selfCheck: [predict-order, wish-total]

blocks:
  - id: operators
    kind: explanation
    title:
      uk: "Вирази й оператори"
      en: "Expressions and operators"
    body:
      uk: |
        [[expression|Вираз]] — це шматок коду, який JavaScript обчислює до одного значення. `80 + 45` — вираз, його значення `125`. Знаки дій називають [[operator|операторами]]:

        | Оператор | Дія | Приклад | Результат |
        |---|---|---|---|
        | `+` | додати | `80 + 45` | `125` |
        | `-` | відняти | `240 - 80` | `160` |
        | `*` | помножити | `18 * 3` | `54` |
        | `/` | поділити | `45 / 2` | `22.5` |
        | `%` | остача від ділення | `7 % 3` | `1` |

        Множать зірочкою `*`, а не `×` чи `x`; ділять скісною рискою `/`, а не `:` чи `÷`.

        `%` — **не відсотки**. `7 % 3` питає: «що залишиться, якщо розкласти 7 на трійки?» Дві трійки — це 6, залишається `1`.
      en: |
        An [[expression]] is a piece of code that JavaScript evaluates to one value. `80 + 45` is an expression; its value is `125`. The signs for the operations are called [[operator|operators]]:

        | Operator | Action | Example | Result |
        |---|---|---|---|
        | `+` | add | `80 + 45` | `125` |
        | `-` | subtract | `240 - 80` | `160` |
        | `*` | multiply | `18 * 3` | `54` |
        | `/` | divide | `45 / 2` | `22.5` |
        | `%` | remainder | `7 % 3` | `1` |

        You multiply with an asterisk `*`, not `×` or `x`; you divide with a slash `/`, not `:` or `÷`.

        `%` is **not percent**. `7 % 3` asks: “what is left over when 7 is split into threes?” Two threes make 6, so `1` is left.

  - id: predict-order
    kind: prediction
    prompt:
      uk: "Що виведе ця програма? Виріши, перш ніж запускати."
      en: "What does this program print? Decide before running it."
    code: |
      console.log(2 + 3 * 4);
      console.log((2 + 3) * 4);
      console.log(7 % 3);
      console.log("1" + 2);
    verify:
      logs: ["14", "20", "1", "12"]
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "`14`, `20`, `1`, `12`"
            en: "`14`, `20`, `1`, `12`"
        - id: left-to-right
          text:
            uk: "`20`, `20`, `1`, `12`"
            en: "`20`, `20`, `1`, `12`"
          why:
            uk: "JavaScript не рахує строго зліва направо. Множення виконується раніше за додавання, навіть якщо записане пізніше: `2 + 3 * 4` — це `2 + 12`."
            en: "JavaScript does not compute strictly left to right. Multiplication happens before addition even when it is written later: `2 + 3 * 4` is `2 + 12`."
        - id: percent
          text:
            uk: "`14`, `20`, `0.07`, `12`"
            en: "`14`, `20`, `0.07`, `12`"
          why:
            uk: "`%` — не відсотки, а остача від ділення: 7 = 3 · 2 + **1**."
            en: "`%` is not percent but the remainder of a division: 7 = 3 · 2 + **1**."
        - id: added
          text:
            uk: "`14`, `20`, `1`, `3`"
            en: "`14`, `20`, `1`, `3`"
          why:
            uk: "`\"1\"` у лапках — рядок. Коли з одного боку `+` стоїть текст, JavaScript перетворює число на текст і склеює: `\"1\" + 2` дає `\"12\"`."
            en: "`\"1\"` in quotes is a string. When text stands on one side of `+`, JavaScript turns the number into text and joins: `\"1\" + 2` gives `\"12\"`."
      correct: [right]
    explanation:
      uk: "Як у математиці: спершу `*`, `/` і `%`, потім `+` і `-`, а дужки — найперше. `7 % 3` — це остача, `1`. А `\"1\" + 2` — зовсім не додавання: з одного боку рядок, тож `+` склеює, і виходить текст `\"12\"`."
      en: "As in math: first `*`, `/` and `%`, then `+` and `-`, and parentheses before everything. `7 % 3` is the remainder, `1`. And `\"1\" + 2` is not addition at all: one side is a string, so `+` joins, and the result is the text `\"12\"`."

  - id: rules
    kind: explanation
    title:
      uk: "Порядок дій"
      en: "The order of operations"
    body:
      uk: |
        [[precedence|Пріоритет операторів]] — це правила, за якими JavaScript вирішує, що рахувати першим:

        1. Спершу — вираз у **дужках**.
        2. Потім `*`, `/` і `%`.
        3. Потім `+` і `-`.
        4. Оператори **одного рівня** виконуються **зліва направо**.

        Окремо про `+`: якщо хоча б з одного боку стоїть рядок, `+` не додає, а склеює. Тому порядок особливо важливий, коли ти приклеюєш підпис до обчислення: `"Разом: " + 80 + 45` дає `Разом: 8045`, а `"Разом: " + (80 + 45)` дає `Разом: 125`. Чому так — покаже покрокова візуалізація нижче.
      en: |
        [[precedence|Operator precedence]] is the set of rules JavaScript uses to decide what to compute first:

        1. First, an expression in **parentheses**.
        2. Then `*`, `/` and `%`.
        3. Then `+` and `-`.
        4. Operators of the **same level** run **from left to right**.

        A special note about `+`: if a string stands on at least one side, `+` does not add, it joins. That is why the order matters so much when you attach a label to a calculation: `"Total: " + 80 + 45` gives `Total: 8045`, while `"Total: " + (80 + 45)` gives `Total: 125`. The step-by-step visual below shows why.

  - id: step-by-step
    kind: visual
    visual: code-trace
    title:
      uk: "Крок за кроком: що JavaScript обчислює першим"
      en: "Step by step: what JavaScript computes first"
    textEquivalent:
      uk: >-
        Програма розкладає два вирази на окремі кроки, і кожен крок друкує своє проміжне значення.
        Спершу 3 * 4 дає 12, потім 2 + 12 дає 14; весь вираз 2 + 3 * 4 теж дає 14, бо JavaScript сам
        виконує множення раніше за додавання. Далі "1" + 2 дає текст "12": з одного боку плюса рядок,
        тому число стає текстом і склеюється. "12" + 3 дає текст "123", і весь вираз "1" + 2 + 3 теж
        дає "123": однакові плюси виконуються зліва направо, а текст ліворуч перетворює кожне наступне
        склеювання на текстове. Нарешті "1" + (2 + 3) дає "15": дужки змушують спершу додати 2 і 3, а
        вже потім приклеїти 5 до рядка.
      en: >-
        The program breaks two expressions into separate steps, and each step prints its intermediate
        value. First 3 * 4 gives 12, then 2 + 12 gives 14; the whole expression 2 + 3 * 4 also gives 14,
        because JavaScript itself multiplies before it adds. Next, "1" + 2 gives the text "12": a string
        stands on one side of the plus, so the number becomes text and is joined. "12" + 3 gives the text
        "123", and the whole expression "1" + 2 + 3 also gives "123": equal pluses run from left to right,
        and the text on the left turns every following join into a text join. Finally, "1" + (2 + 3)
        gives "15": the parentheses make JavaScript add 2 and 3 first and only then attach 5 to the string.
    spec:
      code: |
        console.log(3 * 4);
        console.log(2 + 12);
        console.log(2 + 3 * 4);
        console.log("1" + 2);
        console.log("12" + 3);
        console.log("1" + 2 + 3);
        console.log("1" + (2 + 3));
      captions:
        - at: { line: 1 }
          text:
            uk: "Розберемо `2 + 3 * 4` по кроках. У множення пріоритет вищий, тож перший крок — `3 * 4`. Кожен рядок друкує в консоль своє проміжне значення. Стежи за кодом і консоллю; решта панелей знадобиться в наступних розділах."
            en: "Let’s take `2 + 3 * 4` apart step by step. Multiplication has higher precedence, so the first step is `3 * 4`. Every line prints its intermediate value to the console. Watch the code and the console; the other panels will matter in later units."
        - at: { line: 2 }
          text:
            uk: "У консолі — `12`. Тепер друга дія, додавання: `2 + 12`."
            en: "The console shows `12`. Now the second operation, addition: `2 + 12`."
        - at: { line: 3 }
          text:
            uk: "Вийшло `14`. А тепер увесь вираз одним рядком: JavaScript сам виконає ті самі два кроки в тому самому порядку."
            en: "The result is `14`. Now the whole expression on one line: JavaScript performs the same two steps in the same order by itself."
        - at: { line: 4 }
          text:
            uk: "Знову `14`. Тепер текст: `\"1\" + 2`. З одного боку `+` стоїть рядок, тож число `2` стане текстом і приклеїться."
            en: "`14` again. Now some text: `\"1\" + 2`. A string stands on one side of `+`, so the number `2` becomes text and gets attached."
        - at: { line: 5 }
          text:
            uk: "У консолі `12` — але це текст «один-два», а не число дванадцять. Склеюємо далі: `\"12\" + 3`."
            en: "The console shows `12` — but it is the text “one-two”, not the number twelve. Joining on: `\"12\" + 3`."
        - at: { line: 6 }
          text:
            uk: "Текст `123`. Тепер усе разом: `\"1\" + 2 + 3`. Обидва `+` одного рівня, тому виконуються зліва направо: спершу `\"1\" + 2`."
            en: "The text `123`. Now all at once: `\"1\" + 2 + 3`. Both `+` are on the same level, so they run from left to right: `\"1\" + 2` first."
        - at: { line: 7 }
          text:
            uk: "Знову `123`: числа так і не додалися, бо ліворуч від них стояв текст. Дужки змінюють порядок: спершу `2 + 3`."
            en: "`123` again: the numbers never got added, because text stood to their left. Parentheses change the order: `2 + 3` comes first."
        - at: { line: 7, kind: end }
          text:
            uk: "`\"1\" + 5` дає текст `15`. Підсумок: дужки — найперше, `*` раніше за `+`, однакові оператори — зліва направо, а `+` з рядком склеює."
            en: "`\"1\" + 5` gives the text `15`. To sum up: parentheses first, `*` before `+`, equal operators from left to right, and `+` with a string joins."

  - id: try-precedence
    kind: example
    runtime: browser-js
    dir: try-precedence
    entry: index.js
    strings:
      total: { uk: "Разом: ", en: "Total: " }
    title:
      uk: "Дужки змінюють результат"
      en: "Parentheses change the result"
    body:
      uk: |
        Запусти програму й перевір кожен рядок: чи збігається результат із тим, що ти порахував би сам? Перший рядок — ціна навушників за `80` і двох ламп по `45`. Другий — скільки лишиться з `240` після покупок за `80` і `45`. Третій — остача від ділення `10` на `3`. Четвертий мав би показати суму `80` і `45` з підписом — перевір, чи це так.
      en: |
        Run the program and check every line: does the result match what you would compute yourself? The first line is the price of headphones for `80` and two lamps at `45`. The second is what is left of `240` after buying things for `80` and `45`. The third is the remainder of `10` divided by `3`. The fourth is meant to show the sum of `80` and `45` with a label — check whether it does.
    tryIt:
      uk: |
        1. Постав дужки в першому рядку так, щоб вийшло `250` — ціна двох комплектів «навушники й лампа».
        2. Виправ останній рядок, щоб він виводив `Разом: 125`.
        3. Спробуй `%` з іншими числами: `10 % 2`, `9 % 2`, `8 % 2`. Коли остача дорівнює `0`?
      en: |
        1. Put parentheses into the first line so it gives `250` — the price of two sets of “headphones and a lamp”.
        2. Fix the last line so it prints `Total: 125`.
        3. Try `%` with other numbers: `10 % 2`, `9 % 2`, `8 % 2`. When is the remainder `0`?

  - id: wish-total
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: wish-total
    entry: index.js
    strings:
      total: { uk: "Разом:", en: "Total:" }
    title:
      uk: "Скільки коштують бажання"
      en: "What the wishes cost"
    instructions:
      uk: |
        Зі списку бажань ти купуєш навушники за `80`, настільну лампу за `45` і **три** термочашки по `18`.

        1. Першим рядком виведи загальну суму — **числом**. Запиши її одним виразом із цих чисел; рахувати подумки не треба, це зробить JavaScript.
        2. Другим рядком виведи ту саму суму з підписом попереду, наприклад `Разом: …`.
      en: |
        From your wishlist you buy headphones for `80`, a desk lamp for `45` and **three** travel mugs at `18` each.

        1. On the first line, print the total — as a **number**. Write it as one expression with these numbers; no mental math needed, JavaScript does that.
        2. On the second line, print the same total with a label in front, for example `Total: …`.
    testTitles:
      "prints the total as a number":
        uk: "Перший рядок — загальна сума числом"
        en: "The first line is the total as a number"
      "prints the total with a label":
        uk: "Другий рядок — та сама сума з підписом"
        en: "The second line is the same total with a label"
    hints:
      nudge:
        uk: "Скільки штук кожної речі ти купуєш? Яку ціну треба помножити на кількість, а яку — просто додати? І що JavaScript рахує першим: `*` чи `+`?"
        en: "How many of each thing do you buy? Which price must be multiplied by a quantity, and which is simply added? And what does JavaScript compute first: `*` or `+`?"
      explanation:
        uk: "Множення виконується раніше за додавання: у `5 + 2 * 10` спершу рахується `2 * 10`, і виходить `25`. Тож ціну, яку береш кілька разів, множ на кількість просто серед інших доданків — дужки для цього не потрібні. У другому рядку пам’ятай: щойно зліва від `+` з’являється текст, наступні числа склеюються з ним. Візьми обчислення в дужки — або відокрем підпис комою, як у `console.log(\"Разом:\", …)`."
        en: "Multiplication runs before addition: in `5 + 2 * 10`, `2 * 10` is computed first, giving `25`. So multiply the price you take several times by its quantity right among the other terms — no parentheses needed for that. On the second line remember: as soon as text stands to the left of `+`, the following numbers are joined to it. Put the calculation in parentheses — or separate the label with a comma, as in `console.log(\"Total:\", …)`."
    solutionNote:
      uk: "`18 * 3` виконується першим, тож `80 + 45 + 18 * 3` дорівнює `179`. У другому рядку дужки змушують JavaScript спершу порахувати суму, а вже потім приклеїти її до підпису. Варіант із комою теж працює: тоді підпис і число — два окремі значення для `console.log`."
      en: "`18 * 3` runs first, so `80 + 45 + 18 * 3` equals `179`. On the second line the parentheses make JavaScript compute the sum first and only then attach it to the label. The comma version works too: then the label and the number are two separate values for `console.log`."
    feedback:
      - when: { test: "prints the total as a number" }
        message:
          uk: "Перевір вираз: тричі ти купуєш лише термочашку, тож на `3` множиться тільки `18`. Якщо дужки охоплюють усі ціни, на `3` множиться все. І не бери суму в лапки — потрібне число."
          en: "Check the expression: only the mug is bought three times, so only `18` is multiplied by `3`. If the parentheses wrap all the prices, everything gets multiplied by `3`. And do not put the total in quotes — it has to be a number."
      - when: { test: "prints the total with a label" }
        message:
          uk: "Якщо бачиш довге число на зразок `804554`, числа склеїлися: підпис ліворуч перетворив їх на текст. Візьми обчислення в дужки — `\"Разом: \" + (…)` — або відокрем підпис комою: `console.log(\"Разом:\", …)`."
          en: "If you see a long number like `804554`, the numbers were joined as text: the label on the left turned them into strings. Put the calculation in parentheses — `\"Total: \" + (…)` — or separate the label with a comma: `console.log(\"Total:\", …)`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-01
    body:
      uk: "У проєкті ти рахуватимеш підсумки: суму бажань, витрати за день, кількість виконаних справ чи звичок. Дужки й порядок дій знадобляться там постійно — особливо коли підсумок стоїть поруч із підписом."
      en: "In your project you will compute totals: the sum of your wishes, a day’s expenses, the number of finished tasks or habits. Parentheses and the order of operations will come up there all the time — especially when a total stands next to a label."
