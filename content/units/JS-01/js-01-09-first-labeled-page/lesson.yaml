id: js-01-09-first-labeled-page
unit: JS-01
title:
  uk: "Самостійно: перша підписана сторінка"
  en: "Independent: your first labeled page"
kind: assessment
minutes: 15
contentVersion: 1
objectives:
  - uk: "Без підказок зібрати невелику сторінку із заголовком, двома підписаними значеннями, обчисленими виразами, і зображенням з alt."
    en: "Build, without hints, a small page with a heading, two labeled values computed from expressions and one image with alt text."
purpose:
  uk: "Перевірити, що ти сам поєднуєш усе з цього розділу: будову сторінки, зображення з описом, стиль через клас і обчислення в JavaScript із підписаним результатом. Підказок тут немає — лише перевірки, які показують, що вже працює."
  en: "Check that you can combine everything from this unit on your own: page structure, an image with a description, a style through a class and a JavaScript calculation with a labeled result. There are no hints here — only checks that show what already works."
prerequisites: [js-01-08-css-selectors-text]
subskills: []
glossary: []

blocks:
  - id: expense-summary
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: expense-summary
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер витрат", en: "Expense tracker" }
      receiptAlt: { uk: "Касовий чек", en: "A shop receipt" }
      note: { uk: "Суми за 1 березня, у гривнях.", en: "Amounts for March 1, in hryvnias." }
      totalLabel: { uk: "Разом, грн:", en: "Total, UAH:" }
      averageLabel: { uk: "У середньому, грн:", en: "Average, UAH:" }
      day: { uk: "1 березня", en: "March 1" }
    title:
      uk: "Сторінка витрат за день"
      en: "A page of one day’s expenses"
    instructions:
      uk: |
        Збери сторінку трекера витрат за 1 березня. Суми двох витрат збережено в **копійках** — так проєкт зберігає гроші, щоб не мати справи з дробами:

        | Витрата | Сума, коп. |
        |---|---|
        | Продукти на тиждень | `84550` |
        | Проїзний | `52000` |

        **Сторінка** — файли `index.html` і `styles.css`:

        1. Головна частина `<main>` з одним заголовком першого рівня — назвою сторінки.
        2. Усередині `<main>` — картинка зі стартового коду (чек) зі змістовним `alt`.
        3. Там само — короткий абзац-примітка з класом `note`, а в `styles.css` — правило для цього класу, щоб примітка відрізнялася від звичайного тексту.

        **Скрипт** — файл `index.js`. Його вже підключено рядком `<script type="module" src="index.js"></script>` у кінці сторінки, а все, що він виводить, з’являється на вкладці **Консоль**.

        4. Виведи загальну суму двох витрат **у гривнях** з підписом, наприклад `Разом, грн: …`.
        5. Виведи середню суму однієї витрати в гривнях, теж із підписом.

        Обидва числа обчисли виразами з копійок: в одній гривні 100 копійок.
      en: |
        Build an expense tracker page for March 1. The two amounts are stored in **kopiykas**, the hundredths of a hryvnia — the project keeps money this way to avoid fractions:

        | Expense | Amount, kopiykas |
        |---|---|
        | Weekly groceries | `84550` |
        | Transit pass | `52000` |

        **The page** — files `index.html` and `styles.css`:

        1. A main area, `<main>`, with one first-level heading — the page title.
        2. Inside `<main>`, the picture from the starter code (a receipt) with a meaningful `alt`.
        3. Also inside `<main>`, a short note paragraph with the class `note`, and in `styles.css` a rule for that class, so the note looks different from normal text.

        **The script** — file `index.js`. It is already connected by the line `<script type="module" src="index.js"></script>` at the end of the page, and whatever it prints appears in the **Console** tab.

        4. Print the total of the two expenses **in hryvnias** with a label, for example `Total, UAH: …`.
        5. Print the average amount of one expense in hryvnias, with a label too.

        Compute both numbers with expressions from the kopiykas: one hryvnia is 100 kopiykas.
    testTitles:
      "main has one first-level heading":
        uk: "Головна частина main має один заголовок першого рівня"
        en: "The main area has one first-level heading"
      "the image inside main has a meaningful alt text":
        uk: "Картинка всередині main має змістовний alt"
        en: "The image inside main has a meaningful alt text"
      "the note is styled through its class":
        uk: "Примітку з класом note оформлено через клас"
        en: "The note with the class note is styled through its class"
      "prints the total in hryvnias with a label":
        uk: "У консолі — підписана загальна сума в гривнях"
        en: "The console shows the labeled total in hryvnias"
      "prints the average in hryvnias with a label":
        uk: "У консолі — підписана середня сума в гривнях"
        en: "The console shows the labeled average in hryvnias"
    solutionNote:
      uk: "Дужки змушують спершу додати копійки: `(84550 + 52000) / 100` дає `1365.5`. Без них JavaScript спершу поділив би `52000` на 100. Для середнього суму ділять ще й на кількість витрат: `(84550 + 52000) / 2 / 100` дає `682.75`. Правило `.note` стосується лише примітки, бо вибирає клас, а не тег; а `<main>`, `<h1>` і `alt` роблять сторінку зрозумілою і без зору."
      en: "The parentheses make JavaScript add the kopiykas first: `(84550 + 52000) / 100` gives `1365.5`. Without them, JavaScript would first divide `52000` by 100. For the average, the sum is also divided by the number of expenses: `(84550 + 52000) / 2 / 100` gives `682.75`. The `.note` rule affects only the note because it selects a class, not a tag; and `<main>`, `<h1>` and `alt` make the page understandable without sight."
    feedback:
      - when: { test: "main has one first-level heading" }
        message:
          uk: "Перевір будову: усередині `<body>` має бути `<main>`, а в ньому — рівно один `<h1>`."
          en: "Check the structure: `<body>` must contain `<main>`, and `<main>` exactly one `<h1>`."
      - when: { test: "the image inside main has a meaningful alt text" }
        message:
          uk: "Картинка має лежати всередині `<main>`, а її `alt` — описувати, що на ній видно, а не назву файлу чи слово «картинка»."
          en: "The picture must sit inside `<main>`, and its `alt` must describe what it shows — not a file name or the word “picture”."
      - when: { test: "the note is styled through its class" }
        message:
          uk: "Потрібен елемент з атрибутом `class=\"note\"` і правило в `styles.css`, яке вибирає саме цей клас. Правило для тегу змінило б і звичайні елементи."
          en: "You need an element with `class=\"note\"` and a rule in `styles.css` that selects exactly that class. A rule for a tag would change ordinary elements too."
      - when: { test: "prints the total in hryvnias with a label" }
        message:
          uk: "Якщо в консолі число на зразок `85070` чи `136550`, перевір порядок дій і переведення в гривні: спершу додай копійки, потім поділи. Якщо бачиш склеєні цифри — підпис ліворуч перетворив числа на текст."
          en: "If the console shows a number like `85070` or `136550`, check the order of operations and the conversion to hryvnias: add the kopiykas first, then divide. If you see glued digits, the label on the left turned the numbers into text."
      - when: { test: "prints the average in hryvnias with a label" }
        message:
          uk: "Середнє — це сума, поділена на кількість витрат. Подумай, що JavaScript має обчислити першим."
          en: "The average is the sum divided by the number of expenses. Think about what JavaScript has to compute first."

  - id: to-project
    kind: transfer
    capstoneStep: JS-01
    body:
      uk: "Далі — твій проєкт. На його стартовій сторінці ти зробиш те саме для свого домену: зміниш заголовок, додаси підписане значення й зображення з `alt`."
      en: "Next comes your project. On its starter page you will do the same for your domain: change the heading, add a labeled value and an image with `alt`."
