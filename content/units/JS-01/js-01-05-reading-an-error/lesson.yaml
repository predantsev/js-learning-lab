id: js-01-05-reading-an-error
unit: JS-01
title:
  uk: "Читаємо повідомлення про помилку"
  en: "Reading an error message"
kind: instructional
minutes: 8
contentVersion: 1
objectives:
  - uk: "Знайти в повідомленні про помилку її назву, пояснення і номер рядка."
    en: "Find the error name, the explanation and the line number in an error message."
  - uk: "Виправити помилку в назві та незакриті лапки, керуючись лише повідомленням."
    en: "Repair a misspelled name and an unclosed string using only the error message."
prerequisites: [js-01-04-booleans-null-undefined]
subskills: []
glossary: [error-message, syntax-error, reference-error]
selfCheck: [where-it-stops, fix-two]

blocks:
  - id: a-clue
    kind: explanation
    title:
      uk: "Помилка — це підказка"
      en: "An error is a clue"
    body:
      uk: |
        Коли JavaScript не може виконати інструкцію, він зупиняється і показує [[error-message|повідомлення про помилку]]. Це не вирок усій програмі — це точна вказівка на **одне місце**.

        У повідомленні завжди три речі:

        ```text
        ReferenceError: consol is not defined
        index.js, рядок 2
        ```

        - **Назва** — який це тип помилки (`ReferenceError`).
        - **Пояснення** — що саме пішло не так (`consol is not defined` — «назву `consol` не визначено»).
        - **Місце** — файл і номер рядка.

        Досвідчені програмісти бачать помилки щодня. Вони не лякаються, а читають: *що* і *де*.
      en: |
        When JavaScript cannot carry out an instruction, it stops and shows an [[error-message|error message]]. It is not a verdict on the whole program — it points precisely at **one place**.

        A message always has three things:

        ```text
        ReferenceError: consol is not defined
        index.js, line 2
        ```

        - **The name** — what type of error it is (`ReferenceError`).
        - **The explanation** — what exactly went wrong (`consol is not defined`).
        - **The place** — the file and the line number.

        Experienced programmers see errors every day. They do not panic, they read: *what* and *where*.

  - id: where-it-stops
    kind: prediction
    strings:
      first: { uk: "Беру ключі", en: "Taking the keys" }
      second: { uk: "Зачиняю двері", en: "Locking the door" }
      third: { uk: "Виходжу", en: "Leaving" }
    prompt:
      uk: "У другому рядку помилка в назві: `consol` замість `console`. Що з’явиться в консолі, коли програму запустять?"
      en: "The second line has a misspelled name: `consol` instead of `console`. What appears in the console when the program runs?"
    code: |
      console.log("%%first%%");
      consol.log("%%second%%");
      console.log("%%third%%");
    verify:
      logs: ["%%first%%"]
      error: ReferenceError
    answer:
      type: choice
      options:
        - id: first-then-error
          text:
            uk: "Перший рядок, а потім помилка. Третій рядок не виконається"
            en: "The first line, then an error. The third line never runs"
        - id: nothing
          text:
            uk: "Нічого: програма з помилкою не запускається взагалі"
            en: "Nothing: a program with an error does not run at all"
          why:
            uk: "Так буває лише тоді, коли JavaScript не може *прочитати* код (про це — далі). Тут код прочитати можна: перший рядок виконується нормально."
            en: "That happens only when JavaScript cannot *read* the code (more on that below). Here the code can be read: the first line runs normally."
        - id: skips
          text:
            uk: "Перший і третій рядки: зламаний рядок буде пропущено"
            en: "The first and the third lines: the broken line is skipped"
          why:
            uk: "JavaScript не перестрибує через помилку. Він зупиняється на ній, і все, що нижче, не виконується."
            en: "JavaScript does not jump over an error. It stops there, and nothing below it runs."
        - id: all
          text:
            uk: "Усі три рядки: комп’ютер здогадається, що малося на увазі `console`"
            en: "All three lines: the computer will guess that `console` was meant"
          why:
            uk: "Комп’ютер не здогадується — це ми з’ясували в першому уроці. Для нього `consol` — просто невідома назва."
            en: "The computer does not guess — we saw that in the first lesson. To it, `consol` is just an unknown name."
      correct: [first-then-error]
    explanation:
      uk: "Програма виконується згори донизу. Перший рядок спрацьовує, на другому JavaScript зустрічає невідому назву, показує `ReferenceError` і зупиняється. До третього рядка справа не доходить. Помилка стосується **одного місця** — рядка 2."
      en: "A program runs top to bottom. The first line works; on the second, JavaScript meets an unknown name, shows a `ReferenceError` and stops. It never reaches the third line. The error is about **one place** — line 2."

  - id: unclosed
    kind: example
    runtime: browser-js
    dir: unclosed
    entry: index.js
    expectError: true
    strings:
      ready: { uk: "Майже готово", en: "Almost ready" }
      almost: { uk: "Ще трохи", en: "Just a little more" }
    title:
      uk: "Незакриті лапки"
      en: "An unclosed string"
    body:
      uk: |
        У цій програмі в другому рядку бракує лапок, що закривають текст. Натисни **Запустити** і прочитай повідомлення: назву, пояснення, рядок.

        Зверни увагу: цього разу консоль порожня — не виконався **навіть перший рядок**.
      en: |
        In this program the second line is missing the quote that closes the text. Press **Run** and read the message: the name, the explanation, the line.

        Notice: this time the console is empty — **not even the first line** ran.
    tryIt:
      uk: "Додай лапки перед дужкою в другому рядку й запусти ще раз. Тепер виконуються обидва рядки."
      en: "Add the quote before the bracket on the second line and run again. Now both lines run."

  - id: two-kinds
    kind: explanation
    title:
      uk: "Дві помилки, які ти вже зустрів"
      en: "Two errors you have already met"
    body:
      uk: |
        Перш ніж виконувати програму, JavaScript **читає її всю**. Тому ці дві помилки поводяться по-різному:

        | Помилка | Коли виникає | Що встигло виконатися |
        |---|---|---|
        | [[syntax-error\|SyntaxError]] | JavaScript не зміг *прочитати* код: бракує лапок, дужки, коми | Нічого |
        | [[reference-error\|ReferenceError]] | Під час виконання трапилася назва, якої JavaScript не знає | Усе, що вище цього рядка |

        В обох випадках дія та сама: знайди вказаний рядок, порівняй написане з тим, що мало бути, виправ і запусти знову.

        > [!tip]
        > Якщо у вказаному рядку все гаразд, подивись на рядок **перед** ним: незакриті лапки чи дужка часто «дають про себе знати» трохи далі.
      en: |
        Before running a program, JavaScript **reads all of it**. That is why these two errors behave differently:

        | Error | When it happens | What managed to run |
        |---|---|---|
        | [[syntax-error\|SyntaxError]] | JavaScript could not *read* the code: a quote, bracket or comma is missing | Nothing |
        | [[reference-error\|ReferenceError]] | While running, a name appeared that JavaScript does not know | Everything above that line |

        In both cases you do the same: find the reported line, compare what is written with what should be there, fix it and run again.

        > [!tip]
        > If the reported line looks fine, look at the line **before** it: an unclosed quote or bracket often shows up a little later.

  - id: fix-two
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: fix-two
    entry: index.js
    strings:
      line1: { uk: "Список зібрано", en: "The list is packed" }
      line2: { uk: "Перевіряю ще раз", en: "Checking once more" }
      line3: { uk: "Можна вирушати", en: "Ready to go" }
    title:
      uk: "Дві помилки в трьох рядках"
      en: "Two mistakes in three lines"
    instructions:
      uk: |
        Ця програма має вивести три рядки, але в ній дві помилки. Не шукай їх очима — **запусти програму й прочитай повідомлення**. Виправ одну помилку, запусти знову, прочитай наступне повідомлення.

        Рядки не видаляй: програма має робити те, для чого її написали.
      en: |
        This program should print three lines, but it has two mistakes. Do not hunt for them by eye — **run the program and read the message**. Fix one mistake, run again, read the next message.

        Do not delete lines: the program must still do what it was written for.
    testTitles:
      "runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without errors"
      "prints all three lines in order":
        uk: "Виводить усі три рядки в тому самому порядку"
        en: "Prints all three lines in the same order"
    hints:
      nudge:
        uk: "Запусти програму. У повідомленні є номер рядка — почни з нього."
        en: "Run the program. The message has a line number — start there."
      explanation:
        uk: "JavaScript спершу читає весь код, тому першою ти побачиш помилку читання — у рядку бракує лапок. Коли виправиш її, програма почне виконуватися й зупиниться на назві, якої JavaScript не знає. Порівняй цю назву з тим, як написано в сусідніх рядках."
        en: "JavaScript reads the whole code first, so the first thing you see is the reading error — a line is missing a quote. Once you fix it, the program starts running and stops at a name JavaScript does not know. Compare that name with how it is written on the neighbouring lines."
    solutionNote:
      uk: "У рядку 4 бракувало лапок, що закривають текст (`SyntaxError`), а в рядку 3 назву `console` було написано як `consle` (`ReferenceError`). Обидві помилки знайшлися за номером рядка з повідомлення."
      en: "Line 4 was missing the closing quote (`SyntaxError`), and on line 3 the name `console` was written as `consle` (`ReferenceError`). Both were found by the line number in the message."
    feedback:
      - when: { error: ReferenceError }
        message:
          uk: "Залишилася `ReferenceError`: у якомусь рядку назву написано з помилкою. Подивись на номер рядка в повідомленні й порівняй назву з `console`."
          en: "A `ReferenceError` remains: a name is misspelled on some line. Look at the line number in the message and compare the name with `console`."
      - when: { test: "prints all three lines in order" }
        message:
          uk: "Програма має вивести три рядки. Якщо якийсь рядок видалено — поверни його (кнопка «Почати спочатку» відновить початковий код) і виправ, а не прибирай."
          en: "The program must print three lines. If a line was deleted, bring it back (the “Start over” button restores the starting code) and repair it instead of removing it."

  - id: to-project
    kind: transfer
    capstoneStep: JS-01
    body:
      uk: "Коли ти змінюватимеш сторінку свого проєкту, помилки траплятимуться — це нормально. Тепер ти знаєш, що робити: прочитати назву, пояснення й рядок."
      en: "When you change the page of your project, errors will happen — that is normal. Now you know what to do: read the name, the explanation and the line."
