id: js-01-02-numbers-and-text
unit: JS-01
title:
  uk: "Значення: числа й текст"
  en: "Values: numbers and text"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Відрізнити число від рядка з цифр — за лапками і за тим, що з ними робить плюс."
    en: "Tell a number from a string of digits — by its quotes and by what plus does with it."
  - uk: "Записати текст в одинарних і подвійних лапках і пояснити, коли зручніші одні, а коли інші."
    en: "Write text in single and double quotes and explain when each kind is handy."
prerequisites: [js-01-01-code-runs]
subskills:
  - { family: J-01, skill: "primitive/reference values", depth: intro }
glossary: [value, number, string, literal]
selfCheck: [plus-two-ways, three-values]

blocks:
  - id: values
    kind: explanation
    title:
      uk: "Значення бувають різних типів"
      en: "Values come in types"
    body:
      uk: |
        Усе, з чим працює програма, — це [[value|значення]]: ціна `520`, назва `"Проїзний"`. Значення бувають різних **типів**. Сьогодні — два найпоширеніші.

        - [[number|Число]] пишуть цифрами **без лапок**: `520`, `0`, `-15`. Дробову частину відокремлюють **крапкою**: `99.9`.
        - [[string|Рядок]] (англійською *string*) — це текст **у лапках**: `"Проїзний"`. Лапки показують, де текст починається і де закінчується; самі вони до тексту не входять.

        Значення, записане в коді просто як є, називають [[literal|літералом]]: `520` — числовий літерал, `"Проїзний"` — рядковий.

        > [!warning]
        > У JavaScript кома — не десятковий знак, хоч ми й пишемо «99,9». `console.log(99,9)` виведе **два** числа: `99 9`. Пиши `99.9`.
      en: |
        Everything a program works with is a [[value]]: a price `520`, a name `"Transit pass"`. Values come in different **types**. Today, the two most common ones.

        - A [[number]] is written in digits **without quotes**: `520`, `0`, `-15`. The fractional part is separated by a **dot**: `99.9`.
        - A [[string]] is text **in quotes**: `"Transit pass"`. The quotes show where the text starts and where it ends; they are not part of the text.

        A value written directly in the code is called a [[literal]]: `520` is a number literal, `"Transit pass"` is a string literal.

        > [!warning]
        > In JavaScript a comma is never a decimal mark, even if your language writes “99,9”. `console.log(99,9)` prints **two** numbers: `99 9`. Write `99.9`.

  - id: plus-two-ways
    kind: prediction
    prompt:
      uk: "Дві схожі інструкції. Що з’явиться в консолі, коли програму запустять?"
      en: "Two similar instructions. What appears in the console when the program runs?"
    code: |
      console.log(5 + 5);
      console.log("5" + "5");
    verify:
      logs: ["10", "55"]
    answer:
      type: choice
      options:
        - id: ten-then-55
          text:
            uk: "`10`, потім `55`"
            en: "`10`, then `55`"
        - id: ten-twice
          text:
            uk: "`10` двічі"
            en: "`10` twice"
          why:
            uk: "Цифра в лапках — це текст, а не число. Для тексту `+` не додає, а склеює: `\"5\"` і `\"5\"` дають `\"55\"`."
            en: "A digit in quotes is text, not a number. For text, `+` does not add, it joins: `\"5\"` and `\"5\"` give `\"55\"`."
        - id: glued-twice
          text:
            uk: "`55` двічі"
            en: "`55` twice"
          why:
            uk: "Без лапок `5` — число, а числа `+` додає: `5 + 5` дає `10`."
            en: "Without quotes, `5` is a number, and `+` adds numbers: `5 + 5` gives `10`."
        - id: error
          text:
            uk: "`10`, а потім помилка: текст не можна додавати"
            en: "`10`, then an error: you cannot add text"
          why:
            uk: "Можна: з текстом `+` не ламається, а склеює рядки."
            en: "You can: with text, `+` does not fail — it joins the strings."
      correct: [ten-then-55]
    explanation:
      uk: "`5` і `\"5\"` — різні значення: перше — число, друге — рядок з одного символу. `+` додає числа, а рядки склеює (програмісти кажуть *конкатенація*). У консолі обидва результати схожі, бо консоль показує текст без лапок. Але числа вона фарбує іншим кольором — придивись у наступному прикладі."
      en: "`5` and `\"5\"` are different values: the first is a number, the second is a string of one character. `+` adds numbers and joins strings (programmers call it *concatenation*). In the console both results look alike, because the console shows text without quotes. But it colors numbers differently — look closely in the next example."

  - id: quotes
    kind: explanation
    title:
      uk: "Одинарні чи подвійні лапки"
      en: "Single or double quotes"
    body:
      uk: |
        Рядок можна взяти в подвійні лапки `"…"` або в одинарні `'…'` — це той самий текст: `"Обід"` і `'Обід'` нічим не відрізняються.

        Вибір стає важливим, коли лапка є **всередині** тексту. JavaScript вважає, що рядок закінчився на першій лапці того самого виду, з якого він почався. Тому зовнішні лапки бери іншого виду, ніж ті, що всередині:

        ```js
        console.log("Обід у п'ятницю");
        console.log('Кава — у категорії "Розваги"');
        ```

        У першому рядку всередині апостроф, тому зовні — подвійні лапки. У другому всередині подвійні, тому зовні — одинарні. Українські слова з апострофом — `п'ять`, `сім'я`, `м'ята` — найзручніше брати в подвійні лапки.
      en: |
        A string can be in double quotes `"…"` or in single quotes `'…'` — it is the same text: `"Lunch"` and `'Lunch'` are identical.

        The choice matters when a quote appears **inside** the text. JavaScript decides that a string ends at the first quote of the same kind it started with. So use outer quotes of a different kind than the ones inside:

        ```js
        console.log("Friday's lunch");
        console.log('Coffee goes to "Fun"');
        ```

        The first line has an apostrophe inside, so it uses double quotes outside. The second has double quotes inside, so it uses single quotes outside. Words with an apostrophe — `it's`, `don't`, `Friday's` — are easiest in double quotes.

  - id: apostrophe
    kind: prediction
    strings:
      day: { uk: "П'ятниця", en: "It's Friday" }
    prompt:
      uk: "Яка з трьох інструкцій виведе текст і не зупинить програму?"
      en: "Which of the three instructions prints the text without stopping the program?"
    answer:
      type: choice
      options:
        - id: single
          code: "console.log('%%day%%');"
          why:
            uk: "Апостроф закриває рядок, що почався з одинарної лапки. Решту рядка JavaScript прочитати не може, тож код навіть не запуститься: з’явиться повідомлення «Код не вдалося запустити»."
            en: "The apostrophe closes the string that started with a single quote. JavaScript cannot read the rest of the line, so the code does not even start: you get the message “The code could not start”."
        - id: double
          code: "console.log(\"%%day%%\");"
        - id: bare
          code: "console.log(%%day%%);"
          why:
            uk: "Без лапок це вже не текст: JavaScript бачить незнайомі назви й символи і не може прочитати код."
            en: "Without quotes it is no longer text: JavaScript sees unknown names and symbols and cannot read the code."
      correct: [double]
    explanation:
      uk: "Рядок закінчується на першій лапці того самого виду, з якого почався. В одинарних лапках апостроф передчасно «закриває» текст, і решта рядка стає для JavaScript незрозумілою — програма навіть не стартує. У подвійних лапках апостроф — звичайний символ тексту."
      en: "A string ends at the first quote of the same kind it started with. Inside single quotes the apostrophe closes the text too early, and the rest of the line makes no sense to JavaScript — the program does not even start. Inside double quotes the apostrophe is just a character of the text."

  - id: number-or-text
    kind: example
    runtime: browser-js
    dir: number-or-text
    entry: index.js
    strings:
      pass: { uk: "Проїзний:", en: "Transit pass:" }
      lunch: { uk: "Обід у п'ятницю", en: "Friday's lunch" }
    title:
      uk: "Число чи текст?"
      en: "Number or text?"
    body:
      uk: |
        Запусти програму. Перші два рядки в консолі на вигляд однакові, але число консоль фарбує інакше, ніж текст. Третій і четвертий рядки показують, що робить `+` з числами і з рядками.

        П’ятий рядок — нове: `console.log` може вивести **кілька значень** за раз, якщо розділити їх комами. Консоль ставить між ними пробіл. А в останньому рядку апостроф спокійно сидить у подвійних лапках.
      en: |
        Run the program. The first two lines in the console look the same, but the console colors the number differently from the text. The third and fourth lines show what `+` does with numbers and with strings.

        The fifth line is new: `console.log` can print **several values** at once if you separate them with commas. The console puts a space between them. And on the last line an apostrophe sits safely inside double quotes.
    tryIt:
      uk: "1) У третьому рядку візьми `180` у лапки — `520 + \"180\"` — і запусти: число з рядком теж склеюються. 2) У п’ятому рядку заміни кому на `+`. Що змінилося? Придивись до пробілу. 3) Напиши в першому рядку `99,9` замість `520`, а потім `99.9` — і порівняй вивід. 4) В останньому рядку заміни подвійні лапки на одинарні й запусти: код не запуститься, як і в передбаченні вище. Поверни подвійні."
      en: "1) On the third line put `180` in quotes — `520 + \"180\"` — and run: a number and a string are joined too. 2) On the fifth line replace the comma with `+`. What changed? Look at the space. 3) Write `99,9` instead of `520` on the first line, then `99.9` — and compare the output. 4) On the last line replace the double quotes with single ones and run: the code does not start, just as in the prediction above. Put the double quotes back."

  - id: three-values
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: three-values
    entry: index.js
    strings:
      sentence: { uk: "Кава з друзями — у категорії \"Розваги\"", en: "Coffee with friends goes to \"Fun\"" }
      apostrophe: { uk: "Обід у п'ятницю", en: "Friday's lunch" }
    title:
      uk: "Три значення трекера витрат"
      en: "Three values of an expense tracker"
    instructions:
      uk: |
        Виведи в консоль три значення — кожне окремим `console.log`, у такому порядку:

        1. ціну проїзного — **ціле число** `520`;
        2. ціну лампочок — **дробове число** `99.9`;
        3. речення з лапками чи апострофом усередині, наприклад: `Кава з друзями — у категорії "Розваги"`.

        Добери зовнішні лапки так, щоб текст не обірвався посередині.
      en: |
        Print three values to the console — each with its own `console.log`, in this order:

        1. the price of the transit pass — the **whole number** `520`;
        2. the price of the light bulbs — the **decimal number** `99.9`;
        3. a sentence with quotes or an apostrophe inside, for example: `Coffee with friends goes to "Fun"`.

        Choose the outer quotes so that the text is not cut off in the middle.
    testTitles:
      "prints three lines":
        uk: "Програма виводить три рядки"
        en: "The program prints three lines"
      "the first value is a whole number":
        uk: "Перше значення — ціле число"
        en: "The first value is a whole number"
      "the second value is a decimal number":
        uk: "Друге значення — дробове число"
        en: "The second value is a decimal number"
      "the third value is text with quotes inside":
        uk: "Третє значення — текст із лапкою всередині"
        en: "The third value is text with a quote inside"
    hints:
      nudge:
        uk: "Пригадай: число пишуть без лапок, а текст — у лапках. Яким знаком у JavaScript відокремлюють дробову частину?"
        en: "Remember: a number goes without quotes, text goes in quotes. Which sign separates the fractional part in JavaScript?"
      explanation:
        uk: "Напиши три інструкції `console.log(...)`. У першу постав ціле число, у другу — число з **крапкою**, у третю — речення в лапках. Якщо в реченні є подвійні лапки, візьми все речення в одинарні; апостроф спокійно живе в подвійних."
        en: "Write three `console.log(...)` instructions. Put a whole number in the first, a number with a **dot** in the second and a sentence in quotes in the third. If the sentence contains double quotes, wrap it in single ones; an apostrophe is fine inside double quotes."
    solutionNote:
      uk: "`520` і `99.9` записано без лапок, тому це числа; дробову частину відокремлює крапка. Речення має подвійні лапки всередині, тож зовні стоять одинарні — інакше рядок закінчився б посередині й код не запустився б."
      en: "`520` and `99.9` are written without quotes, so they are numbers; a dot separates the fractional part. The sentence has double quotes inside, so single quotes go outside — otherwise the string would end in the middle and the code would not start."
    feedback:
      - when: { test: "prints three lines" }
        message:
          uk: "Потрібно рівно три рядки в консолі — по одному `console.log` на кожне значення. Якщо рядків менше, перевір, чи не стоїть перед інструкцією `//`: коментар комп’ютер пропускає."
          en: "The console needs exactly three lines — one `console.log` per value. If there are fewer, check whether an instruction starts with `//`: the computer skips comments."
      - when: { test: "the first value is a whole number" }
        message:
          uk: "Перше значення має бути числом, наприклад `520`. Якщо воно в лапках, це вже текст — прибери лапки."
          en: "The first value must be a number, for example `520`. If it is in quotes, it is text — remove the quotes."
      - when: { test: "the second value is a decimal number" }
        message:
          uk: "Дробову частину відокремлюй **крапкою**: `99.9`. Через кому `console.log(99,9)` отримує два окремі цілі числа й виводить `99 9`. І без лапок — інакше це текст."
          en: "Separate the fractional part with a **dot**: `99.9`. With a comma, `console.log(99,9)` receives two separate whole numbers and prints `99 9`. And no quotes — otherwise it is text."
      - when: { test: "the third value is text with quotes inside" }
        message:
          uk: "Третім має бути текст у лапках, а всередині нього — ще одна лапка чи апостроф. Наприклад: `console.log('Кава — у категорії \"Розваги\"')`."
          en: "The third value must be text in quotes with another quote or an apostrophe inside it. For example: `console.log('Coffee goes to \"Fun\"')`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-01
    body:
      uk: "На стартовій сторінці твого проєкту теж є значення: назви, ціни, суми. Тепер ти бачиш, де число, а де текст, — і знаєш, що `+` робить з кожним із них."
      en: "Your project’s starter page has values too: names, prices, amounts. Now you can see which is a number and which is text — and you know what `+` does with each of them."
