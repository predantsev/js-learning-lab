id: js-01-06-html-elements-attributes
unit: JS-01
title:
  uk: "Сторінка складається з елементів"
  en: "A page is made of elements"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Прочитати елемент як тег, атрибути й вміст і назвати заголовки, абзаци та орієнтир main."
    en: "Read an element as tag + attributes + content and name headings, paragraphs and the main landmark."
  - uk: "Змінити текст і атрибут елемента та побачити, як оновлюється сторінка."
    en: "Change the text and an attribute of an element and see the preview update."
prerequisites: [js-01-05-reading-an-error]
subskills:
  - { family: W-01, skill: "document structure/headings/landmarks", depth: intro }
glossary: [element, tag, attribute, heading, landmark]
selfCheck: [what-changes, planner-main]

blocks:
  - id: elements
    kind: explanation
    title:
      uk: "Елемент — це тег, атрибути й вміст"
      en: "An element is a tag, attributes and content"
    body:
      uk: |
        Досі програми писали в консоль. А те, що ти бачиш у браузері, — це сторінка, і її описують мовою **HTML**. Сторінка складається з [[element|елементів]]:

        ```html
        <p lang="en">Morning exercise</p>
        ```

        - `<p>` — відкривальний [[tag|тег]]: назва елемента в кутових дужках. `p` означає абзац (*paragraph*).
        - `lang="en"` — [[attribute|атрибут]]: додаткове налаштування у форматі `назва="значення"`. Тут він каже, що текст англійською.
        - `Morning exercise` — вміст: те, що видно на сторінці.
        - `</p>` — закривальний тег, з косою рискою.

        Елементи вкладаються один в одного, як коробки: абзац може лежати всередині іншого елемента. Щоб вкладеність було видно, внутрішні рядки пишуть із відступом.
      en: |
        So far, programs wrote to the console. But what you see in a browser is a page, and pages are described in **HTML**. A page is made of [[element|elements]]:

        ```html
        <p lang="uk">Ранкова зарядка</p>
        ```

        - `<p>` is the opening [[tag]]: the element’s name in angle brackets. `p` stands for paragraph.
        - `lang="uk"` is an [[attribute]]: an extra setting written as `name="value"`. Here it says the text is in Ukrainian.
        - `Ранкова зарядка` is the content: what you see on the page.
        - `</p>` is the closing tag, with a slash.

        Elements nest inside each other like boxes: a paragraph can sit inside another element. To make the nesting visible, inner lines are indented.

  - id: skeleton
    kind: explanation
    title:
      uk: "Скелет сторінки"
      en: "The skeleton of a page"
    body:
      uk: |
        Ось уся сторінка трекера звичок:

        ```html
        <!doctype html>
        <html lang="uk">
          <head>
            <meta charset="utf-8">
            <title>Трекер звичок</title>
          </head>
          <body>
            <main>
              <h1>Трекер звичок</h1>
              <h2>Ранкова зарядка</h2>
              <p>Щодня</p>
            </main>
          </body>
        </html>
        ```

        - `<!doctype html>` — перший рядок: «це сучасна HTML-сторінка».
        - `<head>` — службова частина: кодування й назва вкладки браузера (`<title>`). На самій сторінці її не видно.
        - `<body>` — усе, що видно.
        - `<main>` — **головний вміст** сторінки. Це [[landmark|орієнтир]]: людина з програмою екранного читання (вона читає сторінку вголос) може перестрибнути до нього одразу.
        - `<h1>`…`<h6>` — [[heading|заголовки]] шести рівнів: `<h1>` — назва всієї сторінки, `<h2>` — розділи, `<h3>` — підрозділи.

        Такий скелет має майже кожна сторінка — змінюється лише вміст `<body>`.
      en: |
        Here is the whole habit tracker page:

        ```html
        <!doctype html>
        <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Habit tracker</title>
          </head>
          <body>
            <main>
              <h1>Habit tracker</h1>
              <h2>Morning exercise</h2>
              <p>Every day</p>
            </main>
          </body>
        </html>
        ```

        - `<!doctype html>` is the first line: “this is a modern HTML page”.
        - `<head>` is the service part: the encoding and the browser tab’s name (`<title>`). It is not visible on the page itself.
        - `<body>` holds everything you see.
        - `<main>` is the page’s **main content**. It is a [[landmark]]: a person using a screen reader (a program that reads the page aloud) can jump straight to it.
        - `<h1>`…`<h6>` are [[heading|headings]] of six levels: `<h1>` is the title of the whole page, `<h2>` marks sections, `<h3>` subsections.

        Almost every page has this skeleton — only the content of `<body>` changes.

  - id: what-changes
    kind: prediction
    prompt:
      uk: "Ти змінюєш сторінку трекера звичок чотирма способами. Які зміни буде **видно** на сторінці? Познач усі."
      en: "You change the habit tracker page in four ways. Which changes will be **visible** on the page? Mark all of them."
    answer:
      type: multi
      options:
        - id: h2-to-h1
          text:
            uk: "`<h2>Ранкова зарядка</h2>` замінити на `<h1>Ранкова зарядка</h1>`"
            en: "Replace `<h2>Morning exercise</h2>` with `<h1>Morning exercise</h1>`"
        - id: into-main
          text:
            uk: "Абзац, що стоїть після `</main>`, перенести всередину `<main>`"
            en: "Move the paragraph that stands after `</main>` inside `<main>`"
          why:
            uk: "`<main>` не має власного вигляду. Він позначає роль вмісту для програм екранного читання, тож на екрані нічого не зміниться."
            en: "`<main>` has no look of its own. It marks the role of the content for screen readers, so nothing changes on the screen."
        - id: lang
          text:
            uk: "У `<html lang=\"uk\">` замінити `uk` на `en`"
            en: "In `<html lang=\"en\">`, replace `en` with `uk`"
          why:
            uk: "`lang` не змінює вигляду. Він підказує програмам екранного читання, якою вимовою читати текст, а перекладачам і перевірці правопису — якою мовою він написаний."
            en: "`lang` does not change the look. It tells screen readers which pronunciation to use, and translators and spell checkers which language the text is in."
        - id: text
          text:
            uk: "Змінити текст `Щодня` на `Щоранку`"
            en: "Change the text `Every day` to `Every morning`"
      correct: [h2-to-h1, text]
    explanation:
      uk: "Видно лише зміну тексту й рівня заголовка: `<h1>` браузер показує більшим шрифтом. Перенесення в `<main>` і зміна `lang` на екрані непомітні, але змінюють **структуру** сторінки: що в ній головне і якою мовою вона написана. Цю структуру використовують програми екранного читання, пошукові системи й сам браузер."
      en: "Only the text change and the heading level are visible: the browser shows `<h1>` in a bigger font. Moving into `<main>` and changing `lang` are invisible on the screen, but they change the page’s **structure**: what is the main part and which language it is written in. Screen readers, search engines and the browser itself use this structure."

  - id: habit-page
    kind: example
    runtime: browser-js
    dir: habit-page
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Трекер звичок", en: "Habit tracker" }
      habit1: { uk: "Ранкова зарядка", en: "Morning exercise" }
      habit2: { uk: "Пити воду", en: "Drink water" }
      daily: { uk: "Щодня", en: "Every day" }
      note: { uk: "Звички відмічають щовечора.", en: "Habits are marked every evening." }
    title:
      uk: "Сторінка трекера звичок"
      en: "A habit tracker page"
    body:
      uk: |
        Це справжня сторінка: натисни **Запустити** й подивись на вкладку **Сторінка**. Знайди в коді кожен елемент, який бачиш на екрані.
      en: |
        This is a real page: press **Run** and look at the **Page** tab. Find in the code every element you see on the screen.
    tryIt:
      uk: "1) Зміни текст у `<h1>` і запусти. 2) Заміни `<h2>` першої звички на `<h1>` — і відкривальний, і закривальний тег: текст побільшав, але тепер на сторінці дві назви. Поверни `<h2>`. 3) Перенеси останній абзац усередину `<main>` — сторінка виглядатиме так само. 4) Зміни значення `lang` — на екрані теж без змін, хоча програма екранного читання вже читала б текст іншою вимовою."
      en: "1) Change the text in `<h1>` and run. 2) Replace the first habit’s `<h2>` with `<h1>` — both the opening and the closing tag: the text got bigger, but now the page has two titles. Put `<h2>` back. 3) Move the last paragraph inside `<main>` — the page looks the same. 4) Change the value of `lang` — no change on the screen either, although a screen reader would now read the text with a different pronunciation."

  - id: outline
    kind: visual
    visual: diagram
    title:
      uk: "Дерево сторінки трекера звичок"
      en: "The tree of the habit tracker page"
    textEquivalent:
      uk: >-
        Вміст body сторінки з прикладу можна намалювати як дерево вкладених елементів. Просто в body лежать
        два сусіди: main і абзац-примітка, що стоїть після main. main — орієнтир «головний вміст», до якого
        програма екранного читання може перестрибнути одразу. Усередині main по черзі стоять h1 «Трекер
        звичок», h2 «Ранкова зарядка», абзац «Щодня», h2 «Пити воду» і ще один абзац «Щодня» — усі вони
        сусіди одного рівня. Примітка лежить поза main, тож до головного вмісту не входить, хоча на екрані
        цього не видно. Якщо попросити програму екранного читання прочитати лише заголовки, вона назве
        «Трекер звичок» першого рівня, а під ним «Ранкова зарядка» й «Пити воду» другого рівня: рівні
        заголовків утворюють зміст сторінки.
      en: >-
        The content of the example page’s body can be drawn as a tree of nested elements. Directly in the
        body there are two neighbors: main and a note paragraph that stands after main. main is the “main
        content” landmark, which a screen reader can jump to directly. Inside main come, in order, h1
        “Habit tracker”, h2 “Morning exercise”, the paragraph “Every day”, h2 “Drink water” and another
        paragraph “Every day” — all of them neighbors on one level. The note is outside main, so it is not
        part of the main content, although the screen does not show that. If you ask a screen reader to read
        only the headings, it names “Habit tracker” at level 1 and, under it, “Morning exercise” and “Drink
        water” at level 2: the heading levels form the page’s outline.
    spec:
      layout: grid
      nodes:
        - { id: main, label: "<main>", shape: round, col: 0, row: 0 }
        - { id: note, label: { uk: "<p> примітка", en: "<p> note" }, col: 0, row: 5 }
        - { id: h1, label: { uk: "<h1> Трекер звичок", en: "<h1> Habit tracker" }, col: 1, row: 0 }
        - { id: h2-exercise, label: { uk: "<h2> Ранкова зарядка", en: "<h2> Morning exercise" }, col: 1, row: 1 }
        - { id: p-exercise, label: { uk: "<p> Щодня", en: "<p> Every day" }, col: 1, row: 2 }
        - { id: h2-water, label: { uk: "<h2> Пити воду", en: "<h2> Drink water" }, col: 1, row: 3 }
        - { id: p-water, label: { uk: "<p> Щодня", en: "<p> Every day" }, col: 1, row: 4 }
      edges:
        - { from: main, to: h1 }
        - { from: main, to: h2-exercise }
        - { from: main, to: p-exercise }
        - { from: main, to: h2-water }
        - { from: main, to: p-water }
      steps:
        - caption:
            uk: "Ось вміст `<body>` сторінки з прикладу вище, намальований як дерево. Ліворуч — елементи, що лежать просто в `<body>`; стрілка веде від елемента до того, що лежить усередині нього."
            en: "Here is the content of the `<body>` of the page from the example above, drawn as a tree. On the left are the elements that sit directly in `<body>`; an arrow points from an element to what lies inside it."
        - highlight: [main, note]
          caption:
            uk: "У `<body>` два сусіди: `<main>` і абзац-примітка, що стоїть після `</main>`."
            en: "The `<body>` holds two neighbors: `<main>` and a note paragraph that stands after `</main>`."
        - highlight: [main]
          annotate:
            - { id: main, text: { uk: "орієнтир", en: "landmark" } }
          caption:
            uk: "`<main>` — орієнтир «головний вміст». Програма екранного читання вміє перестрибнути сюди одразу, минаючи все інше на сторінці."
            en: "`<main>` is the “main content” landmark. A screen reader can jump straight here, skipping everything else on the page."
        - highlight: [h1, main->h1]
          caption:
            uk: "`<h1>` — назва всієї сторінки. Він лежить у `<main>`, і на сторінці він один."
            en: "`<h1>` is the title of the whole page. It sits in `<main>`, and there is only one on the page."
        - highlight: [h2-exercise, p-exercise, h2-water, p-water, main->h2-exercise, main->p-exercise, main->h2-water, main->p-water]
          caption:
            uk: "Далі розділи: кожен `<h2>` називає звичку, а `<p>` після нього — як часто її виконувати. Усі вони — сусіди одного рівня всередині `<main>`."
            en: "Then the sections: each `<h2>` names a habit, and the `<p>` after it says how often to do it. They are all neighbors on one level inside `<main>`."
        - highlight: [note]
          dim: [main, h1, h2-exercise, p-exercise, h2-water, p-water, main->h1, main->h2-exercise, main->p-exercise, main->h2-water, main->p-water]
          caption:
            uk: "Примітка — сусід `<main>`, а не його частина: вона лежить **поза** `<main>`, тож до головного вмісту не входить. На екрані цього не видно — різниця лише в структурі."
            en: "The note is a neighbor of `<main>`, not a part of it: it lies **outside** `<main>`, so it is not in the main content. The screen does not show it — the difference is only in the structure."
        - highlight: [h1, h2-exercise, h2-water]
          dim: [note, p-exercise, p-water, main->p-exercise, main->p-water]
          caption:
            uk: "Так сторінку чує людина, яка просить програму екранного читання прочитати лише заголовки: «Трекер звичок» (рівень 1), під ним «Ранкова зарядка» і «Пити воду» (рівень 2). Рівні заголовків — це зміст сторінки."
            en: "This is how a person hears the page after asking a screen reader to read only the headings: “Habit tracker” (level 1), and under it “Morning exercise” and “Drink water” (level 2). The heading levels are the page’s outline."

  - id: level-not-size
    kind: explanation
    title:
      uk: "Рівень заголовка — не розмір"
      en: "A heading level is not a size"
    body:
      uk: |
        Браузер показує `<h1>` більшим за `<h2>`, тому здається, що рівень — це просто розмір тексту. Але рівні будують **зміст** сторінки: людина з програмою екранного читання часто спершу слухає лише заголовки, щоб зрозуміти, що тут є, і перестрибує до потрібного.

        Якщо зробити назву звички `<h1>` лише «щоб було більше», у змісті з’явиться друга назва сторінки. Тому рівень обирають за **роллю**: один `<h1>` на сторінку, `<h2>` для розділів, `<h3>` для підрозділів. А розмір змінюють стилями — про них за два уроки.
      en: |
        The browser shows `<h1>` bigger than `<h2>`, so a level seems to be just a text size. But levels build the page’s **outline**: a person using a screen reader often listens to the headings first to learn what is on the page, and then jumps to the right one.

        If you make a habit’s name an `<h1>` only “to make it bigger”, the outline gets a second page title. So the level is chosen by **role**: one `<h1>` per page, `<h2>` for sections, `<h3>` for subsections. Size is changed with styles — they come in two lessons.

  - id: planner-main
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: planner-main
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Планувальник", en: "Planner" }
      task1: { uk: "Полити квіти", en: "Water the plants" }
      task2: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      task3: { uk: "Написати бабусі", en: "Write to grandma" }
      today: { uk: "Сьогодні", en: "Today" }
    title:
      uk: "Головна частина планувальника"
      en: "The main part of the planner"
    instructions:
      uk: |
        Сторінка планувальника поки порожня. Усередині `<body>` створи головну частину сторінки — `<main>`, а в ній:

        1. заголовок першого рівня `Планувальник`;
        2. два абзаци — дві справи: `Полити квіти` і `Здати книжки в бібліотеку`.

        Рядок між `<!--` і `-->` — коментар для людей, браузер його не показує. Запусти й подивись на вкладку **Сторінка**, потім натисни **Перевірити**.
      en: |
        The planner page is empty for now. Inside `<body>`, create the main part of the page — `<main>` — and put into it:

        1. a first-level heading `Planner`;
        2. two paragraphs — two tasks: `Water the plants` and `Return library books`.

        The line between `<!--` and `-->` is a comment for people; the browser does not show it. Run and look at the **Page** tab, then press **Check**.
    testTitles:
      "the page has a main area":
        uk: "На сторінці є головна частина main"
        en: "The page has a main area"
      "the page title is a first-level heading inside main":
        uk: "Назва сторінки — заголовок першого рівня всередині main"
        en: "The page title is a first-level heading inside main"
      "the page has only one first-level heading":
        uk: "На сторінці лише один заголовок першого рівня"
        en: "The page has only one first-level heading"
      "main contains two paragraphs with text":
        uk: "У main є два абзаци з текстом"
        en: "main contains two paragraphs with text"
    hints:
      nudge:
        uk: "Подивись на скелет сторінки в поясненні: що лежить усередині `<main>` і як виглядають відкривальний і закривальний теги?"
        en: "Look at the page skeleton in the explanation: what lies inside `<main>`, and what do the opening and closing tags look like?"
      explanation:
        uk: "Напиши `<main>` і `</main>`, а між ними — `<h1>` з назвою сторінки і два елементи `<p>` зі справами. Кожен елемент має відкривальний і закривальний тег; вкладені рядки зручно писати з відступом."
        en: "Write `<main>` and `</main>`, and between them an `<h1>` with the page title and two `<p>` elements with the tasks. Every element has an opening and a closing tag; nested lines are easiest to read when indented."
    solutionNote:
      uk: "`<main>` позначає головний вміст, `<h1>` усередині нього — назву сторінки, а два `<p>` — справи. Програма екранного читання знайде і орієнтир, і заголовок, хоча на екрані `<main>` нічим не виділяється."
      en: "`<main>` marks the main content, the `<h1>` inside it is the page title, and the two `<p>` elements are the tasks. A screen reader finds both the landmark and the heading, even though `<main>` does not stand out on the screen."
    feedback:
      - when: { test: "the page has a main area" }
        message:
          uk: "Не знайдено `<main>`. Огорни заголовок і абзаци в `<main>` … `</main>` — так сторінка отримає орієнтир «головний вміст»."
          en: "No `<main>` found. Wrap the heading and the paragraphs in `<main>` … `</main>` — this gives the page its “main content” landmark."
      - when: { test: "the page title is a first-level heading inside main" }
        message:
          uk: "Назва сторінки — це заголовок **першого** рівня, `<h1>`, і він має лежати всередині `<main>`. Рівень обирають за роллю, а не за розміром: `<h2>` чи `<h3>` для назви сторінки не підходять."
          en: "The page title is a **first**-level heading, `<h1>`, and it must sit inside `<main>`. The level follows the role, not the size: `<h2>` or `<h3>` do not fit a page title."
      - when: { test: "the page has only one first-level heading" }
        message:
          uk: "На сторінці має бути рівно один `<h1>` — назва сторінки. Справи — це абзаци `<p>`, а не заголовки першого рівня."
          en: "The page must have exactly one `<h1>` — its title. The tasks are `<p>` paragraphs, not first-level headings."
      - when: { test: "main contains two paragraphs with text" }
        message:
          uk: "Потрібні два абзаци `<p>` зі справами, і обидва — **всередині** `<main>`, тобто до `</main>`."
          en: "You need two `<p>` paragraphs with tasks, both **inside** `<main>`, that is, before `</main>`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-01
    body:
      uk: "Стартова сторінка твого проєкту побудована так само: `<main>`, у ньому один `<h1>` з назвою проєкту, далі — вміст. Коли змінюватимеш її, тримай цю структуру."
      en: "The starter page of your project is built the same way: `<main>` with one `<h1>` holding the project’s name, then the content. Keep that structure when you change it."
