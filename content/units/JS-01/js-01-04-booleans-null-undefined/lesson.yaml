id: js-01-04-booleans-null-undefined
unit: JS-01
title:
  uk: "Так/ні, нічого і ще-не-задано"
  en: "Yes/no values, nothing and not-yet"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Отримувати true і false з порівнянь і читати результат typeof для кожного простого типу."
    en: "Produce true and false from comparisons and read the result of typeof for each primitive type."
  - uk: "Відрізняти null (порожньо навмисно) від undefined (ще не задано) у виводі програми."
    en: "Tell null (deliberately empty) from undefined (not assigned yet) in a program’s output."
prerequisites: [js-01-03-arithmetic-precedence]
subskills:
  - { family: J-01, skill: "typeof and null/undefined", depth: intro }
  - { family: J-01, skill: "primitive/reference values", depth: practice }
glossary: [boolean, "null", "undefined", typeof, comparison]
selfCheck: [type-table, wish-questions]

blocks:
  - id: yes-no
    kind: explanation
    title:
      uk: "Питання з відповіддю «так» чи «ні»"
      en: "Questions with a yes-or-no answer"
    body:
      uk: |
        [[comparison|Порівняння]] — це питання до значень. Відповідь на нього — [[boolean|булеве значення]]: `true` («так», істина) або `false` («ні», хиба). Пишуться вони **без лапок**.

        | Оператор | Питання | Приклад | Відповідь |
        |---|---|---|---|
        | `>` і `<` | більше? менше? | `80 > 50` | `true` |
        | `>=` і `<=` | не менше? не більше? | `45 >= 50` | `false` |
        | `===` | дорівнює? | `80 === 80` | `true` |
        | `!==` | не дорівнює? | `80 !== 45` | `true` |

        `===` — це **три** знаки рівності. Він порівнює і значення, і тип: `5 === "5"` дає `false`, бо число й рядок — різні значення. Арифметика виконується раніше за порівняння: `80 + 45 <= 100` спершу рахує `125`, а тоді відповідає `false`.

        > [!note]
        > Один знак `=` — це не порівняння, а `==` (два знаки) має несподіванки. Про обидва — у наступному розділі; поки що порівнюй через `===`.
      en: |
        A [[comparison]] is a question about values. Its answer is a [[boolean]]: `true` (“yes”) or `false` (“no”). They are written **without quotes**.

        | Operator | Question | Example | Answer |
        |---|---|---|---|
        | `>` and `<` | greater? less? | `80 > 50` | `true` |
        | `>=` and `<=` | at least? at most? | `45 >= 50` | `false` |
        | `===` | equal? | `80 === 80` | `true` |
        | `!==` | not equal? | `80 !== 45` | `true` |

        `===` is **three** equals signs. It compares both the value and the type: `5 === "5"` gives `false`, because a number and a string are different values. Arithmetic runs before comparison: `80 + 45 <= 100` first computes `125` and then answers `false`.

        > [!note]
        > A single `=` is not a comparison, and `==` (two signs) has surprises. Both come in the next unit; for now, compare with `===`.

  - id: compare
    kind: prediction
    prompt:
      uk: "Що виведе програма?"
      en: "What does the program print?"
    code: |
      console.log(3 > 2);
      console.log("a" === "b");
      console.log(5 === "5");
      console.log(80 + 45 <= 100);
    verify:
      logs: ["true", "false", "false", "false"]
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "`true`, `false`, `false`, `false`"
            en: "`true`, `false`, `false`, `false`"
        - id: loose
          text:
            uk: "`true`, `false`, `true`, `false`"
            en: "`true`, `false`, `true`, `false`"
          why:
            uk: "`===` порівнює й тип: число `5` і рядок `\"5\"` — різні значення, тож відповідь `false`."
            en: "`===` compares the type too: the number `5` and the string `\"5\"` are different values, so the answer is `false`."
        - id: comparison-first
          text:
            uk: "`true`, `false`, `false`, `true`"
            en: "`true`, `false`, `false`, `true`"
          why:
            uk: "Спершу арифметика: `80 + 45` — це `125`, а `125 <= 100` — неправда."
            en: "Arithmetic comes first: `80 + 45` is `125`, and `125 <= 100` is not true."
        - id: words
          text:
            uk: "`так`, `ні`, `ні`, `ні`"
            en: "`yes`, `no`, `no`, `no`"
          why:
            uk: "JavaScript відповідає значеннями `true` і `false` — це окремий тип, а не слова-текст."
            en: "JavaScript answers with the values `true` and `false` — a type of their own, not words of text."
      correct: [right]
    explanation:
      uk: "Кожне порівняння дає `true` або `false`. `5 === \"5\"` — `false`, бо в значень різні типи. В останньому рядку спершу виконується додавання, а вже потім порівняння: `125 <= 100` — `false`."
      en: "Every comparison gives `true` or `false`. `5 === \"5\"` is `false`, because the values have different types. On the last line the addition runs first and only then the comparison: `125 <= 100` is `false`."

  - id: nothing-values
    kind: explanation
    title:
      uk: "Два види «нічого»"
      en: "Two kinds of “nothing”"
    body:
      uk: |
        Буває, що значення немає. Для цього в JavaScript є два особливі значення — і означають вони різне.

        - [[null]] — **порожньо навмисно**. Його пише програміст, коли значення свідомо немає: у квитків на концерт ще немає ціни, у справи «Написати бабусі» немає терміну.
        - [[undefined]] — **ще не задано**. Його дає сам JavaScript там, де значення ще не надали. Наприклад, у наступному розділі назва, якій не надали значення, дорівнюватиме `undefined`.

        ```js
        console.log("Ціна:", null);
        console.log("Категорія:", undefined);
        ```

        Консоль виведе `Ціна: null` і `Категорія: undefined`. Обидва — «нічого», але `null` каже «ми знаємо, що тут порожньо», а `undefined` — «сюди ще нічого не потрапило».
      en: |
        Sometimes there is no value. JavaScript has two special values for that — and they mean different things.

        - [[null]] — **empty on purpose**. The programmer writes it when there deliberately is no value: the concert tickets have no price yet, the task “Write to grandma” has no due date.
        - [[undefined]] — **not set yet**. JavaScript itself produces it when something has not been given a value. For example, in the next unit a name that was not given a value will be `undefined`.

        ```js
        console.log("Price:", null);
        console.log("Category:", undefined);
        ```

        The console prints `Price: null` and `Category: undefined`. Both mean “nothing”, but `null` says “we know it is empty here”, while `undefined` says “nothing has arrived here yet”.

  - id: type-table
    kind: prediction
    prompt:
      uk: "Оператор [[typeof]] дає назву типу значення — як рядок, наприклад `\"number\"`. Що виведе ця програма?"
      en: "The [[typeof]] operator gives the name of a value’s type — as a string, for example `\"number\"`. What does this program print?"
    code: |
      console.log(typeof 3);
      console.log(typeof "3");
      console.log(typeof true);
      console.log(typeof undefined);
      console.log(typeof null);
      console.log(null === undefined);
    verify:
      logs: ["number", "string", "boolean", "undefined", "object", "false"]
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "`number`, `string`, `boolean`, `undefined`, `object`, `false`"
            en: "`number`, `string`, `boolean`, `undefined`, `object`, `false`"
        - id: null-type
          text:
            uk: "`number`, `string`, `boolean`, `undefined`, `null`, `false`"
            en: "`number`, `string`, `boolean`, `undefined`, `null`, `false`"
          why:
            uk: "Логічно, але ні: `typeof null` дає `\"object\"`. Це стара помилка мови, а не ознака того, що `null` — об’єкт."
            en: "Logical, but no: `typeof null` gives `\"object\"`. It is an old mistake in the language, not a sign that `null` is an object."
        - id: same-nothing
          text:
            uk: "`number`, `string`, `boolean`, `undefined`, `object`, `true`"
            en: "`number`, `string`, `boolean`, `undefined`, `object`, `true`"
          why:
            uk: "`null` і `undefined` — різні значення: «порожньо навмисно» і «ще не задано». `===` їх не плутає."
            en: "`null` and `undefined` are different values: “empty on purpose” and “not set yet”. `===` does not mix them up."
        - id: digit-number
          text:
            uk: "`number`, `number`, `boolean`, `undefined`, `object`, `false`"
            en: "`number`, `number`, `boolean`, `undefined`, `object`, `false`"
          why:
            uk: "`\"3\"` у лапках — рядок, хоч і складається з цифри."
            en: "`\"3\"` in quotes is a string, even though it consists of a digit."
      correct: [right]
    explanation:
      uk: "`3` — число, `\"3\"` — рядок, `true` — булеве значення, а `undefined` має власний тип. Несподіванка — `typeof null`: виходить `\"object\"`, тобто «об’єкт» (так у JavaScript називають складені значення — до них ми дійдемо пізніше). Але `null` — не об’єкт: це стара помилка мови. І `null === undefined` дає `false`: це два різні «нічого». Візуалізація нижче складає ці відповіді в таблицю."
      en: "`3` is a number, `\"3\"` a string, `true` a boolean, and `undefined` has a type of its own. The surprise is `typeof null`: it gives `\"object\"` — JavaScript’s name for compound values, which you will meet later. But `null` is not an object: this is an old mistake in the language. And `null === undefined` is `false`: these are two different kinds of “nothing”. The visual below puts these answers into a table."

  - id: type-rows
    kind: visual
    visual: diagram
    title:
      uk: "Таблиця типів, рядок за рядком"
      en: "A type table, row by row"
    textEquivalent:
      uk: >-
        Таблиця заповнюється по одному рядку за крок. Ліворуч — значення, праворуч — що це насправді, а на
        стрілці між ними — відповідь typeof. 80 дає "number": це число. "80" у лапках дає "string": ті самі
        цифри, але це текст. true дає "boolean": це відповідь «так». Порівняння 80 > 50 теж дає "boolean",
        бо його результат — true. null дає "object" — це стара помилка мови: null не є об’єктом, він
        означає «порожньо навмисно», і перевіряють його порівнянням === null. undefined дає "undefined":
        значення ще не задано. null і undefined — два різні «нічого».
      en: >-
        The table is filled in one row per step. On the left is the value, on the right what it really is,
        and the arrow between them carries the answer of typeof. 80 gives "number": it is a number. "80" in
        quotes gives "string": the same digits, but it is text. true gives "boolean": a “yes” answer. The
        comparison 80 > 50 also gives "boolean", because its result is true. null gives "object" — an old
        mistake in the language: null is not an object, it means “empty on purpose”, and you check for it
        with === null. undefined gives "undefined": the value has not been set yet. null and undefined are
        two different kinds of “nothing”.
    spec:
      layout: grid
      nodes:
        - { id: head-value, label: { uk: "Значення", en: "Value" }, shape: note, col: 0, row: 0 }
        - { id: head-kind, label: { uk: "Що це насправді", en: "What it really is" }, shape: note, col: 1, row: 0 }
        - { id: value-number, label: "80", col: 0, row: 1 }
        - { id: kind-number, label: { uk: "число", en: "a number" }, col: 1, row: 1 }
        - { id: value-string, label: "\"80\"", col: 0, row: 2 }
        - { id: kind-string, label: { uk: "текст", en: "text" }, col: 1, row: 2 }
        - { id: value-boolean, label: "true", col: 0, row: 3 }
        - { id: kind-boolean, label: { uk: "так/ні", en: "yes/no" }, col: 1, row: 3 }
        - { id: value-comparison, label: "80 > 50", col: 0, row: 4 }
        - { id: kind-comparison, label: { uk: "відповідь так/ні", en: "a yes/no answer" }, col: 1, row: 4 }
        - { id: value-null, label: "null", col: 0, row: 5 }
        - { id: kind-null, label: { uk: "порожньо навмисно", en: "empty on purpose" }, col: 1, row: 5 }
        - { id: value-undefined, label: "undefined", col: 0, row: 6 }
        - { id: kind-undefined, label: { uk: "ще не задано", en: "not set yet" }, col: 1, row: 6 }
      edges:
        - { id: head-typeof, from: head-value, to: head-kind, label: "typeof" }
        - { id: typeof-number, from: value-number, to: kind-number, label: "\"number\"" }
        - { id: typeof-string, from: value-string, to: kind-string, label: "\"string\"" }
        - { id: typeof-boolean, from: value-boolean, to: kind-boolean, label: "\"boolean\"" }
        - { id: typeof-comparison, from: value-comparison, to: kind-comparison, label: "\"boolean\"" }
        - { id: typeof-null, from: value-null, to: kind-null, label: "\"object\"" }
        - { id: typeof-undefined, from: value-undefined, to: kind-undefined, label: "\"undefined\"" }
      hidden:
        - value-number
        - kind-number
        - typeof-number
        - value-string
        - kind-string
        - typeof-string
        - value-boolean
        - kind-boolean
        - typeof-boolean
        - value-comparison
        - kind-comparison
        - typeof-comparison
        - value-null
        - kind-null
        - typeof-null
        - value-undefined
        - kind-undefined
        - typeof-undefined
      steps:
        - caption:
            uk: "Таблиця поки порожня. По черзі даватимемо `typeof` різні значення. Його відповідь стоятиме на стрілці, а праворуч — що це за значення насправді."
            en: "The table is empty for now. We will give `typeof` one value after another. Its answer goes on the arrow, and on the right — what the value really is."
        - show: [value-number, kind-number, typeof-number]
          highlight: [value-number, kind-number, typeof-number]
          caption:
            uk: "`typeof 80` дає `\"number\"`: цифри без лапок — це число."
            en: "`typeof 80` gives `\"number\"`: digits without quotes are a number."
        - show: [value-string, kind-string, typeof-string]
          highlight: [value-string, kind-string, typeof-string]
          caption:
            uk: "`typeof \"80\"` дає `\"string\"`. Ті самі цифри, але в лапках — і це вже текст."
            en: "`typeof \"80\"` gives `\"string\"`. The same digits, but in quotes — and now it is text."
        - show: [value-boolean, kind-boolean, typeof-boolean]
          highlight: [value-boolean, kind-boolean, typeof-boolean]
          caption:
            uk: "`typeof true` дає `\"boolean\"`: `true` без лапок — булеве значення, відповідь «так»."
            en: "`typeof true` gives `\"boolean\"`: `true` without quotes is a boolean, a “yes” answer."
        - show: [value-comparison, kind-comparison, typeof-comparison]
          highlight: [value-comparison, kind-comparison, typeof-comparison]
          caption:
            uk: "Порівняння теж дає булеве значення: `typeof (80 > 50)` — це `\"boolean\"`. Дужки потрібні, щоб спершу виконалося порівняння."
            en: "A comparison gives a boolean too: `typeof (80 > 50)` is `\"boolean\"`. The parentheses make the comparison run first."
        - show: [value-null, kind-null, typeof-null]
          highlight: [value-null, kind-null, typeof-null]
          annotate:
            - { id: kind-null, text: { uk: "а не об’єкт", en: "not an object" } }
          caption:
            uk: "Пастка: `typeof null` дає `\"object\"`. Це помилка з першої версії JavaScript, яку вже не виправити, бо зламалися б старі сайти. `null` — не об’єкт, а «порожньо навмисно»; перевіряй його прямо: `=== null`."
            en: "A trap: `typeof null` gives `\"object\"`. It is a mistake from the very first version of JavaScript that can no longer be fixed without breaking old websites. `null` is not an object but “empty on purpose”; check for it directly with `=== null`."
        - show: [value-undefined, kind-undefined, typeof-undefined]
          highlight: [value-null, kind-null, value-undefined, kind-undefined, typeof-undefined]
          caption:
            uk: "`typeof undefined` дає `\"undefined\"`. Тепер видно, що `null` і `undefined` — два різні «нічого»: одне пишуть навмисно, друге означає, що значення ще не задали."
            en: "`typeof undefined` gives `\"undefined\"`. Now you can see that `null` and `undefined` are two different kinds of “nothing”: one is written on purpose, the other means the value has not been set yet."

  - id: type-table-run
    kind: example
    runtime: browser-js
    dir: type-table-run
    entry: index.js
    strings:
      name: { uk: "Навушники", en: "Headphones" }
    title:
      uk: "Таблиця типів у консолі"
      en: "A type table in the console"
    body:
      uk: |
        Кожен рядок виводить тип значення, а поруч — саме значення. Останній рядок — три відповіді на порівняння. Запусти й порівняй із тим, що ти передбачив.
      en: |
        Every line prints the type of a value and, next to it, the value itself. The last line holds three answers to comparisons. Run it and compare with what you predicted.
    tryIt:
      uk: |
        1. У першому рядку візьми в лапки `80`, що стоїть після `typeof`, — тип зміниться на `string`.
        2. Заміни `false` у третьому рядку на `"false"` (у лапках): що тепер покаже `typeof`?
        3. Допиши рядок `console.log(typeof (80 > 50));`. Який тип у відповіді на порівняння? Потім прибери дужки й запусти ще раз: вийде `false`. Без дужок `typeof` спрацьовує першим, і JavaScript порівнює текст `"number"` з числом `50` — таке питання не має сенсу, тож відповідь «ні».
      en: |
        1. On the first line, put the `80` that follows `typeof` in quotes — the type changes to `string`.
        2. Replace `false` on the third line with `"false"` (in quotes): what does `typeof` show now?
        3. Add the line `console.log(typeof (80 > 50));`. What type does a comparison’s answer have? Then remove the parentheses and run again: you get `false`. Without them `typeof` runs first, and JavaScript compares the text `"number"` with the number `50` — a question that makes no sense, so the answer is “no”.

  - id: wish-questions
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: wish-questions
    entry: index.js
    strings:
      tech: { uk: "Техніка", en: "Tech" }
    title:
      uk: "Питання до списку бажань"
      en: "Questions about the wishlist"
    instructions:
      uk: |
        Ось два записи зі списку бажань:

        | Бажання | Ціна | Категорія |
        |---|---|---|
        | Навушники | `80` | `"Техніка"` |
        | Квитки на концерт | `null` | `null` |

        Виведи відповіді на три питання — кожну окремим `console.log` з одним порівнянням. Підстав у порівняння значення з таблиці.

        1. Чи вкладаються навушники в бюджет `100`, тобто чи їхня ціна не більша за `100`?
        2. Чи в навушників немає категорії (вона `null`)?
        3. Чи в квитків на концерт немає категорії?
      en: |
        Here are two records from the wishlist:

        | Wish | Price | Category |
        |---|---|---|
        | Headphones | `80` | `"Tech"` |
        | Concert tickets | `null` | `null` |

        Print the answers to three questions — each with its own `console.log` holding one comparison. Use the values from the table in the comparisons.

        1. Do the headphones fit a budget of `100` — that is, is their price at most `100`?
        2. Is the category of the headphones missing (is it `null`)?
        3. Is the category of the concert tickets missing?
    testTitles:
      "prints three answers":
        uk: "Програма виводить три відповіді"
        en: "The program prints three answers"
      "the answers are true or false, not text":
        uk: "Відповіді — true або false, а не текст"
        en: "The answers are true or false, not text"
      "answer 1 is right":
        uk: "Відповідь 1 правильна: чи вкладаються навушники в бюджет 100"
        en: "Answer 1 is right: do the headphones fit a budget of 100"
      "answer 2 is right":
        uk: "Відповідь 2 правильна: чи бракує категорії навушникам"
        en: "Answer 2 is right: is the headphones’ category missing"
      "answer 3 is right":
        uk: "Відповідь 3 правильна: чи бракує категорії квиткам"
        en: "Answer 3 is right: is the tickets’ category missing"
    hints:
      nudge:
        uk: "Кожне питання — одне порівняння. Який оператор відповідає на «не більша за»? А на «дорівнює»?"
        en: "Every question is one comparison. Which operator answers “at most”? And “equal to”?"
      explanation:
        uk: "«Не більша за» — це `<=`: ліворуч ціна з таблиці, праворуч бюджет. «Немає категорії» означає, що категорія дорівнює `null`. Тож порівнюй значення категорії з таблиці з `null` через `===` (три знаки рівності) і пиши `null` без лапок."
        en: "“At most” is `<=`: the price from the table on the left, the budget on the right. “No category” means the category equals `null`. So compare the category value from the table with `null` using `===` (three equals signs), and write `null` without quotes."
    solutionNote:
      uk: "Порівняння самі дають `true` чи `false`. Для навушників `\"Техніка\" === null` — `false`, бо категорія є; для квитків `null === null` — `true`. У наступному розділі значення з таблиці отримають назви, а порівняння залишаться такими самими."
      en: "The comparisons produce `true` or `false` by themselves. For the headphones, `\"Tech\" === null` is `false`, because there is a category; for the tickets, `null === null` is `true`. In the next unit the values from the table get names, and the comparisons stay the same."
    feedback:
      - when: { test: "prints three answers" }
        message:
          uk: "Потрібно три рядки в консолі — по одному `console.log` на кожне питання."
          en: "The console needs three lines — one `console.log` per question."
      - when: { test: "the answers are true or false, not text" }
        message:
          uk: "Відповідь має обчислити порівняння, а не бути словом у лапках: `\"true\"` — це текст. Напиши порівняння, наприклад `80 > 50`, і JavaScript сам дасть `true` або `false`."
          en: "The answer must come from a comparison, not from a word in quotes: `\"true\"` is text. Write a comparison such as `80 > 50`, and JavaScript gives `true` or `false` by itself."
      - when: { test: "answer 1 is right" }
        message:
          uk: "Перше питання — чи ціна навушників `80` не більша за бюджет `100`. Перевір оператор і порядок: «не більша за» — це `<=`, ціна ліворуч, бюджет праворуч."
          en: "The first question is whether the headphones’ price `80` is at most the budget `100`. Check the operator and the order: “at most” is `<=`, with the price on the left and the budget on the right."
      - when: { test: "answer 2 is right" }
        message:
          uk: "Категорія навушників — `\"Техніка\"`, тобто вона є. Порівняння цього значення з `null` має дати `false`."
          en: "The headphones’ category is `\"Tech\"`, so there is one. Comparing that value with `null` must give `false`."
      - when: { test: "answer 3 is right" }
        message:
          uk: "Категорія квитків — `null`, тож порівнюй саме з `null`. `null` і `undefined` — різні значення (`null === undefined` дає `false`), а `\"null\"` у лапках — це текст."
          en: "The tickets’ category is `null`, so compare with `null` itself. `null` and `undefined` are different values (`null === undefined` is `false`), and `\"null\"` in quotes is text."

  - id: to-project
    kind: transfer
    capstoneStep: JS-01
    body:
      uk: "У записах твого проєкту теж бувають поля, порожні навмисно: бажання без ціни, справа без терміну. У коді це `null`. А питання на кшталт «чи виконано?» чи «чи вкладаюся в бюджет?» матимуть відповіді `true` або `false`."
      en: "The records of your project have deliberately empty fields too: a wish without a price, a task without a due date. In code that is `null`. And questions like “is it done?” or “do I fit the budget?” will have the answers `true` or `false`."
