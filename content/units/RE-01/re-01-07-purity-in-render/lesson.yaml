id: re-01-07-purity-in-render
unit: RE-01
title:
  uk: "Рендер має бути чистим"
  en: "Keep render pure"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Помічати побічні ефекти в тілі компонента (зміна prop чи зовнішньої змінної, запис у сховище, випадкові чи годинникові значення у виводі) і пояснювати, чому вони ламають повторні рендери."
    en: "Spot side effects in a component body (mutating a prop or an outer variable, writing to storage, random or clock values in the output) and explain why they break repeated renders."
  - uk: "Виносити таку роботу з рендеру: обчислювати з props або переносити в обробник події (RE-02) чи ефект (RE-03)."
    en: "Move such work out of render: compute it from props, or defer it to an event handler (RE-02) or an effect (RE-03)."
prerequisites: [re-01-06-render-vs-commit, js-03-07-pure-vs-side-effects]
subskills:
  - { family: R-01, skill: "function components/purity", depth: practice }
glossary: [render-purity]
selfCheck: [two-renders, sorted-copy]

blocks:
  - id: render-may-repeat
    kind: explanation
    title:
      uk: "React може викликати компонент будь-коли"
      en: "React may call a component at any time"
    body:
      uk: |
        Ти вже бачив: React викликає компонент і тоді, коли змінились не його дані, а дані батька, — і навіть коли не змінилось нічого. Скільки разів виконається функція, вирішуєш не ти.

        Звідси головне правило: рендер має бути [[pure-function|чистою функцією]] від props — [[render-purity|чистий рендер]]. Однакові props → однаковий JSX, і жодних змін того, що існувало до виклику.

        Що вважається побічним ефектом у тілі компонента:

        - зміна props або масивів чи об’єктів, що прийшли через них (`push`, `sort`, присвоєння полю);
        - зміна змінних модуля, тобто оголошених поза компонентом;
        - запис у `localStorage`, зміна DOM вручну, запити в мережу;
        - `Math.random()` чи поточний час у тому, що компонент повертає.

        Змінювати те, що компонент **сам створив під час цього виклику**, — можна: локальний масив, новий об’єкт.
      en: |
        You have seen it already: React calls a component also when not its own data changed but its parent’s — and even when nothing changed at all. How many times the function runs is not up to you.

        Hence the main rule: render must be a [[pure-function]] of the props — [[render-purity|pure render]]. The same props → the same JSX, and no changes to anything that existed before the call.

        What counts as a side effect in a component body:

        - changing the props or the arrays and objects that came through them (`push`, `sort`, assigning a field);
        - changing module variables, i.e. those declared outside the component;
        - writing to `localStorage`, changing the DOM by hand, network requests;
        - `Math.random()` or the current time in what the component returns.

        Changing what the component **itself created during this call** is fine: a local array, a new object.

  - id: two-renders
    kind: prediction
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      want: { uk: "Хочу", en: "I want" }
    prompt:
      uk: "`main.jsx` двічі поспіль викликає `root.render(<WantedLine wishes={wishes} />)` з тими самими даними. Що буде в абзаці після другого рендеру?"
      en: "`main.jsx` calls `root.render(<WantedLine wishes={wishes} />)` twice in a row with the same data. What does the paragraph say after the second render?"
    lang: jsx
    runnable: false
    code: |
      const wishes = [
        { id: "w-01", name: "%%headphones%%", acquired: false },
        { id: "w-02", name: "%%lamp%%", acquired: false },
        { id: "w-04", name: "%%book%%", acquired: true },
      ];

      const wanted = [];

      function WantedLine({ wishes }) {
        for (const wish of wishes) {
          if (!wish.acquired) wanted.push(wish.name);
        }
        return <p>%%want%%: {wanted.join(", ")}</p>;
      }
    answer:
      type: choice
      options:
        - id: doubled
          text: { uk: "«Хочу: Навушники, Настільна лампа, Навушники, Настільна лампа»", en: "“I want: Headphones, Desk lamp, Headphones, Desk lamp”" }
        - id: once
          text: { uk: "«Хочу: Навушники, Настільна лампа»", en: "“I want: Headphones, Desk lamp”" }
          why:
            uk: "Так було б, якби рендер виконався один раз або масив створювався всередині функції. Але `wanted` живе поза компонентом і накопичує імена з кожного рендеру."
            en: "That would be so if render ran once or the array were created inside the function. But `wanted` lives outside the component and collects names from every render."
        - id: with-book
          text: { uk: "«Хочу: Навушники, Настільна лампа, Книжка про JavaScript»", en: "“I want: Headphones, Desk lamp, A book about JavaScript”" }
          why:
            uk: "`if (!wish.acquired)` пропускає отримані бажання, тож «Книжка» туди не потрапляє ні разу."
            en: "`if (!wish.acquired)` skips acquired wishes, so “A book” never gets there."
      correct: [doubled]
    explanation:
      uk: "Кожен рендер додає два імені в той самий масив модуля. Після другого рендеру в ньому чотири імені, і саме їх показує абзац. Перший рендер виглядав правильно — і саме тому таку помилку легко пропустити."
      en: "Every render adds two names to the same module array. After the second render it holds four names, and that is what the paragraph shows. The first render looked right — which is exactly why such a bug is easy to miss."

  - id: pure-vs-impure
    kind: visual
    visual: render-timeline
    strings:
      want: { uk: "Хочу", en: "I want" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    title:
      uk: "Два рендери з тими самими props"
      en: "Two renders with the same props"
    textEquivalent:
      uk: "Компонент WantedLine рендериться двічі з тими самими props — тим самим масивом із трьох бажань. У першому рендері він додає два імені в масив wanted, оголошений поза компонентом, і commit показує «Навушники, Настільна лампа». У другому рендері props ті самі, але wanted уже має два імені, і компонент додає ще два: commit показує чотири імені. Однакові props дали різний результат — рендер нечистий. Чиста версія обчислює список у самому рендері: const names = wishes.filter(…).map(…). Новий масив створюється при кожному виклику, тож обидва рендери повертають той самий абзац."
      en: "The component WantedLine renders twice with the same props — the same array of three wishes. In the first render it adds two names to the array wanted, declared outside the component, and the commit shows “Headphones, Desk lamp”. In the second render the props are the same, but wanted already holds two names, and the component adds two more: the commit shows four names. Equal props gave a different result — the render is impure. A pure version computes the list inside the render: const names = wishes.filter(…).map(…). A new array is created on every call, so both renders return the same paragraph."
    spec:
      component: WantedLine
      code: |
        const wanted = [];

        function WantedLine({ wishes }) {
          for (const wish of wishes) {
            if (!wish.acquired) wanted.push(wish.name);
          }
          return <p>%%want%%: {wanted.join(", ")}</p>;
        }
      steps:
        - phase: render
          render: 1
          line: 5
          reason: { uk: "перший root.render", en: "the first root.render" }
          snapshot: { props: { "wishes.length": 3 } }
          caption:
            uk: "Рендер 1: цикл додає в `wanted` два імені. `wanted` оголошено поза функцією — це вже зміна чогось, що існувало до виклику."
            en: "Render 1: the loop adds two names to `wanted`. `wanted` is declared outside the function — this already changes something that existed before the call."
        - phase: commit
          render: 1
          dom: "<p>%%want%%: %%headphones%%, %%lamp%%</p>"
          caption:
            uk: "Commit 1: на екрані два імені. Поки все виглядає правильно."
            en: "Commit 1: two names on the screen. So far everything looks right."
        - phase: render
          render: 2
          line: 5
          reason: { uk: "root.render з тими самими даними", en: "root.render with the same data" }
          snapshot: { props: { "wishes.length": 3 } }
          caption:
            uk: "Рендер 2: props **ті самі**, але `wanted` пам’ятає минулий рендер — і цикл додає ще два імені."
            en: "Render 2: the props are **the same**, but `wanted` remembers the last render — and the loop adds two more names."
        - phase: commit
          render: 2
          dom: "<p>%%want%%: %%headphones%%, %%lamp%%, %%headphones%%, %%lamp%%</p>"
          caption:
            uk: "Commit 2: чотири імені. Однакові props — різний результат: рендер нечистий. Чиста версія створює масив усередині: `const names = wishes.filter((wish) => !wish.acquired).map((wish) => wish.name);` — і кожен рендер дає той самий абзац."
            en: "Commit 2: four names. Equal props — a different result: the render is impure. A pure version creates the array inside: `const names = wishes.filter((wish) => !wish.acquired).map((wish) => wish.name);` — and every render gives the same paragraph."

  - id: growing-line
    kind: example
    runtime: browser-react
    dir: growing-line
    entry: main.jsx
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      want: { uk: "Хочу", en: "I want" }
      again: { uk: "Рендер ще раз", en: "Render again" }
    title:
      uk: "Рядок, що росте"
      en: "A line that grows"
    body:
      uk: |
        Це компонент із прогнозу. Кнопка «Рендер ще раз» знову викликає `root.render` з **тими самими** бажаннями. Натисни **Запустити**, а тоді кілька разів натисни кнопку на вкладці **Сторінка**.
      en: |
        This is the component from the prediction. The “Render again” button calls `root.render` again with **the same** wishes. Press **Run**, then press the button a few times on the **Page** tab.
    tryIt:
      uk: |
        1. Кожне натискання додає в абзац ще два імені, хоча дані не змінювались.
        2. Виправ `WantedLine.jsx`: видали рядок `const wanted = [];` і цикл, а першим рядком компонента напиши `const wanted = wishes.filter((wish) => !wish.acquired).map((wish) => wish.name);`. Запусти й натискай кнопку: абзац лишається тим самим, а в консолі після кожного натискання — рядок `render WantedLine`. Компонент виконується, але результат не залежить від того, скільки разів.
      en: |
        1. Every press adds two more names to the paragraph, although the data did not change.
        2. Fix `WantedLine.jsx`: delete the line `const wanted = [];` and the loop, and as the component’s first line write `const wanted = wishes.filter((wish) => !wish.acquired).map((wish) => wish.name);`. Run and press the button: the paragraph stays the same, and the console gets a `render WantedLine` line after every press. The component runs, but its result does not depend on how many times.

  - id: where-it-goes
    kind: explanation
    title:
      uk: "Куди перенести побічний ефект"
      en: "Where a side effect goes"
    body:
      uk: |
        | Що робить код у рендері | Куди перенести |
        |---|---|
        | обчислює список, суму, текст | лишити в рендері, але з **нових** значень: `filter`, `map`, `toSorted`, `[...items]` |
        | змінює props чи змінну модуля | обчислити нове значення з props; змінювати дані — справа того, хто ними володіє |
        | реагує на дію людини (клік, введення) | обробник події — у наступному розділі |
        | синхронізує щось поза React (сховище, таймер, назва вкладки) | ефект — у розділі після нього |
        | `Math.random()`, `Date.now()` у виводі | отримати значення один раз поза рендером і передати через props |

        Найпідступніша зміна — непомітна: `sort` і `reverse` змінюють масив, на якому їх викликали. Якщо це масив із props, ти змінив дані батька. Для рендеру є версії, що повертають копію: `toSorted`, `toReversed`.
      en: |
        | What the code does in render | Where it goes |
        |---|---|
        | computes a list, a sum, a text | stays in render, but from **new** values: `filter`, `map`, `toSorted`, `[...items]` |
        | changes props or a module variable | compute a new value from the props; changing the data is the job of whoever owns it |
        | reacts to a person’s action (a click, typing) | an event handler — in the next unit |
        | synchronizes something outside React (storage, a timer, the tab title) | an effect — in the unit after it |
        | `Math.random()`, `Date.now()` in the output | get the value once outside render and pass it through props |

        The sneakiest change is invisible: `sort` and `reverse` change the array they are called on. If that is an array from props, you changed the parent’s data. For render there are versions that return a copy: `toSorted`, `toReversed`.

  - id: recall-purity-sort
    kind: review
    strings:
      lamp: { uk: "Лампа", en: "Lamp" }
      mug: { uk: "Чашка", en: "Mug" }
    title:
      uk: "Згадай: чисті функції й sort"
      en: "Recall: pure functions and sort"
    items:
      - id: sort-in-place
        from: js-05-05-sorting-comparator
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const prices = [45, 18, 240];
          const sorted = prices.sort((a, b) => a - b);
          console.log(prices, sorted === prices);
        verify: { logs: ["[18, 45, 240] true"] }
        answer:
          type: choice
          options:
            - id: same-array
              code: "[18, 45, 240] true"
            - id: copy
              code: "[45, 18, 240] false"
              why:
                uk: "`sort` не робить копію: він переставляє елементи в самому масиві й повертає той самий масив. Копію дає `toSorted`."
                en: "`sort` makes no copy: it reorders the elements in the array itself and returns that same array. `toSorted` gives a copy."
            - id: sorted-but-copy
              code: "[18, 45, 240] false"
              why:
                uk: "`sort` повертає посилання на той самий масив, тож `sorted === prices` — `true`."
                en: "`sort` returns a reference to the same array, so `sorted === prices` is `true`."
          correct: [same-array]
        explanation:
          uk: "`sort` змінює масив, на якому його викликали, і повертає його ж. У рендері це означає змінити props батька."
          en: "`sort` changes the array it was called on and returns that same array. In render that means changing the parent’s props."
      - id: is-it-pure
        from: js-03-07-pure-vs-side-effects
        prompt:
          uk: "Яка з функцій чиста?"
          en: "Which of these functions is pure?"
        answer:
          type: choice
          options:
            - id: label-fn
              code: "function label(wish) {\n  return `${wish.name}: ${wish.price}`;\n}"
            - id: count-fn
              code: "let calls = 0;\nfunction label(wish) {\n  calls += 1;\n  return wish.name;\n}"
              why:
                uk: "Функція змінює змінну `calls`, оголошену поза нею, — це побічний ефект, навіть якщо результат той самий."
                en: "The function changes the variable `calls` declared outside it — a side effect, even if the result is the same."
            - id: stamp-fn
              code: "function label(wish) {\n  return `${wish.name} (${Date.now()})`;\n}"
              why:
                uk: "Результат залежить від часу виклику: ті самі аргументи дають різний текст."
                en: "The result depends on when it is called: the same arguments give different text."
          correct: [label-fn]
        explanation:
          uk: "Чиста функція з тих самих аргументів завжди повертає те саме й нічого не змінює поза собою. Компонент React — це саме така функція від props."
          en: "A pure function always returns the same result for the same arguments and changes nothing outside itself. A React component is exactly such a function of its props."

  - id: sorted-copy
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: sorted-copy
    entry: main.jsx
    editable: [TaskList.jsx]
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      noDue: { uk: "без терміну", en: "no due date" }
      again: { uk: "Рендер ще раз", en: "Render again" }
      asWritten: { uk: "Як записано", en: "As written" }
      byDue: { uk: "За терміном", en: "By due date" }
    title:
      uk: "Сортуй копію"
      en: "Sort a copy"
    instructions:
      uk: |
        Сторінка показує справи двічі: «Як записано» — у порядку масиву, «За терміном» — відсортовані компонентом `TaskList`. Запусти й натисни «Рендер ще раз»: список «Як записано» теж став відсортованим. `TaskList` сортує масив, який отримав через props, на місці.

        Виправ `TaskList.jsx`, щоб він сортував **копію**, а масив із props лишав у його порядку. Порівняння `compareByDueDate` вже готове.

        Перевірка малює `TaskList` з власним масивом і дивиться, чи той масив не змінився, а тоді натискає кнопку на сторінці.
      en: |
        The page shows the tasks twice: “As written” in the array’s order and “By due date” sorted by the `TaskList` component. Run it and press “Render again”: the “As written” list became sorted too. `TaskList` sorts the array it got through props in place.

        Fix `TaskList.jsx` so that it sorts a **copy** and leaves the props array in its order. The comparison `compareByDueDate` is ready.

        The check draws `TaskList` with its own array and looks whether that array changed, then presses the button on the page.
    testTitles:
      "TaskList shows the tasks by due date, without a date last":
        uk: "`TaskList` показує справи за терміном, без терміну — в кінці"
        en: "`TaskList` shows the tasks by due date, those without one last"
      "TaskList leaves the array it was given in its order":
        uk: "`TaskList` лишає отриманий масив у його порядку"
        en: "`TaskList` leaves the array it got in its order"
      "the list as written keeps its order after a re-render":
        uk: "Список «Як записано» не змінює порядку після повторного рендеру"
        en: "The list “As written” keeps its order after a re-render"
    hints:
      nudge:
        uk: "Який метод масиву повертає новий відсортований масив, не чіпаючи старого? А якщо такого не знаєш — як зробити копію, яку вже можна сортувати?"
        en: "Which array method returns a new sorted array without touching the old one? And if you do not know one — how do you make a copy that you are free to sort?"
      explanation:
        uk: |
          Нова змінна — ще не новий масив: `const copy = items;` вказує на той самий масив. Новий масив дають `[...items]`, `items.slice()` або методи, що повертають копію. Наприклад, перевернути витрати, не чіпаючи оригіналу:

          ```js
          const newestFirst = expenses.toReversed();
          ```
        en: |
          A new variable is not a new array: `const copy = items;` points to the same array. A new array comes from `[...items]`, `items.slice()` or methods that return a copy. For example, reversing expenses without touching the original:

          ```js
          const newestFirst = expenses.toReversed();
          ```
    solutionNote:
      uk: "`toSorted` повертає новий відсортований масив, а масив із props лишається таким, яким його передав батько. Тепер `TaskList` чистий: кожен рендер з тими самими props дає той самий список і нічого не змінює поза собою. `[...tasks].sort(…)` і `tasks.slice().sort(…)` працюють так само."
      en: "`toSorted` returns a new sorted array, and the props array stays as the parent passed it. Now `TaskList` is pure: every render with the same props gives the same list and changes nothing outside itself. `[...tasks].sort(…)` and `tasks.slice().sort(…)` work the same way."
    feedback:
      - when: { test: "TaskList leaves the array it was given in its order" }
        message:
          uk: "Ця перевірка передає в `TaskList` власний масив і після рендеру чекає його в початковому порядку. Якщо порядок змінився, `sort` викликано на масиві з props — або на змінній, що вказує на той самий масив."
          en: "This check passes its own array to `TaskList` and after the render expects it in its original order. If the order changed, `sort` was called on the props array — or on a variable that points to the same array."
      - when: { test: "TaskList shows the tasks by due date, without a date last" }
        message:
          uk: "Ця перевірка чекає в `TaskList` порядок C, A, B: спершу раніші терміни, справа без терміну — остання. Якщо порядок такий, як у масиві, копію створено, але не відсортовано."
          en: "This check expects the order C, A, B in `TaskList`: earlier due dates first, the task without a due date last. If the order is as in the array, the copy was made but not sorted."
      - when: { test: "the list as written keeps its order after a re-render" }
        message:
          uk: "Ця перевірка натискає «Рендер ще раз» і чекає, що список «Як записано» й масив у `tasks.js` лишились у початковому порядку."
          en: "This check presses “Render again” and expects the list “As written” and the array in `tasks.js` to stay in their original order."

  - id: to-project
    kind: transfer
    capstoneStep: RE-01
    body:
      uk: "У проєкті доменні функції — `summarize…`, `count…` — уже чисті, тож компоненти можуть просто викликати їх у рендері. Стеж лише, щоб сам компонент не сортував і не змінював записи на місці: потрібен інший порядок — бери копію."
      en: "In the project the domain functions — `summarize…`, `count…` — are already pure, so components can simply call them in render. Just make sure the component itself does not sort or change records in place: if you need another order, take a copy."
