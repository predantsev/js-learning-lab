id: re-01-01-why-components
unit: RE-01
title:
  uk: "UI як функція від даних: компоненти"
  en: "UI as a function of data: components"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Намалювати дерево компонентів сторінки за її JSX і назвати функцію за кожним прямокутником."
    en: "Draw the component tree of a rendered page from its JSX and name the function behind each box."
  - uk: "Написати функціональний компонент, що повертає розмітку, обчислену зі сталого списку записів."
    en: "Write a function component that returns markup computed from a constant fixture list."
  - uk: "Пояснити, чим компонент відрізняється від власноруч написаної `render(records)`: він повертає опис інтерфейсу, а DOM оновлює React."
    en: "Explain how a component differs from the hand-written render(records) function: it returns a description of the UI and React updates the DOM."
prerequisites: [js-06-13-render-list-from-data, js-03-01-functions-and-return]
subskills:
  - { family: R-01, skill: "function components/purity", depth: intro }
glossary: [component, component-tree]
selfCheck: [count-the-cards, summary]

blocks:
  - id: describe-not-build
    kind: explanation
    title:
      uk: "Описуєш, а не будуєш"
      en: "You describe, you do not build"
    body:
      uk: |
        У розділі про DOM ти писав `render(records)`: створити вузли через `createElement`, заповнити `textContent`, поставити на сторінку через `replaceChildren`. Кожен крок — твоя робота.

        React пропонує інший поділ праці. Ти пишеш звичайну функцію, яка **повертає опис** того, що має бути на екрані:

        ```jsx
        function Greeting() {
          return <h1>Привіт!</h1>;
        }
        ```

        Така функція — це [[component|компонент]]. `<h1>Привіт!</h1>` усередині JavaScript — не рядок і не HTML, а **JSX**: короткий запис опису елемента (його правила — у наступному уроці). Вузли DOM із цього опису створює й оновлює вже React.

        Дві домовленості, без яких нічого не запрацює:

        - назва компонента починається з **великої літери**: `Greeting`, а не `greeting`;
        - компонент не викликають як `Greeting()`, його **використовують як тег**: `<Greeting />`. Викликати функцію буде React.
      en: |
        In the DOM unit you wrote `render(records)`: create nodes with `createElement`, fill them with `textContent`, put them on the page with `replaceChildren`. Every step was your job.

        React suggests a different split of the work. You write an ordinary function that **returns a description** of what should be on the screen:

        ```jsx
        function Greeting() {
          return <h1>Hello!</h1>;
        }
        ```

        Such a function is a [[component]]. `<h1>Hello!</h1>` inside JavaScript is not a string and not HTML but **JSX**: a short way to write the description of an element (its rules are in the next lesson). React itself creates and updates the DOM nodes from that description.

        Two conventions without which nothing works:

        - a component’s name starts with a **capital letter**: `Greeting`, not `greeting`;
        - you do not call a component as `Greeting()`, you **use it as a tag**: `<Greeting />`. React is the one that calls the function.

  - id: count-the-cards
    kind: prediction
    strings:
      title: { uk: "Мої бажання", en: "My wishes" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    prompt:
      uk: "Сторінку малює `App`. Функція `RecordCard` написана один раз і щоразу пише в консоль. Що буде в консолі й скільки пунктів списку (`<li>`) з’явиться на сторінці?"
      en: "`App` draws the page. The function `RecordCard` is written once and prints to the console every time it runs. What appears in the console, and how many list items (`<li>`) appear on the page?"
    lang: jsx
    runnable: false
    code: |
      function Header() {
        return <h1>%%title%%</h1>;
      }

      function RecordCard() {
        console.log("RecordCard runs");
        return <li>%%lamp%%</li>;
      }

      function RecordList() {
        return (
          <ul>
            <RecordCard />
            <RecordCard />
            <RecordCard />
          </ul>
        );
      }

      function App() {
        return (
          <main>
            <Header />
            <RecordList />
          </main>
        );
      }
    answer:
      type: choice
      options:
        - id: three-and-three
          text:
            uk: "Три рядки `RecordCard runs` і три пункти «Настільна лампа»"
            en: "Three lines `RecordCard runs` and three items “Desk lamp”"
        - id: once-pasted
          text:
            uk: "Один рядок `RecordCard runs` і три однакові пункти: React один раз отримує шматок HTML і вставляє його тричі"
            en: "One line `RecordCard runs` and three identical items: React gets a piece of HTML once and pastes it three times"
          why:
            uk: "Компонент — не шматок HTML, а функція. Кожен тег `<RecordCard />` — окреме використання, і для кожного React викликає функцію знову: три теги — три виклики."
            en: "A component is not a piece of HTML but a function. Every `<RecordCard />` tag is a separate use, and React calls the function again for each of them: three tags, three calls."
        - id: one-and-one
          text:
            uk: "Один рядок і один пункт: функцію написано один раз"
            en: "One line and one item: the function is written once"
          why:
            uk: "Скільки разів функцію *написано*, не важить. Важить, скільки разів її *використано* в JSX — тут тричі."
            en: "How many times a function is *written* does not matter. What matters is how many times it is *used* in JSX — three times here."
        - id: nothing-called
          text:
            uk: "Нічого: ніде в коді немає виклику `RecordCard()`"
            en: "Nothing: there is no call `RecordCard()` anywhere in the code"
          why:
            uk: "Виклику з дужками справді немає — його робить React, коли зустрічає `<RecordCard />` в описі, який повернув `RecordList`."
            en: "There is indeed no call with parentheses — React makes it when it meets `<RecordCard />` in the description returned by `RecordList`."
      correct: [three-and-three]
    explanation:
      uk: "React викликає `App`, бачить у його описі `<Header />` і `<RecordList />` і викликає ці функції. У описі `RecordList` — три `<RecordCard />`, тож `RecordCard` виконується тричі: три рядки в консолі, три `<li>` на сторінці. Одна функція — скільки завгодно використань."
      en: "React calls `App`, sees `<Header />` and `<RecordList />` in its description and calls those functions. The description from `RecordList` has three `<RecordCard />`, so `RecordCard` runs three times: three lines in the console, three `<li>` on the page. One function, as many uses as you like."

  - id: tree
    kind: visual
    visual: diagram
    title:
      uk: "Дерево компонентів і вузли DOM"
      en: "The component tree and the DOM nodes"
    textEquivalent:
      uk: "Ліворуч — дерево компонентів зі сторінки бажань. Угорі App. Його опис містить Header і RecordList, тож це дві його дочірні гілки. Опис RecordList містить три RecordCard — три окремі гілки, три виклики однієї функції. Праворуч — вузли DOM, які React створює з цих описів: App дає елемент main, Header — заголовок h1, RecordList — список ul, а кожен RecordCard — свій пункт li. Кожен прямокутник дерева — одна функція, викликана React; самі функції DOM не чіпають, вони лише повертають опис."
      en: "On the left is the component tree of the wish page. App is at the top. Its description contains Header and RecordList, so they are its two child branches. The description from RecordList contains three RecordCard — three separate branches, three calls of one function. On the right are the DOM nodes React creates from those descriptions: App gives the main element, Header the h1 heading, RecordList the ul list, and every RecordCard its own li item. Every box of the tree is one function called by React; the functions themselves do not touch the DOM, they only return a description."
    spec:
      layout: grid
      groups:
        - { id: tree, label: { uk: "Компоненти (функції)", en: "Components (functions)" } }
        - { id: dom, label: { uk: "Вузли DOM", en: "DOM nodes" } }
      nodes:
        - { id: app, group: tree, label: "App", col: 0, row: 0 }
        - { id: header, group: tree, label: "Header", col: 0, row: 1 }
        - { id: list, group: tree, label: "RecordList", col: 0, row: 2 }
        - { id: card1, group: tree, label: "RecordCard", col: 0, row: 3 }
        - { id: card2, group: tree, label: "RecordCard", col: 0, row: 4 }
        - { id: card3, group: tree, label: "RecordCard", col: 0, row: 5 }
        - { id: main, group: dom, label: "<main>", shape: round, col: 1, row: 0 }
        - { id: h1, group: dom, label: "<h1>", shape: round, col: 1, row: 1 }
        - { id: ul, group: dom, label: "<ul>", shape: round, col: 1, row: 2 }
        - { id: li1, group: dom, label: "<li>", shape: round, col: 1, row: 3 }
        - { id: li2, group: dom, label: "<li>", shape: round, col: 1, row: 4 }
        - { id: li3, group: dom, label: "<li>", shape: round, col: 1, row: 5 }
      edges:
        - { from: app, to: main, kind: dashed }
        - { from: header, to: h1, kind: dashed }
        - { from: list, to: ul, kind: dashed }
        - { from: card1, to: li1, kind: dashed }
        - { from: card2, to: li2, kind: dashed }
        - { from: card3, to: li3, kind: dashed }
      steps:
        - caption:
            uk: "Ліворуч — дерево компонентів: хто кого використовує у своєму описі. Праворуч — вузли DOM, які з цих описів створює React."
            en: "On the left is the component tree: who uses whom in its description. On the right are the DOM nodes React creates from those descriptions."
        - caption:
            uk: "`App` — корінь дерева. Його функція повертає `<main>` із `<Header />` і `<RecordList />` усередині, тож React бере ці дві функції наступними."
            en: "`App` is the root of the tree. Its function returns `<main>` with `<Header />` and `<RecordList />` inside, so React takes these two functions next."
          highlight: [app, main, app->main]
          dim: [card1, card2, card3, li1, li2, li3]
        - caption:
            uk: "`Header` повертає опис заголовка — у DOM з’являється `<h1>`."
            en: "`Header` returns the description of a heading — an `<h1>` appears in the DOM."
          highlight: [header, h1, header->h1]
          dim: [card1, card2, card3, li1, li2, li3]
        - caption:
            uk: "`RecordList` повертає `<ul>` і три `<RecordCard />`. Три теги — три окремі гілки дерева."
            en: "`RecordList` returns a `<ul>` and three `<RecordCard />`. Three tags, three separate branches of the tree."
          highlight: [list, ul, list->ul, card1, card2, card3]
        - caption:
            uk: "Для кожної гілки React викликає `RecordCard` окремо — тому в консолі три рядки — і кожен виклик дає свій `<li>`."
            en: "React calls `RecordCard` separately for every branch — which is why the console has three lines — and every call gives its own `<li>`."
          highlight: [card1, card2, card3, li1, li2, li3, card1->li1, card2->li2, card3->li3]
          dim: [app, header, main, h1]

  - id: task-page
    kind: example
    runtime: browser-react
    dir: task-page
    entry: main.jsx
    strings:
      heading: { uk: "Справи", en: "Tasks" }
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
    title:
      uk: "Сторінка йде за даними"
      en: "The page follows the data"
    body:
      uk: |
        Три файли:

        - `tasks.js` — дані: масив справ;
        - `App.jsx` — компоненти `App`, `Header` і `TaskList`; `TaskList` робить по пункту `<li>` на кожну справу через знайомий `map`. Фігурні дужки `{…}` вставляють у JSX значення JavaScript;
        - `main.jsx` — один рядок, що каже React намалювати `<App />` у `<div id="root">` сторінки.

        Натисни **Запустити** й подивись на вкладку **Сторінка**. У коді немає жодного `createElement`, `textContent` чи `append` — і все одно три справи на місці.
      en: |
        Three files:

        - `tasks.js` — the data: an array of tasks;
        - `App.jsx` — the components `App`, `Header` and `TaskList`; `TaskList` makes one `<li>` per task with the familiar `map`. Curly braces `{…}` put a JavaScript value into JSX;
        - `main.jsx` — one line that tells React to draw `<App />` inside the page’s `<div id="root">`.

        Press **Run** and look at the **Page** tab. The code has no `createElement`, `textContent` or `append` at all — and still the three tasks are there.
    tryIt:
      uk: |
        1. У `tasks.js` видали другий об’єкт масиву разом із комою після нього й запусти знову: пунктів стало два.
        2. Додай у кінець масиву свій об’єкт, наприклад `{ id: "t-04", title: "Купити хліб", done: false },` (з новим `id`), і запусти: пункт з’явився. Ти змінював лише дані — сторінку оновив React.
      en: |
        1. In `tasks.js` delete the array’s second object together with the comma after it and run again: two items are left.
        2. Add your own object at the end of the array, for example `{ id: "t-04", title: "Buy bread", done: false },` (with a new `id`), and run: the item appears. You changed only the data — React updated the page.

  - id: two-ways
    kind: explanation
    title:
      uk: "render(records) проти компонента"
      en: "render(records) versus a component"
    body:
      uk: |
        | | `render(records)` з розділу про DOM | Компонент React |
        |---|---|---|
        | Що повертає | нічого: сама змінює DOM | опис інтерфейсу (JSX) |
        | Хто створює вузли | твій код: `createElement`, `append` | React |
        | Коли дані змінилися | ти знову викликаєш `render` | React знову викликає компонент і сам вирішує, які вузли змінити |

        Сторінка складається з компонентів, які використовують інші компоненти, — це [[component-tree|дерево компонентів]]. Кожен компонент відповідає за свій шматок, і його легко знайти: побачив на сторінці список — шукай функцію, що його повертає.

        > [!note]
        > Компонент — це звичайна функція JavaScript. Він може обчислювати значення (`tasks.length`, `filter`, шаблонний рядок) і повертати результат у JSX. Головне — **повернути** опис: без `return` функція поверне `undefined`, і React не намалює нічого.
      en: |
        | | `render(records)` from the DOM unit | A React component |
        |---|---|---|
        | What it returns | nothing: it changes the DOM itself | a description of the UI (JSX) |
        | Who creates the nodes | your code: `createElement`, `append` | React |
        | When the data changed | you call `render` again | React calls the component again and decides itself which nodes to change |

        A page is made of components that use other components — this is the [[component-tree]]. Each component is responsible for its own piece, and it is easy to find: you see a list on the page — look for the function that returns it.

        > [!note]
        > A component is an ordinary JavaScript function. It can compute values (`tasks.length`, `filter`, a template literal) and return the result in JSX. What matters is to **return** the description: without `return` the function returns `undefined`, and React draws nothing.

  - id: recall-render
    kind: review
    title:
      uk: "Згадай: рендеринг вручну"
      en: "Recall: rendering by hand"
    items:
      - id: after-change
        from: js-06-13-render-list-from-data
        prompt:
          uk: "Сторінку справ будує власна функція `render(tasks)` на `createElement` і `replaceChildren`. Код додав нову справу в масив `tasks`. Що станеться зі сторінкою?"
          en: "A task page is built by a hand-written function `render(tasks)` using `createElement` and `replaceChildren`. The code added a new task to the `tasks` array. What happens to the page?"
        answer:
          type: choice
          options:
            - id: call-again
              text:
                uk: "Нічого, поки код знову не викличе `render(tasks)`"
                en: "Nothing, until the code calls `render(tasks)` again"
            - id: auto
              text:
                uk: "Нова справа з’явиться сама: масив пов’язаний зі сторінкою"
                en: "The new task appears by itself: the array is linked to the page"
              why:
                uk: "Масив — просто дані в пам’яті; браузер не стежить за ним. Вузли DOM змінюються лише тоді, коли їх змінює код."
                en: "The array is just data in memory; the browser does not watch it. DOM nodes change only when code changes them."
            - id: error
              text:
                uk: "Буде помилка: сторінка й масив тепер розходяться"
                en: "There is an error: the page and the array now disagree"
              why:
                uk: "Розбіжність — не помилка JavaScript. Сторінка просто показує старий стан, доки її не перебудують."
                en: "A mismatch is not a JavaScript error. The page simply shows the old state until it is rebuilt."
          correct: [call-again]
        explanation:
          uk: "`render(records)` перебудовує сторінку лише тоді, коли її викликають. Тому після кожної зміни даних її треба викликати знову. У React цю роботу бере на себе бібліотека — як саме вона дізнається про зміни, ти побачиш у цьому й наступному розділі."
          en: "`render(records)` rebuilds the page only when it is called. That is why it has to be called again after every data change. In React the library takes over this job — how exactly it learns about changes you will see in this unit and the next."

  - id: summary
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: summary
    entry: main.jsx
    editable: [Summary.jsx]
    strings:
      heading: { uk: "Витрати", en: "Expenses" }
      countLabel: { uk: "Записів:", en: "Records:" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
    title:
      uk: "Компонент Summary"
      en: "The Summary component"
    instructions:
      uk: |
        Над списком витрат бракує підсумку. Допиши компонент `Summary` у файлі `Summary.jsx`, щоб він **повертав**:

        - заголовок `<h2>` з текстом «Витрати»;
        - абзац `<p>` з текстом «Записів:», пробілом і **кількістю записів** у масиві `expenses`.

        Кількість не пиши числом: обчисли її з даних, щоб підсумок лишався правильним, коли записів побільшає. Перевірка так і зробить — додасть у масив п’яту витрату. Два елементи одразу повернути не вийде: загорни їх в один, наприклад `<section>`.

        `main.jsx` і `expenses.js` — лише для перегляду.
      en: |
        The expense list lacks a summary above it. Finish the `Summary` component in `Summary.jsx` so that it **returns**:

        - an `<h2>` heading with the text “Expenses”;
        - a `<p>` paragraph with the text “Records:”, a space and the **number of records** in the `expenses` array.

        Do not type the count as a number: compute it from the data so the summary stays right when there are more records. The check does exactly that — it adds a fifth expense to the array. You cannot return two elements at once: wrap them in one, for example a `<section>`.

        `main.jsx` and `expenses.js` are read-only.
    testTitles:
      "Summary shows the heading":
        uk: "`Summary` показує заголовок `<h2>` «Витрати»"
        en: "`Summary` shows the `<h2>` heading “Expenses”"
      "Summary shows the number of expenses":
        uk: "`Summary` показує абзац «Записів: 4»"
        en: "`Summary` shows the paragraph “Records: 4”"
      "the count follows the data":
        uk: "Після додавання п’ятої витрати абзац показує «Записів: 5»"
        en: "After a fifth expense is added the paragraph shows “Records: 5”"
      "the page shows the summary above the list":
        uk: "На сторінці є підсумок і чотири пункти списку"
        en: "The page shows the summary and four list items"
    hints:
      nudge:
        uk: "Подивись, як `TaskList` у прикладі отримує значення з масиву й ставить його в JSX. А що функція-компонент має зробити зі своїм описом наприкінці?"
        en: "Look at how `TaskList` in the example takes values from the array and puts them into JSX. And what must a component function do with its description at the end?"
      explanation:
        uk: |
          Компонент **повертає** опис: `return (` … `);` — круглі дужки дозволяють писати JSX у кілька рядків. Значення JavaScript потрапляє в текст через фігурні дужки. Наприклад, компонент про справи міг би повертати таке:

          ```jsx
          return (
            <div>
              <h3>Справи</h3>
              <span>Перша: {tasks[0].title}</span>
            </div>
          );
          ```

          У тебе в абзаці потрібна не перша назва, а довжина масиву.
        en: |
          A component **returns** a description: `return (` … `);` — the parentheses let you write JSX over several lines. A JavaScript value gets into the text through curly braces. For example, a task component could return this:

          ```jsx
          return (
            <div>
              <h3>Tasks</h3>
              <span>First: {tasks[0].title}</span>
            </div>
          );
          ```

          Your paragraph needs not the first title but the length of the array.
    solutionNote:
      uk: "`Summary` — функція, яка повертає опис. `{expenses.length}` обчислюється щоразу, коли React викликає компонент, тож підсумок завжди відповідає даним. Число, вписане вручну, правильне лише доти, доки дані не змінились."
      en: "`Summary` is a function that returns a description. `{expenses.length}` is computed every time React calls the component, so the summary always matches the data. A number typed by hand is right only until the data changes."
    feedback:
      - when: { test: "Summary shows the heading" }
        message:
          uk: "Ця перевірка малює `Summary` окремо й шукає в ньому `<h2>` з текстом «Витрати». Якщо `Summary` нічого не показує, перевір, чи є в функції `return` перед описом."
          en: "This check draws `Summary` on its own and looks for an `<h2>` with the text “Expenses” in it. If `Summary` shows nothing, check that the function has `return` before the description."
      - when: { test: "the count follows the data" }
        message:
          uk: "Ця перевірка додає в `expenses` п’ятий запис і чекає «Записів: 5». Якщо абзац і далі каже 4, число вписано вручну — візьми його з масиву у фігурних дужках."
          en: "This check adds a fifth record to `expenses` and expects “Records: 5”. If the paragraph still says 4, the number is typed by hand — take it from the array inside curly braces."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: у картці — файл і рядок. Часто це два елементи поруч без спільної обгортки або незакритий тег: загорни `<h2>` і `<p>` в один `<section>` і перевір, що кожен тег закрито."
          en: "The code could not start: the card names the file and the line. Often these are two elements side by side without a shared wrapper, or an unclosed tag: wrap `<h2>` and `<p>` in one `<section>` and check that every tag is closed."

  - id: to-project
    kind: transfer
    capstoneStep: RE-01
    body:
      uk: "У кроці проєкту твій список записів, який зараз будує `render(records)`, стане деревом компонентів: список, картка запису й оболонка форми. Доменні функції проєкту при цьому не змінюються — компоненти лише показують те, що вони обчислюють."
      en: "In the project step your record list, which `render(records)` builds now, becomes a tree of components: a list, a record card and a form shell. The project’s domain functions stay unchanged — the components only show what those functions compute."
