id: re-01-04-conditional-list-rendering
unit: RE-01
title:
  uk: "Умовний рендеринг і рендеринг списків"
  en: "Conditional and list rendering"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Обирати між раннім `return`, тернарним оператором і `&&` для умовного виводу й передбачати зайвий `0`, який рендерить `count && …`."
    en: "Choose between an early return, a ternary and && for conditional output, and predict the stray 0 that count && … renders."
  - uk: "Рендерити масив записів як список компонентів через `map` і показувати повідомлення про порожній стан, коли нічого не підходить."
    en: "Render an array of records as a list of components with map, and show an empty-state message when nothing matches."
prerequisites: [re-01-03-props-children-typed, js-05-01-map]
subskills:
  - { family: R-01, skill: "conditional/list rendering", depth: intro }
glossary: [conditional-rendering, list-rendering]
selfCheck: [zero-or-nothing, habit-filter]

blocks:
  - id: lists-and-conditions
    kind: explanation
    title:
      uk: "Масив елементів і вибір гілки"
      en: "An array of elements and choosing a branch"
    body:
      uk: |
        **Список.** `map` перетворює масив записів на масив елементів JSX, а React уміє показати масив, поставлений у `{}`, — кожен елемент по черзі:

        ```jsx
        <ul>
          {tasks.map((task) => <li key={task.id}>{task.title}</li>)}
        </ul>
        ```

        Це [[list-rendering|рендеринг списку]]. `key` — ідентифікатор елемента для React; чому саме `id` запису, розберемо в наступному уроці.

        **Умова.** `if` у JSX не можна, тож для [[conditional-rendering|умовного рендерингу]] є три вирази:

        - ранній `return` **до** головного JSX: `if (tasks.length === 0) return <p>Справ немає</p>;`
        - тернарний оператор — одна з двох гілок: `{done ? <s>{title}</s> : title}`
        - `&&` — «покажи або нічого»: `{isLate && <strong>Прострочено</strong>}`

        React нічого не показує для `false`, `null`, `undefined` і `true`. А от число й текст — показує.
      en: |
        **A list.** `map` turns an array of records into an array of JSX elements, and React can show an array put in `{}` — every element in turn:

        ```jsx
        <ul>
          {tasks.map((task) => <li key={task.id}>{task.title}</li>)}
        </ul>
        ```

        This is [[list-rendering]]. `key` is the element’s identifier for React; why it is the record’s `id` is the topic of the next lesson.

        **A condition.** `if` is not allowed in JSX, so [[conditional-rendering]] has three expressions:

        - an early `return` **before** the main JSX: `if (tasks.length === 0) return <p>No tasks</p>;`
        - a ternary — one of two branches: `{done ? <s>{title}</s> : title}`
        - `&&` — “show it or nothing”: `{isLate && <strong>Overdue</strong>}`

        React shows nothing for `false`, `null`, `undefined` and `true`. A number or text, however, it does show.

  - id: zero-or-nothing
    kind: prediction
    strings:
      empty: { uk: "Бажань поки немає", en: "No wishes yet" }
    prompt:
      uk: "Масив `records` порожній. Що покажуть на сторінці `WithAnd` і `WithTernary`?"
      en: "The array `records` is empty. What do `WithAnd` and `WithTernary` show on the page?"
    lang: jsx
    runnable: false
    code: |
      const records = [];

      function RecordList({ records }) {
        return <ul>{records.map((r) => <li key={r.id}>{r.name}</li>)}</ul>;
      }

      function WithAnd() {
        return <div>{records.length && <RecordList records={records} />}</div>;
      }

      function WithTernary() {
        return (
          <div>
            {records.length > 0 ? <RecordList records={records} /> : <p>%%empty%%</p>}
          </div>
        );
      }
    answer:
      type: choice
      options:
        - id: zero-and-message
          text: { uk: "`WithAnd` — цифру `0`, `WithTernary` — «Бажань поки немає»", en: "`WithAnd` — the digit `0`, `WithTernary` — “No wishes yet”" }
        - id: nothing-and-message
          text: { uk: "`WithAnd` — нічого, `WithTernary` — «Бажань поки немає»", en: "`WithAnd` — nothing, `WithTernary` — “No wishes yet”" }
          why:
            uk: "`&&` повертає перший операнд, якщо той хибний. `records.length` — це `0`, тож вираз дає `0`, а число React показує."
            en: "`&&` returns its first operand when that is falsy. `records.length` is `0`, so the expression gives `0`, and React shows numbers."
        - id: empty-lists
          text: { uk: "Обидва — порожній `<ul>`", en: "Both — an empty `<ul>`" }
          why:
            uk: "`RecordList` тут не викликається взагалі: в обох компонентах умова не пускає до нього."
            en: "`RecordList` is not called at all here: in both components the condition does not let it through."
        - id: zero-both
          text: { uk: "Обидва — `0`", en: "Both — `0`" }
          why:
            uk: "У `WithTernary` умова — порівняння `records.length > 0`, тобто `false`, і тернарний оператор бере другу гілку."
            en: "In `WithTernary` the condition is the comparison `records.length > 0`, which is `false`, and the ternary takes the second branch."
      correct: [zero-and-message]
    explanation:
      uk: "`records.length && …` для порожнього масиву дорівнює `0`: `&&` зупиняється на хибному операнді й повертає саме його. `false` React не показав би, а число `0` — показує. Ліворуч від `&&` у JSX став справжню умову: `records.length > 0`. Тернарний оператор тут кращий ще й тим, що дає порожній стан замість нічого."
      en: "`records.length && …` for an empty array equals `0`: `&&` stops at a falsy operand and returns it. React would not show `false`, but it does show the number `0`. On the left of `&&` in JSX put a real condition: `records.length > 0`. The ternary is better here also because it gives an empty state instead of nothing."

  - id: map-is-enough
    kind: prediction
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      read: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
    prompt:
      uk: "Скільки пунктів `<li>` з’явиться на сторінці?"
      en: "How many `<li>` items appear on the page?"
    lang: jsx
    runnable: false
    code: |
      const habits = [
        { id: "h-01", name: "%%exercise%%" },
        { id: "h-02", name: "%%read%%" },
        { id: "h-03", name: "%%water%%" },
      ];

      function HabitNames() {
        const items = habits.map((habit) => <li key={habit.id}>{habit.name}</li>);
        return <ul>{items}</ul>;
      }
    answer:
      type: choice
      options:
        - id: three
          text: { uk: "Три", en: "Three" }
        - id: zero
          text: { uk: "Жодного: елементи створено, але їх не додали на сторінку через `append`", en: "None: the elements are created but never added to the page with `append`" }
          why:
            uk: "У React ти не додаєш вузли самостійно. `items` — масив описів, і коли він стоїть у `{}` усередині `<ul>`, React сам створює й ставить три `<li>`."
            en: "In React you do not add nodes yourself. `items` is an array of descriptions, and when it stands in `{}` inside `<ul>`, React itself creates and inserts three `<li>`."
        - id: error
          text: { uk: "Помилка: масив не можна поставити в JSX", en: "An error: an array cannot be put into JSX" }
          why:
            uk: "Масив елементів — звичайний вміст для JSX. Помилку дав би лише масив простих об’єктів (не елементів)."
            en: "An array of elements is normal JSX content. Only an array of plain objects (not elements) would give an error."
      correct: [three]
    explanation:
      uk: "`map` повертає масив із трьох елементів-описів. Поставлений у `{}`, масив стає вмістом `<ul>`, і React створює три `<li>` у тому самому порядку. Ніяких `append` — це робота React."
      en: "`map` returns an array of three element descriptions. Put in `{}`, the array becomes the content of `<ul>`, and React creates three `<li>` in the same order. No `append` — that is React’s job."

  - id: filter-then-map
    kind: visual
    visual: pipeline
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bike: { uk: "Велосипед", en: "Bicycle" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      mug: { uk: "Термочашка", en: "Travel mug" }
    title:
      uk: "Від записів до списку на сторінці"
      en: "From records to a list on the page"
    textEquivalent:
      uk: "На вході шість бажань, у двох із них acquired дорівнює true: «Книжка про JavaScript» і «Термочашка». Компонент списку отриманих бажань спершу викликає filter з умовою wish.acquired: filter перевіряє кожне бажання й лишає два. Потім map перетворює кожне з двох бажань на елемент <RecordCard name=… /> — опис картки, а не вузол DOM. Цей масив із двох елементів компонент ставить у {} усередині <ul>, і React показує дві картки. Якби filter не залишив нічого, масив був би порожній, і компонент повернув би замість списку абзац із повідомленням про порожній стан."
      en: "The input is six wishes; two of them have acquired equal to true: “A book about JavaScript” and “Travel mug”. The component for the list of acquired wishes first calls filter with the condition wish.acquired: filter tests every wish and keeps two. Then map turns each of the two wishes into an element <RecordCard name=… /> — a card description, not a DOM node. The component puts this array of two elements in {} inside <ul>, and React shows two cards. Had filter kept nothing, the array would be empty, and the component would return a paragraph with the empty-state message instead of a list."
    spec:
      code: |
        const cards = wishes
          .filter((wish) => wish.acquired)
          .map((wish) => <RecordCard key={wish.id} name={wish.name} />);
      input:
        label: { uk: "Бажання", en: "Wishes" }
        items:
          - { id: "w-01", name: "%%headphones%%", acquired: false }
          - { id: "w-02", name: "%%lamp%%", acquired: false }
          - { id: "w-03", name: "%%bike%%", acquired: false }
          - { id: "w-04", name: "%%book%%", acquired: true }
          - { id: "w-05", name: "%%tickets%%", acquired: false }
          - { id: "w-06", name: "%%mug%%", acquired: true }
        show: "wish => `${wish.id} · ${wish.name} · ${wish.acquired}`"
        caption:
          uk: "Шість записів-бажань. Для списку «Уже отримано» потрібні лише ті, де `acquired` — `true`."
          en: "Six wish records. The list “Already got” needs only those whose `acquired` is `true`."
      stages:
        - op: filter
          fn: "(wish) => wish.acquired"
          label: "wish.acquired"
          perItem: true
          caption:
            uk: "`filter` перевіряє бажання {index} з {count}: `{item}` → **{result}**."
            en: "`filter` tests wish {index} of {count}: `{item}` → **{result}**."
          summary:
            uk: "Лишилося два записи. Якби не лишилося жодного, компонент мав би показати порожній стан замість списку — це вирішує умова перед `map`, а не сам `map`."
            en: "Two records are left. Had none been left, the component would have to show the empty state instead of a list — that is decided by a condition before `map`, not by `map` itself."
        - op: map
          fn: "(wish) => `<RecordCard name=\"${wish.name}\" />`"
          label: "<RecordCard … />"
          show: "card => card"
          caption:
            uk: "`map` робить із кожного запису **опис** картки — елемент JSX. Це ще не вузли DOM: їх створить React, коли масив опиниться в `{}` усередині `<ul>`."
            en: "`map` makes a card **description** — a JSX element — from each record. These are not DOM nodes yet: React creates them when the array lands in `{}` inside `<ul>`."
      result:
        label: { uk: "{count} картки на сторінці", en: "{count} cards on the page" }

  - id: stray-zero
    kind: example
    runtime: browser-react
    dir: stray-zero
    entry: main.jsx
    strings:
      heading: { uk: "Витрати", en: "Expenses" }
      currency: { uk: "грн", en: "UAH" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      lunch: { uk: "Обід", en: "Lunch" }
    title:
      uk: "Звідки береться зайвий 0"
      en: "Where the stray 0 comes from"
    body:
      uk: |
        `App` показує список витрат лише тоді, коли вони є: `{expenses.length && <ExpenseList … />}`. Суми зберігаються в копійках і форматуються лише для показу. Натисни **Запустити**: шість витрат на місці.
      en: |
        `App` shows the expense list only when there are expenses: `{expenses.length && <ExpenseList … />}`. Amounts are stored in kopiykas (minor units) and formatted only for display. Press **Run**: the six expenses are there.
    tryIt:
      uk: |
        1. У `expenses.js` заміни весь масив на порожній: `export const expenses = [];`. Запусти: під заголовком самотня цифра `0`.
        2. У `App.jsx` заміни умову на `expenses.length > 0 && …` і запусти: під заголовком нічого.
        3. Нічого — теж не найкраще: людина не знає, чи сторінка зламалась. Заміни рядок з умовою на тернарний оператор `{expenses.length > 0 ? <ExpenseList expenses={expenses} /> : <p>Витрат ще немає</p>}` і запусти: тепер видно порожній стан.
      en: |
        1. In `expenses.js` replace the whole array with an empty one: `export const expenses = [];`. Run: a lonely digit `0` sits under the heading.
        2. In `App.jsx` change the condition to `expenses.length > 0 && …` and run: nothing under the heading.
        3. Nothing is not great either: a person cannot tell whether the page broke. Replace the line with the condition by a ternary `{expenses.length > 0 ? <ExpenseList expenses={expenses} /> : <p>No expenses yet</p>}` and run: now the empty state is visible.

  - id: which-form
    kind: explanation
    title:
      uk: "Яку форму обрати"
      en: "Which form to choose"
    body:
      uk: |
        | Ситуація | Форма | Приклад |
        |---|---|---|
        | Увесь компонент інший, коли даних немає | ранній `return` | `if (tasks.length === 0) return <p>Справ немає</p>;` |
        | Одне з двох у певному місці | тернарний оператор | `{price === null ? "без ціни" : price}` |
        | Щось або нічого | `&&` зі справжньою умовою | `{isLate === true && <Badge />}` |

        Ліворуч від `&&` став **булеве значення**: порівняння (`count > 0`, `price === null`) або поле, що завжди `true`/`false`. Число, текст чи масив ліворуч — це пастка: `0` і `""` хибні, але `0` React покаже.

        Часто фільтр і умова працюють разом: спершу `filter` дає записи, що підходять, потім або порожній стан, або `map` у список.
      en: |
        | Situation | Form | Example |
        |---|---|---|
        | The whole component differs when there is no data | an early `return` | `if (tasks.length === 0) return <p>No tasks</p>;` |
        | One of two things in one place | a ternary | `{price === null ? "no price" : price}` |
        | Something or nothing | `&&` with a real condition | `{isLate === true && <Badge />}` |

        On the left of `&&` put a **boolean**: a comparison (`count > 0`, `price === null`) or a field that is always `true`/`false`. A number, text or array on the left is a trap: `0` and `""` are falsy, but React shows `0`.

        Filtering and conditions often work together: first `filter` gives the matching records, then either the empty state or `map` into a list.

  - id: recall-and
    kind: review
    title:
      uk: "Згадай: що повертає &&"
      en: "Recall: what && returns"
    items:
      - id: and-operand
        from: js-02-03-truthiness-logic-ternary
        prompt:
          uk: "Що виведуть ці два `console.log`?"
          en: "What do these two `console.log` calls print?"
        code: |
          console.log(0 && "list");
          console.log(3 && "list");
        verify: { logs: ["0", "list"] }
        answer:
          type: choice
          options:
            - id: operands
              code: "0\nlist"
            - id: booleans
              code: "false\ntrue"
              why:
                uk: "`&&` не перетворює результат на `true`/`false`: він повертає один зі своїх операндів."
                en: "`&&` does not convert the result to `true`/`false`: it returns one of its operands."
            - id: list-twice
              code: "list\nlist"
              why:
                uk: "`0` — хибне значення, тож `&&` зупиняється на ньому й повертає `0`, до `\"list\"` не доходить."
                en: "`0` is falsy, so `&&` stops at it and returns `0` without reaching `\"list\"`."
          correct: [operands]
        explanation:
          uk: "`a && b` повертає `a`, якщо `a` хибне, інакше — `b`. Тому `0 && …` дає `0`, а в JSX це видима цифра."
          en: "`a && b` returns `a` when `a` is falsy, otherwise `b`. That is why `0 && …` gives `0`, and in JSX that is a visible digit."

  - id: habit-filter
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: habit-filter
    entry: main.jsx
    editable: [HabitList.jsx]
    strings:
      activeHeading: { uk: "Активні", en: "Active" }
      pausedHeading: { uk: "На паузі", en: "Paused" }
      empty: { uk: "Тут поки немає звичок", en: "No habits here yet" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      read: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
    title:
      uk: "Активні й призупинені звички"
      en: "Active and paused habits"
    instructions:
      uk: |
        `HabitList` отримує props `habits` (масив звичок) і `status` — `"active"` або `"paused"`. Зараз він показує всі звички. Зроби так:

        - для `"active"` — лише звички з `active: true`, для `"paused"` — з `active: false`, у тому самому порядку, по одному `<li>` з назвою на кожну (`key` — `habit.id`);
        - якщо жодна звичка не підходить, замість списку — лише абзац `<p>` «Тут поки немає звичок», без порожнього `<ul>` і без зайвих символів.

        Перевірка малює `HabitList` з усіма звичками, з самими активними й з порожнім масивом. `main.jsx` і `habits.js` — лише для перегляду.
      en: |
        `HabitList` gets the props `habits` (an array of habits) and `status` — `"active"` or `"paused"`. Right now it shows every habit. Make it do this:

        - for `"active"` — only the habits with `active: true`, for `"paused"` — those with `active: false`, in the same order, one `<li>` with the name per habit (`key` is `habit.id`);
        - when no habit matches, show only a `<p>` paragraph “No habits here yet” instead of the list, with no empty `<ul>` and no stray characters.

        The check draws `HabitList` with all habits, with only the active ones and with an empty array. `main.jsx` and `habits.js` are read-only.
    testTitles:
      "status active shows only the active habits, in order":
        uk: "Для `\"active\"` — лише активні звички, у тому самому порядку"
        en: "For `\"active\"` — only the active habits, in the same order"
      "status paused shows only the paused habit":
        uk: "Для `\"paused\"` — лише звичка на паузі"
        en: "For `\"paused\"` — only the paused habit"
      "no matching habits shows only the empty-state message":
        uk: "Коли нічого не підходить — лише повідомлення про порожній стан"
        en: "When nothing matches — only the empty-state message"
      "an empty array shows the empty-state message and no list":
        uk: "Для порожнього масиву — повідомлення й жодного `<ul>`"
        en: "For an empty array — the message and no `<ul>`"
      "the page shows five active and one paused habit":
        uk: "На сторінці п’ять активних і одна звичка на паузі"
        en: "The page shows five active habits and one paused habit"
    hints:
      nudge:
        uk: "Спершу отримай масив звичок, що підходять, і лише потім вирішуй, що повернути: список чи повідомлення."
        en: "First get the array of matching habits, and only then decide what to return: a list or the message."
      explanation:
        uk: |
          `status === "active"` дає `true` або `false` — саме те значення `active`, яке треба залишити. Приклад з іншими даними — витрати з категорії:

          ```jsx
          const shown = expenses.filter((expense) => expense.category === category);
          if (shown.length === 0) return <p>Витрат у цій категорії немає</p>;
          return <ul>{shown.map((expense) => <li key={expense.id}>{expense.label}</li>)}</ul>;
          ```

          Умову для порожнього стану пиши порівнянням, а не самою довжиною.
        en: |
          `status === "active"` gives `true` or `false` — exactly the `active` value to keep. An example with other data — expenses of one category:

          ```jsx
          const shown = expenses.filter((expense) => expense.category === category);
          if (shown.length === 0) return <p>No expenses in this category</p>;
          return <ul>{shown.map((expense) => <li key={expense.id}>{expense.label}</li>)}</ul>;
          ```

          Write the empty-state condition as a comparison, not as the length alone.
    solutionNote:
      uk: "Спершу `filter` дає записи, що підходять, потім умова обирає гілку: порожній стан або `map` у список. Ранній `return`, тернарний оператор чи `&&` з порівнянням — усі три працюють; пастка лише одна — довжина ліворуч від `&&`, яка для нуля рендерить `0`."
      en: "First `filter` gives the matching records, then a condition picks the branch: the empty state or `map` into a list. An early `return`, a ternary or `&&` with a comparison all work; the only trap is the length on the left of `&&`, which renders `0` for zero."
    feedback:
      - when: { test: "no matching habits shows only the empty-state message" }
        message:
          uk: "Ця перевірка дає лише активні звички зі `status=\"paused\"` і чекає, що весь текст — «Тут поки немає звичок». Якщо поруч видно `0`, ліворуч від `&&` стоїть довжина масиву: заміни її порівнянням."
          en: "This check passes only active habits with `status=\"paused\"` and expects the whole text to be “No habits here yet”. If a `0` shows next to it, the array length stands on the left of `&&`: replace it with a comparison."
      - when: { test: "an empty array shows the empty-state message and no list" }
        message:
          uk: "Ця перевірка передає порожній масив і чекає повідомлення без елемента `<ul>`. Порожній `<ul>` теж рахується: поверни замість нього абзац."
          en: "This check passes an empty array and expects the message without a `<ul>` element. An empty `<ul>` counts too: return the paragraph instead of it."
      - when: { test: "status paused shows only the paused habit" }
        message:
          uk: "Ця перевірка чекає для `\"paused\"` лише «Вчити англійські слова». Якщо видно всі звички, `status` ще не впливає на `filter`."
          en: "For `\"paused\"` this check expects only “Learn English words”. If every habit shows, `status` does not affect the `filter` yet."

  - id: to-project
    kind: transfer
    capstoneStep: RE-01
    body:
      uk: "У кроці проєкту компонент списку покаже твої записи через `map` і порожній стан, коли записів немає, — так само, як це робила `render(records)`, але без жодного `append`."
      en: "In the project step the list component shows your records with `map` and an empty state when there are none — just like `render(records)` did, but without a single `append`."
