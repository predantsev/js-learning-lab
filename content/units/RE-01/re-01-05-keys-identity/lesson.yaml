id: re-01-05-keys-identity
unit: RE-01
title:
  uk: "Ключі та ідентичність"
  en: "Keys and identity"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Пояснити, як React за допомогою `key` зіставляє елементи списку між рендерами."
    en: "Explain how React uses a key to match list items between renders."
  - uk: "Передбачити, у якому рядку лишиться набраний текст після видалення чи перестановки, коли ключі — індекси і коли — `id` записів, і виправити ключ."
    en: "Predict which row keeps its typed text after a deletion or reorder when keys are indices versus record ids, and fix the key."
prerequisites: [re-01-04-conditional-list-rendering, js-04-07-reference-identity]
subskills:
  - { family: R-01, skill: "stable keys and identity", depth: intro }
glossary: [list-key, reconciliation]
selfCheck: [where-the-note-goes, same-title]

blocks:
  - id: react-compares
    kind: explanation
    title:
      uk: "React порівнює старий і новий список"
      en: "React compares the old and the new list"
    body:
      uk: |
        Коли дані змінюються, React не будує сторінку заново. Він бере новий опис і **порівнює** його з попереднім, щоб змінити в DOM лише потрібне, — це [[reconciliation|узгодження]]. Для списку питання таке: який новий `<li>` — це той самий рядок, що й раніше, а який — новий?

        Відповідь дає [[list-key|ключ]] — `key` на кожному елементі з `map`. Рядок із тим самим ключем React вважає **тим самим рядком**: залишає його вузли DOM на місці й лише оновлює текст. Ключ, якого раніше не було, — новий рядок; ключ, що зник, — рядок видаляють.

        У цьому уроці дані змінює `main.jsx`: після кожної зміни він знову викликає `root.render(…)` з новим масивом. (У наступному розділі це робитиме сам компонент.) Кнопки обробляє один делегований слухач — як у розділі про DOM.
      en: |
        When the data changes, React does not rebuild the page. It takes the new description and **compares** it with the previous one, so that it changes only what is needed in the DOM — this is [[reconciliation]]. For a list the question is: which new `<li>` is the same row as before, and which is new?

        The answer is the [[list-key|key]] — a `key` on every element from `map`. React treats a row with the same key as **the same row**: it keeps its DOM nodes in place and only updates the text. A key that did not exist before is a new row; a key that disappeared is a row to remove.

        In this lesson `main.jsx` changes the data: after every change it calls `root.render(…)` again with the new array. (In the next unit the component does that itself.) One delegated listener handles the buttons — as in the DOM unit.

  - id: where-the-note-goes
    kind: prediction
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bike: { uk: "Велосипед", en: "Bicycle" }
    prompt:
      uk: "Список показує «Навушники», «Настільна лампа», «Велосипед», у кожному рядку — поле для нотатки. Ти пишеш «подарунок» у поле **«Настільної лампи»** і видаляєш **«Навушники»**. Біля якої назви тепер буде «подарунок» — з `key={index}` і з `key={wish.id}`?"
      en: "The list shows “Headphones”, “Desk lamp”, “Bicycle”, each row with a note field. You type “gift” into the field of **“Desk lamp”** and delete **“Headphones”**. Next to which name is “gift” now — with `key={index}` and with `key={wish.id}`?"
    lang: jsx
    runnable: false
    code: |
      function WishRow({ wish }) {
        return (
          <li>
            <span>{wish.name}</span>
            <input aria-label={wish.name} />
          </li>
        );
      }

      // Version A: key={index}
      {wishes.map((wish, index) => <WishRow key={index} wish={wish} />)}

      // Version B: key={wish.id}
      {wishes.map((wish) => <WishRow key={wish.id} wish={wish} />)}
    answer:
      type: choice
      options:
        - id: index-moves
          text: { uk: "A — біля «Велосипеда», B — біля «Настільної лампи»", en: "A — next to “Bicycle”, B — next to “Desk lamp”" }
        - id: both-stay
          text: { uk: "В обох — біля «Настільної лампи»", en: "In both — next to “Desk lamp”" }
          why:
            uk: "Індекс — це позиція, а не запис. Після видалення «Настільна лампа» стала першою, тобто отримала ключ `0` — ключ, який раніше мав рядок «Навушників» із порожнім полем."
            en: "An index is a position, not a record. After the deletion “Desk lamp” is first, so it gets the key `0` — the key that the “Headphones” row with an empty field had before."
        - id: lost
          text: { uk: "A — текст зникне, B — біля «Настільної лампи»", en: "A — the text disappears, B — next to “Desk lamp”" }
          why:
            uk: "З індексами зникає рядок з ключем `2`, а поле з текстом мало ключ `1`, і цей ключ лишився — тепер у «Велосипеда»."
            en: "With indices the row with key `2` disappears, while the field with the text had key `1`, and that key stays — now on “Bicycle”."
        - id: both-move
          text: { uk: "В обох — біля «Велосипеда»", en: "In both — next to “Bicycle”" }
          why:
            uk: "З `id` ключ «Настільної лампи» — `w-02` і до, і після видалення, тож React лишає їй той самий рядок із тим самим полем."
            en: "With `id` the key of “Desk lamp” is `w-02` before and after the deletion, so React keeps the same row with the same field for it."
      correct: [index-moves]
    explanation:
      uk: "Набраний текст живе у вузлі `<input>`, а вузол належить ключу. З індексами після видалення ключі — `0` і `1`: React вважає, що зник рядок `2`, а рядки `0` і `1` лише змінили текст. Поле з «подарунком» мало ключ `1` — і лишилося біля нового рядка `1`, «Велосипеда». З `id` ключ `w-02` іде разом із записом, тож текст лишається біля «Настільної лампи»."
      en: "The typed text lives in the `<input>` node, and the node belongs to a key. With indices the keys after the deletion are `0` and `1`: React thinks row `2` disappeared, and rows `0` and `1` only changed their text. The field with “gift” had key `1` — and stayed with the new row `1`, “Bicycle”. With `id` the key `w-02` travels with the record, so the text stays next to “Desk lamp”."

  - id: match-by-key
    kind: visual
    visual: diagram
    title:
      uk: "Як React зіставляє рядки за ключем"
      en: "How React matches rows by key"
    textEquivalent:
      uk: "Ліворуч — рядки до видалення: «Навушники» з порожнім полем, «Настільна лампа» з нотаткою «подарунок» і «Велосипед» з порожнім полем. Праворуч — рядки після видалення «Навушників»: «Настільна лампа» і «Велосипед». З ключами-індексами React з’єднує рядки за позицією: старий рядок з ключем 0 (Навушники, порожнє поле) стає новим рядком 0, тепер з назвою «Настільна лампа», а старий рядок з ключем 1 (поле з «подарунком») стає рядком 1 — «Велосипедом». Нотатка перескочила до іншого запису. З ключами-id React з’єднує w-02 з w-02 і w-03 з w-03, а рядок w-01 видаляє — нотатка лишається з «Настільною лампою»."
      en: "On the left are the rows before the deletion: “Headphones” with an empty field, “Desk lamp” with the note “gift” and “Bicycle” with an empty field. On the right are the rows after deleting “Headphones”: “Desk lamp” and “Bicycle”. With index keys React matches rows by position: the old row with key 0 (Headphones, empty field) becomes the new row 0, now named “Desk lamp”, and the old row with key 1 (the field with “gift”) becomes row 1 — “Bicycle”. The note jumped to another record. With id keys React matches w-02 with w-02 and w-03 with w-03, and removes the row w-01 — the note stays with “Desk lamp”."
    spec:
      layout: grid
      groups:
        - { id: before, label: { uk: "Рендер 1", en: "Render 1" } }
        - { id: after, label: { uk: "Рендер 2", en: "Render 2" } }
      nodes:
        - { id: oh, group: before, label: { uk: "Навушники · ‒", en: "Headphones · ‒" }, col: 0, row: 0, w: 150 }
        - { id: ol, group: before, label: { uk: "Лампа · «подарунок»", en: "Desk lamp · “gift”" }, col: 0, row: 1, w: 150 }
        - { id: ob, group: before, label: { uk: "Велосипед · ‒", en: "Bicycle · ‒" }, col: 0, row: 2, w: 150 }
        - { id: nl, group: after, label: { uk: "Лампа", en: "Desk lamp" }, col: 1, row: 1, w: 110 }
        - { id: nb, group: after, label: { uk: "Велосипед", en: "Bicycle" }, col: 1, row: 2, w: 110 }
      edges:
        - { id: k0, from: oh, to: nl, label: "key 0" }
        - { id: k1, from: ol, to: nb, label: "key 1" }
        - { id: kl, from: ol, to: nl, label: "w-02", kind: dashed }
        - { id: kb, from: ob, to: nb, label: "w-03", kind: dashed }
      hidden: [kl, kb]
      steps:
        - caption:
            uk: "До видалення три рядки; у полі «Настільної лампи» набрано «подарунок». Текст живе у вузлі `<input>` цього рядка."
            en: "Before the deletion there are three rows; “gift” is typed in the field of “Desk lamp”. The text lives in that row’s `<input>` node."
          highlight: [ol]
          dim: [k0, k1]
        - caption:
            uk: "**Ключі-індекси.** Після видалення нові рядки мають ключі `0` і `1`. React з’єднує ключ `0` з колишніми «Навушниками» (порожнє поле) і ключ `1` — з колишньою «Лампою» (поле з текстом)."
            en: "**Index keys.** After the deletion the new rows have keys `0` and `1`. React matches key `0` with the former “Headphones” (empty field) and key `1` with the former “Desk lamp” (the field with text)."
          highlight: [k0, k1, oh, ol, nl, nb]
          dim: [ob]
          annotate:
            - { id: nb, text: { uk: "тут «подарунок»", en: "“gift” is here" } }
        - caption:
            uk: "Рядок з ключем `2` зник — React видаляє його вузли. Поле з текстом лишилося в рядку `1`, і тепер біля нього написано «Велосипед»: нотатка перескочила до іншого запису."
            en: "The row with key `2` is gone — React removes its nodes. The field with the text stayed in row `1`, which now says “Bicycle”: the note jumped to another record."
          highlight: [ob, nb, k1]
          dim: [oh, nl, k0]
        - caption:
            uk: "**Ключі-id.** Тепер з’єднання йдуть за записом: `w-02` до `w-02`, `w-03` до `w-03`. Рядок `w-01` видаляється, а поле з «подарунком» лишається з «Настільною лампою»."
            en: "**Id keys.** Now the matches follow the record: `w-02` to `w-02`, `w-03` to `w-03`. The row `w-01` is removed, and the field with “gift” stays with “Desk lamp”."
          show: [kl, kb]
          highlight: [kl, kb, ol, nl]
          dim: [k0, k1, oh]
          annotate:
            - { id: nl, text: { uk: "тут «подарунок»", en: "“gift” is here" } }

  - id: notes-list
    kind: example
    runtime: browser-react
    dir: notes-list
    entry: main.jsx
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bike: { uk: "Велосипед", en: "Bicycle" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      noteFor: { uk: "Нотатка до", en: "Note for" }
      note: { uk: "нотатка", en: "note" }
      delete: { uk: "Видалити", en: "Delete" }
      reverse: { uk: "Обернути порядок", en: "Reverse the order" }
    title:
      uk: "Нотатки, що перескакують"
      en: "Notes that jump"
    body:
      uk: |
        `WishList.jsx` рендерить рядки з `key={index}`. У кожному рядку — поле нотатки й кнопка видалення; угорі — кнопка, що обертає порядок. Натисни **Запустити** й працюй на вкладці **Сторінка**. Зверни увагу: у консолі немає жодного попередження — індекси його «заглушили».
      en: |
        `WishList.jsx` renders the rows with `key={index}`. Every row has a note field and a delete button; at the top a button reverses the order. Press **Run** and work on the **Page** tab. Notice: the console has no warning at all — the indices “silenced” it.
    tryIt:
      uk: |
        1. Напиши щось у поле «Настільної лампи» і натисни «Видалити Навушники»: текст тепер біля «Велосипеда».
        2. Натисни **Запустити**, щоб почати знову. Напиши в поле «Настільної лампи» й натисни «Обернути порядок»: текст лишився в другому рядку згори — біля «Велосипеда».
        3. У `WishList.jsx` заміни `key={index}` на `key={wish.id}`, запусти й повтори обидва кроки: тепер текст іде разом із «Настільною лампою».
      en: |
        1. Type something into the field of “Desk lamp” and press “Delete Headphones”: the text is now next to “Bicycle”.
        2. Press **Run** to start over. Type into the field of “Desk lamp” and press “Reverse the order”: the text stayed in the second row from the top — next to “Bicycle”.
        3. In `WishList.jsx` replace `key={index}` with `key={wish.id}`, run and repeat both steps: now the text travels with “Desk lamp”.

  - id: good-keys
    kind: explanation
    title:
      uk: "Який ключ добрий"
      en: "What makes a good key"
    body:
      uk: |
        Добрий ключ **стабільний** (той самий у кожному рендері) і **унікальний** серед сусідів. Найкраще — `id` запису: його для цього й придумали.

        | Ключ | Проблема |
        |---|---|
        | `index` | позиція, а не запис: після видалення чи перестановки стан їде до іншого рядка; попередження немає |
        | `Math.random()` | новий щоразу: React вважає кожен рядок новим, знищує поля й набраний текст на кожному рендері |
        | `name`, `title` | дві однакові назви — однаковий ключ; React попереджає *Encountered two children with the same key* |
        | без ключа | React попереджає *Each child in a list should have a unique "key" prop* і бере індекс |

        Ключ ставлять на елемент, який повертає `map` (`<WishRow key={wish.id} … />`), а не всередині компонента. У props компонента він не потрапляє: `key` читає лише React.

        Індекс прийнятний лише для списку, який ніколи не змінює порядок і склад і не має стану в рядках.
      en: |
        A good key is **stable** (the same in every render) and **unique** among its siblings. The best is the record’s `id`: that is what it was invented for.

        | Key | Problem |
        |---|---|
        | `index` | a position, not a record: after a deletion or a reorder the state moves to another row; no warning |
        | `Math.random()` | new every time: React treats every row as new and destroys the fields and typed text on every render |
        | `name`, `title` | two equal names give an equal key; React warns *Encountered two children with the same key* |
        | no key | React warns *Each child in a list should have a unique "key" prop* and uses the index |

        The key goes on the element that `map` returns (`<WishRow key={wish.id} … />`), not inside the component. It does not reach the component’s props: only React reads `key`.

        An index is acceptable only for a list that never changes its order or contents and has no state in its rows.

  - id: recall-identity
    kind: review
    strings:
      lamp: { uk: "Лампа", en: "Lamp" }
    title:
      uk: "Згадай: та сама ідентичність чи рівний вміст"
      en: "Recall: same identity or equal contents"
    items:
      - id: equal-objects
        from: js-04-07-reference-identity
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const first = { id: "w-02", name: "%%lamp%%" };
          const second = { id: "w-02", name: "%%lamp%%" };
          const same = first;
          console.log(first === second, first === same, first.id === second.id);
        verify: { logs: ["false true true"] }
        answer:
          type: choice
          options:
            - id: ftt
              code: "false true true"
            - id: ttt
              code: "true true true"
              why:
                uk: "`===` для об’єктів порівнює посилання, а не вміст: два окремо створені об’єкти — різні, навіть з однаковими полями."
                en: "`===` on objects compares references, not contents: two separately created objects are different even with equal fields."
            - id: ftf
              code: "false true false"
              why:
                uk: "`first.id` і `second.id` — рядки, а рядки порівнюються за вмістом: `\"w-02\" === \"w-02\"`."
                en: "`first.id` and `second.id` are strings, and strings are compared by contents: `\"w-02\" === \"w-02\"`."
          correct: [ftt]
        explanation:
          uk: "Два об’єкти з однаковими полями — різні об’єкти. Тому React і не порівнює записи як об’єкти: після кожної зміни масив і записи можуть бути новими. Зв’язок «той самий запис» дає простий рядок — `id`, який ти кладеш у `key`."
          en: "Two objects with equal fields are different objects. That is why React does not compare records as objects: after every change the array and the records may be new. The link “the same record” is given by a plain string — the `id` you put into `key`."

  - id: same-title
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: same-title
    entry: main.jsx
    editable: [TaskList.jsx]
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      noteFor: { uk: "Нотатка до", en: "Note for" }
      delete: { uk: "Видалити", en: "Delete" }
      typed: { uk: "купити добриво", en: "buy fertilizer" }
    title:
      uk: "Дві справи з однаковою назвою"
      en: "Two tasks with the same title"
    instructions:
      uk: |
        Квіти поливають двічі на тиждень, тож у списку дві справи «Полити квіти» з різними датами й різними `id`. `TaskList` дає рядкам ключ `task.title` — запусти й подивись у консоль.

        Виправ ключ у `TaskList.jsx`, щоб:

        - React не попереджав про ключі;
        - нотатка, набрана в рядку справи `t-07` (друге «Полити квіти»), лишалася в ньому після того, як справу `t-01` видалено кнопкою.

        Перевірка зробить саме це: набере текст і натисне кнопку видалення. Інші файли — лише для перегляду.
      en: |
        The plants are watered twice a week, so the list has two tasks “Water the plants” with different dates and different `id`s. `TaskList` gives the rows the key `task.title` — run it and look at the console.

        Fix the key in `TaskList.jsx` so that:

        - React gives no warning about keys;
        - a note typed in the row of the task `t-07` (the second “Water the plants”) stays in it after the task `t-01` is deleted with its button.

        The check does exactly this: it types a text and presses the delete button. The other files are read-only.
    testTitles:
      "React gives no key warning":
        uk: "React не попереджає про ключі"
        en: "React gives no key warning"
      "a typed note stays with its task after the task above is deleted":
        uk: "Нотатка лишається у своїй справі після видалення справи над нею"
        en: "A typed note stays with its task after the task above it is deleted"
    hints:
      nudge:
        uk: "Що в записі справи однакове в обох «Полити квіти», а що — ні? І що з цього не змінюється, коли сусіда видаляють?"
        en: "What in a task record is the same for both “Water the plants”, and what is not? And which of these does not change when a neighbour is deleted?"
      explanation:
        uk: "Ключ має бути унікальним серед сусідів і стабільним між рендерами. Назва не унікальна, позиція не стабільна. Запис з іншого домену, наприклад витрата `{ id: \"e-03\", label: \"Кава з друзями\" }`, теж має поле, створене саме для ідентичності, — ним і ключують рядок."
        en: "A key must be unique among siblings and stable between renders. A title is not unique, a position is not stable. A record from another domain, for example an expense `{ id: \"e-03\", label: \"Coffee with friends\" }`, also has a field made exactly for identity — that is what keys the row."
    solutionNote:
      uk: "`id` — непрозорий унікальний рядок, який не залежить ні від назви, ні від позиції. З ним React зіставляє рядки за записом: видалення `t-01` прибирає лише його рядок, а вузол поля `t-07` разом із набраним текстом лишається на місці."
      en: "`id` is an opaque unique string that depends on neither the title nor the position. With it React matches rows by record: deleting `t-01` removes only its row, and the field node of `t-07` with its typed text stays in place."
    feedback:
      - when: { test: "React gives no key warning" }
        message:
          uk: "Ця перевірка чекає, що в консолі немає попереджень React про `key`. *Encountered two children with the same key* — ключ не унікальний (дві однакові назви); *Each child in a list should have a unique \"key\" prop* — у елемента з `map` немає атрибута `key`."
          en: "This check expects no React warnings about `key` in the console. *Encountered two children with the same key* means the key is not unique (two equal titles); *Each child in a list should have a unique \"key\" prop* means the element from `map` has no `key` attribute."
      - when: { test: "a typed note stays with its task after the task above is deleted" }
        message:
          uk: "Ця перевірка набирає нотатку в рядку `t-07`, видаляє `t-01` і чекає два рядки, з нотаткою досі в `t-07`. Якщо видалений рядок лишився на сторінці, ключі повторюються; якщо нотатка зникла чи переїхала, ключ залежить від позиції."
          en: "This check types a note in the row `t-07`, deletes `t-01` and expects two rows, with the note still in `t-07`. If the deleted row stays on the page, keys repeat; if the note vanished or moved, the key depends on the position."

  - id: to-project
    kind: transfer
    capstoneStep: RE-01
    body:
      uk: "У кроці проєкту кожна картка запису в списку отримає `key` з `id` запису — непрозорого рядка, який у доменній моделі ніколи не залежить від назви."
      en: "In the project step every record card in the list gets a `key` from the record’s `id` — the opaque string that in the domain model never depends on the name."
