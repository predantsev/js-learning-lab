id: re-01-03-props-children-typed
unit: RE-01
title:
  uk: "Props, children і типізовані props"
  en: "Props, children and typed props"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Передавати дані в компонент через props і читати їх деструктуруванням параметра."
    en: "Pass data into a component through props and read them by destructuring the parameter."
  - uk: "Типізувати props компонента у файлі `.tsx` (обов’язкові, необов’язкові й `children: ReactNode`) і виправити виклик, який відхиляє `tsc`."
    en: "Type a component’s props in a .tsx file (required, optional and children: ReactNode) and fix a call site that the checker rejects."
  - uk: "Скласти обгортку `Card`, яка показує будь-які передані їй children."
    en: "Compose a Card wrapper that renders whatever children it is given."
prerequisites: [re-01-02-jsx-rules, js-14-05-functions-generics]
subskills:
  - { family: R-01, skill: "props/composition/children", depth: intro }
  - { family: P-05, skill: "typed props/state/events/hooks", depth: intro }
glossary: [props, children-prop, tsx]
selfCheck: [missing-category, today-card]

blocks:
  - id: props-are-arguments
    kind: explanation
    title:
      uk: "Props — аргументи компонента"
      en: "Props are a component’s arguments"
    body:
      uk: |
        Досі кожна картка показувала те саме. Щоб картки відрізнялися, компоненту передають дані — так само, як атрибути тегу:

        ```jsx
        <RecordCard name="Навушники" price={80} />
        ```

        React збирає всі атрибути в один об’єкт — [[props]] — і викликає функцію з ним: `RecordCard({ name: "Навушники", price: 80 })`. Текст у лапках так і передається текстом, усе інше пишуть у `{}`: число, `null`, змінну, вираз.

        Компонент читає props деструктуруванням параметра й може задати значення за замовчуванням для того, чого не передали:

        ```jsx
        function RecordCard({ name, price, category = "без категорії" }) {
          return <h3>{name}</h3>;
        }
        ```

        Props ідуть **згори вниз**: їх вирішує той, хто пише тег, а компонент лише читає.
      en: |
        So far every card showed the same thing. To make cards differ, you pass data to the component — just like a tag’s attributes:

        ```jsx
        <RecordCard name="Headphones" price={80} />
        ```

        React collects all attributes into one object — the [[props]] — and calls the function with it: `RecordCard({ name: "Headphones", price: 80 })`. Text in quotes becomes a string; everything else goes in `{}`: a number, `null`, a variable, an expression.

        A component reads its props by destructuring the parameter and can set a default value for what was not passed:

        ```jsx
        function RecordCard({ name, price, category = "no category" }) {
          return <h3>{name}</h3>;
        }
        ```

        Props flow **top down**: whoever writes the tag decides them, and the component only reads them.

  - id: missing-category
    kind: prediction
    strings:
      noCategory: { uk: "без категорії", en: "no category" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      home: { uk: "Дім", en: "Home" }
    prompt:
      uk: "Що показує другий абзац `<p>` **першої** картки — той, що з категорією?"
      en: "What does the second `<p>` paragraph of the **first** card — the one with the category — show?"
    lang: jsx
    runnable: false
    code: |
      function RecordCard({ name, price, category = "%%noCategory%%" }) {
        return (
          <article>
            <h3>{name}</h3>
            <p>{price}</p>
            <p>{category}</p>
          </article>
        );
      }

      function App() {
        return (
          <main>
            <RecordCard name="%%mug%%" price={18} />
            <RecordCard name="%%lamp%%" price={45} category="%%home%%" />
          </main>
        );
      }
    answer:
      type: choice
      options:
        - id: default
          text: { uk: "«без категорії»", en: "“no category”" }
        - id: undefined
          text: { uk: "слово `undefined`", en: "the word `undefined`" }
          why:
            uk: "Атрибута `category` немає, тож у props його теж немає — і деструктурування бере значення за замовчуванням. Навіть без нього React не друкує `undefined`, а просто нічого не показує."
            en: "There is no `category` attribute, so props have none either — and destructuring takes the default value. Even without a default, React does not print `undefined`; it shows nothing."
        - id: home
          text: { uk: "«Дім» — з другої картки", en: "“Home” — from the second card" }
          why:
            uk: "Кожне використання `<RecordCard />` — окремий виклик зі своїм об’єктом props. Картки нічого не позичають одна в одної."
            en: "Every use of `<RecordCard />` is a separate call with its own props object. Cards borrow nothing from each other."
        - id: error
          text: { uk: "Помилку: обов’язковий prop не передано", en: "An error: a required prop is missing" }
          why:
            uk: "У JavaScript немає обов’язкових props: чого не передали, того просто немає в об’єкті. Позначити prop обов’язковим можна типами — і тоді про пропуск скаже `tsc`, а не запуск."
            en: "JavaScript has no required props: what was not passed is simply absent from the object. Types can mark a prop as required — and then `tsc` reports the gap, not the run."
      correct: [default]
    explanation:
      uk: "Перший `<RecordCard />` не має атрибута `category`, тож `props.category` — `undefined`, і деструктурування підставляє «без категорії». Друга картка передає своє значення. Зауваж: значення за замовчуванням спрацьовує лише для `undefined`; якщо передати `category={null}`, абзац буде порожнім."
      en: "The first `<RecordCard />` has no `category` attribute, so `props.category` is `undefined`, and destructuring puts in “no category”. The second card passes its own value. Note: a default applies only to `undefined`; if you pass `category={null}`, the paragraph is empty."

  - id: frozen-props
    kind: prediction
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    prompt:
      uk: "Компонент вирішив сам «обнулити» ціну, перш ніж її показати. Що буде після запуску?"
      en: "The component decides to “reset” the price itself before showing it. What happens after running?"
    lang: jsx
    runnable: false
    code: |
      function RecordCard(props) {
        props.price = 0;
        return <p>{props.name}: {props.price}</p>;
      }

      function App() {
        return <RecordCard name="%%lamp%%" price={45} />;
      }
    answer:
      type: choice
      options:
        - id: type-error
          text:
            uk: "Сторінка порожня, а в консолі — `TypeError: Cannot assign to read only property 'price'`"
            en: "The page is empty, and the console shows `TypeError: Cannot assign to read only property 'price'`"
        - id: zero
          text: { uk: "«Настільна лампа: 0»", en: "“Desk lamp: 0”" }
          why:
            uk: "Props належать тому, хто написав тег. Під час розробки React заморожує об’єкт props, і спроба змінити поле кидає `TypeError`."
            en: "Props belong to whoever wrote the tag. During development React freezes the props object, and an attempt to change a field throws a `TypeError`."
        - id: forty-five
          text: { uk: "«Настільна лампа: 45» — зміна тихо ігнорується", en: "“Desk lamp: 45” — the change is silently ignored" }
          why:
            uk: "Мовчки не вийде: модулі працюють у строгому режимі, а запис у заморожений об’єкт у строгому режимі — помилка."
            en: "Not silently: modules run in strict mode, and writing to a frozen object in strict mode is an error."
      correct: [type-error]
    explanation:
      uk: "Під час розробки React заморожує props (`Object.freeze`), а модулі виконуються в строгому режимі, тож присвоєння кидає `TypeError`. Помилка під час рендеру зупиняє React: сторінка порожня, у консолі — картка помилки й попередження *An error occurred in the &lt;RecordCard&gt; component*. Щоб показати інше значення, компонент обчислює **нову змінну** з props або просить інше значення в того, хто пише тег."
      en: "During development React freezes the props (`Object.freeze`), and modules run in strict mode, so the assignment throws a `TypeError`. An error during render stops React: the page is empty, and the console shows the error card and the warning *An error occurred in the &lt;RecordCard&gt; component*. To show a different value, a component computes a **new variable** from the props or asks whoever writes the tag for another value."

  - id: children-and-types
    kind: explanation
    title:
      uk: "children і типи props"
      en: "children and prop types"
    body:
      uk: |
        Те, що стоїть **між** тегами компонента, теж приходить у props — у поле [[children-prop|children]]:

        ```jsx
        <Panel heading="Покупки">
          <RecordCard name="Навушники" price={80} />
        </Panel>
        ```

        `Panel` отримує `{ heading: "Покупки", children: <RecordCard … /> }` і сам вирішує, куди поставити `{children}`. Так роблять обгортки: рамка, заголовок, відступи — а вміст будь-який.

        У файлі [[tsx|.tsx]] props описують типом, як модель запису:

        ```tsx
        import type { ReactNode } from "react";

        type PanelProps = {
          heading: string;
          note?: string;        // optional
          children: ReactNode;  // anything React can show
        };

        function Panel({ heading, note, children }: PanelProps) { … }
        ```

        `ReactNode` — тип усього, що React уміє показати: елементи JSX, текст, числа, `null`, масиви з них. Цей тип — підказка для `tsc`: пісочниця, як і в розділі про TypeScript, типи лише прибирає.
      en: |
        Whatever stands **between** a component’s tags arrives in props too — in the [[children-prop|children]] field:

        ```jsx
        <Panel heading="Shopping">
          <RecordCard name="Headphones" price={80} />
        </Panel>
        ```

        `Panel` gets `{ heading: "Shopping", children: <RecordCard … /> }` and decides itself where to put `{children}`. That is how wrappers work: a frame, a heading, spacing — and any content.

        In a [[tsx|.tsx]] file props are described with a type, like a record model:

        ```tsx
        import type { ReactNode } from "react";

        type PanelProps = {
          heading: string;
          note?: string;        // optional
          children: ReactNode;  // anything React can show
        };

        function Panel({ heading, note, children }: PanelProps) { … }
        ```

        `ReactNode` is the type of everything React can show: JSX elements, text, numbers, `null`, arrays of those. The type is a hint for `tsc`: the sandbox, as in the TypeScript unit, only removes types.

  - id: props-flow
    kind: visual
    visual: diagram
    title:
      uk: "Props ідуть униз, children проходять крізь обгортку"
      en: "Props flow down, children pass through a wrapper"
    textEquivalent:
      uk: "App пише тег Card з атрибутом title і вкладає в нього дві картки RecordCard. Card отримує об’єкт props із двома полями: title — текст заголовка, і children — ці дві вже готові картки. Card показує заголовок, а children ставить під ним без змін. Кожна RecordCard отримує свої name і price від App — того, хто написав її тег; Card їх не бачить і не змінює. Дані йдуть лише згори вниз: щоб картка показала інше, App має передати інші props."
      en: "App writes a Card tag with a title attribute and nests two RecordCard cards inside it. Card gets a props object with two fields: title — the heading text, and children — those two ready-made cards. Card shows the heading and puts children under it unchanged. Each RecordCard gets its own name and price from App — whoever wrote its tag; Card neither sees nor changes them. Data flows only top down: for a card to show something else, App has to pass other props."
    spec:
      layout: grid
      nodes:
        - { id: app, label: "App", col: 0, row: 0, w: 120 }
        - { id: card, label: "Card", col: 0, row: 1, w: 120 }
        - { id: slot, label: "{children}", shape: note, col: 1, row: 1, w: 120 }
        - { id: rc1, label: "RecordCard", col: 0, row: 2, w: 120 }
        - { id: rc2, label: "RecordCard", col: 1, row: 2, w: 120 }
      edges:
        - { id: title, from: app, to: card, label: "title" }
        - { id: puts, from: card, to: slot, kind: dashed }
        - { id: s1, from: slot, to: rc1, label: "name, price" }
        - { id: s2, from: slot, to: rc2, label: "name, price" }
      steps:
        - caption:
            uk: "Дерево з обгорткою: `App` використовує `Card`, а всередині `<Card>…</Card>` пише дві `RecordCard`."
            en: "A tree with a wrapper: `App` uses `Card`, and inside `<Card>…</Card>` it writes two `RecordCard`."
        - caption:
            uk: "Атрибут `title` стає полем props: `Card` отримує `{ title: … }` і показує його в заголовку."
            en: "The `title` attribute becomes a props field: `Card` gets `{ title: … }` and shows it in the heading."
          highlight: [app, card, title]
          dim: [rc1, rc2, s1, s2]
        - caption:
            uk: "Дві картки між тегами — це `props.children`. `Card` не знає, що там: він лише ставить `{children}` під заголовком."
            en: "The two cards between the tags are `props.children`. `Card` does not know what they are: it just puts `{children}` under the heading."
          highlight: [card, puts, slot]
          dim: [app, title]
        - caption:
            uk: "`name` і `price` кожної картки написав `App` у її тегу. `Card` їх не читає й не змінює — вони проходять крізь обгортку як є."
            en: "`App` wrote each card’s `name` and `price` in its tag. `Card` neither reads nor changes them — they pass through the wrapper as they are."
          highlight: [slot, s1, s2, rc1, rc2]
          dim: [title]
        - caption:
            uk: "Дані йдуть лише вниз. Щоб картка показала інше, `App` передає інші props — сама картка свої props не змінює."
            en: "Data flows only down. For a card to show something else, `App` passes other props — a card never changes its own."
          highlight: [app, title, s1, s2]

  - id: typed-card
    kind: example
    runtime: browser-react
    dir: typed-card
    entry: main.tsx
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      tech: { uk: "Техніка", en: "Tech" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      home: { uk: "Дім", en: "Home" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      noCategory: { uk: "без категорії", en: "no category" }
      noPrice: { uk: "без ціни", en: "no price" }
      currency: { uk: "грн", en: "UAH" }
    title:
      uk: "Типізована картка в пісочниці"
      en: "A typed card in the sandbox"
    body:
      uk: |
        `RecordCard.tsx` описує props типом `RecordCardProps`: `name` — текст, `price` — число або `null`, `category` — необов’язковий текст. `main.tsx` малює три картки. Натисни **Запустити**: у третьої картки немає ціни й категорії.
      en: |
        `RecordCard.tsx` describes its props with the type `RecordCardProps`: `name` is text, `price` is a number or `null`, `category` is optional text. `main.tsx` draws three cards. Press **Run**: the third card has no price and no category.
    tryIt:
      uk: |
        1. У `main.tsx` заміни `price={45}` на `price="45"` — текст замість числа — і запусти. Картка виглядає так само, жодної помилки: пісочниця прибирає типи й нічого не перевіряє.
        2. Тепер видали в тому самому тегу `name="…"` разом із лапками й запусти: заголовок картки порожній, і знову без помилки. Обидві помилки знайде `tsc` у локальному завданні нижче.
      en: |
        1. In `main.tsx` replace `price={45}` with `price="45"` — text instead of a number — and run. The card looks the same, no error at all: the sandbox removes the types and checks nothing.
        2. Now delete `name="…"` with its quotes in the same tag and run: the card’s heading is empty, and again no error. `tsc` finds both mistakes in the local task below.

  - id: check-with-tsc
    kind: local-task
    runtime: local-web
    title:
      uk: "Хай tsc перевірить props"
      en: "Let tsc check the props"
    intro:
      uk: |
        Ти працюватимеш у лабораторії `~/js-course/ts-lab` з розділу про TypeScript: додаси туди React з його типами й попросиш `tsc` перевірити компонент. Команди однакові для macOS, Linux і Windows PowerShell; їх перевірено в macOS із Node.js v25.2.1, npm 11.6.2, TypeScript 7.0.2, React 19.3.0 і `@types/react` 19.3.0. У Linux і Windows їх не запускали.

        **Якщо теки `ts-lab` немає** (ти не проходив розділ про TypeScript на цьому комп’ютері), створи її так, а тоді створи в ній `tsconfig.json` із вмістом нижче. Перший рядок потрібен, лише якщо немає й самої теки `~/js-course`; якщо вона є, `mkdir` скаже, що тека існує, — це не завадить.

        ```sh
        mkdir ~/js-course
        mkdir ~/js-course/ts-lab
        cd ~/js-course/ts-lab
        npm init -y
        npm pkg set type=module
        npm install --save-dev typescript
        ```

        **`tsconfig.json` після кроку 4** — у нього додано рядок `"jsx": "react-jsx"`, решта така, як у розділі про TypeScript:

        ```json
        {
          "compilerOptions": {
            "strict": true,
            "jsx": "react-jsx",
            "target": "es2023",
            "lib": ["es2023", "dom"],
            "module": "esnext",
            "moduleResolution": "bundler",
            "moduleDetection": "force",
            "verbatimModuleSyntax": true,
            "rewriteRelativeImportExtensions": true,
            "rootDir": "src",
            "outDir": "out",
            "types": []
          },
          "include": ["src"]
        }
        ```

        **Файл `src/re01/RecordCard.tsx` для кроку 5:**

        ```tsx
        type RecordCardProps = {
          name: string;
          price: number | null;
          category?: string;
        };

        export function RecordCard({ name, price, category = "без категорії" }: RecordCardProps) {
          return (
            <article>
              <h3>{name}</h3>
              <p>{price === null ? "без ціни" : `${price} грн`}</p>
              <p>{category}</p>
            </article>
          );
        }

        export const cards = (
          <>
            <RecordCard name="Навушники" price={80} category="Техніка" />
            <RecordCard name="Настільна лампа" price="45" />
            <RecordCard price={18} category="Дім" />
          </>
        );
        ```

        **Що показує `tsc` на кроці 6:**

        ```text
        src/re01/RecordCard.tsx(20,40): error TS2322: Type 'string' is not assignable to type 'number'.
        src/re01/RecordCard.tsx(21,6): error TS2741: Property 'name' is missing in type '{ price: number; category: string; }' but required in type 'RecordCardProps'.
        ```
      en: |
        You will work in the lab `~/js-course/ts-lab` from the TypeScript unit: add React with its types there and ask `tsc` to check a component. The commands are the same on macOS, Linux and Windows PowerShell; they were checked on macOS with Node.js v25.2.1, npm 11.6.2, TypeScript 7.0.2, React 19.3.0 and `@types/react` 19.3.0. They were not run on Linux or Windows.

        **If there is no `ts-lab` folder** (you did not do the TypeScript unit on this computer), create it like this, then create a `tsconfig.json` in it with the contents below. The first line is needed only when there is no `~/js-course` folder either; if it exists, `mkdir` says the folder exists — that does no harm.

        ```sh
        mkdir ~/js-course
        mkdir ~/js-course/ts-lab
        cd ~/js-course/ts-lab
        npm init -y
        npm pkg set type=module
        npm install --save-dev typescript
        ```

        **`tsconfig.json` after step 4** — the line `"jsx": "react-jsx"` is added; the rest is as in the TypeScript unit:

        ```json
        {
          "compilerOptions": {
            "strict": true,
            "jsx": "react-jsx",
            "target": "es2023",
            "lib": ["es2023", "dom"],
            "module": "esnext",
            "moduleResolution": "bundler",
            "moduleDetection": "force",
            "verbatimModuleSyntax": true,
            "rewriteRelativeImportExtensions": true,
            "rootDir": "src",
            "outDir": "out",
            "types": []
          },
          "include": ["src"]
        }
        ```

        **The file `src/re01/RecordCard.tsx` for step 5:**

        ```tsx
        type RecordCardProps = {
          name: string;
          price: number | null;
          category?: string;
        };

        export function RecordCard({ name, price, category = "no category" }: RecordCardProps) {
          return (
            <article>
              <h3>{name}</h3>
              <p>{price === null ? "no price" : `${price} UAH`}</p>
              <p>{category}</p>
            </article>
          );
        }

        export const cards = (
          <>
            <RecordCard name="Headphones" price={80} category="Tech" />
            <RecordCard name="Desk lamp" price="45" />
            <RecordCard price={18} category="Home" />
          </>
        );
        ```

        **What `tsc` shows in step 6:**

        ```text
        src/re01/RecordCard.tsx(20,34): error TS2322: Type 'string' is not assignable to type 'number'.
        src/re01/RecordCard.tsx(21,6): error TS2741: Property 'name' is missing in type '{ price: number; category: string; }' but required in type 'RecordCardProps'.
        ```
    tools:
      - { name: "Node.js", version: { uk: "22 або новіший", en: "22 or newer" }, note: { uk: "перевірено з v25.2.1", en: "checked with v25.2.1" } }
      - { name: "npm", version: "10+", note: { uk: "встановлюється разом із Node.js", en: "comes with Node.js" } }
      - { name: "TypeScript", version: "7.x", note: { uk: "уже є в `ts-lab`; дає команду `tsc`", en: "already in `ts-lab`; provides the `tsc` command" } }
      - { name: "React", version: "19.x", note: { uk: "встановиш у цьому завданні разом із `@types/react`", en: "you install it in this task together with `@types/react`" } }
    steps:
      - text:
          uk: "Перейди в лабораторію. Якщо термінал каже, що такої теки немає, спершу створи її командами з початку завдання."
          en: "Go to the lab. If the terminal says there is no such folder, create it first with the commands at the start of the task."
        command: "cd ~/js-course/ts-lab"
      - text:
          uk: "Встанови React — бібліотеку, яку імпортують компоненти."
          en: "Install React — the library the components import."
        command: "npm install react react-dom"
        expect:
          uk: "`added 3 packages, and audited … packages in …` і `found 0 vulnerabilities`. Три пакети — це `react`, `react-dom` і `scheduler`, від якого залежить `react-dom`."
          en: "`added 3 packages, and audited … packages in …` and `found 0 vulnerabilities`. The three packages are `react`, `react-dom` and `scheduler`, which `react-dom` depends on."
      - text:
          uk: "Встанови типи React як dev-залежності: їх читає лише `tsc`."
          en: "Install React’s types as dev dependencies: only `tsc` reads them."
        command: "npm install --save-dev @types/react @types/react-dom"
        expect:
          uk: "`added 3 packages, …` і `found 0 vulnerabilities`; третій пакет — `csstype`, типи для стилів."
          en: "`added 3 packages, …` and `found 0 vulnerabilities`; the third package is `csstype`, types for styles."
      - text:
          uk: "Відкрий `tsconfig.json` у VS Code і додай після рядка `\"strict\": true,` рядок `\"jsx\": \"react-jsx\",` — як у вмісті на початку завдання. Він каже `tsc`, що JSX у `.tsx` перетворюється автоматично через `react/jsx-runtime`. На файли `.ts` з розділу про TypeScript цей рядок не впливає."
          en: "Open `tsconfig.json` in VS Code and add the line `\"jsx\": \"react-jsx\",` after the line `\"strict\": true,` — as in the contents at the start of the task. It tells `tsc` that JSX in `.tsx` is transformed automatically through `react/jsx-runtime`. The line does not affect the `.ts` files from the TypeScript unit."
      - text:
          uk: "Створи файл `src/re01/RecordCard.tsx` із вмістом з початку завдання. Два останні теги в ньому навмисно неправильні."
          en: "Create the file `src/re01/RecordCard.tsx` with the contents from the start of the task. Its last two tags are wrong on purpose."
      - text:
          uk: "Запусти перевірку."
          en: "Run the check."
        command: "npx tsc --noEmit"
        expect:
          uk: "Дві помилки, як на початку завдання: `TS2322` на рядку 20 (текст `\"45\"` там, де чекають число) і `TS2741` на рядку 21 (бракує обов’язкового `name`). Число в дужках після рядка — стовпчик. Якщо в лабораторії є файли з розділу про TypeScript з помилками, вони теж будуть у списку."
          en: "Two errors, as at the start of the task: `TS2322` on line 20 (the text `\"45\"` where a number is expected) and `TS2741` on line 21 (the required `name` is missing). The number after the line in parentheses is the column. If the lab has files from the TypeScript unit with errors, they appear in the list too."
      - text:
          uk: "Виправ **виклики**, а не тип: заміни `price=\"45\"` на `price={45}`, а в третій тег додай `name` — наприклад, назву «Термочашка». Тип каже правду про дані; помилка — у місці, що передає не те."
          en: "Fix the **call sites**, not the type: replace `price=\"45\"` with `price={45}`, and add a `name` to the third tag — for example the name “Travel mug”. The type tells the truth about the data; the mistake is at the place that passes the wrong thing."
      - text:
          uk: "Запусти перевірку ще раз."
          en: "Run the check again."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого: помилок немає, і `tsc` просто повертає запрошення терміналу."
          en: "Nothing: there are no errors, and `tsc` simply returns to the terminal prompt."
    verify:
      - id: saw-two-errors
        text:
          uk: "Я побачив `TS2322` і `TS2741` для двох неправильних тегів."
          en: "I saw `TS2322` and `TS2741` for the two wrong tags."
      - id: clean-after-fix
        text:
          uk: "Після виправлення викликів `npx tsc --noEmit` нічого не виводить."
          en: "After fixing the call sites `npx tsc --noEmit` prints nothing."
    troubleshooting:
      - problem:
          uk: "Кожен тег дає `error TS17004: Cannot use JSX unless the '--jsx' flag is provided.` і ще `TS7026`."
          en: "Every tag gives `error TS17004: Cannot use JSX unless the '--jsx' flag is provided.` plus `TS7026`."
        fix:
          uk: "У `tsconfig.json` бракує рядка `\"jsx\": \"react-jsx\",` (крок 4) або зміну в `tsconfig.json` ще не збережено. Додай рядок, збережи файл і запусти перевірку знову."
          en: "`tsconfig.json` lacks the line `\"jsx\": \"react-jsx\",` (step 4), or the change to `tsconfig.json` is not saved yet. Add the line, save the file and run the check again."
      - problem:
          uk: "`npx tsc` пропонує встановити пакет `tsc` (`Need to install the following packages`)."
          en: "`npx tsc` offers to install a package `tsc` (`Need to install the following packages`)."
        fix:
          uk: "Ти не в теці `ts-lab` або в ній ще немає TypeScript. Відмов (`n`), перейди в `~/js-course/ts-lab` і, якщо треба, виконай `npm install --save-dev typescript`."
          en: "You are not in the `ts-lab` folder, or it has no TypeScript yet. Decline (`n`), go to `~/js-course/ts-lab` and, if needed, run `npm install --save-dev typescript`."
    recovery:
      uk: "Усе це живе лише в `~/js-course/ts-lab`; твій проєкт не змінюється. Якщо файл `RecordCard.tsx` заплутався, видали його й створи знову з вмісту на початку завдання."
      en: "All of this lives only in `~/js-course/ts-lab`; your project does not change. If the file `RecordCard.tsx` gets tangled, delete it and create it again from the contents at the start of the task."

  - id: recall-typed-destructuring
    kind: review
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    title:
      uk: "Згадай: типи записів і деструктурування"
      en: "Recall: record types and destructuring"
    items:
      - id: destructure-param
        from: js-04-09-destructuring-spread
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          function describe({ name, price = 0 }) {
            return `${name}: ${price}`;
          }
          console.log(describe({ name: "%%lamp%%", price: null }));
        verify: { logs: ["%%lamp%%: null"] }
        answer:
          type: choice
          options:
            - id: null-shown
              text: { uk: "`Настільна лампа: null`", en: "`Desk lamp: null`" }
            - id: zero
              text: { uk: "`Настільна лампа: 0`", en: "`Desk lamp: 0`" }
              why:
                uk: "Значення за замовчуванням спрацьовує лише тоді, коли поле — `undefined`. `null` — це передане значення."
                en: "A default applies only when the field is `undefined`. `null` is a value that was passed."
            - id: undef
              text: { uk: "`undefined: null`", en: "`undefined: null`" }
              why:
                uk: "Деструктурування параметра бере поля з переданого об’єкта за назвою: `name` знайдено."
                en: "Destructuring a parameter takes the fields of the passed object by name: `name` is found."
          correct: [null-shown]
        explanation:
          uk: "Деструктурування в параметрі — те саме, що `const { name, price = 0 } = arg`. Значення за замовчуванням замінює лише `undefined`, тож `null` лишається `null`. Props компонентів читають саме так."
          en: "Destructuring in a parameter is the same as `const { name, price = 0 } = arg`. A default replaces only `undefined`, so `null` stays `null`. Component props are read exactly like this."
      - id: type-is-for-tsc
        from: js-14-02-modeling-domain-types
        prompt:
          uk: "Модель бажання описано як `type Wish = { readonly id: string; name: string; price: number | null }`. Що з цього правда?"
          en: "A wish model is described as `type Wish = { readonly id: string; name: string; price: number | null }`. Which of these is true?"
        answer:
          type: choice
          options:
            - id: compile-only
              text:
                uk: "`tsc` перевіряє за цим типом код, що створює й передає бажання; у JavaScript після компіляції від `Wish` нічого не лишається"
                en: "`tsc` checks the code that creates and passes wishes against this type; nothing of `Wish` is left in the JavaScript after compiling"
            - id: runtime
              text:
                uk: "Під час виконання об’єкт, прочитаний зі сховища, перевіряється на відповідність `Wish`"
                en: "At runtime an object read from storage is checked against `Wish`"
              why:
                uk: "Типи стираються. Дані ззовні перевіряє лише код перевірки, написаний вручну."
                en: "Types are erased. Outside data is checked only by validation code you write yourself."
            - id: readonly-runtime
              text:
                uk: "`readonly` забороняє змінювати `id` і під час виконання"
                en: "`readonly` also forbids changing `id` at runtime"
              why:
                uk: "`readonly` — теж лише для `tsc`: у JavaScript після компіляції це звичайне поле."
                en: "`readonly` is also only for `tsc`: after compiling it is an ordinary field in JavaScript."
          correct: [compile-only]
        explanation:
          uk: "Тип моделі — домовленість, яку перевіряє `tsc` до запуску. Тип props працює так само: він ловить неправильний виклик компонента в редакторі, але не зіпсований запис зі сховища під час виконання."
          en: "A model type is an agreement that `tsc` checks before running. A props type works the same way: it catches a wrong component call in the editor, but not a damaged record from storage at runtime."

  - id: today-card
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: today-card
    entry: main.tsx
    editable: [Card.tsx, App.tsx]
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      noDue: { uk: "без терміну", en: "no due date" }
      doneLabel: { uk: "виконано", en: "done" }
      pendingLabel: { uk: "не виконано", en: "not done" }
      today: { uk: "Сьогодні", en: "Today" }
      testTitle: { uk: "Перевірка", en: "Check" }
      first: { uk: "перший", en: "first" }
      second: { uk: "другий", en: "second" }
    title:
      uk: "Обгортка Card"
      en: "A Card wrapper"
    instructions:
      uk: |
        1. У `Card.tsx` напиши компонент `Card` з типізованими props: `title` — текст і `children` типу `ReactNode`. Він повертає один елемент-обгортку (наприклад, `<section>`), у якому спершу заголовок `<h2>` з `title`, а під ним — `children`.
        2. У `App.tsx` загорни обидві `TaskCard` у `<Card title="Сьогодні">…</Card>`. Не забудь імпортувати `Card`.

        Перевірка малює `Card` з різними children — двома абзацами й просто текстом — і дивиться на сторінку. Типи вона не бачить: їх перевіряє `tsc`, як у локальному завданні. `main.tsx`, `TaskCard.tsx` і `tasks.ts` — лише для перегляду.
      en: |
        1. In `Card.tsx` write the component `Card` with typed props: `title` is text and `children` has the type `ReactNode`. It returns one wrapper element (for example a `<section>`) with an `<h2>` heading with `title` first and the `children` under it.
        2. In `App.tsx` wrap both `TaskCard` in `<Card title="Today">…</Card>`. Do not forget to import `Card`.

        The check draws `Card` with different children — two paragraphs and plain text — and looks at the page. It cannot see the types: `tsc` checks them, as in the local task. `main.tsx`, `TaskCard.tsx` and `tasks.ts` are read-only.
    testTitles:
      "Card shows its title in an h2":
        uk: "`Card` показує `title` у заголовку `<h2>`"
        en: "`Card` shows `title` in an `<h2>` heading"
      "Card shows the children it is given after the heading":
        uk: "`Card` показує передані children під заголовком"
        en: "`Card` shows the children it is given under the heading"
      "Card shows plain text children too":
        uk: "`Card` показує й children-текст"
        en: "`Card` shows text children too"
      "the page shows both task cards inside a Card titled with today":
        uk: "На сторінці обидві картки справ стоять усередині `Card` із заголовком «Сьогодні»"
        en: "On the page both task cards are inside a `Card` titled “Today”"
    hints:
      nudge:
        uk: "Що опиняється в props компонента, коли між його тегами щось написано? І чи всі поля props твій `Card` бере з параметра?"
        en: "What ends up in a component’s props when something is written between its tags? And does your `Card` take every props field from its parameter?"
      explanation:
        uk: |
          Вміст між тегами приходить у поле `children`, і компонент ставить його в JSX, як будь-яке значення: `{children}`. Ось інша обгортка — з підписом унизу:

          ```tsx
          type FooterBoxProps = { caption: string; children: ReactNode };

          function FooterBox({ caption, children }: FooterBoxProps) {
            return <figure>{children}<figcaption>{caption}</figcaption></figure>;
          }
          ```

          Назви полів у типі, у деструктуруванні й в атрибуті виклику мають збігатися.
        en: |
          The content between the tags arrives in the `children` field, and the component puts it into JSX like any value: `{children}`. Here is another wrapper — with a caption at the bottom:

          ```tsx
          type FooterBoxProps = { caption: string; children: ReactNode };

          function FooterBox({ caption, children }: FooterBoxProps) {
            return <figure>{children}<figcaption>{caption}</figcaption></figure>;
          }
          ```

          The field names in the type, in the destructuring and in the call site’s attribute must match.
    solutionNote:
      uk: "`Card` не знає, що в нього вкладуть: він лише ставить `{children}` під заголовком. Тому одна обгортка підходить і для карток справ, і для тексту, і для будь-чого іншого. `children: ReactNode` каже `tsc`, що вкладати можна все, що React уміє показати."
      en: "`Card` does not know what will be nested in it: it just puts `{children}` under the heading. That is why one wrapper fits task cards, text and anything else. `children: ReactNode` tells `tsc` that anything React can show may be nested."
    feedback:
      - when: { test: "Card shows its title in an h2" }
        message:
          uk: "Ця перевірка малює `<Card title=\"Перевірка\">` і шукає `<h2>` з цим текстом. Якщо заголовок порожній, перевір, що поле називається `title` і в типі, і в деструктуруванні параметра."
          en: "This check draws `<Card title=\"Check\">` and looks for an `<h2>` with that text. If the heading is empty, check that the field is called `title` both in the type and in the parameter’s destructuring."
      - when: { test: "Card shows the children it is given after the heading" }
        message:
          uk: "Ця перевірка вкладає в `Card` два абзаци й чекає їх під заголовком. Якщо їх немає, `Card` не ставить `{children}` у свій JSX."
          en: "This check nests two paragraphs in `Card` and expects them under the heading. If they are missing, `Card` does not put `{children}` into its JSX."
      - when: { test: "the page shows both task cards inside a Card titled with today" }
        message:
          uk: "Ця перевірка шукає на сторінці `<h2>` «Сьогодні» і дві картки справ у тому самому елементі-обгортці. Обидві `<TaskCard … />` мають стояти між `<Card title=\"Сьогодні\">` і `</Card>` у `App.tsx`."
          en: "This check looks for an `<h2>` “Today” on the page and both task cards in the same wrapper element. Both `<TaskCard … />` must stand between `<Card title=\"Today\">` and `</Card>` in `App.tsx`."
      - when: { error: ReferenceError }
        message:
          uk: "`ReferenceError`: назву не знайдено. Якщо це `Card is not defined`, у `App.tsx` бракує рядка `import { Card } from \"./Card\";`."
          en: "`ReferenceError`: a name was not found. If it is `Card is not defined`, `App.tsx` lacks the line `import { Card } from \"./Card\";`."
      - when: { error: TypeError }
        message:
          uk: "`TypeError`: значення не того виду, якого чекає код. Якщо сторінка порожня, а в консолі є *An error occurred in the &lt;…&gt; component*, помилка сталася під час рендеру цього компонента — рядок указано в картці помилки. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "`TypeError`: a value is not of the kind the code expects. If the page is empty and the console shows *An error occurred in the &lt;…&gt; component*, the error happened while that component rendered — the error card names the line. If every check fails at once, fix the first error in the console first."

  - id: to-project
    kind: transfer
    capstoneStep: RE-01
    body:
      uk: "У кроці проєкту картка твого запису отримає весь запис одним типізованим prop (`{ item: Wish }`, `{ task: Task }` …): тип запису з доменного модуля вже каже, яке поле може бути `null`, і картка показує для нього запасний текст. А обгортка `Section` з `title` і `children`, як `Card` у цьому уроці, дасть спільну рамку із заголовком формі й списку."
      en: "In the project step your record card gets the whole record as one typed prop (`{ item: Wish }`, `{ task: Task }` …): the record type from the domain module already says which field may be `null`, and the card shows a fallback text for it. And a `Section` wrapper with `title` and `children`, like `Card` in this lesson, gives the form and the list a shared frame with a heading."
