id: re-01-02-jsx-rules
unit: RE-01
title:
  uk: "Правила JSX"
  en: "JSX rules"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити, які шматки JSX компілюються, і виправити решту: один корінь або фрагмент, закриті теги, `className` і `htmlFor`, атрибути в camelCase."
    en: "Predict which JSX snippets compile and repair the rest: one root or a fragment, closed tags, className and htmlFor, camelCase attributes."
  - uk: "Вставляти вирази JavaScript у JSX через `{}` і пояснити, чому інструкції на кшталт `if` чи `for` туди не можна."
    en: "Embed JavaScript expressions in JSX with {} and explain why statements such as if or for cannot go there."
prerequisites: [re-01-01-why-components, js-01-06-html-elements-attributes]
subskills:
  - { family: R-01, skill: "JSX rules", depth: intro }
glossary: [jsx, jsx-fragment]
selfCheck: [which-compile, habit-card]

blocks:
  - id: jsx-is-javascript
    kind: explanation
    title:
      uk: "JSX лише схожий на HTML"
      en: "JSX only looks like HTML"
    body:
      uk: |
        [[jsx|JSX]] виглядає як HTML, але живе всередині JavaScript. Перед запуском його перетворюють на звичайний JavaScript: у пісочниці це робить компілятор Babel, у проєкті на твоєму комп’ютері — збирач на кшталт esbuild. Кожен тег стає викликом функції, яка створює об’єкт-опис:

        ```jsx
        const title = <h2 className="title">Звички</h2>;
        // after compiling, roughly:
        const title = jsx("h2", { className: "title", children: "Звички" });
        ```

        Звідси й правила: усе, що написано в JSX, має бути правильним **JavaScript**. Атрибути стають полями об’єкта, вміст між тегами — полем `children`, а `{…}` — місцем, куди JavaScript підставляє значення.

        Перш ніж читати правила, перевір свою інтуїцію.
      en: |
        [[jsx|JSX]] looks like HTML but lives inside JavaScript. Before running it is translated into plain JavaScript: in the sandbox the Babel compiler does it, in a project on your computer a bundler such as esbuild. Every tag becomes a function call that creates a description object:

        ```jsx
        const title = <h2 className="title">Habits</h2>;
        // after compiling, roughly:
        const title = jsx("h2", { className: "title", children: "Habits" });
        ```

        That is where the rules come from: everything written in JSX must be valid **JavaScript**. Attributes become fields of an object, the content between the tags becomes the `children` field, and `{…}` is the place where JavaScript puts a value.

        Before reading the rules, test your intuition.

  - id: which-compile
    kind: prediction
    strings:
      habits: { uk: "Звички", en: "Habits" }
      active: { uk: "3 активні", en: "3 active" }
      run: { uk: "Біг", en: "Running" }
      daily: { uk: "Щодня", en: "Daily" }
      name: { uk: "Назва", en: "Name" }
      yes: { uk: "так", en: "yes" }
      notYet: { uk: "ще ні", en: "not yet" }
    prompt:
      uk: "Кожен варіант — тіло компонента `function Snippet() { … }`, а `done` — змінна зі значенням `false`. Познач **усі** варіанти, з якими код **не вдасться запустити** («Код не вдалося запустити»)."
      en: "Each option is the body of a component `function Snippet() { … }`, and `done` is a variable holding `false`. Mark **all** options with which the code **cannot start** (“The code could not start”)."
    answer:
      type: multi
      options:
        - id: two-roots
          code: "return <h2>%%habits%%</h2><p>%%active%%</p>;"
        - id: open-img
          code: "return <img src=\"run.svg\" alt=\"%%run%%\">;"
        - id: class
          code: "return <p class=\"note\">%%daily%%</p>;"
          why:
            uk: "Запуститься: JSX дозволяє будь-яку назву атрибута. Але React попередить у консолі `Invalid DOM property` і підкаже `className`."
            en: "It starts: JSX allows any attribute name. But React warns in the console with `Invalid DOM property` and suggests `className`."
        - id: for
          code: "return <label for=\"name\">%%name%%</label>;"
          why:
            uk: "Запуститься, але з попередженням у консолі: для `<label>` у JSX пишуть `htmlFor`."
            en: "It starts, but with a warning in the console: for a `<label>` JSX uses `htmlFor`."
        - id: if-in-braces
          code: "return <p>{if (done) { \"%%yes%%\" }}</p>;"
        - id: ternary
          code: "return <p>{done ? \"%%yes%%\" : \"%%notYet%%\"}</p>;"
          why:
            uk: "Тернарний оператор — це вираз, він дає значення, тож у `{}` він на своєму місці. На сторінці буде «ще ні»."
            en: "The ternary operator is an expression that produces a value, so it belongs in `{}`. The page shows “not yet”."
      correct: [two-roots, open-img, if-in-braces]
    explanation:
      uk: |
        Не запускаються три варіанти:

        - два елементи поруч: функція повертає **одне** значення, а тут їх два — компілятор пише *Adjacent JSX elements must be wrapped in an enclosing tag* і сам пропонує фрагмент `<>...</>`;
        - `<img …>` без `/`: у JSX кожен тег закривають, і компілятор шукає `</img>` аж до кінця файлу (*Unterminated JSX contents*) — тому рядок у картці може бути далеко від справжньої помилки;
        - `if` у дужках: у `{}` можна лише вираз, а `if` — інструкція (*Unexpected token*).

        `class` і `for` запускаються, але React попереджає в консолі. Тернарний оператор — вираз, тож усе гаразд.
      en: |
        Three options do not start:

        - two elements side by side: a function returns **one** value, and here are two — the compiler says *Adjacent JSX elements must be wrapped in an enclosing tag* and itself suggests a fragment `<>...</>`;
        - `<img …>` without `/`: in JSX every tag is closed, and the compiler looks for `</img>` all the way to the end of the file (*Unterminated JSX contents*) — so the line in the card can be far from the real mistake;
        - `if` inside braces: `{}` takes only an expression, and `if` is a statement (*Unexpected token*).

        `class` and `for` start, but React warns in the console. The ternary is an expression, so it is fine.

  - id: the-rules
    kind: explanation
    title:
      uk: "Чотири правила JSX"
      en: "Four rules of JSX"
    body:
      uk: |
        | Правило | HTML | JSX |
        |---|---|---|
        | Один корінь | кілька елементів поруч — нормально | один елемент або [[jsx-fragment\|фрагмент]] `<>…</>` |
        | Теги закриті | `<img …>`, `<br>`, `<input …>` | `<img … />`, `<br />`, `<input … />` |
        | Назви атрибутів | `class`, `for`, `tabindex` | `className`, `htmlFor`, `tabIndex` |
        | Значення | лише текст | текст у лапках або `{вираз}` |

        - **Фрагмент** `<>…</>` групує елементи, не додаючи в DOM зайвого вузла: на сторінці будуть лише `<h2>` і `<p>`.
        - **Назви атрибутів** — це назви властивостей DOM-елемента в JavaScript. `class` і `for` — зарезервовані слова JavaScript, тому властивості звуться `className` і `htmlFor`. Складені назви пишуть у camelCase: `tabIndex`. Винятки — `aria-*` і `data-*`: вони лишаються з дефісом, як в HTML.
        - **`{}` приймає вираз** — те, що має значення: змінну, `habit.name`, виклик функції, шаблонний рядок, тернарний оператор. Інструкції (`if`, `for`, `const`) значення не мають, тож їх пишуть **до** `return`, а в JSX вставляють результат.

        Атрибут теж може бути виразом: `alt={habit.name}` — без лапок навколо `{}`.
      en: |
        | Rule | HTML | JSX |
        |---|---|---|
        | One root | several elements side by side are fine | one element or a [[jsx-fragment\|fragment]] `<>…</>` |
        | Tags closed | `<img …>`, `<br>`, `<input …>` | `<img … />`, `<br />`, `<input … />` |
        | Attribute names | `class`, `for`, `tabindex` | `className`, `htmlFor`, `tabIndex` |
        | Values | only text | quoted text or `{expression}` |

        - A **fragment** `<>…</>` groups elements without adding an extra node to the DOM: the page gets only the `<h2>` and the `<p>`.
        - **Attribute names** are the names of the DOM element’s properties in JavaScript. `class` and `for` are reserved words of JavaScript, so the properties are called `className` and `htmlFor`. Compound names are written in camelCase: `tabIndex`. The exceptions are `aria-*` and `data-*`: they keep their dash, as in HTML.
        - **`{}` takes an expression** — something that has a value: a variable, `habit.name`, a function call, a template literal, a ternary. Statements (`if`, `for`, `const`) have no value, so you write them **before** `return` and put the result into the JSX.

        An attribute can be an expression too: `alt={habit.name}` — with no quotes around the `{}`.

  - id: fix-the-card
    kind: example
    runtime: browser-react
    dir: fix-the-card
    entry: main.jsx
    expectError: true
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      note: { uk: "Нотатка", en: "Note" }
    title:
      uk: "Картка, скопійована з HTML"
      en: "A card copied from HTML"
    body:
      uk: |
        У `WishCard.jsx` — картка бажання, переписана з HTML як є. Натисни **Запустити**: замість сторінки з’явиться картка «Код не вдалося запустити» з повідомленням компілятора й рядком, де він зупинився.
      en: |
        `WishCard.jsx` holds a wish card rewritten from HTML as it was. Press **Run**: instead of a page you get the card “The code could not start” with the compiler’s message and the line where it stopped.
    tryIt:
      uk: |
        1. Прочитай повідомлення: *Adjacent JSX elements must be wrapped in an enclosing tag*. Додай `<>` одразу після `return (` і `</>` перед `);`, тоді запусти знову. Сторінка показує заголовок, підпис і поле.
        2. Тепер подивись на вкладку **Консоль**: там два червоні повідомлення, що починаються з `Invalid DOM property`. Консоль платформи показує їх так, як їх надіслав React: з `%s` у тексті, а за ним — справжня назва атрибута й підказка, наприклад `class` і `className`.
        3. Заміни `class` на `className`, а `for` на `htmlFor` і запусти ще раз: консоль порожня.
      en: |
        1. Read the message: *Adjacent JSX elements must be wrapped in an enclosing tag*. Add `<>` right after `return (` and `</>` before `);`, then run again. The page shows the heading, the label and the field.
        2. Now look at the **Console** tab: there are two red messages that start with `Invalid DOM property`. The platform’s console shows them the way React sent them: with `%s` in the text, followed by the real attribute name and the suggestion, for example `class` and `className`.
        3. Replace `class` with `className` and `for` with `htmlFor` and run again: the console is empty.

  - id: recall-ternary
    kind: review
    strings:
      yes: { uk: "є", en: "some" }
      none: { uk: "немає", en: "none" }
    title:
      uk: "Згадай: тернарний оператор"
      en: "Recall: the ternary operator"
    items:
      - id: ternary-value
        from: js-02-03-truthiness-logic-ternary
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const completions = 0;
          const label = completions ? "%%yes%%" : "%%none%%";
          console.log(label);
        verify: { logs: ["%%none%%"] }
        answer:
          type: choice
          options:
            - id: none
              text: { uk: "немає", en: "none" }
            - id: yes
              text: { uk: "є", en: "some" }
              why:
                uk: "`0` — хибне (falsy) значення, тож тернарний оператор бере вираз після `:`."
                en: "`0` is a falsy value, so the ternary takes the expression after `:`."
            - id: zero
              text: { uk: "`0`", en: "`0`" }
              why:
                uk: "Тернарний оператор повертає одну з двох гілок, а не саму умову."
                en: "The ternary returns one of its two branches, not the condition itself."
          correct: [none]
        explanation:
          uk: "Тернарний оператор — вираз: він обчислюється в одне з двох значень. Саме тому його можна покласти в змінну — і саме тому він підходить для `{}` у JSX, а `if` — ні."
          en: "The ternary is an expression: it evaluates to one of two values. That is why it can be stored in a variable — and why it fits inside `{}` in JSX, while `if` does not."

  - id: habit-card
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: habit-card
    entry: main.jsx
    editable: [HabitCard.jsx]
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      iconOf: { uk: "Значок звички", en: "Habit icon" }
      doneTimes: { uk: "Виконано разів", en: "Times done" }
      otherHabit: { uk: "Пити воду", en: "Drink water" }
    title:
      uk: "Картка звички з HTML у JSX"
      en: "A habit card from HTML to JSX"
    instructions:
      uk: |
        Ось картка звички в HTML:

        ```html
        <article class="habit-card">
          <h3>Ранкова зарядка</h3>
          <img src="img/habit.svg" alt="Значок звички: Ранкова зарядка">
          <label for="h-01-count">Виконано разів</label>
          <output id="h-01-count">3</output>
        </article>
        ```

        Перепиши її в `HabitCard.jsx` як JSX, що бере значення з об’єкта `habit` (файл `habit.js`):

        - назва — з `habit.name`, число в `<output>` — кількість елементів у `habit.completions`;
        - `alt` складається з тексту «Значок звички:», пробілу й назви — збери його у `{}`, найзручніше шаблонним рядком;
        - `id` поля `<output>` і `htmlFor` підпису — це `id` звички й `-count`, теж зібрані з даних;
        - назви атрибутів — за правилами JSX.

        Перевірка також підмінить дані звички й переконається, що картка за ними йде. `main.jsx` і `habit.js` — лише для перегляду.
      en: |
        Here is a habit card in HTML:

        ```html
        <article class="habit-card">
          <h3>Morning exercise</h3>
          <img src="img/habit.svg" alt="Habit icon: Morning exercise">
          <label for="h-01-count">Times done</label>
          <output id="h-01-count">3</output>
        </article>
        ```

        Rewrite it in `HabitCard.jsx` as JSX that takes its values from the `habit` object (the file `habit.js`):

        - the name comes from `habit.name`, the number in `<output>` is the number of items in `habit.completions`;
        - `alt` is made of the text “Habit icon:”, a space and the name — build it inside `{}`, most conveniently with a template literal;
        - the `id` of the `<output>` and the label’s `htmlFor` are the habit’s `id` plus `-count`, also built from the data;
        - attribute names follow the rules of JSX.

        The check also swaps the habit’s data and makes sure the card follows it. `main.jsx` and `habit.js` are read-only.
    testTitles:
      "the card is an article with the class habit-card and an h3 with the name":
        uk: "Картка — `<article>` з класом `habit-card` і заголовком `<h3>` з назвою"
        en: "The card is an `<article>` with the class `habit-card` and an `<h3>` with the name"
      "the image shows img/habit.svg with alt text built from the name":
        uk: "Картинка показує `img/habit.svg`, а `alt` — «Значок звички: » і назва"
        en: "The image shows `img/habit.svg`, and `alt` is “Habit icon: ” and the name"
      "the label is tied to the output with the count":
        uk: "Підпис прив’язаний до `<output>` з `id` на кшталт `h-01-count`, у якому кількість виконань"
        en: "The label is tied to the `<output>` with an `id` like `h-01-count` that holds the number of completions"
      "JSX attribute names are used: className and htmlFor":
        uk: "Використано назви атрибутів JSX: `className` і `htmlFor`"
        en: "JSX attribute names are used: `className` and `htmlFor`"
      "every value comes from habit, not copied by hand":
        uk: "Усі значення беруться з `habit`, а не скопійовані вручну"
        en: "Every value comes from `habit`, not copied by hand"
    hints:
      nudge:
        uk: "Почни з того, що просто зробить HTML правильним JSX: закрий порожній тег і заміни назви атрибутів. Потім по черзі заміни сталі значення виразами в `{}`."
        en: "Start by just making the HTML valid JSX: close the empty tag and replace the attribute names. Then replace the fixed values one by one with expressions in `{}`."
      explanation:
        uk: |
          Атрибут зі значенням-виразом пишуть без лапок: `title={…}`. Шаблонний рядок усередині — звичайний JavaScript. Наприклад, для справи:

          ```jsx
          <a href={`#${task.id}`} title={`Справа: ${task.title}`}>…</a>
          ```

          Кількість елементів масиву — його властивість `length`.
        en: |
          An attribute whose value is an expression is written without quotes: `title={…}`. A template literal inside it is ordinary JavaScript. For example, for a task:

          ```jsx
          <a href={`#${task.id}`} title={`Task: ${task.title}`}>…</a>
          ```

          The number of items in an array is its `length` property.
    solutionNote:
      uk: "JSX — це JavaScript, тому атрибути звуться як властивості DOM (`className`, `htmlFor`), порожні теги закривають `/>`, а все обчислюване стоїть у `{}`. Шаблонний рядок збирає `alt` та `id` з даних, тож картка правильна для будь-якої звички."
      en: "JSX is JavaScript, so attributes are named like DOM properties (`className`, `htmlFor`), empty tags are closed with `/>`, and everything computed stands in `{}`. A template literal builds `alt` and `id` from the data, so the card is right for any habit."
    feedback:
      - when: { test: "JSX attribute names are used: className and htmlFor" }
        message:
          uk: "Ця перевірка чекає, що в консолі немає попереджень `Invalid DOM property` для `class` і `for`. Якщо вони є, заміни ці назви на `className` і `htmlFor`."
          en: "This check expects no `Invalid DOM property` warnings for `class` and `for` in the console. If there are any, replace those names with `className` and `htmlFor`."
      - when: { test: "every value comes from habit, not copied by hand" }
        message:
          uk: "Ця перевірка підставляє іншу звичку (`h-77`, «Пити воду», 5 виконань) і чекає, що картка зміниться разом із нею. Якщо в JSX лишилися сталі «Ранкова зарядка», `h-01-count` чи `3` або значення, обчислені один раз поза компонентом, обчислюй їх із `habit` усередині `HabitCard`."
          en: "This check puts in another habit (`h-77`, “Drink water”, 5 completions) and expects the card to change with it. If the JSX still has the fixed “Morning exercise”, `h-01-count` or `3`, or values computed once outside the component, compute them from `habit` inside `HabitCard`."
      - when: { test: "the image shows img/habit.svg with alt text built from the name" }
        message:
          uk: "Ця перевірка чекає `<img>` з `src` «img/habit.svg» і `alt` рівно «Значок звички: Ранкова зарядка» — із двокрапкою й одним пробілом."
          en: "This check expects an `<img>` with `src` “img/habit.svg” and `alt` exactly “Habit icon: Morning exercise” — with a colon and one space."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити. Найчастіше в такому перекладі лишається незакритий `<img …>` — тоді компілятор пише *Unterminated JSX contents* і показує рядок нижче, ніж справжня помилка. Закрий порожній тег як `<img … />`."
          en: "The code could not start. In such a conversion the most common leftover is an unclosed `<img …>` — then the compiler says *Unterminated JSX contents* and shows a line below the real mistake. Close the empty tag as `<img … />`."
      - when: { error: TypeError }
        message:
          uk: "`TypeError`: значення не того виду, якого чекає код. Якщо сторінка порожня, а в консолі є *An error occurred in the &lt;…&gt; component*, помилка сталася під час рендеру цього компонента — рядок указано в картці помилки. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "`TypeError`: a value is not of the kind the code expects. If the page is empty and the console shows *An error occurred in the &lt;…&gt; component*, the error happened while that component rendered — the error card names the line. If every check fails at once, fix the first error in the console first."

  - id: to-project
    kind: transfer
    capstoneStep: RE-01
    body:
      uk: "Розмітка карток твого проєкту зараз живе в коді на `createElement` і `textContent`. У кроці проєкту вона стане JSX за цими самими правилами: `className` замість `class`, закриті теги й значення запису в `{}`."
      en: "The markup of your project’s cards now lives in code built with `createElement` and `textContent`. In the project step it becomes JSX by these same rules: `className` instead of `class`, closed tags and the record’s values in `{}`."
