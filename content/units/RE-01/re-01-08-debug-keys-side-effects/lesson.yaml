id: re-01-08-debug-keys-side-effects
unit: RE-01
title:
  uk: "Налагодження: погані ключі й побічні ефекти в рендері"
  en: "Debug: bad keys and side effects in render"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Розпізнати в списку, де набраний текст після видалення переїжджає в інший рядок, ваду ключа й виправити її стабільними `id`."
    en: "Diagnose a list whose typed text jumps to another row after a deletion as a key defect and repair it with stable ids."
  - uk: "Знайти й прибрати зміну даних і запис у сховище під час рендеру, не змінивши того, що видно на сторінці."
    en: "Find and remove a render-time mutation and a render-time storage write without changing the visible output."
  - uk: "Пояснити за журналом рендерів і змін DOM, чому компонент, що рендерився, змінив чи не змінив DOM."
    en: "Explain from the render/commit log why a component that rendered did or did not change the DOM."
prerequisites: [re-01-07-purity-in-render]
subskills:
  - { family: R-01, skill: "function components/purity", depth: assess }
  - { family: R-01, skill: "stable keys and identity", depth: assess }
  - { family: R-01, skill: "render/commit distinction", depth: assess }
glossary: []
selfCheck: [first-render-lies, habit-board]

blocks:
  - id: render-twice
    kind: explanation
    title:
      uk: "Перший рендер нічого не доводить"
      en: "The first render proves nothing"
    body:
      uk: |
        Вади з цього розділу мають спільну рису: **перший рендер виглядає правильно**. Ключ-індекс шкодить лише тоді, коли список змінює склад чи порядок. Випадковий ключ і зміна props проявляються на другому рендері. Запис у сховище взагалі не видно на сторінці.

        Тому перевіряй компонент так:

        1. **Повтори рендер з тими самими даними.** Чистий компонент не змінює нічого: у журналі є рядки `render …`, але немає жодного `DOM:`.
        2. **Зміни склад і порядок списку**, набравши щось у полі одного з рядків: текст має лишитися зі своїм записом.
        3. **Подивись на все, що існувало до рендеру**: масиви з props, змінні модуля, вкладку **Сховище**. Після рендеру вони мають бути такими самими.
        4. **Виправивши ваду, перевір, що видимий результат не змінився**: той самий порядок, ті самі тексти.

        У прикладі й вправі знову працює помічник `dom-log.js` з уроку про render і commit.
      en: |
        The defects of this unit have one thing in common: **the first render looks right**. An index key does harm only when the list changes its contents or order. A random key and a changed prop show up on the second render. A write to storage is not visible on the page at all.

        So check a component like this:

        1. **Repeat the render with the same data.** A pure component changes nothing: the log has `render …` lines but not a single `DOM:` line.
        2. **Change the list’s contents and order** after typing something in a field of one row: the text must stay with its record.
        3. **Look at everything that existed before the render**: arrays from props, module variables, the **Storage** tab. After the render they must be the same.
        4. **Once a defect is repaired, check that the visible result did not change**: the same order, the same texts.

        The example and the exercise use the `dom-log.js` helper from the render and commit lesson again.

  - id: first-render-lies
    kind: prediction
    prompt:
      uk: "У `WishBoard.jsx` чотири закладені вади: ключ-індекс у рядках, `Math.random()` як ключ у списку категорій, `sort` на масиві з props і запис у `localStorage` під час рендеру. Скільки з них видно на вкладці **Сторінка** одразу після запуску, ще до жодного натискання?"
      en: "`WishBoard.jsx` has four seeded defects: an index key on the rows, `Math.random()` as a key in the category list, `sort` on the props array and a write to `localStorage` during render. How many of them are visible on the **Page** tab right after running, before any press?"
    answer:
      type: choice
      options:
        - id: none
          text: { uk: "Жодної", en: "None" }
        - id: two
          text: { uk: "Дві: обидві вади ключів", en: "Two: both key defects" }
          why:
            uk: "Ключ потрібен, щоб зіставити рядки **між** рендерами. У першому рендері зіставляти нема з чим, тож будь-який ключ дає правильну сторінку."
            en: "A key is needed to match rows **between** renders. In the first render there is nothing to match against, so any key gives a correct page."
        - id: one
          text: { uk: "Одна: відсортований масив із props", en: "One: the sorted props array" }
          why:
            uk: "Сортування в першому рендері дає саме той порядок, який і мав бути на екрані. Шкода в тому, що змінено масив батька, — а це проявиться, коли батько використає його знову."
            en: "Sorting in the first render gives exactly the order that should be on the screen. The harm is that the parent’s array changed — which shows when the parent uses it again."
        - id: four
          text: { uk: "Усі чотири", en: "All four" }
          why:
            uk: "Запис у сховище на сторінці не видно взагалі, а решта вад чекає другого рендеру."
            en: "A write to storage is not visible on the page at all, and the other defects wait for a second render."
      correct: [none]
    explanation:
      uk: "Після першого рендеру сторінка правильна. Вади проявляються згодом: повторний рендер змінює рядок «Додано першим» і перестворює весь список категорій, видалення переносить нотатку в інший рядок, а лічильник у сховищі росте з кожним рендером. Саме тому «перший рендер виглядає правильно» — не доказ."
      en: "After the first render the page is correct. The defects show up later: a re-render changes the “First added” line and recreates the whole category list, a deletion moves a note to another row, and the counter in storage grows with every render. That is why “the first render looks right” is no proof."

  - id: defect-map
    kind: visual
    visual: diagram
    title:
      uk: "Де ховаються чотири вади"
      en: "Where the four defects hide"
    textEquivalent:
      uk: "У центрі — компонент WishBoard. Під час рендеру він тягнеться до двох речей, що існували до виклику: до масиву wishes з props — sort переставляє його на місці, тож батько бачить інший порядок і рядок «Додано першим» змінюється на наступному рендері; і до localStorage — setItem записує лічильник при кожному рендері. Нижче — два списки. Рядки WishRow мають ключі-індекси 0, 1, 2, 3: після видалення ключі зсуваються, і поле з нотаткою дістається іншому запису. Пункти списку категорій мають ключ Math.random(): у кожному рендері ключі нові, тож React видаляє й створює всі пункти знову — журнал показує по чотири рядки «DOM: − <li>» і «DOM: + <li>». Виправлення: toSorted замість sort, жодного запису в рендері, ключ — id запису."
      en: "In the middle is the component WishBoard. During render it reaches for two things that existed before the call: the wishes array from props — sort reorders it in place, so the parent sees another order and the “First added” line changes on the next render; and localStorage — setItem writes a counter on every render. Below are two lists. The WishRow rows have index keys 0, 1, 2, 3: after a deletion the keys shift, and the field with the note goes to another record. The category items have the key Math.random(): every render gives new keys, so React removes and creates all items again — the log shows four lines “DOM: − <li>” and “DOM: + <li>” each. The repairs: toSorted instead of sort, no writes in render, the record’s id as the key."
    spec:
      layout: grid
      nodes:
        - { id: props, label: "props.wishes", shape: cylinder, col: 0, row: 0, w: 130 }
        - { id: storage, label: "localStorage", shape: cylinder, col: 1, row: 0, w: 130 }
        - { id: board, label: "WishBoard", col: 0, row: 1, w: 130 }
        - { id: rows, label: { uk: "WishRow · key 0…3", en: "WishRow · key 0…3" }, col: 0, row: 2, w: 150 }
        - { id: chips, label: { uk: "категорії · key random", en: "categories · key random" }, col: 1, row: 2, w: 170 }
      edges:
        - { id: sort, from: board, to: props, label: "sort()", kind: dashed }
        - { id: write, from: board, to: storage, label: "setItem()", kind: dashed }
        - { id: to-rows, from: board, to: rows }
        - { id: to-chips, from: board, to: chips }
      steps:
        - caption:
            uk: "Чотири вади `WishBoard`. Пунктирні стрілки — це те, до чого рендер тягнеться **поза** компонент."
            en: "The four defects of `WishBoard`. The dashed arrows are what the render reaches **outside** the component."
        - caption:
            uk: "`wishes.sort(byPrice)` переставляє масив батька. Видно це на **наступному** рендері: рядок «Додано першим» читає вже відсортований масив. Ліки — `toSorted`."
            en: "`wishes.sort(byPrice)` reorders the parent’s array. It shows on the **next** render: the “First added” line reads an already sorted array. The cure is `toSorted`."
          highlight: [board, sort, props]
          dim: [storage, write, rows, chips, to-rows, to-chips]
        - caption:
            uk: "`localStorage.setItem` у рендері пише лічильник щоразу, коли React викликає компонент. На сторінці це не видно — лише на вкладці **Сховище**. Ліки — прибрати запис з рендеру."
            en: "`localStorage.setItem` in render writes a counter every time React calls the component. The page does not show it — only the **Storage** tab does. The cure is to remove the write from render."
          highlight: [board, write, storage]
          dim: [props, sort, rows, chips, to-rows, to-chips]
        - caption:
            uk: "Ключі-індекси: після видалення ключі зсуваються, і поле з нотаткою дістається сусідньому запису. Ліки — `key={wish.id}`."
            en: "Index keys: after a deletion the keys shift, and the field with the note goes to the neighbouring record. The cure is `key={wish.id}`."
          highlight: [rows, to-rows]
          dim: [props, storage, sort, write, chips, to-chips]
        - caption:
            uk: "`key={Math.random()}`: кожен рендер дає нові ключі, і React перестворює всі пункти — журнал повний `DOM: −` і `DOM: +`, хоча дані ті самі. Ліки — стабільний ключ із даних."
            en: "`key={Math.random()}`: every render gives new keys, and React recreates every item — the log is full of `DOM: −` and `DOM: +` although the data is the same. The cure is a stable key from the data."
          highlight: [chips, to-chips]
          dim: [props, storage, sort, write, rows, to-rows]

  - id: seeded-wishes
    kind: example
    runtime: browser-react
    dir: seeded-wishes
    entry: main.jsx
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bike: { uk: "Велосипед", en: "Bicycle" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      tech: { uk: "Техніка", en: "Tech" }
      home: { uk: "Дім", en: "Home" }
      sport: { uk: "Спорт", en: "Sport" }
      currency: { uk: "грн", en: "UAH" }
      noteFor: { uk: "Нотатка до", en: "Note for" }
      delete: { uk: "Видалити", en: "Delete" }
      firstAdded: { uk: "Додано першим", en: "First added" }
      again: { uk: "Рендер ще раз", en: "Render again" }
      categories: { uk: "Категорії", en: "Categories" }
    title:
      uk: "Чотири вади, які чекають другого рендеру"
      en: "Four defects waiting for the second render"
    body:
      uk: |
        `WishBoard.jsx` з прогнозу: бажання від найдешевшого, поле нотатки в кожному рядку, список категорій і рядок «Додано першим». Вади позначено коментарями. Натисни **Запустити**: усе виглядає правильно, у консолі — лише `DOM: + <main>`.
      en: |
        `WishBoard.jsx` from the prediction: wishes from the cheapest, a note field in every row, a category list and a “First added” line. The defects are marked with comments. Press **Run**: everything looks right, the console has only `DOM: + <main>`.
    tryIt:
      uk: |
        1. Напиши щось у поле «Настільної лампи» і натисни «Рендер ще раз». Рядок «Додано першим» змінився з «Навушники» на «Термочашка», а в консолі — `DOM:` з цією зміною й по чотири `DOM: − <li>` і `DOM: + <li>`: список категорій створено наново. На вкладці **Сховище** лічильник `jsll.wishlist.views` росте з кожним рендером (він зберігається між запусками).
        2. Натисни «Видалити Термочашка»: твоя нотатка тепер біля «Навушників».
        3. Виправ вади по черзі: `wishes.toSorted(byPrice)`, видали два рядки з `localStorage`, `key={wish.id}` у рядках і `key={wish.id}` у категоріях. Після кожного виправлення запусти й повтори кроки 1–2 — і переконайся, що сторінка після запуску виглядає так само, як до виправлень.
      en: |
        1. Type something into the field of “Desk lamp” and press “Render again”. The “First added” line changed from “Headphones” to “Travel mug”, and the console has a `DOM:` line with that change plus four `DOM: − <li>` and four `DOM: + <li>`: the category list was created anew. On the **Storage** tab the counter `jsll.wishlist.views` grows with every render (it is kept between runs).
        2. Press “Delete Travel mug”: your note is now next to “Headphones”.
        3. Repair the defects one by one: `wishes.toSorted(byPrice)`, delete the two lines with `localStorage`, `key={wish.id}` on the rows and `key={wish.id}` in the categories. After each repair run and repeat steps 1–2 — and make sure the page right after running looks the same as before the repairs.

  - id: recall-lost-focus
    kind: review
    title:
      uk: "Згадай: що губиться під час перебудови"
      en: "Recall: what is lost in a rebuild"
    items:
      - id: why-focus-lost
        from: js-06-14-debug-dom-defects
        prompt:
          uk: "У розділі про DOM `render(records)` після кожної зміни перебудовувала список через `replaceChildren`, і кнопка, на якій був фокус, його втрачала. Чому?"
          en: "In the DOM unit `render(records)` rebuilt the list with `replaceChildren` after every change, and the button that had focus lost it. Why?"
        answer:
          type: choice
          options:
            - id: node-replaced
              text:
                uk: "Елемент із фокусом видалили з DOM, а на його місці — новий елемент, який фокусу ніколи не мав"
                en: "The focused element was removed from the DOM, and in its place is a new element that never had focus"
            - id: browser-reset
              text:
                uk: "Браузер скидає фокус після будь-якої зміни DOM"
                en: "The browser resets focus after any DOM change"
              why:
                uk: "Зміна тексту чи атрибута сусіднього вузла фокус не чіпає. Фокус губиться, коли зникає сам сфокусований елемент."
                en: "Changing the text or an attribute of a neighbouring node does not touch focus. Focus is lost when the focused element itself disappears."
            - id: listener
              text:
                uk: "Слухач кліку знімав фокус, бо був доданий двічі"
                en: "The click listener removed focus because it was added twice"
              why:
                uk: "Подвійний слухач дає подвійну дію, а не втрату фокусу. Фокус губився через заміну вузлів."
                en: "A double listener gives a double action, not lost focus. Focus was lost because the nodes were replaced."
          correct: [node-replaced]
        explanation:
          uk: "Фокус, набраний текст, прокрутка належать конкретному вузлу DOM. Коли вузол замінюють новим, усе це зникає. Випадковий `key` у React робить те саме: щоразу новий ключ — новий вузол."
          en: "Focus, typed text and scrolling belong to a particular DOM node. When the node is replaced with a new one, all of that is gone. A random `key` in React does the same: a new key every time means a new node."

  - id: habit-board
    kind: exercise
    mode: debug
    runtime: browser-react
    dir: habit-board
    entry: main.jsx
    editable: [HabitBoard.jsx]
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      read: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      water: { uk: "Пити воду", en: "Drink water" }
      newest: { uk: "Додано останньою", en: "Added last" }
      again: { uk: "Рендер ще раз", en: "Render again" }
      noteFor: { uk: "Нотатка до", en: "Note for" }
      delete: { uk: "Видалити", en: "Delete" }
      typed: { uk: "після обіду", en: "after lunch" }
    title:
      uk: "Дошка звичок з чотирма вадами"
      en: "A habit board with four defects"
    instructions:
      uk: |
        `HabitBoard` показує звички від найчастіше виконаних, у кожному рядку — дні виконання, поле нотатки й кнопку видалення. Над ним `main.jsx` показує рядок «Додано останньою» і кнопку «Рендер ще раз». Перший рендер виглядає правильно, але в `HabitBoard.jsx` чотири вади — ті самі види, що й у прикладі, лише без підказок у коментарях.

        Виправ їх так, щоб:

        - рендер з тими самими даними не змінював у DOM нічого (журнал без рядків `DOM:`);
        - нотатка лишалася зі своєю звичкою після видалення рядка над нею;
        - рендер не змінював масив `habits` з props і нічого не писав у сховище;
        - сторінка показувала те саме, що й зараз: той самий порядок, ті самі дні.

        Перевірка рендерить `HabitBoard` з власними даними, натискає кнопки й дивиться на сховище. `main.jsx`, `habits.js` і `dom-log.js` — лише для перегляду.
      en: |
        `HabitBoard` shows habits from the most completed; every row has the completion days, a note field and a delete button. Above it `main.jsx` shows an “Added last” line and a “Render again” button. The first render looks right, but `HabitBoard.jsx` has four defects — the same kinds as in the example, only without hints in comments.

        Repair them so that:

        - a render with the same data changes nothing in the DOM (a log without `DOM:` lines);
        - a note stays with its habit after the row above it is deleted;
        - the render does not change the `habits` array from props and writes nothing to storage;
        - the page shows the same as now: the same order, the same days.

        The check renders `HabitBoard` with its own data, presses the buttons and looks at the storage. `main.jsx`, `habits.js` and `dom-log.js` are read-only.
    testTitles:
      "the rows show the most completed habits first, with their days":
        uk: "Рядки — від найчастіше виконаних звичок"
        en: "The rows go from the most completed habits"
      "rendering leaves the habits array in its order":
        uk: "Рендер лишає масив `habits` у його порядку"
        en: "Rendering leaves the `habits` array in its order"
      "rendering writes nothing to storage":
        uk: "Рендер нічого не пише в сховище"
        en: "Rendering writes nothing to storage"
      "a re-render with the same data changes nothing in the DOM":
        uk: "Повторний рендер з тими самими даними нічого не змінює в DOM"
        en: "A re-render with the same data changes nothing in the DOM"
      "a typed note stays with its habit after the row above is deleted":
        uk: "Нотатка лишається зі своєю звичкою після видалення рядка над нею"
        en: "A note stays with its habit after the row above it is deleted"
    hints:
      nudge:
        uk: "Пройди тіло `HabitBoard` і `HabitRow` рядок за рядком і для кожного спитай: чи змінює він щось, що існувало до виклику? А для кожного `key`: чи буде він тим самим для того самого запису в наступному рендері?"
        en: "Walk through the bodies of `HabitBoard` and `HabitRow` line by line and ask of each: does it change something that existed before the call? And of each `key`: will it be the same for the same record in the next render?"
      explanation:
        uk: |
          Чотири питання — чотири вади:

          - метод масиву, що змінює масив на місці, має версію, яка повертає копію;
          - запис у сховище не належить до рендеру — у цьому розділі його просто прибирають (синхронізацію зі сховищем зробиш ефектом у розділі про ефекти);
          - ключ рядка має йти за записом, а не за позицією;
          - ключ дня має бути тим самим для того самого дня: дні однієї звички не повторюються.

          Видимий результат при цьому не змінюється — лише поведінка між рендерами.
        en: |
          Four questions, four defects:

          - an array method that changes the array in place has a version that returns a copy;
          - a write to storage does not belong in render — in this unit you simply remove it (you will synchronize with storage through an effect in the effects unit);
          - a row’s key must follow the record, not the position;
          - a day’s key must be the same for the same day: the days of one habit do not repeat.

          The visible result does not change — only the behaviour between renders.
    solutionNote:
      uk: "`toSorted` не чіпає масив батька, рендер нічого не пише назовні, рядки ключуються `habit.id`, а дні — самою датою, яка в межах звички унікальна. Тепер повторний рендер — лише обчислення: журнал показує `render`, але не `DOM:`, а нотатки й фокус лишаються зі своїми записами."
      en: "`toSorted` does not touch the parent’s array, render writes nothing outside, rows are keyed by `habit.id`, and days by the date itself, which is unique within a habit. Now a re-render is just a computation: the log shows renders but no `DOM:` lines, and notes and focus stay with their records."
    feedback:
      - when: { test: "rendering leaves the habits array in its order" }
        message:
          uk: "Ця перевірка рендерить `HabitBoard` з власним масивом і чекає його після рендеру в тому самому порядку. Якщо порядок змінився, сортування йде на масиві з props: сортуй копію."
          en: "This check renders `HabitBoard` with its own array and expects it in the same order after the render. If the order changed, the sorting happens on the props array: sort a copy."
      - when: { test: "rendering writes nothing to storage" }
        message:
          uk: "Ця перевірка двічі рендерить `HabitBoard` і чекає, що сховище не змінилось. Якщо в рендері лишився `localStorage.setItem`, прибери його."
          en: "This check renders `HabitBoard` twice and expects the storage unchanged. If `localStorage.setItem` is still in the render, remove it."
      - when: { test: "a re-render with the same data changes nothing in the DOM" }
        message:
          uk: "Ця перевірка натискає «Рендер ще раз» і чекає журнал без рядків `DOM:`. `DOM: − <small>` і `DOM: + <small>` — ключі днів нові в кожному рендері; зміна рядка «Додано останньою» — масив із props відсортовано на місці."
          en: "This check presses “Render again” and expects a log without `DOM:` lines. `DOM: − <small>` and `DOM: + <small>` mean the day keys are new on every render; a change of the “Added last” line means the props array was sorted in place."
      - when: { test: "a typed note stays with its habit after the row above is deleted" }
        message:
          uk: "Ця перевірка набирає нотатку в рядку `h-02`, видаляє `h-01` і чекає нотатку досі в `h-02`. Якщо вона переїхала до сусіда, ключ рядка залежить від позиції."
          en: "This check types a note in the row `h-02`, deletes `h-01` and expects the note still in `h-02`. If it moved to a neighbour, the row key depends on the position."
      - when: { test: "the rows show the most completed habits first, with their days" }
        message:
          uk: "Ця перевірка чекає звички від найбільшої кількості виконань: виправлення вад не має змінювати порядок, який бачить людина."
          en: "This check expects the habits from the highest number of completions: repairing the defects must not change the order a person sees."
      - when: { error: TypeError }
        message:
          uk: "`TypeError`: значення не того виду, якого чекає код. Якщо сторінка порожня, а в консолі є *An error occurred in the &lt;…&gt; component*, помилка сталася під час рендеру цього компонента — рядок указано в картці помилки. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "`TypeError`: a value is not of the kind the code expects. If the page is empty and the console shows *An error occurred in the &lt;…&gt; component*, the error happened while that component rendered — the error card names the line. If every check fails at once, fix the first error in the console first."

  - id: to-project
    kind: transfer
    capstoneStep: RE-01
    body:
      uk: "Коли перенесеш список проєкту в компоненти, перевір його так само: повтори рендер, видали запис із нотаткою поруч, подивись на сховище. Код, що зберігає записи проєкту в сховище, лишається поза компонентами — у рендер він не переїжджає; з React його поєднає ефект у розділі про ефекти."
      en: "Once you move the project’s list into components, check it the same way: repeat the render, delete a record next to a note, look at the storage. The code that saves the project’s records to storage stays outside the components — it does not move into render; an effect connects it to React in the effects unit."
