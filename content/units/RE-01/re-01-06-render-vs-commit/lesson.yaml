id: re-01-06-render-vs-commit
unit: RE-01
title:
  uk: "Render проти commit"
  en: "Render vs commit"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Описати послідовність «тригер → render → commit» і сказати, який крок торкається DOM."
    en: "Describe the trigger → render → commit sequence and say which step touches the DOM."
  - uk: "Передбачити, які вузли DOM зміняться під час повторного рендеру, порівнявши попередній і наступний результат."
    en: "Predict which DOM nodes change on a re-render by comparing the previous and the next output."
prerequisites: [re-01-05-keys-identity, js-06-08-dom-query-create-update]
subskills:
  - { family: R-01, skill: "render/commit distinction", depth: intro }
glossary: [render-phase, commit-phase, re-render]
selfCheck: [what-gets-logged, expense-row]

blocks:
  - id: three-steps
    kind: explanation
    title:
      uk: "Три кроки оновлення"
      en: "The three steps of an update"
    body:
      uk: |
        Кожне оновлення екрана в React іде трьома кроками:

        1. **Тригер** — щось просить React показати новий стан. Перший раз — `root.render(<App />)`. У цьому розділі повторні тригери робить `main.jsx`: знову викликає `root.render` з новими даними. (У наступному розділі тригером стане зміна стану компонента.)
        2. **[[render-phase|Render]]** — React викликає функції компонентів, отримує новий опис і порівнює його з попереднім: так він з’ясовує, що треба змінити. Під час повторного рендеру React заново викликає компонент **і всіх його нащадків** у дереві.
        3. **[[commit-phase|Commit]]** — React вносить у DOM **лише різницю**, знайдену під час render.

        Тільки commit змінює сторінку. Render — це обчислення: функція викликалася, але якщо її результат такий самий, як минулого разу, commit нічого в DOM не змінює.

        Щоб це побачити, у прикладах цього уроку є помічник `dom-log.js`: він стежить за DOM усередині `#root`, пише кожну зміну в консоль рядком, що починається з `DOM:`, і на мить обводить змінений елемент помаранчевою рамкою.
      en: |
        Every screen update in React goes through three steps:

        1. **Trigger** — something asks React to show a new state. The first time it is `root.render(<App />)`. In this unit `main.jsx` makes the later triggers: it calls `root.render` again with new data. (In the next unit the trigger becomes a change of a component’s state.)
        2. **[[render-phase|Render]]** — React calls the component functions, gets a new description and compares it with the previous one: that is how it works out what has to change. On a re-render React calls the component again **and all its descendants** in the tree.
        3. **[[commit-phase|Commit]]** — React puts **only the difference** found during render into the DOM.

        Only the commit changes the page. Render is a computation: the function was called, but if its result is the same as last time, the commit changes nothing in the DOM.

        To see this, this lesson’s examples have a helper `dom-log.js`: it watches the DOM inside `#root`, prints every change to the console as a line starting with `DOM:`, and briefly outlines the changed element with an orange frame.

  - id: what-gets-logged
    kind: prediction
    strings:
      lamp: { uk: "Лампа", en: "Lamp" }
      currency: { uk: "грн", en: "UAH" }
    prompt:
      uk: "На сторінці три бажання: Лампа (45), Термочашка (18), Велосипед (240). За сторінкою стежить помічник, який пише кожну зміну DOM у консоль рядком, що починається з `DOM:`. Кнопка викликає `root.render` знову з тими самими записами, лише ціна лампи тепер 60. Що з’явиться в консолі після натискання?"
      en: "The page shows three wishes: Lamp (45), Travel mug (18), Bicycle (240). A helper watches the page and prints every DOM change to the console as a line starting with `DOM:`. A button calls `root.render` again with the same records, only the lamp’s price is now 60. What appears in the console after the press?"
    lang: jsx
    runnable: false
    code: |
      function WishRow({ wish }) {
        console.log(`render WishRow ${wish.id}`);
        return <li>{wish.name}: {`${wish.price} %%currency%%`}</li>;
      }

      function App({ records }) {
        console.log("render App");
        return <ul>{records.map((wish) => <WishRow key={wish.id} wish={wish} />)}</ul>;
      }
    answer:
      type: choice
      options:
        - id: all-render-one-change
          code: "render App\nrender WishRow w-02\nrender WishRow w-06\nrender WishRow w-03\nDOM: \"45 %%currency%%\" → \"60 %%currency%%\""
        - id: only-changed-renders
          code: "render App\nrender WishRow w-02\nDOM: \"45 %%currency%%\" → \"60 %%currency%%\""
          why:
            uk: "Повторний рендер `App` заново викликає всіх його нащадків — React не перевіряє наперед, чи змінилися props рядка. Те, що функція виконалась, ще не означає змін на екрані."
            en: "A re-render of `App` calls all its descendants again — React does not check in advance whether a row’s props changed. A function having run does not mean the screen changed."
        - id: rebuild
          code: "render App\nrender WishRow w-02\nrender WishRow w-06\nrender WishRow w-03\nDOM: − <ul>\nDOM: + <ul>"
          why:
            uk: "React не перебудовує DOM з нуля: він порівнює новий опис зі старим, і commit змінює лише текст ціни лампи. Список і решта рядків лишаються тими самими вузлами."
            en: "React does not rebuild the DOM from scratch: it compares the new description with the old one, and the commit changes only the lamp’s price text. The list and the other rows stay the same nodes."
        - id: nothing
          code: "render App"
          why:
            uk: "`App` повертає нові елементи `<WishRow />`, і React викликає кожен із них. Пропустити рядки без змін він не може, доки йому цього явно не дозволили."
            en: "`App` returns new `<WishRow />` elements, and React calls each of them. It cannot skip unchanged rows unless explicitly allowed to."
      correct: [all-render-one-change]
    explanation:
      uk: "Render: React викликає `App` і всі три `WishRow` — чотири рядки в консолі — і, порівнюючи нові описи зі старими, бачить різницю лише в тексті `45 грн` → `60 грн`. Commit змінює цей один текстовий вузол. Рядки «Термочашки» й «Велосипеда» рендерились, але в DOM не змінилось нічого."
      en: "Render: React calls `App` and all three `WishRow` — four lines in the console — and, comparing the new descriptions with the old ones, sees a difference only in the text `45 UAH` → `60 UAH`. The commit changes that one text node. The rows of “Travel mug” and “Bicycle” rendered, but nothing changed in the DOM."

  - id: timeline
    kind: visual
    visual: render-timeline
    strings:
      currency: { uk: "грн", en: "UAH" }
    title:
      uk: "Три рендери, два commit-и зі змінами"
      en: "Three renders, two commits with changes"
    textEquivalent:
      uk: "Рендер 1: перший root.render; React викликає App і три WishRow, ціна лампи 45. Commit 1 створює весь список у DOM. Подія: клік на кнопці, обробник у main.jsx викликає root.render з новими даними. Рендер 2: React знову викликає App і всі три WishRow; ціна лампи тепер 60. Commit 2 змінює лише один текстовий вузол — «45 грн» на «60 грн»; інші рядки лишаються тими самими вузлами. Друга подія викликає root.render з тими самими даними. Рендер 3: усі чотири функції знову викликаються, але результат такий самий, як минулого разу, тож commit 3 нічого в DOM не змінює."
      en: "Render 1: the first root.render; React calls App and three WishRow, the lamp’s price is 45. Commit 1 creates the whole list in the DOM. Event: a click on the button; the handler in main.jsx calls root.render with new data. Render 2: React calls App and all three WishRow again; the lamp’s price is now 60. Commit 2 changes only one text node — “45 UAH” to “60 UAH”; the other rows stay the same nodes. A second event calls root.render with the same data. Render 3: all four functions are called again, but the result is the same as last time, so commit 3 changes nothing in the DOM."
    spec:
      component: App
      code: |
        function WishRow({ wish }) {
          console.log(`render WishRow ${wish.id}`);
          return <li>{wish.name}: {`${wish.price} %%currency%%`}</li>;
        }

        function App({ records }) {
          console.log("render App");
          return <ul>{records.map((wish) => <WishRow key={wish.id} wish={wish} />)}</ul>;
        }
      steps:
        - phase: render
          render: 1
          line: 7
          reason: { uk: "перший виклик root.render", en: "the first root.render call" }
          snapshot: { props: { "lamp.price": 45, "mug.price": 18, "bike.price": 240 } }
          caption:
            uk: "Рендер 1: React викликає `App`, а потім кожен `WishRow` з його опису — чотири рядки `render …` у консолі. DOM поки не змінено."
            en: "Render 1: React calls `App`, then every `WishRow` from its description — four `render …` lines in the console. The DOM is not changed yet."
        - phase: commit
          render: 1
          dom: "<ul><li>… 45 %%currency%%</li><li>… 18 %%currency%%</li><li>… 240 %%currency%%</li></ul>"
          caption:
            uk: "Commit 1: попереднього опису ще немає, тож React створює весь список. `dom-log.js` пише один рядок `DOM: +` для кореневого елемента, який створив React (у прикладі нижче це `<main>`)."
            en: "Commit 1: there is no previous description yet, so React creates the whole list. `dom-log.js` prints one `DOM: +` line for the root element React created (in the example below it is `<main>`)."
        - phase: event
          name: click
          sees: { version: 0 }
          actions: ["version = 1", "root.render(<App records={after} />)"]
          caption:
            uk: "Тригер: обробник кліку в `main.jsx` бере нові дані — лампа тепер 60 — і знову викликає `root.render`."
            en: "Trigger: the click handler in `main.jsx` takes the new data — the lamp is now 60 — and calls `root.render` again."
        - phase: render
          render: 2
          line: 7
          reason: { uk: "root.render з новими даними", en: "root.render with new data" }
          snapshot: { props: { "lamp.price": 60, "mug.price": 18, "bike.price": 240 } }
          caption:
            uk: "Рендер 2: React знову викликає `App` і **всі три** `WishRow` — і ті, чиї дані не змінилися."
            en: "Render 2: React calls `App` and **all three** `WishRow` again — including those whose data did not change."
        - phase: commit
          render: 2
          dom: "<ul><li>… 60 %%currency%%</li><li>… 18 %%currency%%</li><li>… 240 %%currency%%</li></ul>"
          caption:
            uk: "Commit 2: порівняння під час рендеру знайшло одну різницю — текст `45 грн` → `60 грн`. React змінює цей текстовий вузол і більше нічого: `<ul>` і всі `<li>` — ті самі вузли."
            en: "Commit 2: the comparison during render found one difference — the text `45 UAH` → `60 UAH`. React changes that text node and nothing else: the `<ul>` and every `<li>` are the same nodes."
        - phase: event
          name: click
          sees: { version: 1 }
          actions: ["version = 1", "root.render(<App records={after} />)"]
          caption:
            uk: "Ще один клік: дані ті самі, але тригер усе одно спрацьовує."
            en: "One more click: the data is the same, but the trigger still fires."
        - phase: render
          render: 3
          line: 7
          reason: { uk: "root.render з тими самими даними", en: "root.render with the same data" }
          snapshot: { props: { "lamp.price": 60, "mug.price": 18, "bike.price": 240 } }
          caption:
            uk: "Рендер 3: усі чотири функції знову виконуються — у консолі знову чотири рядки `render …`."
            en: "Render 3: all four functions run again — four `render …` lines in the console again."
        - phase: commit
          render: 3
          dom: "<ul><li>… 60 %%currency%%</li><li>… 18 %%currency%%</li><li>… 240 %%currency%%</li></ul>"
          caption:
            uk: "Commit 3: новий опис такий самий, як попередній, — у DOM нічого не змінюється, і рядків `DOM:` немає. Функції виконалися, а екран лишився тим самим."
            en: "Commit 3: the new description equals the previous one — nothing changes in the DOM, and there are no `DOM:` lines. The functions ran, and the screen stayed the same."

  - id: commit-log
    kind: example
    runtime: browser-react
    dir: commit-log
    entry: main.jsx
    strings:
      lamp: { uk: "Лампа", en: "Lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      bike: { uk: "Велосипед", en: "Bicycle" }
      home: { uk: "Дім", en: "Home" }
      sport: { uk: "Спорт", en: "Sport" }
      currency: { uk: "грн", en: "UAH" }
      next: { uk: "Наступні дані", en: "Next data" }
    title:
      uk: "Журнал рендерів і змін DOM"
      en: "A log of renders and DOM changes"
    body:
      uk: |
        `App.jsx` пише в консоль кожен виклик компонента, а `dom-log.js` — кожну зміну DOM. Натисни **Запустити**, відкрий **Консоль**: перший рендер, потім `DOM: + <main>` — commit створив усе. Тепер на вкладці **Сторінка** натисни «Наступні дані» і повернись до консолі.
      en: |
        `App.jsx` prints every component call to the console, and `dom-log.js` prints every DOM change. Press **Run** and open the **Console**: the first render, then `DOM: + <main>` — the commit created everything. Now press “Next data” on the **Page** tab and go back to the console.
    tryIt:
      uk: |
        1. Після першого натискання — чотири рядки `render …` і один рядок `DOM:` з ціною лампи. Натисни ще раз: чотири рядки `render …` і жодного `DOM:`.
        2. У `fixtures.js` у масиві `after` поверни лампі ціну `45`, а категорію зміни з «Дім» на «Спорт». Категорію `WishRow` не показує. Запусти й натисни кнопку: render є, змін DOM немає.
        3. Тепер у `App.jsx` додай категорію в рядок: `{wish.name} ({wish.category}): …`. Запусти й натисни: з’явився рядок `DOM:` з категорією, а на сторінці — рамка навколо зміненого пункту.
      en: |
        1. After the first press — four `render …` lines and one `DOM:` line with the lamp’s price. Press again: four `render …` lines and no `DOM:` at all.
        2. In `fixtures.js`, in the `after` array, set the lamp’s price back to `45` and change its category from “Home” to “Sport”. `WishRow` does not show the category. Run and press the button: there is a render, there are no DOM changes.
        3. Now add the category to the row in `App.jsx`: `{wish.name} ({wish.category}): …`. Run and press: a `DOM:` line with the category appears, and the page shows a frame around the changed item.

  - id: recall-by-hand
    kind: review
    title:
      uk: "Згадай: зміна одного вузла вручну"
      en: "Recall: changing one node by hand"
    items:
      - id: textcontent-vs-rebuild
        from: js-06-08-dom-query-create-update
        prompt:
          uk: "На сторінці список карток, і в одній із них ти набираєш нотатку в полі `<input>`. Код змінює ціну **іншої** картки. Що станеться з набраним текстом, якщо код (А) змінює `textContent` вузла ціни або (Б) перебудовує весь список через `replaceChildren` з новими вузлами?"
          en: "A page shows a list of cards, and you are typing a note into an `<input>` in one of them. The code changes the price of **another** card. What happens to the typed text if the code (A) changes the `textContent` of the price node or (B) rebuilds the whole list with `replaceChildren` and new nodes?"
        answer:
          type: choice
          options:
            - id: a-keeps
              text: { uk: "А — текст лишається; Б — текст зникає разом зі старим полем", en: "A — the text stays; B — the text disappears with the old field" }
            - id: both-keep
              text: { uk: "В обох випадках текст лишається", en: "In both cases the text stays" }
              why:
                uk: "`replaceChildren` з новими вузлами прибирає старі, а з ними й старий `<input>`. Нове поле порожнє."
                en: "`replaceChildren` with new nodes removes the old ones, and the old `<input>` with them. The new field is empty."
            - id: both-lose
              text: { uk: "В обох випадках текст зникає", en: "In both cases the text disappears" }
              why:
                uk: "Зміна `textContent` іншого вузла не чіпає поле: воно лишається тим самим вузлом з тим самим значенням."
                en: "Changing the `textContent` of another node does not touch the field: it stays the same node with the same value."
          correct: [a-keeps]
        explanation:
          uk: "Точкова зміна чіпає лише один вузол, а перебудова створює всі вузли заново — і стан полів, фокус, прокрутка губляться. Commit у React — це саме точкова зміна, яку React обчислює сам, порівнюючи опис із попереднім."
          en: "A targeted change touches only one node, while a rebuild creates every node anew — and the fields’ state, focus and scrolling are lost. A commit in React is exactly a targeted change, which React computes itself by comparing the description with the previous one."

  - id: expense-row
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: expense-row
    entry: main.jsx
    editable: [ExpenseRow.jsx]
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      colLabel: { uk: "Витрата", en: "Expense" }
      colAmount: { uk: "Сума", en: "Amount" }
      colDate: { uk: "Дата", en: "Date" }
      currency: { uk: "грн", en: "UAH" }
      next: { uk: "Наступні дані", en: "Next data" }
    title:
      uk: "Рядок таблиці, що змінюється точково"
      en: "A table row that changes precisely"
    instructions:
      uk: |
        Допиши `ExpenseRow` у `ExpenseRow.jsx`. Він повертає `<tr data-id={expense.id}>` з трьома комірками `<td>`:

        - назва (`expense.label`);
        - сума у гривнях з двома знаками після крапки й словом «грн», наприклад `180.00 грн` — `amountMinor` зберігає копійки;
        - дата (`expense.date`).

        Рядок `console.log` з початку функції залиш.

        Запусти й натисни «Наступні дані»: кава подорожчала до `185.50 грн`. Перевірка натисне кнопку сама й чекає рівно **одну** зміну в DOM — текст суми кави, — а рядок кави має лишитися тим самим елементом. `ExpenseRow` при цьому рендериться для всіх чотирьох витрат, і це нормально.
      en: |
        Finish `ExpenseRow` in `ExpenseRow.jsx`. It returns `<tr data-id={expense.id}>` with three `<td>` cells:

        - the label (`expense.label`);
        - the amount in hryvnias with two digits after the point and the word “UAH”, for example `180.00 UAH` — `amountMinor` stores kopiykas;
        - the date (`expense.date`).

        Keep the `console.log` line at the start of the function.

        Run and press “Next data”: the coffee now costs `185.50 UAH`. The check presses the button itself and expects exactly **one** DOM change — the coffee’s amount text — and the coffee’s row must stay the same element. `ExpenseRow` still renders for all four expenses, and that is fine.
    testTitles:
      "every row shows the label, the formatted amount and the date":
        uk: "Кожен рядок показує назву, відформатовану суму й дату"
        en: "Every row shows the label, the formatted amount and the date"
      "new data changes only the amount text of e-03 in the DOM":
        uk: "Нові дані змінюють у DOM лише текст суми `e-03`"
        en: "New data changes only the amount text of `e-03` in the DOM"
      "the render log line is kept in ExpenseRow":
        uk: "Рядок `render ExpenseRow …` у консолі лишився"
        en: "The `render ExpenseRow …` line in the console is kept"
    hints:
      nudge:
        uk: "Подивись, як `WishRow` у прикладі ставить ціну в текст. Що треба зробити з копійками, щоб отримати `180.00`?"
        en: "Look at how `WishRow` in the example puts the price into text. What must happen to the kopiykas to get `180.00`?"
      explanation:
        uk: |
          Копійки ділять на 100, а `toFixed(2)` дає рівно два знаки після крапки й повертає текст. Наприклад, для `9990` копійок:

          ```js
          (9990 / 100).toFixed(2); // "99.90"
          ```

          Усе, що залежить лише від `expense`, у кожному рендері дає той самий текст — тож commit змінює тільки те, що справді змінилося в даних.
        en: |
          Kopiykas are divided by 100, and `toFixed(2)` gives exactly two digits after the point and returns text. For example, for `9990` kopiykas:

          ```js
          (9990 / 100).toFixed(2); // "99.90"
          ```

          Everything that depends only on `expense` gives the same text in every render — so the commit changes only what really changed in the data.
    solutionNote:
      uk: "Під час повторного рендеру `ExpenseRow` виконується для всіх рядків, але три з них повертають той самий опис, що й минулого разу. React порівнює описи, і commit міняє лише текст суми кави — тому рядок лишається тим самим елементом, і набраний у ньому текст чи фокус не загубились би."
      en: "On the re-render `ExpenseRow` runs for every row, but three of them return the same description as last time. React compares the descriptions, and the commit changes only the coffee’s amount text — which is why the row stays the same element, and typed text or focus in it would not be lost."
    feedback:
      - when: { test: "every row shows the label, the formatted amount and the date" }
        message:
          uk: "Ця перевірка чекає в кожному `<tr data-id=…>` три `<td>`: назву, суму на кшталт `180.00 грн` і дату. Якщо в сумі видно `18000`, поділи копійки на 100 і візьми `toFixed(2)`."
          en: "This check expects three `<td>` in every `<tr data-id=…>`: the label, an amount like `180.00 UAH` and the date. If the amount shows `18000`, divide the kopiykas by 100 and use `toFixed(2)`."
      - when: { test: "new data changes only the amount text of e-03 in the DOM" }
        message:
          uk: "Ця перевірка натискає «Наступні дані» й чекає рівно один рядок `DOM:` із `185.50`. Кілька рядків `DOM:` означають, що рядок показує щось, що змінюється в кожному рендері, хоча дані ті самі, — наприклад, час чи випадкове число."
          en: "This check presses “Next data” and expects exactly one `DOM:` line with `185.50`. Several `DOM:` lines mean the row shows something that changes on every render although the data is the same — for example the time or a random number."
      - when: { test: "the render log line is kept in ExpenseRow" }
        message:
          uk: "Ця перевірка шукає в консолі рядки `render ExpenseRow …`. Поверни на початок функції рядок `console.log` зі стартового коду."
          en: "This check looks for `render ExpenseRow …` lines in the console. Put the `console.log` line from the starting code back at the start of the function."
      - when: { error: TypeError }
        message:
          uk: "`TypeError`: значення не того виду, якого чекає код. Якщо сторінка порожня, а в консолі є *An error occurred in the &lt;…&gt; component*, помилка сталася під час рендеру цього компонента — рядок указано в картці помилки. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "`TypeError`: a value is not of the kind the code expects. If the page is empty and the console shows *An error occurred in the &lt;…&gt; component*, the error happened while that component rendered — the error card names the line. If every check fails at once, fix the first error in the console first."

  - id: to-project
    kind: transfer
    capstoneStep: RE-01
    body:
      uk: "У кроці проєкту твій список стане деревом компонентів. Не бійся, що React викликатиме їх часто: render — це лише обчислення опису, а в DOM commit вносить тільки різницю. Важливо інше — щоб компоненти для тих самих даних повертали той самий опис; про це наступний урок."
      en: "In the project step your list becomes a tree of components. Do not worry that React calls them often: render is just computing a description, and the commit puts only the difference into the DOM. What matters is that components return the same description for the same data; that is the next lesson."
