id: re-01-09-independent-migrate-ui
unit: RE-01
title:
  uk: "Самостійно: переносимо UI в компоненти"
  en: "Independent: migrate a UI into components"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Перевірити без підказок, що ти вмієш перенести готову сторінку на `innerHTML` у дерево типізованих компонентів: з props і children, умовним виводом, списком зі стабільними ключами — і не чіпаючи чистих доменних функцій. Це той самий перехід, який чекає на твій проєкт."
  en: "To check without hints that you can move a working `innerHTML` page into a tree of typed components: with props and children, conditional output and a list with stable keys — without touching the pure domain functions. It is the same move that awaits your project."
objectives:
  - uk: "Без підказок перенести сторінку на DOM у типізовані функціональні компоненти з props, children, умовним виводом і списками з ключами, імпортуючи наявні чисті доменні функції без змін."
    en: "Migrate, without hints, a prepared DOM-based record page into typed function components with props, children, conditional output and keyed lists, importing the existing pure domain functions unchanged."
prerequisites: [re-01-08-debug-keys-side-effects]
subskills:
  - { family: R-01, skill: "JSX rules", depth: assess }
  - { family: R-01, skill: "props/composition/children", depth: assess }
  - { family: R-01, skill: "conditional/list rendering", depth: assess }
  - { family: P-05, skill: "typed props/state/events/hooks", depth: practice }
glossary: []
selfCheck: [migrate-tasks]

blocks:
  - id: the-old-page
    kind: explanation
    title:
      uk: "Стара сторінка справ"
      en: "The old task page"
    body:
      uk: |
        У вправі — сторінка планувальника, написана по-старому: `legacy.ts` збирає HTML у текст і ставить його через `innerHTML`. Вона працює, але кожна зміна даних перебудовує все, а назва справи з розміткою стала б розміткою.

        Файли вправи:

        | Файл | Що в ньому | Можна змінювати |
        |---|---|---|
        | `domain.ts` | тип `Task` і чиста функція `countDueTasks(tasks, today)` | ні |
        | `tasks.ts` | шість справ і `TODAY` | ні |
        | `legacy.ts` | стара `renderTasks` — зразок того, що має бути на сторінці | ні |
        | `components.tsx` | твої компоненти | так |
        | `main.tsx` | точка входу; зараз викликає `renderTasks` | так |

        Запусти вправу й роздивись сторінку: твоя версія має показувати те саме.
      en: |
        The exercise holds a planner page written the old way: `legacy.ts` builds HTML as text and puts it in with `innerHTML`. It works, but every data change rebuilds everything, and a task title with markup would become markup.

        The exercise files:

        | File | What it holds | Editable |
        |---|---|---|
        | `domain.ts` | the type `Task` and the pure function `countDueTasks(tasks, today)` | no |
        | `tasks.ts` | six tasks and `TODAY` | no |
        | `legacy.ts` | the old `renderTasks` — a model of what the page must show | no |
        | `components.tsx` | your components | yes |
        | `main.tsx` | the entry point; it calls `renderTasks` now | yes |

        Run the exercise and look at the page: your version must show the same.

  - id: recall-erased
    kind: review
    title:
      uk: "Згадай: що лишається від типів"
      en: "Recall: what is left of the types"
    items:
      - id: types-at-runtime
        from: js-14-08-compile-time-vs-runtime
        prompt:
          uk: "Компонент описано як `function RecordCard({ task }: { task: Task })`. Під час виконання хтось передає йому `task`, у якого `dueDate` — число `20260302`. Що станеться?"
          en: "A component is declared as `function RecordCard({ task }: { task: Task })`. At runtime someone passes it a `task` whose `dueDate` is the number `20260302`. What happens?"
        answer:
          type: choice
          options:
            - id: renders
              text:
                uk: "Компонент виконається й покаже число: типів під час виконання вже немає"
                en: "The component runs and shows the number: the types are gone at runtime"
            - id: throws
              text:
                uk: "React кине `TypeError`, бо props не відповідають типу `Task`"
                en: "React throws a `TypeError` because the props do not match the type `Task`"
              why:
                uk: "Ні React, ні браузер не знають про тип `Task`: після компіляції від нього нічого не лишилося."
                en: "Neither React nor the browser knows the type `Task`: nothing of it is left after compiling."
            - id: skipped
              text:
                uk: "Компонент не буде показано, бо props не пройшли перевірку"
                en: "The component is not shown because the props failed the check"
              why:
                uk: "Перевірки props під час виконання немає. `tsc` ловить такий виклик лише в коді, який він бачить до запуску."
                en: "There is no runtime check of props. `tsc` catches such a call only in code it sees before running."
          correct: [renders]
        explanation:
          uk: "Типи стираються до запуску. Тип props захищає виклики, які бачить `tsc`; дані ззовні — зі сховища чи мережі — треба перевіряти кодом, як у розділі про TypeScript."
          en: "Types are erased before running. A props type protects calls that `tsc` can see; outside data — from storage or the network — must be checked by code, as in the TypeScript unit."

  - id: migrate-tasks
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-react
    dir: migrate-tasks
    entry: main.tsx
    editable: [components.tsx, main.tsx]
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      wardrobe: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
      heading: { uk: "Справи", en: "Tasks" }
      dueNow: { uk: "Термін настав", en: "Due now" }
      empty: { uk: "Справ немає", en: "No tasks" }
      noDue: { uk: "без терміну", en: "no due date" }
      doneLabel: { uk: "виконано", en: "done" }
      pendingLabel: { uk: "не виконано", en: "not done" }
    title:
      uk: "Сторінка справ на компонентах"
      en: "The task page on components"
    instructions:
      uk: |
        Перенеси сторінку в компоненти React. У `components.tsx` експортуй чотири компоненти з типізованими props:

        - **`Card`** — props `title` і `children`: `<section>` із заголовком `<h2>` з `title`, під ним — `children`.
        - **`RecordCard`** — prop `task` типу `Task`: `<li>` з атрибутом `data-id` — `id` справи; у ньому `<h3>` з назвою, `<p>` з датою терміну або текстом «без терміну», якщо дати немає, і `<p>` з «виконано» чи «не виконано».
        - **`RecordList`** — prop `tasks`: `<ul>` з `RecordCard` для кожної справи в тому самому порядку або, якщо справ немає, лише `<p>` «Справ немає».
        - **`App`** — props `tasks` і `today`: `Card` із заголовком «Справи», у якому абзац «Термін настав: N» і `RecordList`. N обчислює `countDueTasks` з `domain.ts`.

        У `main.tsx` намалюй `<App tasks={tasks} today={TODAY} />` через `createRoot` замість виклику `renderTasks`.

        Приховані перевірки малюють кожен компонент окремо з різними даними: порожній список, справу без терміну, переставлений список, назву з розміткою. `domain.ts`, `tasks.ts` і `legacy.ts` змінювати не можна. Типи пісочниця не перевіряє; якщо хочеш, перевір файл у своїй `ts-lab` командою `npx tsc --noEmit`, як у локальному завданні про props.
      en: |
        Move the page into React components. In `components.tsx` export four components with typed props:

        - **`Card`** — props `title` and `children`: a `<section>` with an `<h2>` heading with `title`, and the `children` under it.
        - **`RecordCard`** — a prop `task` of type `Task`: an `<li>` with a `data-id` attribute — the task’s `id`; inside it an `<h3>` with the title, a `<p>` with the due date or the text “no due date” when there is no date, and a `<p>` with “done” or “not done”.
        - **`RecordList`** — a prop `tasks`: a `<ul>` with a `RecordCard` for every task in the same order or, when there are no tasks, only a `<p>` “No tasks”.
        - **`App`** — props `tasks` and `today`: a `Card` titled “Tasks” holding a paragraph “Due now: N” and the `RecordList`. N is computed by `countDueTasks` from `domain.ts`.

        In `main.tsx` draw `<App tasks={tasks} today={TODAY} />` with `createRoot` instead of calling `renderTasks`.

        Hidden checks draw every component on its own with different data: an empty list, a task without a due date, a reordered list, a title with markup. `domain.ts`, `tasks.ts` and `legacy.ts` cannot be changed. The sandbox does not check types; if you like, check the file in your `ts-lab` with `npx tsc --noEmit`, as in the local task about props.
    testTitles:
      "App shows a Card with the heading, the due count and the list":
        uk: "`App` показує `Card` із заголовком, кількістю справ із терміном і списком"
        en: "`App` shows a `Card` with the heading, the due count and the list"
      "the due count is what countDueTasks returns":
        uk: "Кількість — те, що повертає `countDueTasks`"
        en: "The count is what `countDueTasks` returns"
      "RecordCard shows the title, the due date and the status":
        uk: "`RecordCard` показує назву, термін і стан"
        en: "`RecordCard` shows the title, the due date and the status"
      "a task without a due date says so":
        uk: "Справа без терміну так і каже"
        en: "A task without a due date says so"
      "an empty list shows only the empty-state message":
        uk: "Порожній список показує лише повідомлення"
        en: "An empty list shows only the message"
      "Card shows its title and its children":
        uk: "`Card` показує заголовок і children"
        en: "`Card` shows its title and its children"
      "a reorder keeps each card element with its task":
        uk: "Після перестановки кожен елемент картки лишається зі своєю справою"
        en: "After a reorder each card element stays with its task"
      "a title with markup is shown as text":
        uk: "Назва з розміткою показується як текст"
        en: "A title with markup is shown as text"
      "the page is rendered by React from App":
        uk: "Сторінку малює React з `App`"
        en: "The page is rendered by React from `App`"
      "React gives no key warning":
        uk: "React не попереджає про ключі"
        en: "React gives no key warning"
    solutionNote:
      uk: "Кожен компонент відповідає за свій шматок: `Card` — рамка й заголовок, `RecordCard` — одна справа, `RecordList` — список або порожній стан, `App` — збирає все й питає домен про кількість. Доменна функція лишилась без змін — компоненти лише показують її результат. Ключ `task.id` тримає кожен `<li>` з його справою під час перестановки, а React показує назву з розміткою як текст — без жодного `innerHTML`."
      en: "Every component is responsible for its own piece: `Card` — the frame and heading, `RecordCard` — one task, `RecordList` — the list or the empty state, `App` — puts it together and asks the domain for the count. The domain function stayed unchanged — the components only show its result. The key `task.id` keeps every `<li>` with its task during a reorder, and React shows a title with markup as text — without any `innerHTML`."
    feedback:
      - when: { test: "the page is rendered by React from App" }
        message:
          uk: "Ця перевірка чекає, що `#root` — корінь React, створений `createRoot`, і в ньому шість справ. Якщо всі інші перевірки проходять, а ця — ні, `main.tsx` досі викликає `renderTasks`."
          en: "This check expects `#root` to be a React root made by `createRoot`, with six tasks in it. If every other check passes but this one does not, `main.tsx` still calls `renderTasks`."
      - when: { test: "the due count is what countDueTasks returns" }
        message:
          uk: "Ця перевірка дає `App` справи, серед яких є виконана з минулою датою й справа без терміну, і чекає число, яке повертає `countDueTasks`."
          en: "This check gives `App` tasks that include a done task with a past date and a task without a due date, and expects the number `countDueTasks` returns."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: у картці — файл і рядок, де компілятор зупинився. Перевір закриті теги, один корінь у кожного `return` і дужки навколо JSX у кілька рядків."
          en: "The code could not start: the card names the file and the line where the compiler stopped. Check closed tags, one root in every `return` and parentheses around multi-line JSX."
