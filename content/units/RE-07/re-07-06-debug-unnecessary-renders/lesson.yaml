id: re-07-06-debug-unnecessary-renders
unit: RE-07
title:
  uk: "Налагодження: виміряне вузьке місце"
  en: "Debug: an observed bottleneck"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "За записом профілювальника з’ясувати, чому кожна картка рендериться на кожну клавішу (значення context, створене на місці, нестабільні props)."
    en: "Diagnose from a Profiler recording why every card re-renders on each keystroke (a context value object created inline, unstable props)."
  - uk: "Виправити причину, підтвердити це другим записом і знову запустити перевірки клавіатури й поведінки."
    en: "Fix the cause, confirm it with a second recording and re-run the keyboard and behavior tests."
prerequisites: [re-07-05-long-lists-windowing, re-04-04-context-boundaries]
subskills:
  - { family: R-07, skill: "profiling/render causes", depth: assess }
  - { family: R-07, skill: "stable identity", depth: assess }
glossary: []
selfCheck: [predict-which-line, wish-board-debug]

blocks:
  - id: read-the-recording
    kind: explanation
    title:
      uk: "Запис каже, хто; причину треба довести"
      en: "The recording says who; the cause has to be proven"
    body:
      uk: |
        Ти вже вмієш записати взаємодію. У налагодженні запис — це початок, а не висновок:

        1. **Відтвори** повільну дію на великих синтетичних даних і запиши її.
        2. **Прочитай**, хто рендерився. Картка в `memo` рендериться лише з двох причин: змінився якийсь її prop або змінилося значення context, який вона читає. На доріжці Components ⚛ у першому випадку в деталях є **Changed Props**; якщо їх немає, а картка в `memo` — шукай context.
        3. **Перевір гіпотезу експериментом**: тимчасово зроби підозріле значення сталим і запиши знову. Рендери зникли — причину знайдено.
        4. **Виправ** і запиши втретє.
        5. **Запусти перевірки поведінки й клавіатури.** Швидший запис не доводить, що застосунок працює: мемоізація із застарілими залежностями пришвидшує все — разом із помилкою.
      en: |
        You already know how to record an interaction. In debugging the recording is the start, not the conclusion:

        1. **Reproduce** the slow action on large synthetic data and record it.
        2. **Read** who rendered. A card in `memo` renders for only two reasons: one of its props changed, or the value of a context it reads changed. On the Components ⚛ track the first case shows **Changed Props** in the details; if there are none and the card is in `memo`, look for a context.
        3. **Test the hypothesis with an experiment**: make the suspect value constant for a moment and record again. The renders are gone — the cause is found.
        4. **Fix** it and record a third time.
        5. **Run the behavior and keyboard checks.** A faster recording does not prove the app works: a memoization with stale dependencies speeds up everything — the bug included.

  - id: context-renders
    kind: example
    runtime: browser-react
    dir: context-renders
    entry: main.jsx
    strings:
      note: { uk: "Нотатка", en: "Note" }
      markToday: { uk: "Відмітити сьогодні", en: "Mark today" }
      doneToday: { uk: "Виконано сьогодні", en: "Done today" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
    title:
      uk: "Відтвори й підтверди причину"
      en: "Reproduce and confirm the cause"
    body:
      uk: |
        1 000 карток звичок у `memo`, кожна читає `TodayContext`. Натисни **Запустити** й набери дві літери в полі «Нотатка» на **Сторінці**. Консоль на кожну літеру: `⏱ HabitBoard · update · … ms · HabitBoard, HabitCard ×1000`. Props карток не змінювалися — `habits` той самий масив, а кожен `habit` той самий об’єкт.
      en: |
        1,000 habit cards in `memo`, each reads `TodayContext`. Press **Run** and type two letters into the “Note” field on the **Page**. For every letter the console shows: `⏱ HabitBoard · update · … ms · HabitBoard, HabitCard ×1000`. The cards’ props did not change — `habits` is the same array, and every `habit` is the same object.
    tryIt:
      uk: |
        1. **Запиши** набір літери на панелі Performance. На доріжці Components ⚛ — тисяча смужок `HabitCard`, і в деталях жодної з них немає Changed Props. Тепер натисни «Відмітити сьогодні» в будь-якій звичці й запиши ще раз: у деталях **цієї** картки з’явилися Changed Props — `habit` і його `completions`.
        2. **Експеримент.** Над `export default` додай сталу `const PROBE = { today: "2026-03-01", markDone: () => {} };` і тимчасово заміни `value={{ today, markDone }}` на `value={PROBE}`. Запусти й набери літеру: `HabitCard` у рядку консолі зник. Гіпотезу підтверджено: картки рендерило нове значення context. Але «Відмітити сьогодні» тепер нічого не робить — експеримент не виправлення.
        3. Поверни `value={{ today, markDone }}`. Як виправити це по-справжньому, ти вирішиш у вправі нижче.
      en: |
        1. **Record** typing a letter in the Performance panel. On the Components ⚛ track there are a thousand `HabitCard` bars, and none of them has Changed Props in the details. Now press “Mark today” for any habit and record again: the details of **that** card show Changed Props — `habit` and its `completions`.
        2. **Experiment.** Above `export default` add the constant `const PROBE = { today: "2026-03-01", markDone: () => {} };` and temporarily replace `value={{ today, markDone }}` with `value={PROBE}`. Run and type a letter: `HabitCard` is gone from the console line. The hypothesis is confirmed: a new context value rendered the cards. But “Mark today” now does nothing — an experiment is not a fix.
        3. Bring back `value={{ today, markDone }}`. How to fix it for real, you will decide in the exercise below.

  - id: recall-context
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: consumers-follow-value
        from: re-04-04-context-boundaries
        prompt:
          uk: "Коли компонент, що читає context через `useContext`, рендериться через цей context?"
          en: "When does a component that reads a context through `useContext` render because of that context?"
        answer:
          type: choice
          options:
            - id: value-changed
              text:
                uk: "Коли значення найближчого provider над ним стало іншим за `Object.is`"
                en: "When the value of the nearest provider above it became different by `Object.is`"
            - id: provider-rendered
              text:
                uk: "Щоразу, коли рендериться компонент із provider, навіть з тим самим значенням"
                en: "Every time the component with the provider renders, even with the same value"
              why:
                uk: "Сам рендер provider не змушує споживачів рендеритися. Важить, чи значення — той самий об’єкт чи число. Але об’єкт, написаний прямо в `value={{ … }}`, на кожному рендері новий."
                en: "A provider’s render by itself does not make consumers render. What matters is whether the value is the same object or number. But an object written right in `value={{ … }}` is new on every render."
          correct: [value-changed]
        explanation:
          uk: "React порівнює нове значення context зі старим через `Object.is`. Рядок чи число зі стану лишається тим самим, доки його не змінили. Об’єкт, створений під час рендеру provider, щоразу новий — і тоді рендеряться всі споживачі, навіть у `memo`."
          en: "React compares the new context value with the old one through `Object.is`. A string or number from state stays the same until it is changed. An object created during the provider’s render is new every time — and then all consumers render, even inside `memo`."

  - id: predict-which-line
    kind: prediction
    prompt:
      uk: "Запис набору однієї літери в полі «Нове бажання»: на доріжці Components ⚛ — 2 000 смужок `WishCard`, у деталях жодної немає Changed Props, `WishCard` обгорнуто в `memo` і він читає `BoardContext`. Який рядок спричиняє ці рендери?"
      en: "A recording of typing one letter into the “New wish” field: on the Components ⚛ track there are 2,000 `WishCard` bars, none has Changed Props in the details, `WishCard` is wrapped in `memo` and reads `BoardContext`. Which line causes these renders?"
    code: |
      // A
      const [draft, setDraft] = useState("");
      // B
      <BoardContext value={{ selectedId, select: setSelectedId, savePrice }}>
      // C
      {shown.map((wish, index) => <WishCard key={index} wish={wish} />)}
      // D
      export const WishCard = memo(function WishCard({ wish }) { /* … */ });
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: b
          text: { uk: "B — значення context", en: "B — the context value" }
        - id: a
          text: { uk: "A — стан чернетки", en: "A — the draft state" }
          why:
            uk: "Стан чернетки рендерить дошку — це власний стан, і це нормально. Але картки в `memo` з тими самими props мали б цей рендер пропустити."
            en: "The draft state renders the board — that is own state, and it is fine. But cards in `memo` with the same props should have skipped that render."
        - id: c
          text: { uk: "C — ключ з індексу", en: "C — the index key" }
          why:
            uk: "Ключ з індексу — справжня помилка, але інша: без сортування в кожної позиції той самий `wish`, і props не змінюються. Зламається він, коли порядок зміниться."
            en: "The index key is a real bug, but a different one: without sorting, each position has the same `wish`, so the props do not change. It breaks when the order changes."
        - id: d
          text: { uk: "D — `memo` на картці", en: "D — `memo` on the card" }
          why:
            uk: "`memo` не причина рендерів: він пропускав би їх, якби props і context лишалися тими самими."
            en: "`memo` is not the cause of the renders: it would skip them if the props and the context stayed the same."
      correct: [b]
    explanation:
      uk: "Changed Props немає, отже props тих самих — лишається context. Об’єкт у `value={{ … }}` створюється на кожному рендері дошки, тож кожна літера дає новий context і 2 000 рендерів. Перевірено в пісочниці: з таким рядком одна літера — 2 000 рендерів `WishCard`."
      en: "There are no Changed Props, so the props are the same — the context is what is left. The object in `value={{ … }}` is created on every render of the board, so every letter gives a new context and 2,000 renders. Checked in the sandbox: with this line one letter means 2,000 `WishCard` renders."

  - id: fix-sequence
    kind: visual
    visual: render-timeline
    title:
      uk: "Запис до виправлення й після"
      en: "The recording before the fix and after"
    textEquivalent:
      uk: "До виправлення: користувач набирає літеру, setDraft змінює стан WishBoard. Рендер 2: дошка рендериться через власний стан, створює новий об’єкт для value context, і всі 2 000 карток рендеряться через зміну context, хоча їхні props ті самі. Після виправлення значення context лишається тим самим об’єктом, доки не змінилися selectedId і savePrice. Набір літери: рендериться дошка, а картки пропускають рендер — у пісочниці 0 рендерів WishCard. Потім користувач відкриває редактор ціни, натискає Escape — фокус повертається на «Змінити ціну», — і перевірки поведінки й клавіатури проходять."
      en: "Before the fix: the user types a letter, setDraft changes WishBoard’s state. Render 2: the board renders because of its own state, creates a new object for the context value, and all 2,000 cards render because of the context change, although their props are the same. After the fix the context value stays the same object while selectedId and savePrice do not change. Typing a letter: the board renders, while the cards skip rendering — 0 WishCard renders in the sandbox. Then the user opens the price editor, presses Escape — focus returns to “Edit price” — and the behavior and keyboard checks pass."
    spec:
      component: WishBoard
      code: |
        function WishBoard() {
          const [draft, setDraft] = useState("");
          const [selectedId, setSelectedId] = useState(null);
          return (
            <BoardContext value={{ selectedId, select: setSelectedId, savePrice }}>
              {/* the form + 2,000 WishCard */}
            </BoardContext>
          );
        }
      steps:
        - phase: render
          render: 1
          line: 1
          reason: { uk: "перший показ", en: "first display" }
          snapshot: { state: { draft: "", selectedId: null } }
          caption:
            uk: "Перший показ: дошка й 2 000 карток."
            en: "First display: the board and 2,000 cards."
        - phase: commit
          render: 1
          dom: "<form>…</form> <ul>2000 × <li></ul>"
          caption:
            uk: "Commit створює форму й список."
            en: "The commit creates the form and the list."
        - phase: event
          name: input
          line: 2
          sees: { draft: "" }
          actions: ["setDraft(\"l\")"]
          queued: { draft: "l" }
          caption:
            uk: "**До виправлення.** Користувач набирає літеру в полі «Нове бажання»."
            en: "**Before the fix.** The user types a letter into the “New wish” field."
        - phase: render
          render: 2
          line: 5
          reason: { uk: "власний стан; картки — новий об’єкт context", en: "own state; the cards — a new context object" }
          snapshot: { state: { draft: "l", selectedId: null } }
          caption:
            uk: "Дошка створює **новий** об’єкт для `value`. Усі 2 000 карток рендеряться через context, хоча Changed Props у них немає."
            en: "The board creates a **new** object for `value`. All 2,000 cards render because of the context, although they have no Changed Props."
        - phase: commit
          render: 2
          dom: "<form><input value=\"l\"></form> <ul>2000 × <li></ul>"
          caption:
            uk: "У DOM змінилася лише одна літера в полі."
            en: "Only one letter in the field changed in the DOM."
        - phase: event
          name: input
          line: 2
          sees: { draft: "l" }
          actions: ["setDraft(\"la\")"]
          queued: { draft: "la" }
          caption:
            uk: "**Після виправлення** значення context лишається тим самим об’єктом, доки не змінилися `selectedId` і `savePrice`. Ще одна літера."
            en: "**After the fix** the context value stays the same object until `selectedId` or `savePrice` changes. One more letter."
        - phase: render
          render: 3
          line: 5
          reason: { uk: "власний стан; context той самий", en: "own state; the context is the same" }
          snapshot: { state: { draft: "la", selectedId: null } }
          caption:
            uk: "`selectedId` і `savePrice` ті самі, тож і значення context те саме. Картки пропускають рендер — 0 рендерів `WishCard`."
            en: "`selectedId` and `savePrice` are the same, so the context value is the same too. The cards skip rendering — 0 `WishCard` renders."
        - phase: commit
          render: 3
          dom: "<form><input value=\"la\"></form> <ul>2000 × <li></ul>"
          caption:
            uk: "Запис швидший. Але це ще не кінець: перевірки вибору, сортування, редагування з клавіатури мають пройти знову — і тільки тоді виправлення готове."
            en: "The recording is faster. But that is not the end yet: the checks for selecting, sorting and editing by keyboard must pass again — only then is the fix done."

  - id: wish-board-debug
    kind: exercise
    mode: debug
    runtime: browser-react
    dir: wish-board-debug
    entry: main.jsx
    editable: [App.jsx]
    strings:
      currency: { uk: "грн", en: "UAH" }
      select: { uk: "Обрати", en: "Select" }
      editPrice: { uk: "Змінити ціну", en: "Edit price" }
      newPrice: { uk: "Нова ціна", en: "New price" }
      newWish: { uk: "Нове бажання", en: "New wish" }
      add: { uk: "Додати", en: "Add" }
      sortByPrice: { uk: "Спершу дешевші", en: "Cheapest first" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      mug: { uk: "Термочашка", en: "Travel mug" }
    title:
      uk: "Дошка бажань: зайві рендери й редактор не там"
      en: "The wish board: extra renders and an editor in the wrong place"
    instructions:
      uk: |
        Дошка має 2 000 бажань. Кожна картка (`WishCard.jsx`, у `memo`, рахує свої рендери; цей файл змінювати не можна) вміє «Обрати» й «Змінити ціну» з клавіатури: Enter відкриває поле, Enter у полі зберігає, Escape закриває й повертає фокус. Користувачі скаржаться на дві речі:

        - поле «Нове бажання» відстає під час набору;
        - якщо відкрити редактор ціни й увімкнути «Спершу дешевші», редактор опиняється в **іншому** бажанні.

        Відтвори обидві проблеми, запиши набір на панелі Performance і знайди причини в `App.jsx`. Виправ їх так, щоб набір назви не рендерив жодної картки, вибір і збереження ціни працювали як раніше, а відкритий редактор після сортування лишався зі своїм бажанням. Після виправлення запиши набір ще раз і порівняй.
      en: |
        The board has 2,000 wishes. Every card (`WishCard.jsx`, in `memo`, counts its renders; this file cannot be changed) can “Select” and “Edit price” by keyboard: Enter opens the field, Enter in the field saves, Escape closes it and returns focus. Users complain about two things:

        - the “New wish” field lags while typing;
        - if you open a price editor and turn on “Cheapest first”, the editor ends up in a **different** wish.

        Reproduce both problems, record typing in the Performance panel and find the causes in `App.jsx`. Fix them so that typing a name renders no card, selecting and saving a price work as before, and an open editor stays with its wish after sorting. After the fix, record typing again and compare.
    testTitles:
      "typing a new wish name renders no cards":
        uk: "Набір назви нового бажання не рендерить жодної картки"
        en: "Typing a new wish name renders no cards"
      "selecting a wish marks exactly that card":
        uk: "«Обрати» позначає саме цю картку"
        en: "“Select” marks exactly that card"
      "an open price editor stays with its wish after sorting":
        uk: "Відкритий редактор ціни після сортування лишається зі своїм бажанням"
        en: "An open price editor stays with its wish after sorting"
      "Escape closes the editor and returns focus to its Edit button":
        uk: "Escape закриває редактор і повертає фокус на його «Змінити ціну»"
        en: "Escape closes the editor and returns focus to its “Edit price” button"
      "Enter saves the new price":
        uk: "Enter зберігає нову ціну"
        en: "Enter saves the new price"
    hints:
      nudge:
        uk: "Проблем дві, і причини різні. Для першої: у деталях смужок `WishCard` немає Changed Props — що ще, крім props, може змусити картку в `memo` рендеритися? Для другої: чим React відрізняє одну картку від іншої, коли порядок змінився?"
        en: "There are two problems with different causes. For the first: the `WishCard` bars have no Changed Props in their details — what else besides props can make a card in `memo` render? For the second: how does React tell one card from another when the order changed?"
      explanation:
        uk: "Значення context, записане прямо в `value={{ … }}`, — новий об’єкт на кожному рендері, і кожен споживач рендериться. Збери його через `useMemo` з тими значеннями, від яких воно справді залежить, — а функції в ньому мають бути стабільними (сеттер стабільний сам, свою функцію зроби стабільною через `useCallback` з оновлювачем). Не залишай залежності порожніми, якщо в об’єкті є стан: тоді картки ніколи не побачать новий вибір. Ключ з індексу прив’язує стан картки — відкритий редактор — до позиції, а не до запису; ключем має бути id запису, як ти робив у RE-01."
        en: "A context value written right in `value={{ … }}` is a new object on every render, and every consumer renders. Build it with `useMemo` from the values it really depends on — and the functions in it must be stable (a setter is stable by itself; make your own function stable with `useCallback` and an updater). Do not leave the dependencies empty if the object holds state: then the cards never see a new selection. An index key ties a card’s state — the open editor — to a position, not to a record; the key must be the record’s id, as you did in RE-01."
    solutionNote:
      uk: "Дві причини — два рядки. `board` з `useMemo` залежить від `selectedId` і `savePrice`, а `savePrice` стабільна через `useCallback` з оновлювачем, тож під час набору значення context те саме, і картки в `memo` пропускають рендер; коли змінюється вибір, нове значення отримують усі — і це правильно. `key={wish.id}` прив’язує стан картки до бажання, тож редактор переїжджає разом із ним під час сортування. Перевірки клавіатури й збереження — та частина, що доводить: виправлення нічого не зламало."
      en: "Two causes — two lines. `board` from `useMemo` depends on `selectedId` and `savePrice`, and `savePrice` is stable through `useCallback` with an updater, so while typing the context value is the same and the cards in `memo` skip rendering; when the selection changes, all of them get the new value — and that is right. `key={wish.id}` ties a card’s state to the wish, so the editor moves with it when sorting. The keyboard and saving checks are the part that proves the fix broke nothing."
    feedback:
      - when: { test: "typing a new wish name renders no cards" }
        message:
          uk: "Ця перевірка набирає дві літери в полі «Нове бажання» й очікує нуль рендерів `WishCard`. Props карток під час набору ті самі; картку в `memo` може рендерити ще нове значення context — це той самий об’єкт між рендерами?"
          en: "This check types two letters into the “New wish” field and expects zero `WishCard` renders. The cards’ props are the same while typing; a card in `memo` can also be rendered by a new context value — is it the same object between renders?"
      - when: { test: "selecting a wish marks exactly that card" }
        message:
          uk: "Ця перевірка натискає «Обрати» в третій, потім у п’ятій картці й очікує `aria-pressed=\"true\"` лише в п’ятій. Якщо картки не бачать нового вибору, значення context не змінюється разом із `selectedId` — перевір залежності."
          en: "This check presses “Select” in the third, then in the fifth card and expects `aria-pressed=\"true\"` only in the fifth. If the cards do not see the new selection, the context value does not change together with `selectedId` — check the dependencies."
      - when: { test: "an open price editor stays with its wish after sorting" }
        message:
          uk: "Ця перевірка відкриває редактор у першій картці, вмикає «Спершу дешевші» й очікує рівно один відкритий редактор — у тому самому бажанні. Стан картки React прив’язує до її ключа."
          en: "This check opens the editor in the first card, turns on “Cheapest first” and expects exactly one open editor — in the same wish. React ties a card’s state to its key."
      - when: { test: "Escape closes the editor and returns focus to its Edit button" }
        message:
          uk: "Ця перевірка відкриває редактор третьої картки клавішею Enter, тисне Escape і очікує фокус на її «Змінити ціну». Ця поведінка була й до виправлення — зміна в `App.jsx` не має її ламати."
          en: "This check opens the third card’s editor with Enter, presses Escape and expects focus on its “Edit price”. This behavior existed before the fix — the change in `App.jsx` must not break it."
      - when: { test: "Enter saves the new price" }
        message:
          uk: "Ця перевірка вводить `35` у редактор другої картки, тисне Enter і очікує «35 грн» у ній. `savePrice` у значенні context має й далі оновлювати список."
          en: "This check types `35` into the second card’s editor, presses Enter and expects “35 UAH” in it. `savePrice` in the context value must still update the list."

  - id: to-project
    kind: transfer
    capstoneStep: RE-07
    body:
      uk: "Якщо твій проєкт передає дані через context, перевір запис набору в будь-якому полі: якщо рендеряться всі записи без Changed Props, подивись на `value` provider. І після кожного виправлення продуктивності запускай свої перевірки й проходь застосунок клавіатурою — так у кроці проєкту ти й підтвердиш, що нічого не зламав."
      en: "If your project passes data through a context, check a recording of typing in any field: if all records render without Changed Props, look at the provider’s `value`. And after every performance fix, run your checks and walk through the app by keyboard — that is how the project step confirms nothing broke."
