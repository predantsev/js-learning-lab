id: re-07-05-long-lists-windowing
unit: RE-07
title:
  uk: "Довгі списки й windowing"
  en: "Long lists and windowing awareness"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Оцінити кількість DOM-вузлів довгого списку й розпізнати, коли windowing — показ лише видимих рядків — вартий своєї ціни."
    en: "Estimate the DOM node count of a long list and recognize when windowing (rendering only the visible rows) is worth its cost."
  - uk: "Назвати, чим платять за windowing: пошук на сторінці, відновлення прокрутки, фокус клавіатури й контекст для програми читання з екрана."
    en: "Name what windowing costs: in-page find, scroll restoration, keyboard focus and screen-reader context."
prerequisites: [re-07-04-memoization-when-measured, re-01-04-conditional-list-rendering]
subskills:
  - { family: R-07, skill: "list/windowing awareness", depth: intro }
glossary: [list-windowing, overscan]
selfCheck: [predict-rows-in-dom, predict-which-list, list-decision]

blocks:
  - id: nodes-add-up
    kind: explanation
    title:
      uk: "Вузли накопичуються"
      en: "Nodes add up"
    body:
      uk: |
        Рядок списку — це не один вузол. `<li>` з назвою й кнопкою — це `li`, текст, `button` і текст у ній: щонайменше чотири вузли DOM. 5 000 звичок — 20 000 вузлів, і кожен React мусить створити, браузер — розмістити, а пам’ять — тримати. Memo тут не допоможе: перший показ однаково створює все.

        [[list-windowing|Windowing]] (ще кажуть «віртуалізація») показує лише ті рядки, що зараз у видимій частині, плюс кілька запасних зверху й знизу — [[overscan]]. Список лишається повної висоти, тож смуга прокрутки правдива, а коли користувач прокручує, вікно рядків зсувається. Ключі — це id записів, тож рядок, що лишився у вікні, — той самий вузол.

        Інші способи: **сторінки** (по 50 записів і кнопки «Далі») або просто **звичайний список**, якщо запис показує, що він швидкий.
      en: |
        A list row is not one node. An `<li>` with a name and a button is the `li`, a text, a `button` and the text in it: at least four DOM nodes. 5,000 habits are 20,000 nodes, and React has to create each one, the browser has to lay it out, and memory has to hold it. Memo does not help here: the first display creates everything anyway.

        [[list-windowing|Windowing]] (also called “virtualization”) shows only the rows that are in the visible part right now, plus a few spare ones above and below — the [[overscan]]. The list keeps its full height, so the scroll bar is truthful, and as the user scrolls, the window of rows slides. The keys are the record ids, so a row that stays in the window is the same node.

        The other ways: **pages** (50 records each with a “Next” button) or simply a **plain list**, if a recording shows it is fast.

  - id: predict-rows-in-dom
    kind: prediction
    prompt:
      uk: "Список має 5 000 записів, кожен рядок — 40 px заввишки, видима частина — 800 px, overscan — 5 рядків зверху й 5 знизу. Користувач прокрутив до середини списку. Скільки рядків є в DOM?"
      en: "A list has 5,000 records, every row is 40 px tall, the visible part is 800 px, the overscan is 5 rows above and 5 below. The user scrolled to the middle of the list. How many rows are in the DOM?"
    answer:
      type: choice
      options:
        - id: thirty
          text: { uk: "30", en: "30" }
        - id: twenty
          text: { uk: "20", en: "20" }
          why:
            uk: "Видимих рядків справді 20 (800 / 40), але overscan додає по 5 запасних з кожного боку."
            en: "There are indeed 20 visible rows (800 / 40), but the overscan adds 5 spare ones on each side."
        - id: twenty-five
          text: { uk: "25", en: "25" }
          why:
            uk: "25 буде на самому початку списку: зверху запасних рядків немає. У середині є обидва запаси."
            en: "25 is what you get at the very top of the list: there are no spare rows above. In the middle both spares exist."
        - id: all
          text: { uk: "5 000", en: "5,000" }
          why:
            uk: "Так було б у звичайному списку. Windowing тримає в DOM лише вікно навколо видимої частини."
            en: "That is a plain list. Windowing keeps only a window around the visible part in the DOM."
      correct: [thirty]
    explanation:
      uk: "800 / 40 = 20 видимих рядків, плюс 5 над ними й 5 під ними — 30. Прикладом нижче це видно наживо: з видимою частиною 400 px і тим самим overscan на початку списку 15 рядків, а в середині — 20. Із 5 000 рядків до 30 — у DOM лишається менше за один відсоток вузлів."
      en: "800 / 40 = 20 visible rows, plus 5 above and 5 below — 30. The example below shows it live: with a 400 px visible part and the same overscan, there are 15 rows at the top of the list and 20 in the middle. From 5,000 rows to 30 — less than one percent of the nodes stays in the DOM."

  - id: window-diagram
    kind: visual
    visual: diagram
    title:
      uk: "Вікно рядків над списком із 5 000"
      en: "A window of rows over a list of 5,000"
    textEquivalent:
      uk: "Список має 5 000 записів і повну висоту 200 000 px. У звичайному списку всі 5 000 рядків існують як вузли DOM. З windowing рядки до вікна й після нього в DOM не існують — лише порожнє місце потрібної висоти. Вузли є тільки для 5 рядків overscan зверху, 20 видимих рядків у вікні перегляду 800 px і 5 рядків overscan знизу. Коли користувач прокручує, вікно зсувається: рядки, що вийшли з нього, зникають із DOM, нові з’являються, а ті, що лишилися, зберігають свої вузли, бо ключ — це id запису."
      en: "The list has 5,000 records and a full height of 200,000 px. In a plain list all 5,000 rows exist as DOM nodes. With windowing the rows before the window and after it do not exist in the DOM — only empty space of the right height. Nodes exist only for 5 overscan rows above, 20 visible rows in the 800 px viewport and 5 overscan rows below. When the user scrolls, the window slides: rows that left it disappear from the DOM, new ones appear, and the ones that stayed keep their nodes because the key is the record id."
    spec:
      layout: tb
      groups:
        - { id: list, label: { uk: "Список: 5 000 записів", en: "List: 5,000 records" } }
      nodes:
        - { id: before, group: list, label: { uk: "рядки до вікна — немає в DOM", en: "rows before — not in the DOM" }, w: 260 }
        - { id: over1, group: list, label: { uk: "overscan: 5 рядків", en: "overscan: 5 rows" }, w: 260 }
        - { id: visible, group: list, label: { uk: "видимі: 20 рядків (800 px)", en: "visible: 20 rows (800 px)" }, w: 260 }
        - { id: over2, group: list, label: { uk: "overscan: 5 рядків", en: "overscan: 5 rows" }, w: 260 }
        - { id: after, group: list, label: { uk: "рядки після — немає в DOM", en: "rows after — not in the DOM" }, w: 260 }
      edges:
        - { id: e1, from: before, to: over1, kind: line }
        - { id: e2, from: over1, to: visible, kind: line }
        - { id: e3, from: visible, to: over2, kind: line }
        - { id: e4, from: over2, to: after, kind: line }
      steps:
        - caption:
            uk: "Звичайний список: усі 5 000 рядків — вузли DOM, хоча на екрані їх лише 20."
            en: "A plain list: all 5,000 rows are DOM nodes, although only 20 are on the screen."
          highlight: [before, over1, visible, over2, after]
        - caption:
            uk: "Windowing: вузли є лише для 20 видимих рядків і по 5 запасних з кожного боку — 30. Решта — порожнє місце, що тримає висоту списку."
            en: "Windowing: nodes exist only for the 20 visible rows and 5 spare ones on each side — 30. The rest is empty space that keeps the list’s height."
          highlight: [over1, visible, over2]
          dim: [before, after]
        - caption:
            uk: "Прокрутка зсуває вікно: рядки, що вийшли з нього, зникають із DOM — разом із фокусом, якщо він був на них; нові з’являються. Рядки, що лишилися, — ті самі вузли, бо ключ — id запису."
            en: "Scrolling slides the window: rows that left it disappear from the DOM — together with the focus, if it was on them; new ones appear. Rows that stayed are the same nodes, because the key is the record id."
          highlight: [over1, visible, over2]
          dim: [before, after]
          annotate:
            - { id: visible, text: { uk: "вікно зсунулося", en: "the window slid" } }

  - id: window-demo
    kind: example
    runtime: browser-react
    dir: window-demo
    entry: main.jsx
    strings:
      windowing: { uk: "Windowing", en: "Windowing" }
      rowsInDom: { uk: "Рядків у DOM:", en: "Rows in the DOM:" }
      done: { uk: "Виконано:", en: "Done:" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
    title:
      uk: "Мінімальний windowing: увімкни й вимкни"
      en: "Minimal windowing: turn it on and off"
    body:
      uk: |
        5 000 звичок, рядок 40 px, видима частина 400 px, overscan 5. Увесь windowing — у `WindowedList`: номер першого видимого рядка з `scrollTop`, межі вікна з запасом і `slice`. Рядки стоять на своїх місцях через `position: absolute`.

        Натисни **Запустити**. Перший рядок консолі — показ 5 000 рядків (у пісочниці близько 70 мс). Увімкни «Windowing» на **Сторінці**: менше мілісекунди, «Рядків у DOM: 15». Прокрути список до середини — 20. Вимкни — знову десятки мілісекунд на 5 000 рядків.
      en: |
        5,000 habits, 40 px rows, a 400 px visible part, an overscan of 5. All of the windowing is in `WindowedList`: the first visible row’s number from `scrollTop`, the window’s bounds with a margin, and `slice`. Rows sit in their places through `position: absolute`.

        Press **Run**. The first console line is the display of 5,000 rows (about 70 ms in the sandbox). Turn on “Windowing” on the **Page**: under a millisecond, “Rows in the DOM: 15”. Scroll the list to the middle — 20. Turn it off — tens of milliseconds again for 5,000 rows.
    tryIt:
      uk: |
        Тепер подивись, чим за це платять. Увімкни «Windowing» і:

        1. **Пошук на сторінці.** Натисни Ctrl+F (Cmd+F на macOS) і шукай число `3000`. Знайдено нічого: рядка 3000 немає в DOM. У звичайному списку він знаходиться.
        2. **Фокус.** Клацни на «Windowing» і тисни Tab по кнопках рядків. Фокус іде далі за десятий рядок: коли він стає на запасний рядок, браузер прокручує список, і вікно зсувається. Тепер зміни `OVERSCAN` на `0` і повтори: після десятого рядка фокус **виходить зі списку**. Поверни `5`.
        3. **Втрата фокуса.** Постав фокус на кнопку рядка й прокрути список коліщатком далеко вниз. Рядок із фокусом зник із DOM, і фокус упав на `body` — як після видалення.
      en: |
        Now look at what it costs. Turn on “Windowing” and:

        1. **Find in page.** Press Ctrl+F (Cmd+F on macOS) and search for the number `3000`. Nothing is found: row 3000 is not in the DOM. In the plain list it is found.
        2. **Focus.** Click “Windowing” and press Tab through the rows’ buttons. Focus goes past the tenth row: when it lands on a spare row, the browser scrolls the list and the window slides. Now change `OVERSCAN` to `0` and repeat: after the tenth row focus **leaves the list**. Change it back to `5`.
        3. **Losing focus.** Put focus on a row’s button and scroll the list far down with the wheel. The focused row disappeared from the DOM, and focus fell to `body` — as after a delete.

  - id: windowing-costs
    kind: explanation
    title:
      uk: "Чим платять за windowing"
      en: "What windowing costs"
    body:
      uk: |
        Те, що ти щойно бачив, — ціна, і її треба окупити:

        | Що ламається | Чому |
        |---|---|
        | пошук на сторінці (Ctrl+F) | браузер шукає лише в DOM |
        | фокус клавіатури | рядок із фокусом зникає, коли виходить із вікна; без overscan Tab виходить зі списку |
        | контекст для програми читання з екрана | вона бачить 30 рядків замість 5 000 і не знає, де ти в списку, доки не додати `aria-setsize` і `aria-posinset` |
        | відновлення прокрутки | після переходу на іншу сторінку й назад треба самому відновити `scrollTop` і вікно |

        Тому windowing — не правило «понад 100 записів». Спершу виміряй звичайний список на **реалістичній** кількості записів. Якщо рендер укладається в кадр, лиши його; якщо ні — сторінки часто простіші. Windowing — коли записів справді тисячі й їх треба гортати одним списком.
      en: |
        What you just saw is a price, and it has to pay for itself:

        | What breaks | Why |
        |---|---|
        | find in page (Ctrl+F) | the browser searches only the DOM |
        | keyboard focus | the focused row disappears when it leaves the window; without overscan Tab leaves the list |
        | screen-reader context | it sees 30 rows instead of 5,000 and does not know where you are in the list unless you add `aria-setsize` and `aria-posinset` |
        | scroll restoration | after going to another page and back you have to restore `scrollTop` and the window yourself |

        So windowing is not a rule like “over 100 records”. First measure the plain list at a **realistic** number of records. If the render fits within a frame, keep it; if not, pages are often simpler. Windowing is for when there really are thousands of records that must be scrolled as one list.

  - id: recall-lazy
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: generator-makes-few
        from: js-13-02-generators
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          function* habitPages() {
            let made = 0;
            while (true) {
              made += 1;
              console.log(`made ${made}`);
              yield { id: `h-${made}` };
            }
          }
          const page = [];
          for (const habit of habitPages()) {
            page.push(habit);
            if (page.length === 3) break;
          }
          console.log(page.length);
        verify:
          logs: ["made 1", "made 2", "made 3", "3"]
        answer:
          type: choice
          options:
            - { id: three, code: "made 1\nmade 2\nmade 3\n3" }
            - id: forever
              text:
                uk: "Програма ніколи не закінчиться: `while (true)` нескінченний"
                en: "The program never finishes: `while (true)` is endless"
              why:
                uk: "Генератор працює лише тоді, коли в нього просять наступне значення. Після `break` більше ніхто не просить."
                en: "A generator works only when the next value is asked for. After `break` nobody asks any more."
          correct: [three]
        explanation:
          uk: "Генератор створює записи ліниво — рівно стільки, скільки взяли. Windowing — та сама ідея для DOM: створювати вузли лише для того, що зараз потрібно бачити."
          en: "The generator creates records lazily — exactly as many as were taken. Windowing is the same idea for the DOM: create nodes only for what has to be seen right now."

  - id: predict-which-list
    kind: prediction
    prompt:
      uk: "Користувач планувальника має близько 300 справ. Звичайний список із 300 справами рендериться за 4 мс, а користувачі шукають справи через Ctrl+F. Що обрати?"
      en: "A planner user has about 300 tasks. A plain list with 300 tasks renders in 4 ms, and users find tasks with Ctrl+F. What do you choose?"
    answer:
      type: choice
      options:
        - id: plain
          text: { uk: "Звичайний список", en: "A plain list" }
        - id: windowing
          text: { uk: "Windowing: він завжди швидший", en: "Windowing: it is always faster" }
          why:
            uk: "4 мс уже вкладаються в кадр — прискорювати нічого. А windowing зламав би Ctrl+F, на який покладаються користувачі."
            en: "4 ms already fits within a frame — there is nothing to speed up. And windowing would break Ctrl+F, which the users rely on."
        - id: paging
          text: { uk: "Сторінки по 50", en: "Pages of 50" }
          why:
            uk: "Сторінки теж ховають записи від Ctrl+F і додають кліки. Вони мають сенс, коли звичайний список виміряно повільний."
            en: "Pages also hide records from Ctrl+F and add clicks. They make sense when the plain list was measured slow."
      correct: [plain]
    explanation:
      uk: "Рішення спирається на вимірювання на реалістичній кількості, а не на найбільшу можливу. 300 справ за 4 мс — звичайний список, і всі можливості браузера лишаються на місці."
      en: "The decision rests on a measurement at a realistic count, not at the largest possible one. 300 tasks in 4 ms means a plain list, and every browser feature stays in place."

  - id: list-decision
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: list-decision
    entry: main.jsx
    editable: [decision.js]
    strings:
      showing: { uk: "Скільки справ:", en: "How many tasks:" }
      water: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки", en: "Return books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      wardrobe: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
    title:
      uk: "Рішення для списку справ: на вимірюванні"
      en: "A decision for the task list: on a measurement"
    instructions:
      uk: |
        Рік щоденного користування планувальником — це **близько 300 справ**. Сторінка показує звичайний список справ і кнопки «300» та «5000»; консоль друкує час рендеру.

        Запусти й зніми два числа: рядок `mount` — сторінка відкрилася з 300 справами; рядок `update` після натискання «5000». Заповни `decision.js`:

        - `realisticCount` — реалістична кількість справ;
        - `msAtRealistic` і `msAt5000` — твої два числа;
        - `choice` — що обрати для реалістичної кількості: `"plain"`, `"paging"` чи `"windowing"`. Правило: якщо рендер укладається в кадр (16 мс чи менше), лишається звичайний список;
        - `windowingCosts` — чим довелося б платити за windowing. Обери всі, що справді є ціною, з цього списку: `"find-in-page"`, `"keyboard-focus"`, `"screen-reader-context"`, `"scroll-restoration"`, `"more-memory"`, `"slower-first-render"`.
      en: |
        A year of daily planner use is **about 300 tasks**. The page shows a plain task list and the buttons “300” and “5000”; the console prints the render time.

        Run it and take two numbers: the `mount` line — the page opened with 300 tasks; the `update` line after pressing “5000”. Fill in `decision.js`:

        - `realisticCount` — the realistic number of tasks;
        - `msAtRealistic` and `msAt5000` — your two numbers;
        - `choice` — what to choose for the realistic count: `"plain"`, `"paging"` or `"windowing"`. The rule: if the render fits within a frame (16 ms or less), the plain list stays;
        - `windowingCosts` — what windowing would cost. Pick every item that really is a price from this list: `"find-in-page"`, `"keyboard-focus"`, `"screen-reader-context"`, `"scroll-restoration"`, `"more-memory"`, `"slower-first-render"`.
    testTitles:
      "realisticCount is the count from the task":
        uk: "`realisticCount` — кількість із завдання"
        en: "`realisticCount` is the count from the task"
      "both render times are measured and 5,000 tasks take longer":
        uk: "Обидва часи виміряно, і 5 000 справ рендеряться довше"
        en: "Both render times are measured, and 5,000 tasks take longer"
      "the choice follows the measurement at the realistic count":
        uk: "`choice` відповідає вимірюванню на реалістичній кількості"
        en: "`choice` follows the measurement at the realistic count"
      "windowingCosts lists exactly what windowing costs":
        uk: "`windowingCosts` містить саме те, чим платять за windowing"
        en: "`windowingCosts` lists exactly what windowing costs"
    hints:
      nudge:
        uk: "Які з шести пунктів ти сам бачив у прикладі з 5 000 звичок, коли вмикав windowing? А що windowing робив з пам’яттю й першим показом — гірше чи краще?"
        en: "Which of the six items did you see yourself in the 5,000-habit example when you turned windowing on? And what did windowing do to memory and to the first display — worse or better?"
      explanation:
        uk: "Число для `choice` — то, що виміряно на реалістичній кількості, а не на 5 000: якщо, скажімо, 500 записів магазину рендеряться за 9 мс, це менше за кадр, і список лишається звичайним. Ціна windowing — це те, що він забирає в користувача: пошук, фокус, орієнтацію для програми читання з екрана, місце прокрутки. Пам’ять і перший показ він, навпаки, зменшує — це його виграш, а не ціна."
        en: "The number for `choice` is the one measured at the realistic count, not at 5,000: if, say, 500 shop records render in 9 ms, that is less than a frame, and the list stays plain. The price of windowing is what it takes from the user: search, focus, orientation for a screen reader, the scroll position. Memory and the first display it reduces instead — that is its gain, not its price."
    solutionNote:
      uk: "У пісочниці 300 справ рендеряться за кілька мілісекунд, а 5 000 — за кілька десятків. Для реалістичних 300 звичайний список укладається в кадр, тож windowing тут лише забрав би пошук, фокус, контекст для програми читання з екрана й місце прокрутки. Якщо на повільній машині навіть 300 справ виходять за кадр, вибір — сторінки чи windowing, і перевірка це приймає."
      en: "In the sandbox 300 tasks render in a few milliseconds, and 5,000 in a few tens. For the realistic 300 the plain list fits within a frame, so windowing would only take away search, focus, screen-reader context and the scroll position. If even 300 tasks go over a frame on a slow machine, the choice is pages or windowing, and the check accepts that."
    feedback:
      - when: { test: "realisticCount is the count from the task" }
        message:
          uk: "Ця перевірка очікує в `realisticCount` число з першого речення завдання — скільки справ має реальний користувач."
          en: "This check expects in `realisticCount` the number from the task’s first sentence — how many tasks a real user has."
      - when: { test: "both render times are measured and 5,000 tasks take longer" }
        message:
          uk: "Ця перевірка очікує два числа більші за нуль (без лапок), де `msAt5000` більше за `msAtRealistic`: перше — з рядка `mount`, друге — з рядка `update` після «5000»."
          en: "This check expects two numbers greater than zero (without quotes), with `msAt5000` greater than `msAtRealistic`: the first from the `mount` line, the second from the `update` line after “5000”."
      - when: { test: "the choice follows the measurement at the realistic count" }
        message:
          uk: "Ця перевірка дивиться на `msAtRealistic`: якщо воно 16 мс чи менше, `choice` має бути `\"plain\"`; якщо більше — `\"paging\"` чи `\"windowing\"`."
          en: "This check looks at `msAtRealistic`: if it is 16 ms or less, `choice` must be `\"plain\"`; if more — `\"paging\"` or `\"windowing\"`."
      - when: { test: "windowingCosts lists exactly what windowing costs" }
        message:
          uk: "Ця перевірка очікує масив із чотирма пунктами, які є ціною windowing, у будь-якому порядку. Два пункти зі списку — не ціна, а те, що windowing покращує."
          en: "This check expects an array with the four items that are the price of windowing, in any order. Two items of the list are not a price but what windowing improves."

  - id: to-project
    kind: transfer
    capstoneStep: RE-07
    body:
      uk: "У кроці проєкту ти виміряєш свій список на реалістичній кількості записів і на великій синтетичній і запишеш рішення — звичайний список, сторінки чи windowing — з одним числом, яке його виправдовує."
      en: "In the project step you will measure your list at a realistic number of records and at a large synthetic one, and write down the decision — a plain list, pages or windowing — with one number that justifies it."
