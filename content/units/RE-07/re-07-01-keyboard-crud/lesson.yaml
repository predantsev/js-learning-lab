id: re-07-01-keyboard-crud
unit: RE-07
title:
  uk: "CRUD, яким можна керувати з клавіатури"
  en: "Keyboard-operable CRUD"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Додати, змінити, позначити й видалити запис лише з клавіатури та сказати, де має опинитися фокус після кожної дії."
    en: "Operate create, edit, toggle and delete with the keyboard alone and state where focus must land after each action."
  - uk: "Перетворити елемент, що реагує лише на клік (`div` чи `span` з `onClick`), на справжню кнопку з видимою рамкою фокусу."
    en: "Repair a click-only control (a div with onClick) into a native button with a visible focus style."
prerequisites: [js-06-02-keyboard-focus-landmarks, re-04-05-refs-focus]
subskills:
  - { family: R-07, skill: "accessibility during optimization", depth: intro }
glossary: [keyboard-operable]
selfCheck: [predict-which-control, keyboard-rename]

blocks:
  - id: mouse-is-not-enough
    kind: explanation
    title:
      uk: "Працює мишею — ще не означає «працює»"
      en: "Works with a mouse is not the same as works"
    body:
      uk: |
        Інтерфейс [[keyboard-operable|керований з клавіатури]], коли **кожну** дію можна виконати без миші: Tab і Shift+Tab переводять [[keyboard-focus|фокус]], Enter натискає кнопку, Space натискає кнопку чи ставить позначку, Escape закриває те, що відкрилося. Так працюють люди без миші, люди з програмою читання з екрана — і всі, хто просто швидко друкує.

        `onClick` цього не гарантує. Він спрацьовує на подію `click`, а `<div>` чи `<span>` не стоять у [[tab-order|порядку Tab]] і не перетворюють Enter на клік. Справжня `<button>` дає все одразу: фокус, Enter і Space, роль «кнопка» для програми читання з екрана — і рамку фокусу, яку браузер малює сам.

        Тому перше правило цього розділу просте: **дія — це `<button>`, перехід на іншу адресу — це посилання `<a href>`**. А друге — після кожної дії фокус має стояти там, де користувач продовжить роботу.
      en: |
        An interface is [[keyboard-operable]] when **every** action can be done without a mouse: Tab and Shift+Tab move the [[keyboard-focus|focus]], Enter presses a button, Space presses a button or ticks a checkbox, Escape closes whatever opened. That is how people without a mouse work, people with a screen reader — and everyone who simply types fast.

        `onClick` does not guarantee any of this. It fires on the `click` event, and a `<div>` or `<span>` is neither in the [[tab-order|Tab order]] nor turns Enter into a click. A real `<button>` gives you everything at once: focus, Enter and Space, the “button” role for a screen reader — and a focus ring the browser draws itself.

        So the first rule of this unit is simple: **an action is a `<button>`, going to another address is a link `<a href>`**. The second: after every action, focus must stand where the user will continue.

  - id: predict-which-control
    kind: prediction
    prompt:
      uk: "На сторінці три елементи керування. Користувач тисне Tab, доки фокус не обійде сторінку, і на кожному елементі, куди потрапив фокус, тисне Enter. Для якого елемента в консолі з’явиться напис?"
      en: "A page has three controls. The user presses Tab until focus has gone through the page, and presses Enter on every element that got focus. For which element does a line appear in the console?"
    code: |
      <div onClick={() => console.log("A")}>Delete A</div>
      <div role="button" tabIndex={0} onClick={() => console.log("B")}>Delete B</div>
      <button onClick={() => console.log("C")}>Delete C</button>
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: only-c
          text:
            uk: "Лише для C: A фокусу не отримує, B отримує, але Enter нічого не робить"
            en: "Only for C: A never gets focus, B gets it but Enter does nothing"
        - id: b-and-c
          text:
            uk: "Для B і C: обидва стоять у порядку Tab і мають `onClick`"
            en: "For B and C: both are in the Tab order and have `onClick`"
          why:
            uk: "`tabIndex={0}` додає `div` у порядок Tab, але не вчить його натискатися. Enter на `div` не породжує події `click`, тож `onClick` мовчить. Кнопка робить це сама."
            en: "`tabIndex={0}` puts the `div` into the Tab order but does not teach it to be pressed. Enter on a `div` produces no `click` event, so `onClick` stays silent. A button does that by itself."
        - id: all
          text:
            uk: "Для всіх трьох: у кожного є `onClick`"
            en: "For all three: each has `onClick`"
          why:
            uk: "`onClick` слухає клік, а не клавіатуру. Звичайний `div` навіть не отримує фокус: Tab його пропускає."
            en: "`onClick` listens for a click, not for the keyboard. A plain `div` does not even get focus: Tab skips it."
      correct: [only-c]
    explanation:
      uk: "Перевірено справжніми натисканнями клавіш у Chrome 154: перший Tab стає на B, другий — на C; A Tab пропускає. Enter і Space на B нічого не друкують, на C — друкують `C`. Щоб `div` поводився як кнопка, довелося б дописати обробку Enter і Space, роль, стан `disabled` — і все одно вийшла б гірша копія `<button>`."
      en: "Checked with real key presses in Chrome 154: the first Tab lands on B, the second on C; Tab skips A. Enter and Space on B print nothing, on C they print `C`. To make a `div` behave like a button you would have to add Enter and Space handling, a role, a `disabled` state — and you would still get a worse copy of `<button>`."

  - id: where-focus-lands
    kind: explanation
    title:
      uk: "Куди ставити фокус після кожної дії"
      en: "Where to put focus after each action"
    body:
      uk: |
        Коли React прибирає з DOM елемент, на якому стояв фокус, фокус падає на `body` — це ти бачив у RE-04. Тому для кожної дії CRUD треба заздалегідь вирішити, де продовжить користувач:

        | Дія | Клавіша | Де фокус після неї |
        |---|---|---|
        | Додати | Enter у полі | лишається в полі, поле порожнє — можна додати ще |
        | Позначити виконаним | Space на позначці | лишається на позначці |
        | Відкрити редагування | Enter на «Змінити» | у полі редактора |
        | Зберегти чи скасувати | Enter чи Escape у полі | на «Змінити» того самого запису |
        | Видалити | Enter на «Видалити» | на «Видалити» наступного запису; якщо його немає — попереднього; якщо записів не лишилося — на заголовку списку |

        Перші два рядки браузер забезпечує сам: елемент із фокусом нікуди не зникає. Решта — твоя робота з [[dom-ref|ref]].
      en: |
        When React removes the focused element from the DOM, focus falls to `body` — you saw that in RE-04. So for every CRUD action you decide in advance where the user continues:

        | Action | Key | Where focus is afterwards |
        |---|---|---|
        | Add | Enter in the field | stays in the field, now empty — ready to add another |
        | Mark done | Space on the checkbox | stays on the checkbox |
        | Open editing | Enter on “Edit” | in the editor’s field |
        | Save or cancel | Enter or Escape in the field | on “Edit” of the same record |
        | Delete | Enter on “Delete” | on “Delete” of the next record; if there is none, of the previous one; if no records are left, on the list heading |

        The browser takes care of the first two rows itself: the focused element does not disappear. The rest is your job, with a [[dom-ref|ref]].

  - id: recall-focus
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: tab-reaches
        from: js-06-02-keyboard-focus-landmarks
        prompt:
          uk: "На які з цих елементів потрапить фокус, коли користувач тиснутиме Tab?"
          en: "Which of these elements get focus when the user presses Tab?"
        code: |
          <a href="#top">Top</a>
          <a>Not a link</a>
          <div tabindex="0">Card</div>
          <span>Note</span>
          <input disabled value="Locked">
          <button>Save</button>
        lang: html
        runnable: false
        answer:
          type: multi
          options:
            - { id: link, code: "<a href=\"#top\">" }
            - id: anchor
              code: "<a>"
              why:
                uk: "`<a>` без `href` — не посилання: він не фокусується й не має ролі «посилання»."
                en: "An `<a>` without `href` is not a link: it is not focusable and has no “link” role."
            - { id: div, code: "<div tabindex=\"0\">" }
            - id: span
              code: "<span>"
              why:
                uk: "`span` без `tabindex` не фокусується."
                en: "A `span` without `tabindex` is not focusable."
            - id: disabled
              code: "<input disabled>"
              why:
                uk: "Вимкнене поле Tab пропускає."
                en: "Tab skips a disabled field."
            - { id: button, code: "<button>" }
          correct: [link, div, button]
        explanation:
          uk: "Фокус отримують посилання з `href`, увімкнені кнопки й поля та будь-який елемент із `tabindex=\"0\"`. Перевірено в Chrome 154 справжніми натисканнями Tab: посилання, `div`, кнопка. Але фокус — це ще не дія: `div` з `tabindex` Enter не натискає."
          en: "Links with `href`, enabled buttons and fields, and any element with `tabindex=\"0\"` get focus. Checked in Chrome 154 with real Tab presses: the link, the `div`, the button. But focus is not yet an action: a `div` with `tabindex` is not pressed by Enter."
      - id: field-not-yet
        from: re-04-05-refs-focus
        prompt:
          uk: "Обробник кліку на «Змінити» викликає `setEditing(true)`, а потім `inputRef.current.focus()` для поля, яке з’являється лише в режимі редагування. Що станеться?"
          en: "The click handler of “Edit” calls `setEditing(true)` and then `inputRef.current.focus()` for a field that appears only in editing mode. What happens?"
        answer:
          type: choice
          options:
            - id: null-ref
              text:
                uk: "`TypeError`: у момент кліку поля ще немає в DOM, тож `inputRef.current` — `null`"
                en: "A `TypeError`: at the moment of the click the field is not in the DOM yet, so `inputRef.current` is `null`"
            - id: works
              text:
                uk: "Поле отримає фокус: `setEditing` уже показав його"
                en: "The field gets focus: `setEditing` has already shown it"
              why:
                uk: "`setEditing` лише ставить оновлення в чергу. Новий рендер і commit відбудуться після того, як обробник закінчиться."
                en: "`setEditing` only queues an update. The new render and commit happen after the handler finishes."
          correct: [null-ref]
        explanation:
          uk: "Елемент, якого ще немає, фокусують після commit: в ефекті або атрибутом `autoFocus`, який React виконує, коли вставляє поле в DOM."
          en: "An element that does not exist yet is focused after the commit: in an effect, or with the `autoFocus` attribute, which React applies when it inserts the field into the DOM."

  - id: keyboard-crud
    kind: example
    runtime: browser-react
    dir: keyboard-crud
    entry: main.jsx
    strings:
      heading: { uk: "Справи", en: "Tasks" }
      newTask: { uk: "Нова справа", en: "New task" }
      add: { uk: "Додати", en: "Add" }
      remove: { uk: "Видалити", en: "Delete" }
      water: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      focusOn: { uk: "фокус на:", en: "focus is on:" }
    title:
      uk: "Список справ лише з клавіатури"
      en: "A task list with the keyboard only"
    body:
      uk: |
        Ефект в `App.jsx` після кожної зміни списку друкує в **Консоль**, де зараз фокус. Натисни **Запустити**, клацни на **Сторінці** на порожньому місці над заголовком і далі не чіпай мишу:

        1. Tab до поля «Нова справа», набери назву й натисни Enter — справа додалася, фокус лишився в порожньому полі.
        2. Tab до позначки будь-якої справи й натисни Space — позначка змінилася, фокус на ній.
        3. Tab до «Видалити Здати книжки в бібліотеку» й натисни Enter. Консоль: `фокус на: body`.

        Рамку фокусу малює правило `:focus-visible` у `styles.css`: браузер показує її, коли фокус перевели з клавіатури.
      en: |
        An effect in `App.jsx` prints to the **Console** where the focus is after every change of the list. Press **Run**, click an empty spot above the heading on the **Page**, and from then on leave the mouse alone:

        1. Tab to the “New task” field, type a title and press Enter — the task is added, focus stays in the empty field.
        2. Tab to the checkbox of any task and press Space — the checkbox changes, focus stays on it.
        3. Tab to “Delete Return library books” and press Enter. The console: `focus is on: body`.

        The focus ring is drawn by the `:focus-visible` rule in `styles.css`: the browser shows it when focus was moved with the keyboard.
    tryIt:
      uk: |
        Зроби так, щоб після видалення фокус ставав на «Видалити» наступної справи, а коли її немає — попередньої, а коли справ не лишилося — на заголовку. На початку функції `remove`, перед `setTasks`, додай чотири рядки коду:

        ```jsx
        const index = tasks.findIndex((task) => task.id === id);
        const removeButtons = listRef.current.querySelectorAll("li > button");
        const target = removeButtons[index + 1] ?? removeButtons[index - 1] ?? headingRef.current;
        target.focus();
        ```

        Кнопки сусідніх справ і заголовок уже є в DOM, тож фокусувати їх можна прямо в обробнику, ще до commit. Запусти й видали з клавіатури всі справи, тиснучи лише Enter: консоль показує по черзі кнопки сусідніх справ, а в кінці — `h2 “Справи”`.
      en: |
        Make focus land on “Delete” of the next task after a delete, on the previous one when there is no next, and on the heading when no tasks are left. Add four lines of code at the start of the `remove` function, before `setTasks`:

        ```jsx
        const index = tasks.findIndex((task) => task.id === id);
        const removeButtons = listRef.current.querySelectorAll("li > button");
        const target = removeButtons[index + 1] ?? removeButtons[index - 1] ?? headingRef.current;
        target.focus();
        ```

        The neighbours’ buttons and the heading are already in the DOM, so they can be focused right in the handler, before the commit. Run it and delete every task from the keyboard, pressing only Enter: the console shows the neighbours’ buttons one by one, and at the end `h2 “Tasks”`.

  - id: escape-closes
    kind: explanation
    title:
      uk: "Escape — це твій обробник"
      en: "Escape is your handler"
    body:
      uk: |
        Enter у полі форми браузер перетворює на надсилання форми — це ти вже використовуєш. А от Escape браузер ні на що не перетворює: для поля це просто натискання клавіші. Якщо редактор має закриватися на Escape, обробник пишеш ти — через `onKeyDown` і властивість `event.key`:

        ```jsx
        <input onKeyDown={(event) => {
          if (event.key === "ArrowDown") moveToNextField();
        }} />
        ```

        `event.key` — назва клавіші: `"Enter"`, `"Escape"`, `"ArrowDown"`, `" "` для пробілу. Перевіряй лише ту клавішу, що тобі потрібна, а решту пропускай: інакше поле перестане приймати звичайні літери.
      en: |
        The browser turns Enter in a form field into submitting the form — you already use that. Escape, however, the browser turns into nothing: for a field it is just a key press. If the editor should close on Escape, you write the handler — with `onKeyDown` and the `event.key` property:

        ```jsx
        <input onKeyDown={(event) => {
          if (event.key === "ArrowDown") moveToNextField();
        }} />
        ```

        `event.key` is the key’s name: `"Enter"`, `"Escape"`, `"ArrowDown"`, `" "` for the space bar. Check only the key you need and let the rest through: otherwise the field stops accepting ordinary letters.

  - id: predict-escape
    kind: prediction
    prompt:
      uk: "Фокус у полі вбудованого редактора. Користувач тисне Escape, і обробник викликає лише `setEditing(false)`: замість поля знову з’являються назва й кнопка «Змінити». Де фокус після оновлення?"
      en: "Focus is in the field of an inline editor. The user presses Escape, and the handler only calls `setEditing(false)`: the field is replaced by the name and the “Edit” button again. Where is the focus after the update?"
    answer:
      type: choice
      options:
        - id: body
          text:
            uk: "На `body`: поле, що мало фокус, прибрано з DOM"
            en: "On `body`: the field that had focus was removed from the DOM"
        - id: edit
          text:
            uk: "На «Змінити»: браузер повертає фокус туди, звідки відкрили редактор"
            en: "On “Edit”: the browser returns focus to where the editor was opened from"
          why:
            uk: "Браузер не пам’ятає, звідки прийшов фокус. «Змінити» — це новий елемент, який React вставив після commit; сам він фокусу не отримує."
            en: "The browser does not remember where focus came from. “Edit” is a new element React inserted after the commit; it does not get focus by itself."
        - id: field
          text:
            uk: "Лишається в полі: Escape лише скасовує зміни"
            en: "It stays in the field: Escape only discards the changes"
          why:
            uk: "Поле зникло разом із режимом редагування. Елемент поза документом фокус тримати не може."
            en: "The field disappeared together with editing mode. An element outside the document cannot hold focus."
      correct: [body]
    explanation:
      uk: "Перевірено справжніми натисканнями в Chrome 154: після Escape `document.activeElement` — це `body`. Наступний Tab у Chrome випадково привів назад на «Змінити», бо Chrome продовжує з місця прибраного поля, — але між цими натисканнями фокусу не мав жоден елемент, і програма читання з екрана нічого не оголосила. Повертати фокус на «Змінити» має твій код."
      en: "Checked with real key presses in Chrome 154: after Escape, `document.activeElement` is `body`. The next Tab in Chrome happened to lead back to “Edit”, because Chrome continues from the removed field’s place — but in between no element had focus, and a screen reader announced nothing. Returning focus to “Edit” is your code’s job."

  - id: keyboard-rename
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: keyboard-rename
    entry: main.jsx
    editable: [App.jsx]
    strings:
      heading: { uk: "Мої звички", en: "My habits" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      typed: { uk: "Вечірня прогулянка", en: "Evening walk" }
      rename: { uk: "Перейменувати", en: "Rename" }
      newName: { uk: "Нова назва", en: "New name" }
      save: { uk: "Зберегти", en: "Save" }
      cancel: { uk: "Скасувати", en: "Cancel" }
    title:
      uk: "Перейменування звички лише з клавіатури"
      en: "Renaming a habit with the keyboard only"
    instructions:
      uk: |
        У списку звичок «Перейменувати» працює лише мишею: це `<span>` з `onClick`. Редактор уже відкривається з фокусом у полі (атрибут `autoFocus`) і зберігає назву через надсилання форми.

        Допиши `HabitRow` так, щоб:

        - «Перейменувати» була справжньою кнопкою: Tab до неї доходить, Enter відкриває редактор;
        - Escape у полі «Нова назва» закривав редактор **без** збереження;
        - після збереження (Enter у полі) чи скасування (Escape або кнопка «Скасувати») фокус повертався на «Перейменувати» того самого рядка — через ref;
        - під час першого показу сторінки фокус не ставав нікуди.

        Запусти й пройди всі чотири пункти на **Сторінці** без миші, перш ніж натиснути **Перевірити**.
      en: |
        In the habit list, “Rename” works only with a mouse: it is a `<span>` with `onClick`. The editor already opens with focus in the field (the `autoFocus` attribute) and saves the name by submitting the form.

        Finish `HabitRow` so that:

        - “Rename” is a real button: Tab reaches it, Enter opens the editor;
        - Escape in the “New name” field closes the editor **without** saving;
        - after saving (Enter in the field) or canceling (Escape or the “Cancel” button) focus returns to “Rename” of the same row — through a ref;
        - on the page’s first display focus goes nowhere.

        Run it and go through all four points on the **Page** without the mouse before you press **Check**.
    testTitles:
      "nothing is focused on first display":
        uk: "Під час першого показу фокус нікуди не ставиться"
        en: "Nothing is focused on first display"
      "Rename is a real button":
        uk: "«Перейменувати» — справжня кнопка `<button>`"
        en: "“Rename” is a real `<button>`"
      "Enter on Rename opens the editor with focus in the name field":
        uk: "Enter на «Перейменувати» відкриває редактор із фокусом у полі назви"
        en: "Enter on “Rename” opens the editor with focus in the name field"
      "Escape cancels without saving and returns focus to Rename":
        uk: "Escape скасовує без збереження й повертає фокус на «Перейменувати»"
        en: "Escape cancels without saving and returns focus to “Rename”"
      "Enter in the field saves and returns focus to Rename":
        uk: "Enter у полі зберігає й повертає фокус на «Перейменувати»"
        en: "Enter in the field saves and returns focus to “Rename”"
    hints:
      nudge:
        uk: "Пройди сторінку сам: Tab, Enter, Escape. Де фокус зупиняється, де Enter нічого не робить і куди фокус дівається, коли редактор закривається?"
        en: "Go through the page yourself: Tab, Enter, Escape. Where does focus stop, where does Enter do nothing, and where does focus go when the editor closes?"
      explanation:
        uk: |
          Три окремі виправлення:

          - Елемент дії — `<button type="button">`. Клас `link` лишає йому вигляд посилання, а рамку фокусу дає `:focus-visible`.
          - Escape ловить `onKeyDown` поля (або форми, бо подія спливає): перевір `event.key` і викличи те саме, що робить «Скасувати».
          - Кнопки «Перейменувати» немає в DOM, поки відкрито редактор, тож фокус повертають після commit — в ефекті з залежністю від режиму, з позначкою в ref, щоб нічого не фокусувати під час першого показу. Схожа ситуація з іншим елементом: панель фільтрів закривається, і фокус має повернутися на кнопку «Фільтри», — ефект із `[filtersOpen]` перевіряє, чи панель була відкрита на попередньому commit.
        en: |
          Three separate fixes:

          - An action element is a `<button type="button">`. The `link` class keeps its link look, and `:focus-visible` gives it the focus ring.
          - Escape is caught by the field’s `onKeyDown` (or the form’s, because the event bubbles): check `event.key` and call the same thing “Cancel” does.
          - The “Rename” button is not in the DOM while the editor is open, so focus is returned after the commit — in an effect that depends on the mode, with a flag in a ref so nothing is focused on the first display. A similar situation with a different element: a filter panel closes and focus has to return to the “Filters” button — an effect with `[filtersOpen]` checks whether the panel was open on the previous commit.
    solutionNote:
      uk: "`<button>` дає фокус, Enter і Space без жодного рядка обробки клавіш. Escape браузер ні на що не перетворює, тому його ловить `onKeyDown` і викликає те саме закриття, що й «Скасувати», — нічого не зберігаючи. Фокус повертає ефект після commit, бо до commit кнопки «Перейменувати» ще немає; ref `wasEditing` пам’ятає попередній режим, тож на першому показі ефект нічого не фокусує. Інший робочий варіант — позначка «повернути фокус» у ref, яку ставить кожен спосіб закриття."
      en: "A `<button>` gives focus, Enter and Space without a single line of key handling. The browser turns Escape into nothing, so `onKeyDown` catches it and calls the same closing as “Cancel” — saving nothing. An effect returns focus after the commit, because before the commit the “Rename” button does not exist yet; the `wasEditing` ref remembers the previous mode, so the effect focuses nothing on the first display. Another working way is a “return focus” flag in a ref that every way of closing sets."
    feedback:
      - when: { test: "nothing is focused on first display" }
        message:
          uk: "Ця перевірка показує список і очікує, що фокус не стоїть на жодному його елементі. Ефект запускається й після першого показу, тож повертати фокус треба лише тоді, коли редактор перед цим був відкритий."
          en: "This check shows the list and expects focus on none of its elements. An effect also runs after the first display, so focus may be returned only when the editor was open before."
      - when: { test: "Rename is a real button" }
        message:
          uk: "Ця перевірка шукає в рядку елемент із текстом «Перейменувати» й очікує тег `BUTTON`. `span` чи `div` з `role=\"button\"` і `tabIndex` виглядає як кнопка, але Enter і Space його не натискають."
          en: "This check looks in the row for the element with the text “Rename” and expects the tag `BUTTON`. A `span` or a `div` with `role=\"button\"` and `tabIndex` looks like a button, but Enter and Space do not press it."
      - when: { test: "Enter on Rename opens the editor with focus in the name field" }
        message:
          uk: "Ця перевірка ставить фокус на «Перейменувати» другого рядка, тисне Enter і очікує поле «Нова назва» з фокусом і значенням «Читати 20 хвилин». Enter натискає лише справжню кнопку."
          en: "This check puts focus on “Rename” of the second row, presses Enter and expects the “New name” field with focus and the value “Read for 20 minutes”. Enter presses only a real button."
      - when: { test: "Escape cancels without saving and returns focus to Rename" }
        message:
          uk: "Ця перевірка відкриває редактор другого рядка, вводить «Вечірня прогулянка» й тисне Escape у полі. Вона очікує, що поле зникло, у рядку лишилася стара назва, а фокус — на «Перейменувати» цього рядка."
          en: "This check opens the editor of the second row, types “Evening walk” and presses Escape in the field. It expects the field to be gone, the old name to stay in the row, and focus on “Rename” of that row."
      - when: { test: "Enter in the field saves and returns focus to Rename" }
        message:
          uk: "Ця перевірка в третьому рядку вводить «Вечірня прогулянка» й тисне Enter у полі. Вона очікує нову назву в рядку й фокус на його «Перейменувати»."
          en: "This check, in the third row, types “Evening walk” and presses Enter in the field. It expects the new name in the row and focus on its “Rename”."
      - when: { error: TypeError }
        message:
          uk: "`Cannot read properties of null (reading 'focus')` означає, що `focus()` викликано, коли в ref ще немає вузла: кнопка «Перейменувати» з’являється лише після commit. Перенеси виклик в ефект."
          en: "`Cannot read properties of null (reading 'focus')` means `focus()` was called while the ref held no node: the “Rename” button appears only after the commit. Move the call into an effect."

  - id: to-project
    kind: transfer
    capstoneStep: RE-07
    body:
      uk: "У кроці проєкту цього розділу ти пройдеш усі дії свого застосунку — додати, змінити, позначити, видалити — лише з клавіатури й за таблицею з цього уроку перевіриш, де після кожної стоїть фокус. Кожен `div` чи `span` з `onClick` стане кнопкою."
      en: "In this unit’s project step you will go through every action of your app — add, edit, mark, delete — with the keyboard only and check against this lesson’s table where focus stands after each one. Every `div` or `span` with `onClick` becomes a button."
