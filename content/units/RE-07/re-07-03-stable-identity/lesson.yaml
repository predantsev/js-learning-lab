      water: { uk: "Пити воду", en: "Drink water" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      week: { uk: "Тиждень", en: "Week" }
      month: { uk: "Місяць", en: "Month" }
      year: { uk: "Рік", en: "Year" }
      rebuilt: { uk: "Перемикач періодів перебудовано, періодів:", en: "Period picker rebuilt, periods:" }
      note: { uk: "Нотатка", en: "Note" }
      activeLabel: { uk: "Активних звичок:", en: "Active habits:" }
      pause: { uk: "Пауза:", en: "Pause:" }
      mostDone: { uk: "Найчастіше виконана:", en: "Done most often:" }
    title:
      uk: "Стабільні props для дошки звичок"
      en: "Stable props for a habit board"
    instructions:
      uk: |
        Дошка звичок працює, але кожна літера в полі «Нотатка» перебудовує перемикач періодів (подивись у консоль), а активні звички фільтруються тричі за рендер — у кожній дитині окремо. `habits.js` рахує виклики `activeHabits`, а `PeriodPicker.jsx` — перебудови; ці файли змінювати не можна.

        Зміни `App.jsx` так, щоб:

        - набір нотатки не перебудовував перемикач періодів;
        - `activeHabits` викликалася **один раз** за рендер дошки, а діти отримували вже готовий результат;
        - список, лічильник і «найчастіше виконана» показували те саме, що й зараз, і кнопка «Пауза» далі прибирала звичку зі списку й зменшувала лічильник.

        Перевірка рахує виклики, тож порядок рядків не важливий — важливо, скільки разів і що саме створюється.
      en: |
        The habit board works, but every letter in the “Note” field rebuilds the period picker (look at the console), and the active habits are filtered three times per render — in every child separately. `habits.js` counts the calls of `activeHabits`, and `PeriodPicker.jsx` counts the rebuilds; these files cannot be changed.

        Change `App.jsx` so that:

        - typing a note does not rebuild the period picker;
        - `activeHabits` is called **once** per render of the board, and the children get the ready result;
        - the list, the counter and “done most often” show the same as now, and the “Pause” button still removes a habit from the list and decreases the counter.

        The check counts calls, so the order of the lines does not matter — what matters is how many times and what exactly is created.
    testTitles:
      "the board shows the active habits, their count and the most done one":
        uk: "Дошка показує активні звички, їхню кількість і найчастіше виконану"
        en: "The board shows the active habits, their count and the most done one"
      "typing a note does not rebuild the period picker":
        uk: "Набір нотатки не перебудовує перемикач періодів"
        en: "Typing a note does not rebuild the period picker"
      "active habits are derived once per render":
        uk: "Активні звички обчислюються один раз за рендер"
        en: "Active habits are derived once per render"
      "pausing a habit updates the list and the count":
        uk: "«Пауза» оновлює список і лічильник"
        en: "“Pause” updates the list and the count"
    hints:
      nudge:
        uk: "Ефект у `PeriodPicker` залежить від `[periods]`. Що отримує `periods` на кожному рендері дошки — той самий масив чи новий? А скільки компонентів самі викликають `activeHabits`?"
        en: "The effect in `PeriodPicker` depends on `[periods]`. What does `periods` get on every render of the board — the same array or a new one? And how many components call `activeHabits` themselves?"
      explanation:
        uk: "Значення, яке ніколи не змінюється, створюють один раз — на рівні модуля, поза функцією компонента; тоді кожен рендер передає те саме посилання. Похідне значення зі стану обчислюють у власника стану один раз за рендер і передають дітям як prop — як у прикладі з довідником категорій витрат: `const CATEGORIES = [...]` над компонентом, а `const visibleExpenses = filterByCategory(expenses, category)` один раз у сторінці, звідки воно йде і в таблицю, і в підсумок. Не виносити на рівень модуля те, що залежить від стану: такий результат обчислиться один раз і більше ніколи не оновиться."
        en: "A value that never changes is created once — at module level, outside the component function; then every render passes the same reference. A value derived from state is computed in the state’s owner once per render and passed to the children as a prop — as in an example with an expense category list: `const CATEGORIES = [...]` above the component, and `const visibleExpenses = filterByCategory(expenses, category)` once in the page, from where it goes to both the table and the summary. Do not move to module level what depends on state: such a result is computed once and never updates again."
    solutionNote:
      uk: "`PERIODS` створено один раз, коли завантажився модуль, тож `Object.is` у залежностях ефекту між рендерами дає `true`, і перемикач не перебудовується. `active` обчислюється в `HabitBoard` один раз за рендер і йде в усіх трьох дітей тим самим масивом. Він новий на кожному рендері — і це правильно: після «Паузи» дані справді інші. Обчислити його на рівні модуля не можна: тоді він ніколи б не дізнався про паузу."
      en: "`PERIODS` is created once, when the module loads, so `Object.is` on the effect’s dependencies gives `true` between renders, and the picker is not rebuilt. `active` is computed in `HabitBoard` once per render and goes to all three children as the same array. It is new on every render — and that is right: after “Pause” the data really is different. It cannot be computed at module level: then it would never learn about the pause."
    feedback:
      - when: { test: "the board shows the active habits, their count and the most done one" }
        message:
          uk: "Ця перевірка очікує в списку п’ять активних звичок у початковому порядку, текст «Активних звичок: 5» і «Найчастіше виконана: Ранкова зарядка». Якщо діти отримують уже відфільтрований масив, їм більше не треба фільтрувати його самим."
          en: "This check expects five active habits in the list in their original order, the text “Active habits: 5” and “Done most often: Morning exercise”. If the children get an already filtered array, they no longer need to filter it themselves."
      - when: { test: "typing a note does not rebuild the period picker" }
        message:
          uk: "Ця перевірка набирає дві літери в полі «Нотатка» й очікує нуль нових перебудов перемикача. Ефект `PeriodPicker` запускається щоразу, коли `periods` — інший об’єкт; масив, створений у тілі компонента, інший на кожному рендері."
          en: "This check types two letters into the “Note” field and expects zero new rebuilds of the picker. The `PeriodPicker` effect runs whenever `periods` is a different object; an array created in the component’s body is different on every render."
      - when: { test: "active habits are derived once per render" }
        message:
          uk: "Ця перевірка набирає одну літеру й очікує рівно один виклик `activeHabits`. Більше одного — фільтрують ще й діти; нуль — результат обчислено поза рендером і він не оновлюватиметься разом зі станом."
          en: "This check types one letter and expects exactly one call of `activeHabits`. More than one means the children filter too; zero means the result was computed outside render and will not update with the state."
      - when: { test: "pausing a habit updates the list and the count" }
        message:
          uk: "Ця перевірка натискає «Пауза» для «Читати 20 хвилин» і очікує чотири звички в списку та «Активних звичок: 4». Похідне значення має обчислюватися зі стану `habits` на кожному рендері."
          en: "This check presses “Pause” for “Read for 20 minutes” and expects four habits in the list and “Active habits: 4”. The derived value must be computed from the `habits` state on every render."

  - id: to-project
    kind: transfer
    capstoneStep: RE-07
    body:
      uk: "У своєму проєкті знайди сталі списки — категорії, пріоритети, варіанти сортування — і перевір, що вони живуть на рівні модуля, а похідні списки й підсумки обчислюються один раз у власника стану. Це перше, що варто зробити, коли запис показує зайві рендери, — ще до спеціальних хуків наступного уроку."
      en: "In your project, find the constant lists — categories, priorities, sort options — and check that they live at module level, while derived lists and totals are computed once in the state’s owner. That is the first thing to do when a recording shows extra renders — before the special hooks of the next lesson."
