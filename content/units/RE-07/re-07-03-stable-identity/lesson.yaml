id: re-07-03-stable-identity
unit: RE-07
title:
  uk: "Стабільна ідентичність"
  en: "Stable identity"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити, чи той самий prop між рендерами за посиланням: вбудовані об’єкти, масиви й функції — нові на кожному рендері."
    en: "Predict whether a prop is the same between renders by reference: inline objects, arrays and functions are new on every render."
  - uk: "Тримати ідентичність стабільною: виносити сталі значення за межі компонента й обчислювати похідні значення один раз — ще до будь-яких спеціальних хуків."
    en: "Keep identity stable by moving constants out of the component or deriving values once, before reaching for special hooks."
prerequisites: [re-07-02-profiling-render-causes, js-04-07-reference-identity]
subskills:
  - { family: R-07, skill: "stable identity", depth: intro }
glossary: [referential-stability]
selfCheck: [predict-same-object, stable-props]

blocks:
  - id: every-render-is-new
    kind: explanation
    title:
      uk: "Кожен рендер створює нові об’єкти"
      en: "Every render creates new objects"
    body:
      uk: |
        Рендер — це виклик функції. Усе, що функція створює всередині, вона створює **заново** при кожному виклику: літерал `{ color: "dimgray" }`, масив `["title", "dueDate"]`, стрілкову функцію `() => setSort(option)`, результат `.filter()` чи `.map()`.

        Порівнюючи значення між рендерами, React дивиться не на вміст, а на [[reference-identity|ідентичність]] — через `Object.is`, тобто так само, як `===` для об’єктів. Ти вже бачив, де він так робить: залежності ефекту (RE-03) і значення context (RE-04). Два масиви з однаковими рядками для нього — **різні** значення, і ефект запуститься знову.

        [[referential-stability|Стабільна ідентичність]] — коли значення між рендерами лишається тим самим об’єктом, доки його зміст справді не змінився.
      en: |
        A render is a function call. Everything the function creates inside, it creates **anew** on every call: the literal `{ color: "dimgray" }`, the array `["title", "dueDate"]`, the arrow function `() => setSort(option)`, the result of `.filter()` or `.map()`.

        When React compares values between renders, it looks not at the contents but at the [[reference-identity|identity]] — through `Object.is`, the same as `===` for objects. You have seen where it does this: effect dependencies (RE-03) and the context value (RE-04). Two arrays with the same strings are **different** values to it, and the effect runs again.

        [[referential-stability|Stable identity]] is when a value stays the same object between renders until its contents really change.

  - id: predict-same-object
    kind: prediction
    prompt:
      uk: "Функція `render` імітує два рендери компонента. Що надрукують два виклики `console.log`?"
      en: "The `render` function imitates two renders of a component. What do the two `console.log` calls print?"
    code: |
      const SORT_OPTIONS = ["name", "streak"];
      const habits = [{ id: "h-01", active: true }, { id: "h-05", active: false }];

      function render() {
        const style = { color: "dimgray" };
        const visible = habits.filter((habit) => habit.active);
        return { style, visible, options: SORT_OPTIONS };
      }

      const first = render();
      const second = render();
      console.log(Object.is(first.style, second.style), Object.is(first.visible, second.visible), Object.is(first.options, second.options));
      console.log(JSON.stringify(first.visible) === JSON.stringify(second.visible));
    verify:
      logs: ["false false true", "true"]
    answer:
      type: choice
      options:
        - id: only-constant
          code: "false false true\ntrue"
        - id: all-same
          code: "true true true\ntrue"
          why:
            uk: "Однаковий вміст не робить об’єкт тим самим. Кожен виклик `render` будує новий `style` і новий масив `visible`."
            en: "The same contents do not make an object the same one. Every call of `render` builds a new `style` and a new `visible` array."
        - id: filter-same
          code: "false true true\ntrue"
          why:
            uk: "`.filter()` завжди повертає **новий** масив, навіть якщо елементи в ньому ті самі."
            en: "`.filter()` always returns a **new** array, even when the items in it are the same."
        - id: none-same
          code: "false false false\nfalse"
          why:
            uk: "`SORT_OPTIONS` створено один раз, коли завантажився модуль, — обидва виклики повертають той самий масив. А `JSON.stringify` порівнює вміст, і він однаковий."
            en: "`SORT_OPTIONS` was created once, when the module loaded — both calls return the same array. And `JSON.stringify` compares contents, which are the same."
      correct: [only-constant]
    explanation:
      uk: "Стала на рівні модуля створюється один раз, тож обидва «рендери» отримують той самий масив: `true`. Літерал `style` і результат `.filter()` — нові при кожному виклику: `false`, хоча за вмістом вони однакові, що й показує другий рядок. Для React перші два значення **змінилися**."
      en: "A module-level constant is created once, so both “renders” get the same array: `true`. The `style` literal and the result of `.filter()` are new on every call: `false`, although their contents are equal, as the second line shows. To React the first two values **changed**."

  - id: two-renders
    kind: visual
    visual: memory-graph
    title:
      uk: "Два рендери поруч"
      en: "Two renders side by side"
    textEquivalent:
      uk: "Рендер 1 створює функцію onSelect_1 і масив visibleTasks_1, у якому лежить посилання на ту саму справу t-01, що й у масиві tasks. SORT_OPTIONS — стала модуля: вона вказує на масив, створений один раз. Рендер 2 створює нову функцію onSelect_2 і новий масив visibleTasks_2; у новому масиві — посилання на ту саму справу t-01. Порівняння через Object.is: SORT_OPTIONS між рендерами той самий; onSelect_1 і onSelect_2 — різні функції з однаковим кодом; visibleTasks_1 і visibleTasks_2 — різні масиви з тими самими елементами."
      en: "Render 1 creates the function onSelect_1 and the array visibleTasks_1, which holds a reference to the same task t-01 as the tasks array. SORT_OPTIONS is a module constant: it points to an array created once. Render 2 creates a new function onSelect_2 and a new array visibleTasks_2; the new array holds a reference to the same task t-01. Comparing with Object.is: SORT_OPTIONS is the same between renders; onSelect_1 and onSelect_2 are different functions with the same code; visibleTasks_1 and visibleTasks_2 are different arrays with the same items."
    spec:
      code: |
        const SORT_OPTIONS = ["title", "dueDate"];

        function TaskBoard({ tasks }) {
          const [sort, setSort] = useState("title");
          const onSelect = (option) => setSort(option);
          const visibleTasks = tasks.filter((task) => !task.done);
          // …
        }
      states:
        - caption:
            uk: "Рендер 1. `onSelect_1` і `visibleTasks_1` — те, що створив перший виклик `TaskBoard`. `SORT_OPTIONS` створено ще під час завантаження модуля."
            en: "Render 1. `onSelect_1` and `visibleTasks_1` are what the first call of `TaskBoard` created. `SORT_OPTIONS` was created when the module loaded."
          line: 6
          bindings:
            - { name: SORT_OPTIONS, kind: const, value: { ref: options } }
            - { name: tasks, kind: param, value: { ref: all } }
            - { name: onSelect_1, kind: const, value: { ref: fn1 } }
            - { name: visibleTasks_1, kind: const, value: { ref: visible1 } }
          heap:
            options: { kind: array, items: ["title", "dueDate"] }
            all: { kind: array, items: [{ ref: t1 }, { ref: t4 }] }
            t1: { kind: object, props: { id: "t-01", done: false } }
            t4: { kind: object, props: { id: "t-04", done: true } }
            fn1: { kind: function, name: onSelect }
            visible1: { kind: array, items: [{ ref: t1 }] }
        - caption:
            uk: "Рендер 2 — той самий код, ті самі дані. Але він створює **нову** функцію `onSelect_2` і **новий** масив `visibleTasks_2`. React пам’ятає значення з попереднього рендеру, тож обидві пари живуть у пам’яті одночасно."
            en: "Render 2 — the same code, the same data. But it creates a **new** function `onSelect_2` and a **new** array `visibleTasks_2`. React remembers the values from the previous render, so both pairs live in memory at once."
          line: 6
          bindings:
            - { name: SORT_OPTIONS, kind: const, value: { ref: options } }
            - { name: tasks, kind: param, value: { ref: all } }
            - { name: onSelect_1, kind: const, value: { ref: fn1 } }
            - { name: visibleTasks_1, kind: const, value: { ref: visible1 } }
            - { name: onSelect_2, kind: const, value: { ref: fn2 } }
            - { name: visibleTasks_2, kind: const, value: { ref: visible2 } }
          heap:
            options: { kind: array, items: ["title", "dueDate"] }
            all: { kind: array, items: [{ ref: t1 }, { ref: t4 }] }
            t1: { kind: object, props: { id: "t-01", done: false } }
            t4: { kind: object, props: { id: "t-04", done: true } }
            fn1: { kind: function, name: onSelect }
            visible1: { kind: array, items: [{ ref: t1 }] }
            fn2: { kind: function, name: onSelect }
            visible2: { kind: array, items: [{ ref: t1 }] }
          changed: [onSelect_2, visibleTasks_2, fn2, visible2]
        - caption:
            uk: "`Object.is` між рендерами: `SORT_OPTIONS` — одна стрілка, той самий масив, `true`. `onSelect` — дві різні функції, `false`. `visibleTasks` — два різні масиви, `false`, хоча справа `t-01` в обох та сама: `.filter()` копіює посилання, а не об’єкти."
            en: "`Object.is` between renders: `SORT_OPTIONS` — one arrow, the same array, `true`. `onSelect` — two different functions, `false`. `visibleTasks` — two different arrays, `false`, although task `t-01` is the same in both: `.filter()` copies references, not objects."
          line: 1
          bindings:
            - { name: SORT_OPTIONS, kind: const, value: { ref: options } }
            - { name: tasks, kind: param, value: { ref: all } }
            - { name: onSelect_1, kind: const, value: { ref: fn1 } }
            - { name: visibleTasks_1, kind: const, value: { ref: visible1 } }
            - { name: onSelect_2, kind: const, value: { ref: fn2 } }
            - { name: visibleTasks_2, kind: const, value: { ref: visible2 } }
          heap:
            options: { kind: array, items: ["title", "dueDate"] }
            all: { kind: array, items: [{ ref: t1 }, { ref: t4 }] }
            t1: { kind: object, props: { id: "t-01", done: false } }
            t4: { kind: object, props: { id: "t-04", done: true } }
            fn1: { kind: function, name: onSelect }
            visible1: { kind: array, items: [{ ref: t1 }] }
            fn2: { kind: function, name: onSelect }
            visible2: { kind: array, items: [{ ref: t1 }] }
          changed: []

  - id: recall-identity
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: filter-copies-references
        from: js-04-08-copying-shallow-deep
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const habits = [{ id: "h-01" }, { id: "h-02" }];
          const copy = habits.filter(() => true);
          console.log(copy === habits, copy[0] === habits[0]);
        verify:
          logs: ["false true"]
        answer:
          type: choice
          options:
            - { id: new-shared, code: "false true" }
            - id: same-same
              code: "true true"
              why:
                uk: "`filter` завжди повертає новий масив, навіть коли залишає всі елементи."
                en: "`filter` always returns a new array, even when it keeps every item."
            - id: new-new
              code: "false false"
              why:
                uk: "Новий масив — це неглибока копія: у ньому посилання на ті самі об’єкти, а не їхні копії."
                en: "The new array is a shallow copy: it holds references to the same objects, not copies of them."
          correct: [new-shared]
        explanation:
          uk: "Як і spread, `filter` робить неглибоку копію: масив новий, елементи ті самі. Тому порівняння масиву між рендерами дає `false`, а порівняння окремого запису — `true`."
          en: "Like spread, `filter` makes a shallow copy: the array is new, the items are the same. That is why comparing the array between renders gives `false`, while comparing a single record gives `true`."
      - id: key-purpose
        from: re-01-05-keys-identity
        prompt:
          uk: "Для чого React використовує `key` елемента списку?"
          en: "What does React use a list item’s `key` for?"
        answer:
          type: choice
          options:
            - id: match
              text:
                uk: "Щоб зіставити елемент із елементом попереднього рендеру й зберегти його стан і DOM-вузол"
                en: "To match the item with the item of the previous render and keep its state and DOM node"
            - id: skip
              text:
                uk: "Щоб не рендерити елемент, якщо `key` не змінився"
                en: "To skip rendering the item when its `key` did not change"
              why:
                uk: "`key` нічого не пропускає: елемент із тим самим ключем рендериться знову, коли рендериться батько. Ключ лише каже, **який** це елемент."
                en: "A `key` skips nothing: an item with the same key renders again when the parent renders. The key only says **which** item it is."
          correct: [match]
        explanation:
          uk: "Ключ — це ідентичність **елемента** в списку, а не його props. Стабільний `key` зберігає стан рядка, але не робить стабільними об’єкти, які ти передаєш у цей рядок."
          en: "A key is the identity of the **item** in the list, not of its props. A stable `key` keeps the row’s state, but it does not make the objects you pass into that row stable."

  - id: predict-key-not-props
    kind: prediction
    prompt:
      uk: "Сторінка звичок рендериться знову, бо змінився її власний стан, а звички й серії ті самі. Скільки разів після цього рендеру спрацює ефект у `HabitCard` для двох карток?"
      en: "A habit page renders again because its own state changed, while the habits and streaks are the same. How many times does the effect in `HabitCard` run for two cards after this render?"
    code: |
      function HabitCard({ habit }) {
        useEffect(() => {
          console.log(`effect ${habit.id}`);
        }, [habit]);
        return <li>{habit.name}</li>;
      }

      // in the page:
      {habits.map((habit) => (
        <HabitCard key={habit.id} habit={{ ...habit, streak: streaks[habit.id] }} />
      ))}
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: twice
          text:
            uk: "Двічі — по разу для кожної картки"
            en: "Twice — once for each card"
        - id: never
          text:
            uk: "Жодного разу: `key` той самий, тож і `habit` той самий"
            en: "Never: the `key` is the same, so `habit` is the same too"
          why:
            uk: "`key` каже, що це та сама картка. А `{ ...habit, streak }` — новий об’єкт, створений на цьому рендері, тож залежність ефекту змінилася."
            en: "The `key` says it is the same card. But `{ ...habit, streak }` is a new object created on this render, so the effect’s dependency changed."
        - id: once
          text:
            uk: "Один раз — для першої картки"
            en: "Once — for the first card"
          why:
            uk: "Обидві картки отримують нові об’єкти: spread створює новий для кожного виклику `map`."
            en: "Both cards get new objects: the spread creates a new one on every call of `map`."
      correct: [twice]
    explanation:
      uk: "Перевірено в пісочниці з React 19.3: після одного рендеру сторінки консоль друкує `effect h-01` і `effect h-02`. Ключ стабільний, але props — ні. Виправлення — передати те, що вже стабільне: `habit={habit}` і окремо число `streak={streaks[habit.id]}`, а ефект залежатиме від того, що він справді читає."
      en: "Checked in the sandbox with React 19.3: after one render of the page the console prints `effect h-01` and `effect h-02`. The key is stable, but the props are not. The fix is to pass what is already stable: `habit={habit}` and the number separately, `streak={streaks[habit.id]}`, with the effect depending on what it really reads."

  - id: identity-log
    kind: example
    runtime: browser-react
    dir: identity-log
    entry: main.jsx
    strings:
      same: { uk: "той самий", en: "same" }
      fresh: { uk: "новий", en: "new" }
      note: { uk: "Нотатка", en: "Note" }
      sortBy: { uk: "Сортувати за:", en: "Sort by:" }
      water: { uk: "Полити квіти", en: "Water the plants" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
    title:
      uk: "Хто той самий, а хто новий"
      en: "Who is the same and who is new"
    body:
      uk: |
        `identity.js` після кожного commit порівнює значення з попереднім через `Object.is` — тим самим способом, яким React порівнює залежності ефекту. Натисни **Запустити** й набери одну літеру в полі «Нотатка» на **Сторінці**. Консоль:

        ```
        sortOptions: новий
        visibleTasks: новий
        onSelect: новий
        ```

        Змінилася лише нотатка, а всі три значення для React — нові.
      en: |
        After every commit, `identity.js` compares a value with the previous one through `Object.is` — the same way React compares effect dependencies. Press **Run** and type one letter into the “Note” field on the **Page**. The console:

        ```
        sortOptions: new
        visibleTasks: new
        onSelect: new
        ```

        Only the note changed, yet all three values are new to React.
    tryIt:
      uk: |
        1. Варіанти сортування ніколи не змінюються. Перенеси рядок `const sortOptions = ["title", "dueDate"];` над `const TASKS`, назви сталу `SORT_OPTIONS` і заміни `sortOptions` на `SORT_OPTIONS` у двох місцях компонента. Запусти й набери літеру: `sortOptions: той самий`.
        2. `setSort` React створює один раз — сеттер стабільний сам. Заміни `useIdentityLog("onSelect", onSelect)` на `useIdentityLog("setSort", setSort)` і набери літеру: `setSort: той самий`. Обгортка `(option) => setSort(option)` не додає нічого, крім нової функції на кожному рендері.
        3. `visibleTasks` лишається новим. У справжньому застосунку справи живуть у стані й змінюються, тож фільтрують їх на кожному рендері. Головне — робити це **один раз** у власника й передавати результат далі, а не фільтрувати в кожній дитині окремо.
      en: |
        1. The sort options never change. Move the line `const sortOptions = ["title", "dueDate"];` above `const TASKS`, name the constant `SORT_OPTIONS` and replace `sortOptions` with `SORT_OPTIONS` in the two places inside the component. Run and type a letter: `sortOptions: same`.
        2. React creates `setSort` once — a setter is stable by itself. Replace `useIdentityLog("onSelect", onSelect)` with `useIdentityLog("setSort", setSort)` and type a letter: `setSort: same`. The wrapper `(option) => setSort(option)` adds nothing but a new function on every render.
        3. `visibleTasks` stays new. In a real app the tasks live in state and change, so they are filtered on every render. What matters is doing it **once** in the owner and passing the result down, not filtering in every child separately.

  - id: stable-props
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: stable-props
    entry: main.jsx
    editable: [App.jsx]
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
