id: re-07-07-independent-measured-optimization
unit: RE-07
title:
  uk: "Самостійно: виміряна оптимізація, що зберігає доступність"
  en: "Independent: measured optimization that keeps accessibility"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Перевірка без підказок: чи вмієш ти в незнайомому застосунку знайти вимірюванням, а не здогадкою, одне вузьке місце, усунути його найменшою виправданою зміною, довести виграш числами — і водночас зробити видалення керованим із клавіатури, не зламавши жодної дії."
  en: "A check without hints: can you, in an unfamiliar app, find one bottleneck by measuring rather than guessing, remove it with the smallest justified change, prove the gain with numbers — and at the same time make deleting keyboard-operable without breaking a single action?"
objectives:
  - uk: "Без підказок знайти виміряне вузьке місце в незнайомому застосунку зі списком, виправити його найменшою виправданою зміною й показати, що перевірки поведінки й клавіатури проходять."
    en: "Locate, without hints, a measured bottleneck in an unseen list app, fix it with the smallest justified change and show that behavior and keyboard checks still pass."
prerequisites: [re-07-06-debug-unnecessary-renders]
subskills:
  - { family: R-07, skill: "memo/useMemo/useCallback when measured", depth: assess }
  - { family: R-07, skill: "list/windowing awareness", depth: assess }
  - { family: R-07, skill: "accessibility during optimization", depth: assess }
glossary: []
selfCheck: [expense-book]

blocks:
  - id: brief
    kind: explanation
    title:
      uk: "Що буде перевірено"
      en: "What will be checked"
    body:
      uk: |
        У вправі нижче — книга витрат на 30 000 синтетичних записів: підсумок, форма додавання, пошук і таблиця, що показує перші 100 збігів. Набір у полі пошуку помітно гальмує, а видалити витрату можна лише мишею.

        Ти розберешся сам: виміряєш, знайдеш одну причину, виправиш її найменшою зміною, яку можеш обґрунтувати числами, і зробиш видалення керованим із клавіатури. Підказок немає. Перевірки приховані, але кожну з них описано в завданні.
      en: |
        The exercise below is an expense book with 30,000 synthetic records: a summary, an add form, a search and a table that shows the first 100 matches. Typing in the search field visibly lags, and an expense can be deleted only with a mouse.

        You will sort it out yourself: measure, find one cause, fix it with the smallest change you can justify with numbers, and make deleting keyboard-operable. There are no hints. The checks are hidden, but each of them is described in the task.

  - id: recall-counts
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: counts-vs-timings
        from: js-17-02-big-o-measured
        prompt:
          uk: "Ти виміряв фільтр на 100 записах: 0,1 мс. Що найнадійніше скаже, чи він стане проблемою на 30 000?"
          en: "You measured a filter on 100 records: 0.1 ms. What tells you most reliably whether it becomes a problem at 30,000?"
        answer:
          type: choice
          options:
            - id: measure-large
              text:
                uk: "Виміряти на 30 000 синтетичних записів, кілька разів, і порівняти з тим, як росте кількість операцій"
                en: "Measure at 30,000 synthetic records, several times, and compare with how the operation count grows"
            - id: extrapolate
              text:
                uk: "Помножити 0,1 мс на 300 — і цього досить"
                en: "Multiply 0.1 ms by 300 — that is enough"
              why:
                uk: "На малих розмірах час спотворюють прогрів і сталі витрати, а вкладені цикли ростуть не лінійно. Пряме множення може помилитися в будь-який бік."
                en: "At small sizes timings are distorted by warm-up and constant costs, and nested loops do not grow linearly. Plain multiplication can be wrong either way."
          correct: [measure-large]
        explanation:
          uk: "Підрахунок операцій каже, як робота росте, а вимірювання на реалістичному розмірі — скільки вона коштує насправді. Тому в цій вправі записи вже синтетично розмножено до 30 000."
          en: "Counting operations tells you how the work grows, and measuring at a realistic size tells you what it really costs. That is why the records in this exercise are already multiplied synthetically to 30,000."

  - id: expense-book
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-react
    dir: expense-book
    entry: main.jsx
    editable: [App.jsx, evidence.js]
    strings:
      heading: { uk: "Книга витрат", en: "Expense book" }
      summary: { uk: "Підсумок", en: "Summary" }
      count: { uk: "Записів:", en: "Records:" }
      overall: { uk: "разом", en: "total" }
      currency: { uk: "грн", en: "UAH" }
      food: { uk: "Їжа", en: "Food" }
      transport: { uk: "Транспорт", en: "Transport" }
      home: { uk: "Дім", en: "Home" }
      fun: { uk: "Розваги", en: "Fun" }
      labelField: { uk: "Опис", en: "Label" }
      amountField: { uk: "Сума", en: "Amount" }
      categoryField: { uk: "Категорія", en: "Category" }
      add: { uk: "Додати", en: "Add" }
      search: { uk: "Пошук", en: "Search" }
      showing: { uk: "Показано:", en: "Showing:" }
      remove: { uk: "Видалити", en: "Delete" }
      typed: { uk: "Ремонт велосипеда", en: "Bicycle repair" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      lunch: { uk: "Обід", en: "Lunch" }
    title:
      uk: "Книга витрат: швидко й з клавіатури"
      en: "The expense book: fast and by keyboard"
    instructions:
      uk: |
        Книга витрат працює, але набір у полі «Пошук» гальмує, а «Видалити» реагує лише на мишу. `expenses.js` (дані й функція підсумку, що рахує свої виклики) змінювати не можна.

        1. **Виміряй.** Запиши набір літери в полі «Пошук» — консоллю й на панелі Performance. Знайди компонент, чий рендер займає найбільше часу, і причину, чому він рендериться під час набору.
        2. **Виправ одну причину** найменшою зміною, яку можеш обґрунтувати записом. Сторінка вже показує лише перші 100 збігів, тож думай, чи потрібно тут щось більше.
        3. **Зроби видалення керованим із клавіатури.** «Видалити» — справжня кнопка. Після видалення фокус стає на «Видалити» наступного рядка; якщо його немає — попереднього; якщо в таблиці не лишилося рядків — на заголовку «Книга витрат».
        4. **Запиши докази** в `evidence.js`: `records` — скільки витрат у книзі; `slowest` — назва найповільнішого компонента; `beforeMs` і `afterMs` — час рендеру однієї літери до й після; `change` — що ти змінив, кількома словами.

        Що перевіряється:

        - пошук фільтрує таблицю: показано 100 рядків, у кожного опис містить запит, а рядок «Показано:» каже `100 / ` і кількість усіх збігів;
        - набір у полі «Пошук» не викликає `summarizeExpenses` жодного разу;
        - додана витрата (Enter у полі «Сума») з’являється першим рядком, і підсумок показує на один запис більше;
        - «Видалити» — `<button>`; Enter на ньому прибирає рядок, підсумок показує на один запис менше, а фокус стає так, як описано в кроці 3 — для рядка в середині таблиці, для останнього з кількох показаних рядків і для єдиного показаного рядка;
        - у `evidence.js` правильні `records` і `slowest`, обидва числа більші за нуль, `afterMs` менше за `beforeMs`, а `change` не порожній.
      en: |
        The expense book works, but typing in the “Search” field lags, and “Delete” reacts only to the mouse. `expenses.js` (the data and the summary function, which counts its calls) cannot be changed.

        1. **Measure.** Record typing a letter in the “Search” field — with the console and in the Performance panel. Find the component whose render takes the most time and the reason it renders while you type.
        2. **Fix one cause** with the smallest change you can justify with a recording. The page already shows only the first 100 matches, so think about whether anything more is needed here.
        3. **Make deleting keyboard-operable.** “Delete” is a real button. After a delete, focus lands on “Delete” of the next row; if there is none, of the previous one; if no rows are left in the table, on the “Expense book” heading.
        4. **Write down the evidence** in `evidence.js`: `records` — how many expenses the book holds; `slowest` — the name of the slowest component; `beforeMs` and `afterMs` — the render time of one letter before and after; `change` — what you changed, in a few words.

        What is checked:

        - the search filters the table: 100 rows are shown, each label contains the query, and the “Showing:” line says `100 / ` and the number of all matches;
        - typing in the “Search” field calls `summarizeExpenses` zero times;
        - an added expense (Enter in the “Amount” field) appears as the first row, and the summary shows one record more;
        - “Delete” is a `<button>`; Enter on it removes the row, the summary shows one record fewer, and focus lands as described in step 3 — for a row in the middle of the table, for the last of several shown rows and for the only shown row;
        - `evidence.js` has the right `records` and `slowest`, both numbers are greater than zero, `afterMs` is less than `beforeMs`, and `change` is not empty.
    testTitles:
      "searching filters the table":
        uk: "Пошук фільтрує таблицю"
        en: "Searching filters the table"
      "typing in the search does not recompute the summary":
        uk: "Набір у полі пошуку не перераховує підсумок"
        en: "Typing in the search does not recompute the summary"
      "adding an expense updates the table and the summary":
        uk: "Додавання витрати оновлює таблицю й підсумок"
        en: "Adding an expense updates the table and the summary"
      "Delete is a real button":
        uk: "«Видалити» — справжня кнопка"
        en: "“Delete” is a real button"
      "deleting by keyboard removes the row and moves focus to the next Delete":
        uk: "Видалення з клавіатури прибирає рядок і ставить фокус на наступне «Видалити»"
        en: "Deleting by keyboard removes the row and moves focus to the next “Delete”"
      "deleting the only shown expense moves focus to the heading":
        uk: "Видалення єдиної показаної витрати ставить фокус на заголовок"
        en: "Deleting the only shown expense moves focus to the heading"
      "deleting the last of several shown expenses moves focus to the previous Delete":
        uk: "Видалення останньої з кількох показаних витрат ставить фокус на попереднє «Видалити»"
        en: "Deleting the last of several shown expenses moves focus to the previous “Delete”"
      "the evidence names the measured cause and a gain":
        uk: "Докази називають виміряну причину й виграш"
        en: "The evidence names the measured cause and a gain"
    solutionNote:
      uk: "Запис показує, що під час набору найдовше рендериться `ExpenseSummary`: кожна літера рендерить сторінку, а з нею підсумок, який сортує 30 000 записів, хоча список витрат не змінився. Одна виправдана мемоізація — `useMemo` з залежністю `[expenses]` у підсумку (або `memo` на `ExpenseSummary`, бо його єдиний prop під час набору той самий). Windowing тут не потрібен: таблиця й так показує 100 рядків. Видалення стало `<button>`, а фокус переходить на сусідню кнопку чи заголовок ще в обробнику, поки вони в DOM (інший робочий спосіб — запам’ятати позицію видаленого рядка в ref і поставити фокус в ефекті після commit). Перевірки додавання й видалення доводять, що підсумок не застарів: залежності правильні."
      en: "The recording shows that `ExpenseSummary` renders longest while typing: every letter renders the page, and with it the summary, which sorts 30,000 records although the expense list did not change. One justified memoization — `useMemo` with the dependency `[expenses]` in the summary (or `memo` on `ExpenseSummary`, because its only prop is the same while typing). Windowing is not needed here: the table shows 100 rows anyway. Delete became a `<button>`, and focus moves to the neighbouring button or the heading right in the handler, while they are in the DOM (another working way is to remember the deleted row’s position in a ref and set focus in an effect after the commit). The add and delete checks prove the summary is not stale: the dependencies are right."
    feedback:
      - when: { test: "searching filters the table" }
        message:
          uk: "Ця перевірка вставляє «Квитки в кіно» в поле «Пошук» одразу цілим текстом, як під час вставлення з буфера обміну, і очікує 100 рядків із цим текстом та «Показано: 100 / 5000». Фільтр має лишатися на кожному рендері: від запиту залежить, що показано."
          en: "This check puts “Cinema tickets” into the “Search” field at once, as a paste does, and expects 100 rows with this text and “Showing: 100 / 5000”. The filter must stay on every render: what is shown depends on the query."
      - when: { test: "typing in the search does not recompute the summary" }
        message:
          uk: "Ця перевірка набирає дві літери в полі «Пошук» і очікує нуль викликів `summarizeExpenses`."
          en: "This check types two letters into the “Search” field and expects zero calls of `summarizeExpenses`."
      - when: { test: "adding an expense updates the table and the summary" }
        message:
          uk: "Ця перевірка додає «Ремонт велосипеда» на 120 грн клавішею Enter у полі «Сума» й очікує його першим рядком і «Записів: 30001» у підсумку. Підсумок має перераховуватися, коли змінився список витрат."
          en: "This check adds “Bicycle repair” for 120 UAH with Enter in the “Amount” field and expects it as the first row and “Records: 30001” in the summary. The summary must be recalculated when the expense list changed."
      - when: { test: "Delete is a real button" }
        message:
          uk: "Ця перевірка шукає в першому рядку елемент із текстом «Видалити» й очікує тег `BUTTON`."
          en: "This check looks in the first row for the element with the text “Delete” and expects the tag `BUTTON`."
      - when: { test: "deleting by keyboard removes the row and moves focus to the next Delete" }
        message:
          uk: "Ця перевірка ставить фокус на «Видалити» другого рядка, тисне Enter і очікує, що рядка немає, підсумок показує «Записів: 29999», а фокус — на «Видалити» рядка, що тепер другий."
          en: "This check puts focus on “Delete” of the second row, presses Enter and expects the row to be gone, the summary to show “Records: 29999”, and focus on “Delete” of the row that is now second."
      - when: { test: "deleting the only shown expense moves focus to the heading" }
        message:
          uk: "Ця перевірка додає «Ремонт велосипеда», шукає його, видаляє єдиний показаний рядок клавішею Enter і очікує фокус на заголовку `h1`. Заголовок отримує фокус із коду, якщо має `tabIndex={-1}`."
          en: "This check adds “Bicycle repair”, searches for it, deletes the only shown row with Enter and expects focus on the `h1` heading. A heading receives focus from code if it has `tabIndex={-1}`."
      - when: { test: "deleting the last of several shown expenses moves focus to the previous Delete" }
        message:
          uk: "Ця перевірка двічі додає «Ремонт велосипеда», шукає його, ставить фокус на «Видалити» другого з двох рядків і тисне Enter. Вона очікує один рядок і фокус на його «Видалити»: наступного рядка немає, тож фокус іде на попередній."
          en: "This check adds “Bicycle repair” twice, searches for it, puts focus on “Delete” of the second of the two rows and presses Enter. It expects one row and focus on its “Delete”: there is no next row, so focus goes to the previous one."
      - when: { test: "the evidence names the measured cause and a gain" }
        message:
          uk: "Ця перевірка очікує в `evidence.js`: `records` — довжину `EXPENSES`, `slowest` — назву компонента, що рендериться найдовше, два числа більші за нуль (без лапок), де `afterMs` менше за `beforeMs`, і непорожній `change`."
          en: "This check expects in `evidence.js`: `records` — the length of `EXPENSES`, `slowest` — the name of the component that renders longest, two numbers greater than zero (without quotes) with `afterMs` less than `beforeMs`, and a non-empty `change`."
