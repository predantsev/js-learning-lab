id: js-04-01-arrays-basics
unit: JS-04
title:
  uk: "Масиви: впорядковані списки значень"
  en: "Arrays: ordered lists of values"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Читати й записувати елементи масиву за індексом і передбачати `length` після `push` і `pop`."
    en: "Read and write array elements by index and predict `length` after `push` and `pop`."
  - uk: "Передбачати, що дає читання за кінцем масиву і що робить із `length` запис далеко за кінцем (розріджений масив)."
    en: "Predict what reading past the end of an array returns, and what writing far past the end does to `length` (a sparse array)."
  - uk: "Явно обробляти порожній масив, коли потрібен його перший чи останній елемент."
    en: "Handle an empty array explicitly when asking for its first or last element."
prerequisites: [js-02-01-const-let, js-03-01-functions-and-return]
subskills:
  - { family: J-05, skill: "sparse/empty cases", depth: intro }
glossary: [array, array-index, sparse-array, array-method]
selfCheck: [read-slots, first-last]

blocks:
  - id: ordered-list
    kind: explanation
    title:
      uk: "Масив — це впорядкований список"
      en: "An array is an ordered list"
    body:
      uk: |
        Досі кожне значення лежало в окремій змінній. Але цін у списку бажань може бути три, а може й тридцять — на кожну змінну не напасешся. Для цього є [[array|масив]] — впорядкований список значень:

        ```js
        const prices = [80, 45, 240];
        ```

        Кожне значення лежить у пронумерованій комірці. Номер комірки — це [[array-index|індекс]], і рахунок починається **з 0**:

        | Індекс | 0 | 1 | 2 |
        |---|---|---|---|
        | Значення | 80 | 45 | 240 |

        `prices[0]` читає перше значення, `prices[2]` — третє. `prices.length` — кількість значень, тут 3. Тому останнє значення завжди лежить у `prices[prices.length - 1]`.

        Масив може змінюватися: `prices.push(18)` додає значення в кінець, а `prices.pop()` забирає останнє й повертає його. `push` і `pop` — це [[array-method|методи]] масиву: функції, які належать самому масиву й викликаються через крапку. І так, це працює навіть з `const prices`: `const` закріплює лише назву, а сам масив може змінюватися — як зошит «Покупки» з наліпкою з розділу JS-02.
      en: |
        So far every value had a name of its own. But a wish list may hold three prices or thirty — you cannot invent a name for each one. That is what an [[array]] is for: an ordered list of values.

        ```js
        const prices = [80, 45, 240];
        ```

        Each value sits in a numbered slot. The slot number is the [[array-index|index]], and counting starts **at 0**:

        | Index | 0 | 1 | 2 |
        |---|---|---|---|
        | Value | 80 | 45 | 240 |

        `prices[0]` reads the first value, `prices[2]` the third. `prices.length` is the number of values, 3 here. So the last value always sits in `prices[prices.length - 1]`.

        An array can change: `prices.push(18)` adds a value at the end, and `prices.pop()` removes the last one and returns it. `push` and `pop` are array [[array-method|methods]]: functions that belong to the array itself and are called with a dot. And yes, this works even with `const prices`: `const` fixes only the name, while the array itself can change — like the “Shopping” notebook with its sticker from JS-02.

  - id: read-slots
    kind: prediction
    prompt:
      uk: "Не запускаючи код, вирішуй: що з’явиться в консолі?"
      en: "Without running the code, decide: what appears in the console?"
    code: |
      const amounts = [120, 45, 300, 18];
      console.log(amounts[1]);
      console.log(amounts[amounts.length - 1]);
      console.log(amounts[4]);
    verify:
      logs: ["45", "18", "undefined"]
    answer:
      type: choice
      options:
        - id: zero-based
          text:
            uk: "`45`, `18`, `undefined`"
            en: "`45`, `18`, `undefined`"
        - id: one-based
          text:
            uk: "`120`, `300`, `18`"
            en: "`120`, `300`, `18`"
          why:
            uk: "Так було б, якби рахунок починався з 1. У JavaScript перша комірка — `amounts[0]`, тож `amounts[1]` — це друге значення, `45`."
            en: "That would be true if counting started at 1. In JavaScript the first slot is `amounts[0]`, so `amounts[1]` is the second value, `45`."
        - id: throws
          text:
            uk: "`45`, `18`, а потім помилка"
            en: "`45`, `18`, then an error"
          why:
            uk: "Читання комірки, якої немає, — не помилка. JavaScript просто повертає `undefined`: значення там ніхто не задавав."
            en: "Reading a slot that does not exist is not an error. JavaScript just returns `undefined`: nobody set a value there."
        - id: zero
          text:
            uk: "`45`, `18`, `0`"
            en: "`45`, `18`, `0`"
          why:
            uk: "«Нічого» — це не число 0. Комірки з індексом 4 немає, тому результат — `undefined`."
            en: "“Nothing” is not the number 0. There is no slot with index 4, so the result is `undefined`."
      correct: [zero-based]
    explanation:
      uk: "Індекси починаються з 0: `amounts[1]` — друге значення, `45`. У масиві 4 значення, тож останній індекс — `4 - 1 = 3`, і `amounts[amounts.length - 1]` дає `18`. Комірки з індексом 4 немає: читання за межами масиву не зупиняє програму, а дає `undefined`."
      en: "Indexes start at 0: `amounts[1]` is the second value, `45`. The array holds 4 values, so the last index is `4 - 1 = 3`, and `amounts[amounts.length - 1]` gives `18`. There is no slot with index 4: reading past the end does not stop the program, it gives `undefined`."

  - id: slots
    kind: visual
    visual: memory-graph
    title:
      uk: "Комірки масиву: push, pop і дірки"
      en: "Array slots: push, pop and holes"
    textEquivalent:
      uk: "Змінна prices вказує на один масив із трьома комірками: 0 → 80, 1 → 45, 2 → 240; length дорівнює 3. push(18) додає в кінець комірку 3 зі значенням 18, і length стає 4. pop() забирає останню комірку й повертає її значення: removed дорівнює 18, а в масиві знову три комірки. Запис prices[5] = 10 у масив, де останній індекс 2, створює комірку 5, а комірки 3 і 4 лишаються дірками, які ніхто не заповнював. length стає 6 — останній індекс плюс 1. Читання дірки prices[3] дає undefined, тому консоль показує «18 3» і «6 undefined»."
      en: "The name prices points at one array with three slots: 0 → 80, 1 → 45, 2 → 240; length is 3. push(18) adds slot 3 holding 18 at the end, and length becomes 4. pop() removes the last slot and returns its value: removed is 18 and the array has three slots again. Writing prices[5] = 10 into an array whose last index is 2 creates slot 5, while slots 3 and 4 stay holes that nobody filled. length becomes 6 — the last index plus 1. Reading the hole prices[3] gives undefined, so the console shows “18 3” and “6 undefined”."
    spec:
      from: trace
      file: visuals/slots.js
      captions:
        - at: { line: 2 }
          text:
            uk: "Рядок 1 створив **один** масив, і `prices` на нього вказує. Комірки пронумеровано з 0: `0 → 80`, `1 → 45`, `2 → 240`. Далі — `push(18)`."
            en: "Line 1 created **one** array, and `prices` points at it. The slots are numbered from 0: `0 → 80`, `1 → 45`, `2 → 240`. Next: `push(18)`."
        - at: { line: 3 }
          text:
            uk: "`push` додав у **кінець** комірку 3 зі значенням `18`: масив подовшав до чотирьох комірок. Далі `pop()` забере останню."
            en: "`push` added slot 3 holding `18` at the **end**: the array grew to four slots. Next, `pop()` takes the last one off."
        - at: { line: 4 }
          text:
            uk: "`pop()` прибрав останню комірку й **повернув** її значення: `removed` — це `18`, а в масиві знову три комірки."
            en: "`pop()` removed the last slot and **returned** its value: `removed` is `18`, and the array has three slots again."
        - at: { line: 5 }
          text:
            uk: "Останній індекс зараз 2. Рядок 5 запише значення аж у комірку 5 — що станеться з комірками між ними?"
            en: "The last index is 2 now. Line 5 writes a value all the way into slot 5 — what happens to the slots in between?"
        - at: { line: 6 }
          text:
            uk: "З’явилася комірка 5, а комірки 3 і 4 ніхто не заповнював — це **дірки** (`<empty>`). `length` став 6: останній індекс + 1, а не кількість заповнених комірок."
            en: "Slot 5 now exists, but nobody filled slots 3 and 4 — they are **holes** (`<empty>`). `length` became 6: the last index + 1, not the number of filled slots."
        - at: { line: 6, kind: end }
          text:
            uk: "Консоль: `18 3` і `6 undefined`. Дірка читається як `undefined` — так само, як комірка за кінцем масиву. Масив із дірками легко прочитати неправильно, тому краще його не створювати."
            en: "Console: `18 3` and `6 undefined`. A hole reads as `undefined` — just like a slot past the end. An array with holes is easy to misread, so it is better not to create one."

  - id: push-pop
    kind: example
    runtime: browser-js
    dir: push-pop
    entry: index.js
    title:
      uk: "Читай, додавай, забирай"
      en: "Read, add, remove"
    body:
      uk: |
        Запусти програму й порівняй кожен рядок консолі з кодом. Зверни увагу на порожній масив: `length` у нього 0, а `pop()` нічого не забирає й повертає `undefined`.
      en: |
        Run the program and match every console line with the code. Look at the empty array: its `length` is 0, and `pop()` removes nothing and returns `undefined`.
    tryIt:
      uk: "Допиши в кінці `prices[5] = 10;`, а потім виведи `prices` і `prices.length`: побачиш дві дірки `<empty>`. Виведи ще `prices[3]` — що дає читання дірки?"
      en: "Add `prices[5] = 10;` at the end, then print `prices` and `prices.length`: you will see two `<empty>` holes. Print `prices[3]` too — what does reading a hole give?"

  - id: holes-and-empty
    kind: explanation
    title:
      uk: "Дірки й порожній масив"
      en: "Holes and the empty array"
    body:
      uk: |
        Запис далеко за кінцем не додає «наступну» комірку — він створює комірку **саме з тим номером**, а між ними лишаються дірки:

        ```js
        const prices = [80, 45, 240];
        prices[5] = 10; // [80, 45, 240, <empty>, <empty>, 10], length 6
        ```

        Масив із дірками називають [[sparse-array|розрідженим]]. Його `length` — це «останній індекс + 1», а не кількість заповнених комірок, а дірка читається як `undefined` і легко маскується під справжнє значення. Додавай у кінець через `push` — і дірок не буде.

        Інший крайній випадок — порожній масив `[]`. Його `length` дорівнює 0, `list[0]` дає `undefined`, а `list[list.length - 1]` — це `list[-1]`, теж `undefined`. Коли функція має чесно відповісти «елемента немає», перевір це явно: `list.length === 0`.
      en: |
        Writing far past the end does not add the “next” slot — it creates the slot **with exactly that number**, and the slots in between stay holes:

        ```js
        const prices = [80, 45, 240];
        prices[5] = 10; // [80, 45, 240, <empty>, <empty>, 10], length 6
        ```

        An array with holes is called [[sparse-array|sparse]]. Its `length` is “the last index + 1”, not the number of filled slots, and a hole reads as `undefined`, so it easily passes for a real value. Add at the end with `push`, and there will be no holes.

        The other edge case is the empty array `[]`. Its `length` is 0, `list[0]` gives `undefined`, and `list[list.length - 1]` is `list[-1]`, also `undefined`. When a function must honestly answer “there is no element”, check it explicitly: `list.length === 0`.

  - id: first-last
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: first-last
    entry: index.js
    title:
      uk: "Перший і останній — або null"
      en: "First and last — or null"
    instructions:
      uk: |
        Допиши дві функції:

        - `firstOrNull(list)` повертає перший елемент масиву;
        - `lastOrNull(list)` повертає останній.

        Для порожнього масиву обидві повертають `null` — так той, хто їх викликає, одразу бачить, що елементів немає. Масив, який передали у функцію, змінювати не можна.

        Натисни **Запустити**, щоб побачити результат, і **Перевірити**, коли будеш готовий.
      en: |
        Complete two functions:

        - `firstOrNull(list)` returns the first element of the array;
        - `lastOrNull(list)` returns the last one.

        For an empty array both return `null`, so the caller sees at once that there are no elements. The array passed in must not be changed.

        Press **Run** to see the result and **Check** when you are ready.
    testTitles:
      "returns the first element":
        uk: "Повертає перший елемент"
        en: "Returns the first element"
      "returns the last element":
        uk: "Повертає останній елемент"
        en: "Returns the last element"
      "returns null for an empty list":
        uk: "Для порожнього масиву повертає null"
        en: "Returns null for an empty array"
      "keeps a real 0 or empty text":
        uk: "Не плутає справжні 0 чи порожній текст із відсутнім елементом"
        en: "Does not mistake a real 0 or empty text for a missing element"
      "does not change the list":
        uk: "Не змінює переданий масив"
        en: "Does not change the array passed in"
    hints:
      nudge:
        uk: "Почни з порожнього масиву: що має повернути кожна функція, коли `list.length` дорівнює 0?"
        en: "Start with the empty array: what should each function return when `list.length` is 0?"
      explanation:
        uk: "Розглянь два випадки. Якщо масив порожній, поверни `null`. Інакше прочитай потрібну комірку за індексом — рахунок іде з 0, тож номер останньої комірки на одиницю менший за `length`."
        en: "Handle two cases. If the array is empty, return `null`. Otherwise read the slot you need by its index — counting starts at 0, so the last slot's number is one less than `length`."
    solutionNote:
      uk: "Обидві функції спершу відповідають на крайній випадок — порожній масив — і лише потім читають комірку. Перевірка `list.length === 0` питає саме про кількість елементів, тому справжні `0` чи `\"\"` у масиві не плутаються з «нічого». Запис `list[0] ?? null` теж працює: `??` підміняє лише `undefined` і `null`."
      en: "Both functions answer the edge case — the empty array — first and only then read a slot. The check `list.length === 0` asks exactly about the number of elements, so a real `0` or `\"\"` in the array is never mistaken for “nothing”. Writing `list[0] ?? null` works too: `??` replaces only `undefined` and `null`."
    feedback:
      - when: { test: "returns the first element" }
        message:
          uk: "Ця перевірка викликає `firstOrNull([80, 45, 240])` і чекає `80` — значення з комірки 0: рахунок іде з 0, а не з 1. Якщо бачиш `undefined`, функція поки нічого не повертає."
          en: "This check calls `firstOrNull([80, 45, 240])` and expects `80` — the value in slot 0: counting starts at 0, not 1. If you see `undefined`, the function does not return anything yet."
      - when: { test: "returns the last element" }
        message:
          uk: "Ця перевірка викликає `lastOrNull([80, 45, 240])` і чекає `240`. Номер останньої комірки на одиницю менший за `length`; комірка `list[list.length]` завжди за межами масиву й дає `undefined`."
          en: "This check calls `lastOrNull([80, 45, 240])` and expects `240`. The last slot's number is one less than `length`; the slot `list[list.length]` is always past the end and gives `undefined`."
      - when: { test: "returns null for an empty list" }
        message:
          uk: "Ця перевірка викликає обидві функції з `[]` і чекає саме `null`, а читання `list[0]` з порожнього масиву дає `undefined`. Спершу з’ясуй, чи в масиві взагалі є елементи."
          en: "This check calls both functions with `[]` and expects exactly `null`, while reading `list[0]` of an empty array gives `undefined`. First find out whether the array has any elements at all."
      - when: { test: "keeps a real 0 or empty text" }
        message:
          uk: "Ця перевірка викликає `firstOrNull([0, 45])` і `lastOrNull([45, \"\"])` та чекає `0` і `\"\"`: справжні `0` чи `\"\"` у масиві — теж елементи. Якщо перевіряєш значення через `||`, пам’ятай: він вважає `0` і `\"\"` «порожніми» й підміняє їх. Про порожній масив питай через `list.length`, а не через саме значення."
          en: "This check calls `firstOrNull([0, 45])` and `lastOrNull([45, \"\"])` and expects `0` and `\"\"`: a real `0` or `\"\"` in the array is an element too. If you check the value with `||`, remember: it treats `0` and `\"\"` as “empty” and replaces them. Ask about an empty array through `list.length`, not through the value itself."
      - when: { test: "does not change the list" }
        message:
          uk: "Ця перевірка викликає обидві функції з `[80, 45, 240]` і чекає, що масив після цього лишиться таким, як був. Якщо використовуєш `pop()`, пам’ятай: він не лише повертає останній елемент, а й **забирає** його з масиву. Елемент можна прочитати за індексом, нічого не змінюючи."
          en: "This check calls both functions with `[80, 45, 240]` and expects the array to stay as it was afterwards. If you use `pop()`, remember: it does not just return the last element — it also **removes** it from the array. You can read an element by its index without changing anything."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: never-set
        from: js-01-04-booleans-null-undefined
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          let discount;
          console.log(discount);
          console.log(typeof discount);
        verify:
          logs: ["undefined", "undefined"]
        answer:
          type: choice
          options:
            - id: twice
              text:
                uk: "Двічі `undefined`: саме значення й назву його типу"
                en: "`undefined` twice: the value itself and the name of its type"
            - id: null-object
              text:
                uk: "`null`, а потім `object`"
                en: "`null`, then `object`"
              why:
                uk: "`null` — це навмисна «порожнеча», яку хтось записав. Змінна, якій нічого не присвоїли, має `undefined`."
                en: "`null` is a deliberate “nothing” that someone wrote down. A variable that was never assigned holds `undefined`."
            - id: error
              text:
                uk: "Помилку: змінній не задали значення"
                en: "An error: the variable has no value"
              why:
                uk: "Змінну оголошено (`let discount`), просто без значення. Помилку дала б лише невідома назва."
                en: "The variable is declared (`let discount`), just without a value. Only an unknown name would cause an error."
          correct: [twice]
        explanation:
          uk: "Оголошена, але не задана змінна має значення `undefined`, а `typeof` для нього дає текст `\"undefined\"`. Те саме `undefined` ти отримуєш, коли читаєш комірку масиву, у яку ніхто нічого не записав."
          en: "A declared but unassigned variable holds `undefined`, and `typeof` gives the text `\"undefined\"` for it. You get the same `undefined` when you read an array slot that nobody wrote into."

  - id: to-project
    kind: transfer
    capstoneStep: JS-04
    body:
      uk: "У твоєму проєкті записи — бажання, справи, звички чи витрати — теж лежать у масиві. Наприкінці розділу ти додаватимеш, змінюватимеш і видалятимеш їх, а починається все з того, що ти вже вмієш: читати запис за індексом і не забувати про порожній список."
      en: "In your project the records — wishes, tasks, habits or expenses — live in an array too. At the end of this unit you will add, change and remove them, and it all starts with what you can do now: read a record by its index and never forget the empty list."
