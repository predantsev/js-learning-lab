id: js-04-08-copying-shallow-deep
unit: JS-04
title:
  uk: "Копіювання: поверхневе й глибоке"
  en: "Copying: shallow vs deep"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачати, які зміни spread-копія ділить з оригіналом, коли в записі є вкладений масив чи об’єкт."
    en: "Predict which changes a spread copy shares with the original when the record holds a nested array or object."
  - uk: "Обирати між spread-копією, `structuredClone` і перетворенням через JSON зі старшого коду та називати, чого кожен спосіб не вміє скопіювати."
    en: "Choose between a spread copy, `structuredClone` and the JSON round-trip seen in older code, and name what each one cannot copy."
prerequisites: [js-04-07-reference-identity]
subskills:
  - { family: J-05, skill: "shallow vs deep copying", depth: intro }
  - { family: J-05, skill: "destructuring/spread", depth: intro }
glossary: [shallow-copy, deep-copy, spread-syntax, structured-clone]
selfCheck: [nested-shared, with-tag]

blocks:
  - id: spread-copy
    kind: explanation
    title:
      uk: "Новий об’єкт через spread"
      en: "A new object with spread"
    body:
      uk: |
        Щоб отримати **окремий** об’єкт, його треба створити. Найкоротше це робить [[spread-syntax|spread-синтаксис]] `...`: він розкладає поля одного об’єкта в новий літерал.

        ```js
        const copy = { ...task };   // a new object with the same fields
        copy.title = "Інша назва";  // task.title does not change
        ```

        Для масивів так само: `[...list]` — новий масив із тими самими елементами. Тепер `copy === task` дає `false`: це два об’єкти.

        Але spread копіює **значення полів**. Якщо поле — примітив, копіюється саме значення. А якщо в полі масив? Передбач.
      en: |
        To get a **separate** object, you have to create one. The shortest way is the [[spread-syntax|spread syntax]] `...`: it spreads the fields of one object into a new literal.

        ```js
        const copy = { ...task };   // a new object with the same fields
        copy.title = "Other title"; // task.title does not change
        ```

        Arrays work the same way: `[...list]` is a new array with the same elements. Now `copy === task` gives `false`: these are two objects.

        But spread copies **field values**. If a field is a primitive, the value itself is copied. And what if the field holds an array? Predict.

  - id: nested-shared
    kind: prediction
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      changed: { uk: "Полити кактус", en: "Water the cactus" }
      tagHome: { uk: "дім", en: "home" }
      tagWeekly: { uk: "щотижня", en: "weekly" }
    prompt:
      uk: "Справу скопійовано через spread, а потім копію змінено двічі. Що з’явиться в консолі?"
      en: "The task was copied with spread, and then the copy was changed twice. What appears in the console?"
    code: |
      const task = { id: "t-01", title: "%%water%%", tags: ["%%tagHome%%"] };
      const copy = { ...task };
      copy.title = "%%changed%%";
      copy.tags.push("%%tagWeekly%%");
      console.log(task.title);
      console.log(task.tags);
    verify:
      logs: ["%%water%%", "[\"%%tagHome%%\", \"%%tagWeekly%%\"]"]
    answer:
      type: choice
      options:
        - id: tags-shared
          text:
            uk: "`Полити квіти`, а потім `[\"дім\", \"щотижня\"]`"
            en: "`Water the plants`, then `[\"home\", \"weekly\"]`"
        - id: all-separate
          text:
            uk: "`Полити квіти`, а потім `[\"дім\"]`"
            en: "`Water the plants`, then `[\"home\"]`"
          why:
            uk: "Spread копіює лише перший рівень. У полі `tags` лежить посилання на масив, і в копію потрапило те саме посилання: `push` змінив спільний масив."
            en: "Spread copies only the first level. The `tags` field holds a reference to an array, and the copy got the same reference: `push` changed the shared array."
        - id: all-shared
          text:
            uk: "`Полити кактус`, а потім `[\"дім\", \"щотижня\"]`"
            en: "`Water the cactus`, then `[\"home\", \"weekly\"]`"
          why:
            uk: "`title` — текст, тобто примітив: у новий об’єкт скопійовано саме значення, тож нова назва в копії оригіналу не зачіпає."
            en: "`title` is a string, a primitive: the value itself was copied into the new object, so a new title in the copy does not touch the original."
        - id: inverted
          text:
            uk: "`Полити кактус`, а потім `[\"дім\"]`"
            en: "`Water the cactus`, then `[\"home\"]`"
          why:
            uk: "Навпаки: текст `title` скопійовано повністю, а масив `tags` — спільний для обох об’єктів."
            en: "The other way round: the string `title` was copied completely, while the `tags` array is shared by both objects."
      correct: [tags-shared]
    explanation:
      uk: "Spread створив новий зовнішній об’єкт і скопіював у нього значення полів. Рядок `title` скопіювався сам, тож заміна назви в копії оригінал не зачепила. А в полі `tags` було посилання — і копія отримала посилання на **той самий** масив. `push` через копію змінив масив, який бачить і `task`."
      en: "Spread created a new outer object and copied the field values into it. The string `title` was copied itself, so renaming the copy did not affect the original. But the `tags` field held a reference — and the copy got a reference to **the same** array. A `push` through the copy changed the array that `task` sees too."

  - id: one-level
    kind: explanation
    title:
      uk: "Поверхнева копія"
      en: "A shallow copy"
    body:
      uk: |
        Spread копіює лише **перший рівень**. Поле `tags` зберігає посилання на масив, і в копію потрапляє те саме посилання — обидва об’єкти ведуть до одного масиву. Це [[shallow-copy|поверхнева копія]]: зовнішній об’єкт новий, вкладені — спільні.

        Щоб копія не ділила вкладений масив з оригіналом, скопіюй і його. Ось як це виглядає для звички з масивом `completions`:

        ```js
        const copy = {
          ...habit,
          completions: [...habit.completions], // a new array as well
        };
        ```

        Поле, записане в літералі пізніше, перекриває однойменне з `...habit`, тож `completions` у копії — уже новий масив.
      en: |
        Spread copies only the **first level**. The `tags` field stores a reference to an array, and the copy gets the same reference — both objects lead to one array. This is a [[shallow-copy|shallow copy]]: the outer object is new, the nested ones are shared.

        To keep the copy from sharing a nested array with the original, copy the array too. Here is how it looks for a habit with a `completions` array:

        ```js
        const copy = {
          ...habit,
          completions: [...habit.completions], // a new array as well
        };
        ```

        A field written later in the literal overrides the one with the same name from `...habit`, so the copy's `completions` is a new array.

  - id: three-copies
    kind: visual
    visual: memory-graph
    title:
      uk: "Spread, structuredClone і JSON"
      en: "Spread, structuredClone and JSON"
    textEquivalent:
      uk: "Звичка habit вказує на об’єкт з id h-03 і полем completions, що веде до окремого масиву з однією датою. const copy = { ...habit } створює новий об’єкт, але його completions веде до того самого масиву, тож copy.completions.push додає дату в масив, спільний для habit і copy: тепер у habit теж дві дати. structuredClone(habit) копіює все, разом із вкладеним масивом: clone має власний масив, і push у нього не зачіпає масив habit. Об’єкт labeled має ще й поле label з функцією. JSON.stringify(labeled) перетворює його на текст, у якому поля label уже немає, а JSON.parse будує з цього тексту новий об’єкт back з id і власним масивом completions — теж без label: JSON мовчки губить функції. Консоль: 2, 3 і false — дві дати в habit, три в clone, і label у back немає."
      en: "The habit variable points at an object with id h-03 and a completions field leading to a separate array with one date. const copy = { ...habit } creates a new object, but its completions leads to the same array, so copy.completions.push adds a date to the array shared by habit and copy: habit now has two dates as well. structuredClone(habit) copies everything, the nested array included: clone has its own array, and a push into it does not touch habit's array. The object labeled also has a label field holding a function. JSON.stringify(labeled) turns it into text that no longer has a label field, and JSON.parse builds a new object back from that text, with id and its own completions array — and no label either: JSON silently drops functions. Console: 2, 3 and false — two dates in habit, three in clone, and no label in back."
    spec:
      from: trace
      file: visuals/copies.js
      captions:
        - at: { line: 5 }
          text:
            uk: "`habit` вказує на об’єкт, а його поле `completions` — на **окремий** масив з однією датою."
            en: "`habit` points at an object, and its `completions` field points at a **separate** array with one date."
        - at: { line: 6 }
          text:
            uk: "`{ ...habit }` створив **новий** об’єкт `copy`, але в його `completions` — те саме посилання: обидва об’єкти ведуть до одного масиву."
            en: "`{ ...habit }` created a **new** object `copy`, but its `completions` holds the same reference: both objects lead to one array."
        - at: { line: 7 }
          text:
            uk: "`push` через копію змінив **спільний** масив: у `habit` теж дві дати. Це поверхнева копія."
            en: "The `push` through the copy changed the **shared** array: `habit` has two dates too. That is a shallow copy."
        - at: { line: 8 }
          text:
            uk: "`structuredClone(habit)` скопіював і вкладений масив: у `clone` власний масив `completions`."
            en: "`structuredClone(habit)` copied the nested array too: `clone` has its own `completions` array."
        - at: { line: 9 }
          text:
            uk: "`push` у масив клону змінив лише його: у `habit` і далі дві дати."
            en: "The `push` into the clone's array changed only that array: `habit` still has two dates."
        - at: { line: 10 }
          text:
            uk: "`labeled` — копія з додатковим полем `label`, у якому функція."
            en: "`labeled` is a copy with an extra `label` field holding a function."
        - at: { line: 11 }
          text:
            uk: "`JSON.stringify` перетворив запис на текст, а `JSON.parse` збудував із нього новий об’єкт `back`: є `id` і власний масив `completions`, але **немає `label`** — JSON мовчки губить функції."
            en: "`JSON.stringify` turned the record into text, and `JSON.parse` built a new object `back` from it: it has `id` and its own `completions` array, but **no `label`** — JSON silently drops functions."
        - at: { line: 13, kind: end }
          text:
            uk: "Консоль: `2`, `3` і `false` — дві дати в `habit`, три в `clone`, і поля `label` у `back` немає."
            en: "Console: `2`, `3` and `false` — two dates in `habit`, three in `clone`, and no `label` field in `back`."

  - id: deep-copies
    kind: explanation
    title:
      uk: "Глибока копія — і коли вона не потрібна"
      en: "A deep copy — and when you do not need one"
    body:
      uk: |
        [[deep-copy|Глибока копія]] копіює все, разом із вкладеними масивами й об’єктами. Для цього є вбудована функція [[structured-clone|structuredClone]]:

        ```js
        const clone = structuredClone(habit); // completions is a separate array now
        ```

        Функцію вона скопіювати не може — кидає `DataCloneError`. У старшому коді трапляється `JSON.parse(JSON.stringify(habit))`: запис перетворюють на текст у форматі JSON і назад. Такий спосіб мовчки **губить** поля з функціями й зі значенням `undefined`. Про JSON докладно — у розділі про збереження даних.

        Глибока копія — не «безпечний вибір за замовчуванням». Вона копіює все, навіть те, що ти не змінюєш, і руйнує корисну ознаку «той самий об’єкт — отже, не змінювався». Копіюй рівно те, що змінюєш.
      en: |
        A [[deep-copy|deep copy]] copies everything, nested arrays and objects included. There is a built-in function for it, [[structured-clone|structuredClone]]:

        ```js
        const clone = structuredClone(habit); // completions is a separate array now
        ```

        It cannot copy a function — it throws a `DataCloneError`. Older code uses `JSON.parse(JSON.stringify(habit))`: the record is turned into JSON text and back. That way silently **drops** fields holding functions and the value `undefined`. JSON is covered in detail in the unit about saving data.

        A deep copy is not a “safe default”. It copies everything, even what you do not change, and destroys a useful signal: “the same object — so it did not change”. Copy exactly what you change.

  - id: copy-lab
    kind: example
    runtime: browser-js
    dir: copy-lab
    entry: index.js
    strings:
      water: { uk: "Пити воду", en: "Drink water" }
    title:
      uk: "Хто ділить масив completions?"
      en: "Who shares the completions array?"
    body:
      uk: |
        Звичка з вкладеним масивом `completions`, її поверхнева й глибока копії. Запусти й подивись, після якого `push` змінюється оригінал і які масиви однакові за `===`.
      en: |
        A habit with a nested `completions` array, plus its shallow and deep copies. Run it and see after which `push` the original changes, and which arrays are the same by `===`.
    tryIt:
      uk: "Заміни поверхневу копію на ту, що з пояснення, — з новим масивом `completions` — і запусти: `habit.completions` більше не змінюється, а перше порівняння дає `false`. Потім додай у `habit` поле `remind: () => \"!\"` і запусти ще раз — прочитай `DataCloneError` від `structuredClone`."
      en: "Replace the shallow copy with the one from the explanation — with a new `completions` array — and run: `habit.completions` no longer changes, and the first comparison gives `false`. Then add a field `remind: () => \"!\"` to `habit` and run again — read the `DataCloneError` from `structuredClone`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: return-same
        from: js-03-07-pure-vs-side-effects
        prompt:
          uk: "Функція додає збір до кошика й повертає результат. Що виведе код?"
          en: "The function adds a fee to the basket and returns the result. What does the code print?"
        code: |
          function addFee(prices) {
            prices.push(5);
            return prices;
          }
          const basket = [80, 45];
          const withFee = addFee(basket);
          console.log(basket.length, withFee === basket);
        verify:
          logs: ["3 true"]
        answer:
          type: choice
          options:
            - id: mutated
              text:
                uk: "`3 true`"
                en: "`3 true`"
            - id: new-array
              text:
                uk: "`2 false`"
                en: "`2 false`"
              why:
                uk: "Функція не створила нового масиву: `push` змінив масив, який їй передали, і повернула вона той самий масив."
                en: "The function created no new array: `push` changed the array that was passed in, and it returned that very array."
            - id: changed-but-new
              text:
                uk: "`3 false`"
                en: "`3 false`"
              why:
                uk: "`return prices` повертає те саме посилання, яке функція отримала, тож `withFee === basket` — `true`."
                en: "`return prices` returns the same reference the function received, so `withFee === basket` is `true`."
          correct: [mutated]
        explanation:
          uk: "`addFee` не чиста: вона змінює свій вхід і повертає той самий масив. Чиста версія будує новий: `return [...prices, 5];`. Те, що функція щось повернула, ще не доводить, що вхід лишився недоторканим."
          en: "`addFee` is not pure: it changes its input and returns the same array. A pure version builds a new one: `return [...prices, 5];`. A function returning something does not prove that its input was left untouched."

  - id: with-tag
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: with-tag
    entry: index.js
    strings:
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      tagHealth: { uk: "здоров’я", en: "health" }
      tagUrgent: { uk: "терміново", en: "urgent" }
    title:
      uk: "Копія з ще одним тегом"
      en: "A copy with one more tag"
    instructions:
      uk: |
        Допиши `withTag(task, tag)`: вона повертає **копію** справи, у якої в масиві `tags` на один тег більше — новий тег іде в кінець.

        - Інші поля копії такі самі, як в оригіналі.
        - Оригінальна справа і її масив `tags` лишаються незмінними: копія не може ділити з оригіналом масив `tags`.
      en: |
        Complete `withTag(task, tag)`: it returns a **copy** of the task whose `tags` array has one more tag — the new tag goes at the end.

        - The other fields of the copy are the same as in the original.
        - The original task and its `tags` array stay unchanged: the copy must not share the `tags` array with the original.
    testTitles:
      "adds the tag at the end of the copy":
        uk: "Додає тег у кінець масиву tags копії"
        en: "Adds the tag at the end of the copy's tags"
      "keeps the other fields":
        uk: "Зберігає інші поля"
        en: "Keeps the other fields"
      "returns a new object":
        uk: "Повертає новий об’єкт, а не оригінал"
        en: "Returns a new object, not the original"
      "leaves the original tags alone":
        uk: "Не змінює й не ділить оригінальний масив tags"
        en: "Neither changes nor shares the original tags array"
    hints:
      nudge:
        uk: "Скільки нових об’єктів тут потрібно? Подумай і про зовнішній об’єкт справи, і про масив `tags` усередині нього."
        en: "How many new objects are needed here? Think about both the outer task object and the `tags` array inside it."
      explanation:
        uk: "`{ ...task }` дає новий зовнішній об’єкт, але його `tags` — той самий масив. Тож у новому об’єкті поле `tags` має отримати новий масив — як `completions` у прикладі зі звичкою, тільки тут у кінець ще додається новий елемент. Новий масив із доданим елементом теж складають через spread: `[...days, \"2026-03-02\"]`. Не роби `push` у `task.tags` — це мутація оригіналу."
        en: "`{ ...task }` gives a new outer object, but its `tags` is the same array. So in the new object the `tags` field must get a new array — like `completions` in the habit example, except that a new element is also added at the end. A new array with an added element is built with spread too: `[...days, \"2026-03-02\"]`. Do not `push` into `task.tags` — that mutates the original."
    solutionNote:
      uk: "`{ ...task, tags: [...task.tags, tag] }` створює два нові об’єкти: зовнішній запис і новий масив тегів. Решта полів — примітиви, тож поверхневої копії для них досить. `structuredClone` теж спрацював би, але скопіював би й те, що не змінюється."
      en: "`{ ...task, tags: [...task.tags, tag] }` creates two new objects: the outer record and a new tags array. The other fields are primitives, so a shallow copy is enough for them. `structuredClone` would work too, but it would also copy what does not change."
    feedback:
      - when: { test: "leaves the original tags alone" }
        message:
          uk: "Оригінальний масив `tags` має лишитися незмінним і не бути спільним із копією. Spread копіює лише перший рівень, тож для копії потрібен і новий масив тегів."
          en: "The original `tags` array must stay unchanged and must not be shared with the copy. Spread copies only the first level, so the copy needs a new tags array as well."
      - when: { test: "returns a new object" }
        message:
          uk: "Функція має повернути новий об’єкт — не сам `task` і не `undefined`. Збери копію через spread."
          en: "The function must return a new object — neither `task` itself nor `undefined`. Build the copy with spread."
      - when: { test: "keeps the other fields" }
        message:
          uk: "У копії мають бути всі поля оригіналу (`id`, `title`). Почни новий об’єкт зі `...task`, а вже потім перекрий `tags`."
          en: "The copy must have every field of the original (`id`, `title`). Start the new object with `...task`, and only then override `tags`."
      - when: { test: "adds the tag at the end of the copy" }
        message:
          uk: "У копії `tags` має містити всі старі теги, а новий — у кінці."
          en: "The copy's `tags` must contain all the old tags with the new one at the end."

  - id: to-project
    kind: transfer
    capstoneStep: JS-04
    body:
      uk: "Записи твого проєкту здебільшого пласкі: назва, ціна, дата — примітиви. Для них досить `{ ...record }`. Але звичка має масив `completions`, а будь-який запис може отримати теги: такі поля копіюй окремо, коли змінюєш, — і ніколи не роби `push` у спільний масив."
      en: "Your project's records are mostly flat: a name, a price, a date — primitives. For them `{ ...record }` is enough. But a habit has a `completions` array, and any record may get tags: copy such fields separately when you change them — and never `push` into a shared array."
