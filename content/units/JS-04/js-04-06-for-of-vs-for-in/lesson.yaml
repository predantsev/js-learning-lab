id: js-04-06-for-of-vs-for-in
unit: JS-04
title:
  uk: "for…of дає значення, for…in — ключі"
  en: "for…of values vs for…in keys"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачати, що `for…of` дає значення масиву, а `for…in` — ключі у вигляді тексту, зокрема успадковані перелічувані."
    en: "Predict that `for…of` yields an array's values while `for…in` yields string keys, including inherited enumerable keys."
  - uk: "Безпечно обходити власні поля об’єкта через `Object.keys` або `Object.entries` замість `for…in`."
    en: "Iterate an object's own fields safely with `Object.keys` or `Object.entries` instead of `for…in`."
prerequisites: [js-04-05-objects-properties, js-04-02-for-while]
subskills:
  - { family: J-03, skill: "for-of values vs for-in enumerable keys/ownership pitfalls", depth: intro }
glossary: [for-of, for-in, enumerable-property, inherited-property]
selfCheck: [of-or-in, print-fields]

blocks:
  - id: values-or-keys
    kind: explanation
    title:
      uk: "Два цикли без лічильника"
      en: "Two loops without a counter"
    body:
      uk: |
        Є ще два цикли, і дають вони різне:

        - [[for-of|`for…of`]] дає **значення** по черзі: `for (const day of days)` — спершу перший елемент, потім другий. Ні лічильника, ні межі, а отже, ні помилок «на одиницю».
        - [[for-in|`for…in`]] дає **назви властивостей** — ключі, і завжди у вигляді тексту: `for (const key in task)` — `"id"`, `"title"`…

        ```js
        const amounts = [84550, 52000];
        for (const amount of amounts) {
          console.log(amount); // 84550, then 52000
        }
        ```

        `for…of` працює з масивами (і ще кількома видами колекцій, які з’являться пізніше), а для звичайного об’єкта кидає `TypeError: … is not iterable`. `for…in` на масиві дає індекси у вигляді тексту `"0"`, `"1"` — майже ніколи не те, що потрібно.
      en: |
        There are two more loops, and they give different things:

        - [[for-of|`for…of`]] gives the **values** one by one: `for (const day of days)` — the first element, then the second. No counter, no bound, and therefore no off-by-one errors.
        - [[for-in|`for…in`]] gives **property names** — keys, always as strings: `for (const key in task)` — `"id"`, `"title"`…

        ```js
        const amounts = [84550, 52000];
        for (const amount of amounts) {
          console.log(amount); // 84550, then 52000
        }
        ```

        `for…of` works with arrays (and a few other kinds of collections you will meet later), but throws `TypeError: … is not iterable` for an ordinary object. `for…in` on an array gives index strings `"0"`, `"1"` — almost never what you want.

  - id: of-or-in
    kind: prediction
    prompt:
      uk: "`Object.create(defaults)` створює порожній об’єкт, що **успадковує** від `defaults` — так само, як кожен об’єкт успадковує `toString` від `Object.prototype`. Що з’явиться в консолі?"
      en: "`Object.create(defaults)` creates an empty object that **inherits** from `defaults` — just as every object inherits `toString` from `Object.prototype`. What appears in the console?"
    code: |
      const days = ["2026-02-28", "2026-03-01"];
      for (const day of days) {
        console.log(day);
      }
      for (const day in days) {
        console.log(day);
      }
      const defaults = { priority: "normal" };
      const task = Object.create(defaults);
      task.id = "t-01";
      for (const key in task) {
        console.log(key);
      }
    verify:
      logs: ["2026-02-28", "2026-03-01", "0", "1", "id", "priority"]
    answer:
      type: choice
      options:
        - id: values-keys-inherited
          text:
            uk: "Дві дати, потім `0`, `1`, потім `id`, `priority`"
            en: "Two dates, then `0`, `1`, then `id`, `priority`"
        - id: values-twice
          text:
            uk: "Двічі дві дати, потім `id`"
            en: "The two dates twice, then `id`"
          why:
            uk: "`for…in` дає не елементи, а ключі: для масиву це індекси у вигляді тексту `\"0\"` і `\"1\"`. До того ж він обходить і успадковані ключі."
            en: "`for…in` gives keys, not elements: for an array these are the index strings `\"0\"` and `\"1\"`. Besides, it also walks inherited keys."
        - id: own-only
          text:
            uk: "Дві дати, потім `0`, `1`, потім лише `id`"
            en: "Two dates, then `0`, `1`, then only `id`"
          why:
            uk: "`for…in` обходить і перелічувані ключі, успадковані від `defaults`, тож `priority` теж з’явиться, хоча в самому `task` його немає."
            en: "`for…in` also walks enumerable keys inherited from `defaults`, so `priority` shows up too, although `task` itself does not have it."
        - id: swapped
          text:
            uk: "`0`, `1`, потім дві дати, потім `id`, `priority`"
            en: "`0`, `1`, then the two dates, then `id`, `priority`"
          why:
            uk: "Навпаки: `for…of` дає значення, а `for…in` — ключі."
            en: "The other way round: `for…of` gives values, and `for…in` gives keys."
      correct: [values-keys-inherited]
    explanation:
      uk: "`for…of` видав значення масиву, `for…in` — його індекси у вигляді тексту. А для `task` `for…in` спершу пройшов власний ключ `id`, а потім пішов за прихованим посиланням до `defaults` і видав успадкований `priority`, хоча в самому записі такого поля немає."
      en: "`for…of` produced the array's values, `for…in` its index strings. And for `task`, `for…in` first walked the own key `id`, then followed the hidden link to `defaults` and produced the inherited `priority`, although the record itself has no such field."

  - id: inherited-keys
    kind: explanation
    title:
      uk: "Успадковані ключі й безпечний обхід"
      en: "Inherited keys and a safe walk"
    body:
      uk: |
        `for…in` обходить і [[inherited-property|успадковані]] ключі — ті, що об’єкт отримав через приховане посилання на інший об’єкт. Вбудовані речі на кшталт `toString` він пропускає, бо вони не [[enumerable-property|перелічувані]]. А от ключі, які хтось додав у спільний об’єкт «за замовчуванням», `for…in` покаже як свої.

        Тому поля запису обходь методами, що повертають **лише власні** перелічувані ключі:

        ```js
        const names = Object.keys(task); // ["id", "priority"] — own keys only
        for (const name of names) {
          console.log(name); // "id", then "priority"
        }
        Object.entries(task); // [["id", "t-03"], ["priority", "low"]]
        ```

        `Object.keys` дає масив назв, `Object.entries` — масив пар `[назва, значення]`, де під індексом 0 лежить назва, а під індексом 1 — значення. Обидва масиви обходять звичайним `for…of`.
      en: |
        `for…in` also walks [[inherited-property|inherited]] keys — the ones an object gets through a hidden link to another object. It skips built-ins like `toString`, because they are not [[enumerable-property|enumerable]]. But keys that someone put into a shared “defaults” object, `for…in` shows as if they were the record's own.

        So walk a record's fields with methods that return **only own** enumerable keys:

        ```js
        const names = Object.keys(task); // ["id", "priority"] — own keys only
        for (const name of names) {
          console.log(name); // "id", then "priority"
        }
        Object.entries(task); // [["id", "t-03"], ["priority", "low"]]
        ```

        `Object.keys` gives an array of names, `Object.entries` an array of `[name, value]` pairs, where index 0 holds the name and index 1 the value. Both arrays are walked with an ordinary `for…of`.

  - id: of-in-trace
    kind: visual
    visual: code-trace
    title:
      uk: "for…of і for…in над масивом і над записом"
      en: "for…of and for…in over an array and over a record"
    textEquivalent:
      uk: "Над масивом [\"t-01\", \"t-02\"] цикл for…of дає змінній value значення t-01 і t-02, а for…in — ключі \"0\" і \"1\" у вигляді тексту. Далі об’єкт defaults має поле done, а task створено через Object.create(defaults) і має власні поля id і priority. for…in над task видає id, priority, а потім done — ключ, якого в task немає: цикл пішов за прихованим посиланням до defaults і приніс успадкований ключ. Object.keys(task) повертає лише власні ключі id і priority, тож for…of над ним done не показує."
      en: "Over the array [\"t-01\", \"t-02\"] the for…of loop gives the variable value the values t-01 and t-02, while for…in gives the keys \"0\" and \"1\", which are strings. Next, the object defaults has a field done, and task is created with Object.create(defaults) and has the own fields id and priority. for…in over task produces id, priority and then done — a key task does not have: the loop followed the hidden link to defaults and brought an inherited key. Object.keys(task) returns only the own keys id and priority, so for…of over it does not show done."
    spec:
      file: visuals/of-in.js
      captions:
        - at: { line: 3, hit: 1 }
          text:
            uk: "`for…of` над масивом: змінна `value` отримує **значення** — `\"t-01\"`."
            en: "`for…of` over the array: the variable `value` gets a **value** — `\"t-01\"`."
        - at: { line: 3, hit: 2 }
          text:
            uk: "Друга ітерація — `\"t-02\"`. Ні індексу, ні межі: цикл сам знає, коли масив закінчився."
            en: "Second iteration — `\"t-02\"`. No index, no bound: the loop itself knows when the array ends."
        - at: { line: 6, hit: 1 }
          text:
            uk: "`for…in` над тим самим масивом дає **ключі**: `key` — це текст `\"0\"`, а не значення."
            en: "`for…in` over the same array gives **keys**: `key` is `\"0\"`, a string, not a value."
        - at: { line: 13, kind: iter, hit: 1 }
          text:
            uk: "`task` створено з `Object.create(defaults)`: серед його власних полів лише `id` і `priority`, а `done` живе в об’єкті `defaults`. `for…in` починає з власних ключів."
            en: "`task` was created with `Object.create(defaults)`: its own rows hold only `id` and `priority`, while `done` lives in the `defaults` object. `for…in` starts with the own keys."
        - at: { line: 14, hit: 3 }
          text:
            uk: "Третя ітерація: `key` — `\"done\"`. У `task` такого поля немає: `for…in` пішов за прихованим посиланням до `defaults` і приніс **успадкований** ключ."
            en: "Third iteration: `key` is `\"done\"`. `task` has no such field: `for…in` followed the hidden link to `defaults` and brought an **inherited** key."
        - at: { line: 17, hit: 2 }
          text:
            uk: "`Object.keys(task)` повертає лише **власні** ключі — `id` і `priority`. `done` зник: це не поле самого запису."
            en: "`Object.keys(task)` returns only the **own** keys — `id` and `priority`. `done` is gone: it is not a field of the record itself."
        - at: { line: 18, kind: end }
          text:
            uk: "Підсумок: значення — через `for…of`, ключі у вигляді тексту — через `for…in` разом з успадкованим `done`, і лише власні ключі — через `Object.keys`."
            en: "Summary: values through `for…of`, string keys through `for…in` together with the inherited `done`, and only the own keys through `Object.keys`."

  - id: loops-compare
    kind: example
    runtime: browser-js
    dir: loops-compare
    entry: index.js
    strings:
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
    title:
      uk: "Звідки береться зайве поле"
      en: "Where the extra field comes from"
    body:
      uk: |
        Справу створено зі спільних значень за замовчуванням: `priority` і `done` вона успадковує від `defaults`. Запусти й порівняй, які поля бачить `for…in`, а які — `Object.keys`.
      en: |
        The task is created from shared defaults: it inherits `priority` and `done` from `defaults`. Run it and compare which fields `for…in` sees and which ones `Object.keys` sees.
    tryIt:
      uk: "Заміни цикл `for…in` на `for (const key of Object.keys(task))` і друкуй у ньому лише `key`: успадковані `priority` і `done` зникнуть зі списку, хоча `task.priority` усе ще читається. Потім спробуй `for (const value of task)` і прочитай `TypeError`."
      en: "Replace the `for…in` loop with `for (const key of Object.keys(task))` and print only `key` in it: the inherited `priority` and `done` disappear from the list, although `task.priority` can still be read. Then try `for (const value of task)` and read the `TypeError`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    strings:
      walk: { uk: "Прогулянка", en: "Go for a walk" }
    items:
      - id: in-answers
        from: js-02-09-rare-operators-special-values
        prompt:
          uk: "Звичку поставлено на паузу (`active: false`), а поля `streak` немає. Що виведе код?"
          en: "The habit is paused (`active: false`), and there is no `streak` field. What does the code print?"
        code: |
          const habit = { name: "%%walk%%", active: false };
          console.log("active" in habit, habit.active);
          console.log("streak" in habit, habit.streak);
        verify:
          logs: ["true false", "false undefined"]
        answer:
          type: choice
          options:
            - id: name-exists
              text:
                uk: "`true false`, а потім `false undefined`"
                en: "`true false`, then `false undefined`"
            - id: truthy
              text:
                uk: "`false false`, а потім `false undefined`"
                en: "`false false`, then `false undefined`"
              why:
                uk: "`in` питає, чи є така назва, а не чи правдиве значення. Поле `active` є — просто в ньому `false`."
                en: "`in` asks whether the name exists, not whether the value is truthy. The field `active` exists — it just holds `false`."
            - id: always-true
              text:
                uk: "`true false`, а потім `true undefined`"
                en: "`true false`, then `true undefined`"
              why:
                uk: "Поля `streak` в об’єкті немає, тож `\"streak\" in habit` дає `false`; читання ж дає `undefined`."
                en: "There is no `streak` field in the object, so `\"streak\" in habit` gives `false`, and reading it gives `undefined`."
          correct: [name-exists]
        explanation:
          uk: "Оператор `in` відповідає на запитання «чи є така назва в об’єкті (або в тому, від кого він успадковує)?», а не «чи правдиве значення?». Поле `active` існує, хоча в ньому `false`; поля `streak` немає зовсім."
          en: "The `in` operator answers “is there such a name in the object (or in the one it inherits from)?”, not “is the value truthy?”. The field `active` exists although it holds `false`; the field `streak` does not exist at all."

  - id: print-fields
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: print-fields
    entry: index.js
    strings:
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
    title:
      uk: "Надрукуй власні поля запису"
      en: "Print a record's own fields"
    instructions:
      uk: |
        Допиши `printFields(record)`: для кожного **власного** поля запису виведи в консоль окремий рядок у форматі `назва: значення`, у тому порядку, у якому поля записано. Наприклад, для витрати перші два рядки в консолі — `id: e-03` і `label: …`.

        Поля, успадковані від іншого об’єкта, друкувати не треба. Для порожнього запису функція не друкує нічого.
      en: |
        Complete `printFields(record)`: for every **own** field of the record print a separate line in the format `name: value`, in the order the fields were written. For example, for an expense the first two lines are `id: e-03` and `label: …`.

        Fields inherited from another object must not be printed. For an empty record the function prints nothing.
    testTitles:
      "prints every own field as \"key: value\"":
        uk: "Друкує кожне власне поле у форматі «назва: значення»"
        en: "Prints every own field as “name: value”"
      "skips inherited fields":
        uk: "Не друкує успадковані поля"
        en: "Skips inherited fields"
      "prints nothing for an empty record":
        uk: "Для порожнього запису нічого не друкує"
        en: "Prints nothing for an empty record"
    hints:
      nudge:
        uk: "`Object.entries(record)` повертає масив пар. Що лежить у кожній парі під індексами 0 і 1?"
        en: "`Object.entries(record)` returns an array of pairs. What is stored at indexes 0 and 1 of each pair?"
      explanation:
        uk: "Масив пар, який повертає `Object.entries`, обходять звичайним `for…of`. Для запису з полем `price` пара виглядає як `[\"price\", 45]`: під індексом 0 — назва, під індексом 1 — значення. Склади з пари текст через `+` і `\": \"` та виведи його. Успадкованих полів у цьому масиві немає."
        en: "The array of pairs returned by `Object.entries` is walked with an ordinary `for…of`. For a record with a `price` field a pair looks like `[\"price\", 45]`: index 0 holds the name, index 1 the value. Build the text from the pair with `+` and `\": \"` and print it. Inherited fields are not in this array."
    solutionNote:
      uk: "`Object.entries` повертає масив власних перелічуваних полів як пари `[назва, значення]`, а `for…of` проходить цей масив по черзі. Успадковані поля сюди не потрапляють, а порожній запис дає порожній масив — і цикл не робить жодної ітерації. Варіант з `Object.keys(record)` і `record[key]` теж правильний."
      en: "`Object.entries` returns an array of the own enumerable fields as `[name, value]` pairs, and `for…of` walks that array one by one. Inherited fields never get in, and an empty record gives an empty array — so the loop makes no iterations. A version with `Object.keys(record)` and `record[key]` is correct too."
    feedback:
      - when: { test: "skips inherited fields" }
        message:
          uk: "Ця перевірка дає запис, що успадковує `category` і `currency` від іншого об’єкта, і чекає в консолі рівно два рядки: `id: e-06` і `amountMinor: 21050`. Якщо серед рядків є й `category` та `currency`, твій обхід бачить успадковані ключі — так робить `for…in`; масиви з `Object.keys` чи `Object.entries` містять лише власні."
          en: "This check gives a record that inherits `category` and `currency` from another object and expects exactly two lines: `id: e-06` and `amountMinor: 21050`. If `category` and `currency` show up too, your walk sees inherited keys — that is what `for…in` does; the arrays from `Object.keys` or `Object.entries` hold only own ones."
      - when: { test: "prints every own field as \"key: value\"" }
        message:
          uk: "Ця перевірка викликає `printFields` для витрати з п’ятьма полями й чекає в консолі п’ять рядків у форматі `назва: значення` — назва, двокрапка, пробіл, значення, наприклад `amountMinor: 18000`, — у тому порядку, у якому записано поля."
          en: "This check calls `printFields` for an expense with five fields and expects five lines in the format `name: value` — the name, a colon, a space and the value, for example `amountMinor: 18000` — in the order the fields were written."
      - when: { error: TypeError }
        message:
          uk: "Якщо в повідомленні є `is not iterable`, то `for…of` отримав звичайний об’єкт, а він працює з масивами: обходь масив, який повертає `Object.keys` чи `Object.entries`. Якщо ж кожна перевірка пише `… is not a function`, програма зупинилася ще під час запуску: спершу виправ помилку з картки над перевірками."
          en: "If the message says `is not iterable`, `for…of` got an ordinary object, and it works with arrays: walk the array returned by `Object.keys` or `Object.entries`. If every check says `… is not a function` instead, the program stopped while it was starting: fix the error from the card above the checks first."
      - when: { test: "prints nothing for an empty record" }
        message:
          uk: "Ця перевірка викликає `printFields({})` і чекає, що в консолі не з’явиться жодного рядка — ні заголовка, ні порожнього рядка."
          en: "This check calls `printFields({})` and expects not a single line in the console — no heading, no empty line."

  - id: to-project
    kind: transfer
    capstoneStep: JS-04
    body:
      uk: "Коли твій проєкт показуватиме деталі запису чи зберігатиме його, обходь власні поля через `Object.keys` або `Object.entries`, а список записів — через `for…of`. Так у результат не потрапить нічого чужого, і не буде жодної помилки «на одиницю»."
      en: "When your project shows the details of a record or saves it, walk its own fields with `Object.keys` or `Object.entries`, and the list of records with `for…of`. Then nothing foreign gets into the result, and there is no room for an off-by-one error."
