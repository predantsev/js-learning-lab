id: js-04-03-termination-off-by-one
unit: JS-04
title:
  uk: "Вчасно зупинитися: завершення циклу й помилка «на одиницю»"
  en: "Stopping correctly: termination and off-by-one"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Знаходити й виправляти помилку «на одиницю» в межах циклу (`i <= length` або старт з 1), перевіряючи першу й останню ітерацію."
    en: "Find and fix an off-by-one bound (`i <= length`, or starting at 1) by checking the first and the last iteration."
  - uk: "Пояснювати, чому цикл, крок якого не наближає умову виходу, ніколи не зупиниться, і зупиняти такий запуск кнопкою **Зупинити**."
    en: "Explain why a loop whose update never moves towards its exit condition never stops, and stop such a run with the **Stop** control."
prerequisites: [js-04-02-for-while, js-02-02-equality-coercion]
subskills:
  - { family: J-03, skill: "termination and off-by-one", depth: intro }
glossary: [termination, infinite-loop, off-by-one]
selfCheck: [one-too-many, first-n]

blocks:
  - id: first-and-last
    kind: explanation
    title:
      uk: "Перша й остання ітерація"
      en: "The first and the last iteration"
    body:
      uk: |
        Цикл може працювати без жодної помилки — і все одно бути неправильним. Найчастіше він робить на одну ітерацію більше чи менше, ніж треба. Це помилка [[off-by-one|«на одиницю»]].

        Для масиву з `n` елементів правильні індекси — від `0` до `n - 1`. Тож перевір дві ітерації:

        - **Першу:** чи починається `i` з 0? Старт з 1 пропускає перший елемент.
        - **Останню:** яке найбільше `i` пропускає умова? `i < list.length` зупиняється на `n - 1`. А `i <= list.length` пускає ще й `i = n` — читання `list[n]`, тобто `undefined`.

        Зайва ітерація за кінцем масиву не дає помилки: вона тихо додає `undefined` до результату. А пропущена ітерація просто губить елемент. Тому, крім звичайного списку, завжди перевіряй порожній і список з одного елемента.
      en: |
        A loop can run without a single error and still be wrong. Most often it makes one iteration too many or too few. That is an [[off-by-one]] error.

        For an array of `n` elements the valid indexes are `0` to `n - 1`. So check two iterations:

        - **The first:** does `i` start at 0? Starting at 1 skips the first element.
        - **The last:** what is the largest `i` the condition lets through? `i < list.length` stops at `n - 1`. But `i <= list.length` also lets in `i = n` — a read of `list[n]`, which is `undefined`.

        An extra iteration past the end causes no error: it quietly adds `undefined` to the result. A missed iteration simply loses an element. So besides a normal list, always check an empty list and a list with a single element.

  - id: one-too-many
    kind: prediction
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
    prompt:
      uk: "У списку три справи. Що з’явиться в консолі?"
      en: "The list has three tasks. What appears in the console?"
    code: |
      const titles = ["%%water%%", "%%books%%", "%%grandma%%"];
      for (let i = 0; i <= titles.length; i++) {
        console.log(i, titles[i]);
      }
    verify:
      logs: ["0 %%water%%", "1 %%books%%", "2 %%grandma%%", "3 undefined"]
    answer:
      type: choice
      options:
        - id: four
          text:
            uk: "Чотири рядки в консолі; останній — `3 undefined`"
            en: "Four lines; the last one is `3 undefined`"
        - id: three
          text:
            uk: "Три рядки в консолі — по одному на кожну справу"
            en: "Three lines — one per task"
          why:
            uk: "`<=` дозволяє `i` дорівнювати `titles.length`, тобто 3. Перевірка `3 <= 3` правдива, тож буде ще одна ітерація."
            en: "`<=` lets `i` equal `titles.length`, which is 3. The check `3 <= 3` is true, so there is one more iteration."
        - id: error
          text:
            uk: "Три рядки в консолі, а потім помилка"
            en: "Three lines, then an error"
          why:
            uk: "`titles[3]` — це читання за межами масиву, а воно дає `undefined`, не помилку. Зайва ітерація проходить тихо."
            en: "`titles[3]` is a read past the end of the array, and that gives `undefined`, not an error. The extra iteration passes silently."
      correct: [four]
    explanation:
      uk: "Індекси справ — 0, 1 і 2. Але умова `i <= titles.length` правдива ще й для `i = 3`, тож цикл робить четверту ітерацію й читає `titles[3]` — `undefined`. Програма не впала, і саме тому таку помилку легко пропустити."
      en: "The task indexes are 0, 1 and 2. But the condition `i <= titles.length` is also true for `i = 3`, so the loop makes a fourth iteration and reads `titles[3]` — `undefined`. The program did not crash, and that is exactly why such a mistake is easy to miss."

  - id: extra-step
    kind: visual
    visual: code-trace
    title:
      uk: "Зайва ітерація за кінцем масиву"
      en: "An extra iteration past the end of the array"
    textEquivalent:
      uk: "Масив ids має три елементи з індексами 0, 1 і 2. Цикл for з умовою i <= ids.length перевіряє 0 <= 3, 1 <= 3 і 2 <= 3 — усе правдиво, і тіло друкує три справжні id. Після третьої ітерації i стає 3, і перевірка 3 <= 3 теж правдива, тож починається четверта ітерація: ids[3] не існує, консоль отримує «3 undefined», а лічильник visited стає 4. Лише перевірка 4 <= 3 зупиняє цикл. Програма закінчується без помилки й друкує visited: 4 — на одну ітерацію більше, ніж елементів. З умовою i < ids.length ітерацій було б рівно три."
      en: "The array ids has three elements with indexes 0, 1 and 2. The for loop with the condition i <= ids.length checks 0 <= 3, 1 <= 3 and 2 <= 3 — all true — and the body prints the three real ids. After the third iteration i becomes 3, and the check 3 <= 3 is true as well, so a fourth iteration starts: ids[3] does not exist, the console gets “3 undefined”, and the visited counter becomes 4. Only the check 4 <= 3 stops the loop. The program ends without an error and prints visited: 4 — one iteration more than there are elements. With the condition i < ids.length there would be exactly three iterations."
    spec:
      file: visuals/extra-step.js
      captions:
        - at: { line: 3, kind: cond, hit: 1 }
          text:
            uk: "Три id з індексами 0, 1, 2. Перша перевірка: `0 <= 3` — true."
            en: "Three ids with indexes 0, 1, 2. The first check: `0 <= 3` is true."
        - at: { line: 4, hit: 3 }
          text:
            uk: "`i` дорівнює 2 — це остання справжня комірка, `ids[2]`. Правильний цикл зупинився б після цієї ітерації."
            en: "`i` is 2 — the last real slot, `ids[2]`. A correct loop would stop after this iteration."
        - at: { line: 3, kind: cond, hit: 4 }
          text:
            uk: "Перевірка `3 <= 3` — **true**: `<=` пускає й `i`, що дорівнює довжині. Починається зайва ітерація."
            en: "The check `3 <= 3` is **true**: `<=` also lets in an `i` equal to the length. An extra iteration begins."
        - at: { line: 4, hit: 4 }
          text:
            uk: "Комірки `ids[3]` немає, тож у консоль іде `3 undefined`. Жодної помилки — зайва ітерація проходить тихо."
            en: "There is no slot `ids[3]`, so the console gets `3 undefined`. No error at all — the extra iteration passes silently."
        - at: { line: 3, kind: cond, hit: 5 }
          text:
            uk: "Лише `4 <= 3` дає false. Чотири ітерації на три елементи."
            en: "Only `4 <= 3` gives false. Four iterations for three elements."
        - at: { line: 7, kind: end }
          text:
            uk: "`visited: 4` — на одну більше, ніж елементів. З умовою `i < ids.length` було б рівно 3."
            en: "`visited: 4` — one more than there are elements. With `i < ids.length` there would be exactly 3."

  - id: never-stops
    kind: explanation
    title:
      uk: "Цикл, що ніколи не закінчиться"
      en: "A loop that never ends"
    body:
      uk: |
        У JS-02 ти вже бачив: цикл завершується лише тоді, коли його умова стає `false`. Отже, щось у тілі чи в кроці мусить рухати значення до виходу — це й забезпечує [[termination|завершення]] циклу. Перевіряй це для кожного циклу, який пишеш: що саме наближає умову до `false`? Якщо в `while (i < names.length)` ніщо не змінює `i`, умова вічно лишається правдивою. Це [[infinite-loop|нескінченний цикл]].

        Сам собою такий цикл не показує помилки. У звичайній вкладці браузера сторінка просто «замерзає»: кнопки не натискаються, нічого не відбувається. У цій пісочниці є страховка: поки код працює, під редактором видно кнопку **Зупинити**, а цикл, що працює довше 2 секунд, платформа зупиняє сама: у консолі з’являється картка «Помилка під час виконання» з номером рядка коду, а в оригінальному повідомленні — `LoopBudgetError`. Твій код при цьому не змінюється — знайди, що мало рухати умову до `false`, і запусти знову.
      en: |
        You already saw in JS-02 that a loop ends only when its condition becomes `false`. So something in the body or in the update must move the values towards the exit — that is what guarantees the loop's [[termination]]. Check it for every loop you write: what exactly moves the condition towards `false`? If nothing changes `i` in `while (i < names.length)`, the condition stays true forever. That is an [[infinite-loop|infinite loop]].

        On its own, such a loop shows no error. In an ordinary browser tab the page simply “freezes”: buttons do not respond, nothing happens. This sandbox has a safety net: while code runs, a **Stop** button is shown under the editor, and a loop that runs longer than 2 seconds is stopped by the platform itself: the console shows an “Error while running” card with the line number, and the original message says `LoopBudgetError`. Your code stays unchanged — find what should have moved the condition towards `false`, and run again.

  - id: no-exit
    kind: visual
    visual: code-trace
    title:
      uk: "Умова, яку ніщо не змінює"
      en: "A condition that nothing changes"
    textEquivalent:
      uk: "Масив ids має три елементи, i дорівнює 0, лічильник steps — 0. Умова циклу while — i < ids.length, тобто 0 < 3. Тіло збільшує лише steps, а i не змінює ніщо, тож перед кожною новою ітерацією перевіряється та сама умова 0 < 3, і вона щоразу правдива. steps зростає 1, 2, 3, … 18, а i весь час 0. Трасування обрізано після кількох десятків кроків, але цикл від цього не зупиняється: у справжньому запуску платформа перериває його через 2 секунди з помилкою LoopBudgetError, а рядок коду після циклу так і не виконується."
      en: "The array ids has three elements, i is 0 and the steps counter is 0. The while loop's condition is i < ids.length, that is 0 < 3. The body only increases steps, and nothing changes i, so before every new iteration the very same condition 0 < 3 is checked, and it is true every time. steps grows 1, 2, 3, … 18 while i stays 0. The trace is cut after a few dozen steps, but that does not stop the loop: in a real run the platform interrupts it after 2 seconds with a LoopBudgetError, and the line after the loop never runs."
    spec:
      file: visuals/no-exit.js
      maxSteps: 40
      allowTruncated: true
      captions:
        - at: { line: 4, kind: cond, hit: 1 }
          text:
            uk: "Умова `i < ids.length` — це `0 < 3`, true. Тіло виконується."
            en: "The condition `i < ids.length` is `0 < 3`, true. The body runs."
        - at: { line: 5, hit: 1 }
          text:
            uk: "Тіло збільшує `steps`. А що змінює `i`? Нічого."
            en: "The body increases `steps`. And what changes `i`? Nothing."
        - at: { line: 4, kind: cond, hit: 2 }
          text:
            uk: "Знову та сама перевірка: `i` досі 0, тож `0 < 3` — знову true. Умова залежить від `i`, а `i` стоїть на місці."
            en: "The same check again: `i` is still 0, so `0 < 3` is true again. The condition depends on `i`, and `i` does not move."
        - at: { line: 4, kind: cond, hit: 10 }
          text:
            uk: "Десята перевірка: `steps` — 9, `i` — усе ще 0. Цикл не наближається до виходу ні на крок."
            en: "The tenth check: `steps` is 9, `i` is still 0. The loop gets not a single step closer to the exit."
        - at: { line: 4, kind: cond, hit: 19 }
          text:
            uk: "Тут запис траси обривається, але цикл — ні. У справжньому запуску його через 2 секунди зупиняє платформа (`LoopBudgetError`), а рядок коду 8 так і не виконується."
            en: "The trace recording stops here, but the loop does not. In a real run the platform stops it after 2 seconds (`LoopBudgetError`), and line 8 never runs."

  - id: stuck-loop
    kind: example
    runtime: browser-js
    dir: stuck-loop
    entry: index.js
    expectError: true
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      start: { uk: "Рахую звички…", en: "Counting the habits…" }
      counted: { uk: "Звичок:", en: "Habits:" }
    title:
      uk: "Цикл без кроку"
      en: "A loop without a step"
    body:
      uk: |
        Ця програма мала порахувати звички й вивести в консоль два рядки. Натисни **Запустити**: з’явиться перший — і більше нічого, програма застрягла в циклі. Зупини її кнопкою **Зупинити** або зачекай 2 секунди — платформа зробить це сама й покаже картку «Помилка під час виконання» з номером рядка коду, де стоїть цикл.
      en: |
        This program was meant to count the habits and print two lines. Press **Run**: the first line appears — and nothing else, the program is stuck in the loop. Stop it with the **Stop** button or wait 2 seconds — the platform will do it itself and show an “Error while running” card with the loop's line number.
    tryIt:
      uk: "Знайди, що мало змінювати `i`, і додай у тіло циклу рядок коду `i++;`. Запусти знову: «Звичок: 3». Потім заміни `i++` на `i--` і, перш ніж запускати, подумай: чи наближає такий крок умову до `false`?"
      en: "Find what should have changed `i`, and add the line `i++;` to the loop body. Run again: “Habits: 3”. Then replace `i++` with `i--` and, before running, think: does such a step move the condition towards `false`?"

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: strict-limit
        from: js-02-02-equality-coercion
        prompt:
          uk: "Межу циклу прочитали з текстового поля, тож це текст `\"3\"`. Що виведе код?"
          en: "The loop limit was read from a text field, so it is the string `\"3\"`. What does the code print?"
        code: |
          const limit = "3";
          let i = 3;
          console.log(i === limit, i == limit);
        verify:
          logs: ["false true"]
        answer:
          type: choice
          options:
            - id: strict-false
              text:
                uk: "`false true`"
                en: "`false true`"
            - id: both-true
              text:
                uk: "`true true`"
                en: "`true true`"
              why:
                uk: "`===` не перетворює типи: число 3 і текст `\"3\"` — різні значення, тож результат `false`."
                en: "`===` does not convert types: the number 3 and the string `\"3\"` are different values, so the result is `false`."
            - id: both-false
              text:
                uk: "`false false`"
                en: "`false false`"
              why:
                uk: "`==` спершу перетворює текст `\"3\"` на число 3, тому `3 == \"3\"` дає `true`."
                en: "`==` first converts the string `\"3\"` to the number 3, so `3 == \"3\"` gives `true`."
          correct: [strict-false]
        explanation:
          uk: "`===` порівнює без перетворень, тож число й текст ніколи не рівні. Тому цикл `while (i !== limit)` з `limit = \"3\"` не зупинився б ніколи: коли `i` дійде до 3, `3 !== \"3\"` усе ще `true`. Перетвори межу на число заздалегідь: `Number(limit)`."
          en: "`===` compares without conversions, so a number and a string are never equal. That is why a loop `while (i !== limit)` with `limit = \"3\"` would never stop: when `i` reaches 3, `3 !== \"3\"` is still `true`. Convert the limit to a number first: `Number(limit)`."

  - id: first-n
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: first-n
    entry: index.js
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
    title:
      uk: "Перші n звичок"
      en: "The first n habits"
    instructions:
      uk: |
        Допиши `firstN(list, n)`: вона повертає **новий** масив із перших `n` звичок списку. Користуйся циклом.

        Якщо `n` більше за довжину списку, поверни всі звички, які є, — у результаті не має бути жодного `undefined`. Для `n = 0` і для порожнього списку результат — порожній масив `[]`.
      en: |
        Complete `firstN(list, n)`: it returns a **new** array with the first `n` habits of the list. Use a loop.

        If `n` is larger than the list, return all the habits there are — the result must not contain a single `undefined`. For `n = 0` and for an empty list the result is an empty array `[]`.
    testTitles:
      "returns the first n habits":
        uk: "Повертає перші n звичок"
        en: "Returns the first n habits"
      "returns all habits when n equals the length":
        uk: "Повертає всі звички, коли n дорівнює довжині"
        en: "Returns all habits when n equals the length"
      "stops at the end of a shorter list":
        uk: "Зупиняється в кінці списку, коли n більше за його довжину"
        en: "Stops at the end of the list when n is larger than its length"
      "returns an empty array for n = 0":
        uk: "Для n = 0 повертає порожній масив"
        en: "Returns an empty array for n = 0"
      "returns an empty array for an empty list":
        uk: "Для порожнього списку повертає порожній масив"
        en: "Returns an empty array for an empty list"
    hints:
      nudge:
        uk: "Цикл має дві причини зупинитися: набрали `n` звичок або закінчився список. Яка з них настане раніше, залежить від даних."
        en: "The loop has two reasons to stop: `n` habits have been collected, or the list has ended. Which comes first depends on the data."
      explanation:
        uk: "Умова циклу може містити дві причини зупинитися одразу — їх з’єднують через `&&`. Пригадай цикл із бюджетом: `while (i < prices.length && budget >= prices[i])` іде далі, лише поки список не скінчився **і** грошей вистачає. Тут так само: перша причина — набрано `n` звичок, друга — скінчився список. Кожну звичку додавай у `result` через `push`."
        en: "A loop condition can hold two reasons to stop at once — they are joined with `&&`. Remember the budget loop: `while (i < prices.length && budget >= prices[i])` goes on only while the list has not ended **and** the money lasts. The same here: one reason is that `n` habits are collected, the other that the list has ended. Add each habit to `result` with `push`."
    solutionNote:
      uk: "Умова `i < n && i < list.length` перевіряє обидві межі перед кожною ітерацією: для `n = 2` цикл зупиняється після двох звичок, для `n = 5` — коли закінчився список, а для `n = 0` чи порожнього списку не робить жодної ітерації. Перевірка першої й останньої ітерації та порожнього списку — найшвидший спосіб упіймати помилку «на одиницю»."
      en: "The condition `i < n && i < list.length` checks both limits before every iteration: for `n = 2` the loop stops after two habits, for `n = 5` when the list ends, and for `n = 0` or an empty list it makes no iterations at all. Checking the first and the last iteration and the empty list is the fastest way to catch an off-by-one error."
    feedback:
      - when: { test: "stops at the end of a shorter list" }
        message:
          uk: "Для `n = 5` і трьох звичок мають повернутися рівно три звички, без жодного `undefined`. Перевір останню ітерацію: чи зупиняє умова цикл і тоді, коли закінчився список?"
          en: "For `n = 5` and three habits exactly three habits must come back, without a single `undefined`. Check the last iteration: does the condition also stop the loop when the list ends?"
      - when: { test: "returns the first n habits" }
        message:
          uk: "Склади таблицю ітерацій для `n = 2`: які значення проходить `i`? Має бути рівно дві ітерації — `i` = 0 і `i` = 1."
          en: "Make the iteration table for `n = 2`: which values does `i` take? There must be exactly two iterations — `i` = 0 and `i` = 1."
      - when: { test: "returns an empty array for n = 0" }
        message:
          uk: "Для `n = 0` цикл не має виконатися жодного разу. Перевір першу ітерацію: чи правдива умова, коли `i` і `n` обидва дорівнюють 0?"
          en: "For `n = 0` the loop must not run at all. Check the first iteration: is the condition true when `i` and `n` are both 0?"
      - when: { test: "returns an empty array for an empty list" }
        message:
          uk: "Для порожнього списку результат має бути `[]`. Якщо в ньому `undefined`, цикл не перевіряє, чи список уже скінчився."
          en: "For an empty list the result must be `[]`. If it contains `undefined`, the loop does not check whether the list has already ended."

  - id: to-project
    kind: transfer
    capstoneStep: JS-04
    body:
      uk: "Коли ти показуватимеш у проєкті «перші кілька» записів чи шукатимеш запис циклом, перевіряй першу й останню ітерацію та порожній список. Тоді помилки «на одиницю» не дійдуть до твоєї сторінки."
      en: "When your project shows “the first few” records or looks for a record with a loop, check the first and the last iteration and the empty list. Then off-by-one errors will not reach your page."
