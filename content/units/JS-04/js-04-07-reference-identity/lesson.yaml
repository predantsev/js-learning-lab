id: js-04-07-reference-identity
unit: JS-04
title:
  uk: "Дві змінні, один об’єкт: тотожність посилань"
  en: "Two names, one object: reference identity"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Передбачати, чи видно зміну, зроблену через одну змінну, через іншу — для об’єктів і для примітивів."
    en: "Predict whether a change made through one name is visible through another, for objects and for primitives."
  - uk: "Пояснювати, чому `{ id: \"w-01\" } === { id: \"w-01\" }` дає `false`, а `a === b` після `const b = a` — `true`."
    en: "Explain why `{ id: \"w-01\" } === { id: \"w-01\" }` is `false` while `a === b` is `true` after `const b = a`."
  - uk: "Відстежувати об’єкт, переданий у функцію, що його змінює, і називати всі змінні й параметри, які бачать зміну."
    en: "Trace an object passed into a function that mutates it and name every binding that sees the change."
prerequisites: [js-04-05-objects-properties, js-02-01-const-let, js-03-05-closures]
subskills:
  - { family: J-05, skill: "reference identity/mutation", depth: intro }
glossary: [primitive, reference, reference-identity, mutation, aliasing]
selfCheck: [shared-or-copied, same-or-same-id]

blocks:
  - id: two-names
    kind: explanation
    title:
      uk: "Копія числа — і що з об’єктом?"
      en: "A copy of a number — and an object?"
    body:
      uk: |
        Ти вже знаєш, як поводяться числа: `let copy = price` дає змінній `copy` власне значення. Змінимо `copy` — `price` лишиться як був:

        ```js
        let price = 80;
        let copy = price;
        copy = 0; // price is still 80
        ```

        Числа, текст, булеві значення, `null` і `undefined` — це [[primitive|примітиви]]: значення, які зберігаються просто в змінній і копіюються цілком.

        А що, коли в змінній об’єкт — запис бажання? Чи отримає друга змінна власну копію запису? Перш ніж читати далі, передбач.
      en: |
        You already know how numbers behave: `let copy = price` gives the variable `copy` a value of its own. Change `copy`, and `price` stays as it was:

        ```js
        let price = 80;
        let copy = price;
        copy = 0; // price is still 80
        ```

        Numbers, strings, booleans, `null` and `undefined` are [[primitive|primitives]]: values that are stored right in the variable and copied whole.

        But what if the variable holds an object — a wish record? Does a second name get its own copy of the record? Predict before reading on.

  - id: shared-or-copied
    kind: prediction
    prompt:
      uk: "Що з’явиться в консолі?"
      en: "What appears in the console?"
    code: |
      const wish = { id: "w-01", price: 80 };
      const alias = wish;
      alias.price = 0;
      console.log(wish.price);

      let price = 80;
      let copy = price;
      copy = 0;
      console.log(price);
    verify:
      logs: ["0", "80"]
    answer:
      type: choice
      options:
        - id: shared-object
          text:
            uk: "`0`, а потім `80`"
            en: "`0`, then `80`"
        - id: copied-object
          text:
            uk: "`80`, а потім `80`"
            en: "`80`, then `80`"
          why:
            uk: "`const alias = wish` не копіює об’єкт: обидві змінні ведуть до одного й того самого запису, тож зміну через `alias` видно й через `wish`."
            en: "`const alias = wish` does not copy the object: both names lead to one and the same record, so a change through `alias` is visible through `wish` too."
        - id: shared-number
          text:
            uk: "`0`, а потім `0`"
            en: "`0`, then `0`"
          why:
            uk: "Числа копіюються цілком: `copy` отримала власне 80, і нове значення в `copy` не зачіпає `price`."
            en: "Numbers are copied whole: `copy` got its own 80, and a new value in `copy` does not touch `price`."
        - id: const-error
          text:
            uk: "Помилку в рядку коду `alias.price = 0`: `alias` — це `const`"
            en: "An error on `alias.price = 0`: `alias` is a `const`"
          why:
            uk: "`const` забороняє дати змінній інше значення (`alias = …`). Змінювати властивості об’єкта, до якого вона веде, можна."
            en: "`const` forbids giving the name another value (`alias = …`). Changing the properties of the object the name leads to is allowed."
      correct: [shared-object]
    explanation:
      uk: "Для об’єкта `const alias = wish` не створює другий запис — друга змінна веде до того самого. Тому `wish.price` теж 0. Число ж скопіювалося цілком: `copy` і `price` ніяк не пов’язані."
      en: "For an object, `const alias = wish` does not create a second record — the second name leads to the same one. That is why `wish.price` is 0 too. The number, on the other hand, was copied whole: `copy` and `price` are not connected at all."

  - id: references
    kind: explanation
    title:
      uk: "Змінна тримає посилання"
      en: "A variable holds a reference"
    body:
      uk: |
        Об’єкти й масиви живуть окремо від змінних. Змінна зберігає не сам об’єкт, а [[reference|посилання]] на нього — щось на зразок адреси. Тому `const alias = wish` копіює **посилання**: тепер дві змінні ведуть до одного об’єкта. Таку ситуацію називають [[aliasing|аліасингом]] — від англійського alias, «псевдонім».

        Зміна вмісту об’єкта — це його [[mutation|мутація]]: `alias.price = 0`, `push` у масив, `delete`. Мутацію видно через **кожну** змінну, що веде до цього об’єкта: нікого не «оновлювали», просто об’єкт один.

        А присвоєння змінній нового значення (`alias = { … }`) змінює лише саму змінну: вона починає вести до іншого об’єкта, а решта змінних — ні.
      en: |
        Objects and arrays live apart from variables. A variable stores not the object itself but a [[reference]] to it — something like an address. That is why `const alias = wish` copies the **reference**: now two names lead to one object. This situation is called [[aliasing]] — from “alias”, a second name.

        Changing the contents of an object is a [[mutation]]: `alias.price = 0`, a `push` into an array, a `delete`. A mutation is visible through **every** name that leads to that object: nobody was “updated”, there is simply one object.

        Assigning a new value to a variable (`alias = { … }`), however, changes only that variable: it starts leading to another object, while the other names do not.

  - id: house-note
    kind: analogy
    body:
      uk: "Уяви, що об’єкт — це будинок, а змінна з об’єктом — стікер з адресою цього будинку. `const alias = wish` не будує другий будинок: він переписує ту саму адресу на другий стікер. Пофарбуй будинок, прийшовши за будь-яким стікером, — і той, хто прийде за іншим стікером, побачить той самий новий колір: будинок один. Напиши на стікері іншу адресу — і зміниться лише цей стікер. А `===` питає «та сама адреса?», а не «схожі будинки?»: два однакові будинки на різних вулицях — це різні будинки."
      en: "Imagine that an object is a house, and a variable holding the object is a sticky note with the house's address. `const alias = wish` does not build a second house: it copies the same address onto a second note. Paint the house after arriving by either note, and whoever arrives by the other note sees the same new colour: there is one house. Write a different address on a note, and only that note changes. And `===` asks “same address?”, not “similar-looking house?”: two identical houses on different streets are different houses."
    limits:
      uk: "Примітиви — числа, текст, булеві значення — не будинки: на їхньому стікері записане саме значення, і воно копіюється разом зі стікером, тож зміна одного стікера ніколи не зачіпає інший. І справжній будинок не зникає, коли викинули останній стікер з його адресою, а об’єкт, до якого не лишилося жодного посилання, JavaScript з часом сам прибирає з пам’яті."
      en: "Primitives — numbers, strings, booleans — are not houses: their note carries the value itself, and the value is copied along with the note, so changing one note never affects another. And a real house does not vanish when the last note with its address is thrown away, whereas an object that no reference leads to any more is eventually removed from memory by JavaScript itself."

  - id: functions-share
    kind: explanation
    title:
      uk: "Функція отримує те саме посилання"
      en: "A function receives the same reference"
    body:
      uk: |
        Коли ти передаєш об’єкт у функцію, вона отримує **те саме посилання**: параметр — ще одна змінна, що веде до того самого об’єкта.

        ```js
        function markAcquired(item) {
          item.acquired = true; // mutates the caller's object
        }
        markAcquired(wish);
        wish.acquired; // true
        ```

        Функція не отримує власної копії, тож мутацію через параметр бачать усі, хто тримає посилання на цей об’єкт. А от присвоєння самому параметру (`item = { … }`) змінює лише локальну змінну всередині функції.
      en: |
        When you pass an object into a function, the function receives **the same reference**: the parameter is one more name for the same object.

        ```js
        function markAcquired(item) {
          item.acquired = true; // mutates the caller's object
        }
        markAcquired(wish);
        wish.acquired; // true
        ```

        The function gets no copy of its own, so a mutation through the parameter is seen by everyone holding a reference to that object. Assigning to the parameter itself (`item = { … }`), however, changes only the local name inside the function.

  - id: one-house-two-notes
    kind: visual
    visual: memory-graph
    title:
      uk: "Кілька змінних — один об’єкт"
      en: "Several names — one object"
    textEquivalent:
      uk: "Змінна wish вказує на об’єкт #o1 з id w-01 і price 80. let alias = wish копіює посилання, тож дві стрілки ведуть до одного об’єкта, і wish === alias дає true. alias.price = 0 змінює цей єдиний об’єкт, тому wish.price теж 0. Під час виклику markAcquired(wish) параметр item — третя змінна, що веде до #o1, і item.acquired = true додає в нього acquired: true. Після виклику параметр item зникає, а зміна лишається: wish.acquired і alias.acquired — true. Присвоєння alias = { id: \"w-01\", price: 0, acquired: true } створює новий об’єкт #o2 і переводить на нього лише стрілку alias; wish і далі веде до #o1. Об’єкти виглядають однаково, але це різні об’єкти, тож wish === alias тепер false. Наприкінці числа: let copy = price записує в copy саме число 80, а copy = 0 змінює лише copy — price лишається 80, бо в примітивів немає спільного об’єкта."
      en: "The variable wish points at object #o1 with id w-01 and price 80. let alias = wish copies the reference, so two arrows lead to one object, and wish === alias gives true. alias.price = 0 changes that single object, so wish.price is 0 too. During the call markAcquired(wish) the parameter item is a third name for #o1, and item.acquired = true adds acquired: true to it. After the call the name item is gone, but the change stays: wish.acquired and alias.acquired are true. The assignment alias = { id: \"w-01\", price: 0, acquired: true } creates a new object #o2 and moves only the alias arrow to it; wish still leads to #o1. The objects look the same, but they are different objects, so wish === alias is now false. Finally the numbers: let copy = price stores the number 80 itself in copy, and copy = 0 changes only copy — price stays 80, because primitives share no object."
    spec:
      code: |
        const wish = { id: "w-01", price: 80 };
        let alias = wish;
        alias.price = 0;
        function markAcquired(item) {
          item.acquired = true;
        }
        markAcquired(wish);
        alias = { id: "w-01", price: 0, acquired: true };
        let price = 80;
        let copy = price;
        copy = 0;
      states:
        - caption:
            uk: "`wish` — не сам об’єкт, а **посилання** на нього: стрілка до об’єкта #o1."
            en: "`wish` is not the object itself but a **reference** to it: an arrow to object #o1."
          line: 1
          bindings:
            - { name: wish, kind: const, value: { ref: o1 } }
          heap:
            o1: { kind: object, props: { id: "w-01", price: 80 } }
        - caption:
            uk: "`let alias = wish` копіює **посилання**, а не об’єкт: дві стрілки ведуть до одного об’єкта. Тому `wish === alias` — `true`."
            en: "`let alias = wish` copies the **reference**, not the object: two arrows lead to one object. That is why `wish === alias` is `true`."
          line: 2
          bindings:
            - { name: wish, kind: const, value: { ref: o1 } }
            - { name: alias, kind: let, value: { ref: o1 } }
          heap:
            o1: { kind: object, props: { id: "w-01", price: 80 } }
        - caption:
            uk: "`alias.price = 0` змінює об’єкт, до якого ведуть **обидві** стрілки. `wish.price` теж 0: нікого не оновлювали — об’єкт один."
            en: "`alias.price = 0` changes the object **both** arrows lead to. `wish.price` is 0 too: nobody was updated — there is one object."
          line: 3
          bindings:
            - { name: wish, kind: const, value: { ref: o1 } }
            - { name: alias, kind: let, value: { ref: o1 } }
          heap:
            o1: { kind: object, props: { id: "w-01", price: 0 } }
        - caption:
            uk: "Усередині `markAcquired(wish)` параметр `item` — **третя** змінна, що веде до того самого об’єкта. `item.acquired = true` змінює саме його."
            en: "Inside `markAcquired(wish)` the parameter `item` is a **third** name for the same object. `item.acquired = true` changes exactly that object."
          line: 5
          bindings:
            - { name: wish, kind: const, value: { ref: o1 } }
            - { name: alias, kind: let, value: { ref: o1 } }
            - { name: item, kind: param, value: { ref: o1 } }
          heap:
            o1: { kind: object, props: { id: "w-01", price: 0, acquired: true } }
        - caption:
            uk: "Виклик завершився, параметр `item` зник, а зміна лишилася в об’єкті: `wish.acquired` і `alias.acquired` — `true`."
            en: "The call is over and the name `item` is gone, but the change stayed in the object: `wish.acquired` and `alias.acquired` are `true`."
          line: 7
          bindings:
            - { name: wish, kind: const, value: { ref: o1 } }
            - { name: alias, kind: let, value: { ref: o1 } }
          heap:
            o1: { kind: object, props: { id: "w-01", price: 0, acquired: true } }
        - caption:
            uk: "Присвоєння `alias = { … }` переводить **лише стрілку `alias`** на новий об’єкт #o2. `wish` і далі веде до #o1. Об’єкти виглядають однаково, але це різні об’єкти: `wish === alias` тепер `false`."
            en: "The assignment `alias = { … }` moves **only the `alias` arrow** to a new object #o2. `wish` still leads to #o1. The objects look the same, but they are different objects: `wish === alias` is now `false`."
          line: 8
          bindings:
            - { name: wish, kind: const, value: { ref: o1 } }
            - { name: alias, kind: let, value: { ref: o2 } }
          heap:
            o1: { kind: object, props: { id: "w-01", price: 0, acquired: true } }
            o2: { kind: object, props: { id: "w-01", price: 0, acquired: true } }
        - caption:
            uk: "Числа — примітиви: `let copy = price` записує в `copy` **саме число**. Стрілок немає — нічого спільного."
            en: "Numbers are primitives: `let copy = price` stores **the number itself** in `copy`. No arrows — nothing shared."
          line: 10
          bindings:
            - { name: wish, kind: const, value: { ref: o1 } }
            - { name: alias, kind: let, value: { ref: o2 } }
            - { name: price, kind: let, value: 80 }
            - { name: copy, kind: let, value: 80 }
          heap:
            o1: { kind: object, props: { id: "w-01", price: 0, acquired: true } }
            o2: { kind: object, props: { id: "w-01", price: 0, acquired: true } }
        - caption:
            uk: "`copy = 0` змінює лише `copy`, а `price` лишився 80: у примітивів немає спільного об’єкта, який можна було б змінити."
            en: "`copy = 0` changes only `copy`, and `price` stays 80: primitives have no shared object that could be changed."
          line: 11
          bindings:
            - { name: wish, kind: const, value: { ref: o1 } }
            - { name: alias, kind: let, value: { ref: o2 } }
            - { name: price, kind: let, value: 80 }
            - { name: copy, kind: let, value: 0 }
          heap:
            o1: { kind: object, props: { id: "w-01", price: 0, acquired: true } }
            o2: { kind: object, props: { id: "w-01", price: 0, acquired: true } }

  - id: who-sees-it
    kind: example
    runtime: browser-js
    dir: who-sees-it
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
    title:
      uk: "Хто бачить зміну?"
      en: "Who sees the change?"
    body:
      uk: |
        Один запис бажання, кілька змінних і функція, що змінює свій параметр. Запусти й для кожного рядка в консолі скажи, через яку змінну об’єкт змінили і чому зміну бачать інші.
      en: |
        One wish record, several names and a function that changes its parameter. Run it, and for every console line say through which name the object was changed and why the other names see it.
    tryIt:
      uk: "Заміни `alias.price = 0;` на `alias = { id: \"w-01\", price: 0 };` і запусти: тепер `wish.price` лишається 80, а `wish === alias` — `false`. Потім першим рядком коду всередині `markAcquired` додай `item = { acquired: false };` — чи зміниться тепер `wish.acquired`?"
      en: "Replace `alias.price = 0;` with `alias = { id: \"w-01\", price: 0 };` and run: now `wish.price` stays 80 and `wish === alias` is `false`. Then add `item = { acquired: false };` as the first line inside `markAcquired` — does `wish.acquired` change now?"

  - id: identity
    kind: explanation
    title:
      uk: "=== питає: той самий об’єкт?"
      en: "=== asks: the same object?"
    body:
      uk: |
        Для об’єктів і масивів `===` питає, чи це **той самий** об’єкт, — тобто порівнює посилання. Це [[reference-identity|тотожність посилань]]:

        ```js
        const today = ["2026-03-01"];
        const sameDays = ["2026-03-01"];
        today === sameDays; // false — two literals, two arrays
        ```

        Кожен літерал `[ … ]` чи `{ … }` створює новий об’єкт, хай навіть із таким самим вмістом. Щоб порівняти записи **за вмістом**, порівнюй потрібні поля — наприклад, дату й суму двох витрат. Для примітивів `===` порівнює самі значення: `80 === 80` — `true`.
      en: |
        For objects and arrays, `===` asks whether it is **the same** object — that is, it compares references. This is [[reference-identity|reference identity]]:

        ```js
        const today = ["2026-03-01"];
        const sameDays = ["2026-03-01"];
        today === sameDays; // false — two literals, two arrays
        ```

        Every `[ … ]` or `{ … }` literal creates a new object, even one with exactly the same contents. To compare records **by content**, compare the fields you need — for example, the date and the amount of two expenses. For primitives `===` compares the values themselves: `80 === 80` is `true`.

  - id: same-or-lookalike
    kind: prediction
    prompt:
      uk: "Що з’явиться в консолі?"
      en: "What appears in the console?"
    code: |
      const first = { id: "w-01" };
      const second = { id: "w-01" };
      const alias = first;
      console.log(first === second);
      console.log(first === alias);
      console.log(first.id === second.id);
    verify:
      logs: ["false", "true", "true"]
    answer:
      type: choice
      options:
        - id: identity
          text:
            uk: "`false`, `true`, `true`"
            en: "`false`, `true`, `true`"
        - id: by-content
          text:
            uk: "`true`, `true`, `true`"
            en: "`true`, `true`, `true`"
          why:
            uk: "`===` не порівнює вміст об’єктів. `first` і `second` — два окремі об’єкти, хай і з однаковим `id`."
            en: "`===` does not compare the contents of objects. `first` and `second` are two separate objects, even with the same `id`."
        - id: alias-copy
          text:
            uk: "`false`, `false`, `true`"
            en: "`false`, `false`, `true`"
          why:
            uk: "`alias = first` копіює посилання: обидві змінні ведуть до одного об’єкта, тож `first === alias` — `true`."
            en: "`alias = first` copies the reference: both names lead to one object, so `first === alias` is `true`."
        - id: ids-differ
          text:
            uk: "`false`, `true`, `false`"
            en: "`false`, `true`, `false`"
          why:
            uk: "`first.id` і `second.id` — це текст, тобто примітиви, і `===` порівнює їх за значенням: `\"w-01\" === \"w-01\"`."
            en: "`first.id` and `second.id` are strings, that is, primitives, and `===` compares them by value: `\"w-01\" === \"w-01\"`."
      correct: [identity]
    explanation:
      uk: "Два літерали — два різні об’єкти, тож `first === second` дає `false`. `alias` веде до того самого об’єкта, що й `first`, — `true`. А поля `id` — текстові примітиви, і `===` порівнює їх за значенням — `true`."
      en: "Two literals are two different objects, so `first === second` gives `false`. `alias` leads to the same object as `first` — `true`. And the `id` fields are string primitives, which `===` compares by value — `true`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: const-name
        from: js-02-01-const-let
        prompt:
          uk: "Що виведе код?"
          en: "What does the code print?"
        code: |
          const wish = { price: 80 };
          wish.price = 60;
          console.log(wish.price);
          wish = { price: 10 };
          console.log(wish.price);
        verify:
          logs: ["60"]
          error: TypeError
        answer:
          type: choice
          options:
            - id: then-error
              text:
                uk: "`60`, а потім `TypeError`"
                en: "`60`, then a `TypeError`"
            - id: error-first
              text:
                uk: "Одразу `TypeError` у другому рядку коду"
                en: "A `TypeError` right away on the second line"
              why:
                uk: "`const` забороняє лише присвоїти змінній нове значення. Зміна властивості об’єкта — це мутація, а не присвоєння змінній."
                en: "`const` forbids only assigning a new value to the name. Changing a property of the object is a mutation, not an assignment to the name."
            - id: no-error
              text:
                uk: "`60`, а потім `10`"
                en: "`60`, then `10`"
              why:
                uk: "`wish = { … }` — це вже присвоєння самій змінній, а `const` його забороняє: `TypeError: Assignment to constant variable.`"
                en: "`wish = { … }` is an assignment to the name itself, and `const` forbids it: `TypeError: Assignment to constant variable.`"
          correct: [then-error]
        explanation:
          uk: "`const` фіксує змінну — тобто посилання, а не вміст об’єкта. Мутація `wish.price = 60` дозволена, а спроба повести `wish` до іншого об’єкта кидає `TypeError`."
          en: "`const` fixes the name — that is, the reference — not the contents of the object. The mutation `wish.price = 60` is allowed, while trying to make `wish` lead to another object throws a `TypeError`."
      - id: closure-link
        from: js-03-05-closures
        prompt:
          uk: "Функцію створено, коли знижка була 10. Що виведе код?"
          en: "The function was created while the discount was 10. What does the code print?"
        code: |
          let discount = 10;
          const priceWith = (price) => price - discount;
          discount = 20;
          console.log(priceWith(100));
        verify:
          logs: ["80"]
        answer:
          type: choice
          options:
            - id: live
              text:
                uk: "`80`"
                en: "`80`"
            - id: snapshot
              text:
                uk: "`90`"
                en: "`90`"
              why:
                uk: "Функція не робить знімок `discount` у момент створення: вона тримає зв’язок із самою змінною й читає її під час виклику, коли там уже 20."
                en: "The function does not take a snapshot of `discount` when it is created: it keeps a link to the variable itself and reads it at call time, when it already holds 20."
            - id: untouched
              text:
                uk: "`100`"
                en: "`100`"
              why:
                uk: "Функція бачить зовнішню змінну `discount` — це замикання — і віднімає її значення."
                en: "The function sees the outer variable `discount` — that is a closure — and subtracts its value."
          correct: [live]
        explanation:
          uk: "Замикання тримає зв’язок зі змінною, а не знімок її значення: на момент виклику `discount` уже 20. Схожу ідею ти бачиш і в цьому уроці: змінна веде до живого об’єкта, а не до його копії."
          en: "A closure keeps a link to the variable, not a snapshot of its value: at call time `discount` is already 20. You see a similar idea in this lesson: a name leads to a live object, not to a copy of it."

  - id: same-or-same-id
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: same-or-same-id
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
    title:
      uk: "Той самий запис чи той самий id?"
      en: "The same record or the same id?"
    instructions:
      uk: |
        Допиши дві функції, що відповідають на різні запитання:

        - `isSameRecord(a, b)` повертає `true`, лише якщо `a` і `b` — **один і той самий** об’єкт (дві змінні одного запису);
        - `hasSameId(a, b)` повертає `true`, коли записи описують одне бажання — їхні `id` однакові, навіть якщо це два різні об’єкти.

        Жодна з функцій не змінює записи.
      en: |
        Complete two functions that answer different questions:

        - `isSameRecord(a, b)` returns `true` only when `a` and `b` are **one and the same** object (two names of one record);
        - `hasSameId(a, b)` returns `true` when the records describe the same wish — their `id`s are equal, even if they are two different objects.

        Neither function changes the records.
    testTitles:
      "isSameRecord is true for two names of one object":
        uk: "isSameRecord дає true для двох змінних одного об’єкта"
        en: "isSameRecord is true for two names of one object"
      "isSameRecord is false for a lookalike copy":
        uk: "isSameRecord дає false для схожого, але окремого об’єкта"
        en: "isSameRecord is false for a lookalike, separate object"
      "hasSameId compares ids":
        uk: "hasSameId порівнює id"
        en: "hasSameId compares ids"
      "neither function changes the records":
        uk: "Жодна з функцій не змінює записи"
        en: "Neither function changes the records"
    hints:
      nudge:
        uk: "Перечитай, що саме порівнює `===` для об’єктів, а що — для тексту."
        en: "Re-read what exactly `===` compares for objects, and what for strings."
      explanation:
        uk: "Для об’єктів `===` відповідає на запитання «чи це той самий об’єкт?» — саме його ставить `isSameRecord`. `hasSameId` питає про вміст, тож там порівнюють не самі об’єкти, а поле, що визначає запис, — так само, як дві витрати можна порівняти за датою: `x.date === y.date`. Обережно з одним `=`: це присвоєння, а не порівняння."
        en: "For objects, `===` answers the question “is it the same object?” — exactly what `isSameRecord` asks. `hasSameId` asks about content, so it compares not the objects themselves but the field that identifies a record — just as two expenses can be compared by date: `x.date === y.date`. Beware of a single `=`: that is an assignment, not a comparison."
    solutionNote:
      uk: "`isSameRecord` перевіряє тотожність посилань: `===` для об’єктів дає `true` лише тоді, коли обидві змінні ведуть до одного об’єкта. `hasSameId` порівнює вміст — поля `id`, які є текстом, тобто примітивами. Обидва запитання корисні: перше каже, чи це буквально той самий об’єкт, друге — чи це той самий запис за змістом."
      en: "`isSameRecord` checks reference identity: for objects `===` gives `true` only when both names lead to one object. `hasSameId` compares content — the `id` fields, which are string primitives. Both questions are useful: the first tells whether it is literally the same object, the second whether it is the same record by meaning."
    feedback:
      - when: { test: "isSameRecord is false for a lookalike copy" }
        message:
          uk: "Два об’єкти з однаковими полями — усе одно два різні об’єкти, тож `isSameRecord` має дати `false`. Вона має перевіряти, чи обидва параметри ведуть до одного об’єкта, а не порівнювати поля."
          en: "Two objects with the same fields are still two different objects, so `isSameRecord` must give `false`. It must check whether both parameters lead to one object, not compare fields."
      - when: { test: "hasSameId compares ids" }
        message:
          uk: "Записи з однаковим `id` описують те саме бажання, навіть якщо це два окремі об’єкти: `hasSameId` має дати `true`, а для різних `id` — `false`. Якщо порівнюєш самі об’єкти через `===`, для окремих об’єктів отримаєш `false` — порівнюй їхні поля `id`."
          en: "Records with the same `id` describe the same wish even if they are two separate objects: `hasSameId` must give `true`, and `false` for different `id`s. If you compare the objects themselves with `===`, separate objects give `false` — compare their `id` fields."
      - when: { test: "neither function changes the records" }
        message:
          uk: "Жодна з функцій не має змінювати записи. Якщо в одній із них замість порівняння `===` стоїть присвоєння `=`, то `a.id = b.id` переписує `id`."
          en: "Neither function may change a record. If one of them has an assignment `=` instead of the comparison `===`, then `a.id = b.id` overwrites the `id`."
      - when: { test: "isSameRecord is true for two names of one object" }
        message:
          uk: "Для двох змінних одного об’єкта (`const alias = wish`) функція має повернути `true`."
          en: "For two names of one object (`const alias = wish`) the function must return `true`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-04
    body:
      uk: "У проєкті на той самий запис часто посилаються кілька місць: список, змінна з вибраним записом, параметр функції. Якщо функція змінить запис через будь-яке з них, він зміниться для всіх. Тому далі ти навчишся копіювати записи й оновлювати їх без мутацій."
      en: "In your project the same record is often held by several names: the list, a variable with the selected record, a function parameter. If a function changes the record through any of them, it changes for everyone. That is why next you will learn to copy records and update them without mutation."
