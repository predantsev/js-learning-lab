id: js-04-09-destructuring-spread
unit: JS-04
title:
  uk: "Деструктуризація і spread"
  en: "Destructuring and spread"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Деструктуризувати поля запису й елементи масиву, зокрема зі значеннями за замовчуванням і перейменуванням."
    en: "Destructure fields from a record and items from an array, with defaults and renaming."
  - uk: "Використовувати rest-шаблони й spread, щоб зібрати запис без одного поля чи злити зміни з копією, і передбачати, яке значення перемагає на спільному ключі."
    en: "Use rest patterns and spread to build a record without one field and to merge changes into a copy, predicting which value wins on overlapping keys."
prerequisites: [js-04-08-copying-shallow-deep, js-03-02-parameters-default-rest]
subskills:
  - { family: J-05, skill: "destructuring/spread", depth: practice }
glossary: [destructuring, rest-pattern, property-shorthand]
selfCheck: [defaults-and-null, to-label]

blocks:
  - id: unpack
    kind: explanation
    title:
      uk: "Дістаємо кілька полів одразу"
      en: "Taking several fields at once"
    body:
      uk: |
        [[destructuring|Деструктуризація]] — короткий спосіб дістати кілька полів одразу:

        ```js
        const { label, amountMinor } = expense;
        // the same as:
        // const label = expense.label;
        // const amountMinor = expense.amountMinor;
        ```

        Вона лише **читає**: `expense` лишається таким самим, жодне поле з нього не зникає. Змінна може називатися інакше, ніж поле, а ще можна задати значення за замовчуванням:

        ```js
        const { label: title, category = "other" } = expense;
        ```

        Значення за замовчуванням спрацьовує лише тоді, коли поле дає `undefined` (його немає або в ньому `undefined`), і **не** спрацьовує для `null` — точнісінько як у параметрів функції. Масив розкладають за позиціями: `const [first, second] = prices;`.
      en: |
        [[destructuring|Destructuring]] is a short way to take several fields at once:

        ```js
        const { label, amountMinor } = expense;
        // the same as:
        // const label = expense.label;
        // const amountMinor = expense.amountMinor;
        ```

        It only **reads**: `expense` stays exactly as it was, no field disappears from it. A field can get another name and a default value:

        ```js
        const { label: title, category = "other" } = expense;
        ```

        A default kicks in only when the field gives `undefined` (it is missing or holds `undefined`), and **not** for `null` — exactly like function parameters. An array is unpacked by position: `const [first, second] = prices;`.

  - id: defaults-and-null
    kind: prediction
    strings:
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
    prompt:
      uk: "У цього бажання ціна навмисно порожня — `null`. Що з’явиться в консолі?"
      en: "This wish deliberately has an empty price — `null`. What appears in the console?"
    code: |
      const wish = { id: "w-05", name: "%%tickets%%", price: null, acquired: false };
      const { price = 0, name } = wish;
      console.log(price);
      console.log(name);
      console.log(wish.price, wish.name === name);
    verify:
      logs: ["null", "%%tickets%%", "null true"]
    answer:
      type: choice
      options:
        - id: null-kept
          text:
            uk: "`null`, `Квитки на концерт`, `null true`"
            en: "`null`, `Concert tickets`, `null true`"
        - id: default-used
          text:
            uk: "`0`, `Квитки на концерт`, `null true`"
            en: "`0`, `Concert tickets`, `null true`"
          why:
            uk: "Значення за замовчуванням спрацьовує лише для `undefined`. `null` — справжнє значення: «ціни навмисно немає»."
            en: "A default kicks in only for `undefined`. `null` is a real value: “deliberately no price”."
        - id: fields-removed
          text:
            uk: "`null`, `Квитки на концерт`, `undefined false`"
            en: "`null`, `Concert tickets`, `undefined false`"
          why:
            uk: "Деструктуризація лише читає поля в нові змінні — з `wish` нічого не зникає. А `wish.name === name` порівнює два однакові тексти: `true`."
            en: "Destructuring only reads fields into new variables — nothing disappears from `wish`. And `wish.name === name` compares two equal strings: `true`."
        - id: both-wrong
          text:
            uk: "`0`, `Квитки на концерт`, `undefined false`"
            en: "`0`, `Concert tickets`, `undefined false`"
          why:
            uk: "Тут дві помилки: значення за замовчуванням не замінює `null`, а деструктуризація не прибирає поля з об’єкта."
            en: "Two mistakes here: a default does not replace `null`, and destructuring does not remove fields from the object."
      correct: [null-kept]
    explanation:
      uk: "Поле `price` існує і містить `null`, тож значення за замовчуванням `0` не потрібне — `price` дорівнює `null`. Деструктуризація лише скопіювала значення полів у нові змінні: `wish` не змінився, і `wish.name` — той самий текст, що й `name`."
      en: "The field `price` exists and holds `null`, so the default `0` is not used — `price` is `null`. Destructuring only copied the field values into new variables: `wish` did not change, and `wish.name` is the same string as `name`."

  - id: rest-and-merge
    kind: explanation
    title:
      uk: "Rest збирає, spread зливає"
      en: "Rest collects, spread merges"
    body:
      uk: |
        У деструктуризації можна зібрати «все інше» в новий об’єкт чи масив — це [[rest-pattern|rest-шаблон]]:

        ```js
        const { title, ...details } = task; // title on its own, details: a new object with every other own field
        const [first, ...others] = prices;  // a new array without the first element
        ```

        Spread робить зворотне — розкладає поля в новий об’єкт. Так зручно зливати зміни з копією запису:

        ```js
        const updated = { ...task, ...changes };
        ```

        Якщо ключ є в обох, перемагає **пізніший**: значення з `changes` перекриває значення з `task`. Поміняй їх місцями — і переможе `task`.

        Ще одне скорочення — [[property-shorthand|скорочений запис властивості]]: `{ title, priority }` означає `{ title: title, priority: priority }`. А деструктуризувати можна просто в параметрі: `function describe({ label, category }) { … }` — значення за замовчуванням там працюють так само, як після `const`.
      en: |
        Destructuring can collect “everything else” into a new object or array — that is a [[rest-pattern|rest pattern]]:

        ```js
        const { title, ...details } = task; // title on its own, details: a new object with every other own field
        const [first, ...others] = prices;  // a new array without the first element
        ```

        Spread does the opposite — it spreads fields into a new object. That makes it easy to merge changes into a copy of a record:

        ```js
        const updated = { ...task, ...changes };
        ```

        If a key is present in both, the **later** one wins: the value from `changes` overrides the value from `task`. Swap them, and `task` wins.

        One more shortcut is [[property-shorthand|property shorthand]]: `{ title, priority }` means `{ title: title, priority: priority }`. And you can destructure right in a parameter: `function describe({ label, category }) { … }` — defaults work there just as they do after `const`.

  - id: who-wins
    kind: prediction
    prompt:
      uk: "Зміну суми витрати злито з записом у двох порядках. Що з’явиться в консолі?"
      en: "A change of the expense amount is merged with the record in two orders. What appears in the console?"
    code: |
      const expense = { id: "e-03", amountMinor: 18000, category: "fun" };
      const changes = { amountMinor: 20000 };
      const a = { ...expense, ...changes };
      const b = { ...changes, ...expense };
      console.log(a.amountMinor, b.amountMinor, expense.amountMinor);
    verify:
      logs: ["20000 18000 18000"]
    answer:
      type: choice
      options:
        - id: later-wins
          text:
            uk: "`20000 18000 18000`"
            en: "`20000 18000 18000`"
        - id: changes-always
          text:
            uk: "`20000 20000 18000`"
            en: "`20000 20000 18000`"
          why:
            uk: "Spread не знає, де «зміни». У `b` запис `expense` іде пізніше, тож його `amountMinor` перекриває значення з `changes`."
            en: "Spread does not know which object holds “the changes”. In `b`, `expense` comes later, so its `amountMinor` overrides the value from `changes`."
        - id: first-wins
          text:
            uk: "`18000 18000 18000`"
            en: "`18000 18000 18000`"
          why:
            uk: "Spread не пропускає ключі, які вже є: у `a` пізніший `changes` перезаписує `amountMinor`."
            en: "Spread does not skip keys that already exist: in `a` the later `changes` overwrites `amountMinor`."
        - id: original-changed
          text:
            uk: "`20000 18000 20000`"
            en: "`20000 18000 20000`"
          why:
            uk: "Обидва літерали створюють нові об’єкти — сам `expense` ніхто не змінював."
            en: "Both literals create new objects — nobody changed `expense` itself."
      correct: [later-wins]
    explanation:
      uk: "У літералі пізніший ключ перекриває раніший. У `a` пізніше йде `changes`, тож сума — 20000; у `b` пізніше йде `expense`, тож сума — 18000. Оригінал не змінювався: обидва рази spread збирав новий об’єкт."
      en: "In a literal a later key overrides an earlier one. In `a`, `changes` comes later, so the amount is 20000; in `b`, `expense` comes later, so the amount is 18000. The original did not change: both times spread built a new object."

  - id: unpack-lab
    kind: example
    runtime: browser-js
    dir: unpack-lab
    entry: index.js
    strings:
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
    title:
      uk: "Розбираємо й збираємо справу"
      en: "Taking a task apart and putting it together"
    body:
      uk: |
        Деструктуризація зі значенням за замовчуванням, rest-шаблон і злиття змін. Запусти й переконайся, що оригінальна справа після всього лишилася такою самою.
      en: |
        Destructuring with a default, a rest pattern and merging changes. Run it and make sure the original task is still the same after all of it.
    tryIt:
      uk: "Перейменуй поле: `const { title: label } = task;` і виведи `label`. Потім поміняй порядок злиття на `{ ...changes, ...task }` і подивись, чиє `done` переможе. Наостанок додай у літерал `task` поле `note` і перевір, чи потрібне тепер значення за замовчуванням."
      en: "Rename the field: `const { title: label } = task;` and print `label`. Then swap the merge order to `{ ...changes, ...task }` and see whose `done` wins. Finally add a `note` field to the `task` literal and check whether the default is still needed."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    strings:
      mug: { uk: "Термочашка", en: "Travel mug" }
      pcs: { uk: "шт.", en: "pcs" }
      tagHome: { uk: "дім", en: "home" }
      tagGift: { uk: "подарунок", en: "gift" }
    items:
      - id: param-defaults
        from: js-03-02-parameters-default-rest
        prompt:
          uk: "Значення за замовчуванням у параметрах функції підкоряються тому самому правилу, що й у деструктуризації. Що виведе код?"
          en: "Parameter defaults follow the same rule as destructuring defaults. What does the code print?"
        code: |
          function describe(name, unit = "%%pcs%%", ...tags) {
            console.log(name, unit, tags.length);
          }
          describe("%%mug%%", undefined, "%%tagHome%%", "%%tagGift%%");
          describe("%%mug%%", null);
        verify:
          logs: ["%%mug%% %%pcs%% 2", "%%mug%% null 0"]
        answer:
          type: choice
          options:
            - id: undefined-only
              text:
                uk: "`Термочашка шт. 2`, а потім `Термочашка null 0`"
                en: "`Travel mug pcs 2`, then `Travel mug null 0`"
            - id: null-default
              text:
                uk: "`Термочашка шт. 2`, а потім `Термочашка шт. 0`"
                en: "`Travel mug pcs 2`, then `Travel mug pcs 0`"
              why:
                uk: "Значення за замовчуванням замінює лише `undefined`. `null` передано як справжнє значення, тож `unit` дорівнює `null`."
                en: "A default replaces only `undefined`. `null` was passed as a real value, so `unit` is `null`."
            - id: undefined-kept
              text:
                uk: "`Термочашка undefined 2`, а потім `Термочашка null 0`"
                en: "`Travel mug undefined 2`, then `Travel mug null 0`"
              why:
                uk: "Явно переданий `undefined` поводиться як пропущений аргумент — спрацьовує значення за замовчуванням."
                en: "An explicitly passed `undefined` behaves like a missing argument — the default kicks in."
            - id: rest-counts-all
              text:
                uk: "`Термочашка шт. 3`, а потім `Термочашка null 1`"
                en: "`Travel mug pcs 3`, then `Travel mug null 1`"
              why:
                uk: "Rest-параметр збирає лише аргументи **після** звичайних параметрів (`name` і `unit`): у першому виклику їх два, у другому — жодного."
                en: "A rest parameter collects only the arguments **after** the named ones (`name` and `unit`): two in the first call, none in the second."
          correct: [undefined-only]
        explanation:
          uk: "Параметри за замовчуванням і деструктуризація мають одне правило: значення за замовчуванням з’являється лише замість `undefined`. `null` — це справжнє значення. А `...tags` збирає зайві аргументи в масив."
          en: "Parameter defaults and destructuring follow one rule: a default appears only instead of `undefined`. `null` is a real value. And `...tags` collects the extra arguments into an array."

  - id: to-label
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: to-label
    entry: index.js
    strings:
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
    title:
      uk: "Підпис справи й запис без id"
      en: "A task label and a record without its id"
    instructions:
      uk: |
        Допиши дві функції:

        - `toLabel(task)` повертає підпис `назва · пріоритет`, наприклад `Здати книжки в бібліотеку · high`. Деструктуризуй справу просто в параметрі; якщо поля `priority` немає, пріоритет — `normal`.
        - `withoutId(record)` повертає **новий** об’єкт з усіма полями запису, крім `id`. Скористайся rest-шаблоном; оригінальний запис не змінюй.
      en: |
        Complete two functions:

        - `toLabel(task)` returns the label `title · priority`, for example `Return library books · high`. Destructure the task right in the parameter; if there is no `priority` field, the priority is `normal`.
        - `withoutId(record)` returns a **new** object with every field of the record except `id`. Use a rest pattern; do not change the original record.
    testTitles:
      "builds \"title · priority\"":
        uk: "Будує підпис «назва · пріоритет»"
        en: "Builds the label “title · priority”"
      "uses normal when priority is missing":
        uk: "Без поля priority використовує normal"
        en: "Uses normal when priority is missing"
      "withoutId returns every other field":
        uk: "withoutId повертає всі поля, крім id"
        en: "withoutId returns every field except id"
      "withoutId leaves the original record alone":
        uk: "withoutId не змінює оригінальний запис"
        en: "withoutId leaves the original record alone"
    hints:
      nudge:
        uk: "Подивись на приклад деструктуризації в параметрі в поясненні: значення за замовчуванням пишуть просто у фігурних дужках."
        en: "Look at the example of destructuring in a parameter in the explanation: the default is written right inside the curly braces."
      explanation:
        uk: "Деструктуризацію пишуть просто в дужках параметра: `function describe({ label, category = \"other\" })` одразу дістає з переданого запису два поля, а `category` отримає `\"other\"`, якщо такого поля немає. Зроби так само з `title` і `priority`. Для `withoutId` згадай rest-шаблон: він збирає всі інші поля в новий об’єкт і не чіпає оригінал."
        en: "Destructuring is written right inside the parameter brackets: `function describe({ label, category = \"other\" })` takes two fields from the record it receives, and `category` gets `\"other\"` if there is no such field. Do the same with `title` and `priority`. For `withoutId`, remember the rest pattern: it collects all the other fields into a new object and leaves the original alone."
    solutionNote:
      uk: "Деструктуризація в параметрі одразу дає функції потрібні поля, а значення за замовчуванням спрацьовує лише тоді, коли пріоритету немає (`undefined`). Rest-шаблон `{ id, ...rest }` збирає решту власних полів у **новий** об’єкт, тож оригінал не змінюється — на відміну від `delete record.id`."
      en: "Destructuring in the parameter gives the function the fields it needs at once, and the default kicks in only when there is no priority (`undefined`). The rest pattern `{ id, ...rest }` collects the remaining own fields into a **new** object, so the original does not change — unlike `delete record.id`."
    feedback:
      - when: { test: "uses normal when priority is missing" }
        message:
          uk: "Ця перевірка викликає `toLabel` для справи без поля `priority` і чекає підпис, що закінчується на `· normal`. Значення за замовчуванням можна задати просто в деструктуризації параметра."
          en: "This check calls `toLabel` for a task without a `priority` field and expects a label ending with `· normal`. A default can be set right in the parameter's destructuring."
      - when: { test: "withoutId leaves the original record alone" }
        message:
          uk: "Ця перевірка чекає, що оригінальний запис збереже свій `id`, а результат буде новим об’єктом. Якщо видаляєш поле через `delete` просто з `record`, це мутація оригіналу; новий об’єкт без `id` дає rest-шаблон."
          en: "This check expects the original record to keep its `id` and the result to be a new object. If you remove the field with `delete` straight from `record`, that mutates the original; a rest pattern gives a new object without `id`."
      - when: { test: "withoutId returns every other field" }
        message:
          uk: "Ця перевірка чекає об’єкт з усіма полями справи, крім `id`: `title`, `dueDate`, `done` і `priority` — і без власного поля `id`."
          en: "This check expects an object with every field of the task except `id`: `title`, `dueDate`, `done` and `priority` — and no own `id` field."
      - when: { test: "builds \"title · priority\"" }
        message:
          uk: "Ця перевірка викликає `toLabel` для справи з пріоритетом `high` і чекає `назва · high` — із пробілами навколо крапки `·`."
          en: "This check calls `toLabel` for a task with the priority `high` and expects `title · high` — with spaces around the dot `·`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-04
    body:
      uk: "Коли в проєкті збиратимеш оновлений запис із запису й зміни через `{ ...record, ...changes }`, пам’ятай, що пізніший ключ перемагає. А деструктуризація в параметрах зробить коротшими функції на кшталт `formatItemLabel` чи `formatTaskLabel`."
      en: "When your project builds an updated record from a record and a change with `{ ...record, ...changes }`, remember that the later key wins. And destructuring in parameters will make functions such as `formatItemLabel` or `formatTaskLabel` shorter."
