id: js-04-02-for-while
unit: JS-04
title:
  uk: "Повторюємо: for, while, do-while"
  en: "Repeating: for, while, do-while"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Відстежувати цикл `for` як початок → перевірка → тіло → крок і заповнювати його таблицю ітерацій для нуля, одного й кількох елементів."
    en: "Trace a `for` loop as initialize → check → body → update and fill its iteration table for zero, one and many elements."
  - uk: "Обирати між `for`, `while` і `do-while` та пояснювати, чому `do-while` виконує тіло щонайменше раз."
    en: "Choose between `for`, `while` and `do-while`, and explain why `do-while` runs its body at least once."
  - uk: "Пояснювати, як рекурсивний відлік стає циклом (базовий випадок — умовою виходу, рекурсивний виклик — кроком), і порівнювати дві траси."
    en: "Explain how a recursive countdown becomes a loop (the base case turns into the exit condition, the recursive call into the step) and compare the two traces."
prerequisites: [js-04-01-arrays-basics, js-02-05-if-else-switch]
subskills:
  - { family: J-03, skill: "for/while/do-while", depth: practice }
glossary: [loop, iteration, for-loop, while-loop, do-while]
selfCheck: [budget-stop, count-pending]

blocks:
  - id: four-steps
    kind: explanation
    title:
      uk: "Лічильник стає індексом"
      en: "The counter becomes an index"
    body:
      uk: |
        У розділі JS-02 ти вже писав [[counting-loop|лічильний цикл]] `for` і заповнював [[iteration-table|таблицю ітерацій]]. Тепер лічильник отримує нову роль — він стає **індексом** масиву. Так [[for-loop|цикл for]] проходить усі комірки від першої до останньої:

        ```js
        let sum = 0;
        for (let i = 0; i < prices.length; i++) {
          sum = sum + prices[i];
        }
        ```

        Порядок той самий: **початок** `let i = 0` — один раз; **перевірка** `i < prices.length` — перед **кожним** проходом; **тіло**, потім **крок** `i++` — і знову перевірка. Повторюваний блок — це [[loop|цикл]], а один прохід тіла — [[iteration|ітерація]].

        Нове тут — межа. Індекси починаються з 0, тож лічильник теж стартує з 0, а умова — `i < prices.length`. Для `[80, 45, 240]` таблиця ітерацій така:

        | Ітерація | `i` | `i < prices.length` | `prices[i]` | `sum` після |
        |---|---|---|---|---|
        | 1 | 0 | `0 < 3` → true | 80 | 80 |
        | 2 | 1 | `1 < 3` → true | 45 | 125 |
        | 3 | 2 | `2 < 3` → true | 240 | 365 |
        | — | 3 | `3 < 3` → false | — | цикл завершено |

        Коли цикл зупиняє сама умова, перевірок на одну більше, ніж ітерацій: остання дає `false`.
      en: |
        In JS-02 you already wrote a [[counting-loop|counting]] `for` loop and filled in an [[iteration-table|iteration table]]. Now the counter gets a new job — it becomes an array **index**. That is how a [[for-loop|for loop]] walks every slot from the first to the last:

        ```js
        let sum = 0;
        for (let i = 0; i < prices.length; i++) {
          sum = sum + prices[i];
        }
        ```

        The order is the same: **initialize** `let i = 0` — once; **check** `i < prices.length` — before **every** pass; the **body**, then the **update** `i++` — and the check again. The repeated block is a [[loop]], and one pass through the body is an [[iteration]].

        What is new is the bound. Indexes start at 0, so the counter starts at 0 too, and the condition is `i < prices.length`. For `[80, 45, 240]` the iteration table is:

        | Iteration | `i` | `i < prices.length` | `prices[i]` | `sum` after |
        |---|---|---|---|---|
        | 1 | 0 | `0 < 3` → true | 80 | 80 |
        | 2 | 1 | `1 < 3` → true | 45 | 125 |
        | 3 | 2 | `2 < 3` → true | 240 | 365 |
        | — | 3 | `3 < 3` → false | — | loop over |

        When the condition is what stops the loop, there is one more check than iterations: the last one gives `false`.

  - id: zero-one-many
    kind: visual
    visual: code-trace
    title:
      uk: "Той самий цикл для 0, 1 і 3 цін"
      en: "The same loop for 0, 1 and 3 prices"
    textEquivalent:
      uk: "Функцію total викликають тричі: з порожнім масивом, з масивом з однієї ціни 45 і з масивом [80, 45, 240]. Для порожнього масиву i починається з 0, перша ж перевірка 0 < 0 дає false, тіло не виконується жодного разу, і функція повертає 0. Для однієї ціни перевірка 0 < 1 правдива, тіло додає 45 до sum, крок робить i рівним 1, друга перевірка 1 < 1 хибна, і функція повертає 45 після однієї ітерації. Для трьох цін тіло виконується тричі: sum стає 80, 125 і 365, а четверта перевірка 3 < 3 завершує цикл. Консоль показує 0, 45 і 365."
      en: "The function total is called three times: with an empty array, with an array holding one price 45, and with [80, 45, 240]. For the empty array i starts at 0, the very first check 0 < 0 gives false, the body never runs, and the function returns 0. For one price the check 0 < 1 is true, the body adds 45 to sum, the update makes i equal to 1, the second check 1 < 1 is false, and the function returns 45 after one iteration. For three prices the body runs three times: sum becomes 80, 125 and 365, and the fourth check 3 < 3 ends the loop. The console shows 0, 45 and 365."
    spec:
      file: visuals/total.js
      captions:
        - at: { line: 9 }
          text:
            uk: "Одну й ту саму функцію `total` викличемо тричі: для порожнього списку, для однієї ціни й для трьох."
            en: "We will call the same function `total` three times: for an empty list, for one price and for three."
        - at: { line: 3, kind: cond, hit: 1 }
          text:
            uk: "Порожній список: `i` дорівнює 0, і перша ж перевірка `0 < 0` дає **false**. Тіло циклу не виконається жодного разу."
            en: "Empty list: `i` is 0, and the very first check `0 < 0` gives **false**. The loop body will not run even once."
        - at: { line: 6, kind: return, hit: 1 }
          text:
            uk: "Нуль ітерацій — і `total([])` повертає 0. Окрема перевірка на порожній список тут не знадобилася."
            en: "Zero iterations — and `total([])` returns 0. No separate empty-list check was needed."
        - at: { line: 3, kind: cond, hit: 2 }
          text:
            uk: "Одна ціна: перевірка `0 < 1` правдива, тож тіло виконається."
            en: "One price: the check `0 < 1` is true, so the body will run."
        - at: { line: 3, kind: update, hit: 1 }
          text:
            uk: "Тіло додало 45: `sum` дорівнює 45. Тепер **крок** `i++` — і знову перевірка."
            en: "The body added 45: `sum` is 45. Now the **update** `i++` — and the check again."
        - at: { line: 3, kind: cond, hit: 3 }
          text:
            uk: "`i` став 1, і `1 < 1` — **false**. Одна ітерація, дві перевірки."
            en: "`i` became 1, and `1 < 1` is **false**. One iteration, two checks."
        - at: { line: 4, hit: 2 }
          text:
            uk: "Три ціни. Перша ітерація: `i` — 0, тіло читає `prices[0]` — це 80."
            en: "Three prices. First iteration: `i` is 0, the body reads `prices[0]`, which is 80."
        - at: { line: 4, hit: 3 }
          text:
            uk: "Друга ітерація: `sum` уже 80, тепер додається `prices[1]` — 45."
            en: "Second iteration: `sum` is already 80, now `prices[1]` — 45 — is added."
        - at: { line: 4, hit: 4 }
          text:
            uk: "Третя ітерація: `sum` — 125, додається `prices[2]` — 240."
            en: "Third iteration: `sum` is 125, `prices[2]` — 240 — is added."
        - at: { line: 3, kind: cond, hit: 7 }
          text:
            uk: "Четверта перевірка: `3 < 3` — **false**. Три ітерації, чотири перевірки, `sum` дорівнює 365."
            en: "Fourth check: `3 < 3` is **false**. Three iterations, four checks, and `sum` is 365."
        - at: { line: 11, kind: end }
          text:
            uk: "Консоль: `0`, `45`, `365`. Один і той самий цикл правильно працює для нуля, одного й багатьох елементів."
            en: "Console: `0`, `45`, `365`. One and the same loop works for zero, one and many elements."

  - id: budget-stop
    kind: prediction
    prompt:
      uk: "Бюджет — 100. Цикл «купує» бажання по черзі, доки вистачає грошей. Що з’явиться в консолі?"
      en: "The budget is 100. The loop “buys” wishes one by one while the money lasts. What appears in the console?"
    code: |
      const prices = [45, 80, 18];
      let budget = 100;
      let i = 0;
      while (i < prices.length && budget >= prices[i]) {
        budget = budget - prices[i];
        console.log(prices[i], budget);
        i++;
      }
      console.log("i:", i);
    verify:
      logs: ["45 55", "i: 1"]
    answer:
      type: choice
      options:
        - id: one-purchase
          text:
            uk: "`45 55`, а потім `i: 1`"
            en: "`45 55`, then `i: 1`"
        - id: all-three
          text:
            uk: "Три покупки: `45 55`, `80 -25`, `18 -43`, а потім `i: 3`"
            en: "Three purchases: `45 55`, `80 -25`, `18 -43`, then `i: 3`"
          why:
            uk: "Умову `while` перевіряють перед **кожним** проходом, а не лише на старті. Перед другим проходом `55 >= 80` — це `false`, і цикл зупиняється."
            en: "The `while` condition is checked before **every** pass, not only at the start. Before the second pass `55 >= 80` is `false`, and the loop stops."
        - id: skips
          text:
            uk: "`45 55`, `18 37`, а потім `i: 3`"
            en: "`45 55`, `18 37`, then `i: 3`"
          why:
            uk: "Цикл не перестрибує через невдалий прохід: щойно умова стала `false`, він завершується повністю, навіть якщо далі є дешевші ціни."
            en: "The loop does not hop over a failed pass: as soon as the condition is `false`, it ends completely, even if cheaper prices come later."
        - id: none
          text:
            uk: "Лише `i: 0`"
            en: "Only `i: 0`"
          why:
            uk: "На старті умова правдива: `0 < 3` і `100 >= 45`. Тож тіло виконається принаймні раз."
            en: "At the start the condition is true: `0 < 3` and `100 >= 45`. So the body runs at least once."
      correct: [one-purchase]
    explanation:
      uk: "Перед першим проходом умова правдива: купуємо за 45, лишається 55. Перед другим проходом умову перевіряють **знову**: `55 >= 80` — `false`, і цикл закінчується, хоча в масиві ще є елементи. Тому `i` дорівнює 1."
      en: "Before the first pass the condition is true: we buy for 45 and 55 is left. Before the second pass the condition is checked **again**: `55 >= 80` is `false`, and the loop ends although the array still has elements. That is why `i` is 1."

  - id: three-loops
    kind: explanation
    title:
      uk: "for, while і do-while"
      en: "for, while and do-while"
    body:
      uk: |
        Той самий прохід можна записати трьома способами:

        ```js
        for (let i = 0; i < list.length; i++) { /* … */ }

        let w = 0;
        while (w < list.length) { /* … */ w++; }

        let d = 0;
        do { /* … */ d++; } while (d < list.length);
        ```

        - [[for-loop|for]] — коли проходиш масив або знаєш кількість повторів: початок, умова й крок стоять в одному рядку коду.
        - [[while-loop|while]] — коли зупинка залежить від умови, а не від лічильника: «поки вистачає бюджету».
        - [[do-while|do-while]] — коли тіло **мусить** виконатися хоча б раз, а вирішити, чи повторювати, можна лише після нього.

        `for` і `while` перевіряють умову **перед** тілом, тож для порожнього масиву тіло не виконається жодного разу. `do-while` перевіряє **після** тіла.
      en: |
        The same walk can be written three ways:

        ```js
        for (let i = 0; i < list.length; i++) { /* … */ }

        let w = 0;
        while (w < list.length) { /* … */ w++; }

        let d = 0;
        do { /* … */ d++; } while (d < list.length);
        ```

        - [[for-loop|for]] — when you walk an array or know the number of repeats: the start, the condition and the update sit on one line.
        - [[while-loop|while]] — when stopping depends on a condition rather than a counter: “while the budget lasts”.
        - [[do-while|do-while]] — when the body **must** run at least once and you can only decide about repeating after it.

        `for` and `while` check the condition **before** the body, so for an empty array the body never runs. `do-while` checks **after** the body.

  - id: do-while-empty
    kind: prediction
    prompt:
      uk: "Масив сум порожній. Що виведе цей `do-while`?"
      en: "The array of amounts is empty. What does this `do-while` print?"
    code: |
      const amounts = [];
      let i = 0;
      do {
        console.log("amount:", amounts[i]);
        i++;
      } while (i < amounts.length);
      console.log("i:", i);
    verify:
      logs: ["amount: undefined", "i: 1"]
    answer:
      type: choice
      options:
        - id: once
          text:
            uk: "`amount: undefined`, а потім `i: 1`"
            en: "`amount: undefined`, then `i: 1`"
        - id: never
          text:
            uk: "Лише `i: 0`"
            en: "Only `i: 0`"
          why:
            uk: "Так поводилися б `for` і `while`. `do-while` спершу виконує тіло й лише потім перевіряє умову."
            en: "That is how `for` and `while` would behave. `do-while` runs the body first and checks the condition only afterwards."
        - id: error
          text:
            uk: "Помилку: у порожньому масиві немає `amounts[0]`"
            en: "An error: an empty array has no `amounts[0]`"
          why:
            uk: "Читання комірки, якої немає, дає `undefined`, а не помилку (урок про масиви). Помилка з’явилася б, якби код далі читав якусь властивість цього `undefined`."
            en: "Reading a slot that does not exist gives `undefined`, not an error (the arrays lesson). An error would appear only if the code then read a property of that `undefined`."
      correct: [once]
    explanation:
      uk: "Тіло `do-while` виконується до першої перевірки, тож навіть для порожнього масиву воно спрацює один раз і прочитає `amounts[0]` — `undefined`. Лише потім `1 < 0` дає `false`. Тому масиви обходять `for` або `while`: для порожнього списку вони чесно роблять нуль ітерацій."
      en: "The body of a `do-while` runs before the first check, so even for an empty array it runs once and reads `amounts[0]` — `undefined`. Only then does `1 < 0` give `false`. That is why arrays are walked with `for` or `while`: for an empty list they honestly make zero iterations."

  - id: three-ways
    kind: example
    runtime: browser-js
    dir: three-ways
    entry: index.js
    title:
      uk: "Одна сума — три цикли"
      en: "One total — three loops"
    body:
      uk: |
        Тут суму витрат рахують трьома циклами. Суми записано в мінорних одиницях — копійках, — тож 84550 означає 845,50. Запусти: усі три цикли дають однаковий результат.
      en: |
        Here the total of the expenses is computed by three loops. Amounts are in minor units (kopiykas or cents), so 84550 means 845.50. Run it: all three loops give the same result.
    tryIt:
      uk: "Заміни масив на порожній `[]` і запусти знову. `for` і `while` дадуть `0`, а `do-while` — `NaN`: його тіло встигло додати `undefined`, а `0 + undefined` — «не число». Потім спробуй масив з однієї суми."
      en: "Replace the array with an empty `[]` and run again. `for` and `while` give `0`, but `do-while` gives `NaN`: its body managed to add `undefined`, and `0 + undefined` is “not a number”. Then try an array with a single amount."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    strings:
      go: { uk: "старт!", en: "go!" }
    items:
      - id: per-iteration
        from: js-03-09-debug-captured-bindings
        prompt:
          uk: "Кожна ітерація кладе в масив функцію, що повертає `i`. Що виведе код?"
          en: "Every iteration puts a function that returns `i` into an array. What does the code print?"
        code: |
          const readers = [];
          for (let i = 0; i < 3; i++) {
            readers.push(() => i);
          }
          console.log(readers[0](), readers[2]());
        verify:
          logs: ["0 2"]
        answer:
          type: choice
          options:
            - id: own-binding
              text:
                uk: "`0 2`"
                en: "`0 2`"
            - id: shared
              text:
                uk: "`3 3`"
                en: "`3 3`"
              why:
                uk: "Так було б із `var`: одна змінна на весь цикл. `let` у заголовку `for` створює **нову** прив’язку `i` для кожної ітерації."
                en: "That would happen with `var`: one variable for the whole loop. `let` in a `for` header creates a **new** binding of `i` for every iteration."
            - id: last
              text:
                uk: "`2 2`"
                en: "`2 2`"
              why:
                uk: "Функції не бачать «останнє» значення: кожна захопила `i` своєї ітерації."
                en: "The functions do not see “the last” value: each one captured the `i` of its own iteration."
          correct: [own-binding]
        explanation:
          uk: "Кожна ітерація `for (let i …)` отримує власну прив’язку `i`, і функція, створена в ній, пам’ятає саме її. Тому функція з ітерації 0 повертає 0, а з ітерації 2 — 2."
          en: "Every iteration of `for (let i …)` gets its own binding of `i`, and the function created in it remembers exactly that one. So the function from iteration 0 returns 0 and the one from iteration 2 returns 2."
      - id: base-case
        from: js-03-08-recursion-base-case
        prompt:
          uk: "Що виведе цей рекурсивний відлік?"
          en: "What does this recursive countdown print?"
        code: |
          function countdown(n) {
            if (n === 0) {
              console.log("%%go%%");
              return;
            }
            console.log(n);
            countdown(n - 1);
          }
          countdown(2);
        verify:
          logs: ["2", "1", "%%go%%"]
        answer:
          type: choice
          options:
            - id: down
              text:
                uk: "`2`, `1`, `старт!`"
                en: "`2`, `1`, `go!`"
            - id: with-zero
              text:
                uk: "`2`, `1`, `0`, `старт!`"
                en: "`2`, `1`, `0`, `go!`"
              why:
                uk: "Коли `n` стає 0, спрацьовує базовий випадок: він друкує `старт!` і повертається, не дійшовши до `console.log(n)`."
                en: "When `n` becomes 0, the base case fires: it prints `go!` and returns before reaching `console.log(n)`."
            - id: reversed
              text:
                uk: "`старт!`, `1`, `2`"
                en: "`go!`, `1`, `2`"
              why:
                uk: "Кожен виклик спершу друкує своє `n` і лише потім викликає наступний."
                en: "Each call prints its own `n` first and only then makes the next call."
            - id: forever
              text:
                uk: "Нескінченно багато рядків у консолі: функція викликає сама себе"
                en: "Lines forever: the function calls itself"
              why:
                uk: "Базовий випадок `n === 0` зупиняє рекурсію, а кожен виклик зменшує `n` на 1, тож рано чи пізно `n` стає 0."
                en: "The base case `n === 0` stops the recursion, and every call lowers `n` by 1, so sooner or later `n` becomes 0."
          correct: [down]
        explanation:
          uk: "Базовий випадок `n === 0` зупиняє рекурсію, а виклик `countdown(n - 1)` щоразу наближає до нього. Цикл тримається на тих самих двох речах: на умові, що його завершує, і на кроці, який наближає до цієї умови."
          en: "The base case `n === 0` stops the recursion, and the call `countdown(n - 1)` moves closer to it each time. A loop rests on the same two things: a condition that ends it and a step that moves towards that condition."

  - id: recursion-to-loop
    kind: explanation
    title:
      uk: "Від рекурсії до циклу"
      en: "From recursion to a loop"
    body:
      uk: |
        Рекурсивний відлік і цикл — дві форми однієї думки:

        ```js
        function countdown(n) {
          if (n === 0) {          // базовий випадок
            return "done";
          }
          return countdown(n - 1); // крок до базового випадку
        }

        function countdownLoop(n) {
          while (n > 0) {         // умова продовження: «ще не базовий випадок»
            n = n - 1;            // той самий крок
          }
          return "done";
        }
        ```

        Базовий випадок стає умовою виходу, рекурсивний виклик — кроком циклу. Різниця видна в трасі: рекурсія складає в [[call-stack|call stack]] новий кадр на кожен виклик, а цикл увесь час працює в одному кадрі й лише змінює `n`. Пройди обидві траси нижче.
      en: |
        A recursive countdown and a loop are two shapes of one idea:

        ```js
        function countdown(n) {
          if (n === 0) {          // base case
            return "done";
          }
          return countdown(n - 1); // a step towards the base case
        }

        function countdownLoop(n) {
          while (n > 0) {         // keep going: "not the base case yet"
            n = n - 1;            // the same step
          }
          return "done";
        }
        ```

        The base case becomes the exit condition, the recursive call becomes the loop's step. The difference shows in the trace: recursion stacks a new frame on the [[call-stack|call stack]] for every call, while the loop works in one frame the whole time and only changes `n`. Step through both traces below.

  - id: stack-or-loop
    kind: visual
    visual: code-trace
    title:
      uk: "Рекурсія складає кадри, цикл — ні"
      en: "Recursion stacks frames, a loop does not"
    textEquivalent:
      uk: "Спершу виконується countdown(2). Кожен рекурсивний виклик додає в call stack новий кадр із власним n: 2, 1, 0. Коли n дорівнює 0, спрацьовує базовий випадок і повертає done, після чого кадри знімаються один за одним, передаючи done назад. На вершині стек тримав три кадри countdown. Потім виконується countdownLoop(2): у стеку лише один кадр, умова n > 0 перевіряється тричі (n = 2, 1, 0), крок n = n - 1 двічі змінює ту саму змінну, і функція повертає done. Обидва виклики друкують done: результат однаковий, траси різні."
      en: "First countdown(2) runs. Every recursive call adds a new frame with its own n to the call stack: 2, 1, 0. When n is 0 the base case fires and returns done, and the frames come off one by one, passing done back. At its peak the stack held three countdown frames. Then countdownLoop(2) runs: there is only one frame on the stack, the condition n > 0 is checked three times (n = 2, 1, 0), the step n = n - 1 changes the same variable twice, and the function returns done. Both calls print done: the same result, different traces."
    spec:
      file: visuals/countdown.js
      captions:
