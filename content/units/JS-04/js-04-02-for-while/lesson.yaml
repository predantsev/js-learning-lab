  - id: count-pending
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: count-pending
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
    title:
      uk: "Скільки справ ще не зроблено?"
      en: "How many tasks are still pending?"
    instructions:
      uk: |
        Функція `countPending(tasks)` має повернути, скільки справ у списку ще не виконано, тобто скільки записів мають `done: false`. Пройди список циклом `for` (або `while`) і рахуй.

        Перевір себе на крайніх випадках: порожній список (має бути 0), список з однієї справи і список, де невиконана справа стоїть першою або останньою.
      en: |
        The function `countPending(tasks)` must return how many tasks in the list are not done yet, that is, how many records have `done: false`. Walk the list with a `for` loop (or `while`) and count.

        Check yourself on the edge cases: an empty list (it must give 0), a list with one task, and a list where the pending task comes first or last.
    testTitles:
      "counts the pending tasks":
        uk: "Рахує невиконані справи"
        en: "Counts the pending tasks"
      "returns 0 for an empty list":
        uk: "Для порожнього списку повертає 0"
        en: "Returns 0 for an empty list"
      "counts a pending task at the start":
        uk: "Рахує невиконану справу на початку списку"
        en: "Counts a pending task at the start of the list"
      "counts a pending task at the end":
        uk: "Рахує невиконану справу в кінці списку"
        en: "Counts a pending task at the end of the list"
      "works for a single task":
        uk: "Працює для списку з однієї справи"
        en: "Works for a list with a single task"
    hints:
      nudge:
        uk: "Подивись на таблицю ітерацій на початку уроку: цикл має відвідати кожен індекс від 0 до `tasks.length - 1`."
        en: "Look at the iteration table at the start of the lesson: the loop must visit every index from 0 to `tasks.length - 1`."
      explanation:
        uk: "Лічильник у циклі працює так: щоб, наприклад, порахувати ціни понад 100, на кожній ітерації перевіряють поточний елемент `prices[i] > 100` і, якщо так, збільшують лічильник на 1. Тут поточний елемент — справа, і перевіряти треба її поле `done`. Поверни лічильник уже після циклу, а не всередині нього."
        en: "A counter in a loop works like this: to count prices over 100, for example, every iteration checks the current element `prices[i] > 100` and, if it holds, increases the counter by 1. Here the current element is a task, and the thing to check is its `done` field. Return the counter after the loop, not inside it."
    solutionNote:
      uk: "Цикл `for` відвідує кожен індекс від 0 до `tasks.length - 1`, а для порожнього списку не робить жодної ітерації — тож 0 виходить сам собою, без окремої перевірки. Варіант із `while` теж правильний; `do-while` тут не підходить, бо для порожнього списку зазирнув би в запис, якого немає."
      en: "The `for` loop visits every index from 0 to `tasks.length - 1` and makes no iterations for an empty list — so 0 comes out by itself, without a separate check. A `while` version is correct too; `do-while` does not fit here because for an empty list it would look into a record that does not exist."
    feedback:
      - when: { test: "counts a pending task at the start" }
        message:
          uk: "Ця перевірка дає три справи, з яких невиконана лише перша, і чекає 1. Перевір першу ітерацію: чи починається лічильник циклу з 0? І чи рахуєш ти саме справи з `done: false`?"
          en: "This check gives three tasks of which only the first is pending, and expects 1. Check the first iteration: does the loop counter start at 0? And do you count exactly the tasks with `done: false`?"
      - when: { test: "counts a pending task at the end" }
        message:
          uk: "Ця перевірка дає три справи, з яких невиконана лише остання, і чекає 1. Склади таблицю ітерацій для трьох справ: чи доходить `i` до останнього індексу, 2?"
          en: "This check gives three tasks of which only the last is pending, and expects 1. Make the iteration table for three tasks: does `i` reach the last index, 2?"
      - when: { test: "returns 0 for an empty list" }
        message:
          uk: "Ця перевірка викликає `countPending([])` і чекає 0: для порожнього списку тіло циклу не має виконатися жодного разу. Якщо використовуєш `do-while`, пам’ятай, що він виконує тіло ще до перевірки."
          en: "This check calls `countPending([])` and expects 0: for an empty list the loop body must not run at all. If you use `do-while`, remember that it runs the body before the check."
      - when: { error: TypeError }
        message:
          uk: "Якщо в повідомленні `reading 'done'`, код читає поле `done` в `undefined` — у запису, якого немає. Так буває, коли тіло виконується для порожнього списку (`do-while`) або коли умова пускає зайву ітерацію за кінцем (`<=`). Якщо ж кожна перевірка пише `… is not a function`, програма зупинилася ще під час запуску: спершу виправ помилку з картки над перевірками."
          en: "If the message says `reading 'done'`, the code reads the `done` field of `undefined` — a record that does not exist. That happens when the body runs for an empty list (`do-while`) or when the condition lets in an extra iteration past the end (`<=`). If every check says `… is not a function` instead, the program stopped while it was starting: fix the error from the card above the checks first."
      - when: { test: "counts the pending tasks" }
        message:
          uk: "Ця перевірка дає три справи, дві з них — з `done: false`, і чекає 2. Лічильник має збільшуватися всередині циклу лише для таких справ, а функція — повертати його вже після циклу."
          en: "This check gives three tasks, two of them with `done: false`, and expects 2. The counter must grow inside the loop for exactly those tasks, and the function must return it after the loop."

