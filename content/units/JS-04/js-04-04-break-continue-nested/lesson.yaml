id: js-04-04-break-continue-nested
unit: JS-04
title:
  uk: "break, continue і вкладені цикли"
  en: "break, continue and nested loops"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачати, на який цикл діють `break` і `continue` у вкладених циклах і в `switch` усередині циклу."
    en: "Predict which loop `break` and `continue` affect inside nested loops and inside a `switch` within a loop."
  - uk: "Писати вкладений цикл, що зупиняється на першому збігу, виходить з обох циклів, коли треба, і правильно обробляє порожній внутрішній список."
    en: "Write a nested loop that stops at the first match, leaves both loops when needed and handles an empty inner list."
prerequisites: [js-04-03-termination-off-by-one, js-02-05-if-else-switch]
subskills:
  - { family: J-03, skill: "break/continue", depth: intro }
  - { family: J-03, skill: "nested/empty loops", depth: intro }
glossary: [break, continue, nested-loop, labeled-statement]
selfCheck: [first-expensive, shared-category]

blocks:
  - id: skip-or-stop
    kind: explanation
    title:
      uk: "continue пропускає, break зупиняє"
      en: "continue skips, break stops"
    body:
      uk: |
        Іноді цикл не треба проходити до кінця:

        - [[continue]] пропускає **решту поточної ітерації** й переходить до наступної (у `for` — через крок).
        - [[break]] **зупиняє цикл** повністю: виконання йде далі з рядка коду після циклу.

        ```js
        for (let i = 0; i < tasks.length; i++) {
          if (tasks[i].done) {
            continue; // already done: skip it
          }
          if (tasks[i].priority === "high") {
            console.log(tasks[i].title);
            break; // the first urgent task is enough
          }
        }
        ```

        Цикл усередині іншого циклу називають [[nested-loop|вкладеним]]: на кожну ітерацію зовнішнього внутрішній проходить свій список від початку. І головне правило: `break` і `continue` діють лише на **найближчий** цикл, у якому стоять.
      en: |
        Sometimes a loop does not need to run to the end:

        - [[continue]] skips **the rest of the current iteration** and moves on to the next one (in a `for` loop, through the update).
        - [[break]] **stops the loop** completely: execution goes on from the line after the loop.

        ```js
        for (let i = 0; i < tasks.length; i++) {
          if (tasks[i].done) {
            continue; // already done: skip it
          }
          if (tasks[i].priority === "high") {
            console.log(tasks[i].title);
            break; // the first urgent task is enough
          }
        }
        ```

        A loop inside another loop is called a [[nested-loop|nested loop]]: for every iteration of the outer loop, the inner one walks its list from the start. And the key rule: `break` and `continue` act only on the **nearest** loop they stand in.

  - id: first-expensive
    kind: prediction
    strings:
      tech: { uk: "Техніка", en: "Tech" }
      home: { uk: "Дім", en: "Home" }
      sport: { uk: "Спорт", en: "Sport" }
    prompt:
      uk: "Для кожної категорії цикл друкує першу ціну понад 100, пропускаючи бажання без ціни. Що з’явиться в консолі?"
      en: "For each category the loop prints the first price over 100, skipping wishes without a price. What appears in the console?"
    code: |
      const groups = [
        { category: "%%tech%%", prices: [80, null, 240, 300] },
        { category: "%%home%%", prices: [] },
        { category: "%%sport%%", prices: [null, 150] },
      ];
      for (let g = 0; g < groups.length; g++) {
        console.log(groups[g].category);
        for (let p = 0; p < groups[g].prices.length; p++) {
          const price = groups[g].prices[p];
          if (price === null) {
            continue;
          }
          if (price > 100) {
            console.log("- " + price);
            break;
          }
        }
      }
    verify:
      logs: ["%%tech%%", "- 240", "%%home%%", "%%sport%%", "- 150"]
    answer:
      type: choice
      options:
        - id: per-group
          text:
            uk: "`Техніка`, `- 240`, `Дім`, `Спорт`, `- 150`"
            en: "`Tech`, `- 240`, `Home`, `Sport`, `- 150`"
        - id: stops-all
          text:
            uk: "`Техніка`, `- 240`"
            en: "`Tech`, `- 240`"
          why:
            uk: "`break` виходить лише з найближчого — внутрішнього — циклу. Зовнішній цикл іде далі до наступної категорії."
            en: "`break` leaves only the nearest — inner — loop. The outer loop goes on to the next category."
        - id: no-break
          text:
            uk: "`Техніка`, `- 240`, `- 300`, `Дім`, `Спорт`, `- 150`"
            en: "`Tech`, `- 240`, `- 300`, `Home`, `Sport`, `- 150`"
          why:
            uk: "Після першої знахідки `break` зупиняє внутрішній цикл, тож до 300 справа не доходить."
            en: "After the first match `break` stops the inner loop, so 300 is never reached."
        - id: continue-stops
          text:
            uk: "`Техніка`, `Дім`, `Спорт`"
            en: "`Tech`, `Home`, `Sport`"
          why:
            uk: "`continue` пропускає лише поточну ітерацію з `null`, а не весь цикл: перевірка цін іде далі."
            en: "`continue` skips only the current iteration with `null`, not the whole loop: checking the prices goes on."
      correct: [per-group]
    explanation:
      uk: "У першій категорії `null` пропущено через `continue`, 240 надруковано, і `break` вийшов із внутрішнього циклу — 300 уже не перевірялося. Зовнішній цикл пішов далі: у категорії без цін внутрішній цикл зробив нуль ітерацій, а в третій знову спрацювали `continue` і `break`."
      en: "In the first category `null` was skipped with `continue`, 240 was printed, and `break` left the inner loop — 300 was never checked. The outer loop went on: for the category without prices the inner loop made zero iterations, and in the third one `continue` and `break` fired again."

  - id: nested-trace
    kind: visual
    visual: code-trace
    title:
      uk: "Куди стрибає виконання після continue і break"
      en: "Where execution jumps after continue and break"
    textEquivalent:
      uk: "Зовнішній цикл проходить три групи: tech із цінами [80, null, 240, 300], home без цін і sport із цінами [null, 150]. У tech ціна null веде до continue: решта тіла пропускається, і внутрішній цикл просто переходить до наступного p. Ціна 240 більша за 100, тож програма друкує «tech 240», а break виходить лише з внутрішнього циклу: виконання продовжується з кроку зовнішнього циклу, і 300 не перевіряється. У home внутрішня перевірка 0 < 0 одразу хибна — нуль ітерацій, жодної помилки. У sport null знову пропущено, 150 надруковано, і break знову виходить лише з внутрішнього циклу. Другий пошук шукає першу ціну понад 200 у будь-якій групі: зовнішній цикл має мітку search, тому break search після знахідки 240 виходить з обох циклів одразу, і виконання продовжується після позначеного циклу. Консоль: «tech 240», «sport 150», «found: 240»."
      en: "The outer loop walks three groups: tech with prices [80, null, 240, 300], home with no prices, and sport with [null, 150]. In tech the null price leads to continue: the rest of the body is skipped and the inner loop simply moves to the next p. The price 240 is over 100, so the program prints “tech 240”, and break leaves only the inner loop: execution resumes at the outer loop's update, and 300 is never checked. In home the inner check 0 < 0 is false at once — zero iterations, no error. In sport null is skipped again, 150 is printed, and break once more leaves only the inner loop. The second search looks for the first price over 200 in any group: the outer loop carries the label search, so break search after finding 240 leaves both loops at once, and execution resumes after the labeled loop. Console: “tech 240”, “sport 150”, “found: 240”."
    spec:
      file: visuals/nested.js
      captions:
        - at: { line: 7, kind: cond, hit: 1 }
          text:
            uk: "Зовнішній цикл іде по групах: `g = 0` — група `tech`."
            en: "The outer loop walks the groups: `g = 0` — the `tech` group."
        - at: { line: 11, hit: 1 }
          text:
            uk: "`prices[1]` — це `null`, і зараз виконається `continue`: решта тіла для **цієї** ціни пропускається."
            en: "`prices[1]` is `null`, and `continue` runs now: the rest of the body is skipped for **this** price."
        - at: { line: 9, kind: cond, hit: 3 }
          text:
            uk: "Після `continue` внутрішній цикл просто пішов далі через свій крок: тепер `p` дорівнює 2."
            en: "After `continue` the inner loop simply moved on through its update: `p` is 2 now."
        - at: { line: 15, hit: 1 }
          text:
            uk: "240 > 100: у консолі `tech 240`. Тепер `break` — він вийде **лише з внутрішнього** циклу, тож 300 ніхто не перевірить."
            en: "240 > 100: the console shows `tech 240`. Now `break` — it leaves **only the inner** loop, so nobody will check 300."
        - at: { line: 7, kind: update, hit: 1 }
          text:
            uk: "Виконання продовжилося з кроку **зовнішнього** циклу: він переходить до наступної групи."
            en: "Execution resumed at the **outer** loop's update: it moves on to the next group."
        - at: { line: 9, kind: cond, hit: 4 }
          text:
            uk: "У `home` цін немає: перша ж внутрішня перевірка `0 < 0` — false. Нуль ітерацій, жодної помилки — зовнішній цикл іде далі."
            en: "`home` has no prices: the very first inner check `0 < 0` is false. Zero iterations, no error — the outer loop goes on."
        - at: { line: 15, hit: 2 }
          text:
            uk: "У `sport` `null` знову пропущено, 150 надруковано, і `break` знову виходить лише з внутрішнього циклу."
            en: "In `sport` the `null` is skipped again, 150 is printed, and `break` once more leaves only the inner loop."
        - at: { line: 21, kind: cond, hit: 1 }
          text:
            uk: "Другий пошук — перша ціна понад 200 у **будь-якій** групі. Зовнішній цикл має мітку `search:`."
            en: "The second search: the first price over 200 in **any** group. The outer loop carries the label `search:`."
        - at: { line: 26, hit: 1 }
          text:
            uk: "240 > 200, `found` — 240. `break search` виходить із циклу, **названого** `search`, — тобто з обох циклів одразу."
            en: "240 > 200, `found` is 240. `break search` leaves the loop **named** `search` — that is, both loops at once."
        - at: { line: 30, hit: 1 }
          text:
            uk: "Виконання продовжилося одразу після позначеного циклу: решту груп не відвідано."
            en: "Execution resumed right after the labeled loop: the remaining groups were never visited."
        - at: { line: 30, kind: end }
          text:
            uk: "Консоль: `tech 240`, `sport 150`, `found: 240`."
            en: "Console: `tech 240`, `sport 150`, `found: 240`."

  - id: labels
    kind: explanation
    title:
      uk: "Як вийти з двох циклів одразу"
      en: "How to leave two loops at once"
    body:
      uk: |
        Щоб `break` зупинив зовнішній цикл, цей цикл треба назвати: поставити перед ним мітку з двокрапкою. Це [[labeled-statement|позначена інструкція]]:

        ```js
        search: for (let g = 0; g < groups.length; g++) {
          for (let p = 0; p < groups[g].prices.length; p++) {
            if (groups[g].prices[p] > 200) {
              break search; // leaves both loops
            }
          }
        }
        ```

        Мітки в реальному коді трапляються рідко. Усередині функції простіше написати `return`: він виходить із функції, а отже, з усіх її циклів одразу.

        Порожній внутрішній список — не проблема: перша ж перевірка `0 < 0` дає `false`, і внутрішній цикл робить нуль ітерацій. Проблема буває, коли код **після** внутрішнього циклу розраховує, що той щось знайшов.
      en: |
        To make `break` stop the outer loop, that loop needs a name: put a label with a colon in front of it. That is a [[labeled-statement|labeled statement]]:

        ```js
        search: for (let g = 0; g < groups.length; g++) {
          for (let p = 0; p < groups[g].prices.length; p++) {
            if (groups[g].prices[p] > 200) {
              break search; // leaves both loops
            }
          }
        }
        ```

        Labels are rare in real code. Inside a function it is simpler to write `return`: it leaves the function, and therefore all of its loops at once.

        An empty inner list is no problem: the very first check `0 < 0` gives `false`, and the inner loop makes zero iterations. Trouble starts when code **after** the inner loop assumes it found something.

  - id: move-the-break
    kind: example
    runtime: browser-js
    dir: move-the-break
    entry: index.js
    strings:
      over: { uk: "  перша понад 200,00:", en: "  first over 200.00:" }
    title:
      uk: "Переставляємо break"
      en: "Moving the break"
    body:
      uk: |
        Витрати згруповано за категоріями, суми — у мінорних одиницях (20000 — це 200,00). Для кожної категорії програма шукає першу витрату понад 200,00. Запусти й порівняй консоль із кодом: категорія `home` порожня, і це нічого не ламає.
      en: |
        Expenses are grouped by category, amounts are in minor units (20000 is 200.00). For each category the program looks for the first expense over 200.00. Run it and match the console with the code: the `home` category is empty, and that breaks nothing.
    tryIt:
      uk: |
        1. Перенеси `break` у зовнішній цикл — одразу після закривальної дужки внутрішнього — і запусти: тепер програма зупиниться після першої категорії.
        2. Поверни `break` на місце, постав мітку `search:` перед зовнішнім `for` і заміни `break` на `break search`: пошук закінчиться на першій знайденій витраті в усіх категоріях.
      en: |
        1. Move the `break` into the outer loop — right after the inner loop's closing brace — and run: now the program stops after the first category.
        2. Put the `break` back, add the label `search:` before the outer `for` and replace `break` with `break search`: the search ends at the first expense found in any category.

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: switch-in-loop
        from: js-02-05-if-else-switch
        prompt:
          uk: "`switch` стоїть усередині циклу. Що виведе код?"
          en: "A `switch` sits inside a loop. What does the code print?"
        code: |
          const priorities = ["high", "low", "normal"];
          for (let i = 0; i < priorities.length; i++) {
            switch (priorities[i]) {
              case "high":
                console.log(i, "high");
                break;
              default:
                console.log(i, "other");
            }
          }
        verify:
          logs: ["0 high", "1 other", "2 other"]
        answer:
          type: choice
          options:
            - id: all-three
              text:
                uk: "`0 high`, `1 other`, `2 other`"
                en: "`0 high`, `1 other`, `2 other`"
            - id: loop-stops
              text:
                uk: "Лише `0 high`"
                en: "Only `0 high`"
              why:
                uk: "`break` у `case` виходить лише зі `switch` — найближчої конструкції, яку він уміє зупинити. Цикл іде далі."
                en: "A `break` in a `case` leaves only the `switch` — the nearest construct it can stop. The loop goes on."
            - id: fallthrough
              text:
                uk: "`0 high`, `0 other`, `1 other`, `2 other`"
                en: "`0 high`, `0 other`, `1 other`, `2 other`"
              why:
                uk: "Провалювання в `default` сталося б без `break`. Тут `break` є, тож після `case \"high\"` виконання виходить зі `switch`."
                en: "Falling through into `default` would happen without a `break`. Here the `break` is present, so after `case \"high\"` execution leaves the `switch`."
          correct: [all-three]
        explanation:
          uk: "`break` діє на найближчу конструкцію, з якої вміє виходити: тут це `switch`, а не цикл. Він лише не дає провалитися в `default`, а цикл проходить усі три пріоритети."
          en: "`break` acts on the nearest construct it can leave: here that is the `switch`, not the loop. It only prevents falling into `default`, and the loop goes through all three priorities."

  - id: shared-category
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: shared-category
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      tech: { uk: "Техніка", en: "Tech" }
      home: { uk: "Дім", en: "Home" }
      sport: { uk: "Спорт", en: "Sport" }
    title:
      uk: "Перша пара з однаковою категорією"
      en: "The first pair with a shared category"
    instructions:
      uk: |
        Допиши `findFirstSharedCategory(items)`. Вона бере бажання по черзі від початку списку й для кожного шукає «пару» серед бажань **після** нього — з тією самою категорією. Поверни масив із двох записів `[перше, його пара]` для першого бажання, якому знайшлася пара, і одразу зупинись.

        - Бажання без категорії (`category: null`) не рахуються: двох «нічого» не вважаємо спільною категорією.
        - Якщо пари немає (зокрема для порожнього списку чи одного бажання), поверни `null`.

        Каркас із двома циклами вже є — додай перевірки всередині.
      en: |
        Complete `findFirstSharedCategory(items)`. It takes the wishes one by one from the start of the list and, for each one, looks for a “partner” among the wishes **after** it — with the same category. Return an array of two records `[first, its partner]` for the first wish that has a partner, and stop at once.

        - Wishes without a category (`category: null`) do not count: two “nothings” are not a shared category.
        - If there is no pair (including an empty list or a single wish), return `null`.

        The skeleton with two loops is already there — add the checks inside.
    testTitles:
      "returns the first pair that shares a category":
        uk: "Повертає першу пару зі спільною категорією"
        en: "Returns the first pair that shares a category"
      "finds a partner far away in the list":
        uk: "Знаходить пару, що стоїть далеко в списку"
        en: "Finds a partner far away in the list"
      "returns null when no two items share a category":
        uk: "Повертає null, коли спільної категорії немає"
        en: "Returns null when no two items share a category"
      "returns null for an empty list and a single item":
        uk: "Повертає null для порожнього списку й одного бажання"
        en: "Returns null for an empty list and a single wish"
      "ignores items without a category":
        uk: "Не рахує бажання без категорії"
        en: "Ignores wishes without a category"
    hints:
      nudge:
        uk: "Що робити з бажанням, у якого `category` — `null`? І що робити, коли першу пару знайдено: шукати далі чи зупинитися?"
        en: "What should happen to a wish whose `category` is `null`? And once the first pair is found: keep searching or stop?"
      explanation:
        uk: "Бажання без категорії пропусти через `continue` у зовнішньому циклі. Пару знайдено, коли в двох бажань однакові категорії. Щойно знайшов — зупиняйся: усередині функції `return` виходить одразу з обох циклів, а звичайний `break` вийшов би лише з внутрішнього, і пошук пішов би далі."
        en: "Skip a wish without a category with `continue` in the outer loop. The pair is found when two wishes have equal categories. As soon as you find it, stop: inside a function `return` leaves both loops at once, while a plain `break` would leave only the inner loop, and the search would go on."
    solutionNote:
      uk: "`continue` у зовнішньому циклі пропускає бажання без категорії, а `return` усередині вкладених циклів зупиняє все одразу — тож пізніша пара вже не перезапише першу. Варіант із міткою (`search:` і `break search`) теж правильний. Для порожнього списку чи одного бажання внутрішній цикл не робить жодної ітерації, і функція повертає `null`."
      en: "`continue` in the outer loop skips wishes without a category, and `return` inside the nested loops stops everything at once — so a later pair can no longer overwrite the first. A labeled version (`search:` and `break search`) is correct too. For an empty list or a single wish the inner loop makes no iterations, and the function returns `null`."
    feedback:
      - when: { test: "returns the first pair that shares a category" }
        message:
          uk: "У списку з двома парами має повернутися перша: бажання, якому раніше за всіх знайшлася пара, разом із цією парою. Якщо після знахідки цикли йдуть далі, пізніша пара перезаписує першу: звичайний `break` виходить лише з внутрішнього циклу."
          en: "In a list with two pairs the first one must come back: the wish that found a partner earliest, together with that partner. If the loops keep going after a match, a later pair overwrites the first: a plain `break` leaves only the inner loop."
      - when: { test: "ignores items without a category" }
        message:
          uk: "Два записи з `category: null` не мають спільної категорії — категорії в них просто немає. Пропусти такі записи через `continue`."
          en: "Two records with `category: null` do not share a category — they simply have none. Skip such records with `continue`."
      - when: { test: "returns null when no two items share a category" }
        message:
          uk: "Якщо пари немає, функція має повернути `null`. Перевір, що `return null` стоїть після обох циклів, а не всередині них."
          en: "If there is no pair, the function must return `null`. Check that `return null` comes after both loops, not inside them."
      - when: { error: TypeError }
        message:
          uk: "Найчастіше `TypeError` тут означає, що код читає поле в `undefined` чи `null` — у значенні, де полів немає. Якщо в повідомленні є `reading 'category'`, індекс вийшов за межі списку: порівняй межі своїх циклів із каркасом (`j` починається з `i + 1`, умова — `j < items.length`). Якщо ж у повідомленні `null`, перевір, що бажання без категорії пропускаються раніше, ніж код щось робить з їхньою категорією."
          en: "Most often a `TypeError` here means the code reads a field of `undefined` or `null` — a value that has no fields. If the message says `reading 'category'`, an index went past the end of the list: compare your loop bounds with the skeleton (`j` starts at `i + 1`, the condition is `j < items.length`). If the message says `null` instead, check that wishes without a category are skipped before the code does anything with their category."

  - id: to-project
    kind: transfer
    capstoneStep: JS-04
    body:
      uk: "У проєкті ти шукатимеш дублікати й «перший запис, що…» — це якраз вкладені цикли з `continue`, `break` чи `return`. Пам’ятай про порожні списки: внутрішній цикл просто зробить нуль ітерацій, а код після нього не має вважати, що щось знайдено."
      en: "In your project you will look for duplicates and for “the first record that…” — exactly nested loops with `continue`, `break` or `return`. Remember empty lists: the inner loop just makes zero iterations, and the code after it must not assume something was found."
