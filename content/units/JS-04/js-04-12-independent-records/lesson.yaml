id: js-04-12-independent-records
unit: JS-04
title:
  uk: "Самостійно: CRUD записів без втрати інших полів"
  en: "Independent: record CRUD that preserves unrelated fields"
kind: assessment
minutes: 25
contentVersion: 1
purpose:
  uk: "Перевірка без підказок: чи вмієш ти сам написати функції створення, пошуку, зміни й видалення записів, які не гублять інших полів, не мутують вхідних даних і не ламаються на порожніх і розріджених списках. Саме такі функції ти напишеш для свого проєкту в наступному кроці."
  en: "A check without hints: can you write create, find, update and remove functions for records on your own, so that they lose no other fields, never mutate their inputs and do not break on empty and sparse lists? These are exactly the functions you will write for your project in the next step."
objectives:
  - uk: "Самостійно реалізувати CRUD-функції для записів, що зберігають інші поля, застосовують лише власні відомі поля зміни й ніколи не мутують вхідні дані — зокрема на порожніх і розріджених списках."
    en: "Implement, without hints, record CRUD functions that preserve unrelated fields, apply only own known fields of a change and never mutate their inputs, including on empty and sparse lists."
  - uk: "Пояснювати одним реченням, чому для плаского запису досить spread-копії і що має змінитися для вкладеного поля."
    en: "Explain in one sentence why a spread copy is enough for a flat record and what must change for a nested field."
prerequisites: [js-04-11-debug-loops-mutation]
subskills:
  - { family: J-03, skill: "for/while/do-while", depth: assess }
  - { family: J-05, skill: "property access and ownership", depth: assess }
  - { family: J-05, skill: "destructuring/spread", depth: assess }
  - { family: J-05, skill: "shallow vs deep copying", depth: assess }
  - { family: J-05, skill: "sparse/empty cases", depth: assess }
glossary: []

blocks:
  - id: records-crud
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: records-crud
    entry: index.js
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      lunch: { uk: "Обід", en: "Lunch" }
      tagWeekly: { uk: "щотижня", en: "weekly" }
    title:
      uk: "CRUD для витрат"
      en: "CRUD for expenses"
    instructions:
      uk: |
        Напиши чотири функції для списку витрат. Крім `id`, витрата може мати лише поля зі списку `FIELDS`: `label`, `amountMinor`, `date`, `category`, `tags` (масив текстових значень).

        - `createRecord(id, input)` повертає **новий** запис `{ id, label, amountMinor, date, category, tags }`. Кожне поле з `FIELDS` береться з **власного** поля `input`; якщо його немає — `null`, а для `tags` — порожній масив. `tags` у записі — завжди новий масив. Інші ключі `input` (і його `id`) ігноруй.
        - `findIndexById(list, id)` повертає індекс витрати з цим `id` або `-1`.
        - `updateRecord(list, id, changes)` повертає **новий** список, де витрату з цим `id` замінено новим записом: застосовано лише **власні** поля `changes`, що є у `FIELDS` (`id` не змінюється ніколи), а якщо зміна містить `tags` — у запис іде копія цього масиву. Інші витрати використовуються повторно.
        - `removeRecord(list, id)` повертає **новий** список без витрати з цим `id`.

        Для всіх функцій: вхідні дані (список, записи, `input`, `changes`) не змінюються; невідомий `id` і порожній список не ламають роботу. Список може бути розрідженим — дірка в ньому не є записом, її треба пропустити, а списки, які повертають функції, дірок не містять.
      en: |
        Write four functions for a list of expenses. Besides `id`, an expense may only have the fields listed in `FIELDS`: `label`, `amountMinor`, `date`, `category`, `tags` (an array of strings).

        - `createRecord(id, input)` returns a **new** record `{ id, label, amountMinor, date, category, tags }`. Each field from `FIELDS` comes from an **own** field of `input`; if there is none — `null`, and an empty array for `tags`. `tags` in the record is always a new array. Ignore any other keys of `input` (including its `id`).
        - `findIndexById(list, id)` returns the index of the expense with this `id`, or `-1`.
        - `updateRecord(list, id, changes)` returns a **new** list where the expense with this `id` is replaced by a new record: only the **own** fields of `changes` that are in `FIELDS` are applied (`id` never changes), and if the change carries `tags`, a copy of that array goes into the record. Other expenses are reused.
        - `removeRecord(list, id)` returns a **new** list without the expense with this `id`.

        For all functions: the inputs (the list, the records, `input`, `changes`) do not change; an unknown `id` and an empty list do not break anything. A list may be sparse — a hole in it is not a record and must be skipped, and the lists the functions return contain no holes.
    testTitles:
      "createRecord builds a record from the known fields":
        uk: "createRecord будує запис із відомих полів"
        en: "createRecord builds a record from the known fields"
      "createRecord ignores unknown and inherited fields":
        uk: "createRecord ігнорує невідомі й успадковані поля"
        en: "createRecord ignores unknown and inherited fields"
      "createRecord fills missing fields with null and tags with []":
        uk: "createRecord заповнює відсутні поля значенням null, а tags — порожнім масивом"
        en: "createRecord fills missing fields with null and tags with an empty array"
      "createRecord copies tags and leaves the input unchanged":
        uk: "createRecord копіює tags і не змінює input"
        en: "createRecord copies tags and leaves the input unchanged"
      "findIndexById finds the index or -1":
        uk: "findIndexById знаходить індекс або повертає -1"
        en: "findIndexById finds the index or returns -1"
      "findIndexById skips holes":
        uk: "findIndexById пропускає дірки розрідженого списку"
        en: "findIndexById skips the holes of a sparse list"
      "updateRecord applies the own known fields of the change":
        uk: "updateRecord застосовує лише відомі власні поля зміни"
        en: "updateRecord applies only the known own fields of the change"
      "updateRecord ignores inherited keys and never changes the id":
        uk: "updateRecord ігнорує успадковані ключі й ніколи не змінює id"
        en: "updateRecord ignores inherited keys and never changes the id"
      "updateRecord reuses untouched records and leaves the inputs unchanged":
        uk: "updateRecord повторно використовує незмінені записи й не змінює вхідні дані"
        en: "updateRecord reuses untouched records and leaves the inputs unchanged"
      "updateRecord copies a changed tags array":
        uk: "updateRecord копіює змінений масив tags"
        en: "updateRecord copies a changed tags array"
      "updateRecord handles an unknown id, an empty list and holes":
        uk: "updateRecord справляється з невідомим id, порожнім списком і дірками"
        en: "updateRecord handles an unknown id, an empty list and holes"
      "removeRecord returns a new list without the record":
        uk: "removeRecord повертає новий список без запису"
        en: "removeRecord returns a new list without the record"
      "removeRecord handles an unknown id, an empty list and holes":
        uk: "removeRecord справляється з невідомим id, порожнім списком і дірками"
        en: "removeRecord handles an unknown id, an empty list and holes"
    solutionNote:
      uk: "Еталонне рішення проходить списки циклом і пропускає комірки без запису, тож дірки й порожні списки нічого не ламають, а результат завжди щільний. Поля переносяться лише з `FIELDS` і лише якщо `Object.hasOwn` підтверджує власне поле, — так у запис не потрапляють ні невідомі, ні успадковані ключі, а `id` лишається незмінним. Пласкі поля копіює spread; масив `tags` щоразу копіюється окремо, щоб запис не ділив його ні з вхідними даними, ні з `changes`. Незмінені записи використовуються повторно."
      en: "The reference solution walks the lists with loops and skips slots without a record, so holes and empty lists break nothing and the result is always dense. Fields are taken only from `FIELDS` and only when `Object.hasOwn` confirms an own field — so neither unknown nor inherited keys get into the record, and `id` stays unchanged. Spread copies the flat fields; the `tags` array is copied separately every time so the record shares it neither with the input nor with `changes`. Untouched records are reused."
    feedback:
      - when: { error: TypeError }
        message:
          uk: "Якщо `TypeError` виникає під час читання `id`, цикл, найімовірніше, натрапив на дірку розрідженого списку (там `undefined`) або вийшов за кінець. Перевіряй, що в комірці справді є запис, перш ніж читати його поля."
          en: "If a `TypeError` appears while reading `id`, a loop most likely hit a hole of a sparse list (it holds `undefined`) or went past the end. Check that a slot really holds a record before reading its fields."
      - when: { test: "updateRecord applies the own known fields of the change" }
        message:
          uk: "Змінювати можна лише поля зі списку `FIELDS`; невідомі ключі на кшталт `color` не мають потрапити в запис. `{ ...record, ...changes }` переносить усе підряд."
          en: "Only fields from `FIELDS` may change; unknown keys such as `color` must not get into the record. `{ ...record, ...changes }` copies everything indiscriminately."
      - when: { test: "updateRecord ignores inherited keys and never changes the id" }
        message:
          uk: "Застосовуй лише **власні** поля зміни зі списку `FIELDS`: `id` у `FIELDS` немає, а успадковані ключі не є власними полями `changes` (перевір через `Object.hasOwn`, а не `in`)."
          en: "Apply only the change's **own** fields from `FIELDS`: `id` is not in `FIELDS`, and inherited keys are not own fields of `changes` (check with `Object.hasOwn`, not `in`)."
      - when: { test: "updateRecord copies a changed tags array" }
        message:
          uk: "Коли зміна містить `tags`, поклади в новий запис копію цього масиву — інакше запис ділитиме масив із тим, хто викликав функцію."
          en: "When the change carries `tags`, put a copy of that array into the new record — otherwise the record shares the array with the caller."
      - when: { test: "updateRecord reuses untouched records and leaves the inputs unchanged" }
        message:
          uk: "Функція має повернути новий список, повторно використати незмінені витрати й не змінити ні вхідний список, ні записи, ні `changes`. Будуй новий список: новий об’єкт — лише для витрати з потрібним `id`, решта — ті самі."
          en: "The function must return a new list, reuse the untouched expenses and change neither the input list, nor the records, nor `changes`. Build a new list: a new object only for the expense with the matching `id`, the rest stay the same."
      - when: { test: "createRecord ignores unknown and inherited fields" }
        message:
          uk: "Бери з `input` лише власні поля зі списку `FIELDS`. Успадковане поле — не власне, а невідомий ключ чи `id` з `input` у запис не потрапляють."
          en: "Take from `input` only own fields listed in `FIELDS`. An inherited field is not own, and unknown keys or `input.id` do not get into the record."
      - when: { test: "createRecord fills missing fields with null and tags with []" }
        message:
          uk: "Кожне поле з `FIELDS` має бути в новому записі: `null`, коли в `input` немає власного поля, і `[]` для `tags`."
          en: "Every field from `FIELDS` must be present in the new record: `null` when `input` has no own field, and `[]` for `tags`."
      - when: { test: "findIndexById skips holes" }
        message:
          uk: "Дірка читається як `undefined`: перевір, що в комірці є запис, і лише тоді порівнюй його `id`."
          en: "A hole reads as `undefined`: check that the slot holds a record, and only then compare its `id`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    strings:
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
    items:
      - id: validation-result
        from: js-02-11-independent-validation
        prompt:
          uk: "Перш ніж створювати запис, вхідні дані перевіряють. Що виведе код?"
          en: "Before a record is created, the input is validated. What does the code print?"
        code: |
          function validateExpense(input) {
            const errors = {};
            if (input.label === "") {
              errors.label = "required";
            }
            if (input.amountMinor === null || input.amountMinor <= 0) {
              errors.amountMinor = "positive";
            }
            if (errors.label !== undefined || errors.amountMinor !== undefined) {
              return { ok: false, errors };
            }
            return { ok: true, value: input };
          }
          const result = validateExpense({ label: "%%coffee%%", amountMinor: 0 });
          console.log(result.ok, result.errors);
        verify:
          logs: ["false {amountMinor: \"positive\"}"]
        answer:
          type: choice
          options:
            - id: one-error
              text:
                uk: "`false {amountMinor: \"positive\"}`"
                en: "`false {amountMinor: \"positive\"}`"
            - id: valid
              text:
                uk: "`true undefined`"
                en: "`true undefined`"
              why:
                uk: "0 — не додатна сума: перевірка `<= 0` її ловить, тож у `errors` з’являється ключ, і результат — `ok: false`."
                en: "0 is not a positive amount: the check `<= 0` catches it, so `errors` gets a key and the result is `ok: false`."
            - id: two-errors
              text:
                uk: "`false {label: \"required\", amountMinor: \"positive\"}`"
                en: "`false {label: \"required\", amountMinor: \"positive\"}`"
              why:
                uk: "Назва — непорожній текст, тож помилка лише одна: у сумі."
                en: "The label is non-empty text, so there is only one error: in the amount."
            - id: const-error
              text:
                uk: "Помилку: `errors` оголошено через `const`"
                en: "An error: `errors` is declared with `const`"
              why:
                uk: "`const` фіксує змінну, а не вміст: додавати властивості до власного нового об’єкта можна."
                en: "`const` fixes the name, not the contents: adding properties to your own new object is allowed."
          correct: [one-error]
        explanation:
          uk: "`validateExpense` не друкує й не кидає помилок, а повертає результат: `{ ok: false, errors }` з ключем для кожного поганого поля. У завданні вище `createRecord` довіряв своїм даним; у проєкті спершу перевіряй вхід і створюй запис, лише коли `ok` — `true`."
          en: "`validateExpense` neither prints nor throws; it returns a result: `{ ok: false, errors }` with a key per bad field. In the task above `createRecord` trusted its input; in your project, validate first and create the record only when `ok` is `true`."

  - id: why-spread-enough
    kind: prediction
    prompt:
      uk: "Обери речення, яке правильно пояснює: чому для пласкої витрати досить `{ ...expense, amountMinor: 20000 }` і що `updateRecord` мусить робити інакше для масиву `tags`?"
      en: "Choose the sentence that correctly explains why `{ ...expense, amountMinor: 20000 }` is enough for a flat expense, and what `updateRecord` must do differently for the `tags` array."
    answer:
      type: choice
      options:
        - id: primitives
          text:
            uk: "Spread копіює в новий об’єкт усі поля першого рівня, а числа й текст копіюються самі, тож новий запис нічого не ділить зі старим; але `tags` — посилання на масив, тому для зміни тегів у новий запис треба покласти **новий** масив, а не робити `push` у спільний."
            en: "Spread copies every first-level field into a new object, and numbers and strings are copied themselves, so the new record shares nothing with the old one; but `tags` is a reference to an array, so changing the tags requires putting a **new** array into the new record instead of pushing into the shared one."
        - id: deep
          text:
            uk: "Spread робить глибоку копію, тож для `tags` нічого міняти не треба."
            en: "Spread makes a deep copy, so nothing needs to change for `tags`."
          why:
            uk: "Spread копіює лише перший рівень: `tags` у копії — той самий масив, що й в оригіналі."
            en: "Spread copies only the first level: `tags` in the copy is the same array as in the original."
        - id: clone-all
          text:
            uk: "Spread досить лише тоді, коли змінене поле стоїть останнім; для `tags` треба зробити `structuredClone` усього списку."
            en: "Spread is enough only when the changed field comes last; for `tags` you must `structuredClone` the whole list."
          why:
            uk: "Порядок полів тут ні до чого, а глибока копія всього списку зайва: новими мають бути лише змінений запис і його масив `tags`."
            en: "The order of fields does not matter here, and a deep copy of the whole list is unnecessary: only the changed record and its `tags` array need to be new."
        - id: assign-flat
          text:
            uk: "Для пласких полів новий об’єкт не потрібен — можна присвоїти просто в запис; копіювати треба лише `tags`."
            en: "Flat fields need no new object — you can assign straight into the record; only `tags` needs copying."
          why:
            uk: "Присвоєння в наявний запис — це мутація: її побачать усі списки, що тримають цей запис."
            en: "Assigning into the existing record is a mutation: every list holding that record will see it."
      correct: [primitives]
    explanation:
      uk: "Пласкі поля — примітиви, тож поверхневої копії досить: у новому записі вони вже окремі. Масив `tags` вкладений, і spread-копія ділить його з оригіналом, тому зміна тегів мусить створити новий масив."
      en: "Flat fields are primitives, so a shallow copy is enough: in the new record they are already separate. The `tags` array is nested, and a spread copy shares it with the original, so changing the tags must create a new array."
