            w02: { kind: object, props: { id: "w-02", price: 45 } }
            w02v2: { kind: object, props: { id: "w-02", price: 50 } }
            w03: { kind: object, props: { id: "w-03", price: 200 } }
        - caption:
            uk: "Запис #w03 тримають **усі три** списки, тож ціну 200 бачать і `wishes`, і `updated`: консоль показує `200 200`. Новий масив на виході не доводить, що нічого не змутовано."
            en: "Record #w03 is held by **all three** lists, so both `wishes` and `updated` see the price 200: the console shows `200 200`. A new array as the result does not prove that nothing was mutated."
          line: 11
