id: js-04-10-immutable-updates
unit: JS-04
title:
  uk: "Оновлюємо без мутацій"
  en: "Updating without mutating"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Реалізовувати додавання, оновлення за id і видалення за id, що повертають нові масиви й об’єкти та не змінюють вхідний список і його записи."
    en: "Implement add, update-by-id and remove-by-id that return new arrays and objects and leave the input list and its records unchanged."
  - uk: "Перевіряти через `===`, які записи після оновлення нові, а які використано повторно, і пояснювати, чому повторно використовувати незмінені записи правильно."
    en: "Verify with `===` which records are new and which are reused after an update, and explain why reusing untouched records is correct."
prerequisites: [js-04-09-destructuring-spread, js-03-07-pure-vs-side-effects]
subskills:
  - { family: J-05, skill: "reference identity/mutation", depth: practice }
  - { family: J-05, skill: "shallow vs deep copying", depth: practice }
glossary: [immutable-update, immutability, crud]
selfCheck: [which-are-new, crud]

blocks:
  - id: new-not-changed
    kind: explanation
    title:
      uk: "Новий список замість зміненого"
      en: "A new list instead of a changed one"
    body:
      uk: |
        Запис у списку можна змінити двома способами. Мутація змінює наявний об’єкт — і зміну бачать усі, хто тримає на нього посилання. [[immutable-update|Оновлення без мутацій]] будує **новий** масив і **новий** запис, а старі лишає як були:

        ```js
        function setPrice(list, id, price) {
          const result = [];
          for (const record of list) {
            if (record.id === id) {
              result.push({ ...record, price }); // a new record
            } else {
              result.push(record);               // the same, untouched record
            }
          }
          return result;
        }
        ```

        Додати запис — означає зібрати новий масив зі старими записами й новим у кінці, видалити — зібрати новий масив без нього. Разом зі створенням і читанням це чотири базові операції з даними — [[crud|CRUD]]: create, read, update, delete. А підхід, у якому дані не змінюють, а замінюють новими версіями, називають [[immutability|незмінністю]].
      en: |
        A record in a list can be changed in two ways. A mutation changes the existing object — and everyone holding a reference to it sees the change. An [[immutable-update|immutable update]] builds a **new** array and a **new** record and leaves the old ones as they were:

        ```js
        function setPrice(list, id, price) {
          const result = [];
          for (const record of list) {
            if (record.id === id) {
              result.push({ ...record, price }); // a new record
            } else {
              result.push(record);               // the same, untouched record
            }
          }
          return result;
        }
        ```

        Adding a record means building a new array with the old records and the new one at the end; removing one means building a new array without it. Together with creating and reading, these are the four basic data operations — [[crud|CRUD]]: create, read, update, delete. And the approach in which data is not changed but replaced with new versions is called [[immutability]].

  - id: which-are-new
    kind: prediction
    prompt:
      uk: "Функція `setPrice` змінює ціну одного бажання без мутацій. Які твердження правдиві після її виклику? Познач усі."
      en: "The function `setPrice` changes the price of one wish without mutation. Which statements are true after the call? Select all."
    code: |
      function setPrice(list, id, price) {
        const result = [];
        for (const record of list) {
          if (record.id === id) {
            result.push({ ...record, price });
          } else {
            result.push(record);
          }
        }
        return result;
      }
      const wishes = [{ id: "w-01", price: 80 }, { id: "w-02", price: 45 }];
      const updated = setPrice(wishes, "w-02", 50);
      console.log(updated === wishes);
      console.log(updated[0] === wishes[0]);
      console.log(updated[1] === wishes[1]);
      console.log(wishes[1].price);
    verify:
      logs: ["false", "true", "false", "45"]
    answer:
      type: multi
      options:
        - id: same-list
          code: "updated === wishes"
          why:
            uk: "`setPrice` завжди збирає новий масив `result`, тож це інший масив."
            en: "`setPrice` always builds a new array `result`, so this is a different array."
        - id: reused
          code: "updated[0] === wishes[0]"
        - id: same-changed
          code: "updated[1] === wishes[1]"
          why:
            uk: "Для запису з потрібним `id` створено новий об’єкт `{ ...record, price }`."
            en: "For the record with the matching `id` a new object `{ ...record, price }` was created."
        - id: old-price
          text:
            uk: "`wishes[1].price` досі `45`"
            en: "`wishes[1].price` is still `45`"
      correct: [reused, old-price]
    explanation:
      uk: "Масив новий (`false`), але незмінений запис у ньому — той самий об’єкт (`true`). Змінений запис — новий об’єкт (`false`), а старий лишився з ціною 45: оригінальний список ніхто не чіпав."
      en: "The array is new (`false`), but the untouched record in it is the same object (`true`). The changed record is a new object (`false`), and the old one kept its price of 45: nobody touched the original list."

  - id: before-after
    kind: visual
    visual: memory-graph
    title:
      uk: "До й після оновлення"
      en: "Before and after the update"
    textEquivalent:
      uk: "Список wishes — масив із трьома посиланнями на записи w-01 (ціна 80), w-02 (45) і w-03 (240). setPrice(wishes, \"w-02\", 50) повертає новий масив updated: у його комірках 0 і 2 — ті самі записи w-01 і w-03, а в комірці 1 — новий запис w-02 із ціною 50. Оригінальний масив і старий запис w-02 з ціною 45 не змінилися, тож консоль показує false, true і false. Далі mutatePrice(wishes, \"w-03\", 200) — той самий цикл, але вона присвоює ціну знайденому запису: вона теж повертає новий масив leaked, проте змінює спільний запис w-03 на місці. Цей запис тримають усі три списки — wishes, updated і leaked, — тож ціну 200 бачать усі, і консоль показує 200 200. Новий масив на виході не доводить, що нічого не змутовано."
      en: "The list wishes is an array of three references to the records w-01 (price 80), w-02 (45) and w-03 (240). setPrice(wishes, \"w-02\", 50) returns a new array updated: its slots 0 and 2 hold the same records w-01 and w-03, and slot 1 holds a new record w-02 with price 50. The original array and the old w-02 record with price 45 are unchanged, so the console shows false, true and false. Next, mutatePrice(wishes, \"w-03\", 200) — the same loop, but it assigns the price to the found record: it also returns a new array leaked, yet it changes the shared record w-03 in place. That record is held by all three lists — wishes, updated and leaked — so all of them see the price 200, and the console shows 200 200. A new array as the result does not prove that nothing was mutated."
    spec:
      code: |
        const wishes = [
          { id: "w-01", price: 80 },
          { id: "w-02", price: 45 },
          { id: "w-03", price: 240 },
        ];
        const updated = setPrice(wishes, "w-02", 50);
        console.log(updated === wishes);
        console.log(updated[0] === wishes[0]);
        console.log(updated[1] === wishes[1]);
        const leaked = mutatePrice(wishes, "w-03", 200);
        console.log(wishes[2].price, updated[2].price);
      states:
        - caption:
            uk: "Список `wishes` — масив із трьома **посиланнями** на три записи."
            en: "The list `wishes` is an array of three **references** to three records."
          line: 5
          bindings:
            - { name: wishes, kind: const, value: { ref: old } }
          heap:
            old: { kind: array, items: [{ ref: w01 }, { ref: w02 }, { ref: w03 }] }
            w01: { kind: object, props: { id: "w-01", price: 80 } }
            w02: { kind: object, props: { id: "w-02", price: 45 } }
            w03: { kind: object, props: { id: "w-03", price: 240 } }
        - caption:
            uk: "`setPrice` (функція з пояснення) зібрала **новий масив**. Комірки 0 і 2 ведуть до тих **самих** записів, а в комірці 1 — новий запис із ціною 50. Старий масив і запис #w02 з ціною 45 не змінилися."
            en: "`setPrice` (the function from the explanation) built a **new array**. Slots 0 and 2 lead to the **same** records, and slot 1 holds a new record with price 50. The old array and record #w02 with price 45 are unchanged."
          line: 6
          bindings:
            - { name: wishes, kind: const, value: { ref: old } }
            - { name: updated, kind: const, value: { ref: upd } }
          heap:
            old: { kind: array, items: [{ ref: w01 }, { ref: w02 }, { ref: w03 }] }
            upd: { kind: array, items: [{ ref: w01 }, { ref: w02v2 }, { ref: w03 }] }
            w01: { kind: object, props: { id: "w-01", price: 80 } }
            w02: { kind: object, props: { id: "w-02", price: 45 } }
            w02v2: { kind: object, props: { id: "w-02", price: 50 } }
            w03: { kind: object, props: { id: "w-03", price: 240 } }
        - caption:
            uk: "Консоль: `false`, `true`, `false` — новий список, незмінений запис використано повторно, змінений — новий."
            en: "Console: `false`, `true`, `false` — a new list, the untouched record reused, the changed one new."
          line: 9
          bindings:
            - { name: wishes, kind: const, value: { ref: old } }
            - { name: updated, kind: const, value: { ref: upd } }
          heap:
            old: { kind: array, items: [{ ref: w01 }, { ref: w02 }, { ref: w03 }] }
            upd: { kind: array, items: [{ ref: w01 }, { ref: w02v2 }, { ref: w03 }] }
            w01: { kind: object, props: { id: "w-01", price: 80 } }
            w02: { kind: object, props: { id: "w-02", price: 45 } }
            w02v2: { kind: object, props: { id: "w-02", price: 50 } }
            w03: { kind: object, props: { id: "w-03", price: 240 } }
          changed: []
        - caption:
            uk: "`mutatePrice` — той самий цикл, але знайденому запису вона присвоює `record.price = price`. Вона теж повертає **новий** масив `leaked` — проте змінила спільний запис #w03 на місці."
            en: "`mutatePrice` is the same loop, but it assigns `record.price = price` to the found record. It also returns a **new** array `leaked` — yet it changed the shared record #w03 in place."
          line: 10
          bindings:
            - { name: wishes, kind: const, value: { ref: old } }
            - { name: updated, kind: const, value: { ref: upd } }
            - { name: leaked, kind: const, value: { ref: leak } }
          heap:
            old: { kind: array, items: [{ ref: w01 }, { ref: w02 }, { ref: w03 }] }
            upd: { kind: array, items: [{ ref: w01 }, { ref: w02v2 }, { ref: w03 }] }
            leak: { kind: array, items: [{ ref: w01 }, { ref: w02 }, { ref: w03 }] }
