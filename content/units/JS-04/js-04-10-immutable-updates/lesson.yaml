            - { name: leaked, kind: const, value: { ref: leak } }
          heap:
            old: { kind: array, items: [{ ref: w01 }, { ref: w02 }, { ref: w03 }] }
            upd: { kind: array, items: [{ ref: w01 }, { ref: w02v2 }, { ref: w03 }] }
            leak: { kind: array, items: [{ ref: w01 }, { ref: w02 }, { ref: w03 }] }
            w01: { kind: object, props: { id: "w-01", price: 80 } }
            w02: { kind: object, props: { id: "w-02", price: 45 } }
