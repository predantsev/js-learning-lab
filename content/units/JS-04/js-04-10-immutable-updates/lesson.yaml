  - id: reuse-is-right
    kind: explanation
    title:
      uk: "Чому повторно використовувати записи — правильно"
      en: "Why reusing records is right"
    body:
      uk: |
        Навіщо глибоко копіювати весь список «про всяк випадок»? Незмінені записи нічим не ризикують: їх ніхто не мутує, тож ділити їх між старим і новим списком безпечно. Глибока копія лише витратила б час і пам’ять.

        А ще повторне використання дає корисний сигнал: якщо `newList[i] === oldList[i]`, запис не змінювався, і код, що показує список, може його не перемальовувати. У React ти побачиш це знову.

        Пастка — вважати, що функція, яка повертає новий список, нічого не змінила. Якщо всередині вона зробила `record.price = 50`, змінено спільний запис, і старий список «побачить» нову ціну. Перевіряй мутацію не за тим, що функція повертає, а за тим, що сталося з її вхідними даними.
      en: |
        Why deep-copy the whole list “just in case”? Untouched records risk nothing: nobody mutates them, so sharing them between the old and the new list is safe. A deep copy would only waste time and memory.

        Reusing them also gives a useful signal: if `newList[i] === oldList[i]`, the record did not change, and the code that shows the list can skip redrawing it. You will see this again in React.

        The trap is to believe that a function returning a new list changed nothing. If inside it did `record.price = 50`, a shared record was changed, and the old list will “see” the new price. Judge mutation not by what a function returns, but by what happened to its inputs.

  - id: update-lab
    kind: example
    runtime: browser-js
    dir: update-lab
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
    title:
      uk: "Зламай оновлення навмисно"
      en: "Break the update on purpose"
    body:
      uk: |
        Тут `setPrice` будує новий запис. Запусти й переконайся: старий список не змінився, а `===` показує, які записи нові.
      en: |
        Here `setPrice` builds a new record. Run it and make sure the old list did not change, and that `===` shows which records are new.
    tryIt:
      uk: "Заміни рядок коду `result.push({ ...record, price });` двома рядками коду: `record.price = price;` і `result.push(record);`. Запусти: функція й далі повертає новий масив, але тепер `wishes[1].price` теж 50, а `updated[1] === wishes[1]` — `true`. Спільний запис змутовано."
      en: "Replace the line of code `result.push({ ...record, price });` with two lines of code: `record.price = price;` and `result.push(record);`. Run: the function still returns a new array, but now `wishes[1].price` is 50 too, and `updated[1] === wishes[1]` is `true`. The shared record has been mutated."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: arrow-object
        from: js-03-03-arrow-functions
        prompt:
          uk: "Яка стрілкова функція повертає **новий** запис із ціною `price`, не змінюючи старий?"
          en: "Which arrow function returns a **new** record with the price `price` without changing the old one?"
        answer:
          type: choice
          options:
            - id: braces
              code: "(record, price) => { ...record, price }"
              why:
                uk: "Фігурні дужки після `=>` читаються як тіло функції, а `...record` усередині тіла — це `SyntaxError`."
                en: "Curly braces after `=>` are read as a function body, and `...record` inside a body is a `SyntaxError`."
            - id: parens
              code: "(record, price) => ({ ...record, price })"
            - id: assign
              code: "(record, price) => { return record.price = price; }"
              why:
                uk: "Ця функція змінює запис (мутація) і повертає лише число."
                en: "This function changes the record (a mutation) and returns only the number."
            - id: mutate-return
              code: "(record, price) => { record.price = price; return record; }"
              why:
                uk: "Повертає той самий запис після мутації — нового об’єкта тут немає."
                en: "It returns the same record after mutating it — there is no new object here."
          correct: [parens]
        explanation:
          uk: "Щоб стрілка повернула об’єктний літерал без `return`, його беруть у круглі дужки: `=> ({ … })`. Інакше фігурні дужки стають тілом функції. Усередині літерала `...record` копіює поля, а `price` — скорочений запис для `price: price`."
          en: "To make an arrow return an object literal without `return`, wrap the literal in parentheses: `=> ({ … })`. Otherwise the curly braces become the function body. Inside the literal, `...record` copies the fields, and `price` is shorthand for `price: price`."

  - id: crud
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: crud
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
    title:
      uk: "Додати, змінити, видалити — без мутацій"
      en: "Add, update, remove — without mutation"
    instructions:
      uk: |
        Допиши три функції для списку справ. Кожна повертає **новий** масив і ніколи не змінює вхідний список чи його записи:

        - `addRecord(list, record)` — новий список із записом у кінці;
        - `updateRecord(list, id, changes)` — новий список, де запис із цим `id` замінено копією зі злитими змінами; записи з іншими `id` використай повторно, як є;
        - `removeRecord(list, id)` — новий список без запису з цим `id`.

        Якщо запису з таким `id` немає, поверни новий масив із тими самими записами.
      en: |
        Complete three functions for a task list. Each returns a **new** array and never changes the input list or its records:

        - `addRecord(list, record)` — a new list with the record at the end;
        - `updateRecord(list, id, changes)` — a new list where the record with this `id` is replaced by a copy with the changes merged in; records with other `id`s are reused as they are;
        - `removeRecord(list, id)` — a new list without the record with this `id`.

        If there is no record with that `id`, return a new array with the same records.
    testTitles:
      "addRecord returns a new list with the record at the end":
        uk: "addRecord повертає новий список із записом у кінці"
        en: "addRecord returns a new list with the record at the end"
      "updateRecord merges the changes into a copy of the matching record":
        uk: "updateRecord зливає зміни в копію потрібного запису"
        en: "updateRecord merges the changes into a copy of the matching record"
      "updateRecord reuses the untouched records":
        uk: "updateRecord повторно використовує незмінені записи"
        en: "updateRecord reuses the untouched records"
      "updateRecord leaves the original list and records unchanged":
        uk: "updateRecord не змінює ні вхідний список, ні його записи"
        en: "updateRecord changes neither the input list nor its records"
      "removeRecord returns a new list without the record":
        uk: "removeRecord повертає новий список без запису"
        en: "removeRecord returns a new list without the record"
      "an unknown id changes nothing":
        uk: "Невідомий id нічого не змінює"
        en: "An unknown id changes nothing"
      "works on an empty list":
        uk: "Працює з порожнім списком"
        en: "Works on an empty list"
    hints:
      nudge:
        uk: "Для кожної функції спитай: який **новий** масив вона повертає, і які записи в ньому нові, а які — ті самі?"
        en: "For each function ask: which **new** array does it return, and which records in it are new and which are the same?"
      explanation:
        uk: "Згадай `setPrice`: новий масив `result`, у циклі — той самий запис для інших `id` і новий запис для потрібного. `updateRecord` робить те саме, тільки новий запис отримує не одну ціну, а всі поля з `changes` — їх теж можна злити в копію через spread. `removeRecord` будує новий масив без потрібного запису, а `addRecord` — новий масив зі старими записами й новим у кінці."
        en: "Remember `setPrice`: a new array `result`, and in the loop the same record for other `id`s and a new record for the matching one. `updateRecord` does the same, except that the new record gets not one price but every field from `changes` — they can also be merged into the copy with spread. `removeRecord` builds a new array without the matching record, and `addRecord` a new array with the old records and the new one at the end."
    solutionNote:
      uk: "Кожна функція повертає новий масив, тож вхідний список не змінюється. Новий об’єкт з’являється лише для зміненого запису (`{ ...record, ...changes }`), а решта записів використовується повторно: це безпечно, бо їх ніхто не мутує, і дешево, бо нічого не копіюється даремно."
      en: "Every function returns a new array, so the input list does not change. A new object appears only for the changed record (`{ ...record, ...changes }`), and the other records are reused: that is safe, because nobody mutates them, and cheap, because nothing is copied in vain."
    feedback:
      - when: { test: "updateRecord leaves the original list and records unchanged" }
        message:
          uk: "Вхідний список і його записи мають лишитися як були, а для зміненої справи має з’явитися новий об’єкт. Якщо записуєш зміни просто в знайдений запис, змінюється спільний об’єкт — копія масиву тут не рятує, бо записи в ній ті самі."
          en: "The input list and its records must stay as they were, and the changed task must get a new object. If you write the changes straight into the found record, the shared object changes — copying the array does not help, because the records in it are the same."
      - when: { test: "updateRecord reuses the untouched records" }
        message:
          uk: "Незмінені записи мають лишитися тими самими об’єктами. Глибока копія всього списку тут зайва: копіюй лише запис, який змінюєш."
          en: "Untouched records must stay the same objects. A deep copy of the whole list is unnecessary here: copy only the record you change."
      - when: { test: "addRecord returns a new list with the record at the end" }
        message:
          uk: "`addRecord` має повернути новий масив зі старими записами й новим у кінці, а вхідний список — не змінитися. Якщо робиш `push` просто у вхідний список, ти його змінюєш."
          en: "`addRecord` must return a new array with the old records and the new one at the end, and the input list must not change. If you `push` straight into the input list, you change it."
      - when: { test: "removeRecord returns a new list without the record" }
        message:
          uk: "Збери новий масив із записів, чий `id` не дорівнює переданому: пройди список циклом і додавай решту в новий масив."
          en: "Build a new array of the records whose `id` differs from the given one: walk the list with a loop and add the rest to a new array."
      - when: { test: "an unknown id changes nothing" }
        message:
          uk: "Якщо запису з таким `id` немає, поверни новий масив із тими самими записами — і нічого не змінюй."
          en: "If there is no record with that `id`, return a new array with the same records — and change nothing."
      - when: { test: "works on an empty list" }
        message:
          uk: "Для порожнього списку цикл не робить жодної ітерації: `updateRecord` і `removeRecord` мають повернути порожній новий масив, а `addRecord` — масив з одним записом."
          en: "For an empty list the loop makes no iterations: `updateRecord` and `removeRecord` must return an empty new array, and `addRecord` an array with one record."

  - id: to-project
    kind: transfer
    capstoneStep: JS-04
    body:
      uk: "Це серце кроку проєкту: ти напишеш `addItem`, `updateItem` і `removeItem` (або `…Task`, `…Habit`, `…Expense` — для свого домену) саме так — новий список, новий запис лише для зміненого, інші записи ті самі. А `===` покаже, що початковий список лишився недоторканим."
      en: "This is the heart of the project step: you will write `addItem`, `updateItem` and `removeItem` (or `…Task`, `…Habit`, `…Expense` for your domain) exactly like this — a new list, a new record only for the changed one, the other records the same. And `===` will show that the original list stayed untouched."
