id: js-04-11-debug-loops-mutation
unit: JS-04
title:
  uk: "Налагодження: вихід із циклу, успадковані ключі й спільна мутація"
  en: "Debug: loop exits, inherited keys and shared mutation"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Діагностувати й виправляти засіяні дефекти: межу «на одиницю», `break`, що виходить не з того циклу, вкладений цикл, що помиляється на порожньому внутрішньому списку, `for…in`, який підхоплює успадкований ключ, і оновлення, що мутує спільний запис."
    en: "Diagnose and repair seeded defects: an off-by-one bound, a `break` that leaves the wrong loop, a nested loop that misbehaves on an empty inner list, a `for…in` that picks up an inherited key, and an update that mutates a shared record."
  - uk: "Обґрунтовувати кожне виправлення таблицею ітерацій або схемою посилань."
    en: "Justify each repair with an iteration table or a reference diagram."
prerequisites: [js-04-10-immutable-updates, js-04-06-for-of-vs-for-in, js-04-04-break-continue-nested]
subskills:
  - { family: J-03, skill: "for-of values vs for-in enumerable keys/ownership pitfalls", depth: assess }
  - { family: J-03, skill: "break/continue", depth: assess }
  - { family: J-03, skill: "nested/empty loops", depth: assess }
  - { family: J-03, skill: "termination and off-by-one", depth: assess }
  - { family: J-05, skill: "reference identity/mutation", depth: assess }
glossary: []
selfCheck: [repair-five]

blocks:
  - id: not-proof
    kind: explanation
    title:
      uk: "«Працює на моєму списку» — ще не доказ"
      en: "“Works on my list” is not proof"
    body:
      uk: |
        Праворуч — програма-звіт для трекера звичок із п’ятьма функціями. На звичайному списку вона виглядає справною. Але «працює на моєму списку» ще не означає «працює завжди»: помилки в циклах і оновленнях ховаються в крайніх випадках. Тому перевіряй кожну функцію на трьох видах даних:

        - **порожній список** `[]`;
        - **список з одного запису**;
        - **вкладені й «незручні» дані**: звичка без жодного виконання (`completions: []`), кілька збігів одразу, запис, створений через `Object.create`.

        І для кожної підозри май інструмент. Для циклу — таблицю ітерацій: яке `i` перше, яке останнє, що читається на кожному кроці. Для оновлення — схему посилань: які списки тримають той самий запис.
      en: |
        On the right is a report program for a habit tracker with five functions. On the usual list it looks healthy. But “works on my list” does not mean “always works”: loop and update bugs hide in edge cases. So check every function on three kinds of data:

        - **an empty list** `[]`;
        - **a list with one record**;
        - **nested and “awkward” data**: a habit with no completions at all (`completions: []`), several matches at once, a record created with `Object.create`.

        And have a tool for every suspicion. For a loop — an iteration table: what is the first `i`, what is the last one, what is read at each step. For an update — a reference diagram: which lists hold the same record.

  - id: which-fail
    kind: prediction
    prompt:
      uk: "Прочитай програму праворуч, **не запускаючи** її. Які з цих викликів дадуть неправильний результат або помилку? Познач усі. (`habits` — три звички з програми; `one[0]` створено через `makeHabit`; `empty` — порожній список.)"
      en: "Read the program on the right **without running** it. Which of these calls give a wrong result or an error? Select all. (`habits` holds the program's three habits; `one[0]` is made by `makeHabit`; `empty` is an empty list.)"
    answer:
      type: multi
      options:
        - id: find-existing
          code: "findHabit(habits, \"h-02\")"
          why:
            uk: "`h-02` трапляється раніше, ніж цикл доходить до зайвої ітерації, тож функція повертає правильну звичку. Дефект проявиться, лише коли збігу немає."
            en: "`h-02` comes up before the loop reaches the extra iteration, so the function returns the right habit. The defect shows only when there is no match."
        - id: find-empty
          code: "findHabit(empty, \"h-01\")"
        - id: first-done
          code: "firstDoneOn(habits, \"2026-03-01\")"
        - id: last-days
          code: "lastDays(habits)"
        - id: fields-plain
          code: "fieldNames(habits[0])"
          why:
            uk: "`habits[0]` — звичайний літерал: усі його ключі власні, тож `for…in` нічого зайвого не знаходить."
            en: "`habits[0]` is a plain literal: all its keys are its own, so `for…in` finds nothing extra."
        - id: fields-made
          code: "fieldNames(one[0])"
        - id: update
          code: "updateHabit(habits, \"h-02\", { active: false })"
      correct: [find-empty, first-done, last-days, fields-made, update]
    explanation:
      uk: "П’ять викликів помиляються — і лише на «незручних» даних: порожній список, кілька збігів, звичка без виконань, запис з успадкованими полями, спільний запис. На звичайних даних ті самі функції виглядають справними: `findHabit(habits, \"h-02\")` і `fieldNames(habits[0])` працюють. Запусти програму й звір кожен рядок у консолі зі своїм прогнозом."
      en: "Five calls go wrong — and only on “awkward” data: an empty list, several matches, a habit with no completions, a record with inherited fields, a shared record. On the usual data the same functions look healthy: `findHabit(habits, \"h-02\")` and `fieldNames(habits[0])` work. Run the program and match every line with your prediction."

  - id: replay
    kind: example
    runtime: browser-js
    dir: replay
    entry: index.js
    expectError: true
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      stretch: { uk: "Розтяжка", en: "Stretching" }
    title:
      uk: "Програма-звіт на трьох видах даних"
      en: "The report program on three kinds of data"
    body:
      uk: |
        Запусти програму й звір кожен рядок консолі зі своїм прогнозом. Останній рядок коду — пошук у порожньому списку — зупиняє програму з `TypeError`.
      en: |
        Run the program and match every console line with your prediction. The last line — a search in an empty list — stops the program with a `TypeError`.
    tryIt:
      uk: "Для кожного неправильного рядка в консолі запиши, яка функція помилилася і на яких даних. Поки нічого не виправляй — це зробиш у вправі. Можеш додати власні виклики, наприклад `lastDays(one)` чи `firstDoneOn(habits, \"2026-02-26\")`, і передбачити результат до запуску."
      en: "For every wrong line, note which function went wrong and on which data. Do not fix anything yet — you will do that in the exercise. You may add your own calls, such as `lastDays(one)` or `firstDoneOn(habits, \"2026-02-26\")`, and predict the result before running."

  - id: leak-replay
    kind: visual
    visual: memory-graph
    title:
      uk: "Звідки береться «витік» оновлення"
      en: "Where the leaking update comes from"
    textEquivalent:
      uk: "Список habits тримає посилання на дві звички, h-01 і h-02, обидві з active: true. Помилкова updateHabit робить const result = [...habits]: це новий масив, але в його комірках ті самі дві звички. Потім цикл записує active = false просто в об’єкт h-02 — а його тримає й оригінальний список. Тому консоль показує false true false: масиви різні, звичка в комірці 1 та сама, і оригінальна звичка вже на паузі. Після виправлення той самий виклик дає новий масив, у якому для h-02 лежить новий об’єкт з active: false, тоді як оригінальна звичка h-02 лишається з active: true, а h-01 використано повторно."
      en: "The list habits holds references to two habits, h-01 and h-02, both with active: true. The faulty updateHabit does const result = [...habits]: a new array, but its slots hold the same two habits. The loop then writes active = false straight into the h-02 object — which the original list holds too. So the console shows false true false: different arrays, the same habit in slot 1, and the original habit is already paused. After the repair the same call gives a new array in which h-02 is a new object with active: false, while the original h-02 keeps active: true and h-01 is reused."
    spec:
      code: |
        const habits = [
          { id: "h-01", active: true },
          { id: "h-02", active: true },
        ];
        const paused = updateHabit(habits, "h-02", { active: false });
        console.log(paused === habits, paused[1] === habits[1], habits[1].active);
      states:
        - caption:
            uk: "Список `habits` тримає посилання на дві звички, обидві активні."
            en: "The list `habits` holds references to two habits, both active."
          line: 4
          bindings:
            - { name: habits, kind: const, value: { ref: list } }
          heap:
            list: { kind: array, items: [{ ref: h01 }, { ref: h02 }] }
            h01: { kind: object, props: { id: "h-01", active: true } }
            h02: { kind: object, props: { id: "h-02", active: true } }
        - caption:
            uk: "Помилкова `updateHabit`: `[...habits]` — новий масив, але в комірках **ті самі** звички. Цикл записав `active = false` просто в об’єкт #h02 — а його тримає й оригінальний список."
            en: "The faulty `updateHabit`: `[...habits]` is a new array, but its slots hold **the same** habits. The loop wrote `active = false` straight into object #h02 — which the original list holds too."
          line: 5
          bindings:
            - { name: habits, kind: const, value: { ref: list } }
            - { name: paused, kind: const, value: { ref: copy } }
          heap:
            list: { kind: array, items: [{ ref: h01 }, { ref: h02 }] }
            copy: { kind: array, items: [{ ref: h01 }, { ref: h02 }] }
            h01: { kind: object, props: { id: "h-01", active: true } }
            h02: { kind: object, props: { id: "h-02", active: false } }
        - caption:
            uk: "Консоль: `false true false` — масиви різні, звичка в комірці 1 та сама, і оригінальна звичка вже на паузі. Копія масиву не захистила записи."
            en: "Console: `false true false` — different arrays, the same habit in slot 1, and the original habit is already paused. Copying the array did not protect the records."
          line: 6
          bindings:
            - { name: habits, kind: const, value: { ref: list } }
            - { name: paused, kind: const, value: { ref: copy } }
          heap:
            list: { kind: array, items: [{ ref: h01 }, { ref: h02 }] }
            copy: { kind: array, items: [{ ref: h01 }, { ref: h02 }] }
            h01: { kind: object, props: { id: "h-01", active: true } }
            h02: { kind: object, props: { id: "h-02", active: false } }
          changed: [h02]
        - caption:
            uk: "Так має виглядати результат після виправлення: для h-02 у новому списку лежить **новий** об’єкт, оригінал лишився `active: true`, а h-01 використано повторно."
            en: "This is what the result must look like after the repair: the new list holds a **new** object for h-02, the original kept `active: true`, and h-01 is reused."
          line: 5
          bindings:
            - { name: habits, kind: const, value: { ref: list } }
            - { name: paused, kind: const, value: { ref: fixed } }
          heap:
            list: { kind: array, items: [{ ref: h01 }, { ref: h02 }] }
            fixed: { kind: array, items: [{ ref: h01 }, { ref: h02v2 }] }
            h01: { kind: object, props: { id: "h-01", active: true } }
            h02: { kind: object, props: { id: "h-02", active: true } }
            h02v2: { kind: object, props: { id: "h-02", active: false } }

  - id: justify
    kind: explanation
    title:
      uk: "Обґрунтуй кожне виправлення"
      en: "Justify every repair"
    body:
      uk: |
        Кожне виправлення обґрунтовуй тим, що бачиш, а не відчуттям.

        **Таблиця ітерацій.** Ось `findHabit(empty, "h-01")` з умовою `i <= habits.length`:

        | `i` | `i <= habits.length` | `habits[i]` | що відбувається |
        |---|---|---|---|
        | 0 | `0 <= 0` → true | `undefined` | читання `.id` в `undefined` — `TypeError` |

        Для порожнього списку не має бути жодної ітерації — яка умова пропускає лише індекси від 0 до `habits.length - 1`? Склади таку саму таблицю для `lastDays` і звички без виконань: що лежить у `last`, коли внутрішній цикл не зробив жодного кроку? А для `firstDoneOn`: що відбувається з `found` після першої знахідки?

        **Схема посилань.** Для `updateHabit` візуалізація вище показує: копія масиву не допомагає, бо в ній ті самі записи. Новий потрібен саме змінений запис.
      en: |
        Justify every repair with what you see, not with a hunch.

        **An iteration table.** Here is `findHabit(empty, "h-01")` with the condition `i <= habits.length`:

        | `i` | `i <= habits.length` | `habits[i]` | what happens |
        |---|---|---|---|
        | 0 | `0 <= 0` → true | `undefined` | reading `.id` of `undefined` — `TypeError` |

        For an empty list there must be no iteration at all — which condition lets in only the indexes from 0 to `habits.length - 1`? Make the same table for `lastDays` and a habit with no completions: what is in `last` when the inner loop took no step? And for `firstDoneOn`: what happens to `found` after the first match?

        **A reference diagram.** For `updateHabit` the visual above shows that copying the array does not help, because it holds the same records. What must be new is the changed record itself.

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: var-loop
        from: js-03-09-debug-captured-bindings
        prompt:
          uk: "Кожна ітерація кладе в масив функцію, що повертає підпис з `i`. Що виведе код?"
          en: "Every iteration puts a function that returns a label with `i` into an array. What does the code print?"
        code: |
          const labels = [];
          for (var i = 0; i < 3; i++) {
            labels.push(() => "#" + i);
          }
          console.log(labels[0](), labels[2]());
        verify:
          logs: ["#3 #3"]
        answer:
          type: choice
          options:
            - id: own
              text:
                uk: "`#0 #2`"
                en: "`#0 #2`"
              why:
                uk: "Так було б із `let`. З `var` на весь цикл є **одна** змінна `i`, і на момент виклику вона вже дорівнює 3."
                en: "That would happen with `let`. With `var` there is **one** variable `i` for the whole loop, and by call time it is already 3."
            - id: shared
              text:
                uk: "`#3 #3`"
                en: "`#3 #3`"
            - id: last-iteration
              text:
                uk: "`#2 #2`"
                en: "`#2 #2`"
              why:
                uk: "Після останньої ітерації ще виконався крок `i++`, тож спільна змінна дорівнює 3, а не 2."
                en: "After the last iteration the update `i++` ran once more, so the shared variable is 3, not 2."
          correct: [shared]
        explanation:
          uk: "`var` створює одну змінну на весь цикл, і всі функції бачать її кінцеве значення 3; `let` дав би кожній ітерації власну. Загальний урок для налагодження: місце, де оголошено змінну, вирішує, чи ділять її ітерації між собою."
          en: "`var` creates one variable for the whole loop, and every function sees its final value 3; `let` would give each iteration its own. The general debugging lesson: where a variable is declared decides whether iterations share it."

  - id: repair-five
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: repair-five
    entry: index.js
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      stretch: { uk: "Розтяжка", en: "Stretching" }
    title:
      uk: "Виправ п’ять дефектів"
      en: "Repair five defects"
    instructions:
      uk: |
        У програмі-звіті п’ять дефектів — по одному в кожній із функцій `findHabit`, `firstDoneOn`, `lastDays`, `fieldNames` і `updateHabit`. Виправ їх так, щоб функції працювали на порожньому списку, на списку з одного запису й на вкладених даних:

        - `findHabit(habits, id)` — звичка з цим `id` або `null`;
        - `firstDoneOn(habits, day)` — **перша** за порядком у списку звичка, виконана того дня, або `null`;
        - `lastDays(habits)` — для кожної звички остання дата виконання, а для звички без виконань — `null`;
        - `fieldNames(record)` — назви **власних** полів запису;
        - `updateHabit(habits, id, changes)` — новий список, де звичку з цим `id` замінено копією зі злитими змінами; вхідний список і звички не змінюються, незмінені звички використовуються повторно.

        Не переписуй програму з нуля: для кожного дефекту досить невеликої зміни. `makeHabit` і дані наприкінці файлу правильні.
      en: |
        The report program has five defects — one in each of the functions `findHabit`, `firstDoneOn`, `lastDays`, `fieldNames` and `updateHabit`. Repair them so that the functions work on an empty list, on a list with one record and on nested data:

        - `findHabit(habits, id)` — the habit with this `id`, or `null`;
        - `firstDoneOn(habits, day)` — the **first** habit in list order completed on that day, or `null`;
        - `lastDays(habits)` — the last completion date of every habit, and `null` for a habit with no completions;
        - `fieldNames(record)` — the names of the record's **own** fields;
        - `updateHabit(habits, id, changes)` — a new list where the habit with this `id` is replaced by a copy with the changes merged in; the input list and habits do not change, and untouched habits are reused.

        Do not rewrite the program from scratch: a small change is enough for each defect. `makeHabit` and the data at the end of the file are correct.
    testTitles:
      "findHabit finds a habit by id":
        uk: "findHabit знаходить звичку за id"
        en: "findHabit finds a habit by id"
      "findHabit returns null for an unknown id and an empty list":
        uk: "findHabit повертає null для невідомого id і порожнього списку"
        en: "findHabit returns null for an unknown id and an empty list"
      "firstDoneOn returns the first habit done that day":
        uk: "firstDoneOn повертає першу звичку, виконану того дня"
        en: "firstDoneOn returns the first habit done that day"
      "lastDays gives null to a habit without completions":
        uk: "lastDays дає null звичці без виконань"
        en: "lastDays gives null to a habit without completions"
      "fieldNames lists only the own fields":
        uk: "fieldNames перелічує лише власні поля"
        en: "fieldNames lists only the own fields"
      "updateHabit merges the changes into a new habit":
        uk: "updateHabit зливає зміни в нову звичку"
        en: "updateHabit merges the changes into a new habit"
      "updateHabit leaves the original list and habits unchanged":
        uk: "updateHabit не змінює вхідний список і звички"
        en: "updateHabit leaves the original list and habits unchanged"
      "updateHabit reuses the untouched habits":
        uk: "updateHabit повторно використовує незмінені звички"
        en: "updateHabit reuses the untouched habits"
    hints:
      nudge:
        uk: "Запусти програму й порівняй кожен рядок консолі з тим, що функція мала б повернути. Для кожного неправильного рядка в консолі спитай: на яких даних — порожніх, одному записі чи вкладених — функція помиляється?"
        en: "Run the program and compare every console line with what the function should return. For every wrong line ask: on which data — empty, a single record or nested — does the function go wrong?"
      explanation:
        uk: "Дефекти такі: межа циклу, що пускає зайву ітерацію; `break`, який мав вийти з двох циклів; змінна-накопичувач, оголошена на рівень вище, ніж треба; `for…in`, що бачить успадковані ключі; і оновлення, що пише в спільний запис, хоча масив скопійовано. Для кожного склади таблицю ітерацій або намалюй посилання — і зміна стане очевидною."
        en: "The defects are: a loop bound that lets in an extra iteration; a `break` that was meant to leave two loops; an accumulator declared one level higher than it should be; a `for…in` that sees inherited keys; and an update that writes into a shared record although the array was copied. Make an iteration table or draw the references for each — and the change becomes obvious."
    solutionNote:
      uk: "Кожне виправлення мінімальне: `<` замість `<=` (остання ітерація — `habits.length - 1`, а для порожнього списку — жодної); `return habits[h]` замість `break` (виходить з обох циклів, тож пізніша звичка не перезапише першу); `let last = null` усередині зовнішнього циклу (кожна звичка починає з чистого аркуша); `Object.keys(record)` замість `for…in` (лише власні поля); `result.push({ ...habit, ...changes })` замість запису в спільний об’єкт (нова лише змінена звичка, решта — ті самі)."
      en: "Every repair is minimal: `<` instead of `<=` (the last iteration is `habits.length - 1`, and an empty list gets none); `return habits[h]` instead of `break` (it leaves both loops, so a later habit cannot overwrite the first); `let last = null` inside the outer loop (every habit starts with a clean slate); `Object.keys(record)` instead of `for…in` (own fields only); `result.push({ ...habit, ...changes })` instead of writing into the shared object (only the changed habit is new, the rest are the same)."
    feedback:
      - when: { test: "findHabit returns null for an unknown id and an empty list" }
        message:
          uk: "Склади таблицю ітерацій для порожнього списку: яке перше `i` і що повертає `habits[i]`? Умова має пускати лише індекси від 0 до `habits.length - 1`."
          en: "Make the iteration table for an empty list: what is the first `i`, and what does `habits[i]` return? The condition must let in only indexes from 0 to `habits.length - 1`."
      - when: { test: "firstDoneOn returns the first habit done that day" }
        message:
          uk: "Має повернутися перша за порядком звичка, виконана того дня, або `null`, якщо такої немає. Якщо після знахідки цикл іде далі, пізніша звичка перезаписує першу; якщо зупинка стоїть не там, пошук обривається ще до збігу."
          en: "The first habit in list order completed on that day must come back, or `null` if there is none. If the loop goes on after a match, a later habit overwrites the first; if the stop is in the wrong place, the search ends before any match."
      - when: { test: "lastDays gives null to a habit without completions" }
        message:
          uk: "Звичка без виконань має отримати `null`. Якщо вона отримує дату попередньої звички, змінна-накопичувач пережила ітерацію зовнішнього циклу: подивись, де її оголошено."
          en: "A habit with no completions must get `null`. If it gets the previous habit's date, the accumulator variable survived an iteration of the outer loop: look at where it is declared."
      - when: { test: "fieldNames lists only the own fields" }
        message:
          uk: "Мають бути лише власні поля запису. `for…in` обходить і успадковані ключі (наприклад, `frequency` і `active` від `habitDefaults`) — візьми спосіб обходу, що бачить лише власні поля."
          en: "Only the record's own fields belong in the result. `for…in` also walks inherited keys (such as `frequency` and `active` from `habitDefaults`) — use a way of walking that sees only own fields."
      - when: { test: "updateHabit leaves the original list and habits unchanged" }
        message:
          uk: "Вхідний список і звички мають лишитися як були. Якщо масив скопійовано, а зміни записано в знайдену звичку, змінено спільний об’єкт: копія масиву тримає ті самі звички. У новий список має потрапити нова звичка."
          en: "The input list and habits must stay as they were. If the array is copied but the changes are written into the found habit, a shared object changes: the copied array holds the same habits. The new list needs a new habit."
      - when: { test: "updateHabit reuses the untouched habits" }
        message:
          uk: "Новою має бути лише змінена звичка. Решта звичок у новому списку мають бути тими самими об’єктами, що й у вхідному, — без жодних копій, ні глибоких, ні через `{ ... }`."
          en: "Only the changed habit should be new. The other habits in the new list must be the very same objects as in the input list — no copies of them, neither deep ones nor `{ ... }` ones."
      - when: { error: TypeError }
        message:
          uk: "Якщо `TypeError` виникає під час читання `id` чи `completions`, цикл, найімовірніше, зазирнув за кінець списку: там `undefined`, а в нього полів немає. Перевір умову виходу в циклах, які читають ці поля."
          en: "If a `TypeError` appears while reading `id` or `completions`, a loop most likely looked past the end of the list: there is `undefined` there, and it has no fields. Check the exit condition of the loops that read these fields."

  - id: to-project
    kind: transfer
    capstoneStep: JS-04
    body:
      uk: "Перш ніж вважати функцію свого проєкту готовою, прожени її на порожньому списку, на одному записі й на записі з порожнім вкладеним масивом. А після кожного оновлення перевір через `===` і вхідний список: він мав лишитися недоторканим."
      en: "Before you call a function of your project finished, run it on an empty list, on a single record and on a record with an empty nested array. And after every update, check the input list with `===` as well: it must have stayed untouched."
