id: js-04-05-objects-properties
unit: JS-04
title:
  uk: "Об’єкти: властивості з назвами"
  en: "Objects: named properties"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Читати, додавати, змінювати й видаляти властивості через крапку й квадратні дужки, зокрема коли назва лежить у змінній."
    en: "Read, add, change and delete properties with dot and bracket notation, including a key held in a variable."
  - uk: "Відрізняти відсутню властивість від властивості зі значенням `undefined` за допомогою `in` і `Object.hasOwn` та пояснювати, яка з цих перевірок дивиться лише на власні властивості об’єкта."
    en: "Tell a missing property from a property whose value is `undefined` with `in` and `Object.hasOwn`, and explain which of the two checks only the object's own properties."
prerequisites: [js-04-01-arrays-basics, js-02-04-nullish-optional-chaining, js-02-09-rare-operators-special-values]
subskills:
  - { family: J-05, skill: "property access and ownership", depth: intro }
glossary: [object, property, dot-notation, bracket-notation, own-property]
selfCheck: [dot-or-bracket, get-field]

blocks:
  - id: named-slots
    kind: explanation
    title:
      uk: "Об’єкт дає значенням назви"
      en: "An object gives values names"
    body:
      uk: |
        Масив нумерує значення, а [[object|об’єкт]] дає кожному **назву**. Запис зі списку бажань — це об’єкт:

        ```js
        const wish = { id: "w-02", name: "Настільна лампа", price: 45 };
        ```

        Кожна пара `назва: значення` — це [[property|властивість]]. Найчастіше її читають через крапку — це [[dot-notation|точкова нотація]]:

        ```js
        wish.price;            // 45
        wish.price = 50;       // change
        wish.category = "Дім"; // add: there was no such property yet
        delete wish.price;     // remove
        wish.price;            // undefined — and no error at all
        ```

        Читання властивості, якої немає, працює як читання неіснуючої комірки масиву: результат `undefined`, а програма йде далі.
      en: |
        An array numbers its values, while an [[object]] gives each one a **name**. A record from the wish list is an object:

        ```js
        const wish = { id: "w-02", name: "Desk lamp", price: 45 };
        ```

        Each `name: value` pair is a [[property]]. Most often you read it with a dot — that is [[dot-notation|dot notation]]:

        ```js
        wish.price;             // 45
        wish.price = 50;        // change
        wish.category = "Home"; // add: there was no such property yet
        delete wish.price;      // remove
        wish.price;             // undefined — and no error at all
        ```

        Reading a property that does not exist works like reading a missing array slot: the result is `undefined`, and the program goes on.

  - id: brackets
    kind: explanation
    title:
      uk: "Квадратні дужки й назва в змінній"
      en: "Square brackets and a name in a variable"
    body:
      uk: |
        Властивість можна прочитати й через квадратні дужки — це [[bracket-notation|дужкова нотація]]: `task["priority"]`. Її сила в тому, що назву можна взяти **зі змінної**:

        ```js
        const task = { title: "Полити квіти", priority: "high" };
        const key = "priority";
        task[key]; // "high" — the name comes from the value of key
        task.key;  // undefined — looks for a property literally called "key"
        ```

        Крапка бере назву буквально, як вона написана в коді. Дужки спершу обчислюють вираз усередині, а тоді беруть властивість із назвою, що вийшла. Тому функція, яка отримує назву поля в параметрі, читає поле лише через дужки.
      en: |
        A property can also be read with square brackets — that is [[bracket-notation|bracket notation]]: `task["priority"]`. Its power is that the name can come **from a variable**:

        ```js
        const task = { title: "Water the plants", priority: "high" };
        const key = "priority";
        task[key]; // "high" — the name comes from the value of key
        task.key;  // undefined — looks for a property literally called "key"
        ```

        A dot takes the name literally, exactly as written in the code. Brackets first evaluate the expression inside and then take the property with the resulting name. That is why a function that receives a field name as a parameter reads the field only with brackets.

  - id: dot-or-bracket
    kind: prediction
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    prompt:
      uk: "Що з’явиться в консолі?"
      en: "What appears in the console?"
    code: |
      const wish = { name: "%%lamp%%", price: 45 };
      const field = "price";
      console.log(wish.price);
      console.log(wish["price"]);
      console.log(wish[field]);
      console.log(wish.field);
    verify:
      logs: ["45", "45", "45", "undefined"]
    answer:
      type: choice
      options:
        - id: last-undefined
          text:
            uk: "`45`, `45`, `45`, `undefined`"
            en: "`45`, `45`, `45`, `undefined`"
        - id: all-45
          text:
            uk: "Чотири рази `45`"
            en: "`45` four times"
          why:
            uk: "`wish.field` бере назву буквально: шукає властивість `field`, а її немає. Назву зі змінної бере лише `wish[field]`."
            en: "`wish.field` takes the name literally: it looks for a property called `field`, and there is none. Only `wish[field]` takes the name from the variable."
        - id: variable-fails
          text:
            uk: "`45`, `45`, `undefined`, `undefined`"
            en: "`45`, `45`, `undefined`, `undefined`"
          why:
            uk: "У дужках стоїть вираз: `field` обчислюється в `\"price\"`, тож `wish[field]` — це `wish[\"price\"]`, тобто 45."
            en: "The brackets hold an expression: `field` evaluates to `\"price\"`, so `wish[field]` is `wish[\"price\"]`, which is 45."
        - id: error
          text:
            uk: "`45`, `45`, `45`, а потім помилка"
            en: "`45`, `45`, `45`, then an error"
          why:
            uk: "Читання властивості, якої немає, — не помилка: результат `undefined`."
            en: "Reading a property that does not exist is not an error: the result is `undefined`."
      correct: [last-undefined]
    explanation:
      uk: "`wish.price`, `wish[\"price\"]` і `wish[field]` читають ту саму властивість: у дужках назву обчислено зі значення змінної. А `wish.field` шукає властивість, що буквально зветься `field`. Такої немає — отже, `undefined`."
      en: "`wish.price`, `wish[\"price\"]` and `wish[field]` read the same property: in brackets the name is computed from the variable's value. But `wish.field` looks for a property literally called `field`. There is none — so `undefined`."

  - id: missing-or-empty
    kind: prediction
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    prompt:
      uk: "У цього бажання поле `category` є, але в ньому `undefined`; поля `size` немає зовсім. Що з’явиться в консолі?"
      en: "This wish has a `category` field, but it holds `undefined`; there is no `size` field at all. What appears in the console?"
    code: |
      const wish = { name: "%%lamp%%", category: undefined };
      console.log(wish.category === undefined, wish.size === undefined);
      console.log("category" in wish, "size" in wish);
      console.log("toString" in wish, Object.hasOwn(wish, "toString"));
    verify:
      logs: ["true true", "true false", "true false"]
    answer:
      type: choice
      options:
        - id: names-differ
          text:
            uk: "`true true`, `true false`, `true false`"
            en: "`true true`, `true false`, `true false`"
        - id: undefined-means-missing
          text:
            uk: "`true true`, `false false`, `false false`"
            en: "`true true`, `false false`, `false false`"
          why:
            uk: "Поле `category` існує — просто його значення `undefined`, тож `\"category\" in wish` дає `true`. А `in` бачить ще й успадкований `toString`."
            en: "The field `category` exists — its value is just `undefined`, so `\"category\" in wish` gives `true`. And `in` also sees the inherited `toString`."
        - id: in-own-only
          text:
            uk: "`true true`, `true false`, `false false`"
            en: "`true true`, `true false`, `false false`"
          why:
            uk: "`in` перевіряє не лише власні поля: `toString` об’єкт отримує через приховане посилання на `Object.prototype`, тож `\"toString\" in wish` — `true`."
            en: "`in` checks more than own fields: the object gets `toString` through a hidden link to `Object.prototype`, so `\"toString\" in wish` is `true`."
        - id: values-differ
          text:
            uk: "`true false`, `true false`, `true false`"
            en: "`true false`, `true false`, `true false`"
          why:
            uk: "Читання відсутнього поля `size` теж дає `undefined`, тож обидва порівняння правдиві: за значенням ці два випадки не розрізнити."
            en: "Reading the missing field `size` gives `undefined` too, so both comparisons are true: by value the two cases cannot be told apart."
      correct: [names-differ]
    explanation:
      uk: "За значенням поле з `undefined` і відсутнє поле однакові: обидва порівняння дають `true`. Розрізняє їх `in`: назва `category` є, `size` — немає. Але `in` бачить і успадковане — `toString` — тоді як `Object.hasOwn` перевіряє лише власні поля об’єкта."
      en: "By value a field holding `undefined` and a missing field look the same: both comparisons give `true`. `in` tells them apart: the name `category` exists, `size` does not. But `in` also sees inherited things — `toString` — while `Object.hasOwn` checks only the object's own fields."

  - id: missing-or-undefined
    kind: explanation
    title:
      uk: "Немає поля чи в полі undefined?"
      en: "No field, or a field holding undefined?"
    body:
      uk: |
        `undefined` у відповідь може означати дві різні речі: властивості немає зовсім — або вона є, але її значення `undefined`. Порівняння `wish.category === undefined` їх не розрізняє. Для цього є дві перевірки:

        - `"category" in wish` — оператор `in`: чи є така назва в об’єкті **або в об’єкті, від якого він успадковує**.
        - `Object.hasOwn(wish, "category")` — чи є в самого об’єкта така [[own-property|власна властивість]].

        Різницю видно на `toString`. Кожен звичайний об’єкт має приховане посилання на спільний об’єкт `Object.prototype` із вбудованими можливостями. Тому `"toString" in wish` дає `true`, хоча такого поля ти не писав, а `Object.hasOwn(wish, "toString")` — `false`. Про поля запису питай `Object.hasOwn`: «чи є це поле в самому записі?»
      en: |
        An `undefined` answer can mean two different things: the property does not exist at all — or it exists, but its value is `undefined`. The comparison `wish.category === undefined` cannot tell them apart. Two checks can:

        - `"category" in wish` — the `in` operator: is there such a name in the object **or in the object it inherits from**?
        - `Object.hasOwn(wish, "category")` — does the object itself have such an [[own-property|own property]]?

        The difference shows on `toString`. Every ordinary object has a hidden link to the shared object `Object.prototype` with built-in abilities. That is why `"toString" in wish` gives `true` although you never wrote such a field, while `Object.hasOwn(wish, "toString")` gives `false`. For the fields of a record, ask `Object.hasOwn`: “is this field in the record itself?”

  - id: object-box
    kind: visual
    visual: memory-graph
    title:
      uk: "Об’єкт, його властивості й приховане посилання"
      en: "An object, its properties and the hidden link"
    textEquivalent:
      uk: "Змінна wish вказує на об’єкт із двома власними властивостями: id зі значенням w-02 і price зі значенням 45. Окремо намальовано приховане посилання [[Prototype]] на спільний об’єкт Object.prototype, де живе вбудована функція toString; це не властивість wish. Змінна field містить текст price, тому wish[field] читає й записує властивість price: запис wish[field] = 50 змінює її на 50. Присвоєння wish.category = home додає нову властивість, а delete wish.price прибирає price зовсім, після чого wish.price дає undefined. Наприкінці «toString» in wish дає true, бо in іде й за прихованим посиланням до Object.prototype, а Object.hasOwn(wish, «toString») дає false, бо перевіряє лише власні властивості wish: id і category. Консоль показує true, а потім false."
      en: "The variable wish points at an object with two own properties: id holding w-02 and price holding 45. A hidden [[Prototype]] link is drawn separately, leading to the shared object Object.prototype where the built-in function toString lives; it is not a property of wish. The variable field holds the text price, so wish[field] reads and writes the property price: wish[field] = 50 changes it to 50. Assigning wish.category = home adds a new property, and delete wish.price removes price completely, after which wish.price gives undefined. At the end “toString” in wish gives true, because in also follows the hidden link to Object.prototype, while Object.hasOwn(wish, “toString”) gives false, because it checks only the own properties of wish: id and category. The console shows true, then false."
    spec:
      code: |
        const wish = { id: "w-02", price: 45 };
        const field = "price";
        wish[field] = 50;
        wish.category = "home";
        delete wish.price;
        console.log("toString" in wish);
        console.log(Object.hasOwn(wish, "toString"));
      states:
        - caption:
            uk: "`wish` вказує на об’єкт із двома **власними** властивостями: `id` і `price`. Рядок `[[Prototype]]` — не властивість, а приховане посилання на спільний об’єкт `Object.prototype`, де живуть вбудовані речі на кшталт `toString`."
            en: "`wish` points at an object with two **own** properties: `id` and `price`. The `[[Prototype]]` row is not a property but a hidden link to the shared object `Object.prototype`, where built-in things like `toString` live."
          line: 1
          bindings:
            - { name: wish, kind: const, value: { ref: wish } }
          heap:
            wish: { kind: object, props: { id: "w-02", price: 45, "[[Prototype]]": { ref: op } } }
            op: { kind: object, ctor: "Object.prototype", props: { toString: { ref: fn } } }
            fn: { kind: function, name: toString }
        - caption:
            uk: "`field` містить **текст** `\"price\"`. Тож `wish[field]` — це `wish[\"price\"]`, тобто 45. А `wish.field` шукав би властивість із назвою `field` — такої немає."
            en: "`field` holds the **text** `\"price\"`. So `wish[field]` is `wish[\"price\"]`, which is 45. But `wish.field` would look for a property named `field` — there is none."
          line: 2
          bindings:
            - { name: wish, kind: const, value: { ref: wish } }
            - { name: field, kind: const, value: "price" }
          heap:
            wish: { kind: object, props: { id: "w-02", price: 45, "[[Prototype]]": { ref: op } } }
            op: { kind: object, ctor: "Object.prototype", props: { toString: { ref: fn } } }
            fn: { kind: function, name: toString }
        - caption:
            uk: "Запис через дужки змінює властивість, назва якої лежить у `field`: `price` тепер 50."
            en: "Writing through brackets changes the property whose name is in `field`: `price` is now 50."
          line: 3
          bindings:
            - { name: wish, kind: const, value: { ref: wish } }
            - { name: field, kind: const, value: "price" }
          heap:
            wish: { kind: object, props: { id: "w-02", price: 50, "[[Prototype]]": { ref: op } } }
            op: { kind: object, ctor: "Object.prototype", props: { toString: { ref: fn } } }
            fn: { kind: function, name: toString }
        - caption:
            uk: "Присвоєння властивості, якої не було, **додає** її в об’єкт: з’явилася `category`."
            en: "Assigning to a property that did not exist **adds** it to the object: `category` appears."
          line: 4
          bindings:
            - { name: wish, kind: const, value: { ref: wish } }
            - { name: field, kind: const, value: "price" }
          heap:
            wish: { kind: object, props: { id: "w-02", price: 50, category: "home", "[[Prototype]]": { ref: op } } }
            op: { kind: object, ctor: "Object.prototype", props: { toString: { ref: fn } } }
            fn: { kind: function, name: toString }
        - caption:
            uk: "`delete` прибирає властивість цілком. Тепер `wish.price` дає `undefined`, а `Object.hasOwn(wish, \"price\")` — `false`."
            en: "`delete` removes the property completely. Now `wish.price` gives `undefined`, and `Object.hasOwn(wish, \"price\")` gives `false`."
          line: 5
          bindings:
            - { name: wish, kind: const, value: { ref: wish } }
            - { name: field, kind: const, value: "price" }
          heap:
            wish: { kind: object, props: { id: "w-02", category: "home", "[[Prototype]]": { ref: op } } }
            op: { kind: object, ctor: "Object.prototype", props: { toString: { ref: fn } } }
            fn: { kind: function, name: toString }
        - caption:
            uk: "`\"toString\" in wish` — `true`: `in` іде й за посиланням `[[Prototype]]`. `Object.hasOwn(wish, \"toString\")` — `false`: він дивиться лише на власні властивості, `id` і `category`. Консоль: `true`, а потім `false`."
            en: "`\"toString\" in wish` is `true`: `in` also follows the `[[Prototype]]` link. `Object.hasOwn(wish, \"toString\")` is `false`: it looks only at the own properties, `id` and `category`. Console: `true`, then `false`."
          line: 7
          bindings:
            - { name: wish, kind: const, value: { ref: wish } }
            - { name: field, kind: const, value: "price" }
          heap:
            wish: { kind: object, props: { id: "w-02", category: "home", "[[Prototype]]": { ref: op } } }
            op: { kind: object, ctor: "Object.prototype", props: { toString: { ref: fn } } }
            fn: { kind: function, name: toString }
          changed: [op]

  - id: inspect-record
    kind: example
    runtime: browser-js
    dir: inspect-record
    entry: index.js
    strings:
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
    title:
      uk: "Розпитуємо запис"
      en: "Questioning a record"
    body:
      uk: |
        Ось справа з планувальника: `dueDate` навмисно порожній (`null` — «без терміну»), а поля `done` немає зовсім. Запусти й порівняй кожен рядок консолі з кодом: де відповідь дає саме значення, а де — перевірка назви.
      en: |
        Here is a task from the planner: `dueDate` is deliberately empty (`null` means “no due date”), and there is no `done` field at all. Run it and match every console line with the code: where does the answer come from the value, and where from a check of the name?
    tryIt:
      uk: "Перед останнім `console.log` додай `task.note = undefined;` і виведи три відповіді: `task.note`, `\"note\" in task` і `Object.hasOwn(task, \"note\")`. Потім видали поле через `delete task.note;` і порівняй знову."
      en: "Before the last `console.log` add `task.note = undefined;` and print three answers: `task.note`, `\"note\" in task` and `Object.hasOwn(task, \"note\")`. Then remove the field with `delete task.note;` and compare again."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
    items:
      - id: optional-chaining
        from: js-02-04-nullish-optional-chaining
        prompt:
          uk: "`dueDate` у справи — `null`, а поля `note` немає. Що виведе код?"
          en: "The task's `dueDate` is `null`, and there is no `note` field. What does the code print?"
        code: |
          const task = { title: "%%water%%", dueDate: null };
          console.log(task.dueDate?.length);
          console.log(task.note?.length);
          console.log(task.dueDate.length);
        verify:
          logs: ["undefined", "undefined"]
          error: TypeError
        answer:
          type: choice
          options:
            - id: then-error
              text:
                uk: "`undefined`, `undefined`, а потім `TypeError`"
                en: "`undefined`, `undefined`, then a `TypeError`"
            - id: three-undefined
              text:
                uk: "Тричі `undefined`"
                en: "`undefined` three times"
              why:
                uk: "У третьому рядку коду немає `?.`, тож JavaScript справді читає `.length` у `null` — і це `TypeError`."
                en: "The third line has no `?.`, so JavaScript really reads `.length` of `null` — and that is a `TypeError`."
            - id: null-first
              text:
                uk: "`null`, `undefined`, а потім `TypeError`"
                en: "`null`, `undefined`, then a `TypeError`"
              why:
                uk: "Коли зліва від `?.` стоїть `null` чи `undefined`, вираз дає `undefined`, а не саме значення зліва."
                en: "When the left side of `?.` is `null` or `undefined`, the expression gives `undefined`, not the left value itself."
          correct: [then-error]
        explanation:
          uk: "`?.` зупиняється й дає `undefined`, коли зліва `null` або `undefined`: `task.dueDate` — це `null`, а `task.note` не існує, тобто `undefined`. Третій рядок коду без `?.`, тому читання `.length` у `null` кидає `TypeError`."
          en: "`?.` stops and gives `undefined` when its left side is `null` or `undefined`: `task.dueDate` is `null`, and `task.note` does not exist, so it is `undefined`. The third line has no `?.`, so reading `.length` of `null` throws a `TypeError`."

  - id: get-field
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: get-field
    entry: index.js
    strings:
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      noDate: { uk: "без терміну", en: "no due date" }
      none: { uk: "немає", en: "none" }
    title:
      uk: "Поле або запасне значення"
      en: "A field or a fallback"
    instructions:
      uk: |
        Допиши `getField(record, field, fallback)`:

        - якщо в самого запису є **власне** поле з назвою `field`, поверни його значення — навіть якщо це `null`, `undefined`, `0` чи `false`;
        - інакше поверни `fallback`.

        Успадковані назви на кшталт `toString` полями запису не вважаються.
      en: |
        Complete `getField(record, field, fallback)`:

        - if the record itself has an **own** field named `field`, return its value — even if it is `null`, `undefined`, `0` or `false`;
        - otherwise return `fallback`.

        Inherited names such as `toString` do not count as fields of the record.
    testTitles:
      "returns the value of an own field":
        uk: "Повертає значення власного поля, назва якого прийшла в параметрі"
        en: "Returns the value of an own field named by the parameter"
      "keeps an own field whose value is null or undefined":
        uk: "Повертає власне поле, навіть коли в ньому null чи undefined"
        en: "Returns an own field even when it holds null or undefined"
      "keeps falsy own values":
        uk: "Не підміняє власні 0, false чи порожній текст"
        en: "Does not replace own 0, false or empty text"
      "returns the fallback for a missing field":
        uk: "Повертає запасне значення, коли поля немає"
        en: "Returns the fallback when the field is missing"
      "ignores inherited names like toString":
        uk: "Не вважає успадкований toString полем запису"
        en: "Does not treat the inherited toString as a field of the record"
    hints:
      nudge:
        uk: "Яке запитання тут головне: «яке значення в поля?» чи «чи є таке поле в самого запису?»"
        en: "Which question matters here: “what value does the field hold?” or “does the record itself have such a field?”"
      explanation:
        uk: "Запитання «чи є таке власне поле?» ставить `Object.hasOwn`: наприклад, `Object.hasOwn(task, \"dueDate\")` дає `true` навіть тоді, коли в `dueDate` лежить `null`. Якщо поле є, поверни його значення (назва поля лежить у параметрі, тож читай через дужки); якщо немає — поверни `fallback`. Не порівнюй значення з `undefined` чи `null`: поле може існувати й мати саме таке значення."
        en: "The question “is there such an own field?” is asked by `Object.hasOwn`: for example, `Object.hasOwn(task, \"dueDate\")` gives `true` even when `dueDate` holds `null`. If the field is there, return its value (the field name sits in a parameter, so read with brackets); if not, return `fallback`. Do not compare the value with `undefined` or `null`: the field may exist and hold exactly that value."
    solutionNote:
      uk: "`Object.hasOwn` відповідає саме на запитання «чи є в цього запису власне поле з такою назвою», тож поле з `null` чи `undefined` повертається як є, а успадкований `toString` — ні. Дужки потрібні, бо назва поля приходить у параметрі. У старшому коді трапляється `record.hasOwnProperty(field)` — для звичайних записів це те саме."
      en: "`Object.hasOwn` answers exactly the question “does this record have an own field with this name”, so a field holding `null` or `undefined` is returned as it is, and the inherited `toString` is not. Brackets are needed because the field name arrives in a parameter. Older code uses `record.hasOwnProperty(field)` — for ordinary records it is the same."
    feedback:
      - when: { test: "returns the value of an own field" }
        message:
          uk: "Функція має повернути значення поля, назва якого лежить у параметрі `field`. Якщо пишеш `record.field`, JavaScript шукає властивість, що буквально зветься `field`; назву з параметра бере лише запис через дужки."
          en: "The function must return the value of the field whose name sits in the parameter `field`. If you write `record.field`, JavaScript looks for a property literally called `field`; only bracket notation takes the name from the parameter."
      - when: { test: "keeps an own field whose value is null or undefined" }
        message:
          uk: "Поле `dueDate` у записі є, просто його значення — `null`, тож функція має повернути `null`, а не запасне значення. Перевіряй, чи є в записі власне поле з такою назвою, а не яке в нього значення."
          en: "The `dueDate` field exists in the record, its value is just `null`, so the function must return `null`, not the fallback. Check whether the record has an own field with that name, not what value it holds."
      - when: { test: "keeps falsy own values" }
        message:
          uk: "Власні `0`, `false` чи `\"\"` — справжні значення, і їх треба повернути. Якщо використовуєш `||`, пам’ятай, що він підміняє й такі значення. Рішення має залежати від того, чи є поле, а не від його значення."
          en: "An own `0`, `false` or `\"\"` is a real value and must be returned. If you use `||`, remember that it replaces such values too. The decision must depend on whether the field exists, not on its value."
      - when: { test: "ignores inherited names like toString" }
        message:
          uk: "`toString` — не поле запису, а властивість, успадкована від `Object.prototype`, тож має повернутися запасне значення. Оператор `in` і читання `record[field]` бачать і успадковане, а `Object.hasOwn` перевіряє лише власні поля."
          en: "`toString` is not a field of the record but a property inherited from `Object.prototype`, so the fallback must come back. The `in` operator and reading `record[field]` also see inherited things, while `Object.hasOwn` checks own fields only."
      - when: { test: "returns the fallback for a missing field" }
        message:
          uk: "Коли поля в записі немає, функція має повернути третій параметр — `fallback`."
          en: "When the record has no such field, the function must return the third parameter — `fallback`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-04
    body:
      uk: "Записи твого проєкту — це об’єкти: `item.price`, `task.dueDate`, `habit.completions`, `expense.amountMinor`. У кроці проєкту ти змінюватимеш поля за назвою — через `record[field]`, коли назва приходить у параметрі, — і перевірятимеш через `Object.hasOwn`, які поля справді є в зміні."
      en: "The records of your project are objects: `item.price`, `task.dueDate`, `habit.completions`, `expense.amountMinor`. In the project step you will change fields by name — with `record[field]` when the name arrives in a parameter — and check with `Object.hasOwn` which fields a change really carries."
