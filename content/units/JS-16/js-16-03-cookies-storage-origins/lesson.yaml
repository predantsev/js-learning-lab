id: js-16-03-cookies-storage-origins
unit: JS-16
title:
  uk: "Cookie, сховище та origin"
  en: "Cookies, storage and origins"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Вирішити, чи мають дві адреси один origin (схема, хост, порт), а отже — спільні `localStorage` і `sessionStorage`."
    en: "Decide whether two URLs share an origin (scheme, host, port) and therefore share `localStorage` and `sessionStorage`."
  - uk: "Порівняти межі cookie (Domain, Path, SameSite, HttpOnly, Secure, час життя) з вебсховищем і сказати, що з них їде разом із запитами, а що можуть прочитати скрипти."
    en: "Compare a cookie's scope (Domain, Path, SameSite, HttpOnly, Secure, lifetime) with web storage, and say which of them travel with requests and which scripts can read."
prerequisites: [js-16-02-http-methods-status-headers, js-07-05-persist-reload]
subskills:
  - { family: W-04, skill: "cookies/storage/origins", depth: intro }
glossary: [origin, cookie, cookie-attributes]
selfCheck: [predict-origins, same-origin]

blocks:
  - id: what-origin-is
    kind: explanation
    title:
      uk: "Origin — це схема, хост і порт"
      en: "An origin is the scheme, the host and the port"
    body:
      uk: |
        Браузер ділить сайти на [[origin|origins]]: три перші частини адреси разом. Шлях, рядок запиту й фрагмент у origin не входять.

        ```js
        new URL("http://localhost:5173/planner?day=2026-03-02").origin; // "http://localhost:5173"
        ```

        Від origin залежить, хто бачить сховище:

        - `localStorage` — один на origin. Усі сторінки `http://localhost:5173/…` бачать ті самі ключі, а `http://localhost:5174` — уже інше, порожнє сховище.
        - `sessionStorage` працює так само, але ще й окремий для кожної вкладки і зникає, коли вкладку закрили.

        Тож «той самий комп’ютер» чи «той самий `localhost`» нічого не означає: інший порт — інший origin. Схема теж рахується: `https://localhost:5173` — не той самий origin, що `http://localhost:5173`.
      en: |
        The browser divides sites into [[origin|origins]]: the first three parts of an address together. The path, the query string and the fragment are not part of the origin.

        ```js
        new URL("http://localhost:5173/planner?day=2026-03-02").origin; // "http://localhost:5173"
        ```

        The origin decides who sees the storage:

        - `localStorage` — one per origin. Every page `http://localhost:5173/…` sees the same keys, while `http://localhost:5174` has a different, empty storage.
        - `sessionStorage` works the same way, but is also separate for each tab and disappears when the tab is closed.

        So “the same computer” or “the same `localhost`” means nothing here: another port is another origin. The scheme counts too: `https://localhost:5173` is not the same origin as `http://localhost:5173`.

  - id: cookies
    kind: explanation
    title:
      uk: "Cookie: дані, що їдуть із запитами"
      en: "Cookies: data that travels with requests"
    body:
      uk: |
        [[cookie|Cookie]] — це не «старий `localStorage`». Сервер надсилає його заголовком відповіді, а браузер потім **сам додає** його до кожного відповідного запиту:

        ```text
        Set-Cookie: theme=dark; Path=/; Max-Age=2592000; SameSite=Lax
        ```

        Межі cookie задають [[cookie-attributes|атрибути]], а не origin:

        | Атрибут | Що робить |
        |---|---|
        | без `Domain` | лише той самий хост; **порт не важить** |
        | `Domain=example.test` | цей хост і всі піддомени |
        | `Path=/account` | лише адреси, що починаються з `/account` |
        | `Max-Age` / `Expires` | час життя; без них cookie зникне, коли закриють браузер |
        | `Secure` | лише через `https` (Chrome робить виняток для `localhost` і `127.0.0.1`: там і через `http`) |
        | `HttpOnly` | скрипти сторінки (`document.cookie`) його не бачать |
        | `SameSite=Strict` | не їде з жодним запитом, який почала сторінка іншого сайту |
        | `SameSite=Lax` | із запитів іншого сайту їде лише тоді, коли людина переходить за посиланням; із `fetch` чи `POST`-форми — ні |

        «Сайт» для `SameSite` ширший за origin: порт у ньому не враховується, тож `localhost:5173` і `localhost:5174` — той самий сайт, хоч і різні origins.

        `localStorage` навпаки: нікуди не їде, але його читає будь-який скрипт того самого origin.
      en: |
        A [[cookie]] is not “an old `localStorage`”. The server sends it in a response header, and from then on the browser **adds it by itself** to every matching request:

        ```text
        Set-Cookie: theme=dark; Path=/; Max-Age=2592000; SameSite=Lax
        ```

        A cookie’s scope is set by its [[cookie-attributes|attributes]], not by the origin:

        | Attribute | What it does |
        |---|---|
        | no `Domain` | the same host only; **the port does not matter** |
        | `Domain=example.test` | this host and all its subdomains |
        | `Path=/account` | only addresses that start with `/account` |
        | `Max-Age` / `Expires` | the lifetime; without them the cookie disappears when the browser is closed |
        | `Secure` | over `https` only (Chrome makes an exception for `localhost` and `127.0.0.1`: there over `http` too) |
        | `HttpOnly` | the page’s scripts (`document.cookie`) cannot see it |
        | `SameSite=Strict` | does not travel with any request started by a page of another site |
        | `SameSite=Lax` | of the requests another site starts, travels only when a person follows a link; not with `fetch` or a `POST` form |

        A “site” for `SameSite` is wider than an origin: the port does not count, so `localhost:5173` and `localhost:5174` are the same site, though different origins.

        `localStorage` is the opposite: it travels nowhere, but any script of the same origin can read it.

  - id: predict-origins
    kind: prediction
    prompt:
      uk: "Сторінка `http://localhost:5173/wishes` зберегла ключ у `localStorage` і отримала cookie `theme=dark; Path=/` (без `Domain`). Які твердження правдиві? Обери всі."
      en: "The page `http://localhost:5173/wishes` saved a key in `localStorage` and received the cookie `theme=dark; Path=/` (no `Domain`). Which statements are true? Choose all that are."
    answer:
      type: multi
      options:
        - id: path-shares
          text:
            uk: "`http://localhost:5173/planner` бачить той самий `localStorage`"
            en: "`http://localhost:5173/planner` sees the same `localStorage`"
        - id: port-shares
          text:
            uk: "`http://localhost:5174/wishes` бачить той самий `localStorage` — це ж той самий `localhost`"
            en: "`http://localhost:5174/wishes` sees the same `localStorage` — it is the same `localhost`, after all"
          why:
            uk: "Порт — частина origin. Інший порт — інший origin і окреме, порожнє сховище."
            en: "The port is part of the origin. Another port is another origin and a separate, empty storage."
        - id: https-shares
          text:
            uk: "`https://localhost:5173/wishes` бачить той самий `localStorage`"
            en: "`https://localhost:5173/wishes` sees the same `localStorage`"
          why:
            uk: "Схема — теж частина origin: `https` і `http` на тому самому хості й порту мають різні сховища."
            en: "The scheme is part of the origin too: `https` and `http` on the same host and port have different storages."
        - id: cookie-port
          text:
            uk: "Запит до `http://localhost:5174/api` отримує cookie `theme`"
            en: "A request to `http://localhost:5174/api` gets the `theme` cookie"
        - id: cookie-sub
          text:
            uk: "Запит до `http://app.localhost:5173/` отримує cookie `theme`"
            en: "A request to `http://app.localhost:5173/` gets the `theme` cookie"
          why:
            uk: "Cookie без `Domain` належить рівно тому хосту, що його встановив. Піддомен — інший хост."
            en: "A cookie without `Domain` belongs to exactly the host that set it. A subdomain is another host."
      correct: [path-shares, cookie-port]
    explanation:
      uk: "`localStorage` ділиться за origin — схема, хост і порт мусять збігатися, тож спільне сховище має лише `/planner` на тому самому `localhost:5173`. Cookie живе за іншими правилами: хост і шлях, а порт не важить. Тому cookie з порту 5173 їде й до порту 5174, але не до піддомену. Обидва факти ти побачиш у локальному завданні цього уроку."
      en: "`localStorage` is shared by origin — the scheme, host and port must all match, so only `/planner` on the same `localhost:5173` shares the storage. A cookie lives by other rules: host and path, while the port does not matter. So a cookie from port 5173 also travels to port 5174, but not to a subdomain. You will see both facts in this lesson’s local task."

  - id: origin-boxes
    kind: visual
    visual: diagram
    title:
      uk: "Три origins, одне сховище кожному й один cookie"
      en: "Three origins, one storage each and one cookie"
    textEquivalent:
      uk: "Три сторінки відкрито в одному браузері: http://localhost:5173, http://localhost:5174 і http://app.localhost:5173. Кожна має власний localStorage. Сторінка на порту 5173 зберегла ключ jsll.wishlist.v1; сторінки на порту 5174 і на піддомені app.localhost його не бачать — їхні сховища порожні, бо це інші origins. Сервер на localhost:5173 встановив cookie theme=dark без атрибута Domain, тобто лише для хоста localhost. Браузер додає його до запитів на localhost:5173 і на localhost:5174, бо порт для cookie не важить, але не додає до запитів на app.localhost:5173 — це інший хост. Сховище залежить від origin, а cookie — від хоста й шляху."
      en: "Three pages are open in one browser: http://localhost:5173, http://localhost:5174 and http://app.localhost:5173. Each has its own localStorage. The page on port 5173 saved the key jsll.wishlist.v1; the pages on port 5174 and on the subdomain app.localhost do not see it — their storages are empty, because they are other origins. The server at localhost:5173 set the cookie theme=dark without a Domain attribute, that is, for the host localhost only. The browser adds it to requests to localhost:5173 and to localhost:5174, because the port does not matter for cookies, but not to requests to app.localhost:5173 — that is another host. Storage depends on the origin; a cookie depends on the host and the path."
    spec:
      layout: grid
      groups:
        - { id: o5173, label: "http://localhost:5173" }
        - { id: o5174, label: "http://localhost:5174" }
        - { id: oapp, label: "http://app.localhost:5173" }
      nodes:
        - { id: ls5173, group: o5173, label: "jsll.wishlist.v1", col: 0, row: 0 }
        - { id: ls5174, group: o5174, label: { uk: "(порожньо)", en: "(empty)" }, col: 0, row: 1 }
        - { id: lsapp, group: oapp, label: { uk: "(порожньо)", en: "(empty)" }, col: 0, row: 2 }
        - { id: jar, label: "theme=dark", shape: note, col: 1, row: 1 }
      edges:
        - { id: to5173, from: jar, to: ls5173, label: { uk: "додається", en: "attached" } }
        - { id: to5174, from: jar, to: ls5174, label: { uk: "додається", en: "attached" } }
        - { id: toapp, from: jar, to: lsapp, kind: dashed, label: { uk: "ні", en: "no" } }
      hidden: [jar, to5173, to5174, toapp]
      steps:
        - caption:
            uk: "Три сторінки в одному браузері — три різні origins: різняться порт або хост. У кожній рамці — ключі її `localStorage`."
            en: "Three pages in one browser — three different origins: the port or the host differs. Each frame shows the keys of its `localStorage`."
        - caption:
            uk: "Сторінка на `localhost:5173` зберегла `jsll.wishlist.v1`. Сторінки на порту 5174 і на `app.localhost` цього ключа **не бачать**: сховище в кожного origin своє."
            en: "The page on `localhost:5173` saved `jsll.wishlist.v1`. The pages on port 5174 and on `app.localhost` do **not** see that key: every origin has its own storage."
          highlight: [ls5173]
          dim: [ls5174, lsapp]
        - caption:
            uk: "Сервер на `localhost:5173` встановив cookie `theme=dark` без `Domain`: він належить хосту `localhost`."
            en: "The server at `localhost:5173` set the cookie `theme=dark` without `Domain`: it belongs to the host `localhost`."
          show: [jar]
          highlight: [jar]
        - caption:
            uk: "Браузер додає cookie до запитів на `localhost:5173` **і** на `localhost:5174`: для cookie порт не важить."
            en: "The browser attaches the cookie to requests to `localhost:5173` **and** to `localhost:5174`: the port does not matter for cookies."
          show: [to5173, to5174]
          highlight: [to5173, to5174, jar]
        - caption:
            uk: "А до `app.localhost:5173` — ні: cookie без `Domain` лише для того самого хоста. Сховище ділиться за origin, cookie — за хостом і шляхом."
            en: "But not to `app.localhost:5173`: a cookie without `Domain` is for the same host only. Storage is split by origin, a cookie by host and path."
          show: [toapp]
          highlight: [toapp, lsapp]

  - id: cookie-lab
    kind: example
    runtime: browser-js
    dir: cookie-lab
    entry: index.js
    strings:
      sessionValue: { uk: "7f3a9c", en: "7f3a9c" }
      attached: { uk: "додається:", en: "attached:" }
      notAttached: { uk: "не додається:", en: "not attached:" }
      scriptsCanRead: { uk: "скрипти можуть його прочитати:", en: "scripts can read it:" }
    title:
      uk: "Origins і записаний Set-Cookie"
      en: "Origins and a recorded Set-Cookie"
    body:
      uk: |
        Перша частина друкує origin кожної адреси — порівняй їх із origin сторінки.

        Друга частина розбирає заголовок `Set-Cookie`, записаний із відповіді сервера, і за спрощеною моделлю правил браузера (хост, `Domain`, `Path`, `Secure`) показує, до яких запитів cookie буде додано. Справжніх cookie в пісочниці немає: її сторінка не має власного origin, і браузер забороняє їй `document.cookie`. Справжні ти побачиш у локальному завданні.
      en: |
        The first part prints the origin of each address — compare them with the page’s origin.

        The second part parses a `Set-Cookie` header recorded from a server’s response and, with a simplified model of the browser’s rules (host, `Domain`, `Path`, `Secure`), shows which requests the cookie will be attached to. There are no real cookies in the sandbox: its page has no origin of its own, and the browser forbids `document.cookie` there. You will see real ones in the local task.
    tryIt:
      uk: |
        Змінюй у `header` по одному атрибуту й запускай знову:

        1. Заміни `Path=/` на `Path=/account`: cookie лишиться лише для адреси `/account/settings`.
        2. Поверни `Path=/` і додай `; Domain=example.test`: тепер cookie їде й на `api.example.test`.
        3. Додай `; Secure`: жоден із цих запитів через `http` його вже не отримає.
        4. Прибери `HttpOnly`: останній рядок покаже, що скрипти сторінки можуть прочитати такий cookie.
      en: |
        Change one attribute in `header` at a time and run again:

        1. Replace `Path=/` with `Path=/account`: the cookie stays only for the address `/account/settings`.
        2. Put `Path=/` back and add `; Domain=example.test`: now the cookie travels to `api.example.test` as well.
        3. Add `; Secure`: none of these requests over `http` gets it any more.
        4. Remove `HttpOnly`: the last line shows that the page’s scripts can read such a cookie.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: сховище й адреса"
      en: "Recall: storage and the address"
    items:
      - id: storage-stays
        from: js-07-05-persist-reload
        prompt:
          uk: "Застосунок зберігає список справ у `localStorage` під ключем `jsll.planner.v1`. Що з цього отримує сервер, коли сторінка робить `fetch(\"/api/tasks\")`?"
          en: "An app keeps its task list in `localStorage` under the key `jsll.planner.v1`. What of it does the server receive when the page calls `fetch(\"/api/tasks\")`?"
        answer:
          type: choice
          options:
            - id: nothing
              text: { uk: "Нічого: `localStorage` не покидає браузера", en: "Nothing: `localStorage` never leaves the browser" }
            - id: all
              text: { uk: "Увесь `localStorage` того origin", en: "The whole `localStorage` of that origin" }
              why:
                uk: "Так поводяться cookie, а не `localStorage`. Сховище лишається в браузері; щоб сервер отримав дані, код має сам покласти їх у запит."
                en: "That is how cookies behave, not `localStorage`. The storage stays in the browser; for the server to get the data, the code has to put it into a request itself."
            - id: key
              text: { uk: "Лише ключ `jsll.planner.v1`, без значення", en: "Only the key `jsll.planner.v1`, without the value" }
              why:
                uk: "Браузер не надсилає ні ключів, ні значень `localStorage`."
                en: "The browser sends neither the keys nor the values of `localStorage`."
          correct: [nothing]
        explanation:
          uk: "`localStorage` — сховище сторінки в цьому браузері. Сервер про нього не знає, поки код сам не надішле дані, наприклад тілом `POST`."
          en: "`localStorage` is the page’s storage in this browser. The server knows nothing about it until the code sends the data itself, for example as the body of a `POST`."
      - id: moved-origin
        from: js-10-03-compare-and-inspect
        prompt:
          uk: "Ти відновив свої записи в експортованому проєкті на `http://127.0.0.1:4300/`. Наступного дня відкриваєш `http://localhost:4300/` і бачиш лише початкові записи. Що сталося?"
          en: "You restored your records in the exported project at `http://127.0.0.1:4300/`. The next day you open `http://localhost:4300/` and see only the starting records. What happened?"
        answer:
          type: choice
          options:
            - id: other-origin
              text: { uk: "Це інший origin з іншим сховищем; записи чекають на `127.0.0.1:4300`", en: "It is another origin with another storage; the records are waiting at `127.0.0.1:4300`" }
            - id: lost
              text: { uk: "Браузер стер `localStorage` за ніч", en: "The browser wiped `localStorage` overnight" }
              why:
                uk: "`localStorage` не має терміну дії. Записи на місці, просто в сховищі іншого origin."
                en: "`localStorage` has no expiry. The records are there, just in the storage of another origin."
            - id: server
              text: { uk: "Сервер `npm start` віддав старі дані", en: "The `npm start` server returned old data" }
              why:
                uk: "Записи живуть у сховищі браузера, а не на сервері. Сервер лише віддає файли проєкту."
                en: "The records live in the browser’s storage, not on the server. The server only hands out the project’s files."
          correct: [other-origin]
        explanation:
          uk: "`localhost` і `127.0.0.1` — різні хости, отже різні origins і різні сховища. Відкрий ту саму адресу, на якій відновлював дані."
          en: "`localhost` and `127.0.0.1` are different hosts, so different origins and different storages. Open the same address where you restored the data."

  - id: two-ports
    kind: local-task
    runtime: local-web
    title:
      uk: "Одна сторінка на двох портах"
      en: "One page on two ports"
    intro:
      uk: |
        Ти запустиш ту саму сторінку на двох портах і перевіриш у DevTools, що cookie в них спільний, а `localStorage` — ні. Працюєш у новій теці `~/js-course/web-lab`, вона знадобиться й у наступних уроках. Знадобляться інтернет для встановлення esbuild (того самого збирача, що й у `money-lab`), Google Chrome і **два вікна терміналу**. Команди однакові в macOS, Linux і Windows PowerShell; перевірено в macOS із Node.js v25.2.1, npm 11.6.2 і esbuild 0.28.2 (Linux і Windows не перевірялися).

        Файл для кроку 2, `page/index.html`:

        ```html
        <!doctype html>
        <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>Web lab</title>
          </head>
          <body>
            <h1>Web lab</h1>
            <p>This page's origin: <output id="origin"></output></p>
            <script>
              document.querySelector("#origin").textContent = location.origin;
            </script>
          </body>
        </html>
        ```
      en: |
        You will run the same page on two ports and check in DevTools that they share the cookie but not `localStorage`. You work in a new folder, `~/js-course/web-lab`, which the next lessons use too. You need internet access to install esbuild (the same bundler as in `money-lab`), Google Chrome and **two terminal windows**. The commands are the same on macOS, Linux and Windows PowerShell; checked on macOS with Node.js v25.2.1, npm 11.6.2 and esbuild 0.28.2 (Linux and Windows were not checked).

        File for step 2, `page/index.html`:

        ```html
        <!doctype html>
        <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>Web lab</title>
          </head>
          <body>
            <h1>Web lab</h1>
            <p>This page's origin: <output id="origin"></output></p>
            <script>
              document.querySelector("#origin").textContent = location.origin;
            </script>
          </body>
        </html>
        ```
    tools:
      - { name: "Node.js", version: "22 or newer", note: { uk: "той самий, що з розділу про інструменти", en: "the same one as in the tooling unit" } }
      - { name: "esbuild", version: "0.28 (installed by this task)", note: { uk: "його вбудований сервер віддає теку з файлами", en: "its built-in server serves a folder of files" } }
      - { name: "Google Chrome", version: "current desktop version", note: { uk: "назви панелей DevTools — з Chrome", en: "the DevTools panel names are Chrome’s" } }
    steps:
      - text:
          uk: "Створи теку практики й встанови в неї esbuild."
          en: "Create the practice folder and install esbuild into it."
        command: "cd ~/js-course\nmkdir web-lab\ncd web-lab\nnpm init -y\nnpm install --save-dev esbuild"
        expect:
          uk: "`Wrote to …/web-lab/package.json`, далі `added 2 packages` і `found 0 vulnerabilities`."
          en: "`Wrote to …/web-lab/package.json`, then `added 2 packages` and `found 0 vulnerabilities`."
      - text:
          uk: "У редакторі створи в `web-lab` теку `page`, а в ній файл `index.html` із текстом «Файл для кроку 2» зі вступу."
          en: "In the editor create the folder `page` inside `web-lab` with the file `index.html` holding the text “File for step 2” from the introduction."
      - text:
          uk: "У **першому** вікні терміналу (у теці `web-lab`) запусти сервер на порту 5173 і не закривай вікно."
          en: "In the **first** terminal window (in the `web-lab` folder) start a server on port 5173 and leave the window open."
        command: "npx esbuild --servedir=page --serve=127.0.0.1:5173"
        expect:
          uk: "` > Local: http://127.0.0.1:5173/`. Сервер працює, доки ти не натиснеш Ctrl + C."
          en: "` > Local: http://127.0.0.1:5173/`. The server runs until you press Ctrl + C."
      - text:
          uk: "У **другому** вікні (теж у `web-lab`) запусти ту саму теку на порту 5174."
          en: "In the **second** window (also in `web-lab`) serve the same folder on port 5174."
        command: "npx esbuild --servedir=page --serve=127.0.0.1:5174"
        expect:
          uk: "` > Local: http://127.0.0.1:5174/`."
          en: "` > Local: http://127.0.0.1:5174/`."
      - text:
          uk: "Відкрий у Chrome `http://127.0.0.1:5173/`, потім DevTools (F12, у macOS — Cmd + Option + I) → панель **Console**, і встав три рядки коду:"
          en: "Open `http://127.0.0.1:5173/` in Chrome, then DevTools (F12, on macOS Cmd + Option + I) → the **Console** panel, and paste three lines of code:"
        command: "localStorage.setItem(\"jsll.demo\", \"saved on 5173\");\ndocument.cookie = \"demo=from-5173; path=/; max-age=600\";\ndocument.cookie"
        expect:
          uk: "Сторінка показує `This page's origin: http://127.0.0.1:5173`. Остання відповідь консолі — `'demo=from-5173'`: скрипт бачить лише назву й значення cookie, без атрибутів. Якщо інші локальні проєкти вже ставили cookie на `127.0.0.1`, вони стоятимуть у тому самому тексті через `; `."
          en: "The page shows `This page's origin: http://127.0.0.1:5173`. The console’s last answer is `'demo=from-5173'`: a script sees only the cookie’s name and value, without its attributes. If other local projects have already set cookies on `127.0.0.1`, they appear in the same text, separated by `; `."
      - text:
          uk: "Відкрий у новій вкладці `http://127.0.0.1:5174/` і в її Console введи:"
          en: "Open `http://127.0.0.1:5174/` in a new tab and in its Console enter:"
        command: "localStorage.getItem(\"jsll.demo\")\ndocument.cookie"
        expect:
          uk: "`null` — ключа з порту 5173 тут немає, і текст із `demo=from-5173` — cookie спільний."
          en: "`null` — the key from port 5173 is not here, and a text with `demo=from-5173` — the cookie is shared."
      - text:
          uk: "Там само відкрий панель **Application**. Ліворуч у розділі **Storage** розгорни **Local storage** і **Cookies** та порівняй записи для `http://127.0.0.1:5173` і `http://127.0.0.1:5174`."
          en: "In the same tab open the **Application** panel. On the left, in the **Storage** section, expand **Local storage** and **Cookies** and compare the entries for `http://127.0.0.1:5173` and `http://127.0.0.1:5174`."
        expect:
          uk: "У Local storage ключ `jsll.demo` є лише в `5173`. У Cookies `demo` видно для обох, у стовпчику Domain — `127.0.0.1`, без порту."
          en: "In Local storage the key `jsll.demo` exists only under `5173`. In Cookies `demo` shows for both, and the Domain column says `127.0.0.1`, without a port."
      - text:
          uk: "Для порівняння відкрий `http://localhost:5173/` і повтори два рядки коду з попереднього кроку. Потім зупини обидва сервери: Ctrl + C у кожному вікні."
          en: "For comparison open `http://localhost:5173/` and repeat the two lines of code from the earlier step. Then stop both servers: Ctrl + C in each window."
        expect:
          uk: "`null` і текст без `demo` (найчастіше `''`): `localhost` — інший хост, тож ні сховища, ні cookie від `127.0.0.1` тут немає. Якщо там є чужі cookie, їх поставили інші локальні проєкти на `localhost` — на будь-якому порту, і це ще один доказ, що порт для cookie не важить."
          en: "`null` and a text without `demo` (most often `''`): `localhost` is another host, so neither the storage nor the cookie from `127.0.0.1` is here. If other cookies show up, other local projects set them on `localhost` — on any port, which is one more proof that the port does not matter for cookies."
    verify:
      - id: storage-separate
        text:
          uk: "На порту 5174 `localStorage.getItem(\"jsll.demo\")` повернув `null`, хоча на 5173 я його зберіг."
          en: "On port 5174 `localStorage.getItem(\"jsll.demo\")` returned `null`, although I saved it on 5173."
      - id: cookie-shared
        text:
          uk: "Cookie `demo`, встановлений на порту 5173, видно й на порту 5174 — у Console та на панелі Application."
          en: "The `demo` cookie set on port 5173 is visible on port 5174 too — in the Console and in the Application panel."
      - id: other-host
        text:
          uk: "На `http://localhost:5173/` не було ні ключа `jsll.demo`, ні cookie `demo`."
          en: "At `http://localhost:5173/` there was neither the `jsll.demo` key nor the `demo` cookie."
    troubleshooting:
      - problem:
          uk: "Chrome не дає вставити код у Console й просить ввести `allow pasting`"
          en: "Chrome does not let you paste into the Console and asks you to type `allow pasting`"
        fix:
          uk: "Це захист від шахраїв, які просять людей вставити чужий код. Код цього уроку ти прочитав і розумієш, тож введи `allow pasting`, натисни Enter і встав знову. Чужий код у консоль не встав ніколи."
          en: "This protects people from scammers who ask them to paste someone else’s code. You have read and understood this lesson’s code, so type `allow pasting`, press Enter and paste again. Never paste code you have not read."
      - problem:
          uk: "`✘ [ERROR] listen tcp4 127.0.0.1:5173: bind: address already in use`"
          en: "`✘ [ERROR] listen tcp4 127.0.0.1:5173: bind: address already in use`"
        fix:
          uk: "Цей порт уже зайнятий — часто тобою ж в іншому вікні. Знайди й зупини той сервер (Ctrl + C) або візьми інші два порти, наприклад 5183 і 5184, і заміни їх у всіх наступних кроках."
          en: "That port is already taken — often by yourself in another window. Find and stop that server (Ctrl + C), or take two other ports, for example 5183 and 5184, and use them in all the following steps."
      - problem:
          uk: "`[serve] stopped automatically because stdin was closed`"
          en: "`[serve] stopped automatically because stdin was closed`"
        fix:
          uk: "esbuild працює, лише доки відкрите вікно терміналу, з якого його запущено. Запускай його прямо у вікні терміналу, а не через інші програми чи з `&` наприкінці."
          en: "esbuild runs only while the terminal window it was started from stays open. Start it directly in a terminal window, not through other programs or with `&` at the end."
      - problem:
          uk: "`document.cookie` на порту 5174 порожній"
          en: "`document.cookie` on port 5174 is empty"
        fix:
          uk: "Перевір адресу: обидві вкладки мають бути на `127.0.0.1`, а не одна на `localhost`. І перевір, що з моменту встановлення cookie не минуло 10 хвилин (`max-age=600`)."
          en: "Check the address: both tabs must be on `127.0.0.1`, not one on `localhost`. And check that less than 10 minutes have passed since the cookie was set (`max-age=600`)."
    recovery:
      uk: "Нічого з цього не чіпає твоїх проєктів: сховище й cookie належать адресам `127.0.0.1:5173` і `:5174`. Очистити їх можна на панелі Application → **Storage** → кнопка **Clear site data**."
      en: "None of this touches your projects: the storage and the cookie belong to the addresses `127.0.0.1:5173` and `:5174`. You can clear them in the Application panel → **Storage** → the **Clear site data** button."

  - id: same-origin
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: same-origin
    entry: index.js
    editable: [index.js]
    title:
      uk: "sameOrigin і таблиця сховищ"
      en: "sameOrigin and a table of storages"
    instructions:
      uk: |
        Дві частини в одному файлі.

        1. Допиши `sameOrigin(a, b)`: `true`, коли дві адреси мають один origin, інакше `false`. Адреса, що не є правильним URL, або адреса з origin `"null"` (як у `data:` чи `about:blank`) не збігається ні з чим — браузер вважає кожну таку сторінку окремою.
        2. Заповни `storageFacts`: для кожного виду сховища — до чого воно прив’язане (`scope`: `"origin"`, `"origin and tab"` чи `"host and path"`), чи браузер сам надсилає його із запитами (`sentWithRequests`) і чи можуть його прочитати скрипти сторінки (`readableByScripts`). `cookie` — звичайний cookie, `httpOnlyCookie` — з атрибутом `HttpOnly`.
      en: |
        Two parts in one file.

        1. Complete `sameOrigin(a, b)`: `true` when the two addresses share an origin, otherwise `false`. An address that is not a valid URL, or one whose origin is `"null"` (as with `data:` or `about:blank`), matches nothing — the browser treats each such page as separate.
        2. Fill in `storageFacts`: for each kind of storage — what it is tied to (`scope`: `"origin"`, `"origin and tab"` or `"host and path"`), whether the browser sends it with requests by itself (`sentWithRequests`) and whether the page’s scripts can read it (`readableByScripts`). `cookie` is an ordinary cookie, `httpOnlyCookie` one with the `HttpOnly` attribute.
    testTitles:
      "the same scheme, host and port share an origin, whatever the path":
        uk: "Та сама схема, хост і порт — один origin, хоч би який шлях"
        en: "The same scheme, host and port share an origin, whatever the path"
      "another port, scheme or host is another origin":
        uk: "Інший порт, схема чи хост — інший origin"
        en: "Another port, scheme or host is another origin"
      "a default port and letter case do not make a difference":
        uk: "Типовий порт і великі літери нічого не змінюють"
        en: "A default port and letter case do not make a difference"
      "an invalid address or a null origin never matches":
        uk: "Неправильна адреса чи origin `\"null\"` не збігається ні з чим"
        en: "An invalid address or a `\"null\"` origin never matches"
      "storageFacts describes local and session storage":
        uk: "`storageFacts` описує `localStorage` і `sessionStorage`"
        en: "`storageFacts` describes `localStorage` and `sessionStorage`"
      "storageFacts describes both kinds of cookies":
        uk: "`storageFacts` описує обидва види cookie"
        en: "`storageFacts` describes both kinds of cookies"
    hints:
      nudge:
        uk: "Не розбирай адресу вручну: `http://localhost` і `http://localhost:80` — той самий origin, хоча текст різний. Хто вже вміє обчислювати origin? А що робить `new URL`, коли текст — не адреса?"
        en: "Do not take the address apart by hand: `http://localhost` and `http://localhost:80` are the same origin although the text differs. What already knows how to work out an origin? And what does `new URL` do when the text is not an address?"
      explanation:
        uk: "`new URL(text)` кидає `TypeError`, якщо текст — не адреса, тож створюй обидва об’єкти всередині `try`, а в `catch` повертай `false`. Властивість `origin` уже нормалізована: порт `80` для `http` зникає, літери малі. Для `data:` вона дорівнює тексту `\"null\"` — такий випадок перевір окремо, бо два однакові тексти `\"null\"` не означають одну сторінку. Для таблиці перечитай пояснення про cookie: що з них їде із запитами, а що бачить `document.cookie`."
        en: "`new URL(text)` throws a `TypeError` if the text is not an address, so create both objects inside `try` and return `false` in `catch`. The `origin` property is already normalized: port `80` for `http` disappears, letters are lower case. For `data:` it is the text `\"null\"` — check that case separately, because two equal texts `\"null\"` do not mean one page. For the table, reread the explanation about cookies: what travels with requests and what `document.cookie` sees."
    solutionNote:
      uk: "`URL` сам обчислює origin: прибирає типовий порт і зводить літери до малих, тож порівняння двох `origin` надійніше за порівняння тексту. Неправильна адреса й origin `\"null\"` дають `false`. У таблиці різниця головна: вебсховище нікуди не їде й прив’язане до origin, а cookie прив’язаний до хоста й шляху, браузер сам додає його до запитів, і лише `HttpOnly` ховає його від скриптів."
      en: "`URL` works out the origin itself: it drops the default port and lowers the letters, so comparing two `origin` values is more reliable than comparing text. An invalid address and a `\"null\"` origin give `false`. In the table the main difference is this: web storage goes nowhere and is tied to the origin, while a cookie is tied to the host and path, the browser adds it to requests itself, and only `HttpOnly` hides it from scripts."
    feedback:
      - when: { test: "another port, scheme or host is another origin" }
        message:
          uk: "Ця перевірка очікує `false` для портів 5173 і 5174, для `http` і `https`, для `localhost` і `app.localhost` та для `localhost` і `127.0.0.1`. Якщо бачиш `true`, порівнюється не весь origin."
          en: "This check expects `false` for ports 5173 and 5174, for `http` and `https`, for `localhost` and `app.localhost`, and for `localhost` and `127.0.0.1`. If you see `true`, not the whole origin is compared."
      - when: { test: "a default port and letter case do not make a difference" }
        message:
          uk: "Ця перевірка очікує `true` для `http://localhost/` і `http://localhost:80/wishes` та для адрес, що різняться лише великими літерами в схемі й хості. Порівняння тексту адреси тут не підходить."
          en: "This check expects `true` for `http://localhost/` and `http://localhost:80/wishes`, and for addresses that differ only in capital letters in the scheme and host. Comparing the address text does not work here."
      - when: { test: "an invalid address or a null origin never matches" }
        message:
          uk: "Ця перевірка очікує `false` для двох однакових текстів, що не є адресами, і для двох однакових адрес `data:`, без кинутої помилки."
          en: "This check expects `false` for two identical texts that are not addresses and for two identical `data:` addresses, without a thrown error."
      - when: { test: "storageFacts describes local and session storage" }
        message:
          uk: "Ця перевірка очікує для обох вебсховищ `sentWithRequests: false` і `readableByScripts: true`, а `scope` — `\"origin\"` для `localStorage` і `\"origin and tab\"` для `sessionStorage`."
          en: "This check expects `sentWithRequests: false` and `readableByScripts: true` for both web storages, and `scope` to be `\"origin\"` for `localStorage` and `\"origin and tab\"` for `sessionStorage`."
      - when: { test: "storageFacts describes both kinds of cookies" }
        message:
          uk: "Ця перевірка очікує для обох cookie `scope: \"host and path\"` і `sentWithRequests: true`, а `readableByScripts` — `true` для звичайного й `false` для `HttpOnly`."
          en: "This check expects `scope: \"host and path\"` and `sentWithRequests: true` for both cookies, and `readableByScripts` to be `true` for the ordinary one and `false` for the `HttpOnly` one."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` означає, що значення має не той тип, на який розраховує код. `Invalid URL` — `new URL` отримав текст, що не є адресою: такий виклик має стояти всередині `try`. Якщо всі перевірки впали разом, програма зупинилася ще під час завантаження — спершу виправ першу помилку в консолі."
          en: "A `TypeError` means a value has a different type than the code expects. `Invalid URL` — `new URL` received text that is not an address: such a call belongs inside `try`. If every check fails at once, the program stopped while loading — first fix the first error in the console."

  - id: to-project
    kind: transfer
    capstoneStep: JS-16
    body:
      uk: "Записи проєкту живуть у `localStorage` одного origin. У кроці проєкту ти віддаватимеш фікстури з локального сервера — стеж, щоб сторінка відкривалася на тій самій адресі й порту, інакше застосунок стартує з порожнім сховищем."
      en: "Your project’s records live in the `localStorage` of one origin. In the project step you will serve fixtures from a local server — make sure the page opens at the same address and port, or the app starts with empty storage."
