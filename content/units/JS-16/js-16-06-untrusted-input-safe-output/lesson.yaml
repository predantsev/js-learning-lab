id: js-16-06-untrusted-input-safe-output
unit: JS-16
title:
  uk: "Недовірене введення та безпечний вивід"
  en: "Untrusted input and safe output"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Простежити шматок недовіреного тексту (поле форми, параметр адреси, збережений запис, завантажена фікстура) від джерела до кожного місця показу й позначити кожну межу довіри."
    en: "Trace a piece of untrusted text (form field, URL parameter, stored record, fetched fixture) from its source to every place it is displayed, and mark each trust boundary."
  - uk: "Назвати контекст виводу (текст, атрибут, URL, HTML) кожного показу й обрати для нього безпечний API."
    en: "Name the output context (text, attribute, URL, HTML) of each display and choose the safe API for it."
prerequisites: [js-16-05-devtools-network-failures, js-06-09-text-vs-html]
subskills:
  - { family: W-05, skill: "untrusted input and safe output", depth: intro }
glossary: [untrusted-input, trust-boundary, output-context]
selfCheck: [predict-three-sinks, record-card]

blocks:
  - id: sources
    kind: explanation
    title:
      uk: "Чий це текст?"
      en: "Whose text is it?"
    body:
      uk: |
        Код сторінки ти написав сам. А текст, який вона показує, часто ні. [[untrusted-input|Недовірене введення]] — усе, що прийшло ззовні твого коду:

        - **поле форми** — `input.value`, будь-що, що людина набрала чи вставила;
        - **адреса сторінки** — `location.search`, її може надіслати тобі будь-хто;
        - **сховище** — `localStorage`: туди міг потрапити текст із форми минулого тижня, з імпорту чи зі старої версії;
        - **завантажені дані** — JSON із сервера чи файла.

        Місце, де дані перетинають цю лінію, — [[trust-boundary|межа довіри]]. Перевірка на кшталт `validateExpense` на межі каже, чи запис має правильну форму (є назва, сума більша за нуль), але не робить текст «безпечним»: `<b>` — цілком допустима назва.

        Тому правило просте: недовірений текст лишається **текстом** аж до показу, а безпеку вирішує місце показу.
      en: |
        You wrote the page’s code yourself. The text it shows, often not. [[untrusted-input]] is everything that came from outside your code:

        - a **form field** — `input.value`, whatever a person typed or pasted;
        - the **page address** — `location.search`, which anyone can send you;
        - **storage** — `localStorage`: text from last week’s form, an import or an old version may have landed there;
        - **loaded data** — JSON from a server or a file.

        The place where data crosses that line is a [[trust-boundary]]. A check such as `validateExpense` at the boundary says whether a record has the right shape (a label exists, the amount is above zero), but it does not make the text “safe”: `<b>` is a perfectly valid label.

        So the rule is simple: untrusted text stays **text** until it is displayed, and the place of display decides about safety.

  - id: contexts
    kind: explanation
    title:
      uk: "Контекст виводу визначає API"
      en: "The output context decides the API"
    body:
      uk: |
        Те саме значення можна показати в різних [[output-context|контекстах виводу]], і для кожного є свій безпечний спосіб:

        | Контекст | Приклад | Безпечно |
        |---|---|---|
        | текст | заголовок картки | `textContent`, `createTextNode` |
        | атрибут | підказка `title`, `alt`, `value` | `setAttribute("title", value)` або властивість `el.title = value` |
        | URL | `href` посилання | перевірити схему через `URL` — наступний урок |
        | HTML | — | недовірений текст сюди не потрапляє |

        Небезпечно змішувати контексти в одному рядку: шаблон `` `<h3 title="${label}">${label}</h3>` `` для `innerHTML` кладе значення водночас в атрибут і в HTML. Лапка в назві закриє атрибут, а `<b>` стане елементом. `setAttribute` і `textContent` нічого не розбирають — вони кладуть значення як є.
      en: |
        The same value can be shown in different [[output-context|output contexts]], and each has its own safe way:

        | Context | Example | Safe |
        |---|---|---|
        | text | a card heading | `textContent`, `createTextNode` |
        | attribute | a `title` tooltip, `alt`, `value` | `setAttribute("title", value)` or the property `el.title = value` |
        | URL | a link’s `href` | check the scheme with `URL` — next lesson |
        | HTML | — | untrusted text does not go here |

        Mixing contexts in one string is what is dangerous: the template `` `<h3 title="${label}">${label}</h3>` `` for `innerHTML` puts the value into an attribute and into HTML at once. A quote in the label closes the attribute, and `<b>` becomes an element. `setAttribute` and `textContent` parse nothing — they put the value in as it is.

  - id: predict-three-sinks
    kind: prediction
    strings:
      word: { uk: "Кава", en: "Coffee" }
      brand: { uk: "Лісова", en: "Forest" }
    prompt:
      uk: "Ту саму назву витрати показують трьома способами. Що надрукує код?"
      en: "The same expense label is shown in three ways. What does the code print?"
    code: |
      const label = '%%word%% "%%brand%%" <b>x2</b>';
      const a = document.createElement("h3");
      a.textContent = label;
      const b = document.createElement("h3");
      b.setAttribute("title", label);
      const c = document.createElement("div");
      c.innerHTML = `<h3 title="${label}">${label}</h3>`;
      console.log(a.children.length, a.textContent === label);
      console.log(b.getAttribute("title") === label);
      console.log(JSON.stringify(c.querySelector("h3").getAttribute("title")), c.querySelectorAll("b").length);
    verify:
      logs: ["0 true", "true", "\"%%word%% \" 1"]
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "`0 true`, `true`, `\"Кава \" 1`"
            en: "`0 true`, `true`, `\"Coffee \" 1`"
        - id: all-safe
          text:
            uk: "`0 true`, `true`, а в шаблоні підказка — уся назва і `0`"
            en: "`0 true`, `true`, and in the template the tooltip is the whole label and `0`"
          why:
            uk: "У шаблоні назва стає частиною HTML-тексту: лапка перед «Лісова» закриває атрибут `title`, а `<b>` розбирається як елемент. Підказка обривається на «Кава »."
            en: "In the template the label becomes part of the HTML text: the quote before “Forest” closes the `title` attribute, and `<b>` is parsed as an element. The tooltip stops at “Coffee ”."
        - id: attr-parsed
          text:
            uk: "`0 true`, `false`, `\"Кава \" 1` — `setAttribute` теж ламається на лапках"
            en: "`0 true`, `false`, `\"Coffee \" 1` — `setAttribute` breaks on quotes too"
          why:
            uk: "`setAttribute` нічого не розбирає: значення атрибута — рівно той текст, що ти передав, з лапками й `<b>` усередині."
            en: "`setAttribute` parses nothing: the attribute’s value is exactly the text you passed, with the quotes and the `<b>` inside."
        - id: text-parsed
          text:
            uk: "`1 false` у першому рядку — `textContent` робить `<b>` елементом"
            en: "`1 false` on the first line — `textContent` turns `<b>` into an element"
          why:
            uk: "`textContent` кладе символи як є: `<b>` — лише знаки, нових елементів немає."
            en: "`textContent` puts the characters in as they are: `<b>` is just characters, no new elements."
      correct: [right]
    explanation:
      uk: "`textContent` і `setAttribute` зберігають назву повністю, лапки й кутові дужки разом. Шаблон для `innerHTML` віддає назву розбирачеві HTML: лапка закриває атрибут, `<b>` стає елементом, а решта назви перетворюється на дивні атрибути. Сама назва при цьому цілком нормальна — проблема в місці показу."
      en: "`textContent` and `setAttribute` keep the label whole, quotes and angle brackets included. The template for `innerHTML` hands the label to the HTML parser: the quote closes the attribute, `<b>` becomes an element, and the rest of the label turns into odd attributes. The label itself is perfectly normal — the problem is the place of display."

  - id: source-to-sink
    kind: visual
    visual: diagram
    title:
      uk: "Від джерела до місця показу"
      en: "From source to place of display"
    textEquivalent:
      uk: "Ліворуч чотири джерела недовіреного тексту: поле форми, параметр адреси, localStorage і завантажений JSON. Праворуч три місця показу: textContent, setAttribute(\"title\") і innerHTML. Усі чотири джерела лежать за межею довіри: код сторінки не контролює, що в них. Простежимо одну назву із завантаженого JSON: <img src=x onerror=…> — тег зображення з атрибутом-обробником помилки. Через textContent вона стає одним текстовим вузлом: людина бачить кутові дужки, жодного елемента немає. Через setAttribute(\"title\") вона стає значенням атрибута — теж лише текстом у підказці. Через innerHTML розбирач HTML перетворює її на справжній елемент img з атрибутом onerror; браузер намагається завантажити зображення x, і обробник помилки отримує шанс виконатися — як саме це стає атакою, показує наступний урок. Тож безпечність вирішує місце показу, а не джерело: для тексту — textContent, для атрибута — setAttribute, а в innerHTML недовірений текст не потрапляє."
      en: "On the left are four sources of untrusted text: a form field, an address parameter, localStorage and fetched JSON. On the right are three places of display: textContent, setAttribute(\"title\") and innerHTML. All four sources lie beyond the trust boundary: the page’s code does not control what is in them. Follow one name from the fetched JSON: <img src=x onerror=…> — an image tag with an error-handler attribute. Through textContent it becomes one text node: the person sees the angle brackets, there is no element. Through setAttribute(\"title\") it becomes an attribute value — again just text in a tooltip. Through innerHTML the HTML parser turns it into a real img element with an onerror attribute; the browser tries to load the image x, and the error handler gets a chance to run — how exactly that becomes an attack is the next lesson. So safety is decided by the place of display, not by the source: textContent for text, setAttribute for an attribute, and untrusted text never goes into innerHTML."
    spec:
      layout: grid
      groups:
        - { id: outside, label: { uk: "За межею довіри", en: "Beyond the trust boundary" } }
        - { id: page, label: { uk: "Місця показу", en: "Places of display" } }
      nodes:
        - { id: form, group: outside, label: { uk: "форма", en: "form" }, col: 0, row: 0 }
        - { id: query, group: outside, label: "location.search", col: 1, row: 0 }
        - { id: storage, group: outside, label: "localStorage", col: 0, row: 1 }
        - { id: json, group: outside, label: "JSON", col: 1, row: 1 }
        - { id: text, group: page, label: "textContent", shape: round, col: 0, row: 2 }
        - { id: attr, group: page, label: "setAttribute", shape: round, col: 1, row: 2 }
        - { id: html, group: page, label: "innerHTML", shape: round, col: 1, row: 3 }
      edges:
        - { id: json-text, from: json, to: text }
        - { id: json-attr, from: json, to: attr }
        - { id: json-html, from: json, to: html, kind: dashed }
      steps:
        - caption:
            uk: "Чотири джерела, з яких сторінка бере текст, який не писала сама. Усі вони — за межею довіри."
            en: "Four sources from which the page takes text it did not write itself. All of them are beyond the trust boundary."
          highlight: [form, query, storage, json]
        - caption:
            uk: "У завантаженому JSON є назва `<img src=x onerror=…>` — тег зображення з обробником помилки. Для перевірки форми запису це просто текст потрібної довжини."
            en: "The fetched JSON holds the name `<img src=x onerror=…>` — an image tag with an error handler. For a check of the record’s shape it is just text of a valid length."
          highlight: [json]
        - caption:
            uk: "Через `textContent` назва стає одним текстовим вузлом: людина бачить кутові дужки, жодного елемента."
            en: "Through `textContent` the name becomes one text node: the person sees the angle brackets, no element."
          highlight: [json, json-text, text]
          annotate:
            - { id: text, text: { uk: "лише текст", en: "text only" } }
        - caption:
            uk: "Через `setAttribute(\"title\")` назва стає значенням атрибута — теж текстом, у підказці."
            en: "Through `setAttribute(\"title\")` the name becomes an attribute value — again text, in a tooltip."
          highlight: [json, json-attr, attr]
          annotate:
            - { id: attr, text: { uk: "значення атрибута", en: "attribute value" } }
        - caption:
            uk: "Через `innerHTML` розбирач HTML робить із назви **елемент** `img` з атрибутом `onerror`. Браузер пробує завантажити зображення — і обробник отримує шанс виконатися. Що з цього виходить, покаже наступний урок."
            en: "Through `innerHTML` the HTML parser turns the name into an `img` **element** with an `onerror` attribute. The browser tries to load the image — and the handler gets a chance to run. What comes of that is the next lesson."
          highlight: [json, json-html, html]
          annotate:
            - { id: html, text: { uk: "стає розміткою", en: "becomes markup" } }
        - caption:
            uk: "Безпечність вирішує місце показу, а не джерело: текст — `textContent`, атрибут — `setAttribute`, а в `innerHTML` недовірений текст не потрапляє."
            en: "Safety is decided by the place of display, not the source: text goes through `textContent`, an attribute through `setAttribute`, and untrusted text never goes into `innerHTML`."
          highlight: [text, attr]
          dim: [html]

  - id: records-page
    kind: example
    runtime: browser-js
    dir: records-page
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Список бажань", en: "Wishlist" }
      resultsFor: { uk: "Результати для:", en: "Results for:" }
      lampQuery: { uk: "лампа", en: "lamp" }
      note: { uk: "Купити до свят", en: "Buy before the holidays" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      tech: { uk: "Техніка", en: "Tech" }
      home: { uk: "Дім", en: "Home" }
      garden: { uk: "сад", en: "garden" }
    title:
      uk: "Сторінка з чотирма джерелами"
      en: "A page with four sources"
    body:
      uk: |
        Сторінка бере текст з адреси, з `localStorage` і з JSON-файла й показує його через `innerHTML`. У даних — звичайні теги на кшталт `<b>` і `<u>`, тож нічого не виконується, але розмітка з даних уже стала елементами сторінки. Консоль перелічує елементи, які з’явилися **з даних**.
      en: |
        The page takes text from the address, from `localStorage` and from a JSON file and shows it through `innerHTML`. The data holds ordinary tags such as `<b>` and `<u>`, so nothing runs, but markup from the data has already become elements of the page. The console lists the elements that appeared **from the data**.
    tryIt:
      uk: |
        1. Подивись на **Сторінку**: «Настільна лампа» жирна, а в категорії — курсив. Цього не вирішував жоден рядок коду: це зробили дані.
        2. У циклі заміни рядок коду з `item.innerHTML` на три: `item.textContent = wish.name + " ";`, потім створи `span` через `document.createElement("span")`, дай йому `className = "category"`, `textContent = wish.category` і додай через `item.append(span)`. Запусти: у списку тепер видно `<b>` як знаки, а консоль перелічує лише твої елементи `SPAN`.
        3. У рядку з `#search-echo` заміни `innerHTML` на `textContent`: другий лічильник стане `0`.
      en: |
        1. Look at the **Page**: “Desk lamp” is bold, and the category has italics. No line of code decided that: the data did.
        2. In the loop replace the line of code with `item.innerHTML` with three: `item.textContent = wish.name + " ";`, then create a `span` with `document.createElement("span")`, give it `className = "category"` and `textContent = wish.category`, and add it with `item.append(span)`. Run: the list now shows `<b>` as characters, and the console lists only your `SPAN` elements.
        3. In the line with `#search-echo` replace `innerHTML` with `textContent`: the second counter becomes `0`.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: textContent і innerHTML"
      en: "Recall: textContent and innerHTML"
    items:
      - id: replace-children
        from: js-06-09-text-vs-html
        prompt:
          uk: "Завантажена назва звички — `<i>Читати</i> 20 хв`. Як показати її в елементі списку так, щоб людина побачила рівно ці знаки?"
          en: "A loaded habit name is `<i>Read</i> 20 min`. How do you show it in a list item so that the person sees exactly those characters?"
        answer:
          type: choice
          options:
            - id: text
              text: { uk: "`item.textContent = habit.name`", en: "`item.textContent = habit.name`" }
            - id: html
              text: { uk: "`item.innerHTML = habit.name`", en: "`item.innerHTML = habit.name`" }
              why:
                uk: "`innerHTML` розбере `<i>` як елемент: людина побачить курсив, а не знаки. Для чужого тексту це небезпечне місце."
                en: "`innerHTML` parses `<i>` as an element: the person sees italics, not the characters. For text from elsewhere it is an unsafe sink."
            - id: append-html
              text: { uk: "`item.innerHTML += habit.name`", en: "`item.innerHTML += habit.name`" }
              why:
                uk: "`+=` теж віддає рядок розбирачеві HTML — ба більше, перебудовує все, що вже було в елементі."
                en: "`+=` also hands the string to the HTML parser — and on top of that rebuilds everything already in the element."
          correct: [text]
        explanation:
          uk: "`textContent` кладе символи як є, тож людина бачить і кутові дужки. `innerHTML` — розбирач HTML: усе, що схоже на тег, стає елементом."
          en: "`textContent` puts the characters in as they are, so the person sees the angle brackets too. `innerHTML` is an HTML parser: anything that looks like a tag becomes an element."

  - id: record-card
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: record-card
    entry: index.html
    editable: [index.js]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Витрати", en: "Expenses" }
      resultsFor: { uk: "Результати для:", en: "Results for:" }
      searchTerm: { uk: "<i>кава</i>", en: "<i>coffee</i>" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      pageMarkup: { uk: "<b>Лампочки</b> і <u>батарейки</u>", en: "<b>Light bulbs</b> and <u>batteries</u>" }
      markupLabel: { uk: "Пиріг \"Наполеон\" <i>2 шт.</i>", en: "Cake \"Napoleon\" <i>2 pcs</i>" }
      food: { uk: "Їжа", en: "Food" }
      transport: { uk: "Транспорт", en: "Transport" }
      home: { uk: "Дім", en: "Home" }
      fun: { uk: "Розваги", en: "Fun" }
    title:
      uk: "Картка витрати без innerHTML"
      en: "An expense card without innerHTML"
    instructions:
      uk: |
        Сторінка витрат показує недовірений текст через `innerHTML`. Перепиши:

        1. `renderRecordCard(expense)` — збирає картку лише через `createElement`, `textContent` і `setAttribute` (або властивості). Будова та сама: `article.expense-card` з `h3` (назва, а в атрибуті `title` — та сама повна назва), `p.amount` і `p.category`.
        2. `showSearch(term)` — показує «Результати для: …» як текст.
        3. Заповни таблицю `OUTPUTS`: для кожного недовіреного значення — його джерело, контекст виводу й API, яким ти його тепер показуєш.

        Перевірки підставлять назву з лапками й тегами.
      en: |
        The expense page shows untrusted text through `innerHTML`. Rewrite:

        1. `renderRecordCard(expense)` — builds the card with `createElement`, `textContent` and `setAttribute` (or properties) only. The structure stays the same: `article.expense-card` with an `h3` (the label, and the same full label in the `title` attribute), `p.amount` and `p.category`.
        2. `showSearch(term)` — shows “Results for: …” as text.
        3. Fill in the `OUTPUTS` table: for each untrusted value, its source, its output context and the API you now show it with.

        The checks put in a label with quotes and tags.
    testTitles:
      "an ordinary expense still renders its heading, amount and category":
        uk: "Звичайна витрата й далі показує назву, суму й категорію"
        en: "An ordinary expense still renders its heading, amount and category"
      "a label with markup stays text in the heading":
        uk: "Назва з розміткою лишається текстом у заголовку"
        en: "A label with markup stays text in the heading"
      "the tooltip holds the whole label, quotes included":
        uk: "Підказка містить усю назву разом із лапками"
        en: "The tooltip holds the whole label, quotes included"
      "the search term is shown as text":
        uk: "Пошуковий запит показано як текст"
        en: "The search term is shown as text"
      "the page shows every fetched label as text":
        uk: "Сторінка показує кожну завантажену назву як текст"
        en: "The page shows every fetched label as text"
      "OUTPUTS names the source, the context and a safe API of each value":
        uk: "`OUTPUTS` називає джерело, контекст і безпечний API кожного значення"
        en: "`OUTPUTS` names the source, the context and a safe API of each value"
    hints:
      nudge:
        uk: "Шаблонний рядок для `innerHTML` тут змішує три контексти. Зроби кожен шматок картки окремим елементом і клади значення у властивість, яка нічого не розбирає."
        en: "The template string for `innerHTML` mixes three contexts here. Make each piece of the card a separate element and put values into a property that parses nothing."
      explanation:
        uk: "Елемент створює `document.createElement(\"p\")`; текст кладе `textContent`; атрибут ставить `setAttribute(\"alt\", value)` або властивість (`image.alt = value`); дітей додає `parent.append(a, b, c)`. Клас задає `className`. Для рядка пошуку досить замінити спосіб показу. У таблиці назва — це текст заголовка і значення атрибута, а пошук — текст; обидві назви приходять із JSON-файла, пошук — з адреси."
        en: "`document.createElement(\"p\")` creates an element; `textContent` puts text in; `setAttribute(\"alt\", value)` or a property (`image.alt = value`) sets an attribute; `parent.append(a, b, c)` adds children. `className` sets the class. For the search line it is enough to change the way of display. In the table the label is heading text and an attribute value, while the search term is text; both labels come from the JSON file, the search term from the address."
    solutionNote:
      uk: "Картка зібрана з окремих елементів, а кожне значення покладено в місце, яке не розбирає HTML: `textContent` для тексту й `setAttribute` для підказки. Тому лапки й теги в назві лишаються знаками, а сторінка має рівно ту будову, яку написав ти, а не дані."
      en: "The card is built from separate elements, and every value goes into a place that does not parse HTML: `textContent` for text and `setAttribute` for the tooltip. So the quotes and tags in a label stay characters, and the page has exactly the structure you wrote, not the data."
    feedback:
      - when: { test: "an ordinary expense still renders its heading, amount and category" }
        message:
          uk: "Ця перевірка очікує, що `renderRecordCard` повертає елемент з `h3` (назва й така сама підказка `title`), `.amount` з `520.00 UAH` і `.category` з назвою категорії."
          en: "This check expects `renderRecordCard` to return an element with an `h3` (the label and the same `title` tooltip), `.amount` with `520.00 UAH` and `.category` with the category name."
      - when: { test: "a label with markup stays text in the heading" }
        message:
          uk: "Ця перевірка очікує, що текст `h3` дорівнює назві з тегами, а елементів усередині `h3` немає. Якщо всередині `h3` є елемент, назва пройшла через розбирач HTML."
          en: "This check expects the `h3` text to equal the label with its tags, and no elements inside the `h3`. If there is an element inside the `h3`, the label went through the HTML parser."
      - when: { test: "the tooltip holds the whole label, quotes included" }
        message:
          uk: "Ця перевірка очікує, що атрибут `title` дорівнює всій назві разом із лапками, у `h3` немає інших атрибутів, а з назви не з’явилося жодного елемента. Значення в шаблоні HTML обривається на першій лапці."
          en: "This check expects the `title` attribute to equal the whole label with its quotes, the `h3` to have no other attributes, and no element to come out of the label. A value in an HTML template is cut off at the first quote."
      - when: { test: "the search term is shown as text" }
        message:
          uk: "Ця перевірка викликає `showSearch` з назвою, що містить теги, і очікує в `#search` текст «Результати для: …» без жодного елемента всередині."
          en: "This check calls `showSearch` with a label that contains tags and expects `#search` to hold the text “Results for: …” with no element inside."
      - when: { test: "the page shows every fetched label as text" }
        message:
          uk: "Ця перевірка читає заголовки карток на сторінці після завантаження й очікує три назви з файла як текст, без елементів усередині."
          en: "This check reads the card headings on the page after loading and expects the three labels from the file as text, with no elements inside."
      - when: { test: "OUTPUTS names the source, the context and a safe API of each value" }
        message:
          uk: "Ця перевірка очікує три рядки з джерелами `fetched JSON`, `fetched JSON`, `URL query`, контекстами `text`, `attribute`, `text` і непорожнім `api`, що не є HTML-приймачем (`innerHTML`, `outerHTML`, `insertAdjacentHTML`, `document.write`)."
          en: "This check expects three rows with the sources `fetched JSON`, `fetched JSON`, `URL query`, the contexts `text`, `attribute`, `text`, and a non-empty `api` that is not an HTML sink (`innerHTML`, `outerHTML`, `insertAdjacentHTML`, `document.write`)."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` означає, що значення має не той тип, на який розраховує код. `… is not a function` — програма зупинилася ще під час завантаження; `Cannot read properties of null` — `querySelector` не знайшов елемента."
          en: "A `TypeError` means a value has a different type than the code expects. `… is not a function` — the program stopped while loading; `Cannot read properties of null` — `querySelector` found no element."

  - id: to-project
    kind: transfer
    capstoneStep: JS-16
    body:
      uk: "У кроці проєкту кожна назва з фікстури чи `localStorage` потрапляє на сторінку лише через `textContent` чи `setAttribute`. Пройди своїми функціями показу в `ui/page.js` і знайди кожне `innerHTML`, куди потрапляють дані."
      en: "In the project step every name from a fixture or `localStorage` reaches the page only through `textContent` or `setAttribute`. Walk through your display functions in `ui/page.js` and find every `innerHTML` that data reaches."
