id: js-16-10-independent-safe-client
unit: JS-16
title:
  uk: "Самостійно: безпечні запити та безпечний вивід"
  en: "Independent: safe requests and safe output"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Без підказок поєднати все з цього розділу на новому матеріалі — сторінці міських подій: закодовані адреси пошуку, чесна перевірка відповіді, недовірений текст лише через безпечні sinks, посилання лише `http`/`https`, у сховищі — тільки вподобання. А потім письмово пояснити, від чого саме захищено сторінку."
  en: "Combine everything from this unit without hints on new material — a page of city events: encoded search addresses, an honest check of the response, untrusted text only through safe sinks, links only `http`/`https`, and nothing but a preference in storage. Then explain in writing what exactly the page is protected against."
objectives:
  - uk: "Без підказок реалізувати клієнт для незнайомого набору фікстур, що будує закодовані адреси, тримає сховище в межах свого origin і показує недовірений текст лише через безпечні sinks."
    en: "Implement, without hints, a client for an unseen fixture set that builds encoded URLs, keeps storage within its origin and renders untrusted text through safe sinks only."
  - uk: "Написати коротку нотатку про загрози: недовірені джерела, використані sinks, що де зберігається і чому в клієнтському коді немає жодного секрету."
    en: "Write a short threat note naming the untrusted inputs, the sinks used, what is stored where and why no secret ships to the client."
prerequisites: [js-16-09-debug-http-fetch-cors]
subskills:
  - { family: W-04, skill: "URL/query/encoding", depth: assess }
  - { family: W-04, skill: "cookies/storage/origins", depth: assess }
  - { family: W-05, skill: "untrusted input and safe output", depth: assess }
  - { family: W-05, skill: "XSS threat/safe sinks", depth: assess }
  - { family: W-05, skill: "no secret in client bundle", depth: assess }
  - { family: W-05, skill: "storage/privacy", depth: assess }
glossary: []
selfCheck: [events-client, threat-note]

blocks:
  - id: the-task
    kind: explanation
    title:
      uk: "Що перевіряє цей урок"
      en: "What this lesson checks"
    body:
      uk: |
        Тут ти працюєш **без підказок**: лише умова, редактор і перевірки. Завдань два: спершу клієнт сторінки подій, потім нотатка про загрози до нього.

        Перевірки підставляють власні відповіді сервера — **приховані фікстури**, яких немає у файлах: назви з розміткою, посилання `javascript:` і `data:` у різних написаннях, кириличний пошук з `&` і пробілами, сторінку HTML зі статусом `200` замість JSON, `404` і збій мережі.

        Якщо перевірка не проходить, прочитай її назву й повідомлення: вони кажуть, *що* очікувалося, а не *як* це написати.
      en: |
        Here you work **without hints**: just the task, the editor and the checks. There are two tasks: first the client of an events page, then a threat note for it.

        The checks put in their own server answers — **hidden fixtures** that are not in the files: titles with markup, `javascript:` and `data:` links in different spellings, a Cyrillic search with `&` and spaces, an HTML page with status `200` instead of JSON, a `404` and a network failure.

        If a check fails, read its title and message: they say *what* was expected, not *how* to write it.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: межові випадки"
      en: "Recall: boundary cases"
    items:
      - id: boundary-inputs
        from: js-09-03-boundary-cases
        prompt:
          uk: "Ти перевіряєш функцію, що показує список подій. Які вхідні дані варто взяти для перевірок? Обери всі."
          en: "You are checking a function that shows a list of events. Which inputs are worth using in the checks? Choose all that apply."
        answer:
          type: multi
          options:
            - id: empty
              text: { uk: "Порожній список `[]`", en: "An empty list `[]`" }
            - id: one
              text: { uk: "Список з однієї події", en: "A list of one event" }
            - id: many
              text: { uk: "Список із кількох подій", en: "A list of several events" }
            - id: missing
              text: { uk: "Подія без організатора чи з `null` замість адреси", en: "An event without an organizer, or with `null` instead of an address" }
            - id: typical-only
              text: { uk: "Достатньо одного типового списку з трьох подій", en: "One typical list of three events is enough" }
              why:
                uk: "Типовий випадок працює майже завжди; помилки ховаються на межах — порожньо, одне, багато, відсутнє значення."
                en: "The typical case almost always works; bugs hide at the boundaries — empty, one, many, a missing value."
          correct: [empty, one, many, missing]
        explanation:
          uk: "Межові випадки — порожньо, одне, багато, відсутнє значення — ловлять помилки, яких типовий приклад не покаже. Для недовірених даних додай ще один вид межі: дивний уміст — розмітку, лапки, чужі схеми адрес."
          en: "Boundary cases — empty, one, many, a missing value — catch bugs a typical example never shows. For untrusted data add one more kind of boundary: odd content — markup, quotes, foreign address schemes."

  - id: events-client
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: events-client
    entry: index.html
    editable: [index.js]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Події міста", en: "City events" }
      queryLabel: { uk: "Пошук:", en: "Search:" }
      cityLabel: { uk: "Місто:", en: "City:" }
      allCities: { uk: "Усі міста", en: "All cities" }
      kyiv: { uk: "Київ", en: "Kyiv" }
      lviv: { uk: "Львів", en: "Lviv" }
      odesa: { uk: "Одеса", en: "Odesa" }
      searchButton: { uk: "Шукати", en: "Search" }
      loading: { uk: "Шукаю…", en: "Searching…" }
      found: { uk: "Знайдено подій:", en: "Events found:" }
      loadFailed: { uk: "Не вдалося завантажити події. Спробуй пізніше.", en: "Could not load the events. Try again later." }
      poetryNight: { uk: "Вечір поезії", en: "Poetry night" }
      library: { uk: "Міська бібліотека", en: "City library" }
      club: { uk: "Клуб «Нічна сова»", en: "The Night Owl club" }
      boardGames: { uk: "Настільні ігри", en: "Board games" }
      cafe: { uk: "Кав’ярня на розі", en: "The corner café" }
      walk: { uk: "Прогулянка парком", en: "A walk in the park" }
      park: { uk: "Друзі парку", en: "Friends of the park" }
      trickyQuery: { uk: "Кава & книги #2", en: "Кава & книги #2" }
    title:
      uk: "Клієнт сторінки подій"
      en: "The events page client"
    instructions:
      uk: |
        Сторінка подій шукає події через `/api/events`. Розмітку (`index.html`) дано; напиши в `index.js`:

        1. `searchUrl(base, { query, city })` — повертає текстом адресу: `base` і параметри `q` (пошук) та `city`, закодовані так, щоб кожне значення дійшло без змін. Порожні параметри не додаються.
        2. `loadEvents(url)` — запитує адресу й повертає `{ ok: true, events }`, де `events` — масив із JSON-відповіді, або `{ ok: false }` для будь-якого збою: відповідь не `ok`, тіло не JSON (зокрема сторінка HTML зі статусом `200`), відхилений `fetch`. Ніколи не кидає помилку.
        3. `renderEvents(events)` — замінює вміст `#events`: на кожну подію `li` з `h3` (назва) і назвою організатора (`event.organizer.name`). Назва організатора стає посиланням на `event.organizer.url`, лише якщо це абсолютна адреса `http:` чи `https:`; інакше — просто текст. Жоден текст із даних не стає розміткою.
        4. Надсилання форми: без перезавантаження сторінки будує адресу з полів `#query` і `#city`, завантажує й показує події, а в `#status` пише «Знайдено подій: N» або «Не вдалося завантажити події. Спробуй пізніше.» (тоді список порожній). Поки триває запит — «Шукаю…».
        5. Щойно людина змінює місто в `#city`, вибір зберігається в `localStorage` під ключем `events.city` — і більше нічого не зберігається. `restoreFilter()` повертає збережене місто в `#city`; виклич її під час завантаження сторінки.
      en: |
        The events page searches for events through `/api/events`. The markup (`index.html`) is given; in `index.js` write:

        1. `searchUrl(base, { query, city })` — returns the address as text: `base` plus the parameters `q` (the search) and `city`, encoded so that every value arrives unchanged. Empty parameters are not added.
        2. `loadEvents(url)` — requests the address and returns `{ ok: true, events }`, where `events` is the array from the JSON response, or `{ ok: false }` for any failure: a response that is not `ok`, a body that is not JSON (an HTML page with status `200` included), a rejected `fetch`. It never throws.
        3. `renderEvents(events)` — replaces the contents of `#events`: for each event an `li` with an `h3` (the title) and the organizer’s name (`event.organizer.name`). The organizer’s name becomes a link to `event.organizer.url` only if that is an absolute `http:` or `https:` address; otherwise it is plain text. No text from the data becomes markup.
        4. Form submission: without reloading the page it builds the address from the `#query` and `#city` fields, loads and shows the events, and writes to `#status` either “Events found: N” or “Could not load the events. Try again later.” (with an empty list). While the request runs — “Searching…”.
        5. As soon as the person changes the city in `#city`, the choice is saved in `localStorage` under the key `events.city` — and nothing else is saved. `restoreFilter()` puts the saved city back into `#city`; call it when the page loads.
    testTitles:
      "searchUrl encodes the query and the city and leaves out empty ones":
        uk: "`searchUrl` кодує пошук і місто та пропускає порожні"
        en: "`searchUrl` encodes the query and the city and leaves out empty ones"
      "loadEvents returns the events of a JSON answer and a failure otherwise, without throwing":
        uk: "`loadEvents` повертає події з JSON-відповіді, інакше — збій, і не кидає помилок"
        en: "`loadEvents` returns the events of a JSON answer and a failure otherwise, without throwing"
      "renderEvents shows every title as text":
        uk: "`renderEvents` показує кожну назву як текст"
        en: "`renderEvents` shows every title as text"
      "renderEvents links organizers only with http or https":
        uk: "`renderEvents` робить посилання на організатора лише для `http` чи `https`"
        en: "`renderEvents` links organizers only with `http` or `https`"
      "submitting the form requests the encoded search and shows the result":
        uk: "Надсилання форми запитує закодований пошук і показує результат"
        en: "Submitting the form requests the encoded search and shows the result"
      "a 200 HTML fallback page shows the failure message and no events":
        uk: "Запасна сторінка HTML зі статусом `200` дає повідомлення про збій і порожній список"
        en: "A `200` HTML fallback page shows the failure message and no events"
      "only the city preference is stored, and it comes back":
        uk: "Зберігається лише вибране місто, і воно повертається"
        en: "Only the city preference is stored, and it comes back"
      "while the search runs the status says so, and the page does not reload":
        uk: "Поки триває пошук, стан про це каже, а сторінка не перезавантажується"
        en: "While the search runs the status says so, and the page does not reload"
    solutionNote:
      uk: "`searchParams` кодує `&`, `#` і кирилицю; `loadEvents` перевіряє `ok` і Content-Type до розбору й перетворює кожен збій на `{ ok: false }`; `renderEvents` будує елементи через `textContent`, а адресу організатора пропускає лише після перевірки `protocol` через `URL`. У сховищі — одне вподобання, без списку подій чи тексту пошуку."
      en: "`searchParams` encodes `&`, `#` and Cyrillic; `loadEvents` checks `ok` and the Content-Type before parsing and turns every failure into `{ ok: false }`; `renderEvents` builds elements with `textContent` and lets an organizer’s address through only after checking its `protocol` with `URL`. Storage holds one preference, no list of events and no search text."
    feedback:
      - when: { test: "searchUrl encodes the query and the city and leaves out empty ones" }
        message:
          uk: "Ця перевірка розбирає результат `searchUrl` як адресу й очікує шлях `/api/events`, параметри `q` і `city` з точними значеннями (пошук містить `&`, `#` і кирилицю), а без фільтрів — жодного рядка запиту чи фрагмента."
          en: "This check parses the result of `searchUrl` as an address and expects the path `/api/events`, the parameters `q` and `city` with exact values (the search holds `&`, `#` and Cyrillic), and with no filters no query string and no fragment."
      - when: { test: "loadEvents returns the events of a JSON answer and a failure otherwise, without throwing" }
        message:
          uk: "Ця перевірка очікує `{ ok: true, events }` для `200` з JSON і `ok: false` — без кинутої помилки — для `404`, для сторінки HTML зі статусом `200` і для збою мережі."
          en: "This check expects `{ ok: true, events }` for `200` with JSON, and `ok: false` — without a thrown error — for a `404`, for an HTML page with status `200` and for a network failure."
      - when: { test: "renderEvents shows every title as text" }
        message:
          uk: "Ця перевірка очікує, що текст кожного `h3` дорівнює назві події, навіть якщо в ній є теги, і що з даних не з’являється жодного елемента."
          en: "This check expects the text of each `h3` to equal the event title, even when it contains tags, and no element to appear from the data."
      - when: { test: "renderEvents links organizers only with http or https" }
        message:
          uk: "Ця перевірка очікує рівно два посилання — для адрес `https:` і `http:` — і назви інших організаторів текстом. Адреси `javascript:` і `data:` приходять у різних написаннях."
          en: "This check expects exactly two links — for the `https:` and `http:` addresses — and the other organizers’ names as text. The `javascript:` and `data:` addresses come in different spellings."
      - when: { test: "submitting the form requests the encoded search and shows the result" }
        message:
          uk: "Ця перевірка заповнює форму, натискає «Шукати» й очікує один запит на `/api/events` з точними `q` і `city`, дві події на сторінці та «Знайдено подій: 2»."
          en: "This check fills in the form, presses “Search” and expects one request to `/api/events` with the exact `q` and `city`, two events on the page and “Events found: 2”."
      - when: { test: "a 200 HTML fallback page shows the failure message and no events" }
        message:
          uk: "Ця перевірка відповідає на пошук сторінкою HTML зі статусом `200` і очікує повідомлення про збій та порожній список."
          en: "This check answers the search with an HTML page and status `200` and expects the failure message and an empty list."
      - when: { test: "only the city preference is stored, and it comes back" }
        message:
          uk: "Ця перевірка очікує, що вибір міста зберігається одразу, без пошуку, а після пошуку в `localStorage` рівно один ключ — `events.city` зі значенням вибраного міста — і що `restoreFilter()` ставить збережене місто в `#city`."
          en: "This check expects the chosen city to be saved at once, without a search, and after a search exactly one key in `localStorage` — `events.city` with the chosen city — and `restoreFilter()` to put the saved city into `#city`."
      - when: { test: "while the search runs the status says so, and the page does not reload" }
        message:
          uk: "Ця перевірка надсилає форму (подією `submit`, без кліку по кнопці) з відповіддю, що йде 300 мс, і очікує, що подію надсилання скасовано — сторінка не перезавантажується — а поки відповіді немає, `#status` показує «Шукаю…»."
          en: "This check submits the form (with a `submit` event, without clicking the button) with an answer that takes 300 ms, and expects the submit event to be prevented — the page does not reload — and `#status` to show “Searching…” until the answer arrives."

  - id: threat-note
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: threat-note
    entry: index.js
    editable: [index.js]
    title:
      uk: "Нотатка про загрози"
      en: "A threat note"
    instructions:
      uk: |
        Заповни `THREAT_NOTE` для сторінки подій із попереднього завдання:

        - `untrustedSources` — звідки на сторінку потрапляє недовірений текст (вибери з `"form field"`, `"URL query"`, `"localStorage"`, `"fetched JSON"` лише те, що ця сторінка справді використовує);
        - `sinks` — яким API показано назву події, назву організатора й посилання організатора (для посилання — як перевіряється його схема);
        - `storedKeys` — кожен ключ, який зберігає сторінка: `{ key, storage, scope, lifetime }`, де `scope` — `"origin"`, `"origin and tab"` чи `"host and path"`;
        - `secrets` — одне-два речення: чому в браузер не потрапляє жоден секрет і де він жив би, якби був потрібен.

        Писати можна українською чи англійською.
      en: |
        Fill in `THREAT_NOTE` for the events page from the previous task:

        - `untrustedSources` — where untrusted text enters the page (choose from `"form field"`, `"URL query"`, `"localStorage"`, `"fetched JSON"` only what this page really uses);
        - `sinks` — which API shows the event title, the organizer name and the organizer link (for the link — how its scheme is checked);
        - `storedKeys` — every key the page stores: `{ key, storage, scope, lifetime }`, where `scope` is `"origin"`, `"origin and tab"` or `"host and path"`;
        - `secrets` — one or two sentences: why no secret reaches the browser and where it would live if one were needed.

        You may write in Ukrainian or English.
    testTitles:
      "names every untrusted source of the events page":
        uk: "Називає кожне недовірене джерело сторінки подій"
        en: "Names every untrusted source of the events page"
      "displays the title and the organizer name through a text sink":
        uk: "Назва події й назва організатора — через текстовий sink"
        en: "Displays the title and the organizer name through a text sink"
      "checks the scheme before a link is made":
        uk: "Перевіряє схему, перш ніж зробити посилання"
        en: "Checks the scheme before a link is made"
      "lists the one stored key with its storage, scope and lifetime":
        uk: "Перелічує єдиний збережений ключ зі сховищем, межею й часом життя"
        en: "Lists the one stored key with its storage, scope and lifetime"
      "explains where a secret would live":
        uk: "Пояснює, де жив би секрет"
        en: "Explains where a secret would live"
    solutionNote:
      uk: "Недовірений текст приходить із поля пошуку, зі сховища (збережене місто) і з JSON; адреси сторінки ця сторінка не читає. Назви йдуть через `textContent`, посилання — лише після перевірки `protocol`. Єдиний ключ — `events.city` у `localStorage` одного origin, без терміну дії. Ключів API сторінці не треба; а якби знадобився, він жив би на сервері, бо все, що читає клієнтський код, опиняється в bundle."
      en: "Untrusted text comes from the search field, from storage (the saved city) and from JSON; this page does not read its own address. Titles go through `textContent`, links only after a `protocol` check. The only key is `events.city` in the `localStorage` of one origin, with no expiry. The page needs no API key; if one were needed, it would live on a server, because everything client code reads ends up in the bundle."
    feedback:
      - when: { test: "names every untrusted source of the events page" }
        message:
          uk: "Ця перевірка очікує рівно три джерела, якими користується сторінка подій. Пригадай, що вона читає з форми, що — зі сховища, що — з мережі, і чи читає вона свою адресу."
          en: "This check expects exactly the three sources the events page uses. Recall what it reads from the form, from storage and from the network, and whether it reads its own address."
      - when: { test: "displays the title and the organizer name through a text sink" }
        message:
          uk: "Ця перевірка очікує, що для `title` і `organizerName` названо текстовий sink (`textContent` чи текстовий вузол) і що HTML-приймач не названо як спосіб показу (згадка на кшталт «не `innerHTML`» не заважає)."
          en: "This check expects `title` and `organizerName` to name a text sink (`textContent` or a text node) and no HTML sink as the way of display (a mention such as “not `innerHTML`” is fine)."
      - when: { test: "checks the scheme before a link is made" }
        message:
          uk: "Ця перевірка очікує в `organizerLink` опис перевірки схеми адреси — через `protocol`, `http:`/`https:` чи слово «схема» — і жодного HTML-приймача як способу показу."
          en: "This check expects `organizerLink` to describe a check of the address scheme — by `protocol`, `http:`/`https:` or the word “scheme” — and no HTML sink as the way of display."
      - when: { test: "lists the one stored key with its storage, scope and lifetime" }
        message:
          uk: "Ця перевірка очікує один запис: `events.city`, `localStorage`, межа `\"origin\"` і непорожній опис часу життя."
          en: "This check expects one entry: `events.city`, `localStorage`, the scope `\"origin\"` and a non-empty description of the lifetime."
      - when: { test: "explains where a secret would live" }
        message:
          uk: "Ця перевірка очікує в `secrets` щонайменше одне речення (40 знаків), яке називає сервер."
          en: "This check expects `secrets` to hold at least one sentence (40 characters) that names the server."
