id: js-16-02-http-methods-status-headers
unit: JS-16
title:
  uk: "HTTP-методи, коди статусу та заголовки глибше"
  en: "HTTP methods, status codes and headers in depth"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Обрати GET, POST, PUT, PATCH чи DELETE для кожної операції проєкту й сказати, які методи безпечні, а які ідемпотентні."
    en: "Choose GET, POST, PUT, PATCH or DELETE for each capstone operation and say which methods are safe and which are idempotent."
  - uk: "Прочитати клас статусу й заголовки Content-Type, Accept і Cache-Control в обміні з сервером фікстур і передбачити, що для кожного дадуть `response.ok` і `response.json()`."
    en: "Read the status class and the Content-Type, Accept and Cache-Control headers of a fixture exchange, and predict what `response.ok` and `response.json()` do for each."
prerequisites: [js-16-01-url-query-encoding, js-08-06-fetch-basics]
subskills:
  - { family: W-04, skill: "HTTP methods/status/headers", depth: practice }
  - { family: W-04, skill: "JSON content types", depth: practice }
glossary: [safe-method, idempotency, cache-control]
selfCheck: [predict-four, request-json]

blocks:
  - id: methods
    kind: explanation
    title:
      uk: "Метод — це обіцянка, а не спосіб передати дані"
      en: "A method is a promise, not a way to carry data"
    body:
      uk: |
        [[http-method|Метод]] каже серверу, **що** ти хочеш зробити. Для списку бажань це виглядає так:

        | Операція | Запит | Безпечний | Ідемпотентний |
        |---|---|---|---|
        | показати список | `GET /items` | так | так |
        | додати бажання | `POST /items` | ні | ні |
        | замінити запис цілком | `PUT /items/w-02` | ні | так |
        | змінити одне поле | `PATCH /items/w-02` | ні | не обов’язково |
        | видалити | `DELETE /items/w-02` | ні | так |

        [[safe-method|Безпечний]] метод нічого не змінює на сервері: `GET` можна повторювати, кешувати й навіть надсилати наперед. [[idempotency|Ідемпотентний]] — той, що після одного чи п’яти однакових запитів лишає сервер у тому самому стані: двічі видалений запис усе одно видалений.

        А `POST`, надісланий двічі (подвійний клік, повтор після збою), створить **два** записи. Тому `GET` і `POST` різняться не лише тим, де лежать дані, а й тим, що можна безпечно повторити.
      en: |
        A [[http-method|method]] tells the server **what** you want to do. For a wishlist it looks like this:

        | Operation | Request | Safe | Idempotent |
        |---|---|---|---|
        | show the list | `GET /items` | yes | yes |
        | add a wish | `POST /items` | no | no |
        | replace a whole record | `PUT /items/w-02` | no | yes |
        | change one field | `PATCH /items/w-02` | no | not necessarily |
        | delete | `DELETE /items/w-02` | no | yes |

        A [[safe-method]] changes nothing on the server: `GET` can be repeated, cached and even sent in advance. An [[idempotency|idempotent]] one leaves the server in the same state after one or five identical requests: a record deleted twice is still deleted.

        But a `POST` sent twice (a double click, a retry after a failure) creates **two** records. So `GET` and `POST` differ not only in where the data goes but in what can safely be repeated.

  - id: exchanges-sequence
    kind: visual
    visual: sequence
    title:
      uk: "П’ять обмінів із сервером фікстур"
      en: "Five exchanges with a fixture server"
    textEquivalent:
      uk: "Код сторінки надсилає серверу фікстур п’ять запитів по черзі. Перший — GET /items із заголовком Accept: application/json; сервер відповідає 200 OK, Content-Type: application/json і списком записів. Другий — POST /items із JSON-тілом нового бажання; сервер створює запис і відповідає 201 Created із заголовком Location — адресою нового запису. Повтор цього POST створив би ще один запис. Третій — PUT /items/w-02 з повним новим записом; сервер замінює запис і відповідає 200 OK; повтор дав би той самий результат. Четвертий — DELETE /items/w-02; сервер відповідає 204 No Content, тобто без тіла; повторний DELETE отримав би 404, але стан сервера не змінився б: запису немає. П’ятий — GET /items/w-02/details, адреса, якої сервер не знає. Сервер, налаштований віддавати на невідомі адреси сторінку застосунку (наприклад, esbuild із прапорцем --serve-fallback), відповідає 200 OK, але з Content-Type: text/html і HTML-сторінкою в тілі. response.ok тут true, а response.json() відхиляється з SyntaxError: статус 200 не означає, що прийшов JSON."
      en: "The page code sends the fixture server five requests in turn. The first is GET /items with the header Accept: application/json; the server answers 200 OK, Content-Type: application/json and a list of records. The second is POST /items with a JSON body of a new wish; the server creates the record and answers 201 Created with a Location header — the address of the new record. Repeating that POST would create one more record. The third is PUT /items/w-02 with the complete new record; the server replaces the record and answers 200 OK; a repeat would give the same result. The fourth is DELETE /items/w-02; the server answers 204 No Content, that is, without a body; a second DELETE would get 404, but the server’s state would not change: the record is gone. The fifth is GET /items/w-02/details, an address the server does not know. A server set up to answer unknown addresses with the application page (for example, esbuild with the --serve-fallback flag) answers 200 OK, but with Content-Type: text/html and an HTML page in the body. response.ok is true here, and response.json() rejects with a SyntaxError: status 200 does not mean JSON arrived."
    spec:
      actors:
        - { id: page, label: { uk: "Код сторінки", en: "Page code" } }
        - { id: server, label: { uk: "Сервер фікстур", en: "Fixture server" } }
      intro:
        uk: "Двоє учасників: твій код і сервер фікстур. Кожен рядок — один запит або одна відповідь."
        en: "Two participants: your code and the fixture server. Each row is one request or one response."
      messages:
        - from: page
          to: server
          label: "GET /items"
          kind: async
          note: { uk: "Accept: application/json", en: "Accept: application/json" }
          caption:
            uk: "`GET` — безпечний запит: прочитати список. Заголовок `Accept` каже, у якому форматі код хоче відповідь."
            en: "`GET` is a safe request: read the list. The `Accept` header says which format the code wants the answer in."
        - from: server
          to: page
          label: "200 OK"
          kind: return
          note: { uk: "Content-Type: application/json · [6 записів]", en: "Content-Type: application/json · [6 records]" }
          caption:
            uk: "Статус `200`, тіло — JSON, і Content-Type це підтверджує. Тут можна читати `response.json()`."
            en: "Status `200`, a JSON body, and the Content-Type confirms it. Here `response.json()` can be read."
        - from: page
          to: server
          label: "POST /items"
          kind: async
          note: { uk: "тіло: новий запис у JSON", en: "body: a new record as JSON" }
          caption:
            uk: "`POST` створює запис. Він не ідемпотентний: той самий запит удруге створив би ще одне бажання."
            en: "`POST` creates a record. It is not idempotent: the same request a second time would create another wish."
        - from: server
          to: page
          label: "201 Created"
          kind: return
          note: { uk: "Location: /items/w-07", en: "Location: /items/w-07" }
          caption:
            uk: "`201` — теж успіх (`ok` — `true` для всіх 200–299). Заголовок `Location` називає адресу нового запису."
            en: "`201` is success too (`ok` is `true` for every 200–299). The `Location` header names the address of the new record."
        - from: page
          to: server
          label: "PUT /items/w-02"
          kind: async
          caption:
            uk: "`PUT` замінює запис цілком. Повторити його безпечно: результат буде той самий."
            en: "`PUT` replaces the whole record. Repeating it is safe: the result is the same."
        - from: server
          to: page
          label: "200 OK"
          kind: return
          caption:
            uk: "Сервер повертає оновлений запис."
            en: "The server returns the updated record."
        - from: page
          to: server
          label: "DELETE /items/w-02"
          kind: async
          caption:
            uk: "`DELETE` теж ідемпотентний: після другого такого запиту запису так само немає."
            en: "`DELETE` is idempotent too: after a second such request the record is just as gone."
        - from: server
          to: page
          label: "204 No Content"
          kind: return
          caption:
            uk: "`204` — успіх **без тіла**. Виклик `response.json()` тут відхилився б: читати нічого."
            en: "`204` is success **without a body**. Calling `response.json()` here would reject: there is nothing to read."
        - from: page
          to: server
          label: "GET /items/w-02/details"
          kind: async
          caption:
            uk: "Адреса, якої сервер не знає. Що він відповість, залежить від налаштувань."
            en: "An address the server does not know. What it answers depends on its setup."
        - from: server
          to: page
          label: "200 OK"
          kind: return
          note: { uk: "Content-Type: text/html · <!doctype html>…", en: "Content-Type: text/html · <!doctype html>…" }
          caption:
            uk: "Сервер із запасною сторінкою віддає на невідому адресу HTML застосунку **зі статусом 200**. `ok` — `true`, але `response.json()` дасть `SyntaxError`. Перевіряй Content-Type."
            en: "A server with a fallback page answers an unknown address with the app’s HTML **and status 200**. `ok` is `true`, but `response.json()` gives a `SyntaxError`. Check the Content-Type."

  - id: status-headers
    kind: explanation
    title:
      uk: "Клас статусу й три заголовки"
      en: "The status class and three headers"
    body:
      uk: |
        Перша цифра [[status-code|коду статусу]] — його клас: `2xx` — успіх, `3xx` — переадресація (`fetch` іде за нею сам), `4xx` — проблема із запитом (`404` — немає такого, `405` — цей метод тут не приймають), `5xx` — збій сервера. `response.ok` — це лише «статус від 200 до 299».

        Три заголовки, які варто читати:

        - **Content-Type** у відповіді — формат тіла. Лише `application/json` обіцяє JSON.
        - **Accept** у запиті — формат, якого просить код. Це прохання, а не гарантія: сервер може відповісти інакше.
        - [[cache-control|Cache-Control]] у відповіді — чи можна тримати копію: `no-store` — не зберігати, `max-age=60` — використовувати хвилину без нового запиту.

        Тож `200` ще не означає «прийшов мій JSON»: статус каже, як пройшов обмін, а Content-Type — що лежить у тілі.
      en: |
        The first digit of a [[status-code]] is its class: `2xx` — success, `3xx` — a redirect (`fetch` follows it by itself), `4xx` — a problem with the request (`404` — no such thing, `405` — this method is not accepted here), `5xx` — a server failure. `response.ok` only means “the status is between 200 and 299”.

        Three headers worth reading:

        - **Content-Type** in the response — the format of the body. Only `application/json` promises JSON.
        - **Accept** in the request — the format the code asks for. It is a request, not a guarantee: the server may answer otherwise.
        - [[cache-control|Cache-Control]] in the response — whether a copy may be kept: `no-store` — do not keep one, `max-age=60` — use it for a minute without a new request.

        So `200` does not yet mean “my JSON arrived”: the status says how the exchange went, and the Content-Type says what is in the body.

  - id: predict-four
    kind: prediction
    prompt:
      uk: "Код надсилає чотири запити. Сервер фікстур знає запис `w-02`, не знає `w-99` і не приймає `POST` на адресу окремого запису. Файл `app/index.html` — сторінка застосунку, яку сервер віддає замість невідомої адреси. Які твердження правдиві? Обери всі."
      en: "The code sends four requests. The fixture server knows the record `w-02`, does not know `w-99` and does not accept `POST` on the address of a single record. The file `app/index.html` is the application page the server returns instead of an unknown address. Which statements are true? Choose all that are."
    code: |
      const a = await fetch("/lab/wishlist/items/w-02");
      const b = await fetch("/lab/wishlist/items/w-99");
      const c = await fetch("/lab/wishlist/items/w-02", { method: "POST" });
      const d = await fetch("./app/index.html");
    runnable: false
    answer:
      type: multi
      options:
        - id: a-json
          text:
            uk: "`a`: статус `200`, `ok` — `true`, Content-Type — `application/json`"
            en: "`a`: status `200`, `ok` is `true`, Content-Type is `application/json`"
        - id: b-rejects
          text:
            uk: "`b`: `await fetch` кидає помилку, бо запису немає"
            en: "`b`: `await fetch` throws because the record does not exist"
          why:
            uk: "Сервер відповів — статусом `404`. `fetch` відхиляється лише тоді, коли відповіді немає взагалі."
            en: "The server did answer — with status `404`. `fetch` rejects only when there is no answer at all."
        - id: c-405
          text:
            uk: "`c`: статус `405`, `ok` — `false`"
            en: "`c`: status `405`, `ok` is `false`"
        - id: c-like-get
          text:
            uk: "`c`: те саме, що й `a`, — `POST` лише по-іншому передає дані"
            en: "`c`: the same as `a` — `POST` just carries data differently"
          why:
            uk: "Метод — це інша дія, а не інша «упаковка». Сервер вирішує за методом, і `POST` на окремий запис тут не дозволено: `405 Method Not Allowed`."
            en: "A method is a different action, not a different “wrapping”. The server decides by the method, and `POST` on a single record is not allowed here: `405 Method Not Allowed`."
        - id: d-data
          text:
            uk: "`d`: статус `200`, тож `await d.json()` дасть дані"
            en: "`d`: status `200`, so `await d.json()` gives data"
          why:
            uk: "Статус `200` каже, що обмін удався, а не що тіло — JSON. Тут Content-Type — `text/html`, і `json()` відхилиться з `SyntaxError`."
            en: "Status `200` says the exchange worked, not that the body is JSON. Here the Content-Type is `text/html`, and `json()` rejects with a `SyntaxError`."
      correct: [a-json, c-405]
    explanation:
      uk: "Кожен із чотирьох `fetch` виконується відповіддю: `200` з JSON, `404`, `405` і `200` з HTML. `ok` дивиться лише на статус, тож у `d` він `true`, хоча даних там немає. Рішення «можна читати JSON» потребує двох перевірок: `ok` і Content-Type. Переконайся в прикладі цього уроку."
      en: "Each of the four `fetch` calls is fulfilled with a response: `200` with JSON, `404`, `405`, and `200` with HTML. `ok` looks only at the status, so it is `true` for `d` although there is no data in it. The decision “JSON can be read” needs two checks: `ok` and the Content-Type. See for yourself in this lesson’s example."

  - id: exchanges
    kind: example
    runtime: browser-js
    dir: exchanges
    entry: index.js
    capabilities: { network: lab }
    strings:
      lang: { uk: "uk", en: "en" }
      appTitle: { uk: "Список бажань", en: "Wishlist" }
      appText: { uk: "Сторінку завантажено.", en: "The page has loaded." }
      serverSawAccept: { uk: "Сервер побачив Accept:", en: "The server saw Accept:" }
    title:
      uk: "Справжні обміни: статус і заголовки"
      en: "Real exchanges: status and headers"
    body:
      uk: |
        Адреси `/lab/…` — справжній сервер фікстур платформи, тож ці запити видно й на панелі Network в інструментах розробника браузера. Файл проєкту `app/index.html` тут грає роль запасної сторінки, яку деякі сервери віддають на невідому адресу. Запусти й порівняй статус, `ok` і Content-Type кожного обміну.
      en: |
        The `/lab/…` addresses are the platform’s real fixture server, so these requests also show up in the Network panel of the browser’s developer tools. The project file `app/index.html` plays the part of the fallback page some servers return for an unknown address. Run it and compare the status, `ok` and Content-Type of each exchange.
    tryIt:
      uk: |
        1. Після рядка з `page` додай `console.log(await page.json());` і запусти: картка «Помилка під час виконання» з `SyntaxError` — статус був `200`, але тіло — HTML. Потім прибери цей рядок.
        2. У запиті до `/lab/echo` заміни `"application/json"` на `"text/html"`: сервер побачив інше прохання, але відповів усе одно JSON — Accept не гарантія.
        3. Заміни `"POST"` на `"DELETE"` і додай під цим рядком коду ще один такий самий: перший `DELETE` дасть `204` (без тіла, тож Content-Type — `null`), другий — `404`. Стан сервера після обох однаковий — запису немає. Рядок `reset` угорі повертає записи на наступному запуску.
      en: |
        1. Below the line with `page` add `console.log(await page.json());` and run: the card “Error while running” with a `SyntaxError` — the status was `200`, but the body is HTML. Then remove that line.
        2. In the request to `/lab/echo` replace `"application/json"` with `"text/html"`: the server saw a different request, but still answered JSON — Accept is not a guarantee.
        3. Replace `"POST"` with `"DELETE"` and add one more identical line of code below it: the first `DELETE` gives `204` (no body, so the Content-Type is `null`), the second `404`. The server’s state after both is the same — the record is gone. The `reset` line at the top brings the records back on the next run.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: перевірка перед читанням"
      en: "Recall: checking before reading"
    items:
      - id: order-of-checks
        from: js-08-06-fetch-basics
        prompt:
          uk: "Функція завантажує витрати. У якому порядку їй варто діяти?"
          en: "A function loads expenses. In what order should it act?"
        answer:
          type: order
          items:
            - { id: wait, text: { uk: "дочекатися відповіді: `await fetch(url)`", en: "wait for the response: `await fetch(url)`" } }
            - { id: status, text: { uk: "перевірити `response.ok`", en: "check `response.ok`" } }
            - { id: type, text: { uk: "перевірити Content-Type", en: "check the Content-Type" } }
            - { id: read, text: { uk: "прочитати тіло: `await response.json()`", en: "read the body: `await response.json()`" } }
        explanation:
          uk: "`fetch` виконується з будь-яким статусом, тож спершу `ok`: сторінка помилки `404` часто взагалі не JSON. Далі Content-Type — він каже, чи тіло JSON. Лише тоді `json()`: тіло читається один раз, і розібрати HTML як дані не вдасться."
          en: "`fetch` fulfills with any status, so `ok` comes first: a `404` error page is often not JSON at all. Then the Content-Type — it tells whether the body is JSON. Only then `json()`: a body is read once, and HTML cannot be parsed as data."

  - id: request-json
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: request-json
    entry: index.js
    editable: [index.js]
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      tech: { uk: "Техніка", en: "Tech" }
      home: { uk: "Дім", en: "Home" }
    title:
      uk: "requestJson, що повертає результат, а не кидає помилку"
      en: "A requestJson that returns a result instead of throwing"
    instructions:
      uk: |
        Допиши `requestJson(url, options)`. Вона надсилає запит із заголовком `Accept: application/json` і **ніколи не кидає помилку** — повертає об’єкт-результат:

        - `{ ok: true, value }` — розібране JSON-тіло;
        - `{ ok: false, error: { reason, status } }`, де `reason`:
          - `"network"` — `fetch` відхилився (тоді `status` — `null`);
          - `"status"` — відповідь не `ok`;
          - `"type"` — Content-Type не містить `application/json`;
          - `"parse"` — тіло не розібралося як JSON.

        Метод, тіло й інші заголовки з `options` мають дійти до `fetch` без змін. У проєкті є `data/wishes.json`; перевірки ще підставлять відповіді `201`, `500`, сторінку HTML зі статусом `200`, зіпсований JSON і збій мережі.
      en: |
        Complete `requestJson(url, options)`. It sends the request with the header `Accept: application/json` and **never throws** — it returns a result object:

        - `{ ok: true, value }` — the parsed JSON body;
        - `{ ok: false, error: { reason, status } }`, where `reason` is:
          - `"network"` — `fetch` rejected (then `status` is `null`);
          - `"status"` — the response is not `ok`;
          - `"type"` — the Content-Type does not contain `application/json`;
          - `"parse"` — the body did not parse as JSON.

        The method, the body and other headers from `options` must reach `fetch` unchanged. The project has `data/wishes.json`; the checks also put in answers `201` and `500`, an HTML page with status `200`, broken JSON and a network failure.
    testTitles:
      "asks for JSON with an Accept header":
        uk: "Просить JSON заголовком `Accept`"
        en: "Asks for JSON with an `Accept` header"
      "keeps the method, the body and other headers it was given":
        uk: "Зберігає метод, тіло й інші заголовки, які їй передали"
        en: "Keeps the method, the body and other headers it was given"
      "returns ok and the parsed value for a JSON answer":
        uk: "Для JSON-відповіді повертає `ok` і розібране значення"
        en: "Returns `ok` and the parsed value for a JSON answer"
      "reports the status of an answer that is not ok":
        uk: "Для відповіді не `ok` повертає її статус"
        en: "Reports the status of an answer that is not `ok`"
      "refuses a 200 page that is not JSON":
        uk: "Не приймає сторінку зі статусом `200`, яка не є JSON"
        en: "Refuses a `200` page that is not JSON"
      "never throws: a network failure and a broken JSON body are results too":
        uk: "Не кидає помилок: збій мережі й зіпсований JSON — теж результати"
        en: "Never throws: a network failure and a broken JSON body are results too"
    hints:
      nudge:
        uk: "Розклади функцію на ті самі кроки, що й у читанні відповіді, і для кожного кроку виріши, який `reason` повернути, якщо він не вдався. Що з цих кроків може кинути помилку?"
        en: "Split the function into the same steps as reading a response, and for each step decide which `reason` to return if it fails. Which of those steps can throw?"
      explanation:
        uk: "Кидати можуть два кроки: сам `await fetch(...)` (збій мережі) і `await response.json()` (тіло — не JSON). Кожен оточи власним `try/catch`, щоб знати, який саме `reason` повернути. Заголовки зливай так, щоб твій `Accept` не загубився: розгорни `options.headers` у новий об’єкт, а потім допиши `Accept` — як у `{ ...defaults, ...overrides }`, де виграє те, що записано пізніше."
        en: "Two steps can throw: the `await fetch(...)` itself (a network failure) and `await response.json()` (the body is not JSON). Surround each with its own `try/catch` so you know which `reason` to return. Merge the headers so your `Accept` is not lost: spread `options.headers` into a new object and then add `Accept` — as in `{ ...defaults, ...overrides }`, where whatever is written later wins."
    solutionNote:
      uk: "Кожен крок, що може не вдатися, дає свій `reason`: `network` — коли `fetch` відхилився, `status` — коли відповідь не `ok`, `type` — коли Content-Type не JSON, `parse` — коли JSON зіпсований. Код, що викликає `requestJson`, вирішує за `ok`, а не за `try/catch`, і може показати окреме повідомлення для кожного випадку."
      en: "Every step that can fail gives its own `reason`: `network` when `fetch` rejected, `status` when the response is not `ok`, `type` when the Content-Type is not JSON, `parse` when the JSON is broken. The code that calls `requestJson` decides by `ok`, not by `try/catch`, and can show a separate message for each case."
    feedback:
      - when: { test: "asks for JSON with an Accept header" }
        message:
          uk: "Ця перевірка очікує один запит методом `GET` із заголовком `Accept` зі значенням `application/json`."
          en: "This check expects one request with the `GET` method and an `Accept` header whose value is `application/json`."
      - when: { test: "keeps the method, the body and other headers it was given" }
        message:
          uk: "Ця перевірка передає `{ method: \"PUT\", headers: { \"Content-Type\": … }, body }` і очікує, що `fetch` отримає і їх, і `Accept`. Якщо `Accept` зник, заголовки з `options` замінили твої замість того, щоб злитися з ними."
          en: "This check passes `{ method: \"PUT\", headers: { \"Content-Type\": … }, body }` and expects `fetch` to receive them as well as `Accept`. If `Accept` is gone, the headers from `options` replaced yours instead of being merged with them."
      - when: { test: "returns ok and the parsed value for a JSON answer" }
        message:
          uk: "Ця перевірка очікує `{ ok: true, value }` для `data/wishes.json` і для відповіді `201`, де `value` — розібране тіло."
          en: "This check expects `{ ok: true, value }` for `data/wishes.json` and for a `201` answer, where `value` is the parsed body."
      - when: { test: "reports the status of an answer that is not ok" }
        message:
          uk: "Ця перевірка очікує `{ ok: false, error: { reason: \"status\", status: 404 } }` для відсутнього файла й те саме зі `status: 500` для відповіді `500`."
          en: "This check expects `{ ok: false, error: { reason: \"status\", status: 404 } }` for a missing file and the same with `status: 500` for a `500` answer."
      - when: { test: "refuses a 200 page that is not JSON" }
        message:
          uk: "Ця перевірка відповідає статусом `200` і Content-Type `text/html` та очікує `reason: \"type\"`. Якщо бачиш `reason: \"parse\"`, тіло читалося до перевірки Content-Type."
          en: "This check answers with status `200` and Content-Type `text/html` and expects `reason: \"type\"`. If you see `reason: \"parse\"`, the body was read before the Content-Type was checked."
      - when: { test: "never throws: a network failure and a broken JSON body are results too" }
        message:
          uk: "Ця перевірка очікує `reason: \"network\"` зі `status: null`, коли `fetch` відхиляється, і `reason: \"parse\"` зі `status: 200` для зіпсованого JSON — без жодної кинутої помилки."
          en: "This check expects `reason: \"network\"` with `status: null` when `fetch` rejects, and `reason: \"parse\"` with `status: 200` for broken JSON — without any thrown error."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` означає, що значення має не той тип, на який розраховує код. Якщо бачиш `… is not a function`, програма зупинилася ще під час завантаження — виправ спершу помилку з картки «Помилка під час виконання»."
          en: "A `TypeError` means a value has a different type than the code expects. If you see `… is not a function`, the program stopped while loading — fix the error from the card “Error while running” first."

  - id: to-project
    kind: transfer
    capstoneStep: JS-16
    body:
      uk: "У кроці проєкту фікстури прийдуть із локального файлового сервера. Твоя `requestJson` відрізнить порожню відповідь від сторінки помилки чи HTML замість JSON — і інтерфейс покаже чесний стан замість «зламаних» даних."
      en: "In the project step the fixtures come from a local file server. Your `requestJson` tells an empty answer from an error page or HTML instead of JSON — and the interface shows an honest state instead of “broken” data."
