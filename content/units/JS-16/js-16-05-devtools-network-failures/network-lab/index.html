<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <p class="actions">
        <button type="button" data-load="ok">%%loadButton%%</button>
        <button type="button" data-load="missing">%%missingButton%%</button>
        <button type="button" data-load="broken">%%brokenButton%%</button>
        <button type="button" data-load="slow">%%slowButton%%</button>
        <button type="button" data-load="cancel">%%cancelButton%%</button>
      </p>
      <p id="status" role="status">%%idle%%</p>
      <ul id="habits"></ul>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
