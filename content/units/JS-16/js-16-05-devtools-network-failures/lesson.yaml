id: js-16-05-devtools-network-failures
unit: JS-16
title:
  uk: "Діагностика збоїв на панелі Network"
  en: "Diagnosing failures in the network panel"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Прочитати запит на панелі Network (статус, час, ініціатор, заголовки запиту й відповіді, попередній перегляд) і зіставити його з кодом, що його надіслав."
    en: "Read a request in the network panel (status, timing, initiator, request and response headers, preview) and match it to the code that sent it."
  - uk: "Відтворити офлайн, повільну мережу й скасований запит і класифікувати кожен результат: HTTP-помилка, відхилений `fetch`, тайм-аут чи скасування."
    en: "Reproduce offline, slow-network and aborted requests and classify each outcome as an HTTP error response, a rejected `fetch`, a timeout or an abort."
prerequisites: [js-16-04-same-origin-cors, js-08-07-failures-loading-error]
subskills:
  - { family: W-04, skill: "network/offline failures", depth: practice }
  - { family: W-04, skill: "fetch response checks", depth: practice }
glossary: [network-throttling]
selfCheck: [predict-panel, classify]

blocks:
  - id: the-panel
    kind: explanation
    title:
      uk: "Панель Network — журнал усіх розмов сторінки"
      en: "The Network panel is a log of all the page’s conversations"
    body:
      uk: |
        DevTools (F12, у macOS — Cmd + Option + I) → **Network** записує кожен запит, поки панель відкрита. Один рядок — один запит:

        | Стовпчик | Що каже |
        |---|---|
        | Name | адреса (клацни — побачиш подробиці) |
        | Status | код статусу, або `(failed)` — відповіді не було, або `(canceled)` — браузер сам перервав запит |
        | Type | `fetch`, `document`, `script`… |
        | Initiator | файл і рядок коду, що надіслав запит |
        | Time | скільки тривав запит |

        Клацни рядок: **Headers** — заголовки запиту й відповіді, **Preview** і **Response** — тіло, **Timing** — де минув час.

        Головне правило: консоль без червоного ще не означає, що все гаразд. Код, що не перевіряє `response.ok`, «тихо» покаже сторінку помилки як дані, а панель Network покаже чесний `404`.

        Над списком є перемикач [[network-throttling|умов мережі]]: **No throttling**, повільні профілі й **Offline**.
      en: |
        DevTools (F12, on macOS Cmd + Option + I) → **Network** records every request while the panel is open. One row is one request:

        | Column | What it says |
        |---|---|
        | Name | the address (click it to see the details) |
        | Status | the status code, or `(failed)` — there was no answer, or `(canceled)` — the browser itself broke the request off |
        | Type | `fetch`, `document`, `script`… |
        | Initiator | the file and line of code that sent the request |
        | Time | how long the request took |

        Click a row: **Headers** — the request and response headers, **Preview** and **Response** — the body, **Timing** — where the time went.

        The main rule: a console without red does not mean everything is fine. Code that does not check `response.ok` “quietly” shows an error page as data, while the Network panel shows an honest `404`.

        Above the list there is a [[network-throttling|network conditions]] switch: **No throttling**, slow profiles and **Offline**.

  - id: predict-panel
    kind: prediction
    prompt:
      uk: "Код завантажує звички з тайм-аутом 2 секунди й кнопкою «Скасувати». Що покаже панель Network і що отримає код у чотирьох випадках: мережа є; увімкнено Offline; повільна мережа, на якій відповідь іде 5 секунд; людина натиснула «Скасувати» через 100 мс?"
      en: "The code loads habits with a 2-second timeout and a “Cancel” button. What does the Network panel show, and what does the code get, in four cases: the network is fine; Offline is on; a slow network on which the answer takes 5 seconds; the person pressed “Cancel” after 100 ms?"
    code: |
      // controller.abort() runs when the person presses "Cancel"
      const signal = AbortSignal.any([controller.signal, AbortSignal.timeout(2000)]);
      const response = await fetch("/lab/habits/items", { signal });
    runnable: false
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "`200` і дані · `(failed)` і `TypeError` · `(canceled)` і `TimeoutError` · `(canceled)` і `AbortError`"
            en: "`200` and data · `(failed)` and `TypeError` · `(canceled)` and `TimeoutError` · `(canceled)` and `AbortError`"
        - id: statuses
          text:
            uk: "`200` · `503` · `408` · `499` — для кожного збою сервер повертає свій статус"
            en: "`200` · `503` · `408` · `499` — the server returns its own status for each failure"
          why:
            uk: "У трьох останніх випадках відповіді від сервера не було: офлайн запит не пішов, а тайм-аут і скасування перервав сам браузер. Статусу немає, і `fetch` відхиляється."
            en: "In the last three cases there was no answer from the server: offline the request never left, and the timeout and the cancellation were broken off by the browser itself. There is no status, and `fetch` rejects."
        - id: all-same
          text:
            uk: "`200` і дані · а три інші — однакові `(failed)` і `TypeError`"
            en: "`200` and data · and the other three are the same `(failed)` and `TypeError`"
          why:
            uk: "Скасування сигналом браузер позначає `(canceled)`, а помилка має назву причини: `TimeoutError` для тайм-ауту, `AbortError` для кнопки. Саме за назвою їх і розрізняють."
            en: "A cancellation by a signal is marked `(canceled)` by the browser, and the error is named after the cause: `TimeoutError` for the timeout, `AbortError` for the button. That name is how they are told apart."
        - id: quiet-ok
          text:
            uk: "`200` і дані · а в трьох інших консоль мовчить, отже запити вдалися"
            en: "`200` and data · and in the other three the console stays quiet, so the requests succeeded"
          why:
            uk: "Мовчазна консоль нічого не доводить: код міг перехопити помилку й нічого не надрукувати. Панель Network покаже `(failed)` чи `(canceled)`."
            en: "A quiet console proves nothing: the code may have caught the error and printed nothing. The Network panel shows `(failed)` or `(canceled)`."
      correct: [right]
    explanation:
      uk: "Офлайн запит не виходить із браузера: рядок `(failed)`, `fetch` відхиляється з `TypeError`. Тайм-аут і кнопка скасовують запит через сигнал: рядок `(canceled)`, а помилка має назву своєї причини. Жоден із цих трьох випадків не є відповіддю сервера. Перевір у прикладі цього уроку."
      en: "Offline, the request never leaves the browser: the row says `(failed)`, and `fetch` rejects with a `TypeError`. The timeout and the button cancel the request through a signal: the row says `(canceled)`, and the error is named after its cause. None of these three cases is an answer from the server. Check it in this lesson’s example."

  - id: five-rows
    kind: visual
    visual: sequence
    title:
      uk: "П’ять рядків панелі Network і п’ять гілок коду"
      en: "Five rows of the Network panel and five branches of code"
    textEquivalent:
      uk: "Код п’ять разів завантажує звички, і панель Network записує п’ять рядків. Перший запит: сервер відповідає 200, панель показує 200, код перевіряє ok і показує список — гілка успіху. Другий: запит на неіснуючий запис, сервер відповідає 404, панель показує 404, fetch виконується з ok false — гілка HTTP-помилки. Третій: сервер відповідає 500 — теж відповідь, теж гілка HTTP-помилки, тільки з іншим статусом. Четвертий: у DevTools увімкнено Offline; запит не виходить із браузера, панель показує (failed), а fetch відхиляється з TypeError: Failed to fetch — гілка збою мережі. П’ятий: код скасовує запит через AbortController за 100 мс; панель показує (canceled), fetch відхиляється з AbortError — гілка скасування, яка не має лякати людину повідомленням про помилку. Лише перші три рядки — відповіді сервера."
      en: "The code loads the habits five times, and the Network panel records five rows. First request: the server answers 200, the panel shows 200, the code checks ok and shows the list — the success branch. Second: a request for a record that does not exist; the server answers 404, the panel shows 404, fetch fulfills with ok false — the HTTP-error branch. Third: the server answers 500 — also an answer, also the HTTP-error branch, just with another status. Fourth: Offline is switched on in DevTools; the request never leaves the browser, the panel shows (failed), and fetch rejects with TypeError: Failed to fetch — the network-failure branch. Fifth: the code cancels the request through an AbortController after 100 ms; the panel shows (canceled), fetch rejects with an AbortError — the cancellation branch, which must not scare the person with an error message. Only the first three rows are answers from the server."
    spec:
      actors:
        - { id: code, label: { uk: "Код сторінки", en: "Page code" } }
        - { id: panel, label: { uk: "Браузер · Network", en: "Browser · Network" } }
        - { id: server, label: { uk: "Сервер", en: "Server" } }
      messages:
        - from: panel
          to: server
          label: "GET /lab/habits/items"
          kind: async
          caption:
            uk: "Перший запит іде на сервер."
            en: "The first request goes to the server."
        - from: server
          to: code
          label: "200"
          kind: return
          note: { uk: "Network: 200 · гілка: успіх", en: "Network: 200 · branch: success" }
          caption:
            uk: "Рядок `200`. Код перевіряє `ok`, читає тіло й показує список."
            en: "Row `200`. The code checks `ok`, reads the body and shows the list."
        - from: server
          to: code
          label: "404"
          kind: return
          note: { uk: "Network: 404 · гілка: http-error", en: "Network: 404 · branch: http-error" }
          caption:
            uk: "Немає такого запису: рядок `404`. `fetch` **виконується** з `ok: false` — це відповідь сервера."
            en: "No such record: row `404`. `fetch` **fulfills** with `ok: false` — this is an answer from the server."
        - from: server
          to: code
          label: "500"
          kind: return
          note: { uk: "Network: 500 · гілка: http-error", en: "Network: 500 · branch: http-error" }
          caption:
            uk: "Збій на сервері: рядок `500`. Та сама гілка, інший статус і інша порада людині."
            en: "A failure on the server: row `500`. The same branch, a different status and different advice for the person."
        - from: code
          to: panel
          label: "fetch (Offline)"
          caption:
            uk: "У DevTools увімкнено **Offline**. Запит не виходить за межі браузера."
            en: "**Offline** is switched on in DevTools. The request does not leave the browser."
        - from: panel
          to: code
          label: "TypeError: Failed to fetch"
          kind: return
          note: { uk: "Network: (failed) · гілка: network-error", en: "Network: (failed) · branch: network-error" }
          caption:
            uk: "Рядок `(failed)`, статусу немає. `fetch` **відхиляється** з `TypeError` — збій мережі."
            en: "Row `(failed)`, no status. `fetch` **rejects** with a `TypeError` — a network failure."
        - from: code
          to: panel
          label: "controller.abort()"
          caption:
            uk: "Код сам скасовує запит через `AbortController` за 100 мс."
            en: "The code itself cancels the request through an `AbortController` after 100 ms."
        - from: panel
          to: code
          label: "AbortError"
          kind: return
          note: { uk: "Network: (canceled) · гілка: aborted", en: "Network: (canceled) · branch: aborted" }
          caption:
            uk: "Рядок `(canceled)`, помилка `AbortError`. Це рішення коду, а не збій: повідомлення про помилку тут зайве."
            en: "Row `(canceled)`, the error `AbortError`. This is the code’s own decision, not a failure: an error message is out of place here."

  - id: network-lab
    kind: example
    runtime: browser-js
    dir: network-lab
    entry: index.html
    capabilities: { network: lab }
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Звички з сервера фікстур", en: "Habits from the fixture server" }
      loadButton: { uk: "Завантажити", en: "Load" }
      missingButton: { uk: "Неіснуючий запис", en: "Missing record" }
      brokenButton: { uk: "Помилка сервера", en: "Server error" }
      slowButton: { uk: "Повільний сервер", en: "Slow server" }
      cancelButton: { uk: "Скасувати за 100 мс", en: "Cancel after 100 ms" }
      idle: { uk: "Натисни кнопку, щоб завантажити звички.", en: "Press a button to load the habits." }
      loading: { uk: "Завантаження…", en: "Loading…" }
      loaded: { uk: "Звичок:", en: "Habits:" }
      httpError: { uk: "Сервер не зміг відповісти. Спробуй пізніше.", en: "The server could not answer. Try again later." }
      networkError: { uk: "Немає з’єднання. Перевір інтернет.", en: "No connection. Check your internet." }
      timeout: { uk: "Сервер не відповідає надто довго.", en: "The server is taking too long to answer." }
      aborted: { uk: "Завантаження скасовано.", en: "Loading cancelled." }
    title:
      uk: "П’ять запитів і панель Network"
      en: "Five requests and the Network panel"
    body:
      uk: |
        Кожна кнопка робить справжній запит до сервера фікстур. «Повільний сервер» просить сервер почекати 2,5 с, а код чекає щонайбільше 2 с. `AbortSignal.any([a, b])` — сигнал, який спрацьовує, щойно спрацює будь-який із двох: тут кнопка скасування або тайм-аут.

        Запусти, відкрий DevTools → **Network** і натискай кнопки на вкладці **Сторінка**. Порівнюй рядок на панелі з тим, що надрукував код у консолі.
      en: |
        Each button makes a real request to the fixture server. “Slow server” asks the server to wait 2.5 s, while the code waits 2 s at most. `AbortSignal.any([a, b])` is a signal that fires as soon as either of the two fires: here the cancel button or the timeout.

        Run it, open DevTools → **Network** and press the buttons on the **Page** tab. Compare the row in the panel with what the code printed in the console.
    tryIt:
      uk: |
        1. Натисни «Неіснуючий запис» і клацни рядок `h-99` на панелі: **Headers** показує `404` і `Content-Type`, **Preview** — тіло помилки, **Initiator** — файл коду.
        2. Натисни «Повільний сервер» і «Скасувати за 100 мс»: обидва рядки — `(canceled)`, але в консолі різні назви помилок.
        3. Офлайн. **Спершу** запусти приклад, **потім** у панелі Network обери **Offline** і натисни «Завантажити» на сторінці (а не «Запустити»: запуск теж завантажує пісочницю через мережу і в режимі Offline не вдасться). Очікувано — рядок `(failed)` і «Немає з’єднання». Якщо список однаково завантажився, твій Chrome не застосовує умови мережі до окремого вікна пісочниці — тоді повтори цей крок на сторінці `http://127.0.0.1:5173/` з уроку про cookie, виконавши в її Console `await fetch("/")`. Не забудь повернути **No throttling**.
        4. Обери повільний профіль (наприклад, **Slow 4G** чи **3G**) і натисни «Завантажити»: у стовпчику Time видно, наскільки довшим став запит. Якщо час не змінився, твій Chrome не сповільнює окреме вікно пісочниці, як і в кроці 3, — повтори на сторінці `http://127.0.0.1:5173/`. Потім поверни **No throttling**.
      en: |
        1. Press “Missing record” and click the `h-99` row in the panel: **Headers** shows `404` and the `Content-Type`, **Preview** the error body, **Initiator** the code file.
        2. Press “Slow server” and “Cancel after 100 ms”: both rows say `(canceled)`, but the console shows different error names.
        3. Offline. **First** run the example, **then** choose **Offline** in the Network panel and press “Load” on the page (not “Run”: running also loads the sandbox over the network and fails while Offline). Expected: a `(failed)` row and “No connection”. If the list loads anyway, your Chrome does not apply network conditions to the sandbox’s separate frame — then repeat this step on the page `http://127.0.0.1:5173/` from the cookies lesson by running `await fetch("/")` in its Console. Remember to switch back to **No throttling**.
        4. Choose a slow profile (for example **Slow 4G** or **3G**) and press “Load”: the Time column shows how much longer the request took. If the time does not change, your Chrome does not slow down the sandbox’s separate frame, as in step 3 — repeat on the page `http://127.0.0.1:5173/`. Then switch back to **No throttling**.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: скасування застарілого запиту"
      en: "Recall: cancelling a stale request"
    items:
      - id: aborted-name
        from: js-08-09-cancellation-abort
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const controller = new AbortController();
          controller.abort();
          try {
            await fetch("./data/habits.json", { signal: controller.signal });
            console.log("loaded");
          } catch (error) {
            console.log(error.name);
          }
        verify:
          logs: ["AbortError"]
        answer:
          type: choice
          options:
            - id: abort
              text: { uk: "`AbortError`", en: "`AbortError`" }
            - id: loaded
              text: { uk: "`loaded`: `abort()` викликано ще до запиту", en: "`loaded`: `abort()` was called before the request" }
              why:
                uk: "Сигнал, уже скасований на момент виклику, змушує `fetch` відхилитися одразу, навіть не надсилаючи запиту."
                en: "A signal that is already aborted when `fetch` is called makes it reject at once, without even sending the request."
            - id: type
              text: { uk: "`TypeError`", en: "`TypeError`" }
              why:
                uk: "`TypeError` означає збій мережі. Скасування має власну назву — `AbortError`, і саме за нею код відрізняє «скасовано» від «немає мережі»."
                en: "A `TypeError` means a network failure. A cancellation has its own name — `AbortError` — and that is how code tells “cancelled” from “no network”."
          correct: [abort]
        explanation:
          uk: "Скасований сигнал відхиляє `fetch` з `DOMException` на ім’я `AbortError`. Застарілий запит скасовують навмисно, тож цю помилку зазвичай не показують людині як збій."
          en: "An aborted signal rejects `fetch` with a `DOMException` named `AbortError`. A stale request is cancelled on purpose, so this error is usually not shown to the person as a failure."

  - id: classify
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: classify
    entry: index.html
    editable: [index.js]
    capabilities: { network: lab }
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Звички", en: "Habits" }
      loaded: { uk: "Звичок:", en: "Habits:" }
      httpError: { uk: "Сервер не зміг відповісти. Спробуй пізніше.", en: "The server could not answer. Try again later." }
      networkError: { uk: "Немає з’єднання. Перевір інтернет.", en: "No connection. Check your internet." }
      timeout: { uk: "Сервер не відповідає надто довго.", en: "The server is taking too long to answer." }
      aborted: { uk: "Завантаження скасовано.", en: "Loading cancelled." }
      invalidJson: { uk: "Сервер надіслав не ті дані.", en: "The server sent the wrong kind of data." }
    title:
      uk: "classifyFailure: п’ять видів збою"
      en: "classifyFailure: five kinds of failure"
    instructions:
      uk: |
        Готова функція `attempt(url, { signal })` у файлі `attempt.js` виконує одне завантаження й повертає, що сталося, нічого не вирішуючи: `{ response, data }`, `{ response }`, `{ response, error }` чи `{ error }` (подробиці — у коментарі над нею).

        У `index.js` допиши дві функції:

        1. `classifyFailure(outcome)` повертає вид збою: `"http-error"`, `"network-error"`, `"timeout"`, `"aborted"` чи `"invalid-json"`, — або `null`, якщо завантаження вдалося.
        2. `showOutcome(outcome)` пише в `#status` повідомлення з `MESSAGES` для збою (для `"http-error"` — ще й статус у дужках, наприклад `… (404)`) або «Звичок: N» для успіху, де N — `data.items.length`.

        Перевірки підставлять справжні об’єкти `Response` і помилки, а також завантаження через `attempt` із підробленим сервером.
      en: |
        The ready function `attempt(url, { signal })` in the file `attempt.js` runs one load and returns what happened without deciding anything: `{ response, data }`, `{ response }`, `{ response, error }` or `{ error }` (the details are in the comment above it).

        In `index.js` complete two functions:

        1. `classifyFailure(outcome)` returns the kind of failure: `"http-error"`, `"network-error"`, `"timeout"`, `"aborted"` or `"invalid-json"` — or `null` when the load succeeded.
        2. `showOutcome(outcome)` writes into `#status` the message from `MESSAGES` for a failure (for `"http-error"` also the status in brackets, for example `… (404)`) or “Habits: N” for a success, where N is `data.items.length`.

        The checks put in real `Response` objects and errors, and also loads through `attempt` with a fake server.
    testTitles:
      "a response that is not ok is an http-error":
        uk: "Відповідь не `ok` — `http-error`"
        en: "A response that is not `ok` is an `http-error`"
      "a fetch rejected with TypeError is a network-error":
        uk: "`fetch`, відхилений із `TypeError`, — `network-error`"
        en: "A `fetch` rejected with `TypeError` is a `network-error`"
      "a TimeoutError is a timeout and an AbortError is aborted":
        uk: "`TimeoutError` — `timeout`, а `AbortError` — `aborted`"
        en: "A `TimeoutError` is a `timeout` and an `AbortError` is `aborted`"
      "an ok response whose body is not JSON is invalid-json":
        uk: "Відповідь `ok`, чиє тіло не JSON, — `invalid-json`"
        en: "An `ok` response whose body is not JSON is `invalid-json`"
      "a successful load is not a failure":
        uk: "Вдале завантаження — не збій (`null`)"
        en: "A successful load is not a failure (`null`)"
      "classifies real outcomes of attempt()":
        uk: "Класифікує справжні результати `attempt()`"
        en: "Classifies real outcomes of `attempt()`"
      "shows a distinct message for each failure and the count for a success":
        uk: "Показує окреме повідомлення для кожного збою й кількість для успіху"
        en: "Shows a distinct message for each failure and the count for a success"
    hints:
      nudge:
        uk: "Спершу подивись, **що** є в результаті: лише `error`, лише `response` чи обидва. А серед помилок без відповіді розрізняй за `error.name`."
        en: "First look at **what** the outcome holds: only `error`, only `response`, or both. And among errors without a response, tell them apart by `error.name`."
      explanation:
        uk: "Якщо є `response` і `error`, відповідь прийшла, але тіло не розібралося. Якщо є лише `error`, `fetch` не отримав відповіді: назви `AbortError` і `TimeoutError` кажуть, що запит перервав сигнал, а все інше — збій мережі. Перевіряй назви раніше за загальний випадок: `instanceof Error` правдиве для них усіх. Якщо є лише `response`, дивись на `ok`."
        en: "If there are both `response` and `error`, the answer arrived but the body did not parse. If there is only `error`, `fetch` got no answer: the names `AbortError` and `TimeoutError` say a signal broke the request off, and anything else is a network failure. Check the names before the general case: `instanceof Error` is true for all of them. If there is only `response`, look at `ok`."
    solutionNote:
      uk: "Вид збою визначає те, що є в результаті, і назва помилки: відповідь не `ok` — HTTP-помилка; відповідь `ok` із помилкою — тіло не JSON; помилка без відповіді — збій мережі, тайм-аут чи скасування, які розрізняє `error.name`. Кожен вид має своє повідомлення, бо людині в кожному випадку треба робити інше."
      en: "The kind of failure is decided by what the outcome holds and by the error’s name: a response that is not `ok` is an HTTP error; an `ok` response with an error is a body that is not JSON; an error without a response is a network failure, a timeout or a cancellation, told apart by `error.name`. Each kind has its own message, because the person has to do something different in each case."
    feedback:
      - when: { test: "a response that is not ok is an http-error" }
        message:
          uk: "Ця перевірка передає `{ response }` зі статусом `404`, потім `500`, і очікує `\"http-error\"`."
          en: "This check passes `{ response }` with status `404`, then `500`, and expects `\"http-error\"`."
      - when: { test: "a fetch rejected with TypeError is a network-error" }
        message:
          uk: "Ця перевірка передає `{ error }` із `TypeError: Failed to fetch` і без `response` та очікує `\"network-error\"`."
          en: "This check passes `{ error }` with `TypeError: Failed to fetch` and no `response`, and expects `\"network-error\"`."
      - when: { test: "a TimeoutError is a timeout and an AbortError is aborted" }
        message:
          uk: "Ця перевірка очікує `\"timeout\"` для помилки з назвою `TimeoutError` і `\"aborted\"` для `AbortError`. Якщо бачиш `\"network-error\"`, загальний випадок перевіряється раніше за назви."
          en: "This check expects `\"timeout\"` for an error named `TimeoutError` and `\"aborted\"` for `AbortError`. If you see `\"network-error\"`, the general case is checked before the names."
      - when: { test: "an ok response whose body is not JSON is invalid-json" }
        message:
          uk: "Ця перевірка передає `{ response, error }` — відповідь `200` і `SyntaxError` — та очікує `\"invalid-json\"`."
          en: "This check passes `{ response, error }` — a `200` response and a `SyntaxError` — and expects `\"invalid-json\"`."
      - when: { test: "a successful load is not a failure" }
        message:
          uk: "Ця перевірка передає `{ response, data }` з відповіддю `200` і очікує `null`."
          en: "This check passes `{ response, data }` with a `200` response and expects `null`."
      - when: { test: "classifies real outcomes of attempt()" }
        message:
          uk: "Ця перевірка завантажує через `attempt` відповіді `503`, збій мережі, зіпсоване тіло, скасування й тайм-аут і очікує по черзі `http-error`, `network-error`, `invalid-json`, `aborted`, `timeout`."
          en: "This check loads, through `attempt`, a `503` answer, a network failure, a broken body, a cancellation and a timeout, and expects `http-error`, `network-error`, `invalid-json`, `aborted` and `timeout` in turn."
      - when: { test: "shows a distinct message for each failure and the count for a success" }
        message:
          uk: "Ця перевірка викликає `showOutcome` для кожного виду збою й для успіху з трьома звичками та читає `#status`: текст із `MESSAGES` (для `http-error` — зі статусом у дужках) і «Звичок: 3»."
          en: "This check calls `showOutcome` for every kind of failure and for a success with three habits and reads `#status`: the text from `MESSAGES` (with the status in brackets for `http-error`) and “Habits: 3”."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` означає, що значення має не той тип, на який розраховує код. `Cannot read properties of undefined (reading 'ok')` — у результаті немає `response`: перевір спершу, що саме в ньому є. Якщо всі перевірки впали разом, програма зупинилася ще під час завантаження — спершу виправ першу помилку в консолі."
          en: "A `TypeError` means a value has a different type than the code expects. `Cannot read properties of undefined (reading 'ok')` — the outcome has no `response`: first check what it actually holds. If every check fails at once, the program stopped while loading — first fix the first error in the console."

  - id: to-project
    kind: transfer
    capstoneStep: JS-16
    body:
      uk: "У кроці проєкту перевірки підмінять `fetch` і подадуть твоїй сторінці кожен вид збою: мережевий збій, статус `500`, скасування. Повторити варто лише перший — коли відповіді не було зовсім. Тримай панель Network відкритою: вона скаже, чи відповів сервер, ще до того, як ти почнеш шукати помилку в коді."
      en: "In the project step the checks will replace `fetch` and give your page each kind of failure: a network failure, the status `500`, an abort. Only the first one is worth a retry — when there was no answer at all. Keep the Network panel open: it tells you whether the server answered before you start looking for a bug in the code."
