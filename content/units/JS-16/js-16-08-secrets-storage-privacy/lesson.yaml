id: js-16-08-secrets-storage-privacy
unit: JS-16
title:
  uk: "Жодних секретів у бандлі; сховище та приватність"
  en: "No secrets in the bundle; storage and privacy"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Показати, що ключ, токен чи значення env, які читає клієнтський код, можна прочитати в готовому bundle, і сказати, де має жити справжній секрет."
    en: "Show that a key, token or env value read by client code is readable in the shipped bundle, and say where a real secret must live instead."
  - uk: "Для кожного значення, яке тримає проєкт, вирішити, чи належить воно до `localStorage`, `sessionStorage`, cookie чи нікуди, і дати людині спосіб його стерти."
    en: "Decide for each value the capstone keeps whether it belongs in `localStorage`, `sessionStorage`, a cookie or nowhere, and give the user a way to clear it."
prerequisites: [js-16-07-xss-safe-sinks, js-15-06-build-env-sourcemaps]
subskills:
  - { family: W-05, skill: "no secret in client bundle", depth: intro }
  - { family: W-05, skill: "storage/privacy", depth: intro }
glossary: [client-side-secret, data-minimization, personal-data]
selfCheck: [predict-minified, storage-inventory]

blocks:
  - id: everything-ships
    kind: explanation
    title:
      uk: "Усе, що читає браузер, отримує кожен відвідувач"
      en: "Everything the browser reads, every visitor gets"
    body:
      uk: |
        Щоб сторінка працювала, браузер завантажує весь її JavaScript. Тож усе, що читає клієнтський код, — константа, значення з `.env`, вписане через `define` під час збирання, — лежить у тексті [[bundle]], і будь-хто може його відкрити.

        - **Мініфікація** перейменовує змінні (`total` → `o`), але текст у лапках лишається як є.
        - **Обфускація** заплутує код, але браузер мусить його виконати — отже, значення там є.
        - **Вимкнені source maps** ховають лише твої вихідні файли, а не сам bundle.

        Тому [[client-side-secret|секрет у клієнтському коді]] — це не секрет. Справжній ключ до платного API живе на **сервері**: у змінних середовища серверного процесу. Сторінка звертається до *твого* сервера (`/api/rates`), а вже він додає ключ і робить запит. Серверну частину ти писатимеш на етапі Node.js; поки що правило таке: ключ у браузер не потрапляє.
      en: |
        For a page to work, the browser downloads all of its JavaScript. So everything client code reads — a constant, a value from `.env` written in with `define` during the build — lies in the text of the [[bundle]], and anyone can open it.

        - **Minification** renames variables (`total` → `o`), but text in quotes stays as it is.
        - **Obfuscation** tangles the code, but the browser has to run it — so the value is in there.
        - **Turning source maps off** hides only your source files, not the bundle itself.

        So a [[client-side-secret|secret in client code]] is not a secret. A real key to a paid API lives on a **server**: in the environment variables of the server process. The page calls *your* server (`/api/rates`), and that server adds the key and makes the request. You will write the server part in the Node.js stage; for now the rule is: the key does not reach the browser.

  - id: predict-minified
    kind: prediction
    prompt:
      uk: "У `.env` записано `RATES_API_KEY=demo-7Q2X-not-a-real-key`. `build.mjs` вписує його через `define`, клієнтський код будує адресу `https://rates.example/latest?key=${RATES_API_KEY}`. Збірка мініфікує код, а source map на сайт не викладено. Чи може відвідувач дізнатися ключ?"
      en: "`.env` holds `RATES_API_KEY=demo-7Q2X-not-a-real-key`. `build.mjs` writes it in with `define`, and the client code builds the address `https://rates.example/latest?key=${RATES_API_KEY}`. The build minifies the code, and no source map is put on the site. Can a visitor find out the key?"
    answer:
      type: choice
      options:
        - id: yes
          text:
            uk: "Так: значення стоїть у тексті `app.js`, і браузер його завантажує"
            en: "Yes: the value is in the text of `app.js`, and the browser downloads it"
        - id: env-private
          text:
            uk: "Ні: `.env` лишився на моєму комп’ютері"
            en: "No: `.env` stayed on my computer"
          why:
            uk: "Файл лишився, а **значення** під час збирання стало частиною `app.js`. Відвідувач отримує саме `app.js`."
            en: "The file stayed, but its **value** became part of `app.js` during the build. What the visitor gets is exactly `app.js`."
        - id: minified
          text:
            uk: "Ні: мініфікація перетворила код на нечитабельний"
            en: "No: minification made the code unreadable"
          why:
            uk: "Мініфікація скорочує назви змінних, а текст у лапках — адресу з ключем — лишає як є. Його знаходить звичайний пошук."
            en: "Minification shortens variable names but leaves text in quotes — the address with the key — as it is. A plain search finds it."
        - id: no-map
          text:
            uk: "Лише з source map, а її на сайті немає"
            en: "Only with the source map, and it is not on the site"
          why:
            uk: "Source map показує вихідні файли, у яких, до речі, ключа немає — там лише назва `RATES_API_KEY`. Сам ключ — у bundle."
            en: "A source map shows the source files, which, by the way, do not hold the key — just the name `RATES_API_KEY`. The key itself is in the bundle."
      correct: [yes]
    explanation:
      uk: "`define` замінює назву `RATES_API_KEY` на текст значення, і після мініфікації в `app.js` лишається текст у лапках `\"https://rates.example/latest?key=demo-7Q2X-not-a-real-key\"`. Його можна знайти пошуком у вкладці Sources чи будь-яким переглядачем тексту. Перевір у прикладі цього уроку."
      en: "`define` replaces the name `RATES_API_KEY` with the value’s text, and after minification `app.js` still holds the string `\"https://rates.example/latest?key=demo-7Q2X-not-a-real-key\"`. It can be found with a search in the Sources tab or with any text viewer. Check it in this lesson’s example."

  - id: shipped-key
    kind: example
    runtime: browser-js
    dir: shipped-key
    entry: index.js
    strings:
      shippedSize: { uk: "символів у dist/app.js:", en: "characters in dist/app.js:" }
      foundKey: { uk: "знайдений ключ:", en: "key found:" }
      nothingFound: { uk: "нічого", en: "nothing" }
    title:
      uk: "Що бачить відвідувач у готовому bundle"
      en: "What a visitor sees in the shipped bundle"
    body:
      uk: |
        `dist/app.js` — справжній результат збирача esbuild для `money-lab` з `minify: true` і без source map, а `src/main.mjs` (разом із `money.mjs`, який він імпортує) — код, з якого його зібрано. `index.js` робить те, що може будь-який відвідувач: завантажує `dist/app.js` як текст і шукає в ньому `key=`.
      en: |
        `dist/app.js` is the real output of the esbuild bundler for `money-lab` with `minify: true` and no source map, and `src/main.mjs` (with `money.mjs`, which it imports) is the code it was built from. `index.js` does what any visitor can do: it downloads `dist/app.js` as text and searches it for `key=`.
    tryIt:
      uk: |
        1. Відкрий `dist/app.js` у редакторі. Назви функцій стали `o` і `r`, але адреса з ключем — у лапках, як була.
        2. Відкрий `src/main.mjs`: тут ключа немає зовсім, лише назва `RATES_API_KEY`. Значення додав збирач.
        3. Уяви, що ключ перенесли на сервер: у `dist/app.js` заміни всю адресу в лапках на `/api/rates` — запит до твого власного сервера, який сам додасть ключ. Запусти: «знайдений ключ: нічого».
      en: |
        1. Open `dist/app.js` in the editor. The function names became `o` and `r`, but the address with the key is in quotes, as it was.
        2. Open `src/main.mjs`: there is no key here at all, just the name `RATES_API_KEY`. The bundler added the value.
        3. Imagine the key was moved to a server: in `dist/app.js` replace the whole quoted address with `/api/rates` — a request to your own server, which adds the key itself. Run: “key found: nothing”.

  - id: privacy
    kind: explanation
    title:
      uk: "Що зберігати, де і як довго"
      en: "What to keep, where and for how long"
    body:
      uk: |
        Те, що сторінка зберігає в браузері, — теж не сейф: `localStorage` читає будь-який скрипт того самого origin (а при XSS — і чужий), він живе без терміну й доступний кожному, хто сидить за цим комп’ютером. Звідси три правила:

        - [[data-minimization|Мінімізація даних]]: зберігай лише те, без чого функція не працює. Список справ — так; ім’я, email чи номер телефону для «привітання» — ні. Такі [[personal-data|персональні дані]] не беруть без потреби.
        - **Вибір сховища за часом життя:** записи — `localStorage`; чернетка, потрібна лише в цій вкладці, — `sessionStorage`; паролі, токени й ключі — **нікуди** в клієнтському сховищі; cookie — лише для того, що потрібно серверу, найкраще з `HttpOnly`.
        - **Кнопка «Стерти мої дані»**, яка прибирає рівно твої ключі. Не `localStorage.clear()`: на тому самому origin можуть жити інші застосунки, наприклад інший проєкт курсу на тому самому порту.
      en: |
        What a page keeps in the browser is not a safe either: any script of the same origin (and, with XSS, a foreign one) reads `localStorage`, it never expires, and it is available to anyone sitting at this computer. Hence three rules:

        - [[data-minimization]]: keep only what the feature cannot work without. The task list — yes; a name, an email or a phone number for a “greeting” — no. Such [[personal-data]] is not collected without a need.
        - **Choose the storage by lifetime:** records — `localStorage`; a draft needed only in this tab — `sessionStorage`; passwords, tokens and keys — **nowhere** in client storage; cookies — only for what the server needs, best with `HttpOnly`.
        - **A “Clear my data” button** that removes exactly your keys. Not `localStorage.clear()`: other apps may live on the same origin, for example another course project on the same port.

  - id: leak-and-clean
    kind: local-task
    runtime: local-web
    title:
      uk: "Ключ у збірці: знайти й прибрати"
      en: "A key in the build: find it and remove it"
    intro:
      uk: |
        Ти навмисно пустиш синтетичний ключ у клієнтський код `money-lab` (проєкт з уроку про збирання), знайдеш його в `dist` і прибереш. Ключ вигаданий: `demo-7Q2X-not-a-real-key`. Перевірено в macOS із Node.js v25.2.1, npm 11.6.2 і esbuild 0.28.2 на файлах `money-lab` з того уроку; команди пошуку для Windows PowerShell не перевірялися на справжній Windows.

        **Крок 1 — другий рядок `.env`:**

        ```text
        RATES_API_KEY=demo-7Q2X-not-a-real-key
        ```

        **Крок 2 — `build.mjs`**, замість рядка з `define`:

        ```js
          define: {
            APP_TITLE: JSON.stringify(title),
            RATES_API_KEY: JSON.stringify(process.env.RATES_API_KEY ?? ""),
          },
        ```

        **Крок 2 — `src/main.mjs`**, у кінець файла:

        ```js
        const ratesUrl = `https://rates.example/latest?key=${RATES_API_KEY}`;
        console.log("Rates request prepared:", ratesUrl.length, "characters");
        ```
      en: |
        You will deliberately let a synthetic key into the client code of `money-lab` (the project from the build lesson), find it in `dist` and remove it. The key is made up: `demo-7Q2X-not-a-real-key`. Checked on macOS with Node.js v25.2.1, npm 11.6.2 and esbuild 0.28.2 on the `money-lab` files from that lesson; the search commands for Windows PowerShell were not checked on a real Windows machine.

        **Step 1 — the second line of `.env`:**

        ```text
        RATES_API_KEY=demo-7Q2X-not-a-real-key
        ```

        **Step 2 — `build.mjs`**, instead of the line with `define`:

        ```js
          define: {
            APP_TITLE: JSON.stringify(title),
            RATES_API_KEY: JSON.stringify(process.env.RATES_API_KEY ?? ""),
          },
        ```

        **Step 2 — `src/main.mjs`**, at the end of the file:

        ```js
        const ratesUrl = `https://rates.example/latest?key=${RATES_API_KEY}`;
        console.log("Rates request prepared:", ratesUrl.length, "characters");
        ```
    tools:
      - { name: "Node.js", version: { uk: "22.13 або новіший (для --env-file-if-exists)", en: "22.13 or newer (for --env-file-if-exists)" } }
      - { name: "esbuild", version: { uk: "0.28 (уже є в money-lab)", en: "0.28 (already in money-lab)" } }
      - { name: { uk: "Редактор коду", en: "A code editor" }, version: { uk: "VS Code або будь-який редактор простого тексту", en: "VS Code or any plain-text editor" } }
    steps:
      - text:
          uk: "У `money-lab` додай у файл `.env` другий рядок — «Крок 1» зі вступу (перший рядок, `APP_TITLE=Family budget`, лишився з уроку про збирання)."
          en: "In `money-lab` add a second line to the `.env` file — “Step 1” from the introduction (the first line, `APP_TITLE=Family budget`, is left from the build lesson)."
      - text:
          uk: "У `build.mjs` заміни рядок із `define` блоком «Крок 2 — `build.mjs`» зі вступу, а в кінець `src/main.mjs` додай два рядки «Крок 2 — `src/main.mjs`»."
          en: "In `build.mjs` replace the line with `define` with the block “Step 2 — `build.mjs`” from the introduction, and add the two lines “Step 2 — `src/main.mjs`” to the end of `src/main.mjs`."
      - text:
          uk: "Збери проєкт."
          en: "Build the project."
        command: "cd ~/js-course/money-lab\nnpm run build"
        expect:
          uk: "`Built dist/app.js with APP_TITLE = Family budget`."
          en: "`Built dist/app.js with APP_TITLE = Family budget`."
      - text:
          uk: "Пошукай ключ у результаті збирання. У macOS і Linux:"
          en: "Search the build output for the key. On macOS and Linux:"
        command: "grep -rl \"demo-7Q2X\" dist"
        expect:
          uk: "`dist/app.js`. У Windows PowerShell те саме робить `Select-String -Path dist\\* -Pattern \"demo-7Q2X\" -List` (рядок починається з `dist\\app.js:1:`). Відкрий `dist/app.js`: у мініфікованому рядку видно `\"https://rates.example/latest?key=demo-7Q2X-not-a-real-key\"`. У `dist/app.js.map` ключа немає — там лише назва `RATES_API_KEY`."
          en: "`dist/app.js`. In Windows PowerShell `Select-String -Path dist\\* -Pattern \"demo-7Q2X\" -List` does the same (the line starts with `dist\\app.js:1:`). Open `dist/app.js`: the minified line shows `\"https://rates.example/latest?key=demo-7Q2X-not-a-real-key\"`. `dist/app.js.map` has no key — only the name `RATES_API_KEY`."
      - text:
          uk: "Тепер прибери ключ: видали два додані рядки з кінця `src/main.mjs`, рядок `RATES_API_KEY: …` з `define` у `build.mjs` і рядок `RATES_API_KEY=…` з `.env`. Збери знову й повтори пошук."
          en: "Now remove the key: delete the two added lines at the end of `src/main.mjs`, the `RATES_API_KEY: …` line in `define` in `build.mjs`, and the `RATES_API_KEY=…` line in `.env`. Build again and repeat the search."
        command: "npm run build\ngrep -rl \"demo-7Q2X\" dist"
        expect:
          uk: "`Built dist/app.js with APP_TITLE = Family budget`, а пошук нічого не друкує: ключа в `dist` більше немає. (`Select-String` у PowerShell теж нічого не виведе.)"
          en: "`Built dist/app.js with APP_TITLE = Family budget`, and the search prints nothing: the key is no longer in `dist`. (`Select-String` in PowerShell prints nothing either.)"
      - text:
          uk: "Переконайся, що `.env` не потрапить у Git: його має закривати `.gitignore` з уроку про збирання."
          en: "Make sure `.env` will not get into Git: the `.gitignore` from the build lesson should cover it."
        command: "cat .gitignore"
        expect:
          uk: "Три рядки: `node_modules/`, `dist/` і `.env`. (`cat` працює і в PowerShell.)"
          en: "Three lines: `node_modules/`, `dist/` and `.env`. (`cat` works in PowerShell too.)"
    verify:
      - id: found
        text:
          uk: "Пошук знайшов ключ у `dist/app.js`, хоча код мініфіковано."
          en: "The search found the key in `dist/app.js`, although the code is minified."
      - id: removed
        text:
          uk: "Після того як я прибрав ключ із коду, `define` і `.env` та зібрав заново, пошук нічого не знайшов."
          en: "After I removed the key from the code, `define` and `.env` and built again, the search found nothing."
    troubleshooting:
      - problem:
          uk: "Після прибирання сторінка падає з `ReferenceError: RATES_API_KEY is not defined`"
          en: "After the removal the page fails with `ReferenceError: RATES_API_KEY is not defined`"
        fix:
          uk: "Ти прибрав рядок із `define`, а використання в `src/main.mjs` лишилося — збирач не мав чим замінити назву. Видали й два рядки в `src/main.mjs` і збери знову."
          en: "You removed the line from `define`, but the use in `src/main.mjs` stayed — the bundler had nothing to replace the name with. Delete the two lines in `src/main.mjs` as well and build again."
      - problem:
          uk: "Пошук і далі знаходить ключ"
          en: "The search still finds the key"
        fix:
          uk: "Перевір, що `npm run build` справді запустився після змін (рядок `Built dist/app.js …`), і що в `src/main.mjs` не лишилося адреси з ключем, вписаним прямо в текст."
          en: "Check that `npm run build` really ran after the changes (the `Built dist/app.js …` line), and that `src/main.mjs` has no address with the key typed straight into the text."
      - problem:
          uk: "`.env` з’явився в `git status`"
          en: "`.env` shows up in `git status`"
        fix:
          uk: "Додай рядок `.env` у `.gitignore` і не роби commit цього файла. Якщо справжній ключ колись потрапив у commit, вважай його розкритим: відклич ключ у сервісі й отримай новий — видалення з історії вже не допоможе тим, хто встиг її скопіювати."
          en: "Add a `.env` line to `.gitignore` and do not commit the file. If a real key ever got into a commit, treat it as exposed: revoke the key in the service and get a new one — removing it from history no longer helps against anyone who already copied it."
    recovery:
      uk: "Усі зміни — кілька рядків у `.env`, `build.mjs` і `src/main.mjs`; блоки коду у вступі показують, що саме додано, тож прибрати їх можна вручну. Після прибирання `npm run build` повертає `dist` до стану з уроку про збирання."
      en: "All the changes are a few lines in `.env`, `build.mjs` and `src/main.mjs`; the code blocks in the introduction show exactly what was added, so it can be removed by hand. After the removal `npm run build` brings `dist` back to its state from the build lesson."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: значення env у збірці"
      en: "Recall: env values in a build"
    items:
      - id: rebuild
        from: js-15-06-build-env-sourcemaps
        prompt:
          uk: "Ти змінив у `.env` значення `APP_TITLE` і оновив сторінку `dist/index.html`, але заголовок старий. Чому?"
          en: "You changed `APP_TITLE` in `.env` and reloaded the page `dist/index.html`, but the heading is the old one. Why?"
        answer:
          type: choice
          options:
            - id: baked
              text: { uk: "Значення вписано в `dist/app.js` під час збирання; треба зібрати знову", en: "The value was written into `dist/app.js` during the build; build again" }
            - id: cache
              text: { uk: "Браузер читає `.env` лише раз на день", en: "The browser reads `.env` only once a day" }
              why:
                uk: "Браузер `.env` не читає взагалі: його читає Node.js під час `npm run build`."
                en: "The browser never reads `.env`: Node.js reads it during `npm run build`."
            - id: server
              text: { uk: "Сервер `npm run serve` треба перезапустити, щоб він прочитав `.env`", en: "The `npm run serve` server has to be restarted to read `.env`" }
              why:
                uk: "Сервер лише віддає готові файли з `dist`. Нове значення з’явиться там тільки після нового збирання."
                en: "The server only hands out the ready files from `dist`. The new value appears there only after a new build."
          correct: [baked]
        explanation:
          uk: "`define` підставляє значення в текст bundle під час збирання. Саме тому все, що клієнтський код отримує з env, опиняється в публічному файлі — і саме тому секретам там не місце."
          en: "`define` puts the value into the bundle’s text during the build. That is exactly why everything client code gets from env ends up in a public file — and why secrets have no place there."

  - id: storage-inventory
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: storage-inventory
    entry: index.html
    editable: [index.js]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Планувальник: мої дані", en: "Planner: my data" }
      privacyNote: { uk: "Справи, фільтр і чернетка зберігаються лише в цьому браузері.", en: "Tasks, the filter and the draft are kept only in this browser." }
      clearButton: { uk: "Стерти мої дані", en: "Clear my data" }
      cleared: { uk: "Дані планувальника стерто.", en: "The planner data has been cleared." }
      waterPlants: { uk: "Полити квіти", en: "Water the plants" }
      returnBooks: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      draft: { uk: "Записатися до стома", en: "Book a denti" }
    title:
      uk: "Інвентар сховища й clearAll"
      en: "A storage inventory and clearAll"
    instructions:
      uk: |
        У `planner.js` (лише для читання) — увесь код, яким планувальник щось зберігає в браузері.

        1. Заповни `STORAGE_INVENTORY`: один запис на кожен ключ — `key`, `storage` (`"localStorage"` чи `"sessionStorage"`), `holds` (що там лежить), `why` (навіщо застосунку) і `lifetime` (як довго живе). Останні три — коротким текстом своїми словами.
        2. Допиши `clearAll()`: прибирає рівно ключі планувальника, кожен зі свого сховища, і нічого більше. Кнопка «Стерти мої дані» вже викликає цю функцію.

        Перевірки додадуть у сховище дані інших застосунків на тому самому origin і переконаються, що вони вціліли.
      en: |
        `planner.js` (read-only) holds all the code with which the planner keeps anything in the browser.

        1. Fill in `STORAGE_INVENTORY`: one entry per key — `key`, `storage` (`"localStorage"` or `"sessionStorage"`), `holds` (what is stored there), `why` (what the app needs it for) and `lifetime` (how long it lives). The last three as short text in your own words.
        2. Complete `clearAll()`: it removes exactly the planner’s keys, each from its own storage, and nothing else. The “Clear my data” button already calls this function.

        The checks add data of other apps on the same origin to storage and make sure it survives.
    testTitles:
      "the inventory lists every key the planner keeps, with its storage":
        uk: "Інвентар перелічує кожен ключ планувальника з його сховищем"
        en: "The inventory lists every key the planner keeps, with its storage"
      "every inventory entry says what it holds, why and for how long":
        uk: "Кожен запис інвентаря каже, що там, навіщо й як довго"
        en: "Every inventory entry says what it holds, why and for how long"
      "clearAll removes every planner key from its storage":
        uk: "`clearAll` прибирає кожен ключ планувальника з його сховища"
        en: "`clearAll` removes every planner key from its storage"
      "clearAll keeps the data of other apps":
        uk: "`clearAll` не чіпає дані інших застосунків"
        en: "`clearAll` keeps the data of other apps"
      "the button clears the planner data and says so":
        uk: "Кнопка стирає дані планувальника й повідомляє про це"
        en: "The button clears the planner data and says so"
    hints:
      nudge:
        uk: "Прочитай `planner.js`: скільки там різних ключів і в якому сховищі лежить кожен? Інвентар — це просто таблиця з цих відповідей, а `clearAll` може пройти по ній."
        en: "Read `planner.js`: how many different keys are there, and which storage holds each one? The inventory is just a table of those answers, and `clearAll` can walk through it."
      explanation:
        uk: "Ключ видаляє `removeItem(key)` того сховища, де він лежить: `localStorage.removeItem(\"theme\")` прибере лише `theme`. А `clear()` прибирає **все** в сховищі цього origin — разом із даними інших застосунків. Якщо в кожному записі інвентаря є назва сховища, `clearAll` може вибрати потрібне сховище за нею."
        en: "A key is deleted by `removeItem(key)` of the storage that holds it: `localStorage.removeItem(\"theme\")` removes only `theme`. `clear()`, on the other hand, removes **everything** in that origin’s storage — the data of other apps included. If every inventory entry names its storage, `clearAll` can pick the right storage by that name."
    solutionNote:
      uk: "Інвентар — це документація, яку може прочитати й код: `clearAll` проходить по ній і прибирає кожен ключ із його сховища. Додаси новий ключ — допишеш рядок інвентаря, і кнопка стиратиме й його. `clear()` тут не годиться, бо стирає й чужі дані на тому самому origin."
      en: "The inventory is documentation that code can read too: `clearAll` walks through it and removes each key from its storage. Add a new key — add an inventory row, and the button clears that one as well. `clear()` does not do here, because it also wipes other apps’ data on the same origin."
    feedback:
      - when: { test: "the inventory lists every key the planner keeps, with its storage" }
        message:
          uk: "Ця перевірка очікує три записи: `jsll.planner.v1` і `jsll.planner.filter` у `\"localStorage\"` та `jsll.planner.draft` у `\"sessionStorage\"` — ні більше, ні менше."
          en: "This check expects three entries: `jsll.planner.v1` and `jsll.planner.filter` in `\"localStorage\"` and `jsll.planner.draft` in `\"sessionStorage\"` — no more, no fewer."
      - when: { test: "every inventory entry says what it holds, why and for how long" }
        message:
          uk: "Ця перевірка очікує рівно три записи, і в кожному — непорожній текст у `holds`, `why` і `lifetime`."
          en: "This check expects exactly three entries, each with non-empty text in `holds`, `why` and `lifetime`."
      - when: { test: "clearAll removes every planner key from its storage" }
        message:
          uk: "Ця перевірка очікує, що після `clearAll()` немає жодного з трьох ключів планувальника — і в `localStorage`, і в `sessionStorage`."
          en: "This check expects none of the three planner keys to remain after `clearAll()` — in `localStorage` as well as `sessionStorage`."
      - when: { test: "clearAll keeps the data of other apps" }
        message:
          uk: "Ця перевірка очікує, що після `clearAll()` ключі інших застосунків (`jsll.wishlist.v1`, `theme`, `jsll.wishlist.draft`) лишаються на місці. `clear()` прибирає й їх."
          en: "This check expects the keys of other apps (`jsll.wishlist.v1`, `theme`, `jsll.wishlist.draft`) to stay after `clearAll()`. `clear()` removes those too."
      - when: { test: "the button clears the planner data and says so" }
        message:
          uk: "Ця перевірка натискає «Стерти мої дані» й очікує, що ключів планувальника немає, а `#status` показує повідомлення про стирання."
          en: "This check presses “Clear my data” and expects the planner keys to be gone and `#status` to show the cleared message."

  - id: to-project
    kind: transfer
    capstoneStep: JS-16
    body:
      uk: "У кроці проєкту стартові дані завантажуються з файлу поруч зі сторінкою — жоден ключ чи токен для цього не потрібен, і в клієнтському коді його не буде. Перевірки подивляться, що в сховищі лишаються лише власні записи сторінки; а для своїх ключів ти вже вмієш скласти інвентар і дати людині кнопку, що стирає рівно їх."
      en: "In the project step the starting data is loaded from a file next to the page — no key or token is needed for that, and none will be in the client code. The checks will look that the storage holds only the page's own records; and for your own keys you already know how to write an inventory and give the person a button that clears exactly them."
