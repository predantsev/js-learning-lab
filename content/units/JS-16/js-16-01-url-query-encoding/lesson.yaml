id: js-16-01-url-query-encoding
unit: JS-16
title:
  uk: "URL, рядок запиту та кодування"
  en: "URLs, query strings and encoding"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Розкласти URL на схему, хост, порт, шлях, рядок запиту й фрагмент через URL API і сказати, які частини доходять до сервера."
    en: "Split a URL into scheme, host, port, path, query and fragment with the URL API and say which parts reach the server."
  - uk: "Зібрати рядок запиту через `URLSearchParams` і закодувати сегмент шляху через `encodeURIComponent`, щоб `&`, `#`, пробіли й кирилиця пройшли туди й назад без змін."
    en: "Build a query with `URLSearchParams` and encode a path segment with `encodeURIComponent` so `&`, `#`, spaces and Cyrillic text survive the round trip."
prerequisites: [js-08-06-fetch-basics, js-12-01-strings-unicode]
subskills:
  - { family: W-04, skill: "URL/query/encoding", depth: intro }
glossary: [query-string, percent-encoding, url-fragment]
selfCheck: [predict-glued, build-fixture-url]

blocks:
  - id: url-parts
    kind: explanation
    title:
      uk: "Шість частин адреси"
      en: "Six parts of an address"
    body:
      uk: |
        Адреса, яку ти передаєш у `fetch`, — не просто текст. Браузер розкладає її на частини, і об’єкт `URL` показує їх так само:

        ```js
        const url = new URL("http://localhost:5173/wishes?sort=price#w-02");
        url.protocol;  // "http:"        схема
        url.hostname;  // "localhost"    хост
        url.port;      // "5173"         порт
        url.pathname;  // "/wishes"      шлях
        url.search;    // "?sort=price"  рядок запиту
        url.hash;      // "#w-02"        фрагмент
        ```

        [[query-string|Рядок запиту]] — пари `назва=значення` після `?`, розділені `&`. Їх зручно читати через `url.searchParams.get("sort")`.

        [[url-fragment|Фрагмент]] — усе після `#`. Він потрібен лише сторінці (наприклад, щоб прокрутити до запису `w-02`) і **не надсилається** на сервер. Сервер отримує метод, шлях і рядок запиту.
      en: |
        The address you pass to `fetch` is not just text. The browser splits it into parts, and a `URL` object shows them the same way:

        ```js
        const url = new URL("http://localhost:5173/wishes?sort=price#w-02");
        url.protocol;  // "http:"        scheme
        url.hostname;  // "localhost"    host
        url.port;      // "5173"         port
        url.pathname;  // "/wishes"      path
        url.search;    // "?sort=price"  query string
        url.hash;      // "#w-02"        fragment
        ```

        The [[query-string]] is the `name=value` pairs after `?`, separated by `&`. They are easy to read with `url.searchParams.get("sort")`.

        The [[url-fragment|fragment]] is everything after `#`. Only the page needs it (for example, to scroll to the record `w-02`), and it is **not sent** to the server. The server receives the method, the path and the query string.

  - id: predict-parts
    kind: prediction
    strings:
      home: { uk: "Дім", en: "Home" }
    prompt:
      uk: "Які твердження про цю адресу правдиві? Обери всі."
      en: "Which statements about this address are true? Choose all that are."
    code: |
      const url = new URL("http://localhost:5173/wishes?category=%%home%%&sort=price#w-02");
      console.log(url.pathname);
      console.log(url.searchParams.get("category"));
      console.log(url.hash);
    verify:
      logs: ["/wishes", "%%home%%", "#w-02"]
    answer:
      type: multi
      options:
        - id: path
          text:
            uk: "`url.pathname` — `/wishes`, без рядка запиту"
            en: "`url.pathname` is `/wishes`, without the query string"
        - id: category
          text:
            uk: "`url.searchParams.get(\"category\")` дає слово таким, як його написано в адресі"
            en: "`url.searchParams.get(\"category\")` gives the word as it is written in the address"
        - id: hash
          text:
            uk: "`url.hash` — `#w-02`"
            en: "`url.hash` is `#w-02`"
        - id: hash-sent
          text:
            uk: "Запит `fetch(url)` донесе до сервера й `#w-02`"
            en: "A request `fetch(url)` carries `#w-02` to the server too"
          why:
            uk: "Фрагмент лишається в браузері: у запиті є лише шлях і рядок запиту. Сторінка читає його сама, через `location.hash`."
            en: "The fragment stays in the browser: the request holds only the path and the query string. The page reads it itself, through `location.hash`."
        - id: search-all
          text:
            uk: "`url.search` — це `?category=…&sort=price#w-02`"
            en: "`url.search` is `?category=…&sort=price#w-02`"
          why:
            uk: "Рядок запиту закінчується там, де починається `#`. Фрагмент — окрема частина, `url.hash`."
            en: "The query string ends where `#` begins. The fragment is a separate part, `url.hash`."
      correct: [path, category, hash]
    explanation:
      uk: "`URL` ділить адресу на частини: шлях без запиту, рядок запиту від `?` до `#` і фрагмент після `#`. `searchParams.get` повертає вже розкодоване значення. До сервера доходять шлях і рядок запиту, а фрагмент лишається сторінці."
      en: "`URL` splits the address into parts: the path without the query, the query string from `?` to `#`, and the fragment after `#`. `searchParams.get` returns the value already decoded. The path and the query string reach the server; the fragment stays with the page."

  - id: url-boxes
    kind: visual
    visual: diagram
    strings:
      home: { uk: "Дім", en: "Home" }
      garden: { uk: "сад", en: "garden" }
    title:
      uk: "Що з адреси їде на сервер"
      en: "What part of the address travels to the server"
    textEquivalent:
      uk: "Адреса http://localhost:5173/wishes?category=%%home%%&sort=price#w-02 складається з шести частин: схема http:, хост localhost, порт 5173, шлях /wishes, рядок запиту ?category=%%home%%&sort=price і фрагмент #w-02. Перші п’ять потрібні, щоб знайти сервер і сказати йому, чого ти хочеш; фрагмент лишається в браузері. У рядку запиту кожен байт слова «%%home%%» записується як %XX — це percent-encoding: так текст будь-якою мовою проходить через адресу, яка дозволяє лише обмежений набір символів. Якщо значення «%%home%% & %%garden%%» вклеїти в адресу як є, знак & розділить його на два параметри: сервер отримає category зі значенням «%%home%% » і ще один параметр « %%garden%%» без значення. URLSearchParams кодує & як %26, і сервер отримує одне значення, як його й задумано."
      en: "The address http://localhost:5173/wishes?category=%%home%%&sort=price#w-02 has six parts: the scheme http:, the host localhost, the port 5173, the path /wishes, the query string ?category=%%home%%&sort=price and the fragment #w-02. The first five are needed to find the server and tell it what you want; the fragment stays in the browser. In the query string Latin letters and digits travel as they are, and every other byte — a space, an &, or each of the two bytes of every letter of a Cyrillic word such as “Дім” — is written as %XX: that is percent-encoding, how text in any language passes through an address, which allows only a limited set of characters. If the value “%%home%% & %%garden%%” is glued into the address as it is, the & sign splits it into two parameters: the server gets category with the value “%%home%% ” and one more parameter “ %%garden%%” with no value. URLSearchParams encodes & as %26, and the server receives one value, as intended."
    spec:
      layout: lr
      groups:
        - { id: sent, label: { uk: "Їде на сервер", en: "Travels to the server" } }
        - { id: kept, label: { uk: "Лишається в браузері", en: "Stays in the browser" } }
      nodes:
        - { id: scheme, group: sent, label: "http:" }
        - { id: host, group: sent, label: "localhost" }
        - { id: port, group: sent, label: "5173" }
        - { id: path, group: sent, label: "/wishes" }
        - { id: query, group: sent, label: "?category=…&sort=…" }
        - { id: fragment, group: kept, label: "#w-02", shape: note }
      edges:
        - { id: q-f, from: query, to: fragment, kind: dashed }
      steps:
        - caption:
            uk: "Адреса `http://localhost:5173/wishes?category=%%home%%&sort=price#w-02` — шість частин. Схема, хост і порт кажуть, **до якого** сервера звертатися."
            en: "The address `http://localhost:5173/wishes?category=%%home%%&sort=price#w-02` has six parts. The scheme, host and port say **which** server to talk to."
          highlight: [scheme, host, port]
        - caption:
            uk: "Шлях і рядок запиту кажуть серверу, **чого** ти хочеш: список `/wishes`, відфільтрований за категорією й відсортований за ціною."
            en: "The path and the query string tell the server **what** you want: the `/wishes` list, filtered by category and sorted by price."
          highlight: [path, query]
        - caption:
            uk: "У запиті слово «%%home%%» їде байтами: кожен байт, що не є латинською літерою чи цифрою, записано як `%XX`. Це percent-encoding, і `URL` робить його сам."
            en: "In the request Latin letters and digits, as in “%%home%%”, travel as they are; every other byte is written as `%XX` — a Cyrillic word such as “Дім” becomes `%D0%94%D1%96%D0%BC`. That is percent-encoding, and `URL` does it for you."
          highlight: [query]
          annotate:
            - { id: query, text: { uk: "кожен байт — %XX", en: "each byte as %XX" } }
        - caption:
            uk: "Вклей значення «%%home%% & %%garden%%» як текст — і `&` розріже його: сервер отримає `category` = «%%home%% » і зайвий параметр « %%garden%%». `URLSearchParams` закодував би `&` як `%26`."
            en: "Glue the value “%%home%% & %%garden%%” in as text and the `&` cuts it: the server gets `category` = “%%home%% ” and a stray parameter “ %%garden%%”. `URLSearchParams` would encode `&` as `%26`."
          highlight: [query]
          annotate:
            - { id: query, text: { uk: "& ділить пари", en: "& separates pairs" } }
        - caption:
            uk: "Фрагмент `#w-02` браузер **не надсилає**: він лишається сторінці, щоб, наприклад, прокрутити до потрібного запису."
            en: "The browser does **not send** the fragment `#w-02`: it stays with the page, for example to scroll to the right record."
          highlight: [fragment, q-f]
          dim: [scheme, host, port, path]

  - id: predict-glued
    kind: prediction
    strings:
      first: { uk: "Дім", en: "Home" }
      last: { uk: "сад", en: "garden" }
    prompt:
      uk: "Категорію вклеюють в адресу як звичайний текст. Що прочитає сервер (а з ним і `searchParams`)?"
      en: "The category is glued into the address as plain text. What does the server (and `searchParams` with it) read?"
    code: |
      const category = "%%first%% & %%last%%";
      const url = new URL("http://localhost:5173/wishes?category=" + category);
      console.log(JSON.stringify(url.searchParams.get("category")));
      console.log([...url.searchParams.keys()].join(","));
    verify:
      logs: ["\"%%first%% \"", "category, %%last%%"]
    answer:
      type: choice
      options:
        - id: split
          text:
            uk: "`\"Дім \"`, а параметрів два: `category` і ` сад`"
            en: "`\"Home \"`, and there are two parameters: `category` and ` garden`"
        - id: whole
          text:
            uk: "`\"Дім & сад\"`, параметр один — `category`"
            en: "`\"Home & garden\"`, one parameter — `category`"
          why:
            uk: "Браузер закодує пробіли й кирилицю, але `&` у рядку запиту — роздільник пар. Він не знає, що ти мав на увазі символ у значенні, тож розрізає його."
            en: "The browser encodes the spaces and the Cyrillic letters, but `&` in a query string separates pairs. It cannot know you meant a character inside the value, so it cuts there."
        - id: error
          text:
            uk: "`new URL` кидає помилку: в адресі не можна пробілів"
            en: "`new URL` throws: an address may not contain spaces"
          why:
            uk: "`URL` не відмовляється від пробілу в рядку запиту — він сам замінює його на `%20`. Тому помилки немає, а значення тихо ламається."
            en: "`URL` does not refuse a space in a query string — it replaces it with `%20` itself. So there is no error, and the value breaks quietly."
      correct: [split]
    explanation:
      uk: "Браузер «лагодить» лише те, що однозначно: пробіл стає `%20`, кирилиця — байтами `%XX`. А `&`, `=`, `#` і `+` мають у рядку запиту власне значення, тож вклеєний текст ламається без жодної помилки. Значення треба кодувати перед тим, як воно потрапить в адресу."
      en: "The browser only “fixes” what is unambiguous: a space becomes `%20`, Cyrillic letters become `%XX` bytes. But `&`, `=`, `#` and `+` mean something in a query string, so glued-in text breaks without any error. A value has to be encoded before it goes into an address."

  - id: encode-it
    kind: explanation
    title:
      uk: "Кодуй значення, а не адресу"
      en: "Encode the value, not the address"
    body:
      uk: |
        [[percent-encoding|Percent-encoding]] записує кожен «небезпечний» байт як `%` і два шістнадцяткові знаки: `&` → `%26`, `#` → `%23`, «Д» → `%D0%94`. Два інструменти роблять це за тебе:

        - **Рядок запиту** — `URLSearchParams` або `url.searchParams.set(name, value)`. Він кодує все потрібне (пробіл пише як `+`), а `get` розкодовує назад.
        - **Один сегмент шляху** — `encodeURIComponent(value)`, наприклад `/fixtures/` + `encodeURIComponent(id)` + `.json`. Він кодує й `/`, тож значення не додасть зайвого рівня шляху, а пробіл пише як `%20`: у шляху `+` — це просто плюс.

        ```js
        const url = new URL("http://127.0.0.1:4300/search");
        url.searchParams.set("city", "Біла Церква");
        url.href; // "http://127.0.0.1:4300/search?city=%D0%91%D1%96%D0%BB%D0%B0+%D0%A6…"
        ```

        Не розкодовуй вручну й не кодуй двічі: `%2526` — це вже текст `%26`, а не `&`.
      en: |
        [[percent-encoding|Percent-encoding]] writes every “unsafe” byte as `%` and two hexadecimal digits: `&` → `%26`, `#` → `%23`, “Д” → `%D0%94`. Two tools do it for you:

        - **The query string** — `URLSearchParams` or `url.searchParams.set(name, value)`. It encodes everything needed (a space becomes `+`), and `get` decodes it back.
        - **One path segment** — `encodeURIComponent(value)`, for example `/fixtures/` + `encodeURIComponent(id)` + `.json`. It encodes `/` as well, so a value cannot add an extra level to the path, and it writes a space as `%20`: in a path, `+` is just a plus.

        ```js
        const url = new URL("http://127.0.0.1:4300/search");
        url.searchParams.set("city", "Біла Церква");
        url.href; // "http://127.0.0.1:4300/search?city=%D0%91%D1%96%D0%BB%D0%B0+%D0%A6…"
        ```

        Do not decode by hand and do not encode twice: `%2526` is the text `%26`, not `&`.

  - id: url-inspector
    kind: example
    runtime: browser-js
    dir: url-inspector
    entry: index.js
    capabilities: { network: lab }
    strings:
      homeGarden: { uk: "Дім & сад", en: "Home & garden" }
      gluedLabel: { uk: "Вклеєно як текст:", en: "Glued in as text:" }
      builtLabel: { uk: "Через searchParams:", en: "Through searchParams:" }
      sentLabel: { uk: "надіслано:", en: "sent:" }
      keptLabel: { uk: "лишилося сторінці:", en: "kept by the page:" }
      receivedLabel: { uk: "сервер отримав:", en: "server received:" }
    title:
      uk: "Що отримав сервер"
      en: "What the server received"
    body:
      uk: |
        Навчальна адреса `/lab/echo` — справжній локальний сервер платформи, який повертає те, що отримав. Код надсилає йому ту саму категорію двічі: вклеєну в адресу й задану через `searchParams`. Під назвою кожного запиту консоль показує три рядки: «надіслано» — шлях і рядок запиту, які браузер передав серверу; «лишилося сторінці» — фрагмент, який браузер не надсилає; «сервер отримав» — параметри, які сервер прочитав.
      en: |
        The lab address `/lab/echo` is the platform’s real local server, which answers with what it received. The code sends it the same category twice: glued into the address and set through `searchParams`. Under the name of each request the console shows three lines: “sent” is the path and query string the browser passed to the server; “kept by the page” is the fragment, which the browser does not send; “server received” is the parameters the server read.
    tryIt:
      uk: |
        1. Заміни категорію на `Подарунки #2` і запусти. У вклеєній адресі все після першого `#` стало фрагментом (рядок «лишилося сторінці»): сервер не отримав ні `#2`, ні `sort`.
        2. Порівняй, як записано пробіл: у вклеєній адресі — `%20`, у зібраній — `+`. Сервер розкодовує обидва однаково.
        3. Додай у кінець `console.log(encodeURIComponent(category));` і подивись, як виглядає те саме значення для сегмента шляху.
      en: |
        1. Change the category to `Gifts #2` and run. In the glued address everything after the first `#` became the fragment (the “kept by the page” line): the server received neither `#2` nor `sort`.
        2. Compare how a space is written: `%20` in the glued address, `+` in the built one. The server decodes both the same way.
        3. Add `console.log(encodeURIComponent(category));` at the end and see what the same value looks like for a path segment.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: байти кириличного тексту"
      en: "Recall: the bytes behind Cyrillic text"
    items:
      - id: bytes-of-kyiv
        from: js-13-04-encoding-boundaries
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const word = "Київ";
          console.log(new TextEncoder().encode(word).length, encodeURIComponent(word).length);
        verify:
          logs: ["8 24"]
        answer:
          type: choice
          options:
            - id: right
              text: { uk: "`8 24`", en: "`8 24`" }
            - id: chars
              text: { uk: "`4 4`", en: "`4 4`" }
              why:
                uk: "Один символ — не завжди один байт: у UTF-8 кожна кирилична літера займає два байти. А `encodeURIComponent` ще й пише кожен байт трьома знаками `%XX`."
                en: "One character is not always one byte: in UTF-8 every Cyrillic letter takes two bytes. And `encodeURIComponent` also writes each byte as three characters, `%XX`."
            - id: bytes-only
              text: { uk: "`8 8`", en: "`8 8`" }
              why:
                uk: "Байтів справді 8, але в адресі кожен із них стає трьома знаками: `%`, і дві шістнадцяткові цифри."
                en: "There are indeed 8 bytes, but in an address each of them becomes three characters: `%` and two hexadecimal digits."
          correct: [right]
        explanation:
          uk: "`TextEncoder` дає байти UTF-8: по два на кожну з чотирьох кириличних літер, разом 8. Percent-encoding записує кожен байт як `%XX`, тож у адресі слово займає 24 знаки (`%D0%9A%D0%B8…`)."
          en: "`TextEncoder` gives UTF-8 bytes: two for each of the four Cyrillic letters, 8 in total. Percent-encoding writes each byte as `%XX`, so in an address the word takes 24 characters (`%D0%9A%D0%B8…`)."

  - id: build-fixture-url
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: build-fixture-url
    entry: index.js
    editable: [index.js]
    strings:
      homeGarden: { uk: "Дім & сад", en: "Home & garden" }
      plusHash: { uk: "Ремонт +2 #кухня", en: "Repair +2 #kitchen" }
    title:
      uk: "Адреса фікстури з фільтрами"
      en: "A fixture address with filters"
    instructions:
      uk: |
        Допиши `buildFixtureUrl(base, { category, search })`. Вона повертає **текст** адреси: `base` і рядок запиту з фільтрами.

        - Кожне значення має дійти до сервера без змін, навіть якщо в ньому є `&`, `#`, `+`, пробіли чи кирилиця.
        - Фільтр зі значенням `undefined`, `null` чи `""` у запит не потрапляє. Якщо фільтрів немає, адреса не має рядка запиту.

        Перевірки розбирають результат через `new URL(...)` і читають параметри так, як їх прочитав би сервер.
      en: |
        Complete `buildFixtureUrl(base, { category, search })`. It returns the address as **text**: `base` plus a query string with the filters.

        - Every value must reach the server unchanged, even when it contains `&`, `#`, `+`, spaces or Cyrillic letters.
        - A filter whose value is `undefined`, `null` or `""` is left out of the query. With no filters the address has no query string.

        The checks parse the result with `new URL(...)` and read the parameters the way a server would.
    testTitles:
      "keeps the base address":
        uk: "Адреса без рядка запиту лишається `base`"
        en: "The address without its query is still `base`"
      "a category with & and spaces arrives as one value":
        uk: "Категорія з `&` і пробілами доходить одним значенням"
        en: "A category with `&` and spaces arrives as one value"
      "a search with + and # arrives unchanged":
        uk: "Пошук із `+` і `#` доходить без змін"
        en: "A search with `+` and `#` arrives unchanged"
      "a Cyrillic search term comes back unchanged":
        uk: "Кириличний пошук повертається без змін"
        en: "A Cyrillic search term comes back unchanged"
      "leaves out empty filters":
        uk: "Порожні фільтри не потрапляють у запит"
        en: "Empty filters are left out"
    hints:
      nudge:
        uk: "Не вклеюй значення в адресу незакодованим. Який об’єкт уміє і розібрати адресу, і безпечно додати до неї параметр?"
        en: "Do not glue a value into the address unencoded. Which object can both parse an address and add a parameter to it safely?"
      explanation:
        uk: "`new URL(адреса)` дає об’єкт, у якого є `searchParams`. Наприклад, `const page = new URL(\"http://127.0.0.1:4300/search\"); page.searchParams.set(\"city\", \"Біла Церква\");` — і `page.href` уже містить закодоване значення. Додавай параметр лише тоді, коли значення не порожнє, а наприкінці поверни `href`."
        en: "`new URL(address)` gives an object with `searchParams`. For example, `const page = new URL(\"http://127.0.0.1:4300/search\"); page.searchParams.set(\"city\", \"Біла Церква\");` — and `page.href` already holds the encoded value. Add a parameter only when its value is not empty, and return `href` at the end."
    solutionNote:
      uk: "`url.searchParams.set` кодує кожне значення, тож `&`, `#` і `+` лишаються частиною значення, а не розмітки адреси. Порожні фільтри просто не додаються, і тоді `href` не має рядка запиту. Підійде й `URLSearchParams` чи `encodeURIComponent` для кожного значення — головне, щоб кодувалося значення, а не вся адреса."
      en: "`url.searchParams.set` encodes every value, so `&`, `#` and `+` stay part of the value instead of the address syntax. Empty filters are simply not added, and then `href` has no query string. `URLSearchParams` or `encodeURIComponent` for each value works too — what matters is that the value is encoded, not the whole address."
    feedback:
      - when: { test: "keeps the base address" }
        message:
          uk: "Ця перевірка очікує, що функція повертає текст і що адреса без рядка запиту дорівнює `base`. Якщо результат — `undefined`, функція нічого не повертає (`return`)."
          en: "This check expects the function to return text and the address without its query to equal `base`. If the result is `undefined`, the function returns nothing (`return`)."
      - when: { test: "a category with & and spaces arrives as one value" }
        message:
          uk: "Ця перевірка очікує один параметр `category` зі значенням «Дім & сад». Якщо параметрів два, знак `&` потрапив в адресу незакодованим."
          en: "This check expects one parameter, `category`, with the value “Home & garden”. If there are two parameters, the `&` went into the address unencoded."
      - when: { test: "a search with + and # arrives unchanged" }
        message:
          uk: "Ця перевірка очікує, що `search` дорівнює «Ремонт +2 #кухня», а в адреси немає фрагмента. Незакодований `#` починає фрагмент, а незакодований `+` сервер читає як пробіл."
          en: "This check expects `search` to equal “Repair +2 #kitchen” and the address to have no fragment. An unencoded `#` starts the fragment, and an unencoded `+` is read by the server as a space."
      - when: { test: "a Cyrillic search term comes back unchanged" }
        message:
          uk: "Ця перевірка передає `search: \"Київ\"` і очікує, що `searchParams.get(\"search\")` поверне `Київ`."
          en: "This check passes `search: \"Київ\"` and expects `searchParams.get(\"search\")` to return `Київ`."
      - when: { test: "leaves out empty filters" }
        message:
          uk: "Ця перевірка очікує, що фільтр зі значенням `\"\"`, `null` чи `undefined` не з’являється в запиті, а без фільтрів у адреси немає рядка запиту."
          en: "This check expects a filter whose value is `\"\"`, `null` or `undefined` not to appear in the query, and the address to have no query string when there are no filters."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` означає, що значення має не той тип, на який розраховує код. `Failed to construct 'URL': Invalid URL` — `new URL` отримав не повну адресу (наприклад, шлях без `http://…`). Якщо всі перевірки впали разом, спершу виправ першу помилку в консолі."
          en: "A `TypeError` means a value has a different type than the code expects. `Failed to construct 'URL': Invalid URL` — `new URL` received something that is not a full address (for example a path without `http://…`). If every check fails at once, fix the first error in the console first."

  - id: to-project
    kind: transfer
    capstoneStep: JS-16
    body:
      uk: "У кроці проєкту пошук і фільтр списку житимуть в адресі сторінки (`?q=…&show=…`), щоб пережити перезавантаження. `viewAddress` записуватиме їх через `new URL` і `searchParams.set` — без жодного вклеєного незакодованого тексту, тож «Дім & сад #1» повернеться незмінним, — а `readView` читатиме їх через `URLSearchParams` і `get`, не чіпаючи інших параметрів адреси."
      en: "In the project step the list's search and filter will live in the page address (`?q=…&show=…`) so that they survive a reload. `viewAddress` will write them through `new URL` and `searchParams.set` — without any unencoded glued-in text, so “Home & garden #1” comes back unchanged — and `readView` will read them through `URLSearchParams` and `get`, leaving the other parameters of the address alone."
