id: rn-12-04-cumulative-review
unit: RN-12
title:
  uk: "Підсумкове нативне повторення"
  en: "Cumulative native review"
kind: review
minutes: 20
contentVersion: 1
purpose:
  uk: "Перед підсумковим нативним рубежем ти без нотаток пригадуєш головні правила етапу React Native — межу native і web, фокус і монтування, стани дозволів, міграцію схеми, підпис і прибирання підписок — і передбачаєш, чим закінчаться п’ять коротких сценаріїв. Кожне питання називає урок, до якого варто повернутися, якщо відповідь не далася."
  en: "Before the final native gate you recall without notes the main rules of the React Native stage — the native/web boundary, focus and mount, permission states, schema migration, signing and cleaning up subscriptions — and predict how five short scenarios end. Every question names the lesson to return to if the answer did not come."
objectives:
  - uk: "Без нотаток пригадати межу native/web, фокус і монтування, стани можливостей, міграцію схеми, правила підпису й прибирання та застосувати кожне до короткого нативного сценарію."
    en: "Retrieve, without notes, the native/web boundary, focus versus mount, capability states, schema migration, signing and cleanup rules, and apply each to a short native scenario."
prerequisites: [rn-12-03-platform-deps-compat-legacy]
subskills: []
glossary: []
selfCheck: [old-snapshot, leaked-subscription]

blocks:
  - id: how-to-review
    kind: explanation
    title:
      uk: "Як проходити це повторення"
      en: "How to go through this review"
    body:
      uk: |
        Нового матеріалу тут немає. Є питання з усього етапу React Native — і кілька з JavaScript та React, на яких він стоїть.

        - Відповідай **до** пояснення й без нотаток: саме спроба пригадати закріплює знання, навіть невдала.
        - Під кожним питанням указано урок, з якого воно. Помилився — повернися туди.
        - Два передбачення про програми (стара схема й підписка, що «тече») платформа запускає по-справжньому, тож їхній вивід перевірено.

        Наступні два уроки — рубіж. Що не далося тут, там знадобиться без підказок.
      en: |
        There is no new material here. There are questions from the whole React Native stage — and a few from the JavaScript and React it stands on.

        - Answer **before** the explanation and without notes: the very attempt to recall is what makes the knowledge stick, even a failed one.
        - Every question names the lesson it comes from. If you got it wrong, go back there.
        - The platform really runs the two predictions about programs (the old schema and the leaking subscription), so their output is verified.

        The next two lessons are the gate. What did not come here will be needed there without hints.

  - id: recall-foundations
    kind: review
    title:
      uk: "Основи, на яких стоїть етап"
      en: "The foundations under the stage"
    items:
      - id: preview-proves
        from: rn-01-01-native-vs-web
        prompt:
          uk: "Екран трекера витрат працює в перегляді react-native-web у браузері. Що це доводить про той самий екран на телефоні?"
          en: "An expense tracker screen works in the react-native-web preview in the browser. What does that prove about the same screen on a phone?"
        answer:
          type: choice
          options:
            - id: logic-only
              text: { uk: "Лише те, що логіка й компоненти поводяться правильно; native view, жести й вигляд платформи перевіряють на цілі", en: "Only that the logic and components behave correctly; native views, gestures and the platform look are checked on the target" }
            - id: same
              text: { uk: "Що на телефоні все буде так само — код той самий", en: "That everything will be the same on the phone — the code is the same" }
              why:
                uk: "Код той самий, а рендерер інший: у браузері — DOM, на телефоні — native view. Шрифти, дотики, доступність і продуктивність належать платформі."
                en: "The code is the same, but the renderer differs: DOM in the browser, native views on the phone. Fonts, touches, accessibility and performance belong to the platform."
            - id: nothing
              text: { uk: "Нічого — перегляд у браузері марний", en: "Nothing — a browser preview is useless" }
              why:
                uk: "Перегляд доводить те, що від платформи не залежить: стан, логіку, тексти, порядок дій. Він просто не замінює перевірки на цілі."
                en: "The preview proves what does not depend on the platform: state, logic, texts, the order of actions. It just does not replace a check on the target."
          correct: [logic-only]
        explanation:
          uk: "Межа native/web з першого уроку етапу: спільне — логіка, окреме — рендерер і все, що ним намальовано."
          en: "The native/web boundary from the stage's first lesson: the logic is shared, the renderer and everything it draws is separate."

      - id: cleanup-when
        from: re-03-03-dependencies-cleanup
        prompt:
          uk: "Ефект із залежністю `[habitId]` повертає cleanup. Коли React викликає цей cleanup?"
          en: "An effect with the dependency `[habitId]` returns a cleanup. When does React call that cleanup?"
        answer:
          type: choice
          options:
            - id: before-rerun-unmount
              text: { uk: "Перед кожним повторним запуском ефекту (коли змінився `habitId`) і під час демонтування", en: "Before every re-run of the effect (when `habitId` changed) and on unmount" }
            - id: unmount-only
              text: { uk: "Лише під час демонтування", en: "Only on unmount" }
              why:
                uk: "Якщо `habitId` змінився, React спершу прибирає за старим запуском, а вже потім запускає ефект знову — інакше лишилися б дві підписки."
                en: "If `habitId` changed, React first cleans up after the old run and only then runs the effect again — otherwise two subscriptions would remain."
            - id: every-render
              text: { uk: "Після кожного рендеру", en: "After every render" }
              why:
                uk: "Рендер без зміни залежностей не запускає ефект знову, тож і cleanup не потрібен."
                en: "A render without changed dependencies does not run the effect again, so no cleanup is needed either."
          correct: [before-rerun-unmount]
        explanation:
          uk: "Cleanup скасовує саме той запуск, що його повернув: перед наступним запуском і в кінці життя компонента."
          en: "A cleanup undoes exactly the run that returned it: before the next run and at the end of the component's life."

      - id: what-keeps-ticking
        from: js-13-06-cleanup-listeners-timers
        prompt:
          uk: "Віджет створює `setInterval` і слухача `resize`, а потім його елемент видаляють зі сторінки, без жодного прибирання. Що далі?"
          en: "A widget creates a `setInterval` and a `resize` listener, and then its element is removed from the page with no cleanup at all. What happens next?"
        answer:
          type: choice
          options:
            - id: keeps-running
              text: { uk: "Таймер і слухач працюють далі й тримають в пам’яті все, на що посилаються", en: "The timer and the listener keep running and keep in memory everything they refer to" }
            - id: gone
              text: { uk: "Разом з елементом зникають і таймер, і слухач", en: "The timer and the listener disappear together with the element" }
              why:
                uk: "Таймер належить вікну, а не елементу, і слухач `resize` теж висить на `window`. Видалення елемента їх не зупиняє — це робить лише прибирання."
                en: "The timer belongs to the window, not to the element, and the `resize` listener also hangs on `window`. Removing the element does not stop them — only a teardown does."
          correct: [keeps-running]
        explanation:
          uk: "Кожне «підписатися» має свою пару «відписатися» — у JavaScript, у React-ефекті й у native-підписці на `AppState`."
          en: "Every “subscribe” has its “unsubscribe” pair — in JavaScript, in a React effect and in a native `AppState` subscription."

  - id: refocus
    kind: prediction
    prompt:
      uk: "Екран списку звичок завантажує тижневий відсоток в `useEffect(…, [])`. Людина відкриває деталі звички, позначає там сьогоднішній день і натискає «Назад». Що показує список?"
      en: "A habit list screen loads the weekly rate in `useEffect(…, [])`. The person opens a habit's details, marks today there and presses “Back”. What does the list show?"
    answer:
      type: choice
      options:
        - id: stale
          text: { uk: "Старий відсоток — до нової позначки", en: "The old rate — from before the new mark" }
        - id: fresh
          text: { uk: "Новий відсоток: повернувшись, екран змонтувався знову", en: "The new rate: on return the screen mounted again" }
          why:
            uk: "Список весь час лишався в стеку змонтованим, лише без фокусу. Ефект з `[]` не запускається знову, тож дані ніхто не перечитав."
            en: "The list stayed mounted in the stack the whole time, just unfocused. An effect with `[]` does not run again, so nobody read the data again."
        - id: empty
          text: { uk: "Порожній список, поки дані завантажуються знову", en: "An empty list while the data loads again" }
          why:
            uk: "Нового завантаження немає: екран не демонтувався, стан лишився, ефект не повторився."
            en: "There is no new load: the screen was not unmounted, the state stayed, the effect did not repeat."
      correct: [stale]
    explanation:
      uk: "Змонтований — не означає видимий (RN-04). Щоб оновлювати дані при поверненні, потрібен ефект фокусу з прибиранням на blur, а не ефект монтування."
      en: "Mounted does not mean visible (RN-04). To refresh data on return you need a focus effect with cleanup on blur, not a mount effect."

  - id: revoked-in-background
    kind: prediction
    prompt:
      uk: "Екран нагадувань планувальника читає дозвіл на сповіщення в ОС під час кожного повернення застосунку (`AppState` → `active`) і нічого про дозвіл не зберігає. Людина згортає застосунок, забирає дозвіл у налаштуваннях і повертається. Що бачить людина?"
      en: "The planner's reminders screen reads the notification permission from the OS on every return of the app (`AppState` → `active`) and stores nothing about the permission. The person sends the app to the background, takes the permission away in Settings and comes back. What does the person see?"
    answer:
      type: choice
      options:
        - id: off-notice
          text: { uk: "Повідомлення, що нагадування вимкнено, і шлях до налаштувань — і так само, якщо система тим часом завершила процес", en: "A notice that reminders are off and a way to Settings — and the same if the system ended the process in the meantime" }
        - id: on
          text: { uk: "Нагадування увімкнено, як і до згортання", en: "Reminders on, as before going to the background" }
          why:
            uk: "Так було б, якби екран зберігав `granted` і довіряв йому. Цей екран перечитує ОС при кожному поверненні, а ОС уже каже `denied`."
            en: "That would happen if the screen kept `granted` and trusted it. This screen reads the OS again on every return, and the OS now says `denied`."
        - id: crash
          text: { uk: "Застосунок падає, бо дозвіл зник під час роботи", en: "The app crashes because the permission disappeared while it ran" }
          why:
            uk: "Відкликання саме по собі не кидає винятку в JavaScript. Android може завершити процес, але тоді наступний запуск починається з нуля й теж читає ОС."
            en: "A revoke by itself throws no exception in JavaScript. Android may end the process, but then the next launch starts from scratch and reads the OS too."
      correct: [off-notice]
    explanation:
      uk: "Джерело правди про дозвіл — ОС, а не збережений стан (RN-09). Екран, що перечитує ОС і на поверненні, і на запуску, однаково правий і тоді, коли процес вижив, і тоді, коли система його завершила."
      en: "The source of truth about a permission is the OS, not saved state (RN-09). A screen that reads the OS both on return and at launch is right both when the process survived and when the system ended it."

  - id: old-snapshot
    kind: prediction
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    prompt:
      uk: "Застосунок бажань тепер на схемі 3. Він завантажує знімок, збережений версією зі схемою 1. Що надрукують два виклики `console.log`?"
      en: "The wishlist app is now on schema 3. It loads a snapshot saved by a version with schema 1. What do the two `console.log` calls print?"
    code: |
      const CURRENT = 3;
      const steps = {
        1: (s) => ({ schemaVersion: 2, records: s.records.map((r) => ({ ...r, priority: r.priority ?? 'normal' })) }),
        2: (s) => ({ schemaVersion: 3, records: s.records.map((r) => ({ ...r, tags: r.tags ?? [] })) }),
      };

      function migrate(snapshot) {
        let current = snapshot;
        while (current.schemaVersion < CURRENT) current = steps[current.schemaVersion](current);
        return current;
      }

      const saved = { schemaVersion: 1, records: [{ id: 'w-01', name: '%%lamp%%' }] };
      const result = migrate(saved);
      console.log(result.schemaVersion);
      console.log(JSON.stringify(result.records[0]));
    verify:
      logs: ["3", "{\"id\":\"w-01\",\"name\":\"%%lamp%%\",\"priority\":\"normal\",\"tags\":[]}"]
    answer:
      type: choice
      options:
        - id: both-steps
          text: { uk: "`3`, потім запис з `priority: \"normal\"` і `tags: []`", en: "`3`, then the record with `priority: \"normal\"` and `tags: []`" }
        - id: one-step
          text: { uk: "`2`, потім запис лише з `priority: \"normal\"`", en: "`2`, then the record with only `priority: \"normal\"`" }
          why:
            uk: "`while` не зупиняється після першого кроку: доки версія менша за 3, він бере наступний. Знімок 1 проходить 1 → 2 → 3."
            en: "`while` does not stop after the first step: while the version is below 3, it takes the next one. Snapshot 1 goes 1 → 2 → 3."
        - id: jump
          text: { uk: "`3`, потім запис лише з `tags: []` — застосунок переходить одразу до останнього кроку", en: "`3`, then the record with only `tags: []` — the app jumps straight to the last step" }
          why:
            uk: "Ланцюжок міграцій не перестрибує: кожен крок знає лише свою версію, тож пропущений крок 1 → 2 лишив би запис без `priority`."
            en: "A migration chain does not jump: each step knows only its own version, so a skipped 1 → 2 step would leave the record without `priority`."
      correct: [both-steps]
    explanation:
      uk: "Старий знімок проходить усі кроки по черзі й отримує кожне нове поле (RN-05). Тому знімок будь-якої старої версії доходить до поточної, а дані людини лишаються."
      en: "An old snapshot passes every step in turn and gets every new field (RN-05). That is why a snapshot of any old version reaches the current one, and the person's data stays."

  - id: new-key-update
    kind: prediction
    prompt:
      uk: "На Android-емуляторі встановлено планувальник `1.2.0 (4)`, підписаний ключем A. Ключ A загубили, тож `1.3.0 (5)` з тим самим ідентифікатором підписано новим ключем B. Що станеться, коли ти встановиш `1.3.0 (5)` як оновлення?"
      en: "The planner `1.2.0 (4)`, signed with key A, is installed on an Android emulator. Key A was lost, so `1.3.0 (5)` with the same id was signed with a new key B. What happens when you install `1.3.0 (5)` as an update?"
    answer:
      type: choice
      options:
        - id: refused
          text: { uk: "Пристрій відмовляє в оновленні; лишаються `1.2.0 (4)` і її дані", en: "The device refuses the update; `1.2.0 (4)` and its data stay" }
        - id: updates
          text: { uk: "Оновлення ставиться: ідентифікатор той самий, номер збірки вищий", en: "The update installs: the id is the same, the build number is higher" }
          why:
            uk: "Ідентифікатор і номер — необхідні, але не достатні. Пристрій запам’ятав сертифікат першої збірки, і оновлення мусить мати той самий."
            en: "The id and the number are necessary but not sufficient. The device remembered the certificate of the first build, and an update must have the same one."
        - id: fresh
          text: { uk: "Ставиться начисто: стара збірка замінюється, дані зникають", en: "It installs fresh: the old build is replaced, the data disappears" }
          why:
            uk: "Система нічого не видаляє сама. Поставити збірку з ключем B можна лише після того, як людина сама видалить стару — разом з даними."
            en: "The system removes nothing by itself. A build with key B can go on only after the person removes the old one themselves — together with the data."
      correct: [refused]
    explanation:
      uk: "Оновлення має бути підписане тим самим сертифікатом увесь час життя застосунку (RN-11). Тому ключ підпису зберігають поза репозиторієм, з резервною копією й записаним шляхом відновлення."
      en: "An update must be signed with the same certificate for the whole life of the app (RN-11). That is why a signing key is kept outside the repository, with a backup and a written recovery path."

  - id: leaked-subscription
    kind: prediction
    prompt:
      uk: "Екран тричі отримував фокус, і щоразу підписувався на зміни сховища. Потім у сховищі сталася одна зміна. Що надрукує `console.log`?"
      en: "A screen received focus three times and subscribed to storage changes every time. Then one change happened in the storage. What does `console.log` print?"
    code: |
      const listeners = new Set();
      const subscribe = (listener) => {
        listeners.add(listener);
        return () => listeners.delete(listener);
      };

      let refreshes = 0;
      function onFocus() {
        subscribe(() => {
          refreshes += 1;
        }); // the function that unsubscribes is thrown away
      }

      onFocus();
      onFocus();
      onFocus();
      for (const listener of listeners) listener(); // one change in the storage
      console.log(refreshes);
    verify:
      logs: ["3"]
    answer:
      type: choice
      options:
        - id: three
          text: { uk: "`3`", en: "`3`" }
        - id: one
          text: { uk: "`1` — `Set` не зберігає дублікатів", en: "`1` — a `Set` keeps no duplicates" }
          why:
            uk: "Кожен виклик `onFocus` створює **нову** стрілкову функцію, тож для `Set` це три різні слухачі. Дублікатом була б лише та сама функція."
            en: "Every call of `onFocus` creates a **new** arrow function, so for the `Set` these are three different listeners. Only the very same function would be a duplicate."
        - id: zero
          text: { uk: "`0` — після втрати фокусу підписка зникає сама", en: "`0` — a subscription goes away by itself after the focus is lost" }
          why:
            uk: "Підписка зникає лише тоді, коли викликають функцію, яку повернув `subscribe`. Тут її викинули."
            en: "A subscription goes away only when the function returned by `subscribe` is called. Here it was thrown away."
      correct: [three]
    explanation:
      uk: "Три фокуси без відписки — три живі слухачі, і одна зміна оновлює екран тричі. Ефект фокусу має повертати функцію відписки, щоб на blur вона спрацювала (RN-04)."
      en: "Three focuses without unsubscribing — three live listeners, and one change refreshes the screen three times. A focus effect must return the unsubscribe function so that it runs on blur (RN-04)."

  - id: recall-native
    kind: review
    title:
      uk: "Правила нативного етапу"
      en: "The rules of the native stage"
    items:
      - id: stack-mount
        from: rn-04-03-screen-focus-vs-mount
        prompt:
          uk: "Зі списку відкрили екран деталей. Що тепер зі списком?"
          en: "A detail screen was opened from the list. What is the state of the list now?"
        answer:
          type: choice
          options:
            - id: mounted-unfocused
              text: { uk: "Змонтований, без фокусу: стан лишається, ефекти монтування не повторяться", en: "Mounted, unfocused: its state stays, mount effects will not repeat" }
            - id: unmounted
              text: { uk: "Демонтований: повернувшись, він створиться знову", en: "Unmounted: on return it will be created again" }
              why:
                uk: "Стек тримає попередні екрани змонтованими — саме тому повернення миттєве, а введений текст на місці."
                en: "The stack keeps previous screens mounted — that is why going back is instant and typed text is still there."
          correct: [mounted-unfocused]
        explanation:
          uk: "Фокус і монтування — різні події: на повернення реагує ефект фокусу."
          en: "Focus and mount are different events: a focus effect reacts to the return."

      - id: permission-truth
        from: rn-09-05-deny-revoke-unavailable
        prompt:
          uk: "Де застосунок має брати стан дозволу, коли людина повертається до екрана камери?"
          en: "Where should the app get the permission state when the person comes back to the camera screen?"
        answer:
          type: choice
          options:
            - id: os
              text: { uk: "Перечитати в ОС", en: "Read it from the OS again" }
            - id: storage
              text: { uk: "Зі сховища, куди його записали після дозволу", en: "From storage, where it was written after the grant" }
              why:
                uk: "Збережене `granted: true` — це дозвіл, який могли відкликати, поки застосунок був у фоні. Його джерело правди — ОС."
                en: "A saved `granted: true` is a permission that may have been revoked while the app was in the background. Its source of truth is the OS."
            - id: state
              text: { uk: "Зі state компонента: він пам’ятає останню відповідь", en: "From the component's state: it remembers the last answer" }
              why:
                uk: "State пам’ятає те, що було, а не те, що є зараз. Відкликання в налаштуваннях state не змінює."
                en: "State remembers what was, not what is now. A revoke in Settings does not change state."
          correct: [os]
        explanation:
          uk: "Стани «не питали», «дозволено», «відмовлено», «заблоковано», «відкликано», «немає обладнання» — це те, що ОС каже **зараз**."
          en: "The states “not asked”, “granted”, “denied”, “blocked”, “revoked”, “no hardware” are what the OS says **now**."

      - id: key-out-of-repo
        from: rn-11-03-signing-key-hygiene
        prompt:
          uk: "Де мають жити keystore release-збірки та його паролі?"
          en: "Where should a release keystore and its passwords live?"
        answer:
          type: choice
          options:
            - id: outside
              text: { uk: "Поза репозиторієм, з резервною копією й записаним шляхом відновлення", en: "Outside the repository, with a backup and a written recovery path" }
            - id: repo-private
              text: { uk: "У репозиторії, якщо він приватний", en: "In the repository, if it is private" }
              why:
                uk: "Приватний репозиторій теж копіюють, клонують і показують. Хто має ключ — той може підписати «оновлення» від твого імені."
                en: "A private repository is copied, cloned and shown too. Whoever has the key can sign an “update” in your name."
            - id: build-gradle
              text: { uk: "Паролі — у `build.gradle`, щоб збирання працювало в усіх", en: "The passwords in `build.gradle`, so the build works for everyone" }
              why:
                uk: "Так влаштовано лише `debug.keystore` шаблону з паролем `android` — і саме тому такий підпис нічого не захищає."
                en: "That is how only the template's `debug.keystore` with the password `android` works — and that is exactly why such a signature protects nothing."
          correct: [outside]
        explanation:
          uk: "Ключ, загублений без копії, — це кінець оновлень для встановлених збірок; ключ у репозиторії — підпис, який може підробити будь-хто з доступом."
          en: "A key lost without a copy is the end of updates for installed builds; a key in the repository is a signature anyone with access can forge."

  - id: what-to-reread
    kind: explanation
    title:
      uk: "Що перечитати перед рубежем"
      en: "What to reread before the gate"
    body:
      uk: |
        | Помилка в питанні про | Перечитай |
        |---|---|
        | перегляд у браузері й пристрій | RN-01 |
        | фокус, монтування, підписки | RN-04 |
        | старий знімок, міграцію | RN-05 |
        | дозволи й відкликання | RN-09 |
        | підпис і ключі | RN-11 |
        | cleanup, таймери, слухачі | RE-03, JS-13 |

        А ще перед рубежем пригадай RN-07: як знайти перше вирішальне повідомлення в лозі збирання й у лозі пристрою, і RN-08: як записати перевірку, якої не можеш виконати, — пропуском з причиною, а не «пройдено».
      en: |
        | A mistake in the question about | Reread |
        |---|---|
        | the browser preview and the device | RN-01 |
        | focus, mount, subscriptions | RN-04 |
        | an old snapshot, a migration | RN-05 |
        | permissions and revoking | RN-09 |
        | signing and keys | RN-11 |
        | cleanup, timers, listeners | RE-03, JS-13 |

        And before the gate, recall RN-07: how to find the first decisive line in a build log and in a device log, and RN-08: how to record a check you cannot perform — as a skip with a reason, not as “passed”.
