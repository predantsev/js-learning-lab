id: rn-12-01-new-architecture-concepts
unit: RN-12
title:
  uk: "Нова архітектура: Fabric і TurboModules"
  en: "New architecture: Fabric and TurboModules"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Пояснити на діаграмі з позначеними версіями, як нова архітектура замінює асинхронний міст із серіалізацією на JSI, рендерить через Fabric і ліниво завантажує TurboModules."
    en: "Explain, on a version-labeled diagram, how the new architecture replaces the asynchronous serialized bridge with JSI, renders through Fabric and loads TurboModules lazily."
  - uk: "Розрізнити в README бібліотеки інструкції для старої й нової архітектури за позначками версій і термінами."
    en: "Distinguish old-architecture from new-architecture instructions in a supplied library README by their version labels and terms."
prerequisites: [rn-01-01-native-vs-web, rn-10-03-ui-js-work-frame-budget]
subskills:
  - { family: N-09, skill: "new architecture/Fabric/TurboModules concepts", depth: intro }
glossary: [new-architecture, fabric, turbomodule, jsi, legacy-bridge]
selfCheck: [count-crossings, readme-labels]

blocks:
  - id: two-sides
    kind: explanation
    title:
      uk: "Дві сторони одного застосунку"
      en: "Two sides of one app"
    body:
      uk: |
        У застосунку React Native працюють дві сторони. Твій JavaScript (компоненти, обробники, доменні функції) виконується в рушії JavaScript. А екран, сховище, датчики — це **native-код** Android чи iOS. Браузера тут немає: commit створює справжні [[native-view|native view]] (RN-01).

        Отже, кожне натискання, яке читає щось із телефона й міняє екран, мусить **перетнути межу** між сторонами. Як саме — і є «архітектура» React Native:

        - **Стара** (до 0.82 її ще можна було ввімкнути): [[legacy-bridge|міст]]. Кожен виклик перетворюється на текст JSON, стає в асинхронну чергу, а відповідь повертається окремим повідомленням.
        - **[[new-architecture|Нова]]** (за замовчуванням з 0.76, єдина з 0.82): [[jsi|JSI]] — інтерфейс на C++, через який JavaScript тримає посилання на native-об’єкти й викликає їх напряму, без JSON і без черги.

        Курс націлений на React Native 0.86 (Expo SDK 57), тож у твоєму проєкті працює лише нова.
      en: |
        Two sides work in a React Native app. Your JavaScript (components, handlers, domain functions) runs in a JavaScript engine. The screen, storage and sensors are **native code** of Android or iOS. There is no browser here: commit creates real [[native-view|native views]] (RN-01).

        So every press that reads something from the phone and changes the screen has to **cross the boundary** between the sides. How exactly is React Native's “architecture”:

        - **The old one** (it could still be turned on before 0.82): the [[legacy-bridge|bridge]]. Every call is turned into JSON text, put into an asynchronous queue, and the answer comes back as a separate message.
        - **The [[new-architecture|new one]]** (default since 0.76, the only one since 0.82): [[jsi|JSI]] — a C++ interface through which JavaScript holds references to native objects and calls them directly, without JSON and without a queue.

        The course targets React Native 0.86 (Expo SDK 57), so only the new one runs in your project.

  - id: three-parts
    kind: explanation
    title:
      uk: "JSI, Fabric і TurboModules"
      en: "JSI, Fabric and TurboModules"
    body:
      uk: |
        На JSI стоять дві частини:

        - **[[fabric|Fabric]]** — рендерер. Ядро написане на C++ і спільне для Android та iOS. React передає йому нове дерево через JSI, а Fabric створює й змінює native view. Розміри він уміє виміряти **синхронно** — тому `useLayoutEffect` може прочитати розмір і поправити розташування до того, як людина побачить стрибок.
        - **[[turbomodule|TurboModules]]** — native-модулі нової архітектури: сховище, датчик, будь-що з native-кодом. Їхні методи JavaScript викликає через JSI за типізованим описом. Модуль створюється **ліниво** — під час першого звернення, а не під час запуску, тож застосунок стартує швидше.

        Звідки це: сторінки React Native 0.86 [About the New Architecture](https://reactnative.dev/docs/0.86/the-new-architecture/landing-page) і [Native Modules Lifecycle](https://reactnative.dev/docs/0.86/the-new-architecture/native-modules-lifecycle), сторінка [Fabric](https://reactnative.dev/architecture/fabric-renderer) з розділу Architecture (вона без версії, 2022 року) і [допис про 0.82](https://reactnative.dev/blog/2025/10/08/react-native-0.82). Сторінка «About» під версією 0.86 написана ще для 0.76 і досі описує, як нову архітектуру вимкнути, — з 0.82 ці прапорці ігноруються.
      en: |
        Two parts stand on JSI:

        - **[[fabric|Fabric]]** is the renderer. Its core is written in C++ and shared between Android and iOS. React hands it the new tree through JSI, and Fabric creates and changes the native views. It can measure sizes **synchronously** — that is why `useLayoutEffect` can read a size and fix a position before the person sees a jump.
        - **[[turbomodule|TurboModules]]** are the native modules of the new architecture: storage, a sensor, anything with native code. JavaScript calls their methods through JSI according to a typed description. A module is created **lazily** — on first access, not at app start, so the app starts faster.

        Where this comes from: the React Native 0.86 pages [About the New Architecture](https://reactnative.dev/docs/0.86/the-new-architecture/landing-page) and [Native Modules Lifecycle](https://reactnative.dev/docs/0.86/the-new-architecture/native-modules-lifecycle), the [Fabric](https://reactnative.dev/architecture/fabric-renderer) page of the Architecture section (unversioned, from 2022) and the [0.82 release post](https://reactnative.dev/blog/2025/10/08/react-native-0.82). The “About” page under version 0.86 was written for 0.76 and still describes how to turn the new architecture off — since 0.82 those flags are ignored.

  - id: two-pipelines
    kind: visual
    visual: diagram
    title:
      uk: "Одне натискання: міст (до 0.82) і JSI (React Native 0.86)"
      en: "One press: the bridge (before 0.82) and JSI (React Native 0.86)"
    textEquivalent:
      uk: "Дві колонки описують те саме натискання «Виконано»: JavaScript читає серію звички з native-модуля й оновлює підпис на екрані. Ліва колонка — стара архітектура, яку можна було ввімкнути до React Native 0.82: JavaScript кладе виклик як текст JSON в асинхронну чергу мосту; native-бік розбирає повідомлення й запускає модуль; відповідь повертається окремим повідомленням через ту саму чергу; зміна екрана теж іде повідомленнями до native view. Права колонка — нова архітектура React Native 0.86: JavaScript викликає метод TurboModule напряму через JSI, і модуль створюється під час першого звернення; React передає нове дерево рендереру Fabric теж через JSI, а Fabric, ядро якого на C++, змінює native view. У новій колонці немає ні JSON, ні черги. Версію свого проєкту дивись у полі react-native файла package.json."
      en: "Two columns describe the same press of “Done”: JavaScript reads the habit's streak from a native module and updates the label on the screen. The left column is the old architecture, which could be turned on before React Native 0.82: JavaScript puts the call as JSON text into the bridge's asynchronous queue; the native side parses the message and runs the module; the answer comes back as a separate message through the same queue; the screen change also goes as messages to the native views. The right column is the new architecture of React Native 0.86: JavaScript calls the TurboModule method directly through JSI, and the module is created on first access; React hands the new tree to the Fabric renderer through JSI too, and Fabric, whose core is C++, changes the native views. The new column has neither JSON nor a queue. Look up your project's version in the react-native field of package.json."
    spec:
      layout: grid
      nodes:
        - { id: old, label: { uk: "до 0.82: міст", en: "before 0.82: bridge" }, shape: pill, w: 160, col: 0, row: 0 }
        - { id: now, label: { uk: "0.86: JSI", en: "0.86: JSI" }, shape: pill, w: 160, col: 1, row: 0 }
        - { id: js0, label: "JavaScript", w: 160, col: 0, row: 1 }
        - { id: js1, label: "JavaScript", w: 160, col: 1, row: 1 }
        - { id: queue, label: { uk: "черга JSON", en: "JSON queue" }, shape: note, w: 160, col: 0, row: 2 }
        - { id: jsi, label: "JSI (C++)", shape: round, w: 160, col: 1, row: 2 }
        - { id: mod0, label: { uk: "native-модуль", en: "native module" }, w: 160, col: 0, row: 3 }
        - { id: turbo, label: "TurboModule", w: 160, col: 1, row: 3 }
        - { id: views0, label: "native views", w: 160, col: 0, row: 4 }
        - { id: fabric, label: "Fabric (C++)", w: 160, col: 1, row: 4 }
        - { id: views1, label: "native views", w: 160, col: 1, row: 5 }
      edges:
        - { id: js0-queue, from: js0, to: queue, label: "JSON", kind: both }
        - { id: queue-mod0, from: queue, to: mod0, kind: both }
        - { id: queue-views0, from: queue, to: views0, kind: dashed }
        - { id: js1-jsi, from: js1, to: jsi }
        - { id: jsi-turbo, from: jsi, to: turbo }
        - { id: turbo-fabric, from: turbo, to: fabric, kind: line }
        - { id: fabric-views1, from: fabric, to: views1 }
      steps:
        - caption:
            uk: "Те саме натискання «Виконано» в двох архітектурах. Ліва колонка — до React Native 0.82, права — 0.86, на яку націлений курс."
            en: "The same press of “Done” in two architectures. The left column is before React Native 0.82, the right one is 0.86, the version the course targets."
          highlight: [old, now]
        - caption:
            uk: "Міст: виклик модуля стає текстом JSON і чекає в асинхронній черзі; native-бік розбирає його й запускає модуль."
            en: "The bridge: the module call becomes JSON text and waits in an asynchronous queue; the native side parses it and runs the module."
          highlight: [js0, queue, mod0, js0-queue, queue-mod0]
          dim: [js1, jsi, turbo, fabric, views1, now]
        - caption:
            uk: "Відповідь повертається окремим повідомленням тією ж чергою, а зміна підпису йде до native view ще одним."
            en: "The answer comes back as a separate message through the same queue, and the label change goes to the native views as yet another."
          highlight: [queue, views0, queue-views0, queue-mod0]
          dim: [js1, jsi, turbo, fabric, views1, now]
        - caption:
            uk: "JSI: JavaScript викликає метод TurboModule напряму, без JSON і без черги. Модуль створено під час першого звернення до нього."
            en: "JSI: JavaScript calls the TurboModule method directly, without JSON and without a queue. The module was created on first access."
          highlight: [js1, jsi, turbo, js1-jsi, jsi-turbo]
          dim: [js0, queue, mod0, views0, old]
          annotate:
            - { id: turbo, text: { uk: "ліниво", en: "lazily" } }
        - caption:
            uk: "React передає нове дерево рендереру Fabric теж через JSI; ядро Fabric на C++ змінює native view."
            en: "React hands the new tree to the Fabric renderer through JSI as well; Fabric's C++ core changes the native views."
          highlight: [jsi, fabric, views1, fabric-views1]
          dim: [js0, queue, mod0, views0, old]

  - id: count-crossings
    kind: prediction
    prompt:
      uk: |
        Натискання «Виконано» робить дві речі: читає серію звички з native-модуля й оновлює підпис на екрані. Візьми спрощену модель уроку: у старій архітектурі кожен перетин межі — окреме повідомлення JSON у черзі мосту.

        Скільки повідомлень мосту дає це натискання в старій архітектурі і скільки в React Native 0.86?
      en: |
        A press of “Done” does two things: it reads the habit's streak from a native module and updates the label on the screen. Take the lesson's simplified model: in the old architecture every boundary crossing is a separate JSON message in the bridge queue.

        How many bridge messages does this press produce in the old architecture, and how many in React Native 0.86?
    answer:
      type: choice
      options:
        - id: three-zero
          text:
            uk: "Стара: 3 (виклик, відповідь, зміна екрана). 0.86: 0 повідомлень — два прямі виклики через JSI"
            en: "Old: 3 (the call, the answer, the screen change). 0.86: 0 messages — two direct calls through JSI"
        - id: three-three
          text:
            uk: "В обох по 3 — у 0.86 вони просто швидше проходять міст"
            en: "3 in both — in 0.86 they just pass the bridge faster"
          why:
            uk: "У 0.86 моста немає: JSI не кладе виклики в чергу й не перетворює їх на JSON. Метод модуля й рендерер JavaScript викликає напряму."
            en: "There is no bridge in 0.86: JSI does not queue calls or turn them into JSON. JavaScript calls the module method and the renderer directly."
        - id: none-webview
          text:
            uk: "В обох 0 — React Native малює екран у вбудованому web view, тож межі немає"
            en: "0 in both — React Native draws the screen in an embedded web view, so there is no boundary"
          why:
            uk: "Web view тут немає ні в старій, ні в новій архітектурі: екран складається з native view, а JavaScript виконується окремо від них. Межу перетинає кожна дія, що торкається native-боку."
            en: "There is no web view in either architecture: the screen is made of native views, and JavaScript runs separately from them. Every action that touches the native side crosses the boundary."
        - id: two-two
          text:
            uk: "В обох по 2 — один виклик модуля й одна зміна екрана"
            en: "2 in both — one module call and one screen change"
          why:
            uk: "У мосту відповідь не повертається «сама»: вона йде назад окремим повідомленням. А в 0.86 немає повідомлень зовсім — лише прямі виклики."
            en: "On the bridge the answer does not come back “by itself”: it travels back as a separate message. And in 0.86 there are no messages at all — only direct calls."
      correct: [three-zero]
    explanation:
      uk: "У моделі уроку міст дає три повідомлення: виклик, відповідь і зміну екрана — кожне в JSON і в черзі. У 0.86 обидва перетини — прямі виклики через JSI: до TurboModule і до Fabric. Межа нікуди не зникла, зникли лише JSON і черга."
      en: "In the lesson's model the bridge gives three messages: the call, the answer and the screen change — each one in JSON and in the queue. In 0.86 both crossings are direct calls through JSI: to the TurboModule and to Fabric. The boundary did not go away; only the JSON and the queue did."

  - id: arch-stepper
    kind: example
    runtime: concept-preview
    dir: arch-stepper
    entry: main.jsx
    strings:
      legacyLabel: { uk: "Міст (до 0.82)", en: "Bridge (before 0.82)" }
      newLabel: { uk: "JSI (0.86)", en: "JSI (0.86)" }
      bridgeTag: { uk: "повідомлення мосту", en: "bridge message" }
      messagesLabel: { uk: "Повідомлень мосту", en: "Bridge messages" }
      jsiLabel: { uk: "Викликів JSI", en: "JSI calls" }
      nextStep: { uk: "Наступний крок", en: "Next step" }
      finished: { uk: "Кроки закінчилися", en: "No more steps" }
      reset: { uk: "Спочатку", en: "Start over" }
      l1: { uk: "Обробник викликає getStreak: виклик стає текстом JSON і стає в асинхронну чергу.", en: "The handler calls getStreak: the call becomes JSON text and joins the asynchronous queue." }
      l2: { uk: "Native-бік бере повідомлення з черги, розбирає JSON і запускає метод модуля.", en: "The native side takes the message from the queue, parses the JSON and runs the module method." }
      l3: { uk: "Відповідь (серія 5) стає новим повідомленням JSON і чекає в черзі назад.", en: "The answer (streak 5) becomes a new JSON message and waits in the queue back." }
      l4: { uk: "JavaScript отримує відповідь у callback, рендерить новий підпис і надсилає зміну екрана повідомленням.", en: "JavaScript gets the answer in a callback, renders the new label and sends the screen change as a message." }
      l5: { uk: "Native-бік розбирає повідомлення й змінює native view.", en: "The native side parses the message and changes the native view." }
      n1: { uk: "Обробник викликає getStreak через JSI. Модуль створюється зараз — під час першого звернення.", en: "The handler calls getStreak through JSI. The module is created now — on first access." }
      n2: { uk: "Native-метод повертає 5 одразу: метод синхронний, черги немає.", en: "The native method returns 5 at once: the method is synchronous, there is no queue." }
      n3: { uk: "React рендерить новий підпис і передає дерево рендереру Fabric через JSI.", en: "React renders the new label and hands the tree to the Fabric renderer through JSI." }
      n4: { uk: "Fabric (C++) обчислює розташування й змінює native view у потоці UI.", en: "Fabric (C++) computes the layout and changes the native view on the UI thread." }
    title:
      uk: "Крок за кроком: те саме натискання"
      en: "Step by step: the same press"
    body:
      uk: |
        `paths.js` описує обидва шляхи як дані: де працює кожен крок і що перетинає межу (`crossing`). `main.jsx` лише показує кроки й рахує перетини.

        Натисни **Запустити**, потім кілька разів **Наступний крок** на мосту.
      en: |
        `paths.js` describes both paths as data: where each step works and what crosses the boundary (`crossing`). `main.jsx` only shows the steps and counts the crossings.

        Press **Run**, then **Next step** a few times on the bridge.
    tryIt:
      uk: |
        1. Дійди до кінця шляху мосту: лічильник покаже 3 повідомлення й 0 викликів JSI.
        2. Обери **JSI (0.86)** і пройди ті самі дії: 0 повідомлень і 2 виклики JSI.
        3. У `paths.js` у першому кроці `newArch` заміни `crossing: 'jsi'` на `crossing: 'message'` і запусти знову. Лічильник тепер рахує повідомлення мосту в 0.86 — так «думає» хибна модель «JSI — це просто швидший міст». Поверни `'jsi'`.
      en: |
        1. Go to the end of the bridge path: the counter shows 3 messages and 0 JSI calls.
        2. Choose **JSI (0.86)** and go through the same actions: 0 messages and 2 JSI calls.
        3. In `paths.js`, in the first step of `newArch`, replace `crossing: 'jsi'` with `crossing: 'message'` and run again. The counter now counts a bridge message in 0.86 — that is how the wrong model “JSI is just a faster bridge” thinks. Put `'jsi'` back.
    limits:
      uk: "Перегляд react-native-web у браузері, що лише показує кроки з `paths.js`. Тут немає ні мосту, ні JSI, ні Fabric, ні native-модуля: це текстова модель уроку, а не вимірювання. Справжні шляхи мають більше деталей (потоки, планування, пакування повідомлень), а продуктивність пристрою тут не видно."
      en: "A react-native-web preview in the browser that only shows the steps from `paths.js`. There is no bridge, JSI, Fabric or native module here: it is the lesson's text model, not a measurement. The real paths have more detail (threads, scheduling, message batching), and a device's performance is not visible here."

  - id: reading-readmes
    kind: explanation
    title:
      uk: "Як читати README native-бібліотеки"
      en: "How to read a native library's README"
    body:
      uk: |
        README бібліотек часто ще містять інструкції для старої архітектури. Ось за чим їх розрізнити:

        | Ознака | Стара архітектура | Нова архітектура |
        |---|---|---|
        | позначка версії | «для React Native 0.70 і старіших», «гілка 1.x» | «0.82 і новіші», «New Architecture» |
        | доступ до модуля в JS | `NativeModules.X` | `TurboModuleRegistry.getEnforcing<Spec>('X')` |
        | опис модуля | немає типізованого опису | файл специфікації `NativeX.ts` і `codegenConfig` у `package.json` |
        | native view | `requireNativeComponent('X')` | `codegenNativeComponent<NativeProps>('X')` |
        | прапорці | «вимкни `newArchEnabled`» | — |

        Інструкція «постав `newArchEnabled=false`» у твоєму проєкті на 0.86 нічого не дасть: з 0.82 цей прапорець ігнорується. Отже, бібліотека, яка працює **лише** так, потребує перевірки сумісності — про це наступні уроки.
      en: |
        Library READMEs often still contain instructions for the old architecture. This is how to tell them apart:

        | Sign | Old architecture | New architecture |
        |---|---|---|
        | version label | “for React Native 0.70 and older”, “the 1.x line” | “0.82 and newer”, “New Architecture” |
        | module access in JS | `NativeModules.X` | `TurboModuleRegistry.getEnforcing<Spec>('X')` |
        | module description | no typed description | a spec file `NativeX.ts` and `codegenConfig` in `package.json` |
        | native view | `requireNativeComponent('X')` | `codegenNativeComponent<NativeProps>('X')` |
        | flags | “turn `newArchEnabled` off” | — |

        The instruction “set `newArchEnabled=false`” does nothing in your 0.86 project: since 0.82 that flag is ignored. So a library that works **only** that way needs a compatibility check — that is what the next lessons are about.

  - id: readme-labels
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: readme-labels
    entry: main.jsx
    editable: [labels.js]
    strings:
      notesHeading: { uk: "Нотатки для колеги", en: "Notes for a teammate" }
      ra: { uk: "Версія 3.x підтримує React Native 0.82 і новіші (лише New Architecture).", en: "Version 3.x supports React Native 0.82 and newer (New Architecture only)." }
      rb: { uk: "Отримай модуль через TurboModuleRegistry.getEnforcing<Spec>('StepSensor') з файла specs/NativeStepSensor.ts.", en: "Get the module with TurboModuleRegistry.getEnforcing<Spec>('StepSensor') from the file specs/NativeStepSensor.ts." }
      rc: { uk: "Версія 1.x (React Native 0.70 і старіші): читай модуль як NativeModules.StepSensor; кожен виклик повертає Promise через міст.", en: "Version 1.x (React Native 0.70 and older): read the module as NativeModules.StepSensor; every call returns a Promise through the bridge." }
      rd: { uk: "package.json пакета має codegenConfig із \"type\": \"modules\"; native-інтерфейси генеруються під час збирання.", en: "The package's package.json has a codegenConfig with \"type\": \"modules\"; the native interfaces are generated during the build." }
      re: { uk: "Щоб використати 1.x у новішому застосунку, постав newArchEnabled=false в android/gradle.properties.", en: "To use 1.x in a newer app, set newArchEnabled=false in android/gradle.properties." }
      rf: { uk: "Графік кроків — компонент Fabric, оголошений через codegenNativeComponent<NativeProps>('StepChart').", en: "The step chart is a Fabric component declared with codegenNativeComponent<NativeProps>('StepChart')." }
      rg: { uk: "У 1.x графік підключають через requireNativeComponent('StepChart').", en: "In 1.x the chart is loaded with requireNativeComponent('StepChart')." }
      noteJsi: { uk: "JSI дає JavaScript прямі посилання на об’єкти C++, тож виклики йдуть без JSON і черги.", en: "JSI gives JavaScript direct references to C++ objects, so calls go without JSON and without a queue." }
      noteFabric: { uk: "Fabric — рендерер на C++, що отримує дерево React через JSI і змінює native view.", en: "Fabric is the C++ renderer that receives React’s tree through JSI and changes the native views." }
      noteTurbo: { uk: "TurboModule — native-модуль, який створюється під час першого звернення й викликається через JSI.", en: "A TurboModule is a native module that is created on first access and called through JSI." }
    title:
      uk: "Розбери README і поясни три блоки"
      en: "Sort a README and explain three boxes"
    instructions:
      uk: |
        Тобі дали README синтетичної бібліотеки `step-sensor` (`readme.js`): у ньому змішано інструкції для старої лінійки 1.x і поточної 3.x. Заповни `labels.js`:

        1. У `labels` для кожного пункту README (`a`…`g`) напиши `'legacy'` (стара архітектура) або `'new'` (нова).
        2. У `notes` — три нотатки для колеги, по одній на кожен блок діаграми: `box` — `'jsi'`, `'fabric'` чи `'turbomodules'` (кожен рівно раз), `version` — `'0.86'`, версія React Native, на яку націлений курс, і `text` — одне власне речення, щонайменше 30 символів, про те, що робить цей блок.

        Праворуч видно твої позначки й нотатки. Перевірки порівнюють позначки з правильними, а в нотатках перевіряють блок, версію й довжину тексту — зміст речення перевіряєш ти сам.
      en: |
        You got the README of a synthetic library, `step-sensor` (`readme.js`): it mixes instructions for the old 1.x line and the current 3.x line. Fill in `labels.js`:

        1. In `labels`, for every README item (`a`…`g`) write `'legacy'` (old architecture) or `'new'` (new architecture).
        2. In `notes`, three notes for a teammate, one per box of the diagram: `box` — `'jsi'`, `'fabric'` or `'turbomodules'` (each exactly once), `version` — `'0.86'`, the React Native version the course targets, and `text` — one sentence of your own, at least 30 characters, about what that box does.

        Your labels and notes show on the right. The checks compare the labels with the right ones, and in the notes they check the box, the version and the length of the text — the content of the sentence is yours to check.
    testTitles:
      "every README item has the label legacy or new":
        uk: "Кожен пункт README має позначку `'legacy'` чи `'new'`"
        en: "Every README item has the label `'legacy'` or `'new'`"
      "the old-architecture items are labelled legacy":
        uk: "Пункти старої архітектури позначено `'legacy'`"
        en: "The old-architecture items are labelled `'legacy'`"
      "the New Architecture items are labelled new":
        uk: "Пункти нової архітектури позначено `'new'`"
        en: "The new-architecture items are labelled `'new'`"
      "there are three notes, one for each box":
        uk: "Три нотатки — по одній на `jsi`, `fabric` і `turbomodules`"
        en: "Three notes — one each for `jsi`, `fabric` and `turbomodules`"
      "every note names React Native 0.86":
        uk: "Кожна нотатка має `version: '0.86'`"
        en: "Every note has `version: '0.86'`"
      "every note explains its box in at least 30 characters":
        uk: "Текст кожної нотатки — щонайменше 30 символів"
        en: "The text of every note is at least 30 characters"
    hints:
      nudge:
        uk: "Для кожного пункту знайди в таблиці «Як читати README» ознаку: позначку версії, спосіб доступу до модуля, опис модуля, спосіб підключити native view чи прапорець."
        en: "For each item, find a sign from the table “How to read a native library's README”: a version label, the way the module is reached, the module description, the way a native view is loaded, or a flag."
      explanation:
        uk: "Пункт може згадувати архітектуру й при цьому описувати стару: інструкція, що вимикає нову архітектуру, — для старої, і в 0.86 вона нічого не дасть. Наприклад, рядок «встанови гілку 0.x і пропиши модуль у MainApplication» — стара архітектура, хоч слова «bridge» в ньому немає. Для нотаток: блок діаграми й одна річ, яку він робить, — як у підписах кроків діаграми, але своїми словами."
        en: "An item can mention the architecture and still describe the old one: an instruction that turns the new architecture off is for the old one, and in 0.86 it does nothing. For example, the line “install the 0.x line and register the module in MainApplication” is the old architecture, even though it has no word “bridge”. For the notes: a box of the diagram and one thing it does — like the captions of the diagram's steps, but in your own words."
    solutionNote:
      uk: "Стара архітектура — пункти з `NativeModules`, `requireNativeComponent` і `newArchEnabled=false` (лінійка 1.x). Нова — позначка «0.82 і новіші», `TurboModuleRegistry`, `codegenConfig` і `codegenNativeComponent`. Нотатки прив’язано до блоків і до версії: те, що правдиве для 0.86, не обов’язково було правдою для 0.70."
      en: "The old architecture is the items with `NativeModules`, `requireNativeComponent` and `newArchEnabled=false` (the 1.x line). The new one is the label “0.82 and newer”, `TurboModuleRegistry`, `codegenConfig` and `codegenNativeComponent`. The notes are tied to boxes and to a version: what is true for 0.86 was not necessarily true for 0.70."
    feedback:
      - when: { test: "every README item has the label legacy or new" }
        message:
          uk: "Ця перевірка чекає в `labels` для кожного з `a`…`g` рядок `'legacy'` або `'new'` — малими літерами, без пробілів. Порожній рядок `''` теж не підходить."
          en: "This check expects, in `labels`, the text `'legacy'` or `'new'` for each of `a`…`g` — lowercase, no spaces. An empty `''` does not count either."
      - when: { test: "the old-architecture items are labelled legacy" }
        message:
          uk: "Ця перевірка чекає `'legacy'` у трьох пунктах лінійки 1.x. Інструкція, яка вимикає нову архітектуру прапорцем, належить старій — навіть якщо згадує нову."
          en: "This check expects `'legacy'` in the three items of the 1.x line. An instruction that turns the new architecture off with a flag belongs to the old one — even though it mentions the new one."
      - when: { test: "the New Architecture items are labelled new" }
        message:
          uk: "Ця перевірка чекає `'new'` у чотирьох пунктах лінійки 3.x: позначка версії 0.82+, доступ через `TurboModuleRegistry`, `codegenConfig` і компонент Fabric."
          en: "This check expects `'new'` in the four items of the 3.x line: the 0.82+ version label, access through `TurboModuleRegistry`, `codegenConfig` and the Fabric component."
      - when: { test: "there are three notes, one for each box" }
        message:
          uk: "Ця перевірка чекає в `notes` рівно три нотатки з `box` `'jsi'`, `'fabric'` і `'turbomodules'` — кожен блок один раз, у будь-якому порядку."
          en: "This check expects exactly three notes in `notes` with `box` `'jsi'`, `'fabric'` and `'turbomodules'` — each box once, in any order."
      - when: { test: "every note names React Native 0.86" }
        message:
          uk: "Ця перевірка чекає `version: '0.86'` у кожній нотатці — текстом у лапках. 0.76 — версія, з якої нова архітектура стала типовою, а курс націлений на 0.86."
          en: "This check expects `version: '0.86'` in every note — as text in quotes. 0.76 is the version in which the new architecture became the default, and the course targets 0.86."
      - when: { test: "every note explains its box in at least 30 characters" }
        message:
          uk: "Ця перевірка чекає в кожній нотатці `text` щонайменше з 30 символів: назва блоку — ще не пояснення. Напиши, що блок робить."
          en: "This check expects a `text` of at least 30 characters in every note: the name of a box is not an explanation yet. Write what the box does."
    limits:
      uk: "Перегляд react-native-web у браузері. Бібліотека `step-sensor` вигадана для уроку; тут нічого не встановлюється й не збирається, а перевірки бачать лише твої позначки й нотатки."
      en: "A react-native-web preview in the browser. The `step-sensor` library is invented for the lesson; nothing is installed or built here, and the checks see only your labels and notes."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: commit-target
        from: rn-01-01-native-vs-web
        prompt:
          uk: "Що створює commit у застосунку React Native на телефоні?"
          en: "What does commit create in a React Native app on a phone?"
        answer:
          type: choice
          options:
            - id: native-views
              text: { uk: "Native view операційної системи: `android.view.View` чи `UIView`", en: "The operating system's native views: `android.view.View` or `UIView`" }
            - id: dom
              text: { uk: "Елементи DOM у вбудованому браузері", en: "DOM elements in an embedded browser" }
              why:
                uk: "Браузера в застосунку немає зовсім, тож немає й DOM. Рендерер React Native створює native view."
                en: "There is no browser in the app at all, so there is no DOM either. React Native's renderer creates native views."
            - id: canvas
              text: { uk: "Одне полотно, на якому React Native малює всі пікселі сам", en: "A single canvas on which React Native draws every pixel itself" }
              why:
                uk: "React Native не малює пікселі сам: кожен `View` чи `Text` стає справжнім елементом інтерфейсу платформи, і малює його платформа."
                en: "React Native does not draw the pixels itself: every `View` or `Text` becomes a real interface element of the platform, and the platform draws it."
          correct: [native-views]
        explanation:
          uk: "Commit у React Native створює й змінює native view. У 0.86 це робить рендерер Fabric, отримавши дерево через JSI."
          en: "Commit in React Native creates and changes native views. In 0.86 the Fabric renderer does it, having received the tree through JSI."

  - id: to-project
    kind: transfer
    checkpoint: CP-RN
    body:
      uk: "У цьому розділі твій проєкт не змінюється: кроку проєкту в RN-12 немає. Відкрий `package.json` свого native-проєкту з CP-RN і знайди версію `react-native` — саме її ставиш у нотатки й порівнюєш із README, коли додаєш native-бібліотеку."
      en: "Your project does not change in this unit: RN-12 has no project step. Open the `package.json` of your native project from CP-RN and find the `react-native` version — that is the version you put in notes and compare with READMEs when you add a native library."
