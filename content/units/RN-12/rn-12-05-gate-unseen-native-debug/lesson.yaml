        ```ts
        export declare function today(): Promise<string>;
        export declare function formatDay(day: string): string;
        ```

        **Оновлення — зміна колеги в `App.tsx`:** у першому рядку імпорту додай `useEffect` (`import { useCallback, useEffect, useState } from 'react';`), а рядок `const [day, setDay] = useState(today());` заміни на:

        ```tsx
