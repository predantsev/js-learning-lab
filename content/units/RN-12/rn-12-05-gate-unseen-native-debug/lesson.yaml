id: rn-12-05-gate-unseen-native-debug
unit: RN-12
title:
  uk: "Рубіж: незнайоме нативне налагодження"
  en: "Gate: unseen native debugging"
kind: assessment
minutes: 40
contentVersion: 1
purpose:
  uk: "Перша частина підсумкового нативного рубежу. Без підказок ти розбираєш незнайомий застосунок планувальника після оновлення залежності: release-збірка не збирається, а коли збереться — застосунок закривається після повернення із фону; далі панель нагадувань зависає, коли дозвіл забрали у фоні. Ти знаходиш причини в журналі збирання й журналі пристрою, лагодиш, доводиш перевірками на заявленій цілі й чесно записуєш, яке покриття платформ дав, а якого — ні."
  en: "The first part of the final native gate. Without hints you take apart an unfamiliar planner app after a dependency update: the release build does not build, and once it does, the app closes after coming back from the background; then the reminder panel hangs when the permission was taken away in the background. You find the causes in the build log and the device log, repair them, prove the fix with checks on the declared target and honestly record which platform coverage you gave and which you did not."
objectives:
  - uk: "Без підказок діагностувати й виправити незнайомий нативний дефект на заявленій цілі за журналом збирання, журналом пристрою й звітом про падіння."
    en: "Diagnose and repair, without hints, an unseen native defect on the declared target using build logs, device logs and crash reports."
  - uk: "Довести виправлення перевірками перезапуску, офлайну, життєвого циклу, доступності й безпеки та сказати, яке покриття платформ вдалося дати, а яке — ні."
    en: "Prove the fix with restart, offline, lifecycle, accessibility and security checks, and state which platform coverage you could and could not provide."
prerequisites: [rn-12-04-cumulative-review]
subskills:
  - { family: N-10, skill: "native logs/build errors", depth: assess }
  - { family: N-10, skill: "crash diagnosis", depth: assess }
  - { family: N-10, skill: "E2E and platform difference coverage", depth: assess }
  - { family: N-12, skill: "restart/offline/lifecycle/security/a11y/performance", depth: assess }
glossary: []
selfCheck: [resume-crash, stuck-reminders]

blocks:
  - id: gate-rules
    kind: explanation
    title:
      uk: "Як влаштовано рубіж"
      en: "How the gate works"
    body:
      uk: |
        Розв’язок тут відкривається лише тоді, коли всі перевірки вже пройдено. Підказки є лише в завданні із налагодження панелі — і якщо ти їх відкриєш, після проходження платформа покаже «Вправу виконано (з підказками)», і так це й буде записано в прогресі. Перевірки називають **симптом**, який бачить людина, а не причину: причину знаходиш ти.

        Застосунок — «на сьогодні» із планувальника: список справ, які настав час зробити, і панель нагадувань. Колега оновив пакет дат `day-clock` з 1.4.0 до 2.0.0 і каже: «у мене все зібралося». Це не так.

        - **Частина 1, на платформі:** два завдання в перегляді — збирання й падіння після повернення (з діагнозом за наданими журналами), потім панель нагадувань, що зависає.
        - **Частина 2, на заявленій цілі:** той самий застосунок як справжній проєкт Expo SDK 57. Ти відтворюєш збої, лагодиш, проходиш перевірки й заповнюєш матрицю покриття. Без native-інструментів частину 2 позначають як невиконану.

        Знадобляться RN-04 (`AppState`), RN-07 (журнали й падіння), RN-08 (записи доказів і пропусків) і RN-09 (дозволи).
      en: |
        The solution here opens only once every check has passed. There are hints only in the panel debugging task — if you open them, after the pass the platform shows “Exercise done (with hints)”, and that is how it is recorded in your progress. The checks name the **symptom** a person sees, not the cause: finding the cause is your job.

        The app is the planner's “today” screen: the list of tasks that are due and a reminder panel. A colleague updated the date package `day-clock` from 1.4.0 to 2.0.0 and says: “it built fine for me”. It did not.

        - **Part 1, on the platform:** two tasks in the preview — the build and the crash after a return (with a diagnosis from supplied logs), then the reminder panel that hangs.
        - **Part 2, on the declared target:** the same app as a real Expo SDK 57 project. You reproduce the failures, repair them, go through the checks and fill in a coverage matrix. Without native tooling, part 2 is marked as not performed.

        You will need RN-04 (`AppState`), RN-07 (logs and crashes), RN-08 (evidence and skip records) and RN-09 (permissions).

  - id: resume-crash
    kind: exercise
    mode: independent
    assessment: true
    runtime: concept-preview
    dir: resume-crash
    entry: main.jsx
    editable: [PlannerScreen.jsx, useResumeDay.js, diagnosis.js]
    strings:
      dueOn: { uk: "На", en: "Due on" }
      t1: { uk: "Полити квіти", en: "Water the plants" }
      t2: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      t3: { uk: "Написати бабусі", en: "Write to grandma" }
      t5: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      simLeave: { uk: "Згорнути застосунок", en: "Leave the app" }
      simMidnight: { uk: "Минула північ", en: "Midnight passes" }
      simReturn: { uk: "Повернутися", en: "Come back" }
    title:
      uk: "Після оновлення day-clock: збирання й повернення із фону"
      en: "After the day-clock update: the build and the return from the background"
    instructions:
      uk: |
        Застосунок після оновлення `day-clock` до 2.0.0 (пакет — у теці `day-clock/`, його зміни — у `day-clock/CHANGELOG.txt`). Не запускається, а в справжньому проєкті release-збірка падала на кроці збирання bundle — журнал цього кроку в `build-log.txt`. Коли збирання полагодили, застосунок на телефоні закривався після повернення із фону — журнал пристрою в `crash-report.txt`.

        Змінювати можна `PlannerScreen.jsx`, `useResumeDay.js` і `diagnosis.js`. Оновлення лишається: `day-clock` 2.0.0 не повертай.

        Готовий результат:

        - екран запускається й показує справи на день запуску;
        - повернення до застосунку нічого не кидає, а після півночі у фоні екран показує справи на новий день;
        - коли екран зникає, по ньому не лишається слухачів `AppState`;
        - у `diagnosis.js`: номер рядка із першою справжньою помилкою в `build-log.txt`, номер першого рядка `crash-report.txt`, що називає помилку падіння, і причина кожного збою із переліку в коментарі.

        Перевірки запускають екран на свіжому симульованому телефоні, згортають застосунок, переводять календар через північ і повертаються; діагноз порівнюють із однією правильною відповіддю на кожне поле.
      en: |
        The app after updating `day-clock` to 2.0.0 (the package is in the `day-clock/` folder, its changes in `day-clock/CHANGELOG.txt`). It does not start, and in the real project the release build failed at the bundling step — the log of that step is in `build-log.txt`. Once the bundling was repaired, the app on the phone closed after coming back from the background — the device log is in `crash-report.txt`.

        You may change `PlannerScreen.jsx`, `useResumeDay.js` and `diagnosis.js`. The update stays: do not go back from `day-clock` 2.0.0.

        The finished result:

        - the screen starts and shows the tasks due on the launch day;
        - coming back to the app throws nothing, and after midnight in the background the screen shows the tasks due on the new day;
        - when the screen goes away, it leaves no `AppState` listeners behind;
        - in `diagnosis.js`: the number of the line with the first real error in `build-log.txt`, the number of the first line of `crash-report.txt` that names the crash's error, and the cause of each failure from the list in the comment.

        The checks start the screen on a fresh simulated phone, send the app to the background, move the calendar past midnight and come back; the diagnosis is compared with one correct answer per field.
    testTitles:
      "the screen shows the tasks due on the launch day":
        uk: "Екран показує справи на день запуску"
        en: "The screen shows the tasks due on the launch day"
      "coming back to the app does not throw":
        uk: "Повернення до застосунку нічого не кидає"
        en: "Coming back to the app throws nothing"
      "after midnight in the background a return shows the tasks due on the new day":
        uk: "Після півночі у фоні повернення показує справи на новий день"
        en: "After midnight in the background a return shows the tasks due on the new day"
      "the screen leaves no AppState listener behind when it unmounts":
        uk: "Екран не лишає слухачів `AppState`, коли зникає"
        en: "The screen leaves no `AppState` listener behind when it unmounts"
      "the diagnosis names the first real error of the build log":
        uk: "`diagnosis.buildLine` — твоя відповідь про журнал збирання"
        en: "`diagnosis.buildLine` — your answer about the build log"
      "the diagnosis names the cause of the bundling failure":
        uk: "`diagnosis.buildCause` — твоя відповідь про причину збою збирання"
        en: "`diagnosis.buildCause` — your answer about the cause of the build failure"
      "the diagnosis names the first line of the crash error":
        uk: "`diagnosis.crashLine` — твоя відповідь про журнал пристрою"
        en: "`diagnosis.crashLine` — your answer about the device log"
      "the diagnosis names the cause of the crash":
        uk: "`diagnosis.crashCause` — твоя відповідь про причину падіння"
        en: "`diagnosis.crashCause` — your answer about the cause of the crash"
    solutionNote:
      uk: |
        - **Збирання.** Рядки `WARN` — лише попередження; перша справжня помилка — рядок 9, `Unable to resolve module day-clock/format`: версія 2.0.0 прибрала цей шлях, а `formatDay` переїхав у головний вхід пакета (`removed-export`). Версія тут правильна — змінився API.
        - **Падіння.** Перший рядок, що називає помилку, — 7, `TypeError` із тегом `ReactNativeJS`; `FATAL EXCEPTION` нижче лише каже, що release-збірка через цю помилку JavaScript закрилася. `today()` у 2.0.0 повертає Promise, а обробник повернення брав від нього `.slice` (`promise-used-as-value`). Виправлення — дочекатися значення: `today(clock).then(onDay)` або `await`.
        - **Прибирання.** Підписка на `AppState` повертає функцію `remove`, і cleanup ефекту її викликає.
      en: |
        - **The build.** The `WARN` lines are only warnings; the first real error is line 9, `Unable to resolve module day-clock/format`: version 2.0.0 removed that path, and `formatDay` moved to the package's main entry (`removed-export`). The version is right here — the API changed.
        - **The crash.** The first line that names the error is 7, a `TypeError` with the `ReactNativeJS` tag; the `FATAL EXCEPTION` below only says that the release build closed because of this JavaScript error. In 2.0.0 `today()` returns a Promise, and the return handler took `.slice` from it (`promise-used-as-value`). The fix is to wait for the value: `today(clock).then(onDay)` or `await`.
        - **Cleanup.** The `AppState` subscription returns a `remove` function, and the effect's cleanup calls it.
    feedback:
      - when: { test: "the screen shows the tasks due on the launch day" }
        message:
          uk: "Ця перевірка запускає екран на телефоні із днем 2026-03-01 і чекає заголовок «На 01.03.2026: 1» і справу, що настала. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку, через яку застосунок не запускається."
          en: "This check starts the screen on a phone whose day is 2026-03-01 and expects the heading “Due on 01.03.2026: 1” and the task that is due. If every check fails at once, first fix the first error that keeps the app from starting."
      - when: { test: "coming back to the app does not throw" }
        message:
          uk: "Ця перевірка згортає застосунок, повертається й чекає, що повернення нічого не кидає. Текст помилки, яку воно кинуло, — у повідомленні перевірки."
          en: "This check sends the app to the background, comes back and expects the return to throw nothing. The text of the error it threw is in the check's message."
      - when: { test: "after midnight in the background a return shows the tasks due on the new day" }
        message:
          uk: "Ця перевірка згортає застосунок, переводить календар на 2026-03-02, повертається й за 0,1 с чекає заголовок «На 02.03.2026: 2»."
          en: "This check sends the app to the background, moves the calendar to 2026-03-02, comes back and within 0.1 s expects the heading “Due on 02.03.2026: 2”."
      - when: { test: "the screen leaves no AppState listener behind when it unmounts" }
        message:
          uk: "Ця перевірка прибирає екран зі сторінки й чекає, що слухачів `AppState` не лишилося."
          en: "This check removes the screen from the page and expects no `AppState` listeners to remain."
    limits:
      uk: "Перегляд react-native-web у браузері, а не release-збірка. Телефон тут симульований: `sim.js` замість `AppState` і годинника, тека `day-clock/` замість встановленого пакета; що саме вони роблять інакше, сказано в їхніх коментарях. Неможливий імпорт тут зупиняє перегляд так само, як Metro зупиняє збирання, але журналів Metro, Gradle і пристрою тут не виникає — `build-log.txt` знято з `npx expo export`, а `crash-report.txt` складено для уроку. Справжнє падіння й справжні журнали — у частині 2."
      en: "A react-native-web preview in the browser, not a release build. The phone here is simulated: `sim.js` instead of `AppState` and the clock, the `day-clock/` folder instead of an installed package; what they do differently is said in their comments. An impossible import stops the preview here just as Metro stops the bundling, but no Metro, Gradle or device log arises here — `build-log.txt` was captured from `npx expo export`, and `crash-report.txt` was assembled for the lesson. The real crash and the real logs are in part 2."

  - id: stuck-reminders
    kind: exercise
    mode: debug
    assessment: true
    runtime: concept-preview
    dir: stuck-reminders
    entry: main.jsx
    editable: [ReminderPanel.jsx]
    strings:
      dueToday: { uk: "Час зробити", en: "Due today" }
      checking: { uk: "Перевіряю нагадування…", en: "Checking reminders…" }
      remindersOn: { uk: "Нагадування увімкнено, справ на сьогодні", en: "Reminders are on, tasks for today" }
      remindersOff: { uk: "Нагадування вимкнено. Справи на сьогодні й далі в списку вище.", en: "Reminders are off. The tasks due today are still listed above." }
      openSettings: { uk: "Відкрити налаштування", en: "Open settings" }
      t1: { uk: "Полити квіти", en: "Water the plants" }
      t2: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      simLeave: { uk: "Згорнути застосунок", en: "Leave the app" }
      simRevoke: { uk: "Налаштування: заборонити", en: "Settings: turn off" }
      simAllow: { uk: "Налаштування: дозволити", en: "Settings: allow" }
      simReturn: { uk: "Повернутися", en: "Come back" }
    title:
      uk: "Панель нагадувань, що зависає"
      en: "A reminder panel that hangs"
    instructions:
      uk: |
        Коли збій після повернення полагодили, з’явився другий: людина дозволила сповіщення, згорнула застосунок, заборонила їх у налаштуваннях і повернулася — а панель нагадувань назавжди лишилася на «Перевіряю нагадування…». Модуль сповіщень симульовано в `notifySim.js`.

        Змінювати можна лише `ReminderPanel.jsx`. Готовий результат:

        - із дозволом панель вмикає нагадування для кожної справи на сьогодні й пише «%%remindersOn%%: N»;
        - без дозволу — після відмови на запуску чи після заборони у фоні — панель за 0,2 с показує «%%remindersOff%%» і кнопку «%%openSettings%%», що викликає `notifications.openSettings()`;
        - якщо запланувати нагадування не вдалося, панель показує те саме, що й без дозволу;
        - коли людина знову дозволить сповіщення в налаштуваннях і повернеться, нагадування вмикаються знову;
        - коли панель зникає, по ній не лишається слухачів `AppState`.
      en: |
        Once the crash after a return was repaired, a second failure showed up: the person allowed notifications, sent the app to the background, turned them off in Settings and came back — and the reminder panel stayed on “Checking reminders…” forever. The notification module is simulated in `notifySim.js`.

        You may change only `ReminderPanel.jsx`. The finished result:

        - with the permission, the panel turns on reminders for every task due today and says “%%remindersOn%%: N”;
        - without the permission — after a denial at launch or after turning it off in the background — within 0.2 s the panel shows “%%remindersOff%%” and an “%%openSettings%%” button that calls `notifications.openSettings()`;
        - if scheduling the reminders fails, the panel shows the same as without the permission;
        - when the person allows notifications again in Settings and comes back, the reminders turn on again;
        - when the panel goes away, it leaves no `AppState` listeners behind.
    testTitles:
      "with the permission allowed the panel turns reminders on":
        uk: "З дозволом панель вмикає нагадування"
        en: "With the permission allowed the panel turns reminders on"
      "after a revoke in the background a return shows reminders off and a way to the settings":
        uk: "Після заборони у фоні повернення показує «вимкнено» й шлях до налаштувань"
        en: "After a revoke in the background a return shows “off” and a way to the settings"
      "a denial at launch shows reminders off, not a spinner":
        uk: "Відмова на запуску показує «вимкнено», а не індикатор завантаження"
        en: "A denial at launch shows “off”, not a spinner"
      "a failed scheduling shows reminders off, not a spinner":
        uk: "Невдале планування показує «вимкнено», а не індикатор завантаження"
        en: "A failed scheduling shows “off”, not a spinner"
      "allowing again in the settings turns reminders back on after a return":
        uk: "Новий дозвіл у налаштуваннях знову вмикає нагадування після повернення"
        en: "Allowing again in the settings turns reminders back on after a return"
      "the panel leaves no AppState listener behind when it unmounts":
        uk: "Панель не лишає слухачів `AppState`, коли зникає"
        en: "The panel leaves no `AppState` listener behind when it unmounts"
    hints:
      nudge:
        uk: "Пройди `refresh` від `setStatus('checking')` до кінця кожним шляхом: із дозволом, без нього і коли виклик кидає помилку. Які шляхи лишають стан таким, яким він був?"
        en: "Follow `refresh` from `setStatus('checking')` to the end along every path: with the permission, without it and when a call throws. Which paths leave the state as it was?"
      explanation:
        uk: "У кожного стану має бути вихід для кожного результату. Наприклад, екран, що ставить «завантажено» лише після вдалого запиту, після помилки мережі назавжди лишається на «завантажую». Лікує це окремий стан для невдачі — і в гілці «ні», і в `catch` — разом зі способом, яким людина може піти далі."
        en: "Every state needs a way out for every outcome. For example, a screen that sets “loaded” only after a successful request stays on “loading” forever after a network error. The cure is a separate state for the failure — both in the “no” branch and in `catch` — together with a way for the person to go on."
    solutionNote:
      uk: "Панель правильно перечитувала дозвіл при поверненні, але знала лише один вихід зі стану `checking` — `on`. Без дозволу, а також коли планування кидало помилку, стан ніколи не змінювався. Тепер кожен шлях закінчується станом: немає дозволу — `off` із кнопкою до налаштувань, помилка планування — теж `off`, а наступне повернення перечитує дозвіл знову."
      en: "The panel read the permission again on return correctly, but knew only one way out of the `checking` state — `on`. Without the permission, and when scheduling threw, the state never changed. Now every path ends in a state: no permission is `off` with a button to the settings, a scheduling error is `off` too, and the next return reads the permission again."
    feedback:
      - when: { test: "with the permission allowed the panel turns reminders on" }
        message:
          uk: "Ця перевірка запускає панель із дозволом і за 0,2 с чекає «%%remindersOn%%: 2» і два заплановані нагадування."
          en: "This check starts the panel with the permission and within 0.2 s expects “%%remindersOn%%: 2” and two scheduled reminders."
      - when: { test: "after a revoke in the background a return shows reminders off and a way to the settings" }
        message:
          uk: "Ця перевірка дозволяє сповіщення, згортає застосунок, забирає дозвіл, повертається й за 0,2 с чекає «%%remindersOff%%» і кнопку «%%openSettings%%», натискання якої один раз викликає `notifications.openSettings()`."
          en: "This check allows notifications, sends the app to the background, takes the permission away, comes back and within 0.2 s expects “%%remindersOff%%” and an “%%openSettings%%” button whose press calls `notifications.openSettings()` once."
      - when: { test: "a denial at launch shows reminders off, not a spinner" }
        message:
          uk: "Ця перевірка запускає панель без дозволу, відповідає на запит відмовою й за 0,2 с чекає «%%remindersOff%%» і кнопку «%%openSettings%%»."
          en: "This check starts the panel without the permission, answers the request with a denial and within 0.2 s expects “%%remindersOff%%” and an “%%openSettings%%” button."
      - when: { test: "a failed scheduling shows reminders off, not a spinner" }
        message:
          uk: "Ця перевірка дає дозвіл, але робить так, що `scheduleNotificationAsync` кидає помилку, і за 0,2 с чекає «%%remindersOff%%»."
          en: "This check gives the permission but makes `scheduleNotificationAsync` throw, and within 0.2 s expects “%%remindersOff%%”."
      - when: { test: "allowing again in the settings turns reminders back on after a return" }
        message:
          uk: "Ця перевірка забирає дозвіл у фоні й повертається, а потім дозволяє знову у фоні й повертається, і чекає «%%remindersOn%%: 2»."
          en: "This check takes the permission away in the background and comes back, then allows it again in the background and comes back, and expects “%%remindersOn%%: 2”."
      - when: { test: "the panel leaves no AppState listener behind when it unmounts" }
        message:
          uk: "Ця перевірка прибирає панель зі сторінки й чекає, що слухачів `AppState` не лишилося."
          en: "This check removes the panel from the page and expects no `AppState` listeners to remain."
    limits:
      uk: "Перегляд react-native-web у браузері. `notifySim.js` лише відтворює форму викликів expo-notifications: справжнього системного діалогу, налаштувань і сповіщень тут немає, а заборона в налаштуваннях не завершує процес, як це може зробити Android. Як поводиться твоя ціль, перевіряєш у частині 2."
      en: "A react-native-web preview in the browser. `notifySim.js` only reproduces the shape of the expo-notifications calls: there is no real system dialog, settings or notifications here, and turning the permission off does not end the process, as Android may do. How your target behaves, you check in part 2."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: де шукати"
      en: "Recall: where to look"
    items:
      - id: first-real-error
        from: rn-07-01-native-logs-build-errors
        prompt:
          uk: "Release-збірка впала, і журнал закінчується рядком `BUILD FAILED`. Де в такому журналі причина?"
          en: "A release build failed, and the log ends with the line `BUILD FAILED`. Where in such a log is the cause?"
        answer:
          type: choice
          options:
            - id: first-error
              text: { uk: "У першому повідомленні про помилку вище — після попереджень, а не серед них", en: "In the first error message above — after the warnings, not among them" }
            - id: last-line
              text: { uk: "В останньому рядку — `BUILD FAILED`", en: "In the last line — `BUILD FAILED`" }
              why:
                uk: "`BUILD FAILED` каже лише, що збирання не вдалося. Що й де — написано вище, у першому повідомленні про помилку."
                en: "`BUILD FAILED` only says the build failed. What and where is written above, in the first error message."
            - id: first-warning
              text: { uk: "У першому рядку з `WARN` — він найраніший", en: "In the first line with `WARN` — it is the earliest" }
              why:
                uk: "Попередження можуть підказати, але збирання вони не зупиняють. Шукай першу **помилку**."
                en: "Warnings may give a clue, but they do not stop the build. Look for the first **error**."
          correct: [first-error]
        explanation:
          uk: "Найраніша помилка — найближча до причини; усе після неї часто лише наслідки."
          en: "The earliest error is the closest to the cause; everything after it is often just consequences."

  - id: on-target
    kind: local-task
    runtime: local-native
    title:
      uk: "Частина 2: той самий застосунок на заявленій цілі"
      en: "Part 2: the same app on your declared target"
    intro:
      uk: |
        Без підказок: кроки лише відтворюють збої й кажуть, що треба довести. Як лагодити — вирішуєш ти.

        **Що перевірено під час підготовки уроку (React Native 0.86.3, Expo SDK 57, expo-notifications 57.0.21, комп’ютер на macOS без Android SDK і без Xcode):** версія 1 проходить `npx tsc --noEmit` і `npx expo export --platform android`; після оновлення `npx expo export` зупиняється на помилці збирання bundle, а `npx tsc --noEmit` друкує дві помилки; `npx expo prebuild --platform android --no-install` генерує проєкт. Native-збирання, встановлення, падіння на пристрої, дозволи й перевірки на цілі **не перевірено** — ми не бачили їхнього виводу.

        Якщо native-інструментів немає, однаково зроби кроки 1–2, відтвори перший збій командою `npx expo export --platform android` (їй не потрібні ні Android SDK, ні Xcode — саме так ми його й відтворили) і заповни `GATE.md`: кожну перевірку й кожну клітинку матриці, яких ти не виконав, — записом пропуску з причиною й планом повернення, як у RN-08. Потім натисни **«У мене немає емулятора чи пристрою»**: частину 2 буде записано як невиконану.

        **Версія 1 — `vendor/day-clock/package.json`:**

        ```json
        {
          "name": "day-clock",
          "version": "1.4.0",
          "main": "index.js",
          "types": "index.d.ts",
          "exports": {
            ".": { "types": "./index.d.ts", "default": "./index.js" },
            "./format": { "types": "./format.d.ts", "default": "./format.js" }
          }
        }
        ```

        **Версія 1 — `vendor/day-clock/index.js`** і **`index.d.ts`:**

        ```js
        // day-clock 1.4.0: the phone's local calendar day.
        const pad = (n) => String(n).padStart(2, '0');

        export function today() {
          const now = new Date();
          return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
        }
        ```

        ```ts
        export declare function today(): string;
        ```

        **Версія 1 — `vendor/day-clock/format.js`** і **`format.d.ts`:**

        ```js
        // day-clock 1.4.0: "2026-03-02" → "02.03.2026".
        export function formatDay(day) {
          const [year, month, date] = day.split('-');
          return `${date}.${month}.${year}`;
        }
        ```

        ```ts
        export declare function formatDay(day: string): string;
        ```

        **`src/tasks.ts`:**

        ```ts
        // Planner tasks for the RN-12 gate (synthetic data).
        export type Task = { id: string; title: string; dueDate: string | null; done: boolean };

        export const tasks: Task[] = [
          { id: 't-01', title: 'Water the plants', dueDate: '2026-03-02', done: false },
          { id: 't-02', title: 'Return library books', dueDate: '2026-03-01', done: false },
          { id: 't-03', title: 'Write to grandma', dueDate: null, done: false },
          { id: 't-05', title: 'Book a dentist visit', dueDate: '2026-03-10', done: false },
        ];

        // Pending tasks due on or before the day ('YYYY-MM-DD' compares as text).
        export function dueOn(list: Task[], day: string): Task[] {
          return list.filter((task) => !task.done && task.dueDate !== null && task.dueDate <= day);
        }
        ```

        **`src/useResumeDay.ts`:**

        ```ts
        import { useEffect } from 'react';
        import { AppState } from 'react-native';
        import { today } from 'day-clock';

        // When the app comes back to the foreground, the day may have changed overnight.
        export function useResumeDay(onDay: (day: string) => void) {
          useEffect(() => {
            const subscription = AppState.addEventListener('change', (next) => {
              if (next === 'active') onDay(today().slice(0, 10));
            });
            return () => subscription.remove();
          }, [onDay]);
        }
        ```

        **`src/ReminderPanel.tsx`:**

        ```tsx
        import { useCallback, useEffect, useState } from 'react';
        import { ActivityIndicator, AppState, StyleSheet, Text, View } from 'react-native';
        import * as Notifications from 'expo-notifications';
        import type { Task } from './tasks';

        async function scheduleDueReminders(due: Task[]) {
          await Notifications.cancelAllScheduledNotificationsAsync();
          for (const task of due) {
            await Notifications.scheduleNotificationAsync({
              content: { title: 'Due today', body: task.title },
              trigger: { type: Notifications.SchedulableTriggerInputTypes.TIME_INTERVAL, seconds: 60 * 60 },
            });
          }
        }

        export function ReminderPanel({ due }: { due: Task[] }) {
          const [status, setStatus] = useState<'checking' | 'on'>('checking');

          const refresh = useCallback(
            async (ask: boolean) => {
              setStatus('checking');
              let settings = await Notifications.getPermissionsAsync();
              if (!settings.granted && ask && settings.canAskAgain) settings = await Notifications.requestPermissionsAsync();
              if (settings.granted) {
                await scheduleDueReminders(due);
                setStatus('on');
              }
            },
            [due],
          );

          useEffect(() => {
            refresh(true);
            const subscription = AppState.addEventListener('change', (next) => {
              if (next === 'active') refresh(false);
            });
            return () => subscription.remove();
          }, [refresh]);

          if (status === 'checking') {
            return (
              <View style={styles.row}>
                <ActivityIndicator />
                <Text>Checking reminders…</Text>
              </View>
            );
          }
          return <Text>Reminders are on: {due.length} for today</Text>;
        }

        const styles = StyleSheet.create({
          row: { flexDirection: 'row', gap: 8, alignItems: 'center' },
        });
        ```

        **Версія 1 — `App.tsx`:**

        ```tsx
        // RN-12 gate app: the planner's "due today" screen with reminders.
        import { useCallback, useState } from 'react';
        import { StyleSheet, Text, View } from 'react-native';
        import { today } from 'day-clock';
        import { formatDay } from 'day-clock/format';
        import { ReminderPanel } from './src/ReminderPanel';
        import { dueOn, tasks } from './src/tasks';
        import { useResumeDay } from './src/useResumeDay';

        export default function App() {
          const [day, setDay] = useState(today());
          useResumeDay(useCallback((next: string) => setDay(next), []));
          const due = dueOn(tasks, day);

          return (
            <View style={styles.screen}>
              <Text accessibilityRole="header" style={styles.heading}>Due on {formatDay(day)}: {due.length}</Text>
              {due.map((task) => (
                <Text key={task.id}>{task.title}</Text>
              ))}
              <ReminderPanel due={due} />
            </View>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, paddingTop: 64, paddingHorizontal: 16, gap: 8, backgroundColor: '#ffffff' },
          heading: { fontSize: 20, fontWeight: '600' },
        });
        ```

        **Оновлення до 2.0.0 — `vendor/day-clock/package.json`** (`format.js` і `format.d.ts` видали):

        ```json
