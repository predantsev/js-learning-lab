      - text:
          uk: "Створи проєкт і встанови модуль сповіщень. Потім створи файли версії 1 зі вступу (`vendor/day-clock/…`, `src/…`, `App.tsx`), задай у `app.json` ідентифікатор `com.example.jsll.rn12gate` (`android.package` і `ios.bundleIdentifier`)."
          en: "Create the project and install the notifications module. Then create the version 1 files from the introduction (`vendor/day-clock/…`, `src/…`, `App.tsx`), set the id `com.example.jsll.rn12gate` in `app.json` (`android.package` and `ios.bundleIdentifier`)."
        command: "mkdir -p ~/js-course\ncd ~/js-course\nnpx create-expo-app@latest rn12-gate --template blank-typescript@sdk-57 --no-agents-md\ncd rn12-gate\nnpx expo install expo-notifications"
      - text:
          uk: "Підключи локальний пакет `day-clock`, перевір версію 1 і закоміть її."
          en: "Add the local package `day-clock`, check version 1 and commit it."
        command: "npm install ./vendor/day-clock\nnpx tsc --noEmit\ngit add -A\ngit commit -m \"Planner gate app, version 1\""
        expect:
          uk: "`npx tsc --noEmit` нічого не друкує (так було в нашому запуску)."
          en: "`npx tsc --noEmit` prints nothing (that is how it was in our run)."
      - text:
          uk: "Збери release для заявленої цілі, дозволь нагадування, коли застосунок спитає, і переконайся, що версія 1 працює: список справ на сьогодні й «Reminders are on». Для цілі I — `npx expo run:ios --configuration Release`."
          en: "Build a release for the declared target, allow reminders when the app asks, and make sure version 1 works: the list of tasks due today and “Reminders are on”. For target I: `npx expo run:ios --configuration Release`."
        command: "npx expo run:android --variant release"
      - text:
          uk: "Внеси оновлення колеги (усе — у вступі, «Оновлення») і закоміть його. Потім збери release знову."
          en: "Apply the colleague's update (everything is in the introduction, “The update”) and commit it. Then build the release again."
        command: "npm install\ngit add -A\ngit commit -m \"Update day-clock to 2.0.0\"\nnpx expo run:android --variant release"
        expect:
          uk: "Збирання не вдається. Ми відтворили крок, на якому воно зупиняється, командою `npx expo export --platform android`; сам вивід Gradle не перевірено."
          en: "The build fails. We reproduced the step it stops at with `npx expo export --platform android`; the Gradle output itself was not checked."
      - text:
          uk: "Знайди в журналі першу справжню помилку, полагодь збирання й закоміть. Потім згорни застосунок і повернися до нього. Коли застосунок закриється, знайди причину в журналі пристрою (RN-07), полагодь і закоміть. Оновлення лишається: до `day-clock` 1.4.0 не повертайся."
          en: "Find the first real error in the log, repair the build and commit. Then send the app to the background and come back to it. When the app closes, find the cause in the device log (RN-07), repair it and commit. The update stays: do not go back to `day-clock` 1.4.0."
        command: "adb logcat -d | grep -n -E \"ReactNativeJS|AndroidRuntime\""
      - text:
          uk: "Згорни застосунок, забери дозвіл на сповіщення в системних налаштуваннях і повернися. Коли панель зависне, полагодь її так, щоб людина без дозволу бачила, що нагадування вимкнено, і мала шлях до налаштувань. Перевір і новий дозвіл після повернення. Закоміть."
          en: "Send the app to the background, take the notification permission away in the system settings and come back. When the panel hangs, repair it so that a person without the permission sees that reminders are off and has a way to the settings. Check allowing again after a return too. Commit."
      - text:
          uk: "На виправленій release-збірці пройди перевірки: повний перезапуск, режим польоту, кілька згортань і повернень, screen reader (TalkBack чи VoiceOver читає заголовок і кнопку налаштувань). Заповни `GATE.md`: обидва збої із першим рядком помилки й доказом виправлення, перевірки й матрицю покриття. Кожну клітинку, якої ти не перевірив, запиши пропуском із причиною й планом повернення. Закоміть."
          en: "On the repaired release build go through the checks: a full restart, airplane mode, several trips to the background and back, a screen reader (TalkBack or VoiceOver reads the heading and the settings button). Fill in `GATE.md`: both failures with the first error line and the proof of the fix, the checks and the coverage matrix. Record every cell you did not check as a skip with a reason and a way back. Commit."
        command: "npx tsc --noEmit\ngit add -A\ngit commit -m \"Repair the day-clock update and the reminder panel, record the gate\""
    verify:
      - id: reproduced
        text:
          uk: "Я відтворив на заявленій цілі всі три збої: збирання після оновлення, закриття після повернення й зависання панелі після заборони."
          en: "I reproduced all three failures on my declared target: the build after the update, the close after a return and the hanging panel after the permission was turned off."
      - id: fixed-kept-update
        text:
          uk: "Release-збірка з `day-clock` 2.0.0 збирається, повернення із фону нічого не закриває, а без дозволу панель показує «вимкнено» й шлях до налаштувань."
          en: "The release build with `day-clock` 2.0.0 builds, a return from the background closes nothing, and without the permission the panel shows “off” and a way to the settings."
      - id: checks
        text:
          uk: "Перевірки перезапуску, офлайну, повернень і screen reader виконано на виправленій release-збірці, і кожну описано в `GATE.md`: що зроблено й що побачено."
          en: "The restart, offline, return and screen reader checks were done on the repaired release build, and each is described in `GATE.md`: what was done and what was seen."
      - id: matrix
        text:
          uk: "Матриця покриття в `GATE.md` заповнена: кожна клітинка — результат або запис пропуску із причиною й планом повернення, і жодної порожньої."
          en: "The coverage matrix in `GATE.md` is filled in: every cell is a result or a skip record with a reason and a way back, and none is empty."
    troubleshooting:
      - problem:
          uk: "На Android 12 чи старішому застосунок не питає дозволу на сповіщення"
          en: "On Android 12 or older the app does not ask for the notification permission"
        fix:
          uk: "За [документацією Android](https://developer.android.com/develop/ui/views/notifications/notification-permission), дозвіл `POST_NOTIFICATIONS` існує з Android 13 (API 33); на Android 12L і старіших його немає, і застосунок надсилає сповіщення без запиту. Вимкни їх для застосунку в системних налаштуваннях сповіщень і запиши в `GATE.md`, на якій версії Android перевіряв."
          en: "According to the [Android documentation](https://developer.android.com/develop/ui/views/notifications/notification-permission), the `POST_NOTIFICATIONS` permission exists from Android 13 (API 33); on Android 12L and older it does not, and the app sends notifications without asking. Turn them off for the app in the system notification settings and write in `GATE.md` which Android version you checked on."
      - problem:
          uk: "Після заборони в налаштуваннях застосунок запускається заново, а не повертається"
          en: "After turning the permission off in Settings, the app starts anew instead of coming back"
        fix:
          uk: "Android може завершити процес, коли дозвіл забирають. Це теж правильна перевірка: після запуску панель так само не має зависати. Запиши в `GATE.md`, що саме бачив."
          en: "Android may end the process when a permission is taken away. That is a valid check too: after the start the panel must not hang either. Write in `GATE.md` exactly what you saw."
    recovery:
      uk: "Кожен етап закомічено, тож `git log --oneline` показує, де ти, а `git restore .` повертає файли до останнього коміту. Проєкт окремий: якщо все заплуталося, теку `rn12-gate` можна видалити й створити знову за вступом, а застосунок прибрати із цілі (`adb uninstall com.example.jsll.rn12gate`)."
      en: "Every stage is committed, so `git log --oneline` shows where you are, and `git restore .` brings the files back to the last commit. The project is separate: if things get tangled, the `rn12-gate` folder can be deleted and created again from the introduction, and the app removed from the target (`adb uninstall com.example.jsll.rn12gate`)."
