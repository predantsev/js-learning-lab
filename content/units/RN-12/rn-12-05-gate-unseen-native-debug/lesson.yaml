          "name": "day-clock",
          "version": "2.0.0",
          "main": "index.js",
          "types": "index.d.ts",
          "exports": {
            ".": { "types": "./index.d.ts", "default": "./index.js" }
          }
        }
        ```

        **Оновлення — `vendor/day-clock/index.js`** і **`index.d.ts`:**

        ```js
