id: rn-12-06-gate-independent-native-quality
unit: RN-12
title:
  uk: "Рубіж: самостійна нативна якість і пояснення архітектури"
  en: "Gate: independent native quality and architecture explanation"
kind: assessment
minutes: 45
contentVersion: 1
purpose:
  uk: "Друга й остання частина нативного рубежу — і кінець етапу React Native. Без підказок ти додаєш до планувальника нову функцію із тестами потрібних рівнів і списком того, чого тести не доводять, пояснюєш рішення про архітектуру й interop за наданим трейсом і README, а на заявленій цілі випускаєш підписану release-збірку із чесним походженням доказів і записами пропусків."
  en: "The second and last part of the native gate — and the end of the React Native stage. Without hints you add a new feature to the planner with tests at the right levels and a list of what the tests do not prove, explain architecture and interop decisions from a supplied trace and README, and on the declared target ship a signed release build with honest evidence provenance and skip records."
objectives:
  - uk: "Без підказок зробити самостійне native-вдосконалення синтетичного застосунку з unit-, типізованими й компонентними тестами, задокументованими прогалинами mock-ів, підтвердженими перевірками на пристрої, і походженням підписаної збірки із записами пропусків."
    en: "Deliver, without hints, an independent native enhancement of a synthetic app with unit, typed-domain and component tests, documented mock gaps confirmed by device checks, and signed-build provenance including skip records."
  - uk: "Письмово пояснити, коли запитана можливість потребує native interop і перевірки сумісності, і розрізнити інструкції старої й нової архітектури в наданому посібнику бібліотеки."
    en: "Explain in writing when a requested capability needs native interop and a compatibility spike, and distinguish old- from new-architecture instructions in a supplied library guide."
prerequisites: [rn-12-05-gate-unseen-native-debug]
subskills:
  - { family: N-09, skill: "new architecture/Fabric/TurboModules concepts", depth: assess }
  - { family: N-09, skill: "native module/codegen interop", depth: assess }
  - { family: N-09, skill: "JS/native boundary costs", depth: assess }
  - { family: N-09, skill: "platform dependencies/compatibility", depth: assess }
  - { family: N-09, skill: "legacy migration reading", depth: assess }
  - { family: N-10, skill: "unit/typed-domain/component/integration tests", depth: assess }
  - { family: N-10, skill: "mocks vs target/device checks", depth: assess }
  - { family: N-12, skill: "independent native enhancement", depth: assess }
  - { family: N-12, skill: "signed/build provenance", depth: assess }
  - { family: N-12, skill: "unsupported target and skip evidence", depth: assess }
glossary: []
selfCheck: [overdue-feature, architecture-brief]

blocks:
  - id: gate-rules
    kind: explanation
    title:
      uk: "Що перевіряється"
      en: "What is checked"
    body:
      uk: |
        Підказок тут немає, а розв’язок відкривається лише тоді, коли всі перевірки вже пройдено.

        - **На платформі, завдання 1:** функція «Прострочено» для планувальника — правило, значок, твій набір тестів і список прогалин mock-ів. Твої тести проганяють на правильній функції й на зламаних версіях.
        - **На платформі, завдання 2:** записка про архітектуру — трейс interop, README бібліотеки, три запити, два записи доказів і твоє пояснення.
        - **На заявленій цілі:** та сама функція в проєкті `rn12-gate` із попереднього уроку — справжній Jest, `tsc`, підписана release-збірка, записи доказів і пропусків та розділ про архітектуру, який ти оцінюєш за наведеними критеріями. Без native-інструментів цю частину позначають як невиконану.

        Знадобиться весь етап, а найбільше — RN-07 (тести й прогалини mock-ів), RN-08 (докази), RN-11 (підпис) і перші три уроки цього розділу.
      en: |
        There are no hints here, and the solution opens only once every check has passed.

        - **On the platform, task 1:** an “Overdue” feature for the planner — the rule, the badge, your test suite and the list of mock gaps. Your tests are run on the correct feature and on broken versions.
        - **On the platform, task 2:** an architecture brief — an interop trace, a library README, three requests, two evidence records and your explanation.
        - **On the declared target:** the same feature in the `rn12-gate` project from the previous lesson — real Jest, `tsc`, a signed release build, evidence and skip records and an architecture section you grade against the listed criteria. Without native tooling this part is marked as not performed.

        You will need the whole stage, most of all RN-07 (tests and mock gaps), RN-08 (evidence), RN-11 (signing) and the first three lessons of this unit.

  - id: overdue-feature
    kind: exercise
    mode: independent
    assessment: true
    runtime: concept-preview
    dir: overdue-feature
    entry: main.jsx
    editable: [overdue.js, OverdueBadge.jsx, overdue.test.jsx, gaps.js]
    capabilities: { testTimeoutMs: 10000 }
    strings:
      t1: { uk: "Полити квіти", en: "Water the plants" }
      t2: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      t3: { uk: "Написати бабусі", en: "Write to grandma" }
      t4: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      t5: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      t6: { uk: "Замінити фільтр для води", en: "Replace the water filter" }
      overdue: { uk: "Прострочено", en: "Overdue" }
      overdueLabel: { uk: "Прострочені справи", en: "Overdue tasks" }
      tToday: { uk: "справа на сьогодні ще не прострочена", en: "a task due today is not overdue yet" }
      tDone: { uk: "виконані справи не прострочуються", en: "done tasks are never overdue" }
      tBadge: { uk: "значок показує назви після натискання", en: "the badge lists the titles when pressed" }
      gapClock: { uk: "Тести передають день текстом; справжній годинник телефона й північ, що минає у фоні, вони не бачать.", en: "The tests pass the day as text; they never see the phone’s real clock or midnight passing in the background." }
      gapReader: { uk: "Тест знаходить кнопку за міткою, але не доводить, що TalkBack чи VoiceOver її так прочитає.", en: "The test finds the button by its label but does not prove that TalkBack or VoiceOver reads it that way." }
      gapStorage: { uk: "Справи в тестах — масив у пам’яті, а не сховище пристрою після перезапуску.", en: "The tasks in the tests are an array in memory, not the device storage after a restart." }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rNotFound: { uk: "на екрані немає", en: "not on the screen:" }
      rStillMissing: { uk: "так і не з’явилося", en: "never appeared" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "«Прострочено»: функція, тести й прогалини"
      en: "“Overdue”: the feature, the tests and the gaps"
    instructions:
      uk: |
        Додай до екрана «на сьогодні» значок прострочених справ. Справи — у `tasks.js`.

        1. **`overdue.js`** — `overdueOn(list, day)`: невиконані справи із датою **раніше** за `day` (справа на сам `day` ще не прострочена, справа без дати — ніколи), від найстарішої; переданий масив не змінюється.
        2. **`OverdueBadge.jsx`** — `OverdueBadge({ tasks, day })`: нічого не показує, коли прострочених немає; інакше — кнопка із текстом «%%overdue%%: N» і `accessibilityLabel` «%%overdueLabel%%: N»; натискання показує й ховає назви прострочених справ.
        3. **`overdue.test.jsx`** — щонайменше три твої тести з `testing.js` цього етапу. Імпортуй функцію й значок з `feature.js`. Перевірки проганяють твої тести на правильній функції — там усі мають пройти — і на трьох версіях із одним дефектом кожна, яких ти не бачиш: на кожній має впасти хоча б один твій тест.
        4. **`gaps.js`** — прогалини mock-ів: що тести замінюють чи не бачать (`mocked`), що саме вони не доводять (`gap`, щонайменше 20 символів) і яка перевірка на цілі це покриває (`deviceCheck`). Серед них мають бути годинник і screen reader, причому screen reader покриває перевірка доступності.
      en: |
        Add a badge of overdue tasks to the “today” screen. The tasks are in `tasks.js`.

        1. **`overdue.js`** — `overdueOn(list, day)`: pending tasks dated **before** `day` (a task due on `day` itself is not overdue yet, a task without a date never is), the oldest first; the given array does not change.
        2. **`OverdueBadge.jsx`** — `OverdueBadge({ tasks, day })`: shows nothing when nothing is overdue; otherwise a button with the text “%%overdue%%: N” and the `accessibilityLabel` “%%overdueLabel%%: N”; pressing it shows and hides the titles of the overdue tasks.
        3. **`overdue.test.jsx`** — at least three tests of yours with this stage's `testing.js`. Import the function and the badge from `feature.js`. The checks run your tests on the correct feature — there all of them must pass — and on three versions with one defect each that you do not see: on each one at least one of your tests must fail.
        4. **`gaps.js`** — the mock gaps: what the tests replace or do not see (`mocked`), what exactly they do not prove (`gap`, at least 20 characters) and which check on the target covers it (`deviceCheck`). They must include the clock and the screen reader, and the screen reader is covered by the accessibility check.
    testTitles:
      "overdueOn returns the pending tasks due before the day, the oldest first":
        uk: "`overdueOn` повертає невиконані справи із датою раніше за день, від найстарішої"
        en: "`overdueOn` returns the pending tasks due before the day, the oldest first"
      "overdueOn leaves the given list unchanged":
        uk: "`overdueOn` не змінює переданий список"
        en: "`overdueOn` leaves the given list unchanged"
      "the badge shows nothing when no task is overdue":
        uk: "Без прострочених справ значок нічого не показує"
        en: "The badge shows nothing when no task is overdue"
      "the badge is a button named with the count, and pressing it lists the overdue titles":
        uk: "Значок — кнопка із міткою й кількістю, і натискання показує назви"
        en: "The badge is a button named with the count, and pressing it lists the titles"
      "your tests pass with the correct feature":
        uk: "Твої тести проходять на правильній функції"
        en: "Your tests pass with the correct feature"
      "a test fails when a task due on the day itself counts as overdue":
        uk: "Твій тест падає, коли справа на сам день вважається простроченою"
        en: "A test of yours fails when a task due on the day itself counts as overdue"
      "a test fails when done tasks count as overdue":
        uk: "Твій тест падає, коли виконані справи вважаються простроченими"
        en: "A test of yours fails when done tasks count as overdue"
      "a test fails when pressing the badge lists nothing":
        uk: "Твій тест падає, коли натискання значка нічого не показує"
        en: "A test of yours fails when pressing the badge lists nothing"
      "every mock gap names what is mocked, what is not proved and a device check":
        uk: "Кожна прогалина називає, що замінено, чого не доведено, і перевірку на цілі"
        en: "Every mock gap names what is mocked, what is not proved and a device check"
      "the mock gaps include the clock":
        uk: "Серед прогалин є годинник"
        en: "The mock gaps include the clock"
      "the mock gaps include the screen reader, checked as accessibility":
        uk: "Серед прогалин є screen reader, і його покриває перевірка доступності"
        en: "The mock gaps include the screen reader, covered by the accessibility check"
    solutionNote:
      uk: "Межа «раніше за день» — найчастіше місце помилки: тест на день, коли якась справа саме настає, ловить `<=` замість `<`. Виконана справа із давньою датою ловить правило, що забуло про `done`, а натискання значка в компонентному тесті — значок, який нічого не розкриває. Сортують копію (`filter` уже повертає новий масив), щоб не змінити список застосунку. А прогалини чесно кажуть, що день у тестах — лише текст і що мітку тест знаходить, але не чує: це перевірки на цілі."
      en: "The “before the day” boundary is the most common place for a mistake: a test on a day when some task is due catches `<=` instead of `<`. A done task with an old date catches a rule that forgot `done`, and pressing the badge in a component test catches a badge that reveals nothing. You sort a copy (`filter` already returns a new array) so as not to change the app's list. And the gaps honestly say that the day in the tests is only text, and that the test finds the label but does not hear it: those are checks on the target."
    feedback:
      - when: { test: "your tests pass with the correct feature" }
        message:
          uk: "Ця перевірка проганяє твої тести з `overdue.test.jsx` на правильній функції й правильному значку й чекає щонайменше трьох тестів, усі зелені. Тест, що впав, і його повідомлення — у тексті перевірки. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check runs your tests from `overdue.test.jsx` on the correct function and badge and expects at least three tests, all green. The test that failed and its message are in the check's text. If every check fails at once, first fix the first error in the console."
      - when: { test: "a test fails when a task due on the day itself counts as overdue" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб твої тести проходили на правильній функції. Потім підставляє правило, для якого справа на сам день уже прострочена, і чекає, що хоча б один твій тест це помітить."
          en: "This check first requires your tests to pass on the correct feature. Then it puts in a rule for which a task due on the day itself is already overdue, and expects at least one of your tests to notice."
      - when: { test: "a test fails when done tasks count as overdue" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб твої тести проходили на правильній функції. Потім підставляє правило, що не дивиться на `done`, і чекає, що хоча б один твій тест це помітить."
          en: "This check first requires your tests to pass on the correct feature. Then it puts in a rule that ignores `done`, and expects at least one of your tests to notice."
      - when: { test: "a test fails when pressing the badge lists nothing" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб твої тести проходили на правильній функції. Потім підставляє значок, що після натискання нічого не показує, і чекає, що хоча б один твій тест це помітить."
          en: "This check first requires your tests to pass on the correct feature. Then it puts in a badge that shows nothing after a press, and expects at least one of your tests to notice."
    limits:
      uk: "Перегляд react-native-web у браузері. `testing.js` — симуляція Jest і React Native Testing Library з RN-07, а не справжні інструменти; годинника, сховища й screen reader тут немає — тому вони й потрапляють у прогалини. Справжні тести й перевірки на пристрої — у частині на заявленій цілі."
      en: "A react-native-web preview in the browser. `testing.js` is the simulation of Jest and React Native Testing Library from RN-07, not the real tools; there is no clock, storage or screen reader here — that is exactly why they go into the gaps. The real tests and the device checks are in the part on the declared target."

  - id: architecture-brief
    kind: exercise
    mode: independent
    assessment: true
    runtime: concept-preview
    dir: architecture-brief
    entry: main.jsx
    editable: [brief.js]
    strings:
      ra: { uk: "3.x: лише New Architecture, React Native 0.79 і новіші.", en: "3.x: New Architecture only, React Native 0.79 and newer." }
      rb: { uk: "2.x: якщо в застосунку ввімкнено New Architecture, запускай pod install з RCT_NEW_ARCH_ENABLED=0.", en: "2.x: if your app has the New Architecture on, run pod install with RCT_NEW_ARCH_ENABLED=0." }
      rc: { uk: "2.x: скануй через NativeModules.ReceiptScanner.scan().", en: "2.x: scan with NativeModules.ReceiptScanner.scan()." }
      rd: { uk: "3.x: перегляд камери оголошено через codegenNativeComponent<NativeProps>('ReceiptPreview').", en: "3.x: the camera preview is declared with codegenNativeComponent<NativeProps>('ReceiptPreview')." }
      re: { uk: "3.x: specs/NativeReceiptScanner.ts оголошує scan(): Promise<string>.", en: "3.x: specs/NativeReceiptScanner.ts declares scan(): Promise<string>." }
      rf: { uk: "2.x: перегляд підключають через requireNativeComponent('ReceiptPreview').", en: "2.x: the preview is loaded with requireNativeComponent('ReceiptPreview')." }
      reqTotal: { uk: "Показувати суму за місяць у заголовку (її вже рахує summarizeExpenses).", en: "Show the month’s total in the header (summarizeExpenses already computes it)." }
      reqShare: { uk: "Ділитися підсумком місяця як текстом через системне вікно «Поділитися».", en: "Share the month’s summary as text through the system “Share” sheet." }
      reqScan: { uk: "Сканувати паперовий чек камерою й заповнювати суму; знайшлася лише бібліотека receipt-scanner 3.x.", en: "Scan a paper receipt with the camera and fill in the amount; the only library found is receipt-scanner 3.x." }
      restartProcedure: { uk: "Додав витрату «Таксі» на 180,00, повністю закрив застосунок і відкрив знову.", en: "Added the expense “Taxi” for 180.00, closed the app completely and opened it again." }
      restartObserved: { uk: "«Таксі» на місці, сума за березень зросла на 180,00.", en: "“Taxi” is there, the March total grew by 180.00." }
      iosReason: { uk: "Комп’ютер на Linux: iOS-симулятор працює лише на macOS.", en: "A Linux computer: the iOS simulator runs only on macOS." }
      iosRevisit: { uk: "Повторити з VoiceOver на Mac або iPhone, коли буде доступ.", en: "Repeat with VoiceOver on a Mac or an iPhone when one is available." }
      whyNative: { uk: "Сканування потребує камери — native-можливості, якої в JavaScript немає, тож бібліотека додає native-код і її спершу перевіряють spike-ом; суму рахує JavaScript, і native-модуль додав би лише перетини межі.", en: "Scanning needs the camera — a native capability JavaScript does not have, so the library adds native code and is first checked with a spike; the total is computed by JavaScript, and a native module would only add boundary crossings." }
    title:
      uk: "Записка про архітектуру й interop"
      en: "An architecture and interop brief"
    instructions:
      uk: |
        Трекер витрат (React Native 0.86, заявлена ціль — Android-емулятор, комп’ютер на Linux) планує нові можливості. Заповни `brief.js`:

        1. За `trace.txt`: `trace.cheaper` — варіант, що витрачає менше часу на межі (`'A'` чи `'B'`), і `trace.times` — у скільки разів менше (ціле число).
        2. За README у `supplied.js`: кожен рядок — `'legacy'` чи `'new'`.
        3. За запитами в `supplied.js`: шлях кожного (`'javascript'`, `'built-in'`, `'library'` чи `'custom-module'`) і чи потрібна спершу перевірка сумісності (`true`/`false`).
        4. Два записи за правилами `evidence.js` і із даними з `build.js`: `restartRecord` — перевірка перезапуску, яку ти виконав сам на заявленій цілі з release-збіркою, результат `pass`; `iosReaderSkip` — перевірка доступності (`'a11y'`) на `iosSimulator`, якого цей комп’ютер не запускає.
        5. `whyNative` — твоїми словами, щонайменше 60 символів: чому сканування чека потребує native-коду й spike, а сума за місяць — ні.

        Праворуч — статуси твоїх записів за `judge`. Решту порівнюють із однією правильною відповіддю на поле, а в `whyNative` перевіряють лише довжину: зміст ти перевіриш за критеріями в частині на цілі.
      en: |
        The expense tracker (React Native 0.86, the declared target is an Android emulator, a Linux computer) plans new capabilities. Fill in `brief.js`:

        1. From `trace.txt`: `trace.cheaper` — the variant that spends less time at the boundary (`'A'` or `'B'`), and `trace.times` — how many times less (a whole number).
        2. From the README in `supplied.js`: every line is `'legacy'` or `'new'`.
        3. From the requests in `supplied.js`: the route of each (`'javascript'`, `'built-in'`, `'library'` or `'custom-module'`) and whether a compatibility spike comes first (`true`/`false`).
        4. Two records following the rules of `evidence.js`, with the data from `build.js`: `restartRecord` — the restart check you performed yourself on the declared target with the release build, outcome `pass`; `iosReaderSkip` — the accessibility check (`'a11y'`) on `iosSimulator`, which this computer cannot run.
        5. `whyNative` — in your own words, at least 60 characters: why scanning a receipt needs native code and a spike, and the month's total does not.

        On the right are the statuses `judge` gives your records. The rest is compared with one correct answer per field, and in `whyNative` only the length is checked: you check its content against the criteria in the part on the target.
    testTitles:
      "the trace names the cheaper variant":
        uk: "`trace.cheaper` — твоя відповідь про дешевший варіант"
        en: "`trace.cheaper` — your answer about the cheaper variant"
      "the trace names how many times less boundary time it spends":
        uk: "`trace.times` — твоя відповідь про різницю на межі"
        en: "`trace.times` — your answer about the difference at the boundary"
      "the old-architecture README lines are labelled legacy":
        uk: "Рядки README старої архітектури позначено `'legacy'`"
        en: "The old-architecture README lines are labelled `'legacy'`"
      "the New Architecture README lines are labelled new":
        uk: "Рядки README нової архітектури позначено `'new'`"
        en: "The new-architecture README lines are labelled `'new'`"
      "each request gets the right route":
        uk: "`routes` — твоя відповідь про шляхи"
        en: "`routes` — your answer about the routes"
      "a spike comes first only where native code is added":
        uk: "`spikeFirst` — твоя відповідь про перевірки сумісності"
        en: "`spikeFirst` — your answer about compatibility spikes"
      "the restart record is accepted as passed":
        uk: "`restartRecord` прийнято як пройдений запис перевірки `restart`"
        en: "`restartRecord` is accepted as a passed `restart` record"
      "the iOS screen-reader record is accepted as a skip":
        uk: "`iosReaderSkip` прийнято як пропуск перевірки `a11y` на `iosSimulator`"
        en: "`iosReaderSkip` is accepted as a skip of the `a11y` check on `iosSimulator`"
      "the explanation of the native decision has at least 60 characters":
        uk: "`whyNative` має щонайменше 60 символів"
        en: "`whyNative` has at least 60 characters"
    solutionNote:
      uk: |
        - **Трейс:** B, 96 / 6 = 16. Робота native-коду в обох варіантах майже однакова; різниця — 1999 зайвих перетинів межі.
        - **README:** `RCT_NEW_ARCH_ENABLED=0`, `NativeModules` і `requireNativeComponent` — лінійка 2.x і стара архітектура (а прапорець з 0.82 ігнорується); `0.79+`, специфікація `Native…` і `codegenNativeComponent` — 3.x.
        - **Запити:** суму рахує JavaScript; «Поділитися» є в React Native; сканування — бібліотека з native-кодом, тож spike першим.
        - **Записи:** перезапуск — з release-збіркою (`build`, не `debugBuild`) на `declaredTarget`; iOS — пропуск із причиною й планом, без результату.
      en: |
        - **The trace:** B, 96 / 6 = 16. The native work is almost the same in both variants; the difference is 1,999 extra boundary crossings.
        - **The README:** `RCT_NEW_ARCH_ENABLED=0`, `NativeModules` and `requireNativeComponent` are the 2.x line and the old architecture (and the flag is ignored since 0.82); `0.79+`, the `Native…` spec and `codegenNativeComponent` are 3.x.
        - **The requests:** JavaScript computes the total; React Native has “Share”; scanning is a library with native code, so a spike comes first.
        - **The records:** the restart one with the release build (`build`, not `debugBuild`) on `declaredTarget`; iOS is a skip with a reason and a way back, without an outcome.
    feedback:
      - when: { test: "the restart record is accepted as passed" }
        message:
          uk: "Ця перевірка чекає від `judge(restartRecord)` статус `passed` і `check: 'restart'`. Праворуч видно статус і причину відмови."
          en: "This check expects the status `passed` from `judge(restartRecord)` and `check: 'restart'`. The status and the reason for a rejection are on the right."
      - when: { test: "the iOS screen-reader record is accepted as a skip" }
        message:
          uk: "Ця перевірка чекає від `judge(iosReaderSkip)` статус `skipped`, `check: 'a11y'` і `target: iosSimulator`. Праворуч видно статус і причину відмови."
          en: "This check expects the status `skipped` from `judge(iosReaderSkip)`, `check: 'a11y'` and `target: iosSimulator`. The status and the reason for a rejection are on the right."
      - when: { test: "the explanation of the native decision has at least 60 characters" }
        message:
          uk: "Ця перевірка чекає в `whyNative` текст щонайменше з 60 символів."
          en: "This check expects a text of at least 60 characters in `whyNative`."
    limits:
      uk: "Перегляд react-native-web у браузері. Трейс, бібліотека, запити, збірки й відбитки синтетичні; `evidence.js` лише застосовує правила курсу до записів, жодної перевірки на пристрої тут не виконано."
      en: "A react-native-web preview in the browser. The trace, library, requests, builds and fingerprints are synthetic; `evidence.js` only applies the course's rules to records, and no check is performed on a device here."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: записи доказів"
      en: "Recall: evidence records"
    items:
      - id: screenshot-record
        from: rn-08-05-record-evidence
        prompt:
          uk: "Запис перевірки офлайну на заявленій цілі має release-збірку із правильним відбитком, але замість опису дій і побаченого — лише знімок екрана. Як його оцінюють?"
          en: "A record of the offline check on the declared target has the release build with the right fingerprint, but only a screenshot instead of the procedure and the observation. How is it judged?"
        answer:
          type: choice
          options:
            - id: rejected
              text: { uk: "Не приймають: знімок не каже, що зроблено перед ним і що на ньому видно", en: "Rejected: a screenshot does not say what was done before it or what it shows" }
            - id: passed
              text: { uk: "Пройдено: збірка й ціль правильні", en: "Passed: the build and the target are right" }
              why:
                uk: "Збірка й ціль — необхідні, але без дій і побаченого іншу людину нема чим переконати й нема як повторити перевірку."
                en: "The build and the target are necessary, but without the procedure and the observation there is nothing to convince another person with and no way to repeat the check."
            - id: skipped
              text: { uk: "Пропуск: перевірку зроблено не повністю", en: "A skip: the check was not done completely" }
              why:
                uk: "Пропуск — це перевірка, якої не виконували взагалі, із причиною й планом повернення. Неповний запис — інша річ: його доповнюють."
                en: "A skip is a check that was not performed at all, with a reason and a way back. An incomplete record is another thing: it gets completed."
          correct: [rejected]
        explanation:
          uk: "Запис доказу — це перевірка, ціль, збірка, дії, побачене, результат і походження. Чого бракує — те й робить його неприйнятим."
          en: "An evidence record is the check, the target, the build, the procedure, the observation, the outcome and the provenance. Whatever is missing makes it rejected."

  - id: on-target
    kind: local-task
    runtime: local-native
    title:
      uk: "«Прострочено» в rn12-gate: тести, підписана збірка, докази й архітектура"
      en: "“Overdue” in rn12-gate: tests, a signed build, evidence and architecture"
    intro:
      uk: |
        Без підказок. Працюєш у `~/js-course/rn12-gate` — проєкті із частини 2 попереднього уроку, де ти полагодив оновлення `day-clock` і панель нагадувань. Якщо ти ту частину не виконував, спершу зроби її: без робочого застосунку тут нема що вдосконалювати.

        **Що перевірено під час підготовки уроку (Expo SDK 57, React Native 0.86.3, macOS без Android SDK і без Xcode):** команда встановлення тестових інструментів нижче поставила `jest-expo` 57.0.5, `jest` 29.7, `@types/jest` 29.5.14 і `@testing-library/react-native` 14.0.1; наша власна реалізація функції із тестами пройшла `npm test` (`Tests: 3 passed, 3 total`) і `npx tsc --noEmit` після того, як у `tsconfig.json` додали `"types": ["jest"]` (без цього `tsc` повідомляє `Cannot find name 'test'`, як у RN-07). Native-збирання, підпис, встановлення й перевірки на цілі **не перевірено**.

        Якщо native-інструментів немає, кроки 1–2 однаково можна пройти: Jest і `npx tsc --noEmit` не потребують ні Android SDK, ні Xcode (так ми їх і запускали). Напиши `QUALITY.md` — розділи про тести, прогалини mock-ів і архітектуру, а підписану збірку й кожну перевірку на цілі запиши пропуском із причиною й планом повернення, як у RN-08. Потім натисни **«У мене немає емулятора чи пристрою»**: завдання буде записано як невиконане.

        **Вимоги:**

        - функція «Прострочено» в `src/overdue.ts` і `src/OverdueBadge.tsx` із тими самими правилами, що й у завданні 1 на платформі (текст і мітку пиши англійською, як решту застосунку: «Overdue: N», «Overdue tasks: N»), значок — над списком справ у `App.tsx`;
        - тести в справжньому Jest: unit-тести правила із межею «сам день», компонентний тест значка й тест на рівні типів (`// @ts-expect-error` над справою, яку тип `Task` має відкинути), усе зелене в `npm test` і `npx tsc --noEmit`;
        - версія `1.1.0`, номер збірки вищий, ніж у збірці частини 2; release підписано твоїм ключем з RN-11 (або новим), ключ і паролі — поза репозиторієм;
        - `QUALITY.md` із розділами нижче, закомічений; жодного ключа чи пароля в репозиторії.

        **Розділи `QUALITY.md`:**

        ```text
        # rn12-gate — quality and architecture
        ## Tests (which levels, what each one proves, the npm test and tsc results)
        ## Mock gaps (at least two; at least one confirmed by a check on the declared target)
        ## Release build provenance (commit, version and build number, signing certificate SHA-256)
        ## Evidence records (restart, offline, lifecycle, a11y: check, target, build, procedure, observed, outcome, provenance)
        ## Skip records (check · target · reason · way back)
        ## Architecture and interop
        ```

        **Критерії для розділу «Architecture and interop»** (оціни себе й запиши під розділом, які виконано):

        1. JSI, Fabric і TurboModules — кожен із однією роллю й версією React Native, до якої це стосується.
        2. Чому «Прострочено» не потребує native-модуля, із думкою про ціну перетину межі.
        3. Для `receipt-scanner` із завдання 2: шлях, план spike (точна версія, тестовий екран, результати, що відкидають, гілка для відкату) і які рядки README стосуються старої архітектури — та чому прапорець вимкнення нової архітектури на 0.86 нічого не дасть.
        4. За `trace.txt` із завдання 2: який варіант і чому — словами про перетини межі, а не «native швидший».
      en: |
        No hints. You work in `~/js-course/rn12-gate` — the project from part 2 of the previous lesson, where you repaired the `day-clock` update and the reminder panel. If you did not do that part, do it first: without a working app there is nothing to enhance here.

        **What was checked while preparing this lesson (Expo SDK 57, React Native 0.86.3, macOS without the Android SDK and without Xcode):** the test tools install command below installed `jest-expo` 57.0.5, `jest` 29.7, `@types/jest` 29.5.14 and `@testing-library/react-native` 14.0.1; our own implementation of the feature with tests passed `npm test` (`Tests: 3 passed, 3 total`) and `npx tsc --noEmit` after `"types": ["jest"]` was added to `tsconfig.json` (without it `tsc` reports `Cannot find name 'test'`, as in RN-07). The native build, signing, installing and the checks on a target were **not checked**.

        If you have no native tooling, steps 1–2 can still be done: Jest and `npx tsc --noEmit` need neither the Android SDK nor Xcode (that is how we ran them). Write `QUALITY.md` — the sections on tests, mock gaps and architecture — and record the signed build and every check on the target as skips with a reason and a way back, as in RN-08. Then press **“I have no emulator or device”**: the task is recorded as not performed.

        **Requirements:**

        - the “Overdue” feature in `src/overdue.ts` and `src/OverdueBadge.tsx` with the same rules as task 1 on the platform (write the text and the label in English, like the rest of the app: “Overdue: N”, “Overdue tasks: N”), the badge above the task list in `App.tsx`;
        - tests in real Jest: unit tests of the rule with the “day itself” boundary, a component test of the badge and a type-level test (`// @ts-expect-error` above a task the `Task` type must refuse), all green in `npm test` and `npx tsc --noEmit`;
        - version `1.1.0`, a build number higher than the build of part 2; the release is signed with your key from RN-11 (or a new one), the key and passwords outside the repository;
        - `QUALITY.md` with the sections below, committed; no key and no password in the repository.

        **Sections of `QUALITY.md`:**

        ```text
        # rn12-gate — quality and architecture
        ## Tests (which levels, what each one proves, the npm test and tsc results)
        ## Mock gaps (at least two; at least one confirmed by a check on the declared target)
        ## Release build provenance (commit, version and build number, signing certificate SHA-256)
        ## Evidence records (restart, offline, lifecycle, a11y: check, target, build, procedure, observed, outcome, provenance)
        ## Skip records (check · target · reason · way back)
        ## Architecture and interop
        ```

        **Criteria for the “Architecture and interop” section** (grade yourself and write under the section which ones are met):

        1. JSI, Fabric and TurboModules — each with one role and the React Native version it applies to.
        2. Why “Overdue” needs no native module, with a thought about the cost of crossing the boundary.
        3. For `receipt-scanner` from task 2: the route, a spike plan (exact version, test screen, rejecting results, a branch for rollback) and which README lines are about the old architecture — and why the flag that turns the new architecture off does nothing on 0.86.
        4. From `trace.txt` of task 2: which variant and why — in words about boundary crossings, not “native is faster”.
    tools:
      - { name: "Expo SDK", version: "57 (React Native 0.86.3)" }
      - { name: "jest-expo, Jest, React Native Testing Library", version: "57.0.5, 29.7, 14.0.1" }
      - { name: "Your keystore", version: { uk: "з RN-11 чи новий", en: "from RN-11 or a new one" }, note: { uk: "поза репозиторієм", en: "outside the repository" } }
    steps:
      - text:
          uk: "Переконайся, що проєкт на місці й робоче дерево чисте, і встанови тестові інструменти (команда з RN-07)."
          en: "Make sure the project is there and the working tree is clean, and install the test tools (the command from RN-07)."
        command: "cd ~/js-course/rn12-gate\ngit status --short\nnpx expo install jest-expo jest @types/jest @testing-library/react-native --dev\nnpm pkg set scripts.test=jest jest.preset=jest-expo"
      - text:
          uk: "Зроби функцію й тести — так, як вирішиш сам. Доведи, що тести проходять, і що кожен ловить свою помилку: зламай правило на хвилину й подивись, що тест падає."
          en: "Build the feature and the tests — the way you decide. Prove that the tests pass, and that each catches its mistake: break the rule for a minute and see the test fail."
        command: "npm test\nnpx tsc --noEmit"
      - text:
          uk: "Підніми версію й номер збірки, підпиши release своїм ключем (config plugin з RN-11: без нього `prebuild` знову лишає release на ключі debug), збери його й встанови на заявлену ціль як оновлення збірки із частини 2. Для цілі I — `npx expo run:ios --configuration Release`."
          en: "Raise the version and the build number, sign the release with your key (the config plugin from RN-11: without it `prebuild` leaves the release on the debug key again), build it and install it on the declared target as an update of the build from part 2. For target I: `npx expo run:ios --configuration Release`."
        command: "npx expo prebuild --platform android\nnpx expo run:android --variant release"
      - text:
          uk: "Збери походження збірки (RN-08): commit, версію й відбиток сертифіката підпису. Для цілі I — `plutil` і `codesign`, як у RN-08."
          en: "Collect the build provenance (RN-08): the commit, the version and the signing certificate fingerprint. For target I: `plutil` and `codesign`, as in RN-08."
        command: "git rev-parse --short HEAD\n\"$ANDROID_HOME/build-tools/36.0.0/apksigner\" verify --print-certs android/app/build/outputs/apk/release/app-release.apk"
      - text:
          uk: "Пройди перевірки на цілі (перезапуск, офлайн, повернення після півночі чи після зміни дати, screen reader) і підтвердь на пристрої щонайменше одну прогалину mock-ів. Заповни `QUALITY.md`, оціни розділ про архітектуру за критеріями й закоміть."
          en: "Go through the checks on the target (restart, offline, a return after midnight or after a date change, screen reader) and confirm at least one mock gap on the device. Fill in `QUALITY.md`, grade the architecture section against the criteria and commit."
        command: "git status --short\ngit add -A\ngit commit -m \"Add the overdue badge with tests, quality records and the architecture notes\""
    verify:
      - id: feature-tests
        text:
          uk: "Функція «Прострочено» працює на заявленій цілі; `npm test` і `npx tsc --noEmit` зелені, і я бачив, як кожен тест падає на зламаному правилі."
          en: "The “Overdue” feature works on my declared target; `npm test` and `npx tsc --noEmit` are green, and I saw each test fail on a broken rule."
      - id: gaps-confirmed
        text:
          uk: "`QUALITY.md` має щонайменше дві прогалини mock-ів, і щонайменше одну я підтвердив перевіркою на цілі із повним записом."
          en: "`QUALITY.md` has at least two mock gaps, and I confirmed at least one with a check on the target and a full record."
      - id: signed-provenance
        text:
          uk: "Release-збірку `1.1.0` підписано моїм ключем і встановлено як оновлення; у `QUALITY.md` — її commit, версія, номер і відбиток сертифіката."
          en: "The `1.1.0` release build is signed with my key and installed as an update; `QUALITY.md` has its commit, version, number and certificate fingerprint."
      - id: records-skips
        text:
          uk: "Кожна перевірка — запис із походженням, а кожна, якої я не виконав, — запис пропуску із причиною й планом повернення."
          en: "Every check is a record with its provenance, and every check I did not perform is a skip record with a reason and a way back."
      - id: architecture
        text:
          uk: "Розділ «Architecture and interop» написано моїми словами й оцінено за чотирма критеріями."
          en: "The “Architecture and interop” section is written in my own words and graded against the four criteria."
      - id: no-secrets
        text:
          uk: "У репозиторії немає ні keystore, ні паролів (перевірено `git grep` і `git status`)."
          en: "The repository has neither a keystore nor passwords (checked with `git grep` and `git status`)."
    troubleshooting:
      - problem:
          uk: "`npx tsc --noEmit` пише `Cannot find name 'test'`"
          en: "`npx tsc --noEmit` says `Cannot find name 'test'`"
        fix:
          uk: "TypeScript 6 із шаблону сам не підключає типи Jest: додай `\"types\": [\"jest\"]` у `compilerOptions` файла `tsconfig.json`, як у RN-07."
          en: "TypeScript 6 from the template does not pick up Jest's types by itself: add `\"types\": [\"jest\"]` to `compilerOptions` in `tsconfig.json`, as in RN-07."
      - problem:
          uk: "Тест у Jest падає на `screen.getByLabelText` із повідомленням `` `render` function has not been called `` і стеком, що веде до `notImplemented` у `screen.ts`"
          en: "A Jest test fails at `screen.getByLabelText` with the message `` `render` function has not been called `` and a stack that leads to `notImplemented` in `screen.ts`"
        fix:
          uk: "У React Native Testing Library 14 `render` асинхронний: пиши `await render(…)` в `async`-тесті. Так ми й побачили цю помилку в нашому запуску, поки не додали `await`."
          en: "In React Native Testing Library 14 `render` is asynchronous: write `await render(…)` in an `async` test. That is how we saw this error in our run, until we added `await`."
    recovery:
      uk: "Кожен крок закомічено, тож `git restore .` повертає файли до останнього коміту, а `git log --oneline` показує, де ти. Keystore живе поза проєктом і від проєкту не залежить — не видаляй його разом із ним."
      en: "Every step is committed, so `git restore .` brings the files back to the last commit, and `git log --oneline` shows where you are. The keystore lives outside the project and does not depend on it — do not delete it together with the project."
