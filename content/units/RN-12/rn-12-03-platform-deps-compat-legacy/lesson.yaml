id: rn-12-03-platform-deps-compat-legacy
unit: RN-12
title:
  uk: "Платформні залежності, сумісність і міграція legacy-коду"
  en: "Platform dependencies, compatibility and legacy migration"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Вирішити для наданого запиту на можливість, чи потрібна наявна бібліотека, API платформи через перевірену бібліотеку чи власний native-модуль, і коли спершу потрібна перевірка сумісності."
    en: "Decide, for a supplied capability request, whether an existing library, a platform API through a vetted library or a custom native module is needed, and when a compatibility spike must come first."
  - uk: "Прочитати нотатку про міграцію з legacy-архітектури й визначити, що покриває шар сумісності, а що ще треба змінити."
    en: "Read a legacy-architecture migration note and identify what the interop layer covers and what must still change."
prerequisites: [rn-12-02-native-modules-interop, js-15-04-install-lockfile-semver]
subskills:
  - { family: N-09, skill: "platform dependencies/compatibility", depth: intro }
  - { family: N-09, skill: "legacy migration reading", depth: intro }
glossary: [autolinking, compatibility-spike, interop-layer]
selfCheck: [three-libraries, spike-plan]

blocks:
  - id: three-routes
    kind: explanation
    title:
      uk: "Три шляхи до можливості"
      en: "Three routes to a capability"
    body:
      uk: |
        Коли продукт просить «вміти X на телефоні», перевір шляхи по черзі — від найдешевшого:

        1. **Вбудоване.** Чи має це сам React Native? Наприклад, `Share` відкриває системне вікно «Поділитися», `Linking` — посилання (RN-04). Native-коду не додається.
        2. **Бібліотека.** Модуль Expo SDK чи бібліотека спільноти, що прямо пише про підтримку твоєї версії React Native і нової архітектури. Native-код додається.
        3. **Власний native-модуль** — коли нічого немає, наприклад виробник пристрою дає лише SDK для Android та iOS. Native-код пишеш ти, на обох платформах.

        Щойно шлях **додає native-код**, спершу роби [[compatibility-spike|перевірку сумісності]]: окрема гілка, точні версії, один мінімальний екран, результат, що бібліотеку відкидає, і відкат — видалити гілку.
      en: |
        When the product asks to “be able to do X on the phone”, check the routes in order — from the cheapest:

        1. **Built-in.** Does React Native itself have it? For example, `Share` opens the system “Share” sheet, `Linking` opens links (RN-04). No native code is added.
        2. **A library.** An Expo SDK module or a community library that states support for your React Native version and the new architecture. Native code is added.
        3. **A custom native module** — when nothing exists, for example a device maker gives only Android and iOS SDKs. You write the native code, on both platforms.

        As soon as a route **adds native code**, first do a [[compatibility-spike]]: a separate branch, exact versions, one minimal screen, a result that rejects the library, and a rollback — delete the branch.

  - id: installed-is-not-working
    kind: explanation
    title:
      uk: "«Встановилося» — ще не «працює»"
      en: "“Installed” is not “works”"
    body:
      uk: |
        `npm install` лише кладе пакет у `node_modules` і записує версію в lockfile (JS-15). Native-код бібліотеки потрапляє в застосунок пізніше: під час наступної native-збірки його підключає [[autolinking]]. Тому встановлення без помилок нічого не каже про:

        - **платформи** — бібліотека може мати код лише для iOS, і на Android її модуля просто не буде;
        - **архітектуру** — бібліотека старої архітектури без власної специфікації;
        - **твою версію** — README може обіцяти «0.70–0.81».

        А ще бібліотеку з native-кодом не завантажиш у готовий застосунок без нової збірки (RN-01, [[native-rebuild|перезбирання]]). Перевіряй на заявленій цілі, а не в `npm`.
      en: |
        `npm install` only puts the package into `node_modules` and records the version in the lockfile (JS-15). The library's native code gets into the app later: [[autolinking]] links it during the next native build. So an install without errors says nothing about:

        - **platforms** — the library may have code only for iOS, and on Android its module simply will not be there;
        - **architecture** — an old-architecture library without its own spec;
        - **your version** — the README may promise “0.70–0.81”.

        And a library with native code cannot be loaded into an existing app without a new build (RN-01, [[native-rebuild]]). Check on the declared target, not in `npm`.

  - id: three-libraries
    kind: prediction
    prompt:
      uk: |
        Проєкт на React Native 0.86.3, заявлена ціль — Android-емулятор. Усі три бібліотеки встановилися без помилок. Що кажуть їхні README:

        - **A.** `habit-calendar@4.2.0`: «New Architecture, React Native 0.76+, Android і iOS».
        - **B.** `step-sensor-legacy@1.9.0`: «React Native 0.70–0.81. З новою архітектурою постав `newArchEnabled=false`».
        - **C.** `face-unlock@2.0.0`: «iOS 17+, New Architecture».

        Яка з них, за своїм README, обіцяє працювати на твоїй цілі — з твоєю версією, архітектурою й платформою?
      en: |
        The project is on React Native 0.86.3, the declared target is an Android emulator. All three libraries installed without errors. What their READMEs say:

        - **A.** `habit-calendar@4.2.0`: “New Architecture, React Native 0.76+, Android and iOS”.
        - **B.** `step-sensor-legacy@1.9.0`: “React Native 0.70–0.81. With the new architecture, set `newArchEnabled=false`”.
        - **C.** `face-unlock@2.0.0`: “iOS 17+, New Architecture”.

        Which of them, according to its README, promises to work on your target — with your version, architecture and platform?
    answer:
      type: multi
      options:
        - id: a
          text: { uk: "A", en: "A" }
        - id: b
          text: { uk: "B", en: "B" }
          why:
            uk: "У 0.86 прапорець `newArchEnabled=false` ігнорується (з 0.82), а версії 0.82+ README не обіцяє. B може запрацювати лише через шар сумісності — це й треба перевірити spike-ом."
            en: "In 0.86 the `newArchEnabled=false` flag is ignored (since 0.82), and the README does not promise 0.82+. B can only run through the interop layer — that is exactly what a spike has to check."
        - id: c
          text: { uk: "C", en: "C" }
          why:
            uk: "C має код лише для iOS. Встановлення на Android вдалося, бо `npm install` нічого не збирає; на Android-цілі модуля не буде зовсім."
            en: "C has code only for iOS. The install succeeded on Android because `npm install` builds nothing; on the Android target the module will not exist at all."
      correct: [a]
    explanation:
      uk: "Лише A обіцяє твою версію, архітектуру й платформу. «Обіцяє» — ще не «працює»: A теж додає native-код, тож і для неї спершу spike, просто README не віщує сюрпризів. B може запрацювати лише через шар сумісності — це й має показати її spike, а C на Android не підходить зовсім."
      en: "Only A promises your version, architecture and platform. “Promises” is not “works”: A also adds native code, so it too gets a spike first — its README just predicts no surprises. B can only run through the interop layer — that is what its spike has to show — and C does not fit Android at all."

  - id: compat-table
    kind: example
    runtime: concept-preview
    dir: compat-table
    entry: main.jsx
    strings:
      statusNew: { uk: "працює (нова архітектура)", en: "works (new architecture)" }
      statusLegacyFlag: { uk: "лише стара архітектура: newArchEnabled=false", en: "old architecture only: newArchEnabled=false" }
      statusInterop: { uk: "лише через шар сумісності — спершу spike", en: "only through the interop layer — spike first" }
      statusNone: { uk: "платформа не підтримується", en: "the platform is not supported" }
      statusNoRow: { uk: "README не згадує цієї версії", en: "the README does not mention this version" }
    title:
      uk: "Таблиця сумісності для твоєї версії"
      en: "A compatibility table for your version"
    body:
      uk: |
        `support.js` — рядки підтримки трьох вигаданих бібліотек, переписані з їхніх README. `project.js` — версія React Native з `package.json` і платформи заявленої цілі. Перегляд знаходить для кожної бібліотеки рядок, що покриває твою версію.

        Натисни **Запустити**.
      en: |
        `support.js` holds the support rows of three invented libraries, copied from their READMEs. `project.js` holds the React Native version from `package.json` and the platforms of the declared target. The preview finds, for every library, the row that covers your version.

        Press **Run**.
    tryIt:
      uk: |
        1. Прочитай статуси на `0.86.3`: `step-sensor-legacy` — «лише через шар сумісності», `face-unlock` — «платформа не підтримується».
        2. У `project.js` заміни `'0.86.3'` на `'0.81.5'` і запусти. Рядок `step-sensor-legacy` змінився: до 0.82 стару архітектуру ще можна було ввімкнути прапорцем.
        3. Поверни `'0.86.3'` і заміни `targets` на `['android', 'ios']`: у кожної бібліотеки тепер два рядки, і `face-unlock` на iOS працює. Поверни `['android']`.
      en: |
        1. Read the statuses on `0.86.3`: `step-sensor-legacy` is “only through the interop layer”, `face-unlock` is “the platform is not supported”.
        2. In `project.js` replace `'0.86.3'` with `'0.81.5'` and run. The `step-sensor-legacy` row changed: before 0.82 the old architecture could still be turned on with a flag.
        3. Put `'0.86.3'` back and replace `targets` with `['android', 'ios']`: every library now has two lines, and `face-unlock` works on iOS. Put `['android']` back.
    limits:
      uk: "Перегляд react-native-web у браузері. Бібліотеки й рядки підтримки вигадані; таблиця лише порівнює версії й платформи з README. Тут нічого не встановлюється й не збирається, тож справжня сумісність видна лише на заявленій цілі під час spike."
      en: "A react-native-web preview in the browser. The libraries and support rows are invented; the table only compares versions and platforms from READMEs. Nothing is installed or built here, so real compatibility shows only on the declared target during a spike."

  - id: interop-reading
    kind: explanation
    title:
      uk: "Що покриває шар сумісності"
      en: "What the interop layer covers"
    body:
      uk: |
        Бібліотека старої архітектури в проєкті 0.86 не обов’язково «або працює як є, або переписується з нуля». Між ними — [[interop-layer|шар сумісності]]. За дописом [The New Architecture is here](https://reactnative.dev/blog/2024/10/23/the-new-architecture-is-here) (0.76):

        | Шар сумісності покриває | Потребує міграції бібліотеки |
        |---|---|
        | виклики старих методів модуля з JavaScript | синхронні виклики методів |
        | старі view manager усередині Fabric | перевірку типів аргументів codegen-ом і спільний C++ |
        | | власні shadow node (власне вимірювання view) і конкурентні можливості React |

        Допис про 0.82 обіцяє лишити шар «на осяжне майбутнє»; у коді React Native 0.86.3 ми його знайшли (`JavaInteropTurboModule`, `RCTInteropTurboModule`, `LegacyViewManagerInterop`). Тож нотатку про міграцію читай так: кожен рядок — або «покриває шар», або «треба змінити».
      en: |
        An old-architecture library in a 0.86 project does not have to “either work as is or be rewritten from scratch”. Between the two is the [[interop-layer]]. According to the post [The New Architecture is here](https://reactnative.dev/blog/2024/10/23/the-new-architecture-is-here) (0.76):

        | The interop layer covers | Needs the library migrated |
        |---|---|
        | calls of the module's old methods from JavaScript | synchronous method calls |
        | old view managers inside Fabric | codegen type checking of arguments and shared C++ |
        | | custom shadow nodes (a view's own measuring) and React's concurrent features |

        The 0.82 post promises to keep the layer “for the foreseeable future”; we found it in the React Native 0.86.3 code (`JavaInteropTurboModule`, `RCTInteropTurboModule`, `LegacyViewManagerInterop`). So read a migration note this way: every line is either “the layer covers it” or “must change”.

  - id: spike-plan
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: spike-plan
    entry: main.jsx
    editable: [plan.js]
    strings:
      reqShare: { uk: "Поділитися тижневим підсумком звички як текстом через системне вікно «Поділитися».", en: "Share a habit’s weekly summary as text through the system “Share” sheet." }
      reqSteps: { uk: "Показувати кількість кроків за день для звички «Прогулянка». Знайшлася лише бібліотека step-sensor-legacy@1.9.0.", en: "Show the day’s step count for the habit “Go for a walk”. The only library found is step-sensor-legacy@1.9.0." }
      reqRing: { uk: "Читати пульс із фітнес-кільця, виробник якого дає лише native SDK для Android та iOS і жодного пакета React Native.", en: "Read the pulse from a fitness ring whose maker gives only native SDKs for Android and iOS and no React Native package." }
      rejBuild: { uk: "native-збірка з бібліотекою не проходить", en: "the native build with the library fails" }
      rejCrash: { uk: "застосунок падає на заявленій цілі", en: "the app crashes on the declared target" }
      rejFeature: { uk: "тестовий екран не показує кроків", en: "the test screen shows no steps" }
      rejSlow: { uk: "екран помітно гальмує на пристрої", en: "the screen is noticeably slow on the device" }
      rejIos: { uk: "на iOS не перевірено (цей комп’ютер не запускає iOS)", en: "not checked on iOS (this computer cannot run iOS)" }
      noteA: { uk: "Методи модуля getSteps і startUpdates викликаються з JavaScript без змін.", en: "The module’s methods getSteps and startUpdates are called from JavaScript unchanged." }
      noteB: { uk: "View manager StepRingManager малює кільце кроків усередині рендерера Fabric.", en: "The view manager StepRingManager draws the step ring inside the Fabric renderer." }
      noteC: { uk: "StepRing вимірює свій підпис власним shadow node.", en: "StepRing measures its label with a custom shadow node." }
      noteD: { uk: "Щоб викликати isAvailable() синхронно, без Promise.", en: "To call isAvailable() synchronously, without a Promise." }
      noteE: { uk: "Щоб codegen перевіряв типи аргументів getSteps.", en: "To have codegen check the argument types of getSteps." }
      screenText: { uk: "Один екран із кнопкою «Оновити», що показує getSteps() за сьогодні і кільце кроків.", en: "One screen with a “Refresh” button that shows getSteps() for today and the step ring." }
      spikeLabel: { uk: "спершу spike", en: "spike first" }
      planHeading: { uk: "План spike", en: "Spike plan" }
    title:
      uk: "Шлях, spike і нотатка про міграцію"
      en: "A route, a spike and a migration note"
    instructions:
      uk: |
        Трекер звичок отримав три запити (`request.js`, разом із проєктом і нотаткою про міграцію). Заповни `plan.js`:

        1. `routes` — шлях для кожного запиту: `'built-in'`, `'library'` чи `'custom-module'`.
        2. `spikeFirst` — `true`, якщо перед роботою потрібна перевірка сумісності, інакше `false`.
        3. `spikePlan` для бібліотеки кроків:
           - `library` — назва й версія точно як у запиті, без `^` і `~`;
           - `reactNative` — версія з `project`, точно як у `package.json`;
           - `targets` — платформи заявленої цілі з `project`;
           - `testScreen` — що робить один тестовий екран, щонайменше 20 символів;
           - `branch` — назва окремої гілки без пробілів, не `main`;
           - `rejectIf` — коди з `REJECT_CODES`, за якими бібліотеку відкидають: обов’язково провал збирання, падіння на цілі й відсутня функція.
        4. `noteSort` — кожен рядок нотатки: `'interop-covers'` чи `'must-change'`.
      en: |
        The habit tracker got three requests (`request.js`, together with the project and the migration note). Fill in `plan.js`:

        1. `routes` — the route for every request: `'built-in'`, `'library'` or `'custom-module'`.
        2. `spikeFirst` — `true` if a compatibility spike is needed before the work, otherwise `false`.
        3. `spikePlan` for the step library:
           - `library` — name and version exactly as in the request, without `^` or `~`;
           - `reactNative` — the version from `project`, exactly as in `package.json`;
           - `targets` — the platforms of the declared target from `project`;
           - `testScreen` — what the one test screen does, at least 20 characters;
           - `branch` — the name of a separate branch without spaces, not `main`;
           - `rejectIf` — codes from `REJECT_CODES` that reject the library: it must have a failed build, a crash on the target and a missing feature.
        4. `noteSort` — every line of the note: `'interop-covers'` or `'must-change'`.
    testTitles:
      "each request gets the right route":
        uk: "Кожен запит має правильний шлях"
        en: "Each request gets the right route"
      "a spike comes first exactly where native code is added":
        uk: "Spike іде першим саме там, де додається native-код"
        en: "A spike comes first exactly where native code is added"
      "the plan pins the exact library version":
        uk: "План фіксує точну версію бібліотеки"
        en: "The plan pins the exact library version"
      "the plan names the project React Native version":
        uk: "План називає версію React Native проєкту"
        en: "The plan names the project’s React Native version"
      "the plan runs on the declared target platforms":
        uk: "План перевіряє на платформах заявленої цілі"
        en: "The plan runs on the declared target’s platforms"
      "the test screen is described in at least 20 characters":
        uk: "Тестовий екран описано щонайменше 20 символами"
        en: "The test screen is described in at least 20 characters"
      "the spike lives on its own branch":
        uk: "Spike живе на окремій гілці"
        en: "The spike lives on its own branch"
      "the plan rejects the library on a failed build, a crash or a missing feature":
        uk: "План відкидає бібліотеку через провал збирання, падіння чи відсутню функцію"
        en: "The plan rejects the library on a failed build, a crash or a missing feature"
      "an unperformed iOS check is not a reason to reject":
        uk: "Невиконана перевірка на iOS — не причина відкинути"
        en: "An unperformed iOS check is not a reason to reject"
      "the migration note is sorted into what interop covers and what must change":
        uk: "Нотатку про міграцію розкладено на «покриває шар» і «треба змінити»"
        en: "The migration note is sorted into “the layer covers” and “must change”"
    hints:
      nudge:
        uk: "Для шляху й spike питай одне: чи додає цей запит native-код у застосунок? Для нотатки — таблицю «Що покриває шар сумісності»."
        en: "For the route and the spike, ask one thing: does this request add native code to the app? For the note, use the table “What the interop layer covers”."
      explanation:
        uk: "Вбудований API React Native не додає native-коду, тож spike не потрібен; будь-яка бібліотека чи власний модуль — додають. Точна версія — без діапазону semver: spike перевіряє одну конкретну версію. Невиконана перевірка на цілі, якої немає, — запис пропуску (RN-08), а не результат. Наприклад, у плані spike для календарної бібліотеки `rejectIf` міг би мати `'slow-on-device'`, але не «не перевірено на планшеті»."
        en: "A built-in React Native API adds no native code, so no spike is needed; any library or custom module does add it. An exact version means no semver range: a spike checks one specific version. An unperformed check on a target you do not have is a skip record (RN-08), not a result. For example, in a spike plan for a calendar library `rejectIf` could have `'slow-on-device'`, but not “not checked on a tablet”."
    solutionNote:
      uk: "`Share` вбудований — native-коду не додається. Для кроків є бібліотека, але стара: шлях — бібліотека, і саме тому spike першим, на окремій гілці з точною версією. Для кільця нічого немає — власний модуль, теж зі spike. iOS тут не ціль, тож вона не причина відкинути, а запис пропуску. У нотатці виклики методів і старий view manager покриває шар сумісності, а синхронний виклик, перевірка типів codegen і власний shadow node потребують міграції."
      en: "`Share` is built in — no native code is added. For steps there is a library, but an old one: the route is the library, and that is why a spike comes first, on a separate branch with the exact version. For the ring nothing exists — a custom module, also with a spike. iOS is not a target here, so it is not a reason to reject but a skip record. In the note, method calls and the old view manager are covered by the interop layer, while a synchronous call, codegen type checking and a custom shadow node need a migration."
    feedback:
      - when: { test: "each request gets the right route" }
        message:
          uk: "Ця перевірка чекає шлях для кожного з трьох запитів: чи має це React Native сам, чи є бібліотека, чи нічого немає. Стара бібліотека — все одно бібліотека: це питання для spike, а не причина писати власний модуль."
          en: "This check expects a route for each of the three requests: does React Native have it itself, is there a library, or does nothing exist. An old library is still a library: that is a question for a spike, not a reason to write your own module."
      - when: { test: "a spike comes first exactly where native code is added" }
        message:
          uk: "Ця перевірка чекає `true` там, де запит додає native-код, і `false` там, де не додає. Встановлення без помилок — не причина пропустити spike."
          en: "This check expects `true` where a request adds native code and `false` where it does not. An install without errors is not a reason to skip the spike."
      - when: { test: "the plan pins the exact library version" }
        message:
          uk: "Ця перевірка чекає `library` точно як у запиті: назва, `@` і версія, без `^` чи `~`."
          en: "This check expects `library` exactly as in the request: the name, `@` and the version, without `^` or `~`."
      - when: { test: "the plan names the project React Native version" }
        message:
          uk: "Ця перевірка чекає в `reactNative` версію з `project` у `request.js` — точно так, як у `package.json`."
          en: "This check expects in `reactNative` the version from `project` in `request.js` — exactly as in `package.json`."
      - when: { test: "the plan runs on the declared target platforms" }
        message:
          uk: "Ця перевірка чекає в `targets` ті самі платформи, що в `project.targets`. Платформа, якої цей комп’ютер не запускає, — не ціль spike."
          en: "This check expects in `targets` the same platforms as in `project.targets`. A platform this computer cannot run is not a spike target."
      - when: { test: "the test screen is described in at least 20 characters" }
        message:
          uk: "Ця перевірка чекає в `testScreen` опис щонайменше з 20 символів: що показує екран і що на ньому натискають."
          en: "This check expects a description of at least 20 characters in `testScreen`: what the screen shows and what is pressed on it."
      - when: { test: "the spike lives on its own branch" }
        message:
          uk: "Ця перевірка чекає в `branch` назву гілки без пробілів, яка не є `main` чи `master`: відкат spike — просто видалити його гілку."
          en: "This check expects in `branch` a branch name without spaces that is not `main` or `master`: rolling a spike back is just deleting its branch."
      - when: { test: "the plan rejects the library on a failed build, a crash or a missing feature" }
        message:
          uk: "Ця перевірка чекає в `rejectIf` три коди: `'build-fails'`, `'crash-on-target'` і `'feature-missing'`."
          en: "This check expects three codes in `rejectIf`: `'build-fails'`, `'crash-on-target'` and `'feature-missing'`."
      - when: { test: "an unperformed iOS check is not a reason to reject" }
        message:
          uk: "Ця перевірка чекає, що `rejectIf` не має `'ios-unchecked'`: перевірку, якої не виконано, записують як пропуск, а не як результат spike."
          en: "This check expects `rejectIf` without `'ios-unchecked'`: a check that was not performed is recorded as a skip, not as a spike result."
      - when: { test: "the migration note is sorted into what interop covers and what must change" }
        message:
          uk: "Ця перевірка чекає для кожного з `a`…`e` значення `'interop-covers'` чи `'must-change'` за таблицею «Що покриває шар сумісності»."
          en: "This check expects `'interop-covers'` or `'must-change'` for each of `a`…`e`, following the table “What the interop layer covers”."
    limits:
      uk: "Перегляд react-native-web у браузері. Запити, бібліотеки й нотатка вигадані; перевірки бачать лише твої рішення в `plan.js`. Справжню сумісність покаже лише spike на заявленій цілі."
      en: "A react-native-web preview in the browser. The requests, libraries and note are invented; the checks see only your decisions in `plan.js`. Only a spike on the declared target shows real compatibility."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: migration-step
        from: rn-05-03-schema-migration
        prompt:
          uk: "Трекер переходить зі схеми 1 на схему 2. Що робить крок міграції безпечним?"
          en: "A tracker moves from schema 1 to schema 2. What makes the migration step safe?"
        answer:
          type: choice
          options:
            - id: numbered-tested
              text: { uk: "Нумерований крок 1 → 2, перевірений на копії старого знімка, а знімок новішої версії не перезаписується", en: "A numbered step 1 → 2, tested on a copy of an old snapshot, and a snapshot of a newer version is not overwritten" }
            - id: clear
              text: { uk: "Очистити сховище й почати з порожнього списку", en: "Clear the storage and start with an empty list" }
              why:
                uk: "Так записи людини зникають мовчки. Міграція переносить дані, а не видаляє їх."
                en: "That way the person’s records vanish silently. A migration carries data over; it does not delete it."
            - id: same-shape
              text: { uk: "Нічого: новий код сам прочитає старі дані", en: "Nothing: the new code will read the old data by itself" }
              why:
                uk: "Старий знімок не «наздоганяє» новий код сам: без кроку в нього бракує нових полів."
                en: "An old snapshot does not “catch up” with new code by itself: without a step it lacks the new fields."
          correct: [numbered-tested]
        explanation:
          uk: "Spike сумісності — та сама ідея для бібліотек: один версіонований крок, перевірений до того, як від нього залежать люди, і шлях назад."
          en: "A compatibility spike is the same idea for libraries: one versioned step, checked before people depend on it, and a way back."

  - id: to-project
    kind: transfer
    checkpoint: CP-RN
    body:
      uk: "Твій проєкт не змінюється. Якщо колись захочеш додати до нього native-бібліотеку, спершу пройди три шляхи цього уроку, а потім зроби spike на окремій гілці з точною версією — основна гілка проєкту з CP-RN лишиться робочою."
      en: "Your project does not change. If you ever want to add a native library to it, first go through the three routes of this lesson, then do a spike on a separate branch with the exact version — your project's main branch from CP-RN stays working."
