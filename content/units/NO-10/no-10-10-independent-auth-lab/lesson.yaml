id: no-10-10-independent-auth-lab
unit: NO-10
title:
  uk: "Самостійно: лабораторна з автентифікації, сесій і власності"
  en: "Independent: auth/session/ownership lab"
kind: assessment
minutes: 40
contentVersion: 1
objectives:
  - uk: "Без підказок побудувати локальний сервіс для синтетичних користувачів із перевіреним хешуванням паролів, сесіями, перевіркою власності, секретами з конфігурації, обмеженням входу із захистом від CSRF і лімітами розміру й часу."
    en: "Build, without hints, a local service for synthetic users with vetted password hashing, sessions, ownership checks, secrets from config, login throttling with CSRF protection and size and time limits."
  - uk: "Скласти його модель загроз і тести, що відхиляють доступ до чужих даних, прострочені чи відкликані сесії та підроблені чи завеликі запити, і пояснити вибір сесії замість токена та чому жодна криптографія не саморобна."
    en: "Write its threat model and tests that reject cross-user access, expired or revoked sessions and forged or oversized requests, and explain the session-versus-token choice and why no cryptography is home-made."
purpose:
  uk: "Перевірити, що ти сам складаєш усе з лабораторної — дві брами, хеш пароля, сесії зі строками й відкликанням, власність, секрети, ліміти входу й Origin — в одному сервісі, і доводиш кожен контроль справжніми запитами: спершу перевірками платформи, потім власним скриптом атаки у своєму терміналі."
  en: "To check that you put everything from the lab together on your own — two gates, a password hash, sessions with expiry and revocation, ownership, secrets, login limits and Origin — in one service, and prove every control with real requests: first with the platform's checks, then with an attack script in your own terminal."
prerequisites: [no-10-09-debug-cross-user-access]
subskills:
  - { family: B-06, skill: "authn vs authz", depth: assess }
  - { family: B-06, skill: "local synthetic identity", depth: assess }
  - { family: B-06, skill: "vetted password hashing", depth: assess }
  - { family: B-06, skill: "secrets and secure config", depth: assess }
  - { family: B-06, skill: "login abuse controls/CSRF context", depth: assess }
  - { family: B-07, skill: "rate/size/time limits", depth: assess }
  - { family: B-07, skill: "threat model", depth: assess }
glossary: []
selfCheck: [bookmarks-service]

blocks:
  - id: what-you-build
    kind: explanation
    title:
      uk: "Що ти будуєш"
      en: "What you build"
    body:
      uk: |
        Сервіс закладок для трьох синтетичних користувачів, що поєднує всю лабораторну. Підказок немає: умова вправи — увесь контракт, а перевірки надсилають твоєму серверу справжні HTTP-запити й рухають його годинник.

        Потім, у локальному завданні, ти запустиш сервіс у своєму терміналі на `127.0.0.1`, натравиш на нього наданий скрипт атаки, запишеш його звіт і модель загроз — і відповіси на два питання: чому сесія, а не токен, і чому жоден рядок криптографії не саморобний.

        Ні облікових записів у хмарі, ні сервісів входу, ні npm-пакетів тут не треба: лише `node:crypto`, `node:http` і синтетичні користувачі.
      en: |
        A bookmarks service for three synthetic users that puts the whole lab together. There are no hints: the exercise's task is the whole contract, and the checks send your server real HTTP requests and move its clock.

        Then, in the local task, you start the service in your own terminal on `127.0.0.1`, set the supplied attack script on it, record its report and a threat model — and answer two questions: why a session and not a token, and why not a single line of cryptography is home-made.

        No cloud accounts, no sign-in services and no npm packages are needed here: only `node:crypto`, `node:http` and synthetic users.

  - id: bookmarks-service
    kind: exercise
    mode: independent
    assessment: true
    runtime: isolated-node
    dir: bookmarks-service
    entry: index.js
    editable: [app.js, passwords.js, index.js]
    capabilities: { network: loopback, timeoutMs: 30000, testTimeoutMs: 8000 }
    strings:
      docs: { uk: "Документація", en: "Documentation" }
      recipes: { uk: "Рецепти", en: "Recipes" }
      maps: { uk: "Мапи", en: "Maps" }
      music: { uk: "Музика", en: "Music" }
    title:
      uk: "Сервіс закладок для синтетичних користувачів"
      en: "A bookmarks service for synthetic users"
    instructions:
      uk: |
        **Дані.** `users.js` (лише для читання) — користувачі `u-01`, `u-02`, `u-03` зі збереженими записами scrypt (`passwordHash`) і закладки `b-1`…`b-4`. Лабораторні паролі: `sunflower-42`, `river-stone-7`, `quiet-harbor-19`. `http-helpers.js` має `sendJson`, `sendError` і `readJsonBody(request, maxBytes)`, яка кидає помилку зі `status: 413` чи `400`.

        **`passwords.js`:** `hashPassword(password)` → `{ algorithm: 'scrypt', N, r, p, salt, hash }` (нова випадкова сіль на 16 байтів, base64); `verifyPassword(password, stored)` обчислює scrypt зі збереженими сіллю й параметрами й порівнює через `crypto.timingSafeEqual`.

        **`app.js`:** `createApp({ env, clock })` повертає `http.Server`; `clock.now()` — мілісекунди.

        - `env.SESSION_SECRET` відсутній, заглушка (`changeme`) чи коротший за 32 символи — `createApp` кидає помилку, у повідомленні якої немає значення.
        - `POST /login` `{ user, password }` → 204 і cookie `sid` (32 випадкові байти, `HttpOnly`, `SameSite=Lax`, `Path=/`). Невідомий користувач і хибний пароль — однакова відповідь 401. Тіло понад 1024 байти — 413.
        - 5 невдалих входів за 60 с для облікового запису чи для адреси — далі 429 із `Retry-After` у секундах, поки вікно не мине.
        - Сесія діє не більше 30 хвилин без запитів і не більше 2 годин від входу (обидві межі включно); інакше 401. `POST /logout` → 204, і стара cookie більше не працює.
        - `GET /bookmarks` — лише закладки власника; `GET` і `DELETE /bookmarks/:id` для чужої чи відсутньої закладки — 404; `POST /bookmarks` `{ title, url }` → 201. Без сесії — 401.
        - Будь-який запит, крім `GET`, `HEAD` і `OPTIONS`, із заголовком `Origin`, відмінним від `http://127.0.0.1:4310`, — 403. Без `Origin` — пропускай.
        - Сервер обмежує час надходження запиту: `requestTimeout` і `headersTimeout` — не більше 5000 мс. Node.js перевіряє ці межі за таймером `connectionsCheckingInterval` (типово раз на 30 с), тож без нього повільний запит обірветься через 5 с або аж до 30 с пізніше.
        - Помилки — `{ error: { code, details } }`.
      en: |
        **Data.** `users.js` (read-only) holds the users `u-01`, `u-02`, `u-03` with stored scrypt records (`passwordHash`) and the bookmarks `b-1`…`b-4`. The lab passwords: `sunflower-42`, `river-stone-7`, `quiet-harbor-19`. `http-helpers.js` has `sendJson`, `sendError` and `readJsonBody(request, maxBytes)`, which throws an error with `status: 413` or `400`.

        **`passwords.js`:** `hashPassword(password)` → `{ algorithm: 'scrypt', N, r, p, salt, hash }` (a new random 16-byte salt, base64); `verifyPassword(password, stored)` computes scrypt with the stored salt and parameters and compares with `crypto.timingSafeEqual`.

        **`app.js`:** `createApp({ env, clock })` returns an `http.Server`; `clock.now()` is milliseconds.

        - `env.SESSION_SECRET` missing, a placeholder (`changeme`) or shorter than 32 characters — `createApp` throws an error whose message does not contain the value.
        - `POST /login` `{ user, password }` → 204 and a `sid` cookie (32 random bytes, `HttpOnly`, `SameSite=Lax`, `Path=/`). An unknown user and a wrong password get the same 401 answer. A body over 1024 bytes — 413.
        - 5 failed logins within 60 s for an account or for an address — then 429 with `Retry-After` in seconds until the window has passed.
        - A session lasts at most 30 minutes without requests and at most 2 hours after login (both limits inclusive); otherwise 401. `POST /logout` → 204, and the old cookie no longer works.
        - `GET /bookmarks` — only the owner's bookmarks; `GET` and `DELETE /bookmarks/:id` for someone else's or a missing bookmark — 404; `POST /bookmarks` `{ title, url }` → 201. Without a session — 401.
        - Any request except `GET`, `HEAD` and `OPTIONS` with an `Origin` header other than `http://127.0.0.1:4310` — 403. Without `Origin` — let it through.
        - The server limits how long a request may take to arrive: `requestTimeout` and `headersTimeout` at most 5000 ms. Node.js checks these limits on the `connectionsCheckingInterval` timer (every 30 s by default), so without changing it a slow request is cut after 5 s or up to 30 s later.
        - Errors are `{ error: { code, details } }`.
    testTitles:
      "passwords: scrypt with a random 16-byte salt and stored parameters":
        uk: "Паролі: scrypt із випадковою сіллю на 16 байтів і збереженими параметрами"
        en: "Passwords: scrypt with a random 16-byte salt and stored parameters"
      "createApp refuses a missing, placeholder or short SESSION_SECRET without printing it":
        uk: "`createApp` відмовляє без `SESSION_SECRET`, із заглушкою чи коротким ключем і не показує значення"
        en: "`createApp` refuses a missing, placeholder or short `SESSION_SECRET` without printing it"
      "login sets an HttpOnly, SameSite=Lax session cookie; unknown user and wrong password get the same 401":
        uk: "Вхід ставить cookie сесії з `HttpOnly` і `SameSite=Lax`; невідомий користувач і хибний пароль отримують однаковий 401"
        en: "Login sets an `HttpOnly`, `SameSite=Lax` session cookie; unknown user and wrong password get the same 401"
      "the sixth failed login in a minute answers 429 with Retry-After; a minute later login works":
        uk: "Шостий невдалий вхід за хвилину — 429 з `Retry-After`; коли хвилина минула, вхід працює"
        en: "The sixth failed login in a minute answers 429 with `Retry-After`; a minute later login works"
      "a login body over 1 KB answers 413":
        uk: "Тіло входу понад 1 КБ — 413"
        en: "A login body over 1 KB answers 413"
      "bookmarks are scoped to their owner: foreign ones answer 404 and stay":
        uk: "Закладки обмежено власником: чужі — 404, і вони лишаються"
        en: "Bookmarks are scoped to their owner: foreign ones answer 404 and stay"
      "sessions expire after 30 idle minutes or 2 hours, and logout revokes them":
        uk: "Сесії закінчуються після 30 хвилин бездіяльності чи 2 годин, а вихід їх відкликає"
        en: "Sessions expire after 30 idle minutes or 2 hours, and logout revokes them"
      "a state-changing request from a foreign origin, even another port, answers 403":
        uk: "Запит, що змінює дані, із чужого походження — навіть з іншого порту — 403"
        en: "A state-changing request from a foreign origin, even another port, answers 403"
      "the server limits how long a request may take to arrive: at most 5 s":
        uk: "Сервер обмежує час надходження запиту: не більше 5 с"
        en: "The server limits how long a request may take to arrive: at most 5 s"
      "errors have the shape { error: { code, details } }":
        uk: "Помилки мають форму `{ error: { code, details } }`"
        en: "Errors have the shape `{ error: { code, details } }`"
    solutionNote:
      uk: "Еталонне рішення перевіряє ключ до створення сервера; на кожен запит спершу дивиться на `Origin`, потім — вхід або сесія (строки з `clock.now()`, кожен запит оновлює `lastSeenAt`), а пошук закладки завжди містить власника. Лічильники невдач — окремо для облікового запису й адреси, з вікном і стелею кількості, і перевіряються до scrypt. Невідомий користувач перевіряється проти справжнього запису, щоб обидві невдачі коштували однаково. `requestTimeout` і `headersTimeout` задано в `http.createServer`."
      en: "The reference solution checks the key before creating the server; on every request it looks at `Origin` first, then the login or the session (limits from `clock.now()`, every request updates `lastSeenAt`), and the bookmark lookup always includes the owner. The failure counters are separate per account and per address, with a window and a ceiling on their number, and are checked before scrypt. An unknown user is checked against a real record, so both failures cost the same. `requestTimeout` and `headersTimeout` are set in `http.createServer`."
    feedback:
      - when: { test: "passwords: scrypt with a random 16-byte salt and stored parameters" }
        message:
          uk: "Ця перевірка двічі хешує один пароль і чекає різну сіль на 16 байтів, хеш, що дорівнює scrypt пароля зі збереженими сіллю й `N`, `r`, `p`, і рівно два виклики `crypto.timingSafeEqual` на два входи."
          en: "This check hashes one password twice and expects a different 16-byte salt, a hash equal to scrypt of the password with the stored salt and `N`, `r`, `p`, and exactly two calls of `crypto.timingSafeEqual` for two logins."
      - when: { test: "createApp refuses a missing, placeholder or short SESSION_SECRET without printing it" }
        message:
          uk: "Ця перевірка викликає `createApp` з `{}`, `changeme` і `my-own-key-2026` і чекає, що кожен виклик кине помилку, у тексті якої немає значення ключа."
          en: "This check calls `createApp` with `{}`, `changeme` and `my-own-key-2026` and expects every call to throw an error whose text does not contain the key's value."
      - when: { test: "login sets an HttpOnly, SameSite=Lax session cookie; unknown user and wrong password get the same 401" }
        message:
          uk: "Ця перевірка чекає 204 і `Set-Cookie` з `sid` (43+ символи base64url чи 64+ hex), `HttpOnly`, `SameSite=Lax` і `Path=/`, а для хибного пароля й невідомого `u-77` — 401 з однаковим тілом."
          en: "This check expects 204 and a `Set-Cookie` with `sid` (43+ base64url or 64+ hex characters), `HttpOnly`, `SameSite=Lax` and `Path=/`, and 401 with the same body for a wrong password and for the unknown `u-77`."
      - when: { test: "the sixth failed login in a minute answers 429 with Retry-After; a minute later login works" }
        message:
          uk: "Ця перевірка надсилає шість хибних паролів для `u-02` і чекає `[401, 401, 401, 401, 401, 429]` з `Retry-After: 60`, а через 61 с за годинником — успішний вхід. Потім п’ять різних імен помиляються з тієї самої адреси, і шосте ім’я теж має отримати 429: лічильник адреси окремий від лічильника облікового запису."
          en: "This check sends six wrong passwords for `u-02` and expects `[401, 401, 401, 401, 401, 429]` with `Retry-After: 60`, then a successful login 61 s later by the clock. Then five different names fail from the same address, and a sixth name must get 429 too: the address counter is separate from the account counter."
      - when: { test: "a login body over 1 KB answers 413" }
        message:
          uk: "Ця перевірка надсилає на `/login` тіло на 3 КБ і чекає 413. Обмеження задає другий аргумент `readJsonBody(request, maxBytes)`."
          en: "This check sends a 3 KB body to `/login` and expects 413. The limit is the second argument of `readJsonBody(request, maxBytes)`."
      - when: { test: "bookmarks are scoped to their owner: foreign ones answer 404 and stay" }
        message:
          uk: "Ця перевірка чекає в списку `u-01` рівно `b-1` і `b-2`, 404 для `GET` і `DELETE /bookmarks/b-1` від `u-02`, 200 для власниці після цього, 404 для `b-9`, якої немає, і 401 без сесії."
          en: "This check expects exactly `b-1` and `b-2` in `u-01`'s list, 404 for `GET` and `DELETE /bookmarks/b-1` from `u-02`, 200 for the owner afterwards, 404 for the missing `b-9`, and 401 without a session."
      - when: { test: "a state-changing request from a foreign origin, even another port, answers 403" }
        message:
          uk: "Ця перевірка надсилає `POST /bookmarks` із сесією й `Origin: http://127.0.0.1:5173` і чекає 403, а з `http://127.0.0.1:4310` і без `Origin` — 201."
          en: "This check sends `POST /bookmarks` with a session and `Origin: http://127.0.0.1:5173` and expects 403, and 201 with `http://127.0.0.1:4310` and with no `Origin`."
      - when: { test: "errors have the shape { error: { code, details } }" }
        message:
          uk: "Ця перевірка читає тіло 401 без сесії й 401 після хибного пароля й чекає в обох `error.code` (непорожній текст) і `error.details` (об’єкт). `sendError` з `http-helpers.js` уже будує саме таке тіло."
          en: "This check reads the body of a 401 without a session and of a 401 after a wrong password and expects `error.code` (non-empty text) and `error.details` (an object) in both. `sendError` from `http-helpers.js` already builds exactly this body."
      - when: { test: "sessions expire after 30 idle minutes or 2 hours, and logout revokes them" }
        message:
          uk: "Ця перевірка чекає 401 через 30 хв + 1 мс без запитів; 200 для сесії, що робить запит кожні 20 хвилин, аж до рівно 2 годин після входу, і 401 на 1 мс пізніше; і 401 для cookie після `POST /logout`."
          en: "This check expects 401 after 30 min + 1 ms without requests; 200 for a session that makes a request every 20 minutes up to exactly 2 hours after login, and 401 1 ms later; and 401 for the cookie after `POST /logout`."
      - when: { test: "the server limits how long a request may take to arrive: at most 5 s" }
        message:
          uk: "Ця перевірка читає `server.requestTimeout` і `server.headersTimeout` сервера з `createApp` і чекає для обох значення від 1 до 5000 мс."
          en: "This check reads `server.requestTimeout` and `server.headersTimeout` of the server from `createApp` and expects a value from 1 to 5000 ms for both."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: secret-only-on-server
        from: re-11-04-secrets-server-only
        prompt:
          uk: "Вебклієнт сервісу закладок зібрано Vite. Розробник хоче, щоб клієнт сам підписував запити ключем `SESSION_SECRET`, і називає змінну `VITE_SESSION_SECRET`. Що станеться з ключем?"
          en: "The bookmarks service's web client is built with Vite. A developer wants the client to sign requests itself with the `SESSION_SECRET` key and names the variable `VITE_SESSION_SECRET`. What happens to the key?"
        answer:
          type: choice
          options:
            - id: in-bundle
              text:
                uk: "Він потрапить у бандл відкритим текстом — будь-хто зможе підписувати запити"
                en: "It ends up in the bundle as plain text — anyone can sign requests"
            - id: hidden
              text:
                uk: "Vite сховає його, бо змінна з префіксом захищена"
                en: "Vite hides it, because a prefixed variable is protected"
              why:
                uk: "Префікс `VITE_` — це оголошення «це публічне», а не захист: значення записується в бандл."
                en: "The `VITE_` prefix is a declaration “this is public”, not a protection: the value is written into the bundle."
            - id: server-only
              text:
                uk: "Нічого: змінні середовища бачить лише сервер"
                en: "Nothing: only the server sees environment variables"
              why:
                uk: "Те, що клієнтський код читає зі змінних, збирач підставляє в бандл під час збирання."
                en: "Whatever client code reads from variables, the bundler substitutes into the bundle at build time."
          correct: [in-bundle]
        explanation:
          uk: "Ключ підпису живе лише в процесі сервера: зі змінної середовища чи локального `.env`, без префікса для клієнта. Клієнт його не має й мати не повинен — сесію за нього тримає сервер."
          en: "The signing key lives only in the server process: from an environment variable or a local `.env`, with no client prefix. The client does not have it and must not — the server keeps the session for it."

  - id: attack-your-service
    kind: local-task
    runtime: local-node
    title:
      uk: "Скрипт атаки проти твого сервісу"
      en: "An attack script against your service"
    intro:
      uk: |
        Тепер запусти свій сервіс як справжній процес у своєму терміналі й перевір його не своїми тестами, а чужим скриптом атаки. Скрипт надсилає справжні HTTP-запити на `127.0.0.1:4320`: читання чужої закладки, запит без сесії, підроблений `Origin`, відкликану сесію, завелике тіло, розвідку імен і перебір паролів. Сесію, що закінчилася за часом, скрипт не перевіряє — чекати 30 хвилин він не може; цю межу вже довели перевірки платформи з фіксованим годинником.

        Під час підготовки уроку все виконано на macOS двічі — з Node.js v25.2.1 і npm 11.6.2 та з Node.js v22.13.1 і npm 10.9.2 — з однаковим виводом; вивід нижче справжній. Пакети не встановлюються. Прапорець `--env-file` документація Node.js 22 позначає як експериментальний до версії 22.21.0; 22.13.1 виконує його без попереджень. На Windows і Linux цей урок не перевіряли.

        **Крок 3 — `server.mjs`:**

        ```js
        // Starts the bookmarks service on 127.0.0.1:4320 with the key from the environment.
        import { createApp } from './app.js';

        const server = createApp({ env: process.env });
        server.listen(4320, '127.0.0.1', () => console.log('bookmarks service on http://127.0.0.1:4320'));
        ```

        **Крок 3 — `attack.mjs`:**

        ```js
        // Attack script for the bookmarks lab: real HTTP requests against YOUR service on loopback.
        // Synthetic users only. Usage: node attack.mjs [base URL, default http://127.0.0.1:4320]
        const base = process.argv[2] ?? 'http://127.0.0.1:4320';
        const call = (method, path, headers = {}, body) =>
          fetch(base + path, { method, headers, body, signal: AbortSignal.timeout(3000) });
        const login = (user, password) =>
          call('POST', '/login', { 'content-type': 'application/json' }, JSON.stringify({ user, password }));
        const cookieOf = (response) => response.headers.getSetCookie()[0]?.split(';')[0] ?? '';

        const checks = [
          ['cross-user read answers 404', async () => {
            const cookie = cookieOf(await login('u-02', 'river-stone-7'));
            return (await call('GET', '/bookmarks/b-1', { cookie })).status === 404;
          }],
          ['no session answers 401', async () => (await call('GET', '/bookmarks')).status === 401],
          ['forged Origin answers 403', async () => {
            const cookie = cookieOf(await login('u-01', 'sunflower-42'));
            const body = JSON.stringify({ title: 'x', url: 'https://example.org/x' });
            const headers = { cookie, origin: 'http://127.0.0.1:5173', 'content-type': 'application/json' };
            return (await call('POST', '/bookmarks', headers, body)).status === 403;
          }],
          ['revoked session answers 401', async () => {
            const cookie = cookieOf(await login('u-03', 'quiet-harbor-19'));
            await call('POST', '/logout', { cookie });
            return (await call('GET', '/bookmarks', { cookie })).status === 401;
          }],
          ['oversized login answers 413', async () => (await login('u-01', 'y'.repeat(3000))).status === 413],
          ['unknown user and wrong password look the same', async () => {
            const unknown = await login('u-77', 'guess');
            const wrong = await login('u-01', 'guess');
            return unknown.status === wrong.status && (await unknown.text()) === (await wrong.text());
          }],
          ['brute force meets 429 with Retry-After', async () => {
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              const response = await login('u-03', `guess-${attempt}`);
              if (response.status === 429) return Boolean(response.headers.get('retry-after'));
            }
            return false;
          }],
        ];

        let held = 0;
        for (const [name, run] of checks) {
          let ok = false;
          try {
            ok = await run();
          } catch (error) {
            console.log(`  (${name}: ${error.name} ${error.message})`);
          }
          if (ok) held += 1;
          console.log(`${ok ? 'HELD  ' : 'BROKEN'} ${name}`);
        }
        console.log(`${held}/${checks.length} controls held against ${base}`);
        process.exitCode = held === checks.length ? 0 : 1;
        ```

        **Крок 6 — звіт для еталонного рішення:**

        ```text
        HELD   cross-user read answers 404
        HELD   no session answers 401
        HELD   forged Origin answers 403
        HELD   revoked session answers 401
        HELD   oversized login answers 413
        HELD   unknown user and wrong password look the same
        HELD   brute force meets 429 with Retry-After
        7/7 controls held against http://127.0.0.1:4320
        ```

        **Крок 7 — коли перевірку `Origin` прибрано:**

        ```text
        HELD   cross-user read answers 404
        HELD   no session answers 401
        BROKEN forged Origin answers 403
        …
        6/7 controls held against http://127.0.0.1:4320
        ```

        **Крок 8 — шаблон `THREATS.md`:**

        ```text
        | Asset | Threat | Entry point | Control | Proof |
        |---|---|---|---|---|
        | … | … | … | … | attack.mjs: "…" or a platform check |

        Why a session and not a token: …
        Why no home-made cryptography: …
        ```
      en: |
        Now start your service as a real process in your own terminal and check it not with your own tests but with someone else's attack script. The script sends real HTTP requests to `127.0.0.1:4320`: reading someone else's bookmark, a request with no session, a forged `Origin`, a revoked session, an oversized body, name probing and password guessing. The script does not check a session that has expired by time — it cannot wait 30 minutes; the platform's checks with a fixed clock have already proven that limit.

        While preparing the lesson everything was run on macOS twice — with Node.js v25.2.1 and npm 11.6.2 and with Node.js v22.13.1 and npm 10.9.2 — with the same output; the output below is real. No packages are installed. The Node.js 22 documentation marks the `--env-file` flag as experimental until version 22.21.0; 22.13.1 runs it without any warning. This lesson was not checked on Windows or Linux.

        **Step 3 — `server.mjs`:**

        ```js
        // Starts the bookmarks service on 127.0.0.1:4320 with the key from the environment.
        import { createApp } from './app.js';

        const server = createApp({ env: process.env });
        server.listen(4320, '127.0.0.1', () => console.log('bookmarks service on http://127.0.0.1:4320'));
        ```

