        const call = (method, path, headers = {}, body) =>
          fetch(base + path, { method, headers, body, signal: AbortSignal.timeout(3000) });
        const login = (user, password) =>
          call('POST', '/login', { 'content-type': 'application/json' }, JSON.stringify({ user, password }));
        const cookieOf = (response) => response.headers.getSetCookie()[0]?.split(';')[0] ?? '';

        const checks = [
          ['cross-user read answers 404', async () => {
            const cookie = cookieOf(await login('u-02', 'river-stone-7'));
            return (await call('GET', '/bookmarks/b-1', { cookie })).status === 404;
          }],
          ['no session answers 401', async () => (await call('GET', '/bookmarks')).status === 401],
          ['forged Origin answers 403', async () => {
            const cookie = cookieOf(await login('u-01', 'sunflower-42'));
            const body = JSON.stringify({ title: 'x', url: 'https://example.org/x' });
            const headers = { cookie, origin: 'http://127.0.0.1:5173', 'content-type': 'application/json' };
            return (await call('POST', '/bookmarks', headers, body)).status === 403;
          }],
          ['revoked session answers 401', async () => {
            const cookie = cookieOf(await login('u-03', 'quiet-harbor-19'));
            await call('POST', '/logout', { cookie });
            return (await call('GET', '/bookmarks', { cookie })).status === 401;
          }],
          ['oversized login answers 413', async () => (await login('u-01', 'y'.repeat(3000))).status === 413],
          ['unknown user and wrong password look the same', async () => {
            const unknown = await login('u-77', 'guess');
            const wrong = await login('u-01', 'guess');
            return unknown.status === wrong.status && (await unknown.text()) === (await wrong.text());
          }],
          ['brute force meets 429 with Retry-After', async () => {
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              const response = await login('u-03', `guess-${attempt}`);
