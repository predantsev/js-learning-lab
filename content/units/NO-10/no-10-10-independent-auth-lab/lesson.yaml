    tools:
      - { name: "Node.js", version: { uk: "22.13 або новіший", en: "22.13 or newer" }, note: { uk: "перевірено з v25.2.1 і v22.13.1", en: "checked with v25.2.1 and v22.13.1" } }
      - { name: "npm", version: "10+", note: { uk: "перевірено з 11.6.2 і 10.9.2; потрібен лише для `npm init` і `npm pkg set`", en: "checked with 11.6.2 and 10.9.2; needed only for `npm init` and `npm pkg set`" } }
    steps:
      - text:
          uk: "Створи теку для лабораторної й перейди в неї."
          en: "Create a folder for the lab and go into it."
        command: "mkdir -p ~/js-course/no10-bookmarks\ncd ~/js-course/no10-bookmarks"
      - text:
          uk: "Створи `package.json` і познач теку як ES-модулі."
          en: "Create `package.json` and mark the folder as ES modules."
        command: "npm init -y\nnpm pkg set type=module"
        expect:
          uk: "`package.json` з рядком `\"type\": \"module\"`."
          en: "A `package.json` with the line `\"type\": \"module\"`."
      - text:
          uk: "У VS Code створи в цій теці `app.js`, `passwords.js`, `users.js` і `http-helpers.js` із вмістом однойменних файлів вправи «Сервіс закладок» (`app.js` і `passwords.js` — твоє рішення, що пройшло перевірки). Створи `server.mjs` і `attack.mjs` з текстом із кроку 3 вступу."
          en: "In VS Code create `app.js`, `passwords.js`, `users.js` and `http-helpers.js` in this folder with the contents of the files with the same names from the exercise “A bookmarks service” (`app.js` and `passwords.js` are your solution that passed the checks). Create `server.mjs` and `attack.mjs` with the text from step 3 of the introduction."
      - text:
          uk: "Створи локальний файл `.env` із новим випадковим ключем і переконайся, що git його не побачить, якщо колись зробиш тут репозиторій. Ключ на екран не виводиться: команда пише його одразу у файл."
          en: "Create a local `.env` file with a new random key and make sure git will not see it if you ever make a repository here. The key is not shown on screen: the command writes it straight into the file."
        command: "node -e \"console.log('SESSION_SECRET=' + crypto.randomBytes(32).toString('base64url'))\" > .env\necho .env > .gitignore"
      - text:
          uk: "Запусти сервіс із ключем із `.env`. Термінал лишиться зайнятим — це нормально."
          en: "Start the service with the key from `.env`. The terminal stays busy — that is expected."
        command: "node --env-file=.env server.mjs"
        expect:
          uk: "Рядок `bookmarks service on http://127.0.0.1:4320`."
          en: "The line `bookmarks service on http://127.0.0.1:4320`."
      - text:
          uk: "У другому терміналі (у VS Code — кнопка «+» на панелі терміналу) перейди в ту саму теку й запусти скрипт атаки."
          en: "In a second terminal (in VS Code, the “+” button on the terminal panel) go to the same folder and run the attack script."
        command: "cd ~/js-course/no10-bookmarks\nnode attack.mjs"
        expect:
          uk: "Сім рядків `HELD` і `7/7 controls held`, як у кроці 6 вступу."
          en: "Seven `HELD` lines and `7/7 controls held`, as in step 6 of the introduction."
      - text:
          uk: "Доведи, що скрипт справді ловить вади: зупини сервер (`Ctrl+C` у першому терміналі), тимчасово закоментуй у `app.js` свою перевірку `Origin`, знову запусти сервер і скрипт. Потім поверни перевірку, перезапусти сервер і запусти скрипт ще раз."
          en: "Prove that the script really catches defects: stop the server (`Ctrl+C` in the first terminal), temporarily comment out your `Origin` check in `app.js`, start the server and the script again. Then restore the check, restart the server and run the script once more."
        command: "node attack.mjs"
        expect:
          uk: "Спершу `BROKEN forged Origin answers 403` і `6/7`, як у кроці 7 вступу; після відновлення — знову `7/7`."
          en: "First `BROKEN forged Origin answers 403` and `6/7`, as in step 7 of the introduction; after restoring — `7/7` again."
      - text:
          uk: "Створи `THREATS.md` за шаблоном із кроку 8 вступу: щонайменше шість рядків (цінність, загроза, точка входу, контроль, доказ — рядок звіту `attack.mjs` чи перевірка платформи) і дві відповіді: чому сесія в cookie, а не токен, для цього сервісу, і чому жоден рядок криптографії не саморобний. Додай під таблицю останній звіт скрипта."
          en: "Create `THREATS.md` from the template in step 8 of the introduction: at least six rows (asset, threat, entry point, control, proof — a line of the `attack.mjs` report or a platform check) and two answers: why a session in a cookie and not a token for this service, and why not a single line of cryptography is home-made. Add the script's last report under the table."
    verify:
      - id: seven-held
        text:
          uk: "`node attack.mjs` проти мого сервісу надрукував `7/7 controls held`."
          en: "`node attack.mjs` against my service printed `7/7 controls held`."
      - id: caught-break
        text:
          uk: "Коли я прибрав перевірку `Origin`, скрипт показав `BROKEN`, а після відновлення — знову `7/7`."
          en: "When I removed the `Origin` check, the script showed `BROKEN`, and `7/7` again after restoring it."
      - id: threats-written
        text:
          uk: "`THREATS.md` має щонайменше шість рядків із доказом для кожного та обидві відповіді."
          en: "`THREATS.md` has at least six rows with a proof for each and both answers."
    troubleshooting:
      - problem:
          uk: "Другий запуск `node attack.mjs` поспіль показує `BROKEN cross-user read answers 404`"
          en: "A second `node attack.mjs` run in a row shows `BROKEN cross-user read answers 404`"
        fix:
          uk: "Це твій ліміт входу працює: перший запуск зробив п’ять невдалих входів з адреси `127.0.0.1`, і ще хвилину всі входи з неї отримують 429 — скрипт не може навіть увійти. Перезапусти сервер (`Ctrl+C` і знову `node --env-file=.env server.mjs`) або почекай хвилину. Так відтворено під час підготовки уроку на Node.js 25.2.1 і 22.13.1: другий запуск поспіль дав `6/7`."
          en: "That is your login limit working: the first run made five failed logins from the address `127.0.0.1`, and for another minute every login from it gets 429 — the script cannot even log in. Restart the server (`Ctrl+C` and `node --env-file=.env server.mjs` again) or wait a minute. Reproduced while preparing the lesson on Node.js 25.2.1 and 22.13.1: a second run in a row gave `6/7`."
      - problem:
          uk: "Сервер не стартує: `Error: SESSION_SECRET is not set`"
          en: "The server does not start: `Error: SESSION_SECRET is not set`"
        fix:
          uk: "Сервер запущено без `--env-file=.env` або файла `.env` немає в поточній теці. Перевір `ls -a` і команду запуску. Текст помилки — той, що пише твій `app.js`; у еталонному рішенні він саме такий."
          en: "The server was started without `--env-file=.env`, or there is no `.env` file in the current folder. Check with `ls -a` and check the start command. The error text is what your `app.js` writes; in the reference solution it is exactly this."
      - problem:
          uk: "`attack.mjs` друкує `(… TypeError fetch failed)` у кожному рядку"
          en: "`attack.mjs` prints `(… TypeError fetch failed)` on every line"
        fix:
          uk: "Сервер не слухає на `127.0.0.1:4320`: він не запущений або впав. Подивись на перший термінал. Саме такий текст (`TypeError fetch failed`) скрипт друкував на Node.js 25.2.1 і 22.13.1, коли сервер було зупинено."
          en: "The server is not listening on `127.0.0.1:4320`: it is not running or has crashed. Look at the first terminal. The script printed exactly this text (`TypeError fetch failed`) on Node.js 25.2.1 and 22.13.1 when the server was stopped."
    recovery:
      uk: "Тека `~/js-course/no10-bookmarks` нічого не змінює в інших твоїх проєктах. Якщо `app.js` зіпсувався, знову скопіюй своє рішення з вправи; `.env` можна перестворити тією самою командою — старі сесії просто стануть недійсними."
      en: "The folder `~/js-course/no10-bookmarks` changes nothing in your other projects. If `app.js` got damaged, copy your solution from the exercise again; `.env` can be recreated with the same command — old sessions simply become invalid."
