id: no-10-01-authn-vs-authz
unit: NO-10
title:
  uk: "Автентифікація проти авторизації"
  en: "Authentication vs authorization"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Віднести кожну перевірку в обробці запиту до автентифікації (хто надсилає запит) чи до авторизації (чи можна йому це) і передбачити 401 або 403 для поданих запитів."
    en: "Classify each check in a request flow as authentication (who is calling) or authorization (may they do this), and predict 401 versus 403 for given requests."
  - uk: "Поставити обидві перевірки в обробку запиту так, щоб жоден маршрут не дістався до даних, доки вони не спрацювали."
    en: "Place both checks in a server pipeline so that no route reaches data before they have run."
prerequisites: [no-04-01-rest-boundaries, no-03-03-routing-json-bodies]
subskills:
  - { family: B-06, skill: "authn vs authz", depth: intro }
glossary: [authentication, authorization]
selfCheck: [predict-four-requests, gate-pipeline]

blocks:
  - id: two-questions
    kind: explanation
    title:
      uk: "Два питання до кожного запиту"
      en: "Two questions for every request"
    body:
      uk: |
        Досі твої API відповідали будь-кому. Тепер у сервісу нотаток є синтетичні користувачі: `u-01`, `u-02` і адміністратор. Нотатка `n-1` належить `u-01`. Перш ніж її віддати, сервер ставить два **різні** питання:

        1. **Хто це?** — [[authentication|автентифікація]]. Запит несе облікові дані (англійською *credential*): у цій лабораторній — заголовок `Authorization: Bearer lab-token-u01`. Сервер перетворює їх на користувача. Немає їх, вони зламані чи невідомі — відповідь **401**.
        2. **Чи можна цьому користувачеві це?** — [[authorization|авторизація]]. `u-02` відомий серверу, але `n-1` не його — відповідь **403**.

        Назва 401 — «Unauthorized», але означає він саме «не знаю, хто ти». За стандартом HTTP (RFC 9110) відповідь 401 ще й має заголовок `WWW-Authenticate` — він називає **схему** облікових даних, як-от `Bearer` для токена в заголовку. Для cookie сесії (третій урок) стандартної схеми немає, тож лабораторні сервіси з cookie відповідають 401 без нього. 403 — «знаю, хто ти, і не дозволяю».

        Звідки беруться справжні облікові дані після входу, покаже третій урок; тут кожен синтетичний користувач має готовий лабораторний токен.
      en: |
        Until now your APIs answered anyone. Now the notes service has synthetic users: `u-01`, `u-02` and an administrator. The note `n-1` belongs to `u-01`. Before handing it out, the server asks two **different** questions:

        1. **Who is it?** — [[authentication]]. The request carries a credential: in this lab, the header `Authorization: Bearer lab-token-u01`. The server turns it into a user. If it is missing, broken or unknown, the answer is **401**.
        2. **May this user do this?** — [[authorization]]. `u-02` is known to the server, but `n-1` is not theirs — the answer is **403**.

        401 is called “Unauthorized”, but it means exactly “I do not know who you are”. By the HTTP standard (RFC 9110) a 401 answer also carries a `WWW-Authenticate` header — it names the credential **scheme**, such as `Bearer` for a token in a header. A session cookie (the third lesson) has no standard scheme, so the lab services with cookies answer 401 without it. 403 is “I know who you are, and I do not allow it”.

        Where real credentials come from after a login is the third lesson; here every synthetic user has a ready-made lab token.

  - id: gates
    kind: visual
    visual: diagram
    title:
      uk: "Дві брами перед даними"
      en: "Two gates before the data"
    textEquivalent:
      uk: "Запит GET /notes/n-1 проходить згори вниз через дві брами. Перша брама — автентифікація: вона перетворює облікові дані на користувача, а якщо їх немає або вони невідомі, запит зупиняється тут із 401. Друга брама — авторизація: вона порівнює користувача з дією й нотаткою, і чужа нотатка зупиняє запит із 403. Лише після обох брам обробник віддає нотатку зі статусом 200. Кроки проводять чотири запити: без облікових даних (стоп на першій брамі, 401), з невідомим токеном (так само 401), від u-02 до нотатки u-01 (першу браму пройдено, стоп на другій, 403) і від u-01 до власної нотатки (обидві брами пройдено, 200)."
      en: "The request GET /notes/n-1 passes from top to bottom through two gates. The first gate is authentication: it turns the credential into a user, and if there is none or it is unknown, the request stops here with 401. The second gate is authorization: it compares the user with the action and the note, and someone else's note stops the request with 403. Only after both gates does the handler hand out the note with status 200. The steps walk four requests through: no credential (stopped at the first gate, 401), an unknown token (also 401), u-02 asking for u-01's note (first gate passed, stopped at the second, 403) and u-01 asking for their own note (both gates passed, 200)."
    spec:
      layout: grid
      nodes:
        - { id: req, label: "GET /notes/n-1", shape: pill, w: 220, col: 0, row: 0 }
        - { id: authn, label: { uk: "Хто це? (автентифікація)", en: "Who is it? (authentication)" }, w: 230, col: 0, row: 1 }
        - { id: authz, label: { uk: "Чи можна? (авторизація)", en: "May they? (authorization)" }, w: 230, col: 0, row: 2 }
        - { id: handler, label: { uk: "Обробник віддає нотатку", en: "Handler sends the note" }, w: 230, col: 0, row: 3 }
        - { id: s401, label: "401", shape: round, w: 96, col: 1, row: 1 }
        - { id: s403, label: "403", shape: round, w: 96, col: 1, row: 2 }
        - { id: s200, label: "200", shape: round, w: 96, col: 1, row: 3 }
      edges:
        - { from: req, to: authn }
        - { from: authn, to: authz }
        - { from: authz, to: handler }
        - { from: authn, to: s401, kind: dashed }
        - { from: authz, to: s403, kind: dashed }
        - { from: handler, to: s200 }
      steps:
        - caption:
            uk: "Кожен запит проходить дві брами, і лише потім обробник торкається даних. Кожна брама має свій статус відмови."
            en: "Every request passes two gates, and only then does the handler touch the data. Each gate has its own refusal status."
          highlight: [authn, authz]
        - caption:
            uk: "Запит **без облікових даних**: перша брама не знає, хто це, — **401**. До нотатки запит не дійшов."
            en: "A request **with no credential**: the first gate does not know who it is — **401**. The request never reached the note."
          highlight: [req, authn, s401, authn->s401]
          dim: [authz, handler, s403, s200]
        - caption:
            uk: "Запит із **невідомим токеном** зупиняється там само: зламані облікові дані — теж «не знаю, хто ти», тобто **401**, а не 403."
            en: "A request with an **unknown token** stops at the same place: a broken credential is also “I do not know who you are”, so **401**, not 403."
          highlight: [req, authn, s401, authn->s401]
          dim: [authz, handler, s403, s200]
          annotate:
            - { id: s401, text: { uk: "і для невідомого", en: "unknown too" } }
        - caption:
            uk: "`u-02` просить нотатку `u-01`: перша брама знає його, друга бачить, що нотатка чужа, — **403**."
            en: "`u-02` asks for `u-01`'s note: the first gate knows them, the second sees that the note is not theirs — **403**."
          highlight: [req, authn, authz, s403, authn->authz, authz->s403]
          dim: [handler, s401, s200]
          annotate:
            - { id: authn, text: "u-02" }
        - caption:
            uk: "`u-01` просить власну нотатку: обидві брами пропускають, обробник віддає її — **200**."
            en: "`u-01` asks for their own note: both gates let it through, and the handler sends it — **200**."
          highlight: [req, authn, authz, handler, s200, authn->authz, authz->handler, handler->s200]
          dim: [s401, s403]
          annotate:
            - { id: authn, text: "u-01" }

  - id: predict-four-requests
    kind: prediction
    prompt:
      uk: "Сервіс нотаток перевіряє запити так, як описано в уроці: спершу хто це, потім чи можна. Нотатка `n-1` належить `u-01`. Які статуси отримають чотири запити `GET /notes/n-1`: без облікових даних; з невідомим токеном; від `u-02`; від `u-01`?"
      en: "The notes service checks requests as the lesson describes: first who it is, then whether they may. The note `n-1` belongs to `u-01`. Which statuses do four `GET /notes/n-1` requests get: with no credential; with an unknown token; from `u-02`; from `u-01`?"
    runnable: false
    answer:
      type: choice
      options:
        - id: right
          code: "401, 401, 403, 200"
        - id: same-denied
          code: "403, 403, 403, 200"
          why:
            uk: "401 і 403 — не синоніми «доступ заборонено». 401 — сервер не знає, хто ти; 403 — знає, але не дозволяє. Клієнт на 401 пропонує увійти, а на 403 вхід не допоможе."
            en: "401 and 403 are not synonyms for “access denied”. 401: the server does not know who you are; 403: it knows, but does not allow it. On a 401 a client offers to sign in, and on a 403 signing in will not help."
        - id: bad-is-forbidden
          code: "401, 403, 403, 200"
          why:
            uk: "Невідомий токен нікого не називає: сервер так само не знає, хто це, як і без токена. Тож 401, а не 403."
            en: "An unknown token names nobody: the server does not know who it is, just as without a token. So 401, not 403."
        - id: logged-in-all
          code: "401, 401, 200, 200"
          why:
            uk: "Те, що `u-02` автентифікований, ще не означає, що йому можна все. Автентифікація відповідає лише на «хто це»; чи можна читати чужу нотатку, вирішує друга перевірка."
            en: "`u-02` being authenticated does not mean they may do everything. Authentication only answers “who is it”; whether someone else's note may be read is decided by the second check."
      correct: [right]
    explanation:
      uk: "Дві різні перевірки — два різні статуси. Без облікових даних і з невідомими — 401: сервер не знає, хто це. `u-02` відомий, але нотатка не його — 403. `u-01` проходить обидві — 200."
      en: "Two different checks give two different statuses. No credential or an unknown one gives 401: the server does not know who it is. `u-02` is known, but the note is not theirs — 403. `u-01` passes both — 200."

  - id: predict-pipeline-order
    kind: prediction
    prompt:
      uk: "Розташуй кроки обробки `DELETE /notes/n-1` у безпечному порядку."
      en: "Put the steps of handling `DELETE /notes/n-1` in a safe order."
    runnable: false
    answer:
      type: order
      items:
        - id: identify
          text: { uk: "Визначити користувача за обліковими даними (інакше 401)", en: "Identify the user from the credential (otherwise 401)" }
        - id: load
          text: { uk: "Знайти нотатку `n-1` (інакше 404)", en: "Find the note `n-1` (otherwise 404)" }
        - id: permit
          text: { uk: "Перевірити, чи може цей користувач видалити цю нотатку (інакше 403)", en: "Check whether this user may delete this note (otherwise 403)" }
        - id: delete
          text: { uk: "Видалити нотатку й відповісти 204", en: "Delete the note and answer 204" }
    explanation:
      uk: "Спершу «хто це» — до будь-яких даних: невідомий клієнт навіть не дізнається, чи існує `n-1`. Потім нотатка, бо дозвіл залежить від її власника. Дозвіл — **до** зміни: перевірка після видалення вже нічого не врятує."
      en: "First “who is it” — before any data: an unknown client does not even learn whether `n-1` exists. Then the note, because the permission depends on its owner. The permission comes **before** the change: a check after the deletion saves nothing."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: error-shape-status
        from: no-04-03-error-model
        prompt:
          uk: "Сервіс відмовляє `u-02` у чужій нотатці. Яка відповідь дотримується правила єдиної моделі помилок?"
          en: "The service refuses `u-02` someone else's note. Which answer follows the rule of a single error model?"
        answer:
          type: choice
          options:
            - id: model
              text:
                uk: "Статус 403 і тіло `{ \"error\": { \"code\": \"FORBIDDEN\", … } }` — та сама форма, що й для інших помилок"
                en: "Status 403 and the body `{ \"error\": { \"code\": \"FORBIDDEN\", … } }` — the same shape as for other errors"
            - id: ok-false
              text:
                uk: "Статус 200 і тіло `{ \"ok\": false }`: запит же оброблено"
                en: "Status 200 and the body `{ \"ok\": false }`: the request was handled, after all"
              why:
                uk: "Статус успіху для відмови обманює клієнта, кеш і журнали: кожен мусить заглядати в тіло, щоб зрозуміти, що це помилка."
                en: "A success status for a refusal misleads the client, caches and logs: each has to look into the body to see that it is an error."
            - id: plain-text
              text:
                uk: "Статус 403 і просто текст «Доступ заборонено»"
                en: "Status 403 and just the text “Access denied”"
              why:
                uk: "Статус правильний, але форма своя: клієнт, що читає `error.code` для інших помилок, тут не знайде нічого."
                en: "The status is right, but the shape is its own: a client that reads `error.code` for other errors finds nothing here."
          correct: [model]
        explanation:
          uk: "Як і в моделі помилок із розділу про REST: статус каже, що сталося, а тіло завжди має одну форму зі стабільним `code`. 401 і 403 — ще два рядки тієї самої таблиці."
          en: "As in the error model from the REST unit: the status says what happened, and the body always has one shape with a stable `code`. 401 and 403 are two more rows of the same table."

  - id: notes-gates
    kind: example
    runtime: isolated-node
    dir: notes-gates
    entry: index.js
    capabilities: { network: loopback }
    strings:
      marta: { uk: "Марта", en: "Marta" }
      bohdan: { uk: "Богдан", en: "Bohdan" }
      admin: { uk: "Адміністратор", en: "Administrator" }
      gifts: { uk: "Ідеї подарунків", en: "Gift ideas" }
      shopping: { uk: "Покупки", en: "Shopping" }
      trip: { uk: "План подорожі", en: "Trip plan" }
      noCredential: { uk: "без облікових даних", en: "no credential" }
      badCredential: { uk: "невідомий токен", en: "unknown token" }
    title:
      uk: "Сервіс нотаток із двома брамами"
      en: "The notes service with two gates"
    body:
      uk: |
        `app.js` — лабораторний сервіс нотаток: функція `identify` — перша брама, `checkCanRead` — друга. `index.js` запускає сервіс на вільному порту 127.0.0.1, надсилає чотири запити з передбачення й зупиняє його. Ця програма — не браузер, тож заголовок `Authorization` вона додає сама.

        Натисни **Запустити** й зістав статуси зі своїм передбаченням. Зверни увагу на тіло 401 і 403: одна форма помилки, різні `code`.
      en: |
        `app.js` is the lab notes service: the function `identify` is the first gate, `checkCanRead` the second. `index.js` starts the service on a free 127.0.0.1 port, sends the four requests from the prediction and stops it. This program is not a browser, so it adds the `Authorization` header itself.

        Press **Run** and match the statuses with your prediction. Look at the bodies of 401 and 403: one error shape, different `code`s.
    tryIt:
      uk: |
        1. У `app.js` закоментуй рядок `checkCanRead(user, note);` (дві скісні риски на початку) і запусти: тепер `u-02` отримує чужу нотатку з 200. Автентифікація лишилася — а захисту немає.
        2. Поверни рядок. У `index.js` додай п’ятий запит `['admin → n-1', '/notes/n-1', 'Bearer lab-token-admin']` і запусти: адміністратор теж отримує 403, бо `checkCanRead` знає лише власника. Що можна адміністраторові, вирішиш в уроці про найменші привілеї.
      en: |
        1. In `app.js` comment out the line `checkCanRead(user, note);` (two slashes at the start) and run: now `u-02` gets someone else's note with 200. Authentication is still there — but there is no protection.
        2. Restore the line. In `index.js` add a fifth request `['admin → n-1', '/notes/n-1', 'Bearer lab-token-admin']` and run: the administrator gets 403 too, because `checkCanRead` knows only the owner. What an administrator may do is decided in the lesson on least privilege.

  - id: gate-pipeline
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: gate-pipeline
    entry: index.js
    editable: [gates.js, routes.js]
    capabilities: { network: loopback }
    strings:
      marta: { uk: "Марта", en: "Marta" }
      bohdan: { uk: "Богдан", en: "Bohdan" }
      tickets: { uk: "Купити квитки на потяг", en: "Buy train tickets" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      none: { uk: "немає", en: "none" }
    title:
      uk: "Брами для справ планувальника"
      en: "Gates for planner tasks"
    instructions:
      uk: |
        Сервіс справ планувальника має маршрути `GET` і `DELETE /tasks/:id`. Справа `t-1` належить `u-01`, `t-2` — `u-02`. Зараз будь-хто читає й видаляє будь-що.

        У `gates.js` напиши:

        - `requireUser(request)` — повертає користувача з `users`, чий лабораторний токен прийшов у заголовку `Authorization: Bearer <token>` (таблиця `labCredentials`: токен → `id`). Немає заголовка, інша схема замість `Bearer` чи невідомий токен — `throw new HttpError(401, 'UNAUTHENTICATED')`.
        - `requirePermission(user, action, task)` — дії `'read'` і `'delete'` дозволено лише власникові справи (`task.ownerId`); інакше `throw new HttpError(403, 'FORBIDDEN')`.

        У `routes.js` виклич обидві брами в обох маршрутах у правильному порядку. Репозиторій записує кожен свій виклик у `repo.calls`; запит без облікових даних не має викликати репозиторій жодного разу. **Запустити** друкує статус і виклики репозиторію для шести запитів.
      en: |
        The planner tasks service has the routes `GET` and `DELETE /tasks/:id`. The task `t-1` belongs to `u-01`, `t-2` to `u-02`. Right now anyone reads and deletes anything.

        In `gates.js` write:

        - `requireUser(request)` — returns the user from `users` whose lab token came in the header `Authorization: Bearer <token>` (the table `labCredentials`: token → `id`). No header, a scheme other than `Bearer`, or an unknown token — `throw new HttpError(401, 'UNAUTHENTICATED')`.
        - `requirePermission(user, action, task)` — the actions `'read'` and `'delete'` are allowed only to the task's owner (`task.ownerId`); otherwise `throw new HttpError(403, 'FORBIDDEN')`.

        In `routes.js` call both gates in both routes in the right order. The repository writes every call it gets into `repo.calls`; a request without a credential must not call the repository even once. **Run** prints the status and the repository calls for six requests.
    testTitles:
      "a request without a credential answers 401 and never reaches the repository":
        uk: "Запит без облікових даних — 401, і до репозиторію він не доходить"
        en: "A request without a credential answers 401 and never reaches the repository"
      "a malformed or unknown credential answers 401, not 403":
        uk: "Зламані чи невідомі облікові дані — 401, а не 403"
        en: "A malformed or unknown credential answers 401, not 403"
      "u-02 reading u-01's task answers 403":
        uk: "`u-02` читає справу `u-01` — 403"
        en: "`u-02` reading `u-01`'s task answers 403"
      "the owner reads their own task with 200":
        uk: "Власник читає свою справу — 200"
        en: "The owner reads their own task with 200"
      "u-02 deleting u-01's task answers 403 and the task stays":
        uk: "`u-02` видаляє справу `u-01` — 403, і справа лишається"
        en: "`u-02` deleting `u-01`'s task answers 403 and the task stays"
      "the owner deletes their own task with 204":
        uk: "Власник видаляє свою справу — 204"
        en: "The owner deletes their own task with 204"
      "a missing task answers 404 to a signed-in user":
        uk: "Справа, якої немає, — 404 для автентифікованого користувача"
        en: "A missing task answers 404 to a signed-in user"
    hints:
      nudge:
        uk: "Почни з `requireUser`: прочитай `request.headers.authorization`. Потім у кожному маршруті спитай себе: що із цього рядка вже торкається даних?"
        en: "Start with `requireUser`: read `request.headers.authorization`. Then in each route ask yourself: which line here already touches data?"
      explanation:
        uk: "Для заголовка `X-Api-Key: k-7` перевірка могла б виглядати так: `const key = request.headers['x-api-key']; if (!keys.has(key)) throw new HttpError(401, …)`. Для `Bearer` треба ще відокремити схему від токена — регулярним виразом чи `split(' ')`. У маршруті «хто це» стоїть найпершим рядком, а дозвіл — одразу після того, як справу знайдено, і обов’язково до `repo.deleteTask`."
        en: "For an `X-Api-Key: k-7` header the check could look like this: `const key = request.headers['x-api-key']; if (!keys.has(key)) throw new HttpError(401, …)`. For `Bearer` you also have to separate the scheme from the token — with a regular expression or `split(' ')`. In a route, “who is it” is the very first line, and the permission comes right after the task is found and always before `repo.deleteTask`."
    solutionNote:
      uk: "Автентифікація — перший рядок кожного маршруту: невідомий клієнт не викликає репозиторій і навіть не дізнається, чи існує справа. Авторизація потребує справи (дозвіл залежить від `ownerId`), тому йде одразу після пошуку й обов’язково до видалення. Відмови — різними статусами: 401 — «хто ти?», 403 — «тобі не можна»."
      en: "Authentication is the first line of every route: an unknown client does not call the repository and does not even learn whether the task exists. Authorization needs the task (the permission depends on `ownerId`), so it comes right after the lookup and always before the deletion. The refusals use different statuses: 401 is “who are you?”, 403 is “you may not”."
    feedback:
      - when: { test: "a request without a credential answers 401 and never reaches the repository" }
        message:
          uk: "Ця перевірка надсилає `GET /tasks/t-1` без заголовка `Authorization` і чекає статус 401 та порожній `repo.calls`. Без облікових даних немає й користувача — ні «гостя», ні пошуку справи до перевірки."
          en: "This check sends `GET /tasks/t-1` without an `Authorization` header and expects status 401 and an empty `repo.calls`. With no credential there is no user — no “guest”, and no task lookup before the check."
      - when: { test: "a malformed or unknown credential answers 401, not 403" }
        message:
          uk: "Ця перевірка надсилає `Bearer lab-token-xyz` (такого токена немає) і `Basic lab-token-u01` (інша схема) й чекає 401 для обох: сервер не знає, хто це."
          en: "This check sends `Bearer lab-token-xyz` (no such token) and `Basic lab-token-u01` (another scheme) and expects 401 for both: the server does not know who it is."
      - when: { test: "u-02 reading u-01's task answers 403" }
        message:
          uk: "Ця перевірка надсилає `GET /tasks/t-1` з токеном `u-02` і чекає 403 без назви справи у відповіді. Дозвіл перевіряють за `task.ownerId` до того, як маршрут поверне справу."
          en: "This check sends `GET /tasks/t-1` with `u-02`'s token and expects 403 with no task title in the answer. The permission is checked against `task.ownerId` before the route returns the task."
      - when: { test: "the owner reads their own task with 200" }
        message:
          uk: "Ця перевірка надсилає `GET /tasks/t-1` з токеном `u-01` (власника) і чекає 200 з назвою справи. Порівнюй `task.ownerId` з `user.id`."
          en: "This check sends `GET /tasks/t-1` with `u-01`'s (the owner's) token and expects 200 with the task title. Compare `task.ownerId` with `user.id`."
      - when: { test: "u-02 deleting u-01's task answers 403 and the task stays" }
        message:
          uk: "Ця перевірка надсилає `DELETE /tasks/t-1` з токеном `u-02` і чекає 403 та жодного виклику `deleteTask`. Дозвіл перевіряють до зміни, а не після неї."
          en: "This check sends `DELETE /tasks/t-1` with `u-02`'s token and expects 403 and no `deleteTask` call. The permission is checked before the change, not after it."
      - when: { test: "the owner deletes their own task with 204" }
        message:
          uk: "Ця перевірка надсилає `DELETE /tasks/t-2` з токеном `u-02` (власника) і чекає 204, а потім 404 для `GET /tasks/t-2`."
          en: "This check sends `DELETE /tasks/t-2` with `u-02`'s (the owner's) token and expects 204, then 404 for `GET /tasks/t-2`."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` у маршруті часто означає, що `user` — `null` чи `undefined`: `requireUser` має або повернути користувача, або кинути `HttpError`, і ніколи — нічого."
          en: "A `TypeError` in a route often means that `user` is `null` or `undefined`: `requireUser` must either return a user or throw an `HttpError`, never return nothing."

  - id: to-checkpoint
    kind: transfer
    checkpoint: CP-NO
    body:
      uk: "У цьому розділі проєкт не змінюється: кроку проєкту в NO-10 немає. Твій проєкт за задумом лишається однокористувацьким, а вебклієнт у NO-06 підключиться до нього без входу. Ця лабораторна — окреме місце, де ти будуєш вхід, сесії й власність на синтетичних користувачах. Звичку цього уроку візьми із собою: сервер вирішує сам і не покладається на те, що показує інтерфейс. Якщо колись додаси до проєкту користувачів, обидві брами стануть першими рядками кожного маршруту `server/`, ще до репозиторію."
      en: "Your project does not change in this unit: NO-10 has no project step. By design your project stays single-user, and the web client connects to it in NO-06 without a login. This lab is a separate place where you build login, sessions and ownership on synthetic users. Take this lesson's habit with you: the server decides on its own and does not rely on what the interface shows. If you ever add users to the project, both gates become the first lines of every route in `server/`, before the repository."
