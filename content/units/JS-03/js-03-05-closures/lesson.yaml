id: js-03-05-closures
unit: JS-03
title:
  uk: "Closures: функції пам’ятають, де народилися"
  en: "Closures: functions remember their birthplace"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Передбачити, що виведе внутрішня функція, яка читає зовнішню змінну вже після того, як зовнішня функція завершилася."
    en: "Predict the output of an inner function that reads an outer variable after the outer function has already returned."
  - uk: "Пояснити за діаграмою пам’яті, чому два лічильники, створені однією фабрикою, рахують окремо."
    en: "Explain with a memory diagram why two counters made by the same factory keep separate counts."
  - uk: "Написати невелику фабрику функцій, чия повернена функція використовує захоплене значення."
    en: "Implement a small function factory whose returned function uses a captured value."
prerequisites: [js-03-04-scope-and-call-frames]
subskills:
  - { family: J-04, skill: "closures and higher-order functions", depth: intro }
glossary: [closure, lexical-environment, function-factory]
selfCheck: [after-return, two-counters, make-labeler]

blocks:
  - id: inner-functions
    kind: explanation
    title:
      uk: "Крок 1: функція всередині функції"
      en: "Step 1: a function inside a function"
    body:
      uk: |
        У попередньому уроці функція бачила змінні місця, де її написано. Напишімо функцію **всередині** іншої функції й **повернемо** її:

        ```js
        function makeReminder() {
          const prefix = "Нагадування: ";
          return (task) => prefix + task;
        }

        const remind = makeReminder();
        ```

        Після останнього рядка виклик `makeReminder()` завершено: його кадр зник зі стеку викликів. Але в `remind` тепер лежить внутрішня функція, якій потрібна `prefix`. Що станеться, коли ми викличемо `remind`?
      en: |
        In the previous lesson a function saw the variables of the place where it was written. Let’s write a function **inside** another function and **return** it:

        ```js
        function makeReminder() {
          const prefix = "Reminder: ";
          return (task) => prefix + task;
        }

        const remind = makeReminder();
        ```

        After the last line the call `makeReminder()` is over: its frame has left the call stack. But `remind` now holds the inner function, and that function needs `prefix`. What happens when we call `remind`?

  - id: after-return
    kind: prediction
    strings:
      reminder: { uk: "Нагадування: ", en: "Reminder: " }
      water: { uk: "полити квіти", en: "water the plants" }
    prompt:
      uk: "Зовнішня функція вже завершилася. Що виведе виклик внутрішньої?"
      en: "The outer function has already finished. What does the call of the inner one print?"
    code: |
      function makeReminder() {
        const prefix = "%%reminder%%";
        return (task) => prefix + task;
      }

      const remind = makeReminder();
      console.log(remind("%%water%%"));
    verify:
      logs: ["%%reminder%%%%water%%"]
    answer:
      type: choice
      options:
        - id: still-works
          text:
            uk: "«Нагадування: полити квіти»"
            en: "“Reminder: water the plants”"
        - id: gone
          text:
            uk: "`ReferenceError: prefix is not defined`"
            en: "`ReferenceError: prefix is not defined`"
          why:
            uk: "Коробка виклику `makeReminder` не зникає, доки повернена функція ще потрібна: `remind` досі може дістатися до `prefix`."
            en: "The box of the `makeReminder` call does not disappear while the returned function is still needed: `remind` can still reach `prefix`."
        - id: lost-value
          text:
            uk: "«undefinedполити квіти»"
            en: "“undefinedwater the plants”"
          why:
            uk: "`prefix` не втратила значення: функція бачить ту саму змінну, яку створив виклик `makeReminder`, разом з її вмістом."
            en: "`prefix` has not lost its value: the function sees the very variable the `makeReminder` call created, contents included."
      correct: [still-works]
    explanation:
      uk: "Внутрішня функція пам’ятає коробку, у якій народилася, разом із `prefix`. Виклик `makeReminder` давно завершився, але коробка жива, бо `remind` на неї посилається. Тому `remind(\"полити квіти\")` складає «Нагадування: полити квіти»."
      en: "The inner function remembers the box it was born in, `prefix` included. The `makeReminder` call ended long ago, but the box is alive because `remind` refers to it. That is why `remind(\"water the plants\")` builds “Reminder: water the plants”."

  - id: reminder-factory
    kind: example
    runtime: browser-js
    dir: reminder-factory
    entry: index.js
    strings:
      reminder: { uk: "Нагадування: ", en: "Reminder: " }
      water: { uk: "полити квіти", en: "water the plants" }
      books: { uk: "здати книжки в бібліотеку", en: "return the library books" }
    title:
      uk: "Коробка жива, але закрита"
      en: "The box is alive but closed"
    body:
      uk: |
        Запусти: `remind` працює стільки разів, скільки треба, хоча `makeReminder` виконалася лише раз.
      en: |
        Run it: `remind` works as many times as needed, although `makeReminder` ran only once.
    tryIt:
      uk: "Додай у кінець файла рядок `console.log(prefix);` і запусти: `ReferenceError`. Коробка з `prefix` жива, але дістатися до неї може лише функція, яка в ній народилася. Прибери цей рядок."
      en: "Add the line `console.log(prefix);` at the end of the file and run: `ReferenceError`. The box with `prefix` is alive, but only the function born in it can reach it. Remove the line again."

  - id: recall
    kind: review
    title:
      uk: "Згадай: найближча змінна"
      en: "Recall: the nearest variable"
    strings:
      outer: { uk: "зовнішній", en: "outer" }
      inner: { uk: "внутрішній", en: "inner" }
    items:
      - id: nearest-wins
        from: js-02-08-shadowing-strict-mode
        prompt:
          uk: "Усередині функції оголошено змінну з тим самим ім’ям, що й зовні. Що виведе програма?"
          en: "A variable with the same name as an outer one is declared inside a function. What does the program print?"
        code: |
          const status = "%%outer%%";

          function show() {
            const status = "%%inner%%";
            console.log(status);
          }

          show();
          console.log(status);
        verify:
          logs: ["%%inner%%", "%%outer%%"]
        answer:
          type: choice
          options:
            - id: nearest
              text:
                uk: "«внутрішній», потім «зовнішній»"
                en: "“inner”, then “outer”"
            - id: overwritten
              text:
                uk: "«внутрішній» двічі"
                en: "“inner” twice"
              why:
                uk: "Внутрішня `const status` — окрема змінна в коробці `show`. Вона затінює зовнішню, але не змінює її."
                en: "The inner `const status` is a separate variable in the box of `show`. It shadows the outer one but does not change it."
            - id: outer-only
              text:
                uk: "«зовнішній» двічі"
                en: "“outer” twice"
              why:
                uk: "Пошук імені починається з найближчої коробки. У `show` є власна `status`, тож саме її знайдено першою."
                en: "The lookup starts in the nearest box. `show` has its own `status`, so that one is found first."
          correct: [nearest]
        explanation:
          uk: "Ім’я знаходиться в найближчій коробці на шляху назовні: усередині `show` це її власна `status`, на верхньому рівні — зовнішня. Так само шукає змінні функція, що пам’ятає місце народження: спершу у своїй коробці, потім у коробці, де її створено."
          en: "A name is found in the nearest box on the way out: inside `show` that is its own `status`, at the top level it is the outer one. A function that remembers its birthplace looks up variables the same way: first in its own box, then in the box where it was created."

  - id: the-box-stays
    kind: explanation
    title:
      uk: "Крок 2: коробка лишається жити"
      en: "Step 2: the box stays alive"
    body:
      uk: |
        Чому `remind` працює, хоча `makeReminder` давно завершилася? Кожен виклик функції створює коробку змінних — [[lexical-environment|лексичне оточення]]. Зазвичай після `return` коробку викидають. Але функція, створена всередині, тримає **живе посилання** на коробку, де народилася. Поки цю функцію ще можна викликати, коробка жива — навіть коли кадр виклику давно зник зі стеку.

        Функція разом із цим посиланням — це [[closure]] (замикання). Насправді замикання утворює кожна функція в JavaScript; помітним воно стає тоді, коли функція переживає виклик, у якому її створено.

        Функцію, що створює й повертає інші функції, називають [[function-factory|фабрикою функцій]]. Найцікавіше починається, коли фабрику викликають двічі.
      en: |
        Why does `remind` work although `makeReminder` finished long ago? Every call of a function creates a box of variables — a [[lexical-environment|lexical environment]]. Normally the box is thrown away after `return`. But a function created inside keeps a **live link** to the box it was born in. As long as that function can still be called, the box stays alive — even when the call’s frame left the stack long ago.

        A function together with that link is a [[closure]]. In fact every JavaScript function forms a closure; it becomes noticeable when a function outlives the call that created it.

        A function that creates and returns other functions is called a [[function-factory|function factory]]. Things get interesting when the factory is called twice.

  - id: two-counters
    kind: prediction
    prompt:
      uk: "Фабрику лічильників викликають двічі: для днів із читанням і для днів із прогулянкою. Що виведе програма?"
      en: "The counter factory is called twice: for reading days and for walking days. What does the program print?"
    code: |
      function makeCounter() {
        let count = 0;
        return () => {
          count = count + 1;
          return count;
        };
      }

      const readingDays = makeCounter();
      const walkDays = makeCounter();

      readingDays();
      readingDays();
      console.log(readingDays());
      console.log(walkDays());
    verify:
      logs: ["3", "1"]
    answer:
      type: choice
      options:
        - id: separate
          text: { uk: "`3`, `1`", en: "`3`, `1`" }
        - id: shared
          text: { uk: "`3`, `4`", en: "`3`, `4`" }
          why:
            uk: "Кожен виклик `makeCounter()` створює нову коробку з власним `count`. `walkDays` пов’язана з іншою коробкою, ніж `readingDays`."
            en: "Every call of `makeCounter()` creates a new box with its own `count`. `walkDays` is linked to a different box than `readingDays`."
        - id: restarts
          text: { uk: "`1`, `1`", en: "`1`, `1`" }
          why:
            uk: "`count` живе не у виклику стрілкової функції, а в коробці виклику `makeCounter`, яка переживає ці виклики. Тому третій виклик `readingDays` бачить `count`, двічі збільшений перед тим."
            en: "`count` lives not in the call of the arrow function but in the box of the `makeCounter` call, which outlives those calls. So the third call of `readingDays` sees a `count` already increased twice."
        - id: copied
          text: { uk: "`3`, `3`", en: "`3`, `3`" }
          why:
            uk: "`walkDays` має власну коробку, тож її лічильник починає з `0`, а не копіює чужий."
            en: "`walkDays` has its own box, so its counter starts from `0` instead of copying someone else’s."
      correct: [separate]
    explanation:
      uk: "`readingDays` і `walkDays` створено двома різними викликами `makeCounter`, тож у кожної своя коробка зі своїм `count`. Три виклики `readingDays` збільшують лише її `count`: 1, 2, 3. Перший виклик `walkDays` збільшує свій `count` з `0` до `1`. Подивись на це на діаграмі нижче."
      en: "`readingDays` and `walkDays` were created by two different calls of `makeCounter`, so each has its own box with its own `count`. Three calls of `readingDays` increase only its `count`: 1, 2, 3. The first call of `walkDays` increases its own `count` from `0` to `1`. See it on the diagram below."

  - id: two-boxes
    kind: visual
    visual: memory-graph
    title:
      uk: "Діаграма пам’яті: дві коробки, два лічильники"
      en: "Memory diagram: two boxes, two counters"
    textEquivalent:
      uk: "Перший виклик makeCounter створює коробку box1 зі змінною count = 0 і повертає стрілкову функцію, яка тримає посилання на box1; цю функцію зберігає readingDays. Кадр виклику makeCounter зникає, але box1 лишається, бо на неї посилається функція. Другий виклик створює окрему коробку box2 зі своїм count = 0 і окрему стрілкову функцію, пов’язану з box2; її зберігає walkDays. Три виклики readingDays змінюють лише count у box1: 1, 2, 3, тож console.log виводить 3. Виклик walkDays змінює лише count у box2: з 0 до 1, тож console.log виводить 1. Однаковий код функцій, але різні коробки — тому лічильники незалежні."
      en: "The first call of makeCounter creates a box box1 with count = 0 and returns an arrow function that keeps a link to box1; readingDays stores this function. The frame of the makeCounter call disappears, but box1 stays because the function refers to it. The second call creates a separate box box2 with its own count = 0 and a separate arrow function linked to box2; walkDays stores it. Three calls of readingDays change only the count in box1: 1, 2, 3, so console.log prints 3. The call of walkDays changes only the count in box2: from 0 to 1, so console.log prints 1. The functions share their code but have different boxes — that is why the counters are independent."
    spec:
      code: |
        function makeCounter() {
          let count = 0;
          return () => {
            count = count + 1;
            return count;
          };
        }

        const readingDays = makeCounter();
        const walkDays = makeCounter();

        readingDays();
        readingDays();
        console.log(readingDays());
        console.log(walkDays());
      states:
        - caption:
            uk: "Перший виклик `makeCounter()` створив коробку `#box1` з `count = 0` і повернув стрілкову функцію. Прихований зв’язок функції з коробкою намальовано як `scope`. Кадр виклику вже зник зі стеку, а `#box1` живе: на неї посилається функція в `readingDays`."
            en: "The first call `makeCounter()` created the box `#box1` with `count = 0` and returned an arrow function. The function’s hidden link to the box is drawn as `scope`. The call’s frame has left the stack, yet `#box1` lives on: the function in `readingDays` refers to it."
          line: 9
          bindings:
            - { name: readingDays, kind: const, value: { ref: fn1 } }
            - { name: walkDays, kind: const, value: "uninitialized" }
          heap:
            fn1: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: box1 } } }
            box1: { kind: object, ctor: "makeCounter() · 1", props: { count: 0 } }
        - caption:
            uk: "Другий виклик — **нова** коробка `#box2` із власним `count = 0` і нова функція, пов’язана саме з нею. Код той самий, коробки різні."
            en: "The second call — a **new** box `#box2` with its own `count = 0` and a new function linked to it. Same code, different boxes."
          line: 10
          bindings:
            - { name: readingDays, kind: const, value: { ref: fn1 } }
            - { name: walkDays, kind: const, value: { ref: fn2 } }
          heap:
            fn1: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: box1 } } }
            box1: { kind: object, ctor: "makeCounter() · 1", props: { count: 0 } }
            fn2: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: box2 } } }
            box2: { kind: object, ctor: "makeCounter() · 2", props: { count: 0 } }
        - caption:
            uk: "`readingDays()` іде за своїм зв’язком і змінює `count` у `#box1`: тепер `1`. `#box2` не змінилася."
            en: "`readingDays()` follows its own link and changes `count` in `#box1`: now `1`. `#box2` did not change."
          line: 12
          bindings:
            - { name: readingDays, kind: const, value: { ref: fn1 } }
            - { name: walkDays, kind: const, value: { ref: fn2 } }
          heap:
            fn1: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: box1 } } }
            box1: { kind: object, ctor: "makeCounter() · 1", props: { count: 1 } }
            fn2: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: box2 } } }
            box2: { kind: object, ctor: "makeCounter() · 2", props: { count: 0 } }
        - caption:
            uk: "Ще один виклик — `count` у `#box1` дорівнює `2`. Значення накопичується, бо коробка переживає кожен виклик стрілкової функції."
            en: "One more call — `count` in `#box1` is `2`. The value accumulates because the box outlives every call of the arrow function."
          line: 13
          bindings:
            - { name: readingDays, kind: const, value: { ref: fn1 } }
            - { name: walkDays, kind: const, value: { ref: fn2 } }
          heap:
            fn1: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: box1 } } }
            box1: { kind: object, ctor: "makeCounter() · 1", props: { count: 2 } }
            fn2: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: box2 } } }
            box2: { kind: object, ctor: "makeCounter() · 2", props: { count: 0 } }
        - caption:
            uk: "Третій виклик повертає `3`, і `console.log` виводить `3`."
            en: "The third call returns `3`, and `console.log` prints `3`."
          line: 14
          bindings:
            - { name: readingDays, kind: const, value: { ref: fn1 } }
            - { name: walkDays, kind: const, value: { ref: fn2 } }
          heap:
            fn1: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: box1 } } }
            box1: { kind: object, ctor: "makeCounter() · 1", props: { count: 3 } }
            fn2: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: box2 } } }
            box2: { kind: object, ctor: "makeCounter() · 2", props: { count: 0 } }
        - caption:
            uk: "`walkDays()` іде за **своїм** зв’язком до `#box2`: `count` там стає `1`, і виводиться `1`. Лічильники незалежні, бо кожен виклик фабрики спакував окрему коробку."
            en: "`walkDays()` follows **its own** link to `#box2`: `count` there becomes `1`, and `1` is printed. The counters are independent because every call of the factory packed a separate box."
          line: 15
          bindings:
            - { name: readingDays, kind: const, value: { ref: fn1 } }
            - { name: walkDays, kind: const, value: { ref: fn2 } }
          heap:
            fn1: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: box1 } } }
            box1: { kind: object, ctor: "makeCounter() · 1", props: { count: 3 } }
            fn2: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: box2 } } }
            box2: { kind: object, ctor: "makeCounter() · 2", props: { count: 1 } }

  - id: backpack
    kind: analogy
    body:
      uk: "Уяви, що функція вирушає з місця народження з **наплічником**. У ньому не речі, а **посилання** на змінні, поруч із якими її написали. Де б функцію потім не викликали, вона може дістати з наплічника будь-яку з цих змінних. Кожен виклик зовнішньої функції пакує **новий** наплічник — тому два лічильники не заважають один одному."
      en: "Imagine a function leaving its birthplace with a **backpack**. Inside there are no things, only **links** to the variables it was written next to. Wherever the function is called later, it can reach into the backpack for any of those variables. Every call of the outer function packs a **new** backpack — that is why two counters do not get in each other’s way."
    limits:
      uk: "У наплічнику лежать живі посилання, а не знімки значень: якщо зовнішню змінну згодом перепризначать, функція побачить нове значення. А все, на що посилається наплічник, лишається в пам’яті, доки саму функцію ще можна викликати."
      en: "The backpack holds live links, not snapshots of values: if an outer variable is reassigned later, the function sees the new value. And everything the backpack links to stays in memory for as long as the function itself can still be called."

  - id: live-link
    kind: prediction
    prompt:
      uk: "Знижку змінили вже **після** того, як створили функцію. Що виведе програма?"
      en: "The discount is changed **after** the function was created. What does the program print?"
    code: |
      let discount = 10;
      const applyDiscount = (price) => price - discount;

      discount = 25;
      console.log(applyDiscount(100));
    verify:
      logs: ["75"]
    answer:
      type: choice
      options:
        - id: snapshot
          text: { uk: "`90`", en: "`90`" }
          why:
            uk: "Функція не фотографує значення `10` у момент створення. Вона тримає посилання на саму змінну `discount` і читає її тоді, коли її викликають."
            en: "The function does not take a snapshot of `10` when it is created. It keeps a link to the variable `discount` itself and reads it when it is called."
        - id: current
          text: { uk: "`75`", en: "`75`" }
        - id: ignored
          text: { uk: "`100`", en: "`100`" }
          why:
            uk: "`discount` знайдено в коробці файла, де функцію написано, тож знижку застосовано."
            en: "`discount` is found in the box of the file where the function is written, so the discount is applied."
      correct: [current]
    explanation:
      uk: "Closure тримає **живе посилання** на змінну, а не копію її значення. На момент виклику в `discount` уже `25`, тому `100 - 25` дає `75`. Саме про це межа аналогії з наплічником: у ньому посилання, а не знімки."
      en: "A closure keeps a **live link** to the variable, not a copy of its value. By the time of the call `discount` already holds `25`, so `100 - 25` gives `75`. That is exactly the limit of the backpack analogy: it holds links, not snapshots."

  - id: counter-lab
    kind: example
    runtime: browser-js
    dir: counter-lab
    entry: index.js
    strings:
      uah: { uk: "грн", en: "UAH" }
    title:
      uk: "Лабораторія лічильників"
      en: "A counter lab"
    body:
      uk: |
        Два лічильники з однієї фабрики і функція, що читає зовнішню змінну `currency`. Запусти й зістав результати з діаграмою вище.
      en: |
        Two counters from one factory and a function that reads the outer variable `currency`. Run it and match the results with the diagram above.
    tryIt:
      uk: "Створи третій лічильник `const waterGlasses = makeCounter();` і виклич його кілька разів — він починає з `1` і не чіпає інших. Потім після рядка з `formatAmount` додай `currency = \"EUR\";` і ще раз `console.log(formatAmount(80));`: функцію створено раніше, але вона читає поточне значення — `80 EUR`."
      en: "Create a third counter `const waterGlasses = makeCounter();` and call it a few times — it starts from `1` and leaves the others alone. Then, after the `formatAmount` line, add `currency = \"EUR\";` and once more `console.log(formatAmount(80));`: the function was created earlier, but it reads the current value — `80 EUR`."

  - id: make-labeler
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: make-labeler
    entry: index.js
    strings:
      wantPrefix: { uk: "Хочу: ", en: "Want: " }
      havePrefix: { uk: "Вже є: ", en: "Got it: " }
      headphones: { uk: "Навушники", en: "Headphones" }
      mug: { uk: "Термочашка", en: "Travel mug" }
    title:
      uk: "Фабрика підписів"
      en: "A label factory"
    instructions:
      uk: |
        У списку бажань одні речі ще хочеться отримати, а інші вже є.

        1. Допиши фабрику `makeLabeler(prefix)`: вона повертає **нову функцію**, яка приймає запис бажання й повертає `prefix` + назву запису (`record.name`).
        2. Створи дві функції: `wantLabel` із префіксом «Хочу: » і `haveLabel` із префіксом «Вже є: ».

        Рядки з `console.log` унизу вже готові: має вийти «Хочу: Навушники» і «Вже є: Термочашка».
      en: |
        In the wishlist some things are still wanted and others are already owned.

        1. Finish the factory `makeLabeler(prefix)`: it returns a **new function** that takes a wish record and returns `prefix` + the record’s name (`record.name`).
        2. Create two functions: `wantLabel` with the prefix “Want: ” and `haveLabel` with the prefix “Got it: ”.

        The `console.log` lines at the bottom are ready: the output must be “Want: Headphones” and “Got it: Travel mug”.
    testTitles:
      "runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without errors"
      "makeLabeler returns a function":
        uk: "makeLabeler повертає функцію"
        en: "makeLabeler returns a function"
      "the returned function adds the prefix to the name":
        uk: "Повернена функція додає префікс до назви"
        en: "The returned function adds the prefix to the name"
      "each labeler keeps its own prefix":
        uk: "Кожна створена функція пам’ятає свій префікс"
        en: "Each labeler keeps its own prefix"
      "wantLabel and haveLabel use their prefixes":
        uk: "wantLabel і haveLabel мають потрібні префікси"
        en: "wantLabel and haveLabel use their prefixes"
      "prints both labels":
        uk: "Виводить обидва підписи"
        en: "Prints both labels"
    hints:
      nudge:
        uk: "Згадай `makeReminder` з початку уроку: що вона повертала — текст чи функцію?"
        en: "Remember `makeReminder` from the start of the lesson: did it return text or a function?"
      explanation:
        uk: "Усередині `makeLabeler` поверни стрілкову функцію: `return (record) => prefix + record.name;`. Вона запам’ятає `prefix` свого виклику. Потім створи дві функції: `const wantLabel = makeLabeler(\"Хочу: \");` і `const haveLabel = makeLabeler(\"Вже є: \");` — вище за рядки з `console.log`."
        en: "Inside `makeLabeler` return an arrow function: `return (record) => prefix + record.name;`. It remembers the `prefix` of its call. Then create two functions: `const wantLabel = makeLabeler(\"Want: \");` and `const haveLabel = makeLabeler(\"Got it: \");` — above the `console.log` lines."
    solutionNote:
      uk: "Кожен виклик `makeLabeler` створює нову коробку з власним `prefix` і повертає функцію, пов’язану саме з нею. Тому `wantLabel` і `haveLabel` не заважають одна одній, хоч їх зробила одна фабрика."
      en: "Every call of `makeLabeler` creates a new box with its own `prefix` and returns a function linked to that box. That is why `wantLabel` and `haveLabel` do not interfere, although one factory made both."
    feedback:
      - when: { error: ReferenceError }
        message:
          uk: "`… is not defined`: створи обидві функції — `wantLabel` і `haveLabel` — до рядків із `console.log`, наприклад `const wantLabel = makeLabeler(\"Хочу: \");`."
          en: "`… is not defined`: create both functions — `wantLabel` and `haveLabel` — before the `console.log` lines, for example `const wantLabel = makeLabeler(\"Want: \");`."
      - when: { error: TypeError }
        message:
          uk: "`… is not a function`: `makeLabeler` має **повернути функцію**, а не текст і не `undefined`: `return (record) => prefix + record.name;`."
          en: "`… is not a function`: `makeLabeler` must **return a function**, not text and not `undefined`: `return (record) => prefix + record.name;`."
      - when: { test: "each labeler keeps its own prefix" }
        message:
          uk: "Друга створена функція «перебила» префікс першої. Мабуть, префікс зберігається в змінній поза `makeLabeler`. Хай функція читає параметр `prefix` свого виклику — у кожного виклику він свій."
          en: "The second labeler overwrote the prefix of the first. The prefix is probably kept in a variable outside `makeLabeler`. Let the function read the `prefix` parameter of its own call — every call has its own."
      - when: { test: "the returned function adds the prefix to the name" }
        message:
          uk: "Додавай до префікса саме назву: `record.name`. Якщо в підписі бачиш «[object Object]», до тексту доданий увесь запис."
          en: "Add the name itself to the prefix: `record.name`. If you see “[object Object]” in the label, the whole record was added to the text."

  - id: to-project
    kind: transfer
    capstoneStep: JS-03
    body:
      uk: "Фабрики функцій знадобляться в проєкті, коли кілька функцій відрізняються лише налаштуванням — наприклад, префіксом чи одиницею виміру. У кроці цього розділу ти напишеш звичайні чисті функції форматування; пам’ятай, що кожна з них бачить змінні місця, де її написано."
      en: "Function factories come in handy in the project when several functions differ only in a setting — a prefix or a unit, for example. In this unit’s step you write plain pure formatting functions; remember that each of them sees the variables of the place where it is written."
