id: js-03-08-recursion-base-case
unit: JS-03
title:
  uk: "Рекурсія і базовий випадок"
  en: "Recursion and the base case"
kind: instructional
minutes: 14
contentVersion: 1
objectives:
  - uk: "Знайти базовий і рекурсивний випадки рекурсивної функції та передбачити глибину стеку викликів для заданого входу."
    en: "Identify the base case and the recursive case of a recursive function and predict the call-stack depth for a given input."
  - uk: "Написати рекурсивну функцію для вкладеної структури, яка зупиняється на базовому випадку й на максимальній глибині."
    en: "Write a recursive function over a nested structure that stops at a base case and at a maximum depth."
  - uk: "Пояснити `RangeError`, що виникає, коли базового випадку немає або до нього неможливо дійти."
    en: "Explain the `RangeError` that appears when the base case is missing or never reached."
prerequisites: [js-03-07-pure-vs-side-effects, js-03-04-scope-and-call-frames, js-02-05-if-else-switch]
subskills:
  - { family: J-04, skill: "recursion/base case", depth: intro }
glossary: [recursion, base-case, recursive-case, call-stack, stack-overflow]
selfCheck: [count-up, sum-depth, depth-of]

blocks:
  - id: the-call-stack
    kind: explanation
    title:
      uk: "Стек викликів"
      en: "The call stack"
    body:
      uk: |
        Коли одна функція викликає іншу, перша **ставить свою роботу на паузу** й чекає відповіді. Незавершені виклики JavaScript тримає в стопці — [[call-stack|стеку викликів]]. Новий виклик кладе свій [[call-frame|кадр]] нагору; коли функція повертає значення, її кадр знімають, і продовжує той виклик, що під ним.

        ```js
        function withCurrency(amount) {
          return amount + " грн";
        }

        function formatTotal(amount) {
          return "Разом: " + withCurrency(amount);
        }

        console.log(formatTotal(80));
        ```

        | Крок | Стек (зверху — той, що працює) | Що відбувається |
        |---|---|---|
        | 1 | `formatTotal(80)` · файл | починає й потребує `withCurrency(80)` |
        | 2 | `withCurrency(80)` · `formatTotal(80)` · файл | `withCurrency` працює, `formatTotal` чекає |
        | 3 | `formatTotal(80)` · файл | отримала «80 грн», складає «Разом: 80 грн» |
        | 4 | файл | результат іде в `console.log` |
      en: |
        When one function calls another, the first one **pauses its work** and waits for the answer. JavaScript keeps unfinished calls in a pile — the [[call-stack|call stack]]. A new call puts its [[call-frame|frame]] on top; when a function returns, its frame is removed, and the call underneath continues.

        ```js
        function withCurrency(amount) {
          return amount + " UAH";
        }

        function formatTotal(amount) {
          return "Total: " + withCurrency(amount);
        }

        console.log(formatTotal(80));
        ```

        | Step | Stack (the running one on top) | What happens |
        |---|---|---|
        | 1 | `formatTotal(80)` · file | starts and needs `withCurrency(80)` |
        | 2 | `withCurrency(80)` · `formatTotal(80)` · file | `withCurrency` runs, `formatTotal` waits |
        | 3 | `formatTotal(80)` · file | got “80 UAH”, builds “Total: 80 UAH” |
        | 4 | file | the result goes to `console.log` |

  - id: calling-itself
    kind: explanation
    title:
      uk: "Функція, що викликає саму себе"
      en: "A function that calls itself"
    body:
      uk: |
        Функція може викликати **саму себе** — це [[recursion|рекурсія]]. Вона доречна, коли задача містить меншу копію самої себе. У JS-02 ти рахував суму чисел від 1 до `n` циклом. Подивімося інакше: сума до 4 — це `4` + сума до 3; сума до 3 — це `3` + сума до 2; … а сума до 1 — просто `1`.

        ```js
        function sumTo(n) {
          if (n === 1) {
            return 1;               // base case
          }
          return n + sumTo(n - 1);  // recursive case
        }
        ```

        - [[base-case|Базовий випадок]] відповідає одразу, без нового виклику, і зупиняє ланцюжок.
        - [[recursive-case|Рекурсивний випадок]] робить один крок і передає решту меншому виклику: `n - 1` щоразу наближає до базового випадку.

        Кожен виклик отримує **власний кадр із власним `n`**.
      en: |
        A function can call **itself** — that is [[recursion]]. It fits when a problem contains a smaller copy of itself. In JS-02 you summed the numbers from 1 to `n` with a loop. Let’s look at it differently: the sum up to 4 is `4` + the sum up to 3; the sum up to 3 is `3` + the sum up to 2; … and the sum up to 1 is just `1`.

        ```js
        function sumTo(n) {
          if (n === 1) {
            return 1;               // base case
          }
          return n + sumTo(n - 1);  // recursive case
        }
        ```

        - The [[base-case|base case]] answers right away, without a new call, and stops the chain.
        - The [[recursive-case|recursive case]] does one step and hands the rest to a smaller call: `n - 1` gets closer to the base case every time.

        Every call gets **its own frame with its own `n`**.

  - id: count-up
    kind: prediction
    prompt:
      uk: "Тут `console.log` стоїть **після** рекурсивного виклику. Що виведе `countUp(3)`?"
      en: "Here `console.log` comes **after** the recursive call. What does `countUp(3)` print?"
    code: |
      function countUp(n) {
        if (n === 0) {
          return;
        }
        countUp(n - 1);
        console.log(n);
      }

      countUp(3);
    verify:
      logs: ["1", "2", "3"]
    answer:
      type: choice
      options:
        - id: on-the-way-back
          text: { uk: "`1`, `2`, `3`", en: "`1`, `2`, `3`" }
        - id: on-the-way-down
          text: { uk: "`3`, `2`, `1`", en: "`3`, `2`, `1`" }
          why:
            uk: "`console.log(n)` стоїть **після** виклику `countUp(n - 1)`. Кожен кадр друкує лише тоді, коли всі менші виклики вже завершилися, тож першим друкує найглибший — `countUp(1)`."
            en: "`console.log(n)` comes **after** the call `countUp(n - 1)`. Each frame prints only once all the smaller calls have finished, so the deepest one, `countUp(1)`, prints first."
        - id: shared-n
          text: { uk: "`0`, `0`, `0`", en: "`0`, `0`, `0`" }
          why:
            uk: "Кожен виклик має власний `n` у своєму кадрі. Те, що найглибший виклик має `n = 0`, не змінює `n` у кадрах, які чекають під ним."
            en: "Every call has its own `n` in its own frame. The deepest call having `n = 0` does not change `n` in the frames waiting below it."
        - id: zero-printed
          text: { uk: "`0`, `1`, `2`, `3`", en: "`0`, `1`, `2`, `3`" }
          why:
            uk: "Виклик із `n = 0` — базовий випадок: він повертається одразу, ще до рядка з `console.log`."
            en: "The call with `n = 0` is the base case: it returns at once, before the `console.log` line."
      correct: [on-the-way-back]
    explanation:
      uk: "Спершу виклики «спускаються»: `countUp(3)` чекає на `countUp(2)`, та — на `countUp(1)`, та — на `countUp(0)`, який одразу повертається. Потім кадри знімаються в зворотному порядку, і кожен друкує **свій** `n`: спершу 1, потім 2, потім 3."
      en: "First the calls “go down”: `countUp(3)` waits for `countUp(2)`, which waits for `countUp(1)`, which waits for `countUp(0)`, which returns at once. Then the frames come off in reverse order, and each prints **its own** `n`: first 1, then 2, then 3."

  - id: sum-depth
    kind: prediction
    prompt:
      uk: "Що виведе програма і скільки кадрів `sumTo` лежить у стеку одночасно в найглибший момент?"
      en: "What does the program print, and how many `sumTo` frames are on the stack at the same time at the deepest moment?"
    code: |
      function sumTo(n) {
        if (n === 1) {
          return 1;
        }
        return n + sumTo(n - 1);
      }

      console.log(sumTo(4));
    verify:
      logs: ["10"]
    answer:
      type: choice
      options:
        - id: ten-four
          text:
            uk: "`10`; найбільше 4 кадри `sumTo` одночасно"
            en: "`10`; at most 4 `sumTo` frames at once"
        - id: ten-one
          text:
            uk: "`10`; лише 1 кадр — кожен виклик завершується перед наступним"
            en: "`10`; just 1 frame — each call finishes before the next one"
          why:
            uk: "Навпаки: `sumTo(4)` не може завершитися, доки не отримає відповідь від `sumTo(3)`, тож кадри накопичуються: 4, 3, 2, 1."
            en: "The opposite: `sumTo(4)` cannot finish until it gets the answer from `sumTo(3)`, so the frames pile up: 4, 3, 2, 1."
        - id: four-four
          text:
            uk: "`4`; 4 кадри"
            en: "`4`; 4 frames"
          why:
            uk: "Результати складаються на зворотному шляху: `sumTo(1)` дає 1, `sumTo(2)` — `2 + 1`, `sumTo(3)` — `3 + 3`, `sumTo(4)` — `4 + 6`."
            en: "The results add up on the way back: `sumTo(1)` gives 1, `sumTo(2)` gives `2 + 1`, `sumTo(3)` gives `3 + 3`, `sumTo(4)` gives `4 + 6`."
        - id: ten-five
          text:
            uk: "`10`; 5 кадрів — останній для `sumTo(0)`"
            en: "`10`; 5 frames — the last one for `sumTo(0)`"
          why:
            uk: "Базовий випадок `n === 1` відповідає без нового виклику, тож `sumTo(0)` ніхто не викликає. Найглибший кадр — `sumTo(1)`."
            en: "The base case `n === 1` answers without a new call, so nobody calls `sumTo(0)`. The deepest frame is `sumTo(1)`."
      correct: [ten-four]
    explanation:
      uk: "Кадри накопичуються, доки не дійде до базового випадку: `sumTo(4)`, `sumTo(3)`, `sumTo(2)`, `sumTo(1)` — чотири одночасно (під ними ще файл). Потім вони знімаються й повертають значення назад: 1, 3, 6, 10. Нижче це видно крок за кроком."
      en: "Frames pile up until the base case is reached: `sumTo(4)`, `sumTo(3)`, `sumTo(2)`, `sumTo(1)` — four at once (with the file underneath). Then they come off and hand values back: 1, 3, 6, 10. Below you can see it step by step."

  - id: sum-steps
    kind: visual
    visual: code-trace
    title:
      uk: "Крок за кроком: стек викликів sumTo(4)"
      en: "Step by step: the call stack of sumTo(4)"
    textEquivalent:
      uk: "Це той самий sumTo, лише рекурсивний виклик записано окремим рядком: const rest = sumTo(n - 1). Виклик sumTo(4) створює кадр із n = 4. Умова n === 1 хибна, тож кадр зупиняється на рядку з const rest і чекає на sumTo(3), який кладе на стек новий кадр із власним n = 3; так само з’являються кадри для n = 2 і n = 1. У найглибший момент у стеку чотири кадри sumTo над кадром файла, і кожен має своє значення n. Для n = 1 спрацьовує базовий випадок: функція повертає 1 без нового виклику, і її кадр знімається. Далі кадри знімаються по одному: кадр із n = 2 отримує rest = 1 і повертає 3, кадр із n = 3 — 3 + 3 = 6, кадр із n = 4 — 4 + 6 = 10. Стек знову містить лише файл, і консоль показує 10."
      en: "This is the same sumTo, only the recursive call is written on its own line: const rest = sumTo(n - 1). The call sumTo(4) creates a frame with n = 4. The condition n === 1 is false, so the frame stops on the const rest line and waits for sumTo(3), which puts a new frame with its own n = 3 on the stack; frames for n = 2 and n = 1 appear the same way. At the deepest moment there are four sumTo frames above the file’s frame, each with its own value of n. For n = 1 the base case applies: the function returns 1 without a new call, and its frame is removed. Then the frames come off one by one: the frame with n = 2 gets rest = 1 and returns 3, the frame with n = 3 returns 3 + 3 = 6, the frame with n = 4 returns 4 + 6 = 10. The stack holds only the file again, and the console shows 10."
    spec:
      file: visuals/sum-to.js
      captions:
        - at: { line: 1, kind: call }
          text:
            uk: "Це той самий `sumTo`, лише рекурсивний виклик записано окремим рядком, щоб було видно, де чекає кожен кадр. `sumTo(4)`: перший кадр, у ньому `n = 4`."
            en: "This is the same `sumTo`, only the recursive call is written on its own line so you can see where each frame waits. `sumTo(4)`: the first frame, with `n = 4` in it."
        - at: { line: 5 }
          text:
            uk: "`n === 1`? Ні, тож це рекурсивний випадок: рядок 5 викликає `sumTo(3)`, і цей кадр **чекає** тут на відповідь (`rest` поки **uninitialized**)."
            en: "`n === 1`? No, so this is the recursive case: line 5 calls `sumTo(3)`, and this frame **waits** here for the answer (`rest` is still **uninitialized**)."
        - at: { line: 1, kind: call, hit: 2 }
          text:
            uk: "`sumTo(3)` кладе на стек **новий** кадр із власним `n = 3`. Кадр з `n = 4` нікуди не зник — він чекає під ним на рядку 5."
            en: "`sumTo(3)` puts a **new** frame with its own `n = 3` on the stack. The frame with `n = 4` has not gone anywhere — it waits underneath on line 5."
        - at: { line: 1, kind: call, hit: 4 }
          text:
            uk: "`sumTo(1)` — уже четвертий кадр `sumTo` у **Call stack**. У кожного свій `n`: 4, 3, 2 і 1."
            en: "`sumTo(1)` — the fourth `sumTo` frame in the **Call stack** already. Each has its own `n`: 4, 3, 2 and 1."
        - at: { line: 2, kind: cond, hit: 4 }
          text:
            uk: "`n === 1` — так! Це базовий випадок: відповідь відома без нового виклику."
            en: "`n === 1` — yes! This is the base case: the answer is known without a new call."
        - at: { line: 3, kind: return }
          text:
            uk: "Повертається `1`, найглибший кадр знімається. Тепер стек починає зменшуватися."
            en: "`1` is returned and the deepest frame is removed. Now the stack starts to shrink."
        - at: { line: 6, kind: return }
          text:
            uk: "Кадр з `n = 2` отримав `rest = 1` і повертає `2 + 1 = 3`."
            en: "The frame with `n = 2` got `rest = 1` and returns `2 + 1 = 3`."
        - at: { line: 6, kind: return, hit: 2 }
          text:
            uk: "Кадр з `n = 3`: `rest = 3`, тож `3 + 3 = 6`."
            en: "The frame with `n = 3`: `rest = 3`, so `3 + 3 = 6`."
        - at: { line: 6, kind: return, hit: 3 }
          text:
            uk: "Кадр з `n = 4`: `4 + 6 = 10`. Після нього у стеку лишається тільки файл."
            en: "The frame with `n = 4`: `4 + 6 = 10`. After it only the file is left on the stack."
        - at: { line: 9, kind: end }
          text:
            uk: "У консолі `10`. Найбільша глибина була 4 кадри `sumTo` — по одному на кожне `n`."
            en: "The console shows `10`. The greatest depth was 4 `sumTo` frames — one for every `n`."

  - id: cinema-row
    kind: analogy
    body:
      uk: "Ти сидиш у темному кінозалі й хочеш знати номер свого ряду. Питаєш людину попереду: «Який у тебе ряд?» Вона не знає й питає того, хто сидить перед нею, — і так далі. Людина в першому ряду відповідає одразу: «Перший» — це базовий випадок. Потім відповіді йдуть назад: кожен додає 1 до почутого й передає далі, аж поки число не дійде до тебе."
      en: "You sit in a dark cinema and want to know your row number. You ask the person in front of you: “Which row are you in?” They do not know and ask the person in front of them — and so on. The person in the first row answers at once: “The first” — that is the base case. Then the answers travel back: everyone adds 1 to what they heard and passes it on, until the number reaches you."
    limits:
      uk: "У залі питають різні люди, а в рекурсії — та сама функція; просто кожен виклик має власний кадр зі своїми значеннями. І стек викликів, на відміну від залу, має межу: якщо «рядів» забагато або першого ряду немає взагалі (бракує базового випадку), стек переповнюється."
      en: "In the cinema different people ask, while in recursion it is the same function; every call simply has its own frame with its own values. And unlike the cinema, the call stack has a limit: with too many “rows”, or with no first row at all (a missing base case), the stack overflows."

  - id: overflow
    kind: example
    runtime: browser-js
    dir: overflow
    entry: index.js
    title:
      uk: "Без базового випадку"
      en: "Without a base case"
    body:
      uk: |
        Запусти: `sumTo(4)` дає `10`, `sumTo(100)` — `5050`. А тепер зламаємо базовий випадок. Без нього виклики не зупиняються, доки стек викликів не переповниться, — це [[stack-overflow|переповнення стеку]].
      en: |
        Run it: `sumTo(4)` gives `10`, `sumTo(100)` gives `5050`. Now let’s break the base case. Without it the calls never stop until the call stack overflows — a [[stack-overflow|stack overflow]].
    tryIt:
      uk: "Видали базовий випадок — рядки від `if` до його `}` — і запусти. Прочитай повідомлення: назва `RangeError`, пояснення `Maximum call stack size exceeded` і рядок усередині `sumTo`, де закінчився стек. Поверни базовий випадок (Ctrl+Z). Потім зміни його на `if (n <= 0) { return 0; }` і додай `console.log(sumTo(0));` — тепер `sumTo(0)` дає `0`, а `sumTo(4)` — так само `10`."
      en: "Delete the base case — the lines from `if` to its `}` — and run. Read the message: the name `RangeError`, the explanation `Maximum call stack size exceeded` and the line inside `sumTo` where the stack ran out. Bring the base case back (Ctrl+Z). Then change it to `if (n <= 0) { return 0; }` and add `console.log(sumTo(0));` — now `sumTo(0)` gives `0`, and `sumTo(4)` still gives `10`."

  - id: recall
    kind: review
    title:
      uk: "Згадай: гілки й повідомлення про помилку"
      en: "Recall: branches and error messages"
    strings:
      none: { uk: "нічого", en: "nothing" }
      one: { uk: "один", en: "one" }
      many: { uk: "багато", en: "many" }
    items:
      - id: branch-returns
        from: js-02-05-if-else-switch
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          function describeCount(count) {
            if (count === 0) {
              return "%%none%%";
            }
            if (count === 1) {
              return "%%one%%";
            }
            return "%%many%%";
          }

          console.log(describeCount(0));
          console.log(describeCount(5));
        verify:
          logs: ["%%none%%", "%%many%%"]
        answer:
          type: choice
          options:
            - id: first-match
              text: { uk: "«нічого», «багато»", en: "“nothing”, “many”" }
            - id: all-branches
              text: { uk: "«нічого», «один», «багато», «багато»", en: "“nothing”, “one”, “many”, “many”" }
              why:
                uk: "`return` у гілці, що спрацювала, завершує виклик — решта функції вже не виконується. До того ж функція нічого не друкує: друкує лише `console.log` унизу."
                en: "The `return` in the branch that ran ends the call — the rest of the function does not run. Besides, the function prints nothing: only the `console.log` at the bottom prints."
            - id: many-twice
              text: { uk: "«багато» двічі", en: "“many” twice" }
              why:
                uk: "Для `count = 0` перша умова істинна, і її `return` одразу дає «нічого»."
                en: "For `count = 0` the first condition is true, and its `return` gives “nothing” at once."
          correct: [first-match]
        explanation:
          uk: "Гілка `if`, що повертає значення, завершує виклик — решта функції не виконується. Так само влаштований базовий випадок рекурсії: `if` перевіряє найпростішу ситуацію й одразу повертає відповідь, не викликаючи функцію знову."
          en: "An `if` branch that returns a value ends the call — the rest of the function does not run. The base case of recursion is built the same way: an `if` checks the simplest situation and returns the answer at once, without calling the function again."
      - id: unreachable-base
        from: js-01-05-reading-an-error
        prompt:
          uk: "Базовий випадок чекає на `n === 1`, а функцію викликали з `0`. Що станеться?"
          en: "The base case waits for `n === 1`, but the function is called with `0`. What happens?"
        code: |
          function sumTo(n) {
            if (n === 1) {
              return 1;
            }
            return n + sumTo(n - 1);
          }

          console.log(sumTo(0));
        verify:
          logs: []
          error: RangeError
        answer:
          type: choice
          options:
            - id: zero
              text: { uk: "Виведе `0`", en: "It prints `0`" }
              why:
                uk: "Від `0` виклики йдуть до `-1`, `-2`… і ніколи не зустрічають `1`, тож до `return` справа не доходить."
                en: "From `0` the calls go to `-1`, `-2`… and never meet `1`, so no `return` is ever reached."
            - id: range-error
              text:
                uk: "`RangeError: Maximum call stack size exceeded`"
                en: "`RangeError: Maximum call stack size exceeded`"
            - id: syntax-error
              text:
                uk: "`SyntaxError`, і нічого не виконається"
                en: "A `SyntaxError`, and nothing runs"
              why:
                uk: "Код записано правильно, тож JavaScript його прочитав і почав виконувати. Помилка виникає вже під час виконання."
                en: "The code is written correctly, so JavaScript read it and started running it. The error happens while it runs."
          correct: [range-error]
        explanation:
          uk: "Читай повідомлення, як у першому розділі. **Назва** `RangeError` — значення вийшло за дозволені межі (тут — розмір стеку). **Пояснення** `Maximum call stack size exceeded` — незавершених викликів забагато. **Місце** — рядок усередині `sumTo`, на якому закінчився стек. Але сам цей рядок правильний: причина в базовому випадку, до якого неможливо дійти. Шукай її там."
          en: "Read the message as in the first unit. The **name** `RangeError` — a value went beyond the allowed range (here, the stack size). The **explanation** `Maximum call stack size exceeded` — too many unfinished calls. The **place** — a line inside `sumTo` where the stack ran out. But that line itself is fine: the cause is a base case that cannot be reached. Look for it there."

  - id: depth-of
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: depth-of
    entry: index.js
    strings:
      big: { uk: "Велика коробка", en: "Big box" }
      middle: { uk: "Середня коробка", en: "Middle box" }
      small: { uk: "Маленька коробка", en: "Small box" }
    title:
      uk: "Скільки коробок у подарунку?"
      en: "How many boxes is the gift in?"
    instructions:
      uk: |
        Подарунок із твого списку бажань запаковано в кілька коробок, одна в одній. Кожна коробка — це запис `{ label, inner }`, де `inner` — коробка всередині або `null`, якщо всередині коробок уже немає.

        Напиши `depthOf(box, maxDepth)`: вона повертає, скільки коробок вкладено одна в одну, рахуючи саму `box`, але **не більше ніж `maxDepth`**:

        - `depthOf(gift, 10)` → `3`;
        - `depthOf(gift, 2)` → `2` (далі не рахуємо);
        - `depthOf(null, 10)` → `0`.

        Обмеження `maxDepth` захищає від дуже глибоких «пакунків»: функція зупиняється вчасно, навіть якщо коробок тисячі.
      en: |
        A gift from your wishlist is packed in several boxes, one inside another. Every box is a record `{ label, inner }`, where `inner` is the box inside, or `null` when there are no more boxes inside.

        Write `depthOf(box, maxDepth)`: it returns how many boxes are nested inside each other, counting `box` itself, but **no more than `maxDepth`**:

        - `depthOf(gift, 10)` → `3`;
        - `depthOf(gift, 2)` → `2` (we stop counting there);
        - `depthOf(null, 10)` → `0`.

        The `maxDepth` limit protects against very deep “parcels”: the function stops in time even if there are thousands of boxes.
    testTitles:
      "runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without errors"
      "gives 0 when there is no box":
        uk: "Дає 0, коли коробки немає"
        en: "Gives 0 when there is no box"
      "counts a single box":
        uk: "Рахує одну коробку"
        en: "Counts a single box"
      "counts nested boxes":
        uk: "Рахує вкладені коробки"
        en: "Counts nested boxes"
      "stops at maxDepth":
        uk: "Зупиняється на maxDepth"
        en: "Stops at maxDepth"
      "stops early on a very deep pile of boxes":
        uk: "Вчасно зупиняється навіть на дуже глибокому пакунку"
        en: "Stops early even on a very deep pile of boxes"
      "prints 3, 2 and 0":
        uk: "Виводить 3, 2 і 0"
        en: "Prints 3, 2 and 0"
    hints:
      nudge:
        uk: "Почни з двох ситуацій, коли відповідь відома одразу: коробки немає (`null`) і глибини не лишилося (`maxDepth === 0`)."
        en: "Start with the two situations where the answer is known at once: there is no box (`null`), and there is no depth left (`maxDepth === 0`)."
      explanation:
        uk: "Обидва базові випадки повертають `0`. Рекурсивний випадок: ця коробка — це `1`, плюс глибина того, що в ній, із меншим запасом: `return 1 + depthOf(box.inner, maxDepth - 1);`."
        en: "Both base cases return `0`. The recursive case: this box counts as `1`, plus the depth of what is inside it, with less room left: `return 1 + depthOf(box.inner, maxDepth - 1);`."
    solutionNote:
      uk: "У `depthOf` два базові випадки: «коробки немає» зупиняє рекурсію на дні, а «глибини не лишилося» обриває її раніше, навіть якщо коробок тисячі. Кожен виклик має власні `box` і `maxDepth`, тому кадрів `depthOf` у стеку ніколи не більше ніж `maxDepth + 1`."
      en: "`depthOf` has two base cases: “no box” stops the recursion at the bottom, and “no depth left” cuts it short earlier, even if there are thousands of boxes. Every call has its own `box` and `maxDepth`, so there are never more than `maxDepth + 1` `depthOf` frames on the stack."
    feedback:
      - when: { error: TypeError }
        message:
          uk: "`Cannot read properties of null (reading 'inner')`: функція дійшла до `inner` найменшої коробки, а там `null`, — і спробувала зазирнути ще глибше. Додай першим базовий випадок: `if (box === null) { return 0; }`."
          en: "`Cannot read properties of null (reading 'inner')`: the function reached the `inner` of the smallest box, which is `null`, and tried to look even deeper. Add the base case first: `if (box === null) { return 0; }`."
      - when: { error: RangeError }
        message:
          uk: "`Maximum call stack size exceeded`: виклики не зупиняються. Перевір, що рекурсивний виклик отримує `maxDepth - 1` і що `maxDepth === 0` — теж базовий випадок."
          en: "`Maximum call stack size exceeded`: the calls never stop. Check that the recursive call receives `maxDepth - 1` and that `maxDepth === 0` is a base case too."
      - when: { test: "counts nested boxes" }
        message:
          uk: "Кожна коробка додає `1` до глибини того, що в ній: `return 1 + depthOf(box.inner, maxDepth - 1);`."
          en: "Every box adds `1` to the depth of what is inside it: `return 1 + depthOf(box.inner, maxDepth - 1);`."
      - when: { test: "stops at maxDepth" }
        message:
          uk: "Функція рахує глибше, ніж дозволено. Коли `maxDepth` дорівнює `0`, поверни `0`, а рекурсивному виклику передавай `maxDepth - 1`."
          en: "The function counts deeper than allowed. When `maxDepth` is `0`, return `0`, and pass `maxDepth - 1` to the recursive call."
      - when: { test: "stops early on a very deep pile of boxes" }
        message:
          uk: "На дуже глибокому пакунку функція не зупинилася вчасно. Обмеження `maxDepth` має обривати рекурсію ще до дна."
          en: "On a very deep parcel the function did not stop in time. The `maxDepth` limit must cut the recursion off before the bottom."

  - id: to-project
    kind: transfer
