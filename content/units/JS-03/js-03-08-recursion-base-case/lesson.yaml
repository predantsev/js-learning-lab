    body:
      uk: "У кроці проєкту цього розділу рекурсії немає, але звичка з цього уроку знадобиться для кожної функції: спершу обробити найпростіші випадки (`null`, порожній рядок) і повернути відповідь одразу, а вже потім — загальний випадок. Рекурсія повернеться пізніше, коли дані стануть вкладеними."
      en: "This unit’s project step has no recursion, but the habit from this lesson helps with every function: handle the simplest cases first (`null`, an empty string) and return right away, and only then the general case. Recursion comes back later, when the data becomes nested."
