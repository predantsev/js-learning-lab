id: js-03-03-arrow-functions
unit: JS-03
title:
  uk: "Стрілкові функції"
  en: "Arrow functions"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Переписати оголошення функції як стрілкову функцію з блоком і з неявним поверненням."
    en: "Rewrite a function declaration as an arrow function with a block body and with an implicit return."
  - uk: "Виправити стрілкову функцію, яка мала повертати об’єкт, але повертає `undefined`, бо фігурні дужки прочитано як блок."
    en: "Repair an arrow that is meant to return an object literal but returns `undefined` because the braces are read as a block."
  - uk: "Передбачити, чому стрілкову функцію в `const` не можна викликати вище за її рядок, а оголошення функції — можна."
    en: "Predict why an arrow stored in a `const` cannot be called before its line, while a function declaration can."
prerequisites: [js-03-02-parameters-default-rest, js-02-07-var-hoisting-tdz]
subskills:
  - { family: J-04, skill: "return and arrow syntax", depth: practice }
glossary: [arrow-function, implicit-return, function-expression]
selfCheck: [what-arrows-return, before-its-line, rewrite-as-arrows]

blocks:
  - id: function-values
    kind: explanation
    title:
      uk: "Функція як значення і стрілковий запис"
      en: "A function as a value, and the arrow form"
    body:
      uk: |
        Функцію можна не лише оголосити, а й створити як **значення** і зберегти в `const` — це [[function-expression|функціональний вираз]]:

        ```js
        const double = function (n) {
          return n * 2;
        };
        ```

        Коротший запис такого значення — [[arrow-function|стрілкова функція]]:

        ```js
        const double = (n) => {
          return n * 2;
        };
        ```

        Якщо тіло — один вираз, фігурні дужки й `return` можна прибрати: значення виразу повернеться саме. Це [[implicit-return|неявне повернення]]:

        ```js
        const double = (n) => n * 2;
        ```

        Правило одне: **без фігурних дужок** після `=>` стоїть один вираз, і він повертається. **З дужками** — блок інструкцій, і без `return` функція поверне `undefined`.
      en: |
        A function can be not only declared but also created as a **value** and stored in a `const` — a [[function-expression|function expression]]:

        ```js
        const double = function (n) {
          return n * 2;
        };
        ```

        A shorter way to write such a value is an [[arrow-function|arrow function]]:

        ```js
        const double = (n) => {
          return n * 2;
        };
        ```

        When the body is a single expression, the curly braces and `return` can go: the value of the expression is returned by itself. That is an [[implicit-return|implicit return]]:

        ```js
        const double = (n) => n * 2;
        ```

        One rule: **without curly braces** after `=>` there is one expression, and it is returned. **With braces** there is a block of statements, and without `return` the function gives `undefined`.

  - id: what-arrows-return
    kind: prediction
    prompt:
      uk: "Чотири стрілкові функції відрізняються лише дужками. Що з’явиться в консолі?"
      en: "Four arrow functions differ only in their brackets. What appears in the console?"
    code: |
      const double = (n) => n * 2;
      const doubleBlock = (n) => { n * 2; };
      const makeItem = () => { price: 1 };
      const makeItemFixed = () => ({ price: 1 });

      console.log(double(4));
      console.log(doubleBlock(4));
      console.log(makeItem());
      console.log(makeItemFixed().price);
    verify:
      logs: ["8", "undefined", "undefined", "1"]
    answer:
      type: choice
      options:
        - id: braces-are-blocks
          text: { uk: "`8`, `undefined`, `undefined`, `1`", en: "`8`, `undefined`, `undefined`, `1`" }
        - id: last-expression-returned
          text: { uk: "`8`, `8`, `{price: 1}`, `1`", en: "`8`, `8`, `{price: 1}`, `1`" }
          why:
            uk: "З фігурними дужками тіло — блок: без `return` функція нічого не повертає, навіть якщо всередині стоїть вираз. А `{ price: 1 }` одразу після `=>` теж прочитано як блок, не як об’єкт."
            en: "With curly braces the body is a block: without `return` the function returns nothing, even if there is an expression inside. And `{ price: 1 }` right after `=>` is also read as a block, not as an object."
        - id: block-returns
          text: { uk: "`8`, `8`, `undefined`, `1`", en: "`8`, `8`, `undefined`, `1`" }
          why:
            uk: "`doubleBlock` має фігурні дужки, отже — блок без `return`. Блок не повертає свій «останній вираз» автоматично."
            en: "`doubleBlock` has curly braces, so it is a block without `return`. A block does not return its “last expression” automatically."
        - id: object-returned
          text: { uk: "`8`, `undefined`, `{price: 1}`, `1`", en: "`8`, `undefined`, `{price: 1}`, `1`" }
          why:
            uk: "Фігурна дужка одразу після `=>` завжди починає блок. Усередині нього JavaScript читає `price:` не як властивість об’єкта, а як рідко вживану «мітку» інструкції, а `1` — як окремий вираз. Блок без `return` дає `undefined`. Щоб повернути об’єкт, його беруть у круглі дужки, як у `makeItemFixed`."
            en: "A curly brace right after `=>` always starts a block. Inside it JavaScript reads `price:` not as an object property but as a rarely used statement “label”, and `1` as a separate expression. A block without `return` gives `undefined`. To return an object, wrap it in parentheses, as in `makeItemFixed`."
      correct: [braces-are-blocks]
    explanation:
      uk: "`double` повертає вираз без дужок — `8`. `doubleBlock` має блок без `return` — `undefined`. `makeItem` теж має блок: `{ price: 1 }` після `=>` прочитано як блок, а не як об’єкт, — `undefined`. У `makeItemFixed` круглі дужки кажуть «тут вираз», і функція повертає об’єкт, у якого `price` дорівнює `1`."
      en: "`double` returns an expression without braces — `8`. `doubleBlock` has a block without `return` — `undefined`. `makeItem` has a block too: `{ price: 1 }` after `=>` is read as a block, not as an object — `undefined`. In `makeItemFixed` the parentheses say “this is an expression”, and the function returns an object whose `price` is `1`."

  - id: arrow-lab
    kind: example
    runtime: browser-js
    dir: arrow-lab
    entry: index.js
    strings:
      uah: { uk: "грн", en: "UAH" }
    title:
      uk: "Три стрілкові функції"
      en: "Three arrow functions"
    body:
      uk: |
        `addFee` повертає вираз неявно, `formatTotal` має блок із `return`, а `makeItem` мала б повертати об’єкт, але повертає `undefined`. Натисни **Запустити** й порівняй три рядки в консолі.
      en: |
        `addFee` returns an expression implicitly, `formatTotal` has a block with `return`, and `makeItem` should return an object but returns `undefined`. Press **Run** and compare the three console lines.
    tryIt:
      uk: "Візьми об’єкт у `makeItem` у круглі дужки: `(price) => ({ price: price })` — тепер консоль покаже об’єкт. Потім прибери `return` у `formatTotal` і запусти: з’явиться `undefined`. Поверни `return` і перепиши `addFee` з блоком: `(price) => { return price + 10; }` — результат той самий."
      en: "Wrap the object in `makeItem` in parentheses: `(price) => ({ price: price })` — now the console shows an object. Then remove `return` in `formatTotal` and run: `undefined` appears. Put `return` back and rewrite `addFee` with a block: `(price) => { return price + 10; }` — the result is the same."

  - id: recall
    kind: review
    title:
      uk: "Згадай: вирази й TDZ"
      en: "Recall: expressions and the TDZ"
    strings:
      noPrice: { uk: "Без ціни", en: "No price" }
      pricePrefix: { uk: "Ціна: ", en: "Price: " }
    items:
      - id: ternary-is-expression
        from: js-02-03-truthiness-logic-ternary
        prompt:
          uk: "Що з цього можна поставити праворуч від `const label =`?"
          en: "Which of these can stand to the right of `const label =`?"
        answer:
          type: choice
          options:
            - id: ternary
              code: 'price === null ? "%%noPrice%%" : "%%pricePrefix%%" + price'
            - id: if-statement
              code: 'if (price === null) { "%%noPrice%%" } else { "%%pricePrefix%%" + price }'
              why:
                uk: "`if` — інструкція, а не вираз: вона керує тим, що виконується, але сама не має значення, тож її не можна присвоїти змінній."
                en: "`if` is a statement, not an expression: it controls what runs but has no value of its own, so it cannot be assigned to a variable."
          correct: [ternary]
        explanation:
          uk: "Тернарний оператор — це **вираз**: він обчислюється в одне значення, тому його можна присвоїти, передати в `console.log` чи повернути. Саме тому тернарний оператор може бути тілом стрілкової функції з неявним поверненням, а `if` — ні."
          en: "The ternary is an **expression**: it evaluates to one value, so it can be assigned, passed to `console.log` or returned. That is why a ternary can be the body of an arrow function with an implicit return, while an `if` cannot."
      - id: const-before-line
        from: js-02-07-var-hoisting-tdz
        prompt:
          uk: "Що станеться, коли ця програма запуститься?"
          en: "What happens when this program runs?"
        code: |
          console.log(total);
          const total = 120;
        verify:
          logs: []
          error: ReferenceError
        answer:
          type: choice
          options:
            - id: reference-error
              text:
                uk: "`ReferenceError`: до `total` не можна звертатися раніше за її рядок"
                en: "A `ReferenceError`: `total` cannot be accessed before its line"
            - id: prints-undefined
              text: { uk: "Виведе `undefined`", en: "It prints `undefined`" }
              why:
                uk: "Так поводився б `var`. Змінна `const` до свого рядка перебуває в TDZ, і звертання до неї — помилка."
                en: "That is how `var` would behave. A `const` is in the TDZ until its line, and accessing it is an error."
            - id: prints-value
              text: { uk: "Виведе `120`", en: "It prints `120`" }
              why:
                uk: "Підняття не переносить значення вгору: рядок `const total = 120` ще не виконався."
                en: "Hoisting does not move the value up: the line `const total = 120` has not run yet."
          correct: [reference-error]
        explanation:
          uk: "Від початку файла до рядка з `const` змінна вже існує, але ще не ініціалізована — це [[temporal-dead-zone|TDZ]]. Звертання до неї в цей час кидає `ReferenceError`. За хвилину це правило стосуватиметься й функцій."
          en: "From the start of the file to the `const` line the variable already exists but is not initialized — that is the [[temporal-dead-zone|TDZ]]. Accessing it during that time throws a `ReferenceError`. In a moment the same rule will apply to functions."

  - id: before-its-line
    kind: prediction
    prompt:
      uk: "Обидві функції викликано вище за місце, де їх створено. Що станеться?"
      en: "Both functions are called above the place where they are created. What happens?"
    code: |
      console.log(half(10));
      console.log(twice(10));

      function half(n) {
        return n / 2;
      }

      const twice = (n) => n * 2;
    verify:
      logs: ["5"]
      error: ReferenceError
    answer:
      type: choice
      options:
        - id: declaration-only
          text:
            uk: "`5`, а потім `ReferenceError` на другому рядку"
            en: "`5`, then a `ReferenceError` on the second line"
        - id: both-work
          text: { uk: "`5` і `20`", en: "`5` and `20`" }
          why:
            uk: "`twice` — це змінна `const`. До свого рядка вона в TDZ, хоч і зберігатиме функцію."
            en: "`twice` is a `const`. Until its line it is in the TDZ, even though it will hold a function."
        - id: both-fail
          text:
            uk: "`ReferenceError` уже на першому рядку, нічого не виведено"
            en: "A `ReferenceError` on the very first line, nothing printed"
          why:
            uk: "Оголошення `function half` JavaScript готує ще до виконання першого рядка, тому `half` можна викликати вище за оголошення."
            en: "JavaScript prepares the declaration `function half` before the first line runs, so `half` can be called above it."
        - id: type-error
          text:
            uk: "`5`, а потім `TypeError: twice is not a function`"
            en: "`5`, then `TypeError: twice is not a function`"
          why:
            uk: "Так було б із `var twice = …`: змінна вже існувала б зі значенням `undefined`. Звертання до `const` у TDZ дає саме `ReferenceError`."
            en: "That is what `var twice = …` would give: the variable would already exist as `undefined`. Accessing a `const` in the TDZ gives a `ReferenceError`."
      correct: [declaration-only]
    explanation:
      uk: "Оголошення `function half(…)` готове з самого початку, тож перший рядок працює. А `twice` — звичайна змінна `const`, яка вказує на функцію. До рядка `const twice = …` вона в TDZ, тому другий рядок кидає `ReferenceError: Cannot access 'twice' before initialization`. Правило: стрілкову функцію з `const` викликай лише нижче за її рядок."
      en: "The declaration `function half(…)` is ready from the very start, so the first line works. `twice` is an ordinary `const` that points at a function. Until the line `const twice = …` it is in the TDZ, so the second line throws `ReferenceError: Cannot access 'twice' before initialization`. The rule: call an arrow function stored in a `const` only below its line."

  - id: rewrite-as-arrows
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: rewrite-as-arrows
    entry: index.js
    strings:
      pricePrefix: { uk: "Ціна: ", en: "Price: " }
      noPrice: { uk: "Без ціни", en: "No price" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      pcs: { uk: "шт.", en: "pcs" }
    title:
      uk: "Перепиши стрілками"
      en: "Rewrite them as arrows"
    instructions:
      uk: |
        Тут `formatPrice` і `makeLabel` з попередніх уроків, оголошені через `function`. Перепиши обидві як стрілкові функції в `const`.

        - Де тіло може бути одним виразом (тернарний оператор теж підходить), використай неявне повернення.
        - Значення за замовчуванням для `unit` має залишитися.
        - Програма має виводити ті самі три рядки, що й зараз.

        Після кожної зміни запускай програму. Якщо побачиш помилку, прочитай її уважно: вона стосується однієї з тем цього уроку.
      en: |
        Here are `formatPrice` and `makeLabel` from the previous lessons, declared with `function`. Rewrite both as arrow functions in `const`.

        - Where the body can be one expression (a ternary counts), use an implicit return.
        - The default value for `unit` has to stay.
        - The program must print the same three lines as now.

        Run the program after every change. If you see an error, read it carefully: it is about one of the topics of this lesson.
    testTitles:
      "runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without errors"
      "formatPrice is an arrow function":
        uk: "formatPrice — стрілкова функція"
        en: "formatPrice is an arrow function"
      "makeLabel is an arrow function":
        uk: "makeLabel — стрілкова функція"
        en: "makeLabel is an arrow function"
      "formatPrice returns the same labels":
        uk: "formatPrice повертає ті самі підписи"
        en: "formatPrice returns the same labels"
      "makeLabel keeps its default unit":
        uk: "makeLabel зберегла одиницю за замовчуванням"
        en: "makeLabel keeps its default unit"
      "prints the same three lines":
        uk: "Виводить ті самі три рядки"
        en: "Prints the same three lines"
    hints:
      nudge:
        uk: "Почни з `makeLabel`: її тіло — один вираз. Як записати функцію-значення в `const` без фігурних дужок?"
        en: "Start with `makeLabel`: its body is one expression. How do you write a function value in a `const` without curly braces?"
      explanation:
        uk: "Порівняй два записи однієї функції: `function greet(name, greeting = \"Привіт\") { return greeting + \", \" + name; }` і `const greet = (name, greeting = \"Привіт\") => greeting + \", \" + name;`. Значення за замовчуванням лишилося в дужках, а фігурні дужки й `return` зникли. У `formatPrice` `if` із двома `return` можна злити в один тернарний вираз. І пам’ятай: до свого рядка стрілкова функція в `const` перебуває в TDZ, тож виклики мають стояти нижче."
        en: "Compare two ways of writing one function: `function greet(name, greeting = \"Hello\") { return greeting + \", \" + name; }` and `const greet = (name, greeting = \"Hello\") => greeting + \", \" + name;`. The default stayed in the brackets, while the curly braces and `return` are gone. In `formatPrice` the `if` with two `return`s can be merged into one ternary expression. And remember: until its line, an arrow function in a `const` is in the TDZ, so the calls must stand below it."
    solutionNote:
      uk: "Обидва тіла стали одним виразом, тому фігурні дужки й `return` не потрібні. Виклики переїхали нижче: оголошення `function` було готове з самого початку, а `const` до свого рядка в TDZ. Блок із `return` у `formatPrice` теж правильний — неявне повернення лише коротше."
      en: "Both bodies became a single expression, so the curly braces and `return` are not needed. The calls moved down: a `function` declaration was ready from the start, while a `const` is in the TDZ until its line. A block with `return` in `formatPrice` is correct too — an implicit return is just shorter."
    feedback:
      - when: { error: ReferenceError }
        message:
          uk: "Якщо в повідомленні `Cannot access … before initialization`, функцію викликають раніше, ніж виконався рядок її `const` (TDZ): оголошення `function` працювали вище за себе, а `const` — ні. Перенеси виклики `console.log` нижче за функції. Якщо ж там `… is not defined`, звір написання назви."
          en: "If the message says `Cannot access … before initialization`, the function is called before the line of its `const` has run (TDZ): the `function` declarations worked above themselves, a `const` does not. Move the `console.log` calls below the functions. If it says `… is not defined`, check how the name is spelled."
      - when: { test: "formatPrice returns the same labels" }
        message:
          uk: "Якщо виходить `undefined`, перевір дужки: з `{ }` після `=>` потрібен `return`; без дужок повертається єдиний вираз."
          en: "If you get `undefined`, check the braces: with `{ }` after `=>` you need `return`; without braces the single expression is returned."
      - when: { test: "formatPrice is an arrow function" }
        message:
          uk: "`formatPrice` має стати стрілковою функцією, збереженою в `const`. Якщо ти це вже зробив, а програма зупиняється з помилкою, перевірка не дістається до функції — спершу виправ помилку."
          en: "`formatPrice` must become an arrow function stored in a `const`. If you have done that and the program stops with an error, the check cannot reach the function — fix the error first."
      - when: { test: "makeLabel is an arrow function" }
        message:
          uk: "`makeLabel` має стати стрілковою функцією в `const`, а значення за замовчуванням для `unit` лишається в дужках із параметрами. Якщо ти це вже зробив, а програма зупиняється з помилкою, спершу виправ помилку."
          en: "`makeLabel` must become an arrow function in a `const`, and the default for `unit` stays in the parameter brackets. If you have done that and the program stops with an error, fix the error first."

  - id: to-project
    kind: transfer
    capstoneStep: JS-03
    body:
      uk: "У проєкті короткі функції форматування зручно писати стрілками з неявним поверненням. Пам’ятай про порядок у файлі: спершу `const` з функцією, потім код сторінки, який її викликає."
      en: "In the project, short formatting functions are handy as arrows with an implicit return. Mind the order in the file: first the `const` with the function, then the page code that calls it."
