id: js-03-01-functions-and-return
unit: JS-03
title:
  uk: "Функції: оголошуємо, викликаємо, повертаємо"
  en: "Functions: define, call, return"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Оголосити функцію з одним параметром і викликати її з різними аргументами."
    en: "Define a function with one parameter and call it with different arguments."
  - uk: "Передбачити, чому дорівнює виклик, коли функція повертає значення, лише друкує його або не має `return` (`undefined`)."
    en: "Predict what a call evaluates to when the function returns a value, only logs it, or has no return (`undefined`)."
  - uk: "Пояснити, чому рядки після `return` не виконуються."
    en: "Explain why the lines after a `return` statement do not run."
prerequisites: [js-02-01-const-let, js-02-05-if-else-switch]
subskills:
  - { family: J-04, skill: "return and arrow syntax", depth: intro }
glossary: [function, parameter, argument, return-value, call-frame]
selfCheck: [when-it-runs, format-price]

blocks:
  - id: named-instructions
    kind: explanation
    title:
      uk: "Функція — інструкції під іменем"
      en: "A function is instructions with a name"
    body:
      uk: |
        Ти викликаєш [[function|функції]] з першого уроку: `console.log("…")` — це виклик функції, яку хтось уже написав. Тепер напишемо власну:

        ```js
        function double(n) {
          return n * 2;
        }
        ```

        - `function double` створює функцію з іменем `double`.
        - `n` у дужках — [[parameter|параметр]]: ім’я для значення, яке функція отримає.
        - У фігурних дужках — тіло функції. `return` віддає результат назад.

        Оголошення лише **запам’ятовує** інструкції. Виконуються вони тоді, коли функцію **викликають**: `double(4)`. Значення в дужках виклику — [[argument|аргумент]]: параметр `n` отримає `4`, а сам виклик стане значенням `8` — тим, що [[return-value|повернула функція]]. Тому виклик можна вставити в більший вираз: `double(4) + 1` дає `9`.
      en: |
        You have been calling [[function|functions]] since the first lesson: `console.log("…")` is a call of a function somebody already wrote. Now let’s write our own:

        ```js
        function double(n) {
          return n * 2;
        }
        ```

        - `function double` creates a function named `double`.
        - `n` in the brackets is a [[parameter]]: a name for the value the function will receive.
        - The curly braces hold the body. `return` hands the result back.

        A definition only **stores** the instructions. They run when the function is **called**: `double(4)`. The value in the brackets of the call is an [[argument]]: the parameter `n` gets `4`, and the call itself becomes the value `8` — the [[return-value|return value]]. That is why a call can sit inside a bigger expression: `double(4) + 1` gives `9`.

  - id: when-it-runs
    kind: prediction
    strings:
      start: { uk: "Старт", en: "Start" }
      calc: { uk: "Рахую", en: "Calculating" }
    prompt:
      uk: "Функція `double` щось друкує і щось повертає. Що з’явиться в консолі?"
      en: "The function `double` prints something and returns something. What appears in the console?"
    code: |
      function double(n) {
        console.log("%%calc%% " + n);
        return n * 2;
      }

      console.log("%%start%%");
      double(5);
      console.log(double(3));
    verify:
      logs: ["%%start%%", "%%calc%% 5", "%%calc%% 3", "6"]
    answer:
      type: choice
      options:
        - id: calls-only
          text:
            uk: "«Старт», «Рахую 5», «Рахую 3», `6`"
            en: "“Start”, “Calculating 5”, “Calculating 3”, `6`"
        - id: runs-when-defined
          text:
            uk: "Спершу рядок «Рахую …» від оголошення функції, а потім «Старт», «Рахую 5», «Рахую 3», `6`"
            en: "First a “Calculating …” line from the function definition, then “Start”, “Calculating 5”, “Calculating 3”, `6`"
          why:
            uk: "Оголошення лише запам’ятовує інструкції під іменем `double`. Тіло виконується тільки під час виклику, а перший виклик стоїть після «Старт»."
            en: "The definition only stores the instructions under the name `double`. The body runs only when the function is called, and the first call comes after “Start”."
        - id: return-prints
          text:
            uk: "«Старт», «Рахую 5», `10`, «Рахую 3», `6`"
            en: "“Start”, “Calculating 5”, `10`, “Calculating 3”, `6`"
          why:
            uk: "`return` нічого не друкує: він віддає значення туди, де стоїть виклик. Рядок `double(5);` нікуди це значення не передає, тож `10` просто зникає."
            en: "`return` prints nothing: it hands the value back to the place of the call. The line `double(5);` does nothing with that value, so `10` is simply lost."
        - id: unused-call-skipped
          text:
            uk: "«Старт», «Рахую 3», `6`"
            en: "“Start”, “Calculating 3”, `6`"
          why:
            uk: "`double(5);` — справжній виклик: тіло виконується і друкує «Рахую 5». Результат ніхто не використав, але сама робота відбулася."
            en: "`double(5);` is a real call: the body runs and prints “Calculating 5”. Nobody uses the result, but the work still happens."
      correct: [calls-only]
    explanation:
      uk: "Оголошення функції нічого не виконує. Виклик `double(5)` запускає тіло: друкується «Рахую 5», а `return` віддає `10` у рядок, який це значення ніде не використовує. Виклик `double(3)` стоїть усередині `console.log(...)`: тіло друкує «Рахую 3», `return` віддає `6`, і вже `console.log` виводить це значення."
      en: "Defining a function runs nothing. The call `double(5)` runs the body: “Calculating 5” is printed and `return` hands `10` back to a line that does not use it. The call `double(3)` sits inside `console.log(...)`: the body prints “Calculating 3”, `return` hands back `6`, and then `console.log` prints that value."

  - id: first-function
    kind: example
    runtime: browser-js
    dir: first-function
    entry: index.js
    strings:
      pricePrefix: { uk: "Ціна: ", en: "Price: " }
      headphones: { uk: "Навушники", en: "Headphones" }
    title:
      uk: "Функція, що повертає підпис"
      en: "A function that returns a label"
    body:
      uk: |
        `formatPrice` отримує ціну й повертає готовий текст. Повернене значення можна зберегти в змінній, як `lampLabel`, або одразу вставити в більший вираз, як в останньому рядку. Натисни **Запустити** й подивись у **Консоль**.
      en: |
        `formatPrice` receives a price and returns ready-made text. The returned value can be stored in a variable, like `lampLabel`, or put straight into a bigger expression, as on the last line. Press **Run** and look at the **Console**.
    tryIt:
      uk: "Видали слово `return` (решту рядка залиш) і запусти знову: в обох рядках з’явиться `undefined`. Функція й далі обчислює текст, але нікому його не віддає. Поверни `return` на місце й виклич `formatPrice` зі своєю ціною."
      en: "Delete the word `return` (keep the rest of the line) and run again: `undefined` appears in both lines. The function still builds the text but hands it to nobody. Put `return` back and call `formatPrice` with a price of your own."

  - id: recall
    kind: review
    title:
      uk: "Згадай: порядок дій"
      en: "Recall: order of operations"
    items:
      - id: call-in-expression
        from: js-01-03-arithmetic-precedence
        prompt:
          uk: "Виклик функції — це вираз зі значенням, тож він підкоряється тим самим правилам порядку дій. Що виведе останній рядок?"
          en: "A function call is an expression with a value, so it follows the same order-of-operations rules. What does the last line print?"
        code: |
          function double(n) {
            return n * 2;
          }

          console.log(1 + double(2) * 3);
        verify:
          logs: ["13"]
        answer:
          type: choice
          options:
            - id: thirteen
              text: { uk: "`13`", en: "`13`" }
            - id: left-to-right
              text: { uk: "`15`", en: "`15`" }
              why:
                uk: "Множення виконується раніше за додавання, навіть якщо стоїть правіше. Після виклику маємо `1 + 4 * 3`, тобто `1 + 12`."
                en: "Multiplication goes before addition, even when it stands further right. After the call we have `1 + 4 * 3`, that is `1 + 12`."
            - id: doubles-the-rest
              text: { uk: "`14`", en: "`14`" }
              why:
                uk: "`double(2)` подвоює лише свій аргумент `2` і дає `4`. Решту виразу виклик не чіпає."
                en: "`double(2)` doubles only its argument `2` and gives `4`. The call does not touch the rest of the expression."
          correct: [thirteen]
        explanation:
          uk: "Спершу обчислюється виклик: `double(2)` дає `4`. Далі звичний порядок дій: множення `4 * 3` дає `12`, а `1 + 12` — це `13`. Значення виклику стає частиною більшого виразу так само, як будь-яке число."
          en: "The call is evaluated first: `double(2)` gives `4`. Then the usual order of operations: the multiplication `4 * 3` gives `12`, and `1 + 12` is `13`. The value of a call becomes part of a bigger expression just like any number."

  - id: return-ends-the-call
    kind: explanation
    title:
      uk: "return віддає значення і завершує виклик"
      en: "return hands back a value and ends the call"
    body:
      uk: |
        Для кожного виклику JavaScript створює окремий робочий простір — [[call-frame|кадр виклику]], де живуть параметри цього виклику. `return` віддає значення в місце виклику і прибирає кадр: виклик завершено, тож рядки функції нижче вже не виконуються. Тому часто обходяться без `else`:

        ```js
        function formatDue(dueDate) {
          if (dueDate === null) {
            return "Без терміну";
          }
          return "Термін: " + dueDate;
        }
        ```

        Якщо `dueDate` дорівнює `null`, перший `return` завершує виклик, і до другого справа не доходить.

        А якщо функція дійшла до кінця, не зустрівши `return`, виклик дає `undefined`. `console.log` усередині функції — це вивід у консоль, а не результат: друкувати й повертати — різні речі.
      en: |
        For every call JavaScript creates a separate workspace — a [[call-frame|call frame]] — holding the parameters of that call. `return` hands the value back to the place of the call and removes the frame: the call is over, so the lines of the function below it do not run. That is why `else` is often unnecessary:

        ```js
        function formatDue(dueDate) {
          if (dueDate === null) {
            return "No due date";
          }
          return "Due: " + dueDate;
        }
        ```

        When `dueDate` is `null`, the first `return` ends the call and the second one is never reached.

        And if a function reaches its end without meeting a `return`, the call gives `undefined`. A `console.log` inside a function is output to the console, not a result: printing and returning are different things.

  - id: call-steps
    kind: visual
    visual: code-trace
    title:
      uk: "Крок за кроком: виклик formatPrice(80)"
      en: "Step by step: the call formatPrice(80)"
    textEquivalent:
      uk: "Програма починає з рядка 6: функція formatPrice уже оголошена, але ще не виконувалася, а label ще не має значення. Виклик formatPrice(80) кладе в стек викликів новий кадр, у якому параметр price дорівнює 80, а рядок 6 чекає на результат. У тілі функції створюється локальна змінна text зі значенням \"80 UAH\". Рядок return віддає цей текст у місце виклику і нічого не друкує; кадр formatPrice зникає. Повернений текст потрапляє в label, і лише console.log на рядку 7 виводить у консоль 80 UAH."
      en: "The program starts at line 6: the function formatPrice is already defined but has not run yet, and label has no value yet. The call formatPrice(80) puts a new frame on the call stack in which the parameter price is 80, while line 6 waits for the result. In the body a local variable text gets the value \"80 UAH\". The return line hands this text back to the place of the call and prints nothing; the formatPrice frame disappears. The returned text lands in label, and only console.log on line 7 prints 80 UAH to the console."
    spec:
      file: visuals/format-price.js
      steps: all
      captions:
        - at: { line: 6 }
          text:
            uk: "Програма починає з рядка 6. Функція `formatPrice` уже існує: оголошення запам’ятало її інструкції, але ще не виконало їх. `label` поки **uninitialized**. У **Call stack** — лише сам файл."
            en: "The program starts at line 6. The function `formatPrice` already exists: the definition stored its instructions but did not run them. `label` is still **uninitialized**. The **Call stack** holds only the file itself."
        - at: { line: 1, kind: call }
          text:
            uk: "Виклик `formatPrice(80)` кладе на стек викликів **новий кадр**. У ньому параметр `price` отримав аргумент `80`. Рядок 6 чекає на результат."
            en: "The call `formatPrice(80)` puts a **new frame** on the call stack. In it the parameter `price` received the argument `80`. Line 6 waits for the result."
        - at: { line: 2 }
          text:
            uk: "Виконання перейшло в тіло функції. `text` — локальна змінна саме цього виклику; поза кадром її не видно."
            en: "Execution has moved into the body. `text` is a local variable of this very call; it is not visible outside the frame."
        - at: { line: 3, kind: return }
          text:
            uk: "`return` віддає `\"80 UAH\"` у місце виклику. У **Console** порожньо: `return` нічого не друкує."
            en: "`return` hands `\"80 UAH\"` back to the place of the call. The **Console** is empty: `return` prints nothing."
        - at: { line: 7 }
          text:
            uk: "Кадр `formatPrice` зник — виклик завершено. Значення виклику опинилося в `label`."
            en: "The `formatPrice` frame is gone — the call is over. The value of the call ended up in `label`."
        - at: { line: 7, kind: end }
          text:
            uk: "`console.log(label)` вивів `80 UAH`. Друкує лише `console.log`, не `return`."
            en: "`console.log(label)` printed `80 UAH`. Only `console.log` prints, not `return`."

  - id: print-or-return
    kind: prediction
    strings:
      noDue: { uk: "Без терміну", en: "No due date" }
      checking: { uk: "Перевіряю дату", en: "Checking the date" }
    prompt:
      uk: "Ця функція в одному випадку повертає значення, а в іншому — лише друкує. Що з’явиться в консолі?"
      en: "In one case this function returns a value, in the other it only prints. What appears in the console?"
    code: |
      function describeDue(dueDate) {
        if (dueDate === null) {
          return "%%noDue%%";
        }
        console.log("%%checking%%");
      }

      console.log(describeDue(null));
      console.log(describeDue("2026-03-02"));
    verify:
      logs: ["%%noDue%%", "%%checking%%", "undefined"]
    answer:
      type: choice
      options:
        - id: correct
          text:
            uk: "«Без терміну», «Перевіряю дату», `undefined`"
            en: "“No due date”, “Checking the date”, `undefined`"
        - id: past-return
          text:
            uk: "«Перевіряю дату», «Без терміну», «Перевіряю дату», `undefined`"
            en: "“Checking the date”, “No due date”, “Checking the date”, `undefined`"
          why:
            uk: "Виконаний `return` одразу завершує виклик: для `null` рядок із `console.log` нижче вже не виконується."
            en: "A `return` that runs ends the call at once: for `null` the `console.log` line below it never runs."
        - id: log-is-result
          text:
            uk: "«Без терміну», «Перевіряю дату», «Перевіряю дату»"
            en: "“No due date”, “Checking the date”, “Checking the date”"
          why:
            uk: "`console.log` усередині функції друкує, але нічого не повертає. Другий виклик закінчився без `return`, тож його значення — `undefined`, і саме його виводить зовнішній `console.log`."
            en: "A `console.log` inside the function prints but returns nothing. The second call ended without `return`, so its value is `undefined`, and that is what the outer `console.log` prints."
        - id: returns-argument
          text:
            uk: "«Без терміну», «Перевіряю дату», `2026-03-02`"
            en: "“No due date”, “Checking the date”, `2026-03-02`"
          why:
            uk: "Функція не повертає свій аргумент сама собою. Без `return` виклик завжди дає `undefined`."
            en: "A function does not hand back its argument by itself. Without `return` a call always gives `undefined`."
      correct: [correct]
    explanation:
      uk: "Перший виклик: `dueDate` — `null`, тож виконується `return`, виклик завершується, і зовнішній `console.log` друкує «Без терміну». Другий виклик: умова хибна, функція друкує «Перевіряю дату» й доходить до кінця без `return`, тому виклик дає `undefined` — його теж видно в консолі."
      en: "First call: `dueDate` is `null`, so the `return` runs, the call ends, and the outer `console.log` prints “No due date”. Second call: the condition is false, the function prints “Checking the date” and reaches its end without `return`, so the call gives `undefined` — which is printed too."

  - id: format-price
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: format-price
    entry: index.js
    strings:
      pricePrefix: { uk: "Ціна: ", en: "Price: " }
      noPrice: { uk: "Без ціни", en: "No price" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
    title:
      uk: "Ціна або «Без ціни»"
      en: "A price or “No price”"
    instructions:
      uk: |
        У списку бажань є речі без ціни: для них `price` дорівнює `null`. Зараз `formatPrice(null)` повертає безглузде «Ціна: null».

        Зміни `formatPrice` через `if`/`else` так, щоб вона **повертала**:
        - «Ціна: 80» для ціни `80` (і так само для будь-якої іншої ціни, зокрема `0`);
        - «Без ціни», коли ціна — `null`.

        Нижче функції вже є два місця, які використовують повернений текст. Їх не змінюй. Сама функція нічого не друкує.
      en: |
        The wishlist has things without a price: for them `price` is `null`. Right now `formatPrice(null)` returns a meaningless “Price: null”.

        Change `formatPrice` with `if`/`else` so that it **returns**:
        - “Price: 80” for the price `80` (and the same for any other price, including `0`);
        - “No price” when the price is `null`.

        Below the function there are already two places that use the returned text. Leave them as they are. The function itself prints nothing.
    testTitles:
      "runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without errors"
      "returns the price label":
        uk: "Для ціни повертає «Ціна: …»"
        en: "Returns “Price: …” for a price"
      "returns No price for null":
        uk: "Для null повертає «Без ціни»"
        en: "Returns “No price” for null"
      "keeps a price of 0":
        uk: "Ціна 0 — теж ціна"
        en: "A price of 0 is still a price"
      "returns the label instead of printing it":
        uk: "Функція повертає текст, а не друкує його"
        en: "The function returns the text instead of printing it"
      "the page script prints both labels":
        uk: "Програма виводить обидва підписи"
        en: "The program prints both labels"
    hints:
      nudge:
        uk: "Подивись на `formatDue` у поясненні вище: яка умова там перевіряє відсутнє значення?"
        en: "Look at `formatDue` in the explanation above: which condition checks for a missing value there?"
      explanation:
        uk: "Додай `if (price === null) { … } else { … }`. В одній гілці поверни «Без ціни», в іншій — «Ціна: » + `price`. Кожна гілка має закінчуватися `return`, інакше виклик дасть `undefined`."
        en: "Add `if (price === null) { … } else { … }`. Return “No price” in one branch and “Price: ” + `price` in the other. Each branch must end with `return`, otherwise the call gives `undefined`."
    solutionNote:
      uk: "`if` вибирає, який `return` виконається, а `return` віддає готовий текст у місце виклику. Тому той самий результат можна і зберегти в змінній, і вставити в довший рядок. Перевірка `price === null` не плутає відсутню ціну з ціною `0`."
      en: "`if` chooses which `return` runs, and `return` hands the finished text back to the place of the call. That is why the same result can be stored in a variable or put into a longer string. The check `price === null` does not confuse a missing price with a price of `0`."
    feedback:
      - when: { test: "returns the price label" }
        message:
          uk: "Для звичайної ціни функція має **повернути** «Ціна: …». Якщо в гілці стоїть `console.log` замість `return`, виклик дає `undefined`."
          en: "For a normal price the function must **return** “Price: …”. If a branch has `console.log` instead of `return`, the call gives `undefined`."
      - when: { test: "returns No price for null" }
        message:
          uk: "Для `null` функція має повернути «Без ціни». Перевір умову: `price === null`, і що в цій гілці стоїть `return`."
          en: "For `null` the function must return “No price”. Check the condition `price === null` and that this branch has a `return`."
      - when: { test: "keeps a price of 0" }
        message:
          uk: "`0` — справжня ціна (річ безкоштовна), а не відсутня. Умова `!price` спрацьовує і для `0`, тому перевіряй саме `price === null`."
          en: "`0` is a real price (the thing is free), not a missing one. The condition `!price` is also true for `0`, so check exactly `price === null`."
      - when: { test: "returns the label instead of printing it" }
        message:
          uk: "Усередині `formatPrice` не має бути `console.log`: функція лише повертає текст, а друкує той, хто її викликав."
          en: "There must be no `console.log` inside `formatPrice`: the function only returns the text, and whoever called it does the printing."

  - id: to-project
    kind: transfer
    capstoneStep: JS-03
    body:
      uk: "У кроці проєкту цього розділу код, що будує підписи твого проєкту, переїде в іменовані функції, які **повертають** текст, — так само, як `formatPrice`. Сторінка лише викликатиме їх і показуватиме результат."
      en: "In this unit’s project step, the code that builds your project’s labels moves into named functions that **return** text — just like `formatPrice`. The page will only call them and show the results."
