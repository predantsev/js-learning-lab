id: js-03-07-pure-vs-side-effects
unit: JS-03
title:
  uk: "Чисті функції та побічні ефекти"
  en: "Pure functions and side effects"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Визначити, чи функція чиста: чи залежить вона лише від своїх аргументів і чи нічого не змінює поза собою (вивід, запис на сторінку, зовнішні змінні)."
    en: "Classify a function as pure or impure by checking whether it depends only on its inputs and changes nothing outside itself (logs, page writes, outer variables)."
  - uk: "Переробити функцію, яка читає й змінює зовнішню змінну, на таку, що отримує вхід і повертає вихід."
    en: "Refactor a function that reads and writes an outer variable into one that takes input and returns output."
  - uk: "Пояснити, чому чисті функції легше перевіряти й використовувати повторно і де все ж мають бути побічні ефекти."
    en: "Explain why pure functions are easier to test and reuse, and where side effects still belong."
prerequisites: [js-03-06-higher-order-callbacks, js-02-11-independent-validation]
subskills:
  - { family: J-04, skill: "pure/side effects", depth: intro }
glossary: [pure-function, side-effect, deterministic]
selfCheck: [same-twice, side-effects-needed, split-show-label]

blocks:
  - id: two-kinds-of-work
    kind: explanation
    title:
      uk: "Два види роботи"
      en: "Two kinds of work"
    body:
      uk: |
        Функція може робити два різні види роботи:

        1. **Обчислювати**: отримати аргументи й повернути результат.
        2. **Змінювати щось поза собою**: друкувати в консоль, писати на сторінку, змінювати зовнішню змінну чи переданий об’єкт, зберігати дані. Це [[side-effect|побічні ефекти]].

        Функцію називають [[pure-function|чистою]], якщо виконано обидві умови:

        - з тими самими аргументами вона **завжди** повертає той самий результат — тобто [[deterministic|детермінована]];
        - поза собою вона **нічого не змінює**.

        `(price) => price * 2` — чиста. А функція, яка рахує виклики в зовнішній змінній чи додає до результату поточний час, — ні.
      en: |
        A function can do two different kinds of work:

        1. **Compute**: take arguments and return a result.
        2. **Change something outside itself**: print to the console, write to the page, change an outer variable or a passed object, save data. These are [[side-effect|side effects]].

        A function is called [[pure-function|pure]] when both conditions hold:

        - with the same arguments it **always** returns the same result — it is [[deterministic]];
        - it **changes nothing** outside itself.

        `(price) => price * 2` is pure. A function that counts its calls in an outer variable or adds the current time to its result is not.

  - id: same-twice
    kind: prediction
    strings:
      doubling: { uk: "Подвоюю", en: "Doubling" }
    prompt:
      uk: "Які з цих функцій **гарантовано** повертають той самий результат, коли їх знову викликають з тим самим аргументом — сьогодні, завтра, після будь-якого іншого коду? Познач усі такі."
      en: "Which of these functions are **guaranteed** to return the same result when called again with the same argument — today, tomorrow, after any other code? Mark all of them."
    code: |
      let calls = 0;
      const addCall = (price) => {
        calls = calls + 1;
        return price + calls;
      };

      const stamp = (price) => price + " @ " + Date.now();

      const logDouble = (price) => {
        console.log("%%doubling%% " + price);
        return price * 2;
      };

      const double = (price) => price * 2;

      console.log(addCall(10), addCall(10));
      console.log(logDouble(10), logDouble(10));
      console.log(double(10), double(10));
    verify:
      logs: ["11 12", "%%doubling%% 10", "%%doubling%% 10", "20 20", "20 20"]
    answer:
      type: multi
      options:
        - id: add-call
          text: { uk: "`addCall`", en: "`addCall`" }
          why:
            uk: "`addCall` читає і змінює зовнішню змінну `calls`: другий виклик `addCall(10)` повертає `12`, а не `11`."
            en: "`addCall` reads and changes the outer variable `calls`: the second call `addCall(10)` returns `12`, not `11`."
        - id: stamp
          text: { uk: "`stamp`", en: "`stamp`" }
          why:
            uk: "`stamp` читає годинник: її результат залежить від того, **коли** її викликали, а не лише від `price`."
            en: "`stamp` reads the clock: its result depends on **when** it is called, not only on `price`."
        - id: log-double
          text: { uk: "`logDouble`", en: "`logDouble`" }
        - id: double
          text: { uk: "`double`", en: "`double`" }
      correct: [log-double, double]
    explanation:
      uk: "`double` і `logDouble` з тим самим аргументом завжди повертають те саме. `addCall` залежить від лічильника, який сама ж і змінює, а `stamp` — від годинника. Але одного «того самого результату» замало: `logDouble` ще й друкує, тобто має побічний ефект. Чиста функція виконує обидві умови, тож із чотирьох чиста лише `double`."
      en: "`double` and `logDouble` always return the same for the same argument. `addCall` depends on a counter it changes itself, and `stamp` on the clock. But “the same result” is not enough: `logDouble` also prints, so it has a side effect. A pure function meets both conditions, so of the four only `double` is pure."

  - id: run-twice
    kind: example
    runtime: browser-js
    dir: run-twice
    entry: index.js
    title:
      uk: "Із зовнішньої змінної — у параметр"
      en: "From an outer variable to a parameter"
    body:
      uk: |
        `markDone` позначає звичку виконаною й рахує, скільки разів це сталося сьогодні. Вона читає й змінює зовнішню змінну, тож двічі той самий виклик дає різне. Запусти.
      en: |
        `markDone` marks a habit as done and counts how many times that happened today. It reads and changes an outer variable, so the same call gives different results. Run it.
    tryIt:
      uk: "Зроби `markDone` чистою: дай їй параметр і поверни нове значення — `function markDone(count) { return count + 1; }`. Хай лічильник тримає той, хто викликає: `completedToday = markDone(completedToday);`. Тепер `console.log(markDone(1), markDone(1))` виводить `2 2`."
      en: "Make `markDone` pure: give it a parameter and return the new value — `function markDone(count) { return count + 1; }`. Let the caller keep the counter: `completedToday = markDone(completedToday);`. Now `console.log(markDone(1), markDone(1))` prints `2 2`."

  - id: recall
    kind: review
    title:
      uk: "Згадай: результат перевірки"
      en: "Recall: a validation result"
    items:
      - id: result-not-print
        from: js-02-11-independent-validation
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          function checkName(name) {
            if (name === "") {
              return { ok: false };
            }
            return { ok: true, value: name };
          }

          const result = checkName("");
          console.log(result.ok);
        verify:
          logs: ["false"]
        answer:
          type: choice
          options:
            - id: false-value
              text: { uk: "`false`", en: "`false`" }
            - id: whole-object
              text: { uk: "`{ok: false}`", en: "`{ok: false}`" }
              why:
                uk: "`result.ok` читає одне поле результату — булеве значення `false`, а не весь об’єкт."
                en: "`result.ok` reads one field of the result — the boolean `false`, not the whole object."
            - id: nothing
              text:
                uk: "Нічого: `checkName` нічого не друкує"
                en: "Nothing: `checkName` prints nothing"
              why:
                uk: "`checkName` справді не друкує — вона повертає результат. А друкує його поле `console.log` у місці виклику."
                en: "`checkName` indeed prints nothing — it returns a result. The `console.log` at the place of the call prints a field of it."
          correct: [false-value]
        explanation:
          uk: "`checkName` нічого не друкує, а **повертає** результат перевірки; що з ним робити — показати повідомлення, зберегти чи перевірити в тесті, — вирішує той, хто викликав. Так влаштовані й чисті функції: вони обчислюють, а показує результат хтось інший."
          en: "`checkName` prints nothing; it **returns** the validation result, and whoever called it decides what to do with it — show a message, store it or check it in a test. Pure functions work the same way: they compute, and somebody else shows the result."

  - id: side-effects-needed
    kind: prediction
    prompt:
      uk: "Яке твердження про побічні ефекти правдиве?"
      en: "Which statement about side effects is true?"
    answer:
      type: choice
      options:
        - id: none-allowed
          text:
            uk: "Хороша програма взагалі не має побічних ефектів"
            en: "A good program has no side effects at all"
          why:
            uk: "Без побічних ефектів програма нічого не покаже й нічого не збереже: вивід на сторінку чи в консоль — теж побічний ефект."
            en: "Without side effects a program shows nothing and saves nothing: output to the page or the console is a side effect too."
        - id: kept-at-edges
          text:
            uk: "Побічні ефекти потрібні, але їх тримають у кількох відомих місцях, а обчислюють чистими функціями"
            en: "Side effects are needed, but they are kept in a few known places, while the computing is done by pure functions"
        - id: no-log-is-pure
          text:
            uk: "Функція, яка не викликає `console.log`, уже чиста"
            en: "A function that does not call `console.log` is already pure"
          why:
            uk: "Чистоту порушує будь-яка зміна поза функцією — запис на сторінку чи зміна зовнішньої змінної — і залежність від чогось, крім аргументів, наприклад від часу."
            en: "Purity is broken by any change outside the function — a page write or a change to an outer variable — and by depending on anything besides the arguments, such as the time."
      correct: [kept-at-edges]
    explanation:
      uk: "Побічні ефекти — це те, заради чого програму пишуть: показати, зберегти, надіслати. Погано, коли вони розкидані всюди. Тому обчислення роблять чистими функціями, а ефекти збирають у кількох місцях на краю програми."
      en: "Side effects are what programs are written for: to show, to save, to send. The trouble is when they are scattered everywhere. So the computing is done by pure functions, and the effects are gathered in a few places at the edge of the program."

  - id: effects-at-the-edge
    kind: explanation
    title:
      uk: "Обчислення — чисті, ефекти — на краю"
      en: "Pure computing, effects at the edge"
    body:
      uk: |
        Побічні ефекти — не помилки. Помилкою стає їх **розкиданість**: коли половина функцій щось друкує, пише на сторінку й змінює спільні змінні, ніхто не знає, що станеться після виклику.

        Тому діють так: **обчислення — чисті функції, ефекти — на краю програми.**

        - Чисту функцію легко перевірити: дав аргумент — порівняв результат.
        - Її легко використати вдруге: той самий підпис можна показати на сторінці, у консолі чи в тесті.
        - Сторінку оновлює один короткий рядок, який викликає чисту функцію.

        Багато вбудованих функцій чисті. Наприклад, `"  Лампа ".trim()` повертає новий текст «Лампа» без пробілів на краях, а вихідний рядок не змінює.
      en: |
        Side effects are not bugs. The bug is when they are **scattered**: when half of the functions print, write to the page and change shared variables, nobody knows what a call will do.

        So the rule is: **computing in pure functions, effects at the edge of the program.**

        - A pure function is easy to check: give it an argument, compare the result.
        - It is easy to reuse: the same label can be shown on the page, in the console or in a test.
        - The page is updated by one short line that calls the pure function.

        Many built-in functions are pure. For example, `"  Lamp ".trim()` returns new text “Lamp” without the spaces at the edges and leaves the original string unchanged.

  - id: split-show-label
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: split-show-label
    entry: index.html
    editable: [index.js]
    strings:
      lang: { uk: "uk", en: "en" }
      pageTitle: { uk: "Список бажань", en: "Wishlist" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      noPrice: { uk: "без ціни", en: "no price" }
      uah: { uk: "грн", en: "UAH" }
    title:
      uk: "Розділи обчислення й показ"
      en: "Split computing from showing"
    instructions:
      uk: |
        `showLabel` робить дві роботи одразу: будує підпис **і** записує його на сторінку. Рядок `document.querySelector("#label").textContent = …` знаходить на сторінці абзац з `id="label"` і записує в нього текст (як це працює, детально розберемо в JS-06).

        Розділи `showLabel`:

        1. Напиши чисту `formatLabel(item)`: вона лише будує й **повертає** підпис — «Настільна лампа — 45 грн» або «… — без ціни», коли ціна `null`.
        2. Онови сторінку одним рядком: `document.querySelector("#label").textContent = formatLabel(lamp);`.
        3. Видали `showLabel`.
      en: |
        `showLabel` does two jobs at once: it builds the label **and** writes it to the page. The line `document.querySelector("#label").textContent = …` finds the paragraph with `id="label"` on the page and writes text into it (JS-06 explains how this works in detail).

        Split `showLabel`:

        1. Write a pure `formatLabel(item)`: it only builds and **returns** the label — “Desk lamp — 45 UAH”, or “… — no price” when the price is `null`.
        2. Update the page with one line: `document.querySelector("#label").textContent = formatLabel(lamp);`.
        3. Delete `showLabel`.
    testTitles:
      "runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without errors"
      "the page shows the lamp label":
        uk: "На сторінці підпис лампи"
        en: "The page shows the lamp label"
      "formatLabel returns the label with the price":
        uk: "formatLabel повертає підпис із ціною"
        en: "formatLabel returns the label with the price"
      "formatLabel handles a missing price and a zero price":
        uk: "formatLabel правильно працює з null і з ціною 0"
        en: "formatLabel handles null and a price of 0"
      "formatLabel does not touch the page":
        uk: "formatLabel не змінює сторінку"
        en: "formatLabel does not change the page"
      "formatLabel does not print anything":
        uk: "formatLabel нічого не друкує"
        en: "formatLabel prints nothing"
      "formatLabel does not change the item":
        uk: "formatLabel не змінює переданий запис"
        en: "formatLabel does not change the item it receives"
    hints:
      nudge:
        uk: "Яка частина `showLabel` обчислює текст, а яка пише на сторінку? Перша і стане `formatLabel`."
        en: "Which part of `showLabel` computes the text and which part writes to the page? The first part becomes `formatLabel`."
      explanation:
        uk: "Перенеси будування тексту в `function formatLabel(item) { … return text; }` — без рядка з `document`. Потім заміни виклик `showLabel(lamp)` одним рядком: `document.querySelector(\"#label\").textContent = formatLabel(lamp);` — і видали `showLabel`."
        en: "Move the text building into `function formatLabel(item) { … return text; }` — without the `document` line. Then replace the call `showLabel(lamp)` with one line: `document.querySelector(\"#label\").textContent = formatLabel(lamp);` — and delete `showLabel`."
    solutionNote:
      uk: "Тепер `formatLabel` чиста: той самий запис — той самий підпис, і поза собою вона нічого не змінює. Її можна перевірити без сторінки й використати деінде. Побічний ефект — запис на сторінку — лишився в одному рядку на краю програми."
      en: "Now `formatLabel` is pure: the same record gives the same label, and it changes nothing outside itself. It can be checked without a page and reused elsewhere. The side effect — the page write — stays in one line at the edge of the program."
    feedback:
      - when: { error: TypeError }
        message:
          uk: "`TypeError`: перевір, що функція називається саме `formatLabel` і що селектор написано як `\"#label\"`. `Cannot set properties of null` означає, що абзац за таким селектором не знайдено."
          en: "`TypeError`: check that the function is called exactly `formatLabel` and that the selector is written as `\"#label\"`. `Cannot set properties of null` means no paragraph matched the selector."
      - when: { test: "the page shows the lamp label" }
        message:
          uk: "Після запуску на сторінці має бути підпис лампи. Онови абзац рядком `document.querySelector(\"#label\").textContent = formatLabel(lamp);`."
          en: "After the run the page must show the lamp label. Update the paragraph with `document.querySelector(\"#label\").textContent = formatLabel(lamp);`."
      - when: { test: "formatLabel returns the label with the price" }
        message:
          uk: "`formatLabel` має **повертати** текст через `return`, а не записувати його на сторінку."
          en: "`formatLabel` must **return** the text with `return`, not write it to the page."
      - when: { test: "formatLabel handles a missing price and a zero price" }
        message:
          uk: "Для ціни `null` підпис закінчується «без ціни», а ціна `0` — справжня ціна: перевіряй саме `item.price === null`."
          en: "For a `null` price the label ends with “no price”, while a price of `0` is a real price: check exactly `item.price === null`."
      - when: { test: "formatLabel does not touch the page" }
        message:
          uk: "`formatLabel` досі пише на сторінку. Прибери з неї рядок із `document.querySelector`: сторінку оновлює окремий рядок поза функцією."
          en: "`formatLabel` still writes to the page. Remove the `document.querySelector` line from it: the page is updated by a separate line outside the function."
      - when: { test: "formatLabel does not print anything" }
        message:
          uk: "Прибери з `formatLabel` `console.log`: друк — теж побічний ефект."
          en: "Remove `console.log` from `formatLabel`: printing is a side effect too."
      - when: { test: "formatLabel does not change the item" }
        message:
          uk: "`formatLabel` не має змінювати переданий запис. Будуй підпис в окремій змінній, а поля `item` лише читай."
          en: "`formatLabel` must not change the record it receives. Build the label in a separate variable and only read the fields of `item`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-03
    body:
      uk: "Саме це — крок проєкту цього розділу: підписи й перевірки твого проєкту переїжджають у чисті функції `format…` і `validate…`, а сторінка лише викликає їх і показує результат."
      en: "This is exactly this unit’s project step: your project’s labels and checks move into pure `format…` and `validate…` functions, and the page only calls them and shows the results."
