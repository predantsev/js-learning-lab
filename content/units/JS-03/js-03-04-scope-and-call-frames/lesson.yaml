id: js-03-04-scope-and-call-frames
unit: JS-03
title:
  uk: "Область видимості: хто що бачить"
  en: "Scope: who can see what"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Простежити, яку змінну знайде кожне ім’я, ідучи ланцюжком областей видимості назовні від поточного блоку чи функції."
    en: "Trace which binding each name resolves to by walking the scope chain outward from the current block or function."
  - uk: "Пояснити, чому функція бачить змінні місця, де її написано, а не місця, звідки її викликали (лексична область видимості)."
    en: "Explain why a function sees the variables of the place where it was written, not of the place it is called from (lexical scope)."
  - uk: "Обрати `const` чи `let` для кожної змінної функції й тримати кожну змінну в найменшій області видимості, якій вона потрібна."
    en: "Choose `const` or `let` for every binding of a function and keep each binding in the smallest scope that needs it."
prerequisites: [js-03-03-arrow-functions, js-02-07-var-hoisting-tdz, js-02-08-shadowing-strict-mode]
subskills:
  - { family: J-02, skill: "lexical/function/block scope", depth: practice }
  - { family: J-02, skill: "const/let and mutation distinction", depth: practice }
glossary: [scope, lexical-scope, scope-chain, global-scope]
selfCheck: [whose-discount, fresh-each-call, tidy-scopes]

blocks:
  - id: scope-boxes
    kind: explanation
    title:
      uk: "Коробки з іменами"
      en: "Boxes of names"
    body:
      uk: |
        Кожен блок `{ … }` і кожен **виклик** функції має власну [[scope|область видимості]] — «коробку» з іменами, оголошеними всередині. Коробки вкладені одна в одну так, як написано код: файл → функція → блок. Довкола файла є ще [[global-scope|глобальна область видимості]], де живуть вбудовані імена на кшталт `console`.

        Коли код використовує ім’я, JavaScript шукає його в поточній коробці, потім у тій, що її оточує, і так далі назовні. Це [[scope-chain|ланцюжок областей видимості]]. Перше знайдене ім’я перемагає; якщо імені немає ніде — `ReferenceError`.

        Важливо, що означає «оточує»: це місце, де функцію **написано**, а не місце, звідки її **викликали**. Таке правило називають [[lexical-scope|лексичною областю видимості]].
      en: |
        Every block `{ … }` and every **call** of a function has its own [[scope]] — a “box” of the names declared inside it. The boxes are nested exactly as the code is written: file → function → block. Around the file there is also the [[global-scope|global scope]], where built-in names such as `console` live.

        When code uses a name, JavaScript looks for it in the current box, then in the box around it, and so on outward. That is the [[scope-chain|scope chain]]. The first match wins; if the name is nowhere, it is a `ReferenceError`.

        What “around” means matters: it is the place where the function is **written**, not the place it is **called** from. This rule is called [[lexical-scope|lexical scope]].

  - id: whose-discount
    kind: prediction
    prompt:
      uk: "Функцію `finalPrice` викликають зсередини `checkout`, у якої є власна змінна `discount`. Що виведе програма?"
      en: "The function `finalPrice` is called from inside `checkout`, which has its own `discount` variable. What does the program print?"
    code: |
      const discount = 10;

      function finalPrice(price) {
        return price - discount;
      }

      function checkout() {
        const discount = 50;
        return finalPrice(100);
      }

      console.log(checkout());
    verify:
      logs: ["90"]
    answer:
      type: choice
      options:
        - id: written-place
          text: { uk: "`90`", en: "`90`" }
        - id: caller-place
          text: { uk: "`50`", en: "`50`" }
          why:
            uk: "`finalPrice` шукає `discount` у своїй коробці, а потім там, де її **написано**, — на верхньому рівні файла. Коробка `checkout` — це місце виклику, і на шляху пошуку її немає."
            en: "`finalPrice` looks for `discount` in its own box and then where it is **written** — the top level of the file. The `checkout` box is where it is called from, and it is not on the lookup path."
        - id: both-discounts
          text: { uk: "`40`", en: "`40`" }
          why:
            uk: "Ім’я завжди означає одну змінну — першу, знайдену на шляху назовні. Дві знижки не складаються."
            en: "A name always means one variable — the first one found on the way out. The two discounts do not add up."
        - id: not-found
          text: { uk: "`ReferenceError`", en: "`ReferenceError`" }
          why:
            uk: "`discount` є на верхньому рівні файла, а верхній рівень лежить на шляху пошуку з `finalPrice`, тож ім’я знаходиться."
            en: "`discount` exists at the top level of the file, and the top level is on the lookup path from `finalPrice`, so the name is found."
      correct: [written-place]
    explanation:
      uk: "`finalPrice` написано на верхньому рівні файла, тож її шлях пошуку такий: власна коробка (`price`) → файл (`discount = 10`). Те, що викликає її `checkout` зі своєю знижкою `50`, нічого не змінює: місце виклику не входить у ланцюжок. `100 - 10` дає `90`."
      en: "`finalPrice` is written at the top level of the file, so its lookup path is: its own box (`price`) → the file (`discount = 10`). The fact that `checkout` calls it with its own discount of `50` changes nothing: the calling place is not part of the chain. `100 - 10` gives `90`."

  - id: scope-steps
    kind: visual
    visual: code-trace
    title:
      uk: "Крок за кроком: чий discount?"
      en: "Step by step: whose discount?"
    textEquivalent:
      uk: "Це та сама програма, лише результат finalPrice зберігається в total. На верхньому рівні файла discount дорівнює 10, а функції finalPrice і checkout уже існують. Виклик checkout() створює кадр із власною областю видимості, де з’являється інша змінна discount зі значенням 50. Звідти викликається finalPrice(100): у стеку викликів три кадри — файл, checkout і finalPrice. Але ланцюжок областей видимості finalPrice — це її власна область (price = 100) і файл (discount = 10); область checkout у нього не входить, бо finalPrice написано на верхньому рівні. Тому finalPrice повертає 90, воно потрапляє в total, і checkout повертає його. Другий виклик, finalPrice(40), отримує новий кадр із price = 40 і повертає 30. У консолі — 90 і 30."
      en: "This is the same program, only the result of finalPrice is stored in total. At the top level of the file discount is 10, and the functions finalPrice and checkout already exist. Calling checkout() creates a frame with its own scope, where a different discount variable with the value 50 appears. From there finalPrice(100) is called: the call stack holds three frames — the file, checkout and finalPrice. But the scope chain of finalPrice is its own scope (price = 100) and the file (discount = 10); checkout’s scope is not in it, because finalPrice is written at the top level. So finalPrice returns 90, which goes into total, and checkout returns it. The second call, finalPrice(40), gets a new frame with price = 40 and returns 30. The console shows 90 and 30."
    spec:
      file: visuals/discount.js
      captions:
        - at: { line: 13 }
          text:
            uk: "Та сама програма, лише результат `finalPrice` зберігається в `total`. Верхній рівень файла: `discount = 10`. Функції `finalPrice` і `checkout` уже існують — їх оголошено через `function`."
            en: "The same program, only the result of `finalPrice` is stored in `total`. The top level of the file: `discount = 10`. The functions `finalPrice` and `checkout` already exist — they are declared with `function`."
        - at: { line: 7, kind: call }
          text:
            uk: "Виклик `checkout()` — новий кадр і нова коробка з **власною** змінною `discount`. Поки рядок 8 не виконано, вона **uninitialized**."
            en: "Calling `checkout()` — a new frame and a new box with its **own** `discount`. Until line 8 runs, it is **uninitialized**."
        - at: { line: 9 }
          text:
            uk: "У коробці `checkout` тепер `discount = 50`. Рядок 9 викликає `finalPrice(100)`, і кадр `checkout` чекає на відповідь."
            en: "The `checkout` box now has `discount = 50`. Line 9 calls `finalPrice(100)`, and the `checkout` frame waits for the answer."
        - at: { line: 3, kind: call }
          text:
            uk: "Зсередини `checkout` викликано `finalPrice(100)`. У **Call stack** три кадри, але в **Змінних** — лише коробка `finalPrice` і модуль: коробки `checkout` на шляху пошуку немає."
            en: "`finalPrice(100)` is called from inside `checkout`. The **Call stack** has three frames, but **Variables** show only the `finalPrice` box and the module: the `checkout` box is not on the lookup path."
        - at: { line: 4, kind: return }
          text:
            uk: "`discount` знайдено на верхньому рівні: `100 - 10` — це `90`. Знижка `50` з `checkout` ролі не зіграла."
            en: "`discount` was found at the top level: `100 - 10` is `90`. The discount of `50` in `checkout` played no part."
        - at: { line: 10, kind: return }
          text:
            uk: "`checkout` повертає те, що отримала від `finalPrice`, — `total = 90`. Після цього її кадр і коробка з `discount = 50` зникнуть."
            en: "`checkout` returns what it got from `finalPrice` — `total = 90`. Then its frame and the box with `discount = 50` disappear."
        - at: { line: 3, kind: call, hit: 2 }
          text:
            uk: "Другий виклик `finalPrice(40)` — **новий** кадр із `price = 40`. Від першого виклику не лишилося нічого: кожен виклик має власну коробку."
            en: "The second call `finalPrice(40)` — a **new** frame with `price = 40`. Nothing is left of the first call: every call has its own box."
        - at: { line: 14, kind: end }
          text:
            uk: "У консолі `90` і `30`. Обидва рази `finalPrice` брала `discount` з місця, де її написано."
            en: "The console shows `90` and `30`. Both times `finalPrice` took `discount` from the place where it is written."

  - id: move-the-function
    kind: example
    runtime: browser-js
    dir: move-the-function
    entry: index.js
    title:
      uk: "Переселяємо функцію"
      en: "Moving the function"
    body:
      uk: |
        Той самий код. Запусти його й переконайся, що виходить `90`. Тепер змінимо лише **місце**, де написано `finalPrice`.
      en: |
        The same code. Run it and make sure it prints `90`. Now we change only the **place** where `finalPrice` is written.
    tryIt:
      uk: "Виріж усю функцію `finalPrice` і встав її всередину `checkout`, одразу після рядка `const discount = 50;`. Запусти: тепер `50`. Функцію написано в коробці `checkout`, тож пошук іде `finalPrice` → `checkout` і зупиняється на знижці `50`. Потім перейменуй внутрішню змінну на `localDiscount` (лише в рядку з `const`) і запусти знову: знову `90`."
      en: "Cut the whole `finalPrice` function and paste it inside `checkout`, right after the line `const discount = 50;`. Run: now it is `50`. The function is written in the `checkout` box, so the lookup goes `finalPrice` → `checkout` and stops at the discount of `50`. Then rename the inner variable to `localDiscount` (only on the `const` line) and run again: `90` once more."

  - id: recall
    kind: review
    title:
      uk: "Згадай: блокова область видимості"
      en: "Recall: block scope"
    strings:
      expensive: { uk: "дорого", en: "expensive" }
    items:
      - id: const-in-block
        from: js-02-07-var-hoisting-tdz
        prompt:
          uk: "Що станеться, коли ця програма запуститься?"
          en: "What happens when this program runs?"
        code: |
          const price = 80;
          if (price > 50) {
            const note = "%%expensive%%";
          }
          console.log(note);
        verify:
          logs: []
          error: ReferenceError
        answer:
          type: choice
          options:
            - id: reference-error
              text:
                uk: "`ReferenceError`: імені `note` поза блоком не існує"
                en: "A `ReferenceError`: the name `note` does not exist outside the block"
            - id: prints-note
              text: { uk: "Виведе «дорого»", en: "It prints “expensive”" }
              why:
                uk: "`const` і `let` живуть лише у своєму блоці `{ … }`. Після закривальної дужки імені `note` вже немає."
                en: "`const` and `let` live only inside their block `{ … }`. After the closing brace the name `note` is gone."
            - id: prints-undefined
              text: { uk: "Виведе `undefined`", en: "It prints `undefined`" }
              why:
                uk: "`undefined` дає змінна, яка існує, але не має значення. Тут імені `note` поза блоком немає взагалі."
                en: "`undefined` comes from a variable that exists but has no value. Here the name `note` does not exist outside the block at all."
          correct: [reference-error]
        explanation:
          uk: "`const` і `let` живуть лише у своєму блоці `{ … }` — це [[block-scope|блокова область видимості]]. Після закривальної дужки імені `note` не існує, тому звертання до нього — `ReferenceError`. Це знадобиться у вправі: змінна, оголошена в гілці `if`, після цієї гілки недоступна."
          en: "`const` and `let` live only inside their block `{ … }` — that is [[block-scope|block scope]]. After the closing brace the name `note` does not exist, so using it is a `ReferenceError`. Keep this in mind for the exercise: a variable declared inside an `if` branch is gone after that branch."

  - id: fresh-each-call
    kind: prediction
    prompt:
      uk: "`addVisit` збільшує лічильник відвідин. Що виведуть три виклики?"
      en: "`addVisit` increases a visit counter. What do the three calls print?"
    code: |
      function addVisit() {
        let visits = 0;
        visits = visits + 1;
        return visits;
      }

      console.log(addVisit());
      console.log(addVisit());
      console.log(addVisit());
    verify:
      logs: ["1", "1", "1"]
    answer:
      type: choice
      options:
        - id: fresh
          text: { uk: "`1`, `1`, `1`", en: "`1`, `1`, `1`" }
        - id: shared
          text: { uk: "`1`, `2`, `3`", en: "`1`, `2`, `3`" }
          why:
            uk: "Кожен виклик створює новий кадр із власною змінною `visits`, і вона щоразу починається з `0`. Між викликами локальні змінні не зберігаються."
            en: "Every call creates a new frame with its own `visits`, which starts at `0` each time. Local variables are not kept between calls."
        - id: zeros
          text: { uk: "`0`, `0`, `0`", en: "`0`, `0`, `0`" }
          why:
            uk: "Рядок `visits = visits + 1` виконується до `return`, тож функція повертає вже `1`."
            en: "The line `visits = visits + 1` runs before `return`, so the function returns `1`."
      correct: [fresh]
    explanation:
      uk: "Кожен виклик — це новий [[call-frame|кадр виклику]] з новою коробкою локальних змінних. `let visits = 0` виконується щоразу заново, а коли виклик завершується, коробка зникає. Тому локальні змінні **не спільні** для викликів. Як зберегти значення між викликами без змінної на верхньому рівні — тема наступного уроку."
      en: "Every call is a new [[call-frame|call frame]] with a new box of local variables. `let visits = 0` runs anew each time, and when the call ends the box disappears. That is why local variables are **not shared** between calls. How to keep a value between calls without a top-level variable is the topic of the next lesson."

  - id: smallest-box
    kind: explanation
    title:
      uk: "Кожній змінній — найменша коробка"
      en: "Every variable gets the smallest box"
    body:
      uk: |
        Два правила, які рятують від цілої категорії помилок:

        1. **`const` за замовчуванням.** `let` — лише тоді, коли змінну справді перепризначають.
        2. **Найменша область видимості.** Оголошуй змінну в тій функції чи тому блоці, де вона потрібна. Те, що функції потрібно ззовні, хай приходить параметрами; результат — виходить через `return`.

        Змінну `let` на верхньому рівні файла може змінити будь-яка функція. Тоді результат функції залежить від того, хто й коли цю змінну змінив, — і помилку важко знайти. Локальні змінні існують лише під час виклику, і ніхто інший їх не торкнеться.

        Але не перестарайся: `const`, оголошена всередині `{ }` гілки `if`, після закривальної дужки вже не існує.
      en: |
        Two rules that prevent a whole family of bugs:

        1. **`const` by default.** Use `let` only when the variable really is reassigned.
        2. **The smallest scope.** Declare a variable in the function or block that needs it. What the function needs from outside comes in through parameters; the result goes out through `return`.

        A `let` at the top level of a file can be changed by any function. Then a function’s result depends on who changed that variable and when — and the bug is hard to find. Local variables exist only during a call, and nobody else touches them.

        But do not overdo it: a `const` declared inside the `{ }` of an `if` branch no longer exists after the closing brace.

  - id: tidy-scopes
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: tidy-scopes
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      noPrice: { uk: "без ціни", en: "no price" }
      uah: { uk: "грн", en: "UAH" }
    title:
      uk: "Наведи лад в областях видимості"
      en: "Tidy up the scopes"
    instructions:
      uk: |
        Цей старий код тримає все в змінних `let` на верхньому рівні, а `makeLabel` читає й змінює їх. Перепиши його:

        - `makeLabel(name, price)` отримує назву й ціну **параметрами** й повертає підпис;
        - проміжні значення живуть **усередині** функції, через `const`, де це можливо;
        - змінних `let` на верхньому рівні не лишається, а виклики передають дані аргументами.

        Програма має виводити ті самі два рядки, що й зараз.
      en: |
        This old code keeps everything in top-level `let` variables, and `makeLabel` reads and changes them. Rewrite it:

        - `makeLabel(name, price)` receives the name and the price as **parameters** and returns the label;
        - intermediate values live **inside** the function, as `const` where possible;
        - no top-level `let` variables remain, and the calls pass the data as arguments.

        The program must print the same two lines as now.
    testTitles:
      "runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without errors"
      "builds the label from its arguments":
        uk: "makeLabel будує підпис з аргументів"
        en: "makeLabel builds the label from its arguments"
      "does not change variables outside itself":
        uk: "makeLabel не змінює змінних поза собою"
        en: "makeLabel does not change variables outside itself"
      "prints the same two lines":
        uk: "Виводить ті самі два рядки"
        en: "Prints the same two lines"
    hints:
      nudge:
        uk: "Що функції потрібно ззовні? Хай це приходить параметрами. Що вона обчислює для себе? Хай це живе всередині неї."
        en: "What does the function need from outside? Let it come in through parameters. What does it compute for itself? Let that live inside it."
      explanation:
        uk: "Заголовок — `function makeLabel(name, price)`. Усередині: `const priceText = price === null ? \"без ціни\" : price + \" грн\";` і `return name + \" — \" + priceText;`. Виклики: `makeLabel(\"Навушники\", 80)` і `makeLabel(\"Квитки на концерт\", null)`. Чотири `let` зверху більше не потрібні."
        en: "The header is `function makeLabel(name, price)`. Inside: `const priceText = price === null ? \"no price\" : price + \" UAH\";` and `return name + \" — \" + priceText;`. The calls: `makeLabel(\"Headphones\", 80)` and `makeLabel(\"Concert tickets\", null)`. The four `let`s at the top are no longer needed."
    solutionNote:
      uk: "Тепер функція залежить лише від своїх аргументів і нічого не змінює ззовні: `priceText` існує тільки під час виклику, а підпис виходить через `return`. Варіант із `let priceText;` перед `if` і присвоєннями в гілках теж правильний — це все одно коробка функції, а `let` тут потрібен, бо значення присвоюють пізніше."
      en: "Now the function depends only on its arguments and changes nothing outside: `priceText` exists only during a call, and the label leaves through `return`. A version with `let priceText;` before the `if` and assignments in the branches is correct too — it is still the function’s box, and `let` is needed there because the value is assigned later."
    feedback:
      - when: { error: ReferenceError }
        message:
          uk: "`… is not defined`. Якщо йдеться про змінну, оголошену всередині `{ }` гілки `if`, — після закривальної дужки її вже немає: оголоси `let priceText;` перед `if` або обчисли значення одним тернарним виразом. Якщо про змінну, яку ти прибрав з верхнього рівня, — передай її значення аргументом."
          en: "`… is not defined`. If it is a variable declared inside the `{ }` of an `if` branch, it is gone after the closing brace: declare `let priceText;` before the `if` or compute the value with one ternary expression. If it is a variable you removed from the top level, pass its value as an argument."
      - when: { test: "builds the label from its arguments" }
        message:
          uk: "`makeLabel` має брати назву й ціну з параметрів: `function makeLabel(name, price)`. Виклики внизу передають їх аргументами: `makeLabel(\"Навушники\", 80)`."
          en: "`makeLabel` must take the name and the price from its parameters: `function makeLabel(name, price)`. The calls at the bottom pass them as arguments: `makeLabel(\"Headphones\", 80)`."
      - when: { test: "does not change variables outside itself" }
        message:
          uk: "Функція досі записує значення в змінні верхнього рівня. Оголоси `priceText` і підпис усередині функції, а верхні `let` прибери."
          en: "The function still writes values into top-level variables. Declare `priceText` and the label inside the function, and remove the top-level `let`s."

  - id: to-project
    kind: transfer
    capstoneStep: JS-03
    body:
      uk: "У кроці проєкту функції форматування й перевірки отримуватимуть запис параметром і не чіпатимуть змінних верхнього рівня. Так їх можна буде викликати для будь-якого запису — і на сторінці, і в консолі."
      en: "In the project step, the formatting and validation functions will receive a record as a parameter and will not touch top-level variables. That way they can be called for any record — on the page and in the console."
