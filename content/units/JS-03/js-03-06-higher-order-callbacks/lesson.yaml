id: js-03-06-higher-order-callbacks
unit: JS-03
title:
  uk: "Функції як значення: callback-и та функції вищого порядку"
  en: "Functions as values: callbacks and higher-order functions"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передати функцію як аргумент і передбачити, коли й скільки разів її викличе функція, що її отримала."
    en: "Pass a function as an argument and predict when and how many times the receiving function calls it."
  - uk: "Відрізняти передачу функції (`formatter`) від передачі результату її виклику (`formatter()`)."
    en: "Tell passing a function (`formatter`) from passing the result of calling it (`formatter()`)."
  - uk: "Написати функцію вищого порядку, яка повертає нову функцію, збудовану з отриманої."
    en: "Write a higher-order function that returns a new function built from the one it receives."
prerequisites: [js-03-05-closures, js-03-03-arrow-functions]
subskills:
  - { family: J-04, skill: "closures and higher-order functions", depth: practice }
  - { family: J-04, skill: "callbacks", depth: intro }
glossary: [first-class-function, higher-order-function, callback]
selfCheck: [fn-or-call, never-called, formatters]

blocks:
  - id: functions-as-values
    kind: explanation
    title:
      uk: "Функцію можна передати"
      en: "A function can be passed along"
    body:
      uk: |
        Функція в JavaScript — таке саме **значення**, як число чи текст ([[first-class-function|функції першого класу]]). Ти вже зберігав функції в `const` і повертав їх із фабрик. Їх можна й **передавати** в інші функції:

        ```js
        const addFee = (price) => price + 10;

        function applyTwice(fn, value) {
          return fn(fn(value));
        }

        applyTwice(addFee, 100); // 120
        ```

        - `addFee` без дужок — це сама функція: вона потрапляє в параметр `fn`.
        - `addFee(100)` з дужками — це виклик: у параметр потрапив би лише його результат, `110`.

        Функція, яка приймає або повертає функцію, — [[higher-order-function|функція вищого порядку]]. Передану функцію називають [[callback]]: коли її викликати і скільки разів, вирішує та функція, що її отримала. `applyTwice` викликає її двічі: `100 → 110 → 120`.
      en: |
        In JavaScript a function is a **value** just like a number or a string ([[first-class-function|first-class functions]]). You have already stored functions in `const` and returned them from factories. You can also **pass** them to other functions:

        ```js
        const addFee = (price) => price + 10;

        function applyTwice(fn, value) {
          return fn(fn(value));
        }

        applyTwice(addFee, 100); // 120
        ```

        - `addFee` without brackets is the function itself: it lands in the parameter `fn`.
        - `addFee(100)` with brackets is a call: only its result, `110`, would land in the parameter.

        A function that takes or returns a function is a [[higher-order-function|higher-order function]]. The function you pass in is a [[callback]]: the receiving function decides when to call it and how many times. `applyTwice` calls it twice: `100 → 110 → 120`.

  - id: fn-or-call
    kind: prediction
    prompt:
      uk: "У першому виклику передають функцію `double`, у другому — `double(3)`. Що станеться?"
      en: "The first call passes the function `double`, the second one passes `double(3)`. What happens?"
    code: |
      const double = (n) => n * 2;

      function applyTwice(fn, value) {
        return fn(fn(value));
      }

      console.log(applyTwice(double, 3));
      console.log(applyTwice(double(3), 3));
    verify:
      logs: ["12"]
      error: TypeError
    answer:
      type: choice
      options:
        - id: second-fails
          text:
            uk: "`12`, а потім `TypeError: fn is not a function`"
            en: "`12`, then `TypeError: fn is not a function`"
        - id: same-thing
          text: { uk: "`12` і `12`", en: "`12` and `12`" }
          why:
            uk: "`double(3)` — це вже число `6`, а не функція. `applyTwice` отримує `6` у параметр `fn`, і виклик `fn(...)` ламається: число не можна викликати."
            en: "`double(3)` is already the number `6`, not a function. `applyTwice` receives `6` in its parameter `fn`, and the call `fn(...)` breaks: a number cannot be called."
        - id: doubled-again
          text: { uk: "`12` і `24`", en: "`12` and `24`" }
          why:
            uk: "Друга функція отримує не `double`, а лише результат її виклику — число `6`. Викликати число неможливо."
            en: "The second call receives not `double` but only the result of calling it — the number `6`. A number cannot be called."
        - id: called-once
          text: { uk: "`6` і `12`", en: "`6` and `12`" }
          why:
            uk: "`applyTwice` викликає `fn` двічі: `double(3)` дає `6`, потім `double(6)` дає `12`."
            en: "`applyTwice` calls `fn` twice: `double(3)` gives `6`, then `double(6)` gives `12`."
      correct: [second-fails]
    explanation:
      uk: "Перший виклик передає саму функцію `double`, і `applyTwice` викликає її двічі: `3 → 6 → 12`. У другому дужки `double(3)` спрацювали ще до передачі, і в `fn` потрапило число `6`. Рядок `fn(fn(value))` намагається викликати число — `TypeError: fn is not a function`. Передаючи callback, пиши його назву **без дужок**."
      en: "The first call passes the function `double` itself, and `applyTwice` calls it twice: `3 → 6 → 12`. In the second, the brackets of `double(3)` ran before passing, and `fn` received the number `6`. The line `fn(fn(value))` tries to call a number — `TypeError: fn is not a function`. When you pass a callback, write its name **without brackets**."

  - id: apply-twice-steps
    kind: visual
    visual: code-trace
    title:
      uk: "Крок за кроком: applyTwice(addFee, 100)"
      en: "Step by step: applyTwice(addFee, 100)"
    textEquivalent:
      uk: "Змінна addFee зберігає функцію. На рядку 9 цю функцію, без дужок, передають в applyTwice разом із числом 100. У кадрі applyTwice параметр fn вказує на ту саму функцію, що й addFee, а value дорівнює 100. Рядок const once = fn(value) викликає її: над applyTwice у стеку викликів з’являється кадр addFee з price = 100, і він повертає 110, яке потрапляє в once. Потім const twice = fn(once) викликає ту саму функцію вдруге — новий кадр із price = 110, результат 120. applyTwice повертає 120, і console.log виводить 120. Саме applyTwice вирішила, коли і скільки разів викликати передану функцію."
      en: "The variable addFee holds a function. On line 9 that function, without brackets, is passed to applyTwice together with the number 100. In the applyTwice frame the parameter fn points at the same function as addFee, and value is 100. The line const once = fn(value) calls it: an addFee frame with price = 100 appears on the call stack above applyTwice and returns 110, which goes into once. Then const twice = fn(once) calls the same function a second time — a new frame with price = 110, result 120. applyTwice returns 120, and console.log prints 120. It was applyTwice that decided when and how many times to call the function it received."
    spec:
      file: visuals/apply-twice.js
      captions:
        - at: { line: 9 }
          text:
            uk: "`addFee` зберігає функцію (у **Heap** вона має свій номер). На рядку 9 її передають **без дужок** — як значення, так само як число `100`."
            en: "`addFee` holds a function (it has its own number in the **Heap**). On line 9 it is passed **without brackets** — as a value, just like the number `100`."
        - at: { line: 3, kind: call }
          text:
            uk: "У кадрі `applyTwice` параметр `fn` вказує на **ту саму** функцію, що й `addFee`: значення «приїхало» в параметр. `value = 100`."
            en: "In the `applyTwice` frame the parameter `fn` points at **the same** function as `addFee`: the value has traveled into the parameter. `value = 100`."
        - at: { line: 1, kind: call }
          text:
            uk: "`fn(value)` викликає передану функцію: над `applyTwice` з’являється кадр `addFee` з `price = 100`."
            en: "`fn(value)` calls the function it received: an `addFee` frame with `price = 100` appears above `applyTwice`."
        - at: { line: 1, kind: return }
          text:
            uk: "Повертається `110`, кадр `addFee` зникає."
            en: "`110` is returned, and the `addFee` frame disappears."
        - at: { line: 5 }
          text:
            uk: "Значення потрапило в `once`. Тепер `applyTwice` вирішує викликати `fn` ще раз — уже з `110`."
            en: "The value is now in `once`. Now `applyTwice` decides to call `fn` once more — this time with `110`."
        - at: { line: 1, kind: call, hit: 2 }
          text:
            uk: "Другий виклик тієї самої функції — **новий** кадр, тепер `price = 110`. Скільки разів викликати callback, вирішує `applyTwice`."
            en: "A second call of the same function — a **new** frame, now `price = 110`. How many times to call the callback is decided by `applyTwice`."
        - at: { line: 6, kind: return }
          text:
            uk: "`addFee` повернула `120`, воно в `twice`, і `applyTwice` віддає це значення далі, у `console.log`."
            en: "`addFee` returned `120`, it is in `twice`, and `applyTwice` hands this value on to `console.log`."
        - at: { line: 9, kind: end }
          text:
            uk: "У консолі `120`: функцію передали один раз, а викликали двічі."
            en: "The console shows `120`: the function was passed once and called twice."

  - id: never-called
    kind: prediction
    strings:
      called: { uk: "shout викликано", en: "shout was called" }
      hello: { uk: "Привіт", en: "Hello" }
    prompt:
      uk: "Функцію `shout` передають у `keepAsIs`. Що з’явиться в консолі?"
      en: "The function `shout` is passed to `keepAsIs`. What appears in the console?"
    code: |
      const shout = (text) => {
        console.log("%%called%%");
        return text + "!";
      };

      function keepAsIs(text, formatter) {
        return text;
      }

      console.log(keepAsIs("%%hello%%", shout));
    verify:
      logs: ["%%hello%%"]
    answer:
      type: choice
      options:
        - id: not-called
          text: { uk: "Лише «Привіт»", en: "Only “Hello”" }
        - id: called-where-written
          text:
            uk: "«shout викликано», потім «Привіт!»"
            en: "“shout was called”, then “Hello!”"
          why:
            uk: "Передати функцію — ще не означає викликати її. `keepAsIs` отримала `shout` у параметр `formatter`, але ніде не пише `formatter(...)`, тож тіло `shout` не виконується."
            en: "Passing a function does not mean calling it. `keepAsIs` received `shout` in its parameter `formatter` but never writes `formatter(...)`, so the body of `shout` never runs."
        - id: called-but-unused
          text:
            uk: "«shout викликано», потім «Привіт»"
            en: "“shout was called”, then “Hello”"
          why:
            uk: "Рядок із викликом `keepAsIs` лише передає `shout` як значення. Виклик відбувся б тільки там, де стоїть `formatter(...)`, — а такого рядка немає."
            en: "The line with the `keepAsIs` call only passes `shout` as a value. A call would happen only where `formatter(...)` is written — and there is no such line."
      correct: [not-called]
    explanation:
      uk: "Callback виконується не там, де його **написали** в списку аргументів, а тоді, коли функція, що його отримала, його **викликає**. `keepAsIs` свій `formatter` не викликає взагалі, тож у консолі лише «Привіт»."
      en: "A callback runs not where it is **written** in the argument list but when the function that received it **calls** it. `keepAsIs` never calls its `formatter`, so the console shows only “Hello”."

  - id: format-with
    kind: example
    runtime: browser-js
    dir: format-with
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      noDue: { uk: "без терміну", en: "no due date" }
    title:
      uk: "Форматер ззовні"
      en: "A formatter from outside"
    body:
      uk: |
        `printWith` не знає, як саме форматувати справу: це вирішує функція, яку їй передали. Сама `printWith` лише викликає її із записом і друкує результат. Натисни **Запустити**.
      en: |
        `printWith` does not know how to format the task: the function it receives decides that. `printWith` itself only calls it with the record and prints the result. Press **Run**.
    tryIt:
      uk: "Передай `longLabel` замість `shortLabel` — рядок у консолі зміниться, хоча `printWith` ти не чіпав. Потім напиши власний форматер, наприклад `const loudLabel = (record) => record.title + \"!\";`, і передай його. Нарешті, зміни `dueDate` справи на `null` і знову передай `longLabel`."
      en: "Pass `longLabel` instead of `shortLabel` — the console line changes although you did not touch `printWith`. Then write a formatter of your own, for example `const loudLabel = (record) => record.title + \"!\";`, and pass it. Finally, change the task’s `dueDate` to `null` and pass `longLabel` again."

  - id: recall
    kind: review
    title:
      uk: "Згадай: вибір гілки за значенням"
      en: "Recall: choosing a branch by value"
    strings:
      lamp: { uk: "Лампа", en: "Lamp" }
      uah: { uk: "грн", en: "UAH" }
    items:
      - id: missing-break
        from: js-02-05-if-else-switch
        prompt:
          uk: "Підпис вибирають за стилем через `switch`. Що виведе програма?"
          en: "The label is chosen by style with a `switch`. What does the program print?"
        code: |
          const style = "short";
          let label = "?";

          switch (style) {
            case "short":
              label = "%%lamp%%";
            case "long":
              label = "%%lamp%% — 45 %%uah%%";
              break;
            default:
              label = "?";
          }

          console.log(label);
        verify:
          logs: ["%%lamp%% — 45 %%uah%%"]
        answer:
          type: choice
          options:
            - id: fell-through
              text: { uk: "«Лампа — 45 грн»", en: "“Lamp — 45 UAH”" }
            - id: short-only
              text: { uk: "«Лампа»", en: "“Lamp”" }
              why:
                uk: "Після `case \"short\"` немає `break`, тож виконання «провалюється» в наступний `case` і перезаписує `label`."
                en: "There is no `break` after `case \"short\"`, so execution falls through into the next `case` and overwrites `label`."
            - id: default-runs
              text: { uk: "«?»", en: "“?”" }
              why:
                uk: "`break` у `case \"long\"` зупиняє `switch` ще до `default`."
                en: "The `break` in `case \"long\"` stops the `switch` before it reaches `default`."
          correct: [fell-through]
        explanation:
          uk: "`switch` знайшов `case \"short\"` і почав виконувати рядки звідти. Без `break` він пішов далі, у `case \"long\"`, і `label` став довгим підписом. Вибирати поведінку за значенням через `switch` можна, але кожен новий стиль — це зміна всередині функції. Функції вищого порядку дають інший шлях: передати саму поведінку."
          en: "The `switch` found `case \"short\"` and started running lines from there. Without `break` it went on into `case \"long\"`, and `label` became the long label. Choosing behavior by value with a `switch` works, but every new style means changing the function. Higher-order functions offer another way: pass the behavior itself."

  - id: building-functions
    kind: explanation
    title:
      uk: "Функції, що будують функції"
      en: "Functions that build functions"
    body:
      uk: |
        Функція вищого порядку може не лише **приймати** функцію, а й **повертати нову**, збудовану з отриманої:

        ```js
        function inBrackets(formatter) {
          return (record) => "[" + formatter(record) + "]";
        }

        const bracketed = inBrackets(shortLabel);
        bracketed(task); // "[Полити квіти]"
        ```

        Зверни увагу: `inBrackets` **не викликає** `formatter` одразу. Вона повертає нову функцію, яка викличе `formatter` пізніше — тоді, коли викличуть її саму. А `formatter` чекає в її closure, як `prefix` у фабриці підписів з попереднього уроку.
      en: |
        A higher-order function can not only **take** a function but also **return a new one** built from it:

        ```js
        function inBrackets(formatter) {
          return (record) => "[" + formatter(record) + "]";
        }

        const bracketed = inBrackets(shortLabel);
        bracketed(task); // "[Water the plants]"
        ```

        Notice: `inBrackets` does **not** call `formatter` right away. It returns a new function that will call `formatter` later — when that new function itself is called. Meanwhile `formatter` waits in its closure, like `prefix` in the label factory of the previous lesson.

  - id: formatters
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: formatters
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      uah: { uk: "грн", en: "UAH" }
    title:
      uk: "Набір форматерів"
      en: "A set of formatters"
    instructions:
      uk: |
        Допиши чотири функції для бажання `item`:

        1. `formatWith(record, formatter)` викликає `formatter` із записом і повертає результат.
        2. `shortLabel(record)` повертає лише назву: «Навушники».
        3. `longLabel(record)` повертає назву й ціну: «Навушники — 80 грн».
        4. `withSuffix(formatter, suffix)` повертає **новий** форматер, який додає `suffix` до результату `formatter`.

        Рядки з `console.log` унизу вже готові: має вийти «Навушники», «Навушники — 80 грн» і «Навушники ★».
      en: |
        Finish four functions for the wish `item`:

        1. `formatWith(record, formatter)` calls `formatter` with the record and returns the result.
        2. `shortLabel(record)` returns only the name: “Headphones”.
        3. `longLabel(record)` returns the name and the price: “Headphones — 80 UAH”.
        4. `withSuffix(formatter, suffix)` returns a **new** formatter that adds `suffix` to the result of `formatter`.

        The `console.log` lines at the bottom are ready: the output must be “Headphones”, “Headphones — 80 UAH” and “Headphones ★”.
    testTitles:
      "runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without errors"
      "formatWith returns what the formatter returns":
        uk: "formatWith повертає те, що повернув форматер"
        en: "formatWith returns what the formatter returns"
      "formatWith calls the formatter once with the record":
        uk: "formatWith викликає форматер один раз і передає йому запис"
        en: "formatWith calls the formatter once with the record"
      "shortLabel and longLabel build the two labels":
        uk: "shortLabel і longLabel будують обидва підписи"
        en: "shortLabel and longLabel build the two labels"
      "withSuffix returns a new function":
        uk: "withSuffix повертає нову функцію"
        en: "withSuffix returns a new function"
      "withSuffix does not call the formatter right away":
        uk: "withSuffix не викликає форматер одразу"
        en: "withSuffix does not call the formatter right away"
      "the new formatter adds the suffix":
        uk: "Новий форматер додає suffix до результату"
        en: "The new formatter adds the suffix to the result"
      "prints the three labels":
        uk: "Виводить три підписи"
        en: "Prints the three labels"
    hints:
      nudge:
        uk: "`formatWith` — це один рядок: виклич те, що прийшло в `formatter`, і поверни результат. Для `withSuffix` подивись, як побудована `inBrackets` у поясненні вище."
        en: "`formatWith` is one line: call whatever arrived in `formatter` and return the result. For `withSuffix` look at how `inBrackets` in the explanation above is built."
      explanation:
        uk: "`formatWith` робить те саме, що `printWith` з прикладу, тільки **повертає** результат форматера, а не друкує його. `shortLabel` і `longLabel` читають поля запису `name` і `price`. `withSuffix` будується як `inBrackets`: повертає нову стрілкову функцію, яка викликає `formatter` лише тоді, коли викличуть її саму. Різниця лише в тому, що текст додається в кінці і його теж передають у `withSuffix`, тож він також чекає в closure."
        en: "`formatWith` does what `printWith` in the example does, only it **returns** the formatter’s result instead of printing it. `shortLabel` and `longLabel` read the record’s `name` and `price` fields. `withSuffix` is built like `inBrackets`: it returns a new arrow function that calls `formatter` only when it is itself called. The only difference is that the text goes at the end and is passed to `withSuffix` too, so it also waits in the closure."
    solutionNote:
      uk: "`formatWith` не знає, як форматувати, — вона викликає те, що отримала. `withSuffix` будує нову функцію з чужої: `formatter` і `suffix` лежать у closure нової функції й використовуються лише тоді, коли її викликають. Тому `starred` можна передати у `formatWith` так само, як `shortLabel`."
      en: "`formatWith` does not know how to format — it calls what it received. `withSuffix` builds a new function out of another one: `formatter` and `suffix` sit in the new function’s closure and are used only when it is called. That is why `starred` can be passed to `formatWith` just like `shortLabel`."
    feedback:
      - when: { error: TypeError }
        message:
          uk: "`TypeError` означає, що десь викликають не функцію (`… is not a function`) або читають поле в `undefined` (`Cannot read properties of undefined`). Найчастіше `withSuffix` повертає не функцію або нова функція викликає `formatter` без запису: вона має передати йому той запис, який отримала сама."
          en: "A `TypeError` means that something which is not a function is called (`… is not a function`) or a field is read from `undefined` (`Cannot read properties of undefined`). Most often `withSuffix` does not return a function, or the new function calls `formatter` without a record: it must pass on the record it received itself."
      - when: { test: "formatWith returns what the formatter returns" }
        message:
          uk: "`formatWith` має **викликати** `formatter` із записом і повернути те, що він поверне, — не саму функцію і не `undefined`."
          en: "`formatWith` must **call** `formatter` with the record and return what it returns — not the function itself and not `undefined`."
      - when: { test: "withSuffix does not call the formatter right away" }
        message:
          uk: "`withSuffix` не має викликати `formatter` сама: вона лише повертає нову функцію, а та викличе `formatter` пізніше — коли викличуть її саму, з її власним записом."
          en: "`withSuffix` must not call `formatter` itself: it only returns a new function, and that one calls `formatter` later — when it is itself called, with its own record."
      - when: { test: "the new formatter adds the suffix" }
        message:
          uk: "Новий форматер має викликати `formatter` із **тим записом, який отримав сам**, і додати `suffix` у кінці."
          en: "The new formatter must call `formatter` with **the record it receives itself** and add `suffix` at the end."

  - id: to-project
    kind: transfer
    capstoneStep: JS-03
    body:
      uk: "У кроці проєкту сторінка викликатиме функції форматування. Коли захочеш показати той самий запис по-різному — коротко в списку і детально в картці, — передавай потрібний форматер, а не дублюй код."
      en: "In the project step the page will call formatting functions. When you want to show the same record in different ways — briefly in a list, in detail on a card — pass the formatter you need instead of duplicating code."
