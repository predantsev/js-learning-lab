id: js-03-02-parameters-default-rest
unit: JS-03
title:
  uk: "Параметри: значення за замовчуванням, rest і arguments"
  en: "Parameters: defaults, rest, arguments"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачити значення параметра, коли аргумент пропущено або передано `undefined`, `null` чи `\"\"`, — із запасним значенням і без нього."
    en: "Predict a parameter’s value when its argument is missing, `undefined`, `null` or `\"\"`, with and without a default."
  - uk: "Зібрати будь-яку кількість додаткових аргументів rest-параметром і прочитати їх кількість."
    en: "Collect any number of extra arguments with a rest parameter and read how many there are."
  - uk: "Упізнати застарілий об’єкт `arguments` у старому коді й пояснити, чому його замінює rest-параметр."
    en: "Recognize the legacy `arguments` object in old code and explain why a rest parameter replaces it."
prerequisites: [js-03-01-functions-and-return, js-02-04-nullish-optional-chaining]
subskills:
  - { family: J-04, skill: "parameters/default/rest/arguments", depth: intro }
glossary: [default-parameter, rest-parameter, arguments-object]
selfCheck: [which-default, label-and-extras]

blocks:
  - id: by-position
    kind: explanation
    title:
      uk: "Аргументи потрапляють у параметри за порядком"
      en: "Arguments fill parameters in order"
    body:
      uk: |
        Аргументи потрапляють у параметри **за порядком**: перший — у перший параметр, другий — у другий.

        ```js
        function describe(name, price) {
          return name + ": " + price;
        }

        describe("Лампа", 45); // name = "Лампа", price = 45
        ```

        А що, як під час виклику передати менше аргументів, ніж є параметрів, або більше? Багато хто вважає, що тоді JavaScript зупиниться з помилкою. Перевір себе, перш ніж читати далі.
      en: |
        Arguments land in parameters **in order**: the first one in the first parameter, the second one in the second.

        ```js
        function describe(name, price) {
          return name + ": " + price;
        }

        describe("Lamp", 45); // name = "Lamp", price = 45
        ```

        But what if a call passes fewer arguments than there are parameters, or more? Many people expect JavaScript to stop with an error. Check yourself before reading on.

  - id: fewer-or-more
    kind: prediction
    strings:
      lamp: { uk: "Лампа", en: "Lamp" }
      home: { uk: "Дім", en: "Home" }
    prompt:
      uk: "Функцію з двома параметрами викликають з одним аргументом, а потім із трьома. Що з’явиться в консолі?"
      en: "A function with two parameters is called with one argument and then with three. What appears in the console?"
    code: |
      function describe(name, price) {
        return name + ": " + price;
      }

      console.log(describe("%%lamp%%"));
      console.log(describe("%%lamp%%", 45, "%%home%%"));
    verify:
      logs: ["%%lamp%%: undefined", "%%lamp%%: 45"]
    answer:
      type: choice
      options:
        - id: undefined-and-ignored
          text:
            uk: "`Лампа: undefined`, потім `Лампа: 45`"
            en: "`Lamp: undefined`, then `Lamp: 45`"
        - id: error-fewer
          text:
            uk: "Помилка вже на першому виклику: бракує аргументу"
            en: "An error on the very first call: an argument is missing"
          why:
            uk: "Нестача аргументів — не помилка. Параметр, якому аргументу не дісталося, отримує `undefined`."
            en: "Missing arguments are not an error. A parameter that gets no argument receives `undefined`."
        - id: error-more
          text:
            uk: "`Лампа: undefined`, а на другому виклику — помилка через зайвий аргумент"
            en: "`Lamp: undefined`, then an error on the second call because of the extra argument"
          why:
            uk: "Зайвий аргумент — теж не помилка. Для нього немає параметра, тож функція його просто не бачить."
            en: "An extra argument is not an error either. There is no parameter for it, so the function simply does not see it."
        - id: blank-and-appended
          text:
            uk: "`Лампа: `, потім `Лампа: 45 Дім`"
            en: "`Lamp: `, then `Lamp: 45 Home`"
          why:
            uk: "`undefined`, доданий до тексту, стає словом `undefined`, а не зникає. А третій аргумент нікуди не потрапляє: параметрів лише два."
            en: "`undefined` added to text becomes the word `undefined`; it does not vanish. And the third argument goes nowhere: there are only two parameters."
      correct: [undefined-and-ignored]
    explanation:
      uk: "JavaScript не перевіряє кількість аргументів. У першому виклику `price` нічого не отримав, тому дорівнює `undefined`, і в тексті з’являється слово `undefined`. У другому зайвий аргумент «Дім» не має свого параметра й ігнорується. Стежити, щоб функція отримала все потрібне, — твоя справа."
      en: "JavaScript does not check how many arguments arrive. In the first call `price` got nothing, so it is `undefined`, and the word `undefined` appears in the text. In the second call the extra argument “Home” has no parameter and is ignored. Making sure a function gets what it needs is your job."

  - id: default-values
    kind: explanation
    title:
      uk: "Запасне значення параметра"
      en: "A fallback value for a parameter"
    body:
      uk: |
        Щоб пропущений аргумент не перетворювався на `undefined`, параметрові дають [[default-parameter|значення за замовчуванням]] — просто в дужках, після `=`:

        ```js
        function categoryLabel(category = "без категорії") {
          return "Категорія: " + category;
        }

        categoryLabel("Дім"); // "Категорія: Дім"
        categoryLabel();      // "Категорія: без категорії"
        ```

        Запасне значення спрацьовує, коли аргументу «немає». Але що саме JavaScript вважає за «немає»? Лише пропущений аргумент — чи також `undefined`, `null` і порожній рядок? Від відповіді залежить, що побачить користувач.
      en: |
        To keep a missing argument from turning into `undefined`, give the parameter a [[default-parameter|default value]] — right in the brackets, after `=`:

        ```js
        function categoryLabel(category = "no category") {
          return "Category: " + category;
        }

        categoryLabel("Home"); // "Category: Home"
        categoryLabel();       // "Category: no category"
        ```

        The fallback kicks in when the argument is “not there”. But what exactly counts as “not there” for JavaScript? Only a skipped argument — or also `undefined`, `null` and an empty string? The answer decides what the user sees.

  - id: which-default
    kind: prediction
    strings:
      prefix: { uk: "Категорія: ", en: "Category: " }
      none: { uk: "без категорії", en: "no category" }
    prompt:
      uk: "Ту саму функцію викликають чотирма способами. Що з’явиться в консолі?"
      en: "The same function is called in four ways. What appears in the console?"
    code: |
      function categoryLabel(category = "%%none%%") {
        return "%%prefix%%" + category;
      }

      console.log(categoryLabel());
      console.log(categoryLabel(undefined));
      console.log(categoryLabel(null));
      console.log(categoryLabel(""));
    verify:
      logs: ["%%prefix%%%%none%%", "%%prefix%%%%none%%", "%%prefix%%null", "%%prefix%%"]
    answer:
      type: choice
      options:
        - id: only-undefined
          text:
            uk: "Двічі «Категорія: без категорії», потім «Категорія: null» і «Категорія: » без нічого"
            en: "“Category: no category” twice, then “Category: null” and “Category: ” with nothing after it"
        - id: every-empty
          text:
            uk: "Чотири рази «Категорія: без категорії»"
            en: "“Category: no category” four times"
          why:
            uk: "Запасне значення параметра реагує лише на `undefined`. `null` і `\"\"` — справжні значення, які хтось передав навмисно, тому вони потрапляють у параметр як є."
            en: "A default parameter reacts only to `undefined`. `null` and `\"\"` are real values somebody passed on purpose, so they land in the parameter as they are."
        - id: explicit-undefined-kept
          text:
            uk: "«Категорія: без категорії», «Категорія: undefined», «Категорія: null», «Категорія: »"
            en: "“Category: no category”, “Category: undefined”, “Category: null”, “Category: ”"
          why:
            uk: "Передати `undefined` явно — те саме, що нічого не передати: параметр отримує `undefined`, і запасне значення спрацьовує."
            en: "Passing `undefined` explicitly is the same as passing nothing: the parameter receives `undefined`, and the default kicks in."
        - id: null-replaced
          text:
            uk: "Тричі «Категорія: без категорії», потім «Категорія: »"
            en: "“Category: no category” three times, then “Category: ”"
          why:
            uk: "`null` — це не `undefined`. Запасне значення параметра його не замінює; так робить `??`, а не значення за замовчуванням."
            en: "`null` is not `undefined`. A default parameter does not replace it; `??` would, a default value does not."
      correct: [only-undefined]
    explanation:
      uk: "Значення за замовчуванням спрацьовує лише тоді, коли параметр отримав би `undefined`: аргумент пропущено або передано `undefined`. `null` і порожній рядок — справжні значення, тому вони потрапляють у підпис як є. Якщо треба замінити й `null`, усередині функції використовують `??` — спробуй це в наступному прикладі."
      en: "A default value is used only when the parameter would receive `undefined`: the argument is skipped or passed as `undefined`. `null` and an empty string are real values, so they go into the label as they are. To replace `null` too, use `??` inside the function — try it in the next example."

  - id: default-vs-nullish
    kind: example
    runtime: browser-js
    dir: default-vs-nullish
    entry: index.js
    strings:
      prefix: { uk: "Категорія: ", en: "Category: " }
      none: { uk: "без категорії", en: "no category" }
      home: { uk: "Дім", en: "Home" }
    title:
      uk: "Значення за замовчуванням чи ??"
      en: "A default value or ??"
    body:
      uk: |
        У списку бажань категорія може бути `null` — так позначено «навмисно без категорії». З запасним значенням параметра така річ отримує підпис «Категорія: null». Натисни **Запустити** й переконайся.
      en: |
        In the wishlist a category can be `null` — that marks “deliberately without a category”. With a default parameter such a thing gets the label “Category: null”. Press **Run** and see for yourself.
    tryIt:
      uk: "Прибери `= \"без категорії\"` із дужок, а в тілі напиши `return \"Категорія: \" + (category ?? \"без категорії\");`. Запусти знову: тепер і `null` отримує «без категорії». Додай виклик `categoryLabel(\"\")` — порожній рядок `??` не замінить: для нього це теж справжнє значення."
      en: "Remove `= \"no category\"` from the brackets and write `return \"Category: \" + (category ?? \"no category\");` in the body. Run again: now `null` gets “no category” too. Add the call `categoryLabel(\"\")` — `??` does not replace an empty string: to it, that is a real value as well."

  - id: recall
    kind: review
    title:
      uk: "Згадай: || і ??"
      en: "Recall: || and ??"
    strings:
      noPrice: { uk: "без ціни", en: "no price" }
    items:
      - id: zero-price
        from: js-02-04-nullish-optional-chaining
        prompt:
          uk: "Річ безкоштовна: її ціна — `0`. Що виведуть ці два рядки?"
          en: "The thing is free: its price is `0`. What do these two lines print?"
        code: |
          const price = 0;
          console.log(price || "%%noPrice%%");
          console.log(price ?? "%%noPrice%%");
        verify:
          logs: ["%%noPrice%%", "0"]
        answer:
          type: choice
          options:
            - id: or-replaces
              text:
                uk: "«без ціни», потім `0`"
                en: "“no price”, then `0`"
            - id: both-zero
              text:
                uk: "`0` двічі"
                en: "`0` twice"
              why:
                uk: "`||` бере запасне значення для будь-якого хибного значення, а `0` — хибне. Тому перший рядок виводить «без ціни»."
                en: "`||` uses the fallback for any falsy value, and `0` is falsy. So the first line prints “no price”."
            - id: both-fallback
              text:
                uk: "«без ціни» двічі"
                en: "“no price” twice"
              why:
                uk: "`??` замінює лише `null` і `undefined`. Для нього `0` — нормальна ціна."
                en: "`??` replaces only `null` and `undefined`. To it, `0` is a normal price."
            - id: swapped
              text:
                uk: "`0`, потім «без ціни»"
                en: "`0`, then “no price”"
              why:
                uk: "Навпаки: `||` реагує на всі хибні значення, зокрема `0`, а `??` — лише на `null` і `undefined`."
                en: "The other way round: `||` reacts to every falsy value, `0` included, while `??` reacts only to `null` and `undefined`."
          correct: [or-replaces]
        explanation:
          uk: "`||` бере правий бік, коли лівий **хибний**: `0`, `\"\"`, `null`, `undefined`, `NaN`, `false`. `??` бере його лише для `null` і `undefined`. Значення за замовчуванням ще вибагливіше: тільки `undefined`. Обирай інструмент за тим, що для тебе означає «значення немає»."
          en: "`||` takes the right side when the left one is **falsy**: `0`, `\"\"`, `null`, `undefined`, `NaN`, `false`. `??` takes it only for `null` and `undefined`. A default parameter is pickier still: only `undefined`. Choose the tool by what “no value” means for you."

  - id: rest-and-arguments
    kind: explanation
    title:
      uk: "Скільки завгодно аргументів: rest"
      en: "Any number of arguments: rest"
    body:
      uk: |
        Іноді функція має приймати **будь-яку** кількість значень. Для цього є [[rest-parameter|rest-параметр]]:

        ```js
        function countExtras(first, ...rest) {
          return rest.length;
        }

        countExtras("a", "b", "c"); // 2
        countExtras("a");           // 0
        ```

        Три крапки перед останнім параметром збирають решту аргументів в один список — масив (масиви детально розберемо в JS-04). `rest.length` — їх кількість. Якщо зайвих аргументів немає, список порожній, а не `undefined`.

        У старому коді замість цього трапляється [[arguments-object|об’єкт arguments]]: усередині звичайної функції він містить **усі** аргументи. Його не видно в заголовку функції, а в стрілкових функціях (наступний урок) його взагалі немає. Тому в новому коді пишуть rest.
      en: |
        Sometimes a function has to accept **any** number of values. That is what a [[rest-parameter]] is for:

        ```js
        function countExtras(first, ...rest) {
          return rest.length;
        }

        countExtras("a", "b", "c"); // 2
        countExtras("a");           // 0
        ```

        Three dots before the last parameter collect all the remaining arguments into one list — an array (arrays get a closer look in JS-04). `rest.length` is how many there are. With no extra arguments the list is empty, not `undefined`.

        Old code uses the [[arguments-object|arguments object]] instead: inside a regular function it holds **all** the arguments. It is invisible in the function header, and arrow functions (next lesson) do not have it at all. That is why new code uses rest.

  - id: why-rest
    kind: prediction
    prompt:
      uk: "У старому коді ти бачиш `function total() { … arguments … }`. Чому в новому коді пишуть `function total(...prices)`?"
      en: "In old code you see `function total() { … arguments … }`. Why does new code write `function total(...prices)` instead?"
    answer:
      type: choice
      options:
        - id: visible-and-works-everywhere
          text:
            uk: "Rest-параметр видно просто в заголовку, це звичайний список, і він працює також у стрілкових функціях"
            en: "The rest parameter is visible right in the header, it is an ordinary list, and it works in arrow functions too"
        - id: arguments-removed
          text:
            uk: "`arguments` більше не працює в сучасних браузерах"
            en: "`arguments` no longer works in modern browsers"
          why:
            uk: "Працює: у звичайних функціях `arguments` досі є, тому ти й зустрінеш його в старому коді. Справа в ясності, а не в тому, що його прибрали."
            en: "It does: regular functions still have `arguments`, which is why you will meet it in old code. The reason is clarity, not removal."
        - id: rest-takes-first
          text:
            uk: "Rest-параметр збирає також перший аргумент, а `arguments` — ні"
            en: "A rest parameter collects the first argument too, `arguments` does not"
          why:
            uk: "Навпаки: `arguments` містить усі аргументи, а `...rest` — лише ті, що не потрапили в параметри перед ним."
            en: "The other way round: `arguments` holds every argument, while `...rest` holds only those that did not land in the parameters before it."
      correct: [visible-and-works-everywhere]
    explanation:
      uk: "Обидва способи працюють, але rest-параметр чесніший: із заголовка `function total(...prices)` одразу видно, що функція приймає скільки завгодно цін. `prices` — звичайний масив, а rest можна написати в будь-якій функції, зокрема стрілковій."
      en: "Both work, but a rest parameter is more honest: the header `function total(...prices)` tells at once that the function accepts any number of prices. `prices` is an ordinary array, and rest can be written in any function, arrow functions included."

  - id: label-and-extras
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: label-and-extras
    entry: index.js
    strings:
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      juice: { uk: "Сік", en: "Juice" }
      bread: { uk: "Хліб", en: "Bread" }
      pcs: { uk: "шт.", en: "pcs" }
      liters: { uk: "л", en: "l" }
    title:
      uk: "Одиниця за замовчуванням і зайві аргументи"
      en: "A default unit and extra arguments"
    instructions:
      uk: |
        Допиши дві функції для списку покупок.

        1. `makeLabel(name, unit)` повертає «назва (одиниця)». Якщо одиницю не передали, хай буде «шт.»: `makeLabel("Лампочки")` → «Лампочки (шт.)».
        2. `countExtras(first, …)` повертає, скільки аргументів прийшло **після** першого: `countExtras("Лампочки", "Сік", "Хліб")` → `2`, а `countExtras("Лампочки")` → `0`.

        Виклики внизу вже готові: запусти програму й порівняй п’ять рядків у консолі з тим, що мало б вийти.
      en: |
        Finish two functions for a shopping list.

        1. `makeLabel(name, unit)` returns “name (unit)”. When no unit is given, use “pcs”: `makeLabel("Light bulbs")` → “Light bulbs (pcs)”.
        2. `countExtras(first, …)` returns how many arguments came **after** the first one: `countExtras("Light bulbs", "Juice", "Bread")` → `2`, and `countExtras("Light bulbs")` → `0`.

        The calls at the bottom are ready: run the program and compare the five console lines with what they should be.
    testTitles:
      "runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without errors"
      "uses the default unit when it is missing":
        uk: "Без одиниці підпис отримує «шт.»"
        en: "Without a unit the label gets “pcs”"
      "uses the unit it is given":
        uk: "Передана одиниця потрапляє в підпис"
        en: "A given unit ends up in the label"
      "counts only the arguments after the first":
        uk: "Рахує лише аргументи після першого"
        en: "Counts only the arguments after the first"
      "gives 0 when there is nothing after the first argument":
        uk: "Дає 0, коли після першого аргументу нічого немає"
        en: "Gives 0 when nothing follows the first argument"
      "prints the five results":
        uk: "Виводить п’ять очікуваних рядків"
        en: "Prints the five expected lines"
    hints:
      nudge:
        uk: "Обидві функції змінюються в заголовку — у дужках з параметрами. У `countExtras` зміниться ще рядок із `return`."
        en: "Both functions change in the header — in the brackets with the parameters. In `countExtras` the `return` line changes as well."
      explanation:
        uk: "У `makeLabel` додай параметрові запасне значення: `unit = \"шт.\"`. У `countExtras` після `first` додай rest-параметр `...rest` і поверни `rest.length`."
        en: "In `makeLabel` give the parameter a fallback: `unit = \"pcs\"`. In `countExtras` add the rest parameter `...rest` after `first` and return `rest.length`."
    solutionNote:
      uk: "Значення за замовчуванням заповнює пропущений аргумент, тож `makeLabel(\"Лампочки\")` отримує «шт.». Rest-параметр `...rest` збирає все, що прийшло після `first`, в один список; його довжина — кількість «зайвих» аргументів, навіть коли їх нуль."
      en: "The default value fills in a skipped argument, so `makeLabel(\"Light bulbs\")` gets “pcs”. The rest parameter `...rest` collects everything after `first` into one list; its length is the number of extra arguments, even when there are none."
    feedback:
      - when: { test: "uses the default unit when it is missing" }
        message:
          uk: "Без другого аргументу `unit` дорівнює `undefined`, тому в підписі з’являється «(undefined)». Дай параметрові запасне значення просто в дужках: `unit = \"шт.\"`."
          en: "Without a second argument `unit` is `undefined`, so “(undefined)” appears in the label. Give the parameter a fallback right in the brackets: `unit = \"pcs\"`."
      - when: { test: "counts only the arguments after the first" }
        message:
          uk: "Перший аргумент не рахується. Залиш `first` окремим параметром, а після нього додай `...rest` і поверни `rest.length`."
          en: "The first argument does not count. Keep `first` as its own parameter, then add `...rest` after it and return `rest.length`."
      - when: { test: "gives 0 when there is nothing after the first argument" }
        message:
          uk: "Коли після першого аргументу нічого немає, rest-параметр — порожній список, і `rest.length` уже дорівнює `0`. Нічого не віднімай і не додавай вручну."
          en: "When nothing follows the first argument, the rest parameter is an empty list and `rest.length` is already `0`. Do not subtract or add anything by hand."

  - id: to-project
    kind: transfer
    capstoneStep: JS-03
    body:
      uk: "У кроці проєкту твої функції форматування можуть мати параметри із запасними значеннями — наприклад, текст для відсутньої ціни чи терміну. Пам’ятай: значення за замовчуванням не замінює `null`; для полів, де `null` означає «немає», потрібен `??`."
      en: "In the project step your formatting functions can have parameters with fallback values — for example, the text for a missing price or due date. Remember: a default value does not replace `null`; fields where `null` means “none” need `??`."
