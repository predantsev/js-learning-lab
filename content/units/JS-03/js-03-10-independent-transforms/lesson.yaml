id: js-03-10-independent-transforms
unit: JS-03
title:
  uk: "Самостійно: перевикористовувані перетворення й обмежений обхід дерева"
  en: "Independent: reusable transforms and a bounded tree walk"
kind: assessment
minutes: 25
contentVersion: 1
purpose:
  uk: "Перевірити без підказок, чи вмієш ти поєднувати все з цього розділу: значення за замовчуванням і rest-параметри, стрілкові функції, чисті функції, callback-и й рекурсію з обмеженням глибини. Результат покаже, чи готовий ти переходити до масивів і об’єктів у JS-04."
  en: "Check without hints that you can combine everything from this unit: default values and rest parameters, arrow functions, pure functions, callbacks and recursion with a depth limit. The result shows whether you are ready to move on to arrays and objects in JS-04."
objectives:
  - uk: "Без підказок написати невеликі чисті перетворення зі значеннями за замовчуванням і rest-параметром та поєднати їх через допоміжні функції, що приймають callback-и."
    en: "Implement, without hints, small pure transforms with defaults and a rest parameter, and combine them through callback-taking helpers."
  - uk: "Написати рекурсивний обхід вкладеного дерева з базовим випадком і обмеженням глибини та назвати його найбільшу глибину стеку."
    en: "Implement a recursive walk of a nested synthetic tree with a base case and a depth bound, and state its maximum stack depth."
prerequisites: [js-03-09-debug-captured-bindings]
subskills:
  - { family: J-04, skill: "parameters/default/rest/arguments", depth: assess }
  - { family: J-04, skill: "return and arrow syntax", depth: assess }
  - { family: J-04, skill: "pure/side effects", depth: assess }
  - { family: J-04, skill: "recursion/base case", depth: assess }
  - { family: J-04, skill: "callbacks", depth: assess }
glossary: []

blocks:
  - id: how-this-works
    kind: explanation
    title:
      uk: "Як це працює"
      en: "How this works"
    body:
      uk: |
        Це самостійна робота: підказок немає — лише опис того, що має робити кожна функція. Кнопка «Показати розв’язання» є, але те, що ти його переглянув, позначиться в прогресі, тож спершу спробуй сам. Перевірки запускають твій код на прихованих випадках: пропущених аргументах, `null`, `0`, порожньому рядку `""`, дуже глибокому дереві.

        Якщо перевірка не пройшла, прочитай її назву: вона каже, яку поведінку перевіряли. Пиши, запускай, викликай свої функції через `console.log` і дивись результат у консолі — це частина роботи, а не підглядання.
      en: |
        This is independent work: there are no hints — only a description of what each function must do. The “Show the solution” button is there, but viewing the solution is recorded in your progress, so try on your own first. The checks run your code on hidden cases: missing arguments, `null`, `0`, an empty string `""`, a very deep tree.

        If a check fails, read its name: it tells you which behavior was checked. Write, run, call your functions with `console.log` and look at the results in the console — that is part of the work, not peeking.

  - id: transforms
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: transforms
    entry: index.js
    strings:
      lamp: { uk: "Лампа", en: "Lamp" }
    title:
      uk: "Чотири перевикористовувані перетворення"
      en: "Four reusable transforms"
    instructions:
      uk: |
        Напиши чотири **чисті стрілкові функції** в `const`. Жодна з них нічого не друкує й не змінює своїх аргументів.

        1. `trimName(name = "")` повертає назву без пробілів на краях (`text.trim()` повертає новий текст без пробілів на краях). Без аргументу — `""`.
        2. `describe(name, ...tags)` повертає обрізану назву й кількість міток у квадратних дужках: `describe("  Лампа ", "дім", "світло")` → `"Лампа [2]"`, `describe("Лампа")` → `"Лампа [0]"`.
        3. `withFallback(fn, fallback)` повертає **нову функцію**. Вона викликає `fn` зі своїм аргументом і повертає результат, а якщо результат — `null` або `undefined`, повертає `fallback`. Результати `0` і `""` — справжні, їх не замінюй.
        4. `compose(f, g)` повертає **нову функцію**, яка спершу викликає `g` зі своїм аргументом, а потім `f` з результатом `g`: `compose(f, g)(x)` — це `f(g(x))`.
      en: |
        Write four **pure arrow functions** in `const`. None of them prints anything or changes its arguments.

        1. `trimName(name = "")` returns the name without spaces at its edges (`text.trim()` returns new text without spaces at its edges). Without an argument it returns `""`.
        2. `describe(name, ...tags)` returns the trimmed name and the number of tags in square brackets: `describe("  Lamp ", "home", "light")` → `"Lamp [2]"`, `describe("Lamp")` → `"Lamp [0]"`.
        3. `withFallback(fn, fallback)` returns a **new function**. It calls `fn` with its own argument and returns the result, but when the result is `null` or `undefined` it returns `fallback`. The results `0` and `""` are real: do not replace them.
        4. `compose(f, g)` returns a **new function** that first calls `g` with its argument and then `f` with `g`’s result: `compose(f, g)(x)` is `f(g(x))`.
    testTitles:
      "runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without errors"
      "trimName removes spaces at the edges only":
        uk: "trimName прибирає пробіли лише на краях"
        en: "trimName removes spaces at the edges only"
      "trimName without a name gives an empty string":
        uk: "trimName без аргументу дає порожній рядок \"\""
        en: "trimName without a name gives an empty string"
      "describe counts the tags":
        uk: "describe рахує мітки"
        en: "describe counts the tags"
      "describe works without tags":
        uk: "describe працює без міток"
        en: "describe works without tags"
      "describe trims the name":
        uk: "describe обрізає пробіли в назві"
        en: "describe trims the name"
      "withFallback returns the result of fn":
        uk: "withFallback повертає результат fn"
        en: "withFallback returns the result of fn"
      "withFallback replaces null and undefined":
        uk: "withFallback замінює null і undefined"
        en: "withFallback replaces null and undefined"
      "withFallback keeps 0 and an empty string":
        uk: "withFallback не замінює 0 і \"\""
        en: "withFallback keeps 0 and \"\""
      "withFallback calls fn only when the new function is called":
        uk: "withFallback викликає fn лише тоді, коли викликають нову функцію"
        en: "withFallback calls fn only when the new function is called"
      "compose calls g first, then f":
        uk: "compose викликає спершу g, потім f"
        en: "compose calls g first, then f"
      "all four are arrow functions":
        uk: "Усі чотири — стрілкові функції"
        en: "All four are arrow functions"
      "nothing is printed and inputs stay unchanged":
        uk: "Нічого не друкується, і вхідні дані не змінюються"
        en: "Nothing is printed and inputs stay unchanged"
    solutionNote:
      uk: "`trimName` спирається на значення за замовчуванням, `describe` — на rest-параметр і `trimName`. `withFallback` і `compose` — функції вищого порядку: вони повертають нові функції, а callback-и, які отримали, викликають лише тоді, коли викликають нову функцію. `??` замінює тільки `null` і `undefined`, тож `0` і `\"\"` лишаються."
      en: "`trimName` relies on a default value, `describe` on a rest parameter and `trimName`. `withFallback` and `compose` are higher-order functions: they return new functions and call the callbacks they received only when the new function is called. `??` replaces only `null` and `undefined`, so `0` and `\"\"` stay."
    feedback:
      - when: { error: TypeError }
        message:
          uk: "`TypeError`: десь викликають не функцію або беруть метод у `undefined`. Перевір, що кожна функція повертає, коли її викликають без аргументів, і що `withFallback` та `compose` повертають функції."
          en: "`TypeError`: something that is not a function is being called, or a method is taken from `undefined`. Check what each function returns when called without arguments, and that `withFallback` and `compose` return functions."
      - when: { test: "trimName without a name gives an empty string" }
        message:
          uk: "`trimName()` без аргументу має повернути порожній рядок `\"\"`. Якщо бачиш `Cannot read properties of undefined (reading 'trim')`, параметр `name` отримав `undefined`, а в `undefined` немає `.trim()`."
          en: "`trimName()` without an argument must return an empty string `\"\"`. If you see `Cannot read properties of undefined (reading 'trim')`, the parameter `name` received `undefined`, and `undefined` has no `.trim()`."
      - when: { test: "withFallback keeps 0 and an empty string" }
        message:
          uk: "`0` і `\"\"` — справжні результати. Замінювати можна лише `null` і `undefined`."
          en: "`0` and `\"\"` are real results. Only `null` and `undefined` may be replaced."
      - when: { test: "withFallback calls fn only when the new function is called" }
        message:
          uk: "`withFallback` має лише повернути нову функцію. Викликати `fn` буде вже ця нова функція — тоді, коли викличуть її саму, і з її власним аргументом."
          en: "`withFallback` must only return a new function. That new function is the one that calls `fn` — when it is itself called, with its own argument."
      - when: { test: "all four are arrow functions" }
        message:
          uk: "Завдання просить чотири **стрілкові** функції, збережені в `const`. Якщо програма зупиняється з помилкою, перевірка не дістається до функцій — спершу виправ помилку."
          en: "The task asks for four **arrow** functions stored in `const`. If the program stops with an error, the check cannot reach the functions — fix the error first."
      - when: { test: "compose calls g first, then f" }
        message:
          uk: "`compose(f, g)(x)` має дорівнювати `f(g(x))`: першою працює функція, що стоїть праворуч."
          en: "`compose(f, g)(x)` must equal `f(g(x))`: the function on the right runs first."
      - when: { test: "nothing is printed and inputs stay unchanged" }
        message:
          uk: "Чисті функції нічого не друкують і не змінюють переданих даних."
          en: "Pure functions print nothing and do not change the data they receive."

  - id: recall
    kind: review
    title:
      uk: "Згадай: «немає значення» — це не нуль"
      en: "Recall: “no value” is not zero"
    items:
      - id: missing-or-real
        from: js-02-11-independent-validation
        prompt:
          uk: "Ця перевірка відрізняє відсутнє значення від справжнього. Що виведе програма?"
          en: "This check tells a missing value from a real one. What does the program print?"
        code: |
          function hasValue(value) {
            return value !== null && value !== undefined;
          }

          console.log(hasValue(0));
          console.log(hasValue(""));
          console.log(hasValue(null));
        verify:
          logs: ["true", "true", "false"]
        answer:
          type: choice
          options:
            - id: only-null-missing
              text: { uk: "`true`, `true`, `false`", en: "`true`, `true`, `false`" }
            - id: falsy-missing
              text: { uk: "`false`, `false`, `false`", en: "`false`, `false`, `false`" }
              why:
                uk: "Функція не перевіряє правдивість: вона порівнює лише з `null` і `undefined`. `0` і `\"\"` не дорівнюють жодному з них."
                en: "The function does not test truthiness: it compares only with `null` and `undefined`. `0` and `\"\"` equal neither."
            - id: empty-string-missing
              text: { uk: "`true`, `false`, `false`", en: "`true`, `false`, `false`" }
              why:
                uk: "Порожній рядок — теж справжнє значення: `\"\" !== null` і `\"\" !== undefined`."
                en: "An empty string is a real value too: `\"\" !== null` and `\"\" !== undefined`."
          correct: [only-null-missing]
        explanation:
          uk: "`0` і порожній рядок `\"\"` — справжні значення: ціна безкоштовної речі чи навмисно порожня примітка. «Значення немає» — лише `null` і `undefined`. Саме так поводиться `??`, і саме так має поводитися `withFallback`."
          en: "`0` and an empty string are real values: the price of a free thing or a deliberately empty note. “No value” means only `null` and `undefined`. That is how `??` behaves, and that is how `withFallback` must behave."

  - id: count-nodes
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: count-nodes
    entry: index.js
    strings:
      all: { uk: "Усі витрати", en: "All spending" }
      food: { uk: "Їжа", en: "Food" }
      groceries: { uk: "Продукти", en: "Groceries" }
      cafe: { uk: "Кафе", en: "Cafe" }
      transport: { uk: "Транспорт", en: "Transport" }
      transitPass: { uk: "Проїзний", en: "Transit pass" }
    title:
      uk: "Дерево категорій витрат"
      en: "A tree of expense categories"
    instructions:
      uk: |
        Категорії витрат утворюють дерево — вкладені записи-вузли. У кожного вузла є `label`, а також `left` і `right`: дочірні вузли або `null`, якщо дитини з цього боку немає. Верхній вузол дерева називають коренем.

        Напиши рекурсивну функцію `countNodes(node, maxDepth)`. Вона рахує вузли дерева, але лише на перших `maxDepth` рівнях (корінь — рівень 1):

        - `countNodes(spending, 10)` → `6`;
        - `countNodes(spending, 2)` → `3`;
        - `countNodes(null, 5)` → `0`.

        Функція чиста: нічого не друкує й не змінює дерево. Приховані перевірки містять порожнє дерево, один вузол і дерево, глибше за обмеження.
      en: |
        Expense categories form a tree — nested node records. Every node has a `label` and also `left` and `right`: child nodes, or `null` when there is no child on that side. The top node of the tree is called the root.

        Write a recursive function `countNodes(node, maxDepth)`. It counts the nodes of the tree, but only on the first `maxDepth` levels (the root is level 1):

        - `countNodes(spending, 10)` → `6`;
        - `countNodes(spending, 2)` → `3`;
        - `countNodes(null, 5)` → `0`.

        The function is pure: it prints nothing and does not change the tree. The hidden checks include an empty tree, a single node and a tree deeper than the limit.
    testTitles:
      "runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without errors"
      "an empty tree has 0 nodes":
        uk: "У порожньому дереві 0 вузлів"
        en: "An empty tree has 0 nodes"
      "a single node counts as 1":
        uk: "Один вузол — це 1"
        en: "A single node counts as 1"
      "counts every node of a small tree":
        uk: "Рахує всі вузли невеликого дерева"
        en: "Counts every node of a small tree"
      "counts only the first maxDepth levels":
        uk: "Рахує лише перші maxDepth рівнів"
        en: "Counts only the first maxDepth levels"
      "counts both sides of the tree":
        uk: "Рахує обидві гілки дерева"
        en: "Counts both sides of the tree"
      "stops at the bound on a tree deeper than maxDepth":
        uk: "Зупиняється на обмеженні, коли дерево глибше за maxDepth"
        en: "Stops at the bound on a tree deeper than maxDepth"
      "nothing is printed and the tree stays unchanged":
        uk: "Нічого не друкується, і дерево не змінюється"
        en: "Nothing is printed and the tree stays unchanged"
    solutionNote:
      uk: "Два базові випадки: «вузла немає» (`null`) і «рівнів не лишилося» (`maxDepth` дорівнює `0`). Рекурсивний випадок: `1` за поточний вузол плюс вузли лівої та правої гілок із запасом `maxDepth - 1`. Обмеження глибини гарантує, що в стеку не більше ніж `maxDepth + 1` кадрів, навіть якщо дерево величезне."
      en: "Two base cases: “no node” (`null`) and “no levels left” (`maxDepth` is `0`). The recursive case: `1` for the current node plus the nodes of the left and right branches with `maxDepth - 1` levels left. The depth limit guarantees no more than `maxDepth + 1` frames on the stack, even for a huge tree."
    feedback:
      - when: { error: TypeError }
        message:
          uk: "Якщо `TypeError` каже `Cannot read properties of null`, функція звернулася до поля вузла, якого немає. Що має статися, коли вузла немає?"
          en: "If the `TypeError` says `Cannot read properties of null`, the function read a field of a node that does not exist. What should happen when there is no node?"
      - when: { test: "counts only the first maxDepth levels" }
        message:
          uk: "Корінь — рівень 1: з `maxDepth = 1` рахується лише корінь, з `maxDepth = 2` — корінь і його діти, а з `maxDepth = 0` — нічого."
          en: "The root is level 1: with `maxDepth = 1` only the root counts, with `maxDepth = 2` the root and its children, and with `maxDepth = 0` nothing."
      - when: { test: "counts both sides of the tree" }
        message:
          uk: "У вузла можуть бути діти з обох боків — і в `left`, і в `right`. Ця перевірка бере дерево, у якого всі діти праворуч, і чекає `3`."
          en: "A node can have children on both sides — in `left` and in `right`. This check takes a tree whose children are all on the right and expects `3`."
      - when: { error: RangeError }
        message:
          uk: "`Maximum call stack size exceeded`: рекурсія не зупиняється. Перевір обидва базові випадки й те, що обмеження зменшується з кожним рівнем."
          en: "`Maximum call stack size exceeded`: the recursion does not stop. Check both base cases and that the limit decreases with every level."

  - id: arrow-arguments
    kind: prediction
    prompt:
      uk: "Хтось переписав стару функцію з `arguments` на стрілкову. Що станеться?"
      en: "Someone rewrote an old function that uses `arguments` as an arrow function. What happens?"
    code: |
      const countAll = () => arguments.length;

      console.log(countAll(1, 2, 3));
    verify:
      logs: []
      error: ReferenceError
    answer:
      type: choice
      options:
        - id: three
          text: { uk: "Виведе `3`", en: "It prints `3`" }
          why:
            uk: "Стрілкові функції не мають власного `arguments`. Тут, на верхньому рівні файла, такої назви немає взагалі."
            en: "Arrow functions have no `arguments` of their own. Here, at the top level of the file, the name does not exist at all."
        - id: zero
          text: { uk: "Виведе `0`", en: "It prints `0`" }
          why:
            uk: "Аргументи передано, але стрілкова функція не має об’єкта `arguments`, через який до них можна дістатися."
            en: "Arguments were passed, but an arrow function has no `arguments` object to reach them through."
        - id: reference-error
          text:
            uk: "`ReferenceError: arguments is not defined`"
            en: "`ReferenceError: arguments is not defined`"
      correct: [reference-error]
    explanation:
      uk: "Об’єкт `arguments` є лише у звичайних функціях. У стрілковій функції назва `arguments` шукається назовні, а на верхньому рівні модуля її немає — `ReferenceError`. Саме тому старий код переписують на rest-параметр: `const countAll = (...values) => values.length;`."
      en: "Only regular functions have an `arguments` object. In an arrow function the name `arguments` is looked up outside, and at the top level of a module it does not exist — a `ReferenceError`. That is exactly why old code is rewritten with a rest parameter: `const countAll = (...values) => values.length;`."

  - id: stack-depth
    kind: prediction
    prompt:
      uk: "Дерево `spending` має три рівні: «Усі витрати» → «Їжа» і «Транспорт» → «Продукти», «Кафе» і «Проїзний». Нехай `countNodes` викликає себе спершу для `left`, потім для `right` — навіть коли там `null` (такий виклик одразу повертає `0`). Скільки викликів `countNodes` **щонайбільше лежить у стеку одночасно** під час `countNodes(spending, 10)`? Рахуй і виклики для `null`."
      en: "The tree `spending` has three levels: “All spending” → “Food” and “Transport” → “Groceries”, “Cafe” and “Transit pass”. Suppose `countNodes` calls itself first for `left`, then for `right` — even when it is `null` (such a call returns `0` at once). What is the **largest number of `countNodes` calls on the stack at the same time** during `countNodes(spending, 10)`? Count the calls for `null` too."
    answer:
      type: choice
      options:
        - id: three
          text: { uk: "`3`", en: "`3`" }
          why:
            uk: "Виклики для порожніх дочірніх вузлів — теж справжні виклики: `countNodes(null, …)` кладе кадр поверх кадру «Продуктів», перш ніж повернути `0`."
            en: "Calls for empty children are real calls too: `countNodes(null, …)` puts a frame on top of the “Groceries” frame before it returns `0`."
        - id: four
          text: { uk: "`4`", en: "`4`" }
        - id: six
          text: { uk: "`6`", en: "`6`" }
          why:
            uk: "Кадри гілок «Їжа» й «Транспорт» ніколи не лежать у стеку разом: виклик для лівої гілки завершується, перш ніж почнеться виклик для правої."
            en: "The frames of the “Food” and “Transport” branches are never on the stack together: the call for the left branch finishes before the call for the right one starts."
        - id: thirteen
          text: { uk: "`13`", en: "`13`" }
          why:
            uk: "`13` — стільки викликів відбудеться загалом. Але одночасно в стеку лише ланцюжок від кореня до виклику, що працює зараз."
            en: "`13` is how many calls happen in total. But at any moment the stack holds only the chain from the root to the call that is running."
      correct: [four]
    explanation:
      uk: "Одночасно в стеку лежить лише один ланцюжок — від кореня до виклику, що працює зараз. Найдовший: «Усі витрати» → «Їжа» → «Продукти» → `countNodes(null, 7)`, тобто 4 кадри (під ними ще файл). Загалом викликів 13, але більшість із них завершується раніше, ніж починаються інші. Глибину стеку обмежує висота дерева, а з `maxDepth` — ще й саме обмеження: не більше ніж `maxDepth + 1` кадрів. Якщо твоя функція перевіряє дітей перед викликом і не викликає себе для `null`, найдовший ланцюжок коротший на один кадр — 3."
      en: "At any moment the stack holds only one chain — from the root to the call that is running. The longest one: “All spending” → “Food” → “Groceries” → `countNodes(null, 7)`, that is 4 frames (with the file underneath). There are 13 calls in total, but most of them finish before others start. The stack depth is limited by the height of the tree, and with `maxDepth` also by the limit itself: no more than `maxDepth + 1` frames. If your function checks the children before calling and never calls itself for `null`, the longest chain is one frame shorter — 3."

