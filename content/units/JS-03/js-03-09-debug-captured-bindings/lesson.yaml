  - id: fix-reminders
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: fix-reminders
    entry: index.js
    editable: [index.js]
    strings:
      reminder: { uk: "Нагадування: ", en: "Reminder: " }
      cardPrefix: { uk: "Картка: ", en: "Card: " }
      task1: { uk: "Полити квіти", en: "Water the plants" }
      task2: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      task3: { uk: "Написати бабусі", en: "Write to grandma" }
      tidy: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
      tidyMore: { uk: "Розібрати шафу й випрати штори", en: "Tidy the wardrobe and wash the curtains" }
    title:
      uk: "Нагадування не про ту справу"
      en: "Reminders about the wrong task"
    instructions:
      uk: |
        Ця програма планує нагадування для трьох справ і показує назву картки для справи, яку перейменували. Помилок у консолі немає, але виводить вона не те. Перший рядок бере готові функції з `helpers.js` (цей файл не змінюй): `later` відкладає функцію, `runLater` викликає все відкладене, `taskAt(i)` повертає справу з номером `i`.

        Має вийти:

        ```text
        Нагадування: Полити квіти
        Нагадування: Здати книжки в бібліотеку
        Нагадування: Написати бабусі
        Картка: Розібрати шафу й випрати штори
        ```

        Знайди й виправ обидві помилки. Не змінюй того, що програма має виводити, і не прибирай перейменування справи.
      en: |
        This program schedules reminders for three tasks and shows the card title of a task that was renamed. There are no errors in the console, but the output is wrong. The first line takes ready-made functions from `helpers.js` (do not change that file): `later` puts a function aside, `runLater` calls everything put aside, `taskAt(i)` returns task number `i`.

        The output must be:

        ```text
        Reminder: Water the plants
        Reminder: Return library books
        Reminder: Write to grandma
        Card: Tidy the wardrobe and wash the curtains
        ```

        Find and fix both bugs. Do not change what the program is meant to print, and do not remove the renaming of the task.
    testTitles:
      "runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without errors"
      "every reminder names its own task":
        uk: "Кожне нагадування називає свою справу"
        en: "Every reminder names its own task"
      "the card shows the current title of the task":
        uk: "Картка показує поточну назву справи"
        en: "The card shows the current title of the task"
      "makeCardTitle reads the title when it is called":
        uk: "makeCardTitle читає назву в момент виклику"
        en: "makeCardTitle reads the title when it is called"
      "prints exactly four lines":
        uk: "Виводить рівно чотири рядки"
        en: "Prints exactly four lines"
    hints:
      nudge:
        uk: "Запусти програму й порівняй кожен рядок з тим, що має вийти. Для кожної функції, яку викликають пізніше, спитай: яку змінну вона читає і скільки копій цієї змінної існує?"
        en: "Run the program and compare every line with the expected output. For every function that is called later, ask: which variable does it read, and how many copies of that variable exist?"
      explanation:
        uk: |
          Тут дві окремі помилки:

          - `var task` — одна змінна на весь цикл: кожне нагадування читає її вже після циклу, коли в ній остання справа. Потрібна окрема `task` у кожному проході — така, як `let` чи `const`, оголошені всередині циклу.
          - `makeCardTitle` один раз копіює `record.title` у `title`, і картка назавжди лишається з цією копією. Хай повернена функція читає назву з `record` тоді, коли її викликають.
        en: |
          There are two separate bugs here:

          - `var task` is one variable for the whole loop: every reminder reads it after the loop, when it holds the last task. You need a separate `task` in every pass — like a `let` or `const` declared inside the loop.
          - `makeCardTitle` copies `record.title` into `title` once, and the card is stuck with that copy forever. Let the returned function read the title from `record` when it is called.
    solutionNote:
      uk: "Кожне нагадування тепер пов’язане з `task` свого проходу циклу, тож після циклу читає свою справу. Картка не тримає копії назви: вона пов’язана з `record` і читає `record.title` під час виклику. Заміна лише `var i` на `let i` не допомогла б: нагадування читають `task`, а не `i`."
      en: "Every reminder is now linked to the `task` of its own pass of the loop, so after the loop it reads its own task. The card keeps no copy of the title: it is linked to `record` and reads `record.title` when it is called. Changing only `var i` to `let i` would not help: the reminders read `task`, not `i`."
    feedback:
      - when: { test: "every reminder names its own task" }
        message:
          uk: "Перші три рядки в консолі мають бути нагадуваннями про три **різні** справи. Якщо всі вони про одну, подивись, яку змінну читає нагадування, — не лише `i`. `var task` — одна змінна на весь цикл, тож заміна `var i` на `let i` тут не допоможе: потрібна окрема `task` у кожному проході."
          en: "The first three console lines must be reminders about three **different** tasks. If they are all about one, look at which variable the reminder reads — not just `i`. `var task` is one variable for the whole loop, so changing `var i` to `let i` will not help here: you need a separate `task` in every pass."
      - when: { test: "the card shows the current title of the task" }
        message:
          uk: "Четвертий рядок у консолі має бути «Картка: …» з **новою** назвою справи. Якщо там стара назва, `let` чи `const` тут ні до чого: `makeCardTitle` скопіювала назву в момент створення, а має читати `record.title` тоді, коли картку показують. Перейменування не прибирай — програма має показати нову назву."
          en: "The fourth console line must be “Card: …” with the **new** title of the task. If it shows the old title, `let` or `const` have nothing to do with it: `makeCardTitle` copied the title at creation time, while it should read `record.title` when the card is shown. Keep the rename — the program must show the new title."
      - when: { test: "makeCardTitle reads the title when it is called" }
        message:
          uk: "Ця перевірка створює картку для іншого запису, перейменовує його й чекає нову назву. Картка має читати назву **переданого** запису (`record`) у момент виклику, а не копію, зроблену під час створення."
          en: "This check makes a card for another record, renames it and expects the new title. The card must read the title of the record it **received** (`record`) at the moment of the call, not a copy made at creation time."
      - when: { test: "prints exactly four lines" }
        message:
          uk: "Програма має вивести рівно чотири рядки — три нагадування й назву картки. Не видаляй і не додавай `console.log`."
          en: "The program must print exactly four lines — three reminders and the card title. Do not delete or add `console.log` calls."

  - id: to-project
    kind: transfer
    capstoneStep: JS-03
    body:
      uk: "У кроці проєкту твої функції форматування отримуватимуть запис параметром і читатимуть його поля в момент виклику — тоді підпис завжди відповідатиме актуальним даним. Уникай копіювання полів у змінні, які переживають виклик."
      en: "In the project step your formatting functions receive a record as a parameter and read its fields at the moment of the call — so the label always matches the current data. Avoid copying fields into variables that outlive the call."
