id: js-03-09-debug-captured-bindings
unit: JS-03
title:
  uk: "Налагодження: захоплена змінна циклу й застарілі значення"
  en: "Debug: captured loop binding and stale values"
kind: instructional
minutes: 14
contentVersion: 1
objectives:
  - uk: "З’ясувати, чому callback-и, створені в готовому циклі з `var`, усі показують останнє значення, і виправити це через `let`."
    en: "Diagnose why callbacks created in a prepared `var` loop all report the final value, and repair it with `let`."
  - uk: "Виправити застаріле значення, яке з’явилося через копіювання поля в локальну змінну під час створення closure, не змінюючи того, що програма має виводити."
    en: "Repair a stale value caused by copying a field into a local binding when the closure was created, without changing the intended output."
  - uk: "Для кожного виправлення пояснити, з якою змінною пов’язаний кожен closure."
    en: "Explain for each repair which binding every closure points to."
prerequisites: [js-03-08-recursion-base-case, js-03-05-closures]
subskills:
  - { family: J-02, skill: "const/let and mutation distinction", depth: assess }
  - { family: J-02, skill: "lexical/function/block scope", depth: assess }
  - { family: J-04, skill: "closures and higher-order functions", depth: assess }
glossary: [per-iteration-binding, stale-closure]
selfCheck: [first-callback, stale-copy, fix-reminders]

blocks:
  - id: callbacks-run-later
    kind: explanation
    title:
      uk: "Створили зараз — викликали пізніше"
      en: "Created now, called later"
    body:
      uk: |
        Callback часто створюють в одному місці, а викликають набагато пізніше: після кліку, після таймера, після завантаження даних. У цьому уроці — дві класичні помилки, які виростають із цього розриву в часі. Обидві зводяться до одного питання: **яку саме змінну читає функція, коли її нарешті викликають?**

        Почнімо з циклу на кшталт тих, що ти писав у JS-02. Функцію створюють у першому проході циклу, а викликають, коли цикл уже завершився. Зверни увагу: перший цикл оголошує лічильник через `var`, другий — через `let`.
      en: |
        A callback is often created in one place and called much later: after a click, after a timer, after data has loaded. This lesson is about two classic bugs that grow out of that gap in time. Both come down to one question: **which variable exactly does the function read when it is finally called?**

        Let’s start with a loop like the ones you wrote in JS-02. A function is created in the first pass of the loop and called when the loop is already over. Notice: the first loop declares its counter with `var`, the second one with `let`.

  - id: first-callback
    kind: prediction
    prompt:
      uk: "Обидві функції створено в першому проході своїх циклів, а викликано після них. Що з’явиться в консолі?"
      en: "Both functions are created in the first pass of their loops and called after the loops. What appears in the console?"
    code: |
      let fromVar;
      for (var i = 1; i <= 3; i++) {
        if (i === 1) {
          fromVar = () => console.log("var: " + i);
        }
      }

      let fromLet;
      for (let j = 1; j <= 3; j++) {
        if (j === 1) {
          fromLet = () => console.log("let: " + j);
        }
      }

      fromVar();
      fromLet();
    verify:
      logs: ["var: 4", "let: 1"]
    answer:
      type: choice
      options:
        - id: shared-and-own
          text: { uk: "`var: 4`, `let: 1`", en: "`var: 4`, `let: 1`" }
        - id: remembers-value
          text: { uk: "`var: 1`, `let: 1`", en: "`var: 1`, `let: 1`" }
          why:
            uk: "Функція не запам’ятовує значення, яке лічильник мав, коли її створили. Вона пов’язана зі змінною й читає її тоді, коли її викликають. Змінна `var i` одна на весь цикл, і після циклу в ній `4`."
            en: "A function does not remember the value the counter had when it was created. It is linked to the variable and reads it when it is called. `var i` is one variable for the whole loop, and after the loop it holds `4`."
        - id: last-round
          text: { uk: "`var: 3`, `let: 3`", en: "`var: 3`, `let: 3`" }
          why:
            uk: "Цикл зупиняється, коли умова `i <= 3` стає хибною, а це відбувається при `4`. До того ж змінна `let j` у кожному проході своя."
            en: "The loop stops when the condition `i <= 3` becomes false, which happens at `4`. Besides, `let j` is a separate variable in every pass."
        - id: let-shared-too
          text: { uk: "`var: 4`, `let: 4`", en: "`var: 4`, `let: 4`" }
          why:
            uk: "З `let` кожен прохід циклу має **власну** змінну `j`. Функція з першого проходу пов’язана з `j` першого проходу, де лежить `1`."
            en: "With `let` every pass of the loop has **its own** variable `j`. The function from the first pass is linked to the `j` of the first pass, which holds `1`."
      correct: [shared-and-own]
    explanation:
      uk: "Обидві функції читають лічильник лише тоді, коли їх викликають, — уже після циклів. Змінна `var i` одна на весь цикл; коли умова `i <= 3` уперше стає хибною, у ній `4`, тож `fromVar` виводить `var: 4`. З `let` кожен прохід має окрему змінну `j`; функція з першого проходу пов’язана саме з нею, а там досі `1`."
      en: "Both functions read the counter only when they are called — after the loops. `var i` is one variable for the whole loop; when the condition `i <= 3` first fails, it holds `4`, so `fromVar` prints `var: 4`. With `let` every pass has its own variable `j`; the function from the first pass is linked to that one, which still holds `1`."

  - id: one-or-many
    kind: explanation
    title:
      uk: "Одна змінна чи нова в кожному проході"
      en: "One variable, or a new one in every pass"
    body:
      uk: |
        | | `for (var i …)` | `for (let j …)` |
        |---|---|---|
        | Скільки змінних-лічильників | **одна** на весь цикл | **нова** в кожному проході |
        | З чим пов’язана функція з 1-го проходу | зі спільною `i` | із `j` першого проходу |
        | Що вона прочитає після циклу | останнє значення, `4` | `1` |

        Такі змінні — нові в кожному проході — англійською називають [[per-iteration-binding|per-iteration binding]]. Саме тому в сучасному коді лічильник циклу оголошують через `let`, а `var` трапляється лише в старому коді.

        Але `let` лікує лише одну хворобу. Трохи далі побачиш іншу, проти якої він безсилий.
      en: |
        | | `for (var i …)` | `for (let j …)` |
        |---|---|---|
        | How many counter variables | **one** for the whole loop | a **new** one in every pass |
        | What the function from pass 1 is linked to | the shared `i` | the `j` of the first pass |
        | What it reads after the loop | the last value, `4` | `1` |

        A separate variable for every pass is called a [[per-iteration-binding|per-iteration binding]]. That is why modern code declares a loop counter with `let`, and `var` shows up only in old code.

        But `let` cures only one disease. A little further on you will see another one it cannot help with.

  - id: loop-bindings
    kind: visual
    visual: memory-graph
    title:
      uk: "Діаграма пам’яті: одна i проти окремої j"
      en: "Memory diagram: one i versus a separate j"
    textEquivalent:
      uk: "У першому проході циклу з var створюється стрілкова функція, яку зберігає fromVar; вона пов’язана з областю видимості файла, де живе єдина змінна i, що зараз дорівнює 1. Цикл проходить ще двічі й зупиняється, коли i стає 4 — та сама змінна, з якою пов’язана fromVar. У циклі з let перший прохід має власну коробку, де j дорівнює 1; функцію з цього проходу зберігає fromLet, і вона пов’язана саме з цією коробкою. Другий і третій проходи мають власні коробки з j = 2 і j = 3, але жодна функція їх не зберегла. Після циклів fromVar читає спільну i й виводить var: 4, а fromLet читає j першого проходу й виводить let: 1."
      en: "In the first pass of the var loop an arrow function is created and stored in fromVar; it is linked to the file’s scope, where the single variable i lives, now equal to 1. The loop runs twice more and stops when i becomes 4 — the very variable fromVar is linked to. In the let loop the first pass has its own box where j is 1; the function from that pass is stored in fromLet and is linked to that box. The second and third passes have their own boxes with j = 2 and j = 3, but no function kept them. After the loops fromVar reads the shared i and prints var: 4, while fromLet reads the j of the first pass and prints let: 1."
    spec:
      code: |
        let fromVar;
        for (var i = 1; i <= 3; i++) {
          if (i === 1) {
            fromVar = () => console.log("var: " + i);
          }
        }

        let fromLet;
        for (let j = 1; j <= 3; j++) {
          if (j === 1) {
            fromLet = () => console.log("let: " + j);
          }
        }

        fromVar();
        fromLet();
      states:
        - caption:
            uk: "Перший прохід циклу з `var`: функцію створено й збережено в `fromVar`. Її прихований зв’язок (`scope`) веде до області видимості файла — там живе **єдина** змінна `i`, зараз `1`. (З коробки файла намальовано лише `i`; `fromVar` і `fromLet` теж живуть у ній — їх видно ліворуч.)"
            en: "The first pass of the `var` loop: the function is created and stored in `fromVar`. Its hidden link (`scope`) leads to the file’s scope — where the **only** `i` lives, now `1`. (Only `i` is drawn in the file’s box; `fromVar` and `fromLet` live there too — they are shown on the left.)"
          line: 4
          bindings:
            - { name: fromVar, kind: let, value: { ref: fnVar } }
            - { name: fromLet, kind: let, value: "uninitialized" }
          heap:
            fnVar: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: fileScope } } }
            fileScope: { kind: object, ctor: "file · var i", props: { i: 1 } }
        - caption:
            uk: "Цикл пройшов ще двічі й зупинився, коли `i` стала `4` (умова `4 <= 3` хибна). Це та сама змінна, з якою пов’язана `fromVar`."
            en: "The loop ran twice more and stopped when `i` became `4` (the condition `4 <= 3` is false). It is the very variable `fromVar` is linked to."
          line: 2
          bindings:
            - { name: fromVar, kind: let, value: { ref: fnVar } }
            - { name: fromLet, kind: let, value: "uninitialized" }
          heap:
            fnVar: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: fileScope } } }
            fileScope: { kind: object, ctor: "file · var i", props: { i: 4 } }
        - caption:
            uk: "Перший прохід циклу з `let` має **власну** коробку, де `j = 1`. Функція з цього проходу пов’язана саме з нею."
            en: "The first pass of the `let` loop has **its own** box where `j = 1`. The function from this pass is linked to exactly that box."
          line: 11
          bindings:
            - { name: fromVar, kind: let, value: { ref: fnVar } }
            - { name: fromLet, kind: let, value: { ref: fnLet } }
          heap:
            fnVar: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: fileScope } } }
            fileScope: { kind: object, ctor: "file · var i", props: { i: 4 } }
            fnLet: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: pass1 } } }
            pass1: { kind: object, ctor: "let j · pass 1", props: { j: 1 } }
        - caption:
            uk: "Другий і третій проходи мали свої коробки з `j = 2` і `j = 3`, але жодна функція їх не зберегла, тож їх уже немає. Коробка першого проходу живе, і `j` у ній досі `1`."
            en: "The second and third passes had their own boxes with `j = 2` and `j = 3`, but no function kept them, so they are gone. The box of the first pass lives on, and `j` in it is still `1`."
          line: 9
          bindings:
            - { name: fromVar, kind: let, value: { ref: fnVar } }
            - { name: fromLet, kind: let, value: { ref: fnLet } }
          heap:
            fnVar: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: fileScope } } }
            fileScope: { kind: object, ctor: "file · var i", props: { i: 4 } }
            fnLet: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: pass1 } } }
            pass1: { kind: object, ctor: "let j · pass 1", props: { j: 1 } }
        - caption:
            uk: "`fromVar()` іде за своїм зв’язком до спільної `i` і виводить `var: 4`."
            en: "`fromVar()` follows its link to the shared `i` and prints `var: 4`."
          line: 15
          bindings:
            - { name: fromVar, kind: let, value: { ref: fnVar } }
            - { name: fromLet, kind: let, value: { ref: fnLet } }
          heap:
            fnVar: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: fileScope } } }
            fileScope: { kind: object, ctor: "file · var i", props: { i: 4 } }
            fnLet: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: pass1 } } }
            pass1: { kind: object, ctor: "let j · pass 1", props: { j: 1 } }
        - caption:
            uk: "`fromLet()` іде до `j` першого проходу й виводить `let: 1`. Одна змінна на весь цикл — проти окремої змінної на кожен прохід."
            en: "`fromLet()` goes to the `j` of the first pass and prints `let: 1`. One variable for the whole loop versus a separate variable for every pass."
          line: 16
          bindings:
            - { name: fromVar, kind: let, value: { ref: fnVar } }
            - { name: fromLet, kind: let, value: { ref: fnLet } }
          heap:
            fnVar: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: fileScope } } }
            fileScope: { kind: object, ctor: "file · var i", props: { i: 4 } }
            fnLet: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: pass1 } } }
            pass1: { kind: object, ctor: "let j · pass 1", props: { j: 1 } }

  - id: reminders
    kind: example
    runtime: browser-js
    dir: reminders
    entry: index.js
    strings:
      reminderFor: { uk: "Нагадування на день", en: "Reminder for day" }
    title:
      uk: "Три нагадування"
      en: "Three reminders"
    body:
      uk: |
        Перший рядок бере з файла `later.js` дві готові функції (як працюють такі імпорти, розберемо в JS-07): `later(fn)` відкладає функцію, а `runLater()` згодом викликає все відкладене по черзі — так само браузер пізніше викликає обробники кліків. Запусти: усі три нагадування кажуть «день 4».
      en: |
        The first line takes two ready-made functions from the file `later.js` (how such imports work is covered in JS-07): `later(fn)` puts a function aside, and `runLater()` later calls everything put aside, in order — the same way a browser calls click handlers later. Run it: all three reminders say “day 4”.
    tryIt:
      uk: "Заміни `var` на `let` і запусти знову: тепер дні `1`, `2` і `3`. Порахуй: скільки змінних `day` існувало з `var`? А з `let`?"
      en: "Replace `var` with `let` and run again: now the days are `1`, `2` and `3`. Count: how many `day` variables existed with `var`? And with `let`?"

  - id: recall
    kind: review
    title:
      uk: "Згадай: var виходить за межі блоку"
      en: "Recall: var escapes the block"
    items:
      - id: var-leaks
        from: js-02-10-debug-tdz-and-defaults
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          let total = 0;
          for (var i = 1; i <= 3; i++) {
            total = total + i;
          }
          console.log(i);
          console.log(total);
        verify:
          logs: ["4", "6"]
        answer:
          type: choice
          options:
            - id: four-six
              text: { uk: "`4`, `6`", en: "`4`, `6`" }
            - id: reference-error
              text:
                uk: "`ReferenceError` на `console.log(i)`"
                en: "A `ReferenceError` at `console.log(i)`"
              why:
                uk: "`var` не обмежений блоком циклу: змінна належить усьому файлу (чи функції), тож після циклу вона існує. `ReferenceError` дав би `let i`."
                en: "`var` is not limited by the loop’s block: the variable belongs to the whole file (or function), so it exists after the loop. `let i` would give a `ReferenceError`."
            - id: three-six
              text: { uk: "`3`, `6`", en: "`3`, `6`" }
              why:
                uk: "Цикл зупиняється, коли умова `i <= 3` стає хибною, тобто коли `i` вже `4`. Це значення й лишається у змінній."
                en: "The loop stops when the condition `i <= 3` becomes false, that is, when `i` is already `4`. That value stays in the variable."
          correct: [four-six]
        explanation:
          uk: "Область видимості `var` — функція або файл, а не блок: `i` «витікає» з циклу й після нього дорівнює `4` — значенню, при якому умова вперше не справдилася. Саме тому callback-и з циклу на `var` бачать `4`. З `let i` змінна жила б лише всередині циклу, окремо в кожному проході."
          en: "The scope of `var` is the function or the file, not the block: `i` “leaks” out of the loop and equals `4` afterwards — the value at which the condition first failed. That is why callbacks from a `var` loop see `4`. With `let i` the variable would live only inside the loop, separately in each pass."

  - id: stale-copy
    kind: prediction
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      waterGarden: { uk: "Полити квіти й город", en: "Water the plants and the garden" }
      taskPrefix: { uk: "Справа: ", en: "Task: " }
    prompt:
      uk: "Справу перейменували вже **після** того, як створили функцію-підпис. Що виведе програма?"
      en: "The task was renamed **after** the label function was created. What does the program print?"
    code: |
      const task = { title: "%%water%%" };

      function makeLabel(record) {
        const title = record.title;
        return () => "%%taskPrefix%%" + title;
      }

      const label = makeLabel(task);
      task.title = "%%waterGarden%%";
      console.log(label());
    verify:
      logs: ["%%taskPrefix%%%%water%%"]
    answer:
      type: choice
      options:
        - id: old-title
          text:
            uk: "«Справа: Полити квіти» — стару назву"
            en: "“Task: Water the plants” — the old title"
        - id: new-title
          text:
            uk: "«Справа: Полити квіти й город» — нову назву"
            en: "“Task: Water the plants and the garden” — the new title"
          why:
            uk: "У `title` потрапила копія тексту тоді, коли виконувалася `makeLabel`. Перейменування змінює `task.title`, а не змінну `title` у коробці `makeLabel`."
            en: "`title` received a copy of the text while `makeLabel` was running. The rename changes `task.title`, not the variable `title` in the box of `makeLabel`."
        - id: error
          text: { uk: "`ReferenceError`", en: "`ReferenceError`" }
          why:
            uk: "`title` живе в коробці виклику `makeLabel`, і closure тримає цю коробку живою."
            en: "`title` lives in the box of the `makeLabel` call, and the closure keeps that box alive."
      correct: [old-title]
    explanation:
      uk: "Closure пов’язаний зі **змінною** `title`, а в ній лежить копія назви, зроблена в момент створення. Об’єкт `task` потім змінився, а копія — ні. Тож функція виводить стару назву."
      en: "The closure is linked to the **variable** `title`, which holds a copy of the title made at creation time. The `task` object changed later, but the copy did not. So the function prints the old title."

  - id: stale-closures
    kind: explanation
    title:
      uk: "Застаріле замикання"
      en: "A stale closure"
    body:
      uk: |
        Ця помилка підступніша: `let` чи `const` тут ні до чого. Функція пов’язана зі змінною `title`, але в ній лежить **копія**, зроблена тоді, коли функцію створювали. Дані потім змінилися, а копія — ні. Таке замикання називають [[stale-closure|застарілим]].

        Виправлення — не копіювати, а читати актуальне джерело в момент виклику:

        ```js
        function makeLabel(record) {
          return () => "Справа: " + record.title;
        }
        ```

        Тепер closure пов’язаний із `record` — тим самим об’єктом, що й `task`, — і читає його `title` щоразу, коли функцію викликають.

        Для кожного closure питай себе: **з якою змінною він пов’язаний і коли в неї потрапило значення?**
      en: |
        This bug is sneakier: `let` or `const` have nothing to do with it. The function is linked to the variable `title`, but it holds a **copy** made when the function was created. The data changed later, the copy did not. Such a closure is called [[stale-closure|stale]].

        The fix is not to copy but to read the current source at the moment of the call:

        ```js
        function makeLabel(record) {
          return () => "Task: " + record.title;
        }
        ```

        Now the closure is linked to `record` — the same object as `task` — and reads its `title` every time the function is called.

        For every closure ask yourself: **which variable is it linked to, and when did the value get into it?**

  - id: copy-or-link
    kind: visual
    visual: memory-graph
    title:
      uk: "Діаграма пам’яті: копія чи посилання"
      en: "Memory diagram: a copy or a link"
    textEquivalent:
      uk: "Змінна item вказує на об’єкт із price = 45. Виклик makePriceTag(item) створює коробку, де record вказує на той самий об’єкт, а const price отримує копію числа 45; повернена функція tag пов’язана з цією коробкою. Виклик makeLivePriceTag(item) створює іншу коробку, де є лише record — посилання на той самий об’єкт; функція liveTag пов’язана з нею. Коли item.price змінюють на 60, змінюється сам об’єкт: liveTag дістається до нього через record і бачить 60. А price у коробці tag — окрема копія, і вона досі 45. Тому tag() виводить застарілі 45, а liveTag() — актуальні 60."
      en: "The variable item points at an object with price = 45. The call makePriceTag(item) creates a box where record points at that same object and const price gets a copy of the number 45; the returned function tag is linked to this box. The call makeLivePriceTag(item) creates another box that holds only record — a link to the same object; the function liveTag is linked to it. When item.price is changed to 60, the object itself changes: liveTag reaches it through record and sees 60. But price in tag’s box is a separate copy, still 45. That is why tag() prints the stale 45 and liveTag() the current 60."
    spec:
      code: |
        const item = { price: 45 };

        function makePriceTag(record) {
          const price = record.price;
          return () => price;
        }

        function makeLivePriceTag(record) {
          return () => record.price;
        }

        const tag = makePriceTag(item);
        const liveTag = makeLivePriceTag(item);
        item.price = 60;

        console.log(tag());
        console.log(liveTag());
      states:
        - caption:
            uk: "`makePriceTag(item)` створила коробку: `record` вказує на об’єкт `#item`, а `price` отримала **копію** числа `45`. Функція `tag` пов’язана з цією коробкою."
            en: "`makePriceTag(item)` created a box: `record` points at the object `#item`, and `price` got a **copy** of the number `45`. The function `tag` is linked to this box."
          line: 12
          bindings:
            - { name: item, kind: const, value: { ref: item } }
            - { name: tag, kind: const, value: { ref: fnTag } }
            - { name: liveTag, kind: const, value: "uninitialized" }
          heap:
            item: { kind: object, props: { price: 45 } }
            fnTag: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: tagBox } } }
            tagBox: { kind: object, ctor: "makePriceTag()", props: { record: { ref: item }, price: 45 } }
        - caption:
            uk: "`makeLivePriceTag(item)` нічого не копіює: у її коробці лише `record` — посилання на той самий `#item`."
            en: "`makeLivePriceTag(item)` copies nothing: its box holds only `record` — a link to the same `#item`."
          line: 13
          bindings:
            - { name: item, kind: const, value: { ref: item } }
            - { name: tag, kind: const, value: { ref: fnTag } }
            - { name: liveTag, kind: const, value: { ref: fnLive } }
          heap:
            item: { kind: object, props: { price: 45 } }
            fnTag: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: tagBox } } }
            tagBox: { kind: object, ctor: "makePriceTag()", props: { record: { ref: item }, price: 45 } }
            fnLive: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: liveBox } } }
            liveBox: { kind: object, ctor: "makeLivePriceTag()", props: { record: { ref: item } } }
        - caption:
            uk: "`item.price = 60` змінює сам об’єкт `#item`. Обидві коробки посилаються на нього, але `price` у коробці `tag` — окрема копія: вона досі `45`."
            en: "`item.price = 60` changes the object `#item` itself. Both boxes link to it, but `price` in `tag`’s box is a separate copy: still `45`."
          line: 14
          bindings:
            - { name: item, kind: const, value: { ref: item } }
            - { name: tag, kind: const, value: { ref: fnTag } }
            - { name: liveTag, kind: const, value: { ref: fnLive } }
          heap:
            item: { kind: object, props: { price: 60 } }
            fnTag: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: tagBox } } }
            tagBox: { kind: object, ctor: "makePriceTag()", props: { record: { ref: item }, price: 45 } }
            fnLive: { kind: object, ctor: "ƒ () =>", props: { scope: { ref: liveBox } } }
            liveBox: { kind: object, ctor: "makeLivePriceTag()", props: { record: { ref: item } } }
          changed: [item]
        - caption:
            uk: "`tag()` читає копію — застарілі `45`. `liveTag()` іде за посиланням до об’єкта й читає актуальні `60`."
            en: "`tag()` reads the copy — the stale `45`. `liveTag()` follows the link to the object and reads the current `60`."
