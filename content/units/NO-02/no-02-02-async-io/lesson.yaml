      uk: "loadAll: кілька файлів одночасно"
      en: "loadAll: several files at once"
    instructions:
      uk: |
        Зараз `loadAll(paths)` у `app.js` читає файли по черзі й повертає текст. Перероби її:

        - читай кожен файл через `readFile` з `node:fs/promises` і **починай усі читання одразу**, а не по черзі;
        - розбери кожен файл як JSON і поверни масив значень **у порядку `paths`**;
        - якщо якийсь файл не вдалося прочитати чи розібрати, відхили (кинь) `Error`, у повідомленні якої є назва цього файла (наприклад, `broken.json`), а початкова помилка лежить у `cause`.

        Перевірка, що читання йдуть одночасно, підміняє `readFile` повільною версією (30 мс на кожен файл) і рахує, скільки читань триває водночас.
      en: |
        Right now `loadAll(paths)` in `app.js` reads the files in turn and returns text. Rework it:

        - read each file with `readFile` from `node:fs/promises` and **start all the reads at once**, not in turn;
        - parse each file as JSON and return an array of the values **in the order of `paths`**;
        - if a file could not be read or parsed, reject (throw) an `Error` whose message contains that file’s name (for example `broken.json`) and whose `cause` holds the original error.

        The check that the reads run at once replaces `readFile` with a slow version (30 ms for each file) and counts how many reads are in progress at the same time.
    testTitles:
      "resolves with the parsed files in the order of paths":
        uk: "Повертає розібрані файли в порядку `paths`"
        en: "Resolves with the parsed files in the order of `paths`"
      "starts every read before the first one finishes":
        uk: "Починає всі читання ще до того, як закінчилося перше"
        en: "Starts every read before the first one finishes"
      "a broken file rejects with an error that names the file":
        uk: "Зламаний файл дає помилку з назвою цього файла"
        en: "A broken file rejects with an error that names the file"
      "the rejection keeps the original error as cause":
        uk: "Початкова помилка збережена в `cause`"
        en: "The original error is kept as `cause`"
    hints:
      nudge:
        uk: "`await` усередині циклу `for` змушує кожне читання чекати попереднє. Що треба зробити, щоб усі promises з’явилися ще до першого `await`?"
        en: "`await` inside a `for` loop makes each read wait for the previous one. What must happen so that all the promises exist before the first `await`?"
      explanation:
        uk: "`array.map(async (x) => …)` одразу викликає функцію для кожного елемента й дає масив promises — усі вони вже працюють. `Promise.all(масив)` чекає на всі й повертає результати в порядку масиву, а не в порядку завершення. Якщо функція всередині `map` має свій `try/catch`, вона знає, який саме елемент обробляла, — як у `labels.map(async (label) => { try { … } catch (error) { throw new Error(label + ': …', { cause: error }); } })`."
        en: "`array.map(async (x) => …)` calls the function for every element at once and gives an array of promises — all of them already running. `Promise.all(array)` waits for all of them and returns the results in the order of the array, not in the order they finished. If the function inside `map` has its own `try/catch`, it knows which element it was handling — as in `labels.map(async (label) => { try { … } catch (error) { throw new Error(label + ': …', { cause: error }); } })`."
    solutionNote:
      uk: "`paths.map(async …)` запускає всі читання одразу, а `Promise.all` чекає на них і зберігає порядок `paths`. Кожен файл має свій `try/catch`, тож помилка знає назву файла й несе початкову помилку в `cause`: `SyntaxError` від `JSON.parse` чи помилку з кодом `ENOENT` від `readFile`. `Promise.allSettled` з розбором після нього — рівноцінний варіант."
      en: "`paths.map(async …)` starts every read at once, and `Promise.all` waits for them while keeping the order of `paths`. Each file has its own `try/catch`, so the error knows the file’s name and carries the original error in `cause`: a `SyntaxError` from `JSON.parse` or an error with the code `ENOENT` from `readFile`. `Promise.allSettled` followed by parsing is an equivalent version."
    feedback:
      - when: { test: "resolves with the parsed files in the order of paths" }
        message:
          uk: "Ця перевірка очікує масив розібраних значень (не текст JSON) у тому самому порядку, що й `paths` — не в порядку, у якому закінчилися читання. Розбирай кожен файл через `JSON.parse`."
          en: "This check expects an array of parsed values (not JSON text) in the same order as `paths` — not in the order the reads finished. Parse each file with `JSON.parse`."
      - when: { test: "starts every read before the first one finishes" }
        message:
          uk: "Ця перевірка очікує, що всі три `readFile` триватимуть водночас. Якщо `await` стоїть усередині циклу, кожне читання чекає на попереднє. І читай саме через `readFile` з `node:fs/promises` — лише його ця перевірка й рахує."
          en: "This check expects all three `readFile` calls to be in progress at the same time. If `await` sits inside a loop, each read waits for the previous one. And read with `readFile` from `node:fs/promises` — that is the only call this check counts."
      - when: { test: "a broken file rejects with an error that names the file" }
        message:
          uk: "Ця перевірка очікує, що `loadAll` відхилиться з помилкою, у `message` якої є `broken.json`. Повідомлення `JSON.parse` не каже, який файл зламаний, — додай назву сам."
          en: "This check expects `loadAll` to reject with an error whose `message` contains `broken.json`. The message of `JSON.parse` does not say which file is broken — add the name yourself."
      - when: { test: "the rejection keeps the original error as cause" }
        message:
          uk: "Ця перевірка очікує, що в `cause` лежатиме початкова помилка: `SyntaxError` для зламаного JSON і помилка з `code: 'ENOENT'` для файла, якого немає. Передай її другим аргументом: `new Error(повідомлення, { cause: error })`."
          en: "This check expects `cause` to hold the original error: a `SyntaxError` for broken JSON and an error with `code: 'ENOENT'` for a missing file. Pass it as the second argument: `new Error(message, { cause: error })`."

  - id: to-project
    kind: transfer
    capstoneStep: NO-02
    body:
      uk: "У кроці проєкту цього розділу файловий репозиторій (`createFileRepository` у `src/fileRepository.ts`) читає й пише лише через `node:fs/promises`, тож сервер, який крок NO-03 побудує на ньому, не зупинятиметься на кожному читанні. Крок читає один файл даних; якщо колись читатимеш кілька незалежних файлів, запускай читання разом через `Promise.all`."
      en: "In this unit’s project step the file repository (`createFileRepository` in `src/fileRepository.ts`) reads and writes only through `node:fs/promises`, so the server that step NO-03 builds on it does not stop on every read. The step reads one data file; if you ever read several independent files, start the reads together with `Promise.all`."
