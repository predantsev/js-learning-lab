id: no-02-01-fs-paths-safe
unit: NO-02
title:
  uk: "fs, path і безпечні шляхи"
  en: "fs, path and safe paths"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Будувати шляхи до файлів через `path.join` і `path.resolve` від фіксованої теки даних, а не склеюванням тексту, і передбачати результат для сегментів `..` та абсолютних назв."
    en: "Build file paths with `path.join` and `path.resolve` from a fixed data folder instead of string concatenation, and predict the result for `..` segments and absolute names."
  - uk: "Написати `resolveInside(baseDir, name)`, яка відхиляє кожну назву, чий розв’язаний шлях виходить за межі `baseDir`."
    en: "Implement `resolveInside(baseDir, name)` that rejects every name whose resolved path escapes `baseDir`."
prerequisites: [no-01-02-scripts-process-env, js-15-01-terminal-files-paths]
subskills:
  - { family: B-02, skill: "fs/path and safe paths", depth: intro }
glossary: [path-traversal, containment-check]
selfCheck: [predict-paths, resolve-inside]

blocks:
  - id: paths-are-computed
    kind: explanation
    title:
      uk: "Шлях — це обчислення, а не склеєний текст"
      en: "A path is computed, not glued together"
    body:
      uk: |
        У Node файли читає й записує модуль `node:fs`, а шляхи до них будує `node:path`. Шлях можна склеїти й самому — `'data/' + name`, — але `path` знає правила: роздільник твоєї системи (`/` на macOS і Linux, `\` на Windows), що означає `..` і що робити з абсолютною назвою.

        - `path.join('data', 'archive', 'w.json')` з’єднує частини й прибирає зайве: `..` «з’їдає» попередню теку.
        - `path.resolve(...)` дає **абсолютний** шлях: іде частинами зліва направо, і абсолютна частина починає все спочатку.

        А від чого рахується відносний шлях на кшталт `data/wishlist.json`? Від [[working-directory|робочої теки]] процесу — `process.cwd()`, тобто від теки, з якої ти запустив `node`. **Не** від теки файла з кодом. Запусти `node scripts/report.js` з кореня проєкту — і `data/` шукатиметься в корені, а не в `scripts/`.
      en: |
        In Node the `node:fs` module reads and writes files, and `node:path` builds the paths to them. You could glue a path yourself — `'data/' + name` — but `path` knows the rules: your system’s separator (`/` on macOS and Linux, `\` on Windows), what `..` means and what to do with an absolute name.

        - `path.join('data', 'archive', 'w.json')` joins the parts and tidies up: `..` “eats” the folder before it.
        - `path.resolve(...)` gives an **absolute** path: it walks the parts left to right, and an absolute part starts everything over.

        And what is a relative path like `data/wishlist.json` counted from? From the process’s [[working-directory]] — `process.cwd()`, the folder you started `node` from. **Not** from the folder of the code file. Run `node scripts/report.js` from the project root, and `data/` is looked up in the root, not in `scripts/`.

  - id: predict-paths
    kind: prediction
    prompt:
      uk: "Що надрукують три виклики на macOS чи Linux?"
      en: "What do the three calls print on macOS or Linux?"
    code: |
      import path from 'node:path';

      console.log(path.join('data', '../config/.env'));
      console.log(path.resolve('/srv/app/data', '/tmp/other.json'));
      console.log(path.resolve('/srv/app/data', 'archive/../wishlist.json'));
    runnable: false
    answer:
      type: choice
      options:
        - id: computed
          code: "config/.env\n/tmp/other.json\n/srv/app/data/wishlist.json"
        - id: glued
          code: "data/../config/.env\n/srv/app/data/tmp/other.json\n/srv/app/data/archive/../wishlist.json"
          why:
            uk: "`path` не просто склеює текст: `..` прибирає теку перед собою, а абсолютна частина в `resolve` відкидає все, що було лівіше."
            en: "`path` does not just glue text: `..` removes the folder before it, and an absolute part in `resolve` discards everything to its left."
        - id: stays-in-data
          code: "data/config/.env\n/srv/app/data/tmp/other.json\n/srv/app/data/wishlist.json"
          why:
            uk: "Ніщо в `path` не тримає шлях усередині першої теки. `..` виходить з `data`, а `/tmp/other.json` узагалі починає шлях від кореня диска."
            en: "Nothing in `path` keeps a path inside the first folder. `..` leaves `data`, and `/tmp/other.json` starts the path from the root of the disk."
      correct: [computed]
    explanation:
      uk: "Лише третій шлях лишився в `/srv/app/data`. Перший вийшов із `data` через `..`, а другий — абсолютна назва — узагалі проігнорував теку даних. Якби ці назви прийшли із запиту, програма відкрила б чужі файли. (Платформа не запускає цей фрагмент: «Запустити й перевірити» виконує код у браузері, а `node:path` є лише в Node. Справжній запуск — у прикладі нижче.)"
      en: "Only the third path stayed in `/srv/app/data`. The first left `data` through `..`, and the second — an absolute name — ignored the data folder entirely. Had these names come from a request, the program would have opened someone else’s files. (The platform does not run this snippet: “Run and check” executes code in the browser, and `node:path` exists only in Node. The real run is in the example below.)"

  - id: path-probes
    kind: example
    runtime: isolated-node
    dir: path-probes
    entry: index.js
    title:
      uk: "Робоча тека рухається — відносний шлях теж"
      en: "The working directory moves — so does a relative path"
    body:
      uk: |
        Це справжній Node.js. Натисни **Запустити**. Програма друкує два результати з передбачення, а потім будує шлях до `data/wishlist.json` двома способами — до й після `process.chdir('data/archive')`, який змінює робочу теку.

        Тут платформа запускає програму в теці із цим файлом, тож спершу обидва способи збігаються. Після `chdir` відносний шлях «переїжджає» в `data/archive/data/…`, а шлях від `import.meta.dirname` — теки, де лежить сам модуль, — лишається на місці. Шляхи надруковано відносно теки модуля.
      en: |
        This is real Node.js. Press **Run**. The program prints two results from the prediction, then builds the path to `data/wishlist.json` in two ways — before and after `process.chdir('data/archive')`, which changes the working directory.

        Here the platform starts the program in the folder that holds this file, so at first both ways agree. After `chdir` the relative path “moves” to `data/archive/data/…`, while the path from `import.meta.dirname` — the folder where the module itself lives — stays put. The paths are printed relative to the module’s folder.
    tryIt:
      uk: "Зміни `process.chdir('data/archive')` на `process.chdir('data')` і запусти ще раз: куди тепер показує `resolve()`? Потім у `fromWorkingDir` заміни `path.resolve('data/wishlist.json')` на `path.resolve(import.meta.dirname, 'data/wishlist.json')` — тепер обидва способи не залежать від робочої теки."
      en: "Change `process.chdir('data/archive')` to `process.chdir('data')` and run again: where does `resolve()` point now? Then in `fromWorkingDir` replace `path.resolve('data/wishlist.json')` with `path.resolve(import.meta.dirname, 'data/wishlist.json')` — now both ways no longer depend on the working directory."

  - id: check-the-result
    kind: explanation
    title:
      uk: "Перевіряй результат, а не назву"
      en: "Check the result, not the name"
    body:
      uk: |
        Назва файла із запиту чи форми — [[untrusted-input|недовірене введення]]. Якщо її приєднати до `data/` без перевірки, `../config/.env` прочитає твої секрети. Це [[path-traversal]].

        Спокуса — «почистити» назву: прибрати `../`, заборонити `/` на початку. Але варіантів обійти чистку багато, а шлях, який справді відкриється, вирішує лише **результат** розв’язання. Тому надійна [[containment-check|перевірка вкладеності]] така:

        1. Розв’яжи теку даних і назву до абсолютного шляху.
        2. Спитай `path.relative(тека, результат)`, як дійти від теки до результату.
        3. Якщо відповідь починається з `..` (треба вийти вгору) або сама абсолютна (інший диск на Windows) — результат поза текою.

        ```js
        path.relative('/srv/app/data', '/srv/app/data/wishlist.json'); // 'wishlist.json'
        path.relative('/srv/app/data', '/srv/app/data-backup/x.json'); // '../data-backup/x.json'
        ```

        Друга відповідь пояснює, чому `startsWith('/srv/app/data')` — пастка: `/srv/app/data-backup` теж так починається.
      en: |
        A file name from a request or a form is [[untrusted-input]]. Join it to `data/` without a check, and `../config/.env` reads your secrets. That is [[path-traversal]].

        The temptation is to “clean” the name: remove `../`, forbid a leading `/`. But there are many ways around cleaning, and only the **result** of resolving decides which file really opens. So a reliable [[containment-check]] goes like this:

        1. Resolve the data folder and the name to an absolute path.
        2. Ask `path.relative(folder, result)` how to get from the folder to the result.
        3. If the answer starts with `..` (you must climb up) or is itself absolute (another drive on Windows), the result is outside the folder.

        ```js
        path.relative('/srv/app/data', '/srv/app/data/wishlist.json'); // 'wishlist.json'
        path.relative('/srv/app/data', '/srv/app/data-backup/x.json'); // '../data-backup/x.json'
        ```

        The second answer shows why `startsWith('/srv/app/data')` is a trap: `/srv/app/data-backup` starts that way too.

  - id: predict-strip
    kind: prediction
    prompt:
      uk: "«Чистка» прибирає з назви кожне `../`. Що залишиться від назви `....//config/.env`?"
      en: "A “cleaning” step removes every `../` from a name. What is left of the name `....//config/.env`?"
    code: |
      const name = "....//config/.env";
      const cleaned = name.replaceAll("../", "");
      console.log(cleaned);
    verify:
      logs: ["../config/.env"]
    answer:
      type: choice
      options:
        - id: climbs-again
          code: "../config/.env"
        - id: harmless
          code: "..//config/.env"
          why:
            uk: "`replaceAll` знаходить `../` у середині `....//`: символи 3–5 — це саме `../`. Після вилучення лишаються дві крапки й скісна риска, тобто знову `../`."
            en: "`replaceAll` finds `../` in the middle of `....//`: characters 3–5 are exactly `../`. After removing them, two dots and a slash are left — `../` again."
        - id: clean
          code: "config/.env"
          why:
            uk: "Так було б, якби чистка повторювалася, доки є що прибирати. `replaceAll` проходить текст один раз, і з уламків складається нове `../`."
            en: "That would happen if the cleaning repeated until nothing was left to remove. `replaceAll` goes through the text once, and the leftovers form a new `../`."
      correct: [climbs-again]
    explanation:
      uk: "Після вилучення одного `../` з `....//` склеюються залишки `..` і `/` — і виходить новий `../`. Чистка назви програє винахідливості. Перевірка розв’язаного шляху не залежить від того, як назву записано."
      en: "Once one `../` is removed from `....//`, the leftovers `..` and `/` join up into a new `../`. Cleaning the name loses to ingenuity. Checking the resolved path does not care how the name was written."

  - id: where-names-land
    kind: visual
    visual: diagram
    title:
      uk: "Куди потрапляють чотири назви"
      en: "Where four names land"
    textEquivalent:
      uk: "Тека даних — /srv/app/data. Кожну назву розв’язують від неї до абсолютного шляху й дивляться, де опинився результат. records.json стає /srv/app/data/records.json — усередині, дозволено. ../config/.env стає /srv/app/config/.env — шлях вийшов угору, відмовити. sub/../records.json спершу заходить у sub, а потім виходить із неї: результат /srv/app/data/records.json, усередині, дозволено, хоч назва й містить `..`. /tmp/other.json абсолютна: path.resolve відкидає теку даних, результат /tmp/other.json — поза текою, відмовити. Отже, вирішує розв’язаний шлях, а не те, чи є в назві `..`."
      en: "The data folder is /srv/app/data. Each name is resolved from it to an absolute path, and we look at where the result ended up. records.json becomes /srv/app/data/records.json — inside, allowed. ../config/.env becomes /srv/app/config/.env — the path climbed out, rejected. sub/../records.json first enters sub and then leaves it: the result is /srv/app/data/records.json, inside, allowed, even though the name contains `..`. /tmp/other.json is absolute: path.resolve discards the data folder, the result /tmp/other.json is outside, rejected. So the resolved path decides, not whether the name contains `..`."
    spec:
      layout: lr
      nodes:
        - { id: plain, label: "records.json", w: 160 }
        - { id: climb, label: "../config/.env", w: 160 }
        - { id: detour, label: "sub/../records.json", w: 160 }
        - { id: absolute, label: "/tmp/other.json", w: 160 }
        - { id: inside, label: { uk: "у data/ — дозволено", en: "in data/ — allowed" }, shape: round, w: 160 }
        - { id: outside, label: { uk: "поза data/ — відмовити", en: "outside — rejected" }, shape: round, w: 160 }
      edges:
        - { id: e-plain, from: plain, to: inside }
        - { id: e-climb, from: climb, to: outside }
        - { id: e-detour, from: detour, to: inside }
        - { id: e-absolute, from: absolute, to: outside }
      steps:
        - caption:
            uk: "Тека даних — `/srv/app/data`. Кожну назву розв’язуємо від неї й дивимося, **де опинився результат**."
            en: "The data folder is `/srv/app/data`. We resolve each name from it and look at **where the result ended up**."
          dim: [e-plain, e-climb, e-detour, e-absolute]
        - caption:
            uk: "`records.json` → `/srv/app/data/records.json`: усередині, дозволено."
            en: "`records.json` → `/srv/app/data/records.json`: inside, allowed."
          highlight: [plain, e-plain, inside]
          annotate:
            - { id: inside, text: "/srv/app/data/records.json" }
        - caption:
            uk: "`../config/.env` → `/srv/app/config/.env`: `..` вийшло з `data`, відмовити."
            en: "`../config/.env` → `/srv/app/config/.env`: `..` left `data`, rejected."
          highlight: [climb, e-climb, outside]
          annotate:
            - { id: outside, text: "/srv/app/config/.env" }
        - caption:
            uk: "`sub/../records.json` заходить у `sub` і виходить назад: результат усередині, дозволено — хоч у назві й є `..`."
            en: "`sub/../records.json` goes into `sub` and back out: the result is inside, allowed — even though the name contains `..`."
          highlight: [detour, e-detour, inside]
          annotate:
            - { id: inside, text: "/srv/app/data/records.json" }
        - caption:
            uk: "`/tmp/other.json` абсолютна: `path.resolve` відкидає теку даних, результат поза нею — відмовити."
            en: "`/tmp/other.json` is absolute: `path.resolve` discards the data folder, the result is outside it — rejected."
          highlight: [absolute, e-absolute, outside]
          annotate:
            - { id: outside, text: "/tmp/other.json" }

  - id: recall
    kind: review
    title:
      uk: "Пригадай: чий це текст"
      en: "Recall: whose text is it"
    items:
      - id: which-untrusted
        from: js-16-06-untrusted-input-safe-output
        prompt:
          uk: "Сервер віддає файли з теки `data/`. Які із цих значень — недовірене введення?"
          en: "A server sends files from the `data/` folder. Which of these values are untrusted input?"
        answer:
          type: multi
          options:
            - id: query-name
              text: { uk: "Назва файла з адреси запиту: `/files?name=…`", en: "A file name from the request address: `/files?name=…`" }
            - id: stored-label
              text: { uk: "Назва бажання, яку людина ввела в форму минулого тижня і яку збережено у файл", en: "A wish name that a person typed into a form last week and that was saved to a file" }
            - id: constant
              text: { uk: "Рядок коду `const DATA_DIR = 'data'` у твоєму модулі", en: "The line of code `const DATA_DIR = 'data'` in your module" }
              why:
                uk: "Це значення написав ти сам у коді — воно не перетинає межу довіри."
                en: "You wrote this value yourself in the code — it does not cross the trust boundary."
          correct: [query-name, stored-label]
        explanation:
          uk: "Недовірене — усе, що прийшло ззовні твого коду: адреса запиту, будь-хто може її надіслати; текст із форми, навіть збережений давно. Перевірка форми на межі не робить такий текст безпечним для кожного місця використання — для шляху до файла потрібна своя перевірка."
          en: "Untrusted is everything that came from outside your code: a request address, which anyone can send; text from a form, even one saved long ago. A form check at the boundary does not make such text safe for every place it is used — a file path needs its own check."

  - id: resolve-inside
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: resolve-inside
    entry: index.js
    editable: [app.js]
    title:
      uk: "resolveInside: лише всередині теки даних"
      en: "resolveInside: only inside the data folder"
    instructions:
      uk: |
        Допиши `resolveInside(baseDir, name)` у `app.js`:

        - повертає **абсолютний** шлях до `name` усередині `baseDir`;
        - назва з `..`, яка все одно лишається всередині (`archive/../planner.json`), дозволена;
        - кидає помилку (`throw new Error(…)`), якщо розв’язаний шлях виходить за межі `baseDir`: через `..`, через абсолютну назву чи в сусідню теку з подібною назвою (`data-backup` поряд із `data`).

        **Запустити** пробує п’ять назв і друкує, які з них дозволено. **Перевірити** викликає функцію з іншими назвами, зокрема з такими, що намагаються вийти з теки.
      en: |
        Finish `resolveInside(baseDir, name)` in `app.js`:

        - it returns the **absolute** path of `name` inside `baseDir`;
        - a name with `..` that still stays inside (`archive/../planner.json`) is allowed;
        - it throws an error (`throw new Error(…)`) when the resolved path leaves `baseDir`: through `..`, through an absolute name or into a neighbour folder with a similar name (`data-backup` next to `data`).

        **Run** tries five names and prints which ones are allowed. **Check** calls the function with other names, including ones that try to escape the folder.
    testTitles:
      "a plain name gives an absolute path inside the folder":
        uk: "Звичайна назва дає абсолютний шлях усередині теки"
        en: "A plain name gives an absolute path inside the folder"
      "a name with .. that stays inside is allowed":
        uk: "Назва з `..`, що лишається всередині, дозволена"
        en: "A name with `..` that stays inside is allowed"
      "a name that climbs out with .. is rejected":
        uk: "Назва, що виходить угору через `..`, відхилена"
        en: "A name that climbs out with `..` is rejected"
      "an absolute name is rejected":
        uk: "Абсолютна назва відхилена"
        en: "An absolute name is rejected"
      "a neighbour folder whose name starts the same is rejected":
        uk: "Сусідня тека з такою самою початковою назвою відхилена"
        en: "A neighbour folder whose name starts the same is rejected"
      "a name built to survive stripping never lands outside":
        uk: "Назва `....//secrets.txt` ніколи не веде за межі теки"
        en: "The name `....//secrets.txt` never leads outside the folder"
    hints:
      nudge:
        uk: "Не досліджуй назву — спершу обчисли повний шлях, який з неї вийде, і досліджуй уже його."
        en: "Do not inspect the name — first compute the full path it turns into, and inspect that."
      explanation:
        uk: "`path.resolve(тека, назва)` дає абсолютний шлях. `path.relative(від, до)` відповідає, як дійти від однієї теки до іншого шляху: наприклад, `path.relative('/home/me/notes', '/home/me/photos/cat.svg')` — це `'../photos/cat.svg'`, тобто треба вийти вгору. Якщо відповідь виходить угору або сама є абсолютним шляхом — шлях поза текою. Порівнювати початок тексту без роздільника (`/`) — пастка: `notes-old` починається з `notes`."
        en: "`path.resolve(folder, name)` gives an absolute path. `path.relative(from, to)` answers how to get from one folder to another path: for example, `path.relative('/home/me/notes', '/home/me/photos/cat.svg')` is `'../photos/cat.svg'`, so you must climb up. If the answer climbs up or is itself an absolute path, the path is outside the folder. Comparing the start of the text without the separator (`/`) is a trap: `notes-old` starts with `notes`."
    solutionNote:
      uk: "Функція розв’язує теку й назву, а потім питає `path.relative`, як дійти від теки до результату. Відповідь, що починається з `..` чи є абсолютною (інший диск на Windows), означає «поза текою». Порівнюється саме `..` разом із роздільником, тож файл із назвою на кшталт `..notes.json` усередині теки не відхиляється помилково. Рівноцінний варіант — `target.startsWith(base + path.sep)`: роздільник у кінці відсікає `data-backup`."
      en: "The function resolves the folder and the name, then asks `path.relative` how to get from the folder to the result. An answer that starts with `..` or is absolute (another drive on Windows) means “outside”. It compares `..` together with the separator, so a file named like `..notes.json` inside the folder is not rejected by mistake. An equivalent version is `target.startsWith(base + path.sep)`: the trailing separator rules out `data-backup`."
    feedback:
      - when: { test: "a plain name gives an absolute path inside the folder" }
        message:
          uk: "Ця перевірка очікує, що `resolveInside(base, 'wishlist.json')` поверне абсолютний шлях `base` + `wishlist.json` (як дає `path.resolve`), а не відносний і не текст із зайвими `/`."
          en: "This check expects `resolveInside(base, 'wishlist.json')` to return the absolute path `base` + `wishlist.json` (as `path.resolve` gives it), not a relative one and not text with extra `/`."
      - when: { test: "a name with .. that stays inside is allowed" }
        message:
          uk: "Ця перевірка очікує, що `archive/../planner.json` буде дозволено: після розв’язання це просто `planner.json` у теці. Якщо функція відхиляє кожну назву з `..`, вона перевіряє назву, а не результат."
          en: "This check expects `archive/../planner.json` to be allowed: once resolved, it is just `planner.json` in the folder. If the function rejects every name containing `..`, it checks the name, not the result."
      - when: { test: "a name that climbs out with .. is rejected" }
        message:
          uk: "Ця перевірка очікує помилку для `../secrets.txt` і `archive/../../secrets.txt`. Прибирати `../` з назви недостатньо — функція має кинути помилку, коли розв’язаний шлях поза текою."
          en: "This check expects an error for `../secrets.txt` and `archive/../../secrets.txt`. Removing `../` from the name is not enough — the function must throw when the resolved path is outside the folder."
      - when: { test: "an absolute name is rejected" }
        message:
          uk: "Ця перевірка очікує помилку для `/etc/hosts`. `path.resolve` з абсолютною назвою відкидає теку даних, тож перевіряй розв’язаний результат, а не те, чи починається назва з `..`."
          en: "This check expects an error for `/etc/hosts`. `path.resolve` with an absolute name discards the data folder, so check the resolved result, not whether the name starts with `..`."
      - when: { test: "a neighbour folder whose name starts the same is rejected" }
        message:
          uk: "Ця перевірка очікує помилку для `../data-backup/wishlist.json`. Шлях `…/data-backup/…` починається з тексту `…/data` — порівнюй разом із роздільником або через `path.relative`."
          en: "This check expects an error for `../data-backup/wishlist.json`. The path `…/data-backup/…` starts with the text `…/data` — compare together with the separator or use `path.relative`."
      - when: { test: "a name built to survive stripping never lands outside" }
        message:
          uk: "Ця перевірка очікує, що `....//secrets.txt` або буде відхилено, або дасть шлях усередині теки. Якщо функція спершу прибирає `../` з назви, із залишків складається новий `../`."
          en: "This check expects `....//secrets.txt` either to be rejected or to give a path inside the folder. If the function first removes `../` from the name, the leftovers form a new `../`."

  - id: to-project
    kind: transfer
    capstoneStep: NO-02
    body:
      uk: "У кроці проєкту цього розділу твій сервер зберігатиме записи у файл у теці даних. Шлях до неї ти будуватимеш від `import.meta.dirname`, а не від робочої теки, і кожну назву файла пропускатимеш через `resolveInside`."
      en: "In this unit’s project step your server stores its records in a file in a data folder. You build the path to it from `import.meta.dirname`, not from the working directory, and pass every file name through `resolveInside`."
