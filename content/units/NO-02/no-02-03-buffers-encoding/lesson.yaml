      uk: "У кроці проєкту цього розділу файл даних твого домену зберігатиметься в UTF-8, і репозиторій читатиме його з явно вказаним кодуванням. Назви бажань, справ, звичок чи витрат українською мають пережити запис і читання без жодного `�`."
      en: "In this unit’s project step your domain’s data file is stored as UTF-8, and the repository reads it with an explicit encoding. Ukrainian names of wishes, tasks, habits or expenses must survive writing and reading without a single `�`."
