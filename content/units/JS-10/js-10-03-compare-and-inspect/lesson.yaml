id: js-10-03-compare-and-inspect
unit: JS-10
title:
  uk: "Порівнюємо поведінку й перевіряємо через DevTools"
  en: "Compare behavior and inspect with DevTools"
kind: local-task
minutes: 35
contentVersion: 1
purpose:
  uk: "Довести, що локальний проєкт — та сама програма, що й у платформі: ті самі дані, ті самі підсумки, та сама поведінка. А потім додати інструменти, з якими працюють професійні проєкти: lint, форматування, збірку й source map."
  en: "Prove that the local project is the same program as in the platform: the same data, the same totals, the same behavior. Then add the tools professional projects work with: lint, formatting, a build and a source map."
objectives:
  - uk: "Переконатися, що на новій адресі сховище порожнє, перенести записи з платформи через сторінку відновлення з експорту й порівняти CRUD, фільтр і підсумок із версією в платформі."
    en: "Confirm that the storage is empty at the new address, move the records from the platform through the export's restore page and compare CRUD, the filter and the totals with the platform version."
  - uk: "Додати ESLint і Prettier, довести lint до чистого результату й відрізнити зауваження lint від змін форматування; зібрати bundle з source map через esbuild і зупинитися на точці зупинки в оригінальному модулі домену."
    en: "Add ESLint and Prettier, bring lint to a clean result and tell a lint finding from a formatting change; build a bundle with a source map with esbuild and stop at a breakpoint in the original domain module."
prerequisites: [js-10-02-export-open-install-run, js-07-05-persist-reload]
subskills:
  - { family: P-01, skill: "source maps", depth: assess }
  - { family: P-01, skill: "lint/format", depth: assess }
glossary: []
selfCheck: [predict-localhost]

blocks:
  - id: new-address
    kind: explanation
    title:
      uk: "Та сама програма, нова адреса"
      en: "The same program, a new address"
    body:
      uk: |
        Локально проєкт відкривається за адресою `http://127.0.0.1:4300/`. Для браузера це **нова адреса**, тож її `localStorage` порожній, і сторінка стартує з початкових записів.

        Твої записи приїхали з експортом як текст у файлі `data/exported-storage.json`. Сам браузер цей файл не читає. Переносить дані сторінка `tools/restore-data.html`:

        - відкривати її треба на **тій самій** адресі й порту, що й проєкт, — вона пише в `localStorage` саме тієї адреси, на якій відкрита;
        - вона показує таблицю «Ключ · Значення · Стан» і нічого не змінює, доки ти не натиснеш «Відновити дані»;
        - твоїх файлів вона не чіпає.

        `serve.mjs` відповідає і на `127.0.0.1:4300`, і на `localhost:4300`. Обидві адреси ведуть на той самий комп’ютер, але для браузера це два різні сховища.
      en: |
        Locally the project opens at `http://127.0.0.1:4300/`. To the browser this is a **new address**, so its `localStorage` is empty, and the page starts from the starting records.

        Your records travelled with the export as text in the file `data/exported-storage.json`. The browser does not read that file by itself. The page `tools/restore-data.html` moves the data:

        - open it at the **same** address and port as the project — it writes into the `localStorage` of exactly the address it is open at;
        - it shows a table “Key · Value · State” and changes nothing until you press “Restore data”;
        - it does not touch your files.

        `serve.mjs` answers at both `127.0.0.1:4300` and `localhost:4300`. Both lead to the same computer, but to the browser they are two different storages.

  - id: predict-localhost
    kind: prediction
    prompt:
      uk: "Ти відкрив `http://127.0.0.1:4300/tools/restore-data.html`, натиснув «Відновити дані», і сторінка проєкту за `http://127.0.0.1:4300/` показує твої записи. Тепер у тому самому браузері відкриваєш `http://localhost:4300/`. Що побачиш?"
      en: "You opened `http://127.0.0.1:4300/tools/restore-data.html`, pressed “Restore data”, and the project page at `http://127.0.0.1:4300/` shows your records. Now, in the same browser, you open `http://localhost:4300/`. What do you see?"
    answer:
      type: choice
      options:
        - id: starting
          text:
            uk: "Початкові записи: у `localhost:4300` власне сховище, і воно порожнє"
            en: "The starting records: `localhost:4300` has its own storage, and it is empty"
        - id: same
          text:
            uk: "Свої записи: це той самий сервер і той самий порт"
            en: "My records: it is the same server and the same port"
          why:
            uk: "Сервер той самий, але сховище належить не серверу, а адресі сторінки в браузері. `localhost` і `127.0.0.1` — різні хости, тож і сховища різні."
            en: "The server is the same, but the storage belongs to the page's address in the browser, not to the server. `localhost` and `127.0.0.1` are different hosts, so the storages differ too."
        - id: refused
          text:
            uk: "Помилку: сервер слухає лише `127.0.0.1`"
            en: "An error: the server listens on `127.0.0.1` only"
          why:
            uk: "`localhost` на твоєму комп’ютері веде на ту саму машину, і `serve.mjs` прямо дозволяє обидві назви. Сторінка відкриється — лише з порожнім сховищем."
            en: "On your computer `localhost` leads to the same machine, and `serve.mjs` explicitly accepts both names. The page opens — just with an empty storage."
      correct: [starting]
    explanation:
      uk: "Під час перевірки цього уроку саме так і було: на `127.0.0.1:4300` після відновлення — свої записи, на `localhost:4300` — початкові й порожній `localStorage`. Якщо записи «зникли», перш за все глянь в адресний рядок."
      en: "That is exactly what happened when this lesson was checked: at `127.0.0.1:4300`, after the restore, your own records; at `localhost:4300`, the starting ones and an empty `localStorage`. If your records “disappeared”, look at the address bar first."

  - id: recall-origin
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: two-ports
        from: js-07-05-persist-reload
        prompt:
          uk: "Той самий проєкт ти запускаєш у тому самому браузері спершу на `http://127.0.0.1:4300/`, а потім на `http://127.0.0.1:4301/`. Скільки окремих сховищ `localStorage` при цьому задіяно?"
          en: "In the same browser you run the same project first at `http://127.0.0.1:4300/` and then at `http://127.0.0.1:4301/`. How many separate `localStorage` storages are involved?"
        answer:
          type: choice
          options:
            - { id: two, text: { uk: "Два", en: "Two" } }
            - id: one
              text: { uk: "Одне: хост той самий", en: "One: the host is the same" }
              why:
                uk: "Сховище належить усій адресі: схемі, хосту **і порту**. Інший порт — інше сховище."
                en: "The storage belongs to the whole address: the scheme, the host **and the port**. Another port, another storage."
            - id: none
              text: { uk: "Жодного: `localStorage` працює лише в інтернеті", en: "None: `localStorage` works only on the internet" }
              why:
                uk: "`localStorage` працює на будь-якій адресі `http`, і на твоєму комп’ютері теж."
                en: "`localStorage` works at any `http` address, on your own computer too."
          correct: [two]
        explanation:
          uk: "Схема, хост і порт разом визначають адресу сторінки, а з нею й сховище. Тому друга копія проєкту на порту 4301 стартує з порожнім сховищем."
          en: "The scheme, the host and the port together define the page's address, and with it the storage. That is why a second copy of the project on port 4301 starts with empty storage."

  - id: restore-compare
    kind: local-task
    runtime: local-web
    title:
      uk: "Віднови дані й порівняй із платформою"
      en: "Restore the data and compare with the platform"
    intro:
      uk: |
        Тримай поруч дві вкладки: платформу (**Мій проєкт** → **Запустити** → вкладка **Сторінка**) і локальний проєкт. Приклади — для «Списку бажань»; для свого проєкту бери ключ і функцію фільтра з таблиці (назви — з кроку JS-07; якщо наступні кроки їх змінили, бери свої з `storage/` і `domain/`):

        | Проєкт | Ключ сховища | Фільтр |
        |---|---|---|
        | Список бажань | `jsll.wishlist.v1` | `filterItems(…, "acquired")` у `/domain/wishes.js` |
        | Планувальник | `jsll.planner.v1` | `filterTasks(…, "done")` у `/domain/tasks.js` |
        | Трекер звичок | `jsll.habits.v1` | `filterHabits(…, "active")` у `/domain/habits.js` |
        | Трекер витрат | `jsll.expenses.v1` | `filterExpenses(…, "food")` у `/domain/expenses.js` |

        DevTools відкривається клавішею F12 (у macOS — Cmd+Option+I). Назви панелей наведено для Google Chrome.
      en: |
        Keep two tabs side by side: the platform (**My project** → **Run** → the **Page** tab) and the local project. The examples are for the wishlist; for your project take the storage key and the filter function from the table (the names are from step JS-07; if later steps changed them, take yours from `storage/` and `domain/`):

        | Project | Storage key | Filter |
        |---|---|---|
        | Wishlist | `jsll.wishlist.v1` | `filterItems(…, "acquired")` in `/domain/wishes.js` |
        | Planner | `jsll.planner.v1` | `filterTasks(…, "done")` in `/domain/tasks.js` |
        | Habit tracker | `jsll.habits.v1` | `filterHabits(…, "active")` in `/domain/habits.js` |
        | Expense tracker | `jsll.expenses.v1` | `filterExpenses(…, "food")` in `/domain/expenses.js` |

        DevTools opens with F12 (on macOS, Cmd+Option+I). Panel names are given for Google Chrome.
    tools:
      - { name: "Node.js", version: "22.13+" }
      - { name: "Google Chrome", note: { uk: "або інший браузер із DevTools; назви панелей можуть відрізнятися", en: "or another browser with DevTools; panel names may differ" } }
    steps:
      - text:
          uk: "У вбудованому терміналі VS Code, у корені проєкту, запусти проєкт (якщо він ще не працює)."
          en: "In the VS Code integrated terminal, at the project root, start the project (if it is not running yet)."
        command: "npm start"
      - text:
          uk: "Відкрий `http://127.0.0.1:4300/`, а в DevTools — панель **Application**, розділ **Local storage**, запис `http://127.0.0.1:4300`."
          en: "Open `http://127.0.0.1:4300/`, and in DevTools the **Application** panel, the **Local storage** section, the entry `http://127.0.0.1:4300`."
        expect:
          uk: "Сторінка показує початкові записи, а в **Local storage** для цієї адреси немає жодного ключа. У панелі **Console** може бути червоний рядок `Failed to load resource: the server responded with a status of 404 (Not Found)` для `favicon.ico`: браузер сам просить значок для вкладки, а в проєкті його немає. Це не помилка проєкту, і в платформі такого рядка немає."
          en: "The page shows the starting records, and **Local storage** has no keys for this address. The **Console** panel may show a red line `Failed to load resource: the server responded with a status of 404 (Not Found)` for `favicon.ico`: the browser itself asks for an icon for the tab, and the project has none. It is not an error of the project, and the platform does not show this line."
      - text:
          uk: "Відкрий сторінку відновлення на тій самій адресі й порту: `http://127.0.0.1:4300/tools/restore-data.html`."
          en: "Open the restore page at the same address and port: `http://127.0.0.1:4300/tools/restore-data.html`."
        expect:
          uk: "Заголовок «Відновлення збережених даних», рядок «Дані буде записано для адреси http://127.0.0.1:4300…» і таблиця «Ключ · Значення · Стан» з ключем твого проєкту й станом «буде додано» (в англійському проєкті — «will be added»)."
          en: "The heading “Restore saved data”, the line “The data will be written for http://127.0.0.1:4300…” and a table “Key · Value · State” with your project's key and the state “will be added” (in a Ukrainian project, «буде додано»)."
      - text:
          uk: "Натисни «Відновити дані»."
          en: "Press “Restore data”."
        expect:
          uk: "«Готово: записано 1. Відкрий проєкт, щоб побачити ті самі дані.» Стан у таблиці змінився на «вже є»."
          en: "“Done: 1 written. Open the project to see the same data.” The state in the table changed to “already there”."
      - text:
          uk: "Відкрий `http://127.0.0.1:4300/` і порівняй рядок підсумку під формою з тим самим рядком у платформі. Потім онови сторінку (Cmd+R / Ctrl+R)."
          en: "Open `http://127.0.0.1:4300/` and compare the summary line under the form with the same line in the platform. Then reload the page (Cmd+R / Ctrl+R)."
        expect:
          uk: "Ті самі записи й слово в слово той самий підсумок, що й у платформі, — і після оновлення теж. Наприклад: «Бажань: 7 · Ще хочу на суму: 410 · Без ціни: 1»."
          en: "The same records and word for word the same summary as in the platform — after the reload too. For example: “Wishes: 7 · Still wanted, total: 410 · Without a price: 1”."
      - text:
          uk: "Перевір фільтр домену. У DevTools відкрий панель **Console** і встав рядок нижче (для свого проєкту заміни ключ, файл і функцію за таблицею). Потім порахуй у платформі картки з позначкою отриманого бажання."
          en: "Check the domain filter. In DevTools open the **Console** panel and paste the line below (for your project replace the key, the file and the function from the table). Then count, in the platform, the cards marked as acquired."
        command: "const { filterItems } = await import(\"/domain/wishes.js\"); filterItems(JSON.parse(localStorage.getItem(\"jsll.wishlist.v1\")).records, \"acquired\").length"
        expect:
          uk: "Число в консолі дорівнює кількості таких карток у платформі (під час перевірки уроку — `2` і 2)."
          en: "The number in the console equals the number of such cards in the platform (when this lesson was checked: `2` and 2)."
      - text:
          uk: "Перевір CRUD і збереження: додай у локальній сторінці новий запис, онови сторінку, зміни його через «Редагувати», знову онови, а тоді видали."
          en: "Check CRUD and saving: add a new record in the local page, reload, change it with “Edit”, reload again, then delete it."
        expect:
          uk: "Після кожного оновлення запис і підсумок такі, якими ти їх залишив. Після видалення підсумок знову такий самий, як у платформі."
          en: "After every reload the record and the summary are as you left them. After the deletion the summary matches the platform again."
      - text:
          uk: "Зупинись усередині функції домену. У DevTools відкрий **Sources**, у дереві `127.0.0.1:4300` → `domain` відкрий файл домену й клацни номер рядка коду всередині функції додавання (у «Списку бажань» — `addItem`). Додай запис через форму."
          en: "Stop inside a domain function. In DevTools open **Sources**, in the tree `127.0.0.1:4300` → `domain` open the domain file and click the number of a line of code inside the add function (in the wishlist, `addItem`). Add a record through the form."
        expect:
          uk: "Виконання зупиняється на цьому рядку, у **Scope** видно `list`, `id` і `input`. Кнопка Resume (F8) продовжує роботу. Без збірки DevTools показує саме твій файл, рядок у рядок."
          en: "Execution pauses at that line, and **Scope** shows `list`, `id` and `input`. The Resume button (F8) continues. Without a build, DevTools shows exactly your file, line for line."
    verify:
      - id: empty-first
        text:
          uk: "На новій адресі сховище спершу було порожнє, а сторінка показувала початкові записи."
          en: "At the new address the storage was empty at first, and the page showed the starting records."
      - id: restored-same
        text:
          uk: "Після відновлення локальна сторінка показує ті самі записи й той самий підсумок, що й платформа, також після оновлення."
          en: "After the restore the local page shows the same records and the same summary as the platform, also after a reload."
      - id: filter-same
        text:
          uk: "Фільтр домену в консолі дав те саме число, що я нарахував у платформі."
          en: "The domain filter in the console gave the same number I counted in the platform."
      - id: crud-kept
        text:
          uk: "Доданий і змінений запис пережили оновлення сторінки, а після видалення підсумок знову збігся з платформою."
          en: "The added and changed record survived a reload, and after the deletion the summary matched the platform again."
      - id: paused-domain
        text:
          uk: "Виконання зупинилося на моїй точці зупинки у файлі домену."
          en: "Execution paused at my breakpoint in the domain file."
    troubleshooting:
      - problem:
          uk: "Сторінка відновлення пише «Цю сторінку відкрито як файл…»"
          en: "The restore page says “This page was opened as a file…”"
        fix:
          uk: "Ти відкрив її подвійним кліком (`file://`). Відкрий її за адресою з терміналу: `http://127.0.0.1:4300/tools/restore-data.html`."
          en: "You opened it with a double click (`file://`). Open it at the address from the terminal: `http://127.0.0.1:4300/tools/restore-data.html`."
      - problem:
          uk: "«У платформі сховище проєкту було порожнім — відновлювати нічого.»"
          en: "“The project storage in the platform was empty — there is nothing to restore.”"
        fix:
          uk: "У момент експорту сховище проєкту в платформі не мало записів. Додай записи в платформі й експортуй ще раз, розпакуй новий архів в **окрему** теку й скопіюй із нього лише `data/exported-storage.json`. Свої файли не перезаписуй."
          en: "At export time the project storage in the platform had no records. Add records in the platform and export again, unpack the new archive into a **separate** folder and copy only `data/exported-storage.json` from it. Do not overwrite your own files."
      - problem:
          uk: "Дані відновлено, але проєкт їх не показує"
          en: "The data was restored, but the project does not show it"
        fix:
          uk: "Порівняй адресу сторінки відновлення з адресою проєкту: хост і порт мають збігатися (`127.0.0.1` ≠ `localhost`, 4300 ≠ 4301). Відкрий відновлення на тій адресі, де працює проєкт."
          en: "Compare the restore page's address with the project's: the host and port must match (`127.0.0.1` ≠ `localhost`, 4300 ≠ 4301). Open the restore page at the address the project runs at."
      - problem:
          uk: "Chrome не дає вставити рядок у **Console** і просить ввести `allow pasting`"
          en: "Chrome does not let you paste the line into the **Console** and asks you to type `allow pasting`"
        fix:
          uk: "Так Chrome захищає людей, яким хтось підсунув чужий код. Спершу прочитай рядок: він лише імпортує твій власний файл домену й читає сховище твого проєкту. Тоді введи `allow pasting`, натисни Enter і встав рядок ще раз — або просто надрукуй його сам."
          en: "This is how Chrome protects people who were handed someone else's code. Read the line first: it only imports your own domain file and reads your project's storage. Then type `allow pasting`, press Enter and paste the line again — or simply type it yourself."
      - problem:
          uk: "Консоль пише `TypeError: Cannot read properties of null (reading 'records')`"
          en: "The console says `TypeError: Cannot read properties of null (reading 'records')`"
        fix:
          uk: "`localStorage.getItem(…)` повернув `null`: для цієї адреси під цим ключем нічого не збережено. Або ти ще не відновив дані, або консоль відкрито на іншій адресі (`localhost` замість `127.0.0.1`, інший порт), або ключ не той — звір його з таблицею вгорі завдання."
          en: "`localStorage.getItem(…)` returned `null`: nothing is saved under that key for this address. Either you have not restored the data yet, or the console is open at another address (`localhost` instead of `127.0.0.1`, another port), or the key is wrong — compare it with the table at the top of the task."
      - problem:
          uk: "Консоль пише `SyntaxError` або `Failed to fetch dynamically imported module`"
          en: "The console says `SyntaxError` or `Failed to fetch dynamically imported module`"
        fix:
          uk: "Перевір шлях до файла домену й назву функції за таблицею. Шлях починається з `/` — від кореня сайту, тобто від теки проєкту."
          en: "Check the path of the domain file and the function name against the table. The path starts with `/` — from the site's root, that is, the project folder."
    recovery:
      uk: "Сторінка відновлення змінює лише `localStorage` цієї адреси, а не файли. Щоб почати порівняння спочатку, у DevTools → **Application** → **Local storage** клацни правою кнопкою адресу й обери **Clear**, а тоді віднови дані ще раз."
      en: "The restore page changes only the `localStorage` of this address, never files. To start the comparison over, in DevTools → **Application** → **Local storage** right-click the address, choose **Clear**, and restore the data again."

  - id: pro-tools
    kind: explanation
    title:
      uk: "Lint, форматування, збірка: чого в експорті ще немає"
      en: "Lint, formatting, a build: what the export does not have yet"
    body:
      uk: |
        Експорт свідомо простий: жодних залежностей. Тепер, коли головна — твоя тека, додамо ті самі три інструменти, що й у `money-lab` з розділу про термінал, як [[dev-dependency|dev-залежності]] (потрібні для розробки, не для роботи сторінки):

        - **ESLint** — [[linter]]: шукає підозрілий код (невикористані назви, невідомі глобальні назви). Його зауваження варто прочитати й зрозуміти.
        - **Prettier** — [[formatter]]: переставляє пробіли й перенесення рядків, додає коми й лапки за єдиними правилами. Поведінки не змінює.
        - **esbuild** — [[build-step|збирання]]: складає модулі в один файл ([[bundle]]) і пише до нього [[source-map|source map]] — карту, яка каже DevTools, з якого рядка якого оригінального файла вийшла кожна частина bundle.

        Код сторінки виконується в браузері, а `serve.mjs` — у Node.js. Тому ESLint отримає різні глобальні назви: браузерні (`document`, `localStorage`) для `.js` і Node.js (`process`) для `.mjs`. Файл налаштувань, як і в `money-lab`, матиме назву `eslint.config.mjs`.

        Встановлення один раз потребує інтернету (реєстр npm). `node_modules/` і `dist/` у Git не додаємо: їх завжди можна відтворити.
      en: |
        The export is simple on purpose: no dependencies. Now that your folder is the main version, we add the same three tools as in `money-lab` from the terminal unit, as [[dev-dependency|dev dependencies]] (needed for development, not for the page to work):

        - **ESLint** — a [[linter]]: finds suspicious code (unused names, unknown global names). Its findings are worth reading and understanding.
        - **Prettier** — a [[formatter]]: rearranges spaces and line breaks and adds commas and quotes by one set of rules. It does not change behavior.
        - **esbuild** — a [[build-step|build]]: combines the modules into one file (a [[bundle]]) and writes a [[source-map|source map]] for it — a map that tells DevTools which line of which original file every part of the bundle came from.

        The page code runs in the browser, while `serve.mjs` runs in Node.js. So ESLint gets different global names: browser ones (`document`, `localStorage`) for `.js` and Node.js ones (`process`) for `.mjs`. As in `money-lab`, the settings file is named `eslint.config.mjs`.

        Installing needs the internet once (the npm registry). `node_modules/` and `dist/` do not go into Git: they can always be recreated.

  - id: lint-format
    kind: local-task
    runtime: local-web
    title:
      uk: "ESLint і Prettier у твоєму проєкті"
      en: "ESLint and Prettier in your project"
    intro:
      uk: |
        Команди перевірено з ESLint 10.11.0, `@eslint/js` 10.0.1, `globals` 17.13.0 і Prettier 3.9.9 на всіх чотирьох проєктах. Потрібен інтернет. Створи в корені проєкту файл `eslint.config.mjs` саме з таким вмістом:

        ```js
        import js from "@eslint/js";
        import globals from "globals";

        export default [
          { ignores: ["dist/"] },
          js.configs.recommended,
          { files: ["**/*.js"], languageOptions: { globals: globals.browser } },
          { files: ["**/*.mjs"], languageOptions: { globals: globals.node } },
        ];
        ```
      en: |
        The commands were checked with ESLint 10.11.0, `@eslint/js` 10.0.1, `globals` 17.13.0 and Prettier 3.9.9 on all four projects. You need the internet. Create a file `eslint.config.mjs` at the project root with exactly this content:

        ```js
        import js from "@eslint/js";
        import globals from "globals";

        export default [
          { ignores: ["dist/"] },
          js.configs.recommended,
          { files: ["**/*.js"], languageOptions: { globals: globals.browser } },
          { files: ["**/*.mjs"], languageOptions: { globals: globals.node } },
        ];
        ```
    tools:
      - { name: "npm", version: "10+", note: { uk: "з доступом до інтернету", en: "with internet access" } }
      - { name: "ESLint", version: "10", note: { uk: "встановиш у цьому завданні", en: "installed in this task" } }
      - { name: "Prettier", version: "3", note: { uk: "встановиш у цьому завданні", en: "installed in this task" } }
    steps:
      - text:
          uk: "Допиши в `.gitignore` теки, яких не має бути в Git. `>>` додає рядки в кінець файла (і створює файл, якщо його ще немає), не стираючи того, що там уже є. Перший `\\n` починає новий рядок на випадок, якщо файл не закінчується перенесенням."
          en: "Append to `.gitignore` the folders that must not be in Git. `>>` adds lines at the end of the file (and creates the file if it does not exist yet) without erasing what is already there. The first `\\n` starts a new line in case the file does not end with a line break."
        command: "printf '\\nnode_modules/\\ndist/\\n' >> .gitignore"
        expect:
          uk: "Нічого не виводиться. `cat .gitignore` показує рядки `node_modules/` і `dist/` в кінці."
          en: "Nothing is printed. `cat .gitignore` shows the lines `node_modules/` and `dist/` at the end."
      - text:
          uk: "Встанови ESLint, його рекомендовані правила й списки глобальних назв."
          en: "Install ESLint, its recommended rules and the lists of global names."
        command: "npm install --save-dev eslint @eslint/js globals"
        expect:
          uk: "Рядок на кшталт `added 79 packages, and audited 80 packages` (числа можуть відрізнятися). У `package.json` з’явився розділ `devDependencies`, а `package-lock.json` суттєво виріс."
          en: "A line like `added 79 packages, and audited 80 packages` (the numbers may differ). `package.json` got a `devDependencies` section, and `package-lock.json` grew a lot."
      - text:
          uk: "Створи `eslint.config.mjs` з вмісту вище й додай скрипт `lint`."
          en: "Create `eslint.config.mjs` with the content above and add a `lint` script."
        command: "npm pkg set scripts.lint=\"eslint .\""
      - text:
          uk: "Запусти lint."
          en: "Run lint."
        command: "npm run lint"
        expect:
          uk: "Одне зауваження в модулі сховища. ESLint друкує повний шлях до файла окремим рядком (наприклад, `/Users/you/js-course/wishlist/storage/wishes.js`), під ним — `40:12  error  'error' is defined but never used  no-unused-vars` (рядок коду 40, стовпчик 12), а в кінці `✖ 1 problem (1 error, 0 warnings)`. Під час перевірки уроку так було в усіх чотирьох проєктах: `storage/tasks.js` 40:12, `storage/habits.js` 41:12, `storage/expenses.js` 38:12."
          en: "One finding in the storage module. ESLint prints the full path of the file on a line of its own (for example `/Users/you/js-course/wishlist/storage/wishes.js`), under it `40:12  error  'error' is defined but never used  no-unused-vars` (line 40, column 12), and at the end `✖ 1 problem (1 error, 0 warnings)`. When this lesson was checked, all four projects had it: `storage/tasks.js` 40:12, `storage/habits.js` 41:12, `storage/expenses.js` 38:12."
      - text:
          uk: "Відкрий файл на вказаному рядку. Там `catch (error)`, хоча назва `error` у блоці не використовується. Якщо назва помилки не потрібна, її можна просто не писати: `catch {`. Виправ і запусти lint знову."
          en: "Open the file at the reported line. It has `catch (error)`, while the name `error` is never used in the block. When the error's name is not needed, you can simply leave it out: `catch {`. Fix it and run lint again."
        command: "npm run lint"
        expect:
          uk: "Лише два рядки заголовка (`> … lint` і `> eslint .`) і жодного зауваження."
          en: "Only the two header lines (`> … lint` and `> eslint .`) and no findings."
      - text:
          uk: "Встанови Prettier точної версії (`--save-exact`), щоб у всіх, хто клонує проєкт, форматування було однаковим."
          en: "Install Prettier at an exact version (`--save-exact`), so everyone who clones the project gets the same formatting."
        command: "npm install --save-dev --save-exact prettier"
      - text:
          uk: "Додай скрипт форматування лише для твого коду."
          en: "Add a formatting script for your own code only."
        command: "npm pkg set scripts.format=\"prettier --write app.js domain storage ui\""
      - text:
          uk: "Відформатуй."
          en: "Format."
        command: "npm run format"
        expect:
          uk: "Список файлів із часом. Змінені файли — без позначки, незмінені — з `(unchanged)`. Під час перевірки уроку Prettier змінив файл домену й `ui/page.js`."
          en: "A list of files with times. Changed files have no mark, unchanged ones say `(unchanged)`. When this lesson was checked, Prettier changed the domain file and `ui/page.js`."
      - text:
          uk: "Подивись, що саме змінило форматування."
          en: "Look at what the formatting changed."
        command: "git diff --stat"
        expect:
          uk: "Змінено файли, які назвав Prettier, модуль сховища (твоє виправлення для lint), `package.json` і `package-lock.json`. Нових `.gitignore` і `eslint.config.mjs` тут не видно, доки Git їх не відстежує. `git diff` для файла домену показує інші перенесення рядків, пробіли й кому після останнього елемента списку чи об’єкта — у JavaScript вона дозволена (на відміну від JSON). Жодної нової логіки."
          en: "The files Prettier named are changed, plus the storage module (your lint fix), `package.json` and `package-lock.json`. The new `.gitignore` and `eslint.config.mjs` do not show here while Git does not track them yet. `git diff` for the domain file shows different line breaks, spaces and a comma after the last item of a list or object — JavaScript allows it (unlike JSON). No new logic."
      - text:
          uk: "Переконайся, що після форматування lint і далі чистий, а проєкт працює (перезапусти `npm start`, якщо зупиняв)."
          en: "Make sure lint is still clean after formatting and the project still works (restart `npm start` if you stopped it)."
        command: "npm run lint"
    verify:
      - id: finding-read
        text:
          uk: "Я побачив зауваження `no-unused-vars` з файлом і рядком і зрозумів, що воно означає."
          en: "I saw the `no-unused-vars` finding with its file and line and understood what it means."
      - id: lint-clean
        text:
          uk: "`npm run lint` завершується без зауважень."
          en: "`npm run lint` finishes with no findings."
      - id: format-layout
        text:
          uk: "`git diff` після `npm run format` показує в моєму коді лише зміни оформлення — пробіли, перенесення рядків і коми в кінці списків — і жодної зміни логіки."
          en: "`git diff` after `npm run format` shows only layout changes in my code — spaces, line breaks and trailing commas — and no change of logic."
    troubleshooting:
      - problem:
          uk: "`npm error code ENOTFOUND` або `ETIMEDOUT` під час встановлення"
          en: "`npm error code ENOTFOUND` or `ETIMEDOUT` during the install"
        fix:
          uk: "Немає зв’язку з реєстром npm. Перевір інтернет і спробуй ще раз. Без інтернету це завдання не виконати: познач «Зроблю пізніше» — це не зарахується як виконане."
          en: "There is no connection to the npm registry. Check the internet and try again. This task cannot be done offline: mark it “I will do it later” — that does not count as done."
      - problem:
          uk: "`'process' is not defined` у `serve.mjs`"
          en: "`'process' is not defined` in `serve.mjs`"
        fix:
          uk: "Для `.mjs` бракує глобальних назв Node.js. Звір `eslint.config.mjs` із вмістом вище: рядок із `**/*.mjs` і `globals.node`."
          en: "The Node.js global names are missing for `.mjs`. Compare `eslint.config.mjs` with the content above: the line with `**/*.mjs` and `globals.node`."
      - problem:
          uk: "`sh: eslint: command not found`"
          en: "`sh: eslint: command not found`"
        fix:
          uk: "Немає `node_modules` (наприклад, у свіжому клоні). Встанови залежності з lockfile: `npm ci`."
          en: "There is no `node_modules` (in a fresh clone, for example). Install the dependencies from the lockfile: `npm ci`."
      - problem:
          uk: "Підказка в терміналі радить `sudo` або `npm audit fix --force`"
          en: "The terminal suggests `sudo` or `npm audit fix --force`"
        fix:
          uk: "Не виконуй. Для встановлення в теку проєкту `sudo` не потрібен, а `--force` може змінити версії так, що проєкт зламається. Прочитай повідомлення й поверни зміни через Git."
          en: "Do not run it. Installing into the project folder never needs `sudo`, and `--force` can change versions so that the project breaks. Read the message and undo the changes with Git."
    recovery:
      uk: "Усе, що було до цього завдання, — у commit. `git diff` показує кожну зміну; `git restore <файл>` повертає закомічену версію файла. `node_modules/` — згенерована тека: її можна видалити, а `npm ci` відтворить її з `package-lock.json`."
      en: "Everything from before this task is in a commit. `git diff` shows every change; `git restore <file>` brings back a file's committed version. `node_modules/` is a generated folder: it can be deleted, and `npm ci` recreates it from `package-lock.json`."

  - id: build-sourcemap
    kind: local-task
    runtime: local-web
    title:
      uk: "Самостійно: збірка з source map і точка зупинки в оригіналі"
      en: "On your own: a build with a source map and a breakpoint in the original"
    intro:
      uk: "Тут лише команди інструмента. Що шукати в DevTools і як довести, що source map працює, — вирішуєш сам. Перевірено з esbuild 0.28.2 і Google Chrome."
      en: "Only the tool's commands are given here. What to look for in DevTools and how to prove the source map works is up to you. Checked with esbuild 0.28.2 and Google Chrome."
    tools:
      - { name: "esbuild", version: "0.28", note: { uk: "встановиш у цьому завданні; потрібен інтернет", en: "installed in this task; needs the internet" } }
      - { name: "Google Chrome", note: { uk: "панель Sources у DevTools", en: "the Sources panel of DevTools" } }
    steps:
      - text:
          uk: "Встанови esbuild."
          en: "Install esbuild."
        command: "npm install --save-dev esbuild"
      - text:
          uk: "Додай скрипт збірки: усі модулі від `app.js` — в один мініфікований файл `dist/app.js` (мініфікований — стиснутий: без зайвих пробілів і перенесень, з короткими назвами змінних) із source map поруч."
          en: "Add a build script: every module from `app.js` into one minified file `dist/app.js` (minified means squeezed: no extra spaces or line breaks, short variable names) with a source map next to it."
        command: "npm pkg set scripts.build=\"esbuild app.js --bundle --sourcemap --minify --format=esm --outfile=dist/app.js\""
      - text:
          uk: "Збери."
          en: "Build."
        command: "npm run build"
        expect:
          uk: "`dist/app.js` і `dist/app.js.map` з розмірами (під час перевірки — 6.9kb і 23.3kb) та `⚡ Done in …ms`."
          en: "`dist/app.js` and `dist/app.js.map` with their sizes (when checked: 6.9kb and 23.3kb) and `⚡ Done in …ms`."
      - text:
          uk: "Створи сторінку для перевірки збірки: копію `index.html`, яка завантажує `dist/app.js` замість `app.js`."
          en: "Create a page to check the build: a copy of `index.html` that loads `dist/app.js` instead of `app.js`."
        command: "sed 's#src=\"app.js\"#src=\"dist/app.js\"#' index.html > build-check.html"
      - text:
          uk: "Відкрий `http://127.0.0.1:4300/build-check.html`. Доведи, що сторінка працює так само, як `index.html`. Потім знайди в **Sources** і сам bundle, і оригінальний модуль домену, що прийшов через source map, постав точку зупинки в оригінальному модулі й зупинись на ній. Вимкни source maps у налаштуваннях DevTools, перезавантаж сторінку й порівняй, що бачиш тепер. Увімкни їх назад."
          en: "Open `http://127.0.0.1:4300/build-check.html`. Prove that the page works the same as `index.html`. Then find in **Sources** both the bundle itself and the original domain module that came through the source map, set a breakpoint in the original module and stop at it. Turn source maps off in the DevTools settings, reload the page and compare what you see now. Turn them back on."
      - text:
          uk: "Переконайся, що lint не скаржиться на згенерований код."
          en: "Make sure lint does not complain about the generated code."
        command: "npm run lint"
      - text:
          uk: "Подивись, що піде в commit: `node_modules/` і `dist/` у списку бути не повинно."
          en: "Look at what will go into the commit: `node_modules/` and `dist/` must not be in the list."
        command: "git status"
      - text:
          uk: "Зафіксуй інструменти."
          en: "Record the tools."
        command: "git add -A"
      - text:
          uk: "Напиши в повідомленні, що саме додано."
          en: "Say in the message what exactly was added."
        command: "git commit -m \"Add ESLint, Prettier and an esbuild build with a source map\""
    verify:
      - id: bundle-built
        text:
          uk: "`npm run build` створив `dist/app.js` і `dist/app.js.map`, і `build-check.html` працює так само, як `index.html`."
          en: "`npm run build` created `dist/app.js` and `dist/app.js.map`, and `build-check.html` works the same as `index.html`."
      - id: paused-original
        text:
          uk: "Я зупинився на точці зупинки, поставленій в оригінальному модулі домену, хоча сторінка виконувала bundle."
          en: "I stopped at a breakpoint set in the original domain module, although the page ran the bundle."
      - id: maps-off
        text:
          uk: "Без source maps DevTools показав лише мініфікований bundle, і я можу пояснити різницю."
          en: "Without source maps DevTools showed only the minified bundle, and I can explain the difference."
      - id: committed-tools
        text:
          uk: "Lint чистий після збірки, а commit містить `eslint.config.mjs`, `.gitignore`, `build-check.html`, `package.json`, `package-lock.json` і відформатовані та виправлені файли коду, але не `node_modules/` і не `dist/`."
          en: "Lint is clean after the build, and the commit holds `eslint.config.mjs`, `.gitignore`, `build-check.html`, `package.json`, `package-lock.json` and the formatted and fixed code files, but neither `node_modules/` nor `dist/`."
    troubleshooting:
      - problem:
          uk: "`build-check.html` порожня, у консолі 404 для `dist/app.js`"
          en: "`build-check.html` is empty, the console shows 404 for `dist/app.js`"
        fix:
          uk: "Збірку не запущено або вона впала. Запусти `npm run build` і прочитай вивід."
          en: "The build was not run or failed. Run `npm run build` and read its output."
      - problem:
          uk: "Lint знаходить сотні зауважень у `dist/`"
          en: "Lint finds hundreds of findings in `dist/`"
        fix:
          uk: "У `eslint.config.mjs` бракує `{ ignores: [\"dist/\"] }`. Згенерований код не лінтують — лінтують оригінал."
          en: "`eslint.config.mjs` lacks `{ ignores: [\"dist/\"] }`. Generated code is not linted — the original is."
      - problem:
          uk: "`git status` показує `node_modules/` або `dist/`"
          en: "`git status` lists `node_modules/` or `dist/`"
        fix:
          uk: "Перевір `.gitignore`: у ньому мають бути рядки `node_modules/` і `dist/`. Не роби commit, доки їх не видно в списку."
          en: "Check `.gitignore`: it must contain the lines `node_modules/` and `dist/`. Do not commit while they appear in the list."
    recovery:
      uk: "`dist/` — згенерована тека: видали її й збери знову (`npm run build`). `build-check.html` — твій файл, його можна прибрати. Поки нічого не закомічено, `git restore <файл>` повертає попередню версію файла."
      en: "`dist/` is a generated folder: delete it and build again (`npm run build`). `build-check.html` is your own file and can be removed. Until you commit, `git restore <file>` brings back a file's previous version."

  - id: to-project
    kind: transfer
    capstoneStep: JS-10
    body:
      uk: "У контрольній точці CP-JS ти вже знатимеш, як довести, що локальний проєкт поводиться так само, як у платформі: ті самі дані, той самий підсумок, той самий фільтр, і все це переживає оновлення сторінки."
      en: "In the CP-JS checkpoint you will already know how to prove that the local project behaves as it does in the platform: the same data, the same totals, the same filter, and all of it survives a reload."
