id: js-10-02-export-open-install-run
unit: JS-10
title:
  uk: "Експорт, відкриття у VS Code, встановлення, запуск"
  en: "Export, open in VS Code, install, run"
kind: local-task
minutes: 25
contentVersion: 1
purpose:
  uk: "Перший запуск проєкту поза платформою. Платформа не бачить твого комп’ютера, тому кожен крок ти виконуєш сам у терміналі та VS Code і сам підтверджуєш, що побачив."
  en: "The first run of the project outside the platform. The platform cannot see your computer, so you carry out every step yourself in the terminal and VS Code and confirm yourself what you saw."
objectives:
  - uk: "Експортувати проєкт, розпакувати його поруч із текою проєкту з розділу про термінал, перенести файли, не перезаписавши закомічений README, відкрити теку у VS Code і працювати у вбудованому терміналі в корені проєкту."
    en: "Export the project, unpack it next to the project folder from the terminal unit, move the files in without overwriting the committed README, open the folder in VS Code and work in its integrated terminal at the project root."
  - uk: "Перед кожною командою перевіряти, де вона діятиме (`pwd`, `ls package.json`), запустити `npm install`, побачити, що встановлювати нічого, але з’явився `package-lock.json`, і запустити проєкт через `npm start`."
    en: "Before every command check where it will act (`pwd`, `ls package.json`), run `npm install`, see that there is nothing to install but a `package-lock.json` appears, and start the project with `npm start`."
prerequisites: [js-10-01-what-the-export-contains, js-15-04-install-lockfile-semver]
subskills:
  - { family: P-01, skill: "files/paths and shell navigation", depth: assess }
  - { family: P-01, skill: "safe commands", depth: assess }
  - { family: P-01, skill: "package manager/lockfile", depth: practice }
glossary: [integrated-terminal]
selfCheck: [predict-too-high, predict-inside-other]

blocks:
  - id: where-am-i
    kind: explanation
    title:
      uk: "Спершу — де я"
      en: "First: where am I"
    body:
      uk: |
        Кожна команда в терміналі діє в **поточній теці**. Для `npm` це особливо важливо: `npm start` шукає `package.json` у поточній теці, а якщо там його немає — у батьківській, потім ще вище, аж до кореня диска.

        Тому перед будь-якою командою `npm` — дві перевірки:

        ```sh
        pwd               # де я зараз
        ls package.json   # чи є тут package.json
        ```

        Якщо `ls` відповідає, що такого файла немає (`No such file or directory`), ти не в корені проєкту, і `npm` або не знайде його, або знайде **чужий**.

        У VS Code працюватимеш у [[integrated-terminal|вбудованому терміналі]] (Terminal → New Terminal): він відкривається в теці, яку відкрито у VS Code. Відкрив теку проєкту — і термінал уже в її корені.
      en: |
        Every terminal command acts in the **current folder**. For `npm` this matters a lot: `npm start` looks for `package.json` in the current folder, and if it is not there — in the parent folder, then higher, up to the root of the disk.

        So before any `npm` command, two checks:

        ```sh
        pwd               # where am I now
        ls package.json   # is there a package.json here
        ```

        If `ls` answers that there is no such file (`No such file or directory`), you are not at the project root, and `npm` either finds no project or finds **someone else's**.

        In VS Code you will work in the [[integrated-terminal|integrated terminal]] (Terminal → New Terminal): it opens in the folder that is open in VS Code. Open the project folder, and the terminal is already at its root.

  - id: predict-too-high
    kind: prediction
    prompt:
      uk: "Тека `jsll` містить лише теку проєкту `wishlist/` із `package.json` усередині. Ні в `jsll`, ні в жодній теці над нею немає `package.json`. Ти стоїш у `jsll` і вводиш `npm start`. Що станеться?"
      en: "The folder `jsll` holds only the project folder `wishlist/` with a `package.json` inside. Neither `jsll` nor any folder above it has a `package.json`. You stand in `jsll` and type `npm start`. What happens?"
    answer:
      type: choice
      options:
        - id: enoent
          text:
            uk: "Помилка `npm error code ENOENT` … `Could not read package.json`, і нічого не запускається"
            en: "An error `npm error code ENOENT` … `Could not read package.json`, and nothing starts"
        - id: finds-below
          text:
            uk: "npm знайде `wishlist/package.json` у вкладеній теці й запустить проєкт"
            en: "npm finds `wishlist/package.json` in the nested folder and starts the project"
          why:
            uk: "npm шукає `package.json` лише в поточній теці та **вище** неї, а не у вкладених теках."
            en: "npm looks for `package.json` only in the current folder and **above** it, never in nested folders."
        - id: asks
          text:
            uk: "npm запитає, який із проєктів запустити"
            en: "npm asks which of the projects to start"
          why:
            uk: "npm нічого не питає: він або знаходить один `package.json` у поточній теці чи вище, або повідомляє про помилку."
            en: "npm asks nothing: it either finds one `package.json` in the current folder or above, or reports an error."
      correct: [enoent]
    explanation:
      uk: "У такій ситуації npm пише `npm error code ENOENT` і `Could not read package.json: Error: ENOENT: no such file or directory` із повним шляхом, де він шукав. ENOENT означає «немає такого файла». Рішення — перейти в теку проєкту: `cd wishlist`."
      en: "In this situation npm prints `npm error code ENOENT` and `Could not read package.json: Error: ENOENT: no such file or directory` with the full path where it looked. ENOENT means “no such file”. The fix is to go into the project folder: `cd wishlist`."

  - id: predict-inside-other
    kind: prediction
    prompt:
      uk: "Ти розпакував експорт у теку, що лежить **усередині іншого npm-проєкту**: у теці того проєкту є власний `package.json` зі скриптом `start`. Ти стоїш над текою свого проєкту (у поточній теці `package.json` немає) і вводиш `npm start`. Що станеться?"
      en: "You unpacked the export into a folder that lies **inside another npm project**: that project's folder has its own `package.json` with a `start` script. You stand above your project folder (the current folder has no `package.json`) and type `npm start`. What happens?"
    answer:
      type: choice
      options:
        - id: runs-other
          text:
            uk: "npm піде вгору, знайде `package.json` іншого проєкту й запустить **його** `start`"
            en: "npm goes up, finds the other project's `package.json` and runs **its** `start`"
        - id: enoent-again
          text:
            uk: "Помилка `npm error code ENOENT`: у поточній теці немає `package.json`"
            en: "An error `npm error code ENOENT`: the current folder has no `package.json`"
          why:
            uk: "Вище поточної теки є `package.json` — чужий. npm не знає, що він «не той», і бере перший, який знайде, шукаючи вгору."
            en: "There is a `package.json` above the current folder — someone else's. npm does not know it is “the wrong one” and takes the first it finds on the way up."
        - id: mine
          text:
            uk: "Запуститься мій проєкт, бо це я його експортував"
            en: "My project starts, because I exported it"
          why:
            uk: "npm не знає, що ти експортував. Він знає лише поточну теку й теки над нею."
            en: "npm knows nothing about your export. It knows only the current folder and the folders above it."
      correct: [runs-other]
    explanation:
      uk: "Це найпідступніший випадок: помилки немає, щось запускається, але не те. Під час перевірки цього уроку експорт розпакували всередині теки самої платформи й запустили `npm start` рівнем вище — і стартувала платформа на порту 7300, а не проєкт. Тому спершу `pwd` і `ls package.json`, а вже потім `npm`."
      en: "This is the trickiest case: no error, something starts, but not the right thing. When this lesson was checked, the export was unpacked inside the platform's own folder and `npm start` was run one level too high: the platform started on port 7300 instead of the project. So first `pwd` and `ls package.json`, and only then `npm`."

  - id: recall-paths
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: relative-up
        from: js-15-01-terminal-files-paths
        prompt:
          uk: "Поточна тека терміналу — `/Users/learner/jsll/wishlist`. Яку теку означає відносний шлях `../jsll-export`?"
          en: "The terminal's current folder is `/Users/learner/jsll/wishlist`. Which folder does the relative path `../jsll-export` mean?"
        answer:
          type: choice
          options:
            - { id: sibling, code: "/Users/learner/jsll/jsll-export" }
            - id: inside
              code: "/Users/learner/jsll/wishlist/jsll-export"
              why:
                uk: "`..` — це батьківська тека, тобто крок **вгору** з `wishlist`, а не вглиб неї."
                en: "`..` is the parent folder, a step **up** from `wishlist`, not into it."
            - id: root
              code: "/jsll-export"
              why:
                uk: "Від кореня диска рахується лише абсолютний шлях, що починається з `/`. Відносний шлях рахується від поточної теки."
                en: "Only an absolute path, one that starts with `/`, counts from the root of the disk. A relative path counts from the current folder."
          correct: [sibling]
        explanation:
          uk: "`..` піднімає з `wishlist` до `jsll`, а далі йде `jsll-export`. Тому `../jsll-export` — тека **поруч** із проєктом. Саме туди ти розпакуєш архів, щоб він не змішався з твоїми файлами."
          en: "`..` goes up from `wishlist` to `jsll`, and then comes `jsll-export`. So `../jsll-export` is the folder **next to** the project. That is where you will unpack the archive, so it does not mix with your files."

  - id: the-plan
    kind: explanation
    title:
      uk: "План: розпакувати поруч, перенести обережно"
      en: "The plan: unpack next to it, move carefully"
    body:
      uk: |
        У теці проєкту вже є закомічений `README.md` з розділу про термінал, а в архіві теж є `README.md`. Розпакуєш архів прямо в теку — і твій README буде перезаписано. Тому:

        - архів розпаковуємо в **окрему** теку поруч (`../jsll-export`);
        - README з експорту переносимо під новою назвою `EXPORT-README.md`;
        - решту переносимо через `mv -n`: `-n` означає «не перезаписувати наявні файли». Якщо щось із такою назвою вже є, файл лишиться в `jsll-export`, і ти це побачиш.

        Далі `npm install`. Залежностей у проєкті немає, тож він нічого не встановить, але створить `package-lock.json` — lockfile, який фіксує, що проєкт залежить від нуля пакетів. Закомічений lockfile дає змогу будь-де відтворити точно те саме через `npm ci`.

        Ніде в цьому уроці не потрібен `sudo`. Якщо якась команда просить пароль адміністратора — зупинись і перечитай крок.
      en: |
        The project folder already has a committed `README.md` from the terminal unit, and the archive has a `README.md` too. Unpack the archive straight into the folder and your README gets overwritten. So:

        - the archive is unpacked into a **separate** folder next to it (`../jsll-export`);
        - the export's README is moved under a new name, `EXPORT-README.md`;
        - the rest is moved with `mv -n`: `-n` means “do not overwrite existing files”. If something of that name already exists, the file stays in `jsll-export`, and you will see it.

        Then `npm install`. The project has no dependencies, so it installs nothing, but it creates `package-lock.json` — a lockfile recording that the project depends on zero packages. A committed lockfile lets anyone reproduce exactly the same thing with `npm ci`.

        Nothing in this lesson needs `sudo`. If a command asks for an administrator password, stop and reread the step.

  - id: export-and-run
    kind: local-task
    runtime: local-web
    title:
      uk: "Експортуй, перенеси, встанови, запусти"
      en: "Export, move, install, run"
    intro:
      uk: "Приклади команд написано для «Списку бажань» у теці `~/jsll/wishlist` і для архіву від 2 жовтня 2026 року. Підстав свою назву проєкту (`planner`, `habits` чи `expenses`), свій шлях і дату з назви свого архіву: клавіша Tab у терміналі доповнює назви файлів. Кількість і список файлів нижче — для проєкту на кроці JS-07, останньому кроці, що існував, коли урок перевіряли; наступні кроки додають файли, тож у тебе їх може бути більше. Команди перевірено в macOS із Node.js v25.2.1, npm 11.6.2 і Git 2.51.0. У Windows виконуй їх у Git Bash, а якщо там немає `unzip`, розпакуй архів провідником («Видобути все») у теку `jsll-export` поруч із проєктом."
      en: "The example commands are written for a wishlist in the folder `~/jsll/wishlist` and an archive from 2 October 2026. Use your project's name (`planner`, `habits` or `expenses`), your path and the date from your archive's name: the Tab key in the terminal completes file names. The file count and file list below are for a project at step JS-07, the last step that existed when this lesson was checked; later steps add files, so you may have more. The commands were checked on macOS with Node.js v25.2.1, npm 11.6.2 and Git 2.51.0. On Windows run them in Git Bash, and if it has no `unzip`, unpack the archive with File Explorer (“Extract All”) into a folder `jsll-export` next to the project."
    tools:
      - { name: "Node.js", version: "22.13+", note: { uk: "той самий, з яким працює платформа", en: "the same one the platform runs on" } }
      - { name: "npm", version: "10+", note: { uk: "встановлюється разом із Node.js", en: "comes with Node.js" } }
      - { name: "Git", version: "2.x", note: { uk: "репозиторій проєкту з розділу про термінал", en: "the project repository from the terminal unit" } }
      - { name: "VS Code", note: { uk: "будь-яка свіжа версія; її меню описано, але автоматично в цьому уроці не перевірено", en: "any recent version; its menus are described but were not checked automatically in this lesson" } }
    steps:
      - text:
          uk: "У платформі відкрий **Мій проєкт** → **Експортувати проєкт** → **Завантажити .zip**. Браузер збереже архів у теку завантажень."
          en: "In the platform open **My project** → **Export project** → **Download .zip**. The browser saves the archive into your downloads folder."
        expect:
          uk: "У вікні з’являється «Архів js-learning-lab-wishlist-2026-10-02.zip готовий: файлів 13. Розпакуй його й відкрий теку у VS Code.» (13 — на кроці JS-07, без власних файлів)."
          en: "The window shows “The archive js-learning-lab-wishlist-2026-10-02.zip is ready: 13 files. Unpack it and open the folder in VS Code.” (13 at step JS-07, without files of your own)."
      - text:
          uk: "У терміналі перейди в теку проєкту з розділу про термінал."
          en: "In a terminal go to the project folder from the terminal unit."
        command: "cd ~/jsll/wishlist"
      - text:
          uk: "Перевір, що робоча тека чиста: усе твоє вже в commit."
          en: "Check that the working tree is clean: everything of yours is already in a commit."
        command: "git status"
        expect:
          uk: "`nothing to commit, working tree clean`. Якщо є незакомічені зміни, спершу зроби commit."
          en: "`nothing to commit, working tree clean`. If there are uncommitted changes, commit them first."
      - text:
          uk: "Розпакуй архів у теку поруч із проєктом, не в сам проєкт."
          en: "Unpack the archive into a folder next to the project, not into the project itself."
        command: "unzip -q ~/Downloads/js-learning-lab-wishlist-2026-10-02.zip -d ../jsll-export"
        expect:
          uk: "Нічого не виводиться (`-q` — тихий режим)."
          en: "Nothing is printed (`-q` is quiet mode)."
      - text:
          uk: "Подивись, що розпакувалося."
          en: "Look at what was unpacked."
        command: "ls ../jsll-export/js-learning-lab-wishlist"
        expect:
          uk: "`README.md`, `app.js`, `data`, `domain`, `images`, `index.html`, `jsll-manifest.json`, `package.json`, `serve.mjs`, `storage`, `styles.css`, `tools`, `ui`."
          en: "`README.md`, `app.js`, `data`, `domain`, `images`, `index.html`, `jsll-manifest.json`, `package.json`, `serve.mjs`, `storage`, `styles.css`, `tools`, `ui`."
      - text:
          uk: "Перенеси README з експорту під іншою назвою, щоб він не зачепив твій."
          en: "Move the export's README under another name so it does not touch yours."
        command: "mv -n ../jsll-export/js-learning-lab-wishlist/README.md EXPORT-README.md"
      - text:
          uk: "Перенеси решту файлів і тек, не перезаписуючи наявних."
          en: "Move the remaining files and folders without overwriting existing ones."
        command: "mv -n ../jsll-export/js-learning-lab-wishlist/* ."
      - text:
          uk: "Перевір, що в `jsll-export` нічого не лишилося."
          en: "Check that nothing was left behind in `jsll-export`."
        command: "ls -A ../jsll-export/js-learning-lab-wishlist"
        expect:
          uk: "Порожній вивід. Якщо якийсь файл лишився, у проєкті вже був файл із такою назвою: порівняй їх (`diff`) і вирішуй вручну."
          en: "Empty output. If a file stayed, the project already had a file of that name: compare them (`diff`) and decide by hand."
      - text:
          uk: "Відкрий теку `wishlist` у VS Code (File → Open Folder…), а тоді вбудований термінал (Terminal → New Terminal). Наступні команди — у ньому."
          en: "Open the `wishlist` folder in VS Code (File → Open Folder…), then the integrated terminal (Terminal → New Terminal). The next commands go there."
      - text:
          uk: "Переконайся, що термінал стоїть у корені проєкту."
          en: "Make sure the terminal is at the project root."
        command: "ls package.json"
        expect:
          uk: "`package.json`. Якщо `No such file or directory` — ти не в тій теці."
          en: "`package.json`. If `No such file or directory`, you are in the wrong folder."
      - text:
          uk: "Запусти встановлення залежностей."
          en: "Run the dependency install."
        command: "npm install"
        expect:
          uk: "`up to date, audited 1 package in …ms` і `found 0 vulnerabilities`. Поруч із `package.json` з’явився `package-lock.json`."
          en: "`up to date, audited 1 package in …ms` and `found 0 vulnerabilities`. A `package-lock.json` appeared next to `package.json`."
      - text:
          uk: "Додай до індексу все, що прийшло з експорту, разом із lockfile. Перш ніж виконати, переконайся командою `git status`, що в списку лише файли проєкту."
          en: "Stage everything that came with the export, the lockfile included. Before you run it, make sure with `git status` that the list holds only project files."
        command: "git add -A"
      - text:
          uk: "Зафіксуй проєкт таким, яким він прийшов із платформи. Цей commit — точка, до якої завжди можна повернутися, і основа, від якої `git diff` покаже твої локальні зміни."
          en: "Record the project exactly as it came from the platform. This commit is a point you can always return to, and the base from which `git diff` shows your local changes."
        command: "git commit -m \"Import the project exported from the platform\""
        expect:
          uk: "Рядок на кшталт `[main 1a2b3c4] Import the project exported from the platform` і кількість змінених файлів. Після нього `git status` знову показує `working tree clean`."
          en: "A line like `[main 1a2b3c4] Import the project exported from the platform` and the number of files changed. After it `git status` shows `working tree clean` again."
      - text:
          uk: "Запусти проєкт."
          en: "Start the project."
        command: "npm start"
        expect:
          uk: "Для українського проєкту: `Проєкт працює: http://127.0.0.1:4300/`, `Відновити збережені дані: http://127.0.0.1:4300/tools/restore-data.html`, `Зупинити: Ctrl+C`. Для англійського — ті самі рядки англійською. Сервер працює, доки ти його не зупиниш."
          en: "For an English project: `The project is running: http://127.0.0.1:4300/`, `Restore saved data: http://127.0.0.1:4300/tools/restore-data.html`, `Stop with Ctrl+C`. For a Ukrainian one, the same lines in Ukrainian. The server runs until you stop it."
      - text:
          uk: "Відкрий у браузері адресу з першого рядка. Термінал не закривай."
          en: "Open the address from the first line in a browser. Keep the terminal open."
        expect:
          uk: "Та сама сторінка, що й у платформі, з початковими записами (свої записи ти перенесеш у наступному уроці)."
          en: "The same page as in the platform, with the starting records (you move your own records in the next lesson)."
    verify:
      - id: files-in-place
        text:
          uk: "У теці проєкту є `index.html`, `package.json`, `serve.mjs` і `jsll-manifest.json`, а мій `README.md` — той самий, що й до експорту."
          en: "The project folder has `index.html`, `package.json`, `serve.mjs` and `jsll-manifest.json`, and my `README.md` is the same as before the export."
      - id: lockfile
        text:
          uk: "`npm install` написав `up to date`, і з’явився `package-lock.json`."
          en: "`npm install` printed `up to date`, and a `package-lock.json` appeared."
      - id: imported-commit
        text:
          uk: "`git log --oneline` показує commit «Import the project exported from the platform» над commit з README."
          en: "`git log --oneline` shows the commit “Import the project exported from the platform” above the README commit."
      - id: running
        text:
          uk: "`npm start` показав адресу, і сторінка проєкту відкрилася в браузері."
          en: "`npm start` printed an address, and the project page opened in the browser."
    troubleshooting:
      - problem:
          uk: "`npm error code ENOENT` … `Could not read package.json`"
          en: "`npm error code ENOENT` … `Could not read package.json`"
        fix:
          uk: "Ти не в корені проєкту. `pwd` покаже, де ти; перейди в теку, де `ls package.json` знаходить файл."
          en: "You are not at the project root. `pwd` shows where you are; go to the folder where `ls package.json` finds the file."
      - problem:
          uk: "Після `npm start` запустилося щось інше (інша назва в рядку `> … start`, інший порт)"
          en: "After `npm start` something else started (another name in the `> … start` line, another port)"
        fix:
          uk: "npm знайшов чужий `package.json` вище. Зупини його (Ctrl+C), перейди в корінь свого проєкту й запусти знову."
          en: "npm found someone else's `package.json` higher up. Stop it (Ctrl+C), go to your project root and start again."
      - problem:
          uk: "`Порт 4300 уже зайнятий…` / `Port 4300 is already in use…`"
          en: "`Port 4300 is already in use…` (or the same in Ukrainian)"
        fix:
          uk: "Інша програма вже слухає цей порт — часто це ти сам в іншому терміналі. Зупини її або запусти на іншому порту: `npm start -- --port 4301`."
          en: "Another program already listens on that port — often yourself in another terminal. Stop it or start on another port: `npm start -- --port 4301`."
      - problem:
          uk: "Сторінка порожня, коли відкриваєш `index.html` подвійним кліком"
          en: "The page is empty when you open `index.html` with a double click"
        fix:
          uk: "Адреса `file://` не підходить: модулі JavaScript працюють лише через сервер. Відкрий адресу, яку надрукував `npm start`."
          en: "A `file://` address does not work: JavaScript modules run only through a server. Open the address `npm start` printed."
      - problem:
          uk: "`command not found: node` або `npm`"
          en: "`command not found: node` or `npm`"
        fix:
          uk: "Node.js не встановлено або термінал відкрито до встановлення. Відкрий новий термінал; якщо не допомогло — встанови Node.js з nodejs.org. Ніколи не додавай `sudo` до `npm`."
          en: "Node.js is not installed, or the terminal was opened before the install. Open a new terminal; if that does not help, install Node.js from nodejs.org. Never add `sudo` to `npm`."
      - problem:
          uk: "Мій `README.md` змінився"
          en: "My `README.md` changed"
        fix:
          uk: "Ти розпакував або переніс README з експорту без нової назви. Він у commit: `git restore README.md` поверне закомічену версію."
          en: "The export's README was unpacked or moved without a new name. Yours is in a commit: `git restore README.md` brings the committed version back."
    recovery:
      uk: "Перед перенесенням усе твоє було в commit, а архів лежить у теці завантажень. `git status` показує нові файли як невідстежувані (`??`) — твоїх закомічених файлів перенесення не змінює. Якщо заплутався, закомічені файли повертає `git restore <файл>`, а файли експорту можна знову розпакувати з того самого архіву."
      en: "Before the move everything of yours was in a commit, and the archive is still in your downloads folder. `git status` lists the new files as untracked (`??`) — the move does not change your committed files. If you get lost, `git restore <file>` brings committed files back, and the export's files can be unpacked again from the same archive."

  - id: second-copy
    kind: local-task
    runtime: local-web
    title:
      uk: "Самостійно: друга чиста копія лише за README"
      en: "On your own: a second clean copy from the README alone"
    intro:
      uk: "Перевір, чи README з експорту справді достатньо, щоб запустити проєкт з нуля. Поки перша копія працює, розгорни другу в окремій теці, тримаючись **лише** README з цього архіву. Перш ніж виконати кожну команду, скажи собі, в якій теці вона діятиме і що змінить. Не виконуй нічого, що просить `sudo` або виводить пароль чи ключ — запиши, чому відмовився."
      en: "Check whether the export's README really is enough to start the project from scratch. While the first copy is running, set up a second one in a separate folder, using **only** the README from this archive. Before you run each command, tell yourself which folder it will act in and what it will change. Do not run anything that asks for `sudo` or prints a password or a key — write down why you refused."
    tools:
      - { name: "Node.js", version: "22.13+" }
      - { name: "unzip", note: { uk: "або провідник у Windows", en: "or File Explorer on Windows" } }
    steps:
      - text:
          uk: "Створи теку поза своїм проєктом і розпакуй туди той самий архів."
          en: "Create a folder outside your project and unpack the same archive there."
      - text:
          uk: "Відкрий у цій копії `README.md` і виконуй розділ «Як запустити» крок за кроком. Кожну команду та її результат записуй у файл нотаток поза проєктом."
          en: "Open the copy's `README.md` and follow its “How to run it” section step by step. Write every command and its result into a notes file outside the project."
      - text:
          uk: "Коли щось не спрацює, знайди відповідь у README (розділ «Якщо щось не так»), а не в цьому уроці."
          en: "When something does not work, find the answer in the README (the “If something goes wrong” section), not in this lesson."
    verify:
      - id: second-runs
        text:
          uk: "Друга копія працює одночасно з першою, на іншому порту, і я знайшов, як це зробити, у README."
          en: "The second copy runs at the same time as the first, on another port, and I found how in the README."
      - id: notes
        text:
          uk: "Я записав кожну команду з її результатом."
          en: "I wrote down every command with its result."
      - id: nothing-unsafe
        text:
          uk: "Я не виконав жодної команди з `sudo` і жодної, якої немає в README."
          en: "I ran no command with `sudo` and none that is not in the README."
    troubleshooting:
      - problem:
          uk: "Друга копія не стартує й пише про зайнятий порт"
          en: "The second copy does not start and reports a busy port"
        fix:
          uk: "Так і має бути, поки перша працює. Відповідь — у README: розділ про інший порт."
          en: "That is expected while the first one runs. The answer is in the README: the part about another port."
      - problem:
          uk: "На новій адресі немає моїх записів"
          en: "My records are missing at the new address"
        fix:
          uk: "Інший порт — інша адреса, а отже інше сховище браузера. Як перенести записи, README пояснює в розділі про збережені дані; детально — у наступному уроці."
          en: "Another port is another address, and so another browser storage. The README explains how to move the records in its saved-data section; the next lesson covers it in detail."
    recovery:
      uk: "Друга копія — окрема тека, твій проєкт вона не зачіпає. Зупини її сервер (Ctrl+C), і її можна просто лишити або прибрати вручну, коли переконаєшся, що це не твоя робоча тека."
      en: "The second copy is a separate folder and does not touch your project. Stop its server (Ctrl+C); you can leave the folder or remove it by hand once you are sure it is not your working folder."

  - id: to-project
    kind: transfer
    capstoneStep: JS-10
    body:
      uk: "Тепер твій проєкт живе в Git-репозиторії на твоєму комп’ютері й запускається через `npm start`. У контрольній точці CP-JS ти перевіриш його повністю й зафіксуєш commit."
      en: "Your project now lives in a Git repository on your computer and starts with `npm start`. In the CP-JS checkpoint you will verify it fully and record a commit."
