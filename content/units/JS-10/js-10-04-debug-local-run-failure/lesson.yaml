id: js-10-04-debug-local-run-failure
unit: JS-10
title:
  uk: "Налагодження: експортований проєкт не запускається"
  en: "Debug: the exported project does not start"
kind: local-task
minutes: 20
contentVersion: 1
purpose:
  uk: "Проєкт, що працює на твоєму комп’ютері, може не запуститися в іншої людини чи в чистій теці. Тут ти вчишся читати, *що саме* не знайдено, і лагодити це, не видаляючи lockfile і не перезаписуючи власних файлів."
  en: "A project that works on your computer may not start for someone else or in a clean folder. Here you learn to read *what exactly* was not found and to repair it without deleting the lockfile or overwriting your own files."
objectives:
  - uk: "Знайти, чому експортований проєкт не запускається: скрипт `start` називає файл, якого немає, а в імпорті бракує розширення `.js`; для кожної помилки назвати файл, на який вона вказує."
    en: "Find why an exported project does not start: the `start` script names a file that does not exist, and an import is missing its `.js` extension; for each error name the file it points to."
  - uk: "Винести порт в незакомічений `.env`, який читає `node --env-file`, відтворити проєкт зі свіжого клону, полагодити відсутні `.env` і `node_modules`, не видаляючи `package-lock.json`, і підтвердити роботу через `npm start` і `npm run lint`."
    en: "Move the port into an uncommitted `.env` read by `node --env-file`, reproduce the project from a fresh clone, repair the missing `.env` and `node_modules` without deleting `package-lock.json`, and confirm with `npm start` and `npm run lint`."
prerequisites: [js-10-03-compare-and-inspect, js-15-13-debug-broken-setup]
subskills:
  - { family: P-01, skill: "package scripts/manifest", depth: assess }
  - { family: P-01, skill: "build/env/config", depth: practice }
glossary: []
selfCheck: [broken-export]

blocks:
  - id: two-programs
    kind: explanation
    title:
      uk: "Дві програми — дві різні помилки"
      en: "Two programs, two different errors"
    body:
      uk: |
        Локальний запуск — це дві окремі програми, і кожна падає по-своєму.

        **Node.js запускає сервер.** `npm start` читає `scripts.start` з `package.json` і виконує його в оболонці. Якщо там `node src/serve.mjs`, а файл лежить у корені проєкту як `serve.mjs`, до твого коду справа не дійде:

        ```text
        Error: Cannot find module '/Users/learner/jsll/planner/src/serve.mjs'
          code: 'MODULE_NOT_FOUND'
        ```

        Шлях у повідомленні — те, що Node.js **шукав**. Порівняй його зі списком файлів (`ls`).

        **Браузер завантажує модулі сторінки.** Він бере шлях з `import` буквально й не дописує `.js`. Для `"../storage/tasks"` він попросить файл `/storage/tasks` і отримає 404. Тоді не виконується **жоден** модуль: сторінка порожня, а консоль DevTools показує `Failed to load resource: the server responded with a status of 404 (Not Found)` з адресою, якої не знайдено.

        В обох випадках дія однакова: прочитай, *що* шукали, і знайди, *хто* це назвав.
      en: |
        A local run is two separate programs, and each fails in its own way.

        **Node.js runs the server.** `npm start` reads `scripts.start` from `package.json` and runs it in the shell. If it says `node src/serve.mjs` while the file lies at the project root as `serve.mjs`, your code is never reached:

        ```text
        Error: Cannot find module '/Users/learner/jsll/planner/src/serve.mjs'
          code: 'MODULE_NOT_FOUND'
        ```

        The path in the message is what Node.js **looked for**. Compare it with the list of files (`ls`).

        **The browser loads the page's modules.** It takes the path from `import` literally and does not add `.js`. For `"../storage/tasks"` it requests the file `/storage/tasks` and gets a 404. Then **no** module runs: the page is empty, and the DevTools console shows `Failed to load resource: the server responded with a status of 404 (Not Found)` with the address that was not found.

        In both cases you do the same thing: read *what* was looked for, and find *who* named it.

  - id: broken-export
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: broken-export
    entry: index.html
    editable: [package.json, ui/page.js, app.js, domain/expenses.js, index.html]
    strings:
      lang: { uk: "uk", en: "en" }
      projectTitle: { uk: "Трекер витрат", en: "Expense tracker" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transitPass: { uk: "Проїзний", en: "Transit pass" }
      lunch: { uk: "Обід", en: "Lunch" }
      total: { uk: "Разом:", en: "Total:" }
    title:
      uk: "Експорт, який не запускається"
      en: "An export that does not start"
    instructions:
      uk: |
        Хтось відредагував експортований «Трекер витрат» у своєму редакторі, і тепер проєкт не стартує. Дефектів два: один заважає сторінці, другий — команді `npm start`.

        Натисни **Запустити** і прочитай картку «Код не вдалося запустити»: який файл не знайдено і з якого файла його імпортують. Коли сторінка покаже список і підсумок, натисни **Перевірити** — одна з перевірок читає `package.json` так, як npm.

        Дані й функції домену правильні. Нічого не видаляй: виправ те, що зламалося.
      en: |
        Someone edited an exported expense tracker in their editor, and now the project does not start. There are two defects: one stops the page, the other stops the `npm start` command.

        Press **Run** and read the card “The code could not start”: which file was not found and which file imports it. Once the page shows the list and the total, press **Check** — one of the checks reads `package.json` the way npm does.

        The data and the domain functions are correct. Delete nothing: repair what broke.
    testTitles:
      "the page loads without a module error":
        uk: "Модулі сторінки завантажуються без помилки"
        en: "The page's modules load without an error"
      "the page lists all three expenses":
        uk: "Сторінка показує всі три витрати із сумами"
        en: "The page lists all three expenses with their amounts"
      "the page shows the total":
        uk: "Сторінка показує загальний підсумок"
        en: "The page shows the total"
      "npm start runs a file that exists":
        uk: "`npm start` запускає файл, який є в проєкті"
        en: "`npm start` runs a file that exists in the project"
    hints:
      nudge:
        uk: "Почни з картки помилки після «Запустити»: у ній два файли — той, якого не знайдено, і той, що його імпортує."
        en: "Start with the error card after “Run”: it names two files — the one that was not found and the one that imports it."
      explanation:
        uk: "Браузер не дописує розширень: шлях в `import` має збігатися з назвою файла повністю, як-от `\"./format.js\"`, а не `\"./format\"`. А `package.json` сторінка не читає взагалі: його читає npm і передає Node.js назву файла зі `scripts.start`. Порівняй цю назву зі списком файлів проєкту ліворуч."
        en: "The browser adds no extensions: the path in `import` must match the file's name fully, like `\"./format.js\"`, not `\"./format\"`. And the page never reads `package.json` at all: npm reads it and hands Node.js the file name from `scripts.start`. Compare that name with the list of project files on the left."
    solutionNote:
      uk: "У `ui/page.js` імпорт тепер закінчується на `.js` — браузер просить саме той файл, що існує, і весь граф модулів виконується. У `package.json` скрипт `start` називає `serve.mjs`, тож Node.js знайде файл. Обидві помилки знайшлися за назвами файлів у повідомленнях."
      en: "In `ui/page.js` the import now ends in `.js` — the browser requests exactly the file that exists, and the whole module graph runs. In `package.json` the `start` script names `serve.mjs`, so Node.js will find the file. Both errors were found by the file names in the messages."
    feedback:
      - when: { test: "the page lists all three expenses" }
        message:
          uk: "Ця перевірка чекає три пункти списку `#items` у форматі «назва — сума», наприклад «Обід — 210.50». Якщо список порожній, модулі сторінки не виконалися: спершу виправ помилку завантаження з картки."
          en: "This check expects three items in the `#items` list in the form “name — amount”, for example “Lunch — 210.50”. If the list is empty, the page's modules did not run: fix the loading error from the card first."
      - when: { test: "the page shows the total" }
        message:
          uk: "Ця перевірка чекає в `#summary` текст «Разом: 1576.00». Він з’являється лише тоді, коли модулі сторінки виконалися."
          en: "This check expects the text “Total: 1576.00” in `#summary`. It appears only when the page's modules ran."
      - when: { test: "npm start runs a file that exists" }
        message:
          uk: "Ця перевірка читає `scripts.start` з `package.json` і чекає `node <файл>`, де такий файл є серед файлів проєкту. Якщо `npm start` називає файл, якого немає, Node.js відповідає `Error: Cannot find module '…'` з кодом `MODULE_NOT_FOUND`."
          en: "This check reads `scripts.start` from `package.json` and expects `node <file>` where that file is among the project's files. If `npm start` names a file that does not exist, Node.js answers `Error: Cannot find module '…'` with the code `MODULE_NOT_FOUND`."

  - id: recall-graph
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: missing-name
        from: js-07-08-cjs-and-load-failures
        prompt:
          uk: "Модуль `ui/page.js` імпортує `{ total }` з `../domain/expenses.js`, а цей файл експортує лише `totalOf` і `formatAmount`. `app.js` імпортує `ui/page.js`. Що станеться під час завантаження сторінки?"
          en: "The module `ui/page.js` imports `{ total }` from `../domain/expenses.js`, but that file exports only `totalOf` and `formatAmount`. `app.js` imports `ui/page.js`. What happens when the page loads?"
        answer:
          type: choice
          options:
            - id: nothing-runs
              text:
                uk: "Не виконується жоден модуль, навіть перший рядок `app.js`: імпорти перевіряються до запуску коду"
                en: "No module runs, not even the first line of `app.js`: imports are checked before any code runs"
            - id: until-call
              text:
                uk: "Код виконується, доки не дійде до виклику `total`, і тоді падає з `ReferenceError`"
                en: "The code runs until it reaches a call to `total`, and then fails with a `ReferenceError`"
              why:
                uk: "Так поводився б звичайний виклик невідомої назви. Але назви з `import` браузер звіряє з експортами ще до першого рядка коду."
                en: "That is how a call to an unknown name would behave. But the browser matches the names in `import` against the exports before the first line of code."
            - id: undefined-total
              text:
                uk: "`total` стане `undefined`, і все впаде лише на виклику з `TypeError`"
                en: "`total` becomes `undefined`, and everything fails only at the call, with a `TypeError`"
              why:
                uk: "Неіснуючий іменований експорт не перетворюється на `undefined` — модуль просто не завантажується."
                en: "A named export that does not exist does not turn into `undefined` — the module simply does not load."
          correct: [nothing-runs]
        explanation:
          uk: "Помилка в графі модулів — хибний шлях, бракує розширення чи немає такої назви серед експортів — зупиняє **весь** граф, доки не виконався жоден рядок. Тому сторінка з такою помилкою порожня, а помилку треба шукати в повідомленні, а не в коді, що «не спрацював»."
          en: "A mistake in the module graph — a wrong path, a missing extension or a name missing from the exports — stops the **whole** graph before a single line runs. That is why a page with such a mistake is empty, and the error must be read in the message, not in code that “did not work”."

  - id: env-and-clone
    kind: explanation
    title:
      uk: "Налаштування поза Git і чистий клон"
      en: "Settings outside Git and a clean clone"
    body:
      uk: |
        Порт, адреса сервера, ключ сервісу — це **налаштування**, вони відрізняються від комп’ютера до комп’ютера. Їх не вписують у код, а тримають у файлі `.env`, який **не** потрапляє в Git. У Git іде `.env.example` — зразок без секретів, щоб інші знали, які змінні потрібні.

        Node.js читає такий файл сам: `node --env-file=.env serve.mjs` кладе `PORT=4310` у `process.env.PORT`, а `serve.mjs` уже вміє брати порт звідти.

        Чого немає в Git, того немає й у свіжому клоні: ні `.env`, ні `node_modules/`. Тому чесна перевірка проєкту — клонувати його в чисту теку й запустити там. Лагодимо правильно:

        - `.env` створюємо зі зразка: `cp .env.example .env`;
        - залежності ставимо точно з lockfile: `npm ci`. `package-lock.json` не видаляємо — саме він гарантує ті самі версії.
      en: |
        A port, a server address, a service key are **settings**: they differ from one computer to another. They are not written into the code but kept in a `.env` file that does **not** go into Git. Git gets `.env.example` — a sample without secrets, so others know which variables are needed.

        Node.js reads such a file itself: `node --env-file=.env serve.mjs` puts `PORT=4310` into `process.env.PORT`, and `serve.mjs` already knows how to take the port from there.

        What is not in Git is not in a fresh clone either: neither `.env` nor `node_modules/`. So an honest check of a project is to clone it into a clean folder and start it there. The right repairs:

        - `.env` is created from the sample: `cp .env.example .env`;
        - dependencies are installed exactly from the lockfile: `npm ci`. `package-lock.json` is never deleted — it is what guarantees the same versions.

  - id: env-clone-task
    kind: local-task
    runtime: local-web
    title:
      uk: "Винеси порт у `.env` і запусти чистий клон"
      en: "Move the port into `.env` and start a clean clone"
    intro:
      uk: "Продовжуємо в теці проєкту `~/jsll/wishlist` у вбудованому терміналі VS Code. Зупини запущений `npm start` (Ctrl+C). Перш ніж змінювати щось у клоні, **запиши** кожне повідомлення про помилку з назвою файла чи команди, яку воно називає. Перевірено з Node.js v25.2.1 і Git 2.51.0; `--env-file` є в Node.js від версії 20.6."
      en: "We continue in the project folder `~/jsll/wishlist` in the VS Code integrated terminal. Stop the running `npm start` (Ctrl+C). Before you change anything in the clone, **write down** every error message together with the file or command it names. Checked with Node.js v25.2.1 and Git 2.51.0; `--env-file` exists in Node.js since version 20.6."
    tools:
      - { name: "Node.js", version: "22.13+" }
      - { name: "Git", version: "2.x" }
    steps:
      - text:
          uk: "Створи зразок налаштувань. `>` створює файл (і перезаписав би наявний — тому спершу переконайся через `ls -a`, що `.env.example` ще немає)."
          en: "Create the settings sample. `>` creates the file (and would overwrite an existing one — so first make sure with `ls -a` that there is no `.env.example` yet)."
        command: "printf 'PORT=4310\\n' > .env.example"
      - text:
          uk: "Зроби з нього власний `.env`."
          en: "Make your own `.env` from it."
        command: "cp .env.example .env"
      - text:
          uk: "Скажи Git ігнорувати `.env`."
          en: "Tell Git to ignore `.env`."
        command: "printf '.env\\n' >> .gitignore"
      - text:
          uk: "Зміни скрипт `start`, щоб Node.js читав `.env`."
          en: "Change the `start` script so that Node.js reads `.env`."
        command: "npm pkg set scripts.start=\"node --env-file=.env serve.mjs\""
      - text:
          uk: "Запусти й перевір порт, потім зупини (Ctrl+C)."
          en: "Start it and check the port, then stop it (Ctrl+C)."
        command: "npm start"
        expect:
          uk: "`Проєкт працює: http://127.0.0.1:4310/` (або те саме англійською) — порт прийшов із `.env`."
          en: "`The project is running: http://127.0.0.1:4310/` (or the same in Ukrainian) — the port came from `.env`."
      - text:
          uk: "Подивись, що піде в commit."
          en: "Look at what will go into the commit."
        command: "git status"
        expect:
          uk: "Змінено `.gitignore` і `package.json`, новий `.env.example`. Файла `.env` у списку немає — його ігнорують."
          en: "`.gitignore` and `package.json` modified, `.env.example` new. `.env` is not in the list — it is ignored."
      - text:
          uk: "Додай зміни до індексу."
          en: "Stage the changes."
        command: "git add -A"
      - text:
          uk: "Зафіксуй."
          en: "Commit."
        command: "git commit -m \"Read the port from an uncommitted .env file\""
      - text:
          uk: "Вийди на рівень вище й клонуй свій репозиторій у чисту теку поруч."
          en: "Go one level up and clone your repository into a clean folder next to it."
        command: "cd .. && git clone wishlist wishlist-clean"
        expect:
          uk: "`Cloning into 'wishlist-clean'...` і `done.`"
          en: "`Cloning into 'wishlist-clean'...` and `done.`"
      - text:
          uk: "Перейди в клон і подивись, що в ньому є."
          en: "Go into the clone and look at what it has."
        command: "cd wishlist-clean && ls -A"
        expect:
          uk: "Є `.env.example`, `.gitignore`, `package-lock.json` і всі файли проєкту, але немає ні `.env`, ні `node_modules`."
          en: "There are `.env.example`, `.gitignore`, `package-lock.json` and all the project files, but neither `.env` nor `node_modules`."
      - text:
          uk: "Спробуй запустити й запиши повідомлення."
          en: "Try to start it and write down the message."
        command: "npm start"
        expect:
          uk: "Після рядків `> … start` і `> node --env-file=.env serve.mjs` — `node: .env: not found`. Сервер не запустився."
          en: "After the lines `> … start` and `> node --env-file=.env serve.mjs` comes `node: .env: not found`. The server did not start."
      - text:
          uk: "Спробуй lint і запиши повідомлення."
          en: "Try lint and write down the message."
        command: "npm run lint"
        expect:
          uk: "`sh: eslint: command not found`: команди `eslint` немає, бо немає `node_modules`."
          en: "`sh: eslint: command not found`: there is no `eslint` command, because there is no `node_modules`."
    verify:
      - id: env-ignored
        text:
          uk: "`npm start` у проєкті взяв порт 4310 із `.env`, а `git status` не показав `.env`."
          en: "`npm start` in the project took port 4310 from `.env`, and `git status` did not list `.env`."
      - id: clone-errors
        text:
          uk: "У клоні я записав обидва повідомлення: `node: .env: not found` і `sh: eslint: command not found`."
          en: "In the clone I wrote down both messages: `node: .env: not found` and `sh: eslint: command not found`."
    troubleshooting:
      - problem:
          uk: "`git status` показує `.env`"
          en: "`git status` lists `.env`"
        fix:
          uk: "У `.gitignore` немає рядка `.env`, або він злипся з попереднім рядком. Відкрий `.gitignore` і перевір, що `.env` стоїть окремим рядком. Не роби commit, доки `.env` видно в списку."
          en: "`.gitignore` has no `.env` line, or it got glued to the previous line. Open `.gitignore` and make sure `.env` stands on its own line. Do not commit while `.env` is in the list."
      - problem:
          uk: "`node: bad option: --env-file=.env`"
          en: "`node: bad option: --env-file=.env`"
        fix:
          uk: "Node.js старіший за 20.6. Онови Node.js до версії, яку вимагає платформа (22.13 або новіша)."
          en: "Node.js is older than 20.6. Update Node.js to the version the platform requires (22.13 or newer)."
      - problem:
          uk: "`fatal: destination path 'wishlist-clean' already exists and is not an empty directory.`"
          en: "`fatal: destination path 'wishlist-clean' already exists and is not an empty directory.`"
        fix:
          uk: "Така тека вже є — Git її не перезаписує. Клонуй під іншою назвою, наприклад `wishlist-clean-2`."
          en: "Such a folder already exists — Git does not overwrite it. Clone under another name, for example `wishlist-clean-2`."
    recovery:
      uk: "Усі зміни цього завдання — у commit, а клон — окрема тека, яка не впливає на твій проєкт. Якщо commit вийшов не таким, `git log --oneline` покаже його, а `git revert <id>` створить новий commit, що його скасовує, нічого не стираючи."
      en: "All changes of this task are in a commit, and the clone is a separate folder that does not affect your project. If the commit came out wrong, `git log --oneline` shows it, and `git revert <id>` creates a new commit that undoes it, erasing nothing."

  - id: repair-clone
    kind: local-task
    runtime: local-web
    title:
      uk: "Налагодження: полагодь клон, не чіпаючи файлів у Git"
      en: "Debug: repair the clone without touching files in Git"
    intro:
      uk: "Ти в теці `wishlist-clean` і маєш дві записані помилки. Полагодь клон так, щоб `npm start` і `npm run lint` працювали, а `git status` наприкінці показував, що жоден відстежуваний файл не змінився. Не видаляй `package-lock.json` і не редагуй `package.json`: проблема не в них."
      en: "You are in the folder `wishlist-clean` with two errors written down. Repair the clone so that `npm start` and `npm run lint` work, while `git status` at the end shows that no tracked file changed. Do not delete `package-lock.json` and do not edit `package.json`: the problem is not in them."
    tools:
      - { name: "Node.js", version: "22.13+" }
      - { name: "npm", version: "10+", note: { uk: "`npm ci` потребує інтернету, якщо пакетів ще немає в кеші npm", en: "`npm ci` needs the internet unless the packages are already in npm's cache" } }
    steps:
      - text:
          uk: "Для кожної записаної помилки скажи вголос: чого саме бракує і чому цього немає в клоні. Відповідь — у тому, що Git ігнорує."
          en: "For each error you wrote down, say out loud: what exactly is missing and why the clone does not have it. The answer is in what Git ignores."
      - text:
          uk: "Полагодь налаштування. Перша копія проєкту може працювати на порту 4310, тож у клоні можна взяти інший порт — це зміна лише в `.env`, якого немає в Git."
          en: "Repair the settings. The first copy of the project may be running on port 4310, so the clone may take another port — a change only in `.env`, which is not in Git."
      - text:
          uk: "Полагодь залежності командою, що ставить **точно** ті версії, які записано в lockfile."
          en: "Repair the dependencies with the command that installs **exactly** the versions recorded in the lockfile."
      - text:
          uk: "Перевір першу команду, яка падала, а тоді зупини сервер (Ctrl+C)."
          en: "Check the first command that failed, then stop the server (Ctrl+C)."
        command: "npm start"
        expect:
          uk: "Рядок «Проєкт працює: …» з портом із `.env` клону (під час перевірки — 4311)."
          en: "The line “The project is running: …” with the port from the clone's `.env` (when checked: 4311)."
      - text:
          uk: "Перевір другу команду."
          en: "Check the second command."
        command: "npm run lint"
      - text:
          uk: "Переконайся, що жоден відстежуваний файл не змінився."
          en: "Make sure no tracked file changed."
        command: "git status"
        expect:
          uk: "`nothing to commit, working tree clean`: `.env` і `node_modules/` ігноруються, а відстежувані файли такі самі, як у commit."
          en: "`nothing to commit, working tree clean`: `.env` and `node_modules/` are ignored, and the tracked files are the same as in the commit."
    verify:
      - id: clone-starts
        text:
          uk: "У клоні `npm start` надрукував адресу, і сторінка відкрилася."
          en: "In the clone `npm start` printed an address, and the page opened."
      - id: clone-lints
        text:
          uk: "У клоні `npm run lint` завершився без зауважень."
          en: "In the clone `npm run lint` finished with no findings."
      - id: lock-kept
        text:
          uk: "Я не видаляв `package-lock.json`, не редагував `package.json`, і `git status` у клоні показав `working tree clean`."
          en: "I did not delete `package-lock.json`, did not edit `package.json`, and `git status` in the clone showed `working tree clean`."
    troubleshooting:
      - problem:
          uk: "`Порт 4310 уже зайнятий…` / `Port 4310 is already in use…`"
          en: "`Port 4310 is already in use…` (or the same in Ukrainian)"
        fix:
          uk: "Працює перша копія. Зупини її або зміни `PORT` у `.env` клону."
          en: "The first copy is running. Stop it or change `PORT` in the clone's `.env`."
      - problem:
          uk: "`npm ci` пише, що `package.json` і `package-lock.json` не збігаються"
          en: "`npm ci` says that `package.json` and `package-lock.json` are out of sync"
        fix:
          uk: "Хтось змінив залежності в `package.json` без `npm install`. У клоні нічого не міняй: повернися в робочу теку, виконай там `npm install`, закоміть оновлений lockfile і клонуй знову."
          en: "Someone changed the dependencies in `package.json` without `npm install`. Change nothing in the clone: go back to the working folder, run `npm install` there, commit the updated lockfile and clone again."
      - problem:
          uk: "`git status` у клоні показує змінений `package-lock.json`"
          en: "`git status` in the clone shows `package-lock.json` as modified"
        fix:
          uk: "Схоже, у клоні запущено `npm install` замість `npm ci`. Поверни файл: `git restore package-lock.json`, і встанови залежності через `npm ci`."
          en: "It looks like `npm install` ran in the clone instead of `npm ci`. Bring the file back with `git restore package-lock.json` and install the dependencies with `npm ci`."
    recovery:
      uk: "Клон — одноразова тека: твоя робоча тека й commit не залежать від неї. Якщо заплутався, зупини сервер клону, клонуй репозиторій ще раз під новою назвою й почни спочатку."
      en: "The clone is a disposable folder: your working folder and your commits do not depend on it. If you get lost, stop the clone's server, clone the repository again under a new name and start over."

  - id: to-project
    kind: transfer
    capstoneStep: JS-10
    body:
      uk: "У контрольній точці CP-JS зроби те саме зі своїм проєктом: після останнього commit клонуй його в чисту теку й переконайся, що за README та `.env.example` він запускається з нуля."
      en: "In the CP-JS checkpoint do the same with your own project: after the last commit clone it into a clean folder and make sure that, with the README and `.env.example`, it starts from scratch."
