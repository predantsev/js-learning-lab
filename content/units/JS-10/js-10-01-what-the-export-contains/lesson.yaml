id: js-10-01-what-the-export-contains
unit: JS-10
title:
  uk: "Що містить експорт"
  en: "What the export contains"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Перелічити, що лежить в архіві експорту (усі поточні файли разом із незбереженими змінами, README, `package.json` зі скриптом `start`, `serve.mjs`, маніфест із SHA-256 кожного файла, копія сховища проєкту й сторінка її відновлення), і що туди не потрапляє (прогрес уроків, знімки)."
    en: "List what the export archive holds (every current file including unsaved changes, README, `package.json` with its `start` script, `serve.mjs`, a manifest with the SHA-256 of every file, a copy of the project storage and the page that restores it) and what stays out (lesson progress, snapshots)."
  - uk: "Прочитати `scripts` в експортованому `package.json`, сказати, що запускає `npm start`, і додати скрипт `test`."
    en: "Read the `scripts` of the exported `package.json`, say what `npm start` runs and add a `test` script."
  - uk: "Пояснити, чому після експорту головні — локальні файли і як переносити наступні кроки вручну: commit, еталон в окрему теку, порівняння, перенесення."
    en: "Explain why the local files are the main version after the export and how later steps are moved by hand: commit, reference into a separate folder, compare, copy over."
prerequisites: [js-15-15-capstone-local-home, js-15-03-node-and-package-manifest]
subskills:
  - { family: P-01, skill: "package scripts/manifest", depth: practice }
glossary: [project-export, export-manifest, checksum]
selfCheck: [predict-zip, predict-first-open, add-test-script]

blocks:
  - id: one-button
    kind: explanation
    title:
      uk: "Проєкт переїжджає на твій комп’ютер"
      en: "The project moves to your computer"
    body:
      uk: |
        Досі твій проєкт жив у платформі. Тепер ти забираєш його у звичайну теку з Git-репозиторієм поруч із навчальними теками з розділу про термінал (`~/js-course`) і далі працюєш у VS Code. Це [[project-export|експорт проєкту]].

        Де кнопка: **Мій проєкт** → **Експортувати проєкт**. Відкриється вікно «Експорт проєкту у VS Code» з двома варіантами:

        - **Завантажити .zip** — архів, який браузер збереже як файл, наприклад `js-learning-lab-wishlist-2026-10-02.zip`. Цим шляхом ітимемо в цьому розділі.
        - **Зберегти в теку** — платформа сама створить нову теку в окремій теці для експортів. Наявні теки вона ніколи не перезаписує. Якщо цієї кнопки немає, у твоїй установці доступний лише `.zip`.

        Перш ніж натискати, вирішимо: що саме опиниться в архіві?
      en: |
        So far your project lived in the platform. Now you take it into an ordinary folder with a Git repository, next to the practice folders from the terminal unit (`~/js-course`), and keep working in VS Code. This is a [[project-export|project export]].

        Where the button is: **My project** → **Export project**. A window “Export the project to VS Code” opens with two choices:

        - **Download .zip** — an archive the browser saves as a file, for example `js-learning-lab-wishlist-2026-10-02.zip`. This unit follows that route.
        - **Save to a folder** — the platform itself creates a new folder inside a separate folder for exports. It never overwrites existing folders. If this button is missing, your installation offers only the `.zip`.

        Before you press anything, decide: what exactly ends up in the archive?

  - id: predict-zip
    kind: prediction
    prompt:
      uk: "Ти експортуєш свій «Список бажань» кнопкою «Завантажити .zip». Хвилину тому ти змінив один файл, і платформа ще не встигла зберегти цю зміну. Що буде в архіві? Обери все, що буде."
      en: "You export your wishlist with “Download .zip”. A minute ago you changed one file, and the platform has not saved that change yet. What will the archive hold? Choose everything that will be there."
    answer:
      type: multi
      options:
        - id: own-files
          text:
            uk: "Файли проєкту: `index.html`, `app.js`, `domain/…`, `storage/…`, `ui/…`, картинки"
            en: "The project files: `index.html`, `app.js`, `domain/…`, `storage/…`, `ui/…`, images"
        - id: unsaved
          text:
            uk: "Щойно змінений файл — такий, як він зараз у редакторі"
            en: "The file you just changed — as it is in the editor right now"
        - id: package
          text:
            uk: "`package.json` зі скриптом `start`"
            en: "`package.json` with a `start` script"
        - id: manifest
          text:
            uk: "`jsll-manifest.json` із SHA-256 кожного файла"
            en: "`jsll-manifest.json` with the SHA-256 of every file"
        - id: storage-copy
          text:
            uk: "Копія записів зі сховища проєкту у файлі `data/exported-storage.json`"
            en: "A copy of the records in the project storage, in the file `data/exported-storage.json`"
        - id: progress
          text:
            uk: "Прогрес уроків і пройдені вправи"
            en: "Lesson progress and completed exercises"
          why:
            uk: "Прогрес належить курсу, а не проєкту. Він лишається в платформі й не потрапляє в архів."
            en: "Progress belongs to the course, not to the project. It stays in the platform and is not in the archive."
        - id: snapshots
          text:
            uk: "Знімки проєкту, створені раніше"
            en: "Project snapshots made earlier"
          why:
            uk: "Знімки — страховка всередині платформи. В архів іде лише поточний стан файлів."
            en: "Snapshots are a safety net inside the platform. The archive gets only the current state of the files."
      correct: [own-files, unsaved, package, manifest, storage-copy]
    explanation:
      uk: "Експорт бере файли такими, якими вони є в редакторі, — разом із незбереженими змінами. Платформа додає службові файли: README з командами, [[package-json|package.json]] з одним [[npm-script|скриптом]] `start`, сервер `serve.mjs`, маніфест і копію сховища з окремою сторінкою відновлення. Прогрес уроків і знімки лишаються в платформі."
      en: "The export takes the files as they are in the editor — unsaved changes included. The platform adds service files: a README with commands, [[package-json|package.json]] with a single [[npm-script|script]] `start`, the `serve.mjs` server, the manifest and a copy of the storage with a separate restore page. Lesson progress and snapshots stay in the platform."

  - id: export-box
    kind: visual
    visual: diagram
    title:
      uk: "Що йде в архів і як дані потрапляють у браузер"
      en: "What goes into the archive and how data reaches the browser"
    textEquivalent:
      uk: "У платформі є чотири речі: файли проєкту, сховище проєкту (localStorage), прогрес уроків і знімки. Експорт копіює файли в архів .zip такими, якими вони є в редакторі, разом із незбереженими змінами. Платформа додає службові файли: README з командами запуску, package.json зі скриптом start і маленький сервер serve.mjs. Файл jsll-manifest.json записує для кожного файла розмір і контрольну суму SHA-256. Сховище проєкту копіюється в архів як текстовий файл data/exported-storage.json. Прогрес уроків і знімки в архів не потрапляють. Коли проєкт запущено локально, localStorage локальної адреси спершу порожній: браузер не читає файл data/exported-storage.json сам. Лише сторінка tools/restore-data.html після натискання кнопки «Відновити дані» записує копію в localStorage тієї адреси, на якій її відкрито."
      en: "The platform holds four things: the project files, the project storage (localStorage), lesson progress and snapshots. The export copies the files into a .zip archive as they are in the editor, unsaved changes included. The platform adds service files: a README with the start commands, package.json with a start script and a small serve.mjs server. The file jsll-manifest.json records the size and the SHA-256 checksum of every file. The project storage is copied into the archive as the text file data/exported-storage.json. Lesson progress and snapshots do not go into the archive. When the project runs locally, the localStorage of the local address starts empty: the browser does not read data/exported-storage.json by itself. Only the page tools/restore-data.html, after its “Restore data” button is pressed, writes the copy into the localStorage of the address it was opened at."
    spec:
      layout: grid
      groups:
        - { id: platform, label: { uk: "Платформа", en: "The platform" } }
        - { id: zip, label: { uk: "Архів .zip", en: "The .zip archive" } }
        - { id: local, label: { uk: "Браузер, 127.0.0.1:4300", en: "Browser, 127.0.0.1:4300" } }
      nodes:
        - { id: files, group: platform, label: { uk: "Файли проєкту", en: "Project files" }, w: 128, col: 0, row: 1 }
        - { id: storage, group: platform, label: { uk: "Сховище", en: "Storage" }, shape: cylinder, w: 128, col: 1, row: 1 }
        - { id: progress, group: platform, label: { uk: "Прогрес уроків", en: "Lesson progress" }, w: 128, col: 0, row: 0 }
        - { id: snapshots, group: platform, label: { uk: "Знімки", en: "Snapshots" }, w: 128, col: 1, row: 0 }
        - { id: zfiles, group: zip, label: { uk: "Твої файли", en: "Your files" }, w: 128, col: 0, row: 2 }
        - { id: zdata, group: zip, label: { uk: "Копія сховища", en: "Storage copy" }, shape: note, w: 128, col: 1, row: 2 }
        - { id: service, group: zip, label: { uk: "Службові файли", en: "Service files" }, w: 128, col: 0, row: 4 }
        - { id: restore, group: zip, label: "restore-data.html", shape: note, w: 128, col: 1, row: 3 }
        - { id: manifest, group: zip, label: "jsll-manifest.json", shape: note, w: 128, col: 0, row: 3 }
        - { id: lstorage, group: local, label: "localStorage", shape: cylinder, w: 128, col: 1, row: 6 }
      edges:
        - { id: copy-files, from: files, to: zfiles, label: { uk: "копія", en: "copy" } }
        - { id: copy-data, from: storage, to: zdata, label: { uk: "як файл", en: "as a file" } }
        - { id: hashes, from: manifest, to: zfiles, label: "SHA-256", kind: dashed }
        - { id: reads, from: zdata, to: restore, kind: dashed }
        - { id: writes, from: restore, to: lstorage, label: { uk: "після кліку", en: "on a click" } }
      steps:
        - caption:
            uk: "У платформі є файли проєкту, його сховище, прогрес уроків і знімки. Експорт складає **архів .zip** — звичайний файл на твоєму комп’ютері."
            en: "The platform holds the project files, its storage, lesson progress and snapshots. The export builds a **.zip archive** — an ordinary file on your computer."
        - highlight: [files, zfiles, copy-files]
          dim: [storage, progress, snapshots, zdata, service, restore, manifest, lstorage]
          caption:
            uk: "Файли йдуть в архів такими, якими вони є **в редакторі** — разом зі змінами, які платформа ще не встигла зберегти."
            en: "The files go into the archive as they are **in the editor** — including changes the platform has not saved yet."
        - highlight: [service]
          dim: [storage, progress, snapshots, zdata, restore, manifest, lstorage]
          caption:
            uk: "Платформа додає службові файли: `README.md` з командами, `package.json` зі скриптом `start` і маленький сервер `serve.mjs`. Твій файл із такою самою назвою вона не перезаписує: службовий отримує іншу назву."
            en: "The platform adds service files: `README.md` with the commands, `package.json` with a `start` script and a small `serve.mjs` server. It never overwrites your file of the same name: the service file gets another name."
        - highlight: [manifest, hashes, zfiles]
          dim: [storage, progress, snapshots, zdata, restore, lstorage]
          caption:
            uk: "`jsll-manifest.json` записує для **кожного** файла шлях, розмір і SHA-256 — відбиток вмісту на мить експорту."
            en: "`jsll-manifest.json` records the path, the size and the SHA-256 of **every** file — a fingerprint of the content at the moment of export."
        - highlight: [storage, zdata, copy-data]
          dim: [files, progress, snapshots, zfiles, service, manifest, restore, lstorage]
          caption:
            uk: "Сховище проєкту копіюється в архів **як текст** у файлі `data/exported-storage.json`. У жоден браузер воно саме не потрапляє."
            en: "The project storage is copied into the archive **as text** in the file `data/exported-storage.json`. It does not get into any browser by itself."
        - highlight: [progress, snapshots]
          dim: [files, storage, zfiles, zdata, service, restore, manifest, lstorage]
          annotate:
            - { id: progress, text: { uk: "лишається", en: "stays" } }
            - { id: snapshots, text: { uk: "лишаються", en: "stay" } }
          caption:
            uk: "Прогрес уроків і знімки в архів **не** потрапляють: вони лишаються в платформі."
            en: "Lesson progress and snapshots do **not** go into the archive: they stay in the platform."
        - highlight: [zdata, reads, restore, writes, lstorage]
          dim: [files, storage, progress, snapshots, zfiles, service, manifest]
          caption:
            uk: "Локально `localStorage` нової адреси спершу **порожній**. Записи з'являються там лише тоді, коли ти відкриєш `tools/restore-data.html` і натиснеш «Відновити дані»."
            en: "Locally the `localStorage` of the new address starts **empty**. The records appear there only when you open `tools/restore-data.html` and press “Restore data”."

  - id: predict-first-open
    kind: prediction
    prompt:
      uk: "У платформі сховище твого «Списку бажань» містить 7 бажань, а початкових записів у проєкті 6. Ти розпакував експорт, запустив `npm start` і **вперше** відкрив `http://127.0.0.1:4300/`. Що покаже сторінка?"
      en: "In the platform the storage of your wishlist holds 7 wishes, while the project has 6 starting records. You unpacked the export, ran `npm start` and opened `http://127.0.0.1:4300/` for the **first** time. What does the page show?"
    answer:
      type: choice
      options:
        - id: starting
          text:
            uk: "6 початкових записів: `localStorage` цієї адреси ще порожній"
            en: "The 6 starting records: the `localStorage` of this address is still empty"
        - id: mine
          text:
            uk: "Мої 7 бажань: вони ж є в експорті"
            en: "My 7 wishes: they are in the export, after all"
          why:
            uk: "В експорті вони лежать як текст у файлі. Сторінка читає `localStorage` свого браузера для своєї адреси, а туди їх ще ніхто не записав."
            en: "In the export they lie as text in a file. The page reads the `localStorage` of its own browser for its own address, and nobody has written them there yet."
        - id: error
          text:
            uk: "Повідомлення про помилку: збережених даних немає"
            en: "An error message: there is no saved data"
          why:
            uk: "Відсутні дані — не помилка. Після кроку JS-07 проєкт у такому разі просто починає з початкових записів, без попередження."
            en: "Missing data is not an error. After step JS-07 the project then simply starts from the starting records, without a warning."
        - id: from-platform
          text:
            uk: "Мої 7 бажань, якщо платформа зараз запущена: сторінка візьме їх звідти"
            en: "My 7 wishes, if the platform is running right now: the page takes them from there"
          why:
            uk: "Експортований проєкт не звертається до платформи. Його обслуговує власний сервер `serve.mjs`, який віддає лише файли з твоєї теки."
            en: "The exported project never contacts the platform. It is served by its own `serve.mjs`, which only hands out files from your folder."
      correct: [starting]
    explanation:
      uk: "Дані `localStorage` належать адресі сторінки в конкретному браузері. Нова адреса — порожнє сховище, тож проєкт стартує з 6 початкових записів. Щоб побачити свої 7, відкрий `http://127.0.0.1:4300/tools/restore-data.html` на тій самій адресі й порту, натисни «Відновити дані» і відкрий проєкт знову. Це ти зробиш у третьому уроці розділу."
      en: "`localStorage` data belongs to the page's address in one particular browser. A new address means empty storage, so the project starts from the 6 starting records. To see your 7, open `http://127.0.0.1:4300/tools/restore-data.html` at the same address and port, press “Restore data” and open the project again. You will do that in the third lesson of this unit."

  - id: fingerprints
    kind: explanation
    title:
      uk: "Маніфест: відбиток кожного файла"
      en: "The manifest: a fingerprint of every file"
    body:
      uk: |
        [[export-manifest|Маніфест]] `jsll-manifest.json` — це опис експорту: який проєкт, якою мовою, коли, і список файлів. Для кожного файла там шлях, розмір у байтах і [[checksum|контрольна сума]] SHA-256:

        ```json
        { "path": "domain/tasks.js", "bytes": 297, "sha256": "d51171d5a7c4…" }
        ```

        SHA-256 — правило, яке з будь-якого вмісту робить 64 шістнадцяткові символи. Той самий вміст завжди дає ту саму суму. Зміни хоч один символ — і сума стане зовсім іншою.

        Навіщо це тобі? Щоб перевірити, що архів розпакувався без втрат, і щоб пізніше дізнатися, чи файл досі такий, яким вийшов із платформи. Сума не каже, *що* змінилося, — лише *чи*. Що саме ти змінив у своїй теці, покаже Git: `git diff`.
      en: |
        The [[export-manifest|manifest]] `jsll-manifest.json` describes the export: which project, in which language, when, and the list of files. For every file it holds the path, the size in bytes and the SHA-256 [[checksum]]:

        ```json
        { "path": "domain/tasks.js", "bytes": 297, "sha256": "d51171d5a7c4…" }
        ```

        SHA-256 is a rule that turns any content into 64 hexadecimal characters. The same content always gives the same sum. Change even one character and the sum becomes completely different.

        Why does that matter to you? To check that the archive unpacked without losses, and later to find out whether a file is still exactly as it left the platform. A checksum does not say *what* changed — only *whether*. What exactly you changed in your folder is what Git shows: `git diff`.

  - id: check-manifest
    kind: example
    runtime: browser-js
    dir: check-manifest
    entry: index.js
    strings:
      filesListed: { uk: "Файлів у маніфесті:", en: "Files in the manifest:" }
      same: { uk: "без змін:", en: "unchanged:" }
      changed: { uk: "ЗМІНЕНО:", en: "CHANGED:" }
      missing: { uk: "немає файла:", en: "missing:" }
    title:
      uk: "Перевір експорт за маніфестом"
      en: "Check an export against its manifest"
    body:
      uk: |
        У теці `exported/` — три файли з експорту «Планувальника» та їхній маніфест. Програма `index.js` читає кожен файл зі списку, обчислює його SHA-256 і порівнює із сумою з маніфесту.

        Натисни **Запустити** і подивись на вкладку **Консоль**.
      en: |
        The folder `exported/` holds three files from a planner export and their manifest. The program `index.js` reads every listed file, computes its SHA-256 and compares it with the sum in the manifest.

        Press **Run** and look at the **Console** tab.
    tryIt:
      uk: |
        1. Відкрий `exported/domain/tasks.js` і заміни `<= 0` на `< 0`. Запусти: цей файл тепер позначено «ЗМІНЕНО», а два інші — «без змін».
        2. Поверни `<= 0` точно як було й запусти ще раз: сума знову збігається.
        3. Додай один пробіл у кінці першого рядка в `exported/README.md` і запусти. Невидима для ока зміна — теж інша сума.
      en: |
        1. Open `exported/domain/tasks.js` and replace `<= 0` with `< 0`. Run: that file is now marked “CHANGED”, the other two “unchanged”.
        2. Put `<= 0` back exactly as it was and run again: the sum matches again.
        3. Add one space at the end of the first line of `exported/README.md` and run. A change you cannot see gives a different sum too.

  - id: after-export
    kind: explanation
    title:
      uk: "Після експорту головні — твої файли"
      en: "After the export, your files are the main version"
    body:
      uk: |
        Після експорту на екрані проєкту з’являється картка «Після експорту: головні — файли у VS Code». Платформа **не бачить** твоєї локальної теки, нічого не синхронізує й ніколи її не перезаписує. Її копія лишається для вправ і порівняння.

        Наступні кроки проєкту платформа дає як **еталони**: окремі архіви (список «Еталони для завантаження») і різницю між сусідніми еталонами. Переносиш зміни ти, вручну:

        1. Зроби [[git-commit|commit]] у Git — щоб будь-коли повернутися до стану «до».
        2. Завантаж еталон кроку й розпакуй його в **окрему** теку, не у свій проєкт.
        3. Прочитай у ньому `JSLL-REFERENCE.md`: інструкцію кроку й різницю з попереднім еталоном. Твоїх правок ця різниця не описує.
        4. Порівняй файли у VS Code: на одному файлі «Select for Compare», на другому — «Compare with Selected».
        5. Перенеси потрібне руками, запусти `npm start`, перевір і зроби ще один commit.
      en: |
        After the export the project screen shows the card “After the export: the files in VS Code are the main version”. The platform **does not see** your local folder, syncs nothing and never overwrites it. Its copy stays for exercises and comparison.

        The platform delivers later project steps as **references**: separate archives (the list “References to download”) and the difference between neighbouring references. You move the changes yourself, by hand:

        1. Make a Git [[git-commit|commit]] — so you can always return to the state “before”.
        2. Download the reference of the step and unpack it into a **separate** folder, not into your project.
        3. Read its `JSLL-REFERENCE.md`: the step's instructions and the difference from the previous reference. That difference does not describe your own edits.
        4. Compare the files in VS Code: “Select for Compare” on one file, “Compare with Selected” on the other.
        5. Copy what you need by hand, run `npm start`, check and make another commit.

  - id: predict-reference
    kind: prediction
    prompt:
      uk: "Ти вже експортував проєкт і змінив `ui/page.js` у VS Code. Згодом у платформі з’являється еталон наступного кроку. Що станеться з твоєю локальною текою?"
      en: "You have exported the project and changed `ui/page.js` in VS Code. Later the platform publishes the reference of the next step. What happens to your local folder?"
    answer:
      type: choice
      options:
        - id: nothing
          text:
            uk: "Нічого, доки ти сам не перенесеш зміни з еталона"
            en: "Nothing, until you copy changes from the reference yourself"
        - id: replaced
          text:
            uk: "Платформа замінить файли теки еталонними, а мій `ui/page.js` збереже в знімку"
            en: "The platform replaces the folder's files with the reference ones and keeps my `ui/page.js` in a snapshot"
          why:
            uk: "Знімки й заміна еталоном стосуються лише копії в платформі. Локальної теки платформа не бачить і не змінює."
            en: "Snapshots and applying a reference concern only the copy in the platform. The platform neither sees nor changes your local folder."
        - id: untouched-only
          text:
            uk: "Платформа оновить лише ті файли, яких я не змінював"
            en: "The platform updates only the files I did not change"
          why:
            uk: "Платформа не знає, які файли ти змінював локально, бо не читає теки. Жодних автоматичних оновлень немає."
            en: "The platform does not know which files you changed locally, because it never reads the folder. There are no automatic updates at all."
        - id: vscode-merge
          text:
            uk: "VS Code сам запропонує злити зміни, бо проєкт прийшов із платформи"
            en: "VS Code offers to merge the changes by itself, because the project came from the platform"
          why:
            uk: "VS Code нічого не знає про платформу. Еталон — звичайний архів, який ти завантажуєш і порівнюєш сам."
            en: "VS Code knows nothing about the platform. A reference is an ordinary archive that you download and compare yourself."
      correct: [nothing]
    explanation:
      uk: "Після експорту зв’язку між платформою і твоєю текою немає. Еталон — окремий архів: ти завантажуєш його в окрему теку, порівнюєш і переносиш потрібне вручну, а перед цим робиш commit, щоб мати точку повернення."
      en: "After the export there is no link between the platform and your folder. A reference is a separate archive: you download it into a separate folder, compare and copy what you need by hand, and before that you commit so you have a point to return to."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: npm-start-runs
        from: js-15-03-node-and-package-manifest
        prompt:
          uk: "У `package.json` є `\"scripts\": { \"start\": \"node serve.mjs\" }`. Яку команду ти вводиш у терміналі в теці проєкту, щоб виконати цей скрипт?"
          en: "`package.json` has `\"scripts\": { \"start\": \"node serve.mjs\" }`. Which command do you type in a terminal in the project folder to run this script?"
        answer:
          type: choice
          options:
            - { id: npm-start, code: "npm start" }
            - id: node-start
              code: "node start"
              why:
                uk: "`node` запускає файл JavaScript. Він шукатиме файл із назвою `start` і не знайде його."
                en: "`node` runs a JavaScript file. It looks for a file named `start` and does not find one."
            - id: npm-file
              code: "npm serve.mjs"
              why:
                uk: "npm виконує скрипти за їхніми назвами з `scripts`, а не файли. `serve.mjs` для npm — невідома команда."
                en: "npm runs scripts by their names from `scripts`, not files. To npm, `serve.mjs` is an unknown command."
            - id: bare-start
              code: "start"
              why:
                uk: "Без `npm` термінал шукає програму з назвою `start`, а не скрипт із `package.json`."
                en: "Without `npm` the terminal looks for a program named `start`, not a script from `package.json`."
          correct: [npm-start]
        explanation:
          uk: "`npm start` (скорочення від `npm run start`) знаходить `package.json` і виконує команду зі `scripts.start` в оболонці — тут це `node serve.mjs`."
          en: "`npm start` (short for `npm run start`) finds `package.json` and runs the line from `scripts.start` in the shell — here that is `node serve.mjs`."
      - id: json-trailing-comma
        from: js-07-04-json
        prompt:
          uk: "Що станеться, коли виконається цей код?"
          en: "What happens when this code runs?"
        code: |
          const settings = JSON.parse('{ "start": "node serve.mjs", }');
          console.log(settings.start);
        verify: { logs: [], error: SyntaxError }
        answer:
          type: choice
          options:
            - id: syntax-error
              text:
                uk: "`SyntaxError`: кома після останньої пари в JSON заборонена"
                en: "`SyntaxError`: a comma after the last pair is not allowed in JSON"
            - id: prints
              code: "node serve.mjs"
              why:
                uk: "В об’єкті JavaScript така кома дозволена, а в JSON — ні. JSON суворіший: лише подвійні лапки і жодної коми в кінці."
                en: "A JavaScript object allows that comma, JSON does not. JSON is stricter: double quotes only and no comma at the end."
            - id: undefined
              code: "undefined"
              why:
                uk: "До `console.log` справа не доходить: `JSON.parse` кидає помилку раніше."
                en: "The code never reaches `console.log`: `JSON.parse` throws first."
          correct: [syntax-error]
        explanation:
          uk: "`JSON.parse` кидає `SyntaxError` на зайвій комі. `package.json` — теж JSON, і npm читає його так само суворо: із такою комою він не запустить жодного скрипта."
          en: "`JSON.parse` throws a `SyntaxError` on the extra comma. `package.json` is JSON too, and npm reads it just as strictly: with such a comma it runs no script at all."

  - id: add-test-script
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: add-test-script
    entry: index.js
    editable: [package.json]
    preview: false
    strings:
      projectTitle: { uk: "Трекер звичок", en: "Habit tracker" }
      notJson: { uk: "npm error code EJSONPARSE — package.json не є коректним JSON:", en: "npm error code EJSONPARSE — package.json is not valid JSON:" }
      noScript: { uk: "немає такого скрипта, npm напише Missing script:", en: "no such script, npm says Missing script:" }
      fileFound: { uk: "npm test запустить файл проєкту:", en: "npm test starts a project file:" }
      fileMissing: { uk: "npm test шукатиме файл, якого в проєкті немає:", en: "npm test looks for a file the project does not have:" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Додай скрипт test"
      en: "Add a test script"
    instructions:
      uk: |
        Це експортований «Трекер звичок». У `package.json` є лише скрипт `start`: перевірки платформи лишилися в платформі, тож локальні тести запускатимеш сам.

        Тести проєкту написано так, як у розділі про тести: `domain/habits.test.js` лише **реєструє** тести через `test(…)` з курсового запускача `testing.js`, а виконує їх файл `run-tests.js` — він імпортує тести й викликає `run()`. Ці три файли тільки для читання.

        Додай у `scripts` скрипт `test`, який запускає через `node` саме файл `run-tests.js`. Скрипт `start` і решту полів не чіпай.

        Файл `index.js` читає `package.json` так, як npm, і показує, що запустили б `npm start` і `npm test`, а також чи є в проєкті файл, який запустить `npm test`. Натисни **Запустити**, щоб побачити, і **Перевірити**, коли будеш готовий.
      en: |
        This is an exported habit tracker. Its `package.json` has only a `start` script: the platform's checks stayed in the platform, so you will run local tests yourself.

        The project's tests are written as in the testing unit: `domain/habits.test.js` only **registers** tests with `test(…)` from the course runner `testing.js`, and the file `run-tests.js` runs them — it imports the tests and calls `run()`. These three files are read-only.

        Add a `test` script to `scripts` that runs exactly the file `run-tests.js` with Node.js. Leave the `start` script and the other fields as they are.

        The file `index.js` reads `package.json` the way npm does and shows what `npm start` and `npm test` would run, and whether the project has the file `npm test` would start. Press **Run** to see it and **Check** when you are ready.
    testTitles:
      "package.json is valid JSON":
        uk: "`package.json` — коректний JSON"
        en: "`package.json` is valid JSON"
      "npm start still runs serve.mjs with node":
        uk: "`npm start` і далі запускає `node serve.mjs`"
        en: "`npm start` still runs `node serve.mjs`"
      "npm test runs run-tests.js with node":
        uk: "`npm test` запускає `run-tests.js` через `node`"
        en: "`npm test` runs `run-tests.js` with `node`"
      "name and type stay as exported":
        uk: "`name` і `type` лишилися такими, як в експорті"
        en: "`name` and `type` stay as they were exported"
    hints:
      nudge:
        uk: "Знайди, де в `package.json` лежить `start`. Новий скрипт має бути його сусідом у тому самому об’єкті."
        en: "Find where `start` lives in `package.json`. The new script must be its neighbour in the same object."
      explanation:
        uk: "У JSON пари «ключ: значення» в одному об’єкті розділяються комами, а після останньої пари коми немає. Наприклад, щоб до `{ \"a\": 1 }` додати ключ `b`, пишуть `{ \"a\": 1, \"b\": 2 }`. Ключ, записаний поза фігурними дужками `scripts`, npm скриптом не вважає."
        en: "In JSON the “key: value” pairs of one object are separated by commas, and there is no comma after the last pair. For example, to add the key `b` to `{ \"a\": 1 }` you write `{ \"a\": 1, \"b\": 2 }`. npm does not treat a key written outside the curly braces of `scripts` as a script."
    solutionNote:
      uk: |
        Скрипти — це пари «назва: команда» в об’єкті `scripts`. `npm test` шукає саме `scripts.test` і виконує його команду в оболонці. `node run-tests.js` імпортує тести й викликає `run()`, тож кожен тест справді виконується й друкує рядок `✓` або `✗`.

        Чому не `node --test`? Вбудований запускач Node.js сам знаходить файли з назвами на кшталт `habits.test.js` і запускає кожен як окрему програму. Але наш файл лише реєструє тести, а `run()` у ньому ніхто не викликає: файл завершується без помилки, і `node --test` звітує `pass 1`, хоча жодна перевірка не виконалася — навіть хибна.
      en: |
        Scripts are “name: command” pairs in the `scripts` object. `npm test` looks for exactly `scripts.test` and runs its command in the shell. `node run-tests.js` imports the tests and calls `run()`, so every test really runs and prints a `✓` or `✗` line.

        Why not `node --test`? Node.js's built-in runner finds files with names like `habits.test.js` by itself and runs each as a separate program. But our file only registers tests, and nothing in it calls `run()`: the file ends without an error, and `node --test` reports `pass 1` although no check ran — not even a failing one.
    feedback:
      - when: { error: SyntaxError }
        message:
          uk: "Платформа читає файли `.json` проєкту ще до запуску, так само суворо, як npm (npm у такому разі пише `npm error code EJSONPARSE` і не запускає жодного скрипта). Якщо картка називає `package.json` і починається з `Invalid JSON`, шукай кому біля місця, яке вона вказує: між парами в об’єкті кома потрібна, після останньої пари — заборонена."
          en: "The platform reads the project's `.json` files before running, just as strictly as npm (npm then prints `npm error code EJSONPARSE` and runs no script at all). If the card names `package.json` and starts with `Invalid JSON`, look at the commas near the place it points to: one is needed between pairs of an object, and none is allowed after the last pair."
      - when: { test: "package.json is valid JSON" }
        message:
          uk: "Ця перевірка розбирає `package.json` через `JSON.parse`, як npm, і чекає коректний JSON: кома між парами в об’єкті, жодної коми після останньої пари."
          en: "This check parses `package.json` with `JSON.parse`, as npm does, and expects valid JSON: a comma between the pairs of an object and no comma after the last pair."
      - when: { test: "npm start still runs serve.mjs with node" }
        message:
          uk: "Ця перевірка чекає коректний JSON, у якому `scripts.start` і далі дорівнює `node serve.mjs`. Без `node` на початку оболонка спробує виконати `serve.mjs` як програму і відповість `sh: serve.mjs: command not found`."
          en: "This check expects valid JSON in which `scripts.start` is still `node serve.mjs`. Without `node` at the start the shell tries to run `serve.mjs` as a program and answers `sh: serve.mjs: command not found`."
      - when: { test: "npm test runs run-tests.js with node" }
        message:
          uk: "Ця перевірка чекає коректний JSON, у якому всередині об’єкта `scripts` є ключ `test`, а його команда — `node` і файл `run-tests.js`, більше нічого. Ключ `test` поза `scripts` npm не бачить і на `npm test` відповідає `Missing script: \"test\"`. `node --test` не підходить: він знаходить `habits.test.js` за назвою, але `run()` там ніхто не викликає, тож тести не виконуються, а звіт усе одно каже `pass`."
          en: "This check expects valid JSON with a `test` key inside the `scripts` object whose command is `node` and the file `run-tests.js`, nothing else. npm does not see a `test` key outside `scripts` and answers `npm test` with `Missing script: \"test\"`. `node --test` does not fit: it finds `habits.test.js` by its name, but nothing there calls `run()`, so the tests never run while the report still says `pass`."
      - when: { test: "name and type stay as exported" }
        message:
          uk: "Ця перевірка чекає коректний JSON, у якому `name` — `js-learning-lab-habits`, а `type` — `module`. `type: module` каже Node.js, що файли `.js` проєкту — ES-модулі."
          en: "This check expects valid JSON in which `name` is `js-learning-lab-habits` and `type` is `module`. `type: module` tells Node.js that the project's `.js` files are ES modules."

  - id: to-project
    kind: transfer
    capstoneStep: JS-10
    body:
      uk: "У наступному уроці ти експортуєш власний проєкт. Розпакувавши його, перевір те саме: які файли прийшли й що робить `npm start`. Скрипта `test` там ще немає — його ти додаси в контрольній точці CP-JS."
      en: "In the next lesson you export your own project. Once it is unpacked, check the same things: which files arrived and what `npm start` does. It has no `test` script yet — you add one in the CP-JS checkpoint."
