      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Застави й прострочення: виправ і закріпи тестами"
      en: "Deposits and overdue loans: repair and pin down with tests"
    instructions:
      uk: |
        Тут той самий модуль, що ти досліджував у зібраному коді, лише назви інструментів — мовою уроку. `index.js` друкує ранковий звіт і запускає твої тести з `lending.test.js`; `loans.js` і `index.js` не змінюються.

        Що має бути правдою (так написано в коментарях `lending.js`):

        - `heldDepositsMinor(loans)` — застави лише тих позик, що ще не повернені, **точно** в копійках, цілим числом. Для облікових даних прокату це 57830.
        - `isOverdue(loan, today)` — `true`, коли позику не повернено і термін (`dueDate`) **раніше** за `today`. Позика з терміном саме сьогодні ще не прострочена.

        Завдання:

        1. Виправ обидва дефекти в `lending.js`. Решту поведінки не змінюй.
        2. У `lending.test.js` напиши тести курсового runner (`test`, `expect` з `./testing.js`): хоча б один на кожен дефект, **на тій межі, де він з’являється**. Тест має проходити з правильним модулем і падати з дефектним.

        Перевірки викликають твої функції на власних даних і ще запускають твій `lending.test.js` тричі: з еталонним `lending.js` (усі тести мають пройти) і з двома дефектними версіями, кожну з яких хоч один твій тест має впіймати.
      en: |
        This is the same module you investigated in the built code, only the tool names are in the lesson language. `index.js` prints the morning report and runs your tests from `lending.test.js`; `loans.js` and `index.js` do not change.

        What must be true (the comments in `lending.js` say so):

        - `heldDepositsMinor(loans)` — the deposits of only the loans not returned yet, **exactly** in kopiykas, as a whole number. For the library’s records that is 57830.
        - `isOverdue(loan, today)` — `true` when the loan is not returned and its due date (`dueDate`) is **before** `today`. A loan due exactly today is not overdue yet.

        The task:

        1. Repair both defects in `lending.js`. Do not change any other behavior.
        2. In `lending.test.js` write tests with the course runner (`test`, `expect` from `./testing.js`): at least one for each defect, **on the boundary where it appears**. A test must pass with the correct module and fail with the defective one.

        The checks call your functions on their own data and also run your `lending.test.js` three times: with a reference `lending.js` (every test must pass) and with two defective versions, each of which at least one of your tests must catch.
    testTitles:
      "heldDepositsMinor gives the exact kopiykas of the loans not returned":
        uk: "`heldDepositsMinor` дає точні копійки застав неповернених позик"
        en: "`heldDepositsMinor` gives the exact kopiykas of the loans not returned"
      "a returned loan is never overdue, even after its due date":
        uk: "Повернена позика ніколи не прострочена, навіть після терміну"
        en: "A returned loan is never overdue, even after its due date"
      "a loan not returned is overdue only after its due date":
        uk: "Неповернена позика прострочена лише після свого терміну"
        en: "A loan not returned is overdue only after its due date"
      "your tests pass with the reference lending.js":
        uk: "Твої тести проходять з еталонним `lending.js`"
        en: "Your tests pass with the reference `lending.js`"
      "one of your tests fails when the deposit total is cut down to whole kopiykas":
        uk: "Твій тест падає, коли суму застав обрізають до цілих копійок"
        en: "Your test fails when the deposit total is cut down to whole kopiykas"
      "one of your tests fails when a returned loan counts as overdue":
        uk: "Твій тест падає, коли повернену позику вважають простроченою"
        en: "Your test fails when a returned loan counts as overdue"
    solutionNote:
      uk: |
        **Застави.** Сума десяткових дробів — двійковий дріб: на паузі в рядку `return` змінна `total` показує `578.3`, але `total * 100` — це `57829.99999999999`, і `Math.floor` обрізає його до 57829. Надійно — перетворити **кожну** заставу на цілі копійки (`Math.round(loan.depositUah * 100)`) і додавати цілі числа: так сума точна за будь-якої кількості позик. Округлення суми наприкінці (`Math.round(total * 100)`) теж дає правильну відповідь на цих даних, але похибка тоді накопичується у дробах.

        **Прострочення.** Умова читає `loan.returned`, а в позики такого поля немає — є `returnedOn`. `!undefined` — це `true`, тож будь-яка позика з минулим терміном «не повернена». Правильна умова — `loan.returnedOn === null`. Пастка поруч: `loan.returnedOn === undefined` теж ніколи не справджується, бо неповернена позика має `null`, а не `undefined`.

        **Тести на межі.** Дефект застав видно лише там, де сума дробів не має точного двійкового запису (`0.7 + 0.1` чи всі позики прокату), а не на круглих сумах. Дефект прострочень видно лише на позиці, яку повернули **після** терміну: повернена до терміну не прострочена й за дефектної умови.
      en: |
        **Deposits.** A sum of decimal fractions is a binary fraction: at a pause on the `return` line the variable `total` shows `578.3`, but `total * 100` is `57829.99999999999`, and `Math.floor` cuts it down to 57829. The robust repair turns **each** deposit into whole kopiykas (`Math.round(loan.depositUah * 100)`) and adds whole numbers: then the sum is exact for any number of loans. Rounding the sum at the end (`Math.round(total * 100)`) also gives the right answer on this data, but the error then accumulates in the fractions.

        **Overdue.** The condition reads `loan.returned`, and a loan has no such field — it has `returnedOn`. `!undefined` is `true`, so every loan with a past due date counts as “not returned”. The correct condition is `loan.returnedOn === null`. A trap next to it: `loan.returnedOn === undefined` is never true either, because a loan not returned has `null`, not `undefined`.

        **Boundary tests.** The deposit defect shows only where the sum of fractions has no exact binary form (`0.7 + 0.1`, or all the library’s loans), not on round sums. The overdue defect shows only on a loan returned **after** its due date: one returned before it is not overdue even with the defective condition.
    feedback:
      - when: { test: "heldDepositsMinor gives the exact kopiykas of the loans not returned" }
        message:
          uk: "Ця перевірка очікує цілі копійки неповернених позик: 57830 для облікових даних прокату, 80 для застав `0.7` і `0.1`, 1999 для однієї неповерненої позики з `19.99`, 0 для порожнього списку."
          en: "This check expects the whole kopiykas of the loans not returned: 57830 for the library’s records, 80 for deposits `0.7` and `0.1`, 1999 for one loan not returned with `19.99`, 0 for an empty list."
      - when: { test: "a returned loan is never overdue, even after its due date" }
        message:
          uk: "Ця перевірка очікує `false` від `isOverdue` для позики, яку повернули після терміну, — і для позики `L-01` після `returnTool`."
          en: "This check expects `false` from `isOverdue` for a loan returned after its due date — and for the loan `L-01` after `returnTool`."
      - when: { test: "a loan not returned is overdue only after its due date" }
        message:
          uk: "Ця перевірка очікує для неповерненої позики: `true`, коли термін був учора, і `false`, коли термін сьогодні чи завтра. Неповернена позика має `returnedOn: null`."
          en: "This check expects, for a loan not returned: `true` when it was due yesterday, and `false` when it is due today or tomorrow. A loan not returned has `returnedOn: null`."
      - when: { test: "your tests pass with the reference lending.js" }
        message:
          uk: "Ця перевірка запускає твій `lending.test.js` з еталонним `lending.js` і очікує хоча б один тест і жодного, що падає. Тести можуть покладатися лише на описану поведінку: дані, які ти підготував, `LOANS`, `TODAY` і функції `lending.js`."
          en: "This check runs your `lending.test.js` with a reference `lending.js` and expects at least one test and none failing. Tests may rely only on the described behavior: data you prepared, `LOANS`, `TODAY` and the functions of `lending.js`."
      - when: { test: "one of your tests fails when the deposit total is cut down to whole kopiykas" }
        message:
          uk: "Ця перевірка запускає твої тести з `heldDepositsMinor`, що додає застави як дроби й обрізає суму через `Math.floor`, і очікує, що хоч один тест упаде. На круглих сумах ця версія дає правильну відповідь."
          en: "This check runs your tests with a `heldDepositsMinor` that adds the deposits as fractions and cuts the sum down with `Math.floor`, and expects at least one test to fail. On round sums this version gives the right answer."
      - when: { test: "one of your tests fails when a returned loan counts as overdue" }
        message:
          uk: "Ця перевірка запускає твої тести з `isOverdue`, що читає неіснуюче поле `loan.returned`, і очікує, що хоч один тест упаде. Позику, повернену до терміну, ця версія оцінює правильно."
          en: "This check runs your tests with an `isOverdue` that reads the missing field `loan.returned`, and expects at least one test to fail. A loan returned before its due date is judged correctly by this version."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: в одному з файлів синтаксична помилка — назву файла й рядок видно в картці помилки."
          en: "The code could not start: one of the files has a syntax error — the error card shows the file name and line."
      - when: { error: ReferenceError }
        message:
          uk: "Під час запуску сталася `ReferenceError`: якоїсь назви не знайдено. Картка помилки показує файл і рядок; перевір, що назву з цього рядка оголошено або імпортовано в цьому файлі й написано так само."
          en: "A `ReferenceError` happened while starting: some name was not found. The error card shows the file and line; check that the name on that line is declared or imported in that file and spelled the same way."

  - id: cache-and-cycle
    kind: exercise
    mode: debug
    assessment: true
    runtime: browser-js
    dir: cache-and-cycle
    entry: index.js
    editable: [catalog.js, fees.js, availability.js]
    strings:
      drill: { uk: "Дриль", en: "Drill" }
      ladder: { uk: "Драбина", en: "Ladder" }
      washer: { uk: "Мийка високого тиску", en: "Pressure washer" }
      sewing: { uk: "Швейна машинка", en: "Sewing machine" }
      perDay: { uk: "грн на день", en: "UAH per day" }
      feeLine: { uk: "Драбина на 3 дні, коп.:", en: "Ladder for 3 days, kopiykas:" }
      freeLine: { uk: "Вільно 10 березня:", en: "Free on 10 March:" }
      computedLine: { uk: "Обчислень наявності:", en: "Availability computations:" }
    title:
      uk: "Звіт, що не стартує, і кеш, що нічого не пам’ятає"
      en: "A report that will not start and a cache that remembers nothing"
    instructions:
      uk: |
        Другий звіт прокату: каталог, плата за оренду й наявність інструментів. Дві скарги:

        1. **Звіт не запускається.** Учора `index.js` імпортував спершу `./fees.js`, і все працювало. Сьогодні хтось упорядкував імпорти за абеткою — `./catalog.js` став першим, — і звіт падає ще під час завантаження. `index.js` тепер лише для читання: звіт має працювати **за будь-якого** порядку його імпортів.
        2. **Екран наявності гальмує.** `freeUnits(toolId, day)` проходить усі бронювання, тому відповідь кешується: те саме питання має обчислюватися лише раз. Звіт ставить кожне з чотирьох питань по кілька разів — обчислень має бути 4.

        Виправ `catalog.js`, `fees.js` і `availability.js`. Експорти лишаються ті самі: `TOOLS` і `describeTool` з `catalog.js`, `feeFor` з `fees.js`, `freeUnits` і `stats` з `availability.js`; результати функцій не змінюються.

        Перевірки **рахують обчислення**: вони читають лічильник `stats.computed` до й після двох однакових питань.
      en: |
        The library’s second report: the catalog, rental fees and tool availability. Two complaints:

        1. **The report does not start.** Yesterday `index.js` imported `./fees.js` first, and everything worked. Today someone sorted the imports alphabetically — `./catalog.js` came first — and the report crashes while it is still loading. `index.js` is now read-only: the report must work with **any** order of its imports.
        2. **The availability screen is slow.** `freeUnits(toolId, day)` goes through every booking, so the answer is cached: the same question must be computed only once. The report asks each of four questions several times — there should be 4 computations.

        Repair `catalog.js`, `fees.js` and `availability.js`. The exports stay the same: `TOOLS` and `describeTool` from `catalog.js`, `feeFor` from `fees.js`, `freeUnits` and `stats` from `availability.js`; the results of the functions do not change.

        The checks **count computations**: they read the counter `stats.computed` before and after two identical questions.
    testTitles:
      "the report loads without an error":
        uk: "Звіт завантажується без помилки"
        en: "The report loads without an error"
      "catalog.js still exports the four tools":
        uk: "`catalog.js` і далі експортує чотири інструменти"
        en: "`catalog.js` still exports the four tools"
      "feeFor gives the fee for the number of days":
        uk: "`feeFor` дає плату за кількість днів"
        en: "`feeFor` gives the fee for the number of days"
      "describeTool shows the name and the daily fee":
        uk: "`describeTool` показує назву й плату за день"
        en: "`describeTool` shows the name and the daily fee"
      "a repeated question is computed only once":
        uk: "Повторне питання обчислюється лише раз"
        en: "A repeated question is computed only once"
      "different questions get their own answers":
        uk: "Різні питання отримують власні відповіді"
        en: "Different questions get their own answers"
    hints:
      nudge:
        uk: "Підказок до розв’язку тут навмисно немає. Почни з доказу: картка помилки називає файл, рядок і точні слова JavaScript, а рядок «Обчислень наявності» у звіті показує, скільки разів кеш промахнувся."
        en: "There are no hints towards the solution here, on purpose. Start from the evidence: the error card names a file, a line and JavaScript’s exact words, and the “Availability computations” line of the report shows how many times the cache missed."
      explanation:
        uk: "Якщо доказ не складається в пояснення, перечитай уроки, а не шукай відповідь: порядок виконання модулів — js-07-06, js-07-07 і js-13-08; змінна, прочитана до свого рядка, — js-02-07; як `Map` порівнює ключі-об’єкти — js-04-07 і js-12-11."
        en: "If the evidence does not add up to an explanation, reread lessons instead of looking for the answer: module evaluation order — js-07-06, js-07-07 and js-13-08; a variable read before its line — js-02-07; how a `Map` compares object keys — js-04-07 and js-12-11."
    solutionNote:
      uk: |
        **Звіт не стартує.** `catalog.js` імпортує `fees.js`, а `fees.js` — `catalog.js`: це цикл. Коли першим імпортують `catalog.js`, він чекає на свою залежність, і `fees.js` виконується, поки `catalog.js` ще не дійшов до `export const TOOLS`. Рядок `new Map(TOOLS.map(...))` читає `TOOLS` у temporal dead zone: `ReferenceError: Cannot access 'TOOLS' before initialization` у `fees.js`, рядок 5. За порядку «спершу `fees.js`» усе навпаки: `catalog.js` виконується першим і читає `feeFor` лише всередині функції, пізніше. Виправлення — не читати `TOOLS` під час завантаження: шукати інструмент усередині `feeFor`, коли модулі вже виконалися, або прибрати сам цикл (плата за день є в записі інструмента, тож `catalog.js` може не імпортувати `fees.js`). Заміна `const` на `var` лише міняє `ReferenceError` на `TypeError`: `var` до свого рядка — `undefined`.

        **Кеш не влучає.** Ключ `{ toolId, day }` — щоразу **новий** об’єкт, а `Map` порівнює об’єкти за ідентичністю, тож `cache.has(key)` ніколи не справджується, а кеш лише росте. Ключ має бути значенням, яке порівнюється за вмістом, — текстом: `` `${toolId}|${day}` `` або `JSON.stringify([toolId, day])`. Масив `[toolId, day]` — теж новий об’єкт щоразу.
      en: |
        **The report does not start.** `catalog.js` imports `fees.js`, and `fees.js` imports `catalog.js`: that is a cycle. When `catalog.js` is imported first, it waits for its dependency, and `fees.js` runs while `catalog.js` has not reached `export const TOOLS` yet. The line `new Map(TOOLS.map(...))` reads `TOOLS` in the temporal dead zone: `ReferenceError: Cannot access 'TOOLS' before initialization` in `fees.js`, line 5. With the order “`fees.js` first” it is the other way round: `catalog.js` runs first and reads `feeFor` only inside a function, later. The repair is not to read `TOOLS` while loading: look the tool up inside `feeFor`, once the modules have run, or remove the cycle itself (the daily fee is in the tool record, so `catalog.js` need not import `fees.js`). Replacing `const` with `var` only turns the `ReferenceError` into a `TypeError`: a `var` before its line is `undefined`.

        **The cache never hits.** The key `{ toolId, day }` is a **new** object every time, and a `Map` compares objects by identity, so `cache.has(key)` is never true and the cache only grows. The key must be a value compared by content — text: `` `${toolId}|${day}` `` or `JSON.stringify([toolId, day])`. An array `[toolId, day]` is a new object every time too.
    feedback:
      - when: { test: "the report loads without an error" }
        message:
          uk: "Ця перевірка очікує, що звіт завантажиться без помилки з тим порядком імпортів, який має `index.js` зараз: `catalog.js` першим."
          en: "This check expects the report to load without an error with the import order `index.js` has now: `catalog.js` first."
      - when: { test: "catalog.js still exports the four tools" }
        message:
          uk: "Ця перевірка очікує з `catalog.js` експорт `TOOLS` — масив інструментів з id `drill`, `ladder`, `washer`, `sewing` у цьому порядку."
          en: "This check expects `catalog.js` to export `TOOLS` — an array of tools with the ids `drill`, `ladder`, `washer`, `sewing` in this order."
      - when: { test: "feeFor gives the fee for the number of days" }
        message:
          uk: "Ця перевірка очікує, що `feeFor(\"washer\", 2)` дасть 18000, а `feeFor(\"drill\", 1)` — 4000 копійок."
          en: "This check expects `feeFor(\"washer\", 2)` to give 18000 and `feeFor(\"drill\", 1)` to give 4000 kopiykas."
      - when: { test: "describeTool shows the name and the daily fee" }
        message:
          uk: "Ця перевірка очікує, що `describeTool(\"ladder\")` поверне назву драбини, ` — 25.00 ` і слова про плату за день, як у звіті."
          en: "This check expects `describeTool(\"ladder\")` to return the ladder’s name, ` — 25.00 ` and the per-day words, as in the report."
      - when: { test: "a repeated question is computed only once" }
        message:
          uk: "Ця перевірка двічі ставить `freeUnits(\"drill\", \"2026-03-11\")` і очікує відповідь 1 обидва рази та рівно одне нове обчислення в `stats.computed`."
          en: "This check asks `freeUnits(\"drill\", \"2026-03-11\")` twice and expects the answer 1 both times and exactly one new computation in `stats.computed`."
      - when: { test: "different questions get their own answers" }
        message:
          uk: "Ця перевірка очікує окремі відповіді для різних інструментів і днів: швейних машинок 12 березня вільно 3, 10 березня — 1, драбин 12 березня — 1."
          en: "This check expects separate answers for different tools and days: 3 sewing machines free on 12 March, 1 on 10 March, and 1 ladder on 12 March."
      - when: { error: ReferenceError }
        message:
          uk: "Звіт падає з `ReferenceError` ще під час завантаження — тоді не проходить жодна перевірка. Картка помилки називає файл і рядок; з’ясуй, хто читає цю назву і чому в той момент її рядок ще не виконався."
          en: "The report crashes with a `ReferenceError` while still loading — then no check passes. The error card names the file and line; find out who reads that name and why its line has not run yet at that moment."
      - when: { error: TypeError }
        message:
          uk: "Звіт падає з `TypeError` під час завантаження — тоді не проходить жодна перевірка. Картка помилки показує, яке значення виявилося `undefined` і в якому рядку."
          en: "The report crashes with a `TypeError` while loading — then no check passes. The error card shows which value turned out to be `undefined` and on which line."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: в одному з файлів синтаксична помилка — назву файла й рядок видно в картці помилки."
          en: "The code could not start: one of the files has a syntax error — the error card shows the file name and line."

  - id: after-the-check
    kind: review
    title:
      uk: "Після перевірки: на чому стояли ці дефекти"
      en: "After the check: what these defects stood on"
    items:
      - id: minor-units-sum
        from: js-12-05-integer-minor-units
        prompt:
          uk: "Ціни в кошику: `19.99`, `0.01` і `5.10` грн. Який спосіб гарантує точну суму в копійках?"
          en: "Prices in a basket: `19.99`, `0.01` and `5.10` UAH. Which approach guarantees an exact sum in kopiykas?"
        answer:
          type: choice
          options:
            - id: each-first
              text: { uk: "Перетворити кожну ціну на цілі копійки через `Math.round(price * 100)` і додати цілі числа", en: "Turn each price into whole kopiykas with `Math.round(price * 100)` and add the whole numbers" }
            - id: tofixed
              text: { uk: "Додати ціни як дроби й показати суму через `toFixed(2)`", en: "Add the prices as fractions and show the sum with `toFixed(2)`" }
              why:
                uk: "`toFixed` лише форматує текст для показу. Сума лишається дробом із похибкою, і наступне обчислення з нею (порівняння, множення) її успадкує."
                en: "`toFixed` only formats text for display. The sum stays a fraction with an error, and the next calculation with it (a comparison, a multiplication) inherits that error."
            - id: floor-end
              text: { uk: "Додати ціни як дроби, помножити на 100 і обрізати через `Math.floor`", en: "Add the prices as fractions, multiply by 100 and cut down with `Math.floor`" }
              why:
                uk: "Дріб на зразок `578.3` після множення може стати `57829.99999999999`, і `Math.floor` загубить копійку."
                en: "A fraction like `578.3` can become `57829.99999999999` after multiplying, and `Math.floor` loses a kopiyka."
          correct: [each-first]
        explanation:
          uk: "Гроші рахують цілими мінімальними одиницями (копійками): цілі числа до 2⁵³ додаються точно. Дробом гроші лише показують — наприкінці, через форматування. Тема — js-12-05."
          en: "Money is counted in whole minor units (kopiykas): whole numbers up to 2⁵³ add exactly. Money is shown as a fraction only at the end, through formatting. Topic: js-12-05."
      - id: identity-key
        from: js-04-07-reference-identity
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const seen = new Map();
          const key = { room: "A" };
          seen.set(key, 1);
          console.log(seen.has(key), seen.has({ room: "A" }), seen.size);
        verify: { logs: ["true false 1"] }
        answer:
          type: choice
          options:
            - id: right
              code: "true false 1"
            - id: by-content
              code: "true true 1"
              why:
                uk: "`{ room: \"A\" }` у виклику `has` — новий об’єкт, хоч і з тим самим вмістом. Ключ-об’єкт знаходиться лише за тим самим посиланням."
                en: "`{ room: \"A\" }` in the `has` call is a new object, even with the same content. An object key is found only through the same reference."
            - id: never
              code: "false false 1"
              why:
                uk: "Те саме посилання `key` знаходить свій запис: ідентичність збігається."
                en: "The same reference `key` finds its entry: the identity matches."
          correct: [right]
        explanation:
          uk: "Два об’єкти з однаковим вмістом — різні значення; два імені одного об’єкта — одне значення. Тому ключем кешу роблять текст чи число, а не щойно створений об’єкт. Тема — js-04-07."
          en: "Two objects with the same content are different values; two names of one object are one value. That is why a cache key is text or a number, not a freshly created object. Topic: js-04-07."
      - id: tdz-in-cycle
        from: js-02-07-var-hoisting-tdz
        prompt:
          uk: "Чому в циклі імпортів читання `export const` з модуля, що ще виконується, дає `ReferenceError`, а не `undefined`?"
          en: "Why does reading an `export const` of a module that is still running, inside an import cycle, give a `ReferenceError` rather than `undefined`?"
        answer:
          type: choice
          options:
            - id: tdz
              text: { uk: "Змінна `const` існує від початку модуля, але до свого рядка перебуває в temporal dead zone: читати її не можна", en: "A `const` variable exists from the start of the module, but until its line it is in the temporal dead zone: it cannot be read" }
            - id: missing
              text: { uk: "Бо такого експорту ще не існує, як і назви, якої немає взагалі", en: "Because such an export does not exist yet, like a name that does not exist at all" }
              why:
                uk: "Повідомлення інше — `Cannot access 'X' before initialization`, а не `X is not defined`: назва вже зареєстрована, просто ще не ініціалізована."
                en: "The message is different — `Cannot access 'X' before initialization`, not `X is not defined`: the name is already registered, just not initialized yet."
            - id: hoisted
              text: { uk: "Насправді дало б `undefined`: `const` піднімається, як `var`", en: "It would actually give `undefined`: `const` is hoisted like `var`" }
              why:
                uk: "`undefined` до свого рядка дає лише `var`. `let`, `const` і `class` до свого рядка кидають `ReferenceError`."
                en: "Only `var` gives `undefined` before its line. `let`, `const` and `class` throw a `ReferenceError` before their line."
          correct: [tdz]
        explanation:
          uk: "Імпорт — це жива прив’язка до змінної іншого модуля, тож правило TDZ діє і через межу модулів. Саме тому порядок імпортів «вмикає» чи «вимикає» помилку. Тема — js-02-07 і js-13-08."
          en: "An import is a live binding to another module’s variable, so the TDZ rule applies across the module boundary. That is exactly why the import order switches the error on or off. Topic: js-02-07 and js-13-08."
