id: js-18-02-unseen-debug
unit: JS-18
title:
  uk: "Рубіж: налагодження незнайомого коду"
  en: "Gate: unseen debugging"
kind: assessment
minutes: 40
contentVersion: 1
purpose:
  uk: "Перша перевірка рубежу: у модулі прокату інструментів, якого ти ще не бачив, без підказок до розв’язку знайти чотири дефекти за доказами — breakpoints у зібраному коді через source map, стек викликів у картці помилки й тести, що падають, — виправити їх, не зламавши правильної поведінки, і закріпити тестами на межі, де дефект з’являється."
  en: "The first check of the gate: in a tool-lending module you have not seen, find four defects with no hints towards the solution, from evidence — breakpoints in the built code through a source map, the call stack in the error card and failing tests — repair them without breaking correct behavior, and pin them down with tests on the boundary where each appears."
objectives:
  - uk: "Без підказок діагностувати незнайомі дефекти синтетичного модуля прокату інструментів за breakpoints у зібраному коді з source map, стеком викликів і тестами, що падають."
    en: "Diagnose, without hints, unseen defects in a synthetic tool-lending module using breakpoints in the source-mapped build, the stack trace and failing assertions."
  - uk: "Виправити кожен дефект, не зламавши поведінки, що вже правильна, і додати перевірку на межі, яка спіймала б його."
    en: "Repair each defect without breaking passing behavior and add a boundary assertion that would have caught it."
prerequisites: [js-18-01-gate-review]
subskills:
  - { family: P-04, skill: "assertions/boundaries", depth: assess }
  - { family: P-04, skill: "breakpoints/source maps", depth: assess }
glossary: []

blocks:
  - id: how-it-works
    kind: explanation
    title:
      uk: "Як проходить ця перевірка"
      en: "How this check works"
    body:
      uk: |
        Сусідський прокат інструментів веде облік у кількох модулях JavaScript. Скарг чотири, і всі вони — про код, якого ти ще не бачив. Три частини:

        1. **Зібраний код у браузері.** На своєму комп’ютері збираєш модуль застав і прострочень через esbuild із source map і шукаєш обидва дефекти breakpoints у **власних** файлах, хоча браузер виконує мінімізований `app.js`.
        2. **Ремонт у пісочниці.** Той самий модуль: виправляєш обидва дефекти й пишеш тести, які їх ловлять.
        3. **Ще два дефекти.** Звіт, що не запускається після впорядкування імпортів, і кеш, який нічого не пам’ятає.

        Підказок, що ведуть до розв’язку, немає. Можна перечитувати попередні уроки й документацію — так працюють і професіонали. Перевірки дивляться на **поведінку**: що повертають твої функції на їхніх власних даних і чи ловлять твої тести дефектні версії модуля. Якщо перевірка не проходить, її назва й повідомлення кажуть, *що* очікувалося, а не *як* це написати.

        Порядок роботи той самий, що й завжди: спершу доказ (значення на паузі, рядок у картці помилки, тест, що падає), потім гіпотеза, потім найменша зміна, потім знову доказ.
      en: |
        A neighbourhood tool library keeps its records in a few JavaScript modules. There are four complaints, and all of them are about code you have not seen. Three parts:

        1. **The built code in the browser.** On your computer you build the deposits-and-overdue module with esbuild and a source map, and hunt both defects with breakpoints in **your own** files, even though the browser runs a minified `app.js`.
        2. **The repair in the sandbox.** The same module: you repair both defects and write tests that catch them.
        3. **Two more defects.** A report that no longer starts after its imports were tidied up, and a cache that remembers nothing.

        There are no hints that lead to the solution. You may reread earlier lessons and the documentation — professionals work that way too. The checks look at **behavior**: what your functions return on the checks’ own data and whether your tests catch defective versions of the module. If a check fails, its title and message say *what* was expected, not *how* to write it.

        The working order is the usual one: evidence first (a value at a pause, a line in the error card, a failing test), then a hypothesis, then the smallest change, then evidence again.

  - id: find-in-build
    kind: local-task
    runtime: local-web
    title:
      uk: "Знайди дефекти в зібраному коді"
      en: "Find the defects in the built code"
    intro:
      uk: |
        Ти працюєш у новій теці `~/js-course/lending-lab`. Потрібні доступ до інтернету (щоб установити esbuild), Google Chrome і **два вікна термінала**: в одному працює сервер, в іншому — усе інше. Команди npm однакові в macOS, Linux і Windows PowerShell; де команда відрізняється, указано обидві.

        Скарги прокату на ранок 10 березня 2026 року: у скриньці застав **578.30 грн**, а звіт показує інше; мийку високого тиску й бетонозмішувач уже повернули, але звіт вважає їх простроченими. Записуй докази у файл `EVIDENCE.md` поза текою проєкту, наприклад у `~/js-course/scratch`.
      en: |
        You work in a new folder, `~/js-course/lending-lab`. You need internet access (to install esbuild), Google Chrome and **two terminal windows**: a server runs in one, everything else in the other. The npm commands are the same on macOS, Linux and Windows PowerShell; where a command differs, both are given.

        The library’s complaints on the morning of 10 March 2026: the deposit box holds **578.30 UAH**, but the report shows something else; the pressure washer and the cement mixer have already been returned, but the report treats them as overdue. Write your evidence into a file `EVIDENCE.md` outside the project folder, for example in `~/js-course/scratch`.
    tools:
      - name: "Node.js"
        version: "22.13 or newer (checked with 25.2.1)"
      - name: "npm"
        version: "comes with Node.js (checked with 11.6.2)"
      - name: "esbuild"
        version: "installed by this task (checked with 0.28.2)"
      - name: "Google Chrome"
        version: "current desktop version"
    steps:
      - text:
          uk: "Створи теку проєкту з текою `src` усередині, ініціалізуй npm і встанови bundler. У macOS і Linux:"
          en: "Create the project folder with a `src` folder inside, initialize npm and install the bundler. On macOS and Linux:"
        command: "mkdir -p ~/js-course/lending-lab/src\ncd ~/js-course/lending-lab\nnpm init -y\nnpm install --save-dev esbuild"
        expect:
          uk: "Останні рядки — `added 2 packages, and audited 3 packages in …` і `found 0 vulnerabilities`. У Windows PowerShell першу команду заміни на `New-Item -ItemType Directory -Force ~/js-course/lending-lab/src`, решта — ті самі."
          en: "The last lines are `added 2 packages, and audited 3 packages in …` and `found 0 vulnerabilities`. In Windows PowerShell replace the first command with `New-Item -ItemType Directory -Force ~/js-course/lending-lab/src`; the rest are the same."
      - text:
          uk: |
            Створи в редакторі п’ять файлів. `src/loans.js` — облік прокату:

            ```js
            // src/loans.js: the loans of the neighbourhood tool library on 10 March 2026.
            // Deposits are entered in hryvnias, as the form shows them.
            export const TODAY = "2026-03-10";

            export const LOANS = [
              { id: "L-01", tool: "Drill", depositUah: 150.4, dueDate: "2026-03-08", returnedOn: null },
              { id: "L-02", tool: "Ladder", depositUah: 80.1, dueDate: "2026-03-12", returnedOn: null },
              { id: "L-03", tool: "Sewing machine", depositUah: 45.3, dueDate: "2026-03-10", returnedOn: null },
              { id: "L-04", tool: "Pressure washer", depositUah: 99.9, dueDate: "2026-03-05", returnedOn: "2026-03-07" },
              { id: "L-05", tool: "Jigsaw", depositUah: 120.6, dueDate: "2026-03-09", returnedOn: null },
              { id: "L-06", tool: "Tent", depositUah: 60.2, dueDate: "2026-03-14", returnedOn: null },
              { id: "L-07", tool: "Cement mixer", depositUah: 200.1, dueDate: "2026-03-01", returnedOn: "2026-03-02" },
              { id: "L-08", tool: "Projector", depositUah: 35.7, dueDate: "2026-03-11", returnedOn: null },
              { id: "L-09", tool: "Garden shredder", depositUah: 15.3, dueDate: "2026-03-20", returnedOn: null },
              { id: "L-10", tool: "Tile cutter", depositUah: 70.7, dueDate: "2026-03-15", returnedOn: null },
            ];
            ```

            `src/lending.js` — правила, у яких ховаються обидва дефекти:

            ```js
            // src/lending.js: the rules of the tool library — pure functions, no page and no storage.
            // A loan: { id: "L-01", tool: "…", depositUah: 150.4, dueDate: "YYYY-MM-DD", returnedOn: null | "YYYY-MM-DD" }.

            // The deposits held for loans that are not returned yet, in kopiykas (a whole number).
            export function heldDepositsMinor(loans) {
              let total = 0;
              for (const loan of loans) {
                if (loan.returnedOn === null) total += loan.depositUah;
              }
              return Math.floor(total * 100);
            }

            // Records a return: a new list in which the loan with this id has returnedOn set to day.
            export function returnTool(loans, id, day) {
              return loans.map((loan) => (loan.id === id ? { ...loan, returnedOn: day } : loan));
            }

            // A loan is overdue when it is not returned and its due date is before today.
            // A loan due today is not overdue yet.
            export function isOverdue(loan, today) {
              return !loan.returned && loan.dueDate < today;
            }

            export function overdueLoans(loans, today) {
              return loans.filter((loan) => isOverdue(loan, today));
            }
            ```

            `src/main.js` — показує звіт на сторінці:

            ```js
            // src/main.js: shows the morning report on the page.
            import { heldDepositsMinor, overdueLoans } from "./lending.js";
            import { LOANS, TODAY } from "./loans.js";

            const held = heldDepositsMinor(LOANS);
            document.querySelector("#held").textContent = `${Math.trunc(held / 100)}.${String(held % 100).padStart(2, "0")} UAH`;

            const list = document.querySelector("#overdue");
            for (const loan of overdueLoans(LOANS, TODAY)) {
              const item = document.createElement("li");
              item.textContent = loan.tool;
              list.append(item);
            }
            ```

            `src/index.html`:

            ```html
            <!doctype html>
            <html lang="en">
              <head>
                <meta charset="utf-8" />
                <title>Tool library</title>
              </head>
              <body>
                <h1>Tool library</h1>
                <p>Deposits held: <output id="held"></output></p>
                <h2>Overdue</h2>
                <ul id="overdue"></ul>
                <script src="app.js"></script>
              </body>
            </html>
            ```

            І `build.mjs` у корені проєкту:

            ```js
            // build.mjs: bundles src/main.js and its imports into dist/app.js with a source map.
            import { copyFileSync } from "node:fs";
            import * as esbuild from "esbuild";

            await esbuild.build({
              entryPoints: ["src/main.js"],
              bundle: true,
              minify: true,
              sourcemap: true,
              outfile: "dist/app.js",
            });
            copyFileSync("src/index.html", "dist/index.html");
            console.log("Built dist/app.js with a source map");
            ```

            Додай скрипти й збери проєкт:
          en: |
            Create five files in the editor. `src/loans.js` — the library’s records:

            ```js
            // src/loans.js: the loans of the neighbourhood tool library on 10 March 2026.
            // Deposits are entered in hryvnias, as the form shows them.
            export const TODAY = "2026-03-10";

            export const LOANS = [
              { id: "L-01", tool: "Drill", depositUah: 150.4, dueDate: "2026-03-08", returnedOn: null },
              { id: "L-02", tool: "Ladder", depositUah: 80.1, dueDate: "2026-03-12", returnedOn: null },
              { id: "L-03", tool: "Sewing machine", depositUah: 45.3, dueDate: "2026-03-10", returnedOn: null },
              { id: "L-04", tool: "Pressure washer", depositUah: 99.9, dueDate: "2026-03-05", returnedOn: "2026-03-07" },
              { id: "L-05", tool: "Jigsaw", depositUah: 120.6, dueDate: "2026-03-09", returnedOn: null },
              { id: "L-06", tool: "Tent", depositUah: 60.2, dueDate: "2026-03-14", returnedOn: null },
              { id: "L-07", tool: "Cement mixer", depositUah: 200.1, dueDate: "2026-03-01", returnedOn: "2026-03-02" },
              { id: "L-08", tool: "Projector", depositUah: 35.7, dueDate: "2026-03-11", returnedOn: null },
              { id: "L-09", tool: "Garden shredder", depositUah: 15.3, dueDate: "2026-03-20", returnedOn: null },
              { id: "L-10", tool: "Tile cutter", depositUah: 70.7, dueDate: "2026-03-15", returnedOn: null },
            ];
            ```

            `src/lending.js` — the rules where both defects hide:

            ```js
            // src/lending.js: the rules of the tool library — pure functions, no page and no storage.
            // A loan: { id: "L-01", tool: "…", depositUah: 150.4, dueDate: "YYYY-MM-DD", returnedOn: null | "YYYY-MM-DD" }.

            // The deposits held for loans that are not returned yet, in kopiykas (a whole number).
            export function heldDepositsMinor(loans) {
              let total = 0;
              for (const loan of loans) {
                if (loan.returnedOn === null) total += loan.depositUah;
              }
              return Math.floor(total * 100);
            }

            // Records a return: a new list in which the loan with this id has returnedOn set to day.
            export function returnTool(loans, id, day) {
              return loans.map((loan) => (loan.id === id ? { ...loan, returnedOn: day } : loan));
            }

            // A loan is overdue when it is not returned and its due date is before today.
            // A loan due today is not overdue yet.
            export function isOverdue(loan, today) {
              return !loan.returned && loan.dueDate < today;
            }

            export function overdueLoans(loans, today) {
              return loans.filter((loan) => isOverdue(loan, today));
            }
            ```

            `src/main.js` — shows the report on the page:

            ```js
            // src/main.js: shows the morning report on the page.
            import { heldDepositsMinor, overdueLoans } from "./lending.js";
            import { LOANS, TODAY } from "./loans.js";

            const held = heldDepositsMinor(LOANS);
            document.querySelector("#held").textContent = `${Math.trunc(held / 100)}.${String(held % 100).padStart(2, "0")} UAH`;

            const list = document.querySelector("#overdue");
            for (const loan of overdueLoans(LOANS, TODAY)) {
              const item = document.createElement("li");
              item.textContent = loan.tool;
              list.append(item);
            }
            ```

            `src/index.html`:

            ```html
            <!doctype html>
            <html lang="en">
              <head>
                <meta charset="utf-8" />
                <title>Tool library</title>
              </head>
              <body>
                <h1>Tool library</h1>
                <p>Deposits held: <output id="held"></output></p>
                <h2>Overdue</h2>
                <ul id="overdue"></ul>
                <script src="app.js"></script>
              </body>
            </html>
            ```

            And `build.mjs` in the project root:

            ```js
            // build.mjs: bundles src/main.js and its imports into dist/app.js with a source map.
            import { copyFileSync } from "node:fs";
            import * as esbuild from "esbuild";

            await esbuild.build({
              entryPoints: ["src/main.js"],
              bundle: true,
              minify: true,
              sourcemap: true,
              outfile: "dist/app.js",
            });
            copyFileSync("src/index.html", "dist/index.html");
            console.log("Built dist/app.js with a source map");
            ```

            Add the scripts and build the project:
        command: "npm pkg set \"scripts.build=node build.mjs\" \"scripts.serve=esbuild --servedir=dist --serve=127.0.0.1:8129\"\nnpm run build"
        expect:
          uk: |
            ```text
            > lending-lab@1.0.0 build
            > node build.mjs

            Built dist/app.js with a source map
            ```

            У теці `dist` тепер `app.js`, `app.js.map` і `index.html`. Увесь код у `dist/app.js` — один довгий рядок.
          en: |
            ```text
            > lending-lab@1.0.0 build
            > node build.mjs

            Built dist/app.js with a source map
            ```

            The `dist` folder now holds `app.js`, `app.js.map` and `index.html`. All the code in `dist/app.js` is one long line.
      - text:
          uk: "Запусти сервер і **залиш це вікно термінала відкритим**. Відкрий у Chrome адресу, яку він надрукує."
          en: "Start the server and **leave this terminal window open**. Open the address it prints in Chrome."
        command: "npm run serve"
        expect:
          uk: "` > Local: http://127.0.0.1:8129/`. Сторінка показує `Deposits held: 578.29 UAH`, а в списку Overdue — Drill, Pressure washer, Jigsaw, Cement mixer. Обидві скарги підтверджено."
          en: "` > Local: http://127.0.0.1:8129/`. The page shows `Deposits held: 578.29 UAH`, and the Overdue list holds Drill, Pressure washer, Jigsaw, Cement mixer. Both complaints are confirmed."
      - text:
          uk: |
            Тепер — розслідування, без підказок. Відкрий DevTools (F12, у macOS Cmd + Option + I) → **Sources**, натисни Cmd + P (Windows/Linux: Ctrl + P) і відкрий `lending.js`. Став breakpoints у тих рядках, де, на твою думку, значення може піти не так, і перезавантаж сторінку. Під час паузи читай **Scope** і обчислюй вирази на вкладці **Console**: вона виконує їх у контексті паузи.

            Запиши в `EVIDENCE.md` для кожної скарги:

            - файл і рядок, де значення вперше відрізняється від правильного;
            - що ти побачив на паузі (значення змінних або результат виразу в Console);
            - одним реченням — причину.
          en: |
            Now the investigation, with no hints. Open DevTools (F12, on macOS Cmd + Option + I) → **Sources**, press Cmd + P (Windows/Linux: Ctrl + P) and open `lending.js`. Set breakpoints on the lines where you think a value may go wrong, and reload the page. While paused, read **Scope** and evaluate expressions in the **Console** tab: it runs them in the context of the pause.

            For each complaint write into `EVIDENCE.md`:

            - the file and line where the value first differs from the correct one;
            - what you saw at the pause (variable values or the result of an expression in the Console);
            - one sentence with the cause.
        expect:
          uk: "Пауза зупиняє виконання в **твоєму** `src/lending.js`, хоча браузер завантажив лише `app.js`. У Scope змінні можуть мати короткі мінімізовані назви, наприклад `e` чи `t` — це ті самі значення, що в твоєму коді."
          en: "The pause stops execution in **your** `src/lending.js`, even though the browser loaded only `app.js`. In Scope the variables may have short minified names such as `e` or `t` — they are the same values as in your code."
      - text:
          uk: "Прибери breakpoints, натисни Resume (F8) і зупини сервер у першому вікні: Ctrl + C. Код у цій теці не виправляй — ремонт буде в пісочниці, а ця тека лишиться доказом того, що ти знайшов."
          en: "Remove the breakpoints, press Resume (F8) and stop the server in the first window: Ctrl + C. Do not repair the code in this folder — the repair happens in the sandbox, and this folder stays as the evidence of what you found."
    verify:
      - id: paused-in-source
        text:
          uk: "Breakpoint у `src/lending.js` зупинив виконання в моєму файлі, хоча браузер виконував `dist/app.js`."
          en: "A breakpoint in `src/lending.js` paused execution in my file, although the browser was running `dist/app.js`."
      - id: deposit-evidence
        text:
          uk: "Для застав я записав рядок, де сума в копійках стає неправильною, і значення, які бачив на паузі."
          en: "For the deposits I wrote down the line where the sum in kopiykas becomes wrong and the values I saw at the pause."
      - id: overdue-evidence
        text:
          uk: "Для прострочень я записав, які поля має позика на паузі в `isOverdue` і що саме читає умова."
          en: "For the overdue loans I wrote down which fields the loan has at the pause in `isOverdue` and what exactly the condition reads."
      - id: own-work
        text:
          uk: "Я знайшов обидва дефекти сам, за доказами з DevTools, без чужого готового розв’язку."
          en: "I found both defects myself, from DevTools evidence, without someone else’s finished solution."
    troubleshooting:
      - problem:
          uk: "`npm run serve` пише `bind: address already in use`"
          en: "`npm run serve` prints `bind: address already in use`"
        fix:
          uk: "Порт 8129 уже зайнятий іншою програмою. Зміни його на інший від 1024 до 65535: `npm pkg set \"scripts.serve=esbuild --servedir=dist --serve=127.0.0.1:8130\"` і запусти знову."
          en: "Port 8129 is already used by another program. Change it to another one between 1024 and 65535: `npm pkg set \"scripts.serve=esbuild --servedir=dist --serve=127.0.0.1:8130\"` and start again."
      - problem:
          uk: "Cmd/Ctrl + P у Sources не знаходить `lending.js`"
          en: "Cmd/Ctrl + P in Sources does not find `lending.js`"
        fix:
          uk: "DevTools не отримали source map. Перевір, що в `build.mjs` є `sourcemap: true`, що в `dist` лежить `app.js.map`, і перезавантаж сторінку з відкритими DevTools."
          en: "DevTools did not get the source map. Check that `build.mjs` has `sourcemap: true`, that `dist` contains `app.js.map`, and reload the page with DevTools open."
      - problem:
          uk: "Сторінка порожня: ні суми, ні списку"
          en: "The page is empty: no sum and no list"
        fix:
          uk: "Бандл не завантажився або впав. Відкрий Console: 404 для `app.js` означає, що збірки не було (`npm run build`); помилка з назвою файла з `src` указує на рядок у твоєму модулі — завдяки source map."
          en: "The bundle did not load or crashed. Open the Console: a 404 for `app.js` means the build did not happen (`npm run build`); an error naming a file in `src` points at a line in your module — thanks to the source map."
      - problem:
