id: js-18-05-explain-boundaries
unit: JS-18
title:
  uk: "Рубіж: поясни межі"
  en: "Gate: explain the boundaries"
kind: assessment
minutes: 25
contentVersion: 1
purpose:
  uk: "Остання перевірка рубежу: шість меж, на яких найчастіше помиляються навіть досвідчені розробники, — що доводить mock, TDZ проти `undefined`, завантаження ES-модулів і CommonJS, межі cookie й сховища, кого захищає CORS і чому не можна покладатися на фіналізатор. Для кожної ти без підказок називаєш, що станеться в незнайомому випадку, і обґрунтовуєш це двома реченнями."
  en: "The last check of the gate: six boundaries where even experienced developers often go wrong — what a mock proves, TDZ versus `undefined`, how ES modules and CommonJS load, cookie versus storage scope, whom CORS protects, and why a finalizer cannot be relied on. For each you state, with no hints, what happens in an unseen case and justify it in two sentences."
objectives:
  - uk: "Пояснити кожну межу на незнайомому контрприкладі: mock проти справжнього доказу, TDZ проти `undefined`, завантаження ESM проти CommonJS, межі cookie проти сховища, CORS проти захисту на сервері й чому код не має покладатися на те, що фіналізатор виконається."
    en: "Explain each boundary with an unseen counterexample: mock versus real evidence, TDZ versus undefined, ESM versus CommonJS loading, cookie versus storage scope, CORS versus server-side protection, and why code must not rely on a finalizer running."
prerequisites: [js-18-04-tests-review-writeup]
subskills:
  - { family: P-04, skill: "mocks vs actual evidence", depth: assess }
glossary: []

blocks:
  - id: how-to-answer
    kind: explanation
    title:
      uk: "Шість меж, два речення на кожну"
      en: "Six boundaries, two sentences each"
    body:
      uk: |
        У кожному з шести випадків нижче є фрагмент коду чи сценарій, якого в курсі не було. Для кожного:

        1. Обери **результат** — одне з точних значень, перелічених у `answers.js`.
        2. Напиши **обґрунтування** щонайменше з двох речень: *що* відбувається і *чому* — механізм, а не переказ результату. В обґрунтуванні назви кодове слово, вказане в квадратних дужках над пунктом.
        3. Те, що виконується в браузері, — запусти: встав фрагмент у `index.js` і натисни «Запустити». Решту перевір думкою або локально.

        Перевірки читають лише `answers.js`: точний результат і форму обґрунтування. Чи справді воно пояснює механізм, перевірка не встановить — це твоя частина роботи, і саме вона знадобиться на співбесіді та в коді.
      en: |
        Each of the six cases below has a snippet or a scenario the course has not had. For each:

        1. Choose the **outcome** — one of the exact values listed in `answers.js`.
        2. Write a **justification** of at least two sentences: *what* happens and *why* — the mechanism, not a retelling of the outcome. Name in the justification the code word given in square brackets above the item.
        3. Run what runs in the browser: paste the snippet into `index.js` and press “Run”. Check the rest by reasoning or locally.

        The checks read only `answers.js`: the exact outcome and the form of the justification. Whether it really explains the mechanism is something a check cannot establish — that is your part of the work, and it is exactly what you will need in an interview and in code.

  - id: explain-items
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: explain-items
    entry: index.js
    editable: [answers.js, index.js]
    capabilities: { network: lab }
    title:
      uk: "Шість меж середовища виконання й вебу"
      en: "Six runtime and web boundaries"
    instructions:
      uk: |
        **1. `mock` — що доводить тест із підробкою.** Тест показу кімнат підміняє `fetch` через `mockFetch` відповіддю `[{ "id": "r-1", "name": "Linden" }]` і перевіряє, що в списку один пункт. Учора сервер почав відповідати `{ "rooms": [...] }`. Тест запускають знову, а користувач відкриває справжній застосунок. Що станеться? *(лише міркування)*

        **2. `tdz` — TDZ проти `undefined`.** Що надрукує модуль? *(можна запустити)*

        ```js
        console.log(total);
        var total = 5;
        console.log(limit);
        let limit = 3;
        ```

        **3. `modules` — ESM проти CommonJS.** У Node.js запустили `node main.mjs`, потім `node main.cjs`. Що надрукують вони по черзі? *(запусти локально, якщо хочеш перевірити)*

        ```js
        // counter.mjs
        export let count = 0;
        export function increment() {
          count += 1;
        }

        // main.mjs
        import { count, increment } from "./counter.mjs";
        increment();
        console.log(count);
        ```

        ```js
        // counter.cjs
        let count = 0;
        module.exports = {
          count,
          increment() {
            count += 1;
          },
        };

        // main.cjs
        const { count, increment } = require("./counter.cjs");
        increment();
        console.log(count);
        ```

        **4. `storage` — межі cookie й сховища.** Сторінка `http://localhost:5173` записує `localStorage.setItem("theme", "dark")` і отримує від свого сервера host-only cookie `session=abc; Path=/` (без `Domain`). Потім у тому самому браузері відкривають `http://localhost:8080`. Що з цього бачить сторінка на `8080` чи отримує її сервер? *(лише міркування)*

        **5. `cors` — кого захищає CORS.** Сторінка на `https://quiz.example` виконує `fetch("https://grades.example/api/score", { method: "POST", body: new URLSearchParams({ score: "100" }) })`. Сервер `grades.example` не надсилає `Access-Control-Allow-Origin`, а сам запит ніяк не перевіряє. Що відбувається з запитом і відповіддю? *(частину можна запустити: пісочниця має origin `null`, а `/lab/cors/closed` відповідає без цього заголовка, `/lab/cors/open` — з ним)*

        **6. `finalizer` — коли виконається фіналізатор.** Коли з’явиться `cleaned draft-1`? *(можна запустити)*

        ```js
        const registry = new FinalizationRegistry((label) => console.log("cleaned", label));
        let draft = { text: "x".repeat(100000) };
        registry.register(draft, "draft-1");
        draft = null;
        console.log("dropped");
        ```
      en: |
        **1. `mock` — what a test with a fake proves.** A test of the room list replaces `fetch` through `mockFetch` with the answer `[{ "id": "r-1", "name": "Linden" }]` and checks that the list has one item. Yesterday the server started answering `{ "rooms": [...] }`. The test runs again, and a user opens the real app. What happens? *(reasoning only)*

        **2. `tdz` — TDZ versus `undefined`.** What does the module print? *(runnable)*

        ```js
        console.log(total);
        var total = 5;
        console.log(limit);
        let limit = 3;
        ```

        **3. `modules` — ESM versus CommonJS.** In Node.js, `node main.mjs` runs, then `node main.cjs`. What do they print, in turn? *(run it locally if you want to check)*

        ```js
        // counter.mjs
        export let count = 0;
        export function increment() {
          count += 1;
        }

        // main.mjs
        import { count, increment } from "./counter.mjs";
        increment();
        console.log(count);
        ```

        ```js
        // counter.cjs
        let count = 0;
        module.exports = {
          count,
          increment() {
            count += 1;
          },
        };

        // main.cjs
        const { count, increment } = require("./counter.cjs");
        increment();
        console.log(count);
        ```

        **4. `storage` — cookie versus storage scope.** The page `http://localhost:5173` writes `localStorage.setItem("theme", "dark")` and receives from its server a host-only cookie `session=abc; Path=/` (no `Domain`). Then `http://localhost:8080` is opened in the same browser. Which of these does the page on `8080` see, or its server receive? *(reasoning only)*

        **5. `cors` — whom CORS protects.** A page on `https://quiz.example` runs `fetch("https://grades.example/api/score", { method: "POST", body: new URLSearchParams({ score: "100" }) })`. The server `grades.example` sends no `Access-Control-Allow-Origin` and does not check the request in any way. What happens to the request and the response? *(partly runnable: the sandbox has the origin `null`, and `/lab/cors/closed` answers without that header, `/lab/cors/open` with it)*

        **6. `finalizer` — when a finalizer runs.** When does `cleaned draft-1` appear? *(runnable)*

        ```js
        const registry = new FinalizationRegistry((label) => console.log("cleaned", label));
        let draft = { text: "x".repeat(100000) };
        registry.register(draft, "draft-1");
        draft = null;
        console.log("dropped");
        ```
