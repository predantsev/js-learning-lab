  - id: after-the-check
    kind: review
    title:
      uk: "Після рубежу: межі, які варто пам’ятати"
      en: "After the gate: boundaries worth remembering"
    items:
      - id: cors-reader
        from: js-16-04-same-origin-cors
        prompt:
          uk: "Колега пропонує «захистити API від інших сайтів», додавши на сервер перевірку CORS. Що з цього правда?"
          en: "A colleague suggests “protecting the API from other sites” by adding a CORS check to the server. Which of these is true?"
        answer:
          type: choice
          options:
            - id: reader
              text: { uk: "CORS-заголовки кажуть браузеру, кому віддати відповідь; запити з `curl` чи іншого сервера вони не зупиняють, тож захист — автентифікація й перевірка на сервері", en: "CORS headers tell the browser whom to hand the response to; they do not stop requests from `curl` or another server, so protection is authentication and checks on the server" }
            - id: firewall
              text: { uk: "Без `Access-Control-Allow-Origin` запит до сервера не дійде", en: "Without `Access-Control-Allow-Origin` the request never reaches the server" }
              why:
                uk: "Простий запит браузер надсилає одразу; заголовок у **відповіді** вирішує лише, чи побачить її скрипт."
                en: "The browser sends a simple request right away; the header in the **response** only decides whether the script sees it."
            - id: no-cors
              text: { uk: "Досить, щоб клієнт додав `mode: \"no-cors\"`, і все запрацює", en: "It is enough for the client to add `mode: \"no-cors\"`, and everything works" }
              why:
                uk: "`no-cors` дає непрозору відповідь, тіло якої скрипт прочитати не може: помилки більше немає, але й даних теж."
                en: "`no-cors` gives an opaque response whose body the script cannot read: the error is gone, but so is the data."
          correct: [reader]
        explanation:
          uk: "Same-origin policy та CORS — правила браузера про **читання** відповідей іншого origin. Вони захищають користувача в браузері, а не сервер. Тема — js-16-04."
          en: "The same-origin policy and CORS are browser rules about **reading** responses of another origin. They protect the user in the browser, not the server. Topic: js-16-04."
      - id: tdz-default
        from: js-02-10-debug-tdz-and-defaults
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          function greet(name = fallback, fallback = "guest") {
            return name;
          }

          try {
            console.log(greet("Ola"));
            console.log(greet());
          } catch (error) {
            console.log(error.name);
          }
        verify: { logs: ["Ola", "ReferenceError"] }
        answer:
          type: choice
          options:
            - id: right
              text: { uk: "`Ola`, потім `ReferenceError`", en: "`Ola`, then `ReferenceError`" }
            - id: guest
              text: { uk: "`Ola`, потім `guest`", en: "`Ola`, then `guest`" }
              why:
                uk: "Параметри ініціалізуються зліва направо. Коли `name` бере значення за замовчуванням, `fallback` ще в TDZ."
                en: "Parameters are initialized left to right. When `name` takes its default, `fallback` is still in the TDZ."
            - id: undefined
              text: { uk: "`Ola`, потім `undefined`", en: "`Ola`, then `undefined`" }
              why:
                uk: "Параметр поводиться як `let`, а не як `var`: читання до ініціалізації кидає помилку, а не дає `undefined`."
                en: "A parameter behaves like `let`, not like `var`: reading it before initialization throws instead of giving `undefined`."
          correct: [right]
        explanation:
          uk: "Значення параметрів за замовчуванням обчислюються по черзі, і пізніший параметр до свого місця перебуває в TDZ. Перший виклик значення за замовчуванням не потребує, тож працює. Тема — js-02-10."
          en: "Parameter defaults are evaluated in order, and a later parameter is in the TDZ until its place. The first call needs no default, so it works. Topic: js-02-10."
      - id: cjs-load
        from: js-07-08-cjs-and-load-failures
        prompt:
          uk: "Чим `require(\"./money.js\")` у CommonJS відрізняється від `import { total } from \"./money.js\"` в ES-модулі за **часом** завантаження?"
          en: "How does `require(\"./money.js\")` in CommonJS differ from `import { total } from \"./money.js\"` in an ES module in **when** it loads?"
        answer:
          type: choice
          options:
            - id: timing
              text: { uk: "`require` — звичайний виклик функції, що виконується, коли до нього дійде черга; `import` обробляється до виконання модуля, тож усі залежності завантажено ще до його першого рядка", en: "`require` is an ordinary function call that runs when its turn comes; `import` is processed before the module runs, so all dependencies are loaded before its first line" }
            - id: same
              text: { uk: "Нічим: це два записи того самого", en: "Nothing: they are two ways of writing the same thing" }
              why:
                uk: "Вони відрізняються і часом, і результатом: `require` повертає об’єкт, з якого копіюють значення, а `import` — живу прив’язку, підготовлену до виконання."
                en: "They differ in both timing and result: `require` returns an object values are copied from, while `import` gives a live binding prepared before running."
            - id: lazy-import
              text: { uk: "`import` завантажує файл, лише коли код уперше звертається до `total`", en: "`import` loads the file only when the code first accesses `total`" }
              why:
                uk: "Статичний `import` завантажує й виконує залежності до модуля. Відкладене завантаження — це `import()`, яке повертає проміс."
                en: "A static `import` loads and runs the dependencies before the module. Deferred loading is `import()`, which returns a promise."
          correct: [timing]
        explanation:
          uk: "Статичні імпорти утворюють граф, який завантажується й зв’язується до виконання; `require` вплітається в хід виконання. Звідси й різниця в циклах та живих прив’язках. Тема — js-07-08."
          en: "Static imports form a graph that is loaded and linked before running; `require` is woven into the flow of execution. That is where the differences in cycles and live bindings come from. Topic: js-07-08."
      - id: cookie-scope
        from: js-16-03-cookies-storage-origins
        prompt:
          uk: "Які з цих даних браузер **сам** додає до кожного запиту на свій сайт? Обери всі."
          en: "Which of these does the browser **itself** attach to every request to its site? Pick all of them."
        answer:
          type: multi
          options:
            - id: cookie
              text: { uk: "Cookie, чиї межі (`Domain`, `Path`, `Secure`, `SameSite`) дозволяють цей запит", en: "Cookies whose scope (`Domain`, `Path`, `Secure`, `SameSite`) allows this request" }
            - id: httponly
              text: { uk: "Cookie з `HttpOnly`, хоч скрипт його й не бачить", en: "A cookie with `HttpOnly`, even though the script cannot see it" }
            - id: local
              text: { uk: "Значення з `localStorage`", en: "Values from `localStorage`" }
              why:
                uk: "Сховище лишається в браузері: на сервер воно потрапить, лише якщо скрипт сам покладе значення в запит."
                en: "Storage stays in the browser: it reaches the server only if a script puts the value into the request itself."
            - id: session
              text: { uk: "Значення з `sessionStorage`", en: "Values from `sessionStorage`" }
              why:
                uk: "Як і `localStorage`, `sessionStorage` з запитами не подорожує."
                en: "Like `localStorage`, `sessionStorage` does not travel with requests."
          correct: [cookie, httponly]
        explanation:
          uk: "Cookie — дані для **сервера**: браузер додає їх до запитів за правилами меж; `HttpOnly` лише ховає їх від скриптів. Сховище — дані для **сторінки** свого origin. Тема — js-16-03."
          en: "Cookies are data for the **server**: the browser attaches them to requests by their scope rules; `HttpOnly` only hides them from scripts. Storage is data for the **page** of its origin. Topic: js-16-03."
      - id: finalizer-rule
        from: js-13-10-weakref-resources-legacy
        prompt:
          uk: "Застосунок відкриває з’єднання з базою для кожного звіту й закриває його в колбеку `FinalizationRegistry`, коли об’єкт звіту стане непотрібним. Що з цим не так?"
          en: "An app opens a database connection for every report and closes it in a `FinalizationRegistry` callback once the report object is no longer needed. What is wrong with this?"
        answer:
          type: choice
          options:
            - id: unreliable
              text: { uk: "Колбек може виконатися значно пізніше або ніколи, тож з’єднання накопичуватимуться; закривати треба явно — у `finally` чи через `using`", en: "The callback may run much later or never, so connections will pile up; they must be closed explicitly — in `finally` or with `using`" }
            - id: fine
              text: { uk: "Нічого: колбек виконається, щойно на звіт не лишиться посилань", en: "Nothing: the callback runs as soon as no references to the report remain" }
              why:
                uk: "Збирач сміття працює, коли сам вирішить, і не зобов’язаний прибирати кожен об’єкт; специфікація не гарантує, що колбек узагалі буде викликано."
                en: "The garbage collector works when it decides to and is not required to reclaim every object; the specification does not guarantee that the callback is called at all."
            - id: too-early
              text: { uk: "Колбек виконається занадто рано, ще поки звіт потрібен", en: "The callback runs too early, while the report is still needed" }
              why:
                uk: "Поки на об’єкт є посилання, його не приберуть. Проблема в протилежному — колбек може запізнитися або не прийти зовсім."
                en: "While the object is referenced, it is not reclaimed. The problem is the opposite — the callback may come late or not at all."
          correct: [unreliable]
        explanation:
          uk: "Фіналізатор — лише підказка для необов’язкового прибирання (наприклад, кешу). Ресурси з обмеженою кількістю закривають детерміновано: `try…finally` або `using` там, де він підтримується. Тема — js-13-10."
          en: "A finalizer is only a hint for optional cleanup (a cache, for example). Limited resources are closed deterministically: `try…finally`, or `using` where it is supported. Topic: js-13-10."

  - id: stage-done
    kind: explanation
    title:
      uk: "JavaScript-етап пройдено — що далі"
      en: "The JavaScript stage is done — what next"
    body:
      uk: |
        Якщо всі чотири перевірки рубежу пройдено, ти показав на незнайомому матеріалі те, чого вимагає робота з JavaScript: знаходиш дефект за доказами, будуєш функцію від даних до доступного інтерфейсу, пишеш тести, що справді ловлять дефект, рецензуєш і пояснюєш межі середовища.

        Наступний етап — React. Він стоїть на всьому, що ти щойно перевірив: незмінні оновлення, замикання, модулі, асинхронність і доступна розмітка стануть основою компонентів, стану й ефектів.

        Якщо якась перевірка не пройшла, повернися до уроків, названих у її повідомленнях, виправ свої файли й натисни «Перевірити» знову: платформа зберігає твою роботу у вправі.
      en: |
        If all four checks of the gate passed, you have shown on unseen material what working with JavaScript requires: you find a defect from evidence, build a feature from the data to an accessible UI, write tests that really catch a defect, review, and explain the boundaries of the runtime.

        The next stage is React. It stands on everything you have just checked: immutable updates, closures, modules, asynchrony and accessible markup become the basis of components, state and effects.

        If a check did not pass, go back to the lessons named in its messages, repair your files and press “Check” again: the platform saves your work in the exercise.
