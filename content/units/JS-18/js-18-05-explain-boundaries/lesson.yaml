    solutionNote:
      uk: |
        1. **`test-passes-app-breaks`.** Підробка відповідає те, що написав автор тесту, тож тест і далі зелений; справжній `fetch` отримує об’єкт замість масиву, і сторінка ламається. Mock доводить код навколо підміненої частини, а не саму частину.
        2. **`undefined-then-ReferenceError`.** `var` створюється зі значенням `undefined` до виконання; `let` теж існує від початку, але до свого рядка перебуває в TDZ: читання кидає `ReferenceError: Cannot access 'limit' before initialization`.
        3. **`1-then-0`.** `import` — жива прив’язка до змінної модуля; `require` повертає об’єкт `exports`, а деструктуризація копіює значення на ту мить.
        4. **`cookie-only`.** `localStorage` належить origin (схема, хост **і порт**), тож у `8080` воно своє; cookie обмежується хостом і шляхом, але не портом, тому браузер надсилає `session=abc` і на `localhost:8080`.
        5. **`server-handles-page-cannot-read`.** Простий POST без власних заголовків іде без preflight, і сервер його обробляє; без `Access-Control-Allow-Origin` браузер лише не віддає відповідь скрипту (у пісочниці це `TypeError: Failed to fetch` для `/lab/cors/closed`). Захист сервера — перевірка автентифікації та запиту на самому сервері.
        6. **`maybe-later-or-never`.** Пісочниця друкує лише `dropped`. Колбек виконується, коли (і якщо) збирач сміття прибере об’єкт; специфікація не обіцяє ні моменту, ні самого виклику.
      en: |
        1. **`test-passes-app-breaks`.** The fake answers what the test’s author wrote, so the test stays green; the real `fetch` gets an object instead of an array, and the page breaks. A mock proves the code around the replaced part, not the part itself.
        2. **`undefined-then-ReferenceError`.** `var` is created with the value `undefined` before running; `let` also exists from the start but is in the TDZ until its line: reading it throws `ReferenceError: Cannot access 'limit' before initialization`.
        3. **`1-then-0`.** `import` is a live binding to the module’s variable; `require` returns the `exports` object, and destructuring copies the value of that moment.
        4. **`cookie-only`.** `localStorage` belongs to an origin (scheme, host **and port**), so `8080` has its own; a cookie is scoped by host and path but not by port, so the browser sends `session=abc` to `localhost:8080` too.
        5. **`server-handles-page-cannot-read`.** A simple POST without custom headers goes without a preflight, and the server processes it; without `Access-Control-Allow-Origin` the browser only withholds the response from the script (in the sandbox that is `TypeError: Failed to fetch` for `/lab/cors/closed`). Protecting the server means checking authentication and the request on the server itself.
        6. **`maybe-later-or-never`.** The sandbox prints only `dropped`. The callback runs when (and if) the garbage collector reclaims the object; the specification promises neither the moment nor the call itself.
