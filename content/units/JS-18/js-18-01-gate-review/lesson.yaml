id: js-18-01-gate-review
unit: JS-18
title:
  uk: "Огляд перед рубежем: чого очікує JavaScript-етап"
  en: "Gate review: what the JavaScript stage expects"
kind: review
minutes: 25
contentVersion: 1
purpose:
  uk: "Перед підсумковим рубежем JavaScript-етапу ти з пам’яті відповідаєш на одне коротке нове питання з кожної родини навичок етапу. Так видно, що лишилося надійним через тижні після вивчення, а що варто перечитати до рубежу."
  en: "Before the final gate of the JavaScript stage you answer, from memory, one short new question from every skill family of the stage. That shows what stayed reliable weeks after you learned it and what is worth rereading before the gate."
objectives:
  - uk: "З пам’яті передбачити, як поводяться замикання, цикл подій та інші ключові механізми, у коротких незнайомих фрагментах коду."
    en: "Retrieve from memory how closures, the event loop and other core mechanisms behave by predicting the output of short unseen snippets."
  - uk: "Оцінити свою готовність за кожною родиною JavaScript-етапу щодо критеріїв рубежу й обрати дві родини, які варто повторити перед ним."
    en: "Rate your readiness for each JavaScript-stage family against the gate's criteria and pick the two families to revisit before the gate."
prerequisites: [js-17-13-capstone-quality, js-10-05-capstone-cp-js]
subskills: []
glossary: []
selfCheck: [shared-cache, async-order]

blocks:
  - id: what-the-gate-checks
    kind: explanation
    title:
      uk: "Що перевіряє рубіж"
      en: "What the gate checks"
    body:
      uk: |
        JavaScript-етап закінчується **рубежем** — чотирма уроками-перевірками на матеріалі, якого ти ще не бачив: незнайомий код, нові предметні області, без підказок до розв’язку.

        | Урок рубежу | Що ти показуєш |
        |---|---|
        | Налагодження | знаходиш і виправляєш нові дефекти за стеком викликів, breakpoints і падінням перевірок |
        | Перенесення | будуєш невелику функцію від моделі даних до доступного інтерфейсу в новій області |
        | Тести й review | пишеш тести, що ловлять дефект, розв’язуєш конфлікт злиття, пишеш звіт про рішення |
        | Межі | пояснюєш на контрприкладах шість меж середовища виконання й вебу |

        Цей урок — розминка перед ними. Спершу два прогнози, потім по одному питанню з кожної з 23 родин етапу: J — мова, W — веб, P — інструменти й практика. Відповідай **з пам’яті**, не відкриваючи попередніх уроків: саме спроба пригадати зміцнює знання, а помилка зараз коштує дешевше, ніж на рубежі.

        Після кожної відповіді пояснення називає урок, де це розбиралося. Рахуй, де ти помилився або вгадав, — у кінці це знадобиться.
      en: |
        The JavaScript stage ends with a **gate** — four check lessons on material you have not seen yet: unfamiliar code, new domains, no hints towards the solution.

        | Gate lesson | What you show |
        |---|---|
        | Debugging | you find and repair new defects from the call stack, breakpoints and failing checks |
        | Transfer | you build a small feature from the data model to an accessible UI in a new domain |
        | Tests and review | you write tests that catch a defect, resolve a merge conflict and write a decision write-up |
        | Boundaries | you explain six runtime and web boundaries with counterexamples |

        This lesson is the warm-up before them. First two predictions, then one question from each of the stage’s 23 families: J — the language, W — the web, P — tools and practice. Answer **from memory**, without opening earlier lessons: the effort of recalling is what strengthens knowledge, and a mistake now costs less than one at the gate.

        After every answer the explanation names the lesson where the topic was covered. Keep count of where you were wrong or guessed — you will need it at the end.

  - id: shared-cache
    kind: prediction
    prompt:
      uk: "Допоміжна функція `memoize` запам’ятовує результати, щоб не обчислювати їх двічі. Нею обгорнули дві різні функції. Що надрукує програма?"
      en: "The helper `memoize` remembers results so they are not computed twice. Two different functions were wrapped with it. What does the program print?"
    code: |
      const cache = new Map();

      function memoize(fn) {
        return (n) => {
          if (cache.has(n)) return cache.get(n);
          const result = fn(n);
          cache.set(n, result);
          return result;
        };
      }

      const double = memoize((n) => n * 2);
      const square = memoize((n) => n * n);

      console.log(double(3), square(3), square(4), double(4));
    verify: { logs: ["6 6 16 16"] }
    answer:
      type: choice
      options:
        - id: shared
          code: "6 6 16 16"
        - id: separate
          code: "6 9 16 8"
          why:
            uk: "Так було б, якби кожна обгортка мала власний `Map`. Але `cache` створено один раз, поза `memoize`: обидві стрілкові функції замикають ту саму змінну, тож `square(3)` знаходить у ній результат `double(3)`."
            en: "That would be true if each wrapper had its own `Map`. But `cache` is created once, outside `memoize`: both arrow functions close over the same variable, so `square(3)` finds the result of `double(3)` in it."
        - id: half
          code: "6 9 16 16"
          why:
            uk: "Кеш спільний для обох обгорток і з першого ж виклику: після `double(3)` у ньому вже лежить `3 → 6`, тож `square(3)` поверне `6`, а не обчислить `9`."
            en: "The cache is shared by both wrappers from the very first call: after `double(3)` it already holds `3 → 6`, so `square(3)` returns `6` instead of computing `9`."
      correct: [shared]
    explanation:
      uk: "Замикання тримає живою **змінну**, а не копію значення. Обидві обгортки бачать один `cache`, створений на рівні модуля, тож відповідь для `3` і для `4` записує той, хто прийшов першим. Щоб кеш був у кожної свій, `const cache = new Map()` має стояти **всередині** `memoize`: тоді кожен виклик `memoize` створює нову змінну. Тема — урок js-03-05 про замикання."
      en: "A closure keeps a **variable** alive, not a copy of a value. Both wrappers see the one `cache` created at module level, so the answer for `3` and for `4` is written by whoever comes first. For each to have its own cache, `const cache = new Map()` must sit **inside** `memoize`: then every call of `memoize` creates a new variable. Topic: lesson js-03-05 on closures."

  - id: async-order
    kind: prediction
    prompt:
      uk: "Розстав надруковані літери в тому порядку, в якому вони з’являться в консолі."
      en: "Put the printed letters in the order in which they appear in the console."
    code: |
      async function load() {
        console.log("A");
        setTimeout(() => console.log("B"), 0);
        queueMicrotask(() => console.log("C"));
        Promise.resolve().then(() => console.log("D"));
        await null;
        console.log("E");
      }

      load();
      console.log("F");
    verify: { logs: ["A", "F", "C", "D", "E", "B"] }
    answer:
      type: order
      items:
        - { id: a, code: "A" }
        - { id: f, code: "F" }
        - { id: c, code: "C" }
        - { id: d, code: "D" }
        - { id: e, code: "E" }
        - { id: b, code: "B" }
    explanation:
      uk: |
        - `A` — синхронно, щойно викликали `load()`.
        - На `await` функція призупиняється й повертає керування, тож синхронний код далі друкує `F`.
        - Потім — **мікрозадачі** в порядку, в якому їх поставили в чергу: `C` (`queueMicrotask`), `D` (`then` уже виконаного проміса), а тоді продовження після `await` — `E`. Його поставили в чергу останнім, коли виконання дійшло до `await`.
        - `B` — останнім: колбек таймера — це **задача**, а задача чекає, доки черга мікрозадач спорожніє, навіть із затримкою `0`.

        Тема — уроки js-08-01 (таймери й цикл подій) і js-08-04 (мікрозадачі й задачі).
      en: |
        - `A` — synchronously, as soon as `load()` is called.
        - At `await` the function pauses and gives control back, so the synchronous code goes on and prints `F`.
        - Then the **microtasks**, in the order they were queued: `C` (`queueMicrotask`), `D` (`then` of an already fulfilled promise), and then the continuation after `await` — `E`. It was queued last, when execution reached `await`.
        - `B` comes last: a timer callback is a **task**, and a task waits until the microtask queue is empty, even with a delay of `0`.

        Topic: lessons js-08-01 (timers and the event loop) and js-08-04 (microtasks versus tasks).

  - id: language-round
    kind: review
    title:
      uk: "Мова: родини J"
      en: "The language: J families"
    items:
      - id: j01-coercion
        from: js-02-02-equality-coercion
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          console.log("5" + 3, "5" - 3, null == 0, null >= 0);
        verify: { logs: ["53 2 false true"] }
        answer:
          type: choice
          options:
            - id: right
              code: "53 2 false true"
            - id: all-numbers
              code: "8 2 true true"
              why:
                uk: "`+` з текстом у лапках склеює, а не додає: `\"5\" + 3` дає `\"53\"`. А `null == 0` — `false`: при `==` значення `null` дорівнює лише `null` та `undefined`."
                en: "`+` with text in quotes concatenates instead of adding: `\"5\" + 3` gives `\"53\"`. And `null == 0` is `false`: with `==`, `null` equals only `null` and `undefined`."
            - id: consistent
              code: "53 2 false false"
              why:
                uk: "Порівняння `>=` перетворює `null` на число `0`, а `0 >= 0` — `true`. Саме тому `==` і `>=` тут не узгоджені між собою."
                en: "The comparison `>=` converts `null` to the number `0`, and `0 >= 0` is `true`. That is exactly why `==` and `>=` disagree here."
          correct: [right]
        explanation:
          uk: "`+` з текстом склеює, `-` завжди перетворює на числа. `==` має окреме правило для `null` (рівний лише `null` і `undefined`), а `>=` перетворює `null` на `0`. Звідси пам’ятка з js-02-02: порівнюй через `===` і перетворюй типи явно."
          en: "`+` with text concatenates, `-` always converts to numbers. `==` has a special rule for `null` (equal only to `null` and `undefined`), while `>=` converts `null` to `0`. Hence the rule from js-02-02: compare with `===` and convert types explicitly."
      - id: j02-loop-bindings
        from: js-03-09-debug-captured-bindings
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const withLet = [];
          for (let i = 0; i < 3; i++) withLet.push(() => i);

          let j;
          const shared = [];
          for (j = 0; j < 3; j++) shared.push(() => j);

          console.log(withLet.map((f) => f()).join(), shared.map((f) => f()).join());
        verify: { logs: ["0,1,2 3,3,3"] }
        answer:
          type: choice
          options:
            - id: right
              code: "0,1,2 3,3,3"
            - id: both-own
              code: "0,1,2 0,1,2"
              why:
                uk: "Нову змінну на кожен прохід створює лише `let`, оголошений **у заголовку** циклу. `j` оголошено один раз перед циклом, тож усі три функції бачать ту саму `j`, яка наприкінці дорівнює `3`."
                en: "Only a `let` declared **in the loop header** creates a new variable for every pass. `j` is declared once before the loop, so all three functions see the same `j`, which is `3` at the end."
            - id: both-last
              code: "3,3,3 3,3,3"
              why:
                uk: "`let i` у заголовку циклу `for` дає кожному проходу власну `i`, і кожна стрілкова функція замикає свою."
                en: "`let i` in a `for` loop header gives each pass its own `i`, and each arrow function closes over its own one."
          correct: [right]
        explanation:
          uk: "Функція бачить змінну, а не значення на момент створення. У першому циклі змінних три, у другому — одна спільна. Тема — js-03-09 про захоплені змінні."
          en: "A function sees the variable, not its value at creation time. The first loop has three variables, the second one shared variable. Topic: js-03-09 on captured bindings."
      - id: j03-off-by-one
        from: js-04-03-termination-off-by-one
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const days = ["mon", "tue", "wed"];
          let out = "";
          for (let i = 0; i <= days.length; i++) out += days[i] + " ";
          console.log(out.trim());
        verify: { logs: ["mon tue wed undefined"] }
        answer:
          type: choice
          options:
            - id: right
              code: "mon tue wed undefined"
            - id: clean
              code: "mon tue wed"
              why:
                uk: "Умова `<=` пропускає ще один прохід з `i` = 3. Елемента з індексом 3 немає, а читання за межами масиву дає `undefined` без помилки."
                en: "The condition `<=` lets one more pass run with `i` = 3. There is no item at index 3, and reading past the end of an array gives `undefined` without an error."
            - id: error
              code: "RangeError"
              why:
                uk: "Масив у JavaScript не кидає помилку при читанні за межами: він просто повертає `undefined`."
                en: "An array in JavaScript does not throw when read past its end: it simply returns `undefined`."
          correct: [right]
        explanation:
          uk: "Останній індекс масиву — `length - 1`, тому цикл має йти до `i < days.length`. Помилка на одиницю не ламає програму, а тихо додає `undefined` — js-04-03."
          en: "The last index of an array is `length - 1`, so the loop must run while `i < days.length`. An off-by-one error does not crash the program, it quietly adds `undefined` — js-04-03."
      - id: j04-lost-this
        from: js-11-01-this-lexical-dynamic
        prompt:
          uk: "Метод `add` скопіювали в окрему змінну й викликали без об’єкта. Код — модуль, тобто в суворому режимі. Що надрукує програма?"
          en: "The method `add` was copied into a separate variable and called without the object. The code is a module, so it runs in strict mode. What does the program print?"
        code: |
          const counter = {
            count: 0,
            add() {
              this.count++;
              return this.count;
            },
          };

          const add = counter.add;
          try {
            console.log(add());
          } catch (error) {
            console.log(error.name);
          }
        verify: { logs: ["TypeError"] }
        answer:
          type: choice
          options:
            - id: right
              code: "TypeError"
            - id: one
              code: "1"
              why:
                uk: "`this` визначає не місце, де метод написано, а **спосіб виклику**. `add()` без крапки перед ним дає `this` = `undefined`."
                en: "`this` is decided not by where the method is written but by **how it is called**. `add()` with no dot in front gives `this` = `undefined`."
            - id: nan
              code: "NaN"
              why:
                uk: "У нестрогому скрипті `this` був би глобальним об’єктом і вийшло б `NaN`. Модулі завжди суворі, тож `this` — `undefined`, а читання `undefined.count` кидає помилку."
                en: "In a sloppy script `this` would be the global object and the result would be `NaN`. Modules are always strict, so `this` is `undefined`, and reading `undefined.count` throws."
          correct: [right]
        explanation:
          uk: "Звичайна функція отримує `this` під час виклику: `counter.add()` дає `counter`, а `add()` — `undefined`. Виправлення — `counter.add.bind(counter)` або виклик через об’єкт. Тема — js-11-01 і js-11-02."
          en: "An ordinary function gets `this` at call time: `counter.add()` gives `counter`, while `add()` gives `undefined`. The repair is `counter.add.bind(counter)` or a call through the object. Topic: js-11-01 and js-11-02."
      - id: j05-shallow-copy
        from: js-04-08-copying-shallow-deep
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const original = [{ n: 1 }];
          const copy = [...original];
          copy[0].n = 2;
          copy.push({ n: 3 });
          console.log(original.length, original[0].n);
        verify: { logs: ["1 2"] }
        answer:
          type: choice
          options:
            - id: right
              code: "1 2"
            - id: deep
              code: "1 1"
              why:
                uk: "Spread копіює лише сам масив. Об’єкт `{ n: 1 }` у копії — той самий, що в оригіналі, тож зміна `copy[0].n` видна й через `original`."
                en: "Spread copies only the array itself. The object `{ n: 1 }` in the copy is the same one as in the original, so changing `copy[0].n` is visible through `original` too."
            - id: same
              code: "2 2"
              why:
                uk: "Масиви різні: `push` у копію не змінює довжину оригіналу. Спільні лише об’єкти всередині."
                en: "The arrays are different: `push` into the copy does not change the original’s length. Only the objects inside are shared."
          correct: [right]
        explanation:
          uk: "Неглибока копія — новий масив із тими самими об’єктами. Щоб змінити запис без впливу на оригінал, копіюють і його: `{ ...copy[0], n: 2 }`. Тема — js-04-08."
          en: "A shallow copy is a new array with the same objects. To change a record without affecting the original, copy it too: `{ ...copy[0], n: 2 }`. Topic: js-04-08."
      - id: j06-class-fields
        from: js-11-05-classes-private-static
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          class Box {
            #value = 1;
            static count = 0;
            constructor() {
              Box.count++;
            }
            get value() {
              return this.#value;
            }
          }

          new Box();
          const box = new Box();
          console.log(Box.count, box.value, box.count, Object.keys(box).length);
        verify: { logs: ["2 1 undefined 0"] }
        answer:
          type: choice
          options:
            - id: right
              code: "2 1 undefined 0"
            - id: per-object
              code: "1 1 1 1"
              why:
                uk: "`static count` належить класу, а не кожному об’єкту: обидва конструктори збільшили одне й те саме `Box.count`. Через екземпляр `box.count` його не видно."
                en: "`static count` belongs to the class, not to each object: both constructors increased the same `Box.count`. It is not visible through the instance as `box.count`."
            - id: private-key
              code: "2 1 undefined 1"
              why:
                uk: "Приватне поле `#value` не є звичайною властивістю: `Object.keys` його не бачить. А гетер `value` живе в прототипі, не в самому об’єкті."
                en: "The private field `#value` is not an ordinary property: `Object.keys` does not see it. And the getter `value` lives on the prototype, not on the object itself."
          correct: [right]
        explanation:
          uk: "Статичне поле — одне на клас, приватне поле — у кожного об’єкта, але приховане від `Object.keys` і читання ззовні, гетер — у прототипі. Тема — js-11-05 і js-11-06."
          en: "A static field is one per class, a private field exists in each object but is hidden from `Object.keys` and outside reads, a getter lives on the prototype. Topic: js-11-05 and js-11-06."
      - id: j07-number-text
        from: js-12-03-numbers-precision
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          console.log(0.1 + 0.2 === 0.3, Math.round(1.005 * 100) / 100, [..."👍"].length, "👍".length);
        verify: { logs: ["false 1 1 2"] }
        answer:
          type: choice
          options:
            - id: right
              code: "false 1 1 2"
            - id: exact
              code: "true 1.01 1 1"
              why:
                uk: "Десяткові дроби на кшталт `0.1` не мають точного двійкового запису: `0.1 + 0.2` — це `0.30000000000000004`, а `1.005 * 100` — трохи менше за `100.5`. А `length` тексту рахує кодові одиниці UTF-16, яких в емодзі дві."
                en: "Decimal fractions like `0.1` have no exact binary form: `0.1 + 0.2` is `0.30000000000000004`, and `1.005 * 100` is a little less than `100.5`. And the `length` of text counts UTF-16 code units, of which an emoji has two."
            - id: rounding
              code: "false 1.01 1 2"
              why:
                uk: "`1.005 * 100` дає `100.49999999999999`, а не `100.5`, тож `Math.round` округлює вниз до `100`."
                en: "`1.005 * 100` gives `100.49999999999999`, not `100.5`, so `Math.round` rounds down to `100`."
          correct: [right]
        explanation:
          uk: "Числа — двійкові дроби з обмеженою точністю, тому гроші рахують цілими копійками, а округлюють навмисно. Довжина тексту в кодових одиницях не дорівнює кількості символів, які бачить людина. Тема — js-12-01, js-12-03 і js-12-05."
          en: "Numbers are binary fractions with limited precision, which is why money is counted in whole minor units and rounded on purpose. The length of text in code units is not the number of characters a person sees. Topic: js-12-01, js-12-03 and js-12-05."
      - id: j08-date-overflow
        from: js-12-08-dates-storage-presentation
        prompt:
          uk: "Дата — 31 січня 2026 року. Їй змінюють лише місяць на лютий. Що надрукує код?"
          en: "The date is 31 January 2026. Only its month is changed to February. What does the code print?"
        code: |
          const date = new Date(2026, 0, 31);
          date.setMonth(1);
          console.log(date.getMonth(), date.getDate());
        verify: { logs: ["2 3"] }
        answer:
          type: choice
          options:
            - id: right
              code: "2 3"
            - id: clamped
              code: "1 28"
              why:
                uk: "`Date` не обрізає день до кінця місяця. 31 лютого не існує, тож дата «переливається» на 3 дні вперед — у березень."
                en: "`Date` does not clamp the day to the end of the month. February 31 does not exist, so the date overflows by 3 days — into March."
            - id: human-month
              code: "2 31"
              why:
                uk: "Місяці в `Date` рахуються від нуля (`1` — лютий), але день 31 у лютому неможливий: 2026 рік не високосний, тож 31 − 28 = 3 березня."
                en: "Months in `Date` count from zero (`1` is February), but day 31 is impossible in February: 2026 is not a leap year, so 31 − 28 = March 3."
          correct: [right]
        explanation:
          uk: "Місяць `1` — лютий, а неіснуючий день переливається в наступний місяць: 3 березня, тобто місяць `2`. Тому в застосунку календарні дати лишаються текстом `YYYY-MM-DD`, а `Date` з’являється лише там, де справді потрібен момент часу, — js-12-08."
          en: "Month `1` is February, and a day that does not exist overflows into the next month: March 3, which is month `2`. That is why calendar dates in the app stay `YYYY-MM-DD` text, and a `Date` appears only where an instant is really needed — js-12-08."
      - id: j09-set-map-keys
        from: js-12-11-map-set
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const set = new Set([1, "1", 1, NaN, NaN]);
          const map = new Map([[{}, "first"], [{}, "second"]]);
          console.log(set.size, map.size);
        verify: { logs: ["3 2"] }
        answer:
          type: choice
          options:
            - id: right
              code: "3 2"
            - id: loose
              code: "2 1"
              why:
                uk: "`Set` порівнює без перетворення типів: `1` і `\"1\"` — різні. А два літерали `{}` — два різні об’єкти, тож у `Map` це два різні ключі."
                en: "`Set` compares without converting types: `1` and `\"1\"` are different. And two `{}` literals are two different objects, so in the `Map` they are two different keys."
            - id: nan-twice
              code: "4 2"
              why:
                uk: "`Set` вважає `NaN` рівним `NaN` (на відміну від `===`), тож він зберігається один раз."
                en: "`Set` treats `NaN` as equal to `NaN` (unlike `===`), so it is stored once."
          correct: [right]
        explanation:
          uk: "`Set` і `Map` порівнюють ключі як `===`, але з `NaN`, рівним собі. Об’єкти — за ідентичністю: два однакові на вигляд об’єкти — різні ключі. Тема — js-12-11."
          en: "`Set` and `Map` compare keys like `===`, except that `NaN` equals itself. Objects compare by identity: two objects that look alike are different keys. Topic: js-12-11."
      - id: j10-finally-return
        from: js-07-03-try-catch-finally
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          function attempt() {
            try {
              throw new Error("x");
            } catch (error) {
              return "catch";
            } finally {
              console.log("finally");
            }
          }

          console.log(attempt());
        verify: { logs: ["finally", "catch"] }
        answer:
          type: choice
          options:
            - id: right
              text: { uk: "`finally`, потім `catch`", en: "`finally`, then `catch`" }
            - id: return-first
              text: { uk: "`catch`, потім `finally`", en: "`catch`, then `finally`" }
              why:
                uk: "`return` у `catch` лише запам’ятовує значення; перш ніж функція справді поверне його, виконується `finally`. Друк значення відбувається вже після виходу з функції."
                en: "`return` in `catch` only remembers the value; before the function really returns it, `finally` runs. The value is printed only after the function has finished."
            - id: skips-finally
              text: { uk: "Лише `catch`", en: "Only `catch`" }
              why:
                uk: "`finally` виконується завжди: після звичайного завершення, після `return` і після помилки."
                en: "`finally` always runs: after normal completion, after `return` and after an error."
          correct: [right]
        explanation:
          uk: "`finally` виконується перед тим, як функція поверне значення з `try` чи `catch`, — тому там прибирають ресурси. Тема — js-07-03."
          en: "`finally` runs before the function returns the value from `try` or `catch` — which is why resources are released there. Topic: js-07-03."
      - id: j11-catch-recovers
        from: js-08-03-chaining-rejection
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          Promise.reject(new Error("offline"))
            .then(() => console.log("loaded"))
            .catch((error) => {
              console.log(error.message);
              return 0;
            })
            .then((count) => console.log(count));
        verify: { logs: ["offline", "0"] }
        answer:
          type: choice
          options:
            - id: right
              text: { uk: "`offline`, потім `0`", en: "`offline`, then `0`" }
            - id: stops
              text: { uk: "Лише `offline`", en: "Only `offline`" }
              why:
                uk: "`catch` повертає новий проміс, виконаний значенням, яке повернув обробник. Ланцюжок після нього продовжується як звичайний — з `0`."
                en: "`catch` returns a new promise fulfilled with the value its handler returned. The chain after it continues as normal — with `0`."
            - id: loaded
              text: { uk: "`loaded`, `offline`, `0`", en: "`loaded`, `offline`, `0`" }
              why:
                uk: "Відхилений проміс пропускає обробники `then` без другого аргументу, доки не знайде `catch`."
                en: "A rejected promise skips `then` handlers without a second argument until it finds a `catch`."
          correct: [right]
        explanation:
          uk: "Відхилення «пролітає» повз `then` до найближчого `catch`. Обробник `catch`, що повернув значення, відновлює ланцюжок. Тема — js-08-03."
          en: "A rejection flies past `then` to the nearest `catch`. A `catch` handler that returns a value recovers the chain. Topic: js-08-03."
      - id: j12-exhausted-iterator
        from: js-13-01-iterable-protocol
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const iterator = [10, 20, 30][Symbol.iterator]();
          iterator.next();
          console.log([...iterator].length, [...iterator].length);
        verify: { logs: ["2 0"] }
        answer:
          type: choice
          options:
            - id: right
              code: "2 0"
            - id: restarts
              code: "3 3"
              why:
                uk: "Ітератор не починає спочатку: він пам’ятає позицію. Перший `next()` уже забрав `10`, а перший spread дочитав решту."
                en: "An iterator does not start over: it remembers its position. The first `next()` already took `10`, and the first spread read the rest."
            - id: reusable
              code: "2 2"
              why:
                uk: "Вичерпаний ітератор лишається вичерпаним. Новий прохід дає лише сам масив — через новий виклик `[Symbol.iterator]()`."
                en: "An exhausted iterator stays exhausted. A new pass comes only from the array itself — through a new call of `[Symbol.iterator]()`."
          correct: [right]
        explanation:
          uk: "Масив — ітерований (дає новий ітератор щоразу), а ітератор — одноразовий курсор. Тема — js-13-01."
          en: "An array is iterable (it gives a new iterator every time), while an iterator is a single-use cursor. Topic: js-13-01."
      - id: j13-quadratic-growth
        from: js-17-02-big-o-measured
        prompt:
          uk: "Перевірка дублікатів порівнює кожен запис з кожним наступним двома вкладеними циклами. Записів стало вдвічі більше. Як зміниться кількість порівнянь?"
          en: "A duplicate check compares every record with every later one using two nested loops. The number of records doubles. How does the number of comparisons change?"
        answer:
          type: choice
          options:
            - id: four
              text: { uk: "Приблизно вчетверо більше", en: "About four times as many" }
            - id: two
              text: { uk: "Удвічі більше", en: "Twice as many" }
              why:
                uk: "Удвічі зростає робота одного циклу. Тут на кожен із удвічі більшої кількості записів припадає вдвічі більше порівнянь: 2 × 2 = 4."
                en: "A single loop’s work doubles. Here each of twice as many records gets twice as many comparisons: 2 × 2 = 4."
            - id: ms
              text: { uk: "Це залежить лише від швидкості комп’ютера", en: "It depends only on the computer’s speed" }
              why:
                uk: "Швидкість комп’ютера змінює мілісекунди, а не кількість порівнянь. Оцінка O(n²) описує саме те, як росте робота з розміром даних."
                en: "The computer’s speed changes the milliseconds, not the number of comparisons. The O(n²) estimate describes exactly how the work grows with the data size."
          correct: [four]
        explanation:
          uk: "Порівнянь n·(n − 1)/2, тобто O(n²): подвоєння n учетверо збільшує роботу. Перевірка через `Set` робить один прохід — O(n). Тема — js-17-02."
          en: "There are n·(n − 1)/2 comparisons, which is O(n²): doubling n quadruples the work. A check with a `Set` makes one pass — O(n). Topic: js-17-02."
      - id: j14-proxy-reads
        from: js-13-09-proxy-workers-awareness
        prompt:
          uk: "Об’єкт обгорнуто в `Proxy`, пастка `get` друкує кожне читання властивості. Що надрукує код?"
          en: "An object is wrapped in a `Proxy` whose `get` trap prints every property read. What does the code print?"
        code: |
          const target = { a: 1, b: 2, c: 3 };
          const watched = new Proxy(target, {
            get(object, key, receiver) {
              console.log("get", String(key));
              return Reflect.get(object, key, receiver);
            },
          });

          const { a, b } = watched;
        verify: { logs: ["get a", "get b"] }
        answer:
          type: choice
          options:
            - id: right
              text: { uk: "`get a`, потім `get b`", en: "`get a`, then `get b`" }
            - id: once
              text: { uk: "Один рядок: деструктуризація читає об’єкт цілком", en: "One line: destructuring reads the object as a whole" }
              why:
                uk: "Деструктуризація — це звичайні читання властивостей по одній: `watched.a`, потім `watched.b`. Кожне проходить через пастку."
                en: "Destructuring is ordinary property reads, one by one: `watched.a`, then `watched.b`. Each goes through the trap."
            - id: three
              text: { uk: "Три рядки: для `a`, `b` і `c`", en: "Three lines: for `a`, `b` and `c`" }
              why:
                uk: "Читається лише те, що назване в деструктуризації. `c` ніхто не читає."
                en: "Only what the destructuring names is read. Nobody reads `c`."
          correct: [right]
        explanation:
          uk: "`Proxy` перехоплює кожну операцію з об’єктом окремо, а `Reflect.get` виконує стандартну дію. Тема — js-13-09."
          en: "A `Proxy` intercepts each operation on the object separately, and `Reflect.get` performs the standard action. Topic: js-13-09."

  - id: web-round
    kind: review
    title:
      uk: "Веб: родини W"
      en: "The web: W families"
    items:
      - id: w01-label
        from: js-06-01-forms-inputs-labels
        prompt:
          uk: "Яка розмітка дає полю видимий підпис, який водночас є його доступною назвою і не зникає, коли починаєш писати?"
          en: "Which markup gives a field a visible label that is also its accessible name and does not disappear when you start typing?"
        answer:
          type: choice
          options:
            - id: label
              code: "<label>Email <input name=\"email\" type=\"email\"></label>"
            - id: placeholder
              code: "<input name=\"email\" type=\"email\" placeholder=\"Email\">"
              why:
                uk: "Поле назване лише своїм `placeholder`, підпису немає: текст-заповнювач зникає, щойно людина почне писати, і має низький контраст."
                en: "The field is named only by its `placeholder`, there is no label: the placeholder text disappears as soon as a person starts typing, and it has low contrast."
            - id: span
              code: "<span>Email</span> <input name=\"email\" type=\"email\">"
              why:
                uk: "Текст поруч не пов’язаний із полем: програма зчитування екрана оголосить поле без назви. Потрібен `<label>` (навколо поля або з `for`)."
                en: "Text next to a field is not connected to it: a screen reader announces the field without a name. It needs a `<label>` (around the field or with `for`)."
          correct: [label]
        explanation:
          uk: "`<label>` навколо поля (або з `for`, що вказує на `id` поля) дає і видимий підпис, і доступну назву, а клік по підпису ставить фокус у поле. Тема — js-06-01."
          en: "A `<label>` around the field (or with `for` pointing at the field’s `id`) gives both a visible label and the accessible name, and a click on the label focuses the field. Topic: js-06-01."
      - id: w02-specificity
        from: js-06-03-cascade-specificity
        prompt:
          uk: |
            Абзац `<p id="intro" class="note">` і два правила, саме в такому порядку:

            ```css
            #intro { color: navy; }
            .note { color: darkgreen; }
            ```

            Якого кольору текст?
          en: |
            A paragraph `<p id="intro" class="note">` and two rules, in exactly this order:

            ```css
            #intro { color: navy; }
            .note { color: darkgreen; }
            ```

            What colour is the text?
        answer:
          type: choice
          options:
            - id: navy
              text: { uk: "`navy`", en: "`navy`" }
            - id: green
              text: { uk: "`darkgreen`: пізніше правило перемагає", en: "`darkgreen`: the later rule wins" }
              why:
                uk: "Порядок вирішує лише між правилами однакової специфічності. Селектор за `id` специфічніший за селектор класу, тож він перемагає, хоч і стоїть раніше."
                en: "Order decides only between rules of equal specificity. An `id` selector is more specific than a class selector, so it wins even though it comes first."
          correct: [navy]
        explanation:
          uk: "Каскад спершу порівнює специфічність (`id` > клас > тег), і лише за рівної — порядок. Тема — js-06-03."
          en: "The cascade first compares specificity (`id` > class > tag), and only when it is equal does order decide. Topic: js-06-03."
      - id: w03-event-phases
        from: js-06-11-bubbling-capture-delegation
        prompt:
          uk: "Обробники кліку стоять на списку, на пункті (у фазі захоплення) і на кнопці всередині пункту. Програма клацає кнопку. Що надрукує код?"
          en: "Click handlers sit on a list, on an item (in the capture phase) and on a button inside the item. The program clicks the button. What does the code print?"
        code: |
          const list = document.createElement("ul");
          const item = document.createElement("li");
          const button = document.createElement("button");
          item.append(button);
          list.append(item);
          document.body.append(list);

          list.addEventListener("click", (event) => console.log("list", event.target.tagName));
          item.addEventListener("click", () => console.log("item"), { capture: true });
          button.addEventListener("click", () => console.log("button"));

          button.click();
        verify: { logs: ["item", "button", "list BUTTON"] }
        answer:
          type: order
          items:
            - { id: item, code: "item" }
            - { id: button, code: "button" }
            - { id: list, code: "list BUTTON" }
        explanation:
          uk: "Подія спершу спускається від документа до цілі (фаза захоплення — спрацьовує `item` з `capture: true`), потім обробляється на самій кнопці, потім спливає вгору до `list`. `event.target` увесь час — кнопка, тому делегування на списку знає, що клацнули. Тема — js-06-11."
          en: "An event first travels down from the document to the target (the capture phase — `item` with `capture: true` runs), then is handled on the button itself, then bubbles up to `list`. `event.target` is the button the whole time, which is how delegation on the list knows what was clicked. Topic: js-06-11."
      - id: w04-fetch-404
        from: js-08-07-failures-loading-error
        prompt:
          uk: "Сервер відповідає на `fetch(\"/api/rooms\")` статусом 404. Що отримає код, який чекає на `await fetch(...)`?"
          en: "The server answers `fetch(\"/api/rooms\")` with status 404. What does code awaiting `await fetch(...)` get?"
        answer:
          type: choice
          options:
            - id: response
              text: { uk: "Відповідь з `ok: false` і `status: 404` — проміс виконано, не відхилено", en: "A response with `ok: false` and `status: 404` — the promise is fulfilled, not rejected" }
            - id: rejects
              text: { uk: "Відхилений проміс із `TypeError`", en: "A rejected promise with a `TypeError`" }
              why:
                uk: "`fetch` відхиляється лише тоді, коли відповіді немає взагалі (мережа, CORS, скасування). Статус 404 — це відповідь, тож її треба перевірити через `response.ok`."
                en: "`fetch` rejects only when there is no response at all (network, CORS, abort). Status 404 is a response, so it has to be checked with `response.ok`."
            - id: gives-null
              text: { uk: "`null`", en: "`null`" }
              why:
                uk: "`fetch` завжди дає об’єкт `Response` або відхилення, але ніколи `null`."
                en: "`fetch` always gives a `Response` object or a rejection, never `null`."
          correct: [response]
        explanation:
          uk: "Перевірка `if (!response.ok) throw …` — обов’язковий крок після `fetch`: інакше сторінка помилки піде в `response.json()` як дані. Тема — js-08-07 і js-16-05."
          en: "The check `if (!response.ok) throw …` is a required step after `fetch`: otherwise an error page goes into `response.json()` as data. Topic: js-08-07 and js-16-05."
      - id: w05-safe-sink
        from: js-16-07-xss-safe-sinks
        prompt:
          uk: "Назву бронювання вводить користувач, і її треба показати в пункті списку `item`. Який рядок коду безпечний для будь-якого тексту?"
          en: "A booking name is typed in by a user and has to be shown in the list item `item`. Which line of code is safe for any text?"
        answer:
          type: choice
          options:
            - id: text
              code: "item.textContent = booking.name;"
            - id: html
              code: "item.innerHTML = booking.name;"
              why:
                uk: "`innerHTML` розбирає текст як HTML. Назва `<img src=x onerror=…>` стане елементом, і її обробник виконає чужий код на твоїй сторінці (XSS)."
                en: "`innerHTML` parses the text as HTML. A name like `<img src=x onerror=…>` becomes an element, and its handler runs foreign code on your page (XSS)."
            - id: template
              code: "item.innerHTML = `<span>${booking.name}</span>`;"
              why:
                uk: "Шаблонний рядок не екранує вставлене значення: це той самий `innerHTML` з тим самим ризиком."
                en: "A template literal does not escape the inserted value: it is the same `innerHTML` with the same risk."
          correct: [text]
        explanation:
          uk: "`textContent` завжди вставляє текст як текст. Неперевірені дані йдуть лише в безпечні «приймачі» (sinks). Тема — js-16-06 і js-16-07."
          en: "`textContent` always inserts text as text. Untrusted data goes only into safe sinks. Topic: js-16-06 and js-16-07."

  - id: practice-round
    kind: review
    title:
      uk: "Інструменти й практика: родини P"
      en: "Tools and practice: P families"
    items:
      - id: p01-caret-range
        from: js-15-04-install-lockfile-semver
        prompt:
          uk: "У `package.json` залежність записана як `\"^1.4.2\"`. Які версії npm може встановити? Обери всі."
          en: "In `package.json` a dependency is written as `\"^1.4.2\"`. Which versions may npm install? Pick all of them."
        answer:
          type: multi
          options:
            - id: patch
              code: "1.4.9"
            - id: minor
              code: "1.9.0"
            - id: major
              code: "2.0.0"
              why:
                uk: "Діапазон `^` не переходить на нову мажорну версію: `2.0.0` може ламати сумісність."
                en: "A `^` range never moves to a new major version: `2.0.0` may break compatibility."
            - id: lower
              code: "1.4.1"
              why:
                uk: "`^1.4.2` означає «щонайменше 1.4.2»: старіші версії не підходять."
                en: "`^1.4.2` means “at least 1.4.2”: older versions do not match."
          correct: [patch, minor]
        explanation:
          uk: "`^1.4.2` дозволяє `>=1.4.2 <2.0.0`. Яку саме версію встановлено, записує lockfile — і `npm ci` відтворює саме її. Тема — js-15-04."
          en: "`^1.4.2` allows `>=1.4.2 <2.0.0`. Which version exactly was installed is recorded in the lockfile — and `npm ci` reproduces exactly that one. Topic: js-15-04."
      - id: p02-reflog
        from: js-15-11-undo-safely
        prompt:
          uk: "Ти закомітив зміну, а потім помилково виконав `git reset --hard HEAD~1`. Commit зник з `git log`. Що найпершим допоможе його знайти?"
          en: "You committed a change and then ran `git reset --hard HEAD~1` by mistake. The commit disappeared from `git log`. What helps find it first?"
        answer:
          type: choice
          options:
            - id: reflog
              code: "git reflog"
            - id: restore
              code: "git restore ."
              why:
                uk: "`git restore` повертає файли з поточного commit, а загублений commit уже не поточний. Він досі є в репозиторії, і його id показує reflog."
                en: "`git restore` brings files back from the current commit, and the lost commit is no longer current. It still exists in the repository, and the reflog shows its id."
            - id: gone
              text: { uk: "Нічого: `reset --hard` видалив commit назавжди", en: "Nothing: `reset --hard` deleted the commit forever" }
              why:
                uk: "`reset` лише пересуває гілку. Commit лишається в репозиторії, і reflog пам’ятає, де була гілка до цього."
                en: "`reset` only moves the branch. The commit stays in the repository, and the reflog remembers where the branch was before."
          correct: [reflog]
        explanation:
          uk: "`git reflog` показує, куди переміщувався `HEAD`, з id кожного стану. З потрібного id створюють гілку (`git branch recovered <id>`) і зливають її в `main` — commit повертається з тим самим id. Тема — js-15-11."
          en: "`git reflog` shows where `HEAD` moved, with the id of every state. A branch is created from the id you need (`git branch recovered <id>`) and merged into `main` — the commit comes back with the same id. Topic: js-15-11."
      - id: p03-unknown
        from: js-14-06-unknown-vs-any
        prompt:
          uk: |
            Що скаже `tsc` про цей код?

            ```ts
            const text = '{"title":"Fern"}';
            const data: unknown = JSON.parse(text);
            console.log(data.title);
            ```
          en: |
            What does `tsc` say about this code?

            ```ts
            const text = '{"title":"Fern"}';
            const data: unknown = JSON.parse(text);
            console.log(data.title);
            ```
        answer:
          type: choice
          options:
            - id: error
              text: { uk: "Помилку: `'data' is of type 'unknown'` — спершу треба звузити тип", en: "An error: `'data' is of type 'unknown'` — the type has to be narrowed first" }
            - id: fine
              text: { uk: "Нічого: `unknown` — те саме, що `any`", en: "Nothing: `unknown` is the same as `any`" }
              why:
                uk: "`any` вимикає перевірки, а `unknown` — навпаки: з таким значенням нічого не можна робити, доки перевірка (`typeof`, `in`, функція валідації) не звузить його тип."
                en: "`any` switches checks off, while `unknown` does the opposite: nothing can be done with such a value until a check (`typeof`, `in`, a validation function) narrows its type."
            - id: runtime
              text: { uk: "Нічого, але в браузері буде `TypeError`", en: "Nothing, but the browser will throw a `TypeError`" }
              why:
                uk: "`tsc` зупинить це ще до запуску. А в браузері, після видалення типів, читання `title` з об’єкта просто дасть значення або `undefined`."
                en: "`tsc` stops this before running. And in the browser, once the types are removed, reading `title` from an object simply gives a value or `undefined`."
          correct: [error]
        explanation:
          uk: "`unknown` — чесний тип для даних ззовні (`JSON.parse`, сховище, мережа): компілятор змушує перевірити форму під час виконання, перш ніж їй довіряти. Тема — js-14-06 і js-14-08."
          en: "`unknown` is the honest type for outside data (`JSON.parse`, storage, the network): the compiler forces you to check the shape at run time before trusting it. Topic: js-14-06 and js-14-08."
      - id: p04-boundary-test
        from: js-09-03-boundary-cases
        prompt:
          uk: "Функція `fits(price, limit)` має повертати `true`, коли ціна не перевищує ліміт, але в ній написано `price < limit`. Який набір тестів ловить цей дефект?"
          en: "The function `fits(price, limit)` must return `true` when the price does not exceed the limit, but it has `price < limit`. Which set of tests catches this defect?"
        answer:
          type: choice
          options:
            - id: boundary
              code: "fits(100, 100) → true"
            - id: far
              code: "fits(50, 100) → true; fits(150, 100) → false"
              why:
                uk: "Обидва випадки далеко від межі, і на них `<` та `<=` дають ту саму відповідь. Дефект живе рівно на межі."
                en: "Both cases are far from the boundary, and `<` and `<=` give the same answer on them. The defect lives exactly on the boundary."
            - id: many
              code: "fits(10, 100), fits(20, 100), … fits(90, 100) → true"
              why:
                uk: "Кількість тестів не замінює вибір випадку: жоден із них не стоїть на межі `price === limit`."
                en: "The number of tests does not replace the choice of case: none of them sits on the boundary `price === limit`."
          correct: [boundary]
        explanation:
          uk: "Тести меж — значення рівно на межі та поруч з нею з обох боків. Саме там `<` і `<=` розходяться. Тема — js-09-03."
          en: "Boundary tests use the value exactly on the boundary and next to it on both sides. That is exactly where `<` and `<=` differ. Topic: js-09-03."

  - id: rate-yourself
    kind: explanation
    title:
      uk: "Оціни себе й обери, що повторити"
      en: "Rate yourself and choose what to revisit"
    body:
      uk: |
        Тепер переглянь свої відповіді. Кожне питання — це одна родина навичок. Для кожного постав собі одну з трьох оцінок:

        - **Надійно** — відповів правильно й міг би пояснити чому.
        - **Вгадав** — відповідь правильна, але пояснення тебе здивувало.
        - **Помилився** — обрав неправильний варіант.

        Обери **дві родини** з оцінками «помилився» чи «вгадав» — ті, що найближче до рубежу. Яке питання на який урок рубежу працює:

        | Урок рубежу | Питання про |
        |---|---|
        | Налагодження | `let` у циклі · копію масиву · `0.1 + 0.2` й емодзі · `Set` і `Map` · `finally` · `^1.4.2` · тест для `fits` |
        | Перенесення | 31 січня й `setMonth` · `Set` і `Map` · подвоєння записів · `<label>` · фази кліку · `unknown` у `tsc` |
        | Тести й review | тест для `fits` · `git reflog` |
        | Межі | `let` у циклі · `finally` · `fetch` і статус 404 · `Proxy` |

        Перечитай уроки, названі в поясненнях до цих питань, і виконай у них прогнози ще раз — до рубежу.

        Якщо ти помилився в трьох і більше питаннях одного рядка таблиці, повтори всі його уроки, перш ніж іти далі: рубіж перевіряє ці ж ідеї на коді, якого ти ще не бачив. Питання, на які ти відповів неправильно, повернуться на сторінці «Повторення».
      en: |
        Now look back at your answers. Each question stands for one skill family. Give each one of three marks:

        - **Reliable** — you answered correctly and could explain why.
        - **Guessed** — the answer was right, but the explanation surprised you.
        - **Wrong** — you picked a wrong option.

        Choose **two families** marked “wrong” or “guessed” — the ones closest to the gate. Which question feeds which gate lesson:

        | Gate lesson | Questions about |
        |---|---|
        | Debugging | `let` in a loop · copying an array · `0.1 + 0.2` and the emoji · `Set` and `Map` · `finally` · `^1.4.2` · the test for `fits` |
        | Transfer | 31 January and `setMonth` · `Set` and `Map` · doubling the records · `<label>` · click phases · `unknown` in `tsc` |
        | Tests and review | the test for `fits` · `git reflog` |
        | Boundaries | `let` in a loop · `finally` · `fetch` and status 404 · `Proxy` |

        Reread the lessons named in the explanations of those questions and do their predictions again — before the gate.

        If you were wrong on three or more questions of one table row, revisit all its lessons before you go on: the gate checks the same ideas on code you have not seen. The questions you answered wrongly come back on the “Review” page.
