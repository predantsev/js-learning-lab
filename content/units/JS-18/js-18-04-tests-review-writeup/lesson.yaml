id: js-18-04-tests-review-writeup
unit: JS-18
title:
  uk: "Рубіж: тести, що ловлять дефект, рев’ю та звіт"
  en: "Gate: tests that catch it, review and write-up"
kind: assessment
minutes: 40
contentVersion: 1
purpose:
  uk: "Третя перевірка рубежу: без підказок ти доводиш тестами, що незнайома зміна ламає правило, показуєш, чого не може довести тест із заміною (mock), пишеш рев’ю й звіт про рішення, а потім у локальному репозиторії розв’язуєш конфлікт злиття так, щоб уціліли наміри обох гілок."
  en: "The third check of the gate: with no hints you prove with tests that an unseen change breaks a rule, show what a test with a stand-in (a mock) cannot prove, write a review and a decision write-up, and then, in a local repository, resolve a merge conflict so that the intent of both branches survives."
objectives:
  - uk: "Без підказок написати тести, що падають на наданій дефектній зміні й проходять на її виправленні, і пояснити, чого не міг би довести той самий тест із mock."
    en: "Write, without hints, tests that fail on a provided defective change and pass on its fix, and explain what a mocked version of the same test could not prove."
  - uk: "Переглянути зміну, розв’язати конфлікт злиття, з яким вона надходить, не втративши наміру жодної зі сторін, і написати короткий звіт про рішення."
    en: "Review the change, resolve the merge conflict it arrives with without losing either side's intent, and write a short decision write-up."
prerequisites: [js-18-03-unseen-transfer]
subskills:
  - { family: P-04, skill: "mocks vs actual evidence", depth: assess }
  - { family: P-04, skill: "documentation and code review", depth: assess }
glossary: []

blocks:
  - id: the-change
    kind: explanation
    title:
      uk: "Зміна, яка «лише спрощує»"
      en: "A change that “only simplifies”"
    body:
      uk: |
        Модуль бронювання кімнат зберігає бронювання як прості проміжки дат: `start` — день заїзду, `end` — день виїзду. Гість, що виїжджає 13 червня, звільняє кімнату для гостя, який заїжджає 13 червня. Головне правило — **два бронювання однієї кімнати не перетинаються**.

        Надійшов pull request «Simplify the overlap check» з одним зміненим рядком. Опис обіцяє, що поведінка не змінюється, а наявний тест сервісу проходить — але в ньому правила замінено підробкою.

        Дві частини, без підказок:

        1. **У пісочниці** — доводиш тестами, ламає зміна правило чи ні, показуєш, що доводить і чого не доводить тест із заміною, і пишеш рев’ю зі звітом.
        2. **У терміналі** — інша гілка того самого застосунку пройшла рев’ю, але її злиття з `main` дає конфлікт. Розв’язуєш його так, щоб збереглися обидва наміри, і доводиш це тестами.
      en: |
        A room-booking module stores bookings as plain date ranges: `start` is the arrival day, `end` the checkout day. A guest leaving on 13 June frees the room for a guest arriving on 13 June. The main rule — **two bookings of the same room never overlap**.

        A pull request “Simplify the overlap check” arrived with one changed line. Its description promises that the behavior does not change, and the existing service test passes — but in that test the rules are replaced by a stand-in.

        Two parts, with no hints:

        1. **In the sandbox** — you prove with tests whether the change breaks the rule or not, show what a test with a stand-in proves and what it does not, and write a review with a write-up.
        2. **In the terminal** — another branch of the same app passed review, but merging it into `main` gives a conflict. You resolve it so that both intents survive, and prove it with tests.

  - id: overlap-review
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: overlap-review
    entry: index.js
    editable: [bookings.test.js, review.js]
    strings:
      onMain: { uk: "Тести на main:", en: "Tests on main:" }
      inPullRequest: { uk: "Тести в pull request:", en: "Tests in the pull request:" }
      caseLine: { uk: "Твій випадок, canBook:", en: "Your case, canBook:" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Доведи, що зміна ламає правило, і напиши рев’ю"
      en: "Prove that the change breaks the rule, and write the review"
    instructions:
      uk: |
        Pull request змінює один рядок у `overlaps`:

        ```diff
         export function overlaps(booking, request) {
        -  return booking.room === request.room && booking.start < request.end && request.start < booking.end;
        +  return booking.room === request.room && request.start >= booking.start && request.start < booking.end;
         }
        ```

        `bookings.before.js` — правила на `main`, `bookings.js` — у pull request, `service.js` — сервіс, що завантажує бронювання, питає правила й зберігає. `index.js` запускає твої тести двічі — на `main` і в pull request — і показує твій випадок.

        1. У `bookings.test.js` допиши тести у функцію `bookingTests(rules)`: кожен тест перевіряє переданий модуль `rules`. Назви починай з виду тесту:
           - `unit: …` — правила напряму (`rules.overlaps`, `rules.canBook`);
           - `integration: …` — сервіс зі **справжніми** правилами й `memoryStore`;
           - `mocked: …` — сервіс, у якому правила замінено власною підробкою.

           На `main` мають проходити всі тести. У pull request має впасти хоча б один `unit` і хоча б один `integration`, а `mocked` — пройти.
        2. У `review.js`:
           - `failingCase` — наявне бронювання й запит до тієї самої кімнати, які pull request приймає, а `main` — ні;
           - `defectComment` — коментар до зміненого рядка з датами цього випадку;
           - `mockExplanation` — чому тест із заміною проходить на цій зміні (назви `canBook`);
           - `decision` — `"approve"` або `"request-changes"`;
           - `writeUp` — короткий звіт про рішення: рішення, доказ і що треба змінити (щонайменше 200 символів, з назвою `overlaps` і датою).

        Тексти можна писати українською або англійською.
      en: |
        The pull request changes one line in `overlaps`:

        ```diff
         export function overlaps(booking, request) {
        -  return booking.room === request.room && booking.start < request.end && request.start < booking.end;
        +  return booking.room === request.room && request.start >= booking.start && request.start < booking.end;
         }
        ```

        `bookings.before.js` holds the rules on `main`, `bookings.js` those in the pull request, and `service.js` the service that loads bookings, asks the rules and saves. `index.js` runs your tests twice — on `main` and in the pull request — and shows your case.

        1. In `bookings.test.js` add tests inside the function `bookingTests(rules)`: every test checks the `rules` module passed in. Start each name with the kind of test:
           - `unit: …` — the rules directly (`rules.overlaps`, `rules.canBook`);
           - `integration: …` — the service with the **real** rules and `memoryStore`;
           - `mocked: …` — the service with the rules replaced by your own stand-in.

           On `main` every test must pass. In the pull request at least one `unit` and at least one `integration` test must fail, and a `mocked` one must pass.
        2. In `review.js`:
           - `failingCase` — an existing booking and a request for the same room that the pull request accepts and `main` does not;
           - `defectComment` — a comment on the changed line with the dates of that case;
           - `mockExplanation` — why the test with a stand-in passes on this change (name `canBook`);
           - `decision` — `"approve"` or `"request-changes"`;
           - `writeUp` — a short decision write-up: the decision, the evidence and what has to change (at least 200 characters, naming `overlaps` and a date).

        You may write the texts in English or Ukrainian.
    testTitles:
      "your tests pass on main":
        uk: "Твої тести проходять на `main`"
        en: "Your tests pass on `main`"
      "a unit test fails on the pull request":
        uk: "Тест `unit:` падає в pull request"
        en: "A `unit:` test fails in the pull request"
      "an integration test fails on the pull request":
        uk: "Тест `integration:` падає в pull request"
        en: "An `integration:` test fails in the pull request"
      "a mocked test passes on both versions":
        uk: "Тест `mocked:` викликає сервіс із підробкою правил і проходить на обох версіях"
        en: "A `mocked:` test calls the service with a stand-in for the rules and passes on both versions"
      "failingCase is accepted by the pull request and refused on main":
        uk: "`failingCase` приймає pull request і відхиляє `main`"
        en: "`failingCase` is accepted by the pull request and refused on `main`"
      "the defect comment names the dates of the failing case":
        uk: "`defectComment` називає дати випадку"
        en: "`defectComment` names the dates of the failing case"
      "the mock explanation says what the stand-in replaced":
        uk: "`mockExplanation` каже, що замінила підробка"
        en: "`mockExplanation` says what the stand-in replaced"
      "the decision is request-changes":
        uk: "`decision` — `\"request-changes\"`"
        en: "`decision` is `\"request-changes\"`"
      "the write-up records the decision with its evidence":
        uk: "`writeUp` фіксує рішення з доказом"
        en: "`writeUp` records the decision with its evidence"
    solutionNote:
      uk: |
        Нова умова питає лише, чи **заїзд** запиту припадає на бронювання. Запит, що починається раніше й закінчується всередині (8–11 червня проти 10–13) чи після нього (накриває повністю), проходить — кімнату продають двічі. Межа «заїзд у день виїзду» в обох версіях поводиться однаково, тому тест лише на неї дефекту не бачить.

        `unit`-тест ловить дефект у самому правилі; `integration`-тест — що сервіс зі справжніми правилами справді не збереже подвійне бронювання. `mocked`-тест замінює `canBook` функцією з готовою відповіддю: він доводить лише те, що сервіс зберігає, коли правила дозволяють, — і проходить за будь-якого `overlaps`. Зелений mocked-тест у pull request — не доказ, що зміна безпечна.

        Рішення — request changes: коментар із конкретними датами, доказ (які тести падають і де) і вимога повернути двобічну перевірку `booking.start < request.end && request.start < booking.end`.
      en: |
        The new condition asks only whether the request’s **arrival** falls within the booking. A request that starts earlier and ends inside it (8–11 June against 10–13) or after it (covering it entirely) passes — the room is sold twice. The boundary “arriving on the checkout day” behaves the same in both versions, which is why a test of that boundary alone does not see the defect.

        A `unit` test catches the defect in the rule itself; an `integration` test that the service with the real rules really refuses to save a double booking. A `mocked` test replaces `canBook` with a function with a ready answer: it proves only that the service saves when the rules allow — and passes with any `overlaps`. A green mocked test in the pull request is no evidence that the change is safe.

        The decision is request changes: a comment with concrete dates, the evidence (which tests fail and where) and the requirement to restore the two-sided check `booking.start < request.end && request.start < booking.end`.
    feedback:
      - when: { test: "your tests pass on main" }
        message:
          uk: "Ця перевірка викликає твою `bookingTests` з правилами з `bookings.before.js` і очікує хоча б один тест і жодного, що падає. Тест має перевіряти переданий `rules`, а не імпортувати правила сам."
          en: "This check calls your `bookingTests` with the rules from `bookings.before.js` and expects at least one test and none failing. A test must check the `rules` passed in, not import rules itself."
      - when: { test: "a unit test fails on the pull request" }
        message:
          uk: "Ця перевірка викликає `bookingTests` з правилами pull request і очікує, що впаде хоча б один тест з назвою `unit: …`. Такий тест має стояти на випадку, де дві версії `overlaps` відповідають по-різному."
          en: "This check calls `bookingTests` with the pull request’s rules and expects at least one test named `unit: …` to fail. Such a test must sit on a case where the two versions of `overlaps` answer differently."
      - when: { test: "an integration test fails on the pull request" }
        message:
          uk: "Ця перевірка очікує, що в pull request впаде хоча б один тест `integration: …`. Інтеграційний тест передає сервісу справжній `rules`, а не підробку, — інакше правило в ньому не виконується."
          en: "This check expects at least one `integration: …` test to fail in the pull request. An integration test passes the service the real `rules`, not a stand-in — otherwise the rule does not run in it."
      - when: { test: "a mocked test passes on both versions" }
        message:
          uk: "Ця перевірка очікує тест `mocked: …`, який створює сервіс через `createBookingService` з власним об’єктом із функцією `canBook` замість `rules`, викликає `book` і проходить і на `main`, і в pull request."
          en: "This check expects a `mocked: …` test that creates the service with `createBookingService` and your own object with a `canBook` function instead of `rules`, calls `book`, and passes both on `main` and in the pull request."
      - when: { test: "failingCase is accepted by the pull request and refused on main" }
        message:
          uk: "Ця перевірка викликає `canBook([existing], request)` з `failingCase` в обох версіях і очікує `false` на `main` і `true` в pull request. Рядок «Твій випадок» у консолі показує саме це."
          en: "This check calls `canBook([existing], request)` with `failingCase` in both versions and expects `false` on `main` and `true` in the pull request. The “Your case” line in the console shows exactly that."
      - when: { test: "the defect comment names the dates of the failing case" }
        message:
          uk: "Ця перевірка очікує в `defectComment` щонайменше дві різні дати з `failingCase`, записані так само — `YYYY-MM-DD`."
          en: "This check expects `defectComment` to contain at least two different dates from `failingCase`, written the same way — `YYYY-MM-DD`."
      - when: { test: "the mock explanation says what the stand-in replaced" }
        message:
          uk: "Ця перевірка очікує в `mockExplanation` назву `canBook` і щонайменше 60 символів."
          en: "This check expects `mockExplanation` to name `canBook` and to have at least 60 characters."
      - when: { test: "the write-up records the decision with its evidence" }
        message:
          uk: "Ця перевірка очікує `writeUp` щонайменше з 200 символів, з назвою `overlaps` і хоча б однією датою `YYYY-MM-DD`."
          en: "This check expects `writeUp` to have at least 200 characters, the name `overlaps` and at least one `YYYY-MM-DD` date."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: в одному з файлів синтаксична помилка — назву файла й рядок видно в картці помилки. Перевір коми між полями в `review.js` і дужки навколо тестів."
          en: "The code could not start: one of the files has a syntax error — the error card shows the file name and line. Check the commas between fields in `review.js` and the brackets around the tests."
      - when: { error: TypeError }
        message:
          uk: "Під час запуску сталася `TypeError`. Якщо картка помилки вказує на `index.js`, перевір, що `review.js` і далі експортує `failingCase` з полями `existing` і `request`, а `bookings.test.js` — функцію `bookingTests`."
          en: "A `TypeError` happened while starting. If the error card points at `index.js`, check that `review.js` still exports `failingCase` with the fields `existing` and `request`, and `bookings.test.js` the function `bookingTests`."

  - id: merge-the-review
    kind: local-task
    runtime: local-web
    title:
      uk: "Злий гілку після рев’ю"
      en: "Merge the reviewed branch"
    intro:
      uk: |
        Новий репозиторій `~/js-course/rooms-lab`. Підготовку описано повністю: ти відтворюєш дві гілки, що розійшлися. Далі — лише завдання й те, що має вийти; команди обираєш сам.

        Історія: гілка `review/room-check` додає перевірку кімнати й пройшла рев’ю **R-12**. Тим часом у `main` з’явилася підтримка скасованих бронювань. Обидві зміни стосуються одного рядка коду й того самого місця у файлі тестів. Вивід команд-доказів збережи у `~/js-course/scratch/EVIDENCE.md`.

        **1. Підготовка — файли.** `bookings.mjs`:

        ```js
        // bookings.mjs: the room-booking rules. A booking: { room, start, end, cancelled }.
        // Dates are "YYYY-MM-DD"; end is the checkout day.
        export function overlaps(booking, request) {
          return booking.start < request.end && request.start < booking.end;
        }
        ```

        `bookings.test.mjs`:

        ```js
        // bookings.test.mjs: run with npm test.
        import { test } from "node:test";
        import assert from "node:assert/strict";
        import { overlaps } from "./bookings.mjs";

        const stay = { room: "A", start: "2026-06-10", end: "2026-06-13", cancelled: false };

        test("arriving on the checkout day does not overlap", () => {
          assert.equal(overlaps(stay, { room: "A", start: "2026-06-13", end: "2026-06-15" }), false);
        });

        test("a stay that starts before and ends inside overlaps", () => {
          assert.equal(overlaps(stay, { room: "A", start: "2026-06-08", end: "2026-06-11" }), true);
        });
        ```

        **2. Зміна в гілці `review/room-check`.** Заміни рядок `return` в `overlaps` на:

        ```js
          return booking.room === request.room && booking.start < request.end && request.start < booking.end;
        ```

        а в кінець `bookings.test.mjs` додай:

        ```js

        test("a stay in another room does not overlap", () => {
          assert.equal(overlaps(stay, { room: "B", start: "2026-06-08", end: "2026-06-11" }), false);
        });
        ```

        **3. Зміна на `main`.** Заміни той самий рядок на:

        ```js
          return !booking.cancelled && booking.start < request.end && request.start < booking.end;
        ```

        а в кінець `bookings.test.mjs` додай:

        ```js

        test("a cancelled booking frees its dates", () => {
          assert.equal(overlaps({ ...stay, cancelled: true }, { room: "A", start: "2026-06-11", end: "2026-06-12" }), false);
        });
        ```
      en: |
        A new repository, `~/js-course/rooms-lab`. The setup is described in full: you recreate two branches that diverged. After that, only the task and what must come out; you choose the commands.

        The story: the branch `review/room-check` adds a room check and passed review **R-12**. Meanwhile `main` gained support for cancelled bookings. Both changes touch the same line of code and the same place in the test file. Save the output of the evidence commands in `~/js-course/scratch/EVIDENCE.md`.

        **1. Setup — the files.** `bookings.mjs`:

        ```js
        // bookings.mjs: the room-booking rules. A booking: { room, start, end, cancelled }.
        // Dates are "YYYY-MM-DD"; end is the checkout day.
        export function overlaps(booking, request) {
          return booking.start < request.end && request.start < booking.end;
        }
        ```

        `bookings.test.mjs`:

        ```js
        // bookings.test.mjs: run with npm test.
        import { test } from "node:test";
        import assert from "node:assert/strict";
        import { overlaps } from "./bookings.mjs";

        const stay = { room: "A", start: "2026-06-10", end: "2026-06-13", cancelled: false };

        test("arriving on the checkout day does not overlap", () => {
          assert.equal(overlaps(stay, { room: "A", start: "2026-06-13", end: "2026-06-15" }), false);
        });

        test("a stay that starts before and ends inside overlaps", () => {
          assert.equal(overlaps(stay, { room: "A", start: "2026-06-08", end: "2026-06-11" }), true);
        });
        ```

        **2. The change on the branch `review/room-check`.** Replace the `return` line in `overlaps` with:

        ```js
          return booking.room === request.room && booking.start < request.end && request.start < booking.end;
        ```

        and add to the end of `bookings.test.mjs`:

        ```js

        test("a stay in another room does not overlap", () => {
          assert.equal(overlaps(stay, { room: "B", start: "2026-06-08", end: "2026-06-11" }), false);
        });
        ```

        **3. The change on `main`.** Replace the same line with:

        ```js
          return !booking.cancelled && booking.start < request.end && request.start < booking.end;
        ```

        and add to the end of `bookings.test.mjs`:

        ```js

        test("a cancelled booking frees its dates", () => {
          assert.equal(overlaps({ ...stay, cancelled: true }, { room: "A", start: "2026-06-11", end: "2026-06-12" }), false);
        });
        ```
    tools:
      - name: "Git"
        version: "2.28 or newer (checked with 2.51.0)"
      - name: "Node.js"
        version: "22.13 or newer (checked with 25.2.1)"
      - name: "A code editor"
        version: "VS Code or any plain-text editor"
    steps:
      - text:
          uk: "**Підготовка.** Створи теки `~/js-course/rooms-lab` і `~/js-course/scratch` (macOS і Linux: `mkdir -p ~/js-course/rooms-lab ~/js-course/scratch`; у Windows PowerShell, не перевірено, — `New-Item -ItemType Directory -Force ~/js-course/rooms-lab, ~/js-course/scratch`) і в `rooms-lab` — два файли з розділу 1 вище. Потім:"
          en: "**Setup.** Create the folders `~/js-course/rooms-lab` and `~/js-course/scratch` (macOS and Linux: `mkdir -p ~/js-course/rooms-lab ~/js-course/scratch`; in Windows PowerShell, not verified, `New-Item -ItemType Directory -Force ~/js-course/rooms-lab, ~/js-course/scratch`) and put the two files from section 1 above into `rooms-lab`. Then:"
        command: "cd ~/js-course/rooms-lab\nnpm init -y\nnpm pkg set \"scripts.test=node --test\"\ngit init -b main\ngit add bookings.mjs bookings.test.mjs package.json\ngit commit -m \"Start the room-booking rules\"\nnpm test"
        expect:
          uk: "`[main (root-commit) …] Start the room-booking rules`, `3 files changed`; тести — `ℹ pass 2`, `ℹ fail 0`."
          en: "`[main (root-commit) …] Start the room-booking rules`, `3 files changed`; the tests — `ℹ pass 2`, `ℹ fail 0`."
      - text:
          uk: "**Гілка після рев’ю.** Створи гілку й перейди на неї: `git switch -c review/room-check`. Зроби в ній зміну з розділу 2 вище (рядок `return` і новий тест у кінці `bookings.test.mjs`), потім перевір і закоміть:"
          en: "**The reviewed branch.** Create the branch and switch to it: `git switch -c review/room-check`. Make the change from section 2 above in it (the `return` line and a new test at the end of `bookings.test.mjs`), then check and commit:"
        command: "npm test\ngit commit -am \"Compare rooms before reporting an overlap\""
        expect:
          uk: "`ℹ pass 3`, `ℹ fail 0`; `[review/room-check …] Compare rooms before reporting an overlap`, `2 files changed, 5 insertions(+), 1 deletion(-)`."
          en: "`ℹ pass 3`, `ℹ fail 0`; `[review/room-check …] Compare rooms before reporting an overlap`, `2 files changed, 5 insertions(+), 1 deletion(-)`."
      - text:
          uk: "**Тим часом на `main`.** Повернися на `main`: `git switch main` — файли знову такі, як у підготовці. Зроби зміну з розділу 3 вище в тому самому рядку, додай її тест у кінець файла, а тоді:"
          en: "**Meanwhile on `main`.** Go back to `main`: `git switch main` — the files are again as in the setup. Make the change from section 3 above on the same line, add its test to the end of the file, and then:"
        command: "npm test\ngit commit -am \"Let a cancelled booking free its dates\"\ngit log --oneline --graph --all"
        expect:
          uk: |
            `ℹ pass 3`, `ℹ fail 0`, а граф розходиться на дві лінії:

            ```text
            * 30a9535 (HEAD -> main) Let a cancelled booking free its dates
            | * 8634aa9 (review/room-check) Compare rooms before reporting an overlap
            |/
            * 36e9fbd Start the room-booking rules
            ```

            Твої id commits будуть інші.
          en: |
            `ℹ pass 3`, `ℹ fail 0`, and the graph splits into two lines:

            ```text
            * 30a9535 (HEAD -> main) Let a cancelled booking free its dates
            | * 8634aa9 (review/room-check) Compare rooms before reporting an overlap
            |/
            * 36e9fbd Start the room-booking rules
            ```

            Your commit ids will differ.
      - text:
          uk: |
            **Завдання — без підказок.** Злий `review/room-check` у `main`. Розв’яжи конфлікт так, щоб уціліли **обидва** наміри: бронювання блокує дати лише тієї самої кімнати і лише тоді, коли його не скасовано, — а тести обох гілок лишилися. Доведи тестами й заверши злиття commit, повідомлення якого посилається на рев’ю `R-12`. Докази:
          en: |
            **The task — no hints.** Merge `review/room-check` into `main`. Resolve the conflict so that **both** intents survive: a booking blocks dates only of the same room and only when it is not cancelled — and the tests of both branches stay. Prove it with tests and complete the merge with a commit whose message refers to the review `R-12`. Evidence:
        command: "git diff --check\nnpm test\ngit log --oneline --graph -5"
        expect:
          uk: "`git diff --check` нічого не друкує; `ℹ tests 4`, `ℹ pass 4`, `ℹ fail 0`; у графі — merge commit, у який сходяться дві лінії, з `R-12` у повідомленні."
          en: "`git diff --check` prints nothing; `ℹ tests 4`, `ℹ pass 4`, `ℹ fail 0`; the graph shows a merge commit where two lines join, with `R-12` in its message."
    verify:
      - id: conflict-seen
        text:
          uk: "Злиття зупинилося з `CONFLICT (content)`, і я прочитав обидві сторони конфлікту, перш ніж редагувати."
          en: "The merge stopped with `CONFLICT (content)`, and I read both sides of the conflict before editing."
      - id: both-intents
        text:
          uk: "Розв’язаний рядок перевіряє і кімнату, і скасування; у файлі тестів лишилися тести обох гілок."
          en: "The resolved line checks both the room and cancellation; the test file kept the tests of both branches."
      - id: proven
        text:
          uk: "`git diff --check` чистий, `npm test` показав `pass 4`, `fail 0` до commit злиття."
          en: "`git diff --check` is clean, `npm test` showed `pass 4`, `fail 0` before the merge commit."
      - id: message
        text:
          uk: "Повідомлення merge commit посилається на рев’ю R-12, а вивід команд-доказів збережено в `EVIDENCE.md`. Усе зроблено мною, без чужого готового розв’язку."
          en: "The merge commit’s message refers to review R-12, and the output of the evidence commands is saved in `EVIDENCE.md`. I did everything myself, without someone else’s finished solution."
    troubleshooting:
      - problem:
          uk: "Після першого `git commit` Git пише `Your name and email address were configured automatically` (або відмовляє з `Author identity unknown`)"
          en: "After the first `git commit` Git prints `Your name and email address were configured automatically` (or refuses with `Author identity unknown`)"
        fix:
          uk: "Git не знає твого імені й пошти. Задай їх так, як у js-15-07 (спершу подивись поточні значення через `git config --global user.name`), а для вже створеного commit виконай `git commit --amend --reset-author --no-edit`."
          en: "Git does not know your name and email. Set them as in js-15-07 (look at the current values first with `git config --global user.name`), and for the commit already made run `git commit --amend --reset-author --no-edit`."
      - problem:
          uk: "`git diff --check` друкує `bookings.mjs:4: leftover conflict marker`, а `npm test` — `SyntaxError: Unexpected token '<<'`"
          en: "`git diff --check` prints `bookings.mjs:4: leftover conflict marker`, and `npm test` prints `SyntaxError: Unexpected token '<<'`"
        fix:
          uk: "У файлі лишилися позначки конфлікту `<<<<<<<`, `=======`, `>>>>>>>`. Прибери їх разом із варіантами, які ти замінив одним рядком, і запусти обидві команди знову."
          en: "Conflict markers `<<<<<<<`, `=======`, `>>>>>>>` are still in the file. Remove them together with the variants you replaced with one line, and run both commands again."
      - problem:
          uk: "Позначок конфлікту вже немає, але `npm test` пише `SyntaxError: Unexpected end of input` для `bookings.test.mjs`"
          en: "The conflict markers are gone, but `npm test` prints `SyntaxError: Unexpected end of input` for `bookings.test.mjs`"
        fix:
          uk: "Обидва нові тести закінчувалися тим самим рядком `});`, тож Git лишив його один — **після** конфлікту. Коли прибрано лише позначки, перший тест лишається без свого `});`. Кожен `test(…)` має закриватися власним `});`."
          en: "Both new tests ended with the same line `});`, so Git kept it once — **after** the conflict. When only the markers are removed, the first test is left without its `});`. Every `test(…)` must close with its own `});`."
      - problem:
          uk: "`npm test`: `✖ a stay in another room does not overlap` або `✖ a cancelled booking frees its dates`"
          en: "`npm test`: `✖ a stay in another room does not overlap` or `✖ a cancelled booking frees its dates`"
        fix:
          uk: "Розв’язання взяло лише одну сторону: тест іншої гілки й показує, чий намір загубився. Поверни в рядок `return` умову, якої бракує."
          en: "The resolution took only one side: the other branch’s test shows whose intent was lost. Put the missing condition back into the `return` line."
      - problem:
          uk: "`git merge` друкує `Fast-forward` або `Merge made by the 'ort' strategy.` замість `CONFLICT`"
          en: "`git merge` prints `Fast-forward` or `Merge made by the 'ort' strategy.` instead of `CONFLICT`"
        fix:
          uk: "`Fast-forward` означає, що на `main` після підготовки не було власного commit; `ort` без конфлікту — що гілки змінили різні рядки. Конфлікт виникає, лише коли обидві гілки змінили той самий рядок. Перевір через `git log --oneline --graph --all` і `git log -p`, що на обох гілках є свій commit і обидва змінили рядок `return` в `overlaps`; тоді почни лабораторну з підготовки в новій теці."
          en: "`Fast-forward` means `main` had no commit of its own after the setup; `ort` without a conflict means the branches changed different lines. A conflict happens only when both branches changed the same line. Check with `git log --oneline --graph --all` and `git log -p` that each branch has its own commit and both changed the `return` line in `overlaps`; then start the lab again from the setup in a new folder."
      - problem:
          uk: "Розгубився посеред злиття"
          en: "Got lost in the middle of the merge"
        fix:
          uk: "`git merge --abort` повертає стан до злиття; обидві гілки зі своїми commits лишаються."
          en: "`git merge --abort` returns to the state before the merge; both branches keep their commits."
    recovery:
      uk: "До commit злиття `git merge --abort` повертає все як було. Після нього закомічений стан знаходить `git reflog`. Якщо лабораторна заплуталася зовсім, видали лише теку `rooms-lab` (перевір назву!) і почни з підготовки — це навчальна тека."
      en: "Before the merge commit, `git merge --abort` puts everything back. After it, `git reflog` finds any committed state. If the lab got completely tangled, delete only the `rooms-lab` folder (check the name!) and start again from the setup — it is a practice folder."

  - id: after-the-check
    kind: review
    title:
      uk: "Після перевірки: конфлікти й підробки"
      en: "After the check: conflicts and stand-ins"
    items:
      - id: conflict-both-sides
        from: js-15-10-resolve-conflicts
        prompt:
          uk: |
            Конфлікт у рядку з порогом безкоштовної доставки:

            ```text
            <<<<<<< HEAD
            const freeDeliveryFrom = 150000;
            =======
            const freeDeliveryFrom = 120000; // minor units
            >>>>>>> feature/delivery
            ```

            На `main` поріг підняли до 1500 грн, у гілці — додали коментар про одиниці (і в ній поріг ще старий, 1200 грн). Яке розв’язання зберігає обидва наміри?
          en: |
            A conflict on the line with the free-delivery threshold:

            ```text
            <<<<<<< HEAD
            const freeDeliveryFrom = 150000;
            =======
            const freeDeliveryFrom = 120000; // minor units
            >>>>>>> feature/delivery
            ```

            On `main` the threshold was raised to 1500 UAH; the branch added a comment about the units (and still has the old threshold, 1200 UAH). Which resolution keeps both intents?
        answer:
          type: choice
          options:
            - id: combined
              code: "const freeDeliveryFrom = 150000; // minor units"
            - id: theirs
              code: "const freeDeliveryFrom = 120000; // minor units"
              why:
                uk: "Так загубиться намір `main`: поріг повернувся до старого значення. Гілка не змінювала поріг — він у ній просто старий."
                en: "That loses `main`’s intent: the threshold went back to the old value. The branch did not change the threshold — it is simply old there."
            - id: ours
              code: "const freeDeliveryFrom = 150000;"
              why:
                uk: "Так загубиться намір гілки — коментар про одиниці."
                en: "That loses the branch’s intent — the comment about the units."
          correct: [combined]
        explanation:
          uk: "Розв’язання конфлікту — не вибір «мого» чи «їхнього», а відновлення того, що хотіла кожна сторона, порівняно зі спільним предком. Потім — тести, що доводять обидва наміри. Тема — js-15-10."
          en: "Resolving a conflict is not choosing “mine” or “theirs” but restoring what each side wanted, compared with the common ancestor. Then — tests that prove both intents. Topic: js-15-10."
      - id: mock-proves
        from: js-09-05-mocks-vs-real
        prompt:
          uk: "Функція завантаження отримує `fetch` параметром. Тест передає їй підробку, що відповідає 200 з двома записами, і перевіряє, що сторінка показує два пункти. Що цей тест **не** може довести?"
          en: "A loading function gets `fetch` as a parameter. A test passes it a stand-in that answers 200 with two records and checks that the page shows two items. What can this test **not** prove?"
        answer:
          type: choice
          options:
            - id: real-server
              text: { uk: "Що справжній сервер відповідає саме таким форматом і що запит іде на правильну адресу з правильними даними", en: "That the real server answers in exactly this format and that the request goes to the right address with the right data" }
            - id: render
              text: { uk: "Що сторінка правильно показує два отримані записи", en: "That the page correctly shows the two records it got" }
              why:
                uk: "Саме це тест і доводить: код показу виконується по-справжньому з даними із підробки."
                en: "That is exactly what the test proves: the rendering code really runs with the data from the stand-in."
            - id: nothing
              text: { uk: "Нічого: якщо тест зелений, код працює", en: "Nothing: if the test is green, the code works" }
              why:
                uk: "Заглушка відповідає те, що написав автор тесту. Якщо справжній сервер змінив формат, тест і далі зелений."
                en: "The stand-in answers what the test’s author wrote. If the real server changed its format, the test stays green."
          correct: [real-server]
        explanation:
          uk: "Mock доводить поведінку коду **навколо** заміненої частини, але нічого не каже про саму замінену частину. Її перевіряє інший тест — зі справжньою залежністю. Тема — js-09-05."
          en: "A mock proves the behavior of the code **around** the replaced part, but says nothing about the replaced part itself. Another test — with the real dependency — checks that. Topic: js-09-05."
