    title:
      uk: "«Полити сьогодні»: від моделі до сторінки"
      en: "“Water today”: from the model to the page"
    instructions:
      uk: |
        Над кожною функцією в коментарях точно описано, що вона має робити. Коротко:

        - **`plants.ts`** — типи `PlantStatus` (union трьох статусів) і `Plant`; `parsePlants(input: unknown)` лишає лише дійсні записи як нові об’єкти з шістьма полями; `isDue(plant, today)` і `dueToday(plants, today)` — за таблицею статусів; `waterPlants(plants, ids, today)` повертає новий список, де рослини з цими `id` мають `lastWatered: today` і статус `"ok"`. Список може мати тисячі рослин, а `ids` — сотні: обери, як шукати `id`, щоб не переглядати весь `ids` для кожної рослини.
        - **`storage.ts`** — `savePlants` пише `{ "schemaVersion": 1, "plants": [...] }` під `STORAGE_KEY`; `loadPlants` ніколи не кидає помилку й для відсутніх, зіпсованих чи чужих даних дає `[]`.
        - **`ui.ts`** — `mount(root, storage, today)`: пункт списку на кожну рослину, яку треба полити, з кнопкою «Позначити политою: <назва>»; натискання поливає, зберігає, оновлює список, пише повідомлення в абзац `role="status"` і переводить фокус на кнопку, що тепер на тому самому місці (або на останню, або на заголовок, коли список порожній). `MARKUP` не змінюй.
        - **`plants.test.js`** — твої тести курсовим runner. Назву кожного тесту починай з рівня: `unit: …`, `integration: …` або `user: …` — обери рівень, який справді перевіряє ту поведінку. Дата «сьогодні» в тестах — зафіксована, не справжня.

        Перевірки викликають твої функції на власних даних, монтують сторінку в окремий контейнер і натискають кнопки. Одна перевірка **рахує читання `id`** — з рослин і зі списку `ids` — у `waterPlants` для 2000 рослин і 500 `id`. Твій `plants.test.js` запускається з еталонними модулями (мають пройти всі тести), із трьома зламаними версіями (кожну має впіймати хоч один тест) і двічі з підробленим годинником комп’ютера — 2025 і 2031 роки: результати мають бути ті самі.
      en: |
        The comments above each function describe exactly what it must do. In short:

        - **`plants.ts`** — the types `PlantStatus` (a union of the three statuses) and `Plant`; `parsePlants(input: unknown)` keeps only valid records, as new objects with six fields; `isDue(plant, today)` and `dueToday(plants, today)` — by the status table; `waterPlants(plants, ids, today)` returns a new list where the plants with these `id`s have `lastWatered: today` and the status `"ok"`. The list can hold thousands of plants and `ids` hundreds: choose how to look up an `id` so that the whole of `ids` is not scanned for every plant.
        - **`storage.ts`** — `savePlants` writes `{ "schemaVersion": 1, "plants": [...] }` under `STORAGE_KEY`; `loadPlants` never throws and gives `[]` for missing, damaged or foreign data.
        - **`ui.ts`** — `mount(root, storage, today)`: a list item for each plant to water, with a button “Mark watered: <name>”; pressing it waters, saves, updates the list, writes a message into the `role="status"` paragraph and moves focus to the button now in the same place (or the last one, or the heading when the list is empty). Do not change `MARKUP`.
        - **`plants.test.js`** — your tests with the course runner. Start every test name with its level: `unit: …`, `integration: …` or `user: …` — choose the level that really checks that behavior. “Today” in the tests is a fixed date, not the real one.

        The checks call your functions on their own data, mount the page in a separate container and press buttons. One check **counts `id` reads** — from the plants and from the `ids` list — in `waterPlants` for 2000 plants and 500 `id`s. Your `plants.test.js` runs with reference modules (every test must pass), with three broken versions (at least one test must catch each) and twice with the computer’s clock faked — to 2025 and to 2031: the results must stay the same.
