        message:
          uk: "Ця перевірка дає `parsePlants` вперемішку дійсні й недійсні записи (`null`, текст, `id` з пробілів, порожня назва, `intervalDays` 0 і 2.5, дата `\"20 May\"`, статус `\"dry\"`, `location`-число) і очікує лише два дійсні — як нові об’єкти рівно з шістьма полями, без зайвого поля `note`."
          en: "This check gives `parsePlants` valid and invalid records mixed together (`null`, text, an `id` of spaces, an empty name, `intervalDays` 0 and 2.5, the date `\"20 May\"`, the status `\"dry\"`, a number `location`) and expects only the two valid ones — as new objects with exactly six fields, without the extra field `note`."
