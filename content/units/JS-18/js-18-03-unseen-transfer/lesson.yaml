          uk: "Незмінне оновлення копіює лише змінений запис; решта спільні між старим і новим списком. Тому перевірка «той самий об’єкт» має сенс. Тема — js-04-10."
          en: "An immutable update copies only the changed record; the rest are shared between the old list and the new one. That is why the “same object” check makes sense. Topic: js-04-10."
