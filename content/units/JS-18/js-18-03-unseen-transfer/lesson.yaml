      - id: watered-copy
        from: js-04-10-immutable-updates
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const plants = [{ id: "a", day: 1 }, { id: "b", day: 1 }];
          const next = plants.map((plant) => (plant.id === "b" ? { ...plant, day: 2 } : plant));
          console.log(next[0] === plants[0], next[1] === plants[1], plants[1].day);
