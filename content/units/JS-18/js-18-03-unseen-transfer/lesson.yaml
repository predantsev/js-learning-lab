    solutionNote:
      uk: |
        **Модель.** `PlantStatus` — union `"ok" | "thirsty" | "resting"`, `Plant` — тип із шістьма полями. `parsePlants` приймає `unknown`, бо дані зі сховища ще ніхто не перевіряв: функція-guard `isPlant(value): value is Plant` перевіряє кожне поле, а `map` збирає нові об’єкти рівно з шістьма полями — зайві поля зі сховища не просочуються далі.

        **Статуси.** `isDue` — `switch` за `plant.status` з гілкою на кожен статус; гілка `default` з `const unknownStatus: never = plant.status` змусить `tsc` повідомити, якщо колись з’явиться четвертий статус. Межа «цей день включно» — порівняння `addDays(lastWatered, intervalDays) <= today` текстів `YYYY-MM-DD`.

        **Індекс.** `new Set(ids)` будується один раз за m кроків, а кожна перевірка `has` — одна операція: разом O(n + m). `ids.includes(plant.id)` для кожної рослини — O(n·m): перевірка нарахувала б сотні тисяч читань замість кількох тисяч. `Map` з позиціями рослин теж дає O(n + m).

        **Сторінка.** Справжні `<button>` уже працюють з клавіатури; текст абзацу з `role="status"` програма зчитування екрана оголошує сама. Після перемальовування стара кнопка зникає з документа, тож фокус треба поставити явно — інакше він падає на `<body>`.

        **Тести.** Рівень обирають за тим, що поведінка зачіпає: чисті функції — `unit`, збереження разом із читанням — `integration`, сторінка з натисканням — `user`. Свіжі фікстури в кожному тесті й зафіксоване `TODAY` роблять результат однаковим будь-якого дня.
      en: |
        **The model.** `PlantStatus` is the union `"ok" | "thirsty" | "resting"`, `Plant` a type with six fields. `parsePlants` takes `unknown`, because nobody has checked the data from storage yet: a guard function `isPlant(value): value is Plant` checks every field, and `map` builds new objects with exactly six fields — extra fields from storage do not leak further.

        **Statuses.** `isDue` is a `switch` on `plant.status` with a branch for every status; a `default` branch with `const unknownStatus: never = plant.status` makes `tsc` report it if a fourth status ever appears. The boundary “that day included” is the comparison `addDays(lastWatered, intervalDays) <= today` of `YYYY-MM-DD` texts.

        **The index.** `new Set(ids)` is built once in m steps, and each `has` check is one operation: O(n + m) in total. `ids.includes(plant.id)` for every plant is O(n·m): the check would count hundreds of thousands of reads instead of a few thousand. A `Map` of plant positions also gives O(n + m).

        **The page.** Real `<button>`s already work from the keyboard; a screen reader announces the text of a `role="status"` paragraph by itself. After a re-render the old button is gone from the document, so focus has to be placed explicitly — otherwise it falls to `<body>`.

        **Tests.** The level follows what the behavior touches: pure functions — `unit`, saving together with loading — `integration`, the page with a button press — `user`. Fresh fixtures in every test and a fixed `TODAY` make the result the same on any day.
