              why:
                uk: "`map` повертає новий масив, але незмінені рослини — ті самі об’єкти: функція повертає `plant` як є."
                en: "`map` returns a new array, but the unchanged plants are the same objects: the function returns `plant` as it is."
            - id: mutated
              code: "true false 2"
              why:
                uk: "`{ ...plant, day: 2 }` — новий об’єкт; початковий `plants[1]` не змінюється."
                en: "`{ ...plant, day: 2 }` is a new object; the original `plants[1]` does not change."
