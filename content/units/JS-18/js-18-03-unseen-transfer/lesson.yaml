id: js-18-03-unseen-transfer
unit: JS-18
title:
  uk: "Рубіж: перенесення на незнайомий синтетичний домен"
  en: "Gate: transfer to an unseen synthetic domain"
kind: assessment
minutes: 60
contentVersion: 1
purpose:
  uk: "Друга перевірка рубежу: у предметній області, якої в курсі ще не було, — журналі догляду за рослинами — ти без підказок будуєш невелику функцію від моделі даних до доступного інтерфейсу, обираєш рівень тесту для кожної поведінки й залишаєш код за чистим інтерфейсом модуля з README, яке пояснює рішення вимірами."
  en: "The second check of the gate: in a domain the course has not had yet — a plant-care log — you build, with no hints, a small feature from the data model to an accessible UI, choose the test level for each behavior, and leave the code behind a clean module interface with a README that explains the decisions with measurements."
objectives:
  - uk: "Без підказок збудувати невелику функцію для незнайомого синтетичного домену: типізовану модель і валідацію, чисті перетворення з обґрунтованим індексом, збереження, що відновлюється після недійсних даних у сховищі, і доступний інтерфейс."
    en: "Build, without hints, a small feature end to end for an unseen synthetic domain: typed model and validation, pure transforms with a justified index, persistence that recovers from invalid storage, and an accessible UI."
  - uk: "Обрати рівень тесту (unit, integration, рівень користувача) для кожної поведінки, використати детерміновані фікстури з зафіксованою датою «сьогодні» й залишити код за чистим інтерфейсом модуля."
    en: "Choose the test level (unit, integration, user-level) for each behavior, use deterministic fixtures with a fixed today-date, and leave the code behind a clean module interface."
prerequisites: [js-18-02-unseen-debug]
subskills:
  - { family: P-04, skill: "unit/integration/user/E2E purposes", depth: assess }
  - { family: P-04, skill: "deterministic fixtures", depth: assess }
  - { family: P-04, skill: "refactor/clean interfaces", depth: assess }
glossary: []

blocks:
  - id: the-domain
    kind: explanation
    title:
      uk: "Журнал догляду за рослинами"
      en: "A plant-care log"
    body:
      uk: |
        Нова предметна область — домашні рослини. У кожної рослини є назва, місце (кухня, підвіконня), інтервал поливу в днях, дата останнього поливу й **статус** — одне з трьох значень:

        | Статус | Що означає | Чи треба полити сьогодні |
        |---|---|---|
        | `"ok"` | звичайний догляд | так, якщо від останнього поливу минув інтервал (цей день включно) |
        | `"thirsty"` | рослина сохне | так, завжди |
        | `"resting"` | період спокою | ні, ніколи |

        Ти будуєш функцію «Полити сьогодні» повністю: модель і перевірку даних, чисті функції, збереження й сторінку зі списком, який працює з клавіатури й оголошує зміни. Потім — інтерфейс модуля й README.

        Підказок немає; попередні уроки й документація відкриті. Модулі написано на TypeScript: платформа **видаляє типи перед запуском і не повідомляє про помилки типів**, тож перевірки оцінюють поведінку, а правильність типів лишається на тобі (перевір їх локально через `tsc`, якщо маєш проєкт із JS-14).
      en: |
        A new domain — house plants. Every plant has a name, a location (kitchen, windowsill), a watering interval in days, the date it was last watered and a **status** — one of three values:

        | Status | What it means | Water it today? |
        |---|---|---|
        | `"ok"` | normal care | yes, once the interval has passed since the last watering (that day included) |
        | `"thirsty"` | the plant is drying out | yes, always |
        | `"resting"` | a dormant period | no, never |

        You build the “Water today” feature completely: the model and data validation, pure functions, persistence and a page with a list that works from the keyboard and announces changes. Then the module interface and the README.

        There are no hints; the earlier lessons and the documentation are open. The modules are written in TypeScript: the platform **removes the types before running and does not report type errors**, so the checks judge behavior, and type correctness is up to you (check it locally with `tsc` if you have the project from JS-14).

