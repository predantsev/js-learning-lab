      - when: { test: "mount lists the due plants, each with a named button" }
        message:
          uk: "Ця перевірка монтує сторінку з п’ятьма рослинами на 20 травня й очікує три пункти списку з текстом «<назва> · <місце>», у кожному — `<button>` з видимим текстом «Позначити политою: <назва>», який є і його доступною назвою."
          en: "This check mounts the page with five plants on 20 May and expects three list items with the text “<name> · <location>”, each with a `<button>` whose visible text “Mark watered: <name>” is also its accessible name."
      - when: { test: "pressing a button waters the plant, saves it and announces it" }
        message:
          uk: "Ця перевірка натискає другу кнопку й очікує: у списку два пункти, у сховищі ця рослина має `lastWatered` = сьогодні й статус `\"ok\"`, а абзац `role=\"status\"` містить «<назва> — полито»."
          en: "This check presses the second button and expects: two list items left, this plant in storage with `lastWatered` = today and the status `\"ok\"`, and the `role=\"status\"` paragraph holding “<name> — watered”."
      - when: { test: "focus stays in the list, then moves to the heading when the list empties" }
        message:
          uk: "Ця перевірка натискає кнопку єдиної рослини й очікує фокус на заголовку `#due-heading`; потім, у списку з трьох, натискає першу кнопку й очікує фокус на кнопці, що тепер перша; а натиснувши останню з трьох — фокус на кнопці, що тепер остання."
          en: "This check presses the button of the only plant and expects focus on the heading `#due-heading`; then, in a list of three, presses the first button and expects focus on the button that is now first; and after pressing the last of three — focus on the button that is now last."
      - when: { test: "your tests pass with the reference modules" }
        message:
          uk: "Ця перевірка запускає твій `plants.test.js` з еталонними `plants`, `storage` і `ui` та очікує хоча б один тест і жодного, що падає. Тести можуть покладатися лише на описану поведінку й на `MARKUP`."
          en: "This check runs your `plants.test.js` with reference `plants`, `storage` and `ui` and expects at least one test and none failing. Tests may rely only on the described behavior and on `MARKUP`."
      - when: { test: "your tests include unit, integration and user tests" }
        message:
          uk: "Спершу твої тести мають пройти з еталонними модулями (перевірка «Твої тести проходять з еталонними модулями»). Тоді ця перевірка очікує серед назв твоїх тестів такі, що починаються з `unit:`, `integration:` і `user:` — хоча б по одному."
          en: "First your tests must pass with the reference modules (the check “Your tests pass with the reference modules”). Then this check expects, among your test names, ones that start with `unit:`, `integration:` and `user:` — at least one of each."
      - when: { test: "your tests give the same results on any real date" }
        message:
          uk: "Ця перевірка двічі запускає твої тести з еталонними модулями, підробивши годинник комп’ютера на 1 січня 2025 і 15 липня 2031 року, й очікує, що всі пройдуть обидва рази. Тест, який бере справжню сьогоднішню дату, сьогодні проходить, а іншого дня — ні."
          en: "This check runs your tests with the reference modules twice, with the computer’s clock faked to 1 January 2025 and to 15 July 2031, and expects all of them to pass both times. A test that takes today’s real date passes today, but not on another day."
      - when: { test: "one of your tests fails when a resting plant counts as due" }
        message:
          uk: "Спершу твої тести мають пройти з еталонними модулями (перевірка «Твої тести проходять з еталонними модулями»). Тоді ця перевірка запускає їх з `isDue`, яка для `\"resting\"` дивиться на дату, як для `\"ok\"`, і очікує, що хоч один упаде."
          en: "First your tests must pass with the reference modules (the check “Your tests pass with the reference modules”). Then this check runs them with an `isDue` that treats `\"resting\"` by the date, like `\"ok\"`, and expects at least one to fail."
      - when: { test: "one of your tests fails when loadPlants throws on text that is not JSON" }
        message:
          uk: "Спершу твої тести мають пройти з еталонними модулями (перевірка «Твої тести проходять з еталонними модулями»). Тоді ця перевірка запускає їх з `loadPlants` без `try…catch` навколо `JSON.parse` і очікує, що хоч один упаде."
          en: "First your tests must pass with the reference modules (the check “Your tests pass with the reference modules”). Then this check runs them with a `loadPlants` without `try…catch` around `JSON.parse` and expects at least one to fail."
      - when: { test: "one of your tests fails when pressing the button saves nothing" }
        message:
          uk: "Спершу твої тести мають пройти з еталонними модулями (перевірка «Твої тести проходять з еталонними модулями»). Тоді ця перевірка запускає їх з `mount`, де натискання кнопки оновлює список, але нічого не зберігає, і очікує, що хоч один упаде."
          en: "First your tests must pass with the reference modules (the check “Your tests pass with the reference modules”). Then this check runs them with a `mount` where pressing the button updates the list but saves nothing, and expects at least one to fail."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: в одному з файлів синтаксична помилка — назву файла й рядок видно в картці помилки."
          en: "The code could not start: one of the files has a syntax error — the error card shows the file name and line."
      - when: { error: TypeError }
        message:
          uk: "Під час запуску сталася `TypeError`. Якщо картка помилки вказує на `main.ts`, то `loadPlants` чи `mount` повертає не те, що описано над ними, і сторінка не змонтувалася: подивись на рядок у картці."
          en: "A `TypeError` happened while starting. If the error card points at `main.ts`, then `loadPlants` or `mount` returns something other than what their comments describe, and the page did not mount: look at the line in the card."

  - id: interface-and-readme
    kind: exercise
    mode: guided
    assessment: true
    runtime: browser-js
    dir: interface-and-readme
    entry: index.js
    editable: [plant-care.ts, README.md]
    strings:
      benchLine: { uk: "Рослин", en: "Plants" }
    title:
      uk: "Інтерфейс модуля й README"
      en: "The module interface and the README"
    instructions:
      uk: |
        Функцію «Полити сьогодні» тепер підключає решта застосунку. Тут лежать модулі `plants.ts`, `storage.ts` і `ui.ts` — лише їхні сигнатури, без тіл: ця частина про **інтерфейс**, не про код. Інші частини застосунку використовують таке:

        - головна сторінка — `loadPlants`, `savePlants` і `mount`;
        - екран нагадувань — `dueToday`;
        - імпорт із файла — `parsePlants`;
        - пакетне позначення поливу — `waterPlants`.

        1. Напиши в `plant-care.ts` **публічний інтерфейс**: модуль, з якого решта застосунку імпортує ці шість функцій — і більше нічого, що існує під час виконання. Типи `Plant` і `PlantStatus` теж можна віддати (`export type`): після видалення типів вони зникають.
        2. Запусти програму: `index.js` вимірює два способи перевірити для кожної рослини, чи є її `id` у списку, — перегляд списку `id` щоразу й `Set` — на 2000 і 20 000 рослин.
        3. Напиши `README.md` — щонайменше чотири розділи з заголовками `## …`: публічні функції; форма даних (усі шість полів, три статуси, `schemaVersion`); вибір індексу з **виміряними** часами в `ms` із запуску; рівні тестів (`unit`, `integration`, `user` — англійськими словами, як їх називають розробники) і як їх запустити (`plants.test.js`).

        Перевірки читають експорти `plant-care.ts` і текст `README.md`. Те, що числа справді з твого запуску, перевірка встановити не може: це на твоїй чесності.
      en: |
        The rest of the app now connects to the “Water today” feature. Here are the modules `plants.ts`, `storage.ts` and `ui.ts` — only their signatures, without bodies: this part is about the **interface**, not the code. The other parts of the app use the following:

        - the main page — `loadPlants`, `savePlants` and `mount`;
        - the reminders screen — `dueToday`;
        - the import from a file — `parsePlants`;
        - batch marking of watering — `waterPlants`.

        1. Write the **public interface** in `plant-care.ts`: the module from which the rest of the app imports these six functions — and nothing else that exists at run time. You may also hand out the types `Plant` and `PlantStatus` (`export type`): once types are removed they disappear.
        2. Run the program: `index.js` measures two ways of checking, for every plant, whether its `id` is in the list — scanning the `id` list each time, and a `Set` — on 2000 and 20,000 plants.
        3. Write `README.md` — at least four sections with `## …` headings: the public functions; the data shape (all six fields, the three statuses, `schemaVersion`); the index choice with the **measured** times in `ms` from the run; the test levels (`unit`, `integration`, `user`) and how to run them (`plants.test.js`).

        The checks read the exports of `plant-care.ts` and the text of `README.md`. Whether the numbers really come from your run is something a check cannot establish: that is on your honesty.
    testTitles:
      "plant-care.ts exports exactly the six public functions":
        uk: "`plant-care.ts` експортує рівно шість публічних функцій"
        en: "`plant-care.ts` exports exactly the six public functions"
      "each public export is the function from its own module":
        uk: "Кожен публічний експорт — та сама функція з її власного модуля"
        en: "Each public export is the function from its own module"
      "the README has at least four sections":
        uk: "У README щонайменше чотири розділи `## …`"
        en: "The README has at least four `## …` sections"
      "the README names every public function":
        uk: "README називає кожну публічну функцію"
        en: "The README names every public function"
      "the README describes the plant data":
        uk: "README описує дані рослини: шість полів, три статуси, `schemaVersion`"
        en: "The README describes the plant data: six fields, three statuses, `schemaVersion`"
      "the README explains the index choice with measured times":
        uk: "README пояснює вибір індексу виміряними часами"
        en: "The README explains the index choice with measured times"
      "the README names the test levels and how to run the tests":
        uk: "README називає рівні тестів і як їх запустити"
        en: "The README names the test levels and how to run the tests"
    hints:
      nudge:
        uk: "Інтерфейс модуля — це перелік того, що інші **можуть** імпортувати. Почни з питання: що з `plants.ts`, `storage.ts` і `ui.ts` не потрібне жодній іншій частині застосунку?"
        en: "A module interface is the list of what others **may** import. Start with the question: what in `plants.ts`, `storage.ts` and `ui.ts` does no other part of the app need?"
      explanation:
        uk: |
          `export { a, b } from "./x.js"` реекспортує вибрані назви з іншого модуля — передає їх далі, не створюючи нових функцій, тож `api.a === x.a`. `export * from "./x.js"` віддає **все**, зокрема внутрішнє, — це протилежність чистого інтерфейсу. Наприклад, у модулі квитків:

          ```js
          export { bookSeat, cancelSeat } from "./seats.js";
          ```

          У README розділ про рішення називає вибір, відкинуту альтернативу й **доказ** — тут виміри з консолі (js-17-02, js-17-09).
        en: |
          `export { a, b } from "./x.js"` re-exports chosen names from another module without creating new functions, so `api.a === x.a`. `export * from "./x.js"` hands out **everything**, internals included — the opposite of a clean interface. For example, in a tickets module:

          ```js
          export { bookSeat, cancelSeat } from "./seats.js";
          ```

          In the README the decision section names the choice, the rejected alternative and the **evidence** — here the measurements from the console (js-17-02, js-17-09).
    solutionNote:
      uk: |
        `plant-care.ts` реекспортує шість функцій через `export { … } from` і два типи через `export type { … } from`. `isDue`, `STORAGE_KEY` і `MARKUP` лишаються внутрішніми: їх можна змінити, не зачепивши жодного модуля, що імпортує `plant-care.ts`. `export *` зробив би їх частиною інтерфейсу — і кожна зміна в них ламала б когось іззовні.

        README відповідає на питання наступного розробника: що можна викликати, яка форма даних, чому `Set`, а не перегляд (виміри: на 20 000 рослин перегляд понад удесятеро повільніший за `Set`, а з удесятеро більшою кількістю рослин удесятеро зростає й сам — як рослини × `id`), і як переконатися, що все працює. Числа в тебе будуть інші — у пісочниці таймер округлює час до 0.1 ms, — але співвідношення має бути тим самим.
      en: |
        `plant-care.ts` re-exports six functions through `export { … } from` and two types through `export type { … } from`. `isDue`, `STORAGE_KEY` and `MARKUP` stay internal: they can change without touching any module that imports `plant-care.ts`. `export *` would make them part of the interface — and every change to them would break someone outside.

        The README answers the next developer’s questions: what can be called, what the data looks like, why a `Set` rather than a scan (the measurements: at 20,000 plants the scan is more than ten times slower than the `Set`, and with ten times as many plants it grows tenfold itself — as plants × `id`s), and how to make sure everything works. Your numbers will differ — in the sandbox the timer rounds to 0.1 ms — but the ratio should be the same.
    feedback:
      - when: { test: "plant-care.ts exports exactly the six public functions" }
        message:
          uk: "Ця перевірка очікує серед експортів `plant-care.ts`, що існують під час виконання, рівно `dueToday`, `loadPlants`, `mount`, `parsePlants`, `savePlants`, `waterPlants` — без `isDue`, `STORAGE_KEY`, `MARKUP` і власних функцій."
          en: "This check expects the run-time exports of `plant-care.ts` to be exactly `dueToday`, `loadPlants`, `mount`, `parsePlants`, `savePlants`, `waterPlants` — without `isDue`, `STORAGE_KEY`, `MARKUP` or functions of your own."
      - when: { test: "each public export is the function from its own module" }
        message:
          uk: "Ця перевірка очікує, що кожен експорт `plant-care.ts` — це **та сама** функція, що в `plants.ts`, `storage.ts` чи `ui.ts`, а не нова обгортка навколо неї."
          en: "This check expects every export of `plant-care.ts` to be **the same** function as in `plants.ts`, `storage.ts` or `ui.ts`, not a new wrapper around it."
      - when: { test: "the README explains the index choice with measured times" }
        message:
          uk: "Ця перевірка шукає в `README.md` розділ `## …`, де названо `Set` або `Map` і є щонайменше два виміряні часи у вигляді числа з `ms`, наприклад `7.2 ms`."
          en: "This check looks in `README.md` for a `## …` section that names `Set` or `Map` and has at least two measured times written as a number with `ms`, for example `7.2 ms`."
      - when: { test: "the README describes the plant data" }
        message:
          uk: "Ця перевірка очікує в `README.md` окремими словами назви всіх полів (`id`, `name`, `location`, `intervalDays`, `lastWatered`, `status`), три статуси й `schemaVersion`."
          en: "This check expects `README.md` to contain, as separate words, the names of all fields (`id`, `name`, `location`, `intervalDays`, `lastWatered`, `status`), the three statuses and `schemaVersion`."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: у `plant-care.ts` синтаксична помилка — рядок видно в картці помилки. Перевір фігурні дужки й лапки навколо шляхів."
          en: "The code could not start: `plant-care.ts` has a syntax error — the error card shows the line. Check the braces and the quotes around the paths."

  - id: after-the-check
    kind: review
    title:
      uk: "Після перевірки: на чому стоїть ця функція"
      en: "After the check: what this feature stands on"
    items:
      - id: narrowing-status
        from: js-14-03-unions-narrowing
        prompt:
          uk: |
            Який тип має `result` усередині гілки `if`?

            ```ts
            type Parsed = { ok: true; plants: Plant[] } | { ok: false; errors: string[] };

            function report(result: Parsed): string {
              if (result.ok) {
                return `${result.plants.length} plants`;
              }
              return result.errors.join("; ");
            }
            ```
          en: |
            What type does `result` have inside the `if` branch?

            ```ts
            type Parsed = { ok: true; plants: Plant[] } | { ok: false; errors: string[] };

            function report(result: Parsed): string {
              if (result.ok) {
                return `${result.plants.length} plants`;
              }
              return result.errors.join("; ");
            }
            ```
        answer:
          type: choice
          options:
            - id: narrowed
              code: "{ ok: true; plants: Plant[] }"
            - id: both
              code: "{ ok: boolean; plants: Plant[]; errors: string[] }"
              why:
                uk: "Union — це «або один, або другий», а не «усе разом». Об’єкт має поля лише одного з членів, тож `errors` у гілці `ok: true` немає."
                en: "A union means “either one or the other”, not “everything together”. The object has the fields of only one member, so there is no `errors` in the `ok: true` branch."
            - id: unchanged
              code: "Parsed"
              why:
                uk: "Перевірка дискримінанта `ok` звужує тип: усередині `if` компілятор знає, що це член з `ok: true`. Інакше `result.plants` було б помилкою."
                en: "Checking the discriminant `ok` narrows the type: inside `if` the compiler knows it is the member with `ok: true`. Otherwise `result.plants` would be an error."
          correct: [narrowed]
        explanation:
          uk: "Літеральне поле-дискримінант (`ok: true` / `ok: false`) дозволяє звузити union однією перевіркою; після `if` лишається другий член. Тема — js-14-03."
          en: "A literal discriminant field (`ok: true` / `ok: false`) lets one check narrow the union; after the `if` the other member remains. Topic: js-14-03."
      - id: growth-check
        from: js-17-02-big-o-measured
        prompt:
          uk: "`ids.includes(plant.id)` для кожної рослини: рослин стало вдесятеро більше, `ids` — та сама кількість. У скільки разів зросте кількість порівнянь?"
          en: "`ids.includes(plant.id)` for every plant: there are ten times as many plants, the same number of `ids`. By what factor does the number of comparisons grow?"
        answer:
          type: choice
          options:
            - id: ten
              text: { uk: "Приблизно вдесятеро: робота — рослини × `id`, а змінився лише один множник", en: "About tenfold: the work is plants × `id`s, and only one factor changed" }
            - id: hundred
              text: { uk: "Удесятеро в квадраті — у сто разів", en: "Ten squared — a hundredfold" }
              why:
                uk: "Квадрат виходить, коли обидва множники ростуть разом (n × n). Тут `ids` не змінився, тож росте лише кількість рослин."
                en: "A square appears when both factors grow together (n × n). Here `ids` did not change, so only the number of plants grows."
            - id: same
              text: { uk: "Так само: `includes` — одна операція", en: "The same: `includes` is one operation" }
              why:
                uk: "`includes` переглядає масив до збігу — у гіршому разі весь. Одна операція — це `Set.has`."
                en: "`includes` scans the array until a match — in the worst case all of it. One operation is `Set.has`."
          correct: [ten]
        explanation:
          uk: "O(n·m) росте лінійно за кожним множником окремо. Вимір з двома розмірами показує саме це співвідношення, незалежно від швидкості комп’ютера. Тема — js-17-02."
          en: "O(n·m) grows linearly in each factor separately. A measurement at two sizes shows exactly this ratio, whatever the computer’s speed. Topic: js-17-02."
      - id: barrel-import
        from: js-07-06-esm-import-export
        prompt:
          uk: "`plant-care.js` містить `export { mount } from \"./ui.js\";`. Що отримає модуль, який написав `import { mount } from \"./plant-care.js\";`?"
          en: "`plant-care.js` holds `export { mount } from \"./ui.js\";`. What does a module that wrote `import { mount } from \"./plant-care.js\";` get?"
        answer:
          type: choice
          options:
            - id: same
              text: { uk: "Ту саму функцію `mount`, що експортує `ui.js`", en: "The very same `mount` function that `ui.js` exports" }
            - id: copy
              text: { uk: "Копію функції, зроблену під час імпорту", en: "A copy of the function made during the import" }
              why:
                uk: "Імпорт не копіює значення: це прив’язка до експорту іншого модуля. `export … from` лише передає цю прив’язку далі."
                en: "An import does not copy values: it is a binding to another module’s export. `export … from` only passes that binding on."
