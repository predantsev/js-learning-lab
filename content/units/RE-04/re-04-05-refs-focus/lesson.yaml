id: re-04-05-refs-focus
unit: RE-04
title:
  uk: "Refs і фокус у DOM"
  en: "Refs and DOM focus"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Тримати DOM-вузол через `useRef` і переводити на нього фокус після дії користувача, коли commit уже відбувся."
    en: "Hold a DOM node with useRef and move focus to it after a user action, once the commit has happened."
  - uk: "Пояснити, чому зміна `ref.current` не перемальовує компонент і чому через це ref — погане місце для даних, які показують на екрані."
    en: "Explain why changing ref.current does not re-render, and why that makes a ref the wrong place for displayed data."
  - uk: "Розумно повертати фокус після видалення запису чи закриття вбудованого редактора."
    en: "Restore focus sensibly after deleting a record or closing an inline editor."
prerequisites: [re-04-04-context-boundaries, js-06-12-focus-management]
subskills:
  - { family: R-04, skill: "refs/DOM focus", depth: intro }
glossary: [use-ref, dom-ref]
selfCheck: [predict-focus-after-delete, rename-control]

blocks:
  - id: lost-focus
    kind: explanation
    title:
      uk: "Куди дівається фокус, коли кнопка зникає"
      en: "Where focus goes when the button disappears"
    body:
      uk: |
        Користувач клавіатури натискає Tab до кнопки «Прибрати» й тисне Enter. React прибирає рядок разом із кнопкою, на якій стояв [[keyboard-focus|фокус]]. Елемента з фокусом більше немає, тож браузер віддає фокус `body`. Тепер фокусу не має жоден елемент: програма читання з екрана нічого не оголошує, Enter нічого не натискає, а куди поведе наступний Tab, вирішує браузер (Chrome, як показала перевірка, продовжує з місця прибраного рядка). Для того, хто працює без миші, це як загубити місце в книжці.

        Щоб повернути фокус туди, де він має сенс, потрібен сам DOM-вузол — наприклад, заголовок списку. JSX описує, **що** показати, але не дає вузла в руки. Для цього є [[use-ref|useRef]].
      en: |
        A keyboard user tabs to the “Remove” button and presses Enter. React removes the row together with the button that had the [[keyboard-focus|focus]]. The focused element is gone, so the browser gives focus to `body`. Now no element has focus: a screen reader announces nothing, Enter presses nothing, and where the next Tab goes is up to the browser (Chrome, as a check showed, continues from the removed row's place). For someone working without a mouse it is like losing your place in a book.

        To return focus to a place where it makes sense, you need the DOM node itself — for example, the list heading. JSX describes **what** to show, but it does not hand you the node. That is what [[use-ref|useRef]] is for.

  - id: ref-explained
    kind: explanation
    title:
      uk: "useRef: шухляда, яку React не перевіряє"
      en: "useRef: a drawer React does not check"
    body:
      uk: |
        `useRef(initial)` повертає об’єкт `{ current: initial }` — той самий об’єкт на кожному рендері. Якщо передати його в атрибут `ref` елемента JSX, React після commit покладе в `current` справжній DOM-вузол — це [[dom-ref|DOM ref]]:

        ```jsx
        const headingRef = useRef(null);
        // …
        <h2 ref={headingRef} tabIndex={-1}>Мої бажання</h2>
        // later, in a handler:
        headingRef.current.focus();
        ```

        `tabIndex={-1}` дозволяє заголовку отримати фокус програмно, але не додає його в порядок Tab.

        Дві речі важливі:

        - **Зміна `ref.current` не перемальовує компонент.** Ref — не «швидший стан». Число в ref, показане на екрані, застаріє, бо React не знає, що воно змінилося. Те, що бачить користувач, живе в стані; ref — для речей, які рендеру не потрібні: DOM-вузлів, номерів таймерів, позначок «що було минулого разу».
        - **Під час першого рендеру `ref.current` ще `null`**: вузол з’являється лише після commit. Перевірено в пісочниці з React 19.3.
      en: |
        `useRef(initial)` returns an object `{ current: initial }` — the same object on every render. If you pass it to the `ref` attribute of a JSX element, React puts the real DOM node into `current` after the commit — this is a [[dom-ref|DOM ref]]:

        ```jsx
        const headingRef = useRef(null);
        // …
        <h2 ref={headingRef} tabIndex={-1}>Wishes</h2>
        // later, in a handler:
        headingRef.current.focus();
        ```

        `tabIndex={-1}` lets the heading receive focus from code without adding it to the Tab order.

        Two things matter:

        - **Changing `ref.current` does not re-render the component.** A ref is not “faster state”. A number in a ref shown on the screen goes stale, because React does not know it changed. What the user sees lives in state; a ref is for things rendering does not need: DOM nodes, timer ids, “what it was last time” flags.
        - **During the first render `ref.current` is still `null`**: the node appears only after the commit. Checked in the sandbox with React 19.3.

  - id: predict-focus-after-delete
    kind: prediction
    prompt:
      uk: "Фокус стоїть на кнопці «Прибрати» другого бажання, і користувач тисне Enter. Де опиниться фокус після оновлення сторінки у версії A і у версії B?"
      en: "Focus is on the “Remove” button of the second wish, and the user presses Enter. Where does focus end up after the page updates, in version A and in version B?"
    code: |
      // Version A
      function remove(id) {
        setWishes(wishes.filter((wish) => wish.id !== id));
      }

      // Version B: the same, plus one line
      function remove(id) {
        setWishes(wishes.filter((wish) => wish.id !== id));
        headingRef.current.focus(); // <h2 ref={headingRef} tabIndex={-1}>
      }
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: body-heading
          text: { uk: "A — на `body`, B — на заголовку списку", en: "A — on `body`, B — on the list heading" }
        - id: next-button
          text: { uk: "A — на кнопці «Прибрати» наступного бажання, B — на заголовку", en: "A — on the “Remove” button of the next wish, B — on the heading" }
          why:
            uk: "Браузер не шукає «наступний» елемент за тебе. Вузол із фокусом прибрано з DOM, і фокус падає на `body`."
            en: "The browser does not look for the “next” element for you. The focused node was removed from the DOM, and focus falls to `body`."
        - id: stays
          text: { uk: "В обох — на тій самій кнопці: React лише змінює текст рядка", en: "In both — on the same button: React only changes the row's text" }
          why:
            uk: "Рядок має `key` бажання, тож React прибирає саме цей `<li>` разом із його кнопкою, а не переписує текст сусідніх."
            en: "The row has the wish's `key`, so React removes exactly that `<li>` with its button instead of rewriting the text of its neighbours."
        - id: b-fails
          text: { uk: "A — на `body`, а B падає: `headingRef.current` ще `null`", en: "A — on `body`, and B fails: `headingRef.current` is still `null`" }
          why:
            uk: "`null` у ref буває лише до першого commit. Клік стається, коли сторінку вже показано, тож заголовок давно в `headingRef.current`."
            en: "A ref holds `null` only before the first commit. The click happens when the page is already shown, so the heading has long been in `headingRef.current`."
      correct: [body-heading]
    explanation:
      uk: "У версії A прибрана кнопка забирає фокус із собою, і він падає на `body`. У версії B заголовок існує весь час, тож обробник може перевести фокус на нього одразу, а commit потім прибирає кнопку, яка фокусу вже не має. Перевірено в пісочниці з React 19.3: `document.activeElement` після оновлення — `BODY` у версії A і `H2` у версії B."
      en: "In version A the removed button takes focus with it, and it falls to `body`. In version B the heading exists all the time, so the handler can move focus to it right away, and the commit then removes a button that no longer has focus. Checked in the sandbox with React 19.3: `document.activeElement` after the update is `BODY` in version A and `H2` in version B."

  - id: recall-focus
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: focus-detached
        from: js-06-12-focus-management
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const button = document.createElement("button");
          document.body.append(button);
          button.focus();
          button.remove();
          console.log(document.activeElement === document.body);
        verify:
          logs: ["true"]
        answer:
          type: choice
          options:
            - id: "true"
              code: "true"
            - id: "false"
              code: "false"
              why:
                uk: "Вузол, прибраний з документа, не може тримати фокус. Браузер повертає фокус на `body`."
                en: "A node removed from the document cannot keep focus. The browser returns focus to `body`."
          correct: ["true"]
        explanation:
          uk: "Це правило DOM, а не React: прибрав елемент із фокусом — фокус на `body`. Тому після видалення чи перемальовування фокус переводять самі — у JS-06 через `querySelector`, у React через ref."
          en: "This is a DOM rule, not a React one: remove the focused element and focus goes to `body`. That is why after a removal or a re-render focus is moved by hand — in JS-06 through `querySelector`, in React through a ref."

  - id: delete-sequence
    kind: visual
    visual: sequence
    title:
      uk: "Видалення з клавіатури: без ref і з ref"
      en: "A keyboard delete: without a ref and with one"
    textEquivalent:
      uk: "Користувач тисне Enter на кнопці «Прибрати». Обробник викликає setWishes з новим списком. React рендерить новий список і під час commit прибирає з DOM рядок разом із кнопкою, що мала фокус; фокус падає на body. З виправленням обробник після setWishes ще й викликає headingRef.current.focus(): заголовок є в DOM весь час, тож фокус переходить на нього одразу, а commit потім прибирає кнопку, яка фокусу вже не має. Новий елемент, якого ще немає в DOM, отримати фокус з обробника не може — його фокусують в ефекті, після commit."
      en: "The user presses Enter on the “Remove” button. The handler calls setWishes with a new list. React renders the new list and during the commit removes the row from the DOM together with the focused button; focus falls to body. With the fix the handler also calls headingRef.current.focus() after setWishes: the heading is in the DOM all the time, so focus moves to it at once, and the commit then removes a button that no longer has focus. A new element that is not in the DOM yet cannot be focused from the handler — it is focused in an effect, after the commit."
    spec:
      actors:
        - { id: user, label: { uk: "Користувач", en: "User" } }
        - { id: react, label: "React" }
        - { id: dom, label: "DOM" }
      messages:
        - from: user
          to: react
          label: { uk: "Enter на «Прибрати»", en: "Enter on “Remove”" }
          caption:
            uk: "Фокус на кнопці «Прибрати». Enter запускає обробник, і той викликає `setWishes` з новим списком."
            en: "Focus is on the “Remove” button. Enter runs the handler, which calls `setWishes` with a new list."
        - from: react
          to: dom
          label: { uk: "commit: прибрати <li>", en: "commit: remove <li>" }
          caption:
            uk: "React рендерить новий список і під час commit прибирає рядок разом із кнопкою, що мала фокус."
            en: "React renders the new list and during the commit removes the row together with the focused button."
        - from: dom
          to: dom
          kind: note
          label: { uk: "фокус → body", en: "focus → body" }
          caption:
            uk: "Без ref: елемента з фокусом немає, фокус падає на `body`, і жоден елемент його не має."
            en: "Without a ref: the focused element is gone, focus falls to `body`, and no element has it."
        - from: react
          to: dom
          label: "headingRef.current.focus()"
          caption:
            uk: "З ref: обробник одразу після `setWishes` фокусує заголовок. Він є в DOM весь час, тож це можна зробити ще до commit."
            en: "With a ref: right after `setWishes` the handler focuses the heading. It is in the DOM all the time, so this can happen even before the commit."
        - from: dom
          to: dom
          kind: note
          label: { uk: "фокус на <h2>", en: "focus on <h2>" }
          caption:
            uk: "Commit прибирає кнопку, але фокус уже на заголовку. Новий елемент, якого ще немає в DOM, так не сфокусуєш — для нього потрібен ефект після commit."
            en: "The commit removes the button, but focus is already on the heading. A new element that is not in the DOM yet cannot be focused this way — it needs an effect after the commit."

  - id: delete-focus
    kind: example
    runtime: browser-react
    dir: delete-focus
    entry: main.jsx
    strings:
      heading: { uk: "Мої бажання", en: "My wishes" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      remove: { uk: "Прибрати", en: "Remove" }
      focusOn: { uk: "фокус на:", en: "focus is on:" }
    title:
      uk: "Видалення з клавіатури"
      en: "Deleting by keyboard"
    body:
      uk: |
        Ефект у `App.jsx` після кожної зміни списку друкує в **Консоль**, де зараз фокус. Натисни **Запустити**, клацни на **Сторінці** на порожньому місці над заголовком, тисни Tab, доки рамка фокусу не стане на «Прибрати Настільна лампа», і натисни Enter. Консоль: `фокус на: body` — жоден елемент сторінки фокусу не має.
      en: |
        An effect in `App.jsx` prints to the **Console** where the focus is after every change of the list. Press **Run**, click an empty spot above the heading on the **Page**, press Tab until the focus ring is on “Remove Desk lamp”, and press Enter. The console: `focus is on: body` — no element of the page has focus.
    tryIt:
      uk: |
        Додай ref заголовку:

        1. Під рядком `const [wishes, setWishes] = useState(WISHES);` додай `const headingRef = useRef(null);`.
        2. Заголовку дай атрибут: `<h2 ref={headingRef} tabIndex={-1}>`.
        3. У `remove` після `setWishes(…)` додай рядок `headingRef.current.focus();`.

        Запусти й видали бажання з клавіатури: консоль друкує `фокус на: h2 “Мої бажання”`, і наступний Tab веде до першої кнопки «Прибрати» під заголовком.
      en: |
        Give the heading a ref:

        1. Under the line `const [wishes, setWishes] = useState(WISHES);` add `const headingRef = useRef(null);`.
        2. Give the heading an attribute: `<h2 ref={headingRef} tabIndex={-1}>`.
        3. In `remove`, after `setWishes(…)`, add the line `headingRef.current.focus();`.

        Run and delete a wish by keyboard: the console prints `focus is on: h2 “My wishes”`, and the next Tab leads to the first “Remove” button under the heading.

  - id: after-commit
    kind: explanation
    title:
      uk: "Новий елемент фокусують в ефекті"
      en: "A new element is focused in an effect"
    body:
      uk: |
        Заголовок існував і до кліку. А поле вбудованого редактора з’являється **лише після** commit: в обробнику кліку `inputRef.current` ще `null`. А виклик `focus()` під час рендеру — помилка двічі: рендер має бути чистим, а вузла в ref на цьому рендері ще немає. Перевірено в пісочниці: `TypeError: Cannot read properties of null (reading 'focus')`, і застосунок зникає.

        Місце для дії «після commit» ти вже знаєш — ефект:

        ```jsx
        useEffect(() => {
          if (isOpen) panelRef.current.focus();
        }, [isOpen]);
        ```

        Повертати фокус після закриття так само, але з обережністю: ефект запускається й після першого показу, і фокус не можна красти, поки користувач нічого не робив. Позначку «чи було відкрито минулого разу» зручно тримати в ще одному ref — її не треба показувати, тож стан тут зайвий.
      en: |
        The heading existed before the click. But the field of an inline editor appears **only after** the commit: in the click handler `inputRef.current` is still `null`. And calling `focus()` during render is wrong twice over: render must be pure, and on that render the ref holds no node yet. Checked in the sandbox: `TypeError: Cannot read properties of null (reading 'focus')`, and the app disappears.

        You already know the place for an “after the commit” action — an effect:

        ```jsx
        useEffect(() => {
          if (isOpen) panelRef.current.focus();
        }, [isOpen]);
        ```

        Returning focus after closing works the same way, but carefully: the effect also runs after the first display, and focus must not be stolen while the user has done nothing. A “was it open last time” flag is handy to keep in one more ref — it is never shown, so state would be overkill here.

  - id: rename-control
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: rename-control
    entry: main.jsx
    editable: [App.jsx]
    strings:
      heading: { uk: "Мої бажання", en: "My wishes" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      newTickets: { uk: "Квитки в театр", en: "Theatre tickets" }
      rename: { uk: "Перейменувати", en: "Rename" }
      newName: { uk: "Нова назва", en: "New name" }
      save: { uk: "Зберегти", en: "Save" }
      cancel: { uk: "Скасувати", en: "Cancel" }
    title:
      uk: "Вбудоване перейменування з правильним фокусом"
      en: "Inline renaming with the right focus"
    instructions:
      uk: |
        Кожен рядок `WishRow` має кнопку **Перейменувати**. Вона замінює рядок на форму з полем «Нова назва», **Зберегти** і **Скасувати**. Перейменування вже працює, а фокус — ні: після відкриття він лишається невідомо де, а після закриття падає на `body`.

        Допиши `WishRow` так, щоб:

        - щойно форма відкрилася, фокус стояв у полі «Нова назва» цього рядка;
        - після **Скасувати** чи **Зберегти** фокус повертався на кнопку **Перейменувати** того самого рядка;
        - під час першого показу сторінки фокус не ставав нікуди.
      en: |
        Every `WishRow` has a **Rename** button. It replaces the row with a form with a “New name” field, **Save** and **Cancel**. Renaming already works, but focus does not: after opening it stays who knows where, and after closing it falls to `body`.

        Finish `WishRow` so that:

        - as soon as the form opens, focus is in the “New name” field of this row;
        - after **Cancel** or **Save** focus returns to the **Rename** button of the same row;
        - on the page's first display focus goes nowhere.
    testTitles:
      "nothing is focused on first display":
        uk: "Під час першого показу фокус нікуди не ставиться"
        en: "Nothing is focused on first display"
      "opening the editor focuses the name field":
        uk: "Відкриття редактора ставить фокус у поле назви"
        en: "Opening the editor focuses the name field"
      "cancel returns focus to the Rename button of that row":
        uk: "«Скасувати» повертає фокус на «Перейменувати» цього рядка"
        en: "“Cancel” returns focus to the “Rename” button of that row"
      "saving renames the wish and returns focus to its Rename button":
        uk: "«Зберегти» перейменовує бажання й повертає фокус на його «Перейменувати»"
        en: "“Save” renames the wish and returns focus to its “Rename” button"
    hints:
      nudge:
        uk: "Чи існує поле в DOM у момент кліку на «Перейменувати»? А кнопка — у момент кліку на «Скасувати»? Якщо ні, фокусувати треба тоді, коли commit уже відбувся."
        en: "Does the field exist in the DOM at the moment “Rename” is clicked? And the button, at the moment “Cancel” is clicked? If not, focus has to happen once the commit is done."
      explanation:
        uk: |
          Дай полю й кнопці по ref і фокусуй їх в ефекті, що залежить від `editing`. Щоб ефект не ставив фокус під час першого показу, він має знати, чи редактор був відкритий на попередньому commit, — це позначка, яку не показують, тож вона живе в ref і оновлюється в кінці ефекту.

          Схожий прийом в іншій задачі: лічильник, який має друкувати повідомлення після кожної зміни, але не після першого показу, тримає позначку в ref — `const isFirstCommit = useRef(true);`, а в ефекті з залежністю `[count]` спершу перевіряє її: якщо це перший commit, ставить `isFirstCommit.current = false` і більше нічого не робить.
        en: |
          Give the field and the button a ref each and focus them in an effect that depends on `editing`. So that the effect does not set focus on the first display, it must know whether the editor was open on the previous commit — a flag nobody sees, so it lives in a ref and is updated at the end of the effect.

          The same technique in a different task: a counter that must print a message after every change, but not after the first display, keeps a flag in a ref — `const isFirstCommit = useRef(true);` — and its effect with the dependency `[count]` checks it first: on the first commit it sets `isFirstCommit.current = false` and does nothing else.
    solutionNote:
      uk: "Поле й кнопка з’являються лише після commit, тож фокусує їх ефект із залежністю `[editing]`, а не обробник і не рендер. Ref `wasEditing` пам’ятає попередній режим: на першому показі він `false`, і ефект нічого не фокусує, а після закриття — `true`, і фокус повертається на «Перейменувати». Цей ref не показують, тому він не стан: його зміна нічого не має перемальовувати. Атрибут `autoFocus` на полі — теж робочий спосіб для відкриття."
      en: "The field and the button appear only after the commit, so an effect with the dependency `[editing]` focuses them, not the handler and not the render. The `wasEditing` ref remembers the previous mode: on the first display it is `false` and the effect focuses nothing, and after closing it is `true`, so focus returns to “Rename”. This ref is never shown, so it is not state: changing it must re-render nothing. The `autoFocus` attribute on the field is also a working way to handle opening."
    feedback:
      - when: { test: "nothing is focused on first display" }
        message:
          uk: "Ця перевірка показує список і очікує, що фокус не стоїть на жодному елементі списку. Ефект запускається й після першого показу, тож фокус на «Перейменувати» має повертатися лише після того, як редактор був відкритий."
          en: "This check shows the list and expects focus on no element of the list. An effect also runs after the first display, so focus may return to “Rename” only after the editor has been open."
      - when: { test: "opening the editor focuses the name field" }
        message:
          uk: "Ця перевірка клацає «Перейменувати» в другому рядку й очікує фокус у полі «Нова назва» зі значенням «Настільна лампа». У момент кліку поля ще немає в DOM — фокус ставлять після commit."
          en: "This check clicks “Rename” in the second row and expects focus in the “New name” field with the value “Desk lamp”. At the moment of the click the field is not in the DOM yet — focus is set after the commit."
      - when: { test: "cancel returns focus to the Rename button of that row" }
        message:
          uk: "Ця перевірка відкриває й скасовує редактор другого рядка й очікує фокус на кнопці «Перейменувати» саме цього рядка."
          en: "This check opens and cancels the editor of the second row and expects focus on the “Rename” button of exactly that row."
      - when: { test: "saving renames the wish and returns focus to its Rename button" }
        message:
          uk: "Ця перевірка в третьому рядку вводить «Квитки в театр», зберігає й очікує нову назву в рядку та фокус на його «Перейменувати»."
          en: "This check, in the third row, types “Theatre tickets”, saves and expects the new name in the row and focus on its “Rename”."
      - when: { error: TypeError }
        message:
          uk: "Якщо в консолі `Cannot read properties of null (reading 'focus')`, `focus()` викликано тоді, коли в ref ще немає вузла: під час рендеру або для елемента, який з’явиться лише після commit. Перенеси виклик в ефект. Якщо помилка сталася під час рендеру, список зникає, і решта перевірок теж не проходить — спершу виправ першу помилку в консолі."
          en: "If the console shows `Cannot read properties of null (reading 'focus')`, `focus()` was called while the ref held no node yet: during render, or for an element that appears only after the commit. Move the call into an effect. If the error happened during render, the list disappears and the other checks fail too — fix the first console error first."

  - id: to-project
    kind: transfer
    capstoneStep: RE-04
    body:
      uk: "У кроці проєкту цього розділу після видалення запису фокус перейде на наступний запис або, якщо записів не лишилося, на заголовок списку — через ref. Перевір це з клавіатури: Tab до кнопки «Видалити», Enter, потім Enter на «Так, видалити» — і подивись, де фокус."
      en: "In this unit's project step, after a record is deleted focus moves to the next record or, when none are left, to the list heading — through a ref. Check it by keyboard: Tab to the “Delete” button, Enter, then Enter on “Yes, delete” — and see where focus is."
