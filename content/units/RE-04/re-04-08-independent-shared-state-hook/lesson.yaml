id: re-04-08-independent-shared-state-hook
unit: RE-04
title:
  uk: "Самостійно: мінімальний спільний стан і хук даних"
  en: "Independent: minimal shared state and a data hook"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Перевірка без підказок: чи вмієш ти сам перебудувати робочий, але погано влаштований застосунок — підняти лише спільний стан, провести всі переходи через типізований reducer із відхиленням неможливих, винести збереження в хук даних із контрактом і доглянути фокус клавіатури після додавання й видалення."
  en: "A check without hints: can you rebuild a working but badly structured app on your own — lift only the shared state, route every transition through a typed reducer that rejects impossible ones, move persistence into a data hook with a contract, and take care of keyboard focus after adding and deleting?"
objectives:
  - uk: "Без підказок побудувати невеликий застосунок записів, де піднято лише спільний стан, переходи йдуть через типізований reducer, збереженням володіє типізований хук даних, а фокус клавіатури керований після створення й видалення."
    en: "Build, without hints, a small record app where only the shared state is lifted, transitions go through a typed reducer, a typed data hook owns persistence and keyboard focus is managed after create and delete."
prerequisites: [re-04-07-debug-ownership-hooks]
subskills:
  - { family: R-03, skill: "lifting state", depth: assess }
  - { family: R-03, skill: "local/shared placement", depth: assess }
  - { family: R-04, skill: "refs/DOM focus", depth: assess }
  - { family: R-04, skill: "custom hook contracts", depth: assess }
  - { family: P-05, skill: "typed props/state/events/hooks", depth: practice }
  - { family: P-05, skill: "typed reducers/context", depth: practice }
glossary: []
selfCheck: [expense-board]

blocks:
  - id: brief
    kind: explanation
    title:
      uk: "Що буде перевірено"
      en: "What will be checked"
    body:
      uk: |
        У вправі нижче — трекер витрат зі списком, панеллю деталей, підсумком і формою. Він працює, але весь стан, разом із чернеткою форми, лежить у кореневому компоненті, переходи розкидано по обробниках, нічого не зберігається, а фокус після видалення падає на `body`.

        Ти перебудуєш його з того, що вивчив у розділі: що де живе, reducer з типізованими actions, хук даних із контрактом і refs для фокусу. Підказок немає. Перевірки приховані, але кожну з них описано в завданні.
      en: |
        The exercise below is an expense tracker with a list, a detail panel, a summary and a form. It works, but all its state, the form draft included, sits in the root component, the transitions are spread across the handlers, nothing is stored, and after a delete focus falls to `body`.

        You will rebuild it with what you learned in this unit: what lives where, a reducer with typed actions, a data hook with a contract and refs for focus. There are no hints. The checks are hidden, but each of them is described in the task.

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: number-is-not-integer
        from: js-14-10-independent-typed-model
        prompt:
          uk: "Тип `Expense` має поле `amountMinor: number`. `tsc` пропускає `{ amountMinor: 12.5 }`. Що надрукує цей код?"
          en: "The type `Expense` has a field `amountMinor: number`. `tsc` accepts `{ amountMinor: 12.5 }`. What does this code print?"
        code: |
          console.log(Number.isInteger(12.5), Number.isInteger(1250), Number.isInteger("1250"));
        verify:
          logs: ["false true false"]
        answer:
          type: choice
          options:
            - id: right
              code: "false true false"
            - id: text-ok
              code: "false true true"
              why:
                uk: "`Number.isInteger` не перетворює текст на число: для будь-чого, що не є числом, він повертає `false`."
                en: "`Number.isInteger` does not convert text to a number: for anything that is not a number it returns `false`."
            - id: all-true
              code: "true true true"
              why:
                uk: "`12.5` — число, але не ціле. Тип `number` у TypeScript не розрізняє цілі й дробові числа — це робить лише перевірка під час виконання."
                en: "`12.5` is a number, but not a whole one. The TypeScript type `number` does not tell whole numbers from fractions — only a runtime check does."
          correct: [right]
        explanation:
          uk: "`tsc` гарантує форму, а не всі правила: «сума в мінорних одиницях — ціле додатне число» перевіряє лише код під час виконання. У reducer це місце, де неможливий перехід відхиляється."
          en: "`tsc` guarantees the shape, not every rule: “an amount in minor units is a positive whole number” is checked only by code at runtime. In a reducer this is the place where an impossible transition is rejected."

  - id: expense-board
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-react
    dir: expense-board
    entry: main.tsx
    editable: [App.tsx, expensesReducer.ts, useExpenses.ts]
    strings:
      heading: { uk: "Мої витрати", en: "My expenses" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      lunch: { uk: "Обід", en: "Lunch" }
      remove: { uk: "Прибрати", en: "Remove" }
      pick: { uk: "Вибери витрату, щоб побачити деталі.", en: "Pick an expense to see its details." }
      total: { uk: "Разом:", en: "Total:" }
      labelField: { uk: "Назва", en: "Label" }
      amountField: { uk: "Сума", en: "Amount" }
      add: { uk: "Додати", en: "Add" }
    title:
      uk: "Трекер витрат: reducer, хук даних і фокус"
      en: "An expense tracker: a reducer, a data hook and focus"
    instructions:
      uk: |
        `expenses.ts` і `renders.js` — лише для читання; `START_EXPENSES` заморожено, тож спроба змінити його кидає `TypeError`. Розмітку й назви компонентів (`ExpenseApp`, `ExpenseList`, `ExpenseDetail`, `Summary`, `AddExpenseForm`) лиши такими, як у початковому коді; змінюй, де живе стан і як він змінюється.

        **1. `expensesReducer.ts`.** Тип `ExpenseAction` — discriminated union з трьох actions. `expensesReducer(state, action)` працює з `ExpensesState` (`{ expenses, selectedId }`) і ніколи не змінює отриманий стан:

        | Action | Перехід | Коли відхиляється (повертається **той самий** об’єкт стану) |
        |---|---|---|
        | `{ type: "added", expense }` | витрата в кінці списку | назва порожня після обрізання пробілів, `amountMinor` — не ціле додатне число, такий `id` уже є |
        | `{ type: "removed", id }` | витрату прибрано; якщо вона була вибрана, `selectedId` стає `null` | такого `id` немає |
        | `{ type: "selected", id }` | `selectedId` стає `id` | такого `id` немає |

        **2. `useExpenses.ts`.** Хук `useExpenses(key)` повертає `[state, dispatch]` цього reducer. На старті нічого не вибрано, а список — масив, збережений під `key`; якщо там нічого немає, текст пошкоджений чи це не масив — `START_EXPENSES`. Після кожної зміни списку весь список записано під `key`. Кожен виклик має власний стан і працює лише зі своїм ключем. Над хуком напиши контракт (перевірки коментарі не читають).

        **3. `App.tsx`.** `ExpenseApp` бере стан і `dispatch` з `useExpenses(STORAGE_KEY)`. Чернетка форми живе лише в `AddExpenseForm`. Фокус:

        - після успішного додавання — у полі «Назва» (порожньому);
        - після видалення — на кнопці з назвою **наступної** витрати (та, що має `data-id`), а якщо наступної немає — на заголовку `h2` списку.

        Приховані перевірки викликають reducer напряму із замороженим станом (зокрема з неможливими переходами), викликають хук у двох компонентах-зондах із різними ключами, кладуть у сховище пошкоджені значення, рахують рендери під час введення у форму й додають та прибирають витрати клавіатурою (Enter у полі «Сума», Enter на кнопці «Прибрати»).
      en: |
        `expenses.ts` and `renders.js` are read-only; `START_EXPENSES` is frozen, so an attempt to change it throws a `TypeError`. Keep the markup and the component names (`ExpenseApp`, `ExpenseList`, `ExpenseDetail`, `Summary`, `AddExpenseForm`) as in the starting code; change where state lives and how it changes.

        **1. `expensesReducer.ts`.** The type `ExpenseAction` is a discriminated union of three actions. `expensesReducer(state, action)` works with `ExpensesState` (`{ expenses, selectedId }`) and never changes the state it receives:

        | Action | Transition | When it is rejected (**the same** state object is returned) |
        |---|---|---|
        | `{ type: "added", expense }` | the expense at the end of the list | the label is empty after trimming spaces, `amountMinor` is not a positive whole number, the `id` is already taken |
        | `{ type: "removed", id }` | the expense is removed; if it was selected, `selectedId` becomes `null` | there is no such `id` |
        | `{ type: "selected", id }` | `selectedId` becomes `id` | there is no such `id` |

        **2. `useExpenses.ts`.** The hook `useExpenses(key)` returns `[state, dispatch]` of this reducer. At the start nothing is selected, and the list is the array stored under `key`; if nothing is there, the text is damaged or it is not an array — `START_EXPENSES`. After every change of the list the whole list is stored under `key`. Every call has its own state and works only with its own key. Write the contract above the hook (the checks do not read comments).

        **3. `App.tsx`.** `ExpenseApp` takes the state and `dispatch` from `useExpenses(STORAGE_KEY)`. The form draft lives only in `AddExpenseForm`. Focus:

        - after a successful add — in the “Label” field (empty);
        - after a delete — on the name button of the **next** expense (the one with `data-id`), and if there is no next one — on the list's `h2` heading.

        The hidden checks call the reducer directly with frozen state (impossible transitions included), call the hook in two probe components with different keys, put damaged values into storage, count renders while typing into the form, and add and remove expenses by keyboard (Enter in the “Amount” field, Enter on a “Remove” button).
    testTitles:
      "the reducer adds, selects and removes without changing the old state":
        uk: "Reducer додає, вибирає й прибирає, не змінюючи старий стан"
        en: "The reducer adds, selects and removes without changing the old state"
      "removing the selected expense clears the selection":
        uk: "Видалення вибраної витрати скидає вибір"
        en: "Removing the selected expense clears the selection"
      "invalid transitions return the same state object":
        uk: "Неможливі переходи повертають той самий об’єкт стану"
        en: "Invalid transitions return the same state object"
      "two calls of useExpenses keep separate lists under their own keys":
        uk: "Два виклики `useExpenses` мають окремі списки під своїми ключами"
        en: "Two calls of `useExpenses` keep separate lists under their own keys"
      "damaged storage falls back to the starting list":
        uk: "Пошкоджене сховище дає початковий список"
        en: "Damaged storage falls back to the starting list"
      "the page selects, sums and remembers expenses":
        uk: "Сторінка вибирає, підсумовує й пам’ятає витрати"
        en: "The page selects, sums and remembers expenses"
      "typing in the form re-renders only the form":
        uk: "Введення у форму перемальовує лише форму"
        en: "Typing in the form re-renders only the form"
      "after a keyboard add, focus is back in the label field":
        uk: "Після додавання з клавіатури фокус знову в полі «Назва»"
        en: "After a keyboard add, focus is back in the label field"
      "after a keyboard delete, focus moves to the next expense or the heading":
        uk: "Після видалення з клавіатури фокус переходить на наступну витрату або на заголовок"
        en: "After a keyboard delete, focus moves to the next expense or the heading"
    solutionNote:
      uk: "Стан застосунку — список і вибір — потрібен списку, панелі деталей і підсумку, тож він живе в `ExpenseApp`, але змінюється лише через reducer: кожен перехід описано один раз, а неможливий повертає той самий стан, тож React не робить commit і екран не змінюється. `useExpenses` ховає `localStorage`: читає збережене один раз (третій аргумент `useReducer` обчислює початковий стан з другого лише на першому рендері) і записує список в ефекті з залежностями `[key, state.expenses]`. Чернетка — у формі, тож введення рендерить лише форму. Поле «Назва», кнопка наступної витрати й заголовок є в DOM уже в момент кліку, тож обробник може сфокусувати їх одразу — так розв’язок робить із полем. Для видалення він натомість запам’ятовує ціль у ref і переводить фокус в ефекті після commit; обидва способи правильні, а ефект знадобиться, коли ціль з’являється лише після цього commit."
      en: "The app state — the list and the selection — is needed by the list, the detail panel and the summary, so it lives in `ExpenseApp`, but it changes only through the reducer: every transition is described once, and an impossible one returns the same state, so React makes no commit and the screen does not change. `useExpenses` hides `localStorage`: it reads what is stored once (the third argument of `useReducer` computes the initial state from the second only on the first render) and stores the list in an effect with the dependencies `[key, state.expenses]`. The draft is in the form, so typing renders only the form. The “Label” field, the next expense's button and the heading are all in the DOM at the moment of the click, so a handler can focus them at once — that is what the solution does with the field. For a delete it instead remembers the target in a ref and moves focus in an effect after the commit; both ways are correct, and the effect is what you need when the target appears only with that commit."
    feedback:
      - when: { test: "the reducer adds, selects and removes without changing the old state" }
        message:
          uk: "Ця перевірка з замороженого стану додає `e-20`, вибирає `e-02` і прибирає `e-01`, очікуючи списки `e-01…e-20` і `e-02, e-03, e-20` та вибір `e-02`. Зміна замороженого стану кидає `TypeError` — повертай нові масиви й об’єкти."
          en: "This check, from frozen state, adds `e-20`, selects `e-02` and removes `e-01`, expecting the lists `e-01…e-20` and `e-02, e-03, e-20` and the selection `e-02`. Changing frozen state throws a `TypeError` — return new arrays and objects."
      - when: { test: "removing the selected expense clears the selection" }
        message:
          uk: "Ця перевірка вибирає `e-03`, прибирає її й очікує `selectedId: null`."
          en: "This check selects `e-03`, removes it and expects `selectedId: null`."
      - when: { test: "invalid transitions return the same state object" }
        message:
          uk: "Ця перевірка надсилає шість неможливих actions — суми `12.5` і `0`, назву з пробілів, зайнятий `id`, прибирання й вибір неіснуючого `e-99` — і щоразу очікує **той самий** об’єкт стану, а не копію."
          en: "This check sends six impossible actions — the amounts `12.5` and `0`, a label of spaces, a taken `id`, removing and selecting the missing `e-99` — and each time expects **the same** state object, not a copy."
      - when: { test: "two calls of useExpenses keep separate lists under their own keys" }
        message:
          uk: "Ця перевірка викликає хук з порожнім ключем (очікує початковий список) і з ключем, де збережено `e-30` (очікує саме його), додає витрату через перший виклик і очікує, що перший список записано під перший ключ, а другий список і його ключ не змінилися. Хук має читати й писати лише свій `key`."
          en: "This check calls the hook with an empty key (expects the starting list) and with a key that stores `e-30` (expects exactly it), adds an expense through the first call and expects the first list stored under the first key, and the second list and its key unchanged. The hook must read and write only its own `key`."
      - when: { test: "damaged storage falls back to the starting list" }
        message:
          uk: "Ця перевірка кладе під `STORAGE_KEY` текст `{broken` і об’єкт замість масиву й щоразу очікує три початкові витрати без помилки React."
          en: "This check stores the text `{broken` and an object instead of an array under `STORAGE_KEY` and each time expects the three starting expenses without a React error."
      - when: { test: "the page selects, sums and remembers expenses" }
        message:
          uk: "Ця перевірка вибирає «Проїзний» (його назва має з’явитися в `aside`), очікує «Разом: 1545.50», додає «Квитки в кіно» на 300 (очікує 1845.50), а потім монтує сторінку знову й очікує чотири витрати."
          en: "This check selects “Transit pass” (its label must appear in the `aside`), expects “Total: 1545.50”, adds “Cinema tickets” for 300 (expects 1845.50), then mounts the page again and expects four expenses."
      - when: { test: "typing in the form re-renders only the form" }
        message:
          uk: "Ця перевірка вводить три літери в поле «Назва» й очікує рендери `AddExpenseForm` і жодного — `ExpenseApp`, `ExpenseList`, `ExpenseDetail`, `Summary`."
          en: "This check types three letters into the “Label” field and expects renders of `AddExpenseForm` and none of `ExpenseApp`, `ExpenseList`, `ExpenseDetail`, `Summary`."
      - when: { test: "after a keyboard add, focus is back in the label field" }
        message:
          uk: "Ця перевірка вводить назву й суму, тисне Enter у полі «Сума» й очікує четверту витрату та фокус у полі «Назва»."
          en: "This check types a label and an amount, presses Enter in the “Amount” field and expects a fourth expense and focus in the “Label” field."
      - when: { test: "after a keyboard delete, focus moves to the next expense or the heading" }
        message:
          uk: "Ця перевірка тисне Enter на «Прибрати» в `e-02` (очікує фокус на кнопці `e-03`), а потім в `e-03`, після якої витрат немає (очікує фокус на `h2`)."
          en: "This check presses Enter on “Remove” in `e-02` (expects focus on the `e-03` button), then in `e-03`, after which there are no more expenses (expects focus on the `h2`)."
      - when: { error: TypeError }
        message:
          uk: "Якщо в повідомленні `object is not extensible` чи `Cannot assign to read only property`, reducer змінює стан, який отримав (`START_EXPENSES` і стан у перевірках заморожені). Повертай нові масиви й об’єкти. Поки reducer падає, сторінка й перевірки хука теж не проходять — спершу виправ це."
          en: "If the message says `object is not extensible` or `Cannot assign to read only property`, the reducer changes the state it received (`START_EXPENSES` and the state in the checks are frozen). Return new arrays and objects. While the reducer throws, the page and the hook checks fail too — fix this first."

  - id: to-project
    kind: transfer
    capstoneStep: RE-04
    body:
      uk: "Цей трекер — малий двійник кроку проєкту цього розділу: там ти зробиш те саме зі своїм доменом — reducer з actions домену в найближчому спільному батькові, хук даних зі своїм ключем `jsll.*.v1` і фокус після видалення."
      en: "This tracker is a small twin of this unit's project step: there you do the same with your domain — a reducer with the domain's actions in the closest common parent, a data hook with your `jsll.*.v1` key and focus after a delete."
