id: re-04-06-custom-hooks
unit: RE-04
title:
  uk: "Власні хуки та їхні контракти"
  en: "Custom hooks and their contracts"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Винести повторювану логіку зі станом у власний хук, назва якого починається з `use`, а аргументи й результат типізовано."
    en: "Extract repeated stateful logic into a custom hook whose name starts with use and whose arguments and return value are typed."
  - uk: "Записати контракт хука: що він повертає, які аргументи перезапускають його ефекти, що він прибирає і що кожен виклик має власний стан."
    en: "Write the hook's contract: what it returns, which arguments re-run its effects, what it cleans up, and that each call has its own state."
prerequisites: [re-04-05-refs-focus, re-03-03-dependencies-cleanup]
subskills:
  - { family: R-04, skill: "custom hook contracts", depth: intro }
glossary: [custom-hook, hook-contract]
selfCheck: [predict-two-toggles, stored-lists]

blocks:
  - id: extract-logic
    kind: explanation
    title:
      uk: "Логіку зі станом можна винести в функцію"
      en: "Stateful logic can move into a function"
    body:
      uk: |
        Дві панелі планувальника розгортаються однаково: `useState(false)`, функція, що перемикає, і `aria-expanded` на кнопці. Звичайну повторювану логіку ти виносиш у функцію. Логіку з хуками — так само, у [[custom-hook|власний хук]]:

        ```jsx
        function useToggle(initial) {
          const [on, setOn] = useState(initial);
          function toggle() {
            setOn(!on);
          }
          return [on, toggle];
        }

        // in a component:
        const [open, toggle] = useToggle(false);
        ```

        Власний хук — звичайна функція з двома відмінностями. Її назва починається з `use`: так лінтер і люди бачать, що всередині хуки (сам React під час виконання назв не перевіряє). І для неї діють ті самі [[rules-of-hooks|правила хуків]]: її викликають лише на верхньому рівні компонента чи іншого хука, ніколи в умові чи циклі, бо хуки всередині неї займають комірки компонента, який її викликав.
      en: |
        Two planner panels expand the same way: `useState(false)`, a function that toggles, and `aria-expanded` on the button. Ordinary repeated logic you move into a function. Logic with hooks goes the same way — into a [[custom-hook|custom hook]]:

        ```jsx
        function useToggle(initial) {
          const [on, setOn] = useState(initial);
          function toggle() {
            setOn(!on);
          }
          return [on, toggle];
        }

        // in a component:
        const [open, toggle] = useToggle(false);
        ```

        A custom hook is an ordinary function with two differences. Its name starts with `use`: that is how the linter and people see that there are hooks inside (React itself does not check names at runtime). And the same [[rules-of-hooks|rules of hooks]] apply to it: it is called only at the top level of a component or another hook, never in a condition or a loop, because the hooks inside it take slots of the component that called it.

  - id: predict-two-toggles
    kind: prediction
    prompt:
      uk: "Обидві панелі викликають той самий `useToggle`. Користувач натискає «Показати» в першій панелі. Що буде з другою?"
      en: "Both panels call the same `useToggle`. The user presses “Show” in the first panel. What happens to the second one?"
    code: |
      function TaskPanel({ title, details }) {
        const [open, toggle] = useToggle(false);
        return (
          <section>
            <h3>{title}</h3>
            <button aria-expanded={open} onClick={toggle}>{open ? "%%hide%%" : "%%show%%"}</button>
            {open && <p>{details}</p>}
          </section>
        );
      }

      export default function Planner() {
        return (
          <main>
            <TaskPanel title="%%plants%%" details="%%plantsDetails%%" />
            <TaskPanel title="%%library%%" details="%%libraryDetails%%" />
          </main>
        );
      }
    lang: jsx
    runnable: false
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
      plantsDetails: { uk: "Спершу ті, що на балконі", en: "The balcony ones first" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      libraryDetails: { uk: "До суботи", en: "Before Saturday" }
      show: { uk: "Показати", en: "Show" }
      hide: { uk: "Сховати", en: "Hide" }
    answer:
      type: choice
      options:
        - id: stays-closed
          text: { uk: "Лишається закритою: кожна панель має власний `open`", en: "It stays closed: each panel has its own `open`" }
        - id: opens-too
          text: { uk: "Теж відкривається: обидві використовують той самий хук", en: "It opens too: both use the same hook" }
          why:
            uk: "Хук ділиться **логікою**, а не станом. `useState` усередині `useToggle` викликається окремо для кожної панелі й займає комірку саме цієї панелі."
            en: "A hook shares **logic**, not state. The `useState` inside `useToggle` is called separately for each panel and takes a slot of that particular panel."
        - id: error
          text: { uk: "Помилка: хук не можна викликати у двох компонентах", en: "An error: a hook cannot be called in two components" }
          why:
            uk: "Хук можна викликати в скількох завгодно компонентах — як `useState`. Правило лише одне: на верхньому рівні, без умов і циклів."
            en: "A hook can be called in as many components as you like — just like `useState`. The only rule is: at the top level, without conditions or loops."
      correct: [stays-closed]
    explanation:
      uk: "Кожен виклик `useToggle` — це новий виклик `useState` у комірці свого компонента. Перша панель змінює свій `open`, друга навіть не перемальовується. Перевірено в пісочниці з React 19.3: `aria-expanded` після кліку — `true` у першій і `false` у другій."
      en: "Every call of `useToggle` is a new call of `useState` in its own component's slot. The first panel changes its `open`, the second does not even re-render. Checked in the sandbox with React 19.3: after the click `aria-expanded` is `true` in the first and `false` in the second."

  - id: toggle-panels
    kind: example
    runtime: browser-react
    dir: toggle-panels
    entry: main.jsx
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
      plantsDetails: { uk: "Спершу ті, що на балконі", en: "The balcony ones first" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      libraryDetails: { uk: "До суботи", en: "Before Saturday" }
      show: { uk: "Показати", en: "Show" }
      hide: { uk: "Сховати", en: "Hide" }
    title:
      uk: "Спільна логіка проти спільного стану"
      en: "Shared logic versus shared state"
    body:
      uk: |
        Обидві `TaskPanel` викликають `useToggle`. Натисни **Запустити** й на **Сторінці** розгорни першу панель: друга лишилася закритою.
      en: |
        Both `TaskPanel`s call `useToggle`. Press **Run** and on the **Page** expand the first panel: the second one stayed closed.
    tryIt:
      uk: |
        Тепер зроби стан справді спільним — підніми його, як у першому уроці розділу:

        1. Заголовок `function TaskPanel({ title, details })` заміни на `function TaskPanel({ title, details, open, onToggle })`, видали рядок `const [open, toggle] = useToggle(false);`, а `onClick={toggle}` заміни на `onClick={onToggle}`.
        2. У `Planner` перед `return` додай `const [open, toggle] = useToggle(false);`, а обом тегам `<TaskPanel … />` додай `open={open} onToggle={toggle}`.

        Запусти: тепер панелі відкриваються й закриваються разом. Хук той самий, але викликано його один раз — у спільному батькові. Спільний стан дає підняття, а не спільний хук.
      en: |
        Now make the state really shared — lift it, as in the unit's first lesson:

        1. Replace the header `function TaskPanel({ title, details })` with `function TaskPanel({ title, details, open, onToggle })`, delete the line `const [open, toggle] = useToggle(false);`, and replace `onClick={toggle}` with `onClick={onToggle}`.
        2. In `Planner`, before `return`, add `const [open, toggle] = useToggle(false);`, and add `open={open} onToggle={toggle}` to both `<TaskPanel … />` tags.

        Run: now the panels open and close together. The hook is the same, but it is called once — in the common parent. Shared state comes from lifting, not from a shared hook.

  - id: recall-cleanup
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: key-change-cleanup
        from: re-03-03-dependencies-cleanup
        prompt:
          uk: "Батьківський компонент показує `<SyncBadge storageKey=\"jsll.lab.work\" />`, потім передає `storageKey=\"jsll.lab.home\"`, а потім перестає показувати `SyncBadge`. Що надрукує консоль?"
          en: "A parent shows `<SyncBadge storageKey=\"jsll.lab.work\" />`, then passes `storageKey=\"jsll.lab.home\"`, and then stops showing `SyncBadge`. What does the console print?"
        code: |
          function SyncBadge({ storageKey }) {
            useEffect(() => {
              function handleStorage(event) { /* … */ }
              window.addEventListener("storage", handleStorage);
              console.log(`listen ${storageKey}`);
              return () => {
                window.removeEventListener("storage", handleStorage);
                console.log(`stop ${storageKey}`);
              };
            }, [storageKey]);
            return <span>{storageKey}</span>;
          }
        lang: jsx
        runnable: false
        answer:
          type: choice
          options:
            - id: paired
              code: "listen jsll.lab.work\nstop jsll.lab.work\nlisten jsll.lab.home\nstop jsll.lab.home"
            - id: unmount-only
              code: "listen jsll.lab.work\nlisten jsll.lab.home\nstop jsll.lab.home"
              why:
                uk: "Cleanup запускається не лише під час демонтування: коли змінилася залежність, React спершу прибирає попередній запуск ефекту. Інакше старий listener жив би далі."
                en: "Cleanup does not run only on unmount: when a dependency changed, React first cleans up the previous run of the effect. Otherwise the old listener would live on."
            - id: new-key
              code: "listen jsll.lab.work\nstop jsll.lab.home\nlisten jsll.lab.home\nstop jsll.lab.home"
              why:
                uk: "Cleanup створено під час попереднього запуску, тож він бачить `storageKey` того рендеру — `jsll.lab.work`."
                en: "The cleanup was created during the previous run, so it sees that render's `storageKey` — `jsll.lab.work`."
          correct: [paired]
        explanation:
          uk: "Зміна `storageKey` — це cleanup старого запуску (зі старим ключем), а тоді новий запуск. Демонтування — останній cleanup. Кожен власний хук з ефектом поводиться так само, бо ефект усередині хука — це ефект компонента, що його викликав."
          en: "A change of `storageKey` means the old run's cleanup (with the old key), then a new run. Unmounting means the last cleanup. Every custom hook with an effect behaves the same way, because an effect inside a hook is an effect of the component that called it."

  - id: two-calls
    kind: visual
    visual: diagram
    title:
      uk: "Один хук, два виклики, власні комірки"
      en: "One hook, two calls, their own slots"
    textEquivalent:
      uk: "Два компоненти, WorkList і HomeList, викликають той самий хук useStoredRecords — перший з ключем jsll.lab.work, другий з ключем jsll.lab.home. Кожен виклик отримує власні комірки в компоненті, що його викликав: свій стан records і свій ефект із listener подій storage. Зміна списку в WorkList змінює лише його комірку й записує лише його ключ. Поруч — картка контракту хука: аргумент key, результат [records, setRecords], ефекти з їхніми залежностями, cleanup, що знімає listener, і правило «кожен виклик — власний стан». Коли HomeList зникає, його cleanup знімає лише його listener."
      en: "Two components, WorkList and HomeList, call the same hook useStoredRecords — the first with the key jsll.lab.work, the second with jsll.lab.home. Each call gets its own slots in the component that called it: its own records state and its own effect with a storage-event listener. A change of the list in WorkList changes only its slot and writes only its key. Next to them is the hook's contract card: the argument key, the result [records, setRecords], the effects with their dependencies, a cleanup that removes the listener, and the rule “each call has its own state”. When HomeList goes away, its cleanup removes only its listener."
    spec:
      layout: grid
      nodes:
        - { id: work, label: "WorkList", col: 0, row: 0, w: 140 }
        - { id: home, label: "HomeList", col: 1, row: 0, w: 140 }
        - { id: workSlots, label: { uk: "records · listener (work)", en: "records · listener (work)" }, shape: note, col: 0, row: 1, w: 160 }
        - { id: homeSlots, label: { uk: "records · listener (home)", en: "records · listener (home)" }, shape: note, col: 1, row: 1, w: 160 }
        - { id: hook, label: "useStoredRecords(key)", shape: round, col: 0, row: 2, w: 160 }
        - { id: contract, label: { uk: "контракт: key → [records, setRecords]", en: "contract: key → [records, setRecords]" }, shape: note, col: 1, row: 2, w: 160 }
      edges:
        - { id: work-slots, from: work, to: workSlots }
        - { id: home-slots, from: home, to: homeSlots }
        - { id: work-hook, from: workSlots, to: hook, kind: dashed }
        - { id: home-hook, from: homeSlots, to: hook, kind: dashed }
        - { id: hook-contract, from: hook, to: contract, kind: line }
      steps:
        - caption:
            uk: "Два компоненти викликають той самий хук з різними ключами."
            en: "Two components call the same hook with different keys."
          highlight: [work, home, hook]
        - caption:
            uk: "Кожен виклик отримує **власні** комірки у своєму компоненті: стан `records` і ефект зі своїм listener."
            en: "Each call gets **its own** slots in its component: a `records` state and an effect with its own listener."
          highlight: [workSlots, homeSlots, work-slots, home-slots]
        - caption:
            uk: "Додавання справи в `WorkList` змінює лише його комірку й записує лише `jsll.lab.work`. `HomeList` нічого не помічає."
            en: "Adding a task in `WorkList` changes only its slot and writes only `jsll.lab.work`. `HomeList` notices nothing."
          highlight: [work, workSlots]
          dim: [home, homeSlots, home-slots, home-hook]
        - caption:
            uk: "Контракт описує те, що бачить код ззовні: аргумент, результат, ефекти з залежностями, cleanup і правило «кожен виклик — свій стан»."
            en: "The contract describes what code outside sees: the argument, the result, the effects with their dependencies, the cleanup and the rule “each call has its own state”."
          highlight: [hook, contract, hook-contract]
          annotate:
            - { id: contract, text: { uk: "ефекти: [key, records], [key]; cleanup знімає listener", en: "effects: [key, records], [key]; cleanup removes the listener" } }
        - caption:
            uk: "`HomeList` зникає — його cleanup знімає лише його listener. Комірки `WorkList` живуть далі."
            en: "`HomeList` goes away — its cleanup removes only its listener. The slots of `WorkList` live on."
          dim: [home, homeSlots, home-slots, home-hook]
          highlight: [work, workSlots]

  - id: contracts
    kind: explanation
    title:
      uk: "Контракт хука: що обіцяє його назва"
      en: "A hook's contract: what its name promises"
    body:
      uk: |
        Хук використовують, не читаючи його тіла, — як `useState`. Тому над ним пишуть [[hook-contract|контракт]]: короткий коментар, що відповідає на п’ять питань.

        1. **Аргументи.** Що означає кожен і що буде, якщо він зміниться між рендерами.
        2. **Результат.** Що повертається і в якій формі (`[value, setValue]` чи об’єкт).
        3. **Ефекти.** Що хук синхронізує і від яких аргументів чи станів залежить кожен ефект.
        4. **Cleanup.** Що хук прибирає перед повторним запуском і під час демонтування.
        5. **Власність.** Кожен виклик має власний стан; спільним стан стає лише після підняття.

        Типи в TypeScript закривають перші два пункти для `tsc`: `function useToggle(initial: boolean): [boolean, () => void]`. Решту знає лише текст контракту — і перевірки, які його перевіряють.
      en: |
        A hook is used without reading its body — like `useState`. That is why a [[hook-contract|contract]] is written above it: a short comment that answers five questions.

        1. **Arguments.** What each one means, and what happens if it changes between renders.
        2. **Result.** What comes back and in which shape (`[value, setValue]` or an object).
        3. **Effects.** What the hook synchronizes, and which arguments or state each effect depends on.
        4. **Cleanup.** What the hook removes before a re-run and on unmount.
        5. **Ownership.** Every call has its own state; state becomes shared only after lifting.

        Types in TypeScript cover the first two points for `tsc`: `function useToggle(initial: boolean): [boolean, () => void]`. Only the text of the contract knows the rest — and the checks that test it.

  - id: stored-lists
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: stored-lists
    entry: main.tsx
    editable: [useStoredRecords.ts, App.tsx]
    strings:
      work: { uk: "Робота", en: "Work" }
      home: { uk: "Дім", en: "Home" }
      newTask: { uk: "Нова справа", en: "New task" }
      add: { uk: "Додати", en: "Add" }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      bill: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
    title:
      uk: "Хук useStoredRecords із контрактом"
      en: "A useStoredRecords hook with a contract"
    instructions:
      uk: |
        `WorkList` у `App.tsx` пам’ятає свої справи: читає їх із `localStorage` під `WORK_KEY`, записує кожну зміну й перечитує, коли інша вкладка змінює той самий ключ (подія `storage`). `HomeList` не пам’ятає нічого.

        1. Перенеси цю логіку в хук `useStoredRecords(key)` у файлі `useStoredRecords.ts`. Він приймає ключ і повертає `[records, setRecords]`; `setRecords` замінює весь список. Для читання є `readRecords(key)` у `storage.ts` (лише для читання).
        2. Над хуком напиши контракт — п’ять пунктів з пояснення. Перевірки коментарі не читають, але без контракту хук не завершений.
        3. Зроби так, щоб і `WorkList`, і `HomeList` (під `HOME_KEY`) використовували хук. Можна лишити два компоненти, а можна зробити один компонент з ключем у props.

        Ключ одного виклику хука між рендерами не змінюється. Перевірки викликають хук у своїх компонентах-зондах із власними ключами, надсилають `window` події `storage`, рахують listeners подій `storage` і двічі монтують сторінку.
      en: |
        `WorkList` in `App.tsx` remembers its tasks: it reads them from `localStorage` under `WORK_KEY`, stores every change and reloads them when another tab changes the same key (the `storage` event). `HomeList` remembers nothing.

        1. Move this logic into a hook `useStoredRecords(key)` in the file `useStoredRecords.ts`. It takes the key and returns `[records, setRecords]`; `setRecords` replaces the whole list. To read, use `readRecords(key)` from `storage.ts` (read-only).
        2. Write the contract above the hook — the five points from the explanation. The checks do not read comments, but without a contract the hook is not finished.
        3. Make both `WorkList` and `HomeList` (under `HOME_KEY`) use the hook. You may keep two components, or make one component with the key in its props.

        The key of one hook call does not change between renders. The checks call the hook in their own probe components with their own keys, send `storage` events to `window`, count the listeners of `storage` events and mount the page twice.
    testTitles:
      "the hook starts from the records stored under its key":
        uk: "Хук починає зі справ, збережених під його ключем"
        en: "The hook starts from the records stored under its key"
      "setting records stores them under the key":
        uk: "`setRecords` зберігає список під ключем"
        en: "`setRecords` stores the list under the key"
      "a storage event for its key reloads the records, another key is ignored":
        uk: "Подія `storage` для його ключа перечитує список, а для іншого ключа — ні"
        en: "A `storage` event for its key reloads the records, another key is ignored"
      "two calls keep separate records":
        uk: "Два виклики мають окремі списки"
        en: "Two calls keep separate records"
      "unmounting removes the storage listener":
        uk: "Демонтування знімає listener подій `storage`"
        en: "Unmounting removes the `storage` listener"
      "both lists on the page remember their own tasks":
        uk: "Обидва списки на сторінці пам’ятають свої справи"
        en: "Both lists on the page remember their own tasks"
    hints:
      nudge:
        uk: "У хук переїжджає все, що в `WorkList` стосується справ: `useState` з початковим читанням і обидва ефекти. Що в них треба замінити, щоб хук працював із будь-яким ключем?"
        en: "Everything in `WorkList` that concerns the tasks moves into the hook: the `useState` with the initial read and both effects. What in them has to be replaced so that the hook works with any key?"
      explanation:
        uk: |
          Хук — функція з тими самими рядками, де константа ключа стала аргументом. Аргумент — реактивне значення, тож він потрапляє в масив залежностей кожного ефекту, що його читає. Наприкінці хук повертає пару з поточного списку й функції, що його замінює.

          Схожий приклад з іншою задачею: хук ширини вікна — `function useWindowWidth(): number { const [width, setWidth] = useState(window.innerWidth); useEffect(() => { const update = () => setWidth(window.innerWidth); window.addEventListener("resize", update); return () => window.removeEventListener("resize", update); }, []); return width; }`.
        en: |
          The hook is a function with the same lines, where the key constant became an argument. An argument is a reactive value, so it goes into the dependency array of every effect that reads it. At the end the hook returns a pair of the current list and a function that replaces it.

          A similar example with a different task: a window-width hook — `function useWindowWidth(): number { const [width, setWidth] = useState(window.innerWidth); useEffect(() => { const update = () => setWidth(window.innerWidth); window.addEventListener("resize", update); return () => window.removeEventListener("resize", update); }, []); return width; }`.
    solutionNote:
      uk: "Хук містить ті самі три частини, що були у `WorkList`, але з ключем-аргументом: початкове читання в `useState`, ефект запису із залежностями `[key, records]` і ефект listener із залежністю `[key]` та cleanup, що його знімає. Кожен виклик — окремі комірки, тож списки «Робота» й «Дім» не змішуються. Записувати можна й у самій функції-setter, у момент зміни: це теж відповідає контракту."
      en: "The hook holds the same three parts that were in `WorkList`, but with the key as an argument: the initial read in `useState`, a write effect with the dependencies `[key, records]`, and a listener effect with the dependency `[key]` and a cleanup that removes it. Every call means separate slots, so the “Work” and “Home” lists never mix. Storing can also happen in the setter function itself, at the moment of the change: that fits the contract too."
    feedback:
      - when: { test: "the hook starts from the records stored under its key" }
        message:
          uk: "Ця перевірка кладе під ключ одну справу, викликає хук і очікує саме її на першому рендері, без помилки React. Початковий список хук має читати через `readRecords(key)`."
          en: "This check stores one task under a key, calls the hook and expects exactly that task on the first render, without a React error. The hook must read the initial list with `readRecords(key)`."
      - when: { test: "setting records stores them under the key" }
        message:
          uk: "Ця перевірка викликає `setRecords` з однією справою й очікує її і в результаті хука, і в `localStorage` під ключем хука."
          en: "This check calls `setRecords` with one task and expects it both in the hook's result and in `localStorage` under the hook's key."
      - when: { test: "a storage event for its key reloads the records, another key is ignored" }
        message:
          uk: "Ця перевірка змінює збережене значення, надсилає подію `storage` з іншим ключем (список не має змінитися), а тоді з ключем хука (список має стати новим). Обробник має порівнювати `event.key` з ключем."
          en: "This check changes the stored value, sends a `storage` event with another key (the list must not change), then with the hook's key (the list must become the new one). The handler must compare `event.key` with the key."
      - when: { test: "two calls keep separate records" }
        message:
          uk: "Ця перевірка викликає хук двічі з різними ключами, змінює перший список і очікує, що другий порожній — і в результаті, і в сховищі, і в новому виклику з другим ключем. Список має жити в `useState` всередині хука, а не в змінній модуля."
          en: "This check calls the hook twice with different keys, changes the first list and expects the second to be empty — in the result, in storage and in a new call with the second key. The list must live in `useState` inside the hook, not in a module variable."
      - when: { test: "unmounting removes the storage listener" }
        message:
          uk: "Ця перевірка рахує listeners подій `storage` на `window`: поки компонент показано, їх більше нуля, після демонтування — нуль. Ефект має повертати cleanup з `removeEventListener` для тієї самої функції."
          en: "This check counts the `storage` listeners on `window`: while the component is shown there are more than zero, after unmounting zero. The effect must return a cleanup with `removeEventListener` for the same function."
      - when: { test: "both lists on the page remember their own tasks" }
        message:
          uk: "Ця перевірка додає справу в «Робота» й іншу в «Дім», демонтує сторінку й монтує знову. Кожен список має показати лише свою справу — обидва мають використовувати хук зі своїм ключем."
          en: "This check adds a task to “Work” and another to “Home”, unmounts the page and mounts it again. Each list must show only its own task — both must use the hook with their own key."
      - when: { error: Error }
        message:
          uk: "Якщо картка каже `TODO: useStoredRecords is not written yet`, у файлі хука ще стоїть заглушка з `throw`. Заміни її тілом хука."
          en: "If the card says `TODO: useStoredRecords is not written yet`, the hook file still has the stub with `throw`. Replace it with the hook's body."

  - id: to-project
    kind: transfer
    capstoneStep: RE-04
    body:
      uk: "У кроці проєкту цього розділу читання й збереження списку переїдуть у хук даних твого домену — для планувальника це `useTasks`, що працює з ключем `jsll.planner.v1`. Над хуком буде контракт із п’яти пунктів, а компонент, що його викликає, більше не знатиме про `localStorage`."
      en: "In this unit's project step reading and storing the list move into your domain's data hook — for the planner a `useTasks` that works with the key `jsll.planner.v1`. Above the hook goes a five-point contract, and the component that calls it no longer knows about `localStorage`."
