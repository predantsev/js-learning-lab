id: re-04-02-where-state-lives
unit: RE-04
title:
  uk: "Локальний чи спільний: де живе стан"
  en: "Local or shared: where state lives"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Розмістити кожен шматок стану в найнижчому компоненті, якому він потрібен, і пояснити кожне розміщення одним реченням."
    en: "Place each piece of state in the lowest component that needs it, and justify each placement in one sentence."
  - uk: "Пояснити, чим платиш за глобальний стан без потреби: ширшими перемальовуваннями, прихованими зв’язками й складнішими тестами."
    en: "Explain the costs of making state global without need: wider re-renders, hidden coupling and harder tests."
prerequisites: [re-04-01-lifting-state]
subskills:
  - { family: R-03, skill: "local/shared placement", depth: intro }
  - { family: R-03, skill: "avoid needless global state", depth: intro }
glossary: [state-colocation, global-state]
selfCheck: [predict-keystroke, task-board]

blocks:
  - id: lowest-owner
    kind: explanation
    title:
      uk: "Стан живе якомога нижче"
      en: "State lives as low as possible"
    body:
      uk: |
        У минулому уроці ти підняв стан, бо він потрібен двом сусідам. Зворотне правило таке ж важливе: стан, потрібний **одному** компоненту, лишається в ньому. Тримати стан поруч із тим, хто його використовує, називають [[state-colocation|колокацією стану]].

        Для кожного `useState` постав одне питання — **хто читає й змінює це значення?**

        | Хто читає | Де живе стан |
        |---|---|
        | один компонент | у ньому самому |
        | кілька компонентів | у їхньому найближчому спільному батькові |

        Чому це важливо, видно з того, як React перемальовує: коли змінюється стан, рендериться його власник **і всі компоненти під ним** — навіть ті, чиї props не змінилися.
      en: |
        In the previous lesson you lifted state because two neighbours needed it. The reverse rule matters just as much: state needed by **one** component stays in it. Keeping state next to whoever uses it is called [[state-colocation|state colocation]].

        For every `useState` ask one question — **who reads and changes this value?**

        | Who reads it | Where the state lives |
        |---|---|
        | one component | in that component |
        | several components | in their closest common parent |

        Why this matters follows from how React re-renders: when state changes, its owner renders **and so does every component below it** — even those whose props did not change.

  - id: predict-keystroke
    kind: prediction
    prompt:
      uk: "Чернетка нової справи живе в `App`. Кожен компонент на початку свого тіла друкує `render` і свою назву. Користувач вводить у поле одну літеру. Які компоненти надрукують `render`?"
      en: "The draft of a new task lives in `App`. Every component prints `render` and its name at the start of its body. The user types one letter into the field. Which components print `render`?"
    code: |
      export default function App() {
        logRender("App");
        const [tasks, setTasks] = useState(TASKS);
        const [draft, setDraft] = useState("");
        // …
        return (
          <main>
            <TaskForm draft={draft} onDraftChange={setDraft} onAdd={addTask} />
            <TaskList tasks={tasks} />
            <Summary tasks={tasks} />
          </main>
        );
      }
    lang: jsx
    runnable: false
    answer:
      type: multi
      options:
        - id: app
          code: "App"
        - id: form
          code: "TaskForm"
        - id: list
          code: "TaskList"
          why:
            uk: "`TaskList` не отримує `draft`, але він — дитина `App`. Коли `App` рендериться, React рендерить і всіх його дітей, не питаючи, чи змінилися їхні props."
            en: "`TaskList` does not receive `draft`, but it is a child of `App`. When `App` renders, React renders all its children too, without asking whether their props changed."
        - id: summary
          code: "Summary"
          why:
            uk: "`Summary` бачить лише `tasks`, які не змінилися, — та все одно рендериться разом зі своїм батьком `App`."
            en: "`Summary` sees only `tasks`, which did not change — yet it still renders together with its parent `App`."
      correct: [app, form, list, summary]
    explanation:
      uk: "`setDraft` змінює стан `App`, тож рендериться `App` і всі компоненти під ним: `TaskForm`, `TaskList`, `Summary`. React не пропускає дитину лише тому, що її props ті самі. Перевірено в пісочниці з React 19.3: одна літера — чотири рядки `render`."
      en: "`setDraft` changes the state of `App`, so `App` renders, and so do all the components below it: `TaskForm`, `TaskList`, `Summary`. React does not skip a child just because its props are the same. Checked in the sandbox with React 19.3: one letter, four `render` lines."

  - id: state-badges
    kind: visual
    visual: diagram
    title:
      uk: "Куди поставити кожен шматок стану"
      en: "Where to put each piece of state"
    textEquivalent:
      uk: "App має трьох дітей: TaskForm, TaskList і Summary. Спершу в App живуть три шматки стану: чернетка draft, фільтр filter і список tasks. Кожна літера в полі змінює draft, тож перемальовуються App і всі троє дітей. Коли draft переїжджає в TaskForm, літера перемальовує лише TaskForm. Фільтр показує й змінює лише TaskList, тож він переїжджає туди, і клік на фільтрі перемальовує лише список. Список tasks читають TaskList і Summary, а додає в нього TaskForm, тож tasks лишається в App — їхньому найближчому спільному батькові — і додавання справи справді перемальовує всіх."
      en: "App has three children: TaskForm, TaskList and Summary. At first three pieces of state live in App: the draft, the filter and the tasks list. Every letter in the field changes draft, so App and all three children re-render. When draft moves into TaskForm, a letter re-renders only TaskForm. Only TaskList shows and changes the filter, so the filter moves there, and a click on the filter re-renders only the list. The tasks list is read by TaskList and Summary and added to by TaskForm, so tasks stays in App — their closest common parent — and adding a task really does re-render everyone."
    spec:
      layout: grid
      nodes:
        - { id: app, label: "App", col: 0, row: 0, w: 110 }
        - { id: form, label: "TaskForm", col: 1, row: 1, w: 130 }
        - { id: list, label: "TaskList", col: 1, row: 2, w: 130 }
        - { id: summary, label: "Summary", col: 1, row: 3, w: 130 }
      edges:
        - { id: app-form, from: app, to: form }
        - { id: app-list, from: app, to: list }
        - { id: app-summary, from: app, to: summary }
      steps:
        - caption:
            uk: "Усі три шматки стану — `draft`, `filter` і `tasks` — живуть в `App`."
            en: "All three pieces of state — `draft`, `filter` and `tasks` — live in `App`."
          annotate:
            - { id: app, text: "draft · filter · tasks" }
        - caption:
            uk: "Одна літера змінює `draft`: рендеряться `App` і всі троє дітей, хоча `draft` потрібен лише формі."
            en: "One letter changes `draft`: `App` and all three children render, although only the form needs `draft`."
          highlight: [app, form, list, summary, app-form, app-list, app-summary]
          annotate:
            - { id: app, text: "draft · filter · tasks" }
        - caption:
            uk: "`draft` переїхав у `TaskForm`. Тепер літера рендерить лише форму."
            en: "`draft` moved into `TaskForm`. Now a letter renders only the form."
          highlight: [form]
          annotate:
            - { id: app, text: "filter · tasks" }
            - { id: form, text: "draft" }
        - caption:
            uk: "Фільтр показує й змінює лише `TaskList`, тож і він переїжджає вниз. Клік на фільтрі рендерить лише список."
            en: "Only `TaskList` shows and changes the filter, so it moves down too. A click on the filter renders only the list."
          highlight: [list]
          annotate:
            - { id: app, text: "tasks" }
            - { id: form, text: "draft" }
            - { id: list, text: "filter" }
        - caption:
            uk: "`tasks` читають `TaskList` і `Summary`, а додає `TaskForm` — це справді спільний стан, тож він лишається в `App`. Додавання справи рендерить усіх, і так і має бути."
            en: "`tasks` is read by `TaskList` and `Summary` and added to by `TaskForm` — it really is shared state, so it stays in `App`. Adding a task renders everyone, and that is how it should be."
          highlight: [app, form, list, summary, app-form, app-list, app-summary]
          annotate:
            - { id: app, text: "tasks" }
            - { id: form, text: "draft" }
            - { id: list, text: "filter" }

  - id: planner-renders
    kind: example
    runtime: browser-react
    dir: planner-renders
    entry: main.jsx
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      bill: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      newTask: { uk: "Нова справа", en: "New task" }
      add: { uk: "Додати", en: "Add" }
      all: { uk: "Усі", en: "All" }
      open: { uk: "Невиконані", en: "Open" }
      openCount: { uk: "Невиконаних:", en: "Open tasks:" }
    title:
      uk: "Хто рендериться на кожну літеру"
      en: "Who renders on every letter"
    body:
      uk: |
        Тут `draft`, `filter` і `tasks` живуть в `App`, а кожен компонент друкує в **Консоль** рядок `render …`, щойно рендериться. Натисни **Запустити** й на **Сторінці** введи в поле «Нова справа» два символи: кожен дає чотири рядки — `App`, `TaskForm`, `TaskList`, `Summary`. Клік на «Невиконані» — знову чотири.
      en: |
        Here `draft`, `filter` and `tasks` live in `App`, and every component prints a `render …` line to the **Console** as soon as it renders. Press **Run** and on the **Page** type two characters into the “New task” field: each one gives four lines — `App`, `TaskForm`, `TaskList`, `Summary`. A click on “Open” — four again.
    tryIt:
      uk: |
        Перенеси чернетку у форму. У `App.jsx`:

        1. Заголовок `function TaskForm({ draft, onDraftChange, onAdd })` заміни на `function TaskForm({ onAdd })`, а першим рядком після `logRender("TaskForm");` додай `const [draft, setDraft] = useState("");`.
        2. У тій самій формі заміни `onDraftChange(event.target.value)` на `setDraft(event.target.value)`, а в `handleSubmit` рядок `onAdd();` заміни на три рядки: `if (draft.trim() === "") return;`, `onAdd(draft.trim());` і `setDraft("");`.
        3. В `App` видали `const [draft, setDraft] = useState("");`. У `addTask` заміни заголовок на `function addTask(title)`, видали рядки `if (draft.trim() === "") return;` і `setDraft("");`, а `draft.trim()` заміни на `title`.
        4. Заміни тег `<TaskForm …/>` на `<TaskForm onAdd={addTask} />`.

        Запусти й введи літеру: у консолі один рядок `render TaskForm`. Тепер так само перенеси фільтр: заголовок `TaskList` стає `function TaskList({ tasks })`, після `logRender("TaskList");` з’являється `const [filter, setFilter] = useState("all");`, обидва `onFilterChange(` стають `setFilter(`, а з `App` зникають рядок `const [filter, setFilter] = useState("all");` і props `filter`, `onFilterChange` у тегу `<TaskList …/>`. Клік на «Невиконані» дасть лише `render TaskList`. Додавання справи й далі рендерить усіх чотирьох: `tasks` — спільний стан.
      en: |
        Move the draft into the form. In `App.jsx`:

        1. Replace the header `function TaskForm({ draft, onDraftChange, onAdd })` with `function TaskForm({ onAdd })`, and as the first line after `logRender("TaskForm");` add `const [draft, setDraft] = useState("");`.
        2. In the same form replace `onDraftChange(event.target.value)` with `setDraft(event.target.value)`, and in `handleSubmit` replace the line `onAdd();` with three lines: `if (draft.trim() === "") return;`, `onAdd(draft.trim());` and `setDraft("");`.
        3. In `App` delete `const [draft, setDraft] = useState("");`. In `addTask` change the header to `function addTask(title)`, delete the lines `if (draft.trim() === "") return;` and `setDraft("");`, and replace `draft.trim()` with `title`.
        4. Replace the `<TaskForm …/>` tag with `<TaskForm onAdd={addTask} />`.

        Run and type a letter: the console shows one line, `render TaskForm`. Now move the filter the same way: the `TaskList` header becomes `function TaskList({ tasks })`, after `logRender("TaskList");` comes `const [filter, setFilter] = useState("all");`, both `onFilterChange(` become `setFilter(`, and `App` loses the line `const [filter, setFilter] = useState("all");` and the props `filter`, `onFilterChange` in the `<TaskList …/>` tag. A click on “Open” gives only `render TaskList`. Adding a task still renders all four: `tasks` is shared state.

  - id: global-costs
    kind: explanation
    title:
      uk: "Чому «все на самий верх» — не простіше"
      en: "Why “everything at the top” is not simpler"
    body:
      uk: |
        Здається, що [[global-state|глобальний стан]] — усе в `App` або в окремому сховищі для всього застосунку — простіший: усе в одному місці, легко знайти. Але кожен шматок, винесений вище, ніж треба, коштує тричі:

        - **Ширші перемальовування.** Ти щойно бачив: літера в одному полі рендерить увесь застосунок. На трьох компонентах цього не помітно, на трьохстах — помітно.
        - **Приховані зв’язки.** Коли `filter` лежить в `App`, будь-який компонент може почати його читати чи змінювати, і вже не видно, хто від кого залежить. Стан усередині `TaskList` змінити ззовні неможливо.
        - **Складніші тести.** Компонент, що сам тримає свою чернетку, перевіряють окремо. Компонент, що отримує `draft` і `onDraftChange` згори, без батька не працює.

        Тож «легко знайти» дає не верхівка дерева, а звичка: стан лежить біля того, хто його використовує.
      en: |
        [[global-state|Global state]] — everything in `App` or in a separate store for the whole app — seems simpler: everything in one place, easy to find. But every piece moved higher than needed costs three times:

        - **Wider re-renders.** You just saw it: a letter in one field renders the whole app. With three components you do not notice; with three hundred you do.
        - **Hidden coupling.** When `filter` sits in `App`, any component may start reading or changing it, and it is no longer visible who depends on whom. State inside `TaskList` cannot be changed from outside.
        - **Harder tests.** A component that keeps its own draft is tested on its own. A component that gets `draft` and `onDraftChange` from above does not work without its parent.

        So what makes state easy to find is not the top of the tree but a habit: state sits next to whoever uses it.

  - id: recall-module-binding
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: shared-module-object
        from: js-07-06-esm-import-export
        prompt:
          uk: "Два модулі імпортують той самий об’єкт. Що надрукує `b.js`, якщо `a.js` виконується першим?"
          en: "Two modules import the same object. What does `b.js` print if `a.js` runs first?"
        code: |
          // store.js
          export const selection = { id: null };

          // a.js
          import { selection } from "./store.js";
          selection.id = "t-02";

          // b.js
          import { selection } from "./store.js";
          console.log(selection.id);
        runnable: false
        answer:
          type: choice
          options:
            - id: t02
              code: "t-02"
            - id: null-copy
              code: "null"
              why:
                uk: "Модуль виконується один раз, і всі, хто його імпортує, отримують **той самий** об’єкт, а не копію. Зміна з `a.js` видна в `b.js`."
                en: "A module runs once, and everyone who imports it gets **the same** object, not a copy. The change made in `a.js` is visible in `b.js`."
            - id: error
              text: { uk: "`TypeError`: імпортоване змінювати не можна", en: "A `TypeError`: imports cannot be changed" }
              why:
                uk: "Не можна присвоїти нове значення самій імпортованій назві (`selection = …`). А поле об’єкта, на який вона вказує, змінювати можна."
                en: "You cannot assign a new value to the imported name itself (`selection = …`). But a field of the object it points to can be changed."
          correct: [t02]
        explanation:
          uk: "Об’єкт модуля — найпростіший глобальний стан: його бачить і змінює кожен, хто імпортує. Тому й незрозуміло, хто його змінив. А React про таку зміну взагалі не дізнається й нічого не перемалює: стан React — це лише `useState` і подібні хуки. Перевірено в пісочниці: `t-02`."
          en: "A module object is the simplest global state: everyone who imports it sees and changes it. That is exactly why it is unclear who changed it. And React does not even learn about such a change and re-renders nothing: React state is only `useState` and similar hooks. Checked in the sandbox: `t-02`."

  - id: task-board
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: task-board
    entry: main.jsx
    editable: [App.jsx]
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      bill: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      search: { uk: "Пошук", en: "Search" }
      showDone: { uk: "Показувати виконані", en: "Show done tasks" }
      due: { uk: "Термін:", en: "Due:" }
      noDue: { uk: "без терміну", en: "no due date" }
      openCount: { uk: "Невиконаних:", en: "Open tasks:" }
      note: { uk: "Нотатка", en: "Note" }
      searchProbe: { uk: "бібл", en: "librar" }
      noteText: { uk: "Купити батарейки", en: "Buy batteries" }
    title:
      uk: "П’ять шматків стану, два з них — надто високо"
      en: "Five pieces of state, two of them too high"
    instructions:
      uk: |
        Планувальник має чотири частини: `Toolbar` (пошук і прапорець «Показувати виконані»), `TaskList` (справи; клік на назві розгортає термін), `Summary` (кількість невиконаних) і `NotePad` (вільна нотатка). Усі п’ять шматків стану — `tasks`, `query`, `showDone`, `expandedId`, `note` — живуть в `App`.

        Для кожного шматка з’ясуй, які компоненти його читають і змінюють. Перенеси вниз **ті два**, які потрібні лише одному компоненту, а спільні залиш на місці. Застосунок має працювати так само, як зараз. Речення-пояснення над кожним `useState` (наприклад, `// Shared by Toolbar and TaskList.`) допоможе думати — перевірки коментарі не читають.

        `renders.js` (лише для читання) рахує рендери. Перевірки очікують, що введення нотатки рендерить лише `NotePad`, а розгортання справи — лише `TaskList`.
      en: |
        The planner has four parts: `Toolbar` (search and the “Show done tasks” checkbox), `TaskList` (the tasks; a click on a title expands its due date), `Summary` (the number of open tasks) and `NotePad` (a free note). All five pieces of state — `tasks`, `query`, `showDone`, `expandedId`, `note` — live in `App`.

        For each piece find out which components read and change it. Move down **the two** that only one component needs, and leave the shared ones where they are. The app must work exactly as it does now. A one-sentence comment above each `useState` (for example `// Shared by Toolbar and TaskList.`) helps you think — the checks do not read comments.

        `renders.js` (read-only) counts renders. The checks expect typing a note to render only `NotePad`, and expanding a task to render only `TaskList`.
    testTitles:
      "expanding a task shows its due date, and a second click hides it":
        uk: "Розгортання показує термін справи, а другий клік ховає його"
        en: "Expanding a task shows its due date, and a second click hides it"
      "the search and the done filter still narrow the list":
        uk: "Пошук і фільтр виконаних, як і раніше, звужують список"
        en: "The search and the done filter still narrow the list"
      "ticking a task updates the open count":
        uk: "Позначка справи змінює кількість невиконаних"
        en: "Ticking a task updates the open count"
      "the note keeps what is typed":
        uk: "Нотатка зберігає введений текст"
        en: "The note keeps what is typed"
      "typing a note re-renders only NotePad":
        uk: "Введення нотатки рендерить лише `NotePad`"
        en: "Typing a note re-renders only `NotePad`"
      "expanding a task re-renders only TaskList":
        uk: "Розгортання справи рендерить лише `TaskList`"
        en: "Expanding a task re-renders only `TaskList`"
    hints:
      nudge:
        uk: "Пройдися по props кожного дочірнього компонента. Який шматок стану `App` передає рівно одному компоненту — і цей компонент сам його й змінює?"
        en: "Go through the props of every child. Which piece of `App` state is passed to exactly one component — which also changes it itself?"
      explanation:
        uk: |
          `query` бачать і `Toolbar` (поле), і `TaskList` (фільтрування) — він спільний. `tasks` читають `TaskList` і `Summary` — теж спільний. А той шматок, що йде лише в один компонент разом зі своїм setter, — кандидат на переїзд: оголоси `useState` усередині цього компонента, прибери відповідні props з його заголовка й тега, а виклики callback заміни викликом власного setter.

          Схожий приклад з іншою задачею: якщо `App` тримає `isMenuOpen` і передає його лише в `Header` разом з `onMenuToggle`, то в `Header` з’являється `const [isMenuOpen, setIsMenuOpen] = useState(false);`, а `App` про меню більше не знає.
        en: |
          `query` is seen by both `Toolbar` (the field) and `TaskList` (filtering) — it is shared. `tasks` is read by `TaskList` and `Summary` — shared too. But a piece that goes to only one component together with its setter is a candidate for moving: declare the `useState` inside that component, remove the matching props from its header and its tag, and replace the callback calls with a call of its own setter.

          A similar example with a different task: if `App` keeps `isMenuOpen` and passes it only to `Header` together with `onMenuToggle`, then `Header` gets `const [isMenuOpen, setIsMenuOpen] = useState(false);`, and `App` no longer knows about the menu.
    solutionNote:
      uk: "`expandedId` читає й змінює лише `TaskList`, а `note` — лише `NotePad`, тож вони переїхали туди. `tasks` (список і підсумок), `query` і `showDone` (панель і список) спільні й лишилися в `App` — найближчому спільному батькові. Тепер літера в нотатці й клік на назві справи рендерять по одному компоненту, а `App` отримав коротший і чесніший список того, що справді спільне."
      en: "`expandedId` is read and changed only by `TaskList`, and `note` only by `NotePad`, so they moved there. `tasks` (list and summary), `query` and `showDone` (toolbar and list) are shared and stayed in `App` — the closest common parent. Now a letter in the note and a click on a task title render one component each, and `App` got a shorter and more honest list of what is really shared."
    feedback:
      - when: { test: "expanding a task shows its due date, and a second click hides it" }
        message:
          uk: "Ця перевірка клацає «Здати книжки в бібліотеку»: кнопка має отримати `aria-expanded=\"true\"`, а пункт — показати `2026-03-01`. Другий клік має повернути `aria-expanded=\"false\"` і сховати дату."
          en: "This check clicks “Return library books”: the button must get `aria-expanded=\"true\"` and the item must show `2026-03-01`. A second click must bring back `aria-expanded=\"false\"` and hide the date."
      - when: { test: "the search and the done filter still narrow the list" }
        message:
          uk: "Ця перевірка вводить «бібл» у пошук і очікує лише «Здати книжки в бібліотеку», потім очищає пошук, знімає «Показувати виконані» й очікує три невиконані справи. Поле пошуку й список мають бачити той самий `query` — він спільний для `Toolbar` і `TaskList`."
          en: "This check types “librar” into the search and expects only “Return library books”, then clears the search, unticks “Show done tasks” and expects the three open tasks. The search field and the list must see the same `query` — it is shared by `Toolbar` and `TaskList`."
      - when: { test: "ticking a task updates the open count" }
        message:
          uk: "Ця перевірка очікує «Невиконаних: 3» на початку й «2» після позначки першої справи. `Summary` і `TaskList` мають читати той самий `tasks`."
          en: "This check expects “Open tasks: 3” at the start and “2” after ticking the first task. `Summary` and `TaskList` must read the same `tasks`."
      - when: { test: "the note keeps what is typed" }
        message:
          uk: "Ця перевірка вводить «Купити батарейки» в нотатку й очікує саме цей текст у полі: `value` і `onChange` поля мають працювати з тим самим станом."
          en: "This check types “Buy batteries” into the note and expects exactly that text in the field: the field's `value` and `onChange` must work with the same state."
      - when: { test: "typing a note re-renders only NotePad" }
        message:
          uk: "Ця перевірка вводить три літери в нотатку й очікує, що рендерився `NotePad`, а `App`, `Toolbar`, `TaskList` і `Summary` — ні. Стан, який читає лише нотатка, живе в ній самій."
          en: "This check types three letters into the note and expects `NotePad` to have rendered, but not `App`, `Toolbar`, `TaskList` or `Summary`. State that only the note reads lives in the note itself."
      - when: { test: "expanding a task re-renders only TaskList" }
        message:
          uk: "Ця перевірка клацає назву справи й очікує, що рендерився `TaskList`, а `App`, `Toolbar`, `Summary` і `NotePad` — ні. Яку справу розгорнуто, знає лише список."
          en: "This check clicks a task title and expects `TaskList` to have rendered, but not `App`, `Toolbar`, `Summary` or `NotePad`. Only the list knows which task is expanded."
      - when: { error: ReferenceError }
        message:
          uk: "Якщо картка каже `… is not defined`, після перенесення якась назва лишилася там, де її вже немає: стан, оголошений усередині компонента, видно лише в ньому."
          en: "If the card says `… is not defined`, after the move a name is still used where it no longer exists: state declared inside a component is visible only in that component."

  - id: to-project
    kind: transfer
    capstoneStep: RE-04
    body:
      uk: "У кроці проєкту цього розділу ти даси кожному шматку стану свого проєкту коротке пояснення «хто його читає». Список записів лишиться в найближчому спільному батькові, а чернетки форм, розгорнуті картки й подібне — у компонентах, які їх показують."
      en: "In this unit's project step you will give every piece of state in your project a short note on “who reads it”. The record list stays in the closest common parent, while form drafts, expanded cards and the like stay in the components that show them."
