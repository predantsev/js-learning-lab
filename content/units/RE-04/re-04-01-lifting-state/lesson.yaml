id: re-04-01-lifting-state
unit: RE-04
title:
  uk: "Піднімаємо стан"
  en: "Lifting state"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Знайти найближчого спільного батька двох компонентів, яким потрібен той самий стан, і перенести стан туди."
    en: "Find the closest common parent of two components that need the same state, and move the state there."
  - uk: "Передати вниз значення й callback для його зміни як props, щоб сусідні компоненти показували те саме."
    en: "Pass the value and a change callback down as props so that the siblings stay in sync."
prerequisites: [re-02-09-independent-controlled-crud, re-01-03-props-children-typed]
subskills:
  - { family: R-03, skill: "lifting state", depth: intro }
glossary: [lifting-state, state-ownership]
selfCheck: [predict-two-copies, wish-browser]

blocks:
  - id: two-copies-drift
    kind: explanation
    title:
      uk: "Дві копії одного списку"
      en: "Two copies of one list"
    body:
      uk: |
        Сторінка бажань має два компоненти: `WishList` показує бажання з прапорцями «куплено», а `Summary` під ним — рядок «Куплено: 1 з 4». Обом потрібен той самий список.

        Перше, що спадає на думку, — дати кожному свій `useState(WISHES)`. Обидва стартують з однакових даних, тож спершу все збігається. Але стан компонента належить **лише йому**: `setWishes` у `WishList` змінює список `WishList` і нічого не знає про список у `Summary`. Це дві незалежні змінні стану з однаковим початковим значенням, а не один список, який видно у двох місцях.

        Кажуть, що в кожного стану є [[state-ownership|власник]] — компонент, у якому викликано `useState` і лише який може його змінити. Тут власників два, тому й правд дві.
      en: |
        A wish page has two components: `WishList` shows the wishes with “acquired” checkboxes, and `Summary` below it shows the line “Bought: 1 of 4”. Both need the same list.

        The first idea that comes to mind is to give each one its own `useState(WISHES)`. Both start from the same data, so at first everything matches. But a component's state belongs **to it alone**: `setWishes` in `WishList` changes the `WishList` list and knows nothing about the list in `Summary`. These are two independent state variables with the same initial value, not one list visible in two places.

        We say that every piece of state has an [[state-ownership|owner]] — the component in which `useState` is called and which alone can change it. Here there are two owners, so there are two truths.

  - id: predict-two-copies
    kind: prediction
    prompt:
      uk: "На початку куплено лише «Термочашку»: «Куплено: 1 з 4». Користувач ставить прапорець біля «Навушників». Що тепер показує `Summary`?"
      en: "At the start only the “Travel mug” is acquired: “Bought: 1 of 4”. The user ticks the checkbox next to “Headphones”. What does `Summary` show now?"
    code: |
      function WishList() {
        const [wishes, setWishes] = useState(WISHES);
        // … a checkbox per wish calls setWishes with acquired flipped
      }

      function Summary() {
        const [wishes] = useState(WISHES);
        const acquired = wishes.filter((wish) => wish.acquired).length;
        return <p>Bought: {acquired} of {wishes.length}</p>;
      }

      export default function WishPage() {
        return (
          <section>
            <WishList />
            <Summary />
          </section>
        );
      }
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: stays-one
          text: { uk: "«Куплено: 1 з 4» — без змін", en: "“Bought: 1 of 4” — unchanged" }
        - id: two
          text: { uk: "«Куплено: 2 з 4»", en: "“Bought: 2 of 4”" }
          why:
            uk: "Так було б, якби обидва компоненти читали один список. Але кожен виклик `useState` створює окрему змінну стану: прапорець змінює копію `WishList`, а копія `Summary` лишається такою, як на старті."
            en: "That would happen if both components read one list. But every `useState` call creates a separate state variable: the checkbox changes the `WishList` copy, while the `Summary` copy stays as it was at the start."
        - id: error
          text: { uk: "React повідомить про помилку: два компоненти не можуть мати стан з однаковими даними", en: "React reports an error: two components cannot have state with the same data" }
          why:
            uk: "React не порівнює стани різних компонентів і не забороняє однакові початкові значення. Помилки немає — є дві правди, що мовчки розходяться."
            en: "React does not compare the state of different components and does not forbid equal initial values. There is no error — there are two truths that silently drift apart."
      correct: [stays-one]
    explanation:
      uk: "Прапорець викликає `setWishes` у `WishList`, тож перемальовується лише `WishList`. `Summary` має власну копію, яку ніхто не змінював, і далі показує «Куплено: 1 з 4». Перевірено в пісочниці з React 19.3: список показує дві позначки, а підсумок — одну."
      en: "The checkbox calls `setWishes` in `WishList`, so only `WishList` re-renders. `Summary` has its own copy that nobody changed, and it still shows “Bought: 1 of 4”. Checked in the sandbox with React 19.3: the list shows two ticks, the summary one."

  - id: recall-props
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: who-changes-props
        from: re-01-03-props-children-typed
        prompt:
          uk: "Компонент `Card` отримує props `{ title: string; children: ReactNode }`. Хто може змінити те, що `Card` показує як `title`?"
          en: "A `Card` component receives props `{ title: string; children: ReactNode }`. Who can change what `Card` shows as `title`?"
        answer:
          type: choice
          options:
            - id: parent
              text: { uk: "Лише компонент, що пише тег `<Card title=…>`: він передає інше значення на наступному рендері", en: "Only the component that writes the `<Card title=…>` tag: it passes another value on the next render" }
            - id: card-itself
              text: { uk: "Сам `Card`, присвоївши `props.title = …`", en: "`Card` itself, by assigning `props.title = …`" }
              why:
                uk: "Props — вхідні дані компонента, а не його власність. Компонент їх лише читає; присвоєння в `props` не перемальовує нічого й порушує чистоту рендеру."
                en: "Props are a component's input, not its property. The component only reads them; assigning to `props` re-renders nothing and breaks render purity."
            - id: children
              text: { uk: "Компоненти з `children`", en: "The components in `children`" }
              why:
                uk: "`children` — це готові елементи, які `Card` лише ставить на місце. Вони не мають доступу до props свого батька."
                en: "`children` are ready-made elements that `Card` only puts in place. They have no access to their parent's props."
          correct: [parent]
        explanation:
          uk: "Props ідуть згори вниз: значення `title` вирішує той, хто пише тег. Саме тому спільний стан підіймають **вгору**: тоді один власник передає однакові props усім, хто їх показує."
          en: "Props flow top down: the value of `title` is decided by whoever writes the tag. That is exactly why shared state is lifted **up**: then one owner passes the same props to everyone who shows them."

  - id: lift-explained
    kind: explanation
    title:
      uk: "Один власник, props униз, callback угору"
      en: "One owner, props down, a callback up"
    body:
      uk: |
        Щоб правда була одна, стан має жити в **одному** компоненті, з якого видно обох, кому він потрібен. Це [[lifting-state|підняття стану]]:

        1. Знайди найближчого спільного батька: `WishList` і `Summary` обидва стоять у `WishPage`.
        2. Перенеси `useState(WISHES)` і функцію `toggle` у `WishPage`, а з дочірніх компонентів прибери.
        3. Передай униз значення: `<Summary wishes={wishes} />`.
        4. Передай униз callback — функцію, яку дочірній компонент викличе, коли користувач щось змінить: `<WishList wishes={wishes} onToggle={toggle} />`.

        `WishList` тепер не володіє списком: він показує те, що отримав, а на клік викликає `onToggle(wish.id)`. Змінює стан лише власник, після чого він перемальовується й передає **новий** список обом дітям одночасно.
      en: |
        For there to be one truth, the state must live in **one** component that can see both components that need it. This is [[lifting-state|lifting state]]:

        1. Find the closest common parent: `WishList` and `Summary` both sit in `WishPage`.
        2. Move `useState(WISHES)` and the `toggle` function into `WishPage`, and remove them from the children.
        3. Pass the value down: `<Summary wishes={wishes} />`.
        4. Pass a callback down — a function the child calls when the user changes something: `<WishList wishes={wishes} onToggle={toggle} />`.

        `WishList` no longer owns the list: it shows what it received, and on a click it calls `onToggle(wish.id)`. Only the owner changes the state, then it re-renders and passes the **new** list to both children at once.

  - id: ownership-graph
    kind: visual
    visual: diagram
    title:
      uk: "Хто володіє списком бажань"
      en: "Who owns the wish list"
    textEquivalent:
      uk: "Спершу WishPage не має стану, а WishList і Summary мають по власній копії списку wishes. Прапорець у WishList змінює лише копію 1, тож Summary далі показує старе число. Після підняття список живе в WishPage — найближчому спільному батькові. WishPage передає WishList два props: wishes і callback onToggle, а Summary — лише wishes. Клік у WishList викликає onToggle, WishPage змінює свій стан і передає новий список обом дітям, тож вони знову показують те саме. Копії в дочірніх компонентах більше не потрібні."
      en: "At first WishPage has no state, while WishList and Summary each have their own copy of the wishes list. A checkbox in WishList changes only copy 1, so Summary still shows the old number. After lifting, the list lives in WishPage — the closest common parent. WishPage passes WishList two props: wishes and the callback onToggle, and Summary only wishes. A click in WishList calls onToggle, WishPage changes its state and passes the new list to both children, so they show the same thing again. The copies in the children are no longer needed."
    spec:
      layout: grid
      nodes:
        - { id: page, label: "WishPage", col: 0, row: 0, w: 130 }
        - { id: owned, label: { uk: "стан: wishes", en: "state: wishes" }, shape: note, col: 1, row: 0, w: 140 }
        - { id: list, label: "WishList", col: 0, row: 1, w: 130 }
        - { id: summary, label: "Summary", col: 1, row: 1, w: 140 }
        - { id: copy1, label: { uk: "копія 1: wishes", en: "copy 1: wishes" }, shape: note, col: 0, row: 2, w: 130 }
        - { id: copy2, label: { uk: "копія 2: wishes", en: "copy 2: wishes" }, shape: note, col: 1, row: 2, w: 140 }
      edges:
        - { id: page-list, from: page, to: list }
        - { id: page-summary, from: page, to: summary }
        - { id: list-copy1, from: list, to: copy1, kind: line }
        - { id: summary-copy2, from: summary, to: copy2, kind: line }
        - { id: page-owned, from: page, to: owned, kind: line }
      hidden: [owned, page-owned]
      steps:
        - caption:
            uk: "До підняття: `WishPage` лише показує двох дітей, а `WishList` і `Summary` мають по своїй копії списку."
            en: "Before lifting: `WishPage` only shows two children, while `WishList` and `Summary` each have their own copy of the list."
        - caption:
            uk: "Прапорець змінює копію 1. Копія 2 про це не знає — підсумок застарів."
            en: "A checkbox changes copy 1. Copy 2 does not know about it — the summary is stale."
          highlight: [list, copy1]
          annotate:
            - { id: copy2, text: { uk: "досі 1 з 4", en: "still 1 of 4" } }
        - caption:
            uk: "Підняття: список переїжджає в `WishPage` — найближчого спільного батька. Копії в дітях видаляємо."
            en: "Lifting: the list moves into `WishPage` — the closest common parent. The copies in the children are deleted."
          show: [owned, page-owned]
          highlight: [page, owned]
          dim: [copy1, copy2, list-copy1, summary-copy2]
        - caption:
            uk: "`WishPage` передає `WishList` два props: `wishes` і callback `onToggle`, а `Summary` — лише `wishes`."
            en: "`WishPage` passes `WishList` two props: `wishes` and the callback `onToggle`, and `Summary` only `wishes`."
          highlight: [page-list, page-summary]
          dim: [copy1, copy2, list-copy1, summary-copy2]
          annotate:
            - { id: page-list, text: "wishes, onToggle" }
            - { id: page-summary, text: "wishes" }
        - caption:
            uk: "Клік викликає `onToggle`, власник змінює свій стан і передає новий список обом дітям. Вони знову показують те саме."
            en: "A click calls `onToggle`, the owner changes its state and passes the new list to both children. They show the same thing again."
          highlight: [list, page, owned, summary]
          dim: [copy1, copy2, list-copy1, summary-copy2]
          annotate:
            - { id: summary, text: { uk: "2 з 4", en: "2 of 4" } }

  - id: two-copies
    kind: example
    runtime: browser-react
    dir: two-copies
    entry: main.jsx
    strings:
      heading: { uk: "Мої бажання", en: "My wishes" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      bought: { uk: "Куплено:", en: "Bought:" }
      of: { uk: "з", en: "of" }
    title:
      uk: "Дві копії розходяться — і сходяться після підняття"
      en: "Two copies drift apart — and agree after lifting"
    body:
      uk: |
        `WishList` і `Summary` у `App.jsx` мають по власному `useState(WISHES)`. Натисни **Запустити** й на **Сторінці** постав прапорець біля «Навушників»: список змінився, а рядок «Куплено: 1 з 4» — ні.
      en: |
        `WishList` and `Summary` in `App.jsx` each have their own `useState(WISHES)`. Press **Run** and on the **Page** tick the checkbox next to “Headphones”: the list changed, the line “Bought: 1 of 4” did not.
    tryIt:
      uk: |
        Підніми список у `WishPage` — чотири правки в `App.jsx`:

        1. Переріж рядок `const [wishes, setWishes] = useState(WISHES);` і функцію `toggle` з `WishList` і встав їх у `WishPage` перед `return`.
        2. Заголовок `function WishList()` заміни на `function WishList({ wishes, onToggle })`, а в `onChange` заміни `toggle(wish.id)` на `onToggle(wish.id)`.
        3. У `Summary` видали рядок `const [wishes] = useState(WISHES);`, а заголовок заміни на `function Summary({ wishes })`.
        4. У `WishPage` заміни `<WishList />` на `<WishList wishes={wishes} onToggle={toggle} />`, а `<Summary />` — на `<Summary wishes={wishes} />`.

        Запусти й постав той самий прапорець: тепер підсумок каже «Куплено: 2 з 4». Зніми його — знову «1 з 4».
      en: |
        Lift the list into `WishPage` — four edits in `App.jsx`:

        1. Cut the line `const [wishes, setWishes] = useState(WISHES);` and the `toggle` function out of `WishList` and paste them into `WishPage` before `return`.
        2. Replace the header `function WishList()` with `function WishList({ wishes, onToggle })`, and in `onChange` replace `toggle(wish.id)` with `onToggle(wish.id)`.
        3. In `Summary` delete the line `const [wishes] = useState(WISHES);`, and replace its header with `function Summary({ wishes })`.
        4. In `WishPage` replace `<WishList />` with `<WishList wishes={wishes} onToggle={toggle} />`, and `<Summary />` with `<Summary wishes={wishes} />`.

        Run and tick the same checkbox: now the summary says “Bought: 2 of 4”. Untick it — “1 of 4” again.

  - id: closest-not-top
    kind: explanation
    title:
      uk: "Найближчий спільний батько, а не App"
      en: "The closest common parent, not App"
    body:
      uk: |
        «Підняти» не означає «винести на самий верх». Стан підіймають рівно до **найближчого** компонента, з якого видно всіх, кому він потрібен, — і не вище.

        Чому не одразу в `App`? Коли стан змінюється, перемальовується його власник і все під ним. Стан у `App` перемальовує весь застосунок навіть тоді, коли він потрібен двом сусідам глибоко внизу. А ще кожен проміжний компонент мусить приймати й передавати props, які йому самому не потрібні.

        Те саме питання ставлять і для кожного іншого стану: **кому він потрібен?** Чернетку в полі вводу бачить і змінює лише форма — отже, вона лишається у формі, навіть якщо сусідні дані піднято.
      en: |
        “Lifting” does not mean “moving to the very top”. State is lifted exactly to the **closest** component that can see everyone who needs it — and no higher.

        Why not straight into `App`? When state changes, its owner and everything below it re-render. State in `App` re-renders the whole app even when only two neighbours deep down need it. And every component in between has to accept and pass on props it does not need itself.

        Ask the same question about every other piece of state: **who needs it?** A draft in an input is seen and changed only by the form — so it stays in the form, even if the neighbouring data is lifted.

  - id: wish-browser
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: wish-browser
    entry: main.jsx
    editable: [App.jsx]
    strings:
      heading: { uk: "Мої бажання", en: "My wishes" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      price: { uk: "Ціна:", en: "Price:" }
      newName: { uk: "Нова назва", en: "New name" }
      rename: { uk: "Перейменувати", en: "Rename" }
      newBike: { uk: "Гірський велосипед", en: "Mountain bike" }
    title:
      uk: "Список і панель деталей з одним вибором"
      en: "A list and a detail panel with one selection"
    instructions:
      uk: |
        `WishBrowser` показує список бажань (`WishList`) і панель деталей (`WishDetail`). Список бажань уже живе у `WishBrowser`, а от вибране бажання — ні: і список, і панель тримають власний `selectedId`. Тому клік у списку позначає кнопку, а панель завжди показує «Навушники».

        Зміни `App.jsx` так, щоб:

        - **id** вибраного бажання жив в одному місці — у найближчому спільному батькові списку й панелі, а не вище;
        - список позначав вибране через `aria-pressed` і повідомляв про клік через callback;
        - панель показувала назву й ціну вибраного, а перейменування змінювало назву і в списку, і в панелі;
        - чернетка нової назви лишилася в `WishDetail`.

        `renders.js` (лише для читання) рахує рендери кожного компонента. Перевірки використовують ці числа: під час введення назви мають перемальовуватися лише деталі, а вибір бажання не має перемальовувати `App`.
      en: |
        `WishBrowser` shows a wish list (`WishList`) and a detail panel (`WishDetail`). The list of wishes already lives in `WishBrowser`, but the selected wish does not: the list and the panel each keep their own `selectedId`. So a click in the list marks the button, while the panel always shows “Headphones”.

        Change `App.jsx` so that:

        - the **id** of the selected wish lives in one place — in the closest common parent of the list and the panel, and no higher;
        - the list marks the selected wish with `aria-pressed` and reports a click through a callback;
        - the panel shows the name and price of the selected wish, and renaming changes the name both in the list and in the panel;
        - the draft of the new name stays in `WishDetail`.

        `renders.js` (read-only) counts the renders of every component. The checks use these numbers: while a name is being typed only the details may re-render, and selecting a wish must not re-render `App`.
    testTitles:
      "selecting a wish in the list shows it in the detail panel":
        uk: "Вибір бажання в списку показує його в панелі деталей"
        en: "Selecting a wish in the list shows it in the detail panel"
      "the list marks exactly the selected wish":
        uk: "Список позначає саме вибране бажання"
        en: "The list marks exactly the selected wish"
      "renaming updates the list and the detail panel":
        uk: "Перейменування змінює і список, і панель деталей"
        en: "Renaming updates the list and the detail panel"
      "typing a new name re-renders only the detail panel":
        uk: "Введення нової назви перемальовує лише панель деталей"
        en: "Typing a new name re-renders only the detail panel"
      "selecting a wish does not re-render App":
        uk: "Вибір бажання не перемальовує `App`"
        en: "Selecting a wish does not re-render `App`"
    hints:
      nudge:
        uk: "Кому потрібен `selectedId`? Обом дітям `WishBrowser`. А кому потрібна чернетка? Лише формі в панелі."
        en: "Who needs `selectedId`? Both children of `WishBrowser`. And who needs the draft? Only the form in the panel."
      explanation:
        uk: |
          Стан, потрібний двом сусідам, оголошують у їхньому спільному батькові, а дітям передають значення й callback. Схожий приклад з іншою задачею: відкрита вкладка, яку бачать і панель вкладок, і вміст, — `const [tab, setTab] = useState("info");` у батькові, далі `<Tabs current={tab} onPick={setTab} />` і `<TabBody tab={tab} />`.

          Зберігай саме **id**, а не копію об’єкта бажання: копія не дізнається про перейменування, а за id панель щоразу знаходить свіжий запис у списку.
        en: |
          State that two neighbours need is declared in their common parent, and the children get the value and a callback. A similar example with a different task: an open tab seen by both the tab bar and the content — `const [tab, setTab] = useState("info");` in the parent, then `<Tabs current={tab} onPick={setTab} />` and `<TabBody tab={tab} />`.

          Store the **id**, not a copy of the wish object: a copy never hears about a rename, while by id the panel finds the fresh record in the list every time.
    solutionNote:
      uk: "`selectedId` переїхав у `WishBrowser` — найближчого батька, з якого видно і список, і панель. Список отримує `selectedId` і `onSelect`, панель — `selectedId` і знаходить запис у свіжому `wishes`, тож перейменування видно в обох місцях. Чернетка лишилася в `WishDetail`, тому введення перемальовує лише панель, а `App` не перемальовується взагалі: його стан не змінюється."
      en: "`selectedId` moved into `WishBrowser` — the closest parent that can see both the list and the panel. The list gets `selectedId` and `onSelect`, the panel gets `selectedId` and finds the record in the fresh `wishes`, so a rename is visible in both places. The draft stayed in `WishDetail`, so typing re-renders only the panel, and `App` does not re-render at all: its state does not change."
    feedback:
      - when: { test: "selecting a wish in the list shows it in the detail panel" }
        message:
          uk: "Ця перевірка клацає «Настільна лампа», потім «Велосипед» у списку й щоразу очікує ту саму назву в заголовку панелі (`h3`), а для лампи — ціну 45. Панель має отримувати вибір від спільного батька, а не тримати власну копію."
          en: "This check clicks “Desk lamp” and then “Bicycle” in the list and each time expects the same name in the panel heading (`h3`), and the price 45 for the lamp. The panel must get the selection from the common parent, not keep its own copy."
      - when: { test: "the list marks exactly the selected wish" }
        message:
          uk: "Ця перевірка клацає «Термочашка» й очікує `aria-pressed=\"true\"` лише на цій кнопці списку."
          en: "This check clicks “Travel mug” and expects `aria-pressed=\"true\"` only on that list button."
      - when: { test: "renaming updates the list and the detail panel" }
        message:
          uk: "Ця перевірка вибирає «Велосипед», вводить «Гірський велосипед» у поле «Нова назва» й надсилає форму. Нова назва має замінити «Велосипед» і на кнопці списку, і в заголовку панелі, а «Навушники» — лишитися. Якщо змінився лише список, панель показує збережену копію об’єкта — зберігай id."
          en: "This check selects “Bicycle”, types “Mountain bike” into the “New name” field and submits the form. The new name must replace “Bicycle” both on the list button and in the panel heading, and “Headphones” must stay. If only the list changed, the panel shows a stored copy of the object — store the id."
      - when: { test: "typing a new name re-renders only the detail panel" }
        message:
          uk: "Ця перевірка вводить три літери в поле «Нова назва» й очікує, що `WishDetail` перемальовувався, а `WishBrowser` і `WishList` — ні. Чернетка потрібна лише панелі, тож її стан лишається у `WishDetail`."
          en: "This check types three letters into the “New name” field and expects `WishDetail` to have re-rendered, but not `WishBrowser` or `WishList`. Only the panel needs the draft, so its state stays in `WishDetail`."
      - when: { test: "selecting a wish does not re-render App" }
        message:
          uk: "Ця перевірка клацає бажання в списку й очікує, що `WishBrowser` перемальовувався, а `App` — ні. Вибір потрібен лише дітям `WishBrowser`, тож він живе там, а не в `App`."
          en: "This check clicks a wish in the list and expects `WishBrowser` to have re-rendered, but not `App`. Only the children of `WishBrowser` need the selection, so it lives there, not in `App`."
      - when: { error: ReferenceError }
        message:
          uk: "Якщо картка каже `… is not defined`, якась назва зникла під час перенесення: перевір, що props `selectedId` і callback оголошено в дужках компонента, який їх читає."
          en: "If the card says `… is not defined`, some name went missing during the move: check that the props `selectedId` and the callback are declared in the parentheses of the component that reads them."

  - id: to-project
    kind: transfer
    capstoneStep: RE-04
    body:
      uk: "У твоєму проєкті список записів потрібен щонайменше двом частинам: самому списку та підсумку чи фільтру. У кроці проєкту цього розділу ти знайдеш їхнього найближчого спільного батька й залишиш список там — з одним власником і callback для кожної зміни, — а чернетки форм залишиш у формах."
      en: "In your project the record list is needed by at least two parts: the list itself and a summary or a filter. In this unit's project step you will find their closest common parent and keep the list there — with one owner and a callback for every change — while form drafts stay in their forms."
