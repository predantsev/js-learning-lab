      uk: "Перш ніж завершити крок проєкту цього розділу, пройди ті самі три перевірки: введи літеру в поле форми й подивися, хто рендериться; пошукай хуки після `?` чи в `if`; і звір кожну функцію свого хука даних з його контрактом."
      en: "Before you finish this unit's project step, go through the same three checks: type a letter into a form field and see who renders; look for hooks after `?` or inside `if`; and compare every function of your data hook with its contract."
