    title:
      uk: "Dispatch витрат через context"
      en: "The expense dispatch through a context"
    instructions:
      uk: |
        `ExpensePage` володіє витратами через `useReducer`, а `dispatch` просвердлено крізь `ExpenseBoard` і `ExpenseList` до рядків і форми.

        1. У `recordsDispatch.ts` дай `RecordsDispatchContext` тип: значення — `Dispatch<ExpenseAction>` або `null`, за замовчуванням `null`. Напиши `useRecordsDispatch()`: повертає `dispatch` з context, а поза provider кидає `Error`, у тексті якого є назва `useRecordsDispatch`.
        2. У `App.tsx` постав provider так, щоб у межі були і рядки, і форма. `ExpenseRow` і `AddExpenseForm` беруть `dispatch` через `useRecordsDispatch()`; `ExpenseList` отримує лише `expenses`, `AddExpenseForm` — жодних props, а `ExpenseBoard` більше не знає про `dispatch`.

        Перевірки малюють `ExpenseList` і `AddExpenseForm` окремо всередині `RecordsDispatchContext` з власною функцією-шпигуном, малюють компонент із `useRecordsDispatch()` поза provider і проходять сценарій на всій сторінці.
      en: |
        `ExpensePage` owns the expenses through `useReducer`, and `dispatch` is drilled through `ExpenseBoard` and `ExpenseList` down to the rows and the form.

        1. In `recordsDispatch.ts` give `RecordsDispatchContext` a type: its value is `Dispatch<ExpenseAction>` or `null`, `null` by default. Write `useRecordsDispatch()`: it returns `dispatch` from the context, and outside a provider it throws an `Error` whose text contains the name `useRecordsDispatch`.
        2. In `App.tsx` place the provider so that both the rows and the form are inside its boundary. `ExpenseRow` and `AddExpenseForm` take `dispatch` through `useRecordsDispatch()`; `ExpenseList` gets only `expenses`, `AddExpenseForm` gets no props, and `ExpenseBoard` no longer knows about `dispatch`.

        The checks draw `ExpenseList` and `AddExpenseForm` on their own inside `RecordsDispatchContext` with their own spy function, draw a component with `useRecordsDispatch()` outside any provider and go through a scenario on the whole page.
    testTitles:
      "useRecordsDispatch returns the function given to the context":
        uk: "`useRecordsDispatch` повертає функцію, передану в context"
        en: "`useRecordsDispatch` returns the function given to the context"
      "outside the context the hook throws an error that names it":
        uk: "Поза context хук кидає помилку зі своєю назвою"
        en: "Outside the context the hook throws an error that names it"
      "a row sends removed through the context":
        uk: "Рядок надсилає `removed` через context"
        en: "A row sends `removed` through the context"
      "the form sends added through the context":
        uk: "Форма надсилає `added` через context"
        en: "The form sends `added` through the context"
      "the page still adds and removes expenses":
        uk: "Сторінка, як і раніше, додає й прибирає витрати"
        en: "The page still adds and removes expenses"
    hints:
      nudge:
        uk: "Почни з `recordsDispatch.ts`: які два значення може мати context і що хук робить у кожному випадку? Потім знайди в `App.tsx` найнижчий компонент, у межі якого опиняться і рядки, і форма."
        en: "Start with `recordsDispatch.ts`: which two values can the context have, and what does the hook do in each case? Then find the lowest component in `App.tsx` whose boundary contains both the rows and the form."
      explanation:
        uk: |
          Тип context задають у `createContext<…>(…)`: union з `null` і `null` як значення за замовчуванням. Хук читає `useContext(…)`, перевіряє на `null` (тоді `throw new Error("…")` з назвою хука) і повертає значення — після перевірки `tsc` знає, що це вже не `null`.

          Provider має обіймати і список, і форму, тож його ставлять там, де є `dispatch` і звідки видно обох. Схожий приклад з іншою задачею: тема інтерфейсу — `<ThemeContext value={theme}><Layout /></ThemeContext>` у компоненті, що володіє `theme`, і `const theme = useTheme();` у кнопці глибоко всередині `Layout`.
        en: |
          A context's type is given in `createContext<…>(…)`: a union with `null`, and `null` as the default. The hook reads `useContext(…)`, checks for `null` (then `throw new Error("…")` with the hook's name) and returns the value — after the check `tsc` knows it is no longer `null`.

          The provider must enclose both the list and the form, so it goes where `dispatch` exists and from where both can be seen. A similar example with a different task: an interface theme — `<ThemeContext value={theme}><Layout /></ThemeContext>` in the component that owns `theme`, and `const theme = useTheme();` in a button deep inside `Layout`.
    solutionNote:
      uk: "Context має тип `Dispatch<ExpenseAction> | null` і значення `null` за замовчуванням, тож компонент поза provider не мовчить, а падає з помилкою, що називає `useRecordsDispatch`. Provider стоїть у `ExpensePage` — власника `dispatch` — і обіймає всю дошку, отже й рядки, і форму. Проміжні `ExpenseBoard` і `ExpenseList` більше не передають того, чим не користуються. `dispatch` з `useReducer` не змінюється між рендерами, тож context не перемальовує споживачів даремно."
      en: "The context has the type `Dispatch<ExpenseAction> | null` and the default `null`, so a component outside the provider does not stay silent but fails with an error that names `useRecordsDispatch`. The provider sits in `ExpensePage` — the owner of `dispatch` — and encloses the whole board, so both the rows and the form. `ExpenseBoard` and `ExpenseList` in between no longer pass on what they do not use. The `dispatch` from `useReducer` does not change between renders, so the context does not re-render its consumers needlessly."
    feedback:
      - when: { test: "useRecordsDispatch returns the function given to the context" }
        message:
          uk: "Ця перевірка кладе в `RecordsDispatchContext` свою функцію й очікує, що `useRecordsDispatch()` усередині поверне саме її, без помилки. Хук має читати `useContext(RecordsDispatchContext)`."
          en: "This check puts its own function into `RecordsDispatchContext` and expects `useRecordsDispatch()` inside to return exactly that function, without an error. The hook must read `useContext(RecordsDispatchContext)`."
      - when: { test: "outside the context the hook throws an error that names it" }
        message:
          uk: "Ця перевірка малює компонент з `useRecordsDispatch()` поза будь-яким provider і очікує одну помилку, у тексті якої є `useRecordsDispatch`. Значення за замовчуванням має бути `null`, а хук — кидати на нього `Error`, а не повертати «порожню» функцію."
          en: "This check draws a component with `useRecordsDispatch()` outside any provider and expects one error whose text contains `useRecordsDispatch`. The default value must be `null`, and the hook must throw an `Error` on it instead of returning an “empty” function."
      - when: { test: "a row sends removed through the context" }
        message:
          uk: "Ця перевірка малює `<ExpenseList expenses={…} />` без `dispatch` усередині context зі своєю функцією, клацає «Прибрати» в другому рядку й очікує виклик з `{ type: \"removed\", id: \"e-08\" }`. Рядок має брати `dispatch` з `useRecordsDispatch()`, а не з props."
          en: "This check draws `<ExpenseList expenses={…} />` without `dispatch` inside a context with its own function, clicks “Remove” in the second row and expects a call with `{ type: \"removed\", id: \"e-08\" }`. The row must take `dispatch` from `useRecordsDispatch()`, not from props."
      - when: { test: "the form sends added through the context" }
        message:
          uk: "Ця перевірка малює `<AddExpenseForm />` без props усередині context, вводить «Квитки в кіно» й 300 і очікує один виклик з action `added`, де `label` — «Квитки в кіно», а `amountMinor` — 30000."
          en: "This check draws `<AddExpenseForm />` without props inside a context, types “Cinema tickets” and 300 and expects one call with an `added` action whose `label` is “Cinema tickets” and whose `amountMinor` is 30000."
      - when: { test: "the page still adds and removes expenses" }
        message:
          uk: "Ця перевірка на цілій сторінці прибирає першу витрату, додає «Квитки в кіно» на 300 і очікує три витрати, «Разом: 1000.00» і жодної помилки React. Помилка з `useRecordsDispatch` тут означає, що рядки чи форма опинилися поза межею provider."
          en: "This check, on the whole page, removes the first expense, adds “Cinema tickets” for 300 and expects three expenses, “Total: 1000.00” and no React error. An error from `useRecordsDispatch` here means the rows or the form ended up outside the provider's boundary."
      - when: { error: TypeError }
        message:
          uk: "`TypeError: dispatch is not a function` означає, що компонент досі читає `dispatch` з props, а їх йому вже не передають. Такий компонент має брати `dispatch` з `useRecordsDispatch()`."
          en: "`TypeError: dispatch is not a function` means a component still reads `dispatch` from props, which are no longer passed to it. Such a component must take `dispatch` from `useRecordsDispatch()`."

  - id: to-project
    kind: transfer
    capstoneStep: RE-04
    body:
      uk: "У кроці проєкту цього розділу спершу спробуй композицію: обгортки з `children` часто прибирають увесь drilling. Якщо `dispatch` твого reducer усе ж потрібен на різній глибині, дай йому типізований context із хуком-охоронцем — і постав provider довкола тих частин, яким він потрібен, а не довкола всього застосунку."
      en: "In this unit's project step try composition first: wrappers with `children` often remove all the drilling. If your reducer's `dispatch` is still needed at different depths, give it a typed context with a guard hook — and place the provider around the parts that need it, not around the whole app."
