    strings:
      heading: { uk: "Мої звички", en: "My habits" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      stretch: { uk: "Розтяжка", en: "Stretching" }
      remove: { uk: "Прибрати", en: "Remove" }
      newHabit: { uk: "Нова звичка", en: "New habit" }
      add: { uk: "Додати", en: "Add" }
      which: { uk: "Яку звичку", en: "Which habit" }
      newName: { uk: "Нова назва", en: "New name" }
      rename: { uk: "Перейменувати", en: "Rename" }
    title:
      uk: "Типізований reducer для звичок"
      en: "A typed reducer for habits"
    instructions:
      uk: |
        `App.tsx` (лише для читання) уже викликає `useReducer(habitsReducer, START_HABITS)` і надсилає чотири actions:

        | `type` | Інші поля | Що має статися |
        |---|---|---|
        | `"added"` | `habit` — уся нова звичка | звичка з’являється в кінці списку |
        | `"updated"` | `id`, `name` | звичка з цим `id` отримує нову назву, решта її полів — як були |
        | `"removed"` | `id` | звичка з цим `id` зникає |
        | `"activeToggled"` | `id` | у звички з цим `id` `active` змінюється на протилежне |

        У `habitsReducer.ts` опиши ці actions типом `HabitAction` — discriminated union — і напиши `habitsReducer`. Кожен action повертає **новий** масив, а масив, який reducer отримав, і звички в ньому лишаються незмінними.

        Перевірки викликають `habitsReducer` напряму із замороженим списком (зміна такого списку кидає `TypeError`), порівнюють список до й після виклику і проходять сценарій на сторінці. Типи пісочниця лише прибирає; щоб їх перевірити, скопіюй файли в `ts-lab` і запусти `npx tsc --noEmit` — це не обов’язково.
      en: |
        `App.tsx` (read-only) already calls `useReducer(habitsReducer, START_HABITS)` and dispatches four actions:

        | `type` | Other fields | What must happen |
        |---|---|---|
        | `"added"` | `habit` — the whole new habit | the habit appears at the end of the list |
        | `"updated"` | `id`, `name` | the habit with this `id` gets the new name, its other fields stay as they were |
        | `"removed"` | `id` | the habit with this `id` disappears |
        | `"activeToggled"` | `id` | the habit with this `id` gets the opposite `active` |

        In `habitsReducer.ts` describe these actions with the type `HabitAction` — a discriminated union — and write `habitsReducer`. Every action returns a **new** array, and the array the reducer received and the habits in it stay unchanged.

        The checks call `habitsReducer` directly with a frozen list (changing such a list throws a `TypeError`), compare the list before and after the call and go through a scenario on the page. The sandbox only removes types; to check them, copy the files into `ts-lab` and run `npx tsc --noEmit` — that is optional.
    testTitles:
      "added puts the new habit at the end":
        uk: "`added` ставить нову звичку в кінець"
        en: "`added` puts the new habit at the end"
      "updated renames only that habit and keeps its other fields":
        uk: "`updated` перейменовує лише цю звичку й зберігає решту її полів"
        en: "`updated` renames only that habit and keeps its other fields"
      "removed drops only that habit":
        uk: "`removed` прибирає лише цю звичку"
        en: "`removed` drops only that habit"
      "activeToggled flips active of that habit only":
        uk: "`activeToggled` змінює `active` лише цієї звички"
        en: "`activeToggled` flips `active` of that habit only"
      "every action returns a new list and leaves the old one unchanged":
        uk: "Кожен action повертає новий список і не змінює старий"
        en: "Every action returns a new list and leaves the old one unchanged"
      "the page adds, toggles, renames and removes through the reducer":
        uk: "Сторінка додає, перемикає, перейменовує й прибирає через reducer"
        en: "The page adds, toggles, renames and removes through the reducer"
    hints:
      nudge:
        uk: "Почни з типу: чотири варіанти, у кожного свій `type` і свої поля з таблиці. Потім `switch (action.type)` з одним `case` на варіант. Який метод масиву повертає новий масив для кожної з чотирьох дій?"
        en: "Start with the type: four members, each with its own `type` and its own fields from the table. Then `switch (action.type)` with one `case` per member. Which array method returns a new array for each of the four actions?"
      explanation:
        uk: |
          Додати в кінець без зміни — розгорнути старий масив у новий. Прибрати — `filter`. Змінити одне поле одного запису — `map`, який для потрібного `id` повертає **копію** запису зі зміненим полем (`{ ...record, field: … }`), а для решти — той самий запис. Копія без `...record` загубить інші поля.

          Схожий приклад з іншою задачею: reducer кошика, що змінює кількість товару, — `case "quantitySet": return items.map((item) => (item.sku === action.sku ? { ...item, quantity: action.quantity } : item));`.
        en: |
          Adding at the end without a change means spreading the old array into a new one. Removing is `filter`. Changing one field of one record is a `map` that returns a **copy** of the record with the changed field (`{ ...record, field: … }`) for the matching `id`, and the same record for the rest. A copy without `...record` loses the other fields.

          A similar example with a different task: a cart reducer that sets an item's quantity — `case "quantitySet": return items.map((item) => (item.sku === action.sku ? { ...item, quantity: action.quantity } : item));`.
    solutionNote:
      uk: "`HabitAction` — union з чотирьох варіантів, тож у кожному `case` `tsc` знає, які поля має `action`. Жодна гілка не змінює `habits`: розгортання, `filter` і `map` повертають нові масиви, а `{ ...habit, … }` — нову звичку з усіма старими полями. Тому React бачить новий стан і перемальовує сторінку. Перевірка `never` у `default` змусить `tsc` нагадати про `case`, коли з’явиться п’ятий action."
      en: "`HabitAction` is a union of four members, so in every `case` `tsc` knows which fields `action` has. No branch changes `habits`: spreading, `filter` and `map` return new arrays, and `{ ...habit, … }` returns a new habit with all the old fields. So React sees new state and re-renders the page. The `never` check in `default` will make `tsc` remind you of the `case` once a fifth action appears."
    feedback:
      - when: { test: "added puts the new habit at the end" }
        message:
          uk: "Ця перевірка надсилає `added` зі звичкою `h-09` у заморожений список і очікує п’ять звичок, з `h-09` останньою. Якщо бачиш `TypeError` про `object is not extensible`, reducer змінює отриманий масив (`push`) — поверни новий."
          en: "This check sends `added` with the habit `h-09` to a frozen list and expects five habits, with `h-09` last. If you see a `TypeError` about `object is not extensible`, the reducer changes the array it received (`push`) — return a new one."
      - when: { test: "updated renames only that habit and keeps its other fields" }
        message:
          uk: "Ця перевірка перейменовує `h-02` і очікує, що змінилася лише її назва, а `frequency`, `active` і `completions` — як були. Нова звичка має містити всі поля старої."
          en: "This check renames `h-02` and expects only its name to change, with `frequency`, `active` and `completions` as they were. The new habit must contain all fields of the old one."
      - when: { test: "removed drops only that habit" }
        message:
          uk: "Ця перевірка прибирає `h-04` і очікує `h-01`, `h-02`, `h-05` у тому самому порядку."
          en: "This check removes `h-04` and expects `h-01`, `h-02`, `h-05` in the same order."
      - when: { test: "activeToggled flips active of that habit only" }
        message:
          uk: "Ця перевірка перемикає `h-05` (усі чотири стають активними), а потім `h-01` (лише вона стає неактивною). Змінюватися має лише звичка з переданим `id`."
          en: "This check toggles `h-05` (all four become active), then `h-01` (only it becomes inactive). Only the habit with the given `id` may change."
      - when: { test: "every action returns a new list and leaves the old one unchanged" }
        message:
          uk: "Ця перевірка надсилає кожен із чотирьох actions і очікує, що повернувся **інший** масив, а переданий лишився таким, як був. Повернути той самий масив після зміни — значить, React не побачить змін."
          en: "This check sends each of the four actions and expects a **different** array back, while the one passed in stays as it was. Returning the same array after a change means React will not see the change."
      - when: { test: "the page adds, toggles, renames and removes through the reducer" }
        message:
          uk: "Ця перевірка на сторінці додає «Прогулянка», вмикає четверту звичку, перейменовує другу на «Розтяжка» й прибирає першу, перевіряючи список після кожного кроку. Якщо reducer правильний у решті перевірок, а тут ні, звір назви полів action з таблицею."
          en: "This check, on the page, adds “Go for a walk”, switches on the fourth habit, renames the second one to “Stretching” and removes the first, checking the list after each step. If the reducer passes the other checks but not this one, compare the action field names with the table."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` з `Cannot assign to read only property` чи `object is not extensible` означає, що reducer змінює отриманий список чи звичку. Створюй нові масиви й об’єкти замість змін."
          en: "A `TypeError` with `Cannot assign to read only property` or `object is not extensible` means the reducer changes the list or habit it received. Create new arrays and objects instead of changing them."

  - id: to-project
    kind: transfer
    capstoneStep: RE-04
    body:
      uk: "У кроці проєкту цього розділу список твого проєкту переїде в типізований reducer: для списку бажань — `itemsReducer` з actions `added`, `updated`, `removed`, `acquiredToggled`, для решти проєктів — подібний набір. Тип actions і перевірка `never` змусять `tsc` нагадати про кожну забуту гілку."
      en: "In this unit's project step your project's list moves into a typed reducer: for the wishlist an `itemsReducer` with the actions `added`, `updated`, `removed`, `acquiredToggled`, for the other projects a similar set. The action type and the `never` check make `tsc` remind you of every forgotten branch."
