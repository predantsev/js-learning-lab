        export type EditorAction =
          | { type: "editStarted"; id: string }
          | { type: "draftChanged"; text: string }
          | { type: "saveRequested" }
          | { type: "editCanceled" };
        
        export function editorReducer(state: EditorState, action: EditorAction): EditorState {
          switch (action.type) {
            case "editStarted": {
              if (state.mode !== "browsing") return state;
