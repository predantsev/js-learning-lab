id: re-04-03-reducers-typed
unit: RE-04
title:
  uk: "Reducers і типізовані actions"
  en: "Reducers and typed actions"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Перенести розкидані виклики setter у reducer `(state, action) => nextState` і надсилати actions з обробників через `dispatch`."
    en: "Move scattered setter calls into a reducer `(state, action) => nextState` and dispatch actions from the handlers."
  - uk: "Типізувати actions як discriminated union з вичерпним `switch`, щоб одруківка в `type` чи неправильні дані action ставали помилкою компіляції."
    en: "Type the actions as a discriminated union with an exhaustive switch so that a misspelled type or a wrong payload fails at compile time."
  - uk: "Намалювати reducer як автомат станів і відхилити неможливий перехід, наприклад збереження, коли нічого не редагується."
    en: "Draw the reducer as a state machine and reject an invalid transition, such as saving while nothing is being edited."
prerequisites: [re-04-02-where-state-lives, js-14-03-unions-narrowing]
subskills:
  - { family: R-03, skill: "reducer state transitions", depth: intro }
  - { family: P-05, skill: "typed reducers/context", depth: intro }
glossary: [use-reducer, dispatch, reducer-action]
selfCheck: [predict-next-state, habit-list]

blocks:
  - id: setters-to-reducer
    kind: explanation
    title:
      uk: "Усі зміни — в одній функції"
      en: "All changes in one function"
    body:
      uk: |
        Коли список має кілька операцій, виклики `setTasks(…)` розповзаються по обробниках: один додає, інший прибирає, третій позначає. Щоб зрозуміти, як список **може** змінюватися, доводиться читати весь компонент.

        [[use-reducer|useReducer]] збирає всі зміни в одну чисту функцію поза компонентом — reducer:

        ```jsx
        function tasksReducer(tasks, action) {
          switch (action.type) {
            case "added":
              return [...tasks, action.task];
            case "removed":
              return tasks.filter((task) => task.id !== action.id);
            default:
              return tasks;
          }
        }

        const [tasks, dispatch] = useReducer(tasksReducer, START_TASKS);
        ```

        Обробник більше не обчислює новий список — він лише повідомляє, **що сталося**: `dispatch({ type: "removed", id: task.id })`. Такий об’єкт — [[reducer-action|action]], а [[dispatch]] передає його React. React викликає reducer з поточним станом і цим action, а те, що reducer повернув, стає новим станом і дає новий рендер.
      en: |
        When a list has several operations, `setTasks(…)` calls spread across the handlers: one adds, another removes, a third marks. To understand how the list **can** change, you have to read the whole component.

        [[use-reducer|useReducer]] gathers every change into one pure function outside the component — the reducer:

        ```jsx
        function tasksReducer(tasks, action) {
          switch (action.type) {
            case "added":
              return [...tasks, action.task];
            case "removed":
              return tasks.filter((task) => task.id !== action.id);
            default:
              return tasks;
          }
        }

        const [tasks, dispatch] = useReducer(tasksReducer, START_TASKS);
        ```

        A handler no longer computes the new list — it only reports **what happened**: `dispatch({ type: "removed", id: task.id })`. Such an object is an [[reducer-action|action]], and [[dispatch]] hands it to React. React calls the reducer with the current state and this action, and whatever the reducer returns becomes the new state and causes a new render.

  - id: recall-reduce
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: fold-actions
        from: js-05-04-reduce
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const actions = [{ type: "add", amount: 5 }, { type: "add", amount: 3 }, { type: "reset" }, { type: "add", amount: 2 }];
          const total = actions.reduce((sum, action) => (action.type === "reset" ? 0 : sum + action.amount), 10);
          console.log(total);
        verify:
          logs: ["2"]
        answer:
          type: choice
          options:
            - id: two
              code: "2"
            - id: twenty
              code: "20"
              why:
                uk: "`reduce` іде по елементах по черзі: після двох `add` сума 18, `reset` повертає 0, і лише тоді додається 2."
                en: "`reduce` goes through the items in turn: after two `add`s the sum is 18, `reset` returns 0, and only then 2 is added."
            - id: ten
              code: "10"
              why:
                uk: "10 — лише початкове значення акумулятора. Кожен виклик функції повертає нове значення, і наступний виклик отримує саме його."
                en: "10 is only the accumulator's starting value. Every call of the function returns a new value, and the next call receives exactly that."
          correct: [two]
        explanation:
          uk: "Функція `(sum, action) => …` за кожним action повертає нову суму з попередньої. Reducer у React влаштований так само — `(state, action) => nextState`, — тільки actions приходять не з масиву, а один за одним, коли користувач щось робить. Звідси й назва."
          en: "The function `(sum, action) => …` returns a new sum from the previous one for every action. A React reducer works the same way — `(state, action) => nextState` — except that the actions arrive not from an array but one by one, as the user does things. Hence the name."

  - id: pure-reducer
    kind: explanation
    title:
      uk: "Reducer повертає новий стан, а не змінює старий"
      en: "A reducer returns new state instead of changing the old one"
    body:
      uk: |
        Reducer — чиста функція: ті самі `state` і `action` завжди дають той самий результат, і нічого поза собою він не змінює. Зокрема — **сам `state`**.

        Якщо reducer виконає `tasks.push(action.task)` і поверне той самий масив, React порівняє новий стан зі старим (`Object.is`), побачить **той самий** масив і вирішить, що нічого не змінилося: екран не оновиться. Перевірено в пісочниці з React 19.3: після кліку компонент іще раз виконується, але на сторінці лишається старе число. А в `<StrictMode>` React викликає reducer двічі, і `push` додає запис **двічі**.

        Тож кожна гілка повертає новий масив чи об’єкт (`[...tasks, …]`, `map`, `filter`, `{ ...task, … }`), а гілка, якій нічого міняти, — той самий `state`. Тоді React справді пропускає рендер.
      en: |
        A reducer is a pure function: the same `state` and `action` always give the same result, and it changes nothing outside itself. In particular — **`state` itself**.

        If a reducer runs `tasks.push(action.task)` and returns the same array, React compares the new state with the old one (`Object.is`), sees **the same** array and decides that nothing changed: the screen does not update. Checked in the sandbox with React 19.3: after a click the component runs once more, but the page keeps the old number. And under `<StrictMode>` React calls the reducer twice, so `push` adds the record **twice**.

        So every branch returns a new array or object (`[...tasks, …]`, `map`, `filter`, `{ ...task, … }`), and a branch with nothing to change returns the same `state`. Then React really does skip the render.

  - id: predict-next-state
    kind: prediction
    prompt:
      uk: "Що надрукує цей код?"
      en: "What does this code print?"
    code: |
      function doneReducer(done, action) {
        switch (action.type) {
          case "added":
            return { ...done, [action.id]: false };
          case "statusToggled":
            return { ...done, [action.id]: !done[action.id] };
          default:
            return done;
        }
      }

      const start = { "t-01": false };
      const a = doneReducer(start, { type: "added", id: "t-02" });
      const b = doneReducer(a, { type: "statusToggled", id: "t-02" });
      const c = doneReducer(b, { type: "statusToggle", id: "t-01" });
      console.log(JSON.stringify(b), c === b, JSON.stringify(start));
    verify:
      logs: ['{"t-01":false,"t-02":true} true {"t-01":false}']
    answer:
      type: choice
      options:
        - id: correct
          code: '{"t-01":false,"t-02":true} true {"t-01":false}'
        - id: typo-toggles
          code: '{"t-01":false,"t-02":true} false {"t-01":false}'
          why:
            uk: "`\"statusToggle\"` без `d` не збігається з жодним `case` і потрапляє в `default`, а той повертає **той самий** об’єкт `b`. Одруківка мовчки нічого не робить — помилки під час виконання немає."
            en: "`\"statusToggle\"` without the `d` matches no `case` and lands in `default`, which returns **the same** object `b`. The typo silently does nothing — there is no runtime error."
        - id: start-changed
          code: '{"t-01":false,"t-02":true} true {"t-01":false,"t-02":true}'
          why:
            uk: "`{ ...done, … }` створює **новий** об’єкт із копією полів. `start` ніхто не змінював — так і має працювати reducer."
            en: "`{ ...done, … }` creates a **new** object with a copy of the fields. Nobody changed `start` — that is how a reducer should work."
      correct: [correct]
    explanation:
      uk: "`added` і `statusToggled` повертають нові об’єкти, тож `start` лишається `{\"t-01\":false}`, а `b` має обидва записи. Action з одруківкою потрапляє в `default` і повертає `b` без змін — `c === b`. Під час виконання цю одруківку не видно взагалі. Її помітить `tsc`, якщо actions мають точний тип: з ним `dispatch` з `\"statusToggle\"` не скомпілюється."
      en: "`added` and `statusToggled` return new objects, so `start` stays `{\"t-01\":false}` while `b` has both entries. The misspelled action lands in `default` and returns `b` unchanged — `c === b`. At runtime this typo is not visible at all. `tsc` notices it if the actions have a precise type: with it, a `dispatch` with `\"statusToggle\"` does not compile."

  - id: typed-actions
    kind: explanation
    title:
      uk: "Actions як discriminated union"
      en: "Actions as a discriminated union"
    body:
      uk: |
        Тип `{ type: string; payload?: any }` дозволяє будь-що: і `"aded"` замість `"added"`, і текст там, де чекали об’єкт. `tsc` мовчить — перевірено з TypeScript 7.0.2.

        Точний тип описує кожен action окремим варіантом [[discriminated-union|discriminated union]] з полем-дискримінантом `type`:

        ```ts
        type EditorAction =
          | { type: "editStarted"; id: string }
          | { type: "draftChanged"; text: string }
          | { type: "saveRequested" }
          | { type: "editCanceled" };
        ```

        Тепер у кожному `case` `tsc` звужує `action` до одного варіанта: у `case "draftChanged"` є `action.text`, а `action.id` — помилка. Одруківку в `type`, забуте поле чи зайве поле `tsc` відхиляє ще в `dispatch`. А в `default` стоїть [[exhaustiveness-check|перевірка never]] з розділу про TypeScript: якщо додати новий action і забути його `case`, `tsc` назве саме його.
      en: |
        The type `{ type: string; payload?: any }` allows anything: `"aded"` instead of `"added"`, and text where an object was expected. `tsc` stays silent — checked with TypeScript 7.0.2.

        A precise type describes each action as a separate member of a [[discriminated-union|discriminated union]] with the discriminant field `type`:

        ```ts
        type EditorAction =
          | { type: "editStarted"; id: string }
          | { type: "draftChanged"; text: string }
          | { type: "saveRequested" }
          | { type: "editCanceled" };
        ```

        Now in every `case` `tsc` narrows `action` to one member: in `case "draftChanged"` there is `action.text`, and `action.id` is an error. A typo in `type`, a missing field or an extra field is rejected by `tsc` right at the `dispatch`. And `default` holds the [[exhaustiveness-check|never check]] from the TypeScript unit: if you add a new action and forget its `case`, `tsc` names exactly that action.

  - id: recall-narrowing
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: narrow-by-type
        from: js-14-03-unions-narrowing
        prompt:
          uk: "`type Shape = { kind: \"circle\"; radius: number } | { kind: \"square\"; side: number }`. У якому місці `shape.radius` `tsc` пропустить без помилки?"
          en: "`type Shape = { kind: \"circle\"; radius: number } | { kind: \"square\"; side: number }`. Where does `tsc` accept `shape.radius` without an error?"
        answer:
          type: choice
          options:
            - id: inside
              text: { uk: "Усередині `if (shape.kind === \"circle\") { … }`", en: "Inside `if (shape.kind === \"circle\") { … }`" }
            - id: anywhere
              text: { uk: "Будь-де: `radius` є в одному з варіантів", en: "Anywhere: `radius` exists in one of the members" }
              why:
                uk: "Поки варіант невідомий, `shape` може бути квадратом без `radius`. `tsc` дозволяє поле лише там, де воно є в **кожному** можливому варіанті."
                en: "While the member is unknown, `shape` may be a square without `radius`. `tsc` allows a field only where it exists in **every** possible member."
            - id: else
              text: { uk: "У гілці `else` після `if (shape.kind === \"square\")`", en: "In the `else` branch after `if (shape.kind === \"square\")`" }
              why:
                uk: "Це теж працює: після відсіювання квадрата лишається коло. Але питання про одне місце, і найпряміше — перевірка на `\"circle\"`."
                en: "That works too: once the square is filtered out, the circle remains. But the question asks for one place, and the most direct one is the check for `\"circle\"`."
          correct: [inside]
        explanation:
          uk: "Перевірка дискримінанта `kind` звужує union до одного варіанта, і в цій гілці його поля доступні. `switch (action.type)` у reducer робить те саме для кожного `case`."
          en: "Checking the discriminant `kind` narrows the union to one member, and in that branch its fields are available. `switch (action.type)` in a reducer does the same for every `case`."

  - id: editor-machine
    kind: visual
    visual: diagram
    title:
      uk: "Reducer редактора як автомат станів"
      en: "The editor reducer as a state machine"
    textEquivalent:
      uk: "Редактор звичок має три режими: browsing (перегляд), editing (редагування) і saveFailed (збереження не вдалося). editStarted переводить browsing в editing. draftChanged лишає editing в editing. saveRequested з порожньою назвою переводить editing у saveFailed, а з непорожньою — назад у browsing, і назва звички змінюється. draftChanged із saveFailed повертає в editing, а editCanceled з editing чи saveFailed — у browsing. Зі стану browsing стрілки saveRequested немає: reducer повертає той самий стан, тобто відхиляє дію, і React нічого не перемальовує."
      en: "The habit editor has three modes: browsing, editing and saveFailed. editStarted takes browsing to editing. draftChanged keeps editing in editing. saveRequested with an empty name takes editing to saveFailed, and with a non-empty one back to browsing, and the habit's name changes. draftChanged from saveFailed returns to editing, and editCanceled from editing or saveFailed returns to browsing. From browsing there is no saveRequested arrow: the reducer returns the same state, which means it rejects the action, and React re-renders nothing."
    spec:
      layout: grid
      nodes:
        - { id: browsing, label: "browsing", shape: round, col: 0, row: 0, w: 120 }
        - { id: editing, label: "editing", shape: round, col: 1, row: 0, w: 120 }
        - { id: failed, label: "saveFailed", shape: round, col: 1, row: 1, w: 120 }
        - { id: rejected, label: { uk: "saveRequested: відхилено", en: "saveRequested: rejected" }, shape: note, col: 0, row: 1, w: 160 }
      edges:
        - { id: start, from: browsing, to: editing, label: "editStarted" }
        - { id: save, from: editing, to: browsing, label: "saveRequested" }
        - { id: fail, from: editing, to: failed }
        - { id: retry, from: failed, to: editing }
        - { id: cancel, from: failed, to: browsing, kind: dashed }
        - { id: reject, from: rejected, to: browsing, kind: dashed }
      hidden: [rejected, reject]
      steps:
        - caption:
            uk: "Три режими редактора. Кожна стрілка — action, який reducer **приймає** в цьому режимі."
            en: "The three modes of the editor. Every arrow is an action the reducer **accepts** in that mode."
        - caption:
            uk: "`editStarted` у режимі `browsing` відкриває редагування: новий стан — `editing` з `id` і чернеткою."
            en: "`editStarted` in `browsing` opens editing: the new state is `editing` with an `id` and a draft."
          highlight: [browsing, start, editing]
        - caption:
            uk: "`saveRequested` з порожньою чернеткою веде в `saveFailed`: чернетка лишається, на екрані — попередження."
            en: "`saveRequested` with an empty draft leads to `saveFailed`: the draft stays, the screen shows a warning."
          highlight: [editing, fail, failed]
          annotate:
            - { id: fail, text: { uk: "saveRequested, порожньо", en: "saveRequested, empty" } }
        - caption:
            uk: "`draftChanged` повертає в `editing`; `editCanceled` (пунктир) — назад у `browsing` без змін."
            en: "`draftChanged` returns to `editing`; `editCanceled` (dashed) goes back to `browsing` without changes."
          highlight: [failed, retry, editing, cancel, browsing]
          annotate:
            - { id: retry, text: "draftChanged" }
            - { id: cancel, text: "editCanceled" }
        - caption:
            uk: "`saveRequested` з назвою повертає в `browsing` з новим списком: звичку перейменовано."
            en: "`saveRequested` with a name returns to `browsing` with a new list: the habit is renamed."
          highlight: [editing, save, browsing]
        - caption:
            uk: "`saveRequested` у `browsing`: стрілки немає. Reducer повертає **той самий** стан — action відхилено, і React нічого не перемальовує."
            en: "`saveRequested` in `browsing`: there is no arrow. The reducer returns **the same** state — the action is rejected, and React re-renders nothing."
          show: [rejected, reject]
          highlight: [rejected, reject, browsing]

  - id: habit-editor
    kind: example
    runtime: browser-react
    dir: habit-editor
    entry: main.tsx
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      mode: { uk: "Режим:", en: "Mode:" }
      edit: { uk: "Змінити", en: "Edit" }
      name: { uk: "Назва", en: "Name" }
      empty: { uk: "Назва не може бути порожньою.", en: "The name cannot be empty." }
      cancel: { uk: "Скасувати", en: "Cancel" }
      save: { uk: "Зберегти", en: "Save" }
    title:
      uk: "Автомат редактора в дії"
      en: "The editor machine at work"
    body:
      uk: |
        `editorReducer.ts` — reducer з візуалізації: типи режимів і actions, `switch` з перевіркою `never`. `App.tsx` викликає `useReducer` і друкує в **Консоль** кожен `dispatch`, а після кожного commit з новим станом — рядок `→ mode: …`. Кнопку **Зберегти** навмисно видно завжди, щоб можна було спробувати неможливий перехід.

        Натисни **Запустити** й на **Сторінці** натисни **Зберегти**, ще нічого не редагуючи: у консолі `dispatch saveRequested (mode: browsing)` — і жодного нового `→ mode`. Reducer повернув той самий стан, тож React навіть не перемальовував.
      en: |
        `editorReducer.ts` is the reducer from the visual: the types of the modes and actions, a `switch` with the `never` check. `App.tsx` calls `useReducer` and prints every `dispatch` to the **Console**, and after every commit with a new state a `→ mode: …` line. The **Save** button is visible all the time on purpose, so that you can try an impossible transition.

        Press **Run** and on the **Page** press **Save** before editing anything: the console shows `dispatch saveRequested (mode: browsing)` — and no new `→ mode` line. The reducer returned the same state, so React did not even re-render.
    tryIt:
      uk: |
        1. Натисни **Змінити** біля «Читати 20 хвилин», зітри назву й натисни **Зберегти**: `→ mode: saveFailed` і попередження. Введи іншу назву (`→ mode: editing`) і збережи: `→ mode: browsing`, звичку перейменовано.
        2. У `editorReducer.ts` у гілці `case "saveRequested"` закоментуй рядок `if (state.mode !== "editing") return state;` і запусти знову. Натисни **Зберегти** в режимі перегляду: сторінка зникає, а картка помилки показує `TypeError: Cannot read properties of undefined (reading 'trim')` у `editorReducer.ts` — у стані `browsing` немає поля `draft`. Саме від цього захищає відхилений перехід. Поверни рядок.
        3. Заміни в `App.tsx` `type: "editCanceled"` на `type: "editCancelled"`, запусти, натисни **Змінити** й **Скасувати**: сторінка зникає з `Error: Unknown action: {"type":"editCancelled"}`. Це спрацював `throw` у `default` — але лише під час виконання й лише після кліку, бо пісочниця типи тільки прибирає. `tsc` знайшов би одруківку до запуску — у локальному завданні нижче. Поверни як було.
      en: |
        1. Press **Edit** next to “Read for 20 minutes”, erase the name and press **Save**: `→ mode: saveFailed` and a warning. Type another name (`→ mode: editing`) and save: `→ mode: browsing`, the habit is renamed.
        2. In `editorReducer.ts`, in the `case "saveRequested"` branch, comment out the line `if (state.mode !== "editing") return state;` and run again. Press **Save** in browsing mode: the page disappears, and the error card shows `TypeError: Cannot read properties of undefined (reading 'trim')` in `editorReducer.ts` — a `browsing` state has no `draft` field. This is exactly what the rejected transition protects against. Put the line back.
