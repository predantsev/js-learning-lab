id: js-05-07-readable-chains
unit: JS-05
title:
  uk: "Обираємо зрозумілі перетворення"
  en: "Choosing readable transformations"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Переписати цикл, який фільтрує, сортує й форматує, як ланцюжок іменованих кроків, і оцінити, яку версію легше читати й змінювати."
    en: "Rewrite a loop that filters, sorts and formats as a chain of named steps, and judge which version is easier to read and change."
  - uk: "Розпізнати, коли `reduce`, що будує масиви чи об’єкти, ховає намір, і замінити його іменованими кроками `filter`/`map` або звичайним циклом."
    en: "Recognize when a `reduce` that builds arrays or objects hides intent, and replace it with named `filter`/`map` steps or a plain loop."
prerequisites: [js-05-06-search-complexity, js-05-05-sorting-comparator]
subskills:
  - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: practice }
  - { family: J-05, skill: "sorting comparator and stable ordering", depth: practice }
glossary: [method-chain, intermediate-array]
selfCheck: [predict-chain, rewrite-loop]

blocks:
  - id: named-steps
    kind: explanation
    title:
      uk: "Ланцюжок кроків з іменами"
      en: "A chain of named steps"
    body:
      uk: |
        `filter`, `toSorted` і `map` повертають нові масиви, тож наступний метод можна викликати одразу на результаті попереднього. Це [[method-chain|ланцюжок методів]]:

        ```js
        const labels = items
          .filter(isWanted)
          .toSorted(byPriceAsc)
          .map(toLabel);
        ```

        Кожен крок отримує [[intermediate-array|проміжний масив]] від попереднього. Якщо дати функціям-крокам зрозумілі імена, код читається як речення: «залиш бажане, відсортуй за ціною, зроби підписи». А порядок кроків важливий: кожен працює з тим, що віддав попередній.
      en: |
        `filter`, `toSorted` and `map` return new arrays, so the next method can be called straight on the previous one’s result. This is a [[method-chain|method chain]]:

        ```js
        const labels = items
          .filter(isWanted)
          .toSorted(byPriceAsc)
          .map(toLabel);
        ```

        Each step receives an [[intermediate-array|intermediate array]] from the previous one. Give the step functions clear names and the code reads like a sentence: “keep the wanted ones, sort by price, make labels”. And the order of the steps matters: each one works with what the previous one handed over.

  - id: predict-chain
    kind: prediction
    prompt:
      uk: "Що виведе ланцюжок? Пройди кроки по черзі."
      en: "What does the chain print? Go through the steps in order."
    code: |
      const items = [
        { id: "w-01", price: 80, acquired: false },
        { id: "w-04", price: 25, acquired: true },
        { id: "w-02", price: 45, acquired: false },
        { id: "w-03", price: 240, acquired: false },
      ];
      const isWanted = (item) => !item.acquired;
      const byPriceAsc = (a, b) => a.price - b.price;
      const toLabel = (item) => item.id + ": " + item.price;

      const labels = items
        .filter(isWanted)
        .toSorted(byPriceAsc)
        .map(toLabel);
      console.log(labels);
    verify:
      logs: ["[\"w-02: 45\", \"w-01: 80\", \"w-03: 240\"]"]
    answer:
      type: choice
      options:
        - id: right
          code: '["w-02: 45", "w-01: 80", "w-03: 240"]'
        - id: kept-acquired
          code: '["w-04: 25", "w-02: 45", "w-01: 80", "w-03: 240"]'
          why:
            uk: "`filter(isWanted)` прибирає `w-04` ще на першому кроці: він уже отриманий. Наступні кроки його не бачать."
            en: "`filter(isWanted)` removes `w-04` at the very first step: it is already acquired. The later steps never see it."
        - id: not-sorted
          code: '["w-01: 80", "w-02: 45", "w-03: 240"]'
          why:
            uk: "`toSorted(byPriceAsc)` переставив записи за ціною ще до того, як `map` зробив підписи: 45 іде перед 80."
            en: "`toSorted(byPriceAsc)` reordered the records by price before `map` made the labels: 45 comes before 80."
        - id: ids-only
          code: '["w-02", "w-01", "w-03"]'
          why:
            uk: "`map(toLabel)` кладе в масив те, що повертає `toLabel`: `id`, двокрапку й ціну."
            en: "`map(toLabel)` puts whatever `toLabel` returns into the array: the `id`, a colon and the price."
      correct: [right]
    explanation:
      uk: "Крок 1: `filter` залишає три ще не отримані бажання — `w-01`, `w-02`, `w-03`. Крок 2: `toSorted` упорядковує їх за ціною — `w-02` (45), `w-01` (80), `w-03` (240). Крок 3: `map` робить із кожного запису підпис."
      en: "Step 1: `filter` keeps the three wishes not acquired yet — `w-01`, `w-02`, `w-03`. Step 2: `toSorted` orders them by price — `w-02` (45), `w-01` (80), `w-03` (240). Step 3: `map` turns each record into a label."

  - id: chain-flow
    kind: visual
    visual: pipeline
    title:
      uk: "Три кроки — три проміжні масиви"
      en: "Three steps — three intermediate arrays"
    textEquivalent:
      uk: "На вході чотири бажання: w-01 (80, не отримане), w-04 (25, отримане), w-02 (45, не отримане) і w-03 (240, не отримане). Крок 1, filter(isWanted), повертає новий масив із трьох записів — w-01, w-02, w-03; w-04 відкинуто, бо його вже отримано. Крок 2, toSorted(byPriceAsc), повертає ще один новий масив з тими самими трьома записами за зростанням ціни: w-02, w-01, w-03. Крок 3, map(toLabel), перетворює їх на три рядки: «w-02: 45», «w-01: 80», «w-03: 240». Кожен крок створює власний проміжний масив, а масив items лишається без змін."
      en: "The input is four wishes: w-01 (80, wanted), w-04 (25, acquired), w-02 (45, wanted) and w-03 (240, wanted). Step 1, filter(isWanted), returns a new array of three records — w-01, w-02, w-03; w-04 is dropped because it is already acquired. Step 2, toSorted(byPriceAsc), returns another new array with the same three records in ascending price order: w-02, w-01, w-03. Step 3, map(toLabel), turns them into three strings: “w-02: 45”, “w-01: 80”, “w-03: 240”. Each step creates its own intermediate array, and the items array stays unchanged."
    spec:
      code: |
        const labels = items
          .filter(isWanted)
          .toSorted(byPriceAsc)
          .map(toLabel);
      input:
        label: { uk: "items — чотири бажання", en: "items — four wishes" }
        items:
          - { id: "w-01", price: 80, acquired: false }
          - { id: "w-04", price: 25, acquired: true }
          - { id: "w-02", price: 45, acquired: false }
          - { id: "w-03", price: 240, acquired: false }
        caption:
          uk: "Вхід ланцюжка — масив `items`. Жоден крок його не змінює: кожен повертає новий масив."
          en: "The chain’s input is the `items` array. No step changes it: each one returns a new array."
      stages:
        - op: filter
          fn: "(item) => !item.acquired"
          label: "isWanted"
          caption:
            uk: "Крок 1 — `filter(isWanted)`: з чотирьох записів лишаються три ще не отримані. Це перший проміжний масив."
            en: "Step 1 — `filter(isWanted)`: three of the four records, the ones not acquired yet, remain. This is the first intermediate array."
        - op: sort
          fn: "(a, b) => a.price - b.price"
          label: "byPriceAsc"
          caption:
            uk: "Крок 2 — `toSorted(byPriceAsc)` (на схемі — `sort`): ті самі три записи за зростанням ціни. Другий проміжний масив."
            en: "Step 2 — `toSorted(byPriceAsc)` (shown as `sort` in the picture): the same three records in ascending price order. The second intermediate array."
        - op: map
          fn: "(item) => item.id + ': ' + item.price"
          label: "toLabel"
          caption:
            uk: "Крок 3 — `map(toLabel)`: три записи стають трьома рядками. Це результат усього ланцюжка."
            en: "Step 3 — `map(toLabel)`: the three records become three strings. That is the result of the whole chain."
      result:
        label: { uk: "підписи бажаних речей, від найдешевшої", en: "labels of the wanted things, cheapest first" }

  - id: reorder-chain
    kind: example
    runtime: browser-js
    dir: reorder-chain
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
    title:
      uk: "Порядок кроків має значення"
      en: "The order of steps matters"
    body:
      uk: "Тут ланцюжок розкладено на окремі кроки з іменами `step1`–`step3`, щоб кожен проміжний масив можна було вивести в консоль. Так зручно шукати, на якому кроці щось пішло не так. Запусти."
      en: "Here the chain is broken into separate steps named `step1`–`step3`, so every intermediate array can be printed. That is a handy way to find the step where something went wrong. Run it."
    tryIt:
      uk: |
        Постав `map` першим кроком. Заміни три рядки зі `step` на:

        ```js
        const step1 = items.map(toLabel);
        const step2 = step1.filter(isWanted);
        const step3 = step2.toSorted(byPriceAsc);
        ```

        Запусти. Перші два рядки консолі — масиви з `undefined`: після `map` у масиві рядки, а в рядка немає ні `id`, ні `acquired`. `!undefined` — це `true`, тож `filter` пропускає все, і вже отримана книжка повертається в список. А компаратор порівнює `undefined - undefined` і нічого не переставляє.
      en: |
        Make `map` the first step. Replace the three `step` lines with:

        ```js
        const step1 = items.map(toLabel);
        const step2 = step1.filter(isWanted);
        const step3 = step2.toSorted(byPriceAsc);
        ```

        Run it. The first two console lines are arrays of `undefined`: after `map` the array holds strings, and a string has neither `id` nor `acquired`. `!undefined` is `true`, so `filter` lets everything through, and the already acquired book is back in the list. And the comparator computes `undefined - undefined` and reorders nothing.

  - id: recall-implicit
    kind: review
    title:
      uk: "Пригадай: що повертає стрілкова функція"
      en: "Recall: what an arrow function returns"
    items:
      - id: which-return
        from: js-03-03-arrow-functions
        prompt:
          uk: "Які з цих стрілкових функцій повертають значення, а не `undefined`? Обери всі."
          en: "Which of these arrow functions return a value rather than `undefined`? Choose all that do."
        answer:
          type: multi
          options:
            - id: short
              code: "(item) => item.price * 2"
            - id: block-no-return
              code: "(item) => { item.price * 2; }"
              why:
                uk: "Фігурні дужки — це тіло-блок: без `return` функція повертає `undefined`."
                en: "Curly braces make a block body: without `return` the function returns `undefined`."
            - id: object-parens
              code: "(item) => ({ id: item.id })"
            - id: object-no-parens
              code: "(item) => { id: item.id }"
              why:
                uk: "Без круглих дужок `{ id: … }` читається як блок, а не як об’єкт, тож функція повертає `undefined`."
                en: "Without round brackets, `{ id: … }` is read as a block, not as an object, so the function returns `undefined`."
            - id: block-return
              code: "(item) => { return item.price * 2; }"
          correct: [short, object-parens, block-return]
        explanation:
          uk: "Коротка стрілка без фігурних дужок неявно повертає свій вираз. З фігурними дужками потрібен `return`. А об’єкт беруть у круглі дужки, щоб його не прийняли за блок. Короткі функції-кроки для ланцюжків зазвичай пишуть саме так: в один рядок, з неявним поверненням."
          en: "A short arrow without curly braces returns its expression implicitly. With curly braces you need `return`. And an object goes into round brackets so that it is not taken for a block. Short step functions for chains are usually written exactly like that: on one line, with an implicit return."

  - id: which-is-clearer
    kind: explanation
    title:
      uk: "Цикл, ланцюжок чи reduce?"
      en: "A loop, a chain or a reduce?"
    body:
      uk: |
        Перший крок ланцюжка можна записати й через `reduce`:

        ```js
        const wanted = items.reduce(
          (acc, item) => (item.acquired ? acc : [...acc, item]),
          []
        );
        ```

        Щоб зрозуміти цей код, його треба подумки виконати. Це той самий `filter`, тільки схований: ім’я `isWanted` зникло. До того ж `[...acc, item]` щоразу копіює весь накопичувач, тож «один прохід» тут зовсім не швидший.

        `reduce` добрий для **одного значення**: суми, кількості, лічильників. Будувати ним масиви, з якими впораються `filter` і `map`, — значить ховати намір. А коли між кроками є складні умови чи ранній вихід, звичайний цикл буває найзрозумілішим — це теж нормальний вибір.

        > [!note]
        > Ланцюжок проходить список кілька разів, але для сотень і тисяч записів це частки мілісекунди: у браузері, де перевіряли цей урок, три кроки по 1000 записів зайняли менше мілісекунди. Спершу пиши зрозуміло, а швидкість вимірюй тоді, коли вона справді стане проблемою.
      en: |
        The first step of the chain can also be written with `reduce`:

        ```js
        const wanted = items.reduce(
          (acc, item) => (item.acquired ? acc : [...acc, item]),
          []
        );
        ```

        To understand this code you have to run it in your head. It is the same `filter`, only hidden: the name `isWanted` is gone. Besides, `[...acc, item]` copies the whole accumulator every time, so “one pass” is not faster here at all.

        `reduce` is good for **one value**: a sum, a count, counters. Using it to build arrays that `filter` and `map` can build hides the intent. And when there are complex conditions or an early exit between the steps, a plain loop can be the clearest — that is a perfectly good choice too.

        > [!note]
        > A chain walks the list several times, but for hundreds or thousands of records that takes fractions of a millisecond: in the browser where this lesson was checked, three steps over 1000 records took less than a millisecond. Write clear code first, and measure speed when it actually becomes a problem.

  - id: rewrite-loop
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: rewrite-loop
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      noPrice: { uk: "без ціни", en: "no price" }
      queryUpper: { uk: "ЛАМП", en: "LAMP" }
      queryMiddle: { uk: "ільна", en: "sk la" }
      queryMulti: { uk: "НА", en: "S" }
    title:
      uk: "Із циклу — в ланцюжок"
      en: "From a loop to a chain"
    instructions:
      uk: |
        Функція `wantedLabelsLoop` робить усе в одному довгому циклі: залишає ще не отримані бажання, у назві яких є запит, сортує їх за ціною (без ціни — в кінець) і робить підписи. Перепиши її як ланцюжок маленьких іменованих кроків:

        1. `isWanted(item)` — `true`, якщо бажання ще не отримане.
        2. `matchesQuery(item, query)` — `true`, якщо в назві є `query`, незалежно від великих і малих літер.
        3. `byPriceAsc(a, b)` — компаратор із циклу.
        4. `toLabel(item)` — підпис «назва: ціна» або «назва: без ціни».
        5. `wantedLabels(list, query)` — ланцюжок із цих кроків, що дає **точно такий самий** результат, як цикл, і не змінює список.

        Старий цикл можна лишити для порівняння або видалити.
      en: |
        The function `wantedLabelsLoop` does everything in one long loop: it keeps the wishes not acquired yet whose name contains the query, sorts them by price (no price goes last) and makes labels. Rewrite it as a chain of small named steps:

        1. `isWanted(item)` — `true` if the wish is not acquired yet.
        2. `matchesQuery(item, query)` — `true` if the name contains `query`, regardless of upper and lower case.
        3. `byPriceAsc(a, b)` — the comparator from the loop.
        4. `toLabel(item)` — the label “name: price” or “name: no price”.
        5. `wantedLabels(list, query)` — a chain of these steps that gives **exactly the same** result as the loop and does not change the list.

        You may keep the old loop to compare, or delete it.
    testTitles:
      "isWanted is true only for items not acquired yet":
        uk: "isWanted дає true лише для ще не отриманих бажань"
        en: "isWanted is true only for wishes not acquired yet"
      "matchesQuery finds the query anywhere in the name, in any case":
        uk: "matchesQuery знаходить запит у будь-якому місці назви, у будь-якому регістрі"
        en: "matchesQuery finds the query anywhere in the name, in any case"
      "byPriceAsc puts cheaper items first and items without a price last":
        uk: "byPriceAsc ставить дешевші раніше, а бажання без ціни — в кінець"
        en: "byPriceAsc puts cheaper wishes first and wishes without a price last"
      "toLabel makes the name: price label":
        uk: "toLabel робить підпис «назва: ціна»"
        en: "toLabel makes the “name: price” label"
      "wantedLabels gives the same labels as the loop":
        uk: "wantedLabels дає ті самі підписи, що й цикл"
        en: "wantedLabels gives the same labels as the loop"
      "wantedLabels does not change the list":
        uk: "wantedLabels не змінює список"
        en: "wantedLabels does not change the list"
    hints:
      nudge:
        uk: "Подивись на цикл: які рядки вирішують, чи залишити бажання, які впорядковують, а які роблять підписи? Кожна група стане однією маленькою функцією."
        en: "Look at the loop: which lines decide whether a wish stays, which put the wishes in order and which make the labels? Each group becomes one small function."
      explanation:
        uk: "`isWanted` і `matchesQuery` — це дві частини умови `if` у циклі. `byPriceAsc` — компаратор циклу без змін. `toLabel` — рядок із `push`. А `wantedLabels` з’єднує їх: два `filter`, потім `toSorted`, і лише наприкінці `map` — після нього в масиві вже рядки, а не записи."
        en: "`isWanted` and `matchesQuery` are the two parts of the loop’s `if` condition. `byPriceAsc` is the loop’s comparator unchanged. `toLabel` is the `push` line. And `wantedLabels` joins them: two `filter`s, then `toSorted`, and `map` only at the end — after it the array holds strings, not records."
    solutionNote:
      uk: "Кожен крок тепер має ім’я й перевіряється окремо, а `wantedLabels` читається як речення. Порядок важливий: `map` іде останнім, бо після нього в масиві вже рядки. `toSorted` сортує проміжний масив, тож сам список лишається таким, як був."
      en: "Every step now has a name and is checked on its own, and `wantedLabels` reads like a sentence. The order matters: `map` goes last, because after it the array holds strings. `toSorted` sorts an intermediate array, so the list itself stays as it was."
    feedback:
      - when: { test: "isWanted is true only for items not acquired yet" }
        message:
          uk: "`isWanted` отримує одне бажання й повертає `true` або `false`. Якщо тіло функції у `{ }`, потрібен `return`."
          en: "`isWanted` receives one wish and returns `true` or `false`. If the function body is in `{ }`, it needs `return`."
      - when: { test: "matchesQuery finds the query anywhere in the name, in any case" }
        message:
          uk: "Зведи до малих літер і назву, і запит, а тоді перевір `includes`."
          en: "Lowercase both the name and the query, then check `includes`."
      - when: { test: "wantedLabels gives the same labels as the loop" }
        message:
          uk: "Перевір порядок кроків: спершу обидва `filter` — їм потрібні цілі записи, — потім `toSorted`, а `map` — останнім. Після `map` у масиві лише рядки."
          en: "Check the order of the steps: both `filter` steps first (they need whole records), then `toSorted`, and `map` last. After `map` the array holds only strings."
      - when: { test: "wantedLabels does not change the list" }
        message:
          uk: "`sort` змінює масив, на якому його викликали. Якщо сортувати до `filter`, ти переставиш сам список. Використай `toSorted` або сортуй уже після `filter`."
          en: "`sort` changes the array it is called on. Sorting before `filter` reorders the list itself. Use `toSorted`, or sort after `filter`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-05
    body:
      uk: "У проєкті пошук, фільтр, сортування й підписи стануть кроками одного ланцюжка. Давай крокам імена — і через місяць ти прочитаєш свій код як речення."
      en: "In your project, search, filter, sort and labels become the steps of one chain. Give the steps names — and a month from now you will read your code like a sentence."
