id: js-05-07-readable-chains
unit: JS-05
title:
  uk: "Обираємо зрозумілі перетворення"
  en: "Choosing readable transformations"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Переписати цикл, який фільтрує, сортує й форматує, як ланцюжок іменованих кроків, і оцінити, яку версію легше читати й змінювати."
    en: "Rewrite a loop that filters, sorts and formats as a chain of named steps, and judge which version is easier to read and change."
  - uk: "Розпізнати, коли `reduce`, що будує масиви чи об’єкти, ховає намір, і замінити його іменованими кроками `filter`/`map` або звичайним циклом."
    en: "Recognize when a `reduce` that builds arrays or objects hides intent, and replace it with named `filter`/`map` steps or a plain loop."
prerequisites: [js-05-06-search-complexity, js-05-05-sorting-comparator]
subskills:
  - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: practice }
  - { family: J-05, skill: "sorting comparator and stable ordering", depth: practice }
glossary: [method-chain, intermediate-array]
selfCheck: [predict-chain, rewrite-loop]

blocks:
  - id: named-steps
    kind: explanation
    title:
      uk: "Ланцюжок кроків із назвами"
      en: "A chain of named steps"
    body:
      uk: |
        `filter`, `toSorted` і `map` повертають нові масиви, тож наступний метод можна викликати одразу на результаті попереднього. Це [[method-chain|ланцюжок методів]]:

        ```js
        const labels = items
          .filter(isWanted)
          .toSorted(byPriceAsc)
          .map(toLabel);
        ```

        Кожен крок отримує [[intermediate-array|проміжний масив]] від попереднього. Якщо дати функціям-крокам зрозумілі назви, код читається як речення: «залиш бажане, відсортуй за ціною, зроби підписи». А порядок кроків важливий: кожен працює з тим, що віддав попередній.
      en: |
        `filter`, `toSorted` and `map` return new arrays, so the next method can be called straight on the previous one’s result. This is a [[method-chain|method chain]]:

        ```js
        const labels = items
          .filter(isWanted)
          .toSorted(byPriceAsc)
          .map(toLabel);
        ```

        Each step receives an [[intermediate-array|intermediate array]] from the previous one. Give the step functions clear names and the code reads like a sentence: “keep the wanted ones, sort by price, make labels”. And the order of the steps matters: each one works with what the previous one handed over.

  - id: predict-chain
    kind: prediction
    prompt:
      uk: "Що виведе ланцюжок? Пройди кроки по черзі."
      en: "What does the chain print? Go through the steps in order."
    code: |
      const items = [
        { id: "w-01", price: 80, acquired: false },
        { id: "w-04", price: 25, acquired: true },
        { id: "w-02", price: 45, acquired: false },
        { id: "w-03", price: 240, acquired: false },
      ];
      const isWanted = (item) => !item.acquired;
      const byPriceAsc = (a, b) => a.price - b.price;
      const toLabel = (item) => item.id + ": " + item.price;

      const labels = items
        .filter(isWanted)
        .toSorted(byPriceAsc)
        .map(toLabel);
      console.log(labels);
    verify:
      logs: ["[\"w-02: 45\", \"w-01: 80\", \"w-03: 240\"]"]
    answer:
      type: choice
      options:
        - id: right
          code: '["w-02: 45", "w-01: 80", "w-03: 240"]'
        - id: kept-acquired
          code: '["w-04: 25", "w-02: 45", "w-01: 80", "w-03: 240"]'
          why:
            uk: "`filter(isWanted)` прибирає `w-04` ще на першому кроці: він уже отриманий. Наступні кроки його не бачать."
            en: "`filter(isWanted)` removes `w-04` at the very first step: it is already acquired. The later steps never see it."
        - id: not-sorted
          code: '["w-01: 80", "w-02: 45", "w-03: 240"]'
          why:
            uk: "`toSorted(byPriceAsc)` переставив записи за ціною ще до того, як `map` зробив підписи: 45 іде перед 80."
            en: "`toSorted(byPriceAsc)` reordered the records by price before `map` made the labels: 45 comes before 80."
        - id: ids-only
          code: '["w-02", "w-01", "w-03"]'
          why:
            uk: "`map(toLabel)` кладе в масив те, що повертає `toLabel`: `id`, двокрапку й ціну."
            en: "`map(toLabel)` puts whatever `toLabel` returns into the array: the `id`, a colon and the price."
      correct: [right]
    explanation:
      uk: "Крок 1: `filter` залишає три ще не отримані бажання — `w-01`, `w-02`, `w-03`. Крок 2: `toSorted` упорядковує їх за ціною — `w-02` (45), `w-01` (80), `w-03` (240). Крок 3: `map` робить із кожного запису підпис."
      en: "Step 1: `filter` keeps the three wishes not acquired yet — `w-01`, `w-02`, `w-03`. Step 2: `toSorted` orders them by price — `w-02` (45), `w-01` (80), `w-03` (240). Step 3: `map` turns each record into a label."

  - id: chain-flow
    kind: visual
    visual: pipeline
    title:
      uk: "Три кроки — три проміжні масиви"
      en: "Three steps — three intermediate arrays"
    textEquivalent:
      uk: "На вході чотири бажання: w-01 (80, не отримане), w-04 (25, отримане), w-02 (45, не отримане) і w-03 (240, не отримане). Крок 1, filter(isWanted), повертає новий масив із трьох записів — w-01, w-02, w-03; w-04 відкинуто, бо його вже отримано. Крок 2, toSorted(byPriceAsc), повертає ще один новий масив з тими самими трьома записами за зростанням ціни: w-02, w-01, w-03. Крок 3, map(toLabel), перетворює їх на три підписи: «w-02: 45», «w-01: 80», «w-03: 240». Кожен крок створює власний проміжний масив, а масив items лишається без змін."
      en: "The input is four wishes: w-01 (80, wanted), w-04 (25, acquired), w-02 (45, wanted) and w-03 (240, wanted). Step 1, filter(isWanted), returns a new array of three records — w-01, w-02, w-03; w-04 is dropped because it is already acquired. Step 2, toSorted(byPriceAsc), returns another new array with the same three records in ascending price order: w-02, w-01, w-03. Step 3, map(toLabel), turns them into three labels: “w-02: 45”, “w-01: 80”, “w-03: 240”. Each step creates its own intermediate array, and the items array stays unchanged."
    spec:
      code: |
        const labels = items
          .filter(isWanted)
          .toSorted(byPriceAsc)
          .map(toLabel);
      input:
        label: { uk: "items — чотири бажання", en: "items — four wishes" }
        items:
          - { id: "w-01", price: 80, acquired: false }
          - { id: "w-04", price: 25, acquired: true }
          - { id: "w-02", price: 45, acquired: false }
          - { id: "w-03", price: 240, acquired: false }
        caption:
          uk: "Вхід ланцюжка — масив `items`. Жоден крок його не змінює: кожен повертає новий масив."
          en: "The chain’s input is the `items` array. No step changes it: each one returns a new array."
      stages:
        - op: filter
          fn: "(item) => !item.acquired"
          label: "isWanted"
          caption:
            uk: "Крок 1 — `filter(isWanted)`: з чотирьох записів лишаються три ще не отримані. Це перший проміжний масив."
            en: "Step 1 — `filter(isWanted)`: three of the four records, the ones not acquired yet, remain. This is the first intermediate array."
        - op: sort
          fn: "(a, b) => a.price - b.price"
          label: "byPriceAsc"
          caption:
            uk: "Крок 2 — `toSorted(byPriceAsc)` (на схемі — `sort`): ті самі три записи за зростанням ціни. Другий проміжний масив."
            en: "Step 2 — `toSorted(byPriceAsc)` (shown as `sort` in the picture): the same three records in ascending price order. The second intermediate array."
        - op: map
          fn: "(item) => item.id + ': ' + item.price"
          label: "toLabel"
          caption:
            uk: "Крок 3 — `map(toLabel)`: три записи стають трьома підписами. Це результат усього ланцюжка."
            en: "Step 3 — `map(toLabel)`: the three records become three labels. That is the result of the whole chain."
      result:
        label: { uk: "підписи бажаних речей, від найдешевшої", en: "labels of the wanted things, cheapest first" }

  - id: reorder-chain
    kind: example
    runtime: browser-js
    dir: reorder-chain
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
    title:
      uk: "Порядок кроків має значення"
      en: "The order of steps matters"
    body:
      uk: "Тут ланцюжок розкладено на окремі кроки з назвами `step1`–`step3`, щоб кожен проміжний масив можна було вивести в консоль. Так зручно шукати, на якому кроці щось пішло не так. Запусти."
      en: "Here the chain is broken into separate steps named `step1`–`step3`, so every intermediate array can be printed. That is a handy way to find the step where something went wrong. Run it."
    tryIt:
      uk: |
        1. Постав `map` першим кроком. Заміни три рядки коду зі `step` на:

           ```js
           const step1 = items.map(toLabel);
           const step2 = step1.filter(isWanted);
           const step3 = step2.toSorted(byPriceAsc);
           ```

           Запусти. Перші два рядки консолі — масиви з `undefined`: після `map` у масиві текстові підписи, а в тексту немає ні `id`, ні `acquired`. `!undefined` — це `true`, тож `filter` пропускає все, і вже отримана книжка повертається в список. А компаратор отримує `undefined - undefined`, тобто `NaN`; таку відповідь сортування вважає «рівні» й нічого не переставляє.
        2. Поверни попередній порядок кроків — `filter`, `toSorted`, `map` — і запусти ще раз.
      en: |
        1. Make `map` the first step. Replace the three lines of code with `step` with:

           ```js
           const step1 = items.map(toLabel);
           const step2 = step1.filter(isWanted);
           const step3 = step2.toSorted(byPriceAsc);
           ```

           Run it. The first two console lines are arrays of `undefined`: after `map` the array holds text labels, and text has neither `id` nor `acquired`. `!undefined` is `true`, so `filter` lets everything through, and the already acquired book is back in the list. And the comparator gets `undefined - undefined`, that is `NaN`; sorting treats such an answer as “equal” and reorders nothing.
        2. Put the previous order of the steps back — `filter`, `toSorted`, `map` — and run again.

  - id: recall-implicit
    kind: review
    title:
      uk: "Пригадай: що повертає стрілкова функція"
      en: "Recall: what an arrow function returns"
    items:
      - id: which-return
        from: js-03-03-arrow-functions
        prompt:
          uk: "Які з цих стрілкових функцій повертають значення, а не `undefined`? Обери всі."
          en: "Which of these arrow functions return a value rather than `undefined`? Choose all that do."
        answer:
          type: multi
          options:
            - id: short
              code: "(item) => item.price * 2"
            - id: block-no-return
              code: "(item) => { item.price * 2; }"
              why:
                uk: "Фігурні дужки — це тіло-блок: без `return` функція повертає `undefined`."
                en: "Curly braces make a block body: without `return` the function returns `undefined`."
            - id: object-parens
              code: "(item) => ({ id: item.id })"
            - id: object-no-parens
              code: "(item) => { id: item.id }"
              why:
                uk: "Без круглих дужок `{ id: … }` читається як блок, а не як об’єкт, тож функція повертає `undefined`."
                en: "Without round brackets, `{ id: … }` is read as a block, not as an object, so the function returns `undefined`."
            - id: block-return
              code: "(item) => { return item.price * 2; }"
          correct: [short, object-parens, block-return]
        explanation:
          uk: "Коротка стрілка без фігурних дужок неявно повертає свій вираз. З фігурними дужками потрібен `return`. А об’єкт беруть у круглі дужки, щоб його не прийняли за блок. Короткі функції-кроки для ланцюжків зазвичай пишуть саме так: в один рядок, з неявним поверненням."
          en: "A short arrow without curly braces returns its expression implicitly. With curly braces you need `return`. And an object goes into round brackets so that it is not taken for a block. Short step functions for chains are usually written exactly like that: on one line, with an implicit return."

  - id: choose-chain
    kind: prediction
    prompt:
      uk: "Обидва варіанти дають ті самі підписи ще не отриманих бажань. Яке твердження правильне?"
      en: "Both versions give the same labels of the wishes not acquired yet. Which statement is true?"
    code: |
      // A
      const labelsA = items.filter(isWanted).map(toLabel);

      // B
      const labelsB = items.reduce(
        (acc, item) => (item.acquired ? acc : [...acc, toLabel(item)]),
        []
      );
    runnable: false
    answer:
      type: choice
      options:
        - id: chain
          text:
            uk: "A: кожен крок має назву й робить одне, тож A легше читати й змінювати, а зайвий прохід сотнями записів займає частки мілісекунди"
            en: "A: every step has a name and does one thing, so A is easier to read and change, and the extra pass over hundreds of records takes fractions of a millisecond"
        - id: reduce-faster
          text:
            uk: "B: він проходить список лише раз, тож завжди швидший, а отже, кращий"
            en: "B: it walks the list only once, so it is always faster and therefore better"
          why:
            uk: "Один прохід ще не означає менше роботи: `[...acc, …]` на кожному кроці копіює весь накопичувач, тож на довгому списку B робить навіть більше роботи. І щоб зрозуміти B, його доводиться виконати подумки."
            en: "One pass does not mean less work: `[...acc, …]` copies the whole accumulator on every step, so on a long list B does even more work. And to understand B you have to run it in your head."
        - id: same
          text:
            uk: "Різниці немає: обидва варіанти однаково легко читати"
            en: "There is no difference: both versions are equally easy to read"
          why:
            uk: "У B зникли назви кроків: щоб побачити в ньому «залиш бажані й зроби підписи», код треба виконати подумки. A каже це словами."
            en: "In B the names of the steps are gone: to see “keep the wanted ones and make labels” in it, you have to run the code in your head. A says it in words."
      correct: [chain]
    explanation:
      uk: "A читається як речення: «залиш бажані, зроби підписи». B робить те саме, але ховає намір, а `[...acc, …]` ще й копіює накопичувач на кожному кроці. Один прохід — не завжди швидше, а для звичайних списків різниця в швидкості непомітна: важить зрозумілість."
      en: "A reads like a sentence: “keep the wanted ones, make labels”. B does the same but hides the intent, and `[...acc, …]` also copies the accumulator on every step. One pass is not always faster, and for everyday lists the speed difference is invisible: clarity is what matters."

  - id: which-is-clearer
    kind: explanation
    title:
      uk: "Цикл, ланцюжок чи reduce?"
      en: "A loop, a chain or a reduce?"
    body:
      uk: |
        Перший крок ланцюжка можна записати й через `reduce`:

        ```js
        const wanted = items.reduce(
          (acc, item) => (item.acquired ? acc : [...acc, item]),
          []
        );
        ```

        Щоб зрозуміти цей код, його треба подумки виконати. Це той самий `filter`, тільки схований: назва `isWanted` зникла. До того ж `[...acc, item]` щоразу копіює весь накопичувач, тож «один прохід» тут зовсім не швидший.

        `reduce` добрий для **одного значення**: суми, кількості, лічильників. Будувати ним масиви, з якими впораються `filter` і `map`, — значить ховати намір. А коли між кроками є складні умови чи ранній вихід, звичайний цикл буває найзрозумілішим — це теж нормальний вибір.

        > [!note]
        > Ланцюжок проходить список кілька разів, але для сотень і тисяч записів це частки мілісекунди: у браузері, де перевіряли цей урок, три кроки по 1000 записів зайняли менше мілісекунди. Спершу пиши зрозуміло, а швидкість вимірюй тоді, коли вона справді стане проблемою.
      en: |
        The first step of the chain can also be written with `reduce`:

        ```js
        const wanted = items.reduce(
          (acc, item) => (item.acquired ? acc : [...acc, item]),
          []
        );
        ```

        To understand this code you have to run it in your head. It is the same `filter`, only hidden: the name `isWanted` is gone. Besides, `[...acc, item]` copies the whole accumulator every time, so “one pass” is not faster here at all.

        `reduce` is good for **one value**: a sum, a count, counters. Using it to build arrays that `filter` and `map` can build hides the intent. And when there are complex conditions or an early exit between the steps, a plain loop can be the clearest — that is a perfectly good choice too.

        > [!note]
        > A chain walks the list several times, but for hundreds or thousands of records that takes fractions of a millisecond: in the browser where this lesson was checked, three steps over 1000 records took less than a millisecond. Write clear code first, and measure speed when it actually becomes a problem.

  - id: rewrite-loop
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: rewrite-loop
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      noDate: { uk: "без терміну", en: "no due date" }
      queryUpper: { uk: "КНИЖКИ", en: "BOOKS" }
      queryMiddle: { uk: "бібліо", en: "rary bo" }
      queryMulti: { uk: "АТИ", en: "TE" }
    title:
      uk: "Із циклу — в ланцюжок"
      en: "From a loop to a chain"
    instructions:
      uk: |
        Функція `pendingLabelsLoop` робить усе в одному довгому циклі: залишає ще не виконані справи, у назві яких є запит, сортує їх за терміном (справи без терміну — в кінець) і робить підписи. Перепиши її як ланцюжок маленьких кроків із назвами:

        1. `isPending(task)` — `true`, якщо справу ще не виконано.
        2. `matchesQuery(task, query)` — `true`, якщо в назві справи є `query`, незалежно від великих і малих літер.
        3. `byDueDate(a, b)` — компаратор із циклу.
        4. `toLabel(task)` — підпис «назва · термін» або «назва · без терміну».
        5. `pendingLabels(list, query)` — ланцюжок із цих кроків, що дає **точно такий самий** результат, як цикл, і не змінює список.

        Старий цикл можна лишити для порівняння або видалити.
      en: |
        The function `pendingLabelsLoop` does everything in one long loop: it keeps the tasks not done yet whose title contains the query, sorts them by due date (tasks without a due date go last) and makes labels. Rewrite it as a chain of small named steps:

        1. `isPending(task)` — `true` if the task is not done yet.
        2. `matchesQuery(task, query)` — `true` if the task’s title contains `query`, regardless of upper and lower case.
        3. `byDueDate(a, b)` — the comparator from the loop.
        4. `toLabel(task)` — the label “title · due date” or “title · no due date”.
        5. `pendingLabels(list, query)` — a chain of these steps that gives **exactly the same** result as the loop and does not change the list.

        You may keep the old loop to compare, or delete it.
    testTitles:
      "isPending is true only for tasks not done yet":
        uk: "isPending дає true лише для ще не виконаних справ"
        en: "isPending is true only for tasks not done yet"
      "matchesQuery finds the query anywhere in the title, in any case":
        uk: "matchesQuery знаходить запит у будь-якому місці назви, хоч би якими літерами його написано"
        en: "matchesQuery finds the query anywhere in the title, whatever letters it is written in"
      "byDueDate puts earlier dates first and tasks without a due date last":
        uk: "byDueDate ставить раніші терміни першими, а справи без терміну — в кінець"
        en: "byDueDate puts earlier dates first and tasks without a due date last"
      "toLabel makes the title · due date label":
        uk: "toLabel робить підпис «назва · термін»"
        en: "toLabel makes the “title · due date” label"
      "pendingLabels gives the same labels as the loop":
        uk: "pendingLabels дає ті самі підписи, що й цикл"
        en: "pendingLabels gives the same labels as the loop"
      "pendingLabels does not change the list":
        uk: "pendingLabels не змінює список"
        en: "pendingLabels does not change the list"
    hints:
      nudge:
        uk: "Подивись на цикл: які рядки коду вирішують, чи залишити справу, які впорядковують, а які роблять підписи? Кожна група стане однією маленькою функцією."
        en: "Look at the loop: which lines of code decide whether a task stays, which put the tasks in order and which make the labels? Each group becomes one small function."
      explanation:
        uk: "`isPending` і `matchesQuery` — це дві частини умови `if` у циклі, `byDueDate` — компаратор, переданий у `sort`, а `toLabel` — те, що цикл передає в `push`. Склади з них ланцюжок і подумай про порядок: кожен крок отримує те, що віддав попередній, а після `map` у масиві вже не справи, а підписи. `matchesQuery` потребує двох аргументів, тож у `filter` передай стрілку, яка викличе її з потрібним запитом."
        en: "`isPending` and `matchesQuery` are the two parts of the loop’s `if` condition, `byDueDate` is the comparator passed to `sort`, and `toLabel` is what the loop passes to `push`. Build a chain out of them and think about the order: each step receives what the previous one handed over, and after `map` the array holds labels, not tasks. `matchesQuery` needs two arguments, so pass `filter` an arrow that calls it with the right query."
    solutionNote:
      uk: "Кожен крок тепер має назву й перевіряється окремо, а `pendingLabels` читається як речення. Порядок важливий: `map` іде останнім, бо після нього в масиві вже підписи. `toSorted` сортує проміжний масив, тож сам список лишається таким, як був. `matchesQuery` передано в `filter` через стрілку: сам `filter` передав би їй другим аргументом номер елемента, а не запит."
      en: "Every step now has a name and is checked on its own, and `pendingLabels` reads like a sentence. The order matters: `map` goes last, because after it the array holds labels. `toSorted` sorts an intermediate array, so the list itself stays as it was. `matchesQuery` reaches `filter` through an arrow: `filter` on its own would pass the element’s index as the second argument, not the query."
    feedback:
      - when: { test: "isPending is true only for tasks not done yet" }
        message:
          uk: "Ця перевірка чекає `true` для невиконаної справи й `false` для виконаної. Якщо прийшов `undefined`, тілу функції у фігурних дужках `{ }` бракує `return`."
          en: "This check expects `true` for a task not done and `false` for a done one. If `undefined` came back, the function body in curly braces `{ }` is missing a `return`."
      - when: { test: "matchesQuery finds the query anywhere in the title, in any case" }
        message:
          uk: "Ця перевірка шукає «КНИЖКИ» і «бібліо» в назві «Здати книжки в бібліотеку» й чекає `true`, а для «xyz» — `false`. Якщо прийшов `undefined`, бракує `return`; якщо `false` для «КНИЖКИ», малими літерами зведено не обидва тексти."
          en: "This check looks for “BOOKS” and “rary bo” in the title “Return library books” and expects `true`, and `false` for “xyz”. If `undefined` came back, a `return` is missing; if `false` for “BOOKS”, not both texts were brought to small letters."
      - when: { test: "byDueDate puts earlier dates first and tasks without a due date last" }
        message:
          uk: "Ця перевірка сортує п’ять справ і чекає `t-04`, `t-02`, `t-01`, `t-05`, а справу без терміну `t-03` — у кінці. Якщо порядок не змінився, компаратор не каже, хто з двох раніше: перевір, що він повертає число (у тілі з фігурними дужками потрібен `return`). Компаратор із циклу можна перенести без змін."
          en: "This check sorts five tasks and expects `t-04`, `t-02`, `t-01`, `t-05`, with the task without a due date, `t-03`, at the end. If the order did not change, the comparator does not say which of the two comes first: check that it returns a number (a body in curly braces needs a `return`). The comparator from the loop can be moved over unchanged."
      - when: { test: "toLabel makes the title · due date label" }
        message:
          uk: "Ця перевірка чекає підписи «Здати книжки в бібліотеку · 2026-03-01» і «Написати бабусі · без терміну». Якщо бачиш `undefined`, бракує `return`; якщо «· null», відсутній термін треба замінити ще до склеювання."
          en: "This check expects the labels “Return library books · 2026-03-01” and “Write to grandma · no due date”. If you see `undefined`, a `return` is missing; if “· null”, the missing due date has to be replaced before joining."
      - when: { test: "pendingLabels gives the same labels as the loop" }
        message:
          uk: "Ця перевірка порівнює результат `pendingLabels` із результатом циклу для кількох запитів. Якщо вони різняться, перевір порядок кроків: обидва `filter` потребують цілих справ, тож `map` має стояти останнім — після нього в масиві вже підписи; і перевір, що `pendingLabels` повертає результат ланцюжка. Якщо замість результату з’являється `TypeError`, якийсь крок отримав не те, що чекав."
          en: "This check compares the result of `pendingLabels` with the result of the loop for several queries. If they differ, check the order of the steps: both `filter` steps need whole tasks, so `map` must come last — after it the array holds labels; and check that `pendingLabels` returns the result of the chain. If a `TypeError` appears instead of a result, some step received something other than it expected."
      - when: { test: "pendingLabels does not change the list" }
        message:
          uk: "Ця перевірка порівнює список до й після виклику `pendingLabels`: він має лишитися таким самим. Якщо змінився порядок, `sort` переставив сам список — сортуй проміжний масив після `filter` або через `toSorted`."
          en: "This check compares the list before and after calling `pendingLabels`: it must stay the same. If the order changed, `sort` reordered the list itself — sort an intermediate array after `filter`, or use `toSorted`."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` у ланцюжку означає, що якийсь крок отримав не те, що чекав. Якщо бачиш «query.toLowerCase is not a function», `matchesQuery` передано в `filter` напряму: `filter` викликає її з номером елемента замість запиту, тож потрібна стрілка, що викличе `matchesQuery` із запитом. Якщо бачиш «Cannot read properties of undefined (reading 'toLowerCase')», крок, що читає `task.title`, отримав підпис, а не справу: `map` стоїть раніше за `filter`."
          en: "A `TypeError` in a chain means some step received something other than it expected. If you see “query.toLowerCase is not a function”, `matchesQuery` was passed to `filter` directly: `filter` calls it with the element’s index instead of the query, so an arrow is needed that calls `matchesQuery` with the query. If you see “Cannot read properties of undefined (reading 'toLowerCase')”, the step that reads `task.title` received a label instead of a task: `map` comes before `filter`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-05
    body:
      uk: "У проєкті пошук, фільтр, сортування й підписи стануть кроками одного ланцюжка. Давай крокам назви — і через місяць ти прочитаєш свій код як речення."
      en: "In your project, search, filter, sort and labels become the steps of one chain. Give the steps names — and a month from now you will read your code like a sentence."
