id: js-05-04-reduce
unit: JS-05
title:
  uk: "reduce: згортаємо список в одне значення"
  en: "reduce: fold a list into one value"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Простежити `reduce` крок за кроком — від початкового значення до результату."
    en: "Trace `reduce` step by step from its initial value to the final result."
  - uk: "Написати `reduce`, що додає суми або рахує записи за ключем, і пояснити, чому без початкового значення він ламається на порожньому списку."
    en: "Write a `reduce` that sums amounts or counts records per key, and explain why leaving out the initial value breaks on an empty list."
prerequisites: [js-05-03-some-every, js-04-02-for-while]
subskills:
  - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: practice }
glossary: [array-reduce, accumulator, initial-value]
selfCheck: [predict-steps, predict-empty, wish-totals]

blocks:
  - id: one-value
    kind: explanation
    title:
      uk: "Зі списку — одне значення"
      en: "From a list to one value"
    body:
      uk: |
        `map` і `filter` повертають масиви. Але часто зі списку потрібне **одне** значення: сума цін, кількість справ, найбільша витрата. Для цього є [[array-reduce|reduce]] — «згортання» списку:

        ```js
        const total = prices.reduce((sum, price) => sum + price, 0);
        ```

        `reduce` отримує два аргументи:

        1. **Функцію з двома параметрами.** Перший, `sum`, — це [[accumulator|накопичувач]]: результат, зібраний до цього кроку. Другий, `price`, — поточний елемент. Функція повертає **новий** накопичувач.
        2. **[[initial-value|Початкове значення]]** накопичувача — тут `0`.

        Те, що функція поверне на останньому елементі, і є результатом `reduce`.
      en: |
        `map` and `filter` return arrays. But often you need **one** value from a list: the total of the prices, the number of tasks, the biggest expense. That is what [[array-reduce|reduce]] is for — it “folds” a list:

        ```js
        const total = prices.reduce((sum, price) => sum + price, 0);
        ```

        `reduce` takes two arguments:

        1. **A function with two parameters.** The first, `sum`, is the [[accumulator]]: the result collected so far. The second, `price`, is the current element. The function returns the **new** accumulator.
        2. **The [[initial-value|initial value]]** of the accumulator — here `0`.

        Whatever the function returns on the last element is the result of `reduce`.

  - id: predict-steps
    kind: prediction
    prompt:
      uk: "Функція в `reduce` виводить у консоль кожен свій крок. Що там з’явиться?"
      en: "The function in `reduce` prints each of its steps. What appears in the console?"
    code: |
      const prices = [80, 45, 240];
      const total = prices.reduce((sum, price) => {
        console.log(sum, "+", price);
        return sum + price;
      }, 0);
      console.log(total);
    verify:
      logs: ["0 + 80", "80 + 45", "125 + 240", "365"]
    answer:
      type: choice
      options:
        - id: carried
          text:
            uk: "`0 + 80`, `80 + 45`, `125 + 240`, а потім `365`"
            en: "`0 + 80`, `80 + 45`, `125 + 240`, then `365`"
        - id: reset
          text:
            uk: "`0 + 80`, `0 + 45`, `0 + 240`, а потім `365`"
            en: "`0 + 80`, `0 + 45`, `0 + 240`, then `365`"
          why:
            uk: "Накопичувач не скидається на кожному кроці: функція отримує те, що сама повернула минулого разу. Після першого кроку `sum` — уже `80`."
            en: "The accumulator is not reset on each step: the function receives what it returned last time. After the first step `sum` is already `80`."
        - id: skips-first
          text:
            uk: "`80 + 45`, `125 + 240`, а потім `365`"
            en: "`80 + 45`, `125 + 240`, then `365`"
          why:
            uk: "З початковим значенням `0` функцію викликають для **кожного** елемента, починаючи з першого: перший крок — `0 + 80`."
            en: "With the initial value `0` the function is called for **every** element, starting with the first: the first step is `0 + 80`."
        - id: array-result
          text:
            uk: "`0 + 80`, `80 + 45`, `125 + 240`, а потім `[80, 125, 365]`"
            en: "`0 + 80`, `80 + 45`, `125 + 240`, then `[80, 125, 365]`"
          why:
            uk: "`reduce` повертає лише останній накопичувач — одне значення, а не масив проміжних сум."
            en: "`reduce` returns only the last accumulator — one value, not an array of the running totals."
      correct: [carried]
    explanation:
      uk: "На першому кроці накопичувач — це початкове значення `0`. Функція повертає `80`, і це стає накопичувачем для другого кроку: `80 + 45 = 125`. Третій крок: `125 + 240 = 365`. Елементи скінчилися — `reduce` повертає останній накопичувач, `365`."
      en: "On the first step the accumulator is the initial value `0`. The function returns `80`, and that becomes the accumulator for the second step: `80 + 45 = 125`. Third step: `125 + 240 = 365`. The elements are used up — `reduce` returns the last accumulator, `365`."

  - id: fold-flow
    kind: visual
    visual: pipeline
    title:
      uk: "Накопичувач крок за кроком"
      en: "The accumulator step by step"
    textEquivalent:
      uk: "Масив prices містить три ціни: 80, 45 і 240. reduce починає з початкового значення накопичувача 0. Крок 1: функція отримує 0 і 80 і повертає 80. Крок 2: отримує 80 і 45 і повертає 125. Крок 3: отримує 125 і 240 і повертає 365. Елементів більше немає, тому reduce повертає останній накопичувач, 365. Масив prices при цьому не змінюється."
      en: "The prices array holds three prices: 80, 45 and 240. reduce starts with the initial accumulator value 0. Step 1: the function receives 0 and 80 and returns 80. Step 2: it receives 80 and 45 and returns 125. Step 3: it receives 125 and 240 and returns 365. There are no more elements, so reduce returns the last accumulator, 365. The prices array does not change."
    spec:
      code: |
        const total = prices.reduce(
          (sum, price) => sum + price,
          0
        );
      input:
        label: { uk: "prices — ціни трьох бажань", en: "prices — the prices of three wishes" }
        items: [80, 45, 240]
        caption:
          uk: "Три ціни. Накопичувач починає з початкового значення `0`."
          en: "Three prices. The accumulator starts from the initial value `0`."
      stages:
        - op: reduce
          fn: "(sum, price) => sum + price"
          initial: 0
          perItem: true
          caption:
            uk: "Крок {index} з {count}: функція отримує накопичувач і ціну `{item}` і повертає новий накопичувач — **{acc}**."
            en: "Step {index} of {count}: the function receives the accumulator and the price `{item}` and returns the new accumulator — **{acc}**."
          summary:
            uk: "Ціни скінчилися. Те, що функція повернула на останньому кроці, — `365` — і є результат `reduce`. Масив `prices` не змінився."
            en: "The prices are used up. What the function returned on the last step — `365` — is the result of `reduce`. The `prices` array did not change."
      result:
        label: { uk: "сума цін", en: "the total" }

  - id: cashier
    kind: analogy
    body:
      uk: "`reduce` схожий на касира в магазині: той бере товари з кошика по одному й щоразу оновлює суму на табло. Табло — це накопичувач, а функція — те, що касир робить з одним товаром."
      en: "`reduce` is like a cashier at a shop: they take the items out of the basket one by one and update the total on the display each time. The display is the accumulator, and the function is what the cashier does with one item."
    limits:
      uk: "Касир завжди починає з нуля, а `reduce` починає з того початкового значення, яке ти передав. Без нього `reduce` бере за початок перший «товар», а на порожньому кошику ламається. І на табло касира завжди число, а накопичувач `reduce` може бути будь-чим: рядком, масивом чи об’єктом."
      en: "A cashier always starts from zero, while `reduce` starts from whatever initial value you pass. Without one, `reduce` takes the first “item” as its start and breaks on an empty basket. And a cashier’s display always shows a number, while the accumulator of `reduce` can be anything: a string, an array or an object."

  - id: sum-prices
    kind: example
    runtime: browser-js
    dir: sum-prices
    entry: index.js
    title:
      uk: "Сума і найбільша ціна"
      en: "The total and the highest price"
    body:
      uk: "Перший `reduce` додає ціни. Другий шукає найбільшу: на кожному кроці він залишає більше з двох — накопичувач чи поточну ціну. Запусти програму."
      en: "The first `reduce` adds the prices up. The second looks for the highest one: on every step it keeps the larger of the two — the accumulator or the current price. Run the program."
    tryIt:
      uk: |
        1. Зміни початкове значення першого `reduce` з `0` на `100` і запусти: сума зросла на 100 — накопичувач справді починає з того, що ти передав.
        2. Зроби масив порожнім: `const prices = [];`. Що повернули обидва `reduce`?
      en: |
        1. Change the initial value of the first `reduce` from `0` to `100` and run: the total grew by 100 — the accumulator really starts from what you passed.
        2. Make the array empty: `const prices = [];`. What did both `reduce` calls return?

  - id: recall-total
    kind: review
    title:
      uk: "Пригадай: сума в циклі"
      en: "Recall: a running total in a loop"
    items:
      - id: loop-total
        from: js-04-02-for-while
        prompt:
          uk: "Що виведе цей цикл? Впиши число."
          en: "What does this loop print? Type the number."
        code: |
          const prices = [80, 45, 240];
          let total = 0;
          for (let i = 0; i < prices.length; i++) {
            total = total + prices[i];
          }
          console.log(total);
        verify:
          logs: ["365"]
        answer:
          type: text
          accept: ["365"]
          placeholder: { uk: "число", en: "a number" }
        explanation:
          uk: "Цикл починає з `total = 0` і на кожному кроці додає ціну: `80`, `125`, `365`. Саме це робить і `reduce`, тільки змінну, що змінюється, він тримає всередині себе."
          en: "The loop starts with `total = 0` and adds a price on every step: `80`, `125`, `365`. That is exactly what `reduce` does, except that it keeps the changing variable inside itself."

  - id: loop-and-reduce
    kind: explanation
    title:
      uk: "reduce — це знайомий цикл"
      en: "reduce is a loop you already know"
    body:
      uk: |
        Порівняй цикл із попереднього запитання з `reduce`:

        | Цикл | `reduce` |
        |---|---|
        | `let total = 0;` | початкове значення `0` |
        | `total = total + prices[i];` | функція `(sum, price) => sum + price` |
        | `total` після циклу | результат `reduce` |

        `reduce` робить те саме, але ти описуєш лише **один крок**, а змінну, що змінюється, він веде сам.

        Накопичувач не обов’язково число. Це може бути рядок, масив чи об’єкт — наприклад, лічильники за категоріями: `{ food: 2, fun: 2 }`.

        > [!warning]
        > Початковий об’єкт пиши прямо у виклику: `reduce(..., {})`. Об’єкт, створений один раз поза функцією, був би спільним для всіх викликів — і лічильники накопичувалися б від виклику до виклику.
      en: |
        Compare the loop from the previous question with `reduce`:

        | Loop | `reduce` |
        |---|---|
        | `let total = 0;` | the initial value `0` |
        | `total = total + prices[i];` | the function `(sum, price) => sum + price` |
        | `total` after the loop | the result of `reduce` |

        `reduce` does the same, but you describe only **one step**, and it keeps track of the changing variable itself.

        The accumulator does not have to be a number. It can be a string, an array or an object — for example, counters per category: `{ food: 2, fun: 2 }`.

        > [!warning]
        > Write the initial object right in the call: `reduce(..., {})`. An object created once outside the function would be shared by all calls — and the counters would keep piling up from call to call.

  - id: predict-empty
    kind: prediction
    prompt:
      uk: "Список порожній. Перший `reduce` має початкове значення, другий — ні. Що станеться?"
      en: "The list is empty. The first `reduce` has an initial value, the second does not. What happens?"
    code: |
      const prices = [];
      console.log(prices.reduce((sum, price) => sum + price, 0));
      console.log(prices.reduce((sum, price) => sum + price));
    verify:
      logs: ["0"]
      error: TypeError
    answer:
      type: choice
      options:
        - id: zero-then-error
          text:
            uk: "`0`, а потім помилка `TypeError`"
            en: "`0`, then a `TypeError`"
        - id: zero-zero
          text:
            uk: "`0` і `0`"
            en: "`0` and `0`"
          why:
            uk: "Без початкового значення `reduce` бере за початок **перший елемент**. У порожньому масиві його немає, тож `reduce` кидає `TypeError`."
            en: "Without an initial value, `reduce` takes the **first element** as its start. An empty array has none, so `reduce` throws a `TypeError`."
        - id: undefined-undefined
          text:
            uk: "`undefined` і `undefined`"
            en: "`undefined` and `undefined`"
          why:
            uk: "Перший виклик має початкове значення `0`: коли елементів немає, функція не викликається жодного разу, і `reduce` повертає саме `0`."
            en: "The first call has the initial value `0`: when there are no elements, the function is never called, and `reduce` returns exactly `0`."
        - id: zero-undefined
          text:
            uk: "`0` і `undefined`"
            en: "`0` and `undefined`"
          why:
            uk: "Порожній масив без початкового значення — це помилка, а не `undefined`: `Reduce of empty array with no initial value`."
            en: "An empty array with no initial value is an error, not `undefined`: `Reduce of empty array with no initial value`."
      correct: [zero-then-error]
    explanation:
      uk: "З початковим значенням функція на порожньому масиві не викликається жодного разу, і `reduce` повертає `0`. Без нього `reduce` намагається взяти за початок перший елемент — а його немає. Звідси `TypeError: Reduce of empty array with no initial value`. Початкове значення — не справа смаку, а захист від порожнього списку."
      en: "With an initial value, the function is never called on an empty array, and `reduce` returns `0`. Without it, `reduce` tries to start from the first element — and there is none. Hence `TypeError: Reduce of empty array with no initial value`. The initial value is not a matter of taste; it protects you from the empty list."

  - id: count-by-category
    kind: example
    runtime: browser-js
    dir: count-by-category
    entry: index.js
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      lunch: { uk: "Обід", en: "Lunch" }
    title:
      uk: "Накопичувач-об’єкт"
      en: "An object as the accumulator"
    body:
      uk: "Тут накопичувач — об’єкт із лічильниками за категоріями. На кожному кроці функція збільшує лічильник категорії поточної витрати й повертає той самий об’єкт. Запусти й подивись, як об’єкт росте від кроку до кроку."
      en: "Here the accumulator is an object with a counter per category. On every step the function increases the counter of the current expense’s category and returns the same object. Run it and watch the object grow from step to step."
    tryIt:
      uk: |
        1. Зроби з лічильників суми: заміни `+ 1` на `+ expense.amountMinor`. Тепер видно, скільки копійок витрачено на кожну категорію.
        2. Прибери початкове значення `{}` разом із комою перед ним і запусти. Накопичувачем стане перша витрата, і лічильники запишуться просто в її об’єкт: `food` покаже 1 замість 2, а запис `e-01` зміниться. Поверни `{}` на місце.
      en: |
        1. Turn the counters into totals: replace `+ 1` with `+ expense.amountMinor`. Now you can see how many kopiykas went to each category.
        2. Remove the initial value `{}` together with the comma before it and run. The first expense becomes the accumulator, and the counters are written straight into its object: `food` shows 1 instead of 2, and the `e-01` record changes. Put `{}` back.

  - id: wish-totals
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: wish-totals
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      tech: { uk: "Техніка", en: "Tech" }
      home: { uk: "Дім", en: "Home" }
    title:
      uk: "Підсумки списку бажань"
      en: "Wishlist totals"
    instructions:
      uk: |
        Допиши дві функції за допомогою `reduce`:

        1. `totalPrice(list)` — сума цін усіх бажань. Бажання без ціни (`price` дорівнює `null` або поля `price` взагалі немає) пропускай. Порожній список дає `0`.
        2. `countByCategory(list)` — об’єкт, у якому для кожної категорії записано кількість бажань, наприклад `{ "Дім": 2 }`. Бажання без категорії (`null`) рахуй під ключем `"none"`.

        Самі записи не змінюй.
      en: |
        Complete two functions with `reduce`:

        1. `totalPrice(list)` — the sum of the prices of all wishes. Skip wishes without a price (`price` is `null` or there is no `price` field at all). An empty list gives `0`.
        2. `countByCategory(list)` — an object holding the number of wishes for every category, for example `{ "Home": 2 }`. Count wishes without a category (`null`) under the key `"none"`.

        Do not change the records themselves.
    testTitles:
      "totalPrice adds up the prices":
        uk: "totalPrice додає ціни"
        en: "totalPrice adds up the prices"
      "totalPrice skips an item with no price field at all":
        uk: "totalPrice пропускає бажання зовсім без поля price"
        en: "totalPrice skips a wish with no price field at all"
      "totalPrice of an empty list is 0":
        uk: "totalPrice порожнього списку дорівнює 0"
        en: "totalPrice of an empty list is 0"
      "countByCategory counts items per category":
        uk: "countByCategory рахує бажання в кожній категорії"
        en: "countByCategory counts wishes per category"
      "countByCategory of an empty list is an empty object":
        uk: "countByCategory порожнього списку — порожній об’єкт"
        en: "countByCategory of an empty list is an empty object"
      "calling countByCategory twice gives the same result":
        uk: "Повторний виклик countByCategory дає той самий результат"
        en: "Calling countByCategory twice gives the same result"
      "the items are not changed":
        uk: "Записи не змінюються"
        en: "The records are not changed"
    hints:
      nudge:
        uk: "Для кожної функції спершу виріши: яким буде початкове значення накопичувача? Для суми — число. А для лічильників?"
        en: "For each function, first decide: what is the initial value of the accumulator? For a sum it is a number. And for counters?"
      explanation:
        uk: "`totalPrice`: почни з `0` і на кожному кроці додавай ціну, а замість відсутньої ціни — `0` (тут допоможе `??`, бо він обробляє і `null`, і `undefined`). `countByCategory`: почни з порожнього об’єкта `{}`. На кожному кроці визнач ключ — категорію або `\"none\"` — і збільш лічильник за цим ключем; якщо лічильника ще немає, вважай його `0`. Не забудь повертати накопичувач."
        en: "`totalPrice`: start from `0` and add the price on every step, using `0` in place of a missing price (`??` helps here, because it handles both `null` and `undefined`). `countByCategory`: start from an empty object `{}`. On every step work out the key — the category or `\"none\"` — and increase the counter under that key; if there is no counter yet, treat it as `0`. Remember to return the accumulator."
    solutionNote:
      uk: "У `totalPrice` вираз `item.price ?? 0` перетворює і `null`, і відсутнє поле на `0`, а початкове `0` дає правильну відповідь на порожньому списку. У `countByCategory` накопичувач — новий об’єкт `{}`, створений прямо у виклику: змінювати його можна, бо він належить лише цьому виклику, а записи списку лишаються незмінними."
      en: "In `totalPrice`, `item.price ?? 0` turns both `null` and a missing field into `0`, and the initial `0` gives the right answer for an empty list. In `countByCategory` the accumulator is a new object `{}` created right in the call: changing it is fine, because it belongs to this call alone, while the list records stay unchanged."
    feedback:
      - when: { test: "totalPrice adds up the prices" }
        message:
          uk: "Перевір початок: із `reduce(..., 0)` перший накопичувач — `0`. Без початкового значення накопичувачем стає перше бажання — об’єкт, а не число."
          en: "Check the start: with `reduce(..., 0)` the first accumulator is `0`. Without an initial value the first wish becomes the accumulator — an object, not a number."
      - when: { test: "totalPrice skips an item with no price field at all" }
        message:
          uk: "Бажання без поля `price` дає `undefined`, а `число + undefined` — це `NaN`. Використай `?? 0`: він перетворює на `0` і `null`, і `undefined`."
          en: "A wish without a `price` field gives `undefined`, and `number + undefined` is `NaN`. Use `?? 0`: it turns both `null` and `undefined` into `0`."
      - when: { test: "totalPrice of an empty list is 0" }
        message:
          uk: "На порожньому списку `reduce` без початкового значення кидає `TypeError`. Передай `0` другим аргументом."
          en: "On an empty list `reduce` without an initial value throws a `TypeError`. Pass `0` as the second argument."
      - when: { test: "countByCategory counts items per category" }
        message:
          uk: "З’явився ключ `\"null\"` замість `\"none\"`? Перетвори відсутню категорію на `\"none\"` через `??`. І перевір, що функція повертає накопичувач на кожному кроці."
          en: "Is there a `\"null\"` key instead of `\"none\"`? Turn a missing category into `\"none\"` with `??`. And check that the function returns the accumulator on every step."
      - when: { test: "calling countByCategory twice gives the same result" }
        message:
          uk: "Лічильники ростуть від виклику до виклику: початковий об’єкт спільний. Пиши новий `{}` прямо у виклику `reduce`, щоб кожен виклик починав з нуля."
          en: "The counters keep growing from call to call: the initial object is shared. Write a new `{}` right in the `reduce` call so that every call starts from scratch."

  - id: to-project
    kind: transfer
    capstoneStep: JS-05
    body:
      uk: "Підсумок твого проєкту — сума цін бажань, кількість справ, частка виконаних днів чи суми витрат за категоріями — це `reduce`. Пам’ятай про початкове значення: проєкт має чесно відповідати й тоді, коли список порожній."
      en: "Your project’s summary — the total price of the wishes, the number of tasks, the share of completed days or the totals per category — is a `reduce`. Remember the initial value: the project must answer honestly when the list is empty too."
