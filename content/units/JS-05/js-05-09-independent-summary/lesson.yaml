id: js-05-09-independent-summary
unit: JS-05
title:
  uk: "Самостійно: фільтр, пошук і підсумок з оцінкою вартості"
  en: "Independent: filter, search and summary with cost notes"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Самостійно поєднати перетворення списків цього розділу в новій ситуації — у функціях, що працюють для будь-якого з чотирьох проєктів, — і показати, що розумієш, скільки роботи й пам’яті вони коштують."
  en: "Combine the list transformations of this unit on your own in a new situation — functions that work for any of the four projects — and show that you understand how much work and memory they cost."
objectives:
  - uk: "Без підказок реалізувати для синтетичних записів пошук, фільтр, сортування й підсумок, які не змінюють вхідних даних і правильно обробляють відсутні значення та повтори."
    en: "Implement, without hints, search, filter, sort and summary functions over synthetic records that leave the input unchanged and handle missing values and duplicate records."
  - uk: "Побудувати довідник за `id` і пояснити, як робота й додаткова пам’ять кожної функції ростуть разом із кількістю записів."
    en: "Build a lookup by `id` and explain how the work and the extra memory of each function grow with the number of records."
prerequisites: [js-05-08-debug-comparator-missing]
subskills:
  - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: assess }
  - { family: J-05, skill: "sorting comparator and stable ordering", depth: assess }
  - { family: J-05, skill: "search and complexity", depth: assess }
glossary: []

blocks:
  - id: the-task
    kind: explanation
    title:
      uk: "Що перевіряє цей урок"
      en: "What this lesson checks"
    body:
      uk: |
        Тут ти працюєш **без підказок**: лише умова, редактор і перевірки. Знадобиться все з цього розділу — `filter`, `find`, `reduce`, компаратори, довідник за `id` — і обережність із порожніми списками, відсутніми значеннями та повторами.

        Перевірки запускають твої функції на **власних** списках, а не лише на прикладі з редактора: на порожньому списку, з повторами, з однаковими значеннями, з `null`. А ще вони перевіряють, що вхідний список не змінився.

        Якщо перевірка не проходить, прочитай її назву й повідомлення: вони кажуть, *що* очікувалося, а не *як* це написати.
      en: |
        Here you work **without hints**: just the task, the editor and the checks. You will need everything from this unit — `filter`, `find`, `reduce`, comparators, a lookup by `id` — and care with empty lists, missing values and duplicates.

        The checks run your functions on **their own** lists, not only on the example in the editor: an empty list, duplicates, equal values, `null`. They also check that the input list did not change.

        If a check fails, read its title and message: they say *what* was expected, not *how* to write it.

  - id: lookup
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: lookup
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      booksAgain: { uk: "Здати книжки (повтор)", en: "Return library books (again)" }
    title:
      uk: "Довідник за id"
      en: "A lookup by id"
    instructions:
      uk: |
        Напиши дві функції:

        1. `indexById(records)` — об’єкт, у якому кожен `id` веде до свого запису. Якщо `id` трапляється кілька разів, залиш **перший** запис із ним.
        2. `pickByIds(records, ids)` — масив, у якому для кожного `id` з `ids` стоїть запис із цим `id` або `null`, якщо такого немає. Довідник будуй **один раз**: не шукай по всьому списку для кожного `id`.

        Записи не копіюй і не змінюй. Будь-який `id` — просто рядок, навіть `"toString"`.
      en: |
        Write two functions:

        1. `indexById(records)` — an object in which every `id` leads to its record. If an `id` occurs several times, keep the **first** record with it.
        2. `pickByIds(records, ids)` — an array that holds, for every `id` in `ids`, the record with that `id`, or `null` if there is none. Build the lookup **once**: do not search the whole list for every `id`.

        Do not copy or change the records. Any `id` is just a string, even `"toString"`.
    testTitles:
      "indexById maps each id to its record":
        uk: "indexById веде кожен id до його запису"
        en: "indexById maps each id to its record"
      "indexById keeps the first record for a repeated id":
        uk: "indexById залишає перший запис для повтореного id"
        en: "indexById keeps the first record for a repeated id"
      "indexById of an empty list is an empty object":
        uk: "indexById порожнього списку — порожній об’єкт"
        en: "indexById of an empty list is an empty object"
      "pickByIds returns the records in the order of the ids":
        uk: "pickByIds повертає записи в порядку id"
        en: "pickByIds returns the records in the order of the ids"
      "pickByIds gives null for an unknown id":
        uk: "pickByIds дає null для невідомого id"
        en: "pickByIds gives null for an unknown id"
      "an id such as toString is not found by accident":
        uk: "id на зразок toString не знаходиться випадково"
        en: "An id such as toString is not found by accident"
      "pickByIds reads each id only a few times":
        uk: "pickByIds читає кожен id лише кілька разів"
        en: "pickByIds reads each id only a few times"
      "the records list is not changed":
        uk: "Список записів не змінюється"
        en: "The list of records is not changed"
    solutionNote:
      uk: "Довідник будується одним проходом, а `Object.hasOwn` перевіряє лише власні ключі: так перший запис не перезаписується повтором, а `\"toString\"` не плутається з успадкованим методом. `pickByIds` будує довідник один раз — `n` кроків і пам’ять на `n` ключів, — і далі кожен `id` знаходить за один крок."
      en: "The lookup is built in one pass, and `Object.hasOwn` checks only own keys: that way the first record is not overwritten by a repeat, and `\"toString\"` is not confused with an inherited method. `pickByIds` builds the lookup once — `n` steps and memory for `n` keys — and then finds every `id` in one step."
    feedback:
      - when: { test: "indexById keeps the first record for a repeated id" }
        message:
          uk: "Для повтореного `id` у довіднику опинився не перший запис. Перш ніж записати, перевір, чи такого ключа ще немає."
          en: "For a repeated `id` the lookup holds a record other than the first. Before writing, check that the key is not there yet."
      - when: { test: "an id such as toString is not found by accident" }
        message:
          uk: "Для `\"toString\"` повернулося щось, крім `null`: у звичайного об’єкта є успадковані ключі. Перевіряй лише власні ключі довідника."
          en: "Something other than `null` came back for `\"toString\"`: a plain object has inherited keys. Check only the lookup’s own keys."
      - when: { test: "pickByIds reads each id only a few times" }
        message:
          uk: "Відповідь правильна, але робота росте як «кількість `id` × кількість записів». Будуй довідник один раз, замість того щоб для кожного `id` шукати по всьому списку."
          en: "The answer is right, but the work grows as “number of `id`s × number of records”. The lookup must be built once instead of searching the list for every `id`."

  - id: recall-nullish
    kind: review
    title:
      uk: "Пригадай: ?? і відсутня ціна"
      en: "Recall: ?? and a missing price"
    items:
      - id: zero-or-null
        from: js-02-04-nullish-optional-chaining
        prompt:
          uk: "Що виведуть ці два рядки?"
          en: "What do these two lines print?"
        code: |
          const free = { price: 0 };
          const unknown = { price: null };
          console.log(free.price ?? "—", free.price || "—");
          console.log(unknown.price ?? "—");
        verify:
          logs: ["0 —", "—"]
        answer:
          type: choice
          options:
            - id: right
              text:
                uk: "`0 —`, потім `—`"
                en: "`0 —`, then `—`"
            - id: zero-replaced
              text:
                uk: "`— —`, потім `—`"
                en: "`— —`, then `—`"
              why:
                uk: "`??` замінює лише `null` і `undefined`. `0` — справжня ціна, тож `free.price ?? \"—\"` дає `0`."
                en: "`??` replaces only `null` and `undefined`. `0` is a real price, so `free.price ?? \"—\"` gives `0`."
            - id: nothing-replaced
              text:
                uk: "`0 0`, потім `null`"
                en: "`0 0`, then `null`"
              why:
                uk: "`||` замінює будь-яке хибне значення, зокрема `0`, а `??` замінює `null` запасним значенням."
                en: "`||` replaces every falsy value, `0` included, and `??` replaces `null` with the fallback."
          correct: [right]
        explanation:
          uk: "`??` дивиться лише на `null` і `undefined`: ціна `0` лишається `0`, а `null` стає «—». `||` вважає «порожнім» і `0`. Для підсумку цін це важливо: безкоштовна річ — не те саме, що річ без ціни."
          en: "`??` looks only at `null` and `undefined`: the price `0` stays `0`, and `null` becomes “—”. `||` treats `0` as “empty” too. For a price summary this matters: a free thing is not the same as a thing without a price."

  - id: toolkit
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: toolkit
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      aidKit: { uk: "аптечка", en: "aid kit" }
      water: { uk: "Полити квіти", en: "Water the plants" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      queryUpper: { uk: "ЛАМП", en: "LAMP" }
      queryTask: { uk: "КНИЖКИ", en: "BOOKS" }
    title:
      uk: "Інструменти для будь-якого списку"
      en: "Tools for any list"
    instructions:
      uk: |
        Напиши чотири функції, які працюють для **будь-якого** списку записів — бажань, справ, звичок чи витрат. Назву поля передають параметром `field`. Жодна функція не змінює список, який отримала.

        1. `searchByText(records, field, query)` — записи, у текстовому полі `field` яких є `query`, незалежно від великих і малих літер. Порожній запит залишає всі записи.
        2. `filterByStatus(records, field, value)` — записи, у яких поле `field` точно дорівнює (`===`) `value`.
        3. `sortBy(records, field)` — **новий** масив, упорядкований за полем від меншого до більшого: числа — за величиною, текст — за абеткою (`localeCompare`). Записи, у яких поле дорівнює `null`, — у кінці. Записи з однаковим значенням зберігають свій порядок.
        4. `summarize(records, field)` — об’єкт `{ count, total, missing }`, у якому кожен `id` рахується лише раз: `count` — скільки різних `id`; `total` — сума поля для цих записів без `null`; `missing` — у скількох із них поле дорівнює `null`.
      en: |
        Write four functions that work for **any** list of records — wishes, tasks, habits or expenses. The field name is passed in the `field` parameter. No function changes the list it receives.

        1. `searchByText(records, field, query)` — the records whose text field `field` contains `query`, regardless of upper and lower case. An empty query keeps every record.
        2. `filterByStatus(records, field, value)` — the records whose field `field` is exactly equal (`===`) to `value`.
        3. `sortBy(records, field)` — a **new** array ordered by the field from smallest to largest: numbers by size, text alphabetically (`localeCompare`). Records whose field is `null` go last. Records with an equal value keep their order.
        4. `summarize(records, field)` — an object `{ count, total, missing }` in which every `id` counts only once: `count` is how many different `id`s there are; `total` is the sum of the field over those records, skipping `null`; `missing` is how many of them have `null` in the field.
    testTitles:
      "searchByText ignores upper and lower case":
        uk: "searchByText не зважає на великі й малі літери"
        en: "searchByText ignores upper and lower case"
      "searchByText with an empty query keeps every record":
        uk: "searchByText з порожнім запитом залишає всі записи"
        en: "searchByText with an empty query keeps every record"
      "searchByText returns an empty array when nothing matches":
        uk: "searchByText дає порожній масив, коли нічого не знайдено"
        en: "searchByText returns an empty array when nothing matches"
      "filterByStatus keeps exactly the records with that value":
        uk: "filterByStatus залишає саме записи з цим значенням"
        en: "filterByStatus keeps exactly the records with that value"
      "sortBy orders numbers from smallest to largest":
        uk: "sortBy упорядковує числа від меншого до більшого"
        en: "sortBy orders numbers from smallest to largest"
      "sortBy orders text alphabetically":
        uk: "sortBy упорядковує текст за абеткою"
        en: "sortBy orders text alphabetically"
      "sortBy puts null values last":
        uk: "sortBy ставить значення null у кінець"
        en: "sortBy puts null values last"
      "sortBy keeps the order of records with equal values":
        uk: "sortBy зберігає порядок записів з однаковими значеннями"
        en: "sortBy keeps the order of records with equal values"
      "sortBy returns a new array and leaves the input as it was":
        uk: "sortBy повертає новий масив і не змінює вхідний"
        en: "sortBy returns a new array and leaves the input as it was"
      "summarize counts each id once":
        uk: "summarize рахує кожен id один раз"
        en: "summarize counts each id once"
      "summarize adds up the field and counts missing values":
        uk: "summarize додає значення поля й рахує відсутні"
        en: "summarize adds up the field and counts missing values"
      "summarize of an empty list is all zeros":
        uk: "summarize порожнього списку — самі нулі"
        en: "summarize of an empty list is all zeros"
      "no function changes the list it gets":
        uk: "Жодна функція не змінює отриманого списку"
        en: "No function changes the list it gets"
    solutionNote:
      uk: "`searchByText` і `filterByStatus` — це `filter` з умовою, де поле береться через `record[field]`. `sortBy` сортує копію (`toSorted`) компаратором, який спершу повертає `0` для рівних, далі відправляє `null` у кінець, а тоді порівнює числа відніманням, а текст — через `localeCompare`; стабільність зберігає порядок рівних. `summarize` пам’ятає вже пораховані `id` у довіднику й пропускає повтори."
      en: "`searchByText` and `filterByStatus` are a `filter` with a condition that reads the field as `record[field]`. `sortBy` sorts a copy (`toSorted`) with a comparator that first returns `0` for equal values, then sends `null` to the end, and then compares numbers by subtraction and text with `localeCompare`; stability keeps the order of equal ones. `summarize` remembers the `id`s already counted in a lookup object and skips repeats."
    feedback:
      - when: { test: "sortBy puts null values last" }
        message:
          uk: "Записи з `null` у полі мають опинятися після всіх інших — і для чисел, і для тексту."
          en: "Records with `null` in the field must end up after all the others — for numbers and for text alike."
      - when: { test: "sortBy returns a new array and leaves the input as it was" }
        message:
          uk: "Вхідний список змінив порядок. Функція має повертати впорядковану **копію**."
          en: "The input list changed its order. The function must return a sorted **copy**."
      - when: { test: "summarize counts each id once" }
        message:
          uk: "Запис, що трапляється двічі, порахувався двічі. За умовою кожен `id` враховується лише раз."
          en: "A record that occurs twice was counted twice. By the task, every `id` counts only once."
      - when: { test: "searchByText ignores upper and lower case" }
        message:
          uk: "Запит великими літерами має знаходити назву, написану малими, і навпаки."
          en: "A query in capitals must find a name written in small letters, and the other way round."

  - id: cost-check
    kind: prediction
    prompt:
      uk: "Оціни вартість своїх функцій. Які твердження правильні? Обери всі."
      en: "Estimate the cost of your functions. Which statements are true? Choose all that are."
    answer:
      type: multi
      options:
        - id: search-linear
          text:
            uk: "`searchByText` перевіряє кожен запис один раз: удвічі більше записів — приблизно вдвічі більше роботи."
            en: "`searchByText` checks every record once: twice as many records means roughly twice the work."
        - id: sort-memory
          text:
            uk: "`sortBy` повертає новий масив, тож потребує додаткової пам’яті на стільки посилань, скільки є записів."
            en: "`sortBy` returns a new array, so it needs extra memory for as many references as there are records."
        - id: lookup-pays
          text:
            uk: "`pickByIds` окупається, коли шукаєш багато `id`: довідник коштує один прохід і пам’ять на кожен `id`, зате кожен пошук — один крок."
            en: "`pickByIds` pays off when you look up many `id`s: the lookup costs one pass and memory for every `id`, but then each search is one step."
        - id: summary-memory
          text:
            uk: "`summarize` з довідником побачених `id` потребує додаткової пам’яті, яка росте з кількістю різних `id`."
            en: "`summarize` with a lookup of the `id`s seen needs extra memory that grows with the number of different `id`s."
        - id: builtin-instant
          text:
            uk: "`filterByStatus` працює миттєво, бо `filter` — вбудований метод."
            en: "`filterByStatus` is instant because `filter` is a built-in method."
          why:
            uk: "Вбудовані методи теж перевіряють кожен елемент: робота росте разом зі списком."
            en: "Built-in methods also check every element: the work grows with the list."
        - id: index-for-one
          text:
            uk: "Для одного-єдиного пошуку вигідніше спершу збудувати довідник."
            en: "For a single search it is cheaper to build a lookup first."
          why:
            uk: "Побудова довідника вже проходить увесь список — це не менше роботи, ніж найгірший `find`. Довідник окупається лише на багатьох пошуках."
            en: "Building the lookup already walks the whole list — no less work than the worst `find`. A lookup pays off only over many searches."
        - id: chain-too-slow
          text:
            uk: "Ланцюжок `filter` → `toSorted` → `map` на 1000 записів надто повільний для сторінки."
            en: "A `filter` → `toSorted` → `map` chain over 1000 records is too slow for a page."
          why:
            uk: "Три проходи по тисячі записів — це частки мілісекунди. Тут зрозумілість важливіша."
            en: "Three passes over a thousand records take fractions of a millisecond. Clarity matters more here."
      correct: [search-linear, sort-memory, lookup-pays, summary-memory]
    explanation:
      uk: "Робота `searchByText` і `filterByStatus` росте лінійно — O(n): кожен запис перевіряється раз. `sortBy` робить трохи більше порівнянь, ніж за один прохід, і тримає новий масив на `n` посилань. `summarize` і `indexById` тримають довідник, тож пам’ять росте з кількістю різних `id`, зате повтори й пошуки обходяться в один крок. Довідник окупається, коли пошуків багато."
      en: "The work of `searchByText` and `filterByStatus` grows linearly — O(n): every record is checked once. `sortBy` makes a few more comparisons than one pass would and keeps a new array of `n` references. `summarize` and `indexById` keep a lookup, so memory grows with the number of different `id`s, but repeats and searches cost one step. A lookup pays off when there are many searches."

  - id: to-project
    kind: transfer
    capstoneStep: JS-05
    body:
      uk: "Наступний крок — твій проєкт. Ті самі пошук, фільтр, сортування й підсумок ти напишеш для свого домену й покажеш результати на сторінці."
      en: "The next step is your project. You will write the same search, filter, sort and summary for your domain and show the results on the page."
