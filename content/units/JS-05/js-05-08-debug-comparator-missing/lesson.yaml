id: js-05-08-debug-comparator-missing
unit: JS-05
title:
  uk: "Налагодження: булевий компаратор і відсутні записи"
  en: "Debug: boolean comparator and missing records"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Знайти й виправити компаратор, що повертає `true`/`false`, `reduce` без початкового значення, результат `find`, використаний без перевірки на відсутність, і повторений запис, порахований двічі."
    en: "Diagnose and repair a comparator that returns `true`/`false`, a `reduce` without an initial value, a `find` result used without a missing check and a duplicate record counted twice."
  - uk: "Показати крок обробки списку, на якому кожне неправильне значення з’являється вперше."
    en: "Point to the pipeline stage where each wrong value first appears."
prerequisites: [js-05-07-readable-chains]
subskills:
  - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: assess }
  - { family: J-05, skill: "sorting comparator and stable ordering", depth: assess }
glossary: []
selfCheck: [predict-bool, repair-report]

blocks:
  - id: quiet-bugs
    kind: explanation
    title:
      uk: "Помилки, які не завжди падають"
      en: "Bugs that do not always crash"
    body:
      uk: |
        У коді зі списками найчастіше трапляються чотири помилки:

        - **булевий компаратор**: `(a, b) => a.amountMinor > b.amountMinor` повертає `true` чи `false`, а не число;
        - **`reduce` без початкового значення**: на порожньому списку кидає `TypeError`;
        - **результат `find` без перевірки**: `list.find(...).label` падає, коли запису немає;
        - **повторений запис**: той самий запис у списку двічі, і підсумок рахує його двічі.

        Підступні вони тим, що на «зручних» даних усе працює: уже відсортований список булевий компаратор не псує, `reduce` без початкового значення справляється з непорожнім списком, а `find` — коли запис є. Тому перевіряй на незручних даних: порожній список, відсутній `id`, повтор, перемішаний порядок.
      en: |
        Four bugs show up most often in list code:

        - **a boolean comparator**: `(a, b) => a.amountMinor > b.amountMinor` returns `true` or `false`, not a number;
        - **`reduce` without an initial value**: it throws a `TypeError` on an empty list;
        - **a `find` result used without a check**: `list.find(...).label` crashes when the record is missing;
        - **a duplicated record**: the same record is in the list twice, and the summary counts it twice.

        They are sneaky because everything works on “convenient” data: a boolean comparator does not spoil a list that is already sorted, a `reduce` without an initial value copes with a non-empty list, and `find` works when the record is there. So test with inconvenient data: an empty list, a missing `id`, a duplicate, a shuffled order.

  - id: predict-bool
    kind: prediction
    prompt:
      uk: "Компаратор порівнює суми через `>`. Що виведе консоль у Chrome?"
      en: "The comparator compares amounts with `>`. What does the console show in Chrome?"
    code: |
      const amounts = [30000, 9990, 84550];
      const sorted = amounts.toSorted((a, b) => a > b);
      console.log(sorted);
    verify:
      logs: ["[30000, 9990, 84550]"]
    answer:
      type: choice
      options:
        - id: unchanged
          text:
            uk: "`[30000, 9990, 84550]` — порядок не змінився"
            en: "`[30000, 9990, 84550]` — the order did not change"
        - id: ascending
          text:
            uk: "`[9990, 30000, 84550]` — від меншої до більшої"
            en: "`[9990, 30000, 84550]` — from the smallest to the largest"
          why:
            uk: "Компаратор має повертати від’ємне число, коли `a` має йти раніше. `a > b` дає лише `true` (стає `1`) або `false` (стає `0`) і ніколи не каже «a раніше». У Chrome такий список так і лишається неупорядкованим."
            en: "A comparator must return a negative number when `a` should come first. `a > b` gives only `true` (becomes `1`) or `false` (becomes `0`) and never says “a first”. In Chrome such a list simply stays unsorted."
        - id: descending
          text:
            uk: "`[84550, 30000, 9990]` — від більшої до меншої"
            en: "`[84550, 30000, 9990]` — from the largest to the smallest"
          why:
            uk: "`true` і `false` не задають жодного напрямку сортування: вони стають `1` і `0`, а від’ємного числа немає зовсім."
            en: "`true` and `false` set no sort direction at all: they become `1` and `0`, and there is no negative number at all."
        - id: type-error
          text:
            uk: "`TypeError`: компаратор повернув не число"
            en: "`TypeError`: the comparator did not return a number"
          why:
            uk: "JavaScript не перевіряє тип: `true` і `false` мовчки стають `1` і `0`. Тому ця помилка тиха."
            en: "JavaScript does not check the type: `true` and `false` silently become `1` and `0`. That is why this bug is quiet."
      correct: [unchanged]
    explanation:
      uk: "`true` перетворюється на `1` («b раніше»), `false` — на `0` («рівні»). Від’ємного числа такий компаратор не повертає ніколи, тож сортування ніколи не дізнається, що `a` має йти раніше. Що саме вийде, залежить від браузера: стандарт для такого компаратора порядку не гарантує. У Chrome масив лишився як був, а на вже відсортованому списку помилку взагалі не видно."
      en: "`true` turns into `1` (“b first”), `false` into `0` (“equal”). Such a comparator never returns a negative number, so the sort never learns that `a` should come first. The exact result depends on the browser: the standard guarantees no order for such a comparator. In Chrome the array stayed as it was, and on a list that is already sorted the bug is invisible."

  - id: predict-which
    kind: prediction
    prompt:
      uk: "У списку повтор (`e-04` записано двічі), а `e-99` у ньому немає. Які рядки коду, позначені A–D, дадуть неправильний результат або помилку? Обери всі."
      en: "The list has a duplicate (`e-04` is recorded twice), and `e-99` is not in it. Which lines of code, marked A–D, give a wrong result or an error? Choose all that do."
    code: |
      const expenses = [
        { id: "e-05", amountMinor: 30000 },
        { id: "e-04", amountMinor: 9990 },
        { id: "e-04", amountMinor: 9990 },
      ];
      const byId = (id) => expenses.find((e) => e.id === id);

      // A: the total of different expenses
      console.log(expenses.reduce((sum, e) => sum + e.amountMinor, 0));
      // B: the total of an empty list
      console.log([].reduce((sum, amount) => sum + amount));
      // C: the amount of e-04, or 0
      console.log(byId("e-04")?.amountMinor ?? 0);
      // D: the amount of e-99
      console.log(byId("e-99").amountMinor);
    verify:
      logs: ["49980"]
      error: TypeError
    answer:
      type: multi
      options:
        - id: a
          text:
            uk: "A — сума різних витрат"
            en: "A — the total of different expenses"
        - id: b
          text:
            uk: "B — сума порожнього списку"
            en: "B — the total of an empty list"
        - id: c
          text:
            uk: "C — сума `e-04` або 0"
            en: "C — the amount of `e-04`, or 0"
          why:
            uk: "Тут усе гаразд: запис є, а `?.` і `??` лише страхують від його відсутності."
            en: "This one is fine: the record exists, and `?.` and `??` only guard against it being missing."
        - id: d
          text:
            uk: "D — сума `e-99`"
            en: "D — the amount of `e-99`"
      correct: [a, b, d]
    explanation:
      uk: "A рахує `e-04` двічі: `49980` замість `39990` — помилки немає, лише неправильне число. B кидає `TypeError`: порожній масив без початкового значення. До D програма вже не доходить, але й він кинув би `TypeError`: `find` повертає `undefined`, а в `undefined` немає `amountMinor`. C захищений: `?.` зупиняється на відсутньому записі, а `??` дає `0`."
      en: "A counts `e-04` twice: `49980` instead of `39990` — no error, just a wrong number. B throws a `TypeError`: an empty array without an initial value. The program never reaches D, but it would throw a `TypeError` too: `find` returns `undefined`, and `undefined` has no `amountMinor`. C is protected: `?.` stops at the missing record, and `??` gives `0`."

  - id: replay
    kind: example
    runtime: browser-js
    dir: replay
    entry: index.js
    expectError: true
    strings:
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      unknown: { uk: "невідома витрата", en: "unknown expense" }
    title:
      uk: "Чотири функції з підступом"
      en: "Four functions with a catch"
    body:
      uk: |
        Кожна функція виглядає правильно, і коментар над нею каже, що вона має робити. Запусти програму й порівняй кожен рядок консолі з коментарем.

        Програма зупиниться на першій помилці — так само, як у першому розділі.
      en: |
        Every function looks right, and the comment above it says what it should do. Run the program and compare every console line with the comment.

        The program stops at the first error — just as in the first unit.
    tryIt:
      uk: |
        1. Перевір перші рядки: чи відсортовано `id` за сумою? Чи дорівнює `uniqueTotal` сумі **різних** витрат (`124540`)?
        2. Програма зупинилася на `totalAmount([])`. Постав `//` на початку цього рядка коду й запусти знову: тепер видно наступну помилку — у `labelOf`.
      en: |
        1. Check the first lines: are the `id`s sorted by amount? Does `uniqueTotal` equal the total of **different** expenses (`124540`)?
        2. The program stopped at `totalAmount([])`. Put `//` at the start of that line of code and run again: now you can see the next error — in `labelOf`.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: порівняння і відсутні значення"
      en: "Recall: comparisons and missing values"
    items:
      - id: comparison-type
        from: js-01-04-booleans-null-undefined
        prompt:
          uk: "Що виведе цей рядок коду?"
          en: "What does this line of code print?"
        code: |
          console.log(84550 > 9990, typeof (84550 > 9990));
        verify:
          logs: ["true boolean"]
        answer:
          type: choice
          options:
            - id: boolean
              text:
                uk: "`true boolean`"
                en: "`true boolean`"
            - id: number
              text:
                uk: "`1 number`"
                en: "`1 number`"
              why:
                uk: "Порівняння дає булеве значення — `true` або `false`, а не число. Числом воно стає лише тоді, коли його використовують як число, як у компараторі."
                en: "A comparison gives a boolean — `true` or `false`, not a number. It becomes a number only when it is used as one, as in a comparator."
            - id: bigger
              text:
                uk: "`84550 number`"
                en: "`84550 number`"
              why:
                uk: "`>` не вибирає більше число — він відповідає «так» чи «ні»."
                en: "`>` does not pick the bigger number — it answers yes or no."
          correct: [boolean]
        explanation:
          uk: "Порівняння завжди дає `true` або `false`. Компаратору ж потрібне число зі знаком — тому `a > b` у ролі компаратора не працює."
          en: "A comparison always gives `true` or `false`. A comparator needs a signed number — which is why `a > b` does not work as a comparator."
      - id: optional-missing
        from: js-02-04-nullish-optional-chaining
        prompt:
          uk: "Запису не знайшлося: `found` дорівнює `undefined`. Що виведуть ці рядки коду?"
          en: "The record was not found: `found` is `undefined`. What do these lines of code print?"
        code: |
          const found = undefined;
          console.log(found?.label);
          console.log(found?.label ?? "—");
        verify:
          logs: ["undefined", "—"]
        answer:
          type: choice
          options:
            - id: undefined-then-dash
              text:
                uk: "`undefined`, потім `—`"
                en: "`undefined`, then `—`"
            - id: error
              text:
                uk: "Помилку `TypeError`"
                en: "A `TypeError`"
              why:
                uk: "`?.` зупиняється, якщо ліворуч `undefined` чи `null`, і повертає `undefined` замість помилки."
                en: "`?.` stops when the left side is `undefined` or `null` and returns `undefined` instead of an error."
            - id: dash-twice
              text:
                uk: "`—` двічі"
                en: "`—` twice"
              why:
                uk: "`?.` сам дає `undefined`. Запасне значення підставляє лише `??`."
                en: "`?.` on its own gives `undefined`. Only `??` puts in a fallback value."
          correct: [undefined-then-dash]
        explanation:
          uk: "`found?.label` не падає на відсутньому записі, а дає `undefined`. `??` замінює цей `undefined` запасним значенням. Разом вони перетворюють «запису немає» на зрозумілу відповідь."
          en: "`found?.label` does not crash on a missing record; it gives `undefined`. `??` replaces that `undefined` with a fallback. Together they turn “there is no record” into a clear answer."

  - id: failing-pipeline
    kind: visual
    visual: pipeline
    title:
      uk: "Де з’являється неправильне значення"
      en: "Where the wrong value appears"
    textEquivalent:
      uk: "На вході чотири витрати: e-05 (30000), e-04 (9990), e-01 (84550) і ще раз e-04 (9990) — повтор. Етап 1: сортування з компаратором byAmount, який повертає a.amountMinor > b.amountMinor, тобто true або false. Від’ємного числа немає, тож сортування не дізнається, що меншу суму треба ставити раніше, і тут, як і в Chrome, список виходить у тому самому порядку: e-05, e-04, e-01, e-04 (інший браузер може переставити інакше: стандарт для такого компаратора порядку не гарантує). Це перше місце, де значення неправильне: порядок мав би бути e-04, e-04, e-05, e-01. Етап 2: reduce з початковим значенням 0 додає суми: 30000, 39990, 124540, 134530. Підсумок 134530 завеликий, бо e-04 додано двічі; сума різних витрат — 124540. Неправильне значення тут з’являється ще у вхідних даних: повтор треба прибирати до підсумку."
      en: "The input is four expenses: e-05 (30000), e-04 (9990), e-01 (84550) and e-04 (9990) again — a duplicate. Stage 1: a sort with the byAmount comparator, which returns a.amountMinor > b.amountMinor, that is true or false. There is no negative number, so the sort never learns that a smaller amount should come first, and here, as in Chrome, the list comes out in the same order: e-05, e-04, e-01, e-04 (another browser may reorder it differently: the standard guarantees no order for such a comparator). That is the first place where a value is wrong: the order should be e-04, e-04, e-05, e-01. Stage 2: reduce with the initial value 0 adds the amounts: 30000, 39990, 124540, 134530. The total 134530 is too big because e-04 was added twice; the total of different expenses is 124540. Here the wrong value is already in the input data: the duplicate has to be removed before summing."
    spec:
      code: |
        const byAmount = (a, b) =>
          a.amountMinor > b.amountMinor;
        const addAmount = (sum, e) =>
          sum + e.amountMinor;
        const sorted = expenses.toSorted(byAmount);
        const total = sorted.reduce(addAmount, 0);
      input:
        label: { uk: "expenses — з повтором e-04", en: "expenses — with e-04 twice" }
        items:
          - { id: "e-05", amountMinor: 30000 }
          - { id: "e-04", amountMinor: 9990 }
          - { id: "e-01", amountMinor: 84550 }
          - { id: "e-04", amountMinor: 9990 }
        show: "item => item.id + ' · ' + item.amountMinor"
        caption:
          uk: "Чотири витрати, і `e-04` серед них двічі. Хочемо: від меншої суми до більшої й підсумок різних витрат."
          en: "Four expenses, with `e-04` among them twice. We want: from the smallest amount to the largest, and the total of different expenses."
      stages:
        - op: sort
          fn: "(a, b) => a.amountMinor > b.amountMinor"
          label: "byAmount"
          caption:
            uk: "`byAmount` повертає `true` або `false`, тобто `1` або `0`. Від’ємного числа немає, тож «менша сума — раніше» не прозвучить ніколи. Тут, як і в Chrome, список вийшов у тому самому порядку: `e-05` (30000) досі перед `e-04` (9990). **Тут уперше з’явилося неправильне значення** — порядок."
            en: "`byAmount` returns `true` or `false`, that is `1` or `0`. There is no negative number, so “the smaller amount first” is never said. Here, as in Chrome, the list came out in the same order: `e-05` (30000) is still ahead of `e-04` (9990). **This is where the first wrong value appears** — the order."
        - op: reduce
          fn: "(sum, e) => sum + e.amountMinor"
          initial: 0
          perItem: true
          caption:
            uk: "Крок {index} з {count}: додаємо `{item}` → **{acc}**."
            en: "Step {index} of {count}: add `{item}` → **{acc}**."
          summary:
            uk: "Підсумок `134530` завеликий: `e-04` додано двічі, а сума різних витрат — `124540`. Сам `reduce` тут правильний: неправильне значення було вже **у вхідних даних**, тож повтор треба прибрати до підсумку."
            en: "The total `134530` is too big: `e-04` was added twice, and the total of different expenses is `124540`. The `reduce` itself is correct here: the wrong value was already **in the input data**, so the duplicate has to be removed before summing."
      result:
        label: { uk: "підсумок з повтором", en: "the total with the duplicate" }

  - id: first-wrong-stage
    kind: explanation
    title:
      uk: "Де значення вперше стає неправильним"
      en: "Where a value first goes wrong"
    body:
      uk: |
        Не виправляй навмання. Знайди **перший** крок, після якого значення вже неправильне, і виправляй саме його:

        | Симптом | Де шукати | Що змінити |
        |---|---|---|
        | порядок «не сортується» | компаратор | повертати число зі знаком, наприклад `a.price - b.price` для цін |
        | `Reduce of empty array with no initial value` | `reduce` | дати початкове значення: `reduce(…, 0)` |
        | `Cannot read properties of undefined` | результат `find` | перевірити відсутність: `?.` і `??` або `if` |
        | підсумок завеликий | вхідні дані | пропускати повтори за `id`, не чіпаючи самих даних |

        Щоб побачити проміжні значення, розклади ланцюжок на кроки й виведи кожен у консоль, як у попередньому уроці.
      en: |
        Do not fix at random. Find the **first** step after which a value is already wrong, and fix exactly that step:

        | Symptom | Where to look | What to change |
        |---|---|---|
        | the order “does not sort” | the comparator | return a signed number, for example `a.price - b.price` for prices |
        | `Reduce of empty array with no initial value` | `reduce` | give an initial value: `reduce(…, 0)` |
        | `Cannot read properties of undefined` | the `find` result | check for a missing record: `?.` and `??`, or an `if` |
        | the total is too big | the input data | skip repeated `id`s without touching the data itself |

        To see the intermediate values, break the chain into steps and print each one, as in the previous lesson.

  - id: repair-report
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: repair-report
    entry: index.js
    strings:
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      unknown: { uk: "невідома витрата", en: "unknown expense" }
    title:
      uk: "Полагодь звіт про витрати"
      en: "Repair the expense report"
    instructions:
      uk: |
        У цих чотирьох функціях по одній помилці. Коментар над кожною функцією описує, що вона **має** робити. Знайди, де значення вперше стає неправильним, і виправ функцію так, щоб вона робила те, що обіцяє коментар.

        Дані в списку `expenses` не змінюй: повтор `e-04` там навмисно — функції мають давати раду таким даним.
      en: |
        Each of these four functions has one bug. The comment above each function describes what it **should** do. Find where a value first goes wrong and repair the function so that it does what the comment promises.

        Do not change the data in the `expenses` list: the duplicate `e-04` is there on purpose — the functions must cope with such data.
    testTitles:
      "the program runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without an error"
      "sortByAmount puts the smallest amount first":
        uk: "sortByAmount ставить найменшу суму першою"
        en: "sortByAmount puts the smallest amount first"
      "sortByAmount leaves the list itself unchanged":
        uk: "sortByAmount не змінює сам список"
        en: "sortByAmount leaves the list itself unchanged"
      "totalAmount adds up all amounts":
        uk: "totalAmount додає всі суми"
        en: "totalAmount adds up all amounts"
      "totalAmount of an empty list is 0":
        uk: "totalAmount порожнього списку дорівнює 0"
        en: "totalAmount of an empty list is 0"
      "labelOf returns the label of a known id":
        uk: "labelOf повертає назву для наявного id"
        en: "labelOf returns the label of a known id"
      "labelOf returns the unknown text for a missing id":
        uk: "labelOf повертає «невідома витрата» для відсутнього id"
        en: "labelOf returns “unknown expense” for a missing id"
      "uniqueTotal counts a repeated expense once":
        uk: "uniqueTotal рахує повторену витрату один раз"
        en: "uniqueTotal counts a repeated expense once"
      "uniqueTotal of an empty list is 0":
        uk: "uniqueTotal порожнього списку дорівнює 0"
        en: "uniqueTotal of an empty list is 0"
    hints:
      nudge:
        uk: "Запусти програму й прочитай першу помилку. Потім порівняй кожен рядок консолі з коментарем над відповідною функцією."
        en: "Run the program and read the first error. Then compare every console line with the comment above the matching function."
      explanation:
        uk: "По одній помилці на функцію: компаратор повертає булеве значення замість числа; `reduce` не має початкового значення; результат `find` використано без перевірки на `undefined`; `uniqueTotal` не пропускає повторені `id`. Для повторів знадобиться довідник уже порахованих `id` з уроку про вартість пошуку."
        en: "One bug per function: the comparator returns a boolean instead of a number; `reduce` has no initial value; the `find` result is used without checking for `undefined`; `uniqueTotal` does not skip repeated `id`s. For the repeats you need a lookup object of the `id`s already counted, from the lesson about the cost of searching."
    solutionNote:
      uk: "Компаратор тепер повертає різницю сум — від’ємне число означає «a раніше». `reduce(…, 0)` має з чого почати навіть на порожньому списку. `?.label ?? …` перетворює відсутній запис на зрозумілу відповідь. `uniqueTotal` пам’ятає вже пораховані `id` і пропускає повтори, тож дані можна лишити такими, як вони є."
      en: "The comparator now returns the difference of the amounts — a negative number means “a first”. `reduce(…, 0)` has a starting point even on an empty list. `?.label ?? …` turns a missing record into a clear answer. `uniqueTotal` remembers the `id`s already counted and skips repeats, so the data can stay as it is."
    feedback:
      - when: { error: TypeError }
        message:
          uk: "Прочитай оригінальне повідомлення `TypeError`. «Reduce of empty array with no initial value» вказує на `reduce` без початкового значення; «Cannot read properties of undefined» — на результат `find`, використаний без перевірки, що запис знайшовся."
          en: "Read the original `TypeError` message. “Reduce of empty array with no initial value” points at a `reduce` without an initial value; “Cannot read properties of undefined” points at a `find` result used without checking that a record was found."
      - when: { test: "the program runs without an error" }
        message:
          uk: "Ця перевірка чекає, що вся програма виконається без помилки, разом із викликами `totalAmount([])` і `labelOf(expenses, \"e-99\")` унизу. Якщо програма зупиняється, прочитай назву й повідомлення помилки: вона вказує на функцію, яку ще треба полагодити. Рядки з викликами не видаляй і не закоментовуй."
          en: "This check expects the whole program to run without an error, including the calls `totalAmount([])` and `labelOf(expenses, \"e-99\")` at the bottom. If the program stops, read the error’s name and message: it points at the function still to repair. Do not delete or comment out the lines with the calls."
      - when: { test: "sortByAmount puts the smallest amount first" }
        message:
          uk: "Ця перевірка чекає витрати від меншої суми до більшої: `e-04`, `e-04`, `e-05`, `e-01`. Якщо порядок не змінився, компаратор не каже «a раніше»: йому потрібне від’ємне число, коли `a` має йти першою, а `true`/`false` дають лише `1` і `0`."
          en: "This check expects the expenses from the smallest amount to the largest: `e-04`, `e-04`, `e-05`, `e-01`. If the order did not change, the comparator never says “a first”: it needs a negative number when `a` should come first, while `true`/`false` only give `1` and `0`."
      - when: { test: "sortByAmount leaves the list itself unchanged" }
        message:
          uk: "Ця перевірка порівнює порядок списку до й після виклику `sortByAmount`: він має лишитися тим самим. Якщо порядок змінився, сортування йде на місці (`sort`) — сортуй копію."
          en: "This check compares the order of the list before and after calling `sortByAmount`: it must stay the same. If the order changed, the sort works in place (`sort`) — sort a copy."
      - when: { test: "totalAmount adds up all amounts" }
        message:
          uk: "Ця перевірка дає чотири витрати (з повтором `e-04`) і чекає суму всіх чотирьох — `134530`: `totalAmount` рахує все, а повтори пропускає лише `uniqueTotal`."
          en: "This check passes four expenses (with `e-04` twice) and expects the total of all four — `134530`: `totalAmount` counts everything, and only `uniqueTotal` skips repeats."
      - when: { test: "totalAmount of an empty list is 0" }
        message:
          uk: "Ця перевірка викликає `totalAmount([])` і чекає `0`. Якщо бачиш `TypeError: Reduce of empty array with no initial value`, у `reduce` бракує початкового значення: без нього на порожньому списку немає з чого почати."
          en: "This check calls `totalAmount([])` and expects `0`. If you see `TypeError: Reduce of empty array with no initial value`, `reduce` is missing its initial value: without it there is nothing to start from on an empty list."
      - when: { test: "labelOf returns the label of a known id" }
        message:
          uk: "Ця перевірка шукає `e-01` і чекає її назву — «Продукти на тиждень»."
          en: "This check looks for `e-01` and expects its label — “Weekly groceries”."
      - when: { test: "labelOf returns the unknown text for a missing id" }
        message:
          uk: "Ця перевірка шукає `e-99`, якого немає, і чекає текст «невідома витрата» з коментаря над функцією. Якщо бачиш `TypeError: Cannot read properties of undefined (reading 'label')`, назву читають у `undefined` — у результаті `find`, який нічого не знайшов; якщо `undefined`, відсутній запис уже не ламає програму, але запасного тексту ще немає: його підставляє `??`."
          en: "This check looks for `e-99`, which is not there, and expects the text “unknown expense” from the comment above the function. If you see `TypeError: Cannot read properties of undefined (reading 'label')`, the label is read from `undefined` — from a `find` result that found nothing; if `undefined`, the missing record no longer crashes the program, but the fallback text is still missing: `??` puts it in."
      - when: { test: "uniqueTotal counts a repeated expense once" }
        message:
          uk: "Ця перевірка дає список, де `e-04` записано двічі, і чекає `124540` — суму різних витрат, де кожен `id` враховано лише раз. Якщо прийшло `134530`, повтор пораховано двічі: запам’ятовуй уже додані `id` у довіднику й пропускай повтори. Видаляти повтор із даних не треба: функція має давати раду таким спискам сама."
          en: "This check passes a list in which `e-04` is recorded twice and expects `124540` — the total of different expenses, each `id` counted once. If `134530` came back, the repeat was counted twice: remember the `id`s already added in a lookup object and skip repeats. Do not delete the duplicate from the data: the function must cope with such lists by itself."
      - when: { test: "uniqueTotal of an empty list is 0" }
        message:
          uk: "Ця перевірка викликає `uniqueTotal([])` і чекає `0`. Якщо бачиш `TypeError: Reduce of empty array with no initial value`, у `reduce` бракує початкового значення."
          en: "This check calls `uniqueTotal([])` and expects `0`. If you see `TypeError: Reduce of empty array with no initial value`, `reduce` is missing its initial value."

