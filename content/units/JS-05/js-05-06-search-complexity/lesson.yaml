id: js-05-06-search-complexity
unit: JS-05
title:
  uk: "Пошук і вартість роботи"
  en: "Searching and the cost of work"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Порахувати, скільки порівнянь робить лінійний пошук у найкращому й найгіршому випадку, і описати, як ця кількість росте разом із розміром списку."
    en: "Count the comparisons a linear search makes in the best and the worst case, and describe how that count grows with the list size."
  - uk: "Замінити повторний лінійний пошук об’єктом-довідником, збудованим один раз, і назвати додаткову пам’ять, якої він потребує."
    en: "Replace a repeated linear search with a lookup object built once, and state the extra memory it costs."
prerequisites: [js-05-02-filter-find, js-04-04-break-continue-nested, js-04-05-objects-properties]
subskills:
  - { family: J-05, skill: "search and complexity", depth: intro }
glossary: [linear-search, time-complexity, space-complexity, lookup-table]
selfCheck: [predict-count, duplicates]

blocks:
  - id: one-by-one
    kind: explanation
    title:
      uk: "find шукає по одному"
      en: "find looks one by one"
    body:
      uk: |
        `find` не знає наперед, де лежить потрібний запис. Він перевіряє записи **по одному від початку**, доки не знайде збіг. Такий пошук називають [[linear-search|лінійним]].

        Скільки це роботи? Порахуймо порівняння в списку з `n` записів:

        | Де шуканий запис | Порівнянь |
        |---|---|
        | перший | 1 |
        | останній | `n` |
        | його немає | `n`: щоб сказати «немає», треба перевірити всі |

        Коли список подвоюється, найгірший випадок теж подвоюється. Кажуть, що робота росте **лінійно**, і записують це як O(n). Так описують [[time-complexity|часову складність]]: не секунди, а те, як росте кількість кроків.
      en: |
        `find` does not know in advance where the record is. It checks the records **one by one from the start** until it finds a match. Such a search is called a [[linear-search|linear search]].

        How much work is that? Let us count the comparisons in a list of `n` records:

        | Where the record is | Comparisons |
        |---|---|
        | first | 1 |
        | last | `n` |
        | not there | `n`: to say “not there”, every record must be checked |

        When the list doubles, the worst case doubles too. We say the work grows **linearly** and write it as O(n). That is how [[time-complexity|time complexity]] is described: not in seconds, but in how the number of steps grows.

  - id: predict-count
    kind: prediction
    prompt:
      uk: "У списку 1000 звичок з `id` від `h-1` до `h-1000`. Функція всередині `find` рахує свої виклики. Скільки порівнянь буде в кожному з трьох пошуків?"
      en: "The list holds 1000 habits with `id`s from `h-1` to `h-1000`. The function inside `find` counts its calls. How many comparisons does each of the three searches make?"
    code: |
      const habits = [];
      for (let i = 1; i <= 1000; i++) {
        habits.push({ id: "h-" + i });
      }

      let comparisons = 0;
      const findById = (id) =>
        habits.find((habit) => {
          comparisons = comparisons + 1;
          return habit.id === id;
        });

      findById("h-1");
      console.log(comparisons);
      comparisons = 0;
      findById("h-1000");
      console.log(comparisons);
      comparisons = 0;
      findById("h-5000");
      console.log(comparisons);
    verify:
      logs: ["1", "1000", "1000"]
    answer:
      type: choice
      options:
        - id: linear
          text:
            uk: "`1`, `1000`, `1000`"
            en: "`1`, `1000`, `1000`"
        - id: instant
          text:
            uk: "`1`, `1`, `1`"
            en: "`1`, `1`, `1`"
          why:
            uk: "`find` — вбудований метод, але не чарівний: він так само перевіряє записи по одному. Щоб дійти до тисячного, потрібна тисяча перевірок."
            en: "`find` is a built-in method, but not a magic one: it still checks the records one by one. Reaching the thousandth one takes a thousand checks."
        - id: missing-free
          text:
            uk: "`1`, `1000`, `0`"
            en: "`1`, `1000`, `0`"
          why:
            uk: "Щоб відповісти «такого немає», `find` мусить перевірити всі 1000 записів: раптом потрібний саме останній."
            en: "To answer “not there”, `find` must check all 1000 records: the one it needs might be the very last."
        - id: middle
          text:
            uk: "`1`, `500`, `1000`"
            en: "`1`, `500`, `1000`"
          why:
            uk: "`find` не стрибає в середину списку: він іде від початку. Тисячний запис — тисячна перевірка."
            en: "`find` does not jump into the middle of the list: it starts from the beginning. The thousandth record is the thousandth check."
      correct: [linear]
    explanation:
      uk: "Перший запис знаходиться з першої перевірки. До останнього `find` іде через усі 1000. А `h-5000` у списку немає — і щоб це з’ясувати, теж потрібні всі 1000 перевірок. Найгірший випадок росте разом зі списком."
      en: "The first record is found on the first check. To reach the last one, `find` goes through all 1000. And `h-5000` is not in the list — finding that out also takes all 1000 checks. The worst case grows with the list."

  - id: count-trace
    kind: visual
    visual: code-trace
    title:
      uk: "Лічильник порівнянь і об’єкт-довідник"
      en: "A comparison counter and a lookup object"
    textEquivalent:
      uk: "У списку habits чотири записи: h-01, h-02, h-03 і h-04. Змінна comparisons рахує, скільки разів функція всередині find порівнювала id. Пошук h-01 закінчується на першій перевірці: comparisons дорівнює 1. Пошук h-04 перевіряє h-01, h-02, h-03 і нарешті h-04 — ще 4 порівняння, разом 5. Пошук h-99 перевіряє всі чотири записи, не знаходить нічого й повертає undefined — ще 4 порівняння, разом 9. Потім програма один раз будує об’єкт-довідник byId: цикл проходить список і записує кожну звичку під її id — 4 кроки й пам’ять на 4 записи. Після цього byId[\"h-04\"] дає запис за один крок, без жодного порівняння, і лічильник лишається 9. Консоль показує: 9 h-04."
      en: "The habits list holds four records: h-01, h-02, h-03 and h-04. The comparisons variable counts how many times the function inside find compared an id. The search for h-01 ends on the first check: comparisons is 1. The search for h-04 checks h-01, h-02, h-03 and finally h-04 — 4 more comparisons, 5 in total. The search for h-99 checks all four records, finds nothing and returns undefined — 4 more comparisons, 9 in total. Then the program builds the lookup object byId once: a loop walks the list and stores each habit under its id — 4 steps and memory for 4 entries. After that, byId[\"h-04\"] gives the record in one step, without a single comparison, and the counter stays at 9. The console shows: 9 h-04."
    spec:
      file: visuals/lookup.js
      steps: captioned
      captions:
        - at: { line: 15 }
          text:
            uk: "Перший пошук: `h-01` — це перший запис списку. Подивись на `comparisons` у змінних: поки що `0`."
            en: "First search: `h-01` is the first record in the list. Watch `comparisons` among the variables: it is `0` so far."
        - at: { line: 12, kind: return, hit: 1 }
          text:
            uk: "`habit` — це `h-01`, і `id` збігається: `true` з першої ж перевірки. `comparisons` — `1`. Найкращий випадок."
            en: "`habit` is `h-01`, and the `id` matches: `true` on the very first check. `comparisons` is `1`. The best case."
        - at: { line: 16 }
          text:
            uk: "Другий пошук: `h-04` — останній запис. `find` знову починає з початку списку."
            en: "Second search: `h-04` is the last record. `find` starts from the beginning of the list again."
        - at: { line: 12, kind: return, hit: 2 }
          text:
            uk: "`h-01` — не те, `false`. `find` іде далі, а лічильник росте з кожною перевіркою."
            en: "`h-01` is not it — `false`. `find` moves on, and the counter grows with every check."
        - at: { line: 12, kind: return, hit: 5 }
          text:
            uk: "Четверта перевірка — `true`. Щоб дійти до останнього запису, знадобилося 4 порівняння: `comparisons` тепер `5`."
            en: "The fourth check — `true`. Reaching the last record took 4 comparisons: `comparisons` is now `5`."
        - at: { line: 17 }
          text:
            uk: "Третій пошук: `h-99`, якого в списку немає."
            en: "Third search: `h-99`, which is not in the list."
        - at: { line: 12, kind: return, hit: 9 }
          text:
            uk: "Перевірено всі чотири записи — збігу немає, `find` поверне `undefined`. Щоб сказати «немає», знадобилося ще 4 порівняння: `comparisons` — `9`."
            en: "All four records checked — no match, `find` will return `undefined`. Saying “not there” took 4 more comparisons: `comparisons` is `9`."
        - at: { line: 19 }
          text:
            uk: "Інший підхід: один раз будуємо об’єкт-довідник `byId`, де кожна звичка лежить під своїм `id`."
            en: "Another approach: build the lookup object `byId` once, with every habit stored under its `id`."
        - at: { line: 21, hit: 4 }
          text:
            uk: "Четвертий, останній крок циклу: зараз `h-04` ляже в `byId` під своїм `id`. Порівнянь тут немає — лише запис в об’єкт."
            en: "The fourth and last step of the loop: now `h-04` goes into `byId` under its `id`. There are no comparisons here — only a write into the object."
        - at: { line: 23 }
          text:
            uk: "Цикл пройшов список один раз — 4 кроки, і тепер у `byId` 4 ключі: це ціна довідника в пам’яті (подивись на нього в панелі «Heap (об’єкти)»). Тепер пошук — один крок: `byId[\"h-04\"]`. Жодного порівняння, `comparisons` лишається `9`."
            en: "The loop walked the list once — 4 steps, and now `byId` holds 4 keys: that is the lookup object’s price in memory (look at it in the “Heap (objects)” panel). Now a lookup is one step: `byId[\"h-04\"]`. Not a single comparison; `comparisons` stays at `9`."
        - at: { line: 24 }
          text:
            uk: "`found` вказує на той самий об’єкт, що й у списку `habits` (той самий номер у панелі «Heap (об’єкти)»). Довідник не копіює записи — лише тримає посилання на них."
            en: "`found` points at the same object as in the `habits` list (the same number in the “Heap (objects)” panel). The lookup object does not copy records — it only holds references to them."
        - at: { line: 24, kind: end }
          text:
            uk: "Консоль: `9 h-04`. Три лінійні пошуки коштували 9 порівнянь, а пошук у довіднику — жодного, після одноразової побудови."
            en: "The console: `9 h-04`. Three linear searches cost 9 comparisons, while the lookup cost none after the one-time build."

  - id: count-work
    kind: example
    runtime: browser-js
    dir: count-work
    entry: index.js
    strings:
      records: { uk: "записів →", en: "records →" }
      comparisons: { uk: "порівнянь", en: "comparisons" }
    title:
      uk: "Скільки коштує пошук"
      en: "What a search costs"
    body:
      uk: |
        Програма шукає **останній** запис у списках із 10, 100 і 1000 звичок, а потім робить 100 пошуків у списку з 1000. Запусти й подивись, як росте кількість порівнянь.
      en: |
        The program looks for the **last** record in lists of 10, 100 and 1000 habits, and then makes 100 searches in a list of 1000. Run it and watch how the number of comparisons grows.
    tryIt:
      uk: |
        Збудуй довідник один раз і повтори ті самі 100 пошуків через нього. Допиши в кінець:

        ```js
        const byId = {};
        for (const habit of big) {
          byId[habit.id] = habit;
        }
        const picked = [];
        for (let i = 1; i <= 100; i++) {
          picked.push(byId["h-" + i * 10]);
        }
        console.log(picked.length, big.length + picked.length);
        ```

        Перше число — скільки звичок знайдено (100), друге — кроки: 1000 на побудову й 100 на пошуки. Порівняй 1100 із числом порівнянь для `100 × find`.
      en: |
        Build a lookup object once and repeat the same 100 searches with it. Add at the end:

        ```js
        const byId = {};
        for (const habit of big) {
          byId[habit.id] = habit;
        }
        const picked = [];
        for (let i = 1; i <= 100; i++) {
          picked.push(byId["h-" + i * 10]);
        }
        console.log(picked.length, big.length + picked.length);
        ```

        The first number is how many habits were found (100), the second is the steps: 1000 to build and 100 to look up. Compare 1100 with the number of comparisons for `100 × find`.

  - id: recall-nested
    kind: review
    title:
      uk: "Пригадай: вкладені цикли"
      en: "Recall: nested loops"
    items:
      - id: nested-steps
        from: js-04-04-break-continue-nested
        prompt:
          uk: "Скільки разів виконається тіло внутрішнього циклу? Впиши число, яке виведе консоль."
          en: "How many times does the body of the inner loop run? Type the number the console prints."
        code: |
          let steps = 0;
          for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 4; j++) {
              steps = steps + 1;
            }
          }
          console.log(steps);
        verify:
          logs: ["12"]
        answer:
          type: text
          accept: ["12"]
          placeholder: { uk: "число", en: "a number" }
        explanation:
          uk: "Внутрішній цикл проходить усі свої 4 кроки на **кожному** з 3 кроків зовнішнього: 3 × 4 = 12. Вкладені цикли множать роботу: якщо обидва проходять список з `n` записів, кроків буде `n × n`."
          en: "The inner loop runs all its 4 steps on **every** one of the 3 steps of the outer loop: 3 × 4 = 12. Nested loops multiply the work: if both walk a list of `n` records, there are `n × n` steps."

  - id: lookup-object
    kind: explanation
    title:
      uk: "Довідник: заплатити раз, шукати швидко"
      en: "A lookup object: pay once, search fast"
    body:
      uk: |
        Якщо шукати за `id` доводиться багато разів, збудуй [[lookup-table|об’єкт-довідник]] один раз:

        ```js
        const byId = {};
        for (const habit of habits) {
          byId[habit.id] = habit;
        }
        const found = byId["h-04"];
        ```

        Якщо якийсь `id` трапиться у списку двічі, цей цикл перезапише ключ, і в довіднику лишиться останній запис із цим `id`.

        Ціна: один прохід списком (`n` кроків) і пам’ять на `n` ключів — це вже [[space-complexity|просторова складність]]. Зате далі кожен пошук займає один крок незалежно від розміру списку: O(1). Для одного пошуку довідник не окупиться, а для сотні — безумовно.

        Те саме з дублікатами. Порівняти кожен запис із кожним — це вкладені цикли, близько `n × n` порівнянь, тобто O(n²). Один прохід із довідником уже побачених `id` — лише `n` кроків.

        > [!tip]
        > Чи є ключ у довіднику, перевіряй через `Object.hasOwn(seen, id)`: оператор `in` бачить і успадковані ключі на зразок `"toString"`.
      en: |
        If you have to search by `id` many times, build a [[lookup-table|lookup object]] once:

        ```js
        const byId = {};
        for (const habit of habits) {
          byId[habit.id] = habit;
        }
        const found = byId["h-04"];
        ```

        If some `id` occurs in the list twice, this loop overwrites the key, and the lookup object keeps the last record with that `id`.

        The price: one pass over the list (`n` steps) and memory for `n` keys — that is [[space-complexity|space complexity]]. In return, every later lookup takes one step whatever the size of the list: O(1). For a single search the lookup object does not pay off; for a hundred it certainly does.

        The same goes for duplicates. Comparing every record with every other one means nested loops, about `n × n` comparisons, that is O(n²). One pass with a lookup object of the `id`s seen so far takes only `n` steps.

        > [!tip]
        > To check whether a key is in the lookup object, use `Object.hasOwn(seen, id)`: the `in` operator also sees inherited keys such as `"toString"`.

  - id: duplicates
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: duplicates
    entry: index.js
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      read: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
    title:
      uk: "Дублікати двома способами"
      en: "Duplicates in two ways"
    instructions:
      uk: |
        Звичку `h-02` випадково додали двічі. Напиши дві версії перевірки на дублікати. Обидві повертають `true`, якщо якийсь `id` трапляється в списку більше одного разу, і `false`, якщо всі `id` різні:

        1. `hasDuplicateIdsNested(list)` — порівнюй кожну пару записів двома вкладеними циклами.
        2. `hasDuplicateIdsLookup(list)` — один прохід списком із об’єктом-довідником уже побачених `id`. Чи є `id` у довіднику, перевіряй через `Object.hasOwn`.

        У кожній версії збільшуй `comparisons` на 1 при кожній перевірці. Запусти й порівняй, скільки роботи зробила кожна.
      en: |
        Habit `h-02` was added twice by mistake. Write two versions of a duplicate check. Both return `true` if some `id` occurs in the list more than once, and `false` if all `id`s are different:

        1. `hasDuplicateIdsNested(list)` — compare every pair of records with two nested loops.
        2. `hasDuplicateIdsLookup(list)` — one pass over the list with a lookup object of the `id`s seen so far. Check whether an `id` is in the lookup object with `Object.hasOwn`.

        In each version, add 1 to `comparisons` on every check. Run it and compare how much work each version did.
    testTitles:
      "nested version finds a repeated id":
        uk: "Версія з вкладеними циклами знаходить повторений id"
        en: "The nested version finds a repeated id"
      "nested version says false when all ids differ":
        uk: "Версія з вкладеними циклами дає false, коли всі id різні"
        en: "The nested version says false when all ids differ"
      "nested version: an empty list has no duplicates":
        uk: "Версія з вкладеними циклами: у порожньому списку дублікатів немає"
        en: "The nested version: an empty list has no duplicates"
      "lookup version finds a repeated id":
        uk: "Версія з довідником знаходить повторений id"
        en: "The lookup version finds a repeated id"
      "lookup version says false when all ids differ":
        uk: "Версія з довідником дає false, коли всі id різні"
        en: "The lookup version says false when all ids differ"
      "lookup version: an empty list has no duplicates":
        uk: "Версія з довідником: у порожньому списку дублікатів немає"
        en: "The lookup version: an empty list has no duplicates"
      "an id such as toString is not taken for a duplicate":
        uk: "id на зразок toString не вважається дублікатом"
        en: "An id such as toString is not taken for a duplicate"
      "lookup version reads each id only a few times":
        uk: "Версія з довідником читає кожен id лише кілька разів"
        en: "The lookup version reads each id only a few times"
    hints:
      nudge:
        uk: "Для першої версії згадай вкладені цикли з JS-04: зовнішній бере запис, внутрішній порівнює його з усіма **наступними**."
        en: "For the first version, recall nested loops from JS-04: the outer one takes a record, the inner one compares it with all the **following** ones."
      explanation:
        uk: "Вкладена версія: кожну пару досить перевірити один раз, і запис не треба порівнювати із собою, тож внутрішній цикл починає з місця одразу за зовнішнім. Версія з довідником працює, як охоронець зі списком гостей: перш ніж вписати нове прізвище, він дивиться, чи воно там уже є. Так само для кожного запису спершу перевір через `Object.hasOwn`, чи є його `id` серед уже побачених: якщо є — це дублікат, якщо ні — запам’ятай цей `id` у довіднику й іди далі."
        en: "Nested version: every pair needs checking only once, and no record should be compared with itself, so the inner loop starts right after the outer one. The lookup version works like a doorkeeper with a guest list: before writing down a new surname, they look whether it is already there. In the same way, for every record first check with `Object.hasOwn` whether its `id` is among the ones already seen: if it is, that is a duplicate; if not, remember this `id` in the lookup object and move on."
    solutionNote:
      uk: "Вкладені цикли перевіряють до `n × (n − 1) / 2` пар — O(n²): на списку з 1000 різних `id` це 499 500 перевірок. Версія з довідником проходить список один раз — O(n), тобто 1000 кроків, але тримає в пам’яті ключ для кожного побаченого `id`. `Object.hasOwn` бачить лише власні ключі, тож `id` на зразок `\"toString\"` не плутається з успадкованим методом."
      en: "Nested loops check up to `n × (n − 1) / 2` pairs — O(n²): on a list of 1000 different `id`s that is 499 500 checks. The lookup version walks the list once — O(n), that is 1000 steps, but keeps a key in memory for every `id` it has seen. `Object.hasOwn` sees only own keys, so an `id` such as `\"toString\"` is not confused with an inherited method."
    feedback:
      - when: { test: "nested version finds a repeated id" }
        message:
          uk: "Ця перевірка дає список, де `h-02` трапляється двічі, і чекає `true`. Якщо прийшло `false` чи `undefined`, функція не порівнює `id` у парах записів або не повертає `true`, щойно знайшла однакові."
          en: "This check passes a list in which `h-02` occurs twice and expects `true`. If `false` or `undefined` came back, the function does not compare the `id`s of pairs of records or does not return `true` as soon as it finds equal ones."
      - when: { test: "nested version says false when all ids differ" }
        message:
          uk: "Ця перевірка дає п’ять різних `id` і чекає `false`. Якщо прийшло `true`, функція знайшла «пару» там, де її немає: найчастіше внутрішній цикл порівнює запис сам із собою — він має починати з місця одразу за зовнішнім."
          en: "This check passes five different `id`s and expects `false`. If `true` came back, the function found a “pair” where there is none: most often the inner loop compares a record with itself — it has to start right after the outer one."
      - when: { test: "nested version: an empty list has no duplicates" }
        message:
          uk: "Ця перевірка дає порожній список і чекає `false`. Якщо прийшов `undefined`, функція нічого не повертає, коли цикли закінчилися без знахідки."
          en: "This check passes an empty list and expects `false`. If `undefined` came back, the function returns nothing when the loops end without a find."
      - when: { test: "lookup version finds a repeated id" }
        message:
          uk: "Ця перевірка дає список, де `h-02` трапляється двічі, і чекає `true`. Якщо прийшло `false`, функція не запам’ятовує `id`, повз які пройшла, тож другому `h-02` нема з чим збігтися."
          en: "This check passes a list in which `h-02` occurs twice and expects `true`. If `false` came back, the function does not remember the `id`s it has passed, so the second `h-02` has nothing to match."
      - when: { test: "lookup version says false when all ids differ" }
        message:
          uk: "Ця перевірка дає п’ять різних `id` і чекає `false`. Якщо прийшло `true`, перевірка «вже бачили» спрацьовує даремно — наприклад, `id` записують у довідник ще до цієї перевірки."
          en: "This check passes five different `id`s and expects `false`. If `true` came back, the “seen before” check fires by mistake — for example, the `id` is written into the lookup object before that check."
      - when: { test: "lookup version: an empty list has no duplicates" }
        message:
          uk: "Ця перевірка дає порожній список і чекає `false`. Якщо прийшов `undefined`, функція нічого не повертає, коли цикл закінчився без знахідки."
          en: "This check passes an empty list and expects `false`. If `undefined` came back, the function returns nothing when the loop ends without a find."
      - when: { test: "an id such as toString is not taken for a duplicate" }
        message:
          uk: "Ця перевірка дає два записи з різними `id`, перший — `\"toString\"`, і чекає `false`. У порожньому об’єкті вже «є» успадкований ключ `toString`: його бачать і оператор `in`, і читання `seen[id]`. Якщо прийшло `true`, перевіряй через `Object.hasOwn` — він бачить лише власні ключі."
          en: "This check passes two records with different `id`s, the first being `\"toString\"`, and expects `false`. An empty object already “has” the inherited key `toString`: both the `in` operator and reading `seen[id]` see it. If `true` came back, check with `Object.hasOwn` — it sees only own keys."
      - when: { test: "lookup version reads each id only a few times" }
        message:
          uk: "Ця перевірка дає 300 записів із різними `id` і рахує, скільки разів функція прочитала поле `id`: для одного проходу досить кількох читань на запис, тобто від 300 до 1500. Якщо читань значно більше, для кожного запису функція знову проходить увесь список (`find`, `filter` чи вкладений цикл) — це `n × n` роботи; якщо менше 300, вона перевіряє не всі записи."
          en: "This check passes 300 records with different `id`s and counts how many times the function read the `id` field: one pass needs a few reads per record, that is 300 to 1500. If there are far more reads, the function walks the whole list again for every record (`find`, `filter` or a nested loop) — that is `n × n` work; if fewer than 300, it does not check every record."

  - id: to-project
    kind: transfer
    capstoneStep: JS-05
    body:
      uk: "Пошук за назвою в проєкті — лінійний, і для твоїх десятків записів це чудово: простий код важливіший. А коли знадобиться багато разів знаходити записи за `id`, ти знаєш, як збудувати довідник один раз і що він коштує."
      en: "The search by name in your project is linear, and for your dozens of records that is perfectly fine: simple code matters more. And when you need to find records by `id` many times, you know how to build a lookup object once and what it costs."
