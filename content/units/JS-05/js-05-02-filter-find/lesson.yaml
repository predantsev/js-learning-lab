id: js-05-02-filter-find
unit: JS-05
title:
  uk: "filter і find"
  en: "filter and find"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Обрати `filter` для «усі, що підходять» і `find` для «перший, що підходить» та передбачити результат кожного, коли не підходить нічого: порожній масив проти `undefined`."
    en: "Choose `filter` for “all that match” and `find` for “the first that matches”, and predict each one’s result when nothing matches: an empty array vs `undefined`."
  - uk: "Показати через `===`, що `filter` і `find` повертають ті самі об’єкти записів, а не копії."
    en: "Show with `===` that `filter` and `find` return the same record objects, not copies."
  - uk: "Шукати записи за текстом за допомогою `filter`, `includes` і `toLowerCase`."
    en: "Search records by text with `filter`, `includes` and `toLowerCase`."
prerequisites: [js-05-01-map, js-04-07-reference-identity]
subskills:
  - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: practice }
glossary: [array-filter, array-find, predicate]
selfCheck: [predict-results, task-queries]

blocks:
  - id: all-or-first
    kind: explanation
    title:
      uk: "Усі, що підходять, чи перший, що підходить"
      en: "All that match, or the first that matches"
    body:
      uk: |
        Два питання до списку звучать схоже, але мають різні відповіді:

        - **«Які бажання дешевші за 50?»** — потрібні **всі**, що підходять. Це [[array-filter|filter]]: він повертає новий масив з елементами, для яких твоя функція повернула `true`.
        - **«Яке перше бажання дешевше за 50?»** — потрібен **один** елемент. Це [[array-find|find]]: він повертає сам елемент і на ньому зупиняється.

        ```js
        const cheap = items.filter((item) => item.price < 50);
        const firstCheap = items.find((item) => item.price < 50);
        ```

        У `cheap` — масив, у `firstCheap` — один об’єкт. Функцію, яка відповідає «так» чи «ні» про один елемент, називають [[predicate|предикатом]]. Обидва методи викликають її для елементів по черзі, від початку списку.
      en: |
        Two questions about a list sound alike but have different answers:

        - **“Which wishes cost less than 50?”** — you need **all** that match. That is [[array-filter|filter]]: it returns a new array with the elements for which your function returned `true`.
        - **“Which is the first wish under 50?”** — you need **one** element. That is [[array-find|find]]: it returns the element itself and stops there.

        ```js
        const cheap = items.filter((item) => item.price < 50);
        const firstCheap = items.find((item) => item.price < 50);
        ```

        `cheap` holds an array, `firstCheap` holds one object. A function that answers yes or no about one element is called a [[predicate]]. Both methods call it for the elements in turn, from the start of the list.

  - id: predict-results
    kind: prediction
    prompt:
      uk: "Під першу умову підходять два бажання, під другу — жодне. Що з’явиться в консолі?"
      en: "Two wishes match the first condition and none matches the second. What appears in the console?"
    code: |
      const items = [
        { id: "w-01", price: 80 },
        { id: "w-02", price: 45 },
        { id: "w-06", price: 18 },
      ];
      console.log(items.filter((item) => item.price < 50).length);
      console.log(items.find((item) => item.price < 50).id);
      console.log(items.filter((item) => item.price > 500));
      console.log(items.find((item) => item.price > 500));
    verify:
      logs: ["2", "w-02", "[]", "undefined"]
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "`2`, `w-02`, `[]`, `undefined`"
            en: "`2`, `w-02`, `[]`, `undefined`"
        - id: null-not-found
          text:
            uk: "`2`, `w-02`, `[]`, `null`"
            en: "`2`, `w-02`, `[]`, `null`"
          why:
            uk: "Коли нічого не знайдено, `find` повертає `undefined`, а не `null`. `null` хтось має поставити свідомо, а `find` цього не робить."
            en: "When nothing is found, `find` returns `undefined`, not `null`. Someone has to put `null` there on purpose, and `find` does not."
        - id: cheapest
          text:
            uk: "`2`, `w-06`, `[]`, `undefined`"
            en: "`2`, `w-06`, `[]`, `undefined`"
          why:
            uk: "`find` іде від початку списку й зупиняється на **першому** збігу: `w-02` (45) стоїть раніше за `w-06` (18). Найдешевшого він не шукає."
            en: "`find` goes from the start of the list and stops at the **first** match: `w-02` (45) comes before `w-06` (18). It does not look for the cheapest."
        - id: undefined-filter
          text:
            uk: "`2`, `w-02`, `undefined`, `undefined`"
            en: "`2`, `w-02`, `undefined`, `undefined`"
          why:
            uk: "`filter` завжди повертає масив: підійшли двоє — у ньому двоє, не підійшов ніхто — порожній `[]`, а не `undefined`."
            en: "`filter` always returns an array: two matched — it holds two, none matched — it is the empty `[]`, not `undefined`."
      correct: [right]
    explanation:
      uk: "Під умову `price < 50` підходять двоє, `w-02` і `w-06`: `filter` дає масив довжиною 2, а `find` — перший збіг, `w-02`. Під умову `price > 500` не підходить ніхто: `filter` повертає порожній масив `[]`, а `find` — `undefined`."
      en: "Two records match `price < 50`, `w-02` and `w-06`: `filter` gives an array of length 2, and `find` gives the first match, `w-02`. Nothing matches `price > 500`: `filter` returns the empty array `[]`, and `find` returns `undefined`."

  - id: filter-find-flow
    kind: visual
    visual: pipeline
    title:
      uk: "filter перевіряє всіх, find зупиняється на першому"
      en: "filter checks everyone, find stops at the first"
    textEquivalent:
      uk: "Масив items містить чотири бажання: w-01 (ціна 80, ще не отримане), w-04 (25, уже отримане), w-02 (45, не отримане) і w-03 (240, не отримане). Спершу filter з умовою !item.acquired перевіряє кожен запис: w-01, w-02 і w-03 проходять, w-04 відкидається. filter повертає новий масив із трьох записів — це ті самі об’єкти, що й у items, не копії. Потім find з умовою item.price <= 50 перевіряє цей новий масив від початку: w-01 (80) не підходить, w-02 (45) підходить. На цьому find зупиняється й повертає сам об’єкт w-02; запис w-03 він уже не перевіряє. Якби не підійшов жоден запис, find повернув би undefined."
      en: "The items array holds four wishes: w-01 (price 80, still wanted), w-04 (25, already acquired), w-02 (45, wanted) and w-03 (240, wanted). First filter with the condition !item.acquired checks every record: w-01, w-02 and w-03 pass, w-04 is dropped. filter returns a new array of three records — the same objects as in items, not copies. Then find with the condition item.price <= 50 checks this new array from the start: w-01 (80) does not match, w-02 (45) does. There find stops and returns the w-02 object itself; it never checks w-03. If no record matched, find would return undefined."
    spec:
      code: |
        const wanted = items
          .filter((item) => !item.acquired);
        const firstCheap = wanted
          .find((item) => item.price <= 50);
      input:
        label: { uk: "items — чотири бажання", en: "items — four wishes" }
        items:
          - { id: "w-01", price: 80, acquired: false }
          - { id: "w-04", price: 25, acquired: true }
          - { id: "w-02", price: 45, acquired: false }
          - { id: "w-03", price: 240, acquired: false }
        caption:
          uk: "Чотири бажання. Поле `acquired` каже, чи річ уже отримано. Питання: яке **перше** бажання до 50, якого ще немає?"
          en: "Four wishes. The `acquired` field says whether the thing is already acquired. The question: which is the **first** wish up to 50 that you do not have yet?"
      stages:
        - op: filter
          fn: "(item) => !item.acquired"
          perItem: true
          caption:
            uk: "`filter` питає про запис {index} з {count}: `{item}` → **{result}**. `true` — запис іде в новий масив, `false` — ні."
            en: "`filter` asks about record {index} of {count}: `{item}` → **{result}**. `true` means the record goes into the new array, `false` means it does not."
          summary:
            uk: "`filter` перевірив **усі** записи й повернув новий масив із трьох. Це не копії: у новому масиві ті самі об’єкти, що й у `items`. Отриманий `w-04` у нього не потрапив."
            en: "`filter` checked **every** record and returned a new array of three. They are not copies: the new array holds the same objects as `items`. The acquired `w-04` did not get in."
        - op: find
          fn: "(item) => item.price <= 50"
          perItem: true
          caption:
            uk: "`find` перевіряє запис {index} з {count}: `{item}` → **{result}**."
            en: "`find` checks record {index} of {count}: `{item}` → **{result}**."
          summary:
            uk: "`find` зупинився на першому збігу, `w-02`, і повернув **сам об’єкт**, а не масив. `w-03` він навіть не перевіряв. Якби не підійшов ніхто, результатом було б `undefined`."
            en: "`find` stopped at the first match, `w-02`, and returned **the object itself**, not an array. It never even checked `w-03`. If nothing matched, the result would be `undefined`."
      result:
        label: { uk: "перше бажання до 50, якого ще немає", en: "the first wish up to 50 you do not have yet" }

  - id: sieve
    kind: analogy
    body:
      uk: "`filter` схожий на сито: умова вирішує, що пройде далі. Ти висипаєш увесь список, а в мисці опиняється лише те, що відповідає умові."
      en: "`filter` is like a sieve: the condition decides what passes through. You pour in the whole list, and only what matches the condition ends up in the bowl."
    limits:
      uk: "Справжнє сито розділяє саму купу: те, що пройшло, у ній уже не лежить. `filter` нічого не забирає з початкового масиву — той лишається цілим, а новий масив містить **ті самі** об’єкти, не їхні копії. І сито відбирає лише за розміром, а умова може питати про що завгодно: ціну, статус, назву."
      en: "A real sieve splits the pile itself: whatever fell through is no longer in it. `filter` takes nothing out of the original array — it stays whole, and the new array holds **the same** objects, not copies of them. And a sieve sorts only by size, while a condition can ask about anything: price, status, name."

  - id: try-filter
    kind: example
    runtime: browser-js
    dir: try-filter
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      of: { uk: "з", en: "of" }
    title:
      uk: "Твоя межа ціни"
      en: "Your price limit"
    body:
      uk: "Програма показує бажання, які вкладаються в межу ціни, і скільки їх із загальної кількості. Запусти її."
      en: "The program shows the wishes that fit the price limit and how many of them there are out of the total. Run it."
    tryIt:
      uk: "Зміни межу ціни зі `100` на `50`. Перед запуском спробуй передбачити результат. Потім постав `10`: що покаже перший рядок консолі, коли не підходить жодне бажання?"
      en: "Change the price limit from `100` to `50`. Before running, try to predict the result. Then set it to `10`: what does the first console line show when no wish fits?"

  - id: recall-identity
    kind: review
    title:
      uk: "Пригадай: дві змінні, один об’єкт"
      en: "Recall: two names, one object"
    items:
      - id: alias-change
        from: js-04-07-reference-identity
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const a = { id: "w-02", price: 45 };
          const b = a;
          b.price = 50;
          console.log(a.price, a === b);
        verify:
          logs: ["50 true"]
        answer:
          type: choice
          options:
            - id: copy
              text:
                uk: "`45 true`"
                en: "`45 true`"
              why:
                uk: "`const b = a` не копіює об’єкт: обидві змінні ведуть до одного об’єкта, тож зміну через `b` видно й через `a`."
                en: "`const b = a` does not copy the object: both names lead to one object, so a change made through `b` is visible through `a`."
            - id: shared
              text:
                uk: "`50 true`"
                en: "`50 true`"
            - id: lookalike
              text:
                uk: "`50 false`"
                en: "`50 false`"
              why:
                uk: "`===` для об’єктів питає: «це той самий об’єкт?» Так: `a` і `b` вказують на один."
                en: "For objects, `===` asks “is it the same object?” Yes: `a` and `b` point at one."
            - id: two-objects
              text:
                uk: "`45 false`"
                en: "`45 false`"
              why:
                uk: "Тут немає двох об’єктів: присвоєння `b = a` дає ще одну змінну, що веде до того самого об’єкта."
                en: "There are no two objects here: the assignment `b = a` gives the same object one more name."
          correct: [shared]
        explanation:
          uk: "Обидві змінні ведуть до **одного** об’єкта. Зміна через `b` змінює саме його, тому `a.price` теж `50`, а `a === b` дає `true`."
          en: "Both names point at **one** object. A change through `b` changes that very object, so `a.price` is `50` too, and `a === b` is `true`."

  - id: predict-same
    kind: prediction
    prompt:
      uk: "Що виведуть ці дві перевірки?"
      en: "What do these two checks print?"
    code: |
      const items = [
        { id: "w-01", price: 80 },
        { id: "w-02", price: 45 },
      ];
      const found = items.find((item) => item.id === "w-02");
      const cheap = items.filter((item) => item.price < 50);
      console.log(found === items[1]);
      console.log(cheap[0] === items[1]);
    verify:
      logs: ["true", "true"]
    answer:
      type: choice
      options:
        - id: both-same
          text:
            uk: "`true` і `true`"
            en: "`true` and `true`"
        - id: filter-copies
          text:
            uk: "`true` і `false`"
            en: "`true` and `false`"
          why:
            uk: "`filter` не копіює записи: у новому масиві лежать ті самі об’єкти, тож `cheap[0]` — це саме `items[1]`. Новий тут лише сам масив."
            en: "`filter` does not copy records: the new array holds the same objects, so `cheap[0]` is exactly `items[1]`. Only the array itself is new."
        - id: both-copies
          text:
            uk: "`false` і `false`"
            en: "`false` and `false`"
          why:
            uk: "Ні `find`, ні `filter` не створюють нових об’єктів-записів. Вони віддають посилання на ті, що вже є в списку."
            en: "Neither `find` nor `filter` creates new record objects. They hand out references to the ones already in the list."
        - id: find-copies
          text:
            uk: "`false` і `true`"
            en: "`false` and `true`"
          why:
            uk: "`find` повертає сам знайдений об’єкт, а не його копію."
            en: "`find` returns the found object itself, not a copy of it."
      correct: [both-same]
    explanation:
      uk: "І `find`, і `filter` віддають **ті самі** об’єкти, що лежать у списку. Новим є лише масив, який повертає `filter`. Тому зміна знайденого запису — це зміна запису в самому списку."
      en: "Both `find` and `filter` hand out **the same** objects that are in the list. Only the array returned by `filter` is new. So changing a found record changes the record in the list itself."

  - id: try-find
    kind: example
    runtime: browser-js
    dir: try-find
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
    title:
      uk: "Знайдений запис — той самий запис"
      en: "The found record is the same record"
    body:
      uk: "`filter` відбирає справи, які ще не виконано, а `find` шукає справу за `id`. Останній виклик шукає `id`, якого в списку немає. Запусти й подивись, що повертає кожен виклик."
      en: "`filter` picks the tasks that are not done yet, and `find` looks for a task by its `id`. The last call looks for an `id` that is not in the list. Run it and see what each call returns."
    tryIt:
      uk: "Під рядком коду `console.log(found);` додай `found.done = true;`, а в кінці — `console.log(tasks[1]);`. Запусти: справа змінилася й у масиві `tasks`, бо `found` — той самий об’єкт, а не копія."
      en: "Below the line `console.log(found);` add `found.done = true;`, and at the end add `console.log(tasks[1]);`. Run it: the task changed in the `tasks` array too, because `found` is the same object, not a copy."

  - id: search-by-text
    kind: explanation
    title:
      uk: "Пошук за текстом і відповідь «нічого»"
      en: "Searching by text, and answering “nothing”"
    body:
      uk: |
        **Пошук за текстом.** Текст у лапках теж має власні методи. `text.includes(part)` відповідає `true`, якщо `part` трапляється всередині `text`. `text.toLowerCase()` повертає новий текст, у якому всі літери малі:

        ```js
        "Настільна лампа".includes("лампа"); // true
        "Настільна лампа".includes("Лампа"); // false: «Л» і «л» — різні літери
        "ЛАМПА".toLowerCase();               // "лампа"
        ```

        Щоб пошук не зважав на великі й малі літери, зведи до малих **обидва** тексти — і той, у якому шукаєш, і той, який шукаєш, — а тоді питай `includes`. Пошук записів за назвою — це `filter` з такою перевіркою в предикаті.

        **«Нічого» буває різним.** `filter` дає `[]`, `find` — `undefined`. Якщо домовилися, що відповідь «нічого не знайдено» — це `null`, заміни `undefined` через `??`:

        ```js
        const firstExpensive = items.find((item) => item.price > 500) ?? null;
        ```
      en: |
        **Searching by text.** Text in quotes has methods of its own too. `text.includes(part)` answers `true` if `part` occurs inside `text`. `text.toLowerCase()` returns new text in which every letter is small:

        ```js
        "Desk lamp".includes("lamp"); // true
        "Desk lamp".includes("Lamp"); // false: "L" and "l" are different letters
        "LAMP".toLowerCase();         // "lamp"
        ```

        To make a search ignore upper and lower case, bring **both** texts to small letters — the one you search in and the one you search for — and only then ask `includes`. Searching records by name is a `filter` with such a check in its predicate.

        **“Nothing” comes in different shapes.** `filter` gives `[]`, `find` gives `undefined`. If the agreement is that “nothing found” is `null`, replace `undefined` with `??`:

        ```js
        const firstExpensive = items.find((item) => item.price > 500) ?? null;
        ```

  - id: task-queries
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: task-queries
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      wardrobe: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
      queryUpper: { uk: "КНИЖКИ", en: "BOOKS" }
      queryLower: { uk: "полити", en: "water" }
    title:
      uk: "Три запитання до списку справ"
      en: "Three questions for a task list"
    instructions:
      uk: |
        Допиши три функції для списку справ:

        1. `byStatus(list, done)` — **усі** справи, у яких поле `done` збігається з параметром `done` (`true` чи `false`).
        2. `findById(list, id)` — справа з таким `id` або `null`, якщо такої немає.
        3. `searchByTitle(list, query)` — усі справи, у назві яких є `query`, незалежно від великих і малих літер.

        Список не змінюй. Записи повертай ті самі, без копіювання.
      en: |
        Complete three functions for a task list:

        1. `byStatus(list, done)` — **all** tasks whose `done` field matches the `done` parameter (`true` or `false`).
        2. `findById(list, id)` — the task with that `id`, or `null` if there is none.
        3. `searchByTitle(list, query)` — all tasks whose title contains `query`, regardless of upper and lower case.

        Do not change the list. Return the same records, without copying them.
    testTitles:
      "byStatus(list, false) keeps every pending task":
        uk: "byStatus(list, false) залишає всі невиконані справи"
        en: "byStatus(list, false) keeps every pending task"
      "byStatus(list, true) keeps every done task":
        uk: "byStatus(list, true) залишає всі виконані справи"
        en: "byStatus(list, true) keeps every done task"
      "byStatus returns the same task objects, not copies":
