      - when: { test: "byStatus(list, false) keeps every pending task" }
        message:
          uk: "Ця перевірка викликає `byStatus(list, false)` і чекає масив з обома невиконаними справами, `t-01` і `t-02`. Якщо прийшли виконані справи, предикат не порівнює поле `done` справи з параметром `done`; якщо прийшла одна справа без масиву, це `find`, а він зупиняється на першій."
          en: "This check calls `byStatus(list, false)` and expects an array with both pending tasks, `t-01` and `t-02`. If done tasks came back, the predicate does not compare the task’s `done` field with the `done` parameter; if a single task came back instead of an array, that is `find`, and it stops at the first one."
      - when: { test: "byStatus(list, true) keeps every done task" }
        message:
          uk: "Ця перевірка викликає `byStatus(list, true)` і чекає масив з обома виконаними справами, `t-04` і `t-06`. Якщо прийшла лише одна справа без масиву, це `find`: він зупиняється на першому збігу, а потрібні всі."
          en: "This check calls `byStatus(list, true)` and expects an array with both done tasks, `t-04` and `t-06`. If only one task came back instead of an array, that is `find`: it stops at the first match, while all of them are needed."
      - when: { test: "byStatus returns the same task objects, not copies" }
        message:
          uk: "Ця перевірка порівнює першу знайдену справу зі справою зі списку через `===`: це має бути той самий об’єкт, а не копія. `filter` нічого не копіює, тож копії з’являються лише тоді, коли код сам їх робить, наприклад через `{ ...task }`."
          en: "This check compares the first task found with the task from the list using `===`: it must be the same object, not a copy. `filter` copies nothing, so copies appear only when the code makes them itself, for example with `{ ...task }`."
      - when: { test: "byStatus gives an empty array when no task matches" }
        message:
          uk: "Ця перевірка дає список лише з виконаних справ, просить невиконані й чекає порожній масив `[]`. `filter` сам дає `[]`, коли не підходить жодна справа, а `find` у такому разі дав би `undefined`."
          en: "This check passes a list of done tasks only, asks for pending ones and expects an empty array `[]`. `filter` gives `[]` by itself when no task matches, while `find` would give `undefined` in that case."
      - when: { test: "findById returns the task itself" }
        message:
          uk: "Ця перевірка шукає `t-04` і чекає саме цю справу зі списку — той самий об’єкт. Якщо прийшов `null` чи `undefined`, перевір, що предикат порівнює `id` справи з параметром `id`."
          en: "This check looks for `t-04` and expects exactly that task from the list — the same object. If `null` or `undefined` came back, check that the predicate compares the task’s `id` with the `id` parameter."
      - when: { test: "findById returns null for a missing id" }
        message:
          uk: "Ця перевірка шукає `id`, якого в списку немає, і чекає `null`. Сам `find` у такому разі дає `undefined`, тож його треба замінити на `null` — через `??` або через `if`."
          en: "This check looks for an `id` that is not in the list and expects `null`. `find` on its own gives `undefined` in that case, so it has to be replaced with `null` — with `??` or with an `if`."
      - when: { test: "searchByTitle ignores upper and lower case" }
        message:
          uk: "Ця перевірка шукає «КНИЖКИ» і «полити» та чекає масив зі справами, у назві яких це слово є, хоч би якими літерами його написано. Якщо масив порожній, малими літерами зведено не обидва тексти; якщо прийшла одна справа без масиву, це `find` замість `filter`."
          en: "This check searches for “BOOKS” and “water” and expects an array with the tasks whose title contains that word, whatever letters it is written in. If the array is empty, not both texts were brought to small letters; if a single task came back instead of an array, that is `find` instead of `filter`."
      - when: { test: "searchByTitle gives an empty array when nothing matches" }
        message:
          uk: "Ця перевірка шукає «xyz», якого немає в жодній назві, і чекає порожній масив `[]`. Якщо прийшов `undefined`, функція не повертає результат `filter` або шукає через `find`."
          en: "This check searches for “xyz”, which is in no title, and expects an empty array `[]`. If `undefined` came back, the function does not return the result of `filter` or searches with `find`."
      - when: { test: "the list itself is not changed" }
        message:
          uk: "Ця перевірка порівнює список до й після всіх трьох викликів: він має лишитися таким самим. `filter` і `find` нічого не змінюють, тож шукай у своєму коді присвоєння на зразок `task.done = …`."
          en: "This check compares the list before and after all three calls: it must stay the same. `filter` and `find` change nothing, so look in your code for an assignment such as `task.done = …`."

