    hints:
      nudge:
        uk: "Для кожної функції спершу виріши: потрібні **всі** справи, що підходять, чи **одна**?"
        en: "For each function, decide first: do you need **all** matching tasks or **one**?"
      explanation:
        uk: "Коли потрібні всі, що підходять, — це `filter`; коли перший — `find`. Предикат порівнює поле запису з тим, що прийшло в параметрі: наприклад, `(item) => item.acquired === wanted`, якщо треба бажання з певним значенням `acquired`. Коли `find` нічого не знайшов, він дає `undefined` — заміни його на `null` через `??` або перевір через `if`. Для пошуку без різниці між великими й малими літерами зведи до малих і назву, і запит."
        en: "When you need all that match, it is `filter`; when you need the first one, it is `find`. The predicate compares a field of the record with what came in the parameter: for example, `(item) => item.acquired === wanted` if you need wishes with a certain `acquired` value. When `find` finds nothing, it gives `undefined` — replace it with `null` using `??` or check it with an `if`. For a search that ignores upper and lower case, bring both the title and the query to small letters."
    solutionNote:
      uk: "Коли потрібні всі збіги — `filter`, коли один — `find`. Обидва повертають ті самі об’єкти зі списку, тому `===` з елементом списку дає `true`. `?? null` замінює лише `undefined`, тобто «не знайдено», а знайдений запис пропускає без змін."
      en: "When you need every match, use `filter`; when you need one, use `find`. Both return the same objects from the list, so `===` with a list element gives `true`. `?? null` replaces only the “not found” `undefined` and lets a found record through unchanged."
