id: js-05-03-some-every
unit: JS-05
title:
  uk: "some і every"
  en: "some and every"
kind: instructional
minutes: 8
contentVersion: 1
objectives:
  - uk: "Передбачити результат `some` і `every`, зокрема на порожньому масиві, і пояснити, чому `every` на порожньому масиві дає `true`."
    en: "Predict `some` and `every` results, including on an empty array, and explain why `every` on an empty array is `true`."
  - uk: "Відповідати за допомогою `some` і `every` на запитання «так чи ні» про список і показати, де кожен із них зупиняється."
    en: "Use `some` and `every` to answer yes/no questions about a list and say where each one stops early."
prerequisites: [js-05-02-filter-find]
subskills:
  - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: practice }
glossary: [array-some, array-every, vacuous-truth]
selfCheck: [predict-some-every, expense-checks]

blocks:
  - id: yes-or-no
    kind: explanation
    title:
      uk: "Запитання «так чи ні» про весь список"
      en: "Yes-or-no questions about the whole list"
    body:
      uk: |
        Інколи зі списку не треба нічого діставати — треба лише відповісти «так» чи «ні»:

        - **«Чи є хоч одна звичка на паузі?»** — це [[array-some|some]]. Він повертає `true`, щойно функція відповіла `true` хоча б для одного елемента.
        - **«Чи всі звички активні?»** — це [[array-every|every]]. Він повертає `true`, лише якщо функція відповіла `true` для кожного елемента.

        ```js
        const anyPaused = habits.some((habit) => !habit.active);
        const allActive = habits.every((habit) => habit.active);
        ```

        Обидва методи повертають не масив, а одне значення: `true` або `false`.
      en: |
        Sometimes you do not need anything out of a list — only a yes or a no:

        - **“Is at least one habit paused?”** — that is [[array-some|some]]. It returns `true` as soon as the function has answered `true` for at least one element.
        - **“Are all habits active?”** — that is [[array-every|every]]. It returns `true` only if the function answered `true` for every element.

        ```js
        const anyPaused = habits.some((habit) => !habit.active);
        const allActive = habits.every((habit) => habit.active);
        ```

        Both methods return not an array but a single value: `true` or `false`.

  - id: predict-some-every
    kind: prediction
    prompt:
      uk: "Три звички, одна з них на паузі, і порожній список. Що виведе консоль?"
      en: "Three habits, one of them paused, and an empty list. What does the console show?"
    code: |
      const habits = [
        { id: "h-01", active: true },
        { id: "h-05", active: false },
        { id: "h-06", active: true },
      ];
      const none = [];
      console.log(habits.some((habit) => !habit.active));
      console.log(habits.every((habit) => habit.active));
      console.log(none.some((habit) => !habit.active));
      console.log(none.every((habit) => habit.active));
    verify:
      logs: ["true", "false", "false", "true"]
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "`true`, `false`, `false`, `true`"
            en: "`true`, `false`, `false`, `true`"
        - id: every-empty-false
          text:
            uk: "`true`, `false`, `false`, `false`"
            en: "`true`, `false`, `false`, `false`"
          why:
            uk: "`every` на порожньому списку дає `true`: у ньому немає жодного елемента, який порушив би правило."
            en: "`every` on an empty list gives `true`: there is no element that could break the rule."
        - id: some-empty-true
          text:
            uk: "`true`, `false`, `true`, `true`"
            en: "`true`, `false`, `true`, `true`"
          why:
            uk: "`some` на порожньому списку дає `false`: немає жодного елемента, для якого функція сказала б «так»."
            en: "`some` on an empty list gives `false`: there is no element for which the function could say yes."
        - id: empty-error
          text:
            uk: "`true`, `false`, а далі помилка: з порожнім списком немає з чим працювати"
            en: "`true`, `false`, then an error: an empty list has nothing to work with"
          why:
            uk: "Порожній масив — звичайний масив. `some` і `every` просто жодного разу не викликають функцію й одразу дають відповідь."
            en: "An empty array is an ordinary array. `some` and `every` simply never call the function and answer right away."
      correct: [right]
    explanation:
      uk: "Одна звичка на паузі — і `some` каже `true`, а `every` через неї ж каже `false`. На порожньому списку `some` не знаходить жодного «так» і дає `false`, а `every` не знаходить жодного «ні» і дає `true`."
      en: "One paused habit is enough for `some` to say `true`, and the same habit makes `every` say `false`. On the empty list `some` finds no “yes” and gives `false`, while `every` finds no “no” and gives `true`."

  - id: stop-early
    kind: visual
    visual: code-trace
    title:
      uk: "Де some і every зупиняються"
      en: "Where some and every stop"
    textEquivalent:
      uk: "Масив habits містить три звички: h-01 (активна), h-05 (на паузі) і h-06 (активна). habits.some(isPaused) викликає isPaused для h-01 — отримує false — і для h-05 — отримує true. На цьому some зупиняється: anyPaused дорівнює true, а h-06 не перевіряється взагалі. habits.every(isActive) викликає isActive для h-01 — true — і для h-05 — false. На цьому every зупиняється: allActive дорівнює false, h-06 знову не перевіряється. На порожньому масиві none метод some(isPaused) повертає false, а every(isActive) повертає true, жодного разу не викликавши функцію. Консоль показує: true false false true."
      en: "The habits array holds three habits: h-01 (active), h-05 (paused) and h-06 (active). habits.some(isPaused) calls isPaused for h-01 — gets false — and for h-05 — gets true. There some stops: anyPaused is true, and h-06 is never checked. habits.every(isActive) calls isActive for h-01 — true — and for h-05 — false. There every stops: allActive is false, and h-06 is again never checked. On the empty array none, some(isPaused) returns false and every(isActive) returns true without calling the function even once. The console shows: true false false true."
    spec:
      file: visuals/stop-early.js
      steps: captioned
      captions:
        - at: { line: 9 }
          text:
            uk: "Запитання до `some`: «Чи є хоч одна звичка на паузі?» `some` викликатиме `isPaused` для звичок по черзі."
            en: "The question for `some`: “Is at least one habit paused?” `some` will call `isPaused` for the habits in turn."
        - at: { line: 6, kind: return, hit: 1 }
          text:
            uk: "Перший виклик: `habit` — це `h-01` (#2 у heap). Вона активна, тож `isPaused` повертає `false`. Відповіді ще немає — `some` іде далі."
            en: "First call: `habit` is `h-01` (#2 in the heap). It is active, so `isPaused` returns `false`. No answer yet — `some` moves on."
        - at: { line: 6, kind: return, hit: 2 }
          text:
            uk: "Другий виклик: `h-05` на паузі — `true`. Відповідь «так» уже відома, тому `some` **зупиняється**: `h-06` не перевіряється взагалі."
            en: "Second call: `h-05` is paused — `true`. The answer “yes” is known now, so `some` **stops**: `h-06` is never checked."
        - at: { line: 10 }
          text:
            uk: "`anyPaused` дорівнює `true`. Тепер `every`: «Чи всі звички активні?»"
            en: "`anyPaused` is `true`. Now `every`: “Are all habits active?”"
        - at: { line: 7, kind: return, hit: 1 }
          text:
            uk: "`h-01` активна — `true`. Одне «так» для `every` ще нічого не вирішує, тож він перевіряє далі."
            en: "`h-01` is active — `true`. One “yes” settles nothing for `every`, so it keeps checking."
        - at: { line: 7, kind: return, hit: 2 }
          text:
            uk: "`h-05` — `false`. Одного порушника досить, щоб відповісти «ні», тому `every` **зупиняється** тут, і `h-06` знову не перевіряється."
            en: "`h-05` — `false`. One rule-breaker is enough to answer “no”, so `every` **stops** here, and `h-06` is again never checked."
        - at: { line: 13 }
          text:
            uk: "`allActive` дорівнює `false`. `none` — порожній масив: у `none.some(isPaused)` немає кого перевіряти."
            en: "`allActive` is `false`. `none` is an empty array: `none.some(isPaused)` has nobody to check."
        - at: { line: 14 }
          text:
            uk: "`noneSome` — `false`: жодного виклику, жодного «так». Тепер `none.every(isActive)` — теж без жодного виклику."
            en: "`noneSome` is `false`: not a single call, not a single “yes”. Now `none.every(isActive)` — again without a single call."
        - at: { line: 16 }
          text:
            uk: "`noneEvery` — `true`: порушника правила не знайшлося. Обидва методи на порожньому масиві відповіли одразу, не викликавши функцію."
            en: "`noneEvery` is `true`: no rule-breaker was found. On the empty array both methods answered at once, without calling the function."
        - at: { line: 16, kind: end }
          text:
            uk: "Консоль показує `true false false true`. Порахуй виклики: `some` — 2, `every` — 2, на порожньому масиві — 0."
            en: "The console shows `true false false true`. Count the calls: `some` made 2, `every` made 2, and on the empty array there were 0."

  - id: count-calls
    kind: example
    runtime: browser-js
    dir: count-calls
    entry: index.js
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      english: { uk: "Вчити англійські слова", en: "Learn English words" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      checking: { uk: "перевіряю:", en: "checking:" }
      calls: { uk: "викликів:", en: "calls:" }
    title:
      uk: "Порахуй виклики"
      en: "Count the calls"
    body:
      uk: "Функція `isPaused` записує в консоль кожну звичку, яку перевіряє, і рахує виклики. Запусти й порахуй: скільки звичок перевірив `some`?"
      en: "The `isPaused` function prints every habit it checks and counts the calls. Run it and count: how many habits did `some` check?"
    tryIt:
      uk: |
        1. Перестав звичку на паузі (`h-05`) на перше місце в масиві й запусти: `some` зупиниться після першого ж виклику.
        2. Зроби всі звички активними: скільки викликів тепер і що відповідає `some`?
        3. Заміни `habits.some(isPaused)` на `[].some(isPaused)`.
      en: |
        1. Move the paused habit (`h-05`) to the first place in the array and run: `some` stops after the very first call.
        2. Make all habits active: how many calls now, and what does `some` answer?
        3. Replace `habits.some(isPaused)` with `[].some(isPaused)`.

  - id: recall-empty
    kind: review
    title:
      uk: "Пригадай: порожній масив"
      en: "Recall: the empty array"
    items:
      - id: empty-reads
        from: js-04-01-arrays-basics
        prompt:
          uk: "Що виведуть ці два рядки?"
          en: "What do these two lines print?"
        code: |
          const habits = [];
          console.log(habits.length);
          console.log(habits[0]);
        verify:
          logs: ["0", "undefined"]
        answer:
          type: choice
          options:
            - id: zero-undefined
              text:
                uk: "`0` і `undefined`"
                en: "`0` and `undefined`"
            - id: zero-error
              text:
                uk: "`0`, а потім повідомлення про помилку"
                en: "`0`, then an error message"
              why:
                uk: "Читання індексу, якого немає, не кидає помилки — воно дає `undefined`."
                en: "Reading an index that does not exist throws no error — it gives `undefined`."
            - id: one-undefined
              text:
                uk: "`1` і `undefined`"
                en: "`1` and `undefined`"
              why:
                uk: "`length` — це кількість елементів. У порожньому масиві їх 0."
                en: "`length` is the number of elements. An empty array has 0 of them."
            - id: zero-null
              text:
                uk: "`0` і `null`"
                en: "`0` and `null`"
              why:
                uk: "`null` хтось має покласти в масив свідомо. Місце, якого немає, читається як `undefined`."
                en: "Someone has to put `null` into an array on purpose. A slot that does not exist reads as `undefined`."
          correct: [zero-undefined]
        explanation:
          uk: "Порожній масив — звичайний масив довжиною `0`. Елемента з індексом `0` у ньому немає, тож читання дає `undefined`, без помилки. Тому порожній список завжди варто розглядати окремо — так само, як роблять `some` і `every`."
          en: "An empty array is an ordinary array of length `0`. It has no element at index `0`, so reading it gives `undefined`, with no error. That is why an empty list always deserves a separate thought — just as `some` and `every` give it."

  - id: empty-means
    kind: explanation
    title:
      uk: "Що означає порожній список"
      en: "What an empty list means"
    body:
      uk: |
        `every` насправді шукає **порушника** правила й відповідає `true`, якщо не знайшов жодного. У порожньому списку порушника немає, тому `[].every(...)` дає `true`. Це називають [[vacuous-truth|істинністю «за відсутністю»]]: твердження «усі звички в порожньому списку активні» не має жодного контрприкладу.

        `some` шукає хоча б одне «так». У порожньому списку його немає, тому `[].some(...)` дає `false`.

        > [!warning]
        > У своїх перевірках вирішуй свідомо, що означає порожній список. «Усі витрати підписані» — для порожнього списку справді так. А «кошик готовий до оплати» для порожнього кошика — радше «ні», і це треба перевірити окремо: `list.length > 0 && list.every(...)`.
      en: |
        `every` actually looks for a **rule-breaker** and answers `true` if it finds none. An empty list has no rule-breaker, so `[].every(...)` gives `true`. This is called a [[vacuous-truth|vacuous truth]]: the statement “all habits in the empty list are active” has no counterexample.

        `some` looks for at least one “yes”. An empty list has none, so `[].some(...)` gives `false`.

        > [!warning]
        > In your own checks, decide on purpose what an empty list means. “All expenses are labeled” is indeed true for an empty list. But “the cart is ready to pay” is rather a “no” for an empty cart, and that needs a separate check: `list.length > 0 && list.every(...)`.

  - id: expense-checks
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: expense-checks
    entry: index.js
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
    title:
      uk: "Дві перевірки для витрат"
      en: "Two checks for expenses"
    instructions:
      uk: |
        Допиши дві функції для списку витрат. Суми записано в копійках (`amountMinor`).

        1. `allLabeled(list)` — `true`, якщо **кожна** витрата має непорожню назву (`label` не дорівнює `""`). Порожній список вважай таким, де всі витрати підписані.
        2. `anyOverLimit(list, limitMinor)` — `true`, якщо **хоча б одна** витрата **більша** за `limitMinor`. Рівна межі — ще не більша.

        Обидві функції мають зупинятися, щойно відповідь стала відомою.
      en: |
        Complete two functions for a list of expenses. Amounts are stored in minor units, kopiykas (`amountMinor`).

        1. `allLabeled(list)` — `true` if **every** expense has a non-empty label (`label` is not `""`). Treat an empty list as one where all expenses are labeled.
        2. `anyOverLimit(list, limitMinor)` — `true` if **at least one** expense is **greater** than `limitMinor`. An amount equal to the limit is not greater.

        Both functions must stop as soon as the answer is known.
    testTitles:
      "allLabeled is true when every expense has a label":
        uk: "allLabeled дає true, коли кожна витрата підписана"
        en: "allLabeled is true when every expense has a label"
      "one empty label makes allLabeled false":
        uk: "Одна порожня назва робить allLabeled хибним"
        en: "One empty label makes allLabeled false"
      "an empty list counts as all labeled":
        uk: "Порожній список вважається повністю підписаним"
        en: "An empty list counts as all labeled"
      "allLabeled stops at the first expense without a label":
        uk: "allLabeled зупиняється на першій витраті без назви"
        en: "allLabeled stops at the first expense without a label"
      "anyOverLimit finds an expense above the limit":
        uk: "anyOverLimit знаходить витрату, більшу за межу"
        en: "anyOverLimit finds an expense above the limit"
      "anyOverLimit is false when no amount is above the limit":
        uk: "anyOverLimit дає false, коли жодна сума не більша за межу"
        en: "anyOverLimit is false when no amount is above the limit"
      "an amount equal to the limit is not over it":
        uk: "Сума, що дорівнює межі, — не більша за неї"
        en: "An amount equal to the limit is not over it"
      "an empty list has nothing over the limit":
        uk: "У порожньому списку немає нічого понад межу"
        en: "An empty list has nothing over the limit"
      "anyOverLimit stops at the first expense over the limit":
        uk: "anyOverLimit зупиняється на першій витраті понад межу"
        en: "anyOverLimit stops at the first expense over the limit"
    hints:
      nudge:
        uk: "Яке запитання ставить кожна функція: «чи **всі**…?» чи «чи **хоч одна**…?»"
        en: "Which question does each function ask: “are **all**…?” or “is **at least one**…?”"
      explanation:
        uk: "`allLabeled` — це `every` з умовою `expense.label !== \"\"`. `anyOverLimit` — це `some` з умовою `expense.amountMinor > limitMinor`. Обидва методи самі зупиняються, щойно відповідь відома, і самі правильно відповідають на порожньому списку."
        en: "`allLabeled` is `every` with the condition `expense.label !== \"\"`. `anyOverLimit` is `some` with the condition `expense.amountMinor > limitMinor`. Both methods stop by themselves as soon as the answer is known, and both answer correctly on an empty list."
    solutionNote:
      uk: "`every` шукає першу витрату без назви й на ній зупиняється; не знайшовши, дає `true` — зокрема й для порожнього списку. `some` шукає першу витрату понад межу; `>` не рахує суму, рівну межі."
      en: "`every` looks for the first expense without a label and stops there; finding none, it gives `true` — the empty list included. `some` looks for the first expense over the limit; `>` does not count an amount equal to the limit."
    feedback:
      - when: { test: "one empty label makes allLabeled false" }
        message:
          uk: "`allLabeled` має дати `false`, якщо хоч одна назва порожня. Це `every` (мають пройти всі), а не `some` (досить одного)."
          en: "`allLabeled` must give `false` if even one label is empty. That is `every` (all must pass), not `some` (one is enough)."
      - when: { test: "an empty list counts as all labeled" }
        message:
          uk: "Для порожнього списку `every` відповідає `true`: жодна витрата не порушує правила. Якщо ти додав перевірку `list.length`, прибери її — у цьому завданні порожній список вважається підписаним."
          en: "For an empty list `every` answers `true`: no expense breaks the rule. If you added a `list.length` check, remove it — in this task an empty list counts as labeled."
      - when: { test: "an amount equal to the limit is not over it" }
        message:
          uk: "«Понад межу» означає строго більше: використай `>`, а не `>=`."
          en: "“Over the limit” means strictly greater: use `>`, not `>=`."
      - when: { test: "anyOverLimit stops at the first expense over the limit" }
        message:
          uk: "Відповідь правильна, але функція переглядає більше витрат, ніж потрібно. `some` зупиняється на першому `true`, а `filter` завжди проходить увесь список."
          en: "The answer is right, but the function looks at more expenses than it needs. `some` stops at the first `true`, while `filter` always walks the whole list."
      - when: { test: "allLabeled stops at the first expense without a label" }
        message:
          uk: "Відповідь правильна, але функція не зупиняється на першій витраті без назви. `every` робить це сам: на першому `false` він припиняє перевірку."
          en: "The answer is right, but the function does not stop at the first unlabeled expense. `every` does that by itself: it stops checking at the first `false`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-05
    body:
      uk: "У проєкті `some` і `every` стануть у пригоді для коротких перевірок на зразок «чи є хоч одне ще не отримане бажання» чи «чи всі справи на сьогодні виконані». І щоразу вирішуй, що має означати порожній список."
      en: "In your project, `some` and `every` help with short checks such as “is there at least one wish still wanted” or “are all of today’s tasks done”. And each time, decide what an empty list should mean."
