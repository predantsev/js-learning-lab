id: js-05-01-map
unit: JS-05
title:
  uk: "map: зі списку — новий список"
  en: "map: one list to another"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити новий масив, який повертає `map` для заданої функції, і переконатися, що початковий масив не змінився."
    en: "Predict the new array that `map` returns for a given callback and confirm that the original array is unchanged."
  - uk: "Написати для `map` функцію, яка повертає значення для кожного елемента, і пояснити, чому функція без `return` заповнює результат значеннями `undefined`."
    en: "Write a `map` callback that returns a value for every element, and explain why a callback without `return` fills the result with `undefined`."
prerequisites: [js-03-06-higher-order-callbacks, js-04-10-immutable-updates]
subskills:
  - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: intro }
glossary: [array-map, transformation]
selfCheck: [predict-map, to-labels]

blocks:
  - id: one-for-each
    kind: explanation
    title:
      uk: "Один елемент — один результат"
      en: "One element in, one result out"
    body:
      uk: |
        Часто з одного списку треба зробити інший: з бажань — підписи для сторінки, зі справ — їхні назви, з цін — ціни за дві штуки. Ти вже вмієш робити це циклом: створити порожній масив і на кожному кроці додавати в нього новий елемент через `push`.

        Для такої роботи масиви мають готовий [[array-method|метод]] — [[array-map|map]]:

        ```js
        const prices = [80, 45, 240];
        const forTwo = prices.map((price) => price * 2);
        ```

        `map` отримує твою функцію, викликає її для **кожного** елемента по черзі й складає те, що вона повертає, у **новий** масив тієї самої довжини. Таку роботу — з одних даних зробити нові, не змінюючи старих, — називають [[transformation|перетворенням]].
      en: |
        You often need to turn one list into another: wishes into labels for a page, tasks into their titles, prices into prices for two. You can already do it with a loop: create an empty array and `push` a new element into it on every step.

        Arrays have a ready-made [[array-method|method]] for this job — [[array-map|map]]:

        ```js
        const prices = [80, 45, 240];
        const forTwo = prices.map((price) => price * 2);
        ```

        `map` takes your function, calls it for **every** element in turn and collects what it returns into a **new** array of the same length. Making new data from existing data without changing the original is called a [[transformation]].

  - id: predict-map
    kind: prediction
    prompt:
      uk: "Не запускаючи код, вирішуй: що з’явиться в консолі? Зверни увагу на другий рядок."
      en: "Without running the code, decide: what appears in the console? Pay attention to the second line."
    code: |
      const prices = [80, 45, 240];
      const forTwo = prices.map((price) => price * 2);
      console.log(forTwo);
      console.log(prices);
    verify:
      logs: ["[160, 90, 480]", "[80, 45, 240]"]
    answer:
      type: choice
      options:
        - id: new-and-old
          text:
            uk: "`[160, 90, 480]`, потім `[80, 45, 240]`"
            en: "`[160, 90, 480]`, then `[80, 45, 240]`"
        - id: both-doubled
          text:
            uk: "`[160, 90, 480]` двічі"
            en: "`[160, 90, 480]` twice"
          why:
            uk: "`map` не чіпає масив `prices`: він будує новий масив і повертає його. Старі ціни лишаються такими, як були."
            en: "`map` does not touch the `prices` array: it builds a new array and returns it. The old prices stay as they were."
        - id: nothing-returned
          text:
            uk: "`undefined`, потім `[160, 90, 480]`"
            en: "`undefined`, then `[160, 90, 480]`"
          why:
            uk: "`map` нічого не змінює на місці — він **повертає** новий масив, і ми зберегли його в `forTwo`."
            en: "`map` changes nothing in place — it **returns** a new array, and we stored it in `forTwo`."
        - id: old-twice
          text:
            uk: "`[80, 45, 240]` двічі"
            en: "`[80, 45, 240]` twice"
          why:
            uk: "`map` повертає масив із результатами функції, а не копію початкового: у `forTwo` — подвоєні ціни."
            en: "`map` returns an array of the function’s results, not a copy of the original: `forTwo` holds the doubled prices."
      correct: [new-and-old]
    explanation:
      uk: "`map` викликав функцію тричі — для `80`, `45` і `240` — і склав результати `160`, `90`, `480` у новий масив. Масив `prices` лишився незмінним: `map` створює новий масив, а не переписує старий."
      en: "`map` called the function three times — for `80`, `45` and `240` — and collected the results `160`, `90`, `480` into a new array. The `prices` array stayed unchanged: `map` creates a new array instead of overwriting the old one."

  - id: first-map
    kind: example
    runtime: browser-js
    dir: first-map
    entry: index.js
    title:
      uk: "Запусти map"
      en: "Run map"
    body:
      uk: |
        Запусти програму. Порівняй перший і другий рядки консолі: новий масив і старий.

        Третій рядок показує, що функція в `map` може повертати будь-яке значення — тут `true` або `false` для кожної ціни.
      en: |
        Run the program. Compare the first and the second console lines: the new array and the old one.

        The third line shows that the function in `map` can return any value — here `true` or `false` for every price.
    tryIt:
      uk: "Зміни першу функцію на `(price) => price + 5` і запусти. Потім допиши в кінець `console.log(prices.length, forTwo.length)`: довжини нового й старого масивів завжди однакові."
      en: "Change the first function to `(price) => price + 5` and run. Then add `console.log(prices.length, forTwo.length)` at the end: the new and the old arrays always have the same length."

  - id: recall-callback
    kind: review
    title:
      uk: "Пригадай: функція як значення"
      en: "Recall: a function as a value"
    items:
      - id: fn-or-call
        from: js-03-06-higher-order-callbacks
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const double = (n) => n * 2;
          console.log(typeof double);
          console.log(typeof double(4));
        verify:
          logs: ["function", "number"]
        answer:
          type: choice
          options:
            - id: fn-number
              text:
                uk: "`function`, потім `number`"
                en: "`function`, then `number`"
            - id: number-number
              text:
                uk: "`number` двічі"
                en: "`number` twice"
              why:
                uk: "Без дужок `double` — це сама функція, значення, яке можна передати далі. Викликають її лише дужки: `double(4)`."
                en: "Without brackets, `double` is the function itself — a value you can pass along. Only the brackets call it: `double(4)`."
            - id: fn-fn
              text:
                uk: "`function` двічі"
                en: "`function` twice"
              why:
                uk: "`double(4)` — це виклик: функція виконується й повертає число `8`. `typeof` бачить уже результат."
                en: "`double(4)` is a call: the function runs and returns the number `8`. `typeof` sees the result."
          correct: [fn-number]
        explanation:
          uk: "`double` — функція як значення: її можна передати іншій функції, і та сама вирішить, коли її викликати. `double(4)` — це вже виклик, його значення — число `8`. Нижче `items.map(toLabel)` передає в `map` саму функцію `toLabel` — без дужок після неї."
          en: "`double` is a function used as a value: you can pass it to another function, which decides when to call it. `double(4)` is already a call, and its value is the number `8`. Below, `items.map(toLabel)` hands `map` the function `toLabel` itself — with no brackets after it."

  - id: map-flow
    kind: visual
    visual: pipeline
    title:
      uk: "map крок за кроком: кожен запис → один підпис"
      en: "map step by step: each record → one label"
    textEquivalent:
      uk: "Масив items містить три записи: w-01 з ціною 80, w-02 з ціною 45 і w-05 без ціни (price дорівнює null). map по черзі викликає функцію toLabel для кожного запису й кладе результат у новий масив на ту саму позицію: «w-01: 80», «w-02: 45», «w-05: —». Новий масив має стільки ж елементів, скільки початковий, і той самий порядок; запис без ціни не пропускається, він теж отримує підпис. Масив items після цього не змінюється."
      en: "The items array holds three records: w-01 priced 80, w-02 priced 45 and w-05 without a price (price is null). map calls the toLabel function for each record in turn and puts the result into a new array at the same position: “w-01: 80”, “w-02: 45”, “w-05: —”. The new array has as many elements as the original and the same order; the record without a price is not skipped, it gets a label too. The items array is not changed."
    spec:
      code: |
        const toLabel = (item) =>
          item.id + ": " + (item.price ?? "—");
        const labels = items.map(toLabel);
      input:
        label: { uk: "items — три бажання", en: "items — three wishes" }
        items:
          - { id: "w-01", price: 80 }
          - { id: "w-02", price: 45 }
          - { id: "w-05", price: null }
        caption:
          uk: "На вході — масив `items` із трьох записів. У третього бажання ціни немає: його `price` дорівнює `null`."
          en: "The input is the `items` array of three records. The third wish has no price: its `price` is `null`."
      stages:
        - op: map
          fn: "(item) => item.id + \": \" + (item.price ?? \"—\")"
          label: "toLabel"
          perItem: true
          caption:
            uk: "`map` викликає `toLabel` для запису {index} з {count}: `{item}` → `{result}`. Результат лягає в новий масив на місце №{index} — те саме, що й у запису."
            en: "`map` calls `toLabel` for record {index} of {count}: `{item}` → `{result}`. The result goes into place no. {index} of the new array — the same place the record has."
          summary:
            uk: "Готово: новий масив із трьох рядків — стільки ж елементів і той самий порядок. Запис без ціни не пропущено: він отримав підпис із «—». Масив `items` угорі не змінився."
            en: "Done: a new array of three strings — the same number of elements and the same order. The record without a price was not skipped: it got a label with “—”. The `items` array above is unchanged."
      result:
        label: { uk: "{count} підписи в новому масиві", en: "{count} labels in the new array" }

  - id: predict-no-return
    kind: prediction
    prompt:
      uk: "Тепер у функції є фігурні дужки. Що виведе консоль?"
      en: "Now the function has curly braces. What does the console show?"
    code: |
      const prices = [80, 45, 240];
      const forTwo = prices.map((price) => {
        price * 2;
      });
      console.log(forTwo);
    verify:
      logs: ["[undefined, undefined, undefined]"]
    answer:
      type: choice
      options:
        - id: doubled
          text:
            uk: "`[160, 90, 480]`"
            en: "`[160, 90, 480]`"
          why:
            uk: "Фігурні дужки роблять тіло функції блоком. Із блоку значення повертає лише `return`; без нього функція повертає `undefined`."
            en: "Curly braces turn the function body into a block. Only `return` hands a value out of a block; without it the function returns `undefined`."
        - id: empty
          text:
            uk: "`[]`"
            en: "`[]`"
          why:
            uk: "`map` нічого не викидає: для кожного елемента в новому масиві є місце, навіть якщо функція нічого не повернула."
            en: "`map` never drops anything: every element gets a slot in the new array, even if the function returned nothing."
        - id: undefineds
          text:
            uk: "`[undefined, undefined, undefined]`"
            en: "`[undefined, undefined, undefined]`"
        - id: error
          text:
            uk: "Повідомлення про помилку"
            en: "An error message"
          why:
            uk: "Функція без `return` — не помилка. Вона просто повертає `undefined`, і `map` чесно кладе його в масив."
            en: "A function without `return` is not an error. It simply returns `undefined`, and `map` faithfully puts that into the array."
      correct: [undefineds]
    explanation:
      uk: "`map` викликав функцію тричі. Щоразу вона обчислювала `price * 2`, але нікому цього не віддавала: тіло у фігурних дужках без `return` повертає `undefined`. Тому новий масив — три `undefined`. Довжина та сама, бо `map` не викидає елементів."
      en: "`map` called the function three times. Each time it computed `price * 2` but handed it to no one: a body in curly braces without `return` returns `undefined`. So the new array is three `undefined` values. The length is the same, because `map` drops no elements."

  - id: task-map
    kind: example
    runtime: browser-js
    dir: task-map
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
    title:
      uk: "Справи → назви й позначки"
      en: "Tasks → titles and marks"
    body:
      uk: |
        Перший `map` дістає з кожної справи її назву. Другий мав би перетворити кожну справу на позначку «✓» (виконано) або «·» (ще ні), але в ньому бракує одного слова.

        Запусти й подивись на другий рядок консолі.
      en: |
        The first `map` takes the title out of every task. The second one should turn every task into a mark, “✓” (done) or “·” (not yet), but one word is missing in it.

        Run it and look at the second console line.
    tryIt:
      uk: |
        1. Додай `return` перед тернарним оператором і запусти знову.
        2. Зроби з кожної справи об’єкт: `(task) => ({ id: task.id, label: task.title })`. Потім прибери круглі дужки навколо `{ … }` — редактор повідомить про помилку: без дужок фігурні дужки читаються як тіло функції, а не як об’єкт.
      en: |
        1. Add `return` before the ternary operator and run again.
        2. Turn every task into an object: `(task) => ({ id: task.id, label: task.title })`. Then remove the round brackets around `{ … }` — the editor reports an error: without them the curly braces are read as the function body, not as an object.

  - id: map-rules
    kind: explanation
    title:
      uk: "Три правила map"
      en: "Three rules of map"
    body:
      uk: |
        1. **Функція має повертати значення.** Те, що вона поверне, ляже в новий масив на ту саму позицію. Немає `return` у тілі `{ … }` — буде `undefined`.
        2. **Довжина не змінюється.** `map` не викидає елементів і не додає нових. Щоб відібрати лише частину елементів, є інший метод — про нього піде мова в наступному уроці.
        3. **Початковий масив лишається як був.** Але якщо функція сама змінить запис (`task.done = true`), зміниться й об’єкт у початковому списку: це ті самі об’єкти. Тому функція для `map` лише **читає** запис і **повертає** нове значення.

        > [!tip]
        > Щоб стрілкова функція повернула об’єкт, візьми його в круглі дужки: `(task) => ({ id: task.id })`.
      en: |
        1. **The function must return a value.** Whatever it returns goes into the new array at the same position. No `return` in a `{ … }` body means `undefined`.
        2. **The length stays the same.** `map` drops no elements and adds none. To keep only some of the elements there is another method — that is the next lesson.
        3. **The original array stays as it was.** But if the function itself changes a record (`task.done = true`), the object in the original list changes too: they are the same objects. So a function for `map` only **reads** the record and **returns** a new value.

        > [!tip]
        > To make an arrow function return an object, wrap the object in round brackets: `(task) => ({ id: task.id })`.

  - id: to-labels
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: to-labels
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      noPrice: { uk: "без ціни", en: "no price" }
    title:
      uk: "Підписи для бажань"
      en: "Labels for wishes"
    instructions:
      uk: |
        Допиши функцію `toLabels(list)`. Вона повертає **новий масив** підписів — по одному на кожне бажання.

        - Підпис — це назва, двокрапка, пробіл і ціна: `Настільна лампа: 45`.
        - Якщо ціни немає (`null`), замість неї напиши слова «без ціни»: `Квитки на концерт: без ціни`.
        - Самі записи змінювати не можна.

        Використай `map`. Натисни **Запустити**, щоб побачити результат, і **Перевірити**, коли будеш готовий.
      en: |
        Complete the function `toLabels(list)`. It returns a **new array** of labels — one for every wish.

        - A label is the name, a colon, a space and the price: `Desk lamp: 45`.
        - If there is no price (`null`), write the words “no price” instead: `Concert tickets: no price`.
        - The records themselves must not change.

        Use `map`. Press **Run** to see the result and **Check** when you are ready.
    testTitles:
      "returns an array with one label per item":
        uk: "Повертає масив, у якому по одному підпису на кожне бажання"
        en: "Returns an array with one label per wish"
      "a label is the name, a colon and the price":
        uk: "Підпис — це назва, двокрапка й ціна"
        en: "A label is the name, a colon and the price"
      "an item without a price gets the no-price words":
        uk: "Бажання без ціни отримує слова «без ціни»"
        en: "A wish without a price gets the words “no price”"
      "a price of 0 is shown as 0":
        uk: "Ціна 0 показується як 0"
        en: "A price of 0 is shown as 0"
      "an empty list gives an empty array":
        uk: "Порожній список дає порожній масив"
        en: "An empty list gives an empty array"
      "the items themselves are not changed":
        uk: "Самі записи не змінюються"
        en: "The records themselves are not changed"
    hints:
      nudge:
        uk: "Подивись на функцію `toLabel` у візуалізації вище: вона робить майже те саме для одного запису."
        en: "Look at the `toLabel` function in the visual above: it does almost the same for one record."
      explanation:
        uk: "Усередині `toLabels` поверни результат `list.map(...)`. Функція для `map` отримує один запис і повертає рядок: `item.name + \": \" + …`. Замість ціни, якої немає, підстав слова «без ціни». Найкоротше це зробити через `??`: він замінює лише `null` і `undefined`, а `0` залишає."
        en: "Inside `toLabels`, return the result of `list.map(...)`. The function for `map` receives one record and returns a string: `item.name + \": \" + …`. Put the words “no price” in place of a missing price. The shortest way is `??`: it replaces only `null` and `undefined` and keeps `0`."
    solutionNote:
      uk: "`map` викликає стрілкову функцію для кожного бажання й складає рядки в новий масив, а `return` віддає цей масив із `toLabels`. `??` підставляє «без ціни» лише замість `null`, тож річ із ціною `0` показується чесно: `0`."
      en: "`map` calls the arrow function for every wish and collects the strings into a new array, and `return` hands that array out of `toLabels`. `??` puts in “no price” only instead of `null`, so an item priced `0` is shown honestly: `0`."
    feedback:
      - when: { test: "returns an array with one label per item" }
        message:
          uk: "`toLabels` поки нічого не повертає (або повертає не масив). Напиши `return` перед `list.map(...)`: `map` будує новий масив, а `return` віддає його тому, хто викликав `toLabels`."
          en: "`toLabels` returns nothing yet (or not an array). Write `return` before `list.map(...)`: `map` builds the new array, and `return` hands it to whoever called `toLabels`."
      - when: { test: "a label is the name, a colon and the price" }
        message:
          uk: "Перевір функцію всередині `map`: вона має повертати рядок на зразок «Настільна лампа: 45». Якщо в ній фігурні дужки `{ }`, усередині потрібен `return`."
          en: "Check the function inside `map`: it must return a string such as “Desk lamp: 45”. If it has curly braces `{ }`, it needs a `return` inside them."
      - when: { test: "a price of 0 is shown as 0" }
        message:
          uk: "Ціна `0` перетворилася на «без ціни»? Це пастка `||`: він замінює будь-яке хибне значення, зокрема `0`. Візьми `??` — він замінює лише `null` і `undefined`."
          en: "Did the price `0` turn into “no price”? That is the `||` trap: it replaces every falsy value, `0` included. Use `??` — it replaces only `null` and `undefined`."
      - when: { test: "the items themselves are not changed" }
        message:
          uk: "Функція змінює самі записи (наприклад, `item.label = …`). Функція для `map` має лише читати запис і повертати нове значення."
          en: "The function changes the records themselves (for example, `item.label = …`). A function for `map` should only read the record and return a new value."
      - when: { error: TypeError }
        message:
          uk: "Програма зупинилася з `TypeError`. Найчастіша причина тут — у `map` передано не функцію, а результат виклику. Передавай саму функцію: `list.map((item) => …)`."
          en: "The program stopped with a `TypeError`. The most common cause here is passing `map` the result of a call instead of a function. Pass the function itself: `list.map((item) => …)`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-05
    body:
      uk: "Наприкінці розділу ти показуватимеш на сторінці результати пошуку, фільтра й сортування свого проєкту. Перетворити записи на рядки для показу допоможе саме `map` — і жоден запис при цьому не зміниться."
      en: "At the end of this unit you will show the results of your project’s search, filter and sort on the page. `map` is what turns the records into strings for display — without changing a single record."
