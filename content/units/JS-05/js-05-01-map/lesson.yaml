id: js-05-01-map
unit: JS-05
title:
  uk: "map: зі списку — новий список"
  en: "map: one list to another"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити новий масив, який повертає `map` для заданої функції, і переконатися, що початковий масив не змінився."
    en: "Predict the new array that `map` returns for a given callback and confirm that the original array is unchanged."
  - uk: "Написати для `map` функцію, яка повертає значення для кожного елемента, і пояснити, чому функція без `return` заповнює результат значеннями `undefined`."
    en: "Write a `map` callback that returns a value for every element, and explain why a callback without `return` fills the result with `undefined`."
prerequisites: [js-03-06-higher-order-callbacks, js-04-10-immutable-updates]
subskills:
  - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: intro }
glossary: [array-map, transformation]
selfCheck: [predict-map, to-labels]

blocks:
  - id: one-for-each
    kind: explanation
    title:
      uk: "Один елемент — один результат"
      en: "One element in, one result out"
    body:
      uk: |
        Часто з одного списку треба зробити інший: з бажань — підписи для сторінки, зі справ — їхні назви, з цін — ціни за дві штуки. Ти вже вмієш робити це циклом: створити порожній масив і на кожному кроці додавати в нього новий елемент через `push`.

        Для такої роботи масиви мають готовий [[array-method|метод]] — [[array-map|map]]:

        ```js
        const prices = [80, 45, 240];
        const forTwo = prices.map((price) => price * 2);
        ```

        `map` отримує твою функцію, викликає її для **кожного** елемента по черзі й складає те, що вона повертає, у **новий** масив тієї самої довжини. Таку роботу — з одних даних зробити нові, не змінюючи старих, — називають [[transformation|перетворенням]].
      en: |
        You often need to turn one list into another: wishes into labels for a page, tasks into their titles, prices into prices for two. You can already do it with a loop: create an empty array and `push` a new element into it on every step.

        Arrays have a ready-made [[array-method|method]] for this job — [[array-map|map]]:

        ```js
        const prices = [80, 45, 240];
        const forTwo = prices.map((price) => price * 2);
        ```

        `map` takes your function, calls it for **every** element in turn and collects what it returns into a **new** array of the same length. Making new data from existing data without changing the original is called a [[transformation]].

  - id: predict-map
    kind: prediction
    prompt:
      uk: "Не запускаючи код, вирішуй: що з’явиться в консолі? Зверни увагу на другий `console.log`."
      en: "Without running the code, decide: what appears in the console? Pay attention to the second `console.log`."
    code: |
      const prices = [80, 45, 240];
      const forTwo = prices.map((price) => price * 2);
      console.log(forTwo);
      console.log(prices);
    verify:
      logs: ["[160, 90, 480]", "[80, 45, 240]"]
    answer:
      type: choice
      options:
        - id: new-and-old
          text:
            uk: "`[160, 90, 480]`, потім `[80, 45, 240]`"
            en: "`[160, 90, 480]`, then `[80, 45, 240]`"
        - id: both-doubled
          text:
            uk: "`[160, 90, 480]` двічі"
            en: "`[160, 90, 480]` twice"
          why:
            uk: "`map` не чіпає масив `prices`: він будує новий масив і повертає його. Старі ціни лишаються такими, як були."
            en: "`map` does not touch the `prices` array: it builds a new array and returns it. The old prices stay as they were."
        - id: nothing-returned
          text:
            uk: "`undefined`, потім `[160, 90, 480]`"
            en: "`undefined`, then `[160, 90, 480]`"
          why:
            uk: "`map` нічого не змінює в масиві `prices` — він **повертає** новий масив, і ми зберегли його в `forTwo`."
            en: "`map` changes nothing inside the `prices` array — it **returns** a new array, and we stored it in `forTwo`."
        - id: old-twice
          text:
            uk: "`[80, 45, 240]` двічі"
            en: "`[80, 45, 240]` twice"
          why:
            uk: "`map` повертає масив із результатами функції, а не копію початкового: у `forTwo` — подвоєні ціни."
            en: "`map` returns an array of the function’s results, not a copy of the original: `forTwo` holds the doubled prices."
      correct: [new-and-old]
    explanation:
      uk: "`map` викликав функцію тричі — для `80`, `45` і `240` — і склав результати `160`, `90`, `480` у новий масив. Масив `prices` лишився незмінним: `map` створює новий масив, а не переписує старий."
      en: "`map` called the function three times — for `80`, `45` and `240` — and collected the results `160`, `90`, `480` into a new array. The `prices` array stayed unchanged: `map` creates a new array instead of overwriting the old one."

  - id: first-map
    kind: example
    runtime: browser-js
    dir: first-map
    entry: index.js
    title:
      uk: "Запусти map"
      en: "Run map"
    body:
      uk: |
        Запусти програму. Порівняй перший і другий рядки консолі: новий масив і старий.

        Третій рядок консолі показує, що функція в `map` може повертати будь-яке значення — тут `true` або `false` для кожної ціни.
      en: |
        Run the program. Compare the first and the second console lines: the new array and the old one.

        The third console line shows that the function in `map` can return any value — here `true` or `false` for every price.
    tryIt:
      uk: "Зміни першу функцію на `(price) => price + 5` і запусти. Потім допиши в кінець `console.log(prices.length, forTwo.length)`: довжини нового й старого масивів завжди однакові."
      en: "Change the first function to `(price) => price + 5` and run. Then add `console.log(prices.length, forTwo.length)` at the end: the new and the old arrays always have the same length."

  - id: recall-callback
    kind: review
    title:
      uk: "Пригадай: функція як значення"
      en: "Recall: a function as a value"
    items:
      - id: fn-or-call
        from: js-03-06-higher-order-callbacks
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const double = (n) => n * 2;
          console.log(typeof double);
          console.log(typeof double(4));
        verify:
          logs: ["function", "number"]
        answer:
          type: choice
          options:
            - id: fn-number
              text:
                uk: "`function`, потім `number`"
                en: "`function`, then `number`"
            - id: number-number
              text:
                uk: "`number` двічі"
                en: "`number` twice"
              why:
                uk: "Без дужок `double` — це сама функція, значення, яке можна передати далі. Викликають її лише дужки: `double(4)`."
                en: "Without brackets, `double` is the function itself — a value you can pass along. Only the brackets call it: `double(4)`."
            - id: fn-fn
              text:
                uk: "`function` двічі"
                en: "`function` twice"
              why:
                uk: "`double(4)` — це виклик: функція виконується й повертає число `8`. `typeof` бачить уже результат."
                en: "`double(4)` is a call: the function runs and returns the number `8`. `typeof` sees the result."
          correct: [fn-number]
        explanation:
          uk: "`double` — функція як значення: її можна передати іншій функції, і та сама вирішить, коли її викликати. `double(4)` — це вже виклик, його значення — число `8`. Саме так `items.map(toLabel)` передає в `map` саму функцію `toLabel` — без дужок після неї."
          en: "`double` is a function used as a value: you can pass it to another function, which decides when to call it. `double(4)` is already a call, and its value is the number `8`. That is how `items.map(toLabel)` hands `map` the function `toLabel` itself — with no brackets after it."

  - id: map-flow
    kind: visual
    visual: pipeline
    title:
      uk: "map крок за кроком: кожен запис → один підпис"
      en: "map step by step: each record → one label"
    textEquivalent:
      uk: "Масив items містить три записи: w-01 з ціною 80, w-02 з ціною 45 і w-05 без ціни (price дорівнює null). map по черзі викликає функцію toLabel для кожного запису й кладе результат у новий масив на ту саму позицію: «w-01: 80», «w-02: 45», «w-05: null». Новий масив має стільки ж елементів, скільки початковий, і той самий порядок. Запис без ціни не пропускається: він теж отримує підпис, хоч і невдалий — у ньому видно слово null. Масив items після цього не змінюється."
      en: "The items array holds three records: w-01 priced 80, w-02 priced 45 and w-05 without a price (price is null). map calls the toLabel function for each record in turn and puts the result into a new array at the same position: “w-01: 80”, “w-02: 45”, “w-05: null”. The new array has as many elements as the original and the same order. The record without a price is not skipped: it gets a label too, though an unfortunate one — the word null shows in it. The items array is not changed."
    spec:
      code: |
        const toLabel = (item) =>
          item.id + ": " + item.price;
        const labels = items.map(toLabel);
      input:
        label: { uk: "items — три бажання", en: "items — three wishes" }
        items:
          - { id: "w-01", price: 80 }
          - { id: "w-02", price: 45 }
          - { id: "w-05", price: null }
        caption:
          uk: "На вході — масив `items` із трьох записів. У третього бажання ціни немає: його `price` дорівнює `null`."
          en: "The input is the `items` array of three records. The third wish has no price: its `price` is `null`."
      stages:
        - op: map
          fn: "(item) => item.id + \": \" + item.price"
          label: "toLabel"
          perItem: true
          caption:
            uk: "`map` викликає `toLabel` для запису {index} з {count}: `{item}` → `{result}`. Результат лягає в новий масив на ту саму позицію, що й запис."
            en: "`map` calls `toLabel` for record {index} of {count}: `{item}` → `{result}`. The result goes into the new array at the same position as the record."
          summary:
            uk: "Готово: новий масив із трьох підписів — стільки ж елементів і той самий порядок. Запис без ціни не пропущено: він теж отримав підпис, хоч і невдалий — «w-05: null». Масив `items` угорі не змінився."
            en: "Done: a new array of three labels — the same number of elements and the same order. The record without a price was not skipped: it got a label too, though an unfortunate one — “w-05: null”. The `items` array above is unchanged."
      result:
        label: { uk: "{count} підписи в новому масиві", en: "{count} labels in the new array" }

  - id: predict-no-return
    kind: prediction
    prompt:
      uk: "Тіло цієї функції — у фігурних дужках. Що виведе консоль?"
      en: "This function’s body is in curly braces. What does the console show?"
    code: |
      const prices = [80, 45, 240];
      const forTwo = prices.map((price) => {
        price * 2;
      });
      console.log(forTwo);
    verify:
      logs: ["[undefined, undefined, undefined]"]
    answer:
      type: choice
      options:
        - id: doubled
          text:
            uk: "`[160, 90, 480]`"
            en: "`[160, 90, 480]`"
          why:
            uk: "Фігурні дужки роблять тіло функції блоком. Із блоку значення повертає лише `return`; без нього функція повертає `undefined`."
            en: "Curly braces turn the function body into a block. Only `return` hands a value out of a block; without it the function returns `undefined`."
        - id: empty
          text:
            uk: "`[]`"
            en: "`[]`"
          why:
            uk: "`map` нічого не викидає: для кожного елемента в новому масиві є місце, навіть якщо функція нічого не повернула."
            en: "`map` never drops anything: every element gets a slot in the new array, even if the function returned nothing."
        - id: undefineds
          text:
            uk: "`[undefined, undefined, undefined]`"
            en: "`[undefined, undefined, undefined]`"
        - id: error
          text:
            uk: "Повідомлення про помилку"
            en: "An error message"
          why:
            uk: "Функція без `return` — не помилка. Вона просто повертає `undefined`, і `map` чесно кладе його в масив."
            en: "A function without `return` is not an error. It simply returns `undefined`, and `map` faithfully puts that into the array."
      correct: [undefineds]
    explanation:
      uk: "`map` викликав функцію тричі. Щоразу вона обчислювала `price * 2`, але нікому цього не віддавала: тіло у фігурних дужках без `return` повертає `undefined`. Тому новий масив — три `undefined`. Довжина та сама, бо `map` не викидає елементів."
      en: "`map` called the function three times. Each time it computed `price * 2` but handed it to no one: a body in curly braces without `return` returns `undefined`. So the new array is three `undefined` values. The length is the same, because `map` drops no elements."

  - id: task-map
    kind: example
    runtime: browser-js
    dir: task-map
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
    title:
      uk: "Справи → назви й позначки"
      en: "Tasks → titles and marks"
    body:
      uk: |
        Перший `map` дістає з кожної справи її назву. Другий мав би перетворити кожну справу на позначку «✓» (виконано) або «·» (ще ні), але в ньому бракує одного слова.

        Запусти й подивись на другий рядок консолі.
      en: |
        The first `map` takes the title out of every task. The second one should turn every task into a mark, “✓” (done) or “·” (not yet), but one word is missing in it.

        Run it and look at the second console line.
    tryIt:
      uk: |
        1. Додай `return` перед тернарним оператором у другому `map` і запусти знову.
        2. У першому `map` заміни функцію на `(task) => ({ id: task.id, label: task.title })` і запусти: тепер кожна справа перетворюється на об’єкт.
        3. Прибери круглі дужки навколо `{ … }` і запусти. З’явиться картка «Код не вдалося запустити»: без круглих дужок фігурні читаються як тіло функції, а не як об’єкт. Поверни круглі дужки на місце.
      en: |
        1. Add `return` before the ternary operator in the second `map` and run again.
        2. In the first `map`, replace the function with `(task) => ({ id: task.id, label: task.title })` and run: now every task turns into an object.
        3. Remove the round brackets around `{ … }` and run. The card “The code could not start” appears: without the round brackets the curly braces are read as the function body, not as an object. Put the round brackets back.

  - id: map-rules
    kind: explanation
    title:
      uk: "Три правила map"
      en: "Three rules of map"
    body:
      uk: |
        1. **Функція має повертати значення.** Те, що вона поверне, ляже в новий масив на ту саму позицію. Немає `return` у тілі `{ … }` — буде `undefined`.
        2. **Довжина не змінюється.** `map` не викидає елементів і не додає нових. Щоб відібрати лише частину елементів, є інший метод — про нього піде мова в наступному уроці.
        3. **Початковий масив лишається як був.** Але якщо функція сама змінить запис (`task.done = true`), зміниться й об’єкт у початковому списку: це ті самі об’єкти. Тому функція для `map` лише **читає** запис і **повертає** нове значення.

        > [!tip]
        > Щоб стрілкова функція повернула об’єкт, візьми його в круглі дужки: `(task) => ({ id: task.id })`.
      en: |
        1. **The function must return a value.** Whatever it returns goes into the new array at the same position. No `return` in a `{ … }` body means `undefined`.
        2. **The length stays the same.** `map` drops no elements and adds none. To keep only some of the elements there is another method — that is the next lesson.
        3. **The original array stays as it was.** But if the function itself changes a record (`task.done = true`), the object in the original list changes too: they are the same objects. So a function for `map` only **reads** the record and **returns** a new value.

        > [!tip]
        > To make an arrow function return an object, wrap the object in round brackets: `(task) => ({ id: task.id })`.

  - id: to-labels
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: to-labels
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      noPrice: { uk: "без ціни", en: "no price" }
    title:
      uk: "Підписи для бажань"
      en: "Labels for wishes"
    instructions:
      uk: |
        Допиши функцію `toLabels(list)`. Вона повертає **новий масив** підписів — по одному на кожне бажання.

        - Підпис — це назва, двокрапка, пробіл і ціна: `Настільна лампа: 45`.
        - Якщо ціни немає (`null`), замість неї напиши слова «без ціни»: `Квитки на концерт: без ціни`.
        - Самі записи змінювати не можна.

        Використай `map`. Натисни **Запустити**, щоб побачити результат, і **Перевірити**, коли будеш готовий.
      en: |
        Complete the function `toLabels(list)`. It returns a **new array** of labels — one for every wish.

        - A label is the name, a colon, a space and the price: `Desk lamp: 45`.
        - If there is no price (`null`), write the words “no price” instead: `Concert tickets: no price`.
        - The records themselves must not change.

        Use `map`. Press **Run** to see the result and **Check** when you are ready.
    testTitles:
      "returns an array with one label per item":
        uk: "Повертає масив, у якому по одному підпису на кожне бажання"
        en: "Returns an array with one label per wish"
      "a label is the name, a colon and the price":
        uk: "Підпис — це назва, двокрапка й ціна"
        en: "A label is the name, a colon and the price"
      "an item without a price gets the no-price words":
        uk: "Бажання без ціни отримує слова «без ціни»"
        en: "A wish without a price gets the words “no price”"
      "a price of 0 is shown as 0":
        uk: "Ціна 0 показується як 0"
        en: "A price of 0 is shown as 0"
      "an empty list gives an empty array":
        uk: "Порожній список дає порожній масив"
        en: "An empty list gives an empty array"
      "the items themselves are not changed":
        uk: "Самі записи не змінюються"
        en: "The records themselves are not changed"
    hints:
      nudge:
        uk: "У візуалізації `map` дав підпис і запису без ціни, але вийшло «w-05: null». Що треба зробити з `null` ще до того, як склеювати текст?"
        en: "In the visual, `map` gave the record without a price a label too, but it came out as “w-05: null”. What should happen to `null` before the text is joined?"
      explanation:
        uk: |
          `toLabels` повертає те, що поверне `list.map(...)`, а функція для `map` отримує один запис і повертає його підпис. Відсутнє значення замінюй ще до склеювання. Ось та сама ідея для книжок, у яких може бути невідомий автор:

          ```js
          const toCaption = (book) => book.title + " — " + (book.author ?? "автор невідомий");
          ```

          `??` замінює лише `null` і `undefined`, а `0` залишає — на відміну від `||`. Круглі дужки потрібні, бо `+` виконується раніше за `??`.
        en: |
          `toLabels` returns whatever `list.map(...)` returns, and the function for `map` receives one record and returns its label. Replace a missing value before joining the text. Here is the same idea for books whose author may be unknown:

          ```js
          const toCaption = (book) => book.title + " — " + (book.author ?? "unknown author");
          ```

          `??` replaces only `null` and `undefined` and keeps `0` — unlike `||`. The round brackets are needed because `+` runs before `??`.
    solutionNote:
      uk: "`map` викликає стрілкову функцію для кожного бажання й складає підписи в новий масив, а `return` віддає цей масив із `toLabels`. `??` підставляє «без ціни» лише замість `null`, тож річ із ціною `0` показується чесно: `0`. Дужки навколо `item.price ?? …` потрібні, бо інакше `??` застосувався б до вже склеєного тексту."
      en: "`map` calls the arrow function for every wish and collects the labels into a new array, and `return` hands that array out of `toLabels`. `??` puts in “no price” only instead of `null`, so an item priced `0` is shown honestly: `0`. The brackets around `item.price ?? …` are needed; otherwise `??` would apply to the already joined text."
    feedback:
      - when: { test: "returns an array with one label per item" }
        message:
          uk: "Ця перевірка викликає `toLabels` для трьох бажань і чекає масив із трьох підписів. Якщо консоль показує `undefined`, функції бракує `return` перед `list.map(...)`: `map` будує новий масив, а `return` віддає його тому, хто викликав `toLabels`."
          en: "This check calls `toLabels` for three wishes and expects an array of three labels. If the console shows `undefined`, the function is missing `return` before `list.map(...)`: `map` builds the new array, and `return` hands it to whoever called `toLabels`."
      - when: { test: "a label is the name, a colon and the price" }
        message:
          uk: "Ця перевірка чекає, що перший підпис — «Настільна лампа: 45»: назва, двокрапка, пробіл і ціна. Якщо на його місці `undefined`, а тіло функції для `map` у фігурних дужках `{ }`, усередині бракує `return`."
          en: "This check expects the first label to be “Desk lamp: 45”: the name, a colon, a space and the price. If you see `undefined` there and the body of the function for `map` is in curly braces `{ }`, it is missing a `return`."
      - when: { test: "an item without a price gets the no-price words" }
        message:
          uk: "Ця перевірка чекає підпис «Квитки на концерт: без ціни». Якщо бачиш «: null», то `null` потрапив у текст: заміни відсутню ціну ще до склеювання й візьми цю заміну в круглі дужки, бо `+` виконується раніше за `??`."
          en: "This check expects the label “Concert tickets: no price”. If you see “: null”, the `null` got into the text: replace the missing price before joining and put that replacement in round brackets, because `+` runs before `??`."
      - when: { test: "a price of 0 is shown as 0" }
        message:
          uk: "Ця перевірка чекає підпис «Навушники: 0»: ціна `0` — справжня ціна, а не її відсутність. Якщо замість `0` бачиш «без ціни», це пастка `||`: він замінює будь-яке хибне значення, зокрема `0`, а `??` — лише `null` і `undefined`."
          en: "This check expects the label “Headphones: 0”: a price of `0` is a real price, not a missing one. If you see “no price” instead of `0`, that is the `||` trap: it replaces every falsy value, `0` included, while `??` replaces only `null` and `undefined`."
      - when: { test: "the items themselves are not changed" }
        message:
          uk: "Ця перевірка порівнює записи до й після виклику `toLabels`: вони мають лишитися такими самими. Функція для `map` лише читає запис і повертає нове значення, а присвоєння на зразок `item.label = …` змінює спільний запис."
          en: "This check compares the records before and after calling `toLabels`: they must stay the same. A function for `map` only reads the record and returns a new value, while an assignment such as `item.label = …` changes the shared record."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` означає, що код звернувся до того, чого немає. Прочитай оригінальне повідомлення: якщо там «… is not a function», то в `map` передано результат виклику, а не саму функцію (`list.map((item) => …)`); якщо «Cannot read properties of null», то поле читають у `null`, наприклад у ціни, якої немає."
          en: "A `TypeError` means the code reached for something that is not there. Read the original message: if it says “… is not a function”, `map` received the result of a call instead of the function itself (`list.map((item) => …)`); if it says “Cannot read properties of null”, a field is being read from `null`, for example from a missing price."

  - id: to-project
    kind: transfer
    capstoneStep: JS-05
    body:
      uk: "Наприкінці розділу ти показуватимеш на сторінці результати пошуку, фільтра й сортування свого проєкту. Перетворити записи на підписи для показу допоможе саме `map` — і жоден запис при цьому не зміниться."
      en: "At the end of this unit you will show the results of your project’s search, filter and sort on the page. `map` is what turns the records into labels for display — without changing a single record."
