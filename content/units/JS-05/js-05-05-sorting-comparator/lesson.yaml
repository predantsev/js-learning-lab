id: js-05-05-sorting-comparator
unit: JS-05
title:
  uk: "Сортування з компаратором"
  en: "Sorting with a comparator"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Писати компаратори, що повертають від’ємне число, нуль або додатне число для числових і текстових полів (`localeCompare`) та для полів, у яких може бути `null` (такі записи — у кінець)."
    en: "Write comparators that return a negative number, zero or a positive number for numeric fields, text fields (`localeCompare`) and fields that may be `null` (those records go last)."
  - uk: "Пояснити, що `sort` переставляє елементи в самому масиві, і сортувати копію (`[...list].sort` або `toSorted`)."
    en: "Explain that `sort` reorders the array in place, and sort a copy (`[...list].sort` or `toSorted`) instead."
  - uk: "Передбачити, що записи з однаковим ключем зберігають початковий порядок, бо сортування стабільне."
    en: "Predict that records with equal keys keep their original order because sorting is stable."
prerequisites: [js-05-04-reduce, js-04-10-immutable-updates]
subskills:
  - { family: J-05, skill: "sorting comparator and stable ordering", depth: intro }
glossary: [comparator, stable-sort, in-place-sort]
selfCheck: [predict-default, predict-stable, sort-wishes]

blocks:
  - id: sort-needs-rule
    kind: explanation
    title:
      uk: "sort і правило порівняння"
      en: "sort and the comparison rule"
    body:
      uk: |
        `sort` розставляє елементи масиву по порядку. Але який порядок правильний — за ціною, за назвою, за датою? Це вирішуєш ти: передаєш [[comparator|компаратор]] — функцію, яка порівнює **два** елементи, `a` і `b`, і повертає число:

        | Компаратор повертає | Це означає |
        |---|---|
        | від’ємне число | `a` має стояти раніше за `b` |
        | додатне число | `b` має стояти раніше за `a` |
        | `0` | для порядку вони рівні |

        Для чисел за зростанням підходить `(a, b) => a - b`: коли `a` менше, різниця від’ємна, і `a` стає раніше.
      en: |
        `sort` puts the elements of an array in order. But which order is right — by price, by name, by date? You decide that by passing a [[comparator]] — a function that compares **two** elements, `a` and `b`, and returns a number:

        | The comparator returns | It means |
        |---|---|
        | a negative number | `a` must come before `b` |
        | a positive number | `b` must come before `a` |
        | `0` | they are equal for the order |

        For numbers in ascending order `(a, b) => a - b` works: when `a` is smaller, the difference is negative, and `a` goes first.

  - id: predict-default
    kind: prediction
    prompt:
      uk: "Що виведе консоль? Тут два виклики `sort`: без компаратора й з ним."
      en: "What does the console show? There are two `sort` calls here: without a comparator and with one."
    code: |
      const prices = [10, 9, 100];
      const sorted = prices.sort();
      console.log(sorted);
      console.log(prices);
      console.log([10, 9, 100].sort((a, b) => a - b));
    verify:
      logs: ["[10, 100, 9]", "[10, 100, 9]", "[9, 10, 100]"]
    answer:
      type: choice
      options:
        - id: text-order-in-place
          text:
            uk: "`[10, 100, 9]`, `[10, 100, 9]`, `[9, 10, 100]`"
            en: "`[10, 100, 9]`, `[10, 100, 9]`, `[9, 10, 100]`"
        - id: numeric-copy
          text:
            uk: "`[9, 10, 100]`, `[10, 9, 100]`, `[9, 10, 100]`"
            en: "`[9, 10, 100]`, `[10, 9, 100]`, `[9, 10, 100]`"
          why:
            uk: "Тут дві помилки. Без компаратора `sort` порівнює числа як текст: `\"100\"` стає перед `\"9\"`, бо символ `\"1\"` менший за `\"9\"`. І `sort` не робить копії: він переставляє елементи в самому масиві `prices`."
            en: "Two mistakes here. Without a comparator, `sort` compares numbers as text: `\"100\"` comes before `\"9\"` because the character `\"1\"` is less than `\"9\"`. And `sort` makes no copy: it rearranges the elements inside `prices` itself."
        - id: numeric-everywhere
          text:
            uk: "`[9, 10, 100]` тричі"
            en: "`[9, 10, 100]` three times"
          why:
            uk: "Без компаратора `sort` перетворює елементи на текст і порівнює його символ за символом: `\"10\"`, `\"100\"`, `\"9\"`."
            en: "Without a comparator, `sort` turns the elements into text and compares it character by character: `\"10\"`, `\"100\"`, `\"9\"`."
        - id: text-order-copy
          text:
            uk: "`[10, 100, 9]`, `[10, 9, 100]`, `[9, 10, 100]`"
            en: "`[10, 100, 9]`, `[10, 9, 100]`, `[9, 10, 100]`"
          why:
            uk: "`sort` змінює сам масив і повертає його ж: `sorted` і `prices` — це один і той самий масив."
            en: "`sort` changes the array itself and returns that same array: `sorted` and `prices` are one and the same array."
      correct: [text-order-in-place]
    explanation:
      uk: "Без компаратора `sort` перетворює числа на текст і порівнює його символ за символом, за кодами символів: `\"1\"` іде раніше за `\"9\"`, тому порядок — `\"10\"`, `\"100\"`, `\"9\"`. До того ж `sort` переставляє елементи **в самому** масиві й повертає той самий масив, тож змінився й `prices`. З компаратором `(a, b) => a - b` порядок числовий: `[9, 10, 100]`."
      en: "Without a comparator, `sort` turns numbers into text and compares it character by character, by character codes: `\"1\"` comes before `\"9\"`, so the order is `\"10\"`, `\"100\"`, `\"9\"`. Besides, `sort` rearranges the elements **inside** the array and returns that same array, so `prices` changed too. With the comparator `(a, b) => a - b` the order is numeric: `[9, 10, 100]`."

  - id: try-numbers
    kind: example
    runtime: browser-js
    dir: try-numbers
    entry: index.js
    title:
      uk: "Ціни за зростанням"
      en: "Prices in ascending order"
    body:
      uk: "Компаратор `(a, b) => a - b` сортує ціни за зростанням. Зверни увагу на другий і третій рядки консолі: що сталося з масивом `prices`?"
      en: "The comparator `(a, b) => a - b` sorts the prices in ascending order. Look at the second and third console lines: what happened to the `prices` array?"
    tryIt:
      uk: |
        1. Зміни компаратор на `(a, b) => b - a` — тепер від найдорожчої ціни до найдешевшої.
        2. Прибери компаратор зовсім: `prices.sort()`. Ціни вишикуються як текст, `[18, 240, 25, 45, 80]`, і в `ascending` тепер зовсім не зростання.
        3. Поверни компаратор `(a, b) => a - b`.
      en: |
        1. Change the comparator to `(a, b) => b - a` — now from the most expensive price to the cheapest.
        2. Remove the comparator altogether: `prices.sort()`. The prices line up like text, `[18, 240, 25, 45, 80]`, and `ascending` is not ascending at all now.
        3. Put the comparator `(a, b) => a - b` back.

  - id: recall-new-array
    kind: review
    title:
      uk: "Пригадай: новий масив замість зміненого"
      en: "Recall: a new array instead of a changed one"
    items:
      - id: spread-copy
        from: js-04-10-immutable-updates
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const list = ["t-01", "t-02"];
          const added = [...list, "t-03"];
          console.log(list.length, added.length, list === added);
        verify:
          logs: ["2 3 false"]
        answer:
          type: choice
          options:
            - id: new-array
              text:
                uk: "`2 3 false`"
                en: "`2 3 false`"
            - id: changed-old
              text:
                uk: "`3 3 true`"
                en: "`3 3 true`"
              why:
                uk: "Spread `[...list, …]` створює **новий** масив і старого не чіпає: у `list` так і лишилося два елементи."
                en: "The spread `[...list, …]` creates a **new** array and leaves the old one alone: `list` still has two elements."
            - id: same-array
              text:
                uk: "`2 3 true`"
                en: "`2 3 true`"
              why:
                uk: "Новий масив — це інший об’єкт, тому `===` дає `false`, хоч елементи в них спільні."
                en: "A new array is a different object, so `===` gives `false`, even though they share elements."
          correct: [new-array]
        explanation:
          uk: "`[...list, \"t-03\"]` будує новий масив, а `list` лишається таким, як був. Саме так — новими масивами замість змінених — ти оновлював записи в JS-04. Сортування потребує того самого прийому."
          en: "`[...list, \"t-03\"]` builds a new array, and `list` stays as it was. That is how you updated records in JS-04 — with new arrays instead of changed ones. Sorting needs the same technique."

  - id: copy-and-stable
    kind: explanation
    title:
      uk: "Сортуй копію. Рівні лишаються на місцях"
      en: "Sort a copy. Equal ones stay in place"
    body:
      uk: |
        `sort` — це [[in-place-sort|сортування на місці]]: він переставляє елементи в тому самому масиві й повертає його ж. Якщо цей масив — спільний список записів, ти щойно змінив його для всіх, хто ним користується.

        Тому сортуй **копію** — або через spread, або через `toSorted`, що повертає новий відсортований масив і не чіпає початкового:

        ```js
        const byAmount = [...expenses].sort(
          (a, b) => a.amountMinor - b.amountMinor
        );
        const alsoByAmount = expenses.toSorted(
          (a, b) => a.amountMinor - b.amountMinor
        );
        ```

        І ще одна гарантія: сортування в JavaScript [[stable-sort|стабільне]]. Записи, для яких компаратор повернув `0`, лишаються в тому порядку, у якому були до сортування.
      en: |
        `sort` is an [[in-place-sort|in-place sort]]: it rearranges the elements inside the same array and returns that array. If the array is a shared list of records, you have just changed it for everyone who uses it.

        So sort a **copy** — either with a spread or with `toSorted`, which returns a new sorted array and leaves the original alone:

        ```js
        const byAmount = [...expenses].sort(
          (a, b) => a.amountMinor - b.amountMinor
        );
        const alsoByAmount = expenses.toSorted(
          (a, b) => a.amountMinor - b.amountMinor
        );
        ```

        One more guarantee: sorting in JavaScript is [[stable-sort|stable]]. Records for which the comparator returned `0` stay in the order they had before sorting.

  - id: predict-stable
    kind: prediction
    prompt:
      uk: "Два бажання коштують по 80, два — по 45. У якому порядку вийдуть `id`?"
      en: "Two wishes cost 80 each and two cost 45 each. In which order do the `id`s come out?"
    code: |
      const items = [
        { id: "w-01", price: 80 },
        { id: "w-02", price: 45 },
        { id: "w-07", price: 80 },
        { id: "w-08", price: 45 },
      ];
      const sorted = items.toSorted((a, b) => a.price - b.price);
      console.log(sorted.map((item) => item.id));
    verify:
      logs: ["[\"w-02\", \"w-08\", \"w-01\", \"w-07\"]"]
    answer:
      type: choice
      options:
        - id: stable
          code: '["w-02", "w-08", "w-01", "w-07"]'
        - id: swapped
          code: '["w-08", "w-02", "w-07", "w-01"]'
          why:
            uk: "Записи з однаковою ціною не міняються місцями: сортування стабільне, тож `w-02` лишається перед `w-08`, як і було в списку."
            en: "Records with an equal price do not swap places: the sort is stable, so `w-02` stays before `w-08`, as it was in the list."
        - id: by-position
          code: '["w-02", "w-01", "w-08", "w-07"]'
          why:
            uk: "Компаратор порівнює ціни, а не позиції: обидва записи по 45 ідуть раніше за обидва записи по 80."
            en: "The comparator compares prices, not positions: both records priced 45 come before both records priced 80."
        - id: random
          text:
            uk: "Порядок рівних щоразу випадковий"
            en: "The order of equal ones is random each time"
          why:
            uk: "Ні: стандарт JavaScript вимагає стабільного сортування (з 2019 року), і сучасні браузери його дотримуються."
            en: "No: the JavaScript standard requires a stable sort (since 2019), and modern browsers follow it."
      correct: [stable]
    explanation:
      uk: "Для однакових цін компаратор повертає `0`, і стабільне сортування лишає такі записи в початковому порядку: `w-02` перед `w-08`, `w-01` перед `w-07`."
      en: "For equal prices the comparator returns `0`, and a stable sort leaves such records in their original order: `w-02` before `w-08`, `w-01` before `w-07`."

  - id: sort-flow
    kind: visual
    visual: pipeline
    title:
      uk: "Два сортування поспіль: за сумою, потім за датою"
      en: "Two sorts in a row: by amount, then by date"
    textEquivalent:
      uk: "Шість витрат записано в такому порядку: e-01 (2026-03-01, 84550), e-02 (2026-03-01, 52000), e-03 (2026-02-28, 18000), e-04 (2026-02-27, 9990), e-05 (2026-02-27, 30000), e-06 (2026-03-02, 21050). Перше сортування з компаратором byAmount ставить їх від меншої суми до більшої: e-04, e-03, e-06, e-05, e-02, e-01. Друге сортування з компаратором byDate, який порівнює дати через localeCompare, ставить їх за датою. Записи з однаковою датою компаратор вважає рівними (повертає 0), і стабільне сортування лишає їх у порядку після першого сортування: 27 лютого — e-04 (9990), потім e-05 (30000); 1 березня — e-02 (52000), потім e-01 (84550). Результат: e-04, e-05, e-03, e-02, e-01, e-06 — за датою, а в межах одного дня — від меншої суми до більшої. Початковий масив expenses не змінюється, бо обидва кроки — toSorted."
      en: "Six expenses are recorded in this order: e-01 (2026-03-01, 84550), e-02 (2026-03-01, 52000), e-03 (2026-02-28, 18000), e-04 (2026-02-27, 9990), e-05 (2026-02-27, 30000), e-06 (2026-03-02, 21050). The first sort with the byAmount comparator orders them from the smallest amount to the largest: e-04, e-03, e-06, e-05, e-02, e-01. The second sort with the byDate comparator, which compares dates with localeCompare, orders them by date. The comparator treats records with the same date as equal (returns 0), and the stable sort keeps them in the order left by the first sort: on 27 February e-04 (9990), then e-05 (30000); on 1 March e-02 (52000), then e-01 (84550). The result: e-04, e-05, e-03, e-02, e-01, e-06 — by date, and within one day from the smallest amount to the largest. The original expenses array does not change, because both steps use toSorted."
    spec:
      code: |
        const byAmount = (a, b) =>
          a.amountMinor - b.amountMinor;
        const byDate = (a, b) =>
          a.date.localeCompare(b.date);
        const ordered = expenses
          .toSorted(byAmount)
          .toSorted(byDate);
      input:
        label: { uk: "expenses — шість витрат", en: "expenses — six expenses" }
        items:
          - { id: "e-01", date: "2026-03-01", amountMinor: 84550 }
          - { id: "e-02", date: "2026-03-01", amountMinor: 52000 }
          - { id: "e-03", date: "2026-02-28", amountMinor: 18000 }
          - { id: "e-04", date: "2026-02-27", amountMinor: 9990 }
          - { id: "e-05", date: "2026-02-27", amountMinor: 30000 }
          - { id: "e-06", date: "2026-03-02", amountMinor: 21050 }
        show: "item => item.id + ' · ' + item.date + ' · ' + item.amountMinor"
        caption:
          uk: "Шість витрат у тому порядку, в якому їх записали: `id · дата · сума в копійках`. Мета — розкласти їх за датою, а в межах одного дня — від меншої суми до більшої."
          en: "Six expenses in the order they were recorded: `id · date · amount in kopiykas`. The goal is to order them by date, and within one day from the smallest amount to the largest."
      stages:
        - op: sort
          fn: "(a, b) => a.amountMinor - b.amountMinor"
          label: "byAmount"
          caption:
            uk: "Перше сортування — за сумою (на схемі етап зветься `sort`: `toSorted` сортує так само, лише копію). Від’ємна різниця сум ставить меншу витрату раніше, тож тепер список іде від `9990` до `84550`."
            en: "The first sort is by amount (the stage is called `sort` in the picture: `toSorted` sorts the same way, only a copy). A negative difference puts the smaller expense first, so the list now runs from `9990` to `84550`."
        - op: sort
          fn: "(a, b) => a.date.localeCompare(b.date)"
          label: "byDate"
          caption:
            uk: "Друге сортування — за датою: `localeCompare` порівнює дати, записані текстом, і повертає від’ємне число, `0` чи додатне. У `e-04` і `e-05` дата однакова — компаратор дає `0`, тож вони лишаються в порядку після першого сортування: дешевша раніше. Так само `e-02` (52000) лишився перед `e-01` (84550)."
            en: "The second sort is by date: `localeCompare` compares the date strings and returns a negative number, `0` or a positive one. `e-04` and `e-05` have the same date — the comparator gives `0`, so they keep the order left by the first sort: the cheaper first. In the same way `e-02` (52000) stayed before `e-01` (84550)."
      result:
        label: { uk: "за датою, а в межах дня — за сумою", en: "by date, and by amount within a day" }

  - id: try-records
    kind: example
    runtime: browser-js
    dir: try-records
    entry: index.js
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
    title:
      uk: "Сортуємо витрати"
      en: "Sorting expenses"
    body:
      uk: "Програма сортує копії списку витрат за сумою й за датою. Останній рядок консолі показує порядок у самому масиві `expenses`. Запусти й порівняй."
      en: "The program sorts copies of the expense list by amount and by date. The last console line shows the order inside the `expenses` array itself. Run it and compare."
    tryIt:
      uk: |
        1. Заміни `toSorted` на `sort` у першому сортуванні й запусти: останній рядок консолі покаже, що змінився порядок і в самому `expenses`.
        2. Поверни `toSorted`. Потім у рядку коду з `byDay` заміни `expenses.toSorted(byDate)` на `cheapFirst.toSorted(byDate)` — так за датою сортується вже відсортований за сумою список. Подивись, як тепер стоять `e-01` і `e-02`.
      en: |
        1. Replace `toSorted` with `sort` in the first sort and run: the last console line shows that the order inside `expenses` changed too.
        2. Put `toSorted` back. Then, in the line of code with `byDay`, replace `expenses.toSorted(byDate)` with `cheapFirst.toSorted(byDate)` — now the list already sorted by amount is sorted by date. See where `e-01` and `e-02` stand now.

  - id: text-and-null
    kind: explanation
    title:
      uk: "Текст і відсутні значення"
      en: "Text and missing values"
    body:
      uk: |
        **Текст.** Від тексту не можна відняти текст: `"b" - "a"` дає `NaN`. Текст порівнюють через `localeCompare`: `a.localeCompare(b)` повертає від’ємне число, якщо `a` за абеткою раніше, `0` для однакового тексту і додатне — якщо пізніше. Саме це й потрібно компаратору.

        Порівняння через `<` і `>` для цього не годиться: воно порівнює коди символів, а коди не йдуть за абеткою. Усі великі латинські літери мають менші коди, ніж малі, а українські «є», «і», «ї», «ґ» опиняються аж після «я». `localeCompare` порівнює за правилами мови: «аптечка» стоїть перед «Велосипед», а «інжир» — перед «яблуко».

        > [!tip]
        > Без другого аргументу `localeCompare` бере правила мови, якою налаштовано браузер. Щоб порядок не залежав від мови браузера, передай мову: `a.localeCompare(b, "uk")`. З `"uk"` «інжир» завжди стоїть перед «їжак», а без неї в браузері англійською — після.

        **Відсутні значення.** Якщо в записі `null`, виріши, де йому місце, і скажи це компаратору явно. Ось справи за терміном, де справи без терміну йдуть **на початок** — їм ще треба призначити дату:

        ```js
        const byDueDate = (a, b) => {
          if (a.dueDate === b.dueDate) return 0;
          if (a.dueDate === null) return -1;
          if (b.dueDate === null) return 1;
          return a.dueDate.localeCompare(b.dueDate);
        };
        ```

        Спершу рівні (зокрема обидва `null`) лишаються на місцях. Далі запис без терміну йде раніше за інший: від’ємне число, якщо терміну немає в `a`, і додатне, якщо в `b`. Інакше порівнюються дати. Коли в `if` лише одна інструкція, фігурні дужки можна не писати: `if (x) return 0;` — те саме, що `if (x) { return 0; }`.
      en: |
        **Text.** You cannot subtract text from text: `"b" - "a"` gives `NaN`. Text is compared with `localeCompare`: `a.localeCompare(b)` returns a negative number if `a` comes earlier in the alphabet, `0` for the same text and a positive number if it comes later. That is exactly what a comparator needs.

        Comparing with `<` and `>` does not work for this: it compares character codes, and the codes do not follow the alphabet. Every capital Latin letter has a smaller code than every small one, and the Ukrainian letters «є», «і», «ї», «ґ» even land after «я». `localeCompare` compares by the rules of a language: “aid kit” comes before “Bicycle”.

        > [!tip]
        > Without a second argument, `localeCompare` uses the rules of the language the browser is set to. To make the order independent of the browser language, pass the language: `a.localeCompare(b, "en")`, or `"uk"` for Ukrainian words. With `"uk"`, «інжир» always comes before «їжак»; without it, in a browser set to English, it comes after.

        **Missing values.** If a record holds `null`, decide where it belongs and tell the comparator explicitly. Here are tasks by due date, with tasks that have no due date **first** — they still need a date:

        ```js
        const byDueDate = (a, b) => {
          if (a.dueDate === b.dueDate) return 0;
          if (a.dueDate === null) return -1;
          if (b.dueDate === null) return 1;
          return a.dueDate.localeCompare(b.dueDate);
        };
        ```

        First, equal ones (two `null`s included) stay in place. Then a record without a due date goes before the other one: a negative number if `a` has no due date and a positive one if `b` has none. Otherwise the dates are compared. When an `if` holds a single statement, the curly braces may be left out: `if (x) return 0;` is the same as `if (x) { return 0; }`.

  - id: sort-wishes
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: sort-wishes
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      aidKit: { uk: "аптечка", en: "aid kit" }
      nameOrder: { uk: "w-03,w-05,w-01,w-02,w-06", en: "w-03,w-05,w-02,w-01,w-06" }
    title:
      uk: "Компаратори для бажань"
      en: "Comparators for wishes"
    instructions:
      uk: |
        Допиши два компаратори для списку бажань:

        1. `byPriceAsc(a, b)` — дешевші бажання раніше. Бажання без ціни (`null`) — після всіх бажань із ціною. Бажання з однаковою ціною (і двоє без ціни) лишаються в початковому порядку.
        2. `byNameAsc(a, b)` — за назвою за абеткою, через `localeCompare`.

        Компаратор повертає **число**: від’ємне — `a` раніше, додатне — `b` раніше, `0` — рівні. Унизу програма сортує копії списку через `toSorted`, тож сам список не змінюється.
      en: |
        Complete two comparators for a wishlist:

        1. `byPriceAsc(a, b)` — cheaper wishes first. Wishes without a price (`null`) go after all wishes that have a price. Wishes with an equal price (and two without a price) keep their original order.
        2. `byNameAsc(a, b)` — alphabetically by name, using `localeCompare`.

        A comparator returns a **number**: negative — `a` first, positive — `b` first, `0` — equal. At the bottom the program sorts copies of the list with `toSorted`, so the list itself does not change.
    testTitles:
      "byPriceAsc returns a number":
        uk: "byPriceAsc повертає число"
        en: "byPriceAsc returns a number"
      "byPriceAsc puts cheaper items first":
        uk: "byPriceAsc ставить дешевші бажання раніше"
        en: "byPriceAsc puts cheaper wishes first"
      "byPriceAsc puts items without a price last":
        uk: "byPriceAsc ставить бажання без ціни в кінець"
        en: "byPriceAsc puts wishes without a price last"
      "items with equal prices keep their order":
        uk: "Бажання з однаковою ціною зберігають порядок"
        en: "Wishes with equal prices keep their order"
      "byPriceAsc treats two items without a price as equal":
        uk: "byPriceAsc вважає двоє бажань без ціни рівними"
        en: "byPriceAsc treats two wishes without a price as equal"
      "byNameAsc sorts names alphabetically":
        uk: "byNameAsc сортує назви за абеткою"
        en: "byNameAsc sorts names alphabetically"
      "a name starting with a small letter is not put last":
        uk: "Назва з малої літери не опиняється в кінці"
        en: "A name starting with a small letter is not put last"
    hints:
      nudge:
        uk: "У поясненні справи без терміну йдуть **на початок**. Що треба змінити в такому компараторі, щоб бажання без ціни йшли в кінець?"
        en: "In the explanation, tasks without a due date go **first**. What has to change in such a comparator so that wishes without a price go last?"
      explanation:
        uk: "Компаратор відповідає числом про **пару** бажань. Розбери всі випадки пари: ціни однакові (зокрема обидві `null`) — це рівні; ціна є лише в одного — хто з двох має стати раніше і яке число, від’ємне чи додатне, це каже; ціни є в обох — допоможе різниця. Для назв `localeCompare` уже повертає потрібне число."
        en: "A comparator answers with a number about a **pair** of wishes. Go through every case of a pair: equal prices (two `null`s included) — they are equal; only one has a price — which of the two must come first, and which number, negative or positive, says so; both have prices — the difference helps. For names, `localeCompare` already returns the needed number."
    solutionNote:
      uk: "Перевірка `a.price === b.price` стоїть першою, тому однакові ціни й двоє `null` дають `0`, і стабільне сортування не міняє їх місцями. Далі `null` явно відправляється в кінець: без цього у відніманні `null` поводився б як `0` і стрибав би на початок. `localeCompare` порівнює назви за правилами мови, а не за кодами символів; з другим аргументом `\"uk\"` порядок не залежатиме від мови браузера."
      en: "The `a.price === b.price` check comes first, so equal prices and two `null`s give `0`, and the stable sort does not swap them. Then `null` is sent to the end explicitly: otherwise `null` would behave like `0` in the subtraction and jump to the front. `localeCompare` compares names by the rules of a language, not by character codes; with a second argument such as `\"en\"` the order no longer depends on the browser language."
    feedback:
      - when: { test: "byPriceAsc returns a number" }
        message:
          uk: "Ця перевірка викликає `byPriceAsc` для двох бажань із ціною й чекає **число**: від’ємне, `0` або додатне. Якщо бачиш `boolean`, компаратор повертає `true`/`false` (наприклад, `a.price > b.price`) — так він ніколи не скаже «a раніше»; якщо `undefined` — бракує `return`."
          en: "This check calls `byPriceAsc` for two wishes with prices and expects a **number**: negative, `0` or positive. If you see `boolean`, the comparator returns `true`/`false` (for example `a.price > b.price`) — that way it never says “a first”; if `undefined`, a `return` is missing."
      - when: { test: "byPriceAsc puts cheaper items first" }
        message:
          uk: "Ця перевірка сортує чотири бажання з ціною й чекає `w-06` (18), `w-02` (45), `w-01` (80), `w-03` (240). Якщо порядок не змінився, компаратор не повертає від’ємного числа, коли `a` дешевше; якщо порядок зворотний, знаки переплутано."
          en: "This check sorts four wishes with prices and expects `w-06` (18), `w-02` (45), `w-01` (80), `w-03` (240). If the order did not change, the comparator does not return a negative number when `a` is cheaper; if the order is reversed, the signs are swapped."
      - when: { test: "byPriceAsc puts items without a price last" }
        message:
          uk: "Ця перевірка чекає бажання без ціни (`w-05`) у самому кінці, після всіх бажань із ціною. Якщо воно стрибнуло на початок, компаратор віднімає `null`, а у відніманні `null` поводиться як `0`: перевіряй `null` до віднімання."
          en: "This check expects the wish without a price (`w-05`) at the very end, after all wishes with a price. If it jumped to the front, the comparator subtracts `null`, and in a subtraction `null` behaves like `0`: check for `null` before subtracting."
      - when: { test: "items with equal prices keep their order" }
        message:
          uk: "Ця перевірка дає два бажання по 45 і чекає, що вони лишаться в початковому порядку: для рівних цін компаратор має повертати `0`, а стабільне сортування зробить решту."
          en: "This check passes two wishes priced 45 each and expects them to keep their original order: for equal prices the comparator must return `0`, and the stable sort does the rest."
      - when: { test: "byPriceAsc treats two items without a price as equal" }
        message:
          uk: "Ця перевірка викликає `byPriceAsc` для двох бажань без ціни в обох порядках і чекає `0`: вони рівні, тож стабільне сортування лишить їх на місцях. Якщо прийшло `1` чи `-1`, перевірка на `null` спрацьовує раніше за перевірку однакових цін."
          en: "This check calls `byPriceAsc` for two wishes without a price in both orders and expects `0`: they are equal, so the stable sort keeps them in place. If `1` or `-1` came back, the `null` check runs before the equal-price check."
      - when: { test: "byNameAsc sorts names alphabetically" }
        message:
          uk: "Ця перевірка чекає назви за абеткою: Велосипед, Квитки на концерт, Навушники, Настільна лампа, Термочашка. Якщо порядок не змінився, `byNameAsc` не повертає результат `localeCompare`."
          en: "This check expects the names in alphabetical order: Bicycle, Concert tickets, Desk lamp, Headphones, Travel mug. If the order did not change, `byNameAsc` does not return the result of `localeCompare`."
      - when: { test: "a name starting with a small letter is not put last" }
        message:
          uk: "Ця перевірка чекає «аптечка» перед «Велосипед»: за абеткою велика чи мала перша літера не важить. Якщо «аптечка» опинилася в кінці, порівняння йде через `>` чи `<`, тобто за кодами символів, де великі літери стоять перед малими; `localeCompare` порівнює за правилами мови."
          en: "This check expects “aid kit” before “Bicycle”: alphabetically, a capital or small first letter does not matter. If “aid kit” ended up last, the comparison uses `>` or `<`, that is character codes, where capital letters come before small ones; `localeCompare` compares by the rules of a language."

  - id: to-project
    kind: transfer
    capstoneStep: JS-05
    body:
      uk: "Сортування у твоєму проєкті — за ціною, терміном, назвою чи датою — це компаратор плюс `toSorted`. Записи без значення відправляй у кінець явно, а для «спершу за одним полем, потім за іншим» спирайся на стабільність."
      en: "Sorting in your project — by price, due date, name or date — is a comparator plus `toSorted`. Send records without a value to the end explicitly, and for “first by one field, then by another” rely on stability."
