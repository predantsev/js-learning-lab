id: no-05-02-initialization-seed
unit: NO-05
title:
  uk: "Ініціалізація та seed під час запуску"
  en: "Initialization and seed on start"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Написати ініціалізацію під час запуску, яка створює відсутнє сховище, перевіряє його версію схеми й заповнює фікстурами (seed) лише порожнє сховище."
    en: "Implement startup initialization that creates missing storage, checks its schema version and seeds fixtures only when the store is empty."
  - uk: "Передбачити вміст сховища після запуску сервера з порожнім, заповненим і зміненим сховищем і показати, що повторна ініціалізація нічого не змінює."
    en: "Predict the store after starting the server on an empty, a seeded and an edited store, and show that running initialization twice changes nothing."
prerequisites: [no-05-01-schema-contract, no-09-07-migrations-seed]
subskills:
  - { family: B-05, skill: "initialization", depth: practice }
glossary: [startup-initialization]
selfCheck: [predict-starts, notes-init]

blocks:
  - id: what-init-does
    kind: explanation
    title:
      uk: "Що сервер робить до першого запиту"
      en: "What the server does before the first request"
    body:
      uk: |
        Сервер запускається на комп’ютері, де сховища може ще не бути, де воно порожнє, або де в ньому вже тижні справжніх змін. [[startup-initialization|Ініціалізація під час запуску]] приводить усі три випадки до одного стану:

        1. **Немає сховища** — створити теку й порожнє сховище поточної версії.
        2. **Інша версія схеми** — не читати так, ніби форма та сама. Стару версію переносить міграція (наступний урок); невідому — відмовитися запускатися.
        3. **Сховище порожнє** — додати фікстури (seed). Якщо записи вже є — **нічого не чіпати**: людина могла видалити фікстуру, і сервер не має її воскрешати.

        Головна властивість — запуск двічі дає той самий результат, що й один раз. А `listen()` викликається лише **після** ініціалізації: доки сховище не готове, запитів не має приймати ніхто.
      en: |
        A server starts on a computer where the store may not exist yet, where it is empty, or where it already holds weeks of real changes. [[startup-initialization]] brings all three cases to one state:

        1. **No store** — create the folder and an empty store of the current version.
        2. **Another schema version** — do not read it as if its shape were the same. A migration moves an old version forward (next lesson); for an unknown one, refuse to start.
        3. **An empty store** — add the fixtures (seed). If there are records already — **touch nothing**: a person may have deleted a fixture, and the server must not bring it back.

        The key property: starting twice gives the same result as starting once. And `listen()` is called only **after** initialization: until the store is ready, nobody should be accepting requests.

  - id: predict-starts
    kind: prediction
    prompt:
      uk: "Сховище справ змодельовано масивом `disk` (`null` — файла ще немає). Що надрукує програма?"
      en: "The task store is modelled by the array `disk` (`null` — no file yet). What does the program print?"
    code: |
      const fixtures = ["t-01", "t-02", "t-03"];
      let disk = null;

      function seedEveryStart() {
        if (disk === null) disk = [];
        disk.push(...fixtures);
      }
      function seedWhenEmpty() {
        if (disk === null) disk = [];
        if (disk.length === 0) disk.push(...fixtures);
      }

      for (let i = 0; i < 3; i++) seedEveryStart();
      console.log(disk.length);

      disk = null;
      for (let i = 0; i < 3; i++) seedWhenEmpty();
      disk = disk.filter((id) => id !== "t-02"); // a person deletes one task
      seedWhenEmpty();
      seedWhenEmpty();
      console.log(disk.length);
    verify:
      logs: ["9", "2"]
    answer:
      type: choice
      options:
        - id: nine-two
          code: "9\n2"
        - id: three-two
          code: "3\n2"
          why:
            uk: "`push` не перевіряє, чи такі справи вже є: кожен запуск `seedEveryStart` додає ще три. Те, що фікстури щоразу однакові, якраз і дає повтори."
            en: "`push` does not check whether such tasks already exist: every run of `seedEveryStart` adds three more. The fixtures being the same every time is exactly what produces the duplicates."
        - id: nine-three
          code: "9\n3"
          why:
            uk: "Після видалення в сховищі дві справи, а не нуль, тож `seedWhenEmpty` нічого не додає. Видалена фікстура не повертається — так і має бути."
            en: "After the deletion the store holds two tasks, not zero, so `seedWhenEmpty` adds nothing. The deleted fixture does not come back — as it should be."
        - id: nine-four
          code: "9\n4"
          why:
            uk: "Два запуски `seedWhenEmpty` після видалення бачать непорожнє сховище й нічого не змінюють — ні разу, ні двічі."
            en: "The two runs of `seedWhenEmpty` after the deletion see a non-empty store and change nothing — neither once nor twice."
      correct: [nine-two]
    explanation:
      uk: "Seed на кожному запуску дає 9 записів після трьох запусків — дублікати. Seed лише в порожнє сховище дає 3 після першого запуску й нічого не додає потім: після видалення лишається 2, і повторні запуски це число не змінюють. Саме так виглядає ініціалізація, яку безпечно запускати скільки завгодно разів."
      en: "Seeding on every start gives 9 records after three starts — duplicates. Seeding only an empty store gives 3 after the first start and adds nothing afterwards: after the deletion 2 are left, and further starts do not change that number. That is what initialization looks like when it is safe to run any number of times."

  - id: start-sequence
    kind: visual
    visual: sequence
    title:
      uk: "Спершу ініціалізація, потім listen"
      en: "Initialization first, then listen"
    textEquivalent:
      uk: "Сервер запускається й читає сховище — його ще немає. Він створює сховище версії 1. У цей час клієнт уже надсилає GET /tasks, але сервер ще не викликав listen, тож з’єднання відхилено: ECONNREFUSED, ніхто не слухає. Сервер бачить, що сховище порожнє, і додає шість фікстур. Лише тепер він викликає listen. Наступний GET /tasks отримує 200 і шість справ. Якби listen стояв перед ініціалізацією, ранній запит потрапив би в сервер без готового сховища й отримав би помилку або порожній список."
      en: "The server starts and reads the store — it does not exist yet. It creates a version 1 store. Meanwhile a client already sends GET /tasks, but the server has not called listen yet, so the connection is refused: ECONNREFUSED, nobody is listening. The server sees that the store is empty and adds six fixtures. Only now does it call listen. The next GET /tasks gets 200 and six tasks. Had listen come before initialization, the early request would have reached a server with no ready store and got an error or an empty list."
    spec:
      actors:
        - { id: client, label: { uk: "Клієнт", en: "Client" } }
        - { id: server, label: { uk: "Сервер", en: "Server" } }
        - { id: store, label: { uk: "Сховище", en: "Store" } }
      messages:
        - from: server
          to: store
          label: { uk: "прочитати сховище", en: "read the store" }
          caption:
            uk: "Сервер запустився й читає сховище. Файла немає (`ENOENT`) — це перший запуск."
            en: "The server has started and reads the store. There is no file (`ENOENT`) — this is the first start."
        - from: server
          to: store
          label: { uk: "створити, версія 1", en: "create, version 1" }
          caption:
            uk: "Ініціалізація створює порожнє сховище поточної версії схеми."
            en: "Initialization creates an empty store of the current schema version."
        - from: client
          to: server
          label: "GET /tasks"
          kind: async
          note: { uk: "ECONNREFUSED: ніхто не слухає", en: "ECONNREFUSED: nobody listens" }
          caption:
            uk: "Клієнт уже надсилає запит, але `listen()` ще не викликано: з’єднання відхилено (`ECONNREFUSED`). Ніхто не відповідає з неготового сховища."
            en: "A client already sends a request, but `listen()` has not been called yet: the connection is refused (`ECONNREFUSED`). Nobody answers from an unready store."
        - from: server
          to: store
          label: { uk: "порожньо → seed 6", en: "empty → seed 6" }
          caption:
            uk: "Сховище порожнє, тож сервер додає шість фікстур. Якби записи вже були, цей крок нічого б не робив."
            en: "The store is empty, so the server adds six fixtures. Had there been records already, this step would do nothing."
        - from: server
          to: server
          label: "listen()"
          kind: note
          caption:
            uk: "Лише тепер сервер починає слухати порт."
            en: "Only now does the server start listening on the port."
        - from: client
          to: server
          label: "GET /tasks"
          caption:
            uk: "Наступний запит знаходить сервер, що слухає…"
            en: "The next request finds a listening server…"
        - from: server
          to: client
          label: { uk: "200, 6 справ", en: "200, 6 tasks" }
          kind: return
          caption:
            uk: "…і отримує всі шість справ. Жоден запит не бачив сховища посередині ініціалізації."
            en: "…and gets all six tasks. No request ever saw the store in the middle of initialization."

  - id: start-three-times
    kind: example
    runtime: isolated-node
    dir: start-three-times
    entry: index.js
    capabilities: { network: loopback }
    strings:
      t1: { uk: "Полити квіти", en: "Water the plants" }
      t2: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      t3: { uk: "Написати бабусі", en: "Write to grandma" }
      t4: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      t5: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      t6: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
      start: { uk: "запуск", en: "start" }
      deleted: { uk: "видалено", en: "deleted" }
      early: { uk: "ранній запит", en: "early request" }
      afterStart: { uk: "після запуску", en: "after the start" }
    title:
      uk: "Три запуски й ранній запит (SQLite)"
      en: "Three starts and an early request (SQLite)"
    body:
      uk: |
        Тут сховище справ — база SQLite (`node:sqlite`), як у лабораторній із SQL: версію схеми зберігає `PRAGMA user_version`, а нова база повідомляє `0`. `initPlanner` у `planner-db.js` створює таблицю, якщо версія `0`, відмовляється від невідомої версії й додає фікстури, лише коли таблиця порожня, — усе в одній транзакції.

        Натисни **Запустити**. `index.js` запускає сервер тричі з тим самим файлом бази, а після другого запуску видаляє `t-03`. Потім запускає сервер учетверте з новою базою й за 50 мс, поки ініціалізація ще триває, надсилає запит.

        Документація [Node.js 22](https://nodejs.org/docs/latest-v22.x/api/sqlite.html) позначає `node:sqlite` як «Stability: 1.1 — Active development»: від 22.13 прапорець `--experimental-sqlite` уже не потрібен, але модуль ще експериментальний. Платформа ховає попередження про це, а у твоєму терміналі Node друкує `ExperimentalWarning: SQLite is an experimental feature…` (ми бачили це на Node 25.2.1) — це попередження, не помилка.
      en: |
        Here the task store is an SQLite database (`node:sqlite`), as in the SQL lab: `PRAGMA user_version` holds the schema version, and a new database reports `0`. `initPlanner` in `planner-db.js` creates the table when the version is `0`, refuses an unknown version and adds the fixtures only when the table is empty — all in one transaction.

        Press **Run**. `index.js` starts the server three times with the same database file and deletes `t-03` after the second start. Then it starts the server a fourth time with a new database and, 50 ms later, while initialization is still running, sends a request.

        The [Node.js 22](https://nodejs.org/docs/latest-v22.x/api/sqlite.html) documentation marks `node:sqlite` as “Stability: 1.1 — Active development”: since 22.13 the `--experimental-sqlite` flag is no longer needed, but the module is still experimental. The platform hides the warning about that, while in your own terminal Node prints `ExperimentalWarning: SQLite is an experimental feature…` (we saw it on Node 25.2.1) — a warning, not an error.
    tryIt:
      uk: |
        Перевір дві ідеї уроку:

        1. Зміни `const ORDER = 'init-then-listen'` на `'listen-then-init'` і запусти. Ранній запит тепер потрапляє в сервер, у базі якого ще немає таблиці, і отримує `500 {"error":"no such table: tasks"}`. Поверни `'init-then-listen'`.
        2. У `planner-db.js` заміни умову `if (count === 0)` на `if (true)` — seed на кожному запуску — і запусти. Перший запуск проходить, а другий падає з `UNIQUE constraint failed: tasks.id`: первинний ключ SQLite не дає вставити ту саму справу вдруге. У JSON-файлі такого ключа немає, і там seed на кожному запуску **тихо** додав би дублікати. Поверни `count === 0`.
      en: |
        Test two ideas of the lesson:

        1. Change `const ORDER = 'init-then-listen'` to `'listen-then-init'` and run. The early request now reaches a server whose database has no table yet and gets `500 {"error":"no such table: tasks"}`. Put `'init-then-listen'` back.
        2. In `planner-db.js`, replace the condition `if (count === 0)` with `if (true)` — seeding on every start — and run. The first start passes, and the second fails with `UNIQUE constraint failed: tasks.id`: SQLite’s primary key refuses to insert the same task again. A JSON file has no such key, and there seeding on every start would **silently** add duplicates. Put `count === 0` back.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: подвійний запуск у розробці"
      en: "Recall: the double run in development"
    items:
      - id: strict-double-setup
        from: re-03-05-strict-mode-rechecks
        prompt:
          uk: "Під час розробки StrictMode запускає ефект за схемою setup → cleanup → setup. Ефект після монтування додає до списку пункт «Ласкаво просимо», а cleanup нічого не робить. Що побачить людина в розробці?"
          en: "During development StrictMode runs an effect as setup → cleanup → setup. After mount, an effect adds a “Welcome” item to a list, and its cleanup does nothing. What does a person see in development?"
        answer:
          type: choice
          options:
            - id: twice
              text:
                uk: "Два пункти «Ласкаво просимо»: setup виконався двічі, а cleanup не скасував першого"
                en: "Two “Welcome” items: setup ran twice, and the cleanup did not undo the first"
            - id: once
              text:
                uk: "Один пункт: React пам’ятає, що ефект уже виконувався"
                en: "One item: React remembers that the effect has already run"
              why:
                uk: "React нічого такого не пам’ятає: у розробці setup справді виконується двічі. Повторний запуск безпечний, лише якщо cleanup повністю скасовує setup — або якщо setup сам перевіряє, чи пункт уже є."
                en: "React remembers nothing of the sort: in development setup really runs twice. A repeated run is safe only if the cleanup fully undoes the setup — or if setup itself checks whether the item is already there."
            - id: none
              text:
                uk: "Жодного: другий setup скасовує перший"
                en: "None: the second setup cancels the first"
              why:
                uk: "Скасовувати мав би cleanup, а він порожній. Кожен setup додає свій пункт."
                en: "The cleanup would have to undo it, and it is empty. Each setup adds its own item."
          correct: [twice]
        explanation:
          uk: "Та сама думка, що й в ініціалізації сервера: код, який можуть запустити двічі, має давати той самий результат, що й один запуск. У React цього досягають cleanup, на сервері — перевіркою «чи сховище порожнє» перед seed."
          en: "The same idea as in server initialization: code that may run twice must give the same result as one run. React gets there with a cleanup; the server with a “is the store empty” check before seeding."

  - id: notes-init
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: notes-init
    entry: index.js
    editable: [init.js]
    capabilities: { network: loopback }
    strings:
      welcome: { uk: "Ласкаво просимо", en: "Welcome" }
      welcomeBody: { uk: "Це перша нотатка.", en: "This is the first note." }
      ideas: { uk: "Ідеї на вихідні", en: "Weekend ideas" }
      own: { uk: "Моя нотатка", en: "My note" }
      start: { uk: "запуск", en: "start" }
    title:
      uk: "initStore і startServer для нотаток"
      en: "initStore and startServer for notes"
    instructions:
      uk: |
        У `init.js` напиши `initStore(file, fixtures)` і виправ `startServer(file, fixtures)`. Сховище нотаток — файл `{ schemaVersion, records }`; читай і пиши його через `readStore` і `writeStore` з `disk.js`.

        `initStore`:

        - якщо файла немає — створює теку (і вкладені теки) та записує `{ schemaVersion: 1, records: fixtures }`;
        - якщо `records` порожній — записує туди фікстури;
        - якщо записи вже є — **не змінює файл**;
        - якщо `schemaVersion` не `1` — відхиляється (кидає помилку) й не змінює файл;
        - якщо файл є, але не розбирається як JSON, — відхиляється й не змінює файл: зіпсоване сховище — не відсутнє;
        - другий запуск поспіль дає той самий файл, що й перший.

        `startServer` має дочекатися `initStore` **до** `listen()` і повернути сервер, що слухає `127.0.0.1` на вільному порту (`listen(0, '127.0.0.1')`).

        Одна перевірка підміняє `http.Server.prototype.listen`, щоб побачити, що лежить у сховищі в мить виклику `listen()`.
      en: |
        In `init.js`, write `initStore(file, fixtures)` and fix `startServer(file, fixtures)`. The notes store is a file `{ schemaVersion, records }`; read and write it with `readStore` and `writeStore` from `disk.js`.

        `initStore`:

        - when there is no file — creates the folder (and nested folders) and writes `{ schemaVersion: 1, records: fixtures }`;
        - when `records` is empty — puts the fixtures there;
        - when there are records already — **does not change the file**;
        - when `schemaVersion` is not `1` — rejects (throws an error) and does not change the file;
        - when the file exists but does not parse as JSON — rejects and does not change the file: a damaged store is not a missing one;
        - a second run in a row gives the same file as the first.

        `startServer` must wait for `initStore` **before** `listen()` and return a server listening on `127.0.0.1` on a free port (`listen(0, '127.0.0.1')`).

        One check replaces `http.Server.prototype.listen` to see what the store holds at the moment `listen()` is called.
    testTitles:
      "a missing store is created, folder included, with the fixtures":
        uk: "Відсутнє сховище створено разом із текою, і в ньому фікстури"
        en: "A missing store is created, folder included, with the fixtures"
      "a store that has notes is left unchanged":
        uk: "Сховище з нотатками лишається без змін"
        en: "A store that has notes is left unchanged"
      "an empty store is seeded":
        uk: "Порожнє сховище заповнено фікстурами"
        en: "An empty store is seeded"
      "running initStore twice gives the same file as running it once":
        uk: "Два запуски `initStore` дають той самий файл, що й один"
        en: "Running `initStore` twice gives the same file as running it once"
      "a store of another schemaVersion is refused and kept":
        uk: "Сховище з іншою `schemaVersion` відхилено й збережено"
        en: "A store of another `schemaVersion` is refused and kept"
      "a store that cannot be parsed is refused and kept":
        uk: "Сховище, що не розбирається, відхилено й збережено"
        en: "A store that cannot be parsed is refused and kept"
      "startServer finishes initStore before it listens":
        uk: "`startServer` завершує `initStore` до `listen()`"
        en: "`startServer` finishes `initStore` before it listens"
      "GET /notes answers the seeded notes right after startServer":
        uk: "`GET /notes` одразу після `startServer` віддає фікстури"
        en: "`GET /notes` answers the seeded notes right after `startServer`"
    hints:
      nudge:
        uk: "Почни з того, як відрізнити «файла немає» від інших помилок читання: у NO-02 ти дивився на `error.code`. Потім три окремі питання: яка версія, чи порожньо, чи треба взагалі писати."
        en: "Start with telling “no file” apart from other read errors: in NO-02 you looked at `error.code`. Then three separate questions: which version, is it empty, does anything need writing at all."
      explanation:
        uk: "Для схожого сховища закладок це виглядало б так: `mkdir(path.dirname(bookmarksFile), { recursive: true })` створює теку й не скаржиться, якщо вона вже є. Читання в `try`; у `catch` лише `error.code === 'ENOENT'` означає «почни з порожнього сховища», а будь-яку іншу помилку треба кинути далі. Писати потрібно тільки тоді, коли записів нуль, — тоді непорожнє сховище лишається байт у байт тим самим. У функції запуску `await` ініціалізації стоїть рядком вище за `listen`."
        en: "For a similar bookmarks store it would look like this: `mkdir(path.dirname(bookmarksFile), { recursive: true })` creates the folder and does not complain if it is already there. The read goes in `try`; in `catch`, only `error.code === 'ENOENT'` means “start from an empty store”, and any other error must be thrown on. Write only when there are zero records — then a non-empty store stays byte for byte the same. In the start function, the `await` of initialization sits one line above `listen`."
    solutionNote:
      uk: "`initStore` пише лише в одному випадку — коли записів нуль, тож повторний запуск і непорожнє сховище нічого не змінюють. Лише `ENOENT` вважається «файла немає»: зламаний JSON чи чужа версія зупиняють запуск, а не перетворюються на чисте сховище з фікстурами — інакше один зіпсований байт стер би всі нотатки. `startServer` чекає на `initStore`, і лише потім викликає `listen`. Варіант із перевіркою `access()` до читання теж правильний."
      en: "`initStore` writes in one case only — when there are zero records, so a repeated run and a non-empty store change nothing. Only `ENOENT` counts as “no file”: broken JSON or a foreign version stop the start instead of turning into a clean store with fixtures — otherwise one damaged byte would erase every note. `startServer` waits for `initStore` and only then calls `listen`. A version that checks with `access()` before reading is correct too."
    feedback:
      - when: { test: "a missing store is created, folder included, with the fixtures" }
        message:
          uk: "Ця перевірка дає шлях, у якому теки `nested/data` ще немає, і очікує файл `{ schemaVersion: 1, records: fixtures }`. Якщо бачиш `ENOENT` під час запису, теку треба створити до нього, з `recursive: true`."
          en: "This check gives a path whose folders `nested/data` do not exist yet and expects the file `{ schemaVersion: 1, records: fixtures }`. If you see `ENOENT` while writing, the folder must be created before it, with `recursive: true`."
      - when: { test: "a store that has notes is left unchanged" }
        message:
          uk: "Ця перевірка кладе в сховище одну власну нотатку й очікує, що після `initStore` текст файла буде тим самим. Фікстури додаються лише тоді, коли `records` порожній."
          en: "This check puts one note of its own into the store and expects the file’s text to be the same after `initStore`. Fixtures are added only when `records` is empty."
      - when: { test: "a store of another schemaVersion is refused and kept" }
        message:
          uk: "Ця перевірка дає сховище зі `schemaVersion: 2` і очікує, що `initStore` відхилиться, а файл лишиться тим самим. Сховище іншої версії не можна вважати порожнім."
          en: "This check gives a store with `schemaVersion: 2` and expects `initStore` to reject while the file stays the same. A store of another version must not be treated as empty."
      - when: { test: "a store that cannot be parsed is refused and kept" }
        message:
          uk: "Ця перевірка дає файл з обірваним JSON і очікує, що `initStore` відхилиться, а файл лишиться тим самим. «Немає файла» — це лише `error.code === 'ENOENT'`; `SyntaxError` від `JSON.parse` треба передати далі."
          en: "This check gives a file with a cut-off JSON text and expects `initStore` to reject while the file stays the same. “No file” is only `error.code === 'ENOENT'`; a `SyntaxError` from `JSON.parse` must be passed on."
      - when: { test: "startServer finishes initStore before it listens" }
        message:
          uk: "Ця перевірка дивиться у сховище в мить виклику `listen()` і очікує там уже дві фікстури. Познач `await` перед `initStore` і виклич його раніше за `listen`."
          en: "This check looks into the store at the moment `listen()` is called and expects the two fixtures to be there already. Put `await` before `initStore` and call it before `listen`."

  - id: to-project
    kind: transfer
    capstoneStep: NO-05
    body:
      uk: "У кроці проєкту цього розділу сервер твого домену під час запуску спершу викликатиме ініціалізацію сховища й лише потім `listen` на `127.0.0.1`. Перевір там те саме, що й тут: три запуски поспіль, видалений запис після перезапуску не повертається."
      en: "In this unit’s project step your domain’s server will first call storage initialization on start and only then `listen` on `127.0.0.1`. Check the same things there as here: three starts in a row, and a deleted record does not come back after a restart."
