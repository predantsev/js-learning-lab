id: no-05-01-schema-contract
unit: NO-05
title:
  uk: "Контракт схеми"
  en: "The schema contract"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Написати контракт схеми для збережених записів — поля, типи, обмеження, значення за замовчуванням і `schemaVersion`, — який імпортують і репозиторій, і валідатор API, і тести."
    en: "Write a schema contract for stored records — fields, types, constraints, defaults and `schemaVersion` — that the repository, the API validator and the tests all import."
  - uk: "Перевіряти кожен запис під час завантаження за контрактом і передбачати, які збережені значення він відхилить."
    en: "Validate every record on load against the contract and predict which stored values it rejects."
prerequisites: [no-09-10-independent-schema-design, no-04-02-schema-validation]
subskills:
  - { family: B-05, skill: "schema contract", depth: intro }
glossary: [schema-contract]
selfCheck: [predict-accepted, notes-contract]

blocks:
  - id: disk-is-input
    kind: explanation
    title:
      uk: "Те, що лежить на диску, — теж вхідні дані"
      en: "What lies on the disk is input too"
    body:
      uk: |
        Сервер щойно запустився й читає `wishlist.json`. Чи можна вірити цьому файлу? Його писала стара версія програми, яка ще не знала поля `category`. Його відкривали руками, щоб виправити помилку. А один баг рік тому записав ціну текстом `"25"`.

        TypeScript тут не допоможе. `interface Wish { price: number | null }` описує, що **мав би** містити об’єкт, але, як ти бачив у NO-01, типи прибирають ще до запуску: `JSON.parse` поверне те, що є у файлі, і жоден тип цього не перевірить.

        Тому потрібен [[schema-contract|контракт схеми]] — звичайний модуль JavaScript, що існує й під час виконання:

        - `version` — яку [[schema-version|версію схеми]] він описує;
        - для кожного поля — тип, обмеження й, якщо поле необов’язкове, значення за замовчуванням (`default`);
        - поле, якого немає в контракті, — невідоме, і запис із ним відхиляється.

        Цей один модуль імпортують усі: репозиторій — коли читає й пише файл, валідатор API — коли перевіряє тіло запиту, тести — коли будують дані. Правило змінюється в одному місці, і всі бачать ту саму зміну.
      en: |
        The server has just started and reads `wishlist.json`. Can you trust that file? An old version of the program wrote it before it knew the `category` field. Someone opened it by hand to fix a mistake. And a bug a year ago stored a price as the text `"25"`.

        TypeScript does not help here. `interface Wish { price: number | null }` describes what an object **should** hold, but, as you saw in NO-01, types are removed before the code runs: `JSON.parse` returns whatever is in the file, and no type checks it.

        So you need a [[schema-contract]] — an ordinary JavaScript module that exists while the program runs:

        - `version` — which [[schema-version]] it describes;
        - for every field — its type, its constraints and, when the field is optional, a `default`;
        - a field the contract does not list is unknown, and a record with it is rejected.

        Everyone imports this one module: the repository when it reads and writes the file, the API validator when it checks a request body, the tests when they build data. A rule changes in one place, and everyone sees the same change.

  - id: contract-users
    kind: visual
    visual: diagram
    title:
      uk: "Один контракт, чотири користувачі"
      en: "One contract, four users"
    textEquivalent:
      uk: "У центрі — модуль store-contract.js із версією схеми й правилами полів. Від нього стрілки йдуть до чотирьох місць: load() репозиторію читає файл і перевіряє кожен запис, save() перевіряє запис перед записом, валідатор API перевіряє тіло запиту, тести імпортують ті самі правила. Потім із файла приходить збережений запис витрати, де amountMinor записано текстом \"84550\". Він іде в load(), правило amountMinor вимагає число, тож запис зупинено ще під час завантаження — до того, як він дійде до підсумків чи до відповіді API."
      en: "In the centre is the store-contract.js module with the schema version and the field rules. Arrows go from it to four places: the repository’s load() reads the file and checks every record, save() checks a record before writing it, the API validator checks a request body, and the tests import the same rules. Then a stored expense record arrives from the file with amountMinor written as the text \"84550\". It goes into load(), the amountMinor rule requires a number, so the record is stopped already at load — before it can reach a total or an API response."
    spec:
      layout: lr
      nodes:
        - { id: stored, label: "amountMinor \"84550\"", shape: note }
        - { id: contract, label: "store-contract.js", shape: round }
        - { id: load, label: "load()" }
        - { id: save, label: "save()" }
        - { id: api, label: { uk: "валідатор API", en: "API validator" } }
        - { id: tests, label: { uk: "тести", en: "tests" } }
      edges:
        - { from: contract, to: load }
        - { from: contract, to: save }
        - { from: contract, to: api }
        - { from: contract, to: tests }
        - { from: stored, to: load, kind: dashed }
      hidden: [stored, stored->load]
      steps:
        - caption:
            uk: "`store-contract.js` описує версію схеми й правило кожного поля. Це звичайний модуль, тож він існує під час виконання."
            en: "`store-contract.js` describes the schema version and the rule of every field. It is an ordinary module, so it exists while the program runs."
          highlight: [contract]
        - caption:
            uk: "Репозиторій перевіряє за ним кожен запис **під час завантаження** й кожен запис **перед збереженням**."
            en: "The repository checks every record against it **on load** and every record **before saving**."
          highlight: [load, save, contract->load, contract->save]
        - caption:
            uk: "Валідатор API перевіряє тіло запиту за тими самими правилами, а тести будують дані з них. Розбіжності між трьома копіями правил немає — копія одна."
            en: "The API validator checks a request body against the same rules, and the tests build data from them. Three copies of the rules cannot drift apart — there is only one copy."
          highlight: [api, tests, contract->api, contract->tests]
        - caption:
            uk: "З файла приходить запис, де `amountMinor` — текст `\"84550\"`. Колись його записав баг, і відтоді він лежить на диску."
            en: "A record arrives from the file with `amountMinor` as the text `\"84550\"`. A bug wrote it once, and it has lain on the disk ever since."
          show: [stored, stored->load]
          highlight: [stored, stored->load]
        - caption:
            uk: "`load()` порівнює його з правилом: потрібне число, а тут текст. Запис зупинено під час завантаження, а не тоді, коли `\"84550\" + 9990` дасть у підсумку текст `\"845509990\"`."
            en: "`load()` compares it with the rule: a number is required, and this is text. The record is stopped at load, not later when `\"84550\" + 9990` turns a total into the text `\"845509990\"`."
          highlight: [load, contract->load]
          annotate:
            - { id: load, text: { uk: "відхилено", en: "rejected" } }

  - id: predict-accepted
    kind: prediction
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    prompt:
      uk: "`load` перевіряє збережене сховище бажань за маленьким контрактом. Яким сховищам він повідомить `accepted`?"
      en: "`load` checks a stored wish store against a small contract. Which stores does it report as `accepted`?"
    code: |
      const rules = {
        id: (value) => typeof value === "string",
        name: (value) => typeof value === "string" && value.trim() !== "",
        price: (value) => value === null || (typeof value === "number" && value >= 0),
        acquired: (value) => typeof value === "boolean",
      };
      const defaults = { price: null, acquired: false };

      function load(store) {
        if (store.schemaVersion !== 1) return "rejected: schemaVersion";
        const wish = { ...defaults, ...store.records[0] };
        for (const key of Object.keys(wish)) {
          if (!(key in rules) || !rules[key](wish[key])) return `rejected: ${key}`;
        }
        return "accepted";
      }

      const lamp = { id: "w-02", name: "%%lamp%%", price: 45, acquired: false };
      const stores = {
        A: { schemaVersion: 1, records: [{ id: "w-02", name: "%%lamp%%" }] },
        B: { schemaVersion: 1, records: [{ ...lamp, color: "green" }] },
        C: { schemaVersion: 1, records: [{ ...lamp, price: "45" }] },
        D: { schemaVersion: 0, records: [lamp] },
        E: { schemaVersion: 1, records: [lamp] },
      };
      for (const [name, store] of Object.entries(stores)) console.log(name, load(store));
    verify:
      logs: ["A accepted", "B rejected: color", "C rejected: price", "D rejected: schemaVersion", "E accepted"]
    answer:
      type: multi
      options:
        - id: a
          text:
            uk: "A — без `price` і `acquired`"
            en: "A — without `price` and `acquired`"
        - id: b
          text:
            uk: "B — із зайвим полем `color`"
            en: "B — with an extra field `color`"
          why:
            uk: "`color` немає серед правил, тож `key in rules` дає `false`. Контракт відхиляє поле, якого не знає, — інакше друкарська помилка в назві поля тихо лягла б на диск."
            en: "`color` is not among the rules, so `key in rules` is `false`. The contract rejects a field it does not know — otherwise a typo in a field name would quietly land on the disk."
        - id: c
          text:
            uk: "C — `price` записано текстом `\"45\"`"
            en: "C — `price` stored as the text `\"45\"`"
          why:
            uk: "Те, що цей запис колись записала програма, не робить його правильним: `typeof \"45\"` — `\"string\"`, а правило вимагає число."
            en: "That a program once wrote this record does not make it valid: `typeof \"45\"` is `\"string\"`, and the rule requires a number."
        - id: d
          text:
            uk: "D — правильний запис, але `schemaVersion: 0`"
            en: "D — a valid record, but `schemaVersion: 0`"
          why:
            uk: "Перевірка версії йде першою: контракт описує саме версію 1. Сховище іншої версії треба спершу перенести на поточну, а не читати так, ніби форма та сама."
            en: "The version check comes first: the contract describes version 1 exactly. A store of another version must first be moved to the current one, not read as if its shape were the same."
        - id: e
          text:
            uk: "E — повний правильний запис"
            en: "E — a complete valid record"
      correct: [a, e]
    explanation:
      uk: "A прийнято, бо відсутні необов’язкові поля отримують значення за замовчуванням (`price: null`, `acquired: false`) ще до перевірки. B, C і D відхилено: невідоме поле, текст замість числа й чужа версія схеми. Усі три колись могли потрапити на диск — саме тому їх перевіряють під час завантаження. Цей маленький `load` перевіряє лише ті ключі, що є в записі, тож запис без обов’язкового `name` він пропустив би; повний завантажувач окремо перевіряє, чи є кожне обов’язкове поле."
      en: "A is accepted because the missing optional fields get their defaults (`price: null`, `acquired: false`) before the check. B, C and D are rejected: an unknown field, text instead of a number and a foreign schema version. Any of the three could once have reached the disk — that is exactly why they are checked on load. This small `load` checks only the keys the record has, so it would let through a record without the required `name`; a complete loader also checks separately that every required field is there."

  - id: load-through-contract
    kind: example
    runtime: isolated-node
    dir: load-through-contract
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      tech: { uk: "Техніка", en: "Tech" }
      sport: { uk: "Спорт", en: "Sport" }
      books: { uk: "Книжки", en: "Books" }
      note: { uk: "подарунок на день народження", en: "birthday present" }
      loaded: { uk: "завантажено бажань", en: "wishes loaded" }
      rejected: { uk: "сховище відхилено", en: "store rejected" }
    title:
      uk: "Завантаження через контракт"
      en: "Loading through the contract"
    body:
      uk: |
        Натисни **Запустити**. `index.js` читає `data/wishlist.json` так, як це робитиме сервер під час запуску: увесь текст іде в `parseStore` разом із `wishContract` зі `store-contract.js`.

        Ця `parseStore` зупиняється на **першій** проблемі й кидає помилку, що називає її місце: шлях на кшталт `records[1].category` каже, який запис і яке поле. `records`, що не є масивом, — теж проблема, а не «записів немає». Зверни увагу, як незручно лагодити файл, коли бачиш лише одну проблему за запуск: у вправі твій завантажувач збиратиме всі одразу.
      en: |
        Press **Run**. `index.js` reads `data/wishlist.json` the way the server will on start: the whole text goes into `parseStore` together with `wishContract` from `store-contract.js`.

        This `parseStore` stops at the **first** problem and throws an error that names its place: a path such as `records[1].category` says which record and which field. A `records` that is not an array is a problem too, not “there are no records”. Notice how awkward it is to repair a file when you see one problem per run: in the exercise your loader will collect all of them at once.
    tryIt:
      uk: |
        Запусти: `сховище відхилено: records[1].category: required`. Проблем у файлі три, і дві з них виправ у контракті, а не у файлі:

        1. У `store-contract.js` додай до правила `category` значення `default: null` і запусти: бажання без категорії тепер приймається, і завантажувач доходить до наступної проблеми — `records[2].note: unknown field`.
        2. Додай до `fields` правило для поля з нотаткою: `note: { type: 'string', maxLength: 200, default: null, nullable: true },` — і запусти ще раз.

        Лишиться одна проблема — `records[3].price: expected number, got string`. Її контракт і має зупиняти: ціну текстом не виправиш правилом, це пошкоджені дані, і про них ітиметься в уроці про відновлення.
      en: |
        Run it: `store rejected: records[1].category: required`. The file has three problems; fix two of them in the contract, not in the file:

        1. In `store-contract.js`, add `default: null` to the `category` rule and run: a wish without a category is accepted now, and the loader gets to the next problem — `records[2].note: unknown field`.
        2. Add a rule for the note field to `fields`: `note: { type: 'string', maxLength: 200, default: null, nullable: true },` — and run again.

        One problem is left — `records[3].price: expected number, got string`. That is exactly what the contract must stop: a price stored as text is not fixed by a rule, it is damaged data, and the lesson about recovery deals with it.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: чого не вміщає JSON"
      en: "Recall: what JSON cannot hold"
    items:
      - id: nan-price
        from: js-07-04-json
        prompt:
          uk: "Баг поклав у ціну `NaN`, і бажання збережено через `JSON.stringify`. Що побачить код, який завантажить його назад?"
          en: "A bug put `NaN` into a price, and the wish was saved with `JSON.stringify`. What does the code that loads it back see?"
        code: |
          const saved = JSON.stringify({ id: "w-03", price: NaN, note: undefined });
          const loaded = JSON.parse(saved);
          console.log(loaded.price, "note" in loaded);
        verify:
          logs: ["null false"]
        answer:
          type: choice
          options:
            - id: null-gone
              code: "null false"
            - id: nan-kept
              code: "NaN true"
              why:
                uk: "У JSON немає ні `NaN`, ні `undefined`: `NaN` записується як `null`, а поле з `undefined` пропадає зовсім."
                en: "JSON has neither `NaN` nor `undefined`: `NaN` is written as `null`, and a field holding `undefined` disappears entirely."
            - id: null-kept
              code: "null true"
              why:
                uk: "`NaN` справді стає `null`, але поле з `undefined` `JSON.stringify` пропускає, тож `note` у розібраному об’єкті немає."
                en: "`NaN` does become `null`, but `JSON.stringify` skips a field holding `undefined`, so the parsed object has no `note`."
          correct: [null-gone]
        explanation:
          uk: "Зіпсоване значення повертається з файла таким, що виглядає законно: `price: null` — це «ціни немає», і контракт із `nullable: true` його прийме. Контракт ловить неправильний **тип**, але не відновить того, що JSON уже втратив під час запису, — тому `save()` перевіряє запис **до** `JSON.stringify`."
          en: "The damaged value comes back from the file looking legitimate: `price: null` means “no price”, and a contract with `nullable: true` accepts it. A contract catches a wrong **type**, but it cannot restore what JSON already lost while writing — which is why `save()` checks a record **before** `JSON.stringify`."

  - id: notes-contract
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: notes-contract
    entry: index.js
    editable: [app.js]
    strings:
      shopping: { uk: "Список покупок", en: "Shopping list" }
      shoppingBody: { uk: "хліб, яблука, чай", en: "bread, apples, tea" }
      ideas: { uk: "Ідеї на вихідні", en: "Weekend ideas" }
      body: { uk: "кілька рядків тексту", en: "a few lines of text" }
      rejected: { uk: "відхилено", en: "rejected" }
    title:
      uk: "Контракт сховища нотаток"
      en: "A contract for a notes store"
    instructions:
      uk: |
        Сховище нотаток лежить у файлі як `{ schemaVersion, records }`. У `app.js` закінчи контракт і завантажувач:

        - `storeContract` — версія `1` і правила для чотирьох полів: `id` і `title` уже є; додай `body` (текст, `''`, якщо поля немає) і `pinned` (`true`/`false`, `false`, якщо поля немає);
        - `parseStore(json)` повертає `{ schemaVersion, records }`, де кожен запис має всі чотири поля, а відсутні необов’язкові поля отримали значення за замовчуванням;
        - коли щось не так, `parseStore` кидає `Error` із масивом `problems`. Кожна проблема — текст, що називає місце: `schemaVersion`, `records` або шлях на кшталт `records[2].title`;
        - проблема — це: `schemaVersion` не `1`; `records` не масив; відсутнє обов’язкове поле; значення, яке не проходить `checkField` з `rules.js`; поле, якого немає в контракті; `id`, що вже траплявся раніше в цьому сховищі;
        - `parseStore` збирає **всі** проблеми й лише потім кидає помилку.

        `checkField(rule, value)` у `rules.js` уже вміє перевірити одне значення: повертає текст проблеми або `null`.
      en: |
        The notes store lies in a file as `{ schemaVersion, records }`. In `app.js`, finish the contract and the loader:

        - `storeContract` — version `1` and rules for four fields: `id` and `title` are there; add `body` (text, `''` when the field is missing) and `pinned` (`true`/`false`, `false` when the field is missing);
        - `parseStore(json)` returns `{ schemaVersion, records }`, where every record has all four fields and missing optional fields got their defaults;
        - when something is wrong, `parseStore` throws an `Error` with a `problems` array. Each problem is a text that names the place: `schemaVersion`, `records` or a path such as `records[2].title`;
        - a problem is: `schemaVersion` is not `1`; `records` is not an array; a required field is missing; a value fails `checkField` from `rules.js`; a field the contract does not list; an `id` that already appeared earlier in this store;
        - `parseStore` collects **every** problem and only then throws.

        `checkField(rule, value)` in `rules.js` already checks one value: it returns a problem text or `null`.
    testTitles:
      "a valid store loads with every record":
        uk: "Правильне сховище завантажується з усіма записами"
        en: "A valid store loads with every record"
      "missing body and pinned get their defaults":
        uk: "Відсутні `body` і `pinned` отримують значення за замовчуванням"
        en: "Missing `body` and `pinned` get their defaults"
      "a title stored as a number is rejected":
        uk: "`title`, записаний числом, відхиляється"
        en: "A `title` stored as a number is rejected"
      "a record without a title is rejected":
        uk: "Запис без `title` відхиляється"
        en: "A record without a `title` is rejected"
      "an unknown field is rejected":
        uk: "Невідоме поле відхиляється"
        en: "An unknown field is rejected"
      "a repeated id is rejected":
        uk: "Повторений `id` відхиляється"
        en: "A repeated `id` is rejected"
      "a store with another schemaVersion is rejected":
        uk: "Сховище з іншою `schemaVersion` відхиляється"
        en: "A store with another `schemaVersion` is rejected"
      "a store whose records is not an array is rejected":
        uk: "Сховище, де `records` не масив, відхиляється"
        en: "A store whose `records` is not an array is rejected"
      "every problem is reported at once":
        uk: "Усі проблеми повідомлено одразу"
        en: "Every problem is reported at once"
      "storeContract has version 1 and rules for id, title, body and pinned":
        uk: "`storeContract` має версію 1 і правила для `id`, `title`, `body` і `pinned`"
        en: "`storeContract` has version 1 and rules for `id`, `title`, `body` and `pinned`"
    hints:
      nudge:
        uk: "Пройди двома циклами: один — по ключах збереженого запису (чи всі вони є в контракті?), другий — по правилах контракту (чи є значення, і якщо ні — чи є `default`?). Проблеми не кидай одразу, а складай у масив."
        en: "Walk two loops: one over the keys of the stored record (are they all in the contract?), the other over the contract’s rules (is there a value, and if not — is there a `default`?). Do not throw problems at once; push them into an array."
      explanation:
        uk: "Для схожої задачі — контракту справ — це виглядало б так: `for (const [name, rule] of Object.entries(taskContract.fields))`; якщо `stored[name] === undefined`, то `Object.hasOwn(rule, 'default')` вирішує, взяти `rule.default` чи записати проблему `records[${i}].${name}: required`. Невідоме поле — це ключ збереженого запису, для якого `Object.hasOwn(taskContract.fields, key)` дає `false`. Для повторів зручний `Set` уже побачених `id`. У кінці: якщо масив проблем не порожній — `throw Object.assign(new Error('…'), { problems })`."
        en: "For a similar task — a contract for tasks — it would look like this: `for (const [name, rule] of Object.entries(taskContract.fields))`; when `stored[name] === undefined`, `Object.hasOwn(rule, 'default')` decides whether to take `rule.default` or to record the problem `records[${i}].${name}: required`. An unknown field is a key of the stored record for which `Object.hasOwn(taskContract.fields, key)` is `false`. For repeats, a `Set` of the `id`s seen so far is handy. At the end: when the problems array is not empty — `throw Object.assign(new Error('…'), { problems })`."
    solutionNote:
      uk: "Контракт — це дані, а `parseStore` лише проходить ними: тому нове поле — це один рядок у `storeContract`, а не нова гілка `if` у завантажувачі. Проблеми збираються в масив, і лише в кінці кидається одна помилка — людина, яка лагодить файл, бачить усе одразу. Повернуто новий об’єкт із заповненими значеннями за замовчуванням, тож решта сервера працює з повними записами. Інша форма — окрема функція перевірки одного запису, яка повертає `{ record, problems }`, — теж правильна."
      en: "The contract is data, and `parseStore` only walks it: so a new field is one line in `storeContract`, not a new `if` branch in the loader. Problems go into an array, and only at the end is one error thrown — whoever repairs the file sees everything at once. A new object with the defaults filled in is returned, so the rest of the server works with complete records. Another shape — a separate function that checks one record and returns `{ record, problems }` — is correct too."
    feedback:
      - when: { test: "missing body and pinned get their defaults" }
        message:
          uk: "Ця перевірка завантажує запис лише з `id` і `title` й очікує `body: ''` і `pinned: false`. Значення за замовчуванням живе в правилі контракту (`default`), а `parseStore` бере його, коли поля немає."
          en: "This check loads a record with only `id` and `title` and expects `body: ''` and `pinned: false`. The default lives in the contract’s rule (`default`), and `parseStore` takes it when the field is missing."
      - when: { test: "an unknown field is rejected" }
        message:
          uk: "Ця перевірка додає до запису поле `colour` і очікує проблему зі шляхом `records[0].colour`. Пройди ключами самого збереженого запису й порівняй їх зі списком полів контракту."
          en: "This check adds a field `colour` to a record and expects a problem with the path `records[0].colour`. Walk the keys of the stored record itself and compare them with the contract’s list of fields."
      - when: { test: "a repeated id is rejected" }
        message:
          uk: "Ця перевірка кладе два записи з `id` `n-01` і очікує проблему зі шляхом `records[1].id` — для другого з них."
          en: "This check stores two records with the `id` `n-01` and expects a problem with the path `records[1].id` — for the second of them."
      - when: { test: "a store with another schemaVersion is rejected" }
        message:
          uk: "Ця перевірка дає сховище зі `schemaVersion: 2` і правильними записами й очікує проблему, у тексті якої є `schemaVersion`."
          en: "This check gives a store with `schemaVersion: 2` and valid records and expects a problem whose text contains `schemaVersion`."
      - when: { test: "a store whose records is not an array is rejected" }
        message:
          uk: "Ця перевірка дає сховище, де `records` — об’єкт, а не масив, і очікує, що `parseStore` кине помилку з масивом `problems`, у якому є слово `records`. Порожнє сховище замість цього — тиха втрата всіх нотаток."
          en: "This check gives a store whose `records` is an object, not an array, and expects `parseStore` to throw an error with a `problems` array that contains the word `records`. An empty store instead would silently lose every note."
      - when: { test: "every problem is reported at once" }
        message:
          uk: "Ця перевірка дає сховище з трьома проблемами (`schemaVersion`, `records[0].pinned`, `records[1].title`) і очікує всі три в `error.problems`. Не кидай помилку на першій проблемі — збери їх і кинь одну в кінці."
          en: "This check gives a store with three problems (`schemaVersion`, `records[0].pinned`, `records[1].title`) and expects all three in `error.problems`. Do not throw at the first problem — collect them and throw one at the end."
      - when: { test: "storeContract has version 1 and rules for id, title, body and pinned" }
        message:
          uk: "Ця перевірка очікує в `storeContract.fields` рівно чотири правила: `id`, `title`, `body`, `pinned` — і `version: 1`."
          en: "This check expects exactly four rules in `storeContract.fields`: `id`, `title`, `body`, `pinned` — and `version: 1`."
      - when: { error: TypeError }
        message:
          uk: "Якщо всі перевірки впали одночасно, спершу виправ першу помилку в консолі. `TypeError` під час завантаження часто означає звернення до поля `undefined` — наприклад, `.map` у `records`, який не масив."
          en: "If every check fails at once, fix the first error in the console first. A `TypeError` while loading often means reading a field of `undefined` — for example `.map` on a `records` that is not an array."

  - id: to-project
    kind: transfer
    capstoneStep: NO-05
    body:
      uk: "Крок проєкту цього розділу ще не написаний. За планом курсу в ньому контракт твого домену стане окремим модулем, який імпортують репозиторій сервера, валідатор `/v1` і тести. Поки що знайди у своєму сервері місце, де дані читаються з файла, — там і має перевірятися контракт під час завантаження."
      en: "The project step of this unit is not written yet. According to the course plan, in it your domain’s contract becomes a separate module imported by the server’s repository, the `/v1` validator and the tests. For now, find the place in your server where data is read from the file — that is where the contract should be checked on load."
