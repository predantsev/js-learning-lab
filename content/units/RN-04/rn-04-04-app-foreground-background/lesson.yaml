id: rn-04-04-app-foreground-background
unit: RN-04
title:
  uk: "Застосунок на передньому плані й у фоні"
  en: "App foreground and background"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Простежити зміни AppState (active → background → active, плюс inactive на iOS) і передбачити, які з них приходять, коли людина перемикається на інший застосунок чи блокує екран."
    en: "Trace AppState transitions (active → background → active, plus inactive on iOS) and predict which of them fire when the user switches apps or locks the screen."
  - uk: "Зберігати чернетку, коли застосунок іде з переднього плану, і оновлювати значення, що залежать від дати, коли він повертається."
    en: "Save the edit draft when the app leaves the foreground and refresh date-dependent values when it returns."
prerequisites: [rn-04-03-screen-focus-vs-mount]
subskills:
  - { family: N-03, skill: "app foreground/background", depth: intro }
glossary: [native-app-state, app-foreground, app-background]
selfCheck: [predict-app-state-events, task-lifecycle]

blocks:
  - id: app-leaves
    kind: explanation
    title:
      uk: "Що стається, коли людина йде з застосунку"
      en: "What happens when the person leaves the app"
    body:
      uk: |
        Фокус екрана каже, який екран угорі **всередині** застосунку. Але людина може піти з застосунку взагалі: на головний екран, в інший застосунок, заблокувати телефон. Про це повідомляє модуль React Native [[native-app-state|AppState]]: `AppState.currentState` — поточний стан, а `AppState.addEventListener('change', (next) => …)` викликає функцію при кожній зміні й повертає підписку з методом `remove()`.

        Стани:

        - `active` — застосунок на [[app-foreground|передньому плані]], людина з ним працює;
        - `background` — застосунок у [[app-background|фоні]]: людина в іншому застосунку чи на головному екрані;
        - `inactive` — **лише iOS**: короткий перехід між ними, а також коли зверху відкрито центр сповіщень, перемикач застосунків чи вхідний дзвінок.

        За вихідним кодом React Native 0.86 (`RCTAppState.mm` для iOS, `AppStateModule.kt` для Android), коли людина йде з застосунку, iOS надсилає `inactive`, потім `background`, а Android — одразу `background`. Повернення — `active` на обох.
      en: |
        Screen focus tells you which screen is on top **inside** the app. But the person may leave the app altogether: to the home screen, another app, or lock the phone. React Native's [[native-app-state|AppState]] module reports that: `AppState.currentState` is the current state, and `AppState.addEventListener('change', (next) => …)` calls a function on every change and returns a subscription with a `remove()` method.

        The states:

        - `active` — the app is in the [[app-foreground|foreground]], the person is using it;
        - `background` — the app is in the [[app-background|background]]: the person is in another app or on the home screen;
        - `inactive` — **iOS only**: a short transition between them, and also while the Notification Center, the app switcher or an incoming call is on top.

        According to the React Native 0.86 source (`RCTAppState.mm` for iOS, `AppStateModule.kt` for Android), when the person leaves the app iOS sends `inactive`, then `background`, while Android sends `background` straight away. Coming back is `active` on both.

  - id: predict-app-state-events
    kind: prediction
    prompt:
      uk: "Застосунок підписався на `AppState.addEventListener('change', …)` і записує кожен новий стан. Людина перемикається на інший застосунок і потім повертається. Що буде записано на Android і що на iOS?"
      en: "An app subscribed with `AppState.addEventListener('change', …)` and records every new state. The person switches to another app and then comes back. What is recorded on Android and what on iOS?"
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "Android: background, active · iOS: inactive, background, active"
            en: "Android: background, active · iOS: inactive, background, active"
        - id: same
          text:
            uk: "Android і iOS: inactive, background, active"
            en: "Android and iOS: inactive, background, active"
          why:
            uk: "`inactive` — стан лише iOS. Android одразу надсилає `background`, тож код, що чекає `inactive`, на Android нічого не дочекається."
            en: "`inactive` is an iOS-only state. Android sends `background` straight away, so code waiting for `inactive` never gets it on Android."
        - id: nothing
          text:
            uk: "Нічого: застосунок у фоні призупинено, тож він не дізнається, що його залишили"
            en: "Nothing: an app in the background is suspended, so it never learns it was left"
          why:
            uk: "Зміна на `background` приходить ще до призупинення — саме тому в ній і зберігають чернетку. А повернення приносить `active`."
            en: "The change to `background` arrives before the suspension — that is exactly why the draft is saved there. And coming back brings `active`."
        - id: return-inactive
          text:
            uk: "Android: background, active · iOS: inactive, background, inactive, active"
            en: "Android: background, active · iOS: inactive, background, inactive, active"
          why:
            uk: "За кодом React Native 0.86 iOS при поверненні з фону одразу надсилає `active`: проміжний `inactive` буває при виході, а не при поверненні з фону."
            en: "According to the React Native 0.86 code, iOS sends `active` straight away when coming back from the background: the intermediate `inactive` happens on leaving, not when returning from the background."
      correct: [right]
    explanation:
      uk: "Тому дію «застосунок пішов» привʼязують до `background` — він приходить на обох платформах, — а `inactive` лише як ранній сигнал на iOS. Ці послідовності взято з вихідного коду React Native 0.86; на пристрої їх перевіриш, записуючи стани в консоль."
      en: "That is why the “app went away” action is tied to `background` — it arrives on both platforms — and `inactive` only as an early signal on iOS. These sequences are taken from the React Native 0.86 source; on a device you check them by logging the states to the console."

  - id: no-warning
    kind: explanation
    title:
      uk: "Фон — не прихована вкладка"
      en: "The background is not a hidden tab"
    body:
      uk: |
        Прихована вкладка браузера далі виконує код, лише повільніше. Нативний застосунок у фоні — інша історія:

        - система **призупиняє** його невдовзі після переходу у фон (на iOS — майже одразу): таймери стоять, запити можуть обірватися;
        - коли памʼяті бракує, система **закриває** призупинений застосунок — і не попереджає його. Подій «зараз тебе закриють» немає.

        Звідси правило: усе, що шкода втратити, зберігають **у момент переходу в `background`** — це остання гарантована нагода. Чернетку з екрана редагування записують туди, звідки її можна відновити.

        А при поверненні (`active`) оновлюють те, що могло застаріти, поки застосунок стояв: передусім усе, що залежить від сьогоднішньої дати. Людина могла піти ввечері й повернутися зранку — список «на сьогодні» вже інший. Дату, як і раніше, бери з адаптера годинника й передавай у доменну функцію параметром.
      en: |
        A hidden browser tab keeps running code, only slower. A native app in the background is a different story:

        - the system **suspends** it soon after it goes to the background (on iOS almost at once): timers stop, requests may be cut off;
        - when memory runs short, the system **closes** a suspended app — without warning it. There is no “you are about to be closed” event.

        Hence the rule: whatever would be a pity to lose is saved **at the moment of the change to `background`** — it is the last guaranteed chance. The draft from the edit screen is written somewhere it can be restored from.

        And on return (`active`) you refresh what may have gone stale while the app was standing still: above all, whatever depends on today's date. The person may have left in the evening and come back in the morning — the “today” list is different now. As before, take the date from the clock adapter and pass it to the domain function as a parameter.

  - id: background-sequence
    kind: visual
    visual: sequence
    title:
      uk: "Вихід з застосунку на iOS і повернення"
      en: "Leaving the app on iOS and coming back"
    textEquivalent:
      uk: "Людина перемикається на інший застосунок. Операційна система надсилає слухачеві AppState стан inactive — на iOS це короткий перехід, і слухач нічого не робить. Потім система надсилає background, і слухач записує чернетку в сховище чернеток: після цього система може призупинити або закрити застосунок без попередження. Коли людина повертається, система надсилає active, і слухач оновлює значення, що залежать від сьогоднішньої дати, наприклад кількість справ на сьогодні. На Android послідовність та сама, але без inactive."
      en: "The person switches to another app. The operating system sends the AppState listener the state inactive — on iOS a short transition, and the listener does nothing. Then the system sends background, and the listener writes the draft to the draft store: after that the system may suspend or close the app without warning. When the person comes back, the system sends active, and the listener refreshes the values that depend on today's date, such as the count of tasks due today. On Android the sequence is the same, but without inactive."
    spec:
      actors:
        - { id: os, label: { uk: "Система (iOS)", en: "System (iOS)" } }
        - { id: listener, label: { uk: "Слухач AppState", en: "AppState listener" } }
        - { id: drafts, label: { uk: "Сховище чернеток", en: "Draft store" } }
      messages:
        - from: os
          to: listener
          label: "change: inactive"
          caption:
            uk: "Людина відкриває перемикач застосунків — iOS надсилає `inactive`. Це ще перехід: слухач нічого не робить."
            en: "The person opens the app switcher — iOS sends `inactive`. This is still a transition: the listener does nothing."
        - from: os
          to: listener
          label: "change: background"
          caption:
            uk: "Інший застосунок відкрито — `background`. Це остання гарантована нагода щось зберегти."
            en: "Another app is open — `background`. This is the last guaranteed chance to save something."
        - from: listener
          to: drafts
          label: "saveDraft(draft)"
          caption:
            uk: "Слухач записує чернетку. Далі система може призупинити застосунок або закрити його без жодної події."
            en: "The listener writes the draft. After that the system may suspend the app or close it without any event."
        - from: os
          to: os
          kind: note
          label: { uk: "застосунок призупинено", en: "app suspended" }
          caption:
            uk: "Поки застосунок у фоні, його таймери стоять. Минає ніч."
            en: "While the app is in the background, its timers stand still. A night passes."
        - from: os
          to: listener
          label: "change: active"
          caption:
            uk: "Людина повертається — `active`."
            en: "The person comes back — `active`."
        - from: listener
          to: listener
          kind: note
          label: "refreshToday()"
          caption:
            uk: "Слухач бере нову дату з адаптера годинника й перераховує значення «на сьогодні». На Android усе так само, лише без `inactive`."
            en: "The listener takes the new date from the clock adapter and recomputes the “today” values. On Android it is all the same, only without `inactive`."

  - id: habits-today
    kind: example
    runtime: concept-preview
    dir: habits-today
    entry: main.jsx
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      todayLabel: { uk: "Сьогодні:", en: "Today:" }
      doneLabel: { uk: "Виконано сьогодні:", en: "Done today:" }
      midnight: { uk: "Імітований годинник: настала північ", en: "Simulated clock: midnight passes" }
      simAppState: { uk: "Стан застосунку (імітація)", en: "App state (simulated)" }
      simLeaveIos: { uk: "iOS: піти з застосунку", en: "iOS: leave the app" }
      simLeaveAndroid: { uk: "Android: піти з застосунку", en: "Android: leave the app" }
      simReturn: { uk: "Повернутися", en: "Come back" }
    title:
      uk: "Підсумок дня, що не помічає нового дня"
      en: "A day summary that misses the new day"
    body:
      uk: |
        Екран показує, скільки звичок виконано сьогодні. Дату він бере з адаптера годинника `clock.today()` один раз — при першому рендері. Слухач AppState поки лише пише кожен новий стан у консоль. Кнопки під екраном імітують вихід з застосунку на iOS і на Android та повернення.

        Натисни **Запустити**, потім «iOS: піти з застосунку», «Повернутися», «Android: піти з застосунку», «Повернутися» — і порівняй рядки в консолі.
      en: |
        The screen shows how many habits are done today. It takes the date from the clock adapter `clock.today()` once — on the first render. The AppState listener only writes each new state to the console for now. The buttons under the screen simulate leaving the app on iOS and on Android, and coming back.

        Press **Run**, then “iOS: leave the app”, “Come back”, “Android: leave the app”, “Come back” — and compare the console lines.
    tryIt:
      uk: |
        1. Натисни «iOS: піти з застосунку», потім «Імітований годинник: настала північ», потім «Повернутися». Екран і далі показує 2026-03-01: дату ніхто не перечитав.
        2. У слухачі після `console.log` додай: якщо `next` дорівнює `'active'`, виклич `setToday(clock.today())`.
        3. Запусти знову й повтори крок 1: після «Повернутися» дата 2026-03-02, і «Виконано сьогодні» перераховано.
      en: |
        1. Press “iOS: leave the app”, then “Simulated clock: midnight passes”, then “Come back”. The screen still shows 2026-03-01: nobody re-read the date.
        2. In the listener, after `console.log`, add: if `next` equals `'active'`, call `setToday(clock.today())`.
        3. Run again and repeat step 1: after “Come back” the date is 2026-03-02, and “Done today” is recomputed.
    limits:
      uk: "Це перегляд react-native-web. Тут `AppState` імітує `appStateSim.jsx`: кнопки надсилають ті послідовності станів, що описані у вихідному коді React Native 0.86, але справжнього виходу з застосунку, призупинення й закриття системою немає. Їх перевіряють на заявленій цілі."
      en: "This is a react-native-web preview. Here `AppState` is simulated by `appStateSim.jsx`: the buttons send the state sequences described in the React Native 0.86 source, but there is no real leaving the app, suspension or closing by the system. Those are checked on your declared target."

  - id: task-lifecycle
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: task-lifecycle
    entry: main.jsx
    editable: [lifecycle.js]
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      dueToday: { uk: "Справ на сьогодні:", en: "Tasks due today:" }
      titleLabel: { uk: "Назва справи", en: "Task title" }
      midnight: { uk: "Імітований годинник: настала північ", en: "Simulated clock: midnight passes" }
      draftsLabel: { uk: "Збережено чернеток:", en: "Drafts saved:" }
      simAppState: { uk: "Стан застосунку (імітація)", en: "App state (simulated)" }
      simLeaveIos: { uk: "iOS: піти з застосунку", en: "iOS: leave the app" }
      simLeaveAndroid: { uk: "Android: піти з застосунку", en: "Android: leave the app" }
      simReturn: { uk: "Повернутися", en: "Come back" }
    title:
      uk: "Чернетка й «сьогодні» в планувальнику"
      en: "The draft and “today” in the planner"
    instructions:
      uk: |
        Екран редагування справи викликає `watchLifecycle(AppState, { saveDraft, refreshToday })` з `lifecycle.js`. Допиши цю функцію:

        - підпишись на зміни стану через `appState.addEventListener('change', …)`;
        - коли застосунок переходить у `background`, виклич `saveDraft()` — **один раз** за вихід, на обох платформах;
        - коли застосунок знову `active`, виклич `refreshToday()`; при виході його не викликай;
        - поверни функцію, яка відписується, — після неї жодних викликів.

        Спробуй у перегляді: зміни назву, «Android: піти з застосунку», «Імітований годинник: настала північ», «Повернутися».
      en: |
        The task edit screen calls `watchLifecycle(AppState, { saveDraft, refreshToday })` from `lifecycle.js`. Finish that function:

        - subscribe to state changes with `appState.addEventListener('change', …)`;
        - when the app goes to `background`, call `saveDraft()` — **once** per leaving, on both platforms;
        - when the app is `active` again, call `refreshToday()`; do not call it while leaving;
        - return a function that unsubscribes — no calls after it.

        Try it in the preview: change the title, “Android: leave the app”, “Simulated clock: midnight passes”, “Come back”.
    limits:
      uk: "`AppState` тут імітований (`appStateSim.jsx`) з послідовностями станів з коду React Native 0.86. Перевірки викликають ці послідовності для iOS і Android напряму. Справжні вихід, призупинення й закриття застосунку перевіряють на заявленій цілі."
      en: "`AppState` is simulated here (`appStateSim.jsx`) with the state sequences from the React Native 0.86 code. The checks trigger those sequences for iOS and Android directly. Real leaving, suspension and closing of the app are checked on your declared target."
    testTitles:
      "Android: leaving the app saves the draft":
        uk: "Android: вихід з застосунку зберігає чернетку"
        en: "Android: leaving the app saves the draft"
      "iOS: leaving the app saves the draft once":
        uk: "iOS: вихід зберігає чернетку один раз"
        en: "iOS: leaving saves the draft once"
      "coming back refreshes today, leaving does not":
        uk: "Повернення оновлює «сьогодні», вихід — ні"
        en: "Coming back refreshes “today”, leaving does not"
      "the returned function stops listening":
        uk: "Повернена функція відписується"
        en: "The returned function stops listening"
    hints:
      nudge:
        uk: "Який стан приходить при виході на **обох** платформах? Що повертає `addEventListener` і чим його вимикають?"
        en: "Which state arrives on leaving on **both** platforms? What does `addEventListener` return, and how is it switched off?"
      explanation:
        uk: "Функція-слухач отримує новий стан рядком. Порівнюй його з конкретними значеннями й роби дію лише на потрібному: `inactive` на Android не приходить, а реагувати на кожну зміну — означає оновлювати «сьогодні» і при виході. `addEventListener` повертає підписку — обʼєкт з методом `remove()`; так само, як `setInterval` повертає id для `clearInterval`, тут збережи підписку й виклич `remove()` у функції, яку повертаєш."
        en: "The listener function receives the new state as a string. Compare it with specific values and act only on the right one: `inactive` never arrives on Android, and reacting to every change means refreshing “today” while leaving as well. `addEventListener` returns a subscription — an object with a `remove()` method; just as `setInterval` returns an id for `clearInterval`, keep the subscription here and call `remove()` in the function you return."
    solutionNote:
      uk: "Слухач робить дію лише на двох станах: `background` (є на обох платформах) зберігає чернетку, `active` оновлює «сьогодні». `inactive` з iOS просто пропускається, тож на iOS чернетка зберігається один раз. Функція, яку повертає `watchLifecycle`, викликає `subscription.remove()` — це cleanup для ефекту, з якого її викликають."
      en: "The listener acts on only two states: `background` (present on both platforms) saves the draft, `active` refreshes “today”. iOS's `inactive` is simply skipped, so on iOS the draft is saved once. The function `watchLifecycle` returns calls `subscription.remove()` — the cleanup for the effect it is called from."
    feedback:
      - when: { test: "Android: leaving the app saves the draft" }
        message:
          uk: "Ця перевірка імітує вихід на Android (лише `background`) і чекає один виклик `saveDraft`. Стан `inactive` на Android не приходить."
          en: "This check simulates leaving on Android (only `background`) and expects one `saveDraft` call. The `inactive` state never arrives on Android."
      - when: { test: "iOS: leaving the app saves the draft once" }
        message:
          uk: "Ця перевірка імітує вихід на iOS (`inactive`, потім `background`) і чекає рівно один виклик `saveDraft`."
          en: "This check simulates leaving on iOS (`inactive`, then `background`) and expects exactly one `saveDraft` call."
      - when: { test: "coming back refreshes today, leaving does not" }
        message:
          uk: "Ця перевірка чекає 0 викликів `refreshToday` під час виходу й 1 після повернення (`active`)."
          en: "This check expects 0 `refreshToday` calls while leaving and 1 after coming back (`active`)."
      - when: { test: "the returned function stops listening" }
        message:
          uk: "Ця перевірка викликає функцію, яку повернула `watchLifecycle`, і чекає, що після неї слухач не реагує, а кількість підписок повернулась до попередньої. Порожня функція нічого не відписує."
          en: "This check calls the function `watchLifecycle` returned and expects the listener not to react after it, and the number of subscriptions to be back where it was. An empty function unsubscribes nothing."

  - id: recall-today-param
    kind: review
    title:
      uk: "Пригадай: «сьогодні» як параметр"
      en: "Recall: “today” as a parameter"
    items:
      - id: today-param
        from: js-09-04-deterministic-fixtures
        prompt:
          uk: "Чому доменна функція на кшталт `countDueTasks(tasks, today)` отримує сьогоднішню дату параметром, а не викликає `new Date()` усередині?"
          en: "Why does a domain function like `countDueTasks(tasks, today)` receive today's date as a parameter instead of calling `new Date()` inside?"
        answer:
          type: choice
          options:
            - id: deterministic
              text:
                uk: "Щоб результат залежав лише від аргументів: тести дають фіксовану дату, а застосунок — справжню"
                en: "So that the result depends only on the arguments: tests pass a fixed date, the app passes the real one"
            - id: faster
              text:
                uk: "Бо `new Date()` повільний і його не можна викликати часто"
                en: "Because `new Date()` is slow and must not be called often"
              why:
                uk: "Швидкість тут ні до чого. Річ у тому, що функція з годинником усередині щодня повертає інше — її неможливо надійно перевірити."
                en: "Speed has nothing to do with it. The point is that a function with a clock inside returns something different every day — it cannot be checked reliably."
            - id: timezone
              text:
                uk: "Бо `new Date()` не працює на телефоні"
                en: "Because `new Date()` does not work on a phone"
              why:
                uk: "`new Date()` працює й на телефоні. Але функція, що сама читає годинник, не дає підставити потрібний день — ні в тесті, ні після повернення з фону."
                en: "`new Date()` works on a phone too. But a function that reads the clock itself does not let you supply the day you need — neither in a test nor after returning from the background."
          correct: [deterministic]
        explanation:
          uk: "Саме тому оновити «сьогодні» після повернення так просто: слухач бере нову дату з адаптера годинника й передає її в ту саму функцію."
          en: "That is exactly why refreshing “today” after returning is so simple: the listener takes the new date from the clock adapter and passes it to the same function."

  - id: to-project
    kind: transfer
    capstoneStep: RN-04
    body:
      uk: "У кроці проєкту екран редагування в `native/` зберігатиме чернетку при переході в `background`, а при поверненні (`active`) застосунок перераховуватиме «сьогоднішнє»: кількість справ на сьогодні через `countDueTasks` чи сьогоднішнє виконання звички через `summarizeHabit`, з датою з адаптера годинника."
      en: "In the project step the edit screen in `native/` will save the draft on the change to `background`, and on return (`active`) the app will recompute “today”: the count of tasks due today with `countDueTasks` or today's habit completion with `summarizeHabit`, with the date from the clock adapter."
