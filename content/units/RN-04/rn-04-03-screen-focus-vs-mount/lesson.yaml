id: rn-04-03-screen-focus-vs-mount
unit: RN-04
title:
  uk: "Фокус екрана проти монтування"
  en: "Screen focus vs mount"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачити, що екран, який лишився в стеку, лишається змонтованим і не перезапускає свій ефект монтування, коли людина до нього повертається."
    en: "Predict that a screen kept on the stack stays mounted and does not re-run its mount effect when the user comes back to it."
  - uk: "Перечитувати дані через адаптер сховища в ефекті фокуса при поверненні й прибирати його при втраті фокуса."
    en: "Use a focus effect to refresh data through the storage adapter on return and clean it up on blur."
prerequisites: [rn-04-02-back-unsaved-edits, re-03-02-effects-synchronize-external]
subskills:
  - { family: N-03, skill: "screen focus vs mount", depth: intro }
glossary: [screen-focus, screen-blur]
selfCheck: [predict-effect-counts, wish-refresh]

blocks:
  - id: mounted-but-hidden
    kind: explanation
    title:
      uk: "Змонтований — ще не означає видимий"
      en: "Mounted does not mean visible"
    body:
      uk: |
        Ти вже знаєш: екран під верхнім лишається змонтованим. Звідси два наслідки, на яких спотикаються майже всі.

        **Ефект з `[]` не запускається знову при поверненні.** `useEffect(…, [])` виконується після першого рендеру й більше ніколи — поки компонент змонтований. Повернення «Назад» не монтує список заново, тож ефект, що читав дані «при відкритті екрана», вдруге нічого не прочитає. Якщо на іншому екрані дані змінились, список покаже старі.

        **Прихований екран не спить.** Його таймери, підписки й незавершені запити працюють далі, хоч людина його й не бачить.

        Тому в нативному стеку є ще одна пара подій: екран отримує [[screen-focus|фокус]], коли стає видимим угорі стеку, і [[screen-blur|втрачає фокус (blur)]], коли його накриває інший екран. У вебі ти теж ставив фокус на заголовок після переходу — тут ідеться про інше: не фокус клавіатури на елементі, а стан цілого екрана.
      en: |
        You already know: the screen under the top one stays mounted. That has two consequences almost everyone trips over.

        **An effect with `[]` does not run again on return.** `useEffect(…, [])` runs after the first render and never again — as long as the component is mounted. Going Back does not mount the list again, so an effect that read the data “when the screen opened” reads nothing the second time. If the data changed on another screen, the list shows the old one.

        **A hidden screen is not asleep.** Its timers, subscriptions and unfinished requests keep running, even though the person does not see it.

        That is why a native stack has one more pair of events: a screen gains [[screen-focus|focus]] when it becomes visible on top of the stack, and [[screen-blur|loses focus (blur)]] when another screen covers it. On the web you also moved focus to a heading after a transition — this is something else: not keyboard focus on an element, but the state of a whole screen.

  - id: predict-effect-counts
    kind: prediction
    prompt:
      uk: "Екран списку має два ефекти: ефект монтування (`useEffect` з `[]`) і ефект фокуса (`useFocusEffect`). Кожен пише рядок у консоль. Людина відкриває список, переходить на деталі, повертається, знову переходить на деталі й знову повертається. Скільки разів спрацює кожен?"
      en: "A list screen has two effects: a mount effect (`useEffect` with `[]`) and a focus effect (`useFocusEffect`). Each writes a line to the console. The person opens the list, goes to the details, comes back, goes to the details again and comes back again. How many times does each one run?"
    code: |
      useEffect(() => {
        console.log('mount effect');
      }, []);

      useFocusEffect(
        useCallback(() => {
          console.log('focus effect');
        }, []),
      );
    runnable: false
    answer:
      type: choice
      options:
        - id: one-three
          text:
            uk: "ефект монтування — 1 раз, ефект фокуса — 3 рази"
            en: "the mount effect 1 time, the focus effect 3 times"
        - id: three-three
          text:
            uk: "обидва — по 3 рази"
            en: "both 3 times"
          why:
            uk: "Так було б, якби повернення монтувало список заново, як вебмаршрут. У стеку список весь час змонтований, тож ефект з `[]` спрацьовує лише після першого рендеру."
            en: "That would be so if returning mounted the list again, like a web route. On the stack the list is mounted the whole time, so the effect with `[]` runs only after the first render."
        - id: one-two
          text:
            uk: "ефект монтування — 1 раз, ефект фокуса — 2 рази"
            en: "the mount effect 1 time, the focus effect 2 times"
          why:
            uk: "Перший показ списку — теж фокус: екран став видимим угорі стеку. Тож ефект фокуса спрацьовує при відкритті й після кожного з двох повернень."
            en: "The list's first display is a focus too: the screen became visible on top of the stack. So the focus effect runs on opening and after each of the two returns."
        - id: one-five
          text:
            uk: "ефект монтування — 1 раз, ефект фокуса — 5 разів"
            en: "the mount effect 1 time, the focus effect 5 times"
          why:
            uk: "Коли екран деталей накриває список, список втрачає фокус: тоді запускається не ефект, а його cleanup. Сам ефект — лише коли екран отримує фокус."
            en: "When the detail screen covers the list, the list loses focus: then not the effect but its cleanup runs. The effect itself runs only when the screen gains focus."
      correct: [one-three]
    explanation:
      uk: "Ефект монтування спрацював один раз — список жодного разу не демонтувався. Ефект фокуса спрацював при першому показі й після кожного повернення, а між ними, коли деталі накривали список, двічі спрацював його cleanup. Саме тому дані, які мають бути свіжими при поверненні, читають в ефекті фокуса."
      en: "The mount effect ran once — the list never unmounted. The focus effect ran on the first display and after each return, and in between, when the details covered the list, its cleanup ran twice. That is exactly why data that must be fresh on return is read in a focus effect."

  - id: focus-effect
    kind: explanation
    title:
      uk: "useFocusEffect: ефект, привʼязаний до фокуса"
      en: "useFocusEffect: an effect tied to focus"
    body:
      uk: |
        `useFocusEffect` з React Navigation працює як ефект, але привʼязаний не до монтування, а до фокуса:

        - функція-ефект виконується, коли екран отримує фокус (зокрема при першому показі);
        - її cleanup виконується, коли екран втрачає фокус або демонтується.

        Функцію загортають у `useCallback` — інакше кожен рендер дає нову функцію, і ефект перезапускається після кожного рендеру, а не лише при фокусі. Залежності `useCallback` працюють, як у `useEffect`.

        ```jsx
        useFocusEffect(
          useCallback(() => {
            const timer = setInterval(() => tickClock(), 1000); // only while visible
            return () => clearInterval(timer);
          }, []),
        );
        ```

        Як і у звичайного ефекту із запитом, cleanup ще й захищає від запізнілої відповіді: якщо читання почалось, а екран тим часом втратив фокус, відповідь варто ігнорувати — інакше вона може перезаписати свіжіші дані.
      en: |
        React Navigation's `useFocusEffect` works like an effect, but it is tied not to mounting but to focus:

        - the effect function runs when the screen gains focus (including the first display);
        - its cleanup runs when the screen loses focus or unmounts.

        You wrap the function in `useCallback` — otherwise every render gives a new function, and the effect re-runs after every render rather than only on focus. `useCallback`'s dependencies work as in `useEffect`.

        ```jsx
        useFocusEffect(
          useCallback(() => {
            const timer = setInterval(() => tickClock(), 1000); // only while visible
            return () => clearInterval(timer);
          }, []),
        );
        ```

        As with an ordinary effect that makes a request, the cleanup also protects against a late answer: if a read started and the screen lost focus in the meantime, the answer should be ignored — otherwise it may overwrite fresher data.

  - id: focus-timeline
    kind: visual
    visual: render-timeline
    title:
      uk: "Список → деталі → назад: монтування один раз, фокус двічі"
      en: "List → details → back: one mount, two focuses"
    textEquivalent:
      uk: "Рендер 1 списку бачить порожній масив tasks. Після commit виконуються обидва ефекти: ефект монтування й ефект фокуса, який починає читання зі сховища. Відповідь викликає setTasks — рендер 2 показує дві справи. Потім push відкриває деталі: список втрачає фокус, і виконується лише cleanup ефекту фокуса; список лишається змонтованим зі своїм станом. Після goBack список знову отримує фокус: ефект фокуса виконується вдруге й читає сховище знову, а ефект монтування — ні. Відповідь дає рендер 3 зі свіжими даними."
      en: "The list's render 1 sees an empty tasks array. After the commit both effects run: the mount effect and the focus effect, which starts a read from storage. The answer calls setTasks — render 2 shows two tasks. Then push opens the details: the list loses focus, and only the focus effect's cleanup runs; the list stays mounted with its state. After goBack the list gains focus again: the focus effect runs a second time and reads storage again, while the mount effect does not. The answer gives render 3 with fresh data."
    spec:
      component: ListScreen
      code: |
        function ListScreen() {
          const [tasks, setTasks] = useState([]);
          useEffect(() => console.log('mount'), []);
          useFocusEffect(useCallback(() => {
            let active = true;
            storage.readAll().then((next) => active && setTasks(next));
            return () => { active = false; };
          }, []));
          return <TaskRows tasks={tasks} />;
        }
      steps:
        - phase: render
          render: 1
          line: 2
          reason: { uk: "перший показ", en: "first display" }
          snapshot: { state: { tasks: [] } }
          caption:
            uk: "Рендер 1: справ ще немає."
            en: "Render 1: no tasks yet."
        - phase: commit
          render: 1
          line: 9
          dom: "List: (empty)"
          caption:
            uk: "Commit: список порожній."
            en: "Commit: the list is empty."
        - phase: effect
          render: 1
          line: 3
          run: ["console.log('mount')", "storage.readAll() // focus"]
          caption:
            uk: "Екран змонтувався **і** отримав фокус: виконуються обидва ефекти. Ефект фокуса починає читання."
            en: "The screen mounted **and** gained focus: both effects run. The focus effect starts a read."
        - phase: render
          render: 2
          line: 6
          reason: { uk: "відповідь сховища: setTasks", en: "storage answered: setTasks" }
          snapshot: { state: { tasks: ["t-01", "t-02"] } }
          caption:
            uk: "Відповідь прийшла — рендер 2 має дві справи."
            en: "The answer arrived — render 2 has two tasks."
        - phase: commit
          render: 2
          line: 9
          dom: "List: t-01, t-02"
          caption:
            uk: "Commit 2: список показує дві справи."
            en: "Commit 2: the list shows two tasks."
        - phase: event
          name: "push('Detail')"
          sees: { tasks: ["t-01", "t-02"] }
          actions: ["push('Detail', { id: 't-02' })"]
          caption:
            uk: "Людина відкриває деталі. Список лишається змонтованим під ними."
            en: "The person opens the details. The list stays mounted underneath."
        - phase: effect
          render: 2
          line: 7
          cleanup: ["active = false // blur"]
          caption:
            uk: "Список втратив фокус: виконується лише cleanup ефекту фокуса. Ефект монтування не чіпається, стан `tasks` зберігся."
            en: "The list lost focus: only the focus effect's cleanup runs. The mount effect is untouched, the `tasks` state is kept."
        - phase: event
          name: "goBack()"
          sees: { tasks: ["t-01", "t-02"] }
          actions: ["goBack()"]
          caption:
            uk: "Людина повертається. Список не монтується заново — він просто знову вгорі."
            en: "The person goes back. The list does not mount again — it is simply on top again."
        - phase: effect
          render: 2
          line: 6
          run: ["storage.readAll() // focus again"]
          caption:
            uk: "Фокус повернувся: ефект фокуса читає сховище знову. `console.log('mount')` не виконується."
            en: "Focus is back: the focus effect reads storage again. `console.log('mount')` does not run."
        - phase: render
          render: 3
          line: 6
          reason: { uk: "свіжа відповідь: setTasks", en: "a fresh answer: setTasks" }
          snapshot: { state: { tasks: ["t-01", "t-02 ✓"] } }
          caption:
            uk: "Рендер 3 показує дані, змінені на екрані деталей."
            en: "Render 3 shows the data changed on the detail screen."

  - id: planner-reload
    kind: example
    runtime: concept-preview
    dir: planner-reload
    entry: main.jsx
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      logEffect: { uk: "Список: ефект виконано", en: "List: effect ran" }
      markDone: { uk: "Позначити виконаною", en: "Mark as done" }
      savedDone: { uk: "Збережено: виконано", en: "Saved: done" }
      simHeaderBack: { uk: "Назад", en: "Back" }
      simStack: { uk: "Стек (імітація)", en: "Stack (simulated)" }
      simHardwareBack: { uk: "Android: «Назад»", en: "Android: Back" }
      simSwipeBack: { uk: "iOS: свайп назад", en: "iOS: swipe back" }
    title:
      uk: "Список, що читає дані лише при монтуванні"
      en: "A list that reads its data only on mount"
    body:
      uk: |
        Список справ читає їх через маленьке сховище записів у памʼяті (`memoryStorage.js`: `readAll()` читає всі записи, `writeAll()` записує всі). У справжньому застосунку цю роль грає репозиторій поверх адаптера сховища з RN-03 (`getItem`/`setItem`), а екрани від цього не змінюються. Екран деталей позначає справу виконаною й записує зміну в сховище.

        Натисни **Запустити**, відкрий «Здати книжки в бібліотеку», натисни «Позначити виконаною» й повернись «‹ Назад». Стеж за консоллю.
      en: |
        The task list reads tasks through a small in-memory record store (`memoryStorage.js`: `readAll()` reads every record, `writeAll()` writes them all). In a real app this role is played by a repository on top of the RN-03 storage adapter (`getItem`/`setItem`), and the screens do not change because of that. The detail screen marks a task done and writes the change to storage.

        Press **Run**, open “Return library books”, press “Mark as done” and go “‹ Back”. Watch the console.
    tryIt:
      uk: |
        1. Після повернення ✓ немає, а рядок «Список: ефект виконано» в консолі один: ефект з `[]` не перезапустився.
        2. Перетвори цей ефект на ефект фокуса: передай ту саму функцію в `useFocusEffect`, загорнувши її в `useCallback` з тими самими залежностями `[]`.
        3. Запусти знову й повтори: після повернення ✓ зʼявляється, а рядок у консолі додається при кожному поверненні до списку.
      en: |
        1. After returning there is no ✓, and the console has one “List: effect ran” line: the effect with `[]` did not run again.
        2. Turn this effect into a focus effect: pass the same function to `useFocusEffect`, wrapped in `useCallback` with the same `[]` dependencies.
        3. Run again and repeat: after returning the ✓ appears, and a console line is added every time you return to the list.
    limits:
      uk: "Перегляд react-native-web з імітованим стеком (`navSim.jsx`): події фокуса й blur він подає так, як описує React Navigation 7, але без нативних екранів. Сховище тут у памʼяті; справжнє нативне сховище — у наступному розділі, а поведінку на телефоні перевіряють на заявленій цілі."
      en: "A react-native-web preview with a simulated stack (`navSim.jsx`): it delivers focus and blur events as React Navigation 7 describes them, but without native screens. Storage here is in memory; real native storage comes in the next unit, and the behavior on a phone is checked on your declared target."

  - id: wish-refresh
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: wish-refresh
    entry: main.jsx
    editable: [WishList.jsx]
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      markAcquired: { uk: "Позначити отриманим", en: "Mark as acquired" }
      savedAcquired: { uk: "Збережено: отримано", en: "Saved: acquired" }
      simHeaderBack: { uk: "Назад", en: "Back" }
      simStack: { uk: "Стек (імітація)", en: "Stack (simulated)" }
      simHardwareBack: { uk: "Android: «Назад»", en: "Android: Back" }
      simSwipeBack: { uk: "iOS: свайп назад", en: "iOS: swipe back" }
    title:
      uk: "Свіжий список бажань після повернення"
      en: "A fresh wishlist after returning"
    instructions:
      uk: |
        Список бажань у `WishList.jsx` читає бажання через `storage.readAll()` лише при монтуванні, тож після «Позначити отриманим» на екрані деталей і повернення ✓ не видно. Перероби читання:

        - список читає бажання через `storage.readAll()` щоразу, коли отримує фокус (і при першому показі);
        - він **не** читає їх ні при кожному рендері, ні при втраті фокуса: перевірка рахує, скільки читань почалося за два відвідування деталей;
        - відповідь читання, що завершилось уже після втрати фокуса, ігнорується — вона не має перезаписати свіжіші дані.

        Читання займає час: одне з них у перевірці навмисно повільне.
      en: |
        The wishlist in `WishList.jsx` reads wishes through `storage.readAll()` only on mount, so after “Mark as acquired” on the detail screen and returning, no ✓ shows. Rework the reading:

        - the list reads the wishes through `storage.readAll()` every time it gains focus (including the first display);
        - it does **not** read them on every render or on losing focus: a check counts how many reads started during two visits to the details;
        - the answer of a read that finished after the list lost focus is ignored — it must not overwrite fresher data.

        Reads take time: one of them is deliberately slow in a check.
    limits:
      uk: "Стек і його події фокуса імітує `navSim.jsx` у перегляді react-native-web, а сховище — сховище записів у памʼяті із затримкою. На телефоні ті самі події подає React Navigation, а читання йде через нативне сховище; це перевіряють на заявленій цілі."
      en: "The stack and its focus events are simulated by `navSim.jsx` in the react-native-web preview, and storage is an in-memory record store with a delay. On a phone React Navigation delivers the same events and reads go through native storage; that is checked on your declared target."
    testTitles:
      "returning to the list shows a change made on the detail screen":
        uk: "Після повернення список показує зміну з екрана деталей"
        en: "Returning to the list shows a change made on the detail screen"
      "storage is read once per focus, not on every render or blur":
        uk: "Одне читання на кожен фокус — не на рендер і не на blur"
        en: "One read per focus — not per render or blur"
      "a slow read that finishes after leaving does not overwrite newer data":
        uk: "Повільне читання, що завершилось після виходу, не перезаписує свіжіші дані"
        en: "A slow read that finishes after leaving does not overwrite newer data"
    hints:
      nudge:
        uk: "Читати треба не тоді, коли екран зʼявляється вперше, а щоразу, коли він стає видимим. Яка подія стеку саме про це? І що має статися із читанням, коли екран перестає бути видимим?"
        en: "Read not when the screen first appears but every time it becomes visible. Which stack event is about exactly that? And what should happen to a read when the screen stops being visible?"
      explanation:
        uk: "`useFocusEffect` виконує функцію при кожному фокусі й її cleanup при кожному blur. Функцію загорни в `useCallback`, інакше вона нова в кожному рендері й ефект перезапускається після кожного рендеру. Щоб ігнорувати запізнілу відповідь, заведи всередині ефекту локальний прапорець, який cleanup перемикає, — так само, як ти робив з `fetch` в ефекті: `let ignore = false; load().then((data) => { if (!ignore) show(data); }); return () => { ignore = true; };`."
        en: "`useFocusEffect` runs the function on every focus and its cleanup on every blur. Wrap the function in `useCallback`, otherwise it is new on every render and the effect re-runs after every render. To ignore a late answer, keep a local flag inside the effect that the cleanup flips — just as you did with `fetch` in an effect: `let ignore = false; load().then((data) => { if (!ignore) show(data); }); return () => { ignore = true; };`."
    solutionNote:
      uk: "`useFocusEffect(useCallback(…, []))` починає читання при кожному фокусі, а cleanup при blur ставить `active = false`, тож відповідь повільного читання, що прийшла вже після виходу, ігнорується, і її не перезаписують свіжі дані з наступного фокуса. Те саме можна зібрати з подій `'focus'` і `'blur'` через `navigation.addListener` — саме на них `useFocusEffect` і побудований."
      en: "`useFocusEffect(useCallback(…, []))` starts a read on every focus, and the cleanup on blur sets `active = false`, so the answer of a slow read that arrives after leaving is ignored and does not overwrite the fresh data from the next focus. The same can be built from the `'focus'` and `'blur'` events with `navigation.addListener` — `useFocusEffect` is built on exactly those."
    feedback:
      - when: { test: "returning to the list shows a change made on the detail screen" }
        message:
          uk: "Ця перевірка позначає «Настільну лампу» отриманою на екрані деталей, повертається й чекає ✓ у списку. Ефект з `[]` при поверненні не перезапускається: список змонтований увесь час."
          en: "This check marks the “Desk lamp” as acquired on the detail screen, goes back and expects a ✓ in the list. An effect with `[]` does not re-run on return: the list is mounted the whole time."
      - when: { test: "storage is read once per focus, not on every render or blur" }
        message:
          uk: "Ця перевірка двічі відкриває деталі й повертається, і чекає рівно 2 нові читання. Менше — читання не привʼязане до фокуса; більше — воно спрацьовує ще й при рендері чи blur (функція без `useCallback`, залежність від `isFocused`)."
          en: "This check opens the details and goes back twice, and expects exactly 2 new reads. Fewer — the read is not tied to focus; more — it also fires on render or on blur (a function without `useCallback`, a dependency on `isFocused`)."
      - when: { test: "a slow read that finishes after leaving does not overwrite newer data" }
        message:
          uk: "Ця перевірка робить читання при поверненні повільним (600 мс), одразу йде на деталі, позначає «Велосипед» отриманим і повертається. Свіже читання показує ✓, а потім приходить повільне зі старими даними — його треба ігнорувати після blur."
          en: "This check makes the read on return slow (600 ms), goes to the details at once, marks the “Bicycle” as acquired and returns. The fresh read shows ✓, and then the slow one arrives with old data — it must be ignored after blur."

  - id: recall-effects
    kind: review
    title:
      uk: "Пригадай: ефекти й зовнішній світ"
      en: "Recall: effects and the outside world"
    items:
      - id: effect-sync
        from: re-03-02-effects-synchronize-external
        prompt:
          uk: "Для чого в React потрібен ефект?"
          en: "What is an effect for in React?"
        answer:
          type: choice
          options:
            - id: sync
              text:
                uk: "Щоб синхронізувати компонент із чимось поза React — таймером, підпискою, сховищем, мережею — після того, як екран оновлено"
                en: "To synchronize a component with something outside React — a timer, a subscription, storage, the network — after the screen is updated"
            - id: derive
              text:
                uk: "Щоб обчислювати значення з пропсів і стану перед рендером"
                en: "To compute values from props and state before rendering"
              why:
                uk: "Те, що обчислюється з пропсів і стану, рахують просто під час рендеру. Ефект — для того, що живе поза React."
                en: "What can be computed from props and state is computed during render. An effect is for what lives outside React."
            - id: events
              text:
                uk: "Щоб реагувати на натискання кнопок"
                en: "To react to button presses"
              why:
                uk: "Реакція на натискання — справа обробника події. Ефект запускається не через дію людини, а через те, що компонент показано."
                en: "Reacting to a press is the job of an event handler. An effect runs not because of a person's action but because the component is shown."
          correct: [sync]
        explanation:
          uk: "Ефект синхронізує компонент із зовнішнім світом. `useFocusEffect` робить те саме, але межі синхронізації — фокус і blur екрана, а не монтування й демонтування."
          en: "An effect synchronizes a component with the outside world. `useFocusEffect` does the same, but the boundaries of the synchronization are the screen's focus and blur, not mount and unmount."
      - id: adapter-seam
        from: rn-03-02-platform-adapters
        prompt:
          uk: "Екран списку читає записи через адаптер сховища, який йому передали, а не напряму з нативного модуля сховища. Що це дає, коли адаптер у перевірках замінюють на адаптер у памʼяті?"
          en: "A list screen reads records through a storage adapter it was given, not directly from the native storage module. What does that give you when the adapter is replaced with an in-memory one in the checks?"
        answer:
          type: choice
          options:
            - id: same-screen
              text:
                uk: "Екран і доменний код не змінюються: змінюється лише реалізація за тим самим контрактом"
                en: "The screen and the domain code do not change: only the implementation behind the same contract does"
            - id: rewrite
              text:
                uk: "Екран доведеться переписати під новий адаптер"
                en: "The screen has to be rewritten for the new adapter"
              why:
                uk: "Саме цього адаптер і уникає: код залежить від контракту (`getItem`, `setItem`), а не від конкретного сховища."
                en: "That is exactly what the adapter avoids: the code depends on the contract (`getItem`, `setItem`), not on a specific store."
            - id: platform-checks
              text:
                uk: "Нічого: перевірки `Platform.OS` в екрані однаково потрібні"
                en: "Nothing: `Platform.OS` checks in the screen are needed anyway"
              why:
                uk: "Відмінності сховищ живуть у реалізаціях адаптера, а не в перевірках платформи всередині екрана чи домену."
                en: "Differences between stores live in the adapter's implementations, not in platform checks inside the screen or the domain."
          correct: [same-screen]
        explanation:
          uk: "Тому в цьому уроці екрани працюють зі сховищем у памʼяті, а на телефоні той самий код отримає нативне — без змін в екранах."
          en: "That is why the screens in this lesson work with in-memory storage, and on a phone the same code gets native storage — with no change to the screens."

  - id: to-project
    kind: transfer
    capstoneStep: RN-04
    body:
      uk: "У кроці проєкту список у `native/` перечитуватиме записи через твій адаптер сховища при фокусі екрана — наприклад, бажання чи підсумки витрат за категоріями — з cleanup, що ігнорує запізнілу відповідь."
      en: "In the project step the list in `native/` re-reads records through your storage adapter on screen focus — for example the wishes or the expense category totals — with a cleanup that ignores a late answer."
