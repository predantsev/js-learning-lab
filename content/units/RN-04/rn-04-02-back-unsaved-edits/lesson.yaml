id: rn-04-02-back-unsaved-edits
unit: RN-04
title:
  uk: "«Назад» і незбережені зміни"
  en: "Back behavior and unsaved edits"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Назвати кожен спосіб, яким людина покидає екран редагування на кожній платформі — кнопка «Назад» у заголовку, апаратна кнопка «Назад» на Android, свайп назад на iOS, перемикання вкладки, — і перехопити кожен, що знімає екран зі стеку (перемикання вкладки лишає екран змонтованим, тож його чернетка живе в памʼяті)."
    en: "List every way a person can leave an edit screen on each platform — header back, the Android hardware back button, the iOS swipe-back gesture, a tab switch — and intercept each one that takes the screen off the stack (a tab switch keeps the screen mounted, so its draft survives in memory)."
  - uk: "Просити підтвердження лише тоді, коли форму змінено, і зберігати чернетку, коли людина вирішує лишитися."
    en: "Ask for confirmation only when the form is dirty, and keep the draft when the user chooses to stay."
prerequisites: [rn-04-01-navigation-stacks-params, re-05-05-focus-navigation-unsaved]
subskills:
  - { family: N-03, skill: "back/unsaved edits", depth: intro }
glossary: [hardware-back-button, swipe-back-gesture]
selfCheck: [predict-header-guard, expense-guard]

blocks:
  - id: four-exits
    kind: explanation
    title:
      uk: "Чотири виходи з екрана редагування"
      en: "Four exits from an edit screen"
    body:
      uk: |
        У вебі ти ловив «Назад» застосунку й закриття вкладки. На телефоні виходів більше, і частина з них узагалі не проходить через твої кнопки:

        | Вихід | Де | Що стається з екраном |
        |---|---|---|
        | кнопка «‹» у заголовку | обидві платформи | знімається зі стеку |
        | [[hardware-back-button\|кнопка «Назад» Android]] (чи жест «Назад») | Android | знімається зі стеку |
        | [[swipe-back-gesture\|свайп назад від лівого краю]] | iOS | знімається зі стеку |
        | перемикання вкладки внизу | обидві | **лишається** змонтованим — нічого не знімається |

        Перші три — це одна подія для стеку: екран от-от зникне. У React Navigation 7 перед цим екран отримує подію `beforeRemove`, а хук `usePreventRemove(умова, callback)` зупиняє вихід, поки умова `true`, і викликає `callback({ data })`. У ньому ти питаєш людину, а якщо вона погоджується — `navigation.dispatch(data.action)` пускає **той самий** вихід далі, уже без повторного питання.

        Перемикання вкладки екран не знімає, тож і чернетка не губиться — вона лежить у стані змонтованого екрана. Її загрожує втратити інше: система може закрити застосунок у фоні. Про це — за два уроки.
      en: |
        On the web you caught the app's Back and closing the tab. On a phone there are more exits, and some of them never go through your buttons at all:

        | Exit | Where | What happens to the screen |
        |---|---|---|
        | the “‹” button in the header | both platforms | taken off the stack |
        | [[hardware-back-button\|Android's Back button]] (or Back gesture) | Android | taken off the stack |
        | [[swipe-back-gesture\|a swipe back from the left edge]] | iOS | taken off the stack |
        | switching a tab at the bottom | both | **stays** mounted — nothing is taken off |

        The first three are one event for the stack: the screen is about to go. In React Navigation 7 the screen first receives a `beforeRemove` event, and the hook `usePreventRemove(condition, callback)` stops the exit while the condition is `true` and calls `callback({ data })` instead. There you ask the person, and if they agree, `navigation.dispatch(data.action)` lets **the same** exit go ahead, without asking again.

        Switching a tab does not take the screen off, so the draft is not lost — it lives in the state of the mounted screen. What threatens it is something else: the system may close the app in the background. That comes two lessons from now.

  - id: predict-header-guard
    kind: prediction
    prompt:
      uk: "Екран редагування сховав кнопку «‹» стеку (`headerBackVisible: false`) і має власну кнопку «Скасувати», яка питає перед виходом, якщо форму змінено. Людина змінила назву. Що станеться, коли вона натисне кнопку «Назад» на Android або зробить свайп назад на iOS?"
      en: "An edit screen hid the stack's “‹” button (`headerBackVisible: false`) and has its own “Cancel” button that asks before leaving if the form changed. The person changed the name. What happens when they press Android's Back button or swipe back on iOS?"
    answer:
      type: choice
      options:
        - id: lost
          text:
            uk: "Екран зникає без питання, і чернетка губиться — на обох платформах"
            en: "The screen goes away without a question, and the draft is lost — on both platforms"
        - id: protected
          text:
            uk: "Нічого не стається: кнопки «Назад» у заголовку немає, тож повертатися нікуди"
            en: "Nothing happens: there is no Back button in the header, so there is nowhere to go back"
          why:
            uk: "Кнопка Android і свайп iOS не залежать від заголовка: вони звертаються до стеку напряму. Сховати кнопку — не те саме, що заборонити вихід."
            en: "Android's button and the iOS swipe do not depend on the header: they go to the stack directly. Hiding a button is not the same as preventing an exit."
        - id: asks
          text:
            uk: "Зʼявляється те саме питання, що й після «Скасувати»"
            en: "The same question appears as after “Cancel”"
          why:
            uk: "Питання живе в обробнику кнопки «Скасувати», а ці два виходи її не натискають. Перехопити їх може лише охорона на рівні стеку — `usePreventRemove`."
            en: "The question lives in the “Cancel” button's handler, and these two exits never press it. Only a guard at the stack level — `usePreventRemove` — can catch them."
        - id: android-only
          text:
            uk: "На Android питання зʼявиться, а на iOS свайп відкине чернетку"
            en: "On Android the question appears, while on iOS the swipe discards the draft"
          why:
            uk: "Кнопка «Назад» Android теж не викликає твою «Скасувати». Обидва виходи обходять охорону, що сидить на одній кнопці."
            en: "Android's Back button does not call your “Cancel” either. Both exits bypass a guard that sits on one button."
      correct: [lost]
    explanation:
      uk: "Охорона на одній кнопці захищає лише від цієї кнопки. Кнопка «Назад» Android і свайп iOS знімають екран через стек, тож ловити вихід треба там, де його бачить стек, — у `beforeRemove`, наприклад через `usePreventRemove`. У `@react-navigation/native-stack` 7 (прочитано у вихідному коді версії 7.20) такий хук на iOS ще й не дає свайпу забрати екран, доки ти не відповіси."
      en: "A guard on one button protects only against that button. Android's Back button and the iOS swipe take the screen off through the stack, so the exit has to be caught where the stack sees it — in `beforeRemove`, for example with `usePreventRemove`. In `@react-navigation/native-stack` 7 (read in the source of version 7.20) that hook also stops the iOS swipe from taking the screen away until you answer."

  - id: back-sequence
    kind: visual
    visual: sequence
    title:
      uk: "Кнопка «Назад» Android на зміненій формі"
      en: "Android's Back button on a changed form"
    textEquivalent:
      uk: "Людина натискає кнопку «Назад» Android. Стек не знімає екран одразу, а надсилає екрану редагування подію beforeRemove з дією GO_BACK. Екран порівнює чернетку зі збереженим записом: вони різні, тож usePreventRemove зупиняє вихід і показує діалог з кнопками «Редагувати далі» і «Відкинути». Якщо людина обирає «Редагувати далі», нічого не відбувається: екран і чернетка лишаються. Якщо «Відкинути» — екран викликає navigation.dispatch з тією самою дією, і стек знімає екран редагування без повторного питання, бо цей екран уже відповів на цю дію. Якби форма не змінювалась, стек зняв би екран одразу, без діалогу."
      en: "The person presses Android's Back button. The stack does not take the screen off at once; it sends the edit screen a beforeRemove event with the action GO_BACK. The screen compares the draft with the saved record: they differ, so usePreventRemove stops the exit and shows a dialog with “Keep editing” and “Discard”. If the person picks “Keep editing”, nothing happens: the screen and the draft stay. If “Discard”, the screen calls navigation.dispatch with the same action, and the stack takes the edit screen off without asking again, because this screen has already answered for this action. Had the form not changed, the stack would have taken the screen off at once, with no dialog."
    spec:
      actors:
        - { id: user, label: { uk: "Людина", en: "Person" } }
        - { id: edit, label: { uk: "Екран Edit", en: "Edit screen" } }
        - { id: stack, label: { uk: "Стек", en: "Stack" } }
      messages:
        - from: user
          to: stack
          label: { uk: "кнопка «Назад» Android", en: "Android Back button" }
          caption:
            uk: "Людина натискає кнопку «Назад» Android — це не кнопка екрана, вона йде одразу до стеку."
            en: "The person presses Android's Back button — not a button of the screen; it goes straight to the stack."
        - from: stack
          to: edit
          label: "beforeRemove { action: GO_BACK }"
          caption:
            uk: "Перш ніж зняти екран, стек надсилає йому `beforeRemove` з дією, яка зараз відбудеться."
            en: "Before taking the screen off, the stack sends it `beforeRemove` with the action about to happen."
        - from: edit
          to: edit
          kind: note
          label: { uk: "чернетка ≠ збережене", en: "draft ≠ saved" }
          caption:
            uk: "Екран порівнює чернетку зі збереженим записом. Вони різні — `usePreventRemove(true, …)` зупиняє вихід."
            en: "The screen compares the draft with the saved record. They differ — `usePreventRemove(true, …)` stops the exit."
        - from: edit
          to: user
          kind: async
          label: { uk: "Alert: Редагувати далі / Відкинути", en: "Alert: Keep editing / Discard" }
          caption:
            uk: "Замість виходу — діалог. «Редагувати далі» нічого не робить: екран і чернетка лишаються."
            en: "Instead of the exit — a dialog. “Keep editing” does nothing: the screen and the draft stay."
        - from: user
          to: edit
          label: { uk: "«Відкинути»", en: "“Discard”" }
          caption:
            uk: "Людина обирає «Відкинути»."
            en: "The person picks “Discard”."
        - from: edit
          to: stack
          label: "navigation.dispatch(data.action)"
          caption:
            uk: "Екран пускає **ту саму** дію далі. Стек знає, що цей екран на неї вже відповів, і не питає вдруге."
            en: "The screen lets **the same** action go ahead. The stack knows this screen has already answered for it and does not ask again."
        - from: stack
          to: user
          kind: return
          label: { uk: "Edit знято, видно список", en: "Edit removed, list shown" }
          caption:
            uk: "Екран редагування знято й демонтовано, а список під ним знову видно."
            en: "The edit screen is taken off and unmounted, and the list underneath is visible again."

  - id: habit-header-guard
    kind: example
    runtime: concept-preview
    dir: habit-header-guard
    entry: main.jsx
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      nameLabel: { uk: "Назва звички", en: "Habit name" }
      cancel: { uk: "Скасувати", en: "Cancel" }
      save: { uk: "Зберегти", en: "Save" }
      leaveTitle: { uk: "Відкинути зміни?", en: "Discard changes?" }
      leaveMessage: { uk: "Зміни звички не збережено.", en: "The changes to the habit are not saved." }
      keepEditing: { uk: "Редагувати далі", en: "Keep editing" }
      discard: { uk: "Відкинути", en: "Discard" }
      simHeaderBack: { uk: "Назад", en: "Back" }
      simStack: { uk: "Стек (імітація)", en: "Stack (simulated)" }
      simHardwareBack: { uk: "Android: «Назад»", en: "Android: Back" }
      simSwipeBack: { uk: "iOS: свайп назад", en: "iOS: swipe back" }
    title:
      uk: "Охорона, що сидить на одній кнопці"
      en: "A guard that sits on one button"
    body:
      uk: |
        Екран редагування звички сховав кнопку «‹» стеку й має власну «‹ Скасувати», що питає, якщо назву змінено. Під імітованим телефоном — дві імітовані кнопки пристрою: «Android: «Назад»» і «iOS: свайп назад». Діалог малює `alertSim.jsx` з тим самим викликом `Alert.alert(заголовок, текст, кнопки)`, що й у React Native.

        Натисни **Запустити**, відкрий «Ранкова зарядка», зміни назву й натисни «‹ Скасувати»: зʼявиться питання. Обери «Редагувати далі».
      en: |
        The habit edit screen hid the stack's “‹” button and has its own “‹ Cancel” that asks if the name changed. Under the simulated phone are two simulated device controls: “Android: Back” and “iOS: swipe back”. The dialog is drawn by `alertSim.jsx` with the same `Alert.alert(title, message, buttons)` call as in React Native.

        Press **Run**, open “Morning exercise”, change the name and press “‹ Cancel”: a question appears. Pick “Keep editing”.
    tryIt:
      uk: |
        1. Тепер натисни «Android: «Назад»». Екран зник без питання. Відкрий звичку знову — назва стара, чернетку втрачено. Те саме зробить «iOS: свайп назад».
        2. У `EditScreen` після рядка коду з `isDirty` виклич `usePreventRemove(true, ({ data }) => { … })`. У фігурні дужки скопіюй виклик `Alert.alert(…)` з функції `cancel`, а в кнопці «Відкинути» заміни `navigation.goBack()` на `navigation.dispatch(data.action)`.
        3. Тіло `cancel` заміни на один рядок коду `navigation.goBack();` — охорона тепер в одному місці.
        4. Запусти й повтори: «Android: «Назад»», свайп і «‹ Скасувати» тепер усі питають. Але відкрий звичку й одразу вийди, нічого не змінивши, — питання теж зʼявиться. Що з цим робити, вирішиш у вправі.
      en: |
        1. Now press “Android: Back”. The screen went away without a question. Open the habit again — the old name; the draft is lost. “iOS: swipe back” does the same.
        2. In `EditScreen`, after the `isDirty` line, call `usePreventRemove(true, ({ data }) => { … })`. Into the braces copy the `Alert.alert(…)` call from the `cancel` function, and in the “Discard” button replace `navigation.goBack()` with `navigation.dispatch(data.action)`.
        3. Replace the body of `cancel` with the single line `navigation.goBack();` — the guard now lives in one place.
        4. Run and repeat: “Android: Back”, the swipe and “‹ Cancel” all ask now. But open the habit and leave at once without changing anything — the question appears as well. What to do about that, you decide in the exercise.
    limits:
      uk: "Це перегляд react-native-web з імітованим стеком (`navSim.jsx`) і імітованим діалогом (`alertSim.jsx`). Кнопки «Android: «Назад»» і «iOS: свайп назад» лише викликають те, що стек отримав би від пристрою; справжніх кнопки Android, жесту iOS і системного діалогу `Alert` тут немає. Їх перевіряють на заявленій цілі."
      en: "This is a react-native-web preview with a simulated stack (`navSim.jsx`) and a simulated dialog (`alertSim.jsx`). The “Android: Back” and “iOS: swipe back” controls only call what the stack would receive from the device; there is no real Android button, iOS gesture or system `Alert` dialog here. They are checked on your declared target."

  - id: expense-guard
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: expense-guard
    entry: main.jsx
    editable: [ExpenseEdit.jsx]
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      food: { uk: "Їжа", en: "Food" }
      transport: { uk: "Транспорт", en: "Transport" }
      fun: { uk: "Розваги", en: "Fun" }
      labelLabel: { uk: "Назва витрати", en: "Expense label" }
      save: { uk: "Зберегти", en: "Save" }
      cancel: { uk: "Скасувати", en: "Cancel" }
      leaveTitle: { uk: "Відкинути зміни?", en: "Discard changes?" }
      leaveMessage: { uk: "Зміни витрати не збережено.", en: "The changes to the expense are not saved." }
      keepEditing: { uk: "Редагувати далі", en: "Keep editing" }
      discard: { uk: "Відкинути", en: "Discard" }
      changedLabel: { uk: "Проїзний на місяць", en: "Monthly transit pass" }
      simHeaderBack: { uk: "Назад", en: "Back" }
      simStack: { uk: "Стек (імітація)", en: "Stack (simulated)" }
      simHardwareBack: { uk: "Android: «Назад»", en: "Android: Back" }
      simSwipeBack: { uk: "iOS: свайп назад", en: "iOS: swipe back" }
    title:
      uk: "Охорона незбережених змін витрати"
      en: "Guarding unsaved expense edits"
    instructions:
      uk: |
        У `ExpenseEdit.jsx` екран редагування витрати має назву й категорію, але не має охорони. Додай її:

        - дані змінено, коли назва (без пробілів по краях) **або** категорія відрізняється від збереженої витрати;
        - поки дані змінено, кожен вихід, що знімає екран зі стеку (кнопка «‹», кнопка «Назад» Android, свайп iOS), зупиняється, і `Alert.alert` питає з кнопками `keepEditing` і `discard` (рядки в `strings`, заголовок і текст — `leaveTitle` і `leaveMessage`);
        - «Редагувати далі» лишає екран і чернетку, «Відкинути» виходить тим самим способом, яким людина намагалася вийти, без повторного питання;
        - незмінена форма (зокрема, коли в назві додано лише пробіл по краю), а також форма одразу після «Зберегти», виходить без жодного питання.

        Перевірки натискають імітовані кнопки пристрою й кнопки діалогу.
      en: |
        In `ExpenseEdit.jsx` the expense edit screen has a label and a category, but no guard. Add one:

        - the data is changed when the label (without spaces at the ends) **or** the category differs from the saved expense;
        - while it is changed, every exit that takes the screen off the stack (the “‹” button, Android's Back button, the iOS swipe) is stopped, and `Alert.alert` asks with the buttons `keepEditing` and `discard` (strings in `strings`; title and message are `leaveTitle` and `leaveMessage`);
        - “Keep editing” keeps the screen and the draft, “Discard” leaves the way the person tried to leave, without asking again;
        - an unchanged form (including one where only a space was added at an end of the label), and a form right after “Save”, leaves without any question.

        The checks press the simulated device controls and the dialog's buttons.
    limits:
      uk: "Стек, кнопки пристрою й діалог тут імітовані (`navSim.jsx`, `alertSim.jsx`) у перегляді react-native-web. Те, що `usePreventRemove` у React Navigation 7 так само ловить справжню кнопку «Назад» Android і свайп iOS, перевіряють на заявленій цілі."
      en: "The stack, the device controls and the dialog are simulated here (`navSim.jsx`, `alertSim.jsx`) in the react-native-web preview. That `usePreventRemove` in React Navigation 7 catches the real Android Back button and iOS swipe the same way is checked on your declared target."
    testTitles:
      "leaving an unchanged form does not ask":
        uk: "Незмінена форма виходить без питання"
        en: "An unchanged form leaves without a question"
      "the Android back button asks when the label changed":
        uk: "Кнопка «Назад» Android питає, коли назву змінено"
        en: "Android's Back button asks when the label changed"
      "the iOS swipe and the header back button ask too":
        uk: "Свайп iOS і кнопка «‹» у заголовку теж питають"
        en: "The iOS swipe and the header “‹” button ask too"
      "spaces at the ends of the label alone are not a change":
        uk: "Лише пробіл по краю назви — це не зміна"
        en: "Only a space at an end of the label is not a change"
      "a changed category alone counts as unsaved":
        uk: "Змінена лише категорія — теж незбережені зміни"
        en: "A changed category alone counts as unsaved"
      "keep editing stays on the screen with the draft":
        uk: "«Редагувати далі» лишає екран і чернетку"
        en: "“Keep editing” keeps the screen and the draft"
      "discard leaves the screen":
        uk: "«Відкинути» виходить з екрана без другого питання"
        en: "“Discard” leaves the screen without a second question"
      "after saving, leaving does not ask":
        uk: "Після «Зберегти» вихід без питання"
        en: "After “Save”, leaving does not ask"
    hints:
      nudge:
        uk: "Дві окремі речі: як дізнатися, що є що втрачати, і де зупиняти вихід, щоб його не обійшла жодна кнопка пристрою."
        en: "Two separate things: how to know there is something to lose, and where to stop the exit so that no device control can bypass it."
      explanation:
        uk: "«Є що втрачати» — це порівняння чернетки з тим, що зберігається, по кожному полю, яке людина може змінити. Зупиняти вихід треба на рівні стеку: хук `usePreventRemove` отримує цю умову й callback, а в callback ти питаєш і, якщо людина погоджується, пускаєш далі ту саму дію з `data.action`. Новий `goBack()` у кнопці діалогу — це новий вихід, і охорона зупинить його знову. Після «Зберегти» збережене дорівнює чернетці, тож умова сама стає `false`."
        en: "“Something to lose” is a comparison of the draft with what is saved, for every field the person can change. The exit has to be stopped at the stack level: the hook `usePreventRemove` takes that condition and a callback, and in the callback you ask and, if the person agrees, let the same action from `data.action` go ahead. A new `goBack()` in the dialog's button is a new exit, and the guard stops it again. After “Save” the saved data equals the draft, so the condition becomes `false` by itself."
    solutionNote:
      uk: "`isDirty` порівнює обрізану назву й категорію зі збереженою витратою, і `usePreventRemove(isDirty, …)` стоїть на рівні стеку, тож його не обходить ні кнопка Android, ні свайп, ні «‹». «Відкинути» викликає `navigation.dispatch(data.action)` — ту саму дію, на яку екран уже відповів. Після «Зберегти» спільний стан оновлюється, `isDirty` стає `false`, і вихід іде без питання. Усередині `usePreventRemove` слухає подію `beforeRemove`, але власний слухач `navigation.addListener('beforeRemove', …)` з `preventDefault()` у `@react-navigation/native-stack` працює неправильно (так пише документація React Navigation 7), тож на телефоні охорону ставлять саме хуком."
      en: "`isDirty` compares the trimmed label and the category with the saved expense, and `usePreventRemove(isDirty, …)` sits at the stack level, so neither Android's button, nor the swipe, nor “‹” bypasses it. “Discard” calls `navigation.dispatch(data.action)` — the same action the screen has already answered for. After “Save” the shared state updates, `isDirty` becomes `false`, and leaving goes without a question. Inside, `usePreventRemove` listens to the `beforeRemove` event, but your own `navigation.addListener('beforeRemove', …)` with `preventDefault()` does not work properly with `@react-navigation/native-stack` (the React Navigation 7 documentation says so), so on a phone the guard is the hook."
    feedback:
      - when: { test: "leaving an unchanged form does not ask" }
        message:
          uk: "Ця перевірка відкриває витрату, нічого не змінює й натискає кнопку «Назад» Android: діалогу не має бути, а вгорі має бути список. Питання при кожному виході — не «безпечний варіант»: людина, що лише подивилась, щоразу відповідатиме даремно."
          en: "This check opens the expense, changes nothing and presses Android's Back button: there must be no dialog, and the list must be on top. A question on every exit is not “the safe option”: a person who only looked has to answer a pointless question every time."
      - when: { test: "the Android back button asks when the label changed" }
        message:
          uk: "Ця перевірка змінює назву й натискає кнопку «Назад» Android: екран має лишитися, а діалог — відкритися. Ця кнопка не натискає жодної кнопки твого екрана, тож охорона має сидіти на рівні стеку."
          en: "This check changes the label and presses Android's Back button: the screen must stay, and the dialog must open. That button presses none of your screen's buttons, so the guard has to sit at the stack level."
      - when: { test: "spaces at the ends of the label alone are not a change" }
        message:
          uk: "Ця перевірка додає в кінці назви лише пробіл і натискає кнопку «Назад» Android: діалогу не має бути. «Зберегти» записує назву без пробілів по краях, тож порівнюй зі збереженою витратою назву, обрізану `trim()`."
          en: "This check adds only a space at the end of the label and presses Android's Back button: there must be no dialog. “Save” stores the label without spaces at the ends, so compare the label trimmed with `trim()` with the saved expense."
      - when: { test: "a changed category alone counts as unsaved" }
        message:
          uk: "Ця перевірка змінює лише категорію й чекає, що вихід зупиниться. Порівнюй з чернеткою кожне поле, яке людина може змінити."
          en: "This check changes only the category and expects the exit to be stopped. Compare every field the person can change with the draft."
      - when: { test: "discard leaves the screen" }
        message:
          uk: "Ця перевірка натискає «Відкинути» й чекає список угорі без другого діалогу. Якщо діалог зʼявляється знову, кнопка запускає новий вихід (`goBack()`), а не пускає далі той самий (`data.action`)."
          en: "This check presses “Discard” and expects the list on top without a second dialog. If the dialog appears again, the button starts a new exit (`goBack()`) instead of letting the same one (`data.action`) go ahead."
      - when: { test: "after saving, leaving does not ask" }
        message:
          uk: "Ця перевірка змінює назву, натискає «Зберегти» й потім «Назад»: питання не має бути. Умова охорони має порівнювати чернетку з **поточною** збереженою витратою, а не бути завжди `true`."
          en: "This check changes the label, presses “Save” and then Back: there must be no question. The guard's condition must compare the draft with the **current** saved expense rather than always being `true`."

  - id: recall-web-unsaved
    kind: review
    title:
      uk: "Пригадай: незбережені зміни у вебі"
      en: "Recall: unsaved edits on the web"
    items:
      - id: web-dirty
        from: re-05-05-focus-navigation-unsaved
        prompt:
          uk: "У вебформі редагування бажання охорону незбережених змін ввімкнено умовою «форму відкрито». Чому це погана умова і яка краща?"
          en: "In a web form for editing a wish, the unsaved-edits guard is switched on by the condition “the form is open”. Why is that a bad condition, and what is better?"
        answer:
          type: choice
          options:
            - id: compare
              text:
                uk: "Людина, що лише подивилась, щоразу відповідатиме на зайве питання; краще порівнювати чернетку зі збереженим записом"
                en: "A person who only looked has to answer a pointless question every time; it is better to compare the draft with the saved record"
            - id: fine
              text:
                uk: "Умова добра: краще зайвий раз спитати, ніж щось втратити"
                en: "The condition is good: better to ask once too often than to lose something"
              why:
                uk: "Зайві питання привчають людину натискати «Так» не читаючи — і тоді вона відкине справжні зміни. Питати варто лише тоді, коли є що втрачати."
                en: "Pointless questions teach a person to press “Yes” without reading — and then they discard real edits. Ask only when there is something to lose."
            - id: beforeunload
              text:
                uk: "Вона не ловить закриття вкладки; краще замінити її на слухача `beforeunload`"
                en: "It does not catch closing the tab; it is better to replace it with a `beforeunload` listener"
              why:
                uk: "`beforeunload` відповідає на інше питання — «чи закривають вкладку», а не «чи є що втрачати». Умова охорони все одно має бути порівнянням."
                en: "`beforeunload` answers a different question — “is the tab being closed”, not “is there anything to lose”. The guard's condition still has to be a comparison."
          correct: [compare]
        explanation:
          uk: "Незбережені зміни — це різниця між чернеткою й збереженим записом. Це правило однакове у вебі й на телефоні; змінюється лише те, які виходи треба ловити."
          en: "Unsaved edits are the difference between the draft and the saved record. That rule is the same on the web and on a phone; only the exits you have to catch change."

  - id: to-project
    kind: transfer
    capstoneStep: RN-04
    body:
      uk: "У кроці проєкту екран редагування в `native/` отримає `usePreventRemove` з порівнянням чернетки й збереженого запису — наприклад, назви й частоти звички чи назви й суми витрати — і ти перевіриш на заявленій цілі і кнопку в заголовку, і кнопку «Назад» Android чи свайп iOS."
      en: "In the project step the edit screen in `native/` gets `usePreventRemove` with a comparison of the draft and the saved record — for example a habit's name and frequency or an expense's label and amount — and you will check on your declared target both the header button and Android's Back button or the iOS swipe."
