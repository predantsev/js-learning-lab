id: rn-04-08-independent-native-flow
unit: RN-04
title:
  uk: "Самостійно: список, деталі, редагування з безпечним життєвим циклом"
  en: "Independent: list/detail/edit with lifecycle safety"
kind: assessment
minutes: 35
contentVersion: 1
purpose:
  uk: "Перевірити, що ти без підказок збираєш нативний потік «список → деталі → редагування», який не губить незбережену роботу за жодного виходу: ні кнопкою «Назад», ні свайпом, ні переходом у фон, ні зіпсованим посиланням. Спершу — дві чисті функції з автоматичними перевірками, потім — увесь потік на заявленій цілі за чеклістом."
  en: "To check that, without hints, you build a native list → detail → edit flow that loses no unsaved work on any exit: not with Back, not with a swipe, not by going to the background, not with a broken link. First two pure functions with automatic checks, then the whole flow on your declared target with a checklist."
objectives:
  - uk: "Без підказок зібрати потік «список → деталі → редагування», що переживає кожен спосіб повернутися «назад», перехід у фон і назад та зіпсований deep link, не втрачаючи незбережених змін, і перевірити це на заявленій цілі."
    en: "Build, without hints, a list/detail/edit flow that survives every back route, background and foreground, and a malformed deep link without losing unsaved work, verified on the declared target."
prerequisites: [rn-04-07-debug-duplicate-subscriptions]
subskills:
  - { family: N-03, skill: "back/unsaved edits", depth: assess }
  - { family: N-03, skill: "deep links", depth: assess }
  - { family: N-03, skill: "app foreground/background", depth: assess }
  - { family: N-03, skill: "screen focus vs mount", depth: assess }
glossary: []
selfCheck: [recipe-guards]

blocks:
  - id: what-is-checked
    kind: explanation
    title:
      uk: "Що перевіряється"
      en: "What is checked"
    body:
      uk: |
        Тема — синтетичні нотатки з рецептами: у рецепта є id (`r-` і дві цифри), назва, кількість порцій і нотатка. Підказок немає; користуйся тим, що вивчив у цьому розділі, і документацією.

        Потік готовий, коли:

        - список, деталі й редагування лежать у стеку, а деталі й редагування отримують лише id рецепта, з окремим станом «не знайдено»;
        - змінену форму не можна покинути без питання жодним способом, що знімає екран зі стеку, а незмінену — можна без питання;
        - при переході в `background` чернетка зберігається, а при поверненні її не загублено;
        - список перечитує рецепти при фокусі й не тримає зайвих підписок;
        - посилання `courselab://recipe/<id>` відкриває деталі і при холодному старті, і під час роботи, а зіпсоване чи невідоме — екран «не знайдено».

        Дві частини цього — розбір посилання й рішення «чи є що втрачати» — це чисті функції. Їх перевіряють автоматично у вправі нижче, на прихованих наборах прикладів.
      en: |
        The topic is synthetic recipe notes: a recipe has an id (`r-` and two digits), a title, a number of servings and a note. There are no hints; use what you learned in this unit and the documentation.

        The flow is ready when:

        - the list, the details and the edit form lie on a stack, and the details and the form receive only the recipe's id, with their own “not found” state;
        - a changed form cannot be left without a question by any way that takes the screen off the stack, while an unchanged one can be left without a question;
        - on the change to `background` the draft is saved, and on return it is not lost;
        - the list re-reads the recipes on focus and keeps no extra subscriptions;
        - the link `courselab://recipe/<id>` opens the details both on a cold start and while running, and a broken or unknown one the “not found” screen.

        Two parts of this — parsing the link and deciding “is there anything to lose” — are pure functions. They are checked automatically in the exercise below, on hidden sets of examples.

  - id: recipe-guards
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: recipe-guards
    entry: index.js
    editable: [recipes.js]
    strings:
      soup: { uk: "Борщ", en: "Beetroot soup" }
      note: { uk: "Додати кріп наприкінці", en: "Add dill at the end" }
      otherTitle: { uk: "Пісний борщ", en: "Lenten beetroot soup" }
    title:
      uk: "Посилання на рецепт і незбережені зміни"
      en: "A recipe link and unsaved edits"
    instructions:
      uk: |
        У `recipes.js` напиши дві чисті функції.

        `parseRecipeLink(url)` повертає `{ screen: 'Detail', params: { id } }` або `{ screen: 'NotFound' }` і ніколи не кидає помилку. Посилання правильне, коли схема — `courselab:`, місце — `recipe`, а єдиний сегмент шляху після декодування відповідає правилу id рецепта. У `params` іде лише id.

        `hasUnsavedChanges(draft, saved)` повертає `true`, коли вихід з форми зараз щось загубить. Чернетка — текст полів `{ title, servings, note }`, збережений рецепт — `{ title, servings, note }`, де `servings` — число. Пробіли по краях полів не є зміною; порції порівнюються як числа (`'04'` — це 4), а порожнє поле чи не число — зміна.

        Перевірки використовують приховані набори прикладів: правильні, закодовані, зіпсовані, чужі посилання й чернетки з різними змінами. `index.js` друкує результати для кількох прикладів.
      en: |
        In `recipes.js` write two pure functions.

        `parseRecipeLink(url)` returns `{ screen: 'Detail', params: { id } }` or `{ screen: 'NotFound' }` and never throws. A link is valid when the scheme is `courselab:`, the place is `recipe`, and the single path segment, once decoded, matches the recipe id rule. Only the id goes into `params`.

        `hasUnsavedChanges(draft, saved)` returns `true` when leaving the form now would lose something. The draft is the text of the fields `{ title, servings, note }`, the saved recipe is `{ title, servings, note }`, where `servings` is a number. Spaces at the ends of fields are not a change; servings are compared as numbers (`'04'` is 4), and an empty field or a non-number is a change.

        The checks use hidden sets of examples: valid, encoded, broken and foreign links, and drafts with various changes. `index.js` prints the results for a few examples.
    testTitles:
      "a valid or encoded recipe link opens Detail with only the id":
        uk: "Правильне чи закодоване посилання відкриває `Detail` лише з id"
        en: "A valid or encoded link opens `Detail` with only the id"
      "a malformed, unknown-shaped or foreign link gives NotFound without throwing":
        uk: "Зіпсоване, не за правилом чи чуже посилання — `NotFound` без винятку"
        en: "A broken, rule-breaking or foreign link gives `NotFound` without throwing"
      "an unchanged draft has nothing to lose":
        uk: "Незмінена чернетка — нічого втрачати"
        en: "An unchanged draft has nothing to lose"
      "a changed field is unsaved work":
        uk: "Змінене поле — незбережена робота"
        en: "A changed field is unsaved work"
    solutionNote:
      uk: "Посилання відкидається на кожному кроці, де щось не так, а декодування в `try` йде перед перевіркою правилом, тож `r%2D12` проходить, а `..%2Ftask%2Ft-02` — ні. Чернетку порівнюють поле за полем після `trim()`, а порції — як числа, бо поле дає текст, а збережено число; порожнє поле — теж зміна, бо `Number('')` дорівнює 0, а не «нічого»."
      en: "The link is rejected at every step where something is wrong, and decoding inside `try` comes before the rule check, so `r%2D12` passes and `..%2Ftask%2Ft-02` does not. The draft is compared field by field after `trim()`, and servings as numbers, because the field gives text while a number is saved; an empty field is a change too, because `Number('')` is 0, not “nothing”."
    feedback:
      - when: { test: "a malformed, unknown-shaped or foreign link gives NotFound without throwing" }
        message:
          uk: "Ця перевірка дає зіпсоване кодування, порожній id, id не за правилом, зайвий сегмент, закодований шлях в інше місце, іншу схему чи місце й текст, що не є адресою, і для кожного чекає `{ screen: 'NotFound' }`. `threw …` у повідомленні означає, що виняток вийшов назовні."
          en: "This check passes broken encoding, an empty id, ids against the rule, an extra segment, an encoded path to another place, another scheme or place and text that is not an address, and expects `{ screen: 'NotFound' }` for each. `threw …` in the message means an exception escaped."
      - when: { test: "an unchanged draft has nothing to lose" }
        message:
          uk: "Ця перевірка дає чернетки з тими самими значеннями, з пробілами по краях і з порціями `'04'` і чекає `false`. Текст поля `'4'` і збережене число `4` строгою рівністю не рівні."
          en: "This check passes drafts with the same values, with spaces at the ends and with servings `'04'`, and expects `false`. The field text `'4'` and the saved number `4` are not equal under strict equality."
      - when: { test: "a changed field is unsaved work" }
        message:
          uk: "Ця перевірка змінює по одному полю — назву, порції, нотатку, порожні порції, порції не числом — і для кожного чекає `true`."
          en: "This check changes one field at a time — the title, the servings, the note, empty servings, non-numeric servings — and expects `true` for each."

  - id: recall-web-flow
    kind: review
    title:
      uk: "Пригадай: самостійний потік у вебі"
      en: "Recall: the independent flow on the web"
    items:
      - id: web-flow-diff
        from: re-05-09-independent-list-detail-edit
        prompt:
          uk: "Ти вже будував потік «список → деталі → редагування» у вебі. Що з того, що там вимагалось, на телефоні змінюється найбільше?"
          en: "You already built a list → detail → edit flow on the web. Of what was required there, what changes most on a phone?"
        answer:
          type: choice
          options:
            - id: exits
              text:
                uk: "Способи покинути екран і життєвий цикл: системна кнопка «Назад», свайп, фон, холодний старт з посилання — а екрани під верхнім лишаються змонтованими"
                en: "The ways to leave a screen and the life cycle: the system Back button, the swipe, the background, a cold start from a link — and the screens under the top one stay mounted"
            - id: validation
              text:
                uk: "Перевірка форми: на телефоні вона не потрібна, бо клавіатура не дає ввести зайве"
                en: "Form validation: it is not needed on a phone, because the keyboard does not let you type anything wrong"
              why:
                uk: "Цифрова клавіатура не гарантує правильного числа, а дані з посилання й сховища теж приходять ззовні. Перевірка лишається тією самою."
                en: "A numeric keyboard does not guarantee a valid number, and data from a link or storage comes from outside too. Validation stays the same."
            - id: nothing
              text:
                uk: "Нічого: React той самий, тож і потік той самий"
                en: "Nothing: React is the same, so the flow is the same"
              why:
                uk: "Стан, ефекти й доменна логіка ті самі, але навігація інша: стек тримає екрани змонтованими, а виходів більше, і частина з них — поза твоїми кнопками."
                en: "State, effects and the domain logic are the same, but navigation differs: the stack keeps screens mounted, and there are more exits, some of them beyond your buttons."
          correct: [exits]
        explanation:
          uk: "Доменні функції, перевірка й стан переходять без змін — тому ти й можеш перевірити розбір посилання й «чи є що втрачати» тут, у браузері. Нове — це стек, фокус, AppState і посилання ззовні."
          en: "Domain functions, validation and state carry over unchanged — that is why you can check the link parsing and “is there anything to lose” here, in the browser. What is new is the stack, focus, AppState and links from outside."

  - id: recipes-on-device
    kind: local-task
    runtime: local-native
    title:
      uk: "Потік рецептів на заявленій цілі"
      en: "The recipe flow on your declared target"
    intro:
      uk: |
        Це самостійне завдання без готового коду й без підказок. Створи окремий навчальний проєкт `rn04-recipes` у теці `~/js-course` (якщо її ще немає, створи її командою `mkdir -p ~/js-course`) і збери в ньому потік з розділу «Що перевіряється». Функції з вправи вище перенеси в нього без змін — `parseRecipeLink` і `hasUnsavedChanges` уже перевірені.

        Під час підготовки уроку команди кроків 1 і 2 запускали в іншому навчальному проєкті (`rn04-lab`, Node.js v25.2.1) з тими самими версіями: Expo SDK 57, React Native 0.86.3, `@react-navigation/native` 7.5.0, `@react-navigation/native-stack` 7.20.0. **Сам потік на пристрої під час підготовки не перевірено** — там немає нативних інструментів; усе, що стосується пристрою, описано за документацією Expo SDK 57, React Native 0.86 і React Navigation 7.

        Посилання в Expo Go мають вигляд `exp://<адреса з npx expo start>/--/recipe/r-07`, а не `courselab://recipe/r-07`: власна схема працює лише в окремій збірці застосунку. Тож у застосунку перетвори такий шлях на посилання `courselab://` (або розбирай частину після `/--/`), перш ніж віддати його `parseRecipeLink`.

        Якщо емулятора, симулятора чи телефона немає, натисни **«У мене немає емулятора чи пристрою»**: завдання запишеться як не виконане, а вправа вище вже закрила автоматично перевірювану частину.
      en: |
        This is an independent task with no ready code and no hints. Create a separate lab project `rn04-recipes` in the `~/js-course` folder (if it does not exist yet, create it with `mkdir -p ~/js-course`) and build in it the flow from the “What is checked” section. Move the functions from the exercise above into it unchanged — `parseRecipeLink` and `hasUnsavedChanges` are already checked.

        While preparing this lesson, the commands of steps 1 and 2 were run in another lab project (`rn04-lab`, Node.js v25.2.1) with the same versions: Expo SDK 57, React Native 0.86.3, `@react-navigation/native` 7.5.0, `@react-navigation/native-stack` 7.20.0. **The flow itself was not checked on a device while preparing** — there were no native tools; everything about the device follows the documentation of Expo SDK 57, React Native 0.86 and React Navigation 7.

        In Expo Go links look like `exp://<address from npx expo start>/--/recipe/r-07`, not `courselab://recipe/r-07`: a custom scheme works only in a separate build of the app. So in the app, turn such a path into a `courselab://` link (or parse the part after `/--/`) before handing it to `parseRecipeLink`.

        If you have no emulator, simulator or phone, press **“I have no emulator or device”**: the task is recorded as not performed, and the exercise above already covered the automatically checked part.
    tools:
      - { name: "Node.js", version: "22.13 or newer", note: { uk: "мінімум для Expo SDK 57 за таблицею версій Expo", en: "the minimum for Expo SDK 57 per Expo's version table" } }
      - { name: "Expo SDK", version: "57 (React Native 0.86)", note: { uk: "ставиться командою з кроку 1", en: "installed by the command in step 1" } }
      - { name: "React Navigation", version: "7", note: { uk: "версії підбирає `npx expo install`", en: "`npx expo install` picks the versions" } }
      - { name: "Declared target", version: "from RN-01", note: { uk: "емулятор Android, симулятор iOS або телефон з Expo Go для SDK 57", en: "an Android emulator, an iOS simulator or a phone with Expo Go for SDK 57" } }
    steps:
      - text:
          uk: "У терміналі перейди в теку `~/js-course` і створи проєкт із шаблону TypeScript."
          en: "In the terminal, go to the `~/js-course` folder and create the project from the TypeScript template."
        command: "npx create-expo-app@latest rn04-recipes --template blank-typescript"
        expect:
          uk: "Зʼявилася тека `rn04-recipes` з `App.tsx` і `package.json`, де `expo` ~57."
          en: "A folder `rn04-recipes` appears with `App.tsx` and a `package.json` listing `expo` ~57."
      - text:
          uk: "Перейди в теку проєкту (`cd rn04-recipes`) і додай React Navigation з нативним стеком."
          en: "Go into the project folder (`cd rn04-recipes`) and add React Navigation with the native stack."
        command: "npx expo install @react-navigation/native @react-navigation/native-stack react-native-screens react-native-safe-area-context"
        expect:
          uk: "У `package.json` зʼявилися `@react-navigation/native` ^7 і `@react-navigation/native-stack` ^7."
          en: "`package.json` lists `@react-navigation/native` ^7 and `@react-navigation/native-stack` ^7."
      - text:
          uk: "Збери потік: екрани, параметри, охорону, збереження чернетки, оновлення при фокусі й обробку посилань. Перевіряй типи командою `npx tsc --noEmit`, поки вона не завершиться без повідомлень."
          en: "Build the flow: the screens, the params, the guard, saving the draft, refreshing on focus and handling links. Check the types with `npx tsc --noEmit` until it finishes without messages."
        command: "npx tsc --noEmit"
      - text:
          uk: "Запусти dev-сервер, відкрий застосунок на заявленій цілі й пройди чекліст нижче. Не перевірено під час підготовки уроку."
          en: "Start the dev server, open the app on your declared target and go through the checklist below. Not checked while preparing this lesson."
        command: "npx expo start"
    verify:
      - { id: id-params, text: { uk: "Деталі й редагування отримують лише id, а невідомий id показує «не знайдено»", en: "The details and the edit form receive only the id, and an unknown id shows “not found”" } }
      - { id: guard-every-exit, text: { uk: "Змінену форму не вдається покинути без питання ні кнопкою в заголовку, ні кнопкою «Назад» Android чи свайпом iOS; незмінену — можна без питання", en: "A changed form cannot be left without a question by the header button, nor by Android's Back button or the iOS swipe; an unchanged one can be left without a question" } }
      - { id: draft-background, text: { uk: "Після виходу на головний екран і повернення змінена чернетка на місці й збережена", en: "After going to the home screen and coming back, the changed draft is still there and saved" } }
      - { id: focus-refresh, text: { uk: "Після редагування список при поверненні показує зміни, а одне повернення в застосунок дає одну обробку", en: "After editing, the list shows the changes on return, and one return to the app gives one handling" } }
      - { id: links, text: { uk: "Посилання на рецепт відкриває деталі і при холодному старті, і під час роботи, а зіпсоване — «не знайдено» без помилки (або я позначив(-ла), що посилання не перевіряв(-ла) на телефоні)", en: "A recipe link opens the details both on a cold start and while running, and a broken one “not found” without an error (or I noted that I did not check links on a phone)" } }
    troubleshooting:
      - problem: { uk: "Помилка про `usePreventRemove` разом з `headerBackButtonMenuEnabled: true`", en: "An error about `usePreventRemove` together with `headerBackButtonMenuEnabled: true`" }
        fix: { uk: "У вихідному коді `@react-navigation/native-stack` 7.20 це поєднання позначено як непідтримуване: у консоль іде помилка «… uses 'usePreventRemove' hook alongside 'headerBackButtonMenuEnabled: true', which is not supported», а поки вихід заборонено, стек сам вимикає це меню. Прибери `headerBackButtonMenuEnabled: true` з опцій екрана з охороною. Не перевірено на пристрої під час підготовки уроку.", en: "In the source of `@react-navigation/native-stack` 7.20 this combination is marked as unsupported: the console gets the error “… uses 'usePreventRemove' hook alongside 'headerBackButtonMenuEnabled: true', which is not supported”, and while leaving is prevented the stack turns that menu off itself. Remove `headerBackButtonMenuEnabled: true` from the guarded screen's options. Not checked on a device while preparing this lesson." }
      - problem: { uk: "Посилання відкриває головний екран Expo Go замість рецепта", en: "The link opens Expo Go's home screen instead of the recipe" }
        fix: { uk: "Адреса має бути та, яку показав `npx expo start` (з портом), а після неї — `/--/recipe/r-07`. Власна схема `courselab://` у Expo Go не працює. Не перевірено під час підготовки уроку.", en: "The address must be the one `npx expo start` showed (with the port), followed by `/--/recipe/r-07`. The custom scheme `courselab://` does not work in Expo Go. Not checked while preparing this lesson." }
      - problem: { uk: "Охорона питає навіть після «Зберегти»", en: "The guard asks even after “Save”" }
        fix: { uk: "Якщо «Зберегти» одразу викликає `goBack()`, охорона ще бачить умову з попереднього рендеру, де чернетка відрізнялась від збереженого. Або не виходь у тому самому обробнику, або порівнюй чернетку з тим, що щойно записано. Не перевірено на пристрої під час підготовки уроку.", en: "If “Save” calls `goBack()` straight away, the guard still sees the condition from the previous render, where the draft differed from the saved data. Either do not leave in the same handler, or compare the draft with what was just written. Not checked on a device while preparing this lesson." }
