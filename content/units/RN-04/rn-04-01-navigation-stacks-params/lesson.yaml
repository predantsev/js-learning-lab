id: rn-04-01-navigation-stacks-params
unit: RN-04
title:
  uk: "Стеки навігації, маршрути й параметри"
  en: "Navigation stacks, routes and params"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Простежити push, pop і replace на стеку навігації й передбачити, які екрани лишаються змонтованими під тим, що зараз угорі."
    en: "Trace push, pop and replace on a navigation stack and predict which screens stay mounted underneath the focused one."
  - uk: "Передавати екрану як параметр лише id запису й шукати сам запис у спільному стані, а не передавати весь обʼєкт."
    en: "Pass only a record id as a screen param and look the record up from shared state, instead of passing the whole object."
prerequisites: [rn-03-08-capstone-native-crud, re-05-02-params-nested-routes]
subskills:
  - { family: N-03, skill: "navigation/routes/params", depth: intro }
glossary: [navigation-stack, screen-params]
selfCheck: [predict-stack, task-params]

blocks:
  - id: cards-on-a-stack
    kind: explanation
    title:
      uk: "Екрани лягають один на одного"
      en: "Screens pile up on each other"
    body:
      uk: |
        У вебі перехід на інший маршрут **замінює** екран: старий компонент демонтується, а повернення «Назад» монтує його знову з нуля. Нативний застосунок працює інакше. Його екрани лежать у [[navigation-stack|стеку навігації]], як картки в стосі:

        - `navigation.push('Detail', { id })` кладе новий екран **згори**; той, що був під ним, лишається змонтованим — зі своїм станом, прокруткою й напівнабраним текстом, — просто його не видно;
        - `navigation.goBack()` (чи `pop()`) знімає верхній екран: він демонтується, а екран під ним знову стає видимим — **без повторного монтування**;
        - `navigation.replace('Edit', { id })` знімає верхній екран і кладе на його місце інший: замінений демонтується.

        Видимий екран угорі отримує дотики; решта стоїть під ним. Так поводиться бібліотека навігації React Navigation 7 (`@react-navigation/native-stack`), з якої документація React Native радить починати, і так само працює імітований стек у перегляді цього розділу.
      en: |
        On the web, moving to another route **replaces** the screen: the old component unmounts, and going Back mounts it again from scratch. A native app works differently. Its screens lie on a [[navigation-stack]], like cards in a pile:

        - `navigation.push('Detail', { id })` puts a new screen **on top**; the one underneath stays mounted — with its state, its scroll position and its half-typed text — it is just not visible;
        - `navigation.goBack()` (or `pop()`) takes the top screen off: it unmounts, and the screen underneath becomes visible again — **without mounting again**;
        - `navigation.replace('Edit', { id })` takes the top screen off and puts another one in its place: the replaced one unmounts.

        The visible top screen receives touches; the rest wait under it. That is how the navigation library React Navigation 7 (`@react-navigation/native-stack`), which the React Native documentation recommends starting with, behaves, and the simulated stack in this unit's preview works the same way.

  - id: stack-steps
    kind: visual
    visual: diagram
    title:
      uk: "Стек навігації крок за кроком"
      en: "A navigation stack step by step"
    textEquivalent:
      uk: "Стек росте знизу вгору. Спочатку в ньому лише List — він змонтований і вгорі. push('Detail', { id: 'w-03' }) кладе Detail згори з параметром id; List лишається змонтованим під ним. push('Edit', { id: 'w-03' }) кладе Edit згори; змонтовані всі три екрани, видно лише Edit. goBack() знімає Edit: він демонтується, а Detail знову вгорі без повторного монтування. replace('Edit', { id: 'w-03' }) на екрані Detail знімає Detail і кладе Edit на його місце: тепер у стеку List і Edit, а Detail демонтовано."
      en: "The stack grows from the bottom up. At first it holds only List — mounted and on top. push('Detail', { id: 'w-03' }) puts Detail on top with the param id; List stays mounted underneath. push('Edit', { id: 'w-03' }) puts Edit on top; all three screens are mounted, only Edit is visible. goBack() takes Edit off: it unmounts, and Detail is on top again without mounting again. replace('Edit', { id: 'w-03' }) on the Detail screen takes Detail off and puts Edit in its place: now the stack holds List and Edit, and Detail has unmounted."
    spec:
      layout: grid
      nodes:
        - { id: edit, label: "Edit { id: 'w-03' }", col: 0, row: 0, w: 220 }
        - { id: detail, label: "Detail { id: 'w-03' }", col: 0, row: 1, w: 220 }
        - { id: list, label: "List", col: 0, row: 2, w: 220 }
      edges:
        - { id: detail-on-list, from: detail, to: list, kind: line }
        - { id: edit-on-detail, from: edit, to: detail, kind: line }
      hidden: [detail, edit, detail-on-list, edit-on-detail]
      steps:
        - highlight: [list]
          annotate:
            - { id: list, text: { uk: "угорі", en: "on top" } }
          caption:
            uk: "У стеку один екран — `List`. Він змонтований і видимий."
            en: "The stack holds one screen, `List`. It is mounted and visible."
        - show: [detail, detail-on-list]
          highlight: [detail]
          annotate:
            - { id: detail, text: { uk: "угорі", en: "on top" } }
            - { id: list, text: { uk: "змонтований, прихований", en: "mounted, hidden" } }
          caption:
            uk: "`push('Detail', { id: 'w-03' })` кладе `Detail` згори з параметром `id`. `List` не демонтується — він лише прихований."
            en: "`push('Detail', { id: 'w-03' })` puts `Detail` on top with the param `id`. `List` does not unmount — it is only hidden."
        - show: [edit, edit-on-detail]
          highlight: [edit]
          annotate:
            - { id: edit, text: { uk: "угорі", en: "on top" } }
            - { id: detail, text: { uk: "змонтований, прихований", en: "mounted, hidden" } }
            - { id: list, text: { uk: "змонтований, прихований", en: "mounted, hidden" } }
          caption:
            uk: "`push('Edit', { id: 'w-03' })`: змонтовані всі три екрани, видно лише `Edit`."
            en: "`push('Edit', { id: 'w-03' })`: all three screens are mounted, only `Edit` is visible."
        - highlight: [detail]
          dim: [edit, edit-on-detail]
          annotate:
            - { id: edit, text: { uk: "демонтовано", en: "unmounted" } }
            - { id: detail, text: { uk: "знову вгорі", en: "on top again" } }
          caption:
            uk: "`goBack()` знімає `Edit` — він демонтується. `Detail` знову вгорі з тим самим станом: його не монтували вдруге."
            en: "`goBack()` takes `Edit` off — it unmounts. `Detail` is on top again with the same state: it was not mounted a second time."
        - highlight: [edit]
          dim: [detail, detail-on-list]
          annotate:
            - { id: detail, text: { uk: "замінено, демонтовано", en: "replaced, unmounted" } }
            - { id: edit, text: { uk: "угорі, прямо над List", en: "on top, right above List" } }
          caption:
            uk: "Інший шлях: `replace('Edit', { id: 'w-03' })` на `Detail` знімає `Detail` і кладе `Edit` на його місце. У стеку тепер `List` і `Edit`; «Назад» з `Edit` поверне просто до `List`."
            en: "Another path: `replace('Edit', { id: 'w-03' })` on `Detail` takes `Detail` off and puts `Edit` in its place. The stack now holds `List` and `Edit`; Back from `Edit` returns straight to `List`."

  - id: predict-stack
    kind: prediction
    prompt:
      uk: "У застосунку зі стеком навігації людина відкрила список бажань (`List`), натиснула на «Велосипед» (`push('Detail', { id: 'w-03' })`), потім «Змінити» (`push('Edit', { id: 'w-03' })`) і повернулась «Назад». Що тепер у стеку і що змонтовано?"
      en: "In an app with a navigation stack, a person opened the wishlist (`List`), tapped “Bicycle” (`push('Detail', { id: 'w-03' })`), then “Edit” (`push('Edit', { id: 'w-03' })`) and went Back. What is on the stack now, and what is mounted?"
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "У стеку List і Detail, обидва змонтовані; Detail угорі, Edit демонтовано"
            en: "The stack holds List and Detail, both mounted; Detail is on top, Edit has unmounted"
        - id: web-like
          text:
            uk: "У стеку List і Detail, але змонтований лише Detail; List змонтується знову, коли до нього повернуться"
            en: "The stack holds List and Detail, but only Detail is mounted; List will mount again when you return to it"
          why:
            uk: "Так працює вебмаршрутизація, де перехід замінює екран. У нативному стеку екран під верхнім лишається змонтованим зі своїм станом."
            en: "That is how web routing works, where a transition replaces the screen. On a native stack the screen under the top one stays mounted with its state."
        - id: all-three
          text:
            uk: "У стеку List, Detail і Edit, усі змонтовані; Edit лише прихований"
            en: "The stack holds List, Detail and Edit, all mounted; Edit is only hidden"
          why:
            uk: "«Назад» знімає верхній екран зі стеку, і знятий екран демонтується. Прихованими лишаються лише ті, що ще в стеку під верхнім."
            en: "Back takes the top screen off the stack, and a screen taken off unmounts. Only the screens still on the stack under the top one stay hidden."
        - id: fresh-detail
          text:
            uk: "У стеку List і новий Detail, змонтований заново з параметром id"
            en: "The stack holds List and a new Detail, mounted again with the param id"
          why:
            uk: "«Назад» не створює екран, а відкриває той, що вже лежав під верхнім. `Detail` той самий, що й до переходу на `Edit`."
            en: "Back does not create a screen; it reveals the one that was already lying under the top one. `Detail` is the same one as before moving to `Edit`."
      correct: [right]
    explanation:
      uk: "`goBack()` знімає лише `Edit`. `Detail` і `List` весь час були змонтовані — `Detail` просто знову видно. Звідси наслідок, важливий для параметрів: `Detail` не перечитує свої параметри при поверненні — він показує те, що отримав, коли його поклали на стек."
      en: "`goBack()` takes off only `Edit`. `Detail` and `List` were mounted all along — `Detail` is simply visible again. Here is a consequence that matters for params: `Detail` does not re-read its params on return — it shows what it received when it was put on the stack."

  - id: id-not-object
    kind: explanation
    title:
      uk: "Параметр — це id, а не запис"
      en: "The param is an id, not the record"
    body:
      uk: |
        [[screen-params|Параметри екрана]] — другий аргумент `push`, `route.params` на тому боці. Вони схожі на пропси, але є різниця: екран отримує їх **один раз**, коли лягає на стек, і вони не стежать за змінами даних (змінити їх може лише код, що явно викличе `navigation.setParams`).

        Якщо передати весь запис (`{ wish }`), екран деталей тримає **копію на момент переходу**. Змінив назву на екрані редагування, повернувся — деталі показують стару назву: вони лежали змонтованими й нічого не перечитали.

        Тому передають лише id (`{ id: wish.id }`), а сам запис екран шукає у **спільному стані** застосунку — там, звідки читає й список. Коли запис змінюється, спільний стан перерендерить кожен екран, що його читає, навіть прихований. Документація React Navigation радить те саме: у параметрах — мінімум даних, як-от id, а дані — у спільному сховищі.

        Ще одна річ: id може не знайтися (запис видалили, а пізніше в розділі id прийде ще й ззовні застосунку). Тому екран деталей має окремий стан «не знайдено», а не падає.
      en: |
        [[screen-params]] are the second argument of `push`, `route.params` on the other side. They look like props, but there is a difference: the screen receives them **once**, when it is put on the stack, and they do not follow changes to the data (only code that explicitly calls `navigation.setParams` changes them).

        If you pass the whole record (`{ wish }`), the detail screen holds a **copy taken at the moment of navigation**. You change the name on the edit screen, go back — the details show the old name: they stayed mounted and re-read nothing.

        So you pass only the id (`{ id: wish.id }`), and the screen looks the record up in the app's **shared state** — where the list reads it too. When the record changes, the shared state re-renders every screen that reads it, even a hidden one. The React Navigation documentation advises the same: minimal data such as an id in params, and the data itself in a shared store.

        One more thing: an id may not be found (the record was deleted, and later in this unit an id will also come from outside the app). So the detail screen has its own “not found” state instead of crashing.

  - id: wish-stack
    kind: example
    runtime: concept-preview
    dir: wish-stack
    entry: main.jsx
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      edit: { uk: "Змінити", en: "Edit" }
      nameLabel: { uk: "Назва", en: "Name" }
      save: { uk: "Зберегти", en: "Save" }
      simHeaderBack: { uk: "Назад", en: "Back" }
      simStack: { uk: "Стек (імітація)", en: "Stack (simulated)" }
      simHardwareBack: { uk: "Android: «Назад»", en: "Android: Back" }
      simSwipeBack: { uk: "iOS: свайп назад", en: "iOS: swipe back" }
    title:
      uk: "Деталі, що отримали копію бажання"
      en: "A detail screen that received a copy of the wish"
    body:
      uk: |
        Список бажань на імітованому стеку: `navSim.jsx` дає ті самі `navigation.push`, `goBack` і `route.params`, що й React Navigation, а `recordStore.js` — спільний стан, з якого читають екрани. Під телефоном видно, які екрани зараз у стеку.

        Тут `ListScreen` передає екрану деталей **увесь обʼєкт** бажання: `push('Detail', { wish })`. Натисни **Запустити**, відкрий «Велосипед», натисни «Змінити», зміни назву й натисни «Зберегти».
      en: |
        A wishlist on a simulated stack: `navSim.jsx` provides the same `navigation.push`, `goBack` and `route.params` as React Navigation, and `recordStore.js` is the shared state the screens read from. Under the phone you can see which screens are on the stack right now.

        Here `ListScreen` passes the **whole wish object** to the detail screen: `push('Detail', { wish })`. Press **Run**, open “Bicycle”, press “Edit”, change the name and press “Save”.
    tryIt:
      uk: |
        1. Після «Зберегти» ти знову на `Detail`: стара назва. Натисни «‹ Назад» — у списку назва вже нова. Список читає спільний стан, а деталі — свою копію.
        2. У `ListScreen` заміни `{ wish }` на `{ id: wish.id }`.
        3. У `DetailScreen` заміни рядок коду `const { wish } = route.params;` так, щоб екран шукав бажання за `route.params.id` у спільному стані — так само, як це вже робить `EditScreen`.
        4. Запусти знову й повтори кроки: після «Зберегти» деталі показують нову назву.
      en: |
        1. After “Save” you are back on `Detail`: the old name. Press “‹ Back” — the list already shows the new name. The list reads the shared state; the details read their copy.
        2. In `ListScreen` replace `{ wish }` with `{ id: wish.id }`.
        3. In `DetailScreen` replace the line `const { wish } = route.params;` so that the screen looks the wish up by `route.params.id` in the shared state — just as `EditScreen` already does.
        4. Run again and repeat the steps: after “Save” the details show the new name.
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не нативний застосунок. Стек імітує `navSim.jsx`: він повторює поведінку React Navigation 7 (екрани під верхнім лишаються змонтованими), але без нативних екранів, анімацій переходу й справжніх жестів. Як стек виглядає й поводиться на телефоні, перевіряють на заявленій цілі."
      en: "This is a browser preview through react-native-web, not a native app. The stack is simulated by `navSim.jsx`: it repeats React Navigation 7's behavior (screens under the top one stay mounted), but without native screens, transition animations or real gestures. How the stack looks and behaves on a phone is checked on your declared target."

  - id: task-params
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: task-params
    entry: main.jsx
    editable: [routes.ts, screens.tsx]
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      dueLabel: { uk: "Термін:", en: "Due:" }
      edit: { uk: "Змінити", en: "Edit" }
      notFound: { uk: "Такої справи немає", en: "There is no such task" }
      titleLabel: { uk: "Назва справи", en: "Task title" }
      save: { uk: "Зберегти", en: "Save" }
      changedTitle: { uk: "Полити квіти на балконі", en: "Water the balcony plants" }
      simHeaderBack: { uk: "Назад", en: "Back" }
      simStack: { uk: "Стек (імітація)", en: "Stack (simulated)" }
      simHardwareBack: { uk: "Android: «Назад»", en: "Android: Back" }
      simSwipeBack: { uk: "iOS: свайп назад", en: "iOS: swipe back" }
    title:
      uk: "Параметри екранів планувальника"
      en: "Screen params for the planner"
    instructions:
      uk: |
        Планувальник має три екрани: `List`, `Detail` і `Edit`. Екран редагування вже готовий і шукає справу за id. Дороби решту:

        - у `routes.ts` опиши параметри `Detail` і `Edit` — лише id справи (текст у лапках, `string`). Типи пісочниця не перевіряє, тож перевірки нижче цей пункт не бачать — у справжньому проєкті його перевіряє `tsc`;
        - у `screens.tsx` рядок списку відкриває `Detail` і передає йому **лише** id своєї справи;
        - `DetailScreen` знаходить справу за отриманим id у спільному стані (`tasks.useRecords()`), а коли такої справи немає, показує текст «не знайдено» (той самий `%%notFound%%`, що й у `EditScreen`), а не падає.

        Перевірки натискають рядки й кнопки в перегляді, змінюють назву справи на екрані редагування й відкривають `Detail` з id, якого немає.
      en: |
        The planner has three screens: `List`, `Detail` and `Edit`. The edit screen is ready and looks its task up by id. Finish the rest:

        - in `routes.ts` describe the params of `Detail` and `Edit` — only the task's id (a `string`). The sandbox does not check types, so the checks cannot see this item — in a real project `tsc` checks it;
        - in `screens.tsx` a list row opens `Detail` and passes it **only** its task's id;
        - `DetailScreen` finds the task with the received id in the shared state (`tasks.useRecords()`), and when there is no such task it shows the not-found text (the same `%%notFound%%` as in `EditScreen`) instead of crashing.

        The checks press rows and buttons in the preview, change a task's title on the edit screen and open `Detail` with an id that does not exist.
    limits:
      uk: "Стек імітує `navSim.jsx` у перегляді react-native-web. Типи з `routes.ts` пісочниця лише вирізає й нічого не перевіряє — у справжньому проєкті їх перевіряє `tsc`. Нативні екрани й переходи перевіряють на заявленій цілі."
      en: "The stack is simulated by `navSim.jsx` in the react-native-web preview. The sandbox only strips the types from `routes.ts` and checks nothing — in a real project `tsc` checks them. Native screens and transitions are checked on your declared target."
    testTitles:
      "opening a task pushes Detail with only its id":
        uk: "Рядок кладе на стек `Detail` лише з id справи"
        en: "A row pushes `Detail` with only its task's id"
      "the detail screen shows the task the row was pressed for":
        uk: "`Detail` показує справу, на яку натиснули"
        en: "`Detail` shows the task that was pressed"
      "after editing, going back shows the new title on the detail screen":
        uk: "Після редагування й повернення `Detail` показує нову назву"
        en: "After editing and going back, `Detail` shows the new title"
      "an unknown id shows the not-found message":
        uk: "Для id, якого немає, `Detail` показує «не знайдено»"
        en: "For an id that does not exist, `Detail` shows “not found”"
    hints:
      nudge:
        uk: "Що саме екран деталей має отримати від списку, щоб знайти справу сам? І звідки він має її брати, щоб бачити зміни з екрана редагування?"
        en: "What exactly must the detail screen get from the list to find the task itself? And where must it take the task from to see changes made on the edit screen?"
      explanation:
        uk: "Подивись, як це вже зроблено в `EditScreen`: він отримує `{ id }` і шукає запис через `find` у `tasks.useRecords()`. `Detail` потребує того самого, а список має передавати саме такий обʼєкт параметрів. Коли `find` нічого не знаходить, він повертає `undefined` — перевір це до того, як читати `task.title`, і поверни окремий `Text`."
        en: "Look at how `EditScreen` already does it: it receives `{ id }` and looks the record up with `find` in `tasks.useRecords()`. `Detail` needs the same, and the list must pass exactly that params object. When `find` finds nothing it returns `undefined` — check that before reading `task.title`, and return a separate `Text`."
    solutionNote:
      uk: "Список кладе на стек `push('Detail', { id: task.id })`, а `Detail` знаходить справу в спільному стані. Після «Зберегти» спільний стан перерендерює прихований `Detail`, тож при поверненні видно нову назву. Невідомий id дає `undefined`, і екран показує «не знайдено» замість помилки. Спрощений `ScreenProps` цієї вправи приймає в `push` будь-який обʼєкт; у справжньому проєкті екрани типізують через `NativeStackScreenProps<RootStackParamList, 'List'>` з React Navigation, і тоді `Detail: { id: string }` не дасть `tsc` пропустити `push('Detail', { task })`."
      en: "The list pushes `push('Detail', { id: task.id })`, and `Detail` finds the task in the shared state. After “Save” the shared state re-renders the hidden `Detail`, so on return the new title is visible. An unknown id gives `undefined`, and the screen shows “not found” instead of an error. This exercise's simplified `ScreenProps` lets `push` take any object; in a real project screens are typed with React Navigation's `NativeStackScreenProps<RootStackParamList, 'List'>`, and then `Detail: { id: string }` stops `tsc` from letting `push('Detail', { task })` through."
    feedback:
      - when: { test: "opening a task pushes Detail with only its id" }
        message:
          uk: "Ця перевірка натискає «Здати книжки в бібліотеку» і чекає, що вгорі стеку — `Detail` з параметрами рівно `{ id: 't-02' }`. Обʼєкт справи чи інші поля в параметрах не проходять."
          en: "This check presses “Return library books” and expects `Detail` on top of the stack with params exactly `{ id: 't-02' }`. The task object or other fields in the params do not pass."
      - when: { test: "after editing, going back shows the new title on the detail screen" }
        message:
          uk: "Ця перевірка змінює назву справи на екрані редагування, зберігає й чекає нову назву на `Detail`. Якщо `Detail` показує стару, він читає копію з параметрів, а не спільний стан."
          en: "This check changes a task's title on the edit screen, saves and expects the new title on `Detail`. If `Detail` shows the old one, it reads a copy from its params instead of the shared state."
      - when: { test: "an unknown id shows the not-found message" }
        message:
          uk: "Ця перевірка відкриває `Detail` з id `t-99` і чекає текст «не знайдено». Якщо всі перевірки падають разом, виправ першу помилку в консолі."
          en: "This check opens `Detail` with the id `t-99` and expects the not-found text. If every check fails at once, fix the first error in the console."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` під час показу `Detail` зазвичай означає, що код читає поле (`title`) у справи, якої не знайдено. Перевір результат `find`, перш ніж його використовувати."
          en: "A `TypeError` while showing `Detail` usually means the code reads a field (`title`) of a task that was not found. Check the result of `find` before using it."

  - id: recall-web-params
    kind: review
    title:
      uk: "Пригадай: параметри маршруту у вебі"
      en: "Recall: route params on the web"
    items:
      - id: web-param-source
        from: re-05-02-params-nested-routes
        prompt:
          uk: "У вебзастосунку маршрут `/tasks/:taskId` показує деталі справи. Звідки екран деталей бере `taskId` і що він робить, коли такої справи немає?"
          en: "In a web app the route `/tasks/:taskId` shows a task's details. Where does the detail screen take `taskId` from, and what does it do when there is no such task?"
        answer:
          type: choice
          options:
            - id: from-url
              text:
                uk: "Читає його з адреси (параметр маршруту — рядок), шукає справу в даних і показує «не знайдено», якщо її немає"
                en: "It reads it from the address (a route param is a string), looks the task up in the data and shows “not found” if there is none"
            - id: from-props
              text:
                uk: "Отримує від списку весь обʼєкт справи через пропси, тож шукати нічого не треба"
                en: "It gets the whole task object from the list through props, so there is nothing to look up"
              why:
                uk: "Адресу можна відкрити напряму, без списку: тоді обʼєкта немає взагалі. Тому параметр — лише id з адреси."
                en: "An address can be opened directly, without the list: then there is no object at all. That is why the param is only the id from the address."
            - id: always-found
              text:
                uk: "Читає його з адреси; справа завжди знайдеться, бо адресу створив сам застосунок"
                en: "It reads it from the address; the task is always found, because the app created the address itself"
              why:
                uk: "Людина може змінити адресу вручну чи відкрити старе посилання на видалену справу. Стан «не знайдено» потрібен завжди."
                en: "A person can edit the address by hand or open an old link to a deleted task. A “not found” state is always needed."
          correct: [from-url]
        explanation:
          uk: "У вебі id у параметрі — природно, бо він живе в адресі. У нативному стеку адреси немає, але правило те саме: передаєш id, шукаєш запис у спільних даних і маєш стан «не знайдено»."
          en: "On the web an id in the param is natural, because it lives in the address. A native stack has no address, but the rule is the same: pass the id, look the record up in shared data and have a “not found” state."

  - id: to-project
    kind: transfer
    capstoneStep: RN-04
    body:
      uk: "У кроці проєкту твої нативні екрани в `~/js-course/<проєкт>-native` стануть стеком зі списком, деталями й редагуванням. Деталі отримуватимуть лише id запису (наприклад, `w-03`, `t-02`, `h-01` чи `e-02`) і шукатимуть його в спільному стані, з окремим станом «не знайдено»."
      en: "In the project step your native screens in `~/js-course/<project>-native` become a stack with list, detail and edit. The detail screen will receive only the record's id (for example `w-03`, `t-02`, `h-01` or `e-02`) and look it up in the shared state, with its own “not found” state."
