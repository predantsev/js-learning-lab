id: re-10-07-independent-pending-error-flow
unit: RE-10
title:
  uk: "Самостійно: чуйний потік очікування й помилок"
  en: "Independent: responsive pending/error flow"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Перевірка без підказок: чи збереш ти сам увесь розділ в одному застосунку — старий код, перенесений у React 19, ліниві деталі з межею лише навколо сторінки, пошук у 5000 записів, що не гальмує набору, невдале завантаження коду зі справжньою повторною спробою й позначки версій для кожного API, — так, щоб приховані перевірки, які друкують з паузами по 30 мс, обривають завантаження коду й порівнюють позначки із запущеним React, не знайшли жодної діри."
  en: "A check without hints: can you put the whole unit together in one app on your own — old code moved to React 19, lazy details with a boundary around the page only, a search over 5,000 records that does not slow typing down, a failed code load with a real retry, and version labels for every API — so that hidden checks which type with 30 ms pauses, break the code load and compare the labels with the running React find no hole?"
objectives:
  - uk: "Без підказок побудувати lazy-маршрут із локальною межею `Suspense`, фільтр у transition з ознакою очікування й шлях помилки з повторною спробою та обґрунтувати кожен сучасний API встановленою версією React."
    en: "Build, without hints, a lazy route with a scoped `Suspense` boundary, a transition filter with a pending indicator and an error path with retry, and justify every modern API against the installed React version."
prerequisites: [re-10-06-debug-misplaced-suspense]
subskills:
  - { family: R-08, skill: "concurrent rendering mental model", depth: assess }
  - { family: R-08, skill: "modern form/action/optimistic APIs awareness", depth: assess }
  - { family: R-08, skill: "compiler and legacy API distinctions", depth: assess }
glossary: []
selfCheck: [catalog-flow]

blocks:
  - id: catalog-flow
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-react
    dir: catalog-flow
    entry: main.jsx
    editable: [main.jsx, App.jsx, ItemCard.jsx, versions.js]
    strings:
      catalogTitle: { uk: "Ідеї подарунків", en: "Gift ideas" }
      mainNav: { uk: "Головне меню", en: "Main menu" }
      allItems: { uk: "Усі ідеї", en: "All ideas" }
      search: { uk: "Пошук", en: "Search" }
      results: { uk: "Результати пошуку", en: "Search results" }
      found: { uk: "Знайдено", en: "Found" }
      query: { uk: "лам", en: "lam" }
      details: { uk: "Подробиці", en: "Details" }
      loadingDetails: { uk: "Завантажую подробиці…", en: "Loading the details…" }
      loadFailed: { uk: "Не вдалося завантажити сторінку.", en: "Could not load the page." }
      tryAgain: { uk: "Спробувати ще раз", en: "Try again" }
      notFound: { uk: "Такої ідеї немає.", en: "There is no such idea." }
      price: { uk: "Ціна", en: "Price" }
      noPrice: { uk: "без ціни", en: "no price" }
      currency: { uk: "грн", en: "UAH" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      mug: { uk: "Термочашка", en: "Travel mug" }
    title:
      uk: "Каталог ідей подарунків: швидкий пошук і надійні подробиці"
      en: "A gift idea catalog: fast search and reliable details"
    instructions:
      uk: |
        Каталог 5000 ідей подарунків перенесли зі старого проєкту на React 19. Зараз він навіть не запускається. Готові й незмінні: маршрутизатор курсу `router.jsx`, історія `history.js` (каталог на `/items`, подробиці на `/items/:id`), дані `catalog.js`, повільний список `CatalogList.jsx` (уже в `memo`, близько 150 мс на рендер), сторінка подробиць `ItemDetails.jsx`, `ErrorBoundary.jsx` (показує `role="alert"` з «Не вдалося завантажити сторінку.» і кнопкою «Спробувати ще раз», що викликає проп `onRetry`) і `slowImport.js` з регулятором `slowly(...)`: затримка 400 мс, а поки `loadControl.failuresLeft` більше нуля — завантаження обривається.

        Змінювати можна `main.jsx`, `App.jsx`, `ItemCard.jsx` і `versions.js`. Готовий застосунок:

        - **запускається** на React, що працює на платформі, і показує заголовок «Ідеї подарунків» та рядок «Знайдено: …»;
        - **пошук**: кожна набрана літера одразу видна в полі; одразу після клавіші на екрані лишаються старі результати, приглушені (прозорість, яку бачить людина, менша за 1); коли набір закінчився, видно відповідні результати без приглушення;
        - **подробиці** (`ItemDetails.jsx`) завантажуються лише на вимогу, через `slowly(...)`; поки код у дорозі, на місці сторінки стоїть повідомлення стану «Завантажую подробиці…», а заголовок і меню лишаються видимими;
        - **невдале завантаження** коду показує `ErrorBoundary` на місці сторінки, заголовок і меню лишаються; «Спробувати ще раз» справді завантажує код знову — з повідомленням стану, поки він у дорозі, — і показує подробиці;
        - **ціна** на сторінці подробиць має одиницю: «Ціна: 80 грн»;
        - **`versionNotes`** у `versions.js` для кожного API цього розділу, яким ти користуєшся, — серед них обов’язково `lazy`, `Suspense`, `createRoot` і той, що робить пошук нетерміновим, — містить першу стабільну версію React, що його має (наприклад, `"17.0.0"`), і запущений React мусить їй відповідати.

        Перевірки друкують у поле з паузами по 30 мс, переходять адресами через `history.push`, обривають одне завантаження коду через `loadControl.failuresLeft` і порівнюють `versionNotes` з `version` з `react`.
      en: |
        A catalog of 5,000 gift ideas was moved from an old project to React 19. Right now it does not even start. Ready-made and unchangeable: the course router `router.jsx`, the history `history.js` (the catalog at `/items`, details at `/items/:id`), the data `catalog.js`, the slow list `CatalogList.jsx` (already in `memo`, about 150 ms per render), the details page `ItemDetails.jsx`, `ErrorBoundary.jsx` (shows `role="alert"` with “Could not load the page.” and a “Try again” button that calls the `onRetry` prop) and `slowImport.js` with the `slowly(...)` control: a 400 ms delay, and while `loadControl.failuresLeft` is above zero, a load breaks off.

        You may change `main.jsx`, `App.jsx`, `ItemCard.jsx` and `versions.js`. The finished app:

        - **starts** on the React running on the platform and shows the heading “Gift ideas” and the line “Found: …”;
        - **search**: every typed letter is visible in the field at once; right after a key the old results stay on the screen, dimmed (the opacity a person sees is below 1); when typing has stopped, the matching results show without dimming;
        - **details** (`ItemDetails.jsx`) are loaded only on demand, through `slowly(...)`; while the code is on its way, the page area shows the status message “Loading the details…”, and the heading and the menu stay visible;
        - **a failed code load** shows `ErrorBoundary` in the page area, while the heading and the menu stay; “Try again” really loads the code again — with a status message while it is on its way — and shows the details;
        - **the price** on the details page has a unit: “Price: 80 UAH”;
        - **`versionNotes`** in `versions.js` holds, for every API of this unit that you use — among them necessarily `lazy`, `Suspense`, `createRoot` and the one that makes the search non-urgent — the first stable React version that has it (for example `"17.0.0"`), and the running React must meet it.

        The checks type into the field with 30 ms pauses, move between addresses through `history.push`, break one code load through `loadControl.failuresLeft` and compare `versionNotes` with `version` from `react`.
    testTitles:
      "the app starts and shows the catalog":
        uk: "Застосунок запускається й показує каталог"
        en: "The app starts and shows the catalog"
      "every typed letter shows in the search field at once":
        uk: "Кожна набрана літера одразу видна в полі пошуку"
        en: "Every typed letter shows in the search field at once"
      "right after a keystroke the old results stay on screen, dimmed":
        uk: "Одразу після клавіші на екрані лишаються старі результати, приглушені"
        en: "Right after a keystroke the old results stay on screen, dimmed"
      "when typing stops, the matching results show without dimming":
        uk: "Коли набір закінчився, видно відповідні результати без приглушення"
        en: "When typing stops, the matching results show without dimming"
      "a failed load of the details code shows an alert with a retry button, and the layout stays":
        uk: "Невдале завантаження коду подробиць показує попередження з кнопкою повтору, а layout лишається"
        en: "A failed load of the details code shows an alert with a retry button, and the layout stays"
      "retrying loads the details, showing a status in the page area meanwhile":
        uk: "Повторна спроба завантажує подробиці, а тим часом на місці сторінки — повідомлення стану"
        en: "Retrying loads the details, showing a status in the page area meanwhile"
      "the details show the price with the currency":
        uk: "Подробиці показують ціну з одиницею"
        en: "The details show the price with the currency"
      "versionNotes give the first React version of every API used, and the running React meets them":
        uk: "`versionNotes` називають першу версію React кожного використаного API, і запущений React їм відповідає"
        en: "`versionNotes` give the first React version of every API used, and the running React meets them"
    solutionNote:
      uk: |
        - `main.jsx`: `ReactDOM.render` прибрано в React 19 — заміна `createRoot(…).render(…)` (з 18.0).
        - Пошук: два стани; текст поля терміновий, запит списку — у `startTransition`, приглушення — від `isPending`. Так само працює `useDeferredValue` із порівнянням `text !== deferred`.
        - Подробиці: `lazy(slowly(() => import("./ItemDetails")))`, межа `Suspense` у сторінці подробиць або навколо `<main>`, але не навколо `Router`.
        - Невдале завантаження: lazy-компонент запам’ятовує помилку, тож «Спробувати ще раз» створює **новий** lazy-компонент і дає `ErrorBoundary` новий `key`.
        - `ItemCard`: `defaultProps` у функціях React 19 мовчки ігнорує — значення за замовчуванням іде в параметр.
        - `versionNotes`: `lazy` і `Suspense` — 16.6.0, `createRoot`, `useTransition`, `startTransition`, `useDeferredValue` — 18.0.0; запущений React 19.3.0 відповідає всім.
      en: |
        - `main.jsx`: `ReactDOM.render` was removed in React 19 — the replacement is `createRoot(…).render(…)` (since 18.0).
        - Search: two pieces of state; the field's text is urgent, the list's query goes inside `startTransition`, the dimming depends on `isPending`. `useDeferredValue` with a `text !== deferred` comparison works the same way.
        - Details: `lazy(slowly(() => import("./ItemDetails")))`, a `Suspense` boundary in the details page or around `<main>`, but not around `Router`.
        - Failed load: a lazy component remembers its error, so “Try again” creates a **new** lazy component and gives `ErrorBoundary` a new `key`.
        - `ItemCard`: React 19 silently ignores `defaultProps` on functions — the default value goes into the parameter.
        - `versionNotes`: `lazy` and `Suspense` are 16.6.0; `createRoot`, `useTransition`, `startTransition`, `useDeferredValue` are 18.0.0; the running React 19.3.0 meets them all.
    feedback:
      - when: { test: "the app starts and shows the catalog" }
        message:
          uk: "Ця перевірка чекає заголовок «Ідеї подарунків» і рядок «Знайдено: 5000». Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі — застосунок має взагалі запуститися на React, що працює на платформі."
          en: "This check expects the heading “Gift ideas” and the line “Found: 5000”. If every check fails at once, fix the first error in the console first — the app has to start at all on the React running on the platform."
      - when: { test: "every typed letter shows in the search field at once" }
        message:
          uk: "Ця перевірка друкує «лам» по одній літері й одразу після кожної чекає її в полі."
          en: "This check types “lam” one letter at a time and right after each one expects it in the field."
      - when: { test: "right after a keystroke the old results stay on screen, dimmed" }
        message:
          uk: "Ця перевірка очищає поле, чекає повного списку, друкує одну літеру й одразу чекає старий рядок «Знайдено: 5000» і прозорість результатів менше за 1."
          en: "This check clears the field, waits for the full list, types one letter and right away expects the old line “Found: 5000” and a results opacity below 1."
      - when: { test: "when typing stops, the matching results show without dimming" }
        message:
          uk: "Ця перевірка друкує «лам» і чекає до трьох секунд на рядок «Знайдено: …» для «лам» і прозорість результатів 1."
          en: "This check types “lam” and waits up to three seconds for the “Found: …” line for “lam” and a results opacity of 1."
      - when: { test: "a failed load of the details code shows an alert with a retry button, and the layout stays" }
        message:
          uk: "Ця перевірка ставить `loadControl.failuresLeft = 1`, відкриває `/items/c-7` і чекає видиме попередження «Не вдалося завантажити сторінку.» та видимі заголовок і меню. Код подробиць має йти через `slowly(...)`."
          en: "This check sets `loadControl.failuresLeft = 1`, opens `/items/c-7` and expects a visible alert “Could not load the page.” plus a visible heading and menu. The details code has to go through `slowly(...)`."
      - when: { test: "retrying loads the details, showing a status in the page area meanwhile" }
        message:
          uk: "Ця перевірка натискає «Спробувати ще раз» після обірваного завантаження, одразу чекає видиме повідомлення стану «Завантажую подробиці…» при видимих заголовку й меню, а потім — подробиці ідеї c-7."
          en: "This check presses “Try again” after the broken load, right away expects a visible status message “Loading the details…” with the heading and the menu visible, and then the details of idea c-7."
      - when: { test: "the details show the price with the currency" }
        message:
          uk: "Ця перевірка відкриває подробиці ідеї c-7 і чекає текст «Ціна: 80 грн»."
          en: "This check opens the details of idea c-7 and expects the text “Price: 80 UAH”."
      - when: { test: "versionNotes give the first React version of every API used, and the running React meets them" }
        message:
          uk: "Ця перевірка чекає в `versionNotes` записи для `lazy`, `Suspense`, `createRoot` і щонайменше одного з `useTransition`, `startTransition`, `useDeferredValue`; для відомих їй API порівнює мажорну й мінорну частини з першою стабільною версією React, а кожну позначку — із запущеною версією."
          en: "This check expects `versionNotes` entries for `lazy`, `Suspense`, `createRoot` and at least one of `useTransition`, `startTransition`, `useDeferredValue`; for the APIs it knows it compares the major and minor parts with the first stable React version, and every label with the running version."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: що ловить error boundary"
      en: "Recall: what an error boundary catches"
    items:
      - id: boundary-catches-render
        from: re-05-07-error-boundaries-limits
        prompt:
          uk: "Яку з цих помилок перехопить error boundary, що обгортає компонент?"
          en: "Which of these errors will an error boundary wrapping the component catch?"
        answer:
          type: choice
          options:
            - id: render
              text: { uk: "Помилку, кинуту під час рендеру — зокрема lazy-компонентом, чий `import()` відхилено", en: "An error thrown during render — including by a lazy component whose `import()` was rejected" }
            - id: click
              text: { uk: "Помилку в обробнику кліку", en: "An error in a click handler" }
              why:
                uk: "Обробник виконується поза рендером, тож boundary його помилки не бачить — там потрібні `try`/`catch` і стан помилки."
                en: "A handler runs outside render, so the boundary does not see its errors — that needs `try`/`catch` and error state."
            - id: timer
              text: { uk: "Помилку в callback `setTimeout`", en: "An error in a `setTimeout` callback" }
              why:
                uk: "Таймер теж спрацьовує поза рендером: його помилка стає звичайною неперехопленою помилкою."
                en: "A timer also fires outside render: its error becomes an ordinary uncaught error."
          correct: [render]
        explanation:
          uk: "Error boundary бачить лише помилки рендеру й ефектів своїх дітей. Невдалий lazy-імпорт кидає помилку саме під час рендеру — тому межа помилок поруч із `Suspense` і перехоплює обірване завантаження коду."
          en: "An error boundary sees only errors of its children's render and effects. A failed lazy import throws exactly during render — which is why an error boundary next to `Suspense` catches a broken code load."
