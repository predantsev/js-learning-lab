id: re-10-04-modern-form-actions-awareness
unit: RE-10
title:
  uk: "Огляд: form actions і оптимістичні API"
  en: "Awareness: form actions and optimistic APIs"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Прочитати форму React 19 з функцією-action, `useActionState` і `useOptimistic` та зіставити кожну її частину з ручним шаблоном із RE-06."
    en: "Read a React 19 form that uses an action function, `useActionState` and `useOptimistic`, and map each part to the manual pattern built in RE-06."
  - uk: "Позначити кожен API версією React, у якій він з’явився, і звірити цю позначку зі встановленою в проєкті версією, перш ніж ним користуватися."
    en: "Label each API with the React version that ships it and check that label against the project's installed version before using it."
prerequisites: [re-10-03-concurrent-model, re-06-06-optimistic-rollback, re-05-03-forms-controlled-uncontrolled]
subskills:
  - { family: R-08, skill: "modern form/action/optimistic APIs awareness", depth: intro }
glossary: [form-action, use-action-state, use-optimistic, version-label]
selfCheck: [predict-refused-action, task-toggle]

blocks:
  - id: same-pattern-new-names
    kind: explanation
    title:
      uk: "Той самий шаблон — нові назви"
      en: "The same pattern, new names"
    body:
      uk: |
        У RE-06 ти будував [[optimistic-update|оптимістичне оновлення]] вручну: запам’ятати старе значення, одразу показати нове, надіслати запит, а при відмові — повернути старе й повідомити людину. React 19 дає для цього три готові частини:

        | Вручну (RE-06) | React 19 |
        |---|---|
        | обробник `onSubmit` з `preventDefault()` | [[form-action\|form action]]: `<form action={renameAction}>` — React сам перехоплює надсилання й передає функції `FormData` |
        | стан `saving` і `setSaving(true/false)` | `isPending` з [[use-action-state\|useActionState]] |
        | повідомлення про помилку в окремому стані | те, що action **повертає**, стає станом з `useActionState` |
        | показати нове значення одразу, при відмові повернути старе | [[use-optimistic\|useOptimistic]]: тимчасове значення живе, лише поки action працює, а потім React показує справжній стан |

        Ось перейменування звички:

        ```jsx
        const [name, setName] = useState("Читати");
        const [shownName, setShownName] = useOptimistic(name);
        const [error, renameAction, isPending] = useActionState(async (previousError, formData) => {
          const next = formData.get("name");
          setShownName(next);
          try {
            setName(await saveName(next));
            return null;
          } catch {
            return "Не вдалося зберегти";
          }
        }, null);
        // <form action={renameAction}><h2>{shownName}</h2><input name="name" />…</form>
        ```

        Відкат тут робить React: коли action закінчився, `shownName` знову дорівнює `name`. А от **повідомлення про відмову** — досі твоя справа: без `return` з текстом помилки заголовок просто мовчки повернеться до старої назви.
      en: |
        In RE-06 you built an [[optimistic-update]] by hand: remember the old value, show the new one at once, send the request, and on refusal put the old one back and tell the person. React 19 gives three ready-made parts for this:

        | By hand (RE-06) | React 19 |
        |---|---|
        | an `onSubmit` handler with `preventDefault()` | a [[form-action]]: `<form action={renameAction}>` — React intercepts the submission itself and passes the function a `FormData` |
        | a `saving` state and `setSaving(true/false)` | `isPending` from [[use-action-state\|useActionState]] |
        | an error message in its own state | whatever the action **returns** becomes the state from `useActionState` |
        | show the new value at once, put the old one back on refusal | [[use-optimistic\|useOptimistic]]: the temporary value lives only while the action runs, and then React shows the real state |

        Here is a habit rename:

        ```jsx
        const [name, setName] = useState("Read");
        const [shownName, setShownName] = useOptimistic(name);
        const [error, renameAction, isPending] = useActionState(async (previousError, formData) => {
          const next = formData.get("name");
          setShownName(next);
          try {
            setName(await saveName(next));
            return null;
          } catch {
            return "Could not save";
          }
        }, null);
        // <form action={renameAction}><h2>{shownName}</h2><input name="name" />…</form>
        ```

        The rollback here is done by React: when the action has finished, `shownName` equals `name` again. But the **message about the refusal** is still your job: without a `return` with the error text, the heading just quietly goes back to the old name.

  - id: predict-refused-action
    kind: prediction
    lang: jsx
    runnable: false
    strings:
      saveFailed: { uk: "Не вдалося зберегти", en: "Could not save" }
    prompt:
      uk: "Заголовок показує «Читати». Людина вводить «Читати 30 хвилин» і натискає «Перейменувати», а сервер через 400 мс **відмовляє**. Що показує заголовок, поки сервер думає, і що — після відмови?"
      en: "The heading shows “Read”. The person enters “Read for 30 minutes” and presses “Rename”, and 400 ms later the server **refuses**. What does the heading show while the server is thinking, and what after the refusal?"
    code: |
      const [name, setName] = useState("…");
      const [shownName, setShownName] = useOptimistic(name);
      const [error, renameAction, isPending] = useActionState(async (previous, formData) => {
        const next = formData.get("name");
        setShownName(next);
        try {
          setName(await saveName(next));
          return null;
        } catch {
          return "%%saveFailed%%";
        }
      }, null);
      // <h2>{shownName}</h2>
      // {error !== null && <p role="alert">{error}</p>}
    answer:
      type: choice
      options:
        - id: new-then-old
          text: { uk: "Поки чекає — нова назва; після відмови — знову «Читати» і повідомлення «Не вдалося зберегти»", en: "While waiting, the new name; after the refusal, “Read” again plus the message “Could not save”" }
        - id: stays-new
          text: { uk: "Поки чекає — нова назва, і після відмови вона лишається: оптимістичне значення вже показано", en: "While waiting, the new name, and after the refusal it stays: the optimistic value has already been shown" }
          why:
            uk: "Оптимістичне значення живе, лише поки action працює. Після відмови `setName` так і не викликався, тож `name` лишився старим, і `shownName` повертається до нього."
            en: "The optimistic value lives only while the action runs. After the refusal `setName` was never called, so `name` stayed the old one, and `shownName` returns to it."
        - id: waits
          text: { uk: "Поки чекає — «Читати»: заголовок зміниться, лише коли сервер погодиться", en: "While waiting, “Read”: the heading changes only when the server agrees" }
          why:
            uk: "Так було б без `useOptimistic`. `setShownName(next)` показує нову назву одразу, ще до відповіді сервера."
            en: "That is what would happen without `useOptimistic`. `setShownName(next)` shows the new name at once, before the server answers."
        - id: silent
          text: { uk: "Після відмови — «Читати» без жодного повідомлення: `useOptimistic` сам усе прибрав", en: "After the refusal, “Read” with no message at all: `useOptimistic` cleaned everything up itself" }
          why:
            uk: "`useOptimistic` повертає стару назву, але нічого не повідомляє. Повідомлення тут є лише тому, що `catch` повертає його текст, і `useActionState` робить цей текст станом `error`."
            en: "`useOptimistic` brings the old name back but announces nothing. The message exists here only because `catch` returns its text, and `useActionState` turns that text into the `error` state."
      correct: [new-then-old]
    explanation:
      uk: "Ми запустили цей самий компонент у пісочниці із сервером, що відмовляє: одразу після кліку заголовок показав нову назву й «(зберігаю…)», через 400 мс — стару назву й повідомлення в `role=\"alert\"`. Оптимістичне значення зникає саме собою, а повідомлення з’являється лише тому, що action його повернув."
      en: "We ran this same component in the sandbox with a refusing server: right after the click the heading showed the new name and “(saving…)”, after 400 ms the old name and the message in `role=\"alert\"`. The optimistic value disappears by itself, and the message appears only because the action returned it."

  - id: habit-action
    kind: example
    runtime: browser-react
    dir: habit-action
    entry: main.jsx
    strings:
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      newName: { uk: "Нова назва", en: "New name" }
      rename: { uk: "Перейменувати", en: "Rename" }
      saving: { uk: "зберігаю…", en: "saving…" }
      saveFailed: { uk: "Не вдалося зберегти — спробуй ще раз.", en: "Could not save — try again." }
      serverRefuses: { uk: "Сервер відмовляє", en: "The server refuses" }
      runningReact: { uk: "Працює React", en: "Running React" }
    title:
      uk: "Перейменування звички: action, useActionState і useOptimistic"
      en: "Renaming a habit: an action, useActionState and useOptimistic"
    body:
      uk: |
        Форма перейменування має `action`, тож React сам перехоплює надсилання й передає функції `FormData` з полем `name`. `server.js` — уявний сервер: відповідає за 400 мс, а з галочкою «Сервер відмовляє» кидає помилку.

        Перший рядок коду `App.jsx` — **позначка версії**: коментар, з якої версії React цей файл працює. Унизу сторінки видно, який React справді запущено.

        Натисни **Запустити**, введи нову назву й натисни «Перейменувати». Консоль друкує `name`, `shown` і `pending` на кожен рендер — простеж, як вони змінюються.
      en: |
        The rename form has an `action`, so React intercepts the submission itself and passes the function a `FormData` with the `name` field. `server.js` is a pretend server: it answers in 400 ms, and with the “The server refuses” checkbox ticked it throws an error.

        The first line of code in `App.jsx` is a **version label**: a comment saying from which React version this file works. The bottom of the page shows which React is actually running.

        Press **Run**, enter a new name and press “Rename”. The console prints `name`, `shown` and `pending` on every render — follow how they change.
    tryIt:
      uk: |
        1. Постав галочку «Сервер відмовляє», введи нову назву й натисни «Перейменувати». Заголовок одразу показує нову назву з «(зберігаю…)», а через 400 мс повертається стара й з’являється повідомлення. У консолі видно: `name` увесь час лишався старим.
        2. Подивись на поле: після відмови в ньому знову стара назва, а введений текст зник. Після кожного завершеного action — навіть такого, що повернув текст помилки, — React 19 скидає неконтрольовані поля форми до `defaultValue`. Якщо текст треба зберегти для повторної спроби, action має повернути його разом із помилкою.
        3. Зніми галочку й перейменуй знову. Поки сервер думає, старе повідомлення ще видно: стан `useActionState` змінюється, лише коли новий action щось повернув. Після успіху повідомлення зникає, бо action повернув `null`.
        4. У `catch` заміни `return "Не вдалося зберегти — спробуй ще раз.";` на `return null;`, запусти й повтори крок 1. Назва так само повертається, але людина не дізнається чому — оптимістичний API помилку не повідомляє. Поверни текст.
      en: |
        1. Tick “The server refuses”, enter a new name and press “Rename”. The heading shows the new name with “(saving…)” at once, and after 400 ms the old one comes back and a message appears. The console shows that `name` stayed the old one all along.
        2. Look at the field: after the refusal it holds the old name again, and the typed text is gone. After every finished action — even one that returned an error text — React 19 resets the form's uncontrolled fields to their `defaultValue`. If the text has to be kept for another attempt, the action must return it together with the error.
        3. Untick the box and rename again. While the server is thinking, the old message is still visible: the `useActionState` state changes only when a new action has returned something. After a success the message disappears, because the action returned `null`.
        4. In `catch` replace `return "Could not save — try again.";` with `return null;`, run and repeat step 1. The name still goes back, but the person never learns why — an optimistic API does not announce errors. Put the text back.

  - id: version-labels
    kind: explanation
    title:
      uk: "Позначка версії: перевір, перш ніж користуватися"
      en: "A version label: check before you use"
    body:
      uk: |
        У туторіалах React з різних років трапляються різні API. Те, що працює в статті, може не існувати у твоєму проєкті. Тому біля сучасного API варто тримати [[version-label|позначку версії]] — з якої версії React він є:

        | API | Уперше в стабільному React |
        |---|---|
        | `lazy`, `Suspense` для коду | 16.6.0 (жовтень 2018) |
        | `useTransition`, `startTransition` | 18.0.0 (березень 2022) |
        | form actions, `useActionState`, `useOptimistic`, `use` | 19.0.0 (грудень 2024) |

        Звіряй позначку зі **встановленою** версією, а не з рядком у `package.json`. Готуючи цей урок (вересень 2026), ми створили новий проєкт через `npm create vite@latest`: у його `package.json` стоїть `"react": "^19.2.8"`, а `npm ls react` показав, що встановлено інше:

        ```text
        re10-vite@0.0.0 …
        ├─┬ react-dom@19.3.0
        │ └── react@19.3.0 deduped
        └── react@19.3.0
        ```

        `^19.2.8` дозволяє будь-яку 19.x, не нижчу за 19.2.8, — тож справжню версію каже лише `npm ls react`. У коді те саме число дає `import { version } from "react"`: на платформі це `19.3.0`.
      en: |
        React tutorials from different years use different APIs. What works in an article may not exist in your project. So next to a modern API it pays to keep a [[version-label]] — from which React version it exists:

        | API | First in stable React |
        |---|---|
        | `lazy`, `Suspense` for code | 16.6.0 (October 2018) |
        | `useTransition`, `startTransition` | 18.0.0 (March 2022) |
        | form actions, `useActionState`, `useOptimistic`, `use` | 19.0.0 (December 2024) |

        Check the label against the **installed** version, not against the line in `package.json`. While preparing this lesson (September 2026), we created a new project with `npm create vite@latest`: its `package.json` says `"react": "^19.2.8"`, and `npm ls react` showed that something else is installed:

        ```text
        re10-vite@0.0.0 …
        ├─┬ react-dom@19.3.0
        │ └── react@19.3.0 deduped
        └── react@19.3.0
        ```

        `^19.2.8` allows any 19.x not lower than 19.2.8 — so only `npm ls react` tells the real version. In code the same number comes from `import { version } from "react"`: on the platform it is `19.3.0`.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: відкат вручну"
      en: "Recall: rollback by hand"
    items:
      - id: rollback-one-record
        from: re-06-06-optimistic-rollback
        prompt:
          uk: "Людина оптимістично позначила справу A виконаною. Поки запит у дорозі, вона перейменувала справу B. Потім сервер відмовив щодо A. Що має повернути відкат?"
          en: "A person optimistically marked task A as done. While the request was on its way, they renamed task B. Then the server refused the change to A. What should the rollback restore?"
        answer:
          type: choice
          options:
            - id: only-a
              text: { uk: "Лише статус справи A; нова назва B лишається", en: "Only task A's status; B's new name stays" }
            - id: whole-list
              text: { uk: "Увесь список, збережений перед кліком по A", en: "The whole list saved before the click on A" }
              why:
                uk: "Збережений список ще не знає про нову назву B — його повернення стерло б зміну, яку сервер не відхиляв."
                en: "The saved list does not know about B's new name yet — restoring it would wipe out a change the server never refused."
            - id: nothing
              text: { uk: "Нічого: на екрані вже нове значення, отже сервер його прийняв", en: "Nothing: the screen already shows the new value, so the server must have accepted it" }
              why:
                uk: "Оптимістичне значення — лише обіцянка. Сервер відмовив, тож на екрані має бути те, що справді збережено, і пояснення, чому зміна не вдалася."
                en: "An optimistic value is only a promise. The server refused, so the screen must show what is really saved, plus an explanation of why the change failed."
          correct: [only-a]
        explanation:
          uk: "Відкат стосується лише того запису, щодо якого прийшла відмова. `useOptimistic` робить саме так: тимчасове значення накладається на справжній стан, і після action React просто показує справжній стан — разом з усіма іншими змінами, що сталися тим часом."
          en: "A rollback concerns only the record that was refused. `useOptimistic` works exactly like that: the temporary value is laid over the real state, and after the action React simply shows the real state — together with every other change that happened meanwhile."

  - id: task-toggle
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: task-toggle
    entry: main.jsx
    editable: [TaskToggle.jsx]
    strings:
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      done: { uk: "виконано", en: "done" }
      pending: { uk: "не виконано", en: "not done" }
      saving: { uk: "Зберігаю…", en: "Saving…" }
      saveFailed: { uk: "Сервер не зберіг зміну. Спробуй ще раз.", en: "The server did not save the change. Try again." }
    title:
      uk: "Оптимістична справа з позначкою версії"
      en: "An optimistic task with a version label"
    instructions:
      uk: |
        `TaskToggle` уже надсилає форму через `useActionState`, але кнопка змінюється лише після відповіді сервера (300 мс), а відмову мовчки ковтає. Зміни `TaskToggle.jsx`:

        - після кліку кнопка **одразу** показує новий статус — через `useOptimistic`;
        - якщо сервер відмовив, кнопка знову показує старий статус, а `<p role="alert">` повідомляє «Сервер не зберіг зміну. Спробуй ще раз.»;
        - якщо сервер погодився, новий статус лишається;
        - `REQUIRES_REACT` — позначка версії: найменша версія React, у якій працює твій файл, текстом (наприклад, `"17.0.0"`).

        Перевірки вмикають і вимикають відмову через `server.refuse` у `server.js` і порівнюють `REQUIRES_REACT` з версією, що справді запущена.
      en: |
        `TaskToggle` already submits the form through `useActionState`, but the button changes only after the server answers (300 ms), and a refusal is silently swallowed. Change `TaskToggle.jsx`:

        - after a click the button shows the new status **at once** — through `useOptimistic`;
        - if the server refused, the button shows the old status again, and a `<p role="alert">` announces “The server did not save the change. Try again.”;
        - if the server agreed, the new status stays;
        - `REQUIRES_REACT` is the version label: the lowest React version your file works with, as text (for example `"17.0.0"`).

        The checks switch the refusal on and off through `server.refuse` in `server.js` and compare `REQUIRES_REACT` with the version that is actually running.
    testTitles:
      "a click shows the new status at once":
        uk: "Клік одразу показує новий статус"
        en: "A click shows the new status at once"
      "a refused save shows the old status again and announces why":
        uk: "Після відмови видно старий статус і повідомлення про причину"
        en: "A refused save shows the old status again and announces why"
      "an accepted save keeps the new status":
        uk: "Після згоди сервера новий статус лишається"
        en: "An accepted save keeps the new status"
      "REQUIRES_REACT names the first version with useOptimistic, and the running React meets it":
        uk: "`REQUIRES_REACT` називає першу версію з `useOptimistic`, і запущений React їй відповідає"
        en: "`REQUIRES_REACT` names the first version with `useOptimistic`, and the running React meets it"
    hints:
      nudge:
        uk: "Що має показувати кнопка — справжній стан чи тимчасове значення, яке живе, поки action працює? І що action має повернути, коли сервер відмовив?"
        en: "What should the button show — the real state or a temporary value that lives while the action runs? And what should the action return when the server has refused?"
      explanation:
        uk: |
          `useOptimistic(value)` повертає пару: значення для показу й функцію, що підміняє його на час action. Кнопка й прихований `next` мають читати саме це значення. Справжній стан змінюй лише після того, як сервер погодився. Те, що action повертає, стає першим елементом `useActionState`, — поверни текст помилки в `catch` і покажи його в `role="alert"`. Схожий приклад:

          ```jsx
          const [shownLiked, setShownLiked] = useOptimistic(liked);
          // усередині action: setShownLiked(true); … return "текст помилки";
          ```

          Позначку версії шукай у таблиці цього уроку.
        en: |
          `useOptimistic(value)` returns a pair: the value to show and a function that replaces it for the duration of an action. The button and the hidden `next` must read exactly that value. Change the real state only after the server has agreed. Whatever the action returns becomes the first item of `useActionState` — return the error text in `catch` and show it in `role="alert"`. A similar example:

          ```jsx
          const [shownLiked, setShownLiked] = useOptimistic(liked);
          // inside the action: setShownLiked(true); … return "error text";
          ```

          Look up the version label in this lesson's table.
    solutionNote:
      uk: "Кнопка читає оптимістичне значення, тож нова позначка з’являється до відповіді сервера. Справжній `done` змінюється лише після згоди, тому після відмови React показує старий стан сам. Повідомлення не з’являється само: його повертає `catch`, а `role=\"alert\"` змушує програму екранного читання його оголосити. `useOptimistic` і `useActionState` з’явилися в React 19.0.0 — це й позначка версії; запущений тут React 19.3.0 її задовольняє."
      en: "The button reads the optimistic value, so the new mark appears before the server answers. The real `done` changes only after the server agrees, so after a refusal React shows the old state by itself. The message does not appear by itself: `catch` returns it, and `role=\"alert\"` makes a screen reader announce it. `useOptimistic` and `useActionState` arrived in React 19.0.0 — that is the version label; the React 19.3.0 running here satisfies it."
    feedback:
      - when: { test: "a click shows the new status at once" }
        message:
          uk: "Ця перевірка клікає «Здати книжки в бібліотеку: не виконано» й одразу, ще до відповіді сервера, чекає «… виконано». Кнопка має показувати значення з `useOptimistic`, а action — підміняти його до `await`. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check clicks “Return library books: not done” and right away, before the server answers, expects “… done”. The button must show the value from `useOptimistic`, and the action must replace it before the `await`. If every check fails at once, fix the first error in the console first."
      - when: { test: "a refused save shows the old status again and announces why" }
        message:
          uk: "Ця перевірка вмикає відмову, клікає й чекає кінця збереження. Тоді кнопка має бути такою, як до кліку, а `role=\"alert\"` — містити «Сервер не зберіг зміну. Спробуй ще раз.». Якщо лишився новий статус, справжній стан змінено ще до відповіді сервера. Якщо немає повідомлення, action має повернути його текст у `catch`."
          en: "This check switches the refusal on, clicks and waits for the save to finish. Then the button must look as it did before the click, and `role=\"alert\"` must contain “The server did not save the change. Try again.”. If the new status remained, the real state was changed before the server answered. If there is no message, the action has to return its text in `catch`."
      - when: { test: "an accepted save keeps the new status" }
        message:
          uk: "Ця перевірка клікає при згоді сервера, чекає кінця збереження й чекає протилежний статус. Справжній стан має змінитися після успішного `await`, інакше після action React поверне старе значення."
          en: "This check clicks while the server agrees, waits for the save to finish and expects the opposite status. The real state must change after a successful `await`, otherwise React brings back the old value after the action."
      - when: { test: "REQUIRES_REACT names the first version with useOptimistic, and the running React meets it" }
        message:
          uk: "Ця перевірка чекає в `REQUIRES_REACT` текст `\"19.0.0\"` (або `\"19\"` чи `\"19.0\"`) — версію, у якій уперше з’явилися `useOptimistic` і `useActionState`, — і порівнює її із запущеним React."
          en: "This check expects `REQUIRES_REACT` to hold the text `\"19.0.0\"` (or `\"19\"` or `\"19.0\"`) — the version in which `useOptimistic` and `useActionState` first appeared — and compares it with the running React."

  - id: to-project
    kind: transfer
    capstoneStep: RE-10
    body:
      uk: "Перш ніж додати в проєкт сучасний API з туторіалу, запусти `npm ls react` у теці проєкту й порівняй версію з позначкою API. Якщо проєкт на React 19, оптимістичну зміну з кроку про асинхронні дані (у витратах — видалення) можна переписати через `useOptimistic` — але повідомлення про відмову лишається твоїм обов’язком."
      en: "Before adding a modern API from a tutorial to your project, run `npm ls react` in the project folder and compare the version with the API's label. If the project is on React 19, the optimistic change of the async data step (a removal in the expense tracker) can be rewritten with `useOptimistic` — but announcing a refusal stays your job."
