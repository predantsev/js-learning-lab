id: re-10-01-lazy-suspense
unit: RE-10
title:
  uk: "lazy і Suspense"
  en: "lazy and Suspense"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Винести компонент маршруту в окремий модуль через `lazy(() => import(...))` і поставити межу `Suspense` так, щоб запасний вміст показувала лише та ділянка, чий код завантажується."
    en: "Split a route component with `lazy(() => import(...))` and place a `Suspense` boundary so only that region shows a fallback while its code loads."
  - uk: "Назвати, що справді може призупинити рендер (код через `lazy`, джерела даних із підтримкою Suspense, `use()` із промісом, створеним поза рендером, у React 19), і пояснити, чому `fetch` в ефекті ніколи не призупиняє."
    en: "Name the supported sources of suspension (lazy code, Suspense-enabled data sources, `use()` with a promise created outside render in React 19) and explain why a fetch inside an effect never suspends."
prerequisites: [js-07-07-live-bindings-dynamic-import, re-05-01-routing-basics, re-06-03-loading-retry]
subskills:
  - { family: R-08, skill: "Suspense supported data/code patterns", depth: intro }
glossary: [lazy-component, suspense-boundary, suspense-fallback]
selfCheck: [predict-root-boundary, predict-effect-fetch, lazy-category-totals]

blocks:
  - id: code-that-arrives-later
    kind: explanation
    title:
      uk: "Код, який приходить пізніше"
      en: "Code that arrives later"
    body:
      uk: |
        У JS-07 ти завантажував рідко потрібний модуль через `import()`: він одразу повертає проміс, а модуль приходить пізніше. React уміє робити те саме з компонентом:

        ```jsx
        import { lazy, Suspense } from "react";

        const HelpPage = lazy(() => import("./HelpPage"));
        ```

        `HelpPage` — це [[lazy-component|lazy-компонент]]. Поки його ніхто не рендерить, файл `HelpPage.jsx` не завантажується. Щойно React уперше доходить до `<HelpPage />`, він викликає функцію з `import()`. Модуля ще немає — і React **призупиняє** (suspends) цю частину рендеру.

        Що ж показати, поки код у дорозі? Це вирішує [[suspense-boundary|межа Suspense]]:

        ```jsx
        <Suspense fallback={<p role="status">Завантажую довідку…</p>}>
          <HelpPage />
        </Suspense>
        ```

        Поки щось усередині межі призупинене, на її місці стоїть [[suspense-fallback|запасний вміст]] із `fallback`. Коли модуль прийшов, React рендерить ще раз і показує справжній вміст. Усе, що **поза** межею, тим часом лишається на екрані.

        Оголошуй lazy-компонент на верхньому рівні модуля, а не всередині іншого компонента: інакше кожен рендер створює новий lazy-компонент — React знову викликає `import()`, ділянка знову призупиняється, а стан усередині неї скидається.
      en: |
        In JS-07 you loaded a rarely needed module with `import()`: it returns a promise at once, and the module arrives later. React can do the same with a component:

        ```jsx
        import { lazy, Suspense } from "react";

        const HelpPage = lazy(() => import("./HelpPage"));
        ```

        `HelpPage` is a [[lazy-component]]. As long as nobody renders it, the file `HelpPage.jsx` is not loaded. The moment React first reaches `<HelpPage />`, it calls the function with `import()`. The module is not there yet — so React **suspends** that part of the render.

        So what should be shown while the code is on its way? A [[suspense-boundary]] decides:

        ```jsx
        <Suspense fallback={<p role="status">Loading help…</p>}>
          <HelpPage />
        </Suspense>
        ```

        While something inside the boundary is suspended, its place is taken by the [[suspense-fallback|fallback]] from `fallback`. When the module has arrived, React renders again and shows the real content. Everything **outside** the boundary stays on the screen meanwhile.

        Declare a lazy component at the top level of a module, not inside another component: otherwise every render creates a new lazy component — React calls `import()` again, the region suspends again, and the state inside it is reset.

  - id: predict-root-boundary
    kind: prediction
    lang: jsx
    runnable: false
    strings:
      loading: { uk: "Завантажую…", en: "Loading…" }
    prompt:
      uk: "Застосунок відкрито на списку `/items`: видно заголовок, меню й список бажань. Людина клікає посилання на `/stats`, а код `StatsPanel.jsx` іде одну секунду. Межа `Suspense` у застосунку одна — у `App`. Що видно на екрані протягом цієї секунди?"
      en: "The app is open at the list `/items`: the heading, the menu and the wish list are visible. The person clicks the link to `/stats`, and the code of `StatsPanel.jsx` takes one second to arrive. The app has a single `Suspense` boundary — in `App`. What is on the screen during that second?"
    code: |
      const StatsPanel = lazy(() => import("./StatsPanel"));

      function Layout() {
        return (
          <div>
            <h1>…</h1>
            <nav>…</nav>
            <main>
              <Outlet />
            </main>
          </div>
        );
      }

      export default function App() {
        return (
          <Suspense fallback={<p role="status">%%loading%%</p>}>
            <Router history={history}>
              <Routes routes={routes} />
            </Router>
          </Suspense>
        );
      }
    answer:
      type: choice
      options:
        - id: only-fallback
          text: { uk: "Лише «Завантажую…»: заголовок, меню й список зникли", en: "Only “Loading…”: the heading, the menu and the list are gone" }
        - id: layout-stays
          text: { uk: "Заголовок і меню лишаються, а «Завантажую…» стоїть замість списку", en: "The heading and the menu stay, and “Loading…” stands in place of the list" }
          why:
            uk: "Так було б, якби межа стояла навколо `<Outlet />`. Запасний вміст займає місце **всієї** найближчої межі, а тут вона обгортає весь застосунок."
            en: "That is what would happen if the boundary stood around `<Outlet />`. The fallback takes the place of the **whole** nearest boundary, and here it wraps the whole app."
        - id: list-stays
          text: { uk: "Список лишається, доки панель не готова, а «Завантажую…» не з’являється взагалі", en: "The list stays until the panel is ready, and “Loading…” never appears" }
          why:
            uk: "Межа є, і вона показує свій `fallback`, щойно щось усередині призупинилося. Старий екран лишився б, наприклад, якби над lazy-компонентом не було жодної межі, але тут вона є."
            en: "There is a boundary, and it shows its `fallback` as soon as something inside it suspends. The old screen would stay, for example, if there were no boundary at all above the lazy component, but here there is one."
        - id: error
          text: { uk: "Картка помилки: компонент не можна рендерити, поки його код не прийшов", en: "An error card: a component cannot be rendered before its code has arrived" }
          why:
            uk: "Призупинення — не помилка. React чекає на модуль, показує `fallback` найближчої межі й рендерить ще раз, коли код прийде."
            en: "Suspending is not an error. React waits for the module, shows the nearest boundary's `fallback` and renders again when the code arrives."
      correct: [only-fallback]
    explanation:
      uk: "`StatsPanel` призупиняє рендер, і React іде вгору деревом до найближчого `Suspense`. Тут це межа навколо всього застосунку, тож на секунду замість заголовка, меню й списку видно лише «Завантажую…». Перевірено в пісочниці на прикладі цього уроку. Старий вміст навіть не видаляється: React ховає його стилем `display: none`, а потім показує знову."
      en: "`StatsPanel` suspends the render, and React walks up the tree to the nearest `Suspense`. Here that is the boundary around the whole app, so for a second only “Loading…” is visible instead of the heading, the menu and the list. Checked in the sandbox with this lesson's example. The old content is not even removed: React hides it with the style `display: none` and shows it again afterwards."

  - id: totals-route
    kind: example
    runtime: browser-react
    dir: totals-route
    entry: main.jsx
    strings:
      myWishes: { uk: "Мої бажання", en: "My wishes" }
      mainNav: { uk: "Головне меню", en: "Main menu" }
      list: { uk: "Список", en: "List" }
      totals: { uk: "Підсумки", en: "Totals" }
      loading: { uk: "Завантажую…", en: "Loading…" }
      wantedTotal: { uk: "Сума бажаного", en: "Wanted total" }
      unpriced: { uk: "Бажань без ціни", en: "Wishes without a price" }
      moduleArrived: { uk: "Модуль StatsPanel.jsx завантажено", en: "Module StatsPanel.jsx loaded" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
    title:
      uk: "Ліниве завантаження маршруту підсумків"
      en: "Lazy loading of the totals route"
    body:
      uk: |
        Маршрутизатор курсу з RE-05: `Layout` малює заголовок, меню й `<Outlet />`, а маршрут `/stats` показує lazy-компонент `StatsPanel`. Межа `Suspense` поки одна — навколо всього застосунку, як у передбаченні.

        У пісочниці всі файли вже на твоєму комп’ютері, тож модуль прийшов би миттєво. Тому `slowImport.js` — навчальний регулятор затримки: `slowly(...)` спершу чекає `LOAD_DELAY_MS` мілісекунд (зараз 1000), як повільна мережа, і лише тоді викликає `import()`.

        Натисни **Запустити**, на вкладці **Сторінка** клікни «Підсумки» й подивись, що зникає на секунду. У **Консолі** з’явиться рядок «Модуль StatsPanel.jsx завантажено» — це верхній рівень модуля виконався, коли код прийшов.
      en: |
        The course router from RE-05: `Layout` draws the heading, the menu and `<Outlet />`, and the `/stats` route shows the lazy component `StatsPanel`. For now there is a single `Suspense` boundary — around the whole app, as in the prediction.

        In the sandbox every file is already on your computer, so the module would arrive instantly. That is why `slowImport.js` is the course's import-delay control: `slowly(...)` first waits `LOAD_DELAY_MS` milliseconds (now 1000), like a slow network, and only then calls `import()`.

        Press **Run**, click “Totals” on the **Page** tab and watch what disappears for a second. The **Console** shows the line “Module StatsPanel.jsx loaded” — that is the module's top level running once the code has arrived.
    tryIt:
      uk: |
        1. Перенеси межу всередину. У `App` прибери обгортку `<Suspense …>` і закривальний `</Suspense>`, лишивши `<Router>`. У `Layout` обгорни `<Outlet />` тією самою межею: `<Suspense fallback={<p role="status">Завантажую…</p>}>`, а після `<Outlet />` — `</Suspense>`. Запусти й клікни «Підсумки»: заголовок і меню лишаються, «Завантажую…» стоїть лише в `<main>`.
        2. Клікни «Список», а потім знову «Підсумки». «Завантажую…» більше не з’являється, а рядок у консолі так і лишився один: lazy-компонент запам’ятав модуль, що вже прийшов.
        3. Зміни `LOAD_DELAY_MS` на `300` і запусти: запасний вміст блимає коротше. Справжню швидкість завантаження визначає мережа, а не код — тому межа має виглядати пристойно за будь-якої затримки.
      en: |
        1. Move the boundary inward. In `App` remove the `<Suspense …>` wrapper and the closing `</Suspense>`, keeping `<Router>`. In `Layout` wrap `<Outlet />` in the same boundary: `<Suspense fallback={<p role="status">Loading…</p>}>`, and after `<Outlet />` — `</Suspense>`. Run it and click “Totals”: the heading and the menu stay, and “Loading…” stands only inside `<main>`.
        2. Click “List” and then “Totals” again. “Loading…” no longer appears, and the console still has only one line: the lazy component remembers the module that has already arrived.
        3. Change `LOAD_DELAY_MS` to `300` and run: the fallback flashes for a shorter time. The real loading speed is set by the network, not by the code — so the boundary has to look decent for any delay.

  - id: suspend-steps
    kind: visual
    visual: render-timeline
    strings:
      myWishes: { uk: "Мої бажання", en: "My wishes" }
      loading: { uk: "Завантажую…", en: "Loading…" }
      wantedTotal: { uk: "Сума бажаного", en: "Wanted total" }
    title:
      uk: "Перехід на lazy-маршрут: призупинення, fallback, повторний рендер"
      en: "Moving to a lazy route: suspend, fallback, render again"
    textEquivalent:
      uk: >-
        Межа Suspense стоїть навколо Outlet. Рендер 1 на шляху /items показує заголовок «%%myWishes%%», меню і список,
        і commit записує їх в DOM. Клік по «Підсумки» викликає history.push("/stats"). Рендер 2 бачить шлях /stats і
        доходить до StatsPanel, але коду цього модуля ще немає: рендер цієї ділянки призупиняється, і React переходить до
        найближчої межі Suspense. Commit 2 записує в main запасний вміст «%%loading%%», а заголовок і меню лишаються на
        екрані; старий список не видаляється, а ховається. Минає затримка, модуль приходить. React сам повторює рендер
        (рендер 3), тепер StatsPanel має код і рендериться. Commit 3 замінює запасний вміст панеллю підсумків, а заголовок
        і меню весь час були видимі.
      en: >-
        The Suspense boundary stands around Outlet. Render 1 at the path /items shows the heading "%%myWishes%%", the menu
        and the list, and the commit writes them into the DOM. A click on "Totals" calls history.push("/stats"). Render 2
        sees the path /stats and reaches StatsPanel, but this module's code is not there yet: the render of that region
        suspends, and React goes to the nearest Suspense boundary. Commit 2 writes the fallback "%%loading%%" into main,
        while the heading and the menu stay on the screen; the old list is not removed but hidden. The delay passes and
        the module arrives. React repeats the render by itself (render 3); now StatsPanel has its code and renders.
        Commit 3 replaces the fallback with the totals panel, and the heading and the menu were visible the whole time.
    spec:
      component: Layout
      code: |
        const StatsPanel = lazy(() => import("./StatsPanel"));

        function Layout() {
          return (
            <div>
              <h1>%%myWishes%%</h1>
              <nav>…</nav>
              <main>
                <Suspense fallback={<p role="status">%%loading%%</p>}>
                  <Outlet />
                </Suspense>
              </main>
            </div>
          );
        }
      steps:
        - phase: render
          render: 1
          line: 10
          reason: { uk: "перший показ на /items", en: "first display at /items" }
          snapshot: { state: { path: "/items" } }
          caption:
            uk: "Рендер 1: шлях `/items`, `Outlet` показує список. Тут ніщо не призупиняється."
            en: "Render 1: the path is `/items`, and `Outlet` shows the list. Nothing suspends here."
        - phase: commit
          render: 1
          line: 8
          dom: "<h1>%%myWishes%%</h1><nav>…</nav><main><ul>…</ul></main>"
          caption:
            uk: "Commit 1: на екрані заголовок, меню і список."
            en: "Commit 1: the screen shows the heading, the menu and the list."
        - phase: event
          name: click
          sees: { path: "/items" }
          actions: ["history.push(\"/stats\")"]
          queued: { path: "/stats" }
          caption:
            uk: "Клік по «Підсумки»: маршрутизатор додає запис `/stats` в історію."
            en: "A click on “Totals”: the router adds the entry `/stats` to the history."
        - phase: render
          render: 2
          line: 1
          reason: { uk: "шлях змінився на /stats", en: "the path changed to /stats" }
          snapshot: { state: { path: "/stats" } }
          caption:
            uk: "Рендер 2 доходить до `StatsPanel`, а коду модуля ще немає. Рендер цієї ділянки **призупиняється**, і React шукає найближчу межу `Suspense` вище деревом."
            en: "Render 2 reaches `StatsPanel`, and the module's code is not there yet. The render of that region **suspends**, and React looks for the nearest `Suspense` boundary up the tree."
        - phase: commit
          render: 2
          line: 9
          dom: "<h1>%%myWishes%%</h1><nav>…</nav><main><p role=\"status\">%%loading%%</p></main>"
          caption:
            uk: "Commit 2: межа показує свій `fallback` лише всередині `<main>`. Заголовок і меню — поза межею, вони лишаються."
            en: "Commit 2: the boundary shows its `fallback` only inside `<main>`. The heading and the menu are outside the boundary, so they stay."
        - phase: idle
          caption:
            uk: "Затримка минула, `import()` виконався, модуль прийшов. Код нічого не робить — далі React діє сам."
            en: "The delay is over, `import()` has finished, the module has arrived. The code does nothing — from here React acts on its own."
        - phase: render
          render: 3
          line: 10
          reason: { uk: "модуль прийшов, React повторює рендер", en: "the module arrived, React renders again" }
          snapshot: { state: { path: "/stats" } }
          caption:
            uk: "Рендер 3: той самий шлях `/stats`, але тепер `StatsPanel` має код і рендериться до кінця."
            en: "Render 3: the same path `/stats`, but now `StatsPanel` has its code and renders to the end."
        - phase: commit
          render: 3
          line: 10
          dom: "<h1>%%myWishes%%</h1><nav>…</nav><main><section><h2>…</h2><p>%%wantedTotal%%: 365</p>…</section></main>"
          caption:
            uk: "Commit 3: панель підсумків замінює `fallback`. Заголовок і меню весь цей час були на екрані."
            en: "Commit 3: the totals panel replaces the `fallback`. The heading and the menu were on the screen the whole time."

  - id: what-can-suspend
    kind: explanation
    title:
      uk: "Що справді призупиняє рендер"
      en: "What really suspends a render"
    body:
      uk: |
        `Suspense` не стежить за «чимось повільним». Межа реагує лише тоді, коли компонент **під час рендеру** повідомляє React: «мене ще не можна показати». Так уміють три речі:

        - **Код через `lazy`** — як у прикладі. Є в React з версії 16.6.
        - **Джерела даних із підтримкою Suspense** — фреймворки й бібліотеки даних, у документації яких прямо сказано, що вони працюють із Suspense.
        - **`use(promise)` у React 19** — читає результат промісу просто в рендері. Проміс мусить бути створений **поза** рендером і жити між рендерами (у кеші, на верхньому рівні модуля, у стані компонента над межею). Проміс, створений у самому рендері, щоразу новий: React чекає на нього, рендерить знову, отримує ще один новий — і межа показує `fallback` без кінця. У пісочниці ми перевірили з промісом на 100 мс: за секунду такий компонент відрендерився дванадцять разів, а вміст так і не з’явився.

        А звичайний `fetch` в ефекті — ні. Ефект виконується **після** commit: компонент уже відрендерився й стоїть на екрані, тож межі нема на що реагувати. Стан завантаження для такого коду ти малюєш сам, як у RE-05 і RE-06.
      en: |
        `Suspense` does not watch for “something slow”. A boundary reacts only when a component tells React **during render**: “I cannot be shown yet”. Three things can do that:

        - **Code through `lazy`** — as in the example. React has it since version 16.6.
        - **Suspense-enabled data sources** — frameworks and data libraries whose documentation explicitly says they work with Suspense.
        - **`use(promise)` in React 19** — reads a promise's result right in render. The promise must be created **outside** render and live between renders (in a cache, at the top level of a module, in the state of a component above the boundary). A promise created in the render itself is new every time: React waits for it, renders again, gets yet another new one — and the boundary shows the `fallback` forever. We checked it in the sandbox with a 100 ms promise: within a second such a component rendered twelve times, and the content never appeared.

        A plain `fetch` in an effect does not. An effect runs **after** the commit: the component has already rendered and is on the screen, so there is nothing for the boundary to react to. For such code you draw the loading state yourself, as in RE-05 and RE-06.

  - id: predict-effect-fetch
    kind: prediction
    lang: jsx
    runnable: false
    strings:
      loading: { uk: "Завантажую…", en: "Loading…" }
      total: { uk: "Разом", en: "Total" }
    prompt:
      uk: "Сервер відповідає на `/api/totals` за пів секунди. Що видно на місці цієї межі, поки відповідь у дорозі?"
      en: "The server answers `/api/totals` in half a second. What is visible in the place of this boundary while the answer is on its way?"
    code: |
      function TotalsFromServer() {
        const [data, setData] = useState(null);
        useEffect(() => {
          fetch("/api/totals")
            .then((response) => response.json())
            .then(setData);
        }, []);
        if (data === null) return null;
        return <p>%%total%%: {data.total}</p>;
      }

      <Suspense fallback={<p role="status">%%loading%%</p>}>
        <TotalsFromServer />
      </Suspense>
    answer:
      type: choice
      options:
        - id: nothing
          text: { uk: "Нічого: компонент рендерить `null`, а «Завантажую…» не з’являється", en: "Nothing: the component renders `null`, and “Loading…” does not appear" }
        - id: fallback
          text: { uk: "«Завантажую…», доки не прийде відповідь", en: "“Loading…”, until the answer arrives" }
          why:
            uk: "Межа не бачить запиту: його запускає ефект **після** commit, коли `TotalsFromServer` уже відрендерився з результатом `null`. Призупиняють рендер лише `lazy`, джерела даних із підтримкою Suspense і `use()`."
            en: "The boundary does not see the request: the effect starts it **after** the commit, when `TotalsFromServer` has already rendered with the result `null`. Only `lazy`, Suspense-enabled data sources and `use()` suspend a render."
        - id: error
          text: { uk: "Помилку: в межі `Suspense` не можна викликати `fetch`", en: "An error: `fetch` cannot be called inside a `Suspense` boundary" }
          why:
            uk: "Ефект у межі працює як будь-де. Межа просто не має до нього стосунку."
            en: "An effect inside a boundary works as it does anywhere. The boundary simply has nothing to do with it."
      correct: [nothing]
    explanation:
      uk: "Рендер `TotalsFromServer` закінчується без жодного призупинення: `data` дорівнює `null`, компонент повертає `null`, і commit записує порожнє місце. Лише після commit ефект запускає `fetch`. Через пів секунди `setData` викликає новий рендер — з’являється «Разом: …». У пісочниці ми запустили цей самий компонент із підставною відповіддю на 300 мс: «Завантажую…» не з’явився жодного разу."
      en: "The render of `TotalsFromServer` finishes without any suspension: `data` is `null`, the component returns `null`, and the commit writes an empty spot. Only after the commit does the effect start `fetch`. Half a second later `setData` causes a new render — “Total: …” appears. In the sandbox we ran this same component with a mocked 300 ms answer: “Loading…” never appeared."

  - id: lazy-category-totals
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: lazy-category-totals
    entry: main.jsx
    editable: [App.jsx]
    strings:
      expensesTitle: { uk: "Витрати", en: "Expenses" }
      showTotals: { uk: "Показати підсумки", en: "Show totals" }
      hideTotals: { uk: "Сховати підсумки", en: "Hide totals" }
      loadingTotals: { uk: "Завантажую підсумки…", en: "Loading totals…" }
      totalsTitle: { uk: "Підсумки за категоріями", en: "Totals by category" }
      food: { uk: "Їжа", en: "Food" }
      transport: { uk: "Транспорт", en: "Transport" }
      home: { uk: "Дім", en: "Home" }
      fun: { uk: "Розваги", en: "Fun" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transitPass: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      lunch: { uk: "Обід", en: "Lunch" }
    title:
      uk: "Підсумки витрат, що завантажуються на вимогу"
      en: "Expense totals loaded on demand"
    instructions:
      uk: |
        Трекер витрат показує список і кнопку «Показати підсумки». Підсумки за категоріями потрібні рідко, тож їхній код не мусить завантажуватися разом зі списком. Зміни `App.jsx`:

        - `CategoryTotals.jsx` завантажується лише тоді, коли підсумки показують **уперше**: зроби з нього lazy-компонент і обгорни `import()` у `slowly(...)` з `slowImport.js`, щоб завантаження тривало 600 мс і повідомлення стану встигло бути помітним (перевірки проходять і без затримки, вона лише для твоїх очей);
        - поки код у дорозі, на місці підсумків видно повідомлення стану `<p role="status">` з текстом «Завантажую підсумки…», а заголовок, список і кнопка лишаються видимими;
        - коли підсумки сховали й показали знову, вони з’являються одразу, без нового завантаження.

        `CategoryTotals.jsx` під час завантаження записує себе в `loadLog.js` — так перевірки бачать, коли його код виконався.
      en: |
        The expense tracker shows a list and a “Show totals” button. The totals by category are rarely needed, so their code does not have to load together with the list. Change `App.jsx`:

        - `CategoryTotals.jsx` loads only when the totals are shown **for the first time**: make it a lazy component and wrap the `import()` in `slowly(...)` from `slowImport.js`, so that loading takes 600 ms and the status message stays long enough to notice (the checks pass without the delay too; it is only for your eyes);
        - while the code is on its way, the place of the totals shows a status message `<p role="status">` with the text “Loading totals…”, while the heading, the list and the button stay visible;
        - when the totals are hidden and shown again, they appear at once, without a new load.

        While it loads, `CategoryTotals.jsx` records itself in `loadLog.js` — that is how the checks see when its code ran.
    testTitles:
      "the totals code is not loaded before the totals are shown":
        uk: "Код підсумків не завантажується, доки їх не показали"
        en: "The totals code is not loaded before the totals are shown"
      "while the totals load, a status message shows in the totals area only":
        uk: "Поки підсумки завантажуються, повідомлення стану видно лише на місці підсумків"
        en: "While the totals load, a status message shows in the totals area only"
      "the category totals appear once their code has loaded":
        uk: "Підсумки за категоріями з’являються, щойно їхній код прийшов"
        en: "The category totals appear once their code has loaded"
      "showing the totals a second time needs no new load":
        uk: "Повторний показ підсумків не потребує нового завантаження"
        en: "Showing the totals a second time needs no new load"
    hints:
      nudge:
        uk: "Тобі потрібні дві речі з `react`: одна перетворює `import()` на компонент, друга вирішує, що показати, поки код у дорозі. Де має стояти друга, щоб список і кнопка лишилися на місці?"
        en: "You need two things from `react`: one turns an `import()` into a component, the other decides what to show while the code is on its way. Where must the second one stand so that the list and the button stay in place?"
      explanation:
        uk: |
          Статичний `import … from "./CategoryTotals"` завантажує модуль одразу, разом із `App.jsx`, — його треба замінити на `lazy`, оголошений на верхньому рівні модуля (усередині компонента кожен рендер створював би новий lazy-компонент). Межа `Suspense` показує `fallback` на місці **всього**, що вона обгортає, тож вона має обгортати лише ділянку підсумків. Схожий приклад з іншими назвами:

          ```jsx
          const HabitChart = lazy(slowly(() => import("./HabitChart")));
          …
          <Suspense fallback={<p role="status">…</p>}>
            {chartOpen && <HabitChart />}
          </Suspense>
          ```
        en: |
          A static `import … from "./CategoryTotals"` loads the module at once, together with `App.jsx` — it has to be replaced by `lazy`, declared at the top level of the module (inside a component every render would create a new lazy component). A `Suspense` boundary shows the `fallback` in place of **everything** it wraps, so it must wrap only the totals area. A similar example with other names:

          ```jsx
          const HabitChart = lazy(slowly(() => import("./HabitChart")));
          …
          <Suspense fallback={<p role="status">…</p>}>
            {chartOpen && <HabitChart />}
          </Suspense>
          ```
    solutionNote:
      uk: "`lazy` на верхньому рівні модуля створюється один раз і пам’ятає модуль, що прийшов, тому другий показ миттєвий. Межа обгортає лише підсумки: заголовок, список і кнопка — поза нею, і `fallback` їх не зачіпає. `role=\"status\"` змушує програму екранного читання оголосити «Завантажую підсумки…», не забираючи фокус із кнопки. Межу можна поставити й усередині умови (`{showTotals && <Suspense>…</Suspense>}`) або в окремому компоненті — працює так само."
      en: "A `lazy` at the top level of the module is created once and remembers the module that arrived, so the second showing is instant. The boundary wraps only the totals: the heading, the list and the button are outside it, and the `fallback` does not touch them. `role=\"status\"` makes a screen reader announce “Loading totals…” without taking focus away from the button. The boundary can also stand inside the condition (`{showTotals && <Suspense>…</Suspense>}`) or in a separate component — it works the same."
    feedback:
      - when: { test: "the totals code is not loaded before the totals are shown" }
        message:
          uk: "Ця перевірка чекає, що до першого кліку `CategoryTotals.jsx` не виконувався. Статичний `import CategoryTotals from \"./CategoryTotals\"` завантажує модуль одразу, разом з `App.jsx`; код на вимогу дає лише `lazy(() => import(...))`."
          en: "This check expects `CategoryTotals.jsx` not to have run before the first click. A static `import CategoryTotals from \"./CategoryTotals\"` loads the module at once, together with `App.jsx`; only `lazy(() => import(...))` gives code on demand."
      - when: { test: "while the totals load, a status message shows in the totals area only" }
        message:
          uk: "Ця перевірка клікає «Показати підсумки» і одразу шукає видимий елемент із `role=\"status\"` та текстом «Завантажую підсумки…», а також видимі заголовок, список і кнопку. Якщо зник заголовок чи список, межа `Suspense` обгортає забагато: `fallback` займає місце всього, що всередині неї. Якщо повідомлення немає зовсім, перевір, чи є межа над lazy-компонентом і чи має `fallback` атрибут `role=\"status\"`."
          en: "This check clicks “Show totals” and right away looks for a visible element with `role=\"status\"` and the text “Loading totals…”, and also for a visible heading, list and button. If the heading or the list disappeared, the `Suspense` boundary wraps too much: the `fallback` takes the place of everything inside it. If there is no message at all, check that there is a boundary above the lazy component and that the `fallback` has the attribute `role=\"status\"`."
      - when: { test: "the category totals appear once their code has loaded" }
        message:
          uk: "Ця перевірка чекає до двох секунд, поки з’явиться розділ «Підсумки за категоріями» з рядком «Їжа: 1056.00», і тоді вже не має бути видимого повідомлення стану. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check waits up to two seconds for the “Totals by category” section with the line “Food: 1056.00”, and after that no status message may be visible. If every check fails at once, fix the first error in the console first."
      - when: { test: "showing the totals a second time needs no new load" }
        message:
          uk: "Ця перевірка ховає підсумки, що вже завантажились, показує їх знову й чекає, що вони видимі одразу, без повідомлення «Завантажую підсумки…». Так буває, коли lazy-компонент оголошено один раз — на верхньому рівні модуля, а не всередині `App`."
          en: "This check hides the totals that have already loaded, shows them again and expects them to be visible at once, without the “Loading totals…” message. That happens when the lazy component is declared once — at the top level of the module, not inside `App`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: import() повертає проміс"
      en: "Recall: import() returns a promise"
    items:
      - id: import-returns-promise
        from: js-07-07-live-bindings-dynamic-import
        prompt:
          uk: "Що дає вираз `import(\"./report.js\")` у ту мить, коли він виконується?"
          en: "What does the expression `import(\"./report.js\")` give at the moment it runs?"
        answer:
          type: choice
          options:
            - id: promise
              text: { uk: "Проміс; модуль прийде пізніше — у функцію з `.then`", en: "A promise; the module arrives later — in the function passed to `.then`" }
            - id: module
              text: { uk: "Сам модуль з усіма його експортами", en: "The module itself with all its exports" }
              why:
                uk: "`import()` не чекає: він лише починає завантаження й одразу повертає проміс. Наступний рядок коду виконується ще до того, як модуль прийде."
                en: "`import()` does not wait: it only starts loading and returns a promise at once. The next line of code runs before the module arrives."
            - id: nothing-until-loaded
              text: { uk: "Нічого: код зупиняється, доки модуль не завантажиться", en: "Nothing: the code stops until the module has loaded" }
              why:
                uk: "Так поводився б статичний `import` — він завантажує модулі ще до першого рядка коду. `import()` — вираз, що одразу повертає проміс."
                en: "That is how a static `import` behaves — it loads modules before the first line of code. `import()` is an expression that returns a promise at once."
          correct: [promise]
        explanation:
          uk: "`import()` повертає проміс одразу, а модуль приходить пізніше. `lazy` отримує саме таку функцію, що повертає проміс: React викликає її, коли компонент уперше рендериться, і чекає на модуль замість тебе, показуючи тим часом `fallback`."
          en: "`import()` returns a promise at once, and the module arrives later. `lazy` receives exactly such a function returning a promise: React calls it when the component first renders and waits for the module for you, showing the `fallback` meanwhile."

  - id: to-project
    kind: transfer
    capstoneStep: RE-10
    body:
      uk: "У проєкті ти завантажиш ліниво один рідко потрібний маршрут — підсумки бажань, огляд справ на сьогодні, серії звичок чи підсумки витрат за категоріями — і поставиш межу `Suspense` лише навколо компонента цього маршруту (в `ui/SummaryRoute.tsx`), а не навколо всього застосунку, щоб меню й заголовок не зникали під час завантаження."
      en: "In your project you will lazy-load one rarely needed route — the wish totals, the due-today overview, the habit streaks or the expense totals by category — and put the `Suspense` boundary only around that route's component (in `ui/SummaryRoute.tsx`), not around the whole app, so that the menu and the heading do not disappear while it loads."
