      loadingPage: { uk: "Завантажую сторінку…", en: "Loading the page…" }
      counting: { uk: "Рахую справи…", en: "Counting tasks…" }
      openTasks: { uk: "Невиконаних справ", en: "Open tasks" }
      search: { uk: "Пошук", en: "Search" }
      results: { uk: "Результати пошуку", en: "Search results" }
      found: { uk: "Знайдено", en: "Found" }
      query: { uk: "пол", en: "wat" }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      wardrobe: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
    title:
      uk: "Полагодь планувальник"
      en: "Fix the planner"
    instructions:
      uk: |
        Це той самий планувальник із прикладу. Виправ у `App.jsx` і `TaskCount.jsx` три помилки так, щоб:

        - під час переходу на «На сьогодні» заголовок і меню лишалися видимими, а на місці сторінки стояло повідомлення стану «Завантажую сторінку…»;
        - кожна літера одразу з’являлася в полі пошуку, а список оновлювався в transition — зі старими, приглушеними результатами, поки новий не готовий;
        - лічильник невиконаних справ, поки число в дорозі, показував повідомлення стану «Рахую справи…», а не порожнє місце.

        Перевірки переходять між маршрутами, друкують у пошук по літері з паузами по 30 мс і вимірюють прозорість, яку бачить людина.
      en: |
        This is the same planner as in the example. Fix three bugs in `App.jsx` and `TaskCount.jsx` so that:

        - when going to “Due today”, the heading and the menu stay visible, and the page area shows the status message “Loading the page…”;
        - every letter appears in the search field at once, while the list updates in a transition — with the old, dimmed results until the new ones are ready;
        - while its number is on its way, the open-task counter shows the status message “Counting tasks…” instead of an empty spot.

        The checks move between routes, type into the search one letter at a time with 30 ms pauses and measure the opacity a person sees.
    testTitles:
      'opening "Due today" keeps the heading and the menu, with a status in the page area':
        uk: "Перехід на «На сьогодні» лишає заголовок і меню, а на місці сторінки — повідомлення стану"
        en: "Opening “Due today” keeps the heading and the menu, with a status in the page area"
      "the due-today overview appears once its code arrives":
        uk: "Огляд «На сьогодні» з’являється, щойно прийшов його код"
        en: "The due-today overview appears once its code arrives"
      "the open-task count says it is counting until the number arrives":
        uk: "Лічильник справ повідомляє «Рахую справи…», доки не прийде число"
        en: "The open-task count says it is counting until the number arrives"
      "every typed letter shows in the search field at once":
        uk: "Кожна набрана літера одразу видна в полі пошуку"
        en: "Every typed letter shows in the search field at once"
      "right after a keystroke the old results stay on screen, dimmed":
        uk: "Одразу після клавіші на екрані лишаються старі результати, приглушені"
        en: "Right after a keystroke the old results stay on screen, dimmed"
    hints:
      nudge:
        uk: "Пройди таблицю симптомів із початку уроку рядок за рядком: для кожного симптому знайди в коді місце, на яке вона вказує."
        en: "Go through the symptom table from the start of the lesson row by row: for each symptom, find the place in the code it points to."
      explanation:
        uk: |
          - Межу, що зараз обгортає весь `Router`, перенеси всередину `Layout`, навколо `<Outlet />`: тоді `fallback` займе лише місце сторінки.
          - Полю й списку потрібні два стани: текст поля оновлюється звичайним сетером, а запит списку — у `startTransition`.
          - `Suspense` навколо `TaskCount` нічого не дає: ефект не призупиняє рендер. Прибери обгортку, а в `TaskCount` замість `return null` поверни повідомлення стану.
        en: |
          - Move the boundary that now wraps the whole `Router` inside `Layout`, around `<Outlet />`: then the `fallback` takes only the page area.
          - The field and the list need two pieces of state: the field's text is updated with a plain setter, and the list's query inside `startTransition`.
          - The `Suspense` around `TaskCount` does nothing: an effect does not suspend a render. Remove the wrapper, and in `TaskCount` return a status message instead of `return null`.
    solutionNote:
      uk: "Межа навколо `Outlet` ховає лише сторінку, тож layout лишається. Два стани розділяють термінове й нетермінове: поле не губить літер, а список не блокує набору. Лічильник сам малює стан завантаження — `Suspense` реагує лише на `lazy`, джерела даних із підтримкою Suspense і `use()`. Межу можна поставити й навколо всього `<main>`: заголовок і меню все одно лишаються поза нею."
      en: "A boundary around `Outlet` hides only the page, so the layout stays. Two pieces of state separate urgent from non-urgent: the field loses no letters, and the list does not block typing. The counter draws its own loading state — `Suspense` reacts only to `lazy`, Suspense-enabled data sources and `use()`. The boundary can also stand around the whole `<main>`: the heading and the menu still stay outside it."
    feedback:
      - when: { test: 'opening "Due today" keeps the heading and the menu, with a status in the page area' }
        message:
          uk: "Ця перевірка клікає «На сьогодні» й одразу чекає видимі заголовок «Планувальник», меню та повідомлення стану «Завантажую сторінку…». Якщо зникли заголовок і меню, межа `Suspense` обгортає забагато. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check clicks “Due today” and right away expects a visible “Planner” heading, the menu and the status message “Loading the page…”. If the heading and the menu disappeared, the `Suspense` boundary wraps too much. If every check fails at once, fix the first error in the console first."
      - when: { test: "the due-today overview appears once its code arrives" }
        message:
          uk: "Ця перевірка чекає до двох секунд на заголовок «На сьогодні» на сторінці огляду. Над lazy-компонентом має бути межа `Suspense`."
          en: "This check waits up to two seconds for the “Due today” heading on the overview page. There has to be a `Suspense` boundary above the lazy component."
      - when: { test: "the open-task count says it is counting until the number arrives" }
        message:
          uk: "Ця перевірка повертається до «Усі справи» й одразу чекає видиме повідомлення стану з текстом «Рахую справи…», а потім — «Невиконаних справ: …». Поки `count` дорівнює `null`, `TaskCount` має повертати `<p role=\"status\">` з цим текстом: обгортка `Suspense` тут нічого не покаже."
          en: "This check returns to “All tasks” and right away expects a visible status message with the text “Counting tasks…”, and then “Open tasks: …”. While `count` is `null`, `TaskCount` has to return a `<p role=\"status\">` with that text: a `Suspense` wrapper shows nothing here."
      - when: { test: "every typed letter shows in the search field at once" }
        message:
          uk: "Ця перевірка друкує літери по одній і одразу після кожної чекає її в полі. Якщо літери зникають, текст поля оновлюється в `startTransition` — його сетер має бути поза ним."
          en: "This check types letters one at a time and right after each one expects it in the field. If letters disappear, the field's text is updated inside `startTransition` — its setter has to be outside it."
      - when: { test: "right after a keystroke the old results stay on screen, dimmed" }
        message:
          uk: "Ця перевірка очищає поле, чекає повного списку, друкує одну літеру й одразу чекає ще старий рядок «Знайдено: …» і прозорість результатів менше за 1. Якщо список уже оновився, запит списку не в transition; приглушення має залежати від `isPending`."
          en: "This check clears the field, waits for the full list, types one letter and right away expects the old “Found: …” line and a results opacity below 1. If the list has already updated, the list's query is not in a transition; the dimming has to depend on `isPending`."

  - id: failed-load
    kind: explanation
    title:
      uk: "Коли код не прийшов зовсім"
      en: "When the code never arrives"
    body:
      uk: |
        `Suspense` чекає, але не рятує від помилки: якщо `import()` у `lazy` відхилено (мережа впала, файл зник після оновлення сайту), lazy-компонент **кидає** цю помилку під час рендеру. Її ловить error boundary з RE-05 — тож поруч із межею `Suspense` ставлять і межу помилок.

        Одна підступна деталь, яку ми перевірили в пісочниці: lazy-компонент **запам’ятовує й невдачу**. Кнопка «Спробувати ще раз», яка лише скидає помилку в boundary, знову отримує ту саму помилку — `import()` вдруге навіть не викликається. Щоб спробувати насправді, потрібен **новий** lazy-компонент:

        ```jsx
        const loadChart = slowly(() => import("./HabitChart"));

        function ChartArea() {
          const [Chart, setChart] = useState(() => lazy(loadChart));
          const [attempt, setAttempt] = useState(0);
          const retry = () => {
            setChart(lazy(loadChart));
            setAttempt((n) => n + 1);
          };
          return (
            <ErrorBoundary key={attempt} onRetry={retry}>
              <Suspense fallback={<p role="status">…</p>}>
                <Chart />
              </Suspense>
            </ErrorBoundary>
          );
        }
        ```

        `ErrorBoundary` тут — клас із RE-05 з одним доповненням: кнопка «Спробувати ще раз» у його запасному вмісті викликає проп `onRetry`. Новий lazy-компонент іде в стан, тож кожна спроба знову викликає функцію завантаження, а `key={attempt}` дає boundary чистий стан, як у RE-05.

        Від чого це рятує, а від чого ні. Новий lazy-компонент допомагає, коли до наступної спроби причина зникла: помилка рендеру або збій, який код кидає сам ще до виклику `import()`, — так імітують обрив мережі в пісочниці курсу. Справжній шматок коду, який не завантажився, — інша історія: Chrome запам’ятовує, що модуль за цією адресою не завантажився, і не просить його знову, доки сторінку не перезавантажать. Ми перевірили це в Chrome 154, готуючи крок проєкту цього розділу: після «Спробувати ще раз» запит того самого файла так і лишився один. Тому в справжньому застосунку після повторного збою пропонуй ще й «Перезавантажити сторінку» (`location.reload()`) — так і зробить крок проєкту.

        Ціна такого рішення: lazy-компонент у стані створюється наново щоразу, коли `ChartArea` з’являється на екрані, тож при кожному новому відкритті знову видно `fallback` — саме те, від чого застерігав перший урок розділу. Якщо це заважає, тримай lazy-компонент у змінній модуля і заміняй її новим лише під час повторної спроби.
      en: |
        `Suspense` waits, but it does not save you from an error: if the `import()` in `lazy` is rejected (the network dropped, the file vanished after a site update), the lazy component **throws** that error during render. The error boundary from RE-05 catches it — so an error boundary is placed next to the `Suspense` boundary.

        One tricky detail we checked in the sandbox: a lazy component **remembers a failure too**. A “Try again” button that only clears the error in the boundary gets the same error again — `import()` is not even called a second time. To really try again you need a **new** lazy component:

        ```jsx
        const loadChart = slowly(() => import("./HabitChart"));

        function ChartArea() {
          const [Chart, setChart] = useState(() => lazy(loadChart));
          const [attempt, setAttempt] = useState(0);
          const retry = () => {
            setChart(lazy(loadChart));
            setAttempt((n) => n + 1);
          };
          return (
            <ErrorBoundary key={attempt} onRetry={retry}>
              <Suspense fallback={<p role="status">…</p>}>
                <Chart />
              </Suspense>
            </ErrorBoundary>
          );
        }
        ```

        `ErrorBoundary` here is the class from RE-05 with one addition: the “Try again” button in its fallback calls the `onRetry` prop. The new lazy component goes into state, so every attempt calls the loading function again, and `key={attempt}` gives the boundary a clean state, as in RE-05.

        What this recovers from, and what it does not. A new lazy component helps when the cause is gone by the next attempt: a render error, or a failure that the code throws itself before `import()` is even called — that is how the course sandbox simulates a dropped connection. A chunk of code that really failed to load is a different story: Chrome remembers that the module at that address failed and does not request it again until the page is reloaded. We checked this in Chrome 154 while preparing this unit's project step: after “Try again” there was still one request of that file in total. So in a real app, after a repeated failure also offer “Reload the page” (`location.reload()`) — the project step will do exactly that.

        The price of this solution: a lazy component in state is created anew every time `ChartArea` appears on the screen, so each new visit shows the `fallback` again — exactly what the first lesson of this unit warned about. If that gets in the way, keep the lazy component in a module variable and replace it with a new one only on a retry.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: старі дані чи порожнеча"
      en: "Recall: old data or a blank"
    items:
      - id: keep-old-list
        from: re-06-03-loading-retry
        prompt:
          uk: "Список справ уже на екрані, і застосунок оновлює його у фоні. Що краще бачити людині, поки нові дані в дорозі?"
          en: "The task list is already on the screen, and the app refreshes it in the background. What is better for the person to see while the new data is on its way?"
        answer:
          type: choice
          options:
            - id: old-with-note
              text: { uk: "Старий список і помітку, що він оновлюється", en: "The old list plus a note that it is being refreshed" }
            - id: spinner
              text: { uk: "Лише індикатор завантаження замість списку", en: "Only a loading indicator in place of the list" }
              why:
                uk: "Індикатор замість списку забирає в людини дані, які в неї вже є, і зсуває сторінку. Перше завантаження — інша річ: там показати ще нічого."
                en: "An indicator in place of the list takes away data the person already has and shifts the page. A first load is different: there is nothing to show yet."
            - id: nothing
              text: { uk: "Порожнє місце, щоб людина не бачила застарілих даних", en: "An empty spot, so the person does not see stale data" }
              why:
                uk: "Порожнеча нічого не пояснює й виглядає як збій. Старі дані з чесною поміткою «оновлюється» корисніші."
                en: "A blank explains nothing and looks like a failure. Old data with an honest “refreshing” note is more useful."
          correct: [old-with-note]
        explanation:
          uk: "Те саме правило діє для transitions і `Suspense`: transition лишає на екрані старий список, приглушений, поки новий готується, а межа `Suspense` близько до lazy-ділянки не забирає решту сторінки. Порожнеча чи «Завантажую…» замість усього — крайній випадок, а не норма."
          en: "The same rule holds for transitions and `Suspense`: a transition keeps the old list on the screen, dimmed, while the new one is prepared, and a `Suspense` boundary close to the lazy region does not take away the rest of the page. A blank or “Loading…” in place of everything is a last resort, not the norm."

  - id: to-project
    kind: transfer
    capstoneStep: RE-10
    body:
      uk: "Коли в проєкті з’явиться lazy-маршрут і transition, пройди таблицю симптомів цього уроку: перехід не має ховати меню, поле пошуку не має губити літер, а дані, що приходять з ефекту, мають власний стан завантаження. Для невдалого завантаження коду поклади поруч із `Suspense` error boundary з кнопкою, що створює новий lazy-компонент."
      en: "Once your project has a lazy route and a transition, go through this lesson's symptom table: navigation must not hide the menu, the search field must not lose letters, and data arriving from an effect needs its own loading state. For a failed code load, put an error boundary next to `Suspense` with a button that creates a new lazy component."
