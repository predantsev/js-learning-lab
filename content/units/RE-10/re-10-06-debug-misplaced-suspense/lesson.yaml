id: re-10-06-debug-misplaced-suspense
unit: RE-10
title:
  uk: "Налагодження: невдало розміщений Suspense і хибні припущення про transitions"
  en: "Debug: misplaced Suspense and transition assumptions"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Знайти межу Suspense, поставлену так високо, що під час переходу зникає весь layout, і transition, у який загорнуто власне значення поля."
    en: "Diagnose a Suspense boundary placed so high that the whole layout blanks on navigation, and a transition wrapped around an input's own value."
  - uk: "Виправити обидві помилки й переконатися, що поле лишається чуйним, а layout навколо — видимим."
    en: "Repair both and confirm that the input stays responsive and the surrounding layout stays visible."
prerequisites: [re-10-05-compiler-legacy]
subskills:
  - { family: R-08, skill: "Suspense supported data/code patterns", depth: assess }
  - { family: R-08, skill: "transitions/urgent vs nonurgent state", depth: assess }
glossary: []
selfCheck: [predict-symptoms, planner-app]

blocks:
  - id: symptoms-to-causes
    kind: explanation
    title:
      uk: "Від симптому до причини"
      en: "From symptom to cause"
    body:
      uk: |
        Три симптоми трапляються в застосунках із `lazy`, `Suspense` і transitions найчастіше. Кожен має свою типову причину:

        | Симптом | Типова причина | Де дивитися |
        |---|---|---|
        | під час переходу зникає **все** — заголовок, меню, — лишається тільки «Завантажую…» | межа `Suspense` стоїть надто високо, наприклад навколо всього `App` | шукай найближчий `Suspense` над lazy-компонентом: `fallback` займе місце всього, що він обгортає |
        | літери в полі зникають або з’являються із запізненням | текст **самого поля** оновлюється в `startTransition` | сетер значення поля має бути поза `startTransition` |
        | поки дані йдуть, на місці компонента порожньо, хоча навколо стоїть `Suspense` | дані завантажує ефект, а ефект ніколи не призупиняє рендер | компонент мусить сам показати стан завантаження |

        Зверни увагу на пастку: якщо `fallback` **з’являється**, це ще не означає, що межа на своєму місці. Перевір, що саме зникає разом із нею.
      en: |
        Three symptoms show up most often in apps with `lazy`, `Suspense` and transitions. Each has its typical cause:

        | Symptom | Typical cause | Where to look |
        |---|---|---|
        | on navigation **everything** disappears — the heading, the menu — and only “Loading…” remains | the `Suspense` boundary sits too high, for example around the whole `App` | find the nearest `Suspense` above the lazy component: its `fallback` takes the place of everything it wraps |
        | letters in the field disappear or show up late | the text of **the field itself** is updated inside `startTransition` | the field's value setter must be outside `startTransition` |
        | while data is on its way, the component's place is empty, although a `Suspense` surrounds it | an effect loads the data, and an effect never suspends a render | the component has to show its loading state itself |

        Mind the trap: a `fallback` that **does appear** does not prove the boundary is in the right place. Check what disappears together with it.

  - id: predict-symptoms
    kind: prediction
    lang: jsx
    runnable: false
    strings:
      loadingPage: { uk: "Завантажую сторінку…", en: "Loading the page…" }
    prompt:
      uk: "Ось два фрагменти застосунку-планувальника. Людина відкриває «Сьогодні» (lazy-маршрут), повертається до списку й набирає в пошуку `wat`. Що вона побачить?"
      en: "Here are two fragments of a planner app. The person opens “Due today” (a lazy route), returns to the list and types `wat` into the search. What will they see?"
    code: |
      // App.jsx
      <Suspense fallback={<p role="status">%%loadingPage%%</p>}>
        <Router history={history}>
          <Routes routes={routes} />
        </Router>
      </Suspense>

      // TaskSearch
      const [text, setText] = useState("");
      function handleChange(event) {
        const value = event.target.value;
        startTransition(() => setText(value));
      }
      <input value={text} onChange={handleChange} />
      <TaskList query={text} />
    answer:
      type: choice
      options:
        - id: both
          text: { uk: "Під час переходу зникають і заголовок, і меню; а в полі літери пропадають, і після набору там може бути не `wat`", en: "During navigation both the heading and the menu disappear; and letters vanish from the field, so after typing it may not hold `wat`" }
        - id: only-main
          text: { uk: "Зникає лише вміст `<main>`, бо `fallback` стоїть у межах сторінки; поле працює нормально", en: "Only the content of `<main>` disappears, because the `fallback` stays within the page; the field works fine" }
          why:
            uk: "Межа обгортає весь `Router`, тобто весь layout. А поле показує стан `text`, який оновлюється лише в transition: до кінця transition React повертає в поле старий текст."
            en: "The boundary wraps the whole `Router`, that is, the whole layout. And the field shows the state `text`, which is updated only inside the transition: until the transition ends, React puts the old text back into the field."
        - id: only-lag
          text: { uk: "Layout лишається, бо `fallback` з’являється, — отже, межа правильна; гальмує лише список", en: "The layout stays, because the `fallback` appears — so the boundary is right; only the list lags" }
          why:
            uk: "Поява `fallback` нічого не каже про місце межі. Важливо, що вона обгортає: тут — увесь застосунок."
            en: "A `fallback` appearing says nothing about where the boundary is. What matters is what it wraps: here, the whole app."
        - id: faster
          text: { uk: "Поле працює швидше, ніж без transition, бо `startTransition` прискорює оновлення", en: "The field works faster than without a transition, because `startTransition` speeds updates up" }
          why:
            uk: "`startTransition` нічого не прискорює — він робить оновлення нетерміновим. Для власного тексту поля це саме те, чого не треба."
            en: "`startTransition` speeds nothing up — it makes an update non-urgent. For the field's own text that is exactly what you do not want."
      correct: [both]
    explanation:
      uk: "Обидва симптоми ми бачили в пісочниці на прикладі цього уроку. Межа навколо `Router` під час переходу ховає весь layout. А коли поле показує стан, що змінюється лише в transition, React після кожної клавіші повертає в поле старе значення: у пісочниці ми набрали в таке поле над повільним списком `a`, `b`, `c` з паузами — і в полі лишилося тільки `c`."
      en: "We saw both symptoms in the sandbox with this lesson's example. A boundary around `Router` hides the whole layout during navigation. And when the field shows state that changes only inside a transition, React puts the old value back after every key: in the sandbox we typed `a`, `b`, `c` with pauses into such a field above a slow list — and only `c` was left in the field."

  - id: seeded-app
    kind: example
    runtime: browser-react
    dir: seeded-app
    entry: main.jsx
    strings:
      planner: { uk: "Планувальник", en: "Planner" }
      mainNav: { uk: "Головне меню", en: "Main menu" }
      allTasks: { uk: "Усі справи", en: "All tasks" }
      dueToday: { uk: "На сьогодні", en: "Due today" }
      dueCount: { uk: "Невиконаних справ із терміном до сьогодні", en: "Open tasks due by today" }
      loadingPage: { uk: "Завантажую сторінку…", en: "Loading the page…" }
      counting: { uk: "Рахую справи…", en: "Counting tasks…" }
      openTasks: { uk: "Невиконаних справ", en: "Open tasks" }
      search: { uk: "Пошук", en: "Search" }
      results: { uk: "Результати пошуку", en: "Search results" }
      found: { uk: "Знайдено", en: "Found" }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      wardrobe: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
    title:
      uk: "Застосунок із трьома помилками: спершу спостерігай"
      en: "An app with three bugs: observe first"
    body:
      uk: |
        Планувальник має два маршрути: «Усі справи» з пошуком у 3000 справ і lazy-маршрут «На сьогодні». Над списком — лічильник невиконаних справ, що приходить за 300 мс.

        Тут два регулятори курсу: `LOAD_DELAY_MS` у `slowImport.js` (затримка завантаження коду, зараз 600 мс) і `ROW_COST_MS` у `TaskList.jsx` (скільки мілісекунд займає кожен рядок списку, зараз 1).

        Нічого не виправляй — лише запусти й запиши, що бачиш. Натисни **Запустити**.
      en: |
        The planner has two routes: “All tasks” with a search over 3,000 tasks, and the lazy route “Due today”. Above the list there is a counter of open tasks that arrives in 300 ms.

        There are two course controls: `LOAD_DELAY_MS` in `slowImport.js` (the code loading delay, now 600 ms) and `ROW_COST_MS` in `TaskList.jsx` (how many milliseconds each list row takes, now 1).

        Do not fix anything — just run it and note what you see. Press **Run**.
    tryIt:
      uk: |
        1. Одразу після запуску над списком порожньо, а через 300 мс з’являється «Невиконаних справ: …». `Suspense` навколо `TaskCount` так і не показав «Рахую справи…».
        2. Клікни «На сьогодні». На ~600 мс зникає все — і заголовок «Планувальник», і меню. Запиши, де стоїть межа, що це зробила.
        3. Повернись до «Усі справи» й набери в пошуку слово — спершу повільно, потім швидко. Кожна літера на мить зникає й повертається ривком, а при швидкому наборі частина літер губиться зовсім.
        4. Зміни `ROW_COST_MS` на `3` і повтори крок 3: що повільніший список, то більше літер губиться — у пісочниці навіть літери з паузами по 200 мс зникли всі, крім останньої. Тепер відкрий вправу нижче й виправ усі три місця.
      en: |
        1. Right after the run the place above the list is empty, and after 300 ms “Open tasks: …” appears. The `Suspense` around `TaskCount` never showed “Counting tasks…”.
        2. Click “Due today”. For about 600 ms everything disappears — the “Planner” heading and the menu too. Note where the boundary that did this stands.
        3. Go back to “All tasks” and type a word into the search — slowly first, then fast. Every letter vanishes for a moment and comes back with a jerk, and when you type fast some letters are lost entirely.
        4. Change `ROW_COST_MS` to `3` and repeat step 3: the slower the list, the more letters get lost — in the sandbox even letters typed 200 ms apart were all lost except the last one. Now open the exercise below and fix all three places.

  - id: seeded-steps
    kind: visual
    visual: render-timeline
    strings:
      planner: { uk: "Планувальник", en: "Planner" }
      loadingPage: { uk: "Завантажую сторінку…", en: "Loading the page…" }
      dueToday: { uk: "На сьогодні", en: "Due today" }
    title:
      uk: "Застосунок-приклад: перехід і набір до виправлення"
      en: "The example app: navigation and typing before the fix"
    textEquivalent:
      uk: >-
        Рендер 1 показує layout: заголовок «%%planner%%», меню і список. Клік «%%dueToday%%» додає шлях /today. Рендер 2
        доходить до lazy-компонента, код якого ще не прийшов, і призупиняється. Найближча межа — навколо всього Router, тож
        commit 2 ховає весь layout і показує лише «%%loadingPage%%». Модуль приходить, рендер 3 показує огляд, і layout
        повертається. Далі людина набирає «w». Обробник не робить жодного термінового оновлення: setText викликано в
        startTransition. Тож одразу після обробника React повертає керованому полю значення зі стану text — порожній рядок, —
        і літера зникає. Рендер 4 у transition показує «w» лише тоді, коли весь список готовий. Після виправлення межа стоїть навколо Outlet,
        тож зникає тільки вміст main, а text оновлюється терміново, і кожна літера стає в поле одразу.
      en: >-
        Render 1 shows the layout: the heading "%%planner%%", the menu and the list. A click on "%%dueToday%%" adds the path
        /today. Render 2 reaches the lazy component whose code has not arrived yet and suspends. The nearest boundary is
        around the whole Router, so commit 2 hides the whole layout and shows only "%%loadingPage%%". The module arrives,
        render 3 shows the overview, and the layout comes back. Next the person types "w". The handler makes no urgent
        update: setText is called inside startTransition. So right after the handler React gives the controlled field the
        value from the state text — an empty string — and the letter is gone. Render 4 in the transition shows "w" only
        once the whole list is ready.
        After the fix the boundary stands around Outlet, so only the content of main disappears, and text is updated
        urgently, so every letter lands in the field at once.
    spec:
      component: App
      code: |
        <Suspense fallback={<p role="status">%%loadingPage%%</p>}>
          <Router history={history}>
            <Routes routes={routes} />
          </Router>
        </Suspense>

        function TaskSearch() {
          const [text, setText] = useState("");
          function handleChange(event) {
            const value = event.target.value;
            startTransition(() => setText(value));
          }
          return <input value={text} onChange={handleChange} />;
        }
      steps:
        - phase: render
          render: 1
          line: 3
          reason: { uk: "перший показ на /tasks", en: "first display at /tasks" }
          snapshot: { state: { path: "/tasks", text: "" } }
          caption:
            uk: "Рендер 1: layout зі списком справ."
            en: "Render 1: the layout with the task list."
        - phase: commit
          render: 1
          line: 1
          dom: "<h1>%%planner%%</h1><nav>…</nav><main><input value=\"\"> …</main>"
          caption:
            uk: "Commit 1: заголовок, меню, поле й список на екрані."
            en: "Commit 1: the heading, the menu, the field and the list are on the screen."
        - phase: event
          name: click
          sees: { path: "/tasks" }
          actions: ["history.push(\"/today\")"]
          queued: { path: "/today" }
          caption:
            uk: "Клік «%%dueToday%%»."
            en: "A click on “%%dueToday%%”."
        - phase: render
          render: 2
          line: 3
          reason: { uk: "шлях /today, lazy-код ще в дорозі", en: "the path is /today, the lazy code is still on its way" }
          snapshot: { state: { path: "/today", text: "" } }
          caption:
            uk: "Рендер 2 призупиняється на lazy-компоненті. Найближча межа — у рядку 1, навколо **всього** `Router`."
            en: "Render 2 suspends on the lazy component. The nearest boundary is on line 1, around the **whole** `Router`."
        - phase: commit
          render: 2
          line: 1
          dom: "<p role=\"status\">%%loadingPage%%</p>"
          caption:
            uk: "Commit 2: зник увесь layout — заголовок і меню теж. `fallback` з’явився, але межа не на своєму місці."
            en: "Commit 2: the whole layout is gone — the heading and the menu too. The `fallback` appeared, but the boundary is in the wrong place."
        - phase: render
          render: 3
          line: 3
          reason: { uk: "модуль прийшов", en: "the module arrived" }
          snapshot: { state: { path: "/today", text: "" } }
          caption:
            uk: "Рендер 3: код прийшов, огляд рендериться."
            en: "Render 3: the code has arrived, the overview renders."
        - phase: commit
          render: 3
          line: 2
          dom: "<h1>%%planner%%</h1><nav>…</nav><main><h2>%%dueToday%%</h2>…</main>"
          caption:
            uk: "Commit 3: layout повернувся разом з оглядом. Людина повертається до списку."
            en: "Commit 3: the layout came back together with the overview. The person returns to the list."
        - phase: event
          name: input
          line: 11
          sees: { text: "" }
          actions: ["startTransition(() => setText(\"w\"))"]
          caption:
            uk: "Людина набирає «w». Жодного термінового оновлення: навіть `text` поля оновлюється в transition."
            en: "The person types “w”. There is no urgent update: even the field's `text` is updated inside the transition."
        - phase: idle
          caption:
            uk: "Термінового рендеру немає. Одразу після обробника React повертає керованому полю значення зі стану `text` — `\"\"`. Літера «w» **зникла**."
            en: "There is no urgent render. Right after the handler React gives the controlled field the value from the state `text` — `\"\"`. The letter “w” is **gone**."
        - phase: render
          render: 4
          line: 13
          reason: { uk: "transition: text і список", en: "transition: text and the list" }
          snapshot: { state: { text: "w" } }
          caption:
            uk: "Рендер 4 у transition: «w» з’явиться лише тоді, коли весь список готовий, — і якщо жодна клавіша його не перерве."
            en: "Render 4 in the transition: “w” appears only once the whole list is ready — and only if no key interrupts it."
        - phase: commit
          render: 4
          line: 13
          dom: "<input value=\"w\">"
          caption:
            uk: "Commit 4: «w» нарешті в полі. Виправлення: межа навколо `Outlet`, а `setText` — поза `startTransition`."
            en: "Commit 4: “w” is finally in the field. The fix: the boundary around `Outlet`, and `setText` outside `startTransition`."

