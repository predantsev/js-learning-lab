  - id: recall
    kind: review
    title:
      uk: "Пригадай: черга й батчинг"
      en: "Recall: the queue and batching"
    items:
      - id: one-render-per-handler
        from: re-02-03-updater-queue-batching
        prompt:
          uk: "Обробник кліку викликає `setText(\"a\")`, а одразу за ним `setCount((c) => c + 1)`. Скільки рендерів дасть цей клік, якщо жоден із сетерів не обгорнуто в `startTransition`?"
          en: "A click handler calls `setText(\"a\")` and right after it `setCount((c) => c + 1)`. How many renders does this click cause if neither setter is wrapped in `startTransition`?"
        answer:
          type: choice
          options:
            - id: one
              text: { uk: "Один: React збирає обидва оновлення в чергу й рендерить, коли обробник закінчився", en: "One: React collects both updates in a queue and renders when the handler has finished" }
            - id: two
              text: { uk: "Два: по одному на кожен сетер", en: "Two: one per setter" }
              why:
                uk: "Сетер не рендерить одразу — він лише додає запис у чергу. Усі оновлення однієї події React об’єднує в один рендер: це батчинг."
                en: "A setter does not render at once — it only adds an entry to the queue. React combines all updates of one event into one render: that is batching."
            - id: zero
              text: { uk: "Жодного, доки не викликати `startTransition`", en: "None until `startTransition` is called" }
              why:
                uk: "`startTransition` лише позначає оновлення як нетермінове. Звичайні оновлення React рендерить після обробника без жодних додаткових викликів."
                en: "`startTransition` only marks an update as non-urgent. React renders ordinary updates after the handler without any extra calls."
          correct: [one]
        explanation:
          uk: "Обидва оновлення термінові, тож вони потрапляють в один рендер. Коли одне з них обгорнуто в `startTransition`, React розділяє їх: термінове рендерить одразу, а нетермінове — окремим рендером, який можна перервати. Саме тому в прикладі поле й список оновлюються в різних commit."
          en: "Both updates are urgent, so they land in one render. When one of them is wrapped in `startTransition`, React separates them: the urgent one is rendered at once, the non-urgent one in a separate render that can be interrupted. That is why in the example the field and the list update in different commits."

  - id: expense-search
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: expense-search
    entry: main.jsx
    editable: [App.jsx]
    strings:
      expensesTitle: { uk: "Витрати за рік", en: "Expenses of the year" }
      searchLabel: { uk: "Пошук за назвою", en: "Search by label" }
      results: { uk: "Результати пошуку", en: "Search results" }
      found: { uk: "Знайдено", en: "Found" }
      query: { uk: "кава", en: "coffee" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transitPass: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      lunch: { uk: "Обід", en: "Lunch" }
    title:
      uk: "Пошук у 5000 витрат без гальмування"
      en: "Searching 5,000 expenses without lag"
    instructions:
      uk: |
        Трекер витрат шукає серед 5000 записів. `ExpenseList` (вже в `memo`) рендериться близько 200 мс, а зараз поле й список оновлюються разом — тож кожна літера чекає на список. Зміни `App.jsx`:

        - текст поля оновлюється терміново: кожна набрана літера одразу видна в полі;
        - запит для списку оновлюється в transition: одразу після клавіші на екрані лишаються **старі** результати;
        - поки новий список готується, результати приглушені — обгортка `<div>` навколо `ExpenseList` має `opacity` менше за 1 (наприклад, `0.5`), а коли список готовий — знову `1`.

        Перевірки друкують у поле по одній літері з паузами по 30 мс і вимірюють прозорість, яку бачить людина: добуток `opacity` розділу результатів і всіх його батьків.
      en: |
        The expense tracker searches 5,000 records. `ExpenseList` (already in `memo`) takes about 200 ms to render, and right now the field and the list update together — so every letter waits for the list. Change `App.jsx`:

        - the field's text updates urgently: every typed letter is visible in the field at once;
        - the list's query updates in a transition: right after a key the **old** results stay on the screen;
        - while the new list is being prepared, the results are dimmed — the `<div>` wrapper around `ExpenseList` has an `opacity` below 1 (for example `0.5`), and when the list is ready it is `1` again.

        The checks type into the field one letter at a time with 30 ms pauses and measure the opacity a person sees: the product of the `opacity` of the results section and all of its parents.
    testTitles:
      "every typed character shows in the field at once":
        uk: "Кожна набрана літера одразу видна в полі"
        en: "Every typed character shows in the field at once"
      "right after a keystroke the old results stay on screen, dimmed":
        uk: "Одразу після клавіші на екрані лишаються старі результати, приглушені"
        en: "Right after a keystroke the old results stay on screen, dimmed"
      "when typing stops, the matching results show without dimming":
        uk: "Коли набір закінчився, видно відповідні результати без приглушення"
        en: "When typing stops, the matching results show without dimming"
    hints:
      nudge:
        uk: "Зараз один стан живить і поле, і список. Скільки станів потрібно, щоб поле й список могли оновлюватися в різний час? І який із них можна відкласти?"
        en: "Right now one piece of state feeds both the field and the list. How many pieces of state are needed so that the field and the list can update at different times? And which of them may be postponed?"
      explanation:
        uk: |
          Розділи стан на два: текст поля й запит списку. Обробник ставить текст поля звичайним сетером, а запит списку — усередині `startTransition`. `isPending` з `useTransition` дорівнює `true`, доки рендер у transition не дійшов до commit, — від нього й залежить `opacity` обгортки. Схожий приклад з іншими назвами:

          ```jsx
          const [isPending, startTransition] = useTransition();
          function chooseTab(next) {
            setHighlighted(next);                  // кнопка підсвічується одразу
            startTransition(() => setTab(next));   // важкий вміст вкладки — потім
          }
          <div style={{ opacity: isPending ? 0.6 : 1 }}>…</div>
          ```
        en: |
          Split the state in two: the field's text and the list's query. The handler sets the field's text with a plain setter and the list's query inside `startTransition`. `isPending` from `useTransition` is `true` until the render in the transition has reached its commit — the wrapper's `opacity` depends on it. A similar example with other names:

          ```jsx
          const [isPending, startTransition] = useTransition();
          function chooseTab(next) {
            setHighlighted(next);                  // the button lights up at once
            startTransition(() => setTab(next));   // the heavy tab content later
          }
          <div style={{ opacity: isPending ? 0.6 : 1 }}>…</div>
          ```
    solutionNote:
      uk: "Два стани дають React два різні оновлення. Текст поля термінове, тож кожна літера стає на екрані за мілісекунди; запит списку — у transition, тому старі результати лишаються, доки новий список не готовий, а `isPending` приглушує їх саме на цей час. Так само працює й порівняння `query !== shownQuery` замість `isPending`, а `useDeferredValue` робить те саме з іншого боку: React сам тримає «відкладену» копію значення."
      en: "Two pieces of state give React two different updates. The field's text is urgent, so every letter reaches the screen within milliseconds; the list's query is in a transition, so the old results stay until the new list is ready, and `isPending` dims them exactly for that time. Comparing `query !== shownQuery` instead of `isPending` works too, and `useDeferredValue` does the same from the other side: React itself keeps a “deferred” copy of the value."
    feedback:
      - when: { test: "every typed character shows in the field at once" }
        message:
          uk: "Ця перевірка друкує «кава» по одній літері й одразу після кожної чекає її в полі. Якщо літери зникають, текст самого поля оновлюється в `startTransition`: поле показує стан, тож до кінця transition React повертає в нього старий текст. Сетер тексту поля має бути поза `startTransition`."
          en: "This check types “coffee” one letter at a time and right after each one expects it in the field. If letters disappear, the field's own text is updated inside `startTransition`: the field shows state, so until the transition ends React puts the old text back. The field's setter must be outside `startTransition`."
      - when: { test: "right after a keystroke the old results stay on screen, dimmed" }
        message:
          uk: "Ця перевірка очищає поле, чекає повного списку («Знайдено: 5000»), друкує одну літеру й одразу чекає ще старий рядок «Знайдено: 5000» і прозорість результатів менше за 1. Якщо список уже оновився, запит списку не в transition. Якщо список старий, але прозорість 1, обгортці потрібен `opacity`, що залежить від `isPending`."
          en: "This check clears the field, waits for the full list (“Found: 5000”), types one letter and right away expects the old line “Found: 5000” and a results opacity below 1. If the list has already updated, the list's query is not in a transition. If the list is old but the opacity is 1, the wrapper needs an `opacity` that depends on `isPending`."
      - when: { test: "when typing stops, the matching results show without dimming" }
        message:
          uk: "Ця перевірка друкує «кава» й чекає до трьох секунд, поки рядок «Знайдено: …» покаже кількість витрат зі словом «кава» в назві, а прозорість результатів стане 1. Список має отримувати той самий текст, що й поле, а приглушення — зникати, коли transition завершився. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check types “coffee” and waits up to three seconds for the line “Found: …” to show the number of expenses with “coffee” in the label, and for the results opacity to become 1. The list must receive the same text as the field, and the dimming must go away when the transition has finished. If every check fails at once, fix the first error in the console first."

  - id: to-project
    kind: transfer
    capstoneStep: RE-10
    body:
      uk: "У проєкті пошук за назвою (`name`, `title` чи `label`, залежно від проєкту) лишиться терміновим, а відфільтрований список оновлюватиметься в transition із приглушенням, поки він готується. Перед цим виміряй рендер списку через `<Profiler>`: якщо він і так займає кілька мілісекунд, transition нічого не дасть."
      en: "In your project the search by name (`name`, `title` or `label`, depending on the project) will stay urgent, and the filtered list will update in a transition, dimmed while it is being prepared. Measure the list render with `<Profiler>` first: if it already takes a few milliseconds, a transition gains nothing."
