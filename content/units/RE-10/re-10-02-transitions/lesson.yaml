id: re-10-02-transitions
unit: RE-10
title:
  uk: "Transitions: термінові й нетермінові оновлення"
  en: "Transitions: urgent vs non-urgent"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Позначити нетермінове оновлення стану через `useTransition`, щоб введення лишалося чуйним, поки повільний список рендериться заново."
    en: "Mark a non-urgent state update with `useTransition` so typing stays responsive while a slow list re-renders."
  - uk: "Передбачити, що повідомляє `isPending` і яке значення показує поле, поки transition не завершився."
    en: "Predict what `isPending` reports and which value the input shows during a pending transition."
prerequisites: [re-10-01-lazy-suspense, re-02-03-updater-queue-batching, re-07-02-profiling-render-causes]
subskills:
  - { family: R-08, skill: "transitions/urgent vs nonurgent state", depth: intro }
glossary: [urgent-update, non-urgent-update, use-transition]
selfCheck: [predict-three-keys, expense-search]

blocks:
  - id: two-kinds-of-updates
    kind: explanation
    title:
      uk: "Одна клавіша — два оновлення"
      en: "One key, two updates"
    body:
      uk: |
        Людина набирає «полити» в пошуку справ, а список має 5000 записів і рендериться 200 мс. Якщо поле й список оновлюються разом, кожна клавіша чекає на список: літера з’являється в полі лише через 200 мс, і набір «гальмує».

        Але ці два оновлення неоднакові:

        - **текст у полі** — [[urgent-update|термінове оновлення]]: людина чекає побачити літеру одразу;
        - **відфільтрований список** — [[non-urgent-update|нетермінове]]: якщо він з’явиться трохи пізніше, нічого не зламається.

        Нетермінове оновлення позначають хуком [[use-transition|useTransition]]. Ось інший приклад тієї самої ідеї — список категорій і важкий графік витрат під ним:

        ```jsx
        const [isPending, startTransition] = useTransition();

        function handleCategoryChange(event) {
          const next = event.target.value;
          setCategory(next);                               // термінове: сам список вибору
          startTransition(() => setChartCategory(next));   // нетермінове: графік
        }
        ```

        Сетер усередині `startTransition` каже React: «цей рендер можна відкласти й перервати». Тепер React спершу показує новий вибір, а графік готує потім. Для пошуку так само: спершу літера в полі, потім список. Поки готує, `isPending` дорівнює `true`, і на екрані лишається **старий** графік.
      en: |
        A person types “water” into the task search, and the list has 5,000 records and takes 200 ms to render. If the field and the list update together, every key waits for the list: the letter appears in the field only after 200 ms, and typing “lags”.

        But these two updates are not alike:

        - **the text in the field** is an [[urgent-update]]: the person expects to see the letter at once;
        - **the filtered list** is a [[non-urgent-update]]: if it appears a little later, nothing breaks.

        A non-urgent update is marked with the [[use-transition|useTransition]] hook. Here is another example of the same idea — a category select and a heavy expense chart below it:

        ```jsx
        const [isPending, startTransition] = useTransition();

        function handleCategoryChange(event) {
          const next = event.target.value;
          setCategory(next);                               // urgent: the select itself
          startTransition(() => setChartCategory(next));   // non-urgent: the chart
        }
        ```

        A setter inside `startTransition` tells React: “this render may be postponed and interrupted”. Now React first shows the new choice and prepares the chart afterwards. A search works the same way: first the letter in the field, then the list. While it prepares it, `isPending` is `true`, and the **old** chart stays on the screen.

  - id: not-faster
    kind: explanation
    title:
      uk: "Не швидше і не із затримкою"
      en: "Not faster and not delayed"
    body:
      uk: |
        `startTransition` не робить рендер списку швидшим: той самий список так само рендериться 200 мс. І це не затримка на кшталт «зачекай, поки людина перестане друкувати»: React починає рендер списку **одразу**. Різниця в іншому:

        - рендер у transition можна **перервати**. Прийшла нова клавіша — React кидає недороблений список, показує літеру й починає список наново, вже з новим запитом;
        - поки новий список не готовий, на екрані лишається старий, а `isPending` дає змогу це показати — наприклад, приглушити результати.

        Ще одне: текст самого поля в transition класти **не можна**. Поле показує значення зі стану, тож поки transition не завершився, React повертає в поле старий текст — і літери зникають. Поле завжди термінове.

        Список у прикладах обгорнуто в `memo` (RE-07). Без нього термінові рендери поля рендерили б і повільний список зі старим запитом — і транзиція нічого б не дала.
      en: |
        `startTransition` does not make the list render faster: the same list still takes 200 ms to render. Nor is it a delay of the “wait until the person stops typing” kind: React starts rendering the list **at once**. The difference lies elsewhere:

        - a render in a transition can be **interrupted**. A new key arrives — React drops the half-made list, shows the letter and starts the list over, now with the new query;
        - until the new list is ready, the old one stays on the screen, and `isPending` lets you show that — for example, by dimming the results.

        One more thing: the field's own text must **not** go into a transition. The field shows the value from state, so until the transition has finished, React puts the old text back into the field — and letters disappear. The field is always urgent.

        The list in the examples is wrapped in `memo` (RE-07). Without it, the field's urgent renders would also render the slow list with the old query — and the transition would gain nothing.

  - id: predict-three-keys
    kind: prediction
    lang: jsx
    runnable: false
    prompt:
      uk: "Список справ рендериться 200 мс і обгорнутий у `memo`. Людина набирає `w`, `a`, `t` з паузами по 60 мс. Що видно на екрані одразу після третьої клавіші, коли список оновлюється через `startTransition`?"
      en: "The task list takes 200 ms to render and is wrapped in `memo`. A person types `w`, `a`, `t` with 60 ms pauses. What is on the screen right after the third key, when the list is updated through `startTransition`?"
    code: |
      function handleChange(event) {
        setDraft(event.target.value);
        startTransition(() => setFilter(event.target.value));
      }

      <input value={draft} onChange={handleChange} />
      <TaskList query={filter} />
    answer:
      type: choice
      options:
        - id: field-new-list-old
          text: { uk: "У полі `wat`, а список ще старий — неприфільтрований; новий з’явиться приблизно через 200 мс", en: "The field shows `wat`, and the list is still the old one — unfiltered; the new one appears about 200 ms later" }
        - id: list-each-step
          text: { uk: "У полі `wat`, а список уже встиг показати результати для `w` і `wa` і зараз оновлюється для `wat`", en: "The field shows `wat`, and the list has already shown the results for `w` and `wa` and is now updating for `wat`" }
          why:
            uk: "Кожна наступна клавіша приходила раніше, ніж за 200 мс, тож React перервав рендери для `w` і `wa` й викинув їх. Вони так і не потрапили на екран — transition не робить рендер швидшим."
            en: "Each next key arrived sooner than 200 ms, so React interrupted the renders for `w` and `wa` and threw them away. They never reached the screen — a transition does not make a render faster."
        - id: field-lags
          text: { uk: "У полі лише `w`: решта літер з’явиться разом зі списком", en: "The field shows only `w`: the other letters appear together with the list" }
          why:
            uk: "Так поводилося б поле, якби його власний текст оновлювався в transition. Тут `setDraft` викликано поза `startTransition`, тож поле термінове й показує кожну літеру одразу."
            en: "That is how the field would behave if its own text were updated in a transition. Here `setDraft` is called outside `startTransition`, so the field is urgent and shows every letter at once."
        - id: debounce
          text: { uk: "У полі `wat`; список узагалі не почне рендеритися, доки людина не зробить паузу", en: "The field shows `wat`; the list does not even start rendering until the person pauses" }
          why:
            uk: "Transition — не затримка. React починає рендер списку одразу після кожної клавіші; він лише перериває його, коли надходить нова. Якби людина друкувала повільніше, ніж за 200 мс на літеру, кожен список устигав би з’явитися."
            en: "A transition is not a delay. React starts rendering the list right after every key; it only interrupts it when a new one arrives. If the person typed slower than 200 ms per letter, every list would have time to appear."
      correct: [field-new-list-old]
    explanation:
      uk: "Ми перевірили це в пісочниці з прикладом цього уроку: при паузах по 60 мс Profiler показав лише **один** повний рендер списку (близько 200 мс) — для `wat`. Рендери для `w` і `wa` були перервані й не дійшли до екрана. Поле ж показувало кожну літеру через 0–1 мс після клавіші. Без transition кожна літера чекала б 200 мс, і всі три списки рендерилися б до кінця."
      en: "We checked it in the sandbox with this lesson's example: with 60 ms pauses the Profiler showed only **one** full render of the list (about 200 ms) — for `wat`. The renders for `w` and `wa` were interrupted and never reached the screen. The field, meanwhile, showed every letter 0–1 ms after the key. Without a transition every letter would have waited 200 ms, and all three lists would have rendered to the end."

  - id: task-search
    kind: example
    runtime: browser-react
    dir: task-search
    entry: main.jsx
    strings:
      tasks: { uk: "Справи", en: "Tasks" }
      search: { uk: "Пошук", en: "Search" }
      found: { uk: "Знайдено", en: "Found" }
      keyToScreen: { uk: "клавіша → екран", en: "key → screen" }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      wardrobe: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
    title:
      uk: "Пошук у 5000 справ: виміряй, потім виправ"
      en: "Searching 5,000 tasks: measure, then fix"
    body:
      uk: |
        `tasks.js` створює 5000 справ, а `TaskList` показує перші 200 збігів. Кожен рядок навмисно займає головний потік на 1 мс, тож один рендер списку триває близько 200 мс — як справжній важкий список.

        Вимірюють тут дві речі, і обидві друкуються в **Консолі**:

        - компонент `<Profiler>` з React викликає `logListRender` після кожного commit, у якому рендерився `TaskList`, і передає йому тривалість рендеру — рядок `TaskList: … ms`;
        - ефект поля друкує «клавіша → екран: … ms» — скільки минуло від натискання до того, як нова літера стала на екрані.

        Натисни **Запустити** й повільно набери в пошуку `пол` (або `wat`). Подивись на обидва числа після кожної літери.
      en: |
        `tasks.js` creates 5,000 tasks, and `TaskList` shows the first 200 matches. Every row deliberately keeps the main thread busy for 1 ms, so one render of the list takes about 200 ms — like a real heavy list.

        Two things are measured here, and both are printed in the **Console**:

        - React's `<Profiler>` component calls `logListRender` after every commit in which `TaskList` rendered and passes it the render's duration — the line `TaskList: … ms`;
        - the field's effect prints “key → screen: … ms” — how much time passed from the key press until the new letter was on the screen.

        Press **Run** and slowly type `wat` (or `пол`) into the search. Look at both numbers after every letter.
    tryIt:
      uk: |
        1. Зараз кожна літера показує приблизно `TaskList: 200 ms` і «клавіша → екран: 200 ms»: поле чекає на список. Набери щось швидко — літери з’являються ривками.
        2. Познач список як нетерміновий. В імпорт з `"react"` додай `useTransition`. Під рядком коду з `useRef` напиши `const [isPending, startTransition] = useTransition();`, а в `handleChange` заміни `setQuery(event.target.value);` на `startTransition(() => setQuery(event.target.value));`. Запусти й набери знову: «клавіша → екран» тепер 0–1 мс, а рядків `TaskList` майже по 200 мс стало менше, ніж літер. Рядки `TaskList: 0 ms` — це термінові commit поля, у яких `memo` пропустив список.
        3. Покажи очікування. Замість `<Profiler id="TaskList" onRender={logListRender}>` напиши `<div style={{ opacity: isPending ? 0.5 : 1 }}><Profiler id="TaskList" onRender={logListRender}>`, а після `</Profiler>` додай `</div>`. Запусти й набери: старий список блякне, доки новий не готовий.
      en: |
        1. Right now every letter shows about `TaskList: 200 ms` and “key → screen: 200 ms”: the field waits for the list. Type something fast — the letters appear in jerks.
        2. Mark the list as non-urgent. Add `useTransition` to the import from `"react"`. Below the line of code with `useRef` write `const [isPending, startTransition] = useTransition();`, and in `handleChange` replace `setQuery(event.target.value);` with `startTransition(() => setQuery(event.target.value));`. Run and type again: “key → screen” is now 0–1 ms, and there are fewer `TaskList` lines of about 200 ms than letters. The `TaskList: 0 ms` lines are the field's urgent commits, in which `memo` skipped the list.
        3. Show the waiting. Instead of `<Profiler id="TaskList" onRender={logListRender}>` write `<div style={{ opacity: isPending ? 0.5 : 1 }}><Profiler id="TaskList" onRender={logListRender}>`, and after `</Profiler>` add `</div>`. Run and type: the old list fades until the new one is ready.

  - id: typing-steps
    kind: visual
    visual: render-timeline
    strings:
      q1: { uk: "п", en: "w" }
      q2: { uk: "по", en: "wa" }
      q3: { uk: "пол", en: "wat" }
      q4: { uk: "поли", en: "wate" }
      found: { uk: "Знайдено", en: "Found" }
    title:
      uk: "Чотири клавіші над повільним списком"
      en: "Four keys over a slow list"
    textEquivalent:
      uk: >-
        Рендер 1 показує порожнє поле й список з усіма 5000 справами. Людина набирає чотири літери, кожну раніше, ніж
        список устигає відрендеритися. Після кожної клавіші обробник викликає setDraft терміново і setFilter у
        startTransition. React одразу робить терміновий рендер: у полі нова літера, filter ще старий, isPending
        дорівнює true, і commit показує нову літеру над старим приглушеним списком. Потім React починає рендер списку в
        transition, але наступна клавіша перериває його: недороблений рендер викидається й ніколи не потрапляє на екран.
        Так стається з рендерами 3, 5 і 7. Після четвертої клавіші нових подій немає, рендер 9 у transition доходить до
        кінця, і commit показує список для «%%q4%%» без приглушення: isPending знову false. Чотири клавіші дали чотири
        термінові commit поля й лише один commit списку.
      en: >-
        Render 1 shows an empty field and the list with all 5,000 tasks. The person types four letters, each one before
        the list manages to render. After every key the handler calls setDraft urgently and setFilter inside
        startTransition. React does an urgent render at once: the field has the new letter, filter is still the old
        one, isPending is true, and the commit shows the new letter above the old, dimmed list. Then React starts the
        list render in the transition, but the next key interrupts it: the half-made render is thrown away and never
        reaches the screen. That happens to renders 3, 5 and 7. After the fourth key there are no new events, render 9
        in the transition runs to the end, and the commit shows the list for "%%q4%%" without dimming: isPending is false
        again. Four keys gave four urgent commits of the field and only one commit of the list.
    spec:
      component: TaskSearch
      code: |
        function TaskSearch() {
          const [draft, setDraft] = useState("");
          const [filter, setFilter] = useState("");
          const [isPending, startTransition] = useTransition();
          function handleChange(event) {
            setDraft(event.target.value);
            startTransition(() => setFilter(event.target.value));
          }
          return (
            <>
              <input value={draft} onChange={handleChange} />
              <div style={{ opacity: isPending ? 0.5 : 1 }}>
                <TaskList query={filter} />
              </div>
            </>
          );
        }
      steps:
        - phase: render
          render: 1
          line: 9
          reason: { uk: "перший показ", en: "first display" }
          snapshot: { state: { draft: "", filter: "", isPending: false } }
          caption:
            uk: "Рендер 1: поле порожнє, список показує всі справи."
            en: "Render 1: the field is empty, the list shows every task."
        - phase: commit
          render: 1
          line: 11
          dom: "<input value=\"\"> · %%found%%: 5000"
          caption:
            uk: "Commit 1: на екрані порожнє поле і 5000 знайдених справ."
            en: "Commit 1: the screen shows an empty field and 5,000 found tasks."
        - phase: event
          name: input
          line: 6
          sees: { draft: "", filter: "" }
          actions: ["setDraft(\"%%q1%%\")", "startTransition(() => setFilter(\"%%q1%%\"))"]
          caption:
            uk: "Перша клавіша: одне термінове оновлення й одне в transition."
            en: "The first key: one urgent update and one inside a transition."
        - phase: render
          render: 2
          line: 11
          reason: { uk: "термінове: текст поля", en: "urgent: the field's draft" }
          snapshot: { state: { draft: "%%q1%%", filter: "", isPending: true } }
          caption:
            uk: "Рендер 2 — терміновий: у `draft` нова літера, `filter` ще старий, `isPending` — `true`. `memo` пропускає список."
            en: "Render 2 is urgent: `draft` has the new letter, `filter` is still the old one, `isPending` is `true`. `memo` skips the list."
        - phase: commit
          render: 2
          line: 12
          dom: "<input value=\"%%q1%%\"> · %%found%%: 5000 (opacity 0.5)"
          caption:
            uk: "Commit 2: літера вже в полі, під нею старий список, приглушений."
            en: "Commit 2: the letter is already in the field, below it the old list, dimmed."
        - phase: render
          render: 3
          line: 13
          reason: { uk: "transition: список для нового запиту", en: "transition: the list for the new query" }
          snapshot: { state: { draft: "%%q1%%", filter: "%%q1%%", isPending: false } }
          caption:
            uk: "Рендер 3 — у transition: React готує список для «%%q1%%» шматочками й між ними перевіряє, чи не надійшло щось термінове."
            en: "Render 3 is in the transition: React prepares the list for “%%q1%%” in small pieces and between them checks whether something urgent has arrived."
        - phase: event
          name: input
          line: 6
          sees: { draft: "%%q1%%", filter: "" }
          actions: ["setDraft(\"%%q2%%\")", "startTransition(() => setFilter(\"%%q2%%\"))"]
          caption:
            uk: "Друга клавіша прийшла посеред рендеру 3. Рендер 3 **перервано й викинуто**: він ніколи не дійде до екрана."
            en: "The second key arrived in the middle of render 3. Render 3 is **interrupted and thrown away**: it will never reach the screen."
        - phase: render
          render: 4
          line: 11
          reason: { uk: "термінове: текст поля", en: "urgent: the field's draft" }
          snapshot: { state: { draft: "%%q2%%", filter: "", isPending: true } }
          caption:
            uk: "Рендер 4 — терміновий, як і рендер 2."
            en: "Render 4 is urgent, like render 2."
        - phase: commit
          render: 4
          line: 12
          dom: "<input value=\"%%q2%%\"> · %%found%%: 5000 (opacity 0.5)"
          caption:
            uk: "Commit 4: у полі «%%q2%%», список той самий старий."
            en: "Commit 4: the field shows “%%q2%%”, the list is the same old one."
        - phase: render
          render: 5
          line: 13
          reason: { uk: "transition почато наново", en: "the transition starts over" }
          snapshot: { state: { draft: "%%q2%%", filter: "%%q2%%", isPending: false } }
          caption:
            uk: "Рендер 5 починає список наново — уже для «%%q2%%»."
            en: "Render 5 starts the list over — now for “%%q2%%”."
        - phase: event
          name: input
          line: 6
          sees: { draft: "%%q2%%", filter: "" }
          actions: ["setDraft(\"%%q3%%\")", "startTransition(() => setFilter(\"%%q3%%\"))"]
          caption:
            uk: "Третя клавіша перериває рендер 5."
            en: "The third key interrupts render 5."
        - phase: render
          render: 6
          line: 11
          reason: { uk: "термінове: текст поля", en: "urgent: the field's draft" }
          snapshot: { state: { draft: "%%q3%%", filter: "", isPending: true } }
          caption:
            uk: "Рендер 6 — терміновий."
            en: "Render 6 is urgent."
        - phase: commit
          render: 6
          line: 12
          dom: "<input value=\"%%q3%%\"> · %%found%%: 5000 (opacity 0.5)"
          caption:
            uk: "Commit 6: у полі «%%q3%%»."
            en: "Commit 6: the field shows “%%q3%%”."
        - phase: render
          render: 7
          line: 13
