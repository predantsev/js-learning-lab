id: rn-02-02-styling-flexbox-density
unit: RN-02
title:
  uk: "Стилі, Flexbox і щільність екрана"
  en: "Styling, Flexbox and density"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачити нативну верстку Flexbox, знаючи, що напрямок за замовчуванням — column, а стилі не переходять від батьківських View до дітей (успадковуються лише стилі тексту всередині вкладених Text)."
    en: "Predict a native Flexbox layout, given that the default direction is column and that styles do not cascade from parent Views (only text styles inherit inside nested Text)."
  - uk: "Задавати розміри в незалежних від щільності одиницях і пояснити, як pixel ratio та масштаб шрифту користувача змінюють те, що видно на екрані."
    en: "Size elements in density-independent units and explain how pixel ratio and the user's font scale change what appears on screen."
prerequisites: [rn-02-01-view-text-image-input, js-06-05-flexbox-grid]
subskills:
  - { family: N-02, skill: "styling/Flexbox/density", depth: intro }
glossary: [density-independent-pixel, pixel-ratio, font-scale]
selfCheck: [predict-default-direction, habit-row]

blocks:
  - id: styles-are-objects
    kind: explanation
    title:
      uk: "Стилі — це об’єкти, а не CSS"
      en: "Styles are objects, not CSS"
    body:
      uk: |
        У React Native немає CSS-файлів і класів. Стиль — це об’єкт JavaScript з назвами у camelCase, а `StyleSheet.create` збирає їх в одному місці:

        ```jsx
        const styles = StyleSheet.create({
          row: { flexDirection: 'row', padding: 12, gap: 8 },
        });
        <View style={styles.row}>…</View>
        ```

        Кожен `View` — уже flex-контейнер ([[flexbox]]), але з іншими значеннями за замовчуванням, ніж у вебі:

        - `flexDirection` — **`column`**: діти стоять одне під одним, [[main-axis|головна вісь]] іде згори вниз;
        - `flexShrink` — **0**: дитина не стискається сама, тож довгому тексту в рядку дають `flexShrink: 1`.

        **Каскаду немає.** Стиль діє лише на той компонент, якому його передали. `flexDirection` на зовнішньому `View` розставляє тільки його прямих дітей, а колір чи розмір шрифту на `View` не дістанеться до `Text` усередині. Успадковуються лише стилі тексту — і тільки від батьківського `Text` до вкладеного `Text`.
      en: |
        React Native has no CSS files and no classes. A style is a JavaScript object with camelCase names, and `StyleSheet.create` gathers them in one place:

        ```jsx
        const styles = StyleSheet.create({
          row: { flexDirection: 'row', padding: 12, gap: 8 },
        });
        <View style={styles.row}>…</View>
        ```

        Every `View` is already a flex container ([[flexbox]]), but with different defaults than on the web:

        - `flexDirection` is **`column`**: children stand one under another, the [[main-axis|main axis]] runs top to bottom;
        - `flexShrink` is **0**: a child does not shrink by itself, so a long text in a row gets `flexShrink: 1`.

        **There is no cascade.** A style applies only to the component it was given to. `flexDirection` on an outer `View` arranges only its direct children, and a color or font size on a `View` does not reach the `Text` inside. Only text styles are inherited — and only from a parent `Text` to a nested `Text`.

  - id: predict-default-direction
    kind: prediction
    prompt:
      uk: "Екран — `View` з трьома дітьми: заголовок, список і панель з кнопкою. Ні в кого немає `flexDirection`. Як вони розташуються?"
      en: "A screen is a `View` with three children: a header, a list and a button bar. None of them has `flexDirection`. How do they arrange?"
    code: |
      <View style={{ height: 420 }}>
        <View style={styles.header} />
        <View style={styles.list} />
        <View style={styles.bar} />
      </View>
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: column
          text:
            uk: "Одне під одним, згори вниз, і під панеллю лишається вільне місце"
            en: "One under another, top to bottom, with free space left below the bar"
        - id: row
          text:
            uk: "В один ряд зліва направо, як блоки з display: flex у вебі"
            en: "In one row left to right, like boxes with display: flex on the web"
          why:
            uk: "У вебі `display: flex` справді дає ряд. У React Native напрямок за замовчуванням — `column`."
            en: "On the web `display: flex` does give a row. In React Native the default direction is `column`."
        - id: stretch
          text:
            uk: "Одне під одним, і список сам розтягнеться, щоб панель опинилася внизу"
            en: "One under another, and the list stretches by itself so the bar ends up at the bottom"
          why:
            uk: "Сам список нічого не займає: вільне місце вздовж головної осі забирає лише дитина з `flex: 1` (або `flexGrow`)."
            en: "The list takes nothing by itself: free space along the main axis is taken only by a child with `flex: 1` (or `flexGrow`)."
      correct: [column]
    explanation:
      uk: "Головна вісь іде згори вниз, тож діти стоять стовпчиком у порядку коду. Вільне місце лишається внизу, доки котрась дитина не отримає `flex: 1` — тоді вона його забере, а панель опуститься на дно екрана."
      en: "The main axis runs top to bottom, so the children stand in a column in code order. The free space stays at the bottom until one child gets `flex: 1` — then it takes the space, and the bar moves down to the bottom of the screen."

  - id: units-and-density
    kind: explanation
    title:
      uk: "Числа без px і два масштаби"
      en: "Numbers without px and two scales"
    body:
      uk: |
        `width: 48` у React Native — це не 48 фізичних пікселів, а 48 [[density-independent-pixel|незалежних від щільності одиниць]] (dp на Android, points на iOS). Скільки це справжніх пікселів, вирішує [[pixel-ratio|pixel ratio]] екрана — `PixelRatio.get()`:

        | pixel ratio | приклади з документації React Native | 48 одиниць = |
        |---|---|---|
        | 1 | Android mdpi | 48 px |
        | 2 | iPhone SE, iPhone 11 | 96 px |
        | 3 | iPhone 11 Pro, Pixel | 144 px |

        Тому кнопка заввишки 48 має той самий фізичний розмір під пальцем на різних телефонах.

        Другий масштаб — [[font-scale|масштаб шрифту]], який людина ставить у налаштуваннях телефона. `Text` застосовує його сам: `fontSize: 16` при 200 % займає місце 32 одиниць. Тексту має бути куди рости, тому висоту рядків і полів не фіксують — їх задають відступами, а висоту дає вміст.
      en: |
        `width: 48` in React Native is not 48 physical pixels but 48 [[density-independent-pixel|density-independent units]] (dp on Android, points on iOS). How many real pixels that is depends on the screen's [[pixel-ratio|pixel ratio]] — `PixelRatio.get()`:

        | pixel ratio | examples from the React Native docs | 48 units = |
        |---|---|---|
        | 1 | Android mdpi | 48 px |
        | 2 | iPhone SE, iPhone 11 | 96 px |
        | 3 | iPhone 11 Pro, Pixel | 144 px |

        That is why a 48-tall button has the same physical size under a finger on different phones.

        The second scale is the [[font-scale|font scale]] a person sets in the phone's settings. `Text` applies it by itself: `fontSize: 16` at 200 % takes the space of 32 units. Text needs room to grow, so the height of rows and fields is not fixed — they get padding, and the content gives the height.

  - id: row-steps
    kind: visual
    visual: diagram
    title:
      uk: "Екран по осях і одиниця в пікселях"
      en: "A screen along its axes, and a unit in pixels"
    textEquivalent:
      uk: "Ліворуч три дитини екрана: заголовок, список і панель. Без flexDirection вони стоять стовпчиком: головна вісь іде згори вниз. Коли список отримує flex: 1, він забирає все вільне місце вздовж головної осі, і панель опускається вниз. alignItems вирівнює дітей уздовж поперечної осі — зліва направо. Праворуч — кнопка заввишки 48 одиниць: на екрані з pixel ratio 1 це 48 фізичних пікселів, з pixel ratio 2 — 96, з pixel ratio 3 — 144. Фізичний розмір кнопки під пальцем від цього не змінюється."
      en: "On the left are the screen's three children: a header, a list and a bar. Without flexDirection they stand in a column: the main axis runs top to bottom. When the list gets flex: 1, it takes all the free space along the main axis and the bar moves to the bottom. alignItems aligns the children along the cross axis, left to right. On the right is a button 48 units tall: on a screen with pixel ratio 1 that is 48 physical pixels, with pixel ratio 2 it is 96, with pixel ratio 3 it is 144. The button's physical size under a finger does not change."
    spec:
      layout: grid
      nodes:
        - { id: header, label: { uk: "заголовок", en: "header" }, col: 0, row: 0 }
        - { id: list, label: { uk: "список", en: "list" }, col: 0, row: 1 }
        - { id: bar, label: { uk: "панель", en: "bar" }, col: 0, row: 2 }
        - { id: button, label: { uk: "кнопка: 48", en: "button: 48" }, shape: round, col: 1, row: 0 }
        - { id: px1, label: "@1x → 48 px", shape: pill, col: 1, row: 1 }
        - { id: px2, label: "@2x → 96 px", shape: pill, col: 1, row: 2 }
        - { id: px3, label: "@3x → 144 px", shape: pill, col: 1, row: 3 }
      edges:
        - { id: axis-1, from: header, to: list }
        - { id: axis-2, from: list, to: bar }
        - { id: to-1, from: button, to: px1, kind: dashed }
        - { id: to-2, from: button, to: px2, kind: dashed }
        - { id: to-3, from: button, to: px3, kind: dashed }
      hidden: [button, px1, px2, px3, to-1, to-2, to-3]
      steps:
        - highlight: [header, list, bar, axis-1, axis-2]
          caption:
            uk: "Без `flexDirection` діти стоять стовпчиком: головна вісь іде згори вниз, у порядку коду."
            en: "Without `flexDirection` the children stand in a column: the main axis runs top to bottom, in code order."
        - highlight: [list]
          annotate:
            - { id: list, text: "flex: 1" }
          caption:
            uk: "Список з `flex: 1` забирає все вільне місце вздовж головної осі, тож панель опускається на дно екрана."
            en: "The list with `flex: 1` takes all the free space along the main axis, so the bar moves to the bottom of the screen."
        - highlight: [header, bar]
          annotate:
            - { id: header, text: { uk: "alignItems: поперек", en: "alignItems: across" } }
          caption:
            uk: "`justifyContent` розподіляє дітей уздовж головної осі, `alignItems` вирівнює їх уздовж поперечної — тут зліва направо."
            en: "`justifyContent` distributes children along the main axis, `alignItems` aligns them along the cross axis — here, left to right."
        - show: [button]
          highlight: [button]
          caption:
            uk: "Кнопка заввишки `48` — це 48 незалежних від щільності одиниць, а не пікселів."
            en: "A button `48` tall means 48 density-independent units, not pixels."
        - show: [px1, px2, px3, to-1, to-2, to-3]
          highlight: [px1, px2, px3, to-1, to-2, to-3]
          caption:
            uk: "Pixel ratio множить одиниці на фізичні пікселі: 48, 96 або 144. Під пальцем кнопка має той самий розмір."
            en: "The pixel ratio multiplies units into physical pixels: 48, 96 or 144. Under a finger the button has the same size."

  - id: predict-pixels
    kind: prediction
    prompt:
      uk: "Кнопка має `height: 48`. Скільки фізичних пікселів заввишки вона на телефоні, де `PixelRatio.get()` повертає 3?"
      en: "A button has `height: 48`. How many physical pixels tall is it on a phone where `PixelRatio.get()` returns 3?"
    answer:
      type: text
      accept: ["144", "144 px", "144px", "144 пікселі", "144 пікселів"]
      placeholder: { uk: "число пікселів", en: "number of pixels" }
    explanation:
      uk: "48 одиниць × pixel ratio 3 = 144 фізичних пікселі. Відповідь «48» — це вебзвичка вважати число в стилі пікселями; у React Native воно завжди в незалежних від щільності одиницях."
      en: "48 units × pixel ratio 3 = 144 physical pixels. The answer “48” is the web habit of reading a style number as pixels; in React Native it is always in density-independent units."

  - id: planner-screen
    kind: example
    runtime: concept-preview
    dir: planner-screen
    entry: main.jsx
    strings:
      today: { uk: "Справи на сьогодні", en: "Today's tasks" }
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      add: { uk: "Додати справу", en: "Add a task" }
    title:
      uk: "Екран планувальника в рамці телефона"
      en: "A planner screen in a phone frame"
    body:
      uk: |
        Рамка 300 × 420 одиниць грає роль екрана. Натисни **Запустити**: заголовок, список і панель стоять стовпчиком, а під панеллю порожньо.

        Файл `device.js` імітує системний розмір тексту, а `ScaledText.jsx` множить на нього `fontSize`. На телефоні цього файла не буде: звичайний `Text` масштабується сам.
      en: |
        A 300 × 420 frame plays the screen. Press **Run**: the header, the list and the bar stand in a column, with empty space below the bar.

        The file `device.js` simulates the system text size, and `ScaledText.jsx` multiplies `fontSize` by it. On a phone this file does not exist: a plain `Text` scales by itself.
    tryIt:
      uk: |
        1. Додай `flexDirection: 'row'` у `styles.screen` і запусти: три частини стали в ряд. Прибери цей рядок.
        2. Додай `flex: 1` у `styles.list` і запусти: список забрав вільне місце, панель опустилася вниз.
        3. У `device.js` зміни `FONT_SCALE` на `2` і запусти: це 200 %. Довгі справи переходять на другий рядок тексту, а рядок списку з `height: 40` їх обрізає. Заміни в `styles.row` властивість `height: 40` на `paddingVertical: 10`: рядки виросли разом з текстом.
      en: |
        1. Add `flexDirection: 'row'` to `styles.screen` and run: the three parts now stand in a row. Remove that line.
        2. Add `flex: 1` to `styles.list` and run: the list took the free space, the bar moved to the bottom.
        3. In `device.js` change `FONT_SCALE` to `2` and run: that is 200 %. The long tasks wrap onto a second line of text, and the list row with `height: 40` cuts them off. In `styles.row` replace `height: 40` with `paddingVertical: 10`: the rows grew with the text.
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не нативний застосунок. Розмір тексту тут імітує `device.js`; на телефоні його задає система, і `Text` застосовує його сам. Pixel ratio тут дорівнює pixel ratio браузера, а не телефона. Одна виміряна відмінність: у перегляді `Text` у ряду стискається, як у вебі, а на пристрої `flexShrink` за замовчуванням 0 — довгому тексту його задають самі. Шрифти й вигляд — браузерні; перевірка на пристрої — у локальних завданнях на заявленій цілі."
      en: "This is a browser preview through react-native-web, not a native app. The text size here is simulated by `device.js`; on a phone the system sets it, and `Text` applies it by itself. The pixel ratio here is the browser's, not the phone's. One measured difference: in the preview a `Text` in a row shrinks as on the web, while on a device `flexShrink` defaults to 0 — you set it for a long text yourself. Fonts and the look are the browser's; checking on a device happens in the local tasks on your declared target."

  - id: recall-axes
    kind: review
    title:
      uk: "Пригадай: осі Flexbox"
      en: "Recall: Flexbox axes"
    items:
      - id: justify-vs-align
        from: js-06-05-flexbox-grid
        prompt:
          uk: "У флекс-контейнері діти стоять у ряд зліва направо. Яка властивість вирівнює їх по вертикалі — наприклад, ставить посередині висоти?"
          en: "In a flex container the children stand in a row, left to right. Which property aligns them vertically — for example, centers them in the height?"
        answer:
          type: choice
          options:
            - id: align
              text:
                uk: "align-items — вона працює вздовж поперечної осі"
                en: "align-items — it works along the cross axis"
            - id: justify
              text:
                uk: "justify-content — вона відповідає за вертикаль"
                en: "justify-content — it handles the vertical"
              why:
                uk: "`justify-content` працює вздовж головної осі. У ряду вона горизонтальна, тож вертикаль — поперечна вісь."
                en: "`justify-content` works along the main axis. In a row that is horizontal, so the vertical is the cross axis."
            - id: direction
              text:
                uk: "flex-direction: column"
                en: "flex-direction: column"
              why:
                uk: "Це змінить напрямок самого ряду: діти стануть одне під одним, а не вирівняються по вертикалі."
                en: "That changes the direction of the row itself: the children stack up instead of aligning vertically."
          correct: [align]
        explanation:
          uk: "Головна вісь іде вздовж `flex-direction`, поперечна — впоперек неї. У ряду вертикаль поперечна, тож її вирівнює `align-items`. У React Native так само — тільки головна вісь за замовчуванням іде згори вниз, тож там `alignItems` вирівнює зліва направо."
          en: "The main axis follows `flex-direction`, the cross axis runs across it. In a row the vertical is the cross axis, so `align-items` aligns it. React Native works the same way — only its default main axis runs top to bottom, so there `alignItems` aligns left to right."

  - id: habit-row
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: habit-row
    entry: main.jsx
    editable: [HabitRow.jsx]
    strings:
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      wordsDetails: { uk: "щодня · на паузі", en: "daily · paused" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      exerciseDetails: { uk: "щодня · активна", en: "daily · active" }
    title:
      uk: "Рядок звички, що читається при 200 %"
      en: "A habit row that reads at 200 %"
    instructions:
      uk: |
        У `HabitRow.jsx` розмітку вже написано — заповни лише `styles` через `StyleSheet.create`. Перегляд показує дві звички при імітованому розмірі тексту 200 % (`device.js`).

        Потрібно:

        - назва звички й кількість виконань — в одному рядку, кількість — біля правого краю цього рядка;
        - деталі (частота й стан) — під цим рядком;
        - у рядка є внутрішні відступи щонайменше 8 одиниць зліва й згори;
        - при 200 % нічого не обрізається й не вилазить за межі рядка.
      en: |
        In `HabitRow.jsx` the markup is already written — fill in only `styles` with `StyleSheet.create`. The preview shows two habits at a simulated 200 % text size (`device.js`).

        Required:

        - the habit's name and its completion count on one line, the count at the right edge of that line;
        - the details (frequency and state) below that line;
        - the row has padding of at least 8 units on the left and at the top;
        - at 200 % nothing is cut off or sticks out of the row.
    limits:
      uk: "Перевірки міряють верстку в перегляді react-native-web при імітованих 200 %. Справжній системний розмір тексту, шрифти пристрою і `flexShrink: 0` нативних `Text` тут не відтворено (у перегляді `Text` у ряду стискається, як у вебі) — тож `flexShrink: 1` для назви перевіряють на заявленій цілі."
      en: "The checks measure the layout in the react-native-web preview at a simulated 200 %. The real system text size, device fonts and the `flexShrink: 0` of native `Text` are not reproduced here (in the preview a `Text` in a row shrinks as on the web) — so `flexShrink: 1` on the name is checked on your declared target."
    testTitles:
      "the name and the count share one line":
        uk: "Назва й кількість стоять в одному рядку"
        en: "The name and the count share one line"
      "the count sits at the right edge of its line":
        uk: "Кількість — біля правого краю свого рядка"
        en: "The count sits at the right edge of its line"
      "the details sit below the name line":
        uk: "Деталі стоять під рядком з назвою"
        en: "The details sit below the name line"
      "nothing is cut off at 200 % text size":
        uk: "При 200 % нічого не обрізається"
        en: "Nothing is cut off at 200 % text size"
      "the row has padding":
        uk: "Рядок має відступи щонайменше 8 зліва й згори"
        en: "The row has padding of at least 8 on the left and at the top"
    hints:
      nudge:
        uk: "Який компонент є прямим батьком назви й кількості? Саме його напрямок вирішує, чи стоять вони поруч."
        en: "Which component is the direct parent of the name and the count? Its direction decides whether they stand side by side."
      explanation:
        uk: "Стиль діє лише на прямих дітей: щоб дві частини стали поруч, ряд задають їхньому найближчому батькові, а не зовнішньому контейнеру. Притиснути останню дитину до краю можна двома способами — розподілом уздовж головної осі (як у вебі `justify-content: space-between`) або дитиною, що забирає вільне місце. А щоб текст міг рости, у контейнера не повинно бути фіксованої висоти: висоту дають відступи й вміст."
        en: "A style acts only on direct children: to put two parts side by side, give the row direction to their nearest parent, not the outer container. You can push the last child to the edge in two ways — by distribution along the main axis (like `justify-content: space-between` on the web) or with a child that takes the free space. And for text to grow, the container must have no fixed height: padding and content give the height."
    solutionNote:
      uk: "`topLine` отримав `flexDirection: 'row'` і `justifyContent: 'space-between'` — це прямий батько назви й кількості. Деталі стоять під ним, бо `row` лишився стовпчиком за замовчуванням. Висоту ніде не зафіксовано, тож при 200 % рядок росте. `flexShrink: 1` у назви не потрібен у перегляді, але потрібен на пристрої, де за замовчуванням він 0, — інакше довга назва виштовхне кількість за край."
      en: "`topLine` got `flexDirection: 'row'` and `justifyContent: 'space-between'` — it is the direct parent of the name and the count. The details stand below it because `row` stayed a column by default. No height is fixed anywhere, so at 200 % the row grows. `flexShrink: 1` on the name is not needed in the preview, but it is on a device, where it defaults to 0 — otherwise a long name pushes the count past the edge."
    feedback:
      - when: { test: "the name and the count share one line" }
        message:
          uk: "Ця перевірка чекає, що кількість стоїть праворуч від назви на тій самій висоті. Напрямок ряду діє лише на прямих дітей — подивись, хто прямий батько назви й кількості."
          en: "This check expects the count to stand to the right of the name at the same height. A row direction acts only on direct children — look at who the direct parent of the name and the count is."
      - when: { test: "the details sit below the name line" }
        message:
          uk: "Ця перевірка чекає, що деталі починаються нижче за рядок з назвою. Якщо вони опинилися збоку, ряд задано зовнішньому `row`, а не `topLine`."
          en: "This check expects the details to start below the name line. If they ended up to the side, the row direction was given to the outer `row`, not to `topLine`."
      - when: { test: "nothing is cut off at 200 % text size" }
        message:
          uk: "Ця перевірка чекає, що вміст рядка вміщається в рядок при 200 %. Фіксована `height` не росте разом з текстом — задай відступи замість неї."
          en: "This check expects the row's content to fit inside the row at 200 %. A fixed `height` does not grow with the text — use padding instead."

  - id: to-project
    kind: transfer
    capstoneStep: RN-02
    body:
      uk: "У кроці проєкту рядки твого списку й поля форми в `native/` отримають стилі через `StyleSheet.create`: назва й головне значення запису в одному рядку, подробиці під ним, відступи в незалежних від щільності одиницях і жодної фіксованої висоти, що обріже текст при збільшеному шрифті."
      en: "In the project step the rows of your list and the fields of your form in `native/` get their styles through `StyleSheet.create`: the record's name and main value on one line, details below, spacing in density-independent units and no fixed height that would cut the text at a larger font."
