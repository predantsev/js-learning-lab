id: rn-02-04-touch-targets-keyboard
unit: RN-02
title:
  uk: "Зони дотику й клавіатура над полями"
  en: "Touch targets and keyboard avoidance"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Робити зони дотику не меншими за мінімум платформ (близько 44–48 одиниць) через padding або hitSlop, не збільшуючи саму іконку."
    en: "Size touch targets to the platform minimum (about 44–48 units) with padding or hitSlop, without enlarging the visual."
  - uk: "Передбачити, коли екранна клавіатура закриє поле у фокусі, і залишати його видимим через KeyboardAvoidingView або прокручувану форму."
    en: "Predict when the soft keyboard covers a focused input, and keep it visible with KeyboardAvoidingView or a scrolling form."
prerequisites: [rn-02-03-safe-areas, rn-02-01-view-text-image-input]
subskills:
  - { family: N-02, skill: "touch targets", depth: intro }
  - { family: N-02, skill: "keyboard avoidance", depth: intro }
glossary: [touch-target, hit-slop, soft-keyboard, keyboard-avoidance]
selfCheck: [predict-icon-size, task-screen]

blocks:
  - id: finger-not-cursor
    kind: explanation
    title:
      uk: "Палець — не курсор"
      en: "A finger is not a cursor"
    body:
      uk: |
        Курсор миші влучає в один піксель, а палець накриває пляму завширшки з сантиметр. Тому платформи радять мінімальну [[touch-target|зону дотику]]: **44 × 44** points в Apple Human Interface Guidelines і **48 × 48** dp у Material Design для Android.

        Іконка може бути маленькою — велика має бути область, яка реагує на натискання. Є два способи:

        - **padding** у `Pressable`: іконка 24 + по 12 з кожного боку = 48. Область видно в розмітці, і її легко перевірити;
        - [[hit-slop|hitSlop]]: `hitSlop={12}` додає невидиму смугу довкола елемента, не змінюючи верстку. Документація React Native попереджає: ця смуга не виходить за межі батьківського `View`, а сусід, що лежить вище за `zIndex`, перехоплює дотик.

        Видима іконка 24 × 24 без жодного з них — це ціль, у яку промахуються, особливо в русі чи однією рукою.
      en: |
        A mouse cursor hits a single pixel, while a finger covers a spot about a centimetre wide. That is why the platforms recommend a minimum [[touch-target|touch target]]: **44 × 44** points in Apple's Human Interface Guidelines and **48 × 48** dp in Material Design for Android.

        The icon may be small — what must be big is the area that responds to a press. There are two ways:

        - **padding** on the `Pressable`: a 24 icon + 12 on each side = 48. The area is visible in the layout and easy to check;
        - [[hit-slop|hitSlop]]: `hitSlop={12}` adds an invisible band around the element without changing the layout. The React Native documentation warns that this band never extends past the parent `View`, and a sibling with a higher `zIndex` takes the touch.

        A visible 24 × 24 icon with neither is a target people miss, especially on the move or one-handed.

  - id: predict-icon-size
    kind: prediction
    prompt:
      uk: "Кнопка видалення — це `Pressable` без стилів, а в ньому іконка 24 × 24. Іконку чудово видно. Чи досить цього для зони дотику?"
      en: "A delete button is a `Pressable` with no styles, holding a 24 × 24 icon. The icon is clearly visible. Is that enough for a touch target?"
    answer:
      type: choice
      options:
        - id: too-small
          text:
            uk: "Ні: область натискання теж 24 × 24 — удвічі менша за 48 і помітно менша за 44"
            en: "No: the pressable area is also 24 × 24 — half of 48 and well under 44"
        - id: visible-enough
          text:
            uk: "Так: якщо іконку добре видно, у неї легко влучити"
            en: "Yes: if the icon is easy to see, it is easy to hit"
          why:
            uk: "Видимість і розмір цілі — різні речі. Палець накриває більше, ніж 24 одиниці, і промахується повз маленьку область, хоч яка вона помітна."
            en: "Being visible and being big enough are different things. A finger covers more than 24 units and misses a small area, however noticeable it is."
        - id: os-enlarges
          text:
            uk: "Так: телефон сам збільшує область натискання маленьких кнопок"
            en: "Yes: the phone enlarges the pressable area of small buttons by itself"
          why:
            uk: "`Pressable` реагує лише в межах своєї рамки плюс `hitSlop`, якщо ти його задав. Сам по собі він нічого не розширює."
            en: "A `Pressable` responds only within its own box plus `hitSlop` if you set one. It does not enlarge anything by itself."
      correct: [too-small]
    explanation:
      uk: "`Pressable` без стилів обіймає свій вміст, тож область натискання дорівнює іконці — 24 × 24. Щоб дійти до 48, додають `padding: 12` або `hitSlop={12}`; іконка лишається 24."
      en: "A `Pressable` with no styles wraps its content, so the pressable area equals the icon — 24 × 24. To reach 48 you add `padding: 12` or `hitSlop={12}`; the icon stays 24."

  - id: keyboard-covers
    kind: explanation
    title:
      uk: "Клавіатура забирає пів екрана"
      en: "The keyboard takes half of the screen"
    body:
      uk: |
        Коли поле отримує фокус, з’являється [[soft-keyboard|екранна клавіатура]] — і закриває нижню частину екрана. На iOS система не посуне твій вміст сама; на Android результат залежить від налаштувань вікна застосунку й версії системи. Тож на «система прокрутить» не розраховують, а дбають про це в коді — це [[keyboard-avoidance|уникання клавіатури]]:

        - `KeyboardAvoidingView` з `react-native` змінює свою висоту, положення або нижній відступ на висоту клавіатури — залежно від `behavior`: `'height'`, `'position'` чи `'padding'`;
        - усередині нього форма стоїть у `ScrollView`, щоб усе, що не вміщається над клавіатурою, можна було докрутити.

        Який `behavior` працює краще, різниться між платформами: посібник Expo радить `'padding'` для iOS. Як вибирати значення для кожної платформи, буде в уроці про відмінності платформ, а перевіряють результат завжди на заявленій цілі.
      en: |
        When a field gets focus, the [[soft-keyboard|soft keyboard]] appears — and covers the bottom of the screen. On iOS the system does not move your content by itself; on Android the result depends on the app's window settings and the system version. So nobody relies on “the system will scroll”; it is handled in code — that is [[keyboard-avoidance|keyboard avoidance]]:

        - `KeyboardAvoidingView` from `react-native` changes its height, position or bottom padding by the keyboard's height — depending on `behavior`: `'height'`, `'position'` or `'padding'`;
        - inside it the form sits in a `ScrollView`, so anything that does not fit above the keyboard can be scrolled into view.

        Which `behavior` works best differs between platforms: the Expo guide recommends `'padding'` for iOS. How to pick a value per platform comes in the lesson on platform differences, and the result is always checked on the declared target.

  - id: target-and-keyboard
    kind: visual
    visual: diagram
    title:
      uk: "Зона дотику і форма над клавіатурою"
      en: "A touch target and a form above the keyboard"
    textEquivalent:
      uk: "Згори — рядок з іконкою видалення 24 × 24. Без відступів її область натискання теж 24 × 24; з padding 12 з кожного боку область стає 48 × 48, а іконка лишається 24. Нижче — форма з трьома полями й кнопкою «Зберегти». Коли останнє поле отримує фокус, знизу піднімається клавіатура заввишки 260 одиниць і закриває кнопку. KeyboardAvoidingView з behavior padding додає формі нижній відступ на висоту клавіатури, тож прокручувана частина закінчується над клавіатурою, і кнопку можна докрутити у видиму частину."
      en: "At the top is a row with a 24 × 24 delete icon. Without padding its pressable area is also 24 × 24; with 12 of padding on each side the area becomes 48 × 48 while the icon stays 24. Below is a form with three fields and a Save button. When the last field gets focus, a 260-unit keyboard rises from the bottom and covers the button. KeyboardAvoidingView with behavior padding gives the form a bottom padding as tall as the keyboard, so the scrolling part ends above the keyboard and the button can be scrolled into the visible part."
    spec:
      layout: grid
      nodes:
        - { id: icon, label: { uk: "іконка ✕ 24 × 24", en: "✕ icon 24 × 24" }, w: 220, col: 0, row: 0 }
        - { id: area, label: { uk: "область натискання", en: "pressable area" }, shape: round, w: 220, col: 0, row: 1 }
        - { id: fields, label: { uk: "поля форми", en: "form fields" }, w: 220, col: 0, row: 2 }
        - { id: save, label: { uk: "кнопка «Зберегти»", en: "Save button" }, w: 220, col: 0, row: 3 }
        - { id: keyboard, label: { uk: "клавіатура: 260", en: "keyboard: 260" }, shape: note, w: 220, col: 0, row: 4 }
      edges:
        - { id: icon-area, from: icon, to: area, kind: dashed }
        - { id: fields-save, from: fields, to: save, kind: line }
        - { id: save-keyboard, from: save, to: keyboard, kind: line }
      hidden: [keyboard, save-keyboard]
      steps:
        - highlight: [icon, area, icon-area]
          annotate:
            - { id: area, text: "24 × 24" }
          caption:
            uk: "`Pressable` без стилів обіймає іконку: область натискання теж 24 × 24 — замало для пальця."
            en: "A `Pressable` with no styles wraps the icon: the pressable area is also 24 × 24 — too small for a finger."
        - highlight: [area]
          annotate:
            - { id: area, text: "padding 12 → 48 × 48" }
          caption:
            uk: "`padding: 12` з кожного боку робить область 48 × 48, а іконка лишається 24 × 24. `hitSlop={12}` дав би те саме без зміни верстки."
            en: "`padding: 12` on each side makes the area 48 × 48 while the icon stays 24 × 24. `hitSlop={12}` would give the same without changing the layout."
        - show: [keyboard, save-keyboard]
          highlight: [keyboard, save]
          annotate:
            - { id: save, text: { uk: "під клавіатурою", en: "under the keyboard" } }
          caption:
            uk: "Фокус в останньому полі: клавіатура піднімається на 260 одиниць і закриває кнопку «Зберегти»."
            en: "Focus in the last field: the keyboard rises 260 units and covers the Save button."
        - highlight: [fields, save]
          annotate:
            - { id: fields, text: "paddingBottom: 260" }
            - { id: save, text: { uk: "докручується", en: "scrolls into view" } }
          caption:
            uk: "`KeyboardAvoidingView` з `behavior=\"padding\"` додає формі нижній відступ на висоту клавіатури: `ScrollView` закінчується над нею, і кнопку можна докрутити."
            en: "`KeyboardAvoidingView` with `behavior=\"padding\"` gives the form a bottom padding as tall as the keyboard: the `ScrollView` ends above it, and the button can be scrolled into view."

  - id: predict-last-field
    kind: prediction
    prompt:
      uk: "Форма на весь екран: п’ять полів і кнопка внизу, без `KeyboardAvoidingView`. Людина торкається останнього поля. Що побачить людина на iPhone?"
      en: "A full-screen form: five fields and a button at the bottom, no `KeyboardAvoidingView`. A person taps the last field. What does the person see on an iPhone?"
    answer:
      type: choice
      options:
        - id: covered
          text:
            uk: "Клавіатура закриє останнє поле й кнопку; людина вводить текст наосліп"
            en: "The keyboard covers the last field and the button; the person types blind"
        - id: auto-scroll
          text:
            uk: "Система сама прокрутить форму, і поле опиниться над клавіатурою"
            en: "The system scrolls the form by itself, and the field ends up above the keyboard"
          why:
            uk: "Так поводиться браузер з вебсторінкою, але не нативний застосунок на iOS: вміст лишається на місці, доки ти сам не посунеш його."
            en: "That is how a browser treats a web page, but not a native app on iOS: the content stays where it is until you move it yourself."
        - id: resize
          text:
            uk: "Екран стиснеться до місця над клавіатурою, і всі поля вмістяться"
            en: "The screen shrinks to the space above the keyboard, and every field fits"
          why:
            uk: "На iOS вікно застосунку не стискається. Та навіть стиснений екран не вмістив би п’ять полів і кнопку без прокрутки."
            en: "On iOS the app window does not shrink. And even a shrunk screen would not fit five fields and a button without scrolling."
      correct: [covered]
    explanation:
      uk: "Без уникання клавіатури вміст на iOS не рухається, тож нижня частина форми ховається. `KeyboardAvoidingView` разом з `ScrollView` залишають поле й кнопку досяжними. На Android поведінка залежить від налаштувань вікна, тож перевіряють обидві платформи на заявленій цілі."
      en: "Without keyboard avoidance the content on iOS does not move, so the bottom of the form hides. `KeyboardAvoidingView` together with a `ScrollView` keeps the field and the button reachable. On Android the behavior depends on the window settings, so both platforms are checked on the declared target."

  - id: habit-form
    kind: example
    runtime: concept-preview
    dir: habit-form
    entry: main.jsx
    strings:
      water: { uk: "Пити воду", en: "Drink water" }
      remove: { uk: "Видалити звичку", en: "Delete habit" }
      removed: { uk: "Звичку видалено", en: "Habit deleted" }
      name: { uk: "Назва", en: "Name" }
      frequency: { uk: "Частота", en: "Frequency" }
      note: { uk: "Нотатка", en: "Note" }
      save: { uk: "Зберегти звичку", en: "Save habit" }
      keyboard: { uk: "клавіатура (імітація)", en: "keyboard (simulated)" }
    title:
      uk: "Маленька іконка і форма під клавіатурою"
      en: "A small icon and a form under the keyboard"
    body:
      uk: |
        `SimulatedKeyboard.jsx` малює екран 300 × 560 з уже відкритою клавіатурою (260 одиниць) і дає `SimulatedKeyboardAvoidingView`, що поводиться як `KeyboardAvoidingView` з `behavior="padding"`. Пунктирна рамка показує область натискання кнопки видалення. Натисни **Запустити**: рамка ледь більша за хрестик, а кнопку «Зберегти звичку» закриває клавіатура.
      en: |
        `SimulatedKeyboard.jsx` draws a 300 × 560 screen with the keyboard already open (260 units) and provides `SimulatedKeyboardAvoidingView`, which behaves like `KeyboardAvoidingView` with `behavior="padding"`. The dashed border shows the pressable area of the delete button. Press **Run**: the border is barely bigger than the cross, and the keyboard covers the “Save habit” button.
    tryIt:
      uk: |
        1. Додай `padding: 10` у `styles.deleteButton` і запусти: пунктирна рамка виросла до 46 × 46 (24 іконки, по 10 відступу з кожного боку й по 1 на саму пунктирну лінію), а хрестик — ні. Натисни біля хрестика, а не на нього: у консолі з’явиться «Звичку видалено».
        2. Заміни `<View style={styles.form}>` на `<SimulatedKeyboardAvoidingView behavior="padding" style={styles.form}>` (і закривальний `</View>` під `</ScrollView>` — на `</SimulatedKeyboardAvoidingView>`). Запусти й прокрути форму: тепер кнопку можна докрутити над клавіатуру.
      en: |
        1. Add `padding: 10` to `styles.deleteButton` and run: the dashed border grew to 46 × 46 (24 of icon, 10 of padding on each side and 1 for the dashed line itself), the cross did not. Press next to the cross, not on it: “Habit deleted” appears in the console.
        2. Replace `<View style={styles.form}>` with `<SimulatedKeyboardAvoidingView behavior="padding" style={styles.form}>` (and the closing `</View>` under `</ScrollView>` with `</SimulatedKeyboardAvoidingView>`). Run and scroll the form: now the button can be scrolled above the keyboard.
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не нативний застосунок. Клавіатуру тут малює `SimulatedKeyboard.jsx`: вона відкрита завжди й має сталу висоту, а справжні висота, анімація й поведінка клавіатури різні на iOS і Android. `KeyboardAvoidingView` з `react-native` у перегляді нічого не робить, тому його замінює імітація. `hitSlop` перегляд не застосовує (виміряно: область лишається розміром з елемент), тому тут видно лише padding. Мишка — не палець; зону дотику перевіряють пальцем на заявленій цілі."
      en: "This is a browser preview through react-native-web, not a native app. The keyboard here is drawn by `SimulatedKeyboard.jsx`: it is always open and has a fixed height, while the real keyboard's height, animation and behavior differ on iOS and Android. `KeyboardAvoidingView` from `react-native` does nothing in the preview, so the simulation replaces it. The preview does not apply `hitSlop` (measured: the area stays the size of the element), so only padding is visible here. A mouse is not a finger; touch targets are checked with a finger on your declared target."

  - id: task-screen
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: task-screen
    entry: main.jsx
    editable: [TaskScreen.jsx]
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      remove: { uk: "Видалити", en: "Delete" }
      taskTitle: { uk: "Назва справи", en: "Task title" }
      dueDate: { uk: "Термін", en: "Due date" }
      priority: { uk: "Пріоритет", en: "Priority" }
      save: { uk: "Зберегти справу", en: "Save task" }
      keyboard: { uk: "клавіатура (імітація)", en: "keyboard (simulated)" }
    title:
      uk: "Планувальник: кнопка видалення й форма з клавіатурою"
      en: "Planner: a delete button and a form with the keyboard"
    instructions:
      uk: |
        Екран планувальника має дві проблеми. Виправ їх у `TaskScreen.jsx`:

        1. `DeleteButton`: область натискання — щонайменше 48 × 48, а іконка з `testID="delete-icon"` лишається 24 × 24. Натискання й далі видаляє справу. Збільш сам `Pressable` (відступами чи розміром): перегляд не застосовує `hitSlop`, тож перевірка його не побачить.
        2. `TaskForm`: коли відкрита клавіатура, кнопку «Зберегти справу» можна побачити над нею — одразу або докрутивши форму. Компоненти для цього вже імпортовано.
      en: |
        The planner screen has two problems. Fix them in `TaskScreen.jsx`:

        1. `DeleteButton`: the pressable area is at least 48 × 48, while the icon with `testID="delete-icon"` stays 24 × 24. Pressing still deletes the task. Enlarge the `Pressable` itself (with padding or a size): the preview does not apply `hitSlop`, so the check would not see it.
        2. `TaskForm`: with the keyboard open, the “Save task” button can be seen above it — right away or after scrolling the form. The components for this are already imported.
    limits:
      uk: "Перевірки міряють рамки в перегляді react-native-web з імітованою клавіатурою сталої висоти й прокручують форму програмно. Справжню клавіатуру, `KeyboardAvoidingView`, `hitSlop` і натискання пальцем перевіряють на заявленій цілі."
      en: "The checks measure boxes in the react-native-web preview with a simulated fixed-height keyboard and scroll the form programmatically. The real keyboard, `KeyboardAvoidingView`, `hitSlop` and finger presses are checked on your declared target."
    testTitles:
      "every delete button can be pressed on at least 48 × 48":
        uk: "Кожну кнопку видалення можна натиснути на площі щонайменше 48 × 48"
        en: "Every delete button can be pressed on at least 48 × 48"
      "the delete icon stays 24 × 24":
        uk: "Іконка видалення лишається 24 × 24"
        en: "The delete icon stays 24 × 24"
      "pressing a delete button removes its task":
        uk: "Натискання кнопки видалення прибирає її справу"
        en: "Pressing a delete button removes its task"
      "the save button can be brought above the keyboard":
        uk: "Кнопку «Зберегти справу» можна побачити над клавіатурою"
        en: "The “Save task” button can be brought above the keyboard"
    hints:
      nudge:
        uk: "Яка рамка реагує на натискання — іконки чи `Pressable` навколо неї? І де закінчується прокручувана частина форми відносно клавіатури?"
        en: "Which box responds to a press — the icon's or the `Pressable` around it? And where does the scrolling part of the form end relative to the keyboard?"
      explanation:
        uk: "Область натискання — це рамка `Pressable`: збільш її, а не вміст. Наприклад, перемикач 20 × 20 у рамці з відступом 14 з кожного боку дає 48 × 48. Для форми потрібні дві речі разом: прокрутка, щоб кнопку можна було докрутити, і контейнер, що забирає в форми місце під клавіатурою, — інакше прокручувана частина сама ховається під клавіатуру, і докручувати нема куди."
        en: "The pressable area is the `Pressable`'s box: enlarge it, not its content. For example, a 20 × 20 switch in a box with 14 of padding on each side gives 48 × 48. The form needs two things together: scrolling, so the button can be brought into view, and a container that takes the space under the keyboard away from the form — otherwise the scrolling part itself hides under the keyboard and there is nowhere to scroll to."
    solutionNote:
      uk: "`padding: 12` робить рамку `Pressable` 48 × 48, а іконка лишається 24 × 24. На пристрої так само спрацював би `hitSlop={12}`. Форма стоїть у `ScrollView` всередині контейнера з `behavior=\"padding\"`: нижній відступ на висоту клавіатури закінчує прокрутку над нею, і кнопку можна докрутити. На пристрої тут буде `KeyboardAvoidingView` з `react-native`."
      en: "`padding: 12` makes the `Pressable` box 48 × 48 while the icon stays 24 × 24. On a device `hitSlop={12}` would work too. The form sits in a `ScrollView` inside a container with `behavior=\"padding\"`: the bottom padding as tall as the keyboard ends the scrolling above it, so the button can be scrolled into view. On a device this is `KeyboardAvoidingView` from `react-native`."
    feedback:
      - when: { test: "every delete button can be pressed on at least 48 × 48" }
        message:
          uk: "Ця перевірка міряє рамку `Pressable` з `testID=\"delete\"` і чекає щонайменше 48 × 48. `hitSlop` перегляд не застосовує, тож збільш саму рамку — відступами або шириною й висотою."
          en: "This check measures the box of the `Pressable` with `testID=\"delete\"` and expects at least 48 × 48. The preview does not apply `hitSlop`, so enlarge the box itself — with padding or a width and height."
      - when: { test: "the delete icon stays 24 × 24" }
        message:
          uk: "Ця перевірка чекає, що іконка з `testID=\"delete-icon\"` лишається 24 × 24. Збільшувати треба область навколо іконки, а не саму іконку."
          en: "This check expects the icon with `testID=\"delete-icon\"` to stay 24 × 24. Enlarge the area around the icon, not the icon itself."
      - when: { test: "the save button can be brought above the keyboard" }
        message:
          uk: "Ця перевірка чекає, що кнопку «Зберегти справу» видно над клавіатурою — одразу або після прокрутки її контейнера. `ScrollView` без контейнера, що відводить місце під клавіатуру, сам тягнеться під неї."
          en: "This check expects the “Save task” button to be visible above the keyboard — right away or after scrolling its container. A `ScrollView` without a container that gives up the space under the keyboard stretches under it itself."

  - id: to-project
    kind: transfer
    capstoneStep: RN-02
    body:
      uk: "У кроці проєкту кожна іконкова кнопка твого списку в `native/` отримає зону дотику щонайменше 44–48 одиниць, а форма створення запису стоятиме в `KeyboardAvoidingView` з прокруткою, щоб кнопка збереження лишалася досяжною з відкритою клавіатурою."
      en: "In the project step every icon button of your list in `native/` gets a touch target of at least 44–48 units, and the create form sits in a `KeyboardAvoidingView` with scrolling, so the save button stays reachable with the keyboard open."
