id: rn-02-08-independent-native-screens
unit: RN-02
title:
  uk: "Самостійно: читабельні підписані нативні екрани"
  en: "Independent: readable labeled native screens"
kind: assessment
minutes: 35
contentVersion: 1
purpose:
  uk: "Перевірити, що ти без підказок збираєш нативний екран списку й форми, який читається при збільшеному шрифті, говорить зі скрінрідером, не ховається під апаратними частинами й клавіатурою і свідомо обробляє одну відмінність платформ. Спершу — у перегляді з автоматичними перевірками, потім — на твоїй заявленій цілі за чеклістом."
  en: "To check that, without hints, you build a native list-and-form screen that reads at a larger font, talks to a screen reader, does not hide under the hardware or the keyboard, and handles one platform difference deliberately. First in the preview with automatic checks, then on your declared target with a checklist."
objectives:
  - uk: "Без підказок зібрати на заявленій цілі читабельний підписаний екран списку й екран форми, що проходять перевірки великим шрифтом, скрінрідером і в обох орієнтаціях, з однією обґрунтованою відмінністю платформ."
    en: "Build, without hints, a readable labeled list screen and form screen on the declared target that pass the large-font, screen-reader and both-orientation checks, with one justified platform difference."
prerequisites: [rn-02-07-debug-clipped-layout]
subskills:
  - { family: N-02, skill: "View/Text/Image/input", depth: assess }
  - { family: N-02, skill: "platform differences", depth: assess }
glossary: []
selfCheck: [library-catalog]

blocks:
  - id: what-is-checked
    kind: explanation
    title:
      uk: "Що перевіряється"
      en: "What is checked"
    body:
      uk: |
        Тема — синтетичний каталог бібліотеки: список книжок і форма додавання. Підказок немає; користуйся тим, що вивчив у цьому розділі, і документацією.

        Екран готовий, коли:

        - картка книжки складена з `View`, `Text` і `Image` з розміром і читається скрінрідером як одне речення;
        - поля форми мають назви з тексту видимих міток, а після невдалого збереження фокус стоїть на помилці;
        - при 200 % нічого не обрізається, і кнопка має зону дотику щонайменше 44 × 44;
        - заголовок і кнопка не заходять під рядок стану, виріз чи індикатор «додому» ні вертикально, ні горизонтально;
        - рівно одна відмінність платформ іде через `Platform.select`, і ти можеш пояснити, чому саме вона.
      en: |
        The topic is a synthetic library catalog: a list of books and a form to add one. There are no hints; use what you learned in this unit and the documentation.

        The screen is done when:

        - a book card is made of `View`, `Text` and an `Image` with a size, and a screen reader reads it as one sentence;
        - the form fields are named by the text of their visible labels, and after a failed save focus is on the error;
        - at 200 % nothing is clipped, and the button has a touch target of at least 44 × 44;
        - the heading and the button stay clear of the status bar, the notch and the home indicator, in portrait and in landscape;
        - exactly one platform difference goes through `Platform.select`, and you can explain why that one.

  - id: library-catalog
    kind: exercise
    mode: independent
    assessment: true
    runtime: concept-preview
    dir: library-catalog
    entry: main.jsx
    editable: [Catalog.jsx]
    strings:
      heading: { uk: "Каталог бібліотеки", en: "Library catalog" }
      book1: { uk: "Сад на даху", en: "A Garden on the Roof" }
      author1: { uk: "Марта Ясень", en: "Marta Yasen" }
      book2: { uk: "Карта старого міста", en: "A Map of the Old Town" }
      author2: { uk: "Тарас Вільха", en: "Taras Vilkha" }
      available: { uk: "є на полиці", en: "on the shelf" }
      onLoan: { uk: "видана", en: "on loan" }
      titleLabel: { uk: "Назва книжки", en: "Book title" }
      authorLabel: { uk: "Автор", en: "Author" }
      save: { uk: "Додати книжку", en: "Add book" }
      titleRequired: { uk: "Введи назву книжки", en: "Enter the book's title" }
      authorRequired: { uk: "Введи автора", en: "Enter the author" }
      newBook: { uk: "Річка без мосту", en: "A River Without a Bridge" }
      newAuthor: { uk: "Ніна Калина", en: "Nina Kalyna" }
    title:
      uk: "Каталог бібліотеки: список і форма"
      en: "Library catalog: a list and a form"
    instructions:
      uk: |
        Збери в `Catalog.jsx` екран каталогу. Перегляд показує його у двох імітованих рамках — вертикальній і горизонтальній — при імітованому розмірі тексту 200 %. Дані й перевірка введення вже є в `catalog.js` (`books`, `validateBook`, `MESSAGES`), а помічники — у `DeviceFrame.jsx` (`useSimulatedInsets`), `Scaled.jsx` (`Text` і `TextInput` з масштабом), `a11yFocus.js` (`moveAccessibilityFocus`).

        Екран має:

        - заголовок «Каталог бібліотеки» з `testID="heading"`;
        - картку на кожну книжку з `testID="book"`: обкладинка `Image` з `source={COVER}`, `testID="cover"` і розміром, назва, автор і стан («є на полиці» чи «видана»); скрінрідер читає картку одним реченням з назвою й автором;
        - поля «Назва книжки» й «Автор» з видимими мітками й тими самими назвами для скрінрідера;
        - кнопку «Додати книжку» щонайменше 44 × 44: якщо `validateBook` повертає помилку назви, під полем зʼявляється текст помилки з `MESSAGES`, і фокус переходить на нього; інакше книжка додається в кінець списку;
        - у обох рамках заголовок і кнопка (докручена до кінця) — у безпечній зоні;
        - при 200 % поля й картки не обрізають текст;
        - експортований об’єкт `platformSpec`, який ти передаєш у `Platform.select` для однієї справжньої відмінності iOS і Android. Обґрунтування запиши коментарем над ним.
      en: |
        Build the catalog screen in `Catalog.jsx`. The preview shows it in two simulated frames — portrait and landscape — at a simulated 200 % text size. The data and input validation are already in `catalog.js` (`books`, `validateBook`, `MESSAGES`), and the helpers are in `DeviceFrame.jsx` (`useSimulatedInsets`), `Scaled.jsx` (`Text` and `TextInput` with scaling) and `a11yFocus.js` (`moveAccessibilityFocus`).

        The screen has:

        - a heading “Library catalog” with `testID="heading"`;
        - a card for every book with `testID="book"`: a cover `Image` with `source={COVER}`, `testID="cover"` and a size, the title, the author and the state (“on the shelf” or “on loan”); a screen reader reads the card as one sentence with the title and the author;
        - the fields “Book title” and “Author” with visible labels and the same names for screen readers;
        - an “Add book” button of at least 44 × 44: if `validateBook` returns a title error, the error text from `MESSAGES` appears under the field and focus moves to it; otherwise the book is added at the end of the list;
        - in both frames the heading and the button (scrolled to the end) are in the safe area;
        - at 200 % the fields and cards do not clip their text;
        - an exported object `platformSpec` that you pass to `Platform.select` for one genuine difference between iOS and Android. Write the justification as a comment above it.
    limits:
      uk: "Перевірки працюють у перегляді react-native-web: імітовані рамки з прикладовими відступами, імітований розмір тексту, фокус клавіатури браузера замість фокуса скрінрідера, гілки `Platform.select`, обчислені за правилами з документації. Справжні VoiceOver чи TalkBack, системний шрифт, поворот і клавіатуру перевіряєш у локальному завданні нижче на заявленій цілі."
      en: "The checks run in the react-native-web preview: simulated frames with example insets, a simulated text size, the browser's keyboard focus instead of screen-reader focus, and `Platform.select` branches computed by the documented rules. Real VoiceOver or TalkBack, the system font, rotation and the keyboard are checked in the local task below on your declared target."
    testTitles:
      "each book card shows its title, author and a sized cover":
        uk: "Кожна картка показує назву, автора й обкладинку з розміром"
        en: "Each book card shows its title, author and a sized cover"
      "each book card is one stop with a sentence for screen readers":
        uk: "Кожна картка — одна зупинка з реченням для скрінрідера"
        en: "Each book card is one stop with a sentence for screen readers"
      "both fields are named by their visible labels":
        uk: "Обидва поля названо текстом їхніх видимих міток"
        en: "Both fields are named by their visible labels"
      "saving without a title moves focus to its error":
        uk: "Збереження без назви переводить фокус на її помилку"
        en: "Saving without a title moves focus to its error"
      "saving a valid book adds it to the list":
        uk: "Збереження правильної книжки додає її в список"
        en: "Saving a valid book adds it to the list"
      "the heading and the save button stay in the safe area in both orientations":
        uk: "Заголовок і кнопка в безпечній зоні в обох орієнтаціях"
        en: "The heading and the save button stay in the safe area in both orientations"
      "nothing is clipped at 200 % text size":
        uk: "При 200 % нічого не обрізається"
        en: "Nothing is clipped at 200 % text size"
      "the save button is at least 44 × 44":
        uk: "Кнопка «Додати книжку» — щонайменше 44 × 44"
        en: "The “Add book” button is at least 44 × 44"
      "one platform difference goes through Platform.select":
        uk: "Одна відмінність платформ іде через `Platform.select`"
        en: "One platform difference goes through `Platform.select`"
    solutionNote:
      uk: "Картка — `View` з `accessible={true}` і реченням у `accessibilityLabel`; обкладинка має розмір. `Field` дає `TextInput` назву з видимої мітки й ефектом переводить фокус на помилку, коли вона зʼявляється. Заголовок і прокручуваний вміст отримують відступи безпечної зони з усіх потрібних сторін, а висоти полів не фіксовано. `platformSpec` описує тінь картки: на iOS вона задається `shadow*`, на Android — `elevation`, і саме це обґрунтовує розгалуження."
      en: "A card is a `View` with `accessible={true}` and a sentence in `accessibilityLabel`; the cover has a size. `Field` names its `TextInput` from the visible label and moves focus to the error with an effect when the error appears. The heading and the scrolling content get safe-area insets on every side that needs them, and no field height is fixed. `platformSpec` describes the card shadow: on iOS it is set with `shadow*`, on Android with `elevation`, and that is what justifies the branch."

  - id: recall-independent-web
    kind: review
    title:
      uk: "Пригадай: самостійний CRUD у вебі"
      en: "Recall: an independent CRUD UI on the web"
    items:
      - id: web-checks
        from: js-06-15-independent-crud-ui
        prompt:
          uk: "Ти щойно зібрав без підказок вебінтерфейс списку з формою. Яка пара перевірок разом показує, що ним можуть користуватися не лише люди з мишею й стандартним масштабом?"
          en: "You have just built, without hints, a web list interface with a form. Which pair of checks together shows that it works not only for people with a mouse at the default zoom?"
        answer:
          type: choice
          options:
            - id: keyboard-zoom
              text:
                uk: "Створити, змінити й видалити запис лише з клавіатури та переглянути сторінку при 200 %"
                en: "Create, edit and delete a record with the keyboard only, and look at the page at 200 %"
            - id: console-tests
              text:
                uk: "Чиста консоль і зелені модульні тести доменних функцій"
                en: "A clean console and green unit tests for the domain functions"
              why:
                uk: "Це потрібно, але нічого не каже про доступність: тести домену не натискають Tab і не збільшують масштаб."
                en: "That is needed but says nothing about accessibility: domain tests do not press Tab or zoom in."
            - id: one-browser
              text:
                uk: "Відкрити сторінку в другому браузері"
                en: "Open the page in a second browser"
              why:
                uk: "Інший браузер перевіряє сумісність, а не те, чи працює інтерфейс без миші й при збільшенні."
                en: "Another browser checks compatibility, not whether the interface works without a mouse and when zoomed."
          correct: [keyboard-zoom]
        explanation:
          uk: "Інтерфейс перевіряють тими способами, якими ним користуються люди. На телефоні відповідники — скрінрідер замість клавіатури та системний розмір шрифту замість масштабу сторінки, плюс поворот і клавіатура над полями."
          en: "An interface is checked the ways people use it. On a phone the counterparts are a screen reader instead of the keyboard and the system font size instead of page zoom, plus rotation and the keyboard over the fields."

  - id: catalog-on-device
    kind: local-task
    runtime: local-native
    title:
      uk: "Каталог на твоїй заявленій цілі"
      en: "The catalog on your declared target"
    intro:
      uk: |
        Тепер той самий каталог — на справжньому пристрої. Підказок немає: пиши `App.tsx` сам, спираючись на свій код з вправи вище (замість імітованих помічників — `useSafeAreaInsets()` з `react-native-safe-area-context`, звичайні `Text` і `TextInput`, `AccessibilityInfo.sendAccessibilityEvent(ref.current, 'focus')` і справжній `KeyboardAvoidingView`). Дані візьми ті самі: дві книжки й перевірку `validateBook`.

        Кроки 1 і 2 повторюють команди з попереднього уроку, які запускали під час підготовки (Node.js v25, `create-expo-app` 5.0.0 з `--no-install` і окремим `npm install` → Expo SDK 57, React Native 0.86.3; `react-native-safe-area-context` ~5.7.0). **Запуск і перевірки на пристрої під час підготовки уроку не виконувалися** — нативних інструментів там немає; ці кроки описано за документацією Expo SDK 57 і React Native 0.86.

        Шаблон Expo фіксує вертикальну орієнтацію: у `app.json` стоїть `"orientation": "portrait"`. Для перевірки повороту заміни це значення на `"default"` і перезапусти dev-сервер; у власній збірці (не в Expo Go) така зміна конфігурації потребує нативного перезбирання.

        Немає емулятора, симулятора чи телефона — натисни **«У мене немає емулятора чи пристрою»**: завдання запишеться як не виконане, а вправа вище лишається твоїм доказом у перегляді.
      en: |
        Now the same catalog on a real device. There are no hints: write `App.tsx` yourself, building on your code from the exercise above (instead of the simulated helpers: `useSafeAreaInsets()` from `react-native-safe-area-context`, plain `Text` and `TextInput`, `AccessibilityInfo.sendAccessibilityEvent(ref.current, 'focus')` and a real `KeyboardAvoidingView`). Use the same data: two books and the `validateBook` check.

        Steps 1 and 2 repeat the commands from the previous lesson that were run while preparing it (Node.js v25, `create-expo-app` 5.0.0 with `--no-install` and a separate `npm install` → Expo SDK 57, React Native 0.86.3; `react-native-safe-area-context` ~5.7.0). **Running and checking on a device was not done while preparing this lesson** — there are no native tools there; those steps follow the Expo SDK 57 and React Native 0.86 documentation.

        The Expo template locks portrait orientation: `app.json` has `"orientation": "portrait"`. To check rotation, change that value to `"default"` and restart the dev server; in your own build (not Expo Go) such a configuration change needs a native rebuild.

        No emulator, simulator or phone — press **“I have no emulator or device”**: the task is recorded as not performed, and the exercise above stays your evidence in the preview.
    tools:
      - { name: "Node.js", version: "22.13 or newer", note: { uk: "мінімум для Expo SDK 57 за таблицею версій Expo", en: "the minimum for Expo SDK 57 per Expo's version table" } }
      - { name: "Expo SDK", version: "57 (React Native 0.86)", note: { uk: "ставиться командою з кроку 1", en: "installed by the command in step 1" } }
      - { name: "react-native-safe-area-context", version: "~5.7.0", note: { uk: "версію підбирає `npx expo install`", en: "`npx expo install` picks the version" } }
      - { name: "Declared target", version: "from RN-01", note: { uk: "емулятор Android, симулятор iOS або телефон з Expo Go для SDK 57", en: "an Android emulator, an iOS simulator or a phone with Expo Go for SDK 57" } }
    steps:
      - text:
          uk: "У теці `~/js-course` створи окремий проєкт для каталогу."
          en: "In the `~/js-course` folder, create a separate project for the catalog."
        command: "npx create-expo-app@latest rn02-catalog --template blank-typescript"
        expect:
          uk: "Зʼявилася тека `rn02-catalog` з `App.tsx`, `app.json` і `package.json`, де `expo` ~57 і `react-native` 0.86.x."
          en: "A folder `rn02-catalog` appears with `App.tsx`, `app.json` and a `package.json` listing `expo` ~57 and `react-native` 0.86.x."
      - text:
          uk: "Перейди в теку (`cd rn02-catalog`) і додай бібліотеку безпечних зон."
          en: "Go into the folder (`cd rn02-catalog`) and add the safe-area library."
        command: "npx expo install react-native-safe-area-context"
        expect:
          uk: "У `package.json` зʼявився `react-native-safe-area-context` ~5.7.0."
          en: "`package.json` lists `react-native-safe-area-context` ~5.7.0."
      - text:
          uk: "Напиши `App.tsx`: список з двома книжками й форма додавання з тими самими вимогами, що й у вправі, плюс форма в `KeyboardAvoidingView` з прокруткою. Над `Platform.select` залиш коментар з обґрунтуванням. Заміни `\"orientation\": \"portrait\"` у `app.json` на `\"default\"`."
          en: "Write `App.tsx`: a list with two books and an add form with the same requirements as in the exercise, plus the form in a `KeyboardAvoidingView` with scrolling. Leave a comment with the justification above `Platform.select`. Change `\"orientation\": \"portrait\"` in `app.json` to `\"default\"`."
      - text:
          uk: "Перевір типи."
          en: "Check the types."
        command: "npx tsc --noEmit"
        expect:
          uk: "Команда завершується без жодного повідомлення."
          en: "The command finishes without any message."
      - text:
          uk: "Запусти dev-сервер і відкрий застосунок на заявленій цілі (`a`, `i` або QR-код в Expo Go). Не перевірено під час підготовки уроку."
          en: "Start the dev server and open the app on your declared target (`a`, `i` or the QR code in Expo Go). Not checked while preparing this lesson."
        command: "npx expo start"
      - text:
          uk: "Пройди чекліст: максимальний системний шрифт — нічого не обрізано; скрінрідер — картки читаються реченнями, поля називаються мітками, після збереження без назви фокус на помилці; поворот — заголовок і кнопка не під вирізом; клавіатура — під час введення автора кнопку «Додати книжку» видно або можна докрутити. Для кожного пункту запиши, що побачив чи почув."
          en: "Go through the checklist: maximum system font — nothing clipped; screen reader — cards read as sentences, fields are named by their labels, after saving without a title focus is on the error; rotation — the heading and the button are not under the notch; keyboard — while typing the author, the “Add book” button is visible or can be scrolled into view. For each item write down what you saw or heard."
    verify:
      - { id: font-ok, text: { uk: "При максимальному системному шрифті жоден текст на обох екранах не обрізано", en: "At the maximum system font no text is clipped on either screen" } }
      - { id: reader-ok, text: { uk: "Скрінрідер читає картки реченнями, називає поля мітками й переводить фокус на помилку", en: "The screen reader reads the cards as sentences, names the fields by their labels and moves focus to the error" } }
      - { id: rotation-ok, text: { uk: "В обох орієнтаціях заголовок і кнопка не заходять під рядок стану, виріз чи індикатор «додому»", en: "In both orientations the heading and the button stay clear of the status bar, the notch and the home indicator" } }
      - { id: keyboard-ok, text: { uk: "З відкритою клавіатурою кнопку «Додати книжку» видно або можна докрутити", en: "With the keyboard open, the “Add book” button is visible or can be scrolled into view" } }
      - { id: platform-ok, text: { uk: "Я записав(-ла) обґрунтування єдиного `Platform.select` і перевірив(-ла) його гілку на своїй платформі", en: "I wrote the justification of the single `Platform.select` and checked its branch on my platform" } }
    troubleshooting:
      - problem: { uk: "Екран не повертається", en: "The screen does not rotate" }
        fix: { uk: "Перевір, що в `app.json` стоїть `\"orientation\": \"default\"`, що на пристрої дозволено автоповорот, і перезапусти `npx expo start`. Не перевірено під час підготовки уроку.", en: "Check that `app.json` has `\"orientation\": \"default\"`, that auto-rotate is allowed on the device, and restart `npx expo start`. Not checked while preparing this lesson." }
      - problem: { uk: "Фокус не переходить на помилку", en: "Focus does not move to the error" }
        fix: { uk: "`sendAccessibilityEvent` має отримати вже намальований елемент: виклич його в ефекті, що залежить від помилки, а не в обробнику натискання. Текст помилки має `accessible={true}`.", en: "`sendAccessibilityEvent` must get an element that is already drawn: call it in an effect that depends on the error, not in the press handler. The error text has `accessible={true}`." }
      - problem: { uk: "Expo Go пише, що проєкт несумісний з цією версією Expo Go", en: "Expo Go says the project is incompatible with this version of Expo Go" }
        fix: { uk: "Онови Expo Go до версії з підтримкою SDK 57 або запускай на емуляторі чи симуляторі. Не перевірено під час підготовки уроку.", en: "Update Expo Go to a version that supports SDK 57, or run on an emulator or a simulator. Not checked while preparing this lesson." }
    recovery:
      uk: "Проєкт `rn02-catalog` окремий від твого `native/`. Якщо `App.tsx` зайшов у глухий кут, перенеси в нього свій пройдений код з вправи вище й заміни імітовані помічники справжніми API. Якщо зламалися залежності, видали лише теку `rn02-catalog` і почни з кроку 1."
      en: "The `rn02-catalog` project is separate from your `native/`. If `App.tsx` reaches a dead end, move your passing code from the exercise above into it and replace the simulated helpers with the real APIs. If the dependencies break, delete only the `rn02-catalog` folder and start again from step 1."
