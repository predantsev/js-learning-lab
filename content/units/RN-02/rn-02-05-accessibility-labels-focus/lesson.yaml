id: rn-02-05-accessibility-labels-focus
unit: RN-02
title:
  uk: "Мітки доступності й фокус"
  en: "Accessibility labels and focus"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Давати кнопкам з самою іконкою accessibilityLabel і accessibilityRole та групувати картку так, щоб скрінрідер оголошував її одним змістовним реченням."
    en: "Give icon-only controls an accessibilityLabel and accessibilityRole, and group a card so a screen reader announces it as one meaningful sentence."
  - uk: "Передбачити порядок читання екрана у VoiceOver і TalkBack та переводити фокус доступності на помилку після невдалого збереження."
    en: "Predict the VoiceOver and TalkBack reading order of a screen, and move accessibility focus to the error after a failed save."
prerequisites: [rn-02-04-touch-targets-keyboard, js-06-01-forms-inputs-labels]
subskills:
  - { family: N-02, skill: "accessibility labels/focus", depth: intro }
glossary: [accessibility-label, accessibility-role, voiceover, talkback]
selfCheck: [predict-sibling-label, habit-field]

blocks:
  - id: what-a-reader-hears
    kind: explanation
    title:
      uk: "Що чує людина зі скрінрідером"
      en: "What a screen-reader user hears"
    body:
      uk: |
        На iPhone [[screen-reader|скрінрідер]] — це [[voiceover|VoiceOver]], на Android — [[talkback|TalkBack]]. Людина водить пальцем по екрану або гортає жестами, і скрінрідер читає елементи по одному — **у порядку верстки**, згори вниз.

        Для кожного елемента він називає дві речі: **що це** й **як називається**. У React Native їх задають пропси:

        | Пропс | Що робить | Приклад |
        |---|---|---|
        | [[accessibility-role\|accessibilityRole]] | що це за елемент | `"button"`, `"header"`, `"image"` |
        | [[accessibility-label\|accessibilityLabel]] | що читати замість вмісту | `"Видалити бажання"` замість «✕» |
        | `accessible={true}` | робить `View` однією зупинкою: його діти читаються разом | картка з трьох `Text` |

        React Native розуміє й ARIA-подібні пропси: `role` і `aria-label` працюють так само.

        Головна відмінність від HTML: у React Native **немає `<label for>`**. Видимий `Text` над полем — просто окремий текст. Зв’язок через `accessibilityLabelledBy` документація позначає як лише для Android, тож надійний спосіб на обох платформах — дати самому `TextInput` `accessibilityLabel` з тим самим текстом, що й видима мітка.
      en: |
        On an iPhone the [[screen-reader|screen reader]] is [[voiceover|VoiceOver]], on Android it is [[talkback|TalkBack]]. A person drags a finger across the screen or swipes, and the screen reader reads the elements one by one — **in layout order**, top to bottom.

        For each element it says two things: **what it is** and **what it is called**. In React Native these are props:

        | Prop | What it does | Example |
        |---|---|---|
        | [[accessibility-role\|accessibilityRole]] | what kind of element it is | `"button"`, `"header"`, `"image"` |
        | [[accessibility-label\|accessibilityLabel]] | what to read instead of the content | `"Delete wish"` instead of “✕” |
        | `accessible={true}` | makes a `View` one stop: its children are read together | a card of three `Text`s |

        React Native also understands ARIA-style props: `role` and `aria-label` work the same way.

        The key difference from HTML: React Native has **no `<label for>`**. A visible `Text` above a field is just separate text. The documentation marks linking them with `accessibilityLabelledBy` as Android-only, so the reliable way on both platforms is to give the `TextInput` itself an `accessibilityLabel` with the same text as the visible label.

  - id: predict-sibling-label
    kind: prediction
    prompt:
      uk: "Над полем ціни стоїть видимий `Text` «Ціна», у самого `TextInput` немає жодних пропсів доступності. Людина з VoiceOver на iPhone торкається поля. Що вона почує?"
      en: "A visible `Text` “Price” stands above the price field, and the `TextInput` itself has no accessibility props. A person using VoiceOver on an iPhone taps the field. What do they hear?"
    strings:
      price: { uk: "Ціна", en: "Price" }
    code: |
      <View>
        <Text>%%price%%</Text>
        <TextInput value={price} onChangeText={setPrice} />
      </View>
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: unnamed
          text:
            uk: "Що це текстове поле (і введене значення, якщо воно є) — але не назву «Ціна»"
            en: "That it is a text field (and the value typed in, if any) — but not the name “Price”"
        - id: named
          text:
            uk: "«Ціна, текстове поле», як для HTML-поля з <label>"
            en: "“Price, text field”, as for an HTML field with a <label>"
          why:
            uk: "У HTML мітку з полем зв’язує `<label for>`. У React Native такого зв’язку немає: `Text` і `TextInput` — два окремі елементи, і назва поля порожня."
            en: "In HTML `<label for>` ties a label to its field. React Native has no such link: the `Text` and the `TextInput` are two separate elements, and the field's name is empty."
        - id: guessed
          text:
            uk: "VoiceOver сам візьме найближчий текст і прочитає «Ціна»"
            en: "VoiceOver takes the nearest text by itself and reads “Price”"
          why:
            uk: "Скрінрідер не вгадує сусідів. Найближчий `Text` прочитається, лише коли фокус дійде до нього самого."
            en: "A screen reader does not guess neighbours. The nearest `Text` is read only when focus reaches that `Text` itself."
      correct: [unnamed]
    explanation:
      uk: "Поле без `accessibilityLabel` для скрінрідера безіменне: людина чує тип елемента, але не знає, що вводити. Виправлення — `accessibilityLabel=\"Ціна\"` на самому `TextInput`; видимий `Text` лишається для тих, хто дивиться на екран. На Android TalkBack поведеться так само, якщо не використати `accessibilityLabelledBy`, — тож перевіряють обидві платформи."
      en: "A field without `accessibilityLabel` is nameless to a screen reader: the person hears the element type but does not know what to enter. The fix is `accessibilityLabel=\"Price\"` on the `TextInput` itself; the visible `Text` stays for people looking at the screen. On Android TalkBack behaves the same unless `accessibilityLabelledBy` is used — so both platforms are checked."

  - id: wish-card-a11y
    kind: example
    runtime: concept-preview
    dir: wish-card-a11y
    entry: main.jsx
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      wanted: { uk: "ще хочу", en: "still wanted" }
      price: { uk: "Ціна", en: "Price" }
      noLabel: { uk: "(без назви)", en: "(no label)" }
      noRole: { uk: "(без ролі)", en: "(no role)" }
    title:
      uk: "Що перегляд віддає технологіям доступності"
      en: "What the preview gives assistive technology"
    body:
      uk: |
        Картка бажання має три типові діри: кнопка-хрестик без назви й ролі, три окремі `Text` замість одного речення і поле, назване лише сусіднім текстом. Натисни **Запустити**: `inspect.js` виведе в консоль роль і назву кожного елемента, які react-native-web зробив з пропсів доступності.

        Зараз видно два рядки: `(без ролі): (без назви)` — це хрестик, і `textbox: (без назви)` — це поле. Тексти картки скрінрідер прочитав би трьома окремими зупинками.
      en: |
        The wish card has three typical gaps: a cross button with no name and no role, three separate `Text`s instead of one sentence, and a field named only by the text next to it. Press **Run**: `inspect.js` prints to the console the role and the name of each element that react-native-web produced from the accessibility props.

        Right now there are two lines: `(no role): (no label)` — that is the cross, and `textbox: (no label)` — that is the field. A screen reader would read the card's texts as three separate stops.
    tryIt:
      uk: |
        1. Додай до `Pressable` пропси `accessibilityRole="button"` і `accessibilityLabel="Видалити бажання"` і запусти: рядок став `button: "Видалити бажання"`.
        2. Додай до `View` з `styles.info` пропси `accessible={true}` і `accessibilityLabel="Навушники, 80 гривень, ще хочу"` і запусти: у консолі з’явився рядок `(без ролі): "Навушники, 80 гривень, ще хочу"`. Перегляд віддав речення як назву картки; що на телефоні картка стане однією зупинкою, перевіряють скрінрідером на заявленій цілі.
        3. Додай до `TextInput` проп `accessibilityLabel="Ціна"` і запусти: поле отримало назву.
      en: |
        1. Add the props `accessibilityRole="button"` and `accessibilityLabel="Delete wish"` to the `Pressable` and run: the line became `button: "Delete wish"`.
        2. Add the props `accessible={true}` and `accessibilityLabel="Headphones, 80 hryvnias, still wanted"` to the `View` with `styles.info` and run: the console now has the line `(no role): "Headphones, 80 hryvnias, still wanted"`. The preview exposed the sentence as the card's name; that the card becomes one stop on a phone is checked with a screen reader on your declared target.
        3. Add the prop `accessibilityLabel="Price"` to the `TextInput` and run: the field got a name.
    limits:
      uk: "Це перегляд у браузері через [[react-native-web]], а не нативний застосунок. `inspect.js` показує ARIA-атрибути, які перегляд зробив з пропсів (`accessibilityLabel` стає `aria-label`, `accessibilityRole` — `role`), а не те, що скажуть VoiceOver чи TalkBack. `accessible={true}` перегляд не перетворює на окрему зупинку (виміряно: атрибута немає), тож групування видно лише за `accessibilityLabel`. Справжні оголошення й порядок читання перевіряють зі скрінрідером на [[declared-target|заявленій цілі]]."
      en: "This is a browser preview through [[react-native-web]], not a native app. `inspect.js` shows the ARIA attributes the preview made from the props (`accessibilityLabel` becomes `aria-label`, `accessibilityRole` becomes `role`), not what VoiceOver or TalkBack will say. The preview does not turn `accessible={true}` into a separate stop (measured: no attribute appears), so the grouping is visible only through `accessibilityLabel`. Real announcements and reading order are checked with a screen reader on your [[declared-target|declared target]]."

  - id: predict-error-focus
    kind: prediction
    prompt:
      uk: "Людина з TalkBack натискає «Зберегти» з порожньою назвою. Під полем з’являється червоний `Text` з помилкою; більше код нічого не робить. Де буде фокус скрінрідера?"
      en: "A person using TalkBack presses “Save” with an empty name. A red error `Text` appears under the field; the code does nothing else. Where is the screen reader's focus?"
    answer:
      type: choice
      options:
        - id: stays
          text:
            uk: "На кнопці «Зберегти»: людина не дізнається про помилку, доки сама не знайде її"
            en: "On the “Save” button: the person does not learn about the error until they find it themselves"
        - id: jumps
          text:
            uk: "На новій помилці: скрінрідер переходить до нового вмісту сам"
            en: "On the new error: the screen reader moves to new content by itself"
          why:
            uk: "Скрінрідер не стрибає до кожного нового елемента — інакше будь-яка зміна на екрані перебивала б людину. Фокус лишається там, де був."
            en: "A screen reader does not jump to every new element — otherwise any change on screen would interrupt the person. Focus stays where it was."
        - id: top
          text:
            uk: "На початку екрана: після зміни екран читається заново"
            en: "At the top of the screen: after a change the screen is read again"
          why:
            uk: "Перечитування з початку буває при переході на новий екран, але не при появі тексту на поточному."
            en: "Starting over from the top happens when navigating to a new screen, not when text appears on the current one."
      correct: [stays]
    explanation:
      uk: "Фокус лишається на кнопці, і помилка мовчить. Тому після невдалого збереження фокус переводять на помилку самі: у React Native 0.86 це `AccessibilityInfo.sendAccessibilityEvent(ref.current, 'focus')` для елемента з `accessible={true}`. Як у вебі: після дії фокус ставлять туди, де людина продовжить."
      en: "Focus stays on the button, and the error is silent. That is why after a failed save you move focus to the error yourself: in React Native 0.86 it is `AccessibilityInfo.sendAccessibilityEvent(ref.current, 'focus')` for an element with `accessible={true}`. As on the web: after an action, focus goes where the person will continue."

  - id: recall-labels
    kind: review
    title:
      uk: "Пригадай: мітки й керування без миші"
      en: "Recall: labels and control without a mouse"
    items:
      - id: label-for
        from: js-06-01-forms-inputs-labels
        prompt:
          uk: "У вебформі над `<input id=\"price\">` стоїть `<p>Ціна</p>`. Яку назву поля оголосить скрінрідер і що треба змінити?"
          en: "In a web form, `<p>Price</p>` stands above `<input id=\"price\">`. What name will a screen reader announce for the field, and what has to change?"
        answer:
          type: choice
          options:
            - id: label-element
              text:
                uk: "Поле без назви; потрібен <label for=\"price\"> або поле всередині <label>"
                en: "The field has no name; it needs <label for=\"price\"> or the field inside a <label>"
            - id: paragraph-ok
              text:
                uk: "«Ціна»: текст над полем і є його міткою"
                en: "“Price”: the text above the field is its label"
              why:
                uk: "`<p>` — лише абзац. Програмно поле пов’язує з міткою тільки `<label>` (або `aria-label` / `aria-labelledby`)."
                en: "A `<p>` is just a paragraph. Only a `<label>` (or `aria-label` / `aria-labelledby`) programmatically ties the field to a label."
          correct: [label-element]
        explanation:
          uk: "Мітка має бути пов’язана з полем програмно, а не лише стояти поруч. У вебі це `<label>`, у React Native — `accessibilityLabel` на самому `TextInput`."
          en: "A label must be tied to its field programmatically, not just stand next to it. On the web that is `<label>`, in React Native an `accessibilityLabel` on the `TextInput` itself."
      - id: div-button
        from: re-07-01-keyboard-crud
        prompt:
          uk: "Кнопку «Видалити» у вебверсії списку зроблено як `<span onClick={remove}>✕</span>`. Чого не зможе людина, яка працює лише з клавіатурою?"
          en: "The “Delete” button in the web list is made as `<span onClick={remove}>✕</span>`. What can a keyboard-only person not do?"
        answer:
          type: choice
          options:
            - id: cannot-reach
              text:
                uk: "Дістатися до неї Tab і натиснути Enter чи Space — span не отримує фокус і не має ролі кнопки"
                en: "Reach it with Tab and press Enter or Space — a span gets no focus and has no button role"
            - id: works
              text:
                uk: "Нічого: onClick спрацює і від клавіатури"
                en: "Nothing: onClick fires from the keyboard too"
              why:
                uk: "`onClick` на `span` реагує лише на мишу чи дотик: клавіатура до цього елемента навіть не дійде."
                en: "`onClick` on a `span` responds only to a mouse or a touch: the keyboard never even reaches that element."
          correct: [cannot-reach]
        explanation:
          uk: "Справжня `<button>` дає фокус, роль і клавіші. У React Native відповідник — `Pressable` з `accessibilityRole=\"button\"` і назвою: тоді скрінрідер оголосить його кнопкою, а не безіменним хрестиком."
          en: "A real `<button>` gives focus, a role and keys. The React Native counterpart is a `Pressable` with `accessibilityRole=\"button\"` and a label: then a screen reader announces it as a button, not as a nameless cross."

  - id: habit-field
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: habit-field
    entry: main.jsx
    editable: [FormField.jsx]
    strings:
      name: { uk: "Назва звички", en: "Habit name" }
      save: { uk: "Зберегти звичку", en: "Save habit" }
      saved: { uk: "Збережено:", en: "Saved:" }
      nameRequired: { uk: "Введи назву звички", en: "Enter the habit's name" }
      nameTooLong: { uk: "Назва довша за 80 символів", en: "The name is longer than 80 characters" }
      habit: { uk: "Ранкова зарядка", en: "Morning exercise" }
    title:
      uk: "Поле форми, що говорить зі скрінрідером"
      en: "A form field that talks to a screen reader"
    instructions:
      uk: |
        Форма звички складається з одного `FormField` і кнопки «Зберегти звичку». Спільна функція `validateHabit` повертає помилку, коли назва порожня, а форма передає локалізований текст помилки в проп `error`.

        Доведи `FormField.jsx`:

        - `TextInput` має назву для скрінрідера — той самий текст, що й видима мітка з пропса `label`; видима мітка лишається;
        - коли з’являється помилка, фокус переходить на неї. Готова функція `moveAccessibilityFocus(ref)` з `a11yFocus.js` переводить фокус на елемент за `ref` (на пристрої — фокус скрінрідера, у перегляді — імітація через фокус клавіатури браузера), а `errorRef` уже приєднано до тексту помилки. Подумай, у який момент цей елемент уже існує.
      en: |
        The habit form is one `FormField` and a “Save habit” button. The shared function `validateHabit` returns an error when the name is empty, and the form passes the localized error text in the `error` prop.

        Finish `FormField.jsx`:

        - the `TextInput` has a name for screen readers — the same text as the visible label from the `label` prop; the visible label stays;
        - when an error appears, focus moves to it. The ready function `moveAccessibilityFocus(ref)` from `a11yFocus.js` moves focus to the element behind `ref` (on a device the screen-reader focus; in the preview a simulation through the browser's keyboard focus), and `errorRef` is already attached to the error text. Think about the moment when that element already exists.
    limits:
      uk: "Перевірки читають атрибути, які react-native-web зробив з пропсів, і фокус клавіатури браузера: у перегляді `moveAccessibilityFocus` ставить саме його, бо функції фокуса скрінрідера тут нічого не роблять (виміряно). На пристрої та сама функція викликає `AccessibilityInfo.sendAccessibilityEvent`, а що оголосять VoiceOver і TalkBack, перевіряють на заявленій цілі."
      en: "The checks read the attributes react-native-web made from the props, and the browser's keyboard focus: in the preview `moveAccessibilityFocus` sets exactly that, because the screen-reader focus functions do nothing here (measured). On a device the same function calls `AccessibilityInfo.sendAccessibilityEvent`, and what VoiceOver and TalkBack announce is checked on your declared target."
    testTitles:
      "the input carries its visible label as its accessibility label":
        uk: "Поле має назву для скрінрідера — текст видимої мітки"
        en: "The input carries its visible label as its accessibility label"
      "the visible label is still shown":
        uk: "Видима мітка лишається на екрані"
        en: "The visible label is still shown"
      "a failed save moves focus to the error":
        uk: "Невдале збереження переводить фокус на помилку"
        en: "A failed save moves focus to the error"
      "a valid save shows no error":
        uk: "Збереження з назвою проходить без помилки"
        en: "A valid save shows no error"
    hints:
      nudge:
        uk: "Що у вебі робить `<label for>`, і який пропс React Native дає полю назву, не покладаючись на сусідній текст? А для фокуса: коли саме `errorRef.current` перестає бути `null`?"
        en: "What does `<label for>` do on the web, and which React Native prop names a field without relying on the text next to it? And for focus: when exactly does `errorRef.current` stop being `null`?"
      explanation:
        uk: "Назву поля задають на самому `TextInput` — так само, як у прикладі з полем ціни, тільки текст тут приходить з пропса. Помилки ще немає в момент натискання: вона з’являється після рендеру. Код, що має спрацювати після того, як React показав новий стан, ставлять в ефект, який залежить від цього стану, — як ефект, що прокручує список, коли змінюються `items`."
        en: "A field's name is set on the `TextInput` itself — just like in the price-field example, only here the text comes from a prop. The error does not exist yet at the moment of the press: it appears after the render. Code that must run after React has shown the new state goes into an effect that depends on that state — like an effect that scrolls a list when `items` change."
    solutionNote:
      uk: "`accessibilityLabel={label}` дає полю назву з тієї самої мітки, що бачить людина, — без розбіжностей між текстом і оголошенням. Ефект з залежністю `[error]` спрацьовує після рендеру, коли текст помилки вже існує і `errorRef.current` указує на нього, тож `moveAccessibilityFocus` має куди перевести фокус. `accessible={true}` на тексті помилки документація просить для кожного елемента, що має отримати фокус доступності; у `Text` він і так увімкнений за замовчуванням, тож тут лише робить це явним."
      en: "`accessibilityLabel={label}` names the field from the same label the person sees — no mismatch between the text and the announcement. The effect with the `[error]` dependency runs after the render, when the error text exists and `errorRef.current` points to it, so `moveAccessibilityFocus` has somewhere to move focus. The documentation asks for `accessible={true}` on any element that should receive accessibility focus; a `Text` already has it by default, so on the error text it only makes that explicit."
    feedback:
      - when: { test: "the input carries its visible label as its accessibility label" }
        message:
          uk: "Ця перевірка чекає, що поле має `aria-label` з текстом мітки — так перегляд показує `accessibilityLabel`. Сусідній `Text` поле не називає, а `accessibilityLabelledBy` документація позначає лише для Android."
          en: "This check expects the field to have an `aria-label` with the label's text — that is how the preview shows `accessibilityLabel`. A neighbouring `Text` does not name the field, and the documentation marks `accessibilityLabelledBy` as Android-only."
      - when: { test: "a failed save moves focus to the error" }
        message:
          uk: "Ця перевірка натискає «Зберегти звичку» з порожньою назвою й чекає, що фокус стоїть на тексті помилки. Якщо викликати `moveAccessibilityFocus` прямо під час рендеру, текста ще немає, і `errorRef.current` дорівнює `null`."
          en: "This check presses “Save habit” with an empty name and expects focus on the error text. If `moveAccessibilityFocus` is called directly during render, the text does not exist yet and `errorRef.current` is `null`."

  - id: to-project
    kind: transfer
    capstoneStep: RN-02
    body:
      uk: "У кроці проєкту кожне поле твоєї форми в нативному проєкті `<проєкт>-native` отримає `accessibilityLabel` з тексту видимої мітки, кнопка — роль, рядок запису — одне речення для скрінрідера, а після невдалої перевірки з `validateItem`, `validateTask`, `validateHabit` чи `validateExpense` поле з помилкою переведе фокус скрінрідера на її текст."
      en: "In the project step every field of your form in your native project `<project>-native` gets an `accessibilityLabel` from its visible label's text, the button gets a role, a record row gets one sentence for screen readers, and after a failed check by `validateItem`, `validateTask`, `validateHabit` or `validateExpense` the field with the error moves the screen reader's focus to its text."
