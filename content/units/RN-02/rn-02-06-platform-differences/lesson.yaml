id: rn-02-06-platform-differences
unit: RN-02
title:
  uk: "Відмінності платформ"
  en: "Platform differences"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Розгалужувати код через Platform.OS чи Platform.select лише для справжніх відмінностей платформ (тінь проти elevation, повернення назад, типи клавіатури, шрифти) і тримати спільну верстку спільною."
    en: "Branch with Platform.OS or Platform.select only for genuine platform differences (shadow versus elevation, back affordance, keyboard types, fonts) and keep the shared layout shared."
  - uk: "Обирати між перевіркою платформи в коді й окремим файлом для платформи (.ios.tsx / .android.tsx) і обґрунтовувати вибір."
    en: "Choose between an inline platform check and a platform-specific file (.ios.tsx / .android.tsx) for a component, and justify the choice."
prerequisites: [rn-02-05-accessibility-labels-focus, rn-02-02-styling-flexbox-density]
subskills:
  - { family: N-02, skill: "platform differences", depth: intro }
glossary: [platform-select, platform-specific-file]
selfCheck: [predict-select, expense-card]

blocks:
  - id: same-code-two-platforms
    kind: explanation
    title:
      uk: "Один код — дві платформи, і де вони розходяться"
      en: "One codebase, two platforms, and where they part"
    body:
      uk: |
        Більшість коду React Native однакова для iOS і Android: верстка Flexbox, стан, доменні функції. Але деякі речі платформи роблять по-різному:

        | Відмінність | iOS | Android |
        |---|---|---|
        | тінь картки | `shadowColor`, `shadowOpacity`, `shadowRadius`, `shadowOffset` | `elevation` (з `shadow*` працює лише `shadowColor`, з API 28) |
        | повернення назад | кнопка «Назад» угорі й жест від краю | системна кнопка чи жест «Назад» |
        | системний шрифт | San Francisco | Roboto (або шрифт виробника) |
        | деякі `keyboardType` | `'ascii-capable'`, `'twitter'` | `'visible-password'` |

        Тому однаково рендерити й тестувати на одній платформі недостатньо: тінь, що є на iPhone, на Android може просто зникнути.

        Для таких місць є `Platform`. `Platform.OS` дорівнює `'ios'` чи `'android'`, а [[platform-select|Platform.select]] вибирає значення з об’єкта: спершу ключ платформи, потім `native`, потім `default`. Розгалужують **лише відмінність**: тінь іде в `Platform.select`, а відступи, радіус і фон лишаються в спільному стилі.

        > [!note]
        > У новому коді є й спільний для обох платформ `boxShadow`. Пару `shadow*` / `elevation` ти ще довго бачитимеш у чужому коді — і вона добре показує, як працює розгалуження.
      en: |
        Most React Native code is the same for iOS and Android: Flexbox layout, state, domain functions. But some things the platforms do differently:

        | Difference | iOS | Android |
        |---|---|---|
        | card shadow | `shadowColor`, `shadowOpacity`, `shadowRadius`, `shadowOffset` | `elevation` (of `shadow*` only `shadowColor` works, from API 28) |
        | going back | a “Back” button at the top and an edge swipe | the system Back button or gesture |
        | system font | San Francisco | Roboto (or the manufacturer's font) |
        | some `keyboardType`s | `'ascii-capable'`, `'twitter'` | `'visible-password'` |

        So rendering and testing on one platform is not enough: a shadow that is there on an iPhone can simply vanish on Android.

        `Platform` exists for such places. `Platform.OS` equals `'ios'` or `'android'`, and [[platform-select|Platform.select]] picks a value from an object: first the platform's key, then `native`, then `default`. You branch **only the difference**: the shadow goes into `Platform.select`, while padding, radius and background stay in the shared style.

        > [!note]
        > New code also has `boxShadow`, shared by both platforms. You will still meet the `shadow*` / `elevation` pair in other people's code for a long time — and it shows well how branching works.

  - id: predict-select
    kind: prediction
    prompt:
      uk: "Що поверне цей виклик у браузерному перегляді курсу (react-native-web), на Android і на iOS?"
      en: "What does this call return in the course's browser preview (react-native-web), on Android and on iOS?"
    code: |
      const shadow = Platform.select({
        ios: 'shadow props',
        android: 'elevation',
        default: 'border',
      });
    lang: js
    runnable: false
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "перегляд: 'border' · Android: 'elevation' · iOS: 'shadow props'"
            en: "preview: 'border' · Android: 'elevation' · iOS: 'shadow props'"
        - id: preview-ios
          text:
            uk: "перегляд: 'shadow props' · Android: 'elevation' · iOS: 'shadow props'"
            en: "preview: 'shadow props' · Android: 'elevation' · iOS: 'shadow props'"
          why:
            uk: "Перегляд не прикидається ні iOS, ні Android: для нього `Platform.OS` дорівнює `'web'`. Ключа `web` тут немає, тож він бере `default`."
            en: "The preview pretends to be neither iOS nor Android: for it `Platform.OS` is `'web'`. There is no `web` key here, so it takes `default`."
        - id: undefined-preview
          text:
            uk: "перегляд: undefined · Android: 'elevation' · iOS: 'shadow props'"
            en: "preview: undefined · Android: 'elevation' · iOS: 'shadow props'"
          why:
            uk: "`undefined` було б, якби не було `default`. Тут він є, і платформа без власного ключа бере саме його."
            en: "It would be `undefined` without `default`. Here there is one, and a platform without its own key takes exactly that."
      correct: [right]
    explanation:
      uk: "Кожна платформа шукає свій ключ, а якщо його немає — `default`. Браузерний перегляд — третя платформа, `'web'`, а не замінник телефона: тому все, що вибирається для iOS чи Android, перевіряють на заявленій цілі."
      en: "Each platform looks for its own key and, if there is none, `default`. The browser preview is a third platform, `'web'`, not a stand-in for a phone: that is why whatever is selected for iOS or Android is checked on your declared target."

  - id: files-per-platform
    kind: explanation
    title:
      uk: "Окремі файли для платформ"
      en: "Separate files per platform"
    body:
      uk: |
        Коли компонент на платформах відрізняється не одним стилем, а цілими шматками розмітки й логіки, перевірки `Platform.OS` розлазяться по всьому файлу. Тоді його ділять на [[platform-specific-file|файли для платформ]]:

        ```text
        Card.ios.tsx
        Card.android.tsx
        ```

        Імпортують без суфікса — `import Card from './Card';` — і бандлер React Native (Metro) сам бере `Card.ios.tsx` у збірці для iOS і `Card.android.tsx` для Android. Обидва файли мають експортувати те саме API, інакше код, що їх імпортує, зламається на одній з платформ.

        Як вибрати:

        - **`Platform.select` / `Platform.OS`** — мала відмінність: тінь, відступ, одне значення пропса;
        - **файли `.ios` / `.android`** — компонент, що на платформах побудований по-різному.
      en: |
        When a component differs between platforms not by one style but by whole pieces of markup and logic, `Platform.OS` checks spread all over the file. Then it is split into [[platform-specific-file|platform-specific files]]:

        ```text
        Card.ios.tsx
        Card.android.tsx
        ```

        You import without the suffix — `import Card from './Card';` — and React Native's bundler (Metro) takes `Card.ios.tsx` in the iOS build and `Card.android.tsx` for Android by itself. Both files must export the same API, otherwise the code that imports them breaks on one of the platforms.

        How to choose:

        - **`Platform.select` / `Platform.OS`** — a small difference: a shadow, a spacing, one prop value;
        - **`.ios` / `.android` files** — a component that is built differently on each platform.

  - id: resolve-card
    kind: visual
    visual: diagram
    title:
      uk: "Один імпорт — два файли, один стиль — дві гілки"
      en: "One import, two files; one style, two branches"
    textEquivalent:
      uk: "Згори — рядок import Card from './Card'. У збірці для iOS бандлер знаходить Card.ios.tsx, у збірці для Android — Card.android.tsx; інший файл у збірку не потрапляє. Нижче — Platform.select зі стилем тіні: на iOS він повертає shadow-пропси, на Android — elevation. Спільний стиль картки з відступами й радіусом не розгалужується і діє на обох платформах."
      en: "At the top is the line import Card from './Card'. In the iOS build the bundler finds Card.ios.tsx, in the Android build Card.android.tsx; the other file does not get into the build. Below is Platform.select with the shadow style: on iOS it returns the shadow props, on Android elevation. The card's shared style with padding and radius is not branched and applies on both platforms."
    spec:
      layout: grid
      nodes:
        - { id: import, label: "import Card from './Card'", col: 0, row: 0, w: 220 }
        - { id: ios-file, label: "Card.ios.tsx", col: 0, row: 1, w: 220 }
        - { id: android-file, label: "Card.android.tsx", col: 0, row: 2, w: 220 }
        - { id: select, label: "Platform.select(shadowSpec)", col: 0, row: 3, w: 220 }
        - { id: ios-style, label: "shadowColor, shadowOpacity…", shape: pill, col: 0, row: 4, w: 220 }
        - { id: android-style, label: "elevation", shape: pill, col: 0, row: 5, w: 220 }
        - { id: shared, label: { uk: "спільно: padding, borderRadius", en: "shared: padding, borderRadius" }, shape: note, col: 0, row: 6, w: 220 }
      edges:
        - { id: to-ios-file, from: import, to: ios-file, label: "iOS" }
        - { id: to-android-file, from: ios-file, to: android-file, kind: dashed, label: { uk: "або", en: "or" } }
        - { id: to-ios-style, from: select, to: ios-style, label: "iOS" }
        - { id: to-android-style, from: ios-style, to: android-style, kind: dashed, label: { uk: "або", en: "or" } }
      steps:
        - highlight: [import]
          caption:
            uk: "Код імпортує `./Card` без суфікса платформи."
            en: "The code imports `./Card` without a platform suffix."
        - highlight: [import, ios-file, to-ios-file]
          dim: [android-file]
          annotate:
            - { id: ios-file, text: { uk: "збірка iOS", en: "iOS build" } }
          caption:
            uk: "У збірці для iOS бандлер бере `Card.ios.tsx`; `Card.android.tsx` у неї не потрапляє."
            en: "In the iOS build the bundler takes `Card.ios.tsx`; `Card.android.tsx` does not get into it."
        - highlight: [android-file]
          dim: [ios-file]
          annotate:
            - { id: android-file, text: { uk: "збірка Android", en: "Android build" } }
          caption:
            uk: "У збірці для Android — навпаки: `Card.android.tsx`. Обидва файли експортують той самий компонент з тими самими пропсами."
            en: "In the Android build it is the other way round: `Card.android.tsx`. Both files export the same component with the same props."
        - highlight: [select, ios-style, to-ios-style]
          dim: [android-style]
          caption:
            uk: "Для малої відмінності вистачає `Platform.select`: на iOS він повертає `shadow*`-пропси."
            en: "For a small difference `Platform.select` is enough: on iOS it returns the `shadow*` props."
        - highlight: [android-style]
          dim: [ios-style]
          caption:
            uk: "На Android той самий виклик повертає `elevation`."
            en: "On Android the same call returns `elevation`."
        - highlight: [shared]
          caption:
            uk: "Відступи, радіус і фон лишаються в спільному стилі: їх не копіюють у гілки платформ."
            en: "Padding, radius and background stay in the shared style: they are not copied into the platform branches."

  - id: wish-card-platforms
    kind: example
    runtime: concept-preview
    dir: wish-card-platforms
    entry: main.jsx
    strings:
      bicycle: { uk: "Велосипед", en: "Bicycle" }
    title:
      uk: "Картка зі шрифтом для кожної платформи"
      en: "A card with a font for each platform"
    body:
      uk: |
        Назви шрифтів на платформах різні: на iOS є `'Georgia'`, на Android — загальний `'serif'`. Це справжня відмінність, і її розгалужують, а не всю картку.

        У перегляді `Platform.OS` завжди `'web'`, тому тут `selectFor(SIMULATED_OS, …)` з `platformSim.js` вибирає гілку так само, як `Platform.select` на обраній платформі. Натисни **Запустити**: `'web'` бере `default` — порожній об’єкт, тож назва йде шрифтом за замовчуванням, а нижній рядок показує, що вибрано.
      en: |
        Font names differ between platforms: iOS has `'Georgia'`, Android the generic `'serif'`. That is a genuine difference, and it is what you branch — not the whole card.

        In the preview `Platform.OS` is always `'web'`, so here `selectFor(SIMULATED_OS, …)` from `platformSim.js` picks a branch the way `Platform.select` does on the chosen platform. Press **Run**: `'web'` takes `default` — an empty object, so the title uses the default font, and the bottom line shows what was selected.
    tryIt:
      uk: |
        1. У `platformSim.js` зміни `SIMULATED_OS` на `'ios'` і запусти: рядок показує `{"fontFamily":"Georgia"}`, і назва змінила шрифт, якщо в твоїй системі є Georgia.
        2. Зміни на `'android'` і запусти: тепер вибрано `'serif'`.
        3. Зверни увагу: відступи, рамка й радіус картки не змінювалися — вони в спільному `styles.card`.
      en: |
        1. In `platformSim.js` change `SIMULATED_OS` to `'ios'` and run: the line shows `{"fontFamily":"Georgia"}`, and the title changed its font if your system has Georgia.
        2. Change it to `'android'` and run: now `'serif'` is selected.
        3. Notice: the card's padding, border and radius never changed — they are in the shared `styles.card`.
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не нативний застосунок. Тут `Platform.OS` — це `'web'`, третя платформа, а не замінник iOS чи Android; `SIMULATED_OS` лише вибирає гілку, а шрифт малює браузер з тих шрифтів, що є на твоєму компʼютері. Файли `.ios.tsx` / `.android.tsx` перегляд не розрізняє. Справжній вигляд шрифтів, тіней і повернення назад перевіряють на заявленій цілі."
      en: "This is a browser preview through react-native-web, not a native app. Here `Platform.OS` is `'web'`, a third platform, not a stand-in for iOS or Android; `SIMULATED_OS` only picks a branch, and the browser draws the font from the fonts on your computer. The preview does not tell `.ios.tsx` / `.android.tsx` files apart. The real look of fonts, shadows and going back is checked on your declared target."

  - id: expense-card
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: expense-card
    entry: main.jsx
    editable: [ExpenseCard.jsx]
    strings:
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
    title:
      uk: "Тінь картки витрати для двох платформ"
      en: "An expense card shadow for two platforms"
    instructions:
      uk: |
        У `ExpenseCard.jsx` заповни об’єкт `shadowSpec`, який передається в `Platform.select`:

        - на iOS — тінь через `shadowColor`, `shadowOpacity`, `shadowRadius` і `shadowOffset`;
        - на Android — `elevation`;
        - верстку картки (відступи, радіус, фон) не переноси в гілки: вона лишається в спільному `styles.card`.

        Перевірки пробують `shadowSpec` для iOS і Android так, як це робить `Platform.select`, і дивляться на картку в перегляді, де платформа — `'web'`.
      en: |
        In `ExpenseCard.jsx` fill in the `shadowSpec` object that is passed to `Platform.select`:

        - on iOS — a shadow through `shadowColor`, `shadowOpacity`, `shadowRadius` and `shadowOffset`;
        - on Android — `elevation`;
        - do not move the card's layout (padding, radius, background) into the branches: it stays in the shared `styles.card`.

        The checks try `shadowSpec` for iOS and Android the way `Platform.select` does, and look at the card in the preview, where the platform is `'web'`.
    limits:
      uk: "Перевірки обчислюють гілки iOS і Android за правилами `Platform.select` з документації React Native, а не на пристрої; картку малює браузер, де платформа — `'web'`. Як тінь виглядає на iPhone й на Android, перевіряють на заявленій цілі."
      en: "The checks compute the iOS and Android branches by the rules of `Platform.select` from the React Native documentation, not on a device; the card is drawn by the browser, where the platform is `'web'`. How the shadow looks on an iPhone and on Android is checked on your declared target."
    testTitles:
      "iOS gets the shadow props":
        uk: "На iOS вибираються `shadow*`-пропси"
        en: "iOS gets the `shadow*` props"
      "Android gets elevation":
        uk: "На Android вибирається `elevation`, без `shadowOpacity`"
        en: "Android gets `elevation`, without `shadowOpacity`"
      "the layout stays out of the platform branches":
        uk: "Верстки (відступів, радіуса, фону) немає в гілках платформ"
        en: "No layout (padding, radius, background) in the platform branches"
      "the card keeps its shared layout in the preview":
        uk: "У перегляді картка має спільні відступ і радіус"
        en: "The card keeps its shared padding and radius in the preview"
    hints:
      nudge:
        uk: "Які ключі шукає `Platform.select` на iOS і на Android? Що в цьому об’єкті має бути під кожним з них — і чого там бути не повинно?"
        en: "Which keys does `Platform.select` look for on iOS and on Android? What belongs under each of them in this object — and what does not?"
      explanation:
        uk: "Під ключем платформи лежить лише те, що на ній інакше. Наприклад, для кольору тексту посилання можна написати `{ ios: { color: '#0a64d8' }, android: { color: '#1a73e8' } }`, а розмір шрифту лишити в спільному стилі. З тінню так само: на iOS її описують чотири `shadow*`-властивості (`shadowOffset` — об’єкт з `width` і `height`), а на Android — одне число."
        en: "Under a platform key goes only what differs on it. For example, for a link's text color you could write `{ ios: { color: '#0a64d8' }, android: { color: '#1a73e8' } }` and keep the font size in the shared style. The shadow works the same way: on iOS four `shadow*` properties describe it (`shadowOffset` is an object with `width` and `height`), on Android a single number."
    solutionNote:
      uk: "`shadowSpec` містить лише відмінність: `shadow*` для iOS і `elevation` для Android. Гілка `default` дає браузерному перегляду рамку — на телефоні вона не діє. Відступ, радіус і фон лишилися в `styles.card`, тож картка однакова за версткою скрізь, а змінюється лише тінь."
      en: "`shadowSpec` holds only the difference: `shadow*` for iOS and `elevation` for Android. The `default` branch gives the browser preview a border — it does not apply on a phone. Padding, radius and background stayed in `styles.card`, so the card has the same layout everywhere and only the shadow changes."
    feedback:
      - when: { test: "Android gets elevation" }
        message:
          uk: "Ця перевірка чекає, що для Android вибирається `elevation` більший за 0 і немає `shadowOpacity`. Тінь з `shadow*`-пропсів на Android не малюється — їй потрібна власна гілка."
          en: "This check expects `elevation` above 0 to be selected for Android, and no `shadowOpacity`. A shadow from `shadow*` props is not drawn on Android — it needs its own branch."
      - when: { test: "the layout stays out of the platform branches" }
        message:
          uk: "Ця перевірка чекає, що в гілках `shadowSpec` немає відступів, радіуса, фону чи розмірів. Верстку, однакову для всіх платформ, тримай у `styles.card`."
          en: "This check expects no padding, radius, background or size in the branches of `shadowSpec`. Keep the layout that is the same for every platform in `styles.card`."
      - when: { test: "the card keeps its shared layout in the preview" }
        message:
          uk: "Ця перевірка чекає, що картка в перегляді має відступ щонайменше 12 і заокруглені кути. Перегляд — платформа `'web'`, тож верстка з гілок `ios` чи `android` до нього не доходить."
          en: "This check expects the card in the preview to have at least 12 of padding and rounded corners. The preview is the `'web'` platform, so layout from the `ios` or `android` branches never reaches it."

  - id: to-project
    kind: transfer
    capstoneStep: RN-02
    body:
      uk: "У кроці проєкту ти вибереш одну справжню відмінність платформ на своїх екранах у `native/` — наприклад, тінь картки чи `behavior` для `KeyboardAvoidingView` — оформиш її через `Platform.select`, а спільну верстку лишиш спільною. Обґрунтування запишеш поруч з кодом."
      en: "In the project step you will pick one genuine platform difference on your screens in `native/` — for example, the card shadow or the `behavior` of `KeyboardAvoidingView` — express it with `Platform.select`, and keep the shared layout shared. You will write the justification next to the code."
