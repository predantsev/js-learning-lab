id: rn-02-03-safe-areas
unit: RN-02
title:
  uk: "Безпечні зони"
  en: "Safe areas"
kind: instructional
minutes: 8
contentVersion: 1
objectives:
  - uk: "Визначити ділянки, які можуть закрити рядок стану, виріз екрана, заокруглені кути й індикатор «додому», і застосовувати відступи безпечної зони лише там, де вміст опинився б під ними."
    en: "Identify the regions a status bar, notch, rounded corners and home indicator can cover, and apply safe-area insets only where content would be obscured."
  - uk: "Пояснити, чому фон може заходити під ці відступи, а текст і елементи керування — ні."
    en: "Explain why a full-bleed background may extend under the insets while text and controls must not."
prerequisites: [rn-02-02-styling-flexbox-density]
subskills:
  - { family: N-02, skill: "safe areas", depth: intro }
glossary: [safe-area, safe-area-insets, display-cutout]
selfCheck: [predict-covered, expense-screen]

blocks:
  - id: not-all-screen
    kind: explanation
    title:
      uk: "Не весь екран можна використати"
      en: "Not all of the screen is usable"
    body:
      uk: |
        Верхній лівий кут телефона — не завжди видиме місце. Частину екрана закривають:

        - **рядок стану** з годинником і батареєю та [[display-cutout|виріз екрана]] з камерою — згори;
        - **заокруглені кути** — по кутах;
        - **індикатор «додому»** — смужка внизу, за яку тягнуть, щоб вийти із застосунку.

        Решта — [[safe-area|безпечна зона]]. Її межі задають [[safe-area-insets|відступи безпечної зони]]: чотири числа `{ top, right, bottom, left }` в одиницях верстки. Вони різні на різних телефонах і **змінюються при повороті**: у горизонтальній орієнтації виріз опиняється збоку, і `top` може стати 0, а `left` — кілька десятків.

        Тому значення не вгадують, а читають з пристрою. У проєкті Expo це робить бібліотека `react-native-safe-area-context`: `SafeAreaProvider` у корені застосунку і хук `useSafeAreaInsets()` у компоненті. Вбудований у React Native `SafeAreaView` працює лише на iOS і в документації позначений як застарілий.
      en: |
        The top-left corner of a phone is not always a visible place. Parts of the screen are covered by:

        - the **status bar** with the clock and battery, and the [[display-cutout|display cutout]] with the camera — at the top;
        - **rounded corners** — at the corners;
        - the **home indicator** — the bar at the bottom you drag to leave an app.

        The rest is the [[safe-area|safe area]]. Its edges are given by the [[safe-area-insets|safe-area insets]]: four numbers `{ top, right, bottom, left }` in layout units. They differ between phones and **change on rotation**: in landscape the cutout ends up on a side, and `top` may become 0 while `left` becomes several dozen.

        So the values are never guessed; they are read from the device. In an Expo project the library `react-native-safe-area-context` does that: `SafeAreaProvider` at the root of the app and the `useSafeAreaInsets()` hook in a component. React Native's built-in `SafeAreaView` works on iOS only and is marked deprecated in the documentation.

  - id: frame-insets
    kind: visual
    visual: diagram
    title:
      uk: "Відступи безпечної зони в двох орієнтаціях"
      en: "Safe-area insets in two orientations"
    textEquivalent:
      uk: "Екран складається з п’яти смуг згори вниз: рядок стану з вирізом, заголовок, список, панель з кнопкою й індикатор «додому». У вертикальній орієнтації верхній відступ 59, нижній 34, бічні 0. Заголовок без відступу почав би текст під рядком стану, тож його внутрішній відступ згори збільшують на 59, а його фон лишається під рядком стану. Фон списку йде від краю до краю, бо фон нічого не означає для читання. Панель отримує внизу додаткові 34. У горизонтальній орієнтації верхній відступ 0, бічні 59, нижній 21: тепер виріз збоку, і на 59 зсувають початок тексту заголовка, рядків списку й кнопки."
      en: "The screen is five bands from top to bottom: the status bar with the cutout, the header, the list, the button bar and the home indicator. In portrait the top inset is 59, the bottom 34, the sides 0. Without an inset the header would start its text under the status bar, so its top padding grows by 59 while its background stays under the status bar. The list background runs edge to edge, because a background means nothing for reading. The bar gets an extra 34 at the bottom. In landscape the top inset is 0, the sides 59 and the bottom 21: now the cutout is on a side, and the start of the header text, the list rows and the button moves in by 59."
    spec:
      layout: tb
      nodes:
        - { id: status, label: { uk: "рядок стану й виріз", en: "status bar and cutout" }, shape: note, w: 220 }
        - { id: header, label: { uk: "заголовок", en: "header" }, w: 220 }
        - { id: list, label: { uk: "список", en: "list" }, w: 220 }
        - { id: bar, label: { uk: "панель з кнопкою", en: "button bar" }, w: 220 }
        - { id: home, label: { uk: "індикатор «додому»", en: "home indicator" }, shape: note, w: 220 }
      edges:
        - { id: s-h, from: status, to: header, kind: line }
        - { id: h-l, from: header, to: list, kind: line }
        - { id: l-b, from: list, to: bar, kind: line }
        - { id: b-h, from: bar, to: home, kind: line }
      steps:
        - highlight: [status, home]
          annotate:
            - { id: status, text: "top: 59" }
            - { id: home, text: "bottom: 34" }
          caption:
            uk: "Вертикальна орієнтація: згори 59 одиниць займають рядок стану й виріз, знизу 34 — індикатор «додому». Бічні відступи — 0."
            en: "Portrait: 59 units at the top belong to the status bar and the cutout, 34 at the bottom to the home indicator. The side insets are 0."
        - highlight: [header]
          annotate:
            - { id: header, text: "paddingTop + 59" }
          caption:
            uk: "Текст заголовка зсуваємо вниз відступом `paddingTop`, а фон заголовка лишається під рядком стану — так екран виглядає суцільним."
            en: "The header text moves down with `paddingTop`, while the header background stays under the status bar — so the screen looks seamless."
        - highlight: [list]
          annotate:
            - { id: list, text: { uk: "фон від краю до краю", en: "background edge to edge" } }
          caption:
            uk: "Фон списку йде від краю до краю: фон можна сховати під апаратними частинами, а текст і кнопки — ні."
            en: "The list background runs edge to edge: a background may hide under hardware, text and buttons may not."
        - highlight: [bar]
          annotate:
            - { id: bar, text: "paddingBottom + 34" }
          caption:
            uk: "Панель отримує додаткові 34 одиниці знизу, щоб кнопку не перекривав індикатор «додому»."
            en: "The bar gets an extra 34 units at the bottom so the home indicator does not cover the button."
        - highlight: [status, header, list, bar, home]
          annotate:
            - { id: status, text: "top: 0" }
            - { id: header, text: "left/right: 59" }
            - { id: home, text: "bottom: 21" }
          caption:
            uk: "Горизонтальна орієнтація: `top` став 0, `left` і `right` — по 59, `bottom` — 21. Тепер на 59 зсуваються початки тексту заголовка, рядків і кнопки."
            en: "Landscape: `top` became 0, `left` and `right` are 59 each, `bottom` is 21. Now the start of the header text, the rows and the button move in by 59."

  - id: predict-covered
    kind: prediction
    prompt:
      uk: "Текст заголовка починається за 16 одиниць від лівого краю й за 12 від верхнього. Кнопка 160 одиниць завширшки стоїть по центру, її низ — за 24 від нижнього краю. Відступи: вертикально `{ top: 59, right: 0, bottom: 34, left: 0 }`, горизонтально `{ top: 0, right: 59, bottom: 21, left: 59 }`. Що опиниться під апаратними частинами? Познач усе."
      en: "The header text starts 16 units from the left edge and 12 from the top. A 160-unit-wide button stands in the centre, its bottom 24 above the bottom edge. Insets: portrait `{ top: 59, right: 0, bottom: 34, left: 0 }`, landscape `{ top: 0, right: 59, bottom: 21, left: 59 }`. What ends up under the hardware? Mark all."
    answer:
      type: multi
      options:
        - id: title-portrait
          text:
            uk: "Текст заголовка вертикально"
            en: "The header text in portrait"
        - id: title-landscape
          text:
            uk: "Текст заголовка горизонтально"
            en: "The header text in landscape"
        - id: button-portrait
          text:
            uk: "Кнопка вертикально"
            en: "The button in portrait"
        - id: button-landscape
          text:
            uk: "Кнопка горизонтально"
            en: "The button in landscape"
          why:
            uk: "Знизу відступ 21, а кнопка на 24 вище краю; збоку вона по центру, далеко від 59 з кожного боку. Тут вона в безпеці."
            en: "The bottom inset is 21, and the button is 24 above the edge; sideways it is centred, far from the 59 on each side. Here it is safe."
      correct: [title-portrait, title-landscape, button-portrait]
    explanation:
      uk: "Вертикально 12 < 59, тож текст заголовка під рядком стану, а 24 < 34 — кнопка під індикатором. Горизонтально згори вже 0, але зліва 59 > 16: виріз перекриває початок заголовка. Кут «згори зліва» безпечний не завжди, і після повороту перевіряти треба всі чотири сторони."
      en: "In portrait 12 < 59, so the header text is under the status bar, and 24 < 34 puts the button under the home indicator. In landscape the top is 0, but on the left 59 > 16: the cutout covers the start of the header. The top-left corner is not always safe, and after a rotation all four sides need checking."

  - id: wishlist-insets
    kind: example
    runtime: concept-preview
    dir: wishlist-insets
    entry: main.jsx
    strings:
      title: { uk: "Мої бажання", en: "My wishes" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      add: { uk: "Додати бажання", en: "Add a wish" }
    title:
      uk: "Список бажань в імітованій рамці"
      en: "A wishlist in a simulated frame"
    body:
      uk: |
        Імітація `DeviceFrame.jsx` малює рамку телефона й затемнює ділянки поза безпечною зоною, а `useSimulatedInsets()` повертає відступи цієї рамки — так само, як `useSafeAreaInsets()` повертає справжні на пристрої. Натисни **Запустити**: заголовок сховався під затемненою смугою, а кнопку частково закрив індикатор «додому».
      en: |
        The simulation `DeviceFrame.jsx` draws a phone frame and darkens the regions outside the safe area, and `useSimulatedInsets()` returns the insets of that frame — just as `useSafeAreaInsets()` returns the real ones on a device. Press **Run**: the header hides under the dark band, and the home indicator partly covers the button.
    tryIt:
      uk: |
        1. Заміни у `View` заголовка `style={styles.header}` на `style={[styles.header, { marginTop: insets.top }]}` і запусти: текст опустився, але разом з ним опустився й блакитний фон — під рядком стану тепер біла смуга (під затемненням вона сіра).
        2. Заміни `marginTop: insets.top` на `paddingTop: 12 + insets.top` і запусти: текст на тому самому місці, а фон знову доходить до верхнього краю. Зовнішній відступ рухає весь блок, внутрішній — лише вміст.
        3. Зміни `ORIENTATION` на `'landscape'` і запусти. Подивись, які частини екрана тепер під затемненням і з якого боку, — у вправі нижче ти виправиш саме такий випадок.
      en: |
        1. In the header's `View`, replace `style={styles.header}` with `style={[styles.header, { marginTop: insets.top }]}` and run: the text moved down, but the blue background moved down with it — there is now a white band under the status bar (grey under the dark overlay).
        2. Replace `marginTop: insets.top` with `paddingTop: 12 + insets.top` and run: the text is in the same place, and the background reaches the top edge again. An outer margin moves the whole block, inner padding only the content.
        3. Change `ORIENTATION` to `'landscape'` and run. Look at which parts of the screen are now under the dark bands, and on which side — in the exercise below you will fix exactly this case.
    limits:
      uk: "Це перегляд у браузері через [[react-native-web]], а не нативний застосунок. Рамку, затемнення й відступи імітує `DeviceFrame.jsx`, і числа в ньому — приклад, а не вимір реального телефона. Справжні відступи дає `useSafeAreaInsets()` з `react-native-safe-area-context` лише на пристрої, і вони різні для різних моделей та орієнтацій; поворот тут — це зміна константи, а не обертання пристрою. Перевірка — на твоїй [[declared-target|заявленій цілі]]."
      en: "This is a browser preview through [[react-native-web]], not a native app. The frame, the dark bands and the insets are simulated by `DeviceFrame.jsx`, and its numbers are an example, not a measurement of a real phone. Real insets come from `useSafeAreaInsets()` in `react-native-safe-area-context`, only on a device, and they differ between models and orientations; rotation here is a changed constant, not a turned device. Checking happens on your [[declared-target|declared target]]."

  - id: recall-reachable
    kind: review
    title:
      uk: "Пригадай: вміст має лишатися досяжним"
      en: "Recall: content must stay reachable"
    items:
      - id: zoom-fixed-width
        from: js-06-07-responsive-overflow-zoom-motion
        prompt:
          uk: "Картка у вебі має `width: 600px`. Людина збільшує масштаб сторінки до 200 % у вузькому вікні. Що станеться з карткою і як цього уникнути?"
          en: "A card on the web has `width: 600px`. A person zooms the page to 200 % in a narrow window. What happens to the card, and how is it avoided?"
        answer:
          type: choice
          options:
            - id: overflow
              text:
                uk: "Картка вилазить за край, і з’являється горизонтальна прокрутка; рятує гнучка ширина (max-width, відсотки) і перенесення"
                en: "The card sticks out of the edge and a horizontal scroll appears; a flexible width (max-width, percentages) and wrapping fix it"
            - id: shrinks
              text:
                uk: "Браузер сам зменшить картку до ширини вікна"
                en: "The browser shrinks the card to the window width by itself"
              why:
                uk: "Фіксована ширина лишається фіксованою: браузер не стискає її, і частина вмісту виходить за край."
                en: "A fixed width stays fixed: the browser does not shrink it, and part of the content goes past the edge."
            - id: nothing
              text:
                uk: "Нічого: при збільшенні все пропорційно росте й вміщається"
                en: "Nothing: when zooming everything grows proportionally and fits"
              why:
                uk: "Росте все, крім ширини вікна в CSS-пікселях — вона зменшується, тож фіксовані 600px у неї вже не вміщаються."
                en: "Everything grows except the window width in CSS pixels — it shrinks, so a fixed 600px no longer fits into it."
          correct: [overflow]
        explanation:
          uk: "Те саме правило діє на телефоні: вміст, до якого людина має дістатися, не можна залишати там, де його не видно — за краєм вікна у вебі, під вирізом чи індикатором «додому» тут."
          en: "The same rule holds on a phone: content a person must reach cannot be left where it is not visible — past the window edge on the web, under the cutout or the home indicator here."

  - id: expense-screen
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: expense-screen
    entry: main.jsx
    editable: [ExpenseScreen.jsx]
    strings:
      title: { uk: "Витрати за березень", en: "March expenses" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      lunch: { uk: "Обід", en: "Lunch" }
      add: { uk: "Додати витрату", en: "Add an expense" }
    title:
      uk: "Екран витрат у двох орієнтаціях"
      en: "An expense screen in two orientations"
    instructions:
      uk: |
        Перегляд показує той самий екран витрат у двох імітованих рамках — вертикальній і горизонтальній. Використай `insets` з `useSimulatedInsets()` (імітація з `DeviceFrame.jsx`, що стоїть на місці `useSafeAreaInsets()` з пристрою) у `ExpenseScreen.jsx`, щоб в **обох** орієнтаціях:

        - текст заголовка, рядки списку й кнопка «Додати витрату» не заходили під затемнені ділянки;
        - фон заголовка доходив до верхнього краю екрана, фон панелі — до нижнього, а фон списку — від лівого краю до правого.
      en: |
        The preview shows the same expense screen in two simulated frames — portrait and landscape. Use `insets` from `useSimulatedInsets()` (the simulation in `DeviceFrame.jsx` that stands in for the device's `useSafeAreaInsets()`) in `ExpenseScreen.jsx` so that in **both** orientations:

        - the header text, the list rows and the “Add an expense” button stay out of the dark regions;
        - the header background reaches the top edge of the screen, the bar background the bottom edge, and the list background runs from the left edge to the right.
    limits:
      uk: "Перевірки міряють верстку в перегляді react-native-web у двох імітованих рамках з прикладовими відступами. На пристрої відступи дає `useSafeAreaInsets()`, і їх перевіряють на заявленій цілі в обох орієнтаціях."
      en: "The checks measure the layout in the react-native-web preview in two simulated frames with example insets. On a device `useSafeAreaInsets()` gives the insets, and they are checked on your declared target in both orientations."
    testTitles:
      "the title stays inside the safe area in both orientations":
        uk: "Текст заголовка в безпечній зоні в обох орієнтаціях"
        en: "The title stays inside the safe area in both orientations"
      "the list rows stay inside the safe area in both orientations":
        uk: "Рядки списку в безпечній зоні в обох орієнтаціях"
        en: "The list rows stay inside the safe area in both orientations"
      "the add button stays inside the safe area in both orientations":
        uk: "Кнопка «Додати витрату» в безпечній зоні в обох орієнтаціях"
        en: "The add button stays inside the safe area in both orientations"
      "the backgrounds run edge to edge":
        uk: "Фони заголовка, списку й панелі доходять до країв екрана"
        en: "The header, list and bar backgrounds reach the screen edges"
    hints:
      nudge:
        uk: "Хто має зсунутися — фон чи вміст? Відповідь підказує, чим зсувати: зовнішнім відступом самого блока чи внутрішнім."
        en: "What has to move — the background or the content? The answer tells you how: with the block's outer margin or its inner padding."
      explanation:
        uk: "Внутрішній відступ (`padding`) зсуває вміст, а фон блока лишається на місці й заходить під апаратні частини. Відступ безпечної зони додають до звичайного: якщо в картки був `paddingLeft: 12`, то він стає `12 + insets.left`. Кожна сторона — свій відступ, і поворот міняє, які з них не нульові, тож враховуй усі чотири."
        en: "Inner padding moves the content, while the block's background stays put and runs under the hardware. The safe-area inset is added to the usual padding: if a card had `paddingLeft: 12`, it becomes `12 + insets.left`. Each side has its own inset, and rotation changes which of them are non-zero, so take all four into account."
    solutionNote:
      uk: "Заголовок, рядки й панель отримали внутрішні відступи, збільшені на `insets` своїх сторін, тож вміст у безпечній зоні, а фони — від краю до краю. Обгортка навколо всього екрана теж сховала б вміст, але зрізала б фони, — тому відступи стоять лише там, де вміст опинився б під апаратними частинами."
      en: "The header, the rows and the bar got inner padding increased by the `insets` of their sides, so the content is in the safe area and the backgrounds run edge to edge. A wrapper around the whole screen would also save the content but would cut the backgrounds — that is why the insets sit only where content would end up under the hardware."
    feedback:
      - when: { test: "the backgrounds run edge to edge" }
        message:
          uk: "Ця перевірка чекає, що фон заголовка торкається верхнього краю екрана, фон панелі — нижнього, а фон списку — обох бічних. Якщо відступи стоять на всьому екрані або є зовнішніми (`margin`) на самих блоках, фони зупиняються на межі безпечної зони."
          en: "This check expects the header background to touch the top edge of the screen, the bar background the bottom one, and the list background both sides. If the insets sit on the whole screen, or are outer margins on the blocks themselves, the backgrounds stop at the safe-area edge."
      - when: { test: "the list rows stay inside the safe area in both orientations" }
        message:
          uk: "Ця перевірка чекає, що текст рядків не заходить під бічні відступи. Горизонтально виріз збоку: `insets.left` і `insets.right` там по 59."
          en: "This check expects the row text to stay clear of the side insets. In landscape the cutout is on a side: `insets.left` and `insets.right` are 59 there."
      - when: { test: "the title stays inside the safe area in both orientations" }
        message:
          uk: "Ця перевірка чекає, що текст заголовка починається нижче за `insets.top` і правіше за `insets.left` у кожній рамці."
          en: "This check expects the header text to start below `insets.top` and to the right of `insets.left` in each frame."

  - id: to-project
    kind: transfer
    capstoneStep: RN-02
    body:
      uk: "У кроці проєкту заголовок твого списку й панель з кнопкою в `native/` отримають відступи з `useSafeAreaInsets()`, а фони лишаться від краю до краю. Перевіриш це на заявленій цілі в обох орієнтаціях."
      en: "In the project step the header of your list and the button bar in `native/` get insets from `useSafeAreaInsets()`, while the backgrounds stay edge to edge. You will check this on your declared target in both orientations."
