id: rn-02-01-view-text-image-input
unit: RN-02
title:
  uk: "View, Text, Image і поля введення"
  en: "View, Text, Image and inputs"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Зіставити вебелементи з нативними примітивами (div → View, p/span → Text, img → Image з джерелом і розміром, input → TextInput) і пояснити, чому кожен текст має стояти всередині Text."
    en: "Map web elements to native primitives (div → View, p/span → Text, img → Image with a source and a size, input → TextInput) and explain why every string must sit inside Text."
  - uk: "Зібрати картку запису з TextInput, чиє значення й onChangeText керовані станом."
    en: "Build a record card with a TextInput whose value and onChangeText are controlled by state."
prerequisites: [rn-01-08-capstone-native-subproject, rn-01-01-native-vs-web]
subskills:
  - { family: N-02, skill: "View/Text/Image/input", depth: intro }
glossary: [view-component, text-component, image-source, native-text-input]
selfCheck: [predict-broken-cards, record-card]

blocks:
  - id: four-primitives
    kind: explanation
    title:
      uk: "Чотири цеглинки замість HTML"
      en: "Four building blocks instead of HTML"
    body:
      uk: |
        У React Native немає `<div>`, `<p>` чи `<img>`. Кожен вебелемент має свій нативний відповідник з `react-native`:

        | Веб | React Native | Що важливо |
        |---|---|---|
        | `<div>` | [[view-component\|View]] | контейнер для верстки; **текст у ньому стояти не може** |
        | `<p>`, `<span>`, `<h2>` | [[text-component\|Text]] | **єдине** місце, де живе текст |
        | `<img src>` | `Image` | [[image-source\|source]] — об’єкт `{ uri }` або `require(…)`; картинці з мережі розмір задаєш сам |
        | `<input>` | [[native-text-input\|TextInput]] | значення приходить через `onChangeText`, а не через `event.target.value` |

        Чому текст лише в `Text`? У браузері текст — окремий DOM-вузол, і його можна покласти будь-куди. На телефоні текст малює окремий платформний компонент, тож рядок без `Text` просто нікому намалювати: застосунок падає з помилкою *Text strings must be rendered within a &lt;Text&gt; component*.

        Картинку з мережі телефон не бачить до завантаження, тому документація React Native каже: розміри мережевих картинок треба задати вручну. Без `width` і `height` таке `Image` має розмір 0 і нічого не показує.
      en: |
        React Native has no `<div>`, `<p>` or `<img>`. Each web element has a native counterpart from `react-native`:

        | Web | React Native | What matters |
        |---|---|---|
        | `<div>` | [[view-component\|View]] | a layout container; **text cannot sit in it** |
        | `<p>`, `<span>`, `<h2>` | [[text-component\|Text]] | the **only** place text lives |
        | `<img src>` | `Image` | [[image-source\|source]] is an object `{ uri }` or a `require(…)`; for a picture from the network you set the size yourself |
        | `<input>` | [[native-text-input\|TextInput]] | the value arrives through `onChangeText`, not through `event.target.value` |

        Why text only in `Text`? In a browser, text is a DOM node of its own and can go anywhere. On a phone, text is drawn by a separate platform component, so a string outside `Text` has nothing to draw it: the app fails with the error *Text strings must be rendered within a &lt;Text&gt; component*.

        A phone knows nothing about a network picture until it has downloaded it, so the React Native documentation says you must specify the dimensions of network images yourself. Without `width` and `height` such an `Image` is 0 in size and shows nothing.

  - id: web-to-native
    kind: visual
    visual: diagram
    title:
      uk: "Вебкартка і її нативна версія"
      en: "A web card and its native rewrite"
    textEquivalent:
      uk: "Ліворуч — чотири елементи вебкартки, праворуч — їхні нативні відповідники, з’єднані стрілками. Крок за кроком підсвічується кожна пара й правило, яке на телефоні ламається. div стає View — контейнером, у якому не може лежати голий текст. h2 стає Text: увесь текст картки має бути всередині Text, інакше застосунок падає з помилкою. img стає Image: йому потрібне джерело source, а мережевій картинці — ще й ширина й висота, бо без них розмір дорівнює нулю. input стає TextInput: стан задає value, а onChangeText повідомляє кожну зміну; без цієї пари стан компонента нічого не знає про введене."
      en: "On the left are the four elements of a web card, on the right their native counterparts, joined by arrows. Step by step each pair is highlighted with the rule that breaks on a phone. div becomes View — a container that cannot hold bare text. h2 becomes Text: all the card's text must be inside Text, or the app fails with an error. img becomes Image: it needs a source, and a network picture also needs a width and a height, because without them its size is zero. input becomes TextInput: state sets value, and onChangeText reports every change; without that pair the component's state knows nothing about what was typed."
    spec:
      layout: grid
      nodes:
        - { id: head-web, label: { uk: "Веб", en: "Web" }, shape: note, col: 0, row: 0 }
        - { id: head-native, label: "React Native", shape: note, col: 1, row: 0 }
        - { id: web-div, label: "<div>", col: 0, row: 1 }
        - { id: web-h2, label: "<h2>", col: 0, row: 2 }
        - { id: web-img, label: "<img src>", col: 0, row: 3 }
        - { id: web-input, label: "<input>", col: 0, row: 4 }
        - { id: rn-view, label: "View", col: 1, row: 1 }
        - { id: rn-text, label: "Text", col: 1, row: 2 }
        - { id: rn-image, label: "Image", col: 1, row: 3 }
        - { id: rn-input, label: "TextInput", col: 1, row: 4 }
      edges:
        - { id: map-div, from: web-div, to: rn-view }
        - { id: map-h2, from: web-h2, to: rn-text }
        - { id: map-img, from: web-img, to: rn-image }
        - { id: map-input, from: web-input, to: rn-input }
      steps:
        - caption:
            uk: "Та сама картка у двох світах: ліворуч HTML-елементи, праворуч нативні компоненти з `react-native`."
            en: "The same card in two worlds: HTML elements on the left, native components from `react-native` on the right."
        - highlight: [web-div, rn-view, map-div]
          annotate:
            - { id: rn-view, text: { uk: "без голого тексту", en: "no bare text" } }
          caption:
            uk: "`div` стає `View`. Це контейнер для верстки, і текст прямо в ньому на телефоні не намалюється."
            en: "`div` becomes `View`. It is a layout container, and text placed straight in it is not drawn on a phone."
        - highlight: [web-h2, rn-text, map-h2]
          annotate:
            - { id: rn-text, text: { uk: "увесь текст тут", en: "all text here" } }
          caption:
            uk: "`h2` стає `Text`. Кожен рядок тексту картки має бути всередині `Text`, інакше застосунок падає з помилкою."
            en: "`h2` becomes `Text`. Every string of the card must be inside `Text`, or the app fails with an error."
        - highlight: [web-img, rn-image, map-img]
          annotate:
            - { id: rn-image, text: { uk: "source + розмір", en: "source + size" } }
          caption:
            uk: "`img` стає `Image` з `source`. Мережевій картинці потрібні `width` і `height`: без них її розмір нульовий."
            en: "`img` becomes `Image` with a `source`. A network picture needs `width` and `height`: without them its size is zero."
        - highlight: [web-input, rn-input, map-input]
          annotate:
            - { id: rn-input, text: "value + onChangeText" }
          caption:
            uk: "`input` стає `TextInput`. Стан задає `value`, а `onChangeText` повідомляє кожну зміну, тож стан завжди знає, що введено."
            en: "`input` becomes `TextInput`. State sets `value`, and `onChangeText` reports every change, so state always knows what was typed."

  - id: predict-broken-cards
    kind: prediction
    prompt:
      uk: "Три варіанти картки витрати. Які з них на телефоні дадуть помилку або порожнє місце замість вмісту? Познач усі."
      en: "Three versions of an expense card. Which of them give an error or an empty spot instead of content on a phone? Mark all of them."
    code: |
      // A
      <View>Lunch</View>

      // B
      <Image source={{ uri: 'https://example.com/receipt.png' }} />

      // C
      <TextInput placeholder="Amount" />
    lang: jsx
    runnable: false
    answer:
      type: multi
      options:
        - id: a
          text:
            uk: "A — текст прямо у View"
            en: "A — text straight inside a View"
        - id: b
          text:
            uk: "B — мережева картинка без розміру"
            en: "B — a network picture without a size"
        - id: c
          text:
            uk: "C — TextInput без value"
            en: "C — a TextInput without value"
          why:
            uk: "Поле без `value` працює: людина вводить текст, і поле його показує. Проблема інша — твій стан про введене нічого не знає. Тому в застосунку поле зв’язують зі станом через `value` і `onChangeText`."
            en: "A field without `value` works: a person types and the field shows it. The problem is different — your state knows nothing about what was typed. That is why an app ties the field to state with `value` and `onChangeText`."
      correct: [a, b]
    explanation:
      uk: "A падає: текст на телефоні може жити лише в `Text`, і React Native повідомляє *Text strings must be rendered within a &lt;Text&gt; component*. B не падає, але нічого не показує: без `width` і `height` мережева картинка має розмір 0. C працює як некероване поле — показує введене, але стан про нього не знає."
      en: "A fails: on a phone text can only live in `Text`, and React Native reports *Text strings must be rendered within a &lt;Text&gt; component*. B does not fail but shows nothing: without `width` and `height` a network picture is 0 in size. C works as an uncontrolled field — it shows what was typed, but state does not know about it."

  - id: expense-card
    kind: example
    runtime: concept-preview
    dir: expense-card
    entry: main.jsx
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      amount: { uk: "845,50 грн", en: "UAH 845.50" }
    title:
      uk: "Картка, написана «по-вебівськи»"
      en: "A card written the web way"
    body:
      uk: |
        Ця картка витрати має всі три проблеми. Натисни **Запустити** і подивись на перегляд і консоль:

        - сірого прямокутника картинки не видно — у `Image` немає розміру;
        - у консолі червоний рядок *Unexpected text node: … A text node cannot be a child of a &lt;View&gt;*. Перегляд у браузері лише пише це в консоль і все одно малює текст; на телефоні на цьому місці застосунок упав би;
        - у поле не вдається нічого ввести: `value` бере назву зі стану, а змін ніхто не повідомляє, тож поле щоразу повертає старий текст.
      en: |
        This expense card has all three problems. Press **Run** and look at the preview and the console:

        - the grey picture box is not visible — the `Image` has no size;
        - the console shows a red line *Unexpected text node: … A text node cannot be a child of a &lt;View&gt;*. The browser preview only writes this to the console and draws the text anyway; on a phone the app would fail at this point;
        - you cannot type into the field: `value` takes the name from state, and nobody reports changes, so the field keeps returning the old text.
    tryIt:
      uk: |
        1. Заміни `View` навколо суми на `Text` і запусти: червоного рядка в консолі більше немає.
        2. Додай у `styles.receipt` розмір `width: 120, height: 80` і запусти: з’явився сірий прямокутник 120 × 80. Картинка в ньому не завантажиться — у перегляді немає мережі.
        3. Додай до `TextInput` проп `onChangeText={setLabel}` і запусти. Тепер введення змінює і поле, і заголовок картки: обидва читають той самий стан.
      en: |
        1. Replace the `View` around the amount with `Text` and run: the red console line is gone.
        2. Add the size `width: 120, height: 80` to `styles.receipt` and run: a 120 × 80 grey box appears. The picture inside it will not load — the preview has no network.
        3. Add the prop `onChangeText={setLabel}` to the `TextInput` and run. Now typing changes both the field and the card's title: both read the same state.
    limits:
      uk: "Це перегляд у браузері через [[react-native-web]], а не нативний застосунок. Голий текст у `View` тут дає лише рядок у консолі, а на телефоні — помилку. Картинки тут не завантажуються (немає мережі й файлів пристрою), видно лише розмір `Image`. Шрифти, вигляд поля й клавіатура — браузерні, не платформні. Перевірка на пристрої — у локальних завданнях на твоїй [[declared-target|заявленій цілі]]."
      en: "This is a browser preview through [[react-native-web]], not a native app. Bare text in a `View` only gives a console line here, while on a phone it is an error. Pictures do not load here (no network and no device files); only the size of the `Image` is visible. Fonts, the look of the field and the keyboard are the browser's, not the platform's. Checking on a device happens in the local tasks on your [[declared-target|declared target]]."

  - id: recall-preview
    kind: review
    title:
      uk: "Пригадай: що доводить перегляд"
      en: "Recall: what the preview proves"
    items:
      - id: preview-proves
        from: rn-01-01-native-vs-web
        prompt:
          uk: "Картка в перегляді концепцій виглядає правильно, кнопка реагує на натискання. Що з цього вже доведено для телефона?"
          en: "A card looks right in the concept preview and its button reacts to presses. Which of these is already proven for a phone?"
        answer:
          type: choice
          options:
            - id: logic
              text:
                uk: "Лише логіка компонента: стан і обробники працюють"
                en: "Only the component's logic: state and handlers work"
            - id: look
              text:
                uk: "Що на телефоні картка має той самий вигляд і шрифти"
                en: "That on a phone the card has the same look and fonts"
              why:
                uk: "Перегляд малює DOM-вузли засобами браузера. [[native-view|Платформні view]], шрифти пристрою й вигляд полів він не показує."
                en: "The preview draws DOM nodes with the browser. It does not show [[native-view|platform views]], device fonts or the look of the fields."
            - id: errors
              text:
                uk: "Що на телефоні не буде помилок рендерингу"
                en: "That there will be no rendering errors on a phone"
              why:
                uk: "Деякі помилки телефона перегляд лише показує рядком у консолі, а сам малює далі — як голий текст у `View`."
                en: "Some phone errors are only a console line in the preview, which goes on drawing — like bare text in a `View`."
          correct: [logic]
        explanation:
          uk: "Перегляд виконує справжній код компонента, тож стан і обробники перевірено. Усе, що належить платформі — нативні view, шрифти, вигляд, помилки нативного рендерингу, — перевіряють на заявленій цілі."
          en: "The preview runs the component's real code, so state and handlers are checked. Everything that belongs to the platform — native views, fonts, the look, native rendering errors — is checked on the declared target."

  - id: record-card
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: record-card
    entry: main.jsx
    editable: [RecordCard.jsx]
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      noPrice: { uk: "без ціни", en: "no price" }
      renamed: { uk: "Лампа для читання", en: "Reading lamp" }
    title:
      uk: "Картка бажання"
      en: "A wish card"
    instructions:
      uk: |
        У `RecordCard.jsx` збери картку бажання зі списку бажань. Перегляд показує дві картки: «Настільна лампа» з ціною і «Квитки на концерт» без ціни.

        У картці мають бути:

        - `Image` з `source={PICTURE}`, `testID="picture"` і розміром, щоб його сірий прямокутник було видно;
        - назва бажання зі стану `name`;
        - ціна через спільний форматер `formatPrice(item.price)` з `format.js` — він сам пише «без ціни», коли ціни немає;
        - `TextInput`, що змінює назву: введене одразу з’являється в назві картки.

        Пам’ятай: увесь текст — усередині `Text`.
      en: |
        In `RecordCard.jsx`, build a wish card for the wishlist. The preview shows two cards: “Desk lamp” with a price and “Concert tickets” without one.

        The card needs:

        - an `Image` with `source={PICTURE}`, `testID="picture"` and a size, so its grey box is visible;
        - the wish's name from the `name` state;
        - the price through the shared formatter `formatPrice(item.price)` from `format.js` — it writes “no price” by itself when there is none;
        - a `TextInput` that edits the name: what you type appears in the card's name at once.

        Remember: all text goes inside `Text`.
    limits:
      uk: "Перевірки працюють у перегляді react-native-web: вони вводять текст у поле браузера й міряють розмір прямокутника `Image`. Голий текст у `View` тут ловиться лише за червоним рядком помилки в консолі. Як картка виглядає й поводиться на телефоні, перевіряють на заявленій цілі."
      en: "The checks run in the react-native-web preview: they type into a browser field and measure the `Image` box. Bare text in a `View` is caught here only by the red error line in the console. How the card looks and behaves on a phone is checked on the declared target."
    testTitles:
      "each card shows the name and the formatted price":
        uk: "Кожна картка показує назву й відформатовану ціну"
        en: "Each card shows the name and the formatted price"
      "every piece of text sits inside a Text":
        uk: "Увесь текст стоїть усередині `Text`"
        en: "Every piece of text sits inside a `Text`"
      "the picture has a width and a height":
        uk: "`Image` з `testID=\"picture\"` має ширину й висоту"
        en: "The `Image` with `testID=\"picture\"` has a width and a height"
      "typing in the field renames the card":
        uk: "Введення в поле змінює назву в картці"
        en: "Typing in the field renames the card"
    hints:
      nudge:
        uk: "Пройди картку зверху вниз і для кожної частини спитай себе: це контейнер, текст, картинка чи поле?"
        en: "Go through the card top to bottom and ask for each part: is it a container, text, a picture or a field?"
      explanation:
        uk: "Текст будь-якого походження — зі стану чи з функції — показує лише `Text`. Мережевому `Image` розмір дають у стилі, як-от `{ width: 32, height: 32 }` у картці категорії. А поле, що має змінювати стан, отримує дві речі: поточне значення зі стану й функцію, яку React Native викликає з новим текстом після кожного введення."
        en: "Text of any origin — from state or from a function — is shown only by `Text`. A network `Image` gets its size in its style, like `{ width: 32, height: 32 }` on a category card. And a field that should change state gets two things: the current value from state and a function React Native calls with the new text after every keystroke."
    solutionNote:
      uk: "`Image` отримав розмір у `styles.picture`, тому його видно ще до завантаження. Назва й ціна стоять у `Text`. `TextInput` керований: `value={name}` показує стан, `onChangeText={setName}` записує кожну зміну, і назва картки оновлюється разом з полем. `formatPrice` — той самий спільний форматер, що й у вебклієнті."
      en: "The `Image` got its size in `styles.picture`, so it is visible even before loading. The name and the price sit in `Text`. The `TextInput` is controlled: `value={name}` shows state, `onChangeText={setName}` records every change, and the card's name updates together with the field. `formatPrice` is the same shared formatter as in the web client."
    feedback:
      - when: { test: "every piece of text sits inside a Text" }
        message:
          uk: "Ця перевірка чекає, що в консолі немає червоного рядка *A text node cannot be a child of a &lt;View&gt;*. Якщо воно є, якийсь текст — можливо, результат `formatPrice` — стоїть прямо у `View`; загорни його в `Text`."
          en: "This check expects no red console line *A text node cannot be a child of a &lt;View&gt;*. If there is one, some text — perhaps the result of `formatPrice` — sits straight in a `View`; wrap it in `Text`."
      - when: { test: "the picture has a width and a height" }
        message:
          uk: "Ця перевірка шукає в першій картці елемент з `testID=\"picture\"` і чекає, що його ширина й висота більші за 0. Мережеве `Image` без `width` і `height` у стилі має розмір 0."
          en: "This check looks for an element with `testID=\"picture\"` in the first card and expects its width and height to be above 0. A network `Image` without `width` and `height` in its style is 0 in size."
      - when: { test: "typing in the field renames the card" }
        message:
          uk: "Ця перевірка вводить нову назву в `TextInput` першої картки й чекає її в тексті картки. Для цього поле має отримувати `value` зі стану й повідомляти кожну зміну через `onChangeText`."
          en: "This check types a new name into the first card's `TextInput` and expects it in the card's text. For that the field must get `value` from state and report every change through `onChangeText`."

  - id: to-project
    kind: transfer
    capstoneStep: RN-02
    body:
      uk: "У кроці проєкту цього розділу ти перенесеш картку запису свого проєкту в `native/`: `View` замість контейнерів, увесь текст у `Text`, поля форми як керовані `TextInput`. Текст для картки й далі дає спільний доменний код — нічого з нього не копіюй."
      en: "In this unit's project step you will move your project's record card into `native/`: `View` instead of containers, all text in `Text`, form fields as controlled `TextInput`s. The card's text still comes from the shared domain code — copy nothing out of it."
