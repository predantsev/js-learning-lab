id: rn-02-07-debug-clipped-layout
unit: RN-02
title:
  uk: "Налагодження: обрізане поле, заголовок під вирізом екрана, відсутня мітка"
  en: "Debug: clipped input, unsafe area, missing label"
kind: local-task
minutes: 20
contentVersion: 1
purpose:
  uk: "Три найчастіші вади нативної верстки — поле, що обрізає збільшений текст, заголовок під рядком стану й кнопка, про яку скрінрідер нічого не каже, — непомітні, доки дивишся на екран зі стандартними налаштуваннями. Тут ти спершу знаходиш і лагодиш їх у перегляді, а потім відтворюєш і перевіряєш на своїй заявленій цілі так, як їх побачить людина зі збільшеним шрифтом і скрінрідером."
  en: "The three most common native layout defects — a field that clips enlarged text, a header under the status bar and a button a screen reader says nothing useful about — stay invisible while you look at a screen with default settings. Here you first find and repair them in the preview, then reproduce and check them on your declared target the way a person with a larger font and a screen reader will meet them."
objectives:
  - uk: "Відтворити на заявленій цілі три навмисні вади: поле, обрізане при великому шрифті, заголовок під рядком стану чи вирізом і кнопку з самою іконкою без мітки."
    en: "Reproduce three seeded defects on the declared target: an input clipped at large font scale, a header under the status bar or notch, and an unlabeled icon button."
  - uk: "Виправити кожну ваду й підтвердити виправлення на заявленій цілі з увімкненим скрінрідером і збільшеним шрифтом."
    en: "Repair each defect and confirm the fix on the declared target with a screen reader on and an enlarged font size."
prerequisites: [rn-02-06-platform-differences]
subskills:
  - { family: N-02, skill: "styling/Flexbox/density", depth: assess }
  - { family: N-02, skill: "safe areas", depth: assess }
  - { family: N-02, skill: "accessibility labels/focus", depth: assess }
glossary: []
selfCheck: [seeded-screen]

blocks:
  - id: three-defects
    kind: explanation
    title:
      uk: "Три вади, яких не видно зі стандартними налаштуваннями"
      en: "Three defects you cannot see with default settings"
    body:
      uk: |
        Екран планувальника виглядає нормально, доки дивишся на нього як розробник. Але:

        - **при збільшеному шрифті** поле «Нова справа» з `height: 40` не росте разом з текстом — текст обрізається;
        - **на телефоні з вирізом** заголовок починається під рядком стану: відступи безпечної зони враховано лише знизу;
        - **зі скрінрідером** кнопка-хрестик — безіменний елемент без ролі: людина не знає, що вона видаляє і що це взагалі кнопка.

        Порядок роботи той самий, що й у вебі: відтворити → знайти причину в коді → виправити причину, а не симптом → перевірити тим самим способом, яким відтворив. «Виправлення», що ховає симптом, — як-от `allowFontScaling={false}` чи зовнішній `margin` замість внутрішнього відступу, — створює нову ваду.
      en: |
        The planner screen looks fine while you look at it as a developer. But:

        - **at a larger font size** the “New task” field with `height: 40` does not grow with the text — the text gets clipped;
        - **on a phone with a notch** the header starts under the status bar: the safe-area insets were applied only at the bottom;
        - **with a screen reader** the cross button is a nameless element with no role: the person does not know what it deletes, or that it is a button at all.

        The routine is the same as on the web: reproduce → find the cause in the code → fix the cause, not the symptom → check the same way you reproduced it. A “fix” that hides the symptom — such as `allowFontScaling={false}` or an outer `margin` instead of inner padding — creates a new defect.

  - id: seeded-screen
    kind: exercise
    mode: debug
    runtime: concept-preview
    dir: seeded-screen
    entry: main.jsx
    editable: [PlannerScreen.jsx]
    strings:
      heading: { uk: "Планувальник", en: "Planner" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      newTask: { uk: "Нова справа", en: "New task" }
      draft: { uk: "Здати книжки", en: "Return books" }
      remove: { uk: "Видалити", en: "Delete" }
    title:
      uk: "Екран планувальника з трьома вадами"
      en: "A planner screen with three defects"
    instructions:
      uk: |
        Перегляд показує екран планувальника в імітованій вертикальній рамці при імітованому розмірі тексту 200 %. У `PlannerScreen.jsx` три вади: поле «Нова справа» обрізає текст, заголовок ховається під рядком стану, а кнопки-хрестики не мають ні ролі, ні назви.

        Знайди причину кожної й виправ її, не ховаючи симптом:

        - текст поля й далі росте разом із системним розміром тексту;
        - фон заголовка й далі доходить до верхнього краю;
        - кожен хрестик оголошується як кнопка з назвою, у якій є назва його справи, і далі видаляє справу.
      en: |
        The preview shows a planner screen in a simulated portrait frame at a simulated 200 % text size. `PlannerScreen.jsx` has three defects: the “New task” field clips its text, the header hides under the status bar, and the cross buttons have neither a role nor a name.

        Find the cause of each and fix it without hiding the symptom:

        - the field's text still grows with the system text size;
        - the header background still reaches the top edge;
        - each cross is announced as a button whose name contains its task's title, and it still deletes the task.
    limits:
      uk: "Перевірки міряють рамки й атрибути в перегляді react-native-web з імітованими відступами безпечної зони й розміром тексту. Справжні системний розмір шрифту, рядок стану, виріз і оголошення VoiceOver чи TalkBack перевіряєш у локальному завданні нижче на заявленій цілі."
      en: "The checks measure boxes and attributes in the react-native-web preview with simulated safe-area insets and text size. The real system font size, status bar, cutout and VoiceOver or TalkBack announcements are checked in the local task below on your declared target."
    testTitles:
      "the new-task field is tall enough for its text at 200 %":
        uk: "Поле «Нова справа» вміщає свій текст при 200 %"
        en: "The new-task field is tall enough for its text at 200 %"
      "the field text still follows the system text size":
        uk: "Текст поля й далі росте з системним розміром тексту"
        en: "The field text still follows the system text size"
      "the header text sits below the status bar":
        uk: "Текст заголовка нижче за рядок стану"
        en: "The header text sits below the status bar"
      "the header background still reaches the top edge":
        uk: "Фон заголовка й далі доходить до верхнього краю"
        en: "The header background still reaches the top edge"
      "every delete button is announced as a button with its task":
        uk: "Кожен хрестик — кнопка з назвою своєї справи"
        en: "Every delete button is announced as a button with its task"
      "a delete button still removes its task":
        uk: "Хрестик і далі видаляє свою справу"
        en: "A delete button still removes its task"
    hints:
      nudge:
        uk: "Для кожної вади спитай: яке значення в коді не змінюється, коли змінюються умови — розмір тексту, апаратні частини екрана, спосіб, яким людина «бачить» кнопку?"
        en: "For each defect ask: which value in the code does not change when the conditions change — the text size, the screen hardware, the way a person “sees” the button?"
      explanation:
        uk: "Фіксована висота не росте разом з текстом — висоту має давати вміст із відступами, а мінімальну межу задає `minHeight`. Відступ безпечної зони вже прочитано в `insets`, але згори його ніхто не використав; вміст зсувають внутрішнім відступом, щоб фон лишився на місці. А кнопці потрібні дві речі: роль, щоб скрінрідер сказав «кнопка», і назва, яка відрізняє її від сусідніх хрестиків."
        en: "A fixed height does not grow with the text — the content with its padding should give the height, and `minHeight` sets a lower bound. The safe-area inset has already been read into `insets`, but nobody used it at the top; content is moved with inner padding so the background stays put. And the button needs two things: a role, so the screen reader says “button”, and a name that tells it apart from the neighbouring crosses."
    solutionNote:
      uk: "Поле втратило `height: 40` і отримало `minHeight: 44`: тепер висоту дають текст і відступи, а `allowFontScaling` лишився увімкненим. Заголовок отримав `paddingTop: 12 + insets.top` — текст нижче рядка стану, фон під ним. Хрестики отримали `accessibilityRole=\"button\"` і `accessibilityLabel` з назвою справи, тож скрінрідер скаже, наприклад, «Видалити Написати бабусі, кнопка»."
      en: "The field lost `height: 40` and got `minHeight: 44`: now the text and padding give the height, and `allowFontScaling` stays on. The header got `paddingTop: 12 + insets.top` — the text is below the status bar, the background under it. The crosses got `accessibilityRole=\"button\"` and an `accessibilityLabel` with the task's title, so a screen reader says, for example, “Delete Write to grandma, button”."
    feedback:
      - when: { test: "the new-task field is tall enough for its text at 200 %" }
        message:
          uk: "Ця перевірка порівнює внутрішню висоту поля з розміром його шрифту й відступами. Фіксована `height` не росте разом з текстом — дай висоту вмісту, а нижню межу задай через `minHeight`."
          en: "This check compares the field's inner height with its font size and padding. A fixed `height` does not grow with the text — let the content give the height, and set a lower bound with `minHeight`."
      - when: { test: "the field text still follows the system text size" }
        message:
          uk: "Ця перевірка чекає, що шрифт поля при 200 % — щонайменше 32 (16 × 2). `allowFontScaling={false}` чи `maxFontSizeMultiplier` ховають обрізання, але відбирають у людини збільшений текст."
          en: "This check expects the field's font at 200 % to be at least 32 (16 × 2). `allowFontScaling={false}` or `maxFontSizeMultiplier` hide the clipping but take the enlarged text away from the person."
      - when: { test: "the header background still reaches the top edge" }
        message:
          uk: "Ця перевірка чекає, що фон заголовка починається від верхнього краю екрана. Зовнішній `marginTop` зсуває весь блок разом з фоном; вміст зсувають внутрішнім відступом."
          en: "This check expects the header background to start at the top edge of the screen. An outer `marginTop` moves the whole block, background included; content is moved with inner padding."
      - when: { test: "every delete button is announced as a button with its task" }
        message:
          uk: "Ця перевірка чекає для кожного хрестика роль `button` і назву, що містить назву його справи. Назва без ролі не каже, що це кнопка; роль без назви не каже, що вона видаляє."
          en: "This check expects every cross to have the role `button` and a name containing its task's title. A name without a role does not say it is a button; a role without a name does not say what it deletes."

  - id: recall-dom-defects
    kind: review
    title:
      uk: "Пригадай: як підтверджували виправлення у вебі"
      en: "Recall: how repairs were confirmed on the web"
    items:
      - id: confirm-label
        from: js-06-14-debug-dom-defects
        prompt:
          uk: "Ти додав мітку полю вебформи, яке не мало назви. Яка перевірка справді доводить, що виправлення працює для людини зі скрінрідером?"
          en: "You added a label to a web form field that had no name. Which check really proves the repair works for a person using a screen reader?"
        answer:
          type: choice
          options:
            - id: tree
              text:
                uk: "Подивитися назву поля в дереві доступності (або послухати скрінрідер), а не лише код"
                en: "Look at the field's name in the accessibility tree (or listen to a screen reader), not only at the code"
            - id: visual
              text:
                uk: "Переконатися, що мітку видно над полем"
                en: "Make sure the label is visible above the field"
              why:
                uk: "Видимий текст поруч ще не означає звʼязку: саме цю ваду ти й лагодив. Доводить лише те, що отримує технологія доступності."
                en: "Visible text next to a field does not mean a link: that is exactly the defect you were repairing. Only what assistive technology receives proves it."
            - id: compiles
              text:
                uk: "Переконатися, що сторінка завантажується без помилок у консолі"
                en: "Make sure the page loads without console errors"
              why:
                uk: "Сторінка без мітки теж завантажується без помилок — консоль про доступність не повідомляє."
                en: "A page without the label also loads without errors — the console reports nothing about accessibility."
          correct: [tree]
        explanation:
          uk: "Виправлення перевіряють тим самим способом, яким ваду знайшли: назву — у дереві доступності чи скрінрідером, переповнення — при 200 %. На телефоні так само: мітку слухаєш у VoiceOver чи TalkBack, обрізання дивишся зі збільшеним системним шрифтом."
          en: "A repair is checked the same way the defect was found: a name in the accessibility tree or with a screen reader, an overflow at 200 %. On a phone it is the same: you listen to the label in VoiceOver or TalkBack and look for clipping with the enlarged system font."

  - id: on-device
    kind: local-task
    runtime: local-native
    title:
      uk: "Ті самі три вади на твоїй заявленій цілі"
      en: "The same three defects on your declared target"
    intro:
      uk: |
        Це завдання виконується на твоєму компʼютері й на **заявленій цілі** з розділу RN-01 — емуляторі Android, симуляторі iOS або телефоні. Щоб не чіпати твій проєкт, створимо окремий навчальний проєкт `rn02-lab` у теці `~/js-course`.

        Команди кроків 1, 2 і 4 запускали під час підготовки уроку з Node.js v25 і `create-expo-app` 5.0.0 (крок 1 — з прапорцем `--no-install`, після чого пакети встановили окремо через `npm install`): шаблон дав Expo SDK 57 (`expo` ~57.0.26) і React Native 0.86.3, `npx expo install` додав `react-native-safe-area-context` ~5.7.0, а `npx tsc --noEmit` для коду з кроку 3 завершився без жодного повідомлення. **Запуск на пристрої (крок 5 і далі) під час підготовки не перевірено** — там немає нативних інструментів; кроки описано за документацією Expo SDK 57 і React Native 0.86.

        Якщо емулятора, симулятора чи телефона немає, натисни **«У мене немає емулятора чи пристрою»** нижче: завдання запишеться як не виконане, і ти зможеш іти далі — вправа вище вже закрила частину в перегляді. Повернися сюди, коли зʼявиться пристрій.

        **Крок 3 — вміст `App.tsx`** (повністю заміни ним файл):

        ```tsx
        // RN-02 seeded screen: three defects on purpose (clipped field, header under the status bar, unlabeled icon button).
        import { useState } from 'react';
        import { Pressable, StyleSheet, Text, TextInput, View } from 'react-native';
        import { SafeAreaProvider, useSafeAreaInsets } from 'react-native-safe-area-context';

        type Task = { id: string; title: string };

        const initialTasks: Task[] = [
          { id: 't-03', title: 'Написати бабусі' },
          { id: 't-05', title: 'Записатися до стоматолога' },
        ];

        function PlannerScreen() {
          const insets = useSafeAreaInsets();
          const [tasks, setTasks] = useState(initialTasks);
          const [draft, setDraft] = useState('');
          return (
            <View style={styles.screen}>
              <View style={styles.header}>
                <Text style={styles.heading}>Планувальник</Text>
              </View>
              {tasks.map((task) => (
                <View key={task.id} style={styles.row}>
                  <Text style={styles.rowText}>{task.title}</Text>
                  <Pressable onPress={() => setTasks(tasks.filter((t) => t.id !== task.id))} style={styles.delete}>
                    <Text style={styles.icon}>✕</Text>
                  </Pressable>
                </View>
              ))}
              <View style={[styles.form, { paddingBottom: 16 + insets.bottom }]}>
                <Text style={styles.label}>Нова справа</Text>
                <TextInput accessibilityLabel="Нова справа" value={draft} onChangeText={setDraft} style={styles.input} />
              </View>
            </View>
          );
        }

        export default function App() {
          return (
            <SafeAreaProvider>
              <PlannerScreen />
            </SafeAreaProvider>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, backgroundColor: '#ffffff' },
          header: { paddingHorizontal: 16, paddingVertical: 12, backgroundColor: '#e8eef7' },
          heading: { fontSize: 18, fontWeight: '600' },
          row: { flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', paddingLeft: 16, borderBottomWidth: 1, borderColor: '#d4d4d4' },
          rowText: { fontSize: 14, flexShrink: 1 },
          delete: { padding: 12 },
          icon: { fontSize: 12, color: '#b91c1c' },
          form: { marginTop: 'auto', padding: 16, gap: 4 },
          label: { fontSize: 14 },
          input: { height: 40, paddingHorizontal: 10, paddingVertical: 10, fontSize: 16, borderWidth: 1, borderColor: '#767676', borderRadius: 6 },
        });
        ```

        **Крок 8 — три виправлення** (заміни відповідні місця в `App.tsx`):

        ```tsx
        // the header: content below the status bar, background under it
        <View style={[styles.header, { paddingTop: 12 + insets.top }]}>

        // the cross: a role and a name with the task's title
        <Pressable
          accessibilityRole="button"
          accessibilityLabel={`Видалити ${task.title}`}
          onPress={() => setTasks(tasks.filter((t) => t.id !== task.id))}
          style={styles.delete}
        >

        // the field: no fixed height, only a lower bound
        input: { minHeight: 44, paddingHorizontal: 10, paddingVertical: 10, fontSize: 16, borderWidth: 1, borderColor: '#767676', borderRadius: 6 },
        ```
      en: |
        This task runs on your computer and on the **declared target** from unit RN-01 — an Android emulator, an iOS simulator or a phone. To leave your project untouched, we create a separate lab project `rn02-lab` in the `~/js-course` folder.

        The commands of steps 1, 2 and 4 were run while preparing this lesson with Node.js v25 and `create-expo-app` 5.0.0 (step 1 with the `--no-install` flag, after which the packages were installed separately with `npm install`): the template gave Expo SDK 57 (`expo` ~57.0.26) and React Native 0.86.3, `npx expo install` added `react-native-safe-area-context` ~5.7.0, and `npx tsc --noEmit` on the code from step 3 finished without any message. **Running on a device (step 5 onward) was not checked while preparing** — there were no native tools; those steps follow the Expo SDK 57 and React Native 0.86 documentation.

        If you have no emulator, simulator or phone, press **“I have no emulator or device”** below: the task is recorded as not performed, and you can move on — the exercise above already covered the preview part. Come back here when you have a device.

        **Step 3 — contents of `App.tsx`** (replace the whole file with it):

        ```tsx
        // RN-02 seeded screen: three defects on purpose (clipped field, header under the status bar, unlabeled icon button).
        import { useState } from 'react';
        import { Pressable, StyleSheet, Text, TextInput, View } from 'react-native';
        import { SafeAreaProvider, useSafeAreaInsets } from 'react-native-safe-area-context';

        type Task = { id: string; title: string };

        const initialTasks: Task[] = [
          { id: 't-03', title: 'Write to grandma' },
          { id: 't-05', title: 'Book a dentist visit' },
        ];

        function PlannerScreen() {
          const insets = useSafeAreaInsets();
          const [tasks, setTasks] = useState(initialTasks);
          const [draft, setDraft] = useState('');
          return (
            <View style={styles.screen}>
              <View style={styles.header}>
                <Text style={styles.heading}>Planner</Text>
              </View>
              {tasks.map((task) => (
                <View key={task.id} style={styles.row}>
                  <Text style={styles.rowText}>{task.title}</Text>
                  <Pressable onPress={() => setTasks(tasks.filter((t) => t.id !== task.id))} style={styles.delete}>
                    <Text style={styles.icon}>✕</Text>
                  </Pressable>
                </View>
              ))}
              <View style={[styles.form, { paddingBottom: 16 + insets.bottom }]}>
                <Text style={styles.label}>New task</Text>
                <TextInput accessibilityLabel="New task" value={draft} onChangeText={setDraft} style={styles.input} />
              </View>
            </View>
          );
        }

        export default function App() {
          return (
            <SafeAreaProvider>
              <PlannerScreen />
            </SafeAreaProvider>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, backgroundColor: '#ffffff' },
          header: { paddingHorizontal: 16, paddingVertical: 12, backgroundColor: '#e8eef7' },
          heading: { fontSize: 18, fontWeight: '600' },
          row: { flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', paddingLeft: 16, borderBottomWidth: 1, borderColor: '#d4d4d4' },
          rowText: { fontSize: 14, flexShrink: 1 },
          delete: { padding: 12 },
          icon: { fontSize: 12, color: '#b91c1c' },
          form: { marginTop: 'auto', padding: 16, gap: 4 },
          label: { fontSize: 14 },
          input: { height: 40, paddingHorizontal: 10, paddingVertical: 10, fontSize: 16, borderWidth: 1, borderColor: '#767676', borderRadius: 6 },
        });
        ```

        **Step 8 — three repairs** (replace the matching places in `App.tsx`):

        ```tsx
        // the header: content below the status bar, background under it
        <View style={[styles.header, { paddingTop: 12 + insets.top }]}>

        // the cross: a role and a name with the task's title
        <Pressable
          accessibilityRole="button"
          accessibilityLabel={`Delete ${task.title}`}
          onPress={() => setTasks(tasks.filter((t) => t.id !== task.id))}
          style={styles.delete}
        >

        // the field: no fixed height, only a lower bound
        input: { minHeight: 44, paddingHorizontal: 10, paddingVertical: 10, fontSize: 16, borderWidth: 1, borderColor: '#767676', borderRadius: 6 },
        ```
    tools:
      - { name: "Node.js", version: "22.13 or newer", note: { uk: "мінімум для Expo SDK 57 за таблицею версій Expo", en: "the minimum for Expo SDK 57 per Expo's version table" } }
      - { name: "Expo SDK", version: "57 (React Native 0.86)", note: { uk: "ставиться командою з кроку 1", en: "installed by the command in step 1" } }
      - { name: "react-native-safe-area-context", version: "~5.7.0", note: { uk: "версію підбирає `npx expo install`", en: "`npx expo install` picks the version" } }
      - { name: "Declared target", version: "from RN-01", note: { uk: "емулятор Android, симулятор iOS або телефон з Expo Go для SDK 57", en: "an Android emulator, an iOS simulator or a phone with Expo Go for SDK 57" } }
    steps:
      - text:
          uk: "У терміналі перейди в теку `~/js-course` і створи навчальний проєкт з шаблону TypeScript."
          en: "In the terminal, go to the `~/js-course` folder and create the lab project from the TypeScript template."
        command: "npx create-expo-app@latest rn02-lab --template blank-typescript"
        expect:
          uk: "Зʼявилася тека `rn02-lab` з `App.tsx` і `package.json`, де `expo` ~57 і `react-native` 0.86.x."
          en: "A folder `rn02-lab` appears with `App.tsx` and a `package.json` listing `expo` ~57 and `react-native` 0.86.x."
      - text:
          uk: "Перейди в теку проєкту (`cd rn02-lab`) і додай бібліотеку безпечних зон версії, сумісної з SDK."
          en: "Go into the project folder (`cd rn02-lab`) and add the safe-area library in the version that matches the SDK."
        command: "npx expo install react-native-safe-area-context"
        expect:
          uk: "У `dependencies` у `package.json` зʼявився рядок `react-native-safe-area-context` з версією ~5.7.0."
          en: "`package.json` lists `react-native-safe-area-context` with version ~5.7.0 under `dependencies`."
      - text:
          uk: "Відкрий `App.tsx` у VS Code і заміни весь його вміст кодом «Крок 3» зі вступу до цього завдання. Збережи файл."
          en: "Open `App.tsx` in VS Code and replace its whole content with the “Step 3” code from this task's introduction. Save the file."
      - text:
          uk: "Перевір типи, перш ніж запускати."
          en: "Check the types before running."
        command: "npx tsc --noEmit"
        expect:
          uk: "Команда завершується без жодного повідомлення."
          en: "The command finishes without any message."
      - text:
          uk: "Запусти dev-сервер і відкрий застосунок на заявленій цілі: `a` — емулятор Android, `i` — симулятор iOS, або відскануй QR-код у Expo Go на телефоні. Не перевірено під час підготовки уроку."
          en: "Start the dev server and open the app on your declared target: `a` for the Android emulator, `i` for the iOS simulator, or scan the QR code with Expo Go on a phone. Not checked while preparing this lesson."
        command: "npx expo start"
        expect:
          uk: "На цілі видно заголовок «Планувальник», дві справи з хрестиками й поле «Нова справа» внизу."
          en: "The target shows the “Planner” heading, two tasks with crosses and the “New task” field at the bottom."
      - text:
          uk: "Збільш системний шрифт до максимуму. Android: Налаштування → Екран → Розмір шрифту (назви розділів залежать від виробника). iOS: Параметри → Доступність → Дисплей і розмір тексту → Більший текст, з увімкненими більшими розмірами. Введи текст у поле «Нова справа» й запиши, що бачиш: обрізаний текст — перша вада."
          en: "Raise the system font to the maximum. Android: Settings → Display → Font size (section names depend on the manufacturer). iOS: Settings → Accessibility → Display & Text Size → Larger Text, with larger sizes turned on. Type into the “New task” field and write down what you see: clipped text is the first defect."
      - text:
          uk: "Подивись на заголовок: якщо він під рядком стану чи вирізом, це друга вада. Потім увімкни TalkBack (Android) або VoiceOver (iOS) і торкнись хрестика: запиши, що каже скрінрідер, — назва без справи і без слова «кнопка» є третьою вадою. Зі скрінрідером натискають подвійним дотиком, а прокручують двома пальцями (TalkBack) або трьома (VoiceOver)."
          en: "Look at the header: if it sits under the status bar or the notch, that is the second defect. Then turn on TalkBack (Android) or VoiceOver (iOS) and touch a cross: write down what the screen reader says — no task name and no word “button” is the third defect. With a screen reader you activate with a double tap and scroll with two fingers (TalkBack) or three (VoiceOver)."
      - text:
          uk: "Внеси три виправлення з блоку «Крок 8» у вступі й збережи файл. Застосунок оновиться через dev-сервер без перезбирання."
          en: "Make the three repairs from the “Step 8” block in the introduction and save the file. The app updates through the dev server without a rebuild."
      - text:
          uk: "Повтори перевірку з кроків 6 і 7 з тим самим максимальним шрифтом і увімкненим скрінрідером: поле росте з текстом, заголовок нижче рядка стану з фоном під ним, хрестик оголошується як «Видалити Написати бабусі, кнопка» чи подібно. Наприкінці поверни звичайний розмір шрифту й вимкни скрінрідер."
          en: "Repeat the check from steps 6 and 7 with the same maximum font and the screen reader on: the field grows with the text, the header is below the status bar with the background under it, the cross is announced as “Delete Write to grandma, button” or similar. At the end, restore the usual font size and turn the screen reader off."
    verify:
      - { id: defects-seen, text: { uk: "Я відтворив(-ла) на заявленій цілі всі три вади й записав(-ла), що побачив(-ла) й почув(-ла)", en: "I reproduced all three defects on my declared target and wrote down what I saw and heard" } }
      - { id: field-grows, text: { uk: "Після виправлення поле «Нова справа» не обрізає текст при максимальному системному шрифті", en: "After the repair the “New task” field does not clip its text at the maximum system font" } }
      - { id: header-safe, text: { uk: "Текст заголовка нижче рядка стану й вирізу, а його фон доходить до верхнього краю", en: "The header text is below the status bar and the notch, and its background reaches the top edge" } }
      - { id: button-announced, text: { uk: "Скрінрідер оголошує хрестик як кнопку з назвою справи", en: "The screen reader announces the cross as a button with the task's title" } }
    troubleshooting:
      - problem: { uk: "Expo Go пише, що проєкт несумісний з цією версією Expo Go", en: "Expo Go says the project is incompatible with this version of Expo Go" }
        fix: { uk: "Онови Expo Go з магазину застосунків: проєкт створено для SDK 57, і Expo Go має підтримувати саме цю версію. Якщо оновлення немає, запускай на емуляторі чи симуляторі. Не перевірено під час підготовки уроку.", en: "Update Expo Go from the app store: the project was created for SDK 57, and Expo Go must support exactly that version. If there is no update, run on an emulator or a simulator. Not checked while preparing this lesson." }
      - problem: { uk: "Unable to resolve module react-native-safe-area-context", en: "Unable to resolve module react-native-safe-area-context" }
        fix: { uk: "Імовірно, крок 2 виконано не в теці проєкту. Перейди в `rn02-lab`, повтори `npx expo install react-native-safe-area-context` і перезапусти dev-сервер командою `npx expo start --clear`. Не перевірено під час підготовки уроку.", en: "Step 2 was probably run outside the project folder. Go into `rn02-lab`, repeat `npx expo install react-native-safe-area-context` and restart the dev server with `npx expo start --clear`. Not checked while preparing this lesson." }
      - problem: { uk: "Телефон не підключається до dev-сервера", en: "The phone does not connect to the dev server" }
        fix: { uk: "Телефон і компʼютер мають бути в одній мережі Wi‑Fi, а фаєрвол не повинен блокувати порт dev-сервера. Інакше працюй з емулятором чи симулятором. Не перевірено під час підготовки уроку.", en: "The phone and the computer must be on the same Wi‑Fi network, and a firewall must not block the dev server's port. Otherwise work with an emulator or a simulator. Not checked while preparing this lesson." }
      - problem: { uk: "Зі скрінрідером не вдається керувати телефоном", en: "With the screen reader on, you cannot control the phone" }
        fix: { uk: "Зі скрінрідером дотик лише вибирає елемент, а подвійний дотик його натискає. Вимкни скрінрідер у тих самих налаштуваннях доступності: вибери перемикач і двічі торкнись його.", en: "With a screen reader on, a touch only selects an element, and a double tap activates it. Turn the screen reader off in the same accessibility settings: select the switch and double-tap it." }
    recovery:
      uk: "Навчальний проєкт `rn02-lab` окремий від твого проєкту, тож нічого в `native/` не змінюється. Якщо `App.tsx` зламався, знову встав код «Крок 3» і повтори виправлення. Якщо зламалися залежності, видали лише теку `rn02-lab` і почни з кроку 1."
      en: "The lab project `rn02-lab` is separate from your project, so nothing in `native/` changes. If `App.tsx` breaks, paste the “Step 3” code again and repeat the repairs. If the dependencies break, delete only the `rn02-lab` folder and start again from step 1."
