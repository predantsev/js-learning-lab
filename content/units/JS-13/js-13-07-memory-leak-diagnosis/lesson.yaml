  - id: live-tracker
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: live-tracker
    entry: index.js
    strings:
      reminder: { uk: "Час пити воду", en: "Time to drink water" }
    title:
      uk: "Лічильник живих listeners для перевірок"
      en: "A live-listener counter for checks"
    instructions:
      uk: |
        Щоб перевірка могла сказати «після N циклів не лишилося жодного listener», потрібна інструментація. Допиши `createListenerTracker()`:

        - `tracker.listen(target, type, handler)` **справді** додає listener і повертає `remove()`;
        - `remove()` справді знімає його; повторний виклик того самого `remove()` нічого не змінює;
        - `tracker.countLive()` — скільки listeners, доданих через цей tracker, досі увімкнено;
        - той самий `handler` для тієї самої цілі й того самого типу браузер тримає **один раз** — і лічильник рахує його один раз;
        - кожен tracker рахує лише свої listeners.

        Перевірки проганяють 20 чистих циклів і 20 циклів, що забувають один listener, і очікують 0 та 20. Унизу файла готовий код: у консолі має з’явитися `0` і `2`.
      en: |
        For a check to say “after N cycles not a single listener is left”, you need instrumentation. Complete `createListenerTracker()`:

        - `tracker.listen(target, type, handler)` **really** adds the listener and returns `remove()`;
        - `remove()` really removes it; calling the same `remove()` again changes nothing;
        - `tracker.countLive()` is how many listeners added through this tracker are still on;
        - the browser holds the same `handler` for the same target and the same type **once** — and the counter counts it once;
        - each tracker counts only its own listeners.

        The checks run 20 clean cycles and 20 cycles that forget one listener, and expect 0 and 20. At the bottom of the file there is ready code: the console must show `0` and `2`.
    testTitles:
      "the program prints 0 and 2":
        uk: "Програма друкує 0 і 2"
        en: "The program prints 0 and 2"
      "listen really adds the listener":
        uk: "`listen` справді додає listener"
        en: "`listen` really adds the listener"
      "remove really removes the listener":
        uk: "`remove` справді знімає listener"
        en: "`remove` really removes the listener"
      "countLive follows adds and removes":
        uk: "`countLive` стежить за додаванням і зняттям"
        en: "`countLive` follows adds and removes"
      "calling remove twice counts once":
        uk: "Повторний `remove` рахується один раз"
        en: "Calling `remove` twice counts once"
      "the same handler for the same target and type counts once":
        uk: "Той самий handler для тієї самої цілі й типу рахується один раз"
        en: "The same handler for the same target and type counts once"
      "two trackers count separately":
        uk: "Два trackers рахують окремо"
        en: "Two trackers count separately"
      "the tracker shows 0 after 20 clean cycles and 20 after 20 leaky ones":
        uk: "Після 20 чистих циклів — 0, після 20 з витоком — 20"
        en: "The tracker shows 0 after 20 clean cycles and 20 after 20 leaky ones"
    hints:
      nudge:
        uk: "Що треба запам’ятати про кожен увімкнений listener, щоб потім знайти його й не порахувати двічі? Де це сховати, щоб у кожного tracker було своє?"
        en: "What do you need to remember about each listener that is on, to find it later and not count it twice? Where do you keep that so that each tracker has its own?"
      explanation:
        uk: |
          Простий лічильник `count++`/`count--` ламається на двох речах: повторному `remove()` і повторному додаванні тієї самої функції. Надійніше тримати **список увімкнених** записів `{ target, type, handler }` у замиканні `createListenerTracker` — тоді `countLive()` — це його довжина, а перед додаванням можна перевірити, чи такий запис уже є. Для повторного `remove()` підійде прапорець у його власному замиканні — як в ідемпотентному `teardown`:

          ```js
          function once(action) {
            let used = false;
            return () => {
              if (used) {
                return;
              }
              used = true;
              action();
            };
          }
          ```
        en: |
          A plain counter `count++`/`count--` breaks on two things: a repeated `remove()` and adding the same function again. It is more reliable to keep a **list of live** entries `{ target, type, handler }` in the closure of `createListenerTracker` — then `countLive()` is its length, and before adding you can check whether such an entry already exists. For a repeated `remove()` a flag in its own closure does the job — as in an idempotent `teardown`:

          ```js
          function once(action) {
            let used = false;
            return () => {
              if (used) {
                return;
              }
              used = true;
              action();
            };
          }
          ```
    solutionNote:
      uk: "Tracker тримає власний список записів `{ target, type, handler }`. `listen` додає listener і запис лише тоді, коли такого запису ще немає, — так само, як браузер ігнорує повторне додавання. `remove` має свій прапорець і прибирає запис зі списку, тож `countLive()` — завжди довжина списку. Варіант із `Map` → `Map` → `Set` робить те саме: `Set` сам ігнорує повтори."
      en: "The tracker keeps its own list of entries `{ target, type, handler }`. `listen` adds the listener and the entry only when no such entry exists yet — just as the browser ignores a repeated add. `remove` has its own flag and takes the entry out of the list, so `countLive()` is always the length of the list. The `Map` → `Map` → `Set` version does the same: the `Set` ignores repeats by itself."
    feedback:
      - when: { test: "the program prints 0 and 2" }
        message:
          uk: "Ця перевірка очікує два рядки: `0` після 10 чистих циклів і `2` після одного відкритого й не закритого діалогу."
          en: "This check expects two lines: `0` after 10 clean cycles and `2` after one dialog that was opened and not closed."
      - when: { test: "listen really adds the listener" }
        message:
          uk: "Ця перевірка додає handler через `listen` і надсилає подію: handler має спрацювати рівно раз. Лічильник без справжнього `addEventListener` цю перевірку не пройде."
          en: "This check adds a handler through `listen` and sends an event: the handler must run exactly once. A counter without a real `addEventListener` does not pass this check."
      - when: { test: "remove really removes the listener" }
        message:
          uk: "Ця перевірка викликає `remove()` і надсилає подію: handler не має спрацювати."
          en: "This check calls `remove()` and sends an event: the handler must not run."
      - when: { test: "countLive follows adds and removes" }
        message:
          uk: "Ця перевірка очікує `countLive()`: 0 у нового tracker, 2 після двох `listen` і 1 після одного `remove()`."
          en: "This check expects `countLive()` to be 0 for a new tracker, 2 after two `listen` calls and 1 after one `remove()`."
      - when: { test: "calling remove twice counts once" }
        message:
          uk: "Ця перевірка двічі викликає той самий `remove()` і очікує, що з двох listeners лишився 1, а не 0."
          en: "This check calls the same `remove()` twice and expects 1 of the two listeners to remain, not 0."
      - when: { test: "the same handler for the same target and type counts once" }
        message:
          uk: "Ця перевірка двічі додає ту саму функцію для тієї самої цілі й типу й очікує `countLive()` — 1, один виклик handler на подію, а після обох `remove()` — 0."
          en: "This check adds the same function twice for the same target and type and expects `countLive()` to be 1, one handler call per event, and 0 after both `remove()` calls."
      - when: { test: "two trackers count separately" }
        message:
          uk: "Ця перевірка додає listener через один tracker і очікує 0 в іншого. Облік має жити всередині кожного `createListenerTracker()`, а не в змінній модуля."
          en: "This check adds a listener through one tracker and expects 0 for the other. The record must live inside each `createListenerTracker()`, not in a module variable."
      - when: { test: "the tracker shows 0 after 20 clean cycles and 20 after 20 leaky ones" }
        message:
          uk: "Ця перевірка проганяє 20 циклів, що знімають обидва listeners (очікує 0), і 20 циклів, що забувають `keydown` (очікує 20)."
          en: "This check runs 20 cycles that remove both listeners (expects 0) and 20 cycles that forget `keydown` (expects 20)."

  - id: to-project
    kind: transfer
    capstoneStep: JS-13
    body:
      uk: "На кроці проєкту ти загорнеш listeners списку саме в такий tracker і напишеш перевірку: 20 разів змонтувати й прибрати список — `countLive()` має повернутися до 0. А знімки пам’яті з цього уроку можна повторити вже на сторінці свого проєкту."
      en: "In the project step you will wrap the list's listeners in exactly this kind of tracker and write a check: mount and tear down the list 20 times — `countLive()` must return to 0. And the heap snapshots of this lesson can be repeated on your project's own page."
