  - id: views
    kind: example
    runtime: browser-js
    dir: views
    entry: index.js
    strings:
      bytes: { uk: "bytes:", en: "bytes:" }
      same: { uk: "друге вікно:", en: "second window:" }
      copy: { uk: "копія після зміни:", en: "copy after the change:" }
      original: { uk: "оригінал після зміни копії:", en: "original after changing the copy:" }
      dataview: { uk: "DataView записав байти:", en: "DataView wrote the bytes:" }
    title:
      uk: "Вікна, копія і DataView"
      en: "Windows, a copy and a DataView"
    body:
      uk: |
        Буфер на 4 байти й два вікна `Uint8Array` на нього. Натисни **Запустити**: обидва вікна показують `[44, 255, 0, 0]`, бо байти спільні.

        `slice()` робить **копію** на новому буфері: зміна копії оригінал не чіпає. А [[data-view|DataView]] читає й пише кілька байтів одним числом і дає вибрати порядок байтів: `setUint16(2, 258)` за замовчуванням ставить старший байт першим, тому в байтах 2 і 3 бачиш `1 2`.
      en: |
        A buffer of 4 bytes and two `Uint8Array` windows onto it. Press **Run**: both windows show `[44, 255, 0, 0]`, because the bytes are shared.

        `slice()` makes a **copy** on a new buffer: changing the copy does not touch the original. A [[data-view|DataView]] reads and writes several bytes as one number and lets you choose the byte order: by default `setUint16(2, 258)` puts the higher byte first, so bytes 2 and 3 show `1 2`.
    tryIt:
      uk: |
        1. У рядку `const bytes = new Uint8Array(buffer);` заміни `Uint8Array` на `Uint8ClampedArray`. Тепер 300 стає `255`, а −1 — `0`: цей тип не загортає, а «притискає» до меж. Друге вікно (`Uint8Array`) бачить ті самі байти. Поверни `Uint8Array`.
        2. Заміни `bytes.slice()` на `bytes.subarray(0)` і запусти. Тепер у рядку «оригінал після зміни копії» з’являється `99`: `subarray` — не копія, а ще одне вікно на той самий буфер. Поверни `slice()`.
        3. Допиши третій аргумент: `view.setUint16(2, 258, true)`. Тепер байти — `2 1`: `true` просить молодший байт першим, як роблять `Uint16Array` на звичайних комп’ютерах.
      en: |
        1. In the line `const bytes = new Uint8Array(buffer);` replace `Uint8Array` with `Uint8ClampedArray`. Now 300 becomes `255` and −1 becomes `0`: this type does not wrap, it clamps to the limits. The second window (a `Uint8Array`) sees the same bytes. Put `Uint8Array` back.
        2. Replace `bytes.slice()` with `bytes.subarray(0)` and run. Now `99` appears in the line “original after changing the copy”: `subarray` is not a copy but one more window onto the same buffer. Put `slice()` back.
        3. Add a third argument: `view.setUint16(2, 258, true)`. Now the bytes are `2 1`: `true` asks for the lower byte first, as `Uint16Array` does on ordinary computers.

  - id: recall
    kind: review
    title:
      uk: "Згадай: що спільне в копії"
      en: "Recall: what a copy shares"
    items:
      - id: shallow-shares
        from: js-04-08-copying-shallow-deep
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const wish = { id: "w-02", tags: ["home"] };
          const copy = { ...wish };
          copy.tags.push("gift");
          copy.id = "w-07";
          console.log(wish.tags.length, wish.id);
        verify:
          logs: ["2 w-02"]
        answer:
          type: choice
          options:
            - id: shared-nested
              code: "2 w-02"
            - id: fully-copied
              code: "1 w-02"
              why:
                uk: "Spread копіює лише верхній рівень. `copy.tags` і `wish.tags` — один і той самий масив, тож `push` через копію видно й в оригіналі."
                en: "Spread copies only the top level. `copy.tags` and `wish.tags` are the same array, so a `push` through the copy is visible in the original too."
            - id: all-shared
              code: "2 w-07"
              why:
                uk: "Властивість верхнього рівня `id` у копії своя: нове значення в `copy.id` оригінал не змінює."
                en: "The top-level property `id` is the copy's own: a new value in `copy.id` does not change the original."
          correct: [shared-nested]
        explanation:
          uk: "Поверхнева копія має власні властивості верхнього рівня, але вкладений масив спільний. З typed arrays так само: `new Uint8Array(bytes.buffer)` ділить байти, а справжню копію дає лише `slice()`."
          en: "A shallow copy has its own top-level properties, but the nested array is shared. Typed arrays are the same: `new Uint8Array(bytes.buffer)` shares the bytes, and only `slice()` gives a real copy."

  - id: to-hex
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: to-hex
    entry: index.js
    title:
      uk: "Байти як шістнадцятковий текст"
      en: "Bytes as hex text"
    instructions:
      uk: |
        Контрольні суми й ідентифікатори часто показують як **hex** — шістнадцятковий запис, де кожен байт стає двома символами `0–9` і `a–f`.

        Напиши `toHex(bytes)`: вона отримує `Uint8Array` і повертає текст.

        - Кожен байт — **рівно два** символи: 0 → `00`, 15 → `0f`, 255 → `ff`.
        - Літери малі.
        - Порожній `Uint8Array` дає порожній текст.
        - Байти, які отримала функція, не змінюються.

        Унизу файла готовий код: у консолі має з’явитися `dead0b07`.
      en: |
        Checksums and identifiers are often shown as **hex** — base 16 notation where every byte becomes two characters `0–9` and `a–f`.

        Write `toHex(bytes)`: it receives a `Uint8Array` and returns text.

        - Every byte is **exactly two** characters: 0 → `00`, 15 → `0f`, 255 → `ff`.
        - The letters are lowercase.
        - An empty `Uint8Array` gives empty text.
        - The bytes the function received are not changed.

        At the bottom of the file there is ready code: the console must show `dead0b07`.
    testTitles:
      "the program prints dead0b07":
        uk: "Програма друкує dead0b07"
        en: "The program prints dead0b07"
      "every byte becomes exactly two characters":
        uk: "Кожен байт стає рівно двома символами"
        en: "Every byte becomes exactly two characters"
      "the letters are lowercase":
        uk: "Літери малі"
        en: "The letters are lowercase"
      "no bytes give an empty string":
        uk: "Без байтів — порожній текст"
        en: "No bytes give an empty string"
      "a long Uint8Array works too":
        uk: "Довгий `Uint8Array` теж працює"
        en: "A long `Uint8Array` works too"
      "the bytes are not changed":
        uk: "Байти не змінюються"
        en: "The bytes are not changed"
    hints:
      nudge:
        uk: "Як записати число в системі з основою 16? І що зробити з числом, яке в цій системі має лише одну цифру?"
        en: "How do you write a number in base 16? And what do you do with a number that has only one digit in that base?"
      explanation:
        uk: |
          `number.toString(16)` дає шістнадцятковий запис малими літерами, але без нулів попереду: `(10).toString(16)` — `"a"`. Доповнити текст спереду до потрібної довжини допомагає `padStart`:

          ```js
          String(7).padStart(3, "0");   // "007"
          ```

          І ще пастка: `map` у typed array повертає **typed array того самого типу**, тож текст, який повертає колбек, перетвориться назад на числа. Збери текстові шматки в звичайний масив (наприклад, через `Array.from`) або в змінну в циклі.
        en: |
          `number.toString(16)` gives base 16 notation in lowercase, but without leading zeros: `(10).toString(16)` is `"a"`. `padStart` fills text from the front up to a length:

          ```js
          String(7).padStart(3, "0");   // "007"
          ```

          And one trap: `map` on a typed array returns **a typed array of the same type**, so the text your callback returns turns back into numbers. Collect the text pieces into an ordinary array (for example with `Array.from`) or into a variable in a loop.
    solutionNote:
      uk: "`Array.from(bytes, …)` будує звичайний масив, тож у ньому можуть лежати рядки по два символи; `padStart(2, \"0\")` додає нуль байтам менше 16. Варіант із циклом робить те саме вручну. А `bytes.map(…)` повернув би `Uint8Array` і перетворив би текст назад на числа. У найновіших рушіях є й вбудований `bytes.toHex()` (Chrome 154 і Node.js 25 його мають, Node.js 22 — ні), тож перш ніж на нього покладатися, перевір підтримку в усіх середовищах проєкту."
      en: "`Array.from(bytes, …)` builds an ordinary array, so it can hold two-character strings; `padStart(2, \"0\")` adds a zero to bytes below 16. The loop version does the same by hand. `bytes.map(…)` would return a `Uint8Array` and turn the text back into numbers. The newest engines also have a built-in `bytes.toHex()` (Chrome 154 and Node.js 25 have it, Node.js 22 does not), so check support in every runtime of the project before relying on it."
    feedback:
      - when: { test: "the program prints dead0b07" }
        message:
          uk: "Ця перевірка очікує в консолі один рядок `dead0b07` — hex байтів `[222, 173, 11, 7]`. Якщо бачиш самі цифри без літер (наприклад, `0007`), глянь на пастку з `map` у підказці."
          en: "This check expects one console line `dead0b07` — the hex of the bytes `[222, 173, 11, 7]`. If you see digits only, without letters (for example `0007`), look at the `map` trap in the hint."
      - when: { test: "every byte becomes exactly two characters" }
        message:
          uk: "Ця перевірка очікує `000fff` для `[0, 15, 255]` і `010210` для `[1, 2, 16]`: байти менше 16 мають нуль попереду."
          en: "This check expects `000fff` for `[0, 15, 255]` and `010210` for `[1, 2, 16]`: bytes below 16 get a leading zero."
      - when: { test: "the letters are lowercase" }
        message:
          uk: "Ця перевірка очікує `abcdef` для `[171, 205, 239]` — малими літерами, як їх дає `toString(16)`."
          en: "This check expects `abcdef` for `[171, 205, 239]` — in lowercase, as `toString(16)` gives them."
      - when: { test: "no bytes give an empty string" }
        message:
          uk: "Ця перевірка очікує порожній текст `\"\"` для `new Uint8Array(0)`."
          en: "This check expects empty text `\"\"` for `new Uint8Array(0)`."
      - when: { test: "a long Uint8Array works too" }
        message:
          uk: "Ця перевірка дає 300 байтів зі значенням 160 і очікує `a0`, повторене 300 разів."
          en: "This check gives 300 bytes with the value 160 and expects `a0` repeated 300 times."
      - when: { test: "the bytes are not changed" }
        message:
          uk: "Ця перевірка очікує, що після виклику `toHex` байти `[5, 250]` лишаються такими самими."
          en: "This check expects the bytes `[5, 250]` to stay the same after calling `toHex`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-13
    body:
      uk: "У проєкті ти працюєш здебільшого з текстом і числами, а не з байтами. Але коли завантажуватимеш чи вивантажуватимеш файл або рахуватимеш контрольну суму, як у файлі експорту з JS-10, то працюватимеш саме з `Uint8Array`, а показуватимеш результат як hex."
      en: "In the project you mostly work with text and numbers, not bytes. But when you upload or download a file, or compute a checksum like the one in the JS-10 export file, you will work with a `Uint8Array` and show the result as hex."
