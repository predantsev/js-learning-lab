id: js-13-01-iterable-protocol
unit: JS-13
title:
  uk: "Протокол ітерації"
  en: "The iterable protocol"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Пояснити, що `for...of`, spread і `Array.from` просять в об’єкта: метод `[Symbol.iterator]()`, який повертає ітератор, а його `next()` дає `{ value, done }`."
    en: "Explain what `for...of`, spread and `Array.from` ask an object for: a `[Symbol.iterator]()` method returning an iterator whose `next()` gives `{ value, done }`."
  - uk: "Зробити невеликий клас-колекцію iterable і покроково пройти його ітератор вручну."
    en: "Make a small collection class iterable and step its iterator by hand."
prerequisites: [js-04-06-for-of-vs-for-in, js-11-05-classes-private-static]
subskills:
  - { family: J-12, skill: "iterable/iterator protocol", depth: intro }
glossary: [iterable-protocol, iterator-result, symbol-iterator]
selfCheck: [predict-what-iterates, record-list]

blocks:
  - id: what-for-of-asks
    kind: explanation
    title:
      uk: "Що for...of просить в об’єкта"
      en: "What for...of asks an object for"
    body:
      uk: |
        `for...of` працює з масивами, текстом у лапках, `Map` і `Set`. Але не тому, що в них є `length` чи номери елементів. Перед першим кроком циклу JavaScript робить дві речі:

        1. Просить в об’єкта метод із ключем [[symbol-iterator|Symbol.iterator]] і викликає його. Метод повертає **ітератор** — окремий об’єкт, який пам’ятає, де він зупинився.
        2. На кожному кроці викликає `iterator.next()`. Той повертає [[iterator-result|результат]] `{ value, done }`: `value` — наступне значення, а `done: true` означає «більше нічого немає», і цикл закінчується.

        Ця домовленість називається [[iterable-protocol|протоколом ітерації]]. Об’єкт, у якого є такий метод, — **iterable**. Spread `[...x]` і деструктуризація масиву користуються тим самим протоколом.

        Звичайний об’єкт `{ name: "…" }` такого методу не має, тож `for...of` на ньому кидає `TypeError: … is not iterable`. А `Array.from` — виняток: якщо протоколу немає, він уміє взяти `length` і номери `0`, `1`, … («схожий на масив» об’єкт).
      en: |
        `for...of` works with arrays, text in quotes, `Map` and `Set`. But not because they have a `length` or numbered items. Before the first step of the loop JavaScript does two things:

        1. It asks the object for the method with the key [[symbol-iterator|Symbol.iterator]] and calls it. The method returns an **iterator** — a separate object that remembers where it stopped.
        2. On every step it calls `iterator.next()`. That returns an [[iterator-result|iterator result]] `{ value, done }`: `value` is the next value, and `done: true` means “nothing more”, and the loop ends.

        This agreement is called the [[iterable-protocol|iterable protocol]]. An object that has such a method is **iterable**. Spread `[...x]` and array destructuring use the same protocol.

        A plain object `{ name: "…" }` has no such method, so `for...of` on it throws `TypeError: … is not iterable`. `Array.from` is the exception: when there is no protocol, it can take `length` and the indexes `0`, `1`, … (an “array-like” object).

  - id: predict-what-iterates
    kind: prediction
    prompt:
      uk: "П’ять значень: текст, `Map`, об’єкт із `length` і номерами та звичайний об’єкт. Що з’явиться в консолі?"
      en: "Five values: text, a `Map`, an object with a `length` and numbered keys, and a plain object. What appears in the console?"
    code: |
      const word = "Київ";
      const prices = new Map([["w-01", 80], ["w-02", 45]]);
      const pageLike = { length: 2, 0: "w-01", 1: "w-02" };
      const wish = { id: "w-03", price: 240 };

      console.log([...word].length);
      console.log([...prices][0]);
      console.log(Array.from(pageLike));
      try {
        for (const id of pageLike) {
          console.log(id);
        }
      } catch (error) {
        console.log(error.message);
      }
      try {
        console.log([...wish]);
      } catch (error) {
        console.log(error.name);
      }
    verify:
      logs: ["4", "[\"w-01\", 80]", "[\"w-01\", \"w-02\"]", "pageLike is not iterable", "TypeError"]
    answer:
      type: choice
      options:
        - id: protocol
          code: "4\n[\"w-01\", 80]\n[\"w-01\", \"w-02\"]\npageLike is not iterable\nTypeError"
        - id: length-is-enough
          code: "4\n[\"w-01\", 80]\n[\"w-01\", \"w-02\"]\nw-01\nw-02\nTypeError"
          why:
            uk: "`length` і номери потрібні лише `Array.from`. `for...of` шукає метод `[Symbol.iterator]`, а в `pageLike` його немає — тому `TypeError`, а не два ідентифікатори."
            en: "Only `Array.from` uses `length` and indexes. `for...of` looks for a `[Symbol.iterator]` method, and `pageLike` does not have one — so a `TypeError`, not two ids."
        - id: map-values
          code: "4\n80\n[\"w-01\", \"w-02\"]\npageLike is not iterable\nTypeError"
          why:
            uk: "Ітератор `Map` віддає пари `[ключ, значення]`, тож перший елемент spread — масив `[\"w-01\", 80]`, а не саме значення."
            en: "The iterator of a `Map` gives `[key, value]` pairs, so the first item of the spread is the array `[\"w-01\", 80]`, not just the value."
        - id: object-values
          code: "4\n[\"w-01\", 80]\n[\"w-01\", \"w-02\"]\npageLike is not iterable\n[\"w-03\", 240]"
          why:
            uk: "Звичайний об’єкт не iterable: spread масиву `[...wish]` не перебирає його властивості, а кидає `TypeError`."
            en: "A plain object is not iterable: the array spread `[...wish]` does not walk its properties, it throws a `TypeError`."
      correct: [protocol]
    explanation:
      uk: "Текст iterable: spread дає 4 літери. `Map` віддає пари `[ключ, значення]`. `Array.from` уміє працювати зі «схожим на масив» об’єктом, а `for...of` — ні: він вимагає `[Symbol.iterator]`, тому кидає `TypeError` з повідомленням `pageLike is not iterable`. Звичайний об’єкт так само не iterable."
      en: "Text is iterable: the spread gives 4 letters. A `Map` gives `[key, value]` pairs. `Array.from` can work with an “array-like” object, `for...of` cannot: it requires `[Symbol.iterator]`, so it throws a `TypeError` with the message `pageLike is not iterable`. A plain object is not iterable either."

  - id: loop-unrolled
    kind: visual
    visual: code-trace
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    title:
      uk: "for...of без магії: один виклик ітератора, далі next()"
      en: "for...of without magic: one iterator call, then next()"
    textEquivalent:
      uk: "Об’єкт shelf має список wishes і метод із ключем Symbol.iterator. Цикл for (const wish of shelf) спершу один раз викликає цей метод: той створює змінну index зі значенням 0 і повертає новий об’єкт-ітератор із методом next. Далі цикл викликає next. Перший виклик бачить index 0, повертає { value: «%%headphones%%», done: false } і збільшує index до 1; цикл кладе «%%headphones%%» у wish і виконує тіло — console.log. Другий виклик next повертає «%%lamp%%», тіло виконується вдруге. Третій виклик бачить, що index дорівнює довжині списку, і повертає { value: undefined, done: true } — цикл закінчується, тіло втретє не виконується, і програма друкує end. Метод Symbol.iterator викликається лише раз, а next — тричі: двічі зі значенням і раз із done: true."
      en: "The object shelf has a list wishes and a method with the key Symbol.iterator. The loop for (const wish of shelf) first calls that method once: it creates a variable index set to 0 and returns a new iterator object with a next method. Then the loop calls next. The first call sees index 0, returns { value: \"%%headphones%%\", done: false } and increases index to 1; the loop puts \"%%headphones%%\" into wish and runs the body — console.log. The second call of next returns \"%%lamp%%\", and the body runs a second time. The third call sees that index equals the length of the list and returns { value: undefined, done: true } — the loop ends, the body does not run a third time, and the program prints end. The Symbol.iterator method is called only once, and next three times: twice with a value and once with done: true."
    spec:
      file: visuals/shelf.js
      captions:
        - at: { line: 1 }
          text:
            uk: "Програма створює об’єкт `shelf`: список `wishes` і метод `[Symbol.iterator]()`. Далі — цикл, але спершу він має отримати ітератор."
            en: "The program creates the object `shelf`: the list `wishes` and the method `[Symbol.iterator]()`. Next comes the loop, but first it must get an iterator."
        - at: { line: 3, kind: call }
          text:
            uk: "Цикл **один раз** викликає метод `[Symbol.iterator]()` об’єкта `shelf` (у стеку викликів він зветься просто `method`). `this` — сам `shelf`."
            en: "The loop calls the `[Symbol.iterator]()` method of `shelf` **once** (on the call stack it is simply called `method`). `this` is `shelf` itself."
        - at: { line: 6, kind: return }
          text:
            uk: "Метод повертає новий об’єкт-ітератор з методом `next`. Змінні `index` і `wishes` живуть у замиканні — ітератор пам’ятає, де зупинився."
            en: "The method returns a new iterator object with a `next` method. The variables `index` and `wishes` live in the closure — the iterator remembers where it stopped."
        - at: { line: 7, kind: call, hit: 1 }
          text:
            uk: "Перший крок циклу — виклик `next()`. `index` дорівнює 0."
            en: "The first step of the loop is a call of `next()`. `index` is 0."
        - at: { line: 11, kind: return, hit: 1 }
          text:
            uk: "`next()` повертає `{ value: \"%%headphones%%\", done: false }`, а `index` уже 1."
            en: "`next()` returns `{ value: \"%%headphones%%\", done: false }`, and `index` is already 1."
        - at: { line: 18, kind: iter, hit: 1 }
          text:
            uk: "`done` — `false`, тож цикл кладе `value` у `wish` і виконує тіло."
            en: "`done` is `false`, so the loop puts `value` into `wish` and runs the body."
        - at: { line: 18, kind: iter, hit: 2 }
          text:
            uk: "Другий виклик `next()` дав `\"%%lamp%%\"` — і тіло виконується вдруге."
            en: "The second call of `next()` gave `\"%%lamp%%\"` — and the body runs a second time."
        - at: { line: 7, kind: call, hit: 3 }
          text:
            uk: "Третій виклик `next()`. `index` дорівнює 2 — довжині списку."
            en: "The third call of `next()`. `index` is 2 — the length of the list."
        - at: { line: 13, kind: return }
          text:
            uk: "`next()` повертає `{ value: undefined, done: true }`: більше нічого немає."
            en: "`next()` returns `{ value: undefined, done: true }`: there is nothing more."
        - at: { line: 21, kind: stmt }
          text:
            uk: "Цикл закінчився без третього виконання тіла. `[Symbol.iterator]()` викликано один раз, `next()` — тричі."
            en: "The loop ended without running the body a third time. `[Symbol.iterator]()` was called once, `next()` three times."

  - id: by-hand
    kind: example
    runtime: browser-js
    dir: by-hand
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      again: { uk: "Другий прохід тим самим ітератором:", en: "Second pass with the same iterator:" }
    title:
      uk: "Ітератор вручну — і чому він одноразовий"
      en: "An iterator by hand — and why it is single-use"
    body:
      uk: |
        Тут ми робимо те, що зазвичай робить `for...of`: просимо в масиву справ ітератор і викликаємо `next()` самі. Натисни **Запустити**.

        Перші три результати мають `done: false`, четвертий — `done: true` і `value: undefined`. А цикл, якому дали той самий ітератор, не виконується жодного разу: ітератор уже дійшов до кінця. Повернути його на початок не можна — можна лише попросити новий.
      en: |
        Here we do what `for...of` usually does: we ask the array of tasks for an iterator and call `next()` ourselves. Press **Run**.

        The first three results have `done: false`, the fourth has `done: true` and `value: undefined`. And the loop that gets the same iterator does not run even once: the iterator has already reached the end. It cannot be rewound — you can only ask for a new one.
    tryIt:
      uk: |
        1. Скопіюй рядок із четвертим `console.log(iterator.next());` і встав копію під ним. П’ятий результат — знову `done: true`: вичерпаний ітератор так і лишається вичерпаним.
        2. У рядку `for (const task of iterator)` заміни `iterator` на `tasks` і запусти. Тепер у рядку другого проходу `3`: масив на кожен цикл видає **новий** ітератор.
      en: |
        1. Copy the line with the fourth `console.log(iterator.next());` and paste the copy below it. The fifth result is `done: true` again: an exhausted iterator stays exhausted.
        2. In the line `for (const task of iterator)` replace `iterator` with `tasks` and run. Now the second-pass line shows `3`: the array gives a **new** iterator for every loop.

  - id: recall
    kind: review
    title:
      uk: "Згадай: у якому порядку ходить Map"
      en: "Recall: in which order a Map walks"
    items:
      - id: map-order
        from: js-12-11-map-set
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const totals = new Map();
          totals.set("transport", 520);
          totals.set("food", 845);
          totals.set("transport", 700);
          console.log([...totals.keys()].join());
        verify:
          logs: ["transport,food"]
        answer:
          type: choice
          options:
            - id: insertion
              code: "transport,food"
            - id: sorted-or-moved
              code: "food,transport"
              why:
                uk: "`Map` не сортує ключі, а новий `set` для наявного ключа лише замінює значення: ключ лишається на місці, де його вперше додали."
                en: "A `Map` does not sort its keys, and a new `set` for an existing key only replaces the value: the key stays where it was first added."
            - id: twice
              code: "transport,food,transport"
              why:
                uk: "Ключ у `Map` унікальний: другий `set(\"transport\", …)` не створює другого запису."
                en: "A key in a `Map` is unique: the second `set(\"transport\", …)` does not create a second entry."
          correct: [insertion]
        explanation:
          uk: "Ітератор `Map` — `keys()`, `values()`, `entries()` чи сам `for...of` — віддає записи в порядку першого додавання. Заміна значення порядку не змінює."
          en: "The iterator of a `Map` — `keys()`, `values()`, `entries()` or `for...of` itself — gives the entries in the order they were first added. Replacing a value does not change the order."

  - id: record-list
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: record-list
    entry: index.js
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
    title:
      uk: "Список витрат, по якому ходить for...of"
      en: "A list of expenses that for...of can walk"
    instructions:
      uk: |
        Клас `RecordList` тримає записи витрат у приватному полі `#records`. Зараз програма падає з `TypeError: list is not iterable`.

        Додай у клас метод `[Symbol.iterator]()`, щоб:

        - `for...of`, spread `[...list]` і `Array.from(list)` отримували записи по одному, у порядку додавання, разом із доданими пізніше через `add`;
        - **кожен** цикл починався з початку (два spread поспіль дають однакову кількість записів);
        - ітератор відповідав за протоколом: `next()` повертає `{ value, done }`, а після останнього запису — `done: true`;
        - масив лишався приватним: у самого об’єкта не з’являється жодної власної властивості, а зміна масиву зі spread не змінює список.

        Унизу файла готовий код: у консолі мають з’явитися три назви витрат і `3`.
      en: |
        The class `RecordList` keeps expense records in the private field `#records`. Right now the program crashes with `TypeError: list is not iterable`.

        Add a method `[Symbol.iterator]()` to the class, so that:

        - `for...of`, the spread `[...list]` and `Array.from(list)` receive the records one by one, in the order they were added, including the ones added later with `add`;
        - **every** loop starts from the beginning (two spreads in a row give the same number of records);
        - the iterator follows the protocol: `next()` returns `{ value, done }`, and after the last record `done: true`;
        - the array stays private: the object gets no own properties, and changing the array from a spread does not change the list.

        At the bottom of the file there is ready code: the console must show three expense labels and `3`.
    testTitles:
      "the program prints the three labels and 3":
        uk: "Програма друкує три назви і 3"
        en: "The program prints the three labels and 3"
      "for...of gives the records in order":
        uk: "`for...of` дає записи по порядку"
        en: "`for...of` gives the records in order"
      "spread and Array.from give the records in a new array":
        uk: "Spread і `Array.from` дають записи в новому масиві"
        en: "Spread and `Array.from` give the records in a new array"
      "every loop starts from the beginning":
        uk: "Кожен цикл починається з початку"
        en: "Every loop starts from the beginning"
      "next() gives { value, done } and finishes with done: true":
        uk: "`next()` дає `{ value, done }` і закінчує `done: true`"
        en: "`next()` gives `{ value, done }` and finishes with `done: true`"
      "records added later are included":
        uk: "Записи, додані пізніше, теж потрапляють у перебір"
        en: "Records added later are included"
      "the records stay private":
        uk: "Записи лишаються приватними"
        en: "The records stay private"
    hints:
      nudge:
        uk: "Яку назву має метод, який шукає `for...of`? Її записують у квадратних дужках, бо це не текст, а symbol. Що цей метод має повернути — масив чи щось інше?"
        en: "What is the name of the method `for...of` looks for? It is written in square brackets, because it is a symbol, not text. What must that method return — an array or something else?"
      explanation:
        uk: |
          Метод має повертати **новий** ітератор при кожному виклику — об’єкт із методом `next()`. Ось той самий прийом для іншої задачі, зворотного відліку:

          ```js
          class Countdown {
            constructor(from) { this.from = from; }
            [Symbol.iterator]() {
              let current = this.from;          // fresh state for every loop
              return {
                next() {
                  if (current > 0) {
                    current = current - 1;
                    return { value: current + 1, done: false };
                  }
                  return { value: undefined, done: true };
                },
              };
            }
          }
          ```

          Ітератор не обов’язково писати самому: масив теж iterable, і в нього можна попросити свіжий ітератор тим самим способом, яким це робить `for...of`. Лише не створюй ітератор один раз у конструкторі — тоді другий цикл отримає вже вичерпаний.
        en: |
          The method must return a **new** iterator on every call — an object with a `next()` method. Here is the same technique for another task, a countdown:

          ```js
          class Countdown {
            constructor(from) { this.from = from; }
            [Symbol.iterator]() {
              let current = this.from;          // fresh state for every loop
              return {
                next() {
                  if (current > 0) {
                    current = current - 1;
                    return { value: current + 1, done: false };
                  }
                  return { value: undefined, done: true };
                },
              };
            }
          }
          ```

          You do not have to write the iterator yourself: an array is iterable too, and you can ask it for a fresh iterator the same way `for...of` does. Just do not create the iterator once in the constructor — then the second loop gets an exhausted one.
    solutionNote:
      uk: "`[Symbol.iterator]()` створює нове замикання з `index = 0` на кожен виклик, тож кожен цикл починає з першого запису. Ітератор читає приватний масив, але назовні віддає лише записи, а не сам масив. Коротший варіант — повернути свіжий ітератор масиву: `this.#records[Symbol.iterator]()`."
      en: "`[Symbol.iterator]()` creates a new closure with `index = 0` on every call, so every loop starts at the first record. The iterator reads the private array but hands out only the records, never the array itself. A shorter version returns a fresh iterator of the array: `this.#records[Symbol.iterator]()`."
    feedback:
      - when: { test: "the program prints the three labels and 3" }
        message:
          uk: "Ця перевірка очікує в консолі чотири рядки: три назви витрат (зі `for...of`) і `3` (довжина `[...list]`). Якщо замість `3` бачиш `0`, другий цикл отримав уже вичерпаний ітератор."
          en: "This check expects four console lines: three expense labels (from `for...of`) and `3` (the length of `[...list]`). If you see `0` instead of `3`, the second loop received an exhausted iterator."
      - when: { test: "for...of gives the records in order" }
        message:
          uk: "Ця перевірка створює список із трьох записів і очікує, що `for...of` віддасть саме ці три об’єкти в тому самому порядку."
          en: "This check creates a list of three records and expects `for...of` to give exactly those three objects in the same order."
      - when: { test: "spread and Array.from give the records in a new array" }
        message:
          uk: "Ця перевірка очікує ті самі три записи з `[...list]` і з `Array.from(list)`, а після `pop()` у масиві зі spread — що в списку їх і далі три."
          en: "This check expects the same three records from `[...list]` and from `Array.from(list)`, and after a `pop()` on the spread array it expects the list to still have three."
      - when: { test: "every loop starts from the beginning" }
        message:
          uk: "Ця перевірка робить два spread поспіль і очікує по 3 записи, а другий ітератор зі списку має почати з першого запису, хоч перший уже зробив два кроки. Метод `[Symbol.iterator]()` має щоразу створювати новий ітератор."
          en: "This check makes two spreads in a row and expects 3 records each, and a second iterator from the list must start at the first record even though the first one has already taken two steps. `[Symbol.iterator]()` must create a new iterator every time."
      - when: { test: "next() gives { value, done } and finishes with done: true" }
        message:
          uk: "Ця перевірка викликає `list[Symbol.iterator]()` і очікує об’єкт із методом `next`: три виклики дають записи з `done: false`, четвертий і п’ятий — `done: true`."
          en: "This check calls `list[Symbol.iterator]()` and expects an object with a `next` method: three calls give the records with `done: false`, the fourth and fifth give `done: true`."
      - when: { test: "records added later are included" }
        message:
          uk: "Ця перевірка додає запис через `add` і очікує його в `[...list]` після першого. Ітератор має читати поточний масив, а не копію, зроблену в конструкторі до `add`."
          en: "This check adds a record with `add` and expects it in `[...list]` after the first one. The iterator must read the current array, not a copy made in the constructor before `add`."
      - when: { test: "the records stay private" }
        message:
          uk: "Ця перевірка очікує, що в об’єкта списку немає жодної власної властивості. Масив має лишатися в приватному полі `#records`."
          en: "This check expects the list object to have no own properties at all. The array must stay in the private field `#records`."
      - when: { error: TypeError }
        message:
          uk: "Якщо повідомлення `list is not iterable`, у класу ще немає методу `[Symbol.iterator]()`. Якщо `undefined is not a function`, метод є, але повертає не ітератор (наприклад, масив): `for...of` шукає в результаті метод `next`. Якщо `… is not a function` про `RecordList`, програма впала ще під час завантаження — спершу виправ ту помилку."
          en: "If the message is `list is not iterable`, the class has no `[Symbol.iterator]()` method yet. If it is `undefined is not a function`, the method exists but returns something that is not an iterator (for example an array): `for...of` looks for a `next` method in the result. If it is `… is not a function` about `RecordList`, the program crashed while loading — fix that error first."

  - id: to-project
    kind: transfer
    capstoneStep: JS-13
    body:
      uk: "У проєкті твої записи лежать у масиві, і `for...of` по ньому вже працює. На кроці цього розділу ти даси списку посторінковий перебір: «Показати ще» проситиме в ітератора наступну сторінку, а не будуватиме всі сторінки наперед."
      en: "In the project your records live in an array, and `for...of` over it already works. In this unit's step you will give the list paged traversal: “Show more” will ask an iterator for the next page instead of building every page in advance."
