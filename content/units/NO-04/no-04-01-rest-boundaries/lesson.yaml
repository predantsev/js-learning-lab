id: no-04-01-rest-boundaries
unit: NO-04
title:
  uk: "Межі REST і ресурси"
  en: "REST boundaries and resources"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Зіставити список, читання, створення, заміну, часткову зміну й видалення записів з адресами ресурсів і методами та передбачити статус успіху кожної операції."
    en: "Map list, read, create, replace, partial update and delete of records to resource URLs and methods, and predict the success status of each."
  - uk: "Вирішити, що для операції належить до шляху, що до query string, а що до тіла запиту, і пояснити вибір."
    en: "Decide what belongs in the path, the query string and the body for a given operation, and justify the choice."
prerequisites: [no-03-08-capstone-first-endpoint, no-03-02-methods-status-headers-server]
subskills:
  - { family: B-03, skill: "REST boundaries", depth: intro }
glossary: [rest-resource, partial-update]
selfCheck: [predict-put-patch, notes-routes]

blocks:
  - id: nouns-and-verbs
    kind: explanation
    title:
      uk: "Адреса — іменник, метод — дієслово"
      en: "The address is a noun, the method is a verb"
    body:
      uk: |
        Сервер, який уміє лише `GET /records`, віддає список записів. Але клієнтові треба ще створювати, змінювати й видаляти записи. Можна вигадати адреси-дії: `/createRecord`, `/deleteRecord?id=w-05`. Але в HTTP дія вже має своє місце — [[http-method|метод]].

        Стиль **REST** будує API навколо [[rest-resource|ресурсів]]: адреса називає **що** (усі записи або один запис), а метод каже, **що з ним зробити**:

        | Операція | Метод і адреса | Успіх |
        |---|---|---|
        | список | `GET /records` | 200 і масив |
        | один запис | `GET /records/w-02` | 200 і запис |
        | створити | `POST /records` | **201** Created і новий запис |
        | замінити повністю | `PUT /records/w-02` | 200 і запис |
        | змінити частину | `PATCH /records/w-02` | 200 і запис |
        | видалити | `DELETE /records/w-02` | **204** No Content, без тіла |

        Дві адреси на шість операцій. Якщо запису немає (наприклад, `/records/w-09`), кожна операція з одним записом відповідає статусом 404.
      en: |
        A server that only knows `GET /records` hands out the list of records. But the client also needs to create, change and delete records. You could invent action addresses: `/createRecord`, `/deleteRecord?id=w-05`. But HTTP already has a place for the action — the [[http-method|method]].

        The **REST** style builds an API around [[rest-resource|resources]]: the address names **what** (all records or one record), and the method says **what to do** with it:

        | Operation | Method and address | Success |
        |---|---|---|
        | list | `GET /records` | 200 and an array |
        | one record | `GET /records/w-02` | 200 and the record |
        | create | `POST /records` | **201** Created and the new record |
        | replace entirely | `PUT /records/w-02` | 200 and the record |
        | change a part | `PATCH /records/w-02` | 200 and the record |
        | delete | `DELETE /records/w-02` | **204** No Content, no body |

        Two addresses for six operations. When the record does not exist (for example `/records/w-09`), every one-record operation answers with status 404.

  - id: resource-map
    kind: visual
    visual: diagram
    title:
      uk: "Карта ресурсу records"
      en: "The map of the records resource"
    textEquivalent:
      uk: "Дві колонки — два ресурси. Ліва — колекція /records: GET читає список і відповідає 200, нічого не змінюючи (безпечний метод); POST створює новий запис і відповідає 201. Права — один запис /records/w-02: GET читає його (200, безпечний), PUT замінює запис цілком тим, що прийшло в тілі (200), PATCH змінює лише надіслані поля (200), DELETE видаляє запис і відповідає 204 без тіла. Кроки по черзі надсилають по одному запиту й підсвічують операцію, яка його обробляє."
      en: "Two columns — two resources. The left one is the /records collection: GET reads the list and answers 200 without changing anything (a safe method); POST creates a new record and answers 201. The right one is a single record /records/w-02: GET reads it (200, safe), PUT replaces the whole record with what came in the body (200), PATCH changes only the fields sent (200), DELETE removes the record and answers 204 with no body. The steps send one request at a time and highlight the operation that handles it."
    spec:
      layout: grid
      nodes:
        - { id: collection, label: "/records", shape: pill, w: 160, col: 0, row: 0 }
        - { id: one, label: "/records/w-02", shape: pill, w: 160, col: 1, row: 0 }
        - { id: list, label: "GET → 200", w: 160, col: 0, row: 1 }
        - { id: create, label: "POST → 201", w: 160, col: 0, row: 2 }
        - { id: read, label: "GET → 200", w: 160, col: 1, row: 1 }
        - { id: replace, label: "PUT → 200", w: 160, col: 1, row: 2 }
        - { id: patch, label: "PATCH → 200", w: 160, col: 1, row: 3 }
        - { id: remove, label: "DELETE → 204", w: 160, col: 1, row: 4 }
      edges:
        - { id: c-list, from: collection, to: list, kind: line }
        - { id: list-create, from: list, to: create, kind: line }
        - { id: o-read, from: one, to: read, kind: line }
        - { id: read-replace, from: read, to: replace, kind: line }
        - { id: replace-patch, from: replace, to: patch, kind: line }
        - { id: patch-remove, from: patch, to: remove, kind: line }
      steps:
        - caption:
            uk: "Два ресурси: колекція `/records` і один запис `/records/w-02`. Під кожним — методи, які він приймає, і статус успіху."
            en: "Two resources: the `/records` collection and one record `/records/w-02`. Under each are the methods it accepts and the success status."
          highlight: [collection, one]
        - caption:
            uk: "`GET /records` читає список. Метод **безпечний**: на сервері нічого не змінюється, тож запит можна повторити будь-коли."
            en: "`GET /records` reads the list. The method is **safe**: nothing changes on the server, so the request can be repeated at any time."
          highlight: [collection, list, c-list]
          annotate:
            - { id: list, text: { uk: "безпечний", en: "safe" } }
        - caption:
            uk: "`POST /records` з новим записом у тілі створює запис, а сервер обирає йому `id` і відповідає **201**."
            en: "`POST /records` with a new record in the body creates the record; the server picks its `id` and answers **201**."
          highlight: [collection, create]
          annotate:
            - { id: create, text: { uk: "+1 запис", en: "+1 record" } }
        - caption:
            uk: "`GET /records/w-02` читає один запис. Його `id` — частина шляху, бо шлях називає ресурс."
            en: "`GET /records/w-02` reads one record. Its `id` is part of the path, because the path names the resource."
          highlight: [one, read, o-read]
          annotate:
            - { id: read, text: { uk: "безпечний", en: "safe" } }
        - caption:
            uk: "`PUT` замінює запис **цілком** тим, що прийшло в тілі: поле, якого клієнт не надіслав, зникає."
            en: "`PUT` replaces the record **entirely** with what came in the body: a field the client did not send is gone."
          highlight: [one, replace]
          annotate:
            - { id: replace, text: { uk: "увесь запис", en: "whole record" } }
        - caption:
            uk: "`PATCH` змінює **лише** надіслані поля; решта лишається як була."
            en: "`PATCH` changes **only** the fields sent; the rest stays as it was."
          highlight: [one, patch]
          annotate:
            - { id: patch, text: { uk: "частина", en: "a part" } }
        - caption:
            uk: "`DELETE` видаляє запис і відповідає **204**: успіх, а надсилати нічого. Наступний `GET /records/w-02` отримає 404."
            en: "`DELETE` removes the record and answers **204**: success with nothing to send. The next `GET /records/w-02` gets 404."
          highlight: [one, remove]
          annotate:
            - { id: remove, text: { uk: "−1 запис", en: "−1 record" } }

  - id: predict-delete-url
    kind: prediction
    prompt:
      uk: "API бажань побудовано в стилі REST. Який запит видаляє бажання `w-05`?"
      en: "The wishlist API is built in the REST style. Which request deletes the wish `w-05`?"
    answer:
      type: choice
      options:
        - id: delete-path
          code: "DELETE /records/w-05"
        - id: verb-url
          code: "POST /deleteRecord?id=w-05"
          why:
            uk: "Так теж можна змусити сервер працювати, але це адреса-дія: дієслово сховано в адресі, а метод `POST` нічого не каже. Клієнт, кеш чи інший розробник не зрозуміють із запиту, що він видаляє, і для кожної дії потрібна нова адреса."
            en: "You can make a server work like that, but it is an action address: the verb hides in the address, and the method `POST` says nothing. A client, a cache or another developer cannot tell from the request that it deletes, and every action needs a new address."
        - id: get-flag
          code: "GET /records/w-05?delete=true"
          why:
            uk: "`GET` має лише читати. Програми вільно повторюють і заздалегідь виконують `GET`-запити (браузер, кеш, перевірка посилань), тож такий запит видалить запис, коли ніхто цього не просив."
            en: "`GET` must only read. Programs freely repeat and pre-fetch `GET` requests (a browser, a cache, a link checker), so such a request would delete the record when nobody asked."
        - id: collection-query
          code: "DELETE /records?id=w-05"
          why:
            uk: "Ця адреса називає всю колекцію, а query string зазвичай звужує список, який читають. Один запис — окремий ресурс зі своєю адресою `/records/w-05`."
            en: "This address names the whole collection, and a query string usually narrows the list being read. One record is a resource of its own with its own address `/records/w-05`."
      correct: [delete-path]
    explanation:
      uk: "Адреса `/records/w-05` називає ресурс — один запис, а метод `DELETE` каже, що з ним зробити. Ні дієслова в адресі, ні прапорця в query string не потрібно."
      en: "The address `/records/w-05` names the resource — one record — and the method `DELETE` says what to do with it. No verb in the address and no flag in the query string are needed."

  - id: predict-put-patch
    kind: prediction
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      home: { uk: "Дім", en: "Home" }
    prompt:
      uk: "Сервер зберігає запис `w-02`, виконує методи за їхнім змістом у REST і поки не перевіряє тіла запитів. Клієнт надсилає `PUT /records/w-02` з тілом `{ \"price\": 50 }`. Що буде збережено?"
      en: "The server stores the record `w-02`, carries out the methods by their REST meaning and does not check request bodies yet. The client sends `PUT /records/w-02` with the body `{ \"price\": 50 }`. What is stored?"
    code: |
      { "id": "w-02", "name": "%%lamp%%", "price": 45, "acquired": false, "category": "%%home%%" }
    lang: json
    runnable: false
    answer:
      type: choice
      options:
        - id: replaced
          code: '{ "id": "w-02", "price": 50 }'
        - id: merged
          code: '{ "id": "w-02", "name": "%%lamp%%", "price": 50, "acquired": false, "category": "%%home%%" }'
          why:
            uk: "Так спрацював би `PATCH` — часткова зміна. `PUT` і `PATCH` різні: `PUT` надсилає **увесь** новий запис і замінює ним старий."
            en: "That is what `PATCH` — a partial update — would do. `PUT` and `PATCH` differ: `PUT` sends the **whole** new record and replaces the old one with it."
        - id: unchanged
          code: '{ "id": "w-02", "name": "%%lamp%%", "price": 45, "acquired": false, "category": "%%home%%" }'
          why:
            uk: "Сервер, який виконує методи за їхнім змістом, не ігнорує `PUT`. Відмовити (статусом 400) він може лише тоді, коли перевіряє тіло, — про це наступний урок."
            en: "A server that carries out the methods by their meaning does not ignore `PUT`. It can refuse (with status 400) only when it checks the body — that is the next lesson."
      correct: [replaced]
    explanation:
      uk: "`PUT` означає «ось увесь новий запис»: що клієнт не надіслав, того в записі більше немає. Щоб змінити одне поле, є `PATCH` — [[partial-update|часткова зміна]]. Справжній API ще й відхилив би такий неповний `PUT` статусом 400, бо без `name` запис неповний; перевірку тіла ти додаси в наступному уроці."
      en: "`PUT` means “here is the whole new record”: whatever the client did not send is no longer in the record. To change one field there is `PATCH` — a [[partial-update]]. A real API would also refuse such an incomplete `PUT` with status 400, because without `name` the record is incomplete; you add body checks in the next lesson."

  - id: path-query-body
    kind: explanation
    title:
      uk: "Шлях, query string чи тіло?"
      en: "Path, query string or body?"
    body:
      uk: |
        У запиті три місця для даних, і кожне має свою роль:

        - **Шлях** називає ресурс: `/records/w-02`. Без цієї частини запит уже про щось інше.
        - **Query string** уточнює, *яку частину* колекції прочитати: `GET /records?acquired=false&sort=price`. Фільтри, сортування й сторінки — у четвертому уроці цього розділу.
        - **Тіло** несе дані, які записують: новий запис для `POST`, увесь запис для `PUT`, змінені поля для `PATCH`. У `GET` і `DELETE` тіла зазвичай немає: HTTP не визначає, що воно в цих методах означало б.

        Ще одна межа — між читанням і змінами. `GET` [[safe-method|безпечний]]: його можна повторити, кешувати, виконати заздалегідь. `POST`, `PUT`, `PATCH`, `DELETE` змінюють дані на сервері, тож обережно з повторами — про це урок про ідемпотентність.
      en: |
        A request has three places for data, and each has its own role:

        - **The path** names the resource: `/records/w-02`. Without that part the request is about something else.
        - **The query string** narrows *which part* of a collection to read: `GET /records?acquired=false&sort=price`. Filters, sorting and pages are in the fourth lesson of this unit.
        - **The body** carries the data being written: a new record for `POST`, the whole record for `PUT`, the changed fields for `PATCH`. `GET` and `DELETE` usually have no body: HTTP defines no meaning for it in these methods.

        One more boundary lies between reading and changing. `GET` is [[safe-method|safe]]: it can be repeated, cached, run in advance. `POST`, `PUT`, `PATCH` and `DELETE` change data on the server, so be careful with repeats — that is the lesson on idempotency.

  - id: predict-safe
    kind: prediction
    prompt:
      uk: "Які із цих запитів до API бажань нічого не змінюють на сервері (безпечні)? Обери всі."
      en: "Which of these requests to the wishlist API change nothing on the server (are safe)? Pick all."
    answer:
      type: multi
      options:
        - id: get-list
          code: "GET /records?acquired=false"
        - id: get-one
          code: "GET /records/w-03"
        - id: post
          code: "POST /records"
          why:
            uk: "`POST` створює новий запис — це зміна."
            en: "`POST` creates a new record — that is a change."
        - id: patch
          code: "PATCH /records/w-03"
          why:
            uk: "Навіть якщо змінюється одне поле, `PATCH` змінює дані на сервері."
            en: "Even when only one field changes, `PATCH` changes data on the server."
        - id: delete
          code: "DELETE /records/w-03"
          why:
            uk: "`DELETE` прибирає запис — найпомітніша зміна з усіх."
            en: "`DELETE` removes a record — the most visible change of all."
      correct: [get-list, get-one]
    explanation:
      uk: "Безпечні лише два `GET`: query string `?acquired=false` уточнює, що читати, але нічого не змінює. Інші три запити змінюють дані."
      en: "Only the two `GET` requests are safe: the query string `?acquired=false` narrows what to read but changes nothing. The other three requests change data."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: query-or-mutation
        from: re-06-04-queries-vs-mutations
        prompt:
          uk: "У React-клієнті екран списку бажань має кнопку «Позначити отриманим». До якого виду належить запит, що вона надсилає, і що звідси випливає?"
          en: "In a React client the wishlist screen has a “Mark as received” button. Which kind of request does it send, and what follows from that?"
        answer:
          type: choice
          options:
            - id: mutation
              text:
                uk: "Mutation: вона змінює дані, запускається з обробника натискання й ніколи не повторюється мовчки"
                en: "A mutation: it changes data, starts from the click handler and is never repeated silently"
            - id: query
              text:
                uk: "Query: клієнт може кешувати її відповідь і повторювати її, коли захоче"
                en: "A query: the client may cache its response and repeat it whenever it likes"
              why:
                uk: "Query лише читає. Тут дані на сервері змінюються, тож повтор чи кешування можуть зашкодити."
                en: "A query only reads. Here data on the server changes, so repeating or caching it could do harm."
          correct: [mutation]
        explanation:
          uk: "На сервері ця межа та сама: query клієнта — це безпечний `GET`, а mutation — `POST`, `PUT`, `PATCH` чи `DELETE` (тут — `PATCH /records/:id` з `{ \"acquired\": true }`)."
          en: "On the server the boundary is the same: a client's query is a safe `GET`, and a mutation is `POST`, `PUT`, `PATCH` or `DELETE` (here `PATCH /records/:id` with `{ \"acquired\": true }`)."

  - id: wishlist-api
    kind: example
    runtime: isolated-node
    dir: wishlist-api
    entry: index.js
    capabilities: { network: loopback }
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      tech: { uk: "Техніка", en: "Tech" }
      home: { uk: "Дім", en: "Home" }
      sport: { uk: "Спорт", en: "Sport" }
      noBody: { uk: "без тіла", en: "no body" }
      listOf: { uk: "список, записів:", en: "a list of records:" }
    title:
      uk: "API бажань: шість операцій"
      en: "The wishlist API: six operations"
    body:
      uk: |
        `app.js` — API бажань у пам’яті, `index.js` запускає його на вільному порту 127.0.0.1, надсилає по одному запиту на кожну операцію й зупиняє сервер. Натисни **Запустити** й порівняй статуси з таблицею.

        Зверни увагу на запис `w-02` після `PUT`: у ньому лишилися тільки надіслані поля. І на видалення: тут воно ще адреса-дія `POST /deleteRecord?id=w-05`, яка відповідає 200.
      en: |
        `app.js` is an in-memory wishlist API; `index.js` starts it on a free 127.0.0.1 port, sends one request per operation and stops the server. Press **Run** and compare the statuses with the table.

        Look at the record `w-02` after `PUT`: only the fields that were sent are left. And at the deletion: here it is still an action address, `POST /deleteRecord?id=w-05`, which answers 200.
    tryIt:
      uk: |
        Перетвори адресу-дію на REST.

        1. У `app.js` у блоці «One record» додай `'DELETE'` до списку методів у `includes(...)` і до заголовка `allow`. Після рядка `if (request.method === 'GET') …` додай гілку: `if (request.method === 'DELETE') { records.splice(index, 1); return sendEmpty(response, 204); }`.
        2. У `index.js` заміни `['POST', '/deleteRecord?id=w-05']` на `['DELETE', '/records/w-05']` і запусти: `DELETE /records/w-05 → 204 (без тіла)`, а наступний `GET /records/w-05` — 404.
        3. Тепер маршрут `/deleteRecord` у `app.js` нікому не потрібен — видали його й запусти ще раз: результат той самий.
      en: |
        Turn the action address into REST.

        1. In `app.js`, in the “One record” block, add `'DELETE'` to the list of methods in `includes(...)` and to the `allow` header. After the line `if (request.method === 'GET') …` add a branch: `if (request.method === 'DELETE') { records.splice(index, 1); return sendEmpty(response, 204); }`.
        2. In `index.js` replace `['POST', '/deleteRecord?id=w-05']` with `['DELETE', '/records/w-05']` and run: `DELETE /records/w-05 → 204 (no body)`, and the next `GET /records/w-05` gets 404.
        3. Now nobody needs the `/deleteRecord` route in `app.js` — remove it and run again: the result is the same.

  - id: notes-routes
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: notes-routes
    entry: index.js
    editable: [routes.js]
    capabilities: { network: loopback }
    strings:
      gifts: { uk: "Ідеї подарунків", en: "Gift ideas" }
      giftsText: { uk: "Книжка, шарф", en: "A book, a scarf" }
      shopping: { uk: "Покупки", en: "Shopping" }
      shoppingText: { uk: "Хліб, молоко", en: "Bread, milk" }
      newTitle: { uk: "Фільми на вихідні", en: "Films for the weekend" }
      renamed: { uk: "Подарунки до свят", en: "Holiday gifts" }
      noBody: { uk: "без тіла", en: "no body" }
    title:
      uk: "Таблиця маршрутів для нотаток"
      en: "A route table for notes"
    instructions:
      uk: |
        `app.js` будує API нотаток із таблиці маршрутів у `routes.js`: кожен рядок каже, яким методом і шляхом викликають операцію і якими статусами вона відповідає. Редагуєш ти лише `routes.js`.

        Допиши таблицю — по рядку на кожну операцію:

        - `read` — одна нотатка, `create` — нова нотатка, `replace` — заміна нотатки цілком, `update` — зміна частини полів, `remove` — видалення;
        - `path` — `/notes` для колекції або `/notes/:id` для однієї нотатки (`:id` — місце, куди потрапляє `id`);
        - `success` — статус успіху; `notFound` — статус для нотатки, якої немає (у кожного рядка з `:id`).

        **Запустити** надсилає по запиту на кожну операцію (останній `DELETE` повторює попередній). **Перевірити** надсилає справжні HTTP-запити.
      en: |
        `app.js` builds the notes API from the route table in `routes.js`: each row says which method and path call an operation and which statuses it answers with. You edit only `routes.js`.

        Finish the table — one row per operation:

        - `read` — one note, `create` — a new note, `replace` — replacing a note entirely, `update` — changing some fields, `remove` — deleting;
        - `path` — `/notes` for the collection or `/notes/:id` for one note (`:id` is where the `id` goes);
        - `success` — the status on success; `notFound` — the status for a note that does not exist (on every row with `:id`).

        **Run** sends one request per operation (the last `DELETE` repeats the one before). **Check** sends real HTTP requests.
    testTitles:
      "list: GET /notes answers 200 with every note":
        uk: "`GET /notes` відповідає 200 і всіма нотатками"
        en: "`GET /notes` answers 200 with every note"
      "read: GET /notes/:id answers 200 with that note":
        uk: "`GET /notes/:id` відповідає 200 і цією нотаткою"
        en: "`GET /notes/:id` answers 200 with that note"
      "create: POST /notes answers 201 and adds the note":
        uk: "`POST /notes` відповідає 201 і додає нотатку"
        en: "`POST /notes` answers 201 and adds the note"
      "replace: PUT /notes/:id answers 200 and keeps only the fields sent":
        uk: "`PUT /notes/:id` відповідає 200 і лишає тільки надіслані поля"
        en: "`PUT /notes/:id` answers 200 and keeps only the fields sent"
      "update: PATCH /notes/:id answers 200 and changes only the fields sent":
        uk: "`PATCH /notes/:id` відповідає 200 і змінює тільки надіслані поля"
        en: "`PATCH /notes/:id` answers 200 and changes only the fields sent"
      "remove: DELETE /notes/:id answers 204 and the note is gone":
        uk: "`DELETE /notes/:id` відповідає 204, і нотатки більше немає"
        en: "`DELETE /notes/:id` answers 204 and the note is gone"
      "a missing note answers 404 for read, replace, update and remove":
        uk: "Нотатка, якої немає: 404 для читання, заміни, зміни й видалення"
        en: "A missing note: 404 for read, replace, update and remove"
    hints:
      nudge:
        uk: "Шляхів лише два — `/notes` і `/notes/:id`. Операції з однаковим шляхом відрізняє метод."
        en: "There are only two paths — `/notes` and `/notes/:id`. Operations on the same path differ by method."
      explanation:
        uk: "Для API бажань таблиця мала б рядки на кшталт `{ operation: 'read', method: 'GET', path: '/records/:id', success: 200, notFound: 404 }`. Метод обирай за змістом: створення в колекції, заміна цілком і зміна частини — різні методи. Статус успіху створення — «Created», видалення — «No Content», решти — 200."
        en: "For the wishlist API the table would have rows like `{ operation: 'read', method: 'GET', path: '/records/:id', success: 200, notFound: 404 }`. Choose the method by meaning: creating in a collection, replacing entirely and changing a part are different methods. The success status of a create is “Created”, of a delete “No Content”, of the rest 200."
    solutionNote:
      uk: "Шість операцій на двох шляхах: `GET`/`POST` на `/notes`, `GET`/`PUT`/`PATCH`/`DELETE` на `/notes/:id`. Створення відповідає 201, видалення — 204 без тіла, решта — 200; нотатка, якої немає, — 404."
      en: "Six operations on two paths: `GET`/`POST` on `/notes`, `GET`/`PUT`/`PATCH`/`DELETE` on `/notes/:id`. Create answers 201, delete 204 with no body, the rest 200; a note that does not exist gets 404."
    feedback:
      - when: { test: "create: POST /notes answers 201 and adds the note" }
        message:
          uk: "Ця перевірка надсилає `POST /notes` і чекає статус 201. Створення — це `POST` на саму колекцію, без дієслова в шляху; статус «Created» — 201, а не 200."
          en: "This check sends `POST /notes` and expects status 201. Creating is `POST` to the collection itself, with no verb in the path; the “Created” status is 201, not 200."
      - when: { test: "replace: PUT /notes/:id answers 200 and keeps only the fields sent" }
        message:
          uk: "Ця перевірка надсилає `PUT /notes/n-1` лише з `title` і чекає, що від нотатки залишаться тільки `id` і `title`. Заміна цілком — `PUT`, а не `PATCH`."
          en: "This check sends `PUT /notes/n-1` with only `title` and expects the note to keep only `id` and `title`. Replacing entirely is `PUT`, not `PATCH`."
      - when: { test: "update: PATCH /notes/:id answers 200 and changes only the fields sent" }
        message:
          uk: "Ця перевірка надсилає `PATCH /notes/n-1` з `{ pinned: true }` і чекає, що `title` і `text` залишаться. Зміна частини — `PATCH`."
          en: "This check sends `PATCH /notes/n-1` with `{ pinned: true }` and expects `title` and `text` to stay. Changing a part is `PATCH`."
      - when: { test: "remove: DELETE /notes/:id answers 204 and the note is gone" }
        message:
          uk: "Ця перевірка надсилає `DELETE /notes/n-2` і чекає статус 204 (успіх без тіла), а потім список без `n-2`."
          en: "This check sends `DELETE /notes/n-2` and expects status 204 (success with no body), then a list without `n-2`."
      - when: { test: "a missing note answers 404 for read, replace, update and remove" }
        message:
          uk: "Ця перевірка надсилає `GET`, `PUT`, `PATCH` і `DELETE` на `/notes/n-9` і чекає, що кожен запит дійде до рядка таблиці й отримає 404 з його `notFound`."
          en: "This check sends `GET`, `PUT`, `PATCH` and `DELETE` to `/notes/n-9` and expects each request to reach a row of the table and get 404 from its `notFound`."

