      soap: { uk: "Мило", en: "Soap" }
      market: { uk: "Ринок", en: "Market" }
      museum: { uk: "Музей", en: "Museum" }
    title:
      uk: "listRecords для витрат"
      en: "listRecords for expenses"
    instructions:
      uk: |
        `app.js` передає параметри `GET /expenses` у `listRecords(records, query)` з `list.js`: `query` — об’єкт текстових значень, наприклад `{ category: "food", limit: "3" }`. Напиши `listRecords`:

        - `category` (необов’язковий) — лишає лише цю категорію;
        - `sort` — `"date"` (типово) або `"amountMinor"`, за зростанням; за однакових значень — за `id`; будь-яке інше значення — помилка `sort: "unknownSort"`;
        - `limit` — ціле від 1 до 50 (типово 10), інакше помилка `limit: "outOfRange"`;
        - `cursor` (необов’язковий) — `id` останньої витрати попередньої сторінки: сторінка починається з наступного за ним запису в порядку сортування; `id`, якого немає серед записів, — помилка `cursor: "unknownCursor"`.

        Порядок: фільтр → сортування → курсор → сторінка. Поверни `{ ok: true, items, nextCursor }`, де `nextCursor` — `id` останнього запису сторінки, якщо після неї ще є записи, і `null` на останній сторінці. Помилки — `{ ok: false, errors }`; `app.js` перетворить їх на 400.
      en: |
        `app.js` passes the parameters of `GET /expenses` to `listRecords(records, query)` from `list.js`: `query` is an object of text values, for example `{ category: "food", limit: "3" }`. Write `listRecords`:

        - `category` (optional) — keep only this category;
        - `sort` — `"date"` (default) or `"amountMinor"`, ascending; for equal values by `id`; any other value is the error `sort: "unknownSort"`;
        - `limit` — a whole number from 1 to 50 (default 10), otherwise the error `limit: "outOfRange"`;
        - `cursor` (optional) — the `id` of the last expense of the previous page: the page starts with the record that follows it in the sort order; an `id` that is not among the records is the error `cursor: "unknownCursor"`.

        Order: filter → sort → cursor → page. Return `{ ok: true, items, nextCursor }`, where `nextCursor` is the `id` of the page's last record when more records follow, and `null` on the last page. Errors are `{ ok: false, errors }`; `app.js` turns them into 400.
    testTitles:
      "filters by category before paging":
        uk: "Фільтрує за категорією до поділу на сторінки"
        en: "Filters by category before paging"
      "sorts by date, and equal dates by id":
        uk: "Сортує за датою, а однакові дати — за `id`"
        en: "Sorts by date, and equal dates by `id`"
      "sorts by amountMinor when asked":
        uk: "Сортує за `amountMinor`, коли попросили"
        en: "Sorts by `amountMinor` when asked"
      "walking the pages by cursor returns every expense once, and the last nextCursor is null":
        uk: "Прохід сторінками за курсором дає кожну витрату один раз, а останній `nextCursor` — `null`"
        en: "Walking the pages by cursor returns every expense once, and the last `nextCursor` is `null`"
      "limit must be a whole number from 1 to 50; the default is 10":
        uk: "`limit` — ціле від 1 до 50, типово 10"
        en: "`limit` is a whole number from 1 to 50; the default is 10"
      "an unknown sort or cursor is refused":
        uk: "Невідомий `sort` чи `cursor` відхилено"
        en: "An unknown `sort` or `cursor` is refused"
      "over HTTP a record added between two pages is neither repeated nor skipped":
        uk: "Через HTTP запис, доданий між двома сторінками, не повторюється й не губиться"
        en: "Over HTTP a record added between two pages is neither repeated nor skipped"
    hints:
      nudge:
        uk: "Почни з перевірок `query` — вони можуть одразу повернути `{ ok: false, errors }`. Далі: `filter`, `toSorted`, курсор, `slice`."
        en: "Start with the checks of `query` — they may return `{ ok: false, errors }` right away. Then: `filter`, `toSorted`, the cursor, `slice`."
      explanation:
        uk: "Comparator з tie-breaker має вигляд `(a, b) => byKey(a, b) || byId(a, b)`, а `a[sort]` бере поле за назвою з `query.sort`. Курсор — це запис: знайди його за `id` серед усіх записів і залиш лише ті, для яких comparator(запис, курсор) > 0. Чи є наступна сторінка, видно з того, чи залишилося записів більше, ніж `limit`. Текст `\"2.5\"` перетворює на число `Number`, а ціле воно чи ні, скаже `Number.isInteger`."
        en: "A comparator with a tie-breaker looks like `(a, b) => byKey(a, b) || byId(a, b)`, and `a[sort]` reads the field named by `query.sort`. The cursor is a record: find it by `id` among all records and keep only those for which comparator(record, cursor) > 0. Whether there is a next page shows in whether more than `limit` records are left. `Number` turns the text `\"2.5\"` into a number, and `Number.isInteger` tells whether it is whole."
    solutionNote:
      uk: "Кроки йдуть у порядку фільтр → сортування → курсор → сторінка. Курсор — це запис, а не позиція: сторінка бере те, що в порядку сортування йде після нього, тому вставка раніше нічого не зсуває. Tie-breaker за `id` дає кожному запису своє місце, і курсор не губить записи з однаковою датою чи сумою."
      en: "The steps go filter → sort → cursor → page. The cursor is a record, not a position: the page takes what sorts after it, so an earlier insert shifts nothing. The `id` tie-breaker gives every record its own place, so the cursor does not lose records with an equal date or amount."
    feedback:
      - when: { test: "filters by category before paging" }
        message:
          uk: "Ця перевірка чекає для `category=food&sort=amountMinor&limit=2` дві витрати з категорії food. Фільтруй до того, як вирізати сторінку."
          en: "This check expects two food expenses for `category=food&sort=amountMinor&limit=2`. Filter before cutting the page."
      - when: { test: "sorts by date, and equal dates by id" }
        message:
          uk: "Ця перевірка передає записи у зворотному порядку й чекає, що однакові дати впорядковано за `id`. Додай другий ключ, коли перший дав 0."
          en: "This check passes the records in reverse order and expects equal dates to be ordered by `id`. Add a second key for when the first gave 0."
      - when: { test: "walking the pages by cursor returns every expense once, and the last nextCursor is null" }
        message:
          uk: "Ця перевірка читає сторінки по 4 за `amountMinor` (там три суми по 18000) і чекає всі 12 витрат по разу, а на останній сторінці `nextCursor: null`. Якщо бракує записів з однаковою сумою — додай tie-breaker; якщо після останньої сторінки є ще одна порожня — `nextCursor` має бути `null`."
          en: "This check reads pages of 4 by `amountMinor` (there are three amounts of 18000) and expects all 12 expenses once each, with `nextCursor: null` on the last page. If records with an equal amount are missing, add a tie-breaker; if an empty page follows the last one, `nextCursor` must be `null`."
      - when: { test: "limit must be a whole number from 1 to 50; the default is 10" }
        message:
          uk: "Ця перевірка чекає `outOfRange` для `0`, `51`, `2.5` і `many`, по одному запису для `1`, усі 12 для `50` і 10 без `limit`."
          en: "This check expects `outOfRange` for `0`, `51`, `2.5` and `many`, one record for `1`, all 12 for `50`, and 10 without `limit`."
      - when: { test: "an unknown sort or cursor is refused" }
        message:
          uk: "Ця перевірка чекає `errors.sort: \"unknownSort\"` для `sort=label` і `errors.cursor: \"unknownCursor\"` для `cursor=e-99`. Не підміняй невідоме значення типовим мовчки."
          en: "This check expects `errors.sort: \"unknownSort\"` for `sort=label` and `errors.cursor: \"unknownCursor\"` for `cursor=e-99`. Do not silently replace an unknown value with the default."
      - when: { test: "over HTTP a record added between two pages is neither repeated nor skipped" }
        message:
          uk: "Ця перевірка читає сторінку 1, додає витрату з ранньою датою й чекає на сторінці 2 рівно `e-02, e-06, e-07, e-08`, а наприкінці — 400 для `limit=500`. `cursor` — це `id` запису, а не номер позиції."
          en: "This check reads page 1, adds an expense with an early date and expects exactly `e-02, e-06, e-07, e-08` on page 2, and finally 400 for `limit=500`. The `cursor` is a record's `id`, not a position number."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` тут найчастіше означає `.at(-1)` чи `.id` на порожньому масиві чи `undefined` (наприклад, коли курсор не знайдено). Якщо всі перевірки падають разом, виправ першу помилку в консолі."
          en: "A `TypeError` here most often means `.at(-1)` or `.id` on an empty array or on `undefined` (for example, when the cursor was not found). If every check fails at once, fix the first error in the console."

