          en: "In VS Code create the files `app.ts`, `repo.ts`, `notes.ts` and `http-helpers.js` in this folder and copy into them the contents of the files with the same names from the exercise “The notes API” (`app.ts` is your solution that passed the checks). Create `api.test.js` with the text from step 3 of the introduction."
      - text:
          uk: "Запусти тести. `node --test` сам знаходить файли `*.test.js`."
          en: "Run the tests. `node --test` finds `*.test.js` files by itself."
        command: "node --test"
        expect:
          uk: "Два тести з `✔`, як у кроці 4 вступу."
          en: "Two tests with `✔`, as in step 4 of the introduction."
      - text:
          uk: "Без підказок допиши в `api.test.js` ще щонайменше чотири тести: тіло понад 1024 байти дає 413; сторінка, що закінчується рівно на останній нотатці (`?pinned=true&limit=4`), має `nextCursor: null`; повторений `POST` з тим самим `Idempotency-Key` лишає одну нову нотатку; запит, перерваний клієнтом, скасовує сигнал репозиторію (передай у `createApp` власний повільний репозиторій, що запам’ятовує свій сигнал)."
          en: "Without hints, add at least four more tests to `api.test.js`: a body over 1024 bytes gives 413; a page that ends exactly at the last note (`?pinned=true&limit=4`) has `nextCursor: null`; a retried `POST` with the same `Idempotency-Key` leaves one new note; a request aborted by the client aborts the repository's signal (pass `createApp` your own slow repository that remembers its signal)."
      - text:
