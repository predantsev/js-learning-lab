<!doctype html>
<html lang="%%lang%%">
<head>
  <meta charset="utf-8">
  <title>%%pageTitle%%</title>
</head>
<body>
  <h1>%%pageTitle%%</h1>
  <button type="button" id="load">%%load%%</button>
  <button type="button" id="pause">%%pause%%</button>
  <pre id="out" role="status"></pre>
  <script type="module">
    // The API lives on another origin: another port is another origin.
    const API = 'http://127.0.0.1:7330';
    const out = document.querySelector('#out');

    async function show(label, request) {
      try {
        const response = await request();
        out.textContent = `${label} → ${response.status}\n${await response.text()}`;
      } catch (error) {
        out.textContent = `${label} → ${error.name}: ${error.message}`;
      }
    }

    document.querySelector('#load').addEventListener('click', () =>
      show('GET /v1/records', () => fetch(`${API}/v1/records`)));

    document.querySelector('#pause').addEventListener('click', () =>
      show('PATCH /v1/records/h-03', () => fetch(`${API}/v1/records/h-03`, {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ active: false }),
      })));
  </script>
</body>
</html>
