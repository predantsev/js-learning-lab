id: no-06-02-replace-fixtures-with-api
unit: NO-06
title:
  uk: "Замінюємо фікстури на API"
  en: "Replacing fixtures with the API"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Замінити вбудоване джерело фікстур на HTTP-джерело з тим самим інтерфейсом, не змінюючи доменних функцій і компонентів."
    en: "Swap the bundled fixture source for an HTTP data source behind the same interface without changing domain functions or components."
  - uk: "Брати базову адресу API з конфігурації й лишити фікстури тільки для тестів і початкового наповнення."
    en: "Read the API base URL from configuration and keep fixtures only for tests and seeding."
prerequisites: [no-06-01-client-server-boundary, re-06-01-fetch-lifecycle]
subskills:
  - { family: B-12, skill: "local fixture replacement", depth: intro }
glossary: [api-base-url, data-source-interface]
selfCheck: [predict-what-changes, expense-http-source]

blocks:
  - id: one-interface
    kind: explanation
    title:
      uk: "Один інтерфейс, два джерела"
      en: "One interface, two sources"
    body:
      uk: |
        У проєкті компоненти не знають, звідки беруться записи. Вони викликають кілька методів — [[data-source-interface|інтерфейс джерела даних]]:

        ```js
        await source.listRecords();              // all records
        await source.createRecord(input);        // the new record
        await source.updateRecord(id, changes);  // the changed record
        ```

        Досі цей інтерфейс виконувало джерело з фікстур: записи в пам’яті, відповіді — проміси. Тепер з’являється друге джерело, HTTP: ті самі методи, але кожен надсилає запит до API. Компоненти й доменні функції (сума за категоріями, кількість справ до терміну) **не змінюються**: вони отримують той самий масив записів.

        Змінюються лише два місця:

        - **модуль джерела даних** — він вирішує, яке джерело створити;
        - **конфігурація** — вона каже, яке джерело потрібне і де API: [[api-base-url|базова адреса API]], наприклад `http://127.0.0.1:7330`. Адресу не пишуть у коді джерела: вона різна на твоєму комп’ютері, у тестах і на телефоні.

        Фікстури нікуди не зникають: вони наповнюють сервер початковими даними й годують тести.
      en: |
        In the project, components do not know where records come from. They call a few methods — the [[data-source-interface]]:

        ```js
        await source.listRecords();              // all records
        await source.createRecord(input);        // the new record
        await source.updateRecord(id, changes);  // the changed record
        ```

        Until now this interface was carried out by the fixture source: records in memory, answers as promises. Now there is a second source, HTTP: the same methods, but each sends a request to the API. Components and domain functions (totals per category, the count of due tasks) **do not change**: they get the same array of records.

        Only two places change:

        - **the data-source module** — it decides which source to create;
        - **the configuration** — it says which source is needed and where the API is: the [[api-base-url]], for example `http://127.0.0.1:7330`. The address is not written in the source's code: it differs on your computer, in tests and on a phone.

        Fixtures do not disappear: they seed the server with starting data and feed the tests.

  - id: predict-what-changes
    kind: prediction
    prompt:
      uk: "Трекер витрат перемикає `listRecords()` з фікстур на `GET /v1/records`. Компоненти й функція підсумків за категоріями викликають лише `listRecords()`. Які модулі доведеться змінити? Обери всі."
      en: "The expense tracker switches `listRecords()` from fixtures to `GET /v1/records`. The components and the category-totals function call only `listRecords()`. Which modules have to change? Pick all."
    answer:
      type: multi
      options:
        - id: data-source
          text: { uk: "Модуль, що створює джерело даних", en: "The module that creates the data source" }
        - id: config
          text: { uk: "Конфігурація (яке джерело й базова адреса API)", en: "The configuration (which source, and the API base URL)" }
        - id: components
          text: { uk: "Кожен компонент, що показує витрати", en: "Every component that shows expenses" }
          why:
            uk: "Компоненти бачать лише `listRecords()` і масив записів. Поки інтерфейс той самий, їм байдуже, звідки записи."
            en: "Components see only `listRecords()` and an array of records. As long as the interface stays the same, they do not care where the records come from."
        - id: domain
          text: { uk: "Функція підсумків за категоріями", en: "The category-totals function" }
          why:
            uk: "Доменна функція отримує масив витрат і нічого не знає про мережу. Її тести й далі працюють на фікстурах."
            en: "The domain function receives an array of expenses and knows nothing about the network. Its tests keep running on fixtures."
      correct: [data-source, config]
    explanation:
      uk: "Заміна фікстур — це заміна **виконавця** інтерфейсу. Змінюється місце, де джерело створюється, і конфігурація з адресою; усе, що лише викликає `listRecords()`, лишається як було."
      en: "Replacing fixtures means replacing who **carries out** the interface. The place where the source is created and the configuration with the address change; everything that only calls `listRecords()` stays as it was."

  - id: swap-diagram
    kind: visual
    visual: diagram
    title:
      uk: "Стрілка переходить від фікстур до API"
      en: "The arrow moves from fixtures to the API"
    textEquivalent:
      uk: "Компоненти й доменна функція підсумків залежать від одного інтерфейсу джерела даних — listRecords, createRecord, updateRecord. Спершу інтерфейс виконує модуль фікстур. Потім конфігурація з DATA_SOURCE і API_BASE_URL перемикає модуль джерела даних на HTTP-модуль, який надсилає запити до API на 127.0.0.1. Компоненти й доменна функція лишаються незмінними, а фікстури далі потрібні тестам і початковому наповненню сервера."
      en: "The components and the domain totals function depend on one data-source interface — listRecords, createRecord, updateRecord. At first the fixture module carries out the interface. Then the configuration with DATA_SOURCE and API_BASE_URL switches the data-source module to the HTTP module, which sends requests to the API on 127.0.0.1. The components and the domain function stay unchanged, while the fixtures are still needed by the tests and for seeding the server."
    spec:
      layout: grid
      nodes:
        - { id: ui, label: { uk: "компоненти", en: "components" }, w: 160, col: 0, row: 0 }
        - { id: domain, label: { uk: "підсумки (домен)", en: "totals (domain)" }, w: 160, col: 1, row: 0 }
        - { id: iface, label: "listRecords()", shape: pill, w: 160, col: 0, row: 1 }
        - { id: config, label: "API_BASE_URL", shape: note, w: 160, col: 1, row: 1 }
        - { id: fixtures, label: "fixture-source.js", w: 160, col: 0, row: 2 }
        - { id: http, label: "http-source.js", w: 160, col: 1, row: 2 }
        - { id: api, label: "127.0.0.1 /v1/records", shape: cylinder, w: 160, col: 1, row: 3 }
      edges:
        - { id: ui-iface, from: ui, to: iface }
        - { id: ui-domain, from: ui, to: domain, kind: line }
        - { id: iface-fixtures, from: iface, to: fixtures }
        - { id: iface-http, from: iface, to: http }
        - { id: config-http, from: config, to: http, kind: dashed }
        - { id: http-api, from: http, to: api, label: "HTTP" }
      hidden: [iface-http, config-http, http-api, api]
      steps:
        - caption:
            uk: "Компоненти викликають `listRecords()`, а записи передають доменній функції підсумків."
            en: "The components call `listRecords()` and pass the records to the domain totals function."
          highlight: [ui, iface, ui-iface, domain, ui-domain]
        - caption:
            uk: "Досі інтерфейс виконувало джерело з фікстур: записи в пам’яті клієнта."
            en: "Until now the fixture source carried out the interface: records in the client's memory."
          highlight: [iface, fixtures, iface-fixtures]
        - caption:
            uk: "Конфігурація каже: джерело `http`, адреса — `API_BASE_URL`. Модуль джерела даних створює HTTP-джерело."
            en: "The configuration says: source `http`, address `API_BASE_URL`. The data-source module creates the HTTP source."
          show: [iface-http, config-http]
          highlight: [config, http, config-http, iface-http]
          dim: [iface-fixtures]
        - caption:
            uk: "HTTP-джерело надсилає запити до API на `127.0.0.1`. Сервер тепер джерело істини."
            en: "The HTTP source sends requests to the API on `127.0.0.1`. The server is now the source of truth."
          show: [http-api, api]
          highlight: [http, http-api, api]
          dim: [iface-fixtures]
        - caption:
            uk: "Компоненти й домен не змінилися. Фікстури лишилися — для тестів і початкового наповнення сервера."
            en: "The components and the domain did not change. The fixtures stayed — for tests and for seeding the server."
          highlight: [ui, domain, fixtures]
          annotate:
            - { id: ui, text: { uk: "без змін", en: "unchanged" } }
            - { id: domain, text: { uk: "без змін", en: "unchanged" } }

  - id: swap-source
    kind: example
    runtime: isolated-node
    dir: swap-source
    entry: index.js
    capabilities: { network: loopback }
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      lunch: { uk: "Обід", en: "Lunch" }
      source: { uk: "джерело", en: "source" }
      count: { uk: "витрат", en: "expenses" }
    title:
      uk: "Те саме з фікстур і з API"
      en: "The same from fixtures and from the API"
    body:
      uk: |
        `config.js` читає налаштування з `process.env`: `DATA_SOURCE` (`fixtures` чи `http`) і `API_BASE_URL`. `data-source.js` — єдине місце, яке знає про обидва джерела. `summary.js` — доменна функція підсумків. `app.js` — API витрат, у якому на одну витрату більше, ніж у фікстурах. `index.js` запускає сервер і передає його адресу через `API_BASE_URL`, як це зробив би термінал.

        Натисни **Запустити**: джерело `fixtures`, 4 витрати.
      en: |
        `config.js` reads the settings from `process.env`: `DATA_SOURCE` (`fixtures` or `http`) and `API_BASE_URL`. `data-source.js` is the only place that knows both sources. `summary.js` is the domain totals function. `app.js` is the expenses API, holding one expense more than the fixtures. `index.js` starts the server and passes its address through `API_BASE_URL`, as a terminal would.

        Press **Run**: the source is `fixtures`, 4 expenses.
    tryIt:
      uk: |
        1. В `index.js` заміни `'fixtures'` у рядку `process.env.DATA_SOURCE ??= 'fixtures';` на `'http'` і запусти: рядок `[server] GET /v1/records → 200`, 5 витрат, а сума `food` виросла на 210.50. `summary.js` ти не чіпав.
        2. Закоментуй рядок `process.env.API_BASE_URL = …` (додай `//` на його початку) і запусти: програма зупиняється з помилкою `API_BASE_URL is required…`, а не показує тихцем фікстури. Прибери `//`.
      en: |
        1. In `index.js` replace `'fixtures'` in the line `process.env.DATA_SOURCE ??= 'fixtures';` with `'http'` and run: the line `[server] GET /v1/records → 200`, 5 expenses, and the `food` total grew by 210.50. You did not touch `summary.js`.
        2. Comment out the line `process.env.API_BASE_URL = …` (add `//` at its start) and run: the program stops with the error `API_BASE_URL is required…` instead of quietly showing the fixtures. Remove the `//`.

  - id: edge-check
    kind: explanation
    title:
      uk: "Сервер — не фікстура: перевір відповідь на межі"
      en: "The server is not a fixture: check the answer at the edge"
    body:
      uk: |
        Фікстури ти писав сам, і вони завжди правильної форми. Відповідь сервера — ні: інша версія API, поле, яке хтось перейменував, сума текстом замість числа. Тож HTTP-джерело робить три речі, яких фікстурам не треба:

        - **перевіряє статус**: відповідь не `ok` — це помилка з полем `status`, а не «список» із тілом помилки;
        - **пропускає кожен запис через схему контракту** (`parseExpense` чи подібну) і відхиляє весь результат, якщо хоч один запис її порушує — як [[runtime-schema|схема під час виконання]] в розділі React;
        - **отримує `fetch` параметром**, а не бере глобальний: тоді тест може підставити свій `fetch`, що рахує запити чи відповідає збоєм.

        Для записів (`POST`, `PATCH`) тіло — JSON, тож запит каже це заголовком `Content-Type: application/json`.
      en: |
        You wrote the fixtures yourself, and they always have the right shape. A server's answer does not: another version of the API, a field someone renamed, an amount as text instead of a number. So the HTTP source does three things fixtures never needed:

        - **it checks the status**: an answer that is not `ok` is an error with a `status` field, not a “list” holding an error body;
        - **it passes every record through the contract's schema** (`parseExpense` or similar) and rejects the whole result if even one record breaks it — like the [[runtime-schema]] in the React stage;
        - **it takes `fetch` as a parameter** instead of using the global one: then a test can put in its own `fetch` that counts requests or answers with a failure.

        For writes (`POST`, `PATCH`) the body is JSON, so the request says so with the header `Content-Type: application/json`.

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: fixtures-file-checked
        from: js-16-11-capstone-web-boundary
        prompt:
          uk: "У кроці проєкту наприкінці розділу JS-16 стартові записи приходили з файлу `./data/wishes.json` через `fetch`. Що функція завантаження робила з відповіддю, перш ніж повернути записи?"
          en: "In the project step at the end of unit JS-16 the starting records came from the file `./data/wishes.json` through `fetch`. What did the loading function do with the answer before returning the records?"
        answer:
          type: choice
          options:
            - id: checked
              text: { uk: "Перевіряла статус, тип вмісту й форму: `schemaVersion: 1`, масив `records` і кожен запис; інакше — помилка", en: "Checked the status, the content type and the shape: `schemaVersion: 1`, a `records` array and every record; otherwise an error" }
            - id: trusted
              text: { uk: "Нічого: файл лежить у проєкті, тож йому можна довіряти", en: "Nothing: the file is in the project, so it can be trusted" }
              why:
                uk: "Навіть свій файл приходить через межу довіри: він міг бути пошкоджений, а відповідь — сторінкою помилки. Тому форма й записи перевірялися."
                en: "Even your own file comes across a trust boundary: it could be damaged, and the answer could be an error page. So the shape and the records were checked."
            - id: dropped-bad
              text: { uk: "Відкидала пошкоджені записи й повертала решту", en: "Dropped the damaged records and returned the rest" }
              why:
                uk: "Мовчки відкинутий запис дає неповні дані. Пошкоджений запис робив пошкодженим увесь файл: функція відхиляла результат."
                en: "A silently dropped record gives incomplete data. A damaged record made the whole file damaged: the function rejected the result."
          correct: [checked]
        explanation:
          uk: "Відповідь не `ok` давала помилку зі `status`, тип не JSON чи неправильна форма — помилку «файл пошкоджено». Справжній API — та сама межа, тільки на іншому боці тепер твій сервер."
          en: "An answer that was not `ok` gave an error with `status`, a type other than JSON or a wrong shape gave a “file is damaged” error. A real API is the same boundary, only now your server is on the other side."

  - id: expense-http-source
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: expense-http-source
    entry: index.js
    editable: [http-source.js]
    capabilities: { network: loopback }
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      lunch: { uk: "Обід", en: "Lunch" }
      list: { uk: "Список", en: "List" }
      created: { uk: "Створено", en: "Created" }
      updated: { uk: "Змінено", en: "Updated" }
      failed: { uk: "Помилка", en: "Failed" }
    title:
      uk: "HTTP-джерело для трекера витрат"
      en: "An HTTP source for the expense tracker"
    instructions:
      uk: |
        `app.js` — API витрат, `contract.js` — функція `parseExpense(value)`, що повертає `{ ok: true, value }` або `{ ok: false, errors }`. Обидва лише для читання. Допиши в `http-source.js` функцію `createHttpSource({ baseUrl, fetch })` з тим самим інтерфейсом, що й у джерела фікстур:

        - `listRecords()` — `GET ${baseUrl}/v1/records`, повертає масив витрат;
        - `createRecord(input)` — `POST ${baseUrl}/v1/records` із тілом `input` у JSON, повертає нову витрату;
        - `updateRecord(id, changes)` — `PATCH ${baseUrl}/v1/records/<id>` із тілом `changes` у JSON, повертає змінену витрату;
        - кожен запит іде через `fetch` з параметра, а не через глобальний;
        - запити з тілом мають заголовок `Content-Type: application/json`;
        - відповідь не `ok` — відхилення з `Error`, у якого поле `status` дорівнює статусу відповіді;
        - кожну витрату з відповіді пропусти через `parseExpense`; якщо хоч одна не проходить (або список — не масив), метод відхиляється з `Error`.

        **Перевірити** запускає твоє джерело проти справжнього API й проти серверів, що відповідають збоєм чи порушують контракт.
      en: |
        `app.js` is the expenses API, `contract.js` has the function `parseExpense(value)`, which returns `{ ok: true, value }` or `{ ok: false, errors }`. Both are read-only. In `http-source.js` finish `createHttpSource({ baseUrl, fetch })` with the same interface as the fixture source:

        - `listRecords()` — `GET ${baseUrl}/v1/records`, returns the array of expenses;
        - `createRecord(input)` — `POST ${baseUrl}/v1/records` with `input` as the JSON body, returns the new expense;
        - `updateRecord(id, changes)` — `PATCH ${baseUrl}/v1/records/<id>` with `changes` as the JSON body, returns the changed expense;
        - every request goes through the `fetch` from the parameter, not the global one;
        - requests with a body have the header `Content-Type: application/json`;
        - an answer that is not `ok` — a rejection with an `Error` whose `status` field equals the answer's status;
        - pass every expense of an answer through `parseExpense`; if even one fails (or the list is not an array), the method rejects with an `Error`.

        **Check** runs your source against the real API and against servers that answer with a failure or break the contract.
    testTitles:
      "listRecords reads GET /v1/records through the given fetch":
        uk: "`listRecords` читає `GET /v1/records` через переданий `fetch`"
        en: "`listRecords` reads `GET /v1/records` through the given `fetch`"
      "createRecord sends POST /v1/records as JSON and returns the new expense":
        uk: "`createRecord` надсилає `POST /v1/records` як JSON і повертає нову витрату"
        en: "`createRecord` sends `POST /v1/records` as JSON and returns the new expense"
      "updateRecord sends PATCH /v1/records/:id and returns the changed expense":
        uk: "`updateRecord` надсилає `PATCH /v1/records/:id` і повертає змінену витрату"
        en: "`updateRecord` sends `PATCH /v1/records/:id` and returns the changed expense"
      "an answer that is not ok rejects with its status":
        uk: "Відповідь не `ok` дає відхилення з її `status`"
        en: "An answer that is not `ok` rejects with its `status`"
      "a list with an expense that breaks the contract is rejected":
        uk: "Список із витратою, що порушує контракт, відхиляється"
        en: "A list with an expense that breaks the contract is rejected"
      "a created expense that breaks the contract is rejected":
        uk: "Створена витрата, що порушує контракт, відхиляється"
        en: "A created expense that breaks the contract is rejected"
    hints:
      nudge:
        uk: "Три методи роблять майже те саме: запит, перевірка статусу, розбір JSON, перевірка контрактом. Що із цього можна винести в одну допоміжну функцію?"
        en: "The three methods do almost the same: a request, a status check, parsing JSON, a contract check. Which of these can go into one helper function?"
      explanation:
        uk: "Допоміжна функція отримує метод, шлях і, можливо, тіло; викликає саме параметр `fetch` з адресою `baseUrl` + шлях, для тіла додає `JSON.stringify` і заголовок `content-type`, а коли `response.ok` хибне, створює `Error`, записує в його властивість `status` статус відповіді й кидає. Друга функція бере значення, викликає `parseExpense` і кидає помилку, якщо `ok` — `false`. Для API справ це виглядало б як `checkedTask(await send('PATCH', '/v1/records/t-02', { done: true }))`."
        en: "The helper takes a method, a path and maybe a body; it calls the `fetch` parameter, exactly, with `baseUrl` + the path, adds `JSON.stringify` and the `content-type` header for a body, and when `response.ok` is false it creates an `Error`, puts the answer's status into its `status` property and throws it. A second function takes a value, calls `parseExpense` and throws if `ok` is `false`. For a tasks API it would look like `checkedTask(await send('PATCH', '/v1/records/t-02', { done: true }))`."
    solutionNote:
      uk: "HTTP-джерело виконує той самий інтерфейс, що й фікстури, тож решта клієнта не змінюється. Відмінність — межа: статус перевіряється, а кожен запис проходить контракт, бо сервер, на відміну від фікстур, може відповісти будь-чим. `fetch` параметром робить джерело перевірюваним: тест бачить кожен запит."
      en: "The HTTP source carries out the same interface as the fixtures, so the rest of the client does not change. The difference is the edge: the status is checked and every record passes the contract, because a server, unlike fixtures, can answer anything. `fetch` as a parameter makes the source testable: a test sees every request."
    feedback:
      - when: { test: "listRecords reads GET /v1/records through the given fetch" }
        message:
          uk: "Ця перевірка передає `fetch`, що рахує запити, і чекає рівно один запит `GET <baseUrl>/v1/records` через нього та три витрати сервера. Глобальний `fetch` вона не бачить."
          en: "This check passes a `fetch` that counts requests and expects exactly one `GET <baseUrl>/v1/records` through it, and the server's three expenses. It cannot see the global `fetch`."
      - when: { test: "createRecord sends POST /v1/records as JSON and returns the new expense" }
        message:
          uk: "Ця перевірка чекає нову витрату `e-04` у відповіді й 4 витрати на сервері. Сервер приймає `POST` лише із заголовком `Content-Type: application/json` (інакше 415)."
          en: "This check expects the new expense `e-04` in the answer and 4 expenses on the server. The server accepts a `POST` only with the header `Content-Type: application/json` (otherwise 415)."
      - when: { test: "updateRecord sends PATCH /v1/records/:id and returns the changed expense" }
        message:
          uk: "Ця перевірка змінює `amountMinor` витрати `e-02` на 50000 і чекає змінену витрату у відповіді й на сервері. Сервер змінює частину запису лише методом `PATCH` із JSON-тілом."
          en: "This check changes `amountMinor` of `e-02` to 50000 and expects the changed expense in the answer and on the server. The server changes part of a record only with `PATCH` and a JSON body."
      - when: { test: "an answer that is not ok rejects with its status" }
        message:
          uk: "Ця перевірка запускає сервери, що на `GET /v1/records` відповідають 404 і 500, і чекає відхилення з `error.status` 404 і 500. Перевір `response.ok`, перш ніж розбирати тіло."
          en: "This check runs servers that answer `GET /v1/records` with 404 and with 500 and expects rejections with `error.status` 404 and 500. Check `response.ok` before parsing the body."
      - when: { test: "a list with an expense that breaks the contract is rejected" }
        message:
          uk: "Ця перевірка відповідає списком, де в другої витрати `amountMinor` — текст `\"18000\"`, і чекає відхилення з `Error`. Пропусти кожну витрату через `parseExpense`."
          en: "This check answers a list where the second expense has `amountMinor` as the text `\"18000\"` and expects a rejection with an `Error`. Pass every expense through `parseExpense`."
      - when: { test: "a created expense that breaks the contract is rejected" }
        message:
          uk: "Ця перевірка відповідає на `POST` витратою з невідомою категорією `travel` і чекає відхилення з `Error`. Відповідь на запис теж проходить контракт."
          en: "This check answers the `POST` with an expense in the unknown category `travel` and expects a rejection with an `Error`. The answer to a write passes the contract too."

