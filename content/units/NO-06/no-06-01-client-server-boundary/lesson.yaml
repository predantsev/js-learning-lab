      en: "The project step of this unit is not written yet. According to the course plan, in it your React project gets its records from your local server, and everything it shows after a server restart — the records and the derived value (the wanted total, the count of due tasks, a habit's streak or the category totals) — is computed from the server's list, not from the client's copy."
