id: no-06-01-client-server-boundary
unit: NO-06
title:
  uk: "Межа клієнт/сервер і власність даних"
  en: "The client/server boundary and ownership"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Для кожного поля й похідного значення проєкту назвати, чи ним володіє сервер, чи клієнт лише тримає його копію."
    en: "Name, for each capstone field and derived value, whether the server owns it or the client only caches it."
  - uk: "Передбачити, що покажуть два клієнти після того, як один із них змінив запис, — до повторного запиту й після нього."
    en: "Predict what two clients show after one of them changes a record, before and after a refetch."
  - uk: "Пояснити, чому клієнт звіряє свою копію з відповіддю сервера, а не довіряє власній."
    en: "Explain why the client reconciles its cache with the server's response instead of trusting its own copy."
prerequisites: [no-04-01-rest-boundaries, re-06-05-cache-invalidation]
subskills:
  - { family: B-12, skill: "server source of truth vs cache", depth: intro }
glossary: [server-source-of-truth, data-ownership]
selfCheck: [predict-two-clients, planner-reconcile]

blocks:
  - id: who-owns-what
    kind: explanation
    title:
      uk: "Хто чим володіє"
      en: "Who owns what"
    body:
      uk: |
        Досі твій React-проєкт тримав записи сам: у фікстурах і в `localStorage`. Тепер є сервер, і в кожного запису з’являється **власник**. Розподіл [[data-ownership|власності даних]] для списку бажань виглядає так:

        | Що | Власник | У клієнта |
        |---|---|---|
        | записи: `name`, `price`, `acquired` | сервер | копія з останньої відповіді |
        | сума цін бажаних речей | ніхто не зберігає — рахується | рахується з копії, тож застаріває разом із нею |
        | обраний фільтр, текст у ще не збереженій формі | клієнт | оригінал — серверу до них байдуже |

        Сервер — [[server-source-of-truth|джерело істини]]: що він зберіг, те й правда. Клієнт тримає [[server-state|серверний стан]] лише як кеш — копію, яку можна швидко показати, але яка застаріває, щойно запис змінив хтось інший: другий клієнт, інша вкладка, сам сервер.

        Тому похідне значення клієнт ніколи не «підправляє» вручну. Він бере свіжий список від сервера й рахує заново.
      en: |
        Until now your React project kept the records itself: in fixtures and in `localStorage`. Now there is a server, and every record gets an **owner**. The [[data-ownership]] split for the wishlist looks like this:

        | What | Owner | On the client |
        |---|---|---|
        | records: `name`, `price`, `acquired` | the server | a copy from the last response |
        | the total price of wanted items | nobody stores it — it is computed | computed from the copy, so it goes stale with it |
        | the chosen filter, text in a form not saved yet | the client | the original — the server does not care about them |

        The server is the [[server-source-of-truth|source of truth]]: what it stored is what is true. The client keeps [[server-state]] only as a cache — a copy that is quick to show but goes stale as soon as someone else changes a record: a second client, another tab, the server itself.

        So the client never “adjusts” a derived value by hand. It takes a fresh list from the server and computes again.

  - id: two-clients-sequence
    kind: visual
    visual: sequence
    title:
      uk: "Два клієнти й один сервер у часі"
      en: "Two clients and one server over time"
    textEquivalent:
      uk: "Клієнти A і B завантажують список бажань із сервера, і в обох w-01 — бажане. Клієнт A оптимістично змінює свою копію й надсилає PATCH w-01 з acquired: true; сервер зберігає зміну й відповідає 200. Клієнт B нічого про це не знає й далі показує w-01 як бажане зі своєї копії. Лише коли B повторно запитує список, він отримує серверне значення. Далі A надсилає PATCH w-02 із ціною −45; сервер відхиляє його статусом 400, а в копії A ціна вже змінена. A повторно запитує список і повертається до серверної ціни 45."
      en: "Clients A and B load the wishlist from the server, and in both w-01 is wanted. Client A optimistically changes its copy and sends PATCH w-01 with acquired: true; the server stores the change and answers 200. Client B knows nothing about it and keeps showing w-01 as wanted from its copy. Only when B asks for the list again does it get the server's value. Then A sends PATCH w-02 with the price −45; the server rejects it with status 400, while A's copy already has the changed price. A asks for the list again and returns to the server's price 45."
    spec:
      actors:
        - { id: a, label: { uk: "Клієнт A", en: "Client A" } }
        - { id: server, label: { uk: "Сервер", en: "Server" } }
        - { id: b, label: { uk: "Клієнт B", en: "Client B" } }
      intro:
        uk: "Два клієнти одного сервера: A змінює записи, B лише читає."
        en: "Two clients of one server: A changes records, B only reads."
      messages:
        - from: a
          to: server
          label: "GET /v1/records"
          caption: { uk: "A завантажує список.", en: "A loads the list." }
        - from: server
          to: a
          kind: return
          label: "200 · w-01 acquired: false"
          caption: { uk: "У копії A запис w-01 — бажаний.", en: "In A's copy w-01 is wanted." }
        - from: b
          to: server
          label: "GET /v1/records"
          caption: { uk: "B завантажує той самий список.", en: "B loads the same list." }
        - from: server
          to: b
          kind: return
          label: "200 · w-01 acquired: false"
          caption: { uk: "Тепер копія є в обох клієнтів, і вони збігаються з сервером.", en: "Now both clients have a copy, and both match the server." }
        - from: a
          to: server
          label: "PATCH w-01 { acquired: true }"
          caption: { uk: "A спершу змінює власну копію, а тоді просить сервер.", en: "A first changes its own copy, then asks the server." }
          note: { uk: "копія A: w-01 отримано", en: "A's copy: w-01 acquired" }
        - from: server
          to: a
          kind: return
          label: "200"
          caption: { uk: "Сервер зберіг зміну. Відтепер правда — «отримано».", en: "The server stored the change. From now on the truth is “acquired”." }
        - from: b
          to: b
          kind: note
          label: { uk: "показує w-01 як бажане", en: "shows w-01 as wanted" }
          caption: { uk: "B нічого не знає про PATCH: його копія застаріла, і сервер сам її не виправить.", en: "B knows nothing about the PATCH: its copy is stale, and the server will not fix it by itself." }
        - from: b
          to: server
          label: "GET /v1/records"
          caption: { uk: "B повторно запитує список — після оновлення екрана чи повернення до нього.", en: "B asks for the list again — after a refresh or on returning to the screen." }
        - from: server
          to: b
          kind: return
          label: "200 · w-01 acquired: true"
          caption: { uk: "Лише відповідь сервера приносить B нове значення.", en: "Only the server's response brings B the new value." }
        - from: a
          to: server
          label: "PATCH w-02 { price: -45 }"
          caption: { uk: "A знову змінює копію наперед: ціна w-02 тепер −45.", en: "A again changes its copy in advance: the price of w-02 is now −45." }
        - from: server
          to: a
          kind: return
          label: "400 VALIDATION_FAILED"
          caption: { uk: "Сервер відхилив зміну. Його запис не змінився, а копія A — змінилася.", en: "The server rejected the change. Its record did not change, but A's copy did." }
        - from: a
          to: server
          label: "GET /v1/records"
          caption: { uk: "A повторно запитує список…", en: "A asks for the list again…" }
        - from: server
          to: a
          kind: return
          label: "200 · w-02 price: 45"
          caption: { uk: "…і повертається до правди сервера: ціна знову 45.", en: "…and returns to the server's truth: the price is 45 again." }

  - id: ledger
    kind: analogy
    body:
      uk: "Сервер — це книга обліку в банку, а кеш клієнта — твоя роздрукована виписка. Виписку зручно читати, але залишок на рахунку вирішує лише книга обліку. Якщо банк не провів платіж, виписка, на якій ти його вже відмітив, нічого не змінює."
      en: "The server is the bank's ledger, and the client's cache is your printed statement. A statement is handy to read, but only the ledger decides the balance. If the bank did not carry out a payment, a statement on which you already marked it changes nothing."
    limits:
      uk: "Виписка може застаріти, а банк — бути недоступним. Тож клієнт не вважає свою копію ні правдою, ні сміттям: він позначає застарілі дані як застарілі, показує їх, поки немає свіжих, і повторює запит пізніше. А ще, на відміну від виписки, копію клієнта можна оновити в будь-який момент одним запитом."
      en: "A statement can be out of date, and the bank can be unreachable. So the client treats its copy neither as the truth nor as worthless: it labels stale data as stale, shows it while there is nothing fresher and asks again later. And unlike a statement, the client's copy can be refreshed at any moment with one request."

  - id: predict-two-clients
    kind: prediction
    prompt:
      uk: "Клієнти A і B завантажили список бажань (у w-01 `acquired: false`). Потім A надіслав `PATCH` і отримав 200. `b.list()` відповідає з копії, якщо вона вже є; `b.refresh()` запитує сервер знову. Що надрукують два останні рядки коду?"
      en: "Clients A and B loaded the wishlist (w-01 has `acquired: false`). Then A sent a `PATCH` and got 200. `b.list()` answers from the copy when it already has one; `b.refresh()` asks the server again. What do the last two lines of code print?"
    code: |
      await a.list();
      await b.list();
      await a.update("w-01", { acquired: true }); // the server answers 200

      const cached = (await b.list()).find((record) => record.id === "w-01");
      console.log("B before:", cached.acquired);
      const fresh = (await b.refresh()).find((record) => record.id === "w-01");
      console.log("B after refresh:", fresh.acquired);
    runnable: false
    answer:
      type: choice
      options:
        - id: false-true
          text: { uk: "`B before: false`, потім `B after refresh: true`", en: "`B before: false`, then `B after refresh: true`" }
        - id: true-true
          text: { uk: "`B before: true`, потім `B after refresh: true`", en: "`B before: true`, then `B after refresh: true`" }
          why:
            uk: "Сервер не надсилає змін клієнтам сам: B отримує нове значення лише тоді, коли знову запитує сервер. До того в нього стара копія."
            en: "The server does not push changes to clients by itself: B gets the new value only when it asks the server again. Until then it has the old copy."
        - id: false-false
          text: { uk: "`B before: false`, потім `B after refresh: false`", en: "`B before: false`, then `B after refresh: false`" }
          why:
            uk: "Копія B — не «справжні дані», а лише остання відповідь. Повторний запит приносить те, що сервер зберіг після `PATCH` від A."
            en: "B's copy is not “the real data”, only the last response. A new request brings what the server stored after A's `PATCH`."
      correct: [false-true]
    explanation:
      uk: "Після `PATCH` правда змінилася на сервері, а не в копії B. B бачить її лише після нового запиту — до того його копія застаріла, хоч сама про це й не знає."
      en: "After the `PATCH` the truth changed on the server, not in B's copy. B sees it only after a new request — until then its copy is stale, although it does not know it."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: no-invalidation
        from: re-06-05-cache-invalidation
        prompt:
          uk: "React-клієнт кешує відповідь на запит списку справ. Людина позначає справу виконаною, `PATCH` успішний, а обробник нічого не робить із кешем. Що показує список?"
          en: "A React client caches the answer of the task list query. The person marks a task done, the `PATCH` succeeds, and the handler does nothing with the cache. What does the list show?"
        answer:
          type: choice
          options:
            - id: old-as-fresh
              text: { uk: "Старий список, ніби він свіжий", en: "The old list, as if it were fresh" }
            - id: new-list
              text: { uk: "Новий список: успішний `PATCH` оновлює кеш сам", en: "The new list: a successful `PATCH` updates the cache by itself" }
              why:
                uk: "Кеш не знає про мутацію, доки обробник не скасує чи не позначить застарілими записи, яких вона стосується."
                en: "The cache knows nothing about the mutation until the handler invalidates or marks stale the entries it affects."
            - id: loading
              text: { uk: "«Завантаження…», бо кеш порожніє після кожного запиту", en: "“Loading…”, because the cache empties after every request" }
              why:
                uk: "Кеш сам нічого не забуває: він тримає відповідь, доки код її не скасує."
                en: "A cache forgets nothing by itself: it keeps an answer until code invalidates it."
          correct: [old-as-fresh]
        explanation:
          uk: "Після мутації кешовані відповіді брешуть, тому обробник успішної мутації скасовує (або позначає застарілими) саме ті записи кешу, яких вона стосується. Але так виправляється лише кеш **цього** клієнта — інший клієнт дізнається про зміну лише з нового запиту."
          en: "After a mutation cached answers lie, so the handler of a successful mutation invalidates (or marks stale) exactly the cache entries it affects. But that fixes only **this** client's cache — another client learns about the change only from a new request."

  - id: two-clients
    kind: example
    runtime: isolated-node
    dir: two-clients
    entry: index.js
    capabilities: { network: loopback }
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      wanted: { uk: "бажане", en: "wanted" }
      acquired: { uk: "отримано", en: "acquired" }
      price: { uk: "ціна", en: "price" }
      total: { uk: "сума бажаних", en: "wanted total" }
      server: { uk: "сервер", en: "server" }
    title:
      uk: "Два клієнти з кешем і справжній сервер"
      en: "Two caching clients and a real server"
    body:
      uk: |
        `app.js` — API списку бажань: `GET /v1/records` і `PATCH /v1/records/:id`, ціна має бути цілим числом від 0. `client.js` — клієнт із копією списку: `list()` відповідає з копії, `refresh()` запитує сервер, `update()` спершу змінює копію ([[optimistic-update|оптимістичне оновлення]]), а потім надсилає `PATCH`. `index.js` запускає сервер і двох клієнтів, A та B.

        Натисни **Запустити** й порівняй рядки B з останнім рядком — тим, що зберігає сервер. Потім подивись на A після відповіді 400.
      en: |
        `app.js` is a wishlist API: `GET /v1/records` and `PATCH /v1/records/:id`, and a price must be a whole number from 0. `client.js` is a client with a copy of the list: `list()` answers from the copy, `refresh()` asks the server, `update()` first changes the copy (an [[optimistic-update]]) and then sends a `PATCH`. `index.js` starts the server and two clients, A and B.

        Press **Run** and compare B's lines with the last line — what the server stores. Then look at A after the 400 answer.
    tryIt:
      uk: |
        1. Після 400 копія A показує ціну −45, якої на сервері немає. У `client.js`, у `update`, перед `return response.status;` додай рядок `await load();` і запусти: після кожної мутації A бере список від сервера, і після відхиленого `PATCH` його рядок збігається з рядком сервера.
        2. B досі показує w-01 бажаним. В `index.js` у другому виклику `describe('B', await b.list());` заміни `b.list()` на `b.refresh()` і запусти: тепер B показує `отримано` й суму 285. Зміна в клієнті A не допомогла б: кеш B живе в іншому клієнті.
      en: |
        1. After the 400, A's copy shows the price −45, which the server does not have. In `client.js`, in `update`, add the line `await load();` before `return response.status;` and run: after every mutation A takes the list from the server, and after the rejected `PATCH` its line matches the server's line.
        2. B still shows w-01 as wanted. In `index.js`, in the second call `describe('B', await b.list());`, replace `b.list()` with `b.refresh()` and run: now B shows `acquired` and the total 285. A change in client A would not have helped: B's cache lives in another client.

  - id: reconcile-idea
    kind: explanation
    title:
      uk: "Звірка: правда сервера, а різницю — назвати"
      en: "Reconciling: the server's truth, with the difference named"
    body:
      uk: |
        Коли свіжий список прийшов, клієнт **звіряє** з ним свою копію. Показує він те, що відповів сервер, — завжди. Але різниця теж корисна: її можна показати людині.

        - запис є в обох, але якесь поле відрізняється — копія була **застаріла** («змінено на іншому пристрої»);
        - запис був у копії, а сервер його вже не має — його **видалено**;
        - запис є лише на сервері — він новий, і з копією тут нема чого звіряти.

        Застарілим запис робить будь-яке поле: не лише назва чи `done`, а й термін, що став `null`, чи пріоритет.
      en: |
        When a fresh list arrives, the client **reconciles** its copy with it. What it shows is what the server answered — always. But the difference is useful too: it can be shown to the person.

        - a record is in both, but some field differs — the copy was **stale** (“changed on another device”);
        - a record was in the copy, and the server no longer has it — it was **deleted**;
        - a record is only on the server — it is new, and there is no copy to compare it with.

        Any field makes a record stale: not only the title or `done`, but also a due date that became `null`, or the priority.

  - id: planner-reconcile
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: planner-reconcile
    entry: index.js
    editable: [reconcile.js]
    capabilities: { network: loopback }
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      bike: { uk: "Накачати колеса велосипеда", en: "Pump up the bike tyres" }
      shown: { uk: "Показуємо", en: "Shown" }
      stale: { uk: "Застарілі в копії", en: "Stale in the copy" }
      deleted: { uk: "Видалені на сервері", en: "Deleted on the server" }
    title:
      uk: "Звірка копії планувальника із сервером"
      en: "Reconciling the planner's copy with the server"
    instructions:
      uk: |
        `cached.js` — копія справ, яку клієнт зберіг учора; `app.js` — сервер, що віддає сьогоднішній список. Обидва лише для читання. Допиши в `reconcile.js` функцію `reconcile(cache, serverList)`, яка повертає `{ records, stale, deleted }`:

        - `records` — записи, які показувати: список сервера;
        - `stale` — `id` записів копії, чия серверна версія відрізняється хоча б одним полем, у порядку копії;
        - `deleted` — `id` записів копії, яких на сервері вже немає, у порядку копії;
        - запис, що є лише на сервері, не потрапляє ні в `stale`, ні в `deleted`;
        - масив `cache` і його записи не змінюються.

        **Запустити** друкує, що показати й що змінилося. **Перевірити** викликає `reconcile` зі своїми даними.
      en: |
        `cached.js` is the copy of tasks the client saved yesterday; `app.js` is the server that answers today's list. Both are read-only. In `reconcile.js` finish `reconcile(cache, serverList)`, which returns `{ records, stale, deleted }`:

        - `records` — the records to show: the server's list;
        - `stale` — the `id`s of cached records whose server version differs in at least one field, in the order of the copy;
        - `deleted` — the `id`s of cached records the server no longer has, in the order of the copy;
        - a record that exists only on the server goes into neither `stale` nor `deleted`;
        - the `cache` array and its records do not change.

        **Run** prints what to show and what changed. **Check** calls `reconcile` with its own data.
    testTitles:
      "records are the server list, not the cached copy":
        uk: "`records` — список сервера, а не копія"
        en: "`records` is the server's list, not the cached copy"
      "stale lists the cached ids whose server version changed":
        uk: "`stale` містить `id` записів, чия серверна версія змінилася"
        en: "`stale` lists the cached `id`s whose server version changed"
      "a change in any field counts, also null instead of a date":
        uk: "Рахується зміна будь-якого поля, також `null` замість дати"
        en: "A change in any field counts, also `null` instead of a date"
      "deleted lists the cached ids the server no longer has":
        uk: "`deleted` містить `id` записів, яких на сервері вже немає"
        en: "`deleted` lists the cached `id`s the server no longer has"
      "a record that is new on the server is neither stale nor deleted":
        uk: "Новий на сервері запис — ні в `stale`, ні в `deleted`"
        en: "A record that is new on the server is neither in `stale` nor in `deleted`"
      "the cached copy stays unchanged":
        uk: "Копія `cache` лишається без змін"
        en: "The `cache` copy stays unchanged"
    hints:
      nudge:
        uk: "Іди по записах **копії**: для кожного знайди запис сервера з тим самим `id`. Знайшовся чи ні — і якщо знайшовся, чи однакові поля?"
        en: "Walk the records of the **copy**: for each, find the server's record with the same `id`. Is there one or not — and if there is, are the fields the same?"
      explanation:
        uk: "Пошук за `id` зручно робити через `Map`, побудований зі списку сервера. Щоб порівняти «всі поля», візьми назви полів обох записів і перевір, що для кожної значення однакові (`!==` для тексту, чисел, `true`/`false` і `null`). Для витрат це виглядало б як перевірка, чи `amountMinor`, `label`, `date` і `category` однакові в обох версіях `e-03`. Нічого не присвоюй записам копії — нові значення вже є в списку сервера."
        en: "A `Map` built from the server's list makes the search by `id` easy. To compare “every field”, take the field names of both records and check that each has the same value (`!==` works for text, numbers, `true`/`false` and `null`). For expenses it would look like checking whether `amountMinor`, `label`, `date` and `category` are equal in both versions of `e-03`. Assign nothing to the cached records — the new values are already in the server's list."
    solutionNote:
      uk: "Сервер — джерело істини, тож `records` — це його список. Копія потрібна лише для того, щоб назвати різницю: що застаріло й що видалено. Нові на сервері записи просто з’являються серед `records`. А копію ніхто не «ремонтує» на місці: її замінює свіжий список."
      en: "The server is the source of truth, so `records` is its list. The copy is needed only to name the difference: what was stale and what was deleted. Records new on the server simply appear among `records`. And nobody “repairs” the copy in place: the fresh list replaces it."
    feedback:
      - when: { test: "records are the server list, not the cached copy" }
        message:
          uk: "Ця перевірка чекає в `records` рівно список сервера — з новими значеннями полів, а не записи копії."
          en: "This check expects `records` to be exactly the server's list — with the new field values, not the cached records."
      - when: { test: "stale lists the cached ids whose server version changed" }
        message:
          uk: "Ця перевірка чекає `[\"t-1\", \"t-3\"]`: у `t-1` змінилося `done`, у `t-3` — `title`, а `t-2` однаковий."
          en: "This check expects `[\"t-1\", \"t-3\"]`: `done` changed in `t-1`, `title` in `t-3`, and `t-2` is the same."
      - when: { test: "a change in any field counts, also null instead of a date" }
        message:
          uk: "Ця перевірка змінює лише `dueDate` (на `null`) і лише `priority` й чекає обидва `id` у `stale`. Порівнюй усі поля, а не кілька обраних."
          en: "This check changes only `dueDate` (to `null`) and only `priority` and expects both `id`s in `stale`. Compare every field, not a chosen few."
      - when: { test: "deleted lists the cached ids the server no longer has" }
        message:
          uk: "Ця перевірка лишає на сервері тільки `t-2` і чекає `deleted` рівно `[\"t-1\", \"t-3\"]`, а `stale` — `[]`. Видалене знаходиться, коли йдеш по записах копії."
          en: "This check leaves only `t-2` on the server and expects `deleted` to be exactly `[\"t-1\", \"t-3\"]` and `stale` to be `[]`. Deleted records are found by walking the copy's records."
      - when: { test: "a record that is new on the server is neither stale nor deleted" }
        message:
          uk: "Ця перевірка додає на сервер `t-9`, якого немає в копії, і чекає порожні `stale` і `deleted`, а `t-9` — серед `records`."
          en: "This check adds `t-9`, which is not in the copy, to the server and expects empty `stale` and `deleted`, with `t-9` among the `records`."
      - when: { test: "the cached copy stays unchanged" }
        message:
          uk: "Ця перевірка порівнює `cache` до й після виклику й чекає, що він не змінився. Не присвоюй нових значень записам копії."
          en: "This check compares `cache` before and after the call and expects it unchanged. Do not assign new values to the cached records."

