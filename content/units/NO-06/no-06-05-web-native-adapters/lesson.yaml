id: no-06-05-web-native-adapters
unit: NO-06
title:
  uk: "Веб- і нативні адаптери"
  en: "Web and native adapters"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Написати для кожного клієнта (веб, нативний) адаптер платформи, що дає спільному шару даних базову адресу, сховище й стан мережі."
    en: "Write one platform adapter per client (web, native) that supplies the base URL, storage and network status to the shared data layer."
  - uk: "Обрати адресу сервера для кожної цілі (браузер на тому самому комп’ютері, псевдонім хоста в емуляторі, фізичний пристрій у локальній мережі) і назвати ціну прив’язки не до loopback."
    en: "Choose the server address each target needs (browser on the same machine, emulator host alias, physical device on the LAN) and state the exposure trade-off of a non-loopback bind."
  - uk: "Записати нативну перевірку інтеграції як не виконану, якщо нативних інструментів немає, — ніколи як пройдену."
    en: "Record the native integration check as unperformed when native tooling is absent, never as passed."
prerequisites: [no-06-04-shared-typed-contracts, rn-06-02-emulator-device-addressing]
subskills:
  - { family: B-12, skill: "web/native adapters", depth: intro }
glossary: [transport-adapter]
selfCheck: [predict-reachable, base-url]

blocks:
  - id: what-differs
    kind: explanation
    title:
      uk: "Що в клієнтах різне, а що спільне"
      en: "What differs between the clients, and what is shared"
    body:
      uk: |
        Вебклієнт і нативний компаньйон роблять те саме: читають записи з API, зберігають останню копію, показують стан мережі. Цей код — **спільний шар даних**. Різняться лише три речі, і їх дає [[transport-adapter|адаптер платформи]]:

        | | Веб | Нативний застосунок |
        |---|---|---|
        | `baseUrl` | `http://127.0.0.1:7330` з конфігурації | залежить від цілі — див. нижче |
        | `storage` | обгортка над `localStorage` | обгортка над `AsyncStorage` |
        | `isOnline()` | `navigator.onLine` | `getNetworkStateAsync()` з `expo-network` |

        Адаптер має одну форму для обох: `{ baseUrl, storage: { get, set }, isOnline() }`, усі методи асинхронні. Спільний шар викликає лише їх і не знає, на якій платформі працює.

        А **адреса** — те, що ламається найчастіше. Як у розділі RN-06, `localhost` усередині Android-емулятора — це сам емулятор; до loopback твого комп’ютера він доходить через [[emulator-host-alias|псевдонім]] `10.0.2.2`. iOS-симулятор ділить мережу з Mac, тож для нього підходить `127.0.0.1`.
      en: |
        The web client and the native companion do the same thing: read records from the API, keep the last copy, show the network status. That code is the **shared data layer**. Only three things differ, and a [[transport-adapter|platform adapter]] supplies them:

        | | Web | Native app |
        |---|---|---|
        | `baseUrl` | `http://127.0.0.1:7330` from configuration | depends on the target — see below |
        | `storage` | a wrapper around `localStorage` | a wrapper around `AsyncStorage` |
        | `isOnline()` | `navigator.onLine` | `getNetworkStateAsync()` from `expo-network` |

        The adapter has one shape for both: `{ baseUrl, storage: { get, set }, isOnline() }`, all methods asynchronous. The shared layer calls only these and does not know which platform it runs on.

        And the **address** is what breaks most often. As in unit RN-06, `localhost` inside an Android emulator is the emulator itself; it reaches your computer's loopback through the [[emulator-host-alias|alias]] `10.0.2.2`. The iOS simulator shares the Mac's network, so `127.0.0.1` works for it.

  - id: adapters-diagram
    kind: visual
    visual: diagram
    title:
      uk: "Один шар даних, два адаптери, три адреси"
      en: "One data layer, two adapters, three addresses"
    textEquivalent:
      uk: "Спільний шар даних отримує адаптер. Вебадаптер веде до сервера на 127.0.0.1:7330 — браузер працює на тому самому комп’ютері. Нативний адаптер для Android-емулятора веде до 10.0.2.2:7330 — псевдоніма loopback комп’ютера, а для iOS-симулятора — до 127.0.0.1:7330. Телефон у Wi-Fi може дійти до сервера лише за LAN-адресою 192.168.1.20:7330 і лише тоді, коли сервер явно й тимчасово прив’язаний до 0.0.0.0, — а тоді його бачить кожен пристрій у мережі."
      en: "The shared data layer receives an adapter. The web adapter leads to the server at 127.0.0.1:7330 — the browser runs on the same computer. The native adapter for the Android emulator leads to 10.0.2.2:7330, the alias of the computer's loopback, and for the iOS simulator to 127.0.0.1:7330. A phone on Wi-Fi can reach the server only through the LAN address 192.168.1.20:7330, and only when the server is explicitly and temporarily bound to 0.0.0.0 — and then every device on the network sees it."
    spec:
      layout: grid
      nodes:
        - { id: layer, label: { uk: "спільний шар даних", en: "shared data layer" }, w: 170, col: 0, row: 0 }
        - { id: server, label: { uk: "API :7330", en: "API :7330" }, shape: cylinder, w: 150, col: 1, row: 0 }
        - { id: web, label: { uk: "вебадаптер", en: "web adapter" }, w: 170, col: 0, row: 1 }
        - { id: native, label: { uk: "нативний адаптер", en: "native adapter" }, w: 170, col: 0, row: 2 }
        - { id: lan, label: "0.0.0.0 bind", shape: note, w: 150, col: 1, row: 2 }
      edges:
        - { id: layer-web, from: layer, to: web, kind: dashed }
        - { id: layer-native, from: layer, to: native, kind: dashed }
        - { id: web-server, from: web, to: server, label: "127.0.0.1" }
        - { id: native-server, from: native, to: server, label: "10.0.2.2" }
        - { id: lan-server, from: lan, to: server, kind: dashed }
      hidden: [lan, lan-server]
      steps:
        - caption:
            uk: "Спільний шар даних не знає платформи: адресу, сховище й стан мережі він бере з адаптера."
            en: "The shared data layer does not know the platform: it takes the address, the storage and the network status from the adapter."
          highlight: [layer, layer-web, layer-native]
        - caption:
            uk: "Вебадаптер: браузер працює на тому самому комп’ютері, тож `127.0.0.1:7330` — це твій сервер."
            en: "The web adapter: the browser runs on the same computer, so `127.0.0.1:7330` is your server."
          highlight: [web, web-server, server]
        - caption:
            uk: "Нативний адаптер в Android-емуляторі: `10.0.2.2` — псевдонім loopback комп’ютера. Для iOS-симулятора той самий адаптер дав би `127.0.0.1`."
            en: "The native adapter in the Android emulator: `10.0.2.2` is the alias of the computer's loopback. For the iOS simulator the same adapter would give `127.0.0.1`."
          highlight: [native, native-server, server]
          annotate:
            - { id: native, text: { uk: "iOS-симулятор: 127.0.0.1", en: "iOS simulator: 127.0.0.1" } }
        - caption:
            uk: "Телефон у Wi-Fi дійде лише за LAN-адресою і лише коли сервер явно прив’язаний до `0.0.0.0`. Тоді його бачить кожен пристрій у мережі — роби це лише на час перевірки."
            en: "A phone on Wi-Fi gets through only via the LAN address, and only when the server is explicitly bound to `0.0.0.0`. Then every device on the network sees it — do it only for the duration of the check."
          show: [lan, lan-server]
          highlight: [lan, lan-server, server]
          annotate:
            - { id: lan, text: "192.168.1.20:7330" }

  - id: predict-reachable
    kind: prediction
    prompt:
      uk: "API слухає лише `127.0.0.1:7330` на твоєму комп’ютері. Які з цих запитів до нього дійдуть? Обери всі."
      en: "The API listens only on `127.0.0.1:7330` on your computer. Which of these requests reach it? Pick all."
    answer:
      type: multi
      options:
        - id: browser
          text: { uk: "Браузер на цьому комп’ютері → `http://127.0.0.1:7330`", en: "A browser on this computer → `http://127.0.0.1:7330`" }
        - id: emulator-alias
          text: { uk: "Android-емулятор → `http://10.0.2.2:7330`", en: "An Android emulator → `http://10.0.2.2:7330`" }
        - id: simulator
          text: { uk: "iOS-симулятор на цьому Mac → `http://127.0.0.1:7330`", en: "An iOS simulator on this Mac → `http://127.0.0.1:7330`" }
        - id: emulator-localhost
          text: { uk: "Android-емулятор → `http://localhost:7330`", en: "An Android emulator → `http://localhost:7330`" }
          why:
            uk: "Усередині емулятора `localhost` — це сам емулятор. До комп’ютера він доходить через `10.0.2.2`."
            en: "Inside the emulator `localhost` is the emulator itself. It reaches the computer through `10.0.2.2`."
        - id: phone-lan
          text: { uk: "Телефон у Wi-Fi → `http://192.168.1.20:7330`", en: "A phone on Wi-Fi → `http://192.168.1.20:7330`" }
          why:
            uk: "Сервер, прив’язаний до loopback, не приймає з’єднань із мережі. Телефону потрібна явна тимчасова прив’язка до `0.0.0.0`."
            en: "A server bound to loopback accepts no connections from the network. The phone needs an explicit, temporary bind to `0.0.0.0`."
      correct: [browser, emulator-alias, simulator]
    explanation:
      uk: "Емулятор і симулятор працюють на твоєму комп’ютері й доходять до його loopback — кожен своєю адресою. Справжній телефон — інша машина: для нього потрібна LAN-адреса й сервер, що слухає мережу."
      en: "The emulator and the simulator run on your computer and reach its loopback — each through its own address. A real phone is another machine: it needs the LAN address and a server that listens on the network."

  - id: two-adapters
    kind: example
    runtime: isolated-node
    dir: two-adapters
    entry: index.js
    capabilities: { network: loopback }
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      fresh: { uk: "свіжі дані", en: "fresh data" }
      stale: { uk: "застаріла копія", en: "stale copy" }
      due: { uk: "до терміну 2026-03-01:", en: "due by 2026-03-01:" }
    title:
      uk: "Спільний шар даних із двома адаптерами"
      en: "A shared data layer with two adapters"
    body:
      uk: |
        `data-layer.js` — спільний шар даних: він питає адаптер, чи є мережа, читає `/v1/records`, зберігає копію в сховищі адаптера, а при збої віддає збережену копію, позначену застарілою. `adapters.js` — **заміни** двох адаптерів для цього запуску: сховище в `Map` замість `localStorage` і `AsyncStorage`, стан мережі — прапорець замість `navigator.onLine` і `getNetworkStateAsync()`. Усі відмінності описано в коментарі на початку файлу. `index.js` запускає API справ і проганяє той самий шар даних з обома адаптерами.

        Натисни **Запустити**: обидва адаптери отримали свіжі дані, і сервер записав два запити.
      en: |
        `data-layer.js` is the shared data layer: it asks the adapter whether there is a network, reads `/v1/records`, keeps a copy in the adapter's storage and on a failure returns the saved copy marked stale. `adapters.js` holds **stand-ins** for the two adapters in this run: storage in a `Map` instead of `localStorage` and `AsyncStorage`, the network status as a flag instead of `navigator.onLine` and `getNetworkStateAsync()`. Every difference is described in the comment at the top of the file. `index.js` starts the tasks API and runs the same data layer with both adapters.

        Press **Run**: both adapters got fresh data, and the server logged two requests.
    tryIt:
      uk: |
        1. В `index.js` заміни `target: 'ios-simulator'` на `target: 'android-emulator'` і запусти. Нативний адаптер тепер іде на `10.0.2.2` — адресу, яка має сенс лише всередині емулятора. Тут, на комп’ютері, запит до сервера не доходить (у журналі `[api]` лише один запит), і шар даних повертає застарілу копію з причиною `unreachable`. `data-layer.js` ти не чіпав.
        2. Поверни `ios-simulator`. Додай вебадаптеру `online: false` (`createWebAdapter({ baseUrl: …, online: false })`) і запусти: вебклієнт навіть не надсилає запиту й показує копію з причиною `offline`.
      en: |
        1. In `index.js` replace `target: 'ios-simulator'` with `target: 'android-emulator'` and run. The native adapter now goes to `10.0.2.2` — an address that makes sense only inside the emulator. Here, on the computer, the request does not reach the server (the `[api]` log has only one request), and the data layer returns a stale copy with the reason `unreachable`. You did not touch `data-layer.js`.
        2. Put `ios-simulator` back. Give the web adapter `online: false` (`createWebAdapter({ baseUrl: …, online: false })`) and run: the web client does not even send a request and shows the copy with the reason `offline`.

  - id: exposure
    kind: explanation
    title:
      uk: "Фізичний телефон: прив’язка до мережі — свідоме й тимчасове рішення"
      en: "A physical phone: binding to the network is a deliberate, temporary decision"
    body:
      uk: |
        Твій сервер за замовчуванням слухає `127.0.0.1` — його бачить лише цей комп’ютер. Щоб телефон у Wi-Fi дістався до нього, сервер треба запустити з прив’язкою до `0.0.0.0` і дати телефону LAN-адресу комп’ютера (`192.168.1.20`). Але тоді API бачить **кожен** пристрій у мережі — у кав’ярні теж. Тож:

        - прив’язуй до мережі лише на час перевірки й одразу повертай `127.0.0.1`;
        - функція, що обирає адресу, **відмовляється** дати адресу для пристрою, поки сервер слухає loopback: краще явна помилка, ніж запит, що мовчки зависає;
        - Android-телефон на кабелі обходиться без цього: `adb reverse tcp:7330 tcp:7330` прокидає порт, і для нього підходить `127.0.0.1`;
        - правила відкритого HTTP з уроку rn-06-05 діють і тут.

        І ще одне правило: якщо нативних інструментів немає, нативну перевірку інтеграції записують як **не виконану**, з причиною. «Вебклієнт працює» не означає, що працює нативний: у нього інша адреса, інше сховище й інший стек мережі.
      en: |
        Your server listens on `127.0.0.1` by default — only this computer sees it. For a phone on Wi-Fi to reach it, the server has to be started with a bind to `0.0.0.0`, and the phone needs the computer's LAN address (`192.168.1.20`). But then **every** device on the network sees the API — in a café too. So:

        - bind to the network only for the duration of the check, and return to `127.0.0.1` at once;
        - the function that picks the address **refuses** to give an address for a device while the server listens on loopback: an explicit error is better than a request that silently hangs;
        - an Android phone on a cable manages without it: `adb reverse tcp:7330 tcp:7330` forwards the port, and `127.0.0.1` works for it;
        - the plain-HTTP rules of lesson rn-06-05 apply here too.

        And one more rule: when there is no native tooling, the native integration check is recorded as **not performed**, with the reason. “The web client works” does not mean the native one works: it has another address, another storage and another network stack.

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: adb-reverse
        from: rn-06-02-emulator-device-addressing
        prompt:
          uk: "Android-телефон підключено кабелем, сервіс слухає лише loopback комп’ютера на порту 7310. Що дає команда `adb reverse tcp:7310 tcp:7310`?"
          en: "An Android phone is connected by cable, and the service listens only on the computer's loopback on port 7310. What does the command `adb reverse tcp:7310 tcp:7310` give?"
        answer:
          type: choice
          options:
            - id: forward
              text: { uk: "Запити телефона на його `127.0.0.1:7310` доходять до порту 7310 комп’ютера", en: "The phone's requests to its own `127.0.0.1:7310` reach port 7310 of the computer" }
            - id: lan
              text: { uk: "Сервіс починає слухати всю локальну мережу", en: "The service starts listening on the whole local network" }
              why:
                uk: "`adb reverse` нічого не змінює в сервісі: він і далі слухає лише loopback. Порт прокидається через кабель."
                en: "`adb reverse` changes nothing in the service: it still listens on loopback only. The port is forwarded through the cable."
            - id: ios-too
              text: { uk: "Те саме для iPhone на кабелі", en: "The same for an iPhone on a cable" }
              why:
                uk: "`adb` — інструмент Android. iPhone, навіть на кабелі, іде через LAN-адресу."
                en: "`adb` is an Android tool. An iPhone, even on a cable, goes through the LAN address."
          correct: [forward]
        explanation:
          uk: "Тому для Android-телефона на кабелі не треба відкривати сервер у мережу. Для твого API той самий прийом — `adb reverse tcp:7330 tcp:7330`."
          en: "So an Android phone on a cable does not need the server opened to the network. For your API the same trick is `adb reverse tcp:7330 tcp:7330`."

  - id: base-url
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: base-url
    entry: index.js
    editable: [base-url.js]
    strings:
      loopback: { uk: "Сервер слухає 127.0.0.1:", en: "The server listens on 127.0.0.1:" }
      lanBind: { uk: "Сервер тимчасово слухає 0.0.0.0:", en: "The server temporarily listens on 0.0.0.0:" }
    title:
      uk: "Адреса сервера для кожної цілі"
      en: "The server address for every target"
    instructions:
      uk: |
        Допиши в `base-url.js` функцію `resolveBaseUrl(target, config)`, де `config` — `{ port, bindHost, lanAddress }`. Вона повертає базову адресу API без скісної риски в кінці:

        - `'web'` і `'ios-simulator'` — `http://127.0.0.1:<port>`;
        - `'android-emulator'` — `http://10.0.2.2:<port>`;
        - `'device'` (телефон у Wi-Fi) — `http://<lanAddress>:<port>`, але лише коли сервер слухає мережу: якщо `bindHost` — `'127.0.0.1'`, `'localhost'` чи `'::1'`, функція **кидає** `Error`; якщо `lanAddress` немає — теж кидає;
        - будь-яка інша ціль (наприклад, з одруківкою) — кидає `Error`, а не вгадує;
        - порт завжди береться з `config.port`.

        **Запустити** друкує адреси всіх цілей для двох конфігурацій сервера.
      en: |
        In `base-url.js` finish `resolveBaseUrl(target, config)`, where `config` is `{ port, bindHost, lanAddress }`. It returns the API's base URL without a trailing slash:

        - `'web'` and `'ios-simulator'` — `http://127.0.0.1:<port>`;
        - `'android-emulator'` — `http://10.0.2.2:<port>`;
        - `'device'` (a phone on Wi-Fi) — `http://<lanAddress>:<port>`, but only when the server listens on the network: if `bindHost` is `'127.0.0.1'`, `'localhost'` or `'::1'`, the function **throws** an `Error`; if there is no `lanAddress`, it throws too;
        - any other target (for example, with a typo) — throws an `Error` instead of guessing;
        - the port always comes from `config.port`.

        **Run** prints the addresses of all targets for two server configurations.
    testTitles:
      "the browser and the iOS simulator use 127.0.0.1 with the configured port":
        uk: "Браузер та iOS-симулятор використовують `127.0.0.1` з портом із конфігурації"
        en: "The browser and the iOS simulator use `127.0.0.1` with the configured port"
      "the Android emulator uses 10.0.2.2":
        uk: "Android-емулятор використовує `10.0.2.2`"
        en: "The Android emulator uses `10.0.2.2`"
      "a device throws while the server is bound to loopback":
        uk: "Для пристрою — помилка, поки сервер прив’язаний до loopback"
        en: "A device throws while the server is bound to loopback"
      "a device uses the LAN address once the server is bound to the network":
        uk: "Пристрій використовує LAN-адресу, коли сервер прив’язаний до мережі"
        en: "A device uses the LAN address once the server is bound to the network"
      "a device throws when the LAN address is missing":
        uk: "Для пристрою — помилка, коли немає LAN-адреси"
        en: "A device throws when the LAN address is missing"
      "an unknown target throws instead of guessing":
        uk: "Невідома ціль дає помилку, а не здогадку"
        en: "An unknown target throws instead of guessing"
    hints:
      nudge:
        uk: "Почни з таблиці цілей у поясненні уроку. Особлива лише ціль `'device'`: до неї є дві умови, за яких адреси немає взагалі."
        en: "Start from the table of targets in the lesson's explanation. Only the `'device'` target is special: it has two conditions under which there is no address at all."
      explanation:
        uk: "Кожна ціль — своя гілка (`if` чи `switch`), і остання гілка, для всього іншого, кидає `Error`. У гілці пристрою спершу перевір `bindHost` — чи це одна з loopback-адрес (зручно тримати їх у масиві й перевіряти `includes`), потім наявність `lanAddress`, і лише тоді збирай адресу з шаблонного рядка. Для сервісу на порту 9000 у емуляторі вийшло б `http://10.0.2.2:9000`."
        en: "Each target is its own branch (`if` or `switch`), and the last branch, for everything else, throws an `Error`. In the device branch first check `bindHost` — whether it is one of the loopback addresses (an array with `includes` is handy), then whether `lanAddress` is there, and only then build the address with a template string. For a service on port 9000 in the emulator it would come out as `http://10.0.2.2:9000`."
    solutionNote:
      uk: "Адреса вирішується в одному місці — у функції, яку викликає адаптер. Помилка для пристрою при прив’язці до loopback перетворює тихе зависання запиту на зрозуміле повідомлення й нагадує, що відкриття сервера в мережу — окреме свідоме рішення."
      en: "The address is decided in one place — in the function the adapter calls. The error for a device under a loopback bind turns a silently hanging request into a clear message, and reminds you that opening the server to the network is a separate, deliberate decision."
    feedback:
      - when: { test: "the browser and the iOS simulator use 127.0.0.1 with the configured port" }
        message:
          uk: "Ця перевірка чекає `http://127.0.0.1:7331` для `web` та `ios-simulator` з портом 7331 і `http://127.0.0.1:8100` з портом 8100. Бери порт із `config.port`."
          en: "This check expects `http://127.0.0.1:7331` for `web` and `ios-simulator` with port 7331, and `http://127.0.0.1:8100` with port 8100. Take the port from `config.port`."
      - when: { test: "the Android emulator uses 10.0.2.2" }
        message:
          uk: "Ця перевірка чекає `http://10.0.2.2:7331`. Усередині емулятора `127.0.0.1` — сам емулятор."
          en: "This check expects `http://10.0.2.2:7331`. Inside the emulator `127.0.0.1` is the emulator itself."
      - when: { test: "a device throws while the server is bound to loopback" }
        message:
          uk: "Ця перевірка викликає `'device'` з `bindHost` `'127.0.0.1'` і `'localhost'` і чекає, що функція кине `Error`."
          en: "This check calls `'device'` with `bindHost` `'127.0.0.1'` and `'localhost'` and expects the function to throw an `Error`."
      - when: { test: "a device uses the LAN address once the server is bound to the network" }
        message:
          uk: "Ця перевірка чекає `http://192.168.1.20:7331` для `'device'`, коли `bindHost` — `'0.0.0.0'`."
          en: "This check expects `http://192.168.1.20:7331` for `'device'` when `bindHost` is `'0.0.0.0'`."
      - when: { test: "a device throws when the LAN address is missing" }
        message:
          uk: "Ця перевірка викликає `'device'` з `bindHost` `'0.0.0.0'` без `lanAddress` і чекає `Error`, а не адресу на кшталт `http://undefined:7331`."
          en: "This check calls `'device'` with `bindHost` `'0.0.0.0'` and no `lanAddress` and expects an `Error`, not an address like `http://undefined:7331`."
      - when: { test: "an unknown target throws instead of guessing" }
        message:
          uk: "Ця перевірка викликає цілі `'android'`, `'iphone'` і `''` і чекає `Error` для кожної."
          en: "This check calls the targets `'android'`, `'iphone'` and `''` and expects an `Error` for each."

  - id: native-request
    kind: local-task
    runtime: local-native
    title:
      uk: "Необов’язково: один справжній запит нативного компаньйона до твого сервера"
      en: "Optional: one real request from the native companion to your server"
    intro:
      uk: |
        Цей крок — лише якщо в тебе є нативні інструменти й нативний компаньйон із кроку проєкту RN-06 (`~/js-course/<project>-native` з файлом `src/devConfig.ts`). Немає — натисни кнопку «немає емулятора чи пристрою» нижче: перевірку буде записано як **не виконану**, і це чесний результат, а не провал.

        Ти тимчасово спрямуєш адресу з `devConfig.ts` на API звичок з уроку про CORS (`~/js-course/no06-cors`, порт 7330) і побачиш у журналі API рядок із запитом застосунку. Шляхи API звичок (`/v1/records`) інші, ніж у навчального сервісу (`/records/<project>`), тож застосунок отримає 404 — це нормально: доказом тут є сам рядок у журналі, тобто адреса працює.

        **Під час підготовки уроку цей крок не виконувався**: емулятора, симулятора й телефона не було. Кроки складено з уроку rn-06-02 і файлу `devConfig.ts` кроку RN-06; рядок журналу нижче — очікувана форма, а не записаний вивід.
      en: |
        Do this step only if you have native tooling and the native companion from the RN-06 project step (`~/js-course/<project>-native` with the file `src/devConfig.ts`). If not, press the “no emulator or device” button below: the check is recorded as **not performed**, and that is an honest result, not a failure.

        You temporarily point the address in `devConfig.ts` at the habits API from the CORS lesson (`~/js-course/no06-cors`, port 7330) and see a line with the app's request in the API log. The habits API's paths (`/v1/records`) differ from the course service's (`/records/<project>`), so the app gets 404 — that is fine: the proof here is the log line itself, that is, the address works.

        **This step was not run while preparing the lesson**: there was no emulator, simulator or phone. The steps were put together from lesson rn-06-02 and the `devConfig.ts` file of the RN-06 step; the log line below is the expected form, not recorded output.
    tools:
      - { name: "Node.js", version: { uk: "22.13 або новіший", en: "22.13 or newer" } }
      - { name: { uk: "Нативна ціль з розділу RN", en: "The native target from the RN stage" }, version: { uk: "Android-емулятор, iOS-симулятор або Android-телефон на кабелі", en: "an Android emulator, an iOS simulator or an Android phone on a cable" } }
    steps:
      - text:
          uk: "Запусти API звичок і залиш вікно відкритим. (Немає теки `no06-cors` — зроби кроки 1–2 завдання з уроку про CORS.)"
          en: "Start the habits API and leave the window open. (No `no06-cors` folder — do steps 1–2 of the task in the CORS lesson.)"
        command: |
          cd ~/js-course/no06-cors
          node api.mjs
      - text:
          uk: "Лише для Android-телефона на кабелі: у другому вікні прокинь порт."
          en: "Only for an Android phone on a cable: forward the port in a second window."
        command: "adb reverse tcp:7330 tcp:7330"
      - text:
          uk: "У нативному проєкті, у `src/devConfig.ts`, запам’ятай значення `MOCK_PORT` (було 7310) і тимчасово заміни його на `7330`. `TARGET` лиши своїм. Збережи файл і перезавантаж застосунок на цілі."
          en: "In the native project, in `src/devConfig.ts`, note the value of `MOCK_PORT` (it was 7310) and temporarily replace it with `7330`. Keep your `TARGET`. Save the file and reload the app on the target."
      - text:
          uk: "Відкрий екран, що завантажує записи з сервісу, і подивись у вікно API."
          en: "Open the screen that loads records from the service and look at the API window."
        expect:
          uk: "Рядок на кшталт `[api] GET /records/wishlist… — Origin: …` (шлях і заголовок `Origin` не перевірено). Якщо рядка немає — адреса цілі не доходить до комп’ютера: звір `TARGET` з таблицею уроку."
          en: "A line like `[api] GET /records/wishlist… — Origin: …` (the path and the `Origin` header were not checked). If there is no line, the target's address does not reach the computer: compare `TARGET` with the lesson's table."
      - text:
          uk: "Поверни `MOCK_PORT` на 7310, збережи й зупини API (Ctrl+C)."
          en: "Put `MOCK_PORT` back to 7310, save and stop the API (Ctrl+C)."
    verify:
      - id: log-line
        text:
          uk: "Я бачив у журналі API запит від нативного застосунку."
          en: "I saw a request from the native app in the API log."
      - id: config-restored
        text:
          uk: "`MOCK_PORT` знову 7310, а API зупинено."
          en: "`MOCK_PORT` is 7310 again, and the API is stopped."
    troubleshooting:
      - problem:
          uk: "На Android-емуляторі застосунок показує помилку мережі, а в журналі API нічого немає."
          en: "On an Android emulator the app shows a network error, and the API log has nothing."
        fix:
          uk: "Перевір, що `TARGET` — `\"android-emulator\"` (адреса `10.0.2.2`), а не `127.0.0.1`. Правила відкритого HTTP з уроку rn-06-05 теж можуть зупинити запит до того, як він вийде."
          en: "Check that `TARGET` is `\"android-emulator\"` (address `10.0.2.2`), not `127.0.0.1`. The plain-HTTP rules from lesson rn-06-05 can also stop a request before it leaves."
    recovery:
      uk: "Єдина зміна в нативному проєкті — `MOCK_PORT`. Поверни 7310; якщо проєкт під git, `git diff src/devConfig.ts` покаже, чи лишилося ще щось."
      en: "The only change in the native project is `MOCK_PORT`. Put back 7310; if the project is under git, `git diff src/devConfig.ts` shows whether anything else is left."

  - id: to-project
    kind: transfer
    capstoneStep: NO-06
    body:
      uk: "Крок проєкту цього розділу ще не написаний. За планом курсу в ньому твій React-проєкт отримує вебадаптер з адресою сервера з конфігурації, а нативний компаньйон — якщо є інструменти — нативний адаптер з адресою для своєї цілі; без інструментів нативна інтеграція записується як не виконана."
      en: "The project step of this unit is not written yet. According to the course plan, in it your React project gets a web adapter with the server address from configuration, and the native companion — when the tooling exists — a native adapter with the address for its target; without the tooling the native integration is recorded as not performed."
