id: no-06-08-independent-integration-tests
unit: NO-06
title:
  uk: "Самостійно: інтеграційні тести з перезапуском"
  en: "Independent: integration tests across restart"
kind: assessment
minutes: 35
contentVersion: 1
purpose:
  uk: "Перевірити без підказок, чи вмієш ти довести тестами, що клієнт і сервер працюють разом: дані переживають перезапуск сервера, після перезавантаження клієнта перемагає стан сервера, а офлайн і помилка сервера не стирають того, що людина вже бачила. Нативну перевірку, якої не можна виконати, ти записуєш як не виконану."
  en: "Check, without hints, whether you can prove with tests that the client and the server work together: data survives a server restart, the server's state wins after a client reload, and offline or a server error does not erase what the person already saw. A native check that cannot be run is recorded as not performed."
objectives:
  - uk: "Без підказок написати інтеграційні тести, що запускають справжній сервер, ведуть шар даних клієнта через створення, перезапуск і перезавантаження й перевіряють, що перемагає стан сервера."
    en: "Write, without hints, integration tests that start the real server, drive the client data layer through create, restart and reload, and assert that the server's state wins."
  - uk: "Покрити тестами шляхи офлайн і помилки сервера через вебадаптер і записати нативні перевірки як не виконані, якщо нативних інструментів немає."
    en: "Cover the offline and server-error paths through the web adapter, and record native checks as unperformed when native tooling is absent."
prerequisites: [no-06-07-debug-contract-mismatch]
subskills:
  - { family: B-12, skill: "web/native adapters", depth: assess }
  - { family: B-12, skill: "server source of truth vs cache", depth: assess }
  - { family: B-12, skill: "offline/errors/retry", depth: assess }
glossary: []
selfCheck: [integration-suite]

blocks:
  - id: what-is-checked
    kind: explanation
    title:
      uk: "Що перевіряється"
      en: "What is checked"
    body:
      uk: |
        Цього разу код системи готовий, а пишеш ти **тести**. Підказок немає: застосуй те, що було в цьому розділі.

        Перевірки не дивляться на текст твоїх тестів. Вони запускають твій набір тестів кілька разів: на справжній системі (там усі твої тести мають пройти) і на зламаних версіях, у кожній з яких один дефект інтеграції. Набір має помітити кожен дефект — тобто хоча б один твій тест на ньому має впасти. Які саме дефекти, ти не знаєш заздалегідь, але всі вони порушують правила з вимог нижче.

        Дві частини:

        1. **На платформі** — `integration.test.js`: сервер перезапускається всередині одного процесу Node.js, як у прикладі уроку про офлайн і повтори.
        2. **У твоєму терміналі** — ті самі тести через `node run-tests.js` і справжній перезапуск процесу сервера: Ctrl+C і новий запуск.
      en: |
        This time the system's code is ready, and you write the **tests**. There are no hints: use what this unit taught.

        The checks do not look at the text of your tests. They run your suite several times: against the real system (all your tests must pass there) and against broken versions, each with one integration defect. Your suite must notice every defect — that is, at least one of your tests must fail on it. You do not know the defects in advance, but each breaks one of the rules in the requirements below.

        Two parts:

        1. **On the platform** — `integration.test.js`: the server restarts inside one Node.js process, as in the example of the lesson on offline and retries.
        2. **In your terminal** — the same tests with `node run-tests.js`, and a real restart of the server process: Ctrl+C and a new start.

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: verify-is-not-correct
        from: no-05-08-independent-restart-no-loss
        prompt:
          uk: "У перевірці з перезапуском із розділу NO-05 сховище без черги записів губило підтверджені бронювання, а перевірка резервної копії цього сховища пройшла успішно. Що доводить успішна перевірка копії?"
          en: "In the restart check of unit NO-05 a store without its write queue lost confirmed bookings, and verifying that store's backup succeeded. What does a successful backup verification prove?"
        answer:
          type: choice
          options:
            - id: copy-matches
              text: { uk: "Що копія збігається зі своїм джерелом — а не що джерело правильне", en: "That the copy matches its source — not that the source is correct" }
            - id: no-loss
              text: { uk: "Що жодне підтверджене бронювання не загубилося", en: "That no confirmed booking was lost" }
              why:
                uk: "Копія чесно повторює те, що було в сховищі, — і втрати теж. Втрати ловила окрема перевірка: чи є кожне підтверджене бронювання після перезапуску."
                en: "The copy faithfully repeats what the store had — losses included. Losses were caught by a separate check: whether every confirmed booking is there after the restart."
            - id: nothing
              text: { uk: "Нічого: перевірка копії марна", en: "Nothing: verifying a backup is pointless" }
              why:
                uk: "Вона доводить важливе — що з копії можна відновитися. Просто це інше питання, ніж «чи правильні дані»."
                en: "It proves something important — that you can restore from the copy. It is just another question than “is the data correct”."
          correct: [copy-matches]
        explanation:
          uk: "Кожна перевірка відповідає на своє питання. Так само і тут: «сервер відповідає 200» не доводить, що клієнт показує дані сервера, — для цього потрібен окремий тест."
          en: "Every check answers its own question. The same here: “the server answers 200” does not prove that the client shows the server's data — that needs a test of its own."

  - id: integration-suite
    kind: exercise
    mode: independent
    assessment: true
    runtime: isolated-node
    dir: integration-suite
    entry: run-tests.js
    editable: [integration.test.js]
    capabilities: { network: loopback, timeoutMs: 30000, testTimeoutMs: 15000 }
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      notPerformed: { uk: "не виконано", en: "not performed" }
      summaryPassed: { uk: "пройшли:", en: "passed:" }
      summaryFailed: { uk: "не пройшли:", en: "failed:" }
      summaryUnperformed: { uk: "не виконано:", en: "not performed:" }
      created: { uk: "створено", en: "created" }
      due: { uk: "термін", en: "due" }
      freshDue: { uk: "свіжі дані від сервера, до терміну", en: "fresh from the server, due by" }
      staleLabel: { uk: "застарілі дані:", en: "stale:" }
      usage: { uk: "як запускати", en: "usage" }
      apiOn: { uk: "API планувальника на", en: "Planner API on" }
      dataFile: { uk: "дані:", en: "data:" }
      stopHint: { uk: "Зупинити — Ctrl+C.", en: "Stop it with Ctrl+C." }
      apiStopped: { uk: "API планувальника зупинено.", en: "Planner API stopped." }
    title:
      uk: "Інтеграційні тести планувальника"
      en: "Integration tests for the planner"
    instructions:
      uk: |
        `system.js` (лише для читання) — система під тестом:

        - `startServer({ dataFile })` запускає API справ на вільному порту loopback і повертає `{ base, stop(), failNext(count, status) }`. Дані лежать у `dataFile`, тож сервер, запущений знову з тим самим файлом, бачить ті самі справи (на початку — три стартові: `t-01`, `t-02`, `t-03`). `failNext(1, 500)` змушує наступний запит отримати 500;
        - `freshDataFile()` — новий порожній файл даних для кожного сервера;
        - `createMemoryStorage()` — заміна `localStorage`: те саме сховище, передане новому клієнту, — це перезавантаження сторінки;
        - `createWebAdapter({ baseUrl, storage, online })` і `createDataLayer(adapter)` — клієнт: `listRecords()` повертає `{ records, stale, failure }`, а також є `createRecord({ title, dueDate })` і `updateRecord(id, changes)`;
        - `countDue(tasks, day)` — доменна функція: невиконані справи з терміном до `day` включно.

        `testing.js` (лише для читання) — курсовий запускач: `test(name, fn)`, `unperformed(name, reason)` і `expect` (`toBe`, `toEqual`, `toBeTruthy`, `toBeFalsy`, `toBeNull`, `toContain`, `toHaveLength`, `toBeGreaterThan`).

        Напиши в `integration.test.js` тести, які доводять:

        - справа, створена через шар даних, після перезапуску сервера (зупинка й новий запуск з тим самим файлом) приходить від сервера як свіжа, і `countDue` зі списку сервера це враховує;
        - після перезавантаження клієнта **з тим самим сховищем** перемагає стан сервера, змінений із часу попереднього завантаження;
        - офлайн: клієнт показує останню збережену копію — ті самі записи, — позначену `stale` з `failure: 'offline'`;
        - відповідь 500: так само остання копія, `stale` і `failure: 'http'`;
        - нативна перевірка тієї самої послідовності, якої тут виконати не можна, записана через `unperformed` із назвою, що містить слово `native`, і з причиною.

        Порада: хай кожен тест запускає свій сервер зі своїм `freshDataFile()` і зупиняє його у `finally` — тоді тести не ділять дані, а `node run-tests.js` у терміналі завершується сам (незупинений сервер тримає процес). **Запустити** проганяє твої тести на справжній системі.
      en: |
        `system.js` (read-only) is the system under test:

        - `startServer({ dataFile })` starts the tasks API on a free loopback port and returns `{ base, stop(), failNext(count, status) }`. The data lives in `dataFile`, so a server started again with the same file sees the same tasks (at first three starting ones: `t-01`, `t-02`, `t-03`). `failNext(1, 500)` makes the next request get 500;
        - `freshDataFile()` — a new empty data file for every server;
        - `createMemoryStorage()` — a stand-in for `localStorage`: the same storage given to a new client is a page reload;
        - `createWebAdapter({ baseUrl, storage, online })` and `createDataLayer(adapter)` — the client: `listRecords()` returns `{ records, stale, failure }`, and there are also `createRecord({ title, dueDate })` and `updateRecord(id, changes)`;
        - `countDue(tasks, day)` — a domain function: pending tasks due on or before `day`.

        `testing.js` (read-only) is the course runner: `test(name, fn)`, `unperformed(name, reason)` and `expect` (`toBe`, `toEqual`, `toBeTruthy`, `toBeFalsy`, `toBeNull`, `toContain`, `toHaveLength`, `toBeGreaterThan`).

        In `integration.test.js` write tests that prove:

        - a task created through the data layer comes from the server as fresh after a server restart (a stop and a new start with the same file), and `countDue` over the server's list counts it;
        - after a client reload **with the same storage** the server's state wins when it changed since the previous load;
        - offline: the client shows the last saved copy — the same records — marked `stale` with `failure: 'offline'`;
        - a 500 answer: again the last copy, `stale` and `failure: 'http'`;
        - the native check of the same flow, which cannot be run here, is recorded with `unperformed`, with a name containing the word `native` and with a reason.

        A tip: let every test start its own server with its own `freshDataFile()` and stop it in `finally` — then tests share no data, and `node run-tests.js` in a terminal ends by itself (a server left running keeps the process alive). **Run** runs your tests against the real system.
    testTitles:
      "your tests pass against the real system":
        uk: "Твої тести проходять на справжній системі"
        en: "Your tests pass against the real system"
      "your tests catch a server that loses data on restart":
        uk: "Твої тести ловлять сервер, що губить дані при перезапуску"
        en: "Your tests catch a server that loses data on restart"
      "your tests catch a server that drops due dates on restart":
        uk: "Твої тести ловлять сервер, що після перезапуску губить терміни нових справ"
        en: "Your tests catch a server that drops the due dates of new tasks on restart"
      "your tests catch a saved copy that beats the server after a reload":
        uk: "Твої тести ловлять збережену копію, що перемагає сервер після перезавантаження"
        en: "Your tests catch a saved copy that beats the server after a reload"
      "your tests catch an offline path that empties the list":
        uk: "Твої тести ловлять офлайн, що спорожнює список"
        en: "Your tests catch an offline path that empties the list"
      "your tests catch an offline copy shown as fresh":
        uk: "Твої тести ловлять офлайн-копію, показану як свіжу"
        en: "Your tests catch an offline copy shown as fresh"
      "your tests catch a 500 shown as an empty list":
        uk: "Твої тести ловлять відповідь 500, показану як порожній список"
        en: "Your tests catch a 500 shown as an empty list"
      "your tests catch a 500 classified as an unreachable server":
        uk: "Твої тести ловлять відповідь 500, класифіковану як недоступний сервер"
        en: "Your tests catch a 500 classified as an unreachable server"
      "the native check is recorded as not performed, with a reason":
        uk: "Нативну перевірку записано як не виконану, з причиною"
        en: "The native check is recorded as not performed, with a reason"
    solutionNote:
      uk: "Кожен тест відповідає одному правилу інтеграції і перевіряє те, що бачить людина (записи й позначку `stale`), а не лише прапорці. Перезапуск — це новий сервер із тим самим файлом, а перезавантаження — новий клієнт із тим самим сховищем: без цього тест не помітить ні втрати даних, ні копії, що перемагає сервер. Нативна перевірка записана як не виконана — це чесний результат, а порожній «пройдений» тест збрехав би."
      en: "Every test matches one integration rule and checks what the person sees (the records and the `stale` mark), not only flags. A restart is a new server with the same file, a reload is a new client with the same storage: without that, a test notices neither lost data nor a copy that beats the server. The native check is recorded as not performed — an honest result, while an empty “passing” test would lie."
    feedback:
      - when: { test: "your tests pass against the real system" }
        message:
          uk: "Ця перевірка запускає твої тести на справжній системі й чекає, що хоча б один є і жоден не падає. Які саме впали й чому, видно в консолі після **Запустити** (рядки з `✗`)."
          en: "This check runs your tests against the real system and expects at least one test and no failing ones. Which ones fail and why shows in the console after **Run** (the lines with `✗`)."
      - when: { test: "your tests catch a server that loses data on restart" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили на справжній системі. Потім вона підміняє сервер таким, що після нового запуску починає знову зі стартових справ, і чекає, що хоча б один із тестів, які пройшли на справжній системі, на ній упаде."
          en: "This check first requires all your tests to pass against the real system. Then it swaps in a server that starts again from the starting tasks after a new start, and expects at least one of the tests that passed against the real system to fail on it."
      - when: { test: "your tests catch a server that drops due dates on restart" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили на справжній системі. Потім вона підміняє сервер таким, що після нового запуску зберігає нові справи, але без `dueDate` (`null`), і чекає, що хоча б один із тестів, які пройшли на справжній системі, на ній упаде."
          en: "This check first requires all your tests to pass against the real system. Then it swaps in a server that keeps new tasks after a new start, but without their `dueDate` (`null`), and expects at least one of the tests that passed against the real system to fail on it."
      - when: { test: "your tests catch a saved copy that beats the server after a reload" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили на справжній системі. Потім вона підміняє клієнт таким, що після перезавантаження з тим самим сховищем показує свою збережену копію як свіжу, хоч сервер уже змінився, і чекає, що хоча б один із тестів, які пройшли на справжній системі, на ній упаде."
          en: "This check first requires all your tests to pass against the real system. Then it swaps in a client that, after a reload with the same storage, shows its saved copy as fresh although the server has changed, and expects at least one of the tests that passed against the real system to fail on it."
      - when: { test: "your tests catch an offline path that empties the list" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили на справжній системі. Потім вона підміняє клієнт таким, що офлайн повертає `stale: true` і `failure: 'offline'`, але порожні записи, і чекає, що хоча б один із тестів, які пройшли на справжній системі, на ній упаде."
          en: "This check first requires all your tests to pass against the real system. Then it swaps in a client that, offline, returns `stale: true` and `failure: 'offline'` but empty records, and expects at least one of the tests that passed against the real system to fail on it."
      - when: { test: "your tests catch an offline copy shown as fresh" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили на справжній системі. Потім вона підміняє клієнт таким, що офлайн повертає збережені записи, але з `stale: false` і `failure: null`, і чекає, що хоча б один із тестів, які пройшли на справжній системі, на ній упаде."
          en: "This check first requires all your tests to pass against the real system. Then it swaps in a client that, offline, returns the saved records but with `stale: false` and `failure: null`, and expects at least one of the tests that passed against the real system to fail on it."
      - when: { test: "your tests catch a 500 shown as an empty list" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили на справжній системі. Потім вона підміняє клієнт таким, що на відповідь 500 повертає свіжий порожній список, і чекає, що хоча б один із тестів, які пройшли на справжній системі, на ній упаде."
          en: "This check first requires all your tests to pass against the real system. Then it swaps in a client that answers a 500 with a fresh empty list, and expects at least one of the tests that passed against the real system to fail on it."
      - when: { test: "your tests catch a 500 classified as an unreachable server" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили на справжній системі. Потім вона підміняє клієнт таким, що на відповідь 500 повертає збережену копію з `stale: true`, але з `failure: 'unavailable'` замість `'http'`, і чекає, що хоча б один із тестів, які пройшли на справжній системі, на ній упаде."
          en: "This check first requires all your tests to pass against the real system. Then it swaps in a client that answers a 500 with the saved copy and `stale: true`, but with `failure: 'unavailable'` instead of `'http'`, and expects at least one of the tests that passed against the real system to fail on it."
      - when: { test: "the native check is recorded as not performed, with a reason" }
        message:
          uk: "Ця перевірка шукає серед результатів запис зі статусом «не виконано», у назві якого є `native`, і чекає, що в кожного такого запису є непорожня причина, а жоден тест із `native` у назві не позначено як пройдений."
          en: "This check looks among the results for an entry with the status “not performed” and `native` in its name, and expects every such entry to have a non-empty reason and no test with `native` in its name to be reported as passed."

  - id: restart-for-real
    kind: local-task
    runtime: local-node
    title:
      uk: "Ті самі тести й справжній перезапуск процесу"
      en: "The same tests and a real process restart"
    intro:
      uk: |
        Тут потрібні лише Node.js і термінал, без npm-пакетів, акаунтів і мережі поза твоїм комп’ютером. Почни, коли всі перевірки вправи «Інтеграційні тести планувальника» зелені. Сервер слухає лише `127.0.0.1:7350` — інші пристрої в мережі до нього не дістануться.

        Під час рецензування уроку ці кроки виконано на macOS з Node.js v25.2.1 і v22.23.3, з українською й англійською версіями файлів; вивід нижче справжній і однаковий на обох версіях Node.js. Linux і Windows не перевірено. Усе, що використовує `system.js`, у Node.js 22 є: глобальний [`fetch`](https://nodejs.org/docs/latest-v22.x/api/globals.html#fetch) (стабільний із v21), [`AbortSignal.timeout`](https://nodejs.org/docs/latest-v22.x/api/globals.html#static-method-abortsignaltimeoutdelay) і [`server.closeAllConnections()`](https://nodejs.org/docs/latest-v22.x/api/http.html#servercloseallconnections) (з v18.2). Ідентифікатор нової справи випадковий — у тебе він буде інший.

        **Крок 4 — `node run-tests.js`** (назви тестів — із нашого розв’язку, у тебе будуть твої):

        ```text
        ✓ a record created before a server restart is loaded from the server after it
        ✓ after a reload the server state wins over the saved copy
        ✓ offline keeps the saved copy, marked stale
        ✓ a 500 keeps the saved copy, marked stale with failure http
        ○ native companion: the same flow on a device — не виконано: no emulator or device on this machine
        пройшли: 4, не пройшли: 0, не виконано: 1
        ```

        **Крок 6 — справа до перезапуску:**

        ```text
        $ node client.mjs add "Оновити паспорт" 2026-03-01
        створено t-5389b4bc: Оновити паспорт (термін 2026-03-01)
        $ node client.mjs list 2026-03-01
        t-01  [ ] Полити квіти  2026-03-02
        t-02  [ ] Здати книжки в бібліотеку  2026-03-01
        t-03  [ ] Написати бабусі  -
        t-5389b4bc  [ ] Оновити паспорт  2026-03-01
        свіжі дані від сервера, до терміну 2026-03-01: 2
        ```

        **Крок 7 — сервер зупинено.** Перше вікно друкує `API планувальника зупинено.` і повертає запрошення терміналу; `node client.mjs list 2026-03-01` у другому друкує лише `застарілі дані: unavailable` — записів немає, бо в цього клієнта немає збереженої копії.

        **Крок 9 — після нового запуску процесу** — ті самі чотири справи, що в кроці 6, і знову `свіжі дані від сервера, до терміну 2026-03-01: 2`.
      en: |
        You need only Node.js and a terminal here — no npm packages, no accounts and no network beyond your computer. Start when every check of the exercise “Integration tests for the planner” is green. The server listens only on `127.0.0.1:7350` — other devices on the network cannot reach it.

        While this lesson was reviewed, these steps were run on macOS with Node.js v25.2.1 and v22.23.3, with both the Ukrainian and the English version of the files; the output below is real and the same on both Node.js versions. Linux and Windows were not checked. Everything `system.js` uses exists in Node.js 22: the global [`fetch`](https://nodejs.org/docs/latest-v22.x/api/globals.html#fetch) (stable since v21), [`AbortSignal.timeout`](https://nodejs.org/docs/latest-v22.x/api/globals.html#static-method-abortsignaltimeoutdelay) and [`server.closeAllConnections()`](https://nodejs.org/docs/latest-v22.x/api/http.html#servercloseallconnections) (since v18.2). The id of a new task is random — yours will differ.

        **Step 4 — `node run-tests.js`** (the test names are from our solution; yours will be your own):

        ```text
        ✓ a record created before a server restart is loaded from the server after it
        ✓ after a reload the server state wins over the saved copy
        ✓ offline keeps the saved copy, marked stale
        ✓ a 500 keeps the saved copy, marked stale with failure http
        ○ native companion: the same flow on a device — not performed: no emulator or device on this machine
        passed: 4, failed: 0, not performed: 1
        ```

        **Step 6 — a task before the restart:**

        ```text
        $ node client.mjs add "Renew passport" 2026-03-01
        created t-894a55be: Renew passport (due 2026-03-01)
        $ node client.mjs list 2026-03-01
        t-01  [ ] Water the plants  2026-03-02
        t-02  [ ] Return library books  2026-03-01
        t-03  [ ] Write to grandma  -
        t-894a55be  [ ] Renew passport  2026-03-01
        fresh from the server, due by 2026-03-01: 2
        ```

        **Step 7 — the server is stopped.** The first window prints `Planner API stopped.` and gives the terminal prompt back; `node client.mjs list 2026-03-01` in the second prints only `stale: unavailable` — no records, because this client has no saved copy.

        **Step 9 — after the new process start** — the same four tasks as in step 6, and again `fresh from the server, due by 2026-03-01: 2`.
    tools:
      - { name: "Node.js", version: { uk: "22.13 або новіший (перевірено на 25.2.1 і 22.23.3)", en: "22.13 or newer (checked on 25.2.1 and 22.23.3)" } }
    steps:
      - text:
          uk: "Створи теку для перевірки й перейди в неї."
          en: "Create a folder for the check and go into it."
        command: |
          mkdir -p ~/js-course/no06-integration
          cd ~/js-course/no06-integration
      - text:
          uk: "У VS Code створи в цій теці `package.json` з одним рядком коду `{ \"type\": \"module\" }`. Потім створи файли `system.js`, `testing.js`, `run-tests.js`, `serve.mjs`, `client.mjs` і `integration.test.js` і встав у кожен вміст однойменної вкладки вправи «Інтеграційні тести планувальника» (`integration.test.js` — твій розв’язок, що пройшов перевірки)."
          en: "In VS Code create `package.json` in this folder with the single line of code `{ \"type\": \"module\" }`. Then create the files `system.js`, `testing.js`, `run-tests.js`, `serve.mjs`, `client.mjs` and `integration.test.js` and paste into each the content of the tab with the same name from the exercise “Integration tests for the planner” (`integration.test.js` is your solution that passed the checks)."
      - text:
          uk: "Переконайся, що всі файли на місці."
          en: "Make sure all the files are in place."
        command: "ls"
        expect:
          uk: "Сім назв: `client.mjs`, `integration.test.js`, `package.json`, `run-tests.js`, `serve.mjs`, `system.js`, `testing.js`."
          en: "Seven names: `client.mjs`, `integration.test.js`, `package.json`, `run-tests.js`, `serve.mjs`, `system.js`, `testing.js`."
      - text:
          uk: "Запусти свої тести в терміналі."
          en: "Run your tests in the terminal."
        command: "node run-tests.js"
        expect:
          uk: "Твої тести з `✓`, нативна перевірка з `○` і «не виконано», у підсумку `не пройшли: 0`, як у кроці 4 вступу; після підсумку термінал знову чекає на команду."
          en: "Your tests with `✓`, the native check with `○` and “not performed”, and `failed: 0` in the summary, as in step 4 of the introduction; after the summary the terminal waits for a command again."
      - text:
          uk: "Тепер справжній процес сервера: у цьому (першому) вікні запусти API й залиш вікно відкритим."
          en: "Now a real server process: start the API in this (first) window and leave the window open."
        command: "node serve.mjs"
        expect:
          uk: "`API планувальника на http://127.0.0.1:7350 (дані: tasks.json). Зупинити — Ctrl+C.`, і термінал лишається зайнятим."
          en: "`Planner API on http://127.0.0.1:7350 (data: tasks.json). Stop it with Ctrl+C.`, and the terminal stays busy."
      - text:
          uk: "Відкрий друге вікно терміналу, перейди в ту саму теку, створи справу й переглянь список."
          en: "Open a second terminal window, go into the same folder, create a task and list them."
        command: |
          cd ~/js-course/no06-integration
          node client.mjs add "Оновити паспорт" 2026-03-01
          node client.mjs list 2026-03-01
        expect:
          uk: "Нова справа серед чотирьох і `до терміну 2026-03-01: 2`, як у кроці 6 вступу."
          en: "The new task among four and `due by 2026-03-01: 2`, as in step 6 of the introduction."
      - text:
          uk: "Зупини сервер: у першому вікні натисни Ctrl+C. Потім у другому вікні знову запроси список."
          en: "Stop the server: press Ctrl+C in the first window. Then ask for the list again in the second window."
        command: "node client.mjs list 2026-03-01"
        expect:
          uk: "`застарілі дані: unavailable` і жодного запису, як у кроці 7 вступу."
          en: "`stale: unavailable` and no records, as in step 7 of the introduction."
      - text:
          uk: "У першому вікні знову запусти сервер — новий процес із тим самим `tasks.json`."
          en: "Start the server again in the first window — a new process with the same `tasks.json`."
        command: "node serve.mjs"
        expect:
          uk: "Той самий рядок `API планувальника на http://127.0.0.1:7350 …`, що в кроці 5."
          en: "The same line `Planner API on http://127.0.0.1:7350 …` as in step 5."
      - text:
          uk: "У другому вікні повтори запит."
          en: "Repeat the request in the second window."
        command: "node client.mjs list 2026-03-01"
        expect:
          uk: "Ті самі чотири справи, що в кроці 6, і знову `до терміну 2026-03-01: 2` — дані прийшли від нового процесу сервера."
          en: "The same four tasks as in step 6, and again `due by 2026-03-01: 2` — the data came from the new server process."
      - text:
          uk: "Запиши в нотатки про проєкт результат нативної перевірки: якщо нативних інструментів немає — «нативна інтеграція: не виконано, причина: …», а не «пройдено». Зупини сервер у першому вікні (Ctrl+C)."
          en: "Write the result of the native check into your project notes: without native tooling — “native integration: not performed, reason: …”, not “passed”. Stop the server in the first window (Ctrl+C)."
    verify:
      - id: suite-green
        text:
          uk: "`node run-tests.js` у терміналі показав `0` тестів, що не пройшли, і нативну перевірку як не виконану."
          en: "`node run-tests.js` in the terminal showed `0` failed tests and the native check as not performed."
      - id: process-restart
        text:
          uk: "Після справжнього перезапуску процесу сервера справа, створена до нього, прийшла від сервера, і кількість справ до терміну порахувалася з даних сервера."
          en: "After a real restart of the server process, the task created before it came from the server, and the count of due tasks was computed from the server's data."
    troubleshooting:
      - problem:
          uk: "`node serve.mjs` падає з `Error: listen EADDRINUSE: address already in use 127.0.0.1:7350` (так на Node.js v25.2.1 і v22.23.3)."
          en: "`node serve.mjs` fails with `Error: listen EADDRINUSE: address already in use 127.0.0.1:7350` (so on Node.js v25.2.1 and v22.23.3)."
        fix:
          uk: "Попередня копія сервера ще працює в іншому вікні: зупини її Ctrl+C. Або запусти на іншому порту — `PORT=7351 node serve.mjs`, а клієнт — `API_BASE_URL=http://127.0.0.1:7351 node client.mjs list 2026-03-01` (перевірено в macOS; у Linux так само, але не перевірено). У Windows PowerShell — `$env:PORT=\"7351\"; node serve.mjs` і `$env:API_BASE_URL=\"http://127.0.0.1:7351\"; node client.mjs list 2026-03-01` (не перевірено); там змінна лишається у вікні до `Remove-Item Env:PORT`."
          en: "A previous copy of the server is still running in another window: stop it with Ctrl+C. Or start on another port — `PORT=7351 node serve.mjs`, and the client with `API_BASE_URL=http://127.0.0.1:7351 node client.mjs list 2026-03-01` (checked on macOS; the same on Linux, but not checked). In Windows PowerShell — `$env:PORT=\"7351\"; node serve.mjs` and `$env:API_BASE_URL=\"http://127.0.0.1:7351\"; node client.mjs list 2026-03-01` (not checked); there the variable stays set in that window until `Remove-Item Env:PORT`."
      - problem:
          uk: "`node run-tests.js` друкує рядки з `✗`, хоча на платформі все було зелене."
          en: "`node run-tests.js` prints lines with `✗`, although everything was green on the platform."
        fix:
          uk: "Перевір, що `integration.test.js` — саме той розв’язок, що пройшов перевірки, і що решту файлів скопійовано повністю. Текст після `✗` каже, яке `expect` не справдилося."
          en: "Check that `integration.test.js` is exactly the solution that passed the checks, and that the other files were copied in full. The text after `✗` says which `expect` did not hold."
      - problem:
          uk: "Після підсумку `node run-tests.js` термінал не повертає запрошення."
          en: "After the summary, `node run-tests.js` does not give the terminal prompt back."
        fix:
          uk: "Один із твоїх тестів не зупинив свій сервер — відкритий сервер тримає процес. Зупини запуск Ctrl+C і додай `await server.stop()` у `finally` кожного тесту, що запускає сервер."
          en: "One of your tests did not stop its server — an open server keeps the process alive. Stop the run with Ctrl+C and add `await server.stop()` in the `finally` of every test that starts a server."
    recovery:
      uk: "Тека `~/js-course/no06-integration` нічого не змінює в проєкті. Щоб почати зі стартових справ, видали `tasks.json` (його створює `serve.mjs`) і підтеку `.data` (її створюють тести)."
      en: "The folder `~/js-course/no06-integration` changes nothing in your project. To start again from the starting tasks, delete `tasks.json` (created by `serve.mjs`) and the `.data` subfolder (created by the tests)."
