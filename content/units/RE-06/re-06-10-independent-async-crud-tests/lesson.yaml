id: re-06-10-independent-async-crud-tests
unit: RE-06
title:
  uk: "Самостійно: асинхронний CRUD із тестами"
  en: "Independent: async CRUD with tests"
kind: assessment
minutes: 30
contentVersion: 1
objectives:
  - uk: "Без підказок реалізувати асинхронні створення, зміну й видалення через API-фікстуру: queries окремо від mutations, точна інвалідація, доступні стани очікування й помилки — і перевірити це тестами дій користувача."
    en: "Implement, without hints, async create/update/remove over the fixture API with queries and mutations kept separate, targeted invalidation and accessible pending/error states, verified by user-action tests."
purpose:
  uk: "Перевірити, що ти самостійно складаєш усе з розділу в робочий екран: query, яка читає список, mutations з обробників, інвалідацію після кожного запису, чесні стани завантаження, порожнечі й помилки — і тести, що ловлять справжні поломки, а не перевіряють внутрішній стан."
  en: "Check that you can put everything from this unit together into a working screen on your own: a query that reads the list, mutations from handlers, invalidation after every write, honest loading, empty and error states — and tests that catch real faults instead of checking internal state."
prerequisites: [re-06-09-debug-race-optimistic]
subskills:
  - { family: R-06, skill: "mutations vs queries", depth: assess }
glossary: []
selfCheck: [bookmarks]

blocks:
  - id: the-task
    kind: explanation
    title:
      uk: "Що буде в цій роботі"
      en: "What this task is about"
    body:
      uk: |
        Новий ресурс — закладки: назва, адреса й позначка «улюблене». Сервер-фікстура вміє читати список, створювати, змінювати й видаляти закладки, а ще затримуватися й ламатися на замовлення.

        Ти напишеш і екран, і тести до нього. Підказок не буде — лише точний опис того, що людина має бачити, щоб перевірки (і твої тести) знайшли поля, кнопки й повідомлення. Як влаштувати код усередині — вирішуєш ти.

        Перевірки дивляться на твій екран напряму, рахують запити, запускають твої тести з повільнішим сервером і з трьома зламаними версіями екрана, які поводяться за тим самим описом.
      en: |
        A new resource — bookmarks: a title, an address and a “favorite” mark. The fixture server can read the list, create, change and remove bookmarks, and also delay and break on request.

        You will write both the screen and its tests. There are no hints — only an exact description of what a person must see, so that the checks (and your tests) find the fields, buttons and messages. How to arrange the code inside is up to you.

        The checks look at your screen directly, count requests, and run your tests with a slower server and with three broken versions of the screen that follow the same description.

  - id: bookmarks
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-react
    dir: bookmarks
    entry: main.jsx
    editable: [Bookmarks.jsx, Bookmarks.test.jsx]
    capabilities: { testTimeoutMs: 20000 }
    strings:
      borshch: { uk: "Рецепт борщу", en: "Borscht recipe" }
      bus: { uk: "Розклад автобусів", en: "Bus timetable" }
      course: { uk: "Курс JavaScript", en: "JavaScript course" }
      titleField: { uk: "Назва", en: "Title" }
      urlField: { uk: "Адреса", en: "Address" }
      add: { uk: "Додати", en: "Add" }
      favorite: { uk: "Улюблене", en: "Favorite" }
      remove: { uk: "Видалити", en: "Remove" }
      loading: { uk: "Завантажую закладки…", en: "Loading bookmarks…" }
      empty: { uk: "Закладок ще немає.", en: "No bookmarks yet." }
      loadFailed: { uk: "Не вдалося завантажити закладки.", en: "Could not load the bookmarks." }
      saveFailed: { uk: "Не вдалося зберегти зміну.", en: "Could not save the change." }
      testLoad: { uk: "список показує закладки як посилання", en: "the list shows the bookmarks as links" }
      testEmpty: { uk: "порожній список каже, що закладок немає", en: "an empty list says there are no bookmarks" }
      testCreate: { uk: "додана закладка з’являється в списку", en: "an added bookmark appears in the list" }
      testFailedUpdate: { uk: "невдале «улюблене» показує помилку й нічого не змінює", en: "a failed favorite shows the error and changes nothing" }
      testRemove: { uk: "видалена закладка зникає зі списку", en: "a removed bookmark leaves the list" }
      mTitles: { uk: "назви в списку", en: "the titles in the list" }
      mPressed: { uk: "aria-pressed кнопки «Улюблене»", en: "aria-pressed of the Favorite button" }
      mHref: { uk: "адреса посилання", en: "the link's address" }
      mAlert: { uk: "повідомлення role=alert", en: "the role=alert message" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rNotFound: { uk: "на екрані немає", en: "not on the screen:" }
      rStillMissing: { uk: "так і не з’явилося", en: "never appeared" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Закладки: екран і тести"
      en: "Bookmarks: the screen and its tests"
    instructions:
      uk: |
        **Сервер** — `fakeServer.js` (його не змінюй): `GET`, `POST`, `PATCH` і `DELETE` на `/api/bookmarks`, опис — на початку файлу. Перед кожним тестом `main.jsx` викликає `resetServer()`: дві закладки — «Рецепт борщу» (не улюблена) і «Розклад автобусів» (улюблена). У тесті ти можеш викликати `resetServer([])` (порожній сервер), ставити `settings.failNextWrite = 1` чи `settings.failNextRead = 1` і чекати `whenIdle()`.

        **Екран** `Bookmarks.jsx`:

        - `<p role="status">` з першого рендеру; поки список уперше завантажується, у ньому «Завантажую закладки…»;
        - `<p role="alert">` з першого рендеру: «Не вдалося завантажити закладки.» після невдалого читання, «Не вдалося зберегти зміну.» після невдалого запису;
        - форма: поле з підписом «Назва», поле з підписом «Адреса», кнопка «Додати», яка `disabled`, поки додавання в дорозі;
        - якщо закладок немає — текст «Закладок ще немає.»;
        - кожна закладка — `<li>` з посиланням `<a href="адреса">назва</a>`, кнопкою «Улюблене» з `aria-pressed` (`true`/`false`) і кнопкою «Видалити».

        **Поведінка:** список читає одна query; «Додати», «Улюблене» й «Видалити» — mutations з обробників, кожна надсилає **один** запит і після успіху змушує список прочитатися знову; невдала зміна нічого не лишає зміненим на екрані.

        **Тести** `Bookmarks.test.jsx` — щонайменше чотири тести дій користувача: завантаження, додавання, невдале «Улюблене» й видалення. Курсові інструменти ті самі, що в попередніх уроках, плюс `within(елемент)` — пошук усередині одного рядка; які ролі вони розпізнають (`link`, `button`, `listitem`, `alert`…), видно у функції `roleOf` у `testing.js`. Перевірки запускають твої тести з повільнішим сервером, ніж під час **Запустити**, і з трьома зламаними версіями екрана: на кожній хоча б один тест має впасти. Тож не чекай фіксованими паузами.
      en: |
        **The server** is `fakeServer.js` (do not change it): `GET`, `POST`, `PATCH` and `DELETE` on `/api/bookmarks`, described at the top of the file. Before every test `main.jsx` calls `resetServer()`: two bookmarks — “Borscht recipe” (not a favorite) and “Bus timetable” (a favorite). In a test you may call `resetServer([])` (an empty server), set `settings.failNextWrite = 1` or `settings.failNextRead = 1` and wait for `whenIdle()`.

        **The screen** `Bookmarks.jsx`:

        - a `<p role="status">` from the first render; while the list loads for the first time it says “Loading bookmarks…”;
        - a `<p role="alert">` from the first render: “Could not load the bookmarks.” after a failed read, “Could not save the change.” after a failed write;
        - a form: a field labelled “Title”, a field labelled “Address”, an “Add” button that is `disabled` while adding is on its way;
        - if there are no bookmarks — the text “No bookmarks yet.”;
        - every bookmark is an `<li>` with a link `<a href="address">title</a>`, a “Favorite” button with `aria-pressed` (`true`/`false`) and a “Remove” button.

        **Behavior:** one query reads the list; “Add”, “Favorite” and “Remove” are mutations from handlers, each sends **one** request and after success makes the list read again; a failed change leaves nothing changed on the screen.

        **Tests** `Bookmarks.test.jsx` — at least four user-action tests: loading, adding, a failed “Favorite” and removing. The course tools are the same as in the previous lessons, plus `within(element)` — searching inside one row; the roles they recognize (`link`, `button`, `listitem`, `alert`…) are listed in the `roleOf` function in `testing.js`. The checks run your tests with a server slower than on **Run** and with three broken versions of the screen: on each, at least one test must fail. So do not wait with fixed pauses.
    testTitles:
      "the first render says the bookmarks are loading":
        uk: "Перший рендер каже, що закладки завантажуються"
        en: "The first render says the bookmarks are loading"
      "the list loads and shows every bookmark as a link":
        uk: "Список завантажується й показує кожну закладку як посилання"
        en: "The list loads and shows every bookmark as a link"
      "an empty list says there are no bookmarks":
        uk: "Порожній список каже, що закладок немає"
        en: "An empty list says there are no bookmarks"
      "a failed load shows the error":
        uk: "Невдале завантаження показує помилку"
        en: "A failed load shows the error"
      "adding a bookmark sends one POST and reads the list again":
        uk: "Додавання надсилає один `POST` і читає список знову"
        en: "Adding a bookmark sends one `POST` and reads the list again"
      "the Add button is disabled while saving":
        uk: "Кнопка «Додати» `disabled`, поки йде збереження"
        en: "The Add button is `disabled` while saving"
      "marking a favorite sends one PATCH and shows it pressed":
        uk: "«Улюблене» надсилає один `PATCH` і показує кнопку натиснутою"
        en: "Marking a favorite sends one `PATCH` and shows it pressed"
      "a failed favorite sends one PATCH, shows the error and leaves the bookmark as it was":
        uk: "Невдале «Улюблене» надсилає один `PATCH`, показує помилку й лишає закладку як була"
        en: "A failed favorite sends one `PATCH`, shows the error and leaves the bookmark as it was"
      "removing a bookmark sends a DELETE and takes it off the list":
        uk: "Видалення надсилає `DELETE` і прибирає закладку зі списку"
        en: "Removing a bookmark sends a `DELETE` and takes it off the list"
      "your tests pass with your Bookmarks and a slower server":
        uk: "Твої тести проходять із твоїм `Bookmarks` і повільнішим сервером"
        en: "Your tests pass with your `Bookmarks` and a slower server"
      "one of your tests fails when an added bookmark never appears":
        uk: "Один із твоїх тестів падає, коли додана закладка не з’являється"
        en: "One of your tests fails when an added bookmark never appears"
      "one of your tests fails when a failed favorite stays on screen without an error":
        uk: "Один із твоїх тестів падає, коли невдале «Улюблене» лишається на екрані без помилки"
        en: "One of your tests fails when a failed favorite stays on screen without an error"
      "one of your tests fails when a removed bookmark stays in the list":
        uk: "Один із твоїх тестів падає, коли видалена закладка лишається в списку"
        en: "One of your tests fails when a removed bookmark stays in the list"
    solutionNote:
      uk: "Хук `useBookmarks` — єдина query: ефект читає список зі скасуванням, а `invalidate` збільшує номер раунду, і список читається знову. Усі зміни йдуть через одну функцію-mutation з обробників: один запит, після успіху — інвалідація, після збою — повідомлення в `role=\"alert\"`, а стан списку не змінюється, тож відкочувати нічого. Тести діють як людина, знаходять рядок через `within`, а на запізнілі відповіді чекають `findByText` і `whenIdle()` — тому проходять і з повільнішим сервером, і ловлять усі три зламані версії."
      en: "The `useBookmarks` hook is the single query: an effect reads the list with cancellation, and `invalidate` bumps the round number, so the list is read again. Every change goes through one mutation function called from handlers: one request, an invalidation after success, a message in `role=\"alert\"` after a failure, and the list state does not change, so there is nothing to roll back. The tests act like a person, find a row with `within`, and wait for late answers with `findByText` and `whenIdle()` — so they pass with a slower server and catch all three broken versions."
    feedback:
      - when: { test: "the first render says the bookmarks are loading" }
        message:
          uk: "Ця перевірка дивиться на екран одразу після показу, ще до відповіді сервера, і очікує `role=\"status\"` з текстом «Завантажую закладки…» та порожній `role=\"alert\"` — обидва елементи мають бути з першого рендеру."
          en: "This check looks at the screen right after it appears, before the server answers, and expects `role=\"status\"` with the text “Loading bookmarks…” and an empty `role=\"alert\"` — both elements must be there from the first render."
      - when: { test: "the list loads and shows every bookmark as a link" }
        message:
          uk: "Ця перевірка чекає, доки стихнуть запити, і очікує два посилання в `<li>`: «Рецепт борщу» на `https://example.com/borshch` і «Розклад автобусів» на `https://example.com/bus`. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "This check waits until the requests settle and expects two links inside `<li>`: “Borscht recipe” to `https://example.com/borshch` and “Bus timetable” to `https://example.com/bus`. If every check fails at once, fix the first error in the console first."
      - when: { test: "an empty list says there are no bookmarks" }
        message:
          uk: "Ця перевірка запускає порожній сервер і очікує на екрані текст «Закладок ще немає.»."
          en: "This check starts an empty server and expects the text “No bookmarks yet.” on the screen."
      - when: { test: "a failed load shows the error" }
        message:
          uk: "Ця перевірка провалює перше читання й очікує в `role=\"alert\"` рівно «Не вдалося завантажити закладки.»."
          en: "This check makes the first read fail and expects exactly “Could not load the bookmarks.” in `role=\"alert\"`."
      - when: { test: "adding a bookmark sends one POST and reads the list again" }
        message:
          uk: "Ця перевірка заповнює «Назва» й «Адреса», натискає «Додати» й очікує рівно один `POST /api/bookmarks` з тілом `{ title, url }`, після нього — `GET /api/bookmarks`, а в списку — три закладки, нова остання."
          en: "This check fills “Title” and “Address”, presses “Add” and expects exactly one `POST /api/bookmarks` with the body `{ title, url }`, a `GET /api/bookmarks` after it, and three bookmarks in the list, the new one last."
      - when: { test: "the Add button is disabled while saving" }
        message:
          uk: "Ця перевірка натискає «Додати» й одразу, поки `POST` у дорозі, очікує цю кнопку `disabled`."
          en: "This check presses “Add” and right away, while the `POST` is on its way, expects that button to be `disabled`."
      - when: { test: "marking a favorite sends one PATCH and shows it pressed" }
        message:
          uk: "Ця перевірка натискає «Улюблене» в рядку «Рецепт борщу» й очікує один `PATCH /api/bookmarks/b-01`, а потім `aria-pressed=\"true\"` на цій кнопці."
          en: "This check presses “Favorite” in the “Borscht recipe” row and expects one `PATCH /api/bookmarks/b-01`, and then `aria-pressed=\"true\"` on that button."
      - when: { test: "a failed favorite sends one PATCH, shows the error and leaves the bookmark as it was" }
        message:
          uk: "Ця перевірка провалює зміну «Улюбленого» в рядку «Розклад автобусів» і очікує один `PATCH`, «Не вдалося зберегти зміну.» у `role=\"alert\"` і `aria-pressed=\"true\"`, як було до кліку."
          en: "This check makes the “Favorite” change in the “Bus timetable” row fail and expects one `PATCH`, “Could not save the change.” in `role=\"alert\"` and `aria-pressed=\"true\"`, as it was before the click."
      - when: { test: "removing a bookmark sends a DELETE and takes it off the list" }
        message:
          uk: "Ця перевірка натискає «Видалити» в рядку «Розклад автобусів» і очікує один `DELETE /api/bookmarks/b-02` та список лише з «Рецепт борщу»."
          en: "This check presses “Remove” in the “Bus timetable” row and expects one `DELETE /api/bookmarks/b-02` and a list with only “Borscht recipe”."
      - when: { test: "your tests pass with your Bookmarks and a slower server" }
        message:
          uk: "Ця перевірка запускає твої тести з твоїм `Bookmarks` і сервером, повільнішим, ніж під час **Запустити** (читання 150 мс, запис 300 мс), і очікує щонайменше чотири тести й жодного червоного. Рядки `✗` у **Консолі** кажуть, який тест упав і чому; якщо тест проходить на **Запустити**, але тут падає, він чекає фіксованою паузою, а не на видимий результат чи `whenIdle()`."
          en: "This check runs your tests with your `Bookmarks` and a server slower than on **Run** (reads 150 ms, writes 300 ms), and expects at least four tests and none red. The `✗` lines in the **Console** say which test failed and why; if a test passes on **Run** but fails here, it waits with a fixed pause instead of for the visible result or `whenIdle()`."
      - when: { test: "one of your tests fails when an added bookmark never appears" }
        message:
          uk: "Спершу твої тести мають пройти з твоїм `Bookmarks`. Ця перевірка підставляє версію, яка після додавання не читає список знову, і очікує, що хоча б один тест упаде. Тест додавання має дочекатися нової закладки в списку."
          en: "First your tests must pass with your `Bookmarks`. This check puts in a version that does not read the list again after adding, and expects at least one test to fail. The adding test must wait for the new bookmark in the list."
      - when: { test: "one of your tests fails when a failed favorite stays on screen without an error" }
        message:
          uk: "Спершу твої тести мають пройти з твоїм `Bookmarks`. Ця перевірка підставляє версію, яка після невдалого «Улюбленого» лишає кнопку перемкнутою й не показує помилки, і очікує, що хоча б один тест упаде. Тест невдалої зміни має перевірити і повідомлення, і `aria-pressed`."
          en: "First your tests must pass with your `Bookmarks`. This check puts in a version that leaves the button toggled after a failed “Favorite” and shows no error, and expects at least one test to fail. The failed-change test must check both the message and `aria-pressed`."
      - when: { test: "one of your tests fails when a removed bookmark stays in the list" }
        message:
          uk: "Спершу твої тести мають пройти з твоїм `Bookmarks`. Ця перевірка підставляє версію, яка після видалення не читає список знову, і очікує, що хоча б один тест упаде. Тест видалення має дочекатися, доки закладка зникне."
          en: "First your tests must pass with your `Bookmarks`. This check puts in a version that does not read the list again after removing, and expects at least one test to fail. The removing test must wait until the bookmark is gone."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: zero-one-many
        from: js-09-03-boundary-cases
        prompt:
          uk: "Тести екрана закладок перевіряють лише список із двох закладок. Які ще випадки варто додати насамперед?"
          en: "The bookmark screen's tests check only a list of two bookmarks. Which cases are worth adding first?"
        answer:
          type: multi
          options:
            - id: empty
              text: { uk: "Порожній список (нуль закладок)", en: "An empty list (zero bookmarks)" }
            - id: one-left
              text: { uk: "Видалення останньої закладки, після якого список стає порожнім", en: "Removing the last bookmark, after which the list becomes empty" }
            - id: hundred
              text: { uk: "Список рівно зі ста закладок — бо «багато»", en: "A list of exactly one hundred bookmarks — because “many”" }
              why:
                uk: "Два — це вже «багато» для цього екрана: код однаково проходить будь-який довгий список. Межі там, де поведінка змінюється: нуль і перехід до нуля."
                en: "Two is already “many” for this screen: the code walks any long list the same way. The boundaries are where behavior changes: zero and the step to zero."
            - id: same-two
              text: { uk: "Ті самі дві закладки, але в іншому тесті", en: "The same two bookmarks, but in another test" }
              why:
                uk: "Новий тест із тими самими даними не перевіряє нового випадку."
                en: "A new test with the same data checks no new case."
          correct: [empty, one-left]
        explanation:
          uk: "Межові випадки — нуль, один, багато — і переходи між ними. Для списку це порожній стан і момент, коли він порожнім стає; там найчастіше забувають повідомлення «нічого немає»."
          en: "Boundary cases are zero, one, many — and the steps between them. For a list that is the empty state and the moment it becomes empty; that is where the “nothing here” message is most often forgotten."

  - id: to-project
    kind: transfer
    capstoneStep: RE-06
    body:
      uk: "Наступний крок — той самий асинхронний шар у твоєму проєкті, у VS Code: query списку зі скасуванням, mutations з обробників з інвалідацією, одна оптимістична зміна з відкатом і тести дій користувача, які ти відкриваєш у браузері на сторінці `tests.html`."
      en: "The next step is the same async layer in your project, in VS Code: a list query with cancellation, mutations from handlers with invalidation, one optimistic change with a rollback, and user-action tests you open in the browser on the page `tests.html`."
