<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%title%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>%%title%%</h1>
      <p class="modes">
        <label>%%modeLabel%%
          <select id="mode">
            <option value="ok">ok</option>
            <option value="slow">slow</option>
            <option value="error500">error500</option>
            <option value="offline">offline</option>
            <option value="hung">hung</option>
          </select>
        </label>
        <button type="button" id="load">%%loadButton%%</button>
      </p>
      <p id="status" role="status"></p>
      <ul id="list"></ul>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
