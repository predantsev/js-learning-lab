id: js-08-07-failures-loading-error
unit: JS-08
title:
  uk: "Збої мережі, стани завантаження й помилки"
  en: "Network failures, loading and error states"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Відрізнити помилку HTTP (`fetch` виконався, `ok` — `false`) від збою мережі (`fetch` відхилено) і показати для кожної окреме повідомлення."
    en: "Tell an HTTP error (`fetch` fulfilled, `ok` is `false`) from a network failure (`fetch` rejected) and show a distinct message for each."
  - uk: "Описати запит станами «очікування», «завантаження», «успіх» і «помилка» та додати тайм-аут, який перетворює запит, що завис, на стан помилки."
    en: "Model a request as idle, loading, success or error and add a timeout that turns a hung request into an error state."
prerequisites: [js-08-06-fetch-basics]
subskills:
  - { family: W-04, skill: "network/offline failures", depth: intro }
  - { family: J-11, skill: "races/retry/timeouts", depth: intro }
glossary: [network-error, loading-state, request-timeout]
selfCheck: [which-state, request-states]

blocks:
  - id: three-failures
    kind: explanation
    title:
      uk: "Три різні способи не отримати дані"
      en: "Three different ways not to get the data"
    body:
      uk: |
        Запит може не вдатися трьома способами, і кожен видно по-своєму:

        | Що сталося | Що робить `fetch` | Що сказати людині |
        |---|---|---|
        | Сервер відповів помилкою (`500`, `404`) | **виконується**, `response.ok` — `false` | «Сервер не зміг відповісти (500). Спробуй пізніше.» |
        | Відповіді немає зовсім: немає інтернету, сервер недосяжний | **відхиляється** з `TypeError: Failed to fetch` — це [[network-error\|збій мережі]] | «Немає з’єднання. Перевір інтернет.» |
        | Відповідь «десь іде», але дуже довго | нічого — promise просто чекає | «Сервер не відповідає надто довго.» |

        Перші два випадки — різні проблеми з різними порадами, тож і повідомлення в них мають бути різні. А третій без захисту не закінчиться ніколи: «Завантаження…» висітиме, доки людина не піде. Для нього потрібен [[request-timeout|тайм-аут]] — межа очікування, після якої запит вважається невдалим.
      en: |
        A request can fail in three ways, and each one looks different:

        | What happened | What `fetch` does | What to tell the person |
        |---|---|---|
        | The server answered with an error (`500`, `404`) | **fulfills**, `response.ok` is `false` | “The server could not answer (500). Try again later.” |
        | There is no answer at all: no internet, the server is unreachable | **rejects** with `TypeError: Failed to fetch` — a [[network-error]] | “No connection. Check your internet.” |
        | The answer is “on its way” but takes very long | nothing — the promise just waits | “The server is taking too long to answer.” |

        The first two are different problems with different advice, so their messages must differ too. And the third never ends without protection: “Loading…” hangs until the person gives up. It needs a [[request-timeout]] — a limit on waiting after which the request counts as failed.

  - id: which-state
    kind: prediction
    prompt:
      uk: "Сторінка завантажує бажання з тайм-аутом **3 секунди** й показує окремі повідомлення для помилки сервера, відсутності з’єднання й тайм-ауту. Що побачить людина в чотирьох випадках: сервер відповідає одразу; сервер відповідає `500`; немає мережі; сервер відповідає лише через 10 секунд?"
      en: "A page loads wishes with a **3-second** timeout and shows separate messages for a server error, no connection and a timeout. What does the person see in four cases: the server answers at once; the server answers `500`; there is no network; the server answers only after 10 seconds?"
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "список · повідомлення про помилку сервера · «немає з’єднання» · через 3 с повідомлення про тайм-аут"
            en: "the list · the server-error message · “no connection” · after 3 s the timeout message"
        - id: http-rejects
          text:
            uk: "список · «немає з’єднання» · «немає з’єднання» · через 3 с повідомлення про тайм-аут"
            en: "the list · “no connection” · “no connection” · after 3 s the timeout message"
          why:
            uk: "На `500` `fetch` не відхиляється: сервер відповів, тож це помилка HTTP, а не відсутність з’єднання. Перевіряти треба `response.ok`."
            en: "On `500`, `fetch` does not reject: the server answered, so it is an HTTP error, not a lost connection. That is what `response.ok` is for."
        - id: wait-it-out
          text:
            uk: "список · повідомлення про помилку сервера · «немає з’єднання» · 10 с «Завантаження…», а потім список"
            en: "the list · the server-error message · “no connection” · “Loading…” for 10 s, then the list"
          why:
            uk: "Тайм-аут спрацьовує через 3 секунди й перетворює запит на помилку. Відповідь, що прийде через 10 секунд, уже запізнилася."
            en: "The timeout fires after 3 seconds and turns the request into an error. An answer that arrives after 10 seconds is already too late."
        - id: same-message
          text:
            uk: "список · одне спільне «щось пішло не так» для `500` і для відсутності мережі · через 3 с повідомлення про тайм-аут"
            en: "the list · one shared “something went wrong” for `500` and for no network · after 3 s the timeout message"
          why:
            uk: "Сторінка розрізняє ці випадки, і це правильно: при `500` винен сервер і варто зачекати, а без мережі людині треба перевірити своє з’єднання."
            en: "The page tells these cases apart, and rightly so: with `500` the server is at fault and waiting helps, while without a network the person needs to check their own connection."
      correct: [right]
    explanation:
      uk: "Відповідь `500` виконує `fetch` з `ok: false` — це помилка сервера. Без мережі `fetch` відхиляється з `TypeError` — це інша проблема й інша порада. А відповідь через 10 секунд не дочекається тайм-ауту в 3 секунди: о третій секунді сторінка покаже повідомлення про тайм-аут."
      en: "A `500` answer fulfills `fetch` with `ok: false` — a server error. Without a network `fetch` rejects with a `TypeError` — a different problem with different advice. And an answer after 10 seconds misses the 3-second timeout: at the third second the page shows the timeout message."

  - id: states-and-timeout
    kind: explanation
    title:
      uk: "Стани запиту й тайм-аут"
      en: "Request states and a timeout"
    body:
      uk: |
        Зручно описувати запит одним значенням — його [[loading-state|станом]]: `{ status: "loading" }`, `{ status: "success", items }`, `{ status: "error", kind }`. Одна функція малює сторінку за станом, а код запиту лише змінює стан: спершу «завантаження», потім «успіх» або «помилка». До першого запиту стан — «очікування»: нічого не показано.

        Для тайм-ауту в цьому уроці є готова функція `withTimeout(promise, ms)` у файлі `timeout.js`. Вона ставить таймер на `ms` і повертає новий promise, який завершується так само, як `promise`, — або відхиляється помилкою з назвою `TimeoutError`, якщо таймер спрацював раніше. Усередині — знайомі інструменти: `setTimeout`, `clearTimeout` (скасовує ще не виконаний таймер) і `.then` з двома callbacks — другий отримує причину відхилення.

        Важливо: `withTimeout` лише **перестає чекати**. Сам запит при цьому не зупиняється — як справді скасувати запит, побачиш у дев’ятому уроці.
      en: |
        It is handy to describe a request with one value — its [[loading-state|state]]: `{ status: "loading" }`, `{ status: "success", items }`, `{ status: "error", kind }`. One function draws the page from the state, and the request code only changes the state: first “loading”, then “success” or “error”. Before the first request the state is “idle”: nothing is shown.

        For the timeout this lesson has a ready function `withTimeout(promise, ms)` in the file `timeout.js`. It sets a timer for `ms` and returns a new promise that settles the same way as `promise` — or rejects with an error named `TimeoutError` if the timer fires first. Inside it are familiar tools: `setTimeout`, `clearTimeout` (cancels a timer that has not run yet) and `.then` with two callbacks — the second receives the rejection reason.

        Important: `withTimeout` only **stops waiting**. The request itself does not stop — how to really cancel a request you will see in lesson nine.

  - id: four-modes
    kind: visual
    visual: sequence
    title:
      uk: "Один запит — чотири кінцівки"
      en: "One request, four endings"
    textEquivalent:
      uk: "Код сторінки чотири рази запитує бажання, щоразу спершу показуючи стан «завантаження». Перший раз браузер надсилає GET, сервер відповідає 200 OK, fetch виконується з ok true, і сторінка показує список. Другий раз сервер відповідає 500 Internal Server Error; fetch усе одно виконується, але ok дорівнює false, і сторінка показує повідомлення про помилку сервера зі статусом. Третій раз мережі немає: запит не доходить до сервера, і fetch відхиляється з TypeError: Failed to fetch — сторінка показує «немає з’єднання». Четвертий раз сервер мовчить: через 3 секунди спрацьовує таймер тайм-ауту, очікування закінчується помилкою TimeoutError, і сторінка показує повідомлення про тайм-аут. Відповідь сервера через 10 секунд приходить уже запізно: стан сторінки від неї не змінюється, хоча сам запит увесь цей час тривав."
      en: "The page code asks for the wishes four times, each time first showing the “loading” state. The first time the browser sends GET, the server answers 200 OK, fetch fulfills with ok true, and the page shows the list. The second time the server answers 500 Internal Server Error; fetch still fulfills, but ok is false, and the page shows the server-error message with the status. The third time there is no network: the request never reaches the server, and fetch rejects with TypeError: Failed to fetch — the page shows “no connection”. The fourth time the server is silent: after 3 seconds the timeout timer fires, the waiting ends with a TimeoutError, and the page shows the timeout message. The server’s answer after 10 seconds arrives too late: it does not change the page’s state, although the request itself went on all that time."
    spec:
      actors:
        - { id: page, label: { uk: "Код сторінки", en: "Page code" } }
        - { id: browser, label: { uk: "Браузер", en: "Browser" } }
        - { id: server, label: { uk: "Сервер", en: "Server" } }
      intro:
        uk: "Той самий запит чотири рази — і чотири різні кінцівки. Перед кожним запитом сторінка показує стан «завантаження»."
        en: "The same request four times — and four different endings. Before each request the page shows the “loading” state."
      messages:
        - from: browser
          to: server
          label: "GET /lab/wishlist/items"
          kind: async
          caption:
            uk: "Перший запит: звичайний `GET`."
            en: "The first request: an ordinary `GET`."
        - from: server
          to: browser
          label: "200 OK"
          kind: return
          caption:
            uk: "Сервер відповідає `200` і списком бажань."
            en: "The server answers `200` with the list of wishes."
        - from: browser
          to: page
          label: "Response (ok: true)"
          kind: return
          note: { uk: "стан: success → список", en: "state: success → the list" }
          caption:
            uk: "`fetch` виконується, `ok` — `true`: стан «успіх», сторінка показує список."
            en: "`fetch` fulfills, `ok` is `true`: the state is “success”, the page shows the list."
        - from: server
          to: browser
          label: "500 Internal Server Error"
          kind: return
          caption:
            uk: "Другий запит: сервер відповідає `500`."
            en: "The second request: the server answers `500`."
        - from: browser
          to: page
          label: "Response (ok: false)"
          kind: return
          note: { uk: "стан: error, kind: http (500)", en: "state: error, kind: http (500)" }
          caption:
            uk: "`fetch` **виконується** — сервер же відповів, — але `ok` дорівнює `false`. Стан «помилка HTTP» з кодом `500`."
            en: "`fetch` **fulfills** — the server did answer — but `ok` is `false`. The state is “HTTP error” with the code `500`."
        - from: page
          to: browser
          label: "fetch(…) — offline"
          caption:
            uk: "Третій запит, але мережі немає."
            en: "The third request, but there is no network."
        - from: browser
          to: page
          label: "TypeError: Failed to fetch"
          kind: return
          note: { uk: "стан: error, kind: network", en: "state: error, kind: network" }
          caption:
            uk: "Запит не дійшов до сервера: `fetch` **відхиляється** з `TypeError`. Стан «немає з’єднання» — інше повідомлення й інша порада."
            en: "The request never reached the server: `fetch` **rejects** with a `TypeError`. The state is “no connection” — a different message and different advice."
        - from: browser
          to: server
          label: "GET /lab/wishlist/items"
          kind: async
          caption:
            uk: "Четвертий запит. Сервер мовчить."
            en: "The fourth request. The server is silent."
        - from: page
          to: page
          label: "3 s: TimeoutError"
          kind: note
          note: { uk: "стан: error, kind: timeout", en: "state: error, kind: timeout" }
          caption:
            uk: "Через 3 секунди спрацьовує таймер `withTimeout`: очікування закінчується помилкою `TimeoutError`, сторінка показує повідомлення про тайм-аут."
            en: "After 3 seconds the `withTimeout` timer fires: the waiting ends with a `TimeoutError`, and the page shows the timeout message."
        - from: server
          to: browser
          label: "200 OK (10 s)"
          kind: return
          caption:
            uk: "Відповідь приходить через 10 секунд — запізно: стан уже «помилка», і від неї нічого не змінюється. Але запит увесь цей час тривав — його не скасували."
            en: "The answer arrives after 10 seconds — too late: the state is already “error”, and nothing changes. But the request went on all that time — nobody cancelled it."

  - id: fixture-modes
    kind: example
    runtime: browser-js
    dir: fixture-modes
    entry: index.html
    capabilities: { network: lab }
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "П’ять режимів сервера", en: "Five server modes" }
      intro: { uk: "Кожна кнопка робить запит в одному режимі. Результат — у консолі.", en: "Each button makes a request in one mode. The result is in the console." }
      started: { uk: "запит пішов", en: "request sent" }
      answered: { uk: "сервер відповів", en: "the server answered" }
      rejected: { uk: "promise відхилено", en: "promise rejected" }
      ms: { uk: "мс", en: "ms" }
    title:
      uk: "Натисни кожен режим"
      en: "Press every mode"
    body:
      uk: |
        Кнопки роблять запит до навчального сервера в п’яти режимах (їх задає файл `lab-modes.js`): `ok` — відповідь одразу, `slow` — через 1,5 с, `error500` — статус 500, `offline` — без мережі, `hung` — відповідь лише через 10 с. Режим `offline` **імітовано**: навчальний сервер завжди доступний, тож функція відхиляється так само, як відхилився б справжній `fetch` без мережі.

        Запусти, відкрий **Сторінку** й натисни кожну кнопку. У **Консолі** порівняй: де сервер відповів (і з яким `ok`), а де promise відхилено — і з якою назвою помилки.
      en: |
        The buttons make a request to the lab server in five modes (set by the file `lab-modes.js`): `ok` — answers at once, `slow` — after 1.5 s, `error500` — status 500, `offline` — no network, `hung` — answers only after 10 s. The `offline` mode is **simulated**: the lab server is always reachable, so the function rejects the same way a real `fetch` would without a network.

        Run it, open the **Page** and press every button. In the **Console** compare: where the server answered (and with which `ok`), and where the promise was rejected — and with which error name.
    tryIt:
      uk: |
        1. Натисни `hung` і зачекай: через 3 секунди — `TimeoutError`, хоча сервер відповів би через 10.
        2. У `index.js` заміни `3000` на `1000` і натисни `slow`: звичайна повільна відповідь тепер не встигає. Затісний тайм-аут теж шкодить — добирай його під реальну швидкість сервера. Потім поверни `3000`.
      en: |
        1. Press `hung` and wait: after 3 seconds — a `TimeoutError`, although the server would have answered after 10.
        2. In `index.js` change `3000` to `1000` and press `slow`: an ordinary slow answer no longer makes it in time. A timeout that is too tight hurts too — fit it to the server’s real speed. Then put `3000` back.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: де показувати повідомлення"
      en: "Recall: where to show a message"
    items:
      - id: message-next-to-field
        from: js-06-16-capstone-ui
        prompt:
          uk: "Форма бажання перевіряє ціну й має показати «Ціна не може бути від’ємною». Де це повідомлення найкорисніше?"
          en: "A wish form validates the price and must show “The price cannot be negative”. Where is this message most useful?"
        answer:
          type: choice
          options:
            - id: next-to-field
              text:
                uk: "Біля поля ціни, пов’язане з ним через `aria-describedby`"
                en: "Next to the price field, tied to it with `aria-describedby`"
            - id: console
              text:
                uk: "У консолі через `console.log`"
                en: "In the console with `console.log`"
              why:
                uk: "Консоль бачить програміст, а не людина, що заповнює форму."
                en: "The console is seen by the programmer, not by the person filling in the form."
            - id: alert
              text:
                uk: "У вікні `alert`, яке треба закрити"
                en: "In an `alert` window that has to be closed"
              why:
                uk: "Після закриття вікна повідомлення зникає, а поле, якого воно стосується, ніяк не позначене."
                en: "Once the window is closed the message is gone, and the field it is about is not marked in any way."
            - id: top-of-page
              text:
                uk: "Угорі сторінки, без зв’язку з полем"
                en: "At the top of the page, not tied to the field"
              why:
                uk: "Людина з програмою читання з екрана, перейшовши до поля, повідомлення не почує: воно ні з чим не пов’язане."
                en: "A person using a screen reader will not hear the message on reaching the field: it is tied to nothing."
          correct: [next-to-field]
        explanation:
          uk: "Повідомлення має бути там, де людина щось може виправити, і пов’язане з цим місцем — тоді його побачать і почують. Зі станами запиту так само: повідомлення про помилку завантаження показують там, де мали з’явитися дані, у ділянці з `role=\"status\"`, щоб програма читання з екрана його оголосила."
          en: "A message belongs where the person can fix something, tied to that place — then it is seen and heard. Same with request states: a loading error is shown where the data should have appeared, in an area with `role=\"status\"`, so a screen reader announces it."

  - id: request-states
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: request-states
    entry: index.html
    editable: [index.js]
    capabilities: { network: lab }
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Бажання з мережі", en: "Wishes from the network" }
      modeLabel: { uk: "Режим сервера:", en: "Server mode:" }
      loadButton: { uk: "Завантажити бажання", en: "Load the wishes" }
      loading: { uk: "Завантаження…", en: "Loading…" }
      loaded: { uk: "Бажання завантажено.", en: "The wishes are loaded." }
      httpError: { uk: "Сервер не зміг відповісти. Спробуй пізніше.", en: "The server could not answer. Try again later." }
      networkError: { uk: "Немає з’єднання. Перевір інтернет.", en: "No connection. Check your internet." }
      timeoutError: { uk: "Сервер не відповідає надто довго.", en: "The server is taking too long to answer." }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    title:
      uk: "Стани запиту на сторінці"
      en: "Request states on the page"
    instructions:
      uk: |
        Допиши дві функції в `index.js`.

        1. `renderRequestState(state)` показує стан (форми станів описано в коментарі):
            - `loading` — текст «Завантаження…» в `#status` і порожній список;
            - `success` — текст «Бажання завантажено.» і в `#list` по пункту `<li>` з назвою кожного бажання;
            - `error` — порожній список і в `#status` повідомлення за `kind`: «Сервер не зміг відповісти. Спробуй пізніше.» із кодом статусу в дужках для `http`, «Немає з’єднання. Перевір інтернет.» для `network`, «Сервер не відповідає надто довго.» для `timeout`.
        2. `load(mode)` спершу показує стан `loading`, потім робить запит через `requestWishes` (готовий виклик — у коментарі над функцією), чекає на нього не довше 3000 мс через `withTimeout` і показує `success` (бажання — у властивості `items` тіла відповіді) або потрібну помилку.

        Обери режим у списку на **Сторінці** й перевір кожен вручну.
      en: |
        Complete two functions in `index.js`.

        1. `renderRequestState(state)` shows a state (the shapes of the states are in the comment):
            - `loading` — the text “Loading…” in `#status` and an empty list;
            - `success` — the text “The wishes are loaded.” and in `#list` one `<li>` item with the name of every wish;
            - `error` — an empty list and in `#status` a message by `kind`: “The server could not answer. Try again later.” with the status code in brackets for `http`, “No connection. Check your internet.” for `network`, “The server is taking too long to answer.” for `timeout`.
        2. `load(mode)` first shows the `loading` state, then makes the request with `requestWishes` (the ready call is in the comment above the function), waits for it no longer than 3000 ms with `withTimeout` and shows `success` (the wishes are in the `items` property of the response body) or the right error.

        Pick a mode in the list on the **Page** and check each one by hand.
    testTitles:
      "renderRequestState shows the loading text and an empty list":
        uk: "renderRequestState показує «Завантаження…» й порожній список"
        en: "renderRequestState shows the loading text and an empty list"
      "renderRequestState shows every wish on success":
        uk: "renderRequestState показує кожне бажання при успіху"
        en: "renderRequestState shows every wish on success"
      "renderRequestState shows three different error messages":
        uk: "renderRequestState показує три різні повідомлення про помилки"
        en: "renderRequestState shows three different error messages"
      "load shows the loading state while it waits":
        uk: "load показує стан завантаження, поки чекає"
        en: "load shows the loading state while it waits"
      "load shows the wishes when the server answers":
        uk: "load показує бажання, коли сервер відповів"
        en: "load shows the wishes when the server answers"
      "load shows the HTTP message with the status for a 500":
        uk: "load показує повідомлення про помилку сервера з кодом 500"
        en: "load shows the HTTP message with the status for a 500"
      "load shows the network message when offline":
        uk: "load показує «Немає з’єднання», коли мережі немає"
        en: "load shows the network message when offline"
      "load shows the timeout message after 3 seconds without an answer":
        uk: "load показує повідомлення про тайм-аут після 3 секунд без відповіді"
        en: "load shows the timeout message after 3 seconds without an answer"
    hints:
      nudge:
        uk: "У `load` є три можливі кінцівки після `await`: відповідь з `ok`, відповідь без `ok` і відхилення. Яка з них потрапляє в `catch` і як там відрізнити тайм-аут від мережі?"
        en: "`load` has three possible endings after `await`: a response with `ok`, a response without `ok`, and a rejection. Which of them lands in `catch`, and how do you tell a timeout from the network there?"
      explanation:
        uk: "Відповідь без `ok` не потрапляє в `catch` — її перевіряють окремою умовою одразу після `await`. У `catch` опиняються лише відхилення: `withTimeout` відхиляє помилкою з `name` рівним `\"TimeoutError\"`, а збій мережі — помилкою `TypeError`. Наприклад, обробник збереження нотатки міг би писати `if (error.name === \"TimeoutError\") showSlow(); else showOffline();`. Перед запитом не забудь показати стан `loading`."
        en: "A response without `ok` does not land in `catch` — it is checked with a separate condition right after `await`. Only rejections end up in `catch`: `withTimeout` rejects with an error whose `name` is `\"TimeoutError\"`, and a network failure with a `TypeError`. For example, a handler that saves a note could write `if (error.name === \"TimeoutError\") showSlow(); else showOffline();`. Do not forget to show the `loading` state before the request."
    solutionNote:
      uk: "`renderRequestState` малює сторінку лише за станом, а `load` лише змінює стан: «завантаження» → «успіх» або одна з трьох помилок. Відповідь не `ok` розпізнається умовою, бо `fetch` при ній виконується; збій мережі й тайм-аут — це відхилення, і їх розрізняє назва помилки."
      en: "`renderRequestState` draws the page from the state alone, and `load` only changes the state: “loading” → “success” or one of three errors. A response that is not `ok` is recognised by a condition, because `fetch` fulfills on it; a network failure and a timeout are rejections, told apart by the error’s name."
    feedback:
      - when: { test: "renderRequestState shows the loading text and an empty list" }
        message:
          uk: "Ця перевірка викликає `renderRequestState({ status: \"loading\" })` і очікує в `#status` рівно текст «Завантаження…», а в `#list` — жодного пункту."
          en: "This check calls `renderRequestState({ status: \"loading\" })` and expects exactly the text “Loading…” in `#status` and no items in `#list`."
      - when: { test: "renderRequestState shows every wish on success" }
        message:
          uk: "Ця перевірка очікує в `#list` по одному `<li>` з назвою (`name`) кожного бажання з `state.items`, у тому самому порядку."
          en: "This check expects one `<li>` in `#list` with the `name` of every wish from `state.items`, in the same order."
      - when: { test: "renderRequestState shows three different error messages" }
        message:
          uk: "Ця перевірка очікує для `http` повідомлення про сервер із кодом статусу, для `network` — «Немає з’єднання…», для `timeout` — «Сервер не відповідає надто довго.», а список — порожній."
          en: "This check expects the server message with the status code for `http`, “No connection…” for `network`, “The server is taking too long to answer.” for `timeout`, and an empty list."
      - when: { test: "load shows the loading state while it waits" }
        message:
          uk: "Ця перевірка очікує «Завантаження…» в `#status` одразу після виклику `load`, ще до відповіді сервера."
          en: "This check expects “Loading…” in `#status` right after `load` is called, before the server answers."
      - when: { test: "load shows the wishes when the server answers" }
        message:
          uk: "Ця перевірка очікує, що після відповіді `200` у списку будуть назви бажань із властивості `items` тіла відповіді."
          en: "This check expects the names of the wishes from the `items` property of the response body in the list after a `200` answer."
      - when: { test: "load shows the HTTP message with the status for a 500" }
        message:
          uk: "Ця перевірка очікує після відповіді `500` повідомлення про помилку сервера з кодом `500`. Пам’ятай: при `500` `fetch` виконується, тож у `catch` така відповідь не потрапляє — перевір `response.ok`."
          en: "This check expects the server-error message with the code `500` after a `500` answer. Remember: on `500` `fetch` fulfills, so such a response never reaches `catch` — check `response.ok`."
      - when: { test: "load shows the network message when offline" }
        message:
          uk: "Ця перевірка очікує «Немає з’єднання. Перевір інтернет.» у режимі `offline`, де promise відхиляється з `TypeError`."
          en: "This check expects “No connection. Check your internet.” in the `offline` mode, where the promise rejects with a `TypeError`."
      - when: { test: "load shows the timeout message after 3 seconds without an answer" }
        message:
          uk: "Ця перевірка очікує, що через 2999 мс без відповіді сторінка ще показує «Завантаження…», а через 3000 мс — повідомлення про тайм-аут. Чекай на запит через `withTimeout(…, 3000)` і розпізнай помилку з назвою `TimeoutError`."
          en: "This check expects “Loading…” after 2999 ms without an answer and the timeout message after 3000 ms. Wait for the request through `withTimeout(…, 3000)` and recognise the error named `TimeoutError`."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` означає, що значення має не той тип, на який розраховує код. Якщо бачиш `… is not a function`, програма зупинилася ще під час завантаження — виправ спершу помилку з картки «Помилка під час виконання». Якщо `… is not iterable`, перевір, що в стан `success` потрапляє масив `items`."
          en: "A `TypeError` means a value has a different type than the code expects. If you see `… is not a function`, the program stopped while loading — fix the error from the card “Error while running” first. If it says `… is not iterable`, check that the `success` state receives the `items` array."

