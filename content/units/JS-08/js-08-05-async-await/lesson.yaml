id: js-08-05-async-await
unit: JS-08
title:
  uk: "async/await без блокування програми"
  en: "async/await"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Переписати ланцюжок promises як async-функцію з `await` і `try/catch/finally`, що поводиться так само, зокрема при відхиленні."
    en: "Rewrite a promise chain as an async function with `await` and `try/catch/finally` that behaves identically on rejection."
  - uk: "Передбачити, який код виконується, поки async-функція чекає на `await`, і що вона повертає коду, який її викликав."
    en: "Predict which code runs while an async function is paused at `await`, and what the function returns to its caller."
prerequisites: [js-08-04-microtasks-vs-tasks, js-07-03-try-catch-finally]
subskills:
  - { family: J-11, skill: "async/await", depth: intro }
glossary: [async-function, await]
selfCheck: [who-waits, async-label]

blocks:
  - id: pause-this-function
    kind: explanation
    title:
      uk: "await зупиняє лише свою функцію"
      en: "await pauses only its own function"
    body:
      uk: |
        Ланцюжки `.then` працюють, але читати їх важче за звичайний код. [[async-function|Async-функція]] дає писати асинхронний код згори донизу:

        ```js
        async function habitName(id) {
          const habit = await findHabit(id);
          return habit.name;
        }

        habitName("h-01").then((name) => console.log(name));
        ```

        - [[await]] стоїть перед promise. Він **призупиняє саме цю функцію**, доки promise не завершиться, і дає його значення — тут об’єкт звички.
        - Поки функція чекає, решта програми працює: код, що її викликав, іде далі, сторінка реагує на кліки.
        - Async-функція **завжди повертає promise**. `return habit.name` не віддає назву негайно — він виконує цей promise назвою. Тому результат отримують через `.then` або через `await` в іншій async-функції.

        `await` можна писати лише всередині async-функції або на найвищому рівні модуля (файла з кодом).
      en: |
        `.then` chains work, but they are harder to read than ordinary code. An [[async-function]] lets you write asynchronous code top to bottom:

        ```js
        async function habitName(id) {
          const habit = await findHabit(id);
          return habit.name;
        }

        habitName("h-01").then((name) => console.log(name));
        ```

        - [[await]] goes in front of a promise. It **pauses this one function** until the promise settles and gives its value — here the habit object.
        - While the function waits, the rest of the program keeps working: the code that called it goes on, and the page reacts to clicks.
        - An async function **always returns a promise**. `return habit.name` does not hand over the name at once — it fulfills that promise with the name. So the result is taken with `.then` or with `await` in another async function.

        `await` can be written only inside an async function or at the top level of a module (a file of code).

  - id: who-waits
    kind: prediction
    prompt:
      uk: "`main` викликає async-функцію `load`, але **не** чекає на неї. У якому порядку з’являться повідомлення?"
      en: "`main` calls the async function `load` but does **not** wait for it. In what order do the messages appear?"
    code: |
      function delay(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function load() {
        console.log("load: start");
        await delay(100);
        console.log("load: done");
      }

      function main() {
        console.log("main: start");
        load();
        console.log("main: end");
      }

      main();
    verify:
      logs: ["main: start", "load: start", "main: end", "load: done"]
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "`main: start`, `load: start`, `main: end`, `load: done`"
            en: "`main: start`, `load: start`, `main: end`, `load: done`"
        - id: await-blocks-all
          text:
            uk: "`main: start`, `load: start`, `load: done`, `main: end`"
            en: "`main: start`, `load: start`, `load: done`, `main: end`"
          why:
            uk: "`await` зупиняє лише `load`. `main` її результату не чекає й одразу йде далі, тож `main: end` з’являється, поки `load` ще чекає."
            en: "`await` pauses only `load`. `main` does not wait for its result and goes on at once, so `main: end` appears while `load` is still waiting."
        - id: async-starts-later
          text:
            uk: "`main: start`, `main: end`, `load: start`, `load: done`"
            en: "`main: start`, `main: end`, `load: start`, `load: done`"
          why:
            uk: "Async-функція починає виконуватися одразу, синхронно, — аж до першого `await`. Тому `load: start` друкується ще всередині виклику `load()`."
            en: "An async function starts running at once, synchronously — up to its first `await`. So `load: start` is printed during the call `load()` itself."
      correct: [right]
    explanation:
      uk: "`load()` виконується синхронно до першого `await`: `load: start`. На `await` вона зупиняється й повертає `main` promise, що ще чекає. `main` не чекає на нього й друкує `main: end`. Через 100 мс `load` продовжується з того самого місця: `load: done`."
      en: "`load()` runs synchronously up to its first `await`: `load: start`. At `await` it pauses and returns a still-pending promise to `main`. `main` does not wait for it and prints `main: end`. After 100 ms `load` resumes right where it stopped: `load: done`."

  - id: pause-steps
    kind: visual
    visual: event-loop
    title:
      uk: "Async-функція на паузі не займає стек"
      en: "A paused async function does not hold the stack"
    textEquivalent:
      uk: "Код файла друкує main: start і викликає load. Async-функція load виконується синхронно: створює змінну count зі значенням 3 і друкує load: wait. На await delay(100) вона викликає delay, яка ставить таймер на 100 мс у Web APIs, і зупиняється: кадр load залишає стек, а її змінні зберігаються. Виклик load() повертає коду файла promise у стані pending, і той друкує main: end. Стек порожній. Поки таймер відлічує, користувач клікає кнопку на сторінці — це дія людини, а не рядок цього коду: обробник кліку стає в чергу задач і одразу виконується, бо стек вільний. Через 100 мс callback таймера виконується й викликає resolve; promise виконано, і продовження функції load стає в чергу microtasks. Воно виконується зі збереженою змінною count і друкує load: back 3. У консолі: main: start, load: wait, main: end, load: back 3."
      en: "The file’s code prints main: start and calls load. The async function load runs synchronously: it creates the variable count with the value 3 and prints load: wait. At await delay(100) it calls delay, which puts a 100 ms timer into the Web APIs, and pauses: the frame of load leaves the stack, and its variables are kept. The call load() returns a pending promise to the file’s code, which prints main: end. The stack is empty. While the timer counts, the user clicks a button on the page — a person’s action, not a line of this code: the click handler joins the task queue and runs at once, because the stack is free. After 100 ms the timer callback runs and calls resolve; the promise is fulfilled, and the rest of load joins the microtask queue. It runs with the kept variable count and prints load: back 3. The console shows: main: start, load: wait, main: end, load: back 3."
    spec:
      file: visuals/pause.js
      steps:
        - line: 14
          log: "main: start"
          caption:
            uk: "Код файла друкує `main: start`."
            en: "The file’s code prints `main: start`."
          stack: ["pause.js"]
        - line: 9
          log: "load: wait"
          caption:
            uk: "`load()` починає виконуватися одразу: створює `count = 3` і друкує `load: wait`."
            en: "`load()` starts at once: it creates `count = 3` and prints `load: wait`."
          stack: ["pause.js", "load"]
        - line: 3
          caption:
            uk: "`delay(100)` реєструє таймер на 100 мс і повертає promise."
            en: "`delay(100)` registers a 100 ms timer and returns a promise."
          stack: ["pause.js", "load", "delay"]
          webApis: ["timer 100 ms"]
        - line: 10
          caption:
            uk: "`await` бачить promise, що ще чекає, і **призупиняє `load`**: її кадр залишає стек, а змінна `count` зберігається. Виклик `load()` повертає коду файла promise у стані `pending`."
            en: "`await` sees a promise that is still pending and **pauses `load`**: its frame leaves the stack, and the variable `count` is kept. The call `load()` returns a `pending` promise to the file’s code."
          stack: ["pause.js"]
          webApis: ["timer 100 ms"]
        - line: 16
          log: "main: end"
          caption:
            uk: "Код файла не чекає на `load` і друкує `main: end`."
            en: "The file’s code does not wait for `load` and prints `main: end`."
          stack: ["pause.js"]
          webApis: ["timer 100 ms"]
        - caption:
            uk: "Стек порожній. Ти клікаєш кнопку на сторінці — це твоя дія, а не рядок цього коду. Обробник кліку стає в **Tasks**."
            en: "The stack is empty. You click a button on the page — your action, not a line of this code. The click handler joins **Tasks**."
          stack: []
          webApis: ["timer 100 ms"]
          tasks: ["click handler"]
        - caption:
            uk: "Стек вільний, тож обробник кліку виконується одразу: сторінка реагує, хоча `load` ще чекає."
            en: "The stack is free, so the click handler runs at once: the page responds while `load` is still waiting."
          stack: ["click handler"]
          webApis: ["timer 100 ms"]
        - caption:
            uk: "Минуло 100 мс: callback таймера стає в **Tasks**."
            en: "100 ms have passed: the timer callback joins **Tasks**."
          stack: []
          tasks: ["timer callback"]
        - line: 3
          caption:
            uk: "Callback таймера викликає `resolve`: promise виконано, і **продовження `load`** стає в **Microtasks**."
            en: "The timer callback calls `resolve`: the promise is fulfilled, and **the rest of `load`** joins **Microtasks**."
          stack: ["timer callback"]
          microtasks: ["load after await"]
        - line: 11
          log: "load: back 3"
          caption:
            uk: "`load` продовжується з рядка після `await` — зі своєю змінною `count`: у консолі `load: back 3`."
            en: "`load` resumes on the line after `await` — with its own variable `count`: `load: back 3` appears."
          stack: ["load after await"]
        - caption:
            uk: "Готово. `await` не блокував програму: поки `load` чекала, код файла закінчився, а клік спрацював."
            en: "Done. `await` did not block the program: while `load` waited, the file’s code finished and the click was handled."
          stack: []

  - id: returns-promise
    kind: prediction
    prompt:
      uk: "Async-функція повертає число `42`. Що надрукує код?"
      en: "An async function returns the number `42`. What does the code print?"
    code: |
      async function total() {
        return 42;
      }

      const result = total();
      console.log(result instanceof Promise, result === 42);
    verify:
      logs: ["true false"]
    answer:
      type: choice
      options:
        - id: promise
          text:
            uk: "`true false`"
            en: "`true false`"
        - id: number
          text:
            uk: "`false true`"
            en: "`false true`"
          why:
            uk: "Async-функція завжди повертає promise. Число `42` стає значенням цього promise, а не результатом самого виклику."
            en: "An async function always returns a promise. The number `42` becomes that promise’s value, not the result of the call itself."
        - id: both
          text:
            uk: "`true true`"
            en: "`true true`"
          why:
            uk: "Promise і число — різні значення. `===` порівнює саме те, що повернув виклик, — об’єкт promise."
            en: "A promise and a number are different values. `===` compares exactly what the call returned — the promise object."
      correct: [promise]
    explanation:
      uk: "`total()` повертає promise, виконаний значенням `42`. Отримати саме число можна через `total().then(...)` або через `await total()` в іншій async-функції."
      en: "`total()` returns a promise fulfilled with `42`. To get the number itself, use `total().then(...)` or `await total()` in another async function."

  - id: stay-responsive
    kind: example
    runtime: browser-js
    dir: stay-responsive
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Завантаження без заморозки", en: "Loading without freezing" }
      loadButton: { uk: "Завантажити", en: "Load" }
      clicks: { uk: "Кліків:", en: "Clicks:" }
      loading: { uk: "Завантаження…", en: "Loading…" }
      loaded: { uk: "Готово: 6 бажань", en: "Done: 6 wishes" }
      waiting: { uk: "чекаю", en: "waiting" }
      done: { uk: "готово", en: "done" }
      before: { uk: "обробник: до load()", en: "handler: before load()" }
      after: { uk: "обробник: після load()", en: "handler: after load()" }
    title:
      uk: "Клікай, поки load чекає"
      en: "Click while load waits"
    body:
      uk: |
        Натисни **Запустити**, відкрий вкладку **Сторінка** й натисни «Завантажити». `load` секунду чекає на `await`. Поклікай у цей час лічильник: число росте одразу — сторінка не заморожена, на відміну від циклу з першого уроку.

        У **Консолі** видно, що обробник кнопки друкує «після load()» ще до того, як `load` закінчилася: він на неї не чекає.
      en: |
        Press **Run**, open the **Page** tab and press “Load”. `load` waits a second at `await`. Click the counter meanwhile: the number goes up at once — the page is not frozen, unlike the loop of the first lesson.

        The **Console** shows that the button’s handler prints “after load()” before `load` has finished: it does not wait for it.
    tryIt:
      uk: |
        1. В обробнику кнопки «Завантажити» постав `await` перед `load()` і запусти знову. Тепер «після load()» друкується лише після «готово»: обробник чекає, але лічильник і далі клікається.
        2. Заміни `1000` у `load` на `3000`, натисни «Завантажити» й кілька разів клікни лічильник: сторінка реагує всі три секунди.
      en: |
        1. In the handler of the “Load” button put `await` in front of `load()` and run again. Now “after load()” is printed only after “done”: the handler waits, but the counter is still clickable.
        2. Change `1000` in `load` to `3000`, press “Load” and click the counter a few times: the page responds for all three seconds.

  - id: try-around-await
    kind: explanation
    title:
      uk: "Помилки й прибирання: try/catch/finally навколо await"
      en: "Errors and cleanup: try/catch/finally around await"
    body:
      uk: |
        Якщо promise після `await` відхилено, `await` **кидає** причину відхилення — як `throw`. Тож перехоплюють її звичайним [[try-catch|try/catch]], а прибирають у `finally`:

        | Ланцюжок | Async-функція |
        |---|---|
        | `.then((value) => …)` | `const value = await …;` і код нижче |
        | `.catch((error) => …)` | `catch (error) { … }` |
        | `.finally(() => …)` | `finally { … }` |

        ```js
        async function showHabit(id) {
          try {
            const habit = await findHabit(id);
            console.log(habit.name);
          } catch (error) {
            console.log("not found:", error.message);
          }
        }
        ```

        Є й бонус: `try` перехоплює і відхилений promise, і помилку, яку кинуто **синхронно**, ще до будь-якого promise. Ланцюжок `.catch` бачить лише відхилення.
      en: |
        If the promise after `await` is rejected, `await` **throws** the rejection reason — like `throw`. So it is caught with an ordinary [[try-catch|try/catch]], and cleanup goes in `finally`:

        | Chain | Async function |
        |---|---|
        | `.then((value) => …)` | `const value = await …;` and the code below |
        | `.catch((error) => …)` | `catch (error) { … }` |
        | `.finally(() => …)` | `finally { … }` |

        ```js
        async function showHabit(id) {
          try {
            const habit = await findHabit(id);
            console.log(habit.name);
          } catch (error) {
            console.log("not found:", error.message);
          }
        }
        ```

        There is a bonus too: `try` catches both a rejected promise and an error thrown **synchronously**, before any promise exists. A `.catch` in a chain sees only rejections.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: try/catch"
      en: "Recall: try/catch"
    items:
      - id: catch-and-continue
        from: js-07-03-try-catch-finally
        prompt:
          uk: "Друга спроба кидає помилку. Що з’явиться в консолі?"
          en: "The second attempt throws an error. What appears in the console?"
        code: |
          function readId(text) {
            try {
              const record = JSON.parse(text);
              console.log("ok", record.id);
            } catch (error) {
              console.log("bad:", error.name);
            }
          }

          readId('{"id": "w-01"}');
          readId("{id: w-01}");
          console.log("end");
        verify:
          logs: ["ok w-01", "bad: SyntaxError", "end"]
        answer:
          type: choice
          options:
            - id: caught
              text:
                uk: "`ok w-01`, `bad: SyntaxError`, `end`"
                en: "`ok w-01`, `bad: SyntaxError`, `end`"
            - id: stops
              text:
                uk: "`ok w-01`, а потім картка з `SyntaxError`"
                en: "`ok w-01`, then a card with `SyntaxError`"
              why:
                uk: "Помилку кинуто всередині `try`, тож її перехоплює `catch`. Програма не зупиняється, і `end` теж друкується."
                en: "The error is thrown inside `try`, so `catch` takes it. The program does not stop, and `end` is printed too."
            - id: skips-end
              text:
                uk: "`ok w-01`, `bad: SyntaxError`"
                en: "`ok w-01`, `bad: SyntaxError`"
              why:
                uk: "Після `catch` функція нормально завершується, і код файла йде далі — до `end`."
                en: "After `catch` the function ends normally, and the file’s code goes on — to `end`."
          correct: [caught]
        explanation:
          uk: "`JSON.parse` кидає `SyntaxError` на тексті без лапок навколо назв полів. `try` передає помилку в `catch`, функція закінчується нормально, і програма йде далі. З `await` так само: відхилений promise кидає помилку в рядку з `await`, а `catch` її перехоплює."
          en: "`JSON.parse` throws a `SyntaxError` on text without quotes around the field names. `try` hands the error to `catch`, the function ends normally, and the program goes on. Same with `await`: a rejected promise throws on the line with `await`, and `catch` takes it."

  - id: async-label
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: async-label
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      noDate: { uk: "без терміну", en: "no due date" }
      notFound: { uk: "справу не знайдено", en: "task not found" }
    title:
      uk: "Ланцюжок стає async-функцією"
      en: "The chain becomes an async function"
    instructions:
      uk: |
        `loadLabel(id)` написано ланцюжком `.then/.catch/.finally`. Перепиши її як async-функцію з `await` і `try/catch/finally`. Вона має й далі:

        - повертати promise з підписом справи (`formatLabel`) для знайденої справи;
        - давати текст «справу не знайдено» для невідомого `id`;
        - тримати `loading` рівним `true`, поки справа завантажується, і повертати `false` після будь-якого результату.

        А ще одне нове: `findTask` **одразу кидає** `TypeError`, якщо `id` — не текст (наприклад, `42`). Для такого `id` `loadLabel` теж має повертати promise з текстом «справу не знайдено», а не кидати помилку. Ланцюжок цього не вміє.
      en: |
        `loadLabel(id)` is written as a `.then/.catch/.finally` chain. Rewrite it as an async function with `await` and `try/catch/finally`. It must still:

        - return a promise with the task’s label (`formatLabel`) for a task that is found;
        - give the text “task not found” for an unknown `id`;
        - keep `loading` equal to `true` while the task loads and set it back to `false` after any outcome.

        And one new thing: `findTask` **throws a `TypeError` at once** when `id` is not text (for example, `42`). For such an `id`, `loadLabel` must also return a promise with “task not found” instead of throwing. The chain cannot do that.
    testTitles:
      "gives the label of a known task":
        uk: "Для відомої справи дає її підпис"
        en: "Gives the label of a known task"
      "gives the not-found text for an unknown id":
        uk: "Для невідомого id дає текст «справу не знайдено»"
        en: "Gives the not-found text for an unknown id"
      "gives the not-found text for an id that is not text":
        uk: "Для id, що не є текстом, дає текст «справу не знайдено»"
        en: "Gives the not-found text for an id that is not text"
      "loading is true while the task loads":
        uk: "Поки справа завантажується, loading дорівнює true"
        en: "loading is true while the task loads"
      "loading is false again after every outcome":
        uk: "Після будь-якого результату loading знову false"
        en: "loading is false again after every outcome"
    hints:
      nudge:
        uk: "Почни з `async` перед `function`. Яким рядком коду отримати справу з `findTask(id)`, не пишучи `.then`?"
        en: "Start with `async` in front of `function`. Which line of code gets the task from `findTask(id)` without writing `.then`?"
      explanation:
        uk: "Кожен крок ланцюжка має місце у `try/catch/finally`: значення з `.then` дає `await` у `try`, запасне значення з `.catch` повертає блок `catch`, а прибирання з `.finally` переїжджає в блок `finally`. Наприклад, у функції, що рахує серію звички, `try` чекає на звичку й повертає серію, `catch` повертає `-1`, а `finally` ховає індикатор. Синхронна помилка з `findTask` усередині `try` теж потрапить у `catch`."
        en: "Every step of the chain has a place in `try/catch/finally`: the value from `.then` comes from `await` inside `try`, the fallback from `.catch` is returned by the `catch` block, and the cleanup from `.finally` moves into the `finally` block. For example, in a function that computes a habit’s streak, `try` awaits the habit and returns the streak, `catch` returns `-1`, and `finally` hides the indicator. A synchronous error from `findTask` inside `try` also lands in `catch`."
    solutionNote:
      uk: "`await findTask(id)` усередині `try` дає справу або кидає помилку — і відхилення, і синхронну `TypeError` перехоплює `catch`, що повертає запасний текст. `finally` вимикає `loading` за будь-якого результату. Async-функція завжди повертає promise, тож навіть для `42` викликач отримує promise, а не помилку."
      en: "`await findTask(id)` inside `try` gives the task or throws — `catch` takes both the rejection and the synchronous `TypeError` and returns the fallback text. `finally` switches `loading` off whatever happens. An async function always returns a promise, so even for `42` the caller gets a promise, not an error."
    feedback:
      - when: { test: "gives the label of a known task" }
        message:
          uk: "Ця перевірка очікує, що `loadLabel(\"t-01\")` виконується текстом від `formatLabel` для цієї справи. Якщо в підписі `undefined`, `formatLabel` отримала не справу, а promise: перед `findTask(id)` бракує `await`."
          en: "This check expects `loadLabel(\"t-01\")` to be fulfilled with the text `formatLabel` gives for that task. If the label contains `undefined`, `formatLabel` received a promise instead of a task: `findTask(id)` needs `await` in front of it."
      - when: { test: "gives the not-found text for an unknown id" }
        message:
          uk: "Ця перевірка очікує, що для `\"t-99\"` promise виконується текстом «справу не знайдено», а не відхиляється. Помилку з `await` перехоплює блок `catch`."
          en: "This check expects the promise for `\"t-99\"` to be fulfilled with “task not found”, not rejected. The error from `await` is taken by a `catch` block."
      - when: { test: "gives the not-found text for an id that is not text" }
        message:
          uk: "Ця перевірка викликає `loadLabel(42)` і очікує promise з текстом «справу не знайдено». Якщо виклик одразу кидає `TypeError`, `findTask` викликається поза `try` async-функції — як у ланцюжку."
          en: "This check calls `loadLabel(42)` and expects a promise with “task not found”. If the call throws a `TypeError` at once, `findTask` is called outside the `try` of an async function — as in the chain."
      - when: { test: "loading is true while the task loads" }
        message:
          uk: "Ця перевірка очікує, що одразу після виклику `loadLabel` змінна `loading` дорівнює `true`, а функція повертає promise."
          en: "This check expects the variable `loading` to be `true` right after `loadLabel` is called, and the function to return a promise."
      - when: { test: "loading is false again after every outcome" }
        message:
          uk: "Ця перевірка очікує `loading === false` після знайденої справи, після невідомого `id` і після `id`, що не є текстом. Прибирання, що має відбутися завжди, пишуть у блоці `finally`."
          en: "This check expects `loading === false` after a found task, after an unknown `id` and after an `id` that is not text. Cleanup that must always happen goes in a `finally` block."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` означає, що значення має не той тип, на який розраховує код. Якщо бачиш `… is not a function`, програма зупинилася ще під час завантаження — виправ спершу помилку з картки «Помилка під час виконання». Якщо в повідомленні `task id must be text`, цю помилку має перехопити `catch` усередині `loadLabel`."
          en: "A `TypeError` means a value has a different type than the code expects. If you see `… is not a function`, the program stopped while loading — fix the error from the card “Error while running” first. If the message says `task id must be text`, that error has to be caught by a `catch` inside `loadLabel`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-08
    body:
      uk: "У проєкті функція завантаження записів буде async-функцією: `await` для даних, `catch` для зрозумілого повідомлення про помилку, `finally` для «Завантаження…». Пам’ятай, що вона повертає promise: код, якому потрібні записи, теж має на нього чекати."
      en: "In your project the function that loads records will be an async function: `await` for the data, `catch` for a clear error message, `finally` for “Loading…”. Remember that it returns a promise: code that needs the records must wait for it too."
