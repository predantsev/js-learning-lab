  - id: sequential-concurrent
    kind: explanation
    title:
      uk: "По черзі чи разом"
      en: "One after another or together"
    body:
      uk: |
        `await` усередині циклу чекає кожен запит, перш ніж почати наступний. Три запити по 300, 200 і 100 мс триватимуть разом близько 600 мс:

        ```js
        const lists = [];
        for (const url of urls) {
          lists.push(await getItems(url)); // the next one starts only after this one answers
        }
        ```

        Якщо запити не залежать один від одного, їх запускають **разом** — це [[concurrent-requests|паралельні запити]] — і лише потім чекають на всі. `map` викликає `getItems` для кожної адреси одразу й дає масив promises:

        ```js
        const lists = await Promise.all(urls.map((url) => getItems(url)));
        ```

        Тепер загальний час — як у найповільнішого, близько 300 мс. По черзі запити роблять лише тоді, коли наступному потрібен результат попереднього.
      en: |
        `await` inside a loop waits for each request before starting the next one. Three requests of 300, 200 and 100 ms take about 600 ms together:

        ```js
        const lists = [];
        for (const url of urls) {
          lists.push(await getItems(url)); // the next one starts only after this one answers
        }
        ```

        If the requests do not depend on each other, they are started **together** — these are [[concurrent-requests]] — and only then awaited all at once. `map` calls `getItems` for every address at once and gives an array of promises:

        ```js
        const lists = await Promise.all(urls.map((url) => getItems(url)));
        ```

        Now the total time is that of the slowest, about 300 ms. Requests go one after another only when the next one needs the previous one’s result.

  - id: measure-times
    kind: example
    runtime: browser-js
    dir: measure-times
    entry: index.js
    capabilities: { network: lab }
    strings:
      lang: { uk: "uk", en: "en" }
      sequential: { uk: "по черзі:", en: "one after another:" }
      concurrent: { uk: "разом:", en: "together:" }
      counts: { uk: "записів у кожній відповіді:", en: "records in each answer:" }
      ms: { uk: "мс", en: "ms" }
    title:
      uk: "Виміряй різницю"
      en: "Measure the difference"
    body:
      uk: |
        Три справжні запити до навчального сервера відповідають через 300, 200 і 100 мс. Спершу програма чекає на них по черзі в циклі, потім запускає разом через `map` і `Promise.all`. Запусти й порівняй два числа в **Консолі** — точні мілісекунди щоразу трохи інші.
      en: |
        Three real requests to the lab server answer after 300, 200 and 100 ms. First the program awaits them one by one in a loop, then starts them together with `map` and `Promise.all`. Run it and compare the two numbers in the **Console** — the exact milliseconds differ a little every time.
    tryIt:
      uk: |
        1. Заміни `delay=300` на `delay=900` і запусти: «по черзі» виросте на 600 мс, «разом» — лише до приблизно 900.
        2. Заміни `Promise.all` на `Promise.allSettled`, а в останньому рядку коду — `items.length` на `items.status`. Тепер кожен елемент `together` — опис результату: друкуються три `fulfilled`.
      en: |
        1. Change `delay=300` to `delay=900` and run: “one after another” grows by 600 ms, “together” only to about 900.
        2. Replace `Promise.all` with `Promise.allSettled`, and on the last line of code replace `items.length` with `items.status`. Now every element of `together` is a result description: three `fulfilled` are printed.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: що повертає map"
      en: "Recall: what map returns"
    items:
      - id: map-without-return
        from: js-05-01-map
        prompt:
          uk: "Callback для `map` записано з фігурними дужками. Що надрукує код?"
          en: "The callback for `map` is written with curly braces. What does the code print?"
        code: |
          const doubled = [1, 2, 3].map((n) => {
            n * 2;
          });
          console.log(doubled);
        verify:
          logs: ["[undefined, undefined, undefined]"]
        answer:
          type: choice
          options:
            - id: undefineds
              text:
                uk: "`[undefined, undefined, undefined]`"
                en: "`[undefined, undefined, undefined]`"
            - id: doubled
              text:
                uk: "`[2, 4, 6]`"
                en: "`[2, 4, 6]`"
              why:
                uk: "У фігурних дужках потрібен `return`. Без нього callback для кожного елемента повертає `undefined`."
                en: "Inside curly braces you need `return`. Without it the callback returns `undefined` for every element."
            - id: same
              text:
                uk: "`[1, 2, 3]`"
                en: "`[1, 2, 3]`"
              why:
                uk: "`map` будує **новий** масив із того, що повертає callback, а не з початкових елементів."
                en: "`map` builds a **new** array from what the callback returns, not from the original elements."
          correct: [undefineds]
        explanation:
          uk: "`map` збирає в новий масив те, що повернув callback. Із фігурними дужками без `return` це `undefined`. Та сама пастка чекає з запитами: `urls.map((url) => { getItems(url); })` дає масив `undefined`, і `Promise.all` «виконується» миттєво, нічого не дочекавшись."
          en: "`map` collects what the callback returned into a new array. With curly braces and no `return` that is `undefined`. The same trap waits with requests: `urls.map((url) => { getItems(url); })` gives an array of `undefined`, and `Promise.all` “fulfills” instantly without waiting for anything."

  - id: dashboard
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: dashboard
    entry: index.html
    editable: [index.js]
    capabilities: { network: lab }
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Зведення", en: "Dashboard" }
      loadedHeading: { uk: "Завантажено", en: "Loaded" }
      failedHeading: { uk: "Не вдалося завантажити", en: "Could not load" }
      wishes: { uk: "Бажання", en: "Wishes" }
      tasks: { uk: "Справи", en: "Tasks" }
      habits: { uk: "Звички", en: "Habits" }
    title:
      uk: "Зведення, що переживає часткову невдачу"
      en: "A dashboard that survives a partial failure"
    instructions:
      uk: |
        Допиши `loadDashboard()`:

        - запусти запити до всіх трьох адрес із `SOURCES` **одночасно** (готова функція `getJson` відхиляється, якщо відповідь не `ok` або немає мережі);
        - дочекайся, доки завершаться **всі**;
        - для кожного джерела, що відповіло, додай у `counts` об’єкт `{ label, count }`, де `count` — кількість записів у `items` тіла відповіді; назву кожного джерела, що не відповіло, додай у `failed`;
        - покажи результат через готову `renderDashboard(counts, failed)`.

        Перевірки підставлять відповідь `500` чи відсутність мережі для одного з джерел і стежитимуть, коли стартують запити.
      en: |
        Complete `loadDashboard()`:

        - start the requests to all three addresses in `SOURCES` **at the same time** (the ready function `getJson` rejects when the response is not `ok` or there is no network);
        - wait until **all** of them have settled;
        - for every source that answered, add an object `{ label, count }` to `counts`, where `count` is the number of records in `items` of the response body; add the label of every source that failed to `failed`;
        - show the result with the ready `renderDashboard(counts, failed)`.

        The checks will put in a `500` answer or a missing network for one of the sources and watch when the requests start.
    testTitles:
      "starts all three requests before any of them answers":
        uk: "Запускає всі три запити ще до першої відповіді"
        en: "Starts all three requests before any of them answers"
      "shows the count of every source when nothing fails":
        uk: "Показує кількість для кожного джерела, коли все вдалося"
        en: "Shows the count of every source when nothing fails"
      "shows the others and lists the source that answered 500":
        uk: "Показує решту й називає джерело, що відповіло 500"
        en: "Shows the others and lists the source that answered 500"
      "shows the others and lists the source that had no network":
        uk: "Показує решту й називає джерело без мережі"
        en: "Shows the others and lists the source that had no network"
    hints:
      nudge:
        uk: "Який комбінатор чекає на всі promises і не відхиляється, навіть коли частина з них не вдалася? І як запустити всі запити одразу, а не в циклі з `await`?"
        en: "Which combinator waits for all promises and does not reject even when some of them fail? And how do you start all requests at once rather than in a loop with `await`?"
      explanation:
        uk: "`map` перетворює масив джерел на масив promises — усі запити стартують у цю мить. `Promise.allSettled` дає масив описів у тому самому порядку: `{ status: \"fulfilled\", value }` або `{ status: \"rejected\", reason }`. Наприклад, перевірка кількох дзеркал сайту могла б іти по описах із їхнім індексом і для `fulfilled` брати `value`, а для решти записувати назву дзеркала в список недоступних. Індекс опису збігається з індексом джерела в `SOURCES`."
        en: "`map` turns the array of sources into an array of promises — all requests start at that moment. `Promise.allSettled` gives an array of descriptions in the same order: `{ status: \"fulfilled\", value }` or `{ status: \"rejected\", reason }`. For example, a check of several mirror sites could go through the descriptions with their index and take `value` for `fulfilled`, while writing the mirror’s name into a list of unavailable ones for the rest. A description’s index matches the source’s index in `SOURCES`."
    solutionNote:
      uk: "`SOURCES.map(...)` запускає всі три запити одночасно, а `Promise.allSettled` чекає на всі й ніколи не відхиляється: часткова невдача не губить решту. Індекс кожного опису веде до його джерела. Варіант, де кожен запит сам перетворює помилку на позначку через `.catch`, а потім `Promise.all` збирає все разом, теж правильний."
      en: "`SOURCES.map(...)` starts all three requests at once, and `Promise.allSettled` waits for all of them and never rejects: a partial failure does not lose the rest. Each description’s index leads to its source. A version where every request turns its own failure into a marker with `.catch` and `Promise.all` then collects everything is also correct."
    feedback:
      - when: { test: "starts all three requests before any of them answers" }
        message:
          uk: "Ця перевірка очікує, що всі три запити стартують, ще поки жоден не відповів (найшвидший відповідає через 40 мс). `await` усередині циклу запускає наступний запит лише після відповіді попереднього."
          en: "This check expects all three requests to start while none has answered yet (the fastest answers after 40 ms). `await` inside a loop starts the next request only after the previous one answered."
      - when: { test: "shows the count of every source when nothing fails" }
        message:
          uk: "Ця перевірка очікує в `#counts` три пункти «Бажання: 3», «Справи: 4», «Звички: 2» у порядку `SOURCES`, а `#failed` — порожнім."
          en: "This check expects three items “Wishes: 3”, “Tasks: 4”, “Habits: 2” in `#counts` in the order of `SOURCES`, and an empty `#failed`."
      - when: { test: "shows the others and lists the source that answered 500" }
        message:
          uk: "Ця перевірка відповідає `500` для справ і очікує в `#counts` бажання й звички, а в `#failed` — «Справи». Якщо порожньо все, одна помилка зупинила всі результати — так поводиться `Promise.all`."
          en: "This check answers `500` for the tasks and expects wishes and habits in `#counts` and “Tasks” in `#failed`. If everything is empty, one error stopped all results — that is how `Promise.all` behaves."
      - when: { test: "shows the others and lists the source that had no network" }
        message:
          uk: "Ця перевірка обриває мережу для звичок і очікує в `#counts` бажання й справи, а в `#failed` — «Звички». Опис невдалого результату має `reason`, а не `value`."
          en: "This check cuts the network for the habits and expects wishes and tasks in `#counts` and “Habits” in `#failed`. A failed result’s description has a `reason`, not a `value`."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` означає, що значення має не той тип, на який розраховує код. Якщо бачиш `reading 'items'`, код читає `value` в опису невдалого результату — там є лише `reason`. Якщо `… is not a function`, програма зупинилася ще під час завантаження — виправ спершу помилку з картки «Помилка під час виконання»."
          en: "A `TypeError` means a value has a different type than the code expects. If you see `reading 'items'`, the code reads `value` from a failed result’s description — it has only a `reason`. If it says `… is not a function`, the program stopped while loading — fix the error from the card “Error while running” first."

  - id: to-project
    kind: transfer
    capstoneStep: JS-08
    body:
      uk: "У кроці проєкту початкові записи приходять одним запитом до одного файла, тож комбінатор там не потрібен. Правило цього уроку знадобиться, коли даних стане кілька: незалежні запити запускай разом, а коли частина з них може не вдатися, обирай `allSettled` — покажи те, що прийшло, і кнопку повтору там, де не вийшло."
      en: "In the project step the starting records arrive with one request for one file, so no combinator is needed there. This lesson's rule pays off once there are several pieces of data: start independent requests together, and when some of them may fail, choose `allSettled` — show what arrived, and a retry button where it did not."
