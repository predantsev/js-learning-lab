id: js-08-08-combinators-sequential-concurrent
unit: JS-08
title:
  uk: "all/allSettled/race/any; послідовно чи паралельно"
  en: "all/allSettled/race/any; sequential vs concurrent"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Обрати `Promise.all`, `allSettled`, `race` чи `any` під вимогу (усе або нічого, часткові результати, перший завершений, перший успішний) і передбачити результат кожного, коли один вхідний promise відхилено."
    en: "Choose `Promise.all`, `allSettled`, `race` or `any` for a stated requirement (all-or-nothing, partial results, first to settle, first success) and predict each result when one input rejects."
  - uk: "Порівняти загальний час трьох запитів, на які чекають по черзі, і трьох запитів, запущених разом."
    en: "Compare the total time of awaiting three fixture requests one by one with starting them together."
prerequisites: [js-08-07-failures-loading-error, js-05-01-map]
subskills:
  - { family: J-11, skill: "all/allSettled/race/any selection", depth: intro }
  - { family: J-11, skill: "cleanup and sequential vs concurrent requests", depth: intro }
glossary: [promise-combinator, concurrent-requests, partial-failure]
selfCheck: [combinator-results, dashboard]

blocks:
  - id: four-combinators
    kind: explanation
    title:
      uk: "Чотири способи чекати на кілька promises"
      en: "Four ways to wait for several promises"
    body:
      uk: |
        Часто треба кілька даних одразу: бажання, справи й звички для однієї сторінки. Для цього є [[promise-combinator|комбінатори promises]] — функції, що отримують масив promises і повертають один новий:

        | Комбінатор | Виконується, коли… | Відхиляється, коли… | Коли брати |
        |---|---|---|---|
        | `Promise.all` | **усі** виконалися — масивом значень | **перший** відхилився — не чекаючи решти | потрібне все, без частини сенсу немає |
        | `Promise.allSettled` | усі завершилися — масивом `{ status, value }` або `{ status, reason }` | ніколи | показати те, що вдалося, і окремо — що ні |
        | `Promise.race` | перший завершений виконався | перший завершений відхилився | важливий лише найшвидший результат, хоч який |
        | `Promise.any` | перший **успішний** — його значенням | усі відхилилися | підійде будь-яке джерело, аби спрацювало |

        Ситуацію, коли частина запитів вдалася, а частина ні, називають [[partial-failure|частковою невдачею]]. `Promise.all` її не переживає: одна помилка — і весь результат втрачено.
      en: |
        Often you need several pieces of data at once: wishes, tasks and habits for one page. That is what [[promise-combinator|promise combinators]] are for — functions that take an array of promises and return one new promise:

        | Combinator | Fulfills when… | Rejects when… | When to use it |
        |---|---|---|---|
        | `Promise.all` | **all** fulfilled — with an array of values | the **first** one rejects — without waiting for the rest | you need everything; a part is useless |
        | `Promise.allSettled` | all settled — with an array of `{ status, value }` or `{ status, reason }` | never | show what worked and, separately, what did not |
        | `Promise.race` | the first to settle fulfilled | the first to settle rejected | only the fastest result matters, whatever it is |
        | `Promise.any` | the first **successful** one — with its value | all of them rejected | any source will do, as long as it works |

        When some requests succeed and some fail, it is a [[partial-failure]]. `Promise.all` does not survive it: one error, and the whole result is lost.

  - id: combinator-results
    kind: prediction
    prompt:
      uk: "Кожен комбінатор отримує три нові promises: `a` виконується через 300 мс, `b` відхиляється через 100 мс, `c` виконується через 200 мс. Що надрукує код?"
      en: "Each combinator gets three new promises: `a` fulfills after 300 ms, `b` rejects after 100 ms, `c` fulfills after 200 ms. What does the code print?"
    code: |
      const delay = (ms, value) => new Promise((resolve) => setTimeout(() => resolve(value), ms));
      const fail = (ms, message) => new Promise((resolve, reject) => setTimeout(() => reject(new Error(message)), ms));
      const three = () => [delay(300, "a"), fail(100, "b failed"), delay(200, "c")];

      await Promise.all(three()).then((v) => console.log("all:", v), (e) => console.log("all:", e.message));
      await Promise.allSettled(three()).then((r) => console.log("allSettled:", r.map((x) => x.status).join(" ")));
      await Promise.race(three()).then((v) => console.log("race:", v), (e) => console.log("race:", e.message));
      await Promise.any(three()).then((v) => console.log("any:", v));
    verify:
      logs: ["all: b failed", "allSettled: fulfilled rejected fulfilled", "race: b failed", "any: c"]
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "`all: b failed` · `allSettled: fulfilled rejected fulfilled` · `race: b failed` · `any: c`"
            en: "`all: b failed` · `allSettled: fulfilled rejected fulfilled` · `race: b failed` · `any: c`"
        - id: all-partial
          text:
            uk: "`all: a,c` · `allSettled: fulfilled rejected fulfilled` · `race: b failed` · `any: c`"
            en: "`all: a,c` · `allSettled: fulfilled rejected fulfilled` · `race: b failed` · `any: c`"
          why:
            uk: "`Promise.all` не пропускає невдалі: щойно один promise відхилено, весь результат відхиляється тією самою помилкою."
            en: "`Promise.all` does not skip failures: as soon as one promise rejects, the whole result rejects with that same error."
        - id: race-success
          text:
            uk: "`all: b failed` · `allSettled: fulfilled rejected fulfilled` · `race: c` · `any: c`"
            en: "`all: b failed` · `allSettled: fulfilled rejected fulfilled` · `race: c` · `any: c`"
          why:
            uk: "`race` бере **перший завершений**, хоч би як він завершився. Першим завершується `b` — відхиленням. Шукати першого успішного — робота `any`."
            en: "`race` takes the **first to settle**, however it settles. `b` settles first — with a rejection. Looking for the first success is the job of `any`."
        - id: any-first
          text:
            uk: "`all: b failed` · `allSettled: fulfilled rejected fulfilled` · `race: b failed` · `any: a`"
            en: "`all: b failed` · `allSettled: fulfilled rejected fulfilled` · `race: b failed` · `any: a`"
          why:
            uk: "`any` бере перший успішний **за часом**, а не за місцем у масиві. `c` виконується через 200 мс, раніше за `a`."
            en: "`any` takes the first success **in time**, not by position in the array. `c` fulfills after 200 ms, before `a`."
      correct: [right]
    explanation:
      uk: "`all` відхиляється разом із `b` через 100 мс, не чекаючи `a` і `c`. `allSettled` чекає всіх 300 мс і описує кожен результат. `race` завершується першим завершеним — відхиленим `b`. `any` пропускає відхилення й виконується першим успішним — `c` через 200 мс."
      en: "`all` rejects together with `b` after 100 ms, without waiting for `a` and `c`. `allSettled` waits all 300 ms and describes every result. `race` ends with the first to settle — the rejected `b`. `any` skips the rejection and fulfills with the first success — `c` after 200 ms."

  - id: timeline-steps
    kind: visual
    visual: event-loop
    title:
      uk: "Три promises і чотири комбінатори на одній шкалі часу"
      en: "Three promises and four combinators on one timeline"
    textEquivalent:
      uk: "Код створює три promises, і всі три таймери стартують одночасно: a виконується через 300 мс, b відхиляється через 100 мс, c виконується через 200 мс. Потім чотири комбінатори отримують ці самі promises. Коли через 100 мс b відхиляється, Promise.all одразу відхиляється з помилкою b — друкується all: b failed — і Promise.race теж: race: b failed. Promise.any і Promise.allSettled лише запам’ятовують відхилення й чекають далі. Через 200 мс виконується c — це перший успіх, тож Promise.any виконується значенням c: any: c. Через 300 мс виконується a, і лише тепер завершилися всі три — Promise.allSettled виконується масивом із трьох описів: allSettled: 3. Якби на кожен promise чекали по черзі, одне за одним, разом це тривало б 300 + 100 + 200 = 600 мс, а запущені разом вони вклалися в 300 мс — час найповільнішого."
      en: "The code creates three promises, and all three timers start at the same time: a fulfills after 300 ms, b rejects after 100 ms, c fulfills after 200 ms. Then four combinators receive these same promises. When b rejects at 100 ms, Promise.all rejects at once with b’s error — all: b failed is printed — and so does Promise.race: race: b failed. Promise.any and Promise.allSettled only note the rejection and keep waiting. At 200 ms c fulfills — the first success, so Promise.any fulfills with c: any: c. At 300 ms a fulfills, and only now have all three settled — Promise.allSettled fulfills with an array of three descriptions: allSettled: 3. Had each promise been awaited in turn, one after another, it would have taken 300 + 100 + 200 = 600 ms in total; started together they fit into 300 ms — the time of the slowest."
    spec:
      file: visuals/timeline.js
      steps:
        - line: 10
          caption:
            uk: "Три виклики `settleAfter` запускають три таймери **одночасно**: `a` — 300 мс, `b` — 100 мс (відхилення), `c` — 200 мс."
            en: "Three calls of `settleAfter` start three timers **at the same time**: `a` — 300 ms, `b` — 100 ms (a rejection), `c` — 200 ms."
          stack: ["timeline.js"]
          webApis: ["a: 300 ms", "b: 100 ms", "c: 200 ms"]
        - line: 14
          caption:
            uk: "Чотири комбінатори отримують ті самі три promises. Кожен повертає новий promise, що поки `pending`."
            en: "Four combinators receive the same three promises. Each returns a new promise that is still `pending`."
          stack: ["timeline.js"]
          webApis: ["a: 300 ms", "b: 100 ms", "c: 200 ms"]
        - caption:
            uk: "Код файла закінчився. Йде час."
            en: "The file’s code has finished. Time passes."
          stack: []
          webApis: ["a: 300 ms", "b: 100 ms", "c: 200 ms"]
        - line: 5
          caption:
            uk: "**100 мс**: `b` відхиляється. Усі чотири комбінатори дізнаються про це в microtasks."
            en: "**100 ms**: `b` rejects. All four combinators learn about it in microtasks."
          stack: ["timer b"]
          webApis: ["a: 300 ms", "c: 200 ms"]
          microtasks: ["all: b rejected", "race: b rejected", "any: note it", "allSettled: note it"]
        - line: 15
          log: "all: b failed"
          caption:
            uk: "`Promise.all` відхиляється **одразу**, не чекаючи `a` і `c`: `all: b failed`."
            en: "`Promise.all` rejects **at once**, without waiting for `a` and `c`: `all: b failed`."
          stack: ["all catch"]
          webApis: ["a: 300 ms", "c: 200 ms"]
        - line: 17
          log: "race: b failed"
          caption:
            uk: "`Promise.race` теж: першим завершився `b`, і хоч це відхилення, «перегони» виграв він. `any` і `allSettled` чекають далі."
            en: "`Promise.race` too: `b` settled first, and although it is a rejection, it won the “race”. `any` and `allSettled` keep waiting."
          stack: ["race catch"]
          webApis: ["a: 300 ms", "c: 200 ms"]
        - line: 4
          caption:
            uk: "**200 мс**: `c` виконується. Це перший успіх."
            en: "**200 ms**: `c` fulfills. It is the first success."
