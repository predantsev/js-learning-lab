id: js-08-02-promises
unit: JS-08
title:
  uk: "Promises: значення, яке надійде пізніше"
  en: "Promises: a value that arrives later"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Назвати стани promise (pending, fulfilled, rejected) і передбачити, коли виконається callback із `.then` відносно синхронного коду навколо."
    en: "Name a promise’s states (pending, fulfilled, rejected) and predict when a `.then` callback runs relative to the synchronous code around it."
  - uk: "Загорнути затримку на `setTimeout` у promise і отримати його значення через `.then`."
    en: "Wrap a `setTimeout`-based delay in a promise and consume its value with `.then`."
prerequisites: [js-08-01-timers-and-the-event-loop, js-03-01-functions-and-return]
subskills:
  - { family: J-11, skill: "promise chaining and rejection", depth: intro }
glossary: [promise, promise-state, fulfilled, rejected]
selfCheck: [executor-runs-now, show-later]

blocks:
  - id: value-later
    kind: explanation
    title:
      uk: "Значення, яке надійде пізніше"
      en: "A value that arrives later"
    body:
      uk: |
        Таймер лише **викликає** функцію пізніше. А як функції **повернути** значення, якого ще немає, — скажімо, запис, що прийде з мережі? Звичайний `return` тут не допоможе: повертати поки що нічого.

        Для цього є [[promise]] — об’єкт-«обіцянка» результату. Його можна повернути одразу, а саме значення з’явиться в ньому потім:

        ```js
        const loaded = new Promise((resolve) => {
          setTimeout(() => {
            resolve({ id: "t-02", done: false });
          }, 1000);
        });

        loaded.then((task) => {
          console.log(task.id);
        });
        ```

        `new Promise(...)` отримує функцію-**виконавця** (executor). Виконавець запускається **одразу** й отримує `resolve` — функцію, якою він повідомить: «значення готове». `.then(callback)` реєструє [[callback]], що отримає це значення, коли воно з’явиться.

        `.then` після `import()` ти вже бачив: динамічний import теж повертає promise. Тепер розберімо, як вони працюють.
      en: |
        A timer only **calls** a function later. But how can a function **return** a value that does not exist yet — say, a record that will come from the network? A plain `return` does not help: there is nothing to return so far.

        That is what a [[promise]] is for — an object that “promises” a result. You can return it right away, and the value itself appears in it later:

        ```js
        const loaded = new Promise((resolve) => {
          setTimeout(() => {
            resolve({ id: "t-02", done: false });
          }, 1000);
        });

        loaded.then((task) => {
          console.log(task.id);
        });
        ```

        `new Promise(...)` receives an **executor** function. The executor runs **right away** and receives `resolve` — a function it uses to announce “the value is ready”. `.then(callback)` registers a [[callback]] that receives the value once it appears.

        You have already seen `.then` after `import()`: a dynamic import returns a promise too. Now let’s see how promises work.

  - id: executor-runs-now
    kind: prediction
    strings:
      start: { uk: "початок", en: "start" }
      inside: { uk: "у виконавці", en: "in the executor" }
      end: { uk: "кінець", en: "end" }
    prompt:
      uk: "Promise виконується одразу, ще в самому виконавці. Що з’явиться в консолі й у якому порядку?"
      en: "The promise is fulfilled right away, inside the executor itself. What appears in the console, and in what order?"
    code: |
      console.log("%%start%%");

      const promise = new Promise((resolve) => {
        console.log("%%inside%%");
        resolve("w-04");
      });

      promise.then((id) => {
        console.log("then:", id);
      });

      console.log("%%end%%");
    verify:
      logs: ["%%start%%", "%%inside%%", "%%end%%", "then: w-04"]
    answer:
      type: choice
      options:
        - id: correct-order
          text:
            uk: "«початок», «у виконавці», «кінець», `then: w-04`"
            en: "“start”, “in the executor”, “end”, `then: w-04`"
        - id: executor-later
          text:
            uk: "«початок», «кінець», «у виконавці», `then: w-04`"
            en: "“start”, “end”, “in the executor”, `then: w-04`"
          why:
            uk: "Виконавець запускається одразу, під час `new Promise(...)`, а не тоді, коли хтось викличе `.then`."
            en: "The executor runs at once, during `new Promise(...)`, not when someone calls `.then`."
        - id: then-at-once
          text:
            uk: "«початок», «у виконавці», `then: w-04`, «кінець»"
            en: "“start”, “in the executor”, `then: w-04`, “end”"
          why:
            uk: "Хоч promise уже виконано, callback із `.then` чекає, доки закінчиться поточний код. `.then` ніколи не викликає callback одразу."
            en: "Even though the promise is already fulfilled, the `.then` callback waits until the current code has finished. `.then` never calls its callback at once."
        - id: then-missed
          text:
            uk: "«початок», «у виконавці», «кінець» — `.then` запізнився, значення вже минуло"
            en: "“start”, “in the executor”, “end” — `.then` came too late, the value is gone"
          why:
            uk: "Promise запам’ятовує своє значення. Callback, зареєстрований уже після `resolve`, теж його отримає."
            en: "A promise keeps its value. A callback registered after `resolve` receives it as well."
      correct: [correct-order]
    explanation:
      uk: "Виконавець працює синхронно: «у виконавці» друкується одразу після «початок», і там же promise отримує значення. Але callback із `.then` не виконується негайно навіть для готового promise — він чекає кінця поточного коду. Тому `then: w-04` з’являється останнім, після «кінець»."
      en: "The executor runs synchronously: “in the executor” is printed right after “start”, and the promise gets its value there too. But a `.then` callback does not run immediately even for a ready promise — it waits for the current code to finish. So `then: w-04` comes last, after “end”."

  - id: states
    kind: explanation
    title:
      uk: "Три стани promise"
      en: "The three states of a promise"
    body:
      uk: |
        Promise завжди перебуває в одному з трьох [[promise-state|станів]]:

        | Стан | Що означає | Що отримують callbacks |
        |---|---|---|
        | `pending` | значення ще немає | нічого, вони чекають |
        | [[fulfilled\|fulfilled]] (виконано) | викликали `resolve(value)` | `.then` отримує `value` |
        | [[rejected\|rejected]] (відхилено) | викликали `reject(error)` або виконавець кинув помилку | `.then` пропускається; як обробити помилку — наступний урок |

        Виконаний чи відхилений promise називають **settled** — завершеним. Завершується він **один раз**: повторні `resolve` чи `reject` уже нічого не змінюють, а значення лишається в promise назавжди. Тому `.then`, доданий навіть через хвилину, отримає те саме значення.

        І головне правило: callback із `.then` **ніколи не виконується одразу**. Навіть для готового promise він чекає, доки закінчиться поточний синхронний код. Такі callbacks стають в окрему чергу — [[microtask-queue|чергу microtasks]]; чим вона відрізняється від черги задач, побачиш у четвертому уроці.
      en: |
        A promise is always in one of three [[promise-state|states]]:

        | State | What it means | What callbacks get |
        |---|---|---|
        | `pending` | there is no value yet | nothing, they wait |
        | [[fulfilled\|fulfilled]] | `resolve(value)` was called | `.then` receives `value` |
        | [[rejected\|rejected]] | `reject(error)` was called or the executor threw an error | `.then` is skipped; how to handle the error comes next lesson |

        A fulfilled or rejected promise is called **settled**. It settles **once**: later calls of `resolve` or `reject` change nothing, and the value stays in the promise for good. So a `.then` added even a minute later receives the same value.

        And the key rule: a `.then` callback **never runs immediately**. Even for a ready promise it waits until the current synchronous code has finished. Such callbacks go into a separate queue — the [[microtask-queue]]; how it differs from the task queue you will see in lesson four.

  - id: promise-steps
    kind: visual
    visual: event-loop
    strings:
      lamp: { uk: "Лампа", en: "Lamp" }
    title:
      uk: "Promise від pending до fulfilled"
      en: "A promise from pending to fulfilled"
    textEquivalent:
      uk: "Функція loadWish(id) повертає новий promise, виконавець якого ставить таймер на 500 мс і в його callback викликає resolve з об’єктом запису. Код файла друкує start і викликає loadWish(\"w-02\"). Виконавець працює одразу, у тому самому стеку: він реєструє таймер, що чекає в браузері серед Web APIs. loadWish повертає promise у стані pending. Виклик .then лише запам’ятовує callback усередині promise — у жодній черзі його ще немає. Код файла друкує end і закінчується; стек порожній, сторінка вільна. Через пів секунди callback таймера стає в чергу задач, а потім виконується: він викликає resolve із записом, promise переходить у стан fulfilled, і збережений .then-callback стає в чергу microtasks. Коли callback таймера закінчився, виконується .then-callback: він отримує запис і друкує then: %%lamp%%. У консолі: start, end, then: %%lamp%%."
      en: "The function loadWish(id) returns a new promise whose executor sets a 500 ms timer and calls resolve with a record object in its callback. The file’s code prints start and calls loadWish(\"w-02\"). The executor runs at once, on the same stack: it registers the timer, which waits in the browser among the Web APIs. loadWish returns the promise in the pending state. Calling .then only stores the callback inside the promise — it is in no queue yet. The file’s code prints end and finishes; the stack is empty, the page is free. Half a second later the timer callback joins the task queue and then runs: it calls resolve with the record, the promise becomes fulfilled, and the stored .then callback joins the microtask queue. When the timer callback has finished, the .then callback runs: it receives the record and prints then: %%lamp%%. The console shows: start, end, then: %%lamp%%."
    spec:
      file: visuals/load-wish.js
      steps:
        - line: 9
          log: "start"
          caption:
            uk: "Код файла друкує `start`."
            en: "The file’s code prints `start`."
          stack: ["load-wish.js"]
        - line: 10
          caption:
            uk: "Виклик `loadWish(\"w-02\")`: у стеку новий кадр `loadWish`."
            en: "The call `loadWish(\"w-02\")`: a new frame `loadWish` is on the stack."
          stack: ["load-wish.js", "loadWish"]
        - line: 2
          caption:
            uk: "`new Promise(…)` **одразу** викликає виконавця — функцію, яку отримав. Promise щойно створено, його стан — `pending`."
            en: "`new Promise(…)` calls the executor — the function it received — **right away**. The promise has just been created; its state is `pending`."
          stack: ["load-wish.js", "loadWish", "executor"]
        - line: 3
          caption:
            uk: "Виконавець реєструє таймер на 500 мс і на цьому закінчується. Таймер чекає в браузері, у **Web APIs**."
            en: "The executor registers a 500 ms timer and is done. The timer waits in the browser, in the **Web APIs**."
          stack: ["load-wish.js", "loadWish", "executor"]
          webApis: ["timer 500 ms"]
        - line: 11
          caption:
            uk: "`loadWish` повертає promise — він досі `pending`. `.then` лише запам’ятовує callback **усередині promise**: у жодній черзі його поки немає."
            en: "`loadWish` returns the promise — still `pending`. `.then` only stores the callback **inside the promise**: it is in no queue yet."
          stack: ["load-wish.js"]
          webApis: ["timer 500 ms"]
        - line: 14
          log: "end"
          caption:
            uk: "`end` у консолі: код файла дійшов до кінця, а значення ще немає."
            en: "`end` in the console: the file’s code has reached its end, and there is no value yet."
          stack: ["load-wish.js"]
          webApis: ["timer 500 ms"]
        - caption:
            uk: "Стек і черги порожні — сторінка вільна й реагує на кліки. Таймер відлічує пів секунди."
            en: "The stack and the queues are empty — the page is free and reacts to clicks. The timer counts half a second."
          stack: []
          webApis: ["timer 500 ms"]
        - caption:
            uk: "Час минув: callback таймера стає в чергу **Tasks**."
            en: "Time is up: the timer callback joins the **Tasks** queue."
          stack: []
          tasks: ["timer callback"]
        - line: 4
          caption:
            uk: "Callback таймера викликає `resolve(…)` з об’єктом запису: promise переходить зі стану `pending` у `fulfilled` і зберігає це значення. Збережений `.then`-callback стає в чергу **Microtasks**."
            en: "The timer callback calls `resolve(…)` with the record object: the promise moves from `pending` to `fulfilled` and keeps that value. The stored `.then` callback joins the **Microtasks** queue."
          stack: ["timer callback"]
          microtasks: ["then callback"]
        - line: 12
          log: "then: %%lamp%%"
          caption:
            uk: "Callback таймера закінчився, стек порожній — і `.then`-callback отримує запис: у консолі `then: %%lamp%%`."
            en: "The timer callback has finished, the stack is empty — and the `.then` callback receives the record: `then: %%lamp%%` appears."
          stack: ["then callback"]
        - caption:
            uk: "Готово. Виконавець працював одразу, а `.then`-callback — лише тоді, коли promise виконався й стек звільнився."
            en: "Done. The executor ran at once, and the `.then` callback only once the promise was fulfilled and the stack was free."
          stack: []

  - id: watch-promise
    kind: example
    runtime: browser-js
    dir: watch-promise
    entry: index.js
    strings:
      ms: { uk: "мс", en: "ms" }
      executorRuns: { uk: "виконавець працює:", en: "the executor runs:" }
      arrived: { uk: "значення надійшло:", en: "the value arrived:" }
      scriptEnds: { uk: "код файла закінчується:", en: "the file’s code ends:" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    title:
      uk: "Коли надходить значення"
      en: "When the value arrives"
    body:
      uk: |
        Програма друкує, скільки мілісекунд минуло від старту: у виконавці, у callback із `.then` і в останньому рядку коду файла. Натисни **Запустити** й подивись у **Консоль**: значення надходить останнім, хоча `resolve` викликано ще у виконавці.
      en: |
        The program prints how many milliseconds have passed since the start: in the executor, in the `.then` callback and on the last line of the file. Press **Run** and look at the **Console**: the value arrives last, although `resolve` was called back in the executor.
    tryIt:
      uk: |
        1. Загорни виклик `resolve(...)` у `setTimeout(() => { … }, 500)` і запусти: код файла так само закінчується одразу, а значення надходить приблизно через 500 мс.
        2. Додай у кінець файла ще один `wish.then(...)`, що друкує `record.id`: він отримає той самий запис — значення зберігається в promise.
        3. Одразу під першим викликом `resolve(...)`, у тій самій функції, додай ще `resolve({ id: "w-01", name: "?" })`: другий виклик нічого не змінить, promise завершується один раз.
      en: |
        1. Wrap the `resolve(...)` call in `setTimeout(() => { … }, 500)` and run: the file’s code still ends at once, and the value arrives about 500 ms later.
        2. Add another `wish.then(...)` at the end of the file that prints `record.id`: it receives the same record — the value is kept in the promise.
        3. Right below the first `resolve(...)` call, in the same function, add `resolve({ id: "w-01", name: "?" })`: the second call changes nothing, a promise settles once.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: повернути чи надрукувати"
      en: "Recall: return or print"
    strings:
      currency: { uk: "грн", en: "UAH" }
    items:
      - id: print-is-not-return
        from: js-03-01-functions-and-return
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          function label(price) {
            console.log(price + " %%currency%%");
          }

          const text = label(80);
          console.log(text);
        verify:
          logs: ["80 %%currency%%", "undefined"]
        answer:
          type: choice
          options:
            - id: twice
              text:
                uk: "«80 грн» двічі"
                en: "“80 UAH” twice"
              why:
                uk: "`console.log` у функції лише друкує. Віддати значення може тільки `return`, а його тут немає, тож `text` дорівнює `undefined`."
                en: "`console.log` inside the function only prints. Only `return` can hand back a value, and there is none here, so `text` is `undefined`."
            - id: printed-then-undefined
              text:
                uk: "«80 грн», а потім `undefined`"
                en: "“80 UAH”, then `undefined`"
            - id: only-undefined
              text:
                uk: "Лише `undefined`"
                en: "Only `undefined`"
              why:
                uk: "Виклик `label(80)` виконує тіло функції, і `console.log` усередині друкує «80 грн»."
                en: "The call `label(80)` runs the function body, and the `console.log` inside prints “80 UAH”."
          correct: [printed-then-undefined]
        explanation:
          uk: "Друкувати й повертати — різні речі: `console.log` показує текст людині, а `return` віддає значення коду, що викликав функцію. З promise так само: значення треба **передати** в `resolve(...)` — інакше `.then` нічого не отримає."
          en: "Printing and returning are different things: `console.log` shows text to a person, and `return` hands a value to the code that called the function. Same with a promise: the value has to be **passed** to `resolve(...)`, or `.then` receives nothing."

  - id: show-later
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: show-later
    entry: index.html
    editable: [index.js]
    strings:
      lang: { uk: "uk", en: "en" }
      title: { uk: "Бажання дня", en: "Wish of the day" }
      loading: { uk: "Завантаження…", en: "Loading…" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      currency: { uk: "грн", en: "UAH" }
    title:
      uk: "Функція delay і запис через секунду"
      en: "A delay function and a record a second later"
    instructions:
      uk: |
        1. Допиши функцію `delay(ms, value)`. Вона має **повертати** promise, який виконується значенням `value` через `ms` мілісекунд.
        2. Використай `delay`, щоб через секунду після завантаження сторінки замінити текст «Завантаження…» назвою й ціною велосипеда — наприклад, «Велосипед — 240 грн».

        Натисни **Запустити** й подивись на вкладку **Сторінка**: спершу «Завантаження…», а через секунду — запис.
      en: |
        1. Complete the function `delay(ms, value)`. It must **return** a promise that is fulfilled with `value` after `ms` milliseconds.
        2. Use `delay` to replace the text “Loading…” with the bicycle’s name and price one second after the page loads — for example, “Bicycle — 240 UAH”.

        Press **Run** and look at the **Page** tab: first “Loading…”, and a second later the record.
    testTitles:
      "delay returns a promise":
        uk: "delay повертає promise"
        en: "delay returns a promise"
      "the promise waits the given time before it is fulfilled":
        uk: "Promise виконується не раніше, ніж мине заданий час"
        en: "The promise waits the given time before it is fulfilled"
      "the promise is fulfilled with the given value":
        uk: "Promise виконується саме тим значенням, яке передали"
        en: "The promise is fulfilled with the given value"
      "the page shows the bicycle one second after it loads":
        uk: "Сторінка показує велосипед через секунду після завантаження"
        en: "The page shows the bicycle one second after it loads"
    hints:
      nudge:
        uk: "`delay` має **повернути** новий promise. Що має статися всередині виконавця через `ms` мілісекунд?"
        en: "`delay` must **return** a new promise. What should happen inside the executor after `ms` milliseconds?"
      explanation:
        uk: "Виконавець отримує `resolve`. Наприклад, promise, що через 2 секунди виконується текстом «готово»: у виконавці ставиш таймер на 2000 мс, а в callback таймера викликаєш `resolve` з цим текстом. У `delay` замість сталих 2000 і «готово» — параметри `ms` і `value`. А код, що показує запис, пиши в callback для `.then`: сам виклик `delay(...)` нічого не чекає."
        en: "The executor receives `resolve`. For example, a promise that is fulfilled with the text “ready” after 2 seconds: in the executor you set a 2000 ms timer, and in the timer callback you call `resolve` with that text. In `delay`, the fixed 2000 and “ready” become the parameters `ms` and `value`. And write the code that shows the record in a callback for `.then`: the call `delay(...)` itself waits for nothing."
    solutionNote:
      uk: "`delay` повертає новий promise, виконавець якого ставить таймер, а callback таймера викликає `resolve(value)`. Сторінку оновлює callback із `.then`: він виконується лише тоді, коли promise виконався, тобто через секунду."
      en: "`delay` returns a new promise whose executor sets a timer, and the timer callback calls `resolve(value)`. The page is updated by the `.then` callback: it runs only once the promise is fulfilled, that is, a second later."
    feedback:
      - when: { test: "delay returns a promise" }
        message:
          uk: "Ця перевірка очікує, що виклик `delay(...)` повертає promise. Якщо бачиш `TypeError` зі словами `reading 'then'`, функція нічого не повертає: перед `new Promise(...)` потрібен `return`."
          en: "This check expects the call `delay(...)` to return a promise. If you see a `TypeError` mentioning `reading 'then'`, the function returns nothing: `new Promise(...)` needs a `return` in front of it."
      - when: { test: "the promise waits the given time before it is fulfilled" }
        message:
          uk: "Ця перевірка очікує, що через 999 мс promise ще `pending`, а через 1000 мс — уже виконаний. Якщо він виконується одразу, `resolve` викликається негайно: у `setTimeout` треба **передати** функцію, яка викличе `resolve` пізніше, а не результат виклику `resolve(...)`."
          en: "This check expects the promise to be still `pending` after 999 ms and fulfilled after 1000 ms. If it is fulfilled at once, `resolve` is called immediately: `setTimeout` needs a **function** that calls `resolve` later, not the result of calling `resolve(...)`."
      - when: { test: "the promise is fulfilled with the given value" }
        message:
          uk: "Ця перевірка очікує, що `.then` отримає саме той об’єкт, який передали в `delay`. Передай `value` у `resolve(...)`."
          en: "This check expects `.then` to receive exactly the object passed to `delay`. Pass `value` to `resolve(...)`."
      - when: { test: "the page shows the bicycle one second after it loads" }
        message:
          uk: "Ця перевірка запускає твій код знову й очікує, що напис не зміниться протягом 999 мс, а через 1000 мс покаже назву й ціну велосипеда. Якщо текст змінюється одразу, його задає код після виклику `delay(...)`, а не callback для `.then`."
          en: "This check runs your code again and expects the text to stay the same for 999 ms and to show the bicycle’s name and price after 1000 ms. If the text changes at once, it is set by code after the `delay(...)` call rather than in a `.then` callback."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` означає, що значення має не той тип, на який розраховує код. Якщо в повідомленні є `reading 'then'`, виклик `delay(...)` дав `undefined`: перед `new Promise(...)` потрібен `return`. Якщо в перевірках видно `… is not a function`, програма зупинилася ще під час завантаження — виправ спершу помилку з картки «Помилка під час виконання»."
          en: "A `TypeError` means a value has a different type than the code expects. If the message mentions `reading 'then'`, the call `delay(...)` gave `undefined`: `new Promise(...)` needs a `return` in front of it. If the checks show `… is not a function`, the program stopped while loading — fix the error from the card “Error while running” first."

  - id: to-project
    kind: transfer
    capstoneStep: JS-08
    body:
      uk: "У проєкті записи надходитимуть через `fetch` — а він теж повертає promise. Дані прийдуть у callback для `.then` так само, як велосипед із `delay`, а сторінка тим часом показуватиме «Завантаження…»."
      en: "In your project, records will arrive through `fetch` — and it returns a promise too. The data will come into a `.then` callback just like the bicycle from `delay`, while the page shows “Loading…” in the meantime."
