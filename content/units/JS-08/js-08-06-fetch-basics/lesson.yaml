id: js-08-06-fetch-basics
unit: JS-08
title:
  uk: "fetch: запит, відповідь, статус, JSON"
  en: "fetch: request, response, status, JSON"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Завантажити JSON-файл проєкту через `fetch` методом GET, перевірити `response.ok` і статус до читання тіла й розібрати його через `response.json()`."
    en: "Fetch a bundled JSON fixture with GET, check `response.ok` and the status before reading the body, and parse it with `response.json()`."
  - uk: "Показати метод, адресу, заголовки, статус, Content-Type і тіло запиту та відповіді — відповідь через об’єкт Response, запит через навчальну адресу `/lab/echo`."
    en: "Point out the method, URL, headers, status, Content-Type and body of a request and its response — the response through the Response object, the request through the lab address `/lab/echo`."
  - uk: "Пояснити, чому `fetch` виконується, а не відхиляється, коли сервер відповідає 404 чи 500."
    en: "Explain why `fetch` fulfills, not rejects, when the server answers 404 or 500."
prerequisites: [js-08-05-async-await, js-07-04-json]
subskills:
  - { family: W-04, skill: "HTTP methods/status/headers", depth: intro }
  - { family: W-04, skill: "JSON content types", depth: intro }
  - { family: W-04, skill: "fetch response checks", depth: intro }
glossary: [fetch, http-method, http-header, status-code, content-type]
selfCheck: [three-requests-predict, get-json]

blocks:
  - id: request-response
    kind: explanation
    title:
      uk: "Запит і відповідь"
      en: "A request and a response"
    body:
      uk: |
        Дані для сторінки зазвичай лежать не в коді, а на **сервері** — програмі на іншому (або цьому самому) комп’ютері, що відповідає на запити. Браузер і сервер розмовляють протоколом **HTTP**:

        - **запит** має [[http-method|метод]] (`GET` — «дай мені», інші змінюють дані), адресу (URL), [[http-header|заголовки]] — пари «назва: значення» з додатковими відомостями — і, можливо, тіло;
        - **відповідь** має [[status-code|код статусу]] (`200` — гаразд, `404` — не знайдено, `500` — помилка сервера), заголовки — серед них [[content-type|Content-Type]], що каже, у якому форматі тіло, — і саме тіло.

        Запит із JavaScript робить [[fetch|`fetch(url)`]]. Він одразу повертає promise, який виконується об’єктом **Response**, щойно надійшли статус і заголовки. Тіло читають окремо — і це ще один promise.

        На цій платформі файли твого проєкту (`./data/…`) віддає сама пісочниця, без мережі, а адреси `/lab/…` — справжній локальний сервер платформи.
      en: |
        A page’s data usually lives not in the code but on a **server** — a program on another (or this same) computer that answers requests. The browser and the server talk **HTTP**:

        - a **request** has a [[http-method|method]] (`GET` means “give me”; others change data), an address (URL), [[http-header|headers]] — “name: value” pairs with extra information — and possibly a body;
        - a **response** has a [[status-code]] (`200` — fine, `404` — not found, `500` — server error), headers — among them [[content-type|Content-Type]], which says what format the body is in — and the body itself.

        JavaScript makes a request with [[fetch|`fetch(url)`]]. It returns a promise at once, which is fulfilled with a **Response** object as soon as the status and headers have arrived. The body is read separately — and that is another promise.

        On this platform the files of your project (`./data/…`) are served by the sandbox itself, without a network, and `/lab/…` addresses by the platform’s real local server.

  - id: three-requests-predict
    kind: prediction
    prompt:
      uk: "У проєкті є файли `data/wishes.json` і `data/notes.txt` (звичайний текст), а файла `data/missing.json` немає. Які твердження про ці три запити правдиві? Обери всі."
      en: "The project has the files `data/wishes.json` and `data/notes.txt` (plain text), and there is no file `data/missing.json`. Which statements about these three requests are true? Choose all that are."
    code: |
      const a = await fetch("./data/wishes.json");
      const b = await fetch("./data/missing.json");
      const c = await fetch("./data/notes.txt");
    runnable: false
    answer:
      type: multi
      options:
        - id: a-ok
          text:
            uk: "`a.status` — `200`, `a.ok` — `true`"
            en: "`a.status` is `200`, `a.ok` is `true`"
        - id: b-rejects
          text:
            uk: "Другий `await fetch(...)` кидає помилку, бо файла немає"
            en: "The second `await fetch(...)` throws because the file does not exist"
          why:
            uk: "Сервер **відповів** — статусом 404. Для `fetch` це успішна розмова, тож promise виконується об’єктом Response."
            en: "The server **did answer** — with status 404. For `fetch` that is a successful conversation, so the promise is fulfilled with a Response."
        - id: b-404
          text:
            uk: "`b.status` — `404`, `b.ok` — `false`"
            en: "`b.status` is `404`, `b.ok` is `false`"
        - id: c-type
          text:
            uk: "Заголовок Content-Type у `c` починається з `text/plain`"
            en: "The Content-Type header of `c` starts with `text/plain`"
        - id: c-json
          text:
            uk: "`await c.json()` поверне текст файла"
            en: "`await c.json()` returns the file’s text"
          why:
            uk: "`json()` розбирає тіло як JSON. Звичайний текст — не JSON, тож promise відхиляється з `SyntaxError`. Текст як він є дає `text()`."
            en: "`json()` parses the body as JSON. Plain text is not JSON, so the promise is rejected with a `SyntaxError`. `text()` gives the text as it is."
        - id: a-json-sync
          text:
            uk: "`a.json()` без `await` одразу дає масив бажань"
            en: "`a.json()` without `await` gives the array of wishes at once"
          why:
            uk: "`json()` повертає promise: тіло може ще надходити. Масив дає `await a.json()`."
            en: "`json()` returns a promise: the body may still be arriving. `await a.json()` gives the array."
      correct: [a-ok, b-404, c-type]
    explanation:
      uk: "`fetch` виконується щоразу, коли сервер щось відповів, — і з `200`, і з `404`. Чи вдалося, кажуть `status` і `ok` (`true` для 200–299). Формат тіла каже Content-Type: для `.json` — `application/json`, для `.txt` — `text/plain`. Перевір себе в прикладі цього уроку."
      en: "`fetch` fulfills whenever the server answered something — with `200` and with `404` alike. Whether it worked is told by `status` and `ok` (`true` for 200–299). The body’s format is told by Content-Type: `application/json` for `.json`, `text/plain` for `.txt`. Check yourself with this lesson’s example."

  - id: get-sequence
    kind: visual
    visual: sequence
    title:
      uk: "GET, 200 і 404"
      en: "GET, 200 and 404"
    textEquivalent:
      uk: "Код сторінки викликає fetch(\"./data/wishes.json\") і одразу отримує promise. Браузер надсилає серверу запит GET /data/wishes.json із заголовком Accept. Сервер відповідає статусом 200 OK, заголовком Content-Type: application/json і тілом — масивом бажань. Щойно надійшли статус і заголовки, promise fetch виконується об’єктом Response зі status 200 і ok true. Код спершу перевіряє ok, а потім викликає await response.json(), щоб прочитати й розібрати тіло. Далі код просить файл з одруківкою в назві: GET /data/wish.json. Сервер відповідає 404 Not Found із Content-Type: text/plain. Promise fetch усе одно виконується — об’єктом Response зі status 404 і ok false: сервер же відповів. Перетворити таку відповідь на помилку має сам код, перевіривши ok. На цій платформі файли проєкту віддає сама пісочниця; справжній сервер сайту поводиться так само."
      en: "The page code calls fetch(\"./data/wishes.json\") and gets a promise at once. The browser sends the server the request GET /data/wishes.json with an Accept header. The server answers with status 200 OK, the header Content-Type: application/json and a body — an array of wishes. As soon as the status and headers have arrived, the fetch promise is fulfilled with a Response object with status 200 and ok true. The code first checks ok and then calls await response.json() to read and parse the body. Next the code asks for a file with a typo in its name: GET /data/wish.json. The server answers 404 Not Found with Content-Type: text/plain. The fetch promise is still fulfilled — with a Response with status 404 and ok false: the server did answer, after all. Turning such a response into an error is up to the code itself, by checking ok. On this platform the project’s files are served by the sandbox itself; a real website’s server behaves the same way."
    spec:
      actors:
        - { id: page, label: { uk: "Код сторінки", en: "Page code" } }
        - { id: browser, label: { uk: "Браузер (fetch)", en: "Browser (fetch)" } }
        - { id: server, label: { uk: "Сервер", en: "Server" } }
      intro:
        uk: "Три учасники: твій код, браузер, що виконує `fetch`, і сервер, який віддає файли."
        en: "Three participants: your code, the browser that carries out `fetch`, and the server that hands out files."
      messages:
        - from: page
          to: browser
          label: "fetch(\"./data/wishes.json\")"
          caption:
            uk: "Код викликає `fetch` і **одразу** отримує promise у стані `pending`. Метод не вказано — отже, `GET`."
            en: "The code calls `fetch` and gets a `pending` promise **at once**. No method is given — so it is `GET`."
        - from: browser
          to: server
          label: "GET /data/wishes.json"
          kind: async
          note: { uk: "Заголовок запиту: Accept: */*", en: "Request header: Accept: */*" }
          caption:
            uk: "Браузер надсилає запит: метод, адреса й заголовки."
            en: "The browser sends the request: method, address and headers."
        - from: server
          to: browser
          label: "200 OK"
          kind: return
          note: { uk: "Content-Type: application/json · тіло: [3 бажання]", en: "Content-Type: application/json · body: [3 wishes]" }
          caption:
            uk: "Сервер відповідає: статус `200`, заголовок Content-Type `application/json` і тіло з JSON-текстом."
            en: "The server answers: status `200`, the Content-Type header `application/json` and a body of JSON text."
        - from: browser
          to: page
          label: "Response { status: 200, ok: true }"
          kind: return
          caption:
            uk: "Щойно надійшли статус і заголовки, promise `fetch` виконується об’єктом Response. Тіло код читатиме окремо."
            en: "As soon as the status and headers have arrived, the `fetch` promise is fulfilled with a Response object. The code reads the body separately."
        - from: page
          to: page
          label: "if (response.ok) … await response.json()"
          kind: note
          caption:
            uk: "Спершу перевірка `ok`, потім `await response.json()` — ще один promise, який дає розібраний масив."
            en: "First the `ok` check, then `await response.json()` — one more promise, which gives the parsed array."
        - from: page
          to: browser
          label: "fetch(\"./data/wish.json\")"
          caption:
            uk: "Тепер запит до файла з одруківкою в назві."
            en: "Now a request for a file with a typo in its name."
        - from: browser
          to: server
          label: "GET /data/wish.json"
          kind: async
          caption:
            uk: "Запит іде так само: `GET` і адреса."
            en: "The request goes the same way: `GET` and the address."
        - from: server
          to: browser
          label: "404 Not Found"
          kind: return
          note: { uk: "Content-Type: text/plain · тіло: Not found: data/wish.json", en: "Content-Type: text/plain · body: Not found: data/wish.json" }
          caption:
            uk: "Сервер відповідає статусом `404`: такого файла немає. Але це **відповідь**."
            en: "The server answers with status `404`: there is no such file. But it is **an answer**."
        - from: browser
          to: page
          label: "Response { status: 404, ok: false }"
          kind: return
          caption:
            uk: "Promise `fetch` **виконується**, а не відхиляється: розмова з сервером відбулася. Відхиляється він лише тоді, коли відповіді немає взагалі, — про це наступний урок."
            en: "The `fetch` promise is **fulfilled**, not rejected: the conversation with the server took place. It is rejected only when there is no answer at all — that is the next lesson."
        - from: page
          to: page
          label: "throw new Error(\"HTTP 404\")"
          kind: note
          caption:
            uk: "Помилкою відповідь 404 стає лише тоді, коли її такою робить твій код — після перевірки `ok`."
            en: "A 404 response becomes an error only when your code makes it one — after checking `ok`."

  - id: check-before-reading
    kind: explanation
    title:
      uk: "Спершу перевір, потім читай"
      en: "Check first, then read"
    body:
      uk: |
        У відповіді є все, щоб вирішити, що робити далі:

        | Властивість | Що дає |
        |---|---|
        | `response.status` | код статусу: `200`, `404`, `500`… |
        | `response.ok` | `true`, якщо статус від 200 до 299 |
        | `response.headers.get("content-type")` | значення заголовка Content-Type, наприклад `application/json; charset=utf-8` |
        | `await response.json()` | тіло, розібране як JSON; якщо це не JSON — `SyntaxError` |
        | `await response.text()` | тіло як текст |

        ```js
        const response = await fetch("./data/habits.json");
        if (response.ok) {
          const habits = await response.json();
          console.log(habits.length);
        } else {
          console.log("the server answered", response.status);
        }
        ```

        Тіло можна прочитати лише **раз**: другий виклик `json()` чи `text()` для тієї самої відповіді завершується помилкою `TypeError`.
      en: |
        A response has everything you need to decide what to do next:

        | Property | What it gives |
        |---|---|
        | `response.status` | the status code: `200`, `404`, `500`… |
        | `response.ok` | `true` if the status is between 200 and 299 |
        | `response.headers.get("content-type")` | the value of the Content-Type header, for example `application/json; charset=utf-8` |
        | `await response.json()` | the body parsed as JSON; if it is not JSON — a `SyntaxError` |
        | `await response.text()` | the body as text |

        ```js
        const response = await fetch("./data/habits.json");
        if (response.ok) {
          const habits = await response.json();
          console.log(habits.length);
        } else {
          console.log("the server answered", response.status);
        }
        ```

        A body can be read only **once**: a second call of `json()` or `text()` on the same response fails with a `TypeError`.

  - id: three-requests
    kind: example
    runtime: browser-js
    dir: three-requests
    entry: index.js
    capabilities: { network: lab }
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      note: { uk: "Нотатки до списку бажань: подарунки на березень.", en: "Notes for the wishlist: gifts for March." }
      count: { uk: "бажань:", en: "wishes:" }
      serverSaw: { uk: "сервер отримав:", en: "the server received:" }
    title:
      uk: "Три файли й відлуння запиту"
      en: "Three files and an echo of the request"
    body:
      uk: |
        `show` робить запит і друкує адресу, `status`, `ok` і Content-Type. Запусти й подивись у **Консоль**: JSON-файл, відсутній файл (`404`, але без помилки) і текстовий файл.

        Останній запит іде на навчальну адресу `/lab/echo` — справжній локальний сервер платформи. Він відповідає тим, що отримав від тебе: методом і заголовками запиту. Цей запит справжній, тож його видно й серед мережевих запитів в інструментах розробника браузера; файли проєкту там не з’являються — їх віддає пісочниця.
      en: |
        `show` makes a request and prints the address, `status`, `ok` and Content-Type. Run it and look at the **Console**: a JSON file, a missing file (`404`, but no error) and a text file.

        The last request goes to the lab address `/lab/echo` — the platform’s real local server. It answers with what it received from you: the request’s method and headers. This request is real, so it also shows up among the network requests in the browser’s developer tools; the project’s files do not — the sandbox serves them.
    tryIt:
      uk: |
        1. Заміни `notes.text()` на `notes.json()` і запусти: з’явиться картка «Помилка під час виконання» з `SyntaxError` — текст не є JSON.
        2. Поверни `text()` і під рядком коду з `missing` додай перевірку: `if (!missing.ok) throw new Error("HTTP " + missing.status);`. Тепер відповідь 404 стала помилкою — так вирішив твій код. Потім прибери цей рядок.
        3. У запиті до `/lab/echo` заміни `"GET"` на `"POST"`: сервер отримав інший метод.
      en: |
        1. Replace `notes.text()` with `notes.json()` and run: the card “Error while running” appears with a `SyntaxError` — the text is not JSON.
        2. Put `text()` back and below the line of code with `missing` add a check: `if (!missing.ok) throw new Error("HTTP " + missing.status);`. Now the 404 response has become an error — your code decided so. Then remove that line.
        3. In the request to `/lab/echo` replace `"GET"` with `"POST"`: the server received a different method.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: що дає JSON.parse"
      en: "Recall: what JSON.parse gives"
    items:
      - id: parse-types
        from: js-07-04-json
        prompt:
          uk: "Що надрукує перший рядок коду і що станеться в другому?"
          en: "What does the first line of code print, and what happens on the second?"
        code: |
          console.log(typeof JSON.parse("80"), typeof JSON.parse('"80"'));
          console.log(JSON.parse('{"price": 80,}'));
        verify:
          logs: ["number string"]
          error: SyntaxError
        answer:
          type: choice
          options:
            - id: right
              text:
                uk: "`number string`, а потім `SyntaxError`"
                en: "`number string`, then a `SyntaxError`"
            - id: both-strings
              text:
                uk: "`string string`, а потім `SyntaxError`"
                en: "`string string`, then a `SyntaxError`"
              why:
                uk: "`JSON.parse` повертає значення того типу, що записаний у тексті: `80` без лапок — число, `\"80\"` у лапках — текст (string)."
                en: "`JSON.parse` returns a value of the type written in the text: `80` without quotes is a number, `\"80\"` in quotes is a string."
            - id: trailing-ok
              text:
                uk: "`number string`, а потім `{ price: 80 }`"
                en: "`number string`, then `{ price: 80 }`"
              why:
                uk: "JSON суворіший за JavaScript: кома після останнього поля в ньому заборонена, тож `JSON.parse` кидає `SyntaxError`."
                en: "JSON is stricter than JavaScript: a comma after the last field is not allowed, so `JSON.parse` throws a `SyntaxError`."
          correct: [right]
        explanation:
          uk: "`JSON.parse` перетворює текст на значення відповідного типу і кидає `SyntaxError`, якщо текст не є правильним JSON. `response.json()` робить те саме з тілом відповіді — тільки повертає promise, який у такому разі відхиляється."
          en: "`JSON.parse` turns text into a value of the matching type and throws a `SyntaxError` when the text is not valid JSON. `response.json()` does the same with a response body — except that it returns a promise, which is rejected in that case."

  - id: get-json
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: get-json
    entry: index.js
    editable: [index.js]
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      readme: { uk: "Витрати зберігаються в копійках.", en: "Expenses are stored in minor units." }
    title:
      uk: "getJson, що не вірить відповіді на слово"
      en: "A getJson that does not take a response on trust"
    instructions:
      uk: |
        Допиши async-функцію `getJson(url)`, яку зможеш використовувати для будь-якого запиту JSON:

        1. Якщо відповідь не `ok` — відхили promise об’єктом `Error`, у якого є властивість `status` з кодом статусу (наприклад, `error.status = 404`).
        2. Якщо заголовок Content-Type не містить `application/json` — відхили promise об’єктом `Error`.
        3. Інакше поверни розібране тіло.

        «Відхилити promise» в async-функції означає кинути помилку через `throw`. У проєкті є `data/expenses.json` і `data/readme.txt`; перевірки ще підставлять відповіді сервера зі статусами 201 і 500.
      en: |
        Complete the async function `getJson(url)`, which you can then use for any JSON request:

        1. If the response is not `ok`, reject the promise with an `Error` object that has a `status` property holding the status code (for example, `error.status = 404`).
        2. If the Content-Type header does not contain `application/json`, reject the promise with an `Error` object.
        3. Otherwise return the parsed body.

        To “reject the promise” in an async function means to throw an error with `throw`. The project has `data/expenses.json` and `data/readme.txt`; the checks will also put in server answers with statuses 201 and 500.
    testTitles:
      "returns the parsed records of a JSON file":
        uk: "Повертає розібрані записи з JSON-файла"
        en: "Returns the parsed records of a JSON file"
      "rejects with status 404 for a missing file":
        uk: "Для відсутнього файла відхиляється помилкою зі status 404"
        en: "Rejects with status 404 for a missing file"
      "rejects with status 500 for a server error":
        uk: "Для помилки сервера відхиляється помилкою зі status 500"
        en: "Rejects with status 500 for a server error"
      "accepts any ok status, such as 201":
        uk: "Приймає будь-який ok-статус, наприклад 201"
        en: "Accepts any ok status, such as 201"
      "rejects a response whose Content-Type is not JSON":
        uk: "Відхиляє відповідь, чий Content-Type — не JSON"
        en: "Rejects a response whose Content-Type is not JSON"
      "rejects a text file":
        uk: "Відхиляє текстовий файл"
        en: "Rejects a text file"
    hints:
      nudge:
        uk: "Розклади роботу на три кроки: дочекатися відповіді, перевірити її (статус, потім Content-Type), і лише тоді читати тіло."
        en: "Split the work into three steps: wait for the response, check it (status, then Content-Type), and only then read the body."
      explanation:
        uk: "Помилку з додатковими відомостями створюють як звичайний об’єкт: `const problem = new Error(\"…\"); problem.code = \"E42\"; throw problem;`. Для статусу візьми `response.ok` і `response.status`, для формату — `response.headers.get(\"content-type\")` і перевір, чи містить текст `application/json` (метод `includes`). Перевіряй `ok` раніше за формат: сторінка помилки 404 буває текстовою."
        en: "An error with extra information is created like an ordinary object: `const problem = new Error(\"…\"); problem.code = \"E42\"; throw problem;`. For the status use `response.ok` and `response.status`, for the format `response.headers.get(\"content-type\")`, and check whether the text contains `application/json` (the `includes` method). Check `ok` before the format: a 404 error page is often plain text."
    solutionNote:
      uk: "`fetch` виконується з будь-яким статусом, тож `getJson` сама перетворює відповідь не `ok` на помилку зі `status`. Перевірка Content-Type не дає розібрати як дані сторінку HTML чи текст, навіть якщо випадково вийшов правильний JSON. Лише після обох перевірок `response.json()` читає тіло."
      en: "`fetch` fulfills with any status, so `getJson` itself turns a response that is not `ok` into an error with `status`. The Content-Type check keeps an HTML page or plain text from being parsed as data, even when it happens to be valid JSON. Only after both checks does `response.json()` read the body."
    feedback:
      - when: { test: "returns the parsed records of a JSON file" }
        message:
          uk: "Ця перевірка очікує, що `getJson(\"./data/expenses.json\")` виконується масивом із двох витрат. Якщо результат `undefined`, функція не повертає розібране тіло."
          en: "This check expects `getJson(\"./data/expenses.json\")` to be fulfilled with an array of two expenses. If the result is `undefined`, the function does not return the parsed body."
      - when: { test: "rejects with status 404 for a missing file" }
        message:
          uk: "Ця перевірка очікує відхилення об’єктом `Error`, у якого `status` дорівнює `404`. Перевір `response.ok` раніше, ніж Content-Type чи тіло, і запиши статус у властивість помилки."
          en: "This check expects a rejection with an `Error` whose `status` is `404`. Check `response.ok` before the Content-Type or the body, and put the status into a property of the error."
      - when: { test: "rejects with status 500 for a server error" }
        message:
          uk: "Ця перевірка очікує, що відповідь `500` дає відхилення об’єктом `Error` зі `status` `500`, а не `null` чи розібране тіло."
          en: "This check expects a `500` response to give a rejection with an `Error` whose `status` is `500`, not `null` or the parsed body."
      - when: { test: "accepts any ok status, such as 201" }
        message:
          uk: "Ця перевірка очікує, що відповідь `201` з JSON виконується розібраним тілом. Успіх — будь-який статус 200–299, тобто `response.ok`, а не лише `200`."
          en: "This check expects a `201` response with JSON to be fulfilled with the parsed body. Success is any status 200–299, that is `response.ok`, not only `200`."
      - when: { test: "rejects a response whose Content-Type is not JSON" }
        message:
          uk: "Ця перевірка відповідає статусом `200` і Content-Type `text/html`, хоча тіло випадково схоже на JSON, і очікує відхилення. Рішення ухвалюй за заголовком, а не за тим, чи вдалося розібрати тіло."
          en: "This check answers with status `200` and Content-Type `text/html`, although the body happens to look like JSON, and expects a rejection. Decide by the header, not by whether the body could be parsed."
      - when: { test: "rejects a text file" }
        message:
          uk: "Ця перевірка очікує, що `getJson(\"./data/readme.txt\")` відхиляється об’єктом `Error`. Якщо результат — `null`, помилку перехоплено й приховано: дай їй вийти з функції."
          en: "This check expects `getJson(\"./data/readme.txt\")` to be rejected with an `Error`. If the result is `null`, the error was caught and hidden: let it leave the function."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` означає, що значення має не той тип, на який розраховує код. Якщо бачиш `… is not a function`, програма зупинилася ще під час завантаження — виправ спершу помилку з картки «Помилка під час виконання»."
          en: "A `TypeError` means a value has a different type than the code expects. If you see `… is not a function`, the program stopped while loading — fix the error from the card “Error while running” first."

  - id: to-project
    kind: transfer
    capstoneStep: JS-08
    body:
      uk: "У кроці проєкту записи надійдуть із JSON-файла через `fetch`. Твоя `getJson` — готова основа: вона не пустить у програму сторінку помилки чи текст замість даних і передасть статус далі, щоб інтерфейс показав зрозуміле повідомлення."
      en: "In the project step, records will arrive from a JSON file through `fetch`. Your `getJson` is a ready foundation: it keeps an error page or text from entering the program as data and passes the status on so the interface can show a clear message."
