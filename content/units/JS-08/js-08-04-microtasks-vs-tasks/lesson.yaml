id: js-08-04-microtasks-vs-tasks
unit: JS-08
title:
  uk: "Спочатку microtasks, потім tasks"
  en: "Microtasks before tasks"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити повний порядок рядків у консолі для суміші синхронного коду, callbacks promises, `queueMicrotask` і `setTimeout`."
    en: "Predict the full console order for a mix of synchronous logs, promise callbacks, `queueMicrotask` and `setTimeout`."
  - uk: "Пояснити, чому чергу microtasks спорожнюють повністю перед наступною задачею і перед тим, як браузер перемалює сторінку."
    en: "Explain why the microtask queue is drained completely before the next task and before the browser renders."
prerequisites: [js-08-03-chaining-rejection]
subskills:
  - { family: J-11, skill: "call stack/tasks/microtasks", depth: practice }
glossary: [microtask, microtask-queue]
selfCheck: [eight-lines, soon-and-later]

blocks:
  - id: two-queues
    kind: explanation
    title:
      uk: "Дві черги з різними правилами"
      en: "Two queues with different rules"
    body:
      uk: |
        Callbacks таймерів і кліків стають у чергу задач (tasks). Але callbacks із `.then`, `.catch` і `.finally` — інша справа: це [[microtask|microtasks]], і вони стають в окрему [[microtask-queue|чергу microtasks]]. Microtask можна поставити й напряму: `queueMicrotask(callback)`.

        Правило event loop таке:

        1. Виконати одну задачу до кінця (першою задачею є сам код файла).
        2. Виконати **всі** microtasks — і ті, що додалися під час цього, — доки черга не спорожніє.
        3. За потреби перемалювати сторінку.
        4. Взяти наступну задачу.

        Тому callback із `.then` завжди випереджає `setTimeout(…, 0)`, хоч би в якому порядку їх записали: таймер чекає наступної задачі, а microtask виконується одразу після поточного коду.
      en: |
        Timer and click callbacks join the task queue. But `.then`, `.catch` and `.finally` callbacks are different: they are [[microtask|microtasks]], and they join a separate [[microtask-queue]]. You can also queue a microtask directly: `queueMicrotask(callback)`.

        The event loop’s rule is:

        1. Run one task to the end (the first task is the file’s code itself).
        2. Run **all** microtasks — including ones added meanwhile — until the queue is empty.
        3. Repaint the page if it is time to.
        4. Take the next task.

        That is why a `.then` callback always beats `setTimeout(…, 0)`, whichever order they are written in: the timer waits for the next task, while a microtask runs right after the current code.

  - id: eight-lines
    kind: prediction
    prompt:
      uk: "Розташуй вісім рядків консолі в тому порядку, в якому їх надрукує цей код."
      en: "Put the eight console lines in the order this code prints them."
    code: |
      console.log("sync 1");
      setTimeout(() => console.log("timeout A"), 0);
      Promise.resolve().then(() => console.log("then A"));
      queueMicrotask(() => console.log("microtask"));
      setTimeout(() => console.log("timeout B"), 0);
      Promise.resolve().then(() => console.log("then B"));
      console.log("sync 2");
      console.log("sync 3");
    verify:
      logs: ["sync 1", "sync 2", "sync 3", "then A", "microtask", "then B", "timeout A", "timeout B"]
    answer:
      type: order
      items:
        - { id: sync-1, code: "sync 1" }
        - { id: sync-2, code: "sync 2" }
        - { id: sync-3, code: "sync 3" }
        - { id: then-a, code: "then A" }
        - { id: micro, code: "microtask" }
        - { id: then-b, code: "then B" }
        - { id: timeout-a, code: "timeout A" }
        - { id: timeout-b, code: "timeout B" }
    explanation:
      uk: "Спершу весь синхронний код: `sync 1`, `sync 2`, `sync 3`. Потім усі microtasks у тому порядку, в якому їх поставили в чергу: `then A`, `microtask`, `then B`. Лише після цього — задачі таймерів, теж у порядку реєстрації: `timeout A`, `timeout B`. Те, що `timeout A` записано раніше за `then A`, нічого не змінює: таймер чекає наступної задачі."
      en: "First all the synchronous code: `sync 1`, `sync 2`, `sync 3`. Then all microtasks in the order they were queued: `then A`, `microtask`, `then B`. Only after that the timer tasks, also in registration order: `timeout A`, `timeout B`. Writing `timeout A` before `then A` changes nothing: the timer waits for the next task."

  - id: drain-steps
    kind: visual
    visual: event-loop
    title:
      uk: "Черга microtasks спорожнюється повністю"
      en: "The microtask queue is drained completely"
    textEquivalent:
      uk: "Код файла друкує start, реєструє таймер на 0 мс, ставить у чергу microtasks callback then 1 (promise уже виконаний) і ще один microtask micro через queueMicrotask, а потім друкує end. За цей час таймер спрацював, і його callback чекає в черзі задач. Коли код файла закінчився, event loop спершу береться за microtasks: then 1 друкує then 1 і під час своєї роботи ставить ще один microtask inner — він стає в кінець тієї самої черги. Далі micro друкує micro, потім inner друкує inner. Лише коли черга microtasks порожня, браузер може перемалювати сторінку і взяти наступну задачу — callback таймера, що друкує timeout. У консолі: start, end, then 1, micro, inner, timeout."
      en: "The file’s code prints start, registers a 0 ms timer, queues the microtask then 1 (the promise is already fulfilled) and another microtask micro through queueMicrotask, and then prints end. Meanwhile the timer has fired, and its callback waits in the task queue. When the file’s code has finished, the event loop turns to the microtasks first: then 1 prints then 1 and, while running, queues one more microtask, inner — it joins the end of the same queue. Next micro prints micro, then inner prints inner. Only when the microtask queue is empty may the browser repaint the page and take the next task — the timer callback, which prints timeout. The console shows: start, end, then 1, micro, inner, timeout."
    spec:
      file: visuals/drain.js
      steps:
        - line: 1
          log: "start"
          caption:
            uk: "Код файла — перша задача. Він друкує `start`."
            en: "The file’s code is the first task. It prints `start`."
          stack: ["drain.js"]
        - line: 2
          caption:
            uk: "Таймер на 0 мс іде в **Web APIs**."
            en: "A 0 ms timer goes into the **Web APIs**."
          stack: ["drain.js"]
          webApis: ["timer 0 ms"]
        - line: 5
          caption:
            uk: "`Promise.resolve()` уже виконаний, тож callback із `.then` одразу стає в **Microtasks**. Виконатися зараз він не може: стек зайнятий."
            en: "`Promise.resolve()` is already fulfilled, so the `.then` callback joins **Microtasks** at once. It cannot run now: the stack is busy."
          stack: ["drain.js"]
          webApis: ["timer 0 ms"]
          microtasks: ["then 1"]
        - line: 11
          caption:
            uk: "`queueMicrotask` ставить ще один microtask у кінець тієї самої черги."
            en: "`queueMicrotask` puts one more microtask at the end of the same queue."
          stack: ["drain.js"]
          webApis: ["timer 0 ms"]
          microtasks: ["then 1", "micro"]
        - line: 14
          log: "end"
          caption:
            uk: "`end` — останній рядок коду файла. Таймер тим часом спрацював: його callback чекає в **Tasks**."
            en: "`end` is the last line of the file’s code. Meanwhile the timer has fired: its callback waits in **Tasks**."
          stack: ["drain.js"]
          microtasks: ["then 1", "micro"]
          tasks: ["timeout callback"]
        - caption:
            uk: "Задача закінчилася, стек порожній. Тепер event loop бере **не** наступну задачу, а microtasks — усі, скільки є."
            en: "The task is over, the stack is empty. Now the event loop takes **not** the next task but the microtasks — all of them."
          stack: []
          microtasks: ["then 1", "micro"]
          tasks: ["timeout callback"]
        - line: 6
          log: "then 1"
          caption:
            uk: "`then 1` у консолі."
            en: "`then 1` in the console."
          stack: ["then 1"]
          microtasks: ["micro"]
          tasks: ["timeout callback"]
        - line: 7
          caption:
            uk: "Цей microtask ставить ще один — `inner`. Він стає в кінець **тієї самої** черги й виконається ще до таймера."
            en: "This microtask queues another one — `inner`. It joins the end of **the same** queue and will run before the timer."
          stack: ["then 1"]
          microtasks: ["micro", "inner"]
          tasks: ["timeout callback"]
        - line: 12
          log: "micro"
          caption:
            uk: "Наступний microtask: `micro`."
            en: "The next microtask: `micro`."
          stack: ["micro"]
          microtasks: ["inner"]
          tasks: ["timeout callback"]
        - line: 8
          log: "inner"
          caption:
            uk: "І той, що додався під час спорожнення: `inner`."
            en: "And the one added while draining: `inner`."
          stack: ["inner"]
          tasks: ["timeout callback"]
        - caption:
            uk: "Черга microtasks порожня. Лише тепер браузер може перемалювати сторінку (якщо настав час нового кадру) і взяти наступну задачу."
            en: "The microtask queue is empty. Only now may the browser repaint the page (if it is time for a new frame) and take the next task."
          stack: []
          tasks: ["timeout callback"]
        - line: 3
          log: "timeout"
          caption:
            uk: "Задача таймера: `timeout` — останнім, хоча таймер зареєстрували другим рядком коду."
            en: "The timer task: `timeout` — last, although the timer was registered on the second line of code."
          stack: ["timeout callback"]
        - caption:
            uk: "Готово: `start`, `end`, `then 1`, `micro`, `inner`, `timeout`. Задача → усі microtasks → (перемальовування) → наступна задача."
            en: "Done: `start`, `end`, `then 1`, `micro`, `inner`, `timeout`. A task → all microtasks → (repaint) → the next task."
          stack: []

  - id: same-thread
    kind: explanation
    title:
      uk: "Microtasks теж займають стек"
      en: "Microtasks occupy the stack too"
    body:
      uk: |
        Microtasks не працюють «паралельно» чи в окремому потоці. Це звичайний JavaScript у тому самому стеку викликів — просто з пріоритетом вище, ніж у задач.

        Звідси два наслідки:

        - Поки в черзі microtasks щось є, браузер **не перемальовує** сторінку й **не обробляє кліки**: клік — це задача, а задачі чекають, доки microtasks закінчаться.
        - Microtask, що щоразу ставить новий microtask, заморожує сторінку так само, як нескінченний цикл, — і цикл без кінця на promises захист платформи від довгих циклів не зупинить.

        Довгу роботу, яку можна розбити на шматки, планують задачами (`setTimeout`): між ними браузер встигає перемалювати сторінку й відповісти на кліки.
      en: |
        Microtasks do not run “in parallel” or on a separate thread. They are ordinary JavaScript on the same call stack — just with a higher priority than tasks.

        Two consequences follow:

        - While something is in the microtask queue, the browser **does not repaint** the page and **does not handle clicks**: a click is a task, and tasks wait until the microtasks are done.
        - A microtask that keeps queuing a new microtask freezes the page just like an infinite loop — and the platform’s guard against long loops does not stop an endless chain of promises.

        Long work that can be split into pieces is scheduled as tasks (`setTimeout`): between them the browser has time to repaint the page and respond to clicks.

  - id: then-before-timers
    kind: example
    runtime: browser-js
    dir: then-before-timers
    entry: index.js
    strings:
      start: { uk: "початок", en: "start" }
      end: { uk: "кінець", en: "end" }
      timerA: { uk: "таймер A", en: "timer A" }
      timerB: { uk: "таймер B", en: "timer B" }
      thenOne: { uk: "перший then", en: "first then" }
      thenTwo: { uk: "другий then", en: "second then" }
    title:
      uk: "Ланцюжок проти двох таймерів"
      en: "A chain against two timers"
    body:
      uk: |
        Два таймери на 0 мс зареєстровано раніше за ланцюжок із двох `.then`. Другий `.then` стає в чергу лише тоді, коли виконався перший. Запусти й подивись у **Консоль**: обидва `.then` усе одно випереджають обидва таймери.
      en: |
        Two 0 ms timers are registered before a chain of two `.then` calls. The second `.then` joins the queue only once the first has run. Run it and look at the **Console**: both `.then` callbacks still beat both timers.
    tryIt:
      uk: |
        1. Допиши в ланцюжок третій `.then`, що друкує будь-який текст, і запусти: він теж з’явиться раніше за таймери.
        2. Перенеси обидва рядки коду з `setTimeout` у самий кінець файла. Порядок у консолі не зміниться: його визначають черги, а не місце в коді.
      en: |
        1. Add a third `.then` to the chain that prints any text, and run: it also appears before the timers.
        2. Move both lines of code with `setTimeout` to the very end of the file. The console order stays the same: it is decided by the queues, not by the place in the code.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: рендер зі свіжих даних"
      en: "Recall: rendering from fresh data"
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
    items:
      - id: render-replaces
        from: js-06-13-render-list-from-data
        prompt:
          uk: "`render` викликають двічі з різними даними. Що надрукує останній рядок коду?"
          en: "`render` is called twice with different data. What does the last line of code print?"
        code: |
          const list = document.createElement("ul");

          function render(names) {
            const items = names.map((name) => {
              const item = document.createElement("li");
              item.textContent = name;
              return item;
            });
            list.replaceChildren(...items);
          }

          render(["%%lamp%%", "%%mug%%"]);
          render(["%%bicycle%%"]);
          console.log(list.children.length, list.textContent);
        verify:
          logs: ["1 %%bicycle%%"]
        answer:
          type: choice
          options:
            - id: replaced
              text:
                uk: "`1` і «Велосипед»"
                en: "`1` and “Bicycle”"
            - id: appended
              text:
                uk: "`3` і всі три назви"
                en: "`3` and all three names"
              why:
                uk: "`replaceChildren` не додає, а **замінює** весь вміст: старі пункти зникають."
                en: "`replaceChildren` does not add — it **replaces** all the content: the old items disappear."
            - id: first-kept
              text:
                uk: "`2` і перші дві назви"
                en: "`2` and the first two names"
              why:
                uk: "Другий виклик `render` будує список заново з нових даних — від першого виклику нічого не лишається."
                en: "The second call of `render` builds the list again from the new data — nothing remains of the first call."
          correct: [replaced]
        explanation:
          uk: "`render` щоразу перебудовує список зі свіжих даних і замінює ним старий вміст. Тож після другого виклику в списку один пункт. Коли дані надходять пізніше — з таймера чи promise, — достатньо знову викликати `render`; а побачить зміни людина лише тоді, коли браузер перемалює сторінку: після задачі й усіх microtasks."
          en: "`render` rebuilds the list from fresh data every time and replaces the old content with it. So after the second call the list has one item. When data arrives later — from a timer or a promise — calling `render` again is enough; and the person sees the change only when the browser repaints the page: after the task and all its microtasks."

  - id: soon-and-later
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: soon-and-later
    entry: index.js
    title:
      uk: "Пізніше, але в різних чергах"
      en: "Later, but in different queues"
    instructions:
      uk: |
        Допиши дві функції. Обидві друкують `text` у консоль **не одразу**:

        - `logSoon(text)` — як microtask: після коду, що виконується зараз, але раніше за будь-який таймер;
        - `logLater(text)` — як задача: лише після всіх microtasks, що чекають.

        Три рядки коду в кінці файла не змінюй і не переставляй. Коли функції готові, консоль показує `sync`, `micro`, `task` — у порядку, протилежному записаному.
      en: |
        Complete two functions. Both print `text` to the console **not right away**:

        - `logSoon(text)` — as a microtask: after the code running now, but before any timer;
        - `logLater(text)` — as a task: only after every microtask that is waiting.

        Do not change or reorder the three lines of code at the end of the file. When the functions are ready, the console shows `sync`, `micro`, `task` — the reverse of the written order.
    testTitles:
      "the file prints sync, micro, task in that order":
        uk: "Файл друкує sync, micro, task саме в такому порядку"
        en: "The file prints sync, micro, task in that order"
      "logSoon prints nothing right away":
        uk: "logSoon нічого не друкує одразу"
        en: "logSoon prints nothing right away"
      "logSoon prints before a timer that was set earlier":
        uk: "logSoon друкує раніше за таймер, поставлений до нього"
        en: "logSoon prints before a timer that was set earlier"
      "logLater prints nothing right away":
        uk: "logLater нічого не друкує одразу"
        en: "logLater prints nothing right away"
      "logLater prints after a microtask that was queued later":
        uk: "logLater друкує після microtask, поставленого вже після нього"
        en: "logLater prints after a microtask that was queued later"
    hints:
      nudge:
        uk: "Для кожної функції вирішуй: у яку чергу має потрапити callback, що друкує текст, — microtasks чи tasks? І яким викликом його туди поставити?"
        en: "For each function decide: which queue should the callback that prints the text go to — microtasks or tasks? And which call puts it there?"
      explanation:
        uk: "Наприклад, щоб показати «збережено» одразу після поточного коду, але раніше за будь-які таймери, функцію показу ставлять у microtasks: `queueMicrotask` або `.then` уже виконаного promise. А щоб робота дочекалася всіх microtasks і виконалася окремою задачею, її передають таймеру з затримкою 0 мс. В обох випадках у чергу йде функція, яка надрукує текст пізніше, а не результат виклику `console.log`."
        en: "For example, to show “saved” right after the current code but before any timers, the function that shows it is put into microtasks: `queueMicrotask` or `.then` of an already fulfilled promise. And for work to wait for all microtasks and run as a separate task, it is handed to a timer with a 0 ms delay. In both cases the queue receives a function that prints the text later, not the result of calling `console.log`."
    solutionNote:
      uk: "`logSoon` ставить функцію в чергу microtasks через `queueMicrotask` (або `.then` виконаного promise), `logLater` — у чергу задач через `setTimeout(…, 0)`. Тому `micro` випереджає `task`, хоча `logLater` викликано першою, а `sync` друкується ще раніше — синхронно."
      en: "`logSoon` puts a function into the microtask queue with `queueMicrotask` (or `.then` of a fulfilled promise), `logLater` into the task queue with `setTimeout(…, 0)`. So `micro` beats `task` although `logLater` was called first, and `sync` comes even earlier — synchronously."
    feedback:
      - when: { test: "the file prints sync, micro, task in that order" }
        message:
          uk: "Ця перевірка очікує, що файл друкує рівно `sync`, `micro`, `task` у такому порядку. Якщо `micro` і `task` помінялися місцями, функції поставили текст у неправильні черги; якщо `micro` іде першим, `logSoon` друкує одразу."
          en: "This check expects the file to print exactly `sync`, `micro`, `task` in that order. If `micro` and `task` are swapped, the functions use the wrong queues; if `micro` comes first, `logSoon` prints at once."
      - when: { test: "logSoon prints nothing right away" }
        message:
          uk: "Ця перевірка очікує, що під час самого виклику `logSoon` нічого не друкується, а текст з’являється трохи пізніше."
          en: "This check expects nothing to be printed during the call of `logSoon` itself, and the text to appear a little later."
      - when: { test: "logSoon prints before a timer that was set earlier" }
        message:
          uk: "Ця перевірка ставить таймер на 0 мс, потім викликає `logSoon` і очікує, що текст з’явиться раніше за таймер. Так буває лише з microtask: таймер на 0 мс — це задача, і вона чекає за таймером, поставленим раніше."
          en: "This check sets a 0 ms timer, then calls `logSoon`, and expects the text before the timer. Only a microtask does that: a 0 ms timer is a task, and it waits behind the timer set earlier."
      - when: { test: "logLater prints nothing right away" }
        message:
          uk: "Ця перевірка очікує, що під час самого виклику `logLater` нічого не друкується, а текст з’являється трохи пізніше."
          en: "This check expects nothing to be printed during the call of `logLater` itself, and the text to appear a little later."
      - when: { test: "logLater prints after a microtask that was queued later" }
        message:
          uk: "Ця перевірка викликає `logLater`, потім ставить microtask і очікує, що microtask виконається першим. Так буває лише тоді, коли `logLater` планує задачу, а не microtask."
          en: "This check calls `logLater`, then queues a microtask, and expects the microtask to run first. That happens only when `logLater` schedules a task, not a microtask."

  - id: to-project
    kind: transfer
    capstoneStep: JS-08
    body:
      uk: "У проєкті це пояснює, коли сторінка встигає показати «Завантаження…»: зміна в DOM стане видимою лише після поточної задачі й усіх її microtasks. Тому показуй стан завантаження до того, як починаєш чекати даних, і не тримай стек зайнятим довгою роботою."
      en: "In your project this explains when the page manages to show “Loading…”: a change in the DOM becomes visible only after the current task and all its microtasks. So show the loading state before you start waiting for data, and do not keep the stack busy with long work."
