id: js-08-03-chaining-rejection
unit: JS-08
title:
  uk: "Ланцюжки, відхилення та finally"
  en: "Chaining, rejection and finally"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачити, що отримує кожен `.then` у ланцюжку, коли попередній крок повертає значення, повертає promise або кидає помилку."
    en: "Predict what each `.then` in a chain receives when the previous step returns a value, returns a promise or throws."
  - uk: "Поставити один `.catch` так, щоб він обробив відхилення будь-де в ланцюжку, і використати `.finally` для прибирання, яке має відбутися за будь-якого результату."
    en: "Place one `.catch` so that a rejection anywhere in the chain is handled, and use `.finally` for cleanup that runs either way."
prerequisites: [js-08-02-promises, js-07-03-try-catch-finally]
subskills:
  - { family: J-11, skill: "promise chaining and rejection", depth: practice }
glossary: [promise-chain, unhandled-rejection]
selfCheck: [who-gets-what, load-label]

blocks:
  - id: each-then
    kind: explanation
    title:
      uk: "Кожен .then повертає новий promise"
      en: "Every .then returns a new promise"
    body:
      uk: |
        `.then(callback)` не лише чекає значення — він **сам повертає новий promise**. Тому виклики можна ставити один за одним: це [[promise-chain|ланцюжок promises]]. Що отримає наступний крок, вирішує callback попереднього:

        | Callback попереднього кроку… | Наступний `.then` отримує… |
        |---|---|
        | повертає значення (`return 20`) | це значення |
        | повертає promise | значення цього promise, коли він виконається: ланцюжок чекає |
        | нічого не повертає | `undefined` |
        | кидає помилку (`throw`) | нічого: його callback пропускається, ланцюжок стає відхиленим |

        ```js
        Promise.resolve(2)
          .then((n) => n * 10)        // 20 іде далі
          .then((n) => n + 1)         // 21 іде далі
          .then((n) => console.log(n)); // 21
        ```

        Ланцюжок читається згори донизу, як звичайний код, хоча кожен крок виконується пізніше за попередній.
      en: |
        `.then(callback)` does not only wait for a value — it **returns a new promise itself**. That is why calls can follow one another: a [[promise-chain]]. What the next step receives is decided by the callback of the previous one:

        | The previous step’s callback… | The next `.then` receives… |
        |---|---|
        | returns a value (`return 20`) | that value |
        | returns a promise | that promise’s value once it is fulfilled: the chain waits |
        | returns nothing | `undefined` |
        | throws an error (`throw`) | nothing: its callback is skipped, the chain becomes rejected |

        ```js
        Promise.resolve(2)
          .then((n) => n * 10)        // 20 goes on
          .then((n) => n + 1)         // 21 goes on
          .then((n) => console.log(n)); // 21
        ```

        A chain reads top to bottom like ordinary code, although every step runs later than the one before it.

  - id: who-gets-what
    kind: prediction
    prompt:
      uk: "Другий крок цього ланцюжка кидає помилку, а `.catch` стоїть перед останнім `.then`. Що з’явиться в консолі?"
      en: "The second step of this chain throws an error, and `.catch` sits before the last `.then`. What appears in the console?"
    code: |
      Promise.resolve(5)
        .then((n) => {
          console.log("a", n);
          return n * 2;
        })
        .then((n) => {
          console.log("b", n);
          throw new Error("no price");
        })
        .then((n) => {
          console.log("c", n);
          return n + 1;
        })
        .catch((error) => {
          console.log("catch:", error.message);
          return 0;
        })
        .then((n) => console.log("d", n));
    verify:
      logs: ["a 5", "b 10", "catch: no price", "d 0"]
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "`a 5`, `b 10`, `catch: no price`, `d 0`"
            en: "`a 5`, `b 10`, `catch: no price`, `d 0`"
        - id: c-runs
          text:
            uk: "`a 5`, `b 10`, `c undefined`, `catch: no price`, `d 0`"
            en: "`a 5`, `b 10`, `c undefined`, `catch: no price`, `d 0`"
          why:
            uk: "Після `throw` ланцюжок відхилений, і callbacks із `.then` пропускаються аж до найближчого `.catch`. Крок `c` не виконується зовсім."
            en: "After `throw` the chain is rejected, and `.then` callbacks are skipped up to the nearest `.catch`. Step `c` does not run at all."
        - id: stops-after-catch
          text:
            uk: "`a 5`, `b 10`, `catch: no price` — після `.catch` ланцюжок закінчено"
            en: "`a 5`, `b 10`, `catch: no price` — the chain is over after `.catch`"
          why:
            uk: "`.catch` теж повертає новий promise. Якщо його callback нормально повернув значення (`0`), ланцюжок знову виконаний, і наступний `.then` отримує це значення."
            en: "`.catch` returns a new promise too. When its callback returns a value normally (`0`), the chain is fulfilled again, and the next `.then` receives that value."
        - id: error-card
          text:
            uk: "`a 5`, `b 10`, а потім картка з помилкою `no price`"
            en: "`a 5`, `b 10`, then a card with the error `no price`"
          why:
            uk: "Помилку обробляє `.catch` нижче в ланцюжку, тож вона вважається обробленою: жодної картки з помилкою не буде."
            en: "The `.catch` further down the chain handles the error, so it counts as handled: no error card appears."
      correct: [right]
    explanation:
      uk: "`a` отримує 5 і повертає 10, `b` отримує 10 і кидає помилку. Відтепер ланцюжок відхилений: крок `c` пропускається, а помилку отримує `.catch`. Його callback повертає `0` — і ланцюжок знову виконаний, тож `d` отримує `0`. Обробка помилки не закінчує ланцюжок, а повертає його в нормальний стан."
      en: "`a` receives 5 and returns 10, `b` receives 10 and throws. From now on the chain is rejected: step `c` is skipped, and `.catch` receives the error. Its callback returns `0` — and the chain is fulfilled again, so `d` receives `0`. Handling an error does not end the chain; it brings it back to normal."

  - id: skip-to-catch
    kind: visual
    visual: code-trace
    strings:
      currency: { uk: "грн", en: "UAH" }
      unknown: { uk: "ціна невідома", en: "price unknown" }
      loadingOff: { uk: "завантаження вимкнено", en: "loading off" }
    title:
      uk: "Від throw до .catch і .finally"
      en: "From throw to .catch and .finally"
    textEquivalent:
      uk: "Об’єкт prices зберігає ціну 80 для w-01 і null для w-05. Ланцюжок починається з Promise.resolve(\"w-05\") і має шість кроків. Код файла лише будує ланцюжок і закінчується; callbacks виконуються потім, по одному. Крок 1 отримує id w-05 і повертає null. Крок 2 бачить null і кидає Error(\"no price\"): ланцюжок стає відхиленим. Крок 3 (price + \" %%currency%%\") пропускається — його callback не викликається жодного разу. Відхилення отримує .catch: він повертає текст \"%%unknown%%\", і ланцюжок знову виконаний. Наступний .then отримує цей текст і друкує його. Останнім виконується .finally: він не отримує значення, лише друкує %%loadingOff%%. У консолі: %%unknown%%, %%loadingOff%%."
      en: "The prices object stores the price 80 for w-01 and null for w-05. The chain starts with Promise.resolve(\"w-05\") and has six steps. The file’s code only builds the chain and finishes; the callbacks run later, one at a time. Step 1 receives the id w-05 and returns null. Step 2 sees null and throws Error(\"no price\"): the chain becomes rejected. Step 3 (price + \" %%currency%%\") is skipped — its callback is never called. The .catch receives the rejection: it returns the text \"%%unknown%%\", and the chain is fulfilled again. The next .then receives that text and prints it. Last, .finally runs: it receives no value and only prints %%loadingOff%%. The console shows: %%unknown%%, %%loadingOff%%."
    spec:
      file: visuals/chain.js
      captions:
        - at: { line: 3 }
          text:
            uk: "Код файла будує ланцюжок із шести кроків. Жоден callback ще не виконується: кожен чекатиме результату попереднього кроку."
            en: "The file’s code builds a chain of six steps. No callback runs yet: each one will wait for the result of the previous step."
        - at: { line: 14, kind: end }
          text:
            uk: "Код файла закінчився, а в консолі ще порожньо. Callbacks ланцюжка виконуються тепер — по одному, кожен із результатом попереднього."
            en: "The file’s code has finished, and the console is still empty. The chain’s callbacks run now — one at a time, each with the previous result."
        - at: { line: 4, kind: return }
          text:
            uk: "Крок 1 отримав `\"w-05\"` і повертає `null`: ціни немає. Це значення отримає наступний `.then`."
            en: "Step 1 received `\"w-05\"` and returns `null`: there is no price. The next `.then` receives this value."
        - at: { line: 7, kind: stmt }
          text:
            uk: "Крок 2 бачить `null` і зараз кине помилку."
            en: "Step 2 sees `null` and is about to throw an error."
        - at: { line: 7, kind: throw }
          text:
            uk: "Помилка залишає callback: promise, який повернув цей `.then`, **відхилено**. Тепер ланцюжок шукає найближчий обробник помилки."
            en: "The error leaves the callback: the promise this `.then` returned is **rejected**. Now the chain looks for the nearest error handler."
        - at: { line: 12, kind: call }
          text:
            uk: "Крок 3 у рядку 11 **пропущено** — його callback не викликався. Відхилення отримує `.catch`: у `error` — об’єкт помилки."
            en: "Step 3 on line 11 was **skipped** — its callback was never called. The `.catch` receives the rejection: `error` holds the error object."
        - at: { line: 12, kind: return }
          text:
            uk: "`.catch` повертає текст `\"%%unknown%%\"` — і ланцюжок знову **виконаний**. Далі цей текст іде, як звичайне значення."
            en: "`.catch` returns the text `\"%%unknown%%\"` — and the chain is **fulfilled** again. From here this text moves on like an ordinary value."
        - at: { line: 13, kind: call }
          text:
            uk: "Наступний `.then` отримує запасний текст і друкує його."
            en: "The next `.then` receives the fallback text and prints it."
        - at: { line: 14, kind: call }
          text:
            uk: "`.finally` виконується за будь-якого результату. Його callback не отримує значення — тут він лише друкує `%%loadingOff%%`."
            en: "`.finally` runs whatever the result. Its callback receives no value — here it only prints `%%loadingOff%%`."
        - at: { line: 14, kind: return }
          text:
            uk: "Готово: `%%unknown%%`, `%%loadingOff%%`. Один `.catch` обробив помилку з кроку 2, а `.finally` прибрав за собою."
            en: "Done: `%%unknown%%`, `%%loadingOff%%`. One `.catch` handled the error from step 2, and `.finally` cleaned up."

  - id: catch-finally
    kind: explanation
    title:
      uk: ".catch, .finally і необроблене відхилення"
      en: ".catch, .finally and an unhandled rejection"
    body:
      uk: |
        - **`.catch(callback)`** отримує причину відхилення з будь-якого кроку **вище** за себе. Те, що він поверне, піде далі ланцюжком як звичайне значення. Тому один `.catch` наприкінці ловить помилки всіх кроків, а `.catch` посередині дає запасне значення й дозволяє продовжити.
        - **`.finally(callback)`** виконується і після успіху, і після помилки — як блок [[finally-block|finally]] у `try/catch`. Його callback не отримує значення, а результат ланцюжка проходить крізь нього без змін: значення лишається значенням, помилка — помилкою.

        Якщо відхилення не обробив жоден `.catch`, це [[unhandled-rejection|необроблене відхилення]]. Воно не зникає тихо: браузер повідомляє про нього, а на цій платформі в консолі з’являється картка «Помилка під час виконання» з поясненням, що promise завершився помилкою, яку ніхто не обробив. Інші частини програми при цьому працюють далі, але користувач нічого не дізнається, якщо ти сам не покажеш помилку.
      en: |
        - **`.catch(callback)`** receives the rejection reason from any step **above** it. Whatever it returns goes on down the chain as an ordinary value. So one `.catch` at the end catches the errors of all steps, and a `.catch` in the middle provides a fallback value and lets the chain continue.
        - **`.finally(callback)`** runs after success and after an error alike — like the [[finally-block|finally]] block of `try/catch`. Its callback receives no value, and the chain’s result passes through it unchanged: a value stays a value, an error stays an error.

        If no `.catch` handled a rejection, it is an [[unhandled-rejection]]. It does not quietly disappear: the browser reports it, and on this platform the console shows the card “Error while running” explaining that a promise was rejected and nothing handled it. The rest of the program keeps working, but the user learns nothing unless you show the error yourself.

  - id: move-catch
    kind: example
    runtime: browser-js
    dir: move-catch
    entry: index.js
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      notFound: { uk: "немає витрати", en: "no expense" }
      found: { uk: "знайдено:", en: "found:" }
      caught: { uk: "оброблено помилку:", en: "handled the error:" }
      amount: { uk: "сума, грн:", en: "amount, UAH:" }
      loadingOff: { uk: "вимикаю «Завантаження…»", en: "turning “Loading…” off" }
    title:
      uk: "Пересунь .catch"
      en: "Move the .catch"
    body:
      uk: |
        `findExpense` через 300 мс знаходить витрату або відхиляє promise, якщо такого `id` немає. Витрати `e-07` у списку немає. Натисни **Запустити** й подивись у **Консоль**: `.catch` дав запасну суму `0`, наступний `.then` її надрукував, а `.finally` виконався в кінці.
      en: |
        `findExpense` finds an expense after 300 ms or rejects the promise when there is no such `id`. There is no expense `e-07` in the list. Press **Run** and look at the **Console**: `.catch` gave the fallback amount `0`, the next `.then` printed it, and `.finally` ran at the end.
    tryIt:
      uk: |
        1. Заміни `"e-07"` на `"e-01"` і запусти: тепер `.catch` пропускається, а сума — `845.5`.
        2. Поверни `"e-07"` і перенеси весь виклик `.catch(...)` нижче, одразу перед `.finally(...)`. Рядок із сумою зникне: помилка пропустила обидва `.then`.
        3. Тепер видали виклик `.catch(...)` зовсім. Рядок про «Завантаження…» ще надрукується, а потім з’явиться картка «Помилка під час виконання»: відхилення ніхто не обробив.
      en: |
        1. Replace `"e-07"` with `"e-01"` and run: now `.catch` is skipped, and the amount is `845.5`.
        2. Put `"e-07"` back and move the whole `.catch(...)` call further down, right before `.finally(...)`. The amount line disappears: the error skipped both `.then` steps.
        3. Now delete the `.catch(...)` call altogether. The line about “Loading…” is still printed, and then the card “Error while running” appears: nobody handled the rejection.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: finally без catch"
      en: "Recall: finally without catch"
    strings:
      saving: { uk: "зберігаю", en: "saving" }
      flagOff: { uk: "прапорець вимкнено", en: "flag off" }
      after: { uk: "після save", en: "after save" }
    items:
      - id: finally-then-error
        from: js-07-03-try-catch-finally
        prompt:
          uk: "Тут є `try` і `finally`, але немає `catch`. Що з’явиться в консолі?"
          en: "There is `try` and `finally` here, but no `catch`. What appears in the console?"
        code: |
          function save() {
            try {
              console.log("%%saving%%");
              throw new Error("disk full");
            } finally {
              console.log("%%flagOff%%");
            }
          }

          save();
          console.log("%%after%%");
        verify:
          logs: ["%%saving%%", "%%flagOff%%"]
          error: Error
        answer:
          type: choice
          options:
            - id: finally-then-error
              text:
                uk: "«зберігаю», «прапорець вимкнено», а потім помилка `disk full`"
                en: "“saving”, “flag off”, then the error `disk full`"
            - id: finally-skipped
              text:
                uk: "«зберігаю», а потім помилка `disk full`"
                en: "“saving”, then the error `disk full`"
              why:
                uk: "`finally` виконується завжди, навіть коли помилку ніхто не перехопив."
                en: "`finally` always runs, even when nobody catches the error."
            - id: finally-catches
              text:
                uk: "«зберігаю», «прапорець вимкнено», «після save»"
                en: "“saving”, “flag off”, “after save”"
              why:
                uk: "`finally` не обробляє помилку. Після нього помилка летить далі, до коду, що викликав `save`, і зупиняє його."
                en: "`finally` does not handle the error. After it the error flies on to the code that called `save` and stops it."
          correct: [finally-then-error]
        explanation:
          uk: "`finally` виконується і після помилки, але не перехоплює її: помилка йде далі й зупиняє код файла, тож «після save» не друкується. `.finally` у ланцюжку promises поводиться так само — прибирає й передає помилку далі."
          en: "`finally` runs after the error too but does not catch it: the error moves on and stops the file’s code, so “after save” is not printed. `.finally` in a promise chain behaves the same — it cleans up and passes the error on."

  - id: load-label
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: load-label
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      noDate: { uk: "без терміну", en: "no due date" }
      notFound: { uk: "справу не знайдено", en: "task not found" }
    title:
      uk: "Підпис справи через ланцюжок"
      en: "A task label through a chain"
    instructions:
      uk: |
        Допиши `loadLabel(id)`. Вона має **повернути** ланцюжок, що починається з `findTask(id)`:

        - для знайденої справи — підпис, який будує `formatLabel(task)`;
        - для невідомого `id` — текст «справу не знайдено», а не відхилений promise;
        - змінна `loading` стає `true` на початку (цей рядок уже є) і знову `false`, коли все закінчилося, — і після успіху, і після помилки.

        `findTask` чекає 50 мс і відхиляє promise, якщо такої справи немає. Щоб побачити результат, розкоментуй останній рядок коду й запусти.
      en: |
        Complete `loadLabel(id)`. It must **return** a chain that starts with `findTask(id)`:

        - for a task that is found — the label built by `formatLabel(task)`;
        - for an unknown `id` — the text “task not found”, not a rejected promise;
        - the variable `loading` becomes `true` at the start (that line is already there) and `false` again once everything is over — after success and after an error alike.

        `findTask` waits 50 ms and rejects the promise when there is no such task. To see the result, uncomment the last line of code and run.
    testTitles:
      "gives the label of a known task":
        uk: "Для відомої справи дає її підпис"
        en: "Gives the label of a known task"
      "gives the not-found text for an unknown id":
        uk: "Для невідомого id дає текст «справу не знайдено»"
        en: "Gives the not-found text for an unknown id"
      "loading is true while the task loads":
        uk: "Поки справа завантажується, loading дорівнює true"
        en: "loading is true while the task loads"
      "loading is false again after a known task":
        uk: "Після відомої справи loading знову false"
        en: "loading is false again after a known task"
      "loading is false again after an unknown id":
        uk: "Після невідомого id loading знову false"
        en: "loading is false again after an unknown id"
    hints:
      nudge:
        uk: "Скільки кроків має ланцюжок після `findTask(id)`: перетворити справу на підпис, підстрахуватися від помилки, прибрати за собою? Порядок кроків важливий."
        en: "How many steps does the chain need after `findTask(id)`: turn the task into a label, guard against an error, clean up? The order of the steps matters."
      explanation:
        uk: "Так само будують, наприклад, завантаження серії звички: спершу `.then`, що рахує серію зі звички; потім `.catch`, що повертає запасне `-1`, якщо звички немає; наприкінці `.finally`, що ховає індикатор. `.catch` стоїть **після** `.then`, щоб ловити помилку з будь-якого кроку вище, а `.finally` — останнім, бо виконується за будь-якого результату. І не забудь `return` перед ланцюжком."
        en: "Loading a habit’s streak is built the same way, for example: first a `.then` that computes the streak from the habit; then a `.catch` that returns the fallback `-1` when there is no habit; at the end a `.finally` that hides the indicator. The `.catch` comes **after** the `.then` so it catches an error from any step above, and `.finally` comes last because it runs whatever the result. And do not forget `return` in front of the chain."
    solutionNote:
      uk: "`findTask(id)` → `.then` будує підпис → `.catch` перетворює відхилення на запасний текст → `.finally` вимикає `loading` за будь-якого результату. `.finally` пропускає значення крізь себе, тож ланцюжок усе одно виконується підписом. Варіант, що вимикає `loading` і в `.then`, і в `.catch`, теж правильний, але `.finally` каже те саме одним кроком."
      en: "`findTask(id)` → `.then` builds the label → `.catch` turns a rejection into the fallback text → `.finally` switches `loading` off whatever the result. `.finally` lets the value pass through, so the chain is still fulfilled with the label. Switching `loading` off in both `.then` and `.catch` is also correct, but `.finally` says the same in one step."
    feedback:
      - when: { test: "gives the label of a known task" }
        message:
          uk: "Ця перевірка очікує, що `loadLabel(\"t-01\")` виконується текстом, який повертає `formatLabel` для цієї справи. Якщо отримано `undefined`, функція чи якийсь крок ланцюжка нічого не повертає."
          en: "This check expects `loadLabel(\"t-01\")` to be fulfilled with the text `formatLabel` returns for that task. If it gives `undefined`, the function or one of the chain’s steps returns nothing."
      - when: { test: "gives the not-found text for an unknown id" }
        message:
          uk: "Ця перевірка очікує, що для `\"t-99\"` promise **виконується** текстом «справу не знайдено». Якщо він відхилений, у ланцюжку бракує `.catch`; якщо текст інший, перевір, чи `.catch` стоїть після `.then`, а не перед ним."
          en: "This check expects the promise for `\"t-99\"` to be **fulfilled** with the text “task not found”. If it is rejected, the chain lacks a `.catch`; if the text is different, check that `.catch` comes after `.then`, not before it."
      - when: { test: "loading is true while the task loads" }
        message:
          uk: "Ця перевірка очікує, що одразу після виклику `loadLabel` змінна `loading` дорівнює `true`, а сама функція повертає promise."
          en: "This check expects the variable `loading` to be `true` right after `loadLabel` is called, and the function to return a promise."
      - when: { test: "loading is false again after a known task" }
        message:
          uk: "Ця перевірка очікує, що після успішного завантаження `loading` знову дорівнює `false`."
          en: "This check expects `loading` to be `false` again after a successful load."
      - when: { test: "loading is false again after an unknown id" }
        message:
          uk: "Ця перевірка очікує, що `loading` дорівнює `false` і після невідомого `id`. Вимикати прапорець лише в `.then` замало: після помилки цей `.then` пропускається."
          en: "This check expects `loading` to be `false` after an unknown `id` as well. Switching the flag off only in `.then` is not enough: after an error that `.then` is skipped."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` означає, що значення має не той тип, на який розраховує код. Якщо всі перевірки впали разом і є картка «Помилка під час виконання», програма зупинилася ще під час завантаження — спершу виправ помилку з цієї картки. Якщо в повідомленні є `reading 'then'`, `loadLabel` нічого не повертає: перед ланцюжком потрібен `return`."
          en: "A `TypeError` means a value has a different type than the code expects. If every check failed at once and the card “Error while running” is shown, the program stopped while loading — fix the error from that card first. If the message mentions `reading 'then'`, `loadLabel` returns nothing: the chain needs a `return` in front of it."

  - id: to-project
    kind: transfer
    capstoneStep: JS-08
    body:
      uk: "Завантаження записів у проєкті матиме ту саму форму: `.then` перетворює дані, один `.catch` показує зрозуміле повідомлення про помилку, а `.finally` прибирає «Завантаження…» — і після успіху, і після помилки."
      en: "Loading records in your project will have the same shape: `.then` transforms the data, one `.catch` shows a clear error message, and `.finally` removes “Loading…” — after success and after an error alike."
