id: re-12-03-versions-artifacts-updates
unit: RE-12
title:
  uk: "Версії, артефакти й оновлення залежностей"
  en: "Versions, artifacts and dependency updates"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Позначити артефакт збирання версією випуску й commit-ом, щоб будь-яку віддану копію можна було простежити до її вихідного коду."
    en: "Stamp a build artifact with its release version and commit so any served copy can be traced back to its source."
  - uk: "Спланувати оновлення залежності: прочитати діапазон semver і нотатки випуску, оновити на гілці, пройти всі перевірки й знати, як відкотити."
    en: "Plan a dependency update: read the changelog and the semver range, update on a branch, run every check and know how to revert."
prerequisites: [re-12-02-quality-checks-ci, js-15-04-install-lockfile-semver, js-15-08-branches-history]
subskills:
  - { family: P-06, skill: "artifact/release version", depth: intro }
  - { family: P-06, skill: "dependency updates", depth: intro }
glossary: [build-artifact, release-version, dependency-update]
selfCheck: [predict-which-code, build-info]

blocks:
  - id: what-is-served
    kind: explanation
    title:
      uk: "Який саме код зараз у людей"
      en: "Which code people have right now"
    body:
      uk: |
        Тека `dist`, зібрана з певного commit, — це [[build-artifact|артефакт збирання]]. Відтоді, як його зібрали, код у репозиторії живе далі: нові commit-и, нова версія в `package.json`. А людям і далі віддають той артефакт — доки хтось не збере й не викладе новий.

        Тож рядок `"version"` у `package.json` каже, що ти **збираєшся** випустити, а не що зараз працює в людей. Щоб будь-яку копію можна було простежити до її коду, збирання вписує в артефакт два значення — так само, як `VITE_APP_TITLE` у минулому уроці:

        - [[release-version|версію випуску]] — `0.1.0` з `package.json`, яку ти поставив свідомо командою `npm version`;
        - короткий id commit-а, з якого зібрано, — те, що друкує `git rev-parse --short HEAD`.

        Футер «Version 0.1.0 (9010501)» на сторінці відповідає на запитання «що в мене відкрито?» без жодних здогадок: `git switch --detach 9010501` поверне саме той код.
      en: |
        The `dist` folder built from a particular commit is a [[build-artifact]]. Since it was built, the code in the repository moves on: new commits, a new version in `package.json`. People, though, are still given that artifact — until someone builds and publishes a new one.

        So the `"version"` line in `package.json` says what you **intend** to release, not what is running for people right now. So that any copy can be traced back to its code, the build writes two values into the artifact — just like `VITE_APP_TITLE` in the last lesson:

        - the [[release-version]] — `0.1.0` from `package.json`, set on purpose with the `npm version` command;
        - the short id of the commit it was built from — what `git rev-parse --short HEAD` prints.

        A footer “Version 0.1.0 (9010501)” on the page answers “what do I have open?” without any guessing: `git switch --detach 9010501` brings back exactly that code.

  - id: predict-which-code
    kind: prediction
    runnable: false
    prompt:
      uk: "Учора ти зібрав і виклав застосунок з commit-а `9010501`, у `package.json` тоді стояло `\"version\": \"0.1.0\"`. Сьогодні на `main` три нові commit-и, а `package.json` каже `\"version\": \"0.2.0\"`. Нового збирання ще ніхто не викладав. Людина відкриває сайт. Який код вона отримує?"
      en: "Yesterday you built and published the app from commit `9010501`; `package.json` then said `\"version\": \"0.1.0\"`. Today `main` has three new commits, and `package.json` says `\"version\": \"0.2.0\"`. Nobody has published a new build yet. A person opens the site. Which code do they get?"
    answer:
      type: choice
      options:
        - id: old-artifact
          text: { uk: "Артефакт, зібраний з `9010501`: футер покаже «Version 0.1.0 (9010501)»", en: "The artifact built from `9010501`: the footer shows “Version 0.1.0 (9010501)”" }
        - id: latest-main
          text: { uk: "Код з останнього commit-а `main`, версія 0.2.0", en: "The code of the latest commit on `main`, version 0.2.0" }
          why:
            uk: "Сайт віддає файли, які лежать на сервері, а не репозиторій. Нові commit-и потраплять до людей лише з новим збиранням і новим викладанням."
            en: "The site serves the files on the server, not the repository. New commits reach people only with a new build and a new publication."
        - id: mixed
          text: { uk: "Старий код, але футер уже покаже 0.2.0, бо версію читають з `package.json`", en: "The old code, but the footer already shows 0.2.0, because the version is read from `package.json`" }
          why:
            uk: "Версію вписано в артефакт під час збирання, як текст. Браузер не бачить `package.json` — лише `dist`, де досі стоїть `0.1.0`."
            en: "The version was written into the artifact during the build, as text. The browser does not see `package.json` — only `dist`, which still says `0.1.0`."
      correct: [old-artifact]
    explanation:
      uk: "Що віддають людям, вирішує артефакт, а не репозиторій. Вписані під час збирання версія й commit — його паспорт: за ними завжди можна знайти точний код, з якого зібрано файли, навіть коли `main` давно пішов уперед."
      en: "What people are given is decided by the artifact, not by the repository. The version and commit written in during the build are its passport: with them you can always find the exact code the files were built from, even when `main` has long moved on."

  - id: version-tag
    kind: example
    runtime: browser-react
    dir: version-tag
    entry: main.jsx
    strings:
      release: { uk: "Випуск", en: "Release" }
      expensesTitle: { uk: "Витрати", en: "Expenses" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      onPage: { uk: "На сторінці:", en: "On the page:" }
      matches: { uk: "збігається з тим, що вписало збирання", en: "matches what the build wrote in" }
      differs: { uk: "не збігається; збирання вписало:", en: "does not match; the build wrote in:" }
    title:
      uk: "Позначка випуску на сторінці"
      en: "A release tag on the page"
    body:
      uk: |
        У пісочниці немає кроку збирання, тож `buildMeta.js` стоїть на місці того, що вписав би `define` у `vite.config.ts`. `VersionTag` показує обидва значення, а `main.jsx` після показу перевіряє, що на сторінці саме вони.

        Натисни **Запустити**: на вкладці **Сторінка** внизу видно «Випуск 0.1.0 · 9010501», а в **Консолі** — результат перевірки.
      en: |
        The sandbox has no build step, so `buildMeta.js` stands in for what `define` in `vite.config.ts` would write in. `VersionTag` shows both values, and `main.jsx`, after rendering, checks that the page shows exactly them.

        Press **Run**: at the bottom of the **Page** tab you see “Release 0.1.0 · 9010501”, and the **Console** shows the result of the check.
    tryIt:
      uk: |
        1. У `buildMeta.js` зміни `version` на `"0.2.0"` і `commit` на `"b267763"` — так, ніби ти зібрав із іншого commit-а. Запусти: сторінка й перевірка показують нові значення. Одна збірка — одна пара значень.
        2. Видали в `buildMeta.js` рядок `commit: …` і запусти. На сторінці «Випуск 0.2.0 · » з обірваним кінцем: JSX не показує `undefined` зовсім. А перевірка в консолі не пройшла — вона чекала «Випуск 0.2.0 · undefined», бо шаблонний рядок перетворює відсутнє значення на слово `undefined`. Обидва варіанти людині не допоможуть. У вправі нижче ти напишеш футер, що обробляє відсутні значення свідомо.
      en: |
        1. In `buildMeta.js` change `version` to `"0.2.0"` and `commit` to `"b267763"` — as if you had built from another commit. Run it: the page and the check show the new values. One build — one pair of values.
        2. Delete the `commit: …` line in `buildMeta.js` and run it. The page shows “Release 0.2.0 · ” with a cut-off end: JSX does not show `undefined` at all. And the console check failed — it expected “Release 0.2.0 · undefined”, because a template literal turns a missing value into the word `undefined`. Neither helps a person. In the exercise you write a footer that handles missing values on purpose.

  - id: build-info
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: build-info
    entry: main.jsx
    editable: [BuildInfo.jsx]
    strings:
      versionWord: { uk: "Версія", en: "Version" }
      plannerTitle: { uk: "Планувальник", en: "Planner" }
      taskRent: { uk: "Сплатити оренду", en: "Pay rent" }
      taskBank: { uk: "Подзвонити в банк", en: "Call the bank" }
    title:
      uk: "Футер BuildInfo: версія, короткий commit і dev"
      en: "A BuildInfo footer: version, short commit and dev"
    instructions:
      uk: |
        Допиши `BuildInfo.jsx`. Компонент отримує пропси `version` і `commit` — те, що вписало збирання (`buildMeta.js` стоїть на його місці) — і рендерить `<footer>` з текстом:

        | Пропси | Текст футера |
        |---|---|
        | `version: "1.4.0"`, `commit` — повний id з 40 символів `"9c08fd1e2b7a…"` | `Версія 1.4.0 (9c08fd1)` — лише перші 7 символів commit-а |
        | `version: "2.0.1"`, `commit: "3fa1c02"` | `Версія 2.0.1 (3fa1c02)` |
        | `version` немає (`undefined`) або вона `""` | `Версія dev` |
        | `version: "1.4.0"`, `commit` немає або він `""` | `Версія 1.4.0` |

        Dev-сервер нічого не вписує, тож випадок `dev` трапляється щодня. Перевірки рендерять `BuildInfo` з кожним із цих наборів пропсів і порівнюють текст футера (зайві пробіли між словами не важать).
      en: |
        Finish `BuildInfo.jsx`. The component receives the props `version` and `commit` — what the build wrote in (`buildMeta.js` stands in for it) — and renders a `<footer>` with the text:

        | Props | Footer text |
        |---|---|
        | `version: "1.4.0"`, `commit` — a full 40-character id `"9c08fd1e2b7a…"` | `Version 1.4.0 (9c08fd1)` — only the first 7 characters of the commit |
        | `version: "2.0.1"`, `commit: "3fa1c02"` | `Version 2.0.1 (3fa1c02)` |
        | no `version` (`undefined`), or it is `""` | `Version dev` |
        | `version: "1.4.0"`, no `commit`, or it is `""` | `Version 1.4.0` |

        A dev server writes nothing in, so the `dev` case happens every day. The checks render `BuildInfo` with each of these sets of props and compare the footer text (extra spaces between words do not matter).
    testTitles:
      "shows the version and the first 7 characters of the commit":
        uk: "Показує версію й перші 7 символів commit-а"
        en: "Shows the version and the first 7 characters of the commit"
      "a commit id that is already short is shown whole":
        uk: "Короткий id commit-а показано повністю"
        en: "A commit id that is already short is shown whole"
      "without a version it shows dev":
        uk: "Без версії показує `dev`"
        en: "Without a version it shows `dev`"
      "an empty version also shows dev":
        uk: "Порожня версія теж дає `dev`"
        en: "An empty version also shows `dev`"
      "without a commit it shows only the version":
        uk: "Без commit-а показує лише версію"
        en: "Without a commit it shows only the version"
    hints:
      nudge:
        uk: "Спершу розбери випадок, коли версії немає: тоді commit уже не важить. Що спільного між `undefined` і `\"\"` в умові `if`?"
        en: "First handle the case with no version: then the commit no longer matters. What do `undefined` and `\"\"` have in common in an `if` condition?"
      explanation:
        uk: |
          І `undefined`, і порожній рядок `""` — хибні значення: `!value` для обох дає `true`. Частину рядка дає метод `slice(start, end)`: він не скаржиться, коли рядок коротший за `end`, а просто повертає весь. Схожий приклад з іншими даними:

          ```jsx
          function Initials({ name }) {
            if (!name) return <span>?</span>;
            return <span>{name.slice(0, 2).toUpperCase()}</span>;
          }
          ```
        en: |
          Both `undefined` and the empty string `""` are falsy values: `!value` gives `true` for both. A part of a string comes from the `slice(start, end)` method: it does not complain when the string is shorter than `end`, it just returns the whole string. A similar example with other data:

          ```jsx
          function Initials({ name }) {
            if (!name) return <span>?</span>;
            return <span>{name.slice(0, 2).toUpperCase()}</span>;
          }
          ```
    solutionNote:
      uk: "`!version` ловить і `undefined`, і `\"\"` одним рядком, а ранній `return` прибирає з решти коду випадок `dev`. `slice(0, 7)` обрізає повний id і не чіпає вже короткий. Перевірку `commit` треба зробити окремо: інакше відсутній commit дає текст `(undefined)` — саме його ти бачив у прикладі в іншому вигляді."
      en: "`!version` catches both `undefined` and `\"\"` in one line, and the early `return` takes the `dev` case out of the rest of the code. `slice(0, 7)` cuts a full id and leaves a short one alone. The `commit` check has to be separate: otherwise a missing commit gives the text `(undefined)` — the same problem you saw in the example in another form."
    feedback:
      - when: { test: "shows the version and the first 7 characters of the commit" }
        message:
          uk: "Ця перевірка чекає `Версія 1.4.0 (9c08fd1)` для повного id з 40 символів. Якщо в дужках увесь довгий id, візьми лише перші 7 символів. Якщо футер порожній, компонент ще нічого не рендерить усередині `<footer>`."
          en: "This check expects `Version 1.4.0 (9c08fd1)` for a full 40-character id. If the brackets hold the whole long id, take only the first 7 characters. If the footer is empty, the component does not render anything inside `<footer>` yet."
      - when: { test: "without a version it shows dev" }
        message:
          uk: "Ця перевірка передає `version: undefined` і чекає рівно `Версія dev` — без commit-а й без слова `undefined`."
          en: "This check passes `version: undefined` and expects exactly `Version dev` — no commit and no word `undefined`."
      - when: { test: "an empty version also shows dev" }
        message:
          uk: "Ця перевірка передає `version: \"\"` і чекає `Версія dev`. Порівняння `version === undefined` порожнього рядка не помічає; перевір, чи версія взагалі є."
          en: "This check passes `version: \"\"` and expects `Version dev`. The comparison `version === undefined` does not notice an empty string; check whether there is a version at all."
      - when: { test: "without a commit it shows only the version" }
        message:
          uk: "Ця перевірка передає `version: \"1.4.0\"` і спершу `commit: undefined`, потім `commit: \"\"`, і обидва рази чекає `Версія 1.4.0` — без дужок. Якщо бачиш `(undefined)` чи `()`, дужки треба додавати лише тоді, коли commit є."
          en: "This check passes `version: \"1.4.0\"` with first `commit: undefined`, then `commit: \"\"`, and both times expects `Version 1.4.0` — without brackets. If you see `(undefined)` or `()`, the brackets must be added only when there is a commit."

  - id: updates-one-at-a-time
    kind: explanation
    title:
      uk: "Оновлення залежності — маленький випуск"
      en: "A dependency update is a small release"
    body:
      uk: |
        `npm outdated` показує, що застаріло. У `release-lab` ми отримали:

        ```text
        Package      Current   Wanted  Latest  Location                  Depended by
        @types/node  24.19.1  24.19.1  26.6.4  node_modules/@types/node  release-lab
        typescript     6.0.3    6.0.3   7.0.2  node_modules/typescript   release-lab
        ```

        `Wanted` — найновіша версія, яку дозволяє діапазон у `package.json` (`~6.0.2` для TypeScript), `Latest` — найновіша взагалі. 7.0.2 — нова MAJOR, а нова MAJOR за правилами semver може ламати.

        Спокуса — оновити все разом. Але якщо після цього щось зламається, ти не знатимеш, що саме. Тому [[dependency-update|оновлення залежності]] роблять як маленький випуск:

        1. Прочитай [[release-notes|нотатки випуску]] (changelog) — особливо для нової MAJOR.
        2. Окрема гілка, **одна** залежність.
        3. Усі ворота: lint, typecheck, тести, збирання.
        4. Порівняй, що змінилося: `git diff --stat` для `package-lock.json` і назви файлів у `dist`.
        5. Зелено — злий у `main`. Червоно — повернись на `main`, а `npm ci` поверне встановлені пакети до lockfile `main`.
      en: |
        `npm outdated` shows what is out of date. In `release-lab` we got:

        ```text
        Package      Current   Wanted  Latest  Location                  Depended by
        @types/node  24.19.1  24.19.1  26.6.4  node_modules/@types/node  release-lab
        typescript     6.0.3    6.0.3   7.0.2  node_modules/typescript   release-lab
        ```

        `Wanted` is the newest version the range in `package.json` allows (`~6.0.2` for TypeScript), `Latest` is the newest of all. 7.0.2 is a new MAJOR, and by the semver rules a new MAJOR may break things.

        The temptation is to update everything at once. But if something breaks afterwards, you will not know what. So a [[dependency-update]] is done as a small release:

        1. Read the [[release-notes]] (changelog) — especially for a new MAJOR.
        2. A separate branch, **one** dependency.
        3. All the gates: lint, typecheck, tests, build.
        4. Compare what changed: `git diff --stat` for `package-lock.json` and the file names in `dist`.
        5. Green — merge into `main`. Red — go back to `main`, and `npm ci` returns the installed packages to `main`'s lockfile.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: діапазони semver і lockfile"
      en: "Recall: semver ranges and the lockfile"
    items:
      - id: tilde-range
        from: js-15-04-install-lockfile-semver
        prompt:
          uk: "Які з версій 19.3.0, 19.3.4, 19.4.0 і 20.0.0 дозволяє діапазон `~19.3.0`? Познач усі."
          en: "Which of the versions 19.3.0, 19.3.4, 19.4.0 and 20.0.0 does the range `~19.3.0` allow? Pick all of them."
        answer:
          type: multi
          options:
            - { id: v1930, text: { uk: "19.3.0", en: "19.3.0" } }
            - { id: v1934, text: { uk: "19.3.4", en: "19.3.4" } }
            - id: v1940
              text: { uk: "19.4.0", en: "19.4.0" }
              why:
                uk: "Так дозволив би `^19.3.0`. `~` дозволяє лише нові PATCH: MINOR має лишатися 3."
                en: "That is what `^19.3.0` would allow. `~` allows only new PATCH versions: MINOR must stay 3."
            - id: v2000
              text: { uk: "20.0.0", en: "20.0.0" }
              why:
                uk: "Нову MAJOR не дозволяють ні `~`, ні `^`: вона може зламати твій код."
                en: "Neither `~` nor `^` allows a new MAJOR: it may break your code."
          correct: [v1930, v1934]
        explanation:
          uk: "`~19.3.0` означає «19.3.x, починаючи з 19.3.0». `^19.3.0` дозволив би ще й 19.4.0, але теж не 20.0.0."
          en: "`~19.3.0` means “19.3.x, starting at 19.3.0”. `^19.3.0` would also allow 19.4.0, but not 20.0.0 either."
      - id: ci-takes-lockfile
        from: js-15-04-install-lockfile-semver
        prompt:
          uk: "У `package.json` стоїть `\"react\": \"^19.2.8\"`, а в `package-lock.json` для `node_modules/react` записано `\"version\": \"19.2.8\"`. У реєстрі npm уже є 19.3.0. Яку версію React поставить `npm ci` на чистому комп’ютері?"
          en: "`package.json` has `\"react\": \"^19.2.8\"`, and `package-lock.json` records `\"version\": \"19.2.8\"` for `node_modules/react`. The npm registry already has 19.3.0. Which React version does `npm ci` install on a clean computer?"
        answer:
          type: choice
          options:
            - id: locked
              text: { uk: "19.2.8 — точно ту, що в lockfile", en: "19.2.8 — exactly the one in the lockfile" }
            - id: newest
              text: { uk: "19.3.0 — найновішу, яку дозволяє `^19.2.8`", en: "19.3.0 — the newest that `^19.2.8` allows" }
              why:
                uk: "Діапазон лише каже, що **можна**. `npm ci` ставить рівно те, що записано в lockfile, — для цього він і існує."
                en: "The range only says what is **allowed**. `npm ci` installs exactly what the lockfile records — that is what it exists for."
          correct: [locked]
        explanation:
          uk: "`npm ci` відтворює дерево пакетів з lockfile точно, тому CI й твій комп’ютер мають однакові версії. Нову версію ти береш свідомо — оновленням на гілці, яке змінює lockfile."
          en: "`npm ci` reproduces the package tree from the lockfile exactly, so CI and your computer have the same versions. You take a new version on purpose — with an update on a branch, which changes the lockfile."

  - id: stamp-and-update
    kind: local-task
    runtime: local-web
    title:
      uk: "Позначити випуск і оновити TypeScript на гілці"
      en: "Stamp a release and update TypeScript on a branch"
    intro:
      uk: |
        Працюєш у `~/js-course/release-lab` після завдання уроку «Перевірки lint/type/unit/user і CI-конвеєри» (у проєкті є тести й `ci.yml`). Потрібні інтернет і Git, налаштований у JS-15 (`git config --global user.name` друкує твоє ім’я). Commit-и й id у тебе будуть інші, ніж тут. Команди перевірено на macOS; на Linux вони ті самі.

        **Крок 2 — `src/build-info.d.ts`** (каже TypeScript, що ці назви з’являться під час збирання):

        ```ts
        // Written into the code by `define` in vite.config.ts during every build.
        declare const __APP_VERSION__: string;
        declare const __COMMIT__: string;
        ```

        **Крок 2 — `src/BuildInfo.tsx`:**

        ```tsx
        export default function BuildInfo() {
          return (
            <footer>
              <small>
                Version {__APP_VERSION__} ({__COMMIT__})
              </small>
            </footer>
          );
        }
        ```

        **Крок 2 — `vite.config.ts`** (замінює попередній):

        ```ts
        /// <reference types="vitest/config" />
        import { execSync } from 'node:child_process'
        import { readFileSync } from 'node:fs'
        import react from '@vitejs/plugin-react'
        import { defineConfig } from 'vite'

        const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
        const commit = execSync('git rev-parse --short HEAD').toString().trim()

        // https://vite.dev/config/
        export default defineConfig({
          plugins: [react()],
          define: {
            __APP_VERSION__: JSON.stringify(version),
            __COMMIT__: JSON.stringify(commit),
          },
          test: {
            environment: 'jsdom',
            // Node 25 has its own localStorage, which hides the one of the test page.
            execArgv: ['--no-experimental-webstorage'],
          },
        })
        ```

        **Крок 2 — `src/App.tsx`:** під рядком `import { addTask, toggleTask, type Task } from "./tasks.ts";` додай `import BuildInfo from "./BuildInfo.tsx";`, а перед закривальним `</main>` — `<BuildInfo />`.
      en: |
        You work in `~/js-course/release-lab` after the task of the lesson “Lint/type/unit/user checks and CI pipelines” (the project has tests and `ci.yml`). You need internet access and Git set up in JS-15 (`git config --global user.name` prints your name). Your commits and ids will differ from the ones here. The commands were checked on macOS; on Linux they are the same.

        **Step 2 — `src/build-info.d.ts`** (tells TypeScript that these names appear during the build):

        ```ts
        // Written into the code by `define` in vite.config.ts during every build.
        declare const __APP_VERSION__: string;
        declare const __COMMIT__: string;
        ```

        **Step 2 — `src/BuildInfo.tsx`:**

        ```tsx
        export default function BuildInfo() {
          return (
            <footer>
              <small>
                Version {__APP_VERSION__} ({__COMMIT__})
              </small>
            </footer>
          );
        }
        ```

        **Step 2 — `vite.config.ts`** (replaces the previous one):

        ```ts
        /// <reference types="vitest/config" />
        import { execSync } from 'node:child_process'
        import { readFileSync } from 'node:fs'
        import react from '@vitejs/plugin-react'
        import { defineConfig } from 'vite'

        const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
        const commit = execSync('git rev-parse --short HEAD').toString().trim()

        // https://vite.dev/config/
        export default defineConfig({
          plugins: [react()],
          define: {
            __APP_VERSION__: JSON.stringify(version),
            __COMMIT__: JSON.stringify(commit),
          },
          test: {
            environment: 'jsdom',
            // Node 25 has its own localStorage, which hides the one of the test page.
            execArgv: ['--no-experimental-webstorage'],
          },
        })
        ```

        **Step 2 — `src/App.tsx`:** under the line `import { addTask, toggleTask, type Task } from "./tasks.ts";` add `import BuildInfo from "./BuildInfo.tsx";`, and before the closing `</main>` add `<BuildInfo />`.
    tools:
      - name: "Git"
        version: "set up in JS-15 (checked with 2.51.0)"
      - name: "Node.js and npm"
        version: "22.4 or newer (checked with Node.js 25.2.1, npm 11.6.2)"
    steps:
      - text:
          uk: "Зроби з проєкту репозиторій, якщо він ще не репозиторій. Перша команда скаже `fatal: not a git repository…` — тоді виконай решту. Якщо вона показує гілку, репозиторій уже є: просто закоміть поточні зміни. `.env.local` у commit не потрапить — шаблон його ігнорує."
          en: "Make the project a repository if it is not one yet. The first command says `fatal: not a git repository…` — then run the rest. If it shows a branch, the repository already exists: just commit the current changes. `.env.local` does not get into the commit — the template ignores it."
        command: "cd ~/js-course/release-lab\ngit status\ngit init -b main\ngit add .\ngit commit -m \"Release lab with tests and CI\""
        expect:
          uk: "`Initialized empty Git repository in …/release-lab/.git/`, потім `[main (root-commit) 870072e] Release lab with tests and CI` і кількість файлів. Серед `create mode` є `.env`, але немає `.env.local`."
          en: "`Initialized empty Git repository in …/release-lab/.git/`, then `[main (root-commit) 870072e] Release lab with tests and CI` and the number of files. The `create mode` lines include `.env` but not `.env.local`."
      - text:
          uk: "Додай позначку випуску: створи `src/build-info.d.ts` і `src/BuildInfo.tsx`, заміни `vite.config.ts` і зміни `src/App.tsx` (усе — у вступі, позначки «Крок 2»). Пройди ворота й пошукай id commit-а в зібраному bundle."
          en: "Add the release stamp: create `src/build-info.d.ts` and `src/BuildInfo.tsx`, replace `vite.config.ts` and change `src/App.tsx` (all in the introduction, marked “Step 2”). Go through the gates and search the built bundle for the commit id."
        command: "npm run lint && npm run typecheck && npm test && npm run build\ngit rev-parse --short HEAD\ngrep -rl \"$(git rev-parse --short HEAD)\" dist"
        expect:
          uk: "Ворота зелені; `git rev-parse` друкує id, наприклад `870072e`, а пошук знаходить його в головному bundle `dist/assets/index-….js`. У PowerShell пошук — `Select-String -Path dist\\assets\\*.js -Pattern (git rev-parse --short HEAD) -List` (не перевірено)."
          en: "The gates are green; `git rev-parse` prints the id, for example `870072e`, and the search finds it in the main bundle `dist/assets/index-….js`. In PowerShell the search is `Select-String -Path dist\\assets\\*.js -Pattern (git rev-parse --short HEAD) -List` (not checked)."
      - text:
          uk: "Закоміть позначку й випусти версію 0.1.0. `npm version` вимагає чистого робочого дерева: він сам змінює `package.json` і `package-lock.json`, робить commit `0.1.0` і ставить тег `v0.1.0`. Потім збери ще раз."
          en: "Commit the stamp and release version 0.1.0. `npm version` needs a clean working tree: it changes `package.json` and `package-lock.json` itself, makes the commit `0.1.0` and puts the tag `v0.1.0`. Then build again."
        command: "git add .\ngit commit -m \"Show the version and commit in the footer\"\nnpm version 0.1.0\ngit log --oneline --decorate -3\nnpm run build"
        expect:
          uk: |
            ```text
            v0.1.0
            9010501 (HEAD -> main, tag: v0.1.0) 0.1.0
            b267763 Show the version and commit in the footer
            870072e Release lab with tests and CI
            ```

            Запусти `npm run dev` і відкрий сторінку: внизу «Version 0.1.0 (9010501)» з твоїм id. Зупини сервер (Ctrl + C). Запиши назви файлів, які надрукувало збирання, — вони знадобляться на кроці 5.
          en: |
            ```text
            v0.1.0
            9010501 (HEAD -> main, tag: v0.1.0) 0.1.0
            b267763 Show the version and commit in the footer
            870072e Release lab with tests and CI
            ```

            Run `npm run dev` and open the page: at the bottom it says “Version 0.1.0 (9010501)” with your id. Stop the server (Ctrl + C). Write down the file names the build printed — you need them in step 5.
      - text:
          uk: "Подивись, що застаріло, і почни оновлення TypeScript на окремій гілці. 7 — нова MAJOR: перш ніж іти далі, відкрий нотатки випуску TypeScript 7 (`npm view typescript homepage` друкує адресу сайту проєкту) і пошукай розділ про зміни, що ламають сумісність (breaking changes)."
          en: "See what is out of date and start the TypeScript update on a separate branch. 7 is a new MAJOR: before going on, open the TypeScript 7 release notes (`npm view typescript homepage` prints the project's site address) and look for the section on breaking changes."
        command: "npm outdated\ngit switch -c update-typescript\nnpm install --save-dev typescript@7\ngit diff --stat"
        expect:
          uk: |
            ```text
            Package      Current   Wanted  Latest  …
            @types/node  24.19.1  24.19.1  26.6.4  …
            typescript     6.0.3    6.0.3   7.0.2  …
            Switched to a new branch 'update-typescript'
            added 1 package, changed 1 package, and audited 113 packages in 554ms
            …
             package-lock.json | 375 +++++++++++++++++++++++++++++++++++++++++++++++++++++-
             package.json      |   2 +-
             2 files changed, 369 insertions(+), 8 deletions(-)
            ```

            У `package.json` діапазон став `"typescript": "^7.0.2"`. Майже всі нові рядки lockfile — записи `node_modules/@typescript/typescript-darwin-arm64`, `…-linux-x64` тощо: TypeScript 7 приходить як готова програма для кожної системи. Якщо в тебе вийшли новіші версії, числа будуть іншими.
          en: |
            ```text
            Package      Current   Wanted  Latest  …
            @types/node  24.19.1  24.19.1  26.6.4  …
            typescript     6.0.3    6.0.3   7.0.2  …
            Switched to a new branch 'update-typescript'
            added 1 package, changed 1 package, and audited 113 packages in 554ms
            …
             package-lock.json | 375 +++++++++++++++++++++++++++++++++++++++++++++++++++++-
             package.json      |   2 +-
             2 files changed, 369 insertions(+), 8 deletions(-)
            ```

            The range in `package.json` became `"typescript": "^7.0.2"`. Almost all new lockfile lines are entries like `node_modules/@typescript/typescript-darwin-arm64`, `…-linux-x64` and so on: TypeScript 7 comes as a ready-made program for each system. If newer versions have come out for you, the numbers will differ.
      - text:
          uk: "Пройди всі ворота **до** commit-а: `HEAD` ще той самий, що й у випуску 0.1.0, тож футер не змінився, і будь-яка різниця в назвах файлів `dist` — від оновлення. Порівняй назви з записаними на кроці 3."
          en: "Go through all the gates **before** committing: `HEAD` is still the same as in release 0.1.0, so the footer did not change, and any difference in the `dist` file names comes from the update. Compare the names with the ones you wrote down in step 3."
        command: "npx tsc --version\nnpm run lint && npm run typecheck && npm test && npm run build"
        expect:
          uk: "`Version 7.0.2`, усі ворота зелені, а назви файлів **ті самі**, що й на кроці 3: TypeScript лише перевіряє типи, а JavaScript для bundle пише Vite. Оновлення змінило перевірку, але не артефакт."
          en: "`Version 7.0.2`, all the gates are green, and the file names are **the same** as in step 3: TypeScript only checks types, while Vite writes the JavaScript for the bundle. The update changed the check, not the artifact."
      - text:
          uk: "Закоміть оновлення на гілці й вирішуй. Якщо все зелене й нотатки випуску не насторожили — виконай увесь блок команд: він зливає гілку в `main`. Якщо щось червоне — виконай той самий блок **без** рядка `git merge update-typescript`: ти повернешся на `main` з його пакетами. В обох випадках `npm ci` приводить `node_modules` у відповідність до lockfile гілки, на якій ти стоїш."
          en: "Commit the update on the branch and decide. If everything is green and the release notes raised no concerns — run the whole block: it merges the branch into `main`. If something is red — run the same block **without** the line `git merge update-typescript`: you return to `main` with its packages. In both cases `npm ci` brings `node_modules` in line with the lockfile of the branch you are on."
        command: "git commit -am \"Update TypeScript to 7\"\ngit switch main\ngit merge update-typescript\nnpm ci\nnpx tsc --version"
        expect:
          uk: "Злиття: `Updating 9010501..bd1525f`, `Fast-forward`, потім `added 112 packages, …` і `Version 7.0.2`. Відкат (`git switch main` і `npm ci` без `git merge`): `added 111 packages, …` і `Version 6.0.3` — гілка `update-typescript` лишається, і до неї можна повернутися пізніше."
          en: "Merge: `Updating 9010501..bd1525f`, `Fast-forward`, then `added 112 packages, …` and `Version 7.0.2`. Revert (`git switch main` and `npm ci` without `git merge`): `added 111 packages, …` and `Version 6.0.3` — the `update-typescript` branch stays, and you can come back to it later."
    verify:
      - id: footer-stamped
        text:
          uk: "Сторінка показує «Version 0.1.0 (…)» з id, який друкує `git log` для тегу `v0.1.0`."
          en: "The page shows “Version 0.1.0 (…)” with the id that `git log` prints for the tag `v0.1.0`."
      - id: update-compared
        text:
          uk: "На гілці `update-typescript` усі ворота пройшли, я подивився `git diff --stat` lockfile і порівняв назви файлів `dist` із записаними раніше."
          en: "On the `update-typescript` branch all the gates passed, I looked at `git diff --stat` of the lockfile and compared the `dist` file names with the ones written down before."
      - id: decided
        text:
          uk: "Я злив оновлення або відкотився, і `npx tsc --version` показує версію, що відповідає lockfile гілки `main`."
          en: "I merged the update or reverted, and `npx tsc --version` shows the version that matches the lockfile of the `main` branch."
    troubleshooting:
      - problem:
          uk: "`npm error Git working directory not clean.`"
          en: "`npm error Git working directory not clean.`"
        fix:
          uk: "`npm version` відмовляється, коли є незакомічені зміни, бо сам робить commit. `git status` покаже, що змінено: закоміть це (або поверни) й запусти `npm version 0.1.0` знову."
          en: "`npm version` refuses when there are uncommitted changes, because it makes a commit itself. `git status` shows what changed: commit it (or undo it) and run `npm version 0.1.0` again."
      - problem:
          uk: "`fatal: not a git repository` під час `npm run build` або `npm test`"
          en: "`fatal: not a git repository` during `npm run build` or `npm test`"
        fix:
          uk: "`vite.config.ts` викликає `git rev-parse`, а проєкт ще не репозиторій. Виконай крок 1."
          en: "`vite.config.ts` calls `git rev-parse`, and the project is not a repository yet. Do step 1."
      - problem:
          uk: "`error TS2304: Cannot find name '__APP_VERSION__'.`"
          en: "`error TS2304: Cannot find name '__APP_VERSION__'.`"
        fix:
          uk: "TypeScript не знає назв, які вписує збирання. Перевір, що `src/build-info.d.ts` існує, лежить саме в `src` і назви в ньому збігаються з `vite.config.ts`."
          en: "TypeScript does not know the names the build writes in. Check that `src/build-info.d.ts` exists, lies exactly in `src`, and that its names match `vite.config.ts`."
      - problem:
          uk: "`Author identity unknown` під час commit-а"
          en: "`Author identity unknown` during a commit"
        fix:
          uk: "Git не знає твого імені. Налаштуй його, як у JS-15: `git config --global user.name \"Твоє ім’я\"` і `git config --global user.email \"ти@example.com\"`, потім повтори commit."
          en: "Git does not know your name. Set it as in JS-15: `git config --global user.name \"Your Name\"` and `git config --global user.email \"you@example.com\"`, then repeat the commit."
    recovery:
      uk: "Кожен крок закінчується commit-ом, тож повернутися легко: `git log --oneline` покаже історію, `git switch main` і `npm ci` — стан `main`. Тег `v0.1.0` завжди вказує на випуск 0.1.0."
      en: "Every step ends with a commit, so going back is easy: `git log --oneline` shows the history, `git switch main` and `npm ci` give you the state of `main`. The tag `v0.1.0` always points at release 0.1.0."

  - id: to-project
    kind: transfer
    capstoneStep: RE-12
    body:
      uk: "У кроці проєкту наприкінці розділу ти поставиш своєму застосунку версію 1.0.0 тією самою командою `npm version` і переконаєшся, що зібрана сторінка показує цю версію й commit, з якого її зібрано."
      en: "In the project step at the end of the unit you give your app version 1.0.0 with the same `npm version` command and make sure the built page shows that version and the commit it was built from."
