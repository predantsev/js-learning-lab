id: re-12-07-cumulative-review
unit: RE-12
title:
  uk: "Підсумкове повторення React"
  en: "Cumulative React review"
kind: review
minutes: 20
contentVersion: 1
purpose:
  uk: "Перед підсумковим іспитом React ти без нотаток пригадуєш головні механізми всього розділу — від ключів у списку до коду, що лишається на сервері, — і передбачаєш, що надрукують три короткі програми. Кожне питання називає урок, до якого варто повернутися, якщо відповідь не далася."
  en: "Before the final React gate you recall without notes the main mechanisms of the whole stage — from keys in a list to code that stays on the server — and predict what three short programs print. Every question names the lesson to return to if the answer did not come."
objectives:
  - uk: "Без нотаток пригадати головні механізми RE-01–RE-11 і передбачити поведінку змішаних фрагментів про state, ефекти, дані, швидкодію, конкурентний рендер і межу сервера."
    en: "Retrieve without notes the core React mechanisms of RE-01 to RE-11 and predict behavior in mixed snippets covering state, effects, data, performance, concurrency and the server boundary."
prerequisites: [re-12-06-artifact-verification, re-08-01-checkpoint-review]
subskills: []
glossary: []
selfCheck: [predict-effect-order, predict-transition-renders, predict-optimistic-rollback]

blocks:
  - id: how-to-review
    kind: explanation
    title:
      uk: "Як проходити це повторення"
      en: "How to go through this review"
    body:
      uk: |
        Тут немає нового матеріалу. Є питання з усіх уроків розділу, перемішані так, як вони перемішані в справжньому коді: ефект поруч із запитом, transition поруч зі state.

        - Відповідай **до** того, як дивишся пояснення, і без нотаток. Саме спроба пригадати закріплює знання, навіть невдала.
        - Під кожним питанням указано урок, з якого воно. Помилився — повернися до цього уроку, а не до пошуковика.
        - Три передбачення про програми ми запускали в пісочниці платформи з React 19.3.0: їхній вивід — справжній.

        Наступні два уроки — іспит. Що не далося тут, там знадобиться без підказок.
      en: |
        There is no new material here. There are questions from all the lessons of the stage, mixed the way they are mixed in real code: an effect next to a request, a transition next to state.

        - Answer **before** you look at the explanation, and without notes. The very attempt to recall is what makes the knowledge stick, even a failed one.
        - Every question names the lesson it comes from. If you got it wrong, go back to that lesson, not to a search engine.
        - We ran the three predictions about programs in the platform's sandbox with React 19.3.0: their output is real.

        The next two lessons are the gate. What did not come here will be needed there without hints.

  - id: recall-components-state
    kind: review
    title:
      uk: "Компоненти, state, ефекти, маршрути"
      en: "Components, state, effects, routes"
    items:
      - id: index-key-reorder
        from: re-01-05-keys-identity
        prompt:
          uk: "Список бажань має в кожному рядку поле для нотатки й `key={index}`. Ти вводиш «подарунок» у поле **першого** рядка «Навушники», а потім сортуєш список за ціною — «Навушники» стають останніми. Де тепер «подарунок»?"
          en: "A wish list has a note field in every row and `key={index}`. You type “gift” into the field of the **first** row, “Headphones”, and then sort the list by price — “Headphones” becomes last. Where is “gift” now?"
        answer:
          type: choice
          options:
            - id: first-row
              text: { uk: "У першому рядку — біля іншого бажання", en: "In the first row — next to another wish" }
            - id: follows
              text: { uk: "Біля «Навушників», в останньому рядку", en: "Next to “Headphones”, in the last row" }
              why:
                uk: "Так було б із `key={wish.id}`. Індекс — позиція, а не запис: рядок із ключем `0` лишився першим разом зі своїм полем, змінився лише текст назви."
                en: "That would happen with `key={wish.id}`. An index is a position, not a record: the row with key `0` stayed first together with its field, only the name text changed."
            - id: gone
              text: { uk: "Ніде: React створив усі рядки наново", en: "Nowhere: React created all the rows anew" }
              why:
                uk: "Наново все створив би лише ключ, що змінюється в кожному рендері, як `Math.random()`. Ключі `0`, `1`, `2` ті самі, тож React зберіг вузли."
                en: "Only a key that changes on every render, like `Math.random()`, would recreate everything. The keys `0`, `1`, `2` are the same, so React kept the nodes."
          correct: [first-row]
        explanation:
          uk: "React вважає рядок з тим самим ключем тим самим рядком. Ключ-індекс прив’язує DOM і введений текст до позиції. Стабільний ключ — `id` запису."
          en: "React treats a row with the same key as the same row. An index key ties the DOM and typed text to the position. A stable key is the record's `id`."
      - id: snapshot-after-set
        from: re-02-02-state-snapshots
        prompt:
          uk: "`left` дорівнює `3`. Обробник кліку: `setLeft(left - 1); console.log(left);`. Що надрукує `console.log`?"
          en: "`left` is `3`. The click handler: `setLeft(left - 1); console.log(left);`. What does `console.log` print?"
        answer:
          type: choice
          options:
            - id: three
              text: { uk: "`3`", en: "`3`" }
            - id: two
              text: { uk: "`2`", en: "`2`" }
              why:
                uk: "`setLeft` не переписує `left` в обробнику, що вже виконується: це `const` цього рендеру. Нове значення з’явиться в наступному рендері."
                en: "`setLeft` does not rewrite `left` in a handler that is already running: it is this render's `const`. The new value appears in the next render."
          correct: [three]
        explanation:
          uk: "State — знімок рендеру. Обробник бачить значення того рендеру, у якому народився; сетер лише просить React про наступний рендер."
          en: "State is a snapshot of a render. A handler sees the values of the render it was born in; a setter only asks React for the next render."
      - id: empty-array-stays
        from: re-03-03-dependencies-cleanup
        prompt:
          uk: "Ефект `useEffect(() => feed.subscribe(selectedId, setMessage), [])` читає `selectedId`. Людина обирає запис `w-02` замість `w-01`. На стрічку якого запису підписаний компонент?"
          en: "The effect `useEffect(() => feed.subscribe(selectedId, setMessage), [])` reads `selectedId`. A person picks the record `w-02` instead of `w-01`. To which record's feed is the component subscribed?"
        answer:
          type: choice
          options:
            - id: first
              text: { uk: "Досі на `w-01`", en: "Still `w-01`" }
            - id: second
              text: { uk: "На `w-02`", en: "`w-02`" }
              why:
                uk: "З порожнім масивом ефект виконався лише після першого commit-а й лишився з `selectedId` першого рендеру. Масив — список того, що ефект читає, а не налаштування «як часто»."
                en: "With an empty array the effect ran only after the first commit and stayed with the first render's `selectedId`. The array is the list of what the effect reads, not a “how often” setting."
            - id: both
              text: { uk: "На обидва", en: "Both" }
              why:
                uk: "Щоб підписатися вдруге, ефект мав би виконатися ще раз — а з `[]` він більше не виконується."
                en: "To subscribe a second time the effect would have to run again — and with `[]` it does not run any more."
          correct: [first]
        explanation:
          uk: "Усе реактивне, що ефект читає, іде в масив залежностей: `[selectedId]`. Тоді React викличе cleanup старої підписки й підпише компонент на новий запис."
          en: "Everything reactive the effect reads goes into the dependency array: `[selectedId]`. Then React calls the old subscription's cleanup and subscribes the component to the new record."
      - id: reducer-push
        from: re-04-03-reducers-typed
        prompt:
          uk: "Гілка редюсера: `case \"added\": tasks.push(action.task); return tasks;`. Що бачить людина після `dispatch({ type: \"added\", task })`?"
          en: "A reducer branch: `case \"added\": tasks.push(action.task); return tasks;`. What does a person see after `dispatch({ type: \"added\", task })`?"
        answer:
          type: choice
          options:
            - id: no-update
              text: { uk: "Екран не оновлюється: React бачить той самий масив", en: "The screen does not update: React sees the same array" }
            - id: new-task
              text: { uk: "Нову справу в списку", en: "The new task in the list" }
              why:
                uk: "React порівнює новий state зі старим через `Object.is`. `push` змінив старий масив і повернув його ж — для React нічого не змінилося."
                en: "React compares the new state with the old one with `Object.is`. `push` changed the old array and returned that same array — for React nothing changed."
          correct: [no-update]
        explanation:
          uk: "Редюсер — чиста функція: кожна гілка повертає новий масив чи об’єкт (`[...tasks, action.task]`). Під `<StrictMode>` React ще й викликає редюсер двічі, і `push` додав би запис двічі."
          en: "A reducer is a pure function: every branch returns a new array or object (`[...tasks, action.task]`). Under `<StrictMode>` React also calls the reducer twice, and `push` would add the record twice."
      - id: param-is-text
        from: re-05-02-params-nested-routes
        prompt:
          uk: "Маршрут `/items/:id`. На адресі `/items/w-02` компонент викликає `const { id } = useParams();`. Що таке `id`?"
          en: "The route is `/items/:id`. At the address `/items/w-02` the component calls `const { id } = useParams();`. What is `id`?"
        answer:
          type: choice
          options:
            - id: text
              text: { uk: "Текст `\"w-02\"`; запис ще треба знайти в `items` і подумати про випадок, коли його немає", en: "The text `\"w-02\"`; the record still has to be found in `items`, and the case where it is missing has to be handled" }
            - id: record
              text: { uk: "Сам запис бажання з `id` `w-02`", en: "The wish record itself with the `id` `w-02`" }
              why:
                uk: "Маршрутизатор знає лише адресу, а не твої дані. Параметр — це шматок адреси, тобто текст."
                en: "The router knows only the address, not your data. A parameter is a piece of the address, that is, text."
          correct: [text]
        explanation:
          uk: "Параметр маршруту — текст з адреси. Запис шукають за полем `id`, а стару чи вигадану адресу (`/items/w-99`) показують як «не знайдено», а не як порожній екран."
          en: "A route parameter is text from the address. The record is found by its `id` field, and an old or made-up address (`/items/w-99`) is shown as “not found”, not as an empty screen."

  - id: predict-effect-order
    kind: prediction
    lang: jsx
    runnable: false
    prompt:
      uk: "Сторінка щойно з’явилася й надрукувала `render walk` і `start walk`. Людина натискає «count», а потім «read». Які рядки з’являються в консолі після цих двох кліків (StrictMode вимкнено)?"
      en: "The page has just appeared and printed `render walk` and `start walk`. A person presses “count”, then “read”. Which lines appear in the console after these two clicks (StrictMode is off)?"
    code: |
      function Reminder({ habit }) {
        console.log(`render ${habit}`);
        useEffect(() => {
          console.log(`start ${habit}`);
          return () => console.log(`stop ${habit}`);
        }, [habit]);
        return <p>{habit}</p>;
      }

      function App() {
        const [habit, setHabit] = useState("walk");
        const [count, setCount] = useState(0);
        return (
          <>
            <Reminder habit={habit} />
            <button onClick={() => setCount(count + 1)}>count {count}</button>
            <button onClick={() => setHabit("read")}>read</button>
          </>
        );
      }
    answer:
      type: choice
      options:
        - id: right
          code: "render walk\nrender read\nstop walk\nstart read"
        - id: effect-every-render
          code: "render walk\nstop walk\nstart walk\nrender read\nstop walk\nstart read"
          why:
            uk: "Ефект із `[habit]` пропускається, коли `habit` не змінився. Клік «count» змінює лише `count`: `Reminder` рендериться, але ефект не перезапускається."
            en: "An effect with `[habit]` is skipped when `habit` did not change. The “count” click changes only `count`: `Reminder` renders, but the effect does not run again."
        - id: cleanup-first
          code: "render walk\nstop walk\nrender read\nstart read"
          why:
            uk: "Cleanup старого ефекту React викликає після нового рендеру, перед запуском нового ефекту — не до рендеру."
            en: "React calls the old effect's cleanup after the new render, right before running the new effect — not before the render."
        - id: no-render
          code: "stop walk\nstart read"
          why:
            uk: "Будь-яка зміна state батька рендерить і дочірній `Reminder` — а він друкує `render …` на кожному рендері."
            en: "Any state change of the parent renders the child `Reminder` too — and it prints `render …` on every render."
      correct: [right]
    explanation:
      uk: "Ми запустили цей код у пісочниці й натиснули обидві кнопки: `render walk` (клік «count»: рендер, ефект пропущено), потім `render read`, `stop walk`, `start read` — рендер, cleanup старого ефекту, новий ефект (RE-03)."
      en: "We ran this code in the sandbox and pressed both buttons: `render walk` (the “count” click: a render, the effect skipped), then `render read`, `stop walk`, `start read` — a render, the old effect's cleanup, the new effect (RE-03)."

  - id: recall-data-boundaries
    kind: review
    title:
      uk: "Дані, швидкодія, конкурентний рендер, межа сервера"
      en: "Data, performance, concurrency, the server boundary"
    items:
      - id: race-no-cleanup
        from: re-06-02-races-cancellation
        prompt:
          uk: "Ефект із `[filter]` завантажує справи, cleanup-у немає. Сервер відповідає на «Усі» за 1200 мс, на «У роботі» — за 200 мс. Людина клікає «Усі», а одразу потім «У роботі». Що на екрані через 1,5 с?"
          en: "An effect with `[filter]` loads tasks and has no cleanup. The server answers “All” in 1200 ms and “Pending” in 200 ms. A person clicks “All” and right after it “Pending”. What is on the screen after 1.5 s?"
        answer:
          type: choice
          options:
            - id: all
              text: { uk: "Список «Усі», хоча вибрано «У роботі»", en: "The “All” list, although “Pending” is selected" }
            - id: pending
              text: { uk: "Список «У роботі»", en: "The “Pending” list" }
              why:
                uk: "Кожна відповідь викликає `setTasks` у своєму `.then`, і React застосовує **останній** виклик. Останньою прийшла відповідь «Усі»."
                en: "Each answer calls `setTasks` in its own `.then`, and React applies the **last** call. The “All” answer arrived last."
          correct: [all]
        explanation:
          uk: "На екрані відповідь, що **прийшла** останньою, а не відповідь на останнє питання. Cleanup із прапорцем `ignore` або `AbortController` прибирає застарілу відповідь."
          en: "The screen has the answer that **arrived** last, not the answer to the last question. A cleanup with an `ignore` flag or an `AbortController` removes the stale answer."
      - id: rollback-updater
        from: re-06-06-optimistic-rollback
        prompt:
          uk: "Оптимістична зміна чекає відповіді сервера через `await`. Чому відкат пишуть як `setTasks((current) => …)`, що змінює лише свій запис, а не `setTasks(tasks)`?"
          en: "An optimistic change waits for the server's answer with `await`. Why is the rollback written as `setTasks((current) => …)` that changes only its own record, rather than `setTasks(tasks)`?"
        answer:
          type: choice
          options:
            - id: latest
              text: { uk: "Після `await` змінна `tasks` — знімок рендеру, де стався клік; updater отримує найсвіжіший state і не стирає інших змін", en: "After `await` the variable `tasks` is the snapshot of the render where the click happened; an updater receives the latest state and does not wipe out other changes" }
            - id: faster
              text: { uk: "Updater швидший: React не рендерить компонент ще раз", en: "An updater is faster: React does not render the component again" }
              why:
                uk: "Updater рендерить так само. Різниця в тому, **яке** значення він отримує: найсвіжіше в черзі, а не старий знімок."
                en: "An updater renders just the same. The difference is **which** value it receives: the latest in the queue, not an old snapshot."
          correct: [latest]
        explanation:
          uk: "Поки відповідь ішла, людина могла клікати далі. Відкат зі старого знімка стер би ці зміни; updater, що змінює лише свій запис, — ні."
          en: "While the answer was on its way, the person may have kept clicking. A rollback from the old snapshot would wipe out those changes; an updater that changes only its own record would not."
      - id: memo-new-array
        from: re-07-04-memoization-when-measured
        prompt:
          uk: "`const active = habits.filter((habit) => !habit.paused);` виконується в кожному рендері, а далі — `const streaks = useMemo(() => computeStreaks(active), [active]);`. Як часто виконується `computeStreaks`?"
          en: "`const active = habits.filter((habit) => !habit.paused);` runs on every render, followed by `const streaks = useMemo(() => computeStreaks(active), [active]);`. How often does `computeStreaks` run?"
        answer:
          type: choice
          options:
            - id: every
              text: { uk: "На кожному рендері", en: "On every render" }
            - id: when-habits-change
              text: { uk: "Лише коли змінюється `habits`", en: "Only when `habits` changes" }
              why:
                uk: "Залежність — `active`, а `filter` щоразу створює **новий** масив. Для `Object.is` новий масив завжди «інший»."
                en: "The dependency is `active`, and `filter` creates a **new** array every time. For `Object.is` a new array is always “different”."
          correct: [every]
        explanation:
          uk: "`useMemo` порівнює залежності через `Object.is`, тож масив, створений у кожному рендері, «змінюється» завжди. Тому спершу вимірюють, а мемоізацію перевіряють тим самим вимірюванням (RE-07)."
          en: "`useMemo` compares dependencies with `Object.is`, so an array created on every render always “changes”. That is why you measure first and check the memoization with the same measurement (RE-07)."
      - id: what-goes-in-transition
        from: re-10-02-transitions
        prompt:
          uk: "Поле пошуку й важкий список із 5000 справ. Що з цього огортають у `startTransition`?"
          en: "A search field and a heavy list of 5,000 tasks. Which of these is wrapped in `startTransition`?"
        answer:
          type: choice
          options:
            - id: list
              text: { uk: "Оновлення відфільтрованого списку (запит для нього)", en: "The update of the filtered list (the query it uses)" }
            - id: field
              text: { uk: "Оновлення тексту в полі", en: "The update of the text in the field" }
              why:
                uk: "Текст поля — термінове оновлення: людина чекає літеру одразу. У transition поле «відставало б» від клавіш."
                en: "The field's text is an urgent update: the person expects the letter at once. In a transition the field would “lag” behind the keys."
            - id: both
              text: { uk: "Обидва, щоб нічого не гальмувало", en: "Both, so that nothing lags" }
              why:
                uk: "Transition не робить рендер швидшим — лише таким, який можна перервати. Поле має лишатися терміновим."
                en: "A transition does not make a render faster — only interruptible. The field must stay urgent."
          correct: [list]
        explanation:
          uk: "Термінове — текст у полі, нетермінове — важкий список. `startTransition` дозволяє React перервати рендер списку, коли приходить нова клавіша, і показати літеру першою."
          en: "Urgent is the text in the field, non-urgent is the heavy list. `startTransition` lets React interrupt the list's render when a new key arrives and show the letter first."
      - id: one-thread
        from: re-10-03-concurrent-model
        prompt:
          uk: "Під час transition-рендеру людина натискає клавішу. Як React устигає обробити її, не чекаючи кінця рендеру?"
          en: "During a transition render a person presses a key. How does React manage to handle it without waiting for the render to finish?"
        answer:
          type: choice
          options:
            - id: pieces
              text: { uk: "Рендерить шматками на тому самому потоці й між шматками віддає потік браузеру", en: "It renders in pieces on the same thread and hands the thread back to the browser between them" }
            - id: worker
              text: { uk: "Рендерить transition в окремому потоці, паралельно з обробником клавіші", en: "It renders the transition on a separate thread, in parallel with the key handler" }
              why:
                uk: "Головний потік браузера виконує одне завдання за раз, і React цього правила не порушує. Переривність — це паузи між шматками, а не паралельність."
                en: "The browser's main thread runs one task at a time, and React does not break that rule. Interruptibility means pauses between pieces, not parallelism."
          correct: [pieces]
        explanation:
          uk: "Конкурентний рендер — рендер, який можна перервати, на одному потоці. Між шматками браузер обробляє клавішу, а React може відкинути напівготовий рендер і почати з новим state."
          en: "Concurrent rendering is an interruptible render on one thread. Between pieces the browser handles the key, and React can throw away the half-made render and start over with the new state."
      - id: as-cast-unchecked
        from: re-09-07-debug-race-rollback-typed
        prompt:
          uk: "`api.ts` повертає `(await response.json()) as ApiExpense[]`, і `tsc` не має скарг. Сервер присилає запис із полем `spent_on` замість очікуваного. Що перевірив `as`?"
          en: "`api.ts` returns `(await response.json()) as ApiExpense[]`, and `tsc` has no complaints. The server sends a record with the field `spent_on` instead of the expected one. What did `as` check?"
        answer:
          type: choice
          options:
            - id: nothing
              text: { uk: "Нічого: це лише обіцянка для `tsc`, під час виконання перевірки немає", en: "Nothing: it is only a promise to `tsc`; there is no check at run time" }
            - id: fields
              text: { uk: "Поля: невідомий запис спричинить помилку на межі", en: "The fields: an unknown record causes an error at the boundary" }
              why:
                uk: "Типи зникають до запуску. Перевіряє лише код, що виконується, — схема, яку викликають на межі (`parseExpenseList(...)`)."
                en: "Types disappear before the run. Only code that runs checks anything — the schema called at the boundary (`parseExpenseList(...)`)."
          correct: [nothing]
        explanation:
          uk: "`as` мовчки погоджується з будь-якою відповіддю. Неперевірена відповідь доходить до екрана й ламається далеко від причини; схема на межі перетворює її на `ok: false`, яке екран уміє показати."
          en: "`as` silently agrees with any answer. An unchecked response reaches the screen and breaks far from its cause; a schema at the boundary turns it into `ok: false`, which the screen knows how to show."
      - id: hydration-local-storage
        from: re-11-02-hydration-mismatch
        prompt:
          uk: "Застосунок рендерять на сервері, а потім гідратують у браузері. Компонент читає `localStorage` прямо під час рендеру й показує збережену назву. Що станеться?"
          en: "An app is rendered on the server and then hydrated in the browser. A component reads `localStorage` right during render and shows the saved name. What happens?"
        answer:
          type: choice
          options:
            - id: mismatch
              text: { uk: "Розбіжність гідратації: на сервері `localStorage` немає, тож HTML сервера й перший рендер клієнта різні", en: "A hydration mismatch: the server has no `localStorage`, so the server HTML and the client's first render differ" }
            - id: fine
              text: { uk: "Усе гаразд: компонент же працює в браузері", en: "All fine: the component runs in a browser after all" }
              why:
                uk: "Під час SSR той самий компонент спершу виконується на сервері, де `localStorage` немає. Гідратація чекає, що клієнт відрендерить те саме, що прислав сервер."
                en: "During SSR the same component first runs on the server, where there is no `localStorage`. Hydration expects the client to render the same thing the server sent."
          correct: [mismatch]
        explanation:
          uk: "Значення, які є лише в браузері, читають в ефекті після монтування: перший рендер показує стабільну заглушку — однакову на сервері й у клієнті, — а збережене значення приходить другим проходом."
          en: "Values that exist only in the browser are read in an effect after mounting: the first render shows a stable placeholder — the same on the server and the client — and the saved value comes in a second pass."
      - id: secret-through-import
        from: re-11-04-secrets-server-only
        prompt:
          uk: "Клієнтський компонент викликає функцію `loadTotals` з `utils.js`, а вона звертається до бази через модуль `db.js`, де лежить ключ доступу. Сам компонент ключа ніде не згадує. Чи потрапить ключ у браузер?"
          en: "A client component calls the function `loadTotals` from `utils.js`, and that function reaches the database through the module `db.js`, which holds an access key. The component itself never mentions the key. Does the key reach the browser?"
        answer:
          type: choice
          options:
            - id: yes
              text: { uk: "Так: збирач іде за ланцюжком `import`, а функції, яку викликає клієнт, потрібен `db.js` разом із ключем", en: "Yes: the bundler follows the `import` chain, and the function the client calls needs `db.js` together with the key" }
            - id: no
              text: { uk: "Ні: компонент ключа не читає", en: "No: the component does not read the key" }
              why:
                uk: "Збирач не знає, що ти «не читаєш», — він іде за `import` і бере все, що потрібне коду, який виконується в браузері: `loadTotals` без ключа не працює. Текст ключа опиниться у файлі, який отримує кожен."
                en: "The bundler does not know what you “do not read” — it follows the `import`s and takes everything the code running in the browser needs: `loadTotals` does not work without the key. The key's text ends up in a file everyone receives."
          correct: [yes]
        explanation:
          uk: "Секрет тримають за явною межею коду лише для сервера, і клієнтський ланцюжок `import` до неї не доходить. Те саме правило, що й з `VITE_…` у цьому розділі: усе, що потрапило в bundle, — публічне."
          en: "A secret is kept behind an explicit server-only boundary, and no client `import` chain reaches it. The same rule as with `VITE_…` in this unit: anything that reaches the bundle is public."

  - id: predict-transition-renders
    kind: prediction
    lang: jsx
    runnable: false
    prompt:
      uk: "Сторінка щойно з’явилася й надрукувала `render tab=list pending=false`. Людина натискає кнопку. Які рядки з’являються в консолі?"
      en: "The page has just appeared and printed `render tab=list pending=false`. A person presses the button. Which lines appear in the console?"
    code: |
      function App() {
        const [tab, setTab] = useState("list");
        const [isPending, startTransition] = useTransition();
        console.log(`render tab=${tab} pending=${isPending}`);
        return (
          <button onClick={() => startTransition(() => setTab("stats"))}>
            {tab}
          </button>
        );
      }
    answer:
      type: choice
      options:
        - id: right
          code: "render tab=list pending=true\nrender tab=stats pending=false"
        - id: one-render
          code: "render tab=stats pending=false"
          why:
            uk: "Перш ніж рендерити transition, React робить термінове оновлення: старий `tab` і `isPending` — `true`. Так `isPending` і встигає показатися."
            en: "Before rendering the transition, React makes an urgent update: the old `tab` and `isPending` `true`. That is how `isPending` gets a chance to show."
        - id: pending-with-new
          code: "render tab=stats pending=true\nrender tab=stats pending=false"
          why:
            uk: "Поки transition не закінчився, на екрані лишається **старий** результат. Рендер із `pending=true` бачить старий `tab`."
            en: "Until the transition finishes, the **old** result stays on the screen. The render with `pending=true` sees the old `tab`."
      correct: [right]
    explanation:
      uk: "Ми запустили це в пісочниці з React 19.3.0: спершу `render tab=list pending=true` — терміновий рендер зі старим state і ознакою очікування, потім `render tab=stats pending=false` — сам transition (RE-10)."
      en: "We ran this in the sandbox with React 19.3.0: first `render tab=list pending=true` — an urgent render with the old state and the pending flag, then `render tab=stats pending=false` — the transition itself (RE-10)."

  - id: predict-optimistic-rollback
    kind: prediction
    lang: jsx
    runnable: false
    prompt:
      uk: "Сервер відхиляє будь-яку зміну через 100 мс. Сторінка щойно надрукувала `render wanted=true`. Людина натискає кнопку **один** раз. Які рядки з’являються в консолі протягом пів секунди?"
      en: "The server rejects every change after 100 ms. The page has just printed `render wanted=true`. A person presses the button **once**. Which lines appear in the console within half a second?"
    code: |
      const save = () => new Promise((resolve) => setTimeout(() => resolve(false), 100));

      function Wish() {
        const [wanted, setWanted] = useState(true);
        console.log(`render wanted=${wanted}`);

        async function handleClick() {
          setWanted(false);
          const ok = await save();
          if (!ok) setWanted(wanted);
        }

        return <button onClick={handleClick}>{wanted ? "wanted" : "acquired"}</button>;
      }
    answer:
      type: choice
      options:
        - id: right
          code: "render wanted=false\nrender wanted=true"
        - id: no-rollback
          code: "render wanted=false"
          why:
            uk: "Після `await` код усе ще бачить `wanted` рендеру, у якому стався клік, — `true`. `setWanted(true)` змінює state, тож є ще один рендер."
            en: "After `await` the code still sees `wanted` of the render in which the click happened — `true`. `setWanted(true)` changes the state, so there is one more render."
        - id: rollback-to-false
          code: "render wanted=false\nrender wanted=false"
          why:
            uk: "`setWanted(false)` не переписав `wanted` в обробнику — це знімок рендеру. Тому відкат ставить `true`, а не `false`."
            en: "`setWanted(false)` did not rewrite `wanted` in the handler — it is a snapshot of the render. So the rollback sets `true`, not `false`."
      correct: [right]
    explanation:
      uk: "Ми запустили це в пісочниці: `render wanted=false` — оптимістична зміна, `render wanted=true` — відкат. Тут відкат зі знімка спрацював лише тому, що клік один. Коли кліки перекриваються, пиши відкат через updater, що змінює лише свій запис (RE-06)."
      en: "We ran this in the sandbox: `render wanted=false` is the optimistic change, `render wanted=true` is the rollback. Here a rollback from the snapshot worked only because there was one click. When clicks overlap, write the rollback as an updater that changes only its own record (RE-06)."
