id: re-12-06-artifact-verification
unit: RE-12
title:
  uk: "Перевірка production-артефакту"
  en: "Verifying the production artifact"
kind: local-task
minutes: 15
contentVersion: 1
purpose:
  uk: "Тести з минулих уроків перевіряють вихідний код на тестовій сторінці jsdom, а людям віддають зібраний артефакт. Тут ти перевіриш саме його: віддаси `dist` локально, пройдеш сценарій у справжньому Chrome, порівняєш із dev-версією й знайдеш рядок вихідного коду, з якого прийшла помилка в стиснутому bundle."
  en: "The tests of the earlier lessons check the source code on a jsdom test page, while people are given the built artifact. Here you check exactly that: serve `dist` locally, walk through a scenario in real Chrome, compare it with the dev version and find the line of source code that an error in the minified bundle came from."
objectives:
  - uk: "Віддати production-збірку локально, пройти на ній сценарій користувача в справжньому браузері й порівняти поведінку та дані з dev-версією."
    en: "Serve the production build locally, run the user-flow checks against it and compare behavior and data with the dev version."
  - uk: "Через source map знайти рядок вихідного коду для стеку помилки з production-збірки."
    en: "Map a production stack trace back to the original source line with the source map."
prerequisites: [re-12-05-docs-review, js-10-03-compare-and-inspect, js-09-01-why-tests]
subskills:
  - { family: R-10, skill: "production artifact verification", depth: intro }
glossary: [preview-server]
selfCheck: [predict-new-origin]

blocks:
  - id: test-the-artifact
    kind: explanation
    title:
      uk: "Перевіряти те, що отримають люди"
      en: "Check what people will get"
    body:
      uk: |
        `npm test` у `release-lab` запускає тести у Vitest на jsdom — тестовій сторінці без справжнього браузера, з **вихідними** модулями. Вони не бачать того, що з’являється лише після збирання: файлів з хешем, lazy-модуля, який треба завантажити мережею, значень `.env`, вписаних у bundle, правил справжнього браузера.

        Тому перед випуском перевіряють сам артефакт. `npm run preview` запускає [[preview-server|preview-сервер]]: він віддає теку `dist` на `http://localhost:4173/` — так, як її віддаватиме статичний хостинг. На ньому ти проходиш [[end-to-end-test|end-to-end]] сценарій з JS-09: увесь застосунок у справжньому браузері, з перезавантаженням сторінки.

        Порт інший, ніж у dev-сервера (5173), — отже, і **джерело** (origin) інше. Справ, збережених у dev-версії, у `localStorage` preview-версії немає: сценарій мусить сам створити свої дані.
      en: |
        `npm test` in `release-lab` runs the tests in Vitest on jsdom — a test page without a real browser, with the **source** modules. They do not see what appears only after the build: hashed files, a lazy module that has to be loaded over the network, `.env` values written into the bundle, the rules of a real browser.

        So before a release the artifact itself is checked. `npm run preview` starts a [[preview-server]]: it serves the `dist` folder at `http://localhost:4173/` — the way static hosting will serve it. On it you go through an [[end-to-end-test|end-to-end]] scenario from JS-09: the whole app in a real browser, with a page reload.

        The port differs from the dev server's (5173) — so the **origin** differs too. Tasks saved in the dev version are not in the preview version's `localStorage`: the scenario has to create its own data.

  - id: stack-to-source
    kind: explanation
    title:
      uk: "Стек помилки з production — назад до рядка коду"
      en: "A production stack trace — back to the line of code"
    body:
      uk: |
        У production-збірці помилка виглядає так (ми отримали це в Chrome, посіявши помилку в `Stats.tsx`):

        ```text
        Error: Seeded error: stats with 3 tasks
            at r (http://localhost:4173/assets/Stats-B2w-C4k4.js:1:96)
            at os (http://localhost:4173/assets/index-iKTNG5yw.js:8:49211)
            …
        ```

        Функція `r`, рядок 1, стовпчик 96 — так виглядає стиснутий bundle. Ні назви `Stats`, ні номера твого рядка. Як у JS-15, рятує [[source-map|source map]]: таблиця «це місце bundle — з цього файла й рядка». Vite за замовчуванням production-карт **не пише** — їх вмикає `build: { sourcemap: true }` у `vite.config.ts`. Тоді поруч з кожним файлом з’являється `.map`, і та сама позиція `Stats-B2w-C4k4.js:1:96` веде до `src/Stats.tsx`, рядок 4.

        Карта відкриває вихідний код кожному, хто відкриє DevTools. Для навчального проєкту це нормально; у справжньому проєкті рішення публікувати карти ухвалюють свідомо.
      en: |
        In a production build an error looks like this (we got it in Chrome after seeding an error in `Stats.tsx`):

        ```text
        Error: Seeded error: stats with 3 tasks
            at r (http://localhost:4173/assets/Stats-B2w-C4k4.js:1:96)
            at os (http://localhost:4173/assets/index-iKTNG5yw.js:8:49211)
            …
        ```

        Function `r`, line 1, column 96 — this is what a minified bundle looks like. Neither the name `Stats` nor the number of your line. As in JS-15, a [[source-map]] comes to the rescue: a table of “this place in the bundle came from this file and line”. By default Vite does **not** write production maps — `build: { sourcemap: true }` in `vite.config.ts` turns them on. Then a `.map` file appears next to every file, and the same position `Stats-B2w-C4k4.js:1:96` leads to `src/Stats.tsx`, line 4.

        A map opens the source code to anyone who opens DevTools. For a learning project that is fine; in a real project publishing maps is a conscious decision.

  - id: predict-new-origin
    kind: prediction
    runnable: false
    prompt:
      uk: "У dev-версії `release-lab` на `http://localhost:5173/` ти додав три справи, і вони пережили перезавантаження. Тепер ти запускаєш `npm run build` і `npm run preview` і відкриваєш у тому самому Chrome `http://localhost:4173/`. Що в списку?"
      en: "In the dev version of `release-lab` at `http://localhost:5173/` you added three tasks, and they survived a reload. Now you run `npm run build` and `npm run preview` and open `http://localhost:4173/` in the same Chrome. What is in the list?"
    answer:
      type: choice
      options:
        - id: empty
          text: { uk: "Нічого: список порожній", en: "Nothing: the list is empty" }
        - id: three
          text: { uk: "Ті самі три справи: браузер той самий", en: "The same three tasks: it is the same browser" }
          why:
            uk: "Сховище належить усій адресі — схемі, хосту й порту. 5173 і 4173 — різні джерела, тож і `localStorage` у них різні."
            en: "Storage belongs to the whole address — the scheme, the host and the port. 5173 and 4173 are different origins, so their `localStorage` is different too."
        - id: built-in
          text: { uk: "Три справи: збирання вписало дані в bundle", en: "Three tasks: the build wrote the data into the bundle" }
          why:
            uk: "Збирання бере код і значення `VITE_…` з `.env`, а не дані з браузера. Справи живуть лише в `localStorage` сторінки, де їх додали."
            en: "The build takes the code and the `VITE_…` values from `.env`, not data from the browser. The tasks live only in the `localStorage` of the page where they were added."
      correct: [empty]
    explanation:
      uk: "Новий порт — нове джерело й порожнє сховище. Тому сценарій перевірки артефакту сам створює свої дані, а не покладається на те, що «вже було». У справжньому випуску відмінність ще важливіша: у людей дані на адресі сайту, а не на твоєму `localhost`."
      en: "A new port is a new origin with empty storage. That is why the artifact check scenario creates its own data instead of relying on what “was already there”. In a real release the difference matters even more: people's data lives at the site's address, not on your `localhost`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: що робить source map"
      en: "Recall: what a source map does"
    items:
      - id: map-off
        from: js-10-03-compare-and-inspect
        prompt:
          uk: "Сторінка виконує bundle, зібраний з картою. Ти поставив breakpoint в оригінальному доменному модулі й зупинився на ньому. Потім вимкнув source maps у налаштуваннях DevTools і оновив сторінку. Що тепер показує Sources?"
          en: "A page runs a bundle built with a map. You set a breakpoint in the original domain module and stopped at it. Then you turned source maps off in the DevTools settings and reloaded the page. What does Sources show now?"
        answer:
          type: choice
          options:
            - id: bundle-only
              text: { uk: "Лише сам bundle: оригінального модуля серед джерел немає", en: "Only the bundle itself: the original module is not among the sources" }
            - id: same
              text: { uk: "Те саме: карта вже завантажена й нікуди не дівається", en: "The same: the map is already loaded and does not go anywhere" }
              why:
                uk: "Оригінальні файли в Sources з’являються лише тому, що DevTools читають карту. Вимкнені карти — немає й оригіналу."
                en: "Original files appear in Sources only because DevTools read the map. With maps turned off there is no original either."
            - id: error
              text: { uk: "Сторінка перестає працювати", en: "The page stops working" }
              why:
                uk: "Карта потрібна лише DevTools. Сторінка виконує bundle однаково — з картою чи без."
                en: "The map is needed only by DevTools. The page runs the bundle the same way — with a map or without."
          correct: [bundle-only]
        explanation:
          uk: "Source map — підказка для інструментів, а не частина програми. Production-збірка без карти працює так само, але її стек помилки веде лише до стиснутого bundle."
          en: "A source map is a hint for the tools, not part of the program. A production build without a map works the same, but its error stack leads only to the minified bundle."

  - id: verify-artifact
    kind: local-task
    runtime: local-web
    title:
      uk: "Віддати dist, пройти сценарій і знайти рядок помилки"
      en: "Serve dist, walk through the scenario and find the line of an error"
    intro:
      uk: |
        Працюєш у `~/js-course/release-lab` з попередніх уроків (репозиторій із тегом `v0.1.0`). Якщо проєкту немає, пройди спершу завдання уроку «Production-бандл, ресурси й межі env» і «Версії, артефакти й оновлення залежностей». Потрібні Google Chrome і **два вікна терміналу**. Команди перевірено на macOS; на Linux вони ті самі.

        **Крок 2 — `docs/e2e-walkthrough.md`** (сценарій; результат кожного кроку записуєш сам):

        ```md
        # End-to-end walk-through: release-lab on the preview server

        Build: version … (commit …), served at http://localhost:4173/

        | # | Action | Expected | Result |
        |---|---|---|---|
        | 1 | Open the page | Heading "Release lab", empty list, footer with the version and commit | |
        | 2 | Add "Pay rent" and "Call the bank" | Both appear in the list, the field is empty | |
        | 3 | Tick "Call the bank" | The box is ticked | |
        | 4 | Press "Show stats" | "Done: 1 of 2 tasks" ("Loading stats…" may flash first) | |
        | 5 | Reload the page | Both tasks are still there, "Call the bank" is still ticked | |
        | 6 | Open DevTools → Console | No errors | |
        ```

        **Крок 4 — `src/Stats.tsx`**, посіяна помилка: додай першим рядком у тіло функції `Stats`:

        ```tsx
        if (tasks.length >= 3) throw new Error("Seeded error: stats with 3 tasks");
        ```
      en: |
        You work in `~/js-course/release-lab` from the previous lessons (the repository with the tag `v0.1.0`). If you do not have the project, first do the tasks of the lessons “Production bundle, assets and env boundaries” and “Versions, artifacts and dependency updates”. You need Google Chrome and **two terminal windows**. The commands were checked on macOS; on Linux they are the same.

        **Step 2 — `docs/e2e-walkthrough.md`** (the scenario; you write down the result of each step yourself):

        ```md
        # End-to-end walk-through: release-lab on the preview server

        Build: version … (commit …), served at http://localhost:4173/

        | # | Action | Expected | Result |
        |---|---|---|---|
        | 1 | Open the page | Heading "Release lab", empty list, footer with the version and commit | |
        | 2 | Add "Pay rent" and "Call the bank" | Both appear in the list, the field is empty | |
        | 3 | Tick "Call the bank" | The box is ticked | |
        | 4 | Press "Show stats" | "Done: 1 of 2 tasks" ("Loading stats…" may flash first) | |
        | 5 | Reload the page | Both tasks are still there, "Call the bank" is still ticked | |
        | 6 | Open DevTools → Console | No errors | |
        ```

        **Step 4 — `src/Stats.tsx`**, a seeded error: add as the first line of the body of the `Stats` function:

        ```tsx
        if (tasks.length >= 3) throw new Error("Seeded error: stats with 3 tasks");
        ```
    tools:
      - name: "Node.js, npm, Vite"
        version: "as in the previous lessons (checked with Node.js 25.2.1, Vite 8.3.2)"
      - name: "Google Chrome"
        version: "current desktop version"
    steps:
      - text:
          uk: "Збери артефакт і запусти preview-сервер у **першому** вікні терміналу. Не закривай його."
          en: "Build the artifact and start the preview server in the **first** terminal window. Leave it open."
        command: "cd ~/js-course/release-lab\nnpm run build\nnpm run preview"
        expect:
          uk: |
            ```text
            > release-lab@0.1.0 preview
            > vite preview

              ➜  Local:   http://localhost:4173/
              ➜  Network: use --host to expose
            ```
          en: |
            ```text
            > release-lab@0.1.0 preview
            > vite preview

              ➜  Local:   http://localhost:4173/
              ➜  Network: use --host to expose
            ```
      - text:
          uk: "Створи `docs/e2e-walkthrough.md` (вміст — у вступі, «Крок 2»), впиши у рядок `Build` версію й commit з футера сторінки й пройди шість кроків у Chrome на `http://localhost:4173/`. Записуй у колонку `Result` те, що бачиш, а не те, що мало бути."
          en: "Create `docs/e2e-walkthrough.md` (contents in the introduction, “Step 2”), write the version and commit from the page footer into the `Build` line and go through the six steps in Chrome at `http://localhost:4173/`. Write into the `Result` column what you see, not what should have been."
        expect:
          uk: "Крок 1: список **порожній**, хоч у dev-версії справи були, — інше джерело. Кроки 2–5 збігаються з очікуваним: дані пережили перезавантаження вже в сховищі `localhost:4173`. Крок 6: у консолі production-збірки немає жодного рядка — навіть підказки «Download the React DevTools…», яку dev-версія друкує щоразу."
          en: "Step 1: the list is **empty**, although the dev version had tasks — another origin. Steps 2–5 match the expectation: the data survived the reload, now in the storage of `localhost:4173`. Step 6: the production build's console has no lines at all — not even the hint “Download the React DevTools…” that the dev version prints every time."
      - text:
          uk: "Порівняй із dev-версією: у **другому** вікні терміналу запусти dev-сервер і пройди ті самі кроки на `http://localhost:5173/`. Дописуй у `docs/e2e-walkthrough.md` під таблицею кожну відмінність, яку помітиш (дані, консоль, швидкість появи «Loading stats…»). Потім зупини dev-сервер (Ctrl + C)."
          en: "Compare with the dev version: in the **second** terminal window start the dev server and go through the same steps at `http://localhost:5173/`. Under the table in `docs/e2e-walkthrough.md`, add every difference you notice (data, console, how long “Loading stats…” shows). Then stop the dev server (Ctrl + C)."
        command: "cd ~/js-course/release-lab\nnpm run dev"
        expect:
          uk: "Поведінка однакова. Відмінності, які ми бачили: у dev-версії в списку старі справи з 5173, а в консолі є підказка про React DevTools. Якщо поведінка десь різна — це знахідка, яку тести на jsdom пропустили б: запиши її."
          en: "The behavior is the same. The differences we saw: the dev version's list has the old tasks from 5173, and its console has the React DevTools hint. If the behavior differs anywhere, that is a finding the jsdom tests would have missed: write it down."
      - text:
          uk: "Посій помилку й увімкни карти. У `src/Stats.tsx` додай рядок із вступу («Крок 4»). У `vite.config.ts` під рядком `plugins: [react()],` допиши `build: { sourcemap: true },`. Зупини preview-сервер у першому вікні (Ctrl + C) і збери знову."
          en: "Seed an error and turn the maps on. In `src/Stats.tsx` add the line from the introduction (“Step 4”). In `vite.config.ts`, under the line `plugins: [react()],`, add `build: { sourcemap: true },`. Stop the preview server in the first window (Ctrl + C) and build again."
        command: "npm run build\nnpm run preview"
        expect:
          uk: |
            ```text
            dist/assets/Stats-B2w-C4k4.js     0.27 kB │ gzip:  0.24 kB │ map:     0.67 kB
            dist/assets/index-iKTNG5yw.js   222.48 kB │ gzip: 69.78 kB │ map: 1,048.96 kB
            ```

            Поруч із кожним JS-файлом тепер є `.map`. Назви в тебе будуть інші.
          en: |
            ```text
            dist/assets/Stats-B2w-C4k4.js     0.27 kB │ gzip:  0.24 kB │ map:     0.67 kB
            dist/assets/index-iKTNG5yw.js   222.48 kB │ gzip: 69.78 kB │ map: 1,048.96 kB
            ```

            Every JS file now has a `.map` next to it. Your names will differ.
      - text:
          uk: "Відкрий `http://localhost:4173/` з відкритою вкладкою DevTools → Console, додай третю справу й натисни «Show stats». Сторінка порожніє: межі помилок у `release-lab` немає. Розгорни помилку в консолі й подивись, куди ведуть рядки стеку."
          en: "Open `http://localhost:4173/` with DevTools → Console open, add a third task and press “Show stats”. The page goes empty: `release-lab` has no error boundary. Expand the error in the console and look at where the stack lines lead."
        expect:
          uk: "Повідомлення `Seeded error: stats with 3 tasks`. З картою DevTools показують у стеку місце в `Stats.tsx` замість `Stats-….js:1:96`, а клік відкриває у Sources рядок 4 оригінального файла. (Цей вигляд консолі ми описуємо за поведінкою DevTools із JS-15 і не перевіряли автоматично.) Без карти — лише `Stats-….js:1:96`."
          en: "The message `Seeded error: stats with 3 tasks`. With the map DevTools show a place in `Stats.tsx` in the stack instead of `Stats-….js:1:96`, and a click opens line 4 of the original file in Sources. (We describe this console view from DevTools' behavior in JS-15 and did not check it automatically.) Without the map — only `Stats-….js:1:96`."
      - text:
          uk: "Перевір карту без DevTools — тим самим пакетом, яким її читають інструменти (`source-map-js` уже лежить у `node_modules` разом із Vite). Заміни назву файла на свою з кроку 4; рядок 1 і стовпчик 95 — позиція `:1:96` зі стеку (у картах стовпчики рахують з нуля)."
          en: "Check the map without DevTools — with the same package the tools read it with (`source-map-js` is already in `node_modules` together with Vite). Replace the file name with yours from step 4; line 1 and column 95 are the position `:1:96` from the stack (maps count columns from zero)."
        command: "node -e 'const { SourceMapConsumer } = require(\"source-map-js\"); const map = JSON.parse(require(\"fs\").readFileSync(\"dist/assets/Stats-B2w-C4k4.js.map\", \"utf8\")); console.log(new SourceMapConsumer(map).originalPositionFor({ line: 1, column: 95 }));'"
        expect:
          uk: "`{ source: '../../src/Stats.tsx', line: 4, column: 35, name: null }` — рядок 4 у `src/Stats.tsx`, саме той, де ти посіяв помилку. Запиши в `docs/e2e-walkthrough.md` позицію зі стеку й рядок, до якого вона привела. У PowerShell лапки в цій команді інші (не перевірено) — простіше перевірити в DevTools."
          en: "`{ source: '../../src/Stats.tsx', line: 4, column: 35, name: null }` — line 4 in `src/Stats.tsx`, exactly where you seeded the error. Write into `docs/e2e-walkthrough.md` the position from the stack and the line it led to. In PowerShell the quotes in this command differ (not checked) — it is simpler to check in DevTools."
      - text:
          uk: "Прибери посіяну помилку з `Stats.tsx` (рядок `build: { sourcemap: true },` можеш залишити), збери, переконайся, що крок 4 сценарію знову проходить, і закоміть сценарій. Зупини preview-сервер."
          en: "Remove the seeded error from `Stats.tsx` (you may keep the line `build: { sourcemap: true },`), build, make sure step 4 of the scenario passes again, and commit the scenario. Stop the preview server."
        command: "npm run build\ngit add docs/e2e-walkthrough.md vite.config.ts\ngit commit -m \"Add the end-to-end walk-through and production source maps\""
        expect:
          uk: "`git status` після commit-а чистий, а `src/Stats.tsx` без посіяного рядка (`git diff` нічого не показує)."
          en: "`git status` is clean after the commit, and `src/Stats.tsx` has no seeded line (`git diff` shows nothing)."
    verify:
      - id: walked
        text:
          uk: "Я пройшов шість кроків сценарію на preview-сервері й записав результати, зокрема порожній список на старті."
          en: "I went through the six steps of the scenario on the preview server and wrote down the results, including the empty list at the start."
      - id: compared
        text:
          uk: "Я записав відмінності між preview-версією й dev-версією."
          en: "I wrote down the differences between the preview version and the dev version."
      - id: mapped
        text:
          uk: "Позицію з production-стеку я перевів через source map у файл і рядок вихідного коду."
          en: "I mapped the position from the production stack through the source map to a file and a line of source code."
    troubleshooting:
      - problem:
          uk: "`Port 4173 is in use, trying another one...`"
          en: "`Port 4173 is in use, trying another one...`"
        fix:
          uk: "Інший preview-сервер ще працює (часто — у другому вікні). Відкрий адресу, яку надрукував новий сервер, але пам’ятай: інший порт — інше сховище, і дані сценарію доведеться створити наново. Краще зупини старий сервер (Ctrl + C у його вікні)."
          en: "Another preview server is still running (often in the second window). Open the address the new server printed, but remember: another port is another storage, and the scenario's data has to be created again. It is better to stop the old server (Ctrl + C in its window)."
      - problem:
          uk: "`Error: ENOENT: no such file or directory, open 'dist/assets/Stats-B2w-C4k4.js.map'`"
          en: "`Error: ENOENT: no such file or directory, open 'dist/assets/Stats-B2w-C4k4.js.map'`"
        fix:
          uk: "У команді назва файла з цього уроку, а не твоя. `ls dist/assets` покаже твою назву; якщо файлів `.map` немає, перевір рядок `build: { sourcemap: true },` у `vite.config.ts` і збери знову."
          en: "The command has the file name from this lesson, not yours. `ls dist/assets` shows your name; if there are no `.map` files, check the line `build: { sourcemap: true },` in `vite.config.ts` and build again."
    recovery:
      uk: "Посіяна помилка й карти — лише в робочих файлах: `git diff` покаже все, що змінилося, а `git restore src/Stats.tsx` поверне файл до останнього commit-а. Дані сценарію живуть у `localStorage` адреси `localhost:4173` і не впливають на dev-версію."
      en: "The seeded error and the maps live only in the working files: `git diff` shows everything that changed, and `git restore src/Stats.tsx` returns the file to the last commit. The scenario's data lives in the `localStorage` of `localhost:4173` and does not affect the dev version."

  - id: to-project
    kind: transfer
    capstoneStep: RE-12
    body:
      uk: "У кроці проєкту ти віддаси збірку свого застосунку preview-сервером і пройдеш на ній сценарій CRUD, фільтра й перезавантаження — створивши дані наново, бо адреса інша."
      en: "In the project step you serve your app's build with the preview server and go through the CRUD, filter and reload scenario on it — creating the data again, because the address is different."
