id: re-12-08-gate-unseen-debug
unit: RE-12
title:
  uk: "Іспит: налагодження незнайомого React-коду"
  en: "Gate: unseen React debugging"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Перша частина підсумкового іспиту React. Без підказок ти розбираєш незнайомий застосунок, у якого червоний CI, а один тест зелений лише завдяки своїй фікстурі, — і доводиш кожне виправлення перевіркою. Друга частина — у твоєму `release-lab`: production-збірка, зламана приватним значенням env і шляхом до файла, який працює лише на dev-сервері."
  en: "The first part of the final React gate. Without hints you take apart an unseen app whose CI is red and one of whose tests is green only thanks to its fixture — and prove every fix with a check. The second part is in your `release-lab`: a production build broken by a private env value and a file path that works only on the dev server."
objectives:
  - uk: "Без підказок діагностувати й виправити в незнайомому React-застосунку підписку без cleanup, помилки lint і типів, що блокують конвеєр, та production-збірку, зламану неправильним використанням env і шляхів до ресурсів."
    en: "Diagnose and repair, without hints, defects in an unseen React app: a subscription without cleanup, a lint and a type failure that block the pipeline, and a production build broken by env and asset-path misuse."
  - uk: "Знайти дефект, який ховають тести на фікстурах, і пояснити, який запуск у справжньому браузері його покаже."
    en: "Identify the defect that fixture-backed tests hide and explain which real-browser run would reveal it."
prerequisites: [re-12-07-cumulative-review]
subskills:
  - { family: R-10, skill: "behavioral component/integration/user tests", depth: assess }
  - { family: R-10, skill: "effect cleanup", depth: assess }
  - { family: R-10, skill: "fixture vs browser E2E limits", depth: assess }
  - { family: P-06, skill: "production bundle/assets/env boundaries", depth: assess }
  - { family: P-06, skill: "lint/type/unit/user checks", depth: assess }
glossary: []
selfCheck: [habit-board]

blocks:
  - id: gate-rules
    kind: explanation
    title:
      uk: "Як влаштовано іспит"
      en: "How the gate works"
    body:
      uk: |
        Обидві частини — без підказок і без готового розв’язку в тексті. Перевірки називають **симптом**, який бачить людина, а не причину: причину знаходиш ти.

        - **Частина 1** — на платформі: застосунок «Мої звички» з червоним CI. Лог CI лежить у `ci-log.txt`. Ти виправляєш код, посилюєш тест і записуєш діагноз у `review.js`.
        - **Частина 2** — у VS Code, у `release-lab`: ти відтворюєш зламану production-збірку, лагодиш її й доводиш командами, що віддана збірка працює.

        Що знадобиться: RE-03 (ефекти й cleanup), RE-06 (перегони відповідей), RE-08 (що доводять фікстури), а також уроки цього розділу про збирання, env і перевірку артефакту.
      en: |
        Both parts are without hints and without a ready solution in the text. The checks name the **symptom** a person sees, not the cause: finding the cause is your job.

        - **Part 1** is on the platform: the app “My habits” with a red CI. The CI log is in `ci-log.txt`. You fix the code, strengthen a test and write your diagnosis into `review.js`.
        - **Part 2** is in VS Code, in `release-lab`: you reproduce a broken production build, repair it and prove with commands that the served build works.

        What you will need: RE-03 (effects and cleanup), RE-06 (response races), RE-08 (what fixtures prove), and this unit's lessons on the build, env and checking the artifact.

  - id: habit-board
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-react
    dir: habit-board
    entry: main.jsx
    editable: [CompletionFeed.jsx, HabitSearch.jsx, HabitSearch.test.jsx, GoalPanel.tsx, MinutesLog.tsx, review.js]
    capabilities: { network: lab }
    strings:
      lang: { uk: "uk", en: "en" }
      appTitle: { uk: "Мої звички", en: "My habits" }
      feedTitle: { uk: "Щойно виконано", en: "Just completed" }
      searchLabel: { uk: "Пошук звички", en: "Search habits" }
      resultsLabel: { uk: "Знайдені звички", en: "Found habits" }
      goalShow: { uk: "Показати ціль тижня", en: "Show the weekly goal" }
      goalHide: { uk: "Сховати ціль тижня", en: "Hide the weekly goal" }
      goalText: { uk: "Ціль тижня, днів", en: "Weekly goal, days" }
      minutesLabel: { uk: "Хвилин сьогодні", en: "Minutes today" }
      addMinutes: { uk: "Додати хвилини", en: "Add minutes" }
      minutesTotal: { uk: "Разом хвилин", en: "Total minutes" }
      h1: { uk: "Ранкова зарядка", en: "Morning exercise" }
      h2: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      h3: { uk: "Пити воду", en: "Drink water" }
      h4: { uk: "Прибирання", en: "Tidy up" }
      h5: { uk: "Вчити англійські слова", en: "Learn English words" }
      h6: { uk: "Прогулянка", en: "Go for a walk" }
      queryTwo: { uk: "пи", en: "dr" }
      testSearch: { uk: "пошук із двох літер показує лише відповідну звичку", en: "a two-letter search shows only the matching habit" }
      mCount: { uk: "звички в результатах", en: "habits in the results" }
      ciPassed: { uk: "Пройшли: 1 · не пройшли: 0", en: "Passed: 1 · failed: 0" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rNotFound: { uk: "на екрані немає", en: "not on the screen:" }
      rStillMissing: { uk: "так і не з’явилося", en: "never appeared" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "«Мої звички»: червоний CI і зелений тест, якому не варто вірити"
      en: "“My habits”: a red CI and a green test not to be trusted"
    instructions:
      uk: |
        Pull request додає до трекера звичок пошук, журнал хвилин, ціль тижня й стрічку виконаних звичок. CI червоний — лог у `ci-log.txt`. Людина, яка вже користувалася гілкою, пише: «щойно виконана звичка з’являється у стрічці двічі; пошук іноді показує не те, що я ввела; ціль тижня ламає сторінку; хвилини складаються якось дивно». А тест пошуку в `HabitSearch.test.jsx` зелений.

        `main.jsx` лишається зі `<StrictMode>`, як у шаблоні Vite. Застосунок шукає на справжньому сервері лабораторії курсу (`searchLab.js`), тест — у фікстурі (`fakeSearch.js`, затримку кожної відповіді задає `settings.delayFor`). Змінювати можна `CompletionFeed.jsx`, `HabitSearch.jsx`, `HabitSearch.test.jsx`, `GoalPanel.tsx`, `MinutesLog.tsx` і `review.js`.

        Готовий результат:

        - кожне виконання показується у стрічці **один** раз, і стрічка не лишає по собі обробників, коли зникає зі сторінки;
        - пошук завжди показує відповідь на **останній** введений запит — і на справжньому сервері теж;
        - тест у `HabitSearch.test.jsx` проходить з правильним пошуком і **не проходить** з пошуком, що може показати застарілу відповідь;
        - ціль тижня можна відкривати й закривати скільки завгодно разів, і вона показує 5 днів;
        - хвилини 15 і 20 дають разом 35;
        - у `review.js` — твій діагноз: чому наданий тест пошуку був зеленим, хоча пошук зламаний, і який запуск у справжньому браузері показує цей дефект.

        Перевірки показують компоненти в `<StrictMode>`, надсилають у стрічку одне виконання, друкують у поле пошуку дві літери без пауз на справжньому сервері, запускають твій тест із двома версіями пошуку й двічі відкривають ціль тижня. Діагноз у `review.js` перевіряється порівнянням з однією правильною відповіддю на кожне поле.
      en: |
        A pull request adds to the habit tracker a search, a minutes log, a weekly goal and a feed of completed habits. CI is red — the log is in `ci-log.txt`. A person who has already used the branch writes: “a habit I just completed shows up in the feed twice; the search sometimes shows something other than what I typed; the weekly goal breaks the page; the minutes add up strangely”. And the search test in `HabitSearch.test.jsx` is green.

        `main.jsx` keeps `<StrictMode>`, as in the Vite template. The app searches on the course lab's real server (`searchLab.js`), the test in a fixture (`fakeSearch.js`; `settings.delayFor` sets the delay of each answer). You may change `CompletionFeed.jsx`, `HabitSearch.jsx`, `HabitSearch.test.jsx`, `GoalPanel.tsx`, `MinutesLog.tsx` and `review.js`.

        The finished result:

        - every completion shows in the feed **once**, and the feed leaves no handlers behind when it leaves the page;
        - the search always shows the answer to the **last** query typed — on the real server too;
        - the test in `HabitSearch.test.jsx` passes with a correct search and **fails** with a search that can show a stale answer;
        - the weekly goal can be opened and closed any number of times, and it shows 5 days;
        - minutes 15 and 20 add up to 35;
        - `review.js` holds your diagnosis: why the provided search test was green although the search is broken, and which run in a real browser shows that defect.

        The checks show the components in `<StrictMode>`, send one completion to the feed, type two letters into the search field without pauses on the real server, run your test with two versions of the search and open the weekly goal twice. The diagnosis in `review.js` is compared with one correct answer per field.
    testTitles:
      "one completion shows one row":
        uk: "Одне виконання — один рядок у стрічці"
        en: "One completion shows one row"
      "the feed leaves no handler behind":
        uk: "Стрічка не лишає по собі обробників"
        en: "The feed leaves no handler behind"
      "with the real server the search shows the answer to the last query typed":
        uk: "На справжньому сервері пошук показує відповідь на останній запит"
        en: "With the real server the search shows the answer to the last query typed"
      "your search test passes with a search that keeps only the latest answer":
        uk: "Твій тест пошуку проходить із правильним пошуком"
        en: "Your search test passes with a correct search"
      "your search test fails with a search that can show a stale answer":
        uk: "Твій тест пошуку не проходить із пошуком, що може показати застарілу відповідь"
        en: "Your search test fails with a search that can show a stale answer"
      "the goal panel opens and closes twice without breaking":
        uk: "Ціль тижня відкривається й закривається двічі без поломки"
        en: "The weekly goal opens and closes twice without breaking"
      "minutes add up as numbers":
        uk: "Хвилини складаються як числа"
        en: "Minutes add up as numbers"
      "review says why the provided test was green":
        uk: "`review.whyGreen` — твоя відповідь про зелений тест"
        en: "`review.whyGreen` — your answer about the green test"
      "review names the run that reveals it":
        uk: "`review.revealingRun` — твоя відповідь про запуск"
        en: "`review.revealingRun` — your answer about the run"
    solutionNote:
      uk: |
        - **Стрічка:** `completionFeed.off` знімає лише той самий обробник, тож його треба назвати й повернути cleanup, що його знімає. StrictMode тоді проходить «підписатися → відписатися → підписатися» і лишає один обробник.
        - **Пошук:** фікстура з нульовою затримкою відповідає по черзі, тож перегони не видно; справжній сервер відповідає на коротший запит повільніше. Cleanup із прапорцем `ignore` (або `AbortController`, якщо пошук отримує `signal`) відкидає застарілу відповідь. Тест ловить перегони, лише коли фікстура відтворює порядок справжнього сервера: одна літера — довше, дві — швидше.
        - **Ціль тижня:** хук після раннього `return` — рядок, на який указує `react-hooks(rules-of-hooks)` у лозі CI. На першому рендері `useState(5)` не викликається, а після відкриття — викликається, і React не може зіставити хуки.
        - **Хвилини:** `TS2345` у лозі — це `число + текст`, що дає текст `"015"`. Значення поля — текст; його перетворюють на число до додавання.
        - **Діагноз:** тест був зеленим, бо фікстура відповідала на всі запити одразу й по черзі; дефект показує швидкий набір двох літер на справжньому сервері.
      en: |
        - **Feed:** `completionFeed.off` removes only the same handler, so the handler needs a name, and the effect returns a cleanup that removes it. StrictMode then goes “subscribe → unsubscribe → subscribe” and leaves one handler.
        - **Search:** a fixture with zero delay answers in order, so the race is invisible; the real server answers a shorter query more slowly. A cleanup with an `ignore` flag (or an `AbortController`, if the search receives a `signal`) throws the stale answer away. A test catches the race only when the fixture reproduces the real server's order: one letter takes longer, two letters are faster.
        - **Weekly goal:** a hook after an early `return` — the line `react-hooks(rules-of-hooks)` points at in the CI log. On the first render `useState(5)` is not called, after opening it is, and React cannot match the hooks.
        - **Minutes:** `TS2345` in the log is `number + text`, which gives the text `"015"`. A field's value is text; it is turned into a number before adding.
        - **Diagnosis:** the test was green because the fixture answered every query at once and in order; typing two letters quickly on the real server shows the defect.
    feedback:
      - when: { test: "one completion shows one row" }
        message:
          uk: "Ця перевірка показує стрічку в `<StrictMode>`, публікує одне виконання й чекає рівно один рядок про нього. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check shows the feed in `<StrictMode>`, publishes one completion and expects exactly one row about it. If every check fails at once, fix the first error in the console first."
      - when: { test: "the feed leaves no handler behind" }
        message:
          uk: "Ця перевірка рахує обробники стрічки до показу `CompletionFeed` і після того, як компонент зник зі сторінки, і чекає однакову кількість."
          en: "This check counts the feed's handlers before `CompletionFeed` is shown and after the component has left the page, and expects the same number."
      - when: { test: "with the real server the search shows the answer to the last query typed" }
        message:
          uk: "Ця перевірка друкує дві літери без пауз у поле пошуку, що працює зі справжнім сервером лабораторії, чекає 0,9 с і порівнює показані звички з відповіддю сервера на весь запит."
          en: "This check types two letters without pauses into a search field working with the lab's real server, waits 0.9 s and compares the habits shown with the server's answer to the whole query."
      - when: { test: "your search test passes with a search that keeps only the latest answer" }
        message:
          uk: "Ця перевірка запускає тести з `HabitSearch.test.jsx`, підставивши правильний пошук, і чекає, що є хоча б один тест і всі проходять. Повідомлення твого тесту — у тексті цієї перевірки."
          en: "This check runs the tests from `HabitSearch.test.jsx` with a correct search put in place and expects at least one test, all passing. Your test's message is in the text of this check."
      - when: { test: "your search test fails with a search that can show a stale answer" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб твій тест проходив із правильним пошуком. Потім вона підставляє пошук, що показує ту відповідь, яка прийшла останньою, і чекає, що твій тест це помітить."
          en: "This check first requires your test to pass with a correct search. Then it puts in a search that shows whichever answer arrived last and expects your test to notice."
      - when: { test: "the goal panel opens and closes twice without breaking" }
        message:
          uk: "Ця перевірка двічі відкриває й закриває ціль тижня й після кожного відкриття чекає текст «Ціль тижня, днів: 5» без поломки рендеру."
          en: "This check opens and closes the weekly goal twice and after every opening expects the text “Weekly goal, days: 5” without a broken render."
      - when: { test: "minutes add up as numbers" }
        message:
          uk: "Ця перевірка вводить 15, натискає «Додати хвилини», потім 20 і знову натискає, і чекає в `<output>` рівно `35`."
          en: "This check types 15, presses “Add minutes”, then 20 and presses again, and expects exactly `35` in the `<output>`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: що доводить фікстура"
      en: "Recall: what a fixture proves"
    items:
      - id: fixture-limits
        from: re-08-02-what-the-checkpoint-checks
        prompt:
          uk: "Усі тести твого проєкту зелені: вони працюють на фікстурах — дані з файла, компонент у порожньому контейнері, події, створені кодом тесту. Що з цього вони **не** доводять?"
          en: "All your project's tests are green: they work on fixtures — data from a file, a component in an empty container, events created by the test's code. Which of these do they **not** prove?"
        answer:
          type: choice
          options:
            - id: browser
              text: { uk: "Що Tab справді переносить фокус, а дані знаходяться в сховищі потрібної адреси", en: "That Tab really moves the focus, and that the data is in the storage of the right address" }
            - id: logic
              text: { uk: "Що людина бачить правильний результат своїх дій", en: "That a person sees the right result of their actions" }
              why:
                uk: "Це саме те, що фікстурні тести дій користувача доводять: логіку й видимий результат."
                en: "That is exactly what fixture-backed user-action tests prove: the logic and the visible result."
            - id: cleanup
              text: { uk: "Що ефект прибирає за собою під `<StrictMode>`", en: "That an effect cleans up after itself under `<StrictMode>`" }
              why:
                uk: "Тест під `<StrictMode>`, який падає без cleanup, доводить це й на фікстурі."
                en: "A test under `<StrictMode>` that fails without the cleanup proves it on a fixture too."
          correct: [browser]
        explanation:
          uk: "Фікстура доводить логіку. Справжню клавіатуру й фокус, сховище конкретної адреси, справжню навігацію — і, як у цьому іспиті, порядок відповідей справжнього сервера — показує лише запуск у справжньому браузері."
          en: "A fixture proves the logic. The real keyboard and focus, the storage of a particular address, real navigation — and, as in this gate, the real server's order of answers — only a run in a real browser shows."

  - id: broken-build
    kind: local-task
    runtime: local-web
    title:
      uk: "Частина 2: зламана production-збірка release-lab"
      en: "Part 2: the broken production build of release-lab"
    intro:
      uk: |
        Працюєш у `~/js-course/release-lab` (репозиторій із попередніх уроків). Без підказок: кроки нижче лише відтворюють поломку й кажуть, що треба довести.

        Колега додав до застосунку значок синхронізації й каже: «у мене на `npm run dev` усе працює». Його зміна — це новий файл і два рядки.

        **Крок 1 — `src/SyncBadge.tsx`:**

        ```tsx
        export default function SyncBadge() {
          const key = import.meta.env.VITE_SYNC_API_KEY;
          return (
            <p>
              <img src="/src/assets/react.svg" alt="Sync" width="16" />{" "}
              {key ? <a href={`https://sync.example/status?key=${key}`}>Sync is on</a> : "Sync is off"}
            </p>
          );
        }
        ```

        **Крок 1 — `src/App.tsx`:** під рядком `import BuildInfo from "./BuildInfo.tsx";` додай `import SyncBadge from "./SyncBadge.tsx";`, а перед `<BuildInfo />` — `<SyncBadge />`.

        **Крок 1 — `.env.local`:** заміни рядок `SYNC_API_KEY=placeholder-private-7f3a` на `VITE_SYNC_API_KEY=placeholder-private-7f3a`.

        Що треба довести наприкінці:

        - на сторінці, яку віддає `npm run preview`, значок видно, а не порожню рамку з текстом `Sync`;
        - `grep -rl "placeholder-private-7f3a" dist` після збирання не друкує нічого;
        - значок і далі показує, чи налаштована синхронізація, — на основі лише публічного значення;
        - ворота `lint`, `typecheck` і `test` зелені.
      en: |
        You work in `~/js-course/release-lab` (the repository from the previous lessons). Without hints: the steps below only reproduce the breakage and say what has to be proved.

        A colleague added a sync badge to the app and says: “on `npm run dev` everything works for me”. Their change is one new file and two lines.

        **Step 1 — `src/SyncBadge.tsx`:**

        ```tsx
        export default function SyncBadge() {
          const key = import.meta.env.VITE_SYNC_API_KEY;
          return (
            <p>
              <img src="/src/assets/react.svg" alt="Sync" width="16" />{" "}
              {key ? <a href={`https://sync.example/status?key=${key}`}>Sync is on</a> : "Sync is off"}
            </p>
          );
        }
        ```

        **Step 1 — `src/App.tsx`:** under the line `import BuildInfo from "./BuildInfo.tsx";` add `import SyncBadge from "./SyncBadge.tsx";`, and before `<BuildInfo />` add `<SyncBadge />`.

        **Step 1 — `.env.local`:** replace the line `SYNC_API_KEY=placeholder-private-7f3a` with `VITE_SYNC_API_KEY=placeholder-private-7f3a`.

        What has to be proved at the end:

        - on the page served by `npm run preview` the badge icon is visible, not an empty frame with the text `Sync`;
        - after the build `grep -rl "placeholder-private-7f3a" dist` prints nothing;
        - the badge still shows whether sync is set up — based on a public value only;
        - the `lint`, `typecheck` and `test` gates are green.
