id: re-12-05-docs-review
unit: RE-12
title:
  uk: "Документація й рев’ю"
  en: "Docs and review"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Написати розділ README, за яким рецензент установить, запустить, протестує й збере проєкт з чистого клону."
    en: "Write a README section that lets a reviewer install, run, test and build the capstone from a clean clone."
  - uk: "Переглянути pull request за чеклистом (поведінка, тести, типи, доступність, bundle й env, нотатка про відкат) і писати коментарі з доказами."
    en: "Review a pull request against a checklist (behavior, tests, types, accessibility, bundle and env, rollback note) and write comments that cite evidence."
prerequisites: [re-12-04-static-delivery-rollback, js-15-12-remotes-pr-review, js-17-09-documentation-code-review, re-03-05-strict-mode-rechecks]
subskills:
  - { family: P-06, skill: "docs and review", depth: intro }
glossary: [release-notes]
selfCheck: [predict-review-flags, budget-alerts-fix]

blocks:
  - id: docs-first
    kind: explanation
    title:
      uk: "README пишуть для людини з чистим клоном"
      en: "A README is written for a person with a clean clone"
    body:
      uk: |
        Рецензент, новий колега чи ти сам через пів року починають з того самого: `git clone` і порожня тека `node_modules`. Код не скаже, яку версію Node.js поставити, де взяти `.env` і якою командою зібрати. Це каже README — і його пишуть разом зі зміною, а не «колись наприкінці», коли ніхто вже не пам’ятає кроків.

        Розділ «як працювати з проєктом» відповідає на чотири питання — командами, які можна скопіювати:

        1. **Встановити:** яка версія Node.js; `npm ci`.
        2. **Запустити:** `npm run dev` і адреса.
        3. **Перевірити:** ті самі ворота, що в CI.
        4. **Зібрати:** `npm run build` і що з’явиться в `dist`; які значення `.env` публічні.

        Перевіряють README одним способом: клонують проєкт у нову теку й проходять його слово в слово. Крок, який довелося вгадати, — дефект документації.

        Друга частина документації — [[release-notes|нотатки випуску]]: що в новій версії помітить людина, яка користується застосунком. Без слів із коду: «Сповіщення про бюджет більше не дублюються», а не «додано cleanup в useEffect».
      en: |
        A reviewer, a new colleague or you yourself half a year later all start the same way: `git clone` and an empty `node_modules` folder. The code does not say which Node.js version to install, where to get `.env` or which command builds the project. The README says it — and it is written together with the change, not “sometime at the end”, when nobody remembers the steps any more.

        A “working with the project” section answers four questions — with commands that can be copied:

        1. **Install:** which Node.js version; `npm ci`.
        2. **Run:** `npm run dev` and the address.
        3. **Check:** the same gates as in CI.
        4. **Build:** `npm run build` and what appears in `dist`; which `.env` values are public.

        A README is checked one way: clone the project into a new folder and follow it word for word. A step you had to guess is a documentation defect.

        The second part of documentation is [[release-notes]]: what a person who uses the app will notice in the new version. Without words from the code: “Budget alerts no longer appear twice”, not “added a cleanup to useEffect”.

  - id: review-checklist
    kind: explanation
    title:
      uk: "Рев’ю за чеклистом і з доказами"
      en: "A review against a checklist, with evidence"
    body:
      uk: |
        У JS-15 ти писав коментар про дефект із конкретним випадком, питання про намір і рішення з причиною. Для React-застосунку перед випуском до цього додається чеклист — те, що інструменти самі не перевірять:

        | Рядок | Що питаєш |
        |---|---|
        | Поведінка | чи робить зміна те, що обіцяє опис, і в StrictMode теж? |
        | Тести | чи є тест, що впаде, якщо зміну зламати? |
        | Типи | чи не обходить код перевірку типів (`any`, `as`)? |
        | Доступність | чи має кожна кнопка назву, чи доступне все з клавіатури? |
        | Bundle й env | чи не потрапляє в клієнтський код приватне значення? |
        | Відкат | чи можна відкотити зміну без втрати даних людей? |

        Головне — **докази**. «Здається, тут витік» — думка. «`PriceWatch.jsx:12`: ефект підписується без cleanup; після одного повідомлення стрічки в списку два рядки, а після видалення компонента лишаються 2 підписки» — факт, який автор може відтворити й перетворити на тест.
      en: |
        In JS-15 you wrote a defect comment with a concrete case, a question about intent and a decision with a reason. For a React app before a release a checklist is added to that — things the tools will not check by themselves:

        | Row | What you ask |
        |---|---|
        | Behavior | does the change do what its description promises, in StrictMode too? |
        | Tests | is there a test that fails if the change is broken? |
        | Types | does the code get around the type check (`any`, `as`)? |
        | Accessibility | does every button have a name, is everything reachable by keyboard? |
        | Bundle and env | does a private value get into client code? |
        | Rollback | can the change be rolled back without losing people's data? |

        The main thing is **evidence**. “Looks like a leak here” is an opinion. “`PriceWatch.jsx:12`: the effect subscribes without a cleanup; after one message from the feed the list has two rows, and after the component is removed 2 subscriptions remain” is a fact the author can reproduce and turn into a test.

  - id: predict-review-flags
    kind: prediction
    lang: jsx
    runnable: false
    strings:
      priceDrops: { uk: "Знижки на бажане", en: "Price drops" }
    prompt:
      uk: "Pull request «Показувати знижки на бажані речі» додає `config.js` з `export const PRICE_API_KEY = \"placeholder-price-key-41c9\";` і компонент нижче. Застосунок працює в StrictMode, як у шаблоні Vite. Що з цього рецензент має позначити як дефект? Познач усі."
      en: "The pull request “Show price drops for watched wishes” adds `config.js` with `export const PRICE_API_KEY = \"placeholder-price-key-41c9\";` and the component below. The app runs in StrictMode, as in the Vite template. Which of these should a reviewer flag as a defect? Pick all of them."
    code: |
      import { PRICE_API_KEY, PRICE_API_URL } from "./config.js";

      export const sourceUrl = `${PRICE_API_URL}/drops?key=${PRICE_API_KEY}`;

      export default function PriceWatch({ onClose }) {
        const [drops, setDrops] = useState([]);

        useEffect(() => {
          priceFeed.subscribe((drop) => setDrops((current) => [...current, drop]));
        }, []);

        return (
          <section>
            <h2>%%priceDrops%%</h2>
            <button type="button" onClick={onClose}>
              <svg aria-hidden="true">…</svg>
            </button>
            <ul>
              {drops.map((drop, index) => (
                <li key={index}>…</li>
              ))}
            </ul>
          </section>
        );
      }
    answer:
      type: multi
      options:
        - id: no-cleanup
          text: { uk: "Ефект підписується на стрічку й не повертає функцію, що відписує", en: "The effect subscribes to the feed and returns no function that unsubscribes" }
        - id: no-name
          text: { uk: "Кнопка закриття не має доступної назви", en: "The close button has no accessible name" }
        - id: key-in-client
          text: { uk: "Ключ API лежить у модулі, який імпортує клієнтський код", en: "The API key lives in a module that client code imports" }
        - id: names
          text: { uk: "Змінна називається `drops`, а не `priceDrops`", en: "The variable is called `drops`, not `priceDrops`" }
          why:
            uk: "Це смак, а не дефект: назва зрозуміла в контексті. Review про назви без причини лише відволікає від того, що справді зламається."
            en: "This is taste, not a defect: the name is clear in context. A review about names without a reason only distracts from what will really break."
        - id: index-key
          text: { uk: "`key={index}` у списку, який лише доповнюється в кінець", en: "`key={index}` in a list that only grows at the end" }
          why:
            uk: "Для списку, що тільки дописується в кінець і не сортується, індекс стабільний. Ризикованим він стає, коли елементи вставляють, видаляють чи переставляють (RE-01) — тут цього немає."
            en: "For a list that only grows at the end and is never sorted, the index is stable. It becomes risky when items are inserted, removed or reordered (RE-01) — none of which happens here."
      correct: [no-cleanup, no-name, key-in-client]
    explanation:
      uk: "Три дефекти з трьох рядків чеклиста: поведінка (без cleanup StrictMode підписує двічі, і кожна знижка показується двічі), доступність (svg з `aria-hidden`, тож у кнопки немає назви) і bundle (ключ потрапить у bundle разом з `config.js`). У прикладі нижче ти отримаєш доказ для кожного."
      en: "Three defects from three checklist rows: behavior (without a cleanup StrictMode subscribes twice, and every price drop is shown twice), accessibility (the svg has `aria-hidden`, so the button has no name) and bundle (the key reaches the bundle together with `config.js`). In the example you get evidence for each."

  - id: pr-bench
    kind: example
    runtime: browser-react
    dir: pr-bench
    entry: main.jsx
    strings:
      priceDrops: { uk: "Знижки на бажане", en: "Price drops" }
      currency: { uk: "грн", en: "UAH" }
      headphones: { uk: "Навушники", en: "Headphones" }
      evRows: { uk: "Поведінка — рядків після однієї знижки:", en: "Behavior — rows after one price drop:" }
      evName: { uk: "Доступність — назва кнопки закриття:", en: "Accessibility — name of the close button:" }
      evUrl: { uk: "Bundle й env — адреса, яку бачить кожен:", en: "Bundle and env — the address anyone can see:" }
      evListeners: { uk: "Cleanup — підписок після видалення компонента:", en: "Cleanup — subscriptions after the component is removed:" }
    title:
      uk: "Стенд для рев’ю: доказ для кожного рядка"
      en: "A review bench: evidence for every row"
    body:
      uk: |
        Код pull request-а з передбачення — у `PriceWatch.jsx` і `config.js`. `main.jsx` — стенд рецензента: він рендерить компонент у StrictMode, як застосунок, надсилає одну знижку зі стрічки, читає назву кнопки так, як її отримує програма зчитування з екрана (`aria-label` або текст), і прибирає компонент зі сторінки.

        Натисни **Запустити** й прочитай **Консоль**: чотири рядки — чотири докази, які можна вставити в коментарі.
      en: |
        The pull request's code from the prediction is in `PriceWatch.jsx` and `config.js`. `main.jsx` is the reviewer's bench: it renders the component in StrictMode, like the app does, sends one price drop from the feed, reads the button's name the way a screen reader gets it (`aria-label` or text), and removes the component from the page.

        Press **Run** and read the **Console**: four lines — four pieces of evidence you can paste into comments.
    tryIt:
      uk: |
        1. Напиши (на папері чи в нотатках) три коментарі до pull request-а у форматі «файл:рядок — що не так — доказ із консолі». Наприклад: «`PriceWatch.jsx:12` — ефект без cleanup — після однієї знижки 2 рядки, після видалення 2 підписки».
        2. Перевір, що доказ справді вказує на причину. У `PriceWatch.jsx` зроби з рядка `priceFeed.subscribe(…);` рядок `return priceFeed.subscribe(…);` і запусти: рядків — 1, підписок — 0.
        3. Дай кнопці назву: допиши їй атрибут `aria-label="Закрити знижки"`. Запусти — рядок доступності показує назву. Третій дефект кодом стенда не виправити: ключ треба прибрати з клієнтського коду зовсім (RE-11), тому в коментарі досить доказу й прохання.
      en: |
        1. Write (on paper or in notes) three comments on the pull request in the form “file:line — what is wrong — evidence from the console”. For example: “`PriceWatch.jsx:12` — an effect without a cleanup — after one price drop 2 rows, after removal 2 subscriptions”.
        2. Check that the evidence really points at the cause. In `PriceWatch.jsx` turn the line `priceFeed.subscribe(…);` into `return priceFeed.subscribe(…);` and run it: rows — 1, subscriptions — 0.
        3. Give the button a name: add the attribute `aria-label="Close price drops"` to it. Run it — the accessibility line shows the name. The third defect cannot be fixed in the bench's code: the key has to leave the client code altogether (RE-11), so in the comment the evidence and a request are enough.

  - id: budget-alerts-fix
    kind: exercise
    mode: debug
    runtime: browser-react
    dir: budget-alerts-fix
    entry: main.jsx
    editable: [BudgetAlerts.jsx, releaseNotes.js]
    strings:
      alertsTitle: { uk: "Перевищення бюджету", en: "Budget overruns" }
      overBy: { uk: "більше на", en: "over by" }
      currency: { uk: "грн", en: "UAH" }
      food: { uk: "Їжа", en: "Food" }
      transport: { uk: "Транспорт", en: "Transport" }
      feedListeners: { uk: "Підписок на стрічку бюджету:", en: "Budget feed subscriptions:" }
      noteFor: { uk: "Нотатка випуску", en: "Release note" }
      noteEmpty: { uk: "(ще порожня)", en: "(still empty)" }
      goodNote: { uk: "Кожне сповіщення про перевищення бюджету тепер з’являється один раз.", en: "Each budget overrun alert now appears only once." }
      altNote: { uk: "Виправлено: попередження про бюджет більше не повторюються двічі.", en: "Fixed: budget warnings no longer show up twice." }
      codeNote: { uk: "Додано cleanup у useEffect, тепер підписка знімається.", en: "Added a cleanup to useEffect, so the subscription is removed." }
    title:
      uk: "Виправити дефект з рев’ю й написати нотатку випуску"
      en: "Fix a defect from a review and write the release note"
    instructions:
      uk: |
        Рецензент залишив коментар до трекера витрат: «`BudgetAlerts.jsx` — ефект підписується на стрічку бюджету без cleanup. Доказ: у StrictMode одне перевищення показується двома рядками, а після видалення компонента підписки лишаються». Натисни **Запустити**: через пів секунди стрічка надсилає одне перевищення — подивись на сторінку й на число підписок у консолі.

        `main.jsx` лишається зі `<StrictMode>`: виправляй ефект, а не вимикай перевірку. Зроби дві речі:

        1. У `BudgetAlerts.jsx` виправ дефект так, щоб кожне перевищення показувалося **один** раз і після видалення компонента не лишалося **жодної** підписки.
        2. У `releaseNotes.js` напиши `text` — одне речення для людей, що користуються застосунком: що вони помітять у версії 0.4.1. Від 20 до 240 символів, `version` не змінюй. Перевірка відхиляє слова з коду: `useEffect`, `cleanup`, `subscribe`, `listener`, `StrictMode`, `effect`, `React` і зворотні лапки.
      en: |
        A reviewer left a comment on the expense tracker: “`BudgetAlerts.jsx` — the effect subscribes to the budget feed without a cleanup. Evidence: in StrictMode one overrun shows as two rows, and after the component is removed the subscriptions remain”. Press **Run**: half a second later the feed sends one overrun — look at the page and at the number of subscriptions in the console.

        `main.jsx` keeps `<StrictMode>`: fix the effect, do not turn the check off. Do two things:

        1. In `BudgetAlerts.jsx` fix the defect so that every overrun shows **once** and **no** subscription remains after the component is removed.
        2. In `releaseNotes.js` write `text` — one sentence for the people who use the app: what they will notice in version 0.4.1. From 20 to 240 characters; do not change `version`. The check rejects words from the code: `useEffect`, `cleanup`, `subscribe`, `listener`, `StrictMode`, `effect`, `React` and backticks.
    testTitles:
      "each budget alert is shown once":
        uk: "Кожне перевищення бюджету показано один раз (у StrictMode)"
        en: "Each budget alert is shown once (in StrictMode)"
      "no subscription is left after the alerts are removed from the page":
        uk: "Після видалення компонента не лишається жодної підписки"
        en: "No subscription is left after the alerts are removed from the page"
      "the release note is a sentence for people, without code words":
        uk: "Нотатка випуску — речення для людей, без слів із коду"
        en: "The release note is a sentence for people, without code words"
    hints:
      nudge:
        uk: "Що повертає `budgetFeed.subscribe(...)`? І що React робить із функцією, яку повертає ефект, — коли StrictMode перевіряє компонент і коли компонент зникає?"
        en: "What does `budgetFeed.subscribe(...)` return? And what does React do with a function an effect returns — when StrictMode checks the component and when the component goes away?"
      explanation:
        uk: |
          Функція, яку повертає ефект, — його cleanup (RE-03). React викликає її перед повторним запуском ефекту, зокрема під час перевірки StrictMode, і коли компонент зникає. Якщо `subscribe` повертає функцію, що відписує, її і треба віддати React. Схожий приклад з таймером:

          ```jsx
          useEffect(() => {
            const id = setInterval(tick, 1000);
            return () => clearInterval(id);
          }, []);
          ```

          Прапорець у `useRef`, що «не дає підписатися вдруге», приховує подвійний рядок, але підписка переживає компонент.
        en: |
          The function an effect returns is its cleanup (RE-03). React calls it before running the effect again, including during the StrictMode check, and when the component goes away. If `subscribe` returns a function that unsubscribes, that is what you give to React. A similar example with a timer:

          ```jsx
          useEffect(() => {
            const id = setInterval(tick, 1000);
            return () => clearInterval(id);
          }, []);
          ```

          A flag in `useRef` that “prevents subscribing twice” hides the double row, but the subscription outlives the component.
    solutionNote:
      uk: "`subscribe` уже повертає функцію, що відписує, тож ефектові досить її повернути. StrictMode тоді проходить шлях «підписатися → відписатися → підписатися знову» і лишає одну підписку, а видалення компонента знімає й її. Нотатка випуску каже, що змінилося для людини, — те, що вона бачила (подвійні сповіщення), а не те, що змінилося в коді."
      en: "`subscribe` already returns a function that unsubscribes, so the effect only has to return it. StrictMode then goes “subscribe → unsubscribe → subscribe again” and leaves one subscription, and removing the component removes that one too. The release note says what changed for the person — what they saw (double alerts), not what changed in the code."
    feedback:
      - when: { test: "each budget alert is shown once" }
        message:
          uk: "Ця перевірка показує `BudgetAlerts` у StrictMode, надсилає одне перевищення за категорією «Транспорт» і чекає рівно один такий рядок. Два рядки — підписок дві; нуль — компонент відписався ще до того, як стрічка щось надіслала (відписка має бути у функції, яку ефект **повертає**, а не в його тілі)."
          en: "This check shows `BudgetAlerts` in StrictMode, sends one overrun for the category “Transport” and expects exactly one such row. Two rows means two subscriptions; zero means the component unsubscribed before the feed sent anything (unsubscribing belongs in the function the effect **returns**, not in its body)."
      - when: { test: "no subscription is left after the alerts are removed from the page" }
        message:
          uk: "Ця перевірка рахує підписки на стрічку до показу `BudgetAlerts` і після того, як компонент прибрали зі сторінки, і чекає, що їх стало стільки ж. Прапорець, який не дає підписатися вдруге, цього не дає: підписка має зніматися, коли компонент зникає."
          en: "This check counts the feed subscriptions before `BudgetAlerts` is shown and after the component is removed from the page, and expects the same number. A flag that prevents a second subscription does not give this: the subscription has to be removed when the component goes away."
      - when: { test: "the release note is a sentence for people, without code words" }
        message:
          uk: "Ця перевірка чекає в `releaseNote.text` від 20 до 240 символів без слів `useEffect`, `cleanup`, `subscribe`, `listener`, `StrictMode`, `effect`, `React` і без зворотних лапок, а `version` — `\"0.4.1\"`. Напиши, що помітить людина, а не що змінилося в коді."
          en: "This check expects `releaseNote.text` to have 20 to 240 characters without the words `useEffect`, `cleanup`, `subscribe`, `listener`, `StrictMode`, `effect`, `React` and without backticks, and `version` to be `\"0.4.1\"`. Write what a person will notice, not what changed in the code."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: з чого складається корисний review"
      en: "Recall: what a useful review consists of"
    items:
      - id: review-parts
        from: js-15-12-remotes-pr-review
        prompt:
          uk: "Який із цих коментарів до pull request-а найкорисніший?"
          en: "Which of these pull request comments is the most useful?"
        answer:
          type: choice
          options:
            - id: concrete
              text: { uk: "«Для суми 1005 копійок нова версія друкує `10.5 UAH` замість `10.05 UAH`»", en: "“For an amount of 1005 minor units the new version prints `10.5 UAH` instead of `10.05 UAH`”" }
            - id: vague
              text: { uk: "«Щось тут не так із форматуванням, перевір»", en: "“Something is off with the formatting here, please check”" }
              why:
                uk: "Автор не знає, що саме перевіряти й на якому вході. Коментар без конкретного випадку не перетвориш на тест."
                en: "The author does not know what exactly to check or on which input. A comment without a concrete case cannot be turned into a test."
            - id: style
              text: { uk: "«Я б назвав функцію `priceText`»", en: "“I would call the function `priceText`”" }
              why:
                uk: "Це смак. Головне в review — правильність і намір; назва без причини не робить код правильнішим."
                en: "That is taste. What matters in a review is correctness and intent; a name without a reason does not make the code more correct."
          correct: [concrete]
        explanation:
          uk: "Коментар про дефект із конкретним випадком можна перевірити й перетворити на тест. У цьому уроці той самий принцип: доказ — це вхід, вивід і рядок коду, а не враження."
          en: "A defect comment with a concrete case can be checked and turned into a test. This lesson uses the same principle: evidence is an input, an output and a line of code, not an impression."

  - id: readme-and-self-review
    kind: local-task
    runtime: local-web
    title:
      uk: "README, перевірений чистим клоном, і рев’ю власної зміни"
      en: "A README checked with a clean clone, and a review of your own change"
    intro:
      uk: |
        Працюєш у `~/js-course/release-lab` — репозиторії з минулого уроку (у ньому є commit-и й тег `v0.1.0`). Інтернет потрібен лише для `npm ci` у клоні. Команди перевірено на macOS; на Linux вони ті самі.

        **Крок 1 — розділ для `README.md`** (заміни ним текст шаблону або додай на початок). Код і документація проєкту — англійською, як у справжніх командах:

        ```md
        # Release lab

        ## Working with the project

        Requirements: Node.js 22.4 or newer, npm and Git.

        1. Install exactly the versions from the lockfile: `npm ci`
        2. Run the dev server: `npm run dev`, then open http://localhost:5173/
        3. Run the same checks as CI: `npm run lint && npm run typecheck && npm test`
        4. Build: `npm run build` writes `index.html` and hashed files into `dist/`.

        Configuration: `.env` holds public build-time values (`VITE_APP_TITLE`) and is committed.
        Local values go into `.env.local`, which Git ignores. Never put a private value into a
        `VITE_` variable: it ends up in the bundle.
        ```

        **Крок 3 — `docs/review-notes.md`** (шаблон рев’ю, заповни його сам):

        ```md
        # Review of <commit id>: <commit message>

        | Row | Finding | Evidence |
        |---|---|---|
        | Behavior | | |
        | Tests | | |
        | Types | | |
        | Accessibility | | |
        | Bundle and env | | |
        | Rollback | | |

        Decision: approve / request changes, because …
        ```
      en: |
        You work in `~/js-course/release-lab` — the repository from the last lesson (it has commits and the tag `v0.1.0`). Internet access is needed only for `npm ci` in the clone. The commands were checked on macOS; on Linux they are the same.

        **Step 1 — a section for `README.md`** (replace the template's text with it, or add it at the top). The project's code and documentation are in English, as in real teams:

        ```md
        # Release lab

        ## Working with the project

        Requirements: Node.js 22.4 or newer, npm and Git.

        1. Install exactly the versions from the lockfile: `npm ci`
        2. Run the dev server: `npm run dev`, then open http://localhost:5173/
        3. Run the same checks as CI: `npm run lint && npm run typecheck && npm test`
        4. Build: `npm run build` writes `index.html` and hashed files into `dist/`.

        Configuration: `.env` holds public build-time values (`VITE_APP_TITLE`) and is committed.
        Local values go into `.env.local`, which Git ignores. Never put a private value into a
        `VITE_` variable: it ends up in the bundle.
        ```

        **Step 3 — `docs/review-notes.md`** (a review template; fill it in yourself):

        ```md
        # Review of <commit id>: <commit message>

        | Row | Finding | Evidence |
        |---|---|---|
        | Behavior | | |
        | Tests | | |
        | Types | | |
        | Accessibility | | |
        | Bundle and env | | |
        | Rollback | | |

        Decision: approve / request changes, because …
        ```
    tools:
      - name: "Git, Node.js and npm"
        version: "as in the previous lessons (checked with Git 2.51.0, Node.js 25.2.1, npm 11.6.2)"
    steps:
      - text:
          uk: "Запиши розділ README (вміст — у вступі, «Крок 1») і закоміть його."
          en: "Write the README section (contents in the introduction, “Step 1”) and commit it."
        command: "cd ~/js-course/release-lab\ngit add README.md\ngit commit -m \"Document how to install, check and build\""
        expect:
          uk: "`[main …] Document how to install, check and build` і `1 file changed`."
          en: "`[main …] Document how to install, check and build` and `1 file changed`."
      - text:
          uk: "Перевір README чистим клоном: склонуй репозиторій у сусідню теку й пройди кроки README слово в слово. Ти не копіюєш `node_modules` і `.env.local` — у клоні є лише те, що в Git."
          en: "Check the README with a clean clone: clone the repository into a neighbouring folder and follow the README's steps word for word. You do not copy `node_modules` or `.env.local` — the clone has only what is in Git."
        command: "cd ~/js-course\ngit clone release-lab release-lab-check\ncd release-lab-check\nnpm ci\nnpm run lint && npm run typecheck && npm test\nnpm run build"
        expect:
          uk: |
            ```text
            Cloning into 'release-lab-check'...
            done.
            added 112 packages, and audited 113 packages in 844ms
            …
             Test Files  2 passed (2)
            …
            ✓ built in 316ms
            ```

            (`added 111 packages`, якщо ти не зливав оновлення TypeScript.) Кожен крок спрацював без здогадок — README пройшов перевірку. Якщо якийсь крок довелося вгадати, допиши його в README в основній теці й закоміть. Теку `release-lab-check` потім можна видалити.
          en: |
            ```text
            Cloning into 'release-lab-check'...
            done.
            added 112 packages, and audited 113 packages in 844ms
            …
             Test Files  2 passed (2)
            …
            ✓ built in 316ms
            ```

            (`added 111 packages` if you did not merge the TypeScript update.) Every step worked without guessing — the README passed the check. If you had to guess a step, add it to the README in the main folder and commit. You can delete the `release-lab-check` folder afterwards.
      - text:
          uk: "Переглянь власну зміну так, як переглянув би чужу. Обери commit з позначкою випуску (повідомлення «Show the version and commit in the footer»), покажи його diff і заповни `docs/review-notes.md` (шаблон — у вступі, «Крок 3»): для кожного рядка — знахідка або «ok» і доказ (команда та її результат, файл:рядок)."
          en: "Review your own change the way you would review someone else's. Pick the commit with the release stamp (the message “Show the version and commit in the footer”), show its diff and fill in `docs/review-notes.md` (template in the introduction, “Step 3”): for every row — a finding or “ok”, and the evidence (a command and its result, file:line)."
        command: "cd ~/js-course/release-lab\ngit log --oneline\ngit show --stat <commit id>"
        expect:
          uk: "`git show --stat` перелічує змінені файли цього commit-а: `src/App.tsx`, `src/BuildInfo.tsx`, `src/build-info.d.ts`, `vite.config.ts`. Наприклад, рядок «Rollback» може бути таким: «ok — зміна лише додає футер; `git revert` прибере його без впливу на збережені справи». Закоміть нотатки."
          en: "`git show --stat` lists the files changed in that commit: `src/App.tsx`, `src/BuildInfo.tsx`, `src/build-info.d.ts`, `vite.config.ts`. The “Rollback” row, for example, can be: “ok — the change only adds a footer; `git revert` removes it without affecting saved tasks”. Commit the notes."
    verify:
      - id: readme-clone
        text:
          uk: "У чистому клоні кроки README спрацювали без жодної здогадки: `npm ci`, ворота й збирання."
          en: "In a clean clone the README's steps worked without a single guess: `npm ci`, the gates and the build."
      - id: review-written
        text:
          uk: "`docs/review-notes.md` має рядок для кожного пункту чеклиста з доказом і рішення з причиною."
          en: "`docs/review-notes.md` has a row for every checklist item with evidence, and a decision with a reason."
    troubleshooting:
      - problem:
          uk: "`fatal: destination path 'release-lab-check' already exists and is not an empty directory.`"
          en: "`fatal: destination path 'release-lab-check' already exists and is not an empty directory.`"
        fix:
          uk: "Ти вже клонував раніше. Видали стару теку (`rm -rf ~/js-course/release-lab-check`) і склонуй знову — перевіряти треба саме чистий клон."
          en: "You cloned before. Delete the old folder (`rm -rf ~/js-course/release-lab-check`) and clone again — it has to be a clean clone."
      - problem:
          uk: "У клоні заголовок сторінки порожній"
          en: "In the clone the page heading is empty"
        fix:
          uk: "`.env` не потрапив у Git. Перевір `git ls-files .env` в основній теці: якщо нічого не друкує, додай `.env` (у ньому лише публічні значення), закоміть і склонуй знову. Це саме той дефект, який шукає перевірка чистим клоном."
          en: "`.env` did not get into Git. Check `git ls-files .env` in the main folder: if it prints nothing, add `.env` (it holds only public values), commit and clone again. This is exactly the kind of defect a clean-clone check looks for."
    recovery:
      uk: "Клон — окрема тека: що б у ній не сталося, основний `release-lab` не змінюється. Видали `release-lab-check` і склонуй наново."
      en: "The clone is a separate folder: whatever happens in it, the main `release-lab` does not change. Delete `release-lab-check` and clone again."

  - id: to-project
    kind: transfer
    capstoneStep: RE-12
    body:
      uk: "У кроці проєкту наприкінці розділу ти допишеш README свого проєкту тими самими чотирма розділами, перевіриш його чистим клоном і почнеш `docs/release.md` з нотатками випуску 1.0.0."
      en: "In the project step at the end of the unit you add the same four sections to your project's README, check it with a clean clone and start `docs/release.md` with the release notes of 1.0.0."
