id: re-12-09-gate-independent-e2e
unit: RE-12
title:
  uk: "Іспит: покращення, E2E та перевірка артефакту"
  en: "Gate: enhancement, E2E and artifact checks"
kind: assessment
minutes: 45
contentVersion: 1
purpose:
  uk: "Друга частина підсумкового іспиту React. Без підказок ти додаєш до незнайомого проєкту новий маршрут із тестами поведінки й пишеш, як він отримує state і дані, — а потім випускаєш `release-lab` як справжню версію: ворота, перевірка артефакту в браузері, позначка версії, CI, нотатка про оновлення, план кешу й відкату з репетицією та README."
  en: "The second part of the final React gate. Without hints you add a new route with behavioral tests to an unseen project and write how it gets its state and data — and then release `release-lab` as a real version: the gates, an artifact check in a browser, a version stamp, CI, an update note, a cache and rollback plan with a rehearsal, and the README."
objectives:
  - uk: "Без підказок збудувати типізоване покращення незнайомого React-проєкту, доступне з клавіатури, додати перевірку в справжньому браузері й створити та перевірити production-артефакт."
    en: "Build, without hints, a typed and keyboard-accessible enhancement to an unseen React project, add a real-browser end-to-end check, and produce and verify the production artifact."
  - uk: "Написати CI-workflow, версію випуску, нотатку про оновлення залежностей, план кешу й відкату та рев’ю-опис, що пояснює поведінку state і даних написаного коду."
    en: "Write the CI workflow, release version, dependency-update note, cache-and-rollback plan and a review write-up that explains the state and data behavior of the code you wrote."
prerequisites: [re-12-08-gate-unseen-debug]
subskills:
  - { family: R-10, skill: "typed UI", depth: assess }
  - { family: R-10, skill: "accessible routes", depth: assess }
  - { family: R-10, skill: "production artifact verification", depth: assess }
  - { family: R-10, skill: "cumulative explanation", depth: assess }
  - { family: P-06, skill: "CI pipeline reading/design", depth: assess }
  - { family: P-06, skill: "artifact/release version", depth: assess }
  - { family: P-06, skill: "dependency updates", depth: assess }
  - { family: P-06, skill: "static delivery/cache/rollback", depth: assess }
  - { family: P-06, skill: "docs and review", depth: assess }
glossary: []
selfCheck: [category-route]

blocks:
  - id: gate-rules
    kind: explanation
    title:
      uk: "Дві частини, одна вимога: доказ"
      en: "Two parts, one requirement: evidence"
    body:
      uk: |
        - **Частина 1** — на платформі: трекер витрат, до якого ти додаєш сторінку категорії. Перевірки дивляться на сторінку очима людини з клавіатурою й запускають твої тести проти кількох версій сторінки.
        - **Частина 2** — у VS Code: ти випускаєш `release-lab` як версію 0.2.0 і доводиш кожен пункт файлом чи командою з результатом.

        Підказок немає. Типи в частині 1 пиши так, як у RE-09, — пісочниця їх лише стирає, тож за них відповідаєш ти; у частині 2 їх перевіряє `npm run typecheck`. Знадобляться RE-05 (маршрути й фокус), RE-06 і RE-08 (тести поведінки), RE-09 (типи) і весь цей розділ.
      en: |
        - **Part 1** is on the platform: an expense tracker to which you add a category page. The checks look at the page through the eyes of a keyboard user and run your tests against several versions of the page.
        - **Part 2** is in VS Code: you release `release-lab` as version 0.2.0 and prove every item with a file or a command and its result.

        There are no hints. Write the types in part 1 as in RE-09 — the sandbox only strips them, so they are your responsibility; in part 2 `npm run typecheck` checks them. You will need RE-05 (routes and focus), RE-06 and RE-08 (behavior tests), RE-09 (types) and this whole unit.

  - id: category-route
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-react
    dir: category-route
    entry: main.jsx
    editable: [CategoryPage.tsx, ExpensesPage.tsx, CategoryPage.test.jsx, writeup.js]
    strings:
      appName: { uk: "Трекер витрат", en: "Expense tracker" }
      mainNav: { uk: "Головне меню", en: "Main menu" }
      allExpenses: { uk: "Усі витрати", en: "All expenses" }
      currency: { uk: "грн", en: "UAH" }
      total: { uk: "Разом", en: "Total" }
      notFound: { uk: "Категорію не знайдено", en: "Category not found" }
      backToList: { uk: "До всіх витрат", en: "Back to all expenses" }
      food: { uk: "Їжа", en: "Food" }
      transport: { uk: "Транспорт", en: "Transport" }
      home: { uk: "Дім", en: "Home" }
      fun: { uk: "Розваги", en: "Fun" }
      e1: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      e2: { uk: "Проїзний", en: "Transit pass" }
      e3: { uk: "Кава з друзями", en: "Coffee with friends" }
      e4: { uk: "Лампочки", en: "Light bulbs" }
      e5: { uk: "Квитки в кіно", en: "Cinema tickets" }
      e6: { uk: "Обід", en: "Lunch" }
      tTotal: { uk: "сторінка категорії показує її суму й лише її витрати", en: "a category page shows its total and only its expenses" }
      tUnknown: { uk: "невідома категорія показує «не знайдено» й шлях назад", en: "an unknown category shows not found and a way back" }
      tSwitch: { uk: "перехід до іншої категорії показує нову", en: "moving to another category shows the new one" }
      mRows: { uk: "рядки витрат", en: "expense rows" }
      mBack: { uk: "адреса посилання назад", en: "address of the back link" }
      mHeading: { uk: "заголовок сторінки", en: "page heading" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rNotFound: { uk: "на екрані немає", en: "not on the screen:" }
      rStillMissing: { uk: "так і не з’явилося", en: "never appeared" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Сторінка категорії: маршрут, фокус, тести й опис"
      en: "A category page: route, focus, tests and a write-up"
    instructions:
      uk: |
        Трекер витрат має список «Усі витрати» на `/expenses`. У таблиці маршрутів уже є рядок `/categories/:id`: він показує `CategoryPage` через `CategoryRoute.jsx` (через нього перевірки підставляють інші версії сторінки). Дані й типи — у `expensesData.ts`, маршрутизатор курсу — у `router.jsx`. Змінювати можна `CategoryPage.tsx`, `ExpensesPage.tsx`, `CategoryPage.test.jsx` і `writeup.js`.

        Готовий результат:

        - у списку «Усі витрати» назва категорії кожної витрати — посилання на `/categories/<id>` її категорії;
        - `/categories/<id>` показує заголовок `<h1>` з назвою категорії, рядок «Разом: 1056.00 грн» (сума `amountMinor` лише цієї категорії) і лише її витрати;
        - після переходу на сторінку категорії фокус стоїть на її заголовку, а `document.title` містить назву категорії; під час першого відкриття сторінки за адресою фокус не переноситься;
        - невідома категорія (`/categories/rent`) показує заголовок «Категорію не знайдено» й посилання на `/expenses`;
        - перехід з однієї категорії на іншу без зміни сторінки (`history.push`) показує нову категорію;
        - пиши типи для того, що вводиш сам, як у RE-09 (пісочниця їх не перевіряє);
        - `CategoryPage.test.jsx` — щонайменше три тести поведінки через `renderApp(path)` з `testApp.jsx`. Перевірки запускають їх з правильною сторінкою і з трьома зламаними: з неправильною сумою, з порожнім екраном для невідомої категорії і зі сторінкою, що лишає першу категорію після переходу. Кожну зламану твої тести мають помітити;
        - `writeup.js` — опис для рев’ю: звідки сторінка бере state і дані й чому вони не застарівають після переходу. Щонайменше два речення й 120 символів, з назвами `useParams` і `amountMinor`.
      en: |
        The expense tracker has the list “All expenses” at `/expenses`. The route table already has a row `/categories/:id`: it shows `CategoryPage` through `CategoryRoute.jsx` (through it the checks put in other versions of the page). Data and types are in `expensesData.ts`, the course router is in `router.jsx`. You may change `CategoryPage.tsx`, `ExpensesPage.tsx`, `CategoryPage.test.jsx` and `writeup.js`.

        The finished result:

        - in the list “All expenses” the category name of every expense is a link to `/categories/<id>` of its category;
        - `/categories/<id>` shows an `<h1>` heading with the category name, the line “Total: 1056.00 UAH” (the sum of `amountMinor` of this category only) and only its expenses;
        - after navigating to a category page, focus is on its heading, and `document.title` contains the category name; when the page is first opened at its address, focus is not moved;
        - an unknown category (`/categories/rent`) shows the heading “Category not found” and a link to `/expenses`;
        - moving from one category to another without leaving the page (`history.push`) shows the new category;
        - write types for what you introduce yourself, as in RE-09 (the sandbox does not check them);
        - `CategoryPage.test.jsx` — at least three behavior tests through `renderApp(path)` from `testApp.jsx`. The checks run them with a correct page and with three broken ones: with a wrong total, with an empty screen for an unknown category, and with a page that keeps the first category after a move. Your tests must notice each broken one;
        - `writeup.js` — a write-up for the review: where the page gets its state and data from, and why they do not go stale after a move. At least two sentences and 120 characters, naming `useParams` and `amountMinor`.
    testTitles:
      "the expenses list links every category to its page":
        uk: "Список витрат веде посиланням на сторінку кожної категорії"
        en: "The expenses list links every category to its page"
      "a category page shows its name, its total and only its expenses":
        uk: "Сторінка категорії показує назву, суму й лише свої витрати"
        en: "A category page shows its name, its total and only its expenses"
      "following a category link moves focus to the new heading and sets the title":
        uk: "Перехід за посиланням переносить фокус на заголовок і змінює назву вкладки"
        en: "Following a category link moves focus to the new heading and sets the title"
      "the first open of a category page leaves focus where it was":
        uk: "Перше відкриття сторінки категорії не переносить фокус"
        en: "The first open of a category page leaves focus where it was"
      "an unknown category shows a not-found heading with a way back":
        uk: "Невідома категорія показує «не знайдено» й шлях назад"
        en: "An unknown category shows a not-found heading with a way back"
      "moving from one category to another shows the new one":
        uk: "Перехід з однієї категорії на іншу показує нову"
        en: "Moving from one category to another shows the new one"
      "your tests pass with a correct category page":
        uk: "Твої тести (щонайменше три) проходять із правильною сторінкою"
        en: "Your tests (at least three) pass with a correct category page"
      "your tests fail with a page whose total is wrong":
        uk: "Твої тести не проходять зі сторінкою з неправильною сумою"
        en: "Your tests fail with a page whose total is wrong"
      "your tests fail with a page that shows nothing for an unknown category":
        uk: "Твої тести не проходять зі сторінкою, що для невідомої категорії не показує нічого"
        en: "Your tests fail with a page that shows nothing for an unknown category"
      "your tests fail with a page that keeps the first category after moving to another":
        uk: "Твої тести не проходять зі сторінкою, що лишає першу категорію після переходу"
        en: "Your tests fail with a page that keeps the first category after moving to another"
      "the write-up explains state and data in at least two sentences":
        uk: "Опис для рев’ю — щонайменше два речення з `useParams` і `amountMinor`"
        en: "The write-up has at least two sentences naming `useParams` and `amountMinor`"
    solutionNote:
      uk: |
        - **Дані:** категорія, її витрати й сума обчислюються під час рендеру з параметра маршруту, а не копіюються в `useState`. Тому перехід `/categories/food` → `/categories/fun` (той самий шаблон маршруту, той самий змонтований компонент) одразу показує нову категорію.
        - **Фокус:** як в `ExpensesPage` — заголовок з `tabIndex={-1}` і `ref`, `focus()` в ефекті, коли `action` не `"initial"`. Залежність від назви категорії переносить фокус і після переходу між категоріями.
        - **Не знайдено:** відсутній запис — звичайний стан, а не порожній екран: заголовок і посилання назад.
        - **Тести:** сума конкретної категорії, невідома категорія й перехід через `history.push` — по тесту на кожну поведінку, яку легко зламати.
      en: |
        - **Data:** the category, its expenses and the total are computed during render from the route parameter, not copied into `useState`. That is why the move `/categories/food` → `/categories/fun` (the same route pattern, the same mounted component) shows the new category at once.
        - **Focus:** as in `ExpensesPage` — a heading with `tabIndex={-1}` and a `ref`, `focus()` in an effect when `action` is not `"initial"`. A dependency on the category name moves focus after a move between categories too.
        - **Not found:** a missing record is an ordinary state, not an empty screen: a heading and a link back.
        - **Tests:** the total of a particular category, an unknown category and a move through `history.push` — one test for every behavior that is easy to break.
    feedback:
      - when: { test: "a category page shows its name, its total and only its expenses" }
        message:
          uk: "Ця перевірка відкриває `/categories/food` і чекає `<h1>` «Їжа», текст «Разом: 1056.00 грн» і рівно два рядки витрат — «Продукти на тиждень» і «Обід». Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check opens `/categories/food` and expects the `<h1>` “Food”, the text “Total: 1056.00 UAH” and exactly two expense rows — “Weekly groceries” and “Lunch”. If every check fails at once, fix the first error in the console first."
      - when: { test: "your tests pass with a correct category page" }
        message:
          uk: "Ця перевірка запускає твої тести з правильною сторінкою й чекає щонайменше три тести, що всі проходять. Повідомлення тесту, що не пройшов, — у тексті цієї перевірки."
          en: "This check runs your tests with a correct page and expects at least three tests, all passing. The message of a failing test is in the text of this check."
      - when: { test: "your tests fail with a page whose total is wrong" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб твої тести проходили з правильною сторінкою. Потім вона підставляє сторінку, чий рядок «Разом» показує неправильну суму."
          en: "This check first requires your tests to pass with a correct page. Then it puts in a page whose “Total” line shows a wrong amount."
      - when: { test: "your tests fail with a page that shows nothing for an unknown category" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб твої тести проходили з правильною сторінкою. Потім вона підставляє сторінку, що для невідомої категорії не показує нічого."
          en: "This check first requires your tests to pass with a correct page. Then it puts in a page that shows nothing for an unknown category."
      - when: { test: "your tests fail with a page that keeps the first category after moving to another" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб твої тести проходили з правильною сторінкою. Потім вона підставляє сторінку, що після `history.push` на іншу категорію показує попередню."
          en: "This check first requires your tests to pass with a correct page. Then it puts in a page that shows the previous category after `history.push` to another one."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: що вимагає рубрика CP-RE"
      en: "Recall: what the CP-RE rubric asks for"
    items:
      - id: rubric-rows
        from: re-08-02-what-the-checkpoint-checks
        prompt:
          uk: "Ти запустив React-версію свого проєкту й руками додав, змінив і видалив запис — усе працює. Які рядки рубрики CP-RE це закриває?"
          en: "You started the React version of your project and added, edited and deleted a record by hand — everything works. Which rows of the CP-RE rubric does this close?"
        answer:
          type: choice
          options:
            - id: none
              text: { uk: "Жодного повністю: кожен рядок закриває свій доказ — тести, `tsc`, тест cleanup під StrictMode, прохід із клавіатури, дані CP-JS", en: "None completely: every row is closed by its own evidence — tests, `tsc`, a cleanup test under StrictMode, a keyboard walk-through, the CP-JS data" }
            - id: behavior
              text: { uk: "«Поведінку»: я ж бачив правильний результат", en: "“Behavior”: I did see the right result" }
              why:
                uk: "Доказ рядка «Поведінка» — тести дій користувача, які можна повторити (`npm test` з кодом `0`), а не одне враження."
                en: "The evidence for the “Behavior” row is user-action tests that can be repeated (`npm test` with code `0`), not one impression."
            - id: all
              text: { uk: "Усі: якщо застосунок працює, решта неважлива", en: "All of them: if the app works, the rest does not matter" }
              why:
                uk: "Один доказ не закриває інший: робочий CRUD нічого не каже про типи, cleanup чи клавіатуру."
                en: "One piece of evidence does not close another: working CRUD says nothing about types, cleanup or the keyboard."
          correct: [none]
        explanation:
          uk: "Ця частина іспиту влаштована так само: кожен пункт випуску закривається своїм файлом чи командою з результатом."
          en: "This part of the gate works the same way: every release item is closed by its own file or command with its result."

  - id: release-gate
    kind: local-task
    runtime: local-web
    title:
      uk: "Частина 2: випустити release-lab 0.2.0"
      en: "Part 2: release release-lab 0.2.0"
    intro:
      uk: |
        Працюєш у `~/js-course/release-lab`, на гілці `main`, після уроків цього розділу (там є тести, `ci.yml`, позначка версії, сценарій `docs/e2e-walkthrough.md` і тег `v0.1.0`). Без підказок: що зробити — нижче; як — ти вже робив у цьому розділі. Збережи результат перевірки кожного пункту у файлах `docs/`.

        **Що має бути наприкінці:**

        1. **Ворота й тип:** `npm run lint && npm run typecheck && npm test && npm run build` зелені.
        2. **Версія:** тег `v0.2.0` створено командою `npm version`, і віддана збірка показує в футері `0.2.0` та id commit-а цього тегу.
        3. **Перевірка артефакту:** `docs/e2e-walkthrough.md` пройдено наново на preview-сервері для 0.2.0, з результатами кожного кроку, і `grep -rl "placeholder-private-7f3a" dist` нічого не друкує.
        4. **CI:** `.github/workflows/ci.yml` запускає ті самі ворота, що й пункт 1, у тому самому порядку; кожен його `run:` ти виконав локально.
        5. **Оновлення залежностей:** `docs/dependency-updates.md` — що показав `npm outdated` сьогодні, яке оновлення ти робив чи вирішив не робити (наприклад, TypeScript 7 з уроку про версії), чому і як його відкотити.
        6. **Кеш і відкат:** `docs/release.md` — правила `Cache-Control` для `index.html` і для файлів з хешем; де лежать артефакти 0.1.0 і 0.2.0; кроки відкату; запис **проведеної** репетиції: віддати 0.1.0, перевірити футер і дані, повернути 0.2.0. Теку з артефактами не додавай у Git.
        7. **Документація й рев’ю:** README описує версію й відкат; `docs/review-notes.md` містить рев’ю змін цього випуску за чеклистом з уроку «Документація й рев’ю».
      en: |
        You work in `~/js-course/release-lab`, on the `main` branch, after this unit's lessons (it has tests, `ci.yml`, a version stamp, the scenario `docs/e2e-walkthrough.md` and the tag `v0.1.0`). Without hints: what to do is below; how — you have already done it in this unit. Keep the result of checking every item in files under `docs/`.

        **What there has to be at the end:**

        1. **Gates and types:** `npm run lint && npm run typecheck && npm test && npm run build` are green.
        2. **Version:** the tag `v0.2.0` is created with `npm version`, and the served build shows `0.2.0` and the commit id of that tag in the footer.
        3. **Artifact check:** `docs/e2e-walkthrough.md` is walked through again on the preview server for 0.2.0, with the result of every step, and `grep -rl "placeholder-private-7f3a" dist` prints nothing.
        4. **CI:** `.github/workflows/ci.yml` runs the same gates as item 1, in the same order; you ran every one of its `run:` steps locally.
        5. **Dependency updates:** `docs/dependency-updates.md` — what `npm outdated` showed today, which update you made or decided not to make (for example TypeScript 7 from the versions lesson), why, and how to revert it.
        6. **Cache and rollback:** `docs/release.md` — the `Cache-Control` rules for `index.html` and for the hashed files; where the artifacts of 0.1.0 and 0.2.0 live; the rollback steps; a record of a rollback rehearsal you **actually did**: serve 0.1.0, check the footer and the data, bring 0.2.0 back. Do not add the folder with the artifacts to Git.
        7. **Docs and review:** the README describes the version and the rollback; `docs/review-notes.md` holds a review of this release's changes against the checklist of the lesson “Docs and review”.
    tools:
      - name: "Node.js, npm, Git, Vite"
        version: "as in the previous lessons (checked with Node.js 25.2.1, Vite 8.3.2, Git 2.51.0)"
      - name: "Google Chrome"
        version: "current desktop version"
    steps:
      - text:
          uk: "Переконайся, що стартуєш з чистого `main`, і що тег попереднього випуску на місці."
          en: "Make sure you start from a clean `main` and that the previous release's tag is in place."
        command: "cd ~/js-course/release-lab\ngit switch main\ngit status --short\ngit tag"
        expect:
          uk: "`git status --short` нічого не друкує, а `git tag` показує `v0.1.0`."
          en: "`git status --short` prints nothing, and `git tag` shows `v0.1.0`."
      - text:
          uk: "Зроби сім пунктів зі вступу. Порядок обираєш сам. Одна підказка про інструмент, а не про розв’язок: `vite preview` віддає будь-яку теку з готовою збіркою, якщо передати її через `--outDir`, — так само на тому самому порту 4173, тобто з тим самим сховищем. І одна умова: артефакт 0.1.0 у попередніх уроках ніде не зберігся, тож його доведеться один раз зібрати з тегу `v0.1.0` — далі відкат віддає вже цю збережену копію."
          en: "Do the seven items from the introduction. You choose the order. One note about the tool, not about the solution: `vite preview` serves any folder with a finished build if you pass it with `--outDir` — on the same port 4173, that is, with the same storage. And one condition: the 0.1.0 artifact was not kept anywhere in the earlier lessons, so you have to build it once from the tag `v0.1.0` — from then on a rollback serves that kept copy."
        command: "npx vite preview --outDir <folder with a build>"
        expect:
          uk: "Сервер друкує `➜  Local:   http://localhost:4173/` і віддає саме ту збірку: футер показує її версію."
          en: "The server prints `➜  Local:   http://localhost:4173/` and serves exactly that build: the footer shows its version."
      - text:
          uk: "Наприкінці перевір себе тими самими командами, якими перевірятиме рецензент, і закоміть документи."
          en: "At the end check yourself with the same commands a reviewer will use, and commit the documents."
        command: "npm run lint && npm run typecheck && npm test && npm run build\ngrep -rl \"placeholder-private-7f3a\" dist\ngit log --oneline --decorate -3\ngit status --short"
        expect:
          uk: "Ворота зелені; `grep` нічого не друкує; `git log` показує тег `v0.2.0`; `git status --short` порожній — усі документи закомічено, а теки з артефактами в Git немає."
          en: "The gates are green; `grep` prints nothing; `git log` shows the tag `v0.2.0`; `git status --short` is empty — all documents are committed, and the folder with the artifacts is not in Git."
    verify:
      - id: gates-version
        text:
          uk: "Ворота зелені, тег `v0.2.0` створено, і віддана збірка показує `0.2.0` з id commit-а тегу."
          en: "The gates are green, the tag `v0.2.0` exists, and the served build shows `0.2.0` with the tag's commit id."
      - id: e2e-artifact
        text:
          uk: "Я пройшов сценарій `docs/e2e-walkthrough.md` на preview-сервері для 0.2.0 і записав результати; приватного значення в `dist` немає."
          en: "I walked through `docs/e2e-walkthrough.md` on the preview server for 0.2.0 and wrote down the results; there is no private value in `dist`."
      - id: ci-deps
        text:
          uk: "Кожен `run:` у `ci.yml` я виконав локально, а `docs/dependency-updates.md` описує рішення щодо оновлення й шлях відкату."
          en: "I ran every `run:` of `ci.yml` locally, and `docs/dependency-updates.md` describes the update decision and the way back."
      - id: rollback-rehearsed
        text:
          uk: "Я справді відрепетирував відкат: віддав 0.1.0, перевірив футер і дані, повернув 0.2.0 — і записав це в `docs/release.md` разом із правилами кешу."
          en: "I really rehearsed the rollback: served 0.1.0, checked the footer and the data, brought 0.2.0 back — and wrote it into `docs/release.md` together with the cache rules."
      - id: docs-review
        text:
          uk: "README описує версію й відкат, а `docs/review-notes.md` має рев’ю змін випуску за чеклистом."
          en: "The README describes the version and the rollback, and `docs/review-notes.md` has a review of the release's changes against the checklist."
    troubleshooting:
      - problem:
          uk: "`npm error Git working directory not clean.`"
          en: "`npm error Git working directory not clean.`"
        fix:
          uk: "`npm version` робить commit сам і вимагає, щоб змінених відстежуваних файлів не було. `git status --short` покаже, що закомітити перед ним."
          en: "`npm version` makes a commit itself and requires that no tracked files are changed. `git status --short` shows what to commit before it."
    recovery:
      uk: "Тег `v0.1.0` і commit-и попередніх уроків нікуди не діваються: `git switch --detach v0.1.0` покаже стан першого випуску, а `git switch main` поверне тебе назад. Тека з артефактами — копії `dist`, які ти вже перевірив: бережи їх. Зібрати артефакт знову з тегу можна, але це повільний запасний шлях, і результат доведеться перевіряти наново."
      en: "The tag `v0.1.0` and the earlier lessons' commits do not go anywhere: `git switch --detach v0.1.0` shows the state of the first release, and `git switch main` brings you back. The folder with the artifacts holds copies of `dist` you have already checked: keep them. An artifact can be built again from its tag, but that is the slow fallback, and the result has to be checked all over again."
