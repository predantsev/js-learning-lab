          en: "Build the production version and look at what came out."
        command: "npm run build\nls dist dist/assets"
        expect:
          uk: |
            ```text
            > release-lab@0.0.0 build
            > tsc -b && vite build

            vite v8.3.2 building client environment for production...
            …
            dist/index.html                   0.46 kB │ gzip:  0.29 kB
            dist/assets/index-DGNrK5qb.css    1.78 kB │ gzip:  0.81 kB
            dist/assets/Stats-DTm_fCmj.js     0.16 kB │ gzip:  0.16 kB
            dist/assets/index-BIrlHGyo.js   222.30 kB │ gzip: 69.68 kB

            ✓ built in 305ms
            ```

            Спершу `tsc -b` перевіряє типи, і лише потім `vite build` збирає. Літери після дефіса в тебе можуть бути іншими, якщо встановилися інші версії пакетів. Відкрий `dist/index.html`: там є `<script type="module" crossorigin src="/assets/index-BIrlHGyo.js">` і `<link rel="stylesheet" … href="/assets/index-DGNrK5qb.css">` — HTML знає файли за назвами з хешем. Файла `Stats` в `index.html` немає: його попросить сам bundle, коли ти натиснеш «Show stats». Ще `ls` показує в `dist` файли `favicon.svg` і `icons.svg`: Vite скопіював їх із теки `public` як є — без хешу в назві.
          en: |
            ```text
            > release-lab@0.0.0 build
            > tsc -b && vite build

            vite v8.3.2 building client environment for production...
            …
            dist/index.html                   0.46 kB │ gzip:  0.29 kB
            dist/assets/index-DGNrK5qb.css    1.78 kB │ gzip:  0.81 kB
            dist/assets/Stats-DTm_fCmj.js     0.16 kB │ gzip:  0.16 kB
            dist/assets/index-BIrlHGyo.js   222.30 kB │ gzip: 69.68 kB

            ✓ built in 305ms
            ```

            First `tsc -b` checks the types, and only then `vite build` builds. The letters after the dash may be different for you if other package versions were installed. Open `dist/index.html`: it has `<script type="module" crossorigin src="/assets/index-BIrlHGyo.js">` and `<link rel="stylesheet" … href="/assets/index-DGNrK5qb.css">` — the HTML knows the files by their hashed names. The `Stats` file is not in `index.html`: the bundle itself asks for it when you press “Show stats”. `ls` also shows the files `favicon.svg` and `icons.svg` in `dist`: Vite copied them from the `public` folder as they are — without a hash in the name.
      - text:
          uk: "Пошукай обидва значення в тексті зібраних файлів. `grep -rl` друкує назви файлів, де знайшовся текст, і нічого — якщо не знайшовся. У Windows PowerShell замість нього: `Select-String -Path dist\\assets\\*.js -Pattern \"Release lab\" -List` (не перевірено)."
          en: "Search for both values in the text of the built files. `grep -rl` prints the names of the files where the text was found, and nothing if it was not. In Windows PowerShell use instead: `Select-String -Path dist\\assets\\*.js -Pattern \"Release lab\" -List` (not checked)."
        command: "grep -rl \"Release lab\" dist\ngrep -rl \"placeholder-private-7f3a\" dist"
        expect:
          uk: |
            ```text
            dist/assets/index-BIrlHGyo.js
            ```

            Перший пошук знаходить головний bundle — публічний заголовок там, як і має бути. Другий не друкує нічого: приватне значення в `dist` не потрапило. Запиши обидва результати й назви файлів.
          en: |
            ```text
            dist/assets/index-BIrlHGyo.js
            ```

            The first search finds the main bundle — the public heading is there, as it should be. The second prints nothing: the private value did not reach `dist`. Write down both results and the file names.
      - text:
          uk: "Тепер подивись, як стається витік. У `.env.local` заміни `SYNC_API_KEY=` на `VITE_SYNC_API_KEY=`. У `src/App.tsx` під рядком `const STORAGE_KEY = …` додай рядок `console.info(\"sync key:\", import.meta.env.VITE_SYNC_API_KEY);`. Збери й пошукай знову."
          en: "Now see how a leak happens. In `.env.local` replace `SYNC_API_KEY=` with `VITE_SYNC_API_KEY=`. In `src/App.tsx`, under the line `const STORAGE_KEY = …`, add the line `console.info(\"sync key:\", import.meta.env.VITE_SYNC_API_KEY);`. Build and search again."
        command: "npm run build\ngrep -rl \"placeholder-private-7f3a\" dist"
        expect:
          uk: "Тепер пошук знаходить головний bundle (з новою назвою — вміст же змінився, наприклад `dist/assets/index-B33FkLr7.js`). Нову назву отримав і файл `Stats` (у нас — `Stats-2Y3n4utf.js`), хоч `Stats.tsx` ти не чіпав: його текст імпортує головний bundle за назвою з хешем, тож змінився й він. Ні `tsc`, ні збирання не попередили про ключ: для них це звичайний публічний текст. Перевіряти, що в bundle немає приватного, — твоя робота."
          en: "Now the search finds the main bundle (with a new name — the contents changed, for example `dist/assets/index-B33FkLr7.js`). The `Stats` file got a new name too (for us, `Stats-2Y3n4utf.js`), although you did not touch `Stats.tsx`: its text imports the main bundle by its hashed name, so it changed as well. Neither `tsc` nor the build warned you about the key: to them it is ordinary public text. Checking that nothing private is in the bundle is your job."
      - text:
          uk: "Прибери витік: видали доданий рядок `console.info` з `App.tsx`, поверни в `.env.local` назву `SYNC_API_KEY`, збери ще раз і переконайся, що другий пошук знову нічого не друкує."
          en: "Remove the leak: delete the added `console.info` line from `App.tsx`, put the name `SYNC_API_KEY` back in `.env.local`, build once more and make sure the second search prints nothing again."
        command: "npm run build\ngrep -rl \"placeholder-private-7f3a\" dist"
        expect:
          uk: "Порожній результат, а головний bundle знову називається `index-BIrlHGyo.js` (або так, як він називався в тебе на кроці 4): той самий вміст — та сама назва."
          en: "An empty result, and the main bundle is called `index-BIrlHGyo.js` again (or whatever it was called for you in step 4): the same contents — the same name."
