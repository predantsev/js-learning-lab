id: re-12-01-production-build-env
unit: RE-12
title:
  uk: "Production-бандл, ресурси й межі env"
  en: "Production bundle, assets and env boundaries"
kind: local-task
minutes: 15
contentVersion: 1
purpose:
  uk: "Досі React-код цього розділу працював у пісочниці платформи. Людям же віддають не вихідні модулі, а production-збірку. У цьому уроці ти вперше збереш React-застосунок на своєму комп’ютері, роздивишся, з чого складається результат, і перевіриш пошуком у самому bundle, яке значення з `.env` туди потрапило, а яке ні."
  en: "So far the React code of this stage ran in the platform's sandbox. People, though, are given a production build, not the source modules. In this lesson you build a React app on your own computer for the first time, look at what the result consists of, and check by searching the bundle itself which value from `.env` got into it and which did not."
objectives:
  - uk: "Створити локально production-збірку застосунку й назвати в ній HTML-вхід, JS- і CSS-файли з хешем вмісту та відмінності від dev-сервера."
    en: "Produce a production build of the app locally and identify the HTML entry, the content-hashed JS and CSS assets and what differs from the dev server."
  - uk: "Показати, які значення env вписуються в bundle під час збирання, і переконатися, що приватне значення туди не потрапило."
    en: "Show which env values are inlined at build time and confirm that no private value reaches the bundle."
prerequisites: [js-15-06-build-env-sourcemaps, re-10-01-lazy-suspense]
subskills:
  - { family: P-06, skill: "production bundle/assets/env boundaries", depth: intro }
glossary: [production-build, content-hash, build-time-variable]
selfCheck: [predict-what-ships]

blocks:
  - id: dev-versus-build
    kind: explanation
    title:
      uk: "Dev-сервер і production-збірка"
      en: "The dev server and the production build"
    body:
      uk: |
        У JS-15 ти збирав сторінку esbuild-ом: `src/main.mjs` і його `import` ставали одним `dist/app.js`. React-проєкти зазвичай створюють інструментом **Vite** — він робить те саме, але має два режими:

        | | `npm run dev` | `npm run build` |
        |---|---|---|
        | Що робить | сервер на `localhost:5173` перетворює твої `.tsx` на JavaScript у ту мить, коли браузер їх просить | один раз пише готові файли в `dist` і завершується |
        | Файли | по одному на модуль, з назвами як у тебе | кілька стиснутих файлів |
        | Після зміни коду | сторінка оновлюється сама | треба зібрати знову |

        Результат другої команди — [[production-build|production-збірка]]: `dist/index.html` і тека `dist/assets` з файлами на кшталт `index-BIrlHGyo.js`. Літери після дефіса — [[content-hash|хеш вмісту]]: вони обчислені з тексту файла й змінюються, щойно змінюється вміст. Lazy-компонент із RE-10 отримує власний файл: його код браузер попросить лише тоді, коли компонент уперше рендериться.

        Людям віддають саме `dist`. Тому все, що там лежить, — публічне.
      en: |
        In JS-15 you built a page with esbuild: `src/main.mjs` and its `import`s became a single `dist/app.js`. React projects are usually created with a tool called **Vite** — it does the same, but has two modes:

        | | `npm run dev` | `npm run build` |
        |---|---|---|
        | What it does | a server on `localhost:5173` turns your `.tsx` files into JavaScript at the moment the browser asks for them | writes finished files into `dist` once and exits |
        | Files | one per module, named as yours are | a few minified files |
        | After a code change | the page updates by itself | you have to build again |

        The result of the second command is a [[production-build]]: `dist/index.html` and the folder `dist/assets` with files like `index-BIrlHGyo.js`. The letters after the dash are a [[content-hash]]: they are computed from the file's text and change as soon as the contents change. The lazy component from RE-10 gets a file of its own: the browser asks for its code only when the component first renders.

        What people receive is `dist`. So everything in it is public.

  - id: env-boundary
    kind: explanation
    title:
      uk: "Які значення з .env потрапляють у bundle"
      en: "Which values from .env reach the bundle"
    body:
      uk: |
        У JS-15 `define` в `build.mjs` вписував `APP_TITLE` просто в текст `dist/app.js`. Vite робить так само з виразами `import.meta.env.VITE_…` — це [[build-time-variable|змінні часу збирання]]:

        ```tsx
        <h1>{import.meta.env.VITE_APP_TITLE}</h1>
        ```

        Якщо у файлі `.env` є рядок `VITE_APP_TITLE=Release lab`, у зібраному JS на місці виразу стоїть текст `Release lab`. Правила, які ми перевірили на Vite 8.3.2:

        - Значення з префіксом `VITE_`, яке код **читає**, вписується в bundle — кожен може знайти його в DevTools.
        - Значення **без** префікса в клієнтський код не потрапляє: `import.meta.env.SYNC_API_KEY` у bundle стає `undefined`.
        - Значення з `VITE_`, яке код не читає, у bundle теж немає.

        Отже, префікс вирішує, що піде **в bundle**. А `.gitignore` вирішує, що піде **в історію Git**. Це дві різні межі. Шаблон Vite ігнорує файли `*.local`, але не `.env` — тож локальні значення клади в `.env.local`. А справжній секрет не належить клієнтському коду взагалі: його місце на сервері (RE-11).
      en: |
        In JS-15 `define` in `build.mjs` wrote `APP_TITLE` right into the text of `dist/app.js`. Vite does the same with the expressions `import.meta.env.VITE_…` — these are [[build-time-variable|build-time variables]]:

        ```tsx
        <h1>{import.meta.env.VITE_APP_TITLE}</h1>
        ```

        If the file `.env` has the line `VITE_APP_TITLE=Release lab`, the built JS has the text `Release lab` in place of the expression. The rules we checked on Vite 8.3.2:

        - A value with the `VITE_` prefix that the code **reads** is written into the bundle — anyone can find it in DevTools.
        - A value **without** the prefix does not reach client code: `import.meta.env.SYNC_API_KEY` becomes `undefined` in the bundle.
        - A `VITE_` value the code does not read is not in the bundle either.

        So the prefix decides what goes **into the bundle**. And `.gitignore` decides what goes **into the Git history**. These are two different boundaries. The Vite template ignores `*.local` files, but not `.env` — so put local values into `.env.local`. And a real secret does not belong in client code at all: its place is on the server (RE-11).

  - id: build-flow
    kind: visual
    visual: diagram
    title:
      uk: "Від вихідних модулів і .env до теки dist"
      en: "From source modules and .env to the dist folder"
    textEquivalent:
      uk: >-
        Вхід збирання — модулі src/App.tsx і src/Stats.tsx, файл .env з рядком VITE_APP_TITLE і файл .env.local з
        SYNC_API_KEY. Команда vite build читає їх і пише в dist три види файлів: index.html, головний bundle
        assets/index-BIrlHGyo.js і окремий файл lazy-компонента assets/Stats-DTm_fCmj.js (поруч ще CSS-файл). index.html
        посилається на головний bundle за назвою з хешем. Значення VITE_APP_TITLE, яке читає App.tsx, вписується в
        головний bundle як текст «Release lab». SYNC_API_KEY без префікса VITE_ у bundle не потрапляє: вираз
        import.meta.env.SYNC_API_KEY стає undefined. Якщо ж перейменувати його на VITE_SYNC_API_KEY і прочитати в коді,
        значення опиниться в bundle — і стане публічним, хоч і лежить у .env.local, якого немає в Git.
      en: >-
        The build's input is the modules src/App.tsx and src/Stats.tsx, the file .env with the line VITE_APP_TITLE and
        the file .env.local with SYNC_API_KEY. The command vite build reads them and writes three kinds of files into
        dist: index.html, the main bundle assets/index-BIrlHGyo.js and a separate file for the lazy component,
        assets/Stats-DTm_fCmj.js (plus a CSS file). index.html refers to the main bundle by its hashed name. The value
        VITE_APP_TITLE, which App.tsx reads, is written into the main bundle as the text "Release lab". SYNC_API_KEY
        without the VITE_ prefix does not reach the bundle: the expression import.meta.env.SYNC_API_KEY becomes
        undefined. If it is renamed to VITE_SYNC_API_KEY and read in the code, the value ends up in the bundle — and
        becomes public, even though it lives in .env.local, which is not in Git.
    spec:
      layout: grid
      groups:
        - { id: src, label: { uk: "Вихідні файли", en: "Source files" } }
        - { id: tool, label: { uk: "Збирання", en: "Build" } }
        - { id: dist, label: { uk: "Тека dist", en: "The dist folder" } }
      nodes:
        - { id: app, group: src, label: "src/App.tsx", w: 140, col: 0, row: 0 }
        - { id: env, group: src, label: ".env", w: 140, col: 1, row: 0 }
        - { id: envlocal, group: src, label: ".env.local", w: 140, col: 1, row: 1 }
        - { id: vite, group: tool, label: "vite build", shape: round, w: 140, col: 0, row: 2 }
        - { id: html, group: dist, label: "index.html", w: 140, col: 0, row: 3 }
        - { id: main, group: dist, label: "index-BIrlHGyo.js", w: 150, col: 1, row: 3 }
        - { id: chunk, group: dist, label: "Stats-DTm_fCmj.js", w: 150, col: 1, row: 4 }
      edges:
        - { id: app-vite, from: app, to: vite }
        - { id: env-vite, from: env, to: vite, label: "VITE_APP_TITLE" }
        - { id: local-vite, from: envlocal, to: vite, label: "SYNC_API_KEY", kind: dashed }
        - { id: vite-html, from: vite, to: html }
        - { id: vite-main, from: vite, to: main }
        - { id: vite-chunk, from: vite, to: chunk }
      steps:
        - highlight: [app, env, envlocal, vite, app-vite, env-vite, local-vite]
          dim: [html, main, chunk]
          caption:
            uk: "Збирання читає модулі, починаючи з `main.tsx`, і файли `.env` та `.env.local`."
            en: "The build reads the modules, starting from `main.tsx`, and the files `.env` and `.env.local`."
        - highlight: [vite, html, main, chunk, vite-html, vite-main, vite-chunk]
          dim: [app, env, envlocal, app-vite, env-vite, local-vite]
          caption:
            uk: "У `dist` з’являються `index.html`, головний bundle і окремий файл lazy-компонента `Stats`. Літери в назвах — хеш вмісту."
            en: "`dist` gets `index.html`, the main bundle and a separate file for the lazy component `Stats`. The letters in the names are the content hash."
        - highlight: [env, env-vite, vite-main, main]
          dim: [envlocal, local-vite, chunk, vite-chunk, html, vite-html]
          annotate:
            - { id: main, text: { uk: "містить текст «Release lab»", en: "contains the text “Release lab”" } }
          caption:
            uk: "`App.tsx` читає `import.meta.env.VITE_APP_TITLE`, тож у головному bundle на цьому місці стоїть сам текст «Release lab»."
            en: "`App.tsx` reads `import.meta.env.VITE_APP_TITLE`, so the main bundle has the text “Release lab” itself in that place."
        - highlight: [envlocal, local-vite]
          dim: [env, env-vite, html, chunk, vite-html, vite-chunk]
          annotate:
            - { id: local-vite, text: { uk: "у bundle — undefined", en: "in the bundle: undefined" } }
          caption:
            uk: "`SYNC_API_KEY` без префікса `VITE_` у bundle не йде: прочитаний у коді, він дає `undefined`."
            en: "`SYNC_API_KEY` without the `VITE_` prefix does not go into the bundle: read in the code, it gives `undefined`."
        - highlight: [envlocal, local-vite, vite-main, main]
          dim: [env, env-vite, html, chunk, vite-html, vite-chunk]
          annotate:
            - { id: main, text: { uk: "витік: ключ у публічному файлі", en: "leak: the key in a public file" } }
          caption:
            uk: "Перейменуй його на `VITE_SYNC_API_KEY` і прочитай у коді — значення опиниться в головному bundle. Те, що `.env.local` немає в Git, тут не допомагає."
            en: "Rename it to `VITE_SYNC_API_KEY` and read it in the code — the value ends up in the main bundle. That `.env.local` is not in Git does not help here."

  - id: predict-what-ships
    kind: prediction
    runnable: false
    prompt:
      uk: "У проєкті Vite файл `.env` містить `VITE_APP_TITLE=Release lab` і `VITE_SUPPORT_EMAIL=help@example.com`, а `.env.local` — `SYNC_API_KEY=placeholder-private-7f3a`. Код читає лише `import.meta.env.VITE_APP_TITLE` і `import.meta.env.SYNC_API_KEY`. Які з трьох значень можна знайти в тексті файлів `dist` після `npm run build`? Познач усі."
      en: "In a Vite project the file `.env` contains `VITE_APP_TITLE=Release lab` and `VITE_SUPPORT_EMAIL=help@example.com`, and `.env.local` contains `SYNC_API_KEY=placeholder-private-7f3a`. The code reads only `import.meta.env.VITE_APP_TITLE` and `import.meta.env.SYNC_API_KEY`. Which of the three values can be found in the text of the `dist` files after `npm run build`? Pick all of them."
    answer:
      type: multi
      options:
        - id: title
          text: { uk: "`Release lab`", en: "`Release lab`" }
        - id: email
          text: { uk: "`help@example.com`", en: "`help@example.com`" }
          why:
            uk: "Префікс `VITE_` дозволяє значенню потрапити в bundle, але Vite вписує лише ті вирази, які код справді читає. `VITE_SUPPORT_EMAIL` ніде не прочитано — у `dist` його немає."
            en: "The `VITE_` prefix allows a value into the bundle, but Vite writes in only the expressions the code really reads. `VITE_SUPPORT_EMAIL` is not read anywhere — it is not in `dist`."
        - id: key
          text: { uk: "`placeholder-private-7f3a`", en: "`placeholder-private-7f3a`" }
          why:
            uk: "Код читає `SYNC_API_KEY`, але без префікса `VITE_` Vite не віддає значення клієнтському коду: вираз стає `undefined`. Небезпечним його зробило б перейменування на `VITE_…`."
            en: "The code reads `SYNC_API_KEY`, but without the `VITE_` prefix Vite does not give the value to client code: the expression becomes `undefined`. Renaming it to `VITE_…` is what would make it dangerous."
      correct: [title]
    explanation:
      uk: "У bundle потрапляє значення, яке має префікс `VITE_` **і** яке код читає. Ми перевірили всі три випадки на Vite 8.3.2 пошуком у `dist`: знайшовся лише `Release lab`. Ти повториш цей пошук у завданні цього уроку."
      en: "What reaches the bundle is a value that has the `VITE_` prefix **and** is read by the code. We checked all three cases on Vite 8.3.2 by searching `dist`: only `Release lab` was found. You repeat that search in this lesson's task."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: що робив define у JS-15"
      en: "Recall: what define did in JS-15"
    items:
      - id: define-into-bundle
        from: js-15-06-build-env-sourcemaps
        prompt:
          uk: "У `money-lab` файл `build.mjs` передавав esbuild `define: { APP_TITLE: JSON.stringify(title) }`, а `.env` містив `APP_TITLE=Family budget`. Ти змінив `.env` на `APP_TITLE=Home budget`, але `npm run build` не запускав і просто оновив сторінку. Який заголовок вона покаже?"
          en: "In `money-lab` the file `build.mjs` passed esbuild `define: { APP_TITLE: JSON.stringify(title) }`, and `.env` contained `APP_TITLE=Family budget`. You changed `.env` to `APP_TITLE=Home budget` but did not run `npm run build` and just reloaded the page. Which heading does it show?"
        answer:
          type: choice
          options:
            - id: old
              text: { uk: "«Family budget»", en: "“Family budget”" }
            - id: new
              text: { uk: "«Home budget»", en: "“Home budget”" }
              why:
                uk: "Сторінка не читає `.env`: вона виконує `dist/app.js`, у текст якого заголовок вписали під час останнього збирання. Нове значення з’явиться лише після `npm run build`."
                en: "The page does not read `.env`: it runs `dist/app.js`, into whose text the heading was written during the last build. The new value appears only after `npm run build`."
            - id: empty
              text: { uk: "Порожній заголовок, бо значення змінилося", en: "An empty heading, because the value changed" }
              why:
                uk: "Старий bundle нікуди не дівся і досі містить попередній текст. Порожнім заголовок був би, якби `APP_TITLE` у bundle не потрапив зовсім."
                en: "The old bundle has not gone anywhere and still contains the earlier text. The heading would be empty only if `APP_TITLE` had not reached the bundle at all."
          correct: [old]
        explanation:
          uk: "`define` вписує значення в bundle під час збирання — це той самий механізм, що й `import.meta.env.VITE_…` у Vite. Що вписано, те й лежить у файлі, доки ти не збереш його знову."
          en: "`define` writes the value into the bundle during the build — the same mechanism as `import.meta.env.VITE_…` in Vite. What has been written in stays in the file until you build again."

  - id: release-lab
    kind: local-task
    runtime: local-web
    title:
      uk: "Зібрати release-lab і перевірити межу env"
      en: "Build release-lab and check the env boundary"
    intro:
      uk: |
        Ти створиш новий проєкт `~/js-course/release-lab` — невеликий список справ на React і TypeScript. Він знадобиться й у наступних уроках цього розділу. Потрібні інтернет (шаблон і пакети npm — безкоштовні, без облікового запису), Node.js, Google Chrome і **два вікна терміналу**. Команди перевірено на macOS; на Linux вони ті самі. Для Windows PowerShell крок 5 має окремий варіант, який ми не перевіряли.

        Вміст файлів для кроку 2 — копіюй його точно, замінюючи файли шаблону з тією самою назвою.

        **Крок 2 — `src/tasks.ts`:**

        ```ts
        export type Task = { id: string; title: string; done: boolean };

        export function addTask(tasks: Task[], title: string): Task[] {
          return [...tasks, { id: crypto.randomUUID(), title: title.trim(), done: false }];
        }

        export function toggleTask(tasks: Task[], id: string): Task[] {
          return tasks.map((task) => (task.id === id ? { ...task, done: !task.done } : task));
        }

        export function countDone(tasks: Task[]): number {
          return tasks.filter((task) => task.done).length;
        }
        ```

        **Крок 2 — `src/Stats.tsx`:**

        ```tsx
        import { countDone, type Task } from "./tasks.ts";

        export default function Stats({ tasks }: { tasks: Task[] }) {
          return (
            <p>
              Done: {countDone(tasks)} of {tasks.length} tasks
            </p>
          );
        }
        ```

        **Крок 2 — `src/App.tsx`** (замінює файл шаблону):

        ```tsx
        import { lazy, Suspense, useEffect, useState, type FormEvent } from "react";
        import { addTask, toggleTask, type Task } from "./tasks.ts";

        const Stats = lazy(() => import("./Stats.tsx"));
        const STORAGE_KEY = "release-lab.tasks";

        function loadTasks(): Task[] {
          try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) ?? "[]");
          } catch {
            return [];
          }
        }

        export default function App() {
          const [tasks, setTasks] = useState<Task[]>(loadTasks);
          const [title, setTitle] = useState("");
          const [showStats, setShowStats] = useState(false);

          useEffect(() => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          }, [tasks]);

          function handleSubmit(event: FormEvent<HTMLFormElement>) {
            event.preventDefault();
            if (title.trim() === "") return;
            setTasks((current) => addTask(current, title));
            setTitle("");
          }

          return (
            <main>
              <h1>{import.meta.env.VITE_APP_TITLE}</h1>
              <form onSubmit={handleSubmit}>
                <label htmlFor="task-title">New task</label>
                <input id="task-title" value={title} onChange={(event) => setTitle(event.target.value)} />
                <button type="submit">Add</button>
              </form>
              <ul aria-label="Tasks">
                {tasks.map((task) => (
                  <li key={task.id}>
                    <label>
                      <input
                        type="checkbox"
                        checked={task.done}
                        onChange={() => setTasks((current) => toggleTask(current, task.id))}
                      />
                      {task.title}
                    </label>
                  </li>
                ))}
              </ul>
              <button type="button" onClick={() => setShowStats((shown) => !shown)}>
                {showStats ? "Hide stats" : "Show stats"}
              </button>
              {showStats && (
                <Suspense fallback={<p role="status">Loading stats…</p>}>
                  <Stats tasks={tasks} />
                </Suspense>
              )}
            </main>
          );
        }
        ```

        **Крок 3 — `.env`** (у корені `release-lab`):

        ```text
        VITE_APP_TITLE=Release lab
        ```

        **Крок 3 — `.env.local`** (там само; значення вигадане, справжніх ключів у курсі немає):

        ```text
        SYNC_API_KEY=placeholder-private-7f3a
        ```
      en: |
        You create a new project `~/js-course/release-lab` — a small task list in React and TypeScript. You will need it in the next lessons of this unit too. You need internet access (the template and the npm packages are free, no account), Node.js, Google Chrome and **two terminal windows**. The commands were checked on macOS; on Linux they are the same. For Windows PowerShell step 5 has its own variant, which we did not check.

        File contents for step 2 — copy them exactly, replacing the template's files with the same name.

        **Step 2 — `src/tasks.ts`:**

        ```ts
        export type Task = { id: string; title: string; done: boolean };

        export function addTask(tasks: Task[], title: string): Task[] {
          return [...tasks, { id: crypto.randomUUID(), title: title.trim(), done: false }];
        }

        export function toggleTask(tasks: Task[], id: string): Task[] {
          return tasks.map((task) => (task.id === id ? { ...task, done: !task.done } : task));
        }

        export function countDone(tasks: Task[]): number {
          return tasks.filter((task) => task.done).length;
        }
        ```

        **Step 2 — `src/Stats.tsx`:**

        ```tsx
        import { countDone, type Task } from "./tasks.ts";

        export default function Stats({ tasks }: { tasks: Task[] }) {
          return (
            <p>
              Done: {countDone(tasks)} of {tasks.length} tasks
            </p>
          );
        }
        ```

        **Step 2 — `src/App.tsx`** (replaces the template's file):

        ```tsx
        import { lazy, Suspense, useEffect, useState, type FormEvent } from "react";
        import { addTask, toggleTask, type Task } from "./tasks.ts";

        const Stats = lazy(() => import("./Stats.tsx"));
        const STORAGE_KEY = "release-lab.tasks";

        function loadTasks(): Task[] {
          try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) ?? "[]");
          } catch {
            return [];
          }
        }

        export default function App() {
          const [tasks, setTasks] = useState<Task[]>(loadTasks);
          const [title, setTitle] = useState("");
          const [showStats, setShowStats] = useState(false);

          useEffect(() => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          }, [tasks]);

          function handleSubmit(event: FormEvent<HTMLFormElement>) {
            event.preventDefault();
            if (title.trim() === "") return;
            setTasks((current) => addTask(current, title));
            setTitle("");
          }

          return (
            <main>
              <h1>{import.meta.env.VITE_APP_TITLE}</h1>
              <form onSubmit={handleSubmit}>
                <label htmlFor="task-title">New task</label>
                <input id="task-title" value={title} onChange={(event) => setTitle(event.target.value)} />
                <button type="submit">Add</button>
              </form>
              <ul aria-label="Tasks">
                {tasks.map((task) => (
                  <li key={task.id}>
                    <label>
                      <input
                        type="checkbox"
                        checked={task.done}
                        onChange={() => setTasks((current) => toggleTask(current, task.id))}
                      />
                      {task.title}
                    </label>
                  </li>
                ))}
              </ul>
              <button type="button" onClick={() => setShowStats((shown) => !shown)}>
                {showStats ? "Hide stats" : "Show stats"}
              </button>
              {showStats && (
                <Suspense fallback={<p role="status">Loading stats…</p>}>
                  <Stats tasks={tasks} />
                </Suspense>
              )}
            </main>
          );
        }
        ```

        **Step 3 — `.env`** (in the root of `release-lab`):

        ```text
        VITE_APP_TITLE=Release lab
        ```

        **Step 3 — `.env.local`** (in the same place; the value is made up, the course has no real keys):

        ```text
        SYNC_API_KEY=placeholder-private-7f3a
        ```
