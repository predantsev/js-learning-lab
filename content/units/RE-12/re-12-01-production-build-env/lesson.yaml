    troubleshooting:
      - problem:
          uk: "`Port 5173 is in use, trying another one...`"
          en: "`Port 5173 is in use, trying another one...`"
        fix:
          uk: "Інша програма (часто — ще один dev-сервер у іншому вікні) уже слухає 5173, і Vite узяв наступний порт, наприклад `http://localhost:5174/`. Відкрий саме ту адресу, яку він надрукував. Пам’ятай: інший порт — інше джерело (origin), тож справи, збережені на 5173, там не видно."
          en: "Another program (often one more dev server in another window) already listens on 5173, and Vite took the next port, for example `http://localhost:5174/`. Open exactly the address it printed. Remember: another port is another origin, so the tasks saved on 5173 are not visible there."
      - problem:
          uk: "Заголовок на сторінці порожній"
          en: "The heading on the page is empty"
        fix:
          uk: "Vite не знайшов `VITE_APP_TITLE`. Перевір, що файл називається саме `.env` (не `.env.txt`), лежить у корені `release-lab` поруч із `package.json` і що в назві змінної є префікс `VITE_`. Значення читаються під час запуску: зупини dev-сервер і запусти знову."
          en: "Vite did not find `VITE_APP_TITLE`. Check that the file is called exactly `.env` (not `.env.txt`), lies in the root of `release-lab` next to `package.json`, and that the variable name has the `VITE_` prefix. The values are read at startup: stop the dev server and start it again."
      - problem:
          uk: "`npm run build` зупинився з `error TS…` і `Found 1 error.`"
          en: "`npm run build` stopped with `error TS…` and `Found 1 error.`"
        fix:
          uk: "Це `tsc -b`: типи не зійшлися, і `vite build` навіть не почався, тож `dist` не оновилася (стара тека, якщо була, лишилася як є). Рядок помилки називає файл, рядок коду й стовпчик, наприклад `src/App.tsx:27:44 - error TS2345: …`, а під ним показує сам рядок коду. Найчастіше файл скопійовано не повністю — порівняй його з текстом у вступі."
          en: "This is `tsc -b`: the types did not match, and `vite build` did not even start, so `dist` was not updated (an old folder, if there was one, stayed as it was). The error line names the file, the line of code and the column, for example `src/App.tsx:27:44 - error TS2345: …`, and shows the line of code itself under it. Most often a file was copied incompletely — compare it with the text in the introduction."
    recovery:
      uk: "`dist` — лише результат: її можна видалити будь-коли, `npm run build` створить її знову. Якщо проєкт заплутався зовсім, перейменуй теку `release-lab` (наприклад, на `release-lab-old`) і пройди кроки з першого: шаблон і файли зі вступу дають той самий стан."
      en: "`dist` is only a result: you can delete it at any time, `npm run build` creates it again. If the project got tangled completely, rename the `release-lab` folder (for example to `release-lab-old`) and go through the steps from the first one: the template and the files from the introduction give the same state."

