      - text:
          uk: "Створи в корені проєкту `.env` і `.env.local` (вміст — у вступі, позначки «Крок 3»). Запусти dev-сервер у **першому** вікні терміналу й відкрий у Chrome адресу, яку він надрукує. Додай одну справу. Потім зупини сервер: Ctrl + C."
          en: "Create `.env` and `.env.local` in the project root (contents in the introduction, marked “Step 3”). Start the dev server in the **first** terminal window and open the address it prints in Chrome. Add one task. Then stop the server: Ctrl + C."
