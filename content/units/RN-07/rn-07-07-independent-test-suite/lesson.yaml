    solutionNote:
      uk: "Граничні випадки — порожній журнал і кілька книжок, серед яких є прочитана, — ловлять обидва дефекти суми. Тест типізованої перевірки бере JSON із `\"pagesRead\": \"80\"`: такий запис тип `Book` у коді не допустить, а в сховищі він можливий, тож його має відхилити `validateBook`. Компонентний тест знаходить перемикач за доступною назвою й перевіряє видимий статус — тому падає й без назви, й без зміни статусу."
      en: "The boundary cases — an empty log and several books including a finished one — catch both total defects. The typed-validation test takes JSON with `\"pagesRead\": \"80\"`: the `Book` type would not allow such a record in code, but in storage it is possible, so `validateBook` must refuse it. The component test finds the toggle by its accessible label and checks the visible status — so it fails both without the label and without the status change."
