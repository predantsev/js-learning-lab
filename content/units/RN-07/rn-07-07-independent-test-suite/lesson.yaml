id: rn-07-07-independent-test-suite
unit: RN-07
title:
  uk: "Самостійно: тести й задокументовані прогалини mocks"
  en: "Independent: tests and documented mock gaps"
kind: assessment
minutes: 35
contentVersion: 1
purpose:
  uk: "Перевірити, що ти без підказок пишеш для native-функції набір тестів, який справді ловить дефекти, — unit-тести з граничними випадками, тест типізованої перевірки збереженого JSON і компонентний тест за доступною назвою, — і чесно записуєш, чого ці тести не доводять. Спершу набір перевіряється тут на прихованих зламаних версіях, потім ти запускаєш його справжнім Jest у локальному проєкті й виконуєш одну перевірку на заявленій цілі."
  en: "To check that, without hints, you write a test suite for a native feature that really catches defects — unit tests with boundary cases, a typed-validation test for stored JSON and a component test by accessible label — and honestly record what these tests do not prove. First the suite is checked here against hidden broken versions, then you run it with real Jest in a local project and perform one check on your declared target."
objectives:
  - uk: "Без підказок написати для наданої синтетичної native-функції unit-тести, тест типізованої перевірки й компонентний тест, які падають на прихованих навмисних дефектах."
    en: "Write, without hints, unit, typed-domain and component tests for a supplied synthetic native feature that fail for the hidden seeded defects."
  - uk: "Задокументувати кожну перевірку, якої не доводять mocks, і виконати принаймні одну з них на заявленій цілі."
    en: "Document every check the mocks cannot prove and perform at least one of those checks on the declared target."
prerequisites: [rn-07-06-debug-real-native-failure]
subskills:
  - { family: N-10, skill: "unit/typed-domain/component/integration tests", depth: assess }
  - { family: N-10, skill: "mocks vs target/device checks", depth: assess }
glossary: []
selfCheck: [reading-tests]

blocks:
  - id: what-is-checked
    kind: explanation
    title:
      uk: "Що перевіряється"
      en: "What is checked"
    body:
      uk: |
        Синтетична функція — **журнал читання**: запис на книжку `{ id, title, pagesRead, finished }`, де `pagesRead` — ціле число від 0. У ній три частини:

        - `summarizeReading(books)` повертає `{ pagesRead, finished }` — сторінки всіх книжок разом і кількість прочитаних;
        - `validateBook(input)` перевіряє значення ззовні (форму, збережений JSON) і повертає `{ ok: true, value }` або `{ ok: false, errors }`;
        - `BookRow` — рядок книжки зі статусом і перемикачем.

        Спершу твій набір тестів перевіряють автоматично: він має проходити на правильному коді й падати на кожній з кількох прихованих зламаних версій. Потім — локальна частина: той самий набір у справжньому Jest, тест на рівні типів для `tsc`, список прогалин mock і одна перевірка на заявленій цілі.
      en: |
        The synthetic feature is a **reading log**: one record per book, `{ id, title, pagesRead, finished }`, where `pagesRead` is a whole number from 0. It has three parts:

        - `summarizeReading(books)` returns `{ pagesRead, finished }` — the pages of all books together and the number finished;
        - `validateBook(input)` checks a value from outside (a form, stored JSON) and returns `{ ok: true, value }` or `{ ok: false, errors }`;
        - `BookRow` is a book's row with a status and a toggle.

        First your test suite is checked automatically: it must pass on the correct code and fail on each of several hidden broken versions. Then the local part: the same suite in real Jest, a type-level test for `tsc`, a list of mock gaps and one check on your declared target.

  - id: reading-tests
    kind: exercise
    mode: independent
    assessment: true
    runtime: concept-preview
    dir: reading-tests
    entry: main.jsx
    editable: [readingLog.test.jsx]
    capabilities: { testTimeoutMs: 10000 }
    strings:
      sea: { uk: "Морські історії", en: "Sea stories" }
      garden: { uk: "Рік у саду", en: "A garden year" }
      trains: { uk: "Нічні потяги", en: "Night trains" }
      reading: { uk: "Читаю", en: "Reading" }
      finished: { uk: "Прочитано", en: "Finished" }
      markFinished: { uk: "Позначити прочитаною", en: "Mark as finished" }
      tEmpty: { uk: "порожній журнал — 0 сторінок", en: "an empty log reads zero pages" }
      tOne: { uk: "одна прочитана книжка", en: "one finished book" }
      tMany: { uk: "сторінки всіх книжок додаються", en: "pages of every book are added up" }
      tStored: { uk: "збережені сторінки текстом відхиляються", en: "stored pages as text are refused" }
      tToggle: { uk: "перемикач показує «Прочитано»", en: "the toggle shows Finished" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rNotFound: { uk: "на екрані немає", en: "not on the screen:" }
      rStillMissing: { uk: "так і не з’явилося", en: "never appeared" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Набір тестів для журналу читання"
      en: "A test suite for the reading log"
    instructions:
      uk: |
        У `readingLog.test.jsx` напиши щонайменше три тести для `readingLog.js` і `BookRow.jsx` (обидва файли лише для читання):

        - unit-тести `summarizeReading` з граничними випадками;
        - тест типізованої перевірки: `validateBook` на збереженому JSON (`JSON.parse(…)`), який не відповідає типу книжки;
        - компонентний тест `BookRow`: знайти перемикач за доступною назвою — для книжки «%%sea%%» це «%%markFinished%%: %%sea%%» — натиснути й перевірити видимий статус. Статуси: «%%reading%%» і «%%finished%%».

        Тести запускає `testing.js` із цього розділу. Перевірки проганяють твій набір на правильному коді й на п’яти прихованих версіях з одним дефектом кожна: на кожній має впасти хоча б один твій тест.
      en: |
        In `readingLog.test.jsx` write at least three tests for `readingLog.js` and `BookRow.jsx` (both read-only):

        - unit tests of `summarizeReading` with boundary cases;
        - a typed-validation test: `validateBook` on stored JSON (`JSON.parse(…)`) that does not match the book type;
        - a component test of `BookRow`: find the toggle by its accessible label — for the book “%%sea%%” it is “%%markFinished%%: %%sea%%” — press it and check the visible status. The statuses are “%%reading%%” and “%%finished%%”.

        `testing.js` from this unit runs the tests. The checks run your suite on the correct code and on five hidden versions with one defect each: on each of them at least one of your tests must fail.
