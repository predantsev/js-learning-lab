  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: boundaries
        from: js-09-03-boundary-cases
        prompt:
          uk: "Функція `countDueTasks(tasks, today)` рахує невиконані справи з терміном до `today` включно. Який набір вхідних даних найкраще перевіряє її межі?"
          en: "The function `countDueTasks(tasks, today)` counts pending tasks due on or before `today`. Which set of inputs checks its boundaries best?"
        answer:
          type: choice
          options:
            - id: edges
              text:
                uk: "Порожній список; одна справа з терміном рівно `today`; кілька справ, серед яких виконана, без терміну й з терміном після `today`"
                en: "An empty list; one task due exactly on `today`; several tasks, including a done one, one without a due date and one due after `today`"
            - id: big
              text:
                uk: "Список із тисячі однакових невиконаних справ із терміном учора"
                en: "A list of a thousand identical pending tasks due yesterday"
              why:
                uk: "Тисяча однакових справ перевіряє один і той самий випадок тисячу разів. Межі — порожньо, рівно `today`, `null` — так і лишаються неперевіреними."
                en: "A thousand identical tasks check the same case a thousand times. The boundaries — empty, exactly `today`, `null` — stay unchecked."
            - id: typical
              text:
                uk: "Три звичайні справи з терміном минулого тижня"
                en: "Three ordinary tasks due last week"
              why:
                uk: "Звичайні дані показують, що функція працює в середині. Помилки ж живуть на краях: у порожньому списку, у `<=` проти `<`, у `null`."
                en: "Ordinary data shows that the function works in the middle. Bugs live at the edges: in an empty list, in `<=` versus `<`, in `null`."
          correct: [edges]
        explanation:
          uk: "Порожньо, один, багато, `null` і точна межа — ті самі запитання стоять перед кожною функцією-підсумком, і перед `summarizeReading` теж."
          en: "Empty, one, many, `null` and the exact boundary — the same questions apply to every summarizing function, `summarizeReading` included."

  - id: on-target
    kind: local-task
    runtime: local-native
    title:
      uk: "Справжній Jest, tsc і одна перевірка на цілі"
      en: "Real Jest, tsc and one check on the target"
    intro:
      uk: |
        Частина з Jest і `tsc` працює лише на комп’ютері — native-інструменти для неї не потрібні. Для останнього кроку потрібна заявлена ціль з Expo Go. Якщо цілі немає, виконай кроки 1–7 і натисни **«У мене немає емулятора чи пристрою»**: перевірка на цілі запишеться як не виконана.

        Кроки 1–6 виконано на macOS з Node.js v25.2.1, npm 11.6.2 і expo 57.0.27 — вивід справжній. Крок 8 на цілі не виконувався.

        **Крок 3 — `tsconfig.json`** (повністю заміни ним файл). TypeScript 6 (його ставить шаблон) сам не підключає типи Jest: без рядка `types` команда `tsc` повідомить `Cannot find name 'test'`.

        ```json
        {
          "extends": "expo/tsconfig.base",
          "compilerOptions": {
            "strict": true,
            "types": ["jest"]
          }
        }
        ```

        **Крок 4 — `src/readingLog.ts`:**

        ```ts
        // Reading log: one record per book. Synthetic lab feature.
        export type Book = {
          id: string;
          title: string; // 1–80 characters after trimming
          pagesRead: number; // a whole number, 0 or more
          finished: boolean;
        };

        export type BookCheck =
          | { ok: true; value: Book }
          | { ok: false; errors: Partial<Record<keyof Book, string>> };

        // Checks a value that came from outside (a form, stored JSON) at run time.
        export function validateBook(input: unknown): BookCheck {
          const raw = typeof input === 'object' && input !== null ? (input as Record<string, unknown>) : {};
          const errors: Partial<Record<keyof Book, string>> = {};
          const title = typeof raw.title === 'string' ? raw.title.trim() : '';
          if (typeof raw.id !== 'string' || raw.id === '') errors.id = 'id.missing';
          if (title.length < 1 || title.length > 80) errors.title = 'title.length';
          if (typeof raw.pagesRead !== 'number' || !Number.isInteger(raw.pagesRead) || raw.pagesRead < 0) {
            errors.pagesRead = 'pages.wholeNumber';
          }
          if (typeof raw.finished !== 'boolean') errors.finished = 'finished.boolean';
          if (Object.keys(errors).length > 0) return { ok: false, errors };
          return { ok: true, value: { id: raw.id as string, title, pagesRead: raw.pagesRead as number, finished: raw.finished as boolean } };
        }

        // Pages read across all books, and how many books are finished.
        export function summarizeReading(books: Book[]): { pagesRead: number; finished: number } {
          let pagesRead = 0;
          let finished = 0;
          for (const book of books) {
            pagesRead += book.pagesRead;
            if (book.finished) finished += 1;
          }
          return { pagesRead, finished };
        }
        ```

        **Крок 4 — `src/BookRow.tsx`:**

        ```tsx
        import { useState } from 'react';
        import { Pressable, StyleSheet, Text, View } from 'react-native';
        import type { Book } from './readingLog';

        // One book in the reading log, with a toggle between reading and finished.
        export function BookRow({ book }: { book: Book }) {
          const [finished, setFinished] = useState(book.finished);
          return (
            <View style={styles.row}>
              <Text style={styles.title}>{book.title}</Text>
              <Text>{finished ? 'Прочитано' : 'Читаю'}</Text>
              <Pressable
                accessibilityRole="button"
                accessibilityLabel={`Позначити прочитаною: ${book.title}`}
                onPress={() => setFinished((value) => !value)}
                style={styles.toggle}
              >
                <Text>{finished ? '✓' : '○'}</Text>
              </Pressable>
            </View>
          );
        }

        const styles = StyleSheet.create({
          row: { flexDirection: 'row', alignItems: 'center', gap: 8, padding: 8 },
          title: { flex: 1 },
          toggle: { minWidth: 48, minHeight: 48, alignItems: 'center', justifyContent: 'center' },
        });
        ```

        **Крок 7 — `App.tsx`** (повністю заміни ним файл):

        ```tsx
        // RN-07 reading log: two books with a "finished" toggle, for the device checks.
        import { StyleSheet, Text, View } from 'react-native';
        import { BookRow } from './src/BookRow';
        import { summarizeReading } from './src/readingLog';
        import type { Book } from './src/readingLog';

        const books: Book[] = [
          { id: 'b-01', title: 'Морські історії', pagesRead: 120, finished: false },
          { id: 'b-02', title: 'Рік у саду', pagesRead: 45, finished: true },
        ];

        export default function App() {
          const summary = summarizeReading(books);
          return (
            <View style={styles.screen}>
              <Text style={styles.heading}>Журнал читання</Text>
              {books.map((book) => <BookRow key={book.id} book={book} />)}
              <Text>Прочитано сторінок: {summary.pagesRead}</Text>
            </View>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, paddingTop: 64, paddingHorizontal: 16, gap: 8, backgroundColor: '#ffffff' },
          heading: { fontSize: 22, fontWeight: '600' },
        });
        ```

        **Крок 5 — як закінчувався вивід `npx jest` з нашим набором із чотирьох тестів** (уривок; назви тестів у тебе свої):

        ```text
        PASS src/readingLog.test.tsx
          …
        Test Suites: 1 passed, 1 total
        Tests:       4 passed, 4 total
        ```
      en: |
        The Jest and `tsc` part runs on the computer only — it needs no native tools. The last step needs a declared target with Expo Go. If you have no target, do steps 1–7 and press **“I have no emulator or device”**: the check on the target is recorded as not performed.

        Steps 1–6 were run on macOS with Node.js v25.2.1, npm 11.6.2 and expo 57.0.27 — the output is real. Step 8 on a target was not run.

        **Step 3 — `tsconfig.json`** (replace the whole file with it). TypeScript 6 (the template installs it) does not pick up Jest's types by itself: without the `types` line `tsc` reports `Cannot find name 'test'`.

        ```json
        {
          "extends": "expo/tsconfig.base",
          "compilerOptions": {
            "strict": true,
            "types": ["jest"]
          }
        }
        ```

        **Step 4 — `src/readingLog.ts`:**

        ```ts
        // Reading log: one record per book. Synthetic lab feature.
        export type Book = {
          id: string;
          title: string; // 1–80 characters after trimming
          pagesRead: number; // a whole number, 0 or more
          finished: boolean;
        };

        export type BookCheck =
          | { ok: true; value: Book }
          | { ok: false; errors: Partial<Record<keyof Book, string>> };

        // Checks a value that came from outside (a form, stored JSON) at run time.
        export function validateBook(input: unknown): BookCheck {
          const raw = typeof input === 'object' && input !== null ? (input as Record<string, unknown>) : {};
          const errors: Partial<Record<keyof Book, string>> = {};
          const title = typeof raw.title === 'string' ? raw.title.trim() : '';
          if (typeof raw.id !== 'string' || raw.id === '') errors.id = 'id.missing';
          if (title.length < 1 || title.length > 80) errors.title = 'title.length';
          if (typeof raw.pagesRead !== 'number' || !Number.isInteger(raw.pagesRead) || raw.pagesRead < 0) {
            errors.pagesRead = 'pages.wholeNumber';
          }
          if (typeof raw.finished !== 'boolean') errors.finished = 'finished.boolean';
          if (Object.keys(errors).length > 0) return { ok: false, errors };
          return { ok: true, value: { id: raw.id as string, title, pagesRead: raw.pagesRead as number, finished: raw.finished as boolean } };
        }

        // Pages read across all books, and how many books are finished.
        export function summarizeReading(books: Book[]): { pagesRead: number; finished: number } {
          let pagesRead = 0;
          let finished = 0;
          for (const book of books) {
            pagesRead += book.pagesRead;
            if (book.finished) finished += 1;
          }
          return { pagesRead, finished };
        }
        ```

        **Step 4 — `src/BookRow.tsx`:**

        ```tsx
        import { useState } from 'react';
        import { Pressable, StyleSheet, Text, View } from 'react-native';
        import type { Book } from './readingLog';

        // One book in the reading log, with a toggle between reading and finished.
        export function BookRow({ book }: { book: Book }) {
          const [finished, setFinished] = useState(book.finished);
          return (
            <View style={styles.row}>
              <Text style={styles.title}>{book.title}</Text>
              <Text>{finished ? 'Finished' : 'Reading'}</Text>
              <Pressable
                accessibilityRole="button"
                accessibilityLabel={`Mark as finished: ${book.title}`}
                onPress={() => setFinished((value) => !value)}
                style={styles.toggle}
              >
                <Text>{finished ? '✓' : '○'}</Text>
              </Pressable>
            </View>
          );
        }

        const styles = StyleSheet.create({
          row: { flexDirection: 'row', alignItems: 'center', gap: 8, padding: 8 },
          title: { flex: 1 },
          toggle: { minWidth: 48, minHeight: 48, alignItems: 'center', justifyContent: 'center' },
        });
        ```

        **Step 7 — `App.tsx`** (replace the whole file with it):

        ```tsx
        // RN-07 reading log: two books with a "finished" toggle, for the device checks.
        import { StyleSheet, Text, View } from 'react-native';
        import { BookRow } from './src/BookRow';
        import { summarizeReading } from './src/readingLog';
        import type { Book } from './src/readingLog';

        const books: Book[] = [
          { id: 'b-01', title: 'Sea stories', pagesRead: 120, finished: false },
          { id: 'b-02', title: 'A garden year', pagesRead: 45, finished: true },
        ];

        export default function App() {
          const summary = summarizeReading(books);
          return (
            <View style={styles.screen}>
              <Text style={styles.heading}>Reading log</Text>
              {books.map((book) => <BookRow key={book.id} book={book} />)}
              <Text>Pages read: {summary.pagesRead}</Text>
            </View>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, paddingTop: 64, paddingHorizontal: 16, gap: 8, backgroundColor: '#ffffff' },
          heading: { fontSize: 22, fontWeight: '600' },
        });
        ```

