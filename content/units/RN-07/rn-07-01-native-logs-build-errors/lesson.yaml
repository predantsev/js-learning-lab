id: rn-07-01-native-logs-build-errors
unit: RN-07
title:
  uk: "Native-журнали й помилки збирання"
  en: "Native logs and build errors"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Знайти першу справжню помилку в довгому журналі native-збирання (Gradle чи Xcode) і відрізнити помилку конфігурації від помилки коду."
    en: "Locate the first real error in a long native build log (Gradle or Xcode) and tell a configuration error from a code error."
  - uk: "Обрати для симптому правильне джерело журналу: консоль Metro/JS, журнал пристрою (Logcat чи консоль Xcode/програма Console) або журнал збирання."
    en: "Choose the right log source for a symptom: the Metro/JS console, the device log (logcat or the Xcode/Console app) or the build log."
prerequisites: [rn-01-06-debug-setup-failure, rn-01-03-env-versions-debug-release]
subskills:
  - { family: N-10, skill: "native logs/build errors", depth: intro }
glossary: [native-log, build-log, logcat]
selfCheck: [predict-log-source, xcode-triage]

blocks:
  - id: three-logs
    kind: explanation
    title:
      uk: "Три журнали — три місця, де видно помилку"
      en: "Three logs — three places an error shows up"
    body:
      uk: |
        Застосунок React Native — це твій JavaScript, native-код (бібліотеки й сам React Native) і інструменти, що все це збирають. У кожної частини свій журнал:

        | Що зламалося | Де шукати |
        |---|---|
        | JavaScript кинув помилку | термінал dev-сервера Metro і, в debug-збірці, червоний екран зі стеком на пристрої |
        | native-код упав або система зупинила процес | [[native-log\|журнал пристрою]]: на Android — [[logcat\|Logcat]], на iOS — консоль Xcode чи програма Console на Mac |
        | збирання не дійшло до кінця | [[build-log\|журнал збирання]] Gradle (Android) чи Xcode (iOS) |

        Документація React Native 0.86 (сторінка «Debugging Native Code») радить для Android команду `adb logcat "*:S" ReactNative:V ReactNativeJS:V` — вона приглушує все, крім рядків React Native й JavaScript. Її ж `npx react-native log-android` потребує React Native CLI, якого шаблон Expo не встановлює (у `node_modules` нашого проєкту його немає).

        Найважливіше: **порожня консоль JavaScript не означає, що помилки немає.** Збій native-коду відбувається поза JavaScript — його бачить лише журнал пристрою.
      en: |
        A React Native app is your JavaScript, native code (the libraries and React Native itself) and the tools that build it all. Each part has its own log:

        | What broke | Where to look |
        |---|---|
        | JavaScript threw an error | the Metro dev server's terminal and, in a debug build, the red screen with a stack on the device |
        | native code crashed or the system stopped the process | the [[native-log\|device log]]: on Android [[logcat\|Logcat]], on iOS the Xcode console or the Console app on a Mac |
        | the build did not finish | the [[build-log]] of Gradle (Android) or Xcode (iOS) |

        The React Native 0.86 documentation (the “Debugging Native Code” page) suggests the Android command `adb logcat "*:S" ReactNative:V ReactNativeJS:V` — it silences everything except React Native and JavaScript lines. Its `npx react-native log-android` needs the React Native CLI, which the Expo template does not install (our project's `node_modules` has none).

        Most important: **an empty JavaScript console does not mean there is no error.** A failure of native code happens outside JavaScript — only the device log sees it.

  - id: where-errors-surface
    kind: visual
    visual: diagram
    title:
      uk: "Де з’являється кожна помилка"
      en: "Where each error surfaces"
    textEquivalent:
      uk: "Ліворуч три види збою: виняток JavaScript, native-виняток і збій збирання. Праворуч три журнали: Metro разом із червоним екраном на пристрої, журнал пристрою і журнал збирання. Виняток JavaScript уперше з’являється в терміналі Metro й на червоному екрані debug-збірки. Native-виняток — у журналі пристрою (Logcat чи консоль Xcode), а Metro лишається порожнім. Збій збирання — у журналі Gradle чи Xcode, ще до того, як застосунок узагалі запуститься."
      en: "On the left, three kinds of failure: a JavaScript exception, a native exception and a build failure. On the right, three logs: Metro together with the red screen on the device, the device log and the build log. A JavaScript exception first appears in the Metro terminal and on the red screen of a debug build. A native exception appears in the device log (Logcat or the Xcode console), while Metro stays empty. A build failure appears in the Gradle or Xcode log, before the app runs at all."
    spec:
      layout: lr
      groups:
        - { id: failures, label: { uk: "Збій", en: "Failure" } }
        - { id: logs, label: { uk: "Журнал", en: "Log" } }
      nodes:
        - { id: js, group: failures, label: { uk: "виняток JS", en: "JS exception" } }
        - { id: native, group: failures, label: { uk: "native-виняток", en: "native error" } }
        - { id: build, group: failures, label: { uk: "збій збирання", en: "build failure" } }
        - { id: metro, group: logs, label: { uk: "Metro і екран", en: "Metro, screen" } }
        - { id: device, group: logs, label: { uk: "пристрою", en: "device" } }
        - { id: buildlog, group: logs, label: { uk: "збирання", en: "build" } }
      edges:
        - { from: js, to: metro }
        - { from: native, to: device }
        - { from: build, to: buildlog }
      steps:
        - caption:
            uk: "Три види збою ліворуч, три журнали праворуч. Кожен збій уперше з’являється лише в одному з них."
            en: "Three kinds of failure on the left, three logs on the right. Each failure first appears in only one of them."
        - caption:
            uk: "Екран кидає `TypeError` у JavaScript: рядок помилки зі стеком з’являється в терміналі Metro, а debug-збірка показує червоний екран."
            en: "A screen throws a `TypeError` in JavaScript: the error line with its stack appears in the Metro terminal, and a debug build shows the red screen."
          highlight: [js, metro, js->metro]
        - caption:
            uk: "Native-модуль падає: застосунок зникає, Metro мовчить. Причина — у журналі пристрою: Logcat на Android, консоль Xcode на iOS."
            en: "A native module crashes: the app vanishes and Metro is silent. The cause is in the device log: Logcat on Android, the Xcode console on iOS."
          highlight: [native, device, native->device]
          dim: [metro]
        - caption:
            uk: "Збирання зупинилося на задачі Gradle чи фазі Xcode: застосунку ще немає, тож ні Metro, ні пристрій нічого не скажуть. Відповідь — у журналі збирання."
            en: "The build stopped at a Gradle task or an Xcode phase: there is no app yet, so neither Metro nor the device will say anything. The answer is in the build log."
          highlight: [build, buildlog, build->buildlog]
          dim: [metro, device]

  - id: predict-log-source
    kind: prediction
    prompt:
      uk: |
        Три симптоми в debug-збірці трекера витрат:

        - **A** — після відкриття списку на пристрої червоний екран: `TypeError: Cannot read property 'map' of undefined` зі стеком;
        - **B** — після натискання «Додати фото чека» застосунок одразу закривається; червоного екрана немає, термінал Metro нічого нового не надрукував;
        - **C** — `npx expo run:android` друкує сотні рядків і закінчує `BUILD FAILED`.

        Де шукати причину кожного?
      en: |
        Three symptoms in a debug build of the expense tracker:

        - **A** — after the list opens, the device shows a red screen: `TypeError: Cannot read property 'map' of undefined` with a stack;
        - **B** — after pressing “Attach receipt photo” the app closes at once; there is no red screen, and the Metro terminal printed nothing new;
        - **C** — `npx expo run:android` prints hundreds of lines and ends with `BUILD FAILED`.

        Where do you look for the cause of each?
    runnable: false
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "A — Metro й червоний екран · B — журнал пристрою · C — перша помилка в журналі збирання, вище за `BUILD FAILED`"
            en: "A — Metro and the red screen · B — the device log · C — the first error in the build log, above `BUILD FAILED`"
        - id: no-error
          text:
            uk: "A — Metro · B — шукати нічого: якщо консоль мовчить, помилки немає, просто перезапусти · C — журнал збирання"
            en: "A — Metro · B — nothing to look for: if the console is silent there is no error, just restart · C — the build log"
          why:
            uk: "Консоль JavaScript бачить лише JavaScript. Застосунок, що зник без червоного екрана, найчастіше впав у native-коді — і причина записана в журналі пристрою."
            en: "The JavaScript console sees only JavaScript. An app that vanished without a red screen most often crashed in native code — and the cause is written in the device log."
        - id: last-line
          text:
            uk: "A — Metro · B — журнал пристрою · C — останній рядок `BUILD FAILED`: він і є причиною"
            en: "A — Metro · B — the device log · C — the last line `BUILD FAILED`: that is the cause"
          why:
            uk: "`BUILD FAILED` каже лише, що збирання не вдалося. Що саме і де — написано вище, у першому повідомленні про помилку."
            en: "`BUILD FAILED` only says the build failed. What and where is written above, in the first error message."
        - id: all-device
          text:
            uk: "Усі три — у журналі пристрою: туди пишеться все"
            en: "All three — in the device log: everything goes there"
          why:
            uk: "Збирання відбувається на комп’ютері, до встановлення застосунку: пристрій про нього нічого не знає. А помилку JavaScript у debug-збірці найпростіше прочитати в Metro зі стеком."
            en: "The build runs on the computer, before the app is installed: the device knows nothing about it. And a JavaScript error in a debug build is easiest to read in Metro, with its stack."
      correct: [right]
    explanation:
      uk: "Спершу питай «яка частина зламалася»: JavaScript (Metro), native-код чи система (журнал пристрою), збирання (журнал Gradle/Xcode). Тоді відкривай журнал, у якому ця частина пише."
      en: "First ask “which part broke”: JavaScript (Metro), native code or the system (the device log), the build (the Gradle/Xcode log). Then open the log that part writes to."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: release-no-metro
        from: rn-01-03-env-versions-debug-release
        prompt:
          uk: "У **release**-збірці на телефоні екран кидає помилку JavaScript. Де ти її точно **не** побачиш?"
          en: "In a **release** build on a phone a screen throws a JavaScript error. Where will you certainly **not** see it?"
        answer:
          type: choice
          options:
            - id: metro
              text:
                uk: "У терміналі Metro на комп’ютері"
                en: "In the Metro terminal on the computer"
            - id: device
              text:
                uk: "У журналі пристрою"
                en: "In the device log"
              why:
                uk: "Журнал пристрою працює й для release-збірки: це журнал системи, а не інструмент розробника."
                en: "The device log works for a release build too: it is the system's log, not a developer tool."
            - id: nowhere
              text:
                uk: "Ніде: release-збірка помилок не має"
                en: "Nowhere: a release build has no errors"
              why:
                uk: "Release лише прибирає інструменти розробника — червоний екран і dev-сервер. Помилки в коді нікуди не зникають."
                en: "Release only removes the developer tools — the red screen and the dev server. Errors in the code do not go away."
          correct: [metro]
        explanation:
          uk: "Release-збірка несе зібраний JavaScript у собі й не підключається до Metro. Тому її помилки шукають у журналі пристрою."
          en: "A release build carries its bundled JavaScript inside and never connects to Metro. So its errors are looked for in the device log."

  - id: first-error
    kind: explanation
    title:
      uk: "Перша помилка, а не останній червоний рядок"
      en: "The first error, not the last red line"
    body:
      uk: |
        Журнал збирання описує збій двічі. Спершу — **конкретно**: файл, рядок, налаштування. Потім, наприкінці, — **загально**: у Gradle це блок `FAILURE: Build failed with an exception.` з `* What went wrong:` і `BUILD FAILED`, у Xcode — `Command … failed with a nonzero exit code` і `** BUILD FAILED **`. Останні рядки найпомітніші, але кажуть лише «не вийшло».

        Тож шукай **перший** рядок про помилку (`e:` у Kotlin, `error:` у Xcode, `SyntaxError` від bundler’а) і читай, що він називає:

        - **помилка коду** називає джерельний файл із рядком і стовпчиком (`CaptureModule.kt:41:7`, `habits.ts (8:3)`);
        - **помилка конфігурації** називає налаштування збирання чи середовища: шлях до Android SDK, команду підпису, версію, файл `Info.plist` чи `local.properties`.

        Ще одна підказка — шлях: файл у `node_modules/…` — це не твій код, а бібліотека, і часто причина в її версії.
      en: |
        A build log describes a failure twice. First **specifically**: a file, a line, a setting. Then, at the end, **generally**: in Gradle the block `FAILURE: Build failed with an exception.` with `* What went wrong:` and `BUILD FAILED`, in Xcode `Command … failed with a nonzero exit code` and `** BUILD FAILED **`. The last lines are the most visible, but they only say “it did not work”.

        So look for the **first** error line (`e:` in Kotlin, `error:` in Xcode, `SyntaxError` from the bundler) and read what it names:

        - a **code error** names a source file with a line and a column (`CaptureModule.kt:41:7`, `habits.ts (8:3)`);
        - a **configuration error** names a build or environment setting: the Android SDK path, the signing team, a version, the `Info.plist` or `local.properties` file.

        One more clue is the path: a file in `node_modules/…` is not your code but a library, and the cause is often its version.

  - id: gradle-viewer
    kind: example
    runtime: concept-preview
    dir: gradle-viewer
    entry: main.jsx
    strings:
      shownLog: { uk: "Показано рядків: {shown} з {total}", en: "Lines shown: {shown} of {total}" }
      firstShown: { uk: "Перший показаний рядок", en: "First line shown" }
    title:
      uk: "Переглядач журналу Gradle"
      en: "A Gradle log viewer"
    body:
      uk: |
        `gradleLog.js` — **синтетичний** журнал збирання Android на кількасот рядків, складений у форматі Gradle (бібліотеку `lab-capture` вигадано). `filter.js` каже переглядачу, з якого рядка почати і які рядки сховати. Натисни **Запустити**: у **Консолі** — скільки рядків показано, на сторінці — сам журнал.
      en: |
        `gradleLog.js` is a **synthetic** Android build log of a few hundred lines, assembled in Gradle's format (the `lab-capture` library is made up). `filter.js` tells the viewer which line to start at and which lines to hide. Press **Run**: the **Console** says how many lines are shown, the page shows the log itself.
    tryIt:
      uk: |
        1. У `filter.js` заміни `startAt: null` на `startAt: /^e: /` і запусти: журнал починається з першої помилки Kotlin — файл `CaptureModule.kt`, рядок 41, у `node_modules/lab-capture`.
        2. Тепер заміни `hide: []` на `hide: [/^> Task /, /^w: /]` і запусти: зникають рядки задач і попередження, лишаються 16 рядків: дві помилки `e:` і підсумковий блок `FAILURE`. Рядок `FAILED` самої задачі теж починається з `> Task`, тож і він сховався.
        3. Порівняй перший і останній з показаних рядків: перший називає файл і рядок, останній — лише час збирання.
      en: |
        1. In `filter.js` replace `startAt: null` with `startAt: /^e: /` and run: the log starts at the first Kotlin error — the file `CaptureModule.kt`, line 41, in `node_modules/lab-capture`.
        2. Now replace `hide: []` with `hide: [/^> Task /, /^w: /]` and run: the task lines and the warnings disappear, leaving 16 lines: the two `e:` errors and the closing `FAILURE` block. The task's own `FAILED` line also starts with `> Task`, so it is hidden as well.
        3. Compare the first and the last lines shown: the first names a file and a line, the last only the build time.
    limits:
      uk: "Концептуальний перегляд через react-native-web. Журнал синтетичний і складений для уроку, а не записаний зі справжнього збирання; Gradle тут не запускається. Справжній журнал довший, а його точний текст залежить від версій Gradle, Kotlin і бібліотек."
      en: "A concept preview through react-native-web. The log is synthetic, assembled for the lesson rather than recorded from a real build; Gradle does not run here. A real log is longer, and its exact text depends on the Gradle, Kotlin and library versions."

  - id: xcode-triage
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: xcode-triage
    entry: main.jsx
    editable: [triage.js]
    strings:
      note: { uk: "Нотатка розбору", en: "Triage note" }
      fFirst: { uk: "Перша помилка", en: "First error" }
      fFile: { uk: "Файл", en: "File" }
      fKind: { uk: "Вид", en: "Kind" }
      fNext: { uk: "Наступна команда", en: "Next command" }
    title:
      uk: "Нотатка розбору журналу Xcode"
      en: "A triage note for an Xcode log"
    instructions:
      uk: |
        `xcodeLog.js` — журнал невдалого збирання трекера витрат для iOS. Заповни в `triage.js` нотатку розбору:

        - `firstErrorLine` — **дослівно** перший рядок, що каже, що не так і де;
        - `file` — файл і номер рядка, які він називає;
        - `kind` — `'code'` чи `'configuration'`;
        - `nextCommand` — команда, яка покаже ту саму помилку швидше, ніж ще одне повне збирання Xcode.

        Сторінка показує журнал і твою нотатку поруч.
      en: |
        `xcodeLog.js` is the log of a failed iOS build of the expense tracker. Fill in the triage note in `triage.js`:

        - `firstErrorLine` — **word for word**, the first line that says what is wrong and where;
        - `file` — the file and the line number it names;
        - `kind` — `'code'` or `'configuration'`;
        - `nextCommand` — a command that shows the same error faster than another whole Xcode build.

        The page shows the log and your note side by side.
    testTitles:
      "the first error line names the cause":
        uk: "Перша помилка називає причину"
        en: "The first error line names the cause"
      "the file is the one that line names, with its line number":
        uk: "Файл — той, що названо в цьому рядку, з номером рядка"
        en: "The file is the one that line names, with its line number"
      "the error is classified as a code error":
        uk: "Помилку віднесено до помилок коду"
        en: "The error is classified as a code error"
      "the next command checks the code without a whole Xcode build":
        uk: "Наступна команда перевіряє код без повного збирання Xcode"
        en: "The next command checks the code without a whole Xcode build"
    hints:
      nudge:
        uk: "Знайди кінець журналу й іди вгору, повз рядки, що кажуть лише «не вдалося». Де вперше з’являється назва файлу з номером рядка?"
        en: "Find the end of the log and walk upwards, past the lines that only say “failed”. Where does a file name with a line number appear for the first time?"
      explanation:
        uk: "Рядки `Command … failed` і `** BUILD FAILED **` — підсумок, а не причина. Причину називає повідомлення bundler’а вище, з файлом і позицією `(рядок:стовпчик)`. Якщо файл — твій джерельний код, це помилка коду, і її можна побачити без Xcode: той самий bundler запускає `npx expo export` (його ти бачив у RN-01), а синтаксис TypeScript перевіряє `npx tsc --noEmit`. Наприклад, для журналу, де перша помилка — `SyntaxError … src/wishes.ts: Unexpected token (8:3)`, нотатка назве `src/wishes.ts:8` і вид `code`."
        en: "The lines `Command … failed` and `** BUILD FAILED **` are a summary, not the cause. The bundler's message above names the cause, with a file and a `(line:column)` position. If the file is your source code, it is a code error, and you can see it without Xcode: `npx expo export` runs the same bundler (you met it in RN-01), and `npx tsc --noEmit` checks TypeScript syntax. For example, for a log whose first error is `SyntaxError … src/wishes.ts: Unexpected token (8:3)`, the note names `src/wishes.ts:8` and the kind `code`."
    solutionNote:
      uk: "Перша помилка — рядок `SyntaxError` від bundler’а: файл `src/expenseTotals.ts`, рядок 13, стовпчик 71 (бракує дужки перед `, 0`). Це помилка коду в твоєму файлі, а не налаштування Xcode. `npx expo export --platform ios` показує її за секунди: у нашому проєкті він надрукував саме цей рядок. `npx tsc --noEmit` теж годиться — він повідомив `src/expenseTotals.ts(13,72): error TS1005: ')' expected.`"
      en: "The first error is the bundler's `SyntaxError` line: the file `src/expenseTotals.ts`, line 13, column 71 (a bracket is missing before `, 0`). It is a code error in your file, not an Xcode setting. `npx expo export --platform ios` shows it in seconds: in our project it printed exactly this line. `npx tsc --noEmit` works too — it reported `src/expenseTotals.ts(13,72): error TS1005: ')' expected.`"
    feedback:
      - when: { test: "the first error line names the cause" }
        message:
          uk: "Ця перевірка очікує в `firstErrorLine` рядок, що містить і назву файлу `expenseTotals.ts`, і текст `Unexpected token`. Рядки `Command PhaseScriptExecution failed…` і `** BUILD FAILED **` — підсумок наприкінці, вони причини не називають. Скопіюй рядок цілком, у лапках."
          en: "This check expects `firstErrorLine` to hold a line containing both the file name `expenseTotals.ts` and the text `Unexpected token`. The lines `Command PhaseScriptExecution failed…` and `** BUILD FAILED **` are the summary at the end; they do not name the cause. Copy the whole line, in quotes."
      - when: { test: "the file is the one that line names, with its line number" }
        message:
          uk: "Ця перевірка очікує в `file` назву `expenseTotals.ts` і номер рядка 13 — перше число в дужках `(13:71)`."
          en: "This check expects `file` to hold the name `expenseTotals.ts` and the line number 13 — the first number in the brackets `(13:71)`."
      - when: { test: "the error is classified as a code error" }
        message:
          uk: "Ця перевірка очікує `kind: 'code'`. Рядок називає джерельний файл із рядком і стовпчиком — це помилка коду. Помилка конфігурації назвала б налаштування збирання: команду підпису, версію, `Info.plist`."
          en: "This check expects `kind: 'code'`. The line names a source file with a line and a column — that is a code error. A configuration error would name a build setting: the signing team, a version, `Info.plist`."
      - when: { test: "the next command checks the code without a whole Xcode build" }
        message:
          uk: "Ця перевірка очікує команду, що запускає той самий bundler (`npx expo export …`) або перевірку TypeScript (`npx tsc --noEmit`). `pod install` чи нове `npx expo run:ios` знову проходять усе native-збирання, а помилка не в ньому."
          en: "This check expects a command that runs the same bundler (`npx expo export …`) or the TypeScript check (`npx tsc --noEmit`). `pod install` or another `npx expo run:ios` go through the whole native build again, and the error is not there."
      - when: { error: SyntaxError }
        message:
          uk: "`triage.js` не запускається — перевір лапки й коми між значеннями. Рядок журналу сам містить подвійні лапки (`expected \",\"`), тож бери його в одинарні лапки `'…'`."
          en: "`triage.js` does not start — check the quotes and the commas between the values. The log line itself contains double quotes (`expected \",\"`), so wrap it in single quotes `'…'`."
    limits:
      uk: "Концептуальний перегляд через react-native-web: Xcode тут не запускається. Рядки bundler’а в журналі — справжній вивід `npx expo export --platform ios` для цього файлу (шлях скорочено); рядки Xcode навколо них синтетичні, у форматі Xcode. Справжній журнал Xcode довший і залежить від версії Xcode."
      en: "A concept preview through react-native-web: Xcode does not run here. The bundler lines in the log are the real output of `npx expo export --platform ios` for this file (path shortened); the Xcode lines around them are synthetic, in Xcode's format. A real Xcode log is longer and depends on the Xcode version."

  - id: to-project
    kind: transfer
    capstoneStep: RN-07
    body:
      uk: "У кроці проєкту цього розділу ти налагодиш один справжній локальний збій свого native-підпроєкту. Почни так само: визнач, яка частина зламалася, відкрий її журнал і запиши перший рядок, що називає файл чи налаштування, — до того, як щось змінювати."
      en: "In this unit's project step you debug one real local failure of your native subproject. Start the same way: decide which part broke, open its log and write down the first line that names a file or a setting — before you change anything."
