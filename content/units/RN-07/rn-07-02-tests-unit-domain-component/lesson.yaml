id: rn-07-02-tests-unit-domain-component
unit: RN-07
title:
  uk: "Тести: unit, типізований домен, компоненти, інтеграція"
  en: "Unit, typed-domain, component and integration tests"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Віднести перевірку до правильного рівня: unit (чиста доменна функція), типізований домен (типи й перевірка під час виконання узгоджені), компонент (показаний екран відповідає на дії користувача) чи інтеграція (екран, адаптер і mock-сервіс разом)."
    en: "Place a given check at the right level: unit (pure domain function), typed-domain (types and runtime validation agree), component (a rendered screen responds to user actions) or integration (screen, adapter and mock service together)."
  - uk: "Написати компонентний тест, який знаходить native-елемент за доступною назвою чи роллю й перевіряє те, що бачить користувач, а не внутрішній стан."
    en: "Write a component test that finds a native element by its accessible label or role and asserts on what the user sees, not on internal state."
prerequisites: [rn-07-01-native-logs-build-errors, re-06-08-testing-user-actions]
subskills:
  - { family: N-10, skill: "unit/typed-domain/component/integration tests", depth: intro }
glossary: [type-level-test, native-component-test]
selfCheck: [predict-which-fails, habit-test]

blocks:
  - id: four-levels
    kind: explanation
    title:
      uk: "Чотири рівні тестів — і всі на комп’ютері"
      en: "Four test levels — all on the computer"
    body:
      uk: |
        У native-проєкті Expo тести запускає **Jest** з налаштуванням `jest-expo`, а екрани показує бібліотека **React Native Testing Library** (RNTL). Рівні ті самі, що ти знаєш з JS-09 і RE-06:

        | Рівень | Що перевіряє | Приклад для планувальника |
        |---|---|---|
        | unit | чисту доменну функцію | `countDueTasks(tasks, "2026-03-02")` дає 2 |
        | типізований домен | що типи й перевірка під час виконання кажуть одне | `tsc` відхиляє `priority: "urgent"` у коді, а `validateTask` — у збереженому JSON |
        | компонент | показаний екран відповідає на дії | натиснути перемикач рядка — статус став «Виконано» |
        | інтеграція | екран + адаптер + mock-сервіс | після натискання сервіс отримав `done: true` |

        Типізований домен має дві половини. [[type-level-test|Тест на рівні типів]] перевіряє `tsc`, а не запуск. Але `JSON.parse` повертає дані без типів, тож збережений JSON ловить лише перевірка під час виконання.

        Головне: усі чотири рівні працюють **у Node.js на комп’ютері**. Документація React Native 0.86 (сторінка [«Testing»](https://reactnative.dev/docs/0.86/testing-overview)) прямо пише, що [[native-component-test|компонентні тести]] не зачіпають iOS- чи Android-код за компонентами.
      en: |
        In an Expo native project tests are run by **Jest** with the `jest-expo` preset, and screens are rendered by the **React Native Testing Library** (RNTL). The levels are the ones you know from JS-09 and RE-06:

        | Level | What it checks | Planner example |
        |---|---|---|
        | unit | a pure domain function | `countDueTasks(tasks, "2026-03-02")` gives 2 |
        | typed domain | that the types and the run-time check say the same | `tsc` refuses `priority: "urgent"` in code, `validateTask` refuses it in stored JSON |
        | component | a rendered screen responds to actions | press a row's toggle — the status becomes “Done” |
        | integration | screen + adapter + mock service | after the press the service received `done: true` |

        The typed domain has two halves. A [[type-level-test]] is checked by `tsc`, not by running. But `JSON.parse` returns data without types, so stored JSON is caught only by the run-time check.

        The main point: all four levels run **in Node.js on the computer**. The React Native 0.86 documentation (the [“Testing”](https://reactnative.dev/docs/0.86/testing-overview) page) says plainly that [[native-component-test|component tests]] do not touch the iOS or Android code behind the components.

  - id: levels-picture
    kind: visual
    visual: diagram
    title:
      uk: "Найменша коробка, що ловить дефект"
      en: "The smallest box that catches a defect"
    textEquivalent:
      uk: "Чотири рівні тестів працюють у Jest на комп’ютері: доменна функція, типи з валідатором, показаний екран і екран з адаптером та mock-сервісом. Окремо стоїть пристрій. Неправильна сума ловиться unit-тестом доменної функції. Збережений JSON із пріоритетом urgent — лише перевіркою під час виконання у валідаторі; тип tsc його не бачить. Перейменована доступна назва перемикача ламає компонентний тест (і інтеграційний, бо він шукає за тією самою назвою). Адаптер, що зберігає не той запис, ловить лише інтеграційний тест. Справа, що зникла після перезапуску застосунку, не потрапляє в жодну з чотирьох коробок: це видно лише на пристрої."
      en: "Four test levels run in Jest on the computer: the domain function, the types with their validator, the rendered screen, and the screen with the adapter and the mock service. The device stands apart. A wrong total is caught by the unit test of the domain function. Stored JSON with priority urgent is caught only by the run-time check in the validator; the tsc type never sees it. A renamed accessible label of the toggle breaks the component test (and the integration test, because it searches by the same label). An adapter that saves the wrong record is caught only by the integration test. A task that disappears after the app restarts falls into none of the four boxes: only the device shows it."
    spec:
      layout: lr
      groups:
        - { id: host, label: { uk: "Jest на комп’ютері", en: "Jest on the computer" } }
        - { id: device, label: { uk: "Пристрій", en: "Device" } }
      nodes:
        - { id: unit, group: host, label: { uk: "доменна функція", en: "domain function" } }
        - { id: typed, group: host, label: { uk: "типи + валідатор", en: "types + validator" } }
        - { id: component, group: host, label: { uk: "показаний екран", en: "rendered screen" } }
        - { id: integration, group: host, label: { uk: "екран + адаптер", en: "screen + adapter" } }
        - { id: phone, group: device, label: { uk: "телефон", en: "phone" }, shape: round }
      edges:
        - { id: up1, from: unit, to: typed, kind: dashed }
        - { id: up2, from: typed, to: component, kind: dashed }
        - { id: up3, from: component, to: integration, kind: dashed }
      steps:
        - caption:
            uk: "Чотири коробки зліва — рівні тестів; усі вони працюють у Jest на комп’ютері. Праворуч — пристрій, до якого жоден із них не дістає."
            en: "The four boxes on the left are the test levels; all of them run in Jest on the computer. On the right is the device, which none of them reaches."
        - caption:
            uk: "Дефект 1: `countDueTasks` порівнює `<` замість `<=`. Його ловить найменша коробка — unit-тест доменної функції."
            en: "Defect 1: `countDueTasks` compares with `<` instead of `<=`. The smallest box catches it — the unit test of the domain function."
          highlight: [unit]
        - caption:
            uk: "Дефект 2: у сховищі лежить JSON з `\"priority\": \"urgent\"`. Тип `tsc` його не бачить — ловить лише перевірка `validateTask` під час виконання."
            en: "Defect 2: storage holds JSON with `\"priority\": \"urgent\"`. The `tsc` type never sees it — only the run-time `validateTask` check catches it."
          highlight: [typed]
        - caption:
            uk: "Дефект 3: доступну назву перемикача перейменовано. Падає компонентний тест — і інтеграційний теж, бо шукає перемикач за тією самою назвою."
            en: "Defect 3: the toggle's accessible label was renamed. The component test fails — and so does the integration test, because it finds the toggle by the same label."
          highlight: [component, integration]
        - caption:
            uk: "Дефект 4: адаптер зберігає зміну не в той запис. Екран показує «Збережено», тож компонентний тест мовчить; ловить лише інтеграційний."
            en: "Defect 4: the adapter saves the change into the wrong record. The screen says “Saved”, so the component test stays quiet; only the integration test catches it."
          highlight: [integration]
        - caption:
            uk: "Дефект 5: після перезапуску застосунку виконана справа знову не виконана. Жодна коробка Jest цього не бачить — це видно лише на пристрої."
            en: "Defect 5: after the app restarts, a done task is pending again. No Jest box sees this — only the device shows it."
          highlight: [phone]
          dim: [unit, typed, component, integration]

  - id: predict-which-fails
    kind: prediction
    prompt:
      uk: |
        У проєкті планувальника чотири тести:

        - **A** — unit: `countDueTasks(tasks, "2026-03-02")` дає 2;
        - **B** — лише типи: файл із `// @ts-expect-error` над `priority: "urgent"`, його перевіряє `tsc`;
        - **C** — компонент: натиснути перемикач рядка, знайдений за доступною назвою, і побачити «Виконано»;
        - **D** — інтеграція: те саме натискання на екрані з адаптером і mock-сервісом, потім «Збережено» й `done: true` у сервісі.

        Три дефекти, кожен окремо: (1) у `countDueTasks` `<=` замінили на `<`; (2) на телефоні в сховищі лежить JSON із `"priority": "urgent"`; (3) доступну назву перемикача перейменували. Які тести впадуть?
      en: |
        A planner project has four tests:

        - **A** — unit: `countDueTasks(tasks, "2026-03-02")` gives 2;
        - **B** — types only: a file with `// @ts-expect-error` above `priority: "urgent"`, checked by `tsc`;
        - **C** — component: press a row's toggle found by its accessible label and see “Done”;
        - **D** — integration: the same press on the screen with the adapter and the mock service, then “Saved” and `done: true` in the service.

        Three defects, each on its own: (1) `<=` in `countDueTasks` was replaced with `<`; (2) the phone's storage holds JSON with `"priority": "urgent"`; (3) the toggle's accessible label was renamed. Which tests fail?
    runnable: false
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "(1) лише A · (2) жоден · (3) C і D"
            en: "(1) only A · (2) none · (3) C and D"
        - id: types-catch-json
          text:
            uk: "(1) лише A · (2) B · (3) лише C"
            en: "(1) only A · (2) B · (3) only C"
          why:
            uk: "`tsc` перевіряє код, а не дані на телефоні: збережений JSON він ніколи не бачить, тож B лишається зеленим. А D шукає перемикач за тією самою назвою, що й C, — тому падає теж."
            en: "`tsc` checks code, not data on a phone: it never sees the stored JSON, so B stays green. And D finds the toggle by the same label as C — so it fails too."
        - id: all-integration
          text:
            uk: "(1) A і D · (2) жоден · (3) C і D"
            en: "(1) A and D · (2) none · (3) C and D"
          why:
            uk: "Інтеграційний тест D перевіряє збереження натискання, а не кількість справ на сьогодні: `countDueTasks` у ньому не викликається."
            en: "The integration test D checks that the press is saved, not the number of tasks due today: it never calls `countDueTasks`."
        - id: label-on-phone
          text:
            uk: "(1) лише A · (2) жоден · (3) жоден: назва потрібна лише програмі зчитування з екрана на телефоні"
            en: "(1) only A · (2) none · (3) none: the label only matters to a screen reader on the phone"
          why:
            uk: "C і D знаходять перемикач саме за доступною назвою — як людина з програмою зчитування з екрана. Нова назва — і `getByLabelText` нічого не знаходить."
            en: "C and D find the toggle exactly by its accessible label — the way a person with a screen reader does. A new label, and `getByLabelText` finds nothing."
      correct: [right]
    explanation:
      uk: "Кожен дефект ловить найменша коробка, що його «бачить». Дані на пристрої не бачить жоден тест у Jest: щоб упіймати поганий збережений JSON, потрібен тест, що проганяє `validateTask` по такому JSON, — саме такий тест є в наборі цього уроку."
      en: "Each defect is caught by the smallest box that “sees” it. No test in Jest sees data on a device: to catch bad stored JSON you need a test that runs `validateTask` on such JSON — this lesson's suite has exactly such a test."

  - id: planner-suite
    kind: example
    runtime: concept-preview
    dir: planner-suite
    entry: main.jsx
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      markDone: { uk: "Позначити виконаною", en: "Mark as done" }
      done: { uk: "Виконано", en: "Done" }
      pending: { uk: "Не виконано", en: "Pending" }
      saved: { uk: "Збережено", en: "Saved" }
      loading: { uk: "Завантаження…", en: "Loading…" }
      tUnit: { uk: "unit: countDueTasks рахує справи до сьогодні", en: "unit: countDueTasks counts tasks due by today" }
      tTyped: { uk: "типи: validateTask відхиляє збережений priority urgent", en: "typed: validateTask refuses a stored priority urgent" }
      tComponent: { uk: "компонент: перемикач показує «Виконано»", en: "component: the toggle shows Done" }
      tIntegration: { uk: "інтеграція: натискання доходить до сервісу", en: "integration: the press reaches the service" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rNotFound: { uk: "на екрані немає", en: "not on the screen:" }
      rStillMissing: { uk: "так і не з’явилося", en: "never appeared" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Чотири рівні в тестовому перегляді"
      en: "Four levels in the test preview"
    body:
      uk: |
        `planner.test.jsx` — чотири тести, по одному на рівень. Їх запускає `testing.js` — **імітація** Jest і React Native Testing Library 14 для цього перегляду: назви ті самі (`render`, `screen.getByLabelText`, `userEvent.setup().press`, `toBeOnTheScreen`), тож у справжньому проєкті зміниться лише рядок `import`. `mockService.js` — mock-сервіс з RN-06, тут у пам’яті.

        Натисни **Запустити** й відкрий **Консоль**: чотири рядки `✓`.
      en: |
        `planner.test.jsx` holds four tests, one per level. They are run by `testing.js` — a **simulation** of Jest and React Native Testing Library 14 for this preview: the names are the same (`render`, `screen.getByLabelText`, `userEvent.setup().press`, `toBeOnTheScreen`), so in a real project only the `import` line changes. `mockService.js` is the mock service from RN-06, kept in memory here.

        Press **Run** and open the **Console**: four `✓` lines.
    tryIt:
      uk: |
        1. У `tasks.js` заміни `task.dueDate <= today` на `task.dueDate < today` і запусти: червоним стає лише unit-тест (`очікувалося 2, отримано 1`). Поверни `<=`.
        2. У `TaskRow.jsx` зміни `%%markDone%%` у `accessibilityLabel` на інше слово й запусти: падають компонентний **і** інтеграційний тести — обидва шукають перемикач за цією назвою. Поверни як було.
        3. Подивись у `planner.test.jsx` на коментар до другого тесту: половину «лише типи» тут перевірити не можна — перегляд прибирає типи й нічого не перевіряє. Її перевіряє `tsc` у локальному проєкті.
      en: |
        1. In `tasks.js` replace `task.dueDate <= today` with `task.dueDate < today` and run: only the unit test turns red (`expected 2, got 1`). Put `<=` back.
        2. In `TaskRow.jsx` change `%%markDone%%` in `accessibilityLabel` to another word and run: the component test **and** the integration test fail — both find the toggle by this label. Put it back.
        3. Look at the comment on the second test in `planner.test.jsx`: the “types only” half cannot be checked here — the preview strips types and checks nothing. `tsc` checks it in a local project.
    limits:
      uk: "Концептуальний перегляд: компоненти малює react-native-web у браузері, а `testing.js` лише імітує Jest і React Native Testing Library. Справжні тести працюють у Node.js і рендерять host-компоненти React Native без браузера й без телефона — так само без native-рендерингу, без native-модулів, без справжнього сховища й без перезапуску застосунку. Типи тут не перевіряються."
      en: "A concept preview: react-native-web draws the components in the browser, and `testing.js` only simulates Jest and React Native Testing Library. Real tests run in Node.js and render React Native host components with no browser and no phone — likewise without native rendering, native modules, real storage or an app restart. Types are not checked here."

  - id: what-a-test-sees
    kind: explanation
    title:
      uk: "Що бачить компонентний тест"
      en: "What a component test sees"
    body:
      uk: |
        Компонентний тест шукає елементи так, як їх знаходить людина з програмою зчитування з екрана: `screen.getByRole("button", { name: … })`, `screen.getByLabelText(…)`, `screen.getByText(…)`. Тоді діє (`await user.press(…)`) і перевіряє **видимий текст**, а не `useState`.

        Ось що надрукував справжній Jest (jest-expo 57, RNTL 14.0.1) у нашому проєкті, коли тест шукав назву `Mark done: Water the plants`, а в рядку вона `Mark as done: Water the plants` (уривок, кольори прибрано):

        ```text
        ✕ pressing the toggle marks the task done (72 ms)
        Unable to find an element with accessibility label: Mark done: Water the plants

        <View>
          <Text>
            Water the plants
          </Text>
          …
          <View
            accessibilityLabel="Mark as done: Water the plants"
            accessibilityRole="button"
            accessible={true}
          >
        ```

        Бачиш, що «екран» тесту — це дерево `View` і `Text` з їхніми props, а не пікселі телефона. `Pressable` тут — просто `View` з роллю й назвою.
      en: |
        A component test finds elements the way a person with a screen reader finds them: `screen.getByRole("button", { name: … })`, `screen.getByLabelText(…)`, `screen.getByText(…)`. Then it acts (`await user.press(…)`) and checks the **visible text**, not `useState`.

        Here is what real Jest (jest-expo 57, RNTL 14.0.1) printed in our project when the test looked for the label `Mark done: Water the plants` while the row has `Mark as done: Water the plants` (an excerpt, colours removed):

        ```text
        ✕ pressing the toggle marks the task done (72 ms)
        Unable to find an element with accessibility label: Mark done: Water the plants

        <View>
          <Text>
            Water the plants
          </Text>
          …
          <View
            accessibilityLabel="Mark as done: Water the plants"
            accessibilityRole="button"
            accessible={true}
          >
        ```

        You can see that the test's “screen” is a tree of `View` and `Text` with their props, not a phone's pixels. `Pressable` here is just a `View` with a role and a label.

  - id: habit-test
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: habit-test
    entry: main.jsx
    editable: [HabitRow.test.jsx]
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      markToday: { uk: "Виконано сьогодні", en: "Done today" }
      doneToday: { uk: "Сьогодні виконано", en: "Completed today" }
      notYet: { uk: "Сьогодні ще ні", en: "Not yet today" }
      tPress: { uk: "кнопка позначає звичку виконаною сьогодні", en: "the button marks the habit completed today" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rNotFound: { uk: "на екрані немає", en: "not on the screen:" }
      rStillMissing: { uk: "так і не з’явилося", en: "never appeared" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Компонентний тест кнопки звички"
      en: "A component test for the habit button"
    instructions:
      uk: |
        `HabitRow.jsx` — рядок трекера звичок: назва, статус і кнопка. Для дня, коли звичку ще не виконано, статус — «%%notYet%%»; натискання кнопки змінює його на «%%doneToday%%». Доступна назва кнопки — «%%markToday%%: %%exercise%%» для звички «%%exercise%%».

        Напиши в `HabitRow.test.jsx` тест, який:

        - показує `HabitRow` для звички `habit` (вона вже є у файлі) з `today="2026-03-02"`;
        - знаходить кнопку **за доступною назвою чи роллю з назвою** і натискає її;
        - перевіряє, що користувач бачить «%%doneToday%%».

        Перевірки запускають твій тест із правильним `HabitRow` і з двома зламаними копіями: в одній статус не змінюється, в іншій у кнопки немає доступної назви. На кожній зламаній копії твій тест має впасти.
      en: |
        `HabitRow.jsx` is a habit tracker row: the name, the status and a button. On a day when the habit is not done yet, the status is “%%notYet%%”; pressing the button changes it to “%%doneToday%%”. The button's accessible label is “%%markToday%%: %%exercise%%” for the habit “%%exercise%%”.

        Write a test in `HabitRow.test.jsx` that:

        - renders `HabitRow` for the habit `habit` (it is already in the file) with `today="2026-03-02"`;
        - finds the button **by its accessible label, or by its role with that name**, and presses it;
        - checks that the user sees “%%doneToday%%”.

        The checks run your test with the correct `HabitRow` and with two broken copies: in one the status does not change, in the other the button has no accessible label. On each broken copy your test must fail.
    testTitles:
      "your test passes with the correct HabitRow":
        uk: "Твій тест проходить із правильним `HabitRow`"
        en: "Your test passes with the correct `HabitRow`"
      "your test fails when the status text does not change":
        uk: "Твій тест падає, коли текст статусу не змінюється"
        en: "Your test fails when the status text does not change"
      "your test fails when the button has no accessible label":
        uk: "Твій тест падає, коли в кнопки немає доступної назви"
        en: "Your test fails when the button has no accessible label"
    hints:
      nudge:
        uk: "Пройди сценарій як людина з програмою зчитування з екрана: як вона знаходить кнопку, що робить і за чим на екрані розуміє, що вийшло?"
        en: "Walk through the scenario as a person with a screen reader: how do they find the button, what do they do, and by what on the screen do they know it worked?"
      explanation:
        uk: |
          Тест — `async`: спершу `const user = userEvent.setup();` і `await render(…)` з потрібними props. Кнопку знаходить `screen.getByLabelText("…")` з повною доступною назвою (або `screen.getByRole("button", { name: "…" })`), натискає `await user.press(…)`. Наприкінці — `expect(screen.getByText("…")).toBeOnTheScreen()`.

          Схоже, з іншим рядком: `await render(<WishRow wish={lamp} />); await user.press(screen.getByLabelText("Отримано: Настільна лампа")); expect(screen.getByText("Отримано")).toBeOnTheScreen();`.
        en: |
          The test is `async`: first `const user = userEvent.setup();` and `await render(…)` with the right props. `screen.getByLabelText("…")` with the full accessible label finds the button (or `screen.getByRole("button", { name: "…" })`), `await user.press(…)` presses it. At the end, `expect(screen.getByText("…")).toBeOnTheScreen()`.

          Similar, with another row: `await render(<WishRow wish={lamp} />); await user.press(screen.getByLabelText("Acquired: Desk lamp")); expect(screen.getByText("Acquired")).toBeOnTheScreen();`.
    solutionNote:
      uk: "Тест знаходить кнопку так, як її знайде людина з програмою зчитування з екрана, — за доступною назвою, — і перевіряє лише видимий текст. Тому він падає, коли назву прибрали (`getByLabelText` нічого не знаходить), і коли статус не змінився (нового тексту немає). Перевірка «%%notYet%%» до натискання не обов’язкова, але показує, що тест починає з правильного стану."
      en: "The test finds the button the way a person with a screen reader will — by its accessible label — and checks only the visible text. So it fails when the label is gone (`getByLabelText` finds nothing) and when the status did not change (the new text is not there). The “%%notYet%%” check before the press is optional but shows the test starts from the right state."
    feedback:
      - when: { test: "your test passes with the correct HabitRow" }
        message:
          uk: "Ця перевірка запускає твої тести з правильним `HabitRow` і очікує щонайменше один тест, і жоден не має впасти. Подивись у **Консоль**: рядок `✗` каже, який тест упав і чому. Якщо там `на екрані немає` з назвою чи текстом — порівняй їх із умовою літера в літеру. Якщо `… is not defined` — додай цю назву в `import` на початку файла. Перевірка нового статусу має стояти **після** `await user.press(…)`."
          en: "This check runs your tests with the correct `HabitRow` and expects at least one test, none of them failing. Look at the **Console**: a `✗` line says which test failed and why. If it says `not on the screen:` with a label or a text, compare them with the task letter by letter. If it says `… is not defined`, add that name to the `import` at the top of the file. The check of the new status must come **after** `await user.press(…)`."
      - when: { test: "your test fails when the status text does not change" }
        message:
          uk: "Спершу твій тест має пройти з правильним `HabitRow` (перша перевірка). Ця перевірка підставляє копію, де натискання не змінює статус, і очікує, що тест упаде. Отже, після натискання тест має перевірити текст «%%doneToday%%» на екрані — а не лише те, що кнопка існує."
          en: "First your test must pass with the correct `HabitRow` (the first check). This check puts in a copy where the press does not change the status and expects the test to fail. So after the press the test must check the text “%%doneToday%%” on the screen — not just that the button exists."
      - when: { test: "your test fails when the button has no accessible label" }
        message:
          uk: "Спершу твій тест має пройти з правильним `HabitRow` (перша перевірка). Ця перевірка підставляє копію, де в кнопки немає доступної назви, і очікує, що тест упаде. Якщо тест шукає кнопку за символом `○`, він її знайде й без назви — шукай за назвою «%%markToday%%: %%exercise%%»."
          en: "First your test must pass with the correct `HabitRow` (the first check). This check puts in a copy whose button has no accessible label and expects the test to fail. If the test finds the button by the `○` symbol, it finds it without a label too — search by the label “%%markToday%%: %%exercise%%”."
    limits:
      uk: "Перевірки працюють в імітації React Native Testing Library на react-native-web у браузері. Справжня бібліотека рендерить host-компоненти в Node.js; жодна з них не показує, як кнопку озвучить TalkBack чи VoiceOver на телефоні — це перевіряють лише на пристрої."
      en: "The checks run in a simulation of React Native Testing Library on react-native-web in the browser. The real library renders host components in Node.js; neither shows how TalkBack or VoiceOver will announce the button on a phone — that is checked only on a device."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: wait-for-visible
        from: re-06-08-testing-user-actions
        prompt:
          uk: "Після натискання «Зберегти» список оновлюється лише тоді, коли сервер-фікстура відповість (через 300 мс). Який рядок у тесті правильно чекає на результат?"
          en: "After pressing “Save” the list updates only when the fixture server answers (after 300 ms). Which line in the test waits for the result correctly?"
        answer:
          type: choice
          options:
            - id: find
              code: "await screen.findByText(\"Обід — 210.50\");"
            - id: sleep
              code: "await sleep(350); expect(screen.getByText(\"Обід — 210.50\")).toBeOnTheScreen();"
              why:
                uk: "Пауза вгадує час: на повільнішому комп’ютері чи з повільнішою фікстурою тест почне падати, а на швидкому — чекатиме зайве."
                en: "A pause guesses the time: with a slower computer or fixture the test starts failing, and on a fast one it waits for nothing."
            - id: state
              code: "expect(component.state.expenses).toHaveLength(3);"
              why:
                uk: "Людина не бачить стану компонента. Тест дій користувача перевіряє видиме — текст рядка в списку."
                en: "A person does not see a component's state. A user-action test checks what is visible — the row's text in the list."
          correct: [find]
        explanation:
          uk: "`findBy…` перевіряє екран знову й знову, доки текст не з’явиться, і повертається одразу, щойно він є. Так само чекають і в тестах React Native."
          en: "`findBy…` checks the screen again and again until the text appears and returns as soon as it is there. Tests in React Native wait the same way."

  - id: to-project
    kind: transfer
    capstoneStep: RN-07
    body:
      uk: "У кроці проєкту цього розділу ти додаси в native-підпроєкт тести всіх рівнів: unit-тест похідного значення свого домену (`summarizeItems`, `countDueTasks`, `summarizeHabit` чи `summarizeExpenses`) з фіксованою датою, тест типізованої перевірки збереженого JSON (`validateItem`, `validateTask`, `validateHabit` чи `validateExpense`) і компонентний тест головної дії рядка, знайденої за доступною назвою."
      en: "In this unit's project step you add tests of every level to the native subproject: a unit test of your domain's derived value (`summarizeItems`, `countDueTasks`, `summarizeHabit` or `summarizeExpenses`) with a fixed date, a typed-validation test for stored JSON (`validateItem`, `validateTask`, `validateHabit` or `validateExpense`) and a component test of the row's main action, found by its accessible label."
