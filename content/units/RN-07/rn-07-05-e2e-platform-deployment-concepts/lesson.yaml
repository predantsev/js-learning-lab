id: rn-07-05-e2e-platform-deployment-concepts
unit: RN-07
title:
  uk: "E2E, покриття платформ і поняття розгортання"
  en: "E2E, platform coverage and deployment concepts"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Заповнити матрицю покриття платформ для однієї функції: які перевірки виконано на заявленій цілі, які спираються на наданий доказ для іншої платформи, а які лишаються не виконаними."
    en: "Fill a platform coverage matrix for one feature: which checks run on the declared target, which rely on supplied evidence for the other platform, and which stay unperformed."
  - uk: "Описати, що E2E-тест на емуляторі додає до компонентних тестів, і назвати кроки розгортання (збирання, підпис, поширення), не вимагаючи публікації в магазині."
    en: "Describe what an E2E test on an emulator adds over component tests, and name the deployment steps (build, sign, distribute) without requiring a store publication."
prerequisites: [rn-07-04-crash-diagnosis, rn-02-06-platform-differences]
subskills:
  - { family: N-10, skill: "E2E and platform difference coverage", depth: intro }
glossary: [platform-coverage-matrix]
selfCheck: [predict-cells, e2e-flow]

blocks:
  - id: e2e-and-matrix
    kind: explanation
    title:
      uk: "Що додає E2E і де записати, що перевірено"
      en: "What E2E adds, and where to record what was checked"
    body:
      uk: |
        [[end-to-end-test|E2E-тест]] керує **справжнім** застосунком на емуляторі чи пристрої: запускає його, натискає видимі кнопки, вводить текст, перезапускає й дивиться на екран. Документація React Native 0.86 (сторінка [«Testing»](https://reactnative.dev/docs/0.86/testing-overview)) називає для цього Detox, Appium і Maestro. Такий тест бачить те, чого не бачить Jest: native-рендеринг, навігацію платформи, сховище після перезапуску. Але він повільний і крихкий, тож E2E мало — лише на головні шляхи.

        Щоб не плутати, де що перевірено, веди [[platform-coverage-matrix|матрицю покриття платформ]]: рядки — функції, стовпчики — **Jest на комп’ютері**, **заявлена ціль**, **інша платформа**. У клітинці — «перевірено» (із записом), «наданий доказ» (чужий запуск, не твій), «не виконано» або «—» (там цього не перевірити).

        React Native ділить код між платформами, але не ділить їхню поведінку — як ти бачив у RN-02: тінь, кнопка «назад», клавіатура. Тому стовпчик іншої платформи не заповнюється сам.
      en: |
        An [[end-to-end-test|E2E test]] drives the **real** app on an emulator or a device: starts it, presses visible buttons, types text, restarts it and looks at the screen. The React Native 0.86 documentation (the [“Testing”](https://reactnative.dev/docs/0.86/testing-overview) page) names Detox, Appium and Maestro for this. Such a test sees what Jest does not: native rendering, platform navigation, storage after a restart. But it is slow and fragile, so keep E2E few — only the main paths.

        To keep track of what was checked where, keep a [[platform-coverage-matrix]]: rows are features, columns are **Jest on the computer**, **the declared target**, **the other platform**. A cell says “verified” (with a record), “supplied evidence” (someone else's run, not yours), “not performed”, or “—” (it cannot be checked there).

        React Native shares code between platforms but not their behavior — as you saw in RN-02: shadows, the back button, keyboards. So the other platform's column does not fill itself.

  - id: matrix-picture
    kind: visual
    visual: diagram
    title:
      uk: "Матриця заповнюється по місцях перевірки"
      en: "The matrix fills place by place"
    textEquivalent:
      uk: "Матриця з двох функцій трекера звичок — серія й збереження після перезапуску — і трьох стовпчиків (на картинці її повернуто набік, тож там вони стоять рядками): Jest на комп’ютері, заявлена ціль (емулятор Android) та інша платформа (iOS). Зелений unit-тест серії заповнює лише клітинку серії в стовпчику Jest. Перезапуск у Jest не перевірити, тож та клітинка — прочерк. Ручна перевірка на емуляторі заповнює обидві клітинки стовпчика цілі. Коли iOS на цьому комп’ютері недоступна, обидві клітинки стовпчика іншої платформи отримують запис про пропуск, а не позначку «перевірено». Жоден зелений тест у Jest не заповнює стовпчика пристрою."
      en: "A matrix of two habit tracker features — the streak and persistence across a restart — and three columns (the picture is turned on its side, so there they appear as rows): Jest on the computer, the declared target (an Android emulator) and the other platform (iOS). A green unit test of the streak fills only the streak cell in the Jest column. A restart cannot be checked in Jest, so that cell is a dash. A manual check on the emulator fills both cells of the target column. When iOS is unavailable on this computer, both cells of the other platform’s column get a skip record, not a “verified” mark. No green test in Jest fills a device column."
    spec:
      layout: grid
      nodes:
        - { id: s-host, label: { uk: "Jest · серія", en: "Jest · streak" }, col: 0, row: 0 }
        - { id: r-host, label: { uk: "Jest · сховище", en: "Jest · storage" }, col: 1, row: 0 }
        - { id: s-target, label: { uk: "ціль · серія", en: "target · streak" }, col: 0, row: 1 }
        - { id: r-target, label: { uk: "ціль · сховище", en: "target · storage" }, col: 1, row: 1 }
        - { id: s-other, label: { uk: "iOS · серія", en: "iOS · streak" }, col: 0, row: 2 }
        - { id: r-other, label: { uk: "iOS · сховище", en: "iOS · storage" }, col: 1, row: 2 }
      steps:
        - caption:
            uk: "Матриця для двох функцій трекера звичок (серія і сховище — збереження після перезапуску) і трьох місць перевірки: Jest на комп’ютері, заявлена ціль (емулятор Android), інша платформа (iOS). Щоб картинка вмістилася, її повернуто набік: функції тут ідуть стовпчиками, а місця — рядками; у таблиці з пояснення навпаки."
            en: "A matrix for two habit tracker features (the streak and storage — persistence across a restart) and three places to check them: Jest on the computer, the declared target (an Android emulator), the other platform (iOS). To fit, the picture is turned on its side: here the features run as columns and the places as rows; the table in the explanation is the other way round."
        - caption:
            uk: "Unit-тест серії зелений. Він заповнює **одну** клітинку — серія в рядку Jest."
            en: "The streak's unit test is green. It fills **one** cell — the streak in the Jest row."
          highlight: [s-host]
          annotate:
            - { id: s-host, text: { uk: "✓ перевірено", en: "✓ verified" } }
        - caption:
            uk: "Перезапуск застосунку в Jest не перевірити: процесу, що завершується, там немає. Клітинка — прочерк, а не «перевірено»."
            en: "An app restart cannot be checked in Jest: there is no process there to end. The cell is a dash, not “verified”."
          highlight: [r-host]
          annotate:
            - { id: r-host, text: "—" }
        - caption:
            uk: "Ручна перевірка на емуляторі із записом заповнює обидві клітинки рядка цілі на картинці."
            en: "A recorded manual check on the emulator fills both cells of the target row in the picture."
          highlight: [s-target, r-target]
          annotate:
            - { id: s-target, text: { uk: "✓ перевірено", en: "✓ verified" } }
            - { id: r-target, text: { uk: "✓ перевірено", en: "✓ verified" } }
        - caption:
            uk: "iOS на цьому комп’ютері недоступна. Клітинки рядка іншої платформи отримують **запис про пропуск** — чесне «не виконано», а не порожнє місце й не «перевірено»."
            en: "iOS is unavailable on this computer. The other platform’s row gets a **skip record** — an honest “not performed”, neither an empty spot nor “verified”."
          highlight: [s-other, r-other]
          annotate:
            - { id: s-other, text: { uk: "⊘ пропуск", en: "⊘ skipped" } }
            - { id: r-other, text: { uk: "⊘ пропуск", en: "⊘ skipped" } }

  - id: predict-cells
    kind: prediction
    prompt:
      uk: |
        Матриця для кнопки «Виконано сьогодні» трекера звичок має три стовпчики: Jest на комп’ютері, емулятор Android (заявлена ціль) і iPhone (інша платформа). Компонентний тест кнопки — той, що натискає її за доступною назвою й перевіряє текст статусу, — щойно став зеленим. Які клітинки цей результат може заповнити?
      en: |
        The matrix for the habit tracker's “Done today” button has three columns: Jest on the computer, an Android emulator (the declared target) and an iPhone (the other platform). The button's component test — the one that presses it by its accessible label and checks the status text — has just turned green. Which cells can this result fill?
    runnable: false
    answer:
      type: choice
      options:
        - id: host-only
          text:
            uk: "Лише клітинку в стовпчику Jest"
            en: "Only the cell in the Jest column"
        - id: all
          text:
            uk: "Усі три: код React Native спільний для обох платформ"
            en: "All three: React Native code is shared by both platforms"
          why:
            uk: "Спільний код — не спільна поведінка. Компонентний тест працює в Node.js без iOS- і Android-коду, а в наших тестах `Platform.OS` узагалі `\"ios\"`."
            en: "Shared code is not shared behavior. A component test runs in Node.js without the iOS and Android code, and in our tests `Platform.OS` is `\"ios\"` anyway."
        - id: host-and-ios
          text:
            uk: "Jest і iPhone: jest-expo в наших тестах повідомляє `Platform.OS` як `\"ios\"`"
            en: "Jest and the iPhone: jest-expo reports `Platform.OS` as `\"ios\"` in our tests"
          why:
            uk: "`Platform.OS` у Jest — лише значення, яке підставив пресет. Жодного iPhone чи симулятора тест не запускав."
            en: "`Platform.OS` in Jest is just a value the preset puts in. The test started no iPhone and no simulator."
        - id: host-and-target
          text:
            uk: "Jest і емулятор: ціль заявлена, тож тест її покриває"
            en: "Jest and the emulator: the target is declared, so the test covers it"
          why:
            uk: "Заявити ціль — не те саме, що перевірити на ній. Клітинку цілі заповнює лише запуск на емуляторі із записом."
            en: "Declaring a target is not checking on it. The target cell is filled only by a recorded run on the emulator."
      correct: [host-only]
    explanation:
      uk: "Результат заповнює лише стовпчик того місця, де його отримано. Стовпчики пристроїв заповнюють запуск на цілі (вручну чи E2E) або наданий доказ, позначений саме так."
      en: "A result fills only the column of the place where it was obtained. Device columns are filled by a run on the target (manual or E2E) or by supplied evidence, marked as such."

  - id: coverage-matrix
    kind: example
    runtime: concept-preview
    dir: coverage-matrix
    entry: main.jsx
    strings:
      fStreak: { uk: "серія summarizeHabit", en: "summarizeHabit streak" }
      fButton: { uk: "кнопка «Виконано сьогодні»", en: "the Done today button" }
      fRestart: { uk: "виконання після перезапуску", en: "completions after a restart" }
      fMotion: { uk: "зменшений рух", en: "reduced motion" }
      cFeature: { uk: "Функція", en: "Feature" }
      cHost: { uk: "Jest", en: "Jest" }
      cTarget: { uk: "Ціль", en: "Target" }
      cOther: { uk: "Інша платформа", en: "Other platform" }
      mVerified: { uk: "перевірено", en: "verified" }
      mEvidence: { uk: "наданий доказ", en: "supplied evidence" }
      mTodo: { uk: "не виконано", en: "not performed" }
      mNa: { uk: "не тут", en: "not here" }
      mSkip: { uk: "пропуск", en: "skipped" }
      skipRows: { uk: "Потрібен запис про пропуск", en: "Skip record needed" }
      todoCells: { uk: "Ще виконати", en: "Still to perform" }
    title:
      uk: "Матриця, коли іншої платформи немає"
      en: "The matrix when the other platform is missing"
    body:
      uk: |
        `coverage.js` — матриця трекера звичок, `workstation.js` — що вміє цей комп’ютер. Перегляд малює таблицю, а в **Консолі** пише, які клітинки ще виконати і які рядки потребують запису про пропуск. Натисни **Запустити**.
      en: |
        `coverage.js` is the habit tracker's matrix, `workstation.js` says what this computer can do. The preview draws the table and writes in the **Console** which cells are still to perform and which rows need a skip record. Press **Run**.
    tryIt:
      uk: |
        1. У `workstation.js` заміни `'available'` на `'unsupported'` (так буває з iOS на комп’ютері без macOS) і запусти: три рядки з «не виконано» в іншій платформі тепер потребують запису про пропуск, а рядок кнопки з наданим доказом — ні.
        2. У `coverage.js` зміни в рядку `reduced-motion` значення `target` на `'verified'` і запусти: зі списку «Ще виконати» зникає ця клітинка. Стовпчик Jest для неї так і лишається «не тут».
        3. Поверни обидва значення.
      en: |
        1. In `workstation.js` replace `'available'` with `'unsupported'` (as with iOS on a computer without macOS) and run: the three rows with “not performed” on the other platform now need a skip record, while the button's row with supplied evidence does not.
        2. In `coverage.js`, in the `reduced-motion` row, change `target` to `'verified'` and run: that cell disappears from the “Still to perform” list. Its Jest column stays “not here”.
        3. Put both values back.
    limits:
      uk: "Концептуальний перегляд через react-native-web: таблиця лише впорядковує записи. Позначку «перевірено» дає не таблиця, а справжній запуск на цілі із записом результату."
      en: "A concept preview through react-native-web: the table only organizes records. A “verified” mark comes not from the table but from a real run on the target with its result recorded."

  - id: deploy-concepts
    kind: explanation
    title:
      uk: "Розгортання без магазину"
      en: "Deployment without a store"
    body:
      uk: |
        Розгортання — це три кроки, і магазин лише один із варіантів третього:

        1. **Зібрати** release-збірку: зібраний JavaScript усередині, без dev-сервера (RN-01).
        2. **Підписати** її [[signing-key|ключем підпису]] — це [[code-signing|підпис коду]], докладно про нього в RN-11. Шаблон Expo SDK 57 після `npx expo prebuild` підписує Android-release **ключем debug** — у нашому `android/app/build.gradle` над цим рядком коментар `Caution! In production, you need to generate your own keystore file.` Власний ключ створюють командою `keytool` зі сторінки [«Publishing to Google Play Store»](https://reactnative.dev/docs/0.86/signed-apk-android) документації React Native 0.86.
        3. **Поширити**: встановити на свій емулятор чи телефон, передати тестувальникам або опублікувати в магазині.

        Без облікового запису в магазині перші два кроки й локальне встановлення ти можеш пройти повністю. На iPhone є межа: збірку для фізичного пристрою підписують сертифікатом Apple із [[provisioning-profile|профілем забезпечення]], а їх видає обліковий запис Apple Developer; симулятору вони не потрібні (так пише RN-11). Самі ми цього не перевіряли — на машині, де писали урок, немає Xcode, — а [сторінка Expo](https://docs.expo.dev/get-started/set-up-your-environment/?platform=ios&device=physical&mode=development-build) про development build на iPhone через EAS вимагає платну підписку Apple Developer Program.
      en: |
        Deployment is three steps, and a store is only one option for the third:

        1. **Build** a release build: bundled JavaScript inside, no dev server (RN-01).
        2. **Sign** it with a [[signing-key]] — this is [[code-signing]], covered in detail in RN-11. After `npx expo prebuild` the Expo SDK 57 template signs an Android release **with the debug key** — in our `android/app/build.gradle` that line has the comment `Caution! In production, you need to generate your own keystore file.` above it. Your own key is created with the `keytool` command from the [“Publishing to Google Play Store”](https://reactnative.dev/docs/0.86/signed-apk-android) page of the React Native 0.86 documentation.
        3. **Distribute**: install it on your emulator or phone, hand it to testers, or publish it in a store.

        Without a store account you can go through the first two steps and a local install completely. On an iPhone there is a limit: a build for a physical device is signed with an Apple certificate and a [[provisioning-profile]], which an Apple Developer account issues; the simulator needs neither (as RN-11 says). We did not check this ourselves — the machine this lesson was written on has no Xcode — and the [Expo page](https://docs.expo.dev/get-started/set-up-your-environment/?platform=ios&device=physical&mode=development-build) on a development build for an iPhone through EAS asks for a paid Apple Developer Program subscription.

  - id: e2e-flow
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: e2e-flow
    entry: main.jsx
    editable: [flow.js]
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      water: { uk: "Пити воду", en: "Drink water" }
      stretch: { uk: "Розтяжка", en: "Stretching" }
      addHabit: { uk: "Додати звичку", en: "Add habit" }
      nameField: { uk: "Назва звички", en: "Habit name" }
      save: { uk: "Зберегти", en: "Save" }
      noSuchButton: { uk: "такої кнопки на екрані немає", en: "no such button on the screen" }
      noSuchField: { uk: "такого поля на екрані немає", en: "no such field on the screen" }
      notVisible: { uk: "на екрані не видно", en: "not visible on the screen" }
      unknownStep: { uk: "невідомий крок", en: "unknown step" }
      noSteps: { uk: "У flow ще немає кроків.", en: "The flow has no steps yet." }
      runsOn: { uk: "Де виконується", en: "Runs on" }
      flowPassed: { uk: "Flow пройшов.", en: "The flow passed." }
      flowFailed: { uk: "Flow зупинився.", en: "The flow stopped." }
    title:
      uk: "E2E-сценарій: додати й пережити перезапуск"
      en: "An E2E flow: add and survive a restart"
    instructions:
      uk: |
        `flow.js` — E2E-сценарій для трекера звичок. `e2eRunner.js` — **імітація** засобу E2E: він виконує кроки над імітованим пристроєм `simDevice.js`. Кроки бувають такі: `{ do: 'launch' }`, `{ do: 'tap', label }`, `{ do: 'type', label, text }`, `{ do: 'restart' }`, `{ do: 'expectVisible', text }`.

        На екрані списку є кнопка «%%addHabit%%»; вона відкриває форму з полем «%%nameField%%» і кнопкою «%%save%%».

        Допиши сценарій:

        - відкрити застосунок (список);
        - додати звичку «%%stretch%%»;
        - перезапустити застосунок і переконатися, що «%%stretch%%» досі видно.

        І заповни `runsOn`: `'target'`, якщо сценарій має виконуватися на заявленій цілі, чи `'host'`, якщо в Jest на комп’ютері. Перевірки запускають сценарій на справному застосунку, на застосунку, що втрачає дані після перезапуску, і на застосунку, чия «%%save%%» нічого не додає.
      en: |
        `flow.js` is an E2E flow for the habit tracker. `e2eRunner.js` is a **simulation** of an E2E tool: it performs the steps on the simulated device `simDevice.js`. The steps are: `{ do: 'launch' }`, `{ do: 'tap', label }`, `{ do: 'type', label, text }`, `{ do: 'restart' }`, `{ do: 'expectVisible', text }`.

        The list screen has a “%%addHabit%%” button; it opens a form with the field “%%nameField%%” and the button “%%save%%”.

        Finish the flow:

        - open the app (the list);
        - add the habit “%%stretch%%”;
        - restart the app and make sure “%%stretch%%” is still visible.

        And fill in `runsOn`: `'target'` if the flow must run on the declared target, or `'host'` if in Jest on the computer. The checks run the flow on a working app, on an app that loses data on restart, and on an app whose “%%save%%” adds nothing.
    testTitles:
      "your flow passes on the working app":
        uk: "Твій сценарій проходить на справному застосунку"
        en: "Your flow passes on the working app"
      "your flow fails when the habits are lost on restart":
        uk: "Твій сценарій падає, коли звички зникають після перезапуску"
        en: "Your flow fails when the habits are lost on restart"
      "your flow fails when Save does not add the habit":
        uk: "Твій сценарій падає, коли «Зберегти» не додає звичку"
        en: "Your flow fails when Save does not add the habit"
      "the flow runs on the declared target":
        uk: "Сценарій виконується на заявленій цілі"
        en: "The flow runs on the declared target"
    hints:
      nudge:
        uk: "Пройди сценарій руками людини, яка вперше відкрила застосунок: що натиснути, що ввести, що зробити, щоб перевірити саме збереження, і що тоді має бути на екрані?"
        en: "Walk through the flow with the hands of a person opening the app for the first time: what to press, what to type, what to do to check persistence itself, and what should be on the screen then?"
      explanation:
        uk: "Кожна дія людини — окремий крок: натиснути кнопку за її підписом, ввести текст у поле за його підписом, натиснути збереження. Збереження після перезапуску перевіряє лише пара «`restart`, потім `expectVisible`»: перевірка до перезапуску бачить пам’ять процесу, а не сховище. Наприклад, сценарій для планувальника міг би закінчуватися так: `{ do: 'tap', label: 'Зберегти' }, { do: 'restart' }, { do: 'expectVisible', text: 'Полити квіти' }`. А виконується такий сценарій там, де застосунок справді перезапускається."
        en: "Each action of a person is a separate step: press a button by its label, type text into a field by its label, press save. Only the pair “`restart`, then `expectVisible`” checks persistence after a restart: a check before the restart sees the process's memory, not the storage. For example, a planner flow could end like this: `{ do: 'tap', label: 'Save' }, { do: 'restart' }, { do: 'expectVisible', text: 'Water the plants' }`. And such a flow runs where the app really restarts."
    solutionNote:
      uk: "Сценарій проходить шлях людини: список, «%%addHabit%%», назва, «%%save%%», перезапуск, перевірка. Саме `restart` перед `expectVisible` робить його тестом збереження: без перезапуску він проходить і на застосунку, що нічого не записує. А виконується він на заявленій цілі — у Jest немає ні застосунку, ні процесу, що перезапускається."
      en: "The flow follows a person's path: the list, “%%addHabit%%”, the name, “%%save%%”, a restart, a check. It is `restart` before `expectVisible` that makes it a persistence test: without the restart it also passes on an app that writes nothing. And it runs on the declared target — Jest has neither the app nor a process that restarts."
    feedback:
      - when: { test: "your flow passes on the working app" }
        message:
          uk: "Ця перевірка запускає сценарій на справному застосунку й очікує, що він пройде. Подивись у **Консоль**: рядок `✗` каже, на якому кроці й чому він зупинився. Підписи кнопок і поля мають збігатися з умовою літера в літеру; поле існує лише на екрані форми."
          en: "This check runs the flow on the working app and expects it to pass. Look at the **Console**: the `✗` line says at which step and why it stopped. Button and field labels must match the task letter by letter; the field exists only on the form screen."
      - when: { test: "your flow fails when the habits are lost on restart" }
        message:
          uk: "Спершу сценарій має пройти на справному застосунку (перша перевірка). Ця перевірка бере застосунок, що втрачає дані після перезапуску, і очікує, що сценарій упаде. Отже, після `{ do: 'restart' }` має йти `expectVisible` з «%%stretch%%»."
          en: "First the flow must pass on the working app (the first check). This check takes an app that loses data on restart and expects the flow to fail. So `{ do: 'restart' }` must be followed by `expectVisible` with “%%stretch%%”."
      - when: { test: "your flow fails when Save does not add the habit" }
        message:
          uk: "Спершу сценарій має пройти на справному застосунку (перша перевірка). Ця перевірка бере застосунок, чия «%%save%%» нічого не додає, і очікує, що сценарій упаде: потрібен `expectVisible` з «%%stretch%%» після збереження."
          en: "First the flow must pass on the working app (the first check). This check takes an app whose “%%save%%” adds nothing and expects the flow to fail: an `expectVisible` with “%%stretch%%” after saving is needed."
      - when: { test: "the flow runs on the declared target" }
        message:
          uk: "Ця перевірка очікує `runsOn: 'target'`. У Jest на комп’ютері немає ні native-застосунку, ні його перезапуску — такий сценарій виконується лише на емуляторі чи пристрої."
          en: "This check expects `runsOn: 'target'`. Jest on the computer has neither a native app nor its restart — such a flow runs only on an emulator or a device."
    limits:
      uk: "Імітація: `simDevice.js` — модель застосунку в пам’яті, а не native-застосунок; справжній засіб E2E керує застосунком на емуляторі чи пристрої, і його сценарії мають свій формат. Тут перевіряється лише логіка сценарію."
      en: "A simulation: `simDevice.js` is an in-memory model of the app, not a native app; a real E2E tool drives the app on an emulator or a device, and its flows have their own format. Only the flow's logic is checked here."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: shared-layout
        from: rn-02-06-platform-differences
        prompt:
          uk: "Картка витрати має тінь. Як записати її стиль, щоб і iOS, і Android показали тінь, а решта верстки лишилася спільною?"
          en: "An expense card has a shadow. How do you write its style so both iOS and Android show the shadow while the rest of the layout stays shared?"
        answer:
          type: choice
          options:
            - id: select
              text:
                uk: "Спільні стилі один раз, а тінь — через `Platform.select`: `shadow…` для iOS, `elevation` для Android"
                en: "The shared styles once, and the shadow through `Platform.select`: `shadow…` for iOS, `elevation` for Android"
            - id: two-files
              text:
                uk: "Два повні файли `ExpenseCard.ios.tsx` і `ExpenseCard.android.tsx` з однаковою версткою"
                en: "Two full files `ExpenseCard.ios.tsx` and `ExpenseCard.android.tsx` with the same layout"
              why:
                uk: "Окремі файли — для компонентів, що справді різні. Тут відрізняється одна властивість, а дублікат верстки згодом розійдеться."
                en: "Separate files are for components that really differ. Here one property differs, and a duplicated layout drifts apart over time."
            - id: ios-only
              text:
                uk: "Лише `shadowColor` і `shadowOpacity`: React Native переведе їх для Android"
                en: "Only `shadowColor` and `shadowOpacity`: React Native translates them for Android"
              why:
                uk: "Ці властивості — для iOS. На Android тінь дає `elevation`; без неї картка буде пласкою."
                en: "These properties are for iOS. On Android `elevation` gives the shadow; without it the card is flat."
          correct: [select]
        explanation:
          uk: "Різниця платформ — у кількох властивостях, і її видно лише на кожній платформі окремо. Тому в матриці в такої функції два стовпчики пристроїв."
          en: "The platform difference lives in a few properties, and it shows only on each platform separately. That is why such a feature has two device columns in the matrix."

  - id: to-project
    kind: transfer
    capstoneStep: RN-07
    body:
      uk: "У кроці проєкту цього розділу ти запишеш, які поведінки твого native-підпроєкту лишаються перевірками на пристрої, і виконаєш одну з них на заявленій цілі. Познач у своїх нотатках, у якому стовпчику — Jest, ціль чи інша платформа — отримано кожен результат."
      en: "In this unit's project step you record which behaviors of your native subproject remain device checks and perform one of them on your declared target. Mark in your notes in which column — Jest, the target or the other platform — each result was obtained."
