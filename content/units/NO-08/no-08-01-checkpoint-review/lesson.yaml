id: no-08-01-checkpoint-review
unit: NO-08
title:
  uk: "Огляд перед контрольною точкою: накопичене повторення"
  en: "Checkpoint review: cumulative retrieval"
kind: review
minutes: 20
contentVersion: 1
purpose:
  uk: "Перед контрольною точкою CP-NO ти з пам’яті відповідаєш на питання про рішення з усіх чотирьох етапів — функції CRUD, знімки state, покращення CP-RE, збереження даних, контракт API — і бачиш, де кожне з них живе в наскрізному шляху «сторінка → HTTP → API → репозиторій → файл». Саме ці рішення ламають перевірки CP-NO. Наприкінці уроку — які докази CP-NO дають справжні запити, які — перезапуск, а які нативні перевірки записують як невиконані."
  en: "Before the checkpoint CP-NO you answer, from memory, questions about decisions from all four stages — the CRUD functions, state snapshots, the CP-RE enhancement, persistence, the API contract — and see where each of them lives on the end-to-end path “page → HTTP → API → repository → file”. These decisions are what breaks the CP-NO checks. At the end of the lesson: which CP-NO evidence comes from real requests, which from a restart, and which native checks are recorded as unperformed."
objectives:
  - uk: "Без конспекту пригадати рішення проєкту з кожного етапу (функції CRUD, знімки state, покращення CP-RE, збереження, контракт API) і передбачити, де кожне з них з’являється в наскрізному шляху."
    en: "Retrieve without notes the capstone decisions from every stage (CRUD functions, state snapshots, the CP-RE enhancement, persistence, the API contract) and predict where each appears in the end-to-end flow."
  - uk: "Перелічити, які докази CP-NO дають справжні запити, які — перевірки перезапуску, а які нативні перевірки лишаються невиконаними, коли цілі немає."
    en: "List which CP-NO evidence will come from real requests, which from restart checks, and which native checks stay unperformed when the target is unavailable."
prerequisites: [no-13-08-capstone-ssr-list, no-06-09-capstone-integrate-clients]
subskills:
  - { family: B-13, skill: "design/build/debug/test/secure/deliver/maintain", depth: intro }
  - { family: B-13, skill: "requirements/tradeoffs", depth: intro }
  - { family: B-13, skill: "no-hint defect", depth: intro }
  - { family: B-13, skill: "retained domain/workspaces", depth: intro }
glossary: []
selfCheck: [predict-restart, which-proves-restart, no-emulator]

blocks:
  - id: whole-path
    kind: explanation
    title:
      uk: "Увесь шлях одного запису"
      en: "The whole path of one record"
    body:
      uk: |
        Етап Node.js закінчується [[checkpoint|контрольною точкою]] CP-NO: без підказок ти доводиш, що твій проєкт працює **наскрізь** — від кнопки на сторінці до файла на диску й назад, зокрема після перезапуску сервера.

        Один новий запис проходить п’ять місць, і в кожному живе рішення з іншого етапу:

        | Місце | Що там вирішено | Етап |
        |---|---|---|
        | сторінка | що показати; знімок state; cleanup ефектів | React |
        | адаптер клієнта | який запит надіслати; що робити, коли відповіді немає | React, Node.js |
        | API | маршрут, перевірка тіла, статус відповіді | Node.js |
        | репозиторій | черга записів, атомарна заміна файла | Node.js |
        | файл чи база | що переживає перезапуск | Node.js (у браузерній версії — `localStorage`, етап JavaScript) |

        Цей урок — **накопичене повторення**: відповідай **до** запуску й без конспекту, навіть якщо не впевнений. Помилка тут — не провал, а вказівка, куди повернутися: пояснення називає рішення, а таблиця наприкінці — урок, який варто перечитати.
      en: |
        The Node.js stage ends with the [[checkpoint]] CP-NO: without hints you prove that your project works **end to end** — from a button on the page to the file on disk and back, including after a server restart.

        One new record passes five places, and each holds a decision from a different stage:

        | Place | What is decided there | Stage |
        |---|---|---|
        | the page | what to show; the state snapshot; effect cleanup | React |
        | the client adapter | which request to send; what to do when there is no answer | React, Node.js |
        | the API | the route, the body check, the response status | Node.js |
        | the repository | the write queue, the atomic file replacement | Node.js |
        | the file or database | what survives a restart | Node.js (in the browser version — `localStorage`, the JavaScript stage) |

        This lesson is **cumulative retrieval**: answer **before** running and without notes, even when you are not sure. A mistake here is not a failure but a pointer to where to go back: the explanation names the decision, and the table at the end names the lesson worth rereading.

  - id: predict-restart
    kind: prediction
    strings:
      rent: { uk: "Сплатити оренду", en: "Pay the rent" }
      keys: { uk: "Зробити дублікат ключів", en: "Copy the keys" }
    prompt:
      uk: "Сервер планувальника тримає справи у JSON-файлі й відповідає `201` лише після того, як файл записано; на кожен запит, на який відповів, він друкує рядок у лог. Клієнт уже завантажив 6 справ. Далі: клієнт створює «%%rent%%» (сервер працює); сервер зупиняють; клієнт створює «%%keys%%»; сервер запускають знову, і сторінку перезавантажують. Скільки справ покаже перезавантажена сторінка і скільки рядків `POST /tasks` буде в лозі сервера?"
      en: "The planner server keeps tasks in a JSON file and answers `201` only after the file is written; for every request it answers it prints a log line. The client has already loaded 6 tasks. Then: the client creates “%%rent%%” (the server is running); the server is stopped; the client creates “%%keys%%”; the server is started again, and the page is reloaded. How many tasks does the reloaded page show, and how many `POST /tasks` lines are in the server log?"
    answer:
      type: choice
      options:
        - id: seven-one
          text:
            uk: "7 справ і один рядок `POST /tasks`"
            en: "7 tasks and one `POST /tasks` line"
        - id: eight-one
          text:
            uk: "8 справ і один рядок `POST /tasks`"
            en: "8 tasks and one `POST /tasks` line"
          why:
            uk: "Друга справа жила лише в кеші сторінки: запит не дійшов до сервера, бо його ніхто не слухав. Перезавантаження стирає кеш, а сервер віддає те, що лежить у файлі."
            en: "The second task lived only in the page’s cache: the request never reached the server, because nobody was listening. A reload wipes the cache, and the server gives what is in the file."
        - id: seven-two
          text:
            uk: "7 справ і два рядки `POST /tasks`"
            en: "7 tasks and two `POST /tasks` lines"
          why:
            uk: "Рядок у лозі сервер друкує, коли відповідає на запит, який **отримав**. Зупинений сервер нічого не отримує: клієнт бачить помилку з’єднання, а в лозі нового рядка немає."
            en: "The server prints a log line when it answers a request it has **received**. A stopped server receives nothing: the client sees a connection error, and the log gets no new line."
        - id: six-one
          text:
            uk: "6 справ і один рядок `POST /tasks`"
            en: "6 tasks and one `POST /tasks` line"
          why:
            uk: "Сервер відповів `201` лише після запису файла, а файл переживає перезапуск процесу. Новий процес прочитає з диска й першу нову справу."
            en: "The server answered `201` only after writing the file, and the file survives a process restart. The new process reads the first new task from disk too."
      correct: [seven-one]
    explanation:
      uk: "Підтверджений запис (`201` після запису на диск) переживає перезапуск; непідтверджений — ні, хоч би що показувала сторінка до перезавантаження. Лог сервера — доказ того, які запити **справді** дійшли. Приклад «Створити → перезапустити → перезавантажити» в цьому уроці відтворює цю послідовність у справжньому Node.js."
      en: "A confirmed write (`201` after writing to disk) survives a restart; an unconfirmed one does not, whatever the page showed before the reload. The server log is the evidence of which requests **really** arrived. The example “Create → restart → reload” in this lesson replays the sequence in real Node.js."

  - id: restart-lab
    kind: example
    runtime: isolated-node
    dir: restart-lab
    entry: index.js
    capabilities: { network: loopback }
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      wardrobe: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
      rent: { uk: "Сплатити оренду", en: "Pay the rent" }
      keys: { uk: "Зробити дублікат ключів", en: "Copy the keys" }
      clientShows: { uk: "клієнт показує справ:", en: "the client shows tasks:" }
      notSaved: { uk: "з них не збережено:", en: "not saved among them:" }
      stopped: { uk: "сервер зупинено", en: "server stopped" }
      started: { uk: "сервер запущено знову", en: "server started again" }
    title:
      uk: "Створити → перезапустити → перезавантажити"
      en: "Create → restart → reload"
    body:
      uk: |
        Тут увесь шлях у справжньому Node.js, на твоєму комп’ютері:

        - `repo.js` — репозиторій: один JSON-файл, атомарна заміна, одна зміна за раз;
        - `server.js` — API: `GET /tasks` і `POST /tasks`, рядок у лозі на кожну відповідь;
        - `client.js` — адаптер клієнта, яким користувалася б сторінка; його масив `tasks` — те, що сторінка показує (кеш);
        - `index.js` — сценарій з попереднього питання. «Перезапуск» тут — зупинити сервер і запустити новий над **новим** об’єктом репозиторію й тим самим файлом.

        Натисни **Запустити** й порівняй рядки з `server:` і числа з відповіддю, яку ти обрав.
      en: |
        Here is the whole path in real Node.js, on your computer:

        - `repo.js` — the repository: one JSON file, atomic replacement, one change at a time;
        - `server.js` — the API: `GET /tasks` and `POST /tasks`, a log line for every answer;
        - `client.js` — the client adapter a page would use; its `tasks` array is what the page shows (the cache);
        - `index.js` — the scenario of the previous question. A “restart” here is: stop the server and start a new one over a **new** repository object and the same file.

        Press **Run** and compare the `server:` lines and the numbers with the answer you chose.
    tryIt:
      uk: |
        1. У `index.js` перенеси рядок `await page.create('%%keys%%');` на місце перед `await stop(server);` і запусти знову: тепер у лозі два рядки `POST /tasks`, а після перезавантаження сторінка показує 8 справ і жодної незбереженої.
        2. Поверни рядок на місце. У `server.js` заміни рядок `return send(response, 201, await repo.add(task));` двома: `repo.add(task);` і `return send(response, 201, task);` — тепер сервер відповідає `201`, не чекаючи запису. Запусти кілька разів. У наших запусках (по 20 на Node.js 25.2.1 і 22.13.1, macOS) перезавантажена сторінка щоразу показувала 6 справ: новий сервер прочитав файл раніше, ніж старий запис завершився. На іншому комп’ютері результат може бути інший — і саме в цьому проблема: відповідь пообіцяла те, чого на диску ще не було.
      en: |
        1. In `index.js` move the line `await page.create('%%keys%%');` to just before `await stop(server);` and run again: now the log has two `POST /tasks` lines, and after the reload the page shows 8 tasks and none unsaved.
        2. Put the line back. In `server.js` replace the line `return send(response, 201, await repo.add(task));` with two: `repo.add(task);` and `return send(response, 201, task);` — now the server answers `201` without waiting for the write. Run it several times. In our runs (20 each on Node.js 25.2.1 and 22.13.1, macOS) the reloaded page showed 6 tasks every time: the new server read the file before the old write had finished. On another computer the result may differ — and that is exactly the problem: the answer promised what the disk did not have yet.

  - id: recall
    kind: review
    title:
      uk: "Пригадай без підказок"
      en: "Recall without hints"
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    items:
      - id: cp-js-data
        from: re-08-03-capstone-cp-re-enhancement
        prompt:
          uk: "На CP-RE рядок рубрики «Дані CP-JS» вимагав, щоб записи, збережені ще JavaScript-версією проєкту, відкрилися в React-версії без змін. Що зробило це можливим?"
          en: "At CP-RE the rubric row “CP-JS data” required the records saved by the JavaScript version of the project to open in the React version unchanged. What made that possible?"
        answer:
          type: choice
          options:
            - id: same-origin-key
              text:
                uk: "React-версія працює на тій самій адресі `http://127.0.0.1:4310` і читає той самий ключ сховища тим самим кодом `storage/`"
                en: "The React version runs at the same address `http://127.0.0.1:4310` and reads the same storage key with the same `storage/` code"
            - id: export-file
              text:
                uk: "Під час збірки React-версія копіює дані CP-JS у свій бандл"
                en: "While building, the React version copies the CP-JS data into its bundle"
              why:
                uk: "Збірка пакує код, а не дані браузера. Записи лежали в `localStorage` браузера для адреси, на якій працював застосунок."
                en: "A build packs code, not the browser’s data. The records were in the browser’s `localStorage` for the address the app ran at."
            - id: any-port
              text:
                uk: "`localStorage` спільний для всіх адрес на цьому комп’ютері, тож порт не має значення"
                en: "`localStorage` is shared by every address on this computer, so the port does not matter"
              why:
                uk: "Сховище браузера окреме для кожного origin: інший порт — інше сховище. Тому крок CP-RE і вимагав ту саму адресу, що й у CP-JS."
                en: "Browser storage is separate for every origin: another port is another storage. That is why the CP-RE step required the same address as CP-JS."
          correct: [same-origin-key]
        explanation:
          uk: "Дані CP-JS пережили перехід на React, бо не змінилися ні origin, ні ключ, ні код, що їх читає. На CP-NO дані переїжджають ще раз — у файл чи базу на сервері, — і доводити їхнє збереження доведеться вже справжніми запитами й перезапуском сервера."
          en: "The CP-JS data survived the move to React because neither the origin, nor the key, nor the code reading it changed. At CP-NO the data moves once more — into a file or a database on the server — and its survival is proven with real requests and a server restart."

      - id: reload-equal
        from: js-09-08-independent-delayed-retrieval
        prompt:
          uk: "Тест збереження записує список у JSON і читає назад. Що надрукує цей код?"
          en: "A persistence test writes a list to JSON and reads it back. What does this code print?"
        code: |
          const items = [{ id: "w-02", name: "%%lamp%%", acquired: false }];
          const saved = JSON.stringify(items);
          const loaded = JSON.parse(saved);
          console.log(loaded === items, loaded[0] === items[0], JSON.stringify(loaded) === saved);
        verify: { logs: ["false false true"] }
        answer:
          type: choice
          options:
            - id: new-objects
              code: "false false true"
            - id: same
              code: "true true true"
              why:
                uk: "`JSON.parse` щоразу будує **нові** масиви й об’єкти. Вміст той самий, але це інші об’єкти, тож `===` дає `false`."
                en: "`JSON.parse` builds **new** arrays and objects every time. The content is the same, but these are other objects, so `===` gives `false`."
            - id: array-only
              code: "false true true"
              why:
                uk: "Новий не лише масив: кожен об’єкт усередині теж зібрано з тексту заново."
                en: "Not only the array is new: every object inside is also built again from the text."
          correct: [new-objects]
        explanation:
          uk: "Тому тест перезавантаження порівнює **вміст** (`toEqual`), а не тотожність (`toBe`). Відповідь сервера після перезапуску — так само нові об’єкти з тексту: доказом збереження є однаковий вміст до й після, а не «той самий об’єкт»."
          en: "That is why a reload test compares **content** (`toEqual`), not identity (`toBe`). A server’s answer after a restart is likewise new objects built from text: the evidence of persistence is the same content before and after, not “the same object”."

      - id: confirmed-means
        from: no-05-08-independent-restart-no-loss
        prompt:
          uk: "Сервер бронювань убито (`SIGKILL`), поки він обробляв хвилю одночасних запитів. Після перезапуску в сховищі на одне бронювання більше, ніж клієнти отримали відповідей `201`. Як це оцінити?"
          en: "The bookings server was killed (`SIGKILL`) while it handled a wave of concurrent requests. After the restart the store has one booking more than the clients got `201` answers. How do you judge that?"
        answer:
          type: choice
          options:
            - id: not-a-loss
              text:
                uk: "Це не втрата: запис завершився, але процес убито раніше, ніж він надіслав `201`. Втрата — це підтверджене бронювання, якого немає"
                en: "It is not a loss: the write finished, but the process was killed before it sent the `201`. A loss is a confirmed booking that is missing"
            - id: duplicate
              text:
                uk: "Це дубль: сховище зберегло один запит двічі"
                en: "It is a duplicate: the store saved one request twice"
              why:
                uk: "Дубль — це той самий запит, збережений двічі. Тут зайве бронювання — окремий запит, на який клієнт просто не дочекався відповіді."
                en: "A duplicate is the same request stored twice. Here the extra booking is a separate request whose answer the client never got."
            - id: corrupt
              text:
                uk: "Це пошкодження: після вбивства сховищу не можна довіряти, його треба відновити з backup"
                en: "It is corruption: after a kill the store cannot be trusted and must be restored from a backup"
              why:
                uk: "Кількість не говорить про пошкодження. Пошкодження — це дані, що не проходять контракт чи інваріант, а перевірка після перезапуску якраз це й перевіряє."
                en: "A count says nothing about corruption. Corruption is data that breaks the contract or an invariant, and the check after a restart tests exactly that."
          correct: [not-a-loss]
        explanation:
          uk: "Підтверджений запис — той, на який сервер відповів `201` лише після того, як зміна справді збереглася. Гарантія перезапуску звучить так: кожен підтверджений запис на місці. Запит без відповіді може бути або не бути в сховищі — і те, і те чесно."
          en: "A confirmed write is one the server answered `201` only after the change was really stored. The restart guarantee says: every confirmed write is there. A request without an answer may or may not be in the store — both are honest."

      - id: own-bug-status
        from: no-04-03-error-model
        prompt:
          uk: "Клієнт надіслав правильне тіло, але обробник сервера впав з `TypeError` у власному коді. Який статус має отримати клієнт?"
          en: "The client sent a valid body, but the server’s handler crashed with a `TypeError` in its own code. Which status should the client get?"
        answer:
          type: choice
          options:
            - id: five-hundred
              text: { uk: "`500`", en: "`500`" }
            - id: four-hundred
              text: { uk: "`400`", en: "`400`" }
              why:
                uk: "`400` означає, що клієнт надіслав щось неправильне. Тут запит правильний, а помилка — у коді сервера."
                en: "`400` means the client sent something wrong. Here the request is fine and the mistake is in the server’s code."
            - id: two-hundred
              text: { uk: "`200` з текстом помилки в тілі", en: "`200` with the error text in the body" }
              why:
                uk: "Статус — частина контракту: клієнт і тести вирішують за ним. `200` сказав би «усе гаразд», і клієнт показав би неіснуючий успіх."
                en: "The status is part of the contract: the client and the tests decide by it. `200` would say “all good”, and the client would show a success that did not happen."
          correct: [five-hundred]
        explanation:
          uk: "Помилка сервера — `500` у єдиній формі помилок, без стеку у відповіді; помилка клієнта — `400` з полями, які не пройшли перевірку. На CP-NO перевірка «некоректне введення» якраз чекає `400`, а не `500`."
          en: "A server error is a `500` in the single error shape, without a stack in the answer; a client error is a `400` with the fields that failed the check. At CP-NO the “invalid input” check expects exactly a `400`, not a `500`."

  - id: three-sources
    kind: explanation
    title:
      uk: "Докази CP-NO: запити, перезапуск, клієнт"
      en: "CP-NO evidence: requests, restart, client"
    body:
      uk: |
        Крок проєкту CP-NO ще не написано. За планом курсу він просить без підказок завершити наскрізну інтеграцію й довести шість перевірок: створення, зміну, перезапуск, перезавантаження сторінки, некоректне введення й клієнта без сервера. Кожен доказ береться з одного з трьох джерел:

        | Джерело | Що доводить | Приклад доказу |
        |---|---|---|
        | справжні запити | запит дійшов і отримав правильну відповідь | рядок у лозі сервера й відповідь `curl` чи `fetch` зі статусом |
        | перезапуск | підтверджені зміни пережили процес | підсумок до й після: зупинити сервер, запустити знову, той самий `GET` |
        | клієнт | сторінка показує те, що каже сервер | після перезавантаження — дані сервера; без сервера — чесне «не збережено» |

        Нативні перевірки (якщо твій проєкт має нативний компаньйон) виконують на [[declared-target|заявленій цілі]]. Немає цілі — перевірку записують як **невиконану**, з причиною, а не як пройдену: веб-клієнт, що працює, нічого не доводить про нативний.
      en: |
        The project step CP-NO is not written yet. According to the course plan, it asks you to complete the end-to-end integration without hints and prove six checks: create, update, restart, page reload, invalid input and a client without the server. Every piece of evidence comes from one of three sources:

        | Source | What it proves | Example of evidence |
        |---|---|---|
        | real requests | the request arrived and got the right answer | a line in the server log and a `curl` or `fetch` answer with its status |
        | a restart | confirmed changes outlived the process | a before/after summary: stop the server, start it again, the same `GET` |
        | the client | the page shows what the server says | after a reload — the server’s data; without the server — an honest “not saved” |

        Native checks (if your project has a native companion) are performed on the [[declared-target]]. No target — the check is recorded as **not performed**, with the reason, not as passed: a working web client proves nothing about the native one.

  - id: which-proves-restart
    kind: prediction
    prompt:
      uk: "Яке із цих спостережень доводить саме те, що підтверджена справа пережила перезапуск сервера?"
      en: "Which of these observations proves exactly that a confirmed task survived a server restart?"
    answer:
      type: choice
      options:
        - id: get-after-restart
          text:
            uk: "Сервер зупинено й запущено знову як новий процес, і `GET /tasks` від нового процесу повертає справу"
            en: "The server was stopped and started again as a new process, and `GET /tasks` from the new process returns the task"
        - id: page-still-shows
          text:
            uk: "Після зупинки сервера сторінка досі показує справу"
            en: "After the server was stopped, the page still shows the task"
          why:
            uk: "Сторінка показує свій кеш. Він живе в браузері й нічого не знає про диск сервера — справа, яку сервер не прийняв, теж була б на екрані."
            en: "The page shows its cache. It lives in the browser and knows nothing about the server’s disk — a task the server never accepted would be on the screen too."
        - id: log-201
          text:
            uk: "У лозі сервера є рядок `POST /tasks → 201`"
            en: "The server log has the line `POST /tasks → 201`"
          why:
            uk: "Цей рядок доводить, що запит дійшов і отримав `201`, — це доказ «справжнього запиту». Що справа пережила процес, він не каже: це видно лише після перезапуску."
            en: "This line proves the request arrived and got a `201` — evidence of a “real request”. It does not say the task outlived the process: that shows only after a restart."
        - id: same-process
          text:
            uk: "Тест відкриває репозиторій двічі в тому самому процесі й бачить справу"
            en: "A test opens the repository twice in the same process and sees the task"
          why:
            uk: "Це добра перевірка репозиторію, але не інтегрованого сервера: процес не перезапускався, і кеш у пам’яті, якщо він десь є, міг би сховати втрату."
            en: "This is a good check of the repository, but not of the integrated server: the process did not restart, and an in-memory cache, if there is one somewhere, could hide a loss."
      correct: [get-after-restart]
    explanation:
      uk: "Доказ перезапуску — це новий процес і справжній запит до нього: підсумок до зупинки й після запуску має збігтися. Інші спостереження теж корисні, але доводять інше: лог — що запит дійшов, тест репозиторію — що репозиторій правильно читає файл."
      en: "Restart evidence is a new process and a real request to it: the summary before the stop and after the start must match. The other observations are useful too, but prove something else: the log — that the request arrived, the repository test — that the repository reads the file correctly."

  - id: no-emulator
    kind: prediction
    prompt:
      uk: "Твій проєкт має нативний компаньйон, але на цьому комп’ютері немає ні емулятора, ні телефона. Веб-клієнт пройшов перевірку «клієнт без сервера». Як записати ту саму перевірку для нативного клієнта?"
      en: "Your project has a native companion, but this computer has neither an emulator nor a phone. The web client passed the “client without the server” check. How do you record the same check for the native client?"
    answer:
      type: choice
      options:
        - id: not-performed
          text:
            uk: "Не виконано: причина — немає цілі, і що потрібно, щоб повернутися до перевірки"
            en: "Not performed: the reason — no target, and what it takes to come back to the check"
        - id: passed-shared
          text:
            uk: "Пройдено: адаптер клієнта спільний для вебу й нативного застосунку"
            en: "Passed: the client adapter is shared by the web and the native app"
          why:
            uk: "Спільний код не доводить поведінку на іншій цілі: сховище, мережа й життєвий цикл там свої. Пройденою можна назвати лише виконану перевірку."
            en: "Shared code does not prove behaviour on another target: storage, network and lifecycle are different there. Only a performed check can be called passed."
        - id: failed
          text:
            uk: "Провалено: перевірку не вдалося пройти"
            en: "Failed: the check could not be passed"
          why:
            uk: "Провал — це виконана перевірка з неправильним результатом. Тут перевірку не виконували взагалі."
            en: "A failure is a performed check with the wrong result. Here the check was not performed at all."
      correct: [not-performed]
    explanation:
      uk: "Три результати мають три значення: пройдено — виконано й побачено очікуване; провалено — виконано й побачено інше; не виконано — не було цілі чи часу. Чесний запис «не виконано» краще за «пройдено», яке ніхто не бачив."
      en: "Three outcomes have three meanings: passed — performed and the expected result seen; failed — performed and something else seen; not performed — there was no target or time. An honest “not performed” is better than a “passed” nobody saw."

  - id: what-to-reread
    kind: explanation
    title:
      uk: "Що перечитати"
      en: "What to reread"
    body:
      uk: |
        Познач питання, де ти помилився або вгадав. Ось куди повернутися:

        | Питання про… | Урок |
        |---|---|
        | справу, створену без сервера | «Межа клієнт/сервер і власність даних» і «Офлайн, помилки й повтори в інтегрованому застосунку» (NO-06) |
        | дані CP-JS у React-версії | крок проєкту «Контрольна точка CP-RE: самостійне покращення» (RE-08) |
        | `===` після `JSON.parse` | «Самостійно: CRUD, фільтр і збереження, перевірені тестами» (JS-09) |
        | зайве бронювання після `SIGKILL` | «Самостійно: перезапуск без втрат, перевірений restore» (NO-05) |
        | `500` чи `400` | «Стабільна модель помилок» (NO-04) |
        | доказ перезапуску; «не виконано» | «Огляд контрольної точки: відкладене повторення React і JS» і «Походження доказів і непідтримувані цілі» (RN-08) |

        На CP-NO тобі знадобляться передусім перший і четвертий рядки: саме від них залежать перевірки перезапуску й клієнта без сервера.
      en: |
        Mark the questions where you made a mistake or guessed. Here is where to go back:

        | Question about… | Lesson |
        |---|---|
        | the task created without the server | “The client/server boundary and ownership” and “Offline, errors and retry, integrated” (NO-06) |
        | the CP-JS data in the React version | the project step “Capstone checkpoint CP-RE: independent enhancement” (RE-08) |
        | `===` after `JSON.parse` | “Independent: CRUD, filter and persistence, verified by tests” (JS-09) |
        | the extra booking after `SIGKILL` | “Independent: restart without loss, restore verified” (NO-05) |
        | `500` or `400` | “A stable error model” (NO-04) |
        | restart evidence; “not performed” | “Checkpoint review: delayed React/JS retrieval” and “Provenance and unsupported targets” (RN-08) |

        At CP-NO you will need the first and the fourth rows most: the restart and the client-without-server checks depend on them.
