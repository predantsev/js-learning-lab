id: no-08-05-troubleshoot-explain
unit: NO-08
title:
  uk: "Діагностика й пояснення компромісів"
  en: "Troubleshoot and explain tradeoffs"
kind: local-task
minutes: 25
contentVersion: 1
purpose:
  uk: "Працюючий сервер ламається не так, як у вправі: приходить скарга людини, а не тест, що впав. Тут ти розбираєш дві скарги на запущеному лабораторному сервері за логом з request id, метриками й runbook, записуючи кожен крок, а потім своїми словами пояснюєш три компроміси своєї інтеграції — з доказами й умовою, за якої обрав би інакше."
  en: "A running server breaks differently from an exercise: what arrives is a person’s complaint, not a failing test. Here you work through two complaints on a running lab server using the log with request ids, the metrics and the runbook, recording every step, and then explain three tradeoffs of your integration in your own words — with evidence and a condition under which you would choose differently."
objectives:
  - uk: "Розібрати два повідомлені симптоми на запущеному лабораторному сервері за логами, метриками й runbook, записуючи кожен крок."
    en: "Troubleshoot two reported symptoms on a running lab server from logs, metrics and the runbook, recording every step."
  - uk: "Своїми словами пояснити три компроміси своєї інтеграції (вибір сховища, політика кешу, політика помилок і повторів) і коли обрав би інакше."
    en: "Explain in your own words three trade-offs in your integration (storage choice, cache policy, error and retry policy) and when you would choose differently."
prerequisites: [no-08-04-debug-no-hint-defect]
subskills:
  - { family: B-13, skill: "requirements/tradeoffs", depth: assess }
glossary: []
selfCheck: [which-side]

blocks:
  - id: evidence-first
    kind: explanation
    title:
      uk: "Від скарги до причини — через докази"
      en: "From a complaint to a cause — through evidence"
    body:
      uk: |
        Скарга каже, що людина **побачила**, а не що зламалося: «список відкривається вічність», «мою витрату не зберігає». Здогадка («мабуть, повільний диск») — найдорожчий початок. Починай з доказів, у такому порядку:

        1. **Request id** — мітка запиту, яку сервер повертає в заголовку `x-request-id` і пише в рядок логу. Вона пов’язує скаргу з **одним** рядком логу.
        2. **Рядок логу** — що саме сталося із цим запитом: статус, час (`ms`), помилка, скільки разів прочитано файл (`reads`).
        3. **Метрики** (`GET /metrics`) — порівняння з рештою: один маршрут повільний, а інші швидкі? Тоді причина в коді цього маршруту, а не в машині.
        4. **Runbook** — порядок кроків для відомих симптомів, щоб нічого не пропустити й не змінити нічого раніше, ніж подивився.

        Кожен крок записуй: що запустив, що побачив, що це означає. Такий запис потім читає той, хто перевіряє твоє виправлення.
      en: |
        A complaint says what a person **saw**, not what broke: “the list takes ages to open”, “it does not save my expense”. A guess (“the disk must be slow”) is the most expensive start. Start from evidence, in this order:

        1. **The request id** — a label of the request that the server returns in the `x-request-id` header and writes into the log line. It ties the complaint to **one** log line.
        2. **The log line** — what exactly happened to this request: the status, the time (`ms`), the error, how many times the file was read (`reads`).
        3. **The metrics** (`GET /metrics`) — a comparison with everything else: one route slow and the others fast? Then the cause is in that route’s code, not in the machine.
        4. **The runbook** — the order of steps for known symptoms, so that you skip nothing and change nothing before you have looked.

        Record every step: what you ran, what you saw, what it means. Whoever checks your fix reads that record later.

  - id: which-side
    kind: prediction
    prompt:
      uk: "Скарга: «Витрату на паркування 12.50 не зберігає». Рядок логу з request id цього запиту: `\"method\":\"POST\",\"route\":\"/expenses\",\"error\":{\"amountMinor\":\"notInteger\"},\"status\":400`. Контракт API: `amountMinor` — ціле число копійок, більше за 0. Сторінка надіслала `\"amountMinor\": 12.5`. Де виправлення?"
      en: "A complaint: “My parking expense of 12.50 is not saved”. The log line with this request’s id: `\"method\":\"POST\",\"route\":\"/expenses\",\"error\":{\"amountMinor\":\"notInteger\"},\"status\":400`. The API contract: `amountMinor` is a whole number of minor units, greater than 0. The page sent `\"amountMinor\": 12.5`. Where is the fix?"
    answer:
      type: choice
      options:
        - id: client
          text:
            uk: "У клієнті: перед надсиланням перевести 12.50 у 1250 копійок"
            en: "In the client: turn 12.50 into 1250 minor units before sending"
        - id: server-accept
          text:
            uk: "На сервері: дозволити дробові `amountMinor`, щоб людина не бачила помилки"
            en: "On the server: allow fractional `amountMinor`, so the person sees no error"
          why:
            uk: "Сервер застосовує контракт правильно. Послаблене правило зберегло б 12.5 «копійок» — у сто разів меншу суму, — а суми за категоріями перестали б бути точними цілими числами."
            en: "The server applies the contract correctly. A looser rule would store 12.5 “minor units” — an amount a hundred times smaller — and the category totals would stop being exact whole numbers."
        - id: server-round
          text:
            uk: "На сервері: округлювати `amountMinor` до цілого"
            en: "On the server: round `amountMinor` to a whole number"
          why:
            uk: "Округлення дало б 13 копійок замість 1250: помилка одиниць не зникла б, а стала б тихою. Сервер не знає, що клієнт мав на увазі гривні."
            en: "Rounding would give 13 minor units instead of 1250: the unit mistake would not go away, it would become silent. The server cannot know the client meant the main unit."
        - id: network
          text:
            uk: "У мережі: запит пошкодився дорогою, треба повторити"
            en: "In the network: the request was damaged on the way, it needs a retry"
          why:
            uk: "Рядок логу показує, що сервер отримав і розібрав тіло, а помилка називає конкретне правило. Повтор надіслав би те саме `12.5` і отримав би той самий `400`."
            en: "The log line shows the server received and parsed the body, and the error names a specific rule. A retry would send the same `12.5` and get the same `400`."
      correct: [client]
    explanation:
      uk: "Коли сервер правильно застосовує контракт, порушує його клієнт — і виправлення там. Суми в `amountMinor` лишаються цілими на всьому шляху: сторінка переводить введене в копійки один раз, сервер перевіряє, сховище й підсумки працюють із цілими. Помилку `400` теж не треба повторювати: вона не мине сама."
      en: "When the server applies the contract correctly, the client is the one breaking it — and the fix is there. Amounts in `amountMinor` stay integers end to end: the page turns the input into minor units once, the server checks, the storage and the totals work with integers. A `400` is not worth retrying either: it will not go away by itself."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: порівняй маршрути"
      en: "Recall: compare the routes"
    items:
      - id: one-route-slow
        from: no-03-06-debug-hanging-request
        prompt:
          uk: "`GET /expenses` відповідає за 400 мс, а `GET /expenses/e-01` і `POST /expenses` того самого сервера — за кілька мілісекунд. Що це каже?"
          en: "`GET /expenses` answers in 400 ms, while `GET /expenses/e-01` and `POST /expenses` of the same server answer in a few milliseconds. What does that tell you?"
        answer:
          type: choice
          options:
            - id: one-branch
              text:
                uk: "Причина — у коді саме маршруту списку: сервер загалом не перевантажений"
                en: "The cause is in the list route’s own code: the server as a whole is not overloaded"
            - id: overloaded
              text:
                uk: "Сервер перевантажений: треба потужніший комп’ютер"
                en: "The server is overloaded: it needs a more powerful computer"
              why:
                uk: "Перевантажений сервер сповільнив би всі маршрути. Коли інші відповідають миттєво, повільна одна гілка коду."
                en: "An overloaded server would slow every route down. When the others answer at once, one code path is slow."
            - id: network-slow
              text:
                uk: "Повільна мережа між клієнтом і сервером"
                en: "A slow network between the client and the server"
              why:
                uk: "Мережа та сама для всіх запитів до цього сервера, а час у рядку логу сервер міряє сам — від отримання запиту до відповіді."
                en: "The network is the same for every request to this server, and the time in the log line is measured by the server itself — from receiving the request to answering it."
          correct: [one-branch]
        explanation:
          uk: "Так само, як із запитом, що зависав, порівняй запити. Якщо інші маршрути того самого сервера швидкі, шукай у гілці, яку обрав саме цей запит, — тут допоможуть `reads` у рядку логу."
          en: "As with the request that hung: compare requests. If the other routes of the same server are fast, look in the branch this particular request took — the `reads` in the log line help here."

  - id: support-lab
    kind: example
    runtime: isolated-node
    dir: support-lab
    entry: index.js
    capabilities: { network: loopback }
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      lunch: { uk: "Обід", en: "Lunch" }
      parking: { uk: "Паркування", en: "Parking" }
      items: { uk: "записів", en: "records" }
      runbookDoc:
        uk: |
          # Лабораторія витрат — runbook

          Кожен запис: симптом так, як про нього повідомляють, а далі кроки по черзі. Спершу дивись, потім змінюй; записуй кожну команду й те, що вона показала.

          ## Запит повільний

          1. Візьми request id: заголовок `x-request-id` повільної відповіді (клієнт його друкує) або час скарги.
          2. Знайди його рядок логу: `grep <request-id> server.log`. Запиши `ms` і `reads`.
          3. Порівняй з іншими маршрутами: `GET /metrics` дає `count`, `maxMs` і `statuses` для кожного. Один маршрут повільний, інші швидкі — причина в коді цього маршруту, а не в машині.
          4. Порівняй `reads` з тим, скільки маршрутові треба. Один список — одне читання файла.
          5. Після виправлення — той самий запит, той самий рядок логу, той самий запис метрик. Запиши «до» і «після».

          ## Збереження відхилено

          1. Візьми request id і знайди його рядок логу, як вище. Запиши `status` і `error`.
          2. `400` з `VALIDATION_FAILED`: сервер відмовився від тіла. Прочитай `fields`: яке поле порушило яке правило контракту. Порівняй з тим, що клієнт справді надіслав.
          3. Виріши, яка сторона порушує контракт. Контракт важливіший: якщо сервер застосовує його правильно, виправлення належить клієнтові, а не м’якшому правилу на сервері.
          4. `500`: дефект сервера — поле `error` у рядку логу його називає. Не повторюй запит наосліп.

          ## Дані зникли після перезапуску

          1. `GET /expenses` і порівняй з останнім підсумком, записаним до перезапуску.
          2. Прочитай рядки логу потрібних записів: чи отримали вони `201`?
          3. Лише тоді думай про відновлення з backup — і перевір backup, перш ніж відновлювати.
        en: |
          # Expense lab — runbook

          Each entry: the symptom as people report it, then the steps in order. Look before you change anything; write down every command you ran and what it showed.

          ## A request is slow

          1. Get the request id: the `x-request-id` header of the slow answer (the client prints it), or the time of the report.
          2. Find its log line: `grep <request-id> server.log`. Note `ms` and `reads`.
          3. Compare with the other routes: `GET /metrics` gives `count`, `maxMs` and `statuses` per route. One slow route, others fast → the cause is in that route’s code, not in the machine.
          4. Compare `reads` with what the route should need. One list = one read of the file.
          5. After a fix: the same request again, the same log line, the same metrics entry. Record before and after.

          ## A save is rejected

          1. Get the request id and find its log line, as above. Note `status` and `error`.
          2. `400` with `VALIDATION_FAILED`: the server refused the body. Read `fields`: which field broke which rule of the contract. Compare with what the client actually sent.
          3. Decide which side breaks the contract. The contract wins: if the server applies it correctly, the fix belongs to the client, not to a looser server rule.
          4. `500`: a server defect — the log line’s `error` names it. Do not retry blindly.

          ## Data missing after a restart

          1. `GET /expenses` and compare with the last summary you recorded before the restart.
          2. Read the log lines of the writes in question: did they get `201`?
          3. Only then think about restoring a backup — and verify the backup before restoring it.
