id: no-08-02-integration-plan-tradeoffs
unit: NO-08
title:
  uk: "План інтеграції та компроміси"
  en: "Integration plan and tradeoffs"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Скласти план інтеграції на одну сторінку, що зіставляє кожну вимогу CP-NO з компонентом, перевіркою і її доказом."
    en: "Draft a one-page integration plan that maps each CP-NO requirement to a component, a check and its evidence."
  - uk: "Порівняти два варіанти одного рішення за їхніми режимами відмови й записати вибір із наслідками."
    en: "Compare two options for one decision by their failure modes and record the choice with its consequences."
  - uk: "Написати опис PR і нотатку для runbook, які рецензент може перевірити крок за кроком."
    en: "Write a PR description and a runbook note that a reviewer can verify step by step."
prerequisites: [no-08-01-checkpoint-review]
subskills:
  - { family: B-13, skill: "requirements/tradeoffs", depth: practice }
  - { family: B-13, skill: "PR/review/docs/runbook", depth: intro }
glossary: [failure-mode]
selfCheck: [predict-lost-ack, wishlist-plan]

blocks:
  - id: plan-is-a-map
    kind: explanation
    title:
      uk: "План — це карта, а не список можливостей"
      en: "A plan is a map, not a feature list"
    body:
      uk: |
        «Додати бажання, перемкнути `acquired`, зберегти у файл» — це список можливостей. Він каже, **що** зробити, але не каже, як ти дізнаєшся, що зроблено. План інтеграції — карта із чотирма колонками:

        | Вимога | Компонент | Перевірка | Доказ |
        |---|---|---|---|
        | `acquired` переживає перезапуск | репозиторій | `PATCH`, зупинити сервер, запустити, `GET /items` | `acquired: true` до й після перезапуску |

        Кожна вимога має рядок, кожен рядок — перевірку, яку рецензент може повторити, і доказ, який він порівняє зі своїм.

        А де є вибір, є й компроміс — навіть у сервері з одного файла: писати на диск на кожну зміну чи збирати зміни в пам’яті й скидати їх рідше? Варіанти порівнюють за [[failure-mode|режимами відмови]]: **як** кожен ламається і **що** при цьому втрачає користувач.
      en: |
        “Add a wish, toggle `acquired`, save to a file” is a feature list. It says **what** to do, but not how you will know it is done. An integration plan is a map with four columns:

        | Requirement | Component | Check | Evidence |
        |---|---|---|---|
        | `acquired` survives a restart | the repository | `PATCH`, stop the server, start it, `GET /items` | `acquired: true` before and after the restart |

        Every requirement has a row, every row a check a reviewer can repeat and evidence they will compare with their own.

        And where there is a choice, there is a tradeoff — even in a one-file server: write to disk on every change, or collect changes in memory and flush them less often? Options are compared by their [[failure-mode|failure modes]]: **how** each one breaks and **what** the user loses when it does.

  - id: plan-map
    kind: visual
    visual: diagram
    title:
      uk: "Від вимоги до доказу"
      en: "From a requirement to its evidence"
    textEquivalent:
      uk: "Ліворуч чотири вимоги CP-NO: справжні запити, збереження після перезапуску, поведінка клієнта, відновлення. Праворуч компоненти, що їх реалізують: API, репозиторій, адаптер клієнта, сховище, — і біля кожного його перевірка: curl і лог, зупинити й запустити сервер, перезавантажити сторінку, пошкодити файл. Кроки проводять одну вимогу — збереження після перезапуску — до репозиторію, а від нього до перевірки «зупинити, запустити, GET». Потім відкривається рішення: писати на кожну зміну чи кешувати й скидати раз на 10 секунд. Режим відмови першого — убитий посеред запису процес втрачає лише запис без відповіді; другого — пропадають усі зміни з відповіддю 201 після останнього скидання."
      en: "On the left four CP-NO requirements: real requests, persistence across a restart, client behaviour, recovery. On the right the components that implement them: the API, the repository, the client adapter, the storage — and next to each its check: curl and the log, stop and start the server, reload the page, damage the file. The steps trace one requirement — persistence across a restart — to the repository and from it to the check “stop, start, GET”. Then a decision opens: write on every change, or cache and flush every 10 seconds. The failure mode of the first — a process killed mid-write loses only the write that got no answer; of the second — every change answered 201 since the last flush is gone."
    spec:
      layout: grid
      nodes:
        - { id: r-req, label: { uk: "запити", en: "requests" }, col: 0, row: 0, w: 120 }
        - { id: r-restart, label: { uk: "перезапуск", en: "restart" }, col: 0, row: 1, w: 120 }
        - { id: r-client, label: { uk: "клієнт", en: "client" }, col: 0, row: 2, w: 120 }
        - { id: r-recover, label: { uk: "відновлення", en: "recovery" }, col: 0, row: 3, w: 120 }
        - { id: c-adapter, label: { uk: "адаптер клієнта", en: "client adapter" }, col: 1, row: 2, w: 150 }
        - { id: c-api, label: "API", col: 1, row: 0, w: 150 }
        - { id: c-repo, label: { uk: "репозиторій", en: "repository" }, col: 1, row: 1, w: 150 }
        - { id: c-store, label: { uk: "сховище", en: "storage" }, col: 1, row: 3, shape: cylinder, w: 150 }
        - { id: d-through, label: { uk: "писати щоразу", en: "write each time" }, col: 0, row: 4, w: 120, shape: note }
        - { id: d-cache, label: { uk: "кеш, раз на 10 с", en: "cache, every 10 s" }, col: 1, row: 4, w: 150, shape: note }
      edges:
        - { from: r-req, to: c-api }
        - { from: r-restart, to: c-repo }
        - { from: r-client, to: c-adapter }
        - { from: r-recover, to: c-store }
        - { from: c-repo, to: d-through, kind: dashed }
        - { from: c-repo, to: d-cache, kind: dashed }
      hidden: [d-through, d-cache, c-repo->d-through, c-repo->d-cache]
      steps:
        - caption:
            uk: "Ліворуч вимоги CP-NO, праворуч компоненти, що їх реалізують. Біля кожного компонента — перевірка, якою вимогу доводять."
            en: "On the left the CP-NO requirements, on the right the components that implement them. Next to each component — the check that proves the requirement."
          annotate:
            - { id: c-api, text: "curl + log" }
            - { id: c-repo, text: "stop · start · GET" }
            - { id: c-adapter, text: { uk: "оновити сторінку", en: "reload the page" } }
            - { id: c-store, text: { uk: "зіпсувати файл", en: "damage the file" } }
        - caption:
            uk: "Одна вимога: збереження після перезапуску. Її реалізує репозиторій — саме він вирішує, коли дані опиняються на диску."
            en: "One requirement: persistence across a restart. The repository implements it — it decides when data reaches the disk."
          highlight: [r-restart, c-repo, r-restart->c-repo]
          dim: [r-req, r-client, r-recover, c-adapter, c-api, c-store]
        - caption:
            uk: "Перевірка: змінити запис, **зупинити** сервер, запустити новий процес і надіслати `GET`. Доказ — однаковий підсумок до й після."
            en: "The check: change a record, **stop** the server, start a new process and send a `GET`. The evidence is the same summary before and after."
          highlight: [c-repo]
          dim: [r-req, r-client, r-recover, c-adapter, c-api, c-store]
          annotate:
            - { id: c-repo, text: "stop · start · GET" }
        - caption:
            uk: "Рішення в репозиторії: писати на диск на кожну зміну чи тримати зміни в кеші й скидати раз на 10 секунд?"
            en: "A decision inside the repository: write to disk on every change, or keep changes in a cache and flush every 10 seconds?"
          show: [d-through, d-cache, c-repo->d-through, c-repo->d-cache]
          highlight: [c-repo, d-through, d-cache]
          dim: [r-req, r-client, r-recover, c-adapter, c-api, c-store]
        - caption:
            uk: "Режими відмови: процес, убитий посеред запису, у першому варіанті втрачає лише запис, на який ще не відповіли; у другому — усі зміни з відповіддю `201` після останнього скидання."
            en: "Failure modes: a process killed mid-write loses, in the first option, only the write not yet answered; in the second, every change answered `201` since the last flush."
          highlight: [d-through, d-cache]
          dim: [r-req, r-client, r-recover, c-adapter, c-api, c-store]
          annotate:
            - { id: d-through, text: { uk: "втрата: без відповіді", en: "loses: unanswered" } }
            - { id: d-cache, text: { uk: "втрата: усе з 201", en: "loses: all 201s" } }

  - id: predict-lost-ack
    kind: prediction
    prompt:
      uk: "Два варіанти репозиторію списку бажань. **A:** кожна зміна записується у файл (тимчасовий файл + `rename`), і сервер відповідає `201` лише після `rename`. **B:** зміна потрапляє в пам’ять, сервер одразу відповідає `201`, а таймер записує всю пам’ять у файл раз на 10 секунд. Процес убивають (`SIGKILL`) у випадкову мить посеред потоку змін. Який варіант може втратити зміну, на яку сервер **уже відповів** `201`?"
      en: "Two designs of the wishlist repository. **A:** every change is written to the file (a temp file + `rename`), and the server answers `201` only after the `rename`. **B:** a change goes into memory, the server answers `201` at once, and a timer writes the whole memory to the file every 10 seconds. The process is killed (`SIGKILL`) at a random moment in a stream of changes. Which design can lose a change the server **has already answered** `201`?"
    answer:
      type: choice
      options:
        - id: only-b
          text:
            uk: "Лише B"
            en: "Only B"
        - id: only-a
          text:
            uk: "Лише A: процес можна вбити посеред запису файла"
            en: "Only A: the process can be killed in the middle of writing the file"
          why:
            uk: "Убитий посеред запису процес у варіанті A не встигає зробити `rename`, тож старий файл цілий. Але й відповіді `201` на цю зміну ще не було: втрачається лише непідтверджена зміна."
            en: "In design A a process killed mid-write never reaches the `rename`, so the old file is whole. But the `201` for that change has not been sent either: only an unconfirmed change is lost."
        - id: both
          text:
            uk: "Обидва: будь-який процес можна вбити"
            en: "Both: any process can be killed"
          why:
            uk: "Убити можна будь-який процес, але питання — що втрачається. У варіанті A на диску вже є все, на що сервер відповів; убивство забирає лише те, на що відповіді ще не було."
            en: "Any process can be killed, but the question is what is lost. In design A the disk already has everything the server answered; a kill takes only what had no answer yet."
        - id: neither
          text:
            uk: "Жоден: обидва використовують атомарний `rename`"
            en: "Neither: both use an atomic `rename`"
          why:
            uk: "Атомарний `rename` захищає від **порваного** файла, а не від того, що даних у файлі ще немає. У варіанті B зміни після останнього скидання живуть лише в пам’яті процесу."
            en: "An atomic `rename` protects from a **torn** file, not from data that is not in the file yet. In design B the changes since the last flush live only in the process’s memory."
      correct: [only-b]
    explanation:
      uk: "Режим відмови B — «втрачаються всі зміни з відповіддю `201` після останнього скидання», до 10 секунд роботи. Режим відмови A — «втрачається запис, на який ще не відповіли». Для вимоги «кожна підтверджена зміна переживає перезапуск» B не підходить, хоч би який був інтервал. Зате B робить на диск менше записів — це його перевага, і її варто записати в наслідки рішення."
      en: "B’s failure mode is “every change answered `201` since the last flush is lost”, up to 10 seconds of work. A’s failure mode is “the write that got no answer yet is lost”. For the requirement “every confirmed change survives a restart” B does not fit, whatever the interval. On the other hand B writes to disk less often — that is its advantage, and it belongs in the decision’s consequences."

  - id: kill-harness
    kind: example
    runtime: isolated-node
    dir: kill-harness
    entry: index.js
    capabilities: { network: loopback, timeoutMs: 20000 }
    strings:
      wish: { uk: "Настільна лампа", en: "Desk lamp" }
      rounds: { uk: "раундів", en: "rounds" }
      lostIn: { uk: "із втратою в", en: "with a loss in" }
      lostTotal: { uk: "втрачено підтверджених записів", en: "confirmed writes lost" }
    title:
      uk: "Убий сервер посеред запису"
      en: "Kill the server mid-save"
    body:
      uk: |
        Обидва варіанти з питання в справжньому Node.js:

        - `designs.js` — `writeThrough` (A) і `cached` (B). Метод `kill()` — це «вимикач» харнесу: після нього жоден запис не доходить до файла, як після `SIGKILL`. Чим ця імітація відрізняється від справжнього вбивства, написано в коментарі вгорі файла.
        - `index.js` — харнес: для кожного варіанта 8 раундів «надсилати бажання через HTTP → убити через 150–400 мс → відкрити файл новим репозиторієм». Підтверджено те, на що сервер відповів `201`; підтверджене, якого немає у файлі, — втрачене.

        10 секунд не вміщаються в запуск, тож інтервал скидання тут `FLUSH_MS = 200`. Мить убивства випадкова, тому харнес рахує результат за всі раунди, а не за один.
      en: |
        Both designs from the question in real Node.js:

        - `designs.js` — `writeThrough` (A) and `cached` (B). The `kill()` method is the harness’s “switch”: after it no write reaches the file, as after `SIGKILL`. How this simulation differs from a real kill is written in the comment at the top of the file.
        - `index.js` — the harness: for each design 8 rounds of “send wishes over HTTP → kill after 150–400 ms → open the file with a new repository”. Confirmed is what the server answered `201`; a confirmed write missing from the file is lost.

        10 seconds do not fit into one run, so the flush interval here is `FLUSH_MS = 200`. The moment of the kill is random, so the harness counts the result over all rounds, not one.
    tryIt:
      uk: |
        1. Запусти двічі. У наших запусках (Node.js 25.2.1) `write-through` щоразу втрачав 0 записів, а кеш втрачав підтверджені записи в 7–8 раундах із 8.
        2. Зміни `FLUSH_MS` на `50` і запусти: втрачених записів менше, але раунди з втратою лишаються. Потім на `1000`: тепер скидання не встигає жодного разу, і пропадає все, що сервер підтвердив. Інтервал змінює **розмір** вікна втрати, але не закриває його.
      en: |
        1. Run it twice. In our runs (Node.js 25.2.1) `write-through` lost 0 writes every time, while the cache lost confirmed writes in 7–8 rounds out of 8.
        2. Change `FLUSH_MS` to `50` and run: fewer writes are lost, but rounds with a loss remain. Then to `1000`: now the flush never happens in time, and everything the server confirmed is gone. The interval changes the **size** of the loss window, but does not close it.

  - id: decision-and-pr
    kind: explanation
    title:
      uk: "Запис рішення, опис PR і нотатка runbook"
      en: "A decision record, a PR description and a runbook note"
    body:
      uk: |
        Те, що ти щойно побачив, записують у [[decision-record|запис рішення]]: контекст (вимога «кожна підтверджена зміна переживає перезапуск»), варіанти з їхніми режимами відмови, вибір і наслідки — зокрема ціну вибору (запис на диск на кожну зміну).

        «Код працює» — ще не доказ для рецензента [[pull-request|PR]]. Опис PR каже, що змінилося, і дає кроки перевірки: рецензент повторює кожен крок і порівнює свій результат із доказом із плану. Ті самі кроки потім стають нотаткою в **runbook** — інструкції «що робити, коли щось сталося» для того, хто підтримуватиме сервер: «після перезапуску зникли бажання — надішли `GET /items`, порівняй із підсумком до перезапуску, подивись лог».

        Тому план зручно тримати як дані: з одного опису виходять і PR, і runbook, і перевірки.
      en: |
        What you have just seen goes into a [[decision-record]]: the context (the requirement “every confirmed change survives a restart”), the options with their failure modes, the choice and the consequences — including the cost of the choice (a disk write on every change).

        “The code works” is not yet evidence for the reviewer of a [[pull-request|PR]]. A PR description says what changed and gives verification steps: the reviewer repeats each step and compares their result with the evidence from the plan. The same steps later become a note in the **runbook** — instructions on “what to do when something happens” for whoever maintains the server: “wishes vanished after a restart — send `GET /items`, compare with the summary before the restart, look at the log”.

        That is why it helps to keep the plan as data: the PR, the runbook and the checks all come from one description.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: ресурс і метод"
      en: "Recall: the resource and the method"
    items:
      - id: toggle-acquired
        from: no-04-01-rest-boundaries
        prompt:
          uk: "У плані рядок «перемкнути `acquired` бажання `w-02`» реалізує API. Який запит відповідає стилю REST і не зачіпає інших полів запису?"
          en: "In the plan, the row “toggle `acquired` of wish `w-02`” is implemented by the API. Which request fits the REST style and leaves the record’s other fields alone?"
        answer:
          type: choice
          options:
            - id: patch
              code: 'PATCH /items/w-02  { "acquired": true }'
            - id: put
              code: 'PUT /items/w-02  { "acquired": true }'
              why:
                uk: "`PUT` замінює запис **цілком** тим, що прийшло в тілі. Тіло без `name` і `price` стерло б їх або було б відхилене як неповне."
                en: "`PUT` replaces the record **entirely** with what came in the body. A body without `name` and `price` would erase them or be rejected as incomplete."
            - id: action-url
              code: 'POST /toggleAcquired?id=w-02'
              why:
                uk: "Це адреса-дія. У REST адреса називає ресурс, а що з ним зробити — каже метод."
                en: "That is an action address. In REST the address names the resource, and the method says what to do with it."
          correct: [patch]
        explanation:
          uk: "`PATCH` змінює лише надіслані поля й відповідає `200` зі зміненим записом. У плані це конкретний крок перевірки: `PATCH`, потім `GET /items/w-02` — у відповіді `acquired: true`, а `name` і `price` без змін."
          en: "`PATCH` changes only the fields sent and answers `200` with the changed record. In the plan this is a concrete verification step: `PATCH`, then `GET /items/w-02` — the answer has `acquired: true`, and `name` and `price` unchanged."

  - id: wishlist-plan
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: wishlist-plan
    entry: index.js
    editable: [plan.js]
    strings:
      reqRequests: { uk: "справжні запити: нове бажання через POST /items", en: "real requests: a new wish through POST /items" }
      reqRestart: { uk: "acquired переживає перезапуск сервера", en: "acquired survives a server restart" }
      reqClient: { uk: "після перезавантаження сторінка показує acquired сервера", en: "after a reload the page shows the server’s acquired" }
      reqInvalid: { uk: "некоректна ціна дає 400 і нічого не зберігає", en: "an invalid price gives 400 and stores nothing" }
      actRequest: { uk: "надіслати запит", en: "send a request" }
      actReadLog: { uk: "прочитати лог сервера", en: "read the server log" }
      actStop: { uk: "зупинити сервер", en: "stop the server" }
      actStart: { uk: "запустити сервер", en: "start the server" }
      actReload: { uk: "перезавантажити сторінку", en: "reload the page" }
      howToVerify: { uk: "Як перевірити", en: "How to verify" }
      noRow: { uk: "немає рядка в плані", en: "no row in the plan" }
      evidence: { uk: "доказ", en: "evidence" }
      decisionTitle: { uk: "Рішення", en: "Decision" }
      chosen: { uk: "Обрано", en: "Chosen" }
      evRequests: { uk: "201 і рядок POST /items → 201 у лозі", en: "201 and the line POST /items → 201 in the log" }
      evInvalid: { uk: "400 на price: -5, і GET /items без нового бажання", en: "400 for price: -5, and GET /items without a new wish" }
      evRestart: { uk: "GET /items після запуску: acquired: true, як і до зупинки", en: "GET /items after the start: acquired: true, as before the stop" }
      evClient: { uk: "після перезавантаження позначка така, як у GET /items", en: "after the reload the mark is as in GET /items" }
      decContext: { uk: "Кожна зміна, на яку сервер відповів 201, має пережити перезапуск.", en: "Every change the server answered 201 must survive a restart." }
      decCost: { uk: "Ціна: запис на диск на кожну зміну.", en: "Cost: a disk write on every change." }
      fmThrough: { uk: "процес убито посеред запису — втрачено лише зміну без відповіді", en: "process killed mid-write — only the unanswered change is lost" }
      fmCache: { uk: "процес убито між скиданнями — втрачено всі зміни з 201 після останнього", en: "process killed between flushes — every change answered 201 since the last one is lost" }
      prTitle: { uk: "Зберігати бажання надійно й перевірити CP-NO", en: "Store wishes durably and verify CP-NO" }
      rbSymptom: { uk: "Після перезапуску сервера зникли бажання.", en: "Wishes vanished after a server restart." }
      prSummary: { uk: "Репозиторій пише у файл на кожну зміну й відповідає після rename.", en: "The repository writes the file on every change and answers after the rename." }
    title:
      uk: "План інтеграції списку бажань"
      en: "The wishlist’s integration plan"
    instructions:
      uk: |
        `plan.js` — план інтеграції лабораторного списку бажань як дані. `requirements.js` перелічує вимоги, компоненти й дії перевірки (`ACTIONS`); `render.js` робить із плану опис PR — **Запустити** друкує його так, як його прочитає рецензент. Рядки для запитів і некоректного введення вже готові — зроби так само для решти:

        1. У кожної вимоги з `REQUIREMENTS` рівно один рядок.
        2. `component` кожного рядка — один із `COMPONENTS`.
        3. `steps` кожного рядка — непорожній список дій з `ACTIONS`, а `evidence` — непорожній текст: що рецензент має побачити.
        4. Перевірка `restart` зупиняє сервер, потім запускає його, а **потім** надсилає запит.
        5. Перевірка `client` перезавантажує сторінку **після** запиту.
        6. У записі рішення кожен варіант має `failureMode` (текст) і `losesAcknowledgedWrites` (`true` чи `false`) — так, як показав харнес.
        7. `choice` — `id` варіанта, який не губить підтверджених записів.
        8. `runbook.steps` — нотатка для runbook на випадок «бажання зникли після перезапуску»: кроки з `ACTIONS`, і перший крок лише дивиться (`request` чи `read-log`), нічого не змінюючи.
      en: |
        `plan.js` is the integration plan of the wishlist lab as data. `requirements.js` lists the requirements, the components and the check actions (`ACTIONS`); `render.js` turns the plan into a PR description — **Run** prints it the way a reviewer will read it. The rows for requests and invalid input are ready — do the same for the rest:

        1. Every requirement in `REQUIREMENTS` has exactly one row.
        2. The `component` of every row is one of `COMPONENTS`.
        3. The `steps` of every row are a non-empty list of actions from `ACTIONS`, and `evidence` is a non-empty text: what the reviewer must see.
        4. The `restart` check stops the server, then starts it, and **then** sends a request.
        5. The `client` check reloads the page **after** a request.
        6. In the decision record every option has a `failureMode` (a text) and `losesAcknowledgedWrites` (`true` or `false`) — as the harness showed.
        7. `choice` is the `id` of the option that loses no confirmed writes.
        8. `runbook.steps` is a runbook note for “wishes vanished after a restart”: steps from `ACTIONS`, and the first step only looks (`request` or `read-log`), changing nothing.
    testTitles:
      "every requirement has exactly one row":
        uk: "У кожної вимоги рівно один рядок плану"
        en: "Every requirement has exactly one plan row"
      "every row names a known component":
        uk: "Кожен рядок називає компонент із `COMPONENTS`"
        en: "Every row names a component from `COMPONENTS`"
      "every row has steps from the list and evidence":
        uk: "Кожен рядок має кроки з `ACTIONS` і доказ"
        en: "Every row has steps from `ACTIONS` and evidence"
      "the restart check stops and starts the server, then sends a request":
        uk: "Перевірка `restart`: зупинити, запустити, потім запит"
        en: "The `restart` check: stop, start, then a request"
      "the client check reloads the page after a request":
        uk: "Перевірка `client` перезавантажує сторінку після запиту"
        en: "The `client` check reloads the page after a request"
      "each option names its failure mode and whether it loses acknowledged writes":
        uk: "Кожен варіант має режим відмови й правильне `losesAcknowledgedWrites`"
        en: "Every option has a failure mode and the right `losesAcknowledgedWrites`"
      "the choice keeps every acknowledged write":
        uk: "Обраний варіант не губить підтверджених записів"
        en: "The chosen option loses no confirmed writes"
      "the runbook note starts by looking, not by changing anything":
        uk: "Нотатка runbook починається з того, що дивиться, а не змінює"
        en: "The runbook note starts by looking, not by changing anything"
    hints:
      nudge:
        uk: "Для кожного нового рядка спитай себе: яку дію рецензент має зробити, щоб побачити саме цю вимогу, а не сусідню? Лог доводить, що запит дійшов; що ще треба, щоб довести перезапуск чи поведінку сторінки?"
        en: "For each new row ask yourself: which action must the reviewer take to see exactly this requirement and not a neighbouring one? The log proves the request arrived; what else is needed to prove a restart or the page’s behaviour?"
      explanation:
        uk: "Перевірка доводить вимогу, лише якщо містить подію, від якої вимога захищає, і запит **після** неї. Наприклад, вимогу «сервер не стартує з порожнім списком, коли файл пошкоджено» доводять так: зупинити сервер, пошкодити файл, запустити, надіслати запит і прочитати лог — порядок тут вирішальний. Для рішення поверни харнес: який варіант мав раунди з втратою підтверджених записів?"
        en: "A check proves a requirement only when it contains the event the requirement protects against, and a request **after** it. For example, the requirement “the server does not start with an empty list when the file is damaged” is proven like this: stop the server, damage the file, start it, send a request and read the log — the order is what matters here. For the decision, go back to the harness: which design had rounds with confirmed writes lost?"
    solutionNote:
      uk: "Перезапуск реалізує репозиторій (чи сховище — обидва варіанти прийнятні), а доводить його лише запит до **нового** процесу: `request` → `stop-server` → `start-server` → `request`. Поведінку клієнта доводить перезавантаження після зміни: кеш сторінки зникає, і вона показує те, що каже сервер. У рішенні кеш зі скиданням губить підтверджені записи, тож обрано `write-through`, а ціна — запис на кожну зміну. Runbook починається з того, що дивиться: запит і лог показують, що саме зникло, ще до будь-якого перезапуску."
      en: "The restart is implemented by the repository (or the storage — both are acceptable), and only a request to a **new** process proves it: `request` → `stop-server` → `start-server` → `request`. The client’s behaviour is proven by a reload after the change: the page’s cache is gone, and it shows what the server says. In the decision the flushing cache loses confirmed writes, so `write-through` is chosen, and the cost is a write on every change. The runbook starts by looking: a request and the log show what exactly vanished, before any restart."
    feedback:
      - when: { test: "every requirement has exactly one row" }
        message:
          uk: "Ця перевірка очікує рівно один рядок плану з кожним `requirement` із `REQUIREMENTS` і жодного зайвого рядка. Повідомлення про невдачу називає вимогу, для якої рядків не один."
          en: "This check expects exactly one plan row with each `requirement` from `REQUIREMENTS` and no extra rows. The failure message names the requirement that does not have exactly one row."
      - when: { test: "every row names a known component" }
        message:
          uk: "Ця перевірка очікує, що `component` кожного рядка дослівно збігається з одним із `COMPONENTS`: `client-adapter`, `api`, `repository` чи `storage`."
          en: "This check expects the `component` of every row to match one of `COMPONENTS` exactly: `client-adapter`, `api`, `repository` or `storage`."
      - when: { test: "every row has steps from the list and evidence" }
        message:
          uk: "Ця перевірка очікує в кожному рядку непорожній масив `steps`, де кожен крок — ключ з `ACTIONS` (наприклад, `'stop-server'`), і непорожній текст `evidence`."
          en: "This check expects every row to have a non-empty `steps` array whose every step is a key of `ACTIONS` (for example `'stop-server'`), and a non-empty `evidence` text."
      - when: { test: "the restart check stops and starts the server, then sends a request" }
        message:
          uk: "Ця перевірка шукає в `steps` рядка `restart` `'stop-server'`, далі `'start-server'`, а ще далі `'request'`. Запит до того самого процесу перезапуску не доводить."
          en: "This check looks in the `steps` of the `restart` row for `'stop-server'`, then `'start-server'`, and later a `'request'`. A request to the same process proves no restart."
      - when: { test: "the client check reloads the page after a request" }
        message:
          uk: "Ця перевірка шукає в `steps` рядка `client` `'request'`, а після нього — `'reload-page'`. Без перезавантаження сторінка показує свій кеш, а не відповідь сервера."
          en: "This check looks in the `steps` of the `client` row for a `'request'` followed by `'reload-page'`. Without a reload the page shows its cache, not the server’s answer."
      - when: { test: "each option names its failure mode and whether it loses acknowledged writes" }
        message:
          uk: "Ця перевірка очікує непорожній `failureMode` в обох варіантів, `losesAcknowledgedWrites: false` у `write-through` і `true` у `cache-flush` — як у раундах харнесу."
          en: "This check expects a non-empty `failureMode` in both options, `losesAcknowledgedWrites: false` for `write-through` and `true` for `cache-flush` — as in the harness rounds."
      - when: { test: "the choice keeps every acknowledged write" }
        message:
          uk: "Ця перевірка очікує, що `choice` — це `id` одного з варіантів, і в нього `losesAcknowledgedWrites: false`."
          en: "This check expects `choice` to be the `id` of one of the options, and that option to have `losesAcknowledgedWrites: false`."
      - when: { test: "the runbook note starts by looking, not by changing anything" }
        message:
          uk: "Ця перевірка очікує в `runbook.steps` хоча б один крок з `ACTIONS`, і перший — `'request'` або `'read-log'`. Перезапуск першим кроком стирає те, що могло б пояснити проблему."
          en: "This check expects `runbook.steps` to have at least one step from `ACTIONS`, the first being `'request'` or `'read-log'`. A restart as the first step wipes what could explain the problem."
      - when: { error: SyntaxError }
        message:
          uk: "`plan.js` не вдалося запустити: у ньому синтаксична помилка. Найчастіше бракує коми між полями чи рядками масиву або лапки довкола тексту."
          en: "`plan.js` could not start: it has a syntax error. Most often a comma is missing between fields or array items, or a quote around a text."

  - id: to-project
    kind: transfer
    capstoneStep: NO-08
    body:
      uk: "Крок проєкту цього розділу ще не написано. За планом курсу на CP-NO ти без підказок завершуєш наскрізну інтеграцію свого проєкту й доводиш справжні запити, збереження після перезапуску й поведінку клієнта. План на кшталт цього — вимога, компонент, перевірка, доказ — допоможе нічого не пропустити, а запис рішення з режимами відмови стане частиною пояснення компромісів, яке CP-NO теж просить."
      en: "The project step of this unit is not written yet. According to the course plan, at CP-NO you complete your project’s end-to-end integration without hints and prove real requests, persistence across a restart and client behaviour. A plan like this one — requirement, component, check, evidence — helps you miss nothing, and a decision record with failure modes becomes part of the explanation of tradeoffs that CP-NO also asks for."
