id: no-08-04-debug-no-hint-defect
unit: NO-08
title:
  uk: "Налагодження: дефект інтеграції без підказок"
  en: "Debug: no-hint integration defect"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Перевірити, що ти сам знаходиш дефект, який проходить крізь клієнт, API й сховище: відтворюєш його справжніми запитами, визначаєш шар, у якому причина, виправляєш і пишеш тест, який би його впіймав."
  en: "To check that you find, on your own, a defect that runs through the client, the API and the storage: you reproduce it with real requests, find the layer that causes it, repair it and write the test that would have caught it."
objectives:
  - uk: "Без підказок відтворити, знайти й виправити незнайомий дефект, що проходить крізь клієнт, API й сховище, і додати тест, який би його впіймав."
    en: "Reproduce, locate and repair an unseen defect that spans client, API and storage without hints, and add the test that would have caught it."
prerequisites: [no-08-03-capstone-cp-no-integration]
subskills:
  - { family: B-13, skill: "no-hint defect", depth: assess }
glossary: []
selfCheck: [habit-sync]

blocks:
  - id: the-report
    kind: explanation
    title:
      uk: "Скарга користувача"
      en: "A user’s complaint"
    body:
      uk: |
        Лабораторний трекер звичок — окремий проєкт, не твій: клієнт (`client.js`), API (`app.js`) і репозиторій над JSON-файлом (`repo.js`). Користувач пише:

        > «Я перейменував одну звичку й одразу поставив на паузу іншу. На екрані все правильно. Наступного дня, після перезапуску сервера, пауза зникла».

        Повільно, по одній зміні, відтворити не вдається. Підказок немає. Перевірки надсилають твоєму серверу справжні одночасні запити й «перезапускають» його — відкривають новий репозиторій над тим самим файлом.

        Що здати:

        1. Виправлення, що усуває причину, а не ховає симптом. Відповіді API для коректних і некоректних запитів не змінюються.
        2. `regression.test.js` — [[regression-test|регресійний тест]], що падає на версії зі скарги (її копія лежить у `seeded/`, лише для читання) і проходить на твоїй. **Запустити** відтворює скаргу, а потім запускає твій тест.
        3. Корінну причину трьома реченнями, із шаром, у якому вона виникає, — у локальному завданні наприкінці уроку.
      en: |
        The habit tracker lab is a separate project, not yours: a client (`client.js`), an API (`app.js`) and a repository over a JSON file (`repo.js`). A user writes:

        > “I renamed one habit and right away paused another. The screen showed everything right. The next day, after a server restart, the pause was gone.”

        Slowly, one change at a time, it cannot be reproduced. There are no hints. The checks send your server real simultaneous requests and “restart” it — open a new repository over the same file.

        What to hand in:

        1. A fix that removes the cause rather than hiding the symptom. The API’s answers to valid and invalid requests do not change.
        2. `regression.test.js` — a [[regression-test]] that fails on the version from the complaint (its copy is in `seeded/`, read-only) and passes on yours. **Run** replays the complaint and then runs your test.
        3. The root cause in three sentences, with the layer where it arises — in the local task at the end of the lesson.

  - id: habit-sync
    kind: exercise
    mode: independent
    assessment: true
    runtime: isolated-node
    dir: habit-sync
    entry: index.js
    editable: [repo.js, app.js, client.js, regression.test.js]
    capabilities: { network: loopback, timeoutMs: 20000 }
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      newName: { uk: "Розтяжка", en: "Stretching" }
      beforeRestart: { uk: "сторінка до перезапуску:", en: "page before the restart:" }
      afterRestart: { uk: "сторінка після перезапуску:", en: "page after the restart:" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у regression.test.js.", en: "No tests yet: add test(…) to regression.test.js." }
    title:
      uk: "Пауза, що зникає після перезапуску"
      en: "A pause that vanishes after a restart"
    instructions:
      uk: |
        Виправ лабораторію так, щоб виконувалися всі правила:

        1. Кожна зміна, на яку API відповів `200`, є у файлі після перезапуску — скільки б запитів `PATCH` не прийшло одночасно, до різних звичок чи до однієї.
        2. До перезапуску `GET /habits` теж показує всі зміни.
        3. Решта контракту API не змінюється: невідома звичка — `404`, некоректне тіло — `400`, і в обох випадках файл не змінюється.
        4. `regression.test.js` реєструє хоча б один тест через `test(…)` з `./testing.js`; на версії з `seeded/` хоча б один твій тест падає, а на твоїй версії всі проходять.

        Файли: `repo.js`, `app.js`, `client.js` і `regression.test.js` можна змінювати; `lab.js` (`freshStore`, `serve`), `habits.js`, `testing.js` і `seeded/` — лише для читання. Твій тест може записувати файли лише в теку вправи — `freshStore('назва')` створює там `назва.json`.
      en: |
        Repair the lab so that all the rules hold:

        1. Every change the API answered `200` is in the file after a restart — however many `PATCH` requests arrive at the same time, to different habits or to one.
        2. Before a restart `GET /habits` shows every change as well.
        3. The rest of the API contract does not change: an unknown habit gives `404`, an invalid body `400`, and in both cases the file does not change.
        4. `regression.test.js` registers at least one test through `test(…)` from `./testing.js`; on the version in `seeded/` at least one of your tests fails, and on your version all of them pass.

        Files: `repo.js`, `app.js`, `client.js` and `regression.test.js` can be changed; `lab.js` (`freshStore`, `serve`), `habits.js`, `testing.js` and `seeded/` are read-only. Your test may write files only into the exercise folder — `freshStore('name')` creates `name.json` there.
    testTitles:
      "two quick PATCHes to two habits both survive a restart":
        uk: "Два швидкі `PATCH` до двох звичок обидва переживають перезапуск"
        en: "Two quick `PATCH` requests to two habits both survive a restart"
      "ten quick PATCHes all survive a restart":
        uk: "Десять швидких `PATCH` усі переживають перезапуск"
        en: "Ten quick `PATCH` requests all survive a restart"
      "two quick PATCHes to one habit keep both fields after a restart":
        uk: "Два швидкі `PATCH` до однієї звички зберігають обидва поля після перезапуску"
        en: "Two quick `PATCH` requests to one habit keep both fields after a restart"
      "GET /habits shows both changes before a restart":
        uk: "`GET /habits` показує обидві зміни до перезапуску"
        en: "`GET /habits` shows both changes before a restart"
      "the API still answers 404 for an unknown habit and 400 for an invalid body":
        uk: "API досі відповідає `404` на невідому звичку й `400` на некоректне тіло"
        en: "The API still answers `404` for an unknown habit and `400` for an invalid body"
      "your regression test fails on the version as reported":
        uk: "Твій регресійний тест падає на версії зі скарги (`seeded/`)"
        en: "Your regression test fails on the version from the complaint (`seeded/`)"
      "your regression test passes on your version":
        uk: "Твій регресійний тест проходить на твоїй версії"
        en: "Your regression test passes on your version"
    solutionNote:
      uk: "Кеш у пам’яті завжди правильний, тому екран і `GET /habits` не бачать дефекту. Причина в репозиторії: кожен `update` читає файл, змінює свою звичку й записує файл, а два такі цикли перекриваються — обидва читають ту саму стару версію, і той, хто запише останнім, стирає зміну іншого. Це [[lost-update|втрачене оновлення]]; атомарний `rename` від нього не рятує. Виправлення — [[single-writer-queue|черга з одного записувача]] навколо всього циклу «прочитати — змінити — записати» (або черга записів, що зберігає весь список з пам’яті). Черга лише навколо запису не допомагає: читання вже застаріле. Черга навколо виклику `repo.update` в `app.js` теж проходить перевірки, але тоді порядок тримає API, а репозиторій лишається небезпечним для будь-якого іншого коду, що його викличе. Виправлення в клієнті не допомагає — два різні клієнти так само надішлють запити одночасно. Регресійний тест надсилає дві зміни **одночасно** (`Promise.all`) і читає файл новим репозиторієм; послідовні зміни дефекту не відтворюють."
      en: "The in-memory cache is always right, so the screen and `GET /habits` never see the defect. The cause is in the repository: every `update` reads the file, changes its habit and writes the file, and two such cycles overlap — both read the same old version, and whoever writes last erases the other’s change. This is a [[lost-update]]; an atomic `rename` does not prevent it. The fix is a [[single-writer-queue]] around the whole read-modify-write cycle (or a queue of saves that write the whole list from memory). A queue around the write alone does not help: the read is already stale. A queue around the `repo.update` call in `app.js` passes the checks too, but then the API keeps the order, and the repository stays unsafe for any other code that calls it. A fix in the client does not help — two different clients still send requests at the same time. The regression test sends two changes **at the same time** (`Promise.all`) and reads the file with a new repository; changes made one after another do not reproduce the defect."
    feedback:
      - when: { test: "two quick PATCHes to two habits both survive a restart" }
        message:
          uk: "Ця перевірка одночасно перейменовує `h-01` і ставить на паузу `h-02` через HTTP, отримує обидва `200`, а потім відкриває новий репозиторій над тим самим файлом і очікує обидві зміни. Одночасні запити від різних клієнтів перевірки — не з `client.js`, тож вона дивиться на сервер."
          en: "This check renames `h-01` and pauses `h-02` over HTTP at the same time, gets both `200`s, then opens a new repository over the same file and expects both changes. The simultaneous requests come from the check, not from `client.js`, so it looks at the server."
      - when: { test: "ten quick PATCHes all survive a restart" }
        message:
          uk: "Ця перевірка надсилає десять одночасних `PATCH` (шість нових назв і чотири паузи) і після перезапуску очікує їх усі у файлі."
          en: "This check sends ten simultaneous `PATCH` requests (six new names and four pauses) and after the restart expects all of them in the file."
      - when: { test: "two quick PATCHes to one habit keep both fields after a restart" }
        message:
          uk: "Ця перевірка одночасно змінює назву й `active` тієї самої звички `h-03` і після перезапуску очікує обидва поля."
          en: "This check changes the name and `active` of the same habit `h-03` at the same time and after the restart expects both fields."
      - when: { test: "GET /habits shows both changes before a restart" }
        message:
          uk: "Ця перевірка після двох одночасних змін очікує `200` на `GET /habits` і обидві зміни у списку — без перезапуску."
          en: "After two simultaneous changes this check expects `200` for `GET /habits` and both changes in the list — without a restart."
      - when: { test: "the API still answers 404 for an unknown habit and 400 for an invalid body" }
        message:
          uk: "Ця перевірка очікує `404` для `h-99`, `400` для `active: 'no'` і для невідомого поля, а у файлі — ті самі шість звичок з незміненою `h-01`."
          en: "This check expects `404` for `h-99`, `400` for `active: 'no'` and for an unknown field, and in the file the same six habits with `h-01` unchanged."
      - when: { test: "your regression test fails on the version as reported" }
        message:
          uk: "Ця перевірка запускає твій `regression.test.js` поруч з файлами з `seeded/` і очікує щонайменше один тест і щонайменше один провал. Якщо твій тест проходить на версії зі скарги, він не відтворює дефекту — подумай, за яких умов скаргу вдалося відтворити, а за яких ні."
          en: "This check runs your `regression.test.js` next to the files from `seeded/` and expects at least one test and at least one failure. If your test passes on the version from the complaint, it does not reproduce the defect — think about when the complaint could be reproduced and when it could not."
      - when: { test: "your regression test passes on your version" }
        message:
          uk: "Ця перевірка запускає твій `regression.test.js` поруч з твоїми `app.js`, `repo.js` і `client.js` і очікує, що всі тести проходять. Повідомлення про невдачу називає тест і його помилку; **Запустити** показує той самий вивід."
          en: "This check runs your `regression.test.js` next to your `app.js`, `repo.js` and `client.js` and expects every test to pass. The failure message names the test and its error; **Run** shows the same output."

  - id: second-report
    kind: explanation
    title:
      uk: "Друга знахідка: лог, що не замовкає"
      en: "A second finding: a log that never goes quiet"
    body:
      uk: |
        Поки ти відтворював першу скаргу, у лозі сервера трапилося дивне: після того як користувач закрив список витрат, рядки `GET /api/expenses` усе одно з’являються кожні 3 секунди, а після кількох перемикань категорії — по кілька штук за раз.

        Це інший дефект і інший шар — веб-клієнт: компонент списку опитує API, і його ефект не прибирає за собою. Доказом виправлення знову буде лог сервера: скільки запитів приходить після того, як список закрили.

        Це друге завдання — тренування з підказками й готовим розв’язком. Без підказок контрольна точка оцінює перше: «Пауза, що зникає після перезапуску».
      en: |
        While you were reproducing the first complaint, something odd showed up in the server log: after the user closed the expense list, `GET /api/expenses` lines still appear every 3 seconds, and after a few category switches — several at a time.

        This is a different defect in a different layer — the web client: the list component polls the API, and its effect does not clean up after itself. The evidence of the fix is again the server log: how many requests arrive after the list was closed.

        This second task is practice, with hints and a solution. The no-hint assessment of the checkpoint is the first one: “A pause that vanishes after a restart”.

  - id: polling-list
    kind: exercise
    mode: debug
    runtime: browser-react
    dir: polling-list
    entry: main.jsx
    editable: [ExpenseList.jsx]
    strings:
      title: { uk: "Витрати за категорією", en: "Expenses by category" }
      food: { uk: "Їжа", en: "Food" }
      fun: { uk: "Розваги", en: "Fun" }
      close: { uk: "Закрити список", en: "Close the list" }
      open: { uk: "Відкрити список", en: "Open the list" }
      closed: { uk: "Список закрито.", en: "The list is closed." }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      lunch: { uk: "Обід", en: "Lunch" }
    title:
      uk: "Список, що опитує сервер і після того, як його закрили"
      en: "A list that keeps polling after it was closed"
    instructions:
      uk: |
        Тут сервер — імітація всередині сторінки (`fakeServer.js`, лише для читання): вона відповідає на `GET /api/expenses?category=…` через 300 мс і друкує в **Консолі** рядок `server: …` на кожен отриманий запит — це лог сервера цього перегляду. Чим вона відрізняється від справжнього сервера, написано в коментарі вгорі файла.

        Відтвори дефект: запусти, перемкни «Розваги» → «Їжа» кілька разів, закрий список і подивись, чи з’являються нові рядки `server:`. Потім виправ `ExpenseList.jsx`:

        1. Щойно список з’явився, він запитує свою категорію й показує відповідь.
        2. Поки список на екрані, він запитує сервер знову кожні 3 секунди (`POLL_MS`).
        3. Після того як список закрили, до сервера не доходить жоден запит і не лишається жодного таймера.
        4. Після перемикання категорії опитується лише нова категорія, і працює рівно один інтервал.
        5. Відповідь для старої категорії, що прийшла вже після перемикання, не замінює новий список.

        Перевірки підставляють власний годинник і власний сервер, якому відповідають самі, і монтують свої списки для категорій `home` і `transport`.
      en: |
        The server here is a simulation inside the page (`fakeServer.js`, read-only): it answers `GET /api/expenses?category=…` after 300 ms and prints a `server: …` line in the **Console** for every request it receives — the server log of this preview. How it differs from a real server is written in the comment at the top of the file.

        Reproduce the defect: run, switch “Fun” → “Food” a few times, close the list and watch whether new `server:` lines appear. Then fix `ExpenseList.jsx`:

        1. As soon as the list appears, it requests its category and shows the answer.
        2. While the list is on the screen, it asks the server again every 3 seconds (`POLL_MS`).
        3. After the list is closed, no request reaches the server and no timer is left.
        4. After a category switch only the new category is polled, and exactly one interval runs.
        5. An answer for the old category that arrives after the switch does not replace the new list.

        The checks put in their own clock and their own server that they answer by hand, and mount their own lists for the categories `home` and `transport`.
    limits:
      uk: "Сервер тут — імітація в сторінці, а не процес Node.js: запити не йдуть мережею, а «лог сервера» — це Консоль. Справжній лог справжнього сервера ти читаєш у локальних завданнях."
      en: "The server here is a simulation in the page, not a Node.js process: requests do not go over the network, and the “server log” is the Console. You read the real log of a real server in the local tasks."
    testTitles:
      "the list shows the expenses of its category":
        uk: "Список запитує свою категорію одразу й показує відповідь"
        en: "The list requests its category at once and shows the answer"
      "while shown, it asks the server again every 3 seconds":
        uk: "Поки список на екрані, він запитує сервер кожні 3 секунди"
        en: "While shown, the list asks the server every 3 seconds"
      "after the list is closed, no request reaches the server and no timer is left":
        uk: "Після закриття — жодного запиту до сервера й жодного таймера"
        en: "After closing — no request reaches the server and no timer is left"
      "after switching category, only the new category is polled":
        uk: "Після перемикання опитується лише нова категорія, одним інтервалом"
        en: "After a switch only the new category is polled, by one interval"
      "a late answer for the old category does not replace the new list":
        uk: "Запізніла відповідь для старої категорії не замінює новий список"
        en: "A late answer for the old category does not replace the new list"
    hints:
      nudge:
        uk: "Подивись, що ефект запускає і що із цього хтось колись зупиняє. Скільки інтервалів живе після трьох перемикань? А що стається із запитом, який ще в дорозі, коли категорія змінилася?"
        en: "Look at what the effect starts and which of it anyone ever stops. How many intervals are alive after three switches? And what happens to a request still on its way when the category changes?"
      explanation:
        uk: "Ефект, що відкриває щось ззовні, повертає cleanup, який це закриває; React викликає його перед кожним повторним запуском ефекту (зміна залежності) і під час демонтування. Тут ззовні відкрито дві речі: таймер і запит у дорозі. Наприклад, ефект, що слухає `window.addEventListener('online', onOnline)`, повертає `() => window.removeEventListener('online', onOnline)`. Для запиту є два способи: `AbortController` і його `signal` у `fetch` (тоді `abort()` у cleanup, а `AbortError` треба тихо пропустити) або змінна-прапорець ефекту, яку cleanup перемикає, щоб стара відповідь уже не викликала `setExpenses`."
        en: "An effect that opens something outside returns a cleanup that closes it; React calls it before every repeated run of the effect (a dependency changed) and on unmount. Two things are opened outside here: a timer and a request on its way. For example, an effect listening with `window.addEventListener('online', onOnline)` returns `() => window.removeEventListener('online', onOnline)`. For the request there are two ways: an `AbortController` with its `signal` in `fetch` (then `abort()` in the cleanup, and the `AbortError` must be skipped quietly), or a flag variable of the effect that the cleanup flips, so that an old answer no longer calls `setExpenses`."
    solutionNote:
      uk: "Cleanup зупиняє інтервал (`clearInterval`) і скасовує запит, що ще в дорозі (`controller.abort()`); перехоплений `AbortError` — очікуваний, тож його не показують як помилку. React викликає cleanup під час закриття списку й перед ефектом для нової категорії, тому лишається рівно один інтервал, а відповідь для старої категорії вже не доходить до `setExpenses`. Прапорець `current = false` у cleanup теж правильний: запит тоді доходить до сервера, але його відповідь ігнорується."
      en: "The cleanup stops the interval (`clearInterval`) and cancels the request still on its way (`controller.abort()`); the caught `AbortError` is expected, so it is not shown as an error. React calls the cleanup when the list is closed and before the effect for the new category, so exactly one interval remains, and the answer for the old category no longer reaches `setExpenses`. A flag `current = false` in the cleanup is correct too: the request then still reaches the server, but its answer is ignored."
    feedback:
      - when: { test: "the list shows the expenses of its category" }
        message:
          uk: "Ця перевірка очікує один запит одразу після появи списку для `home`, а після відповіді — пункт «%%bulbs%% — 99.90». Якщо всі перевірки падають одночасно, спершу виправ першу помилку в консолі."
          en: "This check expects one request right after the list for `home` appears, and after the answer the item “%%bulbs%% — 99.90”. If every check fails at once, fix the first error in the console first."
      - when: { test: "while shown, it asks the server again every 3 seconds" }
        message:
          uk: "Ця перевірка відповідає на кожен запит і просуває годинник двічі на 3 секунди; очікує рівно три запити для `home`."
          en: "This check answers every request and moves the clock forward twice by 3 seconds; it expects exactly three requests for `home`."
      - when: { test: "after the list is closed, no request reaches the server and no timer is left" }
        message:
          uk: "Ця перевірка закриває список, просуває годинник на 9 секунд і очікує нуль нових запитів і нуль інтервалів. Скасований запит не відповідає на питання про таймер: інтервал, що лишився, — теж витік."
          en: "This check closes the list, moves the clock forward 9 seconds and expects zero new requests and zero intervals. An aborted request does not settle the timer question: an interval left running is a leak too."
      - when: { test: "after switching category, only the new category is polled" }
        message:
          uk: "Ця перевірка перемикає `home` → `transport`, просуває годинник на 6 секунд і очікує рівно три запити, усі для `transport`, і один живий інтервал."
          en: "This check switches `home` → `transport`, moves the clock forward 6 seconds and expects exactly three requests, all for `transport`, and one live interval."
      - when: { test: "a late answer for the old category does not replace the new list" }
        message:
          uk: "Ця перевірка перемикає категорію, поки запит для `home` ще в дорозі, відповідає спершу для `transport`, а потім — запізно — для `home`, і очікує лише «%%transit%% — 520.00»."
          en: "This check switches the category while the request for `home` is still on its way, answers `transport` first and then — late — `home`, and expects only “%%transit%% — 520.00”."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: коли запускається cleanup"
      en: "Recall: when the cleanup runs"
    items:
      - id: cleanup-on-change
        from: re-03-03-dependencies-cleanup
        prompt:
          uk: "Ефект із залежністю `[category]` повертає cleanup. Компонент змонтовано (без StrictMode) з `category = \"food\"`, потім батько передає `\"fun\"`. Що робить React, коли бачить нове значення?"
          en: "An effect with the dependency `[category]` returns a cleanup. The component is mounted (without StrictMode) with `category = \"food\"`, then the parent passes `\"fun\"`. What does React do when it sees the new value?"
        answer:
          type: choice
          options:
            - id: cleanup-then-setup
              text:
                uk: "Спершу cleanup ефекту для `\"food\"`, потім ефект для `\"fun\"`"
                en: "First the cleanup of the effect for `\"food\"`, then the effect for `\"fun\"`"
            - id: setup-only
              text:
                uk: "Лише ефект для `\"fun\"`; cleanup чекає на демонтування"
                en: "Only the effect for `\"fun\"`; the cleanup waits for the unmount"
              why:
                uk: "Cleanup запускається не лише під час демонтування, а й перед **кожним** повторним запуском ефекту. Інакше підписка для `\"food\"` жила б поруч з новою."
                en: "The cleanup runs not only on unmount, but also before **every** repeated run of the effect. Otherwise the subscription for `\"food\"` would live next to the new one."
            - id: nothing
              text:
                uk: "Нічого: ефект уже запускався після першого рендеру"
                en: "Nothing: the effect already ran after the first render"
              why:
                uk: "Так було б з `[]`. З `[category]` React порівнює значення й запускає ефект знову, щойно `category` змінилася."
                en: "That would be so with `[]`. With `[category]` React compares the value and runs the effect again as soon as `category` changed."
          correct: [cleanup-then-setup]
        explanation:
          uk: "Пара «setup — cleanup» обгортає кожен запуск ефекту: перед новим запуском React прибирає за старим. Тому інтервал і запит, відкриті для `\"food\"`, треба закрити саме в cleanup — тоді після перемикання живе лише те, що відкрито для `\"fun\"`."
          en: "The “setup — cleanup” pair wraps every run of the effect: before a new run React cleans up after the old one. That is why the interval and the request opened for `\"food\"` must be closed in the cleanup — then after a switch only what was opened for `\"fun\"` is alive."

  - id: terminal-lab
    kind: example
    runtime: isolated-node
    dir: terminal-lab
    entry: index.js
    capabilities: { network: loopback }
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      newName: { uk: "Розтяжка", en: "Stretching" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у regression.test.js.", en: "No tests yet: add test(…) to regression.test.js." }
    title:
      uk: "Лабораторія для твого терміналу"
      en: "The lab for your terminal"
    body:
      uk: |
        Файли для локального завдання — версія зі скарги:

        - `app.js`, `repo.js`, `client.js`, `habits.js`, `lab.js`, `testing.js` — ті самі, що у вправі «Пауза, що зникає після перезапуску» до твоїх змін;
        - `server.mjs` — сервер лабораторії на `127.0.0.1:7340` над файлом `habits-lab.json`; `--fresh` записує фікстури заново; Ctrl+C зупиняє його;
        - `lab-client.mjs` — справжні запити: `edit` робить дві швидкі зміни, `show` показує `h-01` і `h-02` так, як їх зараз віддає сервер;
        - `run-regression.mjs` — запускає твій `regression.test.js` у терміналі;
        - `package.json` і `.gitignore` — щоб файли `.js` були ES-модулями, а файли даних не потрапляли в commit.

        Платформа не тримає сервер у фоні, тож **Запустити** виконує той самий сценарій в одному процесі.
      en: |
        The files for the local task — the version from the complaint:

        - `app.js`, `repo.js`, `client.js`, `habits.js`, `lab.js`, `testing.js` — the same as in the exercise “A pause that vanishes after a restart” before your changes;
        - `server.mjs` — the lab’s server on `127.0.0.1:7340` over the file `habits-lab.json`; `--fresh` writes the fixtures again; Ctrl+C stops it;
        - `lab-client.mjs` — real requests: `edit` makes two quick edits, `show` shows `h-01` and `h-02` as the server gives them now;
        - `run-regression.mjs` — runs your `regression.test.js` in the terminal;
        - `package.json` and `.gitignore` — so that the `.js` files are ES modules and the data files stay out of commits.

        The platform does not keep a server running in the background, so **Run** plays the same scenario in one process.

  - id: prove-it-locally
    kind: local-task
    runtime: local-node
    title:
      uk: "Відтвори й доведи справжнім перезапуском"
      en: "Reproduce and prove with a real restart"
    intro:
      uk: |
        Тепер та сама лабораторія як справжній процес у твоєму терміналі: сервер, який ти зупиняєш Ctrl+C і запускаєш знову, і справжні HTTP-запити до нього. Потрібні лише Node.js, Git і два вікна терміналу — жодних npm-пакетів.

        Кроки виконано під час підготовки уроку на macOS з Node.js v25.2.1 і Git 2.51.0; вивід нижче справжній (час у рядках логу — за UTC, тож він у тебе інший, а два рядки `PATCH` можуть стояти в іншому порядку). Усі вісім кроків повторено з Node.js v22.13.1 (мінімум курсу) — з тим самим результатом: версія зі скарги загубила одну зі змін в 11 спробах з 11, виправлена — у жодній з 11. У Linux і Windows ми їх не запускали; команди з `PORT=…` написано для терміналу macOS і Linux.

        **Крок 1 — файли.** Створи теку `~/js-course/no-08-habit-lab` і скопіюй у неї всі файли прикладу «Лабораторія для твого терміналу» з тими самими назвами (редактор уже показує їх з текстом твоєю мовою). `repo.js` бери з прикладу: спершу треба відтворити скаргу. Свій виправлений `repo.js` і `regression.test.js` з вправи «Пауза, що зникає після перезапуску» знадобляться в кроці 5.

        **Крок 3 — вивід `node lab-client.mjs edit` (у нас):**

        ```text
        PATCH h-01 → 200, PATCH h-02 → 200
        h-01 name: Розтяжка | h-02 active: false
        ```

        а в першому терміналі — рядки логу сервера:

        ```text
        habit lab listening on http://127.0.0.1:7340
        14:40:28.082 PATCH /habits/h-01 → 200
        14:40:28.082 PATCH /habits/h-02 → 200
        14:40:28.086 GET /habits → 200
        ```

        **Крок 4 — після Ctrl+C, `node server.mjs` і `node lab-client.mjs show`** версія зі скарги губить одну зі змін. Яку саме — залежить від того, чий запис у файл завершився останнім; у наших запусках бувало й так, і так. Наприклад:

        ```text
        h-01 name: Розтяжка | h-02 active: true
        ```

        — обидві відповіді були `200`, а пауза зникла.

        **Крок 7 — `node run-regression.mjs` на версії зі скарги (у нас; поле в рядку `✗` теж буває іншим):**

        ```text
        ✗ two quick edits of two habits both survive a restart — active of h-02 after the restart: очікувалося false, отримано true
        Пройшли: 0 · не пройшли: 1
        ```

        **Крок 8 — `ROOT-CAUSE.md`:** три речення — що бачив користувач, яка причина й у якому шарі, і що тепер не дає їй повторитися (виправлення й тест). Без коду: так, щоб це зрозумів рецензент PR.
      en: |
        Now the same lab as a real process in your terminal: a server you stop with Ctrl+C and start again, and real HTTP requests to it. You need only Node.js, Git and two terminal windows — no npm packages.

        The steps were run while preparing the lesson on macOS with Node.js v25.2.1 and Git 2.51.0; the output below is real (the times in the log lines are in UTC, so yours differ, and the two `PATCH` lines may come in another order). All eight steps were repeated with Node.js v22.13.1 (the course minimum) — with the same result: the version from the complaint lost one of the changes in 11 tries out of 11, the fixed one in none of 11. We did not run them on Linux or Windows; the commands with `PORT=…` are written for the macOS and Linux terminal.

        **Step 1 — the files.** Create the folder `~/js-course/no-08-habit-lab` and copy into it all the files of the example “The lab for your terminal” under the same names (the editor already shows them with the text in your language). Take `repo.js` from the example: first you need to reproduce the complaint. Your fixed `repo.js` and `regression.test.js` from the exercise “A pause that vanishes after a restart” are needed in step 5.

        **Step 3 — the output of `node lab-client.mjs edit` (ours):**

        ```text
        PATCH h-01 → 200, PATCH h-02 → 200
        h-01 name: Stretching | h-02 active: false
        ```

        and in the first terminal — the server’s log lines:

        ```text
        habit lab listening on http://127.0.0.1:7340
        14:38:37.432 PATCH /habits/h-02 → 200
        14:38:37.432 PATCH /habits/h-01 → 200
        14:38:37.435 GET /habits → 200
        ```

        **Step 4 — after Ctrl+C, `node server.mjs` and `node lab-client.mjs show`** the version from the complaint loses one of the changes. Which one depends on whose write to the file finished last; in our runs it went both ways. For example:

        ```text
        h-01 name: Stretching | h-02 active: true
        ```

        — both answers were `200`, and the pause is gone.

        **Step 7 — `node run-regression.mjs` on the version from the complaint (ours; the field in the `✗` line can differ too):**

        ```text
        ✗ two quick edits of two habits both survive a restart — name of h-01 after the restart: expected "Stretching", got "Morning exercise"
        Passed: 0 · failed: 1
        ```

        **Step 8 — `ROOT-CAUSE.md`:** three sentences — what the user saw, what the cause is and in which layer, and what now keeps it from coming back (the fix and the test). No code: so that a PR reviewer understands it.
    tools:
      - name: "Node.js"
        version: { uk: "22.13 або новіший", en: "22.13 or newer" }
        note:
          uk: "Мінімум курсу; під час підготовки — v25.2.1 і v22.13.1."
          en: "The course minimum; v25.2.1 and v22.13.1 while preparing."
      - name: "Git"
        version: { uk: "будь-яка сучасна", en: "any current version" }
        note:
          uk: "Під час підготовки — 2.51.0."
          en: "2.51.0 while preparing."
      - name: { uk: "Два вікна терміналу", en: "Two terminal windows" }
        note:
          uk: "У першому працює сервер, у другому — запити."
          en: "The server runs in the first, the requests in the second."
    steps:
      - text:
          uk: "Перейди в теку лабораторії, куди ти вже поклав файли з кроку 1 вступу, і зафіксуй версію зі скарги окремим commit."
          en: "Go to the lab folder where you have already put the files from step 1 of the introduction, and commit the version from the complaint on its own."
        command: "mkdir -p ~/js-course/no-08-habit-lab\ncd ~/js-course/no-08-habit-lab\ngit init\ngit add -A\ngit commit -m \"Add the NO-08 habit lab as reported\""
        expect:
          uk: "Рядок на кшталт `[master (root-commit) 2392836] Add the NO-08 habit lab as reported` (назва гілки й id commit у тебе інші); `git status` каже, що робоче дерево чисте."
          en: "A line like `[master (root-commit) 2392836] Add the NO-08 habit lab as reported` (your branch name and commit id differ); `git status` says the working tree is clean."
      - text:
          uk: "У першому терміналі запусти сервер (з тієї самої теки)."
          en: "In the first terminal start the server (from the same folder)."
        command: "node server.mjs"
        expect:
          uk: "`habit lab listening on http://127.0.0.1:7340`, і термінал лишається зайнятим. Якщо порт зайнятий, запусти з іншим: `PORT=7342 node server.mjs`, і тоді в другому терміналі теж став `PORT=7342` перед кожною командою."
          en: "`habit lab listening on http://127.0.0.1:7340`, and the terminal stays busy. If the port is taken, start with another one: `PORT=7342 node server.mjs`, and then put `PORT=7342` before every command in the second terminal too."
      - text:
          uk: "У другому терміналі (у тій самій теці) зроби дві швидкі зміни й подивись на обидва термінали."
          en: "In the second terminal (in the same folder) make two quick edits and look at both terminals."
        command: "node lab-client.mjs edit"
        expect:
          uk: "Обидві відповіді `200`, `h-02 active: false`; у першому терміналі два рядки `PATCH` і рядок `GET` — як у кроці 3 вступу."
          en: "Both answers `200`, `h-02 active: false`; in the first terminal two `PATCH` lines and a `GET` line — as in step 3 of the introduction."
      - text:
          uk: "Перезапусти сервер: у першому терміналі Ctrl+C (з’явиться `habit lab stopped`) і знову `node server.mjs`. Потім у другому — `show`. Запиши, що бачиш."
          en: "Restart the server: Ctrl+C in the first terminal (`habit lab stopped` appears) and `node server.mjs` again. Then `show` in the second. Write down what you see."
        command: "node lab-client.mjs show"
        expect:
          uk: "Одна зі змін зникла — або `h-02 active: true`, або в `h-01` стара назва, — хоча сервер відповів `200` на обидві. Скаргу відтворено справжніми запитами."
          en: "One of the changes is gone — either `h-02 active: true` or the old name of `h-01` — although the server answered `200` to both. The complaint is reproduced with real requests."
      - text:
          uk: "Зупини сервер (Ctrl+C), заміни `repo.js` своїм виправленим з вправи, поклади поруч свій `regression.test.js` і переконайся, що з уже зафіксованих файлів змінився лише `repo.js`."
          en: "Stop the server (Ctrl+C), replace `repo.js` with your fixed one from the exercise, put your `regression.test.js` next to it and make sure that among the committed files only `repo.js` changed."
        command: "git diff --stat"
        expect:
          uk: "У списку лише `repo.js` (числа рядків у тебе свої). `regression.test.js` тут немає: він новий, і `git diff` його не показує."
          en: "Only `repo.js` is listed (your line counts differ). `regression.test.js` is not there: it is new, and `git diff` does not show it."
      - text:
          uk: "Повтори кроки 2–4 з виправленням, але запусти сервер з `--fresh`, щоб почати з фікстур: `node server.mjs --fresh`, потім `edit`, Ctrl+C, `node server.mjs`, `show`."
          en: "Repeat steps 2–4 with the fix, but start the server with `--fresh` to begin from the fixtures: `node server.mjs --fresh`, then `edit`, Ctrl+C, `node server.mjs`, `show`."
        command: "node server.mjs --fresh"
        expect:
          uk: "Після перезапуску `show` друкує `h-01 name: Розтяжка | h-02 active: false`: обидві зміни пережили процес."
          en: "After the restart `show` prints `h-01 name: Stretching | h-02 active: false`: both changes outlived the process."
      - text:
          uk: "Зупини сервер. Запусти свій регресійний тест на виправленні, зафіксуй виправлення з тестом, а потім доведи, що тест ловить дефект: тимчасово поверни `repo.js` з першого commit (його id покаже `git log --oneline -2`, другий рядок), запусти тест і поверни виправлення."
          en: "Stop the server. Run your regression test on the fix, commit the fix with the test, then prove that the test catches the defect: bring back `repo.js` from the first commit for a while (`git log --oneline -2` shows its id, the second line), run the test and bring the fix back."
        command: "node run-regression.mjs\ngit add -A\ngit commit -m \"Fix the lost update in the habit repository\"\ngit log --oneline -2\ngit checkout <id-of-the-first-commit> -- repo.js\nnode run-regression.mjs\ngit checkout HEAD -- repo.js\nnode run-regression.mjs"
        expect:
          uk: "Перший і останній запуск — `Пройшли: 1 · не пройшли: 0` (чи скільки в тебе тестів); запуск на версії зі скарги — `✗` і `не пройшли: 1`, як у кроці 7 вступу. Після останньої команди `git status` чистий."
          en: "The first and the last run — `Passed: 1 · failed: 0` (or however many tests you have); the run on the version from the complaint — `✗` and `failed: 1`, as in step 7 of the introduction. After the last command `git status` is clean."
      - text:
          uk: "Напиши `ROOT-CAUSE.md` (три речення, як у кроці 8 вступу) і зафіксуй його."
          en: "Write `ROOT-CAUSE.md` (three sentences, as in step 8 of the introduction) and commit it."
        command: "git add ROOT-CAUSE.md\ngit commit -m \"Explain the root cause of the lost pause\""
        expect:
          uk: "Commit створено; `git log --oneline` показує три commit."
          en: "The commit is created; `git log --oneline` shows three commits."
    verify:
      - id: reproduced
        text:
          uk: "Я бачив дві відповіді `200` і рядки `PATCH` у лозі сервера, а після справжнього перезапуску одна зі змін зникла."
          en: "I saw two `200` answers and the `PATCH` lines in the server log, and after a real restart one of the changes was gone."
      - id: fixed-across-restart
        text:
          uk: "З моїм `repo.js` обидві зміни пережили зупинку й новий запуск сервера."
          en: "With my `repo.js` both changes survived stopping and starting the server again."
      - id: test-catches
        text:
          uk: "Мій регресійний тест пройшов на виправленні й упав на `repo.js` з першого commit."
          en: "My regression test passed on the fix and failed on the `repo.js` from the first commit."
      - id: root-cause
        text:
          uk: "`ROOT-CAUSE.md` має три речення — що бачив користувач, причина з її шаром і що не дасть їй повторитися, — і все зафіксовано."
          en: "`ROOT-CAUSE.md` has three sentences — what the user saw, the cause with its layer and what keeps it from coming back — and everything is committed."
    troubleshooting:
      - problem:
          uk: "`node server.mjs` пише `Error: listen EADDRINUSE: address already in use 127.0.0.1:7340`."
          en: "`node server.mjs` prints `Error: listen EADDRINUSE: address already in use 127.0.0.1:7340`."
        fix:
          uk: "Порт зайнятий — часто це сервер лабораторії з іншого вікна, який ти не зупинив. Зупини його Ctrl+C у тому вікні або запусти з іншим портом: `PORT=7342 node server.mjs`, і тоді `PORT=7342 node lab-client.mjs show`. У Windows PowerShell змінну задають інакше — `$env:PORT=7342` окремою командою перед `node …` (цей варіант ми не запускали)."
          en: "The port is taken — often by the lab server in another window you did not stop. Stop it with Ctrl+C in that window, or start with another port: `PORT=7342 node server.mjs`, and then `PORT=7342 node lab-client.mjs show`. In Windows PowerShell the variable is set differently — `$env:PORT=7342` as a separate command before `node …` (we did not run this variant)."
      - problem:
          uk: "`node lab-client.mjs show` падає з `TypeError: fetch failed`."
          en: "`node lab-client.mjs show` fails with `TypeError: fetch failed`."
        fix:
          uk: "Сервер не працює: його зупинили і ще не запустили знову, або він слухає інший порт. Запусти `node server.mjs` у першому терміналі й повтори."
          en: "The server is not running: it was stopped and not started again, or it listens on another port. Start `node server.mjs` in the first terminal and repeat."
      - problem:
          uk: "Після виправлення `show` усе одно показує одну зі змін втраченою."
          en: "After the fix `show` still shows one of the changes lost."
        fix:
          uk: "Файл даних досі той, що лишила версія зі скарги: запусти сервер з `--fresh`, повтори `edit`, перезапуск і `show`. Якщо зміна губиться й тоді, перевір у `git diff`, що `repo.js` справді твій виправлений."
          en: "The data file is still the one the complaint version left: start the server with `--fresh`, repeat `edit`, the restart and `show`. If a change is still lost, check with `git diff` that `repo.js` really is your fixed one."
    recovery:
      uk: "Перший commit тримає версію зі скарги, тож `git diff` завжди показує саме твої зміни, а `git checkout HEAD -- repo.js` повертає останню зафіксовану версію. Дані лабораторії відновлює `node server.mjs --fresh`."
      en: "The first commit holds the version from the complaint, so `git diff` always shows exactly your changes, and `git checkout HEAD -- repo.js` brings back the last committed version. `node server.mjs --fresh` restores the lab data."
