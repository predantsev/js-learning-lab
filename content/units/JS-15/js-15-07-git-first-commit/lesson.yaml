id: js-15-07-git-first-commit
unit: JS-15
title:
  uk: "Git: status, diff, індекс і commit"
  en: "Git: status, diff, stage, commit"
kind: local-task
minutes: 15
contentVersion: 1
purpose:
  uk: "Git зберігає історію проєкту: кожну версію можна переглянути, порівняти й повернути. Він працює повністю локально — без облікового запису й без інтернету. Ти створиш навчальний репозиторій і зробиш у ньому перші два commits, читаючи стан Git перед кожним кроком."
  en: "Git keeps a project’s history: every version can be viewed, compared and brought back. It works fully locally — no account, no internet. You will create a practice repository and make its first two commits, reading Git’s state before every step."
objectives:
  - uk: "Ініціалізувати репозиторій і читати `git status`, `git diff` і `git diff --staged` до й після редагування та додавання файла в індекс."
    en: "Initialize a repository and read git status, git diff and git diff --staged before and after editing and staging a file."
  - uk: "Зробити commit із повідомленням, яке пояснює, навіщо зроблено зміну, і знайти його в `git log`."
    en: "Make a commit whose message says why the change was made, and find it in git log."
prerequisites: [js-15-06-build-env-sourcemaps]
subskills:
  - { family: P-02, skill: "status/diff/stage/commit", depth: intro }
glossary: [git-repository, working-tree, staging-area, git-commit, diff]

blocks:
  - id: three-places
    kind: explanation
    title:
      uk: "Три місця, де живе зміна"
      en: "Three places where a change lives"
    body:
      uk: |
        [[git-repository|Репозиторій Git]] — звичайна тека проєкту з прихованою підтекою `.git`, де лежить уся історія. Кожна зміна проходить три місця:

        1. **[[working-tree|Робоче дерево]]** — файли, які ти редагуєш. Git бачить, що файл змінено (`modified`) або що він новий і ще не відстежується (`untracked`).
        2. **[[staging-area|Індекс]]** (staging area) — зміни, які ти відібрав для наступного збереження: `git add файл`.
        3. **Історія** — [[git-commit|commits]]: збережені знімки проєкту з повідомленням, автором і часом. `git commit -m "…"` забирає все з індексу в новий commit. Commits ідуть одне за одним на [[git-branch|гілці]] `main` — про гілки буде наступний урок.

        Навіщо проміжний індекс? Щоб один commit містив одну думку. Змінив два файли з різних причин — додаєш і зберігаєш їх окремо.

        Три команди, щоб бачити, що відбувається:

        | Команда | Показує |
        |---|---|
        | `git status` | що змінено, що в індексі, що нове |
        | `git diff` | [[diff]] змін, яких **ще немає** в індексі |
        | `git diff --staged` | diff того, що **вже** в індексі й увійде в commit |
      en: |
        A [[git-repository|Git repository]] is an ordinary project folder with a hidden subfolder `.git` that holds the whole history. Every change passes through three places:

        1. **The [[working-tree|working tree]]** — the files you edit. Git sees that a file was changed (`modified`) or that it is new and not tracked yet (`untracked`).
        2. **The [[staging-area|staging area]]** — the changes you picked for the next save: `git add file`.
        3. **History** — [[git-commit|commits]]: saved snapshots of the project with a message, an author and a time. `git commit -m "…"` takes everything from the staging area into a new commit. Commits follow one another on the [[git-branch|branch]] `main` — branches are the next lesson.

        Why the staging area in between? So that one commit holds one idea. Changed two files for different reasons — you stage and save them separately.

        Three commands to see what is going on:

        | Command | Shows |
        |---|---|
        | `git status` | what changed, what is staged, what is new |
        | `git diff` | the [[diff]] of changes **not yet** staged |
        | `git diff --staged` | the diff of what is **already** staged and will go into the commit |

  - id: first-commits
    kind: visual
    visual: git-graph
    title:
      uk: "Від порожньої теки до двох commits"
      en: "From an empty folder to two commits"
    textEquivalent:
      uk: >-
        git init створює порожній репозиторій з гілкою main. Перший commit c1 зберігає чотири файли:
        README.md, label.mjs, label.test.mjs і package.json. Потім README.md редагують у робочому
        дереві — Git показує його як modified. git add README.md переносить зміну в індекс. git commit
        створює c2, батьком якого є c1, і гілка main пересувається на c2. Робоче дерево знову чисте.
      en: >-
        git init creates an empty repository with a main branch. The first commit c1 saves four files:
        README.md, label.mjs, label.test.mjs and package.json. Then README.md is edited in the working
        tree — Git shows it as modified. git add README.md moves the change into the staging area. git
        commit creates c2, whose parent is c1, and main moves to c2. The working tree is clean again.
    spec:
      steps:
        - op: init
          caption:
            uk: "`git init -b main` створює теку `.git`. Історія порожня; назва `main` чекає на перший commit."
            en: "`git init -b main` creates the `.git` folder. The history is empty; the name `main` waits for the first commit."
        - op: commit
          message: "Add habit label with a test"
          files: [README.md, label.mjs, label.test.mjs, package.json]
          caption:
            uk: "`git add` чотирьох файлів і `git commit` — перший знімок `c1`. Повідомлення каже, що й навіщо додано."
            en: "`git add` of four files and `git commit` — the first snapshot, `c1`. The message says what was added and why."
        - op: modify
          files: [README.md]
          caption:
            uk: "Ти дописуєш рядок у `README.md`. Зміна є лише в робочому дереві: `git status` — `modified`, `git diff` показує новий рядок."
            en: "You add a line to `README.md`. The change exists only in the working tree: `git status` says `modified`, `git diff` shows the new line."
        - op: stage
          files: [README.md]
          caption:
            uk: "`git add README.md` кладе зміну в індекс. Тепер `git diff` порожній, а `git diff --staged` показує цей рядок."
            en: "`git add README.md` puts the change into the staging area. Now `git diff` is empty and `git diff --staged` shows that line."
        - op: commit
          message: "Explain how to run the tests"
          caption:
            uk: "`git commit` створює `c2` з батьком `c1`, і `main` пересувається на нього. Робоче дерево й індекс знову порожні: `nothing to commit, working tree clean`."
            en: "`git commit` creates `c2` with `c1` as its parent, and `main` moves onto it. The working tree and the staging area are empty again: `nothing to commit, working tree clean`."

  - id: predict-diff-after-add
    kind: prediction
    prompt:
      uk: "Ти дописав рядок у `README.md` і виконав `git add README.md`. Що тепер покажуть `git diff` і `git diff --staged`?"
      en: "You added a line to `README.md` and ran `git add README.md`. What do `git diff` and `git diff --staged` show now?"
    answer:
      type: choice
      options:
        - id: staged-only
          text:
            uk: "`git diff` — нічого; `git diff --staged` — доданий рядок"
            en: "`git diff` — nothing; `git diff --staged` — the added line"
        - id: both
          text:
            uk: "Обидві команди — доданий рядок"
            en: "Both commands — the added line"
          why:
            uk: "`git diff` порівнює робоче дерево з індексом. Після `git add` вони однакові, тож різниці немає."
            en: "`git diff` compares the working tree with the staging area. After `git add` they are the same, so there is no difference."
        - id: plain-only
          text:
            uk: "`git diff` — доданий рядок; `git diff --staged` — нічого, бо commit ще не зроблено"
            en: "`git diff` — the added line; `git diff --staged` — nothing, because no commit was made yet"
          why:
            uk: "Навпаки: `--staged` показує саме те, що вже в індексі й чекає на commit."
            en: "The other way round: `--staged` shows exactly what is already staged and waiting for the commit."
      correct: [staged-only]
    explanation:
      uk: "`git diff` — «що я змінив, але ще не відібрав», `git diff --staged` — «що піде в наступний commit». Перед кожним commit варто подивитися на другий: це останній шанс помітити зайве."
      en: "`git diff` is “what I changed but have not picked yet”, `git diff --staged` is “what goes into the next commit”. Look at the second one before every commit: it is the last chance to notice something that does not belong."

  - id: predict-commit-without-add
    kind: prediction
    prompt:
      uk: "У новому репозиторії ти створив файл `label.mjs` і одразу виконав `git commit -m \"Add label\"`, не запускаючи `git add`. Що станеться?"
      en: "In a new repository you created the file `label.mjs` and immediately ran `git commit -m \"Add label\"` without running `git add`. What happens?"
    answer:
      type: choice
      options:
        - id: nothing
          text:
            uk: "Commit не створиться: Git скаже, що в індексі нічого немає, а `label.mjs` — untracked"
            en: "No commit is created: Git says nothing is staged, and `label.mjs` is untracked"
        - id: commits-all
          text:
            uk: "Git збереже всі файли теки"
            en: "Git saves all the files in the folder"
          why:
            uk: "Commit бере лише вміст індексу. Нові файли Git не додає сам — інакше в історію потрапляли б випадкові файли й секрети."
            en: "A commit takes only what is staged. Git does not add new files by itself — otherwise random files and secrets would end up in history."
        - id: empty-commit
          text:
            uk: "Створиться порожній commit з цим повідомленням"
            en: "An empty commit with this message is created"
          why:
            uk: "Порожній commit Git створює лише на окреме прохання. Без змін в індексі він відмовляється й пояснює чому."
            en: "Git creates an empty commit only when explicitly asked. With nothing staged it refuses and explains why."
      correct: [nothing]
    explanation:
      uk: "Git відповідає `nothing added to commit but untracked files present (use \"git add\" to track)`. Він нічого не зберігає без твого `git add`, а нові файли зі списку `.gitignore` `git add` пропускає, навіть коли ти додаєш усю теку."
      en: "Git answers `nothing added to commit but untracked files present (use \"git add\" to track)`. It saves nothing without your `git add`, and `git add` skips new files listed in `.gitignore` even when you add the whole folder."

  - id: first-repository
    kind: local-task
    runtime: local-web
    title:
      uk: "Навчальний репозиторій і перші два commits"
      en: "A practice repository and its first two commits"
    intro:
      uk: |
        Ти створиш теку `~/js-course/git-lab` — навчальний репозиторій для всіх уроків Git у цьому розділі. Дані в ньому вигадані. Команди Git однакові на macOS, Linux і Windows PowerShell.

        Id commits (як-от `3ab7a35`) у тебе будуть **іншими**: їх обчислено з часу й автора. Порівнюй решту виводу.

        Якщо після `git diff` чи `git log` унизу з’являється `:` або `(END)` і термінал не приймає команд — це перегляд довгого виводу. Натисни `q`.

        Вміст файлів для кроків — копіюй його точно:

        **Крок 3 — `README.md`:**

        ```markdown
        # Git lab

        A practice repository for the course. Nothing here is real data.
        ```

        **Крок 3 — `label.mjs`:**

        ```js
        // label.mjs: how one habit is shown in the list.
        export function habitLabel(habit) {
          return `${habit.name} (${habit.frequency})`;
        }
        ```

        **Крок 3 — `label.test.mjs`:**

        ```js
        // label.test.mjs: run with npm test.
        import { test } from "node:test";
        import assert from "node:assert/strict";
        import { habitLabel } from "./label.mjs";

        test("shows the name and the frequency", () => {
          const habit = { name: "Drink water", frequency: "daily", active: true };
          assert.equal(habitLabel(habit), "Drink water (daily)");
        });
        ```
      en: |
        You will create the folder `~/js-course/git-lab` — the practice repository for every Git lesson in this unit. Its data is made up. Git commands are the same on macOS, Linux and Windows PowerShell.

        Commit ids (such as `3ab7a35`) will be **different** for you: they are computed from the time and the author. Compare the rest of the output.

        If after `git diff` or `git log` a `:` or `(END)` appears at the bottom and the terminal does not accept commands, you are in a viewer for long output. Press `q`.

        File contents for the steps — copy them exactly:

        **Step 3 — `README.md`:**

        ```markdown
        # Git lab

        A practice repository for the course. Nothing here is real data.
        ```

        **Step 3 — `label.mjs`:**

        ```js
        // label.mjs: how one habit is shown in the list.
        export function habitLabel(habit) {
          return `${habit.name} (${habit.frequency})`;
        }
        ```

        **Step 3 — `label.test.mjs`:**

        ```js
        // label.test.mjs: run with npm test.
        import { test } from "node:test";
        import assert from "node:assert/strict";
        import { habitLabel } from "./label.mjs";

        test("shows the name and the frequency", () => {
          const habit = { name: "Drink water", frequency: "daily", active: true };
          assert.equal(habitLabel(habit), "Drink water (daily)");
        });
        ```
    tools:
      - name: "Git"
        version: "2.28 or newer (checked with 2.51)"
        note:
          uk: "macOS: перший запуск `git` пропонує встановити Command Line Tools — погоджуйся; Windows: Git for Windows з git-scm.com; Linux: пакет `git` твого дистрибутива. Обліковий запис не потрібен."
          en: "macOS: the first `git` run offers to install the Command Line Tools — accept; Windows: Git for Windows from git-scm.com; Linux: your distribution’s `git` package. No account needed."
      - name: "Node.js"
        version: "22.13 or newer"
      - name: "A code editor"
        version: "VS Code or any plain-text editor"
    steps:
      - text:
          uk: |
            Перевір версію Git і подивись, чи Git уже знає, як підписувати твої commits:
          en: |
            Check the Git version and see whether Git already knows how to sign your commits:
        command: "git --version\ngit config --global user.name\ngit config --global user.email"
        expect:
          uk: "`git version 2.51.0` (у тебе може бути інша, не старша за 2.28). Якщо Git уже налаштовано, далі йдуть ім’я й адреса; якщо ні — після версії нічого."
          en: "`git version 2.51.0` (yours may differ, but not older than 2.28). If Git is already set up, a name and an address follow; if not, nothing comes after the version."
      - text:
          uk: |
            **Лише якщо попередній крок не надрукував імені й адреси**, задай їх. Якщо надрукував — пропусти цей крок: ці команди замінили б твої наявні налаштування. Ім’я й адреса записуються в кожен commit, і їх побачить кожен, хто отримає копію репозиторію (наприклад, коли проєкт потрапить на GitHub). Тому для навчання підійде будь-яке ім’я та адреса на кшталт `you@example.com`. Це робиться один раз на комп’ютер.
          en: |
            **Only if the previous step printed no name and address**, set them. If it did print them, skip this step: these commands would replace your existing settings. The name and address are written into every commit, and anyone who gets a copy of the repository (for example once the project is on GitHub) can see them. So for learning any name and an address like `you@example.com` will do. You do this once per computer.
        command: "git config --global user.name \"Your Name\"\ngit config --global user.email \"you@example.com\"\ngit config --global user.name"
        expect:
          uk: "Перші дві команди нічого не друкують, остання — ім’я, яке ти вказав."
          en: "The first two commands print nothing, the last one prints the name you set."
      - text:
          uk: |
            Створи теку `~/js-course/git-lab` і в ній три файли — `README.md`, `label.mjs` і `label.test.mjs` — з вмістом із вступу до завдання (позначки «Крок 3»). Потім створи `package.json` зі script `test` і перевір, що тест проходить:
          en: |
            Create the folder `~/js-course/git-lab` with three files in it — `README.md`, `label.mjs` and `label.test.mjs` — with the contents from the task introduction (marked “Step 3”). Then create `package.json` with a `test` script and check that the test passes:
        command: "cd ~/js-course/git-lab\nnpm init -y\nnpm pkg set \"scripts.test=node --test\"\nnpm test"
        expect:
          uk: "`✔ shows the name and the frequency`, `ℹ pass 1`, `ℹ fail 0`."
          en: "`✔ shows the name and the frequency`, `ℹ pass 1`, `ℹ fail 0`."
      - text:
          uk: "Перетвори теку на репозиторій і подивись, що бачить Git:"
          en: "Turn the folder into a repository and see what Git sees:"
        command: "git init -b main\ngit status"
        expect:
          uk: |
            ```text
            Initialized empty Git repository in /Users/you/js-course/git-lab/.git/
            On branch main

            No commits yet

            Untracked files:
              (use "git add <file>..." to include in what will be committed)
            	README.md
            	label.mjs
            	label.test.mjs
            	package.json

            nothing added to commit but untracked files present (use "git add" to track)
            ```
          en: |
            ```text
            Initialized empty Git repository in /Users/you/js-course/git-lab/.git/
            On branch main

            No commits yet

            Untracked files:
              (use "git add <file>..." to include in what will be committed)
            	README.md
            	label.mjs
            	label.test.mjs
            	package.json

            nothing added to commit but untracked files present (use "git add" to track)
            ```
      - text:
          uk: "Додай файли в індекс, назвавши кожен, і подивись, що увійде в commit. `--stat` показує лише назви й кількість рядків коду."
          en: "Stage the files, naming each one, and look at what goes into the commit. `--stat` shows only the names and the number of lines."
        command: "git add README.md label.mjs label.test.mjs package.json\ngit status\ngit diff --staged --stat"
        expect:
          uk: |
            ```text
            Changes to be committed:
              (use "git rm --cached <file>..." to unstage)
            	new file:   README.md
            	new file:   label.mjs
            	new file:   label.test.mjs
            	new file:   package.json

             README.md      |  3 +++
             label.mjs      |  4 ++++
             label.test.mjs |  9 +++++++++
             package.json   | 13 +++++++++++++
             4 files changed, 29 insertions(+)
            ```

            Кількість рядків у `package.json` може трохи відрізнятися залежно від версії npm.
          en: |
            ```text
            Changes to be committed:
              (use "git rm --cached <file>..." to unstage)
            	new file:   README.md
            	new file:   label.mjs
            	new file:   label.test.mjs
            	new file:   package.json

             README.md      |  3 +++
             label.mjs      |  4 ++++
             label.test.mjs |  9 +++++++++
             package.json   | 13 +++++++++++++
             4 files changed, 29 insertions(+)
            ```

            The line count of `package.json` may differ slightly depending on the npm version.
      - text:
          uk: "Зроби перший commit. Повідомлення — коротке речення про те, **що** й **навіщо**:"
          en: "Make the first commit. The message is a short sentence about **what** and **why**:"
        command: "git commit -m \"Add habit label with a test\"\ngit status\ngit log --oneline"
        expect:
          uk: |
            ```text
            [main (root-commit) 3ab7a35] Add habit label with a test
             4 files changed, 29 insertions(+)
             create mode 100644 README.md
             …
            On branch main
            nothing to commit, working tree clean
            3ab7a35 Add habit label with a test
            ```
          en: |
            ```text
            [main (root-commit) 3ab7a35] Add habit label with a test
             4 files changed, 29 insertions(+)
             create mode 100644 README.md
             …
            On branch main
            nothing to commit, working tree clean
            3ab7a35 Add habit label with a test
            ```
      - text:
          uk: |
            У редакторі допиши в кінець `README.md` порожній рядок і рядок тексту ``Run the tests with `npm test`.`` Збережи. **Спершу передбач**, що покажуть команди, потім запусти:
          en: |
            In the editor add an empty line and the line ``Run the tests with `npm test`.`` to the end of `README.md`. Save. **First predict** what the commands show, then run them:
        command: "git status\ngit diff"
        expect:
          uk: |
            `git status`: `Changes not staged for commit:` … `modified:   README.md`. `git diff`:

            ```diff
            @@ -1,3 +1,5 @@
             # Git lab

             A practice repository for the course. Nothing here is real data.
            +
            +Run the tests with `npm test`.
            ```
          en: |
            `git status`: `Changes not staged for commit:` … `modified:   README.md`. `git diff`:

            ```diff
            @@ -1,3 +1,5 @@
             # Git lab

             A practice repository for the course. Nothing here is real data.
            +
            +Run the tests with `npm test`.
            ```
      - text:
          uk: "Додай зміну в індекс і порівняй два diff — як у передбаченні:"
          en: "Stage the change and compare the two diffs — as in the prediction:"
        command: "git add README.md\ngit diff\ngit diff --staged"
        expect:
          uk: "`git diff` не друкує нічого; `git diff --staged` показує ті самі два рядки з `+`."
          en: "`git diff` prints nothing; `git diff --staged` shows the same two lines with `+`."
      - text:
          uk: "Збережи другий commit і подивись на історію:"
          en: "Save the second commit and look at the history:"
        command: "git commit -m \"Explain how to run the tests\"\ngit log --oneline"
        expect:
          uk: |
            ```text
            [main eab0f9f] Explain how to run the tests
             1 file changed, 2 insertions(+)
            eab0f9f Explain how to run the tests
            3ab7a35 Add habit label with a test
            ```

            Найновіший commit — угорі.
          en: |
            ```text
            [main eab0f9f] Explain how to run the tests
             1 file changed, 2 insertions(+)
            eab0f9f Explain how to run the tests
            3ab7a35 Add habit label with a test
            ```

            The newest commit is at the top.
    verify:
      - id: untracked-seen
        text:
          uk: "Я бачив усі чотири файли в `Untracked files`, а після `git add` — у `Changes to be committed`."
          en: "I saw all four files under `Untracked files`, and after `git add` under `Changes to be committed`."
      - id: diff-vs-staged
        text:
          uk: "Після `git add README.md` команда `git diff` нічого не показала, а `git diff --staged` показала доданий рядок."
          en: "After `git add README.md`, `git diff` showed nothing and `git diff --staged` showed the added line."
      - id: two-commits
        text:
          uk: "`git log --oneline` показує два commits з моїми повідомленнями, новіший угорі."
          en: "`git log --oneline` shows two commits with my messages, the newer at the top."
    troubleshooting:
      - problem:
          uk: "`Author identity unknown` … `Please tell me who you are.`"
          en: "`Author identity unknown` … `Please tell me who you are.`"
        fix:
          uk: "Git не знає, як підписати commit. Виконай команди `git config --global` з кроку 2 і повтори `git commit`."
          en: "Git does not know how to sign the commit. Run the `git config --global` commands from step 2 and repeat `git commit`."
      - problem:
          uk: "`fatal: not a git repository (or any of the parent directories): .git`"
          en: "`fatal: not a git repository (or any of the parent directories): .git`"
        fix:
          uk: "Ти не в теці репозиторію. `pwd` має закінчуватися на `git-lab`; якщо там, то `git init -b main` ще не виконано."
          en: "You are not in the repository folder. `pwd` should end with `git-lab`; if it does, `git init -b main` has not been run yet."
      - problem:
          uk: "Відкрився незнайомий редактор (Vim, nano) з текстом про commit message"
          en: "An unfamiliar editor (Vim, nano) opened with text about a commit message"
        fix:
          uk: "Ти запустив `git commit` без `-m`. У Vim набери `:q!` і Enter, у nano — Ctrl + X: commit скасується. Повтори команду з `-m \"повідомлення\"`."
          en: "You ran `git commit` without `-m`. In Vim type `:q!` and Enter, in nano press Ctrl + X: the commit is cancelled. Repeat the command with `-m \"message\"`."
      - problem:
          uk: "Windows: `warning: in the working copy of 'README.md', LF will be replaced by CRLF the next time Git touches it`"
          en: "Windows: `warning: in the working copy of 'README.md', LF will be replaced by CRLF the next time Git touches it`"
        fix:
          uk: "Це попередження про різні символи кінця рядка в Windows і macOS/Linux. На навчання воно не впливає — продовжуй."
          en: "This is a warning about different end-of-line characters on Windows and macOS/Linux. It does not affect the exercise — carry on."
      - problem:
          uk: "`git init -b main` — ``error: unknown switch `b'``"
          en: "`git init -b main` — ``error: unknown switch `b'``"
        fix:
          uk: "Git старший за 2.28. Онови Git (див. «Що знадобиться»)."
          en: "Git is older than 2.28. Update Git (see “What you need”)."
    recovery:
      uk: "Усе в `~/js-course/git-lab` навчальне. Якщо історія заплуталася на самому початку, можна почати з нуля: видали лише приховану теку `.git` (macOS/Linux: `rm -rf .git` **у теці `git-lab`** — спершу перевір `pwd`; Windows: `Remove-Item -Recurse -Force .git`) — файли залишаться, зникне тільки історія, — і повтори кроки з `git init`."
      en: "Everything in `~/js-course/git-lab` is for practice. If the history got tangled right at the start, you can start over: delete only the hidden folder `.git` (macOS/Linux: `rm -rf .git` **in the `git-lab` folder** — check `pwd` first; Windows: `Remove-Item -Recurse -Force .git`) — the files stay, only the history disappears — and repeat the steps from `git init`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-15
    body:
      uk: "Наприкінці розділу ти зробиш перший commit свого проєкту — з README, що описує його записи. Читатимеш `git status` і `git diff --staged` перед ним так само, як сьогодні."
      en: "At the end of the unit you will make your project’s first commit — with a README that describes its records. You will read `git status` and `git diff --staged` before it just as today."
