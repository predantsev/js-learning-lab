id: js-15-05-lint-format
unit: JS-15
title:
  uk: "Lint і форматування"
  en: "Lint and format"
kind: local-task
minutes: 12
contentVersion: 1
purpose:
  uk: "У професійних проєктах код перевіряють інструменти ще до тестів: linter шукає ймовірні помилки, formatter вирівнює стиль. Ти підключиш обидва до проєкту, побачиш, що кожен із них знаходить, і виправиш справжню помилку, яку знайшов linter."
  en: "In professional projects tools check code even before the tests: a linter looks for likely bugs, a formatter evens out the style. You will add both to the project, see what each of them finds and fix a real bug the linter found."
objectives:
  - uk: "Запустити linter і formatter через scripts у `package.json` і відрізнити знахідку lint (ймовірна помилка) від зміни форматування (лише стиль)."
    en: "Run a linter and a formatter from package.json scripts and tell a lint finding (a likely bug) from a formatting change (style only)."
  - uk: "Виправити справжню знахідку lint — невикористану змінну чи затінену назву — і пояснити, до чого вона могла призвести."
    en: "Fix one real lint finding, such as an unused variable or a shadowed name, and explain what it could have caused."
prerequisites: [js-15-04-install-lockfile-semver, js-02-08-shadowing-strict-mode]
subskills:
  - { family: P-01, skill: "lint/format", depth: intro }
glossary: [linter, formatter, lint-rule]

blocks:
  - id: two-tools
    kind: explanation
    title:
      uk: "Linter шукає помилки, formatter — лише стиль"
      en: "A linter looks for bugs, a formatter only for style"
    body:
      uk: |
        Обидва інструменти читають код, **не запускаючи** його, але шукають різне.

        | | [[linter|Linter]] (ESLint) | [[formatter|Formatter]] (Prettier) |
        |---|---|---|
        | Що знаходить | місця, де ймовірно ховається помилка | відступи, пробіли, лапки, перенесення |
        | Чи змінює, що робить код | ні, лише повідомляє | ні, лише переписує вигляд |
        | Що з цим робиш | думаєш і виправляєш сам | дозволяєш йому переписати файл |

        Кожна знахідка linter-а — це [[lint-rule|правило]] з назвою, рядком і стовпчиком:

        ```text
        4:9  error  'currency' is assigned a value but never used  no-unused-vars
        ```

        Рядок коду 4, символ 9; правило `no-unused-vars`. Невикористана змінна сама нічого не ламає, але часто означає, що ти забув нею скористатися — тобто логіка неповна.

        Formatter натомість не помітить жодної помилки: охайно відформатований код може бути так само хибним.
      en: |
        Both tools read code **without running** it, but they look for different things.

        | | [[linter|Linter]] (ESLint) | [[formatter|Formatter]] (Prettier) |
        |---|---|---|
        | What it finds | places where a bug probably hides | indentation, spaces, quotes, line breaks |
        | Does it change what the code does | no, it only reports | no, it only rewrites the look |
        | What you do about it | think and fix it yourself | let it rewrite the file |

        Every finding of a linter is a [[lint-rule|rule]] with a name, a line and a column:

        ```text
        4:9  error  'currency' is assigned a value but never used  no-unused-vars
        ```

        Line 4, character 9; the rule `no-unused-vars`. An unused variable breaks nothing by itself, but it often means you forgot to use it — the logic is incomplete.

        A formatter, on the other hand, notices no bug at all: neatly formatted code can be just as wrong.

  - id: recall-shadowing
    kind: review
    title:
      uk: "Згадай: затінення"
      en: "Recall: shadowing"
    items:
      - id: which-count
        from: js-02-08-shadowing-strict-mode
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          let count = 0;
          for (const step of [1, 2, 3]) {
            let count = step;
          }
          console.log(count);
        verify: { logs: ["0"] }
        answer:
          type: choice
          options:
            - id: zero
              code: "0"
            - id: three
              code: "3"
              why:
                uk: "`let count` усередині циклу — нова змінна, що діє лише в тілі циклу. Зовнішню `count` ніхто не змінював."
                en: "`let count` inside the loop is a new variable that exists only in the loop body. Nobody changed the outer `count`."
            - id: error
              code: "SyntaxError"
              why:
                uk: "Оголосити ту саму назву вдруге заборонено лише в тому самому блоці. У вкладеному блоці це дозволене затінення."
                en: "Declaring the same name twice is forbidden only within the same block. In a nested block it is allowed shadowing."
          correct: [zero]
        explanation:
          uk: "Внутрішній `let count` затіняє зовнішній лише всередині `{ }` циклу. Після циклу `console.log` бачить зовнішню змінну, а вона так і лишилася `0`. Помилки немає — і саме тому таку пастку легко не помітити."
          en: "The inner `let count` shadows the outer one only inside the loop’s `{ }`. After the loop `console.log` sees the outer variable, which is still `0`. There is no error — which is exactly why this trap is easy to miss."

  - id: predict-total
    kind: prediction
    prompt:
      uk: "Що надрукує цей код?"
      en: "What does this code print?"
    code: |
      function totalSpent(expenses) {
        let total = 0;
        const currency = "UAH";
        for (const expense of expenses) {
            let total = 0;
          total = total+expense.amountMinor;
        }
        return total;
      }

      console.log(totalSpent([{ amountMinor: 100 }, { amountMinor: 250 }]));
    verify: { logs: ["0"] }
    answer:
      type: choice
      options:
        - id: zero
          code: "0"
        - id: sum
          code: "350"
          why:
            uk: "Так було б, якби цикл додавав до зовнішнього `total`. Але в тілі циклу оголошено **новий** `total`, і кожен крок пише в нього."
            en: "That would be the result if the loop added to the outer `total`. But a **new** `total` is declared in the loop body, and each step writes into it."
        - id: last
          code: "250"
          why:
            uk: "Внутрішній `total` справді отримує 250 на останньому кроці, але він зникає разом із тілом циклу. `return` читає зовнішній."
            en: "The inner `total` does get 250 on the last step, but it disappears together with the loop body. `return` reads the outer one."
        - id: nan
          code: "NaN"
          why:
            uk: "Обидва `total` починаються з `0`, тож додавання дає числа. Річ не в типах, а в тому, яку змінну змінюють."
            en: "Both `total`s start at `0`, so the addition gives numbers. The problem is not types but which variable gets changed."
      correct: [zero]
    explanation:
      uk: "Зовнішній `total` ніхто не змінює, тому функція повертає `0`. Тести впіймали б це лише тоді, коли б їх написали; linter бачить проблему одразу, просто читаючи код. Заодно зауваж: `currency` ніде не використовується, а пробіли й відступи нерівні."
      en: "Nobody changes the outer `total`, so the function returns `0`. Tests would catch this only if someone wrote them; a linter sees the problem right away just by reading the code. Also note: `currency` is never used, and the spacing and indentation are uneven."

  - id: predict-after-format
    kind: prediction
    prompt:
      uk: "Файл містить функцію з невикористаною змінною `currency` і зайвим `let total = 0;` усередині циклу, що затіняє зовнішній `total`; відступи там нерівні. Ти запускаєш formatter, і він вирівнює відступи й ставить пробіли навколо `+`. Що після цього скаже linter про цей файл?"
      en: "A file holds a function with an unused variable `currency` and an extra `let total = 0;` inside the loop that shadows the outer `total`; its indentation is uneven. You run the formatter, and it evens out the indentation and puts spaces around `+`. What does the linter say about the file after that?"
    answer:
      type: choice
      options:
        - id: still-problems
          text:
            uk: "Ті самі знахідки: невикористана `currency` і затінений `total` нікуди не ділися"
            en: "The same findings: the unused `currency` and the shadowed `total` have not gone anywhere"
        - id: clean
          text:
            uk: "Нічого: після форматування код чистий"
            en: "Nothing: after formatting the code is clean"
          why:
            uk: "Formatter змінює лише вигляд коду. Затінена змінна лишається затіненою, хоч би як рівно вона стояла."
            en: "A formatter changes only how the code looks. A shadowed variable stays shadowed however neatly it is indented."
        - id: new-errors
          text:
            uk: "Нові помилки: formatter міг зламати код"
            en: "New errors: the formatter may have broken the code"
          why:
            uk: "Formatter гарантовано не змінює, що робить код, — тому його й запускають автоматично. Він не додає помилок і не прибирає їх."
            en: "A formatter is guaranteed not to change what the code does — that is why it is run automatically. It neither adds bugs nor removes them."
      correct: [still-problems]
    explanation:
      uk: "Форматування й lint незалежні: перше прибирає суперечки про стиль, друге шукає помилки. Тому в проєктах запускають обидва, а знахідки lint виправляють руками — подумавши."
      en: "Formatting and lint are independent: the first ends arguments about style, the second looks for bugs. That is why projects run both, and lint findings are fixed by hand — after thinking."

  - id: lint-format-lab
    kind: local-task
    runtime: local-web
    title:
      uk: "Підключити ESLint і Prettier та виправити знахідку"
      en: "Add ESLint and Prettier and fix a finding"
    intro:
      uk: |
        Працюєш у `~/js-course/money-lab`. Потрібен інтернет для встановлення двох поширених безкоштовних інструментів — ESLint і Prettier; обліковий запис не потрібен. Команди однакові на macOS, Linux і Windows PowerShell.

        Шляхи у виводі ESLint повні: замість `/Users/you/js-course/money-lab` у тебе буде твій шлях. Кількість пакетів і час можуть відрізнятися.

        Вміст файлів для кроків — копіюй його точно:

        **Крок 2 — `eslint.config.mjs`:**

        ```js
        // eslint.config.mjs: which lint rules apply to this project.
        import js from "@eslint/js";

        export default [
          js.configs.recommended,
          {
            languageOptions: { globals: { console: "readonly" } },
            rules: { "no-shadow": "error" },
          },
        ];
        ```

        **Крок 2 — `report.mjs`:**

        ```js
        // report.mjs: totals for a list of expenses.
        export function totalSpent(expenses) {
          let total = 0;
          const currency = "UAH";
          for (const expense of expenses) {
              let total = 0;
            total = total+expense.amountMinor;
          }
          return total;
        }
        ```
      en: |
        You work in `~/js-course/money-lab`. You need internet access to install two common free tools — ESLint and Prettier; no account is needed. The commands are the same on macOS, Linux and Windows PowerShell.

        ESLint prints full paths: instead of `/Users/you/js-course/money-lab` you will see your own path. The number of packages and the timing may differ.

        File contents for the steps — copy them exactly:

        **Step 2 — `eslint.config.mjs`:**

        ```js
        // eslint.config.mjs: which lint rules apply to this project.
        import js from "@eslint/js";

        export default [
          js.configs.recommended,
          {
            languageOptions: { globals: { console: "readonly" } },
            rules: { "no-shadow": "error" },
          },
        ];
        ```

        **Step 2 — `report.mjs`:**

        ```js
        // report.mjs: totals for a list of expenses.
        export function totalSpent(expenses) {
          let total = 0;
          const currency = "UAH";
          for (const expense of expenses) {
              let total = 0;
            total = total+expense.amountMinor;
          }
          return total;
        }
        ```
    tools:
      - name: { uk: "Node.js і npm", en: "Node.js and npm" }
        version: { uk: "Node.js 22.13 або новіша (ESLint 10 потребує ^20.19, ^22.13 або 24+)", en: "Node.js 22.13 or newer (ESLint 10 needs ^20.19, ^22.13 or 24+)" }
      - name: { uk: "ESLint і Prettier", en: "ESLint and Prettier" }
        version: { uk: "встановлюються в цьому завданні (перевірено з ESLint 10.11 і Prettier 3.9)", en: "installed by this task (checked with ESLint 10.11 and Prettier 3.9)" }
      - name: { uk: "Редактор коду", en: "A code editor" }
        version: { uk: "VS Code або будь-який редактор простого тексту", en: "VS Code or any plain-text editor" }
    steps:
      - text:
          uk: "Встанови linter, його набір правил і formatter як dev-залежності:"
          en: "Install the linter, its rule set and the formatter as dev dependencies:"
        command: "cd ~/js-course/money-lab\nnpm install --save-dev eslint @eslint/js prettier"
        expect:
          uk: |
            ```text
            added 79 packages, and audited 81 packages in 3s

            18 packages are looking for funding
              run `npm fund` for details

            found 0 vulnerabilities
            ```

            Три пакети, які ти назвав, принесли з собою кілька десятків транзитивних залежностей. Рядок про funding — лише інформація, не помилка.
          en: |
            ```text
            added 79 packages, and audited 81 packages in 3s

            18 packages are looking for funding
              run `npm fund` for details

            found 0 vulnerabilities
            ```

            The three packages you named brought several dozen transitive dependencies with them. The funding line is only information, not an error.
      - text:
          uk: |
            Створи файл налаштувань ESLint `eslint.config.mjs` і файл `report.mjs` з вмістом із вступу до завдання (позначки «Крок 2»). Конфігурація вмикає рекомендовані правила, дозволяє `console` і додає правило `no-shadow`, якого немає серед рекомендованих. `report.mjs` копіюй **саме так**, з нерівними відступами й пробілами. Потім додай три scripts:
          en: |
            Create the ESLint settings file `eslint.config.mjs` and the file `report.mjs` with the contents from the task introduction (marked “Step 2”). The configuration turns on the recommended rules, allows `console` and adds the rule `no-shadow`, which is not among the recommended ones. Copy `report.mjs` **exactly like that**, with uneven indentation and spacing. Then add three scripts:
        command: "npm pkg set \"scripts.lint=eslint .\" \"scripts.format=prettier --write .\" \"scripts.format:check=prettier --check .\""
        expect:
          uk: "Нічого не друкує. `npm run` тепер показує ще `lint`, `format` і `format:check`."
          en: "Prints nothing. `npm run` now also lists `lint`, `format` and `format:check`."
      - text:
          uk: "Запусти linter. Крапка в `eslint .` означає «усю робочу теку»."
          en: "Run the linter. The dot in `eslint .` means “the whole working directory”."
        command: "npm run lint"
        expect:
          uk: |
            ```text
            > money-lab@1.0.0 lint
            > eslint .

            /Users/you/js-course/money-lab/report.mjs
              4:9   error  'currency' is assigned a value but never used                       no-unused-vars
              6:11  error  'total' is already declared in the upper scope on line 3 column 7   no-shadow
              7:5   error  The value assigned to 'total' is not used in subsequent statements  no-useless-assignment

            ✖ 3 problems (3 errors, 0 warnings)
            ```

            Прочитай кожну: `currency` не використано; внутрішній `total` затіняє зовнішній з рядка коду 3; значення, яке пише цикл, ніхто потім не читає. Друга й третя — це та сама помилка, через яку функція повертає `0`.
          en: |
            ```text
            > money-lab@1.0.0 lint
            > eslint .

            /Users/you/js-course/money-lab/report.mjs
              4:9   error  'currency' is assigned a value but never used                       no-unused-vars
              6:11  error  'total' is already declared in the upper scope on line 3 column 7   no-shadow
              7:5   error  The value assigned to 'total' is not used in subsequent statements  no-useless-assignment

            ✖ 3 problems (3 errors, 0 warnings)
            ```

            Read each one: `currency` is unused; the inner `total` shadows the outer one from line 3; the value the loop writes is never read afterwards. The second and third are the same bug that makes the function return `0`.
      - text:
          uk: "Тепер formatter: спершу лише перевір, потім дозволь йому переписати файли."
          en: "Now the formatter: first only check, then let it rewrite the files."
        command: "npm run format:check\nnpm run format"
        expect:
          uk: |
            Перевірка знаходить один файл:

            ```text
            Checking formatting...
            [warn] report.mjs
            [warn] Code style issues found in the above file. Run Prettier with --write to fix.
            ```

            `format` переписує лише його, решту позначає `(unchanged)`:

            ```text
            eslint.config.mjs 14ms (unchanged)
            money.mjs 4ms (unchanged)
            …
            report.mjs 1ms
            summarize.mjs 2ms (unchanged)
            ```

            Відкрий `report.mjs`: відступи рівні, навколо `+` пробіли.

            На Windows редактор може зберігати файли із закінченнями рядків коду у стилі Windows (CRLF). Тоді перевірка покаже й інші файли, а `format` перепише їх на LF — це теж лише стиль, код від цього не змінюється.
          en: |
            The check finds one file:

            ```text
            Checking formatting...
            [warn] report.mjs
            [warn] Code style issues found in the above file. Run Prettier with --write to fix.
            ```

            `format` rewrites only that one and marks the rest `(unchanged)`:

            ```text
            eslint.config.mjs 14ms (unchanged)
            money.mjs 4ms (unchanged)
            …
            report.mjs 1ms
            summarize.mjs 2ms (unchanged)
            ```

            Open `report.mjs`: the indentation is even, there are spaces around `+`.

            On Windows the editor may save files with Windows line endings (CRLF). Then the check lists the other files too, and `format` rewrites them to LF — that is style only as well; the code does not change.
      - text:
          uk: "Запусти linter ще раз — і порівняй зі своїм передбаченням:"
          en: "Run the linter again — and compare with your prediction:"
        command: "npm run lint"
        expect:
          uk: "Ті самі три знахідки (`✖ 3 problems`); змінився лише стовпчик другої — `6:9` замість `6:11`, бо formatter пересунув рядок коду."
          en: "The same three findings (`✖ 3 problems`); only the column of the second one changed — `6:9` instead of `6:11`, because the formatter moved the line."
      - text:
          uk: |
            Виправ помилку сам: прибери рядок із `currency` і внутрішнє оголошення `let total = 0;`, щоб цикл додавав до зовнішнього `total`. Збережи й перевір обидва інструменти.
          en: |
            Fix the bug yourself: remove the line with `currency` and the inner declaration `let total = 0;`, so the loop adds to the outer `total`. Save and check both tools.
        command: "npm run lint\nnpm run format:check"
        expect:
          uk: |
            `lint` друкує лише свої два рядки `> …` і нічого більше — знахідок немає. `format:check` пише `All matched files use Prettier code style!`.
          en: |
            `lint` prints only its two `> …` lines and nothing else — no findings. `format:check` prints `All matched files use Prettier code style!`.
    verify:
      - id: lint-found
        text:
          uk: "Перший `npm run lint` показав три знахідки з назвами правил `no-unused-vars`, `no-shadow` і `no-useless-assignment`."
          en: "The first `npm run lint` showed three findings with the rule names `no-unused-vars`, `no-shadow` and `no-useless-assignment`."
      - id: format-not-fix
        text:
          uk: "Після `npm run format` linter знайшов ті самі проблеми."
          en: "After `npm run format` the linter found the same problems."
      - id: lint-clean
        text:
          uk: "Після мого виправлення `npm run lint` не знайшов нічого, а `format:check` — усе в порядку."
          en: "After my fix `npm run lint` found nothing, and `format:check` reported everything in order."
      - id: explained
        text:
          uk: "Я можу пояснити, чому функція повертала `0` і як це показали знахідки lint."
          en: "I can explain why the function returned `0` and how the lint findings showed it."
    troubleshooting:
      - problem:
          uk: "`Oops! Something went wrong! :(` … `ESLint couldn't find an eslint.config.* file.`"
          en: "`Oops! Something went wrong! :(` … `ESLint couldn't find an eslint.config.* file.`"
        fix:
          uk: "Файл налаштувань має назву з помилкою або лежить не в `money-lab`. `ls` має показати саме `eslint.config.mjs`. У Блокноті Windows обирай «All files», щоб не з’явилося `.txt`."
          en: "The settings file has a typo in its name or is not in `money-lab`. `ls` should show exactly `eslint.config.mjs`. In Windows Notepad pick “All files” so no `.txt` gets added."
      - problem:
          uk: "`Cannot find package '@eslint/js'`"
          en: "`Cannot find package '@eslint/js'`"
        fix:
          uk: "Набір правил не встановився. Повтори крок 1 цілком: усі три назви в одній команді."
          en: "The rule set did not install. Repeat step 1 in full: all three names in one command."
      - problem:
          uk: "`'console' is not defined  no-undef` у `summarize.mjs`"
          en: "`'console' is not defined  no-undef` in `summarize.mjs`"
        fix:
          uk: "У `eslint.config.mjs` бракує рядка коду з `globals`. ESLint не знає, у якому середовищі працює код, доки ти не скажеш, які глобальні назви існують."
          en: "`eslint.config.mjs` is missing the line with `globals`. ESLint does not know what environment the code runs in until you tell it which global names exist."
      - problem:
          uk: "Після виправлення лишилося `no-useless-assignment`, разом із `no-shadow` або з `'total' is not defined  no-undef`"
          en: "After the fix `no-useless-assignment` is still there, together with `no-shadow` or with `'total' is not defined  no-undef`"
        fix:
          uk: "Ймовірно, ти залишив обидва оголошення (тоді й `no-shadow`) або прибрав зовнішнє замість внутрішнього (тоді `return total` не бачить жодного `total` — `no-undef`). Має лишитися один `let total = 0;` — перед циклом, — а в циклі лише `total = total + expense.amountMinor;`."
          en: "Probably you kept both declarations (hence `no-shadow` too) or removed the outer one instead of the inner one (then `return total` sees no `total` at all — `no-undef`). Exactly one `let total = 0;` should remain — before the loop — and inside the loop only `total = total + expense.amountMinor;`."
    recovery:
      uk: "Якщо `report.mjs` перетворився на щось незрозуміле, просто скопіюй його з кроку 2 знову: файл навчальний. `npm run format` нічого не ламає — його можна запускати скільки завгодно разів."
      en: "If `report.mjs` turned into something confusing, just copy it from step 2 again: the file is for practice. `npm run format` breaks nothing — you can run it as many times as you like."

  - id: to-project
    kind: transfer
    capstoneStep: JS-15
    body:
      uk: "Коли твій проєкт переїде у VS Code (JS-10), ти запускатимеш `npm run lint` перед кожним збереженням змін в історії: знахідка lint — найдешевший момент упіймати помилку в доменних функціях проєкту."
      en: "Once your project moves to VS Code (JS-10), you will run `npm run lint` before every change you record in history: a lint finding is the cheapest moment to catch a bug in the project’s domain functions."
