id: js-15-12-remotes-pr-review
unit: JS-15
title:
  uk: "Remotes, pull requests і навіщо потрібен review"
  en: "Remotes, pull requests and review rationale"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Надсилати commits у remote й отримувати їх звідти, використовуючи як remote локальний bare-репозиторій без облікового запису, і передбачати, що бачить кожен клон."
    en: "Push to and fetch from a remote, using a local bare repository as the remote so no account is needed, and predict what each clone sees."
  - uk: "Переглянути підготовлений diff як pull request: написати коментар, що називає дефект і вхід, на якому він видно, поставити питання й обґрунтувати approve чи request changes."
    en: "Review a seeded diff as a pull request: write comments that name a defect with its failing case, ask a question, and justify approve or request changes."
prerequisites: [js-15-11-undo-safely, js-09-01-why-tests]
subskills:
  - { family: P-02, skill: "remotes/PR review concepts", depth: intro }
  - { family: P-02, skill: "review rationale", depth: intro }
glossary: [remote-repository, git-push, git-fetch, pull-request, code-review]
selfCheck: [predict-fetch, review-format-price]

blocks:
  - id: remotes
    kind: explanation
    title:
      uk: "Remote — ще одна копія репозиторію"
      en: "A remote is another copy of the repository"
    body:
      uk: |
        Досі вся історія жила лише в твоїй теці. Щоб працювати разом, у кожного є свій клон, а обмінюються вони через [[remote-repository|віддалений репозиторій]] — зазвичай його називають `origin`.

        - `git commit` зберігає commit **лише у твоєму** репозиторії.
        - [[git-push|git push]] надсилає твої commits у remote.
        - [[git-fetch|git fetch]] завантажує нові commits з remote у гілку `origin/main`. Твоя `main` і файли **не змінюються**, доки ти не зробиш `git merge origin/main`.
        - `git clone адреса` створює новий клон з усією історією.

        Remote не обов’язково на сервері. **Bare-репозиторій** — це репозиторій без робочого дерева, лише історія; його можна створити в сусідній теці (`git init --bare`). Саме так ти потренуєшся без жодного облікового запису. GitHub чи GitLab — той самий remote, тільки на сервері, плюс вебсторінки для обговорення змін.
      en: |
        So far the whole history lived only in your folder. To work together, everyone has their own clone, and they exchange commits through a [[remote-repository|remote repository]] — usually called `origin`.

        - `git commit` saves a commit **only in your** repository.
        - [[git-push|git push]] sends your commits to the remote.
        - [[git-fetch|git fetch]] downloads new commits from the remote into the branch `origin/main`. Your `main` and your files **do not change** until you run `git merge origin/main`.
        - `git clone address` creates a new clone with the whole history.

        A remote does not have to be on a server. A **bare repository** is a repository with no working tree, only the history; you can create one in a neighbouring folder (`git init --bare`). That is how you will practise with no account at all. GitHub or GitLab is the same kind of remote, just on a server, plus web pages for discussing changes.

  - id: two-clones
    kind: visual
    visual: diagram
    title:
      uk: "Два клони й спільний remote"
      en: "Two clones and a shared remote"
    textEquivalent:
      uk: >-
        Два клони — git-lab і teammate-lab — обмінюються commits через bare-репозиторій remote-lab.git,
        що виконує роль origin. Commit, зроблений у teammate-lab, лишається лише там, доки його не
        надіслано через git push. Після push він є в remote-lab.git. git fetch у git-lab завантажує його
        в гілку origin/main, а git merge origin/main переносить у власну main. Pull request — це
        запит на злиття гілки: у ньому видно diff, коментарі та рішення рецензента — approve або
        request changes.
      en: >-
        Two clones — git-lab and teammate-lab — exchange commits through the bare repository
        remote-lab.git, which acts as origin. A commit made in teammate-lab stays only there until it is
        sent with git push. After the push it is in remote-lab.git. git fetch in git-lab downloads it
        into the branch origin/main, and git merge origin/main brings it into git-lab’s own main. A pull
        request is a request to merge a branch: it shows the diff, the comments and the reviewer’s
        decision — approve or request changes.
    spec:
      layout: grid
      nodes:
        - { id: you, label: "git-lab", w: 120, col: 0, row: 0 }
        - { id: mate, label: "teammate-lab", w: 130, col: 1, row: 0 }
        - { id: origin, label: "remote-lab.git", shape: cylinder, w: 140, col: 0, row: 1 }
        - { id: pr, label: "pull request", shape: note, w: 140, col: 0, row: 2 }
      edges:
        - { id: mate-push, from: mate, to: origin, label: "push" }
        - { id: you-fetch, from: origin, to: you, label: "fetch" }
        - { id: you-push, from: you, to: origin, label: "push", kind: dashed }
        - { id: review, from: origin, to: pr, kind: dashed, label: { uk: "гілка на review", en: "branch for review" } }
      hidden: [pr, review]
      steps:
        - caption:
            uk: "Три репозиторії: твій, колеги й спільний bare-репозиторій `remote-lab.git` — `origin` для обох."
            en: "Three repositories: yours, a teammate’s and the shared bare repository `remote-lab.git` — `origin` for both."
        - highlight: [mate]
          annotate:
            - { id: mate, text: { uk: "новий commit", en: "new commit" } }
          caption:
            uk: "Колега робить `git commit`. Commit є **лише** в `teammate-lab`: ні `origin`, ні ти його не бачите."
            en: "The teammate runs `git commit`. The commit exists **only** in `teammate-lab`: neither `origin` nor you can see it."
        - highlight: [mate, mate-push, origin]
          caption:
            uk: "`git push` надсилає commit в `origin`. Тепер він є в `remote-lab.git`, але ще не в тебе."
            en: "`git push` sends the commit to `origin`. Now it is in `remote-lab.git`, but not on your machine yet."
        - highlight: [origin, you-fetch, you]
          annotate:
            - { id: you, text: "origin/main" }
          caption:
            uk: "`git fetch` у `git-lab` завантажує його в гілку `origin/main`. Твоя `main` і файли поки ті самі: `git status` скаже `behind by 1 commit`. `git merge origin/main` забере зміну до тебе."
            en: "`git fetch` in `git-lab` downloads it into the branch `origin/main`. Your `main` and files are unchanged so far: `git status` says `behind by 1 commit`. `git merge origin/main` brings the change in."
        - show: [pr, review]
          highlight: [pr, review]
          caption:
            uk: "У команді гілку не зливають у `main` одразу: на сервері відкривають **pull request** — diff, коментарі, тести й рішення рецензента."
            en: "In a team a branch is not merged into `main` right away: on the server a **pull request** is opened — the diff, comments, tests and the reviewer’s decision."

  - id: predict-fetch
    kind: prediction
    prompt:
      uk: "Колега в `teammate-lab` виконав `git commit -m \"Ask before changing the label format\"`, але **не** виконав `git push`. Ти в `git-lab` запускаєш `git fetch`. Що ти отримаєш?"
      en: "Your teammate in `teammate-lab` ran `git commit -m \"Ask before changing the label format\"` but did **not** run `git push`. In `git-lab` you run `git fetch`. What do you get?"
    answer:
      type: choice
      options:
        - id: nothing
          text:
            uk: "Нічого нового: commit досі лише в репозиторії колеги"
            en: "Nothing new: the commit is still only in the teammate’s repository"
        - id: commit-arrives
          text:
            uk: "Commit колеги з’явиться в `origin/main`"
            en: "The teammate’s commit appears in `origin/main`"
          why:
            uk: "`git commit` нікуди нічого не надсилає. Fetch бере лише те, що вже є в remote, а туди commit потрапляє тільки після `git push`."
            en: "`git commit` sends nothing anywhere. Fetch takes only what is already in the remote, and the commit gets there only after `git push`."
        - id: files-change
          text:
            uk: "Файли в `git-lab` одразу зміняться"
            en: "The files in `git-lab` change right away"
          why:
            uk: "Навіть коли fetch щось приносить, він не чіпає твоєї `main` і файлів — це робить окремий `git merge origin/main`."
            en: "Even when fetch brings something, it does not touch your `main` or files — a separate `git merge origin/main` does that."
      correct: [nothing]
    explanation:
      uk: "Commit — локальна дія. Ланцюжок завжди такий: commit у себе → push у remote → fetch у іншому клоні → merge у його гілку. Пропустиш крок — зміна до колеги не дійде."
      en: "A commit is a local action. The chain is always: commit locally → push to the remote → fetch in the other clone → merge into its branch. Skip a step and the change never reaches your teammate."

  - id: review-rationale
    kind: explanation
    title:
      uk: "Навіщо review і що писати"
      en: "Why review, and what to write"
    body:
      uk: |
        [[pull-request|Pull request]] — запит «влий мою гілку в `main`». Перш ніж його прийняти, хтось інший робить [[code-review|code review]]: читає diff і запускає перевірки.

        Головне в review — **правильність і намір**, а не смак. Відступи вирівнює formatter, дрібні пастки знаходить linter. Людина відповідає на питання, яких інструменти не поставлять: чи робить зміна те, що обіцяє опис? На якому вході вона ламається? Чи не загубилося чиєсь попереднє рішення?

        Корисний review складається з трьох частин:

        1. **Коментар про дефект із конкретним випадком:** «для входу X нова версія повертає Y замість Z». Такий коментар можна перевірити й перетворити на тест.
        2. **Питання про намір:** «яку проблему розв’язує ця зміна?» — можливо, автор знає те, чого не знаєш ти.
        3. **Рішення з причиною:** approve (схвалити) або request changes (попросити змін) — і одне речення чому.
      en: |
        A [[pull-request|pull request]] is a request: “merge my branch into `main`”. Before it is accepted, someone else does a [[code-review|code review]]: reads the diff and runs the checks.

        What matters in a review is **correctness and intent**, not taste. A formatter evens out the indentation, a linter finds small traps. A person answers the questions tools cannot ask: does the change do what its description promises? On which input does it break? Did someone’s earlier decision get lost?

        A useful review has three parts:

        1. **A defect comment with a concrete case:** “for input X the new version returns Y instead of Z”. Such a comment can be checked and turned into a test.
        2. **A question about intent:** “what problem does this change solve?” — perhaps the author knows something you do not.
        3. **A decision with a reason:** approve or request changes — and one sentence saying why.

  - id: recall-test-kind
    kind: review
    title:
      uk: "Згадай: який тест упіймає дефект"
      en: "Recall: which test catches a defect"
    items:
      - id: cheapest-test
        from: js-09-01-why-tests
        prompt:
          uk: "Функція `formatPrice(amountMinor)` повертає текст ціни, і для деяких сум текст неправильний. Який тест упіймає це найдешевше?"
          en: "The function `formatPrice(amountMinor)` returns a price text, and for some amounts the text is wrong. Which test catches this most cheaply?"
        answer:
          type: choice
          options:
            - id: unit
              text:
                uk: "Unit-тест: виклик `formatPrice` з кількома сумами й порівняння з очікуваним текстом"
                en: "A unit test: call `formatPrice` with a few amounts and compare with the expected text"
            - id: e2e
              text:
                uk: "End-to-end тест, що відкриває весь застосунок і читає ціну зі сторінки"
                en: "An end-to-end test that opens the whole app and reads the price from the page"
              why:
                uk: "Він теж упіймає, але повільніше й дорожче: для однієї чистої функції досить викликати її напряму."
                en: "It would catch it too, but slower and at a higher cost: for one pure function it is enough to call it directly."
            - id: manual
              text:
                uk: "Один раз клацнути застосунок і подивитися на ціни"
                en: "Click through the app once and look at the prices"
              why:
                uk: "Ручна перевірка покаже лише ті суми, що трапилися на екрані, і її не повториш автоматично після наступної зміни."
                en: "A manual check shows only the amounts that happened to be on screen, and it cannot be repeated automatically after the next change."
          correct: [unit]
        explanation:
          uk: "Для чистої функції найдешевший доказ — unit-тест з граничними сумами. У review ти робиш те саме вручну: шукаєш вхід, на якому стара й нова версії відповідають по-різному."
          en: "For a pure function the cheapest proof is a unit test with boundary amounts. In a review you do the same by hand: look for an input on which the old and the new versions answer differently."

  - id: review-format-price
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: review-format-price
    entry: index.js
    editable: [review.js]
    title:
      uk: "Review pull request для formatPrice"
      en: "Review a pull request for formatPrice"
    instructions:
      uk: |
        Колега відкрив pull request «Format prices without floating-point division». Ось diff:

        ```diff
         export function formatPrice(amountMinor) {
        -  return `${(amountMinor / 100).toFixed(2)} UAH`;
        +  const whole = Math.floor(amountMinor / 100);
        +  const cents = amountMinor % 100;
        +  return `${whole}.${cents} UAH`;
         }
        ```

        `before.js` — версія з `main`, `after.js` — версія з гілки, `index.js` друкує обидві для кількох сум (і для твоєї `failingInput`). Суми — у копійках.

        Заповни в `review.js` свій review:

        - `failingInput` — ціла сума, для якої нова версія дає **неправильний** текст;
        - `expected` — правильний текст для неї, наприклад `"1576.00 UAH"` для `157600`;
        - `defectComment` — що не так і для якого входу (назви суму або правильний текст);
        - `question` — питання про намір зміни, зі знаком `?` у кінці;
        - `decision` — `"approve"` або `"request-changes"`;
        - `reason` — чому саме таке рішення.

        Коментарі можна писати українською.
      en: |
        A teammate opened the pull request “Format prices without floating-point division”. Here is the diff:

        ```diff
         export function formatPrice(amountMinor) {
        -  return `${(amountMinor / 100).toFixed(2)} UAH`;
        +  const whole = Math.floor(amountMinor / 100);
        +  const cents = amountMinor % 100;
        +  return `${whole}.${cents} UAH`;
         }
        ```

        `before.js` is the version on `main`, `after.js` the version on the branch, and `index.js` prints both for a few amounts (and for your `failingInput`). Amounts are in kopiykas/cents.

        Fill in your review in `review.js`:

        - `failingInput` — a whole amount for which the new version gives a **wrong** text;
        - `expected` — the correct text for it, for example `"1576.00 UAH"` for `157600`;
        - `defectComment` — what is wrong and for which input (name the amount or the correct text);
        - `question` — a question about the intent of the change, ending with `?`;
        - `decision` — `"approve"` or `"request-changes"`;
        - `reason` — why you chose that decision.

        You may write the comments in English or Ukrainian.
    testTitles:
      "failingInput is a whole number of minor units":
        uk: "`failingInput` — ціле невід’ємне число копійок"
        en: "`failingInput` is a whole, non-negative number of minor units"
      "expected is the correct text for failingInput":
        uk: "`expected` — правильний текст ціни для `failingInput`"
        en: "`expected` is the correct price text for `failingInput`"
      "the new formatPrice really gives a wrong text for failingInput":
        uk: "Нова `formatPrice` справді дає неправильний текст для `failingInput`"
        en: "The new `formatPrice` really gives a wrong text for `failingInput`"
      "the defect comment names the failing case":
        uk: "`defectComment` називає `failingInput` або правильний текст `expected`"
        en: "`defectComment` names `failingInput` or the correct text `expected`"
      "the question is a real question":
        uk: "`question` має щонайменше 10 символів і закінчується на `?`"
        en: "`question` has at least 10 characters and ends with `?`"
      "the decision is request-changes":
        uk: "`decision` — `\"request-changes\"`"
        en: "`decision` is `\"request-changes\"`"
      "the reason explains the decision":
        uk: "`reason` має щонайменше 15 символів"
        en: "`reason` has at least 15 characters"
    hints:
      nudge:
        uk: "Запусти програму й порівняй стовпчики «before» і «after». Для сум у прикладі вони однакові — спробуй у `failingInput` інші суми. Які копійки можуть бути в ціні?"
        en: "Run the program and compare the “before” and “after” columns. For the amounts in the example they match — try other amounts in `failingInput`. What kopiykas can a price have?"
      explanation:
        uk: |
          `amountMinor % 100` дає копійки як **число**, а число не пам’ятає нулів попереду. Так само поводиться годинник, зібраний з чисел:

          ```js
          const hours = 9;
          const minutes = 7;
          console.log(`${hours}:${minutes}`);   // "9:7", not "9:07"
          ```

          Знайди суму, де копійок менше за десять, і порівняй, що друкують дві версії.
        en: |
          `amountMinor % 100` gives the kopiykas as a **number**, and a number does not remember leading zeros. A clock built from numbers behaves the same way:

          ```js
          const hours = 9;
          const minutes = 7;
          console.log(`${hours}:${minutes}`);   // "9:7", not "9:07"
          ```

          Find an amount with fewer than ten kopiykas and compare what the two versions print.
    solutionNote:
      uk: "Для будь-якої суми, де копійок від 0 до 9, нова версія втрачає нуль: `1205` → `\"12.5 UAH\"` замість `\"12.05 UAH\"`, а `1200` → `\"12.0 UAH\"`. Це дефект правильності, тож рішення — request changes, з конкретним входом у коментарі: автор відтворить його за секунду й, можливо, додасть тест. Питання про намір теж доречне: опис обіцяє уникнути проблем ділення, але не каже, яка сума їх показала."
      en: "For any amount whose kopiykas are 0 to 9, the new version loses the zero: `1205` → `\"12.5 UAH\"` instead of `\"12.05 UAH\"`, and `1200` → `\"12.0 UAH\"`. That is a correctness defect, so the decision is request changes, with a concrete input in the comment: the author reproduces it in a second and may add a test. A question about intent fits too: the description promises to avoid division problems but does not say which amount showed them."
    feedback:
      - when: { test: "the new formatPrice really gives a wrong text for failingInput" }
        message:
          uk: "Ця перевірка очікує суму, для якої `after.js` повертає не той текст, що правильний. Запусти програму: для твоєї `failingInput` стовпчики «before» і «after» мають різнитися. Якщо вони однакові, ця сума дефекту не показує."
          en: "This check expects an amount for which `after.js` returns something other than the correct text. Run the program: for your `failingInput` the “before” and “after” columns must differ. If they match, this amount does not show the defect."
      - when: { test: "expected is the correct text for failingInput" }
        message:
          uk: "Ця перевірка очікує в `expected` правильний текст для `failingInput`: гривні, крапка, рівно дві цифри копійок і ` UAH` — так, як друкує стовпчик «before»."
          en: "This check expects `expected` to hold the correct text for `failingInput`: the whole units, a dot, exactly two digits of kopiykas and ` UAH` — as the “before” column prints it."
      - when: { test: "the decision is request-changes" }
        message:
          uk: "Ця перевірка очікує `\"request-changes\"`. Зміна, що показує неправильні ціни, — дефект правильності, а не питання стилю: її не схвалюють, доки не виправлено."
          en: "This check expects `\"request-changes\"`. A change that shows wrong prices is a correctness defect, not a matter of style: it is not approved until fixed."
      - when: { error: SyntaxError }
        message:
          uk: "Програма не змогла запуститися, бо `review.js` уже не є правильним JavaScript. Перевір, що кожне поле записано як `назва: значення,`, а текст стоїть у лапках."
          en: "The program could not start because `review.js` is no longer valid JavaScript. Check that every field is written as `name: value,` and that text is in quotes."

  - id: remote-lab
    kind: local-task
    runtime: local-web
    title:
      uk: "Push і fetch через локальний remote"
      en: "Push and fetch through a local remote"
    intro:
      uk: |
        Ти створиш bare-репозиторій `remote-lab.git` поруч із `git-lab`, надішлеш у нього `main`, склонуєш його в другу теку «за колегу», зробиш там commit і push, а потім отримаєш цю зміну в `git-lab`. Інтернет і облікові записи не потрібні. Команди однакові на macOS, Linux і Windows PowerShell.
      en: |
        You will create a bare repository `remote-lab.git` next to `git-lab`, push `main` into it, clone it into a second folder “as a teammate”, make a commit and push there, and then receive that change in `git-lab`. No internet and no accounts needed. The commands are the same on macOS, Linux and Windows PowerShell.
    tools:
      - name: "Git"
        version: "2.28 or newer (checked with 2.51)"
      - name: "A code editor"
        version: "VS Code or any plain-text editor"
    steps:
      - text:
          uk: "Створи remote і підключи його до `git-lab` під назвою `origin`:"
          en: "Create the remote and connect it to `git-lab` under the name `origin`:"
        command: "cd ~/js-course\ngit init --bare -b main remote-lab.git\ncd git-lab\ngit remote add origin ../remote-lab.git\ngit remote -v"
        expect:
          uk: |
            ```text
            Initialized empty Git repository in /Users/you/js-course/remote-lab.git/
            origin	../remote-lab.git (fetch)
            origin	../remote-lab.git (push)
            ```
          en: |
            ```text
            Initialized empty Git repository in /Users/you/js-course/remote-lab.git/
            origin	../remote-lab.git (fetch)
            origin	../remote-lab.git (push)
            ```
      - text:
          uk: "Надішли `main`. `-u` запам’ятовує, що твоя `main` відповідає `origin/main`:"
          en: "Push `main`. `-u` remembers that your `main` corresponds to `origin/main`:"
        command: "git push -u origin main\ngit status"
        expect:
          uk: |
            ```text
            To ../remote-lab.git
             * [new branch]      main -> main
            branch 'main' set up to track 'origin/main'.
            On branch main
            Your branch is up to date with 'origin/main'.
            ```
          en: |
            ```text
            To ../remote-lab.git
             * [new branch]      main -> main
            branch 'main' set up to track 'origin/main'.
            On branch main
            Your branch is up to date with 'origin/main'.
            ```
      - text:
          uk: |
            Тепер будь «колегою». Склонуй remote у нову теку й підпиши commits цього клону іншим ім’ям — без `--global`, тож налаштування діє лише тут:
          en: |
            Now be the “teammate”. Clone the remote into a new folder and sign this clone’s commits with another name — without `--global`, so the setting applies only here:
        command: "cd ~/js-course\ngit clone remote-lab.git teammate-lab\ncd teammate-lab\ngit config user.name \"Teammate\"\ngit config user.email \"teammate@example.com\"\ngit log --oneline -1"
        expect:
          uk: "`Cloning into 'teammate-lab'...` і `done.`, потім останній commit — той самий, що й у `git-lab`: `9f8df5f (HEAD -> main, origin/main, origin/HEAD) Merge branch 'feature/paused-mark'`."
          en: "`Cloning into 'teammate-lab'...` and `done.`, then the latest commit — the same as in `git-lab`: `9f8df5f (HEAD -> main, origin/main, origin/HEAD) Merge branch 'feature/paused-mark'`."
      - text:
          uk: "У `teammate-lab` допиши в `README.md` рядок `Ask before changing the label format.` і закоміть. **Перед push** передбач, чи побачить цей commit `git-lab`."
          en: "In `teammate-lab` add the line `Ask before changing the label format.` to `README.md` and commit. **Before pushing**, predict whether `git-lab` can see this commit."
        command: "git add README.md\ngit commit -m \"Ask before changing the label format\"\ngit status"
        expect:
          uk: "`Your branch is ahead of 'origin/main' by 1 commit.` — commit поки лише тут."
          en: "`Your branch is ahead of 'origin/main' by 1 commit.` — the commit is only here so far."
      - text:
          uk: "Надішли його:"
          en: "Push it:"
        command: "git push"
        expect:
          uk: "`To …/remote-lab.git` і рядок на кшталт `9f8df5f..71902ea  main -> main`."
          en: "`To …/remote-lab.git` and a line such as `9f8df5f..71902ea  main -> main`."
      - text:
          uk: "Повернись у `git-lab`, отримай нове й порівняй стан **до** і **після** merge:"
          en: "Go back to `git-lab`, fetch what is new and compare the state **before** and **after** the merge:"
        command: "cd ~/js-course/git-lab\ngit fetch\ngit status\ngit log --oneline --all -2\ngit merge origin/main\ngit log --oneline -1"
        expect:
          uk: |
            ```text
            From ../remote-lab
               9f8df5f..71902ea  main       -> origin/main
            On branch main
            Your branch is behind 'origin/main' by 1 commit, and can be fast-forwarded.
            71902ea (origin/main) Ask before changing the label format
            9f8df5f (HEAD -> main) Merge branch 'feature/paused-mark'
            Updating 9f8df5f..71902ea
            Fast-forward
            71902ea (HEAD -> main, origin/main) Ask before changing the label format
            ```

            Після fetch commit колеги є в `origin/main`, але не в твоїй `main`; після merge — і там. Нові версії Git можуть ще показувати `origin/HEAD` поруч з `origin/main`.
          en: |
            ```text
            From ../remote-lab
               9f8df5f..71902ea  main       -> origin/main
            On branch main
            Your branch is behind 'origin/main' by 1 commit, and can be fast-forwarded.
            71902ea (origin/main) Ask before changing the label format
            9f8df5f (HEAD -> main) Merge branch 'feature/paused-mark'
            Updating 9f8df5f..71902ea
            Fast-forward
            71902ea (HEAD -> main, origin/main) Ask before changing the label format
            ```

            After the fetch the teammate’s commit is in `origin/main` but not in your `main`; after the merge it is there too. Newer Git versions may also show `origin/HEAD` next to `origin/main`.
    verify:
      - id: pushed
        text:
          uk: "`git push -u origin main` створив `main` у `remote-lab.git`."
          en: "`git push -u origin main` created `main` in `remote-lab.git`."
      - id: ahead-before-push
        text:
          uk: "До push `teammate-lab` був `ahead of 'origin/main' by 1 commit`."
          en: "Before the push `teammate-lab` was `ahead of 'origin/main' by 1 commit`."
      - id: fetched-then-merged
        text:
          uk: "Після `git fetch` у `git-lab` статус був `behind … by 1 commit`, а після `git merge origin/main` рядок колеги з’явився в моєму `README.md`."
          en: "After `git fetch` in `git-lab` the status was `behind … by 1 commit`, and after `git merge origin/main` the teammate’s line appeared in my `README.md`."
    troubleshooting:
      - problem:
          uk: "`error: remote origin already exists.`"
          en: "`error: remote origin already exists.`"
        fix:
          uk: "`origin` у `git-lab` уже додано (наприклад, у попередній спробі). `git remote -v` покаже адресу; якщо вона правильна, просто продовжуй з наступного кроку."
          en: "`origin` was already added in `git-lab` (for example in an earlier attempt). `git remote -v` shows the address; if it is right, just continue with the next step."
      - problem:
          uk: "`fatal: '../remote-lab.git' does not appear to be a git repository`"
          en: "`fatal: '../remote-lab.git' does not appear to be a git repository`"
        fix:
          uk: "Шлях відносний — від теки, де ти запускаєш команду. `remote-lab.git` має лежати в `~/js-course`, поруч із `git-lab`. Перевір `ls ~/js-course`."
          en: "The path is relative — from the folder you run the command in. `remote-lab.git` must be in `~/js-course`, next to `git-lab`. Check `ls ~/js-course`."
      - problem:
          uk: "`! [rejected] main -> main (fetch first)`"
          en: "`! [rejected] main -> main (fetch first)`"
        fix:
          uk: "У remote є commits, яких немає в тебе: Git не дає їх перезаписати. Спершу `git fetch` і `git merge origin/main`, потім знову `git push`. Ніколи не «лагодь» це прапорцем `--force`: він знищить чужі commits у remote."
          en: "The remote has commits you do not: Git does not let you overwrite them. First `git fetch` and `git merge origin/main`, then `git push` again. Never “fix” this with `--force`: it destroys other people’s commits in the remote."
    recovery:
      uk: "Усі три репозиторії навчальні. Якщо щось пішло не так у `teammate-lab`, його можна видалити (перевір назву!) і склонувати знову з `remote-lab.git` — історія лишиться в remote."
      en: "All three repositories are for practice. If something went wrong in `teammate-lab`, you can delete it (check the name!) and clone it again from `remote-lab.git` — the history stays in the remote."

  - id: to-project
    kind: transfer
    capstoneStep: JS-15
    body:
      uk: "Твій проєкт поки житиме в локальному репозиторії. Коли захочеш поділитися ним, remote на сервері працюватиме за тими самими командами — а кожну свою зміну ти зможеш переглянути так, ніби це чужий pull request."
      en: "For now your project will live in a local repository. When you want to share it, a remote on a server works with the same commands — and you can review each of your own changes as if it were someone else’s pull request."
