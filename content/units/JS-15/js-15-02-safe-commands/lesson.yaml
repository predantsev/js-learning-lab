id: js-15-02-safe-commands
unit: JS-15
title:
  uk: "Безпечні команди і що ніколи не вставляти в термінал"
  en: "Safe commands and what never to paste"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Перед запуском віднести команду до однієї з груп — лише читає, змінює файли або ніколи не запускати зі вставленого тексту — і перевірити, у якій теці вона подіє."
    en: "Classify a command line as read-only, file-changing or never-run-from-a-paste before executing it, and check which folder it will act in."
  - uk: "Пояснити, чому команди, що друкують секрети, передають завантажене просто в shell або просять sudo, — це знаки «стоп», і що робити натомість."
    en: "Explain why commands that print secrets, pipe a download into a shell or ask for sudo are stop signs, and what to do instead."
prerequisites: [js-15-01-terminal-files-paths, js-01-05-reading-an-error]
subskills:
  - { family: P-01, skill: "safe commands", depth: intro }
glossary: [destructive-command, secret]
selfCheck: [classify-lines, pipe-to-shell, where-it-acts]

blocks:
  - id: three-kinds
    kind: explanation
    title:
      uk: "Три види команд"
      en: "Three kinds of commands"
    body:
      uk: |
        Термінал не перепитує й не має кнопки «Скасувати». Тому перед Enter відносиш команду до однієї з трьох груп:

        | Група | Приклади | Що робити |
        |---|---|---|
        | **Лише читає** | `pwd`, `ls`, `cat notes.txt` | запускай спокійно |
        | **Змінює файли** | `mkdir`, `cp`, `mv`, `rm`, `>` у файл | спершу перевір, де ти і що зміниться |
        | **Ніколи зі вставленого тексту** | `rm -rf ~`, `curl … \| sh`, `sudo …`, `cat .env` | зупинись і розберися |

        Команди другої групи бувають [[destructive-command|руйнівними]]: `rm` не кладе файл у кошик, а видаляє одразу; `mv` і `>` мовчки замінюють наявний файл.

        Третя група небезпечна з різних причин:

        - `rm -rf ~` видаляє всю домашню теку без жодного питання.
        - `curl адреса | sh` завантажує чужий текст і **одразу** виконує його як команди — ти його навіть не бачиш.
        - `sudo` запускає команду з правами адміністратора: вона може змінити будь-що в системі.
        - `cat .env` друкує файл, де зазвичай лежать [[secret|секрети]] — паролі й токени. Їх видно кожному, хто бачить твій екран чи скопійований вивід.
      en: |
        A terminal does not ask twice and has no “Undo” button. So before Enter you put the command into one of three groups:

        | Group | Examples | What to do |
        |---|---|---|
        | **Read-only** | `pwd`, `ls`, `cat notes.txt` | run it calmly |
        | **Changes files** | `mkdir`, `cp`, `mv`, `rm`, `>` into a file | first check where you are and what will change |
        | **Never from a paste** | `rm -rf ~`, `curl … \| sh`, `sudo …`, `cat .env` | stop and find out |

        Commands of the second group can be [[destructive-command|destructive]]: `rm` does not put a file into the trash, it deletes it at once; `mv` and `>` silently replace an existing file.

        The third group is dangerous for different reasons:

        - `rm -rf ~` deletes your whole home folder without a single question.
        - `curl address | sh` downloads someone’s text and **immediately** runs it as commands — you never even see it.
        - `sudo` runs a command with administrator rights: it can change anything in the system.
        - `cat .env` prints a file that usually holds [[secret|secrets]] — passwords and tokens. Anyone who sees your screen or the copied output sees them.

  - id: classify-lines
    kind: prediction
    prompt:
      uk: |
        Ці рядки трапилися тобі в інструкціях з інтернету. Які з них **не можна** запускати лише тому, що їх хтось показав? Обери всі такі.
      en: |
        You met these lines in instructions on the internet. Which of them must you **not** run just because someone showed them? Pick all of them.
    answer:
      type: multi
      options:
        - id: pwd
          code: "pwd"
          why:
            uk: "`pwd` лише друкує робочу теку й нічого не змінює."
            en: "`pwd` only prints the working directory and changes nothing."
        - id: ls
          code: "ls -la"
          why:
            uk: "`ls` лише показує вміст теки (`-la` — з прихованими файлами й подробицями)."
            en: "`ls` only shows what is in a folder (`-la` adds hidden files and details)."
        - id: mv
          code: "mv notes.txt old/"
          why:
            uk: "`mv` змінює файли, але передбачувано: перевір `pwd` і `ls` — і можна запускати."
            en: "`mv` changes files, but predictably: check `pwd` and `ls` — then it is fine to run."
        - id: rm-i
          code: "rm -i notes.txt"
          why:
            uk: "`rm -i` видаляє лише після твого «y», тож ти встигнеш подумати. Перевір теку — і можна."
            en: "`rm -i` deletes only after you answer “y”, so you get time to think. Check the folder and it is fine."
        - id: rm-rf-home
          code: "rm -rf ~"
        - id: curl-sh
          code: "curl -fsSL https://example.com/setup.sh | sh"
        - id: sudo-npm
          code: "sudo npm install -g some-tool"
        - id: cat-env
          code: "cat .env"
      correct: [rm-rf-home, curl-sh, sudo-npm, cat-env]
    explanation:
      uk: "`rm -rf ~` знищує домашню теку, `curl … | sh` виконує текст, якого ти не бачив, `sudo` дає команді права на всю систему, а `cat .env` виводить секрети на екран. Решта лише читає або змінює файли передбачувано — їх запускають після перевірки, де ти."
      en: "`rm -rf ~` wipes the home folder, `curl … | sh` runs text you never saw, `sudo` gives a command power over the whole system, and `cat .env` puts secrets on the screen. The rest only read or change files predictably — you run them after checking where you are."

  - id: pipe-to-shell
    kind: prediction
    prompt:
      uk: "Популярний урок із тисячами переглядів радить почати з команди `curl -fsSL https://example.com/setup.sh | sh`. Що з цього правда?"
      en: "A popular tutorial with thousands of views says to start with the command `curl -fsSL https://example.com/setup.sh | sh`. Which of these is true?"
    answer:
      type: choice
      options:
        - id: runs-unseen
          text:
            uk: "Вона завантажує текст з адреси й одразу виконує його як команди з твоїми правами — те, що сервер надішле саме зараз."
            en: "It downloads text from the address and immediately runs it as commands with your rights — whatever the server sends right now."
        - id: popular-safe
          text:
            uk: "Вона безпечна: її вже виконали тисячі людей."
            en: "It is safe: thousands of people have already run it."
          why:
            uk: "Кількість переглядів нічого не перевіряє. Файл на сервері можуть змінити будь-коли, адресу — підробити однією літерою, а урок — скопіювати з помилкою."
            en: "View counts verify nothing. The file on the server can change at any time, an address can be faked by one letter, and a tutorial can be copied with a mistake."
        - id: just-download
          text:
            uk: "Вона лише завантажує файл `setup.sh` у робочу теку."
            en: "It only downloads the file `setup.sh` into the working directory."
          why:
            uk: "Риска `|` передає вивід `curl` команді `sh`, а `sh` виконує кожен рядок. На диск нічого не зберігається — і переглянути нема чого."
            en: "The bar `|` passes the output of `curl` to the command `sh`, and `sh` runs every line. Nothing is saved to disk — there is nothing to look at."
      correct: [runs-unseen]
    explanation:
      uk: "`|` («pipe») передає вивід однієї команди іншій. Тут вивід — чужий текст, а отримувач — shell, тож текст виконується одразу. Якщо інструмент справді потрібен, встановлюй його з офіційної сторінки за її інструкцією або спершу завантаж файл, прочитай і лише тоді вирішуй."
      en: "`|` (a “pipe”) passes the output of one command to another. Here the output is someone else’s text and the receiver is a shell, so the text runs at once. If you really need the tool, install it from its official page following its instructions, or first download the file, read it and only then decide."

  - id: recall-error
    kind: review
    title:
      uk: "Згадай: що каже повідомлення про помилку"
      en: "Recall: what an error message tells you"
    items:
      - id: permission-denied
        from: js-01-05-reading-an-error
        prompt:
          uk: |
            Команда `npm install -g some-tool` завершилася так:

            ```text
            npm error code EACCES
            npm error syscall mkdir
            npm error path /usr/local/lib/node_modules/some-tool
            npm error Error: EACCES: permission denied, mkdir '/usr/local/lib/node_modules/some-tool'
            ```

            На форумі пишуть: «Просто додай sudo». Що робиш першим?
          en: |
            The command `npm install -g some-tool` ended like this:

            ```text
            npm error code EACCES
            npm error syscall mkdir
            npm error path /usr/local/lib/node_modules/some-tool
            npm error Error: EACCES: permission denied, mkdir '/usr/local/lib/node_modules/some-tool'
            ```

            A forum says: “Just add sudo.” What do you do first?
        answer:
          type: choice
          options:
            - id: read-it
              text:
                uk: "Читаю, **що** і **де**: npm не може створити теку в системному місці. Питаю себе, чи треба взагалі ставити туди, — у проєкті пакет ставлять локально, без `-g`."
                en: "I read **what** and **where**: npm cannot create a folder in a system location. I ask myself whether I need to install there at all — in a project a package is installed locally, without `-g`."
            - id: add-sudo
              text:
                uk: "Додаю `sudo` — тоді прав вистачить."
                en: "I add `sudo` — then the rights will be enough."
              why:
                uk: "`sudo` прибирає симптом, а не причину: встановлення запустить код пакета з правами адміністратора, і наступні команди npm знову впиратимуться в теки, що тепер належать адміністратору."
                en: "`sudo` removes the symptom, not the cause: the install runs package code with administrator rights, and later npm commands hit the folders now owned by the administrator."
            - id: reinstall
              text:
                uk: "Перевстановлюю Node.js — мабуть, він зламаний."
                en: "I reinstall Node.js — it must be broken."
              why:
                uk: "Повідомлення каже не про зламаний Node.js, а про відсутність права писати в конкретну теку. Спершу читають, що й де."
                en: "The message is not about a broken Node.js but about no permission to write into one specific folder. First read what and where."
          correct: [read-it]
        explanation:
          uk: "Як і з помилкою в коді: назва (`EACCES: permission denied`) каже, що сталося, а шлях — де. «Permission denied» — це відповідь «тобі сюди не можна», а не пропозиція отримати більше прав. У наступних уроках пакети ставляться всередину теки проєкту, і жоден `sudo` не потрібен."
          en: "Just like an error in code: the name (`EACCES: permission denied`) says what happened, and the path says where. “Permission denied” means “you are not allowed here”, not an invitation to get more rights. In the next lessons packages go inside the project folder, and no `sudo` is ever needed."

  - id: preflight
    kind: explanation
    title:
      uk: "Чотири питання перед Enter"
      en: "Four questions before Enter"
    body:
      uk: |
        Перед кожною командою, що змінює файли, або будь-якою незнайомою командою дай собі чотири відповіді:

        1. **Де я?** `pwd` — і чи тут ця команда має діяти.
        2. **Що зміниться?** Які файли команда створить, перезапише чи видалить. Відносний шлях рахується від робочої теки.
        3. **Чи можна це скасувати?** Якщо ні — зроби копію або обери обережнішу форму (`rm -i`, `mv -i` перепитують).
        4. **Чи покаже або надішле вона секрет?** Якщо так — не запускай при свідках і не вставляй вивід у чат.

        Друге питання найчастіше підводить: `rm old/a.txt` з теки `scratch` і з теки `js-course` видаляє різні файли. Наступна вправа — програма, що відповідає саме на нього.
      en: |
        Before every command that changes files, and before any unfamiliar command, give yourself four answers:

        1. **Where am I?** `pwd` — and is this where the command should act?
        2. **What will change?** Which files the command will create, overwrite or delete. A relative path is counted from the working directory.
        3. **Can I undo it?** If not, make a copy or pick a more careful form (`rm -i` and `mv -i` ask first).
        4. **Will it show or send a secret?** If so, do not run it with others watching and do not paste its output into a chat.

        The second question is the one that most often lets you down: `rm old/a.txt` deletes different files from the folder `scratch` and from the folder `js-course`. The next exercise is a program that answers exactly that question.

  - id: where-it-acts
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: where-it-acts
    entry: index.js
    title:
      uk: "Де подіє команда"
      en: "Where the command will act"
    instructions:
      uk: |
        Допиши функцію `whereItActs(cwd, target)`. `cwd` — робоча тека, `target` — шлях, написаний у команді. Функція повертає **абсолютний** шлях, на який подіє команда. Шляхи пишуться зі скісною рискою `/`, як на macOS і Linux.

        Правила:

        - звичайна назва (`notes.txt`, `old`) — крок униз від поточної теки;
        - `..` — крок на теку вище, а з кореня `/` вище піти не можна;
        - `.` і порожні частини (подвійна `//`) нічого не змінюють;
        - `target`, що починається з `/`, рахується від кореня, а не від `cwd`.

        Наприклад, `whereItActs("/home/you/js-course/scratch/old", "../notes.txt")` повертає `"/home/you/js-course/scratch/notes.txt"`. Тека `"/"` — корінь; результат для нього — `"/"`.
      en: |
        Finish the function `whereItActs(cwd, target)`. `cwd` is the working directory, `target` is the path written in the command. The function returns the **absolute** path the command will act on. Paths use the forward slash `/`, as on macOS and Linux.

        Rules:

        - a plain name (`notes.txt`, `old`) is a step down from the current folder;
        - `..` is a step up one folder, and you cannot go above the root `/`;
        - `.` and empty parts (a double `//`) change nothing;
        - a `target` that starts with `/` is counted from the root, not from `cwd`.

        For example, `whereItActs("/home/you/js-course/scratch/old", "../notes.txt")` returns `"/home/you/js-course/scratch/notes.txt"`. The folder `"/"` is the root; the result for it is `"/"`.
    testTitles:
      "a plain name lands inside the working directory":
        uk: "Звичайна назва веде всередину робочої теки"
        en: "A plain name lands inside the working directory"
      "one .. goes up exactly one folder":
        uk: "Один `..` піднімає рівно на одну теку"
        en: "One `..` goes up exactly one folder"
      "several .. go up several folders":
        uk: "Кілька `..` піднімають на кілька тек, і `..` можна змішувати з назвами"
        en: "Several `..` go up several folders, and `..` can be mixed with names"
      ". and ./ mean the working directory itself":
        uk: "`.` і `./` означають саму робочу теку"
        en: "`.` and `./` mean the working directory itself"
      "an absolute target ignores the working directory":
        uk: "Абсолютний `target` не залежить від робочої теки"
        en: "An absolute `target` ignores the working directory"
      ".. at the root stays at the root":
        uk: "`..` у корені `/` залишає в корені"
        en: "`..` at the root `/` stays at the root"
    hints:
      nudge:
        uk: "Не працюй із шляхом як з одним текстом у лапках. Розбий його на назви тек і йди по них по одній, як по сходинках."
        en: "Do not treat a path as one piece of text. Split it into folder names and walk through them one at a time, like steps."
      explanation:
        uk: |
          Тримай масив назв тек, у яких ти зараз стоїш, і змінюй його на кожному кроці: назва — додати в кінець, `..` — прибрати останню, `.` і порожнє — пропустити. У кінці склей масив назад.

          Так само можна рахувати поверхи в будинку:

          ```js
          const floors = ["lobby", "first", "second"];
          floors.pop();             // ["lobby", "first"]
          floors.push("roof");      // ["lobby", "first", "roof"]
          console.log("a-b-c".split("-"));   // ["a", "b", "c"]
          ```

          Подумай, з якого масиву починати, коли `target` починається з `/`. І зауваж: `"/home".split("/")` дає `["", "home"]` — порожні назви треба пропускати.
        en: |
          Keep an array of the folder names you are standing in and change it at every step: a name — push it to the end, `..` — remove the last one, `.` and empty — skip. At the end, join the array back together.

          It works like counting floors in a building:

          ```js
          const floors = ["lobby", "first", "second"];
          floors.pop();             // ["lobby", "first"]
          floors.push("roof");      // ["lobby", "first", "roof"]
          console.log("a-b-c".split("-"));   // ["a", "b", "c"]
          ```

          Think about which array to start from when `target` starts with `/`. And note: `"/home".split("/")` gives `["", "home"]` — empty names must be skipped.
    solutionNote:
      uk: "Розв’язок тримає список тек і проходить `target` по частинах: назва додається, `..` знімає останню теку (у корені знімати нічого, і `pop` на порожньому масиві нічого не робить), `.` і порожні частини пропускаються. Абсолютний `target` починає з порожнього списку. Shell на macOS і Linux рахує шлях так само — тому перед `rm` чи `mv` корисно подумки зробити те саме."
      en: "The solution keeps a list of folders and walks through `target` part by part: a name is added, `..` removes the last folder (at the root there is nothing to remove, and `pop` on an empty array does nothing), `.` and empty parts are skipped. An absolute `target` starts from an empty list. The shell on macOS and Linux resolves a path the same way — so before `rm` or `mv` it pays to do the same in your head."
    feedback:
      - when: { test: "a plain name lands inside the working directory" }
        message:
          uk: "Ця перевірка очікує `whereItActs(\"/home/you/course\", \"notes.txt\")` → `\"/home/you/course/notes.txt\"`: рівно одна `/` на початку й між назвами. Якщо результат починається з `//`, порожня частина перед першою `/` у `cwd` потрапила в список як назва теки — її треба пропустити."
          en: "This check expects `whereItActs(\"/home/you/course\", \"notes.txt\")` → `\"/home/you/course/notes.txt\"`: exactly one `/` at the start and between names. If the result starts with `//`, the empty part in front of the first `/` of `cwd` got into the list as a folder name — it must be skipped."
      - when: { test: "an absolute target ignores the working directory" }
        message:
          uk: "Ця перевірка очікує, що `target`, який починається з `/`, рахується від кореня: `whereItActs(\"/home/you/course\", \"/tmp/a.txt\")` → `\"/tmp/a.txt\"`, і `cwd` тут не використовується зовсім."
          en: "This check expects a `target` that starts with `/` to be counted from the root: `whereItActs(\"/home/you/course\", \"/tmp/a.txt\")` → `\"/tmp/a.txt\"`, and `cwd` is not used at all."
      - when: { test: "one .. goes up exactly one folder" }
        message:
          uk: "Ця перевірка очікує, що `..` прибирає з шляху останню теку, а не потрапляє в результат як назва. Якщо в результаті видно `/..`, частини шляху ще склеюються як текст."
          en: "This check expects `..` to remove the last folder from the path, not to appear in the result as a name. If you see `/..` in the result, the parts are still being glued together as text."
      - when: { test: ".. at the root stays at the root" }
        message:
          uk: "Ця перевірка очікує, що з кореня вище піти не можна: `whereItActs(\"/home\", \"../../..\")` → `\"/\"`. Якщо результат — порожній текст `\"\"`, додай `/` на початок навіть тоді, коли тек не лишилося."
          en: "This check expects that you cannot go above the root: `whereItActs(\"/home\", \"../../..\")` → `\"/\"`. If the result is the empty text `\"\"`, add `/` at the start even when no folders are left."
      - when: { error: TypeError }
        message:
          uk: "Перевірки викликають `whereItActs` і працюють із тим, що вона повертає. Якщо повідомлення каже `… is not a function`, функції з такою назвою немає (або програма впала ще до перевірок). Якщо `Cannot read properties of undefined`, функція, найімовірніше, нічого не повертає — потрібен `return`."
          en: "The checks call `whereItActs` and work with what it returns. If the message says `… is not a function`, there is no function with that name (or the program crashed before the checks). If it says `Cannot read properties of undefined`, the function most likely returns nothing — it needs a `return`."

  - id: practise-stop-signs
    kind: local-task
    runtime: local-web
    title:
      uk: "Обережні форми команд і власний SAFETY.md"
      en: "Careful forms of commands and your own SAFETY.md"
    intro:
      uk: |
        Працюєш у навчальній теці `~/js-course/scratch` з попереднього уроку. Ти побачиш, як `rm -i` і `mv -i` перепитують, перш ніж щось знищити, і запишеш свої чотири питання у файл.

        На **Windows PowerShell** `-i` не працює: замість `rm -i` пиши `Remove-Item файл -Confirm`, а `mv` (`Move-Item`) і без прапорця відмовляється писати поверх наявного файла. Ці варіанти вказано біля кроків.

        Приклад початку `SAFETY.md` для кроку 5 (свій файл пиши власними словами):

        ```markdown
        # Before Enter
        1. Where am I?
        2. What will change?
        3. Can I undo it?
        4. Will it show or send a secret?

        ## mv notes.txt old/
        1. ~/js-course/scratch (checked with pwd)
        2. …
        ```
      en: |
        You work in the scratch folder `~/js-course/scratch` from the previous lesson. You will see how `rm -i` and `mv -i` ask before destroying anything, and write your four questions into a file.

        In **Windows PowerShell** `-i` does not work: instead of `rm -i` write `Remove-Item file -Confirm`, and `mv` (`Move-Item`) refuses to write over an existing file even without a flag. These variants are given next to the steps.

        An example of how `SAFETY.md` for step 5 may start (write your own file in your own words):

        ```markdown
        # Before Enter
        1. Where am I?
        2. What will change?
        3. Can I undo it?
        4. Will it show or send a secret?

        ## mv notes.txt old/
        1. ~/js-course/scratch (checked with pwd)
        2. …
        ```
    tools:
      - name: "A terminal"
        version: "zsh or bash (macOS, Linux) or PowerShell (Windows)"
      - name: "A code editor"
        version: "VS Code or any plain-text editor"
        note:
          uk: "VS Code безкоштовний і не потребує облікового запису; з JS-10 ти працюватимеш у ньому постійно. Текстові процесори (Word, TextEdit у режимі RTF) не підходять."
          en: "VS Code is free and needs no account; from JS-10 on you will work in it all the time. Word processors (Word, TextEdit in RTF mode) do not fit."
    steps:
      - text:
          uk: "Перейди в навчальну теку й переконайся, що ти там:"
          en: "Go to the scratch folder and make sure you are there:"
        command: "cd ~/js-course/scratch\npwd"
        expect:
          uk: "Шлях закінчується на `js-course/scratch` (на Windows — `js-course\\scratch`)."
          en: "The path ends with `js-course/scratch` (on Windows `js-course\\scratch`)."
      - text:
          uk: |
            Створи чернетку й попроси видалити її з підтвердженням. На питання відповідай `n` і Enter. На Windows: `Remove-Item draft.txt -Confirm`, відповідь `N`.
          en: |
            Create a draft and ask to delete it with confirmation. Answer the question with `n` and Enter. On Windows: `Remove-Item draft.txt -Confirm`, answer `N`.
        command: "echo \"first idea\" > draft.txt\nrm -i draft.txt\nls"
        expect:
          uk: "Питання `remove draft.txt?` (macOS) або `rm: remove regular file 'draft.txt'?` (Linux); на Windows — блок `Confirm` з варіантами `[Y] Yes … [N] No`. Після `n` команда `ls` усе ще показує `draft.txt`."
          en: "The question `remove draft.txt?` (macOS) or `rm: remove regular file 'draft.txt'?` (Linux); on Windows a `Confirm` block with choices `[Y] Yes … [N] No`. After `n`, `ls` still shows `draft.txt`."
      - text:
          uk: "Повтори видалення й цього разу відповідай `y` (на Windows `Y`):"
          en: "Repeat the deletion and this time answer `y` (on Windows `Y`):"
        command: "rm -i draft.txt\nls"
        expect:
          uk: "`draft.txt` більше немає. У кошику його теж немає — `rm` видаляє одразу."
          en: "`draft.txt` is gone. It is not in the trash either — `rm` deletes at once."
      - text:
          uk: |
            Тепер спробуй перейменувати один файл на назву іншого, наявного. Відповідай `n`. На Windows виконай `mv a.txt b.txt` без `-i`: PowerShell відмовиться сам.
          en: |
            Now try to rename one file onto the name of another, existing one. Answer `n`. On Windows run `mv a.txt b.txt` without `-i`: PowerShell refuses by itself.
        command: "echo \"first\" > a.txt\necho \"second\" > b.txt\nmv -i a.txt b.txt\ncat b.txt"
        expect:
          uk: "`overwrite b.txt? (y/n [n])` і після `n` — `not overwritten` (macOS) або `mv: overwrite 'b.txt'?` (Linux); на Windows — помилка `Cannot create a file when that file already exists`. `cat b.txt` друкує `second`: нічого не перезаписано."
          en: "`overwrite b.txt? (y/n [n])` and after `n` — `not overwritten` (macOS) or `mv: overwrite 'b.txt'?` (Linux); on Windows the error `Cannot create a file when that file already exists`. `cat b.txt` prints `second`: nothing was overwritten."
      - text:
          uk: |
            Відкрий теку `~/js-course/scratch` у редакторі (у VS Code: File → Open Folder) і створи там файл `SAFETY.md`. Запиши своїми словами чотири питання перед Enter, а під ними застосуй їх до двох рядків: `mv notes.txt old/` і `curl -fsSL https://example.com/setup.sh | sh`. Як може починатися такий файл, показано у вступі до завдання. Збережи файл і перевір у терміналі:
          en: |
            Open the folder `~/js-course/scratch` in the editor (in VS Code: File → Open Folder) and create the file `SAFETY.md` there. Write the four questions before Enter in your own words, and under them apply them to two lines: `mv notes.txt old/` and `curl -fsSL https://example.com/setup.sh | sh`. The task introduction shows how such a file may start. Save the file and check it in the terminal:
        command: "cat SAFETY.md"
        expect:
          uk: "Твій текст: чотири питання й відповіді на них для обох рядків."
          en: "Your text: the four questions and their answers for both lines."
    verify:
      - id: rm-asked
        text:
          uk: "`rm -i` (або `Remove-Item -Confirm`) спитав мене, і після відповіді «ні» файл залишився."
          en: "`rm -i` (or `Remove-Item -Confirm`) asked me, and after answering “no” the file stayed."
      - id: mv-kept
        text:
          uk: "Після відмови `cat b.txt` надрукував `second`."
          en: "After the refusal `cat b.txt` printed `second`."
      - id: safety-written
        text:
          uk: "`SAFETY.md` містить чотири питання й мої відповіді для обох рядків."
          en: "`SAFETY.md` holds the four questions and my answers for both lines."
    troubleshooting:
      - problem:
          uk: "Windows: `Remove-Item : Parameter cannot be processed because the parameter name 'i' is ambiguous`"
          en: "Windows: `Remove-Item : Parameter cannot be processed because the parameter name 'i' is ambiguous`"
        fix:
          uk: "У PowerShell `rm` — це `Remove-Item`, і `-i` він не розуміє. Пиши `Remove-Item draft.txt -Confirm`."
          en: "In PowerShell `rm` is `Remove-Item`, and it does not understand `-i`. Write `Remove-Item draft.txt -Confirm`."
      - problem:
          uk: "`rm -i` нічого не спитав і одразу видалив файл"
          en: "`rm -i` asked nothing and deleted the file at once"
        fix:
          uk: "Перевір, що `-i` стоїть перед назвою файла і що ти не набрав `-f` (воно скасовує питання). Чернетку можна створити заново тією ж командою `echo`."
          en: "Check that `-i` comes before the file name and that you did not type `-f` (it cancels the question). Recreate the draft with the same `echo` command."
      - problem:
          uk: "`cat SAFETY.md` — `No such file or directory`"
          en: "`cat SAFETY.md` — `No such file or directory`"
        fix:
          uk: "Файл збережено в іншій теці або з іншою назвою (наприклад, `SAFETY.md.txt` у Блокноті Windows). Виконай `ls` у `scratch` і подивись, як він насправді називається; у редакторі обирай «All files», а не «Text documents»."
          en: "The file was saved in another folder or under another name (for example `SAFETY.md.txt` in Windows Notepad). Run `ls` in `scratch` and see what it is really called; in the editor pick “All files”, not “Text documents”."
    recovery:
      uk: "Тут видаляються лише чернетки, які ти щойно створив. Якщо випадково видалив `notes.txt`, створи його знову: `echo \"buy milk\" > notes.txt`. Якщо тебе питають «перезаписати?» і ти не впевнений — відповідай `n`: відмова нічого не змінює."
      en: "Only the drafts you just created get deleted here. If you deleted `notes.txt` by accident, create it again: `echo \"buy milk\" > notes.txt`. If you are asked “overwrite?” and are not sure — answer `n`: refusing changes nothing."

  - id: to-project
    kind: transfer
    capstoneStep: JS-15
    body:
      uk: "Коли наприкінці розділу створюватимеш теку свого проєкту, кожну команду, що змінює файли, проганяй через свої чотири питання з `SAFETY.md`: так ти напевно створиш теку там, де задумав."
      en: "When you create your project folder at the end of the unit, run every command that changes files through your four questions from `SAFETY.md`: that way the folder surely ends up where you meant."
