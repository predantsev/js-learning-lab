id: js-15-03-node-and-package-manifest
unit: JS-15
title:
  uk: "Node і scripts у package.json"
  en: "Node and package.json scripts"
kind: local-task
minutes: 15
contentVersion: 1
purpose:
  uk: "Щоб працювати з проєктом поза платформою, треба вміти запустити JavaScript у терміналі й дати проєктові короткі команди, однакові для всіх, хто з ним працює. Ти зробиш це на маленькому проєкті з витратами; результат підтверджуєш сам."
  en: "To work with a project outside the platform you need to run JavaScript in a terminal and give the project short commands that are the same for everyone who works on it. You will do this on a small expenses project; you confirm the result yourself."
objectives:
  - uk: "Перевірити встановлену версію Node.js відносно заявленої для курсу і запустити файл `.mjs` командою `node`."
    en: "Check the installed Node version against the course’s declared version and run a .mjs file with node."
  - uk: "Створити `package.json`, додати scripts `start` і `test`, запустити їх через npm і сказати, яку команду виконує кожен."
    en: "Create package.json, add start and test scripts, run them with npm and say which command each script executes."
prerequisites: [js-15-02-safe-commands, js-09-04-deterministic-fixtures]
subskills:
  - { family: P-01, skill: "package scripts/manifest", depth: intro }
glossary: [node-runtime, package-json, npm-script]

blocks:
  - id: node-outside-browser
    kind: explanation
    title:
      uk: "JavaScript без браузера"
      en: "JavaScript without a browser"
    body:
      uk: |
        [[node-runtime|Node.js]] виконує JavaScript у терміналі. Мова та сама: змінні, функції, масиви, `import` і `export` працюють так, як ти звик. Інше середовище: немає сторінки й `document`, а `console.log` друкує просто в термінал, під командою.

        ```text
        node summarize.mjs
        ```

        Розширення `.mjs` каже Node.js, що файл — ES-модуль, тож `import { … } from "./money.mjs"` працює без додаткових налаштувань. Як і в браузері, відносний шлях в `import` пишуть з розширенням.

        Курс розрахований на **Node.js 22.13 або новіший** — платформа сама вимагає цієї версії, тож вона в тебе вже є. `node --version` друкує версію у вигляді `v22.13.0`: важливі перші два числа.
      en: |
        [[node-runtime|Node.js]] runs JavaScript in a terminal. The language is the same: variables, functions, arrays, `import` and `export` work the way you are used to. The environment differs: there is no page and no `document`, and `console.log` prints straight into the terminal, under the command.

        ```text
        node summarize.mjs
        ```

        The `.mjs` extension tells Node.js that the file is an ES module, so `import { … } from "./money.mjs"` works without extra setup. As in the browser, a relative path in `import` is written with its extension.

        The course needs **Node.js 22.13 or newer** — the platform itself requires that version, so you already have it. `node --version` prints the version as `v22.13.0`: the first two numbers are what matters.

  - id: recall-output
    kind: review
    title:
      uk: "Згадай: де видно результат"
      en: "Recall: where the output shows up"
    items:
      - id: where-output
        from: js-01-01-code-runs
        prompt:
          uk: "У файлі `hello.mjs` один рядок коду: `console.log(\"Hi\");`. Ти виконуєш у терміналі `node hello.mjs`. Де з’явиться `Hi`?"
          en: "The file `hello.mjs` has one line of code: `console.log(\"Hi\");`. You run `node hello.mjs` in a terminal. Where does `Hi` appear?"
        answer:
          type: choice
          options:
            - id: terminal
              text:
                uk: "У тому самому терміналі, рядком під командою"
                en: "In the same terminal, on a line under the command"
            - id: console-tab
              text:
                uk: "На вкладці «Консоль» платформи"
                en: "On the platform’s “Console” tab"
              why:
                uk: "Платформа не бачить програм, які ти запускаєш у своєму терміналі. Консоль програми тут — сам термінал."
                en: "The platform does not see the programs you start in your own terminal. The program’s console here is the terminal itself."
            - id: browser
              text:
                uk: "У вікні браузера, яке відкриє Node.js"
                en: "In a browser window that Node.js opens"
              why:
                uk: "Node.js не відкриває браузер і не має сторінки. Усе, що друкує `console.log`, іде в термінал."
                en: "Node.js opens no browser and has no page. Everything `console.log` prints goes to the terminal."
          correct: [terminal]
        explanation:
          uk: "Як і в першому уроці курсу, `console.log` виводить у консоль. Коли програму запускає Node.js, консоль — це термінал, з якого її запущено."
          en: "As in the course’s first lesson, `console.log` prints to the console. When Node.js runs the program, the console is the terminal it was started from."

  - id: manifest-and-scripts
    kind: explanation
    title:
      uk: "package.json і його scripts"
      en: "package.json and its scripts"
    body:
      uk: |
        [[package-json|package.json]] — опис проєкту у форматі JSON: назва, версія, [[dependency|залежності]] (про них — у наступному уроці) й поле `scripts`. Його створює `npm init -y`.

        [[npm-script|Script]] у `package.json` — це не окремий файл, а **рядок із командою під короткою назвою**:

        ```json
        "scripts": {
          "start": "node summarize.mjs",
          "test": "node --test"
        }
        ```

        - `npm start` виконує команду `start`, `npm test` — команду `test`. Це два скорочення, які npm знає.
        - Будь-яку іншу назву запускають через `run`: `npm run lint`. Просто `npm run` показує список усіх scripts.

        Навіщо? Кожен, хто відкриє проєкт, запускає його однаково — `npm start`, — не пам’ятаючи, як називається головний файл. Дописувати scripts будемо командою `npm pkg set`: вона сама ставить коми й лапки, тож JSON не зламається.
      en: |
        [[package-json|package.json]] describes a project in JSON: its name, version, [[dependency|dependencies]] (the next lesson covers them) and the `scripts` field. `npm init -y` creates it.

        A [[npm-script|script]] in `package.json` is not a separate file but **a line with a command under a short name**:

        ```json
        "scripts": {
          "start": "node summarize.mjs",
          "test": "node --test"
        }
        ```

        - `npm start` runs the `start` command, `npm test` the `test` command. These are two shortcuts npm knows.
        - Any other name is run with `run`: `npm run lint`. Plain `npm run` lists all the scripts.

        Why? Everyone who opens the project starts it the same way — `npm start` — without remembering what the main file is called. We will add scripts with the command `npm pkg set`: it puts in the commas and quotes itself, so the JSON does not break.

  - id: predict-npm-check
    kind: prediction
    prompt:
      uk: |
        У `package.json` є `"scripts": { "start": "node summarize.mjs", "check": "node --test" }`. Що станеться після команди `npm check`?
      en: |
        `package.json` has `"scripts": { "start": "node summarize.mjs", "check": "node --test" }`. What happens after the command `npm check`?
    answer:
      type: choice
      options:
        - id: unknown
          text:
            uk: "npm скаже, що не знає команди `check`: свої scripts, крім `start` і `test`, запускають через `npm run check`"
            en: "npm says it does not know the command `check`: your own scripts other than `start` and `test` are run with `npm run check`"
        - id: runs-tests
          text:
            uk: "Запустяться тести — `node --test`"
            en: "The tests run — `node --test`"
          why:
            uk: "Без `run` npm шукає **свою** команду з такою назвою, а не твій script. Скорочення є лише для кількох назв, серед них `start` і `test`."
            en: "Without `run` npm looks for **its own** command with that name, not your script. Only a few names have shortcuts, `start` and `test` among them."
        - id: runs-file
          text:
            uk: "npm шукатиме файл `check.mjs`"
            en: "npm looks for a file `check.mjs`"
          why:
            uk: "Script — це рядок із командою в `package.json`, а не файл. Ні npm, ні Node.js не вгадують назву файла з назви script."
            en: "A script is a line with a command in `package.json`, not a file. Neither npm nor Node.js guesses a file name from a script name."
      correct: [unknown]
    explanation:
      uk: "npm відповідає `Unknown command: \"check\"`. Твої scripts запускає `npm run <назва>`; `npm start` і `npm test` — лише скорочення для двох найчастіших. Щоб побачити, що є в проєкті, виконай `npm run` без назви."
      en: "npm answers `Unknown command: \"check\"`. Your scripts are run with `npm run <name>`; `npm start` and `npm test` are just shortcuts for the two most common ones. To see what the project has, run `npm run` with no name."

  - id: node-test
    kind: explanation
    title:
      uk: "Тести в Node.js: node --test"
      en: "Tests in Node.js: node --test"
    body:
      uk: |
        На платформі тести запускала кнопка «Перевірити». У Node.js є вбудований запускач тестів: `node --test` знаходить у теці файли з назвами на кшталт `money.test.mjs` і виконує їх.

        ```js
        import { test } from "node:test";
        import assert from "node:assert/strict";

        test("an empty basket costs nothing", () => {
          assert.equal(sum([]), 0);
        });
        ```

        `test` — та сама ідея, що й у JS-09: назва-речення і функція з перевірками. `assert.equal(actual, expected)` порівнює через `===` і падає з повідомленням, де видно обидва значення. Префікс `node:` означає, що модуль вбудований у Node.js і нічого встановлювати не треба.
      en: |
        In the platform the “Check” button ran the tests. Node.js has a built-in test runner: `node --test` finds files named like `money.test.mjs` in the folder and runs them.

        ```js
        import { test } from "node:test";
        import assert from "node:assert/strict";

        test("an empty basket costs nothing", () => {
          assert.equal(sum([]), 0);
        });
        ```

        `test` is the same idea as in JS-09: a sentence for a name and a function with checks. `assert.equal(actual, expected)` compares with `===` and fails with a message that shows both values. The `node:` prefix means the module is built into Node.js and nothing needs installing.

  - id: recall-deterministic
    kind: review
    title:
      uk: "Згадай: чому тест дає той самий результат"
      en: "Recall: why a test gives the same result"
    items:
      - id: same-tomorrow
        from: js-09-04-deterministic-fixtures
        prompt:
          uk: "Тест перевіряє `isOverdue(task)`, а сама функція всередині бере сьогоднішню дату з годинника комп’ютера. Сьогодні тест проходить. Що можна сказати про завтра?"
          en: "A test checks `isOverdue(task)`, and the function itself reads today’s date from the computer’s clock inside. Today the test passes. What can you say about tomorrow?"
        answer:
          type: choice
          options:
            - id: may-change
              text:
                uk: "Результат може змінитися: «сьогодні» входить у функцію непомітно, тож його треба передавати параметром"
                en: "The result may change: “today” enters the function unseen, so it should be passed in as a parameter"
            - id: same
              text:
                uk: "Пройде й завтра: код не змінився"
                en: "It passes tomorrow too: the code has not changed"
              why:
                uk: "Код той самий, а вхід — ні: годинник щодня показує інше «сьогодні», і задача, що вчора ще не прострочена, завтра вже прострочена."
                en: "The code is the same but the input is not: the clock shows a different “today” every day, and a task that was not overdue yesterday is overdue tomorrow."
          correct: [may-change]
        explanation:
          uk: "Детермінований тест залежить лише від того, що в ньому написано: фіксованих даних і явно переданого «сьогодні». Тести цього уроку такі самі — тому `npm test` дасть той самий результат на будь-якому комп’ютері в будь-який день."
          en: "A deterministic test depends only on what is written in it: fixed data and an explicitly passed “today”. This lesson’s tests are like that — so `npm test` gives the same result on any computer on any day."

  - id: first-node-project
    kind: local-task
    runtime: local-web
    title:
      uk: "Перший проєкт Node.js: запуск, package.json, start і test"
      en: "A first Node.js project: run, package.json, start and test"
    intro:
      uk: |
        Ти створиш теку `~/js-course/money-lab` з трьома файлами, запустиш їх через Node.js, а потім даси проєкту scripts `start` і `test`. Ця тека знадобиться в наступних трьох уроках.

        Файли створюй у редакторі (у VS Code: File → Open Folder → `money-lab`, потім New File). Вміст копіюй точно. Команди однакові на macOS, Linux і Windows PowerShell.

        Вміст файлів для кроків — копіюй його точно:

        **Крок 2 — `money.mjs`:**

        ```js
        // money.mjs: helpers for amounts kept in minor units (kopiykas or cents).
        export function totalMinor(expenses) {
          let total = 0;
          for (const expense of expenses) {
            total += expense.amountMinor;
          }
          return total;
        }

        export function formatMinor(amountMinor) {
          return `${(amountMinor / 100).toFixed(2)} UAH`;
        }
        ```

        **Крок 2 — `summarize.mjs`:**

        ```js
        // summarize.mjs: prints a short summary of synthetic expenses.
        import { totalMinor, formatMinor } from "./money.mjs";

        const expenses = [
          { label: "Weekly groceries", amountMinor: 84550 },
          { label: "Transit pass", amountMinor: 52000 },
          { label: "Lunch", amountMinor: 21050 },
        ];

        console.log(`Expenses: ${expenses.length}`);
        console.log(`Total: ${formatMinor(totalMinor(expenses))}`);
        ```

        **Крок 5 — `money.test.mjs`:**

        ```js
        // money.test.mjs: deterministic tests, run with node --test.
        import { test } from "node:test";
        import assert from "node:assert/strict";
        import { totalMinor, formatMinor } from "./money.mjs";

        test("totalMinor adds amounts in minor units", () => {
          assert.equal(totalMinor([{ amountMinor: 100 }, { amountMinor: 250 }]), 350);
        });

        test("totalMinor of an empty list is 0", () => {
          assert.equal(totalMinor([]), 0);
        });

        test("formatMinor shows two decimal places", () => {
          assert.equal(formatMinor(157600), "1576.00 UAH");
        });
        ```
      en: |
        You will create the folder `~/js-course/money-lab` with three files, run them with Node.js, and then give the project `start` and `test` scripts. You will need this folder in the next three lessons.

        Create the files in the editor (in VS Code: File → Open Folder → `money-lab`, then New File). Copy the contents exactly. The commands are the same on macOS, Linux and Windows PowerShell.

        File contents for the steps — copy them exactly:

        **Step 2 — `money.mjs`:**

        ```js
        // money.mjs: helpers for amounts kept in minor units (kopiykas or cents).
        export function totalMinor(expenses) {
          let total = 0;
          for (const expense of expenses) {
            total += expense.amountMinor;
          }
          return total;
        }

        export function formatMinor(amountMinor) {
          return `${(amountMinor / 100).toFixed(2)} UAH`;
        }
        ```

        **Step 2 — `summarize.mjs`:**

        ```js
        // summarize.mjs: prints a short summary of synthetic expenses.
        import { totalMinor, formatMinor } from "./money.mjs";

        const expenses = [
          { label: "Weekly groceries", amountMinor: 84550 },
          { label: "Transit pass", amountMinor: 52000 },
          { label: "Lunch", amountMinor: 21050 },
        ];

        console.log(`Expenses: ${expenses.length}`);
        console.log(`Total: ${formatMinor(totalMinor(expenses))}`);
        ```

        **Step 5 — `money.test.mjs`:**

        ```js
        // money.test.mjs: deterministic tests, run with node --test.
        import { test } from "node:test";
        import assert from "node:assert/strict";
        import { totalMinor, formatMinor } from "./money.mjs";

        test("totalMinor adds amounts in minor units", () => {
          assert.equal(totalMinor([{ amountMinor: 100 }, { amountMinor: 250 }]), 350);
        });

        test("totalMinor of an empty list is 0", () => {
          assert.equal(totalMinor([]), 0);
        });

        test("formatMinor shows two decimal places", () => {
          assert.equal(formatMinor(157600), "1576.00 UAH");
        });
        ```
    tools:
      - name: "Node.js"
        version: { uk: "22.13 або новіша (перевірено з 25.2)", en: "22.13 or newer (checked with 25.2)" }
        note:
          uk: "npm встановлюється разом із ним"
          en: "npm comes with it"
      - name: "A code editor"
        version: { uk: "VS Code або будь-який редактор простого тексту", en: "VS Code or any plain-text editor" }
    steps:
      - text:
          uk: "Перевір версію Node.js і створи теку проєкту:"
          en: "Check the Node.js version and create the project folder:"
        command: "node --version\ncd ~/js-course\nmkdir money-lab\ncd money-lab"
        expect:
          uk: "Рядок на кшталт `v22.13.0`, `v24.…` чи `v25.2.1` — головне, щоб перше число було 22 або більше (а для 22 — друге не менше 13)."
          en: "A line such as `v22.13.0`, `v24.…` or `v25.2.1` — what matters is that the first number is 22 or more (and for 22, the second is at least 13)."
      - text:
          uk: |
            Створи в `money-lab` файли `money.mjs` і `summarize.mjs` з вмістом із вступу до завдання (позначки «Крок 2»). Збережи обидва й запусти головний:
          en: |
            Create the files `money.mjs` and `summarize.mjs` in `money-lab` with the contents from the task introduction (marked “Step 2”). Save both and run the main one:
        command: "node summarize.mjs"
        expect:
          uk: |
            ```text
            Expenses: 3
            Total: 1576.00 UAH
            ```
          en: |
            ```text
            Expenses: 3
            Total: 1576.00 UAH
            ```
      - text:
          uk: |
            Створи `package.json` і додай два scripts. Лапки навколо кожного `назва=команда` обов’язкові: без них shell розірве команду на пробілі.
          en: |
            Create `package.json` and add two scripts. The quotes around each `name=command` are required: without them the shell splits the command at the space.
        command: "npm init -y\nnpm pkg set \"scripts.start=node summarize.mjs\" \"scripts.test=node --test\"\nnpm run"
        expect:
          uk: |
            `npm init -y` друкує `Wrote to …/money-lab/package.json:` і вміст файла (залежно від версії npm там може бути `"type": "commonjs"` — для файлів `.mjs` це нічого не змінює). `npm run` показує:

            ```text
            Lifecycle scripts included in money-lab@1.0.0:
              test
                node --test
              start
                node summarize.mjs
            ```
          en: |
            `npm init -y` prints `Wrote to …/money-lab/package.json:` and the file’s contents (depending on the npm version there may be `"type": "commonjs"` — for `.mjs` files it changes nothing). `npm run` shows:

            ```text
            Lifecycle scripts included in money-lab@1.0.0:
              test
                node --test
              start
                node summarize.mjs
            ```
      - text:
          uk: "Запусти проєкт через script:"
          en: "Start the project through its script:"
        command: "npm start"
        expect:
          uk: |
            npm спершу показує, яку команду виконує, потім — вивід програми:

            ```text
            > money-lab@1.0.0 start
            > node summarize.mjs

            Expenses: 3
            Total: 1576.00 UAH
            ```
          en: |
            npm first shows which command it runs, then the program’s output:

            ```text
            > money-lab@1.0.0 start
            > node summarize.mjs

            Expenses: 3
            Total: 1576.00 UAH
            ```
      - text:
          uk: |
            Створи файл тестів `money.test.mjs` з вмістом із вступу до завдання (позначка «Крок 5») і запусти тести:
          en: |
            Create the test file `money.test.mjs` with the contents from the task introduction (marked “Step 5”) and run the tests:
        command: "npm test"
        expect:
          uk: |
            Три рядки з `✔` і підсумок (час у дужках у тебе інший):

            ```text
            > money-lab@1.0.0 test
            > node --test

            ✔ totalMinor adds amounts in minor units (0.6285ms)
            ✔ totalMinor of an empty list is 0 (0.052ms)
            ✔ formatMinor shows two decimal places (0.054625ms)
            ℹ tests 3
            ℹ suites 0
            ℹ pass 3
            ℹ fail 0
            ```

            Нижче ще кілька рядків `ℹ` — `cancelled 0`, `skipped 0`, `todo 0` і тривалість.
          en: |
            Three lines with `✔` and a summary (the times in brackets differ for you):

            ```text
            > money-lab@1.0.0 test
            > node --test

            ✔ totalMinor adds amounts in minor units (0.6285ms)
            ✔ totalMinor of an empty list is 0 (0.052ms)
            ✔ formatMinor shows two decimal places (0.054625ms)
            ℹ tests 3
            ℹ suites 0
            ℹ pass 3
            ℹ fail 0
            ```

            Below there are a few more `ℹ` lines — `cancelled 0`, `skipped 0`, `todo 0` and the duration.
      - text:
          uk: "Перевір, що тести справді щось перевіряють: у `money.mjs` заміни `100` на `10` у `formatMinor`, збережи, запусти `npm test`, прочитай, що каже провалений тест, і поверни `100`."
          en: "Check that the tests really check something: in `money.mjs` replace `100` with `10` in `formatMinor`, save, run `npm test`, read what the failing test says, and put `100` back."
        command: "npm test"
        expect:
          uk: "Зі зміненим числом: `✖ formatMinor shows two decimal places` і `ℹ fail 1`, а нижче `+ actual - expected` з `'15760.00 UAH'` проти `'1576.00 UAH'`. Після повернення `100` — знову `ℹ fail 0`."
          en: "With the changed number: `✖ formatMinor shows two decimal places` and `ℹ fail 1`, and below `+ actual - expected` with `'15760.00 UAH'` against `'1576.00 UAH'`. After putting `100` back — `ℹ fail 0` again."
    verify:
      - id: node-version
        text:
          uk: "`node --version` показав 22.13 або новішу версію."
          en: "`node --version` showed 22.13 or a newer version."
      - id: start-output
        text:
          uk: "`npm start` надрукував `Total: 1576.00 UAH`, і я бачив рядок `> node summarize.mjs` — команду, яку виконує script."
          en: "`npm start` printed `Total: 1576.00 UAH`, and I saw the line `> node summarize.mjs` — the command the script runs."
      - id: test-output
        text:
          uk: "`npm test` показав `ℹ pass 3` і `ℹ fail 0`, а зі зламаним `formatMinor` — `ℹ fail 1`."
          en: "`npm test` showed `ℹ pass 3` and `ℹ fail 0`, and with the broken `formatMinor` — `ℹ fail 1`."
    troubleshooting:
      - problem:
          uk: "`command not found: node` або `node : The term 'node' is not recognized`"
          en: "`command not found: node` or `node : The term 'node' is not recognized`"
        fix:
          uk: "Node.js не встановлено або термінал відкрито до встановлення. Закрий термінал, відкрий новий і повтори. Якщо не допомогло — встанови LTS-версію з nodejs.org (обліковий запис не потрібен)."
          en: "Node.js is not installed, or the terminal was opened before installing it. Close the terminal, open a new one and try again. If that does not help, install the LTS version from nodejs.org (no account needed)."
      - problem:
          uk: "`Error: Cannot find module '…/money-lab/summarise.mjs'` або `ERR_MODULE_NOT_FOUND`"
          en: "`Error: Cannot find module '…/money-lab/summarise.mjs'` or `ERR_MODULE_NOT_FOUND`"
        fix:
          uk: "Node.js не знайшов файл за цим шляхом. Порівняй назву в команді чи в `import` з тим, що показує `ls`: зайва літера, інше розширення (`.js` замість `.mjs`) або файл збережено в іншій теці."
          en: "Node.js did not find a file at that path. Compare the name in the command or in the `import` with what `ls` shows: a stray letter, another extension (`.js` instead of `.mjs`) or the file saved in another folder."
      - problem:
          uk: "`npm error Missing script: \"start\"`"
          en: "`npm error Missing script: \"start\"`"
        fix:
          uk: "У `package.json` немає script із такою назвою. Виконай `npm run` — побачиш, які є, — і повтори крок із `npm pkg set` з лапками навколо кожного `назва=команда`."
          en: "`package.json` has no script with that name. Run `npm run` to see which there are, and repeat the `npm pkg set` step with quotes around each `name=command`."
      - problem:
          uk: "`npm error code ENOENT` … `Could not read package.json`"
          en: "`npm error code ENOENT` … `Could not read package.json`"
        fix:
          uk: "Ти запускаєш npm не в теці проєкту. `pwd` має закінчуватися на `money-lab`; якщо ні — `cd ~/js-course/money-lab`."
          en: "You are running npm outside the project folder. `pwd` should end with `money-lab`; if not, `cd ~/js-course/money-lab`."
      - problem:
          uk: "Windows: `npm.ps1 cannot be loaded because running scripts is disabled on this system`"
          en: "Windows: `npm.ps1 cannot be loaded because running scripts is disabled on this system`"
        fix:
          uk: "PowerShell не дозволяє запускати файл-обгортку npm. Найпростіше — писати `npm.cmd` замість `npm` (`npm.cmd start`, `npm.cmd test`): це та сама програма. Налаштування безпеки системи заради цього не змінюй."
          en: "PowerShell does not allow running npm’s wrapper file. The simplest fix is to write `npm.cmd` instead of `npm` (`npm.cmd start`, `npm.cmd test`): it is the same program. Do not change system security settings for this."
    recovery:
      uk: "Усе живе в `~/js-course/money-lab`. Якщо `package.json` зламався (наприклад, після ручного редагування), видали лише його й повтори крок 3: `npm init -y` і `npm pkg set`. Файли `.mjs` можна просто скопіювати з уроку знову."
      en: "Everything lives in `~/js-course/money-lab`. If `package.json` got broken (for example after editing by hand), delete only that file and repeat step 3: `npm init -y` and `npm pkg set`. The `.mjs` files can simply be copied from the lesson again."

  - id: to-project
    kind: transfer
    capstoneStep: JS-15
    body:
      uk: "У твоєму проєкті `npm start` і `npm test` з’являться під час експорту в JS-10. Уже зараз ти знаєш, як прочитати, що саме вони запускають: `npm run` і рядок `>` над виводом."
      en: "Your project gets `npm start` and `npm test` with the export in JS-10. You already know how to read what exactly they run: `npm run` and the `>` line above the output."
