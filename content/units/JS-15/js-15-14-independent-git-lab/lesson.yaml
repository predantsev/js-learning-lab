id: js-15-14-independent-git-lab
unit: JS-15
title:
  uk: "Самостійно: commit, конфлікт, review, відновлення"
  en: "Independent: commit, resolve, review, recover"
kind: assessment
minutes: 35
contentVersion: 1
purpose:
  uk: "Підсумкова перевірка розділу: без підказок і на новому проєкті — планувальнику — ти показуєш, що вмієш робити зв’язні commits у гілці, розв’язувати конфлікт і доводити результат тестами, читати історію після rebase, рятувати загублений commit, обмінюватися commits через remote і писати обґрунтований review."
  en: "The unit’s final check: with no hints and on a new project — a planner — you show that you can make coherent commits on a branch, resolve a conflict and prove the result with tests, read history after a rebase, rescue a lost commit, exchange commits through a remote and write a reasoned review."
objectives:
  - uk: "Без підказок зробити зв’язні commits у гілці, розв’язати конфліктне злиття й довести його тестами, пояснити наданий граф після rebase, повернути commit, загублений через reset, і надіслати історію в локальний remote."
    en: "Without hints, make coherent commits on a branch, resolve a conflicting merge and prove it with tests, read a supplied rebase graph, recover a lost commit and push through a local remote."
  - uk: "Переглянути підготовлений diff і письмово обґрунтувати рішення approve чи request changes."
    en: "Review a seeded diff and justify the approve or request-changes decision in writing."
prerequisites: [js-15-13-debug-broken-setup]
subskills:
  - { family: P-02, skill: "status/diff/stage/commit", depth: assess }
  - { family: P-02, skill: "branch/history", depth: assess }
  - { family: P-02, skill: "local merge/rebase reading", depth: assess }
  - { family: P-02, skill: "resolve conflicts", depth: assess }
  - { family: P-02, skill: "undo safely", depth: assess }
  - { family: P-02, skill: "remotes/PR review concepts", depth: assess }
  - { family: P-02, skill: "review rationale", depth: assess }
glossary: []

blocks:
  - id: how-it-works
    kind: explanation
    title:
      uk: "Як проходить перевірка"
      en: "How the check works"
    body:
      uk: |
        Три частини, у будь-якому порядку:

        1. **Читання історії** — питання про граф, отриманий після rebase.
        2. **Review** — у пісочниці: знайти дефект у pull request до функції `dueCount` і обґрунтувати рішення. Перевірки платформи оцінять твій review.
        3. **Лабораторна в терміналі** — новий репозиторій `planner-lab`: гілка, конфлікт, відновлення, remote. Платформа її не бачить: ти записуєш докази (вивід команд) і чесно підтверджуєш те, що справді зробив.

        Підказок немає. Можна перечитувати попередні уроки й шукати в документації Git — так працюють і професіонали. Не можна лише копіювати чужий готовий результат.
      en: |
        Three parts, in any order:

        1. **Reading history** — a question about a graph produced by a rebase.
        2. **Review** — in the sandbox: find the defect in a pull request for the function `dueCount` and justify your decision. The platform’s checks assess your review.
        3. **A terminal lab** — a new repository `planner-lab`: a branch, a conflict, a recovery, a remote. The platform cannot see it: you record evidence (command output) and honestly confirm what you really did.

        There are no hints. You may reread earlier lessons and search the Git documentation — professionals work that way too. The only thing not allowed is copying someone else’s finished result.

  - id: read-rebase-graph
    kind: prediction
    prompt:
      uk: |
        До команди історія планувальника виглядала так:

        ```text
        * 5d0c1aa (HEAD -> main) Count due tasks
        | * 77b2e10 (feature/priority) Test the priority sort
        | * 3f9a4c2 Sort tasks by priority
        |/
        * a81e0d4 Add the task list
        ```

        Після однієї команди на гілці `feature/priority` — так:

        ```text
        * c42d9b7 (HEAD -> feature/priority) Test the priority sort
        * 9e1f305 Sort tasks by priority
        * 5d0c1aa (main) Count due tasks
        * a81e0d4 Add the task list
        ```

        Що з цього правда? Обери все.
      en: |
        Before the command the planner’s history looked like this:

        ```text
        * 5d0c1aa (HEAD -> main) Count due tasks
        | * 77b2e10 (feature/priority) Test the priority sort
        | * 3f9a4c2 Sort tasks by priority
        |/
        * a81e0d4 Add the task list
        ```

        After one command on the branch `feature/priority` it looks like this:

        ```text
        * c42d9b7 (HEAD -> feature/priority) Test the priority sort
        * 9e1f305 Sort tasks by priority
        * 5d0c1aa (main) Count due tasks
        * a81e0d4 Add the task list
        ```

        Which of these are true? Pick all of them.
    answer:
      type: multi
      options:
        - id: was-rebase
          text:
            uk: "Виконано `git rebase main`"
            en: "`git rebase main` was run"
        - id: new-commits
          text:
            uk: "`9e1f305` містить ту саму зміну, що й `3f9a4c2`, але це інший commit"
            en: "`9e1f305` holds the same change as `3f9a4c2`, but it is a different commit"
        - id: ff-next
          text:
            uk: "`git merge feature/priority` на `main` тепер буде fast-forward"
            en: "`git merge feature/priority` on `main` will now be a fast-forward"
        - id: teammate-problem
          text:
            uk: "Якщо колега вже мав `3f9a4c2` і `77b2e10`, його історія тепер розходиться з цією гілкою"
            en: "If a teammate already had `3f9a4c2` and `77b2e10`, their history now diverges from this branch"
        - id: merge-commit
          text:
            uk: "Створено merge commit із двома батьками"
            en: "A merge commit with two parents was created"
          why:
            uk: "У новому графі немає commit, у який сходяться дві лінії: історія пряма. Це ознака rebase, а не merge."
            en: "The new graph has no commit where two lines join: the history is straight. That is the sign of a rebase, not a merge."
        - id: main-moved
          text:
            uk: "`main` теж пересунулася"
            en: "`main` moved too"
          why:
            uk: "`main` досі на `5d0c1aa`: rebase переносить лише поточну гілку."
            en: "`main` is still on `5d0c1aa`: a rebase moves only the current branch."
      correct: [was-rebase, new-commits, ff-next, teammate-problem]
    explanation:
      uk: "Commits гілки опинилися поверх `5d0c1aa` з новими id, а граф став прямим — це rebase. Тепер гілка лише продовжує `main`, тож злиття буде fast-forward. Старі `3f9a4c2` і `77b2e10` у кого-небудь іще — це інші commits з тими самими змінами, тому спільні гілки не переносять."
      en: "The branch’s commits ended up on top of `5d0c1aa` with new ids, and the graph became straight — that is a rebase. The branch now only continues `main`, so a merge will be a fast-forward. The old `3f9a4c2` and `77b2e10` on someone else’s machine are different commits with the same changes, which is why shared branches are not rebased."

  - id: review-due-count
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: review-due-count
    entry: index.js
    editable: [review.js]
    title:
      uk: "Review: лічильник справ до терміну"
      en: "Review: the due-tasks counter"
    instructions:
      uk: |
        У планувальнику `dueCount(tasks, today)` рахує справи, які ще не виконано і термін яких — `today` або раніше; справа без терміну (`dueDate: null`) ніколи не вважається такою, що настала. Дати — тексти `"YYYY-MM-DD"`.

        Pull request «Count due tasks in one loop instead of filter»:

        ```diff
         export function dueCount(tasks, today) {
        -  return tasks.filter((task) => !task.done && task.dueDate !== null && task.dueDate <= today).length;
        +  let count = 0;
        +  for (const task of tasks) {
        +    if (!task.done && task.dueDate < today) count++;
        +  }
        +  return count;
         }
        ```

        `before.js` — версія з `main`, `after.js` — з гілки, `index.js` порівнює їх на твоєму випадку. Заповни `review.js`:

        - `failingTasks` — справи `{ title, done, dueDate }`, для яких нова версія рахує неправильно, і `today`;
        - `expected` — правильна кількість для них;
        - `defectComment` — що не так і на якому випадку (назви `today` або термін справи);
        - `question` — питання про намір зміни, з `?` у кінці;
        - `decision` — `"approve"` або `"request-changes"`, і `reason` — чому.

        Коментарі можна писати українською або англійською.
      en: |
        In the planner `dueCount(tasks, today)` counts tasks that are not done and are due on `today` or earlier; a task without a due date (`dueDate: null`) is never due. Dates are texts `"YYYY-MM-DD"`.

        The pull request “Count due tasks in one loop instead of filter”:

        ```diff
         export function dueCount(tasks, today) {
        -  return tasks.filter((task) => !task.done && task.dueDate !== null && task.dueDate <= today).length;
        +  let count = 0;
        +  for (const task of tasks) {
        +    if (!task.done && task.dueDate < today) count++;
        +  }
        +  return count;
         }
        ```

        `before.js` is the version on `main`, `after.js` the one on the branch, and `index.js` compares them on your case. Fill in `review.js`:

        - `failingTasks` — tasks `{ title, done, dueDate }` for which the new version counts wrongly, and `today`;
        - `expected` — the correct count for them;
        - `defectComment` — what is wrong and in which case (name `today` or a task’s due date);
        - `question` — a question about the intent of the change, ending with `?`;
        - `decision` — `"approve"` or `"request-changes"`, and `reason` — why.

        You may write the comments in English or Ukrainian.
    testTitles:
      "today is a YYYY-MM-DD date":
        uk: "`today` — дата у вигляді `YYYY-MM-DD`"
        en: "`today` is a date written as `YYYY-MM-DD`"
      "failingTasks is a non-empty list of tasks":
        uk: "`failingTasks` — непорожній список справ із `done` (true/false) і `dueDate` (дата або `null`)"
        en: "`failingTasks` is a non-empty list of tasks with `done` (true/false) and `dueDate` (a date or `null`)"
      "expected is the correct count":
        uk: "`expected` — правильна кількість справ до терміну"
        en: "`expected` is the correct number of due tasks"
      "the new dueCount really gives a wrong count":
        uk: "Нова `dueCount` справді рахує неправильно для твого випадку"
        en: "The new `dueCount` really counts wrongly for your case"
      "the defect comment names the failing case":
        uk: "`defectComment` називає `today` або термін однієї зі справ"
        en: "`defectComment` names `today` or the due date of one of the tasks"
      "the question is a real question":
        uk: "`question` має щонайменше 10 символів і закінчується на `?`"
        en: "`question` has at least 10 characters and ends with `?`"
      "the decision is request-changes":
        uk: "`decision` — `\"request-changes\"`"
        en: "`decision` is `\"request-changes\"`"
      "the reason explains the decision":
        uk: "`reason` має щонайменше 15 символів"
        en: "`reason` has at least 15 characters"
    solutionNote:
      uk: "Нова версія порівнює через `<` замість `<=`, тож справа з терміном рівно `today` випадає з лічильника: для справи з `dueDate: \"2026-03-01\"` і `today: \"2026-03-01\"` стара версія дає 1, нова — 0. Це гранична помилка правильності, тому — request changes, з конкретним випадком у коментарі й питанням, чи зміна порівняння була задумана, адже опис обіцяв лише інший спосіб запису."
      en: "The new version compares with `<` instead of `<=`, so a task due exactly `today` drops out of the count: for a task with `dueDate: \"2026-03-01\"` and `today: \"2026-03-01\"` the old version gives 1, the new one 0. That is a boundary correctness defect, so — request changes, with the concrete case in the comment and a question whether changing the comparison was intended, since the description promised only a different way of writing it."
    feedback:
      - when: { test: "the new dueCount really gives a wrong count" }
        message:
          uk: "Ця перевірка очікує випадок, на якому `after.js` дає не ту кількість, що правильна. Запусти програму: рядок `before: …, after: …` має показати різні числа."
          en: "This check expects a case on which `after.js` gives a count other than the correct one. Run the program: the line `before: …, after: …` must show different numbers."
      - when: { test: "expected is the correct count" }
        message:
          uk: "Ця перевірка очікує в `expected` правильну кількість — так, як рахує версія з `main` (`before`)."
          en: "This check expects `expected` to hold the correct count — as the version on `main` (`before`) counts."
      - when: { error: SyntaxError }
        message:
          uk: "Програма не змогла запуститися, бо `review.js` уже не є правильним JavaScript. Перевір коми між полями й між об’єктами в `failingTasks`, лапки навколо тексту й дужки `[ ]` та `{ }`."
          en: "The program could not start because `review.js` is no longer valid JavaScript. Check the commas between fields and between the objects in `failingTasks`, the quotes around text and the `[ ]` and `{ }` brackets."

  - id: planner-lab
    kind: local-task
    runtime: local-web
    title:
      uk: "Лабораторна: planner-lab"
      en: "Lab: planner-lab"
    intro:
      uk: |
        Новий репозиторій `~/js-course/planner-lab`. Підготовку описано повністю; далі — лише завдання й те, що має вийти. Команди обираєш сам. Після кожного завдання збережи вивід зазначених команд (скопіюй у файл `EVIDENCE.md` поза репозиторієм, наприклад у `~/js-course/scratch`).

        Перед будь-якою командою, що щось видаляє чи переписує, — `git status` і `git log --oneline`.

        Вміст файлів для кроків — копіюй його точно:

        **Крок 1 — `README.md`:**

        ```markdown
        # Planner lab

        The assessment repository of the course. Nothing here is real data.
        ```

        **Крок 1 — `tasks.mjs`:**

        ```js
        // tasks.mjs: how one task is shown in the list.
        export function taskLine(task) {
          return `${task.title} (${task.priority})`;
        }
        ```

        **Крок 1 — `tasks.test.mjs`:**

        ```js
        // tasks.test.mjs: run with npm test.
        import { test } from "node:test";
        import assert from "node:assert/strict";
        import { taskLine } from "./tasks.mjs";

        test("shows the title and the priority", () => {
          const task = { title: "Write to grandma", dueDate: null, done: false, priority: "low" };
          assert.equal(taskLine(task), "Write to grandma (low)");
        });
        ```
      en: |
        A new repository, `~/js-course/planner-lab`. The setup is described in full; after that, only the tasks and what must come out. You choose the commands. After each task save the output of the named commands (copy it into a file `EVIDENCE.md` outside the repository, for example in `~/js-course/scratch`).

        Before any command that deletes or rewrites something — `git status` and `git log --oneline`.

        File contents for the steps — copy them exactly:

        **Step 1 — `README.md`:**

        ```markdown
        # Planner lab

        The assessment repository of the course. Nothing here is real data.
        ```

        **Step 1 — `tasks.mjs`:**

        ```js
        // tasks.mjs: how one task is shown in the list.
        export function taskLine(task) {
          return `${task.title} (${task.priority})`;
        }
        ```

        **Step 1 — `tasks.test.mjs`:**

        ```js
        // tasks.test.mjs: run with npm test.
        import { test } from "node:test";
        import assert from "node:assert/strict";
        import { taskLine } from "./tasks.mjs";

        test("shows the title and the priority", () => {
          const task = { title: "Write to grandma", dueDate: null, done: false, priority: "low" };
          assert.equal(taskLine(task), "Write to grandma (low)");
        });
        ```
    tools:
      - name: "Git"
        version: { uk: "2.28 або новіша (перевірено з 2.51)", en: "2.28 or newer (checked with 2.51)" }
      - name: "Node.js"
        version: { uk: "22.13 або новіша", en: "22.13 or newer" }
      - name: "A code editor"
        version: { uk: "VS Code або будь-який редактор простого тексту", en: "VS Code or any plain-text editor" }
    steps:
      - text:
          uk: |
            **Підготовка.** Створи теку `~/js-course/planner-lab` з трьома файлами із вступу до завдання (позначки «Крок 1»): `README.md`, `tasks.mjs` і `tasks.test.mjs`. Потім:
          en: |
            **Setup.** Create the folder `~/js-course/planner-lab` with the three files from the task introduction (marked “Step 1”): `README.md`, `tasks.mjs` and `tasks.test.mjs`. Then:
        command: "cd ~/js-course/planner-lab\nnpm init -y\nnpm pkg set \"scripts.test=node --test\"\ngit init -b main\ngit add README.md package.json tasks.mjs tasks.test.mjs\ngit commit -m \"Start the planner lab\"\nnpm test"
        expect:
          uk: "`[main (root-commit) …] Start the planner lab` і `ℹ pass 1`, `ℹ fail 0`."
          en: "`[main (root-commit) …] Start the planner lab` and `ℹ pass 1`, `ℹ fail 0`."
      - text:
          uk: |
            **Завдання 1 — гілка й два зв’язні commits.** У гілці `feature/due-date` зроби так, щоб справа з терміном показувалася як `Water the plants (normal) · due 2026-03-02`, а справа без терміну — як раніше. Це **два** commits: перший змінює лише `tasks.mjs`, другий додає тест на новий випадок у `tasks.test.mjs`. Повідомлення кожного пояснює, навіщо зміна. Докази:
          en: |
            **Task 1 — a branch and two coherent commits.** On the branch `feature/due-date`, make a task with a due date show as `Water the plants (normal) · due 2026-03-02`, and a task without one show as before. That is **two** commits: the first changes only `tasks.mjs`, the second adds a test for the new case to `tasks.test.mjs`. Each message explains why the change was made. Evidence:
        command: "npm test\ngit log --oneline --graph --all"
        expect:
          uk: "`ℹ pass 2`, `ℹ fail 0`; у графі гілка `feature/due-date` на два commits попереду `main`."
          en: "`ℹ pass 2`, `ℹ fail 0`; in the graph `feature/due-date` is two commits ahead of `main`."
      - text:
          uk: |
            **Завдання 2 — конфлікт.** На `main` зміни той самий рядок коду: тепер пріоритет іде першим — `[low] Write to grandma` (онови й очікування в тесті). Закоміть. Потім злий `feature/due-date` у `main`. Розв’яжи конфлікт так, щоб збереглися **обидва** наміри: справа з терміном — `[normal] Water the plants · due 2026-03-02`. Доведи тестами й заверши злиття. Докази:
          en: |
            **Task 2 — a conflict.** On `main` change the same line: now the priority comes first — `[low] Write to grandma` (update the test’s expectation too). Commit. Then merge `feature/due-date` into `main`. Resolve the conflict so that **both** intents survive: a task with a due date shows as `[normal] Water the plants · due 2026-03-02`. Prove it with tests and complete the merge. Evidence:
        command: "git diff --check\nnpm test\ngit log --oneline --graph --all"
        expect:
          uk: "`git diff --check` нічого не друкує; `ℹ pass 2`, `ℹ fail 0`; у графі — merge commit, у який сходяться дві лінії."
          en: "`git diff --check` prints nothing; `ℹ pass 2`, `ℹ fail 0`; the graph shows a merge commit where two lines join."
      - text:
          uk: |
            **Завдання 3 — відновлення.** Допиши в `README.md` рядок `Review the task list every Sunday.` і закоміть. Потім, переконавшись через `git status`, що незакоміченого нічого немає, зімітуй аварію: `git reset --hard HEAD~1`. Поверни загублений commit у `main`, не створюючи його заново. Докази:
          en: |
            **Task 3 — recovery.** Add the line `Review the task list every Sunday.` to `README.md` and commit. Then, having made sure with `git status` that nothing is uncommitted, simulate an accident: `git reset --hard HEAD~1`. Bring the lost commit back into `main` without creating it again. Evidence:
        command: "git reflog -4\ngit log --oneline -2"
        expect:
          uk: "У reflog — рядки `reset: moving to HEAD~1` і `commit: …` з твоїм повідомленням; `git log` знову починається з commit про README з **тим самим** id, що був до reset."
          en: "The reflog has the lines `reset: moving to HEAD~1` and `commit: …` with your message; `git log` again starts with the README commit with **the same** id it had before the reset."
      - text:
          uk: |
            **Завдання 4 — remote.** Створи поруч bare-репозиторій `~/js-course/planner-remote.git`, підключи його як `origin`, надішли `main`, склонуй remote в `~/js-course/planner-check` і запусти там тести. Докази:
          en: |
            **Task 4 — a remote.** Create a bare repository `~/js-course/planner-remote.git` next to it, connect it as `origin`, push `main`, clone the remote into `~/js-course/planner-check` and run the tests there. Evidence:
        command: "cd ~/js-course/planner-lab\ngit status\ngit log --oneline -1\ncd ~/js-course/planner-check\nnpm test\ngit log --oneline -1"
        expect:
          uk: "У `planner-lab`: `Your branch is up to date with 'origin/main'.`; у `planner-check`: `ℹ pass 2`, `ℹ fail 0`, а обидва `git log --oneline -1` показують той самий commit."
          en: "In `planner-lab`: `Your branch is up to date with 'origin/main'.`; in `planner-check`: `ℹ pass 2`, `ℹ fail 0`, and both `git log --oneline -1` show the same commit."
    verify:
      - id: two-commits
        text:
          uk: "На `feature/due-date` — два commits: зміна коду й тест, кожен з повідомленням про причину."
          en: "`feature/due-date` has two commits: the code change and the test, each with a message about the reason."
      - id: conflict-resolved
        text:
          uk: "Конфлікт розв’язано зі збереженням обох намірів, `git diff --check` чистий, тести пройшли до commit злиття."
          en: "The conflict is resolved keeping both intents, `git diff --check` is clean, the tests passed before the merge commit."
      - id: reflog-rescue
        text:
          uk: "Commit про README повернуто з reflog з тим самим id, без повторного створення."
          en: "The README commit was brought back from the reflog with the same id, without creating it again."
      - id: remote-clone
        text:
          uk: "Клон з `planner-remote.git` має той самий останній commit, і тести в ньому проходять."
          en: "The clone from `planner-remote.git` has the same latest commit, and its tests pass."
      - id: evidence-saved
        text:
          uk: "Я зберіг вивід усіх команд-доказів у `EVIDENCE.md` і виконав усе сам, без готового чужого розв’язку."
          en: "I saved the output of all evidence commands in `EVIDENCE.md` and did everything myself, without someone else’s finished solution."
    troubleshooting:
      - problem:
          uk: "Не пам’ятаю, як зробити певний крок"
          en: "I do not remember how to do a step"
        fix:
          uk: "Підказок тут немає навмисно, але попередні уроки відкриті: commits — js-15-07, гілки — js-15-08, конфлікти — js-15-10, reflog — js-15-11, remote — js-15-12. Перечитай і повернися."
          en: "There are no hints here on purpose, but the earlier lessons are open: commits — js-15-07, branches — js-15-08, conflicts — js-15-10, reflog — js-15-11, remotes — js-15-12. Reread and come back."
      - problem:
          uk: "Злиття пройшло без конфлікту"
          en: "The merge went through without a conflict"
        fix:
          uk: "Конфлікт виникає лише тоді, коли обидві гілки змінили той самий рядок коду. Перевір через `git log -p`, що `main` справді змінила рядок із `return`."
          en: "A conflict happens only when both branches changed the same line. Check with `git log -p` that `main` really changed the `return` line."
      - problem:
          uk: "Розгубився посеред злиття"
          en: "Got lost in the middle of a merge"
        fix:
          uk: "`git merge --abort` повертає стан до злиття; твої commits лишаються."
          en: "`git merge --abort` returns to the state before the merge; your commits stay."
    recovery:
      uk: "Закомічений стан знаходить `git reflog`. Якщо лабораторна заплуталася зовсім, видали лише `planner-lab`, `planner-remote.git` і `planner-check` (перевір назви!) і почни з підготовки — це навчальні теки."
      en: "`git reflog` finds any committed state. If the lab got completely tangled, delete only `planner-lab`, `planner-remote.git` and `planner-check` (check the names!) and start again from the setup — these are practice folders."
