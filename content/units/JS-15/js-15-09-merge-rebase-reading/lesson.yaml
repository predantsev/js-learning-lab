id: js-15-09-merge-rebase-reading
unit: JS-15
title:
  uk: "Читаємо merge і rebase"
  en: "Reading merge and rebase"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Передбачити історію, яку дають merge і rebase тих самих гілок, що розійшлися, зокрема які commits отримають нові id."
    en: "Predict the history that a merge and a rebase of the same diverged branches produce, including which commits get new ids."
  - uk: "Пояснити, коли merge буде fast-forward і чому rebase commits, які вже є в інших, ризикований."
    en: "Explain when a merge is a fast-forward and why rebasing commits that others already have is risky."
prerequisites: [js-15-08-branches-history]
subskills:
  - { family: P-02, skill: "local merge/rebase reading", depth: intro }
glossary: [fast-forward, merge-commit, rebase]
selfCheck: [predict-merge, predict-rebase-ids, replay-commits]

blocks:
  - id: two-ways
    kind: explanation
    title:
      uk: "Два способи з’єднати гілки"
      en: "Two ways to join branches"
    body:
      uk: |
        Після минулого уроку `main` і `feature/paused-mark` розійшлися: в `main` є commit «Describe the habit fields», у гілці — два свої. З’єднати їх можна двома способами.

        **Merge.** `git merge feature/paused-mark` (на `main`) створює [[merge-commit|merge commit]] — commit із **двома** батьками. Commits гілки лишаються як були, з тими самими id. Історія чесно показує, що робота йшла паралельно.

        **Rebase.** `git rebase main` (на гілці) бере commits гілки й по черзі **повторює** їхні зміни поверх `main`. Оскільки в кожного тепер інший батько, Git створює **нові** commits з новими id, а гілка переїжджає на них. Історія стає прямою лінією.

        Особливий випадок merge — [[fast-forward]]. Якщо в `main` немає власних нових commits, гілка просто продовжує її. Тоді Git нічого не з’єднує: пересуває назву `main` вперед, без merge commit.
      en: |
        After the last lesson `main` and `feature/paused-mark` have diverged: `main` has the commit “Describe the habit fields”, the branch has two of its own. They can be joined in two ways.

        **Merge.** `git merge feature/paused-mark` (on `main`) creates a [[merge-commit|merge commit]] — a commit with **two** parents. The branch’s commits stay as they were, with the same ids. The history honestly shows that work went on in parallel.

        **Rebase.** `git rebase main` (on the branch) takes the branch’s commits and **replays** their changes one by one on top of `main`. Since each now has a different parent, Git creates **new** commits with new ids, and the branch moves onto them. The history becomes a straight line.

        A special case of merge is a [[fast-forward]]. If `main` has no new commits of its own, the branch simply continues it. Then Git joins nothing: it moves the name `main` forward, with no merge commit.

  - id: merge-picture
    kind: visual
    visual: git-graph
    title:
      uk: "Merge: commit із двома батьками"
      en: "Merge: a commit with two parents"
    textEquivalent:
      uk: >-
        Гілки розійшлися після спільного commit c2: на feature/paused-mark є c3 і c4, на main — c5.
        На main виконується git merge feature/paused-mark. Git створює новий commit c6 з двома
        батьками, c5 і c4, і пересуває на нього main. Commits c3 і c4 залишаються незмінними, з тими
        самими id; feature/paused-mark досі вказує на c4.
      en: >-
        The branches diverged after the shared commit c2: feature/paused-mark has c3 and c4, main has
        c5. On main, git merge feature/paused-mark runs. Git creates a new commit c6 with two parents,
        c5 and c4, and moves main onto it. Commits c3 and c4 stay unchanged, with the same ids;
        feature/paused-mark still points at c4.
    spec:
      steps:
        - op: init
          caption:
            uk: "Репозиторій `git-lab`."
            en: "The `git-lab` repository."
        - op: commit
          message: "Add habit label with a test"
          files: [label.mjs]
          caption:
            uk: "Спільна історія…"
            en: "The shared history…"
        - op: commit
          message: "Explain how to run the tests"
          files: [README.md]
          caption:
            uk: "…до `c2` включно."
            en: "…up to and including `c2`."
        - op: branch
          name: feature/paused-mark
          caption:
            uk: "Гілка відходить від `c2`."
            en: "The branch starts at `c2`."
        - op: commit
          message: "Mark paused habits in the label"
          files: [label.mjs]
          caption:
            uk: "`c3` на гілці."
            en: "`c3` on the branch."
        - op: commit
          message: "Test the paused mark"
          files: [label.test.mjs]
          caption:
            uk: "`c4` на гілці."
            en: "`c4` on the branch."
        - op: checkout
          name: main
          caption:
            uk: "Назад на `main`."
            en: "Back to `main`."
        - op: commit
          message: "Describe the habit fields"
          files: [README.md]
          caption:
            uk: "`c5` на `main`. Гілки розійшлися — fast-forward неможливий."
            en: "`c5` on `main`. The branches have diverged — a fast-forward is impossible."
        - op: merge
          from: feature/paused-mark
          caption:
            uk: "`git merge feature/paused-mark`: новий **merge commit** з двома батьками — `c5` і `c4`. `c3` і `c4` не змінилися, їхні id ті самі."
            en: "`git merge feature/paused-mark`: a new **merge commit** with two parents — `c5` and `c4`. `c3` and `c4` did not change; their ids are the same."

  - id: predict-merge
    kind: prediction
    prompt:
      uk: |
        Історія до злиття (ти на `main`):

        ```text
        * ba15605 (HEAD -> main) Describe the habit fields
        | * 26f1118 (feature/paused-mark) Test the paused mark
        | * 1e27780 Mark paused habits in the label
        |/
        * eab0f9f Explain how to run the tests
        ```

        Що з цього правда після `git merge --no-edit feature/paused-mark`?
      en: |
        The history before merging (you are on `main`):

        ```text
        * ba15605 (HEAD -> main) Describe the habit fields
        | * 26f1118 (feature/paused-mark) Test the paused mark
        | * 1e27780 Mark paused habits in the label
        |/
        * eab0f9f Explain how to run the tests
        ```

        Which of these is true after `git merge --no-edit feature/paused-mark`?
    answer:
      type: choice
      options:
        - id: merge-commit
          text:
            uk: "З’явився новий commit із двома батьками, `ba15605` і `26f1118`; id `1e27780` і `26f1118` не змінилися"
            en: "A new commit with two parents, `ba15605` and `26f1118`, appeared; the ids `1e27780` and `26f1118` did not change"
        - id: same-as-rebase
          text:
            uk: "Commits гілки переїхали на `ba15605` й отримали нові id — так само, як після rebase"
            en: "The branch’s commits moved onto `ba15605` and got new ids — the same as after a rebase"
          why:
            uk: "Merge нічого не переписує: він додає один новий commit поверх обох ліній. Нові id commits гілки дає лише rebase."
            en: "Merge rewrites nothing: it adds one new commit on top of both lines. Only a rebase gives the branch’s commits new ids."
        - id: fast-forward
          text:
            uk: "`main` просто пересунулась на `26f1118` — fast-forward"
            en: "`main` simply moved to `26f1118` — a fast-forward"
          why:
            uk: "Fast-forward можливий, лише коли в `main` немає власних нових commits. Тут є `ba15605`, тож лінії треба з’єднати merge commit."
            en: "A fast-forward is possible only when `main` has no new commits of its own. Here there is `ba15605`, so the lines must be joined by a merge commit."
      correct: [merge-commit]
    explanation:
      uk: "Merge розійшлих гілок дає merge commit (`Merge branch 'feature/paused-mark'`) з двома батьками. Обидві лінії історії залишаються як були — merge безпечний і для commits, які вже бачили інші люди."
      en: "Merging diverged branches gives a merge commit (`Merge branch 'feature/paused-mark'`) with two parents. Both lines of history stay as they were — merge is safe even for commits other people have already seen."

  - id: rebase-picture
    kind: visual
    visual: git-graph
    title:
      uk: "Rebase: ті самі зміни, нові commits"
      en: "Rebase: the same changes, new commits"
    textEquivalent:
      uk: >-
        Та сама історія, що розійшлася: c3 і c4 на feature/paused-mark, c5 на main. На гілці виконується
        git rebase main. Git повторює зміну c3 поверх c5 і створює новий commit c3′, потім повторює c4
        поверх c3′ і створює c4′. Гілка тепер вказує на c4′, а старі c3 і c4 більше не належать жодній
        гілці. Потім на main злиття feature/paused-mark — це fast-forward: main просто пересувається на
        c4′, і історія — пряма лінія без merge commit.
      en: >-
        The same diverged history: c3 and c4 on feature/paused-mark, c5 on main. On the branch, git
        rebase main runs. Git replays the change of c3 on top of c5 and creates a new commit c3′, then
        replays c4 on top of c3′ and creates c4′. The branch now points at c4′, while the old c3 and c4
        no longer belong to any branch. Then on main merging feature/paused-mark is a fast-forward: main
        simply moves to c4′, and the history is a straight line with no merge commit.
    spec:
      steps:
        - op: init
          caption:
            uk: "Репозиторій `git-lab` у другій копії."
            en: "The `git-lab` repository, in a second copy."
        - op: commit
          message: "Add habit label with a test"
          files: [label.mjs]
          caption:
            uk: "Спільна історія…"
            en: "The shared history…"
        - op: commit
          message: "Explain how to run the tests"
          files: [README.md]
          caption:
            uk: "…до `c2` включно."
            en: "…up to and including `c2`."
        - op: branch
          name: feature/paused-mark
          caption:
            uk: "Гілка відходить від `c2`."
            en: "The branch starts at `c2`."
        - op: commit
          message: "Mark paused habits in the label"
          files: [label.mjs]
          caption:
            uk: "`c3` на гілці."
            en: "`c3` on the branch."
        - op: commit
          message: "Test the paused mark"
          files: [label.test.mjs]
          caption:
            uk: "`c4` на гілці."
            en: "`c4` on the branch."
        - op: checkout
          name: main
          caption:
            uk: "Назад на `main`."
            en: "Back to `main`."
        - op: commit
          message: "Describe the habit fields"
          files: [README.md]
          caption:
            uk: "`c5` на `main`. Та сама картина, що й перед merge."
            en: "`c5` on `main`. The same picture as before the merge."
        - op: checkout
          name: feature/paused-mark
          caption:
            uk: "`git switch feature/paused-mark` — rebase запускають на тій гілці, яку переносять."
            en: "`git switch feature/paused-mark` — a rebase runs on the branch being moved."
        - op: rebase
          onto: main
          caption:
            uk: "`git rebase main`: зміни `c3` і `c4` повторено поверх `c5` як **нові** commits `c3′` і `c4′` з новими id. Старі `c3` і `c4` більше не належать жодній гілці."
            en: "`git rebase main`: the changes of `c3` and `c4` are replayed on top of `c5` as **new** commits `c3′` and `c4′` with new ids. The old `c3` and `c4` no longer belong to any branch."
        - op: checkout
          name: main
          caption:
            uk: "Назад на `main`."
            en: "Back to `main`."
        - op: merge
          from: feature/paused-mark
          caption:
            uk: "Тепер гілка лише продовжує `main`, тож `git merge` — це **fast-forward**: `main` пересувається на `c4′`, merge commit не потрібен."
            en: "Now the branch only continues `main`, so `git merge` is a **fast-forward**: `main` moves to `c4′`, no merge commit needed."

  - id: predict-rebase-ids
    kind: prediction
    prompt:
      uk: |
        Та сама історія, що й у попередньому питанні, але тепер на гілці виконують `git rebase main`:

        ```text
        * ba15605 (main) Describe the habit fields
        | * 26f1118 (HEAD -> feature/paused-mark) Test the paused mark
        | * 1e27780 Mark paused habits in the label
        |/
        * eab0f9f Explain how to run the tests
        ```

        Які з цих id після rebase **більше не** будуть у гілці `feature/paused-mark`? Обери всі.
      en: |
        The same history as in the previous question, but now `git rebase main` runs on the branch:

        ```text
        * ba15605 (main) Describe the habit fields
        | * 26f1118 (HEAD -> feature/paused-mark) Test the paused mark
        | * 1e27780 Mark paused habits in the label
        |/
        * eab0f9f Explain how to run the tests
        ```

        Which of these ids will **no longer** be on the branch `feature/paused-mark` after the rebase? Pick all of them.
    answer:
      type: multi
      options:
        - id: test-old
          code: "26f1118"
        - id: mark-old
          code: "1e27780"
        - id: main-tip
          code: "ba15605"
          why:
            uk: "`ba15605` — нова основа гілки. Rebase не змінює commit, **на** який переносять, лише ті, **які** переносять."
            en: "`ba15605` is the branch’s new base. A rebase does not change the commit moved **onto**, only the commits **being** moved."
        - id: shared
          code: "eab0f9f"
          why:
            uk: "Спільний commit уже є в обох гілках. Його не переносять, і він лишається в історії гілки під тим самим id."
            en: "The shared commit is already on both branches. It is not moved, and it stays in the branch’s history under the same id."
      correct: [test-old, mark-old]
    explanation:
      uk: "Id commit обчислено з усього commit, і батько теж входить у це обчислення. Після rebase в `1e27780` інший батько (`ba15605` замість `eab0f9f`), тож це вже інший commit — `1259362` у реальному запуску; а за ним змінюється і наступний (`26f1118` → `460389d`). Зміни ті самі, commits — нові."
      en: "A commit id is computed from the whole commit, and the parent is part of that computation. After the rebase `1e27780` has a different parent (`ba15605` instead of `eab0f9f`), so it is a different commit — `1259362` in a real run; and so the next one changes too (`26f1118` → `460389d`). Same changes, new commits."

  - id: never-rebase-shared
    kind: explanation
    title:
      uk: "Чому не переносять спільні commits"
      en: "Why shared commits are not rebased"
    body:
      uk: |
        Rebase замінює commits новими. Поки commits є лише у тебе — це просто охайна історія. Але якщо колега вже отримав старі `1e27780` і `26f1118` і продовжив на них роботу, у нього лишаються старі commits, а в тебе — нові з тими самими змінами. Під час наступного обміну Git бачить два різні набори commits, і зміни дублюються або конфліктують.

        Звідси правило:

        - **merge** — для гілок, які вже бачили інші: нічого не переписує;
        - **rebase** — лише для власних локальних commits, яких ще ніхто не отримав, щоб гілка йшла від свіжої `main`.

        Наступна вправа — модель rebase, де видно, звідки беруться нові id.
      en: |
        A rebase replaces commits with new ones. While the commits exist only on your machine, that is just tidy history. But if a colleague already got the old `1e27780` and `26f1118` and kept working on top of them, they still have the old commits while you have new ones with the same changes. On the next exchange Git sees two different sets of commits, and the changes get duplicated or conflict.

        Hence the rule:

        - **merge** — for branches others have already seen: it rewrites nothing;
        - **rebase** — only for your own local commits that nobody has yet, so the branch starts from a fresh `main`.

        The next exercise is a model of rebase that shows where the new ids come from.

  - id: replay-commits
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: replay-commits
    entry: index.js
    editable: [index.js]
    title:
      uk: "Модель rebase, що «переносить» commits"
      en: "A rebase model that “moves” commits"
    instructions:
      uk: |
        У `history.js` — спрощена модель Git: `commitId(parent, message)` обчислює id commit з id батька й повідомлення (справжній Git бере ще й файли, автора й час). Функція `rebase(commits, ontoId)` в `index.js` має повторити commits гілки (від найстарішого) поверх commit `ontoId`, як `git rebase`.

        Запусти програму: вивід виглядає правдоподібно — батько першого commit змінився. Але функція поводиться так, ніби rebase лише переносить ті самі commits. Виправ її, щоб:

        - перший новий commit мав батьком `ontoId`, а кожен наступний — **новий** commit перед ним;
        - id кожного нового commit дорівнював `commitId(його батько, його повідомлення)`;
        - повідомлення йшли в тому самому порядку;
        - вхідний масив і його об’єкти не змінювалися.
      en: |
        `history.js` holds a simplified model of Git: `commitId(parent, message)` computes a commit id from the parent’s id and the message (real Git also uses the files, the author and the time). The function `rebase(commits, ontoId)` in `index.js` should replay the branch’s commits (oldest first) on top of the commit `ontoId`, like `git rebase`.

        Run the program: the output looks plausible — the first commit’s parent changed. But the function behaves as if a rebase just moved the same commits. Fix it so that:

        - the first new commit has `ontoId` as its parent, and each next one the **new** commit before it;
        - the id of each new commit equals `commitId(its parent, its message)`;
        - the messages stay in the same order;
        - the input array and its objects do not change.
    testTitles:
      "the first replayed commit sits on ontoId":
        uk: "Перший повторений commit має батьком `ontoId`"
        en: "The first replayed commit has `ontoId` as its parent"
      "each later commit sits on the replayed commit before it":
        uk: "Кожен наступний commit має батьком **новий** commit перед ним"
        en: "Each later commit has the **new** commit before it as its parent"
      "every replayed commit gets the id commitId computes from its new parent":
        uk: "Id кожного повтореного commit дорівнює `commitId(новий батько, повідомлення)`"
        en: "Each replayed commit’s id equals `commitId(new parent, message)`"
      "no replayed commit keeps its old id":
        uk: "Жоден повторений commit не зберіг старого id"
        en: "No replayed commit kept its old id"
      "messages keep their order":
        uk: "Повідомлення йдуть у тому самому порядку"
        en: "The messages keep their order"
      "the original commits are not changed":
        uk: "Вхідні commits лишилися незмінними"
        en: "The input commits are unchanged"
    hints:
      nudge:
        uk: "Подивись у вивід на id «після». Збігаються з id «до»? А тепер прочитай коментар у `history.js`: з чого складається id?"
        en: "Look at the ids “after” in the output. Do they match the ids “before”? Now read the comment in `history.js`: what is an id made of?"
      explanation:
        uk: |
          Батько входить в id, тож новий батько означає новий id — його треба обчислити, а не скопіювати. І наступний commit має стати на **новий** id, а не на старий. Це той самий прийом «несу вперед те, що щойно обчислив»:

          ```js
          let previous = "start";
          const path = ["kitchen", "hall"].map((room) => {
            const step = `${previous} > ${room}`;
            previous = step;     // the next room continues from this step
            return step;
          });
          // ["start > kitchen", "start > kitchen > hall"]
          ```

          Новий об’єкт будуй з потрібних полів, а не змінюй `commit`, що прийшов на вхід.
        en: |
          The parent is part of the id, so a new parent means a new id — it must be computed, not copied. And the next commit must sit on the **new** id, not the old one. It is the same trick of “carry forward what you just computed”:

          ```js
          let previous = "start";
          const path = ["kitchen", "hall"].map((room) => {
            const step = `${previous} > ${room}`;
            previous = step;     // the next room continues from this step
            return step;
          });
          // ["start > kitchen", "start > kitchen > hall"]
          ```

          Build the new object from the fields you need instead of changing the `commit` that came in.
    solutionNote:
      uk: "Для кожного commit обчислюється новий id з поточного батька, будується новий об’єкт `{ id, parent, message }`, а новий id стає батьком наступного. Тому після rebase змінюються id **усіх** перенесених commits, навіть якщо їхні зміни ті самі, — і саме тому rebase commits, які вже є в інших, створює два різні набори commits."
      en: "For each commit a new id is computed from the current parent, a new object `{ id, parent, message }` is built, and the new id becomes the next commit’s parent. That is why after a rebase the ids of **all** moved commits change even though their changes are the same — and exactly why rebasing commits others already have creates two different sets of commits."
    feedback:
      - when: { test: "every replayed commit gets the id commitId computes from its new parent" }
        message:
          uk: "Ця перевірка очікує, що id кожного нового commit обчислено через `commitId(parent, message)` з його **новим** батьком. Якщо id лишився той самий, що був, commit просто перенесли — а rebase створює новий."
          en: "This check expects each new commit’s id to be computed with `commitId(parent, message)` from its **new** parent. If the id is the same as before, the commit was just moved — a rebase creates a new one."
      - when: { test: "each later commit sits on the replayed commit before it" }
        message:
          uk: "Ця перевірка очікує, що батьком другого й третього commit буде id **нового** попереднього commit, а не його старий id."
          en: "This check expects the parent of the second and third commit to be the id of the **new** previous commit, not its old id."
      - when: { test: "the original commits are not changed" }
        message:
          uk: "Ця перевірка очікує, що масив, переданий у `rebase`, і його об’єкти після виклику такі самі, як до нього. Будуй нові об’єкти замість присвоєння `commit.id = …` чи `commit.parent = …`."
          en: "This check expects the array passed to `rebase` and its objects to be the same after the call as before. Build new objects instead of assigning `commit.id = …` or `commit.parent = …`."
      - when: { error: TypeError }
        message:
          uk: "Перевірки викликають `rebase` і читають поля того, що вона повертає. `… is not a function` означає, що функції `rebase` немає або програма впала до перевірок; `Cannot read properties of undefined` — що функція повертає не масив commits."
          en: "The checks call `rebase` and read fields of what it returns. `… is not a function` means there is no function `rebase` or the program crashed before the checks; `Cannot read properties of undefined` means the function does not return an array of commits."

  - id: merge-vs-rebase-lab
    kind: local-task
    runtime: local-web
    title:
      uk: "Merge в одній копії, rebase — в іншій"
      en: "Merge in one copy, rebase in another"
    intro:
      uk: |
        Щоб порівняти обидва способи на тій самій історії й не зачепити оригінал, зроби дві копії `git-lab`. Сам `git-lab` має лишитися з гілками, що розійшлися, — він знадобиться в наступному уроці.

        Копіювання теки: на macOS і Linux — `cp -R`, у Windows PowerShell — `Copy-Item -Recurse` (вказано біля кроку). Id commits у тебе інші — порівнюй повідомлення й форму графа.
      en: |
        To compare both ways on the same history without touching the original, make two copies of `git-lab`. `git-lab` itself must keep its diverged branches — you need it in the next lesson.

        Copying a folder: on macOS and Linux `cp -R`, in Windows PowerShell `Copy-Item -Recurse` (given next to the step). Your commit ids differ — compare the messages and the shape of the graph.
    tools:
      - name: "Git"
        version: "2.28 or newer (checked with 2.51)"
      - name: "Node.js"
        version: "22.13 or newer"
    steps:
      - text:
          uk: "Зроби дві копії (на Windows: `Copy-Item -Recurse git-lab merge-copy` і `Copy-Item -Recurse git-lab rebase-copy`):"
          en: "Make two copies (on Windows: `Copy-Item -Recurse git-lab merge-copy` and `Copy-Item -Recurse git-lab rebase-copy`):"
        command: "cd ~/js-course\ncp -R git-lab merge-copy\ncp -R git-lab rebase-copy"
        expect:
          uk: "Нічого не друкує. `ls` показує `git-lab`, `merge-copy` і `rebase-copy`. Копія теки містить і `.git`, тобто всю історію."
          en: "Prints nothing. `ls` shows `git-lab`, `merge-copy` and `rebase-copy`. A copy of the folder includes `.git` — the whole history."
      - text:
          uk: "У першій копії злий гілку в `main`. `--no-edit` бере стандартне повідомлення merge commit і не відкриває редактор."
          en: "In the first copy merge the branch into `main`. `--no-edit` takes the standard merge commit message and does not open an editor."
        command: "cd ~/js-course/merge-copy\ngit merge --no-edit feature/paused-mark\ngit log --oneline --graph --all\nnpm test"
        expect:
          uk: |
            ```text
            Merge made by the 'ort' strategy.
             label.mjs      | 3 ++-
             label.test.mjs | 5 +++++
             2 files changed, 7 insertions(+), 1 deletion(-)
            *   80b729d (HEAD -> main) Merge branch 'feature/paused-mark'
            |\
            | * 26f1118 (feature/paused-mark) Test the paused mark
            | * 1e27780 Mark paused habits in the label
            * | ba15605 Describe the habit fields
            |/
            * eab0f9f Explain how to run the tests
            * 3ab7a35 Add habit label with a test
            ```

            Id commits гілки ті самі, що до злиття. `npm test` — `ℹ pass 2`.
          en: |
            ```text
            Merge made by the 'ort' strategy.
             label.mjs      | 3 ++-
             label.test.mjs | 5 +++++
             2 files changed, 7 insertions(+), 1 deletion(-)
            *   80b729d (HEAD -> main) Merge branch 'feature/paused-mark'
            |\
            | * 26f1118 (feature/paused-mark) Test the paused mark
            | * 1e27780 Mark paused habits in the label
            * | ba15605 Describe the habit fields
            |/
            * eab0f9f Explain how to run the tests
            * 3ab7a35 Add habit label with a test
            ```

            The branch’s commit ids are the same as before the merge. `npm test` — `ℹ pass 2`.
      - text:
          uk: "У другій копії перенеси гілку на `main`, а потім злий її:"
          en: "In the second copy rebase the branch onto `main`, then merge it:"
        command: "cd ~/js-course/rebase-copy\ngit switch feature/paused-mark\ngit rebase main\ngit log --oneline --graph --all\ngit switch main\ngit merge feature/paused-mark"
        expect:
          uk: |
            ```text
            Successfully rebased and updated refs/heads/feature/paused-mark.
            * 460389d (HEAD -> feature/paused-mark) Test the paused mark
            * 1259362 Mark paused habits in the label
            * ba15605 (main) Describe the habit fields
            * eab0f9f Explain how to run the tests
            * 3ab7a35 Add habit label with a test
            Switched to branch 'main'
            Updating ba15605..460389d
            Fast-forward
            ```

            Порівняй з першою копією: ті самі повідомлення, але `1e27780` став `1259362`, а `26f1118` — `460389d`. Злиття після rebase — fast-forward, без merge commit.
          en: |
            ```text
            Successfully rebased and updated refs/heads/feature/paused-mark.
            * 460389d (HEAD -> feature/paused-mark) Test the paused mark
            * 1259362 Mark paused habits in the label
            * ba15605 (main) Describe the habit fields
            * eab0f9f Explain how to run the tests
            * 3ab7a35 Add habit label with a test
            Switched to branch 'main'
            Updating ba15605..460389d
            Fast-forward
            ```

            Compare with the first copy: the same messages, but `1e27780` became `1259362` and `26f1118` became `460389d`. The merge after the rebase is a fast-forward, with no merge commit.
      - text:
          uk: |
            Запиши висновок. У `merge-copy` створи файл `NOTES.md` і трьома реченнями своїми словами поясни: коли ти зробиш merge, коли rebase власної гілки і чому спільні commits не переносять. Закоміть його:
          en: |
            Write down your conclusion. In `merge-copy` create the file `NOTES.md` and in three sentences of your own explain: when you would merge, when you would rebase your own branch, and why shared commits are never rebased. Commit it:
        command: "cd ~/js-course/merge-copy\ngit add NOTES.md\ngit commit -m \"Note when to merge and when to rebase\"\ngit log --oneline -1"
        expect:
          uk: "Рядок із новим id і повідомленням `Note when to merge and when to rebase`."
          en: "A line with a new id and the message `Note when to merge and when to rebase`."
    verify:
      - id: merge-kept-ids
        text:
          uk: "У `merge-copy` з’явився merge commit, а id commits гілки не змінилися."
          en: "In `merge-copy` a merge commit appeared, and the branch’s commit ids did not change."
      - id: rebase-new-ids
        text:
          uk: "У `rebase-copy` commits гілки отримали нові id, а злиття стало fast-forward."
          en: "In `rebase-copy` the branch’s commits got new ids, and the merge became a fast-forward."
      - id: notes-committed
        text:
          uk: "`NOTES.md` із трьома реченнями закомічено в `merge-copy`."
          en: "`NOTES.md` with three sentences is committed in `merge-copy`."
    troubleshooting:
      - problem:
          uk: "`merge: feature/paused-mark - not something we can merge`"
          en: "`merge: feature/paused-mark - not something we can merge`"
        fix:
          uk: "Гілки з такою назвою в цій копії немає. `git branch` покаже, які є; можливо, назву набрано з помилкою або попередній урок пройдено з іншою назвою гілки."
          en: "There is no branch with this name in this copy. `git branch` shows which exist; perhaps the name has a typo or the previous lesson used another branch name."
      - problem:
          uk: "Відкрився редактор із текстом `Merge branch 'feature/paused-mark'`"
          en: "An editor opened with the text `Merge branch 'feature/paused-mark'`"
        fix:
          uk: "Ти запустив `git merge` без `--no-edit`. Повідомлення вже готове: у Vim набери `:wq` і Enter, у nano — Ctrl + O, Enter, Ctrl + X. Merge завершиться."
          en: "You ran `git merge` without `--no-edit`. The message is already prepared: in Vim type `:wq` and Enter, in nano Ctrl + O, Enter, Ctrl + X. The merge completes."
      - problem:
          uk: "`CONFLICT (content)` під час merge або rebase"
          en: "`CONFLICT (content)` during the merge or the rebase"
        fix:
          uk: "Значить, у твоїй історії обидві гілки змінили той самий рядок коду (у сценарії уроку такого немає). Конфлікти — тема наступного уроку; зараз скасуй: `git merge --abort` або `git rebase --abort`, — і все повернеться до стану перед командою."
          en: "That means in your history both branches changed the same line (the lesson’s scenario has no such change). Conflicts are the next lesson; for now cancel with `git merge --abort` or `git rebase --abort` — everything returns to the state before the command."
    recovery:
      uk: "Обидві копії одноразові. Якщо в копії все заплуталося, видали саме цю копію (macOS/Linux: `rm -rf ~/js-course/rebase-copy`, Windows: `Remove-Item -Recurse -Force ~/js-course/rebase-copy`) — **перевір назву двічі**, щоб не видалити `git-lab`, — і скопіюй `git-lab` знову."
      en: "Both copies are disposable. If a copy got tangled, delete that copy only (macOS/Linux: `rm -rf ~/js-course/rebase-copy`, Windows: `Remove-Item -Recurse -Force ~/js-course/rebase-copy`) — **check the name twice** so you do not delete `git-lab` — and copy `git-lab` again."

  - id: to-project
    kind: transfer
    capstoneStep: JS-15
    body:
      uk: "У репозиторії проєкту ти працюватимеш гілками для кожної можливості. Поки гілка лише твоя, її можна переносити на свіжу `main`; щойно її побачив хтось інший — тільки merge."
      en: "In your project’s repository you will work in a branch for each feature. While a branch is only yours, you may rebase it onto a fresh `main`; once someone else has seen it — merge only."
