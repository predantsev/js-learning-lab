id: js-15-01-terminal-files-paths
unit: JS-15
title:
  uk: "Термінал: файли, теки та шляхи"
  en: "Terminal: files, folders and paths"
kind: local-task
minutes: 15
contentVersion: 1
purpose:
  uk: "Далі в курсі ти працюватимеш із власним проєктом на своєму комп’ютері, а не лише на платформі. Для цього треба впевнено знати, у якій ти теці і на який файл подіє команда. Це завдання виконується в терміналі; платформа його не бачить, тож результат підтверджуєш ти."
  en: "From here on you will work with your own project on your computer, not only in the platform. For that you need to know for sure which folder you are in and which file a command will act on. This task happens in a terminal; the platform cannot see it, so you confirm the result yourself."
objectives:
  - uk: "Відкрити термінал, надрукувати робочу теку й переходити між теками командою `cd` з абсолютними й відносними шляхами."
    en: "Open a terminal, print the working directory and move between folders with `cd` using absolute and relative paths."
  - uk: "Створити, переглянути, скопіювати й перейменувати файли в навчальній теці, передбачаючи перед кожною командою, де вона подіє."
    en: "Create, list, copy and rename files in a course scratch folder, predicting where each command acts before running it."
prerequisites: [js-09-09-capstone-tests, js-07-06-esm-import-export]
subskills:
  - { family: P-01, skill: "files/paths and shell navigation", depth: intro }
glossary: [terminal, shell, working-directory, absolute-path, relative-path]

blocks:
  - id: what-a-terminal-is
    kind: explanation
    title:
      uk: "Термінал — розмова з комп’ютером текстом"
      en: "A terminal is talking to the computer in text"
    body:
      uk: |
        Ти вже раз користувався терміналом: платформа запускається командою `npm start`. [[terminal|Термінал]] — це вікно, де ти пишеш команду, натискаєш Enter і читаєш відповідь. Команди всередині виконує [[shell]]: на macOS це zsh, на Linux часто bash, на Windows — PowerShell.

        Як відкрити:

        - **macOS:** Spotlight (Cmd + пробіл) → «Terminal».
        - **Windows:** меню «Пуск» → «Terminal» або «Windows PowerShell».
        - **Linux:** застосунок «Terminal» (у багатьох дистрибутивах — Ctrl + Alt + T).

        Перед курсором стоїть **запрошення** (prompt): кілька символів на кшталт `you@laptop ~ %` або `PS C:\Users\you>`. Набирай команду **після** нього, без самого запрошення. Якщо копіюєш команду з уроку — копіюй лише її.
      en: |
        You have already used a terminal once: the platform starts with the command `npm start`. A [[terminal]] is a window where you type a command, press Enter and read the answer. The commands inside it are run by a [[shell]]: zsh on macOS, often bash on Linux, PowerShell on Windows.

        How to open one:

        - **macOS:** Spotlight (Cmd + Space) → “Terminal”.
        - **Windows:** Start menu → “Terminal” or “Windows PowerShell”.
        - **Linux:** the “Terminal” app (Ctrl + Alt + T in many distributions).

        In front of the cursor there is a **prompt**: a few characters such as `you@laptop ~ %` or `PS C:\Users\you>`. Type your command **after** it, without the prompt itself. When you copy a command from a lesson, copy only the command.

  - id: where-you-are
    kind: explanation
    title:
      uk: "Ти завжди стоїш у якійсь теці"
      en: "You are always standing in some folder"
    body:
      uk: |
        Shell завжди «стоїть» у якійсь теці — це [[working-directory|робоча тека]]. Три команди, з яких починається будь-яка робота:

        | Команда | Що робить |
        |---|---|
        | `pwd` | друкує, де ти зараз (print working directory) |
        | `ls` | показує, що лежить у цій теці |
        | `cd назва` | переходить у теку |

        Шлях до файла пишуть двома способами:

        - [[absolute-path|Абсолютний]] — від кореня диска: `/Users/you/js-course/notes.txt` (на Windows `C:\Users\you\js-course\notes.txt`). Веде в те саме місце, хоч би де ти стояв. `~` — скорочення для твоєї домашньої теки.
        - [[relative-path|Відносний]] — від робочої теки: `notes.txt` — тут, `old/a.txt` — у підтеці `old`, `./` — ця сама тека, `../` — тека вище.

        Одна й та сама команда з відносним шляхом у різних теках діє на **різні** файли. Тому перед кожною командою, що щось змінює, спершу відповідай собі: де я?
      en: |
        A shell always “stands” in some folder — the [[working-directory|working directory]]. Three commands start any work:

        | Command | What it does |
        |---|---|
        | `pwd` | prints where you are (print working directory) |
        | `ls` | shows what is in this folder |
        | `cd name` | moves into a folder |

        A path to a file is written in two ways:

        - [[absolute-path|Absolute]] — from the root of the disk: `/Users/you/js-course/notes.txt` (on Windows `C:\Users\you\js-course\notes.txt`). It leads to the same place wherever you stand. `~` is short for your home folder.
        - [[relative-path|Relative]] — from the working directory: `notes.txt` is here, `old/a.txt` is in the subfolder `old`, `./` is this same folder, `../` is the folder above.

        The same command with a relative path acts on **different** files in different folders. So before every command that changes something, first answer for yourself: where am I?

  - id: path-steps
    kind: visual
    visual: diagram
    title:
      uk: "Робоча тека та шляхи в одному сеансі"
      en: "The working directory and paths in one session"
    textEquivalent:
      uk: >-
        Дерево тек: домашня тека ~ (/Users/you) містить js-course, у ній scratch, а в scratch лежать
        файл notes.txt і тека old з файлом backup.txt. Спершу pwd показує, що shell стоїть у ~.
        Після cd js-course/scratch робочою текою стає scratch, і cat notes.txt читає scratch/notes.txt.
        Після cd old робоча тека — old; ls ../ показує вміст теки на рівень вище, тобто scratch.
        Абсолютний шлях /Users/you/js-course/scratch/notes.txt веде до того самого файла незалежно
        від того, де стоїть shell.
      en: >-
        A folder tree: the home folder ~ (/Users/you) contains js-course, which contains scratch, and
        scratch holds the file notes.txt and the folder old with the file backup.txt. First pwd shows
        that the shell stands in ~. After cd js-course/scratch the working directory is scratch, and
        cat notes.txt reads scratch/notes.txt. After cd old the working directory is old; ls ../ shows
        the folder one level up, which is scratch. The absolute path
        /Users/you/js-course/scratch/notes.txt leads to the same file wherever the shell stands.
    spec:
      layout: tb
      nodes:
        - { id: home, label: "~ = /Users/you", w: 150 }
        - { id: course, label: "js-course/" }
        - { id: scratch, label: "scratch/" }
        - { id: notes, label: "notes.txt", shape: note }
        - { id: old, label: "old/" }
        - { id: backup, label: "backup.txt", shape: note }
      edges:
        - { from: home, to: course, kind: line }
        - { from: course, to: scratch, kind: line }
        - { from: scratch, to: notes, kind: line }
        - { from: scratch, to: old, kind: line }
        - { from: old, to: backup, kind: line }
      steps:
        - caption:
            uk: "Теки вкладені одна в одну, як на диску. Кожна тека знає лише свої файли й підтеки."
            en: "Folders are nested inside each other, as on the disk. Each folder knows only its own files and subfolders."
        - highlight: [home]
          annotate:
            - { id: home, text: { uk: "ти тут", en: "you are here" } }
          caption:
            uk: "Новий термінал зазвичай відкривається в домашній теці. `pwd` друкує `/Users/you`."
            en: "A new terminal usually opens in your home folder. `pwd` prints `/Users/you`."
        - highlight: [scratch, home->course, course->scratch]
          annotate:
            - { id: scratch, text: { uk: "ти тут", en: "you are here" } }
          caption:
            uk: "`cd js-course/scratch` — відносний шлях: від `~` униз у `js-course`, потім у `scratch`. Тепер робоча тека — `scratch`."
            en: "`cd js-course/scratch` is a relative path: from `~` down into `js-course`, then into `scratch`. The working directory is now `scratch`."
        - highlight: [scratch, notes, scratch->notes]
          caption:
            uk: "`cat notes.txt` шукає `notes.txt` **у робочій теці**, тобто читає `scratch/notes.txt`."
            en: "`cat notes.txt` looks for `notes.txt` **in the working directory**, so it reads `scratch/notes.txt`."
        - highlight: [old, scratch->old]
          annotate:
            - { id: old, text: { uk: "ти тут", en: "you are here" } }
          caption:
            uk: "`cd old` — на рівень нижче. Тепер `cat notes.txt` не знайде файл: у `old` його немає."
            en: "`cd old` goes one level down. Now `cat notes.txt` finds no file: there is none in `old`."
        - highlight: [scratch, scratch->old]
          annotate:
            - { id: old, text: { uk: "ти тут", en: "you are here" } }
            - { id: scratch, text: "../" }
          caption:
            uk: "`ls ../` з теки `old` показує теку на рівень **вище** — `scratch`: там `notes.txt` і `old`."
            en: "`ls ../` from the folder `old` shows the folder one level **up** — `scratch`: it holds `notes.txt` and `old`."
        - highlight: [home, course, scratch, notes, home->course, course->scratch, scratch->notes]
          annotate:
            - { id: old, text: { uk: "ти тут", en: "you are here" } }
          caption:
            uk: "`cat /Users/you/js-course/scratch/notes.txt` — абсолютний шлях: він іде від кореня й не залежить від того, що ти стоїш в `old`."
            en: "`cat /Users/you/js-course/scratch/notes.txt` is an absolute path: it starts at the root and does not depend on your standing in `old`."

  - id: recall-specifier
    kind: review
    title:
      uk: "Згадай: шляхи в import"
      en: "Recall: paths in import"
    items:
      - id: specifier-from-where
        from: js-07-06-esm-import-export
        prompt:
          uk: "У файлі `ui/list.js` написано `import { isDaily } from \"../domain/habits.js\";`. Від чого рахується шлях `../domain/habits.js`?"
          en: "The file `ui/list.js` contains `import { isDaily } from \"../domain/habits.js\";`. What is the path `../domain/habits.js` counted from?"
        answer:
          type: choice
          options:
            - id: importing-file
              text:
                uk: "Від теки, у якій лежить файл з цим `import`, тобто від `ui/`"
                en: "From the folder of the file that contains this `import`, that is from `ui/`"
            - id: page
              text:
                uk: "Від теки сторінки `index.html`"
                en: "From the folder of the page `index.html`"
              why:
                uk: "Сторінка лише підключає головний модуль. Кожен `import` рахує свій шлях від файла, де він написаний."
                en: "The page only loads the main module. Each `import` counts its path from the file it is written in."
            - id: root
              text:
                uk: "Від кореня проєкту"
                en: "From the root of the project"
              why:
                uk: "Від кореня рахувався б шлях, що починається зі `/`. Тут він починається з `../` — це відносний шлях."
                en: "A path starting with `/` would be counted from the root. This one starts with `../` — it is relative."
          correct: [importing-file]
        explanation:
          uk: "Відносний шлях в `import` рахується від теки файла з цим `import`: з `ui/` на рівень вище, потім у `domain/`. У терміналі той самий принцип, тільки точка відліку — робоча тека shell."
          en: "A relative path in `import` is counted from the folder of the file containing it: from `ui/` one level up, then into `domain/`. In a terminal the principle is the same, only the starting point is the shell’s working directory."

  - id: predict-ls-up
    kind: prediction
    prompt:
      uk: |
        Робоча тека — `/Users/you/js-course/scratch/old`. У `scratch` лежать `notes.txt` і тека `old`, а в `old` — лише `backup.txt`. Що надрукує команда `ls ../`?
      en: |
        The working directory is `/Users/you/js-course/scratch/old`. `scratch` holds `notes.txt` and the folder `old`, and `old` holds only `backup.txt`. What does the command `ls ../` print?
    answer:
      type: choice
      options:
        - id: parent
          text:
            uk: "`notes.txt` і `old`"
            en: "`notes.txt` and `old`"
        - id: here
          text:
            uk: "`backup.txt`"
            en: "`backup.txt`"
          why:
            uk: "Так надрукувала б `ls` без шляху або `ls ./`. `../` — це тека **над** робочою."
            en: "That is what `ls` with no path or `ls ./` would print. `../` is the folder **above** the working one."
        - id: home
          text:
            uk: "Вміст домашньої теки `~`"
            en: "The contents of the home folder `~`"
          why:
            uk: "`../` піднімається лише на **один** рівень. До `~` звідси — три рівні: `../../../`."
            en: "`../` goes up only **one** level. From here `~` is three levels up: `../../../`."
        - id: error
          text:
            uk: "Помилку: такої теки немає"
            en: "An error: there is no such folder"
          why:
            uk: "`../` є в кожній теці: це посилання на батьківську теку. Навіть у корені диска він не дає помилки, а веде назад у сам корінь."
            en: "Every folder has `../`: it refers to the parent folder. Even at the root of the disk it is not an error; it leads back to the root itself."
      correct: [parent]
    explanation:
      uk: "Відносний шлях рахується від робочої теки. `../` з `old` — це `scratch`, тож `ls ../` показує вміст `scratch`: файл `notes.txt` і теку `old`."
      en: "A relative path is counted from the working directory. `../` from `old` is `scratch`, so `ls ../` shows what is in `scratch`: the file `notes.txt` and the folder `old`."

  - id: first-session
    kind: local-task
    runtime: local-web
    title:
      uk: "Перший сеанс: навчальна тека, файли й шляхи"
      en: "First session: a scratch folder, files and paths"
    intro:
      uk: |
        Ти створиш теку курсу `js-course` у домашній теці, а в ній навчальну теку `scratch`. Усі наступні локальні завдання розділу живуть у `js-course`, тож нічого твого вони не зачеплять.

        **Перед кожною командою** скажи собі вголос, у якій ти теці і що вона змінить. Потім запускай і порівнюй з очікуваним результатом.

        Команди однакові на macOS, Linux і Windows PowerShell, якщо поруч не сказано інше. На Windows шляхи пишуться з `\` (`C:\Users\you\js-course`), а `ls` і `pwd` друкують таблицю з додатковими стовпчиками — дивись на назви, а не на оформлення. `you` у прикладах — це назва твого користувача.
      en: |
        You will create a course folder `js-course` in your home folder and a scratch folder `scratch` inside it. All the later local tasks of this unit live in `js-course`, so nothing of yours gets touched.

        **Before each command**, say to yourself which folder you are in and what it will change. Then run it and compare with the expected result.

        The commands are the same on macOS, Linux and Windows PowerShell unless a note says otherwise. On Windows paths are written with `\` (`C:\Users\you\js-course`), and `ls` and `pwd` print a table with extra columns — look at the names, not the layout. `you` in the examples is your user name.
    tools:
      - name: "A terminal"
        version: "zsh or bash (macOS, Linux) or PowerShell (Windows)"
        note:
          uk: "уже є в системі"
          en: "already part of your system"
    steps:
      - text:
          uk: "Відкрий новий термінал і подивись, де ти:"
          en: "Open a new terminal and see where you are:"
        command: "pwd"
        expect:
          uk: "Твоя домашня тека: `/Users/you` (macOS), `/home/you` (Linux) або таблиця з `Path` і `C:\\Users\\you` (Windows)."
          en: "Your home folder: `/Users/you` (macOS), `/home/you` (Linux) or a table with `Path` and `C:\\Users\\you` (Windows)."
      - text:
          uk: "Якщо `pwd` надрукував щось інше, перейди додому командою `cd ~`. Потім створи теку курсу й навчальну теку та перейди в неї:"
          en: "If `pwd` printed something else, go home with `cd ~`. Then create the course folder and the scratch folder and move into it:"
        command: "mkdir js-course\ncd js-course\nmkdir scratch\ncd scratch\npwd"
        expect:
          uk: "Останній рядок — `/Users/you/js-course/scratch` (на Linux `/home/you/…`, на Windows `C:\\Users\\you\\js-course\\scratch`)."
          en: "The last line is `/Users/you/js-course/scratch` (on Linux `/home/you/…`, on Windows `C:\\Users\\you\\js-course\\scratch`)."
      - text:
          uk: |
            Створи файл із текстом і подивись, що з’явилося. `>` записує те, що надрукувала команда ліворуч, у файл праворуч. **Увага:** якщо такий файл уже є, `>` замінює весь його вміст.
          en: |
            Create a file with some text and look at what appeared. `>` writes what the command on its left prints into the file on its right. **Careful:** if such a file already exists, `>` replaces all of its contents.
        command: "echo \"buy milk\" > notes.txt\nls\ncat notes.txt"
        expect:
          uk: "`ls` друкує `notes.txt`, `cat` — `buy milk`."
          en: "`ls` prints `notes.txt`, `cat` prints `buy milk`."
      - text:
          uk: |
            Передбач, що надрукує останній `ls`, і тільки потім запусти. `cp` копіює, `mv` перейменовує або переносить. Скісна риска в `old/` означає «у теку `old`»: якщо такої теки немає, `mv` повідомить про помилку замість того, щоб перейменувати файл на `old`.
          en: |
            Predict what the last `ls` prints, and only then run it. `cp` copies, `mv` renames or moves. The slash in `old/` means “into the folder `old`”: if there is no such folder, `mv` reports an error instead of renaming the file to `old`.
        command: "cp notes.txt notes-copy.txt\nmv notes-copy.txt backup.txt\nmkdir old\nmv backup.txt old/\nls"
        expect:
          uk: "`notes.txt` і `old` (можливо, в одному рядку виводу через пробіл). Файлу `backup.txt` тут уже немає — він в `old`."
          en: "`notes.txt` and `old` (possibly on one line, separated by spaces). The file `backup.txt` is no longer here — it is in `old`."
      - text:
          uk: "Перейди в `old`, подивись на теку вище, потім вийди на два рівні вгору:"
          en: "Go into `old`, look at the folder above, then go up two levels:"
        command: "cd old\nls\nls ../\ncd ../..\npwd\nls scratch/old"
        expect:
          uk: |
            По черзі: `backup.txt`; `notes.txt` і `old`; потім `pwd` друкує `/Users/you/js-course`, а `ls scratch/old` — `backup.txt`.
          en: |
            In order: `backup.txt`; `notes.txt` and `old`; then `pwd` prints `/Users/you/js-course`, and `ls scratch/old` prints `backup.txt`.
      - text:
          uk: "Прочитай файл абсолютним шляхом — він спрацює з будь-якої теки. Заміни `/Users/you` на те, що надрукував перший `pwd` (на Windows: `cat C:\\Users\\you\\js-course\\scratch\\notes.txt`)."
          en: "Read the file through an absolute path — it works from any folder. Replace `/Users/you` with what the first `pwd` printed (on Windows: `cat C:\\Users\\you\\js-course\\scratch\\notes.txt`)."
        command: "cat /Users/you/js-course/scratch/notes.txt"
        expect:
          uk: "`buy milk`"
          en: "`buy milk`"
    verify:
      - id: final-pwd
        text:
          uk: "Останній `pwd` надрукував шлях, що закінчується на `js-course`."
          en: "The last `pwd` printed a path that ends with `js-course`."
      - id: final-ls
        text:
          uk: "`ls scratch/old` показав `backup.txt`, а в `scratch` лишилися `notes.txt` і `old`."
          en: "`ls scratch/old` showed `backup.txt`, and `scratch` still holds `notes.txt` and `old`."
      - id: predicted-first
        text:
          uk: "Перед командами `ls` я спершу передбачав результат, а потім порівнював."
          en: "Before the `ls` commands I first predicted the result and then compared."
    troubleshooting:
      - problem:
          uk: "`mkdir: js-course: File exists` або `An item with the specified name … already exists`"
          en: "`mkdir: js-course: File exists` or `An item with the specified name … already exists`"
        fix:
          uk: "Тека вже є (наприклад, ти починав раніше). Нічого не видаляй: просто перейди в неї через `cd js-course` і продовжуй з наступного кроку."
          en: "The folder already exists (for example, you started before). Delete nothing: just move into it with `cd js-course` and continue with the next step."
      - problem:
          uk: "`cd: no such file or directory` або `Cannot find path … because it does not exist`"
          en: "`cd: no such file or directory` or `Cannot find path … because it does not exist`"
        fix:
          uk: "У робочій теці немає такої теки. Виконай `pwd` і `ls`: ти, найімовірніше, стоїш не там, де думаєш, або назва написана з помилкою (на Linux великі й малі літери в назвах різняться)."
          en: "There is no such folder in the working directory. Run `pwd` and `ls`: most likely you are not where you think, or the name has a typo (on Linux upper and lower case letters differ in names)."
      - problem:
          uk: "`mv: rename backup.txt to old/: No such file or directory`"
          en: "`mv: rename backup.txt to old/: No such file or directory`"
        fix:
          uk: "Теки `old` ще немає — саме від цього захищає скісна риска в `old/`. Створи її (`mkdir old`) і повтори `mv`."
          en: "The folder `old` does not exist yet — that is exactly what the slash in `old/` protects you from. Create it (`mkdir old`) and repeat the `mv`."
      - problem:
          uk: "Термінал нічого не відповідає, а курсор стоїть у новому рядку терміналу після `>` або `\"`"
          en: "The terminal does not answer, and the cursor sits on a new line after `>` or `\"`"
        fix:
          uk: "Shell чекає, доки ти закриєш лапки. Натисни Ctrl + C — це скасує недописану команду — і набери її заново з парними лапками."
          en: "The shell is waiting for you to close the quotes. Press Ctrl + C — it cancels the unfinished command — and type it again with matching quotes."
    recovery:
      uk: "Усе відбувається в `js-course/scratch`, тож нічого важливого зламати не можна. Якщо заплутався, виконай `cd ~`, потім `cd js-course/scratch` — і ти знову на початку. Відсутні файли просто створи ще раз командами з кроків 3–4."
      en: "Everything happens in `js-course/scratch`, so nothing important can break. If you get lost, run `cd ~`, then `cd js-course/scratch` — and you are back at the start. Create missing files again with the commands of steps 3–4."

  - id: to-project
    kind: transfer
    capstoneStep: JS-15
    body:
      uk: "Наприкінці розділу ти створиш поруч зі `scratch` теку свого проєкту. Ті самі `pwd`, `ls` і `cd` знадобляться, щоб завжди точно знати, в якій теці ти запускаєш команди проєкту."
      en: "At the end of the unit you will create your project’s folder next to `scratch`. The same `pwd`, `ls` and `cd` will tell you exactly which folder you run the project’s commands in."
