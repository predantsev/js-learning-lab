id: js-15-08-branches-history
unit: JS-15
title:
  uk: "Гілки та історія"
  en: "Branches and history"
kind: local-task
minutes: 12
contentVersion: 1
purpose:
  uk: "Гілки дозволяють працювати над кількома змінами окремо й не ламати основну версію, поки зміна не готова. Ти створиш гілку в навчальному репозиторії, зробиш commits у двох гілках і навчишся читати їхню історію в терміналі."
  en: "Branches let you work on several changes separately without breaking the main version until a change is ready. You will create a branch in the practice repository, make commits on two branches and learn to read their history in the terminal."
objectives:
  - uk: "Створювати гілки й перемикатися між ними, робити commits у кожній і за `git log --oneline --graph --all` казати, які commits містить кожна гілка."
    en: "Create and switch branches, commit on each, and read git log --oneline --graph --all to say which commits each branch contains."
  - uk: "Пояснити, що гілка — це рухома назва для commit, а HEAD позначає ту, на якій ти зараз."
    en: "Explain that a branch is a movable name for a commit and that HEAD marks the one you are on."
prerequisites: [js-15-07-git-first-commit]
subskills:
  - { family: P-02, skill: "branch/history", depth: intro }
glossary: [git-branch, head, commit-history]

blocks:
  - id: branch-is-a-name
    kind: explanation
    title:
      uk: "Гілка — це назва, що вказує на commit"
      en: "A branch is a name that points at a commit"
    body:
      uk: |
        Кожен commit пам’ятає свого батька — попередній commit. Так виходить ланцюжок, [[commit-history|історія commits]].

        [[git-branch|Гілка]] — не копія файлів, а **назва, що вказує на один commit**. `main` вказує на останній commit основної лінії. Коли ти робиш новий commit, назва поточної гілки пересувається на нього; інші назви стоять, де стояли.

        [[head|HEAD]] — позначка «ти тут». Зазвичай вона вказує на гілку: `HEAD -> main`.

        | Команда | Що робить |
        |---|---|
        | `git switch -c назва` | створює гілку на поточному commit і переходить на неї |
        | `git switch назва` | переходить на наявну гілку й **змінює файли** робочого дерева під її commit |
        | `git branch` | список гілок; `*` — поточна |
        | `git log --oneline --graph --all` | історія всіх гілок малюнком |

        Гілка «містить» commit, якщо до нього можна дійти від її commit назад, по батьках.
      en: |
        Every commit remembers its parent — the previous commit. That makes a chain, the [[commit-history|commit history]].

        A [[git-branch|branch]] is not a copy of files but **a name that points at one commit**. `main` points at the latest commit of the main line. When you make a new commit, the current branch’s name moves onto it; the other names stay where they were.

        [[head|HEAD]] is the “you are here” marker. Usually it points at a branch: `HEAD -> main`.

        | Command | What it does |
        |---|---|
        | `git switch -c name` | creates a branch at the current commit and moves onto it |
        | `git switch name` | moves onto an existing branch and **changes the working-tree files** to match its commit |
        | `git branch` | lists the branches; `*` marks the current one |
        | `git log --oneline --graph --all` | draws the history of all branches |

        A branch “contains” a commit if you can reach that commit from the branch’s commit by walking back through parents.

  - id: recall-const-name
    kind: review
    title:
      uk: "Згадай: назва, що вказує на значення"
      en: "Recall: a name that points at a value"
    items:
      - id: name-points
        from: js-02-01-const-let
        prompt:
          uk: |
            ```js
            const wish = { name: "Навушники", price: 80 };
            const sameWish = wish;
            sameWish.price = 70;
            console.log(wish.price);
            ```

            Що надрукує цей код?
          en: |
            ```js
            const wish = { name: "Headphones", price: 80 };
            const sameWish = wish;
            sameWish.price = 70;
            console.log(wish.price);
            ```

            What does this code print?
        answer:
          type: choice
          options:
            - id: seventy
              code: "70"
            - id: eighty
              code: "80"
              why:
                uk: "`const sameWish = wish` не копіює запис — друга назва вказує на **той самий** запис. Змінив через одну назву — видно через іншу."
                en: "`const sameWish = wish` does not copy the record — the second name points at **the same** record. Change it through one name and it shows through the other."
          correct: [seventy]
        explanation:
          uk: "Обидві назви вказують на один запис, тому зміна видна через будь-яку. Гілки Git схожі: дві гілки можуть вказувати на той самий commit, і жодна з них не є «копією» — це лише назви."
          en: "Both names point at one record, so the change shows through either. Git branches are similar: two branches can point at the same commit, and neither is a “copy” — they are only names."

  - id: branches-move
    kind: visual
    visual: git-graph
    title:
      uk: "Дві гілки, що розходяться"
      en: "Two branches that diverge"
    textEquivalent:
      uk: >-
        Історія починається з двох commits на main. git switch -c feature/paused-mark створює нову
        назву на тому самому commit і перемикає HEAD на неї. Два commits на новій гілці пересувають
        лише її назву, main стоїть на місці. git switch main повертає HEAD на main і повертає файли до
        стану її commit. Ще один commit на main пересуває вже main. Гілки розійшлися: в кожної є
        commits, яких немає в іншої, а спільна частина — перші два commits.
      en: >-
        The history starts with two commits on main. git switch -c feature/paused-mark creates a new
        name on the same commit and moves HEAD onto it. Two commits on the new branch move only its
        name, main stays put. git switch main moves HEAD back to main and returns the files to that
        commit’s state. One more commit on main moves main this time. The branches have diverged: each
        has commits the other lacks, and the shared part is the first two commits.
    spec:
      steps:
        - op: init
          caption:
            uk: "Репозиторій `git-lab` з попереднього уроку."
            en: "The `git-lab` repository from the previous lesson."
        - op: commit
          message: "Add habit label with a test"
          files: [README.md, label.mjs, label.test.mjs, package.json]
          caption:
            uk: "Перший commit."
            en: "The first commit."
        - op: commit
          message: "Explain how to run the tests"
          files: [README.md]
          caption:
            uk: "Другий commit. `main` вказує на `c2`, `HEAD` — на `main`."
            en: "The second commit. `main` points at `c2`, `HEAD` at `main`."
        - op: branch
          name: feature/paused-mark
          caption:
            uk: "`git switch -c feature/paused-mark`: нова назва на **тому самому** `c2`, і `HEAD` тепер на ній. Жоден файл не скопійовано."
            en: "`git switch -c feature/paused-mark`: a new name on **the same** `c2`, and `HEAD` is on it now. No file was copied."
        - op: commit
          message: "Mark paused habits in the label"
          files: [label.mjs]
          caption:
            uk: "Commit `c3` на гілці: пересунулась лише `feature/paused-mark`. `main` досі на `c2`."
            en: "Commit `c3` on the branch: only `feature/paused-mark` moved. `main` is still on `c2`."
        - op: commit
          message: "Test the paused mark"
          files: [label.test.mjs]
          caption:
            uk: "Ще один commit, `c4`. Гілка `feature/paused-mark` містить `c1`–`c4`, а `main` — лише `c1` і `c2`."
            en: "One more commit, `c4`. The branch `feature/paused-mark` contains `c1`–`c4`, while `main` contains only `c1` and `c2`."
        - op: checkout
          name: main
          caption:
            uk: "`git switch main`: `HEAD` повертається на `main`, і файли робочого дерева стають такими, як у `c2`, — позначки paused у `label.mjs` немає."
            en: "`git switch main`: `HEAD` returns to `main`, and the working-tree files become as in `c2` — `label.mjs` has no paused mark."
        - op: commit
          message: "Describe the habit fields"
          files: [README.md]
          caption:
            uk: "Commit `c5` на `main`. Тепер гілки **розійшлися**: в `main` є `c5`, у `feature/paused-mark` — `c3` і `c4`; спільні — `c1` і `c2`."
            en: "Commit `c5` on `main`. Now the branches have **diverged**: `main` has `c5`, `feature/paused-mark` has `c3` and `c4`; `c1` and `c2` are shared."

  - id: predict-main-contains
    kind: prediction
    prompt:
      uk: |
        Після двох commits на гілці `feature/paused-mark` і одного на `main` команда `git log --oneline --graph --all` показує:

        ```text
        * ba15605 (HEAD -> main) Describe the habit fields
        | * 26f1118 (feature/paused-mark) Test the paused mark
        | * 1e27780 Mark paused habits in the label
        |/
        * eab0f9f Explain how to run the tests
        * 3ab7a35 Add habit label with a test
        ```

        Які commits містить гілка `main`? Обери всі.
      en: |
        After two commits on the branch `feature/paused-mark` and one on `main`, `git log --oneline --graph --all` shows:

        ```text
        * ba15605 (HEAD -> main) Describe the habit fields
        | * 26f1118 (feature/paused-mark) Test the paused mark
        | * 1e27780 Mark paused habits in the label
        |/
        * eab0f9f Explain how to run the tests
        * 3ab7a35 Add habit label with a test
        ```

        Which commits does the branch `main` contain? Pick all of them.
    answer:
      type: multi
      options:
        - id: describe
          code: "ba15605 Describe the habit fields"
        - id: test-paused
          code: "26f1118 Test the paused mark"
          why:
            uk: "Від `ba15605` назад по батьках не дійти до `26f1118`: він на іншій лінії малюнка, праворуч."
            en: "Walking back through parents from `ba15605` never reaches `26f1118`: it sits on the other line of the drawing, on the right."
        - id: mark-paused
          code: "1e27780 Mark paused habits in the label"
          why:
            uk: "Цей commit зроблено на `feature/paused-mark`. У `main` він потрапить лише після [[merge-commit|злиття]] гілок — про це наступний урок."
            en: "This commit was made on `feature/paused-mark`. It gets into `main` only after the branches are [[merge-commit|merged]] — the next lesson covers that."
        - id: explain
          code: "eab0f9f Explain how to run the tests"
        - id: add-label
          code: "3ab7a35 Add habit label with a test"
      correct: [describe, explain, add-label]
    explanation:
      uk: "Іди від назви `main` (`ba15605`) униз по лінії: `ba15605` → `eab0f9f` → `3ab7a35`. Лінія праворуч із `|` — інша гілка; `|/` показує, де вона відійшла від спільної частини."
      en: "Walk from the name `main` (`ba15605`) down the line: `ba15605` → `eab0f9f` → `3ab7a35`. The line on the right with `|` is the other branch; `|/` shows where it split off from the shared part."

  - id: predict-switch-files
    kind: prediction
    prompt:
      uk: "Ти на `feature/paused-mark`, де `label.mjs` уже додає позначку `[paused]`, і все закомічено. Ти виконуєш `git switch main`. Що тепер у файлі `label.mjs` у теці?"
      en: "You are on `feature/paused-mark`, where `label.mjs` already adds the `[paused]` mark, and everything is committed. You run `git switch main`. What is in the file `label.mjs` in the folder now?"
    answer:
      type: choice
      options:
        - id: old-version
          text:
            uk: "Версія з `main` — без позначки `[paused]`"
            en: "The version from `main` — without the `[paused]` mark"
        - id: same-file
          text:
            uk: "Той самий файл з позначкою: перемикання гілки файлів не чіпає"
            en: "The same file with the mark: switching branches does not touch files"
          why:
            uk: "`git switch` якраз і переписує файли робочого дерева під commit гілки. Твоя зміна не зникла — вона в commit гілки й повернеться, щойно ти перейдеш назад."
            en: "`git switch` does exactly that: it rewrites the working-tree files to match the branch’s commit. Your change is not lost — it is in the branch’s commit and comes back as soon as you switch back."
        - id: both-versions
          text:
            uk: "Два файли: `label.mjs` з `main` і копія з гілки"
            en: "Two files: `label.mjs` from `main` and a copy from the branch"
          why:
            uk: "Гілки не зберігають окремих копій у теці. У теці завжди одна версія — та, на яку вказує `HEAD`."
            en: "Branches keep no separate copies in the folder. The folder always holds one version — the one `HEAD` points at."
      correct: [old-version]
    explanation:
      uk: "Робоче дерево показує commit, на який вказує `HEAD`. Перемкнувся на `main` — бачиш файли `main`; повернувся на гілку — бачиш свою зміну. Тому перед `git switch` перевір `git status`: незакомічені зміни краще спершу зберегти commit."
      en: "The working tree shows the commit `HEAD` points at. Switch to `main` and you see `main`’s files; switch back to the branch and you see your change. So check `git status` before `git switch`: uncommitted changes are better saved in a commit first."

  - id: branch-lab
    kind: local-task
    runtime: local-web
    title:
      uk: "Гілка, два commits і читання графа"
      en: "A branch, two commits and reading the graph"
    intro:
      uk: |
        Працюєш у `~/js-course/git-lab` після попереднього уроку: два commits на `main`, робоче дерево чисте (`git status` — `nothing to commit, working tree clean`). Id commits у тебе інші — порівнюй повідомлення й форму графа. Команди однакові на macOS, Linux і Windows PowerShell.
      en: |
        You work in `~/js-course/git-lab` after the previous lesson: two commits on `main`, a clean working tree (`git status` says `nothing to commit, working tree clean`). Your commit ids differ — compare the messages and the shape of the graph. The commands are the same on macOS, Linux and Windows PowerShell.
    tools:
      - name: "Git"
        version: "2.28 or newer (checked with 2.51)"
      - name: "Node.js"
        version: "22.13 or newer"
      - name: "A code editor"
        version: "VS Code or any plain-text editor"
    steps:
      - text:
          uk: "Створи гілку для нової можливості й перевір, де ти:"
          en: "Create a branch for a new feature and check where you are:"
        command: "cd ~/js-course/git-lab\ngit switch -c feature/paused-mark\ngit branch"
        expect:
          uk: |
            ```text
            Switched to a new branch 'feature/paused-mark'
            * feature/paused-mark
              main
            ```
          en: |
            ```text
            Switched to a new branch 'feature/paused-mark'
            * feature/paused-mark
              main
            ```
      - text:
          uk: |
            Заміни вміст `label.mjs`:

            ```js
            // label.mjs: how one habit is shown in the list.
            export function habitLabel(habit) {
              const mark = habit.active ? "" : " [paused]";
              return `${habit.name} (${habit.frequency})${mark}`;
            }
            ```

            Збережи й закоміть лише цей файл:
          en: |
            Replace the contents of `label.mjs`:

            ```js
            // label.mjs: how one habit is shown in the list.
            export function habitLabel(habit) {
              const mark = habit.active ? "" : " [paused]";
              return `${habit.name} (${habit.frequency})${mark}`;
            }
            ```

            Save and commit only this file:
        command: "git add label.mjs\ngit commit -m \"Mark paused habits in the label\""
        expect:
          uk: "`[feature/paused-mark 1e27780] Mark paused habits in the label` і `1 file changed, 2 insertions(+), 1 deletion(-)`."
          en: "`[feature/paused-mark 1e27780] Mark paused habits in the label` and `1 file changed, 2 insertions(+), 1 deletion(-)`."
      - text:
          uk: |
            Додай у кінець `label.test.mjs` ще один тест:

            ```js

            test("marks a paused habit", () => {
              const habit = { name: "Tidy up", frequency: "weekly", active: false };
              assert.equal(habitLabel(habit), "Tidy up (weekly) [paused]");
            });
            ```

            Перевір і закоміть:
          en: |
            Add one more test to the end of `label.test.mjs`:

            ```js

            test("marks a paused habit", () => {
              const habit = { name: "Tidy up", frequency: "weekly", active: false };
              assert.equal(habitLabel(habit), "Tidy up (weekly) [paused]");
            });
            ```

            Check and commit:
        command: "npm test\ngit add label.test.mjs\ngit commit -m \"Test the paused mark\""
        expect:
          uk: "`ℹ pass 2`, `ℹ fail 0`, потім `[feature/paused-mark 26f1118] Test the paused mark`."
          en: "`ℹ pass 2`, `ℹ fail 0`, then `[feature/paused-mark 26f1118] Test the paused mark`."
      - text:
          uk: "Перейди на `main` і подивись на `label.mjs` — спершу передбач, що там буде:"
          en: "Switch to `main` and look at `label.mjs` — predict first what it contains:"
        command: "git switch main\ncat label.mjs"
        expect:
          uk: |
            ```text
            Switched to branch 'main'
            // label.mjs: how one habit is shown in the list.
            export function habitLabel(habit) {
              return `${habit.name} (${habit.frequency})`;
            }
            ```
          en: |
            ```text
            Switched to branch 'main'
            // label.mjs: how one habit is shown in the list.
            export function habitLabel(habit) {
              return `${habit.name} (${habit.frequency})`;
            }
            ```
      - text:
          uk: |
            На `main` допиши в кінець `README.md` порожній рядок і рядок `Habits have a name, a frequency (daily or weekly) and an active flag.` Закоміть:
          en: |
            On `main`, add an empty line and the line `Habits have a name, a frequency (daily or weekly) and an active flag.` to the end of `README.md`. Commit:
        command: "git add README.md\ngit commit -m \"Describe the habit fields\""
        expect:
          uk: "`[main ba15605] Describe the habit fields`, `1 file changed, 2 insertions(+)`."
          en: "`[main ba15605] Describe the habit fields`, `1 file changed, 2 insertions(+)`."
      - text:
          uk: "Намалюй історію всіх гілок і виведи commits, які є лише в гілці:"
          en: "Draw the history of all branches and list the commits that exist only on the branch:"
        command: "git log --oneline --graph --all\ngit log --oneline main..feature/paused-mark"
        expect:
          uk: |
            ```text
            * ba15605 (HEAD -> main) Describe the habit fields
            | * 26f1118 (feature/paused-mark) Test the paused mark
            | * 1e27780 Mark paused habits in the label
            |/
            * eab0f9f Explain how to run the tests
            * 3ab7a35 Add habit label with a test
            26f1118 (feature/paused-mark) Test the paused mark
            1e27780 Mark paused habits in the label
            ```

            `main..feature/paused-mark` означає «що є в `feature/paused-mark`, але немає в `main`».
          en: |
            ```text
            * ba15605 (HEAD -> main) Describe the habit fields
            | * 26f1118 (feature/paused-mark) Test the paused mark
            | * 1e27780 Mark paused habits in the label
            |/
            * eab0f9f Explain how to run the tests
            * 3ab7a35 Add habit label with a test
            26f1118 (feature/paused-mark) Test the paused mark
            1e27780 Mark paused habits in the label
            ```

            `main..feature/paused-mark` means “what is on `feature/paused-mark` but not on `main`”.
    verify:
      - id: branch-commits
        text:
          uk: "На `feature/paused-mark` два commits, і `npm test` там показав `ℹ pass 2`."
          en: "`feature/paused-mark` has two commits, and `npm test` there showed `ℹ pass 2`."
      - id: switch-changed-file
        text:
          uk: "Після `git switch main` файл `label.mjs` був без позначки `[paused]`."
          en: "After `git switch main`, `label.mjs` had no `[paused]` mark."
      - id: graph-read
        text:
          uk: "Граф показує дві лінії, що відходять від спільного commit, і я можу назвати, які commits містить кожна гілка."
          en: "The graph shows two lines that split from a shared commit, and I can name the commits each branch contains."
    troubleshooting:
      - problem:
          uk: "`error: Your local changes to the following files would be overwritten by checkout`"
          en: "`error: Your local changes to the following files would be overwritten by checkout`"
        fix:
          uk: "У тебе є незакомічені зміни, і `git switch` відмовився їх затерти. Виконай `git status`: якщо зміна потрібна — `git add` і `git commit` на поточній гілці; потім перемикайся."
          en: "You have uncommitted changes, and `git switch` refused to overwrite them. Run `git status`: if you need the change, `git add` and `git commit` it on the current branch; then switch."
      - problem:
          uk: "`fatal: a branch named 'feature/paused-mark' already exists`"
          en: "`fatal: a branch named 'feature/paused-mark' already exists`"
        fix:
          uk: "Гілку вже створено раніше. Просто перейди на неї: `git switch feature/paused-mark` (без `-c`)."
          en: "The branch was created earlier. Just move onto it: `git switch feature/paused-mark` (without `-c`)."
      - problem:
          uk: "Commit «Mark paused habits…» опинився на `main`"
          en: "The commit “Mark paused habits…” ended up on `main`"
        fix:
          uk: "Ти закомітив до `git switch -c`. Нічого не видаляй: створи гілку тут (`git switch -c feature/paused-mark`) і продовжуй — граф буде іншої форми, але наступні уроки ти зможеш пройти, звіряючи повідомлення. Якщо хочеш точну форму, почни урок у свіжій копії репозиторію."
          en: "You committed before `git switch -c`. Delete nothing: create the branch here (`git switch -c feature/paused-mark`) and carry on — the graph will have another shape, but you can follow the next lessons by matching the messages. If you want the exact shape, start the lesson in a fresh copy of the repository."
      - problem:
          uk: "Граф без назв гілок у дужках"
          en: "The graph has no branch names in brackets"
        fix:
          uk: "Деякі налаштування Git показують назви лише в терміналі, а не коли вивід кудись перенаправлено. Додай `--decorate`: `git log --oneline --graph --all --decorate`."
          en: "Some Git settings show the names only in a terminal, not when the output is redirected. Add `--decorate`: `git log --oneline --graph --all --decorate`."
    recovery:
      uk: "Commits не зникають від перемикання гілок. Якщо загубився, виконай `git log --oneline --graph --all`: він покаже всі гілки, а `git switch назва` поверне тебе на потрібну. Незакомічені зміни перед перемиканням бачить `git status`."
      en: "Commits do not disappear when you switch branches. If you get lost, run `git log --oneline --graph --all`: it shows all branches, and `git switch name` takes you back to the one you need. `git status` shows uncommitted changes before you switch."

  - id: to-project
    kind: transfer
    capstoneStep: JS-15
    body:
      uk: "Коли проєкт переїде у власний репозиторій, кожна нова можливість — фільтр, сортування, нове поле запису — отримає свою гілку, а `main` лишатиметься робочою версією."
      en: "Once your project lives in its own repository, every new feature — a filter, a sort order, a new record field — gets its own branch, while `main` stays the working version."
