    tools:
      - name: "Node.js and npm"
        version: "Node.js 22.13 or newer (checked with Node.js 25.2 and npm 11.6)"
      - name: "Git"
        version: "2.28 or newer"
      - name: "A code editor"
        version: "VS Code or any plain-text editor"
    steps:
      - text:
          uk: |
            Створи теку `~/js-course/broken-lab` і в ній вісім файлів із вступу до завдання (позначки «Крок 1»): `package.json`, `package-lock.json`, `app.js`, `summary.js`, `summary.test.js`, `README.md`, `.env.example` і `.gitignore`. Збережи все й закоміть початковий стан:
          en: |
            Create the folder `~/js-course/broken-lab` with the eight files from the task introduction (marked “Step 1”) in it: `package.json`, `package-lock.json`, `app.js`, `summary.js`, `summary.test.js`, `README.md`, `.env.example` and `.gitignore`. Save everything and commit the starting state:
        command: "cd ~/js-course/broken-lab\ngit init -b main\ngit add .\ngit commit -m \"Start from the broken setup\""
        expect:
          uk: "`[main (root-commit) …] Start from the broken setup` і `8 files changed`."
          en: "`[main (root-commit) …] Start from the broken setup` and `8 files changed`."
      - text:
          uk: "**Запиши**, нічого не змінюючи, що кажуть три команди. Не лагодь поки нічого — лише читай, хто скаржиться й на що."
          en: "**Write down**, changing nothing, what three commands say. Do not repair anything yet — just read who is complaining and about what."
        command: "npm ci\nnpm start\nnpm test"
        expect:
          uk: |
            ```text
            npm error code ETARGET
            npm error notarget No matching version found for semver@^8.0.0.
            …
            npm error Missing script: "start"
            …
            ✔ counts and sums only the wanted wishes
            ℹ pass 1
            ℹ fail 0
            ```

            Тести проходять — отже, логіка програми ціла, а проблеми в налаштуваннях проєкту.
          en: |
            ```text
            npm error code ETARGET
            npm error notarget No matching version found for semver@^8.0.0.
            …
            npm error Missing script: "start"
            …
            ✔ counts and sums only the wanted wishes
            ℹ pass 1
            ℹ fail 0
            ```

            The tests pass — so the program’s logic is intact, and the problems are in the project’s setup.
      - text:
          uk: |
            **Діапазон.** Версії 8 у `semver` немає, а README вимагає «7.5.2 або новішу». Встанови правильний діапазон і знову спробуй чисте встановлення:
          en: |
            **The range.** `semver` has no version 8, and the README requires “7.5.2 or newer”. Set the right range and try the clean install again:
        command: "npm pkg set \"dependencies.semver=^7.5.2\"\nnpm ci"
        expect:
          uk: |
            Нова помилка — і це прогрес:

            ```text
            npm error code EUSAGE
            npm error
            npm error `npm ci` can only install packages when your package.json and package-lock.json or npm-shrinkwrap.json are in sync. Please update your lock file with `npm install` before continuing.
            npm error
            npm error Invalid: lock file's semver@7.5.1 does not satisfy semver@7.8.5
            ```

            Lockfile досі пам’ятає вразливу 7.5.1, яка новому діапазону `^7.5.2` не відповідає. Версія праворуч у повідомленні — найновіша 7.x на момент запуску, у тебе вона може бути новішою (так пишуть і npm 10.9, і npm 11.6).
          en: |
            A new error — and that is progress:

            ```text
            npm error code EUSAGE
            npm error
            npm error `npm ci` can only install packages when your package.json and package-lock.json or npm-shrinkwrap.json are in sync. Please update your lock file with `npm install` before continuing.
            npm error
            npm error Invalid: lock file's semver@7.5.1 does not satisfy semver@7.8.5
            ```

            The lockfile still remembers the vulnerable 7.5.1, which does not match the new range `^7.5.2`. The version on the right of the message is the newest 7.x at the time of the run; yours may be newer (both npm 10.9 and npm 11.6 print it this way).
      - text:
          uk: "**Lockfile.** Онови його так, як радить повідомлення, і перевір, що чисте встановлення й audit тепер проходять:"
          en: "**The lockfile.** Update it as the message suggests, and check that the clean install and the audit now pass:"
        command: "npm install\ngit diff --stat\nnpm ci\nnpm audit"
        expect:
          uk: |
            ```text
            added 1 package, and audited 2 packages in 500ms

            found 0 vulnerabilities
             package-lock.json | 29 ++++-------------------------
             package.json      |  2 +-
             2 files changed, 5 insertions(+), 26 deletions(-)
            ```

            Lockfile втратив дві транзитивні залежності старої версії. `npm ci` — `added 1 package`, `npm audit` — `found 0 vulnerabilities`.
          en: |
            ```text
            added 1 package, and audited 2 packages in 500ms

            found 0 vulnerabilities
             package-lock.json | 29 ++++-------------------------
             package.json      |  2 +-
             2 files changed, 5 insertions(+), 26 deletions(-)
            ```

            The lockfile lost the two transitive dependencies of the old version. `npm ci` — `added 1 package`, `npm audit` — `found 0 vulnerabilities`.
      - text:
          uk: |
            **Script.** `npm run` покаже, що script називається `strat`. Перейменуй його й запусти:
          en: |
            **The script.** `npm run` shows that the script is called `strat`. Rename it and start:
        command: "npm pkg delete scripts.strat\nnpm pkg set \"scripts.start=node --env-file-if-exists=.env app.js\"\nnpm start"
        expect:
          uk: |
            Тепер скаржиться вже твоя програма:

            ```text
            > broken-lab@1.0.0 start
            > node --env-file-if-exists=.env app.js

            .env not found. Continuing without it.
            …
            Error: CURRENCY is not set: copy .env.example to .env
            ```
          en: |
            Now it is your own program complaining:

            ```text
            > broken-lab@1.0.0 start
            > node --env-file-if-exists=.env app.js

            .env not found. Continuing without it.
            …
            Error: CURRENCY is not set: copy .env.example to .env
            ```
      - text:
          uk: |
            **Env.** Створи `.env` з прикладу (на Windows: `Copy-Item .env.example .env`):
          en: |
            **Env.** Create `.env` from the example (on Windows: `Copy-Item .env.example .env`):
        command: "cp .env.example .env"
        expect:
          uk: "Нічого не друкує. Виконай цю команду лише один раз: якщо `.env` уже є, `cp` мовчки замінить його вміст."
          en: "Prints nothing. Run this command only once: if `.env` already exists, `cp` silently replaces its contents."
      - text:
          uk: |
            Відкрий `.env` у редакторі й заміни значення `REPORT_TOKEN` на будь-який вигаданий текст — **не друкуй** цей файл у терміналі. Збережи, потім:
          en: |
            Open `.env` in the editor and replace the value of `REPORT_TOKEN` with any made-up text — **do not print** this file in the terminal. Save, then:
        command: "npm start\ngit status --short\ngit check-ignore -v .env"
        expect:
          uk: |
            ```text
            2 wishes wanted, 125 UAH
            Report token: set
             M package-lock.json
             M package.json
            .gitignore:2:.env	.env
            ```

            Програма каже лише, що токен є, — не його значення. `git status` не бачить `.env`, а `git check-ignore` пояснює чому: рядок 2 у `.gitignore`.
          en: |
            ```text
            2 wishes wanted, 125 UAH
            Report token: set
             M package-lock.json
             M package.json
            .gitignore:2:.env	.env
            ```

            The program says only that the token is there — not its value. `git status` does not see `.env`, and `git check-ignore` explains why: line 2 of `.gitignore`.
      - text:
          uk: "Закоміть виправлення — лише ці два файли:"
          en: "Commit the repairs — only these two files:"
        command: "git add package.json package-lock.json\ngit commit -m \"Fix the start script and the semver range\""
        expect:
          uk: "`[main …] Fix the start script and the semver range`, `2 files changed`."
          en: "`[main …] Fix the start script and the semver range`, `2 files changed`."
      - text:
          uk: "**Доказ із чистої копії.** Склонуй репозиторій у нову теку — там немає ні `node_modules`, ні твого `.env` — і встанови, перевір, запусти:"
          en: "**Proof from a clean copy.** Clone the repository into a new folder — there is neither `node_modules` nor your `.env` there — then install, test and start:"
        command: "cd ~/js-course\ngit clone broken-lab broken-lab-check\ncd broken-lab-check\nnpm ci\nnpm test\nnpm start"
        expect:
          uk: "`npm ci` — `found 0 vulnerabilities`; `npm test` — `ℹ pass 1`; `npm start` — знову `Error: CURRENCY is not set …`. Це правильно: `.env` не потрапив у репозиторій. Після `cp .env.example .env` тут `npm start` друкує `2 wishes wanted, 125 UAH`."
          en: "`npm ci` — `found 0 vulnerabilities`; `npm test` — `ℹ pass 1`; `npm start` — again `Error: CURRENCY is not set …`. That is correct: `.env` did not get into the repository. After `cp .env.example .env` here, `npm start` prints `2 wishes wanted, 125 UAH`."
    verify:
      - id: failures-recorded
        text:
          uk: "До будь-яких змін я записав три результати: `ETARGET` у `npm ci`, `Missing script: \"start\"` у `npm start` і зелені тести."
          en: "Before any change I recorded three results: `ETARGET` from `npm ci`, `Missing script: \"start\"` from `npm start` and green tests."
      - id: range-and-lock-fixed
        text:
          uk: "Після виправлення діапазону `npm ci` показав помилку синхронізації, а після `npm install` — встановив пакети без помилок і вразливостей."
          en: "After fixing the range `npm ci` showed the sync error, and after `npm install` it installed the packages with no errors and no vulnerabilities."
      - id: env-not-committed
        text:
          uk: "`npm start` надрукував `Report token: set`, а `git check-ignore` підтвердив, що `.env` ігнорується."
          en: "`npm start` printed `Report token: set`, and `git check-ignore` confirmed that `.env` is ignored."
      - id: clean-copy
        text:
          uk: "У чистому клоні `npm ci` і `npm test` пройшли, а `npm start` спершу вимагав `.env`."
          en: "In the clean clone `npm ci` and `npm test` passed, and `npm start` first asked for `.env`."
    troubleshooting:
      - problem:
          uk: "`npm error Unexpected token … in JSON at position …` або `EJSONPARSE`"
          en: "`npm error Unexpected token … in JSON at position …` or `EJSONPARSE`"
        fix:
          uk: "Під час копіювання в `package.json` чи `package-lock.json` загубилася кома або лапка. Скопіюй файл з уроку заново цілком."
          en: "A comma or a quote got lost while copying `package.json` or `package-lock.json`. Copy the whole file from the lesson again."
      - problem:
          uk: "`npm ci` одразу пише про синхронізацію, без `ETARGET`"
          en: "`npm ci` reports the sync problem right away, without `ETARGET`"
        fix:
          uk: "Деякі версії npm перевіряють збіг lockfile раніше, ніж шукають версію. Це та сама пара проблем у іншому порядку: виправ діапазон, потім онови lockfile через `npm install`."
          en: "Some npm versions check the lockfile match before looking for a version. It is the same pair of problems in another order: fix the range, then update the lockfile with `npm install`."
      - problem:
          uk: "`git status` показує `.env` серед нових файлів"
          en: "`git status` lists `.env` among new files"
        fix:
          uk: "`.gitignore` збережено з іншою назвою (наприклад, `.gitignore.txt`) або без рядка `.env`. **Не** роби `git add .`, доки `git status` показує `.env`. Виправ `.gitignore` і перевір `git check-ignore -v .env`."
          en: "`.gitignore` was saved under another name (for example `.gitignore.txt`) or without the `.env` line. Do **not** run `git add .` while `git status` lists `.env`. Fix `.gitignore` and check with `git check-ignore -v .env`."
      - problem:
          uk: "`.env` випадково потрапив у commit"
          en: "`.env` got into a commit by accident"
        fix:
          uk: "У навчальному проєкті значення вигадане, тож нічого страшного. У справжньому — вважай секрет розкритим: заміни його в сервісі, що його видав. Прибрати `.env` з наступних commits: `git rm --cached .env`, додай рядок у `.gitignore` і закоміть."
          en: "In the practice project the value is made up, so no harm done. In a real one, treat the secret as exposed: replace it with the service that issued it. To keep `.env` out of later commits: `git rm --cached .env`, add the line to `.gitignore` and commit."
    recovery:
      uk: "Перший commit «Start from the broken setup» — твоя точка повернення. `git diff` показує все, що ти змінив відтоді, а `git restore package.json package-lock.json` повертає ці два файли до зламаного стану, якщо хочеш почати лагодити заново."
      en: "The first commit, “Start from the broken setup”, is your return point. `git diff` shows everything you changed since, and `git restore package.json package-lock.json` returns these two files to the broken state if you want to start repairing again."

  - id: to-project
    kind: transfer
    capstoneStep: JS-15
    body:
      uk: "Коли твій проєкт отримає `package.json`, lockfile і `.env.example`, перевіряй його так само: чиста копія, `npm ci`, `npm test` — і жодного секрету в історії."
      en: "Once your project has `package.json`, a lockfile and `.env.example`, check it the same way: a clean copy, `npm ci`, `npm test` — and no secret in the history."
