id: js-15-13-debug-broken-setup
unit: JS-15
title:
  uk: "Налагодження: зламаний script, lockfile і конфігурація"
  en: "Debug: broken script, lockfile and config"
kind: local-task
minutes: 15
contentVersion: 1
purpose:
  uk: "Проєкт, який «у мене працював», часто не встановлюється чи не запускається на іншому комп’ютері. Ти отримаєш саме такий проєкт, зафіксуєш кожну помилку, перш ніж щось міняти, полагодиш причини й доведеш результат установленням з чистої копії — не показавши жодного секрету."
  en: "A project that “worked on my machine” often fails to install or start on another computer. You get exactly such a project, record every failure before changing anything, repair the causes and prove the result with an install from a clean copy — without exposing any secret."
objectives:
  - uk: "З’ясувати, чому наданий проєкт не встановлюється чи не запускається: script з помилкою в назві, lockfile, що розійшовся з `package.json`, діапазон версій, якому не відповідає жодна версія, і відсутнє значення env."
    en: "Diagnose why a supplied project fails to install or start: a misspelled script, a lockfile out of sync with package.json, an incompatible version range and a missing env value."
  - uk: "Полагодити кожну проблему з чистих файлів і довести це через `npm ci` і `npm test`, не показавши секрету ні у виводі, ні в commits."
    en: "Repair each problem from clean files and prove it with npm ci and npm test, without exposing a secret in output or commits."
prerequisites: [js-15-12-remotes-pr-review]
subskills:
  - { family: P-01, skill: "package scripts/manifest", depth: assess }
  - { family: P-01, skill: "package manager/lockfile", depth: assess }
  - { family: P-01, skill: "dependency/semver/security basics", depth: assess }
  - { family: P-01, skill: "build/env/config", depth: assess }
glossary: []

blocks:
  - id: how-to-debug-setup
    kind: explanation
    title:
      uk: "Спершу записати, потім лагодити"
      en: "Record first, repair second"
    body:
      uk: |
        Коли проєкт не встановлюється, хочеться одразу «спробувати щось»: видалити lockfile, додати `--force`, перевстановити Node.js. Так губиться найцінніше — **перше** повідомлення про помилку, яке точно каже, що не так.

        Порядок, якого варто триматися:

        1. Запусти `npm ci`, `npm start`, `npm test` і **запиши** кожне повідомлення, нічого не змінюючи.
        2. Для кожного знайди, **хто** скаржиться (npm, Node.js, твоя програма) і **на що**: назву script, версію, файл, змінну.
        3. Лагодь по одній причині й перевіряй тією самою командою.
        4. Доведи результат із **чистої копії**: склонуй репозиторій і виконай `npm ci` і `npm test` там, де немає твого `node_modules` і `.env`.

        І ще одне правило: секрет не повинен з’являтися ні у виводі, ні в commit. `.env` лежить у `.gitignore`, а в репозиторії є лише `.env.example` з вигаданими значеннями.
      en: |
        When a project will not install, you want to “try something” right away: delete the lockfile, add `--force`, reinstall Node.js. That loses the most valuable thing — the **first** error message, which says exactly what is wrong.

        The order to stick to:

        1. Run `npm ci`, `npm start`, `npm test` and **write down** every message without changing anything.
        2. For each one find **who** is complaining (npm, Node.js, your program) and **about what**: a script name, a version, a file, a variable.
        3. Repair one cause at a time and check with the same command.
        4. Prove the result from a **clean copy**: clone the repository and run `npm ci` and `npm test` where your `node_modules` and `.env` do not exist.

        And one more rule: a secret must appear neither in the output nor in a commit. `.env` is in `.gitignore`, and the repository holds only `.env.example` with made-up values.

  - id: predict-delete-lock
    kind: prediction
    prompt:
      uk: "`npm ci` падає з `No matching version found for semver@^8.0.0`. Колега радить: «Видали `package-lock.json` і запусти `npm install` — це завжди допомагає». Що буде?"
      en: "`npm ci` fails with `No matching version found for semver@^8.0.0`. A colleague advises: “Delete `package-lock.json` and run `npm install` — that always helps.” What happens?"
    answer:
      type: choice
      options:
        - id: same-error
          text:
            uk: "Та сама помилка: проблема в діапазоні в `package.json` — версії 8 не існує, — а lockfile тут ні до чого"
            en: "The same error: the problem is the range in `package.json` — there is no version 8 — and the lockfile has nothing to do with it"
        - id: fixed
          text:
            uk: "Усе встановиться: lockfile створиться заново"
            en: "Everything installs: the lockfile is recreated"
          why:
            uk: "npm створює lockfile з діапазонів у `package.json`. Діапазону `^8.0.0` не відповідає жодна опублікована версія, тож встановлювати нічого."
            en: "npm creates the lockfile from the ranges in `package.json`. No published version matches `^8.0.0`, so there is nothing to install."
        - id: installs-old
          text:
            uk: "npm встановить найближчу версію, 7.x"
            en: "npm installs the closest version, 7.x"
          why:
            uk: "npm ніколи не виходить за межі діапазону: `^8.0.0` означає «від 8.0.0 до 9», і 7.x туди не входить."
            en: "npm never goes outside the range: `^8.0.0` means “from 8.0.0 up to 9”, and 7.x is not in it."
      correct: [same-error]
    explanation:
      uk: "Повідомлення `No matching version found` прямо каже: діапазону не відповідає жодна версія. Лагодять діапазон, а lockfile видаляти не треба — він пам’ятає, з якими точно версіями проєкт працював, і ця інформація ще знадобиться."
      en: "The message `No matching version found` says it outright: no version matches the range. You fix the range, and there is no need to delete the lockfile — it remembers exactly which versions the project worked with, and that information is still useful."

  - id: broken-setup-lab
    kind: local-task
    runtime: local-web
    title:
      uk: "Полагодити проєкт, що не встановлюється й не запускається"
      en: "Repair a project that will not install or start"
    intro:
      uk: |
        Ти створиш теку `~/js-course/broken-lab` з файлами зламаного проєкту й одразу закомітиш їх: так `git diff` потім покаже рівно твої виправлення. Потрібен інтернет (для пакета `semver`), облікові записи — ні. Команди однакові на macOS, Linux і Windows PowerShell, крім копіювання файла (вказано біля кроку).

        Файли копіюй точно — **з помилками**. Файли `.env.example` і `.gitignore` починаються з крапки; у VS Code їх створюють так само, як інші.

        Вміст файлів для кроків — копіюй його точно:

        **Крок 1 — `package.json`:**

        ```json
        {
          "name": "broken-lab",
          "version": "1.0.0",
          "private": true,
          "type": "module",
          "scripts": {
            "strat": "node --env-file-if-exists=.env app.js",
            "test": "node --test"
          },
          "dependencies": {
            "semver": "^8.0.0"
          }
        }
        ```

        **Крок 1 — `package-lock.json`:**

        ```json
        {
          "name": "broken-lab",
          "version": "1.0.0",
          "lockfileVersion": 3,
          "requires": true,
          "packages": {
            "": {
              "name": "broken-lab",
              "version": "1.0.0",
              "dependencies": {
                "semver": "^7.5.1"
              }
            },
            "node_modules/lru-cache": {
              "version": "6.0.0",
              "resolved": "https://registry.npmjs.org/lru-cache/-/lru-cache-6.0.0.tgz",
              "integrity": "sha512-Jo6dJ04CmSjuznwJSS3pUeWmd/H0ffTlkXXgwZi+eq1UCmqQwCh+eLsYOYCwY991i2Fah4h1BEMCx4qThGbsiA==",
              "license": "ISC",
              "dependencies": {
                "yallist": "^4.0.0"
              },
              "engines": {
                "node": ">=10"
              }
            },
            "node_modules/semver": {
              "version": "7.5.1",
              "resolved": "https://registry.npmjs.org/semver/-/semver-7.5.1.tgz",
              "integrity": "sha512-Wvss5ivl8TMRZXXESstBA4uR5iXgEN/VC5/sOcuXdVLzcdkz4HWetIoRfG5gb5X+ij/G9rw9YoGn3QoQ8OCSpw==",
              "license": "ISC",
              "dependencies": {
                "lru-cache": "^6.0.0"
              },
              "bin": {
                "semver": "bin/semver.js"
              },
              "engines": {
                "node": ">=10"
              }
            },
            "node_modules/yallist": {
              "version": "4.0.0",
              "resolved": "https://registry.npmjs.org/yallist/-/yallist-4.0.0.tgz",
              "integrity": "sha512-3wdGidZyq5PB084XLES5TpOSRA3wjXAlIWMhum2kRcv/41Sn2emQ0dycQW4uZXLejwKvg6EsvbdlVL+FYEct7A==",
              "license": "ISC"
            }
          }
        }
        ```

        **Крок 1 — `app.js`:**

        ```js
        // app.js: prints a summary of a few synthetic wishes.
        import semver from "semver";
        import { wantedSummary } from "./summary.js";

        if (!semver.satisfies(process.version, ">=22.13.0")) {
          throw new Error(`Node.js ${process.version} is too old: 22.13 or newer is needed`);
        }

        const currency = process.env.CURRENCY;
        if (!currency) {
          throw new Error("CURRENCY is not set: copy .env.example to .env");
        }
        const token = process.env.REPORT_TOKEN;

        const wishes = [
          { name: "Headphones", price: 80, acquired: false },
          { name: "Desk lamp", price: 45, acquired: false },
          { name: "Travel mug", price: 18, acquired: true },
        ];

        console.log(wantedSummary(wishes, currency));
        console.log(`Report token: ${token ? "set" : "missing"}`);
        ```

        **Крок 1 — `summary.js`:**

        ```js
        // summary.js: one line about the wishes that are still wanted.
        export function wantedSummary(wishes, currency) {
          const wanted = wishes.filter((wish) => !wish.acquired);
          const total = wanted.reduce((sum, wish) => sum + (wish.price ?? 0), 0);
          return `${wanted.length} wishes wanted, ${total} ${currency}`;
        }
        ```

        **Крок 1 — `summary.test.js`:**

        ```js
        // summary.test.js: run with npm test.
        import { test } from "node:test";
        import assert from "node:assert/strict";
        import { wantedSummary } from "./summary.js";

        test("counts and sums only the wanted wishes", () => {
          const wishes = [
            { name: "Bicycle", price: 240, acquired: false },
            { name: "Concert tickets", price: null, acquired: false },
            { name: "A book", price: 25, acquired: true },
          ];
          assert.equal(wantedSummary(wishes, "UAH"), "2 wishes wanted, 240 UAH");
        });
        ```

        **Крок 1 — `README.md`:**

        ```markdown
        # Broken lab

        Prints a summary of synthetic wishes. Start it with `npm start`, test it with `npm test`.

        - semver must be 7.5.2 or newer (advisory GHSA-c2qf-rxjj-qqgw).
        - Settings come from `.env`; copy `.env.example` and fill in your own values. Never commit `.env`.
        ```

        **Крок 1 — `.env.example`:**

        ```text
        CURRENCY=UAH
        REPORT_TOKEN=replace-with-your-own-token
        ```

        **Крок 1 — `.gitignore`:**

        ```text
        node_modules/
        .env
        ```
      en: |
        You will create the folder `~/js-course/broken-lab` with the files of a broken project and commit them right away: that way `git diff` later shows exactly your repairs. Internet access is needed (for the `semver` package), accounts are not. The commands are the same on macOS, Linux and Windows PowerShell, except copying a file (given next to the step).

        Copy the files exactly — **with their mistakes**. The files `.env.example` and `.gitignore` start with a dot; in VS Code you create them like any other file.

