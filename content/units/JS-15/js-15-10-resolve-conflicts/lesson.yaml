id: js-15-10-resolve-conflicts
unit: JS-15
title:
  uk: "Розв’язуємо конфлікт"
  en: "Resolving a conflict"
kind: local-task
minutes: 15
contentVersion: 1
purpose:
  uk: "Коли дві гілки змінюють той самий рядок коду, Git не вгадує, яка зміна правильна, і зупиняє злиття. Ти сам створиш такий конфлікт у навчальному репозиторії, розв’яжеш його так, щоб збереглися обидва наміри, і доведеш тестами, що результат працює."
  en: "When two branches change the same line, Git does not guess which change is right and pauses the merge. You will create such a conflict yourself in the practice repository, resolve it so both intents survive and prove with tests that the result works."
objectives:
  - uk: "Навмисно створити конфлікт злиття, прочитати маркери конфлікту, написати правильний об’єднаний вміст і завершити злиття."
    en: "Produce a merge conflict on purpose, read the conflict markers, write the correct combined content and complete the merge."
  - uk: "Запустити тести проєкту після розв’язання, щоб довести, що злитий код працює."
    en: "Run the project’s tests after resolving to prove the merged code still works."
prerequisites: [js-15-09-merge-rebase-reading, js-09-02-assertions]
subskills:
  - { family: P-02, skill: "resolve conflicts", depth: intro }
glossary: [merge-conflict, conflict-markers]

blocks:
  - id: what-a-conflict-is
    kind: explanation
    title:
      uk: "Конфлікт — це питання, а не поломка"
      en: "A conflict is a question, not a breakage"
    body:
      uk: |
        Git зливає зміни сам, якщо гілки чіпали **різні** місця файлів. Якщо ж обидві змінили той самий рядок коду, він не знає, яка версія правильна, — можливо, потрібні обидві. Тоді виникає [[merge-conflict|конфлікт злиття]]: Git зупиняє merge і розмічає місце [[conflict-markers|маркерами]]:

        ```text
        <<<<<<< HEAD
        версія поточної гілки (куди зливаємо)
        =======
        версія гілки, яку вливаємо
        >>>>>>> feature/paused-mark
        ```

        Що робиш ти:

        1. Читаєш обидві версії й розумієш, **навіщо** зроблено кожну зміну.
        2. Пишеш правильний результат — часто це поєднання обох — і прибираєш усі три маркери.
        3. Запускаєш тести: розв’язаний текст ще не означає робочий код.
        4. `git add` файл і `git commit` — це завершує merge.

        Злякався чи заплутався? `git merge --abort` повертає все до стану перед злиттям.
      en: |
        Git merges changes by itself when the branches touched **different** places of the files. But if both changed the same line, it does not know which version is right — maybe both are needed. Then a [[merge-conflict]] happens: Git pauses the merge and marks the place with [[conflict-markers|markers]]:

        ```text
        <<<<<<< HEAD
        the current branch’s version (where we merge into)
        =======
        the version of the branch being merged
        >>>>>>> feature/paused-mark
        ```

        What you do:

        1. Read both versions and understand **why** each change was made.
        2. Write the correct result — often a combination of both — and remove all three markers.
        3. Run the tests: resolved text does not yet mean working code.
        4. `git add` the file and `git commit` — that completes the merge.

        Scared or confused? `git merge --abort` returns everything to the state before the merge.

  - id: conflict-picture
    kind: visual
    visual: git-graph
    title:
      uk: "Обидві гілки змінили той самий рядок коду"
      en: "Both branches changed the same line"
    textEquivalent:
      uk: >-
        Гілка feature/paused-mark додала до label.mjs позначку paused і тест для неї. Тим часом на main
        у тому самому рядку коду label.mjs замінили дужки на крапку-розділювач і оновили тест. Під час
        git merge feature/paused-mark Git не може поєднати дві зміни одного рядка: label.mjs позначено
        як conflicted, злиття зупинено. Розробник пише версію, що містить і розділювач, і позначку,
        прибирає маркери, оновлює очікуване значення в тесті, після чого тести проходять. git add і
        git commit створюють merge commit із двома батьками.
      en: >-
        The branch feature/paused-mark added a paused mark to label.mjs and a test for it. Meanwhile on
        main the same line of label.mjs had its brackets replaced by a dot separator, and the test was
        updated. During git merge feature/paused-mark Git cannot combine two changes of one line:
        label.mjs is marked conflicted and the merge pauses. The developer writes a version that has
        both the separator and the mark, removes the markers, updates the expected value in the test,
        and the tests pass. git add and git commit create a merge commit with two parents.
    spec:
      steps:
        - op: init
          caption:
            uk: "Репозиторій `git-lab` з попередніх уроків."
            en: "The `git-lab` repository from the previous lessons."
        - op: commit
          message: "Add habit label with a test"
          files: [label.mjs, label.test.mjs]
          caption:
            uk: "Спільна історія…"
            en: "The shared history…"
        - op: commit
          message: "Explain how to run the tests"
          files: [README.md]
          caption:
            uk: "…до `c2`."
            en: "…up to `c2`."
        - op: branch
          name: feature/paused-mark
          caption:
            uk: "Гілка для позначки paused."
            en: "A branch for the paused mark."
        - op: commit
          message: "Mark paused habits in the label"
          files: [label.mjs]
          caption:
            uk: "`c3` змінює рядок коду з `return` у `label.mjs`."
            en: "`c3` changes the `return` line in `label.mjs`."
        - op: commit
          message: "Test the paused mark"
          files: [label.test.mjs]
          caption:
            uk: "`c4` додає тест: очікує `\"Tidy up (weekly) [paused]\"`."
            en: "`c4` adds a test: it expects `\"Tidy up (weekly) [paused]\"`."
        - op: checkout
          name: main
          caption:
            uk: "На `main`."
            en: "On `main`."
        - op: commit
          message: "Describe the habit fields"
          files: [README.md]
          caption:
            uk: "`c5` змінює лише README — він конфлікту не дасть."
            en: "`c5` changes only the README — it causes no conflict."
        - op: commit
          message: "Separate name and frequency with a dot"
          files: [label.mjs, label.test.mjs]
          caption:
            uk: "`c6` змінює **той самий** рядок коду з `return` — тепер між назвою й частотою крапка `·`."
            en: "`c6` changes **the same** `return` line — now there is a dot `·` between the name and the frequency."
        - op: merge
          from: feature/paused-mark
          conflict: [label.mjs]
          caption:
            uk: "`git merge --no-edit feature/paused-mark`: `label.test.mjs` Git злив сам (зміни в різних місцях), а `label.mjs` — **conflicted**. Merge зупинено."
            en: "`git merge --no-edit feature/paused-mark`: Git merged `label.test.mjs` by itself (changes in different places), but `label.mjs` is **conflicted**. The merge pauses."
        - op: resolve
          files: [label.mjs]
          caption:
            uk: "Ти пишеш рядок коду з **обома** змінами — крапкою й позначкою, прибираєш маркери й виконуєш `git add label.mjs`."
            en: "You write a line with **both** changes — the dot and the mark, remove the markers and run `git add label.mjs`."
        - op: modify
          files: [label.test.mjs]
          caption:
            uk: "`npm test` падає: тест із гілки досі очікує дужки. Ти оновлюєш його очікуване значення на `\"Tidy up · weekly [paused]\"`."
            en: "`npm test` fails: the test from the branch still expects brackets. You update its expected value to `\"Tidy up · weekly [paused]\"`."
        - op: stage
          files: [label.test.mjs]
          caption:
            uk: "Тести проходять — `git add label.test.mjs`."
            en: "The tests pass — `git add label.test.mjs`."
        - op: commit
          message: "Merge branch 'feature/paused-mark'"
          caption:
            uk: "`git commit --no-edit` завершує злиття: merge commit `c7` з батьками `c6` і `c4`."
            en: "`git commit --no-edit` completes the merge: merge commit `c7` with parents `c6` and `c4`."

  - id: predict-resolution
    kind: prediction
    prompt:
      uk: |
        Після `git merge` у `label.mjs` таке:

        ```js
        export function habitLabel(habit) {
        <<<<<<< HEAD
          return `${habit.name} · ${habit.frequency}`;
        =======
          const mark = habit.active ? "" : " [paused]";
          return `${habit.name} (${habit.frequency})${mark}`;
        >>>>>>> feature/paused-mark
        }
        ```

        На `main` вирішили розділяти назву й частоту крапкою, у гілці — позначати призупинені звички. Яка версія тіла функції зберігає **обидва** наміри?
      en: |
        After `git merge`, `label.mjs` contains:

        ```js
        export function habitLabel(habit) {
        <<<<<<< HEAD
          return `${habit.name} · ${habit.frequency}`;
        =======
          const mark = habit.active ? "" : " [paused]";
          return `${habit.name} (${habit.frequency})${mark}`;
        >>>>>>> feature/paused-mark
        }
        ```

        On `main` they decided to separate the name and the frequency with a dot, on the branch to mark paused habits. Which version of the function body keeps **both** intents?
    answer:
      type: choice
      options:
        - id: combined
          code: |-
            const mark = habit.active ? "" : " [paused]";
            return `${habit.name} · ${habit.frequency}${mark}`;
        - id: ours
          code: |-
            return `${habit.name} · ${habit.frequency}`;
          why:
            uk: "Це версія лише з `main`: позначка paused із гілки втрачена, хоча саме заради неї гілку й зливали."
            en: "This is `main`’s version only: the paused mark from the branch is lost, although it is the reason the branch is being merged."
        - id: theirs
          code: |-
            const mark = habit.active ? "" : " [paused]";
            return `${habit.name} (${habit.frequency})${mark}`;
          why:
            uk: "Це версія лише з гілки: рішення `main` про крапку-розділювач мовчки скасовано."
            en: "This is the branch’s version only: `main`’s decision about the dot separator is silently undone."
        - id: both-returns
          code: |-
            return `${habit.name} · ${habit.frequency}`;
            const mark = habit.active ? "" : " [paused]";
            return `${habit.name} (${habit.frequency})${mark}`;
          why:
            uk: "Маркери прибрано, але код після першого `return` ніколи не виконається: позначки не буде. Розв’язати конфлікт — означає написати один правильний варіант, а не склеїти обидва."
            en: "The markers are gone, but code after the first `return` never runs: there is no mark. Resolving a conflict means writing one correct version, not gluing both together."
      correct: [combined]
    explanation:
      uk: "Правильне розв’язання бере крапку з `main` і позначку з гілки. Git не міг цього зробити сам, бо обидві зміни торкнулися одного рядка коду, — це рішення про **зміст**, і приймає його людина, яка розуміє обидва наміри."
      en: "The right resolution takes the dot from `main` and the mark from the branch. Git could not do it by itself because both changes touched one line — it is a decision about **meaning**, made by a person who understands both intents."

  - id: recall-assertion
    kind: review
    title:
      uk: "Згадай: як читати провалену перевірку"
      en: "Recall: how to read a failed check"
    items:
      - id: actual-vs-expected
        from: js-09-02-assertions
        prompt:
          uk: |
            Тест `assert.equal(habitLabel(habit), "Tidy up (weekly) [paused]")` впав із таким повідомленням:

            ```text
            + actual - expected

            + 'Tidy up · weekly [paused]'
            - 'Tidy up (weekly) [paused]'
            ```

            Що це означає?
          en: |
            The test `assert.equal(habitLabel(habit), "Tidy up (weekly) [paused]")` failed with this message:

            ```text
            + actual - expected

            + 'Tidy up · weekly [paused]'
            - 'Tidy up (weekly) [paused]'
            ```

            What does it mean?
        answer:
          type: choice
          options:
            - id: code-gave-dot
              text:
                uk: "Функція повернула текст із крапкою, а тест очікував дужки"
                en: "The function returned text with a dot, while the test expected brackets"
            - id: code-gave-brackets
              text:
                uk: "Функція повернула текст із дужками, а тест очікував крапку"
                en: "The function returned text with brackets, while the test expected a dot"
              why:
                uk: "Навпаки: рядок із `+` — actual, тобто те, що повернув код; рядок із `-` — expected із тесту."
                en: "The other way round: the line with `+` is actual — what the code returned; the line with `-` is expected, from the test."
          correct: [code-gave-dot]
        explanation:
          uk: "Перевірка порівнює фактичне значення з очікуваним і показує обидва. Після злиття таке трапляється часто: код уже злито правильно, але тест із гілки досі описує стару поведінку. Тоді виправляють очікуване значення — **лише** коли нова поведінка справді задумана."
          en: "A check compares the actual value with the expected one and shows both. After a merge this happens often: the code is merged correctly, but a test from the branch still describes the old behavior. Then you fix the expected value — **only** when the new behavior really is intended."

  - id: conflict-lab
    kind: local-task
    runtime: local-web
    title:
      uk: "Створити, розв’язати й перевірити конфлікт"
      en: "Create, resolve and test a conflict"
    intro:
      uk: |
        Працюєш в оригінальному `~/js-course/git-lab` (не в копіях з минулого уроку): там `main` і `feature/paused-mark` досі розійшлися. Id commits у тебе інші. Команди однакові на macOS, Linux і Windows PowerShell.

        Вміст файлів для кроків — копіюй його точно:

        **Крок 2 — `label.mjs`:**

        ```js
        // label.mjs: how one habit is shown in the list.
        export function habitLabel(habit) {
          return `${habit.name} · ${habit.frequency}`;
        }
        ```
      en: |
        You work in the original `~/js-course/git-lab` (not in last lesson’s copies): there `main` and `feature/paused-mark` are still diverged. Your commit ids differ. The commands are the same on macOS, Linux and Windows PowerShell.

        File contents for the steps — copy them exactly:

        **Step 2 — `label.mjs`:**

        ```js
        // label.mjs: how one habit is shown in the list.
        export function habitLabel(habit) {
          return `${habit.name} · ${habit.frequency}`;
        }
        ```
    tools:
      - name: "Git"
        version: { uk: "2.28 або новіша (перевірено з 2.51)", en: "2.28 or newer (checked with 2.51)" }
      - name: "Node.js"
        version: { uk: "22.13 або новіша", en: "22.13 or newer" }
      - name: "A code editor"
        version: { uk: "VS Code або будь-який редактор простого тексту", en: "VS Code or any plain-text editor" }
    steps:
      - text:
          uk: "Переконайся, що ти на `main` і все чисто:"
          en: "Make sure you are on `main` and everything is clean:"
        command: "cd ~/js-course/git-lab\ngit switch main\ngit status"
        expect:
          uk: "`On branch main` і `nothing to commit, working tree clean` (або `Already on 'main'` перед цим)."
          en: "`On branch main` and `nothing to commit, working tree clean` (possibly `Already on 'main'` before it)."
      - text:
          uk: |
            Тепер зміни на `main` той самий рядок коду, що й гілка: заміни вміст `label.mjs` новим із вступу до завдання (позначка «Крок 2»), а в `label.test.mjs` зміни очікуване значення на `"Drink water · daily"` (замість `"Drink water (daily)"`). Збережи обидва файли, потім:
          en: |
            Now change on `main` the same line the branch changed: replace the contents of `label.mjs` with the new one from the task introduction (marked “Step 2”), and in `label.test.mjs` change the expected value to `"Drink water · daily"` (instead of `"Drink water (daily)"`). Save both files, then:
        command: "npm test\ngit add label.mjs label.test.mjs\ngit commit -m \"Separate name and frequency with a dot\""
        expect:
          uk: "`npm test` — `ℹ pass 1`; потім `[main 16cf5ec] Separate name and frequency with a dot`."
          en: "`npm test` shows `ℹ pass 1`; then `[main 16cf5ec] Separate name and frequency with a dot`."
      - text:
          uk: "Злий гілку — і прочитай, що скаже Git:"
          en: "Merge the branch — and read what Git says:"
        command: "git merge --no-edit feature/paused-mark\ngit status"
        expect:
          uk: |
            ```text
            Auto-merging label.mjs
            CONFLICT (content): Merge conflict in label.mjs
            Auto-merging label.test.mjs
            Automatic merge failed; fix conflicts and then commit the result.
            On branch main
            You have unmerged paths.
              (fix conflicts and run "git commit")
              (use "git merge --abort" to abort the merge)

            Changes to be committed:
            	modified:   label.test.mjs

            Unmerged paths:
              (use "git add <file>..." to mark resolution)
            	both modified:   label.mjs
            ```

            `label.test.mjs` Git злив сам, `label.mjs` — чекає на тебе.
          en: |
            ```text
            Auto-merging label.mjs
            CONFLICT (content): Merge conflict in label.mjs
            Auto-merging label.test.mjs
            Automatic merge failed; fix conflicts and then commit the result.
            On branch main
            You have unmerged paths.
              (fix conflicts and run "git commit")
              (use "git merge --abort" to abort the merge)

            Changes to be committed:
            	modified:   label.test.mjs

            Unmerged paths:
              (use "git add <file>..." to mark resolution)
            	both modified:   label.mjs
            ```

            Git merged `label.test.mjs` by itself; `label.mjs` waits for you.
      - text:
          uk: |
            Відкрий `label.mjs` у редакторі (VS Code підсвітить обидві версії й запропонує кнопки — їх не натискай, зроби вручну). Залиш у тілі функції версію з **обома** змінами, як у передбаченні, і прибери всі рядки-маркери. Збережи й перевір, що маркерів не лишилося:
          en: |
            Open `label.mjs` in the editor (VS Code highlights both versions and offers buttons — do not press them, do it by hand). Keep in the function body the version with **both** changes, as in the prediction, and remove all marker lines. Save and check that no markers are left:
        command: "git diff --check"
        expect:
          uk: "Нічого не друкує. Якщо маркер лишився, побачиш рядки на кшталт `label.mjs:4: leftover conflict marker` — прибери їх і перевір знову."
          en: "Prints nothing. If a marker is left, you see lines like `label.mjs:4: leftover conflict marker` — remove them and check again."
      - text:
          uk: "Маркерів немає. Але чи працює код? Запусти тести:"
          en: "No markers left. But does the code work? Run the tests:"
        command: "npm test"
        expect:
          uk: |
            Один тест падає:

            ```text
            ✔ shows the name and the frequency (0.5545ms)
            ✖ marks a paused habit (0.608666ms)
            …
              + actual - expected

              + 'Tidy up · weekly [paused]'
              - 'Tidy up (weekly) [paused]'
            ```

            Код злито правильно, а тест із гілки досі очікує дужки. У `label.test.mjs` заміни очікуване значення на `"Tidy up · weekly [paused]"` і запусти `npm test` знову: `ℹ pass 2`, `ℹ fail 0`.
          en: |
            One test fails:

            ```text
            ✔ shows the name and the frequency (0.5545ms)
            ✖ marks a paused habit (0.608666ms)
            …
              + actual - expected

              + 'Tidy up · weekly [paused]'
              - 'Tidy up (weekly) [paused]'
            ```

            The code is merged correctly, but the test from the branch still expects brackets. In `label.test.mjs` change the expected value to `"Tidy up · weekly [paused]"` and run `npm test` again: `ℹ pass 2`, `ℹ fail 0`.
      - text:
          uk: "Познач конфлікт розв’язаним і заверши злиття:"
          en: "Mark the conflict resolved and complete the merge:"
        command: "git add label.mjs label.test.mjs\ngit status\ngit commit --no-edit\ngit log --oneline --graph --all"
        expect:
          uk: |
            ```text
            All conflicts fixed but you are still merging.
              (use "git commit" to conclude merge)
            …
            [main 9f8df5f] Merge branch 'feature/paused-mark'
            *   9f8df5f (HEAD -> main) Merge branch 'feature/paused-mark'
            |\
            | * 26f1118 (feature/paused-mark) Test the paused mark
            | * 1e27780 Mark paused habits in the label
            * | 16cf5ec Separate name and frequency with a dot
            * | ba15605 Describe the habit fields
            |/
            * eab0f9f Explain how to run the tests
            * 3ab7a35 Add habit label with a test
            ```
          en: |
            ```text
            All conflicts fixed but you are still merging.
              (use "git commit" to conclude merge)
            …
            [main 9f8df5f] Merge branch 'feature/paused-mark'
            *   9f8df5f (HEAD -> main) Merge branch 'feature/paused-mark'
            |\
            | * 26f1118 (feature/paused-mark) Test the paused mark
            | * 1e27780 Mark paused habits in the label
            * | 16cf5ec Separate name and frequency with a dot
            * | ba15605 Describe the habit fields
            |/
            * eab0f9f Explain how to run the tests
            * 3ab7a35 Add habit label with a test
            ```
    verify:
      - id: conflict-seen
        text:
          uk: "Я бачив `CONFLICT (content): Merge conflict in label.mjs` і маркери `<<<<<<<`, `=======`, `>>>>>>>` у файлі."
          en: "I saw `CONFLICT (content): Merge conflict in label.mjs` and the markers `<<<<<<<`, `=======`, `>>>>>>>` in the file."
      - id: both-intents
        text:
          uk: "Мій `label.mjs` поєднує крапку з `main` і позначку `[paused]` з гілки, а `git diff --check` нічого не надрукував."
          en: "My `label.mjs` combines the dot from `main` and the `[paused]` mark from the branch, and `git diff --check` printed nothing."
      - id: tests-after-merge
        text:
          uk: "Після розв’язання `npm test` спершу показав один провалений тест, а після виправлення очікування — `ℹ fail 0`."
          en: "After resolving, `npm test` first showed one failing test, and after fixing the expectation — `ℹ fail 0`."
      - id: merge-committed
        text:
          uk: "`git log --oneline --graph --all` показує merge commit, у який сходяться дві лінії."
          en: "`git log --oneline --graph --all` shows a merge commit where two lines join."
    troubleshooting:
      - problem:
          uk: "`error: Committing is not possible because you have unmerged files.`"
          en: "`error: Committing is not possible because you have unmerged files.`"
        fix:
          uk: "Ти ще не виконав `git add` для розв’язаного файла. `git status` покаже його в `Unmerged paths` — додай його й повтори commit."
          en: "You have not run `git add` for the resolved file yet. `git status` shows it under `Unmerged paths` — add it and repeat the commit."
      - problem:
          uk: "Merge пройшов без конфлікту"
          en: "The merge went through without a conflict"
        fix:
          uk: "Ймовірно, на `main` змінено не той самий рядок коду або цю гілку вже злито раніше (наприклад, в оригіналі замість копії). Подивись `git log --oneline --graph --all`; урок можна пройти й на свіжій копії репозиторію з потрібним станом."
          en: "Probably `main` changed a different line, or this branch was already merged earlier (for example in the original instead of a copy). Look at `git log --oneline --graph --all`; you can also do the lesson in a fresh copy of the repository in the right state."
      - problem:
          uk: "`SyntaxError` під час `npm test`"
          en: "`SyntaxError` during `npm test`"
        fix:
          uk: "У файлі лишився маркер або зайва дужка. `git diff --check` знайде маркери; решту покаже номер рядка коду в повідомленні."
          en: "A marker or an extra bracket is left in the file. `git diff --check` finds markers; the line number in the message shows the rest."
    recovery:
      uk: "Поки merge не завершено, `git merge --abort` повертає репозиторій точно до стану перед `git merge` — твій commit із крапкою залишиться. Після цього можна спробувати ще раз."
      en: "Until the merge is complete, `git merge --abort` returns the repository exactly to its state before `git merge` — your commit with the dot stays. Then you can try again."

  - id: to-project
    kind: transfer
    capstoneStep: JS-15
    body:
      uk: "У проєкті конфлікти найчастіше трапляються в доменних функціях і їхніх тестах. Правило те саме: збережи обидва наміри, прибери маркери, запусти тести — і лише тоді `git commit`."
      en: "In a project, conflicts most often happen in domain functions and their tests. The rule is the same: keep both intents, remove the markers, run the tests — and only then `git commit`."
