id: js-12-04-math-parsing
unit: JS-12
title:
  uk: "Math і розбір введених чисел"
  en: "Math and parsing input"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити `Number()`, `parseInt` і `parseFloat` для введень на зразок `''`, `' 12 '`, `'12px'`, `'1,5'` і `'0x10'`."
    en: "Predict `Number()`, `parseInt` and `parseFloat` for inputs like `''`, `' 12 '`, `'12px'`, `'1,5'` and `'0x10'`."
  - uk: "Заокруглювати, відкидати дробову частину й обмежувати значення через `Math` і обирати заокруглення, якого вимагає правило, зокрема для від’ємних половинок."
    en: "Round, floor and clamp values with `Math` and pick the rounding a rule requires, including negative halves."
prerequisites: [js-12-03-numbers-precision]
subskills:
  - { family: J-07, skill: "Math and parsing", depth: intro }
glossary: [number-parsing, radix, rounding-mode]
selfCheck: [predict-parse, predict-round, parse-quantity]

blocks:
  - id: three-parsers
    kind: explanation
    title:
      uk: "Три способи перетворити текст на число"
      en: "Three ways to turn text into a number"
    body:
      uk: |
        З поля форми завжди приходить **текст**. Перетворити його на число — це [[number-parsing|розбір числа]], і в JavaScript є три способи з різними правилами:

        | Введення | `Number(text)` | `parseInt(text, 10)` | `parseFloat(text)` |
        |---|---|---|---|
        | `"42"` | 42 | 42 | 42 |
        | `"12px"` | `NaN` | 12 | 12 |
        | `"2.5"` | 2.5 | 2 | 2.5 |
        | `"abc"` | `NaN` | `NaN` | `NaN` |

        - `Number` вимагає, щоб **увесь** текст був числом; пробіли на краях він пропускає.
        - `parseInt` і `parseFloat` читають цифри **з початку** й мовчки зупиняються на першому «чужому» символі. `parseInt` розуміє лише цілі, `parseFloat` — ще й десяткову крапку.

        Другий аргумент `parseInt` — [[radix|основа системи числення]]. Передавай `10` завжди: так читання не залежатиме від того, з чого починається текст.

        Зверни увагу: десятковий роздільник у JavaScript — **крапка**. Українська кома `1,5` для нього не дробове число.
      en: |
        A form field always delivers **text**. Turning it into a number is [[number-parsing|number parsing]], and JavaScript has three ways with different rules:

        | Input | `Number(text)` | `parseInt(text, 10)` | `parseFloat(text)` |
        |---|---|---|---|
        | `"42"` | 42 | 42 | 42 |
        | `"12px"` | `NaN` | 12 | 12 |
        | `"2.5"` | 2.5 | 2 | 2.5 |
        | `"abc"` | `NaN` | `NaN` | `NaN` |

        - `Number` requires the **whole** text to be a number; it skips spaces at the edges.
        - `parseInt` and `parseFloat` read digits **from the start** and silently stop at the first “foreign” character. `parseInt` understands only whole numbers, `parseFloat` also a decimal point.

        The second argument of `parseInt` is the [[radix]]. Always pass `10`: then the reading does not depend on how the text begins.

        Note: JavaScript’s decimal separator is a **dot**. A comma, as in the Ukrainian `1,5`, does not make a fraction for it.

  - id: predict-parse
    kind: prediction
    prompt:
      uk: "Що виведе цей рядок коду? Подумай про кожне з п’яти перетворень окремо."
      en: "What does this line print? Think about each of the five conversions separately."
    code: |
      console.log(Number(""), Number(" 12 "), parseInt("12px", 10), parseFloat("1,5"), Number("1,5"));
    verify:
      logs: ["0 12 12 1 NaN"]
    answer:
      type: choice
      options:
        - id: real
          code: "0 12 12 1 NaN"
        - id: same-functions
          code: "0 12 NaN 1 NaN"
          why:
            uk: "`parseInt` — не інша назва `Number`. Він читає цифри з початку й зупиняється на `p`, тож `\"12px\"` дає `12`."
            en: "`parseInt` is not another name for `Number`. It reads digits from the start and stops at `p`, so `\"12px\"` gives `12`."
        - id: empty-nan
          code: "NaN 12 12 1 NaN"
          why:
            uk: "Порожній текст `Number` перетворює на `0`, а не на `NaN`. Це пастка: порожнє поле тихо стає нулем."
            en: "`Number` turns empty text into `0`, not `NaN`. That is a trap: an empty field quietly becomes zero."
        - id: comma-decimal
          code: "0 12 12 1.5 1.5"
          why:
            uk: "Для JavaScript десятковий роздільник — крапка. `parseFloat` зупиняється на комі й дає `1`, а `Number` не може прочитати весь текст і дає `NaN`."
            en: "For JavaScript the decimal separator is a dot. `parseFloat` stops at the comma and gives `1`, while `Number` cannot read the whole text and gives `NaN`."
      correct: [real]
    explanation:
      uk: "`Number(\"\")` — `0`, і це головна пастка порожніх полів. `Number(\" 12 \")` пропускає пробіли на краях. `parseInt(\"12px\", 10)` читає `12` і мовчки відкидає решту. `parseFloat(\"1,5\")` зупиняється на комі — `1`. А `Number(\"1,5\")` бачить текст, що не є числом цілком, — `NaN`."
      en: "`Number(\"\")` is `0`, and that is the main trap of empty fields. `Number(\" 12 \")` skips the spaces at the edges. `parseInt(\"12px\", 10)` reads `12` and silently drops the rest. `parseFloat(\"1,5\")` stops at the comma — `1`. And `Number(\"1,5\")` sees text that is not a number as a whole — `NaN`."

  - id: form-quantities
    kind: example
    runtime: browser-js
    dir: form-quantities
    entry: index.js
    title:
      uk: "Обробник форми, що мовчки вигадує числа"
      en: "A form handler that silently invents numbers"
    body:
      uk: |
        Ось що люди ввели в поле «скільки штук?». Обробник читає кожне значення через `parseFloat`. Запусти й подивись, що стало з `"12px"`, `"1,5"` і `"0x10"`: замість помилок — правдоподібні, але вигадані числа. `JSON.stringify(text)` показує текст разом із лапками, тож пробіли й порожній текст видно.
      en: |
        Here is what people typed into the “how many?” field. The handler reads each value with `parseFloat`. Run it and see what became of `"12px"`, `"1,5"` and `"0x10"`: instead of errors — plausible but invented numbers. `JSON.stringify(text)` shows the text with its quotes, so spaces and the empty string are visible.
    tryIt:
      uk: |
        Заміни `readQuantity` на суворішу версію. `Number.isInteger(x)` дає `true` лише для цілого числа:

        ```js
        function readQuantity(text) {
          const value = Number(text.trim());
          if (text.trim() === "" || !Number.isInteger(value)) {
            return null;
          }
          return value;
        }
        ```

        Тепер `""`, `"2.5"`, `"12px"` і `"1,5"` дають `null` — помилку, яку видно. Але `"0x10"` усе ще дає `16`: `Number` розуміє шістнадцятковий запис. Справжній суворий розбір має перевірити, що в тексті лише цифри, — це ти зробиш у вправі.
      en: |
        Replace `readQuantity` with a stricter version. `Number.isInteger(x)` gives `true` only for a whole number:

        ```js
        function readQuantity(text) {
          const value = Number(text.trim());
          if (text.trim() === "" || !Number.isInteger(value)) {
            return null;
          }
          return value;
        }
        ```

        Now `""`, `"2.5"`, `"12px"` and `"1,5"` give `null` — an error you can see. But `"0x10"` still gives `16`: `Number` understands hexadecimal notation. A truly strict parser has to check that the text holds only digits — you will do that in the exercise.

  - id: rounding
    kind: explanation
    title:
      uk: "Заокруглення — це правило, яке обирають"
      en: "Rounding is a rule you choose"
    body:
      uk: |
        Об’єкт `Math` має кілька способів позбутися дробової частини. Кожен — окремий [[rounding-mode|спосіб заокруглення]]:

        | Виклик | `2.7` | `2.5` | `-2.7` |
        |---|---|---|---|
        | `Math.floor(x)` — униз | 2 | 2 | -3 |
        | `Math.ceil(x)` — угору | 3 | 3 | -2 |
        | `Math.trunc(x)` — відкинути дріб | 2 | 2 | -2 |
        | `Math.round(x)` — до найближчого | 3 | 3 | -3 |

        Зверни увагу: «униз» для від’ємних — це **далі від нуля**: `Math.floor(-2.7)` — `-3`.

        А в `Math.round` рівно половинка завжди йде **вгору, до більшого числа** — навіть для від’ємних. Тож половинка від’ємного числа заокруглюється до нуля, а не від нього.

        Ще один частий прийом — обмежити значення межами: `Math.min(Math.max(x, 1), 99)` повертає `x`, але не менше за 1 і не більше за 99.
      en: |
        The `Math` object has several ways to get rid of the fractional part. Each is a separate [[rounding-mode|rounding mode]]:

        | Call | `2.7` | `2.5` | `-2.7` |
        |---|---|---|---|
        | `Math.floor(x)` — down | 2 | 2 | -3 |
        | `Math.ceil(x)` — up | 3 | 3 | -2 |
        | `Math.trunc(x)` — drop the fraction | 2 | 2 | -2 |
        | `Math.round(x)` — to the nearest | 3 | 3 | -3 |

        Note: “down” for negative numbers means **away from zero**: `Math.floor(-2.7)` is `-3`.

        And in `Math.round` an exact half always goes **up, to the larger number** — negative numbers included. So the half of a negative number is rounded towards zero, not away from it.

        One more common trick is to clamp a value into bounds: `Math.min(Math.max(x, 1), 99)` returns `x`, but never less than 1 and never more than 99.

  - id: predict-round
    kind: prediction
    prompt:
      uk: "Що виведе цей рядок коду?"
      en: "What does this line print?"
    code: |
      console.log(Math.round(-2.5), Math.floor(-2.5), Math.trunc(-2.5), Math.round(-2.6));
    verify:
      logs: ["-2 -3 -2 -3"]
    answer:
      type: choice
      options:
        - id: half-up
          code: "-2 -3 -2 -3"
        - id: away-from-zero
          code: "-3 -3 -2 -3"
          why:
            uk: "`Math.round` не відштовхує половинку від нуля. Рівно половинка йде до **більшого** числа, а `-2` більше за `-3`."
            en: "`Math.round` does not push a half away from zero. An exact half goes to the **larger** number, and `-2` is larger than `-3`."
        - id: floor-towards-zero
          code: "-2 -2 -2 -3"
          why:
            uk: "`Math.floor` іде вниз по числовій прямій, а для від’ємних це далі від нуля: `-3`. До нуля відкидає `Math.trunc`."
            en: "`Math.floor` goes down the number line, and for negative numbers that is away from zero: `-3`. It is `Math.trunc` that cuts towards zero."
        - id: all-same
          code: "-3 -3 -3 -3"
          why:
            uk: "`Math.trunc` просто відкидає дробову частину: від `-2.5` лишається `-2`."
            en: "`Math.trunc` simply drops the fractional part: `-2.5` becomes `-2`."
      correct: [half-up]
    explanation:
      uk: "`Math.round(-2.5)` — `-2`: половинка йде до більшого числа. `Math.floor(-2.5)` — `-3`, униз по прямій. `Math.trunc(-2.5)` — `-2`, просто без дробу. А `-2.6` ближче до `-3`, тож `Math.round` дає `-3`. Якщо правило вимагає «половинку від нуля», його доведеться написати самому."
      en: "`Math.round(-2.5)` is `-2`: the half goes to the larger number. `Math.floor(-2.5)` is `-3`, down the line. `Math.trunc(-2.5)` is `-2`, just without the fraction. And `-2.6` is closer to `-3`, so `Math.round` gives `-3`. If a rule requires “halves away from zero”, you have to write it yourself."

  - id: recall-coercion
    kind: review
    title:
      uk: "Пригадай: == з текстом і числом"
      en: "Recall: == with text and a number"
    items:
      - id: loose-empty
        from: js-02-02-equality-coercion
        prompt:
          uk: "Що виведе цей рядок коду?"
          en: "What does this line print?"
        code: |
          console.log("" == 0, " 12 " == 12, "12px" == 12);
        verify:
          logs: ["true true false"]
        answer:
          type: choice
          options:
            - id: number-rules
              code: "true true false"
            - id: all-false
              code: "false false false"
              why:
                uk: "`==` спершу перетворює текст на число — за тими самими правилами, що й `Number()`. Порожній текст стає `0`, а `\" 12 \"` — `12`."
                en: "`==` first converts the text into a number — by the same rules as `Number()`. Empty text becomes `0`, and `\" 12 \"` becomes `12`."
            - id: parseint-rules
              code: "true true true"
              why:
                uk: "`==` перетворює текст так, як `Number()`, а не як `parseInt`. `Number(\"12px\")` — `NaN`, і `NaN == 12` — `false`."
                en: "`==` converts text the way `Number()` does, not like `parseInt`. `Number(\"12px\")` is `NaN`, and `NaN == 12` is `false`."
          correct: [number-rules]
        explanation:
          uk: "Порівнюючи текст із числом, `==` перетворює текст через ті самі правила, що й `Number()`. Тому `\"\" == 0` — `true`: ще одна причина порівнювати через `===` і розбирати введення явно."
          en: "When comparing text with a number, `==` converts the text by the same rules as `Number()`. So `\"\" == 0` is `true`: one more reason to compare with `===` and to parse input explicitly."

  - id: parse-quantity
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: parse-quantity
    entry: index.js
    title:
      uk: "Суворий розбір кількості"
      en: "A strict quantity parser"
    instructions:
      uk: |
        Перепиши `parseQuantity(text)`. Поле приймає лише цілі числа від 1 до 99, записані цифрами `0`–`9`; пробіли на краях дозволені. Функція повертає:

        - `{ ok: true, value }` — `value` — число;
        - `{ ok: false, error: "required" }` — поле порожнє або лише з пробілів;
        - `{ ok: false, error: "not-a-number" }` — у тексті є щось, крім цифр (`"12px"`, `"1,5"`, `"2.5"`, `"0x10"`, `"-3"`);
        - `{ ok: false, error: "out-of-range" }` — число менше за 1 або більше за 99.
      en: |
        Rewrite `parseQuantity(text)`. The field accepts only whole numbers from 1 to 99 written with the digits `0`–`9`; spaces at the edges are allowed. The function returns:

        - `{ ok: true, value }` — `value` is a number;
        - `{ ok: false, error: "required" }` — the field is empty or holds only spaces;
        - `{ ok: false, error: "not-a-number" }` — the text holds something besides digits (`"12px"`, `"1,5"`, `"2.5"`, `"0x10"`, `"-3"`);
        - `{ ok: false, error: "out-of-range" }` — the number is less than 1 or greater than 99.
    testTitles:
      "accepts a whole number with spaces around it":
        uk: "Приймає ціле число з пробілами на краях"
        en: "Accepts a whole number with spaces around it"
      "accepts the boundaries 1 and 99":
        uk: "Приймає межі 1 і 99"
        en: "Accepts the boundaries 1 and 99"
      'an empty field is "required"':
        uk: "Порожнє поле — `\"required\"`"
        en: "An empty field is `\"required\"`"
      'text that is not only digits is "not-a-number"':
        uk: "Текст не лише з цифр — `\"not-a-number\"`"
        en: "Text that is not only digits is `\"not-a-number\"`"
      '0 and 100 are "out-of-range"':
        uk: "0 і 100 — `\"out-of-range\"`"
        en: "0 and 100 are `\"out-of-range\"`"
    hints:
      nudge:
        uk: "Перевіряй по черзі: чи поле порожнє, чи в ньому лише цифри, чи число в межах. Чому ні `parseInt`, ні `Number` самі по собі не годяться для другого кроку?"
        en: "Check in order: is the field empty, does it hold only digits, is the number within bounds. Why is neither `parseInt` nor `Number` enough on its own for the second step?"
      explanation:
        uk: "`parseInt` мовчки відкидає хвіст (`\"12px\"` → 12), а `Number` приймає `\"0x10\"` і `\"1e1\"`. Тож спершу переконайся, що кожен символ обрізаного тексту — цифра. Текст можна розкласти на символи через `[...text]` і перевірити всі через `every`. Символи порівнюються як текст: `\"a\" <= char && char <= \"f\"` перевіряє, що символ — одна з літер від a до f; для цифр межі інші. Лише після цього перетворюй текст на число й перевіряй межі."
        en: "`parseInt` silently drops the tail (`\"12px\"` → 12), and `Number` accepts `\"0x10\"` and `\"1e1\"`. So first make sure that every character of the trimmed text is a digit. You can split text into characters with `[...text]` and check all of them with `every`. Characters compare as text: `\"a\" <= char && char <= \"f\"` checks that a character is one of the letters a to f; for digits the bounds are different. Only after that turn the text into a number and check the bounds."
    solutionNote:
      uk: "Порядок важливий: порожнє поле → лише цифри → межі. Перевірка «лише цифри» відкидає все, що `Number` чи `parseInt` перетворили б на правдоподібне число: `\"12px\"`, `\"0x10\"`, `\"1e1\"`, `\"-3\"`. У наступних уроках ту саму перевірку ти запишеш коротше — регулярним виразом."
      en: "The order matters: empty field → only digits → bounds. The “only digits” check rejects everything that `Number` or `parseInt` would turn into a plausible number: `\"12px\"`, `\"0x10\"`, `\"1e1\"`, `\"-3\"`. In the coming lessons you will write the same check more briefly — as a regular expression."
    feedback:
      - when: { test: "accepts a whole number with spaces around it" }
        message:
          uk: "Ця перевірка чекає `{ ok: true, value: 12 }` для `\" 12 \"`: `value` має бути числом, а не текстом, і пробіли на краях треба прибрати перед перевіркою цифр."
          en: "This check expects `{ ok: true, value: 12 }` for `\" 12 \"`: `value` must be a number, not text, and the spaces at the edges must be removed before checking the digits."
      - when: { test: "accepts the boundaries 1 and 99" }
        message:
          uk: "Ця перевірка чекає, що `\"1\"` і `\"99\"` приймаються. Межі входять у дозволений діапазон: перевір, чи не стоїть `<=` там, де треба `<`."
          en: "This check expects `\"1\"` and `\"99\"` to be accepted. The bounds belong to the allowed range: check that there is no `<=` where `<` is needed."
      - when: { test: 'an empty field is "required"' }
        message:
          uk: "Ця перевірка чекає `{ ok: false, error: \"required\" }` для `\"\"` і `\"   \"`. `Number(\"\")` — це `0`, тож порожнє поле треба розпізнати **до** перетворення на число."
          en: "This check expects `{ ok: false, error: \"required\" }` for `\"\"` and `\"   \"`. `Number(\"\")` is `0`, so an empty field has to be recognized **before** turning text into a number."
      - when: { test: 'text that is not only digits is "not-a-number"' }
        message:
          uk: "Ця перевірка чекає `\"not-a-number\"` для `\"12px\"`, `\"1,5\"`, `\"2.5\"`, `\"0x10\"`, `\"1e1\"`, `\"-3\"` і `\"abc\"`. `parseInt` приймає `\"12px\"`, а `Number` — `\"0x10\"` і `\"1e1\"`: перевір, що кожен символ — цифра."
          en: "This check expects `\"not-a-number\"` for `\"12px\"`, `\"1,5\"`, `\"2.5\"`, `\"0x10\"`, `\"1e1\"`, `\"-3\"` and `\"abc\"`. `parseInt` accepts `\"12px\"`, and `Number` accepts `\"0x10\"` and `\"1e1\"`: check that every character is a digit."
      - when: { test: '0 and 100 are "out-of-range"' }
        message:
          uk: "Ця перевірка чекає `{ ok: false, error: \"out-of-range\" }` для `\"0\"` і `\"100\"`. Дозволено від 1 до 99 включно."
          en: "This check expects `{ ok: false, error: \"out-of-range\" }` for `\"0\"` and `\"100\"`. Allowed is 1 to 99 inclusive."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` з’являється, коли метод викликано не на тому значенні (наприклад, `trim` на числі), або коли програма зупинилася під час запуску й `parseQuantity` немає. Почни з першої помилки в консолі."
          en: "A `TypeError` appears when a method is called on the wrong kind of value (for example, `trim` on a number), or when the program stopped while starting and `parseQuantity` does not exist. Start with the first error in the console."

  - id: to-project
    kind: transfer
    capstoneStep: JS-12
    body:
      uk: "У формі твого проєкту є числове або датне поле. Наприкінці розділу ти зробиш його перевірку суворою: у трекері витрат `parseAmountMinor` дає `NaN` для `\"\"` чи `\"12,345\"`, а дата в планувальнику, трекері звичок і витрат має бути саме `\"YYYY-MM-DD\"` — порожнє поле не стає нулем, а `\"2026-3-2\"` — датою."
      en: "Your project’s form has a number or date field. At the end of this unit you will make its check strict: in the expense tracker `parseAmountMinor` gives `NaN` for `\"\"` or `\"12,345\"`, and a date in the planner, the habit tracker and the expense tracker must be exactly `\"YYYY-MM-DD\"` — an empty field does not become zero, and `\"2026-3-2\"` does not become a date."
