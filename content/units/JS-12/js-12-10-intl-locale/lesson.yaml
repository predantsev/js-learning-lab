id: js-12-10-intl-locale
unit: JS-12
title:
  uk: "Intl: локаль для показу, канонічні значення для зберігання"
  en: "Intl and locale vs canonical"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Форматувати суму в копійках і календарну дату через `Intl.NumberFormat` та `Intl.DateTimeFormat` для української й англійської локалей."
    en: "Format a minor-unit amount and a calendar date with `Intl.NumberFormat` and `Intl.DateTimeFormat` for uk and en."
  - uk: "Сортувати українські назви через `Intl.Collator` і пояснити, чому звичайний `sort` ставить «ґ», «є», «ї» не на свої місця."
    en: "Sort Ukrainian names with `Intl.Collator` and explain why the default sort misplaces letters such as `ґ`, `є` and `ї`."
  - uk: "Зберігати значення без локалі й перетворювати їх на текст лише під час показу."
    en: "Keep stored values locale-free and turn them into display text only when rendering."
prerequisites: [js-12-09-timezones-dst, js-12-05-integer-minor-units]
subskills:
  - { family: J-08, skill: "Intl date/number/collation", depth: intro }
  - { family: J-08, skill: "locale vs stored canonical values", depth: intro }
glossary: [intl, locale, collation, canonical-value]
selfCheck: [predict-format-sort, format-record]

blocks:
  - id: store-vs-show
    kind: explanation
    title:
      uk: "Зберігай число, показуй текст"
      en: "Store the number, show the text"
    body:
      uk: |
        Одна й та сама витрата для українського читача — «845,50 грн», а для американського — «UAH 845.50». Різниця — у [[locale|локалі]]: мовно-регіональних правилах на зразок `"uk-UA"` чи `"en-US"`. Вони визначають роздільник дробу, групування тисяч, назву валюти, назви місяців.

        Тому зберігають **[[canonical-value|канонічні значення]]**, однакові для всіх: `amountMinor: 84550`, `date: "2026-03-01"`. А текст для людини робить [[intl|Intl]] — вбудований набір форматерів — **лише в момент показу**:

        ```js
        const money = new Intl.NumberFormat("uk-UA", { style: "currency", currency: "UAH" });
        money.format(84550 / 100); // "845,50 грн"

        const day = new Intl.DateTimeFormat("uk-UA", { day: "numeric", month: "long", timeZone: "UTC" });
        day.format(new Date("2026-03-01")); // "1 березня"
        ```

        Ділення на 100 тут безпечне: результат одразу йде в текст, а форматер сам заокруглює до копійок. А `timeZone: "UTC"` тут обов’язковий: `new Date("2026-03-01")` читає календарну дату як північ за UTC, тож і показувати її треба в UTC — інакше в Нью-Йорку «1 березня» стане «28 лютого».

        Пробіли в такому тексті — особливі нерозривні (U+00A0), а точний вигляд залежить від браузера. Тому показаний текст ніколи не порівнюють і не розбирають назад.
      en: |
        The same expense is “845,50 грн” for a Ukrainian reader and “UAH 845.50” for an American one. The difference is the [[locale]]: language and region rules such as `"uk-UA"` or `"en-US"`. They decide the decimal separator, the grouping of thousands, the currency name, the month names.

        So what gets stored are **[[canonical-value|canonical values]]**, the same for everyone: `amountMinor: 84550`, `date: "2026-03-01"`. The text for a person is made by [[intl|Intl]] — a built-in set of formatters — **only at the moment of display**:

        ```js
        const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "UAH" });
        money.format(84550 / 100); // "UAH 845.50"

        const day = new Intl.DateTimeFormat("en-US", { day: "numeric", month: "long", timeZone: "UTC" });
        day.format(new Date("2026-03-01")); // "March 1"
        ```

        Dividing by 100 is safe here: the result goes straight into text, and the formatter itself rounds to kopiykas. And `timeZone: "UTC"` is required here: `new Date("2026-03-01")` reads the calendar date as midnight UTC, so it has to be shown in UTC too — otherwise in New York “1 March” becomes “28 February”.

        Spaces in such text are special no-break spaces (U+00A0), and the exact look depends on the browser. That is why displayed text is never compared or parsed back.

  - id: predict-format-sort
    kind: prediction
    prompt:
      uk: "Звичайний `sort()` без функції порівнює тексти за номерами code units. Що виведе код у Chrome?"
      en: "A plain `sort()` without a function compares texts by their code unit numbers. What does the code print in Chrome?"
    code: |
      const text = new Intl.NumberFormat("uk-UA", { style: "currency", currency: "UAH" }).format(125000 / 100);
      console.log(text.includes("грн"), text.includes("1250,00"), text.includes("1250.00"));
      const words = ["їжак", "яблуко", "груша", "ґанок"];
      console.log([...words].sort().join(" "));
      console.log([...words].sort(new Intl.Collator("uk").compare).join(" "));
    verify:
      logs: ["true false false", "груша яблуко їжак ґанок", "груша ґанок їжак яблуко"]
    answer:
      type: choice
      options:
        - id: real
          code: "true false false\nгруша яблуко їжак ґанок\nгруша ґанок їжак яблуко"
        - id: plain-number
          code: "true true false\nгруша яблуко їжак ґанок\nгруша ґанок їжак яблуко"
          why:
            uk: "Для `uk-UA` форматер групує тисячі пробілом: виходить `1 250,00 грн`, тож суцільного `1250,00` у тексті немає."
            en: "For `uk-UA` the formatter groups thousands with a space: the result is `1 250,00 грн`, so there is no unbroken `1250,00` in the text."
        - id: sort-alphabetical
          code: "true false false\nгруша ґанок їжак яблуко\nгруша ґанок їжак яблуко"
          why:
            uk: "`sort()` без функції не знає абетки. Літери «ї» та «ґ» мають у Unicode номери **після** «я», тому опиняються в кінці."
            en: "`sort()` without a function knows no alphabet. The letters “ї” and “ґ” have Unicode numbers **after** “я”, so they end up last."
        - id: collator-same
          code: "true false false\nгруша яблуко їжак ґанок\nгруша яблуко їжак ґанок"
          why:
            uk: "`Intl.Collator(\"uk\")` порівнює за правилами української абетки: «ґ» одразу після «г», «ї» перед «й»… і далі «я» в кінці."
            en: "`Intl.Collator(\"uk\")` compares by the rules of the Ukrainian alphabet: “ґ” right after “г”, “ї” before “й”… and “я” at the end."
      correct: [real]
    explanation:
      uk: "Форматер дав `1 250,00 грн` з нерозривними пробілами: «грн» є, а суцільного числа немає. `sort()` порівнює номери code units, і «ї» (U+0457) та «ґ» (U+0491) стоять у Unicode після «я» (U+044F). `Intl.Collator(\"uk\").compare` — функція порівняння за українською абеткою."
      en: "The formatter gave `1 250,00 грн` with no-break spaces: “грн” is there, but no unbroken number. `sort()` compares code unit numbers, and “ї” (U+0457) and “ґ” (U+0491) come after “я” (U+044F) in Unicode. `Intl.Collator(\"uk\").compare` is a comparison function for the Ukrainian alphabet."

  - id: collation
    kind: explanation
    title:
      uk: "Сортування за абеткою — теж локаль"
      en: "Alphabetical order is a locale too"
    body:
      uk: |
        Порядок літер — це [[collation|правила зіставлення]], і в кожної мови вони свої. `new Intl.Collator("uk").compare(a, b)` повертає від’ємне число, нуль чи додатне — саме те, чого чекає `sort`:

        ```js
        names.sort(new Intl.Collator("uk").compare);
        ```

        Те саме робить `a.localeCompare(b, "uk")`. Без локалі обидва беруть мову браузера, і в людей з різними налаштуваннями порядок може відрізнятися. Тому локаль передають явно.

        І знову: сортують **показ**. Збережений масив записів лишається таким, як був, а впорядкована копія йде на екран.
      en: |
        The order of letters is [[collation]] rules, and every language has its own. `new Intl.Collator("uk").compare(a, b)` returns a negative number, zero or a positive one — exactly what `sort` expects:

        ```js
        names.sort(new Intl.Collator("uk").compare);
        ```

        `a.localeCompare(b, "uk")` does the same. Without a locale both take the browser’s language, and people with different settings may get different orders. That is why the locale is passed explicitly.

        And again: it is the **display** that gets sorted. The stored array of records stays as it was, and a sorted copy goes to the screen.

  - id: display-edge
    kind: example
    runtime: browser-js
    dir: display-edge
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      unchanged: { uk: "Запис не змінився:", en: "The record is unchanged:" }
    entry: index.js
    title:
      uk: "Показ на краю"
      en: "Display at the edge"
    body:
      uk: |
        Запис витрати містить лише канонічні значення. Програма форматує суму й дату для `uk-UA`, сортує назви двома способами й наприкінці перевіряє, що запис не змінився. Запусти.
      en: |
        The expense record holds only canonical values. The program formats the amount and the date for `uk-UA`, sorts the names in two ways and finally checks that the record did not change. Run it.
    tryIt:
      uk: |
        1. Заміни `"uk-UA"` на `"en-US"` і запусти: сума, дата й порядок слів змінилися (англійські правила вважають «ґ» різновидом «г», тож «ґанок» стає перед «груша»), а останній рядок у консолі — знову `true`. Змінився лише показ.
        2. Додай до опцій суми `currencyDisplay: "narrowSymbol"`: замість назви валюти з’явиться знак `₴`.
      en: |
        1. Replace `"uk-UA"` with `"en-US"` and run: the amount, the date and the order of the words changed (English rules treat “ґ” as a variant of “г”, so “ґанок” moves before “груша”), and the last console line is `true` again. Only the display changed.
        2. Add `currencyDisplay: "narrowSymbol"` to the amount options: the currency sign `₴` appears instead of the currency name.

  - id: recall-comparator
    kind: review
    title:
      uk: "Пригадай: sort без функції"
      en: "Recall: sort without a function"
    items:
      - id: numbers-as-text
        from: js-05-05-sorting-comparator
        prompt:
          uk: "Що виведе цей рядок коду?"
          en: "What does this line print?"
        code: |
          console.log([10, 9, 1].sort());
        verify:
          logs: ["[1, 10, 9]"]
        answer:
          type: choice
          options:
            - id: as-text
              code: "[1, 10, 9]"
            - id: as-numbers
              code: "[1, 9, 10]"
              why:
                uk: "Без функції порівняння `sort` перетворює елементи на текст і порівнює текст: `\"10\"` стоїть перед `\"9\"`, бо `\"1\"` менше за `\"9\"`."
                en: "Without a comparison function `sort` turns elements into text and compares the text: `\"10\"` comes before `\"9\"` because `\"1\"` is less than `\"9\"`."
            - id: unchanged
              code: "[10, 9, 1]"
              why:
                uk: "`sort` змінює порядок і без функції — лише за текстовими правилами."
                en: "`sort` reorders even without a function — just by text rules."
          correct: [as-text]
        explanation:
          uk: "`sort()` без функції порівнює текстові записи за номерами code units. Для чисел потрібна функція `(a, b) => a - b`, а для слів мови — `Intl.Collator`."
          en: "`sort()` without a function compares text forms by code unit numbers. Numbers need the function `(a, b) => a - b`, and words of a language need `Intl.Collator`."

  - id: format-record
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: format-record
    entry: index.js
    strings:
      lunch: { uk: "Обід", en: "Lunch" }
    title:
      uk: "Текст для показу, запис без змін"
      en: "Display text, record unchanged"
    instructions:
      uk: |
        Перепиши `formatForDisplay(record, locale)`. Запис має поля `label`, `amountMinor` (копійки) і `date` (`"YYYY-MM-DD"`). Функція повертає **новий** об’єкт:

        - `label` — назва без змін;
        - `amount` — сума в гривнях: `Intl.NumberFormat` з опціями `{ style: "currency", currency: "UAH" }`;
        - `date` — дата: `Intl.DateTimeFormat` з `dateStyle: "long"`, і так, щоб день був той самий на комп’ютері в будь-якому часовому поясі.

        Сам запис змінювати не можна.
      en: |
        Rewrite `formatForDisplay(record, locale)`. The record has the fields `label`, `amountMinor` (kopiykas) and `date` (`"YYYY-MM-DD"`). The function returns a **new** object:

        - `label` — the label unchanged;
        - `amount` — the amount in hryvnias: `Intl.NumberFormat` with the options `{ style: "currency", currency: "UAH" }`;
        - `date` — the date: `Intl.DateTimeFormat` with `dateStyle: "long"`, so that the day is the same on a computer in any time zone.

        The record itself must not be changed.
    testTitles:
      "formats the amount in UAH for the locale":
        uk: "Форматує суму в гривнях для локалі"
        en: "Formats the amount in UAH for the locale"
      "formats the date in the long form for the locale":
        uk: "Форматує дату в довгій формі для локалі"
        en: "Formats the date in the long form for the locale"
      "shows the same calendar day on computers in New York and Tokyo":
        uk: "Показує той самий календарний день на комп’ютерах у Нью-Йорку й Токіо"
        en: "Shows the same calendar day on computers in New York and Tokyo"
      "keeps the label as it is":
        uk: "Лишає назву без змін"
        en: "Keeps the label as it is"
      "does not change the record":
        uk: "Не змінює запис"
        en: "Does not change the record"
    hints:
      nudge:
        uk: "Для кожного поля результату знайди форматер у поясненні. Яку опцію `Intl.DateTimeFormat` легко забути, коли твій комп’ютер у Києві?"
        en: "For each field of the result, find the formatter in the explanation. Which `Intl.DateTimeFormat` option is easy to forget when your computer is in Kyiv?"
      explanation:
        uk: "Форматери створюй усередині функції, з переданою `locale`. Копійки на гривні ділять лише для показу. Календарна дата `\"YYYY-MM-DD\"` через `new Date(...)` стає північчю за UTC — тож і показувати її треба з `timeZone`, що дорівнює тому самому поясу. Наприклад, `new Intl.DateTimeFormat(locale, { month: \"long\", timeZone: \"Asia/Tokyo\" })` показує місяць для Токіо, де б не стояв комп’ютер. Результат збирай у новий об’єкт, не записуючи нічого в `record`."
        en: "Create the formatters inside the function, with the given `locale`. Kopiykas are divided into hryvnias only for display. A calendar date `\"YYYY-MM-DD\"` becomes midnight UTC through `new Date(...)` — so it has to be shown with a `timeZone` equal to that same zone. For example, `new Intl.DateTimeFormat(locale, { month: \"long\", timeZone: \"Asia/Tokyo\" })` shows the month for Tokyo wherever the computer is. Collect the result in a new object without writing anything into `record`."
    solutionNote:
      uk: "Форматери отримують локаль, а дата — `timeZone: \"UTC\"`, той самий пояс, у якому `new Date(\"YYYY-MM-DD\")` читає дату. Результат — новий об’єкт, тож запис лишається канонічним: `21050` копійок і `\"2026-03-02\"`. Варіант із `toLocaleString`/`toLocaleDateString` і тими самими опціями дає той самий текст. Працює й інша пара: `new Date(рік, місяць - 1, день)` — місцева північ — і форматер без `timeZone`, тобто теж у місцевому часі. Не можна лише змішувати: момент в UTC, а показ у місцевому часі, чи навпаки."
      en: "The formatters get the locale, and the date gets `timeZone: \"UTC\"`, the same zone in which `new Date(\"YYYY-MM-DD\")` reads the date. The result is a new object, so the record stays canonical: `21050` kopiykas and `\"2026-03-02\"`. A version with `toLocaleString`/`toLocaleDateString` and the same options gives the same text. Another pair works too: `new Date(year, month - 1, day)` — local midnight — and a formatter without `timeZone`, that is, local time as well. What fails is mixing them: an instant in UTC shown in local time, or the other way round."
    feedback:
      - when: { test: "formats the amount in UAH for the locale" }
        message:
          uk: "Ця перевірка чекає суму з `Intl.NumberFormat(locale, { style: \"currency\", currency: \"UAH\" })` для `21050` копійок — у гривнях, тобто поділеною на 100 — для `uk-UA` та `en-US`."
          en: "This check expects the amount from `Intl.NumberFormat(locale, { style: \"currency\", currency: \"UAH\" })` for `21050` kopiykas — in hryvnias, that is divided by 100 — for `uk-UA` and `en-US`."
      - when: { test: "formats the date in the long form for the locale" }
        message:
          uk: "Ця перевірка чекає дату з `dateStyle: \"long\"` для переданої локалі — наприклад, «2 березня 2026 р.» для `uk-UA`. Перевір, що форматер отримує `locale`, а не фіксовану мову."
          en: "This check expects the date with `dateStyle: \"long\"` for the given locale — for example, “March 2, 2026” for `en-US`. Check that the formatter gets `locale`, not a fixed language."
      - when: { test: "shows the same calendar day on computers in New York and Tokyo" }
        message:
          uk: "Ця перевірка показує `\"2026-03-01\"` так, ніби комп’ютер стоїть у Нью-Йорку, а потім у Токіо, і щоразу чекає 1 березня. Момент і показ мають бути в одному поясі: `new Date(\"2026-03-01\")` — північ за UTC, тож показуй її з `timeZone: \"UTC\"`; без нього в Нью-Йорку вийде 28 лютого."
          en: "This check shows `\"2026-03-01\"` as if the computer were in New York, then in Tokyo, and expects 1 March both times. The instant and the display must use one zone: `new Date(\"2026-03-01\")` is midnight UTC, so show it with `timeZone: \"UTC\"`; without it, New York gets 28 February."
      - when: { test: "keeps the label as it is" }
        message:
          uk: "Ця перевірка чекає, що `label` у результаті дорівнює назві із запису без змін."
          en: "This check expects `label` in the result to equal the record’s label unchanged."
      - when: { test: "does not change the record" }
        message:
          uk: "Ця перевірка двічі форматує той самий запис і чекає, що він лишився `{ label, amountMinor: 21050, date: \"2026-03-02\" }`. Не записуй текст у поля `record` — збирай новий об’єкт."
          en: "This check formats the same record twice and expects it to stay `{ label, amountMinor: 21050, date: \"2026-03-02\" }`. Do not write text into the fields of `record` — build a new object."
      - when: { error: RangeError }
        message:
          uk: "`RangeError` від `Intl` означає неправильну опцію чи значення: наприклад, назву валюти не з трьох літер, невідомий `timeZone` або `Invalid time value`, коли дату розібрано неправильно. Порівняй опції з поясненням."
          en: "A `RangeError` from `Intl` means a wrong option or value: for example, a currency code that is not three letters, an unknown `timeZone`, or `Invalid time value` when the date was parsed wrongly. Compare the options with the explanation."

  - id: to-project
    kind: transfer
    capstoneStep: JS-12
    body:
      uk: "У проєкті числа й дати досі показуються як є. Наприкінці розділу ти винесеш їх показ у `ui/format.js` через `Intl` із мовою проєкту `LOCALE`, а в сховищі лишаться числа й тексти `\"YYYY-MM-DD\"`: перевірки порівнюють твій формат для `\"uk-UA\"` і `\"en-US\"`."
      en: "In your project numbers and dates are still shown as they are. At the end of this unit you will move their display into `ui/format.js` through `Intl` with the project's `LOCALE`, while the storage keeps numbers and `\"YYYY-MM-DD\"` texts: the checks compare your format for `\"uk-UA\"` and `\"en-US\"`."
