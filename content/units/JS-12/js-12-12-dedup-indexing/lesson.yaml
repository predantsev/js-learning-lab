id: js-12-12-dedup-indexing
unit: JS-12
title:
  uk: "Усунення дублікатів та індексування"
  en: "Dedup and indexing"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Прибирати дублікати за обраним ключем (`id` чи нормалізованою назвою) через `Set`, лишаючи перший запис."
    en: "Remove duplicates by a chosen key (id or normalized name) with a Set, keeping the first occurrence."
  - uk: "Один раз будувати індекс `id → запис` замість повторних викликів `find` і знати, коли індекс треба збудувати знову."
    en: "Build an id → record index once to replace repeated `find()` calls, and state when the index must be rebuilt."
prerequisites: [js-12-11-map-set, js-05-06-search-complexity]
subskills:
  - { family: J-09, skill: "dedup/indexing", depth: intro }
glossary: [deduplication, lookup-index]
selfCheck: [predict-dedup, index-and-dedup]

blocks:
  - id: by-what-key
    kind: explanation
    title:
      uk: "Дублікат — за яким ключем?"
      en: "A duplicate by which key?"
    body:
      uk: |
        `new Set(records)` дублікатів записів **не** прибирає: записи — об’єкти, а `Set` порівнює їх за посиланням. Два окремо завантажені `{ id: "h-01", … }` для нього різні.

        Тому [[deduplication|усунення дублікатів]] починають з питання: **що робить два записи однаковими?** Той самий `id`? Та сама назва, незалежно від регістру й пробілів? Відповідь — це функція-ключ:

        - за `id`: `(habit) => habit.id`;
        - за назвою: `(habit) => habit.name.trim().toLowerCase()`.

        Далі записи проходять по черзі, а `Set` уже побачених ключів вирішує: ключ новий — запис лишається, ключ уже був — запис відкидається. Так лишається **перший** запис кожного ключа, у початковому порядку.
      en: |
        `new Set(records)` does **not** remove duplicate records: records are objects, and a `Set` compares them by reference. Two separately loaded `{ id: "h-01", … }` are different to it.

        So [[deduplication]] starts with a question: **what makes two records the same?** The same `id`? The same name, regardless of case and spaces? The answer is a key function:

        - by `id`: `(habit) => habit.id`;
        - by name: `(habit) => habit.name.trim().toLowerCase()`.

        Then the records go through one by one, and a `Set` of keys seen so far decides: a new key — the record stays; a key seen before — the record is dropped. That keeps the **first** record of every key, in the original order.

  - id: predict-dedup
    kind: prediction
    strings:
      water: { uk: "Пити воду", en: "Drink water" }
      waterShout: { uk: "ПИТИ ВОДУ ", en: "DRINK WATER " }
      read: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
    prompt:
      uk: "Запис `h-01` завантажено двічі (два окремі об’єкти), а `h-07` — та сама звичка з іншим регістром. Що виведе код?"
      en: "Record `h-01` was loaded twice (two separate objects), and `h-07` is the same habit in another case. What does the code print?"
    code: |
      const habits = [
        { id: "h-01", name: "%%water%%" },
        { id: "h-01", name: "%%water%%" },
        { id: "h-07", name: "%%waterShout%%" },
        { id: "h-02", name: "%%read%%" },
      ];
      console.log(new Set(habits).size);
      console.log(new Set(habits.map((habit) => habit.id)).size);
      console.log(new Set(habits.map((habit) => habit.name.trim().toLowerCase())).size);
    verify:
      logs: ["4", "3", "2"]
    answer:
      type: choice
      options:
        - id: by-key
          code: "4\n3\n2"
        - id: set-dedups-objects
          code: "3\n3\n2"
          why:
            uk: "`Set` порівнює об’єкти за посиланням. Два записи `h-01` — два різні об’єкти, тож у `new Set(habits)` їх обидва."
            en: "A `Set` compares objects by reference. The two `h-01` records are two different objects, so both are in `new Set(habits)`."
        - id: name-case
          code: "4\n3\n3"
          why:
            uk: "Після `trim()` і `toLowerCase()` назва `h-07` збігається з назвою `h-01`, тож за назвою унікальних лише дві."
            en: "After `trim()` and `toLowerCase()` the name of `h-07` equals the name of `h-01`, so by name there are only two unique ones."
        - id: id-ignores
          code: "4\n4\n2"
          why:
            uk: "`habits.map(...)` дає масив текстових `id`, а текст `Set` порівнює за значенням: `\"h-01\"` двічі — це один елемент."
            en: "`habits.map(...)` gives an array of text `id`s, and a `Set` compares text by value: `\"h-01\"` twice is one element."
      correct: [by-key]
    explanation:
      uk: "Об’єкти в `Set` — за посиланням: усі 4 різні. Текстові `id` — за значенням: 3 різні. Нормалізовані назви — 2. Тож «скільки дублікатів» залежить від ключа, який ти обираєш."
      en: "Objects in a `Set` go by reference: all 4 differ. Text `id`s go by value: 3 differ. Normalized names: 2. So “how many duplicates” depends on the key you choose."

  - id: dedup-flow
    kind: visual
    visual: pipeline
    strings:
      water: { uk: "Пити воду", en: "Drink water" }
      waterShout: { uk: "  ПИТИ ВОДУ ", en: "  DRINK WATER " }
      read: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
    title:
      uk: "Ключ, ворота «вже бачили» і індекс"
      en: "A key, a “seen before” gate and an index"
    textEquivalent:
      uk: "На вході п’ять звичок: h-01 «%%water%%», h-02 «%%read%%», ще раз h-01 «%%water%%» (окремий об’єкт), h-07 «%%waterShout%%» і h-03 «%%walk%%». Перший етап додає кожній звичці ключ — назву без пробілів на краях і в нижньому регістрі. Другий етап — ворота з набором уже побачених ключів: перша h-01 проходить і її ключ потрапляє в набір; h-02 проходить; друга h-01 має той самий ключ і відкидається; h-07 після нормалізації має той самий ключ, що й h-01, і теж відкидається; h-03 проходить. Лишаються три звички в початковому порядку. Третій етап один раз складає їх в індекс id → назва: h-01, h-02, h-03. Після цього знайти звичку за id — один крок, тоді як find для кожного пошуку проходить список від початку."
      en: "The input is five habits: h-01 “%%water%%”, h-02 “%%read%%”, h-01 “%%water%%” again (a separate object), h-07 “%%waterShout%%” and h-03 “%%walk%%”. The first stage gives every habit a key — the name without spaces at the edges, in lower case. The second stage is a gate with a set of keys seen so far: the first h-01 passes and its key goes into the set; h-02 passes; the second h-01 has the same key and is dropped; h-07, once normalized, has the same key as h-01 and is dropped too; h-03 passes. Three habits remain, in the original order. The third stage puts them into an id → name index once: h-01, h-02, h-03. After that, finding a habit by id is one step, while find walks the list from the start for every search."
    spec:
      input:
        label: { uk: "Звички з дублікатами", en: "Habits with duplicates" }
        items:
          - { id: "h-01", name: "%%water%%" }
          - { id: "h-02", name: "%%read%%" }
          - { id: "h-01", name: "%%water%%" }
          - { id: "h-07", name: "%%waterShout%%" }
          - { id: "h-03", name: "%%walk%%" }
        show: "habit => habit.id + ' · ' + JSON.stringify(habit.name)"
        caption:
          uk: "П’ять звичок. Друга `h-01` — окремий об’єкт з тим самим вмістом, а `h-07` — та сама назва великими літерами й з пробілами."
          en: "Five habits. The second `h-01` is a separate object with the same contents, and `h-07` is the same name in capitals and with spaces."
      stages:
        - op: map
          fn: "(habit) => ({ ...habit, key: habit.name.trim().toLowerCase() })"
          label: "key = name.trim().toLowerCase()"
          show: "habit => habit.id + ' · ' + habit.key"
          caption:
            uk: "Кожна звичка отримує ключ порівняння: назву без пробілів на краях і в нижньому регістрі. Тепер у `h-07` такий самий ключ, як у `h-01`."
            en: "Every habit gets a comparison key: the name without edge spaces, in lower case. Now `h-07` has the same key as `h-01`."
        - op: filter
          fn: "((seen) => (habit) => { if (seen.has(habit.key)) { return false; } seen.add(habit.key); return true; })(new Set())"
          label: "seen.has(key) ? drop : add and keep"
          perItem: true
          caption:
            uk: "Ворота «цей ключ трапився вперше?»: `{item}` → **{result}** (елемент {index} з {count}). `true` — запис лишається, `false` — відкидається."
            en: "The gate “is this key new?”: `{item}` → **{result}** (item {index} of {count}). `true` keeps the record, `false` drops it."
          summary:
            uk: "Пройшли {result} з {count}: перший запис кожного ключа, у початковому порядку. Кожна перевірка — один `seen.has`, без проходу всім списком."
            en: "{result} of {count} passed: the first record of every key, in the original order. Each check is one `seen.has`, without walking the whole list."
        - op: reduce
          fn: "(index, habit) => ({ ...index, [habit.id]: habit.name })"
          label: "index.set(habit.id, habit)"
          initial: {}
          show: "index => Object.keys(index).join(', ')"
          caption:
            uk: "Один прохід складає індекс `id → запис` (тут показано лише ключі). Далі пошук за `id` — один крок, а не прохід списком, як у `find`. Але індекс — знімок: після зміни записів його будують знову."
            en: "One pass builds the `id → record` index (only its keys are shown here). From now on a lookup by `id` is one step, not a walk through the list as with `find`. But the index is a snapshot: after the records change, it is built again."

  - id: build-once
    kind: explanation
    title:
      uk: "Індекс: збудувати раз, будувати знову після змін"
      en: "An index: build once, rebuild after changes"
    body:
      uk: |
        Якщо за якимось ключем шукають багато разів, вигідно один раз зібрати [[lookup-index|індекс]] — `Map` від ключа до запису. Найчастіше ключ — `id`; ось той самий прийом для пошуку за назвою:

        ```js
        const byLabel = new Map(expenses.map((expense) => [expense.label, expense]));
        byLabel.get("Обід"); // запис, за один крок
        ```

        `new Map(pairs)` приймає масив пар `[key, value]`. Індекс тримає **посилання** на ті самі об’єкти, а не копії.

        Але індекс — це **знімок** списку на момент побудови. Додав чи видалив запис, замінив його новим об’єктом — старий індекс про це не знає. Правило: після кожної зміни списку індекс будують заново (або змінюють разом зі списком в одному місці коду).
      en: |
        If you search by some key many times, it pays to collect a [[lookup-index|lookup index]] once — a `Map` from the key to the record. Most often the key is the `id`; here is the same trick for a lookup by label:

        ```js
        const byLabel = new Map(expenses.map((expense) => [expense.label, expense]));
        byLabel.get("Lunch"); // the record, in one step
        ```

        `new Map(pairs)` takes an array of `[key, value]` pairs. The index holds **references** to the same objects, not copies.

        But an index is a **snapshot** of the list at the moment it was built. Add or remove a record, replace one with a new object — the old index knows nothing about it. The rule: after every change of the list, the index is built again (or changed together with the list in one place of the code).

  - id: index-vs-find
    kind: example
    runtime: browser-js
    dir: index-vs-find
    entry: index.js
    strings:
      withFind: { uk: "Порівнянь із find:", en: "Comparisons with find:" }
    title:
      uk: "100 пошуків: find проти індексу"
      en: "100 lookups: find versus an index"
    body:
      uk: |
        Тисяча витрат і сто пошуків за `id` через `find`. Лічильник рахує кожне порівняння. Запусти.
      en: |
        A thousand expenses and a hundred lookups by `id` with `find`. The counter counts every comparison. Run it.
    tryIt:
      uk: |
        1. Збудуй індекс один раз і повтори ті самі пошуки. Допиши в кінець:

           ```js
           const byId = new Map(records.map((record) => [record.id, record]));
           const found = wanted.map((id) => byId.get(id));
           console.log(found.length, records.length + wanted.length);
           ```

           Друге число — кроки: 1000 на побудову й 100 на пошуки, порівняно з 50 500 порівняннями `find`.
        2. Тепер додай новий запис **після** побудови індексу: `records.push({ id: "e-1001", amountMinor: 5 });` і виведи `byId.get("e-1001")`. Буде `undefined`: індекс — знімок. Збудуй його знову після `push` — і запис знайдеться.
      en: |
        1. Build an index once and repeat the same lookups. Add at the end:

           ```js
           const byId = new Map(records.map((record) => [record.id, record]));
           const found = wanted.map((id) => byId.get(id));
           console.log(found.length, records.length + wanted.length);
           ```

           The second number is the steps: 1000 to build and 100 to look up, compared with 50,500 comparisons for `find`.
        2. Now add a new record **after** building the index: `records.push({ id: "e-1001", amountMinor: 5 });` and print `byId.get("e-1001")`. It is `undefined`: the index is a snapshot. Build it again after the `push` — and the record is found.

  - id: recall-search-cost
    kind: review
    title:
      uk: "Пригадай: ціна повторного пошуку"
      en: "Recall: the cost of repeated search"
    items:
      - id: repeated-find
        from: js-05-06-search-complexity
        prompt:
          uk: "У списку `n` записів, і для кожного з них викликають `find` по тому самому списку. Як росте кількість порівнянь у найгіршому випадку?"
          en: "A list has `n` records, and for each of them `find` is called on the same list. How does the number of comparisons grow in the worst case?"
        answer:
          type: choice
          options:
            - id: quadratic
              text:
                uk: "Приблизно `n × n`: подвоїш список — роботи вчетверо більше"
                en: "About `n × n`: double the list and the work grows fourfold"
            - id: linear
              text:
                uk: "Приблизно `n`: кожен `find` — один крок"
                en: "About `n`: every `find` is one step"
              why:
                uk: "`find` — лінійний пошук: у найгіршому випадку він проходить усі `n` записів. `n` таких пошуків — це `n × n`."
                en: "`find` is a linear search: in the worst case it walks all `n` records. `n` such searches make `n × n`."
            - id: constant
              text:
                uk: "Не росте: вбудовані методи працюють миттєво"
                en: "It does not grow: built-in methods are instant"
              why:
                uk: "Вбудований `find` перевіряє записи по одному, як і власний цикл."
                en: "The built-in `find` checks records one by one, like a hand-written loop."
          correct: [quadratic]
        explanation:
          uk: "Кожен `find` у найгіршому випадку — `n` порівнянь, а пошуків теж `n`. Індекс `Map` перетворює це на `n` кроків побудови й по одному кроку на пошук."
          en: "Each `find` is up to `n` comparisons in the worst case, and there are `n` searches. A `Map` index turns that into `n` steps to build and one step per lookup."

  - id: index-and-dedup
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: index-and-dedup
    entry: index.js
    strings:
      water: { uk: "Пити воду", en: "Drink water" }
      read: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      waterShout: { uk: "  ПИТИ ВОДУ ", en: "  DRINK WATER " }
    title:
      uk: "Індекс і дублікати"
      en: "An index and duplicates"
    instructions:
      uk: |
        Допиши дві функції:

        1. `indexById(records)` повертає `Map` від `id` до **самого запису** (не копії). Якщо `id` повторюється, лишається перший запис. Кожен виклик будує індекс із тих записів, які йому передали.
        2. `dedupBy(records, keyFn)` повертає **новий** масив без повторів: два записи — повтори, коли `keyFn` дає їм той самий ключ. Лишається перший запис кожного ключа, у початковому порядку. Вхідний масив не змінюй.
      en: |
        Finish two functions:

        1. `indexById(records)` returns a `Map` from `id` to **the record itself** (not a copy). If an `id` repeats, the first record stays. Every call builds the index from the records it was given.
        2. `dedupBy(records, keyFn)` returns a **new** array without repeats: two records are repeats when `keyFn` gives them the same key. The first record of every key stays, in the original order. Do not change the input array.
    testTitles:
      "indexById returns a Map from id to the record itself":
        uk: "`indexById` повертає `Map` від `id` до самого запису"
        en: "`indexById` returns a `Map` from `id` to the record itself"
      "indexById keeps the first record of a repeated id":
        uk: "`indexById` лишає перший запис повтореного `id`"
        en: "`indexById` keeps the first record of a repeated `id`"
      "a new index follows the records after an update":
        uk: "Новий індекс відповідає записам після оновлення"
        en: "A new index follows the records after an update"
      "dedupBy by id keeps the first of each id, in order":
        uk: "`dedupBy` за `id` лишає перший запис кожного `id` у порядку"
        en: "`dedupBy` by `id` keeps the first of each `id`, in order"
      "dedupBy by a normalized name drops a case variant":
        uk: "`dedupBy` за нормалізованою назвою відкидає варіант з іншим регістром"
        en: "`dedupBy` by a normalized name drops a case variant"
      "dedupBy returns a new array and leaves the input alone":
        uk: "`dedupBy` повертає новий масив і не чіпає вхідний"
        en: "`dedupBy` returns a new array and leaves the input alone"
    hints:
      nudge:
        uk: "Чому `[...new Set(records)]` не прибирає двох `h-01`? Що треба покласти в `Set` замість самих записів?"
        en: "Why does `[...new Set(records)]` not remove the two `h-01`s? What should go into the `Set` instead of the records themselves?"
      explanation:
        uk: "Для `dedupBy` тримай `Set` уже побачених **ключів** і новий масив результатів: для кожного запису обчисли ключ, і лише якщо його ще не було — запам’ятай ключ і додай запис. Схоже рахують неповторні слова в тексті: слово, яке вже є в наборі, пропускають. Для `indexById` «перший виграє» означає: перед `set` перевір, чи такого `id` ще немає. Індекс будуй усередині функції щоразу — не зберігай його між викликами."
        en: "For `dedupBy`, keep a `Set` of **keys** seen so far and a new result array: for every record compute its key, and only if it has not been seen — remember the key and add the record. Counting distinct words in a text works alike: a word already in the set is skipped. For `indexById`, “the first wins” means: before `set`, check that the `id` is not there yet. Build the index inside the function every time — do not keep it between calls."
    solutionNote:
      uk: "`dedupBy` кладе в `Set` ключі, а не записи — тому однаковий вміст у різних об’єктах розпізнається, а перевірка «вже бачили?» — один крок. Варіант через `indexOf` по масиву ключів теж правильний, але для кожного запису проходить ключі від початку — `n × n` роботи. Індекс будується щоразу з переданого списку, тож відповідає саме йому; індекс, збережений «на потім», показував би старі записи."
      en: "`dedupBy` puts keys, not records, into the `Set` — so equal contents in different objects are recognized, and the “seen before?” check is one step. A version with `indexOf` over the array of keys is correct too, but for every record it walks the keys from the start — `n × n` work. The index is built every time from the given list, so it matches exactly that list; an index saved “for later” would show old records."
    feedback:
      - when: { test: "indexById returns a Map from id to the record itself" }
        message:
          uk: "Ця перевірка чекає `Map`, де `get(\"h-02\")` — той самий об’єкт, що в списку (не копія), а `get(\"h-99\")` — `undefined`."
          en: "This check expects a `Map` whose `get(\"h-02\")` is the same object as in the list (not a copy), and whose `get(\"h-99\")` is `undefined`."
      - when: { test: "indexById keeps the first record of a repeated id" }
        message:
          uk: "Ця перевірка чекає для `h-01` перший запис списку і рівно 4 ключі. Якщо бачиш другий `h-01`, повторний `set` замінив значення: перед ним перевір `has`."
          en: "This check expects the first record of the list for `h-01` and exactly 4 keys. If you see the second `h-01`, a repeated `set` replaced the value: check `has` before it."
      - when: { test: "a new index follows the records after an update" }
        message:
          uk: "Ця перевірка будує індекс для одного списку, а потім для оновленого й чекає новий запис `h-02`, доданий `h-04` і відсутній `h-03`. Якщо індекс збережено між викликами, він показує старі записи: будуй його щоразу з переданого списку."
          en: "This check builds an index for one list, then for the updated one, and expects the new `h-02`, the added `h-04` and no `h-03`. If the index is kept between calls, it shows the old records: build it every time from the given list."
      - when: { test: "dedupBy by id keeps the first of each id, in order" }
        message:
          uk: "Ця перевірка чекає `id` у порядку `h-01`, `h-02`, `h-07`, `h-03`, і перший `h-01` — той самий об’єкт, що на початку списку. `new Set(records)` не прибирає окремі об’єкти з однаковим вмістом — порівнюй ключі."
          en: "This check expects the `id`s in the order `h-01`, `h-02`, `h-07`, `h-03`, with the kept `h-01` being the very object at the start of the list. `new Set(records)` does not remove separate objects with equal contents — compare keys."
      - when: { test: "dedupBy by a normalized name drops a case variant" }
        message:
          uk: "Ця перевірка передає ключ «назва без пробілів у нижньому регістрі» і чекає `h-01`, `h-02`, `h-03`. Порівнюй саме те, що повертає `keyFn`."
          en: "This check passes the key “name without spaces, in lower case” and expects `h-01`, `h-02`, `h-03`. Compare exactly what `keyFn` returns."
      - when: { test: "dedupBy returns a new array and leaves the input alone" }
        message:
          uk: "Ця перевірка чекає новий масив (не той самий), незмінений вхідний масив і `[]` для порожнього списку. Не видаляй елементи з `records` через `splice`."
          en: "This check expects a new array (not the same one), an unchanged input array and `[]` for an empty list. Do not remove elements from `records` with `splice`."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` з’являється, коли метод викликано на `undefined` (наприклад, `index.get`, бо `indexById` нічого не повертає, чи `keyFn` не передано), або коли програма зупинилася під час запуску. Почни з першої помилки в консолі."
          en: "A `TypeError` appears when a method is called on `undefined` (for example, `index.get` because `indexById` returns nothing, or `keyFn` was not passed), or when the program stopped while starting. Start with the first error in the console."

  - id: to-project
    kind: transfer
    capstoneStep: JS-12
    body:
      uk: "Наприкінці розділу сторінка твого проєкту будуватиме індекс `indexById` (`Map` за `id`, перший із двох однакових `id` лишається) під час кожного показу списку, а кнопка «Редагувати» братиме запис через `get(id)` замість пошуку в масиві."
      en: "At the end of this unit your project’s page will build the `indexById` index (a `Map` by `id`, of two equal `id`s the first stays) on every render of the list, and the “Edit” button will take the record with `get(id)` instead of searching the array."
