id: js-12-15-independent-data-semantics
unit: JS-12
title:
  uk: "Самостійно: безпечні підписи, суми, локалізований показ, вибір колекції"
  en: "Independent: safe labels, totals, locale display, collection choice"
kind: assessment
minutes: 35
contentVersion: 1
purpose:
  uk: "Самостійно поєднати все з цього розділу в одній реальній задачі — Unicode-безпечні підписи й пошук, точну суму в копійках, показ через `Intl` без змін у даних і індекс за `id` — і показати, що ти свідомо обираєш колекцію під потребу й знаєш межі слабких колекцій."
  en: "Combine everything from this unit on your own in one real task — Unicode-safe labels and search, an exact total in kopiykas, display through `Intl` without changing the data and an index by `id` — and show that you choose a collection for a need on purpose and know the limits of weak collections."
objectives:
  - uk: "Без підказок реалізувати Unicode-безпечні підписи й пошук, цілу суму в копійках і показ лише через локаль на синтетичних записах, які перевіряють приховані тести."
    en: "Implement, without hints, Unicode-safe labels and search, an integer minor-unit total and locale-only display over synthetic records, verified by hidden tests."
  - uk: "Обрати й обґрунтувати об’єкт, `Map`, `Set` чи `WeakMap` для чотирьох потреб і пояснити, чому слабка колекція не може тримати порахований прогрес."
    en: "Choose and justify an object, `Map`, `Set` or `WeakMap` for four stated needs, and explain why a weak collection cannot hold counted progress."
prerequisites: [js-12-14-debug-boundary-fixtures]
subskills:
  - { family: J-07, skill: "string immutability and Unicode code units/code points", depth: assess }
  - { family: J-07, skill: "normalization awareness", depth: assess }
  - { family: J-07, skill: "integer minor units", depth: assess }
  - { family: J-08, skill: "Intl date/number/collation", depth: assess }
  - { family: J-08, skill: "locale vs stored canonical values", depth: assess }
  - { family: J-09, skill: "Map/Set key/equality/iteration semantics", depth: assess }
  - { family: J-09, skill: "object vs Map", depth: assess }
  - { family: J-09, skill: "dedup/indexing", depth: assess }
  - { family: J-09, skill: "WeakMap/WeakSet lifecycle limits", depth: assess }
  - { family: J-09, skill: "no deterministic weak enumeration/GC assumptions", depth: assess }
glossary: []
selfCheck: [summarize, pick-progress, why-weak]

blocks:
  - id: the-task
    kind: explanation
    title:
      uk: "Що перевіряє цей урок"
      en: "What this lesson checks"
    body:
      uk: |
        Тут ти працюєш **без підказок**: умова, редактор і перевірки. Знадобиться весь розділ: code points, нормалізація, копійки замість дробів, `Intl` з явним поясом, `Map` і `Set`.

        Перевірки запускають твою функцію на **власних** записах, а не лише на прикладі з редактора: з емодзі в назвах, із літерою, записаною двома code points, з повтореним `id` і сумою `"0,10"`. Вони також показують дати так, ніби комп’ютер стоїть у Нью-Йорку, і перевіряють, що записи після показу двома мовами не змінилися.

        Наприкінці — п’ять коротких питань про вибір колекції.
      en: |
        Here you work **without hints**: the task, the editor and the checks. You will need the whole unit: code points, normalization, kopiykas instead of fractions, `Intl` with an explicit zone, `Map` and `Set`.

        The checks run your function on **their own** records, not only on the example in the editor: with emoji in labels, with a letter written as two code points, with a repeated `id` and the amount `"0,10"`. They also show dates as if the computer were in New York, and check that the records did not change after being displayed in two languages.

        At the end come five short questions on choosing a collection.

  - id: summarize
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: summarize
    entry: index.js
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      locale: { uk: "uk-UA", en: "en-US" }
    title:
      uk: "Підсумок витрат"
      en: "An expense summary"
    instructions:
      uk: |
        Записи витрат приходять із форми чи імпорту: `{ id, label, amountText, date }`. `amountText` — введена сума в гривнях: цифри, можливо кома або крапка й одна чи дві цифри після неї (`"845,50"`, `"0,10"`, `"99.9"`, `"520"`). `date` — `"YYYY-MM-DD"`. Усі суми в записах правильні й більші за нуль.

        Напиши `summarize(records, locale)`, що повертає об’єкт із п’ятьма полями:

        | Поле | Що містить |
        |---|---|
        | `byId` | `Map` від `id` до **самого запису**; якщо `id` повторюється, лишається перший запис, решта ігнорується всюди нижче |
        | `count` | кількість записів у `byId` |
        | `totalMinor` | сума всіх записів у `byId` у копійках — ціле число, без дробових проміжних значень |
        | `display` | масив `{ id, label, amount, date }` у порядку записів із `byId` |
        | `search` | функція `search(query)`, що повертає масив `id` записів із `byId`, у назві яких трапляється запит |

        Для `display`:

        - `label` — назва; якщо в ній більше 20 code points, то перші 20 code points і `"…"`;
        - `amount` — `Intl.NumberFormat(locale, { style: "currency", currency: "UAH" })` для суми в гривнях;
        - `date` — `Intl.DateTimeFormat(locale, { dateStyle: "medium" })`, той самий календарний день у будь-якому часовому поясі.

        `search` не зважає на регістр, пробіли на краях запиту й на те, як записано літери на зразок «й» (одним code point чи двома); порожній запит повертає всі `id`.

        Записи, які отримала функція, змінювати не можна.
      en: |
        Expense records arrive from a form or an import: `{ id, label, amountText, date }`. `amountText` is the typed amount in hryvnias: digits, possibly a comma or a dot and one or two digits after it (`"845,50"`, `"0,10"`, `"99.9"`, `"520"`). `date` is `"YYYY-MM-DD"`. All amounts in the records are valid and greater than zero.

        Write `summarize(records, locale)`, which returns an object with five fields:

        | Field | What it holds |
        |---|---|
        | `byId` | a `Map` from `id` to **the record itself**; if an `id` repeats, the first record stays and the rest are ignored everywhere below |
        | `count` | the number of records in `byId` |
        | `totalMinor` | the total of all records in `byId` in kopiykas — a whole number, with no fractional intermediate values |
        | `display` | an array of `{ id, label, amount, date }` in the order of the records in `byId` |
        | `search` | a function `search(query)` that returns an array of the `id`s of records in `byId` whose label contains the query |

        For `display`:

        - `label` — the label; if it has more than 20 code points, the first 20 code points and `"…"`;
        - `amount` — `Intl.NumberFormat(locale, { style: "currency", currency: "UAH" })` for the amount in hryvnias;
        - `date` — `Intl.DateTimeFormat(locale, { dateStyle: "medium" })`, the same calendar day in any time zone.

        `search` ignores letter case, spaces at the edges of the query and how letters such as “й” are written (one code point or two); an empty query returns all `id`s.

        The records the function receives must not be changed.
    testTitles:
      "byId is a Map in which the first record of a repeated id wins":
        uk: "`byId` — `Map`, де перемагає перший запис повтореного `id`"
        en: "`byId` is a `Map` in which the first record of a repeated `id` wins"
      "totalMinor is an exact whole number of kopiykas":
        uk: "`totalMinor` — точне ціле число копійок"
        en: "`totalMinor` is an exact whole number of kopiykas"
      '"0,10" is ten kopiykas':
        uk: "`\"0,10\"` — це десять копійок"
        en: "`\"0,10\"` is ten kopiykas"
      "display amounts and dates follow the locale":
        uk: "Суми й дати в `display` відповідають локалі"
        en: "`display` amounts and dates follow the locale"
      "display dates are the same calendar day in New York":
        uk: "Дати в `display` — той самий календарний день у Нью-Йорку"
        en: "`display` dates are the same calendar day in New York"
      "long labels are cut at 20 code points without breaking an emoji":
        uk: "Довгі назви обрізаються на 20 code points, не ламаючи емодзі"
        en: "Long labels are cut at 20 code points without breaking an emoji"
      "search ignores case, spaces and how letters were typed":
        uk: "`search` не зважає на регістр, пробіли й спосіб запису літер"
        en: "`search` ignores case, spaces and how letters were typed"
      "switching the locale leaves the records unchanged":
        uk: "Зміна локалі не змінює записи"
        en: "Switching the locale leaves the records unchanged"
    solutionNote:
      uk: "Індекс будується один раз і стає єдиним джерелом записів для решти полів — так повтор `id` ніде не просочується. Сума розбирається з тексту в цілі копійки (`\"0,10\"` — 10, а не 1), дати показуються з `timeZone: \"UTC\"`, назви ріжуться за code points, пошук порівнює нормалізовані ключі. Усе це лише читає записи, тож вони однакові до й після показу будь-якою мовою."
      en: "The index is built once and becomes the single source of records for the other fields — so a repeated `id` leaks in nowhere. The amount is parsed from text into whole kopiykas (`\"0,10\"` is 10, not 1), dates are shown with `timeZone: \"UTC\"`, labels are cut by code points, and search compares normalized keys. All of it only reads the records, so they are the same before and after display in any language."
    feedback:
      - when: { test: "byId is a Map in which the first record of a repeated id wins" }
        message:
          uk: "Ця перевірка чекає `Map` на 4 записи, де `get(\"e-02\")` — **перший** запис з `id` `e-02` (той самий об’єкт), і `count` 4. `new Map(records.map(…))` лишає останній запис."
          en: "This check expects a `Map` of 4 records whose `get(\"e-02\")` is the **first** record with the `id` `e-02` (the same object), and `count` 4. `new Map(records.map(…))` keeps the last record."
      - when: { test: "totalMinor is an exact whole number of kopiykas" }
        message:
          uk: "Ця перевірка чекає `124550` — суму чотирьох записів без повтору `e-02` — і ціле число."
          en: "This check expects `124550` — the total of the four records without the repeated `e-02` — and a whole number."
      - when: { test: '"0,10" is ten kopiykas' }
        message:
          uk: "Ця перевірка чекає `10` для `\"0,10\"`. `parseFloat(\"0,10\")` — це `0`: кома не роздільник для JavaScript."
          en: "This check expects `10` for `\"0,10\"`. `parseFloat(\"0,10\")` is `0`: a comma is not a separator for JavaScript."
      - when: { test: "display amounts and dates follow the locale" }
        message:
          uk: "Ця перевірка порівнює `display` з `Intl` для `uk-UA` та `en-US`: порядок `id` без повтору, суми в гривнях з `currency: \"UAH\"` і дати з `dateStyle: \"medium\"`."
          en: "This check compares `display` with `Intl` for `uk-UA` and `en-US`: the `id` order without the repeat, amounts in hryvnias with `currency: \"UAH\"` and dates with `dateStyle: \"medium\"`."
      - when: { test: "display dates are the same calendar day in New York" }
        message:
          uk: "Ця перевірка показує дати так, ніби комп’ютер у Нью-Йорку, і чекає той самий календарний день. Календарну дату показують у тому поясі, в якому її прочитано."
          en: "This check shows the dates as if the computer were in New York and expects the same calendar day. A calendar date is shown in the zone in which it was read."
      - when: { test: "long labels are cut at 20 code points without breaking an emoji" }
        message:
          uk: "Ця перевірка чекає без змін назву до 20 code points, а довшу — перші 20 code points і `…`, без зламаних половинок емодзі."
          en: "This check expects a label of up to 20 code points unchanged, and a longer one as its first 20 code points and `…`, with no broken emoji halves."
      - when: { test: "search ignores case, spaces and how letters were typed" }
        message:
          uk: "Ця перевірка шукає `\"ЧАЙ\"` і `\" Чай \"` у назві, де «й» записано двома code points, `\"квитки\"`, назву відкинутого повтору й порожній запит. Ключ пошуку роби однаково для запиту й назви."
          en: "This check searches for `\"ЧАЙ\"` and `\" Чай \"` in a label whose “й” is written as two code points, for `\"квитки\"`, for the label of the dropped duplicate and for an empty query. Make the search key the same way for the query and the label."
      - when: { test: "switching the locale leaves the records unchanged" }
        message:
          uk: "Ця перевірка двічі викликає `summarize` (`uk-UA`, `en-US`) і чекає, що записи лишилися як були. Не записуй показаний текст у поля записів."
          en: "This check calls `summarize` twice (`uk-UA`, `en-US`) and expects the records to stay as they were. Do not write display text into the records’ fields."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` з’являється, коли метод викликано на `undefined` (наприклад, `summary.search` чи `summary.byId.get`, бо поле не повернуто), або коли програма зупинилася під час запуску. Почни з першої помилки в консолі."
          en: "A `TypeError` appears when a method is called on `undefined` (for example, `summary.search` or `summary.byId.get` because the field was not returned), or when the program stopped while starting. Start with the first error in the console."

  - id: pick-lookup
    kind: prediction
    prompt:
      uk: "Застосунок сотні разів знаходить справу за `id`, а справи додаються й видаляються під час роботи. Що найкраще підходить для пошуку?"
      en: "The app finds a task by `id` hundreds of times, and tasks are added and removed while it runs. What fits the lookup best?"
    answer:
      type: choice
      options:
        - id: map
          text:
            uk: "`Map` від `id` до справи, перебудований після кожної зміни списку"
            en: "A `Map` from `id` to task, rebuilt after every change of the list"
        - id: find
          text:
            uk: "`find` по масиву щоразу"
            en: "`find` over the array every time"
          why:
            uk: "Кожен `find` проходить список від початку: сотні пошуків — сотні проходів."
            en: "Every `find` walks the list from the start: hundreds of lookups mean hundreds of walks."
        - id: weakmap
          text:
            uk: "`WeakMap` від `id` до справи"
            en: "A `WeakMap` from `id` to task"
          why:
            uk: "Ключі `WeakMap` — лише об’єкти, тож текстовий `id` ключем бути не може."
            en: "`WeakMap` keys are objects only, so a text `id` cannot be a key."
      correct: [map]
    explanation:
      uk: "`Map` дає пошук за один крок і приймає текстові ключі. Він — знімок, тож після змін списку його будують знову."
      en: "A `Map` gives a one-step lookup and accepts text keys. It is a snapshot, so it is rebuilt after the list changes."

  - id: pick-tags
    kind: prediction
    prompt:
      uk: "Треба показати перелік **різних** категорій, що трапляються у бажаннях, у порядку першої появи. Що взяти?"
      en: "You need a list of the **different** categories used by the wishes, in the order of first appearance. What do you take?"
    answer:
      type: choice
      options:
        - id: set
          text:
            uk: "`new Set(wishes.map((wish) => wish.category))`"
            en: "`new Set(wishes.map((wish) => wish.category))`"
        - id: set-records
          text:
            uk: "`new Set(wishes)`"
            en: "`new Set(wishes)`"
          why:
            uk: "Це набір записів, а не категорій, і записи порівнюються за посиланням — повтори категорій лишаться."
            en: "That is a set of records, not of categories, and records compare by reference — repeated categories stay."
        - id: weakset
          text:
            uk: "`WeakSet` категорій"
            en: "A `WeakSet` of categories"
          why:
            uk: "`WeakSet` не приймає текст і не дає себе перебрати, тож перелік із нього не отримати."
            en: "A `WeakSet` does not accept text and cannot be walked, so no list can come out of it."
      correct: [set]
    explanation:
      uk: "`Set` прибирає повтори текстових значень і пам’ятає порядок додавання."
      en: "A `Set` removes repeated text values and remembers the order of insertion."

  - id: pick-metadata
    kind: prediction
    prompt:
      uk: "Кожен DOM-елемент картки має стан «розгорнуто чи ні». Картки часто видаляють зі сторінки. Де тримати цей стан?"
      en: "Each card DOM element has an “expanded or not” state. Cards are often removed from the page. Where do you keep that state?"
    answer:
      type: choice
      options:
        - id: weakmap
          text:
            uk: "У `WeakMap` з ключем-елементом"
            en: "In a `WeakMap` keyed by the element"
        - id: map
          text:
            uk: "У `Map` з ключем-елементом"
            en: "In a `Map` keyed by the element"
          why:
            uk: "`Map` тримає видалені картки досяжними, доки записи не видалити вручну, — пам’ять накопичується."
            en: "A `Map` keeps removed cards reachable until the entries are deleted by hand — memory piles up."
        - id: object
          text:
            uk: "У звичайному об’єкті з ключем-елементом"
            en: "In a plain object keyed by the element"
          why:
            uk: "Ключі звичайного об’єкта — лише текст: усі елементи стали б тим самим ключем `\"[object HTMLLIElement]\"`."
            en: "Plain object keys are text only: every element would become the same key `\"[object HTMLLIElement]\"`."
      correct: [weakmap]
    explanation:
      uk: "`WeakMap` прикріплює стан до елемента й не тримає його живим: видалена картка може бути зібрана разом зі своїм станом."
      en: "A `WeakMap` attaches the state to the element without keeping it alive: a removed card can be collected together with its state."

  - id: pick-progress
    kind: prediction
    prompt:
      uk: "Треба показувати «Пройдено уроків: N» і зберігати прогрес між сесіями. Що підходить?"
      en: "You need to show “Lessons completed: N” and keep the progress between sessions. What fits?"
    answer:
      type: choice
      options:
        - id: set-ids
          text:
            uk: "`Set` або масив `id` пройдених уроків, збережений через JSON"
            en: "A `Set` or an array of the completed lesson `id`s, stored through JSON"
        - id: weakset
          text:
            uk: "`WeakSet` об’єктів пройдених уроків"
            en: "A `WeakSet` of completed lesson objects"
          why:
            uk: "У `WeakSet` немає `size` і перебору, а записи зникають, коли вирішить збирач сміття. Ні порахувати, ні зберегти."
            en: "A `WeakSet` has no `size` and no iteration, and entries vanish when the garbage collector decides. It can be neither counted nor stored."
        - id: weakmap
          text:
            uk: "`WeakMap` від уроку до `true`"
            en: "A `WeakMap` from lesson to `true`"
          why:
            uk: "Та сама проблема: слабку колекцію не можна порахувати чи перетворити на JSON."
            en: "The same problem: a weak collection can be neither counted nor turned into JSON."
      correct: [set-ids]
    explanation:
      uk: "Порахований і збережуваний прогрес потребує колекції з розміром і перебором: `Set` текстових `id` (для JSON — масив) чи `Map`."
      en: "Counted, storable progress needs a collection with a size and iteration: a `Set` of text `id`s (an array for JSON) or a `Map`."

  - id: why-weak
    kind: prediction
    prompt:
      uk: "Яке речення правильно пояснює, чому на розмір і порядок `WeakMap` не можна покладатися?"
      en: "Which sentence correctly explains why a `WeakMap`’s size and order cannot be relied on?"
    answer:
      type: choice
      options:
        - id: gc-timing
          text:
            uk: "Записи зникають тоді, коли збирач сміття вирішить звільнити ключ, а цей момент програмі невідомий, тому `WeakMap` навіть не дає `size` і перебору."
            en: "Entries disappear when the garbage collector decides to free their key, and the program does not know that moment, so a `WeakMap` does not even offer `size` or iteration."
        - id: immediate
          text:
            uk: "Записи зникають одразу після останнього `delete` змінної, тож `size` змінюється занадто швидко."
            en: "Entries disappear right after the last variable is gone, so `size` changes too quickly."
          why:
            uk: "Момент зникнення не «одразу», а коли спрацює збирач сміття — невідомо коли. І `size` у `WeakMap` немає взагалі."
            en: "The moment is not “right away” but whenever the garbage collector runs — at no known time. And a `WeakMap` has no `size` at all."
        - id: random
          text:
            uk: "`WeakMap` зберігає записи у випадковому порядку."
            en: "A `WeakMap` stores entries in random order."
          why:
            uk: "Справа не в порядку зберігання: перебрати `WeakMap` неможливо в принципі, бо вміст залежить від збирача сміття."
            en: "It is not about storage order: a `WeakMap` cannot be walked at all, because its contents depend on the garbage collector."
      correct: [gc-timing]
    explanation:
      uk: "Вміст слабкої колекції залежить від того, коли спрацює збирач сміття. Щоб програма не могла на це покластися, мова просто не дає ні розміру, ні перебору."
      en: "The contents of a weak collection depend on when the garbage collector runs. So that a program cannot rely on it, the language simply offers neither a size nor iteration."

  - id: recall-summary-cost
    kind: review
    title:
      uk: "Пригадай: ціна підсумку"
      en: "Recall: the cost of a summary"
    items:
      - id: summary-passes
        from: js-05-09-independent-summary
        prompt:
          uk: "Підсумок будує індекс `Map` одним проходом, а потім ще одним проходом рахує суму. Як росте робота зі збільшенням кількості записів `n`?"
          en: "A summary builds a `Map` index in one pass and then computes the total in one more pass. How does the work grow with the number of records `n`?"
        answer:
          type: choice
          options:
            - id: linear
              text:
                uk: "Лінійно: два проходи — це близько `2 × n` кроків"
                en: "Linearly: two passes are about `2 × n` steps"
            - id: quadratic
              text:
                uk: "Як `n × n`, бо проходів два"
                en: "As `n × n`, because there are two passes"
              why:
                uk: "Два проходи **один за одним** додають роботу, а не множать. `n × n` дає прохід **усередині** проходу."
                en: "Two passes **one after another** add up, they do not multiply. `n × n` comes from a pass **inside** a pass."
            - id: constant
              text:
                uk: "Не росте: `Map` працює за один крок"
                en: "It does not grow: a `Map` takes one step"
              why:
                uk: "Один крок — це пошук у вже збудованому `Map`. Побудова й підсумок проходять усі записи."
                en: "One step is a lookup in an already built `Map`. Building it and the total walk all the records."
          correct: [linear]
        explanation:
          uk: "Послідовні проходи дають `n + n` — лінійний ріст. А додаткова пам’ять — індекс на `n` записів."
          en: "Consecutive passes give `n + n` — linear growth. And the extra memory is an index of `n` entries."

  - id: to-project
    kind: transfer
    capstoneStep: JS-12
    body:
