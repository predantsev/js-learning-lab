id: js-12-11-map-set
unit: JS-12
title:
  uk: "Map і Set"
  en: "Map and Set"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачати поведінку Map і Set для ключів `1` і `'1'`, `NaN` і двох різних об’єктів з однаковим вмістом."
    en: "Predict Map and Set behavior for the keys `1` and `'1'`, `NaN`, and two different objects with equal contents."
  - uk: "Обирати Map замість звичайного об’єкта для динамічних чи нетекстових ключів і впорядкованого перебору — і пояснювати, коли звичайний об’єкт усе ж кращий."
    en: "Choose a Map over a plain object for dynamic or non-string keys and ordered iteration, and say when a plain object is still the better fit."
prerequisites: [js-12-10-intl-locale, js-04-07-reference-identity]
subskills:
  - { family: J-09, skill: "Map/Set key/equality/iteration semantics", depth: intro }
  - { family: J-09, skill: "object vs Map", depth: intro }
glossary: [map-collection, set-collection, same-value-zero]
selfCheck: [predict-keys, count-categories]

blocks:
  - id: two-collections
    kind: explanation
    title:
      uk: "Словник і набір"
      en: "A dictionary and a set"
    body:
      uk: |
        [[map-collection|`Map`]] — це словник «ключ → значення», де ключем може бути **будь-що**: текст, число, об’єкт.

        ```js
        const prices = new Map();
        prices.set("w-01", 80);   // додати чи замінити
        prices.get("w-01");       // 80
        prices.has("w-99");       // false
        prices.size;              // 1
        ```

        [[set-collection|`Set`]] — набір **унікальних** значень: `add`, `has`, `delete`, `size`. Повторне `add` того самого значення нічого не змінює.

        Обидва пам’ятають порядок додавання, і `for…of` іде саме в ньому (для `Map` — парами `[key, value]`).

        Як вони вирішують, що ключ «той самий»? Правило [[same-value-zero|SameValueZero]] — майже `===`:

        - `1` і `"1"` — **різні** ключі (без перетворення типів);
        - `NaN` дорівнює `NaN` — тут, на відміну від `===`;
        - об’єкти — за **посиланням**: два окремо створені `{ id: "w-01" }` — два різні ключі.
      en: |
        A [[map-collection|`Map`]] is a “key → value” dictionary where a key can be **anything**: text, a number, an object.

        ```js
        const prices = new Map();
        prices.set("w-01", 80);   // add or replace
        prices.get("w-01");       // 80
        prices.has("w-99");       // false
        prices.size;              // 1
        ```

        A [[set-collection|`Set`]] is a collection of **unique** values: `add`, `has`, `delete`, `size`. Adding the same value again changes nothing.

        Both remember the order of insertion, and `for…of` walks it (a `Map` in `[key, value]` pairs).

        How do they decide that a key is “the same”? The [[same-value-zero|SameValueZero]] rule — almost `===`:

        - `1` and `"1"` are **different** keys (no type conversion);
        - `NaN` equals `NaN` — here, unlike with `===`;
        - objects go by **reference**: two separately created `{ id: "w-01" }` are two different keys.

  - id: predict-keys
    kind: prediction
    prompt:
      uk: "`add` повертає сам набір, тому виклики можна писати ланцюжком: `set.add(1).add(2)`. А `new Map([[key, value]])` одразу створює `Map` з одним записом. Скільки елементів буде в наборі, і що знайде `Map` за новоствореним об’єктом?"
      en: "`add` returns the set itself, so calls can be chained: `set.add(1).add(2)`. And `new Map([[key, value]])` creates a `Map` with one entry right away. How many items will the set hold, and what will the `Map` find for a freshly created object?"
    code: |
      const set = new Set();
      set.add(1).add("1").add(NaN).add(NaN);
      set.add({ id: "a" }).add({ id: "a" });
      const shared = { id: "b" };
      set.add(shared).add(shared);
      console.log(set.size);
      const map = new Map([[{ id: "a" }, "first"]]);
      console.log(map.get({ id: "a" }), map.has(1));
    verify:
      logs: ["6", "undefined false"]
    answer:
      type: choice
      options:
        - id: same-value-zero
          code: "6\nundefined false"
        - id: by-contents
          code: "5\nfirst false"
          why:
            uk: "`Set` і `Map` порівнюють об’єкти за посиланням, а не за вмістом. Два записи `{ id: \"a\" }` — два різні об’єкти, тож обидва в наборі, а новий об’єкт у `get` не знайде старого."
            en: "`Set` and `Map` compare objects by reference, not by contents. Two `{ id: \"a\" }` literals are two different objects, so both are in the set, and a new object in `get` does not find the old one."
        - id: nan-twice
          code: "7\nundefined false"
          why:
            uk: "Хоч `NaN === NaN` — `false`, для `Set` і `Map` `NaN` — те саме значення. Другий `NaN` не додається."
            en: "Although `NaN === NaN` is `false`, for `Set` and `Map` `NaN` is the same value. The second `NaN` is not added."
        - id: coerced
          code: "5\nundefined false"
          why:
            uk: "`1` і `\"1\"` — різні значення різних типів, і `Set` їх не зводить. Перетворення типів, як у `==`, тут немає."
            en: "`1` and `\"1\"` are different values of different types, and a `Set` does not merge them. There is no type conversion here, unlike with `==`."
      correct: [same-value-zero]
    explanation:
      uk: "У наборі: `1`, `\"1\"`, один `NaN`, два різні об’єкти `{ id: \"a\" }` і один `shared` — шість. `map.get({ id: \"a\" })` створює **новий** об’єкт, якого в `Map` немає, тож `undefined`. А `1` у `Map` взагалі не додавали."
      en: "The set holds `1`, `\"1\"`, one `NaN`, two different `{ id: \"a\" }` objects and one `shared` — six. `map.get({ id: \"a\" })` creates a **new** object that is not in the `Map`, hence `undefined`. And `1` was never added to the `Map` at all."

  - id: map-arrows
    kind: visual
    visual: memory-graph
    title:
      uk: "Ключі Map — це посилання"
      en: "Map keys are references"
    textEquivalent:
      uk: "Змінна index вказує на порожній Map. Потім створюється об’єкт first з id \"w-01\", і index.set(first, \"lamp\") додає запис: ключ — стрілка на цей самий об’єкт, значення — \"lamp\". Далі створюється інший об’єкт probe з таким самим вмістом { id: \"w-01\" }. Це окрема коробка в пам’яті, тож index.get(probe) нічого не знаходить: undefined. index.get(first) іде за тим самим посиланням, що й ключ, і дає \"lamp\". Наостанок index.set(1, \"one\") і index.set(\"1\", \"text\") додають два різні записи: число 1 і текст \"1\" — різні ключі. У Map тепер три записи."
      en: "The variable index points to an empty Map. Then the object first with id \"w-01\" is created, and index.set(first, \"lamp\") adds an entry: the key is an arrow to that very object, the value is \"lamp\". Next another object, probe, is created with the same contents { id: \"w-01\" }. It is a separate box in memory, so index.get(probe) finds nothing: undefined. index.get(first) follows the same reference as the key and gives \"lamp\". Finally, index.set(1, \"one\") and index.set(\"1\", \"text\") add two different entries: the number 1 and the text \"1\" are different keys. The Map now holds three entries."
    spec:
      code: |
        const index = new Map();
        const first = { id: "w-01" };
        index.set(first, "lamp");
        const probe = { id: "w-01" };
        index.get(probe); // undefined
        index.get(first); // "lamp"
        index.set(1, "one").set("1", "text");
      states:
        - caption:
            uk: "`index` — порожній `Map`."
            en: "`index` is an empty `Map`."
          line: 1
          bindings:
            - { name: index, kind: const, value: { ref: m } }
          heap:
            m: { kind: map, entries: [] }
        - caption:
            uk: "`index.set(first, \"lamp\")`: ключ запису — стрілка на **той самий** об’єкт, що й у `first`, а не його копія."
            en: "`index.set(first, \"lamp\")`: the entry’s key is an arrow to **the same** object as in `first`, not a copy of it."
          line: 3
          bindings:
            - { name: index, kind: const, value: { ref: m } }
            - { name: first, kind: const, value: { ref: o1 } }
          heap:
            m: { kind: map, entries: [[{ ref: o1 }, "lamp"]] }
            o1: { kind: object, props: { id: "w-01" } }
          changed: [m, o1, first]
        - caption:
            uk: "`probe` має такий самий вміст, але це **інша** коробка. `index.get(probe)` шукає ключ-стрілку на неї — і не знаходить: `undefined`."
            en: "`probe` has the same contents, but it is **another** box. `index.get(probe)` looks for a key arrow to it — and finds none: `undefined`."
          line: 5
          bindings:
            - { name: index, kind: const, value: { ref: m } }
            - { name: first, kind: const, value: { ref: o1 } }
            - { name: probe, kind: const, value: { ref: o2 } }
          heap:
            m: { kind: map, entries: [[{ ref: o1 }, "lamp"]] }
            o1: { kind: object, props: { id: "w-01" } }
            o2: { kind: object, props: { id: "w-01" } }
          changed: [probe, o2]
        - caption:
            uk: "`index.get(first)` іде за тим самим посиланням, що й ключ: `\"lamp\"`."
            en: "`index.get(first)` follows the same reference as the key: `\"lamp\"`."
          line: 6
          bindings:
            - { name: index, kind: const, value: { ref: m } }
            - { name: first, kind: const, value: { ref: o1 } }
            - { name: probe, kind: const, value: { ref: o2 } }
          heap:
            m: { kind: map, entries: [[{ ref: o1 }, "lamp"]] }
            o1: { kind: object, props: { id: "w-01" } }
            o2: { kind: object, props: { id: "w-01" } }
          changed: []
        - caption:
            uk: "Число `1` і текст `\"1\"` — два різні ключі. У звичайному об’єкті обидва стали б тим самим ключем `\"1\"`."
            en: "The number `1` and the text `\"1\"` are two different keys. In a plain object both would become the same key `\"1\"`."
          line: 7
          bindings:
            - { name: index, kind: const, value: { ref: m } }
            - { name: first, kind: const, value: { ref: o1 } }
            - { name: probe, kind: const, value: { ref: o2 } }
          heap:
            m: { kind: map, entries: [[{ ref: o1 }, "lamp"], [1, "one"], ["1", "text"]] }
            o1: { kind: object, props: { id: "w-01" } }
            o2: { kind: object, props: { id: "w-01" } }
          changed: [m]

  - id: keys-by-identity
    kind: example
    runtime: browser-js
    dir: keys-by-identity
    entry: index.js
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      tech: { uk: "Техніка", en: "Tech" }
      home: { uk: "Дім", en: "Home" }
      note: { uk: "подарунок на день народження", en: "a birthday present" }
      categories: { uk: "Категорії:", en: "Categories:" }
      sameObject: { uk: "Нотатка за тим самим об’єктом:", en: "Note by the same object:" }
      reloadedObject: { uk: "Нотатка за перезавантаженим об’єктом:", en: "Note by the reloaded object:" }
    title:
      uk: "Ключ-об’єкт губиться після перезавантаження"
      en: "An object key gets lost after a reload"
    body:
      uk: |
        `Set` збирає категорії без повторів. `Map` зберігає нотатку до бажання, а ключ — сам об’єкт бажання. Потім список «перезавантажується» зі сховища через JSON — як після оновлення сторінки. Запусти й подивись, що знайде `get`.
      en: |
        A `Set` collects the categories without repeats. A `Map` stores a note for a wish, keyed by the wish object itself. Then the list is “reloaded” from storage through JSON — as after a page refresh. Run it and see what `get` finds.
    tryIt:
      uk: |
        Зроби ключем не об’єкт, а його `id`: заміни `notes.set(wishes[0], …)` на `notes.set(wishes[0].id, …)`, а обидва `notes.get(…)` — на `notes.get(wishes[0].id)` і `notes.get(reloaded[0].id)`. Запусти: тепер нотатку знайдено в обох випадках. Текстовий `id` однаковий у старого й нового об’єкта, а посилання — ні.
      en: |
        Make the key not the object but its `id`: replace `notes.set(wishes[0], …)` with `notes.set(wishes[0].id, …)`, and the two `notes.get(…)` calls with `notes.get(wishes[0].id)` and `notes.get(reloaded[0].id)`. Run it: now the note is found in both cases. The text `id` is the same for the old and the new object; the reference is not.

  - id: object-or-map
    kind: explanation
    title:
      uk: "Об’єкт чи Map"
      en: "An object or a Map"
    body:
      uk: |
        | | Звичайний об’єкт `{}` | `Map` |
        |---|---|---|
        | ключі | лише текст (число `1` стає `"1"`) | будь-які значення |
        | успадковані ключі | є: `"toString"`, `"constructor"` | немає |
        | кількість | `Object.keys(obj).length` | `map.size` |
        | JSON | `JSON.stringify` працює | дає `"{}"`, спершу `Object.fromEntries(map)` |

        **Map** — коли ключі з’являються під час роботи: підрахунки за категоріями, довідник за `id`, кеш. **Об’єкт** — коли поля відомі заздалегідь: сам запис `{ id, label, amountMinor }`, налаштування, дані для JSON.

        Для збереження `Map` перетворюють на звичайний об’єкт: `Object.fromEntries(map)` збирає об’єкт із пар `[key, value]`. А назад — `new Map(Object.entries(obj))`.
      en: |
        | | Plain object `{}` | `Map` |
        |---|---|---|
        | keys | text only (the number `1` becomes `"1"`) | any values |
        | inherited keys | yes: `"toString"`, `"constructor"` | none |
        | count | `Object.keys(obj).length` | `map.size` |
        | JSON | `JSON.stringify` works | gives `"{}"`, use `Object.fromEntries(map)` first |

        **A Map** — when keys appear while the program runs: counts by category, a lookup by `id`, a cache. **An object** — when the fields are known in advance: the record itself `{ id, label, amountMinor }`, settings, data for JSON.

        For storage a `Map` is turned into a plain object: `Object.fromEntries(map)` builds an object from `[key, value]` pairs. And back — `new Map(Object.entries(obj))`.

  - id: recall-identity
    kind: review
    title:
      uk: "Пригадай: дві назви — один об’єкт"
      en: "Recall: two names, one object"
    items:
      - id: alias-equal
        from: js-04-07-reference-identity
        prompt:
          uk: "Що виведе цей рядок коду?"
          en: "What does this line print?"
        code: |
          const a = { id: "w-01" };
          const b = a;
          const c = { id: "w-01" };
          console.log(a === b, a === c);
        verify:
          logs: ["true false"]
        answer:
          type: choice
          options:
            - id: reference
              code: "true false"
            - id: contents
              code: "true true"
              why:
                uk: "`===` для об’єктів порівнює посилання. `c` — окремий об’єкт, хоч і з тим самим вмістом."
                en: "`===` compares references for objects. `c` is a separate object, even with the same contents."
            - id: copy
              code: "false false"
              why:
                uk: "`const b = a` не копіює об’єкт: обидві назви вказують на той самий."
                en: "`const b = a` does not copy the object: both names point to the same one."
          correct: [reference]
        explanation:
          uk: "`a` і `b` — дві назви одного об’єкта, а `c` — інший об’єкт. Саме це правило діє і для ключів `Map` та значень `Set`."
          en: "`a` and `b` are two names of one object, and `c` is another object. The very same rule applies to `Map` keys and `Set` values."

  - id: count-categories
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: count-categories
    entry: index.js
    title:
      uk: "Підрахунок за категоріями"
      en: "Counting by category"
    instructions:
      uk: |
        1. Допиши `countByCategory(records)`: вона повертає `Map`, де ключ — категорія, а значення — скільки записів мають цю категорію. Категорії йдуть у тому порядку, в якому вперше трапилися в списку. Для порожнього списку — порожній `Map`.
        2. Виправ `categoryCountsJson(records)`: зараз вона дає `"{}"`. Вона має повертати JSON-текст на зразок `'{"food":2,"transport":1,"fun":2,"home":1}'`.
      en: |
        1. Finish `countByCategory(records)`: it returns a `Map` whose key is a category and whose value is how many records have that category. Categories come in the order in which they first appear in the list. An empty list gives an empty `Map`.
        2. Fix `categoryCountsJson(records)`: right now it gives `"{}"`. It must return JSON text such as `'{"food":2,"transport":1,"fun":2,"home":1}'`.
    testTitles:
      "returns a Map":
        uk: "Повертає `Map`"
        en: "Returns a `Map`"
      "counts every category":
        uk: "Рахує кожну категорію"
        en: "Counts every category"
      "keeps the order in which categories first appear":
        uk: "Зберігає порядок, у якому категорії трапилися вперше"
        en: "Keeps the order in which categories first appear"
      "counts a category named like a built-in property":
        uk: "Рахує категорію з назвою вбудованої властивості"
        en: "Counts a category named like a built-in property"
      "an empty list gives an empty Map":
        uk: "Порожній список дає порожній `Map`"
        en: "An empty list gives an empty `Map`"
      "turns the counts into JSON text":
        uk: "Перетворює підрахунок на JSON-текст"
        en: "Turns the counts into JSON text"
    hints:
      nudge:
        uk: "Для кожного запису: скільки вже набралося для його категорії і як записати на один більше? Що повертає `get`, коли категорії ще немає?"
        en: "For every record: how many has its category collected so far, and how do you store one more? What does `get` return when the category is not there yet?"
      explanation:
        uk: "`get` для відсутнього ключа дає `undefined`, тож замість нього потрібен `0` — це робить `??`. `set` для наявного ключа замінює значення, але лишає ключ на його першому місці — порядок першої появи зберігається сам. Так рахують голоси: якщо `votes.has(name)` — записати старе число плюс один, інакше — записати `1`. А `JSON.stringify` не бачить вмісту `Map` — спершу перетвори його на звичайний об’єкт через `Object.fromEntries`."
        en: "`get` for a missing key gives `undefined`, so `0` is needed instead — that is what `??` does. `set` for an existing key replaces the value but keeps the key in its first place — the order of first appearance takes care of itself. That is how votes are counted: if `votes.has(name)`, store the old number plus one, otherwise store `1`. And `JSON.stringify` does not see the contents of a `Map` — turn it into a plain object with `Object.fromEntries` first."
    solutionNote:
      uk: "`Map` приймає будь-яку категорію як ключ — навіть `\"toString\"`, на якій звичайний об’єкт спіткнувся б об успадкований метод. Порядок першої появи `Map` зберігає сам. Для JSON `Object.fromEntries` перетворює пари на звичайний об’єкт; цикл `for…of` по парах робить те саме."
      en: "A `Map` accepts any category as a key — even `\"toString\"`, on which a plain object would trip over the inherited method. A `Map` keeps the order of first appearance by itself. For JSON, `Object.fromEntries` turns the pairs into a plain object; a `for…of` loop over the pairs does the same."
    feedback:
      - when: { test: "returns a Map" }
        message:
          uk: "Ця перевірка чекає, що `countByCategory` повертає `Map` (`new Map()`), а не звичайний об’єкт чи `undefined`."
          en: "This check expects `countByCategory` to return a `Map` (`new Map()`), not a plain object or `undefined`."
      - when: { test: "counts every category" }
        message:
          uk: "Ця перевірка чекає `food` — 2, `fun` — 2, `transport` — 1, `home` — 1 і рівно 4 ключі. Якщо бачиш `NaN`, до `undefined` додається 1: для нової категорії почни з `0`."
          en: "This check expects `food` — 2, `fun` — 2, `transport` — 1, `home` — 1 and exactly 4 keys. If you see `NaN`, 1 is being added to `undefined`: start a new category at `0`."
      - when: { test: "keeps the order in which categories first appear" }
        message:
          uk: "Ця перевірка чекає ключі в порядку `food`, `transport`, `fun`, `home` — як вони вперше трапляються в списку. Не сортуй і не видаляй ключі перед повторним `set`."
          en: "This check expects the keys in the order `food`, `transport`, `fun`, `home` — as they first appear in the list. Do not sort, and do not delete keys before setting them again."
      - when: { test: "counts a category named like a built-in property" }
        message:
          uk: "Ця перевірка рахує категорії `\"toString\"` і `\"constructor\"` і чекає 2 і 1. У звичайному об’єкті ці ключі вже «є» як успадковані — у `Map` їх немає."
          en: "This check counts the categories `\"toString\"` and `\"constructor\"` and expects 2 and 1. In a plain object these keys already “exist” as inherited ones — in a `Map` they do not."
      - when: { test: "an empty list gives an empty Map" }
        message:
          uk: "Ця перевірка передає `[]` і чекає `Map` розміру 0 — не `undefined`."
          en: "This check passes `[]` and expects a `Map` of size 0 — not `undefined`."
      - when: { test: "turns the counts into JSON text" }
        message:
          uk: "Ця перевірка чекає `'{\"food\":2,\"transport\":1,\"fun\":2,\"home\":1}'`. `JSON.stringify(map)` дає `\"{}\"`: спершу перетвори `Map` на звичайний об’єкт."
          en: "This check expects `'{\"food\":2,\"transport\":1,\"fun\":2,\"home\":1}'`. `JSON.stringify(map)` gives `\"{}\"`: turn the `Map` into a plain object first."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` з’являється, коли метод `Map` викликано на чомусь іншому (наприклад, `counts.set` на `undefined`, бо `countByCategory` нічого не повертає), або коли програма зупинилася під час запуску. Почни з першої помилки в консолі."
          en: "A `TypeError` appears when a `Map` method is called on something else (for example, `counts.set` on `undefined` because `countByCategory` returns nothing), or when the program stopped while starting. Start with the first error in the console."

  - id: to-project
    kind: transfer
    capstoneStep: JS-12
    body:
      uk: "У проєкті записи мають `id`. Наприкінці розділу ти зробиш довідник `Map` за `id` і `Set` використаних категорій чи пріоритетів — з текстовими ключами, які переживають перезавантаження."
      en: "Records in your project have an `id`. At the end of this unit you will build a `Map` lookup by `id` and a `Set` of the categories or priorities in use — with text keys that survive a reload."
