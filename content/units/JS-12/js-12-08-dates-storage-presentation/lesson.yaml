id: js-12-08-dates-storage-presentation
unit: JS-12
title:
  uk: "Дати: збережене значення проти показу"
  en: "Dates: stored value vs presentation"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Відрізняти timestamp (момент часу) від календарної дати (`'YYYY-MM-DD'`) й обирати, що потрібно полю."
    en: "Tell a timestamp (an instant) from a calendar date (`'YYYY-MM-DD'`) and choose which one a field needs."
  - uk: "Передбачати, чим відрізняються `new Date('2026-03-01')`, `new Date('2026-03-01T00:00')` і `new Date(2026, 2, 1)` (UTC проти місцевого часу, місяці з нуля)."
    en: "Predict how `new Date('2026-03-01')`, `new Date('2026-03-01T00:00')` and `new Date(2026, 2, 1)` differ (UTC vs local time, zero-based month)."
  - uk: "Тримати збережене значення канонічним і робити текст для показу лише на краю програми."
    en: "Keep the stored value canonical and produce display text only at the edge."
prerequisites: [js-12-07-regex-groups-flags-limits, js-09-04-deterministic-fixtures]
subskills:
  - { family: J-08, skill: "Date parsing/storage vs presentation", depth: intro }
  - { family: J-08, skill: "timestamps/calendar dates", depth: intro }
glossary: [timestamp, calendar-date, iso-8601, unix-epoch]
selfCheck: [predict-day, predict-parts, due-check]

blocks:
  - id: instant-or-day
    kind: explanation
    title:
      uk: "Момент часу чи день у календарі"
      en: "An instant or a day on the calendar"
    body:
      uk: |
        Об’єкт `Date` зберігає **одне число** — кількість мілісекунд від [[unix-epoch|початку епохи Unix]], 1 січня 1970 року, 00:00 за UTC. Це число — [[timestamp]], тобто **момент часу**, однаковий для всієї планети. Ні дня, ні часового поясу в ньому немає.

        Текст на зразок «1 березня» з’являється лише тоді, коли момент **показують** для певного місця. Той самий момент у Києві — вже 1 березня, а в Нью-Йорку — ще 28 лютого. `Intl.DateTimeFormat(locale, { timeZone })` перетворює момент на текст для одного часового поясу.

        А є дані, яким момент не потрібен: «здати книжки **1 березня**», «витрата **від 27 лютого**». Це [[calendar-date|календарна дата]] — назва дня, без годин і поясу. Її зберігають простим текстом `"2026-03-01"` у форматі [[iso-8601|ISO 8601]].

        | Що записуємо | Що зберігати |
        |---|---|
        | коли створено, коли оплачено | timestamp (число) |
        | строк справи, день витрати, день звички | календарну дату `"YYYY-MM-DD"` |
      en: |
        A `Date` object stores **one number** — the count of milliseconds since the [[unix-epoch|Unix epoch]], 1 January 1970, 00:00 UTC. That number is a [[timestamp]], an **instant** that is the same for the whole planet. It has neither a day nor a time zone.

        Text such as “1 March” appears only when the instant is **shown** for a particular place. The same instant is already 1 March in Kyiv and still 28 February in New York. `Intl.DateTimeFormat(locale, { timeZone })` turns an instant into text for one time zone.

        And some data needs no instant at all: “return the books **on 1 March**”, “an expense **from 27 February**”. That is a [[calendar-date|calendar date]] — the name of a day, without hours or zone. It is stored as plain text `"2026-03-01"` in the [[iso-8601|ISO 8601]] format.

        | What we record | What to store |
        |---|---|
        | when created, when paid | a timestamp (a number) |
        | a task’s due date, an expense’s day, a habit’s day | a calendar date `"YYYY-MM-DD"` |

  - id: predict-day
    kind: prediction
    prompt:
      uk: "Один момент — три часові пояси. Що виведе код?"
      en: "One instant, three time zones. What does the code print?"
    code: |
      const instant = new Date("2026-03-01");
      const show = (timeZone) =>
        new Intl.DateTimeFormat("en-US", { timeZone, month: "short", day: "numeric" }).format(instant);
      console.log(show("UTC"), "|", show("Europe/Kyiv"), "|", show("America/New_York"));
    verify:
      logs: ["Mar 1 | Mar 1 | Feb 28"]
    answer:
      type: choice
      options:
        - id: ny-earlier
          code: "Mar 1 | Mar 1 | Feb 28"
        - id: same-everywhere
          code: "Mar 1 | Mar 1 | Mar 1"
          why:
            uk: "`Date` не зберігає день — лише момент: північ 1 березня за UTC. У Нью-Йорку в цей момент ще вечір 28 лютого."
            en: "A `Date` does not store a day — only an instant: midnight of 1 March UTC. In New York at that instant it is still the evening of 28 February."
        - id: kyiv-earlier
          code: "Mar 1 | Feb 28 | Feb 28"
          why:
            uk: "Київ на дві години **попереду** UTC: опівночі за UTC там уже 02:00 1 березня. Назад, у 28 лютого, «повертається» лише Нью-Йорк, що позаду UTC."
            en: "Kyiv is two hours **ahead** of UTC: at midnight UTC it is already 02:00 on 1 March there. Only New York, which is behind UTC, “goes back” to 28 February."
      correct: [ny-earlier]
    explanation:
      uk: "`new Date(\"2026-03-01\")` — це момент «північ 1 березня за UTC». У Києві тоді 02:00 1 березня, а в Нью-Йорку — 19:00 28 лютого. Об’єкт той самий, змінився лише показ. Тому збережене значення й текст на екрані — різні речі."
      en: "`new Date(\"2026-03-01\")` is the instant “midnight of 1 March UTC”. In Kyiv it is then 02:00 on 1 March, and in New York 19:00 on 28 February. The object is the same; only the display changed. That is why the stored value and the text on screen are different things."

  - id: one-instant
    kind: visual
    visual: diagram
    title:
      uk: "Один момент, кілька показів — і просто день"
      en: "One instant, several displays — and just a day"
    textEquivalent:
      uk: "Угорі — один момент часу: timestamp 1772323200000, тобто стільки мілісекунд минуло від 1 січня 1970 року 00:00 UTC. Те саме число можна показати кількома способами. toISOString дає текст у UTC: 2026-03-01T00:00:00.000Z. Для Києва цей момент — 1 березня 2026, 02:00. Для Нью-Йорка — 28 лютого 2026, 19:00. Числа однакові, тексти різні: день залежить від того, де дивляться. Унизу окремо — календарна дата \"2026-03-01\": це назва дня без моменту часу, вона однакова для всіх і не має годин чи поясу."
      en: "At the top is one instant: the timestamp 1772323200000, the number of milliseconds since 1 January 1970 00:00 UTC. The same number can be shown in several ways. toISOString gives text in UTC: 2026-03-01T00:00:00.000Z. For Kyiv this instant is 1 March 2026, 02:00. For New York it is 28 February 2026, 19:00. The number is the same, the texts differ: the day depends on where you look. Separately, at the bottom, is the calendar date \"2026-03-01\": the name of a day without an instant, the same for everybody, with no hours or zone."
    spec:
      layout: grid
      groups:
        - { id: moment, label: { uk: "один момент часу", en: "one instant" } }
        - { id: plain, label: { uk: "календарна дата", en: "calendar date" } }
      nodes:
        - { id: stamp, group: moment, col: 0, row: 0, w: 400, shape: pill, label: "timestamp 1772323200000" }
        - { id: iso, group: moment, col: 0, row: 1, w: 400, label: { uk: "UTC: 2026-03-01T00:00:00.000Z", en: "UTC: 2026-03-01T00:00:00.000Z" } }
        - { id: kyiv, group: moment, col: 0, row: 2, w: 400, label: { uk: "Europe/Kyiv: 1 березня 2026, 02:00", en: "Europe/Kyiv: Mar 1, 2026, 2:00 AM" } }
        - { id: ny, group: moment, col: 0, row: 3, w: 400, label: { uk: "America/New_York: 28 лютого 2026, 19:00", en: "America/New_York: Feb 28, 2026, 7:00 PM" } }
        - { id: day, group: plain, col: 0, row: 4, w: 400, shape: note, label: { uk: "\"2026-03-01\" — день без години й поясу", en: "\"2026-03-01\" — a day, no hour and no zone" } }
      hidden: [iso, kyiv, ny, day]
      steps:
        - caption:
            uk: "`new Date(\"2026-03-01\")` зберігає одне число — мілісекунди від 1 січня 1970 року за UTC. Це момент, а не день."
            en: "`new Date(\"2026-03-01\")` stores one number — milliseconds since 1 January 1970 UTC. It is an instant, not a day."
          highlight: [stamp]
        - caption:
            uk: "`toISOString()` показує цей момент у UTC. Консоль платформи показує `Date` саме так."
            en: "`toISOString()` shows this instant in UTC. The platform’s console shows a `Date` exactly this way."
          show: [iso]
          highlight: [iso]
        - caption:
            uk: "Той самий момент для Києва — 02:00 1 березня, а для Нью-Йорка — 19:00 28 лютого. Число не змінилося, змінилося місце показу."
            en: "The same instant is 02:00 on 1 March for Kyiv and 19:00 on 28 February for New York. The number did not change; the place of display did."
          show: [kyiv, ny]
          highlight: [kyiv, ny]
        - caption:
            uk: "Календарна дата `\"2026-03-01\"` — інша річ: назва дня, однакова для всіх. Строк справи чи день витрати зберігають саме так."
            en: "The calendar date `\"2026-03-01\"` is something else: the name of a day, the same for everybody. A task’s due date or an expense’s day is stored exactly like this."
          show: [day]
          highlight: [day]

  - id: parsing-rules
    kind: explanation
    title:
      uk: "Три способи створити Date — три різні правила"
      en: "Three ways to create a Date — three different rules"
    body:
      uk: |
        | Запис | Як читається |
        |---|---|
        | `new Date("2026-03-01")` | лише дата → **північ за UTC** |
        | `new Date("2026-03-01T00:00")` | дата й час без поясу → **північ за місцевим часом** комп’ютера |
        | `new Date(2026, 2, 1)` | рік, **місяць з нуля**, день → місцевий час |

        Тобто перший і другий записи — **різні моменти** на будь-якому комп’ютері, де місцевий час не збігається з UTC. А в третьому `2` — це березень: місяці в `Date` рахуються з `0` (січень) до `11` (грудень). Дні — як звично, з 1.

        Тому правило проєкту просте: календарні дати лишаються текстом `"YYYY-MM-DD"`, «сьогодні» передається параметром, а `Date` з’являється лише там, де справді потрібен момент часу або показ.
      en: |
        | Written as | How it is read |
        |---|---|
        | `new Date("2026-03-01")` | date only → **midnight UTC** |
        | `new Date("2026-03-01T00:00")` | date and time without a zone → **midnight in the computer’s local time** |
        | `new Date(2026, 2, 1)` | year, **zero-based month**, day → local time |

        So the first and second forms are **different instants** on any computer whose local time differs from UTC. And in the third, `2` is March: months in `Date` count from `0` (January) to `11` (December). Days are as usual, from 1.

        That is why the project’s rule is simple: calendar dates stay text `"YYYY-MM-DD"`, “today” is passed in as a parameter, and a `Date` appears only where an instant or a display is really needed.

  - id: predict-parts
    kind: prediction
    prompt:
      uk: "Що виведуть три рядки коду на будь-якому комп’ютері?"
      en: "What do the three lines print on any computer?"
    code: |
      const parts = new Date(2026, 2, 1);
      const april = new Date(2026, 3, 1);
      console.log(parts.getMonth(), parts.getDate(), april.getMonth(), april.getDate());
      console.log(new Date("2026-03-01T00:00").getTime() === parts.getTime());
      console.log(new Date("2026-03-01").getTime() === Date.UTC(2026, 2, 1));
    verify:
      logs: ["2 1 3 1", "true", "true"]
    answer:
      type: choice
      options:
        - id: zero-based
          code: "2 1 3 1\ntrue\ntrue"
        - id: one-based
          code: "3 1 4 1\ntrue\ntrue"
          why:
            uk: "Місяці в `Date` рахуються з нуля: `2` — березень, `3` — квітень. `getMonth()` повертає той самий номер з нуля."
            en: "Months in `Date` count from zero: `2` is March, `3` is April. `getMonth()` returns the same zero-based number."
        - id: no-zone-is-utc
          code: "2 1 3 1\nfalse\ntrue"
          why:
            uk: "Текст із часом, але без поясу (`\"…T00:00\"`) читається за місцевим часом — так само, як `new Date(2026, 2, 1)`. Тож це той самий момент."
            en: "Text with a time but no zone (`\"…T00:00\"`) is read in local time — just like `new Date(2026, 2, 1)`. So it is the same instant."
        - id: date-only-local
          code: "2 1 3 1\ntrue\nfalse"
          why:
            uk: "Текст лише з датою читається як північ за **UTC** — рівно те, що повертає `Date.UTC(2026, 2, 1)`."
            en: "Date-only text is read as midnight **UTC** — exactly what `Date.UTC(2026, 2, 1)` returns."
      correct: [zero-based]
    explanation:
      uk: "`new Date(2026, 2, 1)` — 1 березня (місяць `2`), а `new Date(2026, 3, 1)` — 1 квітня. Текст `\"2026-03-01T00:00\"` без поясу — місцева північ, як і `new Date(2026, 2, 1)`. Текст `\"2026-03-01\"` — північ за UTC, як `Date.UTC(2026, 2, 1)`. Кожне порівняння — місцеве з місцевим і UTC з UTC, тому результат однаковий на будь-якому комп’ютері."
      en: "`new Date(2026, 2, 1)` is 1 March (month `2`), and `new Date(2026, 3, 1)` is 1 April. The text `\"2026-03-01T00:00\"` without a zone is local midnight, like `new Date(2026, 2, 1)`. The text `\"2026-03-01\"` is midnight UTC, like `Date.UTC(2026, 2, 1)`. Each comparison is local against local and UTC against UTC, so the result is the same on any computer."

  - id: due-dates
    kind: example
    runtime: browser-js
    dir: due-dates
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      due: { uk: "час виконувати", en: "due" }
      later: { uk: "пізніше", en: "later" }
      stored: { uk: "Збережене число:", en: "Stored number:" }
      console: { uk: "У консолі платформи:", en: "In the platform console:" }
      newYork: { uk: "У Нью-Йорку:", en: "In New York:" }
      locale: { uk: "uk-UA", en: "en-US" }
    title:
      uk: "Строки як текст, моменти як числа"
      en: "Due dates as text, instants as numbers"
    body:
      uk: |
        Строки справ зберігаються текстом `"YYYY-MM-DD"`, а «сьогодні» — параметр `today`. Порівняння `<=` для такого тексту працює як порівняння дат: рік, місяць і день записані завжди двома (чотирма) цифрами, тож текст упорядковується так само, як календар.

        Нижче — для порівняння — об’єкт `Date`: число мілісекунд, його вигляд у консолі (UTC) і показ для Нью-Йорка. Запусти.
      en: |
        Task due dates are stored as text `"YYYY-MM-DD"`, and “today” is the parameter `today`. For such text `<=` works as a date comparison: year, month and day are always written with two (four) digits, so the text sorts the same way as the calendar.

        Below, for comparison, is a `Date` object: its number of milliseconds, how the console shows it (UTC) and its display for New York. Run it.
    tryIt:
      uk: |
        1. Зміни `today` на `"2026-03-10"` і запусти: тепер «час виконувати» всі три справи. Жодна відповідь не залежить від годинника комп’ютера.
        2. Заміни строк `t-02` на `"2026-3-1"` (без нулів) і запусти з `today = "2026-03-02"`: справа раптом «пізніше», бо текстове порівняння бачить `"3"` більшим за `"0"`. Ось навіщо формат завжди з нулями — і навіщо перевіряти його шаблоном `/^\d{4}-\d{2}-\d{2}$/`.
      en: |
        1. Change `today` to `"2026-03-10"` and run: now all three tasks are “due”. No answer depends on the computer’s clock.
        2. Replace the due date of `t-02` with `"2026-3-1"` (no zeros) and run with `today = "2026-03-02"`: the task is suddenly “later”, because text comparison sees `"3"` as greater than `"0"`. That is why the format always has its zeros — and why it is worth checking with the pattern `/^\d{4}-\d{2}-\d{2}$/`.

  - id: recall-fixed-day
    kind: review
    title:
      uk: "Пригадай: фіксований день у тестах"
      en: "Recall: a fixed day in tests"
    items:
      - id: why-param
        from: js-09-04-deterministic-fixtures
        prompt:
          uk: "Чому функція `countDue(tasks, today)` отримує «сьогодні» параметром, а не читає `new Date()` усередині?"
          en: "Why does the function `countDue(tasks, today)` take “today” as a parameter instead of reading `new Date()` inside?"
        answer:
          type: choice
          options:
            - id: deterministic
              text:
                uk: "Тоді тест із тим самим днем дає той самий результат будь-коли й на будь-якому комп’ютері"
                en: "Then a test with the same day gives the same result at any time and on any computer"
            - id: faster
              text:
                uk: "Так функція працює швидше"
                en: "That way the function runs faster"
              why:
                uk: "Швидкість тут ні до чого: виклик `new Date()` майже нічого не коштує. Справа в тому, що годинник щодня інший."
                en: "Speed has nothing to do with it: calling `new Date()` costs almost nothing. The point is that the clock is different every day."
            - id: required
              text:
                uk: "Бо всередині функції `new Date()` не працює"
                en: "Because `new Date()` does not work inside a function"
              why:
                uk: "`new Date()` працює будь-де. Але результат, що залежить від годинника, тест не може передбачити."
                en: "`new Date()` works anywhere. But a test cannot predict a result that depends on the clock."
          correct: [deterministic]
        explanation:
          uk: "Функція, що сама читає годинник, сьогодні дає одну відповідь, а завтра — іншу, і тест «мерехтить». Переданий параметром день робить результат детермінованим: тест задає день і точно знає відповідь."
          en: "A function that reads the clock itself gives one answer today and another tomorrow, and the test “flickers”. A day passed in as a parameter makes the result deterministic: the test sets the day and knows the answer exactly."

  - id: due-check
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: due-check
    entry: index.js
    title:
      uk: "Чи настав строк"
      en: "Is it due yet"
    instructions:
      uk: |
        Перепиши `isDueOnOrBefore(dueDate, today)`:

        - `dueDate` — текст `"YYYY-MM-DD"` або `null` (строку немає);
        - `today` — поточний день як текст `"YYYY-MM-DD"`, його передає той, хто викликає;
        - результат — `true`, якщо строк сьогодні або раніше, і `false`, якщо пізніше чи строку немає.

        Годинник комп’ютера (`new Date()` без аргументів) не використовуй: функція має давати ту саму відповідь у будь-який день.
      en: |
        Rewrite `isDueOnOrBefore(dueDate, today)`:

        - `dueDate` is text `"YYYY-MM-DD"` or `null` (no due date);
        - `today` is the current day as text `"YYYY-MM-DD"`, passed in by the caller;
        - the result is `true` if the due date is today or earlier, and `false` if it is later or missing.

        Do not use the computer’s clock (`new Date()` without arguments): the function must give the same answer on any day.
    testTitles:
      "a task due today is due":
        uk: "Справа зі строком сьогодні — уже час"
        en: "A task due today is due"
      "an earlier due date is due, a later one is not":
        uk: "Раніший строк — час, пізніший — ні"
        en: "An earlier due date is due, a later one is not"
      "works across a month and a year boundary":
        uk: "Працює на межі місяця й року"
        en: "Works across a month and a year boundary"
      "uses the day it is given, not the clock":
        uk: "Бере переданий день, а не годинник"
        en: "Uses the day it is given, not the clock"
      "a task without a due date is never due":
        uk: "Справа без строку ніколи не настає"
        en: "A task without a due date is never due"
    hints:
      nudge:
        uk: "У стартовому коді є дві проблеми: звідки береться «сьогодні» і що станеться з `null`? Чи потрібен тут `Date` взагалі?"
        en: "The starting code has two problems: where does “today” come from, and what happens to `null`? Is a `Date` needed here at all?"
      explanation:
        uk: "Тексти `\"YYYY-MM-DD\"` з нулями можна порівнювати прямо — як слова в словнику: `\"2025-12-31\" < \"2026-01-01\"` дає `true`, бо спершу порівнюються роки. Так само `\"10:05\" < \"10:30\"` для часу в однаковому форматі. Окремо обробляй справу без строку."
        en: "`\"YYYY-MM-DD\"` texts with zeros can be compared directly — like words in a dictionary: `\"2025-12-31\" < \"2026-01-01\"` gives `true`, because the years are compared first. In the same way `\"10:05\" < \"10:30\"` for times in one format. Handle a task without a due date separately."
    solutionNote:
      uk: "Календарні дати з нулями впорядковуються як текст, тож `dueDate <= today` — повне порівняння дат без жодного `Date` і без часових поясів. Варіант із `new Date(dueDate).getTime()` теж правильний: обидва тексти — лише дати, тож обидва читаються як північ за UTC. А `new Date()` без аргументів прив’язав би відповідь до годинника."
      en: "Calendar dates with zeros sort as text, so `dueDate <= today` is a full date comparison without any `Date` and without time zones. A version with `new Date(dueDate).getTime()` is correct too: both texts are dates only, so both are read as midnight UTC. And `new Date()` without arguments would tie the answer to the clock."
    feedback:
      - when: { test: "a task due today is due" }
        message:
          uk: "Ця перевірка чекає `true`, коли строк і `today` — той самий день `\"2026-03-02\"`. «Сьогодні або раніше» означає `<=`, а не `<`."
          en: "This check expects `true` when the due date and `today` are the same day `\"2026-03-02\"`. “Today or earlier” means `<=`, not `<`."
      - when: { test: "an earlier due date is due, a later one is not" }
        message:
          uk: "Ця перевірка чекає `true` для `\"2026-03-01\"` і `false` для `\"2026-03-10\"`, коли `today` — `\"2026-03-02\"`. Порівнюй строк саме з `today`."
          en: "This check expects `true` for `\"2026-03-01\"` and `false` for `\"2026-03-10\"` when `today` is `\"2026-03-02\"`. Compare the due date with `today` itself."
      - when: { test: "works across a month and a year boundary" }
        message:
          uk: "Ця перевірка порівнює `\"2026-02-28\"` з `\"2026-03-01\"` і `\"2025-12-31\"` з `\"2026-01-01\"`. Якщо порівнювати лише день місяця (`getDate`), 28 здається пізнішим за 1 — порівнюй дату цілком."
          en: "This check compares `\"2026-02-28\"` with `\"2026-03-01\"` and `\"2025-12-31\"` with `\"2026-01-01\"`. If only the day of the month is compared (`getDate`), 28 looks later than 1 — compare the whole date."
      - when: { test: "uses the day it is given, not the clock" }
        message:
          uk: "Ця перевірка передає дні у 2030 і 2001 роках. Відповідь має залежати лише від `today`, а не від `new Date()` — годинника комп’ютера."
          en: "This check passes days in 2030 and 2001. The answer must depend only on `today`, not on `new Date()` — the computer’s clock."
      - when: { test: "a task without a due date is never due" }
        message:
          uk: "Ця перевірка чекає `false` для `dueDate` `null`. `new Date(null)` — це 1 січня 1970 року, тож без окремої перевірки справа без строку здаватиметься простроченою."
          en: "This check expects `false` when `dueDate` is `null`. `new Date(null)` is 1 January 1970, so without a separate check a task without a due date looks overdue."

  - id: to-project
    kind: transfer
    capstoneStep: JS-12
    body:
      uk: "У планувальнику, трекері звичок і трекері витрат дати — `dueDate`, `completions`, `date` — уже календарні тексти `\"YYYY-MM-DD\"` (у списку бажань дат немає). Наприкінці розділу ти запишеш це припущення в README і перевіриш, що жоден збережений запис не містить `Date` чи тексту на зразок «1 березня»."
      en: "In the planner, the habit tracker and the expense tracker the dates — `dueDate`, `completions`, `date` — are already calendar texts `\"YYYY-MM-DD\"` (the wishlist has no dates). At the end of this unit you will write this assumption down in the README and check that no stored record holds a `Date` or text such as “1 March”."
