id: js-12-01-strings-unicode
unit: JS-12
title:
  uk: "Рядки: незмінність, code units і code points"
  en: "Strings: immutable, code units and code points"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачити `length`, читання за індексом і результат `for…of` для тексту з кирилицею, емодзі та комбінованим наголосом."
    en: "Predict `length`, indexing and `for…of` output for text with Cyrillic letters, an emoji and a combining accent."
  - uk: "Пояснити, що методи тексту повертають новий текст і ніколи не змінюють початковий."
    en: "Explain that string methods return new strings and never change the original."
prerequisites: [js-01-02-numbers-and-text, js-04-06-for-of-vs-for-in]
subskills:
  - { family: J-07, skill: "string immutability and Unicode code units/code points", depth: intro }
glossary: [code-unit, code-point, surrogate-pair, grapheme-cluster]
selfCheck: [predict-lengths, predict-unchanged, truncate-label]

blocks:
  - id: three-counts
    kind: explanation
    title:
      uk: "Що насправді рахує length"
      en: "What length really counts"
    body:
      uk: |
        Текст у JavaScript зберігається як послідовність дрібних шматочків — [[code-unit|code units]]. `length` рахує саме їх, а не літери, які бачить людина.

        | Текст | Що бачить людина | `length` |
        |---|---|---|
        | `"Київ"` | 4 літери | 4 |
        | `"🐈"` | 1 символ | 2 |
        | `"e\u0301"` | 1 символ: é | 2 |

        Кирилиця й латиниця займають по одному code unit. Емодзі не влазить в один: воно записане **парою** code units — [[surrogate-pair|сурогатною парою]]. Разом ця пара означає один [[code-point|code point]] — номер символу в Unicode.

        А `"e\u0301"` — це два code points: літера `e` і окремий знак наголосу (`\u0301` — його номер, записаний у тексті). На екрані вони зливаються в одне «é». Те, що людина бачить як один символ, називають [[grapheme-cluster|grapheme cluster]].

        `for…of` і spread `[...text]` перебирають текст **по code points**, а `text[0]` і `text.at(-1)` читають **один code unit**.
      en: |
        JavaScript stores text as a sequence of small pieces — [[code-unit|code units]]. `length` counts exactly those, not the letters a person sees.

        | Text | What a person sees | `length` |
        |---|---|---|
        | `"Київ"` | 4 letters | 4 |
        | `"🐈"` | 1 character | 2 |
        | `"e\u0301"` | 1 character: é | 2 |

        Cyrillic and Latin letters take one code unit each. An emoji does not fit into one: it is written as a **pair** of code units — a [[surrogate-pair|surrogate pair]]. Together the pair means one [[code-point|code point]] — the number of a character in Unicode.

        And `"e\u0301"` is two code points: the letter `e` and a separate accent mark (`\u0301` is its number written inside the text). On screen they merge into one “é”. What a person sees as one character is called a [[grapheme-cluster|grapheme cluster]].

        `for…of` and spread `[...text]` walk the text **by code points**, while `text[0]` and `text.at(-1)` read **one code unit**.

  - id: predict-lengths
    kind: prediction
    prompt:
      uk: "`[...text]` розкладає текст у масив. Що виведуть три рядки коду?"
      en: "`[...text]` spreads text into an array. What do the three lines print?"
    code: |
      const city = "Київ";
      const cat = "🐈";
      const accented = "e\u0301"; // "e" + a combining accent, shown as é
      console.log(city.length, cat.length, accented.length);
      console.log([...city].length, [...cat].length, [...accented].length);
      console.log(city[0], city.at(-1), cat.at(-1) === cat);
    verify:
      logs: ["4 2 2", "4 1 2", "К в false"]
    answer:
      type: choice
      options:
        - id: units-points
          text:
            uk: "`4 2 2`, потім `4 1 2`, потім `К в false`"
            en: "`4 2 2`, then `4 1 2`, then `К в false`"
        - id: visible
          text:
            uk: "`4 1 1`, потім `4 1 1`, потім `К в true`"
            en: "`4 1 1`, then `4 1 1`, then `К в true`"
          why:
            uk: "`length` рахує не те, що видно на екрані, а code units. Емодзі займає два, і `e` з наголосом — теж два."
            en: "`length` counts code units, not what you see on screen. The emoji takes two, and so does `e` with its accent."
        - id: spread-units
          text:
            uk: "`4 2 2`, потім `4 2 2`, потім `К в false`"
            en: "`4 2 2`, then `4 2 2`, then `К в false`"
          why:
            uk: "Spread перебирає текст по code points, а не по code units. Два code units емодзі — це один code point, тому `[...cat]` має один елемент."
            en: "Spread walks text by code points, not by code units. The emoji’s two code units are one code point, so `[...cat]` has one element."
        - id: accent-merged
          text:
            uk: "`4 2 2`, потім `4 1 1`, потім `К в false`"
            en: "`4 2 2`, then `4 1 1`, then `К в false`"
          why:
            uk: "Знак наголосу — окремий code point. Spread його не зливає з літерою: на екрані «é» одне, а code points два."
            en: "The accent mark is a separate code point. Spread does not merge it with the letter: on screen there is one “é”, but there are two code points."
      correct: [units-points]
    explanation:
      uk: "У `\"Київ\"` чотири літери, і кожна — один code unit і один code point. Емодзі — два code units, але один code point, тому `[...cat].length` дорівнює 1, а `cat.at(-1)` повертає лише другу половину пари, не все емодзі. `e` з наголосом — два code units і два code points, хоч на екрані це один символ."
      en: "`\"Київ\"` has four letters, and each is one code unit and one code point. The emoji is two code units but one code point, so `[...cat].length` is 1, while `cat.at(-1)` returns only the second half of the pair, not the whole emoji. `e` with its accent is two code units and two code points, even though it is one character on screen."

  - id: three-rows
    kind: visual
    visual: diagram
    title:
      uk: "Один текст — три способи рахувати"
      en: "One text, three ways to count"
    textEquivalent:
      uk: "Текст «Кі́т 🐈» записано як \"Кі\\u0301т 🐈\". Рахуємо його трьома способами. Перший рядок — code units, їх рахує length: К, і, знак наголосу, т, пробіл і дві половини емодзі (D83D і DC08) — разом 7. Другий рядок — code points, їх видають for…of і [...text]: дві половини емодзі зливаються в одне 🐈, а наголос лишається окремим — разом 6. Третій рядок — те, що бачить людина: наголос сідає на «і», тому видимих символів 5: К, і́, т, пробіл, 🐈. Кожен наступний рядок коротший: 7, 6, 5."
      en: "The text “Кі́т 🐈” (the Ukrainian word for cat with a stress mark, and a cat emoji) is written as \"Кі\\u0301т 🐈\". We count it in three ways. The first row is code units, counted by length: К, і, the accent mark, т, a space and the two halves of the emoji (D83D and DC08) — 7 in total. The second row is code points, produced by for…of and [...text]: the two halves of the emoji merge into one 🐈, while the accent stays separate — 6 in total. The third row is what a person sees: the accent sits on “і”, so there are 5 visible characters: К, і́, т, a space, 🐈. Each row is shorter than the one above: 7, 6, 5."
    spec:
      layout: grid
      nodes:
        - id: units
          col: 0
          row: 0
          w: 400
          label: { uk: "code units (length = 7): К · і · ◌́ · т · ␣ · D83D · DC08", en: "code units (length = 7): К · і · ◌́ · т · ␣ · D83D · DC08" }
        - id: points
          col: 0
          row: 1
          w: 400
          label: { uk: "code points ([...text] = 6): К · і · ◌́ · т · ␣ · 🐈", en: "code points ([...text] = 6): К · і · ◌́ · т · ␣ · 🐈" }
        - id: seen
          col: 0
          row: 2
          w: 400
          label: { uk: "видно на екрані (5): К · і́ · т · ␣ · 🐈", en: "seen on screen (5): К · і́ · т · ␣ · 🐈" }
      edges:
        - { from: units, to: points, label: { uk: "пара D83D DC08 → 🐈", en: "pair D83D DC08 → 🐈" } }
        - { from: points, to: seen, label: { uk: "і + ◌́ → і́", en: "і + ◌́ → і́" } }
      hidden: [points, seen, units->points, points->seen]
      steps:
        - caption:
            uk: "Текст `\"Кі\\u0301т 🐈\"` у пам’яті — це 7 code units. Саме їх рахує `length`, і саме їх читає `text[i]`: індекси від 0 до 6."
            en: "In memory the text `\"Кі\\u0301т 🐈\"` is 7 code units. That is what `length` counts and what `text[i]` reads: indexes 0 to 6."
          highlight: [units]
        - caption:
            uk: "`for…of` і `[...text]` збирають сурогатну пару `D83D DC08` в один code point 🐈. Знак наголосу `◌́` — окремий code point, тож їх 6."
            en: "`for…of` and `[...text]` join the surrogate pair `D83D DC08` into one code point 🐈. The accent mark `◌́` is a code point of its own, so there are 6."
          show: [points, units->points]
          highlight: [points, units->points]
        - caption:
            uk: "Людина бачить 5 символів: наголос сідає на «і». Такий видимий символ — grapheme cluster. Жоден із вбудованих способів `length` чи `[...text]` не рахує саме їх."
            en: "A person sees 5 characters: the accent sits on “і”. Such a visible character is a grapheme cluster. Neither `length` nor `[...text]` counts these."
          show: [seen, points->seen]
          highlight: [seen, points->seen]

  - id: count-units
    kind: example
    runtime: browser-js
    dir: count-units
    entry: index.js
    strings:
      units: { uk: "code units:", en: "code units:" }
      points: { uk: "code points:", en: "code points:" }
    title:
      uk: "Порахуй і розріж"
      en: "Count and cut"
    body:
      uk: |
        Програма рахує чотири слова двома способами, а потім відрізає перші 3 code units від двох емодзі. Метод `slice(start, end)` повертає шматок тексту від індексу `start` до `end` (сам `end` не входить) і рахує ці індекси в code units.

        Запусти. Подивись на останній рядок: друге емодзі розрізано навпіл, і від нього лишився зламаний символ (зазвичай його показують як �).
      en: |
        The program counts four words in two ways and then cuts the first 3 code units off two emojis. The method `slice(start, end)` returns a piece of text from index `start` up to `end` (`end` itself is not included) and counts those indexes in code units.

        Run it. Look at the last line: the second emoji is cut in half, and what is left of it is a broken character (usually shown as �).
    tryIt:
      uk: |
        `Array.from(text)` робить те саме, що `[...text]`: масив code points. Додай у кінець два рядки й запусти знову:

        ```js
        const parts = Array.from(pets);
        console.log(parts.length, parts[1]);
        ```

        Тепер `parts[1]` — ціле 🐕: масив code points неможливо розрізати посеред емодзі.
      en: |
        `Array.from(text)` does the same as `[...text]`: an array of code points. Add two lines at the end and run again:

        ```js
        const parts = Array.from(pets);
        console.log(parts.length, parts[1]);
        ```

        Now `parts[1]` is a whole 🐕: an array of code points cannot be cut in the middle of an emoji.

  - id: new-strings
    kind: explanation
    title:
      uk: "Текст не змінюється — з’являється новий"
      en: "Text never changes — new text appears"
    body:
      uk: |
        Текст у JavaScript **незмінний**. Методи `toUpperCase()`, `trim()`, `slice()` не чіпають початковий текст, а повертають новий:

        ```js
        const label = "  лампа ";
        label.trim();               // результат викинуто
        const clean = label.trim(); // "лампа" — новий текст
        // label досі "  лампа "
        ```

        Щоб скористатися результатом, збережи його в змінну або одразу передай далі. Записати щось у текст за індексом (`label[0] = "Л"`) теж не вийде: у модулі, а файли на цій платформі — модулі, JavaScript відповість `TypeError`, бо модулі завжди виконуються в [[strict-mode|strict mode]].
      en: |
        Text in JavaScript is **immutable**. The methods `toUpperCase()`, `trim()`, `slice()` do not touch the original text; they return new text:

        ```js
        const label = "  lamp ";
        label.trim();               // the result is thrown away
        const clean = label.trim(); // "lamp" — new text
        // label is still "  lamp "
        ```

        To use the result, store it in a variable or pass it on right away. Writing into text by index (`label[0] = "L"`) does not work either: in a module — and files on this platform are modules — JavaScript answers with a `TypeError`, because modules always run in [[strict-mode|strict mode]].

  - id: predict-unchanged
    kind: prediction
    prompt:
      uk: "Що з’явиться в консолі, коли цей модуль запуститься?"
      en: "What appears in the console when this module runs?"
    code: |
      const city = "київ";
      const loud = city.toUpperCase();
      console.log(city, loud);
      city[0] = "К";
      console.log(city);
    verify:
      logs: ["київ КИЇВ"]
      error: TypeError
    answer:
      type: choice
      options:
        - id: new-then-error
          text:
            uk: "`київ КИЇВ`, а потім `TypeError`"
            en: "`київ КИЇВ`, then a `TypeError`"
        - id: changed-in-place
          text:
            uk: "`КИЇВ КИЇВ`, потім `Київ`"
            en: "`КИЇВ КИЇВ`, then `Київ`"
          why:
            uk: "`toUpperCase()` не змінює `city` — він повертає новий текст, який потрапив у `loud`."
            en: "`toUpperCase()` does not change `city` — it returns new text, which went into `loud`."
        - id: index-write-works
          text:
            uk: "`київ КИЇВ`, потім `Київ`"
            en: "`київ КИЇВ`, then `Київ`"
          why:
            uk: "Текст не можна змінити за індексом: це не масив. У модулі така спроба закінчується помилкою."
            en: "Text cannot be changed by index: it is not an array. In a module the attempt ends with an error."
        - id: silently-ignored
          text:
            uk: "`київ КИЇВ`, потім `київ`: запис за індексом мовчки ігнорується"
            en: "`київ КИЇВ`, then `київ`: the write by index is silently ignored"
          why:
            uk: "Мовчки ігнорується лише поза strict mode, у старих скриптах. Модуль завжди в strict mode, тож тут — `TypeError`."
            en: "It is silently ignored only outside strict mode, in old scripts. A module is always in strict mode, so here it is a `TypeError`."
      correct: [new-then-error]
    explanation:
      uk: "`city.toUpperCase()` повернув новий текст `\"КИЇВ\"`, а `city` лишився `\"київ\"`. Рядок `city[0] = \"К\"` намагається змінити сам текст — у модулі це `TypeError`, і програма зупиняється до останнього `console.log`."
      en: "`city.toUpperCase()` returned new text `\"КИЇВ\"`, and `city` stayed `\"київ\"`. The line `city[0] = \"К\"` tries to change the text itself — in a module that is a `TypeError`, and the program stops before the last `console.log`."

  - id: recall-quotes
    kind: review
    title:
      uk: "Пригадай: лапки"
      en: "Recall: quotes"
    items:
      - id: apostrophe-quotes
        from: js-01-02-numbers-and-text
        prompt:
          uk: "Який рядок коду виведе слово з апострофом і не зупиниться з помилкою?"
          en: "Which line of code prints a word with an apostrophe and does not stop with an error?"
        answer:
          type: choice
          options:
            - id: double-outside
              text:
                uk: "`console.log(\"п'ять\");`"
                en: "`console.log(\"it's\");`"
            - id: single-outside
              text:
                uk: "`console.log('п'ять');`"
                en: "`console.log('it's');`"
              why:
                uk: "Апостроф закриває текст, що почався з одинарної лапки, і решта рядка стає незрозумілим кодом — `SyntaxError`."
                en: "The apostrophe closes the text that started with a single quote, and the rest of the line becomes meaningless code — a `SyntaxError`."
            - id: no-quotes
              text:
                uk: "`console.log(п'ять);`"
                en: "`console.log(it's);`"
              why:
                uk: "Без лапок це не текст. JavaScript спробує прочитати це як код і не зможе."
                en: "Without quotes it is not text. JavaScript tries to read it as code and cannot."
          correct: [double-outside]
        explanation:
          uk: "Текст закінчується на першій лапці того самого виду, з якої він почався. Тому слово з апострофом беруть у подвійні лапки."
          en: "Text ends at the first quote of the same kind it started with. That is why a word with an apostrophe goes in double quotes."

  - id: truncate-label
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: truncate-label
    entry: index.js
    strings:
      headphones: { uk: "🎧 Навушники", en: "🎧 Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    title:
      uk: "Коротка назва без зламаних символів"
      en: "A short label without broken characters"
    instructions:
      uk: |
        У картці бажання є місце лише для коротких назв. Допиши `truncateLabel(text, max)`:

        - якщо в тексті не більше `max` code points, поверни текст без змін;
        - інакше залиш перші `max` code points і додай у кінці `"…"` (один символ трикрапки).

        Емодзі не можна розрізати навпіл: рахуй code points, а не `length`.
      en: |
        A wish card has room only for short labels. Finish `truncateLabel(text, max)`:

        - if the text has at most `max` code points, return it unchanged;
        - otherwise keep the first `max` code points and add `"…"` at the end (a single ellipsis character).

        An emoji must never be cut in half: count code points, not `length`.
    testTitles:
      "a label that fits is returned unchanged":
        uk: "Назва, що вміщається, повертається без змін"
        en: "A label that fits is returned unchanged"
      'a long label keeps max characters and gets "…"':
        uk: "Довга назва зберігає `max` символів і отримує `…`"
        en: "A long label keeps `max` characters and gets `…`"
      "an emoji is never cut in half":
        uk: "Емодзі ніколи не розрізається навпіл"
        en: "An emoji is never cut in half"
      "max counts code points, not code units":
        uk: "`max` рахує code points, а не code units"
        en: "`max` counts code points, not code units"
    hints:
      nudge:
        uk: "Що дає точну кількість символів-емодзі: `text.length` чи кількість елементів у `[...text]`?"
        en: "Which gives the right count for emoji characters: `text.length` or the number of elements in `[...text]`?"
      explanation:
        uk: "Розклади текст у масив code points. У масиву теж є `slice(start, end)`: `[\"a\", \"🐈\", \"b\"].slice(1)` дає масив без першого елемента — `[\"🐈\", \"b\"]`. А `join(\"\")` склеює масив назад у текст: `[\"🐈\", \"b\"].join(\"\")` дає `\"🐈b\"`. Трикрапку додавай лише тоді, коли code points більше, ніж `max`."
        en: "Spread the text into an array of code points. Arrays have `slice(start, end)` too: `[\"a\", \"🐈\", \"b\"].slice(1)` gives that array without its first element — `[\"🐈\", \"b\"]`. And `join(\"\")` glues an array back into text: `[\"🐈\", \"b\"].join(\"\")` gives `\"🐈b\"`. Add the ellipsis only when there are more code points than `max`."
    solutionNote:
      uk: "`[...text]` ділить текст на code points, тож `slice` на масиві ніколи не розріже сурогатну пару. Альтернатива — цикл `for…of`, який теж іде по code points. Обмеження: знак наголосу — окремий code point, тому `\"e\\u0301\"` все ж можна відрізати від літери. Щоб різати саме видимі символи (grapheme clusters), існує `Intl.Segmenter`; для назв у проєкті code points досить."
      en: "`[...text]` splits text into code points, so `slice` on the array never cuts a surrogate pair. An alternative is a `for…of` loop, which also walks code points. A limit: an accent mark is a separate code point, so `\"e\\u0301\"` can still be cut away from its letter. To cut exactly at visible characters (grapheme clusters) there is `Intl.Segmenter`; for labels in the project, code points are enough."
    feedback:
      - when: { test: "a label that fits is returned unchanged" }
        message:
          uk: "Ця перевірка чекає той самий текст без `…`, коли code points не більше, ніж `max` (`truncateLabel(\"abc\", 3)` — це `\"abc\"`). Якщо прийшов `undefined`, функція нічого не повертає; якщо з `…` — трикрапка додається завжди."
          en: "This check expects the same text without `…` when there are at most `max` code points (`truncateLabel(\"abc\", 3)` is `\"abc\"`). If `undefined` came back, the function returns nothing; if it ends with `…`, the ellipsis is added every time."
      - when: { test: 'a long label keeps max characters and gets "…"' }
        message:
          uk: "Ця перевірка чекає рівно `max` перших символів і одну трикрапку `…` (не три крапки `...`): `truncateLabel(\"abcdefgh\", 3)` — це `\"abc…\"`."
          en: "This check expects exactly the first `max` characters and one ellipsis `…` (not three dots `...`): `truncateLabel(\"abcdefgh\", 3)` is `\"abc…\"`."
      - when: { test: "an emoji is never cut in half" }
        message:
          uk: "Ця перевірка чекає `\"🎧🎧…\"` для `truncateLabel(\"🎧🎧🎧\", 2)`. Якщо в результаті одне емодзі чи зламаний символ, текст ріжеться за code units (`text.slice`): розклади його на code points."
          en: "This check expects `\"🎧🎧…\"` for `truncateLabel(\"🎧🎧🎧\", 2)`. If the result has one emoji or a broken character, the text is cut by code units (`text.slice`): split it into code points."
      - when: { test: "max counts code points, not code units" }
        message:
          uk: "`\"🎧🎧\"` має `length` 4, але лише 2 code points, тож `truncateLabel(\"🎧🎧\", 2)` має повернути його без змін. Порівнюй `max` із кількістю code points, а не з `text.length`."
          en: "`\"🎧🎧\"` has a `length` of 4 but only 2 code points, so `truncateLabel(\"🎧🎧\", 2)` must return it unchanged. Compare `max` with the number of code points, not with `text.length`."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` з’являється, коли метод викликано не на тому значенні, або коли програма зупинилася ще під час запуску й функції `truncateLabel` немає (`… is not a function`) — тоді спершу виправ першу помилку в консолі. Пам’ятай: `[...text]` — масив, а не текст; щоб отримати текст назад, масив треба склеїти через `join(\"\")`."
          en: "A `TypeError` appears when a method is called on the wrong kind of value, or when the program stopped while starting and `truncateLabel` does not exist (`… is not a function`) — then fix the first error in the console first. Remember: `[...text]` is an array, not text; to get text back, the array has to be glued with `join(\"\")`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-12
    body:
      uk: "Назви в твоєму проєкті вводить людина, і там можуть бути емодзі. Наприкінці розділу ти перевіриш, що підписи й обрізання тексту в проєкті рахують code points і не ламають символів."
      en: "Labels in your project are typed by a person, and they can contain emoji. At the end of this unit you will check that labels and text shortening in your project count code points and never break characters."
