id: js-12-09-timezones-dst
unit: JS-12
title:
  uk: "Часові пояси та пастки переходу на літній час"
  en: "Timezones and DST pitfalls"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Показати на фіксованому моменті, що той самий timestamp — різні календарні дні в Києві та Нью-Йорку."
    en: "Show with a fixed instant how one timestamp displays as different calendar days in Kyiv and in New York."
  - uk: "Пояснити, чому «+24 години» — не завжди «завтра о тій самій порі» під час переходу на літній час і чому проєкт уникає арифметики з часовими поясами."
    en: "Explain why adding 24 hours is not always “the same time tomorrow” across a DST change, and why the capstone avoids timezone arithmetic."
prerequisites: [js-12-08-dates-storage-presentation]
subskills:
  - { family: J-08, skill: "timezone/DST pitfalls", depth: intro }
glossary: [utc, timezone, utc-offset, daylight-saving-time]
selfCheck: [predict-zones, add-days]

blocks:
  - id: offsets
    kind: explanation
    title:
      uk: "Пояс — це правило, а не число"
      en: "A time zone is a rule, not a number"
    body:
      uk: |
        [[utc|UTC]] — всесвітній час, від якого відраховують усі інші. [[timezone|Часовий пояс]] на зразок `Europe/Kyiv` чи `America/New_York` — це **правило**: на скільки годин місцевий годинник відрізняється від UTC у кожен момент. Цю різницю називають [[utc-offset|зсувом]] (offset).

        Зсув змінюється протягом року через [[daylight-saving-time|перехід на літній час]] (DST):

        | Пояс | Узимку | Улітку | Коли переводять годинник навесні (2026) |
        |---|---|---|---|
        | `Europe/Kyiv` | UTC+2 | UTC+3 | 29 березня, 03:00 → 04:00 |
        | `America/New_York` | UTC−5 | UTC−4 | 8 березня, 02:00 → 03:00 |

        Тому `new Date()` і показ без `timeZone` залежать від того, який пояс стоїть на комп’ютері. Щоб результат був однаковим скрізь, передавай пояс явно: `Intl.DateTimeFormat("uk-UA", { timeZone: "Europe/Kyiv" })`. Самі правила поясів браузер бере зі своєї бази часових поясів.
      en: |
        [[utc|UTC]] is the world time that all others are counted from. A [[timezone|time zone]] such as `Europe/Kyiv` or `America/New_York` is a **rule**: how many hours the local clock differs from UTC at every instant. That difference is called the [[utc-offset|UTC offset]].

        The offset changes during the year because of [[daylight-saving-time|daylight saving time]] (DST):

        | Zone | In winter | In summer | When clocks move in spring (2026) |
        |---|---|---|---|
        | `Europe/Kyiv` | UTC+2 | UTC+3 | 29 March, 03:00 → 04:00 |
        | `America/New_York` | UTC−5 | UTC−4 | 8 March, 02:00 → 03:00 |

        That is why `new Date()` and a display without `timeZone` depend on which zone the computer is set to. To get the same result everywhere, pass the zone explicitly: `Intl.DateTimeFormat("en-US", { timeZone: "Europe/Kyiv" })`. The browser takes the zone rules themselves from its own time zone database.

  - id: predict-zones
    kind: prediction
    prompt:
      uk: "Що виведе код? `hourCycle: \"h23\"` просить показувати години від 0 до 23."
      en: "What does the code print? `hourCycle: \"h23\"` asks for hours from 0 to 23."
    code: |
      const instant = new Date("2026-03-01T03:30:00Z");
      const day = (timeZone) =>
        new Intl.DateTimeFormat("en-US", { timeZone, dateStyle: "medium" }).format(instant);
      console.log(day("Europe/Kyiv"), "|", day("America/New_York"));

      const noonInNewYork = new Date("2026-03-07T17:00:00Z");
      const plus24h = new Date(noonInNewYork.getTime() + 24 * 60 * 60 * 1000);
      const clock = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hourCycle: "h23",
      });
      console.log(clock.format(noonInNewYork), "→", clock.format(plus24h));
    verify:
      logs: ["Mar 1, 2026 | Feb 28, 2026", "12:00 → 13:00"]
    answer:
      type: choice
      options:
        - id: dst-hour
          code: "Mar 1, 2026 | Feb 28, 2026\n12:00 → 13:00"
        - id: same-noon
          code: "Mar 1, 2026 | Feb 28, 2026\n12:00 → 12:00"
          why:
            uk: "У ніч на 8 березня Нью-Йорк переводить годинник з 02:00 на 03:00, і ця доба триває лише 23 години. Через 24 години після полудня годинник показує вже 13:00."
            en: "In the night to 8 March New York moves its clocks from 02:00 to 03:00, and that day lasts only 23 hours. 24 hours after noon the clock already shows 13:00."
        - id: same-day
          code: "Mar 1, 2026 | Mar 1, 2026\n12:00 → 13:00"
          why:
            uk: "О 03:30 за UTC у Нью-Йорку (UTC−5) ще 22:30 попереднього дня — 28 лютого."
            en: "At 03:30 UTC it is still 22:30 of the previous day in New York (UTC−5) — 28 February."
        - id: dst-back
          code: "Mar 1, 2026 | Feb 28, 2026\n12:00 → 11:00"
          why:
            uk: "Навесні годинник переводять **вперед**: година зникає, а не додається. Тому за ті самі 24 години стрілки проходять на годину більше — до 13:00."
            en: "In spring the clocks move **forward**: an hour disappears, it is not added. So in the same 24 hours the hands go one hour further — to 13:00."
      correct: [dst-hour]
    explanation:
      uk: "О 03:30 за UTC у Києві (UTC+2) 05:30 1 березня, а в Нью-Йорку (UTC−5) 22:30 28 лютого — той самий момент, різні дні. А 8 березня Нью-Йорк переводить годинник уперед, тому «+24 години» від полудня 7 березня — це 13:00 8 березня, а не полудень."
      en: "At 03:30 UTC it is 05:30 on 1 March in Kyiv (UTC+2) and 22:30 on 28 February in New York (UTC−5) — the same instant, different days. And on 8 March New York moves its clocks forward, so “+24 hours” from noon on 7 March is 13:00 on 8 March, not noon."

  - id: two-lanes
    kind: visual
    visual: diagram
    title:
      uk: "Один момент у двох поясах і доба на 23 години"
      en: "One instant in two zones, and a 23-hour day"
    textEquivalent:
      uk: "Угорі — момент 2026-03-01T03:30:00Z. У поясі Europe/Kyiv зсув узимку UTC+2, тож це 1 березня, 05:30. У поясі America/New_York зсув UTC−5, тож це 28 лютого, 22:30: та сама мить припадає на різні календарні дні. Нижче — смуга Нью-Йорка тижнем пізніше. 7 березня о 12:00 (UTC−5) додаємо рівно 24 години. Уночі 8 березня о 02:00 годинник у Нью-Йорку перескакує на 03:00 і зсув стає UTC−4: година 02:00–03:00 цього дня не існує. Тому через 24 години годинник показує 8 березня 13:00, а не 12:00."
      en: "At the top is the instant 2026-03-01T03:30:00Z. In the Europe/Kyiv zone the winter offset is UTC+2, so it is 1 March, 05:30. In the America/New_York zone the offset is UTC−5, so it is 28 February, 22:30: the same moment falls on different calendar days. Below is the New York lane a week later. On 7 March at 12:00 (UTC−5) we add exactly 24 hours. In the night of 8 March at 02:00 the New York clock jumps to 03:00 and the offset becomes UTC−4: the hour 02:00–03:00 does not exist on that day. So 24 hours later the clock shows 8 March 13:00, not 12:00."
    spec:
      layout: grid
      groups:
        - { id: kyiv, label: "Europe/Kyiv" }
        - { id: ny, label: "America/New_York" }
      nodes:
        - { id: instant, col: 0, row: 0, w: 360, shape: pill, label: "2026-03-01T03:30:00Z" }
        - { id: kyiv-day, group: kyiv, col: 0, row: 1, w: 360, label: { uk: "1 березня, 05:30 (UTC+2)", en: "1 March, 05:30 (UTC+2)" } }
        - { id: ny-day, group: ny, col: 0, row: 2, w: 360, label: { uk: "28 лютого, 22:30 (UTC−5)", en: "28 February, 22:30 (UTC−5)" } }
        - { id: ny-noon, group: ny, col: 0, row: 3, w: 360, label: { uk: "7 березня, 12:00 (UTC−5)", en: "7 March, 12:00 (UTC−5)" } }
        - { id: ny-jump, group: ny, col: 0, row: 4, w: 360, shape: note, label: { uk: "8 березня: 02:00 → 03:00, тепер UTC−4", en: "8 March: 02:00 → 03:00, now UTC−4" } }
        - { id: ny-next, group: ny, col: 0, row: 5, w: 360, label: { uk: "8 березня, 13:00 (UTC−4)", en: "8 March, 13:00 (UTC−4)" } }
      edges:
        - { id: to-kyiv, from: instant, to: kyiv-day }
        - { id: plus-day, from: ny-noon, to: ny-jump, label: "+24 h" }
        - { id: lands, from: ny-jump, to: ny-next }
      hidden: [ny-noon, ny-jump, ny-next, plus-day, lands]
      steps:
        - caption:
            uk: "Момент `2026-03-01T03:30:00Z` — одна мить для всієї планети."
            en: "The instant `2026-03-01T03:30:00Z` is one moment for the whole planet."
          highlight: [instant]
        - caption:
            uk: "У Києві (UTC+2) це вже 1 березня, 05:30, а в Нью-Йорку (UTC−5) — ще 28 лютого, 22:30. Календарний день залежить від поясу."
            en: "In Kyiv (UTC+2) it is already 1 March, 05:30, and in New York (UTC−5) it is still 28 February, 22:30. The calendar day depends on the zone."
          highlight: [kyiv-day, ny-day, to-kyiv]
        - caption:
            uk: "Тиждень потому, полудень 7 березня в Нью-Йорку. Додаємо рівно 24 години — 86 400 000 мс."
            en: "A week later, noon on 7 March in New York. We add exactly 24 hours — 86,400,000 ms."
          show: [ny-noon, plus-day, ny-jump]
          highlight: [ny-noon, plus-day]
        - caption:
            uk: "Уночі 8 березня годинник перескакує з 02:00 на 03:00: цієї години не існує, доба триває 23 години."
            en: "In the night of 8 March the clock jumps from 02:00 to 03:00: that hour does not exist, and the day lasts 23 hours."
          highlight: [ny-jump]
        - caption:
            uk: "Тому через 24 години — 13:00, а не полудень. «+24 години» і «завтра о тій самій порі» — різні речі, і саме тому проєкт рахує дні календарними датами, без часових поясів."
            en: "So 24 hours later it is 13:00, not noon. “+24 hours” and “the same time tomorrow” are different things — and that is exactly why the project counts days as calendar dates, without time zones."
          show: [ny-next, lands]
          highlight: [ny-next, lands]

  - id: two-cities
    kind: example
    runtime: browser-js
    dir: two-cities
    entry: index.js
    strings:
      locale: { uk: "uk-UA", en: "en-US" }
      before: { uk: "Нью-Йорк, полудень:", en: "New York, noon:" }
      after: { uk: "Нью-Йорк, +24 години:", en: "New York, +24 hours:" }
    title:
      uk: "Явний timeZone — однаковий результат скрізь"
      en: "An explicit timeZone gives the same result everywhere"
    body:
      uk: |
        Момент `04:30` за UTC показано для двох поясів, а потім — «полудень +24 години» в Нью-Йорку. Оскільки кожен показ отримує `timeZone`, програма виводить те саме на будь-якому комп’ютері. Запусти.
      en: |
        The instant `04:30` UTC is shown for two zones, and then “noon +24 hours” in New York. Because every display gets a `timeZone`, the program prints the same on any computer. Run it.
    tryIt:
      uk: |
        1. Зсунь момент на годину: `"2026-03-01T05:30:00Z"`. Для Києва змінилася лише година, а в Нью-Йорку перемкнувся **день**: 23:30 28 лютого стало 00:30 1 березня.
        2. Прибери рядок `timeZone,` з першого форматера й запусти: тепер «Київ» і «Нью-Йорк» показують однаковий текст — час **твого** комп’ютера. У когось іншого він буде інший. Поверни рядок назад.
      en: |
        1. Move the instant by one hour: `"2026-03-01T05:30:00Z"`. For Kyiv only the hour changed, but in New York the **day** switched: 23:30 on 28 February became 00:30 on 1 March.
        2. Remove the line `timeZone,` from the first formatter and run: now “Kyiv” and “New York” show the same text — the time of **your** computer. For someone else it will differ. Put the line back.

  - id: recall-json-date
    kind: review
    title:
      uk: "Пригадай: Date у JSON"
      en: "Recall: a Date in JSON"
    items:
      - id: stringify-date
        from: js-07-04-json
        prompt:
          uk: "Що виведе цей рядок коду?"
          en: "What does this line print?"
        code: |
          console.log(JSON.stringify({ day: new Date("2026-03-01") }));
        verify:
          logs: ["{\"day\":\"2026-03-01T00:00:00.000Z\"}"]
        answer:
          type: choice
          options:
            - id: iso-text
              code: "{\"day\":\"2026-03-01T00:00:00.000Z\"}"
            - id: date-object
              code: "{\"day\":{}}"
              why:
                uk: "У `Date` є метод `toJSON`, і `JSON.stringify` викликає його: виходить текст ISO в UTC, а не порожній об’єкт."
                en: "A `Date` has a `toJSON` method, and `JSON.stringify` calls it: the result is ISO text in UTC, not an empty object."
            - id: number
              code: "{\"day\":1772323200000}"
              why:
                uk: "У JSON потрапляє текст ISO, а не число мілісекунд."
                en: "What goes into JSON is ISO text, not the number of milliseconds."
            - id: local-text
              code: "{\"day\":\"2026-03-01\"}"
              why:
                uk: "Календарного дня в `Date` немає — лише момент. Тому в JSON потрапляє повний момент у UTC, з годинами й `Z`."
                en: "A `Date` has no calendar day — only an instant. So the full instant in UTC, with hours and `Z`, goes into JSON."
          correct: [iso-text]
        explanation:
          uk: "`JSON.stringify` записує `Date` як текст ISO в UTC. Після `JSON.parse` назад приходить **текст**, а не `Date`. Ще одна причина зберігати календарну дату одразу текстом `\"YYYY-MM-DD\"`: вона проходить через JSON без змін."
          en: "`JSON.stringify` writes a `Date` as ISO text in UTC. After `JSON.parse` you get **text** back, not a `Date`. One more reason to store a calendar date as text `\"YYYY-MM-DD\"` from the start: it goes through JSON unchanged."

  - id: add-days
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: add-days
    entry: index.js
    title:
      uk: "Додати дні до календарної дати"
      en: "Add days to a calendar date"
    instructions:
      uk: |
        Допиши `addCalendarDays(date, n)`: вона отримує календарну дату `"YYYY-MM-DD"` і ціле `n` (може бути від’ємним) і повертає дату через `n` днів у тому самому форматі.

        Рахуй лише в UTC: там немає переходу на літній час, і кожна доба — рівно 24 години. Результат не повинен залежати від поясу комп’ютера.

        Корисне: `Date.UTC(year, monthIndex, day)` повертає timestamp півночі за UTC і сам переносить зайві дні в наступний місяць (`Date.UTC(2026, 0, 32)` — це 1 лютого); `date.toISOString().slice(0, 10)` дає перші 10 символів — `"YYYY-MM-DD"`.
      en: |
        Finish `addCalendarDays(date, n)`: it receives a calendar date `"YYYY-MM-DD"` and a whole number `n` (possibly negative) and returns the date `n` days later in the same format.

        Calculate in UTC only: it has no daylight saving time, and every day is exactly 24 hours. The result must not depend on the computer’s time zone.

        Useful: `Date.UTC(year, monthIndex, day)` returns the timestamp of midnight UTC and carries extra days into the next month by itself (`Date.UTC(2026, 0, 32)` is 1 February); `date.toISOString().slice(0, 10)` gives the first 10 characters — `"YYYY-MM-DD"`.
    testTitles:
      "adds days inside a month":
        uk: "Додає дні в межах місяця"
        en: "Adds days inside a month"
      "rolls over the end of a month and a year":
        uk: "Переходить через кінець місяця й року"
        en: "Rolls over the end of a month and a year"
      "goes back with a negative number":
        uk: "Іде назад із від’ємним числом"
        en: "Goes back with a negative number"
      "is not shifted by daylight saving weekends":
        uk: "Вихідні з переходом на літній час нічого не зсувають"
        en: "Is not shifted by daylight saving weekends"
      'returns text in the "YYYY-MM-DD" form':
        uk: "Повертає текст у вигляді `\"YYYY-MM-DD\"`"
        en: "Returns text in the `\"YYYY-MM-DD\"` form"
    hints:
      nudge:
        uk: "Розбери текст на рік, місяць і день, порахуй новий момент у UTC і запиши його назад як текст. На якому кроці легко помилитися з номером місяця?"
        en: "Split the text into year, month and day, compute the new instant in UTC and write it back as text. At which step is it easy to get the month number wrong?"
      explanation:
        uk: "`\"2026-03-01\".split(\"-\")` дає `[\"2026\", \"03\", \"01\"]`, а `.map(Number)` — числа. Місяць у тексті рахується з 1, а в `Date.UTC` — з 0, тож його треба зменшити на один. Наприклад, `Date.UTC(2026, 11, 31 + 1)` — це вже 1 січня 2027: перенесення через межі місяця й року `Date.UTC` робить сам."
        en: "`\"2026-03-01\".split(\"-\")` gives `[\"2026\", \"03\", \"01\"]`, and `.map(Number)` turns them into numbers. The month in the text counts from 1, but in `Date.UTC` from 0, so subtract one. For example, `Date.UTC(2026, 11, 31 + 1)` is already 1 January 2027: `Date.UTC` carries over month and year boundaries by itself."
    solutionNote:
      uk: "Усе відбувається в UTC: `Date.UTC` будує північ потрібного дня, сам переносить дні через межі місяця й року, а `toISOString` повертає дату теж в UTC. Тому ні пояс комп’ютера, ні перехід на літній час на результат не впливають. Варіант із `new Date(date)` плюс `n * 24` години теж правильний — саме тому, що текст лише з датою читається в UTC."
      en: "Everything happens in UTC: `Date.UTC` builds midnight of the needed day and carries days over month and year boundaries itself, and `toISOString` returns the date in UTC too. So neither the computer’s zone nor daylight saving time affects the result. A version with `new Date(date)` plus `n * 24` hours is correct too — precisely because date-only text is read in UTC."
    feedback:
      - when: { test: "adds days inside a month" }
        message:
          uk: "Ця перевірка чекає `\"2026-03-05\"` для `(\"2026-03-02\", 3)` і ту саму дату для `n = 0`. Якщо вийшов квітень, місяць не зменшено на один перед `Date.UTC`."
          en: "This check expects `\"2026-03-05\"` for `(\"2026-03-02\", 3)` and the same date for `n = 0`. If you got April, the month was not reduced by one before `Date.UTC`."
      - when: { test: "rolls over the end of a month and a year" }
        message:
          uk: "Ця перевірка чекає `\"2026-03-01\"` після `\"2026-02-28\"`, `\"2027-01-01\"` після `\"2026-12-31\"` і `\"2028-02-29\"` (високосний рік). Просте додавання до числа дня дає неіснуючі дати на зразок `\"2026-02-29\"` — нехай перенесення робить `Date.UTC`."
          en: "This check expects `\"2026-03-01\"` after `\"2026-02-28\"`, `\"2027-01-01\"` after `\"2026-12-31\"` and `\"2028-02-29\"` (a leap year). Simply adding to the day number gives dates that do not exist, such as `\"2026-02-29\"` — let `Date.UTC` do the carrying."
      - when: { test: "goes back with a negative number" }
        message:
          uk: "Ця перевірка чекає `\"2026-02-28\"` для `(\"2026-03-01\", -1)` і `\"2025-12-31\"` для `(\"2026-01-01\", -1)`. `Date.UTC` приймає й день `0` чи від’ємний: це дні попереднього місяця."
          en: "This check expects `\"2026-02-28\"` for `(\"2026-03-01\", -1)` and `\"2025-12-31\"` for `(\"2026-01-01\", -1)`. `Date.UTC` also accepts day `0` or negative days: they are days of the previous month."
      - when: { test: "is not shifted by daylight saving weekends" }
        message:
          uk: "Ця перевірка проходить через вихідні з переходом на літній час у Києві й Нью-Йорку і чекає звичайного результату. Якщо дата зсунулася, десь використано місцевий час (`new Date(y, m, d)`, `getDate()`): рахуй і читай лише в UTC."
          en: "This check crosses the daylight saving weekends of Kyiv and New York and expects the ordinary result. If the date shifted, local time is used somewhere (`new Date(y, m, d)`, `getDate()`): calculate and read in UTC only."
      - when: { test: 'returns text in the "YYYY-MM-DD" form' }
        message:
          uk: "Ця перевірка чекає текст `\"2026-03-09\"`, а не `Date` і не число. `toISOString().slice(0, 10)` бере з повного ISO-тексту лише дату."
          en: "This check expects the text `\"2026-03-09\"`, not a `Date` and not a number. `toISOString().slice(0, 10)` takes only the date from the full ISO text."
      - when: { error: RangeError }
        message:
          uk: "`RangeError: Invalid time value` означає, що `toISOString` отримав неправильну дату — найчастіше в `Date.UTC` потрапив `NaN`, бо текст розібрано не на числа. Перевір, що рік, місяць і день — числа."
          en: "`RangeError: Invalid time value` means `toISOString` got an invalid date — most often a `NaN` went into `Date.UTC` because the text was not split into numbers. Check that the year, month and day are numbers."

  - id: to-project
    kind: transfer
    capstoneStep: JS-12
    body:
      uk: "Серія звички, строки справ і дні витрат у проєкті — календарні дати. Наприкінці розділу ти перевіриш, що проєкт ніде не додає «24 години» до моменту, а рахує дні так, як у цій вправі, і що «сьогодні» завжди приходить параметром."
      en: "A habit streak, task due dates and expense days in the project are calendar dates. At the end of this unit you will check that the project never adds “24 hours” to an instant but counts days as in this exercise, and that “today” always arrives as a parameter."
