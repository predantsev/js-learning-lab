id: js-12-05-integer-minor-units
unit: JS-12
title:
  uk: "Гроші як цілі мінорні одиниці"
  en: "Money as integer minor units"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Перетворити введену суму на зразок `'12,50'` на ціле число копійок без проходу через дробове число — і назад у текст для показу."
    en: "Convert a typed amount such as `'12,50'` into integer minor units without passing through a float, and back to text for display."
  - uk: "Додавати, ділити й рахувати відсоток від сум у копійках за явним правилом заокруглення, щоб жодна копійка не загубилася."
    en: "Sum, split and apply a percentage to minor-unit amounts with an explicit rounding rule so no kopiyka is lost."
prerequisites: [js-12-04-math-parsing]
subskills:
  - { family: J-07, skill: "integer minor units", depth: intro }
glossary: [minor-unit, remainder-allocation]
selfCheck: [predict-totals, parse-amount]

blocks:
  - id: count-kopiykas
    kind: explanation
    title:
      uk: "Рахуй копійки, а не гривні"
      en: "Count kopiykas, not hryvnias"
    body:
      uk: |
        Ти вже бачив: `0.1 + 0.2` — не зовсім `0.3`. Для грошей «не зовсім» неприйнятне. Тому суми зберігають у **[[minor-unit|мінорних одиницях]]** — найменших частках валюти: копійках, центах. `12,50 грн` — це ціле число `1250`.

        Цілі числа додаються **точно** (аж до межі безпечних цілих — це трильйони гривень). Саме тому в записі витрати поле називається `amountMinor`: «Продукти на тиждень» — `84550`, тобто 845,50 грн.

        Правило просте:

        1. **на вході** — розібрати введений текст одразу в копійки, не через дробове число;
        2. **усередині** — додавати, порівнювати, зберігати лише цілі;
        3. **на виході** — перетворити копійки на текст для показу.

        Заокругляти дробові гривні «лише під час показу» не рятує: похибка вже накопичилася в сумі, і показ лише ховає її.
      en: |
        You have already seen that `0.1 + 0.2` is not quite `0.3`. For money “not quite” is unacceptable. So amounts are stored in **[[minor-unit|minor units]]** — the smallest parts of a currency: kopiykas, cents. `12.50 UAH` is the whole number `1250`.

        Whole numbers add up **exactly** (all the way to the safe-integer limit — that is trillions of hryvnias). That is why the field of an expense record is called `amountMinor`: “Weekly groceries” is `84550`, that is 845.50 UAH.

        The rule is simple:

        1. **on the way in** — parse the typed text straight into kopiykas, not through a fractional number;
        2. **inside** — add, compare and store only whole numbers;
        3. **on the way out** — turn kopiykas into text for display.

        Rounding fractional hryvnias “only when showing them” does not save you: the error has already piled up in the total, and the display only hides it.

  - id: predict-totals
    kind: prediction
    prompt:
      uk: "Десять кав по 10 копійок: один раз у дробових гривнях, другий — у цілих копійках. Потім 100 копійок ділять на трьох. Що виведе код?"
      en: "Ten coffees at 10 kopiykas: once in fractional hryvnias, once in whole kopiykas. Then 100 kopiykas are split between three people. What does the code print?"
    code: |
      let totalFloat = 0;
      let totalMinor = 0;
      for (let i = 0; i < 10; i++) {
        totalFloat = totalFloat + 0.1;
        totalMinor = totalMinor + 10;
      }
      console.log(totalFloat, totalMinor);
      const share = Math.floor(100 / 3);
      console.log(share, share * 3);
    verify:
      logs: ["0.9999999999999999 100", "33 99"]
    answer:
      type: choice
      options:
        - id: float-drift
          code: "0.9999999999999999 100\n33 99"
        - id: both-exact
          code: "1 100\n33 99"
          why:
            uk: "Кожне додавання `0.1` додає крихітну похибку, і за десять разів вона стає помітною. Цілі `10` додаються точно."
            en: "Each addition of `0.1` adds a tiny error, and after ten times it becomes visible. The whole `10`s add up exactly."
        - id: equal-shares
          code: "0.9999999999999999 100\n33 100"
          why:
            uk: "100 на три цілі рівні частини не ділиться: `33 × 3 = 99`. Одна копійка залишилася, і її треба комусь віддати."
            en: "100 does not split into three equal whole parts: `33 × 3 = 99`. One kopiyka is left over, and someone has to get it."
        - id: fractional-share
          code: "0.9999999999999999 100\n33.333333333333336 100"
          why:
            uk: "`Math.floor` відкидає дробову частину, тож частка — ціле `33`."
            en: "`Math.floor` drops the fractional part, so the share is the whole `33`."
      correct: [float-drift]
    explanation:
      uk: "Дробова сума «з’їла» мізерну частку копійки: `0.9999999999999999` замість `1`. Ціла сума — рівно `100`. А поділ на цілі частки губить залишок: три частки по `33` — це `99`, а не `100`."
      en: "The fractional total “ate” a tiny part of a kopiyka: `0.9999999999999999` instead of `1`. The whole-number total is exactly `100`. And splitting into whole shares loses the remainder: three shares of `33` make `99`, not `100`."

  - id: split-bill
    kind: example
    runtime: browser-js
    dir: split-bill
    entry: index.js
    strings:
      float: { uk: "Гривні (дробові):", en: "Hryvnias (fractional):" }
      minor: { uk: "Копійки (цілі):", en: "Kopiykas (whole):" }
      shares: { uk: "Частки:", en: "Shares:" }
      sum: { uk: "разом", en: "total" }
      of: { uk: "з", en: "of" }
    title:
      uk: "Рахунок на трьох"
      en: "A bill for three"
    body:
      uk: |
        Запусти: та сама картина, що в прогнозі. Частки по `33` разом дають лише `99` копійок із `100`.
      en: |
        Run it: the same picture as in the prediction. Shares of `33` add up to only `99` kopiykas out of `100`.
    tryIt:
      uk: |
        Віддай залишок першій частці. Перед рядком з `sumOfShares` додай:

        ```js
        const remainder = billMinor % people;
        shares[0] = shares[0] + remainder;
        ```

        Запусти: частки `[34, 33, 33]`, разом `100`. Тепер зміни `billMinor` на `1001`, а `people` на `4` і переконайся, що сума часток знову дорівнює рахунку.

        Тут увесь залишок дістається першій частці — це теж правило, хоч і не єдине: у наступному поясненні залишок роздають по одній копійці.
      en: |
        Give the remainder to the first share. Before the line with `sumOfShares`, add:

        ```js
        const remainder = billMinor % people;
        shares[0] = shares[0] + remainder;
        ```

        Run it: the shares are `[34, 33, 33]`, `100` in total. Now change `billMinor` to `1001` and `people` to `4`, and check that the shares add up to the bill again.

        Here the whole remainder goes to the first share — that is a rule too, though not the only one: in the next explanation the remainder is handed out one kopiyka at a time.

  - id: rules-for-money
    kind: explanation
    title:
      uk: "Ділення й відсотки — з явним правилом"
      en: "Splitting and percentages need an explicit rule"
    body:
      uk: |
        Додавання цілих завжди дає ціле. А ділення й відсотки дають дріб, і тут потрібне **правило**, записане в коді:

        - **Поділ.** `Math.floor(total / n)` дає рівну частку, а `total % n` — скільки копійок лишилося. Ці копійки роздають по одній першим часткам — це [[remainder-allocation|розподіл залишку]]. Сума часток завжди дорівнює цілому.
        - **Відсоток.** Знижка 15 % від `1999` копійок — це `1999 * 15 / 100 = 299.85`. Обери правило й застосуй його відразу: `Math.round(1999 * 15 / 100)` — `300` копійок. Магазин може вимагати й інше правило — тоді `Math.floor`. Головне — правило одне й записане.
        - **Показ.** Гривні й копійки для тексту — `Math.floor(1250 / 100)` і `1250 % 100`. Наступні уроки покажуть, як віддати це форматування `Intl`.
      en: |
        Adding whole numbers always gives a whole number. But splitting and percentages give fractions, and that is where you need a **rule**, written in the code:

        - **Splitting.** `Math.floor(total / n)` gives an equal share, and `total % n` says how many kopiykas are left. Those kopiykas go one by one to the first shares — that is [[remainder-allocation|remainder allocation]]. The shares always add up to the whole.
        - **Percentage.** A 15 % discount on `1999` kopiykas is `1999 * 15 / 100 = 299.85`. Pick a rule and apply it right away: `Math.round(1999 * 15 / 100)` is `300` kopiykas. A shop may require another rule — then `Math.floor`. What matters is one rule, written down.
        - **Display.** Hryvnias and kopiykas for text are `Math.floor(1250 / 100)` and `1250 % 100`. The coming lessons show how to hand this formatting over to `Intl`.

  - id: recall-reduce
    kind: review
    title:
      uk: "Пригадай: reduce"
      en: "Recall: reduce"
    items:
      - id: reduce-empty
        from: js-05-04-reduce
        prompt:
          uk: "Витрат ще немає. Що виведе цей код?"
          en: "There are no expenses yet. What does this code print?"
        code: |
          const expenses = [];
          const total = expenses.reduce((sum, expense) => sum + expense.amountMinor, 0);
          console.log(total);
        verify:
          logs: ["0"]
        answer:
          type: choice
          options:
            - id: zero
              code: "0"
            - id: undefined-total
              code: "undefined"
              why:
                uk: "Для порожнього масиву `reduce` повертає початкове значення — тут `0`."
                en: "For an empty array `reduce` returns the initial value — here `0`."
            - id: nan-total
              code: "NaN"
              why:
                uk: "Функція жодного разу не викликається, тож немає й `undefined + число`. Лишається початкове `0`."
                en: "The function is never called, so there is no `undefined + number` either. The initial `0` remains."
            - id: type-error
              code: "TypeError"
              why:
                uk: "`TypeError` був би без початкового значення. Тут воно є — `0`."
                en: "A `TypeError` would happen without an initial value. Here there is one — `0`."
          correct: [zero]
        explanation:
          uk: "З порожнім масивом `reduce` не викликає функцію жодного разу й повертає початкове значення `0`. Тому для сум у копійках початкове значення `0` пишуть завжди."
          en: "With an empty array `reduce` never calls the function and returns the initial value `0`. That is why sums of kopiykas always get the initial value `0`."

  - id: parse-amount
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: parse-amount
    entry: index.js
    title:
      uk: "Суму — одразу в копійки"
      en: "An amount straight into kopiykas"
    instructions:
      uk: |
        Допиши `parseAmountMinor(text)`. Людина вводить суму в гривнях: `"12,50"`, `"12.5"`, `"12"`. Функція повертає копійки — **не проходячи через дробове число** (без `parseFloat` і без множення дробу на 100):

        - `{ ok: true, value }` — `value` — ціле число копійок: `"12,50"` → `1250`, `"12,5"` → `1250`, `"0,05"` → `5`;
        - `{ ok: false, error: "required" }` — поле порожнє;
        - `{ ok: false, error: "too-many-decimals" }` — після роздільника більше двох цифр (`"1,005"`);
        - `{ ok: false, error: "not-positive" }` — сума дорівнює нулю (`"0"`, `"0,00"`);
        - `{ ok: false, error: "not-a-number" }` — усе інше (`"abc"`, `"-5"`, `"1,2,3"`, `",5"`).

        Інструменти: `text.replace(",", ".")` повертає новий текст, де першу кому замінено крапкою; `text.split(".")` розрізає текст на масив шматків у місцях крапок: `"12.50".split(".")` — `["12", "50"]`.
      en: |
        Finish `parseAmountMinor(text)`. A person types an amount in hryvnias: `"12,50"`, `"12.5"`, `"12"`. The function returns kopiykas — **without passing through a fractional number** (no `parseFloat` and no multiplying a fraction by 100):

        - `{ ok: true, value }` — `value` is a whole number of kopiykas: `"12,50"` → `1250`, `"12,5"` → `1250`, `"0,05"` → `5`;
        - `{ ok: false, error: "required" }` — the field is empty;
        - `{ ok: false, error: "too-many-decimals" }` — more than two digits after the separator (`"1,005"`);
        - `{ ok: false, error: "not-positive" }` — the amount is zero (`"0"`, `"0,00"`);
        - `{ ok: false, error: "not-a-number" }` — anything else (`"abc"`, `"-5"`, `"1,2,3"`, `",5"`).

        Tools: `text.replace(",", ".")` returns new text in which the first comma is replaced by a dot; `text.split(".")` cuts text into an array of pieces at the dots: `"12.50".split(".")` is `["12", "50"]`.
    testTitles:
      "reads a comma or a dot as the decimal separator":
        uk: "Читає кому або крапку як десятковий роздільник"
        en: "Reads a comma or a dot as the decimal separator"
      "one decimal digit means tens of kopiykas":
        uk: "Одна цифра після роздільника — це десятки копійок"
        en: "One decimal digit means tens of kopiykas"
      "whole hryvnias and small amounts are exact":
        uk: "Цілі гривні й малі суми — точні"
        en: "Whole hryvnias and small amounts are exact"
      'more than two decimal digits is "too-many-decimals"':
        uk: "Більше двох цифр після роздільника — `\"too-many-decimals\"`"
        en: "More than two decimal digits is `\"too-many-decimals\"`"
      'zero is "not-positive"':
        uk: "Нуль — `\"not-positive\"`"
        en: "Zero is `\"not-positive\"`"
      'an empty field is "required"':
        uk: "Порожнє поле — `\"required\"`"
        en: "An empty field is `\"required\"`"
      'anything else is "not-a-number"':
        uk: "Усе інше — `\"not-a-number\"`"
        en: "Anything else is `\"not-a-number\"`"
    hints:
      nudge:
        uk: "Розріж текст у місці роздільника на дві частини — гривні й копійки — і працюй із кожною як із цілим числом. Скільки копійок означає одна цифра після коми?"
        en: "Cut the text at the separator into two parts — hryvnias and kopiykas — and treat each as a whole number. How many kopiykas does one digit after the comma mean?"
      explanation:
        uk: "Час `\"7:05\"` можна перевести в хвилини без дробів: розрізати на `\"7\"` і `\"05\"`, перевірити, що обидві частини — лише цифри, і порахувати `7 * 60 + 5`. З грошима так само, тільки множник 100, а ще треба врахувати: дробової частини може не бути, у ній може бути одна цифра (тоді це десятки копійок), а більше двох — помилка. Нуль перевір наприкінці, коли копійки вже пораховано."
        en: "The time `\"7:05\"` can be turned into minutes without fractions: cut it into `\"7\"` and `\"05\"`, check that both parts are only digits and compute `7 * 60 + 5`. Money works the same way with a factor of 100, but also: the fractional part may be missing, it may have one digit (then it means tens of kopiykas), and more than two digits is an error. Check for zero at the end, once the kopiykas are counted."
    solutionNote:
      uk: "Текст розрізано на гривні й копійки, і кожна частина перетворюється на **ціле** число — дробових чисел немає взагалі. Одна цифра після коми множиться на 10. Множення `Number(\"0.29\") * 100` дало б `28.999999999999996`, і `Math.trunc` загубив би копійку; `Math.round` тут би виручив, але суворий розбір не дає похибці навіть з’явитися."
      en: "The text is cut into hryvnias and kopiykas, and each part becomes a **whole** number — there are no fractional numbers at all. A single digit after the comma is multiplied by 10. Multiplying `Number(\"0.29\") * 100` would give `28.999999999999996`, and `Math.trunc` would lose a kopiyka; `Math.round` would rescue it here, but strict parsing never lets the error appear in the first place."
    feedback:
      - when: { test: "reads a comma or a dot as the decimal separator" }
        message:
          uk: "Ця перевірка чекає `{ ok: true, value: 1250 }` для `\"12,50\"` і `\"12.50\"` та `84550` для `\" 845,50 \"`. Якщо вийшло `1200`, кома не розпізнана як роздільник (так поводиться `parseFloat`)."
          en: "This check expects `{ ok: true, value: 1250 }` for `\"12,50\"` and `\"12.50\"` and `84550` for `\" 845,50 \"`. If you got `1200`, the comma was not recognized as a separator (that is what `parseFloat` does)."
      - when: { test: "one decimal digit means tens of kopiykas" }
        message:
          uk: "Ця перевірка чекає `1250` для `\"12,5\"` і `10` для `\"0,1\"`: одна цифра після роздільника — це десятки копійок, а не одиниці."
          en: "This check expects `1250` for `\"12,5\"` and `10` for `\"0,1\"`: a single digit after the separator means tens of kopiykas, not single ones."
      - when: { test: "whole hryvnias and small amounts are exact" }
        message:
          uk: "Ця перевірка чекає `1200` для `\"12\"`, `5` для `\"0,05\"`, `29` для `\"0,29\"`, `115` для `\"1,15\"` і `435` для `\"4,35\"`. Якщо десь бракує копійки, сума пройшла через дробове число: `0.29 * 100` — це `28.999999999999996`."
          en: "This check expects `1200` for `\"12\"`, `5` for `\"0,05\"`, `29` for `\"0,29\"`, `115` for `\"1,15\"` and `435` for `\"4,35\"`. If a kopiyka is missing somewhere, the amount went through a fractional number: `0.29 * 100` is `28.999999999999996`."
      - when: { test: 'more than two decimal digits is "too-many-decimals"' }
        message:
          uk: "Ця перевірка чекає `{ ok: false, error: \"too-many-decimals\" }` для `\"1,005\"`: часток копійки не буває, тож три цифри після коми — помилка, а не заокруглення."
          en: "This check expects `{ ok: false, error: \"too-many-decimals\" }` for `\"1,005\"`: there are no fractions of a kopiyka, so three digits after the comma are an error, not something to round."
      - when: { test: 'zero is "not-positive"' }
        message:
          uk: "Ця перевірка чекає `{ ok: false, error: \"not-positive\" }` для `\"0\"` і `\"0,00\"`. Витрата мусить бути більшою за нуль."
          en: "This check expects `{ ok: false, error: \"not-positive\" }` for `\"0\"` and `\"0,00\"`. An expense must be greater than zero."
      - when: { test: 'an empty field is "required"' }
        message:
          uk: "Ця перевірка чекає `{ ok: false, error: \"required\" }` для `\"\"` і `\"  \"`. Перевір порожнє поле першим, ще до розрізання."
          en: "This check expects `{ ok: false, error: \"required\" }` for `\"\"` and `\"  \"`. Check for an empty field first, before cutting."
      - when: { test: 'anything else is "not-a-number"' }
        message:
          uk: "Ця перевірка чекає `\"not-a-number\"` для `\"abc\"`, `\"12,50 грн\"`, `\"1,2,3\"`, `\"-5\"`, `\"12px\"` і `\",5\"`. Обидві частини мають складатися лише з цифр, гривні не можуть бути порожніми, а роздільник — лише один."
          en: "This check expects `\"not-a-number\"` for `\"abc\"`, `\"12,50 грн\"`, `\"1,2,3\"`, `\"-5\"`, `\"12px\"` and `\",5\"`. Both parts must be only digits, the hryvnias cannot be empty, and there is only one separator."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` з’являється, коли метод викликано не на тому значенні (наприклад, `trim` на `undefined`, коли частини після роздільника немає), або коли програма зупинилася під час запуску й `parseAmountMinor` немає. Почни з першої помилки в консолі."
          en: "A `TypeError` appears when a method is called on the wrong kind of value (for example, `trim` on `undefined` when there is no part after the separator), or when the program stopped while starting and `parseAmountMinor` does not exist. Start with the first error in the console."

  - id: to-project
    kind: transfer
    capstoneStep: JS-12
    body:
      uk: "У трекері витрат сума вже зберігається як `amountMinor`, а в списку бажань ціна — цілими гривнями. Наприкінці розділу ти переконаєшся, що жодна сума в проєкті не проходить через `parseFloat`, а підсумки рахуються цілими."
      en: "In the expense tracker the amount is already stored as `amountMinor`, and in the wishlist the price is in whole hryvnias. At the end of this unit you will make sure that no amount in your project passes through `parseFloat` and that totals are counted in whole numbers."
