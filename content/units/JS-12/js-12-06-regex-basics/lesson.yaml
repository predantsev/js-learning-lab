id: js-12-06-regex-basics
unit: JS-12
title:
  uk: "Регулярні вирази: класи символів, якорі, квантифікатори"
  en: "Regex: classes, anchors, quantifiers"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Читати й писати шаблони з класами символів, якорями `^` і `$` та квантифікаторами й передбачати `test()` для заданих введень."
    en: "Read and write patterns with character classes, the `^` and `$` anchors and quantifiers, and predict `test()` for given inputs."
  - uk: "Пояснити, чому шаблон без якорів приймає введення, яке лише містить збіг."
    en: "Explain why a pattern without anchors accepts input that merely contains a match."
  - uk: "Розпізнати вкладений квантифікатор на зразок `(a+)+` як ризик некерованого перебору."
    en: "Point out a nested quantifier such as `(a+)+` as a backtracking risk."
prerequisites: [js-12-05-integer-minor-units, js-12-02-normalization-search]
subskills:
  - { family: J-07, skill: "regex character classes/anchors/quantifiers and backtracking risk", depth: intro }
glossary: [regular-expression, character-class, anchor, quantifier]
selfCheck: [predict-anchors, record-id]

blocks:
  - id: pattern-language
    kind: explanation
    title:
      uk: "Шаблон для тексту"
      en: "A pattern for text"
    body:
      uk: |
        У попередніх уроках ти перевіряв «лише цифри» циклом. Те саме можна записати коротко — [[regular-expression|регулярним виразом]] (regex): шаблоном між двома скісними рисками. `pattern.test(text)` відповідає `true`, якщо в тексті є збіг із шаблоном.

        | Частина | Що означає | Приклад |
        |---|---|---|
        | `w`, `-` | сам цей символ | `/w-/` |
        | `\d` | одна цифра 0–9 | `/\d/` |
        | `[a-z]` | один символ із переліку — [[character-class\|клас символів]] | `[a-z]` — мала латинська літера |
        | `{2}`, `{1,3}` | рівно 2; від 1 до 3 повторів | `\d{2}` — дві цифри |
        | `+`, `*`, `?` | 1 і більше; 0 і більше; 0 або 1 | `\d+` — одна чи більше цифр |
        | `^`, `$` | початок і кінець тексту — [[anchor\|якорі]] | `^\d+$` — лише цифри |

        `{2}`, `+`, `*`, `?` — це [[quantifier|квантифікатори]]: вони кажуть, скільки разів може повторитися те, що стоїть **перед** ними.

        Головна пастка: **без якорів** `test` шукає збіг будь-де. `/\d{2}/` знайде дві цифри і в `"12"`, і в `"abc12345"`.
      en: |
        In earlier lessons you checked “only digits” with a loop. The same can be written briefly as a [[regular-expression|regular expression]] (regex): a pattern between two slashes. `pattern.test(text)` answers `true` if the text contains a match for the pattern.

        | Part | Meaning | Example |
        |---|---|---|
        | `w`, `-` | that character itself | `/w-/` |
        | `\d` | one digit 0–9 | `/\d/` |
        | `[a-z]` | one character from a list — a [[character-class\|character class]] | `[a-z]` — a lowercase Latin letter |
        | `{2}`, `{1,3}` | exactly 2; 1 to 3 repeats | `\d{2}` — two digits |
        | `+`, `*`, `?` | 1 or more; 0 or more; 0 or 1 | `\d+` — one or more digits |
        | `^`, `$` | the start and the end of the text — [[anchor\|anchors]] | `^\d+$` — only digits |

        `{2}`, `+`, `*`, `?` are [[quantifier|quantifiers]]: they say how many times the thing **before** them may repeat.

        The main trap: **without anchors**, `test` looks for a match anywhere. `/\d{2}/` finds two digits in `"12"` and in `"abc12345"` alike.

  - id: predict-anchors
    kind: prediction
    prompt:
      uk: "Що виведуть три виклики `console.log`?"
      en: "What do the three `console.log` calls print?"
    code: |
      const loose = /\d{4}-\d{2}-\d{2}/;
      const strict = /^\d{4}-\d{2}-\d{2}$/;
      console.log(loose.test("2026-03-01"), loose.test("x2026-03-01y"), loose.test("2026-3-1"));
      console.log(strict.test("2026-03-01"), strict.test("x2026-03-01y"));
      console.log(/^\w+$/.test("Київ"));
    verify:
      logs: ["true true false", "true false", "false"]
    answer:
      type: choice
      options:
        - id: anchors-matter
          code: "true true false\ntrue false\nfalse"
        - id: loose-is-exact
          code: "true false false\ntrue false\nfalse"
          why:
            uk: "Без `^` і `$` шаблон шукає збіг **усередині** тексту. У `\"x2026-03-01y\"` дата є, тож `loose` каже `true`."
            en: "Without `^` and `$` the pattern looks for a match **inside** the text. `\"x2026-03-01y\"` contains a date, so `loose` says `true`."
        - id: short-month
          code: "true true true\ntrue false\nfalse"
          why:
            uk: "`\\d{2}` вимагає рівно дві цифри поспіль. У `\"2026-3-1\"` після дефіса лише одна, тож збігу немає."
            en: "`\\d{2}` requires exactly two digits in a row. In `\"2026-3-1\"` there is only one after the hyphen, so there is no match."
        - id: word-cyrillic
          code: "true true false\ntrue false\ntrue"
          why:
            uk: "`\\w` — це лише латинські літери, цифри й `_`. Кирилиці в ньому немає, тож `\"Київ\"` не проходить."
            en: "`\\w` is only Latin letters, digits and `_`. It contains no Cyrillic, so `\"Київ\"` does not pass."
      correct: [anchors-matter]
    explanation:
      uk: "`loose` знаходить дату всередині `\"x2026-03-01y\"` — для `test` цього досить. `strict` вимагає, щоб дата починалася на початку тексту (`^`) і закінчувалася в кінці (`$`). А `\\w` означає `[A-Za-z0-9_]` — українських літер у ньому немає."
      en: "`loose` finds the date inside `\"x2026-03-01y\"` — that is enough for `test`. `strict` requires the date to start at the start of the text (`^`) and end at its end (`$`). And `\\w` means `[A-Za-z0-9_]` — it has no Ukrainian letters."

  - id: matcher-steps
    kind: visual
    visual: code-trace
    title:
      uk: "Як шаблон проходить текст"
      en: "How a pattern walks the text"
    textEquivalent:
      uk: "Функція matchesDate робить вручну те саме, що шаблон /^\\d{4}-\\d{2}-\\d{2}$/. Масив pattern містить десять частин: «d» означає одну цифру, «-» — саме дефіс. Змінна pos — позиція в тексті, яку зараз перевіряють. Для \"2026-03-01\" кожна частина по черзі збігається з символом на позиції pos: цифра 2 на позиції 0, дефіс на позиції 4, остання цифра 1 на позиції 9. Після десятої частини pos дорівнює 10 — довжині тексту, тож функція повертає true; ця остання перевірка відповідає якорю $. Для \"2026-3-1x\" перші шість частин збігаються, але на позиції 6 шаблон чекає другу цифру місяця, а там дефіс. Функція одразу повертає false і до «x» навіть не доходить. Консоль показує: true false."
      en: "The function matchesDate does by hand what the pattern /^\\d{4}-\\d{2}-\\d{2}$/ does. The pattern array holds ten pieces: “d” means one digit, “-” means exactly a hyphen. The variable pos is the position in the text being checked. For \"2026-03-01\" every piece in turn fits the character at position pos: the digit 2 at position 0, the hyphen at position 4, the last digit 1 at position 9. After the tenth piece pos is 10 — the length of the text — so the function returns true; this last check corresponds to the $ anchor. For \"2026-3-1x\" the first six pieces fit, but at position 6 the pattern expects the second digit of the month and finds a hyphen. The function returns false right away and never even reaches the “x”. The console shows: true false."
    spec:
      file: visuals/match-date.js
      steps: captioned
      captions:
        - at: { line: 18 }
          text:
            uk: "Масив `pattern` — це шаблон дати частинами: `\"d\"` — одна цифра, `\"-\"` — саме дефіс. Перевіримо `\"2026-03-01\"`."
            en: "The `pattern` array is the date pattern in pieces: `\"d\"` means one digit, `\"-\"` means exactly a hyphen. Let us check `\"2026-03-01\"`."
        - at: { line: 10, kind: cond, hit: 1 }
          text:
            uk: "`pos` — `0`, частина `\"d\"`, символ `\"2\"` — цифра, `fits` — `true`. Якір `^` означає саме це: перевірка починається з позиції 0, а не будь-де."
            en: "`pos` is `0`, the piece is `\"d\"`, the character `\"2\"` is a digit, `fits` is `true`. The `^` anchor means exactly this: checking starts at position 0, not anywhere."
        - at: { line: 10, kind: cond, hit: 5 }
          text:
            uk: "Позиція 4: частина `\"-\"` вимагає саме дефіс, і він там є."
            en: "Position 4: the piece `\"-\"` requires exactly a hyphen, and there is one."
        - at: { line: 10, kind: cond, hit: 10 }
          text:
            uk: "Остання, десята частина: цифра `\"1\"` на позиції 9 підходить."
            en: "The last, tenth piece: the digit `\"1\"` at position 9 fits."
        - at: { line: 15, kind: return, hit: 1 }
          text:
            uk: "Частини скінчилися, `pos` — `10`, і це вся довжина тексту. Ця перевірка — якір `$`: після збігу не лишилося нічого зайвого. Результат — `true`."
            en: "The pieces are used up, `pos` is `10`, and that is the whole length of the text. This check is the `$` anchor: nothing is left over after the match. The result is `true`."
        - at: { line: 19 }
          text:
            uk: "Тепер `\"2026-3-1x\"`: місяць і день записано однією цифрою."
            en: "Now `\"2026-3-1x\"`: the month and the day are written with one digit."
        - at: { line: 10, kind: cond, hit: 16 }
          text:
            uk: "Позиція 5: перша цифра місяця `\"3\"` підходить."
            en: "Position 5: the first digit of the month, `\"3\"`, fits."
        - at: { line: 10, kind: cond, hit: 17 }
          text:
            uk: "Позиція 6: шаблон чекає другу цифру місяця, а там `\"-\"`. `fits` — `false`."
            en: "Position 6: the pattern expects the second digit of the month and finds `\"-\"`. `fits` is `false`."
        - at: { line: 11, kind: return }
          text:
            uk: "Перша ж невідповідність — і відповідь `false`. До `\"x\"` у кінці перевірка навіть не дійшла."
            en: "The first mismatch is enough: the answer is `false`. The check never even reached the `\"x\"` at the end."
        - at: { line: 20, kind: end }
          text:
            uk: "Консоль: `true false`. Справжній шаблон рухається текстом так само — частина за частиною, позиція за позицією."
            en: "The console: `true false`. A real pattern moves through the text the same way — piece by piece, position by position."

  - id: regex-cases
    kind: example
    runtime: browser-js
    dir: regex-cases
    entry: index.js
    strings:
      date: { uk: "дата", en: "date" }
      name: { uk: "назва", en: "name" }
    title:
      uk: "Якорі та літери"
      en: "Anchors and letters"
    body:
      uk: |
        Два шаблони без якорів. Запусти й подивись: `datePattern` приймає і `"x2026-03-01y"`, і навіть `"12026-03-011"`, а `namePattern` — будь-який текст, де є хоч одна латинська літера чи цифра. `"Київ"` він не приймає зовсім.
      en: |
        Two patterns without anchors. Run it and see: `datePattern` accepts `"x2026-03-01y"` and even `"12026-03-011"`, and `namePattern` accepts any text with at least one Latin letter or digit. `"Київ"` it does not accept at all.
    tryIt:
      uk: |
        1. Додай якорі: `/^\d{4}-\d{2}-\d{2}$/` і `/^\w+$/`. Запусти: тепер приймається лише точна дата, а з назв — лише `"Lamp"`.
        2. Щоб приймати літери будь-якої мови, заміни `\w` на клас `[\p{L}\p{N}]` (будь-яка літера `\p{L}` або цифра `\p{N}`) і додай після шаблону прапорець `u`: `/^[\p{L}\p{N}]+$/u`. Без `u` запис `\p{…}` не працює. Запусти: `"Київ"` проходить, а `"Лампа 2"` — ні, бо пробіл не літера й не цифра.
      en: |
        1. Add anchors: `/^\d{4}-\d{2}-\d{2}$/` and `/^\w+$/`. Run it: now only an exact date is accepted, and of the names only `"Lamp"`.
        2. To accept letters of any language, replace `\w` with the class `[\p{L}\p{N}]` (any letter `\p{L}` or digit `\p{N}`) and add the `u` flag after the pattern: `/^[\p{L}\p{N}]+$/u`. Without `u` the `\p{…}` notation does not work. Run it: `"Київ"` passes, but `"Лампа 2"` does not, because a space is neither a letter nor a digit.

  - id: risky-shapes
    kind: explanation
    title:
      uk: "Одна форма шаблону, якої варто остерігатися"
      en: "One pattern shape to beware of"
    body:
      uk: |
        Коли шаблон не збігся з першої спроби, він повертається назад і пробує інший спосіб розподілити символи між частинами шаблону. Зазвичай способів небагато.

        Але квантифікатор **всередині** групи з іншим квантифікатором — `(a+)+`, `(\d+)+`, `(\w+\s?)+` — дає безліч способів поділити той самий текст: `"aaaa"` — це `aaaa`, або `aa` + `aa`, або `a` + `aaa`… На тексті, що **майже** збігається, шаблон перебиратиме їх усі, і кожен зайвий символ приблизно подвоює роботу.

        Поки що просто запам’ятай форму: **квантифікатор у групі з квантифікатором — привід зупинитися**. Наступний урок покаже, як це заміряти й переписати.
      en: |
        When a pattern does not match on the first try, it goes back and tries another way to share the characters between the parts of the pattern. Usually there are few ways.

        But a quantifier **inside** a group with another quantifier — `(a+)+`, `(\d+)+`, `(\w+\s?)+` — gives a huge number of ways to split the same text: `"aaaa"` is `aaaa`, or `aa` + `aa`, or `a` + `aaa`… On text that **almost** matches, the pattern tries them all, and every extra character roughly doubles the work.

        For now just remember the shape: **a quantifier in a group with a quantifier is a reason to stop**. The next lesson shows how to measure it and rewrite it.

  - id: recall-boundaries
    kind: review
    title:
      uk: "Пригадай: граничні випадки"
      en: "Recall: boundary cases"
    items:
      - id: digit-boundaries
        from: js-09-03-boundary-cases
        prompt:
          uk: "Шаблон вимагає рівно дві цифри після дефіса. Які введення перевіряють саме межі цього правила? Обери всі."
          en: "A pattern requires exactly two digits after the hyphen. Which inputs test exactly the boundaries of that rule? Pick all of them."
        answer:
          type: multi
          options:
            - id: one-digit
              code: "\"w-1\""
            - id: two-digits
              code: "\"w-01\""
            - id: three-digits
              code: "\"w-001\""
            - id: no-digits
              code: "\"w-\""
            - id: middle
              code: "\"w-42\""
              why:
                uk: "`\"w-42\"` нічим не відрізняється від `\"w-01\"` для цього правила: дві цифри. Нову інформацію дають випадки на межі й одразу за нею."
                en: "For this rule `\"w-42\"` is no different from `\"w-01\"`: two digits. New information comes from the cases at the boundary and just past it."
          correct: [one-digit, two-digits, three-digits, no-digits]
        explanation:
          uk: "Межа — «рівно дві». Тож перевіряють саме дві (`\"w-01\"`), на одну менше (`\"w-1\"`), на одну більше (`\"w-001\"`) і порожній випадок (`\"w-\"`). Ще одна пара цифр усередині діапазону нічого нового не скаже."
          en: "The boundary is “exactly two”. So you test exactly two (`\"w-01\"`), one fewer (`\"w-1\"`), one more (`\"w-001\"`) and the empty case (`\"w-\"`). Another pair of digits inside the range tells you nothing new."

  - id: record-id
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: record-id
    entry: index.js
    title:
      uk: "Шаблон для id запису"
      en: "A pattern for a record id"
    instructions:
      uk: |
        Ідентифікатори записів у проєкті мають вигляд `"w-01"`, `"t-15"`, `"e-00"`. Заміни шаблон `idPattern` так, щоб `isValidId(id)` давала `true` лише для такого вигляду:

        - одна мала латинська літера `a`–`z`;
        - дефіс `-`;
        - рівно дві цифри;
        - і нічого перед цим чи після цього (навіть пробілу).

        Функцію `isValidId` не змінюй.
      en: |
        Record ids in the project look like `"w-01"`, `"t-15"`, `"e-00"`. Replace the pattern `idPattern` so that `isValidId(id)` gives `true` only for that shape:

        - one lowercase Latin letter `a`–`z`;
        - a hyphen `-`;
        - exactly two digits;
        - and nothing before or after it (not even a space).

        Do not change the function `isValidId`.
    testTitles:
      "accepts ids of the right shape":
        uk: "Приймає id правильного вигляду"
        en: "Accepts ids of the right shape"
      "rejects text before or after the id":
        uk: "Відкидає текст перед id чи після нього"
        en: "Rejects text before or after the id"
      "rejects the wrong number of digits":
        uk: "Відкидає неправильну кількість цифр"
        en: "Rejects the wrong number of digits"
      "rejects anything but one lowercase letter a–z at the start":
        uk: "Відкидає все, крім однієї малої літери a–z на початку"
        en: "Rejects anything but one lowercase letter a–z at the start"
      "rejects a missing hyphen":
        uk: "Відкидає id без дефіса"
        en: "Rejects an id without a hyphen"
    hints:
      nudge:
        uk: "Запиши правило частинами зліва направо: що стоїть першим, що другим, що третім — і як сказати «більше нічого»?"
        en: "Write the rule in pieces from left to right: what comes first, second, third — and how do you say “nothing else”?"
      explanation:
        uk: "Кожну частину правила перетвори на шматок шаблону: клас символів для літери, сам символ для дефіса, `\\d` із квантифікатором для цифр. Наприклад, номер кімнати «одна велика літера, крапка, три цифри» — це `/^[A-Z]\\.\\d{3}$/` (крапку перед нею екранують `\\`, бо сама крапка в шаблоні означає «будь-який символ»). Якорі `^` і `$` забороняють зайве на краях."
        en: "Turn each part of the rule into a piece of pattern: a character class for the letter, the character itself for the hyphen, `\\d` with a quantifier for the digits. For example, a room number “one capital letter, a dot, three digits” is `/^[A-Z]\\.\\d{3}$/` (the dot is escaped with `\\`, because a bare dot in a pattern means “any character”). The anchors `^` and `$` forbid anything extra at the edges."
    solutionNote:
      uk: "`^` і `$` — головне в цьому шаблоні: без них `\"xw-01\"` і `\"w-001\"` пройшли б, бо в них є збіг усередині. `[a-z]` бере лише малі латинські літери, а `\\w` пропустив би й велику `W`, і цифру, і `_`. `\\d{2}` і `[0-9][0-9]` означають те саме."
      en: "`^` and `$` are the heart of this pattern: without them `\"xw-01\"` and `\"w-001\"` would pass, because they contain a match inside. `[a-z]` takes only lowercase Latin letters, while `\\w` would let through a capital `W`, a digit and `_`. `\\d{2}` and `[0-9][0-9]` mean the same."
    feedback:
      - when: { test: "accepts ids of the right shape" }
        message:
          uk: "Ця перевірка чекає `true` для `\"w-01\"`, `\"t-15\"`, `\"e-00\"` і `\"h-99\"`. Переконайся, що шаблон дозволяє будь-яку малу літеру й будь-які дві цифри."
          en: "This check expects `true` for `\"w-01\"`, `\"t-15\"`, `\"e-00\"` and `\"h-99\"`. Make sure the pattern allows any lowercase letter and any two digits."
      - when: { test: "rejects text before or after the id" }
        message:
          uk: "Ця перевірка чекає `false` для `\"xw-01\"`, `\"w-01x\"` та id з пробілами на краях. Без якорів `^` і `$` шаблон знаходить збіг усередині тексту."
          en: "This check expects `false` for `\"xw-01\"`, `\"w-01x\"` and ids with spaces at the edges. Without the `^` and `$` anchors the pattern finds a match inside the text."
      - when: { test: "rejects the wrong number of digits" }
        message:
          uk: "Ця перевірка чекає `false` для `\"w-1\"`, `\"w-001\"` і `\"w-\"`. Цифр має бути рівно дві: `+` дозволяє будь-яку кількість від однієї."
          en: "This check expects `false` for `\"w-1\"`, `\"w-001\"` and `\"w-\"`. There must be exactly two digits: `+` allows any number from one up."
      - when: { test: "rejects anything but one lowercase letter a–z at the start" }
        message:
          uk: "Ця перевірка чекає `false` для `\"W-01\"`, `\"1-01\"`, `\"_-01\"`, `\"ww-01\"`, `\"ї-01\"` і `\"-01\"`. `\\w` пропускає великі літери, цифри й `_`; потрібен клас лише малих латинських літер."
          en: "This check expects `false` for `\"W-01\"`, `\"1-01\"`, `\"_-01\"`, `\"ww-01\"`, `\"ї-01\"` and `\"-01\"`. `\\w` lets through capital letters, digits and `_`; you need a class of lowercase Latin letters only."
      - when: { test: "rejects a missing hyphen" }
        message:
          uk: "Ця перевірка чекає `false` для `\"w01\"`, `\"w_01\"` і `\"w—01\"` (з довгим тире). Між літерою й цифрами має стояти саме дефіс `-`."
          en: "This check expects `false` for `\"w01\"`, `\"w_01\"` and `\"w—01\"` (with a long dash). Exactly a hyphen `-` must stand between the letter and the digits."
      - when: { error: SyntaxError }
        message:
          uk: "Код не запустився: шаблон, імовірно, записано з помилкою — наприклад, не закрито `[` чи `{`, або бракує скісної риски в кінці. Порівняй кожну дужку з парною."
          en: "The code could not start: the pattern is probably written with a mistake — for example, an unclosed `[` or `{`, or a missing slash at the end. Match every bracket with its pair."

  - id: to-project
    kind: transfer
    capstoneStep: JS-12
    body:
      uk: "У проєкті дату `'YYYY-MM-DD'` можна перевірити шаблоном. Наприкінці розділу в планувальнику, трекері звичок і трекері витрат ти напишеш `isCalendarDate` із шаблоном `/^\\d{4}-\\d{2}-\\d{2}$/`; у планувальнику твої тести мають упіймати версію без якорів `^` і `$`, яка пропускає `\"2026-03-02T10:00\"`."
      en: "In your project a `'YYYY-MM-DD'` date can be checked with a pattern. At the end of this unit, in the planner, the habit tracker and the expense tracker, you will write `isCalendarDate` with the pattern `/^\\d{4}-\\d{2}-\\d{2}$/`; in the planner your tests must catch the version without the `^` and `$` anchors, which lets `\"2026-03-02T10:00\"` through."
