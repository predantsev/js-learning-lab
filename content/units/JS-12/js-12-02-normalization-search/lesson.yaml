id: js-12-02-normalization-search
unit: JS-12
title:
  uk: "Нормалізація та пошук у тексті"
  en: "Normalization and text search"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Показати, що два однакові на вигляд тексти можуть бути нерівними, і зробити їх порівнюваними через `normalize(\"NFC\")`."
    en: "Show that two strings that look identical can be unequal, and make them comparable with `normalize(\"NFC\")`."
  - uk: "Написати пошук, який нормалізує, обрізає пробіли й переводить у нижній регістр і запит, і поле перед порівнянням."
    en: "Implement a search that normalizes, trims and lowercases both the query and the field before comparing."
prerequisites: [js-12-01-strings-unicode, js-05-02-filter-find]
subskills:
  - { family: J-07, skill: "normalization awareness", depth: intro }
glossary: [unicode-normalization, search-key]
selfCheck: [predict-equal, match-query]

blocks:
  - id: two-ways
    kind: explanation
    title:
      uk: "Одна літера — два записи"
      en: "One letter, two spellings"
    body:
      uk: |
        Літеру «й» можна записати **одним** code point (`\u0439`) або **двома**: «и» плюс окремий знак — кратку, дужечку над літерою (`\u0438\u0306`). На екрані це та сама «й». Так само «ї», «é», «ü».

        Звичайна клавіатура дає перший варіант. Другий трапляється в тексті, скопійованому з PDF, з назв файлів на macOS, з деяких сайтів.

        `===` порівнює текст code unit за code unit, тож для нього це різні тексти — і `includes` у пошуку їх теж не зіставить.

        Виправляє це [[unicode-normalization|нормалізація]]: `text.normalize("NFC")` повертає новий текст, де кожну пару «літера + знак», для якої в Unicode є готова літера, замінено цією літерою. Після `normalize("NFC")` обидва записи «й» стають однаковими.
      en: |
        The letter “é” can be written as **one** code point (`\u00e9`) or as **two**: “e” plus a separate accent mark (`e\u0301`). On screen it is the same “é”. The same goes for “ü”, “ñ” and the Ukrainian “й” and “ї”.

        A regular keyboard gives the first form. The second one turns up in text copied from a PDF, in macOS file names, on some websites.

        `===` compares text code unit by code unit, so to it these are different texts — and `includes` in a search will not match them either.

        [[unicode-normalization|Normalization]] fixes this: `text.normalize("NFC")` returns new text in which every “letter + mark” pair that has a ready-made letter in Unicode is replaced by that letter. After `normalize("NFC")` both spellings of “é” become identical.

  - id: predict-equal
    kind: prediction
    prompt:
      uk: "Обидва тексти на екрані виглядають як «Café». Що виведуть два виклики `console.log`?"
      en: "On screen both texts look like “Café”. What do the two `console.log` calls print?"
    code: |
      const typed = "Caf\u00e9";   // é as one code point
      const pasted = "Cafe\u0301"; // "e" + a combining accent
      console.log(typed === pasted, typed.length, pasted.length);
      console.log(typed.normalize("NFC") === pasted.normalize("NFC"), pasted.normalize("NFC").length);
    verify:
      logs: ["false 4 5", "true 4"]
    answer:
      type: choice
      options:
        - id: unequal-then-equal
          text:
            uk: "`false 4 5`, потім `true 4`"
            en: "`false 4 5`, then `true 4`"
        - id: looks-equal
          text:
            uk: "`true 4 4`, потім `true 4`"
            en: "`true 4 4`, then `true 4`"
          why:
            uk: "`===` не дивиться на екран: він порівнює code units. У `pasted` їх п’ять, а в `typed` — чотири, тож тексти різні."
            en: "`===` does not look at the screen: it compares code units. `pasted` has five of them and `typed` has four, so the texts differ."
        - id: normalize-in-place
          text:
            uk: "`false 4 5`, потім `true 5`"
            en: "`false 4 5`, then `true 5`"
          why:
            uk: "Після `normalize(\"NFC\")` пара «e + наголос» стає однією літерою `é`, тож у результаті 4 code units."
            en: "After `normalize(\"NFC\")` the pair “e + accent” becomes the single letter `é`, so the result has 4 code units."
        - id: never-equal
          text:
            uk: "`false 4 5`, потім `false 4`"
            en: "`false 4 5`, then `false 4`"
          why:
            uk: "Нормалізація якраз і зводить обидва записи до одного вигляду — після неї тексти рівні."
            en: "Normalization is exactly what brings both spellings to one form — after it the texts are equal."
      correct: [unequal-then-equal]
    explanation:
      uk: "До нормалізації `typed` — 4 code units, а `pasted` — 5, і `===` каже `false`, хоч на екрані вони однакові. `normalize(\"NFC\")` замінює пару «e + наголос» готовою літерою `é`, після чого обидва тексти мають 4 code units і рівні."
      en: "Before normalization `typed` is 4 code units and `pasted` is 5, and `===` says `false` although they look the same. `normalize(\"NFC\")` replaces the pair “e + accent” with the ready-made letter `é`, after which both texts have 4 code units and are equal."

  - id: find-tea
    kind: example
    runtime: browser-js
    dir: find-tea
    entry: index.js
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      teaTyped: { uk: "Чай з лимоном", en: "Café latte" }
      teaPasted: { uk: "Чай на роботу", en: "Café au lait" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      query: { uk: "чай", en: "café" }
      foundLabel: { uk: "Знайдено:", en: "Found:" }
    title:
      uk: "Пошук, який пропускає запис"
      en: "A search that misses a record"
    body:
      uk: |
        Пошук шукає «чай» серед витрат. Записів із чаєм два, але в `e-03` літеру «й» збережено як «и» + знак. Запусти й порахуй, скільки записів знайшлося.
      en: |
        The search looks for “café” among the expenses. Two records mention it, but in `e-03` the letter “é” is stored as “e” + a mark. Run it and count how many records were found.
    tryIt:
      uk: |
        Нормалізуй **обидві** сторони порівняння. Заміни умову у `filter` на

        ```js
        expense.label.normalize("NFC").toLowerCase().includes(query.normalize("NFC").toLowerCase())
        ```

        і запусти знову: тепер знайдено обидва записи. Потім прибери `normalize("NFC")` лише біля `expense.label` і переконайся, що `e-03` знову зник.
      en: |
        Normalize **both** sides of the comparison. Replace the condition in `filter` with

        ```js
        expense.label.normalize("NFC").toLowerCase().includes(query.normalize("NFC").toLowerCase())
        ```

        and run again: now both records are found. Then remove `normalize("NFC")` only next to `expense.label` and see `e-03` disappear again.

  - id: recall-filter
    kind: review
    title:
      uk: "Пригадай: filter"
      en: "Recall: filter"
    items:
      - id: filter-none
        from: js-05-02-filter-find
        prompt:
          uk: "Що виведе цей код, коли жодне бажання не дешевше за 10?"
          en: "What does this code print when no wish costs less than 10?"
        code: |
          const prices = [80, 45, 240];
          const cheap = prices.filter((price) => price < 10);
          console.log(cheap, cheap.length);
        verify:
          logs: ["[] 0"]
        answer:
          type: choice
          options:
            - id: empty-array
              code: "[] 0"
            - id: gives-undefined
              code: "undefined 0"
              why:
                uk: "`undefined` дає `find`, коли нічого не знайшов. `filter` завжди повертає масив — можливо, порожній."
                en: "`find` gives `undefined` when it finds nothing. `filter` always returns an array — possibly an empty one."
            - id: gives-null
              code: "null 0"
              why:
                uk: "`filter` не повертає `null`: результат — завжди новий масив."
                en: "`filter` never returns `null`: the result is always a new array."
          correct: [empty-array]
        explanation:
          uk: "`filter` повертає новий масив із тими елементами, для яких функція дала `true`. Якщо таких немає, це порожній масив `[]` довжини 0."
          en: "`filter` returns a new array with the elements for which the function gave `true`. If there are none, it is an empty array `[]` of length 0."

  - id: search-key
    kind: explanation
    title:
      uk: "Ключ для пошуку"
      en: "A search key"
    body:
      uk: |
        Люди вводять запит як завгодно: «Лампа», «лампа », «ЛАМПА». Щоб пошук не залежав від цього, з тексту роблять [[search-key|ключ для пошуку]] — окрему форму, яку використовують **лише для порівняння**:

        1. `normalize("NFC")` — один запис для кожної літери;
        2. `trim()` — без пробілів на краях;
        3. `toLowerCase()` — усі літери малі.

        Головне правило: однакову обробку отримують **обидві сторони** — і запит, і поле запису. Якщо нормалізувати лише одну, збіги знову губляться.

        `toLowerCase()` сам по собі не допоможе: регістр він вирівнює, але «й» з двох code points так і лишиться двома, а зайвий пробіл у запиті — пробілом.

        А сам запис ключ не змінює: людина й далі бачить назву так, як її ввели.
      en: |
        People type a query in any way: “Lamp”, “lamp ”, “LAMP”. To make the search independent of that, text is turned into a [[search-key|search key]] — a separate form used **only for comparing**:

        1. `normalize("NFC")` — one spelling for every letter;
        2. `trim()` — no spaces at the edges;
        3. `toLowerCase()` — all letters small.

        The main rule: **both sides** get the same treatment — the query and the record’s field. If only one side is normalized, matches get lost again.

        `toLowerCase()` alone does not help: it evens out the case, but an “é” made of two code points stays two, and an extra space in the query stays a space.

        And the key does not change the record itself: the person still sees the name the way it was typed.

  - id: predict-lower
    kind: prediction
    strings:
      name: { uk: "Настільна лампа", en: "Desk lamp" }
      query: { uk: "Лампа ", en: "Lamp " }
    prompt:
      uk: "Людина ввела запит із пробілом у кінці. Що виведуть два виклики `console.log`?"
      en: "A person typed the query with a space at the end. What do the two `console.log` calls print?"
    code: |
      const name = "%%name%%";
      const query = "%%query%%";
      console.log(name.toLowerCase().includes(query.toLowerCase()));
      console.log(name.toLowerCase().includes(query.trim().toLowerCase()));
    verify:
      logs: ["false", "true"]
    answer:
      type: choice
      options:
        - id: false-true
          code: "false\ntrue"
        - id: true-true
          code: "true\ntrue"
          why:
            uk: "`toLowerCase()` змінює лише регістр. Пробіл у кінці запиту лишається, а в назві після слова пробілу немає — тож збігу нема."
            en: "`toLowerCase()` changes only the case. The space at the end of the query stays, and the name has no space after that word — so there is no match."
        - id: false-false
          code: "false\nfalse"
          why:
            uk: "Після `trim()` запит без пробілу, а `toLowerCase()` вирівнює регістр, тож другий рядок коду знаходить слово."
            en: "After `trim()` the query has no space, and `toLowerCase()` evens out the case, so the second line finds the word."
      correct: [false-true]
    explanation:
      uk: "У першому рядку шукається текст із пробілом у кінці, а в назві після цього слова пробілу немає: `false`. У другому `trim()` прибирає пробіл, і збіг знаходиться: `true`. Регістр — лише одна з відмінностей, які треба вирівняти."
      en: "The first line searches for text with a space at the end, and the name has no space after that word: `false`. In the second, `trim()` removes the space, and the match is found: `true`. Letter case is only one of the differences to even out."

  - id: match-query
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: match-query
    entry: index.js
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      lampQuery: { uk: " Лампа", en: " Lamp" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      nothing: { uk: "біг", en: "run" }
    title:
      uk: "Пошук, що не залежить від способу введення"
      en: "A search that does not care how text was typed"
    instructions:
      uk: |
        Перепиши `matchesQuery(text, query)`. Вона повертає `true`, якщо запит трапляється всередині тексту, і `false`, якщо ні. Збіг має знаходитися незалежно від:

        - регістру літер;
        - пробілів на краях запиту;
        - того, як записано літери на зразок «й» чи «é»: одним code point чи двома (у тексті **або** в запиті).
      en: |
        Rewrite `matchesQuery(text, query)`. It returns `true` if the query occurs inside the text and `false` if not. A match must be found regardless of:

        - letter case;
        - spaces at the edges of the query;
        - how letters such as “é” or “й” are written: as one code point or two (in the text **or** in the query).
    testTitles:
      "ignores letter case":
        uk: "Не зважає на регістр літер"
        en: "Ignores letter case"
      "ignores spaces around the query":
        uk: "Не зважає на пробіли на краях запиту"
        en: "Ignores spaces around the query"
      "finds a decomposed letter in the text":
        uk: "Знаходить літеру з двох code points у тексті"
        en: "Finds a decomposed letter in the text"
      "finds text when the query is the decomposed one":
        uk: "Знаходить текст, коли літера з двох code points — у запиті"
        en: "Finds the text when the decomposed letter is in the query"
      "says false when the query is not there":
        uk: "Повертає `false`, коли запиту в тексті немає"
        en: "Says `false` when the query is not in the text"
    hints:
      nudge:
        uk: "Перелічи, чим можуть відрізнятися запит і текст, і для кожної відмінності знайди метод, який її прибирає. Скільки сторін порівняння треба обробити?"
        en: "List the ways the query and the text can differ, and for each difference find the method that removes it. How many sides of the comparison need that treatment?"
      explanation:
        uk: "Зроби маленьку функцію, яка перетворює будь-який текст на ключ для пошуку, і пропусти через неї **і текст, і запит**. Наприклад, `const shout = (value) => value.toUpperCase();` зробила б ключ із великих літер — тобі потрібен інший ланцюжок: нормалізація, обрізання пробілів і нижній регістр."
        en: "Write a small function that turns any text into a search key, and pass **both the text and the query** through it. For example, `const shout = (value) => value.toUpperCase();` would make a key of capital letters — you need a different chain: normalization, trimming and lower case."
    solutionNote:
      uk: "Одна функція `toSearchKey` робить ключ, і обидві сторони проходять через неї — тому жодна відмінність не «вислизає» з одного боку. `NFD` на обох сторонах теж працює: головне, щоб форма була однакова. Записи в даних лишаються такими, як їх ввели: ключ живе лише в порівнянні."
      en: "One function `toSearchKey` makes the key, and both sides go through it — so no difference slips through on one side. `NFD` on both sides works too: what matters is that the form is the same. The records in the data stay as they were typed: the key lives only in the comparison."
    feedback:
      - when: { test: "ignores letter case" }
        message:
          uk: "Ця перевірка шукає «лампа» в «Настільна Лампа» і «LAMP» у «Desk lamp» та чекає `true`. Регістр треба вирівняти і в тексті, і в запиті."
          en: "This check looks for “лампа” in “Настільна Лампа” and “LAMP” in “Desk lamp” and expects `true`. The case must be evened out in both the text and the query."
      - when: { test: "ignores spaces around the query" }
        message:
          uk: "Ця перевірка шукає `\"  лампа \"` у «Настільна лампа» і чекає `true`. Пробіли на краях запиту треба прибрати."
          en: "This check looks for `\"  лампа \"` in “Настільна лампа” and expects `true`. Spaces at the edges of the query must be removed."
      - when: { test: "finds a decomposed letter in the text" }
        message:
          uk: "Ця перевірка дає текст, де «й» записано як «и» + знак (і «é» як «e» + наголос), і чекає `true` для запиту `\"чай\"` (`\"café\"`). Текст треба нормалізувати."
          en: "This check passes text in which “й” is written as “и” + a mark (and “é” as “e” + an accent) and expects `true` for the query `\"чай\"` (`\"café\"`). The text must be normalized."
      - when: { test: "finds text when the query is the decomposed one" }
        message:
          uk: "Ця перевірка дає звичайний текст і запит, де літеру записано двома code points, і чекає `true`. Нормалізувати треба й запит, а не лише текст."
          en: "This check passes ordinary text and a query whose letter is written as two code points, and expects `true`. The query must be normalized too, not only the text."
      - when: { test: "says false when the query is not there" }
        message:
          uk: "Ця перевірка шукає слово, якого в тексті немає, і чекає саме `false` (не `undefined` і не порожній масив)."
          en: "This check looks for a word that is not in the text and expects exactly `false` (not `undefined` and not an empty array)."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` з’являється, коли метод викликано не на тексті (наприклад, на результаті `includes`, який уже `true` чи `false`), або коли програма зупинилася під час запуску й `matchesQuery` немає. Перевір порядок викликів у ланцюжку."
          en: "A `TypeError` appears when a method is called on something that is not text (for example, on the result of `includes`, which is already `true` or `false`), or when the program stopped while starting and `matchesQuery` does not exist. Check the order of the calls in the chain."

  - id: to-project
    kind: transfer
    capstoneStep: JS-12
    body:
      uk: "У проєкті пошук за назвою ти вже маєш. Наприкінці розділу ти зробиш для нього `searchKey` — `normalize(\"NFC\")`, без пробілів на краях, малими літерами, — щоб «лампа» знаходила «Лампа», а назва в іншій формі Unicode не губилася."
      en: "Your project already has a search by name. At the end of this unit you will give it a `searchKey` — `normalize(\"NFC\")`, no spaces at the edges, lower case — so that “lamp” finds “Lamp” and a name in another Unicode form does not get lost."
