id: js-12-03-numbers-precision
unit: JS-12
title:
  uk: "Числа: точність, NaN та Infinity"
  en: "Numbers: precision, NaN, Infinity"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Пояснити, чому `0.1 + 0.2 !== 0.3`, і порівнювати дроби з допуском лише там, де наближення прийнятне."
    en: "Explain why `0.1 + 0.2 !== 0.3` and compare decimals with a tolerance only where an approximation is acceptable."
  - uk: "Розпізнавати `NaN` через `Number.isNaN`, `Infinity` від ділення на нуль і називати межу безпечних цілих чисел."
    en: "Detect `NaN` with `Number.isNaN`, recognize `Infinity` from division by zero and state the safe-integer limit."
prerequisites: [js-12-02-normalization-search, js-01-03-arithmetic-precedence]
subskills:
  - { family: J-07, skill: "numeric precision/NaN/Infinity", depth: intro }
glossary: [floating-point, nan, infinity, safe-integer]
selfCheck: [predict-sum, predict-nan, usable-number]

blocks:
  - id: binary-fractions
    kind: explanation
    title:
      uk: "Чому 0.1 + 0.2 — не зовсім 0.3"
      en: "Why 0.1 + 0.2 is not quite 0.3"
    body:
      uk: |
        Спробуй записати 1/3 десятковим дробом: `0.333…` — трійки не закінчуються, і десь доведеться зупинитися. Комп’ютер зберігає числа у **двійковому** вигляді, і для нього так само «не закінчуються» `0.1`, `0.2` і `0.3`.

        Тому JavaScript зберігає не саме `0.1`, а найближче число, яке вміщається у 64 біти. Такий формат називають [[floating-point|числом з рухомою комою]] (floating point). Похибка крихітна, але при додаванні вона може стати помітною:

        ```js
        0.1 + 0.2; // 0.30000000000000004
        ```

        Це не помилка JavaScript: так само рахують Python, Java і C#, бо всі вони користуються тим самим стандартом IEEE 754.

        Цілі числа зберігаються точно — але лише до [[safe-integer|межі безпечних цілих]] `Number.MAX_SAFE_INTEGER` (9 007 199 254 740 991). Далі сусідні цілі вже не розрізнити.
      en: |
        Try writing 1/3 as a decimal: `0.333…` — the threes never end, and you have to stop somewhere. A computer stores numbers in **binary**, and for it `0.1`, `0.2` and `0.3` “never end” in the same way.

        So JavaScript stores not `0.1` itself but the nearest number that fits into 64 bits. This format is called [[floating-point|floating point]]. The error is tiny, but addition can make it visible:

        ```js
        0.1 + 0.2; // 0.30000000000000004
        ```

        This is not a JavaScript bug: Python, Java and C# do the same, because they all use the same standard, IEEE 754.

        Whole numbers are stored exactly — but only up to the [[safe-integer|safe-integer limit]] `Number.MAX_SAFE_INTEGER` (9,007,199,254,740,991). Beyond it, neighbouring whole numbers can no longer be told apart.

  - id: predict-sum
    kind: prediction
    prompt:
      uk: "Що виведе цей рядок коду?"
      en: "What does this line print?"
    code: |
      console.log(0.1 + 0.2, 0.1 + 0.2 === 0.3);
    verify:
      logs: ["0.30000000000000004 false"]
    answer:
      type: choice
      options:
        - id: tiny-error
          code: "0.30000000000000004 false"
        - id: exact
          code: "0.3 true"
          why:
            uk: "`0.1` і `0.2` зберігаються трохи неточно, і їхня сума потрапляє не в те саме число, що й записане `0.3`."
            en: "`0.1` and `0.2` are stored slightly off, and their sum lands on a different number than the written `0.3`."
        - id: shown-rounded
          code: "0.3 false"
          why:
            uk: "`console.log` не заокруглює: він показує найкоротший запис, що точно відповідає збереженому числу. Для суми це `0.30000000000000004`."
            en: "`console.log` does not round: it shows the shortest form that exactly matches the stored number. For the sum that is `0.30000000000000004`."
        - id: engine-bug
          code: "Error: imprecise result"
          why:
            uk: "Неточність — не помилка й не виняток. JavaScript рахує за стандартом IEEE 754 і нічого не повідомляє."
            en: "Imprecision is neither a bug nor an exception. JavaScript calculates by the IEEE 754 standard and reports nothing."
      correct: [tiny-error]
    explanation:
      uk: "Збережені `0.1` і `0.2` трохи більші за справжні. Їхня точна сума лежить рівно посередині між двома числами, які можна зберегти, і за правилами IEEE 754 заокруглюється до верхнього — `0.30000000000000004`, а записане `0.3` зберігається як трохи **менше** число. Тому `===` порівнює два різні числа й каже `false`."
      en: "The stored `0.1` and `0.2` are slightly larger than the real values. Their exact sum lies exactly halfway between two storable numbers, and by the IEEE 754 rules it is rounded to the upper one — `0.30000000000000004`, while the written `0.3` is stored as a slightly **smaller** number. So `===` compares two different numbers and says `false`."

  - id: number-line
    kind: visual
    visual: diagram
    title:
      uk: "Числова пряма біля 0.3"
      en: "The number line near 0.3"
    textEquivalent:
      uk: "Записане 0.1 зберігається як 0.100000000000000005551, а 0.2 — як 0.200000000000000011102: обидва трохи більші за справжні. Їхня точна сума — 0.300000000000000016653, але такого числа серед збережуваних немає. Поблизу є лише два сусіди: 0.299999999999999988898 — саме так зберігається записане 0.3 — і наступне за ним 0.300000000000000044409. Точна сума лежить посередині між ними, і за правилами IEEE 754 вона заокруглюється до верхнього сусіда. Тому 0.1 + 0.2 дає 0.30000000000000004, на один крок далі за число, яким зберігається 0.3, і порівняння === дає false."
      en: "The written 0.1 is stored as 0.100000000000000005551 and 0.2 as 0.200000000000000011102: both slightly larger than the real values. Their exact sum is 0.300000000000000016653, but no stored number has that value. Nearby there are only two neighbours: 0.299999999999999988898 — exactly how the written 0.3 is stored — and the next one after it, 0.300000000000000044409. The exact sum lies halfway between them, and by the IEEE 754 rules it is rounded to the upper neighbour. That is why 0.1 + 0.2 gives 0.30000000000000004, one step past the number that stores 0.3, and === gives false."
    spec:
      layout: grid
      nodes:
        - { id: one, col: 0, row: 0, w: 400, label: { uk: "0.1 → зберігається як 0.100000000000000005551", en: "0.1 → stored as 0.100000000000000005551" } }
        - { id: two, col: 0, row: 1, w: 400, label: { uk: "0.2 → зберігається як 0.200000000000000011102", en: "0.2 → stored as 0.200000000000000011102" } }
        - { id: upper, col: 0, row: 2, w: 400, shape: round, label: { uk: "0.300000000000000044409 = результат 0.1 + 0.2", en: "0.300000000000000044409 = result of 0.1 + 0.2" } }
        - { id: exact, col: 0, row: 3, w: 400, shape: note, label: { uk: "точна сума 0.300000000000000016653 — не зберігається", en: "exact sum 0.300000000000000016653 — not storable" } }
        - { id: lower, col: 0, row: 4, w: 400, shape: round, label: { uk: "0.299999999999999988898 = так зберігається 0.3", en: "0.299999999999999988898 = how 0.3 is stored" } }
      edges:
        - { id: round-up, from: exact, to: upper, label: { uk: "заокруглення вгору", en: "rounded up" } }
        - { id: gap, from: lower, to: exact, kind: dashed, label: { uk: "пів кроку: рівно посередині", en: "half a step: exactly halfway" } }
      hidden: [upper, exact, lower, round-up, gap]
      steps:
        - caption:
            uk: "`0.1` і `0.2` не мають точного двійкового запису, тож зберігаються найближчі числа — обидва трохи **більші** за справжні."
            en: "`0.1` and `0.2` have no exact binary form, so the nearest numbers are stored — both slightly **larger** than the real values."
          highlight: [one, two]
        - caption:
            uk: "Їхня точна сума — `0.300000000000000016653`. Але й такого числа серед збережуваних немає."
            en: "Their exact sum is `0.300000000000000016653`. But no stored number has that value either."
          show: [exact]
          highlight: [exact]
        - caption:
            uk: "Поруч є лише два сусіди. Нижній — це записане `0.3`, верхній — наступне число за ним, на один крок далі. Точна сума лежить рівно посередині, за пів кроку від кожного."
            en: "Nearby there are only two neighbours. The lower one is the written `0.3`; the upper one is the next number after it, one step further. The exact sum lies exactly halfway, half a step from each."
          show: [upper, lower, gap]
          highlight: [upper, lower, gap]
        - caption:
            uk: "Сума заокруглюється до верхнього сусіда: `0.1 + 0.2` — це `0.30000000000000004`, а не те число, яким зберігається `0.3`. Звідси `false`."
            en: "The sum is rounded to the upper neighbour: `0.1 + 0.2` is `0.30000000000000004`, not the number that stores `0.3`. Hence `false`."
          show: [round-up]
          highlight: [round-up, upper]

  - id: nan-infinity
    kind: explanation
    title:
      uk: "NaN та Infinity"
      en: "NaN and Infinity"
    body:
      uk: |
        Ділення на нуль у JavaScript не зупиняє програму:

        - `1 / 0` — це [[infinity|`Infinity`]], `-1 / 0` — `-Infinity`. Вони більші (менші) за будь-яке число.
        - `0 / 0`, `Number("abc")`, `Math.sqrt(-1)` дають [[nan|`NaN`]] — «не число». Попри назву, `typeof NaN` — `"number"`.

        `NaN` «заразний»: `NaN + 1` — теж `NaN`, і одна погана цифра псує всю суму. А ще `NaN` **не дорівнює нічому, навіть собі**: `NaN === NaN` — `false`. Тому перевірка `x === NaN` завжди дає `false`.

        Для `NaN` є окрема перевірка — `Number.isNaN(x)`. Стара глобальна `isNaN(x)` спершу перетворює значення на число, тож `isNaN("abc")` дає `true`, хоч `"abc"` — текст, а не `NaN`. Користуйся `Number.isNaN`.
      en: |
        Division by zero does not stop a JavaScript program:

        - `1 / 0` is [[infinity|`Infinity`]], `-1 / 0` is `-Infinity`. They are larger (smaller) than any number.
        - `0 / 0`, `Number("abc")`, `Math.sqrt(-1)` give [[nan|`NaN`]] — “not a number”. Despite the name, `typeof NaN` is `"number"`.

        `NaN` is “contagious”: `NaN + 1` is also `NaN`, and one bad value spoils the whole total. And `NaN` **is equal to nothing, not even itself**: `NaN === NaN` is `false`. So the check `x === NaN` always gives `false`.

        `NaN` has a check of its own — `Number.isNaN(x)`. The old global `isNaN(x)` first converts the value to a number, so `isNaN("abc")` gives `true`, although `"abc"` is text, not `NaN`. Use `Number.isNaN`.

  - id: predict-nan
    kind: prediction
    prompt:
      uk: "Що виведе цей код?"
      en: "What does this code print?"
    code: |
      const ratio = 0 / 0;
      console.log(1 / 0, ratio);
      console.log(ratio === NaN, Number.isNaN(ratio));
    verify:
      logs: ["Infinity NaN", "false true"]
    answer:
      type: choice
      options:
        - id: inf-nan
          code: "Infinity NaN\nfalse true"
        - id: nan-equals
          code: "Infinity NaN\ntrue true"
          why:
            uk: "`NaN` не дорівнює нічому, навіть самому собі. `ratio === NaN` дає `false` завжди, тому для перевірки є `Number.isNaN`."
            en: "`NaN` is not equal to anything, not even itself. `ratio === NaN` always gives `false`; that is why `Number.isNaN` exists."
        - id: throws
          code: "Error: division by zero"
          why:
            uk: "У JavaScript ділення на нуль не кидає помилку: `1 / 0` — це `Infinity`, а `0 / 0` — `NaN`."
            en: "In JavaScript division by zero does not throw: `1 / 0` is `Infinity` and `0 / 0` is `NaN`."
        - id: zeros
          code: "0 0\ntrue false"
          why:
            uk: "Результат ділення на нуль — не нуль. Число, поділене на нуль, — `Infinity`, а `0 / 0` не має сенсу й дає `NaN`."
            en: "Dividing by zero does not give zero. A number divided by zero is `Infinity`, and `0 / 0` has no meaning and gives `NaN`."
      correct: [inf-nan]
    explanation:
      uk: "`1 / 0` — `Infinity`, `0 / 0` — `NaN`, і програма спокійно йде далі. `ratio === NaN` — `false`, бо `NaN` не дорівнює навіть собі; правильну відповідь дає лише `Number.isNaN(ratio)`."
      en: "`1 / 0` is `Infinity`, `0 / 0` is `NaN`, and the program calmly carries on. `ratio === NaN` is `false`, because `NaN` is not equal even to itself; only `Number.isNaN(ratio)` gives the right answer."

  - id: number-table
    kind: example
    runtime: browser-js
    dir: number-table
    entry: index.js
    strings:
      near: { uk: "Майже рівні (допуск EPSILON):", en: "Nearly equal (EPSILON tolerance):" }
    title:
      uk: "Таблиця сюрпризів і порівняння з допуском"
      en: "A table of surprises and a comparison with tolerance"
    body:
      uk: |
        Запусти й звір таблицю зі своїми прогнозами. Останній рядок `MAX_SAFE_INTEGER + 2` дає парне число, на одиницю менше, ніж мало б бути: за межею безпечних цілих сусідні числа зливаються.

        Наприкінці — порівняння **з допуском**: два числа вважаються рівними, якщо різниця між ними менша за допуск. `Math.abs(x)` повертає число без знака, тож різниця завжди додатна. `Number.EPSILON` — найменша різниця між `1` і наступним числом, яке можна зберегти (близько `2.2e-16`, тобто 0.00000000000000022).
      en: |
        Run it and compare the table with your predictions. The line `MAX_SAFE_INTEGER + 2` gives an even number, one less than it should be: past the safe-integer limit, neighbouring numbers merge.

        At the end comes a comparison **with a tolerance**: two numbers count as equal if the difference between them is smaller than the tolerance. `Math.abs(x)` returns the number without its sign, so the difference is always positive. `Number.EPSILON` is the smallest difference between `1` and the next storable number (about `2.2e-16`, that is 0.00000000000000022).
    tryIt:
      uk: |
        1. Заміни `0.1 + 0.2, 0.3` на `1000.1 + 1000.2, 2000.3` і запусти: `false`. `EPSILON` — допуск для чисел біля `1`; для більших чисел похибка більша, і допуск треба підбирати під масштаб.
        2. Тепер передай `0.3, 0.305, 0.01`: `true`. Допуск у одну соту «проковтнув» справжню різницю в пів соти. Для грошей така «майже рівність» — це загублені копійки; наступні уроки покажуть, як рахувати їх точно.
      en: |
        1. Replace `0.1 + 0.2, 0.3` with `1000.1 + 1000.2, 2000.3` and run: `false`. `EPSILON` is a tolerance for numbers near `1`; larger numbers have larger errors, and the tolerance has to fit their scale.
        2. Now pass `0.3, 0.305, 0.01`: `true`. A tolerance of one hundredth “swallowed” a real difference of half a hundredth. For money such “near equality” means lost kopiykas; the next lessons show how to count them exactly.

  - id: recall-validation
    kind: review
    title:
      uk: "Пригадай: валідація суми"
      en: "Recall: validating an amount"
    items:
      - id: typeof-nan
        from: js-02-11-independent-validation
        prompt:
          uk: "У перевірці суми з розділу JS-02 стоїть умова `typeof amount !== \"number\" || Number.isNaN(amount)`. Навіщо там друга частина?"
          en: "The amount check from unit JS-02 has the condition `typeof amount !== \"number\" || Number.isNaN(amount)`. Why is the second part there?"
        answer:
          type: choice
          options:
            - id: typeof-number
              text:
                uk: "`typeof NaN` — це `\"number\"`, тож перша частина пропустила б `NaN`"
                en: "`typeof NaN` is `\"number\"`, so the first part alone would let `NaN` through"
            - id: strings
              text:
                uk: "Щоб відсіяти текст на зразок `\"21050\"`"
                en: "To filter out text such as `\"21050\"`"
              why:
                uk: "Текст уже відсіює перша частина: `typeof \"21050\"` — `\"string\"`."
                en: "The first part already filters out text: `typeof \"21050\"` is `\"string\"`."
            - id: redundant
              text:
                uk: "Вона нічого не змінює, це просто для певності"
                en: "It changes nothing, it is just to be safe"
              why:
                uk: "Без неї `NaN` пройшов би як число і зіпсував би суму."
                en: "Without it `NaN` would pass as a number and spoil the total."
          correct: [typeof-number]
        explanation:
          uk: "`NaN` має тип `\"number\"`, тому перевірка типу його не ловить. Його розпізнає лише `Number.isNaN` — порівняння `=== NaN` тут не допоможе."
          en: "`NaN` is of type `\"number\"`, so the type check does not catch it. Only `Number.isNaN` recognizes it — a comparison `=== NaN` would not help."

  - id: usable-number
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: usable-number
    entry: index.js
    title:
      uk: "Число, з яким можна рахувати"
      en: "A number you can calculate with"
    instructions:
      uk: |
        Перш ніж додавати ціну до суми, треба переконатися, що це справжнє число. Допиши `isUsableNumber(x)`: вона повертає `true` лише тоді, коли `x`

        - має тип `"number"`,
        - не `NaN`,
        - не `Infinity` і не `-Infinity`.

        Для всього іншого — тексту `"45"`, `null`, `undefined`, `true`, [[bigint|BigInt]] `45n` — `false`.
      en: |
        Before adding a price to a total, you have to be sure it is a real number. Finish `isUsableNumber(x)`: it returns `true` only when `x`

        - is of type `"number"`,
        - is not `NaN`,
        - is neither `Infinity` nor `-Infinity`.

        For everything else — the text `"45"`, `null`, `undefined`, `true`, the [[bigint|BigInt]] `45n` — `false`.
    testTitles:
      "accepts ordinary numbers":
        uk: "Приймає звичайні числа"
        en: "Accepts ordinary numbers"
      "rejects NaN":
        uk: "Відкидає `NaN`"
        en: "Rejects `NaN`"
      "rejects Infinity and -Infinity":
        uk: "Відкидає `Infinity` і `-Infinity`"
        en: "Rejects `Infinity` and `-Infinity`"
      "rejects values that are not numbers":
        uk: "Відкидає значення, які не є числами"
        en: "Rejects values that are not numbers"
    hints:
      nudge:
        uk: "Подивись, що з трьох умов уже перевіряє стартовий код, і чого бракує. Чому `x === NaN` тут не підходить?"
        en: "Look at which of the three conditions the starting code already checks and what is missing. Why does `x === NaN` not work here?"
      explanation:
        uk: "Поєднай кілька умов через `&&`: значення придатне, лише коли виконуються всі. Для `NaN` потрібна `Number.isNaN`, а не `===` і не глобальна `isNaN` (вона перетворює `\"45\"` на число). `Infinity` — звичайне значення, з яким можна порівнювати через `!==`, як `x !== 0` перевіряє нуль."
        en: "Combine several conditions with `&&`: a value is usable only when all of them hold. `NaN` needs `Number.isNaN`, not `===` and not the global `isNaN` (it converts `\"45\"` into a number). `Infinity` is an ordinary value you can compare with `!==`, just as `x !== 0` checks for zero."
    solutionNote:
      uk: "Три умови через `&&`: тип `number`, не `NaN` (через `Number.isNaN`), не нескінченність. Вбудована `Number.isFinite(x)` робить усе це одним викликом і, на відміну від глобальної `isFinite`, не перетворює текст і `null` на числа (`isFinite(null)` — `true`!)."
      en: "Three conditions joined with `&&`: of type `number`, not `NaN` (through `Number.isNaN`), not infinite. The built-in `Number.isFinite(x)` does all of this in one call and, unlike the global `isFinite`, does not convert text and `null` into numbers (`isFinite(null)` is `true`!)."
    feedback:
      - when: { test: "accepts ordinary numbers" }
        message:
          uk: "Ця перевірка чекає `true` для `45`, `0`, `-3.5`, `0.1 + 0.2` і `Number.MAX_SAFE_INTEGER`. Нуль і від’ємні числа — теж придатні числа."
          en: "This check expects `true` for `45`, `0`, `-3.5`, `0.1 + 0.2` and `Number.MAX_SAFE_INTEGER`. Zero and negative numbers are usable numbers too."
      - when: { test: "rejects NaN" }
        message:
          uk: "Ця перевірка чекає `false` для `NaN`. `typeof NaN` — `\"number\"`, а `x !== NaN` завжди `true`, тож `NaN` розпізнає лише `Number.isNaN(x)`."
          en: "This check expects `false` for `NaN`. `typeof NaN` is `\"number\"`, and `x !== NaN` is always `true`, so only `Number.isNaN(x)` recognizes `NaN`."
      - when: { test: "rejects Infinity and -Infinity" }
        message:
          uk: "Ця перевірка чекає `false` для `1 / 0` і `-1 / 0`. Обидві нескінченності треба відкинути — і з плюсом, і з мінусом."
          en: "This check expects `false` for `1 / 0` and `-1 / 0`. Both infinities must be rejected — the positive and the negative one."
      - when: { test: "rejects values that are not numbers" }
        message:
          uk: "Ця перевірка чекає `false` для `\"45\"`, `\"\"`, `null`, `undefined`, `true` і `45n`. Глобальна `isNaN` перетворює текст і `null` на числа (а на `45n` падає з `TypeError`) — перевіряй тип через `typeof`."
          en: "This check expects `false` for `\"45\"`, `\"\"`, `null`, `undefined`, `true` and `45n`. The global `isNaN` converts text and `null` into numbers (and fails with a `TypeError` on `45n`) — check the type with `typeof`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-12
    body:
      uk: "У проєкті числа приходять із форми. Наприкінці розділу ти переконаєшся, що жодне `NaN` чи `Infinity` не потрапляє в збережені записи й підсумки."
      en: "In your project numbers come from a form. At the end of this unit you will make sure that no `NaN` or `Infinity` gets into stored records and totals."
