id: js-12-07-regex-groups-flags-limits
unit: JS-12
title:
  uk: "Регулярні вирази: групи, прапорці, екранування й обмеження введення"
  en: "Regex: groups, flags, escaping and input limits"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Діставати частини збігу через групи захоплення та іменовані групи й свідомо вживати прапорці `g`, `i` і `u`."
    en: "Extract parts of a match with capture and named groups, and use the `g`, `i` and `u` flags on purpose."
  - uk: "Екранувати текст користувача перед побудовою шаблону з нього й обмежувати довжину введення перед пошуком."
    en: "Escape user text before building a pattern from it and cap the input length before matching."
  - uk: "Переписати шаблон із вкладеними квантифікаторами так, щоб на майже відповідному введенні кількість кроків більше не вибухала."
    en: "Rewrite a pattern with nested quantifiers so its matching steps no longer explode on an almost-matching input."
prerequisites: [js-12-06-regex-basics]
subskills:
  - { family: J-07, skill: "regex groups/flags/escaping and input limits", depth: intro }
  - { family: J-07, skill: "regex character classes/anchors/quantifiers and backtracking risk", depth: practice }
glossary: [capture-group, regex-flag, regex-escaping, catastrophic-backtracking]
selfCheck: [predict-groups, find-all]

blocks:
  - id: groups-and-flags
    kind: explanation
    title:
      uk: "Групи дістають частини, прапорці змінюють правила"
      en: "Groups extract parts, flags change the rules"
    body:
      uk: |
        Дужки в шаблоні — це [[capture-group|група захоплення]]: вона запам’ятовує, яка частина тексту їй відповіла. `pattern.exec(text)` повертає збіг: `[0]` — увесь збіг, `[1]`, `[2]`… — групи по черзі, `index` — де збіг почався. Групі можна дати назву: `(?<year>\d{4})`, тоді вона доступна як `match.groups.year`. Якщо збігу немає, `exec` повертає `null`.

        Після шаблону пишуть [[regex-flag|прапорці]]:

        - `i` — не зважати на регістр: `/лампа/i` знаходить «ЛАМПА»;
        - `u` — працювати з code points і дозволити `\p{L}`;
        - `g` — шукати **всі** збіги: `text.matchAll(/…/g)` перебирає їх у циклі `for…of`.

        Пастка `g`: шаблон із ним запам’ятовує, де зупинився (властивість `lastIndex`), і наступний `test` продовжує звідти. Тому для простих перевірок `true`/`false` прапорець `g` не ставлять.
      en: |
        Parentheses in a pattern are a [[capture-group|capture group]]: it remembers which part of the text matched it. `pattern.exec(text)` returns the match: `[0]` is the whole match, `[1]`, `[2]`… are the groups in order, `index` is where the match started. A group can get a name: `(?<year>\d{4})`, then it is available as `match.groups.year`. If there is no match, `exec` returns `null`.

        [[regex-flag|Flags]] are written after the pattern:

        - `i` — ignore letter case: `/лампа/i` finds “ЛАМПА”;
        - `u` — work with code points and allow `\p{L}`;
        - `g` — look for **all** matches: `text.matchAll(/…/g)` walks them in a `for…of` loop.

        The `g` trap: a pattern with it remembers where it stopped (the `lastIndex` property), and the next `test` continues from there. So simple `true`/`false` checks do not get the `g` flag.

  - id: predict-groups
    kind: prediction
    prompt:
      uk: "Що виведуть три виклики `console.log`?"
      en: "What do the three `console.log` calls print?"
    code: |
      const match = /(?<year>\d{4})-(?<month>\d{2})/.exec("2026-03-01");
      console.log(match[0], match[1], match.groups.month);
      const hasA = /a/g;
      console.log(hasA.test("aa"), hasA.test("aa"), hasA.test("aa"));
      console.log(new RegExp("1+1").test("1+1"), new RegExp("1+1").test("11"));
    verify:
      logs: ["2026-03 2026 03", "true true false", "false true"]
    answer:
      type: choice
      options:
        - id: real
          code: "2026-03 2026 03\ntrue true false\nfalse true"
        - id: whole-text
          code: "2026-03-01 2026 03\ntrue true false\nfalse true"
          why:
            uk: "`[0]` — це лише та частина тексту, що відповіла шаблону: `2026-03`. День у шаблон не входить."
            en: "`[0]` is only the part of the text that matched the pattern: `2026-03`. The day is not part of the pattern."
        - id: g-no-state
          code: "2026-03 2026 03\ntrue true true\nfalse true"
          why:
            uk: "З прапорцем `g` шаблон пам’ятає `lastIndex`. Третій `test` починає з кінця тексту, нічого не знаходить, повертає `false` і скидає `lastIndex` на 0."
            en: "With the `g` flag the pattern remembers `lastIndex`. The third `test` starts at the end of the text, finds nothing, returns `false` and resets `lastIndex` to 0."
        - id: literal-plus
          code: "2026-03 2026 03\ntrue true false\ntrue false"
          why:
            uk: "`new RegExp` не знає, що `\"1+1\"` — звичайний текст. `+` у шаблоні — квантифікатор: «одна чи більше одиниць, потім одиниця». Тож `\"11\"` підходить, а `\"1+1\"` — ні."
            en: "`new RegExp` does not know that `\"1+1\"` is plain text. `+` in a pattern is a quantifier: “one or more 1s, then a 1”. So `\"11\"` matches, while `\"1+1\"` does not."
      correct: [real]
    explanation:
      uk: "`[0]` — увесь збіг `2026-03`, `[1]` — перша група `2026`, `groups.month` — `03`. Шаблон із `g` пам’ятає позицію: два `a` знайдено, а третій пошук починається після них і дає `false`. А `new RegExp(\"1+1\")` — це шаблон, де `+` має спеціальне значення, а не текст «1+1»."
      en: "`[0]` is the whole match `2026-03`, `[1]` is the first group `2026`, `groups.month` is `03`. The pattern with `g` remembers its position: two `a`s were found, and the third search starts after them and gives `false`. And `new RegExp(\"1+1\")` is a pattern in which `+` has a special meaning, not the text “1+1”."

  - id: escaping
    kind: explanation
    title:
      uk: "Текст користувача — не шаблон"
      en: "User text is not a pattern"
    body:
      uk: |
        Пошук часто будують із запиту людини: `new RegExp(query, "gi")`. Але символи `. * + ? ^ $ { } ( ) | [ ] \` у шаблоні мають особливе значення. Запит `"c++"` дасть `SyntaxError` («Nothing to repeat»), `"1.5"` знайде і `"125"` (крапка — «будь-який символ»), а хитро складений запит може змусити шаблон працювати секундами.

        Тому текст користувача спершу [[regex-escaping|екранують]] — ставлять `\` перед кожним особливим символом:

        ```js
        function escapeForRegex(text) {
          return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }
        escapeForRegex("1.5"); // дає текст 1\.5 — тепер це крапка, а не «будь-що»
        ```

        `replace` із шаблоном і прапорцем `g` замінює всі збіги, а `$&` у заміні означає «сам знайдений символ». У нових браузерах є й вбудований `RegExp.escape(text)`.

        Друге правило — **обмежуй довжину введення**. Перш ніж запускати шаблон на тексті, обріж текст до розумної межі: так жоден шаблон не отримає мегабайт тексту.
      en: |
        A search is often built from a person’s query: `new RegExp(query, "gi")`. But the characters `. * + ? ^ $ { } ( ) | [ ] \` have special meanings in a pattern. The query `"c++"` gives a `SyntaxError` (“Nothing to repeat”), `"1.5"` also finds `"125"` (a dot is “any character”), and a cleverly built query can make a pattern work for seconds.

        So user text is first [[regex-escaping|escaped]] — a `\` goes before every special character:

        ```js
        function escapeForRegex(text) {
          return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }
        escapeForRegex("1.5"); // gives the text 1\.5 — now it is a dot, not “anything”
        ```

        `replace` with a pattern and the `g` flag replaces every match, and `$&` in the replacement means “the found character itself”. New browsers also have a built-in `RegExp.escape(text)`.

        The second rule is to **cap the input length**. Before running a pattern on text, cut the text to a sensible limit: then no pattern ever gets a megabyte of text.

  - id: try-counter
    kind: visual
    visual: code-trace
    title:
      uk: "Лічильник спроб вкладеного квантифікатора"
      en: "A try counter for a nested quantifier"
    textEquivalent:
      uk: "Функція nested перебирає всі способи поділити літери a на групи — так, як це робить шаблон /^(a+)+$/, — і рахує свої виклики в змінній steps. На тексті \"aa!\" кожен спосіб закінчується на «!», де шаблон не може продовжити, і функція повертається назад, щоб спробувати інший поділ. Для двох літер це 4 спроби. Для \"aaaa!\" — уже 16: дві додаткові літери вчетверо збільшили роботу, бо кожна літера подвоює кількість способів поділу. Переписаний шаблон /^a+$/ має лише один спосіб пройти текст: функція flat іде по символах один раз і зупиняється на «!» через 5 кроків. Консоль показує: 4 16 5. За тим самим правилом подвоєння двадцять літер дали б близько мільйона спроб; так само поводяться й шаблони на зразок /^(\\w+\\s?)+$/."
      en: "The function nested tries every way to split the letters a into groups — just as the pattern /^(a+)+$/ does — and counts its calls in the variable steps. On the text \"aa!\" every way ends at the “!”, where the pattern cannot go on, and the function goes back to try another split. For two letters that is 4 tries. For \"aaaa!\" it is already 16: two extra letters made four times the work, because every letter doubles the number of ways to split. The rewritten pattern /^a+$/ has only one way through the text: the function flat walks the characters once and stops at the “!” after 5 steps. The console shows: 4 16 5. By the same doubling rule, twenty letters would take about a million tries; patterns such as /^(\\w+\\s?)+$/ behave the same way."
    spec:
      file: visuals/count-tries.js
      steps: captioned
      maxSteps: 400
      captions:
        - at: { line: 32 }
          text:
            uk: "`nested` пробує всі способи поділити літери `a` на групи — як шаблон `/^(a+)+$/`. Почнемо з `\"aa!\"`."
            en: "`nested` tries every way to split the letters `a` into groups — like the pattern `/^(a+)+$/`. Let us start with `\"aa!\"`."
        - at: { line: 12, kind: return, hit: 1 }
          text:
            uk: "Перша спроба дійшла до `\"!\"`: це не `a`, шлях закрито. Шаблон не здається, а повертається назад і пробує інший поділ."
            en: "The first try reached the `\"!\"`: it is not an `a`, so this path is closed. The pattern does not give up; it goes back and tries another split."
        - at: { line: 33 }
          text:
            uk: "Для двох літер — `4` спроби (дивись на `steps`). Кожна закінчилася на `\"!\"`."
            en: "For two letters — `4` tries (watch `steps`). Every one of them ended at the `\"!\"`."
        - at: { line: 35 }
          text:
            uk: "Тепер `\"aaaa!\"` — на дві літери більше."
            en: "Now `\"aaaa!\"` — two more letters."
        - at: { line: 36 }
          text:
            uk: "`16` спроб: дві додаткові літери — учетверо більше роботи. Кожна літера подвоює кількість способів поділу; двадцять літер — це вже близько мільйона."
            en: "`16` tries: two extra letters, four times the work. Every letter doubles the number of ways to split; twenty letters make about a million."
        - at: { line: 38 }
          text:
            uk: "Переписаний шаблон `/^a+$/` описує те саме правило без вкладення. У нього лише один шлях."
            en: "The rewritten pattern `/^a+$/` describes the same rule without nesting. It has only one path."
        - at: { line: 26, kind: return }
          text:
            uk: "`flat` пройшов текст один раз і зупинився на `\"!\"` — `5` кроків, і жодного повернення назад."
            en: "`flat` walked the text once and stopped at the `\"!\"` — `5` steps and not a single step back."
        - at: { line: 40, kind: end }
          text:
            uk: "Консоль: `4 16 5`. Вкладений квантифікатор росте вдвічі з кожною літерою, а переписаний — на один крок."
            en: "The console: `4 16 5`. The nested quantifier doubles with every letter, while the rewritten one grows by one step."

  - id: runaway-timing
    kind: example
    runtime: browser-js
    dir: runaway-timing
    entry: index.js
    strings:
      nested: { uk: "вкладений:", en: "nested:" }
      flat: { uk: "переписаний:", en: "rewritten:" }
    title:
      uk: "Заміряй шаблон"
      en: "Time a pattern"
    body:
      uk: |
        Програма запускає вкладений шаблон на майже відповідному тексті довжиною 16, 18, 20, 22 і 24 літери. `"a".repeat(n)` повторює текст `n` разів, `performance.now()` дає поточний час у мілісекундах, а `ms.toFixed(1)` записує число з одним знаком після крапки.

        Запусти. Точні мілісекунди залежать від комп’ютера, але закономірність та сама: кожні дві літери — приблизно вчетверо довше. Вебсторінка, на якій працює такий шаблон, не відповідає ні на що, доки він не закінчиться: це один довгий синхронний виклик. Платформа запускає твій код в окремій пісочниці, тому сама платформа не замерзає, а кнопка «Зупинити» перериває такий виклик. Обмеження у 2 секунди для циклів тут не допоможе: на один довгий виклик `test` воно не діє.
      en: |
        The program runs the nested pattern on almost-matching text of 16, 18, 20, 22 and 24 letters. `"a".repeat(n)` repeats text `n` times, `performance.now()` gives the current time in milliseconds, and `ms.toFixed(1)` writes a number with one digit after the point.

        Run it. The exact milliseconds depend on the computer, but the pattern is the same: every two letters take about four times longer. A web page on which such a pattern runs responds to nothing until it finishes: it is one long synchronous call. The platform runs your code in a separate sandbox, so the platform itself does not freeze, and the Stop button interrupts such a call. The 2-second limit for loops does not help here: it does not apply to one long `test` call.
    tryIt:
      uk: |
        1. Заміни `nestedPattern.test` на `flatPattern.test` у циклі й запусти: усі довжини — близько `0.0 ms`. `/^\w+(\s\w+)*$/` описує ті самі «слова через один пробіл», але кожну літеру можна віднести лише до одного місця.
        2. Не збільшуй довжину для вкладеного шаблону понад 26: кожні дві літери множать час на чотири, і 30 літер — це вже кілька секунд очікування. Якщо запуск затягнувся, натисни «Зупинити».
        3. Допиши в кінець `console.log(new RegExp("c++", "i").test("C++ books"));` і запусти: `SyntaxError`. Потім додай функцію `escapeForRegex` з пояснення й заміни `"c++"` на `escapeForRegex("c++")` — тепер `true`.
      en: |
        1. Replace `nestedPattern.test` with `flatPattern.test` in the loop and run: every length takes about `0.0 ms`. `/^\w+(\s\w+)*$/` describes the same “words separated by one space”, but every letter can belong to only one place.
        2. Do not raise the length for the nested pattern above 26: every two letters multiply the time by four, and 30 letters already mean several seconds of waiting. If a run drags on, press Stop.
        3. Add `console.log(new RegExp("c++", "i").test("C++ books"));` at the end and run: a `SyntaxError`. Then add the function `escapeForRegex` from the explanation and replace `"c++"` with `escapeForRegex("c++")` — now it is `true`.

  - id: recall-blocking
    kind: review
    title:
      uk: "Пригадай: довга синхронна робота"
      en: "Recall: long synchronous work"
    items:
      - id: blocked-click
        from: js-08-01-timers-and-the-event-loop
        prompt:
          uk: "Людина клацає кнопку, поки шаблон дві секунди перевіряє текст в одному синхронному виклику. Коли спрацює обробник кліку?"
          en: "A person clicks a button while a pattern spends two seconds checking text in one synchronous call. When does the click handler run?"
        answer:
          type: choice
          options:
            - id: after
              text:
                uk: "Лише після того, як перевірка закінчиться"
                en: "Only after the check has finished"
            - id: immediately
              text:
                uk: "Одразу, паралельно з перевіркою"
                en: "Immediately, in parallel with the check"
              why:
                uk: "JavaScript на сторінці виконує одну справу за раз. Клік чекає в черзі, доки поточний код не завершиться."
                en: "JavaScript on a page does one thing at a time. The click waits in the queue until the current code has finished."
            - id: never
              text:
                uk: "Ніколи: клік під час роботи коду губиться"
                en: "Never: a click during running code is lost"
              why:
                uk: "Клік не губиться: браузер ставить його в чергу, і обробник спрацює, щойно стек звільниться."
                en: "The click is not lost: the browser queues it, and the handler runs as soon as the stack is free."
          correct: [after]
        explanation:
          uk: "Сторінка має один потік виконання JavaScript. Поки триває синхронний виклик, події чекають у черзі — і сторінка виглядає «замерзлою». Тому шаблон, що працює секундами, — це не лише повільно, а й зависання інтерфейсу."
          en: "A page has one thread running JavaScript. While a synchronous call lasts, events wait in the queue — and the page looks “frozen”. So a pattern that runs for seconds is not just slow; it hangs the interface."

  - id: find-all
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: find-all
    entry: index.js
    strings:
      books: { uk: "C++ для початківців і ще трохи c++", en: "C++ for beginners and a bit more c++" }
      query: { uk: "c++", en: "c++" }
    title:
      uk: "Безпечний пошук усіх збігів"
      en: "A safe search for every match"
    instructions:
      uk: |
        `findAll(text, query)` має повертати масив позицій (індексів), з яких починається кожен збіг запиту. Зараз вона падає на запиті `"c++"`. Виправ її так, щоб:

        - запит був **звичайним текстом**: `"c++"`, `"1.5"`, `"("` шукаються буквально (функція `escapeForRegex` уже є);
        - регістр літер не мав значення;
        - шукалося лише в перших `MAX_TEXT` (200) символах тексту — збіг має повністю вміщатися в них;
        - порожній запит давав `[]`.
      en: |
        `findAll(text, query)` should return an array of the positions (indexes) where every match of the query starts. Right now it fails on the query `"c++"`. Fix it so that:

        - the query is **plain text**: `"c++"`, `"1.5"`, `"("` are searched for literally (the function `escapeForRegex` is already there);
        - letter case does not matter;
        - only the first `MAX_TEXT` (200) characters of the text are searched — a match must fit inside them entirely;
        - an empty query gives `[]`.
    testTitles:
      "finds every position, ignoring letter case":
        uk: "Знаходить кожну позицію, не зважаючи на регістр"
        en: "Finds every position, ignoring letter case"
      "treats the query as plain text":
        uk: "Сприймає запит як звичайний текст"
        en: "Treats the query as plain text"
      "searches only the first 200 characters":
        uk: "Шукає лише в перших 200 символах"
        en: "Searches only the first 200 characters"
      "an empty query finds nothing":
        uk: "Порожній запит нічого не знаходить"
        en: "An empty query finds nothing"
      "no match gives an empty array":
        uk: "Без збігів — порожній масив"
        en: "No match gives an empty array"
    hints:
      nudge:
        uk: "Пройдися списком вимог: який прапорець відповідає за регістр, куди подіти `escapeForRegex`, яким методом тексту відрізати перші 200 символів?"
        en: "Go through the list of requirements: which flag handles letter case, where does `escapeForRegex` go, which text method cuts off the first 200 characters?"
      explanation:
        uk: "Шаблон будуй не з самого запиту, а з екранованого — так само, як `new RegExp(escapeForRegex(\"a.b\"))` шукає саме «a.b». Прапорці — другий аргумент `new RegExp`: `\"g\"` уже є, бракує ще одного. Обрізати текст можна методом `slice` до пошуку — так само, як `\"abcdef\".slice(0, 3)` дає `\"abc\"`; тоді збіг, що виходить за межу, просто не знайдеться. Порожній запит перевір на самому початку: порожній шаблон «збігається» в кожній позиції."
        en: "Build the pattern not from the query itself but from the escaped one — just as `new RegExp(escapeForRegex(\"a.b\"))` searches for exactly “a.b”. Flags are the second argument of `new RegExp`: `\"g\"` is there, one more is missing. You can cut the text with the `slice` method before searching — just as `\"abcdef\".slice(0, 3)` gives `\"abc\"`; then a match that crosses the limit is simply not found. Check for an empty query at the very start: an empty pattern “matches” at every position."
    solutionNote:
      uk: "Екранування робить запит буквальним, `gi` — усі збіги без огляду на регістр, `slice` до пошуку гарантує, що шаблон ніколи не отримає довгого тексту. Варіант без шаблону — `indexOf` на тексті й запиті в нижньому регістрі — теж правильний: там просто нічого екранувати."
      en: "Escaping makes the query literal, `gi` gives every match regardless of case, and `slice` before the search guarantees the pattern never gets long text. A version without any pattern — `indexOf` on the lowercased text and query — is correct too: there is simply nothing to escape there."
    feedback:
      - when: { test: "finds every position, ignoring letter case" }
        message:
          uk: "Ця перевірка шукає `\"ЛАМПА\"` у `\"Лампа і лампа\"` і чекає `[0, 8]`. Потрібен прапорець, що вимикає різницю між великими й малими літерами."
          en: "This check looks for `\"ЛАМПА\"` in `\"Лампа і лампа\"` and expects `[0, 8]`. You need the flag that switches off the difference between capital and small letters."
      - when: { test: "treats the query as plain text" }
        message:
          uk: "Ця перевірка чекає `[0, 8]` для `\"c++\"`, `[0]` для `\"1.5\"` у `\"1.5 or 125\"` і `[2, 6]` для `\"(\"`. Якщо `\"1.5\"` знайшлося двічі, крапка спрацювала як «будь-який символ»: шаблон треба будувати з екранованого запиту."
          en: "This check expects `[0, 8]` for `\"c++\"`, `[0]` for `\"1.5\"` in `\"1.5 or 125\"` and `[2, 6]` for `\"(\"`. If `\"1.5\"` was found twice, the dot acted as “any character”: build the pattern from the escaped query."
      - when: { test: "searches only the first 200 characters" }
        message:
          uk: "Ця перевірка ставить `\"c++\"` на позиції 197 (чекає `[197]`), 198 і 5000 (чекає `[]`), а ще на позицію 0 у тексті з 5003 символів (чекає `[0]`). Збіг має вміщатися в перші 200 символів: текст треба обрізати **до** пошуку, а не відкидати довгий текст цілком."
          en: "This check puts `\"c++\"` at position 197 (expects `[197]`), 198 and 5000 (expects `[]`), and at position 0 of a 5003-character text (expects `[0]`). A match has to fit into the first 200 characters: cut the text **before** searching instead of refusing a long text altogether."
      - when: { test: "an empty query finds nothing" }
        message:
          uk: "Ця перевірка чекає `[]` для порожнього запиту. Порожній шаблон знаходить «збіг» у кожній позиції — на початку, між будь-якими двома символами й у кінці, — тож порожній запит обробляють окремо."
          en: "This check expects `[]` for an empty query. An empty pattern finds a “match” at every position — at the start, between any two characters and at the end — so an empty query is handled separately."
      - when: { test: "no match gives an empty array" }
        message:
          uk: "Ця перевірка шукає `\"z\"` у `\"abc\"` і чекає порожній масив `[]`, а не `null` чи `undefined`."
          en: "This check looks for `\"z\"` in `\"abc\"` and expects an empty array `[]`, not `null` or `undefined`."
      - when: { error: SyntaxError }
        message:
          uk: "`SyntaxError` з повідомленням `Invalid regular expression` означає, що запит потрапив у `new RegExp` без екранування: `\"c++\"` чи `\"(\"` — не шаблон. Якщо ж картка каже, що код не вдалося запустити, шукай незакриту дужку чи лапку у своєму коді."
          en: "A `SyntaxError` with the message `Invalid regular expression` means the query went into `new RegExp` unescaped: `\"c++\"` or `\"(\"` is not a pattern. If instead the card says the code could not start, look for an unclosed bracket or quote in your code."
      - when: { error: TypeError }
        message:
          uk: "`matchAll` вимагає шаблон із прапорцем `g` — без нього буде `TypeError` («non-global RegExp»). Такий самий `TypeError` (`… is not a function`) буває, коли програма зупинилася під час запуску й `findAll` немає."
          en: "`matchAll` requires a pattern with the `g` flag — without it there is a `TypeError` (“non-global RegExp”). The same kind of `TypeError` (`… is not a function`) appears when the program stopped while starting and `findAll` does not exist."

  - id: to-project
    kind: transfer
    capstoneStep: JS-12
    body:
      uk: "Якщо пошук у твоєму проєкті будує шаблон із запиту, наприкінці розділу ти додаси екранування й обмеження довжини. А якщо він працює через `includes`, ти переконаєшся, що регулярний вираз там і не потрібен."
      en: "If the search in your project builds a pattern from the query, at the end of this unit you will add escaping and a length limit. And if it works with `includes`, you will confirm that a regular expression is not needed there at all."
