id: rn-10-01-gestures-touch
unit: RN-10
title:
  uk: "Жести й узгодження дотиків"
  en: "Gesture and touch coordination"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Простежити, хто володіє дотиком, коли він переходить від натискання до горизонтального руху всередині вертикального списку, і передбачити, коли перемагає рядок, а коли список."
    en: "Trace which component owns a touch as it moves from a tap to a horizontal pan inside a vertically scrolling list, and predict when the row or the list wins."
  - uk: "Налаштувати поріг активації й напрямок pan-жесту так, щоб горизонтальний свайп не забирав вертикальну прокрутку, і дати для тієї самої дії спосіб без жесту."
    en: "Configure a pan gesture's activation threshold and direction so a horizontal swipe does not steal vertical scrolling, and provide a non-gesture alternative for the same action."
prerequisites: [rn-03-05-touch-js-vs-ui]
subskills:
  - { family: N-08, skill: "gesture/touch coordination", depth: intro }
glossary: [pan-gesture, gesture-arbitration, activation-threshold]
selfCheck: [predict-owner, swipe-rules]

blocks:
  - id: who-owns-the-touch
    kind: explanation
    title:
      uk: "Чий це дотик?"
      en: "Whose touch is it?"
    body:
      uk: |
        Палець торкнувся рядка витрати, а рядок лежить у вертикальному `FlatList`. На цей дотик претендують двоє:

        - **рядок** зі [[pan-gesture|pan-жестом]]: свайп ліворуч видаляє витрату;
        - **список**: рух угору чи вниз гортає його.

        У момент дотику ще ніхто не знає, що задумав користувач. Тому обидва **чекають** і дивляться, куди рухається палець. Хто першим упізнає «свій» рух, той стає власником дотику, а інший відступає. Це й є [[gesture-arbitration|узгодження жестів]].

        `Pressable` з його `onPress` тут не допоможе. `onPress` каже лише «палець опустився й піднявся на елементі» — без напрямку й відстані. А щойно список почав гортатися, натискання скасовується, і `onPress` не настає зовсім. Свайп — це не швидке натискання, а окремий жест зі своїм порогом.
      en: |
        A finger touched an expense row, and the row sits in a vertical `FlatList`. Two parties claim this touch:

        - the **row** with a [[pan-gesture]]: a swipe to the left removes the expense;
        - the **list**: a move up or down scrolls it.

        At the moment of the touch nobody knows yet what the user means. So both **wait** and watch where the finger moves. Whoever recognises “its” movement first becomes the owner of the touch, and the other one steps back. This is [[gesture-arbitration]].

        `Pressable` and its `onPress` do not help here. `onPress` only says “a finger went down and up on the element” — with no direction and no distance. And once the list starts scrolling, the press is canceled and `onPress` never comes. A swipe is not a fast tap; it is a gesture of its own, with its own threshold.

  - id: two-touches
    kind: visual
    visual: sequence
    title:
      uk: "Два дотики: список перемагає, рядок перемагає"
      en: "Two touches: the list wins, the row wins"
    textEquivalent:
      uk: "Перший дотик. Палець опускається на рядок; рядок і список чекають, власника ще немає. Палець рухається на 2 точки вправо й 9 точок униз. Вертикальний рух вийшов за межу failOffsetY рядка (8 точок), а рядок ще не активувався, тож його pan-жест провалюється й більше не претендує на цей дотик. Палець іде далі вниз, на 16 точок: список бачить вертикальний рух, більший за свій поріг, і починає гортати — він власник. Другий дотик. Палець знову опускається на рядок. Він рухається на 14 точок вправо й лише на 2 вниз. Горизонтальний рух вийшов за межу activeOffsetX (12 точок), поки вертикальний лишався в межах 8 точок, тож pan-жест рядка активується, а список свій дотик втрачає й не гортає. Далі рядок отримує оновлення руху, а коли палець піднімається, — подію завершення з відстанню й швидкістю."
      en: "First touch. The finger goes down on the row; the row and the list wait, there is no owner yet. The finger moves 2 points right and 9 points down. The vertical movement left the row's failOffsetY range (8 points) before the row activated, so its pan gesture fails and no longer claims this touch. The finger goes on down to 16 points: the list sees a vertical movement beyond its own threshold and starts scrolling — it is the owner. Second touch. The finger goes down on the row again. It moves 14 points right and only 2 down. The horizontal movement left the activeOffsetX range (12 points) while the vertical one stayed within 8 points, so the row's pan gesture activates, and the list loses the touch and does not scroll. Then the row receives movement updates, and when the finger lifts, an end event with the distance and the speed."
    spec:
      actors:
        - { id: finger, label: { uk: "Палець", en: "Finger" } }
        - { id: row, label: { uk: "Pan-жест рядка", en: "Row pan gesture" } }
        - { id: list, label: { uk: "Прокрутка списку", en: "List scrolling" } }
      intro:
        uk: "Палець, pan-жест рядка й прокрутка списку. Межі рядка: `activeOffsetX` 12 точок, `failOffsetY` 8 точок."
        en: "The finger, the row's pan gesture and the list's scrolling. The row's ranges: `activeOffsetX` 12 points, `failOffsetY` 8 points."
      messages:
        - from: finger
          to: row
          label: { uk: "дотик (0, 0)", en: "touch down (0, 0)" }
          caption:
            uk: "Перший дотик. Рядок і список отримують його й **чекають**: власника ще немає."
            en: "First touch. The row and the list receive it and **wait**: there is no owner yet."
        - from: finger
          to: row
          label: { uk: "рух (2, 9)", en: "move (2, 9)" }
          caption:
            uk: "Палець пішов на 9 точок униз. Це більше за `failOffsetY` 8, а рядок ще не активувався."
            en: "The finger went 9 points down. That is more than `failOffsetY` 8, and the row has not activated yet."
        - from: row
          to: row
          kind: note
          label: { uk: "провал: |y| > 8", en: "fails: |y| > 8" }
          caption:
            uk: "Pan-жест рядка **провалюється** й більше не претендує на цей дотик."
            en: "The row's pan gesture **fails** and no longer claims this touch."
        - from: finger
          to: list
          label: { uk: "рух (3, 16)", en: "move (3, 16)" }
          caption:
            uk: "Вертикальний рух більший за поріг списку — список починає гортати й стає **власником** дотику."
            en: "The vertical movement is beyond the list's threshold — the list starts scrolling and becomes the **owner** of the touch."
        - from: finger
          to: row
          label: { uk: "новий дотик, рух (14, 2)", en: "new touch, move (14, 2)" }
          caption:
            uk: "Другий дотик. Палець пішов на 14 точок управо й лише на 2 вниз: горизонтальний рух вийшов за `activeOffsetX` 12, вертикальний лишився в межах 8."
            en: "Second touch. The finger went 14 points right and only 2 down: the horizontal movement left `activeOffsetX` 12, the vertical one stayed within 8."
        - from: row
          to: list
          label: { uk: "активовано: скасуй прокрутку", en: "activated: cancel scrolling" }
          caption:
            uk: "Pan-жест рядка **активується**. Список втрачає дотик і не гортає, хоч палець трохи рухається й униз."
            en: "The row's pan gesture **activates**. The list loses the touch and does not scroll, even though the finger also moves a little down."
        - from: finger
          to: row
          label: { uk: "палець піднято", en: "finger lifted" }
          kind: return
          caption:
            uk: "Поки палець рухається, рядок отримує оновлення, а коли палець піднімається, — подію завершення з відстанню (`translationX`) і швидкістю (`velocityX`)."
            en: "While the finger moves, the row receives updates, and when the finger lifts, an end event with the distance (`translationX`) and the speed (`velocityX`)."

  - id: predict-owner
    kind: prediction
    runnable: false
    prompt:
      uk: "Рядок витрати в списку має pan-жест з `activeOffsetX` 12 точок і `failOffsetY` 8 точок; список починає гортати після 10 точок вертикального руху. Три пальці рухаються так (точки відносно місця дотику, по черзі): **A** (1, 4) → (2, 9) → (3, 16); **B** (5, 4) → (10, 7) → (14, 11); **C** (6, 1) → (14, 2) → (30, 3). Хто власник кожного дотику?"
      en: "An expense row in a list has a pan gesture with `activeOffsetX` 12 points and `failOffsetY` 8 points; the list starts scrolling after 10 points of vertical movement. Three fingers move like this (points relative to the touch-down, in order): **A** (1, 4) → (2, 9) → (3, 16); **B** (5, 4) → (10, 7) → (14, 11); **C** (6, 1) → (14, 2) → (30, 3). Who owns each touch?"
    answer:
      type: choice
      options:
        - id: list-list-row
          text:
            uk: "A — список, B — список, C — рядок"
            en: "A — the list, B — the list, C — the row"
        - id: list-row-row
          text:
            uk: "A — список, B — рядок, C — рядок"
            en: "A — the list, B — the row, C — the row"
          why:
            uk: "У B палець на третьому кроці пройшов 14 точок управо, але й 11 униз. Вертикальна межа рядка — 8 точок, і перевіряють її раніше за активацію: рядок провалюється, а список забирає дотик."
            en: "In B the finger went 14 points right at the third step, but also 11 down. The row's vertical range is 8 points, and it is checked before activation: the row fails and the list takes the touch."
        - id: row-row-row
          text:
            uk: "Усі три — рядок: палець же торкнувся рядка"
            en: "All three — the row: the finger touched the row after all"
          why:
            uk: "Місце дотику ще нічого не вирішує: рядок і список обидва чекають. Власника визначає напрямок руху щодо порогів."
            en: "The place of the touch decides nothing yet: the row and the list both wait. The owner is decided by the direction of the movement relative to the thresholds."
        - id: tap
          text:
            uk: "Жоден: `onPress` рядка спрацює для всіх трьох, бо палець опустився й піднявся на рядку"
            en: "Nobody: the row's `onPress` fires for all three, because the finger went down and up on the row"
          why:
            uk: "Натискання не знає напрямку, а рух на 16 чи 30 точок — уже не натискання. Коли список починає гортати, натискання скасовується."
            en: "A press knows no direction, and a 16- or 30-point move is no longer a press. When the list starts scrolling, the press is canceled."
      correct: [list-list-row]
    explanation:
      uk: "A: 9 точок униз — рядок провалюється, на 16 точках список гортає. B: на третьому кроці 11 точок униз — знову більше за 8, рядок провалюється раніше, ніж горизонтальні 14 точок встигають його активувати. C: 14 точок управо при 2 вниз — рядок активується, список скасовує прокрутку. Діагональ дісталася списку, бо `failOffsetY` тут суворий. Слабша межа `failOffsetY` віддала б цю діагональ рядку."
      en: "A: 9 points down — the row fails, at 16 points the list scrolls. B: at the third step 11 points down — again more than 8, so the row fails before the horizontal 14 points can activate it. C: 14 points right with 2 down — the row activates, the list cancels scrolling. The diagonal went to the list because `failOffsetY` is strict here. A looser `failOffsetY` would give this diagonal to the row."

  - id: finger-paths
    kind: example
    runtime: concept-preview
    dir: finger-paths
    entry: main.jsx
    strings:
      vertical: { uk: "Вертикально", en: "Vertical" }
      diagonal: { uk: "Навскіс", en: "Diagonal" }
      horizontal: { uk: "Горизонтально", en: "Horizontal" }
      nobody: { uk: "ніхто (ще чекають)", en: "nobody (still waiting)" }
      row: { uk: "рядок (свайп)", en: "the row (swipe)" }
      list: { uk: "список (прокрутка)", en: "the list (scrolling)" }
      groceries: { uk: "Продукти на тиждень · 845,50 ₴", en: "Weekly groceries · UAH 845.50" }
      pass: { uk: "Проїзний · 520,00 ₴", en: "Transit pass · UAH 520.00" }
      coffee: { uk: "Кава з друзями · 180,00 ₴", en: "Coffee with friends · UAH 180.00" }
      pick: { uk: "Обери шлях пальця.", en: "Pick a finger path." }
    title:
      uk: "Переграй шляхи пальця"
      en: "Replay the finger paths"
    body:
      uk: |
        Три шляхи з передбачення, програні через модель правил pan-жесту. Підсвічений рядок — той, якого торкнувся палець.

        Натисни **Запустити**, а потім кнопки на **Сторінці**. У консолі видно власника після кожного кроку пальця: поки ніхто не впізнав свій рух, власника немає.
      en: |
        The three paths from the prediction, replayed through a model of the pan gesture's rules. The highlighted row is the one the finger touched.

        Press **Run**, then the buttons on the **Page**. The console shows the owner after every step of the finger: until someone recognises its movement, there is no owner.
    tryIt:
      uk: |
        1. Зміни `FAIL_OFFSET_Y` з `8` на `20`, запусти й натисни «Навскіс»: тепер на кроці (14, 11) рядок встигає активуватися. Діагональний рух, який мав гортати список, «краде» рядок — саме так свайп заважає прокрутці.
        2. Поверни `8`, а `ACTIVE_OFFSET_X` зміни на `40`. «Горизонтально» досі дістається рядку, але лише на кроці (60, 4): користувачу доведеться тягнути довше, перш ніж рядок поїде.
      en: |
        1. Change `FAIL_OFFSET_Y` from `8` to `20`, run and press “Diagonal”: now at the step (14, 11) the row manages to activate. A diagonal movement that should have scrolled the list is “stolen” by the row — this is exactly how a swipe gets in the way of scrolling.
        2. Put `8` back and change `ACTIVE_OFFSET_X` to `40`. “Horizontal” still goes to the row, but only at the step (60, 4): the user has to drag further before the row moves.
    limits:
      uk: "Це симуляція в перегляді react-native-web, а не справжні жести: у браузері немає пальця, нативної прокрутки й бібліотеки жестів. Файл `gestureSim.js` моделює задокументовані правила pan-жесту react-native-gesture-handler 2.32 (`activeOffsetX`, `failOffsetY`); поріг списку 10 точок — приклад, справжній обирає платформа. Вигляд платформи, швидкість і відчуття жесту перевіряють лише на пристрої."
      en: "This is a simulation in the react-native-web preview, not real gestures: a browser has no finger, no native scrolling and no gesture library. The file `gestureSim.js` models the documented pan gesture rules of react-native-gesture-handler 2.32 (`activeOffsetX`, `failOffsetY`); the list's 10-point threshold is an example, the platform chooses the real one. The platform's look, the speed and the feel of the gesture are checked only on a device."

  - id: threshold-and-alternative
    kind: explanation
    title:
      uk: "Поріг, напрямок і спосіб без жесту"
      en: "Threshold, direction and a way without a gesture"
    body:
      uk: |
        На пристрої жести дає бібліотека `react-native-gesture-handler` (в Expo SDK 57 — версія 2.32). Вона розпізнає жест нативно, у [[ui-thread|потоці UI]], тож не чекає на зайнятий JavaScript. Рядок налаштовують так:

        ```js
        const pan = Gesture.Pan()
          .activeOffsetX([-12, 12]) // starts only after 12 points sideways
          .failOffsetY([-8, 8])     // gives up after 8 points up or down
          .runOnJS(true)            // run the callbacks on the JS thread
          .onEnd((event) => handleSwipeEnd(event));
        ```

        `activeOffsetX` — це [[activation-threshold|поріг активації]]: поки палець у межах 12 точок по горизонталі, жест не починається. `failOffsetY` стереже **напрямок**: вертикальний рух понад 8 точок до активації віддає дотик списку. `runOnJS(true)` потрібен, бо в проєкті з `react-native-reanimated` бібліотека виконує колбеки жесту в потоці UI, де твоєї функції `handleSwipeEnd` немає; як працювати в потоці UI, розбереш у третьому уроці.

        Подія `onEnd` несе `translationX` і `velocityX`. Свайп має спрацювати, коли рядок відсунули **досить далеко** або **кинули досить швидко** — інакше рядок повертається на місце.

        І жест — не єдиний шлях. Користувач [[voiceover|VoiceOver]] чи [[talkback|TalkBack]] не свайпає рядок пальцем: його свайпи керують читачем екрана. Тому та сама дія стає **дією доступності**:

        ```js
        <View
          accessible
          accessibilityLabel={label}
          accessibilityActions={[{ name: 'archive', label: 'Archive' }]}
          onAccessibilityAction={(event) => { /* check event.nativeEvent.actionName */ }}
        />
        ```

        Читач екрана пропонує її в списку дій елемента. `accessible` робить рядок одним елементом, на якому читач екрана зупиняється, а `accessibilityLabel` каже, що це за рядок.
      en: |
        On a device gestures come from the `react-native-gesture-handler` library (version 2.32 in Expo SDK 57). It recognises a gesture natively, on the [[ui-thread]], so it does not wait for busy JavaScript. A row is configured like this:

        ```js
        const pan = Gesture.Pan()
          .activeOffsetX([-12, 12]) // starts only after 12 points sideways
          .failOffsetY([-8, 8])     // gives up after 8 points up or down
          .runOnJS(true)            // run the callbacks on the JS thread
          .onEnd((event) => handleSwipeEnd(event));
        ```

        `activeOffsetX` is the [[activation-threshold]]: while the finger stays within 12 points horizontally, the gesture does not start. `failOffsetY` guards the **direction**: a vertical move of more than 8 points before activation hands the touch to the list. `runOnJS(true)` is needed because in a project with `react-native-reanimated` the library runs gesture callbacks on the UI thread, where your `handleSwipeEnd` function does not exist; working on the UI thread is the topic of the third lesson.

        The `onEnd` event carries `translationX` and `velocityX`. A swipe should take effect when the row was moved **far enough** or **thrown fast enough** — otherwise the row returns to its place.

        And a gesture is not the only way. A [[voiceover|VoiceOver]] or [[talkback|TalkBack]] user does not swipe a row with a finger: their swipes drive the screen reader. So the same action becomes an **accessibility action**:

        ```js
        <View
          accessible
          accessibilityLabel={label}
          accessibilityActions={[{ name: 'archive', label: 'Archive' }]}
          onAccessibilityAction={(event) => { /* check event.nativeEvent.actionName */ }}
        />
        ```

        The screen reader offers it in the element's list of actions. `accessible` makes the row one element the screen reader stops on, and `accessibilityLabel` says which row it is.

  - id: recall-threads
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: where-handlers-run
        from: rn-03-05-touch-js-vs-ui
        prompt:
          uk: "Обробник `onPress` у рядку списку синхронно рахує 300 мс. Що в цей час відбувається з нативною прокруткою списку й з натисканням іншої кнопки?"
          en: "A list row's `onPress` handler computes synchronously for 300 ms. What happens meanwhile to the list's native scrolling and to a press on another button?"
        answer:
          type: choice
          options:
            - id: scroll-goes-press-waits
              text:
                uk: "Прокрутка триває, а натискання іншої кнопки чекає, доки обробник закінчиться"
                en: "Scrolling goes on, while the press on another button waits until the handler finishes"
            - id: both-wait
              text:
                uk: "Чекають обидва: увесь застосунок стоїть"
                en: "Both wait: the whole app is frozen"
              why:
                uk: "Нативна прокрутка живе в потоці UI, який не виконує твій JavaScript, тож вона триває."
                en: "Native scrolling lives on the UI thread, which does not run your JavaScript, so it goes on."
            - id: neither-waits
              text:
                uk: "Ніхто не чекає: кожна кнопка має свій потік"
                en: "Nothing waits: every button has its own thread"
              why:
                uk: "Потік JS один на весь застосунок; обробники всіх кнопок виконуються в ньому по черзі."
                en: "There is one JS thread for the whole app; the handlers of all buttons run on it one after another."
          correct: [scroll-goes-press-waits]
        explanation:
          uk: "Обробники подій і рендер React виконуються в потоці JS, а нативна прокрутка й малювання — у потоці UI. Тому жест, який розпізнає нативна бібліотека, не чекає на твій JavaScript, а от його обробник у JavaScript — чекатиме."
          en: "Event handlers and React rendering run on the JS thread, while native scrolling and drawing run on the UI thread. That is why a gesture recognised by a native library does not wait for your JavaScript — but its JavaScript handler would."

