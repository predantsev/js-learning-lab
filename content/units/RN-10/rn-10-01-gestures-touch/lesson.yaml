    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      short: { uk: "Короткий повільний", en: "Short, slow" }
      long: { uk: "Довгий", en: "Long" }
      flick: { uk: "Швидкий ривок", en: "Quick flick" }
      right: { uk: "Управо", en: "To the right" }
      screenReader: { uk: "Дія читача екрана", en: "Screen-reader action" }
      simulate: { uk: "Симуляція для першого бажання в списку:", en: "Simulation for the first wish in the list:" }
      acquire: { uk: "Позначити отриманим", en: "Mark as acquired" }
    title:
      uk: "Коли свайп позначає бажання отриманим"
      en: "When a swipe marks a wish acquired"
    instructions:
      uk: |
        Свайп рядка бажання ліворуч позначає його отриманим. Допиши `swipeRules.js`:

        - `onSwipeEnd(event, acquire)` викликає `acquire()` **рівно один раз**, якщо рядок посунули **ліворуч** (`translationX` менше за 0) і при цьому він пройшов **щонайменше 120 точок** (`translationX <= -120`) **або** палець відпустили на швидкості **щонайменше 800 точок за секунду ліворуч** (`velocityX <= -800`). Інакше — не викликає;
        - `acquireActionProps(label, acquire)` повертає `accessibilityActions` з однією дією `{ name: 'acquire', label }` і `onAccessibilityAction`, який викликає `acquire()` лише для дії з назвою `'acquire'` (`event.nativeEvent.actionName`).

        Кнопки на **Сторінці** симулюють кінець свайпу й дію читача екрана для першого бажання. Перевірки викликають обидві функції напряму з різними значеннями.
      en: |
        A swipe of a wish row to the left marks it acquired. Finish `swipeRules.js`:

        - `onSwipeEnd(event, acquire)` calls `acquire()` **exactly once** if the row was moved **left** (`translationX` below 0) and it either went **at least 120 points** (`translationX <= -120`) **or** the finger was released at **at least 800 points per second to the left** (`velocityX <= -800`). Otherwise it does not call it;
        - `acquireActionProps(label, acquire)` returns `accessibilityActions` with one action `{ name: 'acquire', label }` and an `onAccessibilityAction` that calls `acquire()` only for the action named `'acquire'` (`event.nativeEvent.actionName`).

        The buttons on the **Page** simulate the end of a swipe and the screen-reader action for the first wish. The checks call both functions directly with different values.
    limits:
      uk: "Перегляд react-native-web не має пальця, жестів і читача екрана: кнопки лише викликають твої функції з готовими значеннями, а `accessibilityActions` перегляд не показує. Перевірки дивляться на поведінку функцій; як дія звучить у VoiceOver чи TalkBack і як свайп відчувається пальцем, видно лише на пристрої."
      en: "The react-native-web preview has no finger, no gestures and no screen reader: the buttons only call your functions with prepared values, and the preview does not show `accessibilityActions`. The checks look at the functions' behavior; how the action sounds in VoiceOver or TalkBack and how the swipe feels under a finger are visible only on a device."
    testTitles:
      "a swipe of at least 120 points to the left acquires once":
        uk: "Свайп ліворуч щонайменше на 120 точок позначає один раз"
        en: "A swipe of at least 120 points to the left acquires once"
      "a flick of at least 800 points per second to the left acquires once":
        uk: "Ривок ліворуч щонайменше 800 точок/с позначає один раз"
        en: "A flick of at least 800 points per second to the left acquires once"
      "a short, slow swipe to the left does not acquire":
        uk: "Короткий повільний свайп ліворуч не позначає"
        en: "A short, slow swipe to the left does not acquire"
      "a row that did not move left never acquires":
        uk: "Рядок, що не посунувся ліворуч, ніколи не позначає"
        en: "A row that did not move left never acquires"
      "the row lists an acquire accessibility action with the given label":
        uk: "Рядок має дію доступності `acquire` з переданим підписом"
        en: "The row lists an `acquire` accessibility action with the given label"
      "only the acquire action calls acquire()":
        uk: "Лише дія `acquire` викликає `acquire()`"
        en: "Only the `acquire` action calls `acquire()`"
    hints:
      nudge:
        uk: "Ліворуч — це від’ємні числа. Скільки умов має `onSwipeEnd`: одну про напрямок і ще дві, з яких досить будь-якої?"
        en: "Left means negative numbers. How many conditions does `onSwipeEnd` need: one about the direction, plus two of which any one is enough?"
      explanation:
        uk: "Спершу відкинь рух не в той бік, потім перевір «досить далеко» **або** «досить швидко». Для порівняння з від’ємним порогом думай про числову пряму: −150 менше за −120, отже «далі». Наприклад, правило «гортання вгору на 300 точок чи ривок угору» виглядало б як `dy < 0 && (dy <= -300 || vy <= -1000)`. Дія доступності — об’єкт з масивом дій і обробником, що читає `event.nativeEvent.actionName` і реагує лише на свою назву."
        en: "First discard a move in the wrong direction, then check “far enough” **or** “fast enough”. To compare with a negative threshold, think of the number line: −150 is less than −120, so “further”. For example, a rule “scrolled up 300 points or flicked up” would look like `dy < 0 && (dy <= -300 || vy <= -1000)`. The accessibility action is an object with an array of actions and a handler that reads `event.nativeEvent.actionName` and reacts only to its own name."
    solutionNote:
      uk: "Напрямок перевіряється першим, тож ривок управо чи рядок, посунутий управо, ніколи не позначає. Далі досить однієї з двох умов: далеко (`<= -120`) або швидко (`<= -800`). Дія доступності дає читачу екрана той самий результат без жесту; перевірка назви не дає іншим діям (наприклад, `activate` — подвійному дотику) випадково позначити бажання. На пристрої той самий об’єкт розгортають у `<View {...acquireActionProps(label, acquire)}>`."
      en: "The direction is checked first, so a flick to the right or a row moved right never acquires. Then one of two conditions is enough: far (`<= -120`) or fast (`<= -800`). The accessibility action gives a screen-reader user the same result without a gesture; checking the name keeps other actions (for example `activate`, a double tap) from acquiring the wish by accident. On a device the same object is spread into `<View {...acquireActionProps(label, acquire)}>`."
    feedback:
      - when: { test: "a swipe of at least 120 points to the left acquires once" }
        message:
          uk: "Ця перевірка викликає `onSwipeEnd` з `translationX` −150 і −120 (швидкість мала) і очікує рівно один виклик `acquire()` щоразу. Межа −120 рахується: «щонайменше 120» — це `<=`, а не `<`."
          en: "This check calls `onSwipeEnd` with `translationX` −150 and −120 (low speed) and expects exactly one `acquire()` call each time. The −120 boundary counts: “at least 120” is `<=`, not `<`."
      - when: { test: "a flick of at least 800 points per second to the left acquires once" }
        message:
          uk: "Ця перевірка викликає `onSwipeEnd` для короткого руху (−40 і −30 точок) зі швидкістю −1200 і −800 і очікує один виклик `acquire()`. Швидкий ривок має спрацьовувати навіть тоді, коли рядок пройшов мало."
          en: "This check calls `onSwipeEnd` for a short move (−40 and −30 points) at −1200 and −800 speed and expects one `acquire()` call. A quick flick must work even when the row moved only a little."
      - when: { test: "a short, slow swipe to the left does not acquire" }
        message:
          uk: "Ця перевірка очікує нуль викликів для (−60, −300) і (−119, −799): не досить далеко й не досить швидко."
          en: "This check expects zero calls for (−60, −300) and (−119, −799): not far enough and not fast enough."
      - when: { test: "a row that did not move left never acquires" }
        message:
          uk: "Ця перевірка очікує нуль викликів, коли `translationX` додатний — навіть для швидкого руху (1500) і навіть коли наприкінці палець рухався ліворуч (−900). Порівнюй зі знаком, а не через `Math.abs`."
          en: "This check expects zero calls when `translationX` is positive — even for a fast move (1500) and even when the finger moved left at the very end (−900). Compare with the sign, not through `Math.abs`."
      - when: { test: "the row lists an acquire accessibility action with the given label" }
        message:
          uk: "Ця перевірка очікує, що `acquireActionProps(label, acquire)` повертає `accessibilityActions` рівно `[{ name: 'acquire', label }]`, де `label` — переданий підпис."
          en: "This check expects `acquireActionProps(label, acquire)` to return `accessibilityActions` equal to `[{ name: 'acquire', label }]`, where `label` is the given label."
      - when: { test: "only the acquire action calls acquire()" }
        message:
          uk: "Ця перевірка викликає `onAccessibilityAction` з `{ nativeEvent: { actionName: 'acquire' } }` і очікує один виклик `acquire()`, а потім з `'activate'` і очікує, що викликів не побільшало."
          en: "This check calls `onAccessibilityAction` with `{ nativeEvent: { actionName: 'acquire' } }` and expects one `acquire()` call, then with `'activate'` and expects no extra call."

  - id: to-project
    kind: transfer
    capstoneStep: RN-10
    body:
      uk: "У кроці проєкту свайп рядка виконує дію твого домену: бажання стає отриманим, справа — виконаною, звичка отримує сьогоднішню позначку, витрата видаляється. До кожного свайпу ти додаси дію доступності з тим самим результатом і налаштуєш межі так, щоб список і далі гортався."
      en: "In the project step a row swipe performs your domain's action: a wish becomes acquired, a task done, a habit gets today's mark, an expense is removed. To every swipe you will add an accessibility action with the same result and set the ranges so that the list still scrolls."
