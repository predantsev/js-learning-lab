    body:
      uk: "У кроці проєкту анімацію свайпу зупиняє cleanup рядка, а при ввімкненому «зменшити рух» рядок лише згасає чи змінюється миттєво: бажання так само стає отриманим, справа — виконаною, звичка — позначеною сьогодні, витрата — видаленою."
