id: rn-10-02-animation-fundamentals
unit: RN-10
title:
  uk: "Основи анімації"
  en: "Animation fundamentals"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Описати анімацію як значення, що змінюється в часі (timing чи spring) і перетворюється на стиль через інтерполяцію, і передбачити її кінцевий стан."
    en: "Describe an animation as a value changing over time (timing or spring) that is interpolated into a style, and predict its end state."
  - uk: "Обмежити анімацію фіксованою тривалістю чи умовою зупинки, заданим кінцевим значенням і завершенням, яке оновлює стан рівно один раз."
    en: "Bound an animation with a fixed duration or a settle condition, a defined end value and a completion that updates state exactly once."
prerequisites: [rn-10-01-gestures-touch, re-01-06-render-vs-commit]
subskills:
  - { family: N-08, skill: "animation fundamentals", depth: intro }
glossary: [animated-value, spring-animation, animated-interpolation]
selfCheck: [predict-renders, fade-dismiss]

blocks:
  - id: value-over-time
    kind: explanation
    title:
      uk: "Анімація — це значення в часі"
      en: "An animation is a value over time"
    body:
      uk: |
        Рядок справи після «Виконано» має від’їхати ліворуч. Перша думка — `setState` з новим зсувом 60 разів на секунду. Але тоді компонент рендериться на **кожному кадрі** — а кадр на телефоні триває близько 16 мс.

        React Native має інший шлях — `Animated`:

        ```js
        const translateX = useRef(new Animated.Value(0)).current;

        Animated.timing(translateX, { toValue: -320, duration: 300, useNativeDriver: true })
          .start(({ finished }) => { /* runs once, at the end */ });

        <Animated.View style={{ transform: [{ translateX }] }} />
        ```

        [[animated-value|`Animated.Value`]] — число, яке змінюється з часом **поза станом React**. `Animated.timing` веде його від 0 до −320 за 300 мс; `Animated.View` бере значення просто зі стилю й оновлює view сам. Твій компонент при цьому не рендериться заново. Колбек `start` викликається один раз — коли анімація скінчилася.

        `useNativeDriver` обов’язковий: без нього React Native попереджає в консолі. Що він вмикає, розбереш у наступному уроці; у перегляді курсу його немає, тому приклади пишуть `false`.
      en: |
        After “Done”, a task row should slide away to the left. The first idea is `setState` with a new offset 60 times a second. But then the component renders on **every frame** — and a frame on a phone lasts about 16 ms.

        React Native has another way — `Animated`:

        ```js
        const translateX = useRef(new Animated.Value(0)).current;

        Animated.timing(translateX, { toValue: -320, duration: 300, useNativeDriver: true })
          .start(({ finished }) => { /* runs once, at the end */ });

        <Animated.View style={{ transform: [{ translateX }] }} />
        ```

        An [[animated-value|`Animated.Value`]] is a number that changes over time **outside React state**. `Animated.timing` takes it from 0 to −320 in 300 ms; `Animated.View` takes the value straight from its style and updates the view itself. Your component does not render again meanwhile. The `start` callback is called once — when the animation has ended.

        `useNativeDriver` is required: without it React Native warns in the console. What it switches on is the next lesson's topic; the course preview has no native driver, so the examples write `false`.

  - id: predict-renders
    kind: prediction
    runnable: false
    prompt:
      uk: "У `TaskList` три справи. Натискання «Виконано» запускає в рядку `Animated.timing` для `translateX` на 300 мс, а колбек `start` викликає `setTasks`, що прибирає цю справу. До натискання `TaskList` відрендерився один раз. Скільки разів він рендериться **під час** анімації і скільки — **після** колбека?"
      en: "`TaskList` holds three tasks. Pressing “Done” starts an `Animated.timing` of `translateX` for 300 ms in the row, and the `start` callback calls `setTasks`, which removes that task. Before the press `TaskList` rendered once. How many times does it render **during** the animation, and how many **after** the callback?"
    answer:
      type: choice
      options:
        - id: zero-one
          text:
            uk: "Під час — жодного разу, після колбека — один раз"
            en: "During — not once, after the callback — once"
        - id: per-frame
          text:
            uk: "Під час — приблизно 18 разів (по разу на кадр), після — один"
            en: "During — about 18 times (once per frame), after — once"
          why:
            uk: "Так було б, якби кожен кадр робив `setState`. `Animated.Value` змінюється поза станом React, і `Animated.View` оновлює view сам — твій компонент не викликається."
            en: "That would happen if every frame called `setState`. An `Animated.Value` changes outside React state, and `Animated.View` updates the view itself — your component is not called."
        - id: zero-zero
          text:
            uk: "Жодного разу ні під час, ні після: рядок уже поїхав за екран, отже зник"
            en: "Not once, neither during nor after: the row has already slid off screen, so it is gone"
          why:
            uk: "Анімація змінює лише вигляд. Запис зникає зі списку, тільки коли змінюється стан — тут це `setTasks` у колбеку, і він спричиняє рендер."
            en: "The animation changes only the look. The record leaves the list only when state changes — here that is `setTasks` in the callback, and it causes a render."
        - id: one-zero
          text:
            uk: "Один раз на старті анімації, а після колбека — жодного"
            en: "Once when the animation starts, and none after the callback"
          why:
            uk: "`Animated.timing(...).start()` не змінює стану, тож рендеру на старті немає. А `setTasks` у колбеку — змінює."
            en: "`Animated.timing(...).start()` does not change state, so there is no render at the start. `setTasks` in the callback does."
      correct: [zero-one]
    explanation:
      uk: "Поки йде анімація, змінюється лише `Animated.Value`, і перегляд курсу на моніторі 60 Гц рахує 0 нових рендерів `TaskList` за 17–18 кадрів. Колбек `start` викликає `setTasks` один раз — це один рендер і один commit з новим масивом справ. Виїзд за екран і видалення запису — дві різні речі."
      en: "While the animation runs, only the `Animated.Value` changes, and the course preview on a 60 Hz monitor counts 0 new renders of `TaskList` over 17–18 frames. The `start` callback calls `setTasks` once — that is one render and one commit with the new array of tasks. Sliding off screen and removing the record are two different things."

  - id: dismiss-timeline
    kind: visual
    visual: render-timeline
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки", en: "Return books" }
    title:
      uk: "Один dismiss: кадри без рендерів, потім один рендер"
      en: "One dismiss: frames without renders, then one render"
    textEquivalent:
      uk: "Рендер 1 бачить дві справи, «%%water%%» і «%%library%%», commit показує обидва рядки з translateX 0. Натискання «Виконано» в першому рядку запускає Animated.timing: стан не змінюється, черга оновлень порожня. Далі йдуть кадри: значення translateX стає −60, −180, −320, а view рядка оновлюється без жодного нового рендеру компонента. Коли значення дійшло до −320, анімація викликає колбек start з finished: true, і той викликає setTasks без t-01. Це рендер 2 з однією справою, і commit прибирає рядок зі сторінки. Разом: два рендери на всю історію, хоча кадрів було близько вісімнадцяти."
      en: "Render 1 sees two tasks, “%%water%%” and “%%library%%”, and the commit shows both rows with translateX 0. Pressing “Done” in the first row starts Animated.timing: state does not change, the update queue is empty. Then come the frames: the translateX value becomes −60, −180, −320, and the row's view is updated without any new render of the component. When the value has reached −320, the animation calls the start callback with finished: true, and it calls setTasks without t-01. That is render 2 with one task, and its commit removes the row from the page. In total: two renders for the whole story, although there were about eighteen frames."
    spec:
      component: TaskList
      code: |
        function TaskList() {
          const [tasks, setTasks] = useState(initialTasks);
          return tasks.map((task) => (
            <TaskRow key={task.id} task={task}
              onDismissed={(id) => setTasks((t) => t.filter((x) => x.id !== id))} />
          ));
        }
        // in TaskRow:
        Animated.timing(translateX, { toValue: -320, duration: 300, useNativeDriver: false })
          .start(({ finished }) => { if (finished) onDismissed(task.id); });
      steps:
        - phase: render
          render: 1
          line: 2
          reason: { uk: "перший показ", en: "first display" }
          snapshot: { state: { tasks: ["t-01", "t-02"] } }
          caption:
            uk: "Рендер 1: дві справи в стані."
            en: "Render 1: two tasks in state."
        - phase: commit
          render: 1
          dom: "<row x=0>%%water%%</row><row x=0>%%library%%</row>"
          caption:
            uk: "Commit показує обидва рядки, `translateX` — 0."
            en: "The commit shows both rows, `translateX` is 0."
        - phase: event
          name: press
          line: 10
          sees: { tasks: ["t-01", "t-02"] }
          actions: ["Animated.timing(translateX, …).start(…)"]
          caption:
            uk: "Натискання запускає анімацію. Стан не змінюється — оновлень у черзі немає, рендеру не буде."
            en: "The press starts the animation. State does not change — nothing is queued, there will be no render."
        - phase: idle
          caption:
            uk: "Кадри: `translateX` стає −60, −180, −320. View рядка оновлюється сам, **без** рендерів `TaskList` чи `TaskRow`."
            en: "Frames: `translateX` becomes −60, −180, −320. The row's view updates by itself, **without** renders of `TaskList` or `TaskRow`."
        - phase: event
          name: "animation end"
          line: 11
          sees: { tasks: ["t-01", "t-02"] }
          actions: ["onDismissed(\"t-01\")", "setTasks(without t-01)"]
          queued: { tasks: ["t-02"] }
          caption:
            uk: "Значення дійшло до −320: колбек `start` отримує `finished: true` і **один раз** викликає `onDismissed`, той ставить у чергу новий масив."
            en: "The value has reached −320: the `start` callback gets `finished: true` and calls `onDismissed` **once**, which queues the new array."
        - phase: render
          render: 2
          line: 2
          reason: { uk: "змінився стан tasks", en: "tasks state changed" }
          snapshot: { state: { tasks: ["t-02"] } }
          caption:
            uk: "Рендер 2 бачить одну справу."
            en: "Render 2 sees one task."
        - phase: commit
          render: 2
          dom: "<row x=0>%%library%%</row>"
          caption:
            uk: "Commit прибирає рядок зі сторінки. Два рендери на всю історію — проти приблизно 18 кадрів."
            en: "The commit removes the row from the page. Two renders for the whole story — against about 18 frames."

  - id: slide-out
    kind: example
    runtime: concept-preview
    dir: slide-out
    entry: main.jsx
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      done: { uk: "Виконано", en: "Done" }
    title:
      uk: "Порахуй рендери й кадри"
      en: "Count the renders and the frames"
    body:
      uk: |
        Список справ: ✓ виштовхує рядок ліворуч за 300 мс, а колбек `start` прибирає справу зі стану. `TaskList` пише в консоль кожен свій рендер, а анімація — кількість кадрів.

        Натисни **Запустити** й ✓ у будь-якому рядку. Порядок у консолі: `animation starts, renders so far: 1`, потім `finished: true, frames: …, renders so far: 1` і лише тоді `TaskList render #2`. Кількість кадрів залежить від частоти твого монітора: 60 Гц дає близько 18, 120 Гц — близько 36.
      en: |
        A task list: ✓ pushes the row to the left in 300 ms, and the `start` callback removes the task from state. `TaskList` writes each of its renders to the console, and the animation writes the number of frames.

        Press **Run** and ✓ in any row. The order in the console: `animation starts, renders so far: 1`, then `finished: true, frames: …, renders so far: 1`, and only then `TaskList render #2`. The number of frames depends on your monitor's refresh rate: 60 Hz gives about 18, 120 Hz about 36.
    tryIt:
      uk: |
        1. Заміни `Animated.timing(translateX, { toValue: -320, duration: 300, useNativeDriver: false })` на `Animated.spring(translateX, { toValue: -320, damping: 10, stiffness: 100, useNativeDriver: false })` і запусти. [[spring-animation|Пружина]] не має `duration`: рядок проскакує −320, повертається й коливається, доки не заспокоїться. Кадрів стало більше, а рендерів під час руху — так само жодного.
        2. Зміни `damping: 10` на `damping: 30`. Пружина гаситься сильніше: майже без коливань і швидше зупиняється.
      en: |
        1. Replace `Animated.timing(translateX, { toValue: -320, duration: 300, useNativeDriver: false })` with `Animated.spring(translateX, { toValue: -320, damping: 10, stiffness: 100, useNativeDriver: false })` and run. A [[spring-animation]] has no `duration`: the row overshoots −320, comes back and oscillates until it settles. There are more frames now, and still not a single render during the movement.
        2. Change `damping: 10` to `damping: 30`. The spring is damped harder: almost no oscillation, and it stops sooner.
    limits:
      uk: "Це перегляд у браузері через react-native-web: анімацію рахує JavaScript браузера, нативного драйвера немає (тому `useNativeDriver: false`), а кількість кадрів — це частота твого монітора, не телефона. Немає нативних модулів, жестів, крім миші й клавіатури, і продуктивності пристрою. Що рендериться, а що ні, тут так само, як на телефоні; плавність видно лише на пристрої."
      en: "This is a browser preview through react-native-web: the browser's JavaScript computes the animation, there is no native driver (hence `useNativeDriver: false`), and the frame count is your monitor's refresh rate, not a phone's. There are no native modules, no gestures beyond mouse and keyboard and no device performance. What renders and what does not is the same here as on a phone; smoothness is visible only on a device."

  - id: bounded
    kind: explanation
    title:
      uk: "Обмежена анімація: кінець, межа, один колбек"
      en: "A bounded animation: an end, a limit, one callback"
    body:
      uk: |
        Анімація для дії користувача має три межі.

        - **Кінцеве значення.** `toValue: -320` — рядок точно знає, де зупиниться.
        - **Коли кінець.** `timing` триває `duration` мс (без неї — 500 мс). `spring` не має тривалості: він зупиняється, коли швидкість і відстань до `toValue` стають майже нулем. Сильніший `damping` — менше коливань.
        - **Один колбек.** Колбек `start(({ finished }) => …)` викликається рівно раз. Саме там оновлюють стан: прибирають запис, позначають справу.

        Одне значення може керувати кількома властивостями. [[animated-interpolation|Інтерполяція]] переводить один діапазон в інший:

        ```js
        const scale = progress.interpolate({
          inputRange: [0, 1],
          outputRange: [1, 0.8],
          extrapolate: 'clamp', // never below 0.8 or above 1
        });
        ```

        Поки `progress` іде від 0 до 1, `scale` іде від 1 до 0.8 — синхронно, без другої анімації.
      en: |
        An animation for a user action has three bounds.

        - **An end value.** `toValue: -320` — the row knows exactly where it will stop.
        - **When it ends.** `timing` lasts `duration` ms (500 ms without it). `spring` has no duration: it stops when the speed and the distance to `toValue` become almost zero. A stronger `damping` means less oscillation.
        - **One callback.** The `start(({ finished }) => …)` callback is called exactly once. That is where state is updated: a record removed, a task marked.

        One value can drive several properties. [[animated-interpolation|Interpolation]] maps one range onto another:

        ```js
        const scale = progress.interpolate({
          inputRange: [0, 1],
          outputRange: [1, 0.8],
          extrapolate: 'clamp', // never below 0.8 or above 1
        });
        ```

        While `progress` goes from 0 to 1, `scale` goes from 1 to 0.8 — in step, without a second animation.

  - id: recall-render-commit
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: render-without-change
        from: re-01-06-render-vs-commit
        prompt:
          uk: "React повторно викликав компонент, і той повернув такий самий опис, як минулого разу. Що зміниться в DOM під час commit?"
          en: "React called a component again, and it returned the same description as last time. What changes in the DOM during the commit?"
        answer:
          type: choice
          options:
            - id: nothing
              text:
                uk: "Нічого: commit вносить лише різницю"
                en: "Nothing: the commit applies only the difference"
            - id: everything
              text:
                uk: "Усі елементи компонента створюються заново"
                en: "All of the component's elements are created anew"
              why:
                uk: "Render — це обчислення нового опису й порівняння. Commit змінює DOM лише там, де опис відрізняється."
                en: "Render is computing the new description and comparing it. The commit changes the DOM only where the description differs."
          correct: [nothing]
        explanation:
          uk: "Render і commit — різні кроки: render рахує опис, commit застосовує різницю. Анімація через `Animated` обходить обидва кроки для твого компонента: значення змінює view напряму."
          en: "Render and commit are different steps: render computes the description, commit applies the difference. An animation through `Animated` skips both steps for your component: the value changes the view directly."

  - id: fade-dismiss
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: fade-dismiss
    entry: main.jsx
    editable: [ExpenseRow.jsx]
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      remove: { uk: "Видалити", en: "Remove" }
    title:
      uk: "Витрата, що від’їжджає й згасає"
      en: "An expense that slides and fades away"
    instructions:
      uk: |
        Кнопка ✕ у `ExpenseRow.jsx` має прибирати витрату з анімацією. Допиши `dismiss()` і стиль рядка:

        - `translateX` іде від 0 до **−320** за **250 мс** (`Animated.timing`, `useNativeDriver: false` — у перегляді нативного драйвера немає);
        - прозорість (`opacity`) **виводиться з `translateX`** інтерполяцією: 1 на 0 і 0 на −320;
        - коли анімація скінчилася, викликай `onDismissed(expense.id)` **один раз** — лише тоді `main.jsx` прибере витрату зі стану.

        Перевірки натискають ✕ у різних рядках і дивляться на рядок через 100 мс, на стиль на півдорозі, на виклики `onDismissed` і на те, скільки разів виконалася функція `ExpenseRow` (`main.jsx` це рахує). `main.jsx` і `previewSetup.js` редагувати не можна.
      en: |
        The ✕ button in `ExpenseRow.jsx` should remove the expense with an animation. Finish `dismiss()` and the row's style:

        - `translateX` goes from 0 to **−320** in **250 ms** (`Animated.timing`, `useNativeDriver: false` — the preview has no native driver);
        - the opacity is **derived from `translateX`** by interpolation: 1 at 0 and 0 at −320;
        - when the animation has finished, call `onDismissed(expense.id)` **once** — only then does `main.jsx` remove the expense from state.

        The checks press ✕ in different rows and look at the row after 100 ms, at its style halfway, at the `onDismissed` calls and at how many times the `ExpenseRow` function ran (`main.jsx` counts that). `main.jsx` and `previewSetup.js` cannot be edited.
    limits:
      uk: "Перевірки працюють у перегляді react-native-web: анімацію рахує JavaScript браузера, нативного драйвера немає, а кадри йдуть із частотою монітора. Вони перевіряють стиль на півдорозі, один виклик `onDismissed` і кількість рендерів `ExpenseRow`, але не плавність на телефоні."
      en: "The checks run in the react-native-web preview: the browser's JavaScript computes the animation, there is no native driver, and frames come at the monitor's rate. They check the style halfway, one `onDismissed` call and the number of `ExpenseRow` renders, but not smoothness on a phone."
    testTitles:
      "the row stays on screen while it animates":
        uk: "Рядок лишається на екрані, поки анімується"
        en: "The row stays on screen while it animates"
      "halfway the row has moved left and is partly transparent":
        uk: "На півдорозі рядок зсунутий ліворуч і напівпрозорий"
        en: "Halfway the row has moved left and is partly transparent"
      "onDismissed is called once and removes the row":
        uk: "`onDismissed` викликається один раз і рядок зникає"
        en: "`onDismissed` is called once and the row disappears"
      "ExpenseRow does not render on every animation frame":
        uk: "`ExpenseRow` не рендериться на кожному кадрі"
        en: "`ExpenseRow` does not render on every animation frame"
    hints:
      nudge:
        uk: "Що вже є в рядку: значення `translateX`. Чого бракує: анімації, яка його змінює, другого значення для прозорості й колбека в кінці. Де стан змінюється — у `main.jsx` чи в рядку?"
        en: "What the row already has: the `translateX` value. What is missing: an animation that changes it, a second value for the opacity and a callback at the end. Where does state change — in `main.jsx` or in the row?"
      explanation:
        uk: "`Animated.timing(value, { toValue, duration, useNativeDriver: false }).start(callback)` веде значення й наприкінці викликає колбек з `{ finished }`. Прозорість не треба анімувати окремо: `value.interpolate({ inputRange: [початок, кінець], outputRange: […] })` дає нове значення, що йде слідом. Наприклад, картка, яка зменшується, коли її опускають на 200 точок униз: `const scale = drop.interpolate({ inputRange: [0, 200], outputRange: [1, 0.5] })`. Зверни увагу на порядок `inputRange`: він має зростати. І передай у `start` **функцію** — не результат виклику."
        en: "`Animated.timing(value, { toValue, duration, useNativeDriver: false }).start(callback)` drives the value and at the end calls the callback with `{ finished }`. The opacity does not need its own animation: `value.interpolate({ inputRange: [start, end], outputRange: […] })` gives a new value that follows along. For example, a card that shrinks as it is dropped 200 points down: `const scale = drop.interpolate({ inputRange: [0, 200], outputRange: [1, 0.5] })`. Mind the order of `inputRange`: it must increase. And pass a **function** to `start` — not the result of a call."
    solutionNote:
      uk: "Одне `Animated.Value` керує і зсувом, і прозорістю: `inputRange: [-320, 0]` зростає, а `outputRange: [0, 1]` дає 0 на −320. `extrapolate: 'clamp'` не дає прозорості вийти за 0…1. Колбек `start` перевіряє `finished` і викликає `onDismissed` один раз — стан змінюється тільки тоді. `Animated.spring` теж годиться: він сам зупиняється біля −320, і колбек настає один раз."
      en: "One `Animated.Value` drives both the offset and the opacity: `inputRange: [-320, 0]` increases, and `outputRange: [0, 1]` gives 0 at −320. `extrapolate: 'clamp'` keeps the opacity within 0…1. The `start` callback checks `finished` and calls `onDismissed` once — state changes only then. `Animated.spring` works too: it stops near −320 by itself, and the callback comes once."
    feedback:
      - when: { test: "the row stays on screen while it animates" }
        message:
          uk: "Ця перевірка натискає ✕ у першому рядку й очікує, що через 100 мс рядок ще на місці, а `onDismissed` ще не викликано. Якщо рядок зник одразу, `onDismissed` викликається до кінця анімації — наприклад, `start(onDismissed(id))` викликає його негайно, а `start` треба передати функцію."
          en: "This check presses ✕ in the first row and expects the row to still be there after 100 ms, with `onDismissed` not yet called. If the row disappeared at once, `onDismissed` is called before the animation ends — for example, `start(onDismissed(id))` calls it immediately, while `start` needs a function."
      - when: { test: "halfway the row has moved left and is partly transparent" }
        message:
          uk: "Ця перевірка через 110 мс після натискання очікує в стилі рядка `translateX` менший за −20 і `opacity` між 0.05 і 0.95. Чи передано в стиль `Animated.View` і `transform: [{ translateX }]`, і `opacity` з інтерполяції?"
          en: "This check expects, 110 ms after the press, a `translateX` below −20 and an `opacity` between 0.05 and 0.95 in the row's style. Are both `transform: [{ translateX }]` and the interpolated `opacity` passed to the `Animated.View` style?"
      - when: { test: "onDismissed is called once and removes the row" }
        message:
          uk: "Ця перевірка чекає до 2 с на виклик `onDismissed` з `id` витрати, а потім очікує рівно один такий виклик і зниклий рядок. Анімація сама нічого не прибирає зі стану: прибирає `onDismissed`, викликаний у колбеку `start`."
          en: "This check waits up to 2 s for an `onDismissed` call with the expense's `id`, then expects exactly one such call and the row gone. The animation itself removes nothing from state: `onDismissed`, called in the `start` callback, does."
      - when: { test: "ExpenseRow does not render on every animation frame" }
        message:
          uk: "Ця перевірка рахує, скільки разів виконалася функція `ExpenseRow` від натискання до `onDismissed`, і очікує не більше двох. Якщо рух задано через `useState` і зміну стану на кожному кадрі, рядок рендериться щокадру — використай `Animated.Value`."
          en: "This check counts how many times the `ExpenseRow` function ran from the press to `onDismissed` and expects at most two. If the movement is driven by `useState` with a state change on every frame, the row renders every frame — use an `Animated.Value`."

  - id: to-project
    kind: transfer
    capstoneStep: RN-10
    body:
      uk: "У кроці проєкту рядок після свайпу виїжджає чи згасає через `Animated`, а стан твого домену змінюється в колбеку завершення: бажання стає отриманим, справа — виконаною, звичка отримує сьогоднішню дату, витрата зникає, а підсумки (`summarizeItems`, `countDueTasks`, `summarizeHabit`, `summarizeExpenses`) рахуються вже з нового стану."
      en: "In the project step a row slides or fades out after a swipe through `Animated`, and your domain's state changes in the completion callback: a wish becomes acquired, a task done, a habit gets today's date, an expense disappears, and the summaries (`summarizeItems`, `countDueTasks`, `summarizeHabit`, `summarizeExpenses`) are computed from the new state."
