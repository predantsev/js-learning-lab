          en: "Stop the app and start **release** with the command from the table (on **P**: `--no-dev --minify`). Measure three times as in step 5 (on **A**, each time with `reset` before measuring) and record the median of the three. On **I**, UI-thread numbers may come from Xcode's Instruments (the Xcode menu → Open Developer Tool → Instruments, the Animation Hitches template) if it offers your simulator as a target — not checked in this course; otherwise write down that they were not measured."
        expect:
          uk: "Рядок починається з `PROD JS`. Розумно очікувати менше довгих кадрів, ніж у debug, але не нуль: сповільнення в `ExpenseRow` у release лишилося."
