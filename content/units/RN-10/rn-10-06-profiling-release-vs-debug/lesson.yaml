          en: "Press “Run the 10-second scroll script” and do not touch the screen for 10 seconds. Write down the result line. On **A**, right after that, collect the UI thread's frame statistics and the memory."
        command: "adb shell dumpsys gfxinfo com.example.rn10perflab\nadb shell dumpsys meminfo com.example.rn10perflab"
        expect:
          uk: "Рядок `DEV JS · 1000 rows · JS … fps · long frames … · worst … ms`. За архівним посібником Android «Testing Display Performance» вивід `gfxinfo` має `Total frames rendered` і `Janky frames` (чинна сторінка `dumpsys` описує лише саму команду й `framestats`); у `meminfo` чинна документація показує рядок `TOTAL` зі стовпчиком `Pss Total` — загальний PSS процесу. Тут нічого з цього не перевірено: запиши поля так, як їх друкує твій пристрій."
          en: "The line `DEV JS · 1000 rows · JS … fps · long frames … · worst … ms`. According to Android's archived “Testing Display Performance” guide, the `gfxinfo` output has `Total frames rendered` and `Janky frames` (the current `dumpsys` page describes only the command itself and `framestats`); for `meminfo` the current docs show a `TOTAL` row with a `Pss Total` column — the process's total PSS. None of this was checked here: write the fields down as your device prints them."
      - text:
