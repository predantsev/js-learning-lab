id: rn-10-06-profiling-release-vs-debug
unit: RN-10
title:
  uk: "Профілювання: release проти debug"
  en: "Profiling release vs debug"
kind: local-task
minutes: 20
contentVersion: 1
purpose:
  uk: "Перш ніж щось пришвидшувати, треба знати, скільки воно коштує зараз — і виміряти це там, де працюватиме користувач: у release-збірці на заявленій цілі. Тут ти збереш лабораторний список із 1 000 рядків, виміряєш його в debug і в release, запишеш базову лінію й знайдеш у коді сповільнення, яке не зникає в release."
  en: "Before speeding anything up, you need to know what it costs now — and to measure it where the user will run it: in a release build on the declared target. Here you build a lab list of 1,000 rows, measure it in debug and in release, record a baseline and find in the code a slowdown that does not go away in release."
objectives:
  - uk: "Профілювати той самий довгий синтетичний список у debug- і release-збірці на заявленій цілі й пояснити, чому зараховуються лише числа з release."
    en: "Profile the same long synthetic list in a debug build and a release build on the declared target and explain why only the release numbers count."
  - uk: "Записати базову лінію (пропущені кадри, частоту кадрів JS і UI, пам’ять) із зазначеними ціллю, режимом збірки й розміром даних."
    en: "Record a baseline (dropped frames, JS and UI frame rates, memory) with the target, build mode and dataset size stated."
prerequisites: [rn-10-05-assets-images-fonts, rn-01-03-env-versions-debug-release]
subskills:
  - { family: N-04, skill: "profiling release vs debug", depth: intro }
  - { family: N-04, skill: "measured render/memory improvements", depth: intro }
glossary: [release-profiling, perf-monitor]
selfCheck: [predict-baseline, format-on-render]

blocks:
  - id: only-release-counts
    kind: explanation
    title:
      uk: "Чому debug-числа не рахуються"
      en: "Why debug numbers do not count"
    body:
      uk: |
        У [[debug-build|debug-збірці]] твій JavaScript приходить з dev-сервера Metro, не оптимізований, і поряд з ним працюють перевірки розробника — попередження, перевірки пропсів, підготовка до швидкого оновлення. Документація React Native 0.86 каже прямо: продуктивність потоку JS у dev-режимі сильно страждає, і продуктивність треба перевіряти в [[release-build|release-збірках]].

        Тому [[release-profiling|профілювання]] має правило: **базова лінія — лише з release**, на заявленій цілі, з тим самим набором даних і тим самим сценарієм. Інакше ти лагодиш те, чого користувач ніколи не побачить, і не помічаєш того, що він побачить.

        Чим міряти:

        - [[perf-monitor|Perf Monitor]] (Dev Menu → Perf Monitor) показує частоту кадрів JS і UI, але Dev Menu є лише в debug — для release він не годиться;
        - **у release**: лічильник кадрів JS у самому застосунку (лабораторія нижче має його), на Android — `adb shell dumpsys gfxinfo` (зібрані кадри й «Janky frames» потоку UI) і `dumpsys meminfo` (пам’ять), на iOS — Instruments з Xcode.
      en: |
        In a [[debug-build]] your JavaScript comes from the Metro dev server, unoptimized, and developer checks run next to it — warnings, prop checks, preparation for fast refresh. The React Native 0.86 docs say it plainly: JavaScript thread performance suffers greatly in dev mode, and performance must be tested in [[release-build|release builds]].

        So [[release-profiling]] has a rule: **the baseline comes from release only**, on the declared target, with the same dataset and the same scenario. Otherwise you fix what the user will never see and miss what they will see.

        What to measure with:

        - the [[perf-monitor]] (Dev Menu → Perf Monitor) shows the JS and UI frame rates, but the Dev Menu exists only in debug — it does not work for release;
        - **in release**: a JS frame counter inside the app itself (the lab below has one), on Android `adb shell dumpsys gfxinfo` (rendered frames and the UI thread's “Janky frames”) and `dumpsys meminfo` (memory), on iOS Instruments from Xcode.

  - id: two-paths
    kind: visual
    visual: diagram
    title:
      uk: "Той самий список, два шляхи"
      en: "The same list, two paths"
    textEquivalent:
      uk: "Ліворуч debug-шлях, праворуч release-шлях того самого списку. У debug JavaScript приходить з dev-сервера Metro, не оптимізований, і поряд виконуються перевірки розробника (__DEV__); усе це додає роботи в кожен кадр потоку JS. У release JavaScript заздалегідь зібрано й скомпільовано в байт-код Hermes, dev-сервера й перевірок розробника немає. Код твого списку однаковий на обох шляхах, і його власна вартість, наприклад форматування в кожному рендері, лишається і в release. Тому базову лінію записують з release-шляху: там видно лише те, що справді заплатить користувач."
      en: "On the left the debug path, on the right the release path of the same list. In debug the JavaScript comes from the Metro dev server, unoptimized, and developer checks (__DEV__) run alongside; all of this adds work to every frame of the JS thread. In release the JavaScript is bundled ahead of time and compiled to Hermes bytecode, and there is no dev server and no developer checks. Your list's code is the same on both paths, and its own cost, such as formatting in every render, stays in release too. That is why the baseline is recorded from the release path: it shows only what the user really pays for."
    spec:
      layout: grid
      nodes:
        - { id: metro, label: { uk: "Metro: JS з dev-сервера", en: "Metro: JS from dev server" }, col: 0, row: 0, w: 150 }
        - { id: checks, label: { uk: "перевірки __DEV__", en: "__DEV__ checks" }, col: 0, row: 1, w: 150 }
        - { id: slowjs, label: { uk: "неоптимізований JS", en: "unoptimized JS" }, col: 0, row: 2, w: 150 }
        - { id: bytecode, label: { uk: "байт-код Hermes", en: "Hermes bytecode" }, col: 1, row: 0, w: 150 }
        - { id: listd, label: { uk: "код списку (debug)", en: "list code (debug)" }, col: 0, row: 3, w: 150 }
        - { id: listr, label: { uk: "код списку (release)", en: "list code (release)" }, col: 1, row: 3, w: 150 }
      edges:
        - { from: metro, to: checks }
        - { from: checks, to: slowjs }
        - { from: slowjs, to: listd }
        - { from: bytecode, to: listr }
      steps:
        - caption:
            uk: "Той самий список двома шляхами: ліворуч debug, праворуч release."
            en: "The same list along two paths: debug on the left, release on the right."
        - caption:
            uk: "Debug: JavaScript приходить з dev-сервера Metro, а не з застосунку."
            en: "Debug: the JavaScript comes from the Metro dev server, not from the app."
          highlight: [metro]
          dim: [bytecode, listr]
        - caption:
            uk: "Поряд виконуються перевірки розробника й неоптимізований код — зайва робота в кожному кадрі потоку JS."
            en: "Developer checks and unoptimized code run alongside — extra work in every frame of the JS thread."
          highlight: [checks, slowjs, metro->checks, checks->slowjs]
          dim: [bytecode, listr]
        - caption:
            uk: "Release: зібраний байт-код Hermes, без dev-сервера й без перевірок розробника."
            en: "Release: bundled Hermes bytecode, with no dev server and no developer checks."
          highlight: [bytecode, listr, bytecode->listr]
          dim: [metro, checks, slowjs]
        - caption:
            uk: "Код списку однаковий на обох шляхах: його власна вартість лишається й у release. Її й видно в базовій лінії з release."
            en: "The list code is the same on both paths: its own cost stays in release too. That is what the release baseline shows."
          highlight: [listd, listr]

  - id: predict-baseline
    kind: prediction
    runnable: false
    prompt:
      uk: "Лабораторний список на Android-емуляторі: у debug сценарій прокрутки дав 41 довгий кадр, у release — 9. Ти прибрав одну перевірку, яка працює лише в `__DEV__`, і debug-число впало до 30. Що записати в базову лінію й чи покращив ти застосунок для користувача?"
      en: "The lab list on an Android emulator: in debug the scroll script gave 41 long frames, in release 9. You removed one check that runs only under `__DEV__`, and the debug number fell to 30. What goes into the baseline, and did you improve the app for the user?"
    answer:
      type: choice
      options:
        - id: release-nine
          text:
            uk: "Базова лінія — 9 з release; для користувача нічого не змінилося, бо `__DEV__`-коду в release немає"
            en: "The baseline is 9 from release; nothing changed for the user, because `__DEV__` code is not in release"
        - id: debug-improved
          text:
            uk: "Базова лінія — 41, і покращення на 11 кадрів — справжнє"
            en: "The baseline is 41, and the improvement by 11 frames is real"
          why:
            uk: "Код під `if (__DEV__)` у release вирізано ще під час збирання. Користувач цих 11 кадрів ніколи й не втрачав."
            en: "Code under `if (__DEV__)` is cut out of release at build time. The user never lost those 11 frames."
        - id: average
          text:
            uk: "Середнє з обох, 25, — так чесніше"
            en: "The average of both, 25 — that is fairer"
          why:
            uk: "Середнє з двох різних збірок нічого не описує. Числа порівнюють лише в однакових умовах: та сама ціль, release, той самий сценарій."
            en: "An average of two different builds describes nothing. Numbers are compared only under the same conditions: the same target, release, the same script."
      correct: [release-nine]
    explanation:
      uk: "Рахується лише те, що бачить користувач: release на заявленій цілі. Debug-числа корисні, щоб швидко помітити проблему, але не щоб довести покращення. І кожне число записують з умовами: ціль, режим збірки, розмір даних, сценарій."
      en: "Only what the user sees counts: release on the declared target. Debug numbers are useful for spotting a problem quickly, not for proving an improvement. And every number is written down with its conditions: the target, the build mode, the dataset size, the script."

  - id: recall-measure-first
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: why-it-rendered
        from: re-07-02-profiling-render-causes
        prompt:
          uk: "Рядок вебсписку здається повільним. Що зробити першим?"
          en: "A row of a web list seems slow. What do you do first?"
        answer:
          type: choice
          options:
            - id: record
              text:
                uk: "Записати взаємодію профайлером React і подивитися, що рендерилося й чому"
                en: "Record the interaction with the React profiler and look at what rendered and why"
            - id: memo-all
              text:
                uk: "Обгорнути всі компоненти в `memo` — гірше не буде"
                en: "Wrap every component in `memo` — it cannot hurt"
              why:
                uk: "Без запису невідомо, що саме повільне. `memo` має свою ціну й не допомагає, якщо проблема в ефекті чи в commit."
                en: "Without a recording it is unknown what exactly is slow. `memo` has its own cost and does not help if the problem is in an effect or in the commit."
          correct: [record]
        explanation:
          uk: "Спершу виміряти, потім змінювати. На телефоні те саме правило має ще одну умову: вимірювати release-збірку на заявленій цілі."
          en: "Measure first, change second. On a phone the same rule has one more condition: measure a release build on the declared target."

  - id: baseline-lab
    kind: local-task
    runtime: local-native
    title:
      uk: "Базова лінія в debug і в release"
      en: "A baseline in debug and in release"
    intro:
      uk: |
        Ти створиш проєкт `rn10-perf-lab` у теці курсу, виміряєш його список на своїй заявленій цілі з RN-01 у debug і в release і запишеш результат у `PERF.md`. Потрібен інтернет (для пакетів); нових облікових записів лабораторія не потребує (для цілі P на iPhone вони вже знадобилися під час налаштування Expo Go в RN-01).

        > [!warning]
        > Команди описано за документацією **Expo SDK 57** і **React Native 0.86** (reactnative.dev, версія 0.86; docs.expo.dev, жовтень 2026). На машині, де писали урок, нативних інструментів не було: там створили проєкт, перевірили всі три файли командою `npx tsc --noEmit` (без помилок) і зібрали JavaScript командою `npx expo export --platform android`. Запуск на емуляторі, симуляторі чи телефоні, `adb` і Instruments **не виконувалися** — тому тут немає прикладів їхнього виводу. Записуй те, що бачиш у себе.

        Якщо в тебе немає працездатної нативної цілі, познач завдання як **невиконане** й переходь далі: вправу в перегляді нижче можна зробити й без неї, а наступні уроки від цього завдання не залежать.

        **Цілі й команди збирання:**

        | Ціль | debug | release |
        |---|---|---|
        | **A** — Android-емулятор | `npx expo run:android` | `npx expo run:android --variant release` |
        | **I** — iOS-симулятор (macOS) | `npx expo run:ios` | `npx expo run:ios --configuration Release` |
        | **P** — телефон з Expo Go | `npx expo start` | release-збірки немає: `npx expo start --no-dev --minify` |

        `run:android` і `run:ios` компілюють нативний застосунок і потребують Android Studio чи Xcode. Expo Go release-збірки не має: `--no-dev --minify` дає **production-JavaScript в Expo Go** — ближче до release, але не release. Так і запиши в `PERF.md`.

        **Крок 3 — `expenses.ts`:**

        ```ts
        // expenses.ts: 1,000 synthetic expenses, generated the same way on every run.
        export type Expense = { id: string; label: string; amountMinor: number; date: string; category: string };

        const LABELS = ['Продукти', 'Проїзний', 'Кава', 'Лампочки', 'Кіно', 'Обід'];
        const CATEGORIES = ['food', 'transport', 'fun', 'home', 'fun', 'food'];

        export const expenses: Expense[] = Array.from({ length: 1000 }, (_, i) => ({
          id: `e-${String(i + 1).padStart(4, '0')}`,
          label: `${LABELS[i % LABELS.length]} #${i + 1}`,
          amountMinor: 500 + ((i * 7919) % 90000),
          date: `2026-0${1 + (i % 3)}-${String(1 + (i % 28)).padStart(2, '0')}`,
          category: CATEGORIES[i % CATEGORIES.length],
        }));
        ```

        **Крок 3 — `perfTools.ts`:**

        ```ts
        // perfTools.ts: a JS frame meter and a fixed scroll script, so that every run measures the same thing.
        import type { FlatList } from 'react-native';

        export type FrameReport = { seconds: number; jsFps: number; longFrames: number; worstMs: number };

        // Counts requestAnimationFrame callbacks on the JS thread for `durationMs`. A gap longer than 1.5 frames
        // of a 60 Hz screen (25 ms) means the JS thread missed at least one frame: that is a "long frame".
        export function measureJsFrames(durationMs: number): Promise<FrameReport> {
          return new Promise((resolve) => {
            const start = performance.now();
            let last = start;
            let frames = 0;
            let longFrames = 0;
            let worstMs = 0;
            function tick(now: number) {
              const gap = now - last;
              last = now;
              frames += 1;
              if (gap > 25) longFrames += 1;
              worstMs = Math.max(worstMs, gap);
              if (now - start < durationMs) {
                requestAnimationFrame(tick);
              } else {
                const seconds = (now - start) / 1000;
                resolve({ seconds: Math.round(seconds * 10) / 10, jsFps: Math.round(frames / seconds), longFrames, worstMs: Math.round(worstMs) });
              }
            }
            requestAnimationFrame(tick);
          });
        }

        // Scrolls the list down by 600 points every 500 ms, 20 times: 10 seconds, the same on every run.
        export async function runScrollScript<T>(list: FlatList<T> | null): Promise<void> {
          for (let step = 1; step <= 20; step += 1) {
            list?.scrollToOffset({ offset: step * 600, animated: true });
            await new Promise((resolve) => setTimeout(resolve, 500));
          }
        }
        ```

        **Крок 3 — `App.tsx` (заміни весь файл; копіюй точно, зі сповільненням):**

        ```tsx
        // App.tsx: RN-10 profiling lab — a list of 1,000 synthetic expenses with a fixed scroll script.
        // Seeded slowdown: every row builds new formatters and formats on every render.
        import { useRef, useState } from 'react';
        import { FlatList, Pressable, StyleSheet, Text, View } from 'react-native';
        import { expenses, type Expense } from './expenses';
        import { measureJsFrames, runScrollScript, type FrameReport } from './perfTools';

        function ExpenseRow({ expense }: { expense: Expense }) {
          const money = new Intl.NumberFormat('uk-UA', { style: 'currency', currency: 'UAH' });
          const day = new Intl.DateTimeFormat('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' });
          return (
            <View style={styles.row} accessible accessibilityLabel={`${expense.label}, ${money.format(expense.amountMinor / 100)}`}>
              <Text style={styles.label}>{expense.label}</Text>
              <Text>{money.format(expense.amountMinor / 100)}</Text>
              <Text style={styles.date}>{day.format(new Date(`${expense.date}T00:00:00`))}</Text>
            </View>
          );
        }

        export default function App() {
          const listRef = useRef<FlatList<Expense>>(null);
          const [report, setReport] = useState<FrameReport | null>(null);
          const [running, setRunning] = useState(false);

          async function measure() {
            setRunning(true);
            listRef.current?.scrollToOffset({ offset: 0, animated: false });
            const [result] = await Promise.all([measureJsFrames(10000), runScrollScript(listRef.current)]);
            setReport(result);
            setRunning(false);
          }

          return (
            <View style={styles.screen}>
              <Pressable accessibilityRole="button" disabled={running} onPress={measure} style={styles.button}>
                <Text style={styles.buttonText}>{running ? 'Вимірюю… (10 с)' : 'Запустити 10-секундну прокрутку'}</Text>
              </Pressable>
              <Text accessibilityLiveRegion="polite" style={styles.report}>
                {report
                  ? `${__DEV__ ? 'DEV JS' : 'PROD JS'} · ${expenses.length} rows · JS ${report.jsFps} fps · long frames ${report.longFrames} · worst ${report.worstMs} ms`
                  : `${__DEV__ ? 'DEV JS' : 'PROD JS'} · ${expenses.length} rows · вимірювань ще немає`}
              </Text>
              <FlatList ref={listRef} data={expenses} keyExtractor={(item) => item.id} renderItem={({ item }) => <ExpenseRow expense={item} />} />
            </View>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, paddingTop: 56, backgroundColor: '#ffffff' },
          button: { minHeight: 48, marginHorizontal: 16, justifyContent: 'center', alignItems: 'center', backgroundColor: '#1d4ed8', borderRadius: 6 },
          buttonText: { color: '#ffffff', fontWeight: '600' },
          report: { margin: 16, fontSize: 14 },
          row: { paddingHorizontal: 16, paddingVertical: 10, borderBottomWidth: 1, borderColor: '#e5e7eb' },
          label: { fontSize: 16, fontWeight: '600' },
          date: { color: '#4b5563' },
        });
        ```

        **Крок 8 — `PERF.md` (зразок; числа — твої):**

        ```text
        # RN-10 baseline
        Target: Android emulator, Pixel 9, Android 16
        Dataset: 1,000 rows, the 10-second scroll script, started at the top
        | Build   | JS fps | Long frames | Worst ms | Janky frames (gfxinfo) | Memory (meminfo TOTAL, PSS) |
        | debug   | …      | …           | …        | …                      | …                  |
        | release | …      | …           | …        | …                      | …                  |
        Not measured: UI frames on iOS (no Instruments run)
        ```
      en: |
        You will create the project `rn10-perf-lab` in your course folder, measure its list on your declared target from RN-01 in debug and in release, and write the result into `PERF.md`. Internet access is needed (for the packages); the lab needs no new accounts (for target P on an iPhone they were already needed to set up Expo Go in RN-01).

        > [!warning]
        > The commands are described from the documentation of **Expo SDK 57** and **React Native 0.86** (reactnative.dev, version 0.86; docs.expo.dev, October 2026). The machine this lesson was written on had no native tooling: there the project was created, all three files were checked with `npx tsc --noEmit` (no errors) and the JavaScript was bundled with `npx expo export --platform android`. Running on an emulator, a simulator or a phone, `adb` and Instruments were **not run** — that is why there is no sample of their output here. Write down what you see on your machine.

        If you have no working native target, mark this task **not performed** and move on: the preview exercise below can be done without one, and the next lessons do not depend on this task.

        **Targets and build commands:**

        | Target | debug | release |
        |---|---|---|
        | **A** — Android emulator | `npx expo run:android` | `npx expo run:android --variant release` |
        | **I** — iOS simulator (macOS) | `npx expo run:ios` | `npx expo run:ios --configuration Release` |
        | **P** — phone with Expo Go | `npx expo start` | no release build: `npx expo start --no-dev --minify` |

        `run:android` and `run:ios` compile the native app and need Android Studio or Xcode. Expo Go has no release build: `--no-dev --minify` gives **production JavaScript in Expo Go** — closer to release, but not release. Write it down exactly so in `PERF.md`.

        **Step 3 — `expenses.ts`:**

        ```ts
        // expenses.ts: 1,000 synthetic expenses, generated the same way on every run.
        export type Expense = { id: string; label: string; amountMinor: number; date: string; category: string };

        const LABELS = ['Groceries', 'Transit pass', 'Coffee', 'Light bulbs', 'Cinema', 'Lunch'];
        const CATEGORIES = ['food', 'transport', 'fun', 'home', 'fun', 'food'];

        export const expenses: Expense[] = Array.from({ length: 1000 }, (_, i) => ({
          id: `e-${String(i + 1).padStart(4, '0')}`,
          label: `${LABELS[i % LABELS.length]} #${i + 1}`,
          amountMinor: 500 + ((i * 7919) % 90000),
          date: `2026-0${1 + (i % 3)}-${String(1 + (i % 28)).padStart(2, '0')}`,
          category: CATEGORIES[i % CATEGORIES.length],
        }));
        ```

        **Step 3 — `perfTools.ts`:**

        ```ts
        // perfTools.ts: a JS frame meter and a fixed scroll script, so that every run measures the same thing.
        import type { FlatList } from 'react-native';

        export type FrameReport = { seconds: number; jsFps: number; longFrames: number; worstMs: number };

        // Counts requestAnimationFrame callbacks on the JS thread for `durationMs`. A gap longer than 1.5 frames
        // of a 60 Hz screen (25 ms) means the JS thread missed at least one frame: that is a "long frame".
        export function measureJsFrames(durationMs: number): Promise<FrameReport> {
          return new Promise((resolve) => {
            const start = performance.now();
            let last = start;
            let frames = 0;
            let longFrames = 0;
            let worstMs = 0;
            function tick(now: number) {
              const gap = now - last;
              last = now;
              frames += 1;
              if (gap > 25) longFrames += 1;
              worstMs = Math.max(worstMs, gap);
              if (now - start < durationMs) {
                requestAnimationFrame(tick);
              } else {
                const seconds = (now - start) / 1000;
                resolve({ seconds: Math.round(seconds * 10) / 10, jsFps: Math.round(frames / seconds), longFrames, worstMs: Math.round(worstMs) });
              }
            }
            requestAnimationFrame(tick);
          });
        }

        // Scrolls the list down by 600 points every 500 ms, 20 times: 10 seconds, the same on every run.
        export async function runScrollScript<T>(list: FlatList<T> | null): Promise<void> {
          for (let step = 1; step <= 20; step += 1) {
            list?.scrollToOffset({ offset: step * 600, animated: true });
            await new Promise((resolve) => setTimeout(resolve, 500));
          }
        }
        ```

        **Step 3 — `App.tsx` (replace the whole file; copy it exactly, with the slowdown):**

        ```tsx
        // App.tsx: RN-10 profiling lab — a list of 1,000 synthetic expenses with a fixed scroll script.
        // Seeded slowdown: every row builds new formatters and formats on every render.
        import { useRef, useState } from 'react';
        import { FlatList, Pressable, StyleSheet, Text, View } from 'react-native';
        import { expenses, type Expense } from './expenses';
        import { measureJsFrames, runScrollScript, type FrameReport } from './perfTools';

        function ExpenseRow({ expense }: { expense: Expense }) {
          const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'UAH' });
          const day = new Intl.DateTimeFormat('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
          return (
            <View style={styles.row} accessible accessibilityLabel={`${expense.label}, ${money.format(expense.amountMinor / 100)}`}>
              <Text style={styles.label}>{expense.label}</Text>
              <Text>{money.format(expense.amountMinor / 100)}</Text>
              <Text style={styles.date}>{day.format(new Date(`${expense.date}T00:00:00`))}</Text>
            </View>
          );
        }

        export default function App() {
          const listRef = useRef<FlatList<Expense>>(null);
          const [report, setReport] = useState<FrameReport | null>(null);
          const [running, setRunning] = useState(false);

          async function measure() {
            setRunning(true);
            listRef.current?.scrollToOffset({ offset: 0, animated: false });
            const [result] = await Promise.all([measureJsFrames(10000), runScrollScript(listRef.current)]);
            setReport(result);
            setRunning(false);
          }

          return (
            <View style={styles.screen}>
              <Pressable accessibilityRole="button" disabled={running} onPress={measure} style={styles.button}>
                <Text style={styles.buttonText}>{running ? 'Measuring… (10 s)' : 'Run the 10-second scroll script'}</Text>
              </Pressable>
              <Text accessibilityLiveRegion="polite" style={styles.report}>
                {report
                  ? `${__DEV__ ? 'DEV JS' : 'PROD JS'} · ${expenses.length} rows · JS ${report.jsFps} fps · long frames ${report.longFrames} · worst ${report.worstMs} ms`
                  : `${__DEV__ ? 'DEV JS' : 'PROD JS'} · ${expenses.length} rows · no measurement yet`}
              </Text>
              <FlatList ref={listRef} data={expenses} keyExtractor={(item) => item.id} renderItem={({ item }) => <ExpenseRow expense={item} />} />
            </View>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, paddingTop: 56, backgroundColor: '#ffffff' },
          button: { minHeight: 48, marginHorizontal: 16, justifyContent: 'center', alignItems: 'center', backgroundColor: '#1d4ed8', borderRadius: 6 },
          buttonText: { color: '#ffffff', fontWeight: '600' },
          report: { margin: 16, fontSize: 14 },
          row: { paddingHorizontal: 16, paddingVertical: 10, borderBottomWidth: 1, borderColor: '#e5e7eb' },
          label: { fontSize: 16, fontWeight: '600' },
          date: { color: '#4b5563' },
        });
        ```

        **Step 8 — `PERF.md` (a sample; the numbers are yours):**

