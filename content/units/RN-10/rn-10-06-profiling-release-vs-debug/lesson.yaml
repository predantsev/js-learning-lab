        Target: Android emulator, Pixel 9, Android 16
        Dataset: 1,000 rows, the 10-second scroll script, started at the top
        | Build   | JS fps | Long frames | Worst ms | Janky frames (gfxinfo) | Memory (meminfo TOTAL, PSS) |
        | debug   | …      | …           | …        | …                      | …                  |
        | release | …      | …           | …        | …                      | …                  |
        Not measured: UI frames on iOS (no Instruments run)
        ```
