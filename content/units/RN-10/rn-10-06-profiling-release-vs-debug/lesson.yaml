  - id: format-on-render
    kind: exercise
    mode: debug
    runtime: concept-preview
    dir: format-on-render
    entry: main.jsx
    editable: [ExpenseList.jsx]
    strings:
      groceries: { uk: "Продукти", en: "Groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава", en: "Coffee" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      cinema: { uk: "Кіно", en: "Cinema" }
      lunch: { uk: "Обід", en: "Lunch" }
      reverse: { uk: "Змінити порядок", en: "Reverse the order" }
      created: { uk: "Створено форматерів", en: "Formatters built" }
      locale: { uk: "uk-UA", en: "en-US" }
    title:
      uk: "Сповільнення, що лишається в release"
      en: "A slowdown that stays in release"
    instructions:
      uk: |
        Це той самий список, що в лабораторії, лише на 200 рядків: кожен рядок на **кожному** рендері будує два нові форматери (`Intl.NumberFormat` для суми й `Intl.DateTimeFormat` для дати). Це не перевірка розробника — це код самого списку, тож release-збірка платить за нього так само.

        1. **Відтвори**: натисни кілька разів «Змінити порядок» і подивись на «Створено форматерів».
        2. **Полагодь** `ExpenseList.jsx` так, щоб увесь список будував **не більше двох** форматерів, а суми й дати виглядали так само.

        Перевірки рахують створені форматери через `format.js` (його й `main.jsx` редагувати не можна) після трьох змін порядку й дивляться на текст рядків.
      en: |
        This is the same list as in the lab, only 200 rows long: every row builds two new formatters (`Intl.NumberFormat` for the amount and `Intl.DateTimeFormat` for the date) on **every** render. This is not a developer check — it is the list's own code, so a release build pays for it just the same.

        1. **Reproduce** it: press “Reverse the order” a few times and look at “Formatters built”.
        2. **Repair** `ExpenseList.jsx` so that the whole list builds **at most two** formatters, while the amounts and dates look the same.

        The checks count the built formatters through `format.js` (it and `main.jsx` cannot be edited) after three reorders and look at the rows' text.
    limits:
      uk: "Перевірки в перегляді react-native-web рахують створені форматери — це кількість роботи, а не час. Скільки кадрів це коштує на телефоні, видно лише в release-профілі на пристрої, як у лабораторії вище."
      en: "The checks in the react-native-web preview count the built formatters — that is an amount of work, not time. How many frames it costs on a phone is visible only in a release profile on a device, as in the lab above."
    testTitles:
      "rows show formatted amounts and dates":
        uk: "Рядки показують відформатовані суми й дати"
        en: "Rows show formatted amounts and dates"
      "the whole list builds at most two formatters, even after reordering":
        uk: "Увесь список будує не більше двох форматерів, навіть після зміни порядку"
        en: "The whole list builds at most two formatters, even after reordering"
      "after reordering every row still shows its own amount":
        uk: "Після зміни порядку кожен рядок показує свою суму"
        en: "After reordering every row still shows its own amount"
    hints:
      nudge:
        uk: "Чи залежить форматер від конкретної витрати? Від чого він залежить насправді — і скільки разів його треба створити на весь список?"
        en: "Does a formatter depend on a particular expense? What does it really depend on — and how many times must it be built for the whole list?"
      explanation:
        uk: "Форматер залежить лише від мови, а не від рядка. Створи його раз — на рівні модуля або в компоненті списку через `useMemo` з мовою в залежностях — і передай рядкам готовий. `useMemo` у кожному рядку не допоможе: у кожного змонтованого рядка своя пам’ять. Схоже: регулярний вираз для перевірки пошти створюють раз поза функцією, а не при кожному виклику."
        en: "A formatter depends only on the language, not on the row. Build it once — at module level or in the list component through `useMemo` with the language in the dependencies — and pass the ready one to the rows. `useMemo` in every row does not help: every mounted row has its own memory. Similar: an email-checking regular expression is built once outside the function, not on every call."
    solutionNote:
      uk: "Два форматери на весь список, створені в `useMemo` з `[locale]`: рядки лише викликають `format`. Кеш на рівні модуля працює так само. Прибрати форматування — не виправлення: користувач побачить копійки й ISO-дати. У лабораторії це саме сповільнення ти прибереш і виміряєш у release в наступному уроці."
      en: "Two formatters for the whole list, built in `useMemo` with `[locale]`: the rows only call `format`. A module-level cache works the same way. Removing the formatting is not a fix: the user would see minor units and ISO dates. In the lab you will remove this same slowdown and measure it in release in the next lesson."
    feedback:
      - when: { test: "rows show formatted amounts and dates" }
        message:
          uk: "Ця перевірка очікує в перших трьох рядках суму, відформатовану як валюта UAH, і дату з назвою місяця — так, як їх форматує `format.js` для мови уроку."
          en: "This check expects, in the first three rows, the amount formatted as UAH currency and the date with the month's name — the way `format.js` formats them for the lesson's language."
      - when: { test: "the whole list builds at most two formatters, even after reordering" }
        message:
          uk: "Ця перевірка тричі змінює порядок і очікує, що з початку програми `createMoneyFormat` і `createDayFormat` разом викликано не більше двох разів. Форматер у рядку чи `useMemo` в рядку створюються для кожного змонтованого рядка."
          en: "This check reorders three times and expects `createMoneyFormat` and `createDayFormat` together to have been called at most twice since the program started. A formatter in a row, or `useMemo` in a row, is built for every mounted row."
      - when: { test: "after reordering every row still shows its own amount" }
        message:
          uk: "Ця перевірка після непарної кількості змін порядку очікує, що рядок останньої витрати показує її власну відформатовану суму."
          en: "After an odd number of reorders this check expects the row of the last expense to show its own formatted amount."

  - id: to-project
    kind: transfer
    capstoneStep: RN-10
    body:
      uk: "У кроці проєкту ти так само запишеш базову лінію довгого синтетичного списку свого домену — у release, на заявленій цілі, з розміром даних і сценарієм — перш ніж щось виправляти."
      en: "In the project step you will record a baseline of a long synthetic list of your domain the same way — in release, on the declared target, with the dataset size and the script — before fixing anything."
