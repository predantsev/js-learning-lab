          en: "Three dependencies appeared in `package.json` (in our check `~2.32.0`, `4.5.1`, `0.10.1`)."
      - text:
          uk: "Заміни `App.tsx` файлом з кроку 2 вступу, перевір типи й зафіксуй засіяний стан."
          en: "Replace `App.tsx` with the step 2 file from the intro, check the types and commit the seeded state."
        command: "npx tsc --noEmit\ngit add -A\ngit commit -m \"RN-10 swipe lab: seeded defects\""
        expect:
          uk: "`npx tsc --noEmit` нічого не друкує; commit створено."
          en: "`npx tsc --noEmit` prints nothing; the commit is created."
      - text:
          uk: "Збери й запусти **release** своєї цілі (таблиця з попереднього уроку; на P — `--no-dev --minify`). Нові нативні бібліотеки потребують нової збірки: старий застосунок їх не має. Відтвори: відкрий свайпом третій рядок, видали свайпом перший і запиши, який рядок тепер відкритий."
          en: "Build and start the **release** of your target (the table from the previous lesson; on P `--no-dev --minify`). New native libraries need a new build: the old app does not have them. Reproduce: open the third row with a swipe, delete the first one with a swipe and write down which row is open now."
        expect:
          uk: "Відкритим стає не той рядок, що ти відкривав, а наступний — як у перегляді."
          en: "The open row is not the one you opened but the next one — as in the preview."
      - text:
          uk: "Виміряй «до»: тричі натисни «Запустити 10-секундну прокрутку», потім тричі «Виміряти 10 с, поки я свайпаю», щоразу 10 секунд повільно тягаючи рядки вліво-вправо. На **A** перед кожним вимірюванням виконай `reset`, після — збери `gfxinfo`. Запиши медіани."
          en: "Measure “before”: press “Run the 10-second scroll script” three times, then “Measure 10 s while I swipe” three times, each time slowly dragging rows left and right for 10 seconds. On **A**, run `reset` before each measurement and collect `gfxinfo` after. Write down the medians."
        command: "adb shell dumpsys gfxinfo com.example.rn10perflab reset\nadb shell dumpsys gfxinfo com.example.rn10perflab"
        expect:
          uk: "Рядки `PROD JS · 1000 rows · JS … fps · long frames …`. Розумно очікувати під час свайпу помітно більше довгих кадрів, ніж під час самої прокрутки (тут не виміряно)."
          en: "Lines `PROD JS · 1000 rows · JS … fps · long frames …`. It is reasonable to expect noticeably more long frames while swiping than during scrolling alone (not measured here)."
      - text:
          uk: "Полагодь обидві причини так само, як у вправі, — по одній. Після кожної правки збери release наново й повтори вимірювання з кроку 4. Перевір руками: відкритий рядок переживає видалення рядка над ним, підписи доступності правильні, а «Видалити» й дія доступності працюють без жесту."
          en: "Repair both causes the same way as in the exercise — one at a time. After each change rebuild release and repeat the measurement from step 4. Check by hand: an opened row survives a delete above it, the accessibility labels are right, and “Delete” and the accessibility action work without a gesture."
        command: "git diff -- App.tsx"
        expect:
          uk: "`git diff` показує лише твої правки двох причин, без інших змін."
          en: "`git diff` shows only your changes for the two causes, with no other changes."
      - text:
          uk: "Допиши в `PERF.md` таблицю «до → після» за зразком з кроку 6 вступу, з тим, що виправлено, перевірено й не виміряно. Зафіксуй."
          en: "Add the “before → after” table to `PERF.md` following the sample in step 6 of the intro, with what was fixed, checked and not measured. Commit."
        command: "git add -A\ngit commit -m \"Fix list identity and per-update totals; record before/after\""
        expect:
          uk: "Commit створено; у `PERF.md` дві таблиці — базова лінія й «до → після»."
          en: "The commit is created; `PERF.md` has two tables — the baseline and “before → after”."
