          en: "I reproduced both defects on my declared target in release: stutter while swiping and the “wrong” open row after a delete."
      - id: measured-both
        text:
          uk: "У `PERF.md` є вимірювання release до й після для прокрутки й свайпу на тій самій цілі."
          en: "`PERF.md` has release measurements before and after for scrolling and swiping on the same target."
      - id: nothing-broke
        text:
          uk: "Після виправлення відкритий рядок переживає видалення над ним, підписи доступності правильні, а видалення без жесту працює."
          en: "After the repair an opened row survives a delete above it, the accessibility labels are right, and deleting without a gesture works."
    troubleshooting:
      - problem:
          uk: "Застосунок падає на старті після `npx expo install` з повідомленням про відсутній нативний модуль (наприклад, worklets чи RNGestureHandler)"
          en: "The app crashes on launch after `npx expo install` with a message about a missing native module (for example worklets or RNGestureHandler)"
        fix:
          uk: "Ти запустив стару збірку без нових нативних бібліотек. Збери наново командою `run:android` / `run:ios`; для Expo Go перевір, що версія Expo Go відповідає SDK 57 (на iPhone це власна збірка Expo Go через TestFlight, як у RN-01)."
          en: "You started an old build without the new native libraries. Rebuild with `run:android` / `run:ios`; for Expo Go check that the Expo Go version matches SDK 57 (on an iPhone that is your own Expo Go build through TestFlight, as in RN-01)."
      - problem:
          uk: "Свайп не працює зовсім, рядок не рухається"
          en: "The swipe does not work at all, the row does not move"
        fix:
          uk: "Жести працюють лише всередині `GestureHandlerRootView`: перевір, що весь екран загорнуто в нього, як у файлі з кроку 2."
          en: "Gestures work only inside a `GestureHandlerRootView`: check that the whole screen is wrapped in it, as in the step 2 file."
      - problem:
          uk: "Після правки числа майже не змінилися"
          en: "After the change the numbers barely moved"
        fix:
          uk: "Перевір, що вимірюєш release (рядок починається з `PROD JS`) і що збірку зроблено після правки. Якщо так, запиши чесно «не покращилося» і шукай наступну причину за тим самим рецептом — це теж результат."
          en: "Check that you measure release (the line starts with `PROD JS`) and that the build was made after the change. If so, write down honestly “no improvement” and look for the next cause with the same recipe — that is a result too."
    recovery:
      uk: "Усе зафіксовано в git: `git restore App.tsx` повертає засіяний файл, `git log` показує кроки. Бібліотеки можна прибрати командою `npm uninstall` з їхніми назвами, але наступний урок теж їх використовує."
      en: "Everything is committed in git: `git restore App.tsx` brings back the seeded file, `git log` shows the steps. The libraries can be removed with `npm uninstall` and their names, but the next lesson uses them too."

