id: rn-10-08-independent-dismissible
unit: RN-10
title:
  uk: "Самостійно: закриття свайпом, підтверджене вимірюванням"
  en: "Independent: dismissible interaction, measured"
kind: assessment
minutes: 35
contentVersion: 1
purpose:
  uk: "Перевірка розділу без підказок: ти сам збираєш рядок, що закривається свайпом чи дією доступності, з обмеженою анімацією, яку можна перервати, з варіантом для зменшеного руху й зображеннями потрібного розміру — спершу в перегляді з перевірками, потім на заявленій цілі, де доводиш одне покращення числами release."
  en: "The unit's check without hints: you build on your own a row that dismisses by swipe or by an accessibility action, with a bounded, interruptible animation, a reduced-motion path and correctly sized images — first in the preview with checks, then on the declared target, where you prove one improvement with release numbers."
objectives:
  - uk: "Без підказок і на заявленій цілі реалізувати рядок, що закривається свайпом, з обмеженою анімацією, яку можна перервати, варіантом для зменшеного руху, доступною альтернативою без жесту й зображеннями та шрифтами потрібного розміру."
    en: "Implement, without hints and on the declared target, a dismissible row with a bounded, interruptible animation, a reduced-motion path, an accessible non-gesture alternative and correctly sized images and fonts."
  - uk: "Показати одне виміряне покращення в release з числами до й після й назвати, що не виміряно."
    en: "Show one measured release-mode improvement with before/after numbers and state what was not measured."
prerequisites: [rn-10-07-debug-dropped-frames]
subskills:
  - { family: N-08, skill: "gesture/touch coordination", depth: assess }
  - { family: N-08, skill: "animation fundamentals", depth: assess }
  - { family: N-08, skill: "cancellation/lifecycle", depth: assess }
  - { family: N-08, skill: "reduced motion", depth: assess }
  - { family: N-08, skill: "asset/image sizing and font/loading", depth: assess }
  - { family: N-04, skill: "images/assets", depth: assess }
  - { family: N-04, skill: "measured render/memory improvements", depth: assess }
glossary: []
selfCheck: [dismissible-messages]

blocks:
  - id: what-is-checked
    kind: explanation
    title:
      uk: "Що перевіряють"
      en: "What is checked"
    body:
      uk: |
        Дві частини, обидві без підказок.

        **У перегляді** — вхідні повідомлення: свайп і дія доступності закривають рядок, анімація обмежена й переривається, коли користувач іде з екрана, при зменшеному русі рядок лише згасає, аватари мають розмір під екран. Свайпи, налаштування ОС і «піти з екрана» симульовано, як в уроках розділу; перевірки дивляться на поведінку.

        **На заявленій цілі** — те саме з `react-native-gesture-handler` і `react-native-reanimated`, власний шрифт, одна виміряна правка в release і застряглий жест, який треба полагодити. Це підтверджуєш ти сам; немає цілі — позначаєш як невиконане.

        Перш ніж починати, пригадай, що зустрічалося в розділі: поріг і напрямок жесту, колбек `start` з `finished`, cleanup, підписка на `reduceMotionChanged`, розмір у точках × щільність.
      en: |
        Two parts, both without hints.

        **In the preview** — an inbox: a swipe and an accessibility action dismiss a row, the animation is bounded and is interrupted when the user leaves the screen, under reduced motion the row only fades, the avatars are sized for the screen. Swipes, the OS setting and “leave the screen” are simulated as in the unit's lessons; the checks look at behavior.

        **On the declared target** — the same with `react-native-gesture-handler` and `react-native-reanimated`, a custom font, one measured change in release and a stuck gesture to repair. You confirm this yourself; no target — you mark it not performed.

        Before you start, recall what the unit covered: the gesture's threshold and direction, the `start` callback with `finished`, cleanup, the `reduceMotionChanged` subscription, size in points × pixel ratio.

  - id: recall-keep-operable
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: optimization-keeps-a11y
        from: re-07-07-independent-measured-optimization
        prompt:
          uk: "Оптимізація прибрала зайві рендери списку й дала кращі числа, але кнопки рядків більше не досяжні з клавіатури. Чи можна вважати її готовою?"
          en: "An optimization removed extra list renders and gave better numbers, but the rows' buttons are no longer reachable from the keyboard. Can it be considered done?"
        answer:
          type: choice
          options:
            - id: no
              text:
                uk: "Ні: покращення зараховується, лише якщо робота з клавіатури й читачем екрана лишилася"
                en: "No: an improvement counts only if keyboard and screen-reader use still works"
            - id: yes
              text:
                uk: "Так: числа кращі, а доступність можна полагодити потім"
                en: "Yes: the numbers are better, and accessibility can be fixed later"
              why:
                uk: "Швидший застосунок, яким частина людей не може користуватися, — регрес, а не покращення. Перевірку доступності роблять разом із вимірюванням."
                en: "A faster app that some people cannot use is a regression, not an improvement. The accessibility check is done together with the measurement."
          correct: [no]
        explanation:
          uk: "Те саме правило в цьому завданні: після кожної правки перевір дію доступності, підписи й роботу без жесту."
          en: "The same rule applies in this task: after every change check the accessibility action, the labels and use without a gesture."

  - id: dismissible-messages
    kind: exercise
    mode: independent
    assessment: true
    runtime: concept-preview
    dir: dismissible-messages
    entry: main.jsx
    editable: [MessageList.jsx]
    strings:
      anna: { uk: "Анна", en: "Anna" }
      bohdan: { uk: "Богдан", en: "Bohdan" }
      olena: { uk: "Олена", en: "Olena" }
      taras: { uk: "Тарас", en: "Taras" }
      iryna: { uk: "Ірина", en: "Iryna" }
      mykola: { uk: "Микола", en: "Mykola" }
      m1: { uk: "Завтра о 10:00 біля бібліотеки?", en: "Tomorrow at 10:00 by the library?" }
      m2: { uk: "Квитки на концерт уже в мене.", en: "I have the concert tickets." }
      m3: { uk: "Нагадую про внесок за проїзний.", en: "A reminder about the transit pass share." }
      m4: { uk: "Фото з прогулянки надіслав.", en: "Sent the photos from the walk." }
      m5: { uk: "Купиш лампочки дорогою?", en: "Can you buy light bulbs on the way?" }
      m6: { uk: "Дякую за книжку про JavaScript!", en: "Thanks for the JavaScript book!" }
      swipeFirst: { uk: "Свайп: закрити перше", en: "Swipe: dismiss the first one" }
      reduce: { uk: "ОС: зменшити рух", en: "OS: reduce motion" }
      on: { uk: "увімкнено", en: "on" }
      off: { uk: "вимкнено", en: "off" }
      leave: { uk: "Піти з екрана", en: "Leave the screen" }
      back: { uk: "Повернутися", en: "Go back" }
      otherScreen: { uk: "Інший екран", en: "Another screen" }
      dismiss: { uk: "Закрити повідомлення", en: "Dismiss message" }
    title:
      uk: "Вхідні, що закриваються свайпом"
      en: "An inbox that dismisses by swipe"
    instructions:
      uk: |
        Зроби рядки `MessageList.jsx` такими, що закриваються. `main.jsx` передає `messages`, `pixelRatio` (3) і `onDismissed(id)`, який прибирає повідомлення зі списку.

        - **Свайп.** Кожен рядок реєструє обробники жесту через `useSimulatedPan(message.id, { onUpdate, onEnd })` з `swipeSim.js`; події мають `translationX`. Відпущений на **−120 або далі** рядок закривається; ближчий — повертається на 0 і не закривається.
        - **Анімація.** Закриття — обмежена анімація `Animated` (не довша за 400 мс): рядок їде далі ліворуч і згасає, а `onDismissed(message.id)` викликається **один раз**, коли анімація дійшла до кінця, — і лише тоді.
        - **Переривання.** Якщо рядок демонтується посеред закриття (кнопка «Піти з екрана»), `onDismissed` для нього не викликається.
        - **Зменшений рух.** Читай і відстежуй налаштування через `SimulatedAccessibilityInfo` з `motionSettings.js`. Коли воно ввімкнене, закриття — лише згасання, без руху вбік; кінцевий стан той самий.
        - **Без жесту.** Експортуй `dismissActionProps(label, onDismiss)`, що повертає `accessibilityActions: [{ name: 'dismiss', label }]` і `onAccessibilityAction`, який викликає `onDismiss()` лише для дії `'dismiss'`, і розгорни ці пропси на рядку.
        - **Аватар.** Покажи `message.avatar` (квадрати, від найменшого) в `Image` з `testID={`avatar-${message.id}`}` розміром 40 × 40 точок, обравши найменший варіант, що покриває 40 точок при `pixelRatio`.

        `testID={`row-${message.id}`}` на рядку лишається. Перевірки симулюють свайпи, вмикають налаштування, натискають «Піти з екрана» й «Повернутися», викликають `dismissActionProps` і дію доступності самого рядка та вимірюють аватари. Інші файли редагувати не можна.
      en: |
        Make the rows of `MessageList.jsx` dismissible. `main.jsx` passes `messages`, `pixelRatio` (3) and `onDismissed(id)`, which removes a message from the list.

        - **Swipe.** Every row registers its gesture handlers through `useSimulatedPan(message.id, { onUpdate, onEnd })` from `swipeSim.js`; the events have `translationX`. A row released at **−120 or further** is dismissed; a shorter one returns to 0 and is not dismissed.
        - **Animation.** Dismissal is a bounded `Animated` animation (no longer than 400 ms): the row moves further left and fades, and `onDismissed(message.id)` is called **once**, when the animation has reached its end — and only then.
        - **Interruption.** If the row unmounts in the middle of a dismissal (the “Leave the screen” button), `onDismissed` is not called for it.
        - **Reduced motion.** Read and follow the setting through `SimulatedAccessibilityInfo` from `motionSettings.js`. When it is on, dismissal is only a fade, with no sideways movement; the end state is the same.
        - **Without a gesture.** Export `dismissActionProps(label, onDismiss)`, returning `accessibilityActions: [{ name: 'dismiss', label }]` and an `onAccessibilityAction` that calls `onDismiss()` only for the `'dismiss'` action, and spread these props on the row.
        - **Avatar.** Show `message.avatar` (squares, smallest first) in an `Image` with `testID={`avatar-${message.id}`}`, 40 × 40 points, picking the smallest variant that covers 40 points at `pixelRatio`.

        `testID={`row-${message.id}`}` on the row stays. The checks simulate swipes, switch the setting on, press “Leave the screen” and “Go back”, call `dismissActionProps` and the row's own accessibility action, and measure the avatars. The other files cannot be edited.
    limits:
      uk: "Перегляд react-native-web: свайпи (`swipeSim.js` замість `Gesture.Pan`), налаштування «зменшити рух» (`motionSettings.js` замість `AccessibilityInfo`), екран, з якого йдуть (демонтаж замість навігації), і щільність (число замість `PixelRatio.get()`) симульовані. `accessibilityActions` перегляд не показує, тож перевірки викликають `onAccessibilityAction` рядка напряму, як це зробив би читач екрана. Плавність, жест під пальцем, VoiceOver і TalkBack перевіряють на пристрої — друга частина завдання."
      en: "The react-native-web preview: the swipes (`swipeSim.js` instead of `Gesture.Pan`), the “reduce motion” setting (`motionSettings.js` instead of `AccessibilityInfo`), the screen being left (an unmount instead of navigation) and the pixel ratio (a number instead of `PixelRatio.get()`) are simulated. The preview does not show `accessibilityActions`, so the checks call the row's `onAccessibilityAction` directly, as a screen reader would. Smoothness, the gesture under a finger, VoiceOver and TalkBack are checked on a device — the second part of the task."
    testTitles:
      "a swipe past −120 dismisses the row exactly once, within a second":
        uk: "Свайп за −120 закриває рядок рівно один раз і протягом секунди"
        en: "A swipe past −120 dismisses the row exactly once, within a second"
      "a short swipe does not dismiss and the row returns":
        uk: "Короткий свайп не закриває, і рядок повертається"
        en: "A short swipe does not dismiss and the row returns"
      "the dismissal slides the row further left while it fades":
        uk: "Під час закриття рядок їде далі ліворуч і згасає"
        en: "The dismissal slides the row further left while it fades"
      "under reduce motion the row fades without sliding further":
        uk: "При зменшеному русі рядок згасає, не рухаючись убік"
        en: "Under reduce motion the row fades without sliding further"
      "leaving the screen mid-dismissal never dismisses that row":
        uk: "Якщо піти з екрана посеред закриття, рядок не закривається"
        en: "Leaving the screen mid-dismissal never dismisses that row"
      "the dismiss accessibility action does what the swipe does":
        uk: "Дія доступності `dismiss` робить те саме, що свайп"
        en: "The `dismiss` accessibility action does what the swipe does"
      "avatars are 40 × 40 points and use the 144-pixel variant":
        uk: "Аватари — 40 × 40 точок і беруть варіант на 144 пікселі"
        en: "Avatars are 40 × 40 points and use the 144-pixel variant"
      "the row's own dismiss action dismisses it like a swipe":
        uk: "Дія `dismiss` самого рядка закриває його так само, як свайп"
        en: "The row's own `dismiss` action dismisses it like a swipe"
    solutionNote:
      uk: "Рядок іде за пальцем (`setValue` в `onUpdate`), а в `onEnd` або закривається, або пружно повертається. Закриття — `Animated.parallel` зсуву й згасання на 250 мс; при зменшеному русі — саме згасання. `onDismissed` стоїть за `if (finished)`, а cleanup зупиняє анімацію, тож перерване закриття нічого не прибирає. Хук налаштування читає значення, підписується й знімає підписку. Аватар: 40 × 3 = 120 пікселів, найменший достатній — 144."
      en: "The row follows the finger (`setValue` in `onUpdate`), and in `onEnd` it either dismisses or springs back. Dismissal is an `Animated.parallel` of the slide and the fade over 250 ms; under reduced motion only the fade. `onDismissed` sits behind `if (finished)`, and the cleanup stops the animation, so an interrupted dismissal removes nothing. The setting hook reads the value, subscribes and removes the subscription. Avatar: 40 × 3 = 120 pixels; the smallest sufficient variant is 144."
    feedback:
      - when: { test: "a swipe past −120 dismisses the row exactly once, within a second" }
        message:
          uk: "Ця перевірка симулює свайп рядка m-01 до −150 і очікує рівно один виклик `onDismissed(m-01)` менш ніж за секунду після відпускання, а потім зниклий рядок. Анімація закриття має бути обмеженою: не довшою за 400 мс."
          en: "This check simulates a swipe of row m-01 to −150 and expects exactly one `onDismissed(m-01)` call less than a second after the release, and then the row gone. The dismissal animation must be bounded: no longer than 400 ms."
      - when: { test: "a short swipe does not dismiss and the row returns" }
        message:
          uk: "Ця перевірка симулює свайп m-02 до −60 і через 600 мс очікує нуль викликів `onDismissed(m-02)` і `translateX` рядка 0."
          en: "This check simulates a swipe of m-02 to −60 and after 600 ms expects zero `onDismissed(m-02)` calls and a `translateX` of 0 on the row."
      - when: { test: "the dismissal slides the row further left while it fades" }
        message:
          uk: "Ця перевірка відпускає m-03 на −150 і порівнює стиль рядка через 20 і через 130 мс: рядок ще на екрані, `translateX` став щонайменше на 10 меншим, а `opacity` — менша за 1."
          en: "This check releases m-03 at −150 and compares the row's style after 20 and after 130 ms: the row is still on screen, `translateX` has become at least 10 smaller, and `opacity` is below 1."
      - when: { test: "under reduce motion the row fades without sliding further" }
        message:
          uk: "Ця перевірка вмикає налаштування, відпускає m-04 на −150 і очікує між 20 і 130 мс зсув не більше 1 і меншу `opacity`, а потім зниклий рядок."
          en: "This check switches the setting on, releases m-04 at −150 and expects, between 20 and 130 ms, a shift of at most 1 and a lower `opacity`, and then the row gone."
      - when: { test: "leaving the screen mid-dismissal never dismisses that row" }
        message:
          uk: "Ця перевірка відпускає m-05 на −150, за 60 мс натискає «%%leave%%» і через 500 мс очікує нуль викликів `onDismissed(m-05)`; потім натискає «%%back%%»."
          en: "This check releases m-05 at −150, presses “%%leave%%” after 60 ms and after 500 ms expects zero `onDismissed(m-05)` calls; then it presses “%%back%%”."
      - when: { test: "the dismiss accessibility action does what the swipe does" }
        message:
          uk: "Ця перевірка викликає `dismissActionProps(label, onDismiss)` і очікує `accessibilityActions` рівно `[{ name: 'dismiss', label }]` та один виклик `onDismiss` після дій `'dismiss'` і `'activate'`."
          en: "This check calls `dismissActionProps(label, onDismiss)` and expects `accessibilityActions` equal to `[{ name: 'dismiss', label }]` and one `onDismiss` call after the `'dismiss'` and `'activate'` actions."
      - when: { test: "avatars are 40 × 40 points and use the 144-pixel variant" }
        message:
          uk: "Ця перевірка шукає елемент з `testID=\"avatar-m-06\"`, очікує 40 × 40 і варіант на 144 пікселі."
          en: "This check looks for the element with `testID=\"avatar-m-06\"` and expects 40 × 40 and the 144-pixel variant."
      - when: { test: "the row's own dismiss action dismisses it like a swipe" }
        message:
          uk: "Ця перевірка бере `onAccessibilityAction` з рядка m-02, викликає його з дією `'dismiss'` і чекає до 2 с на один виклик `onDismissed(m-02)` і зниклий рядок. Пропси з `dismissActionProps` мають бути розгорнуті на самому рядку (тому, що має `testID=\"row-…\"`)."
          en: "This check takes `onAccessibilityAction` from the row of m-02, calls it with the `'dismiss'` action and waits up to 2 s for one `onDismissed(m-02)` call and the row gone. The props from `dismissActionProps` must be spread on the row itself (the one with `testID=\"row-…\"`)."

  - id: device-task
    kind: local-task
    runtime: local-native
    title:
      uk: "На заявленій цілі: свайп, рух, шрифт і одне виміряне покращення"
      en: "On the declared target: swipe, motion, font and one measured improvement"
    intro:
      uk: |
        Без підказок, у проєкті `rn10-perf-lab` (якщо його немає — створи як у лабораторії уроку «Профілювання: release проти debug» і встанови бібліотеки, як в уроці «Налагодження: пропущені кадри й ідентичність у списку»). Нова гілка: `git switch -c rn10-inbox`.

        > [!warning]
        > Автори курсу не запускали цього завдання на пристрої: на машині, де писали урок, нативних інструментів не було. Прикладів виводу тут немає — записуй, що бачиш, і що не вдалося виміряти.

        **Що збудувати.** Екран вхідних із 300 синтетичних повідомлень (відправник, текст, аватар):

        - рядок закривається свайпом ліворуч (`Gesture.Pan` з порогом активації й `failOffsetY`, щоб список гортався) і дією доступності `dismiss`;
        - анімація закриття обмежена, рух рядка — у потоці UI (Reanimated), стан змінюється один раз після завершення;
        - анімація зупиняється, коли рядок демонтується чи екран іде у фон;
        - при ввімкненому «зменшити рух» в ОС — лише згасання з тим самим кінцевим станом;
        - аватари з `require()` у варіантах `@2x`/`@3x` або з явним розміром і варіантом під щільність; ім’я відправника — власним шрифтом через `useFonts`, із заглушкою до завантаження.

        **Застряглий жест.** Додай у свій рядок такий обробник кінця жесту — він описує поширену ваду — і відтвори її:

        ```ts
        .onEnd((event, success) => {
          if (!success) return; // an interrupted pan leaves the row where it was
          translateX.value = withTiming(event.translationX <= DISMISS_AT ? -400 : 0);
        })
        ```

        За документацією react-native-gesture-handler 2.32, `onEnd` викликається з `success: false`, коли активний жест скасовано, а `onFinalize` — щоразу, коли обробка жесту закінчується. Перерви жест посеред свайпу (наприклад, жестом системної навігації чи шторкою сповіщень — способи, що зазвичай скасовують дотик; тут не перевірено) і подивись, чи лишився рядок напіввідсунутим. Полагодь так, щоб рядок завжди повертався чи закривався, а дія доступності й робота з клавіатурою не зламалися.

        **Вимірювання.** Обери одну проблему, яку бачиш у профілі release (кадри під час свайпу чи прокрутки, пам’ять аватарів), виправ її однією правкою й запиши в `PERF.md` числа до й після на тій самій цілі, з умовами й тим, що не виміряно.
      en: |
        Without hints, in the `rn10-perf-lab` project (if it does not exist, create it as in the lab of the lesson “Profiling release vs debug” and install the libraries as in the lesson “Debug: dropped frames and list identity”). A new branch: `git switch -c rn10-inbox`.

        > [!warning]
        > The course authors did not run this task on a device: the machine this lesson was written on had no native tooling. There is no sample output here — write down what you see, and what you could not measure.

        **What to build.** An inbox screen of 300 synthetic messages (sender, text, avatar):

        - a row dismisses with a swipe to the left (`Gesture.Pan` with an activation threshold and `failOffsetY`, so the list still scrolls) and with a `dismiss` accessibility action;
        - the dismissal animation is bounded, the row's movement runs on the UI thread (Reanimated), and state changes once after completion;
        - the animation stops when the row unmounts or the screen goes to the background;
        - with “reduce motion” on in the OS — only a fade with the same end state;
        - avatars from `require()` in `@2x`/`@3x` variants, or with an explicit size and a variant for the density; the sender's name in a custom font through `useFonts`, with a placeholder until it loads.

        **A stuck gesture.** Add this end-of-gesture handler to your row — it describes a common defect — and reproduce it:

        ```ts
        .onEnd((event, success) => {
          if (!success) return; // an interrupted pan leaves the row where it was
          translateX.value = withTiming(event.translationX <= DISMISS_AT ? -400 : 0);
        })
        ```

        According to the react-native-gesture-handler 2.32 docs, `onEnd` is called with `success: false` when an active gesture is canceled, and `onFinalize` every time handling of the gesture ends. Interrupt a gesture in the middle of a swipe (for example with the system navigation gesture or the notification shade — ways that usually cancel a touch; not checked here) and see whether the row stays half-swiped. Repair it so that the row always returns or dismisses, while the accessibility action and keyboard use keep working.

        **Measurement.** Pick one problem you see in the release profile (frames while swiping or scrolling, the avatars' memory), fix it with one change and write into `PERF.md` the numbers before and after on the same target, with the conditions and what was not measured.
    tools:
      - name: "Expo SDK"
        version: "57 (React Native 0.86)"
      - name: "react-native-gesture-handler / react-native-reanimated"
        version: "2.32 / 4.5"
        note: { uk: "через `npx expo install`", en: "through `npx expo install`" }
      - name: "expo-font"
        note: { uk: "`npx expo install expo-font`, якщо його ще немає", en: "`npx expo install expo-font` if it is not there yet" }
      - name: "Declared target"
        note: { uk: "та сама ціль, що в базовій лінії", en: "the same target as in the baseline" }
    steps:
      - text:
          uk: "Створи гілку для завдання в проєкті лабораторії."
          en: "Create a branch for the task in the lab project."
        command: "cd ~/js-course/rn10-perf-lab\ngit switch -c rn10-inbox"
        expect:
          uk: "`Switched to a new branch 'rn10-inbox'`."
          en: "`Switched to a new branch 'rn10-inbox'`."
      - text:
          uk: "Збудуй екран за переліком у вступі. Перевіряй типи (`npx tsc --noEmit`) і фіксуй робочі кроки окремими commit-ами."
          en: "Build the screen following the list in the intro. Check the types (`npx tsc --noEmit`) and commit working steps separately."
      - text:
          uk: "Перевір на цілі в release: свайп закриває, вертикальна прокрутка не краде свайп і навпаки; VoiceOver чи TalkBack пропонує дію закриття; вихід з екрана посеред закриття нічого не ламає; з увімкненим «зменшити рух» рядок лише згасає."
          en: "Check on the target in release: a swipe dismisses, vertical scrolling does not steal the swipe and vice versa; VoiceOver or TalkBack offers the dismiss action; leaving the screen mid-dismissal breaks nothing; with “reduce motion” on, the row only fades."
      - text:
          uk: "Відтвори застряглий жест з обробником зі вступу, полагодь і перевір знову разом із дією доступності."
          en: "Reproduce the stuck gesture with the handler from the intro, repair it and check again together with the accessibility action."
      - text:
          uk: "Виміряй одну проблему в release до й після правки (медіана з трьох запусків) і запиши в `PERF.md` з умовами й тим, що не виміряно. Зафіксуй."
          en: "Measure one problem in release before and after the change (the median of three runs) and write it into `PERF.md` with the conditions and what was not measured. Commit."
        command: "git add -A\ngit commit -m \"RN-10 inbox: dismissible rows, measured\""
        expect:
          uk: "Commit створено на гілці `rn10-inbox`."
          en: "The commit is created on the `rn10-inbox` branch."
    verify:
      - id: dismiss-both-ways
        text:
          uk: "На заявленій цілі рядок закривається свайпом і дією доступності, а список і далі гортається."
          en: "On my declared target a row dismisses by swipe and by the accessibility action, and the list still scrolls."
      - id: motion-and-lifecycle
        text:
          uk: "Перерване закриття нічого не ламає, а при «зменшити рух» рядок лише згасає з тим самим кінцевим станом."
          en: "An interrupted dismissal breaks nothing, and with “reduce motion” the row only fades with the same end state."
      - id: stuck-fixed
        text:
          uk: "Я відтворив застряглий жест, полагодив його й перевірив, що дія доступності й клавіатура працюють."
          en: "I reproduced the stuck gesture, repaired it and checked that the accessibility action and the keyboard work."
      - id: assets-sized
        text:
          uk: "Аватари мають розмір під екран, а ім’я відправника не стрибає зі зміною шрифту."
          en: "The avatars are sized for the screen, and the sender's name does not jump when the font changes."
      - id: measured
        text:
          uk: "У `PERF.md` є числа release до й після однієї правки на тій самій цілі, з умовами й переліком того, що не виміряно."
          en: "`PERF.md` has release numbers before and after one change on the same target, with the conditions and a list of what was not measured."
    troubleshooting:
      - problem:
          uk: "Немає працездатної нативної цілі"
          en: "There is no working native target"
        fix:
          uk: "Познач завдання як невиконане. Частину в перегляді ти вже склав; до пристрою можна повернутися пізніше — завдання лишиться в прогресі невиконаним."
          en: "Mark the task not performed. You have already passed the preview part; you can come back to the device later — the task stays not performed in your progress."
      - problem:
          uk: "Покращення не видно в числах"
          en: "The improvement does not show in the numbers"
        fix:
          uk: "Запиши це чесно: «не покращилося», з числами. Перевір, що обидва вимірювання — release на тій самій цілі з тим самим сценарієм, і пошукай іншу причину в профілі."
          en: "Write it down honestly: “no improvement”, with the numbers. Check that both measurements are release on the same target with the same script, and look for another cause in the profile."
    recovery:
      uk: "Усе на окремій гілці: `git switch -` (або `git switch` з назвою основної гілки — `main` чи `master`) повертає проєкт до стану перед завданням, а `git log rn10-inbox` показує твої кроки."
      en: "Everything is on a separate branch: `git switch -` (or `git switch` with the name of the main branch — `main` or `master`) brings the project back to its state before the task, and `git log rn10-inbox` shows your steps."
