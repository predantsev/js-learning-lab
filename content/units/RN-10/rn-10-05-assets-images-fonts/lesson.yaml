id: rn-10-05-assets-images-fonts
unit: RN-10
title:
  uk: "Ресурси, зображення й шрифти"
  en: "Assets, images and fonts"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Обрати розмір зображення й варіант щільності (@2x/@3x) для мініатюри на 64 точки й оцінити, скільки пам’яті в розкодованому вигляді коштує 4000-піксельний оригінал замість неї."
    en: "Choose an image size and density variant (@2x/@3x) for a 64-point thumbnail and estimate the decoded memory cost of shipping a 4000-pixel original instead."
  - uk: "Завантажити власний шрифт до першого показу тексту з запасним варіантом і пояснити, що бачить користувач, поки шрифт вантажиться."
    en: "Load a custom font before the first text render with a fallback, and explain what the user sees while it loads."
prerequisites: [rn-10-04-cancellation-reduced-motion, rn-02-01-view-text-image-input]
subskills:
  - { family: N-08, skill: "asset/image sizing and font/loading", depth: intro }
  - { family: N-04, skill: "images/assets", depth: intro }
glossary: [density-variant, decoded-image-size, bundled-font]
selfCheck: [predict-decoded, wish-thumbnail]

blocks:
  - id: pixels-not-kilobytes
    kind: explanation
    title:
      uk: "Пам’ять рахують у пікселях, не в кілобайтах"
      en: "Memory is counted in pixels, not kilobytes"
    body:
      uk: |
        Фото бажання на 4000 × 3000 пікселів у JPEG важить, скажімо, 2 МБ. Але щоб його намалювати, платформа його **розкодовує** — розпаковує в масив пікселів. Типово кожен піксель — 4 байти (червоний, зелений, синій, прозорість). Тож [[decoded-image-size|розкодований розмір]] — це `ширина × висота × 4`, хай яким маленьким був файл. Деякі конвеєри зображень уміють зменшити велику картинку ще під час розкодування, але не завжди й не для кожного джерела — не покладайся на це.

        Мініатюра займає 64 × 64 [[density-independent-pixel|точки]]. На екрані з [[pixel-ratio|щільністю]] 3 це 192 × 192 пікселі — більше намалювати там неможливо. Усе, що понад це, — пам’ять, витрачена дарма; сотня таких мініатюр у списку — і система може закрити застосунок через нестачу пам’яті.

        Як отримати потрібний розмір:

        - **картинки в бандлі**: поклади поряд `check.png`, `check@2x.png`, `check@3x.png` — `require('./img/check.png')` сам обере [[density-variant|варіант щільності]] під екран (документація React Native 0.86);
        - **картинки з сервера**: проси розмір під екран, `64 × pixelRatio`, і завжди задавай `width` і `height` у стилі — без них мережеве зображення не покажеться.
      en: |
        A wish photo of 4000 × 3000 pixels may weigh, say, 2 MB as a JPEG. But to draw it, the platform **decodes** it — unpacks it into an array of pixels. Typically every pixel is 4 bytes (red, green, blue, alpha). So the [[decoded-image-size]] is `width × height × 4`, however small the file. Some image pipelines can shrink a large picture while decoding it, but not always and not for every source — do not rely on it.

        A thumbnail takes 64 × 64 [[density-independent-pixel|points]]. On a screen with a [[pixel-ratio]] of 3 that is 192 × 192 pixels — more cannot be drawn there. Everything beyond that is memory wasted; a hundred such thumbnails in a list, and the system may close the app for running out of memory.

        How to get the right size:

        - **bundled pictures**: put `check.png`, `check@2x.png`, `check@3x.png` side by side — `require('./img/check.png')` picks the [[density-variant]] for the screen by itself (React Native 0.86 docs);
        - **pictures from a server**: ask for the size of the screen, `64 × pixelRatio`, and always set `width` and `height` in the style — a network image without them is not shown.

  - id: predict-decoded
    kind: prediction
    prompt:
      uk: "Скільки байтів займе в пам’яті розкодоване фото 4000 × 3000 і скільки — варіант 192 × 192 для мініатюри на 64 точки при щільності 3? Код рахує те саме, що й пояснення."
      en: "How many bytes does a decoded 4000 × 3000 photo take in memory, and how many the 192 × 192 variant for a 64-point thumbnail at a pixel ratio of 3? The code computes the same thing as the explanation."
    code: |
      const decodedBytes = (width, height) => width * height * 4;
      console.log(decodedBytes(4000, 3000));
      console.log(decodedBytes(64 * 3, 64 * 3));
    verify:
      logs: ["48000000", "147456"]
    answer:
      type: choice
      options:
        - id: big-small
          text:
            uk: "48 000 000 (≈ 46 МіБ) і 147 456 (≈ 144 КіБ) — у 325 разів менше"
            en: "48,000,000 (≈ 46 MiB) and 147,456 (≈ 144 KiB) — 325 times less"
        - id: same
          text:
            uk: "Однаково: на екрані обидва займають 64 точки"
            en: "The same: on screen both take 64 points"
          why:
            uk: "Розмір на екрані сам не зменшує розкодоване зображення: якщо платформа не зменшила картинку під час розкодування, у пам’яті лежать усі пікселі джерела, а до 192 × 192 їх стискають лише під час малювання."
            en: "The size on screen does not shrink the decoded image by itself: unless the platform shrank the picture while decoding it, all the source's pixels sit in memory and are squeezed to 192 × 192 only while drawing."
        - id: file-size
          text:
            uk: "Близько 2 МБ і кілька КБ — скільки важать файли"
            en: "About 2 MB and a few KB — what the files weigh"
          why:
            uk: "Розмір файла — це стиснені дані. Щоб показати картинку, її розпаковують: 4 байти на кожен піксель."
            en: "A file's size is compressed data. To show a picture, it is unpacked: 4 bytes for every pixel."
        - id: points
          text:
            uk: "16 384 для обох: 64 × 64 × 4"
            en: "16,384 for both: 64 × 64 × 4"
          why:
            uk: "Точки — не пікселі. При щільності 3 одна точка — це 3 × 3 пікселі, тож мініатюра має 192 × 192 пікселі, а оригінал — усі свої 4000 × 3000."
            en: "Points are not pixels. At a pixel ratio of 3 one point is 3 × 3 pixels, so the thumbnail has 192 × 192 pixels, and the original all of its 4000 × 3000."
      correct: [big-small]
    explanation:
      uk: "`4000 × 3000 × 4 = 48 000 000` байтів, `192 × 192 × 4 = 147 456`. Мініатюра виглядає однаково, але оригінал займає в 325 разів більше пам’яті. Чи розкодує платформа менший варіант сама, залежить від її конвеєра зображень — не покладайся на це: давай зображення потрібного розміру."
      en: "`4000 × 3000 × 4 = 48,000,000` bytes, `192 × 192 × 4 = 147,456`. The thumbnail looks the same, but the original takes 325 times more memory. Whether a platform decodes a smaller version by itself depends on its image pipeline — do not rely on it: provide an image of the right size."

  - id: thumb-memory
    kind: example
    runtime: concept-preview
    dir: thumb-memory
    entry: main.jsx
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      fontReady: { uk: "Шрифт завантажено.", en: "The font has loaded." }
      fontFallback: { uk: "Шрифт ще вантажиться — поки що системний.", en: "The font is still loading — the system font for now." }
      decoded: { uk: "Розкодовано", en: "Decoded" }
    title:
      uk: "Оригінал чи варіант — і шрифт, що запізнюється"
      en: "Original or variant — and a late font"
    body:
      uk: |
        Мініатюра на 64 точки на симульованому екрані зі щільністю 3. Зараз вона показує 4000-піксельний оригінал (квадратна заготовка замість фото).

        Натисни **Запустити**. Консоль: `screen draws 192 × 192 pixels` і `decoded picture: 4000 × 4000 px = 61.04 MiB`. Подивись і на назву: спершу вона системним шрифтом, а за 0,8 с «власний шрифт» підміняє його, і текст стрибає.
      en: |
        A 64-point thumbnail on a simulated screen with a pixel ratio of 3. Right now it shows the 4000-pixel original (a square stand-in instead of a photo).

        Press **Run**. The console shows `screen draws 192 × 192 pixels` and `decoded picture: 4000 × 4000 px = 61.04 MiB`. Look at the name too: first it is in the system font, and after 0.8 s the “custom font” replaces it, and the text jumps.
    tryIt:
      uk: |
        1. Зміни `USE_ORIGINAL` на `false` і запусти: `decoded picture: 192 × 192 px = 0.14 MiB`. На екрані різниці немає.
        2. Зміни `PIXEL_RATIO` на `2`: обирається варіант 128 пікселів. Поверни `3`.
        3. Зміни `FONT_DELAY_MS` на `1500`. Довше видно запасний шрифт, і стрибок тексту помітніший — саме тому текст із власним шрифтом показують лише після завантаження.
      en: |
        1. Change `USE_ORIGINAL` to `false` and run: `decoded picture: 192 × 192 px = 0.14 MiB`. There is no difference on screen.
        2. Change `PIXEL_RATIO` to `2`: the 128-pixel variant is picked. Put `3` back.
        3. Change `FONT_DELAY_MS` to `1500`. The fallback font is visible longer, and the jump of the text is more noticeable — which is why text in a custom font is shown only after loading.
    limits:
      uk: "Це симуляція в перегляді react-native-web: щільність екрана задано константою (на пристрої її дає `PixelRatio.get()`), картинки — згенеровані квадрати, розкодований розмір пораховано формулою, а не виміряно, а «власний шрифт» — це шрифт браузера із затримкою (на пристрої — `useFonts` з `expo-font`). Немає нативних модулів, справжнього декодування й пам’яті телефона. Пам’ять вимірюють на пристрої — у профілюванні далі."
      en: "This is a simulation in the react-native-web preview: the pixel ratio is a constant (on a device `PixelRatio.get()` gives it), the pictures are generated squares, the decoded size is computed by formula, not measured, and the “custom font” is a browser font with a delay (on a device, `useFonts` from `expo-font`). There are no native modules, no real decoding and no phone memory. Memory is measured on a device — in profiling later."

  - id: fonts-before-text
    kind: explanation
    title:
      uk: "Шрифт готовий не тоді, коли його назвали"
      en: "A font is not ready when you name it"
    body:
      uk: |
        `fontFamily: 'Inter-Bold'` у стилі — лише назва, а не завантажений шрифт. Системні шрифти — Roboto на Android і SF Pro на iOS (документація Expo); власного шрифту там немає, доки його не завантажено. Документація Expo радить не показувати текст до завантаження: якщо показати раніше, він вийде не тим шрифтом, а після підміни стрибне й перенесеться інакше (як саме виглядає текст до завантаження на кожній платформі, у курсі не перевірено).

        В Expo SDK 57 є два шляхи:

        - **у збірці**: [[bundled-font|вбудувати шрифт]] через плагін `expo-font` у конфігурації застосунку — він готовий уже на старті; потрібна власна development-збірка, Expo Go так не вміє;
        - **під час роботи**: хук `useFonts` з `expo-font` повертає `[loaded, error]`. Поки `loaded` — `false`, тримай заставку (`SplashScreen` з `expo-splash-screen`: `preventAutoHideAsync()`, а потім `hideAsync()`) чи заглушку замість тексту.

        ```js
        const [loaded, error] = useFonts({ 'Lora-Bold': require('./assets/fonts/Lora-Bold.ttf') });
        if (!loaded && !error) return <Placeholder />;
        ```

        Помилка теж кінець очікування: тоді покажи текст без власного шрифту, а не ховай його назавжди.
      en: |
        `fontFamily: 'Inter-Bold'` in a style is only a name, not a loaded font. The system fonts are Roboto on Android and SF Pro on iOS (Expo docs); your own font is not there until it has loaded. The Expo docs advise not to show the text before loading: shown earlier, it comes out in the wrong font and, once swapped, jumps and wraps differently (how exactly text looks before loading on each platform was not checked in this course).

        Expo SDK 57 has two ways:

        - **in the build**: [[bundled-font|embed the font]] through the `expo-font` plugin in the app config — it is ready right at launch; this needs your own development build, Expo Go cannot do it;
        - **at runtime**: the `useFonts` hook from `expo-font` returns `[loaded, error]`. While `loaded` is `false`, keep the splash screen (`SplashScreen` from `expo-splash-screen`: `preventAutoHideAsync()`, then `hideAsync()`) or a placeholder instead of the text.

        ```js
        const [loaded, error] = useFonts({ 'Lora-Bold': require('./assets/fonts/Lora-Bold.ttf') });
        if (!loaded && !error) return <Placeholder />;
        ```

        An error also ends the wait: then show the text without the custom font rather than hiding it for good.

  - id: recall-image
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: image-needs-size
        from: rn-02-01-view-text-image-input
        prompt:
          uk: "Ти показуєш `<Image source={{ uri }} />` з адресою з сервера, без стилю. Що побачить користувач і чого бракує читачу екрана?"
          en: "You show `<Image source={{ uri }} />` with an address from a server, without a style. What does the user see, and what is missing for a screen reader?"
        answer:
          type: choice
          options:
            - id: nothing-no-name
              text:
                uk: "Нічого не видно, бо немає `width` і `height`; і в картинки немає доступної назви"
                en: "Nothing is visible, because there is no `width` and `height`; and the picture has no accessible name"
            - id: natural
              text:
                uk: "Картинку в її власному розмірі, як у браузері; назва не потрібна"
                en: "The picture at its own size, as in a browser; a name is not needed"
              why:
                uk: "React Native не бере розмір мережевого зображення з файла: без `width` і `height` воно займає 0 × 0. А без `accessibilityLabel` читач екрана не знає, що на картинці."
                en: "React Native does not take a network image's size from the file: without `width` and `height` it takes 0 × 0. And without an `accessibilityLabel` a screen reader does not know what the picture shows."
          correct: [nothing-no-name]
        explanation:
          uk: "Мережевому `Image` потрібні явні розміри, а інформативній картинці — `accessible` і `accessibilityLabel`. Тепер до цього додається третє: джерело потрібного розміру."
          en: "A network `Image` needs explicit dimensions, and an informative picture needs `accessible` and an `accessibilityLabel`. Now a third thing joins them: a source of the right size."

  - id: wish-thumbnail
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: wish-thumbnail
    entry: main.jsx
    editable: [WishThumbnail.jsx]
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    title:
      uk: "Мініатюра бажання потрібного розміру"
      en: "A wish thumbnail of the right size"
    instructions:
      uk: |
        `main.jsx` показує два бажання з мініатюрами на 64 точки на симульованому екрані зі щільністю 3, а «власний шрифт» приходить через 2 с. Допиши `WishThumbnail.jsx`:

        - обери з `wish.variants` (квадрати, від найменшого) **найменший** варіант, чиї `px` покривають `size × pixelRatio`; якщо такого немає — найбільший;
        - дай `Image` стиль `width` і `height`, що дорівнюють `size`;
        - зроби картинку доступною: `accessible` і `accessibilityLabel` з назвою бажання;
        - поки картинка не завантажилася (`onLoad`) **або** шрифт ще не готовий (`fontsLoaded`), показуй замість назви заглушку — `View` з `testID="placeholder"`; коли готові обидва, заглушок немає, а назва видна.

        Перевірки дивляться на заглушки після старту й після шрифту, на назви й розміри картинок і на те, який варіант показано. `assets.js` і `main.jsx` редагувати не можна.
      en: |
        `main.jsx` shows two wishes with 64-point thumbnails on a simulated screen with a pixel ratio of 3, and the “custom font” arrives after 2 s. Finish `WishThumbnail.jsx`:

        - pick from `wish.variants` (squares, smallest first) the **smallest** variant whose `px` covers `size × pixelRatio`; if there is none, the largest;
        - give the `Image` a style with `width` and `height` equal to `size`;
        - make the picture accessible: `accessible` and an `accessibilityLabel` with the wish's name;
        - while the picture has not loaded (`onLoad`) **or** the font is not ready (`fontsLoaded`), show a placeholder instead of the name — a `View` with `testID="placeholder"`; when both are ready, there are no placeholders and the name is visible.

        The checks look at the placeholders after start and after the font, at the pictures' names and sizes, and at which variant is shown. `assets.js` and `main.jsx` cannot be edited.
    limits:
      uk: "Перегляд react-native-web: щільність екрана симульована, картинки — згенеровані квадрати, а шрифт — затримка, а не файл. Перевірки бачать, який варіант обрано, і розміри, але не пам’ять телефона й не те, як платформа декодує картинку."
      en: "The react-native-web preview: the pixel ratio is simulated, the pictures are generated squares, and the font is a delay, not a file. The checks see which variant was picked and the sizes, but not the phone's memory or how the platform decodes the picture."
    testTitles:
      "a placeholder stands in until the picture and the font are ready":
        uk: "Заглушка стоїть, доки картинка й шрифт не готові"
        en: "A placeholder stands in until the picture and the font are ready"
      "each picture is named by its wish":
        uk: "Кожна картинка має назву свого бажання"
        en: "Each picture is named by its wish"
      "each picture is 64 × 64 points":
        uk: "Кожна картинка — 64 × 64 точки"
        en: "Each picture is 64 × 64 points"
      "each thumbnail uses the smallest variant that covers 64 points at 3×":
        uk: "Кожна мініатюра бере найменший варіант, що покриває 64 точки при 3×"
        en: "Each thumbnail uses the smallest variant that covers 64 points at 3×"
    hints:
      nudge:
        uk: "Скільки пікселів реально малює екран для 64 точок при щільності 3? І які дві події мають статися, перш ніж назву можна показати?"
        en: "How many pixels does the screen really draw for 64 points at a pixel ratio of 3? And which two events must happen before the name can be shown?"
      explanation:
        uk: "Потрібні пікселі — це точки, помножені на щільність. Серед відсортованих варіантів перший, що не менший за це число, — найменший достатній; `find` знаходить саме перший. Для готовності заведи стан «картинку завантажено», який вмикає `onLoad`, і поєднай його з `fontsLoaded` через «і». Схоже: кнопка «Оплатити» активна, лише коли `formValid && termsAccepted`."
        en: "The pixels needed are the points multiplied by the pixel ratio. Among sorted variants, the first one not smaller than that number is the smallest sufficient one; `find` finds exactly the first. For readiness keep a state “picture loaded” that `onLoad` turns on, and combine it with `fontsLoaded` through “and”. Similar: a “Pay” button is enabled only when `formValid && termsAccepted`."
    solutionNote:
      uk: "Для 64 точок при 3× потрібно 192 пікселі, і `find` бере варіант 192 — він розкодовується в 144 КіБ замість 61 МіБ оригіналу 4000 × 4000. Явні `width` і `height` дають мініатюрі місце ще до завантаження, тож рядок не стрибає. Заглушка тримається, доки готові не обидва ресурси; на пристрої так само поєднують `onLoad` з `loaded` з `useFonts`."
      en: "64 points at 3× need 192 pixels, and `find` takes the 192 variant — it decodes into 144 KiB instead of 61 MiB for the 4000 × 4000 original. Explicit `width` and `height` give the thumbnail its place before loading, so the row does not jump. The placeholder stays until both resources are ready; on a device `onLoad` is combined the same way with `loaded` from `useFonts`."
    feedback:
      - when: { test: "a placeholder stands in until the picture and the font are ready" }
        message:
          uk: "Ця перевірка одразу після старту очікує в рядку бажання щонайменше один `View` з `testID=\"placeholder\"` і не очікує назви серед видимого тексту; потім чекає до 4 с, що заглушки зникнуть, а назви з’являться. Готовність — це завантажена картинка **і** `fontsLoaded`."
          en: "Right after start this check expects at least one `View` with `testID=\"placeholder\"` in the wish row and no name among the visible text; then it waits up to 4 s for the placeholders to go and the names to appear. Ready means a loaded picture **and** `fontsLoaded`."
      - when: { test: "each picture is named by its wish" }
        message:
          uk: "Ця перевірка шукає картинки з доступними назвами «%%headphones%%» і «%%lamp%%». Дай `Image` властивості `accessible` і `accessibilityLabel={wish.name}`."
          en: "This check looks for pictures with the accessible names “%%headphones%%” and “%%lamp%%”. Give the `Image` the `accessible` and `accessibilityLabel={wish.name}` props."
      - when: { test: "each picture is 64 × 64 points" }
        message:
          uk: "Ця перевірка вимірює кожну названу картинку й очікує рівно 64 × 64. Задай `Image` стиль з `width` і `height`, що дорівнюють `size`."
          en: "This check measures every named picture and expects exactly 64 × 64. Give the `Image` a style with `width` and `height` equal to `size`."
      - when: { test: "each thumbnail uses the smallest variant that covers 64 points at 3×" }
        message:
          uk: "Ця перевірка очікує варіант на 192 пікселі: 64 точки × 3. Варіант 64 замалий для екрана 3×, а 4000-піксельний оригінал — марна пам’ять."
          en: "This check expects the 192-pixel variant: 64 points × 3. The 64 variant is too small for a 3× screen, and the 4000-pixel original is wasted memory."

  - id: to-project
    kind: transfer
    capstoneStep: RN-10
    body:
      uk: "Якщо в кроці проєкту твій список показує картинки чи власний шрифт, дай їм явні `width` і `height`, варіант потрібної щільності й заглушку, доки шрифт не готовий, — щоб профілювання списку вимірювало твій код, а не зайві мегабайти."
      en: "If in the project step your list shows pictures or a custom font, give them explicit `width` and `height`, a variant of the right density and a placeholder until the font is ready — so that profiling the list measures your code, not spare megabytes."
