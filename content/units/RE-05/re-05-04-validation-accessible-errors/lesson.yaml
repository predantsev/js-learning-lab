id: re-05-04-validation-accessible-errors
unit: RE-05
title:
  uk: "Валідація та доступні помилки"
  en: "Validation and accessible errors"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Показувати помилки полів від валідатора домену поруч із полями, зв’язувати їх через `aria-describedby` і позначати поле `aria-invalid`."
    en: "Show the domain validator's field errors next to their inputs, linked with `aria-describedby` and marked with `aria-invalid`."
  - uk: "Після невдалого надсилання переводити фокус на зведення помилок або на перше недійсне поле й вирішувати, коли помилки з’являються (під час надсилання чи виходу з поля, а не на першій клавіші)."
    en: "On a failed submit, move focus to an error summary or the first invalid field, and decide when errors appear (on submit or blur, not on the first keystroke)."
prerequisites: [re-05-03-forms-controlled-uncontrolled, js-06-01-forms-inputs-labels]
subskills:
  - { family: R-05, skill: "validation/errors", depth: intro }
glossary: [field-error, error-summary]
selfCheck: [predict-described, expense-validation]

blocks:
  - id: error-next-to-field
    kind: explanation
    title:
      uk: "Помилка, яку чути, а не лише видно"
      en: "An error you can hear, not only see"
    body:
      uk: |
        Валідатор домену повертає `{ ok: false, errors: { amount: "amountPositive" } }`: для кожного поля — ключ повідомлення. Інтерфейс перетворює ключ на текст мовою людини й ставить його поруч із полем. Це [[field-error|помилка поля]], і зв’язати її треба так само, як підказку в JS-06:

        ```jsx
        <label htmlFor="price">Ціна</label>
        <input
          id="price"
          aria-invalid={errors.price ? "true" : undefined}
          aria-describedby={errors.price ? "price-error" : undefined}
        />
        {errors.price && <p id="price-error">{MESSAGES[errors.price]}</p>}
        ```

        - `aria-invalid="true"` — стан «недійсне значення»: програма екранного читання скаже його разом з назвою поля.
        - `aria-describedby` — `id` елемента з текстом помилки: її прочитають як опис поля, щойно на ньому опиниться фокус.

        Червоний колір — підказка для очей, а не зв’язок. Людина, яка не бачить екрана, переходить між полями клавішею Tab і чує лише те, що записано в атрибутах.
      en: |
        The domain validator returns `{ ok: false, errors: { amount: "amountPositive" } }`: a message key for each field. The UI turns the key into text in the person's language and puts it next to the field. That is a [[field-error]], and it is connected the same way as a hint in JS-06:

        ```jsx
        <label htmlFor="price">Price</label>
        <input
          id="price"
          aria-invalid={errors.price ? "true" : undefined}
          aria-describedby={errors.price ? "price-error" : undefined}
        />
        {errors.price && <p id="price-error">{MESSAGES[errors.price]}</p>}
        ```

        - `aria-invalid="true"` is the “invalid entry” state: a screen reader says it together with the field's name.
        - `aria-describedby` is the `id` of the element with the error text: it is read as the field's description as soon as focus is on the field.

        The red color is a hint for the eyes, not a connection. A person who cannot see the screen moves between fields with Tab and hears only what the attributes say.

  - id: predict-described
    kind: prediction
    prompt:
      uk: "Після невдалого «Зберегти» людина з програмою екранного читання переходить Tab на поле суми. Що вона почує у варіанті A і у варіанті B?"
      en: "After a failed “Save” a person with a screen reader tabs to the amount field. What do they hear in version A and in version B?"
    code: |
      <!-- A -->
      <label for="amount">Amount, UAH</label>
      <input id="amount">
      <p style="color: firebrick">Amount must be greater than zero.</p>

      <!-- B -->
      <label for="amount">Amount, UAH</label>
      <input id="amount" aria-invalid="true" aria-describedby="amount-error">
      <p id="amount-error">Amount must be greater than zero.</p>
    lang: html
    runnable: false
    answer:
      type: choice
      options:
        - id: only-b
          text: { uk: "A: лише назву «Amount, UAH». B: назву, стан «недійсне значення» і текст помилки", en: "A: only the name “Amount, UAH”. B: the name, the “invalid entry” state and the error text" }
        - id: both
          text: { uk: "Обидва варіанти: назву й текст помилки — він же стоїть одразу під полем", en: "Both versions: the name and the error text — it sits right under the field" }
          why:
            uk: "Програма екранного читання не знає, що абзац під полем стосується саме його. Сусідство на екрані — це не зв’язок; зв’язок дає `aria-describedby`."
            en: "A screen reader does not know that the paragraph under the field is about that field. Being next to it on the screen is not a connection; `aria-describedby` is."
        - id: color
          text: { uk: "A: назву й «помилка», бо текст червоний. B: те саме", en: "A: the name and “error”, because the text is red. B: the same" }
          why:
            uk: "Колір не потрапляє в дерево доступності. Стан «недійсне значення» з’являється лише від `aria-invalid`."
            en: "Color does not reach the accessibility tree. The “invalid entry” state comes only from `aria-invalid`."
      correct: [only-b]
    explanation:
      uk: "У дереві доступності поле A має лише назву з `<label>`. Поле B має ще стан «недійсне значення» й опис — текст елемента, на який вказує `aria-describedby`. Точні слова залежать від програми й мови, але без атрибутів помилки не буде в жодній."
      en: "In the accessibility tree field A has only the name from `<label>`. Field B also has the “invalid entry” state and a description — the text of the element that `aria-describedby` points to. The exact words depend on the program and the language, but without the attributes no program says the error at all."

  - id: when-and-where
    kind: explanation
    title:
      uk: "Коли показувати помилки й куди переводити фокус"
      en: "When to show errors and where to move focus"
    body:
      uk: |
        **Коли.** Не на першій клавіші: людина ще не дописала, а її вже сварять. Показуй помилки під час надсилання (або коли людина виходить із поля), а не кожну мить набору.

        **Куди фокус.** Після невдалого «Зберегти» фокус лишається на кнопці, і людина з програмою екранного читання не дізнається, що щось не так. Тому фокус переводять:

        - на [[error-summary|зведення помилок]] — блок угорі форми із заголовком і посиланнями на кожне недійсне поле (`<a href="#price">`): програма читає заголовок, а посилання ведуть до полів;
        - або на перше недійсне поле — коли полів мало.

        Зведення отримує `tabIndex={-1}`: фокус на нього ставить код, а Tab його пропускає. Фокус ставлять **після commit** — в ефекті, через `ref`, як у RE-04: під час обробника зведення ще не на екрані.

        **Чому не вимикати кнопку.** «Зберегти» з `disabled`, поки форма недійсна, нічого не пояснює: Tab її пропускає, клік нічого не робить, і людина не знає, яке поле винне. Кнопка завжди активна, а пояснення дає перевірка.
      en: |
        **When.** Not on the first keystroke: the person has not finished typing and is already being scolded. Show errors on submit (or when the person leaves the field), not at every moment of typing.

        **Where focus goes.** After a failed “Save” focus stays on the button, and a person with a screen reader never learns that something is wrong. So focus is moved:

        - to an [[error-summary]] — a block at the top of the form with a heading and links to every invalid field (`<a href="#price">`): the reader says the heading, and the links lead to the fields;
        - or to the first invalid field — when there are few fields.

        The summary gets `tabIndex={-1}`: code can put focus on it, and Tab skips it. Focus is moved **after the commit** — in an effect, through a `ref`, as in RE-04: during the handler the summary is not on the screen yet.

        **Why not disable the button.** A “Save” with `disabled` while the form is invalid explains nothing: Tab skips it, a click does nothing, and the person does not know which field is to blame. The button stays active, and the check gives the explanation.

  - id: expense-form-errors
    kind: example
    runtime: browser-react
    dir: expense-form-errors
    entry: main.jsx
    strings:
      editExpense: { uk: "Редагування витрати", en: "Editing an expense" }
      label: { uk: "Назва витрати", en: "Label" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      amount: { uk: "Сума, грн", en: "Amount, UAH" }
      category: { uk: "Категорія", en: "Category" }
      pickCategory: { uk: "Обери категорію", en: "Choose a category" }
      food: { uk: "Їжа", en: "Food" }
      fun: { uk: "Розваги", en: "Fun" }
      save: { uk: "Зберегти", en: "Save" }
      saved: { uk: "Збережено:", en: "Saved:" }
      labelRequired: { uk: "Введи назву витрати.", en: "Enter a label for the expense." }
      labelTooLong: { uk: "Назва — не довше за 80 символів.", en: "The label is at most 80 characters." }
      amountInvalid: { uk: "Введи суму числом, наприклад 84.50.", en: "Enter the amount as a number, for example 84.50." }
      amountPositive: { uk: "Сума має бути більшою за нуль.", en: "The amount must be greater than zero." }
      categoryRequired: { uk: "Обери категорію.", en: "Choose a category." }
      reportLabel: { uk: "Що отримує програма екранного читання", en: "What a screen reader gets" }
      reportFocus: { uk: "Фокус:", en: "Focus:" }
      reportInvalid: { uk: "недійсне значення", en: "invalid entry" }
      reportDescription: { uk: "Опис:", en: "Description:" }
    title:
      uk: "Червоний текст, якого не чути"
      en: "Red text nobody hears"
    body:
      uk: |
        Форма вже перевіряє суму, але помилка — лише червоний абзац. Панель унизу показує спрощено те, що отримає програма екранного читання від елемента з фокусом: назву, стан «недійсне значення» й опис. (Повну картину показує панель **Accessibility** в інструментах розробника Chrome: Elements → праворуч Accessibility, вона може ховатися за `»`.)

        Натисни **Запустити**. На **Сторінці** натисни «Зберегти» — сума 0 недійсна. Тепер клацни в поле суми: панель показує лише назву, без стану й опису.
      en: |
        The form already checks the amount, but the error is only a red paragraph. The panel at the bottom shows, simplified, what a screen reader gets from the focused element: its name, the “invalid entry” state and the description. (The full picture is in the **Accessibility** pane of Chrome's developer tools: Elements → Accessibility on the right; it may hide behind `»`.)

        Press **Run**. On the **Page** press “Save” — an amount of 0 is invalid. Now click into the amount field: the panel shows only the name, without the state or the description.
    tryIt:
      uk: |
        1. Додай полю суми два атрибути, які з’являються лише тоді, коли в `errors` є `amount`: `aria-invalid` зі значенням `"true"` і `aria-describedby` з `id` абзацу помилки (`edit-amount-error`). Запусти, збережи й клацни в поле: тепер панель показує «недійсне значення» й текст помилки в описі.
        2. Переведи фокус сам. Додай `useRef` і `useEffect` в імпорт з `"react"`, створи `const amountRef = useRef(null);`, дай полю суми `ref={amountRef}` і додай ефект `useEffect(() => { if (errors.amount) amountRef.current.focus(); }, [errors]);`. Запусти й натисни «Зберегти»: фокус сам переходить у поле суми, і панель одразу читає помилку.
      en: |
        1. Give the amount field two attributes that appear only while `errors` has `amount`: `aria-invalid` with the value `"true"` and `aria-describedby` with the `id` of the error paragraph (`edit-amount-error`). Run it, save and click into the field: now the panel shows “invalid entry” and the error text in the description.
        2. Move focus yourself. Add `useRef` and `useEffect` to the import from `"react"`, create `const amountRef = useRef(null);`, give the amount field `ref={amountRef}` and add the effect `useEffect(() => { if (errors.amount) amountRef.current.focus(); }, [errors]);`. Run it and press “Save”: focus moves into the amount field by itself, and the panel reads the error right away.

  - id: expense-validation
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: expense-validation
    entry: main.jsx
    editable: [App.jsx]
    strings:
      newExpense: { uk: "Нова витрата", en: "New expense" }
      label: { uk: "Назва витрати", en: "Label" }
      amount: { uk: "Сума, грн", en: "Amount, UAH" }
      category: { uk: "Категорія", en: "Category" }
      pickCategory: { uk: "Обери категорію", en: "Choose a category" }
      food: { uk: "Їжа", en: "Food" }
      transport: { uk: "Транспорт", en: "Transport" }
      home: { uk: "Дім", en: "Home" }
      fun: { uk: "Розваги", en: "Fun" }
      save: { uk: "Зберегти", en: "Save" }
      saved: { uk: "Збережені витрати", en: "Saved expenses" }
      lunch: { uk: "Обід", en: "Lunch" }
      summaryTitle: { uk: "Витрату не збережено: виправ помилки", en: "The expense was not saved: fix the errors" }
      labelRequired: { uk: "Введи назву витрати.", en: "Enter a label for the expense." }
      labelTooLong: { uk: "Назва — не довше за 80 символів.", en: "The label is at most 80 characters." }
      amountInvalid: { uk: "Введи суму числом, наприклад 84.50.", en: "Enter the amount as a number, for example 84.50." }
      amountPositive: { uk: "Сума має бути більшою за нуль.", en: "The amount must be greater than zero." }
      categoryRequired: { uk: "Обери категорію.", en: "Choose a category." }
    title:
      uk: "Помилки, які чути, і зведення з фокусом"
      en: "Errors you can hear and a summary that takes focus"
    instructions:
      uk: |
        `handleSubmit` уже викликає `validateExpense` і кладе результат у стан `errors`, а кожне невдале надсилання збільшує `failedSubmits`. Допиши відображення в `App.jsx`:

        - **повідомлення поля:** для кожного поля з помилкою — `<p>` з `id` `expense-label-error`, `expense-amount-error` чи `expense-category-error` і текстом `MESSAGES[ключ]`; саме поле отримує `aria-invalid="true"` і `aria-describedby` з `id` свого повідомлення. Поле без помилки не позначене;
        - **зведення:** коли є хоч одна помилка, угорі форми — елемент `id="error-summary"` з `tabIndex={-1}` і `ref={summaryRef}`, у ньому `<h2>` з текстом «Витрату не збережено: виправ помилки» і список посилань `<a href="#expense-label">` тощо, з текстом помилки, у порядку полів (`FIELDS`);
        - **фокус:** після кожного невдалого надсилання, коли зведення вже на екрані, фокус переходить на нього;
        - до першого надсилання жодних помилок, а кнопка «Зберегти» не вимикається.

        Перевірки монтують окрему копію форми, друкують у поля й натискають «Зберегти».
      en: |
        `handleSubmit` already calls `validateExpense` and puts the result into the `errors` state, and every failed submit increments `failedSubmits`. Complete the display in `App.jsx`:

        - **field messages:** for every field with an error — a `<p>` with the `id` `expense-label-error`, `expense-amount-error` or `expense-category-error` and the text `MESSAGES[key]`; the field itself gets `aria-invalid="true"` and an `aria-describedby` with its message's `id`. A field without an error is not marked;
        - **summary:** when there is at least one error, at the top of the form — an element with `id="error-summary"`, `tabIndex={-1}` and `ref={summaryRef}`, holding an `<h2>` with the text “The expense was not saved: fix the errors” and a list of links `<a href="#expense-label">` and so on, with the error's text, in field order (`FIELDS`);
        - **focus:** after every failed submit, once the summary is on the screen, focus moves to it;
        - no errors before the first submit, and the “Save” button is never disabled.

        The checks mount a separate copy of the form, type into the fields and press “Save”.
    testTitles:
      "no errors are shown before the first submit":
        uk: "До першого надсилання помилок не видно"
        en: "No errors are shown before the first submit"
      "each invalid field is marked invalid and described by its message":
        uk: "Кожне недійсне поле позначене `aria-invalid` і описане своїм повідомленням"
        en: "Each invalid field is marked with `aria-invalid` and described by its message"
      "a valid field is not marked invalid":
        uk: "Правильне поле не позначене як недійсне"
        en: "A valid field is not marked invalid"
      "the summary lists links to the invalid fields in form order":
        uk: "Зведення має посилання на недійсні поля в порядку форми"
        en: "The summary lists links to the invalid fields in form order"
      "a failed submit moves focus to the summary, every time":
        uk: "Кожне невдале надсилання переводить фокус на зведення"
        en: "Every failed submit moves focus to the summary"
      "after fixing the errors, submitting saves the expense and clears the errors":
        uk: "Після виправлення «Зберегти» зберігає витрату й прибирає помилки"
        en: "After fixing the errors, “Save” saves the expense and clears the errors"
    hints:
      nudge:
        uk: "Почни з одного поля: що треба поставити на `<input>`, щоб програма знайшла текст помилки, і що — на сам текст? Потім подумай, коли саме зведення вже існує в DOM."
        en: "Start with one field: what goes on the `<input>` so that the reader finds the error text, and what goes on the text itself? Then think about when exactly the summary already exists in the DOM."
      explanation:
        uk: |
          Зв’язок працює через однаковий текст: `aria-describedby` на полі дорівнює `id` повідомлення. Обидва атрибути додавай лише тоді, коли в `errors` є ключ для цього поля, — інакше вийде опис, що вказує в нікуди.

          Для фокуса згадай `ref` з RE-04: `ref.current` заповнюється під час commit, тож `focus()` викликають в ефекті, який запускається після кожного нового невдалого надсилання. Схожий приклад з іншим елементом: `useEffect(() => { if (opened) dialogRef.current.focus(); }, [opened]);`.
        en: |
          The connection works through equal text: `aria-describedby` on the field equals the message's `id`. Add both attributes only when `errors` has a key for that field — otherwise you get a description that points nowhere.

          For focus, remember `ref` from RE-04: `ref.current` is filled during the commit, so `focus()` is called in an effect that runs after every new failed submit. A similar example with another element: `useEffect(() => { if (opened) dialogRef.current.focus(); }, [opened]);`.
    solutionNote:
      uk: "`aria-invalid` і `aria-describedby` з’являються лише разом із повідомленням, тож опис ніколи не вказує на відсутній елемент. Ефект залежить від `failedSubmits`, а не від `errors`: так друге невдале надсилання з тими самими помилками теж поверне фокус на зведення. Кнопка лишається активною — пояснює перевірка, а не вимкнений стан."
      en: "`aria-invalid` and `aria-describedby` appear only together with the message, so the description never points to a missing element. The effect depends on `failedSubmits`, not on `errors`: that way a second failed submit with the same errors also brings focus back to the summary. The button stays active — the check explains, not a disabled state."
    feedback:
      - when: { test: "no errors are shown before the first submit" }
        message:
          uk: "Ця перевірка друкує `abc` у поле суми, не натискаючи «Зберегти», і чекає, що немає ні `#error-summary`, ні `#expense-amount-error`, а поле не має `aria-invalid=\"true\"`. Помилки мають з’являтися лише після надсилання."
          en: "This check types `abc` into the amount field without pressing “Save” and expects neither `#error-summary` nor `#expense-amount-error`, and no `aria-invalid=\"true\"` on the field. Errors must appear only after a submit."
      - when: { test: "each invalid field is marked invalid and described by its message" }
        message:
          uk: "Ця перевірка надсилає порожню назву, суму `0` і порожню категорію й для кожного з трьох полів чекає `aria-invalid=\"true\"` та `aria-describedby`, що вказує на елемент із текстом його помилки. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "This check submits an empty label, the amount `0` and an empty category, and for each of the three fields expects `aria-invalid=\"true\"` and an `aria-describedby` pointing to the element with that field's error text. If every check fails at once, fix the first error in the console first."
      - when: { test: "a valid field is not marked invalid" }
        message:
          uk: "Ця перевірка надсилає правильні назву й категорію та недійсну суму й чекає, що лише сума має `aria-invalid=\"true\"`, а повідомлення `#expense-label-error` немає. Атрибути й повідомлення кожного поля залежать від його власного ключа в `errors`."
          en: "This check submits a valid label and category and an invalid amount, and expects only the amount to have `aria-invalid=\"true\"` and no `#expense-label-error` message. Each field's attributes and message depend on its own key in `errors`."
      - when: { test: "the summary lists links to the invalid fields in form order" }
        message:
          uk: "Ця перевірка чекає `#error-summary` з `<h2>` «Витрату не збережено: виправ помилки» і посиланнями `#expense-label`, потім `#expense-category` з текстами їхніх помилок — сума `12.5` правильна, тож її в зведенні немає."
          en: "This check expects `#error-summary` with the `<h2>` “The expense was not saved: fix the errors” and the links `#expense-label`, then `#expense-category` with their error texts — the amount `12.5` is valid, so it is not in the summary."
      - when: { test: "a failed submit moves focus to the summary, every time" }
        message:
          uk: "Ця перевірка двічі надсилає недійсну форму й щоразу чекає фокус на `#error-summary`. Зведенню потрібні `tabIndex={-1}` і `ref={summaryRef}`, `focus()` — в ефекті, що залежить від лічильника невдалих надсилань, а кнопка «Зберегти» має лишатися активною для другого надсилання."
          en: "This check submits an invalid form twice and each time expects focus on `#error-summary`. The summary needs `tabIndex={-1}` and `ref={summaryRef}`, `focus()` belongs in an effect that depends on the failed-submit counter, and the “Save” button must stay active for the second submit."
      - when: { test: "after fixing the errors, submitting saves the expense and clears the errors" }
        message:
          uk: "Ця перевірка спершу надсилає порожню форму, потім правильну («Обід», `210.50`, «Їжа») і чекає в списку «Обід — 210.50», без зведення й без `aria-invalid`. Кнопка «Зберегти» має лишатися активною й після невдалого надсилання."
          en: "This check first submits an empty form, then a valid one (“Lunch”, `210.50`, “Food”), and expects “Lunch — 210.50” in the list, with no summary and no `aria-invalid`. The “Save” button must stay active after a failed submit too."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: placeholder-label
        from: js-06-01-forms-inputs-labels
        prompt:
          uk: "Поле суми має лише `placeholder=\"Сума, грн\"` і жодного `<label>`. Що з цього правда?"
          en: "The amount field has only `placeholder=\"Amount, UAH\"` and no `<label>`. Which of these is true?"
        answer:
          type: choice
          options:
            - id: placeholder-fallback
              text: { uk: "Chrome назве поле за `placeholder`, але щойно людина почне друкувати, на екрані зникне те, для чого це поле", en: "Chrome names the field by its `placeholder`, but as soon as the person starts typing, the screen no longer shows what the field is for" }
            - id: no-name
              text: { uk: "У поля немає жодної назви, програма екранного читання скаже лише «поле редагування»", en: "The field has no name at all, a screen reader says only “edit text”" }
              why:
                uk: "Поле, назване лише `placeholder`, у Chrome отримує назву з нього — як запасний варіант. Проблема в іншому: підказка зникає під час набору й погано читається."
                en: "A field named only by its `placeholder` gets its name from it in Chrome — as a fallback. The problem is elsewhere: the hint disappears while typing and is hard to read."
            - id: placeholder-ok
              text: { uk: "Це повноцінна заміна підпису", en: "It is a full replacement for a label" }
              why:
                uk: "Підпис видно завжди, і клік по ньому ставить курсор у поле. `placeholder` зникає, щойно людина друкує."
                en: "A label is always visible, and clicking it puts the cursor into the field. A `placeholder` disappears as soon as the person types."
          correct: [placeholder-fallback]
        explanation:
          uk: "Кожне поле отримує видимий `<label>`. Помилка — це вже **опис** поля через `aria-describedby`, а не його назва: назва каже, що це за поле, опис — що з ним не так."
          en: "Every field gets a visible `<label>`. An error is the field's **description** through `aria-describedby`, not its name: the name says what the field is, the description says what is wrong with it."

  - id: to-project
    kind: transfer
    capstoneStep: RE-05
    body:
      uk: "У формі редагування проєкту валідатор домену (`validateItem`, `validateTask`, `validateHabit` чи `validateExpense`) уже повертає ключі помилок. Додай до них тексти обома мовами, зв’яжи кожне повідомлення з полем через `aria-describedby`, позначай поле `aria-invalid` і переводь фокус після невдалого «Зберегти» — на зведення чи на перше недійсне поле."
      en: "In the project's edit form, the domain validator (`validateItem`, `validateTask`, `validateHabit` or `validateExpense`) already returns error keys. Add texts for them in both languages, connect each message to its field with `aria-describedby`, mark the field with `aria-invalid` and move focus after a failed “Save” — to a summary or to the first invalid field."
