id: re-05-09-independent-list-detail-edit
unit: RE-05
title:
  uk: "Самостійно: сценарій список/деталі/редагування"
  en: "Independent: list/detail/edit flow"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Перевірка без підказок: чи зібереш ти сам увесь розділ в одному сценарії — вкладені маршрути з параметрами, правильне «Назад», чотири стани завантаження, доступну помилку форми, охорону незбережених змін і фокус після кожного переходу, — так, щоб приховані перевірки, які відкривають неіснуючий id, натискають «Назад» зі зміненої й незміненої форми, надсилають порожню назву з клавіатури, порожній список і збій завантаження, не знайшли жодної діри."
  en: "A check without hints: can you put the whole unit together in one flow on your own — nested routes with params, correct Back behavior, four loading states, an accessible form error, a guard for unsaved edits and focus after every transition — so that hidden checks which open a nonexistent id, press Back from a changed and an unchanged form, submit an empty name from the keyboard, empty the list and force a load failure find no hole?"
objectives:
  - uk: "Без підказок побудувати сценарій список/деталі/редагування на мінімальному маршрутизаторі курсу з параметрами, вкладеними маршрутами, правильним «Назад», доступною валідацією та явними станами завантаження, порожнечі й помилки."
    en: "Build, without hints, a list/detail/edit flow on the course's minimal router with params, nested routes, correct Back behavior, accessible validation and explicit loading, empty and error states."
prerequisites: [re-05-08-debug-route-form-flow]
subskills:
  - { family: R-05, skill: "nested routes/params/history", depth: assess }
  - { family: R-05, skill: "loading/empty/error states", depth: assess }
glossary: []
selfCheck: [habit-flow]

blocks:
  - id: habit-flow
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-react
    dir: habit-flow
    entry: main.jsx
    editable: [App.jsx]
    strings:
      historyLabel: { uk: "Історія переходів", en: "Navigation history" }
      back: { uk: "Назад", en: "Back" }
      forward: { uk: "Вперед", en: "Forward" }
