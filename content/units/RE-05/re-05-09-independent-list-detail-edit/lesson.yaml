      habits: { uk: "Звички", en: "Habits" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      serverDown: { uk: "Сервер не відповідає", en: "The server does not answer" }
