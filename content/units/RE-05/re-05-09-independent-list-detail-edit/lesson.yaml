      leave: { uk: "Піти без збереження", en: "Leave without saving" }
    title:
      uk: "Трекер звичок: список, деталі, редагування"
      en: "Habit tracker: list, detail, edit"
    instructions:
      uk: |
        Збери в `App.jsx` трекер звичок на маршрутизаторі курсу. Готові: `router.jsx`, `HistoryPanel.jsx`, несправжній сервер `habitsApi.js` (`loadHabits()` відповідає за 0,3 с), валідатор `validateHabit`, тексти `MESSAGES` і `FREQUENCY` у `habits.js`. `App` уже створює власну історію з пропа `initialPath` (типово `/habits`) — залиш це, перевірки ним користуються.

        **Маршрути.** `/habits` — макет, вкладені в нього `/habits/:id` (деталі) і `/habits/:id/edit` (редагування); будь-яка інша адреса — екран «Звичку не знайдено».

        **Макет `/habits`** завантажує звички один раз і показує:

        - елемент `role="status"` з текстом «Завантажую звички…», «Звичок: 3» (з кількістю), «Звичок поки немає.» або «Не вдалося завантажити звички.»;
        - при помилці — кнопку «Спробувати ще раз», що завантажує знову;
        - коли звички є, — список посилань на `/habits/:id` з їхніми назвами;
        - `<main>` з екраном вкладеного маршруту; без вкладеного — заголовок «Звички».

        **Екрани в `<main>`** мають заголовок `<h1>`:

        - деталі — назва звички, її частота (`FREQUENCY`) і посилання «Редагувати»;
        - невідомий id і на деталях, і на редагуванні — `<h1>` «Звичку не знайдено»;
        - редагування — `<h1>` «Редагування звички», поле `id="habit-name"` з підписом «Назва», список `id="habit-frequency"` з підписом «Частота» (`daily`/`weekly`) і кнопка «Зберегти».

        **Поведінка:**

        - «Зберегти» перевіряє `validateHabit`; помилку назви показує текстом `MESSAGES`, пов’язаним із полем через `aria-describedby`, ставить полю `aria-invalid="true"` і переводить фокус на поле; правильні дані зберігає й переходить на деталі **заміною** запису історії, без питання;
        - поки назва чи частота відрізняються від збережених, «← Назад» і посилання питають `role="alertdialog"` з кнопками «Лишитися» й «Піти без збереження», а `beforeunload` скасовується; без змін — нічого не питається;
        - після кожної зміни маршруту (не під час першого відкриття) фокус стоїть на `<h1>` нового екрана.

        Перевірки монтують окремі копії застосунку, змінюють відповіді сервера (порожній список, збій) і самі вирішують, коли він відповідає (`holdAnswers` у `habitsApi.js`), відкривають неіснуючий id, працюють з клавіатури й самі надсилають `beforeunload`.
      en: |
        Build a habit tracker on the course router in `App.jsx`. Ready-made: `router.jsx`, `HistoryPanel.jsx`, the fake server `habitsApi.js` (`loadHabits()` answers in 0.3 s), the validator `validateHabit` and the texts `MESSAGES` and `FREQUENCY` in `habits.js`. `App` already creates its own history from the `initialPath` prop (`/habits` by default) — keep that, the checks use it.

        **Routes.** `/habits` is a layout with `/habits/:id` (detail) and `/habits/:id/edit` (edit) nested in it; any other address shows the “Habit not found” screen.

        **The `/habits` layout** loads the habits once and shows:

        - an element with `role="status"` and the text “Loading habits…”, “Habits: 3” (with the count), “No habits yet.” or “Could not load the habits.”;
        - on an error, a “Try again” button that loads again;
        - when there are habits, a list of links to `/habits/:id` with their names;
        - a `<main>` with the nested route's screen; with no nested route, the heading “Habits”.

        **The screens in `<main>`** have an `<h1>` heading:

        - detail — the habit's name, its frequency (`FREQUENCY`) and an “Edit” link;
        - an unknown id, on both detail and edit — the `<h1>` “Habit not found”;
        - edit — the `<h1>` “Editing a habit”, a field `id="habit-name"` labelled “Name”, a select `id="habit-frequency"` labelled “Frequency” (`daily`/`weekly`) and a “Save” button.

        **Behavior:**

        - “Save” checks with `validateHabit`; it shows a name error as `MESSAGES` text connected to the field with `aria-describedby`, gives the field `aria-invalid="true"` and moves focus to the field; valid data is saved, and the app moves to the detail by **replacing** the history entry, without a question;
        - while the name or the frequency differs from the saved one, “← Back” and links ask with a `role="alertdialog"` holding the buttons “Stay” and “Leave without saving”, and `beforeunload` is canceled; with no edits nothing asks;
        - after every route change (not on the first open) focus is on the new screen's `<h1>`.

        The checks mount separate copies of the app, change the server's answers (an empty list, a failure) and decide themselves when it answers (`holdAnswers` in `habitsApi.js`), open a nonexistent id, work from the keyboard and dispatch `beforeunload` themselves.
    testTitles:
      "the list shows a loading status, then the habits":
        uk: "Список показує стан завантаження, а потім звички"
        en: "The list shows a loading status, then the habits"
      "an empty list says so and shows no list":
        uk: "Порожній список так і каже й не показує списку"
        en: "An empty list says so and shows no list"
      "a failed load shows its own error and a retry that loads again":
        uk: "Збій завантаження показує власну помилку й повтор, що завантажує знову"
        en: "A failed load shows its own error and a retry that loads again"
      "opening a habit shows its details and moves focus to its heading":
        uk: "Відкрита звичка показує деталі, а фокус — на її заголовку"
        en: "Opening a habit shows its details and moves focus to its heading"
      "an unknown id shows the not-found screen, on detail and on edit":
        uk: "Невідомий id показує «не знайдено» і на деталях, і на редагуванні"
        en: "An unknown id shows the not-found screen, on detail and on edit"
      "Back from an unchanged edit form leaves without asking":
        uk: "«Назад» із незміненої форми виходить без питання"
        en: "Back from an unchanged edit form leaves without asking"
      "Back from a changed edit form asks; Stay keeps the draft, Leave discards it":
        uk: "«Назад» зі зміненої форми питає; «Лишитися» зберігає чернетку, «Піти» — відкидає"
        en: "Back from a changed edit form asks; Stay keeps the draft, Leave discards it"
      "reloading is guarded only while the edit form is changed":
        uk: "Перезавантаження охороняється лише поки форма змінена"
        en: "Reloading is guarded only while the edit form is changed"
      "submitting an empty name by keyboard shows an accessible error and focuses the field":
        uk: "Порожня назва, надіслана з клавіатури, дає доступну помилку й фокус на полі"
        en: "An empty name submitted from the keyboard gives an accessible error and focuses the field"
      "a valid edit is saved without asking and shown on the detail screen":
        uk: "Правильні зміни зберігаються без питання й видні на екрані деталей"
        en: "A valid edit is saved without asking and shown on the detail screen"
    solutionNote:
      uk: "Макет володіє станом завантаження (одне значення з чотирьох варіантів) і зберігає зміни, тож список, деталі й форма бачать ті самі дані. Екрани деталей і редагування знаходять запис за текстом `:id` і мають власний стан «не знайдено». Форма тримає повну чернетку з першого рендеру, порівнює її зі збереженим записом для охорони й `beforeunload`, а «Зберегти» переходить заміною з `skipGuard` — «Назад» після збереження не повертає форму. Фокус ставиться в ефектах після commit: на заголовок після переходу й на поле після невдалого надсилання."
      en: "The layout owns the loading status (one value with four members) and stores edits, so the list, the detail and the form see the same data. The detail and edit screens find the record by the `:id` text and have their own not-found state. The form keeps a full draft from the first render, compares it with the saved record for the guard and `beforeunload`, and “Save” navigates with a replace and `skipGuard` — Back after saving does not bring the form back. Focus is set in effects after the commit: on the heading after a transition and on the field after a failed submit."
    feedback:
      - when: { test: "the list shows a loading status, then the habits" }
        message:
          uk: "Ця перевірка одразу після монтування чекає в `role=\"status\"` «Завантажую звички…», а після завантаження — «Звичок: 3» і три посилання з назвами звичок. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "Right after mounting this check expects “Loading habits…” in `role=\"status\"`, and after loading “Habits: 3” and three links with the habit names. If every check fails at once, fix the first error in the console first."
      - when: { test: "an empty list says so and shows no list" }
        message:
          uk: "Ця перевірка просить сервер повернути порожній масив і чекає «Звичок поки немає.» без жодного посилання в списку."
          en: "This check asks the server for an empty array and expects “No habits yet.” with no links in the list."
      - when: { test: "a failed load shows its own error and a retry that loads again" }
        message:
          uk: "Ця перевірка змушує завантаження впасти й чекає «Не вдалося завантажити звички.» (не порожній стан), потім натискає «Спробувати ще раз» і чекає «Завантажую звички…», а далі — список."
          en: "This check makes the load fail and expects “Could not load the habits.” (not the empty state), then presses “Try again” and expects “Loading habits…” and then the list."
      - when: { test: "opening a habit shows its details and moves focus to its heading" }
        message:
          uk: "Ця перевірка відкриває «Прибирання» й чекає `<h1>` з назвою, текст частоти «щотижня» і фокус на цьому `<h1>`, а після «Редагувати» — фокус на `<h1>` форми."
          en: "This check opens “Tidy up” and expects an `<h1>` with the name, the frequency text “weekly” and focus on that `<h1>`, and after “Edit” focus on the form's `<h1>`."
      - when: { test: "an unknown id shows the not-found screen, on detail and on edit" }
        message:
          uk: "Ця перевірка відкриває застосунок одразу на `/habits/h-99` і на `/habits/h-99/edit` та чекає `<h1>` «Звичку не знайдено» поруч зі списком із трьох звичок."
          en: "This check opens the app directly at `/habits/h-99` and at `/habits/h-99/edit` and expects the `<h1>` “Habit not found” next to the list of three habits."
      - when: { test: "Back from an unchanged edit form leaves without asking" }
        message:
          uk: "Ця перевірка відкриває форму, нічого не змінює, натискає «← Назад» і чекає деталі без жодного `role=\"alertdialog\"`."
          en: "This check opens the form, changes nothing, presses “← Back” and expects the detail without any `role=\"alertdialog\"`."
      - when: { test: "Back from a changed edit form asks; Stay keeps the draft, Leave discards it" }
        message:
          uk: "Ця перевірка дописує `!` до назви, натискає «← Назад» (питання), «Лишитися» (чернетка на місці), клікає іншу звичку (питання) і «Піти без збереження» — та чекає деталі іншої звички й незмінений список."
          en: "This check adds `!` to the name, presses “← Back” (a question), “Stay” (the draft is still there), clicks another habit (a question) and “Leave without saving” — and expects the other habit's detail and an unchanged list."
      - when: { test: "reloading is guarded only while the edit form is changed" }
        message:
          uk: "Ця перевірка змінює частоту на `weekly` і назад, щоразу надсилаючи `beforeunload`: скасовано має бути лише поки частота відрізняється від збереженої."
          en: "This check changes the frequency to `weekly` and back, dispatching `beforeunload` each time: it must be canceled only while the frequency differs from the saved one."
      - when: { test: "submitting an empty name by keyboard shows an accessible error and focuses the field" }
        message:
          uk: "Ця перевірка очищає назву й натискає Enter у полі. Вона чекає на полі `aria-invalid=\"true\"`, `aria-describedby` з текстом «Введи назву звички.», фокус на полі й ту саму форму на екрані; потім натискає «Зберегти» ще раз і знову чекає фокус на полі."
          en: "This check clears the name and presses Enter in the field. It expects `aria-invalid=\"true\"` on the field, an `aria-describedby` with the text “Enter the habit's name.”, focus on the field and the same form on the screen; then it presses “Save” again and expects focus on the field once more."
      - when: { test: "a valid edit is saved without asking and shown on the detail screen" }
        message:
          uk: "Ця перевірка вводить «  Прогулянка  » і «щотижня», натискає «Зберегти» й чекає деталі «Прогулянка» без питання, фокус на заголовку, оновлений список, а після «← Назад» — не форму редагування."
          en: "This check enters “  Go for a walk  ” and “weekly”, presses “Save” and expects the “Go for a walk” detail without a question, focus on the heading, an updated list, and after “← Back” not the edit form."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: reducer-for-status
        from: re-04-03-reducers-typed
        prompt:
          uk: "Стан екрана звичок — `{ kind: \"loading\" } | { kind: \"empty\" } | { kind: \"error\" } | { kind: \"ready\", habits }`. Його переходи можна описати reducer з actions `started`, `loaded`, `failed`. Що має повертати такий reducer на action `loaded` з порожнім масивом?"
          en: "The habit screen's status is `{ kind: \"loading\" } | { kind: \"empty\" } | { kind: \"error\" } | { kind: \"ready\", habits }`. Its transitions can be described with a reducer with the actions `started`, `loaded`, `failed`. What should such a reducer return for a `loaded` action with an empty array?"
        answer:
          type: choice
          options:
            - id: new-empty
              text: { uk: "Новий об’єкт `{ kind: \"empty\" }`", en: "A new object `{ kind: \"empty\" }`" }
            - id: mutate
              text: { uk: "Той самий об’єкт стану, у якого змінено `kind` на `\"empty\"`", en: "The same state object with its `kind` changed to `\"empty\"`" }
              why:
                uk: "Reducer не змінює стан, який отримав: React порівнює старе й нове значення як `Object.is`, і змінений на місці об’єкт виглядає «тим самим» — екран не оновиться."
                en: "A reducer does not change the state it receives: React compares the old and new values as `Object.is`, and an object changed in place looks “the same” — the screen does not update."
            - id: ready-empty
              text: { uk: "`{ kind: \"ready\", habits: [] }`", en: "`{ kind: \"ready\", habits: [] }`" }
              why:
                uk: "Так «порожньо» сховається всередині «готово», і екран мусить окремо перевіряти довжину. Окремий варіант `empty` робить порожній стан явним — зі своїми словами й дією."
                en: "That hides “empty” inside “ready”, and the screen has to check the length separately. A separate `empty` member makes the empty state explicit — with its own words and action."
          correct: [new-empty]
        explanation:
          uk: "Кожен перехід повертає нове значення одного з чотирьох варіантів. Так reducer зі своїм `switch` і `never`-перевіркою стає тим самим автоматом станів, що й діаграма з уроку про стани завантаження."
          en: "Every transition returns a new value of one of the four members. That way a reducer with its `switch` and `never` check becomes the same state machine as the diagram from the lesson on loading states."
