      nameTooLong: { uk: "Назва — не довше за 80 символів.", en: "The name is at most 80 characters." }
      frequencyInvalid: { uk: "Обери частоту: щодня або щотижня.", en: "Choose a frequency: daily or weekly." }
      unsaved: { uk: "Є незбережені зміни. Піти без збереження?", en: "There are unsaved changes. Leave without saving?" }
