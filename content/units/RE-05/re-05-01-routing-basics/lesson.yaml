id: re-05-01-routing-basics
unit: RE-05
title:
  uk: "Маршрути, посилання та історія"
  en: "Routes, links and history"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Зіставити шляхи URL з екранами через таблицю маршрутів і переходити посиланнями, які додають записи в історію без повного завантаження сторінки."
    en: "Map URL paths to screens with a route table and navigate with links that add history entries without a full page reload."
  - uk: "Передбачити, що покажуть «Назад» і «Вперед» після послідовності кліків по посиланнях і після переходу з заміною (replace)."
    en: "Predict what Back and Forward show after a sequence of link clicks and after a replace-style navigation."
prerequisites: [re-04-04-context-boundaries, js-16-01-url-query-encoding]
subskills:
  - { family: R-05, skill: "nested routes/params/history", depth: intro }
glossary: [route, client-side-routing, history-entry]
selfCheck: [predict-replace, wish-route-table]

blocks:
  - id: address-to-screen
    kind: explanation
    title:
      uk: "Маршрут: адреса → екран"
      en: "A route: address → screen"
    body:
      uk: |
        Досі кожен приклад мав один екран. Справжній застосунок має кілька: список бажань, одне бажання, форму редагування. І в кожного екрана своя адреса — шлях в URL, як `/items` чи `/items/w-02`. Тоді екран можна відкрити з закладки, надіслати посиланням, а кнопка «Назад» повертає на попередній.

        [[route|Маршрут]] — це пара «шлях → екран». Таблиця маршрутів — список таких пар:

        ```jsx
        const routes = [
          { path: "/items", element: <ItemList /> },
          { path: "/about", element: <About /> },
        ];
        ```

        Звичайне посилання `<a href="/about">` просить браузер **завантажити нову сторінку**: усе, що жило на старій, — стан, набраний текст, — зникає. [[client-side-routing|Маршрутизація на боці клієнта]] робить інакше: обробник кліку скасовує завантаження (`preventDefault()`), код сам показує інший екран і лише додає запис в історію. Сторінка та сама, а стан живе далі.
      en: |
        So far every example had one screen. A real app has several: the wish list, one wish, an edit form. And each screen has its own address — a path in the URL, like `/items` or `/items/w-02`. Then a screen can be opened from a bookmark, sent as a link, and the Back button returns to the previous one.

        A [[route]] is a pair “path → screen”. A route table is a list of such pairs:

        ```jsx
        const routes = [
          { path: "/items", element: <ItemList /> },
          { path: "/about", element: <About /> },
        ];
        ```

        An ordinary link `<a href="/about">` asks the browser to **load a new page**: everything that lived on the old one — state, typed text — is gone. [[client-side-routing|Client-side routing]] works differently: the click handler cancels the load (`preventDefault()`), the code shows another screen itself and only adds an entry to the history. The page stays the same, and state lives on.

  - id: history-stack
    kind: explanation
    title:
      uk: "Історія — це стек записів"
      en: "History is a stack of entries"
    body:
      uk: |
        Кожна вкладка браузера пам’ятає, де ти був: це стек [[history-entry|записів історії]] і позначка «ми тут». Чотири дії змінюють його по-різному:

        | Дія | Що стається зі стеком |
        |---|---|
        | `push("/about")` | новий запис стає поточним одразу після поточного; записи, що були «попереду», відрізаються |
        | `replace("/about")` | **поточний** запис переписується на `/about`; кількість записів не змінюється |
        | `back()` | поточним стає попередній запис; жоден запис не зникає |
        | `forward()` | поточним стає наступний запис, якщо він є |

        Бібліотеку маршрутизації курс поки не обирає, тож у прикладах працює маленький маршрутизатор курсу — файл `router.jsx`. Він дає `<Router>`, `<Routes routes={…}>`, `<Link to="…">`, `useNavigate()` і `useHistory()`. Читати його код не обов’язково: досить знати, що `<Link>` малює справжній `<a href>` і скасовує завантаження.

        Одна чесна різниця: сторінка в пісочниці не має власного рядка адреси й кнопок браузера. Тому стек живе в пам’яті (`createMemoryHistory`), а `HistoryPanel` малює його й кнопки «Назад» і «Вперед» застосунку. У вкладці браузера той самий стек — це історія вкладки: `history.pushState()` додає запис без завантаження, а кнопка браузера «Назад» запускає подію `popstate`.
      en: |
        Every browser tab remembers where you have been: a stack of [[history-entry|history entries]] and a “you are here” mark. Four actions change it in different ways:

        | Action | What happens to the stack |
        |---|---|
        | `push("/about")` | a new entry becomes current right after the current one; entries that were “ahead” are cut off |
        | `replace("/about")` | the **current** entry is rewritten to `/about`; the number of entries stays the same |
        | `back()` | the previous entry becomes current; no entry disappears |
        | `forward()` | the next entry becomes current, if there is one |

        The course does not pick a routing library yet, so the examples use the course's small router — the file `router.jsx`. It provides `<Router>`, `<Routes routes={…}>`, `<Link to="…">`, `useNavigate()` and `useHistory()`. You do not have to read its code: it is enough to know that `<Link>` draws a real `<a href>` and cancels the load.

        One honest difference: a sandbox page has no address bar and no browser buttons of its own. So the stack lives in memory (`createMemoryHistory`), and `HistoryPanel` draws it along with the app's Back and Forward buttons. In a browser tab the same stack is the tab's history: `history.pushState()` adds an entry without a load, and the browser's Back button fires the `popstate` event.

  - id: predict-reload
    kind: prediction
    strings:
      loaded: { uk: "Сторінку завантажено", en: "Page loaded" }
    prompt:
      uk: "`main.jsx` друкує «Сторінку завантажено» один раз, коли модуль виконується. Застосунок відкрився на `/items`. Людина клікнула посилання `<Link>` на бажання, потім посилання «Редагувати», а потім кнопку «Зберегти», яка переходить через `navigate`. Скільки разів у консолі буде «Сторінку завантажено»?"
      en: "`main.jsx` prints “Page loaded” once, when the module runs. The app opened at `/items`. The person clicked a `<Link>` to a wish, then the “Edit” link, and then the “Save” button, which navigates with `navigate`. How many times does the console show “Page loaded”?"
    code: |
      // main.jsx
      console.log("%%loaded%%");
      createRoot(document.getElementById("root")).render(<App />);
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: once
          text: { uk: "Один раз", en: "Once" }
        - id: four
          text: { uk: "Чотири рази: під час відкриття й після кожного кліку", en: "Four times: on opening and after every click" }
          why:
            uk: "Так було б зі звичайними посиланнями: кожне завантажувало б нову сторінку й виконувало модулі знову. `<Link>` скасовує завантаження: React лише показує інший екран у тій самій сторінці, тож модуль не виконується вдруге."
            en: "That is what ordinary links would do: each would load a new page and run the modules again. `<Link>` cancels the load: React only shows another screen in the same page, so the module does not run a second time."
        - id: none
          text: { uk: "Жодного разу: застосунок з маршрутами не виконує `main.jsx`", en: "Never: an app with routes does not run `main.jsx`" }
          why:
            uk: "`main.jsx` — вхідний модуль: він виконується, щойно сторінка завантажилась, з маршрутами чи без. Саме він малює застосунок у `#root`."
            en: "`main.jsx` is the entry module: it runs as soon as the page loads, with routes or without. It is what draws the app into `#root`."
      correct: [once]
    explanation:
      uk: "Модуль виконується один раз на завантаження сторінки. Перехід через `<Link>` — це не завантаження, а новий рендер: `Routes` бачить інший шлях і показує інший елемент. Тому й стан застосунку переживає перехід. Перевірено в прикладі цього уроку: після трьох переходів у консолі досі один рядок."
      en: "A module runs once per page load. A transition through `<Link>` is not a load but a new render: `Routes` sees another path and shows another element. That is also why the app's state survives the transition. Checked in this lesson's example: after three transitions the console still shows one line."

  - id: predict-back-twice
    kind: prediction
    prompt:
      uk: "Застосунок відкрився на `/items`. Людина клікає посилання на `/items/w-02`, потім на `/items/w-02/edit`, а потім двічі натискає «Назад». Усі переходи — через `push`. Що вона бачить і що в стеку?"
      en: "The app opened at `/items`. The person clicks a link to `/items/w-02`, then one to `/items/w-02/edit`, and then presses Back twice. Every transition is a `push`. What does the person see, and what is in the stack?"
    answer:
      type: choice
      options:
        - id: list-three
          text: { uk: "Список `/items`; у стеку три записи, поточний — перший, «Вперед» поверне до `/items/w-02`", en: "The list `/items`; the stack has three entries, the current one is the first, Forward returns to `/items/w-02`" }
        - id: list-one
          text: { uk: "Список `/items`; у стеку лишився один запис", en: "The list `/items`; one entry is left in the stack" }
          why:
            uk: "«Назад» не видаляє записів, а лише пересуває позначку «ми тут». Записи попереду лишаються — саме на них веде «Вперед». Відрізає їх лише новий `push` із середини стеку."
            en: "Back does not delete entries, it only moves the “you are here” mark. The entries ahead stay — that is where Forward leads. Only a new `push` from the middle of the stack cuts them off."
        - id: detail
          text: { uk: "Деталі `/items/w-02`: «Назад» спершу закриває форму, а потім лише повертає на крок", en: "The detail `/items/w-02`: Back first closes the form and only then goes one step back" }
          why:
            uk: "Кожне натискання «Назад» пересуває позначку рівно на один запис: перше — з форми на деталі, друге — з деталей на список."
            en: "Every press of Back moves the mark exactly one entry: the first one from the form to the detail, the second from the detail to the list."
      correct: [list-three]
    explanation:
      uk: "Після двох `push` стек такий: `/items`, `/items/w-02`, `/items/w-02/edit`. Два «Назад» пересувають позначку на `/items`, а два інші записи чекають на «Вперед». Перевір це в прикладі цього уроку: `HistoryPanel` позначає поточний запис."
      en: "After two pushes the stack is `/items`, `/items/w-02`, `/items/w-02/edit`. Two Backs move the mark to `/items`, and the other two entries wait for Forward. Check it in this lesson's example: `HistoryPanel` marks the current entry."

  - id: wish-routes
    kind: example
    runtime: browser-react
    dir: wish-routes
    entry: main.jsx
    strings:
      loaded: { uk: "Сторінку завантажено", en: "Page loaded" }
      historyLabel: { uk: "Історія переходів", en: "Navigation history" }
      back: { uk: "Назад", en: "Back" }
      forward: { uk: "Вперед", en: "Forward" }
      now: { uk: "ми тут", en: "you are here" }
      wishes: { uk: "Мої бажання", en: "My wishes" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      price: { uk: "Ціна", en: "Price" }
      edit: { uk: "Редагувати", en: "Edit" }
      editing: { uk: "Редагування бажання", en: "Editing a wish" }
      formPlaceholder: { uk: "Тут буде форма — її ти напишеш у наступних уроках.", en: "A form will be here — you will write it in the next lessons." }
      save: { uk: "Зберегти", en: "Save" }
    title:
      uk: "Три маршрути й стек історії"
      en: "Three routes and the history stack"
    body:
      uk: |
        У `App.jsx` — таблиця з трьох маршрутів: список, одне бажання й форма редагування. `HistoryPanel` зверху показує стек історії, позначку «ми тут» і кнопки застосунку «Назад» та «Вперед».

        Натисни **Запустити**. На вкладці **Сторінка** клікни «Настільна лампа», потім «Редагувати», потім «Зберегти». Тепер двічі натисни «← Назад» і стеж за стеком: записи не зникають, рухається лише позначка.
      en: |
        `App.jsx` has a table of three routes: the list, one wish and the edit form. `HistoryPanel` at the top shows the history stack, the “you are here” mark and the app's Back and Forward buttons.

        Press **Run**. On the **Page** tab click “Desk lamp”, then “Edit”, then “Save”. Now press “← Back” twice and watch the stack: entries do not disappear, only the mark moves.
    tryIt:
      uk: |
        1. Після «Зберегти» у стеку **чотири** записи, і «Назад» повертає… на форму, яку ти щойно зберіг. У `ItemEdit` заміни `navigate("/items/w-02")` на `navigate("/items/w-02", { replace: true })`. Запусти й пройди той самий шлях: записів три, а запис форми переписано адресою деталей. Перше «Назад» покаже деталі ще раз — це запис, який був **до** форми, — друге поверне до списку.
        2. У `ItemList` заміни `<Link to="/items/w-02">` на `<a href="/items/w-02">`, а закривальний `</Link>` — на `</a>`. Запусти й клікни бажання: екран не змінився, а консоль показує повідомлення платформи «Перехід за посиланням /items/w-02 заблоковано: він закрив би твою програму.». Звичайне посилання завантажило б нову сторінку, і програма разом з усім станом зникла б. Поверни `<Link>`.
      en: |
        1. After “Save” the stack has **four** entries, and Back returns… to the form you have just saved. In `ItemEdit` replace `navigate("/items/w-02")` with `navigate("/items/w-02", { replace: true })`. Run it and take the same path: there are three entries, and the form's entry has been rewritten with the detail address. The first Back shows the detail once more — that is the entry from **before** the form — and the second returns to the list.
        2. In `ItemList` replace `<Link to="/items/w-02">` with `<a href="/items/w-02">`, and the closing `</Link>` with `</a>`. Run it and click the wish: the screen did not change, and the console shows the platform's message “Following the link /items/w-02 was blocked: it would close your program.”. An ordinary link would load a new page, and the program would be gone together with all its state. Put `<Link>` back.

  - id: predict-replace
    kind: prediction
    prompt:
      uk: "Застосунок відкрився на `/items`. Людина переходить на `/items/w-02`, потім на `/items/w-02/edit` (обидва рази `push`), а кнопка «Зберегти» виконує `navigate(\"/items/w-02\", { replace: true })`. Після «Зберегти» людина натискає «Назад» один раз. Що на екрані?"
      en: "The app opened at `/items`. The person goes to `/items/w-02`, then to `/items/w-02/edit` (both times `push`), and the Save button runs `navigate(\"/items/w-02\", { replace: true })`. After Save the person presses Back once. What is on the screen?"
    answer:
      type: choice
      options:
        - id: detail-again
          text: { uk: "Знову деталі `/items/w-02`: у стеку `/items`, `/items/w-02`, `/items/w-02`", en: "The detail `/items/w-02` again: the stack is `/items`, `/items/w-02`, `/items/w-02`" }
        - id: edit-form
          text: { uk: "Форма `/items/w-02/edit`", en: "The form `/items/w-02/edit`" }
          why:
            uk: "Так було б із `push`: він додав би четвертий запис, і «Назад» повернув би на форму. `replace` не додає запис, а переписує поточний — запису форми в стеку вже немає."
            en: "That is what `push` would do: it would add a fourth entry, and Back would return to the form. `replace` adds no entry but rewrites the current one — the form's entry is no longer in the stack."
        - id: list
          text: { uk: "Список `/items`: `replace` прибрав зайві записи", en: "The list `/items`: `replace` removed the extra entries" }
          why:
            uk: "`replace` змінює лише **поточний** запис. Запис `/items/w-02`, зроблений до форми, лишився на місці, тож перше «Назад» веде на нього."
            en: "`replace` changes only the **current** entry. The `/items/w-02` entry made before the form stays where it was, so the first Back leads to it."
      correct: [detail-again]
    explanation:
      uk: "`replace` переписав запис форми адресою деталей, тому в стеку двічі поспіль `/items/w-02`. «Назад» показує деталі ще раз, і лише друге «Назад» веде до списку. Зате форма вже ніколи не з’явиться на «Назад» після збереження — заради цього `replace` і використовують."
      en: "`replace` rewrote the form's entry with the detail address, so the stack holds `/items/w-02` twice in a row. Back shows the detail once more, and only the second Back leads to the list. In return, the form never reappears on Back after saving — that is what `replace` is used for."

  - id: stack-steps
    kind: visual
    visual: diagram
    title:
      uk: "Таблиця маршрутів і стек історії"
      en: "The route table and the history stack"
    textEquivalent:
      uk: >-
        Угорі — таблиця маршрутів: /items показує ItemList, /items/w-02 — ItemDetail, /items/w-02/edit — ItemEdit.
        Унизу — стек історії. Сторінка відкривається на /items: у стеку один запис, і таблиця знаходить ItemList.
        Клік по посиланню на бажання — це push: у стеку з’являється запис 1 /items/w-02, і він стає поточним; таблиця
        знаходить ItemDetail. Клік «Редагувати» — ще один push: запис 2 /items/w-02/edit і екран ItemEdit. «Назад»
        пересуває позначку на запис 1: знову ItemDetail, а запис 2 лишається в стеку для «Вперед». «Вперед» повертає
        на запис 2 і форму. «Зберегти» з replace переписує запис 2 на /items/w-02: записів так само три, і поточний
        показує ItemDetail. Тепер «Назад» веде на запис 1 — теж /items/w-02, тобто деталі ще раз, — а форма в стеку
        вже не трапиться.
      en: >-
        At the top is the route table: /items shows ItemList, /items/w-02 shows ItemDetail, /items/w-02/edit shows
        ItemEdit. At the bottom is the history stack. The page opens at /items: the stack has one entry, and the table
        finds ItemList. Clicking the link to the wish is a push: entry 1 /items/w-02 appears in the stack and becomes
        current; the table finds ItemDetail. Clicking Edit is another push: entry 2 /items/w-02/edit and the ItemEdit
        screen. Back moves the mark to entry 1: ItemDetail again, while entry 2 stays in the stack for Forward. Forward
        returns to entry 2 and the form. Save with replace rewrites entry 2 to /items/w-02: there are still three
        entries, and the current one shows ItemDetail. Now Back leads to entry 1 — also /items/w-02, so the detail
        once more — and the form will not turn up in the stack again.
    spec:
      layout: grid
      groups:
        - { id: table, label: { uk: "Таблиця маршрутів", en: "Route table" } }
        - { id: stack, label: { uk: "Стек історії", en: "History stack" } }
      nodes:
        - { id: r-list, group: table, col: 0, row: 0, label: "/items → ItemList", w: 230 }
        - { id: r-detail, group: table, col: 0, row: 1, label: "/items/w-02 → ItemDetail", w: 230 }
        - { id: r-edit, group: table, col: 0, row: 2, label: "/items/w-02/edit → ItemEdit", w: 230 }
        - { id: e0, group: stack, col: 0, row: 3, label: "0 · /items", shape: pill, w: 230 }
        - { id: e1, group: stack, col: 0, row: 4, label: "1 · /items/w-02", shape: pill, w: 230 }
        - { id: e2, group: stack, col: 0, row: 5, label: "2 · /items/w-02/edit", shape: pill, w: 230 }
        - { id: e2r, group: stack, col: 0, row: 6, label: "2 · /items/w-02", shape: pill, w: 230 }
      hidden: [e1, e2, e2r]
      steps:
        - caption:
            uk: "Сторінка відкривається на `/items`. У стеку один запис, і таблиця знаходить для нього `ItemList`."
            en: "The page opens at `/items`. The stack has one entry, and the table finds `ItemList` for it."
          highlight: [e0, r-list]
        - caption:
            uk: "Клік по бажанню — **push**: запис 1 `/items/w-02` стає поточним, таблиця знаходить `ItemDetail`. Сторінка не завантажується."
            en: "Clicking the wish is a **push**: entry 1 `/items/w-02` becomes current, and the table finds `ItemDetail`. The page does not load."
          show: [e1]
          highlight: [e1, r-detail]
        - caption:
            uk: "«Редагувати» — ще один **push**: запис 2 і екран `ItemEdit`."
            en: "Edit is another **push**: entry 2 and the `ItemEdit` screen."
          show: [e2]
          highlight: [e2, r-edit]
        - caption:
            uk: "«Назад» пересуває позначку на запис 1 — знову `ItemDetail`. Запис 2 **не зник**: на нього веде «Вперед»."
            en: "Back moves the mark to entry 1 — `ItemDetail` again. Entry 2 has **not** disappeared: Forward leads to it."
          highlight: [e1, r-detail]
          annotate:
            - { id: e2, text: { uk: "чекає на «Вперед»", en: "waits for Forward" } }
        - caption:
            uk: "«Вперед» повертає позначку на запис 2 і форму."
            en: "Forward returns the mark to entry 2 and the form."
          highlight: [e2, r-edit]
        - caption:
            uk: "«Зберегти» з **replace** переписує поточний запис 2 на `/items/w-02`. Записів так само три, поточний показує `ItemDetail`."
            en: "Save with **replace** rewrites the current entry 2 to `/items/w-02`. There are still three entries; the current one shows `ItemDetail`."
          show: [e2r]
          dim: [e2]
          highlight: [e2r, r-detail]
          annotate:
            - { id: e2, text: { uk: "переписано", en: "rewritten" } }
        - caption:
            uk: "«Назад» веде на запис 1 — це теж `/items/w-02`, тож деталі показуються ще раз. Форми в стеку вже немає."
            en: "Back leads to entry 1 — also `/items/w-02`, so the detail shows once more. The form is no longer in the stack."
          dim: [e2]
          highlight: [e1, r-detail]

  - id: wish-route-table
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: wish-route-table
    entry: main.jsx
    editable: [App.jsx]
    strings:
      historyLabel: { uk: "Історія переходів", en: "Navigation history" }
      back: { uk: "Назад", en: "Back" }
      forward: { uk: "Вперед", en: "Forward" }
      now: { uk: "ми тут", en: "you are here" }
      mainNav: { uk: "Головне меню", en: "Main menu" }
      wishes: { uk: "Мої бажання", en: "My wishes" }
      about: { uk: "Про застосунок", en: "About the app" }
      aboutText: { uk: "Тут ти збираєш речі, які хочеш отримати.", en: "Here you collect things you would like to have." }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      notFound: { uk: "Сторінку не знайдено", en: "Page not found" }
      notFoundText: { uk: "За цією адресою нічого немає.", en: "There is nothing at this address." }
    title:
      uk: "Таблиця маршрутів із запасним екраном"
      en: "A route table with a fallback screen"
    instructions:
      uk: |
        Екрани `ItemList`, `About` і `NotFound` уже готові. Допиши в `App.jsx` дві речі:

        - у `MainNav` — два посилання через `<Link>`: «Мої бажання» на `/items` і «Про застосунок» на `/about`;
        - таблицю `routes`: `/items` показує `ItemList`, `/about` — `About`, а **будь-який інший шлях** — `NotFound`.

        Для «будь-якого іншого» маршрутизатор курсу має шлях `"*"`. `Routes` перебирає таблицю згори вниз і показує **перший** маршрут, що підійшов.

        Перевірки відкривають `/items`, `/about`, `/wishes/old` і `/`, клікають обидва посилання й рахують записи історії.
      en: |
        The screens `ItemList`, `About` and `NotFound` are ready. Add two things to `App.jsx`:

        - in `MainNav`, two links through `<Link>`: “My wishes” to `/items` and “About the app” to `/about`;
        - the `routes` table: `/items` shows `ItemList`, `/about` shows `About`, and **any other path** shows `NotFound`.

        For “any other” the course router has the path `"*"`. `Routes` goes through the table from top to bottom and shows the **first** route that fits.

        The checks open `/items`, `/about`, `/wishes/old` and `/`, click both links and count the history entries.
    testTitles:
      "/items shows the wish list":
        uk: "`/items` показує список бажань"
        en: "`/items` shows the wish list"
      "/about shows the About screen":
        uk: "`/about` показує екран «Про застосунок»"
        en: "`/about` shows the About screen"
      "any other path shows the not-found screen":
        uk: "Будь-який інший шлях показує екран «Сторінку не знайдено»"
        en: "Any other path shows the not-found screen"
      "the navigation has real links to /items and /about":
        uk: "У меню справжні посилання на `/items` і `/about`"
        en: "The menu has real links to `/items` and `/about`"
      "clicking About changes the screen and adds one history entry":
        uk: "Клік «Про застосунок» змінює екран і додає один запис історії"
        en: "Clicking “About the app” changes the screen and adds one history entry"
    hints:
      nudge:
        uk: "Кожен рядок таблиці — об’єкт із `path` і `element`. А для посилань подумай: який компонент малює `<a href>` і водночас не дає сторінці завантажитися?"
        en: "Each row of the table is an object with `path` and `element`. And for the links, think: which component draws an `<a href>` and at the same time keeps the page from loading?"
      explanation:
        uk: |
          `<Link to="/шлях">текст</Link>` малює `<a href="/шлях">` і переходить через `push`. Таблиця — масив об’єктів `{ path, element }`, а запасний маршрут із `path: "*"` підходить до будь-якого шляху. Оскільки `Routes` бере перший збіг, запасний маршрут має стояти **останнім** — інакше він перехопить усі адреси.

          Схожий приклад з іншими екранами: `[{ path: "/tasks", element: <TaskList /> }, { path: "*", element: <Missing /> }]`.
        en: |
          `<Link to="/path">text</Link>` draws `<a href="/path">` and navigates with `push`. The table is an array of `{ path, element }` objects, and a fallback route with `path: "*"` fits any path. Since `Routes` takes the first match, the fallback route must come **last** — otherwise it catches every address.

          A similar example with other screens: `[{ path: "/tasks", element: <TaskList /> }, { path: "*", element: <Missing /> }]`.
    solutionNote:
      uk: "`<Link>` дає справжній `<a href>` — його можна відкрити в новій вкладці, а програма екранного читання оголошує «посилання», — але сам перехід робить маршрутизатор, без завантаження сторінки. Маршрут `\"*\"` стоїть останнім, бо `Routes` показує перший збіг: поставлений першим, він перехопив би й `/items`, і `/about`."
      en: "`<Link>` gives a real `<a href>` — it can be opened in a new tab, and a screen reader announces “link” — but the transition itself is done by the router, without a page load. The `\"*\"` route comes last because `Routes` shows the first match: placed first, it would catch `/items` and `/about` too."
    feedback:
      - when: { test: "/items shows the wish list" }
        message:
          uk: "Ця перевірка відкриває `/items` і чекає заголовок «Мої бажання». Потрібен маршрут для `/items`, що показує `ItemList`, і він має стояти вище за маршрут `\"*\"`. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "This check opens `/items` and expects the heading “My wishes”. It needs a route for `/items` that shows `ItemList`, placed above the `\"*\"` route. If every check fails at once, fix the first error in the console first."
      - when: { test: "/about shows the About screen" }
        message:
          uk: "Ця перевірка відкриває `/about` і чекає заголовок «Про застосунок» — потрібен маршрут для `/about` вище за `\"*\"`."
          en: "This check opens `/about` and expects the heading “About the app” — it needs a route for `/about` above `\"*\"`."
      - when: { test: "any other path shows the not-found screen" }
        message:
          uk: "Ця перевірка відкриває `/wishes/old` і `/` та щоразу чекає заголовок «Сторінку не знайдено». Потрібен останній маршрут із `path: \"*\"`, що показує `NotFound`."
          en: "This check opens `/wishes/old` and `/` and each time expects the heading “Page not found”. It needs a last route with `path: \"*\"` that shows `NotFound`."
      - when: { test: "the navigation has real links to /items and /about" }
        message:
          uk: "Ця перевірка шукає в сторінці посилання (елементи `<a>`) з текстами «Мої бажання» і «Про застосунок» та атрибутами `href=\"/items\"` і `href=\"/about\"`. Кнопка тут не підходить: посилання веде кудись, кнопка щось робить. `<Link to>` малює саме `<a href>`."
          en: "This check looks for links (`<a>` elements) with the texts “My wishes” and “About the app” and the attributes `href=\"/items\"` and `href=\"/about\"`. A button does not fit here: a link goes somewhere, a button does something. `<Link to>` draws exactly an `<a href>`."
      - when: { test: "clicking About changes the screen and adds one history entry" }
        message:
          uk: "Ця перевірка клікає «Про застосунок» і чекає новий заголовок та рівно на один запис історії більше, а потім повертається кліком «Мої бажання». Якщо в консолі є «Перехід за посиланням … заблоковано», це звичайний `<a>`, який намагався завантажити сторінку, — заміни його на `<Link>`."
          en: "This check clicks “About the app” and expects the new heading and exactly one more history entry, then goes back by clicking “My wishes”. If the console says “Following the link … was blocked”, that is a plain `<a>` trying to load a page — replace it with `<Link>`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: path-part
        from: js-16-01-url-query-encoding
        prompt:
          uk: "Яку частину адреси `http://localhost:5173/items/w-02?sort=price#notes` порівнює з таблицею маршрутів маршрутизатор курсу?"
          en: "Which part of the address `http://localhost:5173/items/w-02?sort=price#notes` does the course router compare with the route table?"
        answer:
          type: choice
          options:
            - id: pathname
              text: { uk: "Шлях: `/items/w-02`", en: "The path: `/items/w-02`" }
            - id: search
              text: { uk: "Рядок запиту: `?sort=price`", en: "The query string: `?sort=price`" }
              why:
                uk: "Рядок запиту — це пари `назва=значення` для налаштувань екрана (сортування, пошук), а не вибір екрана. Маршрути зіставляють шлях."
                en: "The query string holds `name=value` pairs for a screen's settings (sorting, search), not the choice of a screen. Routes match the path."
            - id: hash
              text: { uk: "Фрагмент: `#notes`", en: "The fragment: `#notes`" }
              why:
                uk: "Фрагмент веде до місця всередині сторінки, наприклад до розділу з `id=\"notes\"`. Маршрути зіставляють шлях."
                en: "The fragment points to a place inside a page, for example a section with `id=\"notes\"`. Routes match the path."
          correct: [pathname]
        explanation:
          uk: "`url.pathname` — це `/items/w-02`; саме його розбирає таблиця маршрутів. Рядок запиту й фрагмент залишаються для самого екрана."
          en: "`url.pathname` is `/items/w-02`; that is what the route table matches. The query string and the fragment are left to the screen itself."
      - id: link-or-button
        from: js-01-07-links-buttons-images-tables
        prompt:
          uk: "На екрані бажання є «Редагувати» (відкриває форму за адресою `/items/w-02/edit`) і «Видалити» (прибирає бажання зі списку). Який елемент пасує кожному?"
          en: "A wish screen has “Edit” (opens the form at `/items/w-02/edit`) and “Delete” (removes the wish from the list). Which element fits each?"
        answer:
          type: choice
          options:
            - id: link-button
              text: { uk: "«Редагувати» — посилання, «Видалити» — кнопка", en: "“Edit” is a link, “Delete” is a button" }
            - id: both-buttons
              text: { uk: "Обидва — кнопки, бо обидва щось роблять", en: "Both are buttons, because both do something" }
              why:
                uk: "«Редагувати» веде на іншу адресу — це перехід, тобто посилання. Його можна відкрити в новій вкладці, а програма екранного читання оголосить «посилання»."
                en: "“Edit” leads to another address — that is going somewhere, so it is a link. It can be opened in a new tab, and a screen reader announces “link”."
            - id: both-links
              text: { uk: "Обидва — посилання, бо обидва змінюють екран", en: "Both are links, because both change the screen" }
              why:
                uk: "«Видалити» нікуди не веде: воно змінює дані тут. Дія — це кнопка."
                en: "“Delete” leads nowhere: it changes data right here. An action is a button."
          correct: [link-button]
        explanation:
          uk: "Посилання веде кудись, кнопка щось робить. Тому `<Link>` малює справжній `<a href>`, а не кнопку з обробником кліку."
          en: "A link goes somewhere, a button does something. That is why `<Link>` draws a real `<a href>`, not a button with a click handler."

  - id: to-project
    kind: transfer
    capstoneStep: RE-05
    body:
      uk: "У проєкті ти додаси три маршрути: список (`/items`, `/tasks`, `/habits` чи `/expenses` — залежно від проєкту), один запис і форму редагування. Кожен перехід між ними — `<Link>`, а не звичайний `<a>`, і кожен залишає слід у стеку історії, тож «Назад» має вести туди, куди людина чекає."
      en: "In the project you will add three routes: the list (`/items`, `/tasks`, `/habits` or `/expenses`, depending on the project), one record and an edit form. Every transition between them is a `<Link>`, not a plain `<a>`, and each leaves a trace in the history stack, so Back must lead where the person expects."
