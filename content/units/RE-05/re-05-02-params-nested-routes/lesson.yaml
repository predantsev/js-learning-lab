    title:
      uk: "Екран однієї справи за параметром"
      en: "A single-task screen from a param"
    instructions:
      uk: |
        Маршрут `:id` вкладено в `TasksLayout`, а `TaskCard` і `TaskNotFound` у `TaskViews.jsx` уже готові. Допиши в `App.jsx` компонент `TaskDetail`:

        - прочитай параметр `id`;
        - знайди в `tasks` справу з таким `id`;
        - покажи `<TaskCard task={…} />`, а якщо справи немає, — `<TaskNotFound id={…} />` з тим самим `id`.

        Перевірки відкривають `/tasks/t-02`, `/tasks/t-05`, `/tasks/t-99` і `/tasks/t%2001`, а ще клікають іншу справу в списку, коли одна вже відкрита.
      en: |
        The `:id` route is nested inside `TasksLayout`, and `TaskCard` and `TaskNotFound` in `TaskViews.jsx` are ready. Complete the `TaskDetail` component in `App.jsx`:

        - read the `id` param;
        - find the task with that `id` in `tasks`;
        - show `<TaskCard task={…} />`, or, if there is no such task, `<TaskNotFound id={…} />` with that same `id`.

        The checks open `/tasks/t-02`, `/tasks/t-05`, `/tasks/t-99` and `/tasks/t%2001`, and also click another task in the list while one is already open.
    testTitles:
      "/tasks/t-02 shows that task":
        uk: "`/tasks/t-02` показує цю справу"
        en: "`/tasks/t-02` shows that task"
      "/tasks/t-05 shows that task":
        uk: "`/tasks/t-05` показує цю справу"
        en: "`/tasks/t-05` shows that task"
      "an unknown id shows the not-found state with that id":
        uk: "Невідомий id показує стан «не знайдено» з цим id"
        en: "An unknown id shows the not-found state with that id"
      "an encoded id is decoded and still not found":
        uk: "Закодований id декодовано, і такої справи теж немає"
        en: "An encoded id is decoded and still not found"
      "clicking another task in the list shows that task":
        uk: "Клік по іншій справі в списку показує її"
        en: "Clicking another task in the list shows that task"
    hints:
      nudge:
        uk: "Параметр — це текст з адреси, а не справа. Що з ним треба зробити, щоб отримати справу, і що буде, якщо такої немає?"
        en: "The param is text from the address, not a task. What do you have to do with it to get the task, and what happens if there is none?"
      explanation:
        uk: |
          `useParams()` повертає об’єкт з усіма параметрами збігу. Записи шукають тим самим методом масиву, що й у JS-05: він повертає перший елемент, для якого функція дає `true`, або `undefined`. На `undefined` відповідай окремим поверненням **до** того, як читати поля.

          Схожий приклад з іншими даними: `const { code } = useParams(); const city = cities.find((c) => c.code === code); if (!city) return <Missing />;`.
        en: |
          `useParams()` returns an object with all params of the match. Records are found with the same array method as in JS-05: it returns the first element for which the function gives `true`, or `undefined`. Answer `undefined` with a separate return **before** reading any fields.

          A similar example with other data: `const { code } = useParams(); const city = cities.find((c) => c.code === code); if (!city) return <Missing />;`.
    solutionNote:
      uk: "`find` порівнює текст параметра з текстом id — точно, символ у символ, тож `t 01` не дорівнює `t-01`. Пошук іде в тілі компонента, тому кожен рендер з новим `id` знаходить нову справу. Копія в `useState(…)` запам’ятала б першу справу назавжди: `TaskDetail` лишається змонтованим, коли `/tasks/t-01` змінюється на `/tasks/t-03` — шаблон той самий."
      en: "`find` compares the param's text with the id's text — exactly, character by character, so `t 01` is not equal to `t-01`. The lookup happens in the component body, so every render with a new `id` finds the new task. A copy in `useState(…)` would remember the first task forever: `TaskDetail` stays mounted when `/tasks/t-01` changes to `/tasks/t-03` — the pattern is the same."
    feedback:
      - when: { test: "/tasks/t-02 shows that task" }
        message:
          uk: "Ця перевірка відкриває `/tasks/t-02` і чекає в `<main>` заголовок «Здати книжки в бібліотеку» та дату `2026-03-01` — тобто `TaskCard` з цією справою. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "This check opens `/tasks/t-02` and expects in `<main>` the heading “Return library books” and the date `2026-03-01` — that is, `TaskCard` with that task. If every check fails at once, fix the first error in the console first."
      - when: { test: "/tasks/t-05 shows that task" }
        message:
          uk: "Ця перевірка відкриває `/tasks/t-05` одразу після інших адрес — `TaskDetail` між ними не демонтується — і чекає заголовок «Записатися до стоматолога». Справу треба шукати за значенням поля `id` (у масиві вона четверта, не п’ята) і під час кожного рендеру."
          en: "This check opens `/tasks/t-05` right after other addresses — `TaskDetail` does not unmount in between — and expects the heading “Book a dentist visit”. The task must be found by the value of its `id` field (it is fourth in the array, not fifth) and during every render."
      - when: { test: "an unknown id shows the not-found state with that id" }
        message:
          uk: "Ця перевірка відкриває `/tasks/t-99` і чекає заголовок «Справу не знайдено» та `t-99` в `<code>` — тобто `<TaskNotFound id={id} />`. Якщо натомість сторінка порожня, а в консолі `TypeError`, код читає поле справи, якої немає."
          en: "This check opens `/tasks/t-99` and expects the heading “Task not found” and `t-99` in `<code>` — that is, `<TaskNotFound id={id} />`. If the page is blank instead and the console shows a `TypeError`, the code reads a field of a task that does not exist."
      - when: { test: "an encoded id is decoded and still not found" }
        message:
          uk: "Ця перевірка відкриває `/tasks/t%2001` і чекає стан «не знайдено» з `t 01` (з пробілом). Передай у `TaskNotFound` параметр як є — маршрутизатор уже його декодував. Якщо сторінка порожня, а в консолі `TypeError`, екран упав на попередній перевірці — спершу виправ ту помилку."
          en: "This check opens `/tasks/t%2001` and expects the not-found state with `t 01` (with a space). Pass the param to `TaskNotFound` as it is — the router has already decoded it. If the page is blank and the console shows a `TypeError`, the screen crashed in an earlier check — fix that error first."
      - when: { test: "clicking another task in the list shows that task" }
        message:
          uk: "Ця перевірка відкриває `/tasks/t-01`, клікає «Написати бабусі» й чекає цю справу та «без терміну». `TaskDetail` при цьому не демонтується, тож справу треба шукати під час кожного рендеру, а не один раз у початковому значенні стану. Якщо сторінка порожня, а в консолі `TypeError`, спершу виправ ту помилку."
          en: "This check opens `/tasks/t-01`, clicks “Write to grandma” and expects that task and “no due date”. `TaskDetail` does not unmount in between, so the task must be looked up during every render, not once in a state's initial value. If the page is blank and the console shows a `TypeError`, fix that error first."
      - when: { error: TypeError }
        message:
          uk: "`Cannot read properties of undefined` означає, що код читає поле справи, якої не знайдено. Перевір результат пошуку на `undefined` до того, як показувати `TaskCard`."
          en: "`Cannot read properties of undefined` means the code reads a field of a task that was not found. Check the lookup result for `undefined` before showing `TaskCard`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: same-place-same-state
        from: re-02-07-reset-preserve-identity
        prompt:
          uk: "Компонент `Draft` має стан із набраним текстом. Батьківський компонент малює на тому самому місці `<Draft />`, а після кліку — знову `<Draft />`, але з іншими props. Що буде з набраним текстом?"
          en: "The `Draft` component has state holding typed text. The parent draws `<Draft />` in one place, and after a click draws `<Draft />` there again, but with other props. What happens to the typed text?"
        answer:
          type: choice
          options:
            - id: kept
              text: { uk: "Лишиться: той самий тип на тому самому місці зберігає стан", en: "It stays: the same type in the same place keeps its state" }
            - id: reset
              text: { uk: "Зникне: нові props — новий компонент", en: "It is gone: new props mean a new component" }
              why:
                uk: "React порівнює тип і місце в дереві, а не props. Скинути стан можна іншим `key` або іншим місцем."
                en: "React compares the type and the place in the tree, not the props. State is reset by another `key` or another place."
          correct: [kept]
        explanation:
          uk: "Стан прив’язаний до місця в дереві. Саме тому `TasksLayout` переживає перехід між вкладеними маршрутами, а `TaskDetail` лишається тим самим між `/tasks/t-01` і `/tasks/t-02`."
          en: "State is tied to a place in the tree. That is why `TasksLayout` survives a move between nested routes, and `TaskDetail` stays the same component between `/tasks/t-01` and `/tasks/t-02`."

  - id: to-project
    kind: transfer
    capstoneStep: RE-05
    body:
      uk: "У проєкті екрани деталей і редагування стануть дітьми маршруту списку: макет показує їх у своєму `Outlet` замість списку, а заголовок проєкту, короткий опис і зображення над ним лишаються на місці. Кожен екран, що читає `:id`, повинен мати стан «не знайдено» — його перевірять відкриттям адреси з неіснуючим id."
      en: "In the project the detail and edit screens become children of the list route: the layout shows them in its `Outlet` in place of the list, while the project heading, the pitch and the image above it stay in place. Every screen that reads `:id` needs a not-found state — it will be checked by opening an address with an id that does not exist."
