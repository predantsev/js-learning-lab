id: re-05-02-params-nested-routes
unit: RE-05
title:
  uk: "Параметри й вкладені маршрути"
  en: "Params and nested routes"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Прочитати параметр маршруту на зразок `:id`, знайти за ним запис і обробити id, якого не існує."
    en: "Read a route parameter such as `:id`, look up the record and handle an id that does not exist."
  - uk: "Вкласти екрани деталей і редагування в макет списку так, щоб спільний заголовок і список лишалися змонтованими між ними."
    en: "Nest detail and edit screens inside a list layout so that the shared header and list stay mounted between them."
prerequisites: [re-05-01-routing-basics]
subskills:
  - { family: R-05, skill: "nested routes/params/history", depth: practice }
glossary: [route-param, nested-route]
selfCheck: [predict-param-lookup, task-detail]

blocks:
  - id: one-route-many-records
    kind: explanation
    title:
      uk: "Один маршрут на всі записи"
      en: "One route for every record"
    body:
      uk: |
        У минулому уроці кожне бажання мало б окремий рядок у таблиці: `/items/w-01`, `/items/w-02`… Для сотні записів це не працює. Замість конкретного id у шляху ставлять [[route-param|параметр маршруту]] — сегмент із двокрапкою:

        ```jsx
        { path: "/items/:id", element: <ItemDetail /> }
        ```

        Цей маршрут підходить до `/items/w-01`, `/items/w-02` і будь-якого іншого одного сегмента після `/items/`. Екран читає значення через `useParams()`:

        ```jsx
        const { id } = useParams(); // "w-02" для /items/w-02
        ```

        Три речі, які легко забути:

        - `id` — це **текст**, а не запис. Запис ще треба знайти серед `items` за полем `id`.
        - Запису може не бути: людина відкрила стару закладку або помилилась у адресі. Тоді `find` повертає `undefined`, і екран показує стан «не знайдено», а не падає.
        - Маршрутизатор декодує сегмент: `/items/w%2001` дає `id = "w 01"` — `%20` стає пробілом, як після `decodeURIComponent`.
      en: |
        In the previous lesson each wish would need its own row in the table: `/items/w-01`, `/items/w-02`… For a hundred records that does not work. Instead of a concrete id, the path gets a [[route-param|route parameter]] — a segment with a colon:

        ```jsx
        { path: "/items/:id", element: <ItemDetail /> }
        ```

        This route fits `/items/w-01`, `/items/w-02` and any other single segment after `/items/`. The screen reads the value with `useParams()`:

        ```jsx
        const { id } = useParams(); // "w-02" for /items/w-02
        ```

        Three things that are easy to forget:

        - `id` is **text**, not a record. The record still has to be found in `items` by its `id` field.
        - There may be no such record: the person opened an old bookmark or mistyped the address. Then `find` returns `undefined`, and the screen shows a “not found” state instead of crashing.
        - The router decodes the segment: `/items/w%2001` gives `id = "w 01"` — `%20` becomes a space, as after `decodeURIComponent`.

  - id: predict-param-lookup
    kind: prediction
    strings:
      noWish: { uk: "Немає бажання", en: "No wish" }
    prompt:
      uk: "Маршрут `/items/:id` показує цей `ItemDetail`, а в `items` є бажання `w-01`, `w-02` і `w-03`. Що покаже заголовок за адресою `/items/w-99` і за адресою `/items/w%2002`?"
      en: "The route `/items/:id` shows this `ItemDetail`, and `items` holds the wishes `w-01`, `w-02` and `w-03`. What does the heading show at `/items/w-99` and at `/items/w%2002`?"
    code: |
      function ItemDetail() {
        const { id } = useParams();
        const item = items.find((candidate) => candidate.id === id);
        return <h2>{item ? item.name : `%%noWish%% ${id}`}</h2>;
      }
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: both-missing-decoded
          text: { uk: "«Немає бажання w-99» і «Немає бажання w 02»", en: "“No wish w-99” and “No wish w 02”" }
        - id: encoded-kept
          text: { uk: "«Немає бажання w-99» і «Немає бажання w%2002»", en: "“No wish w-99” and “No wish w%2002”" }
          why:
            uk: "Маршрутизатор декодує сегмент, перш ніж віддати його в `useParams`: `%20` стає пробілом."
            en: "The router decodes the segment before handing it to `useParams`: `%20` becomes a space."
        - id: second-found
          text: { uk: "«Немає бажання w-99» і назва бажання `w-02`", en: "“No wish w-99” and the name of wish `w-02`" }
          why:
            uk: "Параметр — лише текст, і порівняння `===` точне: `\"w 02\"` (з пробілом) не дорівнює `\"w-02\"` (з дефісом)."
            en: "The param is just text, and `===` compares exactly: `\"w 02\"` (with a space) is not equal to `\"w-02\"` (with a hyphen)."
        - id: crash
          text: { uk: "Для `w-99` застосунок упаде з `TypeError`", en: "For `w-99` the app crashes with a `TypeError`" }
          why:
            uk: "`find` повертає `undefined`, але тернарний оператор перевіряє `item`, перш ніж читати `item.name`. Упав би код без цієї перевірки — `item.name` на `undefined`."
            en: "`find` returns `undefined`, but the ternary checks `item` before reading `item.name`. Code without that check would crash — `item.name` on `undefined`."
      correct: [both-missing-decoded]
    explanation:
      uk: "Параметр маршруту — це декодований текст із адреси, не запис. `w-99` не знайдено; `w%2002` перетворюється на `\"w 02\"`, і цього теж немає серед id. Вправа цього уроку перевіряє те саме на справах."
      en: "A route param is the decoded text from the address, not a record. `w-99` is not found; `w%2002` turns into `\"w 02\"`, which is not among the ids either. The exercise of this lesson checks the same with tasks."

  - id: layouts
    kind: explanation
    title:
      uk: "Вкладені маршрути: макет лишається, екран усередині змінюється"
      en: "Nested routes: the layout stays, the screen inside changes"
    body:
      uk: |
        Список справ і заголовок «Планувальник» потрібні на трьох екранах: порожньому `/tasks`, на деталях і на редагуванні. Їх не копіюють у кожен екран — їх виносять у **макет** і роблять [[nested-route|вкладені маршрути]]:

        ```jsx
        { path: "/tasks", element: <TasksLayout />, children: [
          { path: "", element: <PickTask /> },
          { path: ":id", element: <TaskDetail /> },
          { path: ":id/edit", element: <TaskEdit /> },
        ] }
        ```

        Шлях дитини дописується до шляху батька: `:id/edit` означає `/tasks/:id/edit`. Порожній шлях `""` — це сам `/tasks`. Екран дитини з’являється там, де макет поставив `<Outlet />`.

        Головне — що лишається змонтованим. Маршрутизатор курсу вважає кожен шаблон шляху окремим місцем у дереві (як `key` з RE-02). Між `/tasks/t-01` і `/tasks/t-01/edit` батьківський маршрут той самий, тож `TasksLayout` разом зі своїм станом **живе далі**, а змінюється лише екран в `Outlet`.
      en: |
        The task list and the “Planner” heading are needed on three screens: the empty `/tasks`, the detail and the edit form. They are not copied into each screen — they go into a **layout**, and the routes become [[nested-route|nested routes]]:

        ```jsx
        { path: "/tasks", element: <TasksLayout />, children: [
          { path: "", element: <PickTask /> },
          { path: ":id", element: <TaskDetail /> },
          { path: ":id/edit", element: <TaskEdit /> },
        ] }
        ```

        A child's path is appended to its parent's: `:id/edit` means `/tasks/:id/edit`. The empty path `""` is `/tasks` itself. The child's screen appears where the layout put `<Outlet />`.

        The key point is what stays mounted. The course router treats every path pattern as its own place in the tree (like `key` from RE-02). Between `/tasks/t-01` and `/tasks/t-01/edit` the parent route is the same, so `TasksLayout` with its state **lives on**, and only the screen in the `Outlet` changes.

  - id: predict-mounted
    kind: prediction
    prompt:
      uk: "Маршрути вкладені, як у таблиці з `TasksLayout`, `TaskDetail` і `TaskEdit`. Людина на `/tasks/t-01` клікає посилання на `/tasks/t-01/edit`. Що відбувається з компонентами?"
      en: "The routes are nested, as in the table with `TasksLayout`, `TaskDetail` and `TaskEdit`. The person at `/tasks/t-01` clicks a link to `/tasks/t-01/edit`. What happens to the components?"
    answer:
      type: choice
      options:
        - id: layout-stays
          text: { uk: "`TasksLayout` лишається змонтованим зі своїм станом; `TaskDetail` демонтується, `TaskEdit` монтується", en: "`TasksLayout` stays mounted with its state; `TaskDetail` unmounts, `TaskEdit` mounts" }
        - id: all-remount
          text: { uk: "Демонтується все, і `TasksLayout` монтується заново разом із `TaskEdit`", en: "Everything unmounts, and `TasksLayout` mounts anew together with `TaskEdit`" }
          why:
            uk: "Так було б, якби кожна адреса мала власну копію макета. У вкладених маршрутах батьківський маршрут `/tasks` той самий, тож React бачить той самий `TasksLayout` на тому самому місці й не чіпає його."
            en: "That would happen if every address had its own copy of the layout. In nested routes the parent route `/tasks` is the same, so React sees the same `TasksLayout` in the same place and leaves it alone."
        - id: detail-stays
          text: { uk: "Нічого не демонтується: `TaskDetail` лише отримує нові props", en: "Nothing unmounts: `TaskDetail` just receives new props" }
          why:
            uk: "`:id` і `:id/edit` — різні шаблони, тобто різні місця в дереві. На місці `TaskDetail` тепер інший компонент, тож `TaskDetail` демонтується."
            en: "`:id` and `:id/edit` are different patterns, so different places in the tree. Another component now stands where `TaskDetail` was, so `TaskDetail` unmounts."
      correct: [layout-stays]
    explanation:
      uk: "Змінюється лише внутрішній збіг: `:id` → `:id/edit`. Батьківський збіг `/tasks` той самий, і `TasksLayout` зберігає стан. У прикладі цього уроку це видно за лічильником і за рядком `TasksLayout mounted`, який консоль друкує лише раз."
      en: "Only the inner match changes: `:id` → `:id/edit`. The parent match `/tasks` is the same, and `TasksLayout` keeps its state. In the example of this lesson you can see it in the counter and in the line `TasksLayout mounted`, which the console prints only once."

  - id: url-to-routes
    kind: visual
    visual: diagram
    title:
      uk: "Як /tasks/t-02/edit знаходить свої маршрути"
      en: "How /tasks/t-02/edit finds its routes"
    textEquivalent:
      uk: >-
        Адреса /tasks/t-02/edit ділиться на три сегменти: tasks, t-02 і edit. Сегмент tasks збігається з батьківським
        маршрутом /tasks, і змонтовано TasksLayout. Решту, t-02 і edit, порівнюють із дочірніми маршрутами по черзі:
        порожній шлях не підходить, :id не підходить, бо лишилося два сегменти, а :id/edit підходить. Параметр id
        отримує текст "t-02" — не запис. Цей текст іде в пошук tasks.find(...), який повертає запис або undefined.
        Коли людина переходить на /tasks/t-02, батьківський збіг той самий: TasksLayout лишається змонтованим, а в
        його Outlet TaskEdit змінюється на TaskDetail.
      en: >-
        The address /tasks/t-02/edit splits into three segments: tasks, t-02 and edit. The segment tasks matches the
        parent route /tasks, and TasksLayout is mounted. The rest, t-02 and edit, is compared with the child routes
        in turn: the empty path does not fit, :id does not fit because two segments are left, and :id/edit fits. The
        param id gets the text "t-02" — not a record. That text goes into the lookup tasks.find(...), which returns a
        record or undefined. When the person moves to /tasks/t-02, the parent match is the same: TasksLayout stays
        mounted, and in its Outlet TaskEdit changes to TaskDetail.
    spec:
      layout: grid
      groups:
        - { id: url, label: { uk: "Сегменти адреси", en: "Address segments" } }
        - { id: routes, label: { uk: "Маршрути", en: "Routes" } }
      nodes:
        - { id: s-tasks, group: url, col: 0, row: 0, label: "tasks", shape: pill, w: 96 }
        - { id: s-id, group: url, col: 0, row: 1, label: "t-02", shape: pill, w: 96 }
        - { id: s-edit, group: url, col: 0, row: 2, label: "edit", shape: pill, w: 96 }
        - { id: layout, group: routes, col: 1, row: 0, label: "/tasks → TasksLayout", w: 170 }
        - { id: c-index, group: routes, col: 1, row: 1, label: "\"\" → PickTask", w: 170 }
        - { id: c-detail, group: routes, col: 1, row: 2, label: ":id → TaskDetail", w: 170 }
        - { id: c-edit, group: routes, col: 1, row: 3, label: ":id/edit → TaskEdit", w: 170 }
        - { id: param, col: 0, row: 4, label: "id = \"t-02\"", shape: note, w: 96 }
        - { id: lookup, col: 1, row: 4, label: "tasks.find(…)", shape: round, w: 170 }
      edges:
        - { from: s-tasks, to: layout }
        - { id: to-edit, from: s-edit, to: c-edit }
        - { from: param, to: lookup }
      hidden: [param, lookup, param->lookup]
      steps:
        - caption:
            uk: "Адреса `/tasks/t-02/edit` ділиться на три сегменти."
            en: "The address `/tasks/t-02/edit` splits into three segments."
          highlight: [s-tasks, s-id, s-edit]
        - caption:
            uk: "`tasks` збігається з батьківським маршрутом `/tasks` — монтується `TasksLayout`."
            en: "`tasks` matches the parent route `/tasks` — `TasksLayout` mounts."
          highlight: [s-tasks, layout, s-tasks->layout]
        - caption:
            uk: "Решту порівнюють із дітьми по черзі: `\"\"` і `:id` не підходять (лишилося два сегменти), `:id/edit` підходить."
            en: "The rest is compared with the children in turn: `\"\"` and `:id` do not fit (two segments are left), `:id/edit` fits."
          dim: [c-index, c-detail]
          highlight: [s-id, s-edit, c-edit, to-edit]
        - caption:
            uk: "Параметр `id` отримує **текст** `\"t-02\"`. Запис ще треба знайти — `find` поверне його або `undefined`."
            en: "The param `id` gets the **text** `\"t-02\"`. The record still has to be found — `find` returns it or `undefined`."
          show: [param, lookup, param->lookup]
          highlight: [param, lookup, param->lookup]
        - caption:
            uk: "Перехід на `/tasks/t-02`: батьківський збіг той самий, тож `TasksLayout` **лишається змонтованим**. В `Outlet` змінюється лише дитина: `TaskEdit` → `TaskDetail`."
            en: "Moving to `/tasks/t-02`: the parent match is the same, so `TasksLayout` **stays mounted**. Only the child in the `Outlet` changes: `TaskEdit` → `TaskDetail`."
          highlight: [layout, c-detail]
          dim: [c-edit, s-edit]
          annotate:
            - { id: layout, text: { uk: "не демонтується", en: "not unmounted" } }

  - id: task-nested
    kind: example
    runtime: browser-react
    dir: task-nested
    entry: main.jsx
    strings:
      historyLabel: { uk: "Історія переходів", en: "Navigation history" }
      back: { uk: "Назад", en: "Back" }
      forward: { uk: "Вперед", en: "Forward" }
      now: { uk: "ми тут", en: "you are here" }
      planner: { uk: "Планувальник", en: "Planner" }
      layoutCounter: { uk: "Лічильник макета:", en: "Layout counter:" }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      pick: { uk: "Обери справу зі списку.", en: "Pick a task from the list." }
      noTask: { uk: "Немає справи", en: "No task" }
      due: { uk: "Термін:", en: "Due:" }
      edit: { uk: "Редагувати", en: "Edit" }
      editing: { uk: "Редагування справи", en: "Editing task" }
      done: { uk: "Готово", en: "Done" }
    title:
      uk: "Вкладені маршрути з лічильником у макеті"
      en: "Nested routes with a counter in the layout"
    body:
      uk: |
        `TasksLayout` має власний стан — лічильник — і друкує в консоль, коли монтується й демонтується. Деталі й редагування вкладені в нього.

        Натисни **Запустити**. На **Сторінці** натисни лічильник макета кілька разів, потім відкрий справу, «Редагувати», «Готово» й іншу справу. Лічильник зберігає число, а `TasksLayout mounted` у **Консолі** лише один.
      en: |
        `TasksLayout` has its own state — a counter — and prints to the console when it mounts and unmounts. The detail and edit screens are nested inside it.

        Press **Run**. On the **Page** press the layout counter a few times, then open a task, “Edit”, “Done” and another task. The counter keeps its number, and the **Console** shows `TasksLayout mounted` only once.
    tryIt:
      uk: |
        Унизу `App.jsx` є друга таблиця, `flatRoutes`: три окремі маршрути, кожен зі своєю копією `TasksLayout`. У `<Routes routes={nestedRoutes} />` заміни `nestedRoutes` на `flatRoutes`, запусти й повтори те саме. Тепер перехід зі списку на справу, на «Редагувати» й назад на «Готово» щоразу друкує `TasksLayout unmounted` і `TasksLayout mounted`, а лічильник повертається до 0: інший шаблон — інше місце в дереві, і стан макета пропадає. А тепер натисни лічильник і клікни іншу справу, поки одна відкрита: число лишається, бо `/tasks/t-01` і `/tasks/t-03` мають той самий шаблон `/tasks/:id`. Поверни `nestedRoutes`.
      en: |
        At the bottom of `App.jsx` there is a second table, `flatRoutes`: three separate routes, each with its own copy of `TasksLayout`. In `<Routes routes={nestedRoutes} />` replace `nestedRoutes` with `flatRoutes`, run it and repeat the same steps. Now each move from the list to a task, to “Edit” and back with “Done” prints `TasksLayout unmounted` and `TasksLayout mounted`, and the counter goes back to 0: another pattern means another place in the tree, and the layout's state is lost. Now press the counter and click another task while one is open: the number stays, because `/tasks/t-01` and `/tasks/t-03` share the pattern `/tasks/:id`. Put `nestedRoutes` back.

