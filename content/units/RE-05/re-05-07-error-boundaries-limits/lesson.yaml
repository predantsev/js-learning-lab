id: re-05-07-error-boundaries-limits
unit: RE-05
title:
  uk: "Error boundaries та їхні обмеження"
  en: "Error boundaries and their limits"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Обгорнути екран маршруту в error boundary, який показує запасний інтерфейс із дією відновлення, коли рендер кидає помилку."
    en: "Wrap a route's screen in an error boundary that shows a fallback with a recovery action when rendering throws."
  - uk: "Передбачити, які помилки boundary перехоплює (рендер і ефекти дочірніх компонентів), а які ні (обробники подій, таймери, колбеки промісів, сам boundary), і обробляти другі через `try`/`catch` і стан помилки."
    en: "Predict which errors a boundary catches (render and effects of its children) and which it does not (event handlers, timers, promise callbacks, the boundary itself), and handle the latter with `try`/`catch` and error state."
prerequisites: [re-05-06-loading-empty-error-states, js-11-05-classes-private-static]
subskills:
  - { family: R-05, skill: "error boundaries and their limits", depth: intro }
glossary: [error-boundary, fallback-ui]
selfCheck: [predict-what-is-caught, error-boundary]

blocks:
  - id: blank-page
    kind: explanation
    title:
      uk: "Одна зламана картка — порожня сторінка"
      en: "One broken card — a blank page"
    body:
      uk: |
        Якщо компонент кидає помилку під час рендеру й ніхто її не перехоплює, React демонтує **все дерево** в `#root`: сторінка порожніє, а консоль показує картку помилки й попередження React `An error occurred in the <…> component`. Через один пошкоджений запис зникає весь застосунок — і список, і меню.

        [[error-boundary|Error boundary]] обмежує шкоду: це компонент, який перехоплює помилки рендеру своїх дітей і показує замість них [[fallback-ui|запасний інтерфейс]]. Решта сторінки живе далі.

        ```jsx
        class SafeArea extends Component {
          state = { hasError: false };
          static getDerivedStateFromError() {
            return { hasError: true }; // the next state: React renders again with it
          }
          render() {
            return this.state.hasError ? <p role="alert">Щось пішло не так.</p> : this.props.children;
          }
        }
        ```

        Boundary — **клас**, як у JS-11: у React 19 немає хука, що перехоплює помилки рендеру. `this.state` — його стан, `this.setState(…)` — сетер, `this.props.children` — те, що він обгортає. Статичний метод `getDerivedStateFromError` React викликає з кинутою помилкою (тут вона не потрібна, тож параметра немає), а результат стає новим станом. Повернутися з такого стану цей приклад не вміє — кнопку «Спробувати ще раз» ти допишеш у вправі.
      en: |
        If a component throws during render and nobody catches it, React unmounts **the whole tree** in `#root`: the page goes blank, and the console shows an error card and the React warning `An error occurred in the <…> component`. One damaged record takes the whole app down — the list and the menu too.

        An [[error-boundary]] limits the damage: it is a component that catches render errors of its children and shows a [[fallback-ui]] in their place. The rest of the page lives on.

        ```jsx
        class SafeArea extends Component {
          state = { hasError: false };
          static getDerivedStateFromError() {
            return { hasError: true }; // the next state: React renders again with it
          }
          render() {
            return this.state.hasError ? <p role="alert">Something went wrong.</p> : this.props.children;
          }
        }
        ```

        A boundary is a **class**, as in JS-11: React 19 has no hook that catches render errors. `this.state` is its state, `this.setState(…)` is its setter, `this.props.children` is what it wraps. React calls the static method `getDerivedStateFromError` with the thrown error (not needed here, so there is no parameter), and the result becomes the new state. This example cannot get back out of that state — you will add a “Try again” button in the exercise.

  - id: predict-what-is-caught
    kind: prediction
    prompt:
      uk: "`HabitDetail` обгорнуто в error boundary. У ньому чотири місця, де може статися помилка. Після яких boundary покаже запасний інтерфейс? Обери всі."
      en: "`HabitDetail` is wrapped in an error boundary. It has four places where an error can happen. After which of them does the boundary show its fallback? Choose all."
    code: |
      function HabitDetail({ habit }) {
        useEffect(() => {
          if (habit.completions === null) throw new Error("effect");      // B
        }, [habit]);
        if (habit.name === "") throw new Error("render");                 // A

        function markDoneToday() {
          throw new Error("onClick");                                     // C
        }
        function syncLater() {
          loadCompletions().then(() => {
            throw new Error("promise");                                   // D
          });
        }
        return <button onClick={markDoneToday}>…</button>;
      }
    lang: jsx
    runnable: false
    answer:
      type: multi
      options:
        - id: render
          text: { uk: "A — під час рендеру", en: "A — during render" }
        - id: effect
          text: { uk: "B — в ефекті", en: "B — in an effect" }
        - id: click
          text: { uk: "C — в обробнику кліку", en: "C — in a click handler" }
          why:
            uk: "Обробник події виконується не під час рендеру, а коли браузер передає клік. Помилка з нього йде до вікна (подія `error`) — boundary її не бачить, а екран лишається як був."
            en: "An event handler runs not during render but when the browser delivers the click. Its error goes to the window (the `error` event) — the boundary never sees it, and the screen stays as it was."
        - id: promise
          text: { uk: "D — у колбеці промісу", en: "D — in a promise callback" }
          why:
            uk: "Колбек `.then` виконується пізніше, як мікрозадача, далеко від рендеру. Відхилений проміс без обробника стає `unhandledrejection` — boundary про нього не знає."
            en: "A `.then` callback runs later, as a microtask, far from rendering. A rejected promise with no handler becomes an `unhandledrejection` — the boundary knows nothing about it."
      correct: [render, effect]
    explanation:
      uk: "Boundary ловить те, що кидається, поки React рендерить або виконує ефекти його дітей. Перевірено в пісочниці: A і B показують запасний інтерфейс; C дає картку «Помилка під час виконання», D — таку саму картку з поясненням, що проміс завершився помилкою, яку ніхто не обробив, а екран для обох не змінюється. Не ловить boundary і помилку власного рендеру — її бачить лише boundary вище."
      en: "A boundary catches what is thrown while React renders or runs the effects of its children. Checked in the sandbox: A and B show the fallback; C gives an “Error while running” card, D the same card explaining that a promise was rejected and nothing handled it, and for both the screen does not change. A boundary does not catch an error in its own render either — only a boundary higher up sees that."

  - id: handlers-and-promises
    kind: explanation
    title:
      uk: "Обробники й проміси — через try/catch і стан"
      en: "Handlers and promises — through try/catch and state"
    body:
      uk: |
        Для помилок, які boundary не бачить, працює те саме, що в JS-07 і JS-08: `try`/`catch` там, де помилку кидають, і стан помилки, який екран малює:

        ```jsx
        const [actionError, setActionError] = useState(null);

        async function handleArchive() {
          try {
            await archiveHabit(habit.id);
          } catch {
            setActionError("Не вдалося архівувати. Спробуй ще раз.");
          }
        }
        ```

        Так людина бачить зрозуміле повідомлення поруч із кнопкою, а решта екрана лишається робочою — запасний інтерфейс тут був би надто сильною реакцією.

        **Де ставити boundary.** Один boundary навколо всього застосунку кращий за жоден, але його запасний інтерфейс замінить і меню, і список. Ставлять його навколо частини, яка може зламатися незалежно, — наприклад, навколо екрана маршруту в `Outlet`. Щоб після переходу на іншу адресу boundary не показував стару помилку, йому дають `key` з адреси: новий ключ — новий boundary без помилки.
      en: |
        For errors the boundary does not see, the tools from JS-07 and JS-08 work: `try`/`catch` where the error is thrown, and an error state that the screen draws:

        ```jsx
        const [actionError, setActionError] = useState(null);

        async function handleArchive() {
          try {
            await archiveHabit(habit.id);
          } catch {
            setActionError("Could not archive. Try again.");
          }
        }
        ```

        That way the person sees a clear message next to the button, and the rest of the screen keeps working — a fallback would be far too strong a reaction here.

        **Where to put a boundary.** One boundary around the whole app is better than none, but its fallback replaces the menu and the list too. A boundary goes around a part that can break on its own — for example, around a route's screen in the `Outlet`. So that it does not show an old error after a move to another address, it gets a `key` from the address: a new key is a new boundary with no error.

  - id: where-errors-go
    kind: visual
    visual: diagram
    title:
      uk: "Куди йдуть помилки з екрана звички"
      en: "Where errors from a habit screen go"
    textEquivalent:
      uk: >-
        Дерево: HabitsLayout зі списком звичок, у ньому ErrorBoundary, а в ньому HabitDetail. Збоку — вікно браузера
        з подіями error і unhandledrejection. Помилка під час рендеру HabitDetail піднімається деревом до найближчого
        boundary. Boundary замінює HabitDetail запасним інтерфейсом, а HabitsLayout зі списком лишається змонтованим.
        Помилка в обробнику кліку виникає поза рендером: вона йде просто до вікна як подія error, boundary її не бачить,
        і екран не змінюється. Відхилений проміс без обробника теж оминає boundary і стає подією unhandledrejection.
      en: >-
        The tree: HabitsLayout with the habit list, inside it an ErrorBoundary, and inside that HabitDetail. To the
        side is the browser window with the events error and unhandledrejection. An error during HabitDetail's render
        travels up the tree to the nearest boundary. The boundary replaces HabitDetail with its fallback, while
        HabitsLayout with its list stays mounted. An error in a click handler happens outside render: it goes straight
        to the window as an error event, the boundary never sees it, and the screen does not change. A rejected
        promise with no handler bypasses the boundary as well and becomes an unhandledrejection event.
    spec:
      layout: grid
      nodes:
        - { id: layout, col: 0, row: 0, label: "HabitsLayout", w: 150 }
        - { id: boundary, col: 0, row: 1, label: "ErrorBoundary", w: 150 }
        - { id: detail, col: 0, row: 2, label: "HabitDetail", w: 150 }
        - { id: fallback, col: 1, row: 1, label: { uk: "запасний інтерфейс", en: "fallback" }, shape: note, w: 160 }
        - { id: window, col: 1, row: 2, label: "window", shape: round, w: 160 }
      edges:
        - { id: tree1, from: layout, to: boundary, kind: line }
        - { id: tree2, from: boundary, to: detail, kind: line }
        - { id: up, from: detail, to: boundary, label: { uk: "рендер", en: "render" } }
        - { id: swap, from: boundary, to: fallback }
        - { id: click, from: detail, to: window, label: "onClick", kind: dashed }
      hidden: [fallback, up, swap, click]
      steps:
        - caption:
            uk: "Boundary обгортає лише екран звички; макет зі списком — вище за нього."
            en: "The boundary wraps only the habit screen; the layout with the list is above it."
          highlight: [boundary]
        - caption:
            uk: "`HabitDetail` кидає помилку під час **рендеру**. Вона піднімається деревом до найближчого boundary."
            en: "`HabitDetail` throws during **render**. The error travels up the tree to the nearest boundary."
          show: [up]
          highlight: [detail, up, boundary]
        - caption:
            uk: "Boundary замінює `HabitDetail` запасним інтерфейсом. `HabitsLayout` зі списком лишається змонтованим."
            en: "The boundary replaces `HabitDetail` with its fallback. `HabitsLayout` with its list stays mounted."
          show: [fallback, swap]
          dim: [detail]
          highlight: [fallback, swap, layout]
          annotate:
            - { id: layout, text: { uk: "живе далі", en: "lives on" } }
        - caption:
            uk: "Помилка в **обробнику кліку** виникає поза рендером: вона йде просто до `window` (подія `error`), а boundary її не бачить. Так само відхилений проміс без обробника стає `unhandledrejection`."
            en: "An error in a **click handler** happens outside render: it goes straight to `window` (the `error` event), and the boundary never sees it. Likewise a rejected promise with no handler becomes an `unhandledrejection`."
          show: [click]
          highlight: [detail, click, window]
          dim: [fallback, swap, up]

  - id: habit-throws
    kind: example
    runtime: browser-react
    dir: habit-throws
    entry: main.jsx
    strings:
      habits: { uk: "Звички", en: "Habits" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      water: { uk: "Пити воду", en: "Drink water" }
      brokenScreen: { uk: "Цей екран не вдалося показати.", en: "This screen could not be shown." }
      throwRender: { uk: "Помилка в рендері", en: "Error in render" }
      throwEffect: { uk: "Помилка в ефекті", en: "Error in an effect" }
      throwClick: { uk: "Помилка в обробнику", en: "Error in a handler" }
      throwPromise: { uk: "Помилка в промісі", en: "Error in a promise" }
    title:
      uk: "Чотири помилки й один boundary"
      en: "Four errors and one boundary"
    body:
      uk: |
        `HabitDetail` у `Outlet` обгорнуто в `ErrorBoundary` з окремого файлу. Чотири кнопки кидають помилку в чотирьох різних місцях.

        Натисни **Запустити**. Спершу кнопки 3 і 4: з’являються картки помилок у **Консолі**, а **Сторінка** не змінюється. Потім кнопка 2 (або 1): екран звички замінює запасний інтерфейс, а заголовок і список лишаються. Картки помилки цього разу немає — лише повідомлення React у консолі, що починається з `%o` і каже `The above error occurred in the <HabitDetail> component… using the error boundary you provided, ErrorBoundary`.
      en: |
        `HabitDetail` in the `Outlet` is wrapped in the `ErrorBoundary` from its own file. Four buttons throw an error in four different places.

        Press **Run**. First buttons 3 and 4: error cards appear in the **Console**, and the **Page** does not change. Then button 2 (or 1): the habit screen is replaced by the fallback, while the heading and the list stay. This time there is no error card — only a React message in the console that starts with `%o` and says `The above error occurred in the <HabitDetail> component… using the error boundary you provided, ErrorBoundary`.
    tryIt:
      uk: |
        1. Після кнопки 2 клікни в списку «Пити воду»: запасний інтерфейс лишився — boundary досі тримає стару помилку. У `HabitsLayout` додай `useLocation` в імпорт з `"./router"`, на початку функції напиши `const { path } = useLocation();` і дай boundary ключ: `<ErrorBoundary key={path}>`. Запусти, зламай екран і перейди на іншу звичку — тепер вона показується.
        2. Перехопи помилку обробника сам. Заміни тіло `markDoneToday` на `try { throw new Error("onClick"); } catch (error) { console.log("caught:", error.message); }`. Запусти й натисни кнопку 3: замість картки помилки в консолі рядок `caught: onClick`. Справжній код поклав би повідомлення в стан і показав його біля кнопки.
      en: |
        1. After button 2, click “Drink water” in the list: the fallback stays — the boundary still holds the old error. In `HabitsLayout` add `useLocation` to the import from `"./router"`, write `const { path } = useLocation();` at the start of the function and give the boundary a key: `<ErrorBoundary key={path}>`. Run it, break the screen and move to another habit — now it shows.
        2. Catch the handler's error yourself. Replace the body of `markDoneToday` with `try { throw new Error("onClick"); } catch (error) { console.log("caught:", error.message); }`. Run it and press button 3: instead of an error card the console shows the line `caught: onClick`. Real code would put the message into state and show it next to the button.

  - id: error-boundary
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: error-boundary
    entry: main.jsx
    editable: [ErrorBoundary.jsx, App.jsx]
    strings:
      habits: { uk: "Звички", en: "Habits" }
      pick: { uk: "Обери звичку зі списку.", en: "Pick a habit from the list." }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      water: { uk: "Пити воду", en: "Drink water" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      notFound: { uk: "Звичку не знайдено", en: "Habit not found" }
      completions: { uk: "Виконань:", en: "Completions:" }
      brokenRecord: { uk: "Цю звичку не вдалося показати: запис пошкоджено.", en: "This habit could not be shown: the record is damaged." }
      tryAgain: { uk: "Спробувати ще раз", en: "Try again" }
    title:
      uk: "Boundary навколо екрана звички"
      en: "A boundary around the habit screen"
    instructions:
      uk: |
        Звичка «Прогулянка» повернулася зі сховища пошкодженою: `completions` — `null`, і `HabitDetail` падає на `.length`. Зараз через неї зникає весь застосунок. Зроби так, щоб ламався лише екран звички:

        - у `ErrorBoundary.jsx` допиши клас: коли дитина кидає помилку під час рендеру, він показує `<Fallback onReset={…} />`, а `onReset` очищає помилку, щоб діти рендерились знову;
        - в `App.jsx` постав boundary навколо `<Outlet />` у `HabitsLayout` — так заголовок і список лишаються — і дай йому `key` з поточної адреси, щоб перехід на іншу звичку починав із чистого boundary.

        Перевірки монтують окрему копію застосунку, відкривають робочу й пошкоджену звичку, переходять на іншу, «лагодять» запис і натискають «Спробувати ще раз».
      en: |
        The habit “Go for a walk” came back from storage damaged: `completions` is `null`, and `HabitDetail` crashes on `.length`. Right now it takes the whole app down. Make only the habit screen break:

        - in `ErrorBoundary.jsx` complete the class: when a child throws during render, it shows `<Fallback onReset={…} />`, and `onReset` clears the error so the children render again;
        - in `App.jsx` put the boundary around `<Outlet />` in `HabitsLayout` — so the heading and the list stay — and give it a `key` from the current address, so that moving to another habit starts with a clean boundary.

        The checks mount a separate copy of the app, open a working and the damaged habit, move to another one, “repair” the record and press “Try again”.
    testTitles:
      "a working habit shows its details":
        uk: "Робоча звичка показує свої деталі"
        en: "A working habit shows its details"
      "a broken habit shows the fallback inside the layout":
        uk: "Пошкоджена звичка показує запасний інтерфейс усередині макета"
        en: "A broken habit shows the fallback inside the layout"
      "opening another habit after a broken one shows that habit":
        uk: "Після пошкодженої звички інша звичка відкривається нормально"
        en: "Opening another habit after a broken one shows that habit"
      "Try again renders the record again once it is repaired":
        uk: "«Спробувати ще раз» показує запис знову, коли його полагоджено"
        en: "“Try again” renders the record again once it is repaired"
    hints:
      nudge:
        uk: "У класу-boundary дві частини: статичний метод, що перетворює помилку на стан, і `render`, що за цим станом вирішує, що показати. А звідки візьметься «чистий» boundary на новій адресі?"
        en: "A boundary class has two parts: a static method that turns the error into state, and `render`, which decides from that state what to show. And where does a “clean” boundary on a new address come from?"
      explanation:
        uk: |
          `getDerivedStateFromError(error)` повертає об’єкт нового стану — наприклад, з полем, що тримає помилку. У `render` перевір це поле: є помилка — `Fallback`, немає — `this.props.children`. Скинути помилку — означає викликати `this.setState(…)` зі станом без неї; передай таку функцію в `onReset`.

          Для нової адреси згадай RE-02: компонент з іншим `key` — новий компонент із новим станом. Шлях дає `useLocation()`. Схожий приклад з іншим компонентом: `<Comments key={postId} />` починає з порожньої форми для кожного допису.
        en: |
          `getDerivedStateFromError(error)` returns an object of the new state — for example, with a field that holds the error. In `render` check that field: an error — `Fallback`, no error — `this.props.children`. Clearing the error means calling `this.setState(…)` with a state that has none; pass such a function to `onReset`.

          For a new address, remember RE-02: a component with another `key` is a new component with new state. The path comes from `useLocation()`. A similar example with another component: `<Comments key={postId} />` starts with an empty form for every post.
    solutionNote:
      uk: "Boundary стоїть усередині макета, тож запасний інтерфейс замінює лише вміст `<main>`, а заголовок і список живуть далі. `key={path}` робить кожну адресу окремим boundary — стара помилка не переходить на іншу звичку. «Спробувати ще раз» очищає стан: якщо запис досі пошкоджений, рендер знову кине помилку, і boundary знову покаже запасний інтерфейс — нічого не зависає."
      en: "The boundary sits inside the layout, so the fallback replaces only the contents of `<main>`, while the heading and the list live on. `key={path}` makes every address its own boundary — an old error does not carry over to another habit. “Try again” clears the state: if the record is still damaged, the render throws again, and the boundary shows the fallback again — nothing gets stuck."
    feedback:
      - when: { test: "a working habit shows its details" }
        message:
          uk: "Ця перевірка відкриває «Ранкова зарядка» й чекає її заголовок у `<main>` без запасного інтерфейсу. Boundary без помилки має повертати `this.props.children`. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "This check opens “Morning exercise” and expects its heading in `<main>` without a fallback. A boundary without an error must return `this.props.children`. If every check fails at once, fix the first error in the console first."
      - when: { test: "a broken habit shows the fallback inside the layout" }
        message:
          uk: "Ця перевірка відкриває «Прогулянка» й чекає `role=\"alert\"` усередині `<main>`, а поруч — заголовок «Звички» і три посилання списку. Якщо сторінка порожня, помилку ніхто не перехопив; якщо зник і список, boundary стоїть надто високо."
          en: "This check opens “Go for a walk” and expects `role=\"alert\"` inside `<main>`, with the heading “Habits” and the three list links next to it. If the page is blank, nobody caught the error; if the list is gone too, the boundary sits too high."
      - when: { test: "opening another habit after a broken one shows that habit" }
        message:
          uk: "Ця перевірка відкриває пошкоджену звичку, потім «Пити воду» й чекає її деталі без запасного інтерфейсу. Boundary тримає помилку у своєму стані, доки не зникне, — дай йому `key` з поточної адреси."
          en: "This check opens the damaged habit, then “Drink water”, and expects its details without a fallback. A boundary keeps its error in its state until it is gone — give it a `key` from the current address."
      - when: { test: "Try again renders the record again once it is repaired" }
        message:
          uk: "Ця перевірка відкриває пошкоджену звичку, лагодить запис і натискає «Спробувати ще раз»: запасний інтерфейс має зникнути, а заголовок «Прогулянка» — з’явитися. `onReset` має викликати `this.setState(…)` зі станом без помилки."
          en: "This check opens the damaged habit, repairs the record and presses “Try again”: the fallback must disappear and the heading “Go for a walk” appear. `onReset` must call `this.setState(…)` with a state that has no error."
      - when: { error: TypeError }
        message:
          uk: "Якщо картка каже `Cannot read properties of null (reading 'length')` у `HabitDetail.jsx`, це пошкоджена «Прогулянка» — так задумано, `HabitDetail` лагодити не треба. Поки цю помилку ніхто не перехоплює, вона гасить усю копію застосунку; boundary навколо `<Outlet />` має показати замість неї `Fallback`."
          en: "If the card says `Cannot read properties of null (reading 'length')` in `HabitDetail.jsx`, that is the damaged “Go for a walk” — on purpose, `HabitDetail` does not need fixing. While nothing catches this error, it takes the whole copy of the app down; a boundary around `<Outlet />` must show `Fallback` in its place."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: catch-later
        from: js-07-03-try-catch-finally
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          try {
            setTimeout(() => {
              throw new Error("late");
            }, 0);
            console.log("scheduled");
          } catch (error) {
            console.log("caught", error.message);
          }
        verify:
          logs: ["scheduled"]
          error: Error
        answer:
          type: choice
          options:
            - id: scheduled-uncaught
              text: { uk: "`scheduled`, а потім неперехоплена помилка `late`", en: "`scheduled`, and then an uncaught error `late`" }
            - id: caught
              text: { uk: "`scheduled` і `caught late`", en: "`scheduled` and `caught late`" }
              why:
                uk: "Колбек таймера виконується пізніше, коли `try` вже давно скінчився. `catch` ловить лише те, що кидається, поки виконується його блок `try`."
                en: "The timer callback runs later, when the `try` finished long ago. `catch` catches only what is thrown while its `try` block is running."
            - id: caught-only
              text: { uk: "Лише `caught late`", en: "Only `caught late`" }
              why:
                uk: "`setTimeout` нічого не кидає сам — він лише планує колбек. Тож `scheduled` друкується, а помилка з’являється пізніше й поза `try`."
                en: "`setTimeout` throws nothing itself — it only schedules the callback. So `scheduled` is printed, and the error appears later, outside the `try`."
          correct: [scheduled-uncaught]
        explanation:
          uk: "`try`/`catch` ловить лише те, що сталося під час його блоку. Boundary — той самий принцип для React: він ловить лише те, що сталося під час рендеру його дітей. Таймер, клік і проміс виконуються пізніше — і там потрібен свій `try`/`catch`."
          en: "`try`/`catch` catches only what happened during its block. A boundary is the same principle for React: it catches only what happened while its children rendered. A timer, a click and a promise run later — and they need their own `try`/`catch`."
      - id: static-method
        from: js-11-05-classes-private-static
        prompt:
          uk: "Як викликати статичний метод `getDerivedStateFromError` класу `ErrorBoundary`?"
          en: "How do you call the static method `getDerivedStateFromError` of the `ErrorBoundary` class?"
        answer:
          type: choice
          options:
            - id: on-class
              text: { uk: "На самому класі: `ErrorBoundary.getDerivedStateFromError(error)`", en: "On the class itself: `ErrorBoundary.getDerivedStateFromError(error)`" }
            - id: on-instance
              text: { uk: "На екземплярі: `this.getDerivedStateFromError(error)`", en: "On an instance: `this.getDerivedStateFromError(error)`" }
              why:
                uk: "Статичний метод належить класу, а не екземплярам: у `this` його немає. Тому він і не може читати `this.state` — лише повертає новий стан із помилки."
                en: "A static method belongs to the class, not to its instances: `this` does not have it. That is also why it cannot read `this.state` — it only returns new state from the error."
          correct: [on-class]
        explanation:
          uk: "React викликає `ErrorBoundary.getDerivedStateFromError(error)` сам, на класі, і бере результат як новий стан. Твоя справа — лише описати, яким має бути цей стан."
          en: "React calls `ErrorBoundary.getDerivedStateFromError(error)` itself, on the class, and takes the result as the new state. Your job is only to describe what that state should be."

  - id: to-project
    kind: transfer
    capstoneStep: RE-05
    body:
      uk: "У проєкті постав boundary навколо екрана маршруту в макеті списку, з `key` від адреси й кнопкою «Спробувати ще раз». А помилки збереження й завантаження, які виникають в обробниках і промісах, перехоплюй `try`/`catch` і показуй як стан помилки — boundary їх не побачить."
      en: "In the project put a boundary around the route's screen in the list layout, with a `key` from the address and a “Try again” button. And catch save and load errors that happen in handlers and promises with `try`/`catch` and show them as an error state — the boundary will not see them."
