id: re-05-03-forms-controlled-uncontrolled
unit: RE-05
title:
  uk: "Керовані й некеровані форми"
  en: "Controlled vs uncontrolled forms"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Обирати керовані поля, коли інтерфейс реагує на кожну клавішу, і некеровані (`defaultValue` плюс `FormData` під час надсилання), коли важливі лише остаточні значення."
    en: "Choose controlled fields when the UI reacts to each keystroke and uncontrolled fields (`defaultValue` plus `FormData` on submit) when only the final values matter."
  - uk: "Передбачити, що станеться, коли поле перемкнеться з некерованого на кероване, бо його `value` спочатку `undefined`."
    en: "Predict what happens when a field switches from uncontrolled to controlled because its `value` starts as `undefined`."
prerequisites: [re-05-02-params-nested-routes, re-02-06-controlled-inputs-typed-events]
subskills:
  - { family: R-05, skill: "controlled/uncontrolled boundaries", depth: intro }
glossary: [uncontrolled-input]
selfCheck: [predict-default-value, quick-add]

blocks:
  - id: two-owners
    kind: explanation
    title:
      uk: "Хто тримає значення поля"
      en: "Who holds the field's value"
    body:
      uk: |
        У RE-02 ти робив [[controlled-input|керовані поля]]: значення живе в стані, `value={name}`, і кожна клавіша проходить через `onChange`. Є й другий спосіб — [[uncontrolled-input|некероване поле]]: значення тримає сам DOM, як у звичайній HTML-формі. React лише задає початкове значення через `defaultValue`, а код читає остаточне, коли форму надсилають:

        ```jsx
        function handleSubmit(event) {
          event.preventDefault();
          const data = new FormData(event.currentTarget);
          data.get("title"); // текст поля з name="title"
        }
        <input name="title" defaultValue={task.title} />
        ```

        `FormData` збирає значення всіх полів форми за їхніми атрибутами `name`.

        | Інтерфейс… | Обирай |
        |---|---|
        | реагує на кожну клавішу: лічильник символів, живий пошук, кнопка залежить від тексту | кероване |
        | потребує значень лише в момент «Зберегти» | некероване |

        Некероване поле — не застарілий прийом: у ньому менше коду й немає рендеру на кожну клавішу. Але воно має пастку — про неї зараз.
      en: |
        In RE-02 you built [[controlled-input|controlled inputs]]: the value lives in state, `value={name}`, and every key goes through `onChange`. There is a second way — an [[uncontrolled-input]]: the DOM itself holds the value, as in a plain HTML form. React only sets the starting value through `defaultValue`, and the code reads the final one when the form is submitted:

        ```jsx
        function handleSubmit(event) {
          event.preventDefault();
          const data = new FormData(event.currentTarget);
          data.get("title"); // the text of the field with name="title"
        }
        <input name="title" defaultValue={task.title} />
        ```

        `FormData` collects the values of all the form's fields by their `name` attributes.

        | The UI… | Choose |
        |---|---|
        | reacts to every key: a character counter, live search, a button that depends on the text | controlled |
        | needs the values only at the moment of “Save” | uncontrolled |

        An uncontrolled field is not an outdated trick: it takes less code and causes no render per key. But it has a trap — that comes next.

  - id: predict-default-value
    kind: prediction
    prompt:
      uk: "Маршрут `/habits/:id/edit` показує цей `HabitEdit`. Відкрито `/habits/h-01/edit`, у полі «Ранкова зарядка». Людина нічого не друкує й клікає в списку посилання на `/habits/h-02/edit` («Читати 20 хвилин»). Що тепер у полі?"
      en: "The route `/habits/:id/edit` shows this `HabitEdit`. `/habits/h-01/edit` is open, the field shows “Morning exercise”. The person types nothing and clicks the list link to `/habits/h-02/edit` (“Read for 20 minutes”). What is in the field now?"
    code: |
      function HabitEdit() {
        const { id } = useParams();
        const habit = habits.find((candidate) => candidate.id === id);
        return <input name="name" defaultValue={habit.name} />;
      }
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: old-name
          text: { uk: "«Ранкова зарядка» — стара назва", en: "“Morning exercise” — the old name" }
        - id: new-name
          text: { uk: "«Читати 20 хвилин» — назва нової звички", en: "“Read for 20 minutes” — the new habit's name" }
          why:
            uk: "`defaultValue` задає значення лише полю, яке щойно з’явилося. `HabitEdit` лишився змонтованим (шаблон `:id/edit` той самий), тож це те саме поле, і React не переписує його значення, коли `defaultValue` змінюється."
            en: "`defaultValue` sets the value only for a field that has just appeared. `HabitEdit` stayed mounted (the `:id/edit` pattern is the same), so it is the same field, and React does not rewrite its value when `defaultValue` changes."
        - id: empty
          text: { uk: "Порожнє поле: React очищає некеровані поля після переходу", en: "An empty field: React clears uncontrolled fields after a transition" }
          why:
            uk: "React не чіпає значення некерованого поля — для цього воно й некероване. Поле лишається тим самим, з тим самим текстом."
            en: "React does not touch an uncontrolled field's value — that is what makes it uncontrolled. The field stays the same, with the same text."
      correct: [old-name]
    explanation:
      uk: "Поле лишилось тим самим DOM-елементом, а `defaultValue` визначає, що в ньому написано, лише під час першого показу. Перевірено в пісочниці: заголовок уже про `h-02`, а в полі назва `h-01`. Якщо людина встигла щось надрукувати, в полі лишиться її текст. Ліки — `key`: поле з іншим `key` — нове поле, і воно бере свій `defaultValue`."
      en: "The field remained the same DOM element, and `defaultValue` decides what it shows only on the first display. Checked in the sandbox: the heading is already about `h-02`, while the field holds the name of `h-01`. If the person had typed something, the field would keep their text. The cure is `key`: a field with another `key` is a new field, and it takes its own `defaultValue`."

  - id: predict-undefined-value
    kind: prediction
    prompt:
      uk: "Форма нової звички починає з порожньої чернетки. Людина натискає в полі клавішу «Б». Що станеться?"
      en: "The new-habit form starts with an empty draft. The person presses the key “B” in the field. What happens?"
    code: |
      const [draft, setDraft] = useState({});
      <input
        value={draft.name}
        onChange={(event) => setDraft({ ...draft, name: event.target.value })}
      />
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: warning
          text: { uk: "Літера з’являється, а консоль показує червоне попередження React про поле, що з некерованого стало керованим", en: "The letter appears, and the console shows a red React warning about a field that went from uncontrolled to controlled" }
        - id: fine
          text: { uk: "Літера з’являється, жодних повідомлень: `undefined` — це те саме, що порожнє поле", en: "The letter appears, no messages: `undefined` is the same as an empty field" }
          why:
            uk: "Для React `value={undefined}` означає «значення не задано», тобто некероване поле. Після першої клавіші `value` стає текстом — поле перемикається на кероване, і React про це попереджає."
            en: "For React `value={undefined}` means “no value given”, that is, an uncontrolled field. After the first key `value` becomes text — the field switches to controlled, and React warns about it."
        - id: crash
          text: { uk: "Картка помилки: `TypeError`, бо в `draft` немає `name`", en: "An error card: `TypeError`, because `draft` has no `name`" }
          why:
            uk: "Читання відсутньої властивості дає `undefined`, а не помилку. Помилка була б лише при читанні властивості **з** `undefined`."
            en: "Reading a missing property gives `undefined`, not an error. An error would come only from reading a property **of** `undefined`."
      correct: [warning]
    explanation:
      uk: "Перевірено в пісочниці: після першої клавіші консоль показує `A component is changing an uncontrolled input to be controlled. This is likely caused by the value changing from undefined to a defined value…`. Поле має бути або кероване, або некероване все життя. Виправлення — почати з порожнього тексту: `useState({ name: \"\" })`."
      en: "Checked in the sandbox: after the first key the console shows `A component is changing an uncontrolled input to be controlled. This is likely caused by the value changing from undefined to a defined value…`. A field must be either controlled or uncontrolled for its whole life. The fix is to start with empty text: `useState({ name: \"\" })`."

  - id: habit-edit-modes
    kind: example
    runtime: browser-react
    dir: habit-edit-modes
    entry: main.jsx
    strings:
      habits: { uk: "Звички", en: "Habits" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      notFound: { uk: "Звичку не знайдено.", en: "Habit not found." }
      editing: { uk: "Редагування звички", en: "Editing habit" }
      name: { uk: "Назва", en: "Name" }
      save: { uk: "Зберегти", en: "Save" }
      saving: { uk: "Зберігаю:", en: "Saving:" }
      newHabit: { uk: "Нова звичка", en: "New habit" }
      add: { uk: "Додати", en: "Add" }
      adding: { uk: "Додаю:", en: "Adding:" }
      preview: { uk: "Так вона виглядатиме:", en: "This is how it will look:" }
    title:
      uk: "Некероване поле редагування й кероване поле нової звички"
      en: "An uncontrolled edit field and a controlled new-habit field"
    body:
      uk: |
        `HabitEdit` — некерована форма: `defaultValue` і `FormData` під час «Зберегти». `NewHabitForm` — керована: кожна клавіша оновлює чернетку, і рядок «Так вона виглядатиме» змінюється одразу.

        Натисни **Запустити**, зміни назву в полі редагування й натисни «Зберегти» — у **Консолі** з’явиться прочитане значення.
      en: |
        `HabitEdit` is an uncontrolled form: `defaultValue` and `FormData` on “Save”. `NewHabitForm` is controlled: every key updates the draft, and the line “This is how it will look” changes at once.

        Press **Run**, change the name in the edit field and press “Save” — the **Console** shows the value that was read.
    tryIt:
      uk: |
        1. Допиши щось у поле редагування й клікни в списку «Читати 20 хвилин». Заголовок уже про `h-02`, а в полі досі твій текст. Додай формі ключ: `<form key={habit.id} onSubmit={handleSubmit}>`. Запусти й повтори: тепер з новим id з’являється нова форма з правильною назвою. Зауваж: набраний текст при цьому зникає — як попередити людину перед таким переходом, буде за два уроки.
        2. Надрукуй літеру в полі «Нова звичка» й подивись у **Консоль**: червоне попередження `A component is changing an uncontrolled input to be controlled…`. Заміни `useState({})` на `useState({ name: "" })`, запусти й надрукуй знову — попередження немає.
      en: |
        1. Type something into the edit field and click “Read for 20 minutes” in the list. The heading is already about `h-02`, but the field still holds your text. Give the form a key: `<form key={habit.id} onSubmit={handleSubmit}>`. Run it and repeat: now a new id brings a new form with the right name. Note: the typed text disappears in the process — how to warn the person before such a transition comes two lessons later.
        2. Type a letter in the “New habit” field and look at the **Console**: a red warning `A component is changing an uncontrolled input to be controlled…`. Replace `useState({})` with `useState({ name: "" })`, run it and type again — the warning is gone.

  - id: quick-add
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: quick-add
    entry: main.jsx
    editable: [App.jsx]
    strings:
      habits: { uk: "Звички", en: "Habits" }
      water: { uk: "Пити воду", en: "Drink water" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      name: { uk: "Назва", en: "Name" }
      frequency: { uk: "Частота", en: "Frequency" }
      daily: { uk: "щодня", en: "daily" }
      weekly: { uk: "щотижня", en: "weekly" }
      add: { uk: "Додати", en: "Add" }
      nameRequired: { uk: "Введи назву звички.", en: "Enter the habit's name." }
      nameTooLong: { uk: "Назва — не довше за 80 символів.", en: "The name is at most 80 characters." }
      frequencyInvalid: { uk: "Обери частоту: щодня або щотижня.", en: "Choose a frequency: daily or weekly." }
    title:
      uk: "Некерована форма швидкого додавання"
      en: "An uncontrolled quick-add form"
    instructions:
      uk: |
        Форма додавання звички некерована: у полів є `name`, але немає `value` і стану. Допиши `handleSubmit` в `App.jsx`:

        - сторінка не перезавантажується;
        - значення полів `name` і `frequency` читаються через `FormData` і йдуть у `validateHabit` з `habits.js`;
        - якщо перевірка пройшла, звичка з `result.value` додається в кінець списку з будь-яким новим `id`, а форма очищається (`form.reset()` повертає полям їхні `defaultValue`);
        - якщо ні, у стан `error` іде ключ першої помилки, і під формою з’являється її текст; список не змінюється.

        Перевірки монтують окрему копію форми, вводять назву з пробілами на краях, порожню назву й назву з 81 символу.
      en: |
        The habit form is uncontrolled: its fields have a `name` but no `value` and no state. Complete `handleSubmit` in `App.jsx`:

        - the page does not reload;
        - the values of the fields `name` and `frequency` are read with `FormData` and go into `validateHabit` from `habits.js`;
        - if the check passes, the habit from `result.value` is added to the end of the list with any new `id`, and the form is cleared (`form.reset()` gives the fields back their `defaultValue`);
        - if not, the key of the first error goes into the `error` state and its text appears under the form; the list does not change.

        The checks mount a separate copy of the form and enter a name with spaces at the ends, an empty name and a name of 81 characters.
    testTitles:
      "submitting does not reload the page":
        uk: "Надсилання не перезавантажує сторінку"
        en: "Submitting does not reload the page"
      "a valid habit is added with its trimmed name and chosen frequency":
        uk: "Правильну звичку додано з обрізаною назвою й вибраною частотою"
        en: "A valid habit is added with its trimmed name and chosen frequency"
      "an empty name shows the required message and adds nothing":
        uk: "Порожня назва показує «Введи назву звички.» і нічого не додає"
        en: "An empty name shows “Enter the habit's name.” and adds nothing"
      "a name over 80 characters shows the too-long message and adds nothing":
        uk: "Назва довша за 80 символів показує повідомлення про довжину й нічого не додає"
        en: "A name over 80 characters shows the length message and adds nothing"
      "after a successful add the form is cleared and the error is gone":
        uk: "Після вдалого додавання форма порожня, а помилки немає"
        en: "After a successful add the form is cleared and the error is gone"
    hints:
      nudge:
        uk: "Що в обробнику надсилання вказує на саму форму? З нього можна і зібрати значення, і очистити поля."
        en: "What in a submit handler points to the form itself? From it you can both collect the values and clear the fields."
      explanation:
        uk: |
          `event.currentTarget` у `onSubmit` — це елемент `<form>`. `new FormData(form)` дає об’єкт, у якого `get("назва")` повертає текст поля з таким `name`. Спершу скасуй стандартну дію події, потім збери вхід для валідатора, а після вдалого додавання очисти форму методом самої форми.

          Схожий приклад з іншими полями: `const data = new FormData(event.currentTarget); const result = validateExpense({ label: data.get("label"), amount: data.get("amount") });`.
        en: |
          `event.currentTarget` in `onSubmit` is the `<form>` element. `new FormData(form)` gives an object whose `get("name")` returns the text of the field with that `name`. First cancel the event's default action, then build the validator's input, and after a successful add clear the form with the form's own method.

          A similar example with other fields: `const data = new FormData(event.currentTarget); const result = validateExpense({ label: data.get("label"), amount: data.get("amount") });`.
    solutionNote:
      uk: "Під час набору React нічого не рендерить — значення живуть у DOM, а код читає їх один раз. Обрізання пробілів і межі довжини вирішує `validateHabit`, тож форма не дублює правил домену. `form.reset()` тут доречний саме тому, що поля некеровані: керованому полю довелося б очищати стан."
      en: "While typing, React renders nothing — the values live in the DOM, and the code reads them once. Trimming and length limits are decided by `validateHabit`, so the form does not duplicate the domain's rules. `form.reset()` fits here precisely because the fields are uncontrolled: a controlled field would need its state cleared."
    feedback:
      - when: { test: "submitting does not reload the page" }
        message:
          uk: "Ця перевірка надсилає форму й чекає, що обробник скасував стандартну дію — `event.preventDefault()`. Без цього браузер завантажив би сторінку заново, а пісочниця показує в консолі, що надсилання заблоковано."
          en: "This check submits the form and expects the handler to cancel the default action — `event.preventDefault()`. Without it the browser would load the page again, and the sandbox shows in the console that the submission was blocked."
      - when: { test: "a valid habit is added with its trimmed name and chosen frequency" }
        message:
          uk: "Ця перевірка вводить «  Прогулянка  » з частотою «щотижня» і чекає в кінці списку «Прогулянка — щотижня»: назву без пробілів на краях. Додавай `result.value` з валідатора, а не сирий текст поля."
          en: "This check enters “  Go for a walk  ” with the frequency “weekly” and expects “Go for a walk — weekly” at the end of the list: the name without spaces at the ends. Add `result.value` from the validator, not the raw text of the field."
      - when: { test: "an empty name shows the required message and adds nothing" }
        message:
          uk: "Ця перевірка надсилає назву з самих пробілів і чекає в `#quick-error` текст «Введи назву звички.» та список з одного запису. Коли `result.ok` — `false`, поклади в `error` ключ помилки й вийди з обробника."
          en: "This check submits a name of spaces only and expects “Enter the habit's name.” in `#quick-error` and a list of one record. When `result.ok` is `false`, put the error key into `error` and leave the handler."
      - when: { test: "a name over 80 characters shows the too-long message and adds nothing" }
        message:
          uk: "Ця перевірка надсилає назву з 81 символу й чекає «Назва — не довше за 80 символів.» та незмінний список. Правило довжини вже є у `validateHabit` — треба лише показати його ключ."
          en: "This check submits a name of 81 characters and expects “The name is at most 80 characters.” and an unchanged list. The length rule is already in `validateHabit` — you only need to show its key."
      - when: { test: "after a successful add the form is cleared and the error is gone" }
        message:
          uk: "Ця перевірка спершу надсилає порожню форму (з’являється помилка), потім правильну, і чекає порожнє поле назви, частоту «щодня» та жодного `#quick-error`. Після додавання очисти помилку й виклич `reset()` на формі."
          en: "This check first submits an empty form (an error appears), then a valid one, and expects an empty name field, the frequency “daily” and no `#quick-error`. After adding, clear the error and call `reset()` on the form."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: undefined-or-empty
        from: js-02-04-nullish-optional-chaining
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const draft = {};
          console.log(draft.name ?? "", draft.name === "");
        verify:
          logs: [" false"]
        answer:
          type: choice
          options:
            - id: empty-false
              text: { uk: "порожній текст і `false`", en: "empty text and `false`" }
            - id: undefined-true
              text: { uk: "`undefined` і `true`", en: "`undefined` and `true`" }
              why:
                uk: "`??` замінює `undefined` на праве значення, тож перше — порожній текст. А `undefined === \"\"` — `false`: відсутнє значення й порожній текст — різні речі."
                en: "`??` replaces `undefined` with the right-hand value, so the first one is empty text. And `undefined === \"\"` is `false`: a missing value and empty text are different things."
            - id: empty-true
              text: { uk: "порожній текст і `true`", en: "empty text and `true`" }
              why:
                uk: "`draft.name` усе ще `undefined` — `??` нічого не записує в об’єкт. А `undefined` не дорівнює порожньому тексту."
                en: "`draft.name` is still `undefined` — `??` writes nothing into the object. And `undefined` is not equal to empty text."
          correct: [empty-false]
        explanation:
          uk: "Відсутня властивість — `undefined`, і це не порожній текст. Саме тому `value={draft.name}` робить поле некерованим, а `value={draft.name ?? \"\"}` чи початкове `\"\"` — керованим із першого рендеру."
          en: "A missing property is `undefined`, and that is not empty text. That is exactly why `value={draft.name}` makes a field uncontrolled, while `value={draft.name ?? \"\"}` or an initial `\"\"` makes it controlled from the first render."

  - id: to-project
    kind: transfer
    capstoneStep: RE-05
    body:
      uk: "У формі редагування проєкту виріши для кожного поля окремо: кероване, якщо щось на екрані реагує на кожну клавішу, некероване — якщо значення потрібне лише під час «Зберегти». Хай форма отримує `key` з id запису, тоді перехід на інший запис ніколи не покаже старих значень, а кероване поле хай починає з `\"\"`, а не з `undefined`."
      en: "In the project's edit form decide for each field separately: controlled if something on screen reacts to each key, uncontrolled if the value is needed only on “Save”. Give the form a `key` from the record's id, so that moving to another record never shows old values, and let every controlled field start from `\"\"`, not from `undefined`."
