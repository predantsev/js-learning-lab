id: re-05-08-debug-route-form-flow
unit: RE-05
title:
  uk: "Налагодження: «Назад» губить зміни, фокус не переміщено"
  en: "Debug: back loses edits, focus not moved"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Діагностувати форму редагування, яка губить набрані зміни на «Назад» застосунку чи під час переходу на інший запис, і виправити дефект керованого/некерованого поля та відсутню охорону."
    en: "Diagnose an edit form that loses typed edits on the app's Back or on a record switch, and repair the controlled/uncontrolled defect and the missing guard."
  - uk: "Виправити зміну маршруту, яка лишає фокус на видаленому елементі й нічого не оголошує."
    en: "Repair a route change that leaves focus on a removed element and announces nothing."
prerequisites: [re-05-07-error-boundaries-limits]
subskills:
  - { family: R-05, skill: "controlled/uncontrolled boundaries", depth: assess }
  - { family: R-05, skill: "focus/navigation/unsaved edits", depth: assess }
glossary: []
selfCheck: [predict-draft-and-focus, expense-flow]

blocks:
  - id: three-symptoms
    kind: explanation
    title:
      uk: "Три симптоми одного сценарію"
      en: "Three symptoms of one flow"
    body:
      uk: |
        Скарги на форми редагування зазвичай звучать так — а за кожною стоїть одна з тем цього розділу:

        | Що бачить людина | Де шукати |
        |---|---|
        | поле порожнє, хоча в записі є значення; у консолі `A component is changing an uncontrolled input to be controlled` | `value` починається з `undefined`: чернетка не отримала початкового значення з запису |
        | «Назад» чи клік по іншому запису мовчки викидає набране | немає охорони: ніхто не каже маршрутизатору, що є незбережені зміни |
        | після переходу Tab починає «звідкись», програма екранного читання мовчить | немає фокуса маршруту: елемент із фокусом зник, і фокус упав на `body` |

        Діагностуй з клавіатури, як людина, що не користується мишею: Tab до посилання, Enter, і після кожного кроку дивись, де фокус і що в консолі. Миша ховає половину цих дефектів — клік сам ставить фокус туди, куди ти дивишся.
      en: |
        Complaints about edit forms usually sound like this — and each has one of this unit's topics behind it:

        | What the person sees | Where to look |
        |---|---|
        | a field is empty although the record has a value; the console says `A component is changing an uncontrolled input to be controlled` | `value` starts as `undefined`: the draft did not get its starting value from the record |
        | Back or a click on another record silently throws away what was typed | no guard: nobody tells the router there are unsaved edits |
        | after a transition Tab starts “from somewhere”, the screen reader stays silent | no route focus: the focused element disappeared, and focus fell to `body` |

        Diagnose from the keyboard, like a person who does not use a mouse: Tab to a link, Enter, and after every step look at where focus is and what the console says. A mouse hides half of these defects — a click puts focus wherever you are looking.

  - id: predict-draft-and-focus
    kind: prediction
    prompt:
      uk: "У застосунку справ форма редагування тримає чернетку `useState({ title: task.title })`, а поле терміну — `value={draft.dueDate}`. Охорони й фокуса маршруту немає. Людина відкриває форму, дописує щось у назву й натискає «Назад» застосунку, а потім знову відкриває «Редагувати». Що вона бачить у формі?"
      en: "In the planner app the edit form keeps the draft `useState({ title: task.title })`, and the due-date field has `value={draft.dueDate}`. There is no guard and no route focus. The person opens the form, adds something to the title and presses the app's Back, then opens Edit again. What do they see in the form?"
    answer:
      type: choice
      options:
        - id: saved-title-empty-date
          text: { uk: "Збережену назву без дописаного й порожнє поле терміну", en: "The saved title without the addition, and an empty due-date field" }
        - id: draft-kept
          text: { uk: "Назву з дописаним — чернетка дочекалась", en: "The title with the addition — the draft waited" }
          why:
            uk: "«Назад» демонтував форму, і її стан зник. Нова форма починає з `task.title` — того, що збережено."
            en: "Back unmounted the form, and its state is gone. The new form starts from `task.title` — what was saved."
        - id: date-filled
          text: { uk: "Збережену назву й збережений термін", en: "The saved title and the saved due date" }
          why:
            uk: "У чернетці є лише `title`. `draft.dueDate` — `undefined`, тож поле терміну некероване й порожнє, хоч у справи термін є."
            en: "The draft holds only `title`. `draft.dueDate` is `undefined`, so the due-date field is uncontrolled and empty, although the task has a due date."
      correct: [saved-title-empty-date]
    explanation:
      uk: "Перевірено в пісочниці: після «Назад» і повторного «Редагувати» в назві збережений текст, а поле терміну порожнє. А якщо надрукувати в полі терміну, консоль покаже попередження про некероване поле, що стало керованим. Два різні дефекти — в одній формі."
      en: "Checked in the sandbox: after Back and Edit again, the title holds the saved text, and the due-date field is empty. And typing into the due-date field makes the console show the warning about an uncontrolled field becoming controlled. Two different defects — in one form."

  - id: seeded-flow
    kind: visual
    visual: sequence
    title:
      uk: "Що відбувається в зламаному сценарії"
      en: "What happens in the broken flow"
    textEquivalent:
      uk: >-
        Людина змінила назву справи й натискає «Назад» застосунку. Охорони немає, тож маршрутизатор одразу переходить
        на попередній запис. Форма редагування демонтується, і чернетка зникає разом з її станом. Фокус був на кнопці
        «Назад», вона лишилася, але після кліку «Зберегти» в іншому заході кнопка «Зберегти» зникає разом із формою, і
        фокус падає на body. Новий екран не ставить фокус на свій заголовок, тож програма екранного читання не каже
        нічого, а наступний Tab починає з першого елемента сторінки.
      en: >-
        The person changed a task's title and presses the app's Back. There is no guard, so the router navigates to the
        previous entry at once. The edit form unmounts, and the draft disappears together with its state. Focus was on
        the Back button, which stays, but after pressing Save in another attempt, the Save button disappears together
        with the form, and focus falls to body. The new screen does not put focus on its heading, so the screen reader
        says nothing, and the next Tab starts from the first element of the page.
    spec:
      actors:
        - { id: person, label: { uk: "Людина", en: "Person" } }
        - { id: router, label: { uk: "Маршрутизатор", en: "Router" } }
        - { id: form, label: { uk: "Форма редагування", en: "Edit form" } }
      intro:
        uk: "Назву в чернетці змінено, але форма не викликає `useBlocker`, і жоден екран не переводить фокус."
        en: "The title in the draft is changed, but the form does not call `useBlocker`, and no screen moves focus."
      messages:
        - from: person
          to: router
          label: { uk: "«Назад» застосунку", en: "the app's Back" }
          caption:
            uk: "Людина натискає «Назад» застосунку зі зміненою чернеткою."
            en: "The person presses the app's Back with a changed draft."
        - from: router
          to: form
          label: { uk: "демонтування", en: "unmount" }
          kind: async
          caption:
            uk: "Охорони немає — маршрутизатор переходить одразу, і форма демонтується."
            en: "There is no guard — the router navigates at once, and the form unmounts."
        - from: form
          to: form
          kind: note
          label: { uk: "чернетки немає", en: "draft is gone" }
          note:
            uk: "Стан компонента зникає разом із ним."
            en: "A component's state disappears together with it."
          caption:
            uk: "Чернетка була станом форми — тепер її немає. Ніхто не спитав, чи можна."
            en: "The draft was the form's state — now it is gone. Nobody asked whether that was fine."
        - from: person
          to: form
          label: { uk: "Enter на «Зберегти»", en: "Enter on Save" }
          caption:
            uk: "Інша спроба: людина натискає Enter на «Зберегти». Фокус — на цій кнопці."
            en: "Another attempt: the person presses Enter on Save. Focus is on that button."
        - from: form
          to: router
          label: "navigate(…, { replace: true })"
          caption:
            uk: "Форма зберігає й переходить на деталі. Кнопка «Зберегти» зникає разом із формою."
            en: "The form saves and navigates to the detail. The Save button disappears together with the form."
        - from: router
          to: person
          label: { uk: "фокус на body, тиша", en: "focus on body, silence" }
          kind: return
          caption:
            uk: "Фокус падає на `body`. Новий екран не ставить фокус на свій заголовок — програма екранного читання мовчить, а наступний Tab починає з початку сторінки."
            en: "Focus falls to `body`. The new screen does not focus its heading — the screen reader stays silent, and the next Tab starts from the top of the page."

  - id: task-flow
    kind: example
    runtime: browser-react
    dir: task-flow
    entry: main.jsx
    strings:
      historyLabel: { uk: "Історія переходів", en: "Navigation history" }
      back: { uk: "Назад", en: "Back" }
      forward: { uk: "Вперед", en: "Forward" }
      now: { uk: "ми тут", en: "you are here" }
      planner: { uk: "Планувальник", en: "Planner" }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      notFound: { uk: "Справу не знайдено", en: "Task not found" }
      due: { uk: "Термін:", en: "Due:" }
      edit: { uk: "Редагувати", en: "Edit" }
      editing: { uk: "Редагування справи", en: "Editing a task" }
      title: { uk: "Назва", en: "Title" }
      dueField: { uk: "Термін (РРРР-ММ-ДД)", en: "Due date (YYYY-MM-DD)" }
      save: { uk: "Зберегти", en: "Save" }
      reportLabel: { uk: "Що отримує програма екранного читання", en: "What a screen reader gets" }
      reportFocus: { uk: "Фокус:", en: "Focus:" }
      reportInvalid: { uk: "недійсне значення", en: "invalid entry" }
      reportDescription: { uk: "Опис:", en: "Description:" }
    title:
      uk: "Зламаний сценарій справ — пройди його з клавіатури"
      en: "A broken planner flow — walk it from the keyboard"
    body:
      uk: |
        Це планувальник із трьома дефектами з таблиці. Панель унизу показує, де фокус.

        Натисни **Запустити**, клацни один раз у порожнє місце **Сторінки** й далі працюй лише клавіатурою: Tab до справи «Здати книжки в бібліотеку», Enter, Tab до «Редагувати», Enter.
      en: |
        This is a planner with the three defects from the table. The panel at the bottom shows where focus is.

        Press **Run**, click once on an empty spot of the **Page** and from then on use only the keyboard: Tab to the task “Return library books”, Enter, Tab to “Edit”, Enter.
    tryIt:
      uk: |
        Знайди кожен симптом і запиши крок, що його спричиняє:

        1. Після Enter на «Редагувати» панель показує `body`: посилання зникло разом з екраном деталей.
        2. Поле терміну порожнє, хоч у справи термін `2026-03-01`. Надрукуй у ньому щось — консоль покаже попередження про некероване поле.
        3. Допиши щось у назву й натисни «← Назад»: деталі з’являються одразу, а знову відкрита форма показує збережену назву.

        Виправляти тут не треба — той самий набір дефектів чекає у вправі, тільки в трекері витрат.
      en: |
        Find each symptom and note the step that causes it:

        1. After Enter on “Edit” the panel shows `body`: the link disappeared together with the detail screen.
        2. The due-date field is empty, although the task's due date is `2026-03-01`. Type something into it — the console shows the warning about an uncontrolled field.
        3. Add something to the title and press “← Back”: the detail appears at once, and the reopened form shows the saved title.

        No need to fix anything here — the same set of defects waits in the exercise, only in the expense tracker.

  - id: expense-flow
    kind: exercise
    mode: debug
    runtime: browser-react
    dir: expense-flow
    entry: main.jsx
    editable: [App.jsx]
    strings:
      historyLabel: { uk: "Історія переходів", en: "Navigation history" }
      back: { uk: "Назад", en: "Back" }
      forward: { uk: "Вперед", en: "Forward" }
      now: { uk: "ми тут", en: "you are here" }
      expenses: { uk: "Витрати", en: "Expenses" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      notFound: { uk: "Витрату не знайдено", en: "Expense not found" }
      amount: { uk: "Сума, грн", en: "Amount, UAH" }
      label: { uk: "Назва витрати", en: "Label" }
      edit: { uk: "Редагувати", en: "Edit" }
      editing: { uk: "Редагування витрати", en: "Editing an expense" }
      save: { uk: "Зберегти", en: "Save" }
      unsaved: { uk: "Є незбережені зміни. Піти без збереження?", en: "There are unsaved changes. Leave without saving?" }
      stay: { uk: "Лишитися", en: "Stay" }
      leave: { uk: "Піти без збереження", en: "Leave without saving" }
    title:
      uk: "Полагодь сценарій витрат"
      en: "Repair the expense flow"
    instructions:
      uk: |
        Трекер витрат має ті самі три дефекти. Полагодь `App.jsx`, щоб:

        - поле суми у формі одразу показувало збережену суму (`formatAmount` з `expenses.js`) і жодного разу не перемикалося з некерованого на кероване;
        - поки чернетка відрізняється від збереженої витрати, «← Назад» і посилання на іншу витрату спершу питали (готовий `LeaveDialog` з кнопками «Лишитися» й «Піти без збереження»), а `beforeunload` скасовувався; без змін — нічого не питалося;
        - «Зберегти» зберігало зміни й переходило на деталі без питання;
        - після кожної зміни маршруту фокус стояв на заголовку `<h1>` нового екрана (окрім першого відкриття сторінки).

        Перевірки монтують окрему копію застосунку, читають консоль, клікають посилання й кнопки та надсилають `beforeunload` самі.
      en: |
        The expense tracker has the same three defects. Repair `App.jsx` so that:

        - the amount field of the form shows the saved amount right away (`formatAmount` from `expenses.js`) and never switches from uncontrolled to controlled;
        - while the draft differs from the saved expense, “← Back” and links to another expense ask first (the ready `LeaveDialog` with the buttons “Stay” and “Leave without saving”), and `beforeunload` is canceled; with no edits nothing asks;
        - “Save” stores the edits and moves to the detail without asking;
        - after every route change focus is on the new screen's `<h1>` heading (except on the page's first open).

        The checks mount a separate copy of the app, read the console, click links and buttons and dispatch `beforeunload` themselves.
    testTitles:
      "the amount field starts with the saved amount and stays controlled":
        uk: "Поле суми починає зі збереженої суми й лишається керованим"
        en: "The amount field starts with the saved amount and stays controlled"
      "Back from an unchanged form leaves without asking":
        uk: "«Назад» із незміненої форми виходить без питання"
        en: "Back from an unchanged form leaves without asking"
      "Back from a changed form asks first, and Stay keeps the draft":
        uk: "«Назад» зі зміненої форми спершу питає, а «Лишитися» зберігає чернетку"
        en: "Back from a changed form asks first, and Stay keeps the draft"
      "opening another expense from a changed form asks first":
        uk: "Перехід на іншу витрату зі зміненої форми спершу питає"
        en: "Opening another expense from a changed form asks first"
      "reloading is guarded only while the form is changed":
        uk: "Перезавантаження охороняється лише поки форма змінена"
        en: "Reloading is guarded only while the form is changed"
      "Save stores the edits without asking":
        uk: "«Зберегти» зберігає зміни без питання"
        en: "Save stores the edits without asking"
      "after every route change focus is on the new screen heading":
        uk: "Після кожної зміни маршруту фокус на заголовку нового екрана"
        en: "After every route change focus is on the new screen's heading"
    hints:
      nudge:
        uk: "Почни з консолі: яке поле перемикається, і якого значення бракує чернетці на старті? Потім пройди сценарій з клавіатури й запитай себе після кожного кроку: хто знає про незбережені зміни і де зараз фокус?"
        en: "Start with the console: which field switches, and which value is the draft missing at the start? Then walk the flow from the keyboard and after each step ask: who knows about the unsaved edits, and where is focus now?"
      explanation:
        uk: |
          Три виправлення, по одному на дефект:

          - Чернетка має містити **кожне** поле форми вже на першому рендері — значенням із запису, відформатованим так, як його показує поле.
          - «Брудна» форма — та, чия чернетка відрізняється від збереженого запису. Це значення йде в `useBlocker`, а ефект із тим самим значенням вмикає й вимикає слухача `beforeunload`. Збереження — свідомий вихід, тож його перехід пропускає охорону (опція `skipGuard` маршрутизатора курсу).
          - Заголовок кожного екрана отримує `tabIndex={-1}` і `ref`, а ефект, що залежить від поточного шляху, переводить на нього фокус, якщо `action` — не `"initial"`. Не під час рендеру: тоді `ref` ще порожній.
        en: |
          Three fixes, one per defect:

          - The draft must hold **every** field of the form from the first render — with the value from the record, formatted the way the field shows it.
          - A “dirty” form is one whose draft differs from the saved record. That value goes into `useBlocker`, and an effect with the same value switches a `beforeunload` listener on and off. Saving is a deliberate exit, so its navigation skips the guard (the course router's `skipGuard` option).
          - Every screen's heading gets `tabIndex={-1}` and a `ref`, and an effect that depends on the current path moves focus to it when `action` is not `"initial"`. Not during render: the `ref` is still empty then.
    solutionNote:
      uk: "Чернетка з повною формою на старті прибирає і порожнє поле, і попередження: поле кероване з першого рендеру. Охорона залежить від порівняння з записом, тож мовчить, поки нічого не змінено, а «Зберегти» обходить її через `skipGuard`. Фокус ставиться в ефекті після commit кожного нового екрана — так людина з клавіатурою чи програмою екранного читання завжди знає, куди потрапила."
      en: "A draft with the full form from the start removes both the empty field and the warning: the field is controlled from the first render. The guard depends on a comparison with the record, so it stays silent while nothing has changed, and “Save” goes around it with `skipGuard`. Focus is set in an effect after the commit of each new screen — so a person with a keyboard or a screen reader always knows where they ended up."
    feedback:
      - when: { test: "the amount field starts with the saved amount and stays controlled" }
        message:
          uk: "Ця перевірка відкриває форму «Проїзний» і чекає в полі суми `520.00`, після клавіші `5` — `520.005`, і жодного попередження `uncontrolled input to be controlled` у консолі. Чернетка має отримати суму із запису вже на старті. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "This check opens the “Transit pass” form and expects `520.00` in the amount field, `520.005` after the key `5`, and no `uncontrolled input to be controlled` warning in the console. The draft must get the amount from the record at the start. If every check fails at once, fix the first error in the console first."
      - when: { test: "Back from an unchanged form leaves without asking" }
        message:
          uk: "Ця перевірка відкриває форму, нічого не змінює й натискає «← Назад»: питання бути не повинно, а на екрані — деталі «Проїзний». Охорона має залежати від того, чи чернетка відрізняється від запису."
          en: "This check opens the form, changes nothing and presses “← Back”: there must be no question, and the screen shows the “Transit pass” detail. The guard must depend on whether the draft differs from the record."
      - when: { test: "Back from a changed form asks first, and Stay keeps the draft" }
        message:
          uk: "Ця перевірка дописує `!` до назви, натискає «← Назад» і чекає `role=\"alertdialog\"`, а після «Лишитися» — назву з `!`. Покажи `LeaveDialog`, коли `blocked` від `useBlocker` — `true`."
          en: "This check adds `!` to the label, presses “← Back” and expects `role=\"alertdialog\"`, and after Stay the label with `!`. Show `LeaveDialog` when `blocked` from `useBlocker` is `true`."
      - when: { test: "opening another expense from a changed form asks first" }
        message:
          uk: "Ця перевірка змінює назву, клікає в списку «Лампочки» й чекає питання, а після «Піти без збереження» — деталі «Лампочки»."
          en: "This check changes the label, clicks “Light bulbs” in the list and expects the question, and after “Leave without saving” the “Light bulbs” detail."
      - when: { test: "reloading is guarded only while the form is changed" }
        message:
          uk: "Ця перевірка надсилає `beforeunload` для незміненої форми (подію не скасовано) і для зміненої (скасовано). Потрібен ефект зі слухачем, що викликає `event.preventDefault()`, лише поки є зміни."
          en: "This check dispatches `beforeunload` for an unchanged form (not canceled) and for a changed one (canceled). It needs an effect with a listener that calls `event.preventDefault()`, only while there are edits."
      - when: { test: "Save stores the edits without asking" }
        message:
          uk: "Ця перевірка вводить суму `480`, натискає «Зберегти» й чекає деталі з `480.00` без жодного питання. Перехід після збереження має пропускати охорону — опція `skipGuard` маршрутизатора курсу."
          en: "This check enters the amount `480`, presses “Save” and expects the detail with `480.00` and no question. The navigation after saving must skip the guard — the course router's `skipGuard` option."
      - when: { test: "after every route change focus is on the new screen heading" }
        message:
          uk: "Ця перевірка відкриває витрату, потім «Редагувати», потім «Зберегти» й щоразу чекає фокус на `<h1>` у `<main>`. Заголовкам потрібні `tabIndex={-1}` і `ref`, а `focus()` — в ефекті, що залежить від шляху."
          en: "This check opens an expense, then “Edit”, then “Save”, and each time expects focus on the `<h1>` in `<main>`. The headings need `tabIndex={-1}` and a `ref`, and `focus()` belongs in an effect that depends on the path."
      - when: { error: TypeError }
        message:
          uk: "Якщо картка каже `Cannot read properties of undefined (reading 'replace')` після «Зберегти», це означає, що `draft.amount` — `undefined`: чернетка не отримала суму з запису."
          en: "If the card says `Cannot read properties of undefined (reading 'replace')` after “Save”, it means `draft.amount` is `undefined`: the draft did not get the amount from the record."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: keyboard-audit
        from: js-17-10-accessible-website-audit
        prompt:
          uk: "Ти перевіряєш сторінку на доступність. Що з цього **не** покаже перевірка лише мишею?"
          en: "You are checking a page for accessibility. Which of these does a mouse-only check **not** reveal?"
        answer:
          type: choice
          options:
            - id: focus-lost
              text: { uk: "Що після дії фокус загубився й Tab починає з початку сторінки", en: "That after an action focus got lost and Tab starts from the top of the page" }
            - id: broken-link
              text: { uk: "Що посилання веде не на ту адресу", en: "That a link leads to the wrong address" }
              why:
                uk: "Неправильну адресу видно й мишею: клік приведе не туди."
                en: "A wrong address shows up with a mouse too: the click leads to the wrong place."
            - id: wrong-text
              text: { uk: "Що на кнопці помилка в тексті", en: "That a button has a typo in its text" }
              why:
                uk: "Текст на екрані видно будь-як. А де фокус — видно лише тому, хто ним користується."
                en: "Text on the screen is visible either way. Where focus is shows only to someone who uses it."
          correct: [focus-lost]
        explanation:
          uk: "Миша ставить фокус туди, куди клікнули, тож загублений фокус вона ховає. Тому сценарії маршрутів перевіряють з клавіатури — і, за можливості, з програмою екранного читання."
          en: "A mouse puts focus wherever you click, so it hides lost focus. That is why route flows are checked from the keyboard — and, when possible, with a screen reader."

  - id: to-project
    kind: transfer
    capstoneStep: RE-05
    body:
      uk: "Перш ніж закомітити маршрути проєкту, пройди їх з клавіатури, як у цьому уроці: відкрий запис, форму, зміни поле, спробуй «Назад» і інший запис, збережи. Після кожного кроку подивись у консоль і на те, де фокус, — три симптоми з таблиці мають зникнути."
      en: "Before committing the project's routes, walk them from the keyboard as in this lesson: open a record, the form, change a field, try Back and another record, save. After every step look at the console and at where focus is — the three symptoms from the table must be gone."
