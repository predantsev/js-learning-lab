id: re-05-06-loading-empty-error-states
unit: RE-05
title:
  uk: "Стани завантаження, порожнечі й помилки"
  en: "Loading, empty and error states"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Описати стан даних екрана типізованим об’єднанням (loading, empty, error, ready) і щоразу показувати рівно один стан."
    en: "Model a screen's data status as a typed union (loading, empty, error, ready) and render exactly one state at a time."
  - uk: "Писати порожній стан і стан помилки, які кажуть, що сталося, й пропонують наступну дію (створити, спробувати ще раз), і ввічливо оголошувати їх допоміжним технологіям."
    en: "Write empty and error states that say what happened and offer the next action (create, retry), announced politely to assistive technology."
prerequisites: [re-05-05-focus-navigation-unsaved, js-14-03-unions-narrowing]
subskills:
  - { family: R-05, skill: "loading/empty/error states", depth: intro }
glossary: [screen-status]
selfCheck: [predict-booleans-retry, records-screen]

blocks:
  - id: four-situations
    kind: explanation
    title:
      uk: "Чотири ситуації, а не «є дані чи немає»"
      en: "Four situations, not “data or no data”"
    body:
      uk: |
        Екран, що завантажує справи, буває в чотирьох різних ситуаціях, і кожна потребує своїх слів:

        | Ситуація | Що сказати | Яка наступна дія |
        |---|---|---|
        | завантаження | «Завантажую справи…» | чекати |
        | порожньо | «Справ поки немає.» | створити першу |
        | помилка | «Не вдалося завантажити справи.» | спробувати ще раз |
        | готово | «Завантажено справ: 3» і список | працювати зі списком |

        «Порожньо» й «помилка» на екрані схожі — списку немає, — але для людини це протилежні новини. «Справ немає» після збою мережі змусить її думати, що дані зникли, і створювати їх наново.

        Часто цю логіку пишуть трьома окремими станами: `isLoading`, `error` і `tasks`. Подивись, що з цього виходить.
      en: |
        A screen that loads tasks can be in four different situations, and each needs its own words:

        | Situation | What to say | Next action |
        |---|---|---|
        | loading | “Loading tasks…” | wait |
        | empty | “No tasks yet.” | create the first one |
        | error | “Could not load the tasks.” | try again |
        | ready | “Tasks loaded: 3” and the list | work with the list |

        “Empty” and “error” look alike on the screen — there is no list — but for the person they are opposite news. “No tasks” after a network failure makes them think the data is gone and create it again.

        This logic is often written with three separate states: `isLoading`, `error` and `tasks`. See what comes of it.

  - id: predict-booleans-retry
    kind: prediction
    strings:
      loading: { uk: "Завантажую…", en: "Loading…" }
      loadFailed: { uk: "Не вдалося завантажити справи.", en: "Could not load the tasks." }
      noTasks: { uk: "Справ поки немає.", en: "No tasks yet." }
      refresh: { uk: "Оновити", en: "Refresh" }
    prompt:
      uk: "Перше завантаження вдалося: на екрані три справи. Людина натискає «Оновити», і цього разу `loadTasks()` відхиляється. Що на екрані, коли все скінчилося?"
      en: "The first load succeeded: the screen shows three tasks. The person presses “Refresh”, and this time `loadTasks()` rejects. What is on the screen once everything has finished?"
    code: |
      const [isLoading, setIsLoading] = useState(true);
      const [error, setError] = useState<string | null>(null);
      const [tasks, setTasks] = useState<Task[]>([]);

      async function load() {
        setIsLoading(true);
        try {
          setTasks(await loadTasks());
        } catch {
          setError("%%loadFailed%%");
        } finally {
          setIsLoading(false);
        }
      }

      if (isLoading) return <p>%%loading%%</p>;
      return (
        <section>
          {error && <p>{error}</p>}
          {tasks.length === 0 ? <p>%%noTasks%%</p> : <ul>{/* the tasks */}</ul>}
          <button onClick={load}>%%refresh%%</button>
        </section>
      );
    lang: tsx
    runnable: false
    answer:
      type: choice
      options:
        - id: both
          text: { uk: "І помилка, і старий список із трьох справ", en: "Both the error and the old list of three tasks" }
        - id: only-error
          text: { uk: "Лише повідомлення про помилку", en: "Only the error message" }
          why:
            uk: "Ніщо не очистило `tasks`: у `catch` змінюється лише `error`. Тож список із першого завантаження лишається й малюється поруч із помилкою."
            en: "Nothing cleared `tasks`: the `catch` changes only `error`. So the list from the first load stays and is drawn next to the error."
        - id: only-list
          text: { uk: "Лише старий список: помилку перекрив попередній успіх", en: "Only the old list: the earlier success covers the error" }
          why:
            uk: "`error` тепер не `null`, тож абзац помилки малюється. Три змінні незалежні — кожна малює свою частину."
            en: "`error` is no longer `null`, so the error paragraph is drawn. The three variables are independent — each draws its own part."
        - id: loading-forever
          text: { uk: "«Завантажую…» назавжди: помилка зупинила функцію", en: "“Loading…” forever: the error stopped the function" }
          why:
            uk: "`finally` виконується і після `catch`, тож `isLoading` стає `false`."
            en: "`finally` runs after `catch` too, so `isLoading` becomes `false`."
      correct: [both]
    explanation:
      uk: "Перевірено в пісочниці: після невдалого оновлення видно і «Не вдалося завантажити справи.», і три старі справи. А наступне вдале оновлення залишить помилку на місці — її ніхто не скидає. Якщо ж перше завантаження провалиться, екран покаже помилку й «Справ поки немає.» водночас. Три змінні можуть описати комбінації, яких не буває."
      en: "Checked in the sandbox: after the failed refresh you see both “Could not load the tasks.” and the three old tasks. And the next successful refresh leaves the error in place — nobody resets it. If the very first load fails, the screen shows the error and “No tasks yet.” at the same time. Three variables can describe combinations that never happen."

  - id: one-value
    kind: explanation
    title:
      uk: "Один стан — одне значення"
      en: "One status — one value"
    body:
      uk: |
        Замість трьох змінних — одна, тип якої — [[discriminated-union|розмічене об’єднання]] з JS-14. Це [[screen-status|стан екрана]]:

        ```ts
        type Status =
          | { kind: "loading" }
          | { kind: "empty" }
          | { kind: "error" }
          | { kind: "ready"; tasks: Task[] };
        ```

        Значення завжди рівно одне з чотирьох, тож «помилка разом зі списком» просто неможлива: у варіанті `error` немає поля `tasks`. Перехід — це заміна всього значення: `setStatus({ kind: "loading" })`.

        Малюють його через `switch (status.kind)` з гілкою `default`, що передає `status` у функцію з параметром типу `never`. Забудеш варіант — `tsc` покаже помилку ще до запуску. У пісочниці типи лише прибираються, а не перевіряються, тож там забута гілка проявиться вже під час роботи: `default` кине помилку.

        **Оголошення.** Зміну стану треба почути, а фокус переводити тут не варто — людина нікуди не переходила. Для цього є [[live-region|жива область]] з JS-17: елемент `role="status"` з коротким текстом стану. Він має бути на сторінці **в усіх станах** — та сама жива область, у якій змінюється лише текст.
      en: |
        Instead of three variables — one, whose type is a [[discriminated-union]] from JS-14. That is the [[screen-status]]:

        ```ts
        type Status =
          | { kind: "loading" }
          | { kind: "empty" }
          | { kind: "error" }
          | { kind: "ready"; tasks: Task[] };
        ```

        The value is always exactly one of the four, so “an error together with a list” is simply impossible: the `error` member has no `tasks` field. A transition replaces the whole value: `setStatus({ kind: "loading" })`.

        It is drawn with `switch (status.kind)` and a `default` branch that passes `status` to a function with a parameter of type `never`. Forget a member, and `tsc` shows an error before anything runs. The sandbox only removes types and checks nothing, so there a forgotten branch shows up at run time: `default` throws.

        **Announcing.** A change of status must be heard, but moving focus is wrong here — the person has not gone anywhere. That is what the [[live-region]] from JS-17 is for: an element with `role="status"` and the status's short text. It must be on the page **in every state** — the same live region, in which only the text changes.

  - id: status-machine
    kind: visual
    visual: diagram
    title:
      uk: "Переходи між станами екрана"
      en: "Transitions between the screen's statuses"
    textEquivalent:
      uk: >-
        Екран починає в стані loading і показує лише «Завантажую справи…». Коли завантаження повертає три справи,
        стан стає ready: рядок стану каже «Завантажено справ: 3», під ним список. Якщо завантаження повертає порожній
        масив, стан стає empty: «Справ поки немає.» і кнопка створення. Якщо завантаження відхиляється, стан стає error:
        «Не вдалося завантажити справи.» і кнопка «Спробувати ще раз». Ця кнопка повертає екран у loading, і цикл
        повторюється. У кожну мить активний рівно один стан, і на екрані — рівно одна його гілка.
      en: >-
        The screen starts in loading and shows only “Loading tasks…”. When the load returns three tasks, the status
        becomes ready: the status line says “Tasks loaded: 3”, with the list below. If the load returns an empty array,
        the status becomes empty: “No tasks yet.” and a create button. If the load rejects, the status becomes error:
        “Could not load the tasks.” and a Try again button. That button takes the screen back to loading, and the cycle
        repeats. At every moment exactly one status is active, and the screen shows exactly one of its branches.
    spec:
      layout: grid
      nodes:
        - { id: loading, col: 0, row: 0, label: "loading", shape: round, w: 150 }
        - { id: error, col: 1, row: 0, label: "error", shape: round, w: 150 }
        - { id: ready, col: 0, row: 1, label: "ready", shape: round, w: 150 }
        - { id: empty, col: 1, row: 1, label: "empty", shape: round, w: 150 }
      edges:
        - { from: loading, to: ready, label: { uk: "справи є", en: "tasks" } }
        - { from: loading, to: empty, label: "[]" }
        - { id: fail, from: loading, to: error, label: { uk: "відхилено", en: "rejected" } }
        - { id: retry, from: error, to: loading, label: { uk: "ще раз", en: "retry" }, kind: dashed }
      steps:
        - caption:
            uk: "Початок — `loading`. На екрані лише «Завантажую справи…»: ні списку, ні кнопок."
            en: "The start is `loading`. The screen shows only “Loading tasks…”: no list, no buttons."
          highlight: [loading]
          dim: [ready, empty, error]
        - caption:
            uk: "Завантаження повернуло три справи → `ready`: рядок стану «Завантажено справ: 3» і список."
            en: "The load returned three tasks → `ready`: the status line “Tasks loaded: 3” and the list."
          highlight: [ready, loading->ready]
          dim: [empty, error]
        - caption:
            uk: "Інший запуск: порожній масив → `empty`. «Справ поки немає.» і кнопка створення — це не помилка."
            en: "Another run: an empty array → `empty`. “No tasks yet.” and a create button — this is not an error."
          highlight: [empty, loading->empty]
          dim: [ready, error]
        - caption:
            uk: "Ще інший: завантаження відхилено → `error`. Своє повідомлення й кнопка «Спробувати ще раз»; старого списку немає — у варіанті `error` його просто ніде тримати."
            en: "Yet another: the load rejected → `error`. Its own message and a Try again button; no old list — the `error` member has nowhere to keep one."
          highlight: [error, fail]
          dim: [ready, empty]
        - caption:
            uk: "«Спробувати ще раз» повертає в `loading`, і рядок стану (та сама жива область) оголошує нове повідомлення."
            en: "Try again returns to `loading`, and the status line (the same live region) announces the new message."
          highlight: [loading, retry]
          dim: [ready, empty]

  - id: task-status
    kind: example
    runtime: browser-react
    dir: task-status
    entry: main.tsx
    strings:
      nextLoad: { uk: "Наступне завантаження", en: "Next load" }
      planner: { uk: "Планувальник", en: "Planner" }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      serverDown: { uk: "Сервер не відповідає", en: "The server does not answer" }
      loading: { uk: "Завантажую справи…", en: "Loading tasks…" }
      loadFailed: { uk: "Не вдалося завантажити справи.", en: "Could not load the tasks." }
      noTasks: { uk: "Справ поки немає.", en: "No tasks yet." }
      createFirst: { uk: "Додати першу справу", en: "Add the first task" }
      retry: { uk: "Спробувати ще раз", en: "Try again" }
      refresh: { uk: "Оновити", en: "Refresh" }
    title:
      uk: "Три змінні проти одного стану"
      en: "Three variables versus one status"
    body:
      uk: |
        `tasksApi.ts` — несправжній сервер із затримкою 0,4 с; перемикач «Наступне завантаження» вирішує, чим скінчиться наступний запит: `ok`, `empty` чи `fail`. `BooleanScreen` тримає три змінні, `StatusScreen` — одне розмічене об’єднання.

        Натисни **Запустити**. Поки на екрані `BooleanScreen`: вибери `fail` і натисни «Оновити» — помилка й старий список разом. Тепер вибери `ok` і натисни «Оновити» ще раз — помилка так і лишилась.
      en: |
        `tasksApi.ts` is a fake server with a 0.4 s delay; the “Next load” switch decides how the next request ends: `ok`, `empty` or `fail`. `BooleanScreen` keeps three variables, `StatusScreen` keeps one discriminated union.

        Press **Run**. `BooleanScreen` is on the screen for now: choose `fail` and press “Refresh” — the error and the old list together. Now choose `ok` and press “Refresh” again — the error is still there.
    tryIt:
      uk: |
        1. В `App.tsx` заміни `<BooleanScreen />` на `<StatusScreen />`. Запусти й повтори: `fail` → «Оновити» показує лише помилку й «Спробувати ще раз», `ok` → «Спробувати ще раз» повертає список без помилки, а `empty` дає «Справ поки немає.» з кнопкою створення.
        2. У `StatusScreen.tsx` видали всю гілку `case "empty": … ;`. Запусти, вибери `empty` і натисни «Оновити»: сторінка порожніє, а картка помилки показує `Unhandled status: {"kind":"empty"}` — це кинула гілка `default`. Локально `tsc` знайшов би цю діру ще до запуску. Поверни гілку.
      en: |
        1. In `App.tsx` replace `<BooleanScreen />` with `<StatusScreen />`. Run it and repeat: `fail` → “Refresh” shows only the error and “Try again”, `ok` → “Try again” brings the list back without the error, and `empty` gives “No tasks yet.” with a create button.
        2. In `StatusScreen.tsx` delete the whole `case "empty": … ;` branch. Run it, choose `empty` and press “Refresh”: the page goes blank, and the error card shows `Unhandled status: {"kind":"empty"}` — the `default` branch threw it. Locally `tsc` would find this hole before running. Put the branch back.

  - id: records-screen
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: records-screen
    entry: main.tsx
    editable: [RecordsScreen.tsx]
    strings:
      nextLoad: { uk: "Наступне завантаження", en: "Next load" }
      planner: { uk: "Планувальник", en: "Planner" }
      createForm: { uk: "Тут з’явиться форма нової справи.", en: "The new-task form will appear here." }
      tasks: { uk: "Справи", en: "Tasks" }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      serverDown: { uk: "Сервер не відповідає", en: "The server does not answer" }
      loading: { uk: "Завантажую справи…", en: "Loading tasks…" }
      loaded: { uk: "Завантажено справ:", en: "Tasks loaded:" }
      noTasks: { uk: "Справ поки немає.", en: "No tasks yet." }
      loadFailed: { uk: "Не вдалося завантажити справи.", en: "Could not load the tasks." }
      createFirst: { uk: "Додати першу справу", en: "Add the first task" }
      retry: { uk: "Спробувати ще раз", en: "Try again" }
    title:
      uk: "Екран справ із чотирма станами"
      en: "A task screen with four statuses"
    instructions:
      uk: |
        `useTasks()` з `useTasks.ts` уже завантажує справи й повертає `{ status, retry }`, де `status` — одне з `loading`, `empty`, `error`, `ready`. Допиши `RecordsScreen.tsx`:

        - `statusMessage(status)` повертає «Завантажую справи…», «Справ поки немає.», «Не вдалося завантажити справи.» або «Завантажено справ: 3» (з числом справ);
        - під заголовком — елемент `role="status"` з цим текстом, **той самий у всіх станах**;
        - під ним — лише гілка поточного стану: для `empty` — кнопка «Додати першу справу», що викликає `onCreate`; для `error` — кнопка «Спробувати ще раз», що викликає `retry`; для `ready` — список назв справ; для `loading` — нічого.

        Перевірки монтують окремий `RecordsScreen`, наперед кажуть несправжньому серверу, чим скінчиться завантаження, і самі пересувають час на його 300 мс затримки, тож не залежать від швидкості комп’ютера. Вони стежать, чи елемент `role="status"` лишається тим самим DOM-елементом. Типи в пісочниці не перевіряються — перевірки дивляться на поведінку.
      en: |
        `useTasks()` from `useTasks.ts` already loads the tasks and returns `{ status, retry }`, where `status` is one of `loading`, `empty`, `error`, `ready`. Complete `RecordsScreen.tsx`:

        - `statusMessage(status)` returns “Loading tasks…”, “No tasks yet.”, “Could not load the tasks.” or “Tasks loaded: 3” (with the number of tasks);
        - under the heading — an element with `role="status"` and that text, **the same one in every status**;
        - below it — only the current status's branch: for `empty`, an “Add the first task” button that calls `onCreate`; for `error`, a “Try again” button that calls `retry`; for `ready`, the list of task titles; for `loading`, nothing.

        The checks mount a separate `RecordsScreen`, tell the fake server in advance how the load will end, and move time over its 300 ms delay themselves, so they do not depend on how fast the computer is. They watch whether the `role="status"` element stays the same DOM element. Types are not checked in the sandbox — the checks look at behavior.
    testTitles:
      "while loading only the loading status is shown":
        uk: "Під час завантаження видно лише стан завантаження"
        en: "While loading only the loading status is shown"
      "a successful load shows the count and the tasks":
        uk: "Вдале завантаження показує кількість і справи"
        en: "A successful load shows the count and the tasks"
      "an empty load shows the empty status and a create action":
        uk: "Порожнє завантаження показує порожній стан і дію створення"
        en: "An empty load shows the empty status and a create action"
      "a failed load shows its own message and a retry that loads again":
        uk: "Невдале завантаження показує власне повідомлення й повтор, що завантажує знову"
        en: "A failed load shows its own message and a retry that loads again"
      "the status element stays the same element in every state":
        uk: "Елемент `role=\"status\"` лишається тим самим у всіх станах"
        en: "The `role=\"status\"` element stays the same element in every status"
    hints:
      nudge:
        uk: "Розділи екран на дві частини: те, що є завжди (заголовок і рядок стану), і те, що залежить від `status.kind`. Яка з них має бути на тому самому місці в кожному стані?"
        en: "Split the screen into two parts: what is always there (the heading and the status line) and what depends on `status.kind`. Which of them must be in the same place in every status?"
      explanation:
        uk: |
          React зберігає DOM-елемент, поки на тому самому місці дерева стоїть той самий тип. Тож рядок стану має бути в тій самій позиції в кожному рендері, а змінюватися — лише його текст. Ранній `return` для одного зі станів з іншою розміткою створить новий елемент і зламає живу область.

          Гілки тіла зручно писати через `status.kind === "…" && …`: TypeScript звужує тип усередині, тож `status.tasks` доступний лише для `ready`. Схожий приклад з іншими станами: `{order.kind === "shipped" && <p>{order.trackingCode}</p>}`.
        en: |
          React keeps a DOM element as long as the same type stands in the same place of the tree. So the status line must be in the same position on every render, and only its text changes. An early `return` with different markup for one of the statuses creates a new element and breaks the live region.

          Body branches are handy to write as `status.kind === "…" && …`: TypeScript narrows the type inside, so `status.tasks` is available only for `ready`. A similar example with other states: `{order.kind === "shipped" && <p>{order.trackingCode}</p>}`.
    solutionNote:
      uk: "Рядок стану — одна жива область, яка лише змінює текст: допоміжна технологія оголосить кожну зміну, а фокус лишиться там, де був. Кожна гілка тіла залежить від `status.kind`, тож старий список не може пережити помилку, а порожнеча й помилка мають різні слова й різні дії. `assertNever` у `default` робить пропущений варіант помилкою `tsc`."
      en: "The status line is one live region that only changes its text: assistive technology announces every change, and focus stays where it was. Every body branch depends on `status.kind`, so an old list cannot outlive an error, and empty and error have different words and different actions. `assertNever` in `default` turns a missing member into a `tsc` error."
    feedback:
      - when: { test: "while loading only the loading status is shown" }
        message:
          uk: "Ця перевірка дивиться одразу після монтування й чекає в елементі `role=\"status\"` текст «Завантажую справи…», без жодного пункту списку й жодної кнопки. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "This check looks right after mounting and expects the text “Loading tasks…” in the `role=\"status\"` element, with no list items and no buttons. If every check fails at once, fix the first error in the console first."
      - when: { test: "a successful load shows the count and the tasks" }
        message:
          uk: "Ця перевірка чекає після завантаження «Завантажено справ: 3» у рядку стану й три пункти списку з назвами справ. Для `ready` число й список беруться з `status.tasks`."
          en: "This check expects “Tasks loaded: 3” in the status line after loading and three list items with the task titles. For `ready` the number and the list come from `status.tasks`."
      - when: { test: "an empty load shows the empty status and a create action" }
        message:
          uk: "Ця перевірка чекає для порожнього списку «Справ поки немає.», жодного пункту й кнопку «Додати першу справу», клік по якій викликає `onCreate` рівно один раз."
          en: "This check expects “No tasks yet.” for an empty list, no items and an “Add the first task” button whose click calls `onCreate` exactly once."
      - when: { test: "a failed load shows its own message and a retry that loads again" }
        message:
          uk: "Ця перевірка чекає після збою «Не вдалося завантажити справи.» (а не порожній стан), кнопку «Спробувати ще раз» без кнопки створення, а після кліку — «Завантажую справи…» і потім список. Кнопка має викликати `retry`."
          en: "After a failure this check expects “Could not load the tasks.” (not the empty state), a “Try again” button without a create button, and after the click “Loading tasks…” and then the list. The button must call `retry`."
      - when: { test: "the status element stays the same element in every state" }
        message:
          uk: "Ця перевірка запам’ятовує елемент `role=\"status\"` під час завантаження й чекає той самий елемент після помилки й після повтору. Рядок стану має стояти на тому самому місці в кожному рендері, без окремого раннього `return` для одного стану."
          en: "This check remembers the `role=\"status\"` element during loading and expects the same element after the failure and after the retry. The status line must stand in the same place on every render, without a separate early `return` for one status."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: server-error-fulfills
        from: js-08-07-failures-loading-error
        prompt:
          uk: "Сервер відповів на `fetch` кодом `500`. Що зробить `await fetch(url)`?"
          en: "The server answered a `fetch` with status `500`. What does `await fetch(url)` do?"
        answer:
          type: choice
          options:
            - id: fulfills
              text: { uk: "Поверне відповідь із `response.ok === false` — помилку треба перевірити самому", en: "Returns a response with `response.ok === false` — you have to check the error yourself" }
            - id: rejects
              text: { uk: "Кине `TypeError`, і виконання перейде в `catch`", en: "Throws a `TypeError`, and execution goes to `catch`" }
              why:
                uk: "`fetch` відхиляється лише тоді, коли відповіді немає зовсім (мережа). Відповідь з помилкою — це все одно відповідь."
                en: "`fetch` rejects only when there is no answer at all (network). An error response is still a response."
          correct: [fulfills]
        explanation:
          uk: "Тож завантажувач, який веде до стану `error`, має перевіряти `response.ok` і сам кидати помилку для 404 чи 500 — інакше екран покаже порожній чи зламаний `ready`."
          en: "So a loader that leads to the `error` status must check `response.ok` and throw for a 404 or a 500 itself — otherwise the screen shows an empty or broken `ready`."

  - id: to-project
    kind: transfer
    capstoneStep: RE-05
    body:
      uk: "У проєкті екран списку отримає стан з чотирьох варіантів. Хай кожен має власні слова й дію: порожній список — кнопку створення першого запису, помилка — повтор, а рядок `role=\"status\"` лишається на місці в усіх станах. Перевір кожен стан окремо: порожній список, збій завантаження й готові дані."
      en: "In the project the list screen gets a status with four members. Give each its own words and action: an empty list — a button to create the first record, an error — a retry, and the `role=\"status\"` line stays in place in every status. Check each status separately: an empty list, a failed load and ready data."
