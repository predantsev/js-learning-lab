id: re-05-05-focus-navigation-unsaved
unit: RE-05
title:
  uk: "Фокус під час навігації й незбережені зміни"
  en: "Focus on navigation and unsaved edits"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Після зміни маршруту переводити фокус на заголовок нового екрана й оновлювати заголовок вкладки, щоб перехід оголошувався."
    en: "Move focus to the new screen's heading after a route change and update the document title so the change is announced."
  - uk: "Виявляти незбережені зміни порівнянням чернетки зі збереженим записом, просити підтвердження перед переходом усередині застосунку (зокрема його «Назад») і реєструвати `beforeunload` для перезавантаження чи закриття вкладки."
    en: "Detect unsaved edits by comparing the draft with the saved record, confirm before in-app navigation (including the app's Back), and register `beforeunload` for a reload or tab close."
prerequisites: [re-05-04-validation-accessible-errors, re-04-05-refs-focus]
subskills:
  - { family: R-05, skill: "focus/navigation/unsaved edits", depth: intro }
glossary: [route-focus, unsaved-changes-guard]
selfCheck: [predict-focus-after-link, unsaved-guard]

blocks:
  - id: silent-change
    kind: explanation
    title:
      uk: "Перехід, якого ніхто не почув"
      en: "A transition nobody heard"
    body:
      uk: |
        Коли браузер завантажує нову сторінку, програма екранного читання оголошує її заголовок, а фокус починає з початку сторінки. Маршрутизація на боці клієнта нічого не завантажує — тож нічого й не оголошується. Гірше: якщо елемент, на якому був фокус (наприклад, посилання «Редагувати»), зник разом зі старим екраном, фокус падає на `body`, і наступний Tab починається звідки заманеться браузеру.

        Тому після кожного переходу код робить те, що браузер робив сам, — [[route-focus|фокус маршруту]]:

        - `document.title` — новий заголовок вкладки, щоб його було видно в історії й закладках;
        - заголовок нового екрана отримує `tabIndex={-1}` і `ref`, а після commit — `focus()`: програма читає його, і людина знає, де опинилась.

        Під час першого відкриття сторінки фокус не чіпають: браузер сам почав зверху, і людина ще нікуди не переходила. Маршрутизатор курсу каже, як з’явився запис: `useLocation().action` — `"initial"`, `"push"`, `"replace"`, `"back"` чи `"forward"`.
      en: |
        When the browser loads a new page, a screen reader announces its title, and focus starts from the top of the page. Client-side routing loads nothing — so nothing is announced either. Worse: if the element that had focus (for example the “Edit” link) disappeared with the old screen, focus falls to `body`, and the next Tab starts wherever the browser pleases.

        So after every transition the code does what the browser used to do — [[route-focus]]:

        - `document.title` — the tab's new title, visible in the history and in bookmarks;
        - the new screen's heading gets `tabIndex={-1}` and a `ref`, and after the commit `focus()`: the reader says it, and the person knows where they are.

        On the page's first open focus is left alone: the browser started at the top itself, and the person has not gone anywhere yet. The course router says how the entry came about: `useLocation().action` is `"initial"`, `"push"`, `"replace"`, `"back"` or `"forward"`.

  - id: predict-focus-after-link
    kind: prediction
    prompt:
      uk: "Маршрутизатор без фокуса маршруту. На екрані бажання людина з клавіатури натискає Enter на посиланні «Редагувати», і форма замінює екран деталей. Де тепер фокус і що оголосить програма екранного читання?"
      en: "A router without route focus. On a wish's screen the person presses Enter on the “Edit” link from the keyboard, and the form replaces the detail screen. Where is focus now, and what does a screen reader announce?"
    answer:
      type: choice
      options:
        - id: body-silent
          text: { uk: "Фокус на `body`, програма не оголошує нічого", en: "Focus is on `body`, the reader announces nothing" }
        - id: first-field
          text: { uk: "Фокус у першому полі форми", en: "Focus is in the form's first field" }
          why:
            uk: "Фокус ніхто не переводив. Посилання, на якому він був, демонтувалося разом з екраном деталей, тож фокус випав на `body`."
            en: "Nobody moved focus. The link it was on unmounted together with the detail screen, so focus fell out to `body`."
        - id: announced
          text: { uk: "Фокус на початку сторінки, і програма читає нову сторінку, як після завантаження", en: "Focus is at the start of the page, and the reader reads the new page, as after a load" }
          why:
            uk: "Так буває після справжнього завантаження сторінки. Тут сторінка та сама: змінилася лише частина DOM, і браузер не вважає це новою сторінкою."
            en: "That happens after a real page load. Here the page is the same: only part of the DOM changed, and the browser does not treat it as a new page."
      correct: [body-silent]
    explanation:
      uk: "Перевірено в пісочниці: після кліку «Редагувати» `document.activeElement` — `BODY`. Видимий вміст змінився, а для людини з клавіатурою чи програмою екранного читання вона лишилась у порожнечі. Заголовок із `tabIndex={-1}` і `focus()` після commit повертає їй місце."
      en: "Checked in the sandbox: after clicking “Edit”, `document.activeElement` is `BODY`. The visible content changed, but for a person with a keyboard or a screen reader they were left in a void. A heading with `tabIndex={-1}` and `focus()` after the commit gives them their place back."

  - id: predict-back-from-draft
    kind: prediction
    prompt:
      uk: "Маршрутизатор без жодної охорони. Людина змінила в формі назву бажання й, не зберігаючи, натиснула «Назад» застосунку. Що станеться з її змінами?"
      en: "A router with no guard at all. The person changed a wish's name in the form and, without saving, pressed the app's Back. What happens to their edits?"
    answer:
      type: choice
      options:
        - id: lost
          text: { uk: "Екран деталей з’являється одразу, а зміни зникають разом із формою", en: "The detail screen appears at once, and the edits vanish together with the form" }
        - id: asks
          text: { uk: "Маршрутизатор спершу питає, чи піти без збереження", en: "The router first asks whether to leave without saving" }
          why:
            uk: "Маршрутизатор нічого не знає про чернетку форми. Питати він буде лише тоді, коли форма сама скаже йому, що є незбережені зміни."
            en: "The router knows nothing about the form's draft. It asks only when the form itself tells it that there are unsaved edits."
        - id: kept
          text: { uk: "Зміни дочекаються: «Вперед» поверне форму з тим самим текстом", en: "The edits wait: Forward brings the form back with the same text" }
          why:
            uk: "«Вперед» поверне адресу форми, але компонент форми демонтувався, і його стан зник. Нова форма почне зі збереженого запису."
            en: "Forward brings back the form's address, but the form component unmounted, and its state is gone. The new form starts from the saved record."
      correct: [lost]
    explanation:
      uk: "Чернетка — стан компонента форми, а демонтування його знищує. Тому форма має сама сказати маршрутизатору «зачекай», поки в ній є незбережені зміни."
      en: "The draft is the form component's state, and unmounting destroys it. So the form itself has to tell the router “wait” while it has unsaved edits."

  - id: guard
    kind: explanation
    title:
      uk: "Охорона незбережених змін"
      en: "Guarding unsaved edits"
    body:
      uk: |
        [[unsaved-changes-guard|Охорона незбережених змін]] складається з трьох частин.

        **1. Чи є що втрачати.** Зміни незбережені, коли чернетка відрізняється від збереженого запису: `const isDirty = draft.name !== saved.name;`. Не «форму відкрито», а саме «щось змінено» — інакше людина, що лише подивилась, щоразу відповідатиме на зайве питання.

        **2. Переходи всередині застосунку.** `useBlocker(isDirty)` з маршрутизатора курсу: поки `isDirty` — `true`, кожен перехід (посилання, `navigate`, «Назад» застосунку) чекає, а `blocked` стає `true`. Екран показує власне питання з кнопками, що викликають `proceed()` чи `stay()`, в елементі з `role="alertdialog"` — так допоміжні технології знають, що це термінове питання, яке чекає відповіді. Вікна `confirm()` у пісочниці немає, але й у справжньому застосунку власне питання краще: його можна перекласти й оформити. «Зберегти» переходить з `{ skipGuard: true }` — після збереження втрачати нічого.

        **3. Перезавантаження й закриття вкладки.** Тут вирішує браузер, і застосунок може лише попросити попередити: обробник події `beforeunload` викликає `event.preventDefault()`. Текст питання браузер пише сам. Слухач потрібен лише поки є незбережені зміни — додається в ефекті й прибирається в cleanup. У пісочниці цього вікна не побачиш: її сторінка не перезавантажується.

        Кнопка «Назад» самого браузера у вкладці — окремий випадок: подія `popstate` приходить, коли адреса вже змінилась. Бібліотеки маршрутизації вміють і це; маршрутизатор курсу охороняє «Назад» застосунку.
      en: |
        An [[unsaved-changes-guard]] has three parts.

        **1. Is there anything to lose.** Edits are unsaved when the draft differs from the saved record: `const isDirty = draft.name !== saved.name;`. Not “the form is open” but “something changed” — otherwise a person who only looked has to answer a pointless question every time.

        **2. Transitions inside the app.** `useBlocker(isDirty)` from the course router: while `isDirty` is `true`, every transition (a link, `navigate`, the app's Back) waits, and `blocked` becomes `true`. The screen shows its own question with buttons that call `proceed()` or `stay()`, in an element with `role="alertdialog"` — that tells assistive technology this is an urgent question waiting for an answer. There is no `confirm()` window in the sandbox, and in a real app your own question is better anyway: it can be translated and styled. “Save” navigates with `{ skipGuard: true }` — after saving there is nothing to lose.

        **3. Reloading and closing the tab.** Here the browser decides, and the app can only ask for a warning: a `beforeunload` event handler calls `event.preventDefault()`. The browser writes the question's text itself. The listener is needed only while there are unsaved edits — added in an effect and removed in the cleanup. You will not see this window in the sandbox: its page does not reload.

        The browser's own Back button in a tab is a separate case: the `popstate` event arrives when the address has already changed. Routing libraries handle that too; the course router guards the app's Back.

  - id: back-with-guard
    kind: visual
    visual: sequence
    title:
      uk: "«Назад» із незбереженою чернеткою"
      en: "Back with an unsaved draft"
    textEquivalent:
      uk: >-
        Людина змінила назву бажання й натискає «Назад» застосунку. Маршрутизатор має охорону, бо форма передала
        isDirty = true, тож не переходить, а позначає перехід як такий, що чекає. Екран редагування бачить blocked =
        true і показує питання «Є незбережені зміни. Піти без збереження?», а фокус ставить на кнопку «Лишитися».
        Людина вибирає «Піти без збереження». Форма викликає proceed(), маршрутизатор виконує відкладений перехід,
        форма демонтується разом із чернеткою, а її cleanup знімає охорону й слухача beforeunload. Монтується екран
        деталей, ставить заголовок вкладки й переводить фокус на свій заголовок. Якби людина вибрала «Лишитися»,
        stay() скасував би перехід, і чернетка лишилася б у формі.
      en: >-
        The person changed a wish's name and presses the app's Back. The router has a guard because the form passed
        isDirty = true, so it does not navigate but marks the transition as waiting. The edit screen sees blocked =
        true and shows the question “There are unsaved changes. Leave without saving?”, putting focus on the Stay
        button. The person chooses Leave without saving. The form calls proceed(), the router performs the delayed
        transition, the form unmounts together with its draft, and its cleanup removes the guard and the
        beforeunload listener. The detail screen mounts, sets the tab's title and moves focus to its heading. Had
        the person chosen Stay, stay() would cancel the transition, and the draft would stay in the form.
    spec:
      actors:
        - { id: person, label: { uk: "Людина", en: "Person" } }
        - { id: router, label: { uk: "Маршрутизатор", en: "Router" } }
        - { id: screen, label: { uk: "Екран редагування", en: "Edit screen" } }
      intro:
        uk: "Чернетка відрізняється від збереженого бажання, тож форма викликала `useBlocker(true)`: у маршрутизатора є охорона."
        en: "The draft differs from the saved wish, so the form called `useBlocker(true)`: the router has a guard."
      messages:
        - from: person
          to: router
          label: { uk: "«Назад» застосунку", en: "the app's Back" }
          caption:
            uk: "Людина натискає «Назад» застосунку."
            en: "The person presses the app's Back."
        - from: router
          to: screen
          label: "blocked: true"
          kind: async
          caption:
            uk: "Охорона є, тож маршрутизатор **не переходить**: він запам’ятовує перехід як такий, що чекає, і повідомляє екрану `blocked: true`."
            en: "There is a guard, so the router **does not navigate**: it remembers the transition as waiting and tells the screen `blocked: true`."
        - from: screen
          to: person
          label: { uk: "«Піти без збереження?»", en: "“Leave without saving?”" }
          caption:
            uk: "Екран показує власне питання й ставить фокус на «Лишитися» — найбезпечнішу відповідь."
            en: "The screen shows its own question and puts focus on Stay — the safest answer."
        - from: person
          to: screen
          label: { uk: "«Піти без збереження»", en: "“Leave without saving”" }
          caption:
            uk: "Людина свідомо обирає піти."
            en: "The person deliberately chooses to leave."
        - from: screen
          to: router
          label: "proceed()"
          caption:
            uk: "Форма викликає `proceed()`: маршрутизатор виконує відкладений перехід «Назад»."
            en: "The form calls `proceed()`: the router performs the delayed Back."
        - from: router
          to: router
          kind: note
          label: { uk: "форма демонтується", en: "the form unmounts" }
          note:
            uk: "Чернетка зникає; cleanup ефектів знімає охорону й слухача beforeunload."
            en: "The draft is gone; the effects' cleanups remove the guard and the beforeunload listener."
          caption:
            uk: "Форма демонтується, а її cleanup знімає охорону й слухача `beforeunload`."
            en: "The form unmounts, and its cleanups remove the guard and the `beforeunload` listener."
        - from: router
          to: person
          label: { uk: "деталі: фокус на заголовок", en: "detail: focus on heading" }
          kind: return
          caption:
            uk: "Монтується екран деталей: ставить `document.title` і переводить фокус на свій заголовок — людина чує, де опинилась."
            en: "The detail screen mounts: it sets `document.title` and moves focus to its heading — the person hears where they are."

  - id: wish-focus-guard
    kind: example
    runtime: browser-react
    dir: wish-focus-guard
    entry: main.jsx
    strings:
      historyLabel: { uk: "Історія переходів", en: "Navigation history" }
      back: { uk: "Назад", en: "Back" }
      forward: { uk: "Вперед", en: "Forward" }
      now: { uk: "ми тут", en: "you are here" }
      wishes: { uk: "Мої бажання", en: "My wishes" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      notFound: { uk: "Бажання не знайдено", en: "Wish not found" }
      price: { uk: "Ціна", en: "Price" }
      edit: { uk: "Редагувати", en: "Edit" }
      editing: { uk: "Редагування", en: "Editing" }
      name: { uk: "Назва", en: "Name" }
      save: { uk: "Зберегти", en: "Save" }
      unsaved: { uk: "Є незбережені зміни. Піти без збереження?", en: "There are unsaved changes. Leave without saving?" }
      stay: { uk: "Лишитися", en: "Stay" }
      leave: { uk: "Піти без збереження", en: "Leave without saving" }
      reportLabel: { uk: "Що отримує програма екранного читання", en: "What a screen reader gets" }
      reportFocus: { uk: "Фокус:", en: "Focus:" }
      reportInvalid: { uk: "недійсне значення", en: "invalid entry" }
      reportDescription: { uk: "Опис:", en: "Description:" }
    title:
      uk: "Фокус маршруту й охорона чернетки"
      en: "Route focus and a guarded draft"
    body:
      uk: |
        Кожен екран викликає `useRouteFocus(title)`: після переходу він ставить заголовок вкладки й фокус на свій `<h1>`. Форма редагування рахує `isDirty` і передає його в `useBlocker`. Панель унизу показує, де фокус.

        Натисни **Запустити**. На **Сторінці** відкрий «Настільна лампа» (фокус переходить на заголовок), «Редагувати», зміни назву й натисни «← Назад»: з’являється питання, а фокус на «Лишитися». Спробуй обидві відповіді.
      en: |
        Every screen calls `useRouteFocus(title)`: after a transition it sets the tab's title and focus on its `<h1>`. The edit form computes `isDirty` and passes it to `useBlocker`. The panel at the bottom shows where focus is.

        Press **Run**. On the **Page** open “Desk lamp” (focus moves to the heading), “Edit”, change the name and press “← Back”: the question appears, with focus on Stay. Try both answers.
    tryIt:
      uk: |
        1. У `useRouteFocus` закоментуй рядок `if (action !== "initial") headingRef.current.focus();`. Запусти, відкрий бажання й натисни «Редагувати»: панель показує `body` — фокус загубився разом із посиланням. Поверни рядок.
        2. У `ItemEdit` заміни `useBlocker(isDirty)` на `useBlocker(true)`. Запусти, відкрий форму й, нічого не змінюючи, натисни «← Назад»: питання з’являється й тепер, хоч утрачати нічого. Поверни `isDirty`.
      en: |
        1. In `useRouteFocus` comment out the line `if (action !== "initial") headingRef.current.focus();`. Run it, open a wish and press “Edit”: the panel shows `body` — focus got lost together with the link. Put the line back.
        2. In `ItemEdit` replace `useBlocker(isDirty)` with `useBlocker(true)`. Run it, open the form and, changing nothing, press “← Back”: the question appears now too, although there is nothing to lose. Put `isDirty` back.

