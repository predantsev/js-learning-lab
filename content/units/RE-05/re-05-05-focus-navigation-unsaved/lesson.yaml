    instructions:
      uk: |
        Форма звички вже рахує, чи змінено назву, і передає це у `useUnsavedChangesGuard(isDirty)`, а питання «Піти без збереження?» показує, коли `guard.blocked`. Допиши хук у `useUnsavedChangesGuard.js`:

        - поки `isDirty` — `true`, переходи всередині застосунку чекають підтвердження (`useBlocker` з маршрутизатора курсу), а хук повертає те, що повертає `useBlocker`;
        - поки `isDirty` — `true`, на `window` висить слухач `beforeunload`, який викликає `event.preventDefault()`;
        - коли змін немає або екран зник, слухача немає.

        Перевірки монтують окрему копію застосунку, змінюють назву, натискають «← Назад», «Лишитися», «Піти без збереження» й посилання на іншу звичку. Вікна перезавантаження в пісочниці не буває, тож перевірки самі надсилають подію `beforeunload` і дивляться, чи її скасовано, а ще рахують слухачів `beforeunload`, яких додала й зняла твоя копія.
      en: |
        The habit form already computes whether the name changed and passes it to `useUnsavedChangesGuard(isDirty)`, and it shows the question “Leave without saving?” when `guard.blocked`. Complete the hook in `useUnsavedChangesGuard.js`:

        - while `isDirty` is `true`, transitions inside the app wait for a confirmation (`useBlocker` from the course router), and the hook returns what `useBlocker` returns;
        - while `isDirty` is `true`, a `beforeunload` listener on `window` calls `event.preventDefault()`;
        - when there are no edits or the screen is gone, there is no listener.

        The checks mount a separate copy of the app, change the name, and press “← Back”, “Stay”, “Leave without saving” and a link to another habit. The sandbox never shows a reload window, so the checks dispatch a `beforeunload` event themselves and look at whether it was canceled, and they also count the `beforeunload` listeners your copy added and removed.
    testTitles:
      "leaving an unchanged form does not ask":
        uk: "Вихід із незміненої форми нічого не питає"
        en: "Leaving an unchanged form does not ask"
      "Back from a changed form asks first, and Stay keeps the draft":
        uk: "«Назад» зі зміненої форми спершу питає, а «Лишитися» зберігає чернетку"
        en: "Back from a changed form asks first, and Stay keeps the draft"
      "Leave goes back without saving":
        uk: "«Піти без збереження» повертає назад без збереження"
        en: "“Leave without saving” goes back without saving"
      "a link to another habit from a changed form also asks":
        uk: "Посилання на іншу звичку зі зміненої форми теж питає"
        en: "A link to another habit from a changed form also asks"
      "reloading is guarded only while the form is changed":
        uk: "Перезавантаження охороняється лише поки форма змінена"
        en: "Reloading is guarded only while the form is changed"
      "leaving the edit screen removes the beforeunload listener":
        uk: "Вихід з екрана редагування знімає слухача `beforeunload`"
        en: "Leaving the edit screen removes the `beforeunload` listener"
    hints:
      nudge:
        uk: "Хук складається з двох частин: одна — для переходів усередині застосунку, друга — для вкладки браузера. Яка з них — це ефект, і коли він має щось робити?"
        en: "The hook has two parts: one for transitions inside the app, the other for the browser tab. Which of them is an effect, and when should it do something?"
      explanation:
        uk: |
          Переходи в застосунку охороняє `useBlocker(isDirty)` — його результат і повертай. Слухач `beforeunload` — це зовнішня система, тож він живе в ефекті з залежністю `isDirty`: якщо змін немає, ефект нічого не додає, а якщо є — додає слухача й повертає cleanup, що знімає **ту саму** функцію.

          Схожий приклад з іншою подією: `useEffect(() => { if (!playing) return; const onKey = (e) => {…}; window.addEventListener("keydown", onKey); return () => window.removeEventListener("keydown", onKey); }, [playing]);`.
        en: |
          Transitions in the app are guarded by `useBlocker(isDirty)` — return its result. The `beforeunload` listener is an external system, so it lives in an effect with the dependency `isDirty`: if there are no edits, the effect adds nothing, and if there are, it adds the listener and returns a cleanup that removes **that same** function.

          A similar example with another event: `useEffect(() => { if (!playing) return; const onKey = (e) => {…}; window.addEventListener("keydown", onKey); return () => window.removeEventListener("keydown", onKey); }, [playing]);`.
    solutionNote:
      uk: "Обидві частини залежать від того самого `isDirty`. Ефект перезапускається, коли воно змінюється: `false` → `true` додає слухача, `true` → `false` спершу викликає cleanup, що його знімає. Демонтування форми теж викликає cleanup, тож після виходу вкладка більше не попереджає. Слухач, доданий назавжди, питав би й про незмінену форму — тієї самої помилки ти уникнув і в `useBlocker`."
      en: "Both parts depend on the same `isDirty`. The effect re-runs when it changes: `false` → `true` adds the listener, `true` → `false` first calls the cleanup that removes it. Unmounting the form also calls the cleanup, so after leaving, the tab no longer warns. A listener added forever would ask about an unchanged form too — the same mistake you avoided with `useBlocker`."
    feedback:
      - when: { test: "leaving an unchanged form does not ask" }
        message:
          uk: "Ця перевірка відкриває форму, нічого не змінює й натискає «← Назад»: питання бути не повинно, а на екрані — деталі звички. Охорона має залежати від `isDirty`, а не бути увімкненою завжди. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "This check opens the form, changes nothing and presses “← Back”: there must be no question, and the screen shows the habit's detail. The guard must depend on `isDirty`, not be on all the time. If every check fails at once, fix the first error in the console first."
      - when: { test: "Back from a changed form asks first, and Stay keeps the draft" }
        message:
          uk: "Ця перевірка дописує `!` до назви, натискає «← Назад» і чекає питання (`role=\"alertdialog\"`), а після «Лишитися» — ту саму форму з чернеткою. Хук має повертати `blocked`, `proceed` і `stay` від `useBlocker(isDirty)`."
          en: "This check adds `!` to the name, presses “← Back” and expects the question (`role=\"alertdialog\"`), and after Stay the same form with the draft. The hook must return `blocked`, `proceed` and `stay` from `useBlocker(isDirty)`."
      - when: { test: "Leave goes back without saving" }
        message:
          uk: "Ця перевірка після питання натискає «Піти без збереження» й чекає екран деталей зі старою назвою. Кнопка викликає `proceed`, який повертає хук."
          en: "After the question this check presses “Leave without saving” and expects the detail screen with the old name. The button calls the `proceed` the hook returns."
      - when: { test: "a link to another habit from a changed form also asks" }
        message:
          uk: "Ця перевірка змінює назву й клікає в списку «Пити воду»: питання має з’явитися й тут. `useBlocker` охороняє будь-який перехід усередині застосунку, не лише «Назад»."
          en: "This check changes the name and clicks “Drink water” in the list: the question must appear here too. `useBlocker` guards any transition inside the app, not only Back."
      - when: { test: "reloading is guarded only while the form is changed" }
        message:
          uk: "Ця перевірка надсилає `beforeunload` тричі: незмінена форма — подію не скасовано, змінена — скасовано, назву повернуто як було — знову не скасовано. Слухач має існувати лише поки `isDirty` — `true` і викликати `event.preventDefault()`."
          en: "This check dispatches `beforeunload` three times: an unchanged form — the event is not canceled, a changed one — canceled, the name typed back — not canceled again. The listener must exist only while `isDirty` is `true` and call `event.preventDefault()`."
      - when: { test: "leaving the edit screen removes the beforeunload listener" }
        message:
          uk: "Ця перевірка змінює назву, виходить через «Піти без збереження» й чекає 0 слухачів `beforeunload` від твоєї копії. Ефект має повертати cleanup, що передає в `removeEventListener` ту саму функцію, яку додав."
          en: "This check changes the name, leaves through “Leave without saving” and expects 0 `beforeunload` listeners from your copy. The effect must return a cleanup that passes the same function it added to `removeEventListener`."
      - when: { error: ReferenceError }
        message:
          uk: "Якщо картка каже `useBlocker is not defined` чи `useEffect is not defined`, перевір імпорти вгорі `useUnsavedChangesGuard.js`."
          en: "If the card says `useBlocker is not defined` or `useEffect is not defined`, check the imports at the top of `useUnsavedChangesGuard.js`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: focus-in-render
        from: re-04-05-refs-focus
        prompt:
          uk: "Компонент екрана хоче поставити фокус на свій заголовок. Де можна викликати `headingRef.current.focus()`?"
          en: "A screen component wants to put focus on its heading. Where can it call `headingRef.current.focus()`?"
        answer:
          type: choice
          options:
            - id: effect
              text: { uk: "В ефекті: після commit `headingRef.current` уже вказує на елемент на сторінці", en: "In an effect: after the commit `headingRef.current` already points to the element on the page" }
            - id: render
              text: { uk: "Просто в тілі компонента, одразу після `useRef`", en: "Right in the component body, just after `useRef`" }
              why:
                uk: "Під час рендеру елемента ще немає на сторінці: на першому рендері `headingRef.current` — `null`. Рендер описує, що показати; торкатися DOM можна після commit."
                en: "During render the element is not on the page yet: on the first render `headingRef.current` is `null`. Render describes what to show; the DOM can be touched after the commit."
            - id: anywhere
              text: { uk: "Будь-де: `ref` завжди містить елемент", en: "Anywhere: a `ref` always holds the element" }
              why:
                uk: "`ref.current` заповнюється під час commit і стає `null`, коли елемент зникає. До commit його ще немає."
                en: "`ref.current` is filled during the commit and becomes `null` when the element disappears. Before the commit it is not there yet."
          correct: [effect]
        explanation:
          uk: "Ефект запускається після commit, коли заголовок уже в DOM. Тому `useRouteFocus` переводить фокус саме в ефекті."
          en: "An effect runs after the commit, when the heading is already in the DOM. That is why `useRouteFocus` moves focus precisely in an effect."
      - id: same-function
        from: re-03-03-dependencies-cleanup
        prompt:
          uk: "Чому цей cleanup не знімає слухача?"
          en: "Why does this cleanup not remove the listener?"
        code: |
          useEffect(() => {
            window.addEventListener("beforeunload", (event) => event.preventDefault());
            return () => window.removeEventListener("beforeunload", (event) => event.preventDefault());
          }, [isDirty]);
        lang: jsx
        runnable: false
        answer:
          type: choice
          options:
            - id: different-function
              text: { uk: "Це дві різні функції: `removeEventListener` знімає лише ту, яку передали в `addEventListener`", en: "These are two different functions: `removeEventListener` removes only the one passed to `addEventListener`" }
            - id: wrong-time
              text: { uk: "Cleanup запускається надто пізно — лише коли закривають вкладку", en: "The cleanup runs too late — only when the tab is closed" }
              why:
                uk: "Cleanup запускається перед кожним повторним запуском ефекту й під час демонтування. Проблема в іншому: він знімає не ту функцію."
                en: "The cleanup runs before every re-run of the effect and on unmount. The problem is elsewhere: it removes the wrong function."
            - id: works
              text: { uk: "Він знімає: функції однакові, бо їхній код однаковий", en: "It does remove it: the functions are equal because their code is equal" }
              why:
                uk: "Кожна стрілкова функція — новий об’єкт. Дві однакові на вигляд функції не рівні, як два однакові об’єкти."
                en: "Every arrow function is a new object. Two functions that look the same are not equal, just like two equal-looking objects."
          correct: [different-function]
        explanation:
          uk: "Збережи функцію в змінній усередині ефекту й передай ту саму змінну обом викликам. Інакше кожен запуск ефекту лишатиме ще одного слухача."
          en: "Keep the function in a variable inside the effect and pass that same variable to both calls. Otherwise every run of the effect leaves one more listener behind."

  - id: to-project
    kind: transfer
    capstoneStep: RE-05
    body:
      uk: "У проєкті кожен екран після переходу ставить `document.title` і фокус на свій заголовок, а форма редагування порівнює чернетку зі збереженим записом і, поки вони різні, просить підтвердження перед виходом — і в застосунку, і через `beforeunload`. Перевір це з клавіатури: Tab після кожного переходу має починати з нового екрана."
      en: "In the project every screen sets `document.title` and focus on its heading after a transition, and the edit form compares the draft with the saved record and, while they differ, asks for confirmation before leaving — both in the app and through `beforeunload`. Check it from the keyboard: after every transition, Tab must start from the new screen."
