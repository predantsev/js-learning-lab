id: rn-09-01-secure-vs-ordinary-storage
unit: RN-09
title:
  uk: "Захищене сховище проти звичайного"
  en: "Secure storage vs ordinary storage"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Розкласти синтетичні значення (токен сеансу, налаштування теми, список записів) між захищеним і звичайним сховищем і пояснити кожен вибір."
    en: "Classify synthetic values (a session token, a theme preference, a list of records) as secure-storage or ordinary-storage data and justify each choice."
  - uk: "Пояснити, що захищає Keychain/Keystore платформи (значення в спокої, доступне лише цьому застосунку), а що ні (значення, яке вже записали в журнал, надіслали чи тримають у пам’яті)."
    en: "Explain what the platform keychain/keystore protects (values at rest, scoped to the app) and what it does not (a value already logged, sent or held in memory)."
prerequisites: [rn-05-01-storage-adapters, js-16-08-secrets-storage-privacy]
subskills:
  - { family: N-07, skill: "secure credential storage vs ordinary storage", depth: intro }
glossary: [secure-storage, keychain, android-keystore]
selfCheck: [predict-where, secret-store]

blocks:
  - id: two-shelves
    kind: explanation
    title:
      uk: "Два місця для даних на телефоні"
      en: "Two places for data on a phone"
    body:
      uk: |
        У RN-05 записи проєкту лягали в асинхронне сховище «ключ — значення» через адаптер. Воно зберігає текст **як є**, у файлах застосунку, і за замовчуванням нічого не шифрує. Для списку справ це нормально. Для [[secret|токена сеансу]] — ні: хто отримає копію файлів застосунку (резервна копія, телефон зі зламаним захистом), той прочитає токен і ввійде від імені людини. Документація React Native так і пише: асинхронне сховище — не для токенів і секретів.

        Для таких значень платформа має [[secure-storage|захищене сховище]]: на iOS — [[keychain|Keychain]], на Android — значення, зашифровані ключем з [[android-keystore|Android Keystore]]. У Expo до обох веде одна бібліотека `expo-secure-store`:

        ```ts
        await SecureStore.setItemAsync('session.token', token);
        const saved = await SecureStore.getItemAsync('session.token'); // string | null
        ```

        Цей урок про два питання: **що** туди класти і **від чого** воно справді захищає.
      en: |
        In RN-05 the project's records went into an asynchronous key-value store through an adapter. It keeps text **as it is**, in the app's files, and encrypts nothing by default. That is fine for a task list. It is not fine for a [[secret|session token]]: whoever gets a copy of the app's files (a backup, a phone with broken protection) reads the token and signs in as the person. The React Native documentation says it plainly: the asynchronous store is not for tokens and secrets.

        For such values the platform has [[secure-storage|secure storage]]: on iOS the [[keychain|Keychain]], on Android values encrypted with a key from the [[android-keystore|Android Keystore]]. In Expo one library, `expo-secure-store`, leads to both:

        ```ts
        await SecureStore.setItemAsync('session.token', token);
        const saved = await SecureStore.getItemAsync('session.token'); // string | null
        ```

        This lesson is about two questions: **what** goes in there, and **what** it really protects against.

  - id: predict-where
    kind: prediction
    prompt:
      uk: "Застосунок планувальника зберігає три значення: токен сеансу `session.token`, обрану тему `\"dark\"` і 120 справ у JSON (близько 15 КБ тексту). Куди що покласти?"
      en: "A planner app keeps three values: the session token `session.token`, the chosen theme `\"dark\"` and 120 tasks as JSON (about 15 KB of text). Where does each one go?"
    answer:
      type: choice
      options:
        - id: token-only
          text:
            uk: "Токен — у захищене сховище, тему й справи — у звичайне"
            en: "The token into secure storage, the theme and the tasks into ordinary storage"
        - id: all-secure
          text:
            uk: "Усе в захищене сховище: так надійніше"
            en: "Everything into secure storage: it is safer that way"
          why:
            uk: "Захищене сховище — для маленьких значень, що дають доступ. Expo попереджає, що великі значення платформа може відхилити (деякі версії iOS не приймали понад приблизно 2048 байтів), а 15 КБ справ — це вже великий запис. Тема ні до чого не дає доступу, а справи — дані людини, але не ключ до її облікового запису: їх захищає те, що застосунок збирає лише потрібне (урок 3), а не Keychain."
            en: "Secure storage is for small values that grant access. Expo warns that the platform may reject large values (some iOS versions refused more than roughly 2048 bytes), and 15 KB of tasks is a large entry. The theme grants access to nothing, and the tasks are the person's data but not a key to their account: they are protected by the app collecting only what it needs (lesson 3), not by the Keychain."
        - id: all-ordinary
          text:
            uk: "Усе у звичайне: файли застосунку й так бачить лише застосунок"
            en: "Everything into ordinary storage: only the app sees its files anyway"
          why:
            uk: "Поки телефон цілий — майже так. Але звичайне сховище — це текст у файлах без шифрування: копія цих файлів (резервна копія, телефон зі зламаним захистом) показує токен як є, і з ним можна ввійти від імені людини."
            en: "While the phone is intact, almost. But ordinary storage is unencrypted text in files: a copy of those files (a backup, a phone with broken protection) shows the token as it is, and it lets someone sign in as the person."
        - id: token-and-tasks
          text:
            uk: "Токен і справи — у захищене, тему — у звичайне"
            en: "The token and the tasks into secure storage, the theme into ordinary storage"
          why:
            uk: "Справи не дають доступу до облікового запису, а 15 КБ тексту — завеликий запис для Keychain/Keystore: Expo попереджає, що великі значення платформа може відхилити."
            en: "The tasks grant no access to an account, and 15 KB of text is too large an entry for the Keychain/Keystore: Expo warns that the platform may reject large values."
      correct: [token-only]
    explanation:
      uk: "Питання не «що цінне», а «що дає доступ». Токен — це доступ: хто його має, той діє від імені людини. Тому він іде в захищене сховище, а тема й записи — у звичайне, через адаптер з RN-05. Так ще й видно, що два сховища — дві різні речі з різними контрактами."
      en: "The question is not “what is valuable” but “what grants access”. The token is access: whoever has it acts as the person. So it goes into secure storage, while the theme and the records go into ordinary storage through the RN-05 adapter. It also makes clear that the two stores are two different things with different contracts."

  - id: two-adapters
    kind: visual
    visual: diagram
    title:
      uk: "Два шляхи збереження й момент, коли захист закінчується"
      en: "Two save paths, and the moment protection ends"
    textEquivalent:
      uk: "Застосунок тримає два значення: токен сеансу й список справ. Токен іде через адаптер SecretStore у Keychain на iOS чи в сховище, зашифроване ключем з Android Keystore: там він лежить зашифрованим, і операційна система віддає його лише цьому застосунку. Список справ іде через StorageAdapter у звичайні файли застосунку як JSON без шифрування. Якщо хтось отримає копію файлів застосунку, він прочитає справи як є, а запис Keychain/Keystore не прочитає. Коли ж застосунок читає токен назад, значення опиняється в пам’яті застосунку; якщо його записати в журнал чи вставити в адресу запиту, ця копія вже поза захищеним сховищем, і воно її не захищає."
      en: "The app holds two values: a session token and a task list. The token goes through the SecretStore adapter into the Keychain on iOS, or into storage encrypted with a key from the Android Keystore: there it lies encrypted, and the operating system hands it only to this app. The task list goes through the StorageAdapter into the app's ordinary files as unencrypted JSON. If someone gets a copy of the app's files, they read the tasks as they are, but not the Keychain/Keystore entry. When the app reads the token back, the value lands in the app's memory; if it is written to a log or put into a request address, that copy is outside secure storage, and secure storage does not protect it."
    spec:
      layout: grid
      nodes:
        - { id: token, label: "session.token", col: 0, row: 0, w: 164, shape: pill }
        - { id: tasks, label: { uk: "справи (JSON)", en: "tasks (JSON)" }, col: 1, row: 0, w: 164, shape: pill }
        - { id: secret, label: "SecretStore", col: 0, row: 1, w: 164 }
        - { id: ordinary, label: "StorageAdapter", col: 1, row: 1, w: 164 }
        - { id: vault, label: "Keychain / Keystore", col: 0, row: 2, w: 164, shape: cylinder }
        - { id: files, label: { uk: "файли: текст як є", en: "files: plain text" }, col: 1, row: 2, w: 164, shape: cylinder }
        - { id: memory, label: { uk: "пам’ять після читання", en: "memory after a read" }, col: 0, row: 3, w: 164, shape: note }
        - { id: leak, label: { uk: "журнал, адреса запиту", en: "log, request address" }, col: 1, row: 3, w: 164, shape: note }
      edges:
        - { from: token, to: secret }
        - { from: secret, to: vault }
        - { from: tasks, to: ordinary }
        - { from: ordinary, to: files }
        - { from: vault, to: memory, kind: dashed }
        - { from: memory, to: leak }
      hidden: [memory, leak]
      steps:
        - caption:
            uk: "Два значення, два адаптери. Токен знає лише `SecretStore`, справи — лише `StorageAdapter` з RN-05."
            en: "Two values, two adapters. The token is known only to `SecretStore`, the tasks only to the `StorageAdapter` from RN-05."
          highlight: [token, tasks, secret, ordinary, token->secret, tasks->ordinary]
          dim: [vault, files]
        - caption:
            uk: "Токен лягає в Keychain (iOS) чи зашифрованим ключем з Keystore (Android): зашифрований у спокої, і система віддає його лише цьому застосунку."
            en: "The token goes into the Keychain (iOS) or is encrypted with a Keystore key (Android): encrypted at rest, and the system hands it only to this app."
          highlight: [vault, secret->vault]
          dim: [tasks, ordinary, files]
        - caption:
            uk: "Справи лягають у файли застосунку звичайним JSON — без шифрування. Для справ цього досить: вони не дають доступу до облікового запису."
            en: "The tasks go into the app's files as plain JSON — unencrypted. That is enough for tasks: they grant no access to an account."
          highlight: [files, ordinary->files]
          dim: [token, secret, vault]
        - caption:
            uk: "Хтось отримав копію файлів застосунку: справи він читає як є, а запис Keychain/Keystore — ні. Саме від цього й захищає захищене сховище."
            en: "Someone got a copy of the app's files: they read the tasks as they are, but not the Keychain/Keystore entry. That is exactly what secure storage protects against."
          highlight: [vault, files]
          annotate:
            - { id: vault, text: { uk: "не прочитати", en: "unreadable" } }
            - { id: files, text: { uk: "читається", en: "readable" } }
        - caption:
            uk: "Застосунок читає токен назад — тепер це звичайний текстовий рядок у пам’яті. Записаний у журнал чи вставлений в адресу запиту, він лежить там без жодного захисту: сейф захищає лише те, що в ньому."
            en: "The app reads the token back — now it is an ordinary string in memory. Written to a log or put into a request address, it lies there with no protection at all: the safe protects only what is inside it."
          show: [memory, leak]
          highlight: [memory, leak, vault->memory, memory->leak]
          dim: [tasks, ordinary, files]

  - id: hotel-safe
    kind: analogy
    body:
      uk: "Сейф у готельному номері й відкрита полиця поруч. Обидва в твоєму номері, але лише сейф має замок, прив’язаний до цього номера. Паспорт — у сейф; книжку й зарядку — на полицю: замикати їх нема від чого, а в сейф вони й не влізуть."
      en: "The safe in a hotel room and the open shelf next to it. Both are in your room, but only the safe has a lock tied to this room. The passport goes into the safe; the book and the charger go on the shelf: there is nothing to lock them away from, and they would not fit in the safe anyway."
    limits:
      uk: "Сейф береже річ, поки вона лежить у ньому. Щойно ти дістав паспорт — прочитав токен у пам’ять, записав у журнал чи надіслав, — сейф його більше не захищає. І ще: на телефоні сейф відчиняє не людина, а сам застосунок, тому код застосунку, який зливає токен, сейф не зупинить."
      en: "The safe guards the item while it lies inside. As soon as you take the passport out — read the token into memory, write it to a log or send it — the safe no longer protects it. Also: on a phone the safe is opened not by a person but by the app itself, so app code that leaks the token is not stopped by the safe."

  - id: predict-after-read
    kind: prediction
    runnable: false
    prompt:
      uk: "Токен лежить у захищеному сховищі. Після перезапуску застосунок робить так: `const token = await SecureStore.getItemAsync('session.token')`, потім `console.log('debug: token', token)`, потім `` fetch(`${base}/tasks?token=${token}`) ``. Де після цього є копія токена, яку можна прочитати без Keychain/Keystore?"
      en: "The token lies in secure storage. After a restart the app does this: `const token = await SecureStore.getItemAsync('session.token')`, then `console.log('debug: token', token)`, then `` fetch(`${base}/tasks?token=${token}`) ``. Where is there now a copy of the token that can be read without the Keychain/Keystore?"
    answer:
      type: choice
      options:
        - id: three-places
          text:
            uk: "У пам’яті застосунку, у журналі й в адресі запиту (а отже, й у журналах сервера та проміжних вузлів)"
            en: "In the app's memory, in the log and in the request address (and so in the logs of the server and anything in between)"
        - id: nowhere
          text:
            uk: "Ніде: токен прийшов із захищеного сховища, тож він захищений і далі"
            en: "Nowhere: the token came from secure storage, so it stays protected"
          why:
            uk: "Захищене сховище повертає звичайний рядок. Що з ним робить код далі, сховище не бачить і не контролює: копія в журналі чи в адресі вже поза ним."
            en: "Secure storage returns an ordinary string. What the code does with it next, the store neither sees nor controls: a copy in a log or an address is already outside it."
        - id: memory-only
          text:
            uk: "Лише в пам’яті застосунку: журнал і запит отримують зашифроване значення"
            en: "Only in the app's memory: the log and the request receive an encrypted value"
          why:
            uk: "Шифрування стосується лише запису в Keychain/Keystore. `getItemAsync` повертає вже розшифрований текст, і саме його отримують `console.log` і адреса запиту."
            en: "The encryption applies only to the entry in the Keychain/Keystore. `getItemAsync` returns already decrypted text, and that is what `console.log` and the request address receive."
      correct: [three-places]
    explanation:
      uk: "Захищене сховище береже значення **в спокої**. Прочитане значення — звичайний рядок, і кожне місце, куди його передали, — нова копія без захисту. Тому токен не друкують у журнал, а надсилають у заголовку `Authorization`, а не в адресі: адреси часто осідають у журналах серверів."
      en: "Secure storage guards the value **at rest**. A value that was read is an ordinary string, and every place it is passed to is a new, unprotected copy. That is why the token is never printed to a log, and is sent in the `Authorization` header rather than in the address: addresses often end up in server logs."

  - id: storage-inspector
    kind: example
    runtime: concept-preview
    dir: storage-inspector
    entry: main.jsx
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      session: { uk: "Сеанс відновлено", en: "Session restored" }
      "yes": { uk: "так", en: "yes" }
      "no": { uk: "ні", en: "no" }
      filesTitle: { uk: "Файли застосунку (звичайне сховище, текст як є)", en: "App files (ordinary storage, text as it is)" }
      keychainTitle: { uk: "Keychain / Keystore (захищене сховище)", en: "Keychain / Keystore (secure storage)" }
      hidden: { uk: "зашифровано — лише для цього застосунку", en: "encrypted — for this app only" }
      logTitle: { uk: "Журнал пристрою", en: "Device log" }
      empty: { uk: "порожньо", en: "empty" }
    title:
      uk: "Що видно в копії файлів і в журналі"
      en: "What a copy of the files and the log show"
    body:
      uk: |
        `deviceSim.js` грає роль телефона: `ordinaryStorage` пише текст у «файли застосунку», `secureStorage` — у «Keychain/Keystore», а `deviceLogLine` — це `console.log` на пристрої, рядок якого лишається в журналі. Сторінка показує те, що прочитав би той, хто має копію файлів застосунку й журнал.

        `StorageLab.jsx` зберігає токен, тему й дві справи, а потім читає токен назад, як після перезапуску. Натисни **Запустити**: токен поки що лежить у «файлах» поруч зі справами — відкритим текстом.
      en: |
        `deviceSim.js` plays the phone: `ordinaryStorage` writes text into the “app files”, `secureStorage` into the “Keychain/Keystore”, and `deviceLogLine` is `console.log` on the device, whose line stays in the log. The page shows what someone with a copy of the app's files and the log would read.

        `StorageLab.jsx` saves the token, the theme and two tasks, then reads the token back, as after a restart. Press **Run**: the token so far lies in the “files” next to the tasks — as plain text.
    tryIt:
      uk: |
        1. У `StorageLab.jsx` закоментуй перший рядок `const tokenStore = …` і розкоментуй другий, з `secureStorage`. Запусти: `session.token` зник із файлів і з’явився в Keychain/Keystore без значення, а «Сеанс відновлено» — досі «так».
        2. Розкоментуй рядок `deviceLogLine('debug: restored session with', token);`. Запусти: токен знову видно відкритим текстом — тепер у журналі пристрою, хоча лежить він у захищеному сховищі.
        3. Закоментуй цей рядок знову: налагоджувальний вивід токена — помилка, навіть тимчасовий.
      en: |
        1. In `StorageLab.jsx` comment out the first `const tokenStore = …` line and uncomment the second one, with `secureStorage`. Run: `session.token` has left the files and appears in the Keychain/Keystore without a value, and “Session restored” still says “yes”.
        2. Uncomment the line `deviceLogLine('debug: restored session with', token);`. Run: the token is visible as plain text again — now in the device log, although it lives in secure storage.
        3. Comment that line out again: debug output of a token is a mistake, even a temporary one.
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не нативний застосунок. «Файли», «Keychain/Keystore» і «журнал» — звичайні об’єкти JavaScript у `deviceSim.js`, а не справжні сховища: шифрування тут немає, і перегляд нічого не доводить про безпеку пристрою. Немає й самого пристрою, нативних модулів, жестів, крім миші й клавіатури, вигляду платформи й продуктивності телефона. Справжнє захищене сховище перевіряють лише на твоїй цілі."
      en: "This is a browser preview through react-native-web, not a native app. The “files”, the “Keychain/Keystore” and the “log” are plain JavaScript objects in `deviceSim.js`, not real stores: there is no encryption here, and the preview proves nothing about the security of a device. There is no device either, no native modules, no gestures beyond mouse and keyboard, no platform look and no phone performance. Real secure storage is checked only on your target."

  - id: recall-native-storage
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: what-async-store-keeps
        from: rn-05-01-storage-adapters
        prompt:
          uk: "Нативне асинхронне сховище «ключ — значення», через яке адаптер проєкту зберігає записи, — як саме воно тримає дані?"
          en: "The native asynchronous key-value store through which the project's adapter saves its records — how exactly does it keep the data?"
        answer:
          type: choice
          options:
            - id: plain-per-install
              text:
                uk: "Рядками, без шифрування за замовчуванням, у сховищі цього встановленого застосунку; видалення застосунку прибирає їх"
                en: "As strings, unencrypted by default, in the storage of this installed app; uninstalling the app removes them"
            - id: encrypted
              text:
                uk: "Зашифрованими, бо файли застосунку недоступні іншим застосункам"
                en: "Encrypted, because other apps cannot reach the app's files"
              why:
                uk: "Що інші застосунки не бачать цих файлів — правда, але це не шифрування. Хто отримає копію файлів (резервна копія, телефон зі зламаним захистом), прочитає текст як є."
                en: "That other apps cannot see these files is true, but it is not encryption. Whoever gets a copy of the files (a backup, a phone with broken protection) reads the text as it is."
            - id: objects
              text:
                uk: "Будь-якими значеннями JavaScript, як `useState`"
                en: "As any JavaScript values, like `useState`"
              why:
                uk: "Сховище приймає лише рядки — тому адаптер робить `JSON.stringify` перед записом і `JSON.parse` після читання."
                en: "The store accepts only strings — that is why the adapter calls `JSON.stringify` before a write and `JSON.parse` after a read."
          correct: [plain-per-install]
        explanation:
          uk: "Асинхронне сховище — рядки в пісочниці застосунку, без шифрування. Для записів цього досить; для токена — ні, і тому в нього окреме сховище й окремий контракт."
          en: "The asynchronous store is strings in the app's sandbox, unencrypted. That is enough for records; not for a token, which is why it gets a separate store and a separate contract."

  - id: secret-store
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: secret-store
    entry: index.js
    editable: [secretStore.ts]
    title:
      uk: "Контракт SecretStore і подвійник у пам’яті"
      en: "The SecretStore contract and an in-memory double"
    instructions:
      uk: |
        `contracts.ts` описує `SecretStore` — окремий від сховища записів контракт для секретів. На телефоні його реалізує адаптер над `expo-secure-store`, у тестах — подвійник у пам’яті. Напиши подвійник: `createMemorySecretStore({ available })` у `secretStore.ts`.

        Правила контракту (вони ж у коментарі в `contracts.ts`):

        - кожен метод повертає `Promise` з **результатом**: `{ ok: true, value }` або `{ ok: false, error }` — і ніколи не відхиляється;
        - `getSecret` ключа, якого не записували (зокрема `"toString"`), дає `{ ok: true, value: null }`; `setSecret` і `deleteSecret` при успіху дають `{ ok: true, value: null }`;
        - ключ — це щонайменше один символ із латинських літер, цифр, `.`, `-` і `_` (так обмежує ключі `expo-secure-store`); будь-який інший ключ — `invalid-key` для **всіх трьох** методів, і нічого не зберігається;
        - значення довше за 2048 символів — `too-large`, а старе значення лишається;
        - сховище з `available: false` (так буває на пристрої, де захищене сховище недоступне) дає `unavailable` для кожного виклику;
        - кожне сховище окреме, а `localStorage` браузера не змінюється.

        `contracts.ts` і `index.js` редагувати не можна. Демо в `index.js` друкує результати.
      en: |
        `contracts.ts` describes `SecretStore` — a contract for secrets, separate from the records storage. On a phone an adapter over `expo-secure-store` implements it; in tests an in-memory double does. Write the double: `createMemorySecretStore({ available })` in `secretStore.ts`.

        The contract's rules (also in the comment in `contracts.ts`):

        - every method returns a `Promise` with a **result**: `{ ok: true, value }` or `{ ok: false, error }` — and never rejects;
        - `getSecret` of a key that was never set (`"toString"` included) gives `{ ok: true, value: null }`; `setSecret` and `deleteSecret` give `{ ok: true, value: null }` on success;
        - a key is at least one character from Latin letters, digits, `.`, `-` and `_` (that is how `expo-secure-store` limits keys); any other key is `invalid-key` for **all three** methods, and nothing is stored;
        - a value longer than 2048 characters is `too-large`, and the old value stays;
        - a store with `available: false` (it happens on a device where secure storage is unavailable) gives `unavailable` for every call;
        - every store is separate, and the browser's `localStorage` does not change.

        `contracts.ts` and `index.js` cannot be edited. The demo in `index.js` prints the results.
    testTitles:
      "set, get and delete resolve with ok results":
        uk: "`setSecret`, `getSecret` і `deleteSecret` дають результати `ok`"
        en: "`setSecret`, `getSecret` and `deleteSecret` resolve with `ok` results"
      "a key that was never set gives ok with null":
        uk: "Незаписаний ключ дає `ok` з `null`"
        en: "A key that was never set gives `ok` with `null`"
      "an invalid key is refused by every method and nothing is stored":
        uk: "Недопустимий ключ відхиляє кожен метод, і нічого не зберігається"
        en: "An invalid key is refused by every method, and nothing is stored"
      "a value longer than 2048 characters is refused and the old value stays":
        uk: "Значення довше за 2048 символів відхилено, старе лишилося"
        en: "A value longer than 2048 characters is refused, and the old value stays"
      "an unavailable store refuses every call":
        uk: "Недоступне сховище відхиляє кожен виклик"
        en: "An unavailable store refuses every call"
      "two stores do not share secrets":
        uk: "Два сховища не бачать секретів одне одного"
        en: "Two stores do not share secrets"
      "the secret store leaves localStorage untouched":
        uk: "Сховище секретів не змінює `localStorage`"
        en: "The secret store leaves `localStorage` untouched"
    hints:
      nudge:
        uk: "Почни з того, що спільне для всіх трьох методів: які дві перевірки кожен із них робить, перш ніж торкатися значень? І що метод повертає, коли щось не так, — кидає помилку чи повертає об’єкт?"
        en: "Start with what all three methods share: which two checks does each of them make before touching the values? And what does a method do when something is wrong — throw, or return an object?"
      explanation:
        uk: "Зручно мати одну допоміжну функцію, яка повертає готовий результат-відмову або `null`, якщо все гаразд, — і викликати її першим рядком кожного методу. Перевірку ключа робить регулярний вираз з якорями `^` і `$`: наприклад, `/^[a-z]+$/.test(word)` перевіряє, що **все** слово — з малих літер. Значення тримай у `Map`, створеному **всередині** фабрики, і для відсутнього ключа повертай `null` явно (`has` перед `get`). Позначка `async` перетворює повернений об’єкт на `Promise`, тож `return { ok: false, … }` дає саме те, що потрібно, — без `throw`."
        en: "It is handy to have one helper that returns a ready refusal result, or `null` when everything is fine — and to call it on the first line of every method. A regular expression with the anchors `^` and `$` checks the key: for example, `/^[a-z]+$/.test(word)` checks that the **whole** word is lowercase letters. Keep the values in a `Map` created **inside** the factory, and return `null` explicitly for a missing key (`has` before `get`). The `async` keyword turns the returned object into a `Promise`, so `return { ok: false, … }` gives exactly what is needed — no `throw`."
    solutionNote:
      uk: "Помилки тут — значення, а не винятки: екран, що викликає `getSecret`, однаково обробляє «немає токена», «недоступне сховище» й «поганий ключ» через `if (!result.ok)` і не падає від забутого `try`. Обмеження ключа й довжини повторюють справжню бібліотеку, тож тест із подвійником ловить ті самі помилки, що й телефон. А `Map` усередині фабрики й нуль звертань до `localStorage` тримають секрети окремо — і від інших сховищ, і від записів."
      en: "Errors here are values, not exceptions: a screen that calls `getSecret` handles “no token”, “store unavailable” and “bad key” the same way through `if (!result.ok)` and does not crash because of a forgotten `try`. The key and length limits mirror the real library, so a test with the double catches the same mistakes a phone would. And a `Map` inside the factory with no access to `localStorage` keeps secrets apart — from other stores and from the records."
    feedback:
      - when: { test: "set, get and delete resolve with ok results" }
        message:
          uk: "Ця перевірка записує `tok_a1`, потім `tok_b2`, читає, видаляє й читає знову. Вона очікує `{ ok: true, value: null }` від `setSecret` і `deleteSecret`, `{ ok: true, value: \"tok_b2\" }` від `getSecret` після другого запису і `{ ok: true, value: null }` після видалення."
          en: "This check writes `tok_a1`, then `tok_b2`, reads, deletes and reads again. It expects `{ ok: true, value: null }` from `setSecret` and `deleteSecret`, `{ ok: true, value: \"tok_b2\" }` from `getSecret` after the second write and `{ ok: true, value: null }` after the delete."
      - when: { test: "a key that was never set gives ok with null" }
        message:
          uk: "Ця перевірка очікує `{ ok: true, value: null }` — саме `null`, не `undefined` — для ключів, яких не записували, зокрема для `\"toString\"`."
          en: "This check expects `{ ok: true, value: null }` — exactly `null`, not `undefined` — for keys that were never set, `\"toString\"` included."
      - when: { test: "an invalid key is refused by every method and nothing is stored" }
        message:
          uk: "Ця перевірка очікує `{ ok: false, error: \"invalid-key\" }` від `setSecret`, `getSecret` і `deleteSecret` для ключів із пробілом, зі скісною рискою та для порожнього ключа — як **повернений** результат, а не як відхилений `Promise`."
          en: "This check expects `{ ok: false, error: \"invalid-key\" }` from `setSecret`, `getSecret` and `deleteSecret` for keys with a space, with a slash and for an empty key — as a **returned** result, not a rejected `Promise`."
      - when: { test: "a value longer than 2048 characters is refused and the old value stays" }
        message:
          uk: "Ця перевірка очікує `{ ok: false, error: \"too-large\" }` для 2049 символів, після цього — попереднє значення `tok_d4`, а для рівно 2048 символів — `{ ok: true, value: null }`."
          en: "This check expects `{ ok: false, error: \"too-large\" }` for 2049 characters, the previous value `tok_d4` after that, and `{ ok: true, value: null }` for exactly 2048 characters."
      - when: { test: "an unavailable store refuses every call" }
        message:
          uk: "Ця перевірка створює сховище з `{ available: false }` і очікує `{ ok: false, error: \"unavailable\" }` від кожного з трьох методів — повернений результат, а не виняток."
          en: "This check creates a store with `{ available: false }` and expects `{ ok: false, error: \"unavailable\" }` from each of the three methods — a returned result, not an exception."
      - when: { test: "two stores do not share secrets" }
        message:
          uk: "Ця перевірка записує секрет в одне сховище й очікує `{ ok: true, value: null }` у другому. Значення мають жити всередині кожного виклику фабрики."
          en: "This check writes a secret into one store and expects `{ ok: true, value: null }` in the other. The values must live inside each call of the factory."
      - when: { test: "the secret store leaves localStorage untouched" }
        message:
          uk: "Ця перевірка очікує, що після `setSecret` у `localStorage` немає жодного ключа: подвійник тримає секрети в пам’яті, а не у звичайному сховищі."
          en: "This check expects no key in `localStorage` after `setSecret`: the double keeps secrets in memory, not in ordinary storage."
      - when: { error: TypeError }
        message:
          uk: "Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі: найчастіше це звертання до властивості `undefined` у `secretStore.ts`."
          en: "If every check fails at once, fix the first console error first: most often it is reading a property of `undefined` in `secretStore.ts`."

  - id: to-checkpoint
    kind: transfer
    checkpoint: CP-RN
    body:
      uk: "Твій проєкт не має входу й токенів — і це правильно: нічого секретного він не зберігає, тож захищене сховище йому не потрібне. На контрольній точці CP-RN ти перевіриш саме це: у сховищі записів лежать лише записи (`jsll.<проєкт>.v1`), а налаштування — окремо, і жодного токена ніде немає."
      en: "Your project has no sign-in and no tokens — and that is right: it keeps nothing secret, so it does not need secure storage. At the CP-RN checkpoint you will check exactly that: the records storage holds only the records (`jsll.<capstone>.v1`), settings are kept apart, and there is no token anywhere."
