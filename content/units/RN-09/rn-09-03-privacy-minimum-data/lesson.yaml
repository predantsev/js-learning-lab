id: rn-09-03-privacy-minimum-data
unit: RN-09
title:
  uk: "Приватність і мінімум даних"
  en: "Privacy and minimum data"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Намалювати схему потоку даних для синтетичної функції: що збирається, де лежить кожна копія, куди її надсилають і скільки її тримають."
    en: "Draw a data-flow diagram for a synthetic feature showing what is collected, where each copy is stored, where it is sent and how long it is kept."
  - uk: "Прибрати із синтетичного payload поля, яких функція не потребує, і пояснити кожне вилучення."
    en: "Remove fields from a synthetic payload that the feature does not need and justify each removal."
prerequisites: [rn-09-02-no-embedded-secrets, rn-05-04-offline-cache-authority]
subskills:
  - { family: N-07, skill: "privacy/minimum data", depth: intro }
glossary: [data-flow-diagram, data-retention]
selfCheck: [predict-copies, minimal-payload]

blocks:
  - id: count-the-copies
    kind: explanation
    title:
      uk: "Рахуй копії, а не поля"
      en: "Count copies, not fields"
    body:
      uk: |
        Людина додає витрату й фотографує чек. Вона ввела назву й суму, а камера додала до фото ще й **метадані EXIF**: модель телефона, точний час і часто — GPS-координати місця, де зроблено знімок. Людина їх не вводила й, найімовірніше, про них не думає.

        Далі одна дія «Зберегти» може розкласти ці дані в кілька місць: чернетка у сховищі, рядок налагоджувального журналу, тіло запиту до сервера, а там — база й журнали сервера. Кожне місце — **окрема копія**, яку треба захистити, пояснити людині й колись видалити.

        Інструмент, щоб це побачити, — [[data-flow-diagram|схема потоку даних]]: для кожного поля — звідки воно взялося, де лежить кожна копія, куди її надсилають і скільки тримають ([[data-retention|термін зберігання]]). Те, чого функція не потребує, викреслюють **до** першої копії — це та сама [[data-minimization|мінімізація даних]], що й у JS-16.
      en: |
        A person adds an expense and takes a photo of the receipt. They typed the label and the amount, and the camera added **EXIF metadata** to the photo: the phone model, the exact time and often the GPS coordinates of the place where the picture was taken. The person did not type them and most likely does not think about them.

        Then a single Save can spread this data into several places: a draft in storage, a line in the debug log, the body of a request to the server, and there a database and the server's logs. Each place is **a separate copy** that has to be protected, explained to the person and deleted some day.

        The tool to see this is a [[data-flow-diagram|data-flow diagram]]: for every field — where it came from, where each copy lies, where it is sent and how long it is kept (its [[data-retention|retention period]]). What the feature does not need is struck out **before** the first copy — the same [[data-minimization|data minimization]] as in JS-16.

  - id: predict-copies
    kind: prediction
    runnable: false
    prompt:
      uk: "Функція збереження робить так: `const draft = expense;` (витрата разом із фото чека та його EXIF), потім записує `JSON.stringify(draft)` у сховище як чернетку, друкує `console.log('debug: saving', JSON.stringify(draft))` і надсилає `JSON.stringify(draft)` на mock-сервіс. Скільки **нових** копій GPS-координат створює одне натискання «Зберегти»?"
      en: "The save function does this: `const draft = expense;` (the expense together with the receipt photo and its EXIF), then writes `JSON.stringify(draft)` to storage as a draft, prints `console.log('debug: saving', JSON.stringify(draft))` and sends `JSON.stringify(draft)` to the mock service. How many **new** copies of the GPS coordinates does a single Save press create?"
    answer:
      type: choice
      options:
        - id: three
          text:
            uk: "Три: чернетка у сховищі, рядок журналу й тіло запиту"
            en: "Three: the draft in storage, the log line and the request body"
        - id: one
          text:
            uk: "Одну — у запиті; сховище й журнал лишаються на телефоні, тож не рахуються"
            en: "One — in the request; storage and the log stay on the phone, so they do not count"
          why:
            uk: "Копія на телефоні — теж копія: вона потрапляє в резервні копії, її бачить кожен, хто має доступ до пристрою, а журнали часто збирають інструменти звітів про збої. «Не покидає пристрій» не означає «не має наслідків для приватності»."
            en: "A copy on the phone is still a copy: it ends up in backups, everyone with access to the device can see it, and logs are often collected by crash-reporting tools. “Never leaves the device” does not mean “has no privacy implications”."
        - id: zero
          text:
            uk: "Жодної: координати лежать у фото, а фото надсилають окремо"
            en: "None: the coordinates are in the photo, and the photo is sent separately"
          why:
            uk: "`draft` — це весь об’єкт, разом із `receipt.exif`. `JSON.stringify` перетворює на текст і метадані, тож координати є в кожному з трьох рядків."
            en: "`draft` is the whole object, `receipt.exif` included. `JSON.stringify` turns the metadata into text as well, so the coordinates are in each of the three strings."
      correct: [three]
    explanation:
      uk: "Одна непомітна строчка `const draft = expense` розмножила координати в три місця, і кожне живе за своїми правилами: чернетку стирає застосунок, журнал — система, а записи сервера — хтось інший."
      en: "One inconspicuous line, `const draft = expense`, multiplied the coordinates into three places, and each lives by its own rules: the app clears the draft, the system clears the log, and someone else clears the server's records."

  - id: copy-counter
    kind: example
    runtime: concept-preview
    dir: copy-counter
    entry: main.jsx
    strings:
      label: { uk: "Обід", en: "Lunch" }
      amount: { uk: "125,00 грн", en: "UAH 125.00" }
      save: { uk: "Зберегти", en: "Save" }
      locationCopies: { uk: "Копій координат", en: "Copies of the coordinates" }
      expenseCopies: { uk: "Копій витрати", en: "Copies of the expense" }
    title:
      uk: "Лічильник копій"
      en: "A copy counter"
    body:
      uk: |
        `captured.js` — що тримає форма: витрата й фото чека з EXIF. `deviceSim.js` грає роль сховища, журналу й мережі та запам’ятовує кожен текст, який отримав. `SaveExpense.jsx` — функція збереження з передбачення.

        Натисни **Запустити**, а потім **Зберегти** на **Сторінці**: екран порахує, у скількох місцях опинилися координати й сама витрата.
      en: |
        `captured.js` is what the form holds: the expense and a receipt photo with EXIF. `deviceSim.js` plays the storage, the log and the network, and remembers every text it received. `SaveExpense.jsx` is the save function from the prediction.

        Press **Run**, then **Save** on the **Page**: the screen counts in how many places the coordinates and the expense itself ended up.
    tryIt:
      uk: |
        1. У `saveExpense` заміни `const draft = expense;` на `const draft = { ...expense, receipt: { id: expense.receipt.id } };`. Запусти й натисни **Зберегти**: копій координат — 0, а витрата лишилася в трьох місцях.
        2. Видали рядок `device.log('debug: saving', …)`. Запусти й збережи знову: копій витрати — 2. Налагоджувальний вивід цілих записів — теж копія, якої функція не потребує.
      en: |
        1. In `saveExpense` replace `const draft = expense;` with `const draft = { ...expense, receipt: { id: expense.receipt.id } };`. Run and press **Save**: 0 copies of the coordinates, while the expense is still in three places.
        2. Delete the `device.log('debug: saving', …)` line. Run and save again: 2 copies of the expense. Debug output of whole records is also a copy the feature does not need.
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не нативний застосунок. Сховище, журнал і мережа тут — масив у `deviceSim.js`, а фото й EXIF — синтетичний об’єкт: справжньої камери, файлу фото, резервних копій і журналів пристрою немає, як і нативних модулів, жестів, крім миші й клавіатури, вигляду платформи й продуктивності телефона. Перегляд показує лише, скільки копій створює код."
      en: "This is a browser preview through react-native-web, not a native app. Storage, the log and the network here are an array in `deviceSim.js`, and the photo and its EXIF are a synthetic object: there is no real camera, photo file, backup or device log, nor native modules, gestures beyond mouse and keyboard, a platform look or phone performance. The preview only shows how many copies the code creates."

  - id: flow-diagram
    kind: visual
    visual: diagram
    title:
      uk: "Потік даних однієї витрати з фото"
      en: "The data flow of one expense with a photo"
    textEquivalent:
      uk: "Людина вводить назву, суму й дату витрати, а камера додає до фото чека метадані EXIF: координати, модель телефона й точний час. Функція збереження кладе весь об’єкт у змінну draft. З неї створюються три копії: чернетка у сховищі телефона, рядок налагоджувального журналу й тіло запиту, яке на сервері стає ще й записом бекапу. У кожній із трьох копій є координати. Якщо draft містить лише потрібні поля, а від фото лишається тільки його ідентифікатор, координат немає в жодній копії. Якщо прибрати налагоджувальний рядок, зникає й копія в журналі. Для кожної копії, що лишилася, записують мету й термін зберігання."
      en: "The person types the label, amount and date of the expense, and the camera adds EXIF metadata to the receipt photo: the coordinates, the phone model and the exact time. The save function puts the whole object into the variable draft. Three copies are made from it: a draft in the phone's storage, a debug log line and a request body, which on the server also becomes a backup record. Each of the three copies holds the coordinates. If draft holds only the needed fields and only the photo's id is left of the receipt, no copy holds the coordinates. If the debug line is removed, the copy in the log disappears too. For every copy that remains, its purpose and retention period are written down."
    spec:
      layout: grid
      nodes:
        - { id: typed, label: { uk: "назва, сума, дата", en: "label, amount, date" }, col: 0, row: 0, w: 164, shape: pill }
        - { id: exif, label: { uk: "фото: EXIF, GPS", en: "photo: EXIF, GPS" }, col: 1, row: 0, w: 164, shape: pill }
        - { id: draft, label: "draft", col: 0, row: 1, w: 164 }
        - { id: cache, label: { uk: "сховище: чернетка", en: "storage: draft" }, col: 0, row: 2, w: 164, shape: cylinder }
        - { id: log, label: { uk: "журнал пристрою", en: "device log" }, col: 1, row: 2, w: 164, shape: note }
        - { id: request, label: { uk: "тіло запиту", en: "request body" }, col: 0, row: 3, w: 164 }
        - { id: server, label: { uk: "сервер: бекап", en: "server: backup" }, col: 1, row: 3, w: 164, shape: cylinder }
      edges:
        - { from: typed, to: draft }
        - { from: exif, to: draft }
        - { from: draft, to: cache }
        - { from: draft, to: log }
        - { from: draft, to: request }
        - { from: request, to: server }
      steps:
        - caption:
            uk: "Назву, суму й дату ввела людина. EXIF додала камера: координати, модель телефона, точний час."
            en: "The person typed the label, the amount and the date. The camera added EXIF: the coordinates, the phone model, the exact time."
          highlight: [typed, exif]
          dim: [cache, log, request, server]
        - caption:
            uk: "`const draft = expense` — у `draft` потрапляє все, EXIF теж."
            en: "`const draft = expense` — everything goes into `draft`, EXIF included."
          highlight: [draft, typed->draft, exif->draft]
          dim: [cache, log, request, server]
        - caption:
            uk: "Одне «Зберегти» — три копії з координатами: чернетка, рядок журналу, тіло запиту. На сервері запит стає ще й записом бекапу."
            en: "One Save — three copies with the coordinates: the draft, the log line, the request body. On the server the request also becomes a backup record."
          highlight: [cache, log, request, server, draft->cache, draft->log, draft->request, request->server]
          annotate:
            - { id: cache, text: "GPS" }
            - { id: log, text: "GPS" }
            - { id: request, text: "GPS" }
        - caption:
            uk: "`draft` бере лише потрібні поля, а від фото — тільки `id`. EXIF викреслено до першої копії, тож координат немає ніде."
            en: "`draft` takes only the needed fields, and only the `id` of the photo. EXIF is struck out before the first copy, so the coordinates are nowhere."
          highlight: [draft, cache, request, server]
          dim: [exif, exif->draft]
        - caption:
            uk: "Налагоджувальний рядок прибрано — копії в журналі немає. Для кожної копії, що лишилася, записують мету й термін зберігання."
            en: "The debug line is removed — there is no copy in the log. For every copy that remains, its purpose and retention period are written down."
          highlight: [cache, request, server]
          dim: [exif, log, exif->draft, draft->log]

  - id: recall-authority
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: which-copy-is-the-truth
        from: rn-05-04-offline-cache-authority
        prompt:
          uk: "У нативному проєкті поки немає сервера: записи живуть лише у сховищі телефона. Яка копія — джерело істини, і що станеться, якщо її втратити?"
          en: "The native project has no server yet: the records live only in the phone's storage. Which copy is authoritative, and what happens if it is lost?"
        answer:
          type: choice
          options:
            - id: device-is-truth
              text:
                uk: "Сховище пристрою — джерело істини; якщо його втратити, записів більше ніде немає"
                en: "The device store is the authoritative copy; if it is lost, the records exist nowhere else"
            - id: just-cache
              text:
                uk: "Це лише кеш: дані підтягнуться знову"
                en: "It is only a cache: the data will be fetched again"
              why:
                uk: "Кеш — копія чогось, що лежить деінде. Поки сервера немає, підтягнути нема звідки: сховище пристрою — і є оригінал."
                en: "A cache is a copy of something kept elsewhere. While there is no server, there is nowhere to fetch from: the device store is the original."
            - id: memory
              text:
                uk: "Стан React у пам’яті — джерело істини, сховище лише його дублює"
                en: "React state in memory is authoritative; storage merely duplicates it"
              why:
                uk: "Стан у пам’яті зникає разом із процесом. Після перезапуску застосунок відновлюється зі сховища — отже, саме воно джерело істини."
                en: "State in memory disappears with the process. After a restart the app is restored from storage — so storage is the authority."
          correct: [device-is-truth]
        explanation:
          uk: "Схема потоку даних додає до цього питання ще одне: окрім джерела істини й кешу, де ще лежать **непотрібні** копії — у журналі, у чернетці, у запиті?"
          en: "A data-flow diagram adds one more question to this one: besides the authoritative copy and the cache, where else do **unneeded** copies lie — in the log, in a draft, in a request?"

  - id: purpose-and-retention
    kind: explanation
    title:
      uk: "Мета й термін для кожного поля"
      en: "A purpose and a period for every field"
    body:
      uk: |
        Перш ніж надсилати запис, пройди кожне поле й дай йому дві відповіді:

        - **мета** — що саме функція робить із цим полем; «може знадобитися пізніше» — не мета: кожне зайве поле сьогодні — ще одна копія, яку можна вкрасти, яку треба описати людині й колись видалити;
        - **термін зберігання** — скільки його тримають: «поки людина не видалить витрату», «до вивантаження, потім стерти», «30 днів».

        Поле без відповіді на обидва питання з payload викреслюють. Так само з даними, що їх людина не вводила: EXIF, назва пристрою, точний час збереження до секунди. Якщо функція колись справді потребуватиме поля — його додадуть тоді, з метою й терміном.
      en: |
        Before sending a record, go through every field and give it two answers:

        - **purpose** — what exactly the feature does with this field; “may be needed later” is not a purpose: every extra field today is one more copy that can be stolen, has to be explained to the person and deleted some day;
        - **retention period** — how long it is kept: “until the person deletes the expense”, “until uploaded, then erased”, “30 days”.

        A field without an answer to both questions is struck out of the payload. The same goes for data the person never typed: EXIF, the device name, the exact saving time to the second. If the feature ever really needs a field, it is added then, with a purpose and a period.

  - id: minimal-payload
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: minimal-payload
    entry: index.js
    editable: [payload.ts]
    strings:
      lunch: { uk: "Обід", en: "Lunch" }
      transit: { uk: "Проїзний", en: "Transit pass" }
    title:
      uk: "Мінімальний payload для бекапу витрати"
      en: "A minimal payload for an expense backup"
    instructions:
      uk: |
        Функція «Бекап» надсилає витрату на mock-сервіс, щоб її можна було відновити на іншому телефоні. Фото чека вивантажується окремо, уже без метаданих, а запис посилається на нього за `id`. `captured.ts` показує, що тримає форма: окрім полів витрати там є фото з EXIF, `deviceName` і `savedAt` — точний момент збереження.

        У `payload.ts`:

        1. Опиши `BackupPayload` і напиши `toBackupPayload(expense)`, що повертає **новий** об’єкт рівно з полями `id`, `label`, `amountMinor`, `date`, `category` і `receipt`. `receipt` — це `{ id }` фото, або `null`, коли фото немає. Сам `expense` не змінюється.
        2. Заповни `FIELD_NOTES`: для кожного з шести полів — `purpose` і `retention`, кожне щонайменше з 10 символів.

        `captured.ts` і `index.js` редагувати не можна.
      en: |
        The Backup feature sends an expense to the mock service so it can be restored on another phone. The receipt photo is uploaded separately, already without metadata, and the record refers to it by `id`. `captured.ts` shows what the form holds: besides the expense fields there is a photo with EXIF, `deviceName` and `savedAt` — the exact moment of saving.

        In `payload.ts`:

        1. Describe `BackupPayload` and write `toBackupPayload(expense)`, which returns a **new** object with exactly the fields `id`, `label`, `amountMinor`, `date`, `category` and `receipt`. `receipt` is the photo's `{ id }`, or `null` when there is no photo. The `expense` itself does not change.
        2. Fill in `FIELD_NOTES`: for each of the six fields a `purpose` and a `retention`, each at least 10 characters long.

        `captured.ts` and `index.js` cannot be edited.
    testTitles:
      "the payload has exactly the fields the backup needs":
        uk: "Payload має рівно ті поля, що потрібні бекапу"
        en: "The payload has exactly the fields the backup needs"
      "the record fields are copied unchanged":
        uk: "Поля запису скопійовано без змін"
        en: "The record fields are copied unchanged"
      "the receipt becomes a bare reference, or null without a receipt":
        uk: "Від фото лишається лише посилання `{ id }`, а без фото — `null`"
        en: "The receipt becomes a bare `{ id }` reference, or `null` without a receipt"
      "no location, camera, device or time of day anywhere in the payload":
        uk: "У payload немає ні координат, ні камери, ні пристрою, ні часу доби"
        en: "No location, camera, device or time of day anywhere in the payload"
      "the captured expense itself is not changed":
        uk: "Сама витрата з форми не змінюється"
        en: "The captured expense itself is not changed"
      "every payload field has a purpose and a retention":
        uk: "Кожне поле payload має мету й термін зберігання"
        en: "Every payload field has a purpose and a retention"
    hints:
      nudge:
        uk: "Що станеться з будь-яким полем, яке додадуть у форму наступного місяця, якщо payload будується з `...expense`? Яке з двох рішень — «перелічити, що беру» чи «перелічити, що відкидаю» — само захистить від такого поля?"
        en: "What happens to any field added to the form next month if the payload is built from `...expense`? Which of the two choices — “list what I take” or “list what I drop” — protects against such a field by itself?"
      explanation:
        uk: "Новий об’єкт, у якому кожне поле назване явно, нічого зайвого не захопить: наприклад, для звички `{ id: habit.id, name: habit.name }` бере рівно два поля. Вкладений об’єкт теж будуй заново, а не копіюй цілим: інакше разом із потрібним `id` поїдуть і його сусіди. Для поля, яке може бути `null`, спершу перевір `null`, і лише потім читай його властивості. `delete` на вхідному об’єкті не годиться: це той самий об’єкт, який показує форма."
        en: "A new object with every field named explicitly picks up nothing extra: for a habit, say, `{ id: habit.id, name: habit.name }` takes exactly two fields. Build a nested object anew too instead of copying it whole: otherwise its neighbours travel along with the `id` you need. For a field that can be `null`, check for `null` first, and only then read its properties. `delete` on the input object will not do: it is the same object the form shows."
    solutionNote:
      uk: "Payload перелічує свої поля явно, тож нове поле форми не потрапить у бекап саме собою. Від фото лишився `id`: координати, камера й шлях до файлу на телефоні серверу ні до чого. `savedAt` теж відкинуто — для підсумків досить календарної `date`. А `FIELD_NOTES` — це схема потоку даних у коді: кожне поле, що покидає телефон, має мету й термін, і рецензент бачить їх поруч із payload."
      en: "The payload lists its fields explicitly, so a new form field will not slip into the backup by itself. Only the `id` is left of the photo: the server has no use for the coordinates, the camera or the file path on the phone. `savedAt` is dropped too — the calendar `date` is enough for the totals. And `FIELD_NOTES` is the data-flow diagram in code: every field that leaves the phone has a purpose and a period, and a reviewer sees them right next to the payload."
    feedback:
      - when: { test: "the payload has exactly the fields the backup needs" }
        message:
          uk: "Ця перевірка очікує в payload рівно поля `amountMinor`, `category`, `date`, `id`, `label` і `receipt` — і з фото, і без нього. `deviceName`, `savedAt` та інші поля форми туди не входять."
          en: "This check expects exactly the fields `amountMinor`, `category`, `date`, `id`, `label` and `receipt` in the payload — with a photo and without. `deviceName`, `savedAt` and the other form fields are not part of it."
      - when: { test: "the record fields are copied unchanged" }
        message:
          uk: "Ця перевірка очікує, що `id`, `label`, `amountMinor`, `date` і `category` у payload дорівнюють тим самим полям витрати."
          en: "This check expects `id`, `label`, `amountMinor`, `date` and `category` in the payload to equal the same fields of the expense."
      - when: { test: "the receipt becomes a bare reference, or null without a receipt" }
        message:
          uk: "Ця перевірка очікує `receipt` рівно `{ id: \"r-08\" }` для витрати з фото і `null` для витрати без фото — без `uri`, без `exif`."
          en: "This check expects `receipt` to be exactly `{ id: \"r-08\" }` for the expense with a photo and `null` for the one without — no `uri`, no `exif`."
      - when: { test: "no location, camera, device or time of day anywhere in the payload" }
        message:
          uk: "Ця перевірка перетворює payload на JSON і шукає в ньому координати, модель телефона, час доби й шлях `file:///`. Жодного з них там бути не повинно, навіть усередині вкладених об’єктів."
          en: "This check turns the payload into JSON and searches it for the coordinates, the phone model, the time of day and the `file:///` path. None of them may be there, not even inside nested objects."
      - when: { test: "the captured expense itself is not changed" }
        message:
          uk: "Ця перевірка викликає `toBackupPayload` і очікує, що витрата, яку передали, лишилася такою самою: payload — новий об’єкт, а не та сама витрата після `delete`."
          en: "This check calls `toBackupPayload` and expects the expense that was passed in to stay the same: the payload is a new object, not the same expense after `delete`."
      - when: { test: "every payload field has a purpose and a retention" }
        message:
          uk: "Ця перевірка очікує в `FIELD_NOTES` рівно шість ключів — ті самі, що в payload, — і в кожному `purpose` та `retention` щонайменше з 10 символів."
          en: "This check expects exactly six keys in `FIELD_NOTES` — the same as in the payload — each with a `purpose` and a `retention` of at least 10 characters."
      - when: { error: TypeError }
        message:
          uk: "Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі. Часта причина — читання `expense.receipt.id`, коли `receipt` дорівнює `null`."
          en: "If every check fails at once, fix the first console error first. A common cause is reading `expense.receipt.id` when `receipt` is `null`."

  - id: to-checkpoint
    kind: transfer
    checkpoint: CP-RN
    body:
      uk: "У цьому розділі проєкт не змінюється: кроку проєкту в RN-09 немає. Записи твого проєкту вже мінімальні: доменні функції на кшталт `summarizeExpenses` чи `countDueTasks` працюють лише з полями запису. Коли дійдеш до контрольної точки CP-RN (розділ RN-08), перевір, що й нативний застосунок не додає до них нічого свого — ні назви пристрою, ні часу до секунди, ні журналу з цілими записами — і що сховище тримає записи, доки людина їх не видалить."
      en: "Your project does not change in this unit: RN-09 has no project step. Your project's records are already minimal: domain functions such as `summarizeExpenses` or `countDueTasks` work only with the record's fields. When you reach the CP-RN checkpoint (unit RN-08), check that the native app adds nothing of its own to them either — no device name, no time to the second, no log of whole records — and that storage keeps the records until the person deletes them."
