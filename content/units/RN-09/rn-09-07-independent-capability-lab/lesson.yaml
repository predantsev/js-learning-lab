id: rn-09-07-independent-capability-lab
unit: RN-09
title:
  uk: "Самостійно: синтетична лабораторія можливостей"
  en: "Independent: synthetic capability lab"
kind: assessment
minutes: 35
contentVersion: 1
purpose:
  uk: "Перевірка всього розділу на новій лабораторії — нотатках із фото. Спершу тут, на платформі, ти без підказок пишеш сеанс поверх захищеного сховища з чесною обробкою збою читання, мінімальний payload, обробник посилань і прибираєш секрет із конфігурації — це перевіряють автоматично. Потім збираєш ту саму лабораторію на своїй цілі зі справжнім `expo-secure-store`, шукаєш секрет у зібраному bundle і пишеш абзац про те, хто що гарантує. Цю частину підтверджуєш ти сам."
  en: "A check of the whole unit on a new lab — notes with photos. First, here on the platform, you write without hints a session on top of secure storage with an honest read-failure path, a minimal payload and a link handler, and remove the secret from the configuration — this is checked automatically. Then you build the same lab on your target with the real `expo-secure-store`, search the built bundle for the secret and write a paragraph on who guarantees what. You confirm that part yourself."
objectives:
  - uk: "Без підказок і на своїй цілі побудувати синтетичну лабораторію можливостей, що тримає фальшивий токен у захищеному сховищі, не вшиває секретів, надсилає лише мінімум полів і приймає лише перевірені вхідні посилання."
    en: "Build, without hints and on the declared target, a synthetic capability lab that keeps a fake token in secure storage, embeds no secret, sends only the minimum fields and accepts only validated incoming links."
  - uk: "Пояснити одним абзацом, які гарантії дає платформа, які — бібліотека, а які — відповідальність твого коду."
    en: "Explain in one paragraph which guarantees come from the platform, which from the library and which are your own code's responsibility."
prerequisites: [rn-09-06-debug-denied-permission]
subskills:
  - { family: N-07, skill: "secure credential storage vs ordinary storage", depth: assess }
  - { family: N-07, skill: "no embedded secrets", depth: assess }
  - { family: N-07, skill: "privacy/minimum data", depth: assess }
  - { family: N-07, skill: "safe auth/deep-link boundaries", depth: assess }
glossary: []
selfCheck: [notes-lab]

blocks:
  - id: the-lab
    kind: explanation
    title:
      uk: "Нотатки з фото"
      en: "Notes with photos"
    body:
      uk: |
        Нова синтетична лабораторія: людина входить, пише нотатку, додає фото й вивантажує нотатку на mock-сервіс. Нотатку можна відкрити посиланням `jsll-notes://notes/n-004` чи перевіреним `https://notes.jsll.example/notes/n-004`; `id` нотатки — `n-` і три цифри.

        Чотири межі, кожна з одного з уроків розділу:

        - **токен** живе лише в `SecretStore` (контракт з уроку 1, тут — подвійник `secretDouble.ts`, що вміє ламатися);
        - **конфігурація**, що потрапляє в пакет, не містить секретів;
        - **payload** вивантаження містить лише те, що потрібно;
        - **посилання** обирає нотатку й нічого більше.
      en: |
        A new synthetic lab: a person signs in, writes a note, adds a photo and uploads the note to the mock service. A note can be opened by the link `jsll-notes://notes/n-004` or the verified `https://notes.jsll.example/notes/n-004`; a note's `id` is `n-` and three digits.

        Four boundaries, each from one of the unit's lessons:

        - the **token** lives only in a `SecretStore` (the contract from lesson 1; here the double `secretDouble.ts`, which can break on purpose);
        - the **configuration** that goes into the package holds no secrets;
        - the upload **payload** holds only what is needed;
        - a **link** picks a note and nothing more.

  - id: recall-encoding
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: decode-path-segment
        from: js-16-01-url-query-encoding
        prompt:
          uk: "Шлях адреси містить сегмент `%D0%BA%D0%B2%D1%96%D1%82%D0%B8`. Що поверне `decodeURIComponent` для нього — і що станеться з сегментом `%E0%A4%A`?"
          en: "An address path holds the segment `%D0%BA%D0%B2%D1%96%D1%82%D0%B8`. What does `decodeURIComponent` return for it — and what happens with the segment `%E0%A4%A`?"
        code: |
          console.log(decodeURIComponent("%D0%BA%D0%B2%D1%96%D1%82%D0%B8"));
          try {
            decodeURIComponent("%E0%A4%A");
          } catch (error) {
            console.log(error.name);
          }
        verify: { logs: ["квіти", "URIError"] }
        answer:
          type: choice
          options:
            - id: word-then-error
              text:
                uk: "Слово «квіти», а для зламаної послідовності — `URIError`"
                en: "The word «квіти», and a `URIError` for the broken sequence"
            - id: unchanged
              text:
                uk: "Обидва сегменти повертаються без змін"
                en: "Both segments come back unchanged"
              why:
                uk: "`decodeURIComponent` перетворює кожну правильну послідовність `%XX` на символи UTF-8 — тому з першого сегмента виходить слово."
                en: "`decodeURIComponent` turns every valid `%XX` sequence into UTF-8 characters — that is why the first segment becomes a word."
            - id: silent
              text:
                uk: "Слово «квіти», а зламана послідовність тихо стає порожнім рядком"
                en: "The word «квіти», and the broken sequence silently becomes an empty string"
              why:
                uk: "Тихо нічого не стається: на зламаній послідовності функція кидає `URIError`. Тому декодування недовіреного сегмента загортають у `try`."
                en: "Nothing happens silently: on a broken sequence the function throws a `URIError`. That is why decoding an untrusted segment is wrapped in `try`."
          correct: [word-then-error]
        explanation:
          uk: "Вхідне посилання — недовірене введення: його сегменти треба декодувати під `try` і лише потім перевіряти. В обробнику посилань зламаний `id` — це відмова, а не падіння."
          en: "An incoming link is untrusted input: its segments must be decoded under `try` and only then checked. In a link handler a broken `id` is a refusal, not a crash."

  - id: notes-lab
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: notes-lab
    entry: index.js
    editable: [lab.ts, config.ts]
    strings:
      noteText: { uk: "Перша пробіжка після зими", en: "First run after the winter" }
      draftText: { uk: "Перша проб", en: "First ru" }
    title:
      uk: "Лабораторія нотаток: токен, конфігурація, payload, посилання"
      en: "The notes lab: token, configuration, payload, links"
    instructions:
      uk: |
        Реалізуй три експорти в `lab.ts` і виправ `config.ts`. `secretDouble.ts` і `index.js` редагувати не можна. Підказок немає.

        **`createSession(secrets)`** — сеанс поверх `SecretStore`, токен під ключем `session.token`:

        - `signIn(token)` зберігає токен і повертає `'signed-in'`, а якщо сховище відмовило — `'storage-failed'`;
        - `authHeader()` щоразу читає токен зі сховища й повертає `` `Bearer ${token}` `` або `null`, коли токена немає чи читання не вдалося; ніколи не кидає винятків;
        - `signOut()` видаляє токен;
        - жодної копії токена поза сховищем: ні в змінній сеансу, ні в `localStorage`, ні в консолі.

        **`toUploadPayload(note)`** повертає новий об’єкт рівно `{ id, text, createdOn, photo }`: `createdOn` — день `YYYY-MM-DD` з `createdAt`, `photo` — `{ id }` фото або `null`. Саму нотатку не змінюй.

        **`parseNoteLink(url)`** повертає `{ ok: true, route: { screen: 'note', id } }` або `{ ok: false, reason }` з причинами й порядком перевірок як в уроці 4: `malformed-url`, `unknown-origin` (не схема `jsll-notes:` і не origin `https://notes.jsll.example`), `credential-param` (назва параметра в нижньому регістрі містить `token`, `password`, `secret`, `session`, `key` чи `code`), `unknown-route` (шлях не рівно `notes/<id>`), `invalid-id` (після декодування не `n-` і три цифри, або декодування неможливе).

        **`config.ts`** потрапляє в пакет застосунку: залиш у ньому адресу API й `clientId` без змін і прибери все, що є секретом.
      en: |
        Implement three exports in `lab.ts` and fix `config.ts`. `secretDouble.ts` and `index.js` cannot be edited. There are no hints.

        **`createSession(secrets)`** — a session on top of a `SecretStore`, the token under the key `session.token`:

        - `signIn(token)` saves the token and returns `'signed-in'`, or `'storage-failed'` if the store refused;
        - `authHeader()` reads the token from the store every time and returns `` `Bearer ${token}` ``, or `null` when there is no token or the read failed; it never throws;
        - `signOut()` deletes the token;
        - no copy of the token outside the store: not in a session variable, not in `localStorage`, not in the console.

        **`toUploadPayload(note)`** returns a new object of exactly `{ id, text, createdOn, photo }`: `createdOn` is the day `YYYY-MM-DD` from `createdAt`, `photo` is the photo's `{ id }` or `null`. Do not change the note itself.

        **`parseNoteLink(url)`** returns `{ ok: true, route: { screen: 'note', id } }` or `{ ok: false, reason }` with the reasons and check order of lesson 4: `malformed-url`, `unknown-origin` (neither the `jsll-notes:` scheme nor the origin `https://notes.jsll.example`), `credential-param` (a parameter name, in lowercase, contains `token`, `password`, `secret`, `session`, `key` or `code`), `unknown-route` (the path is not exactly `notes/<id>`), `invalid-id` (after decoding not `n-` and three digits, or decoding is impossible).

        **`config.ts`** goes into the app package: keep the API address and the `clientId` unchanged, and remove everything that is a secret.
    testTitles:
      "sign-in keeps the token in the secret store and builds the header from it":
        uk: "Вхід кладе токен у сховище секретів, а заголовок будується з нього"
        en: "Sign-in keeps the token in the secret store and builds the header from it"
      "the session keeps no copy of the token outside the store":
        uk: "Сеанс не тримає копії токена поза сховищем"
        en: "The session keeps no copy of the token outside the store"
      "a failed read means signed out, not a crash":
        uk: "Невдале читання означає «не ввійшов», а не падіння"
        en: "A failed read means signed out, not a crash"
      "an unavailable store makes sign-in fail honestly":
        uk: "Недоступне сховище чесно провалює вхід"
        en: "An unavailable store makes sign-in fail honestly"
      "sign-out removes the token":
        uk: "Вихід видаляє токен"
        en: "Sign-out removes the token"
      "the upload payload holds only id, text, the day and a photo reference":
        uk: "Payload вивантаження містить лише `id`, текст, день і посилання на фото"
        en: "The upload payload holds only `id`, text, the day and a photo reference"
      "note links become routes on both link forms":
        uk: "Посилання на нотатку стають маршрутом в обох формах"
        en: "Note links become routes on both link forms"
      "unsafe or broken note links are refused with their reason":
        uk: "Небезпечні чи зламані посилання відхилено з їхньою причиною"
        en: "Unsafe or broken note links are refused with their reason"
      "the shipped config holds no secret":
        uk: "Конфігурація в пакеті не містить секрету"
        en: "The shipped config holds no secret"
    solutionNote:
      uk: "Сеанс — тонка обгортка: токен має одне місце життя, тож видалення, збій чи відкликання в сховищі одразу видно в `authHeader`. Збій читання — це «не ввійшов», і екран показує вхід, а не падає. Payload перелічує свої поля, тому ні EXIF, ні назва пристрою, ні чернетки не поїдуть на сервер. Обробник посилань перевіряє origin, облікові параметри, маршрут і `id` у порядку довіри. А секрет вивантаження живе на сервері — перейменування на `..._KEY` нічого б не змінило."
      en: "The session is a thin wrapper: the token has one place to live, so a delete, a failure or a revoke in the store shows in `authHeader` at once. A failed read means “signed out”, and the screen shows sign-in instead of crashing. The payload lists its fields, so neither EXIF, nor the device name, nor the drafts travel to the server. The link handler checks the origin, credential parameters, the route and the `id` in the order of trust. And the upload secret lives on the server — renaming it to `..._KEY` would have changed nothing."
    feedback:
      - when: { test: "sign-in keeps the token in the secret store and builds the header from it" }
        message:
          uk: "Ця перевірка очікує `'signed-in'`, токен у сховищі під `session.token`, `authHeader()` рівно `Bearer tok_check_5e7d` — і той самий заголовок у другого сеансу на тому самому сховищі."
          en: "This check expects `'signed-in'`, the token in the store under `session.token`, `authHeader()` exactly `Bearer tok_check_5e7d` — and the same header from a second session on the same store."
      - when: { test: "the session keeps no copy of the token outside the store" }
        message:
          uk: "Ця перевірка видаляє токен прямо зі сховища й очікує `null` від `authHeader()` того самого сеансу, жодного ключа в `localStorage` і жодного рядка консолі з токеном."
          en: "This check deletes the token straight from the store and expects `null` from `authHeader()` of the same session, no key in `localStorage` and no console line with the token."
      - when: { test: "a failed read means signed out, not a crash" }
        message:
          uk: "Ця перевірка дає сховище, де кожне читання повертає `{ ok: false, error: \"read-failed\" }`, і очікує від `authHeader()` значення `null`, а не виняток."
          en: "This check gives a store where every read returns `{ ok: false, error: \"read-failed\" }` and expects `null` from `authHeader()`, not an exception."
      - when: { test: "an unavailable store makes sign-in fail honestly" }
        message:
          uk: "Ця перевірка дає недоступне сховище й очікує `'storage-failed'` від `signIn` і `null` від `authHeader()`."
          en: "This check gives an unavailable store and expects `'storage-failed'` from `signIn` and `null` from `authHeader()`."
      - when: { test: "sign-out removes the token" }
        message:
          uk: "Ця перевірка очікує, що після `signOut()` у сховищі під `session.token` нічого немає, а `authHeader()` повертає `null`."
          en: "This check expects nothing under `session.token` in the store after `signOut()`, and `null` from `authHeader()`."
      - when: { test: "the upload payload holds only id, text, the day and a photo reference" }
        message:
          uk: "Ця перевірка очікує рівно `{ id, text, createdOn, photo }` з `createdOn` `2026-03-03` і `photo` `{ id: \"p-012\" }` або `null`, а також незмінну нотатку після виклику."
          en: "This check expects exactly `{ id, text, createdOn, photo }` with `createdOn` `2026-03-03` and `photo` `{ id: \"p-012\" }` or `null`, and the note unchanged after the call."
      - when: { test: "note links become routes on both link forms" }
        message:
          uk: "Ця перевірка очікує маршрут `{ screen: \"note\", id }` для `jsll-notes://notes/n-012` і для `https://notes.jsll.example/notes/n-007?ref=mail`."
          en: "This check expects the route `{ screen: \"note\", id }` for `jsll-notes://notes/n-012` and for `https://notes.jsll.example/notes/n-007?ref=mail`."
      - when: { test: "unsafe or broken note links are refused with their reason" }
        message:
          uk: "Ця перевірка проганяє одинадцять посилань і для кожного очікує свою причину: облікові параметри в будь-якому регістрі, хост-двійник і чужа схема, чужий маршрут і зайва частина шляху, `id` з двох цифр і зламана послідовність, текст без схеми, а також посилання, що порушують дві умови одразу (тоді важить перша за порядком). Повідомлення про невдачу називає посилання."
          en: "This check runs eleven links and expects its own reason for each: credential parameters in any case, a look-alike host and a foreign scheme, a foreign route and an extra path part, a two-digit `id` and a broken sequence, text without a scheme, and links that break two rules at once (then the first in order counts). The failure message names the link."
      - when: { test: "the shipped config holds no secret" }
        message:
          uk: "Ця перевірка очікує, що в `config` немає значення, яке починається з `sk_`, і назви зі словом `secret`, а `EXPO_PUBLIC_NOTES_API` і `EXPO_PUBLIC_CLIENT_ID` лишилися з тими самими значеннями."
          en: "This check expects no value starting with `sk_` and no name containing `secret` in `config`, and `EXPO_PUBLIC_NOTES_API` and `EXPO_PUBLIC_CLIENT_ID` kept with the same values."

  - id: native-notes-lab
    kind: local-task
    runtime: local-native
    title:
      uk: "Лабораторія нотаток на твоїй цілі"
      en: "The notes lab on your target"
    intro:
      uk: |
        Друга частина — без підказок, на твоїй заявленій цілі. У новому проєкті Expo збери ту саму лабораторію поверх справжнього захищеного сховища. Скопіюй у проєкт свої `lab.ts` і `config.ts` з вправи вище **без змін**, а `SecretStore` (типи з `secretDouble.ts`) реалізуй сам у файлі `secureStore.ts` поверх `expo-secure-store`.

        **Що має вийти:**

        - `secureStore.ts`: `getSecret`, `setSecret`, `deleteSecret` за контрактом — результати `{ ok, … }`, жодних відхилених `Promise`: виняток бібліотеки стає `read-failed` чи `unavailable`, а `SecureStore.isAvailableAsync()` перевірено перед першим зверненням;
        - екран: кнопка входу, яка «отримує» синтетичний токен (наприклад, `tok_lab_` і випадкові символи — справжнього сервера входу тут немає), рядок «Увійшов / не ввійшов» з `authHeader()`, кнопка виходу;
        - форма нотатки з кнопкою «Вивантажити», що показує на екрані JSON з `toUploadPayload` (замість справжнього запиту);
        - «перевірка посилань»: поле, куди вставляєш посилання, і кнопка, що проганяє його через `parseNoteLink` і показує маршрут чи причину відмови. Якщо в RN-04 ти налаштував доставку посилань у застосунок, під’єднай `Linking.getInitialURL()` і `Linking.addEventListener('url', …)` до того самого обробника.

        > [!warning]
        > Цю частину описано за документацією **Expo SDK 57** (`expo-secure-store`, `npx expo export`) і **React Native 0.86**; автори курсу її не запускали, бо на машині, де писали урок, не було нативних інструментів. Прикладів виводу тут немає. Якщо нативної цілі в тебе немає, познач завдання як **невиконане**: частина на платформі вище вже перевірила логіку.

        **Свідчення й абзац.** Веди `EVIDENCE.md` у корені проєкту: перший рядок — ціль (тип, версія ОС, версія `expo`), далі — що бачив на кожному кроці. Наприкінці допиши **один абзац**: які гарантії тут дає платформа (Keychain/Keystore, перевірені посилання), які — бібліотеки (`expo-secure-store`, PKCE в `expo-auth-session`), а що лишається на твоєму коді (не друкувати токен, мінімальний payload, перевірка посилань, жодного секрету в конфігурації).
      en: |
        The second part — without hints, on your declared target. In a new Expo project build the same lab on top of real secure storage. Copy your `lab.ts` and `config.ts` from the exercise above into the project **unchanged**, and implement the `SecretStore` (the types from `secretDouble.ts`) yourself in `secureStore.ts` on top of `expo-secure-store`.

        **What it must do:**

        - `secureStore.ts`: `getSecret`, `setSecret`, `deleteSecret` per the contract — `{ ok, … }` results, no rejected `Promise`s: a library exception becomes `read-failed` or `unavailable`, and `SecureStore.isAvailableAsync()` is checked before the first access;
        - a screen: a sign-in button that “receives” a synthetic token (for example `tok_lab_` plus random characters — there is no real sign-in server here), a “Signed in / signed out” line from `authHeader()`, a sign-out button;
        - a note form with an “Upload” button that shows the JSON from `toUploadPayload` on the screen (instead of a real request);
        - a “link checker”: a field you paste a link into and a button that runs it through `parseNoteLink` and shows the route or the reason for refusal. If you set up link delivery into the app in RN-04, connect `Linking.getInitialURL()` and `Linking.addEventListener('url', …)` to the same handler.

        > [!warning]
        > This part is described from the documentation of **Expo SDK 57** (`expo-secure-store`, `npx expo export`) and **React Native 0.86**; the course authors did not run it, because the machine this lesson was written on had no native tooling. There is no sample output here. If you have no native target, mark the task **not performed**: the platform part above has already checked the logic.

        **Evidence and a paragraph.** Keep `EVIDENCE.md` in the project root: the first line is the target (type, OS version, `expo` version), then what you saw at every step. At the end add **one paragraph**: which guarantees here come from the platform (Keychain/Keystore, verified links), which from libraries (`expo-secure-store`, PKCE in `expo-auth-session`), and what remains your code's job (not printing the token, a minimal payload, checking links, no secret in the configuration).
    tools:
      - name: "Node.js"
        version: "22.13 or newer"
        note:
          uk: "Мінімум для Expo SDK 57 за таблицею версій Expo."
          en: "The minimum for Expo SDK 57 according to the Expo version table."
      - name: "Expo SDK"
        version: "57 (React Native 0.86)"
        note:
          uk: "`npx expo install` добирає версію `expo-secure-store`, сумісну з SDK проєкту."
          en: "`npx expo install` picks the `expo-secure-store` version compatible with the project's SDK."
      - name: "Declared target"
        note:
          uk: "Емулятор Android, симулятор iOS (лише macOS) чи фізичний пристрій з RN-01."
          en: "An Android emulator, an iOS simulator (macOS only) or a physical device from RN-01."
    steps:
      - text:
          uk: "Створи проєкт у теці курсу й перейди в нього."
          en: "Create the project in your course folder and change into it."
        command: "npx create-expo-app@latest rn-09-notes-lab --template blank-typescript"
        expect:
          uk: "З’явилася тека `rn-09-notes-lab`; у `package.json` залежність `expo` версії 57 або новішої."
          en: "A `rn-09-notes-lab` folder appeared; `package.json` lists `expo` at version 57 or newer."
      - text:
          uk: "Усередині теки проєкту встанови модуль захищеного сховища. Потім скопіюй у корінь проєкту `lab.ts` і `config.ts` з вправи й одразу зафіксуй їх окремим commit (якщо репозиторію немає, спершу `git init`)."
          en: "Inside the project folder install the secure-storage module. Then copy `lab.ts` and `config.ts` from the exercise into the project root and commit them on their own right away (if there is no repository, run `git init` first)."
        command: "npx expo install expo-secure-store"
        expect:
          uk: "У `package.json` з’явилася залежність `expo-secure-store`."
          en: "The `expo-secure-store` dependency appeared in `package.json`."
      - text:
          uk: "Збери `secureStore.ts` і екран за вимогами вище, запусти на цілі через `npx expo start`, увійди, а потім **повністю** закрий застосунок і відкрий знову. Запиши, що показує рядок входу."
          en: "Build `secureStore.ts` and the screen to the requirements above, run it on the target with `npx expo start`, sign in, then close the app **completely** and open it again. Record what the sign-in line shows."
        expect:
          uk: "Після перезапуску — «Увійшов»: токен прийшов із захищеного сховища, а не зі стану React."
          en: "After the restart — “Signed in”: the token came from secure storage, not from React state."
      - text:
          uk: "Перевір шлях збою читання: тимчасово зроби так, щоб `getSecret` у `secureStore.ts` повертав `{ ok: false, error: 'read-failed' }`, перезапусти й запиши, що бачиш. Потім поверни код."
          en: "Check the read-failure path: temporarily make `getSecret` in `secureStore.ts` return `{ ok: false, error: 'read-failed' }`, restart and record what you see. Then restore the code."
        expect:
          uk: "Екран показує «не ввійшов» і кнопку входу; червоного екрана помилки немає."
          en: "The screen shows “signed out” and the sign-in button; there is no red error screen."
      - text:
          uk: "Напиши нотатку, вивантаж її й запиши, які поля показав JSON."
          en: "Write a note, upload it and record which fields the JSON showed."
        expect:
          uk: "Лише `id`, `text`, `createdOn` (день без часу) і `photo` — `{ id }` або `null`."
          en: "Only `id`, `text`, `createdOn` (a day without a time) and `photo` — `{ id }` or `null`."
      - text:
          uk: "Прожени через перевірку посилань чотири посилання: `jsll-notes://notes/n-004`, `jsll-notes://notes/n-004?token=tok_x`, `https://notes.jsll.example.attacker.example/notes/n-004` і `jsll-notes://notes/n-4`. Запиши результат кожного."
          en: "Run four links through the link checker: `jsll-notes://notes/n-004`, `jsll-notes://notes/n-004?token=tok_x`, `https://notes.jsll.example.attacker.example/notes/n-004` and `jsll-notes://notes/n-4`. Record the result of each."
        expect:
          uk: "Перше — маршрут на нотатку `n-004`; решта — відмови `credential-param`, `unknown-origin` і `invalid-id`."
          en: "The first — a route to note `n-004`; the rest — the refusals `credential-param`, `unknown-origin` and `invalid-id`."
      - text:
          uk: "Збери JavaScript-bundle так, як він піде в пакет, у теку `lab-export`. На macOS і Linux потім знайди в ній рядок `sk_lab` командою `grep -r -a -l \"sk_lab\" lab-export` (у PowerShell: `Select-String -Path lab-export\\* -Pattern \"sk_lab\" -List`). Запиши, що знайшов."
          en: "Build the JavaScript bundle as it goes into the package, into a `lab-export` folder. Then on macOS and Linux search it for the string `sk_lab` with `grep -r -a -l \"sk_lab\" lab-export` (in PowerShell: `Select-String -Path lab-export\\* -Pattern \"sk_lab\" -List`). Record what you found."
        command: "npx expo export --platform android --output-dir lab-export"
        expect:
          uk: "Команда створила теку `lab-export` з bundle; пошук `sk_lab` нічого не знаходить. Не фіксуй `lab-export` у git — додай її до `.gitignore`."
          en: "The command created the `lab-export` folder with the bundle; the search for `sk_lab` finds nothing. Do not commit `lab-export` — add it to `.gitignore`."
      - text:
          uk: "Допиши в `EVIDENCE.md` абзац про гарантії платформи, бібліотек і твого коду й зафіксуй роботу."
          en: "Add the paragraph about the guarantees of the platform, the libraries and your code to `EVIDENCE.md`, and commit your work."
        command: "git add -A && git commit -m \"Build the RN-09 notes lab on the declared target\""
        expect:
          uk: "Commit створено; у ньому немає теки `lab-export`."
          en: "The commit is created; it does not include the `lab-export` folder."
    verify:
      - id: token-survives-restart
        text:
          uk: "На своїй цілі я увійшов, повністю перезапустив застосунок і досі бачив «Увійшов», а при штучному збої читання — «не ввійшов» без падіння."
          en: "On my target I signed in, fully restarted the app and still saw “Signed in”, and with a simulated read failure — “signed out” without a crash."
      - id: payload-minimal
        text:
          uk: "Вивантажений JSON містив лише `id`, `text`, `createdOn` і `photo` як `{ id }` чи `null`."
          en: "The uploaded JSON held only `id`, `text`, `createdOn` and `photo` as `{ id }` or `null`."
      - id: links-checked
        text:
          uk: "Чотири посилання дали маршрут і три різні відмови, і я записав кожен результат."
          en: "The four links gave a route and three different refusals, and I recorded each result."
      - id: no-secret-in-bundle
        text:
          uk: "Пошук `sk_lab` у зібраному bundle нічого не знайшов."
          en: "The search for `sk_lab` in the built bundle found nothing."
      - id: guarantees-paragraph
        text:
          uk: "У `EVIDENCE.md` є абзац про те, що гарантує платформа, що — бібліотеки, а що — мій код, і в ньому названо ціль."
          en: "`EVIDENCE.md` holds a paragraph on what the platform guarantees, what the libraries guarantee and what my code does, and it names the target."
    troubleshooting:
      - problem:
          uk: "У тебе немає нативної цілі або її не вдається запустити."
          en: "You have no native target, or it does not start."
        fix:
          uk: "Познач завдання як невиконане й переходь далі. Повернися сюди, коли налаштуєш ціль за RN-01."
          en: "Mark the task not performed and move on. Come back here once you have set up a target following RN-01."
      - problem:
          uk: "Пошук знаходить `sk_lab` у `lab-export`."
          en: "The search finds `sk_lab` in `lab-export`."
        fix:
          uk: "Секрет досі є в коді чи конфігурації проєкту: знайди його пошуком по теці проєкту без `node_modules`, прибери, збери bundle знову й повтори пошук."
          en: "The secret is still somewhere in the project's code or configuration: find it by searching the project folder without `node_modules`, remove it, build the bundle again and repeat the search."
    recovery:
      uk: "Роби commit після кожної працездатної частини (сховище, вхід, payload, посилання). Якщо щось зламалося, `git diff` покаже зміни відтоді, а `git restore <файл>` поверне останній працездатний стан файла. Тека `lab-export` повністю відтворюється командою з кроку 7, тож її можна видалити будь-коли."
      en: "Commit after every working part (the store, sign-in, the payload, the links). If something breaks, `git diff` shows the changes since, and `git restore <file>` brings back the file's last working state. The `lab-export` folder is fully recreated by the step 7 command, so it can be deleted at any time."
