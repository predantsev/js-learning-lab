          uk: "Ця перевірка вставляє аудиторію з місткістю 0 і аудиторію з наявною назвою й очікує, що обидві вставки впадуть, а нова правильна аудиторія пройде. Якщо всі перевірки не проходять разом, прочитай першу помилку в консолі після **Запустити**."
          en: "This check inserts a room with capacity 0 and a room with an existing name and expects both inserts to fail, while a valid new room goes through. If every check fails at once, read the first error in the console after **Run**."
      - when: { test: "a session must be in an existing room" }
        message:
          uk: "Ця перевірка вставляє заняття в аудиторію 99 й очікує відмову."
          en: "This check inserts a session in room 99 and expects a refusal."
      - when: { test: "an attendee books a session only once, but may book several sessions" }
        message:
          uk: "Ця перевірка очікує відмову для повторного запису на заняття 1 і для запису на заняття 99, а запис тієї самої людини на заняття 3 — прийнятим."
          en: "This check expects a refusal for a repeated booking of session 1 and for a booking of session 99, and accepts the same person booking session 3."
      - when: { test: "sessionsWithRoom lists the sessions of a day with their room" }
        message:
          uk: "Ця перевірка очікує для `2026-04-10` два заняття як `{ title, room }` за `id`."
          en: "This check expects two sessions for `2026-04-10` as `{ title, room }` by `id`."
      - when: { test: "sessionsWithRoom treats the day only as data" }
        message:
          uk: "Ця перевірка передає день `x' OR 1=1 --` й очікує порожній список."
          en: "This check passes the day `x' OR 1=1 --` and expects an empty list."
      - when: { test: "bookingsPerSession counts every session, zero included, most booked first" }
        message:
          uk: "Ця перевірка очікує три заняття з кількістю 2, 1 і 0 у такому порядку, як `{ title, booked }`."
          en: "This check expects three sessions with the counts 2, 1 and 0 in that order, as `{ title, booked }`."
      - when: { test: "fullSessions lists the sessions whose bookings reach the room capacity" }
        message:
          uk: "Ця перевірка очікує заняття, де записів рівно стільки, скільки місць, а після двох нових записів — ще одне."
          en: "This check expects the session whose bookings equal the number of places, and one more after two new bookings."
      - when: { test: "the lookup of an attendee’s bookings searches an index" }
        message:
          uk: "Ця перевірка виконує `indexSql` і очікує в плані `attendeeQuery` рядок `SEARCH bookings USING … INDEX`."
          en: "This check runs `indexSql` and expects a line `SEARCH bookings USING … INDEX` in the plan of `attendeeQuery`."
      - when: { test: "migrate brings a version 1 database with data to version 2 without losing rows" }
        message:
          uk: "Ця перевірка створює базу міграцією 1, заповнює її, ставить `user_version` 1 і очікує від `migrate` `[2]`, версію 2, ту саму кількість рядків і `level` `intro` у старих заняттях."
          en: "This check creates a database with migration 1, fills it, sets `user_version` 1 and expects `[2]` from `migrate`, version 2, the same row counts and `level` `intro` on the old sessions."
      - when: { test: "migrate on an empty database applies 1 and 2, and a rerun applies nothing" }
