  - id: recall
    kind: review
    title:
      uk: "Пригадай: модель домену як тип"
      en: "Recall: a domain model as a type"
    items:
      - id: optional-field
        from: js-14-02-modeling-domain-types
        prompt:
          uk: "Справу в TypeScript описано як `interface Task { readonly id: string; title: string; dueDate?: string }`. Який стовпець таблиці найточніше передає `dueDate?`?"
          en: "A task is described in TypeScript as `interface Task { readonly id: string; title: string; dueDate?: string }`. Which table column matches `dueDate?` most closely?"
        answer:
          type: choice
          options:
            - id: nullable
              code: "dueDate TEXT"
            - id: not-null
              code: "dueDate TEXT NOT NULL"
              why:
                uk: "`?` означає «поля може не бути». `NOT NULL` вимагав би дату в кожної справи — це вже обов’язкове поле."
                en: "`?` means “the field may be missing”. `NOT NULL` would require a date on every task — that is a required field."
            - id: empty-default
              code: "dueDate TEXT NOT NULL DEFAULT ''"
              why:
                uk: "Порожній текст — це значення, а не його відсутність: запит `dueDate IS NULL` такої справи не знайде, а порівняння дат почне враховувати `''`."
                en: "Empty text is a value, not its absence: a query `dueDate IS NULL` will not find such a task, and date comparisons start to include `''`."
          correct: [nullable]
        explanation:
          uk: "Необов’язкове поле типу — стовпець, що допускає `NULL`. Обов’язкове — `NOT NULL`; `readonly id` відповідає первинному ключу, якого не змінюють. Тип описує форму в коді, а схема з обмеженнями — ту саму форму в базі."
          en: "An optional field of a type is a column that allows `NULL`. A required one is `NOT NULL`; `readonly id` matches a primary key that is never changed. The type describes the shape in code, and the schema with constraints describes the same shape in the database."

  - id: upgrade-locally
    kind: local-task
    runtime: local-node
    title:
      uk: "Справжній файл бази: оновлення зі старої версії"
      en: "A real database file: an upgrade from the old version"
    intro:
      uk: |
        Тут потрібні лише Node.js і термінал, жодних npm-пакетів: `node:sqlite` вбудовано в Node 22.13 і новіші. Почни, коли всі перевірки вправи «База записів на заняття» зелені.

        Під час підготовки уроку ці кроки виконано на macOS з Node.js v25.2.1; вивід нижче справжній (уривки позначено `…`). Node 22 і Windows ми не перевіряли. Node друкує для `node:sqlite` рядок `ExperimentalWarning: SQLite is an experimental feature and might change at any time` — на v25.2.1 ми його бачили; документація Node 22 теж позначає модуль експериментальним, тож чекай його й там. Це попередження, не помилка.

        **Скрипт `upgrade-check.mjs`** (створи його в кроці 3):

        ```js
        // Upgrade check for workshop.js on a real database file: workshop.db next to this script.
        // The first run creates the file as an older app version would (migration 1 only, with data),
        // then runs your migrate; later runs only run migrate on the file that already exists.
        import { existsSync } from 'node:fs';
        import { DatabaseSync } from 'node:sqlite';
        import { fixtures } from './data.js';
        import { migrations, migrate } from './workshop.js';

        const created = !existsSync('workshop.db');
        const db = new DatabaseSync('workshop.db');
        if (created) {
          db.exec(migrations.find((m) => m.version === 1).up);
          db.exec('PRAGMA user_version = 1');
          const rows = { rooms: ['id', 'name', 'capacity'], sessions: ['id', 'title', 'roomId', 'day'], bookings: ['sessionId', 'attendee'] };
          for (const [table, columns] of Object.entries(rows)) {
            const insert = db.prepare(`INSERT INTO ${table} (${columns.join(', ')}) VALUES (${columns.map(() => '?').join(', ')})`);
            for (const row of fixtures[table]) insert.run(...columns.map((c) => row[c]));
          }
        }
        const state = () => {
          const n = (table) => db.prepare(`SELECT COUNT(*) AS n FROM ${table}`).get().n;
          return `version ${db.prepare('PRAGMA user_version').get().user_version}, rooms ${n('rooms')}, sessions ${n('sessions')}, bookings ${n('bookings')}`;
        };
        console.log(created ? `created workshop.db at ${state()}` : `opened workshop.db at ${state()}`);
        console.log('migrate applied:', JSON.stringify(migrate(db)));
        console.log(`now: ${state()}`);
        console.log('levels:', db.prepare('SELECT level FROM sessions ORDER BY id').all().map((s) => s.level).join(', '));
        db.close();
        ```

        **Крок 5 — перший запуск:**

        ```text
        created workshop.db at version 1, rooms 2, sessions 3, bookings 3
        migrate applied: [2]
        now: version 2, rooms 2, sessions 3, bookings 3
        levels: intro, intro, intro
        ```

        **Крок 8 — міграція 2 без `DEFAULT` на новій базі версії 1 (уривок):**

        ```text
        created workshop.db at version 1, rooms 2, sessions 3, bookings 3
        …
        Error: Cannot add a NOT NULL column with default value NULL
        ```

        **Крок 9 — той самий файл після невдачі (уривок):**

        ```text
        opened workshop.db at version 1, rooms 2, sessions 3, bookings 3
        …
        ```
      en: |
        You need only Node.js and a terminal here, no npm packages: `node:sqlite` is built into Node 22.13 and newer. Start when every check of the exercise “A session booking database” is green.

        While preparing this lesson these steps were run on macOS with Node.js v25.2.1; the output below is real (excerpts are marked with `…`). We did not check Node 22 or Windows. Node prints the line `ExperimentalWarning: SQLite is an experimental feature and might change at any time` for `node:sqlite` — we saw it on v25.2.1; the Node 22 documentation marks the module experimental too, so expect it there as well. It is a warning, not an error.

        **The script `upgrade-check.mjs`** (create it in step 3):

        ```js
        // Upgrade check for workshop.js on a real database file: workshop.db next to this script.
        // The first run creates the file as an older app version would (migration 1 only, with data),
        // then runs your migrate; later runs only run migrate on the file that already exists.
        import { existsSync } from 'node:fs';
        import { DatabaseSync } from 'node:sqlite';
        import { fixtures } from './data.js';
        import { migrations, migrate } from './workshop.js';

        const created = !existsSync('workshop.db');
        const db = new DatabaseSync('workshop.db');
        if (created) {
          db.exec(migrations.find((m) => m.version === 1).up);
          db.exec('PRAGMA user_version = 1');
          const rows = { rooms: ['id', 'name', 'capacity'], sessions: ['id', 'title', 'roomId', 'day'], bookings: ['sessionId', 'attendee'] };
          for (const [table, columns] of Object.entries(rows)) {
            const insert = db.prepare(`INSERT INTO ${table} (${columns.join(', ')}) VALUES (${columns.map(() => '?').join(', ')})`);
            for (const row of fixtures[table]) insert.run(...columns.map((c) => row[c]));
          }
        }
        const state = () => {
          const n = (table) => db.prepare(`SELECT COUNT(*) AS n FROM ${table}`).get().n;
          return `version ${db.prepare('PRAGMA user_version').get().user_version}, rooms ${n('rooms')}, sessions ${n('sessions')}, bookings ${n('bookings')}`;
        };
        console.log(created ? `created workshop.db at ${state()}` : `opened workshop.db at ${state()}`);
        console.log('migrate applied:', JSON.stringify(migrate(db)));
        console.log(`now: ${state()}`);
        console.log('levels:', db.prepare('SELECT level FROM sessions ORDER BY id').all().map((s) => s.level).join(', '));
        db.close();
        ```

        **Step 5 — the first run:**

        ```text
        created workshop.db at version 1, rooms 2, sessions 3, bookings 3
        migrate applied: [2]
        now: version 2, rooms 2, sessions 3, bookings 3
        levels: intro, intro, intro
        ```

        **Step 8 — migration 2 without `DEFAULT` on a new version 1 database (excerpt):**

        ```text
        created workshop.db at version 1, rooms 2, sessions 3, bookings 3
        …
        Error: Cannot add a NOT NULL column with default value NULL
        ```

        **Step 9 — the same file after the failure (excerpt):**

        ```text
        opened workshop.db at version 1, rooms 2, sessions 3, bookings 3
        …
        ```
    tools:
      - { name: "Node.js", version: { uk: "22.13 або новіший", en: "22.13 or newer" }, note: { uk: "перевірено з v25.2.1", en: "checked with v25.2.1" } }
    steps:
      - text:
          uk: "Створи теку для перевірки й перейди в неї."
          en: "Create a folder for the check and go into it."
        command: "mkdir -p ~/js-course/no09-workshop\ncd ~/js-course/no09-workshop"
      - text:
          uk: "Перевір версію Node: потрібна 22.13 або новіша, бо раніше `node:sqlite` був доступний лише з прапорцем."
          en: "Check the Node version: 22.13 or newer is needed, because before that `node:sqlite` was available only behind a flag."
        command: "node --version"
        expect:
          uk: "`v22.13.0` чи новіша (у нас — `v25.2.1`)."
          en: "`v22.13.0` or newer (ours was `v25.2.1`)."
      - text:
          uk: "Створи в цій теці у VS Code чотири файли: `package.json` з одним рядком `{ \"type\": \"module\" }` (щоб Node читав файли `.js` як модулі ES); `data.js` — вміст однойменного файла вправи; `workshop.js` — твій розв’язок, з яким усі перевірки зелені; `upgrade-check.mjs` — скрипт зі вступу."
          en: "In VS Code, create four files in this folder: `package.json` with the single line `{ \"type\": \"module\" }` (so that Node reads `.js` files as ES modules); `data.js` with the content of the exercise file of that name; `workshop.js` with your solution that has every check green; `upgrade-check.mjs` with the script from the introduction."
        expect:
          uk: "У теці чотири файли: `package.json`, `data.js`, `workshop.js`, `upgrade-check.mjs`."
          en: "The folder holds four files: `package.json`, `data.js`, `workshop.js`, `upgrade-check.mjs`."
      - text:
          uk: "Збережи запасну копію свого розв’язку — вона знадобиться в кроці 10."
          en: "Keep a backup of your solution — you need it in step 10."
        command: "cp workshop.js workshop.ok.js"
      - text:
          uk: "Запусти перевірку. Скрипт створить `workshop.db` як стара версія застосунку (лише міграція 1, з даними) і викличе твій `migrate`."
          en: "Run the check. The script creates `workshop.db` as the old app version would (migration 1 only, with data) and calls your `migrate`."
        command: "node upgrade-check.mjs"
        expect:
          uk: "`migrate applied: [2]`, версія 2, кількість рядків та сама, що й до міграції, `levels: intro, intro, intro` — як у кроці 5 вступу."
          en: "`migrate applied: [2]`, version 2, the same row counts as before the migration, `levels: intro, intro, intro` — as in step 5 of the introduction."
      - text:
          uk: "Запусти ще раз: тепер скрипт відкриває наявний файл."
          en: "Run it again: now the script opens the existing file."
        command: "node upgrade-check.mjs"
        expect:
          uk: "`opened workshop.db at version 2, …` і `migrate applied: []` — повторний запуск нічого не застосовує."
          en: "`opened workshop.db at version 2, …` and `migrate applied: []` — the rerun applies nothing."
      - text:
          uk: "Тепер зламай міграцію навмисно: у `workshop.js` прибери з міграції 2 частину `DEFAULT 'intro'` і збережи файл. Якщо твоя міграція 2 додає стовпець інакше й такої частини не має, допиши в кінець її SQL `; SELECT * FROM missing_table` — тоді в наступних кроках буде помилка `no such table: missing_table`. Видали базу, щоб скрипт створив нову стару базу."
          en: "Now break the migration on purpose: in `workshop.js` remove the `DEFAULT 'intro'` part from migration 2 and save the file. If your migration 2 adds the column another way and has no such part, append `; SELECT * FROM missing_table` to its SQL instead — the next steps then show the error `no such table: missing_table`. Delete the database so that the script creates a new old one."
        command: "rm workshop.db"
      - text:
          uk: "Запусти перевірку з поламаною міграцією."
          en: "Run the check with the broken migration."
        command: "node upgrade-check.mjs"
        expect:
          uk: "Рядок `created workshop.db at version 1, …`, а потім помилка `Cannot add a NOT NULL column with default value NULL` — як у кроці 8 вступу."
          en: "The line `created workshop.db at version 1, …`, then the error `Cannot add a NOT NULL column with default value NULL` — as in step 8 of the introduction."
      - text:
          uk: "Запусти ще раз і подивись на перший рядок: невдала міграція відкотилася."
          en: "Run once more and look at the first line: the failed migration rolled back."
        command: "node upgrade-check.mjs"
        expect:
          uk: "`opened workshop.db at version 1, rooms 2, sessions 3, bookings 3` — версія й дані ті самі, що до невдалої спроби; далі та сама помилка."
          en: "`opened workshop.db at version 1, rooms 2, sessions 3, bookings 3` — the version and the data are the same as before the failed attempt; then the same error."
      - text:
          uk: "Поверни свій розв’язок і запусти на тому самому файлі версії 1."
          en: "Restore your solution and run it on the same version 1 file."
        command: "cp workshop.ok.js workshop.js\nnode upgrade-check.mjs"
        expect:
          uk: "`opened workshop.db at version 1, …`, `migrate applied: [2]` і `now: version 2, rooms 2, sessions 3, bookings 3`."
          en: "`opened workshop.db at version 1, …`, `migrate applied: [2]` and `now: version 2, rooms 2, sessions 3, bookings 3`."
    verify:
      - id: upgraded
        text:
          uk: "Мій `migrate` оновив справжній файл версії 1 до версії 2 без втрати рядків, а повторний запуск нічого не застосував."
          en: "My `migrate` upgraded a real version 1 file to version 2 without losing rows, and a rerun applied nothing."
      - id: rolled-back
        text:
          uk: "Із поламаною міграцією файл лишився на версії 1 з усіма рядками, а виправлена міграція потім застосувалася до нього."
          en: "With the broken migration the file stayed at version 1 with all its rows, and the repaired migration then applied to it."
    troubleshooting:
      - problem:
          uk: "`No such built-in module: node:sqlite` або схожа помилка про `node:sqlite`"
          en: "`No such built-in module: node:sqlite` or a similar error about `node:sqlite`"
        fix:
          uk: "Твій Node старіший за 22.13. Цей рядок (`Error [ERR_UNKNOWN_BUILTIN_MODULE]: No such built-in module: node:sqlite`) ми бачили на Node v20.18.0, де модуля ще немає; у Node 22.5–22.12 він був лише з прапорцем `--experimental-sqlite` (документація Node 22, історія `node:sqlite`; ці версії ми не перевіряли). Онови Node до 22.13 або новішого."
          en: "Your Node is older than 22.13. We saw this line (`Error [ERR_UNKNOWN_BUILTIN_MODULE]: No such built-in module: node:sqlite`) on Node v20.18.0, which has no such module yet; in Node 22.5–22.12 it existed only behind the flag `--experimental-sqlite` (Node 22 documentation, the `node:sqlite` history; we did not check those versions). Update Node to 22.13 or newer."
      - problem:
          uk: "Другий запуск каже `created workshop.db …` замість `opened …`"
          en: "The second run says `created workshop.db …` instead of `opened …`"
        fix:
          uk: "Скрипт шукає `workshop.db` у поточній теці. Запускай його з `~/js-course/no09-workshop` — тієї самої теки, де лежить файл бази."
          en: "The script looks for `workshop.db` in the current folder. Run it from `~/js-course/no09-workshop` — the same folder where the database file is."
    recovery:
      uk: "Видали `workshop.db` (`rm workshop.db`) — наступний запуск створить нову базу версії 1. Твій розв’язок лежить у `workshop.ok.js`, і він же — у вправі курсу."
      en: "Delete `workshop.db` (`rm workshop.db`) — the next run creates a new version 1 database. Your solution is kept in `workshop.ok.js`, and in the course exercise as well."
