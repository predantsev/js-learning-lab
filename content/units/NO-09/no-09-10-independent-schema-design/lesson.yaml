id: no-09-10-independent-schema-design
unit: NO-09
title:
  uk: "Самостійно: спроєктуй, запитай, мігруй"
  en: "Independent: design, query, migrate"
kind: assessment
minutes: 40
contentVersion: 1
purpose:
  uk: "Перевірити, що ти без підказок проєктуєш реляційну схему для нових даних: ключі й обмеження, які відкидають погані рядки самі, запити зі з’єднаннями й агрегатами, безпечні до ін’єкцій, індекс, обґрунтований планом запиту, і міграцію з seed, що оновлює наявну базу без втрати рядків. А потім доводиш оновлення на справжньому файлі бази у своєму терміналі."
  en: "To check that you design, without hints, a relational schema for new data: keys and constraints that refuse bad rows by themselves, injection-safe queries with joins and aggregates, an index justified by its query plan, and a migration with a seed that upgrades an existing database without losing rows. Then you prove the upgrade on a real database file in your own terminal."
objectives:
  - uk: "Без підказок спроєктувати схему з ключами й обмеженнями для незнайомого синтетичного набору даних, написати запити зі з’єднаннями й агрегатами, яких він потребує, і обґрунтувати один індекс його планом запиту."
    en: "Design, without hints, a schema with keys and constraints for an unseen synthetic dataset, write the join and aggregate queries it asks for, and justify one index with its query plan."
  - uk: "Написати й перевірити міграцію та seed, що оновлюють наявну базу без втрати рядків, і пояснити, коли вистачило б файлового репозиторію."
    en: "Write and test a migration plus seed that upgrade an existing database without losing rows, and explain when a file repository would have been enough."
prerequisites: [no-09-09-debug-injection-rollback]
subskills:
  - { family: B-04, skill: "tables/keys/relationships", depth: assess }
  - { family: B-04, skill: "SELECT/join/group/aggregate", depth: assess }
  - { family: B-04, skill: "indexes/query plans", depth: assess }
  - { family: B-04, skill: "migrations/seed", depth: assess }
  - { family: B-05, skill: "file vs relational repository tradeoffs", depth: assess }
glossary: []
selfCheck: [workshop-db]

blocks:
  - id: what-is-checked
    kind: explanation
    title:
      uk: "Що перевіряється"
      en: "What is checked"
    body:
      uk: |
        Тема — запис на заняття майстерні: **аудиторії**, **заняття** й **записи** людей на заняття. Підказок немає: користуйся тим, що вивчив у цьому розділі.

        Дві частини:

        1. **У курсі** — увесь код у `workshop.js`. Автоматичні перевірки пробують вставити погані рядки, порівнюють результати запитів, читають план запиту й мігрують базу, що вже має дані.
        2. **У твоєму терміналі** — той самий `workshop.js` оновлює справжній файл бази `workshop.db` зі старої версії до нової, а ти переконуєшся, що невдала міграція нічого не ламає.
      en: |
        The topic is booking workshop sessions: **rooms**, **sessions** and people’s **bookings** for sessions. There are no hints: use what you learned in this unit.

        Two parts:

        1. **In the course** — all the code in `workshop.js`. The automatic checks try to insert bad rows, compare query results, read a query plan and migrate a database that already holds data.
        2. **In your terminal** — the same `workshop.js` upgrades a real database file `workshop.db` from the old version to the new one, and you make sure a failed migration breaks nothing.

  - id: workshop-db
    kind: exercise
    mode: independent
    assessment: true
    runtime: isolated-node
    dir: workshop-db
    entry: index.js
    editable: [workshop.js]
    strings:
      room1: { uk: "Аудиторія 1", en: "Room 1" }
      lab: { uk: "Лабораторія", en: "Lab" }
      introSql: { uk: "Вступ до SQL", en: "Intro to SQL" }
      indexes: { uk: "Індекси", en: "Indexes" }
      migrations: { uk: "Міграції", en: "Migrations" }
      lina: { uk: "Ліна", en: "Lina" }
      denys: { uk: "Денис", en: "Denys" }
      anna: { uk: "Анна", en: "Anna" }
    title:
      uk: "База записів на заняття"
      en: "A session booking database"
    instructions:
      uk: |
        Дані — у `data.js` (лише для читання). Напиши все в `workshop.js`.

        **Схема — міграція 1** у масиві `migrations` (`{ version, up }`):

        - `rooms (id, name, capacity)`: місткість — ціле число більше за 0; дві аудиторії не мають однакової назви;
        - `sessions (id, title, roomId, day)`: заняття проходить в існуючій аудиторії; `day` — текст `'YYYY-MM-DD'`;
        - `bookings (sessionId, attendee)`: запис стосується існуючого заняття; людина (`attendee` — текст) записується на те саме заняття лише раз, але може бути записана на кілька занять;
        - жодна таблиця не копіює полів іншої.

        **Міграція 2:** у `sessions` з’являється обов’язковий стовпець `level` зі значеннями лише `'intro'` чи `'advanced'`; заняття, що вже були в базі, отримують `'intro'`.

        **Функції:**

        - `migrate(db)` — застосовує лише міграції, новіші за `PRAGMA user_version`, по черзі, кожну разом із новою версією в одній транзакції; повертає масив застосованих версій;
        - `seed(db)` — вставляє `fixtures` з `data.js`, лише якщо `rooms` порожня; повторний виклик нічого не змінює й не кидає помилки;
        - `sessionsWithRoom(db, day)` — заняття цього дня як `{ title, room }` (назва аудиторії), за `id` заняття; день — лише дані, ніколи не частина SQL;
        - `bookingsPerSession(db)` — кожне заняття як `{ title, booked }`, нуль теж; спершу найбільше записів, за однакової кількості — за `id`;
        - `fullSessions(db)` — назви занять, де записів не менше, ніж місткість аудиторії, за `id`.

        **Індекс:** `indexSql` — SQL, після якого запит `attendeeQuery` з `data.js` (записи однієї людини) шукає за індексом, а не переглядає `bookings`. Якщо твоя схема вже дає такий пошук, `indexSql` може бути порожнім.

        **Звіт:** `report.indexReason` — чому план без індексу був поганим і що змінив індекс; `report.storageChoice` — чи вистачило б тут JSON-файла й за яких умов. Кожне — щонайменше 30 символів.

        `index.js` будує базу твоїми функціями й друкує результати та план до й після `indexSql`.
      en: |
        The data is in `data.js` (read-only). Write everything in `workshop.js`.

        **Schema — migration 1** in the array `migrations` (`{ version, up }`):

        - `rooms (id, name, capacity)`: the capacity is an integer above 0; no two rooms share a name;
        - `sessions (id, title, roomId, day)`: a session takes place in an existing room; `day` is text `'YYYY-MM-DD'`;
        - `bookings (sessionId, attendee)`: a booking is for an existing session; a person (`attendee` is text) books the same session only once, but may book several sessions;
        - no table copies fields of another.

        **Migration 2:** `sessions` gets a required column `level` whose only values are `'intro'` and `'advanced'`; sessions already in the database get `'intro'`.

        **Functions:**

        - `migrate(db)` applies only the migrations newer than `PRAGMA user_version`, in order, each together with its new version in one transaction; it returns an array of the versions applied;
        - `seed(db)` inserts the `fixtures` of `data.js` only when `rooms` is empty; a repeated call changes nothing and does not throw;
        - `sessionsWithRoom(db, day)` returns the sessions of that day as `{ title, room }` (the room’s name), by session `id`; the day is only data, never part of the SQL;
        - `bookingsPerSession(db)` returns every session as `{ title, booked }`, zero included; most bookings first, equal counts by `id`;
        - `fullSessions(db)` returns the titles of the sessions whose bookings are at least the room’s capacity, by `id`.

        **Index:** `indexSql` is SQL after which the query `attendeeQuery` of `data.js` (one person’s bookings) searches an index instead of scanning `bookings`. If your schema already gives such a search, `indexSql` may be empty.

        **Report:** `report.indexReason` says why the plan without the index was poor and what the index changed; `report.storageChoice` says whether a JSON file would have been enough here, and under which conditions. Each at least 30 characters.

        `index.js` builds the database with your functions and prints the results and the plan before and after `indexSql`.
    testTitles:
      "a room needs a positive capacity and a name no other room has":
        uk: "Аудиторії потрібна додатна місткість і назва, якої немає в інших"
        en: "A room needs a positive capacity and a name no other room has"
      "a session must be in an existing room":
        uk: "Заняття має бути в існуючій аудиторії"
        en: "A session must be in an existing room"
      "an attendee books a session only once, but may book several sessions":
        uk: "Людина записується на заняття лише раз, але може — на кілька занять"
        en: "An attendee books a session only once, but may book several sessions"
      "sessionsWithRoom lists the sessions of a day with their room":
        uk: "`sessionsWithRoom` дає заняття дня з їхньою аудиторією"
        en: "`sessionsWithRoom` lists the sessions of a day with their room"
      "sessionsWithRoom treats the day only as data":
        uk: "`sessionsWithRoom` вважає день лише даними"
        en: "`sessionsWithRoom` treats the day only as data"
      "bookingsPerSession counts every session, zero included, most booked first":
        uk: "`bookingsPerSession` рахує кожне заняття, нуль теж, найбільші першими"
        en: "`bookingsPerSession` counts every session, zero included, most booked first"
      "fullSessions lists the sessions whose bookings reach the room capacity":
        uk: "`fullSessions` дає заняття, де записів не менше за місткість"
        en: "`fullSessions` lists the sessions whose bookings reach the room capacity"
      "the lookup of an attendee’s bookings searches an index":
        uk: "Пошук записів людини йде за індексом"
        en: "The lookup of an attendee’s bookings searches an index"
      "migrate brings a version 1 database with data to version 2 without losing rows":
        uk: "`migrate` переводить базу версії 1 з даними на версію 2 без втрати рядків"
        en: "`migrate` brings a version 1 database with data to version 2 without losing rows"
      "migrate on an empty database applies 1 and 2, and a rerun applies nothing":
        uk: "`migrate` на порожній базі застосовує 1 і 2, а повторний запуск — нічого"
        en: "`migrate` on an empty database applies 1 and 2, and a rerun applies nothing"
      "a level other than intro or advanced is refused":
        uk: "Рівень, відмінний від `intro` чи `advanced`, відхилено"
        en: "A level other than `intro` or `advanced` is refused"
      "seed fills an empty database once and leaves a filled one alone":
        uk: "`seed` заповнює порожню базу один раз і не чіпає заповнену"
        en: "`seed` fills an empty database once and leaves a filled one alone"
      "the report explains the index and the storage choice":
        uk: "Звіт пояснює індекс і вибір сховища"
        en: "The report explains the index and the storage choice"
    solutionNote:
      uk: "Еталон: `rooms` з `UNIQUE` на назві й `CHECK (capacity > 0)`, `sessions` із зовнішнім ключем на аудиторію, `bookings` із зовнішнім ключем на заняття й первинним ключем `(sessionId, attendee)`. Міграція 2 — `ALTER TABLE … ADD COLUMN level TEXT NOT NULL DEFAULT 'intro' CHECK (…)`: без `DEFAULT` SQLite не додасть стовпець `NOT NULL` до таблиці з рядками. Запити — з параметрами, `LEFT JOIN` для нулів і `HAVING COUNT(*) >= rooms.capacity`. Ключ `(sessionId, attendee)` не допомагає шукати за `attendee`, тому потрібен індекс на `attendee`; схема з ключем `(attendee, sessionId)` дає цей пошук сама — це теж правильно, як і підзапит замість `LEFT JOIN`."
      en: "Reference: `rooms` with `UNIQUE` on the name and `CHECK (capacity > 0)`, `sessions` with a foreign key to the room, `bookings` with a foreign key to the session and the primary key `(sessionId, attendee)`. Migration 2 is `ALTER TABLE … ADD COLUMN level TEXT NOT NULL DEFAULT 'intro' CHECK (…)`: without `DEFAULT` SQLite will not add a `NOT NULL` column to a table with rows. The queries use parameters, a `LEFT JOIN` for the zeros and `HAVING COUNT(*) >= rooms.capacity`. The key `(sessionId, attendee)` does not help a search by `attendee`, so an index on `attendee` is needed; a schema with the key `(attendee, sessionId)` gives that search by itself — correct too, as is a subquery instead of the `LEFT JOIN`."
    feedback:
