id: no-09-02-select-join-group
unit: NO-09
title:
  uk: "SELECT, join, групування й агрегати"
  en: "SELECT, join, group and aggregate"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Писати запити `SELECT` з `WHERE`, `ORDER BY` і `LIMIT` та передбачати їхні рядки для даних бібліотеки."
    en: "Write `SELECT` queries with `WHERE`, `ORDER BY` and `LIMIT`, and predict their rows for the library data."
  - uk: "З’єднувати видачі з учасниками й книжками через `INNER JOIN` і `LEFT JOIN` та передбачати, які рядки `LEFT JOIN` лишає з `NULL`."
    en: "Join loans to members and books with `INNER JOIN` and `LEFT JOIN`, and predict which rows a `LEFT JOIN` keeps with `NULL`s."
  - uk: "Рахувати й підсумовувати за групами через `GROUP BY` і `HAVING` та пояснити, чому `WHERE` відсіює рядки до групування, а `HAVING` — групи після."
    en: "Count and sum per group with `GROUP BY` and `HAVING`, and explain why `WHERE` filters rows before grouping and `HAVING` filters groups after."
prerequisites: [no-09-01-tables-keys-relationships]
subskills:
  - { family: B-04, skill: "SELECT/join/group/aggregate", depth: intro }
glossary: [inner-join, left-join, group-by, aggregate-function]
selfCheck: [predict-left-join, open-loans]

blocks:
  - id: select-basics
    kind: explanation
    title:
      uk: "SELECT: які стовпці, які рядки, у якому порядку"
      en: "SELECT: which columns, which rows, in what order"
    body:
      uk: |
        Запит `SELECT` описує **результат**, а не кроки, як його отримати:

        ```sql
        SELECT title, copies       -- які стовпці
        FROM books                 -- з якої таблиці
        WHERE copies >= 2          -- які рядки лишити
        ORDER BY copies DESC       -- у якому порядку (DESC — від більшого)
        LIMIT 5;                   -- не більше п’яти рядків
        ```

        Без `ORDER BY` порядок рядків не гарантовано — база віддає їх так, як їй зручно. Якщо порядок важливий, пиши його явно.

        **З’єднання (join)** складає рядки двох таблиць у пари за умовою `ON`:

        ```sql
        SELECT members.name, loans.id
        FROM members JOIN loans ON loans.memberId = members.id;
        ```

        Результат має **по рядку на кожну пару, що збіглася**. В учасника з трьома видачами — три рядки, а не один. [[inner-join|`JOIN` (він же `INNER JOIN`)]] викидає учасників без видач; [[left-join|`LEFT JOIN`]] лишає кожен рядок лівої таблиці, а замість відсутньої пари ставить `NULL` — «значення немає».
      en: |
        A `SELECT` query describes the **result**, not the steps to get it:

        ```sql
        SELECT title, copies       -- which columns
        FROM books                 -- from which table
        WHERE copies >= 2          -- which rows to keep
        ORDER BY copies DESC       -- in what order (DESC: largest first)
        LIMIT 5;                   -- at most five rows
        ```

        Without `ORDER BY` the order of rows is not guaranteed — the database returns them however suits it. If the order matters, write it out.

        **A join** puts rows of two tables into pairs by the `ON` condition:

        ```sql
        SELECT members.name, loans.id
        FROM members JOIN loans ON loans.memberId = members.id;
        ```

        The result has **one row per matching pair**. A member with three loans gives three rows, not one. [[inner-join|`JOIN` (also written `INNER JOIN`)]] drops members without loans; a [[left-join|`LEFT JOIN`]] keeps every row of the left table and puts `NULL` — “no value” — where the pair is missing.

  - id: predict-left-join
    kind: prediction
    strings:
      marta: { uk: "Марта", en: "Marta" }
      oleh: { uk: "Олег", en: "Oleh" }
      borys: { uk: "Борис", en: "Borys" }
      taras: { uk: "Тарас", en: "Taras" }
    prompt:
      uk: "У бібліотеці чотири учасники: у %%marta%% три видачі, в %%oleh%% одна, у %%borys%% одна, у %%taras%% жодної. Скільки рядків поверне цей запит?"
      en: "The library has four members: %%marta%% has three loans, %%oleh%% one, %%borys%% one, %%taras%% none. How many rows does this query return?"
    code: |
      SELECT members.name, loans.id AS loanId
      FROM members
      LEFT JOIN loans ON loans.memberId = members.id;
    lang: sql
    runnable: false
    answer:
      type: choice
      options:
        - id: six
          text: { uk: "6", en: "6" }
        - id: four
          text: { uk: "4 — по одному на учасника", en: "4 — one per member" }
          why:
            uk: "З’єднання не «прикріплює» видачі до учасника один раз. Воно дає рядок на кожну пару, що збіглася: %%marta%% з’являється тричі."
            en: "A join does not “attach” the loans to a member once. It gives a row for every matching pair: %%marta%% appears three times."
        - id: five
          text: { uk: "5 — по одному на видачу", en: "5 — one per loan" }
          why:
            uk: "Так було б із `INNER JOIN`. `LEFT JOIN` лишає й %%taras%%: один рядок, де `loanId` — `NULL`."
            en: "That would be an `INNER JOIN`. A `LEFT JOIN` keeps %%taras%% too: one row where `loanId` is `NULL`."
        - id: twenty
          text: { uk: "20 — кожен учасник з кожною видачею", en: "20 — every member with every loan" }
          why:
            uk: "Умова `ON` лишає лише пари, де `loans.memberId` дорівнює `members.id`. Усі 4 × 5 пар дав би лише запит без умови."
            en: "The `ON` condition keeps only pairs where `loans.memberId` equals `members.id`. All 4 × 5 pairs would come only from a query with no condition."
      correct: [six]
    explanation:
      uk: "3 рядки %%marta%% + 1 %%oleh%% + 1 %%borys%% = 5 пар, що збіглися, і ще один рядок для %%taras%% з `NULL`, бо `LEFT JOIN` не викидає рядків лівої таблиці. Разом 6 — приклад нижче друкує їх."
      en: "3 rows for %%marta%% + 1 for %%oleh%% + 1 for %%borys%% = 5 matching pairs, plus one row for %%taras%% with `NULL`, because a `LEFT JOIN` drops no row of the left table. 6 in total — the example below prints them."

  - id: groups
    kind: explanation
    title:
      uk: "GROUP BY, агрегати, WHERE і HAVING"
      en: "GROUP BY, aggregates, WHERE and HAVING"
    body:
      uk: |
        [[group-by|`GROUP BY`]] складає рядки з однаковим значенням у купки, і з кожної купки виходить **один** рядок. Що в ньому писати, кажуть [[aggregate-function|агрегатні функції]]: `COUNT(...)` — скільки, `SUM(...)` — сума, `MIN`, `MAX`, `AVG`. Це те саме, що `reduce` у JavaScript, лише для кожної купки окремо.

        Запит виконується логічно в такому порядку: `FROM`/`JOIN` → `WHERE` → `GROUP BY` → `HAVING` → `SELECT` → `ORDER BY` → `LIMIT`. Звідси два різні фільтри:

        - `WHERE` відсіює **рядки до** групування — він ще не знає, скільки рядків буде в купці;
        - `HAVING` відсіює **купки після** групування — тут уже можна писати `COUNT(...) >= 2`.

        Ще дві деталі. `COUNT(*)` рахує рядки, а `COUNT(loans.id)` — лише рядки, де `loans.id` не `NULL`; після `LEFT JOIN` різниця важлива. А `returnedOn IS NULL` означає «повернення не записано» — чому не `= NULL`, розберемо в наступному уроці.
      en: |
        [[group-by|`GROUP BY`]] puts rows with the same value into piles, and each pile gives **one** row. What goes into it is said by [[aggregate-function|aggregate functions]]: `COUNT(...)` — how many, `SUM(...)` — the total, `MIN`, `MAX`, `AVG`. It is the same as `reduce` in JavaScript, only for each pile separately.

        A query runs logically in this order: `FROM`/`JOIN` → `WHERE` → `GROUP BY` → `HAVING` → `SELECT` → `ORDER BY` → `LIMIT`. Hence two different filters:

        - `WHERE` filters **rows before** grouping — it does not know yet how many rows a pile will have;
        - `HAVING` filters **piles after** grouping — this is where `COUNT(...) >= 2` can be written.

        Two more details. `COUNT(*)` counts rows, while `COUNT(loans.id)` counts only rows where `loans.id` is not `NULL`; after a `LEFT JOIN` the difference matters. And `returnedOn IS NULL` means “no return recorded” — why not `= NULL` is the topic of the next lesson.

  - id: clause-pipeline
    kind: visual
    visual: pipeline
    strings:
      marta: { uk: "Марта", en: "Marta" }
      oleh: { uk: "Олег", en: "Oleh" }
      borys: { uk: "Борис", en: "Borys" }
      taras: { uk: "Тарас", en: "Taras" }
    title:
      uk: "Шлях рядків крізь JOIN, WHERE і GROUP BY"
      en: "The rows’ path through JOIN, WHERE and GROUP BY"
    textEquivalent:
      uk: "Запит SELECT name, COUNT(*) FROM members JOIN loans ON loans.memberId = members.id WHERE returnedOn IS NULL GROUP BY name, записаний як ланцюжок методів масиву в тому логічному порядку, у якому SQL описує кроки. Спершу чотири учасники. JOIN перетворює кожного на стільки рядків, скільки в нього видач: %%marta%% дає три рядки, %%oleh%% і %%borys%% — по одному, %%taras%% — жодного; разом п’ять рядків. WHERE лишає рядки, де returnedOn — null: це дві видачі %%marta%% і одна %%oleh%%. GROUP BY з COUNT складає рядки в купки за іменем і дає по одному числу на купку: %%marta%% — 2, %%oleh%% — 1. %%borys%% і %%taras%% у результат не потрапили: в одного всі видачі повернено, в іншого їх немає. Сама база може виконувати запит в іншому порядку, але результат той самий."
      en: "The query SELECT name, COUNT(*) FROM members JOIN loans ON loans.memberId = members.id WHERE returnedOn IS NULL GROUP BY name, written as a chain of array methods in the logical order in which SQL describes the steps. First, four members. JOIN turns each member into as many rows as they have loans: %%marta%% gives three rows, %%oleh%% and %%borys%% one each, %%taras%% none; five rows in total. WHERE keeps the rows where returnedOn is null: two loans of %%marta%% and one of %%oleh%%. GROUP BY with COUNT puts the rows into piles by name and gives one number per pile: %%marta%% 2, %%oleh%% 1. %%borys%% and %%taras%% are not in the result: one has returned every loan, the other has none. The database itself may execute the query in another order, but the result is the same."
    spec:
      code: |
        // SELECT name, COUNT(*) FROM members
        //   JOIN loans ON loans.memberId = members.id
        //   WHERE returnedOn IS NULL
        //   GROUP BY name
        const result = members
          .flatMap((m) => loansOf(m))                 // JOIN
          .filter((row) => row.returnedOn === null)   // WHERE
          .reduce((piles, row) => count(piles, row), {}); // GROUP BY + COUNT
      input:
        label: { uk: "members", en: "members" }
        items:
          - { id: 1, name: "%%marta%%" }
          - { id: 2, name: "%%oleh%%" }
          - { id: 3, name: "%%borys%%" }
          - { id: 4, name: "%%taras%%" }
        show: "m => `${m.id} ${m.name}`"
        caption:
          uk: "`FROM members`: чотири рядки. Ще жодної видачі."
          en: "`FROM members`: four rows. No loans yet."
      stages:
        - op: flatMap
          fn: "(m) => [{ loan: 1, memberId: 1, returnedOn: '03-08' }, { loan: 2, memberId: 1, returnedOn: null }, { loan: 3, memberId: 2, returnedOn: null }, { loan: 4, memberId: 1, returnedOn: null }, { loan: 5, memberId: 3, returnedOn: '03-10' }].filter((l) => l.memberId === m.id).map((l) => ({ name: m.name, loan: l.loan, returnedOn: l.returnedOn }))"
          label: "JOIN loans ON loans.memberId = members.id"
          show: "r => `${r.name} · loan ${r.loan} · ${r.returnedOn}`"
          perItem: true
          caption:
            uk: "`JOIN` для `{item}` → **{result}**: рядок на кожну видачу цього учасника."
            en: "`JOIN` for `{item}` → **{result}**: one row per loan of this member."
          summary:
            uk: "Після `JOIN` — {result} рядків: %%marta%% тепер тричі, а %%taras%%, у якого немає видач, зник (так поводиться `INNER JOIN`)."
            en: "After `JOIN` there are {result} rows: %%marta%% now appears three times, and %%taras%%, who has no loans, is gone (that is how an `INNER JOIN` behaves)."
        - op: filter
          fn: "(row) => row.returnedOn === null"
          label: "WHERE returnedOn IS NULL"
          caption:
            uk: "`WHERE` перевіряє **кожен рядок окремо**, ще до групування: лишилося {result} відкриті видачі."
            en: "`WHERE` tests **every row on its own**, before grouping: {result} open loans remain."
        - op: reduce
          fn: "(piles, row) => ({ ...piles, [row.name]: (piles[row.name] ?? 0) + 1 })"
          initial: {}
          label: "GROUP BY name, COUNT(*)"
          caption:
            uk: "`GROUP BY` складає рядки в купки за іменем, `COUNT(*)` дає одне число на купку. Умову на кшталт «щонайменше 2» тут уже можна перевірити — це робота `HAVING`."
            en: "`GROUP BY` piles the rows up by name, and `COUNT(*)` gives one number per pile. A condition such as “at least 2” can be tested only now — that is the job of `HAVING`."

  - id: library-queries
    kind: example
    runtime: isolated-node
    dir: library-queries
    entry: index.js
    strings:
      marta: { uk: "Марта", en: "Marta" }
      oleh: { uk: "Олег", en: "Oleh" }
      borys: { uk: "Борис", en: "Borys" }
      taras: { uk: "Тарас", en: "Taras" }
      lighthouse: { uk: "Маяк на скелі", en: "The lighthouse on the rock" }
      garden: { uk: "Сад на даху", en: "A garden on the roof" }
      stars: { uk: "Карта зоряного неба", en: "A map of the night sky" }
    title:
      uk: "Три запити до бібліотеки"
      en: "Three queries to the library"
    body:
      uk: "Натисни **Запустити**. `library.js` створює ту саму бібліотеку, що й у попередньому уроці, тепер із кількістю примірників `copies` і датою повернення `returnedOn` (`NULL` — книжку ще не повернули). Програма друкує три результати: книжки з умовою й порядком, `LEFT JOIN` учасників і видач та кількість видач на учасника з `HAVING`."
      en: "Press **Run**. `library.js` creates the same library as in the previous lesson, now with the number of copies `copies` and the return date `returnedOn` (`NULL` means the book is not back yet). The program prints three results: books with a condition and an order, a `LEFT JOIN` of members and loans, and loans per member with `HAVING`."
    tryIt:
      uk: "У другому запиті заміни `LEFT JOIN` на `JOIN` і запусти: рядків стало 5, рядок `%%taras%% · NULL` зник. Потім у третьому запиті перенеси умову: прибери рядок `HAVING COUNT(loans.id) >= 2` і допиши `WHERE COUNT(loans.id) >= 2` перед `GROUP BY` — запуск зупиняється з помилкою `misuse of aggregate: COUNT()`: `WHERE` перевіряє окремі рядки, а кількість з’являється лише після групування. Поверни `HAVING` і зміни 2 на 1 — тепер у списку ще %%oleh%% і %%borys%%."
      en: "In the second query replace `LEFT JOIN` with `JOIN` and run: there are 5 rows now, and the row `%%taras%% · NULL` is gone. Then move the condition in the third query: remove the line `HAVING COUNT(loans.id) >= 2` and add `WHERE COUNT(loans.id) >= 2` before `GROUP BY` — the run stops with the error `misuse of aggregate: COUNT()`: `WHERE` tests single rows, and the count exists only after grouping. Bring `HAVING` back and change 2 to 1 — now %%oleh%% and %%borys%% are in the list too."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: reduce"
      en: "Recall: reduce"
    items:
      - id: reduce-counts
        from: js-05-04-reduce
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const loans = [{ memberId: 1 }, { memberId: 2 }, { memberId: 1 }];
          const perMember = loans.reduce((acc, loan) => {
            acc[loan.memberId] = (acc[loan.memberId] ?? 0) + 1;
            return acc;
          }, {});
          console.log(JSON.stringify(perMember));
        verify:
          logs: ['{"1":2,"2":1}']
        answer:
          type: choice
          options:
            - id: grouped
              code: '{"1":2,"2":1}'
            - id: total
              code: "3"
              why:
                uk: "Акумулятор тут — об’єкт `{}`, а не число: `reduce` складає окремий лічильник для кожного `memberId`."
                en: "The accumulator here is an object `{}`, not a number: `reduce` keeps a separate counter for each `memberId`."
            - id: last
              code: '{"1":1,"2":1}'
              why:
                uk: "`?? 0` спрацьовує лише вперше; другий раз для `memberId` 1 до наявної 1 додається ще 1."
                en: "`?? 0` applies only the first time; the second time for `memberId` 1, one more is added to the existing 1."
          correct: [grouped]
        explanation:
          uk: "`reduce` іде від початкового `{}` і для кожної видачі збільшує лічильник її учасника. `GROUP BY memberId` з `COUNT(*)` робить те саме в базі."
          en: "`reduce` starts from `{}` and increments the counter of each loan’s member. `GROUP BY memberId` with `COUNT(*)` does the same inside the database."

  - id: open-loans
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: open-loans
    entry: index.js
    editable: [app.js]
    strings:
      marta: { uk: "Марта", en: "Marta" }
      oleh: { uk: "Олег", en: "Oleh" }
      borys: { uk: "Борис", en: "Borys" }
      taras: { uk: "Тарас", en: "Taras" }
      anna: { uk: "Анна", en: "Anna" }
      lighthouse: { uk: "Маяк на скелі", en: "The lighthouse on the rock" }
      garden: { uk: "Сад на даху", en: "A garden on the roof" }
      stars: { uk: "Карта зоряного неба", en: "A map of the night sky" }
    title:
      uk: "Відкриті видачі кожного учасника"
      en: "Each member’s open loans"
    instructions:
      uk: |
        Бібліотекар хоче бачити, хто скільки книжок ще не повернув. Напиши в `app.js` запит для `openLoanCounts(db)`:

        - по одному рядку на **кожного** учасника, з полями `name` і `open`;
        - `open` — кількість його видач, де `returnedOn IS NULL`; хто не має відкритих видач, отримує `0`;
        - порядок: спершу найбільше відкритих видач, за однакової кількості — за `name`.

        Дані — бібліотека з `library.js`. Перевірки додають ще одну учасницю з однією відкритою видачею, щоб перевірити порядок за однакової кількості.
      en: |
        The librarian wants to see who has not returned how many books. Write the query of `openLoanCounts(db)` in `app.js`:

        - one row for **every** member, with the fields `name` and `open`;
        - `open` is the number of their loans where `returnedOn IS NULL`; a member with no open loans gets `0`;
        - order: most open loans first; equal counts by `name`.

        The data is the library of `library.js`. The checks add one more member with one open loan to test the order of equal counts.
    testTitles:
      "every member is listed once, with the fields name and open":
        uk: "Кожен учасник є рівно раз, з полями `name` і `open`"
        en: "Every member is listed once, with the fields `name` and `open`"
      "open counts only loans that are not returned, and 0 when there are none":
        uk: "`open` рахує лише неповернені видачі, а без них дорівнює 0"
        en: "`open` counts only loans that are not returned, and is 0 when there are none"
      "rows are ordered by open loans, most first, then by name":
        uk: "Рядки впорядковано за `open` від більшого, далі за `name`"
        en: "Rows are ordered by `open`, most first, then by `name`"
    hints:
      nudge:
        uk: "Які учасники зникають з результату, якщо умова «видача відкрита» стоїть у `WHERE`? Подумай, коли `WHERE` виконується відносно `LEFT JOIN`."
        en: "Which members vanish from the result when the “loan is open” condition sits in `WHERE`? Think about when `WHERE` runs relative to the `LEFT JOIN`."
      explanation:
        uk: |
          Умова в `ON` вирішує, з якими рядками скласти пару, і `LEFT JOIN` усе одно лишає кожен лівий рядок. Умова в `WHERE` викидає рядки вже після з’єднання — разом з учасниками, чиї видачі всі повернено. Схожий запит для витрат за категоріями, порожні категорії теж з нулем:

          ```sql
          SELECT categories.title, COUNT(expenses.id) AS paid
          FROM categories
          LEFT JOIN expenses ON expenses.categoryId = categories.id AND expenses.paidOn IS NOT NULL
          GROUP BY categories.id;
          ```

          `COUNT(стовпець)` не рахує `NULL`, тому порожня категорія дає 0, а `COUNT(*)` дав би 1. Кілька ключів сортування пишуть через кому: `ORDER BY a DESC, b`.
        en: |
          A condition in `ON` decides which rows form a pair, and a `LEFT JOIN` still keeps every left row. A condition in `WHERE` throws rows away after the join — together with the members whose loans were all returned. A similar query for expenses per category, with empty categories at zero too:

          ```sql
          SELECT categories.title, COUNT(expenses.id) AS paid
          FROM categories
          LEFT JOIN expenses ON expenses.categoryId = categories.id AND expenses.paidOn IS NOT NULL
          GROUP BY categories.id;
          ```

          `COUNT(column)` does not count `NULL`s, so an empty category gives 0, while `COUNT(*)` would give 1. Several sort keys are separated by commas: `ORDER BY a DESC, b`.
    solutionNote:
      uk: "`LEFT JOIN` з умовою «відкрита» в `ON` лишає кожного учасника; `COUNT(loans.id)` не рахує рядок з `NULL`, тож у %%borys%% і %%taras%% виходить 0. `ORDER BY open DESC, members.name` задає обидва ключі сортування. Підзапит `(SELECT COUNT(*) FROM loans WHERE …)` для кожного учасника чи `SUM(CASE …)` теж правильні."
      en: "A `LEFT JOIN` with the “open” condition in `ON` keeps every member; `COUNT(loans.id)` does not count the row with `NULL`, so %%borys%% and %%taras%% get 0. `ORDER BY open DESC, members.name` sets both sort keys. A subquery `(SELECT COUNT(*) FROM loans WHERE …)` per member or a `SUM(CASE …)` is correct too."
    feedback:
      - when: { test: "every member is listed once, with the fields name and open" }
        message:
          uk: "Ця перевірка очікує по рядку на кожного з чотирьох учасників, з полями рівно `name` і `open` (назви стовпців задає `AS`). Якщо когось бракує, перевір тип з’єднання й те, чи умова «відкрита» стоїть в `ON`, а не у `WHERE`."
          en: "This check expects one row for each of the four members, with exactly the fields `name` and `open` (column names are set with `AS`). If someone is missing, check the kind of join and whether the “open” condition sits in `ON` rather than in `WHERE`."
      - when: { test: "open counts only loans that are not returned, and 0 when there are none" }
        message:
          uk: "Ця перевірка очікує 2 для %%marta%%, 1 для %%oleh%% і 0 для %%borys%% та %%taras%%. Якщо в когось без відкритих видач виходить 1, порахуй стовпець видачі, а не `*`."
          en: "This check expects 2 for %%marta%%, 1 for %%oleh%% and 0 for %%borys%% and %%taras%%. If someone with no open loans gets 1, count a column of the loan instead of `*`."
      - when: { test: "rows are ordered by open loans, most first, then by name" }
        message:
          uk: "Ця перевірка очікує порядок `%%marta%% 2, %%anna%% 1, %%oleh%% 1, %%borys%% 0, %%taras%% 0`: спершу за `open` від більшого, за однакового `open` — за `name`."
          en: "This check expects the order `%%marta%% 2, %%anna%% 1, %%oleh%% 1, %%borys%% 0, %%taras%% 0`: first by `open`, largest first, and for equal `open` by `name`."

  - id: to-project
    kind: transfer
    checkpoint: CP-NO
    body:
      uk: "У цьому розділі проєкт не змінюється: кроку проєкту в NO-09 немає. Але підсумок твого домену — сума бажаних речей, кількість справ на сьогодні, витрати за категорією — це саме `GROUP BY` з агрегатом. Якщо в NO-05 за планом курсу обереш SQLite, такі підсумки рахуватиме запит, а не цикл у JavaScript."
      en: "Your project does not change in this unit: NO-09 has no project step. But your domain’s summary — the total of wanted items, the tasks due today, the expenses per category — is exactly a `GROUP BY` with an aggregate. If you choose SQLite in NO-05, as the course plan offers, such summaries will be computed by a query instead of a JavaScript loop."
