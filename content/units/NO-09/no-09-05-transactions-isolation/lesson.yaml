          uk: "Ця перевірка після невдалої передачі виконує `BEGIN` і `ROLLBACK` й очікує, що вони пройдуть. `cannot start a transaction within a transaction` означає, що на шляху помилки бракує `ROLLBACK`."
          en: "After a failed transfer this check runs `BEGIN` and `ROLLBACK` and expects them to work. `cannot start a transaction within a transaction` means the error path lacks a `ROLLBACK`."

