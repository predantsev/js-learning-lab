      en: "Your project does not change in this unit: NO-09 has no project step, it is a separate lab. But look at your domain’s records from this angle: what in them would point at another record by `id`, and what do you copy today? In the course plan the project’s storage is chosen in NO-05; this kind of schema is what you will need then if you choose SQLite."
