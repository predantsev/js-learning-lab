id: no-09-03-crud-constraints-nulls
unit: NO-09
title:
  uk: "CRUD, обмеження і NULL"
  en: "CRUD, constraints and NULL"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Писати `INSERT`, `UPDATE` і `DELETE` та передбачати, скільки рядків вони змінять, зокрема `UPDATE` без `WHERE`."
    en: "Write `INSERT`, `UPDATE` and `DELETE` statements and predict how many rows they change, including an `UPDATE` without `WHERE`."
  - uk: "Задавати обмеження `NOT NULL`, `UNIQUE`, `CHECK` і `FOREIGN KEY` (зовнішні ключі в SQLite вмикають для кожного з’єднання через `PRAGMA foreign_keys = ON`) і читати помилку кожного порушення."
    en: "Enforce `NOT NULL`, `UNIQUE`, `CHECK` and `FOREIGN KEY` constraints (in SQLite foreign keys are switched on per connection with `PRAGMA foreign_keys = ON`) and read the error each violation raises."
  - uk: "Передбачати тризначну логіку: чому `returnedOn = NULL` не знаходить нічого і потрібне `IS NULL`."
    en: "Predict three-valued logic: why `returnedOn = NULL` matches nothing and `IS NULL` is required."
prerequisites: [no-09-02-select-join-group]
subskills:
  - { family: B-04, skill: "CRUD/constraints/nulls", depth: intro }
glossary: [sql-null, check-constraint, unique-constraint, three-valued-logic]
selfCheck: [predict-null, return-book]

blocks:
  - id: crud
    kind: explanation
    title:
      uk: "Додати, змінити, видалити — і скільки рядків"
      en: "Add, change, delete — and how many rows"
    body:
      uk: |
        Чотири дії над даними — **CRUD** (create, read, update, delete). Читання (`SELECT`) ти вже знаєш, решта три:

        ```sql
        INSERT INTO loans (memberId, bookId, loanedOn) VALUES (2, 3, '2026-03-11');
        UPDATE loans SET returnedOn = '2026-03-12' WHERE id = 3;
        DELETE FROM loans WHERE returnedOn IS NOT NULL;
        ```

        `UPDATE` і `DELETE` діють на **всі** рядки, які лишив `WHERE`. Без `WHERE` — на всю таблицю: `UPDATE loans SET returnedOn = '2026-03-12'` «повертає» кожну видачу, і база не питає «ти впевнений?».

        У `node:sqlite` інструкцію, що змінює дані, виконують через `db.prepare(sql).run()`. Вона повертає об’єкт, у якому `changes` — скільки рядків змінено. Це перший спосіб помітити помилку: якщо ти чекав 1, а отримав 0 чи 5, щось не так з `WHERE`.
      en: |
        The four actions on data are **CRUD** (create, read, update, delete). You know reading (`SELECT`); here are the other three:

        ```sql
        INSERT INTO loans (memberId, bookId, loanedOn) VALUES (2, 3, '2026-03-11');
        UPDATE loans SET returnedOn = '2026-03-12' WHERE id = 3;
        DELETE FROM loans WHERE returnedOn IS NOT NULL;
        ```

        `UPDATE` and `DELETE` act on **all** the rows `WHERE` kept. Without `WHERE` — on the whole table: `UPDATE loans SET returnedOn = '2026-03-12'` “returns” every loan, and the database does not ask “are you sure?”.

        In `node:sqlite` a statement that changes data runs with `db.prepare(sql).run()`. It returns an object whose `changes` is how many rows changed. That is the first way to notice a mistake: if you expected 1 and got 0 or 5, something is wrong with `WHERE`.

  - id: null-logic
    kind: explanation
    title:
      uk: "NULL — не значення, а його відсутність"
      en: "NULL is not a value but its absence"
    body:
      uk: |
        [[sql-null|`NULL`]] у SQL означає «невідомо» або «немає». Тому порівняння з ним дає не `true` і не `false`, а третю відповідь — **unknown**. Це [[three-valued-logic|тризначна логіка]]: `WHERE` лишає лише рядки, для яких умова **true**, а unknown відкидає так само, як false.

        | Вираз | Коли `returnedOn` — `NULL` |
        |---|---|
        | `returnedOn = NULL` | unknown — рядок відкинуто |
        | `returnedOn <> '2026-03-08'` | unknown — рядок відкинуто |
        | `returnedOn IS NULL` | true |

        Навіть `NULL = NULL` — unknown: два невідомі значення не обов’язково однакові. Для «немає значення» є лише `IS NULL` та `IS NOT NULL`.
      en: |
        [[sql-null|`NULL`]] in SQL means “unknown” or “none”. So a comparison with it gives neither `true` nor `false` but a third answer — **unknown**. This is [[three-valued-logic]]: `WHERE` keeps only the rows for which the condition is **true**, and drops unknown just like false.

        | Expression | When `returnedOn` is `NULL` |
        |---|---|
        | `returnedOn = NULL` | unknown — the row is dropped |
        | `returnedOn <> '2026-03-08'` | unknown — the row is dropped |
        | `returnedOn IS NULL` | true |

        Even `NULL = NULL` is unknown: two unknown values are not necessarily equal. For “no value” there is only `IS NULL` and `IS NOT NULL`.

  - id: predict-null
    kind: prediction
    prompt:
      uk: "У таблиці `loans` п’ять видач, у трьох із них `returnedOn` — `NULL`. Що повернуть два запити?"
      en: "The `loans` table has five loans; three of them have `returnedOn` set to `NULL`. What do the two queries return?"
    code: |
      SELECT COUNT(*) FROM loans WHERE returnedOn = NULL;
      SELECT COUNT(*) FROM loans WHERE returnedOn IS NULL;
    lang: sql
    runnable: false
    answer:
      type: choice
      options:
        - id: zero-three
          code: "0\n3"
        - id: three-three
          code: "3\n3"
          why:
            uk: "`NULL` не дорівнює нічому, навіть іншому `NULL`: `returnedOn = NULL` дає unknown для кожного рядка, і `WHERE` їх відкидає."
            en: "`NULL` equals nothing, not even another `NULL`: `returnedOn = NULL` gives unknown for every row, and `WHERE` drops them all."
        - id: two-three
          code: "2\n3"
          why:
            uk: "Перший запит не рахує «повернені» видачі — він не знаходить жодної: порівняння з `NULL` ніколи не дає true."
            en: "The first query does not count the “returned” loans — it finds none: a comparison with `NULL` is never true."
        - id: error
          code: "SyntaxError"
          why:
            uk: "`= NULL` — синтаксично правильний SQL, і саме тому він небезпечний: помилки немає, просто 0 рядків."
            en: "`= NULL` is syntactically valid SQL, and that is exactly why it is dangerous: no error, just 0 rows."
      correct: [zero-three]
    explanation:
      uk: "`returnedOn = NULL` для кожного рядка дає unknown, тож лічильник — 0. `IS NULL` питає саме «значення немає?» і знаходить усі три відкриті видачі. Приклад «Обмеження в дії» друкує обидва числа."
      en: "`returnedOn = NULL` gives unknown for every row, so the count is 0. `IS NULL` asks exactly “is there no value?” and finds all three open loans. The example “Constraints at work” prints both numbers."

  - id: constraints
    kind: explanation
    title:
      uk: "Обмеження: правила, які перевіряє сама база"
      en: "Constraints: rules the database itself enforces"
    body:
      uk: |
        Обмеження пишуть у `CREATE TABLE`, і база відмовляє в кожній зміні, що їх порушує:

        - `NOT NULL` — значення обов’язкове;
        - [[unique-constraint|`UNIQUE`]] — два рядки не можуть мати однакове значення (наприклад, `isbn`);
        - [[check-constraint|`CHECK (copies >= 0)`]] — умова, яка не може бути **false**;
        - `REFERENCES` — зовнішній ключ із попередніх уроків.

        «У мене є перевірка в JavaScript, навіщо ще й тут?» Валідація на вході сервера захищає один шлях — запити. Скрипт імпорту, міграція, інший сервіс чи помилка в коді пишуть у таблицю в обхід неї. Обмеження — останній рубіж, який стоїть на кожному шляху.

        Важлива деталь SQLite: перевірку зовнішніх ключів **вимкнено за замовчуванням** і вмикають окремо для кожного з’єднання командою `PRAGMA foreign_keys = ON` ([документація SQLite](https://www.sqlite.org/foreignkeys.html#fk_enable)). `node:sqlite` робить це сам: опція `enableForeignKeyConstraints` у `new DatabaseSync(…)` за замовчуванням `true` ([документація Node 22](https://nodejs.org/docs/latest-v22.x/api/sqlite.html#new-databasesyncpath-options)). Інші інструменти — наприклад, консольна програма `sqlite3` — цього не роблять.
      en: |
        Constraints are written in `CREATE TABLE`, and the database refuses every change that breaks them:

        - `NOT NULL` — a value is required;
        - [[unique-constraint|`UNIQUE`]] — two rows cannot share a value (for example `isbn`);
        - [[check-constraint|`CHECK (copies >= 0)`]] — a condition that cannot be **false**;
        - `REFERENCES` — the foreign key of the previous lessons.

        “I validate in JavaScript, why here too?” Validation at the server’s edge guards one path — requests. An import script, a migration, another service or a bug in the code writes to the table around it. A constraint is the last line, and it stands on every path.

        An important SQLite detail: foreign key enforcement is **off by default** and is switched on separately for each connection with `PRAGMA foreign_keys = ON` ([SQLite documentation](https://www.sqlite.org/foreignkeys.html#fk_enable)). `node:sqlite` does it for you: the option `enableForeignKeyConstraints` of `new DatabaseSync(…)` defaults to `true` ([Node 22 documentation](https://nodejs.org/docs/latest-v22.x/api/sqlite.html#new-databasesyncpath-options)). Other tools — for example the `sqlite3` command-line program — do not.

  - id: predict-inserts
    kind: prediction
    prompt:
      uk: "Таблиця `books` має обмеження з коментаря в коді, у `books` уже є книжка з `isbn` `'LIB-001'`, а учасника з `id` 9 немає. Зовнішні ключі увімкнено. Які вставки база відхилить?"
      en: "The `books` table has the constraints in the code comment, `books` already has a book with `isbn` `'LIB-001'`, and there is no member with `id` 9. Foreign keys are on. Which inserts does the database refuse?"
    code: |
      -- books (id INTEGER PRIMARY KEY, title TEXT NOT NULL,
      --        isbn TEXT NOT NULL UNIQUE, copies INTEGER NOT NULL CHECK (copies >= 0))
      INSERT INTO books (title, isbn, copies) VALUES ('Atlas', 'LIB-001', 1);  -- A
      INSERT INTO books (title, isbn, copies) VALUES ('Atlas', 'LIB-004', -1); -- B
      INSERT INTO books (isbn, copies) VALUES ('LIB-005', 1);                  -- C
      INSERT INTO loans (memberId, bookId, loanedOn) VALUES (9, 1, '2026-03-11'); -- D
      INSERT INTO books (title, isbn, copies) VALUES ('Atlas', 'LIB-006', 0);  -- E
    lang: sql
    runnable: false
    answer:
      type: multi
      options:
        - id: a
          text: { uk: "A — повторний `isbn`", en: "A — a repeated `isbn`" }
        - id: b
          text: { uk: "B — `-1` примірник", en: "B — `-1` copies" }
        - id: c
          text: { uk: "C — без `title`", en: "C — no `title`" }
        - id: d
          text: { uk: "D — учасник 9", en: "D — member 9" }
        - id: e
          text: { uk: "E — `0` примірників", en: "E — `0` copies" }
          why:
            uk: "`0 >= 0` — true, тож `CHECK` пропускає нуль. Нуль — це значення, а не його відсутність."
            en: "`0 >= 0` is true, so the `CHECK` lets zero through. Zero is a value, not the absence of one."
      correct: [a, b, c, d]
    explanation:
      uk: "A ламає `UNIQUE`, B — `CHECK`, C — `NOT NULL` (`title` не задано, отже `NULL`), D — зовнішній ключ. E проходить. Приклад «Обмеження в дії» показує точний текст кожної помилки."
      en: "A breaks `UNIQUE`, B the `CHECK`, C `NOT NULL` (`title` is not given, so it is `NULL`), D the foreign key. E goes through. The example “Constraints at work” shows the exact text of each error."

  - id: constraints-lab
    kind: example
    runtime: isolated-node
    dir: constraints-lab
    entry: index.js
    strings:
      marta: { uk: "Марта", en: "Marta" }
      oleh: { uk: "Олег", en: "Oleh" }
      borys: { uk: "Борис", en: "Borys" }
      lighthouse: { uk: "Маяк на скелі", en: "The lighthouse on the rock" }
      garden: { uk: "Сад на даху", en: "A garden on the roof" }
      stars: { uk: "Карта зоряного неба", en: "A map of the night sky" }
      atlas: { uk: "Атлас", en: "Atlas" }
    title:
      uk: "Обмеження в дії"
      en: "Constraints at work"
    body:
      uk: "Натисни **Запустити**. Програма рахує видачі через `= NULL` і `IS NULL`, пробує п’ять вставок із попереднього питання й друкує відповідь бази на кожну, а потім повертає видачу 3 двічі та видаляє повернені видачі, друкуючи `changes` кожної інструкції."
      en: "Press **Run**. The program counts loans with `= NULL` and `IS NULL`, tries the five inserts of the previous question and prints the database’s answer to each, then returns loan 3 twice and deletes the returned loans, printing the `changes` of each statement."
    tryIt:
      uk: "Додай під рядком з `new DatabaseSync` рядок `db.exec('PRAGMA foreign_keys = OFF');` і запусти: видача для учасника 9 тепер проходить (`ok, 1 row added`) — база більше не перевіряє зв’язок. Прибери цей рядок. Потім у першому `UPDATE` (повернення видачі 3) зітри `WHERE id = 3 AND returnedOn IS NULL` і запусти: `5 row(s) changed` — повернено всі видачі, а `DELETE` після цього видаляє всі 5."
      en: "Under the line with `new DatabaseSync` add `db.exec('PRAGMA foreign_keys = OFF');` and run: the loan for member 9 now goes through (`ok, 1 row added`) — the database no longer checks the link. Remove that line. Then in the first `UPDATE` (the return of loan 3) erase `WHERE id = 3 AND returnedOn IS NULL` and run: `5 row(s) changed` — every loan was returned, and the `DELETE` afterwards removes all 5."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: валідація на вході"
      en: "Recall: validation at the edge"
    items:
      - id: why-both
        from: no-04-02-schema-validation
        prompt:
          uk: "Сервер перевіряє тіло запиту схемою, а таблиця має `CHECK (price >= 0)`. Колега пропонує прибрати одне з двох як дублікат. Що відповісти?"
          en: "The server validates request bodies against a schema, and the table has `CHECK (price >= 0)`. A colleague suggests removing one of the two as a duplicate. What do you answer?"
        answer:
          type: choice
          options:
            - id: keep-both
              text:
                uk: "Лишити обидва: валідація дає людині зрозумілу помилку 400 зі списком полів, а `CHECK` захищає дані й від шляхів повз сервер"
                en: "Keep both: validation gives the person a clear 400 error with the list of fields, and the `CHECK` protects the data from paths that bypass the server too"
            - id: drop-validation
              text:
                uk: "Прибрати валідацію: база все одно відхилить погане значення"
                en: "Drop the validation: the database refuses a bad value anyway"
              why:
                uk: "База зупиниться на першому порушенні й поверне технічний текст, а не список помилок полів. До того ж валідація відкидає те, чого `CHECK` не бачить: зайві поля, неправильні типи."
                en: "The database stops at the first violation and returns a technical text, not a list of field errors. Besides, validation rejects what a `CHECK` cannot see: unknown fields, wrong types."
            - id: drop-check
              text:
                uk: "Прибрати `CHECK`: сервер уже перевіряє кожен запит"
                en: "Drop the `CHECK`: the server already validates every request"
              why:
                uk: "Сервер бачить лише запити. Скрипт імпорту, міграція чи помилка в коді записують у таблицю повз валідацію — і їх зупинить лише обмеження."
                en: "The server sees only requests. An import script, a migration or a bug in the code writes to the table around the validation — and only the constraint stops them."
          correct: [keep-both]
        explanation:
          uk: "Валідація на вході — для людини й контракту API; обмеження таблиці — для цілісності даних на будь-якому шляху. Вони не дублюють, а доповнюють одне одного."
          en: "Validation at the edge serves the person and the API contract; a table constraint serves data integrity on every path. They complement each other rather than duplicate."

  - id: return-book
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: return-book
    entry: index.js
    editable: [app.js]
    strings:
      marta: { uk: "Марта", en: "Marta" }
      oleh: { uk: "Олег", en: "Oleh" }
      lighthouse: { uk: "Маяк на скелі", en: "The lighthouse on the rock" }
      garden: { uk: "Сад на даху", en: "A garden on the roof" }
    title:
      uk: "Повернення книжки"
      en: "Returning a book"
    instructions:
      uk: |
        У `app.js` є опис таблиці `loansTable` і функція `returnBook(db, loanId, returnedOn)`. Зараз повторне повернення перезаписує дату, а таблиця приймає дату повернення, що раніша за дату видачі. Виправ обидва:

        - `returnBook` записує `returnedOn` лише у видачу із цим `id`, і лише якщо вона ще відкрита;
        - `returnBook` повертає кількість змінених рядків: `1` для відкритої видачі, `0` для вже поверненої;
        - таблиця відхиляє `returnedOn`, раніший за `loanedOn`, але приймає відкриту видачу з `returnedOn` `NULL`.

        Дати — текст `'YYYY-MM-DD'`, тож порівняння тексту збігається з порівнянням дат.
      en: |
        `app.js` has the table description `loansTable` and the function `returnBook(db, loanId, returnedOn)`. Right now a second return overwrites the date, and the table accepts a return date before the loan date. Fix both:

        - `returnBook` writes `returnedOn` only into the loan with that `id`, and only while it is still open;
        - `returnBook` returns how many rows changed: `1` for an open loan, `0` for one already returned;
        - the table refuses a `returnedOn` earlier than `loanedOn`, but accepts an open loan with `returnedOn` `NULL`.

        Dates are text `'YYYY-MM-DD'`, so comparing the text matches comparing the dates.
    testTitles:
      "returning an open loan sets the date and returns 1":
        uk: "Повернення відкритої видачі записує дату й повертає 1"
        en: "Returning an open loan sets the date and returns 1"
      "returning a loan that is already returned changes nothing and returns 0":
        uk: "Повторне повернення нічого не змінює й повертає 0"
        en: "Returning a loan that is already returned changes nothing and returns 0"
      "only the loan with that id changes":
        uk: "Змінюється лише видача із цим `id`"
        en: "Only the loan with that `id` changes"
      "the table refuses a return date before the loan date":
        uk: "Таблиця відхиляє дату повернення, ранішу за дату видачі"
        en: "The table refuses a return date before the loan date"
      "the table still accepts an open loan with returnedOn NULL":
        uk: "Таблиця й далі приймає відкриту видачу з `returnedOn` `NULL`"
        en: "The table still accepts an open loan with `returnedOn` `NULL`"
    hints:
      nudge:
        uk: "Яка ще умова, окрім `id`, відрізняє видачу, яку можна повернути? І що станеться з `CHECK`, коли одне зі значень — `NULL`?"
        en: "Which condition, besides the `id`, marks a loan that can be returned? And what happens to a `CHECK` when one of the values is `NULL`?"
      explanation:
        uk: |
          Умови в `WHERE` поєднують через `AND`. Для «значення ще немає» є лише `IS NULL`. Для порівняння двох стовпців одного рядка пишуть `CHECK` на рівні таблиці — наприклад, для бронювань: `CHECK (endsOn >= startsOn)`.

          `CHECK` відхиляє рядок, лише коли умова **false**. Якщо одне зі значень `NULL`, порівняння дає unknown — і рядок проходить. Тож окремо дозволяти `NULL` не обов’язково, а от вимога `IS NOT NULL` усередині `CHECK` заборонила б відкриті видачі.
        en: |
          Conditions in `WHERE` are combined with `AND`. For “no value yet” there is only `IS NULL`. To compare two columns of one row, write a table-level `CHECK` — for example, for bookings: `CHECK (endsOn >= startsOn)`.

          A `CHECK` refuses a row only when the condition is **false**. If one of the values is `NULL`, the comparison gives unknown — and the row goes through. So you need not allow `NULL` separately, while requiring `IS NOT NULL` inside the `CHECK` would forbid open loans.
    solutionNote:
      uk: "`WHERE id = ? AND returnedOn IS NULL` змінює лише відкриту видачу, а `changes` чесно каже, чи це сталося. `CHECK (returnedOn >= loanedOn)` відхиляє ранішу дату, а для `NULL` дає unknown і рядок пропускає. Варіант `CHECK (returnedOn IS NULL OR returnedOn >= loanedOn)` теж правильний і пише цей намір явно."
      en: "`WHERE id = ? AND returnedOn IS NULL` changes only an open loan, and `changes` honestly says whether it happened. `CHECK (returnedOn >= loanedOn)` refuses an earlier date and, for `NULL`, gives unknown and lets the row through. The version `CHECK (returnedOn IS NULL OR returnedOn >= loanedOn)` is correct too and spells that intent out."
    feedback:
      - when: { test: "returning an open loan sets the date and returns 1" }
        message:
          uk: "Ця перевірка повертає відкриту видачу 2 й очікує результат `1` та дату в `returnedOn`. Якщо результат `0`, перевір умову про відкриту видачу: порівняння `= NULL` не буває true."
          en: "This check returns open loan 2 and expects the result `1` and the date in `returnedOn`. If the result is `0`, check the open-loan condition: a comparison `= NULL` is never true."
      - when: { test: "returning a loan that is already returned changes nothing and returns 0" }
        message:
          uk: "Ця перевірка повертає видачу 1, уже повернену 2026-03-08, й очікує `0` і незмінну дату. Онови рядок, лише поки `returnedOn` порожній."
          en: "This check returns loan 1, already returned on 2026-03-08, and expects `0` and the date unchanged. Update the row only while `returnedOn` is empty."
      - when: { test: "only the loan with that id changes" }
        message:
          uk: "Ця перевірка повертає видачу 2 й очікує, що видача 3 лишиться відкритою. `WHERE` має обмежувати і `id`, і стан видачі."
          en: "This check returns loan 2 and expects loan 3 to stay open. `WHERE` must restrict both the `id` and the loan’s state."
      - when: { test: "the table refuses a return date before the loan date" }
        message:
          uk: "Ця перевірка записує у видачу 3 (видана 2026-03-04) дату 2026-02-01 й очікує помилку `CHECK constraint failed`. Додай `CHECK` у `loansTable`."
          en: "This check writes 2026-02-01 into loan 3 (loaned on 2026-03-04) and expects the error `CHECK constraint failed`. Add a `CHECK` to `loansTable`."
      - when: { test: "the table still accepts an open loan with returnedOn NULL" }
        message:
          uk: "Ця перевірка вставляє видачу з `returnedOn` `NULL` й очікує, що вона пройде. Якщо `CHECK` вимагає `IS NOT NULL`, відкритих видач більше не буде."
          en: "This check inserts a loan with `returnedOn` `NULL` and expects it to go through. If the `CHECK` requires `IS NOT NULL`, there can be no open loans."

  - id: to-project
    kind: transfer
    checkpoint: CP-NO
    body:
      uk: "У цьому розділі проєкт не змінюється: кроку проєкту в NO-09 немає. Але правила твого домену — назва від 1 до 80 символів, невід’ємна ціна чи сума, пріоритет із трьох значень — уже записані у валідації. Якщо в NO-05 за планом курсу обереш SQLite, ті самі правила стануть `NOT NULL` і `CHECK` у таблиці, а поле «ще не задано» — `NULL`, який шукають через `IS NULL`."
      en: "Your project does not change in this unit: NO-09 has no project step. But your domain’s rules — a name of 1 to 80 characters, a non-negative price or amount, a priority of three values — are already written in the validation. If you choose SQLite in NO-05, as the course plan offers, the same rules become `NOT NULL` and `CHECK` in the table, and a field “not set yet” becomes a `NULL` found with `IS NULL`."
