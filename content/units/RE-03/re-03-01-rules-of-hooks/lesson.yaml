id: re-03-01-rules-of-hooks
unit: RE-03
title:
  uk: "Правила хуків"
  en: "Rules of hooks"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Назвати два правила хуків (викликати їх лише на верхньому рівні; лише з компонентів або власних хуків) і знаходити порушення в коді."
    en: "State the two rules of hooks (call them at the top level only; call them only from components or custom hooks) and spot violations in code."
  - uk: "Пояснити, як React на кожному рендері зіставляє виклики хуків зі збереженим станом — за порядком викликів."
    en: "Explain how React matches hook calls to their stored state by call order on every render."
prerequisites: [re-02-01-state-and-events, re-02-07-reset-preserve-identity]
subskills:
  - { family: R-04, skill: "rules of hooks", depth: intro }
glossary: [react-hook, rules-of-hooks]
selfCheck: [predict-shifted-slot, habit-board]

blocks:
  - id: slots-by-order
    kind: explanation
    title:
      uk: "Як React знаходить твій стан"
      en: "How React finds your state"
    body:
      uk: |
        `useState` — це [[react-hook|хук]]: функція React, назва якої починається з `use`. Хук дає компоненту щось, що живе **між рендерами**, — наприклад, стан.

        Але де React тримає цей стан? Не в змінній `wishes` і не за її назвою: назв змінних React узагалі не бачить. Для кожного компонента на сторінці він веде **список комірок**, а на кожному рендері роздає їх **за порядком викликів**:

        ```jsx
        const [wishes, setWishes] = useState(WISHES); // виклик 1 → комірка 1
        const [filter, setFilter] = useState("all");  // виклик 2 → комірка 2
        const [draft, setDraft] = useState("");       // виклик 3 → комірка 3
        ```

        Перший виклик `useState` отримує комірку 1, другий — комірку 2, і так щоразу. Поки порядок викликів однаковий на кожному рендері, усе збігається. А що буде, якщо якийсь виклик на одному з рендерів пропустити?
      en: |
        `useState` is a [[react-hook|hook]]: a React function whose name starts with `use`. A hook gives a component something that lives **between renders** — state, for example.

        But where does React keep that state? Not in the variable `wishes` and not under its name: React never sees variable names at all. For each component on the page it keeps a **list of slots**, and on every render it hands them out **by call order**:

        ```jsx
        const [wishes, setWishes] = useState(WISHES); // call 1 → slot 1
        const [filter, setFilter] = useState("all");  // call 2 → slot 2
        const [draft, setDraft] = useState("");       // call 3 → slot 3
        ```

        The first `useState` call gets slot 1, the second gets slot 2, every time. As long as the order of calls is the same on every render, everything matches. What happens if a call is skipped on one of the renders?

  - id: predict-shifted-slot
    kind: prediction
    strings:
      clear: { uk: "Очистити", en: "Clear" }
    prompt:
      uk: "На першому рендері задач дві, тож у консолі `filter: all`. Потім натискають кнопку, і задач стає нуль. Що надрукує другий рендер і що станеться далі?"
      en: "On the first render there are two tasks, so the console shows `filter: all`. Then the button is pressed and there are no tasks left. What does the second render print, and what happens next?"
    code: |
      function TaskBoard() {
        const [tasks, setTasks] = useState(["t-01", "t-02"]);
        if (tasks.length > 0) {
          const [expanded, setExpanded] = useState(false);
        }
        const [filter, setFilter] = useState("all");
        console.log("filter:", filter);
        return <button onClick={() => setTasks([])}>%%clear%%</button>;
      }
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: shifted
          text:
            uk: "`filter: false` — а потім React зупиняється з помилкою про кількість хуків"
            en: "`filter: false` — and then React stops with an error about the number of hooks"
        - id: by-name
          text:
            uk: "`filter: all` — React знаходить стан `filter` за його назвою, а пропущений хук просто ігнорує"
            en: "`filter: all` — React finds the `filter` state by its name and simply ignores the skipped hook"
          why:
            uk: "React не бачить назв змінних. Без хука в `if` виклик `useState(\"all\")` став **другим**, а друга комірка зберігає `false` — значення `expanded`."
            en: "React does not see variable names. Without the hook inside `if`, the call `useState(\"all\")` became the **second** call, and the second slot holds `false` — the value of `expanded`."
        - id: fresh-all
          text:
            uk: "`filter: all` — пропущений хук скидає стан, і все починається спочатку"
            en: "`filter: all` — the skipped hook resets the state and everything starts over"
          why:
            uk: "Початкове значення `useState(\"all\")` використовується лише на першому рендері. Далі React віддає те, що лежить у комірці за номером виклику, — тут це `false`."
            en: "The initial value of `useState(\"all\")` is used only on the first render. After that React returns whatever is in the slot with that call number — here it is `false`."
        - id: error-first
          text:
            uk: "Нічого не надрукує: React помітить хук в `if` ще до запуску функції компонента"
            en: "Nothing is printed: React notices the hook inside `if` before it runs the component function"
          why:
            uk: "React не читає код компонента наперед — він лише викликає функцію. Тому `console.log` встигає виконатися, а невідповідність React помічає вже після того, як функція повернула результат."
            en: "React does not read the component's code ahead of time — it just calls the function. So `console.log` runs, and React notices the mismatch only after the function has returned."
      correct: [shifted]
    explanation:
      uk: "На другому рендері виклик у `if` пропущено, тож `useState(\"all\")` — тепер **другий** виклик і отримує другу комірку, де лежить `false` від `expanded`. Функція доходить до кінця й друкує `filter: false`. Потім React бачить, що хуків викликано менше, ніж минулого разу, і зупиняється з помилкою `Rendered fewer hooks than expected` — компонент зникає зі сторінки. Перевірено в пісочниці з React 19.3: у консолі `filter: all`, потім двічі `filter: false` (React пробує відрендерити ще раз, перш ніж здатися) і картка помилки."
      en: "On the second render the call inside `if` is skipped, so `useState(\"all\")` is now the **second** call and gets the second slot, which holds `false` from `expanded`. The function runs to the end and prints `filter: false`. Then React sees that fewer hooks were called than last time and stops with the error `Rendered fewer hooks than expected` — the component disappears from the page. Checked in the sandbox with React 19.3: the console shows `filter: all`, then `filter: false` twice (React tries to render once more before giving up) and the error card."

  - id: conditional-hook
    kind: example
    runtime: browser-react
    dir: conditional-hook
    entry: main.jsx
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      pricesShown: { uk: "ціни показано", en: "prices shown" }
      pricesHidden: { uk: "показати ціни", en: "show prices" }
      note: { uk: "Нотатка: подарунки до свят", en: "Note: holiday gifts" }
      heading: { uk: "Мої бажання", en: "My wishes" }
      removeFirst: { uk: "Прибрати перше", en: "Remove the first" }
    title:
      uk: "Хук в умові: запусти й зламай"
      en: "A hook inside a condition: run it and break it"
    body:
      uk: |
        `main.jsx` лише показує компонент `WishList` з `App.jsx` у `<div id="root">`. У `WishList` хук-перемикач цін сидить усередині `if (wishes.length > 0)`, а нижче є ще один стан — `note`.

        Натисни **Запустити**, а потім на вкладці **Сторінка** двічі **Прибрати перше**. Відкрий **Консоль**: після другого кліку бажань нуль, `if` не виконується, і `note` отримує чужу комірку — у рядку `render:` замість тексту нотатки стоїть `false`.

        Одразу після цього React зупиняється, а сторінка стає порожньою. У консолі видно дві речі:

        - попередження React, що починається із `%s` і каже `An error occurred in the <WishList> component` — `%s` тут просто незаповнені місця для тексту, на них не зважай;
        - картку «Помилка під час виконання» з оригінальним повідомленням `Error: Rendered fewer hooks than expected`. Місце в картці вказує на внутрішній файл React `react-dom-client.js`: помилку помітив React, а причина — у порядку хуків у твоєму `App.jsx`.
      en: |
        `main.jsx` only shows the `WishList` component from `App.jsx` in `<div id="root">`. In `WishList` the price toggle hook sits inside `if (wishes.length > 0)`, and below it there is one more state, `note`.

        Press **Run**, then on the **Page** tab press **Remove the first** twice. Open the **Console**: after the second click there are no wishes, the `if` does not run, and `note` gets someone else's slot — the `render:` line shows `false` instead of the note's text.

        Right after that React stops and the page goes blank. The console shows two things:

        - a React warning that starts with `%s` and says `An error occurred in the <WishList> component` — the `%s` marks are just unfilled places for text, ignore them;
        - the card “Error while running” with the original message `Error: Rendered fewer hooks than expected`. The place on the card points to React's internal file `react-dom-client.js`: React noticed the error, but the cause is the order of hooks in your `App.jsx`.
    tryIt:
      uk: |
        Відкрий вкладку `App.jsx` і виправ компонент так, щоб хук викликався **завжди**, а умова переїхала в JSX:

        1. Перенеси рядок `const [showPrices, setShowPrices] = useState(false);` на верхній рівень — одразу під `useState(WISHES)`.
        2. Прибери змінну `priceToggle` і блок `if`, а в JSX на місці `{priceToggle}` напиши `{wishes.length > 0 && (` … `)}` з тим самим `<label>` усередині.

        Запусти знову й прибери обидва бажання: тепер у кожному рядку `render:` нотатка залишається собою, а замість помилки сторінка показує порожній список.
      en: |
        Open the `App.jsx` tab and fix the component so that the hook is called **always**, and the condition moves into the JSX:

        1. Move the line `const [showPrices, setShowPrices] = useState(false);` to the top level — right below `useState(WISHES)`.
        2. Remove the `priceToggle` variable and the `if` block, and in the JSX, in place of `{priceToggle}`, write `{wishes.length > 0 && (` … `)}` with the same `<label>` inside.

        Run it again and remove both wishes: now every `render:` line keeps the note as it is, and instead of an error the page shows an empty list.

  - id: hook-slots
    kind: visual
    visual: diagram
    title:
      uk: "Комірки хуків роздаються за порядком викликів"
      en: "Hook slots are handed out by call order"
    textEquivalent:
      uk: >-
        React зберігає стан компонента WishList у трьох комірках. На першому рендері бажання є, тож
        виконуються всі три виклики useState: виклик 1 отримує комірку 1 зі списком бажань, виклик 2
        у блоці if — комірку 2 зі значенням false для showPrices, виклик 3 — комірку 3 з текстом
        нотатки. Коли бажань стає нуль, блок if не виконується. Тепер виклик useState для note —
        лише другий за рахунком, тож React віддає йому комірку 2, де лежить false. Третя комірка
        лишається незатребуваною: викликів стало два замість трьох, і React зупиняється з помилкою
        Rendered fewer hooks than expected. Виправлення — викликати всі три хуки на кожному рендері,
        а умову перенести в JSX.
      en: >-
        React keeps the state of the WishList component in three slots. On the first render there are
        wishes, so all three useState calls run: call 1 gets slot 1 with the list of wishes, call 2
        inside the if block gets slot 2 with false for showPrices, and call 3 gets slot 3 with the note
        text. When no wishes are left, the if block does not run. Now the useState call for note is
        only the second call, so React hands it slot 2, which holds false. The third slot is left
        unclaimed: there are two calls instead of three, and React stops with the error Rendered fewer
        hooks than expected. The fix is to call all three hooks on every render and move the condition
        into the JSX.
    spec:
      layout: grid
      groups:
        - { id: calls, label: { uk: "Виклики в рендері", en: "Calls in the render" } }
        - { id: stored, label: { uk: "Комірки React", en: "React's slots" } }
      nodes:
        - { id: call-wishes, group: calls, label: "useState(WISHES)", col: 0, row: 0, w: 140 }
        - { id: call-prices, group: calls, label: "if → useState()", col: 0, row: 1, w: 140 }
        - { id: call-note, group: calls, label: "useState(note)", col: 0, row: 2, w: 140 }
        - { id: slot-1, group: stored, label: { uk: "1: бажання", en: "1: wishes" }, col: 1, row: 0, w: 140 }
        - { id: slot-2, group: stored, label: "2: false", col: 1, row: 1, w: 140 }
        - { id: slot-3, group: stored, label: { uk: "3: нотатка", en: "3: note" }, col: 1, row: 2, w: 140 }
      edges:
        - { id: first-1, from: call-wishes, to: slot-1 }
        - { id: first-2, from: call-prices, to: slot-2 }
        - { id: first-3, from: call-note, to: slot-3 }
        - { id: shifted, from: call-note, to: slot-2, kind: dashed }
      hidden: [shifted]
      steps:
        - caption:
            uk: "Рендер 1, бажання є: три виклики `useState` по черзі отримують комірки 1, 2 і 3."
            en: "Render 1, there are wishes: three `useState` calls receive slots 1, 2 and 3 in turn."
          highlight: [call-wishes, call-prices, call-note, slot-1, slot-2, slot-3, first-1, first-2, first-3]
        - caption:
            uk: "Бажань нуль: блок `if` не виконується, виклику `useState(false)` цього разу немає."
            en: "No wishes left: the `if` block does not run, so there is no `useState(false)` call this time."
          highlight: [call-wishes, slot-1, first-1]
          dim: [call-prices, first-2, first-3]
        - caption:
            uk: "`useState(note)` тепер — **другий** виклик. React віддає йому комірку 2 і повертає `false` замість тексту нотатки."
            en: "`useState(note)` is now the **second** call. React hands it slot 2 and returns `false` instead of the note text."
          show: [shifted]
          highlight: [call-note, slot-2, shifted]
          dim: [call-prices, first-2, first-3, slot-3]
          annotate:
            - { id: slot-3, text: { uk: "нікому не дісталася", en: "nobody claimed it" } }
        - caption:
            uk: "Викликів два, а комірок три — React зупиняється з помилкою `Rendered fewer hooks than expected`. Правильно: усі три виклики на кожному рендері, умова — у JSX."
            en: "Two calls, three slots — React stops with the error `Rendered fewer hooks than expected`. The fix: all three calls on every render, the condition in the JSX."
          highlight: [slot-3]
          dim: [call-prices, first-2, first-3]

  - id: two-rules
    kind: explanation
    title:
      uk: "Два правила хуків"
      en: "The two rules of hooks"
    body:
      uk: |
        Із комірок за порядком випливають [[rules-of-hooks|правила хуків]]:

        1. **Викликай хуки лише на верхньому рівні компонента**, до будь-якого `return`. Не всередині `if`, циклу, вкладеної функції чи обробника події і не після раннього `return`. Тоді на кожному рендері виклики йдуть тим самим порядком.
        2. **Викликай хуки лише з функцій-компонентів** (або з власних хуків — функцій на `use…`, які ти писатимеш у RE-04). Звичайна функція чи обробник кліку не має своїх комірок.

        Умова, яка потрібна, переїжджає **всередину**: хук викликається завжди, а в JSX ти вирішуєш, що показати. Якщо стан потрібен кожному рядку списку, винеси рядок в окремий компонент — у кожного його екземпляра свої комірки.

        Це не питання стилю: порушення ламає стан, як ти щойно бачив. Тому в проєктах React правило перевіряє лінтер `eslint-plugin-react-hooks` і позначає порушення як **error**. Ось що він надрукував для хука в `if` (версія 7.1.1):

        ```text
        error  React Hook "useState" is called conditionally. React Hooks must be called in the exact same order in every component render  react-hooks/rules-of-hooks
        ```

        Для циклу він пише `may be executed more than once. Possibly because it is called in a loop`. Хук після раннього `return` отримує ту саму помилку `is called conditionally`; у короткому компоненті лінтер ще й додає підказку `Did you accidentally call a React Hook after an early return?`, а в довшому (як у вправі нижче) — ні.
      en: |
        Slots by order give us the [[rules-of-hooks|rules of hooks]]:

        1. **Call hooks only at the top level of a component**, before any `return`. Not inside an `if`, a loop, a nested function or an event handler, and not after an early `return`. Then the calls come in the same order on every render.
        2. **Call hooks only from function components** (or from custom hooks — `use…` functions you will write in RE-04). A plain function or a click handler has no slots of its own.

        A condition you need moves **inside**: the hook is always called, and in the JSX you decide what to show. If every row of a list needs state, move the row into its own component — every instance of it has its own slots.

        This is not a matter of style: breaking the rule breaks state, as you just saw. That is why React projects check the rule with the `eslint-plugin-react-hooks` linter, which reports violations as **errors**. This is what it printed for a hook inside an `if` (version 7.1.1):

        ```text
        error  React Hook "useState" is called conditionally. React Hooks must be called in the exact same order in every component render  react-hooks/rules-of-hooks
        ```

        For a loop it says `may be executed more than once. Possibly because it is called in a loop`. A hook after an early `return` gets the same `is called conditionally` error; in a short component the linter also adds the hint `Did you accidentally call a React Hook after an early return?`, in a longer one (like the exercise below) it does not.

  - id: habit-board
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: habit-board
    entry: main.jsx
    editable: [App.jsx]
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      empty: { uk: "Звичок поки немає.", en: "No habits yet." }
      doneTimes: { uk: "виконано разів:", en: "times done:" }
      remove: { uk: "Прибрати", en: "Remove" }
      heading: { uk: "Мої звички", en: "My habits" }
      showPaused: { uk: "Показати призупинені", en: "Show paused" }
      showActive: { uk: "Показати активні", en: "Show active" }
      clearAll: { uk: "Прибрати всі", en: "Remove all" }
    title:
      uk: "Дошка звичок без умовних хуків"
      en: "A habit board without conditional hooks"
    instructions:
      uk: |
        Компонент `HabitBoard` у `App.jsx` показує звички й порушує правила хуків двічі: `useState` стоїть після раннього `return` і всередині циклу `for`. Поки нічого не змінюєш, він працює; але прибери одну звичку чи перемкни фільтр — і React зупиниться з помилкою.

        Перепиши компонент так, щоб **кожен хук викликався на кожному рендері**, а поведінка лишилася тією самою:

        - список показує активні звички; кнопка-фільтр перемикає на призупинені й назад;
        - клік на назві звички відкриває **лише її** рядок із числом виконань;
        - **Прибрати** прибирає звичку, **Прибрати всі** показує «Звичок поки немає.».

        Перевірки показують окрему копію дошки для кожного сценарію й кажуть, яку помилку повідомив React, якщо він зупинився.
      en: |
        The `HabitBoard` component in `App.jsx` shows habits and breaks the rules of hooks twice: `useState` comes after an early `return` and inside a `for` loop. As long as nothing changes, it works; but remove a habit or switch the filter and React stops with an error.

        Rewrite the component so that **every hook is called on every render**, and the behavior stays the same:

        - the list shows the active habits; the filter button switches to the paused ones and back;
        - a click on a habit's name opens **only its** row with the number of completions;
        - **Remove** removes a habit, **Remove all** shows “No habits yet.”.

        The checks render a separate copy of the board for each scenario and say which error React reported if it stopped.
    testTitles:
      "the board shows the active habits":
        uk: "Дошка показує активні звички"
        en: "The board shows the active habits"
      "each habit opens its own details":
        uk: "Кожна звичка відкриває лише свої подробиці"
        en: "Each habit opens only its own details"
      "removing a habit keeps the board working":
        uk: "Після прибирання звички дошка працює далі"
        en: "The board keeps working after a habit is removed"
      "the filter switches between active and paused habits":
        uk: "Фільтр перемикає активні й призупинені звички"
        en: "The filter switches between active and paused habits"
      "clearing every habit shows the empty message":
        uk: "Після «Прибрати всі» видно повідомлення про порожній список"
        en: "After “Remove all” the empty message is shown"
    hints:
      nudge:
        uk: "Знайди кожен `useState`, перед яким може статися `return` або який може виконатися інше число разів. Скільки викликів хуків буде, коли звичок 3, 2 і 0?"
        en: "Find every `useState` that may be preceded by a `return` or may run a different number of times. How many hook calls are there when there are 3, 2 and 0 habits?"
      explanation:
        uk: |
          Ранній `return` може лишитися, але всі хуки мають стояти **вище** за нього. Стан, якого потребує кожен рядок, не можна створювати в циклі: число рядків змінюється. Два способи: винести рядок в окремий компонент — тоді кожен рядок викликає свій хук сам, по одному разу; або тримати один стан на всю дошку — наприклад, масив id відкритих рядків.

          Схожий приклад з іншої теми: замість `for (const task of tasks) { const [done] = useState(false); }` пишуть `function TaskRow({ task }) { const [done, setDone] = useState(false); … }` і рендерять `tasks.map((task) => <TaskRow key={task.id} task={task} />)`.
        en: |
          The early `return` can stay, but all hooks must come **above** it. State that every row needs cannot be created in a loop: the number of rows changes. Two ways out: move the row into its own component — then each row calls its own hook once; or keep one state for the whole board — for example, an array of the ids of open rows.

          A similar example from another topic: instead of `for (const task of tasks) { const [done] = useState(false); }` you write `function TaskRow({ task }) { const [done, setDone] = useState(false); … }` and render `tasks.map((task) => <TaskRow key={task.id} task={task} />)`.
    solutionNote:
      uk: "`useState` для фільтра стоїть до раннього `return`, тож на кожному рендері `HabitBoard` викликає два хуки. Стан «відкрито» живе в компоненті `HabitRow`: кожен рядок — окремий екземпляр зі своєю коміркою, і `key={habit.id}` прив’язує її до звички. Підійде й один стан `openIds` на всю дошку."
      en: "The `useState` for the filter comes before the early `return`, so `HabitBoard` calls two hooks on every render. The “open” state lives in the `HabitRow` component: every row is a separate instance with its own slot, and `key={habit.id}` ties it to the habit. One `openIds` state for the whole board works too."
    feedback:
      - when: { test: "the board shows the active habits" }
        message:
          uk: "Ця перевірка очікує на першому показі три активні звички в порядку з `habits.js` — назва кожної на першій кнопці рядка — і жодної помилки React."
          en: "This check expects three active habits in the order of `habits.js` on the first display — each name on the first button of its row — and no React error."
      - when: { test: "each habit opens its own details" }
        message:
          uk: "Ця перевірка клікає назву «Читати 20 хвилин» і очікує в її рядку «виконано разів: 3», а в рядку «Ранкова зарядка» — нічого про виконання."
          en: "This check clicks the name “Read for 20 minutes” and expects “times done: 3” in its row and nothing about completions in the “Morning exercise” row."
      - when: { test: "removing a habit keeps the board working" }
        message:
          uk: "Ця перевірка прибирає «Ранкова зарядка» й очікує дві звички, які лишилися, без помилки React. Якщо React повідомив `Rendered fewer hooks than expected`, на якомусь рендері хуків викликалося менше — шукай хук у циклі."
          en: "This check removes “Morning exercise” and expects the two remaining habits, without a React error. If React reported `Rendered fewer hooks than expected`, some render called fewer hooks — look for a hook inside a loop."
      - when: { test: "the filter switches between active and paused habits" }
        message:
          uk: "Ця перевірка перемикає на призупинені (очікує лише «Вчити англійські слова») і назад (три активні). Кількість рядків при цьому змінюється — хук, викликаний для кожного рядка в циклі, цього не витримає."
          en: "This check switches to the paused habits (expects only “Learn English words”) and back (the three active ones). The number of rows changes along the way — a hook called for every row in a loop cannot survive that."
      - when: { test: "clearing every habit shows the empty message" }
        message:
          uk: "Ця перевірка натискає «Прибрати всі» й очікує «Звичок поки немає.» без помилки React. Якщо React повідомив `Rendered fewer hooks than expected`, якийсь хук стоїть **після** раннього `return` або викликається в циклі для кожного рядка."
          en: "This check presses “Remove all” and expects “No habits yet.” without a React error. If React reported `Rendered fewer hooks than expected`, some hook comes **after** the early `return` or is called in a loop for every row."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: у JSX щось не закрито. Подивись на рядок, який називає картка, — найчастіше це дужка `)` після `.map(...)` або незакритий тег."
          en: "The code could not start: something in the JSX is not closed. Look at the line the card names — most often it is the `)` after `.map(...)` or an unclosed tag."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    strings:
      lamp: { uk: "лампа", en: "lamp" }
    items:
      - id: value-by-position
        from: js-04-01-arrays-basics
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const slots = ["%%lamp%%", false, "all"];
          const secondCall = 2;
          console.log(slots[secondCall - 1], slots[3]);
        verify:
          logs: ["false undefined"]
        answer:
          type: choice
          options:
            - id: false-undefined
              text: { uk: "`false undefined`", en: "`false undefined`" }
            - id: lamp-all
              text: { uk: "`лампа all`", en: "`lamp all`" }
              why:
                uk: "Так було б, якби позиції рахувалися з 1. У JavaScript перша комірка — `slots[0]`, тож `slots[1]` — друге значення, `false`."
                en: "That would be true if positions were counted from 1. In JavaScript the first slot is `slots[0]`, so `slots[1]` is the second value, `false`."
            - id: false-all
              text: { uk: "`false all`", en: "`false all`" }
              why:
                uk: "У масиві три значення, тож останній індекс — 2. Комірки `slots[3]` немає."
                en: "The array has three values, so the last index is 2. There is no slot `slots[3]`."
            - id: range-error
              text: { uk: "`false`, а потім помилка: індексу 3 немає", en: "`false`, then an error: there is no index 3" }
              why:
                uk: "Читання за межами масиву не зупиняє програму — воно дає `undefined`."
                en: "Reading outside the array does not stop the program — it gives `undefined`."
          correct: [false-undefined]
        explanation:
          uk: "Позиції рахуються з 0: другий виклик читає `slots[1]`, а там `false`. Комірки з індексом 3 немає, тож `slots[3]` дає `undefined`, без помилки. Так само React роздає комірки хуків: за номером виклику, а не за тим, кому комірка належала минулого разу."
          en: "Positions are counted from 0: the second call reads `slots[1]`, which holds `false`. There is no slot with index 3, so `slots[3]` gives `undefined`, without an error. React hands out hook slots the same way: by call number, not by whom the slot belonged to last time."

  - id: to-project
    kind: transfer
    capstoneStep: RE-03
    body:
      uk: "Наприкінці розділу ти додаси у свій проєкт ефект, що зберігає список записів. Перед цим перевір компоненти проєкту: кожен `useState` має стояти на верхньому рівні, до будь-якого `return`, і жоден — у циклі чи умові."
      en: "At the end of this unit you will add an effect to your project that saves the list of records. Before that, check the project's components: every `useState` must sit at the top level, before any `return`, and none inside a loop or a condition."
