id: re-03-08-independent-persistence-sync
unit: RE-03
title:
  uk: "Самостійно: синхронізація зі сховищем без дублів"
  en: "Independent: persistence sync without duplicates"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Перевірка без підказок: чи вмієш ти сам розкласти логіку по трьох місцях — збережений список прочитати один раз як початкове значення з перевіркою, синхронізувати його зі сховищем одним ефектом із повними залежностями, а підсумок обчислювати під час рендеру, — так, щоб StrictMode не створив жодного дубля, а пошкоджені дані не зламали застосунок."
  en: "A check without hints: can you sort logic into its three homes on your own — read the stored list once as a validated initial value, synchronize it with storage through one effect with complete dependencies, and compute the summary during render — so that StrictMode creates no duplicate and damaged data does not break the app?"
objectives:
  - uk: "Самостійно реалізувати збереження типізованого списку записів в ізольоване сховище через один ефект із перевіреним початковим читанням і повними залежностями — без дублів у StrictMode і без ефекту там, де пасує обробник події чи похідне значення."
    en: "Implement, without hints, persistence of a typed record list to isolated storage through one effect with a validating initial read and complete dependencies, with no duplicate writes under StrictMode and no effect where an event handler or a derived value fits."
prerequisites: [re-03-07-debug-stale-duplicate-effects]
subskills:
  - { family: R-04, skill: "synchronization vs events/derived values", depth: assess }
glossary: []
selfCheck: [expense-store]

blocks:
  - id: expense-store
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-react
    dir: expense-store
    entry: main.jsx
    editable: [App.jsx]
    strings:
      food: { uk: "Їжа", en: "Food" }
      transport: { uk: "Транспорт", en: "Transport" }
      home: { uk: "Дім", en: "Home" }
      fun: { uk: "Розваги", en: "Fun" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      lunch: { uk: "Обід", en: "Lunch" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      heading: { uk: "Мої витрати", en: "My expenses" }
      labelField: { uk: "Назва", en: "Label" }
      amountField: { uk: "Сума", en: "Amount" }
      categoryField: { uk: "Категорія", en: "Category" }
      add: { uk: "Додати", en: "Add" }
      invalid: { uk: "Перевір назву й суму.", en: "Check the label and the amount." }
      remove: { uk: "Прибрати", en: "Remove" }
      total: { uk: "Разом:", en: "Total:" }
    title:
      uk: "Трекер витрат, що пам’ятає список"
      en: "An expense tracker that remembers its list"
    instructions:
      uk: |
        `ExpenseTracker` уже вміє додавати й прибирати витрати, але після кожного запуску починає з тих самих трьох записів. Модуль `expenses.js` (лише для читання) дає `STORAGE_KEY`, `DEFAULT_EXPENSES`, `validateExpense`, `summarizeExpenses` та інші функції. `main.jsx` показує застосунок у `<StrictMode>`. Підказок у цьому завданні немає.

        Зміни `App.jsx` так, щоб:

        1. **Початкове читання.** Список, збережений під `STORAGE_KEY`, читається **один раз**, до першого показу. Збережене значення має вигляд `{ schemaVersion: 1, records: [...] }`.
           - Якщо під ключем нічого немає, текст — не JSON, `schemaVersion` не дорівнює `1` або `records` — не масив, застосунок показує `DEFAULT_EXPENSES` і не падає.
           - Інакше показуються лише записи, які проходять `validateExpense` (у вигляді `value`, який вона повертає), у збереженому порядку — навіть якщо таких не лишилося жодного.
        2. **Синхронізація.** Після кожної зміни списку під `STORAGE_KEY` лежить `{ schemaVersion: 1, records }` з **усім** поточним списком — і після монтування теж. Подвійне монтування в StrictMode не дублює жодного запису й не змінює жодного поля; монтування не записує нічого, крім відновленого списку.
        3. **Нічого зайвого.** Підсумок «Разом» відповідає поточному списку на кожному показі. Монтування, надсилання форми й прибирання дають **по одному** commit — жодного ефекту, що лише копіює чи перераховує стан.

        Приховані перевірки монтують окремі копії (в `<StrictMode>`, крім перевірки commit), заздалегідь кладуть у сховище різні значення — справні, з недійсними записами, пошкоджені, — записують кожне значення, яке твій код зберігає під `STORAGE_KEY`, швидко додають кілька витрат поспіль і рахують commit через `Profiler`.
      en: |
        `ExpenseTracker` can already add and remove expenses, but after every run it starts from the same three records. The read-only module `expenses.js` provides `STORAGE_KEY`, `DEFAULT_EXPENSES`, `validateExpense`, `summarizeExpenses` and other functions. `main.jsx` shows the app inside `<StrictMode>`. There are no hints in this task.

        Change `App.jsx` so that:

        1. **Initial read.** The list stored under `STORAGE_KEY` is read **once**, before the first display. The stored value looks like `{ schemaVersion: 1, records: [...] }`.
           - If nothing is stored under the key, the text is not JSON, `schemaVersion` is not `1`, or `records` is not an array, the app shows `DEFAULT_EXPENSES` and does not crash.
           - Otherwise only the records that pass `validateExpense` are shown (as the `value` it returns), in the stored order — even if none of them are left.
        2. **Synchronization.** After every change of the list, `STORAGE_KEY` holds `{ schemaVersion: 1, records }` with the **whole** current list — after mounting too. StrictMode's double mount neither duplicates a record nor changes a field; mounting writes nothing but the restored list.
        3. **Nothing extra.** The “Total” line matches the current list on every display. Mounting, submitting the form and removing cause **one** commit each — no effect that only copies or recomputes state.

        Hidden checks mount separate copies (inside `<StrictMode>`, except the commit check), put different values into storage beforehand — healthy, with invalid records, damaged — record every value your code saves under `STORAGE_KEY`, add several expenses quickly in a row and count commits with a `Profiler`.
    testTitles:
      "with nothing stored, the default expenses and their total are shown":
        uk: "Коли нічого не збережено, видно типові витрати та їхню суму"
        en: "With nothing stored, the default expenses and their total are shown"
      "valid stored records are restored without changes":
        uk: "Справні збережені записи відновлюються без змін"
        en: "Valid stored records are restored without changes"
      "mounting never writes anything but the restored list":
        uk: "Монтування не записує нічого, крім відновленого списку"
        en: "Mounting never writes anything but the restored list"
      "records that fail validation are skipped":
        uk: "Записи, що не проходять перевірку, пропускаються"
        en: "Records that fail validation are skipped"
      "corrupted JSON or an unknown schema falls back to the defaults":
        uk: "Пошкоджений JSON чи невідома схема повертають типовий список"
        en: "Corrupted JSON or an unknown schema falls back to the defaults"
      "adding and removing store the whole current list":
        uk: "Додавання й прибирання зберігають увесь поточний список"
        en: "Adding and removing store the whole current list"
      "rapid additions all reach storage without duplicates":
        uk: "Швидкі додавання всі потрапляють у сховище без дублів"
        en: "Rapid additions all reach storage without duplicates"
      "every action causes exactly one commit":
        uk: "Кожна дія дає рівно один commit"
        en: "Every action causes exactly one commit"
    solutionNote:
      uk: "Читання збереженого — початкове значення, тож воно живе у `useState(readStoredExpenses)`: React викликає функцію лише на першому рендері (StrictMode — двічі, але вона чиста), `try`/`catch` і перевірка конверта повертають типовий список, а `validateExpense` відсіює погані записи. Запис у сховище — синхронізація з зовнішньою системою, тож це один ефект із залежністю `[expenses]`, що записує **весь** список: повтор у StrictMode нічого не дублює. Підсумок обчислюється в рендері, тому кожна дія — один commit."
      en: "Reading what is stored is the initial value, so it lives in `useState(readStoredExpenses)`: React calls the function only on the first render (StrictMode calls it twice, but it is pure), `try`/`catch` and the envelope check return the default list, and `validateExpense` filters out bad records. Writing to storage is synchronization with an external system, so it is one effect with the dependency `[expenses]` that writes the **whole** list: StrictMode's repeat duplicates nothing. The summary is computed in render, so every action is one commit."
    feedback:
      - when: { test: "with nothing stored, the default expenses and their total are shown" }
        message:
          uk: "Ця перевірка монтує копію з порожнім сховищем і очікує три типові витрати та «Разом: 1545.50» без помилки React."
          en: "This check mounts a copy with empty storage and expects the three default expenses and “Total: 1545.50” without a React error."
      - when: { test: "valid stored records are restored without changes" }
        message:
          uk: "Ця перевірка кладе в сховище два справні записи й очікує саме їх на екрані, «Разом: 310.40» і те саме значення в сховищі після монтування в StrictMode — без дублів і змінених полів."
          en: "This check stores two valid records and expects exactly them on the screen, “Total: 310.40” and the same value in storage after mounting under StrictMode — no duplicates, no changed fields."
      - when: { test: "mounting never writes anything but the restored list" }
        message:
          uk: "Ця перевірка записує кожне значення, яке код зберігає під `STORAGE_KEY` під час монтування, і очікує, що кожне з них — відновлений список. Якщо першим записується типовий список, збережене читається вже після першого рендеру, а не як початкове значення."
          en: "This check records every value the code saves under `STORAGE_KEY` while mounting and expects each of them to be the restored list. If the default list is written first, the stored data is read after the first render instead of as the initial value."
      - when: { test: "records that fail validation are skipped" }
        message:
          uk: "Ця перевірка кладе один справний запис і два недійсні (від’ємна сума, порожня назва) й очікує на екрані та в сховищі лише справний. Потім кладе лише два недійсні й очікує порожній список, а не типовий: конверт справний, просто записів не лишилося."
          en: "This check stores one valid record and two invalid ones (a negative amount, an empty label) and expects only the valid one on the screen and in storage. Then it stores only the two invalid ones and expects an empty list, not the defaults: the envelope is fine, there are just no records left."
      - when: { test: "corrupted JSON or an unknown schema falls back to the defaults" }
        message:
          uk: "Ця перевірка по черзі кладе `{broken`, конверт зі `schemaVersion: 2`, голий масив і `null` й щоразу очікує типовий список без помилки React. `JSON.parse` пошкодженого тексту кидає `SyntaxError` — його треба перехопити."
          en: "This check stores `{broken`, an envelope with `schemaVersion: 2`, a bare array and `null` in turn and each time expects the default list without a React error. `JSON.parse` of damaged text throws a `SyntaxError` — it must be caught."
      - when: { test: "adding and removing store the whole current list" }
        message:
          uk: "Ця перевірка додає «Квитки в кіно» на 300 і прибирає перший запис; після кожної дії очікує в сховищі `schemaVersion: 1` і весь поточний список у порядку екрана."
          en: "This check adds “Cinema tickets” for 300 and removes the first record; after each action it expects `schemaVersion: 1` and the whole current list in screen order in storage."
      - when: { test: "rapid additions all reach storage without duplicates" }
        message:
          uk: "Ця перевірка швидко додає три витрати й очікує в сховищі шість записів із різними id — три типові й три нові з сумами 30000, 9990 і 21050."
          en: "This check quickly adds three expenses and expects six records with distinct ids in storage — the three defaults and the three new ones with amounts 30000, 9990 and 21050."
      - when: { test: "every action causes exactly one commit" }
        message:
          uk: "Ця перевірка без StrictMode рахує commit: монтування, надсилання форми й прибирання — по одному (введення в поля не враховується), а «Разом» одразу правильне. Два commit означають, що ефект після рендеру ставить стан — копію підсумку чи прочитаний список."
          en: "This check counts commits without StrictMode: mounting, submitting the form and removing — one each (typing into the fields is not counted), and “Total” right away. Two commits mean an effect sets state after the render — a copy of the summary or a list read from storage."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: safe-restore
        from: js-07-10-independent-modules-recovery
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          function restore(text, fallback) {
            try {
              const data = JSON.parse(text);
              return Array.isArray(data?.records) ? data.records : fallback;
            } catch {
              return fallback;
            }
          }
          console.log(restore("{broken", ["default"]).length, restore('{"records":[1,2]}', []).length, restore("null", []).length);
        verify:
          logs: ["1 2 0"]
        answer:
          type: choice
          options:
            - id: one-two-zero
              text: { uk: "`1 2 0`", en: "`1 2 0`" }
            - id: throws
              text: { uk: "`SyntaxError` на першому виклику", en: "A `SyntaxError` on the first call" }
              why:
                uk: "`JSON.parse` справді кидає `SyntaxError`, але `catch` перехоплює його й повертає запасний список."
                en: "`JSON.parse` does throw a `SyntaxError`, but `catch` takes it and returns the fallback list."
            - id: null-crash
              text: { uk: "`1 2`, а потім `TypeError` для `null`", en: "`1 2`, then a `TypeError` for `null`" }
              why:
                uk: "`JSON.parse(\"null\")` дає `null`, а `data?.records` з `?.` повертає `undefined` замість помилки — тож спрацьовує запасний варіант."
                en: "`JSON.parse(\"null\")` gives `null`, and `data?.records` with `?.` returns `undefined` instead of throwing — so the fallback is used."
          correct: [one-two-zero]
        explanation:
          uk: "Пошкоджений текст ловить `catch`, а дивну форму — перевірка `Array.isArray`. Обидва шляхи повертають запасний варіант, і програма працює далі. У React це тіло функції, яку передають у `useState` як початкове значення."
          en: "Damaged text is caught by `catch`, and an odd shape by the `Array.isArray` check. Both paths return the fallback, and the program keeps working. In React this is the body of the function passed to `useState` as the initial value."
