      bike: { uk: "Велосипед", en: "Bicycle" }
    title:
      uk: "Полагодь панель бажання"
      en: "Repair the wish panel"
    instructions:
      uk: |
        `WishDetail` показує вибране бажання (назва — ціна) з лабораторії; клавіша `j` вибирає наступне. Застосунок змонтовано в `<StrictMode>`. Скарги користувачів:

        - «Обираю інше бажання — панель не змінюється»;
        - «Швидко перемкнув з `w-01` на `w-02` — а показало `w-01`»;
        - «Натискаю `j` — перескакує через одне».

        Знайди причини й виправ `App.jsx`. Лабораторія відповідає для `w-01` за 900 мс, для інших — за 100 мс. Перевірки монтують окрему копію в `<StrictMode>`, рахують listeners `keydown`, які вона додає на `window`, і очікують рівно один після монтування й жодного після демонтування. Перевірки також чекають, доки прийдуть усі відповіді лабораторії, і очікують, що скасований запит не лишає необробленої помилки.
      en: |
        `WishDetail` shows the selected wish (name — price) from the lab; the `j` key selects the next one. The app is mounted inside `<StrictMode>`. User complaints:

        - “I pick another wish — the panel does not change”;
        - “I switched quickly from `w-01` to `w-02` — and it showed `w-01`”;
        - “I press `j` — it skips one”.

        Find the causes and repair `App.jsx`. The lab answers for `w-01` in 900 ms and for the others in 100 ms. The checks mount a separate copy inside `<StrictMode>`, count the `keydown` listeners it adds to `window`, and expect exactly one after mounting and none after unmounting. The checks also wait until every lab answer has arrived, and expect a cancelled request to leave no unhandled error.
    testTitles:
      "selecting a wish shows its details":
        uk: "Вибране бажання показує свої подробиці"
        en: "Selecting a wish shows its details"
      "a slow answer for an earlier selection does not replace the current one":
        uk: "Повільна відповідь для попереднього вибору не замінює поточного"
        en: "A slow answer for an earlier selection does not replace the current one"
      "a cancelled request leaves no unhandled error":
        uk: "Скасований запит не лишає необробленої помилки"
        en: "A cancelled request leaves no unhandled error"
      "the j key moves the selection by exactly one wish":
        uk: "Клавіша j переміщує вибір рівно на одне бажання"
        en: "The j key moves the selection by exactly one wish"
      "after mounting exactly one key listener is attached":
        uk: "Після монтування висить рівно один listener клавіш"
        en: "After mounting exactly one key listener is attached"
      "unmounting removes the key listener":
        uk: "Демонтування знімає listener клавіш"
        en: "Unmounting removes the key listener"
    hints:
      nudge:
        uk: "Три скарги — три місця. Для кожного ефекту запитай: що він читає, що він налаштовує і що саме скасовує його cleanup?"
        en: "Three complaints — three places. For each effect ask: what does it read, what does it set up, and what exactly does its cleanup undo?"
      explanation:
        uk: |
          Перша скарга — ефект запиту не перезапускається: подивись на його масив залежностей. Друга з’явиться, щойно виправиш першу: старий запит ніхто не скасовує, і його пізня відповідь перезаписує нову. Потрібен cleanup, який скасовує запит, і `.catch`, що спокійно приймає `AbortError`. Третя — cleanup listener’а передає в `removeEventListener` функцію, якої ніколи не додавали.

          Схоже, з іншою задачею: `useEffect(() => { const controller = new AbortController(); load(city, controller.signal).catch(skipAbort); return () => controller.abort(); }, [city]);`.
        en: |
          The first complaint — the request effect does not re-run: look at its dependency array. The second shows up as soon as you fix the first: nobody cancels the old request, and its late answer overwrites the new one. You need a cleanup that cancels the request and a `.catch` that calmly accepts an `AbortError`. The third — the listener's cleanup passes a function to `removeEventListener` that was never added.

          Similar, with a different task: `useEffect(() => { const controller = new AbortController(); load(city, controller.signal).catch(skipAbort); return () => controller.abort(); }, [city]);`.
    solutionNote:
      uk: "Ефект запиту читає `selectedId`, тож `[selectedId]` — його залежності; cleanup викликає `controller.abort()`, і відповідь для попереднього вибору вже не доходить до `setWish`, а `AbortError` тихо обробляє `.catch`. Ефект клавіші знімає ту саму `onKey`, тож setup → cleanup → setup лишає один listener. Прапорець `ignore` замість `AbortController` теж працює: запит долітає, але результат відкидається."
      en: "The request effect reads `selectedId`, so `[selectedId]` is its dependency list; the cleanup calls `controller.abort()`, and the answer for the previous selection no longer reaches `setWish`, while `.catch` quietly handles the `AbortError`. The key effect removes the same `onKey`, so setup → cleanup → setup leaves one listener. An `ignore` flag instead of an `AbortController` works too: the request completes, but its result is thrown away."
    feedback:
      - when: { test: "selecting a wish shows its details" }
        message:
          uk: "Ця перевірка вибирає `w-02`, потім `w-03` і щоразу очікує їхні назву й ціну («Настільна лампа — 45», «Велосипед — 240»). Якщо панель не змінюється, ефект запиту не перезапускається для нового `selectedId`."
          en: "This check selects `w-02`, then `w-03`, and each time expects their name and price (“Desk lamp — 45”, “Bicycle — 240”). If the panel does not change, the request effect does not re-run for the new `selectedId`."
      - when: { test: "a slow answer for an earlier selection does not replace the current one" }
        message:
          uk: "Ця перевірка клікає `w-01`, одразу `w-02`, чекає, доки прийдуть обидві відповіді, і очікує дані `w-02`. Відповідь для `w-01` приходить пізніше — її має скасувати (або відкинути) cleanup ефекту запиту."
          en: "This check clicks `w-01`, right away `w-02`, waits until both answers have arrived and expects the data of `w-02`. The answer for `w-01` arrives later — the request effect's cleanup must cancel (or discard) it."
      - when: { test: "a cancelled request leaves no unhandled error" }
        message:
          uk: "Ця перевірка клікає `w-01`, одразу `w-02` і очікує, що жоден проміс не лишився відхиленим без обробки. Якщо cleanup викликає `controller.abort()`, у ланцюжку `fetch` потрібен `.catch`, який спокійно приймає `AbortError` (`error.name === \"AbortError\"`), а інші помилки кидає далі."
          en: "This check clicks `w-01`, right away `w-02`, and expects no promise to be left rejected without a handler. If the cleanup calls `controller.abort()`, the `fetch` chain needs a `.catch` that calmly accepts an `AbortError` (`error.name === \"AbortError\"`) and rethrows other errors."
      - when: { test: "the j key moves the selection by exactly one wish" }
        message:
          uk: "Ця перевірка вибирає `w-01`, натискає `j` один раз і очікує `w-02`. Перескок на `w-03` означає два listeners: cleanup має знімати ту саму функцію, яку додав setup."
          en: "This check selects `w-01`, presses `j` once and expects `w-02`. A jump to `w-03` means two listeners: the cleanup must remove the same function the setup added."
      - when: { test: "after mounting exactly one key listener is attached" }
        message:
          uk: "Ця перевірка монтує копію в `<StrictMode>` і очікує рівно один listener `keydown` на `window`. Два означають, що cleanup першого setup нічого не зняв."
          en: "This check mounts a copy inside `<StrictMode>` and expects exactly one `keydown` listener on `window`. Two mean the first setup's cleanup removed nothing."
      - when: { test: "unmounting removes the key listener" }
        message:
          uk: "Ця перевірка демонтує копію й очікує 0 listeners `keydown` від неї. Cleanup має передати в `removeEventListener` ту саму функцію, що й `addEventListener` (або скасувати її сигнал)."
          en: "This check unmounts the copy and expects 0 `keydown` listeners from it. The cleanup must pass the same function to `removeEventListener` as to `addEventListener` (or abort its signal)."
      - when: { error: AbortError }
        message:
          uk: "Скасований запит відхиляє проміс з `AbortError`. Додай у ланцюжок `fetch` `.catch`, який ігнорує саме `AbortError` (`error.name === \"AbortError\"`), а інші помилки кидає далі."
          en: "A cancelled request rejects its promise with an `AbortError`. Add a `.catch` to the `fetch` chain that ignores exactly an `AbortError` (`error.name === \"AbortError\"`) and rethrows other errors."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: abort-signal
        from: js-08-09-cancellation-abort
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const controller = new AbortController();
          controller.abort();
          console.log(controller.signal.aborted, controller.signal.reason.name);
        verify:
          logs: ["true AbortError"]
        answer:
          type: choice
          options:
            - id: true-abort
              text: { uk: "`true AbortError`", en: "`true AbortError`" }
            - id: false-undefined
              text: { uk: "`false undefined`", en: "`false undefined`" }
              why:
                uk: "`abort()` одразу позначає сигнал як скасований і записує причину — без жодного очікування."
                en: "`abort()` marks the signal as aborted at once and records the reason — with no waiting."
            - id: true-error
              text: { uk: "`true Error`", en: "`true Error`" }
              why:
                uk: "Без аргументу `abort()` бере причину за замовчуванням — `DOMException` з назвою `AbortError`."
                en: "Without an argument `abort()` uses the default reason — a `DOMException` named `AbortError`."
          correct: [true-abort]
        explanation:
          uk: "Після `abort()` сигнал має `aborted: true`, а причина — `DOMException` з назвою `AbortError`. Саме з такою помилкою відхиляється `fetch`, якому передали цей сигнал, — тому в ефекті її відрізняють від справжніх збоїв."
          en: "After `abort()` the signal has `aborted: true`, and the reason is a `DOMException` named `AbortError`. A `fetch` given this signal rejects with exactly this error — which is why an effect tells it apart from real failures."
      - id: latest-wins
        from: js-08-10-stale-responses-retry
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          let latest = 0;
          function search(query, ms) {
            const requestId = ++latest;
            return new Promise((resolve) => setTimeout(() => resolve(query), ms)).then((result) => {
              if (requestId === latest) console.log("show", result);
            });
          }
          search("lamp", 300);
          search("mug", 100);
        verify:
          logs: ["show mug"]
        answer:
          type: choice
          options:
            - id: mug-only
              text: { uk: "`show mug`", en: "`show mug`" }
            - id: both
              text: { uk: "`show mug`, потім `show lamp`", en: "`show mug`, then `show lamp`" }
              why:
                uk: "Відповідь `lamp` приходить пізніше, але її `requestId` — 1, а `latest` уже 2. Перевірка відкидає застарілу відповідь."
                en: "The `lamp` answer arrives later, but its `requestId` is 1 while `latest` is already 2. The check discards the stale answer."
            - id: lamp-only
              text: { uk: "`show lamp`", en: "`show lamp`" }
              why:
                uk: "Показується не те, що прийшло останнім, а те, що запитали останнім: `mug`."
                en: "What is shown is not what arrived last but what was requested last: `mug`."
          correct: [mug-only]
        explanation:
          uk: "Перемагає останній **запит**, а не остання відповідь. У React той самий прийом — прапорець `ignore` або `abort()` у cleanup: коли з’являється нове значення, React викликає cleanup старого запуску, а вже cleanup відкидає чи скасовує його відповідь."
          en: "The last **request** wins, not the last answer. In React the same trick is an `ignore` flag or `abort()` in the cleanup: when a new value appears, React calls the old run's cleanup, and it is the cleanup that discards or cancels that run's answer."

  - id: to-project
    kind: transfer
    capstoneStep: RE-03
    body:
      uk: "Перш ніж додавати ефект збереження в проєкт, пройдися набором для ремонту по ефектах, які там уже є: чи повні залежності, чи скасовує кожен cleanup саме те, що зробив setup, і чи не дублює StrictMode жодної дії."
      en: "Before you add the persistence effect to your project, run the repair kit over the effects that are already there: are the dependencies complete, does every cleanup undo exactly what its setup did, and does StrictMode duplicate nothing."
