id: re-03-02-effects-synchronize-external
unit: RE-03
title:
  uk: "Ефекти синхронізують зі світом поза React"
  en: "Effects synchronize with the outside"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Пояснити ефект як код, що тримає зовнішню систему (сховище, заголовок документа, таймер, підписку) у відповідності з поточним рендером."
    en: "Explain an effect as code that keeps an external system (storage, the document title, a timer, a subscription) in sync with the current render."
  - uk: "Передбачити, коли ефект запускається відносно render і commit — на першому рендері й на повторному."
    en: "Predict when an effect runs relative to render and commit, on the first render and on a re-render."
prerequisites: [re-03-01-rules-of-hooks, re-01-07-purity-in-render]
subskills:
  - { family: R-04, skill: "synchronization vs events/derived values", depth: intro }
glossary: [use-effect, external-system]
selfCheck: [predict-effect-order, filtered-title]

blocks:
  - id: outside-react
    kind: explanation
    title:
      uk: "Те, чого React не малює"
      en: "What React does not draw"
    body:
      uk: |
        Рендер має бути чистим: компонент лише обчислює, що показати. React сам переносить результат на сторінку під час commit.

        Але частина світу — поза React: заголовок вкладки браузера (`document.title`), `localStorage`, таймери, підписки на чужі події. Це [[external-system|зовнішні системи]]: React їх не малює й про них не знає. Щоб вони відповідали тому, що зараз на екрані, потрібен **ефект**.

        [[use-effect|useEffect]] приймає функцію, і React викликає її **після commit** — коли екран уже показує цей рендер:

        ```jsx
        useEffect(() => {
          document.title = `${wishes.length} wishes`;
        });
        ```

        Без другого аргументу ефект запускається після **кожного** commit. Кожен запуск бачить змінні того рендеру, після якого він стався, і доводить зовнішню систему до відповідності з ним.
      en: |
        Render must be pure: a component only computes what to show. React itself moves the result to the page during the commit.

        But part of the world is outside React: the browser tab title (`document.title`), `localStorage`, timers, subscriptions to someone else's events. These are [[external-system|external systems]]: React does not draw them and knows nothing about them. To keep them matching what is on the screen now, you need an **effect**.

        [[use-effect|useEffect]] takes a function, and React calls it **after the commit** — when the screen already shows this render:

        ```jsx
        useEffect(() => {
          document.title = `${wishes.length} wishes`;
        });
        ```

        Without a second argument the effect runs after **every** commit. Each run sees the variables of the render it follows and brings the external system in line with it.

  - id: predict-effect-order
    kind: prediction
    prompt:
      uk: "Компонент показується вперше, а потім кнопку натискають один раз. Що надрукує консоль?"
      en: "The component is shown for the first time, then the button is pressed once. What does the console print?"
    code: |
      function PendingHeading() {
        const [tasks, setTasks] = useState(["t-01", "t-02"]);
        console.log(`render: ${tasks.length}`);
        useEffect(() => {
          const shown = document.querySelector("h2").textContent;
          console.log(`effect → ${shown}`);
        });
        return (
          <>
            <h2>{tasks.length} pending</h2>
            <button onClick={() => setTasks([...tasks, "t-03"])}>Add</button>
          </>
        );
      }
    lang: jsx
    runnable: false
    answer:
      type: choice
      options:
        - id: after-each-commit
          code: "render: 2\neffect → 2 pending\nrender: 3\neffect → 3 pending"
        - id: once
          code: "render: 2\neffect → 2 pending\nrender: 3"
          why:
            uk: "Ефект без другого аргументу — не «коли компонент з’явився». Він запускається після **кожного** commit, тож і після рендеру 3."
            en: "An effect without a second argument is not “when the component appears”. It runs after **every** commit, so after render 3 as well."
        - id: before-screen
          code: "render: 2\neffect → (nothing yet)\nrender: 3\neffect → 2 pending"
          why:
            uk: "Ефект не запускається під час рендеру, поки екран ще старий. React викликає його після commit, тож `h2` уже показує число **цього** рендеру."
            en: "An effect does not run during render, while the screen is still old. React calls it after the commit, so the `h2` already shows the number of **this** render."
        - id: effect-first
          code: "effect → 2 pending\nrender: 2\neffect → 3 pending\nrender: 3"
          why:
            uk: "Спершу React має викликати функцію компонента — лише так він дізнається про ефект і про те, що показати. Ефект завжди йде після свого рендеру."
            en: "React first has to call the component function — that is the only way it learns about the effect and about what to show. An effect always comes after its render."
      correct: [after-each-commit]
    explanation:
      uk: "Порядок щоразу той самий: **render → commit → effect**. Рендер друкує число, React переносить результат на екран, і тільки тоді запускається ефект — тому `h2` у ньому вже показує те саме число. Після кліку все повторюється з новим знімком. Перевірено в пісочниці з React 19.3 саме з цими чотирма рядками."
      en: "The order is the same every time: **render → commit → effect**. The render prints the number, React moves the result to the screen, and only then does the effect run — so the `h2` it reads already shows the same number. After the click everything repeats with a new snapshot. Checked in the sandbox with React 19.3: exactly these four lines."

  - id: title-effect
    kind: example
    runtime: browser-react
    dir: title-effect
    entry: main.jsx
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      newExpense: { uk: "Нова витрата", en: "New expense" }
      titlePrefix: { uk: "Витрат:", en: "Expenses:" }
      heading: { uk: "Витрати, записів:", en: "Expenses, records:" }
      add: { uk: "Додати", en: "Add" }
      removeLast: { uk: "Прибрати останню", en: "Remove the last" }
    title:
      uk: "Ефект тримає заголовок документа"
      en: "An effect keeps the document title"
    body:
      uk: |
        Заголовок документа — зовнішня система: React його не малює. Тут пісочниця показує сторінку у вбудованій рамці, тож заголовка вкладки ти не побачиш — ефект друкує його в консоль.

        Натисни **Запустити**, на вкладці **Сторінка** кілька разів **Додати** й **Прибрати останню**, а тоді відкрий **Консоль**. Кожна зміна дає пару рядків: спочатку `render:`, потім `effect:` із новим заголовком і тим, що вже показує екран.
      en: |
        The document title is an external system: React does not draw it. Here the sandbox shows the page inside an embedded frame, so you will not see a tab title — the effect prints it to the console.

        Press **Run**, on the **Page** tab press **Add** and **Remove the last** a few times, then open the **Console**. Every change gives a pair of lines: first `render:`, then `effect:` with the new title and what the screen already shows.
    tryIt:
      uk: |
        Перенеси присвоєння заголовка просто в тіло компонента — під рядок `console.log(\`render: ...\`)` — і додай там `console.log("render: screen →", document.querySelector("h2")?.textContent);`. Запусти й зміни список.

        Помітно нічого не ламається: заголовок усе одно правильний. Але консоль показує, що тепер заголовок змінюється **до** екрана: під час рендеру `h2` ще має старе число (а на першому рендері його ще немає — `undefined`). Рендер — це обчислення, а не «момент показу»: React може викликати функцію компонента й відкинути результат (це побачиш в уроці про Strict Mode). Тому синхронізацію пишуть в ефекті.
      en: |
        Move the title assignment straight into the component body — below the line `console.log(\`render: ...\`)` — and add `console.log("render: screen →", document.querySelector("h2")?.textContent);` there. Run it and change the list.

        Nothing visibly breaks: the title is still right. But the console shows that the title now changes **before** the screen: during render the `h2` still has the old number (and on the first render it does not exist yet — `undefined`). Render is a calculation, not “the moment of showing”: React may call a component function and throw the result away (you will see that in the lesson about Strict Mode). That is why synchronization goes into an effect.

  - id: title-timeline
    kind: visual
    visual: render-timeline
    strings:
      titlePrefix: { uk: "Справ у роботі:", en: "Pending tasks:" }
    title:
      uk: "Render → commit → effect, тричі"
      en: "Render → commit → effect, three times"
    textEquivalent:
      uk: >-
        Компонент PendingTasks тримає список справ і показує, скільки з них ще не виконано. Рендер 1
        бачить дві невиконані справи; commit показує на екрані «2»; після commit ефект записує в
        document.title «%%titlePrefix%% 2». Клік «Додати» ставить у чергу новий список із трьох
        справ. Рендер 2 бачить три, commit оновлює екран, і лише потім ефект змінює заголовок на
        «%%titlePrefix%% 3». Клік на прапорці позначає одну справу виконаною; рендер 3 бачить дві
        невиконані, commit оновлює екран, ефект повертає заголовок до «%%titlePrefix%% 2». Ефект
        жодного разу не запускається під час рендеру: щоразу він доводить заголовок — зовнішню
        систему — до відповідності з тим, що вже показано.
      en: >-
        The PendingTasks component holds a list of tasks and shows how many are not done yet. Render
        1 sees two pending tasks; the commit shows “2” on the screen; after the commit the effect
        writes “%%titlePrefix%% 2” into document.title. A click on “Add” queues a new list of three
        tasks. Render 2 sees three, the commit updates the screen, and only then does the effect
        change the title to “%%titlePrefix%% 3”. A click on a checkbox marks one task done; render 3
        sees two pending, the commit updates the screen, the effect brings the title back to
        “%%titlePrefix%% 2”. The effect never runs during render: each time it brings the title — the
        external system — in line with what is already shown.
    spec:
      component: PendingTasks
      code: |
        function PendingTasks() {
          const [tasks, setTasks] = useState(TASKS);
          const pending = tasks.filter((task) => !task.done).length;
          useEffect(() => {
            document.title = `%%titlePrefix%% ${pending}`;
          });
          return <p>{pending}</p>;
        }
      steps:
        - phase: render
          render: 1
          line: 3
          reason: { uk: "перший показ", en: "first display" }
          snapshot: { state: { pending: 2 } }
          caption:
            uk: "Рендер 1 лише обчислює: невиконаних справ `2`. Заголовок документа поки не змінено."
            en: "Render 1 only computes: `2` pending tasks. The document title has not changed yet."
        - phase: commit
          render: 1
          line: 7
          dom: "<p>2</p>"
          caption:
            uk: "Commit: React переносить результат на екран — видно `2`."
            en: "Commit: React moves the result to the screen — `2` is visible."
        - phase: effect
          render: 1
          line: 5
          run: ["document.title = \"%%titlePrefix%% 2\""]
          caption:
            uk: "Тепер ефект: заголовок — зовнішня система — стає таким, як екран."
            en: "Now the effect: the title — the external system — is made to match the screen."
        - phase: event
          name: click
          sees: { pending: 2 }
          actions: ["setTasks([...tasks, newTask])"]
          caption:
            uk: "Клік «Додати» ставить у чергу новий список. Ні екран, ні заголовок ще не змінилися."
            en: "A click on “Add” queues a new list. Neither the screen nor the title has changed yet."
        - phase: render
          render: 2
          line: 3
          reason: { uk: "змінився стан tasks", en: "the tasks state changed" }
          snapshot: { state: { pending: 3 } }
          caption:
            uk: "Рендер 2 бачить `3` невиконані справи. Заголовок досі каже `2` — рендер його не чіпає."
            en: "Render 2 sees `3` pending tasks. The title still says `2` — render does not touch it."
        - phase: commit
          render: 2
          line: 7
          dom: "<p>3</p>"
          caption:
            uk: "Commit 2: на екрані `3`."
            en: "Commit 2: the screen shows `3`."
        - phase: effect
          render: 2
          line: 5
          run: ["document.title = \"%%titlePrefix%% 3\""]
          caption:
            uk: "Ефект запускається **знову**, бо був новий commit, і бачить знімок рендеру 2."
            en: "The effect runs **again**, because there was a new commit, and it sees render 2's snapshot."
        - phase: event
          name: change
          sees: { pending: 3 }
          actions: ["setTasks(tasks.map(markDone))"]
          caption:
            uk: "Прапорець позначає одну справу виконаною — у черзі ще один новий список."
            en: "A checkbox marks one task done — one more new list is queued."
        - phase: render
          render: 3
          line: 3
          reason: { uk: "змінився стан tasks", en: "the tasks state changed" }
          snapshot: { state: { pending: 2 } }
          caption:
            uk: "Рендер 3: невиконаних знову `2`."
            en: "Render 3: `2` pending again."
        - phase: commit
          render: 3
          line: 7
          dom: "<p>2</p>"
          caption:
            uk: "Commit 3: на екрані `2`."
            en: "Commit 3: the screen shows `2`."
        - phase: effect
          render: 3
          line: 5
          run: ["document.title = \"%%titlePrefix%% 2\""]
          caption:
            uk: "І ефект доводить заголовок до `2`. Щоразу той самий порядок: render → commit → effect."
            en: "And the effect brings the title to `2`. The same order every time: render → commit → effect."

  - id: sync-not-lifecycle
    kind: explanation
    title:
      uk: "Не «коли з’явився», а «синхронізуй»"
      en: "Not “when it appears” but “synchronize”"
    body:
      uk: |
        Ефект легко сприйняти як «код, що виконується, коли компонент з’явився». Ти щойно бачив, що це не так: ефект без другого аргументу запускається після **кожного** commit.

        Корисніше питання — не «*коли* це запустити?», а «*якою* має бути зовнішня система для **цього** рендеру?». Заголовок має казати, скільки справ видно зараз. `localStorage` має містити поточний список. Ефект відповідає на це питання щоразу заново, з даними свого рендеру.

        Ефект потрібен лише для зовнішніх систем. Якщо значення можна обчислити з props і стану — обчисли його під час рендеру. Якщо щось має статися через конкретну дію (клік, надсилання форми) — це робота обробника події. До цього розрізнення ти повернешся в кінці розділу.
      en: |
        It is easy to see an effect as “code that runs when the component appears”. You have just seen that it is not: an effect without a second argument runs after **every** commit.

        A more useful question is not “*when* should this run?” but “*what* should the external system look like for **this** render?”. The title must say how many tasks are visible now. `localStorage` must hold the current list. The effect answers that question anew each time, with the data of its render.

        An effect is needed only for external systems. If a value can be computed from props and state, compute it during render. If something must happen because of a specific action (a click, a form submit), that is the job of an event handler. You will come back to this distinction at the end of the unit.

  - id: filtered-title
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: filtered-title
    entry: main.jsx
    editable: [App.jsx]
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      all: { uk: "Усі", en: "All" }
      pending: { uk: "Невиконані", en: "Pending" }
      done: { uk: "Виконані", en: "Done" }
      titlePrefix: { uk: "Справ у списку:", en: "Tasks in the list:" }
    title:
      uk: "Заголовок, що стежить за фільтром"
      en: "A title that follows the filter"
    instructions:
      uk: |
        `TaskList` показує справи з фільтром «Усі / Невиконані / Виконані» й рядок «Справ у списку: N». Додай у `App.jsx` ефект, який тримає `document.title` рівним тому самому тексту — `Справ у списку: N`, де N — кількість справ, **видимих** зараз.

        Заголовок має бути правильним після першого показу, після зміни фільтра і після того, як справу позначили виконаною. Перевірки також записують, що показував рядок на екрані в момент кожного присвоєння `document.title`, і очікують, що заголовок змінюється лише тоді, коли екран **уже** показує те саме число.
      en: |
        `TaskList` shows tasks with an “All / Pending / Done” filter and the line “Tasks in the list: N”. Add an effect to `App.jsx` that keeps `document.title` equal to the same text — `Tasks in the list: N`, where N is the number of tasks **visible** now.

        The title must be right after the first display, after a filter change and after a task is marked done. The checks also record what the line on the screen showed at the moment of every assignment to `document.title`, and expect the title to change only when the screen **already** shows the same number.
    testTitles:
      "the title shows the number of visible tasks on the first display":
        uk: "Після першого показу заголовок називає кількість видимих справ"
        en: "After the first display the title names the number of visible tasks"
      "the title follows the filter":
        uk: "Заголовок стежить за фільтром"
        en: "The title follows the filter"
      "the title follows a task marked as done":
        uk: "Заголовок стежить за справою, позначеною як виконана"
        en: "The title follows a task marked as done"
      "the title changes only after the screen shows the same number":
        uk: "Заголовок змінюється лише після того, як екран показує те саме число"
        en: "The title changes only after the screen shows the same number"
    hints:
      nudge:
        uk: "Яке число вже обчислено в компоненті й показано в рядку `<p>`? Заголовок має повторювати його — але в момент, коли React уже переніс рендер на екран."
        en: "Which number is already computed in the component and shown in the `<p>` line? The title must repeat it — but at the moment React has already put the render on the screen."
      explanation:
        uk: |
          Імпортуй `useEffect` з `"react"` і виклич його на верхньому рівні компонента. Функцію, яку ти йому передаєш, React викличе після commit — і вона бачить змінні цього рендеру. Наприклад, для лічильника бажань це виглядало б так: `useEffect(() => { document.title = \`Wishes: ${wishes.length}\`; });`. Тобі потрібне інше число й інший текст.

          Не обчислюй число заново в обробнику кліку: заголовок має змінюватися й тоді, коли змінюється справа, а не лише фільтр.
        en: |
          Import `useEffect` from `"react"` and call it at the top level of the component. React calls the function you pass to it after the commit — and it sees this render's variables. For a wish counter, for example, it would look like `useEffect(() => { document.title = \`Wishes: ${wishes.length}\`; });`. You need a different number and a different text.

          Do not recompute the number in a click handler: the title must change when a task changes too, not only the filter.
    solutionNote:
      uk: "Ефект без другого аргументу запускається після кожного commit і бачить `visible` свого рендеру, тож заголовок завжди повторює число на екрані — після фільтра, після прапорця, після будь-якої майбутньої зміни. Обробник кліку знав би лише про свою дію, а присвоєння під час рендеру випереджало б екран."
      en: "An effect without a second argument runs after every commit and sees its render's `visible`, so the title always repeats the number on the screen — after the filter, after a checkbox, after any future change. A click handler would know only about its own action, and an assignment during render would run ahead of the screen."
    feedback:
      - when: { test: "the title shows the number of visible tasks on the first display" }
        message:
          uk: "Ця перевірка очікує після першого показу `document.title` рівно «Справ у списку: 4» — той самий текст, що в рядку `<p>`, з пробілом перед числом."
          en: "This check expects `document.title` to be exactly “Tasks in the list: 4” after the first display — the same text as in the `<p>` line, with a space before the number."
      - when: { test: "the title follows the filter" }
        message:
          uk: "Ця перевірка натискає «Невиконані» (очікує 3) і «Виконані» (очікує 1). Число — це кількість **видимих** справ, `visible.length`, а не всіх."
          en: "This check presses “Pending” (expects 3) and “Done” (expects 1). The number is the count of **visible** tasks, `visible.length`, not of all tasks."
      - when: { test: "the title follows a task marked as done" }
        message:
          uk: "Ця перевірка вмикає фільтр «Невиконані» і позначає першу справу виконаною — очікує «Справ у списку: 2». Заголовок, який оновлює лише обробник фільтра, цього не помітить."
          en: "This check turns on the “Pending” filter and marks the first task done — it expects “Tasks in the list: 2”. A title updated only by the filter handler does not notice that."
      - when: { test: "the title changes only after the screen shows the same number" }
        message:
          uk: "Ця перевірка очікує, що в момент кожного присвоєння `document.title` рядок `<p>` уже показує той самий текст. Присвоєння в тілі компонента відбувається під час рендеру, коли екран ще старий; в ефекті — після commit."
          en: "This check expects the `<p>` line to show the same text at the moment of every assignment to `document.title`. An assignment in the component body happens during render, while the screen is still old; in an effect it happens after the commit."
      - when: { error: ReferenceError }
        message:
          uk: "Якщо картка каже `useEffect is not defined`, додай `useEffect` в імпорт: `import { useEffect, useState } from \"react\";`."
          en: "If the card says `useEffect is not defined`, add `useEffect` to the import: `import { useEffect, useState } from \"react\";`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: pure-or-not
        from: js-03-07-pure-vs-side-effects
        prompt:
          uk: "Що надрукує цей код і чи чиста функція `total`?"
          en: "What does this code print, and is the function `total` pure?"
        code: |
          let calls = 0;
          function total(prices) {
            calls += 1;
            return prices.reduce((sum, price) => sum + price, 0);
          }
          console.log(total([45, 18]), total([45, 18]), calls);
        verify:
          logs: ["63 63 2"]
        answer:
          type: choice
          options:
            - id: not-pure
              text:
                uk: "`63 63 2`; функція не чиста: кожен виклик змінює змінну поза нею"
                en: "`63 63 2`; the function is not pure: every call changes a variable outside it"
            - id: pure-same-result
              text:
                uk: "`63 63 2`; функція чиста, бо для тих самих цін повертає той самий результат"
                en: "`63 63 2`; the function is pure because it returns the same result for the same prices"
              why:
                uk: "Однаковий результат — лише половина умови. Чиста функція ще й нічого не змінює поза собою, а `calls += 1` змінює."
                en: "The same result is only half of the condition. A pure function also changes nothing outside itself, and `calls += 1` does."
            - id: zero-calls
              text:
                uk: "`63 63 0`; функція чиста"
                en: "`63 63 0`; the function is pure"
              why:
                uk: "Обидва виклики виконуються до того, як `console.log` прочитає `calls`, і кожен додає 1."
                en: "Both calls run before `console.log` reads `calls`, and each adds 1."
          correct: [not-pure]
        explanation:
          uk: "Обидва виклики повертають `63`, а `calls` після них — `2`. Через `calls += 1` функція має **побічний ефект**, тож вона не чиста. У React такі зміни зовнішнього світу виносять із рендеру — в обробники подій або в ефекти."
          en: "Both calls return `63`, and `calls` is `2` after them. Because of `calls += 1` the function has a **side effect**, so it is not pure. In React such changes to the outside world are moved out of render — into event handlers or effects."

  - id: to-project
    kind: transfer
    capstoneStep: RE-03
    body:
      uk: "У кроці проєкту цього розділу зовнішньою системою буде `localStorage`: один ефект після кожної зміни списку записуватиме `{ schemaVersion: 1, records }` під ключем проєкту. Подумай уже зараз, які значення рендеру цей ефект читатиме."
      en: "In this unit's project step the external system will be `localStorage`: one effect will write `{ schemaVersion: 1, records }` under the project's key after every change of the list. Think now about which values of the render that effect will read."
