          en: "Two errors, as at the start of the task: `TS2353` — the `loading` member has no `tasks` field; `TS2322` — a `success` member without the required `tasks`. Neither impossible state got through."
      - text:
          uk: "Видали два останні рядки коду (`stillLoading` і `emptySuccess`) і запусти перевірку."
          en: "Delete the last two lines of code (`stillLoading` and `emptySuccess`) and run the check."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого: помилок немає."
          en: "Nothing: there are no errors."
      - text:
          uk: "Додай до `TasksAction` новий варіант — кнопку «Спробувати ще раз»: заміни рядок коду `| { type: \"failed\"; message: string };` двома рядками `| { type: \"failed\"; message: string }` і `| { type: \"retried\" };`. Reducer не чіпай."
          en: "Add a new member to `TasksAction` — the “Try again” button: replace the line of code `| { type: \"failed\"; message: string };` with the two lines `| { type: \"failed\"; message: string }` and `| { type: \"retried\" };`. Leave the reducer alone."
      - text:
          uk: "Запусти перевірку."
          en: "Run the check."
        command: "npx tsc --noEmit"
        expect:
          uk: "Одна помилка `TS2322` на рядку `const unhandled: never = action;`: варіант `{ type: \"retried\"; }` дійшов до `default`. Ти змінив лише тип, а `tsc` сам показав місце в reducer, яке про нього не знає."
          en: "One error, `TS2322`, on the line `const unhandled: never = action;`: the member `{ type: \"retried\"; }` reached `default`. You changed only the type, and `tsc` itself pointed at the place in the reducer that does not know about it."
      - text:
          uk: "Встав гілку для кроку 6 перед `default: {` і запусти перевірку."
          en: "Insert the branch for step 6 before `default: {` and run the check."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого: помилок немає. Нова стрілка автомата — `failure + retried → loading` — тепер є і в типі, і в reducer."
          en: "Nothing: there are no errors. The machine's new arrow — `failure + retried → loading` — is now both in the type and in the reducer."
    verify:
      - id: impossible-rejected
        text:
          uk: "`tsc` відхилив обидва неможливі стани (`TS2353` і `TS2322`)."
          en: "`tsc` rejected both impossible states (`TS2353` and `TS2322`)."
      - id: retried-handled
        text:
          uk: "Після додавання `retried` до union `tsc` показав `never` у `default`, а з новою гілкою перевірка чиста."
          en: "After adding `retried` to the union `tsc` showed `never` in `default`, and with the new branch the check is clean."
    troubleshooting:
      - problem:
          uk: "`npx tsc` пропонує встановити пакет `tsc` (`Need to install the following packages`)."
          en: "`npx tsc` offers to install a package `tsc` (`Need to install the following packages`)."
        fix:
          uk: "Ти не в теці `ts-lab` або в ній ще немає TypeScript. Відмов (`n`), перейди в `~/js-course/ts-lab` і, якщо треба, виконай `npm install --save-dev typescript`."
          en: "You are not in the `ts-lab` folder, or it has no TypeScript yet. Decline (`n`), go to `~/js-course/ts-lab` and, if needed, run `npm install --save-dev typescript`."
      - problem:
          uk: "На кроці 5 помилка стоїть на іншому рядку або їх кілька."
          en: "In step 5 the error is on another line, or there are several."
        fix:
          uk: "Номер рядка залежить від того, скільки рядків у файлі; важливий код `TS2322` і текст про `never`. Якщо помилок кілька, перевір, що крапку з комою перенесено: вона стоїть лише після останнього варіанта union."
          en: "The line number depends on how many lines the file has; what matters is the code `TS2322` and the text about `never`. If there are several errors, check that the semicolon moved: it stands only after the last member of the union."
    recovery:
      uk: "Усе це живе лише в `~/js-course/ts-lab/src/re09/tasksRequest.ts`. Якщо файл заплутався, видали його й створи знову з вмісту для кроку 2."
      en: "All of this lives only in `~/js-course/ts-lab/src/re09/tasksRequest.ts`. If the file gets tangled, delete it and create it again from the contents for step 2."

  - id: typed-context
    kind: explanation
    title:
      uk: "Context, який чесно каже «provider немає»"
      en: "A context that honestly says “there is no provider”"
    body:
      uk: |
        Коли стан запиту потрібен кільком компонентам, його дають через context, як у RE-04. Тип context має пам’ятати, що поза provider значення немає:

        ```tsx
        type SettingsValue = { currency: string; setCurrency: (code: string) => void };

        const SettingsContext = createContext<SettingsValue | null>(null);

        function useSettings(): SettingsValue {
          const value = useContext(SettingsContext);
          if (value === null) throw new Error("useSettings must be used inside <SettingsProvider>");
          return value;   // tsc: SettingsValue, null is excluded
        }
        ```

        Спокусливий скорочений запис — `createContext({} as SettingsValue)`. Це приведення типу: `tsc` вірить, а компонент поза provider отримує порожній об’єкт. Тоді після `const { setCurrency } = useSettings()` виклик `setCurrency("EUR")` падає з `TypeError: setCurrency is not a function` — повідомленням про функцію, а не про забутий provider, і далеко від справжньої причини. Перевірка на `null` у хуку перетворює цю помилку на зрозуміле повідомлення в першому ж рендері.

        Тип значення, яке ти кладеш у provider, — це тип **усього**, що бачать діти: якщо там `{ state, dispatch }`, кожен компонент отримає звужуваний `state.status` і типізований `dispatch`.
      en: |
        When several components need the request state, it is given through context, as in RE-04. The context's type must remember that outside a provider there is no value:

        ```tsx
        type SettingsValue = { currency: string; setCurrency: (code: string) => void };

        const SettingsContext = createContext<SettingsValue | null>(null);

        function useSettings(): SettingsValue {
          const value = useContext(SettingsContext);
          if (value === null) throw new Error("useSettings must be used inside <SettingsProvider>");
          return value;   // tsc: SettingsValue, null is excluded
        }
        ```

        A tempting shortcut is `createContext({} as SettingsValue)`. It is a type assertion: `tsc` believes it, and a component outside the provider gets an empty object. Then after `const { setCurrency } = useSettings()` the call `setCurrency("EUR")` crashes with `TypeError: setCurrency is not a function` — a message about a function, not about a forgotten provider, and far from the real cause. The `null` check in the hook turns that crash into a clear message on the very first render.

        The type of the value you put into the provider is the type of **everything** the children see: if it is `{ state, dispatch }`, every component gets a narrowable `state.status` and a typed `dispatch`.

  - id: recall
    kind: review
    title:
      uk: "Згадай: що повертає reducer"
      en: "Recall: what a reducer returns"
    items:
      - id: push-and-return
        from: re-04-03-reducers-typed
        prompt:
          uk: "Гілка reducer звичок написана так. Що побачить людина після `dispatch({ type: \"added\", habit })`?"
          en: "A branch of a habits reducer is written like this. What does the person see after `dispatch({ type: \"added\", habit })`?"
        code: |
          case "added":
            habits.push(action.habit);
            return habits;
        lang: ts
        runnable: false
        answer:
          type: choice
          options:
            - id: nothing
              text:
                uk: "Нічого не зміниться: reducer повернув той самий масив, і React не перемалює список"
                en: "Nothing changes: the reducer returned the same array, and React does not redraw the list"
            - id: new-item
              text:
                uk: "Нова звичка з’явиться в кінці списку"
                en: "The new habit appears at the end of the list"
              why:
                uk: "Масив справді змінився, але React порівнює старий і новий стан через `Object.is`. Той самий масив означає «нічого не змінилося», тож нового рендеру немає."
                en: "The array really changed, but React compares the old and the new state with `Object.is`. The same array means “nothing changed”, so there is no new render."
            - id: type-error
              text:
                uk: "`tsc` відхилить цю гілку, бо масив змінюють"
                en: "`tsc` rejects this branch, because the array is changed"
              why:
                uk: "Тип `Habit[]` дозволяє `push`. Від зміни захищає лише `readonly Habit[]` — і звичка повертати новий масив."
                en: "The type `Habit[]` allows `push`. Only `readonly Habit[]` protects from changes — together with the habit of returning a new array."
          correct: [nothing]
        explanation:
          uk: "Reducer — чиста функція: для зміни він повертає **новий** стан (`[...habits, action.habit]`), а для відхиленого action — **той самий**. Саме тому «той самий стан» у цьому уроці означає «нічого не сталося»: якби reducer змінював старий об’єкт, ці два випадки не можна було б розрізнити."
          en: "A reducer is a pure function: for a change it returns a **new** state (`[...habits, action.habit]`), and for a rejected action **the same** one. That is why “the same state” in this lesson means “nothing happened”: if the reducer changed the old object, the two cases could not be told apart."

  - id: records-context
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: records-context
    entry: main.tsx
    editable: [recordsState.ts, RecordsContext.tsx]
    strings:
      heading: { uk: "Звички", en: "Habits" }
      count: { uk: "Звичок:", en: "Habits:" }
      load: { uk: "Завантажити", en: "Load" }
      loadFailing: { uk: "Завантажити (сервер не відповідає)", en: "Load (the server fails)" }
      loading: { uk: "Завантаження…", en: "Loading…" }
      retry: { uk: "Спробувати ще раз", en: "Try again" }
      serverDown: { uk: "Сервер не відповідає.", en: "The server does not answer." }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      water: { uk: "Пити воду", en: "Drink water" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
    title:
      uk: "Стан запиту звичок у context"
      en: "The habit request state in a context"
    instructions:
      uk: |
        `App.tsx` (лише для перегляду) уже користується `RecordsProvider` і `useRecordsContext`: лічильник угорі й екран зі списком читають той самий стан.

        1. У `recordsState.ts` опиши `RecordsState` як discriminated union за полем `status` (варіанти — у коментарі) і напиши `recordsReducer` з п’ятьма дозволеними переходами з коментаря. Для кожної іншої пари «стан + action» повертай **той самий** об’єкт стану.
        2. У `RecordsContext.tsx` створи context для `RecordsValue`, який поза provider не має значення (`null`), напиши `RecordsProvider` — він тримає reducer (початковий стан `{ status: "idle" }`) і дає дітям `{ state, dispatch }`, — і `useRecordsContext`, що повертає значення найближчого provider, а поза ним кидає `Error` з назвою хука в повідомленні.

        Перевірки викликають `recordsReducer` для всіх пар «стан + action», малюють компонент поза provider і всередині нього, а потім натискають кнопки на сторінці.
      en: |
        `App.tsx` (read-only) already uses `RecordsProvider` and `useRecordsContext`: the counter at the top and the screen with the list read the same state.

        1. In `recordsState.ts` describe `RecordsState` as a discriminated union on the field `status` (the members are in the comment) and write `recordsReducer` with the five allowed transitions from the comment. For every other “state + action” pair return **the same** state object.
        2. In `RecordsContext.tsx` create a context for `RecordsValue` that has no value (`null`) outside a provider, write `RecordsProvider` — it holds the reducer (initial state `{ status: "idle" }`) and gives its children `{ state, dispatch }` — and `useRecordsContext`, which returns the nearest provider's value and outside one throws an `Error` whose message names the hook.

        The checks call `recordsReducer` for every “state + action” pair, draw a component outside and inside a provider, and then press the buttons on the page.
    testTitles:
      "started moves idle and success to loading":
        uk: "`started` веде `idle` і `success` у `{ status: \"loading\" }`"
        en: "`started` takes `idle` and `success` to `{ status: \"loading\" }`"
      "loaded and failed finish a loading request":
        uk: "`loaded` і `failed` завершують `loading`: `success` з `habits` або `failure` з `message`"
        en: "`loaded` and `failed` finish `loading`: `success` with `habits` or `failure` with `message`"
      "retried moves failure to loading":
        uk: "`retried` веде `failure` у `loading`"
        en: "`retried` takes `failure` to `loading`"
      "every other pair returns the same state object":
        uk: "Кожна інша пара «стан + action» повертає той самий об’єкт стану"
        en: "Every other “state + action” pair returns the same state object"
      "outside a provider the hook throws an error that names it":
        uk: "Поза provider `useRecordsContext` кидає помилку, у повідомленні якої є `useRecordsContext`"
        en: "Outside a provider `useRecordsContext` throws an error whose message contains `useRecordsContext`"
      "inside the provider the hook gives the idle state and a dispatch function":
        uk: "Усередині provider хук дає `{ status: \"idle\" }` і функцію `dispatch`"
        en: "Inside the provider the hook gives `{ status: \"idle\" }` and a `dispatch` function"
      "the page loads, fails and retries through one shared state":
        uk: "На сторінці невдале завантаження показує помилку, «Спробувати ще раз» — список, а лічильник бачить той самий стан"
        en: "On the page a failed load shows the error, “Try again” shows the list, and the counter sees the same state"
    hints:
      nudge:
        uk: "Почни з автомата: намалюй чотири стани й п’ять стрілок з коментаря. У reducer кожна гілка `case` спершу перевіряє, чи є стрілка з поточного `state.status`."
        en: "Start with the machine: draw the four states and the five arrows from the comment. In the reducer every `case` first checks whether there is an arrow from the current `state.status`."
      explanation:
        uk: "Перехід, якого немає, — це `return state;` на початку гілки, як у прикладі з запитом справ: так ти повертаєш той самий об’єкт. Для context візьми шаблон `useSettings` з пояснення: union з `null` у `createContext`, `null` як значення за замовчуванням і перевірка в хуку. `useReducer` викликай у provider, а не в хуку: хук лише читає context, інакше кожен компонент отримає власний стан."
        en: "A transition that does not exist is `return state;` at the start of the branch, as in the task request example: that way you return the same object. For the context take the `useSettings` pattern from the explanation: a union with `null` in `createContext`, `null` as the default, and the check in the hook. Call `useReducer` in the provider, not in the hook: the hook only reads the context, otherwise every component gets its own state."
    solutionNote:
      uk: "`RecordsState` не дозволяє записати список разом із помилкою, а reducer пропускає лише п’ять стрілок автомата — решту пар він ігнорує, повертаючи той самий стан. Provider тримає один `useReducer`, тому лічильник і екран бачать одне й те саме. `null` за замовчуванням і перевірка в хуку перетворюють забутий provider на зрозуміле повідомлення."
      en: "`RecordsState` does not let a list and an error be written together, and the reducer lets through only the machine's five arrows — it ignores the other pairs by returning the same state. The provider holds a single `useReducer`, so the counter and the screen see the same thing. A `null` default and the check in the hook turn a forgotten provider into a clear message."
    feedback:
      - when: { test: "started moves idle and success to loading" }
        message:
          uk: "Ця перевірка чекає рівно `{ status: \"loading\" }` після `started` зі стану `idle` і зі стану `success` — без старих полів на кшталт `habits`. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "This check expects exactly `{ status: \"loading\" }` after `started` from `idle` and from `success` — without old fields such as `habits`. If every check fails at once, fix the first console error first."
      - when: { test: "loaded and failed finish a loading request" }
        message:
          uk: "Зі стану `loading` перевірка чекає `{ status: \"success\", habits }` після `loaded` і `{ status: \"failure\", message }` після `failed`, з полями з action."
          en: "From `loading` the check expects `{ status: \"success\", habits }` after `loaded` and `{ status: \"failure\", message }` after `failed`, with the fields from the action."
      - when: { test: "every other pair returns the same state object" }
        message:
          uk: "Перевірка пробує всі пари без стрілки (наприклад, `idle + loaded` чи `loading + started`) і чекає **той самий** об’єкт стану, а не копію. Назва пари, що не пройшла, — у тексті помилки."
          en: "The check tries every pair without an arrow (for example `idle + loaded` or `loading + started`) and expects **the same** state object, not a copy. The failing pair is named in the error text."
      - when: { test: "outside a provider the hook throws an error that names it" }
        message:
          uk: "Поза provider `useContext` має повернути значення за замовчуванням `null`, а хук — кинути `Error`, у повідомленні якого є `useRecordsContext`. Значення за замовчуванням на кшталт `{}` чи заглушки помилки не дають."
          en: "Outside a provider `useContext` must return the default `null`, and the hook must throw an `Error` whose message contains `useRecordsContext`. A default such as `{}` or a stub gives no error."
      - when: { test: "the page loads, fails and retries through one shared state" }
        message:
          uk: "Ця перевірка натискає «Завантажити (сервер не відповідає)», чекає `role=\"alert\"` з повідомленням, потім «Спробувати ще раз» і три звички, а лічильник має показати 3. Якщо лічильник не змінюється, кожен компонент, імовірно, має власний `useReducer`: він має бути один — у `RecordsProvider`."
          en: "This check presses “Load (the server fails)”, waits for `role=\"alert\"` with the message, then “Try again” and three habits, and the counter must show 3. If the counter does not change, each component probably has its own `useReducer`: there must be one — in `RecordsProvider`."

  - id: to-project
    kind: transfer
    capstoneStep: RE-09
    body:
      uk: "У кроці проєкту reducer твого застосунку отримає стан запиту як discriminated union, а context — значення без «порожнього» за замовчуванням і хук, що падає поза provider. Неможливі стани зникнуть ще до запуску."
      en: "In the project step your app's reducer gets the request state as a discriminated union, and the context gets a value without an “empty” default and a hook that fails outside its provider. Impossible states disappear before anything runs."
