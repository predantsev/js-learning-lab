id: re-09-02-typed-reducers-context
unit: RE-09
title:
  uk: "Типізовані reducers і context"
  en: "Typed reducers and context"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Описати стан reducer як discriminated union, щоб неможливі поєднання (завантаження з даними й помилкою водночас) не можна було записати."
    en: "Model reducer state as a discriminated union so impossible combinations (loading with both data and an error) cannot be written."
  - uk: "Типізувати actions як union з вичерпною перевіркою `never` і дати типізований context, хук якого голосно падає поза своїм provider."
    en: "Type actions as a union handled exhaustively with a `never` check, and provide a typed context whose hook fails loudly outside its provider."
prerequisites: [re-09-01-typed-ui-review, re-04-03-reducers-typed, js-14-03-unions-narrowing]
subskills:
  - { family: P-05, skill: "typed reducers/context", depth: practice }
  - { family: R-03, skill: "reducer state transitions", depth: practice }
glossary: [impossible-state]
selfCheck: [predict-loading-dispatches, records-context]

blocks:
  - id: three-flags
    kind: explanation
    title:
      uk: "Три прапорці дають вісім станів, а потрібно чотири"
      en: "Three flags give eight states, but four are needed"
    body:
      uk: |
        Запит часто описують трьома полями:

        ```ts
        type TasksFlags = { isLoading: boolean; error: string | null; tasks: Task[] | null };
        ```

        Два значення в кожного — це вісім поєднань. Справжніх ситуацій чотири: нічого не запитано, запит іде, список прийшов, запит не вдався. Решта — [[impossible-state|неможливі стани]]: `{ isLoading: true, error: "…", tasks: [...] }` іде завантаження, є помилка і є список одночасно. `tsc` пропускає такий об’єкт, а екран мусить вирішувати, що з цього показати.

        Discriminated union з розділу про TypeScript описує рівно чотири ситуації:

        ```ts
        type TasksState =
          | { status: "idle" }
          | { status: "loading" }
          | { status: "success"; tasks: Task[] }
          | { status: "failure"; message: string };
        ```

        Кожен варіант несе лише свої поля: у `loading` немає `tasks`, у `success` немає `message`. Записати неможливий стан тепер не вийде — `tsc` відхилить такий об’єкт. А екран після `if (state.status === "success")` знає, що `state.tasks` точно є.
      en: |
        A request is often described with three fields:

        ```ts
        type TasksFlags = { isLoading: boolean; error: string | null; tasks: Task[] | null };
        ```

        Two values each make eight combinations. There are four real situations: nothing requested, a request running, the list arrived, the request failed. The rest are [[impossible-state|impossible states]]: `{ isLoading: true, error: "…", tasks: [...] }` is loading, has an error and has a list at once. `tsc` lets such an object through, and the screen has to decide what to show.

        A discriminated union from the TypeScript unit describes exactly four situations:

        ```ts
        type TasksState =
          | { status: "idle" }
          | { status: "loading" }
          | { status: "success"; tasks: Task[] }
          | { status: "failure"; message: string };
        ```

        Each member carries only its own fields: `loading` has no `tasks`, `success` has no `message`. An impossible state can no longer be written — `tsc` rejects such an object. And after `if (state.status === "success")` the screen knows `state.tasks` is there.

  - id: two-guards
    kind: explanation
    title:
      uk: "Дві варти: тип і reducer"
      en: "Two guards: the type and the reducer"
    body:
      uk: |
        Actions теж union, а reducer пропускає лише переходи, для яких є стрілка в автоматі станів:

        ```ts
        case "succeeded":
          if (state.status !== "loading") return state;   // no request running: ignore
          return { status: "success", tasks: action.tasks };
        ```

        Ці дві варти ловлять різне:

        - **`tsc`** перевіряє **форму** action ще до запуску: невідомий `type`, пропущене поле. Котрий стан буде в момент `dispatch`, він не знає — це вирішиться лише під час виконання.
        - **Reducer** перевіряє **порядок** під час виконання: відповідь сервера, що прийшла, коли запиту вже немає, повертає той самий стан, і React нічого не перемальовує.

        Перевірка `never` у `default` зв’язує обидві: додаси новий action в union — `tsc` покаже `default`, куди він дійшов без свого `case`.
      en: |
        Actions are a union too, and the reducer lets through only the transitions that have an arrow in the state machine:

        ```ts
        case "succeeded":
          if (state.status !== "loading") return state;   // no request running: ignore
          return { status: "success", tasks: action.tasks };
        ```

        These two guards catch different things:

        - **`tsc`** checks the **shape** of an action before running: an unknown `type`, a missing field. Which state there will be at the moment of `dispatch` it does not know — that is decided only at runtime.
        - **The reducer** checks the **order** at runtime: a server answer that arrives when no request is running returns the same state, and React redraws nothing.

        The `never` check in `default` ties the two together: add a new action to the union, and `tsc` points at the `default` it reached without its own `case`.

  - id: predict-loading-dispatches
    kind: prediction
    lang: tsx
    runnable: false
    prompt:
      uk: "Стан — `{ status: \"loading\" }`, reducer — як у поясненні вище (з варіантами `started`, `succeeded` і `failed`). Кожен рядок A–D пробують окремо, щоразу з цього самого стану. Які твердження правдиві? Обери всі."
      en: "The state is `{ status: \"loading\" }`, the reducer is as in the explanation (with the members `started`, `succeeded` and `failed`). Each line A–D is tried on its own, every time from this same state. Which statements are true? Choose all."
    code: |
      type TasksAction =
        | { type: "started" }
        | { type: "succeeded"; tasks: Task[] }
        | { type: "failed"; message: string };

      // state: { status: "loading" }
      dispatch({ type: "succeeded", tasks: answer }); // A
      dispatch({ type: "succeeded" });                // B
      dispatch({ type: "started" });                  // C
      dispatch({ type: "saved" });                    // D
    answer:
      type: multi
      options:
        - id: b-rejected
          text:
            uk: "`tsc` відхиляє B"
            en: "`tsc` rejects B"
        - id: d-rejected
          text:
            uk: "`tsc` відхиляє D"
            en: "`tsc` rejects D"
        - id: c-rejected
          text:
            uk: "`tsc` відхиляє C, бо запит уже йде"
            en: "`tsc` rejects C, because a request is already running"
          why:
            uk: "Типи не знають, який стан буде в момент виклику. `{ type: \"started\" }` — правильна форма action, тож `tsc` його пропускає; порядок перевіряє reducer під час виконання."
            en: "Types do not know which state there will be at the moment of the call. `{ type: \"started\" }` is a correct action shape, so `tsc` lets it through; the reducer checks the order at runtime."
        - id: c-ignored
          text:
            uk: "Після C стан лишається тим самим об’єктом `{ status: \"loading\" }`"
            en: "After C the state stays the same object `{ status: \"loading\" }`"
        - id: a-ignored
          text:
            uk: "A теж ігнорується: список, що прийшов ззовні, reducer не приймає"
            en: "A is ignored too: the reducer does not accept a list that came from outside"
          why:
            uk: "Для `loading` + `succeeded` стрілка є: це й є очікувана відповідь. Reducer повертає `{ status: \"success\", tasks: answer }`."
            en: "There is an arrow for `loading` + `succeeded`: that is exactly the expected answer. The reducer returns `{ status: \"success\", tasks: answer }`."
      correct: [b-rejected, d-rejected, c-ignored]
    explanation:
      uk: "Перевірено `tsc` 7.0.2 і в пісочниці. B — `TS2345`: у варіанті `succeeded` бракує `tasks`. D — `TS2322`: `\"saved\"` немає серед `\"failed\" | \"started\" | \"succeeded\"`. C має правильну форму, тож `tsc` мовчить, а reducer повертає той самий стан: другий запит, поки йде перший, не починається. A — звичайний перехід `loading → success`."
      en: "Checked with `tsc` 7.0.2 and in the sandbox. B — `TS2345`: the `succeeded` member lacks `tasks`. D — `TS2322`: `\"saved\"` is not among `\"failed\" | \"started\" | \"succeeded\"`. C has a correct shape, so `tsc` is silent, and the reducer returns the same state: a second request does not start while the first is running. A is the ordinary transition `loading → success`."

  - id: request-machine
    kind: visual
    visual: diagram
    title:
      uk: "Автомат одного запиту"
      en: "The state machine of one request"
    textEquivalent:
      uk: "Чотири стани: idle, loading, success і failure. Action started веде з idle у loading. З loading action succeeded веде в success, а failed — у failure. З success і з failure action started знову веде в loading: оновлення й нова спроба. Кожна стрілка — пара «стан + action», для якої reducer повертає новий стан. Для пари без стрілки, наприклад idle + succeeded, reducer повертає той самий стан. tsc таку пару не відхиляє: форма action правильна, а котрий стан буде в момент dispatch, відомо лише під час виконання. Відхиляє її reducer."
      en: "Four states: idle, loading, success and failure. The action started leads from idle to loading. From loading the action succeeded leads to success, and failed to failure. From success and from failure the action started leads to loading again: a refresh and a new attempt. Every arrow is a “state + action” pair for which the reducer returns a new state. For a pair without an arrow, such as idle + succeeded, the reducer returns the same state. tsc does not reject such a pair: the action's shape is correct, and which state there will be at the moment of dispatch is known only at runtime. The reducer rejects it."
    spec:
      layout: grid
      nodes:
        - { id: idle, col: 0, row: 0, label: "idle", shape: round, w: 120 }
        - { id: loading, col: 1, row: 0, label: "loading", shape: round, w: 120 }
        - { id: failure, col: 0, row: 1, label: "failure", shape: round, w: 120 }
        - { id: success, col: 1, row: 1, label: "success", shape: round, w: 120 }
        - { id: rejected, col: 0, row: 2, label: { uk: "той самий стан", en: "same state" }, shape: note, w: 140 }
      edges:
        - { id: start, from: idle, to: loading, label: "started" }
        - { id: ok, from: loading, to: success, label: "succeeded" }
        - { id: fail, from: loading, to: failure, label: "failed" }
        - { id: again, from: failure, to: loading, label: "started" }
        - { id: refresh, from: success, to: loading, label: "started", kind: dashed }
        - { id: stray, from: idle, to: rejected, label: "succeeded", kind: dashed }
      hidden: [rejected, stray, refresh, again]
      steps:
        - caption:
            uk: "На початку стан — `idle`: нічого не запитано. `started` веде в `loading`."
            en: "At the start the state is `idle`: nothing has been requested. `started` leads to `loading`."
          highlight: [idle, start, loading]
        - caption:
            uk: "З `loading` є дві стрілки: `succeeded` веде в `success` зі списком, `failed` — у `failure` з повідомленням."
            en: "`loading` has two arrows: `succeeded` leads to `success` with the list, `failed` to `failure` with a message."
          highlight: [loading, ok, fail, success, failure]
        - caption:
            uk: "`started` з `failure` — нова спроба, а з `success` — оновлення списку. Обидві стрілки ведуть назад у `loading`."
            en: "`started` from `failure` is a new attempt, and from `success` a refresh. Both arrows lead back to `loading`."
          show: [again, refresh]
          highlight: [again, refresh, loading]
        - caption:
            uk: "`succeeded`, коли стан — `idle`: стрілки немає. Форма action правильна, тож `tsc` мовчить, а reducer повертає **той самий** стан."
            en: "`succeeded` while the state is `idle`: there is no arrow. The action's shape is correct, so `tsc` is silent, and the reducer returns **the same** state."
          show: [rejected, stray]
          highlight: [idle, stray, rejected]
          dim: [loading, success, failure]

  - id: task-loader
    kind: example
    runtime: browser-react
    dir: task-loader
    entry: main.tsx
    strings:
      heading: { uk: "Справи з сервера", en: "Tasks from the server" }
      start: { uk: "Почати запит", en: "Start request" }
      answer: { uk: "Сервер відповів", en: "Server answered" }
      fail: { uk: "Сервер не відповів", en: "Server failed" }
      idleText: { uk: "Ще нічого не запитано.", en: "Nothing requested yet." }
      loadingText: { uk: "Завантаження…", en: "Loading…" }
      offline: { uk: "Немає зв’язку з сервером.", en: "No connection to the server." }
      ignored: { uk: "проігноровано", en: "ignored" }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
    title:
      uk: "Reducer запиту з журналом переходів"
      en: "A request reducer with a transition log"
    body:
      uk: |
        Тут сервера немає: три кнопки на вкладці **Сторінка** самі надсилають actions, тож ти можеш надіслати їх у будь-якому порядку. `loggedReducer` у `tasksRequest.ts` виводить у консоль кожен перехід, а action, який нічого не змінив, позначає як «проігноровано». Натисни **Запустити** й спробуй звичайний шлях: «Почати запит», потім «Сервер відповів».
      en: |
        There is no server here: the three buttons on the **Page** tab send the actions themselves, so you can send them in any order. `loggedReducer` in `tasksRequest.ts` prints every transition to the console and marks an action that changed nothing as “ignored”. Press **Run** and try the normal path: “Start request”, then “Server answered”.
    tryIt:
      uk: |
        1. Натисни **Запустити** ще раз і почни з «Сервер відповів»: у консолі `idle + succeeded → проігноровано`, сторінка не змінилась. Тепер «Почати запит» двічі: другий рядок теж `проігноровано`.
        2. У `tasksReducer` у гілці `case "succeeded":` видали рядок коду `if (state.status !== "loading") return state;`. Запусти й знову почни з «Сервер відповів»: список з’явився без жодного запиту. Типи цього не помітили — порядок охороняв лише рядок, який ти прибрав. Поверни його.
      en: |
        1. Press **Run** again and start with “Server answered”: the console shows `idle + succeeded → ignored`, and the page did not change. Now press “Start request” twice: the second line is `ignored` too.
        2. In `tasksReducer`, in the branch `case "succeeded":`, delete the line of code `if (state.status !== "loading") return state;`. Run and start with “Server answered” again: the list appears without any request. The types did not notice — only the line you removed guarded the order. Put it back.

  - id: follow-the-compiler
    kind: local-task
    runtime: local-web
    title:
      uk: "Неможливий стан і новий action під наглядом tsc"
      en: "An impossible state and a new action under tsc"
    intro:
      uk: |
        Ти працюєш у лабораторії `~/js-course/ts-lab`, як у попередньому уроці. Цьому файлу React не потрібен — лише `tsc`. Команди перевірено в macOS із Node.js v25.2.1, npm 11.6.2 і TypeScript 7.0.2; у Linux і Windows їх не запускали.

        **Якщо теки `ts-lab` немає**, створи її так, а тоді створи в ній `tsconfig.json` із вмістом з локального завдання уроку «Типізовані props, state, події та hooks — глибше». Перший рядок потрібен, лише якщо немає й теки `~/js-course`.

        ```sh
        mkdir ~/js-course
        mkdir ~/js-course/ts-lab
        cd ~/js-course/ts-lab
        npm init -y
        npm pkg set type=module
        npm install --save-dev typescript
        ```

        **Файл `src/re09/tasksRequest.ts` для кроку 2** — reducer з прикладу без журналу і два навмисно неможливі стани в кінці:

        ```ts
        export type Task = { readonly id: string; title: string; done: boolean };

        // One request, four situations. Each status carries only the fields that exist in it.
        export type TasksState =
          | { status: "idle" }
          | { status: "loading" }
          | { status: "success"; tasks: Task[] }
          | { status: "failure"; message: string };

        export type TasksAction =
          | { type: "started" }
          | { type: "succeeded"; tasks: Task[] }
          | { type: "failed"; message: string };

        export function tasksReducer(state: TasksState, action: TasksAction): TasksState {
          switch (action.type) {
            case "started":
              // A new request starts from idle, after a success (refresh) or after a failure.
              if (state.status === "loading") return state;
              return { status: "loading" };
            case "succeeded":
              // An answer means something only while a request is running.
              if (state.status !== "loading") return state;
              return { status: "success", tasks: action.tasks };
            case "failed":
              if (state.status !== "loading") return state;
              return { status: "failure", message: action.message };
            default: {
              const unhandled: never = action;
              throw new Error(`Unknown action: ${JSON.stringify(unhandled)}`);
            }
          }
        }

        export const stillLoading: TasksState = { status: "loading", tasks: [] };
        export const emptySuccess: TasksState = { status: "success" };
        ```

        **Що показує `tsc` на кроці 2:**

        ```text
        src/re09/tasksRequest.ts(35,62): error TS2353: Object literal may only specify known properties, and 'tasks' does not exist in type '{ status: "loading"; }'.
        src/re09/tasksRequest.ts(36,14): error TS2322: Type '{ status: "success"; }' is not assignable to type 'TasksState'.
          Property 'tasks' is missing in type '{ status: "success"; }' but required in type '{ status: "success"; tasks: Task[]; }'.
        ```

        **Що показує `tsc` на кроці 5:**

        ```text
        src/re09/tasksRequest.ts(30,13): error TS2322: Type '{ type: "retried"; }' is not assignable to type 'never'.
        ```

        **Гілка для кроку 6** — встав її перед `default: {`:

        ```ts
            case "retried":
              // "Try again" exists only on the failure screen.
              if (state.status !== "failure") return state;
              return { status: "loading" };
        ```
      en: |
        You work in the lab `~/js-course/ts-lab`, as in the previous lesson. This file needs no React — only `tsc`. The commands were checked on macOS with Node.js v25.2.1, npm 11.6.2 and TypeScript 7.0.2; they were not run on Linux or Windows.

        **If there is no `ts-lab` folder**, create it like this, then create a `tsconfig.json` in it with the contents from the local task of the lesson “Typed props, state, events and hooks, in depth”. The first line is needed only when there is no `~/js-course` folder either.

        ```sh
        mkdir ~/js-course
        mkdir ~/js-course/ts-lab
        cd ~/js-course/ts-lab
        npm init -y
        npm pkg set type=module
        npm install --save-dev typescript
        ```

        **The file `src/re09/tasksRequest.ts` for step 2** — the reducer from the example without the log, and two impossible states at the end on purpose:

        ```ts
        export type Task = { readonly id: string; title: string; done: boolean };

        // One request, four situations. Each status carries only the fields that exist in it.
        export type TasksState =
          | { status: "idle" }
          | { status: "loading" }
          | { status: "success"; tasks: Task[] }
          | { status: "failure"; message: string };

        export type TasksAction =
          | { type: "started" }
          | { type: "succeeded"; tasks: Task[] }
          | { type: "failed"; message: string };

        export function tasksReducer(state: TasksState, action: TasksAction): TasksState {
          switch (action.type) {
            case "started":
              // A new request starts from idle, after a success (refresh) or after a failure.
              if (state.status === "loading") return state;
              return { status: "loading" };
            case "succeeded":
              // An answer means something only while a request is running.
              if (state.status !== "loading") return state;
              return { status: "success", tasks: action.tasks };
            case "failed":
              if (state.status !== "loading") return state;
              return { status: "failure", message: action.message };
            default: {
              const unhandled: never = action;
              throw new Error(`Unknown action: ${JSON.stringify(unhandled)}`);
            }
          }
        }

        export const stillLoading: TasksState = { status: "loading", tasks: [] };
        export const emptySuccess: TasksState = { status: "success" };
        ```

        **What `tsc` shows in step 2:**

        ```text
        src/re09/tasksRequest.ts(35,62): error TS2353: Object literal may only specify known properties, and 'tasks' does not exist in type '{ status: "loading"; }'.
        src/re09/tasksRequest.ts(36,14): error TS2322: Type '{ status: "success"; }' is not assignable to type 'TasksState'.
          Property 'tasks' is missing in type '{ status: "success"; }' but required in type '{ status: "success"; tasks: Task[]; }'.
        ```

        **What `tsc` shows in step 5:**

        ```text
        src/re09/tasksRequest.ts(30,13): error TS2322: Type '{ type: "retried"; }' is not assignable to type 'never'.
        ```

        **The branch for step 6** — insert it before `default: {`:

        ```ts
            case "retried":
              // "Try again" exists only on the failure screen.
              if (state.status !== "failure") return state;
              return { status: "loading" };
        ```
    tools:
      - { name: "Node.js", version: "22 or newer", note: { uk: "перевірено з v25.2.1", en: "checked with v25.2.1" } }
      - { name: "TypeScript", version: "7.x", note: { uk: "у теці `ts-lab`; дає команду `tsc`", en: "in the `ts-lab` folder; provides the `tsc` command" } }
    steps:
      - text:
          uk: "Перейди в лабораторію. Якщо термінал каже, що такої теки немає, спершу створи її командами з початку завдання."
          en: "Go to the lab. If the terminal says there is no such folder, create it first with the commands at the start of the task."
        command: "cd ~/js-course/ts-lab"
      - text:
          uk: "Створи файл `src/re09/tasksRequest.ts` із вмістом для кроку 2 (тека `src/re09` уже є з попереднього уроку; якщо ні — створи її). Запусти перевірку."
          en: "Create the file `src/re09/tasksRequest.ts` with the contents for step 2 (the folder `src/re09` exists from the previous lesson; if not, create it). Run the check."
        command: "npx tsc --noEmit"
        expect:
