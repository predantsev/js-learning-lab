      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Надійний список читання"
      en: "A reliable reading list"
    instructions:
      uk: |
        Контракти — у `readingTypes.ts` (лише для перегляду): `Book`, `ApiBook`, `ReadingState`, `ReadingAction`, `BookDraft`. Сервер-заглушка — `readingServer.ts`, обкладинки — `BookCover.tsx`, обидва лише для перегляду. Решту файлів можна змінювати як завгодно, але назви експортів лишаються.

        **Дані API.** `parseBook(input: unknown)` у `readingModel.ts` повертає `{ ok: true, value: Book }` (назва й автор без пробілів по краях, `page_count` → `pages`, `to_read`/`reading`/`finished` → `toRead`/`reading`/`done`) або `{ ok: false, errors }` з ключами: не об’єкт (і масив теж) — рівно `{ record: "notObject" }`; порожній чи не текстовий `id`, `title`, `author` — `"required"` під тими самими назвами; `page_count` не ціле додатне число — `pages: "positiveInteger"`; інший `state` — `status: "unknownStatus"`. Кожна відповідь сервера — список і відповідь на запис — проходить схему.

        **Переходи.** `readingReducer`: `loading + loaded → ready`, `ready + loaded → ready` (новий список після запису), `loading + loadFailed → failed`, `failed + reloaded → loading`; кожна інша пара повертає той самий об’єкт стану. У `transitions.test.ts` — щонайменше 8 тестів, що проходять із твоїм reducer і викликають його через `subject.readingReducer`. Перевірки підставлять туди два зламані reducer — один стирає список, коли падає оновлення, другий приймає запізнілу відповідь після збою — і чекатимуть, що твої тести це помітять.

        **Context.** `useReadingList()` поза `ReadingListProvider` кидає помилку, у повідомленні якої є `useReadingList`. Provider загортає лише функцію списку, а не всю сторінку.

        **Записи й оновлення.** «Додати книжку» надсилає `createBook` з `{ title, author, page_count, state: "to_read" }`, а «Прочитано» — `updateStatus(id, "finished")`. Після кожного вдалого запису список запитується з сервера рівно один раз і показує те, що там тепер; поле назви після вдалого додавання порожнє.

        **Збої.**
        - Зіпсований список або збій запиту списку — `role="alert"` з кнопкою «Спробувати ще раз», яка завантажує список знову. Жодного падіння рендеру.
        - Недійсні поля форми (порожні назва чи автор, сторінки — не ціле додатне число) — `aria-invalid="true"` і `aria-describedby` з текстом «Обов’язкове поле.» чи «Ціле число, більше за нуль.»; запит при цьому не надсилається.
        - Відхилений запис — `role="alert"` з текстом «Не вдалося зберегти. Спробуй ще раз.», а введене лишається в полях.
        - Обкладинка, що падає під час рендеру, дає в **своїй** картці `role="alert"` з текстом «Обкладинку не вдалося показати.»; назва книжки й інші картки лишаються.

        Кожна книжка — `<li data-id={book.id}>` з назвою, автором і статусом; кнопки й підписи полів — з тими текстами, що вже є.

        **Рішення.** У `decisions.md` під кожним із двох запитань напиши відповідь (щонайменше 40 символів): що йде через context, а що лишається локальним, і які модулі міг би взяти мобільний чи серверний застосунок.
      en: |
        The contracts are in `readingTypes.ts` (read-only): `Book`, `ApiBook`, `ReadingState`, `ReadingAction`, `BookDraft`. The stub server is `readingServer.ts` and the covers are `BookCover.tsx`, both read-only. You may change the other files as you like, but the export names stay.

        **API data.** `parseBook(input: unknown)` in `readingModel.ts` returns `{ ok: true, value: Book }` (title and author without spaces at the ends, `page_count` → `pages`, `to_read`/`reading`/`finished` → `toRead`/`reading`/`done`) or `{ ok: false, errors }` with the keys: not an object (an array included) — exactly `{ record: "notObject" }`; an empty or non-text `id`, `title`, `author` — `"required"` under the same names; a `page_count` that is not a positive whole number — `pages: "positiveInteger"`; any other `state` — `status: "unknownStatus"`. Every server answer — the list and the answer to a write — goes through the schema.

        **Transitions.** `readingReducer`: `loading + loaded → ready`, `ready + loaded → ready` (a new list after a write), `loading + loadFailed → failed`, `failed + reloaded → loading`; every other pair returns the same state object. `transitions.test.ts` has at least 8 tests that pass with your reducer and call it through `subject.readingReducer`. The checks put two broken reducers there — one wipes the list when a refresh fails, the other accepts a late answer after a failure — and expect your tests to notice.

        **Context.** `useReadingList()` outside `ReadingListProvider` throws an error whose message contains `useReadingList`. The provider wraps only the list feature, not the whole page.

        **Writes and refreshing.** “Add book” sends `createBook` with `{ title, author, page_count, state: "to_read" }`, and “Mark as read” sends `updateStatus(id, "finished")`. After every successful write the list is requested from the server exactly once and shows what is there now; after a successful add the title field is empty.

        **Failures.**
        - A damaged list or a failed list request — `role="alert"` with a “Try again” button that loads the list again. No render crash.
        - Invalid form fields (an empty title or author, pages that are not a positive whole number) — `aria-invalid="true"` and `aria-describedby` with the text “This field is required.” or “A whole number greater than zero.”; no request is sent then.
        - A rejected write — `role="alert"` with the text “Could not save. Try again.”, and what was typed stays in the fields.
        - A cover that crashes while rendering gives, in **its own** card, a `role="alert"` with the text “The cover could not be shown.”; the book's title and the other cards stay.

        Each book is an `<li data-id={book.id}>` with its title, author and status; buttons and field labels keep the texts they already have.

        **Decisions.** In `decisions.md`, under each of the two questions, write an answer (at least 40 characters): what goes through the context and what stays local, and which modules a native or server app could reuse.
    testTitles:
      "parseBook turns a valid API book into a Book":
        uk: "`parseBook` перетворює коректну `ApiBook` на `Book`"
        en: "`parseBook` turns a valid `ApiBook` into a `Book`"
      "parseBook rejects bad records with the field keys from the task":
        uk: "`parseBook` відхиляє погані записи з ключами із завдання"
        en: "`parseBook` rejects bad records with the keys from the task"
      "a damaged list shows an alert with Try again, which loads the good list":
        uk: "Зіпсований список — alert із «Спробувати ще раз», що завантажує справний список"
        en: "A damaged list gives an alert with “Try again”, which loads the good list"
      "a failed list request shows the alert too":
        uk: "Збій запиту списку теж показує alert"
        en: "A failed list request shows the alert too"
      "the reducer follows the transition table":
        uk: "`readingReducer` відповідає таблиці переходів із завдання"
        en: "`readingReducer` follows the transition table from the task"
      "useReadingList throws outside its provider, naming itself":
        uk: "Поза provider `useReadingList` кидає помилку зі своєю назвою"
        en: "Outside its provider `useReadingList` throws an error that names it"
      "invalid form fields are marked and described":
        uk: "Недійсні поля форми позначені й описані, запит не надсилається"
        en: "Invalid form fields are marked and described, and no request is sent"
      "adding a book sends the API payload and requests the list again":
        uk: "Додавання надсилає API-модель і рівно один раз знову запитує список"
        en: "Adding sends the API model and requests the list again exactly once"
      "a rejected save is announced and keeps the draft":
        uk: "Відхилений запис оголошено в `role=\"alert\"`, а введене лишається"
        en: "A rejected write is announced in `role=\"alert\"`, and what was typed stays"
      "marking a book done requests the list again and shows the new status":
        uk: "«Прочитано» знову запитує список і показує новий статус"
        en: "“Mark as read” requests the list again and shows the new status"
      "a crashing cover shows a fallback in its own card only":
        uk: "Обкладинка, що падає, дає запасний текст лише у своїй картці"
        en: "A crashing cover gives a fallback in its own card only"
      "your transition table has at least 8 tests and passes on your reducer":
        uk: "У `transitions.test.ts` щонайменше 8 тестів, і всі проходять із твоїм reducer"
        en: "`transitions.test.ts` has at least 8 tests, all passing with your reducer"
      "your table catches a reducer that wipes the list when a refresh fails":
        uk: "Твоя таблиця ловить reducer, що стирає список, коли падає оновлення"
        en: "Your table catches a reducer that wipes the list when a refresh fails"
      "your table catches a reducer that accepts a late answer after a failure":
        uk: "Твоя таблиця ловить reducer, що приймає запізнілу відповідь після збою"
        en: "Your table catches a reducer that accepts a late answer after a failure"
      "decisions.md answers both questions":
        uk: "У `decisions.md` є відповіді на обидва запитання"
        en: "`decisions.md` answers both questions"
    solutionNote:
      uk: "Межа даних — `readingModel.ts`: усе, що приходить із сервера, проходить `parseBook`, і зіпсована відповідь стає станом помилки, а не падінням. `readingReducer` пропускає лише п’ять стрілок, а таблиця переходів закріплює й відхилені пари — саме там ховалися два зламані reducer. Provider володіє лише станом запиту й записами; чернетка, помилки полів і перемикач компактності — локальні. Після кожного запису список запитують знову, тож екран показує сервер, а не здогад. Boundary стоїть навколо обкладинки, бо лише там може статися збій рендеру; решта збоїв — оброблені стани в моделі помилок. `readingTypes.ts`, `readingModel.ts` і `readingReducer.ts` нічого не знають про React DOM — їх можна взяти на іншу платформу."
      en: "The data boundary is `readingModel.ts`: everything that comes from the server goes through `parseBook`, and a damaged answer becomes an error state, not a crash. `readingReducer` lets through only five arrows, and the transition table pins down the rejected pairs too — exactly where the two broken reducers hid. The provider owns only the request state and the writes; the draft, the field errors and the compact switch are local. After every write the list is requested again, so the screen shows the server, not a guess. The boundary sits around the cover, because only there can a render crash happen; the other failures are handled states in the error model. `readingTypes.ts`, `readingModel.ts` and `readingReducer.ts` know nothing about React DOM — they can be taken to another platform."
    feedback:
      - when: { test: "parseBook rejects bad records with the field keys from the task" }
        message:
          uk: "Ця перевірка дає записи з одним поганим полем і чекає ключ і значення помилки рівно як у завданні; для `null` і масиву — рівно `{ record: \"notObject\" }`. Текст `\"240\"` і число `12.5` — не ціле додатне число. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "This check gives records with one bad field and expects the error key and value exactly as in the task; for `null` and an array exactly `{ record: \"notObject\" }`. The text `\"240\"` and the number `12.5` are not a positive whole number. If every check fails at once, fix the first console error first."
      - when: { test: "a damaged list shows an alert with Try again, which loads the good list" }
        message:
          uk: "Перевірка віддає список, у якому `page_count` — текст. Чекається `role=\"alert\"` з кнопкою «Спробувати ще раз» усередині, жодного пункту списку й жодної помилки рендеру, а після натискання — дві книжки."
          en: "The check returns a list in which `page_count` is text. It expects a `role=\"alert\"` with a “Try again” button inside, no list item and no render error, and two books after the press."
      - when: { test: "adding a book sends the API payload and requests the list again" }
        message:
          uk: "Після вдалого додавання на сервері має лежати `{ id: \"b-03\", title, author, page_count: 240, state: \"to_read\" }`, список має бути запитано рівно один раз, а поле назви — порожнє."
          en: "After a successful add the server must hold `{ id: \"b-03\", title, author, page_count: 240, state: \"to_read\" }`, the list must have been requested exactly once, and the title field must be empty."
      - when: { test: "marking a book done requests the list again and shows the new status" }
        message:
          uk: "Перевірка змінює назву першої книжки на сервері, а тоді натискає «Прочитано». Нову назву видно лише тоді, коли після запису список запитано знову; чекається рівно один такий запит."
          en: "The check renames the first book on the server, then presses “Mark as read”. The new title shows only when the list is requested again after the write; exactly one such request is expected."
      - when: { test: "a crashing cover shows a fallback in its own card only" }
        message:
          uk: "Обкладинка книжки `b-02` падає під час рендеру. Чекається `role=\"alert\"` з текстом про обкладинку всередині `<li data-id=\"b-02\">`, назва цієї книжки поруч і жодного запасного тексту в інших картках — тож boundary має стояти навколо обкладинки, а не навколо списку."
          en: "The cover of book `b-02` crashes while rendering. A `role=\"alert\"` with the cover text is expected inside `<li data-id=\"b-02\">`, that book's title next to it and no fallback in other cards — so the boundary must sit around the cover, not around the list."
      - when: { test: "your transition table has at least 8 tests and passes on your reducer" }
        message:
          uk: "Перевірка запускає `transitions.test.ts` і чекає щонайменше 8 тестів, що проходять. Тести мають викликати reducer через `subject.readingReducer`."
          en: "The check runs `transitions.test.ts` and expects at least 8 passing tests. The tests must call the reducer through `subject.readingReducer`."
      - when: { test: "your table catches a reducer that wipes the list when a refresh fails" }
        message:
          uk: "Зі зламаним reducer, що з `ready` після `loadFailed` переходить у `failed`, жоден твій тест не впав. Потрібен рядок для `ready + loadFailed`. Якщо він є, перевір, що тест звертається до `subject.readingReducer` у момент виклику, а не зберігає функцію в змінну на початку файлу: тоді підміна до нього не доходить."
          en: "With a broken reducer that goes from `ready` to `failed` after `loadFailed`, none of your tests failed. A row for `ready + loadFailed` is needed. If it is there, check that the test looks up `subject.readingReducer` at the moment of the call rather than saving the function in a variable at the top of the file: then the swap does not reach it."
      - when: { test: "your table catches a reducer that accepts a late answer after a failure" }
        message:
          uk: "Зі зламаним reducer, що з `failed` після `loaded` переходить у `ready`, жоден твій тест не впав. Потрібен рядок для `failed + loaded`, і тест має звертатися до `subject.readingReducer` у момент виклику."
          en: "With a broken reducer that goes from `failed` to `ready` after `loaded`, none of your tests failed. A row for `failed + loaded` is needed, and the test must look up `subject.readingReducer` at the moment of the call."
      - when: { test: "decisions.md answers both questions" }
        message:
          uk: "У `decisions.md` мають лишитися два заголовки `## …`, і під кожним — відповідь щонайменше на 40 символів."
          en: "`decisions.md` must keep its two `## …` headings, with an answer of at least 40 characters under each."

  - id: to-project
    kind: transfer
    capstoneStep: RE-09
    body:
      uk: "Крок проєкту цього розділу — те саме для твого застосунку: схема для кожної відповіді API-заглушки, типізовані reducer і context, тести переходів і відкату та доступна модель помилок."
      en: "This unit's project step is the same for your own app: a schema for every answer of the fixture API, a typed reducer and context, tests of the transitions and the rollback, and an accessible error model."
