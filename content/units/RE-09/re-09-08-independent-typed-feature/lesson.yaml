id: re-09-08-independent-typed-feature
unit: RE-09
title:
  uk: "Самостійно: строго типізована функція з відновленням"
  en: "Independent: strict typed feature with recovery"
kind: assessment
minutes: 35
contentVersion: 1
purpose:
  uk: "Перевірка без підказок: чи вмієш ти сам довести наївну функцію до надійної — розібрати кожну відповідь API схемою, провести стан через reducer з перевіреними переходами, обмежити context тією частиною, якій він потрібен, оновлювати дані після кожного запису й дати людині доступний шлях відновлення після будь-якого збою?"
  en: "A check without hints: can you take a naive feature to a reliable one on your own — parse every API answer with a schema, run the state through a reducer with tested transitions, limit the context to the part that needs it, refresh the data after every write, and give the person an accessible way to recover from any failure?"
objectives:
  - uk: "Без підказок побудувати строго типізовану функцію з розібраними даними API, reducer з перевіреними переходами, context лише там, де він потрібен, точковим оновленням після записів і доступним відновленням після кожного виду збою."
    en: "Build, without hints, a strictly typed feature with parsed API data, a reducer with tested transitions, context limited to where it is needed, targeted cache invalidation and accessible recovery from every failure kind."
  - uk: "Двома реченнями обґрунтувати, який стан іде через context, а який лишається локальним, і які модулі міг би взяти мобільний чи серверний застосунок."
    en: "Justify in two sentences which state is shared through context and which stays local, and which modules could be reused by a native or server app."
prerequisites: [re-09-07-debug-race-rollback-typed]
subskills:
  - { family: P-05, skill: "native/server reuse boundaries", depth: assess }
  - { family: P-05, skill: "accessible error models", depth: assess }
  - { family: R-03, skill: "reducer state transitions", depth: assess }
  - { family: R-03, skill: "context boundaries", depth: assess }
  - { family: R-03, skill: "avoid needless global state", depth: assess }
  - { family: R-05, skill: "validation/errors", depth: assess }
  - { family: R-05, skill: "error boundaries and their limits", depth: assess }
  - { family: R-06, skill: "cache/invalidation principles", depth: assess }
glossary: []
selfCheck: [reading-list]

blocks:
  - id: brief
    kind: explanation
    title:
      uk: "Що перевірятимуть"
      en: "What will be checked"
    body:
      uk: |
        У вправі нижче — список книжок для читання: завантаження з API, форма додавання, кнопка «Прочитано» й обкладинки від іншої команди. Функція працює, поки все гаразд. Але відповідь API приводять через `as`, reducer приймає будь-який перехід, context має «порожнє» значення за замовчуванням і загортає всю сторінку, після запису список не оновлюється з сервера, помилки — червоний текст, а одна зламана обкладинка валить усю сторінку.

        Ти перебудуєш її з того, що вивчив у розділі: схема на межі, автомат станів і таблиця переходів, context, обмежений функцією, оновлення після записів, модель помилок і boundary там, де може статися збій рендеру. Підказок немає. Перевірки приховані й підставляють свої відповіді сервера, але кожну з них описано в завданні.
      en: |
        The exercise below is a reading list of books: loading from an API, an add form, a “Mark as read” button and covers from another team. The feature works as long as all is well. But the API answer is cast with `as`, the reducer accepts any transition, the context has an “empty” default and wraps the whole page, after a write the list is not refreshed from the server, errors are red text, and one broken cover takes down the whole page.

        You will rebuild it with what you learned in this unit: a schema at the boundary, a state machine and a transition table, a context limited to the feature, refreshing after writes, an error model and a boundary where a render crash can happen. There are no hints. The checks are hidden and put their own server answers in place, but each of them is described in the task.

  - id: recall
    kind: review
    title:
      uk: "Згадай: де живе стан"
      en: "Recall: where state lives"
    items:
      - id: draft-placement
        from: re-04-02-where-state-lives
        prompt:
          uk: "Застосунок планувальника має список справ, який бачать і сторінка списку, і лічильник у шапці, та чернетку форми нової справи. Де має жити чернетка?"
          en: "A planner app has a task list that both the list page and a counter in the header see, and the draft of the new-task form. Where should the draft live?"
        answer:
          type: choice
          options:
            - id: in-form
              text:
                uk: "У стані самої форми: крім неї, чернетку ніхто не читає"
                en: "In the form's own state: nobody but the form reads the draft"
            - id: in-context
              text:
                uk: "У тому самому context, що й список, — щоб усе було в одному місці"
                en: "In the same context as the list — to keep everything in one place"
              why:
                uk: "Тоді кожна клавіша в полі змінює значення context, і перемальовується кожен його читач — і шапка, і список, — хоча чернетка їм не потрібна."
                en: "Then every key in the field changes the context value, and every reader of it redraws — the header and the list too — although they do not need the draft."
            - id: in-root
              text:
                uk: "У кореневому компоненті, звідки її передають props"
                en: "In the root component, which passes it down through props"
              why:
                uk: "Підняти стан варто до найближчого спільного власника тих, кому він потрібен. Чернетка потрібна лише формі, тож її власник — форма."
                en: "State should be lifted to the closest common owner of those who need it. Only the form needs the draft, so its owner is the form."
          correct: [in-form]
        explanation:
          uk: "Стан живе в найнижчому компоненті, якому він потрібен. Спільний для кількох частин — у їхньому найближчому спільному власнику або в context, обмеженому цими частинами. Глобальне сховище для всього — зайві перемальовування й зайві залежності."
          en: "State lives in the lowest component that needs it. State shared by several parts lives in their closest common owner, or in a context limited to those parts. A global store for everything means extra redraws and extra dependencies."

  - id: reading-list
    kind: exercise
