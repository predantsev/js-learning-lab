      positiveInteger: { uk: "Ціле число, більше за нуль.", en: "A whole number greater than zero." }
      coverFailed: { uk: "Обкладинку не вдалося показати.", en: "The cover could not be shown." }
      decisionsTitle: { uk: "Рішення", en: "Decisions" }
      question1: { uk: "Який стан іде через context, а який лишається локальним — і чому?", en: "Which state is shared through the context, and which stays local — and why?" }
      question2: { uk: "Які модулі міг би взяти мобільний чи серверний застосунок?", en: "Which modules could a native or server app reuse?" }
