id: re-09-04-reuse-boundaries
unit: RE-09
title:
  uk: "Межі повторного використання: домен проти платформних views"
  en: "Reuse boundaries: domain vs platform views"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Розкласти модулі проєкту на спільний чистий доменний код (типи, валідатори, перетворення) і платформні views та адаптери (компоненти React DOM, сховище, маршрути)."
    en: "Sort capstone modules into shareable pure domain code (types, validators, transforms) and platform views and adapters (React DOM components, storage, routing)."
  - uk: "Пояснити, чому вебкомпонент не варто ділити з майбутнім мобільним чи серверним застосунком, а його доменні типи й валідатори — варто."
    en: "Explain why a web component should not be shared with a future native or server app while its domain types and validators should be."
prerequisites: [re-09-03-api-models-runtime-schemas, js-14-07-modules-type-imports, js-03-07-pure-vs-side-effects]
subskills:
  - { family: P-05, skill: "native/server reuse boundaries", depth: intro }
glossary: [reuse-boundary, platform-view]
selfCheck: [predict-boundary-imports, domain-index]

blocks:
  - id: what-travels
    kind: explanation
    title:
      uk: "Що переїде в мобільний застосунок і на сервер"
      en: "What moves to a mobile app and to a server"
    body:
      uk: |
        Далі в курсі той самий проєкт оживе ще двічі: як застосунок React Native і як сервер на Node.js. Що з сьогоднішнього коду там знадобиться?

        - **Типи, валідатори й чисті перетворення** — `Habit`, `validateHabit`, `summarizeHabit`. Вони працюють лише з даними: отримали значення — повернули значення. Їм байдуже, де вони виконуються.
        - **[[platform-view|Платформні views]] й адаптери** — `HabitCard` з `<li>` і `<button>`, модуль, що пише в `localStorage`, маршрути з адресою в браузері. У React Native немає `<li>` і `localStorage`: там свої компоненти (`View`, `Text`) і своє сховище. На сервері немає ні екрана, ні сховища браузера конкретної людини.

        Тому ділять **домен**, а не компоненти. Лінія між ними — [[reuse-boundary|межа повторного використання]]: платформний код імпортує домен, а домен не імпортує нічого платформного — ні React, ні `react-dom`, ні сховище, ні маршрути. Імпорт типу через `import type` межу не порушує: після компіляції від нього нічого не лишається.
      en: |
        Later in the course the same project comes alive twice more: as a React Native app and as a Node.js server. What of today's code is needed there?

        - **Types, validators and pure transforms** — `Habit`, `validateHabit`, `summarizeHabit`. They work only with data: a value in, a value out. They do not care where they run.
        - **[[platform-view|Platform views]] and adapters** — `HabitCard` with `<li>` and `<button>`, the module that writes to `localStorage`, routes with an address in the browser. React Native has no `<li>` and no `localStorage`: it has its own components (`View`, `Text`) and its own storage. A server has neither a screen nor one person's browser storage.

        So the **domain** is shared, not the components. The line between them is the [[reuse-boundary]]: platform code imports the domain, and the domain imports nothing platform-specific — no React, no `react-dom`, no storage, no routes. A type imported with `import type` does not break the boundary: nothing of it is left after compiling.

  - id: recipe
    kind: analogy
    body:
      uk: "Рецепт борщу однаковий у будь-якій кухні: інгредієнти, пропорції, порядок. А от «увімкни третю конфорку на шістку» — інструкція для однієї конкретної плити. Запиши її в рецепт, і на індукції чи на вогнищі рецепт стане неправдою. Доменний код — рецепт, компоненти й сховище — плита."
      en: "A recipe for borscht is the same in any kitchen: ingredients, proportions, order. But “turn the third burner to six” is an instruction for one particular stove. Write it into the recipe, and on an induction hob or over a campfire the recipe becomes wrong. Domain code is the recipe; components and storage are the stove."
    limits:
      uk: "Кухар сам пропустить зайвий рядок рецепта, а програма — ні: доменна функція, що звертається до `localStorage`, просто впаде там, де його немає. І межу в коді видно в імпортах: її можна перевірити, а в рецепті — лише прочитати."
      en: "A cook skips a line of the recipe that does not fit, but a program does not: a domain function that touches `localStorage` simply crashes where there is none. And in code the boundary is visible in the imports: it can be checked, while a recipe can only be read."

  - id: predict-boundary-imports
    kind: prediction
    lang: ts
    runnable: false
    prompt:
      uk: "Шість рядків коду з різних файлів проєкту звичок. Які з них порушують межу — роблять доменний код залежним від платформи? Обери всі."
      en: "Six lines of code from different files of the habit project. Which of them break the boundary — make domain code depend on the platform? Choose all."
    code: |
      // A — domain/summarize.ts
      import { DaysText } from "../ui/DaysText";
      // B — domain/validate.ts
      import type { Habit } from "./types";
      // C — ui/HabitCard.tsx
      import { summarizeHabit } from "../domain";
      // D — domain/streak.ts
      const today = localStorage.getItem("jsll.today") ?? "2026-03-02";
      // E — data/useHabits.ts
      import { saveHabits } from "../storage/habitStorage";
      // F — domain/progress.ts
      import { useMemo } from "react";
    answer:
      type: multi
      options:
        - id: a
          text: { uk: "A", en: "A" }
        - id: b
          text: { uk: "B", en: "B" }
          why:
            uk: "Домен імпортує тип із самого домену, та ще й через `import type`: після компіляції цього рядка немає взагалі."
            en: "The domain imports a type from the domain itself, and with `import type` at that: after compiling this line does not exist at all."
        - id: c
          text: { uk: "C", en: "C" }
          why:
            uk: "Це правильний напрямок: view імпортує домен. Межу порушує стрілка з домену назовні, а не всередину."
            en: "This is the right direction: a view imports the domain. An arrow out of the domain breaks the boundary, not one into it."
        - id: d
          text: { uk: "D", en: "D" }
        - id: e
          text: { uk: "E", en: "E" }
          why:
            uk: "`data/useHabits.ts` — платформний шар вебзастосунку: хук React, що поєднує стан і сховище. Йому якраз і місце знати про `localStorage`."
            en: "`data/useHabits.ts` is the web app's platform layer: a React hook that joins state and storage. It is exactly the place that may know about `localStorage`."
        - id: f
          text: { uk: "F", en: "F" }
      correct: [a, d, f]
    explanation:
      uk: "A тягне в домен компонент: на сервері його нема чим показати. D — без жодного імпорту, але звертається до сховища браузера: у React Native такого глобального об’єкта немає, і функція впаде. F робить доменний файл хуком React: його не можна викликати поза компонентом, тим паче на сервері. B, C і E лишають домен чистим."
      en: "A pulls a component into the domain: a server has nothing to show it on. D has no import at all, but touches browser storage: React Native has no such global object, and the function crashes. F turns a domain file into a React hook: it cannot be called outside a component, let alone on a server. B, C and E keep the domain clean."

  - id: module-graph
    kind: visual
    visual: diagram
    title:
      uk: "Хто кого імпортує"
      en: "Who imports whom"
    textEquivalent:
      uk: "Посередині — domain/: типи, валідатор і чисті перетворення. Над ним — платформні модулі вебзастосунку: ui/HabitCard і storage/. Обидва імпортують domain/. Під ним — майбутні застосунок React Native і сервер на Node.js: вони теж імпортуватимуть domain/, але матимуть власні views і сховище. Усі стрілки ведуть у domain/. Стрілка з domain/ у ui/HabitCard — порушення межі: тоді domain/ не можна взяти ні в мобільний застосунок, ні на сервер, бо він тягне за собою вебкомпонент."
      en: "In the middle is domain/: types, the validator and pure transforms. Above it are the web app's platform modules: ui/HabitCard and storage/. Both import domain/. Below it are the future React Native app and Node.js server: they will import domain/ too, but have their own views and storage. Every arrow leads into domain/. An arrow from domain/ to ui/HabitCard breaks the boundary: then domain/ cannot be taken into the mobile app or onto the server, because it drags a web component along."
    spec:
      layout: grid
      nodes:
        - { id: card, col: 0, row: 0, label: "ui/HabitCard", w: 150 }
        - { id: storage, col: 1, row: 0, label: "storage/", w: 150 }
        - { id: domain, col: 0, row: 1, label: "domain/", shape: round, w: 150 }
        - { id: native, col: 0, row: 2, label: "React Native", shape: pill, w: 150 }
        - { id: server, col: 1, row: 2, label: "Node.js", shape: pill, w: 150 }
      edges:
        - { id: card-domain, from: card, to: domain }
        - { id: storage-domain, from: storage, to: domain, label: "import type", kind: dashed }
        - { id: native-domain, from: native, to: domain }
        - { id: server-domain, from: server, to: domain }
        - { id: violation, from: domain, to: card, kind: dashed }
      hidden: [native, server, native-domain, server-domain, violation]
      steps:
        - caption:
            uk: "Сьогодні: вебкомпонент `ui/HabitCard` і адаптер `storage/` імпортують `domain/`. Сховищу потрібен лише тип `Habit` — через `import type`."
            en: "Today: the web component `ui/HabitCard` and the adapter `storage/` import `domain/`. The storage needs only the `Habit` type — through `import type`."
          highlight: [card, storage, domain, card-domain, storage-domain]
        - caption:
            uk: "Згодом: застосунок React Native і сервер на Node.js імпортуватимуть той самий `domain/`, а views і сховище матимуть власні."
            en: "Later: a React Native app and a Node.js server will import the same `domain/`, while having their own views and storage."
          show: [native, server, native-domain, server-domain]
          highlight: [native, server, native-domain, server-domain, domain]
          dim: [card, storage]
        - caption:
            uk: "Одна стрілка з `domain/` у `ui/HabitCard` — і `domain/` уже не взяти ні в мобільний застосунок, ні на сервер: він тягне за собою вебкомпонент."
            en: "One arrow from `domain/` to `ui/HabitCard` — and `domain/` can no longer go into the mobile app or onto the server: it drags a web component along."
          show: [violation]
          highlight: [violation, domain, card]
          dim: [native-domain, server-domain]
          annotate:
            - { id: violation, text: { uk: "порушення межі", en: "boundary broken" } }

  - id: habit-layers
    kind: example
    runtime: browser-react
    dir: habit-layers
    entry: main.tsx
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      water: { uk: "Пити воду", en: "Drink water" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      doneToday: { uk: "Виконано сьогодні", en: "Done today" }
      web: { uk: "веб", en: "web" }
      native: { uk: "без localStorage, як у React Native", en: "without localStorage, as in React Native" }
      noStorage: { uk: "на цій платформі немає localStorage", en: "there is no localStorage on this platform" }
    title:
      uk: "Сховище всередині домену"
      en: "Storage inside the domain"
    body:
      uk: |
        `domain/habits.ts` позначає виконання й **сам** зберігає список через `saveHabits`. `main.tsx` перед показом сторінки двічі запускає тести домену з `domainTests.ts`: як у браузері й як на платформі без `localStorage`. Натисни **Запустити** й подивись на консоль і на вкладку **Сторінка**.
      en: |
        `domain/habits.ts` marks a completion and saves the list **itself** through `saveHabits`. Before showing the page, `main.tsx` runs the domain tests from `domainTests.ts` twice: as in the browser and as on a platform without `localStorage`. Press **Run** and look at the console and at the **Page** tab.
    tryIt:
      uk: |
        1. Консоль: `✓ веб: completeHabit` і `✗ без localStorage, як у React Native: Error: …` — та сама чиста за змістом функція падає, бо всередині звертається до сховища. А на сторінці замість твоїх двох звичок — «Прибирання» з тестів: запуск тестів домену переписав збережений список застосунку. Це й видно на вкладці **Сховище**.
        2. Перенеси збереження в хук. У `domain/habits.ts` видали рядок коду `saveHabits(next);` та імпорт `saveHabits`. У `data/useHabits.ts` додай `saveHabits` до імпорту з `"../storage/habitStorage"`, а в `complete` між `const next = …` і `setHabits(next);` встав `saveHabits(next);`.
        3. На вкладці **Сховище** натисни **Очистити сховище** (там лишився список із тестів — сховище вправи зберігається між запусками) і запусти. Обидва рядки консолі — `✓`, хоча `domainTests.ts` ти не змінював, а на сторінці — дві твої звички. Натисни «Виконано сьогодні»: лічильник росте, і новий список видно в **Сховищі**.
      en: |
        1. The console: `✓ web: completeHabit` and `✗ without localStorage, as in React Native: Error: …` — the same function, pure in its meaning, crashes because it touches storage inside. And the page shows “Tidy up” from the tests instead of your two habits: running the domain tests overwrote the app's saved list. The **Storage** tab shows it too.
        2. Move the saving into the hook. In `domain/habits.ts` delete the line of code `saveHabits(next);` and the import of `saveHabits`. In `data/useHabits.ts` add `saveHabits` to the import from `"../storage/habitStorage"`, and in `complete` insert `saveHabits(next);` between `const next = …` and `setHabits(next);`.
        3. On the **Storage** tab press **Clear storage** (the list from the tests is still there — the exercise's storage is kept between runs) and run. Both console lines are `✓`, although you did not change `domainTests.ts`, and the page shows your two habits. Press “Done today”: the counter grows, and the new list appears in **Storage**.

  - id: recall
    kind: review
    title:
      uk: "Згадай: чисті функції й імпорти типів"
      en: "Recall: pure functions and type imports"
    items:
      - id: pure-or-not
        from: js-03-07-pure-vs-side-effects
        prompt:
          uk: "Яка з цих функцій чиста?"
          en: "Which of these functions is pure?"
        answer:
          type: choice
          options:
            - id: returns-new
              code: "function addTag(item, tag) { return { ...item, tags: [...item.tags, tag] }; }"
            - id: writes-storage
              code: "function addTag(item, tag) { const next = { ...item, tags: [...item.tags, tag] }; localStorage.setItem(item.id, JSON.stringify(next)); return next; }"
              why:
                uk: "Результат той самий, але функція ще й змінює світ поза собою — пише в сховище. Це побічний ефект."
                en: "The result is the same, but the function also changes the world outside itself — it writes to storage. That is a side effect."
            - id: reads-clock
              code: "function addTag(item, tag) { return { ...item, tags: [...item.tags, tag], at: Date.now() }; }"
              why:
                uk: "Два виклики з тими самими аргументами дають різні результати: функція читає годинник. Чиста функція залежить лише від аргументів."
                en: "Two calls with the same arguments give different results: the function reads the clock. A pure function depends only on its arguments."
          correct: [returns-new]
        explanation:
          uk: "Чиста функція повертає результат лише з аргументів і нічого не змінює поза собою. Саме такі функції можна без змін узяти на іншу платформу й перевіряти тестами без сховища, годинника чи мережі."
          en: "A pure function returns a result from its arguments only and changes nothing outside itself. Exactly such functions can be taken to another platform unchanged and tested without storage, a clock or a network."
      - id: type-import-left
        from: js-14-07-modules-type-imports
        prompt:
          uk: "`storage/habitStorage.ts` починається з `import type { Habit } from \"../domain/types\";`. Що від цього рядка лишиться в JavaScript після компіляції?"
          en: "`storage/habitStorage.ts` starts with `import type { Habit } from \"../domain/types\";`. What is left of this line in the JavaScript after compiling?"
        answer:
          type: choice
          options:
            - id: nothing
              text:
                uk: "Нічого: рядок зникає, і модуль `domain/types` під час виконання не завантажується через нього"
                en: "Nothing: the line disappears, and the module `domain/types` is not loaded because of it at runtime"
            - id: import-stays
              text:
                uk: "`import { Habit } from \"../domain/types.js\";`"
                en: "`import { Habit } from \"../domain/types.js\";`"
              why:
                uk: "`Habit` — лише тип, у JavaScript його немає. `import type` для того й існує, щоб такий імпорт зник повністю."
                en: "`Habit` is only a type; it does not exist in JavaScript. `import type` exists exactly so that such an import disappears completely."
            - id: side-effect
              text:
                uk: "`import {} from \"../domain/types.js\";` — модуль завантажиться без назв"
                en: "`import {} from \"../domain/types.js\";` — the module loads without names"
              why:
                uk: "Так буває з `import { type Habit }` під `verbatimModuleSyntax`: `tsc` лишає порожній імпорт, і модуль завантажується. `import type { Habit }` зникає цілком."
                en: "That happens with `import { type Habit }` under `verbatimModuleSyntax`: `tsc` leaves an empty import, and the module is loaded. `import type { Habit }` disappears entirely."
          correct: [nothing]
        explanation:
          uk: "Імпорт типу не створює залежності під час виконання. Тому платформний модуль може брати типи з домену скільки завгодно, а домену, навпаки, не можна імпортувати платформні **значення**."
          en: "A type import creates no dependency at runtime. So a platform module may take as many types from the domain as it likes, while the domain, the other way round, must not import platform **values**."

  - id: one-entry
    kind: explanation
    title:
      uk: "Один вхід у домен"
      en: "One entry into the domain"
    body:
      uk: |
        Щоб межу було видно й легко перевірити, домен має один публічний вхід — `domain/index.ts`. Платформний код імпортує `"./domain"`, а не окремі файли, і бачить рівно те, що вхід експортує.

        У такому файлі значення й типи експортують по-різному:

        ```ts
        export { completeHabit } from "./habits";      // a value: stays in JavaScript
        export type { Habit } from "./types";           // a type: disappears after compiling
        ```

        Якщо написати `export { Habit } from "./types"` без `type`, `tsc` з `verbatimModuleSyntax` повідомить `TS1205`, а пісочниця (як і браузер) не завантажить модуль: `SyntaxError: The requested module 'domain/types.ts' does not provide an export named 'Habit'`. Типу в JavaScript немає, тож і віддати його далі нічого.

        `export * from "./types"` теж працює: він переносить і значення, і типи. Але з ним легко випадково віддати назовні й платформний модуль.
      en: |
        To keep the boundary visible and easy to check, the domain has one public entry — `domain/index.ts`. Platform code imports `"./domain"`, not single files, and sees exactly what the entry exports.

        In such a file values and types are exported differently:

        ```ts
        export { completeHabit } from "./habits";      // a value: stays in JavaScript
        export type { Habit } from "./types";           // a type: disappears after compiling
        ```

        If you write `export { Habit } from "./types"` without `type`, `tsc` with `verbatimModuleSyntax` reports `TS1205`, and the sandbox (like the browser) does not load the module: `SyntaxError: The requested module 'domain/types.ts' does not provide an export named 'Habit'`. There is no type in JavaScript, so there is nothing to pass on.

        `export * from "./types"` works too: it carries values and types alike. But with it, it is easy to hand a platform module out by accident.

  - id: domain-index
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: domain-index
    entry: main.tsx
    editable: [domain/index.ts]
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      completions: { uk: "виконань:", en: "completions:" }
      lastDone: { uk: "востаннє:", en: "last done:" }
      doneToday: { uk: "Виконано сьогодні", en: "Done today" }
    title:
      uk: "Публічний вхід домену"
      en: "The domain's public entry"
    instructions:
      uk: |
        `domain/index.ts` зараз експортує все підряд, разом із вебкомпонентом `HabitCard` і адаптером сховища. Застосунок React Native, що імпортуватиме `"./domain"`, потягне за собою `<li>` і `localStorage`.

        Перепиши `domain/index.ts` так, щоб він віддавав лише домен:

        - типи `Frequency`, `Habit`, `HabitSummary`, `HabitDraft`, `ValidationResult` — як типи;
        - значення `FREQUENCIES`, `validateHabit`, `summarizeHabit`, `addCompletion`;
        - і нічого з `storage/` чи `ui/`.

        `App.tsx` (лише для перегляду) імпортує домен через `"./domain"`, а сховище й компонент — з їхніх власних тек. Перевірки імпортують `domain/index` і дивляться, які назви він віддає під час виконання. Типів вони не бачать — під час виконання їх немає; чи експортовано типи як типи, перевіряє лише `tsc` (`TS1205` про `export type`).
      en: |
        `domain/index.ts` currently exports everything, together with the web component `HabitCard` and the storage adapter. A React Native app that imports `"./domain"` would drag `<li>` and `localStorage` along.

        Rewrite `domain/index.ts` so that it hands out only the domain:

        - the types `Frequency`, `Habit`, `HabitSummary`, `HabitDraft`, `ValidationResult` — as types;
        - the values `FREQUENCIES`, `validateHabit`, `summarizeHabit`, `addCompletion`;
        - and nothing from `storage/` or `ui/`.

        `App.tsx` (read-only) imports the domain through `"./domain"`, and the storage and the component from their own folders. The checks import `domain/index` and look at which names it hands out at runtime. They cannot see the types — there are none at runtime; only `tsc` checks that the types are exported as types (`TS1205` about `export type`).
    testTitles:
      "domain/index exports no storage functions":
        uk: "`domain/index` не експортує `loadHabits` і `saveHabits`"
        en: "`domain/index` does not export `loadHabits` and `saveHabits`"
      "domain/index exports no React components":
        uk: "`domain/index` не експортує `HabitCard`"
        en: "`domain/index` does not export `HabitCard`"
      "domain/index exports the validator, the transforms and FREQUENCIES":
        uk: "`domain/index` віддає ті самі `validateHabit`, `summarizeHabit`, `addCompletion` і `FREQUENCIES`, що й файли домену"
        en: "`domain/index` hands out the same `validateHabit`, `summarizeHabit`, `addCompletion` and `FREQUENCIES` as the domain files"
      "domain/index exports exactly the four domain values":
        uk: "Під час виконання `domain/index` має рівно чотири назви"
        en: "At runtime `domain/index` has exactly four names"
      "the page still works through domain/index":
        uk: "Сторінка, що бере домен через `\"./domain\"`, показує дві звички й рядок валідатора"
        en: "The page, which takes the domain through `\"./domain\"`, shows two habits and the validator line"
    hints:
      nudge:
        uk: "Подивись, з яких файлів зараз іде `export *`. Які з них лежать поза `domain/`?"
        en: "Look at which files `export *` currently comes from. Which of them lie outside `domain/`?"
      explanation:
        uk: "Платформні файли — ті, що лежать у `storage/` і `ui/`: їх у вході бути не повинно. Значення експортують звичайним `export { … } from`, а типи — через `export type { … } from`, як у прикладі з `completeHabit` і `Habit` у поясненні. Тип у звичайному `export { … }` пісочниця не завантажить: модуль, з якого його беруть, такої назви під час виконання не має."
        en: "Platform files are the ones in `storage/` and `ui/`: they must not be in the entry. Values are exported with a plain `export { … } from`, types with `export type { … } from`, as in the `completeHabit` and `Habit` example in the explanation. The sandbox does not load a type in a plain `export { … }`: the module it comes from has no such name at runtime."
    solutionNote:
      uk: "Вхід домену тепер — список того, що можна брати на будь-яку платформу. Значення лишаються в JavaScript, типи зникають після компіляції, а `storage/` і `ui/` імпортують з їхніх тек лише ті, кому вони справді потрібні, — вебзастосунок. `export *` лише з файлів домену теж підходить, але явний список одразу показує, що саме виходить назовні."
      en: "The domain's entry is now a list of what may be taken to any platform. Values stay in JavaScript, types disappear after compiling, and `storage/` and `ui/` are imported from their own folders only by those who really need them — the web app. `export *` from domain files only works too, but an explicit list shows at once what goes out."
    feedback:
      - when: { test: "domain/index exports no storage functions" }
        message:
          uk: "Ця перевірка чекає, що серед назв `domain/index` немає `loadHabits` і `saveHabits`. Вони лишаються в `storage/habitStorage.ts`, звідки їх бере `App.tsx`."
          en: "This check expects no `loadHabits` and `saveHabits` among the names of `domain/index`. They stay in `storage/habitStorage.ts`, where `App.tsx` takes them from."
      - when: { test: "domain/index exports no React components" }
        message:
          uk: "Ця перевірка чекає, що серед назв `domain/index` немає `HabitCard`: компонент React DOM — частина вебзастосунку, а не домену."
          en: "This check expects no `HabitCard` among the names of `domain/index`: a React DOM component belongs to the web app, not to the domain."
      - when: { test: "domain/index exports exactly the four domain values" }
        message:
          uk: "Під час виконання видно лише значення: перевірка чекає рівно `FREQUENCIES`, `addCompletion`, `summarizeHabit`, `validateHabit`. Список, який вийшов у тебе, — у тексті помилки."
          en: "Only values are visible at runtime: the check expects exactly `FREQUENCIES`, `addCompletion`, `summarizeHabit`, `validateHabit`. The list you got is in the error text."
      - when: { error: SyntaxError }
        message:
          uk: "Якщо картка помилки каже `does not provide an export named 'Habit'` (чи іншу назву типу), тип експортовано як значення: перенеси його в `export type { … } from \"./types\"`. Якщо картка про інше, перевір дужки й лапки в `domain/index.ts`."
          en: "If the error card says `does not provide an export named 'Habit'` (or another type's name), a type is exported as a value: move it into `export type { … } from \"./types\"`. If the card is about something else, check the braces and quotes in `domain/index.ts`."

  - id: to-project
    kind: transfer
    capstoneStep: RE-09
    body:
      uk: "У кроці проєкту схеми записів, типізований reducer і валідатори твого застосунку житимуть у домені без жодного імпорту з React DOM, сховища чи маршрутів — саме ця частина згодом перейде в мобільний застосунок і на сервер."
      en: "In the project step your app's record schemas, typed reducer and validators live in the domain without a single import from React DOM, storage or routes — exactly this part later moves to the mobile app and the server."
