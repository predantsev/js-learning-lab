id: rn-05-05-restart-recovery-shared-models
unit: RN-05
title:
  uk: "Перезапуск, відновлення та спільні TS-моделі"
  en: "Restart, recovery and shared TS models"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Відновити застосунок після холодного перезапуску чи завершення процесу зі збереженого знімка, перевіреного під час виконання валідатором спільної TypeScript-моделі."
    en: "Restore the app after a cold restart or process death from the stored snapshot, validated at runtime against the shared TypeScript model."
  - uk: "Використовувати один спільний тип моделі й валідатор для вебу, native і фікстур, щоб перейменування поля ламало перевірку типів усюди одночасно."
    en: "Use one shared model type and validator for web, native and fixtures, so that a field rename breaks the typecheck everywhere at once."
prerequisites: [rn-05-04-offline-cache-authority, rn-01-04-shared-domain-code]
subskills:
  - { family: N-05, skill: "restart/recovery", depth: intro }
  - { family: N-05, skill: "shared TS models", depth: intro }
glossary: [process-death, restore-on-launch]
selfCheck: [predict-survivors, restore-habits]

blocks:
  - id: what-survives
    kind: explanation
    title:
      uk: "Що лишається після завершення процесу"
      en: "What is left after process death"
    body:
      uk: |
        Людина відкрила застосунок, почала вводити справу й перемкнулася на камеру. Поки застосунок у фоні, операційна система може зупинити його процес, щоб звільнити пам’ять. Це [[process-death|завершення процесу]]: разом із процесом зникає вся пам’ять JavaScript — стан React, відкритий екран, недописаний текст. Повернувшись, людина запускає застосунок з нуля. Лишилося тільки те, що встигли записати у сховище.

        Тому запуск — це [[restore-on-launch|відновлення]], і кожен його крок має свою причину:

        1. `getItem` — текст або `null`;
        2. `JSON.parse` — текст може бути пошкоджений, тож у `try`/`catch`;
        3. `migrate` — знімок міг записати старіший застосунок;
        4. перевірка кожного запису **валідатором спільної моделі** — і лише тоді стан.

        Чому валідатор, а не `as Habit[]`? Тип — обіцянка компілятору; що насправді лежить на телефоні, він не бачить. А чому **спільна** модель? Файл `models/habit.ts` з типом і `validateHabit` — одне джерело для вебклієнта, native-застосунку й фікстур тестів. Якщо native-застосунок — окремий проєкт, як у проєкті курсу, у ньому лежить незмінна копія цього файлу, і `diff` доводить, що вона не розійшлася з оригіналом. Перейменуєш поле й скопіюєш файл заново — `tsc` у кожному проєкті одразу покаже всі місця зі старою назвою, а не через тиждень на чиємусь телефоні.
      en: |
        A person opened the app, started typing a task and switched to the camera. While the app is in the background, the operating system may stop its process to free memory. That is [[process-death|process death]]: all JavaScript memory goes with the process — React state, the open screen, the half-typed text. When the person comes back, the app starts from scratch. Only what was written to the store is left.

        That is why launch is a [[restore-on-launch|restore]], and each of its steps has a reason:

        1. `getItem` — text or `null`;
        2. `JSON.parse` — the text may be damaged, so it sits in `try`/`catch`;
        3. `migrate` — an older app may have written the snapshot;
        4. checking every record with **the shared model's validator** — and only then state.

        Why a validator and not `as Habit[]`? A type is a promise to the compiler; it does not see what is really on the phone. And why a **shared** model? The file `models/habit.ts` with the type and `validateHabit` is the one source for the web client, the native app and the test fixtures. When the native app is a separate project, as in the course project, it holds an unchanged copy of this file, and `diff` proves that the copy has not drifted from the original. Rename a field and copy the file again, and `tsc` in each project shows every place with the old name at once, not a week later on somebody's phone.

  - id: predict-survivors
    kind: prediction
    prompt:
      uk: "Застосунок планувальника зберігає у сховище лише список справ. Людина відкрила екран справи, прокрутила його донизу, почала вводити нову назву й пішла в інший застосунок. Система завершила процес. Що людина побачить після повернення? Обери все, що збережеться."
      en: "The planner app saves only the task list to the store. A person opened a task screen, scrolled it to the bottom, started typing a new title and went to another app. The system ended the process. What will the person see after coming back? Choose everything that survives."
    runnable: false
    answer:
      type: multi
      options:
        - id: screen
          text:
            uk: "Той самий відкритий екран справи"
            en: "The same open task screen"
          why:
            uk: "Який екран відкрито — це стан навігації в пам’яті. Після завершення процесу застосунок стартує з початкового екрана, якщо ти сам не зберіг і не відновив це."
            en: "Which screen is open is navigation state in memory. After process death the app starts on its initial screen unless you saved and restored it yourself."
        - id: draft
          text:
            uk: "Недописану назву"
            en: "The half-typed title"
          why:
            uk: "Чернетка жила лише в стані React. Щоб вона пережила завершення процесу, її треба записувати у сховище окремо."
            en: "The draft lived only in React state. For it to survive process death it has to be written to the store separately."
        - id: records
          text:
            uk: "Збережені справи"
            en: "The saved tasks"
        - id: scroll
          text:
            uk: "Місце прокрутки"
            en: "The scroll position"
          why:
            uk: "Позиція прокрутки — теж лише стан у пам’яті нативного view. Разом із процесом вона зникає."
            en: "The scroll position is also just state in the memory of a native view. It disappears with the process."
      correct: [records]
    explanation:
      uk: "React-стан сам не повертається: процес почався заново. Лишилося тільки те, що застосунок записав у сховище, — список справ. Усе інше або відновлюють явно (чернетку, відкритий екран), або чесно починають заново."
      en: "React state does not come back by itself: the process started anew. Only what the app wrote to the store is left — the task list. Everything else is either restored explicitly (the draft, the open screen) or honestly starts over."

  - id: process-death
    kind: example
    runtime: concept-preview
    dir: process-death
    entry: main.jsx
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
      loading: { uk: "Відновлюю справи…", en: "Restoring tasks…" }
      newTask: { uk: "Нова справа", en: "New task" }
      add: { uk: "Додати", en: "Add" }
      kill: { uk: "Завершити процес і запустити знову", en: "End the process and start again" }
      killed: { uk: "процес завершено, новий запуск", en: "process ended, new launch" }
    title:
      uk: "Імітоване завершення процесу"
      en: "A simulated process death"
    body:
      uk: |
        Планувальник зберігає справи у сховище (імітацію на пристрої). Службова кнопка під рамкою знімає весь застосунок і запускає його знову — так у перегляді виглядає завершення процесу: стан React зникає, сховище лишається.

        Натисни **Запустити** й подивись, як після «Відновлюю справи…» з’являється збережена справа.
      en: |
        The planner saves tasks to the store (an imitation on the device). The helper button below the frame unmounts the whole app and starts it again — that is how process death looks in the preview: React state is gone, the store stays.

        Press **Run** and watch the saved task appear after “Restoring tasks…”.
    tryIt:
      uk: |
        1. Введи назву в поле «Нова справа» й натисни **Додати**, потім почни вводити ще одну, але не додавай. Натисни **Завершити процес і запустити знову**: додана справа повернулася, а недописана назва зникла.
        2. У `PlannerApp.jsx` зміни `PERSIST_DRAFT` на `true` і запусти. Знову почни вводити назву й заверши процес: тепер чернетка теж повертається — у консолі видно, що кожна зміна поля записується під ключ `jsll.planner.v1.draft`.
        3. Подумай, чим ти заплатив: запис у сховище на кожну літеру. У справжньому застосунку чернетку зберігають рідше — наприклад, коли застосунок іде у фон. Поверни `PERSIST_DRAFT` у `false`.
      en: |
        1. Type a title into the “New task” field and press **Add**, then start typing another one but do not add it. Press **End the process and start again**: the added task came back, and the half-typed title is gone.
        2. In `PlannerApp.jsx` change `PERSIST_DRAFT` to `true` and run. Start typing a title again and end the process: now the draft comes back too — the console shows every change of the field written under the key `jsll.planner.v1.draft`.
        3. Think about the price: a write to the store for every letter. A real app saves the draft less often — for example, when the app goes to the background. Set `PERSIST_DRAFT` back to `false`.
    limits:
      uk: "Це концептуальний перегляд у браузері через react-native-web, а не native-застосунок. «Завершення процесу» тут — лише повторний монтаж дерева React; сховище — імітація в пам’яті сторінки. Холодний старт і нативне сховище перевіряєш на заявленій цілі в локальних завданнях цього розділу: там повне закриття застосунку заступає завершення процесу системою, бо й тоді зникає вся пам’ять JavaScript. Немає native view, вигляду платформи й справжніх жестів."
      en: "This is a concept preview in the browser through react-native-web, not a native app. “Process death” here is only a remount of the React tree; the store is an imitation in the page's memory. A cold start and the native store are checked on your declared target in this unit's local tasks: there, closing the app completely stands in for process termination by the system, because then too all JavaScript memory is gone. There are no native views, platform look or real gestures."

  - id: recall-unknown
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: unknown-before-use
        from: js-14-06-unknown-vs-any
        prompt:
          uk: "`const data: unknown = JSON.parse(text);` Що `tsc` скаже на рядок `console.log(data.records.length);`?"
          en: "`const data: unknown = JSON.parse(text);` What does `tsc` say about the line `console.log(data.records.length);`?"
        answer:
          type: choice
          options:
            - id: error
              text:
                uk: "Помилку: зі значенням типу `unknown` нічого не можна робити, доки його не звужено перевіркою"
                en: "An error: nothing can be done with an `unknown` value until a check narrows it"
            - id: fine
              text:
                uk: "Нічого: `JSON.parse` повертає об’єкт, тож поле можна читати"
                en: "Nothing: `JSON.parse` returns an object, so the field can be read"
              why:
                uk: "Так було б з `any` — і тоді помилку побачили б лише під час виконання. `unknown` вимагає перевірки перед використанням."
                en: "That would be `any` — and then the error would only show up at runtime. `unknown` demands a check before use."
            - id: runtime
              text:
                uk: "Нічого, але під час виконання `unknown` кине помилку"
                en: "Nothing, but at runtime `unknown` throws an error"
              why:
                uk: "Типи прибираються перед запуском; `unknown` нічого не кидає. Він діє лише під час перевірки типів."
                en: "Types are removed before running; `unknown` throws nothing. It acts only during type checking."
          correct: [error]
        explanation:
          uk: "`unknown` змушує спершу перевірити дані. Валідатор моделі — саме така перевірка: він бере `unknown` і повертає або типізоване значення, або помилки полів."
          en: "`unknown` forces you to check the data first. A model validator is exactly such a check: it takes `unknown` and returns either a typed value or field errors."

  - id: restore-habits
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: restore-habits
    entry: index.js
    editable: [restore.ts]
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      water: { uk: "Пити воду", en: "Drink water" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
    title:
      uk: "Відновлення звичок під час запуску"
      en: "Restoring habits on launch"
    instructions:
      uk: |
        Напиши в `restore.ts` функцію `restoreSnapshot(raw)` для трекера звичок. `raw` — те, що повернув `getItem`: текст або `null`. Використовуй готові `migrate` з `migrate.ts` і `validateHabit` зі спільної моделі `models/habit.ts`; обидва файли не змінюй.

        - `null` → `{ ok: true, records: [] }`.
        - Текст, який не розбирається як JSON, → `{ ok: false, reason: 'unparsable' }`. Функція ніколи не кидає помилку.
        - Якщо `migrate` повернув `ok: false`, віддай його причину: `{ ok: false, reason: 'newer' }` або `{ ok: false, reason: 'invalid' }`.
        - Кожен запис перевір `validateHabit`. Перший невалідний запис відхиляє **весь** знімок: `{ ok: false, reason: 'invalid-record', index, errors }`, де `index` — його номер у списку, а `errors` — помилки від валідатора. Жодних «частково відновлених» списків.
        - Якщо все гаразд — `{ ok: true, records }`, де `records` — значення, які повернув валідатор (наприклад, назви в них уже без пробілів по краях).
      en: |
        Write `restoreSnapshot(raw)` for the habit tracker in `restore.ts`. `raw` is what `getItem` returned: text or `null`. Use the ready `migrate` from `migrate.ts` and `validateHabit` from the shared model `models/habit.ts`; do not change either file.

        - `null` → `{ ok: true, records: [] }`.
        - Text that does not parse as JSON → `{ ok: false, reason: 'unparsable' }`. The function never throws.
        - If `migrate` returned `ok: false`, pass its reason on: `{ ok: false, reason: 'newer' }` or `{ ok: false, reason: 'invalid' }`.
        - Check every record with `validateHabit`. The first invalid record rejects the **whole** snapshot: `{ ok: false, reason: 'invalid-record', index, errors }`, where `index` is its position in the list and `errors` are the validator's errors. No “partly restored” lists.
        - If everything is fine — `{ ok: true, records }`, where `records` are the values the validator returned (their names, for example, already have no spaces at the ends).
    testTitles:
      "nothing saved gives an empty list":
        uk: "Без збережених даних — порожній список"
        en: "Nothing saved gives an empty list"
      "a current snapshot gives the validated habits":
        uk: "Поточний знімок дає перевірені звички"
        en: "A current snapshot gives the validated habits"
      "a v0 snapshot is migrated before it is validated":
        uk: "Знімок v0 мігрують перед перевіркою"
        en: "A v0 snapshot is migrated before it is validated"
      "damaged text is reported as unparsable instead of throwing":
        uk: "Пошкоджений текст дає `unparsable`, а не помилку"
        en: "Damaged text is reported as `unparsable` instead of throwing"
      "a newer or unknown snapshot is reported with the migration reason":
        uk: "Новіший чи невідомий знімок повертає причину з міграції"
        en: "A newer or unknown snapshot is reported with the migration reason"
      "one invalid habit rejects the whole snapshot and names it":
        uk: "Одна невалідна звичка відхиляє весь знімок і називає себе"
        en: "One invalid habit rejects the whole snapshot and names it"
      "a habit with broken completions is not let through":
        uk: "Звичку з пошкодженими `completions` не пропущено"
        en: "A habit with broken `completions` is not let through"
    hints:
      nudge:
        uk: "Розклади відновлення на кроки з пояснення уроку. На якому кроці може статися виняток, а на якому — лише «поганий» результат?"
        en: "Break the restore into the steps from the lesson's explanation. At which step can an exception happen, and at which only a “bad” result?"
      explanation:
        uk: "Виняток кидає лише `JSON.parse`, тож тільки він потребує `try`/`catch`. `migrate` і `validateHabit` нічого не кидають — вони повертають об’єкт з `ok`, і ти просто перевіряєш його. Щоб знати номер невалідного запису, перебирай список з індексом, наприклад `for (const [i, item] of list.entries())`, і виходь з функції на першому `ok: false`. А в список результату клади `value` з відповіді валідатора, а не сам запис зі сховища: тільки `value` гарантовано має форму моделі."
        en: "Only `JSON.parse` throws, so only it needs `try`/`catch`. `migrate` and `validateHabit` throw nothing — they return an object with `ok`, and you just check it. To know the position of an invalid record, go through the list with an index, for example `for (const [i, item] of list.entries())`, and return from the function at the first `ok: false`. And put the `value` from the validator's answer into the result list, not the record from the store itself: only `value` is guaranteed to have the model's shape."
    solutionNote:
      uk: "Кожен крок відповідає одній причині збою: `null` — нічого не збережено, `catch` — пошкоджений текст, `migrate` — чужа версія чи форма, `validateHabit` — неправильний запис. Записи в стан потрапляють лише як `value` від валідатора, тож тип `Habit[]` тут чесний: його довела перевірка, а не `as`. Невдалий результат нічого не стирає — що робити з поганими даними (відкласти під резервний ключ і показати повідомлення), вирішує код запуску; це наступний урок."
      en: "Each step matches one cause of failure: `null` — nothing saved, `catch` — damaged text, `migrate` — a foreign version or shape, `validateHabit` — a wrong record. Records reach state only as the validator's `value`, so the `Habit[]` type is honest here: a check proved it, not `as`. A failed result wipes nothing — what to do with bad data (set it aside under a backup key and show a notice) is up to the launch code; that is the next lesson."
    feedback:
      - when: { test: "a current snapshot gives the validated habits" }
        message:
          uk: "Ця перевірка дає знімок, де в назві першої звички є пробіли по краях, і чекає назву без них — так її повертає `validateHabit`. У результат має йти `value` від валідатора, а не запис зі сховища."
          en: "This check gives a snapshot whose first habit has spaces at the ends of its name and expects the name without them — that is how `validateHabit` returns it. The result must hold the validator's `value`, not the record from the store."
      - when: { test: "a v0 snapshot is migrated before it is validated" }
        message:
          uk: "Ця перевірка дає знімок версії 0 без `frequency` і чекає звичку з `frequency: 'daily'`. Спершу `migrate`, потім `validateHabit`."
          en: "This check gives a version 0 snapshot without `frequency` and expects a habit with `frequency: 'daily'`. First `migrate`, then `validateHabit`."
      - when: { test: "damaged text is reported as unparsable instead of throwing" }
        message:
          uk: "Ця перевірка дає три пошкоджені тексти, зокрема порожній, і чекає `{ ok: false, reason: 'unparsable' }`. Якщо в повідомленні є `threw SyntaxError`, `JSON.parse` кинув помилку — його треба обгорнути в `try`/`catch`."
          en: "This check gives three damaged texts, including an empty one, and expects `{ ok: false, reason: 'unparsable' }`. If the message says `threw SyntaxError`, `JSON.parse` threw — it needs a `try`/`catch` around it."
      - when: { test: "a newer or unknown snapshot is reported with the migration reason" }
        message:
          uk: "Ця перевірка чекає `reason: 'newer'` для знімка версії 2 і `reason: 'invalid'` для знімка без `records` та для тексту `42`. Ці причини вже повертає `migrate` — передай їх далі."
          en: "This check expects `reason: 'newer'` for a version 2 snapshot and `reason: 'invalid'` for a snapshot without `records` and for the text `42`. `migrate` already returns these reasons — pass them on."
      - when: { test: "one invalid habit rejects the whole snapshot and names it" }
        message:
          uk: "Ця перевірка дає три звички, друга з порожньою назвою, і чекає `{ ok: false, reason: 'invalid-record', index: 1, errors: { name: 'required' } }`. Відкинути невалідну звичку й повернути решту — це тихо загубити запис."
          en: "This check gives three habits, the second with an empty name, and expects `{ ok: false, reason: 'invalid-record', index: 1, errors: { name: 'required' } }`. Dropping the invalid habit and returning the rest silently loses a record."
      - when: { test: "a habit with broken completions is not let through" }
        message:
          uk: "Ця перевірка дає звичку, у якої `completions` — текст, а не масив, і чекає `invalid-record` з `index: 0`. Тип `Habit[]` таких даних не зупинить — лише `validateHabit`."
          en: "This check gives a habit whose `completions` is a text, not an array, and expects `invalid-record` with `index: 0`. The `Habit[]` type does not stop such data — only `validateHabit` does."

  - id: to-project
    kind: transfer
    capstoneStep: RN-05
    body:
      uk: "У проєктному кроці `<проєкт>-native` під час запуску відновлює записи тим самим ланцюжком: `getItem` → розбір → міграція → валідатор спільної моделі (`validateItem`, `validateTask`, `validateHabit` чи `validateExpense` твого проєкту). Перезапуск після закриття застосунку перевіряєш на заявленій цілі."
      en: "In the project step `<project>-native` restores its records on launch with the same chain: `getItem` → parse → migrate → the shared model's validator (your project's `validateItem`, `validateTask`, `validateHabit` or `validateExpense`). You check a restart after closing the app on your declared target."
