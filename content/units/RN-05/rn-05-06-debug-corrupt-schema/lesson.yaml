          en: "Commit the repair together with your notes."
        command: "git add -A\ngit commit -m \"Repair the RN-05 load path\""
    verify:
      - id: reproduced
        text:
          uk: "Я відтворив на заявленій цілі всі чотири випадки й записав, що побачив: хибні позначки, зависання, екран помилки й порожній список після раннього запису."
          en: "I reproduced all four cases on my declared target and wrote down what I saw: wrong marks, the hang, the error screen and the empty list after the early write."
      - id: repaired
        text:
          uk: "Після ремонту застарілий знімок показує правильні позначки, а обидва пошкоджені — повідомлення про відновлення без падіння."
          en: "After the repair the outdated snapshot shows the correct marks, and both damaged ones show the recovery notice without a crash."
      - id: restart
        text:
          uk: "Позначка, змінена перед повним закриттям застосунку, лишилася після нового запуску."
          en: "A mark changed before closing the app completely was still there after the new launch."
    troubleshooting:
      - problem: { uk: "Unable to resolve module @react-native-async-storage/async-storage", en: "Unable to resolve module @react-native-async-storage/async-storage" }
        fix: { uk: "Імовірно, крок 2 виконано не в теці проєкту. Перейди в `rn05-lab`, повтори `npx expo install @react-native-async-storage/async-storage` і перезапусти dev-сервер командою `npx expo start --clear`. Не перевірено під час підготовки уроку.", en: "Step 2 was probably run outside the project folder. Go into `rn05-lab`, repeat `npx expo install @react-native-async-storage/async-storage` and restart the dev server with `npx expo start --clear`. Not checked while preparing this lesson." }
      - problem: { uk: "Після зміни `SEED` на цілі нічого не змінилося", en: "Nothing changed on the target after changing `SEED`" }
        fix: { uk: "Fast Refresh оновлює код, але зберігає стан компонентів, тож `applySeed` не запускається знову. Натисни `r` у терміналі dev-сервера — це повне перезавантаження JavaScript.", en: "Fast Refresh updates the code but keeps component state, so `applySeed` does not run again. Press `r` in the dev server terminal — that is a full JavaScript reload." }
      - problem: { uk: "Expo Go пише, що проєкт несумісний з цією версією Expo Go", en: "Expo Go says the project is incompatible with this version of Expo Go" }
        fix: { uk: "Онови Expo Go: проєкт створено для SDK 57. Якщо оновлення немає, працюй з емулятором чи симулятором. Не перевірено під час підготовки уроку.", en: "Update Expo Go: the project was created for SDK 57. If there is no update, work with an emulator or a simulator. Not checked while preparing this lesson." }
    recovery:
      uk: "Навчальний проєкт `rn05-lab` окремий від твого проєкту, тож у `native/` нічого не змінюється. Зламаний стан закомічено в кроці 4: `git restore useTasks.ts` повертає файл до нього. Якщо залежності зламалися, перейменуй теку (`mv rn05-lab rn05-lab-old`) і почни з кроку 1."
      en: "The lab project `rn05-lab` is separate from your project, so nothing in `native/` changes. The broken state was committed in step 4: `git restore useTasks.ts` returns the file to it. If the dependencies break, rename the folder (`mv rn05-lab rn05-lab-old`) and start again from step 1."

  - id: to-project
    kind: transfer
    capstoneStep: RN-05
    body:
      uk: "У проєктному кроці той самий ремонт стане частиною `native/`: пошкоджений знімок твого проєкту йде під резервний ключ з повідомленням замість падіння, застарілий знімок v0 мігрує, а збереження чекає вдалого завантаження. Перевіряєш це на заявленій цілі так само — засіяними знімками й повним перезапуском."
      en: "In the project step the same repair becomes part of `native/`: your project's corrupt snapshot goes under a backup key with a notice instead of a crash, the outdated v0 snapshot migrates, and saving waits for a successful load. You check it on your declared target the same way — with seeded snapshots and a full restart."
