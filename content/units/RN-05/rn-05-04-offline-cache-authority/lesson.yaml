id: rn-05-04-offline-cache-authority
unit: RN-05
title:
  uk: "Офлайн, кеш і джерело істини"
  en: "Offline, cache and authority"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Розписати, хто сьогодні володіє кожною частиною даних проєкту (джерело істини — сховище на пристрої, кешу ще немає), і позначити, які значення стануть кешем сервера пізніше, у NO-06."
    en: "Map who owns each piece of capstone data today (the device store is the authority; nothing is a cache yet) and mark which values become a cache of a server later, in NO-06."
  - uk: "Пояснити, чому офлайн-зміну не можна показувати як «синхронізовано», коли сервера немає, і чесно позначати стани «збережено на цьому пристрої» та «очікує надсилання»."
    en: "Explain why an offline edit must never be shown as “synced” when no server exists, and label saved-on-device and pending states honestly."
prerequisites: [rn-05-03-schema-migration, re-06-05-cache-invalidation]
subskills:
  - { family: N-05, skill: "offline/cache vs authority", depth: intro }
glossary: [offline-first, data-authority]
selfCheck: [predict-airplane-label, save-label]

blocks:
  - id: who-owns-what
    kind: explanation
    title:
      uk: "Де живе правда про дані"
      en: "Where the truth about the data lives"
    body:
      uk: |
        У розділі про React кеш був копією: справжні дані тримав сервер, і загублений запис у кеші просто читали знову. На телефоні в проєкту сервера **немає**. Тож для кожної частини даних треба чесно відповісти, хто її [[data-authority|джерело істини]]:

        | Дані | Джерело істини зараз | Пізніше, з NO-06 |
        |---|---|---|
        | записи (бажання, справи, звички, витрати) | сховище на пристрої | сервер; копія на пристрої — кеш |
        | недописана форма | стан екрана в пам’яті | так само |
        | підсумки й лічильники | ніде: їх щоразу обчислюють із записів | так само |

        Звідси два висновки. Перший: записи на пристрої — не кеш. Втратиш їх — відновлювати нема звідки. Другий: застосунок, що працює без мережі, — це [[offline-first|offline-first]], а не «вдає, що мережа є». Після зміни в режимі польоту чесна позначка — «збережено на цьому пристрої». «Синхронізовано» означає, що сервер підтвердив цю версію, а без сервера такого підтвердження бути не може. «Очікує надсилання» має сенс лише тоді, коли є куди надсилати.
      en: |
        In the React unit the cache was a copy: the real data lived on a server, and a lost cache entry was simply read again. On a phone the project has **no** server. So for every piece of data you have to say honestly who its [[data-authority|authority]] is:

        | Data | Authority now | Later, from NO-06 |
        |---|---|---|
        | records (wishes, tasks, habits, expenses) | the device store | the server; the device copy is a cache |
        | a half-filled form | the screen's state in memory | the same |
        | totals and counters | nowhere: they are computed from the records every time | the same |

        Two conclusions follow. First: records on the device are not a cache. Lose them and there is nowhere to restore them from. Second: an app that works without a network is [[offline-first|offline-first]], not “pretending the network is there”. After an edit in airplane mode the honest label is “saved on this device”. “Synced” means a server confirmed this version, and without a server no such confirmation can exist. “Pending upload” makes sense only when there is somewhere to upload to.

  - id: predict-airplane-label
    kind: prediction
    prompt:
      uk: "У застосунку витрат немає сервера. Людина вмикає режим польоту, змінює суму витрати, і запис у сховище на пристрої вдався. Яку позначку має показати рядок цієї витрати?"
      en: "The expense app has no server. A person turns on airplane mode, changes an expense's amount, and the write to the device store succeeded. Which label should that expense's row show?"
    runnable: false
    answer:
      type: choice
      options:
        - id: synced
          text:
            uk: "«Синхронізовано»: запис збережено, а як з’явиться мережа, усе синхронізується саме"
            en: "“Synced”: the record is saved, and once the network is back everything syncs by itself"
          why:
            uk: "Синхронізувати нема з чим: сервера немає. Офлайн-режим не означає, що застосунок потім кудись усе надішле."
            en: "There is nothing to sync with: there is no server. Offline mode does not mean the app will send everything somewhere later."
        - id: on-device
          text:
            uk: "«Збережено на цьому пристрої»"
            en: "“Saved on this device”"
        - id: pending
          text:
            uk: "«Очікує надсилання»"
            en: "“Pending upload”"
          why:
            uk: "Ця позначка обіцяє надсилання, а надсилати нікуди. Вона стане чесною, коли в проєкті з’явиться сервер і черга надсилання."
            en: "This label promises an upload, and there is nowhere to upload to. It becomes honest once the project has a server and an upload queue."
        - id: error
          text:
            uk: "Помилку: без мережі змінювати дані не можна"
            en: "An error: data cannot be changed without a network"
          why:
            uk: "Сховище на пристрої працює без мережі, і запис якраз удався. Помилка тут була б неправдою."
            en: "The device store works without a network, and the write did succeed. An error here would be untrue."
      correct: [on-device]
    explanation:
      uk: "Джерело істини зараз — сховище на пристрої, і зміна туди потрапила. Отже, правда — «збережено на цьому пристрої». Від мережі ця позначка не залежить: з увімкненою мережею без сервера вона така сама."
      en: "The authority now is the device store, and the edit reached it. So the truth is “saved on this device”. This label does not depend on the network: with the network on and no server it is the same."

  - id: ownership-diagram
    kind: visual
    visual: diagram
    title:
      uk: "Хто чим володіє"
      en: "Who owns what"
    textEquivalent:
      uk: "Ліворуч три види даних: записи, чернетка форми й підсумки. Записи належать сховищу на пристрої — це їхнє джерело істини зараз. Чернетка належить стану екрана в пам’яті. Підсумки не належать нікому: їх обчислюють із записів. Офлайн-зміна запису йде у сховище на пристрої й отримує позначку «збережено на цьому пристрої», а не «синхронізовано». Останній крок показує майбутнє, з NO-06: з’являється сервер, джерелом істини для записів стає він, а сховище на пристрої перетворюється на кеш його даних."
      en: "On the left are three kinds of data: records, a form draft and totals. Records belong to the device store — that is their authority now. The draft belongs to the screen's state in memory. Totals belong to nobody: they are computed from the records. An offline edit of a record goes to the device store and gets the label “saved on this device”, not “synced”. The last step shows the future, from NO-06: a server appears, it becomes the authority for records, and the device store turns into a cache of its data."
    spec:
      layout: grid
      nodes:
        - { id: records, label: { uk: "записи", en: "records" }, w: 120, col: 0, row: 0 }
        - { id: draft, label: { uk: "чернетка форми", en: "form draft" }, w: 120, col: 0, row: 1 }
        - { id: totals, label: { uk: "підсумки", en: "totals" }, w: 120, col: 0, row: 2 }
        - { id: device, label: { uk: "сховище пристрою", en: "device store" }, shape: cylinder, w: 150, col: 1, row: 0 }
        - { id: memory, label: { uk: "стан екрана", en: "screen state" }, w: 150, col: 1, row: 1 }
        - { id: computed, label: { uk: "обчислено", en: "computed" }, shape: note, w: 150, col: 1, row: 2 }
        - { id: server, label: { uk: "сервер (NO-06)", en: "server (NO-06)" }, shape: cylinder, w: 150, col: 1, row: 3 }
      edges:
        - { id: records-device, from: records, to: device, label: { uk: "джерело істини", en: "authority" } }
        - { id: draft-memory, from: draft, to: memory }
        - { id: totals-computed, from: totals, to: computed }
        - { id: device-server, from: device, to: server, label: { uk: "стане кешем", en: "becomes a cache" }, kind: dashed }
      hidden: [server, device-server]
      steps:
        - caption:
            uk: "Записи належать сховищу на пристрої: це їхнє джерело істини зараз. Втрачені звідти записи нема звідки відновити."
            en: "Records belong to the device store: that is their authority now. Records lost from it have nowhere to be restored from."
          highlight: [records, device, records-device]
          dim: [draft, memory, totals, computed]
        - caption:
            uk: "Чернетка форми живе лише в стані екрана, а підсумки ніхто не зберігає: їх щоразу обчислюють із записів."
            en: "A form draft lives only in the screen's state, and nobody stores totals: they are computed from the records every time."
          highlight: [draft, memory, draft-memory, totals, computed, totals-computed]
          dim: [records, device, records-device]
        - caption:
            uk: "Офлайн-зміна запису потрапляє у сховище на пристрої. Чесна позначка — «збережено на цьому пристрої»: синхронізувати нема з чим."
            en: "An offline edit of a record lands in the device store. The honest label is “saved on this device”: there is nothing to sync with."
          highlight: [records, device, records-device]
          annotate:
            - { id: device, text: { uk: "збережено тут", en: "saved here" } }
        - caption:
            uk: "З NO-06 з’явиться сервер: джерелом істини для записів стане він, а сховище на пристрої — кешем. Лише тоді матимуть сенс «очікує надсилання» й «синхронізовано»."
            en: "From NO-06 a server appears: it becomes the authority for records, and the device store becomes a cache. Only then do “pending upload” and “synced” make sense."
          show: [server, device-server]
          highlight: [device, server, device-server]
          dim: [draft, memory, totals, computed]

  - id: honest-badge
    kind: example
    runtime: concept-preview
    dir: honest-badge
    entry: main.jsx
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      saving: { uk: "Зберігаю…", en: "Saving…" }
      notSaved: { uk: "Не збережено", en: "Not saved" }
      synced: { uk: "Синхронізовано ✓", en: "Synced ✓" }
      offline: { uk: "Офлайн", en: "Offline" }
      savedOnDevice: { uk: "Збережено на цьому пристрої", en: "Saved on this device" }
      acquired: { uk: "Уже отримано", en: "Already got it" }
      wanted: { uk: "Ще хочу", en: "Still wanted" }
      goOffline: { uk: "Імітувати режим польоту", en: "Simulate airplane mode" }
      goOnline: { uk: "Повернути мережу", en: "Bring the network back" }
    title:
      uk: "Позначка, що бреше"
      en: "A badge that lies"
    body:
      uk: |
        Список бажань без жодного сервера. Кнопка в рядку перемикає «Ще хочу» / «Уже отримано» й записує список у сховище на пристрої (імітацію). Під рамкою — службовий перемикач мережі.

        Натисни **Запустити**. Подивись на позначку під назвою: поки мережа є, `WishRow.jsx` пише «Синхронізовано ✓». Але синхронізувати нема з чим — цю позначку вигадано.
      en: |
        A wishlist without any server. The button in a row switches “Still wanted” / “Already got it” and writes the list into the device store (an imitation). Below the frame is a helper network switch.

        Press **Run**. Look at the badge under the name: while the network is on, `WishRow.jsx` says “Synced ✓”. But there is nothing to sync with — this badge is made up.
    tryIt:
      uk: |
        1. Натисни кнопку в рядку лампи: після запису позначка знову «Синхронізовано ✓». У консолі видно лише `setItem` у сховище на пристрої — жодного надсилання.
        2. Натисни **Імітувати режим польоту**: позначка стала «Офлайн», хоча з даними нічого не сталося. Вона описує мережу, а не те, де лежить запис.
        3. У `WishRow.jsx` заміни рядок коду з `online ? labels.synced : labels.offline` на `if (save === 'saved') badge = labels.savedOnDevice;`. Запусти й знову перемикай мережу: позначка більше не змінюється, бо вона каже правду про запис, а не про мережу. Проп `online` тепер рядку не потрібен.
      en: |
        1. Press the button in the lamp's row: after the write the badge says “Synced ✓” again. The console shows only a `setItem` to the device store — no upload at all.
        2. Press **Simulate airplane mode**: the badge became “Offline”, although nothing happened to the data. It describes the network, not where the record is.
        3. In `WishRow.jsx` replace the code line with `online ? labels.synced : labels.offline` by `if (save === 'saved') badge = labels.savedOnDevice;`. Run and switch the network again: the badge no longer changes, because it tells the truth about the record, not about the network. The row no longer needs the `online` prop.
    limits:
      uk: "Це концептуальний перегляд у браузері через react-native-web, а не native-застосунок. Перемикач мережі лише змінює змінну: справжнього режиму польоту, стану мережі пристрою й нативного сховища тут немає. Немає native view, вигляду платформи й справжніх жестів."
      en: "This is a concept preview in the browser through react-native-web, not a native app. The network switch only changes a variable: there is no real airplane mode, device network state or native store here. There are no native views, platform look or real gestures."

  - id: recall-cache
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: cache-entry-lost
        from: re-06-05-cache-invalidation
        prompt:
          uk: "У вебклієнті з сервером запис кешу `wishes:all` видалили через інвалідацію. Що станеться, коли екранові знову знадобиться цей список?"
          en: "In a web client with a server, the cache entry `wishes:all` was deleted by an invalidation. What happens when a screen needs that list again?"
        answer:
          type: choice
          options:
            - id: refetch
              text:
                uk: "Його запитають у сервера знову: дані там цілі"
                en: "It is requested from the server again: the data there is intact"
            - id: lost
              text:
                uk: "Список втрачено, доки людина не введе бажання знову"
                en: "The list is lost until the person enters the wishes again"
              why:
                uk: "Кеш — копія. Джерело істини — сервер, тож видалена копія нічого не губить."
                en: "A cache is a copy. The authority is the server, so a deleted copy loses nothing."
            - id: stale
              text:
                uk: "Екран покаже старий список, бо кеш нікуди не дівся"
                en: "The screen shows the old list, because the cache did not go anywhere"
              why:
                uk: "Інвалідація саме видаляє запис кешу (або позначає його застарілим): наступне читання йде на сервер."
                en: "An invalidation removes the cache entry (or marks it stale): the next read goes to the server."
          correct: [refetch]
        explanation:
          uk: "Видалити кеш безпечно лише тоді, коли є джерело істини деінде. У native-застосунку без сервера записи на пристрої — і є джерело істини: «почистити їх, як кеш» означає втратити їх."
          en: "Deleting a cache is safe only when the authority is somewhere else. In a native app without a server the records on the device are the authority: “clearing them like a cache” means losing them."

  - id: save-label
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: save-label
    entry: main.jsx
    editable: [saveLabel.js]
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      transit: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      lunch: { uk: "Обід", en: "Lunch" }
      saving: { uk: "Зберігаю…", en: "Saving…" }
      savedOnDevice: { uk: "Збережено на цьому пристрої", en: "Saved on this device" }
      notSaved: { uk: "Не збережено", en: "Not saved" }
      pendingUpload: { uk: "Очікує надсилання", en: "Pending upload" }
      synced: { uk: "Синхронізовано ✓", en: "Synced ✓" }
      goOffline: { uk: "Імітувати режим польоту", en: "Simulate airplane mode" }
      goOnline: { uk: "Повернути мережу", en: "Bring the network back" }
    title:
      uk: "Чесна позначка збереження"
      en: "An honest save label"
    instructions:
      uk: |
        Напиши в `saveLabel.js` чисту функцію `deriveSaveLabel(record, context)`. Рядок витрати `ExpenseRow.jsx` показує текст за її відповіддю.

        - `record.save` — результат останнього запису у сховище на пристрої: `'saving'` → `'saving'`, `'failed'` → `'not-saved'`.
        - Коли `record.save` — `'saved'`, а сервера немає (`context.serverConfigured` — `false`), відповідь завжди `'saved-on-device'`: і з мережею, і без неї, і навіть коли в записі лишився старий прапорець `uploaded: true`.
        - Лише коли сервер є: `'synced'`, якщо `record.uploaded` — `true`, інакше `'pending-upload'`.

        У перегляді сервера немає (`SERVER_URL = null`), тож жоден рядок не має показати «Синхронізовано».
      en: |
        Write a pure function `deriveSaveLabel(record, context)` in `saveLabel.js`. The expense row `ExpenseRow.jsx` shows a text based on its answer.

        - `record.save` is the result of the last write to the device store: `'saving'` → `'saving'`, `'failed'` → `'not-saved'`.
        - When `record.save` is `'saved'` and there is no server (`context.serverConfigured` is `false`), the answer is always `'saved-on-device'`: with the network and without it, and even when the record still has an old `uploaded: true` flag.
        - Only when there is a server: `'synced'` if `record.uploaded` is `true`, otherwise `'pending-upload'`.

        In the preview there is no server (`SERVER_URL = null`), so no row may show “Synced”.
    testTitles:
      "without a server a saved record is saved on this device, online or not":
        uk: "Без сервера збережений запис — «збережено на цьому пристрої», з мережею чи без"
        en: "Without a server a saved record is saved on this device, online or not"
      "without a server an uploaded flag never makes a record synced":
        uk: "Без сервера прапорець `uploaded` ніколи не робить запис синхронізованим"
        en: "Without a server an `uploaded` flag never makes a record synced"
      "a write in progress is saving and a failed write is not saved":
        uk: "Запис у процесі — `saving`, невдалий запис — `not-saved`"
        en: "A write in progress is `saving` and a failed write is `not-saved`"
      "with a server only a confirmed upload is synced":
        uk: "Із сервером синхронізовано лише підтверджене надсилання"
        en: "With a server only a confirmed upload is synced"
      "the row shows saved on this device, not synced, while online without a server":
        uk: "Рядок показує «збережено на цьому пристрої», а не «синхронізовано», з мережею без сервера"
        en: "The row shows saved on this device, not synced, while online without a server"
    hints:
      nudge:
        uk: "Яке з трьох вхідних значень — `save`, `serverConfigured`, `online` — узагалі не впливає на відповідь? І в якому порядку перевіряти решту?"
        en: "Which of the three inputs — `save`, `serverConfigured`, `online` — does not affect the answer at all? And in which order should the rest be checked?"
      explanation:
        uk: "Спершу — те, що сталося на пристрої: запис ще йде чи впав — це видно незалежно від сервера. Далі — чи є сервер узагалі: без нього будь-яке «надіслано» чи «синхронізовано» неправда, тож прапорець із запису тут не має значення. І лише за наявності сервера дивишся, чи підтвердив він цю версію. Мережа на позначку не впливає: вона каже, чи можна надіслати зараз, а не де лежить запис."
        en: "First, what happened on the device: whether the write is still running or failed is visible regardless of a server. Next, whether there is a server at all: without one, any “uploaded” or “synced” is untrue, so the record's flag does not matter here. Only with a server do you look at whether it confirmed this version. The network does not affect the label: it says whether you can upload right now, not where the record is."
    solutionNote:
      uk: "Порядок перевірок і є правило: пристрій → чи є сервер → чи підтвердив він. `online` у відповідь не входить: позначка описує, де лежить запис, а не стан мережі. Коли в NO-06 з’явиться сервер, зміниться лише `context.serverConfigured` — функція вже вміє `pending-upload` і `synced`."
      en: "The order of the checks is the rule: the device → is there a server → did it confirm. `online` is not part of the answer: the label describes where the record is, not the network state. When a server appears in NO-06, only `context.serverConfigured` changes — the function already knows `pending-upload` and `synced`."
    feedback:
      - when: { test: "without a server a saved record is saved on this device, online or not" }
        message:
          uk: "Ця перевірка дає збережений запис без сервера — з мережею й без — і обидва рази чекає `'saved-on-device'`. Мережа не робить запис синхронізованим."
          en: "This check gives a saved record without a server — with the network and without — and both times expects `'saved-on-device'`. A network does not make a record synced."
      - when: { test: "without a server an uploaded flag never makes a record synced" }
        message:
          uk: "Ця перевірка дає запис з `uploaded: true` без сервера й чекає `'saved-on-device'`. Без сервера цей прапорець — застарілий: підтвердити завантаження нікому."
          en: "This check gives a record with `uploaded: true` and no server and expects `'saved-on-device'`. Without a server this flag is stale: nobody can confirm an upload."
      - when: { test: "a write in progress is saving and a failed write is not saved" }
        message:
          uk: "Ця перевірка чекає `'saving'` для `save: 'saving'` і `'not-saved'` для `save: 'failed'` — з сервером і без, з мережею й без."
          en: "This check expects `'saving'` for `save: 'saving'` and `'not-saved'` for `save: 'failed'` — with and without a server, with and without the network."
      - when: { test: "with a server only a confirmed upload is synced" }
        message:
          uk: "Ця перевірка вмикає сервер і чекає `'synced'` лише для `uploaded: true`, а для решти збережених записів — `'pending-upload'`, з мережею й без."
          en: "This check turns on a server and expects `'synced'` only for `uploaded: true`, and `'pending-upload'` for the other saved records, with the network and without."
    limits:
      uk: "Перевірки викликають функцію напряму й малюють рядок у перегляді react-native-web. Справжнього стану мережі пристрою, сервера й нативного сховища тут немає: `online` і `serverConfigured` — просто значення."
      en: "The checks call the function directly and draw the row in the react-native-web preview. There is no real device network state, server or native store here: `online` and `serverConfigured` are plain values."

  - id: to-project
    kind: transfer
    capstoneStep: RN-05
    body:
      uk: "У проєктному кроці записи проєкту зберігаються лише на пристрої: сховище — їхнє джерело істини. Якщо покажеш у рядках позначку збереження, вона каже «збережено на цьому пристрої», а не «синхронізовано». Сервер і кеш з’являться пізніше, у NO-06."
      en: "In the project step the project's records are stored only on the device: the store is their authority. If you show a save label in the rows, it says “saved on this device”, not “synced”. A server and a cache come later, in NO-06."
