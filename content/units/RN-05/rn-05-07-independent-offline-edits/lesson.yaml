id: rn-05-07-independent-offline-edits
unit: RN-05
title:
  uk: "Самостійно: офлайн-зміни та відновлення"
  en: "Independent: offline edits and recovery"
kind: assessment
minutes: 35
contentVersion: 1
purpose:
  uk: "Перевірка всього розділу на новому матеріалі — застосунку для поливу рослин. Спершу без підказок пишеш міграцію, відновлення й підготовку до збереження, і їх перевіряють на прихованих знімках: завеликому, пошкодженому, застарілому й новішому. Потім на заявленій цілі будуєш офлайн-редагування рослин, яке переживає перезапуск і завершення процесу та чесно каже, де лежать дані."
  en: "A check of the whole unit on new material — a plant-watering app. First, without hints, you write the migration, the restore and the save preparation, and they are checked against hidden snapshots: an oversized, a corrupt, an outdated and a newer one. Then, on your declared target, you build offline editing of plants that survives a restart and process death and honestly says where the data is."
objectives:
  - uk: "Без підказок побудувати офлайн-створення, редагування й видалення, що зберігаються через адаптер сховища, переживають перезапуск і завершення процесу, перевіряються спільною моделлю й ніколи не заявляють синхронізацію з сервером, — і перевірити це на заявленій цілі."
    en: "Build, without hints, offline create/edit/delete that persists through the storage adapter, survives restart and process death, validates with a shared model and never claims server sync, verified on the declared target."
prerequisites: [rn-05-06-debug-corrupt-schema]
subskills:
  - { family: N-05, skill: "storage adapter limits", depth: assess }
  - { family: N-05, skill: "offline/cache vs authority", depth: assess }
  - { family: N-05, skill: "restart/recovery", depth: assess }
  - { family: N-05, skill: "shared TS models", depth: assess }
glossary: []
selfCheck: [plant-restore]

blocks:
  - id: the-domain
    kind: explanation
    title:
      uk: "Застосунок для поливу рослин"
      en: "A plant-watering app"
    body:
      uk: |
        Рослина — це `{ id, name, everyDays, lastWatered }`: назва, скільки днів між поливами (ціле число від 1 до 60) і дата останнього поливу `'YYYY-MM-DD'` або `null`, якщо рослину ще не поливали. Модель і її валідатор `validatePlant` лежать у спільному файлі `models/plant.ts`.

        Стара версія застосунку (знімок версії 0) зберігала `everyDays` текстом, наприклад `"3"`, а замість `null` — порожній текст `''`. Сервера в застосунку немає: сховище на пристрої — єдине джерело істини.
      en: |
        A plant is `{ id, name, everyDays, lastWatered }`: a name, how many days between waterings (a whole number from 1 to 60) and the date of the last watering `'YYYY-MM-DD'`, or `null` if the plant has not been watered yet. The model and its validator `validatePlant` live in the shared file `models/plant.ts`.

        The old app version (a version 0 snapshot) stored `everyDays` as text, for example `"3"`, and an empty text `''` instead of `null`. The app has no server: the device store is the only authority.

  - id: recall-recovery
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: four-kinds
        from: js-07-10-independent-modules-recovery
        prompt:
          uk: "Застосунок знайшов у сховищі дані, які не може використати. Що з цього завжди правильно, хоч би якою була причина?"
          en: "The app found data in the store that it cannot use. Which of these is always right, whatever the cause?"
        answer:
          type: choice
          options:
            - id: keep-and-tell
              text:
                uk: "Зберегти оригінальний текст окремо й показати людині повідомлення, а вже потім працювати далі"
                en: "Keep the original text separately and show the person a notice, and only then carry on"
            - id: clear
              text:
                uk: "Очистити ключ, щоб наступний запуск почався з чистого аркуша"
                en: "Clear the key so the next launch starts with a clean slate"
              why:
                uk: "Очищений ключ — це втрачені дані, які, можливо, ще можна було відновити вручну."
                en: "A cleared key is lost data that could perhaps still have been recovered by hand."
            - id: sample
              text:
                uk: "Підставити приклад записів, щоб екран не був порожнім"
                en: "Put sample records in so the screen is not empty"
              why:
                uk: "Вигадані записи виглядають як справжні: людина не дізнається, що її дані зникли."
                en: "Made-up records look real: the person never learns that their data is gone."
          correct: [keep-and-tell]
        explanation:
          uk: "Хоч би що сталося — текст не JSON, інша версія, неправильний запис, — нічого не губимо мовчки й нічого не вигадуємо: оригінал відкладено, людина знає, що сталося."
          en: "Whatever happened — the text is not JSON, another version, a wrong record — nothing is lost silently and nothing is made up: the original is set aside, and the person knows what happened."

  - id: plant-restore
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: plant-restore
    entry: index.js
    editable: [snapshot.ts]
    strings:
      fern: { uk: "Папороть", en: "Fern" }
      cactus: { uk: "Кактус", en: "Cactus" }
      basil: { uk: "Базилік", en: "Basil" }
      monstera: { uk: "Монстера", en: "Monstera" }
      aloe: { uk: "Алое", en: "Aloe" }
      ficus: { uk: "Фікус", en: "Ficus" }
      mint: { uk: "М’ята", en: "Mint" }
      orchid: { uk: "Орхідея", en: "Orchid" }
    title:
      uk: "Міграція, відновлення й збереження рослин"
      en: "Migrating, restoring and saving plants"
    instructions:
      uk: |
        Допиши в `snapshot.ts` три функції. `models/plant.ts` не змінюй. Перевірки використовують знімки, яких немає в демонстрації.

        **`migrate(snapshot)`**
        - Знімок без цілої невід’ємної числової `schemaVersion` або без масиву `records` → `{ ok: false, reason: 'invalid' }`.
        - Версія, більша за `CURRENT_VERSION` (1), → `{ ok: false, reason: 'newer' }`.
        - Версія 0 → версія 1: текстовий `everyDays` стає числом, `lastWatered: ''` стає `null`. Значень не вигадуй: якщо текст не є числом, вийде нечислове значення, і його відкине валідатор.
        - Поточна версія повертається такою самою. Вхідний знімок не змінюється.
        - Результат: `{ ok: true, snapshot }`.

        **`restoreSnapshot(raw)`** — `raw` є текстом із `getItem` або `null`.
        - `null` → `{ ok: true, records: [] }`.
        - Текст, що не розбирається як JSON, → `{ ok: false, reason: 'unparsable' }`. Функція ніколи не кидає помилку.
        - Невдала міграція → `{ ok: false, reason }` з її причиною.
        - Перша рослина, яку відкидає `validatePlant`, → `{ ok: false, reason: 'invalid-record', index, errors }` для всього знімка.
        - Інакше → `{ ok: true, records }` зі значеннями від валідатора.

        **`prepareSave(records)`**
        - JSON-текст `{ schemaVersion: 1, records }` → `{ ok: true, text }`.
        - Якщо текст довший за `MAX_SNAPSHOT_LENGTH`, → `{ ok: false, reason: 'too-large', length }`. Список цілком відхиляється, а не обрізається.
      en: |
        Finish three functions in `snapshot.ts`. Do not change `models/plant.ts`. The checks use snapshots that are not in the demo.

        **`migrate(snapshot)`**
        - A snapshot without a whole non-negative numeric `schemaVersion` or without a `records` array → `{ ok: false, reason: 'invalid' }`.
        - A version above `CURRENT_VERSION` (1) → `{ ok: false, reason: 'newer' }`.
        - Version 0 → version 1: a text `everyDays` becomes a number, `lastWatered: ''` becomes `null`. Do not invent values: if the text is not a number, a non-numeric value results, and the validator rejects it.
        - The current version comes back the same. The input snapshot does not change.
        - The result: `{ ok: true, snapshot }`.

        **`restoreSnapshot(raw)`** — `raw` is the text from `getItem`, or `null`.
        - `null` → `{ ok: true, records: [] }`.
        - Text that does not parse as JSON → `{ ok: false, reason: 'unparsable' }`. The function never throws.
        - A failed migration → `{ ok: false, reason }` with its reason.
        - The first plant that `validatePlant` rejects → `{ ok: false, reason: 'invalid-record', index, errors }` for the whole snapshot.
        - Otherwise → `{ ok: true, records }` with the validator's values.

        **`prepareSave(records)`**
        - The JSON text of `{ schemaVersion: 1, records }` → `{ ok: true, text }`.
        - If the text is longer than `MAX_SNAPSHOT_LENGTH` → `{ ok: false, reason: 'too-large', length }`. The list is refused whole, not cut.
    testTitles:
      "nothing stored restores an empty list":
        uk: "Без збережених даних — порожній список"
        en: "Nothing stored restores an empty list"
      "a current snapshot restores its validated plants":
        uk: "Поточний знімок відновлює перевірені рослини"
        en: "A current snapshot restores its validated plants"
      "an outdated v0 snapshot is migrated to numbers and null dates":
        uk: "Застарілий знімок v0 мігровано до чисел і `null`"
        en: "An outdated v0 snapshot is migrated to numbers and `null` dates"
      "migrate keeps a current snapshot and its input unchanged":
        uk: "`migrate` не змінює поточний знімок і вхідні дані"
        en: "`migrate` keeps a current snapshot and its input unchanged"
      "corrupt text is unparsable, never thrown and never replaced by made-up plants":
        uk: "Пошкоджений текст — `unparsable`, без винятку й без вигаданих рослин"
        en: "Corrupt text is `unparsable`, never thrown and never replaced by made-up plants"
      "a snapshot from a newer app version is reported as newer":
        uk: "Знімок новішої версії позначено як `newer`"
        en: "A snapshot from a newer app version is reported as `newer`"
      "an unknown shape is invalid":
        uk: "Невідома форма — `invalid`"
        en: "An unknown shape is `invalid`"
      "an old interval that is not a number rejects the snapshot instead of inventing one":
        uk: "Старий інтервал, що не є числом, відхиляє знімок, а не вигадує значення"
        en: "An old interval that is not a number rejects the snapshot instead of inventing one"
      "one invalid plant rejects the whole snapshot":
        uk: "Одна невалідна рослина відхиляє весь знімок"
        en: "One invalid plant rejects the whole snapshot"
      "prepareSave gives the JSON text of the current snapshot":
        uk: "`prepareSave` дає JSON-текст поточного знімка"
        en: "`prepareSave` gives the JSON text of the current snapshot"
      "an oversized list is refused whole, never cut to fit":
        uk: "Завеликий список відхилено цілком, а не обрізано"
        en: "An oversized list is refused whole, never cut to fit"
    solutionNote:
      uk: "Кожна функція чесна в одному: `migrate` лише перекладає стару форму на нову й не вигадує значень, `restoreSnapshot` або повертає перевірені записи, або каже, чому не може, а `prepareSave` відмовляє цілому списку, замість мовчки його обрізати. Жодна з них не пише у сховище: що робити з відмовою — відкласти текст і показати повідомлення — вирішує код запуску й збереження."
      en: "Each function is honest about one thing: `migrate` only translates the old shape into the new one and invents no values, `restoreSnapshot` either returns checked records or says why it cannot, and `prepareSave` refuses the whole list instead of silently cutting it. None of them writes to the store: what to do with a refusal — set the text aside and show a notice — is up to the launch and save code."
    feedback:
      - when: { error: TypeError }
        message:
          uk: "Якщо всі перевірки падають разом, виправ першу помилку в консолі. «Cannot read properties of null» означає, що поле читається, не перевіривши, що знімок — об’єкт."
          en: "If every check fails at once, fix the first error in the console. “Cannot read properties of null” means a field is read without checking that the snapshot is an object."

  - id: native-plants
    kind: local-task
    runtime: local-native
    title:
      uk: "Офлайн-полив рослин на твоїй цілі"
      en: "Offline plant watering on your target"
    intro:
      uk: |
        Друга частина — без підказок, на твоїй заявленій цілі. Створи новий проєкт Expo так само, як в уроці про налагодження (`npx create-expo-app@latest rn05-plants --template blank-typescript@sdk-57 --no-agents-md`, потім `npx expo install @react-native-async-storage/async-storage`). Скопіюй у нього `models/plant.ts` і свій `snapshot.ts` з вправи **без змін**.

        **Що має вийти:**

        - список рослин; створення (назва й інтервал), редагування, «полито сьогодні» (дата `YYYY-MM-DD` від адаптера годинника) і видалення; помилки `validatePlant` показано під полями;
        - усі зміни зберігаються через адаптер сховища за контрактом `StorageAdapter` поверх AsyncStorage; текст для запису дає `prepareSave`, а відмова `too-large` показується людині й нічого не записує;
        - запуск — машина станів `loading` → `ready` | `empty` | `failed`; дані відновлює `restoreSnapshot`; невдалий результат кладе сирий текст під `jsll.plants.v1.backup` і показує повідомлення; до вдалого завантаження нічого не записується;
        - кожен рядок показує чесну позначку: «збережено на цьому пристрої», «зберігаю…» чи «не збережено» — і ніде немає «синхронізовано»;
        - `models/plant.ts` і `snapshot.ts` не змінено: `git diff` по них порожній.

        > [!warning]
        > Цю частину описано за документацією **Expo SDK 57** (React Native 0.86) і пакета `@react-native-async-storage/async-storage` 2.2.0, який ставить `npx expo install`; на цілі автори курсу її не запускали, бо на машині, де писали урок, не було нативних інструментів. Якщо нативної цілі немає, натисни **«У мене немає емулятора чи пристрою»**: завдання запишеться як не виконане, а частину на платформі вище вже перевірено.
      en: |
        The second part — without hints, on your declared target. Create a new Expo project the same way as in the debugging lesson (`npx create-expo-app@latest rn05-plants --template blank-typescript@sdk-57 --no-agents-md`, then `npx expo install @react-native-async-storage/async-storage`). Copy `models/plant.ts` and your `snapshot.ts` from the exercise into it **unchanged**.

        **What it must do:**

        - a list of plants; create (name and interval), edit, “watered today” (a `YYYY-MM-DD` date from a clock adapter) and delete; `validatePlant` errors shown under the fields;
        - every change is saved through a storage adapter following the `StorageAdapter` contract on top of AsyncStorage; `prepareSave` gives the text to write, and a `too-large` refusal is shown to the person and writes nothing;
        - launch is a state machine `loading` → `ready` | `empty` | `failed`; `restoreSnapshot` restores the data; a failed result puts the raw text under `jsll.plants.v1.backup` and shows a notice; nothing is written before a successful load;
        - every row shows an honest label: “saved on this device”, “saving…” or “not saved” — and nowhere “synced”;
        - `models/plant.ts` and `snapshot.ts` are unchanged: `git diff` on them is empty.

        > [!warning]
        > This part is described from the documentation of **Expo SDK 57** (React Native 0.86) and of the `@react-native-async-storage/async-storage` 2.2.0 package that `npx expo install` installs; the course authors did not run it on a target, because the machine this lesson was written on had no native tooling. If you have no native target, press **“I have no emulator or device”**: the task is recorded as not performed, and the platform part above has already been checked.
    tools:
      - { name: "Node.js", version: { uk: "22.13 або новіший", en: "22.13 or newer" }, note: { uk: "мінімум для Expo SDK 57 за таблицею версій Expo", en: "the minimum for Expo SDK 57 per Expo's version table" } }
      - { name: "Expo SDK", version: "57 (React Native 0.86.3)" }
      - { name: "@react-native-async-storage/async-storage", version: "2.2.0" }
      - { name: { uk: "Заявлена ціль", en: "Declared target" }, version: { uk: "з RN-01", en: "from RN-01" }, note: { uk: "емулятор Android, симулятор iOS або телефон з Expo Go для SDK 57", en: "an Android emulator, an iOS simulator or a phone with Expo Go for SDK 57" } }
    steps:
      - text:
          uk: "Збери застосунок за вимогами вище й запусти його на своїй цілі через `npx expo start`."
          en: "Build the app to the requirements above and run it on your target with `npx expo start`."
      - text:
          uk: "Увімкни на цілі режим польоту. Додай три рослини, зміни інтервал однієї, познач другу політою, видали третю. Подивись на позначки рядків."
          en: "Turn on airplane mode on the target. Add three plants, change one's interval, mark the second watered, delete the third. Look at the row labels."
        expect:
          uk: "Усі зміни працюють без мережі, а рядки кажуть «збережено на цьому пристрої»."
          en: "Every change works without a network, and the rows say “saved on this device”."
      - text:
          uk: "Перезапусти застосунок клавішею `r`, потім закрий його повністю (Android: прибери зі списку недавніх; iOS: змахни вгору в перемикачі застосунків) і відкрий знову."
          en: "Reload the app with the `r` key, then close it completely (Android: remove it from the recent apps; iOS: swipe it up in the app switcher) and open it again."
        expect:
          uk: "Обидва рази — ті самі дві рослини з тими самими інтервалами й датою поливу. Не перевірено під час підготовки уроку."
          en: "Both times — the same two plants with the same intervals and watering date. Not checked while preparing this lesson."
      - text:
          uk: "Тимчасово засій під `jsll.plants.v1` обірваний текст (як `seed.ts` в уроці про налагодження) і перезапусти: має з’явитися повідомлення про відновлення без падіння. Прибери засів."
          en: "Temporarily seed cut-off text under `jsll.plants.v1` (like `seed.ts` in the debugging lesson) and reload: the recovery notice must appear without a crash. Remove the seeding."
      - text:
          uk: "Переконайся, що модель і функції знімка не змінено, і закоміть."
          en: "Make sure the model and the snapshot functions are unchanged, and commit."
        command: "git diff --stat -- models/plant.ts snapshot.ts\ngit add -A\ngit commit -m \"Offline plant watering with restore and recovery\""
        expect:
          uk: "`git diff --stat` нічого не друкує."
          en: "`git diff --stat` prints nothing."
    verify:
      - id: offline-crud
        text:
          uk: "У режимі польоту я створив, змінив, полив і видалив рослину на заявленій цілі, і жоден рядок не казав «синхронізовано»."
          en: "In airplane mode I created, changed, watered and deleted a plant on my declared target, and no row said “synced”."
      - id: survives
        text:
          uk: "Після перезавантаження й після повного закриття застосунку дані були ті самі."
          en: "After a reload and after closing the app completely, the data was the same."
      - id: recovers
        text:
          uk: "Засіяний пошкоджений знімок дав повідомлення про відновлення без падіння, а сирий текст лежав під резервним ключем."
          en: "A seeded corrupt snapshot gave the recovery notice without a crash, and the raw text was under the backup key."
      - id: shared-unchanged
        text:
          uk: "`models/plant.ts` і `snapshot.ts` у проєкті такі самі, як у вправі."
          en: "`models/plant.ts` and `snapshot.ts` in the project are the same as in the exercise."
    troubleshooting:
      - problem: { uk: "Після повного закриття застосунку рослин немає", en: "The plants are gone after closing the app completely" }
        fix: { uk: "Перевір, чи зберігання справді йде через адаптер AsyncStorage, а не через стан у пам’яті, і чи не записує застосунок порожній список до кінця читання (урок про асинхронне завантаження). Не перевірено під час підготовки уроку.", en: "Check that saving really goes through the AsyncStorage adapter, not state in memory, and that the app does not write an empty list before the read finishes (the async loading lesson). Not checked while preparing this lesson." }
      - problem: { uk: "Після зміни коду засіву на цілі нічого не змінилося", en: "Nothing changed on the target after changing the seeding code" }
        fix: { uk: "Fast Refresh зберігає стан компонентів, тож код запуску не виконується знову. Натисни `r` у терміналі dev-сервера — це повне перезавантаження JavaScript.", en: "Fast Refresh keeps component state, so the launch code does not run again. Press `r` in the dev server terminal — that is a full JavaScript reload." }
      - problem: { uk: "Unable to resolve module @react-native-async-storage/async-storage", en: "Unable to resolve module @react-native-async-storage/async-storage" }
