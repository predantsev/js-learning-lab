          en: "Run the tests."
        command: "node --test"
        expect:
          uk: "Щонайменше два тести з `✔` і `ℹ fail 0`, як у кроці 5 вступу."
          en: "At least two tests with `✔` and `ℹ fail 0`, as in step 5 of the introduction."
      - text:
          uk: "Доведи, що тест скасування щось перевіряє: в `app.js` тимчасово прибери з `submit` реакцію на `signal` для задачі, що чекає, запусти `node --test`, побач, що тест скасовано через `timeout`, поверни код і запусти ще раз."
          en: "Prove that the cancellation test checks something: in `app.js` temporarily remove `submit`’s reaction to `signal` for a waiting job, run `node --test`, see the test cancelled by its `timeout`, restore the code and run once more."
        command: "node --test"
        expect:
          uk: "Спершу `ℹ cancelled 1` і `'test timed out after 2000ms'`, як у кроці 6 вступу, після відновлення — знову `ℹ fail 0` і `ℹ cancelled 0`."
