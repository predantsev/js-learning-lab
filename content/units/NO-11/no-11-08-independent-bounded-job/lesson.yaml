          en: "Without hints, add a shutdown test to `runner.test.js`: while one job is being built and another waits, `shutdown()` rejects the waiting one and a new one with `ShutdownError` and fulfills only after the first has finished. Give the test `{ timeout: 2000 }`."
      - text:
