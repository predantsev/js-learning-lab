    title:
      uk: "exportRecords: увесь файл або нічого"
      en: "exportRecords: the whole file or nothing"
    instructions:
      uk: |
        Зараз `exportRecords(source, destPath, { signal })` в `app.js` пише записи просто в `destPath`, не зважає на `false` від `write()`, на помилки й на `signal`. Перероби її:

        - пише кожен запис із `source` (readable stream об’єктів) у `destPath` одним рядком JSON;
        - коли джерело падає, відхиляється **з тією самою помилкою**, а старий `destPath` лишається таким, як був;
        - після помилки чи скасування в теці не лишається ні часткового, ні тимчасового файла;
        - `signal` скасовує експорт: promise відхиляється з `AbortError`;
        - коли файл не вдається записати, джерело теж закривається.

        `index.js` і `habit-source.js` лише для читання. **Запустити** робить повний експорт, експорт з джерелом, що падає на записі 300, і скасований через 30 мс — і друкує файли в теці. Тимчасовий файл клади в ту саму теку, що й `destPath`: пісочниця дозволяє писати лише в теці вправи, а `rename` між різними файловими системами відхиляється з `EXDEV`. Перевірки дають функції щонайбільше 2 с і роблять для кожного випадку окрему теку.
      en: |
        Right now `exportRecords(source, destPath, { signal })` in `app.js` writes the records straight into `destPath` and ignores `write()`’s `false`, errors and the `signal`. Rework it:

        - it writes every record of `source` (a readable stream of objects) into `destPath` as one line of JSON;
        - when the source fails, it rejects **with that same error**, and the old `destPath` stays as it was;
        - after an error or an abort the folder holds neither a partial nor a temporary file;
        - `signal` cancels the export: the promise rejects with `AbortError`;
        - when the file cannot be written, the source is closed too.

        `index.js` and `habit-source.js` are read-only. **Run** makes a complete export, an export whose source fails at record 300, and one aborted after 30 ms — and prints the files in the folder. Put the temporary file in the same folder as `destPath`: the sandbox lets you write only inside the exercise folder, and `rename` across file systems rejects with `EXDEV`. The checks give the function at most 2 s and use a separate folder for each case.
    testTitles:
      "writes every record to destPath as one JSON line":
        uk: "Пише кожен запис у `destPath` одним рядком JSON"
        en: "Writes every record to `destPath` as one JSON line"
      "a failing source rejects with its error and leaves the old destPath untouched":
        uk: "Джерело, що падає, відхиляє з його помилкою, а старий `destPath` не змінено"
        en: "A failing source rejects with its error and leaves the old `destPath` untouched"
      "no partial or temporary file is left after a failure":
        uk: "Після помилки не лишається ні часткового, ні тимчасового файла"
        en: "No partial or temporary file is left after a failure"
      "an abort rejects with an AbortError and leaves no file":
        uk: "Скасування відхиляє з `AbortError` і не лишає файла"
        en: "An abort rejects with an `AbortError` and leaves no file"
      "when the file cannot be written, the source is closed too":
        uk: "Коли файл не вдається записати, джерело теж закрито"
        en: "When the file cannot be written, the source is closed too"
    hints:
      nudge:
        uk: "Яка функція закриває всі етапи ланцюжка, коли один з них падає, і приймає `signal`? І куди писати, щоб незавершений файл ніколи не мав справжньої назви?"
        en: "Which function closes every stage of a chain when one of them fails, and takes a `signal`? And where do you write so that an unfinished file never has the real name?"
      explanation:
        uk: "`pipeline` з `node:stream/promises` приймає етапи по черзі й наостанок об’єкт `{ signal }`. Записи — це об’єкти, а файл приймає текст, тож між ними потрібен етап, що робить з запису рядок: асинхронна функція-генератор (`async function* (items) { for await (const item of items) yield … }`) або `Transform` з `writableObjectMode: true`. Тимчасовий файл і `rename` ти знаєш з NO-02: так приклад NO-02 писав `wishlist.json.2.tmp`, а потім `rename` ставив його на місце `wishlist.json`. У `catch` прибери тимчасовий файл через `rm(path, { force: true })` і кинь ту саму помилку далі."
        en: "`pipeline` from `node:stream/promises` takes the stages in order and, last, an object `{ signal }`. Records are objects and the file takes text, so between them you need a stage that turns a record into a line: an async generator function (`async function* (items) { for await (const item of items) yield … }`) or a `Transform` with `writableObjectMode: true`. You know the temporary file and `rename` from NO-02: that is how the NO-02 example wrote `wishlist.json.2.tmp` and then `rename` put it in place of `wishlist.json`. In `catch` remove the temporary file with `rm(path, { force: true })` and throw the same error on."
    solutionNote:
      uk: "`pipeline` з’єднує джерело, генератор, що робить з кожного запису рядок, і файл `.tmp`; він же стежить за backpressure, закриває всі потоки при помилці чи скасуванні й відхиляє promise один раз. Лише повний файл перейменовується на `destPath`, тож старий файл замінюється одним кроком. `catch` прибирає тимчасовий файл і повторює помилку. Рівноцінно — `Transform` замість генератора й прибирання у `finally`, якщо `rename` не відбувся."
      en: "`pipeline` connects the source, a generator that turns each record into a line, and the `.tmp` file; it also watches backpressure, closes every stream on an error or an abort and rejects the promise once. Only a complete file is renamed to `destPath`, so the old file is replaced in one step. `catch` removes the temporary file and rethrows. Equivalently — a `Transform` instead of the generator and cleanup in `finally` when the `rename` did not happen."
    feedback:
      - when: { test: "writes every record to destPath as one JSON line" }
        message:
          uk: "Ця перевірка експортує 400 записів і очікує в теці лише `expenses.jsonl` з 400 рядками JSON — останній `{\"id\":\"e-400\", …}`. Якщо в теці лишився тимчасовий файл, після успіху його треба перейменувати на `destPath`."
          en: "This check exports 400 records and expects the folder to hold only `expenses.jsonl` with 400 lines of JSON — the last one `{\"id\":\"e-400\", …}`. If a temporary file is left in the folder, it has to be renamed to `destPath` after success."
      - when: { test: "a failing source rejects with its error and leaves the old destPath untouched" }
        message:
          uk: "Ця перевірка кладе в `expenses.jsonl` старий експорт, а джерело падає на записі 250. Вона очікує відхилення саме з помилкою джерела (`record 250 could not be read`) і старий вміст файла без змін. Пиши в тимчасовий файл, а `destPath` замінюй лише після успіху."
          en: "This check puts an old export into `expenses.jsonl`, and the source fails at record 250. It expects a rejection with exactly the source’s error (`record 250 could not be read`) and the old content of the file unchanged. Write into a temporary file and replace `destPath` only after success."
      - when: { test: "no partial or temporary file is left after a failure" }
        message:
          uk: "Ця перевірка очікує порожню теку після експорту, що впав на записі 250. `pipeline` закриває потоки, але файлів не видаляє: прибери тимчасовий файл у `catch` чи `finally`."
          en: "This check expects an empty folder after an export that failed at record 250. `pipeline` closes the streams but deletes no files: remove the temporary file in `catch` or `finally`."
      - when: { test: "an abort rejects with an AbortError and leaves no file" }
        message:
          uk: "Ця перевірка скасовує повільний експорт через 40 мс і очікує відхилення з назвою `AbortError` і порожню теку. Передай `signal` у `pipeline` (останнім аргументом, `{ signal }`) і прибери тимчасовий файл."
          en: "This check aborts a slow export after 40 ms and expects a rejection named `AbortError` and an empty folder. Pass `signal` to `pipeline` (as the last argument, `{ signal }`) and remove the temporary file."
      - when: { test: "when the file cannot be written, the source is closed too" }
        message:
          uk: "Ця перевірка пише в теку, якої немає (помилка `ENOENT`), і очікує, що після відхилення `source.destroyed` буде `true`. `.pipe()` не закриває інших етапів, коли один падає; `pipeline` закриває."
          en: "This check writes into a folder that does not exist (the error `ENOENT`) and expects `source.destroyed` to be `true` after the rejection. `.pipe()` does not close the other stages when one fails; `pipeline` does."

  - id: to-project
    kind: transfer
    capstoneStep: NO-11
    body:
      uk: "У кроці проєкту цього розділу `importJsonLines` у `src/importer.ts` запускає `pipeline(source, splitLines, check, { signal })`: поганий рядок названо за номером, скасування закриває всі етапи, а в сховище нічого не потрапляє, доки всі рядки не прочитано й не перевірено. `exportToFile` пише в тимчасовий файл, робить `rename` лише після успіху й `rm` тимчасового файлу після помилки чи скасування: `pipeline` закриває потоки, але файлів не видаляє."
      en: "In this unit’s project step `importJsonLines` in `src/importer.ts` runs `pipeline(source, splitLines, check, { signal })`: a bad line is named by its number, an abort closes every stage, and nothing reaches the store until every line has been read and checked. `exportToFile` writes into a temp file, does the `rename` only after success and an `rm` of the temp file after an error or a cancel: `pipeline` closes the streams but deletes no files."
