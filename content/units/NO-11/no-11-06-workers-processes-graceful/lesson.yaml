          en: "This check gives 2000 records with `maxRecords` 250 and expects a rejection with a `RangeError` specifically and at most 3 saved batches. Compare the counter with `maxRecords` while reading, not afterwards."
      - when: { test: "an abort rejects with AbortError and saves no more batches" }
        message:
          uk: "Ця перевірка скасовує `signal`, поки зберігається 3-тя з 20 порцій, і очікує відхилення з назвою `AbortError`, не більше 4 збережених порцій і жодної після відхилення. Перевіряй `signal` після кожного `saveBatch`, наприклад `signal?.throwIfAborted()`."
          en: "This check aborts `signal` while the 3rd of 20 batches is being saved and expects a rejection named `AbortError`, at most 4 saved batches and none after the rejection. Check `signal` after every `saveBatch`, for example with `signal?.throwIfAborted()`."
      - when: { test: "every FileHandle it opened is closed — after success, RangeError and abort" }
