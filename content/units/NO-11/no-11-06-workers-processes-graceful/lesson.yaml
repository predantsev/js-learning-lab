id: no-11-06-workers-processes-graceful
unit: NO-11
title:
  uk: "Worker threads, процеси й дбайливе використання ресурсів"
  en: "Workers, processes and graceful resource use"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Вирішувати, де має працювати задача — на головному потоці, у worker thread чи в дочірньому процесі, — і пояснювати це вартістю для процесора, ізоляцією й ціною передачі даних."
    en: "Decide whether a task belongs on the main thread, in a worker thread or in a child process, and justify it by CPU cost, isolation and data-transfer cost."
  - uk: "Обмежувати записи, файли й таймери, які може тримати задача, і звільняти їх після успіху, помилки й скасування."
    en: "Cap the records, file handles and timers a job may hold and release them on completion, failure and cancellation."
prerequisites: [no-11-05-retries-idempotency, js-13-09-proxy-workers-awareness]
subskills:
  - { family: B-08, skill: "workers/processes awareness", depth: intro }
  - { family: B-08, skill: "graceful resource use", depth: intro }
glossary: [worker-thread, child-process, resource-budget]
selfCheck: [predict-worker, run-job]

blocks:
  - id: three-homes
    kind: explanation
    title:
      uk: "Три місця для роботи"
      en: "Three places for work"
    body:
      uk: |
        У браузері ти бачив [[web-worker|Web Worker]]: окремий потік, з яким обмінюються **копіями** повідомлень. У Node те саме — [[worker-thread|worker thread]] з `node:worker_threads`. А ще є [[child-process|дочірній процес]] з `node:child_process` — окрема програма зі своєю пам’яттю.

        | Де | Коли | Ціна |
        |---|---|---|
        | головний потік | коротка робота; ввід-вивід (його й так чекають паралельно) | довга робота блокує всі запити |
        | worker thread | важкі обчислення на JavaScript | дані копіюються в `postMessage`; той самий процес |
        | дочірній процес | чужа програма, ризиковий код, потрібна ізоляція | окремий Node зі своєю пам’яттю й V8: дорожчий старт, дані — серіалізовані повідомлення |

        Документація Node.js 22 каже прямо: worker threads корисні для обчислень на процесорі, але мало допомагають з вводом-виводом. І worker **не пришвидшує** саму роботу — він звільняє головний потік, щоб той відповідав іншим.
      en: |
        In the browser you saw a [[web-worker|Web Worker]]: a separate thread that exchanges **copies** of messages. In Node the same thing is a [[worker-thread]] from `node:worker_threads`. And there is also a [[child-process]] from `node:child_process` — a separate program with its own memory.

        | Where | When | Cost |
        |---|---|---|
        | the main thread | short work; I/O (it is waited for in parallel anyway) | long work blocks every request |
        | a worker thread | heavy computation in JavaScript | data is copied in `postMessage`; the same process |
        | a child process | another program, risky code, isolation needed | a separate Node with its own memory and V8: a costlier start, data as serialized messages |

        The Node.js 22 documentation says it plainly: worker threads are useful for CPU-intensive work but do not help much with I/O. And a worker **does not make** the work itself faster — it frees the main thread so that it can answer others.

  - id: predict-worker
    kind: prediction
    prompt:
      uk: "Контрольна сума 50 000 сум триває на головному потоці близько 200 мс. Її переносять у worker thread. Що станеться з тривалістю самої суми й з таймером «health», який має спрацьовувати кожні 10 мс?"
      en: "A checksum of 50,000 amounts takes about 200 ms on the main thread. It is moved to a worker thread. What happens to the duration of the checksum itself and to a “health” timer that should fire every 10 ms?"
    answer:
      type: choice
      options:
        - id: same-time-free-loop
          text:
            uk: "Сума триває так само (~200 мс), але таймер більше не запізнюється на ~200 мс — лише на кілька мілісекунд"
            en: "The checksum takes the same (~200 ms), but the timer is no longer ~200 ms late — only a few milliseconds"
        - id: faster
          text:
            uk: "Сума стає набагато швидшою, бо worker має окреме ядро процесора, і таймер теж вчасний"
            en: "The checksum becomes much faster, because the worker has a separate CPU core, and the timer is on time too"
          why:
            uk: "Окреме ядро не пришвидшує один і той самий цикл: це та сама кількість операцій. Worker виграє інше — головний потік вільний, поки цикл працює."
            en: "A separate core does not speed up one and the same loop: it is the same number of operations. A worker wins something else — the main thread is free while the loop runs."
        - id: no-change
          text:
            uk: "Нічого не зміниться: JavaScript у Node завжди виконується на одному потоці, тож таймер так само чекає"
            en: "Nothing changes: JavaScript in Node always runs on one thread, so the timer waits just the same"
          why:
            uk: "Один потік — на один event loop. Worker має власний event loop і власний потік, тож цикл у ньому не тримає головного."
            en: "One thread per event loop. A worker has its own event loop and its own thread, so a loop inside it does not hold the main one."
      correct: [same-time-free-loop]
    runnable: false
    explanation:
      uk: "Робота та сама, тож і час той самий. Але таймер головного потоку тепер вільний. Приклад цього уроку «Головний потік, worker і передача даних» (по 10 запусків) надрукував у Node.js v25.2.1: головний потік — 200–215 мс із запізненням таймера 194–209 мс; worker — 204–217 мс із запізненням 2–12 мс. У Node.js v22.23.3 так само: головний потік 202–259 мс, worker 203–212 мс із запізненням 2–5 мс."
      en: "The work is the same, so the time is the same too. But the main thread’s timer is now free. This lesson’s example “Main thread, worker and handing data over” (10 runs each) printed on Node.js v25.2.1: the main thread — 200–215 ms with the timer 194–209 ms late; the worker — 204–217 ms with the timer 2–12 ms late. On Node.js v22.23.3 the same: the main thread 202–259 ms, the worker 203–212 ms with the timer 2–5 ms late."

  - id: three-boxes
    kind: visual
    visual: diagram
    title:
      uk: "Головний потік, worker і дочірній процес"
      en: "Main thread, worker and child process"
    textEquivalent:
      uk: "Головний потік і worker thread живуть в одному процесі Node, дочірній процес — окремо, зі своєю пам’яттю. Головний потік надсилає worker масив з 50 000 записів: postMessage копіює кожен об’єкт, і це коштувало 15–27 мс (Node.js v25.2.1 і v22.23.3, також у пісочниці платформи). Якщо ж числа покласти в ArrayBuffer і передати його в списку передачі, буфер переміщується, а не копіюється, — 0,1–2,5 мс разом з відповіддю worker, але в головному потоці він стає порожнім. Дочірній процес отримує дані як серіалізовані повідомлення. Якщо він аварійно завершиться, головний процес лише отримає подію про це й житиме далі, бо пам’ять у них окрема. Наприкінці роботи кожен учасник має закрити те, що відкрив: worker — через terminate(), задача — свої файли й таймери, тож лічильник відкритих ресурсів повертається до нуля."
      en: "The main thread and a worker thread live in one Node process; a child process lives apart, with its own memory. The main thread sends the worker an array of 50,000 records: postMessage copies every object, and that cost 15–27 ms (Node.js v25.2.1 and v22.23.3, in the platform sandbox too). If the numbers are put into an ArrayBuffer passed in the transfer list, the buffer is moved, not copied — 0.1–2.5 ms including the worker’s answer, but it becomes empty on the main thread. A child process gets data as serialized messages. If it crashes, the main process only gets an event about it and lives on, because their memory is separate. At the end of the work each participant has to close what it opened: the worker through terminate(), a job its files and timers, so the count of open resources returns to zero."
    spec:
      layout: grid
      groups:
        - { id: process, label: { uk: "один процес Node", en: "one Node process" } }
      nodes:
        - { id: main, group: process, label: { uk: "головний потік", en: "main thread" }, w: 150, col: 0, row: 0 }
        - { id: worker, group: process, label: "worker thread", w: 150, col: 0, row: 1 }
        - { id: child, label: { uk: "дочірній процес", en: "child process" }, w: 150, col: 1, row: 1 }
      edges:
        - { id: copy, from: main, to: worker, label: "postMessage" }
        - { id: ipc, from: main, to: child, kind: dashed }
      steps:
        - caption:
            uk: "Головний потік і worker thread — в **одному** процесі, але кожен має власний event loop."
            en: "The main thread and the worker thread are in **one** process, but each has its own event loop."
          highlight: [main, worker]
          dim: [child, ipc]
        - caption:
            uk: "`postMessage` з 50 000 об’єктів **копіює** кожен: у прикладі близько 20 мс."
            en: "`postMessage` with 50,000 objects **copies** each one: about 20 ms in the example."
          highlight: [main, copy, worker]
          dim: [child, ipc]
          annotate:
            - { id: copy, text: { uk: "копія ≈ 20 мс", en: "copy ≈ 20 ms" } }
        - caption:
            uk: "`ArrayBuffer` у списку передачі **переміщується**: 0,1–2,5 мс, але в головному потоці він тепер порожній."
            en: "An `ArrayBuffer` in the transfer list is **moved**: 0.1–2.5 ms, but on the main thread it is now empty."
          highlight: [main, copy, worker]
          dim: [child, ipc]
          annotate:
            - { id: copy, text: { uk: "передача ≤ 3 мс", en: "transfer ≤ 3 ms" } }
        - caption:
            uk: "Дочірній процес має власну пам’ять і V8. Його аварія — лише подія для батьківського процесу, а не кінець усього."
            en: "A child process has its own memory and V8. Its crash is only an event for the parent, not the end of everything."
          highlight: [child, ipc, main]
          dim: [worker, copy]
        - caption:
            uk: "Наприкінці кожен закриває своє: `worker.terminate()`, файли, таймери — і лічильник ресурсів повертається до нуля."
            en: "At the end each one closes its own: `worker.terminate()`, files, timers — and the resource count returns to zero."
          highlight: [main, worker, child]

  - id: worker-lab
    kind: example
    runtime: isolated-node
    dir: worker-lab
    entry: index.js
    capabilities: { workers: true }
    strings:
      main: { uk: "головний потік", en: "main thread" }
      late: { uk: "запізнився на", en: "late by" }
      ms: { uk: "мс", en: "ms" }
      copied: { uk: "50 000 об’єктів скопійовано за", en: "50,000 objects copied in" }
      moved: { uk: "ArrayBuffer передано за", en: "ArrayBuffer transferred in" }
      afterMove: { uk: "довжина в головному потоці після передачі:", en: "length on the main thread after the transfer:" }
    title:
      uk: "Головний потік, worker і передача даних"
      en: "Main thread, worker and handing data over"
    body:
      uk: |
        Натисни **Запустити**. Тут потрібні worker threads, тож платформа дозволяє їх саме цьому прикладу. Програма тричі (після розігріву) рахує ту саму контрольну суму на головному потоці й у `checksum-worker.js`, а таймер кожні 10 мс записує, на скільки запізнився. Потім вона тричі передає worker 50 000 записів: масивом об’єктів (копія) і `Uint32Array` з передачею його `ArrayBuffer`.

        Дочірніх процесів пісочниця не запускає (це її обмеження), тому третій стовпчик таблиці — з документації, а не з прикладу.
      en: |
        Press **Run**. Worker threads are needed here, so the platform allows them for this example. The program (after a warm-up) computes the same checksum three times on the main thread and in `checksum-worker.js`, while a timer every 10 ms records how late it is. Then it hands the worker 50,000 records three times: as an array of objects (a copy) and as a `Uint32Array` whose `ArrayBuffer` is transferred.

        The sandbox does not start child processes (that is one of its limits), so the third column of the table comes from the documentation, not from the example.
    tryIt:
      uk: "Зміни `ROUNDS` на `400`: сума триває 20–22 мс, і на головному потоці таймер запізнюється вже лише на 13–18 мс (по 10 запусків у Node.js v25.2.1 і v22.23.3; один раунд з 60 трапився повільним, ~150 мс) — для такої короткої роботи worker не вартий копіювання й зайвого коду. Поверни `4000`."
      en: "Change `ROUNDS` to `400`: the checksum takes 20–22 ms, and on the main thread the timer is only 13–18 ms late (10 runs each on Node.js v25.2.1 and v22.23.3; one round of 60 happened to be slow, ~150 ms) — for such short work a worker is not worth the copying and the extra code. Set it back to `4000`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: worker у браузері"
      en: "Recall: a worker in the browser"
    items:
      - id: worker-copy
        from: js-13-09-proxy-workers-awareness
        prompt:
          uk: "Сторінка передає Web Worker масив id через `postMessage(ids)`, а потім змінює `ids[0]`. Чи побачить worker цю зміну?"
          en: "A page passes a Web Worker an array of ids with `postMessage(ids)`, and then changes `ids[0]`. Does the worker see that change?"
        answer:
          type: choice
          options:
            - id: no-copy
              text:
                uk: "Ні: worker отримав копію, а не той самий масив"
                en: "No: the worker got a copy, not the same array"
            - id: yes-shared
              text:
                uk: "Так: масиви передаються за посиланням"
                en: "Yes: arrays are passed by reference"
              why:
                uk: "Між потоками не передають посилань на звичайні об’єкти: `postMessage` копіює дані. Спільна пам’ять — виняток, лише через `SharedArrayBuffer`."
                en: "References to plain objects are not passed between threads: `postMessage` copies the data. Shared memory is the exception, only through `SharedArrayBuffer`."
            - id: error
              text:
                uk: "Зміна кине помилку: масив уже належить worker"
                en: "The change throws an error: the array now belongs to the worker"
              why:
                uk: "Звичайний масив копіюється, тож сторінка лишається власником свого. «Переходить» до іншого потоку лише `ArrayBuffer` зі списку передачі — і тоді він порожніє, а не кидає помилку."
                en: "A plain array is copied, so the page keeps its own. Only an `ArrayBuffer` in the transfer list “moves” to another thread — and then it becomes empty rather than throwing."
          correct: [no-copy]
        explanation:
          uk: "Повідомлення копіюються. У Node це так само: великі дані дорого копіювати, тож їх передають `ArrayBuffer` зі списку передачі або не передають зовсім — worker читає їх сам."
          en: "Messages are copied. In Node it is the same: large data is expensive to copy, so it is handed over as an `ArrayBuffer` in the transfer list, or not handed over at all — the worker reads it itself."

  - id: budget
    kind: explanation
    title:
      uk: "Бюджет задачі: що вона тримає і хто це звільнить"
      en: "A job’s budget: what it holds and who frees it"
    body:
      uk: |
        Будь-де — у головному потоці чи у worker — задача тримає ресурси: записи в пам’яті, відкриті файли, таймери, з’єднання. [[resource-budget|Бюджет ресурсів]] задачі — це межі, які ти ставиш наперед:

        - **скільки записів** вона може обробити (`maxRecords`): більше — `RangeError`, а не нескінченна робота;
        - **що вона відкриває**: один FileHandle, один інтервал прогресу — і кожен з них закривається у `finally`.

        Node не закриває ресурсів задачі, коли вона завершилася: функція повернулася, а `setInterval` і далі тримає процес, і FileHandle лишається відкритим. Під час підготовки уроку `handle.readLines()` закривав файл сам лише тоді, коли дочитав до кінця; після `throw` посеред циклу у файлі на 2000 рядків FileHandle лишився відкритим (Node.js v25.2.1 і v22.23.3). Маленький файл, прочитаний одним шматком, закривався й після `throw` — тож на щасливий випадок не покладайся.

        Перевірити можна так: `process.getActiveResourcesInfo()` показує таймери, що тримають процес (`'Timeout'`), а FileHandle після `close()` має `fd === -1`.
      en: |
        Anywhere — on the main thread or in a worker — a job holds resources: records in memory, open files, timers, connections. A job’s [[resource-budget]] is the limits you set in advance:

        - **how many records** it may process (`maxRecords`): more means a `RangeError`, not endless work;
        - **what it opens**: one FileHandle, one progress interval — and each of them is closed in `finally`.

        Node does not close a job’s resources when it ends: the function has returned, but a `setInterval` still holds the process and the FileHandle stays open. While this lesson was prepared, `handle.readLines()` closed the file by itself only when it read to the end; after a `throw` in the middle of the loop over a 2000-line file the FileHandle stayed open (Node.js v25.2.1 and v22.23.3). A small file read in one chunk was closed even after a `throw` — so do not rely on a lucky case.

        You can check it like this: `process.getActiveResourcesInfo()` shows timers that hold the process (`'Timeout'`), and a FileHandle has `fd === -1` after `close()`.

  - id: run-job
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: run-job
    entry: index.js
    editable: [app.js]
    strings:
      expense: { uk: "Витрата", en: "Expense" }
      records: { uk: "записів", en: "records" }
      total: { uk: "сума", en: "total" }
      timersLeft: { uk: "таймерів, що тримають процес", en: "timers holding the process" }
      handlesLeft: { uk: "відкритих FileHandle", en: "open FileHandles" }
      complete: { uk: "повна задача", en: "complete job" }
      overBudget: { uk: "понад бюджет 500", en: "over the 500 budget" }
      aborted: { uk: "скасована через 30 мс", en: "aborted after 30 ms" }
    title:
      uk: "runJob: бюджет і прибирання на кожному шляху"
      en: "runJob: a budget and cleanup on every path"
    instructions:
      uk: |
        `runJob(job, { signal, maxRecords })` в `app.js` імпортує JSON lines з `job.inputPath` порціями по 100 через `job.saveBatch(batch)` і кожні 20 мс викликає `job.onProgress(count)`. Зараз вона не має межі, не зважає на `signal` і нічого не закриває. Перероби її:

        - виконується з `{ count, total }` — кількістю записів і сумою `amountMinor`;
        - файл, у якому записів більше за `maxRecords`, відхиляє з `RangeError` і далі не читає;
        - скасований `signal` відхиляє з `AbortError` (перевіряй його між порціями), і нових порцій більше не зберігає;
        - після успіху, `RangeError` і скасування FileHandle закрито, а інтервал прогресу прибрано.

        `index.js` лише для читання: **Запустити** проганяє три задачі й після кожної друкує, скільки таймерів тримає процес і скільки FileHandle лишилося відкритими. Зі стартовим кодом програма не завершується сама й платформа зупиняє її через 10 с — це і є витік. Перевірки стежать за `open` з `node:fs/promises` і за таймерами через `activeResources()`.

        `index.js` і перевірки тримають посилання на кожен FileHandle, тож тут незакритий файл видно як лічильник. У твоїй власній програмі рядок «A FileHandle object was closed during garbage collection» (Node.js v25.2.1, це помилка, що зупиняє процес) чи «Closing file descriptor … on garbage collection» з `DEP0137` (Node.js v22.23.3, попередження) означає те саме: файл лишився відкритим, і його закрив збирач сміття.
      en: |
        `runJob(job, { signal, maxRecords })` in `app.js` imports the JSON lines of `job.inputPath` in batches of 100 through `job.saveBatch(batch)` and calls `job.onProgress(count)` every 20 ms. Right now it has no limit, ignores `signal` and closes nothing. Rework it:

        - it fulfills with `{ count, total }` — the number of records and the sum of `amountMinor`;
        - a file with more records than `maxRecords` is rejected with a `RangeError` and not read any further;
        - an aborted `signal` rejects with `AbortError` (check it between batches), and no more batches are saved;
        - after success, a `RangeError` and an abort the FileHandle is closed and the progress interval is cleared.

        `index.js` is read-only: **Run** goes through three jobs and after each prints how many timers hold the process and how many FileHandles are still open. With the starter code the program does not end by itself and the platform stops it after 10 s — that is the leak. The checks watch `open` from `node:fs/promises` and the timers through `activeResources()`.

        `index.js` and the checks keep a reference to every FileHandle, so here an unclosed file shows up as a count. In your own program a line “A FileHandle object was closed during garbage collection” (Node.js v25.2.1, an error that stops the process) or “Closing file descriptor … on garbage collection” with `DEP0137` (Node.js v22.23.3, a warning) means the same thing: a file was left open, and the garbage collector closed it.
