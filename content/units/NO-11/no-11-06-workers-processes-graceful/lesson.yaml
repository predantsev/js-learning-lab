          uk: "Ця перевірка запускає задачу тричі — успіх, `RangeError`, скасування — і після кожного запуску очікує, що всі FileHandle з `open` мають `fd === -1`. Після `throw` посеред `readLines()` файл сам не закривається: `await handle.close()` має стояти у `finally`."
          en: "This check runs the job three times — success, a `RangeError`, an abort — and after each run expects every FileHandle from `open` to have `fd === -1`. After a `throw` in the middle of `readLines()` the file does not close by itself: `await handle.close()` has to be in `finally`."
