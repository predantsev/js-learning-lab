      "no interval or timer is left — after success, RangeError and abort":
        uk: "Не лишається жодного інтервалу чи таймера — після успіху, `RangeError` і скасування"
        en: "No interval or timer is left — after success, `RangeError` and abort"
    hints:
      nudge:
        uk: "Скільки різних шляхів виходу з функції є після `open`? І в якому одному місці коду можна прибрати за собою так, щоб жоден з них його не оминув?"
        en: "How many different ways out of the function are there after `open`? And in which single place in the code can you clean up so that none of them skips it?"
      explanation:
        uk: "Згадай `withDeadline` з NO-03: таймер дедлайну зберігався в змінній, а `clearTimeout` стояв у `.finally(…)` — тож таймер зникав і після успіху, і після помилки. Тут те саме, тільки ресурсів два: інтервал і FileHandle. `finally` виконується після `return`, після `throw` і після помилки, кинутої з `await`. Межа — лічильник, порівняний з лімітом на кожному записі; скасування — перевірка `signal` у безпечній точці, після збереженої порції; `throwIfAborted()` кидає `signal.reason`."
        en: "Remember `withDeadline` from NO-03: the deadline timer was kept in a variable, and `clearTimeout` sat in `.finally(…)` — so the timer went away after success and after an error alike. Here it is the same, only with two resources: the interval and the FileHandle. `finally` runs after `return`, after `throw` and after an error thrown from `await`. The limit is a counter compared with the cap on every record; the abort is a check of `signal` at a safe point, after a saved batch; `throwIfAborted()` throws `signal.reason`."
    solutionNote:
      uk: "Один `finally` прибирає інтервал і закриває FileHandle на кожному шляху: успіх, `RangeError`, скасування, зламаний рядок. Лічильник записів порівнюється з `maxRecords` ще до розбору рядка, тож задача понад бюджет зупиняється одразу. `throwIfAborted` між порціями зупиняє задачу в безпечній точці: остання порція або вже збережена, або ще не почата. Рівноцінно — два вкладені `finally`, по одному на ресурс, і перевірка `signal.aborted` на кожному рядку."
      en: "One `finally` clears the interval and closes the FileHandle on every path: success, a `RangeError`, an abort, a broken line. The record counter is compared with `maxRecords` before the line is parsed, so a job over budget stops at once. `throwIfAborted` between batches stops the job at a safe point: the last batch is either saved already or not started. Equivalent: two nested `finally` blocks, one per resource, and a check of `signal.aborted` on every line."
