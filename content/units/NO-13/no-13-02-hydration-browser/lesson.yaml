id: no-13-02-hydration-browser
unit: NO-13
title:
  uk: "Гідратація в браузері"
  en: "Hydration in the browser"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Гідратувати серверну розмітку через `hydrateRoot` тим самим компонентом і тими самими початковими даними, що й на сервері."
    en: "Hydrate server-rendered markup with hydrateRoot using exactly the same component and initial data as the server."
  - uk: "Показати, що до гідратації кнопки нічого не роблять, а після неї React чіпляє обробники до наявних вузлів DOM, а не створює їх заново."
    en: "Show that before hydration the buttons do nothing, and after it React attaches handlers to the existing DOM nodes instead of recreating them."
prerequisites: [no-13-01-render-to-string, re-11-02-hydration-mismatch]
subskills:
  - { family: B-11, skill: "hydration", depth: intro }
glossary: [hydrate-root, client-entry]
selfCheck: [predict-same-html, client-entry]

blocks:
  - id: same-tree-twice
    kind: explanation
    title:
      uk: "Той самий компонент, ті самі дані — двічі"
      en: "The same component, the same data — twice"
    body:
      uk: |
        Сторінка з попереднього уроку показує список, але кнопки в ній «мертві». Оживляє їх [[client-entry|клієнтська точка входу]] — файл, який підключає тег `<script type="module">`:

        ```js
        const data = JSON.parse(document.getElementById("initial-data").textContent);
        hydrateRoot(document.getElementById("root"), h(WishList, data));
        ```

        Сервер поклав у сторінку не лише розмітку, а й **початкові дані** — текстом JSON у `<script id="initial-data" type="application/json">`. Браузер такий скрипт не виконує, тож клієнт може прочитати його як текст.

        [[hydrate-root|`hydrateRoot`]] рендерить `WishList` ще раз, уже в браузері, і **порівнює** свій результат із вузлами, що вже є в `#root`. Коли все збігається, він не створює жодного вузла: лише чіпляє обробники й стан до наявних. Тому клієнт мусить рендерити **той самий** компонент із **тими самими** даними, що й сервер, — не з даними, які він дістав сам.

        (Чи безпечно класти дані в сторінку через `JSON.stringify`, з’ясуємо в наступному уроці.)
      en: |
        The page from the previous lesson shows the list, but its buttons are “dead”. The [[client-entry]] brings them to life — the file that the `<script type="module">` tag loads:

        ```js
        const data = JSON.parse(document.getElementById("initial-data").textContent);
        hydrateRoot(document.getElementById("root"), h(WishList, data));
        ```

        The server put into the page not only the markup but also the **initial data** — as JSON text in `<script id="initial-data" type="application/json">`. A browser does not run such a script, so the client can read it as text.

        [[hydrate-root|`hydrateRoot`]] renders `WishList` once more, now in the browser, and **compares** its result with the nodes already in `#root`. When everything matches, it creates no nodes at all: it only attaches handlers and state to the existing ones. So the client must render **the same** component with **the same** data as the server — not with data it fetched on its own.

        (Whether putting data into the page with `JSON.stringify` is safe is the next lesson.)

  - id: hydration-sequence
    kind: visual
    visual: sequence
    title:
      uk: "Від HTML до живої кнопки"
      en: "From HTML to a live button"
    textEquivalent:
      uk: "Сервер відповідає HTML-документом: у #root уже є список, а в #initial-data — ті самі дані текстом JSON. Браузер одразу малює список. Людина натискає кнопку, але нічого не відбувається: обробника ще немає. Потім браузер запитує /client.js і отримує клієнтську точку входу. Вона читає початкові дані й викликає hydrateRoot з тим самим компонентом і тими самими пропсами. React рендерить дерево в браузері, проходить наявні вузли #root і, оскільки розмітка збігається, чіпляє обробник до тієї самої кнопки, яку намалював сервер. Наступне натискання змінює стан, і текст кнопки оновлюється."
      en: "The server answers with an HTML document: #root already holds the list, and #initial-data holds the same data as JSON text. The browser paints the list at once. The person presses a button, but nothing happens: there is no handler yet. Then the browser requests /client.js and gets the client entry. It reads the initial data and calls hydrateRoot with the same component and the same props. React renders the tree in the browser, walks the existing nodes of #root and, since the markup matches, attaches the handler to the very button the server painted. The next press changes the state, and the button text updates."
    spec:
      actors:
        - { id: server, label: "node:http" }
        - { id: browser, label: { uk: "Браузер", en: "Browser" } }
        - { id: client, label: "client.js" }
      intro:
        uk: "Сервер, браузер і клієнтська точка входу. Кожен рядок — одна подія в часі."
        en: "The server, the browser and the client entry. Each row is one event in time."
      messages:
        - from: server
          to: browser
          kind: return
          label: "200 text/html"
          note: { uk: "#root + #initial-data", en: "#root + #initial-data" }
          caption:
            uk: "Документ приходить із готовою розмітою й тими самими даними текстом JSON. Список намальовано."
            en: "The document arrives with the ready markup and the same data as JSON text. The list is painted."
        - from: browser
          to: browser
          kind: note
          label: { uk: "клік: нічого", en: "click: nothing" }
          caption:
            uk: "Кнопка вже є, але слухача на ній немає: натискання зникає безслідно."
            en: "The button is there, but nothing listens to it: the press is lost without a trace."
        - from: browser
          to: server
          kind: async
          label: "GET /client.js"
          caption:
            uk: "Браузер завантажує клієнтський код. Повільна мережа — довша «мертва» пауза."
            en: "The browser loads the client code. A slow network means a longer “dead” pause."
        - from: client
          to: browser
          label: "hydrateRoot(#root, h(WishList, data))"
          caption:
            uk: "Клієнт читає `#initial-data` і гідратує `#root` тим самим компонентом із тими самими даними."
            en: "The client reads `#initial-data` and hydrates `#root` with the same component and the same data."
        - from: browser
          to: browser
          kind: note
          label: { uk: "ті самі вузли + обробники", en: "same nodes + handlers" }
          caption:
            uk: "Розмітка збіглася: React не створює нових вузлів, а чіпляє `onClick` до кнопки, яку намалював сервер."
            en: "The markup matched: React creates no new nodes and attaches `onClick` to the button the server painted."
        - from: browser
          to: browser
          kind: note
          label: { uk: "клік: стан змінено", en: "click: state changed" }
          caption:
            uk: "Тепер натискання викликає обробник, стан змінюється, і React оновлює текст тієї самої кнопки."
            en: "Now a press calls the handler, the state changes and React updates the text of the same button."

  - id: predict-same-html
    kind: prediction
    strings:
      books: { uk: "Повернути книжки", en: "Return books" }
    prompt:
      uk: "Сервер рендерить список справ із `today`, яке він сам передає разом із даними. Три рендери нижче дають три рядки HTML. Які з них **однакові**? Вважай, що код виконується будь-якого дня після 2026-03-10."
      en: "The server renders a task list with a `today` that it passes along with the data. The three renders below give three HTML strings. Which of them are **identical**? Assume the code runs on any day after 2026-03-10."
    code: |
      const payload = { tasks: [{ id: "t-02", title: "%%books%%", dueDate: "2026-03-01" }], today: "2026-03-01" };

      // A: the server
      const a = renderToString(h(DueList, payload));
      // B: a client that reads everything from the payload
      const b = renderToString(h(DueList, { tasks: payload.tasks, today: payload.today }));
      // C: a client that takes "today" from its own clock
      const c = renderToString(h(DueList, { tasks: payload.tasks, today: new Date().toISOString().slice(0, 10) }));
    runnable: false
    answer:
      type: choice
      options:
        - id: a-b
          text:
            uk: "Лише A і B: у C інша мітка терміну"
            en: "Only A and B: C has a different due label"
        - id: all
          text:
            uk: "Усі три: компонент і справи однакові, а React у браузері все одно узгодить різницю"
            en: "All three: the component and the tasks are the same, and React in the browser will reconcile any difference anyway"
          why:
            uk: "`today` — теж пропс. У C він інший, тож і розмітка інша. Гідратація нічого не «узгоджує»: вона розраховує, що розмітка вже збігається."
            en: "`today` is a prop too. In C it is different, so the markup is different. Hydration does not “reconcile” anything: it relies on the markup already matching."
        - id: none
          text:
            uk: "Жодні: кожен виклик `renderToString` дає новий рядок"
            en: "None: every call of `renderToString` gives a new string"
          why:
            uk: "Рендер — це функція від пропсів. Ті самі пропси дають той самий текст HTML, хоч скільки разів викликати."
            en: "A render is a function of its props. The same props give the same HTML text however many times you call it."
        - id: b-c
          text:
            uk: "Лише B і C: обидва рендерять «як клієнт»"
            en: "Only B and C: both render “as a client”"
          why:
            uk: "Важливо не те, хто рендерить, а які пропси він отримав. B отримав ті самі пропси, що й A."
            en: "What matters is not who renders but which props they got. B got the same props as A."
      correct: [a-b]
    explanation:
      uk: "A і B отримали ті самі пропси — і дали той самий рядок. C порахував `today` зі свого годинника: справа на 2026-03-01 у нього вже прострочена, а не «на сьогодні», і розмітка розходиться. Перевір це в прикладі цього уроку."
      en: "A and B got the same props — and gave the same string. C computed `today` from its own clock: for it the task due on 2026-03-01 is already overdue, not “due today”, and the markup diverges. Check it in this lesson’s example."

  - id: compare-renders
    kind: example
    runtime: isolated-node
    dir: compare-renders
    entry: index.js
    strings:
      books: { uk: "Повернути книжки", en: "Return books" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      noDate: { uk: "без терміну", en: "no due date" }
      overdue: { uk: "прострочено", en: "overdue" }
      dueToday: { uk: "на сьогодні", en: "due today" }
      upcoming: { uk: "згодом", en: "upcoming" }
      server: { uk: "сервер", en: "server" }
      client: { uk: "клієнт", en: "client" }
      same: { uk: "Розмітка однакова — гідратація пройде без розбіжностей.", en: "The markup is identical — hydration will find no mismatch." }
      differAt: { uk: "Розмітка розходиться із символу", en: "The markup differs from character" }
    title:
      uk: "Серверний і клієнтський рендер поруч"
      en: "The server render and the client render side by side"
    body:
      uk: |
        `index.js` рендерить `DueList` двічі: як сервер — із `today`, яке сервер передає разом із даними, і як клієнт, що бере `today` зі свого годинника. Потім знаходить перший символ, де рядки розходяться.

        Натисни **Запустити** й порівняй мітки термінів у двох рядках.
      en: |
        `index.js` renders `DueList` twice: as the server — with the `today` that the server passes along with the data — and as a client that takes `today` from its own clock. Then it finds the first character where the strings differ.

        Press **Run** and compare the due labels in the two lines.
    tryIt:
      uk: |
        1. У рядку `const clientHtml = …` заміни `today: clientToday` на `today: payload.today`. Запусти: розмітка однакова.
        2. Тепер поверни `clientToday` і зміни `today` у `payload` на `'2026-03-10'`. Запусти: розбіжність лишається, бо годинник клієнта показує інший день. Не має значення, яке саме значення в сервера, — важливо, щоб клієнт узяв **те саме**.
        3. Поверни `payload.today` у рядок `clientHtml`: розмітка знову однакова, хоч би яке `today` вибрав сервер.
      en: |
        1. In the line `const clientHtml = …` replace `today: clientToday` with `today: payload.today`. Run: the markup is identical.
        2. Now bring `clientToday` back and change `today` in `payload` to `'2026-03-10'`. Run: the mismatch stays, because the client’s clock shows a different day. It does not matter which value the server has — what matters is that the client takes **the same** one.
        3. Put `payload.today` back into the `clientHtml` line: the markup is identical again, whatever `today` the server chose.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: різний текст і різний атрибут"
      en: "Recall: different text and a different attribute"
    items:
      - id: text-vs-attribute
        from: re-11-02-hydration-mismatch
        prompt:
          uk: "Під час гідратації React 19 знаходить розбіжність. Що він робить, коли розходиться **текст** вузла, а що — коли розходиться лише **атрибут** (наприклад, `class`)?"
          en: "During hydration React 19 finds a mismatch. What does it do when a node’s **text** differs, and what when only an **attribute** (for example `class`) differs?"
        answer:
          type: choice
          options:
            - id: text-rebuild-attr-stays
              text:
                uk: "Текст: повідомляє про помилку й будує дерево заново на клієнті. Атрибут: лише пише в консоль, а серверне значення лишається на сторінці"
                en: "Text: reports an error and rebuilds the tree on the client. Attribute: only writes to the console, and the server value stays on the page"
            - id: both-fixed
              text:
                uk: "В обох випадках тихо виправляє вузол під клієнтський рендер"
                en: "In both cases it quietly fixes the node to match the client render"
              why:
                uk: "Атрибут React **не** виправляє: у RE-11 серверний `class=\"server\"` лишився на сторінці. А різний текст дає помилку, а не тихе виправлення."
                en: "React does **not** fix an attribute: in RE-11 the server’s `class=\"server\"` stayed on the page. And different text gives an error, not a quiet fix."
            - id: both-ignored
              text:
                uk: "В обох випадках нічого: перемагає серверний HTML"
                en: "Nothing in either case: the server HTML wins"
              why:
                uk: "Для тексту це не так: React 19 відкидає серверний HTML найближчої межі й будує його заново на клієнті."
                en: "Not for text: React 19 throws away the server HTML of the nearest boundary and builds it again on the client."
          correct: [text-rebuild-attr-stays]
        explanation:
          uk: "Різний текст — помилка й повторний рендер на клієнті; різний атрибут — лише повідомлення в консолі, і на сторінці лишається серверне значення. Тому навіть «тихе» повідомлення про гідратацію треба виправляти в джерелі."
          en: "Different text means an error and a re-render on the client; a different attribute means only a console message, and the server value stays on the page. That is why even a “quiet” hydration message must be fixed at its source."

  - id: client-entry
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: client-entry
    entry: index.js
    editable: [client.js]
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      wanted: { uk: "Хочу", en: "Wanted" }
      gotIt: { uk: "Отримано", en: "Got it" }
    title:
      uk: "Клієнтська точка входу для списку бажань"
      en: "A client entry for the wishlist"
    instructions:
      uk: |
        У Node.js немає `document`, тому клієнтську точку входу тут написано як дві функції, які отримують сторінку параметром. У браузері її запускали б так: `startClient(document, hydrateRoot)`.

        Допиши в `client.js`:

        - `startClient(doc, hydrateRoot)` читає початкові дані з тексту елемента `initial-data` (`JSON.parse`) і викликає `hydrateRoot` **один раз**: контейнер — елемент `root`, елемент — `WishList` саме із цими даними як пропсами;
        - `matchesServer(doc)` повертає `true`, коли `renderToString` того самого елемента дає рівно розмітку всередині `root` (`innerHTML`), і `false` в іншому разі. Це перевірка, яку варто мати в тестах: вона ловить розбіжність ще до браузера.

        Файл `wishes.js` — те, що лежить у репозиторії **зараз**; сторінка могла бути відрендерена раніше. `fake-page.js` — заміна `document` з одним методом `getElementById`. Драйвер `index.js` передає твоєму коду таку сторінку і `hydrateRoot`, який лише друкує, що отримав. **Перевірити** робить те саме з іншими даними, зокрема зі сторінкою, розмітку якої відрендерено з інших даних, ніж її JSON.
      en: |
        Node.js has no `document`, so the client entry here is written as two functions that receive the page as a parameter. In a browser it would be started as `startClient(document, hydrateRoot)`.

        Finish `client.js`:

        - `startClient(doc, hydrateRoot)` reads the initial data from the text of the `initial-data` element (`JSON.parse`) and calls `hydrateRoot` **once**: the container is the `root` element, the element is `WishList` with exactly that data as its props;
        - `matchesServer(doc)` returns `true` when `renderToString` of that same element gives exactly the markup inside `root` (`innerHTML`), and `false` otherwise. It is a check worth having in tests: it catches a mismatch before any browser does.

        `wishes.js` is what the repository holds **now**; the page may have been rendered earlier. `fake-page.js` stands in for `document` with a single method, `getElementById`. The driver `index.js` gives your code such a page and a `hydrateRoot` that only prints what it got. **Check** does the same with other data, including a page whose markup was rendered from different data than its JSON.
    testTitles:
      "hydrates the #root element":
        uk: "Гідратує елемент `#root`"
        en: "Hydrates the `#root` element"
      "hydrates WishList with exactly the initial data":
        uk: "Гідратує `WishList` рівно з початковими даними сторінки"
        en: "Hydrates `WishList` with exactly the page’s initial data"
      "matchesServer is true when the page was rendered from its data":
        uk: "`matchesServer` — `true` для узгодженої сторінки"
        en: "`matchesServer` is `true` for a consistent page"
      "matchesServer is false when the markup came from other data":
        uk: "`matchesServer` — `false`, коли розмітку відрендерено з інших даних"
        en: "`matchesServer` is `false` when the markup came from other data"
    hints:
      nudge:
        uk: "Де на сторінці лежать дані, з якими рендерив сервер? Почни з того, щоб прочитати їх, а не імпортувати."
        en: "Where on the page is the data the server rendered with? Start by reading it, not importing it."
      explanation:
        uk: "`doc.getElementById(id)` повертає об’єкт із `textContent` та `innerHTML`, як у браузері. Текст JSON перетворює на об’єкт `JSON.parse`. Елемент для гідратації будується так само, як на сервері: `h(Компонент, пропси)`; пропсами тут є весь об’єкт початкових даних. Для порівняння `renderToString` дає рядок, який можна порівняти з `innerHTML` через `===`."
        en: "`doc.getElementById(id)` returns an object with `textContent` and `innerHTML`, as in the browser. `JSON.parse` turns JSON text into an object. The element to hydrate is built the same way as on the server: `h(Component, props)`; the props here are the whole initial-data object. For the comparison, `renderToString` gives a string you can compare with `innerHTML` using `===`."
    solutionNote:
      uk: "Обидві функції будують той самий елемент `h(WishList, data)` з даних сторінки. `startClient` передає його в `hydrateRoot` разом із `#root`, а `matchesServer` рендерить його в рядок і порівнює з тим, що прислав сервер. Дані з `wishes.js` можуть бути свіжішими, але саме тому вони тут не годяться: розмітку в `#root` зроблено з даних сторінки."
      en: "Both functions build the same element `h(WishList, data)` from the page’s data. `startClient` passes it to `hydrateRoot` together with `#root`, and `matchesServer` renders it to a string and compares it with what the server sent. The data in `wishes.js` may be fresher, but that is exactly why it does not fit here: the markup in `#root` was made from the page’s data."
    feedback:
      - when: { test: "hydrates the #root element" }
        message:
          uk: "Ця перевірка чекає рівно один виклик `hydrateRoot`, першим аргументом якого є елемент `root` сторінки (`doc.getElementById(\"root\")`), а не `doc.body` чи інший елемент."
          en: "This check expects exactly one call of `hydrateRoot` whose first argument is the page’s `root` element (`doc.getElementById(\"root\")`), not `doc.body` or another element."
      - when: { test: "hydrates WishList with exactly the initial data" }
        message:
          uk: "Ця перевірка чекає, що другим аргументом `hydrateRoot` буде `WishList` із пропсами, які дорівнюють розібраному JSON з `initial-data`. Якщо пропси взято з `wishes.js`, вони не збігаються з тим, із чого сервер рендерив сторінку."
          en: "This check expects the second argument of `hydrateRoot` to be `WishList` with props equal to the parsed JSON from `initial-data`. If the props come from `wishes.js`, they do not match what the server rendered the page from."
      - when: { test: "matchesServer is true when the page was rendered from its data" }
        message:
          uk: "Для сторінки, розмітку якої відрендерено саме з її JSON, `matchesServer` має повернути `true`. Порівнюй `renderToString(h(WishList, data))` з `innerHTML` елемента `root`."
          en: "For a page whose markup was rendered from exactly its JSON, `matchesServer` must return `true`. Compare `renderToString(h(WishList, data))` with the `innerHTML` of the `root` element."
      - when: { test: "matchesServer is false when the markup came from other data" }
        message:
          uk: "Тут JSON сторінки й розмітка в `#root` відрізняються (сервер рендерив з іншими значеннями `acquired`). `matchesServer` має порівнювати **розмітку**, а не JSON із самим собою, і повернути `false`."
          en: "Here the page’s JSON and the markup in `#root` differ (the server rendered with other `acquired` values). `matchesServer` must compare **the markup**, not the JSON with itself, and return `false`."

  - id: hydrate-in-browser
    kind: example
    runtime: browser-react
    dir: hydrate-in-browser
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      pageTitle: { uk: "Список бажань", en: "Wishlist" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      wanted: { uk: "Хочу", en: "Wanted" }
      gotIt: { uk: "Отримано", en: "Got it" }
      beforeHydration: { uk: "клік до гідратації, текст кнопки", en: "click before hydration, button text" }
      afterHydration: { uk: "клік після гідратації, текст кнопки", en: "click after hydration, button text" }
      sameNode: { uk: "та сама кнопка, що прийшла із сервера", en: "the same button that came from the server" }
    title:
      uk: "Справжня гідратація React 19"
      en: "Real React 19 hydration"
    body:
      uk: |
        Тут працює справжній `react-dom/client`. Розмітку в `index.html` згенерував справжній `react-dom/server` 19.3.0 на Node.js v25.2.1 із `WishList.jsx` і даних у `#initial-data` — сервера в пісочниці немає, тож його відповідь вставлено в сторінку.

        `main.jsx` запам’ятовує першу кнопку, натискає її **до** гідратації, викликає `hydrateRoot` і натискає ту саму кнопку ще раз. Натисни **Запустити** й прочитай консоль.
      en: |
        Real `react-dom/client` runs here. The markup in `index.html` was generated by real `react-dom/server` 19.3.0 on Node.js v25.2.1 from `WishList.jsx` and the data in `#initial-data` — there is no server in the sandbox, so its answer is pasted into the page.

        `main.jsx` remembers the first button, clicks it **before** hydration, calls `hydrateRoot` and clicks the same button again. Press **Run** and read the console.
    tryIt:
      uk: |
        1. Консоль каже: до гідратації текст кнопки не змінився, після — змінився, і це **та сама** кнопка (`true`): React не замінив її новою.
        2. У `main.jsx` заміни в `hydrateRoot(…)` `<WishList {...data} />` на `<WishList items={[]} />`. Запусти: з’явиться помилка гідратації, а останній рядок консолі скаже `false` — серверну розмітку викинуто й побудовано заново. Поверни `{...data}`.
      en: |
        1. The console says: before hydration the button text did not change, after it — it did, and it is **the same** button (`true`): React did not replace it with a new one.
        2. In `main.jsx` replace `<WishList {...data} />` in `hydrateRoot(…)` with `<WishList items={[]} />`. Run: a hydration error appears, and the last console line says `false` — the server markup was thrown away and built again. Put `{...data}` back.

  - id: local-lab
    kind: local-task
    runtime: local-node
    title:
      uk: "Власна SSR-лабораторія: справжні react-dom/server і hydrateRoot"
      en: "Your own SSR lab: real react-dom/server and hydrateRoot"
    intro:
      uk: |
        Тепер усе по-справжньому: сервер `node:http` рендерить список через `react-dom/server`, а браузер гідратує його через `react-dom/client`. Клієнтський код збирає в один файл **esbuild** (ти знаєш його з проєкту). Сервер навмисно затримує `/client.js` на 3 секунди, щоб ти встиг натиснути кнопку до гідратації.

        Під час підготовки уроку все виконано на macOS з Node.js v25.2.1 і npm 11.6.2; npm установив react 19.3.0, react-dom 19.3.0 і esbuild 0.28.2, а сторінку відкрито в Chrome. Вивід нижче справжній. На Node.js 22, Windows і Linux цей урок не перевіряли; якщо npm дасть новіші версії 19.x, вивід може трохи відрізнятися.

        **Крок 3 — файл `WishList.js`** (спільний для сервера й браузера; без JSX, щоб Node.js імпортував його напряму):

        ```js
        // The shared list component: the server renders it to HTML, the browser hydrates it.
        import { createElement as h, useState } from 'react';

        export function WishList({ items }) {
          const [acquired, setAcquired] = useState(() => items.filter((item) => item.acquired).map((item) => item.id));
          function toggle(id) {
            setAcquired(acquired.includes(id) ? acquired.filter((x) => x !== id) : [...acquired, id]);
          }
          return h('ul', null,
            items.map((item) =>
              h('li', { key: item.id },
                item.name, ' ',
                h('button', { type: 'button', 'aria-pressed': acquired.includes(item.id), onClick: () => toggle(item.id) },
                  acquired.includes(item.id) ? 'Отримано' : 'Хочу'))));
        }
        ```

        **Крок 4 — файл `client.js`:**

        ```js
        // The client entry: reads the initial data from the page and hydrates the server HTML.
        import { createElement as h } from 'react';
        import { hydrateRoot } from 'react-dom/client';
        import { WishList } from './WishList.js';

        const data = JSON.parse(document.getElementById('initial-data').textContent);
        hydrateRoot(document.getElementById('root'), h(WishList, data));
        console.log('hydrated');
        ```

        **Крок 5 — файл `server.js`:**

        ```js
        // A node:http server: GET / renders the list, GET /client.js serves the client bundle.
        import http from 'node:http';
        import { readFile } from 'node:fs/promises';
        import { createElement as h } from 'react';
        import { renderToString } from 'react-dom/server';
        import { WishList } from './WishList.js';

        const items = [
          { id: 'w-01', name: 'Навушники', acquired: false },
          { id: 'w-02', name: 'Настільна лампа', acquired: true },
        ];
        const PORT = 4320;
        const CLIENT_DELAY_MS = Number(process.env.CLIENT_DELAY_MS ?? 0);

        const server = http.createServer(async (req, res) => {
          if (req.method === 'GET' && req.url === '/') {
            const data = { items };
            const markup = renderToString(h(WishList, data));
            res.writeHead(200, { 'content-type': 'text/html; charset=utf-8' });
            res.end(`<!doctype html>
        <html lang="uk">
        <head><meta charset="utf-8"><title>Список бажань</title></head>
        <body>
        <div id="root">${markup}</div>
        <script id="initial-data" type="application/json">${JSON.stringify(data)}</script>
        <script type="module" src="/client.js"></script>
        </body>
        </html>`);
            return;
          }
          if (req.method === 'GET' && req.url === '/client.js') {
            // Holds the client code back for a while, so you can click before hydration.
            await new Promise((resolve) => setTimeout(resolve, CLIENT_DELAY_MS));
            res.writeHead(200, { 'content-type': 'text/javascript; charset=utf-8' });
            res.end(await readFile(new URL('./public/client.js', import.meta.url)));
            return;
          }
          res.writeHead(404, { 'content-type': 'text/plain; charset=utf-8' });
          res.end('not found');
        });

        server.listen(PORT, '127.0.0.1', () => console.log(`SSR lab: http://127.0.0.1:${PORT}/`));
        ```

        **Крок 6 — збірка клієнта:**

        ```text
        > ssr-lab@1.0.0 build
        > esbuild client.js --bundle --format=esm --outfile=public/client.js

          public/client.js  1.1mb ⚠️

        ⚡ Done in 24ms
        ```

        1,1 МБ — це development-збірка React з докладними повідомленнями. Для навчання це добре; у production збирають з `--minify`.

        **Крок 9 — консоль браузера після гідратації:**

        ```text
        Download the React DevTools for a better development experience: https://react.dev/link/react-devtools
        hydrated
        Failed to load resource: the server responded with a status of 404 (Not Found)
        ```

        Червоний рядок про 404 — це `/favicon.ico`: браузер сам просить іконку сторінки, а цей сервер її не має.
      en: |
        Now everything is real: a `node:http` server renders the list with `react-dom/server`, and the browser hydrates it with `react-dom/client`. **esbuild** (you know it from the project) bundles the client code into one file. The server deliberately holds `/client.js` back for 3 seconds, so you have time to press a button before hydration.

        While preparing the lesson everything was run on macOS with Node.js v25.2.1 and npm 11.6.2; npm installed react 19.3.0, react-dom 19.3.0 and esbuild 0.28.2, and the page was opened in Chrome. The output below is real. This lesson was not checked on Node.js 22, Windows or Linux; if npm gives newer 19.x versions, the output may differ slightly.

        **Step 3 — the file `WishList.js`** (shared by the server and the browser; no JSX, so that Node.js imports it directly):

        ```js
        // The shared list component: the server renders it to HTML, the browser hydrates it.
        import { createElement as h, useState } from 'react';

        export function WishList({ items }) {
          const [acquired, setAcquired] = useState(() => items.filter((item) => item.acquired).map((item) => item.id));
          function toggle(id) {
            setAcquired(acquired.includes(id) ? acquired.filter((x) => x !== id) : [...acquired, id]);
          }
          return h('ul', null,
            items.map((item) =>
              h('li', { key: item.id },
                item.name, ' ',
                h('button', { type: 'button', 'aria-pressed': acquired.includes(item.id), onClick: () => toggle(item.id) },
                  acquired.includes(item.id) ? 'Got it' : 'Wanted'))));
        }
        ```

        **Step 4 — the file `client.js`:**

        ```js
        // The client entry: reads the initial data from the page and hydrates the server HTML.
        import { createElement as h } from 'react';
        import { hydrateRoot } from 'react-dom/client';
        import { WishList } from './WishList.js';

        const data = JSON.parse(document.getElementById('initial-data').textContent);
        hydrateRoot(document.getElementById('root'), h(WishList, data));
        console.log('hydrated');
        ```

        **Step 5 — the file `server.js`:**

        ```js
        // A node:http server: GET / renders the list, GET /client.js serves the client bundle.
        import http from 'node:http';
        import { readFile } from 'node:fs/promises';
        import { createElement as h } from 'react';
        import { renderToString } from 'react-dom/server';
        import { WishList } from './WishList.js';

        const items = [
          { id: 'w-01', name: 'Headphones', acquired: false },
          { id: 'w-02', name: 'Desk lamp', acquired: true },
        ];
        const PORT = 4320;
        const CLIENT_DELAY_MS = Number(process.env.CLIENT_DELAY_MS ?? 0);

        const server = http.createServer(async (req, res) => {
          if (req.method === 'GET' && req.url === '/') {
            const data = { items };
            const markup = renderToString(h(WishList, data));
            res.writeHead(200, { 'content-type': 'text/html; charset=utf-8' });
            res.end(`<!doctype html>
        <html lang="en">
        <head><meta charset="utf-8"><title>Wishlist</title></head>
        <body>
        <div id="root">${markup}</div>
        <script id="initial-data" type="application/json">${JSON.stringify(data)}</script>
        <script type="module" src="/client.js"></script>
        </body>
        </html>`);
            return;
          }
          if (req.method === 'GET' && req.url === '/client.js') {
            // Holds the client code back for a while, so you can click before hydration.
            await new Promise((resolve) => setTimeout(resolve, CLIENT_DELAY_MS));
            res.writeHead(200, { 'content-type': 'text/javascript; charset=utf-8' });
            res.end(await readFile(new URL('./public/client.js', import.meta.url)));
            return;
          }
          res.writeHead(404, { 'content-type': 'text/plain; charset=utf-8' });
          res.end('not found');
        });

        server.listen(PORT, '127.0.0.1', () => console.log(`SSR lab: http://127.0.0.1:${PORT}/`));
        ```

        **Step 6 — building the client:**

        ```text
        > ssr-lab@1.0.0 build
        > esbuild client.js --bundle --format=esm --outfile=public/client.js

          public/client.js  1.1mb ⚠️

        ⚡ Done in 26ms
        ```

        1.1 MB is React’s development build with detailed messages. That is good for learning; production builds use `--minify`.

        **Step 9 — the browser console after hydration:**

        ```text
        Download the React DevTools for a better development experience: https://react.dev/link/react-devtools
        hydrated
        Failed to load resource: the server responded with a status of 404 (Not Found)
        ```

        The red line about 404 is `/favicon.ico`: the browser asks for the page icon by itself, and this server has none.
    tools:
      - { name: "Node.js", version: { uk: "22.13 або новіший", en: "22.13 or newer" }, note: { uk: "Урок виконано на v25.2.1.", en: "The lesson was run on v25.2.1." } }
      - { name: "npm", version: "11.6.2", note: { uk: "Іде разом із Node.js.", en: "Comes with Node.js." } }
      - { name: "Chrome", version: { uk: "будь-який сучасний", en: "any current version" }, note: { uk: "Або інший браузер з інструментами розробника.", en: "Or another browser with developer tools." } }
    steps:
      - text:
          uk: "Створи теку лабораторії поруч із проєктом і зроби її npm-проєктом з ES-модулями."
          en: "Create the lab folder next to the project and make it an npm project with ES modules."
        command: |
          mkdir -p ~/js-course/ssr-lab
          cd ~/js-course/ssr-lab
          npm init -y
          npm pkg set type=module
        expect:
          uk: "`npm init -y` друкує вміст нового `package.json`; `npm pkg set` нічого не друкує."
          en: "`npm init -y` prints the content of the new `package.json`; `npm pkg set` prints nothing."
      - text:
          uk: "Установи React для сервера й браузера та esbuild для збірки."
          en: "Install React for the server and the browser, and esbuild for the build."
        command: |
          npm install react@19 react-dom@19
          npm install --save-dev esbuild
          npm ls
        expect:
          uk: "`npm ls` показує `esbuild@0.28.2`, `react-dom@19.3.0` і `react@19.3.0` (або новіші версії 19.x і 0.28.x)."
          en: "`npm ls` shows `esbuild@0.28.2`, `react-dom@19.3.0` and `react@19.3.0` (or newer 19.x and 0.28.x versions)."
      - text:
          uk: "Створи `WishList.js` з кроку 3 вступу."
          en: "Create `WishList.js` from step 3 of the introduction."
      - text:
          uk: "Створи `client.js` з кроку 4 вступу."
          en: "Create `client.js` from step 4 of the introduction."
      - text:
          uk: "Створи `server.js` з кроку 5 вступу."
          en: "Create `server.js` from step 5 of the introduction."
      - text:
          uk: "Додай команди `build` і `start` і збери клієнтський код."
          en: "Add the `build` and `start` commands and build the client code."
        command: |
          npm pkg set scripts.build="esbuild client.js --bundle --format=esm --outfile=public/client.js"
          npm pkg set scripts.start="node server.js"
          npm run build
        expect:
          uk: "З’являється файл `public/client.js` розміром близько 1,1 МБ (див. крок 6 вступу)."
          en: "The file `public/client.js` appears, about 1.1 MB in size (see step 6 of the introduction)."
      - text:
          uk: "Запусти сервер із затримкою клієнтського коду на 3 секунди. Це синтаксис macOS і Linux; у PowerShell на Windows команда була б `$env:CLIENT_DELAY_MS=3000; npm start` (не перевірено)."
          en: "Start the server with the client code held back for 3 seconds. This is macOS and Linux syntax; in PowerShell on Windows the command would be `$env:CLIENT_DELAY_MS=3000; npm start` (not verified)."
        command: "CLIENT_DELAY_MS=3000 npm start"
        expect:
          uk: "Рядок `SSR lab: http://127.0.0.1:4320/`; термінал лишається зайнятим, доки сервер працює."
          en: "The line `SSR lab: http://127.0.0.1:4320/`; the terminal stays busy while the server runs."
      - text:
          uk: "Відкрий http://127.0.0.1:4320/ і відразу натисни першу кнопку («Хочу») кілька разів — до того, як у консолі з’явиться `hydrated`. Щоб бачити консоль, відкрий інструменти розробника (Chrome: ⌥⌘J на macOS, Ctrl+Shift+J на Windows і Linux) ще до відкриття адреси."
          en: "Open http://127.0.0.1:4320/ and at once press the first button (“Wanted”) a few times — before `hydrated` appears in the console. To see the console, open the developer tools (Chrome: ⌥⌘J on macOS, Ctrl+Shift+J on Windows and Linux) before you open the address."
        expect:
          uk: "Список видно відразу, але кнопка не реагує: її текст лишається «Хочу»."
          en: "The list is visible at once, but the button does not react: its text stays “Wanted”."
      - text:
          uk: "Перезавантаж сторінку й **поки триває пауза** введи в консолі перший рядок. Коли з’явиться `hydrated` (крок 9 вступу), натисни першу кнопку й введи другий рядок."
          en: "Reload the page and **while the pause lasts** type the first line into the console. When `hydrated` appears (step 9 of the introduction), press the first button and type the second line."
        command: |
          window.firstButton = document.querySelector("#root button")
          window.firstButton === document.querySelector("#root button")
        expect:
          uk: "Після гідратації натискання змінює текст на «Отримано», а другий рядок друкує `true`: це та сама кнопка, яку намалював сервер."
          en: "After hydration a press changes the text to “Got it”, and the second line prints `true`: it is the same button the server painted."
      - text:
          uk: "Зупини сервер у терміналі: Ctrl+C."
          en: "Stop the server in the terminal: Ctrl+C."
    verify:
      - id: dead-before
        text:
          uk: "До появи `hydrated` натискання кнопки нічого не змінювало."
          en: "Before `hydrated` appeared, pressing the button changed nothing."
      - id: same-node
        text:
          uk: "Після гідратації кнопка реагує, а `window.firstButton === …` надрукувало `true`."
          en: "After hydration the button reacts, and `window.firstButton === …` printed `true`."
    troubleshooting:
      - problem:
          uk: "`npm start` падає з `Error: listen EADDRINUSE: address already in use 127.0.0.1:4320`."
          en: "`npm start` fails with `Error: listen EADDRINUSE: address already in use 127.0.0.1:4320`."
        fix:
          uk: "Порт 4320 уже зайнятий — найчастіше сервером, запущеним раніше в іншому вікні терміналу. Зупини його Ctrl+C або зміни `PORT` у `server.js` (тоді й адресу в браузері). Текст помилки взято з Node.js v25.2.1."
          en: "Port 4320 is already taken — most often by a server started earlier in another terminal window. Stop it with Ctrl+C or change `PORT` in `server.js` (and then the address in the browser). The error text is from Node.js v25.2.1."
      - problem:
          uk: "`Error [ERR_MODULE_NOT_FOUND]: Cannot find package 'react' imported from …/server.js`."
          en: "`Error [ERR_MODULE_NOT_FOUND]: Cannot find package 'react' imported from …/server.js`."
        fix:
          uk: "Пакети не встановлено в цю теку: перевір, що ти в `~/js-course/ssr-lab` (`pwd`), і повтори крок 2. Текст помилки взято з Node.js v25.2.1."
          en: "The packages are not installed in this folder: check that you are in `~/js-course/ssr-lab` (`pwd`) and repeat step 2. The error text is from Node.js v25.2.1."
      - problem:
          uk: "Сторінка відкрилася, а потім сервер зупинився з `Error: ENOENT: no such file or directory, open '…/public/client.js'`."
          en: "The page opened, and then the server stopped with `Error: ENOENT: no such file or directory, open '…/public/client.js'`."
        fix:
          uk: "Клієнтський код ще не зібрано: виконай `npm run build` і запусти сервер знову. Сервер падає цілком, бо помилка в асинхронному обробнику ніде не перехоплена, — як обробляти помилки маршруту, буде в четвертому уроці. Поведінку виміряно на Node.js v25.2.1."
          en: "The client code has not been built yet: run `npm run build` and start the server again. The whole server stops because the error in the async handler is caught nowhere — handling route errors is the fourth lesson. Behaviour measured on Node.js v25.2.1."
    recovery:
