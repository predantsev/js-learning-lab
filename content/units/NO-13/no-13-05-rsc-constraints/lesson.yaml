id: no-13-05-rsc-constraints
unit: NO-13
title:
  uk: "Обмеження інтеграції RSC (грамотність)"
  en: "RSC integration constraints (literacy)"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Пояснити, що React Server Components додають до SSR цього розділу (компоненти лише для сервера, серіалізований результат компонентів) і чому вони потребують інтеграції з бандлером і фреймворком."
    en: "Explain what React Server Components add beyond the SSR built in this unit (server-only components, a serialized component payload) and why they need bundler and framework integration."
  - uk: "Розсортувати пропси заданого дерева на ті, що можуть перетнути межу між серверним і клієнтським компонентом, і ті, що не можуть."
    en: "Sort the props of a given tree into serializable and non-serializable across a server-to-client component boundary."
prerequisites: [no-13-04-mismatch-error-handling, re-11-05-rsc-frameworks-stability]
subskills:
  - { family: B-11, skill: "RSC integration constraints literacy", depth: intro }
glossary: [rsc-payload, bundler-integration]
selfCheck: [predict-crossing, rsc-note]

blocks:
  - id: ssr-vs-rsc
    kind: explanation
    title:
      uk: "SSR, який ти збудував, і що до нього додають RSC"
      en: "The SSR you built, and what RSC add to it"
    body:
      uk: |
        Твій сервер робить класичний [[server-side-rendering|SSR]]: рендерить **усе** дерево в HTML, а браузер завантажує код **усього** дерева й гідратує його. [[react-server-components|React Server Components]] змінюють саме цю другу половину:

        | | SSR цього розділу | RSC |
        |---|---|---|
        | що йде в браузер | HTML + `#initial-data` + бандл усього дерева | HTML + [[rsc-payload\|серіалізований результат серверних компонентів]] + бандл лише клієнтських |
        | серверні компоненти | немає: кожен компонент є і в бандлі | рендеряться лише на сервері, їхній код до бандла не потрапляє |
        | що гідратується | усе дерево | лише клієнтські компоненти (`"use client"`) |
        | хто це будує | твій `node:http` і esbuild | [[bundler-integration\|бандлер, інтегрований з React]], і фреймворк |

        Чому одного прапорця не досить? Хтось має **розрізати граф модулів** на `"use client"` і зібрати два бандли, хтось — **виконувати** серверні компоненти на кожен запит чи під час збірки, і хтось — **переносити** їхній результат разом із пропсами клієнтських компонентів у браузер. Жодного із цих трьох кроків у твоєму сервері немає, і `react` сам їх не робить.

        І ще факт зі сторінки «Server Components» на react.dev: самі серверні компоненти в React 19 стабільні, але API, якими бандлер чи фреймворк їх **реалізує**, не дотримуються semver і можуть ламатися між мінорними версіями 19.x — тому документація радить таким інструментам фіксувати версію React або брати Canary.
      en: |
        Your server does classic [[server-side-rendering|SSR]]: it renders the **whole** tree to HTML, and the browser downloads the code of the **whole** tree and hydrates it. [[react-server-components|React Server Components]] change exactly that second half:

        | | This unit’s SSR | RSC |
        |---|---|---|
        | what goes to the browser | HTML + `#initial-data` + a bundle of the whole tree | HTML + the [[rsc-payload\|serialized result of the server components]] + a bundle of the client ones only |
        | server components | none: every component is in the bundle too | render only on the server; their code never reaches the bundle |
        | what is hydrated | the whole tree | only client components (`"use client"`) |
        | who builds it | your `node:http` and esbuild | a [[bundler-integration\|bundler integrated with React]] and a framework |

        Why is one flag not enough? Someone has to **cut the module graph** at `"use client"` and build two bundles, someone has to **run** server components on every request or during the build, and someone has to **carry** their result, together with the props of client components, to the browser. Your server has none of those three steps, and `react` does not do them by itself.

        One more fact, from the “Server Components” page on react.dev: server components themselves are stable in React 19, but the APIs a bundler or framework uses to **implement** them do not follow semver and may break between 19.x minor versions — so the documentation advises such tools to pin the React version or use Canary.

  - id: two-pipelines
    kind: visual
    visual: diagram
    title:
      uk: "Два конвеєри поруч"
      en: "Two pipelines side by side"
    textEquivalent:
      uk: "Ліворуч — SSR цього розділу: компонент рендериться в HTML-рядок, і браузер гідратує все дерево; клієнтський бандл містить усі компоненти. Праворуч — RSC: серверні компоненти рендеряться на сервері в серіалізований результат (RSC payload), а клієнтські компоненти рендеряться й гідратуються лише там, де їх позначено \"use client\". Між ними стоїть межа серіалізації, через яку проходять лише значення. Розрізати модулі на дві частини й зібрати два бандли може лише бандлер з інтеграцією RSC — саме цього блоку бракує вручну зібраному серверу."
      en: "On the left is this unit’s SSR: the component renders to an HTML string, and the browser hydrates the whole tree; the client bundle holds every component. On the right is RSC: server components render on the server into a serialized result (the RSC payload), and client components render and hydrate only where they are marked \"use client\". Between them sits the serialization boundary, which only values cross. Only a bundler with RSC integration can cut the modules into two parts and build two bundles — exactly the box a hand-built server lacks."
    spec:
      layout: grid
      groups:
        - { id: ssr, label: { uk: "SSR (цей розділ)", en: "SSR (this unit)" } }
        - { id: rsc, label: "RSC" }
      nodes:
        - { id: comp, group: ssr, label: { uk: "компонент", en: "component" }, w: 130, col: 0, row: 0 }
        - { id: html, group: ssr, label: { uk: "HTML-рядок", en: "HTML string" }, w: 130, col: 0, row: 1 }
        - { id: hydrateAll, group: ssr, label: { uk: "гідратувати все", en: "hydrate all" }, w: 130, col: 0, row: 2 }
        - { id: bundler, group: rsc, label: { uk: "бандлер + RSC", en: "bundler + RSC" }, w: 150, col: 1, row: 0 }
        - { id: payload, group: rsc, label: "RSC payload", w: 150, col: 1, row: 1 }
        - { id: hydrateClient, group: rsc, label: { uk: "лише \"use client\"", en: "\"use client\" only" }, w: 150, col: 1, row: 2 }
      edges:
        - { id: c-h, from: comp, to: html, label: "renderToString" }
        - { id: h-a, from: html, to: hydrateAll }
        - { id: b-p, from: bundler, to: payload, label: { uk: "серверні", en: "server" } }
        - { id: p-c, from: payload, to: hydrateClient, label: { uk: "лише значення", en: "values only" }, kind: dashed }
      steps:
        - caption:
            uk: "Ліворуч — те, що ти збудував; праворуч — те, що додають RSC."
            en: "On the left is what you built; on the right is what RSC add."
        - caption:
            uk: "SSR: один рендер у HTML-рядок, потім гідратація **всього** дерева. Код кожного компонента — у бандлі."
            en: "SSR: one render to an HTML string, then hydration of the **whole** tree. Every component’s code is in the bundle."
          highlight: [comp, html, hydrateAll, c-h, h-a]
        - caption:
            uk: "RSC: серверні компоненти перетворюються на серіалізований результат, а гідратуються лише клієнтські. Межу серіалізації перетинають лише значення."
            en: "RSC: server components turn into a serialized result, and only client components hydrate. Only values cross the serialization boundary."
          highlight: [payload, hydrateClient, p-c]
        - caption:
            uk: "Усе це можливо лише тоді, коли бандлер знає про RSC і розрізає модулі на `\"use client\"`. Твоєму `node:http` з esbuild бракує саме цього блоку."
            en: "All of this is possible only when the bundler knows RSC and cuts the modules at `\"use client\"`. Your `node:http` with esbuild lacks exactly this box."
          highlight: [bundler, b-p]

  - id: predict-crossing
    kind: prediction
    prompt:
      uk: "Серверний компонент передає клієнтському чотири пропси: `generatedAt: new Date()`, `onToggle: (id) => …` (звичайна функція), `item: { id: \"w-01\", name: \"…\" }` і `totals: new Map([[\"food\", 84550]])`. Які з них **можуть** перетнути межу? Познач усі."
      en: "A server component passes four props to a client component: `generatedAt: new Date()`, `onToggle: (id) => …` (an ordinary function), `item: { id: \"w-01\", name: \"…\" }` and `totals: new Map([[\"food\", 84550]])`. Which of them **can** cross the boundary? Mark all."
    runnable: false
    answer:
      type: multi
      options:
        - { id: date, text: { uk: "`generatedAt` (Date)", en: "`generatedAt` (Date)" } }
        - id: handler
          text: { uk: "`onToggle` (функція)", en: "`onToggle` (a function)" }
          why:
            uk: "Звичайна функція — це код, а не значення: її не можна серіалізувати. Межу перетинають лише Server Functions, позначені `\"use server\"`."
            en: "An ordinary function is code, not a value: it cannot be serialized. Only Server Functions marked `\"use server\"` cross the boundary."
        - { id: record, text: { uk: "`item` (звичайний об’єкт)", en: "`item` (a plain object)" } }
        - { id: map, text: { uk: "`totals` (Map)", en: "`totals` (a Map)" } }
      correct: [date, record, map]
    explanation:
      uk: "За списком «Serializable types» на сторінці `\"use client\"` (react.dev, React 19) межу перетинають `Date`, звичайні об’єкти й `Map` із серіалізовними значеннями. Звичайна функція — ні. Зверни увагу: це ширше, ніж JSON, — `JSON.stringify` перетворив би `Date` на рядок, а `Map` — на `{}`."
      en: "According to the “Serializable types” list on the `\"use client\"` page (react.dev, React 19), `Date`, plain objects and a `Map` of serializable values cross the boundary. An ordinary function does not. Note that this is wider than JSON — `JSON.stringify` would turn the `Date` into a string and the `Map` into `{}`."

  - id: crossing-checker
    kind: example
    runtime: isolated-node
    dir: crossing-checker
    entry: index.js
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      crosses: { uk: "перетинає межу", en: "crosses" }
      blocked: { uk: "НЕ перетинає", en: "does NOT cross" }
    title:
      uk: "Перевірка: що може перетнути межу"
      en: "A checker: what can cross the boundary"
    body:
      uk: |
        `crossing.js` — функція `canCross`, написана за списком «Serializable types» з react.dev. Чого вона не вміє (наприклад, відрізнити Server Function від звичайної функції), сказано в коментарі на початку файлу. `index.js` перевіряє пропси, які сторінка витрат передала б своєму клієнтському фільтру.

        Натисни **Запустити**.
      en: |
        `crossing.js` is a `canCross` function written from the “Serializable types” list on react.dev. What it cannot do (for example, tell a Server Function from an ordinary function) is in the comment at the top of the file. `index.js` checks the props an expense page would pass to its client-side filter.

        Press **Run**.
    tryIt:
      uk: |
        1. Перетинають `expenses`, `generatedAt` і `totals`; не перетинають `onFilter` (функція) і `budget` (екземпляр класу `Money` — разом з його методом `format`).
        2. Заміни `budget: new Money(150000)` на `budgetMinor: 150000` і запусти: тепер цей проп — просто число. Суму форматуватиме вже сам клієнтський компонент.
        3. Обробник не перетворити на значення. Його місце — **усередині** клієнтського компонента: він сам вирішує, що робити з вибраною категорією.
      en: |
        1. `expenses`, `generatedAt` and `totals` cross; `onFilter` (a function) and `budget` (an instance of the `Money` class — together with its `format` method) do not.
        2. Replace `budget: new Money(150000)` with `budgetMinor: 150000` and run: now this prop is just a number. The client component will do the formatting itself.
        3. A handler cannot be turned into a value. Its place is **inside** the client component: it decides on its own what to do with the chosen category.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: RSC і фреймворки"
      en: "Recall: RSC and frameworks"
    items:
      - id: vite-spa
        from: re-11-05-rsc-frameworks-stability
        prompt:
          uk: "Команда хоче додати в звичайний Vite-SPA компонент із `async function` на сервері, бо «серверні компоненти стабільні з React 19». Що їм бракує?"
          en: "A team wants to add a component with an `async function` on the server to a plain Vite SPA, because “server components are stable since React 19”. What are they missing?"
        answer:
          type: choice
          options:
            - id: setup
              text:
                uk: "Налаштування з підтримкою RSC: бандлера, що ділить граф модулів, середовища, яке виконує серверні компоненти, і протоколу передачі результату"
                en: "A setup with RSC support: a bundler that splits the module graph, an environment that runs server components, and a protocol that carries the result"
            - id: version
              text:
                uk: "Лише оновити `react` до останньої 19.x"
                en: "Only updating `react` to the latest 19.x"
              why:
                uk: "Стабільний API не працює без налаштування, що його підтримує: Vite-SPA лишається клієнтським React за будь-якої версії."
                en: "A stable API does not work without a setup that supports it: a Vite SPA stays client-only React whatever the version."
            - id: directive
              text:
                uk: "Лише додати `\"use server\"` на початок файлу"
                en: "Only adding `\"use server\"` at the top of the file"
              why:
                uk: "`\"use server\"` позначає Server Functions, а не серверні компоненти, і без бандлера з підтримкою RSC директиви нічого не роблять."
                en: "`\"use server\"` marks Server Functions, not server components, and without a bundler with RSC support the directives do nothing."
          correct: [setup]
        explanation:
          uk: "Як і в RE-11: серверні компоненти — модель React, але працюють вони лише через фреймворк чи бандлер, що їх підтримує. Так само і твій `node:http`-сервер — це SSR, а не RSC."
          en: "As in RE-11: server components are a React model, but they work only through a framework or bundler that supports them. Likewise your `node:http` server is SSR, not RSC."

  - id: rsc-note
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: rsc-note
    entry: index.js
    editable: [note.js]
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      water: { uk: "Полити квіти", en: "Water the plants" }
      requires: { uk: "Потребує", en: "Requires" }
      gains: { uk: "Дає", en: "Gains" }
      blockers: { uk: "Не перетинають межу", en: "Do not cross the boundary" }
      unknownId: { uk: "(невідомий ідентифікатор)", en: "(unknown id)" }
    title:
      uk: "Записка: що дасть і чого вимагатиме перехід на RSC"
      en: "A note: what moving to RSC would gain and require"
    instructions:
      uk: |
        `tree.js` описує сторінку бажань так, як її розділили б RSC: кожен вузол — `{ name, kind, props, children }`, де `kind` — `"server"` або `"client"`. Допиши `note.js`:

        - `blockedProps(tree)` обходить **усе** дерево й повертає рядки `"Батько → Дитина.проп"` для кожного пропса, який **серверний** компонент передає **клієнтському** дочірньому й який не проходить `canCross`. Пропси між двома клієнтськими чи двома серверними компонентами межу не перетинають. Порядок — як у дереві: спершу пропси дитини, потім її нащадки, потім наступна дитина.
        - `rscNote` — записка: `requires` — ідентифікатори з `REQUIREMENTS` у `options.js`, яких вимагатиме перехід; `gains` — ідентифікатори з `GAINS`, які він справді дасть; `blockers` — результат `blockedProps(wishTree)`.

        Драйвер `index.js` друкує записку. **Перевірити** запускає `blockedProps` на іншому дереві й перевіряє вибрані ідентифікатори.
      en: |
        `tree.js` describes the wishlist page as RSC would split it: every node is `{ name, kind, props, children }`, where `kind` is `"server"` or `"client"`. Finish `note.js`:

        - `blockedProps(tree)` walks the **whole** tree and returns lines `"Parent → Child.prop"` for every prop that a **server** component passes to a **client** child and that does not pass `canCross`. Props between two client or two server components do not cross the boundary. The order follows the tree: first the child’s props, then its descendants, then the next child.
        - `rscNote` is the note: `requires` — ids from `REQUIREMENTS` in `options.js` that the move would require; `gains` — ids from `GAINS` that it would really bring; `blockers` — the result of `blockedProps(wishTree)`.

        The driver `index.js` prints the note. **Check** runs `blockedProps` on another tree and checks the chosen ids.
    testTitles:
      "finds a function passed from a server to a client component":
        uk: "Знаходить функцію, передану із серверного компонента в клієнтський"
        en: "Finds a function passed from a server to a client component"
      "finds blocked props deeper in the tree":
        uk: "Знаходить такі пропси й глибше в дереві"
        en: "Finds blocked props deeper in the tree"
      "ignores props between two client components":
        uk: "Не зважає на пропси між двома клієнтськими компонентами"
        en: "Ignores props between two client components"
      "ignores props between two server components":
        uk: "Не зважає на пропси між двома серверними компонентами"
        en: "Ignores props between two server components"
      "lists exactly the blocked props in tree order":
        uk: "Повертає рівно ці пропси в порядку дерева"
        en: "Lists exactly the blocked props in tree order"
      "the note cites the checker output for the wishlist tree":
        uk: "`rscNote.blockers` — результат `blockedProps(wishTree)`"
        en: "`rscNote.blockers` is the result of `blockedProps(wishTree)`"
      "requires names the three real requirements":
        uk: "`requires` називає три справжні вимоги"
        en: "`requires` names the three real requirements"
      "gains names exactly the two real gains":
        uk: "`gains` називає рівно дві справжні переваги"
        en: "`gains` names exactly the two real gains"
    hints:
      nudge:
        uk: "Межу перетинають пропси лише на одному виді ребра дерева. Яке це ребро — і як дістатися до всіх таких ребер, а не лише до верхніх?"
        en: "Props cross the boundary on only one kind of tree edge. Which edge is it — and how do you reach all such edges, not only the top ones?"
      explanation:
        uk: "Функція, що обходить дерево, викликає сама себе для кожної дитини й додає її результат до свого — так `depthOf` у JS-03 заходила у вкладені коробки. Пару «батько — дитина» перевіряй за `kind` обох. Пропси дитини дає `Object.entries(child.props)`. Для записки перечитай таблицю в поясненні цього уроку: що мусить з’явитися, чого твоєму серверу бракує, і що змінюється для браузера."
        en: "A function that walks a tree calls itself for each child and adds that result to its own — the way `depthOf` in JS-03 went into nested boxes. Check a parent–child pair by the `kind` of both. `Object.entries(child.props)` gives the child’s props. For the note, reread the table in this lesson’s explanation: what has to appear that your server lacks, and what changes for the browser."
    solutionNote:
      uk: "Рекурсія відвідує кожну пару «батько — дитина», а умова `server → client` пропускає решту. Записка спирається на факти уроку: потрібні бандлер, що ділить граф, середовище й протокол RSC і зафіксована версія React; переваги — код серверних компонентів не йде в бандл, і гідратуються лише клієнтські. Розбіжності гідратації нікуди не зникають: клієнтські компоненти так само рендеряться на сервері й гідратуються."
      en: "The recursion visits every parent–child pair, and the `server → client` condition skips the rest. The note rests on the lesson’s facts: it needs a bundler that splits the graph, an RSC environment and protocol, and a pinned React version; the gains are that server components’ code stays out of the bundle and only client components hydrate. Hydration mismatches do not go away: client components are still rendered on the server and hydrated."
    feedback:
      - when: { test: "finds a function passed from a server to a client component" }
        message:
          uk: "Ця перевірка чекає в результаті рядок `TaskPage → TaskBoard.onSave`: серверний `TaskPage` передає клієнтському `TaskBoard` функцію. Формат — `Батько → Дитина.проп` зі стрілкою `→` і пробілами довкола неї."
          en: "This check expects the line `TaskPage → TaskBoard.onSave` in the result: the server `TaskPage` passes a function to the client `TaskBoard`. The format is `Parent → Child.prop` with the arrow `→` and spaces around it."
      - when: { test: "finds blocked props deeper in the tree" }
        message:
          uk: "Ця перевірка чекає `TaskSection → DueBadge.format`: ця пара лежить на другому рівні дерева. `blockedProps` має обійти й дітей дітей."
          en: "This check expects `TaskSection → DueBadge.format`: that pair sits on the second level of the tree. `blockedProps` has to visit the children’s children too."
      - when: { test: "ignores props between two client components" }
        message:
          uk: "`TaskBoard` і `TaskRow` обидва клієнтські: пропси між ними не серіалізуються, тож рядка з `TaskRow` бути не повинно. Перевіряй і `kind` батька, і `kind` дитини."
          en: "`TaskBoard` and `TaskRow` are both client components: props between them are not serialized, so there must be no `TaskRow` line. Check both the parent’s `kind` and the child’s."
      - when: { test: "ignores props between two server components" }
        message:
          uk: "`TaskPage` і `TaskStats` обидва серверні: функція `sortBy` лишається на сервері, тож рядка з `TaskStats` бути не повинно."
          en: "`TaskPage` and `TaskStats` are both server components: the `sortBy` function stays on the server, so there must be no `TaskStats` line."
      - when: { test: "lists exactly the blocked props in tree order" }
        message:
          uk: "Ця перевірка чекає рівно два рядки в такому порядку: `TaskSection → DueBadge.format`, потім `TaskPage → TaskBoard.onSave` — `TaskSection` у дереві стоїть раніше за `TaskBoard`, тож його нащадки йдуть першими. `Date` і звичайні об’єкти межу перетинають."
          en: "This check expects exactly two lines in this order: `TaskSection → DueBadge.format`, then `TaskPage → TaskBoard.onSave` — `TaskSection` comes before `TaskBoard` in the tree, so its descendants come first. A `Date` and plain objects do cross the boundary."
      - when: { test: "the note cites the checker output for the wishlist tree" }
        message:
          uk: "`rscNote.blockers` має дорівнювати `blockedProps(wishTree)` і не бути порожнім."
          en: "`rscNote.blockers` must equal `blockedProps(wishTree)` and must not be empty."
      - when: { test: "requires names the three real requirements" }
        message:
          uk: "Ця перевірка чекає в `requires` три ідентифікатори з `REQUIREMENTS`, які справді потрібні RSC, і жодного зайвого. Перечитай, яких трьох кроків бракує твоєму серверу і що документація React радить щодо версій."
          en: "This check expects three ids from `REQUIREMENTS` in `requires` that RSC really need, and no extra ones. Reread which three steps your server lacks and what the React documentation advises about versions."
      - when: { test: "gains names exactly the two real gains" }
        message:
          uk: "Ця перевірка чекає в `gains` два ідентифікатори з `GAINS`. Подумай, чи справді сторінка з клієнтським фільтром обійдеться без JavaScript і чи зникають розбіжності, коли клієнтські компоненти й далі гідратуються."
          en: "This check expects two ids from `GAINS` in `gains`. Think whether a page with a client-side filter really needs no JavaScript, and whether mismatches disappear while client components are still hydrated."

  - id: to-project
    kind: transfer
    capstoneStep: NO-13
    body:
      uk: "Крок проєкту цього розділу ще не написаний. За планом курсу в ньому твій проєкт лишиться на вручну зібраному SSR без фреймворку, а RSC знадобляться лише як аргумент: яку частину сторінки списку можна було б зробити серверною і які пропси завадили б цьому."
      en: "The project step of this unit is not written yet. According to the course plan, in it your project stays on hand-built SSR without a framework, and RSC matter only as an argument: which part of the list page could become server-only and which props would stand in the way."
