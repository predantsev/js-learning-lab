id: no-13-01-render-to-string
unit: NO-13
title:
  uk: "Рендеримо React на Node"
  en: "Rendering React on Node"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Відрендерити React-компонент у текст HTML через `renderToString` і надіслати його як повний документ із маршруту `node:http`."
    en: "Render a React component to an HTML string with renderToString and send it as a complete document from a node:http route."
  - uk: "Передбачити, який код виконується під час рендерингу на сервері (тіла компонентів), а який там не виконується ніколи (ефекти, обробники подій)."
    en: "Predict which code runs during server rendering (component bodies) and which never runs there (effects, event handlers)."
prerequisites: [re-11-01-csr-ssr-static, no-03-03-routing-json-bodies]
subskills:
  - { family: B-11, skill: "server rendering/static output", depth: intro }
glossary: [render-to-string, server-entry]
selfCheck: [predict-server-run, render-page]

blocks:
  - id: react-without-browser
    kind: explanation
    title:
      uk: "React без браузера"
      en: "React without a browser"
    body:
      uk: |
        У RE-11 ти бачив [[server-side-rendering|SSR]] збоку: сервер присилає готовий HTML, а браузер його показує. Тепер сервер — твій.

        Рендер React лише **описує** інтерфейс. У браузері `react-dom/client` перетворює опис на вузли DOM, а на сервері `react-dom/server` перетворює той самий опис на **текст HTML**:

        ```js
        import { createElement as h } from "react";
        import { renderToString } from "react-dom/server";

        const html = renderToString(h(TaskList, { tasks }));
        // '<ul class="tasks"><li>…</li></ul>'
        ```

        [[render-to-string|`renderToString`]] викликає компоненти один раз, збирає їхній результат і повертає звичайний рядок. Його вже можна передати в `res.end()`.

        Node.js не читає JSX — це синтаксис, який перекладає збірка. Тому серверний код пише те, на що JSX перекладається: `createElement(тип, пропси, ...діти)`. Запис `<li className="due">{title}</li>` — це `h("li", { className: "due" }, title)`.
      en: |
        In RE-11 you saw [[server-side-rendering|SSR]] from the outside: the server sends ready HTML and the browser shows it. Now the server is yours.

        A React render only **describes** the interface. In the browser `react-dom/client` turns the description into DOM nodes; on the server `react-dom/server` turns the same description into **HTML text**:

        ```js
        import { createElement as h } from "react";
        import { renderToString } from "react-dom/server";

        const html = renderToString(h(TaskList, { tasks }));
        // '<ul class="tasks"><li>…</li></ul>'
        ```

        [[render-to-string|`renderToString`]] calls the components once, collects their result and returns an ordinary string. You can pass it straight to `res.end()`.

        Node.js does not read JSX — that syntax is translated by a build step. So server code writes what JSX translates to: `createElement(type, props, ...children)`. `<li className="due">{title}</li>` is `h("li", { className: "due" }, title)`.

  - id: mini-react
    kind: explanation
    title:
      uk: "Справжній Node.js і навчальна заміна React"
      en: "Real Node.js and a teaching stand-in for React"
    body:
      uk: |
        Приклади й вправи цього розділу виконує справжній Node.js на твоєму комп’ютері, але без npm-пакетів — тож пакета `react` у них немає. Замість нього вони імпортують файл `mini-react.js`: невелику **навчальну заміну** `react` і `react-dom/server` з тими самими назвами — `createElement`, `useState`, `useEffect`, `renderToString`.

        Для компонентів цього розділу її `renderToString` дає HTML, який **посимвольно** збігається з `react-dom/server` 19.3.0 (це перевірено, коли розділ писали). Чого вона не вміє, вона не вгадує, а кидає помилку «not supported». Перелік відмінностей від справжнього React — у коментарі на початку файлу.

        Справжній `react-dom/server` ти встановиш у наступному уроці у власну локальну лабораторію, і той самий код компонентів працюватиме з ним без змін — зміняться лише рядки імпорту: `createElement` і хуки йдуть із `react`, а `renderToString` — з `react-dom/server`.
      en: |
        The examples and exercises of this unit run in real Node.js on your computer, but without npm packages — so there is no `react` package in them. Instead they import the file `mini-react.js`: a small **teaching stand-in** for `react` and `react-dom/server` with the same names — `createElement`, `useState`, `useEffect`, `renderToString`.

        For this unit’s components its `renderToString` produces HTML that matches `react-dom/server` 19.3.0 **character for character** (checked when the unit was written). What it cannot do, it does not guess: it throws a “not supported” error. The list of differences from real React is in the comment at the top of the file.

        You will install the real `react-dom/server` in the next lesson, in your own local lab, and the same component code works with it unchanged — only the import lines change: `createElement` and the hooks come from `react`, and `renderToString` from `react-dom/server`.

  - id: ssr-sequence
    kind: visual
    visual: sequence
    title:
      uk: "Один запит GET / на сервері з рендерингом"
      en: "One GET / request on a rendering server"
    textEquivalent:
      uk: "Браузер надсилає GET / серверу node:http. Обробник бере записи з репозиторію — даних не чекає ніхто, крім сервера. Потім він викликає renderToString з компонентом списку; React викликає тіла компонентів один раз і повертає текст HTML. Ефекти не виконуються, а обробники подій, як-от onClick, у HTML не потрапляють: текст не може містити функцій. Сервер загортає розмітку в документ і відповідає 200 з типом text/html. Браузер одразу малює список — ще до того, як завантажився хоч рядок JavaScript. Кнопки на сторінці є, але натискання на них нічого не робить: обробників ще немає."
      en: "The browser sends GET / to the node:http server. The handler takes the records from the repository — nobody but the server waits for the data. Then it calls renderToString with the list component; React calls the component bodies once and returns HTML text. Effects do not run, and event handlers such as onClick do not get into the HTML: text cannot hold functions. The server wraps the markup in a document and answers 200 with the type text/html. The browser paints the list at once — before a single line of JavaScript has loaded. The buttons are on the page, but pressing them does nothing: there are no handlers yet."
    spec:
      actors:
        - { id: browser, label: { uk: "Браузер", en: "Browser" } }
        - { id: server, label: "node:http" }
        - { id: react, label: "react-dom/server" }
      intro:
        uk: "Троє учасників: браузер, твій сервер `node:http` і серверний рендерер React."
        en: "Three participants: the browser, your `node:http` server and React’s server renderer."
      messages:
        - from: browser
          to: server
          kind: async
          label: "GET /"
          caption:
            uk: "Браузер просить сторінку. JavaScript він ще не має."
            en: "The browser asks for the page. It has no JavaScript yet."
        - from: server
          to: server
          kind: note
          label: { uk: "записи з репозиторію", en: "records from the repository" }
          caption:
            uk: "Обробник бере записи **до** рендерингу: дані потрібні вже зараз, а не «колись потім»."
            en: "The handler takes the records **before** rendering: the data is needed now, not “some time later”."
        - from: server
          to: react
          label: "renderToString(h(TaskList, { tasks }))"
          caption:
            uk: "React викликає тіла компонентів один раз. `useEffect` не виконується, `onClick` нікуди не дівається — він просто не може стати текстом."
            en: "React calls the component bodies once. `useEffect` does not run, and `onClick` goes nowhere — it simply cannot become text."
        - from: react
          to: server
          kind: return
          label: "'<ul class=\"tasks\">…</ul>'"
          caption:
            uk: "Результат — звичайний рядок із HTML."
            en: "The result is an ordinary string of HTML."
        - from: server
          to: browser
          kind: return
          label: "200 text/html"
          note: { uk: "<!doctype html> … <div id=\"root\">…</div>", en: "<!doctype html> … <div id=\"root\">…</div>" }
          caption:
            uk: "Сервер загортає розмітку в документ і відповідає. Список тепер у тілі відповіді."
            en: "The server wraps the markup in a document and answers. The list is now in the response body."
        - from: browser
          to: browser
          kind: note
          label: { uk: "список намальовано", en: "list painted" }
          caption:
            uk: "Людина вже бачить список, але кнопки ще «мертві»: жодного обробника на сторінці немає."
            en: "The person already sees the list, but the buttons are still “dead”: there is not a single handler on the page."

  - id: what-runs
    kind: explanation
    title:
      uk: "Що виконується на сервері, а що — ні"
      en: "What runs on the server, and what does not"
    body:
      uk: |
        Під час `renderToString` React робить рівно одне: викликає тіла компонентів, щоб дізнатися, яку розмітку вони повертають.

        | Код у компоненті | На сервері |
        |---|---|
        | тіло функції, `console.log` у ньому | виконується один раз |
        | початкове значення `useState` | обчислюється; сеттер ніхто не викликає — на сервері немає ні кліків, ні ефектів |
        | `useEffect(…)` | **не виконується ніколи** |
        | `onClick` та інші обробники | не виконуються й не потрапляють у HTML |

        Звідси два висновки. Дані сторінки не можна «завантажити в `useEffect`»: на сервері ефект не запуститься, і в HTML піде порожній список. Їх бере обробник маршруту **до** рендерингу й передає пропсами. І друге: сторінка із сервера не інтерактивна, доки браузер не завантажить JavaScript, — про це наступний урок.

        Ще дві дрібниці, які ти побачиш у прикладі: текст екранується (`<` стає `&lt;`), а між двома сусідніми шматками тексту React ставить `<!-- -->`, щоб потім у браузері розрізнити, де закінчується один і починається інший.
      en: |
        During `renderToString` React does exactly one thing: it calls the component bodies to learn what markup they return.

        | Code in a component | On the server |
        |---|---|
        | the function body, a `console.log` in it | runs once |
        | the initial value of `useState` | computed; nothing calls the setter — there are no clicks and no effects on the server |
        | `useEffect(…)` | **never runs** |
        | `onClick` and other handlers | do not run and do not get into the HTML |

        Two conclusions follow. A page’s data cannot be “loaded in `useEffect`”: on the server the effect never starts, and an empty list goes into the HTML. The route handler takes the data **before** rendering and passes it as props. And second: a page from the server is not interactive until the browser has loaded the JavaScript — that is the next lesson.

        Two small things you will see in the example: text is escaped (`<` becomes `&lt;`), and between two neighbouring pieces of text React puts `<!-- -->`, so that the browser can later tell where one ends and the next begins.

  - id: predict-server-run
    kind: prediction
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Повернути книжки", en: "Return books" }
    prompt:
      uk: "Модуль рендерить `TaskList` з двома справами через `renderToString` і друкує результат. Що з’явиться в консолі сервера?"
      en: "A module renders `TaskList` with two tasks through `renderToString` and prints the result. What appears in the server console?"
    code: |
      function TaskList({ tasks }) {
        console.log("body");
        useEffect(() => console.log("effect"), []);
        return h("ul", null, tasks.map((task) =>
          h("li", { key: task.id },
            task.title,
            h("button", { onClick: () => console.log("click") }, "✓"))));
      }

      const tasks = [
        { id: "t-01", title: "%%water%%" },
        { id: "t-02", title: "%%books%%" },
      ];
      console.log(renderToString(h(TaskList, { tasks })));
    runnable: false
    answer:
      type: choice
      options:
        - id: body-then-html
          text:
            uk: "`body`, а потім HTML списку з двома кнопками без жодного `onclick`"
            en: "`body`, then the HTML of the list with two buttons and no `onclick` at all"
        - id: with-effect
          text:
            uk: "`body`, `effect`, а потім HTML списку"
            en: "`body`, `effect`, then the HTML of the list"
          why:
            uk: "На сервері `useEffect` не виконується ніколи: ефекти запускаються лише після того, як React вставив результат у справжню сторінку, а на сервері сторінки немає."
            en: "On the server `useEffect` never runs: effects start only after React has put its result into a real page, and there is no page on the server."
        - id: onclick-in-html
          text:
            uk: "`body`, а потім HTML, у якому кнопки мають атрибут `onclick` з кодом функції"
            en: "`body`, then HTML in which the buttons have an `onclick` attribute with the function’s code"
          why:
            uk: "Обробники React не перетворюються на атрибути HTML. Функцію не можна передати текстом; кнопки «оживуть» лише тоді, коли React запуститься в браузері."
            en: "React handlers do not turn into HTML attributes. A function cannot travel as text; the buttons come alive only when React starts in the browser."
        - id: body-twice
          text:
            uk: "`body` двічі — по разу на справу, — а потім HTML"
            en: "`body` twice — once per task — then the HTML"
          why:
            uk: "`console.log(\"body\")` стоїть у тілі `TaskList`, а не всередині `map`. Компонент `TaskList` рендериться один раз, тож і рядок друкується один раз."
            en: "`console.log(\"body\")` sits in the body of `TaskList`, not inside `map`. The `TaskList` component renders once, so the line is printed once."
      correct: [body-then-html]
    explanation:
      uk: "`renderToString` викликає тіло `TaskList` один раз — звідси один `body`. Ефект не виконується, а `onClick` не стає атрибутом: у HTML лишаються дві кнопки з текстом «✓». Перевір це в прикладі цього уроку — там такий самий `TaskList`."
      en: "`renderToString` calls the body of `TaskList` once — hence one `body`. The effect does not run, and `onClick` does not become an attribute: the HTML keeps two buttons with the text “✓”. Check it in this lesson’s example — it has the same kind of `TaskList`."

  - id: render-and-serve
    kind: example
    runtime: isolated-node
    dir: render-and-serve
    entry: index.js
    capabilities: { network: loopback }
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Повернути книжки в бібліотеку", en: "Return library books" }
      noDate: { uk: "без терміну", en: "no due date" }
      markDone: { uk: "Виконано", en: "Done" }
      undo: { uk: "Повернути", en: "Undo" }
      bodyRuns: { uk: "тіло TaskList виконується", en: "TaskList body runs" }
      effectRuns: { uk: "ефект TaskList виконується", en: "TaskList effect runs" }
      clicked: { uk: "натиснуто", en: "clicked" }
      sameString: { uk: "тіло відповіді — той самий рядок:", en: "the response body is the same string:" }
    title:
      uk: "Рендер у рядок і той самий рядок із маршруту"
      en: "A render to a string, and the same string from a route"
    body:
      uk: |
        `index.js` рендерить `TaskList` (файл `TaskList.js`) через `renderToString` і друкує результат. Потім запускає сервер `node:http` на вільному порту 127.0.0.1, у якого `GET /` рендерить той самий список і відповідає ним, сам надсилає цей запит і порівнює тіло відповіді з рядком.

        Натисни **Запустити**. Порахуй, скільки разів надруковано «тіло TaskList виконується», і пошукай у виводі рядок про ефект.
      en: |
        `index.js` renders `TaskList` (the file `TaskList.js`) with `renderToString` and prints the result. Then it starts a `node:http` server on a free 127.0.0.1 port whose `GET /` renders the same list and answers with it, sends that request itself and compares the response body with the string.

        Press **Run**. Count how many times “TaskList body runs” is printed, and look for the line about the effect.
    tryIt:
      uk: |
        1. Рядок «тіло TaskList виконується» з’являється двічі: один рендер у модулі й один в обробнику маршруту. Рядка про ефект немає зовсім.
        2. У `tasks.js` додай у назву першої справи `<b>` — наприклад, `title: '<b>%%water%%'`. Запусти: у HTML буде `&lt;b&gt;`. React вставляє дані як **текст**, а не як розмітку.
        3. У `TaskList.js` заміни `task.dueDate ?? '%%noDate%%'` на `task.dueDate.slice(5)`. Запусти: друга справа має `dueDate: null`, тож рендер кидає `TypeError` ще до старту сервера. Помилка в рендері — це помилка сервера; як з нею поводитися, буде в четвертому уроці. Поверни рядок.
      en: |
        1. The line “TaskList body runs” appears twice: one render in the module and one in the route handler. There is no line about the effect at all.
        2. In `tasks.js` add `<b>` to the first task’s title — for example `title: '<b>%%water%%'`. Run: the HTML has `&lt;b&gt;`. React inserts data as **text**, not as markup.
        3. In `TaskList.js` replace `task.dueDate ?? '%%noDate%%'` with `task.dueDate.slice(5)`. Run: the second task has `dueDate: null`, so the render throws a `TypeError` before the server even starts. An error in rendering is a server error; how to handle it comes in the fourth lesson. Put the line back.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: що надсилає обробник"
      en: "Recall: what a handler sends"
    items:
      - id: return-is-not-answer
        from: no-03-01-http-server-lifecycle
        prompt:
          uk: "Обробник `node:http` обчислює `const html = renderToString(…)`, задає статус 200 і закінчується рядком `return html;`. Що отримає браузер?"
          en: "A `node:http` handler computes `const html = renderToString(…)`, sets status 200 and ends with the line `return html;`. What does the browser get?"
        answer:
          type: choice
          options:
            - id: waits
              text:
                uk: "Нічого: відповідь не завершено, браузер чекає, доки сам не здасться"
                en: "Nothing: the answer is never finished, and the browser waits until it gives up on its own"
            - id: html
              text:
                uk: "Сторінку з HTML, бо обробник його повернув"
                en: "A page with the HTML, because the handler returned it"
              why:
                uk: "Node не дивиться, що повертає обробник. Тіло відповіді надсилають лише `res.write` і `res.end`."
                en: "Node ignores what a handler returns. Only `res.write` and `res.end` send the response body."
            - id: empty-200
              text:
                uk: "Порожню сторінку зі статусом 200"
                en: "An empty page with status 200"
              why:
                uk: "Статус лише задано, але не надіслано: без `res.write` чи `res.end` не йде навіть рядок статусу."
                en: "The status was only set, not sent: without `res.write` or `res.end` not even the status line goes out."
          correct: [waits]
        explanation:
          uk: "Відповідь закінчує лише `res.end(html)`. Рядок, який повертає `renderToString`, — це просто значення в пам’яті сервера, доки ти не передаси його в `res.end`."
          en: "Only `res.end(html)` finishes the answer. The string `renderToString` returns is just a value in the server’s memory until you pass it to `res.end`."

  - id: page-document
    kind: explanation
    title:
      uk: "Від розмітки до документа"
      en: "From markup to a document"
    body:
      uk: |
        `renderToString` повертає лише розмітку компонента. Браузер же чекає **документ**, і [[server-entry|серверна точка входу]] будує його довкола розмітки шаблонним рядком:

        - `<!doctype html>` першим рядком — інакше браузер вмикає старий «quirks»-режим;
        - `<meta charset="utf-8">` у `<head>` — щоб українські літери не перетворилися на кракозябри;
        - елемент-контейнер, у якому лежить **рівно** розмітка React і нічого більше, навіть переносу рядка, — у наступному уроці React у браузері шукатиме її саме там, і зайвий текст у контейнері він сприйме як розбіжність;
        - тег `<script type="module" src="…">` із клієнтським кодом, який потім оживить сторінку.

        Розмітку вставляють як є, без додаткового екранування: React уже екранував дані всередині неї.
      en: |
        `renderToString` returns only the component’s markup. A browser expects a **document**, and the [[server-entry]] builds one around the markup with a template string:

        - `<!doctype html>` as the first line — otherwise the browser switches to the old “quirks” mode;
        - `<meta charset="utf-8">` in `<head>` — so that Ukrainian letters do not turn into garbage;
        - a container element that holds **exactly** React’s markup and nothing else, not even a line break — in the next lesson React in the browser will look for it right there and will treat extra text in the container as a mismatch;
        - a `<script type="module" src="…">` tag with the client code that will later bring the page to life.

        The markup goes in as it is, with no extra escaping: React has already escaped the data inside it.

  - id: render-page
    kind: exercise
