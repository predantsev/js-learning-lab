      en: "A complete document around the habit list"
    instructions:
      uk: |
        Допиши `renderPage(habits)` у `page.js`. Функція повертає текст **повного HTML-документа**:

        - перший рядок — `<!doctype html>`, далі `<html>` з `<head>` і `<body>`;
        - у `<head>` — `<meta charset="utf-8">` (і заголовок сторінки, якщо хочеш);
        - у `<body>` — `<div id="root">`, усередині якого **рівно** результат `renderToString` для `HabitList` з переданими `habits`, без пробілів і переносів навколо;
        - тег `<script>` з `src="/client.js"` і `type="module"`.

        `HabitList.js` готовий, змінювати його не треба. Драйвер `index.js` віддає твій документ на `GET /` з вільного порту 127.0.0.1, сам запитує його й друкує. **Перевірити** викликає `renderPage` з різними списками звичок і порівнює вміст `#root` з результатом `renderToString`.
      en: |
        Finish `renderPage(habits)` in `page.js`. The function returns the text of a **complete HTML document**:

        - the first line is `<!doctype html>`, then `<html>` with `<head>` and `<body>`;
        - in `<head>`: `<meta charset="utf-8">` (and a page title if you like);
        - in `<body>`: `<div id="root">` holding **exactly** the result of `renderToString` for `HabitList` with the given `habits`, with no spaces or line breaks around it;
        - a `<script>` tag with `src="/client.js"` and `type="module"`.

        `HabitList.js` is ready; you do not need to change it. The driver `index.js` serves your document at `GET /` from a free 127.0.0.1 port, requests it and prints it. **Check** calls `renderPage` with different lists of habits and compares the content of `#root` with the result of `renderToString`.
    testTitles:
      "the document starts with a doctype and has head and body":
        uk: "Документ починається з `<!doctype html>` і має `<head>` і `<body>`"
        en: "The document starts with `<!doctype html>` and has `<head>` and `<body>`"
      "the head declares UTF-8":
        uk: "У документі є `<meta charset=\"utf-8\">`"
        en: "The document has `<meta charset=\"utf-8\">`"
      "the root element holds exactly the rendered list":
        uk: "`<div id=\"root\">` містить рівно розмітку `renderToString`"
        en: "`<div id=\"root\">` holds exactly the `renderToString` markup"
      "the list comes from the habits it is given":
        uk: "Список рендериться з переданих `habits`"
        en: "The list is rendered from the `habits` passed in"
      "the page loads /client.js as a module":
        uk: "Сторінка завантажує `/client.js` з `type=\"module\"`"
        en: "The page loads `/client.js` with `type=\"module\"`"
    hints:
      nudge:
        uk: "Почни з розмітки: які два імпорти вже стоять у `page.js` і що з них дає рядок HTML?"
        en: "Start with the markup: which two imports are already in `page.js`, and which of them gives an HTML string?"
      explanation:
        uk: "Елемент для рендерингу створює `h(Компонент, пропси)` — як `h(TaskList, { tasks })` у прикладі. Результат `renderToString` — звичайний рядок, тож документ зручно зібрати шаблонним рядком із `${…}` у потрібному місці. Не екрануй розмітку вдруге: інакше `<ul>` стане текстом `&lt;ul&gt;`."
        en: "`h(Component, props)` creates the element to render — like `h(TaskList, { tasks })` in the example. The result of `renderToString` is an ordinary string, so a template string with `${…}` in the right place builds the document conveniently. Do not escape the markup a second time: otherwise `<ul>` becomes the text `&lt;ul&gt;`."
    solutionNote:
      uk: "`renderToString(h(HabitList, { habits }))` дає розмітку саме тих звичок, що передано. Шаблонний рядок кладе її в `#root` без пробілів довкола, а `<meta charset>` і `type=\"module\"` потрібні браузеру: перший — щоб правильно прочитати літери, другий — щоб виконати `import` у клієнтському коді."
      en: "`renderToString(h(HabitList, { habits }))` gives the markup of exactly the habits passed in. The template string puts it into `#root` with no whitespace around it, and the browser needs `<meta charset>` and `type=\"module\"`: the first to read the letters correctly, the second to run `import` in the client code."
    feedback:
      - when: { test: "the document starts with a doctype and has head and body" }
        message:
          uk: "Ця перевірка чекає, що текст починається з `<!doctype html>` (регістр не важливий) і містить `<html`, `<head>`, `</head>`, `<body>`, `</body>` і `</html>`. Якщо `renderPage` ще повертає порожній рядок, почни із цього."
          en: "This check expects the text to start with `<!doctype html>` (case does not matter) and to contain `<html`, `<head>`, `</head>`, `<body>`, `</body>` and `</html>`. If `renderPage` still returns an empty string, start there."
      - when: { test: "the head declares UTF-8" }
        message:
          uk: "Ця перевірка шукає в документі тег `<meta charset=\"utf-8\">`. Без нього браузер може прочитати українські назви звичок як кракозябри."
          en: "This check looks for the tag `<meta charset=\"utf-8\">` in the document. Without it a browser may read Ukrainian habit names as garbage."
      - when: { test: "the root element holds exactly the rendered list" }
        message:
          uk: "Ця перевірка чекає фрагмент `<div id=\"root\">` + результат `renderToString(h(HabitList, { habits }))` + `</div>` рівно в такому вигляді: без пробілів, переносів і повторного екранування. Якщо в документі видно `&lt;ul`, розмітку екрановано вдруге. Навіть перенос рядка всередині `#root` — це зайвий текстовий вузол: під час підготовки уроку React 19.3 у Chrome 154 повідомив через нього про розбіжність гідратації."
          en: "This check expects the fragment `<div id=\"root\">` + the result of `renderToString(h(HabitList, { habits }))` + `</div>` exactly like that: no spaces, no line breaks and no second escaping. If the document shows `&lt;ul`, the markup was escaped twice. Even a line break inside `#root` is an extra text node: while the lesson was prepared, React 19.3 in Chrome 154 reported a hydration mismatch because of it."
      - when: { test: "the list comes from the habits it is given" }
        message:
          uk: "Ця перевірка передає в `renderPage` одну іншу звичку й чекає в документі саме її розмітку. Рендери параметр `habits`, а не список із `habits.js`."
          en: "This check passes one other habit to `renderPage` and expects exactly its markup in the document. Render the `habits` parameter, not the list from `habits.js`."
      - when: { test: "the page loads /client.js as a module" }
        message:
          uk: "Ця перевірка шукає тег `<script>` з `src=\"/client.js\"` і чекає в ньому `type=\"module\"`: без цього атрибута браузер не виконає `import` у клієнтському коді."
          en: "This check looks for a `<script>` tag with `src=\"/client.js\"` and expects `type=\"module\"` in it: without that attribute the browser will not run `import` in the client code."

  - id: to-project
    kind: transfer
    capstoneStep: NO-13
    body:
      uk: "У кроці проєкту цього розділу маршрут `GET /` твого сервера на `127.0.0.1:4311` спершу бере записи зі сховища, а потім `renderPage` з `server/src/page.ts` рендерить спільний компонент списку (у «Списку бажань» — `ui/WishListPage.ts`, без JSX, через `createElement`) справжнім `renderToString` з `react-dom/server` і загортає розмітку в документ: `<div id=\"root\">`, `<script id=\"initial-data\">` і `<script type=\"module\" src=\"/client.js\">`. Помилка рендера — `500` з `fallbackPage`, а сервер обслуговує далі; `server/tests/ssr.test.ts` перевіряє весь документ."
      en: "In this unit’s project step your server’s `GET /` route on `127.0.0.1:4311` first takes the records from the store, then `renderPage` of `server/src/page.ts` renders the shared list component (in the Wishlist `ui/WishListPage.ts`, no JSX, through `createElement`) with the real `renderToString` of `react-dom/server` and wraps the markup in a document: `<div id=\"root\">`, `<script id=\"initial-data\">` and `<script type=\"module\" src=\"/client.js\">`. A render error is a `500` with `fallbackPage`, and the server goes on serving; `server/tests/ssr.test.ts` checks the whole document."
