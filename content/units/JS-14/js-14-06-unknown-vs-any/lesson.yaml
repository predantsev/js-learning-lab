id: js-14-06-unknown-vs-any
unit: JS-14
title:
  uk: "unknown проти any"
  en: "unknown vs any"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Пояснити, чому `any` вимикає перевірку для всіх подальших використань, а `unknown` вимагає перевірки перед використанням."
    en: "Explain why `any` switches checking off for every later use while `unknown` forces a check before use."
  - uk: "Крок за кроком звузити `unknown`-значення з `JSON.parse` через type predicate, перш ніж читати його поля."
    en: "Narrow an `unknown` value from `JSON.parse` step by step with a type predicate before reading its fields."
prerequisites: [js-14-05-functions-generics, js-07-04-json]
subskills:
  - { family: P-03, skill: "unknown vs any", depth: intro }
glossary: [any-type, unknown-type, type-predicate]
selfCheck: [predict-any-unknown, record-like]

blocks:
  - id: two-kinds-of-anything
    kind: explanation
    title:
      uk: "Два способи сказати «що завгодно»"
      en: "Two ways to say “anything”"
    body:
      uk: |
        Буває, що тип значення справді невідомий: текст зі сховища, відповідь сервера, вміст файлу. TypeScript має для цього два типи, і поводяться вони протилежно.

        - [[any-type|`any`]] — «не перевіряй». З `any` можна робити що завгодно: читати будь-яке поле, викликати як функцію, присвоювати куди завгодно. І `any` **розповзається**: усе, що з нього отримано, теж неперевірене.
        - [[unknown-type|`unknown`]] — «ще не перевірено». Присвоїти в `unknown` можна що завгодно, але **використати** його не можна, доки перевірка не звузить тип: `TS18046: 'value' is of type 'unknown'`.

        Важлива деталь: `JSON.parse` у TypeScript повертає `any`. Тобто без твого рішення результат розбору не перевіряється взагалі. Пиши `const value: unknown = JSON.parse(text);` — і `tsc` змусить перевірити дані, перш ніж ними користуватися.
      en: |
        Sometimes a value’s type really is unknown: text from storage, a server response, the contents of a file. TypeScript has two types for this, and they behave in opposite ways.

        - [[any-type|`any`]] means “do not check”. You can do anything with `any`: read any field, call it as a function, assign it anywhere. And `any` **spreads**: everything obtained from it is unchecked too.
        - [[unknown-type|`unknown`]] means “not checked yet”. Anything can be assigned to `unknown`, but you cannot **use** it until a check narrows the type: `TS18046: 'value' is of type 'unknown'`.

        An important detail: in TypeScript `JSON.parse` returns `any`. So unless you decide otherwise, the parsed result is not checked at all. Write `const value: unknown = JSON.parse(text);` — and `tsc` will make you check the data before using it.

  - id: predict-any-unknown
    kind: prediction
    prompt:
      uk: "Ті самі дані розібрано тричі: як `any`, як `unknown` і без анотації. Які з трьох позначених рядків `tsc` позначить помилкою?"
      en: "The same data is parsed three times: as `any`, as `unknown` and without an annotation. Which of the three marked lines does `tsc` flag as errors?"
    code: |
      const text = '{"name": "Morning exercise"}';

      const loose: any = JSON.parse(text);
      const strict: unknown = JSON.parse(text);
      const plain = JSON.parse(text);

      console.log(loose.name.toUpperCase()); // 1
      console.log(strict.name.toUpperCase()); // 2
      console.log(plain.name.toUpperCase()); // 3
    lang: ts
    runnable: false
    answer:
      type: choice
      options:
        - id: only-2
          text:
            uk: "Лише рядок 2"
            en: "Only line 2"
        - id: none
          text:
            uk: "Жодного: `unknown` — те саме, що `any`, лише суворіша назва"
            en: "None: `unknown` is the same as `any`, just a stricter-sounding name"
          why:
            uk: "`unknown` забороняє будь-яке використання до перевірки: `TS18046: 'strict' is of type 'unknown'`. `any` дозволяє все."
            en: "`unknown` forbids any use before a check: `TS18046: 'strict' is of type 'unknown'`. `any` allows everything."
        - id: two-and-three
          text:
            uk: "Рядки 2 і 3: без анотації `tsc` не знає, що повернув `JSON.parse`, і вимагає перевірки"
            en: "Lines 2 and 3: without an annotation `tsc` does not know what `JSON.parse` returned and demands a check"
          why:
            uk: "`JSON.parse` оголошено як такий, що повертає `any`, тож `plain` — теж `any`, і рядок 3 проходить без жодного питання."
            en: "`JSON.parse` is declared to return `any`, so `plain` is `any` too, and line 3 passes without a single question."
        - id: one-and-three
          text:
            uk: "Рядки 1 і 3: `tsc` знає, що в цих даних є `name`, а `any` і виведений тип цього не враховують"
            en: "Lines 1 and 3: `tsc` knows these data have a `name`, and `any` and the inferred type ignore that"
          why:
            uk: "`tsc` не читає вміст тексту: для нього `text` — просто `string`. Що буде в результаті розбору, стане відомо лише під час виконання."
            en: "`tsc` does not read the contents of the text: to it, `text` is just a `string`. What the parse produces is known only at runtime."
      correct: [only-2]
    explanation:
      uk: "Під час підготовки уроку `tsc` 7 повідомив лише рядок 2. Рядки 1 і 3 пройшли, бо обидва значення — `any`: і явне, і те, що непомітно прийшло з `JSON.parse`. Якщо в тексті виявиться не об’єкт, вони впадуть під час виконання."
      en: "When the lesson was prepared, `tsc` 7 reported only line 2. Lines 1 and 3 passed because both values are `any`: the explicit one and the one that quietly came from `JSON.parse`. If the text turns out not to hold an object, they crash at runtime."

  - id: any-crashes
    kind: example
    runtime: browser-js
    dir: any-crashes
    entry: index.ts
    expectError: true
    title:
      uk: "any пропускає, програма падає"
      en: "any lets it through, the program crashes"
    body:
      uk: "У сховищі лежить коректний JSON — `42`, — тільки це число, а не об’єкт. `tsc` цей файл пропускає без жодної помилки: `value` має тип `any`. Запусти."
      en: "Storage holds valid JSON — `42` — only it is a number, not an object. `tsc` lets this file through without a single error: `value` has the type `any`. Run it."
    tryIt:
      uk: |
        1. Перший рядок — `number`, а далі картка `TypeError: Cannot read properties of undefined (reading 'toUpperCase')`: у числа немає поля `name`.
        2. Заміни `any` на `unknown`. Пісочниця впаде так само — вона типів не перевіряє, — але `tsc` тепер не пропустив би файл: `TS18046: 'value' is of type 'unknown'`.
        3. Заміни останній рядок на перевірку, яку `tsc` розуміє:

           ```ts
           if (typeof value === "object" && value !== null && "name" in value && typeof value.name === "string") {
             console.log(value.name.toUpperCase());
           } else {
             console.log("not a wish");
           }
           ```

           Запусти: `number`, потім `not a wish`. Кожна частина умови відсіює одну можливість, і всередині гілки `tsc` знає, що `value.name` — текст.
      en: |
        1. The first line is `number`, and then the card `TypeError: Cannot read properties of undefined (reading 'toUpperCase')`: a number has no `name` field.
        2. Replace `any` with `unknown`. The sandbox crashes the same way — it does not check types — but `tsc` would now reject the file: `TS18046: 'value' is of type 'unknown'`.
        3. Replace the last line with a check `tsc` understands:

           ```ts
           if (typeof value === "object" && value !== null && "name" in value && typeof value.name === "string") {
             console.log(value.name.toUpperCase());
           } else {
             console.log("not a wish");
           }
           ```

           Run: `number`, then `not a wish`. Each part of the condition filters out one possibility, and inside the branch `tsc` knows `value.name` is text.
    limits:
      uk: "Пісочниця прибирає типи й виконує JavaScript, що лишився. Різницю між `any` і `unknown` бачить лише `tsc`; результати в кроках записано з TypeScript 7.0.2."
      en: "The sandbox removes the types and runs the JavaScript that remains. Only `tsc` sees the difference between `any` and `unknown`; the results in the steps were recorded with TypeScript 7.0.2."

  - id: type-predicates
    kind: explanation
    title:
      uk: "Перевірка, яку можна назвати: type predicate"
      en: "A check you can name: a type predicate"
    body:
      uk: |
        Довгу умову зручно винести у функцію. Але звичайна функція, що повертає `boolean`, нічого не каже `tsc` про аргумент. Для цього є [[type-predicate|type predicate]] — особливий тип результату:

        ```ts
        function isDateText(value: unknown): value is string {
          return typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value);
        }
        ```

        `value is string` означає: «якщо функція повернула `true`, то `value` — `string`». Після `if (isDateText(x))` тип `x` усередині гілки звужено.

        > [!warning]
        > Тіло такої функції `tsc` **не звіряє** з обіцянкою, як і `!`. Якщо перевірка неповна — скажімо, пропускає `null`, — `tsc` повірить і звузить тип хибно. Тому type predicate мусить бути точним, і його варто перевіряти тестами на межових значеннях.
      en: |
        A long condition is convenient to move into a function. But an ordinary function returning `boolean` tells `tsc` nothing about its argument. For that there is the [[type-predicate|type predicate]] — a special return type:

        ```ts
        function isDateText(value: unknown): value is string {
          return typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value);
        }
        ```

        `value is string` means: “if the function returned `true`, `value` is a `string`”. After `if (isDateText(x))` the type of `x` is narrowed inside the branch.

        > [!warning]
        > `tsc` does **not** compare the body of such a function with its promise, just as with `!`. If the check is incomplete — say, it lets `null` through — `tsc` believes it and narrows the type wrongly. So a type predicate must be exact, and it is worth testing it on boundary values.

  - id: recall-json
    kind: review
    title:
      uk: "Згадай: що дає JSON.parse"
      en: "Recall: what JSON.parse gives"
    items:
      - id: parse-results
        from: js-07-04-json
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          console.log(typeof JSON.parse("42"));
          console.log(JSON.parse("null"));
          console.log(Array.isArray(JSON.parse("[1, 2]")));
          try {
            JSON.parse("{name: 1}");
          } catch (error) {
            console.log(error.name);
          }
        verify:
          logs: ["number", "null", "true", "SyntaxError"]
        answer:
          type: choice
          options:
            - id: any-value
              code: "number\nnull\ntrue\nSyntaxError"
            - id: always-object
              code: "object\nnull\nfalse\nSyntaxError"
              why:
                uk: "`JSON.parse` повертає те, що записано в тексті: `42` — число, `[1, 2]` — масив. Об’єкт виходить лише з тексту в `{ }`."
                en: "`JSON.parse` returns what the text holds: `42` is a number, `[1, 2]` is an array. An object comes only from text in `{ }`."
            - id: lenient
              code: "number\nnull\ntrue\nundefined"
              why:
                uk: "У JSON назви полів беруть у подвійні лапки. `{name: 1}` — не JSON, і `JSON.parse` кидає `SyntaxError`, а не повертає `undefined`."
                en: "In JSON, field names are in double quotes. `{name: 1}` is not JSON, and `JSON.parse` throws a `SyntaxError` instead of returning `undefined`."
          correct: [any-value]
        explanation:
          uk: "Коректний JSON може бути числом, `null`, масивом, текстом — не лише об’єктом. Тому результат `JSON.parse` чесно описує саме `unknown`, а невдалий розбір ще й кидає помилку."
          en: "Valid JSON can be a number, `null`, an array, text — not only an object. That is why `unknown` honestly describes the result of `JSON.parse`, and a failed parse even throws an error."

  - id: record-like
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: record-like
    entry: index.ts
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      read: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
    title:
      uk: "isRecordLike і безпечне читання"
      en: "isRecordLike and a safe read"
    instructions:
      uk: |
        1. Допиши `isRecordLike(value: unknown): value is Record<string, unknown>`: `true` лише для звичайного об’єкта — не `null`, не масиву, не числа чи тексту.
        2. У `readHabitName` заміни `any` на `unknown` і поверни `name`, лише коли значення — об’єкт (перевір через `isRecordLike`) і його `name` — текст. Інакше — `null`.

        Усі тексти тут — коректний JSON, тож `JSON.parse` не кидає помилок. Перевірки викликають обидві функції з об’єктами, `null`, масивами, числами й текстом.
      en: |
        1. Finish `isRecordLike(value: unknown): value is Record<string, unknown>`: `true` only for a plain object — not `null`, not an array, not a number or text.
        2. In `readHabitName` replace `any` with `unknown` and return `name` only when the value is an object (check with `isRecordLike`) and its `name` is text. Otherwise return `null`.

        Every text here is valid JSON, so `JSON.parse` throws no errors. The checks call both functions with objects, `null`, arrays, numbers and text.
    testTitles:
      "isRecordLike is true for plain objects":
        uk: "`isRecordLike` дає `true` для звичайних об’єктів"
        en: "`isRecordLike` is `true` for plain objects"
      "isRecordLike is false for null, arrays and primitives":
        uk: "`isRecordLike` дає `false` для `null`, масивів і примітивів"
        en: "`isRecordLike` is `false` for `null`, arrays and primitives"
      "readHabitName returns the name only from an object with a text name":
        uk: "`readHabitName` повертає назву лише з об’єкта з текстовим `name`"
        en: "`readHabitName` returns the name only from an object with a text `name`"
      "readHabitName returns null for JSON that is not an object":
        uk: "`readHabitName` повертає `null` для JSON, що не є об’єктом"
        en: "`readHabitName` returns `null` for JSON that is not an object"
      "the program prints the name and then null twice":
        uk: "Програма виводить назву, а тоді двічі `null`"
        en: "The program prints the name and then `null` twice"
    hints:
      nudge:
        uk: "Згадай, що повертає `typeof null` і `typeof []`. Яких двох значень не відсіє сама перевірка `typeof value === \"object\"`?"
        en: "Remember what `typeof null` and `typeof []` return. Which two kinds of value does the check `typeof value === \"object\"` alone not filter out?"
      explanation:
        uk: "`typeof` дає `\"object\"` і для `null`, і для масивів — це давня особливість JavaScript. Тож до перевірки `typeof` треба додати ще дві умови: окремо для `null` і окремо для масиву (`Array.isArray`). Пам’ятай: `tsc` тіло type predicate не перевіряє, тож неповна умова пройде компіляцію й підведе вже під час виконання. Після `isRecordLike(value)` поле `value.name` має тип `unknown`, тож перед поверненням перевір і його тип."
        en: "`typeof` gives `\"object\"` both for `null` and for arrays — an old quirk of JavaScript. So two more conditions go next to the `typeof` check: one for `null` and one for an array (`Array.isArray`). Remember: `tsc` does not check the body of a type predicate, so an incomplete condition compiles and fails only at runtime. After `isRecordLike(value)` the field `value.name` has the type `unknown`, so check its type before returning it too."
    solutionNote:
      uk: "`typeof value === \"object\" && value !== null && !Array.isArray(value)` відсіює все, крім звичайних об’єктів. Після `isRecordLike(value)` `tsc` знає, що це `Record<string, unknown>`: читати `value.name` можна, але це ще `unknown`, тож потрібна друга перевірка, `typeof value.name === \"string\"`. Версія лише з `typeof value === \"object\"` теж компілюється — тіло predicate ніхто не звіряє, — але пропускає `null` і масиви."
      en: "`typeof value === \"object\" && value !== null && !Array.isArray(value)` filters out everything except plain objects. After `isRecordLike(value)`, `tsc` knows it is a `Record<string, unknown>`: reading `value.name` is allowed, but it is still `unknown`, so a second check, `typeof value.name === \"string\"`, is needed. A version with only `typeof value === \"object\"` compiles too — nobody compares the predicate’s body — but it lets `null` and arrays through."
    feedback:
      - when: { test: "isRecordLike is false for null, arrays and primitives" }
        message:
          uk: "Ця перевірка чекає `false` для `null`, масиву, тексту, числа й `undefined`. `typeof` дає `\"object\"` і для `null`, і для масиву — для них потрібні окремі умови."
          en: "This check expects `false` for `null`, an array, text, a number and `undefined`. `typeof` gives `\"object\"` for both `null` and an array — they need separate conditions."
      - when: { test: "readHabitName returns the name only from an object with a text name" }
        message:
          uk: "Ця перевірка чекає назву для об’єкта з текстовим `name` і `null`, коли `name` — число або його немає. Після `isRecordLike` перевір ще й `typeof` самого поля."
          en: "This check expects the name for an object with a text `name`, and `null` when `name` is a number or missing. After `isRecordLike`, also check the `typeof` of the field itself."
      - when: { error: TypeError }
        message:
          uk: "`TypeError: Cannot read properties of null` — поле читали з `null`. Якщо всі перевірки кажуть «… is not a function», програма впала ще під час завантаження: один із трьох викликів унизу файлу отримав не об’єкт."
          en: "`TypeError: Cannot read properties of null` — a field was read from `null`. If every check says “… is not a function”, the program crashed while loading: one of the three calls at the bottom of the file got something that is not an object."
    limits:
      uk: "Пісочниця прибирає типи й виконує JavaScript, що лишився. Що `unknown` вимагає перевірки, показує лише `tsc` у твоїй теці `ts-lab`."
      en: "The sandbox removes the types and runs the JavaScript that remains. Only `tsc` in your `ts-lab` folder shows that `unknown` demands a check."

  - id: check-unknown
    kind: local-task
    runtime: local-web
    title:
      uk: "any і unknown у tsc"
      en: "any and unknown in tsc"
    intro:
      uk: "Працюєш у теці `ts-lab`. Результати записано з TypeScript 7.0.2 у macOS."
      en: "You work in the `ts-lab` folder. The results were recorded with TypeScript 7.0.2 on macOS."
    tools:
      - { name: "TypeScript", version: "7.x", note: { uk: "у теці `ts-lab`", en: "in the `ts-lab` folder" } }
    steps:
      - text:
          uk: "Створи `src/l06/index.ts` з **початковим** кодом вправи «isRecordLike і безпечне читання» і перевір."
          en: "Create `src/l06/index.ts` with the **starting** code of the exercise “isRecordLike and a safe read” and check."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого не виведено — хоча цей код падає вже на третьому виклику. З `any` `tsc` нічого не перевіряє."
          en: "Nothing is printed — although this code crashes already on the third call. With `any`, `tsc` checks nothing."
      - text:
          uk: "Заміни лише `const value: any` на `const value: unknown`."
          en: "Replace only `const value: any` with `const value: unknown`."
        command: "npx tsc --noEmit"
        expect:
          uk: "`error TS18046: 'value' is of type 'unknown'.` — підкреслено `value` у `return value.name;`. Тепер `tsc` вимагає перевірки."
          en: "`error TS18046: 'value' is of type 'unknown'.` — `value` in `return value.name;` is underlined. Now `tsc` demands a check."
      - text:
          uk: "Заміни вміст файлу своїм розв’язком і перевір."
          en: "Replace the file’s contents with your solution and check."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого не виведено."
          en: "Nothing is printed."
      - text:
          uk: "Тепер зіпсуй predicate: заміни тіло `isRecordLike` на `return typeof value === \"object\";`."
          en: "Now break the predicate: replace the body of `isRecordLike` with `return typeof value === \"object\";`."
        command: "npx tsc --noEmit"
        expect:
          uk: "Знову нічого не виведено: тіло type predicate `tsc` не звіряє з обіцянкою. Цю помилку ловлять лише перевірки з `null` і масивами — як у вправі. Поверни свій варіант."
          en: "Again nothing is printed: `tsc` does not compare a type predicate’s body with its promise. Only the checks with `null` and arrays catch this mistake — as in the exercise. Put your version back."
    verify:
      - id: any-silent
        text:
          uk: "З `any` `tsc` мовчав, а з `unknown` повідомив `TS18046`."
          en: "With `any`, `tsc` was silent, and with `unknown` it reported `TS18046`."
      - id: predicate-unchecked
        text:
          uk: "Я бачив, що неповний type predicate компілюється без помилок."
          en: "I saw that an incomplete type predicate compiles without errors."
    troubleshooting:
      - problem:
          uk: "`Cannot find name 'Record'`"
          en: "`Cannot find name 'Record'`"
        fix:
          uk: "`Record` — вбудований тип TypeScript; він зникає, якщо зламано `lib`. Перевір у `tsconfig.json` рядок `\"lib\": [\"es2023\", \"dom\"]`."
          en: "`Record` is a built-in TypeScript type; it disappears if `lib` is broken. Check the line `\"lib\": [\"es2023\", \"dom\"]` in `tsconfig.json`."
