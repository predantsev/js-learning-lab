    body:
      uk: "У кроці проєкту значення з `localStorage` твого домену (`jsll.wishlist.v1` чи інший ключ) після `JSON.parse` матиме тип `unknown`. Перш ніж читати `records`, його перевіряє `isRecordLike` — а наступні уроки перетворять ці перевірки на повну валідацію запису."
      en: "In the project step the value from your domain’s `localStorage` key (`jsll.wishlist.v1` or another) has the type `unknown` after `JSON.parse`. Before `records` is read, `isRecordLike` checks it — and the next lessons turn these checks into full validation of a record."
