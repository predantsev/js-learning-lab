id: js-14-10-independent-typed-model
unit: JS-14
title:
  uk: "Самостійно: типізований домен, generic-хелпер і перевірка JSON"
  en: "Independent: typed domain, generic helper, JSON validation"
kind: assessment
minutes: 30
contentVersion: 1
purpose:
  uk: "Перевірити без підказок, що ти вмієш поєднати все з цього розділу на новому домені: описати модель типами, написати generic-хелпер, розкласти код на модулі з type-only імпортами й перевіряти дані ззовні під час виконання, а не приведенням типу. А також пояснити, яку гарантію дає `tsc`, а яку — перевірка."
  en: "To check without hints that you can combine everything in this unit on a new domain: describe a model with types, write a generic helper, split code into modules with type-only imports and validate outside data at runtime rather than with a type assertion. And to explain which guarantee comes from `tsc` and which from validation."
objectives:
  - uk: "Без підказок реалізувати типізовану модель для нового синтетичного запису, generic-хелпер і перевірку JSON під час виконання, що проходять строгий `tsc` і приховані перевірки."
    en: "Implement, without hints, a typed model for an unseen synthetic record, a generic helper and a runtime JSON validator that pass strict `tsc` and hidden checks."
  - uk: "Пояснити, які гарантії розв’язку дають типи, а які — перевірки під час виконання."
    en: "Justify which guarantees in the solution come from the types and which from runtime checks."
prerequisites: [js-14-09-debug-type-errors]
subskills:
  - { family: P-03, skill: "type annotations/inference", depth: assess }
  - { family: P-03, skill: "models/interfaces/type aliases", depth: assess }
  - { family: P-03, skill: "functions/generics", depth: assess }
  - { family: P-03, skill: "modules/type-only imports", depth: assess }
  - { family: P-03, skill: "runtime validation distinction", depth: assess }
glossary: []
selfCheck: [recipes]

blocks:
  - id: the-domain
    kind: explanation
    title:
      uk: "Новий домен: рецепти"
      en: "A new domain: recipes"
    body:
      uk: |
        Цього разу записи — рецепти. Кожен рецепт має такі поля:

        | Поле | Що в ньому |
        |---|---|
        | `id` | непорожній текст, не змінюється |
        | `title` | текст, не порожній після обрізання пробілів |
        | `servings` | кількість порцій — ціле число, більше за 0 |
        | `tags` | масив текстів (може бути порожнім) |
        | `rating` | `null` або ціле число від 1 до 5 |
        | `course` | `"main"` або `"dessert"` |

        Рецепти зберігаються текстом JSON — і, як завжди зі збереженими даними, текст може бути зіпсованим.
      en: |
        This time the records are recipes. Each recipe has these fields:

        | Field | What it holds |
        |---|---|
        | `id` | non-empty text that does not change |
        | `title` | text, not empty after trimming spaces |
        | `servings` | the number of portions — a whole number greater than 0 |
        | `tags` | an array of texts (may be empty) |
        | `rating` | `null` or a whole number from 1 to 5 |
        | `course` | `"main"` or `"dessert"` |

        Recipes are stored as JSON text — and, as always with stored data, the text may be damaged.

  - id: recall-fixtures
    kind: review
    title:
      uk: "Згадай: детерміновані фікстури"
      en: "Recall: deterministic fixtures"
    items:
      - id: fresh-fixtures
        from: js-09-04-deterministic-fixtures
        prompt:
          uk: "Перевірка функції розбору рецептів спершу додає до спільного масиву `fixtures` зіпсований запис, а наступна перевірка використовує той самий масив як «правильні дані». Що з цього правда?"
          en: "A check of the recipe parser first adds a damaged record to a shared `fixtures` array, and the next check uses the same array as “valid data”. Which of these is true?"
        answer:
          type: choice
          options:
            - id: order
              text:
                uk: "Результат другої перевірки залежить від того, чи запускали першу: кожна перевірка має будувати свої свіжі фікстури"
                en: "The second check’s result depends on whether the first one ran: every check should build its own fresh fixtures"
            - id: fine
              text:
                uk: "Нічого страшного: перевірки завжди виконуються в тому самому порядку"
                en: "No problem: checks always run in the same order"
              why:
                uk: "Навіть за сталого порядку друга перевірка тепер перевіряє інші дані, ніж написано в ній. Варто переставити, пропустити чи запустити одну перевірку — і результат зміниться."
                en: "Even with a fixed order, the second check now tests different data from what it says. Reorder, skip or run one check alone — and the result changes."
            - id: types
              text:
                uk: "TypeScript не дасть змінити спільний масив, бо він має тип `Recipe[]`"
                en: "TypeScript will not let the shared array change, because it has the type `Recipe[]`"
              why:
                uk: "Тип `Recipe[]` нічого не заморожує й не забороняє `push`. Лише `readonly Recipe[]` заборонив би зміну — і то тільки для `tsc`, не під час виконання."
                en: "The type `Recipe[]` freezes nothing and does not forbid `push`. Only `readonly Recipe[]` would forbid the change — and only for `tsc`, not at runtime."
          correct: [order]
        explanation:
          uk: "Свіжі синтетичні дані в кожній перевірці роблять результат незалежним від порядку. Приховані перевірки цього завдання саме так і побудовані: кожна створює свої рецепти."
          en: "Fresh synthetic data in every check makes the result independent of order. The hidden checks of this task are built exactly that way: each creates its own recipes."

  - id: recipes
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: recipes
    entry: index.ts
    editable: [domain/recipe.ts, domain/helpers.ts, domain/parse.ts, ui/render.ts]
    strings:
      stew: { uk: "Овочеве рагу", en: "Vegetable stew" }
      vegetables: { uk: "овочі", en: "vegetables" }
      pie: { uk: "Яблучний пиріг", en: "Apple pie" }
      pancakes: { uk: "Сирники", en: "Cottage cheese pancakes" }
      breakfast: { uk: "сніданок", en: "breakfast" }
    title:
      uk: "Рецепти: модель, хелпер, перевірка"
      en: "Recipes: model, helper, validation"
    instructions:
      uk: |
        Заповни чотири модулі; `index.ts` уже користується ними й змінювати його не можна.

        1. `domain/recipe.ts` — типи `Course` і `Recipe` за таблицею вище.
        2. `domain/helpers.ts` — generic `indexById`: приймає масив будь-яких записів з текстовим `id` і повертає `Map` від `id` до запису (якщо `id` повторюється, лишається перший). Тип записів у результаті не губиться.
        3. `domain/parse.ts` — `parseRecipes(text: string): ParseResult`:
           - не JSON → `{ ok: false, errors: ["invalid-json"] }`, без винятку;
           - не масив → `{ ok: false, errors: ["not-an-array"] }`;
           - для кожного запису й кожного неправильного поля — помилка `"<індекс>.<поле>"` (`"2.rating"`); запис, що не є об’єктом, — `"<індекс>.record"`; правильний запис з `id`, який уже був, — `"<індекс>.duplicate-id"`;
           - без помилок → `{ ok: true, value: [...] }`.
        4. `ui/render.ts` — `renderRecipe(recipe: Recipe)` повертає `"<назва> (<course>, <servings>)"`, наприклад `"Яблучний пиріг (dessert, 8)"`.

        Умови: строгий `tsc` без помилок, жодного `as`, `!` чи `any`; модулі беруть одне в одного лише типи — через `import type`. Приховані перевірки викликають усі функції зі своїми записами, зокрема зіпсованими. Порядок помилок у списку не важить.
      en: |
        Fill in four modules; `index.ts` already uses them and cannot be changed.

        1. `domain/recipe.ts` — the types `Course` and `Recipe` from the table above.
        2. `domain/helpers.ts` — a generic `indexById`: it takes an array of any records with a text `id` and returns a `Map` from `id` to the record (if an `id` repeats, the first one stays). The record type is not lost in the result.
        3. `domain/parse.ts` — `parseRecipes(text: string): ParseResult`:
           - not JSON → `{ ok: false, errors: ["invalid-json"] }`, without an exception;
           - not an array → `{ ok: false, errors: ["not-an-array"] }`;
           - for every record and every wrong field, an error `"<index>.<field>"` (`"2.rating"`); a record that is not an object gives `"<index>.record"`; a valid record whose `id` already appeared gives `"<index>.duplicate-id"`;
           - no errors → `{ ok: true, value: [...] }`.
        4. `ui/render.ts` — `renderRecipe(recipe: Recipe)` returns `"<title> (<course>, <servings>)"`, for example `"Apple pie (dessert, 8)"`.

        Conditions: strict `tsc` without errors, no `as`, `!` or `any`; modules take only types from each other — with `import type`. Hidden checks call every function with their own records, damaged ones included. The order of errors in the list does not matter.
    testTitles:
      "indexById maps every id to its item, for any item type":
        uk: "`indexById` зіставляє кожен `id` із записом, для будь-якого типу записів"
        en: "`indexById` maps every `id` to its item, for any item type"
      "indexById keeps the first item when an id repeats":
        uk: "`indexById` лишає перший запис, коли `id` повторюється"
        en: "`indexById` keeps the first item when an `id` repeats"
      "parseRecipes accepts valid recipes, including a null rating and empty tags":
        uk: "`parseRecipes` приймає правильні рецепти, зокрема з `rating: null` і порожніми `tags`"
        en: "`parseRecipes` accepts valid recipes, including a `null` rating and empty `tags`"
      "parseRecipes reports broken JSON and a non-array without throwing":
        uk: "`parseRecipes` повідомляє про зламаний JSON і не-масив без винятку"
        en: "`parseRecipes` reports broken JSON and a non-array without throwing"
      "servings must be a positive whole number":
        uk: "`servings` — додатне ціле число"
        en: "`servings` must be a positive whole number"
      "rating is null or a whole number from 1 to 5":
        uk: "`rating` — `null` або ціле число від 1 до 5"
        en: "`rating` is `null` or a whole number from 1 to 5"
      "tags are a list of text and course is main or dessert":
        uk: "`tags` — список текстів, `course` — `main` або `dessert`"
        en: "`tags` are a list of text, `course` is `main` or `dessert`"
      "title and id are required, and a non-object record is reported":
        uk: "`title` і `id` обов’язкові, а запис-не-об’єкт дає помилку"
        en: "`title` and `id` are required, and a non-object record is reported"
      "a repeated id is reported at the later record":
        uk: "Повторний `id` дає помилку на пізнішому записі"
        en: "A repeated `id` is reported at the later record"
      "renderRecipe shows the title, the course and the servings":
        uk: "`renderRecipe` показує назву, `course` і кількість порцій"
        en: "`renderRecipe` shows the title, the course and the servings"
      "the program prints the pie and the errors of the damaged record":
        uk: "Програма виводить пиріг і помилки зіпсованого запису"
        en: "The program prints the pie and the errors of the damaged record"
    solutionNote:
      uk: "`Recipe` описує форму, `Course` і `1 | 2 | 3 | 4 | 5` — дозволені значення, `indexById<T extends { id: string }>` повертає `Map<string, T>`, тож `byId.get(\"r-02\")` — це `Recipe | undefined`. `parseRecipes` отримує текст як `unknown` і звужує його справжніми перевірками — `try … catch`, `Array.isArray`, `typeof`, `Number.isInteger`, перевірку кожного тегу, порівняння з дозволеними значеннями й `Set` для повторів. Перевірка рейтингу через `>= 1 && <= 5` або масиву через лише `Array.isArray` теж компілюється, але пропускає `3.5` чи тег-число: `tsc` не звіряє тіло перевірки з типом."
      en: "`Recipe` describes the shape, `Course` and `1 | 2 | 3 | 4 | 5` the allowed values, `indexById<T extends { id: string }>` returns `Map<string, T>`, so `byId.get(\"r-02\")` is `Recipe | undefined`. `parseRecipes` takes the text as `unknown` and narrows it with real checks — `try … catch`, `Array.isArray`, `typeof`, `Number.isInteger`, a check of every tag, comparison with the allowed values and a `Set` for repeats. A rating check with `>= 1 && <= 5`, or an array check with `Array.isArray` alone, compiles too but lets `3.5` or a number tag through: `tsc` does not compare a check’s body with the type."
    feedback:
      - when: { test: "indexById keeps the first item when an id repeats" }
        message:
          uk: "Ця перевірка передає два записи з однаковим `id` і чекає в `Map` один ключ із **першим** записом. `new Map(…)` з парами, як і `set` для кожного запису, лишає останній: наступний `set` з тим самим ключем замінює значення."
          en: "This check passes two items with the same `id` and expects one key in the `Map`, holding the **first** item. `new Map(…)` from pairs, like `set` for every item, keeps the last one: a later `set` with the same key replaces the value."
      - when: { test: "rating is null or a whole number from 1 to 5" }
        message:
          uk: "Ця перевірка чекає помилку `rating` для `6`, `0` і `3.5` і жодної для `1` та `5`. Порівняння `>= 1 && <= 5` пропускає дробові числа."
          en: "This check expects a `rating` error for `6`, `0` and `3.5` and none for `1` and `5`. A comparison `>= 1 && <= 5` lets fractions through."
      - when: { test: "a repeated id is reported at the later record" }
        message:
          uk: "Ця перевірка передає два правильні рецепти з однаковим `id` і чекає лише `1.duplicate-id`."
          en: "This check passes two valid recipes with the same `id` and expects only `1.duplicate-id`."
      - when: { test: "servings must be a positive whole number" }
        message:
          uk: "Ця перевірка чекає помилку `servings` для `0`, `2.5` і тексту `\"4\"`."
          en: "This check expects a `servings` error for `0`, `2.5` and the text `\"4\"`."
      - when: { test: "parseRecipes reports broken JSON and a non-array without throwing" }
        message:
          uk: "Ця перевірка чекає `invalid-json` для обірваного тексту без винятку й `not-an-array` для одного об’єкта."
          en: "This check expects `invalid-json` for a cut-off text without an exception, and `not-an-array` for a single object."
    limits:
      uk: "Пісочниця прибирає типи й виконує JavaScript, що лишився. Строгий `tsc`, відсутність `as`/`!`/`any` і `import type` перевіряєш ти — у локальному завданні нижче."
      en: "The sandbox removes the types and runs the JavaScript that remains. You check strict `tsc`, the absence of `as`/`!`/`any` and `import type` yourself — in the local task below."

  - id: which-guarantee
    kind: prediction
    prompt:
      uk: "Модуль рецептів із функціями `parseRecipes(text: string)` і `renderRecipe(recipe: Recipe)` проходить строгий `tsc` без `as`, `!` і `any`, а `parseRecipes` перевіряє кожне поле під час виконання. Які з цих гарантій дає саме `tsc`, а не перевірки в `parseRecipes`?"
      en: "A recipe module with the functions `parseRecipes(text: string)` and `renderRecipe(recipe: Recipe)` passes strict `tsc` without `as`, `!` and `any`, and `parseRecipes` checks every field at runtime. Which of these guarantees come from `tsc` itself, not from the checks in `parseRecipes`?"
    answer:
      type: multi
      options:
        - { id: no-unchecked-read, text: { uk: "Код ніде не читає поле `unknown`-значення, не звузивши його тип", en: "The code nowhere reads a field of an `unknown` value without narrowing its type" } }
        - { id: render-gets-recipe, text: { uk: "`renderRecipe` викликають лише з тим, що має форму `Recipe`", en: "`renderRecipe` is only called with something that has the `Recipe` shape" } }
        - id: servings-positive
          text: { uk: "У рецепті, який повернула `parseRecipes`, `servings` справді більше за 0", en: "In a recipe returned by `parseRecipes`, `servings` really is greater than 0" }
          why:
            uk: "Для `tsc` `servings` — просто `number`; від’ємне число він пропустив би. Що число додатне й ціле, гарантує лише перевірка під час виконання."
            en: "To `tsc`, `servings` is just a `number`; it would let a negative one through. Only the runtime check guarantees the number is positive and whole."
        - id: stored-valid
          text: { uk: "Текст у сховищі завжди містить правильні рецепти", en: "The text in storage always holds valid recipes" }
          why:
            uk: "Цього не гарантує ніхто: `tsc` тексту не бачить, а перевірка не робить дані правильними — лише відкидає неправильні з поясненням."
            en: "Nobody guarantees that: `tsc` does not see the text, and validation does not make data valid — it only rejects bad data with an explanation."
      correct: [no-unchecked-read, render-gets-recipe]
    explanation:
      uk: "`tsc` гарантує властивості **коду**: усі використання узгоджені з типами, і `unknown` не прочитано без звуження. Властивості **даних** — додатні порції, рейтинг від 1 до 5, унікальні `id` — гарантує лише код перевірки, що працює під час виконання."
      en: "`tsc` guarantees properties of the **code**: every use agrees with the types, and no `unknown` is read without narrowing. Properties of the **data** — positive servings, a rating from 1 to 5, unique `id`s — are guaranteed only by the validation code that runs at runtime."

  - id: why-import-type
    kind: prediction
    prompt:
      uk: "Модуль `ui/render.ts` бере з `domain/recipe.ts` лише тип `Recipe`. Чому його імпортують через `import type`, а не звичайним імпортом?"
      en: "The module `ui/render.ts` takes only the type `Recipe` from `domain/recipe.ts`. Why is it imported with `import type` and not with an ordinary import?"
    answer:
      type: choice
      options:
        - id: no-runtime-dependency
          text:
            uk: "Йому потрібен лише тип: такий імпорт зникає після компіляції й не додає залежності `ui → domain` під час виконання (а з `verbatimModuleSyntax` звичайний імпорт типу — помилка `TS1484`)"
            en: "It needs only the type: such an import disappears after compiling and adds no `ui → domain` dependency at runtime (and with `verbatimModuleSyntax` an ordinary import of a type is error `TS1484`)"
        - id: faster-check
          text:
            uk: "Щоб `tsc` перевіряв `Recipe` швидше"
            en: "So that `tsc` checks `Recipe` faster"
          why:
            uk: "Для перевірки типів обидва імпорти однакові. Різниця — у JavaScript після компіляції: type-only імпорт зникає."
            en: "For type checking both imports are the same. The difference is in the JavaScript after compiling: a type-only import disappears."
        - id: validates
          text:
            uk: "Щоб під час виконання кожен рецепт, переданий у `renderRecipe`, перевірявся на форму `Recipe`"
            en: "So that at runtime every recipe passed to `renderRecipe` is checked against the `Recipe` shape"
          why:
            uk: "Жоден імпорт типу нічого не перевіряє під час виконання: типи стерто. Перевіряє лише код на кшталт `parseRecipes`."
            en: "No type import checks anything at runtime: the types are erased. Only code like `parseRecipes` checks."
      correct: [no-runtime-dependency]
    explanation:
      uk: "Type-only імпорт — це домовленість лише для `tsc`. У браузері `ui/render.js` не завантажує `domain/recipe.js` зовсім."
      en: "A type-only import is an agreement for `tsc` only. In the browser `ui/render.js` does not load `domain/recipe.js` at all."

  - id: check-recipes
    kind: local-task
    runtime: local-web
    title:
      uk: "Строгий tsc для рецептів"
      en: "Strict tsc for the recipes"
    intro:
      uk: "Працюєш у теці `ts-lab`. Перевірено з TypeScript 7.0.2 у macOS на розв’язку, підготовленому разом з уроком."
      en: "You work in the `ts-lab` folder. Checked with TypeScript 7.0.2 on macOS on the solution prepared with the lesson."
    tools:
      - { name: "TypeScript", version: "7.x", note: { uk: "у теці `ts-lab`", en: "in the `ts-lab` folder" } }
    steps:
      - text:
          uk: "Створи в `src/l10/` п’ять файлів свого розв’язку з тією самою структурою тек: `index.ts`, `domain/recipe.ts`, `domain/helpers.ts`, `domain/parse.ts`, `ui/render.ts`. Перевір."
          en: "Create the five files of your solution in `src/l10/` with the same folder structure: `index.ts`, `domain/recipe.ts`, `domain/helpers.ts`, `domain/parse.ts`, `ui/render.ts`. Check."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого не виведено."
          en: "Nothing is printed."
      - text:
          uk: "Пошукай у теці `src/l10` заборонені місця (у VS Code — **Edit → Find in Files**, Cmd+Shift+F / Ctrl+Shift+F): ` as `, `any` і `!.`."
          en: "Search the `src/l10` folder for forbidden spots (in VS Code, **Edit → Find in Files**, Cmd+Shift+F / Ctrl+Shift+F): ` as `, `any` and `!.`."
        expect:
          uk: "Жодного збігу в коді (збіг у коментарі чи тексті не рахується)."
          en: "No match in the code (a match in a comment or a text does not count)."
      - text:
          uk: "Створи JavaScript і відкрий `out/l10/ui/render.js`."
          en: "Produce the JavaScript and open `out/l10/ui/render.js`."
        command: "npx tsc"
        expect:
          uk: "Файл починається одразу з `export function renderRecipe(recipe) {` — імпорту з `domain` у ньому немає. Якщо там є `import {} from \"../domain/recipe.js\";`, у `ui/render.ts` написано `import { type Recipe }`: заміни на `import type { Recipe }`."
          en: "The file starts right with `export function renderRecipe(recipe) {` — there is no import from `domain` in it. If it has `import {} from \"../domain/recipe.js\";`, `ui/render.ts` says `import { type Recipe }`: change it to `import type { Recipe }`."
    verify:
      - id: strict-clean
        text:
          uk: "Мій розв’язок проходить строгий `tsc` без помилок."
          en: "My solution passes strict `tsc` without errors."
      - id: no-silencers
        text:
          uk: "У моєму коді немає `as`, `!` і `any`."
          en: "My code has no `as`, `!` and `any`."
      - id: type-only
        text:
          uk: "У створеному `ui/render.js` немає імпорту з `domain`."
          en: "The produced `ui/render.js` has no import from `domain`."
    troubleshooting:
      - problem:
          uk: "`error TS2322: Type 'number | null' is not assignable to type 'Rating | null'.` (назва типу — твоя) або схоже для `course`"
          en: "`error TS2322: Type 'number | null' is not assignable to type 'Rating | null'.` (with your type’s name) or similar for `course`"
        fix:
          uk: "Перевірка `typeof rating === \"number\"` звужує лише до `number`. Щоб `tsc` знав про `1 | 2 | 3 | 4 | 5`, перевірка має порівнювати з кожним дозволеним значенням — або бути type predicate з такою точною умовою."
          en: "The check `typeof rating === \"number\"` narrows only to `number`. For `tsc` to know about `1 | 2 | 3 | 4 | 5`, the check must compare with every allowed value — or be a type predicate with such an exact condition."
    recovery:
      uk: "Розв’язок зберігається в платформі; теку `src/l10` можна видалити й скопіювати файли знову."
      en: "The solution is kept in the platform; you can delete `src/l10` and copy the files again."
