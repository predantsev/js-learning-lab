    body:
      uk: "Коли переводитимеш доменний модуль проєкту на TypeScript, `tsc` покаже частину проблем одразу. Решту шукай там, де код вимикає перевірку: кожен `as`, `!` і `any` у проєкті — кандидат на заміну справжньою перевіркою, а збережені дані перевір на зіпсованих записах, як у цій вправі."
      en: "When you convert your project’s domain module to TypeScript, `tsc` shows part of the problems right away. Look for the rest where code switches checking off: every `as`, `!` and `any` in the project is a candidate for a real check, and test the stored data with damaged records, as in this exercise."
