id: js-14-02-modeling-domain-types
unit: JS-14
title:
  uk: "Моделюємо домен: interface і type alias"
  en: "Modeling the domain: interfaces and aliases"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Описати запис домену через `interface` або `type` з обов’язковими, необов’язковими й `readonly`-полями."
    en: "Model a domain record as an interface or a type alias with required, optional and readonly fields."
  - uk: "Пояснити, чому `tsc` приймає будь-який об’єкт потрібної форми (структурна типізація), і передбачити, коли з’явиться помилка про зайве поле."
    en: "Explain why `tsc` accepts any object with a matching shape (structural typing) and predict when an excess-property error appears."
prerequisites: [js-14-01-annotations-inference, js-04-05-objects-properties]
subskills:
  - { family: P-03, skill: "models/interfaces/type aliases", depth: intro }
glossary: [interface-declaration, type-alias, structural-typing, optional-property, readonly-property]
selfCheck: [predict-accepted, task-store]

blocks:
  - id: describe-a-record
    kind: explanation
    title:
      uk: "Форма запису"
      en: "The shape of a record"
    body:
      uk: |
        Бажання в проєкті — це об’єкт з однаковими полями. TypeScript дає змогу описати цю форму один раз і назвати її:

        ```ts
        interface Wish {
          readonly id: string;
          name: string;
          price: number | null;
          category?: string;
        }
        ```

        - [[interface-declaration|`interface`]] описує, які поля має об’єкт і якого вони типу.
        - `number | null` — «число **або** `null`»: ціни може не бути. Детально про такі [[union-type|union-типи]] — у наступному уроці.
        - `category?:` — [[optional-property|необов’язкове поле]]: його можна не писати зовсім.
        - `readonly id` — [[readonly-property|поле лише для читання]]: `tsc` не дасть присвоїти `wish.id = …`.

        Ту саму форму можна записати як [[type-alias|type alias]] — назву для будь-якого типу: `type Wish = { … }`. Для записів домену обидва способи рівноцінні; `type` ще вміє назвати й не-об’єкт, наприклад `type WishId = string`.
      en: |
        A wish in the project is an object with the same fields every time. TypeScript lets you describe that shape once and name it:

        ```ts
        interface Wish {
          readonly id: string;
          name: string;
          price: number | null;
          category?: string;
        }
        ```

        - [[interface-declaration|`interface`]] describes which fields an object has and of which type.
        - `number | null` means “a number **or** `null`”: there may be no price. More about such [[union-type|union types]] in the next lesson.
        - `category?:` is an [[optional-property|optional property]]: you may leave it out entirely.
        - `readonly id` is a [[readonly-property|read-only property]]: `tsc` will not allow `wish.id = …`.

        The same shape can be written as a [[type-alias|type alias]] — a name for any type: `type Wish = { … }`. For domain records the two ways are equivalent; `type` can also name something that is not an object, for example `type WishId = string`.

  - id: shapes-not-names
    kind: explanation
    title:
      uk: "Важить форма, а не назва"
      en: "The shape matters, not the name"
    body:
      uk: |
        `tsc` порівнює **форму**: об’єкт підходить до `Wish`, якщо має всі обов’язкові поля потрібних типів. Як називається тип, з яким об’єкт створили, і чи називався він узагалі, — неважливо. Це [[structural-typing|структурна типізація]].

        Один виняток: коли ти пишеш об’єкт-літерал `{ … }` **прямо там**, де чекають `Wish`, `tsc` ще й шукає зайві поля — найчастіше це описка в назві. Той самий об’єкт, спершу записаний у змінну, перевіряють лише на потрібні поля.

        І головне: `interface` і `type` існують **лише для `tsc`**. Після компіляції від них не лишається нічого — ні об’єкта, ні класу, ні функції.
      en: |
        `tsc` compares **shapes**: an object fits `Wish` if it has all required fields of the right types. Which type the object was created with, or whether it had a named type at all, does not matter. This is [[structural-typing|structural typing]].

        One exception: when you write an object literal `{ … }` **right where** a `Wish` is expected, `tsc` also looks for extra fields — most often that is a misspelled name. The same object, first stored in a variable, is checked only for the required fields.

        And most important: `interface` and `type` exist **for `tsc` only**. After compiling nothing is left of them — no object, no class, no function.

  - id: predict-accepted
    kind: prediction
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      home: { uk: "Дім", en: "Home" }
      bike: { uk: "Велосипед", en: "Bicycle" }
      sport: { uk: "Спорт", en: "Sport" }
      red: { uk: "червоний", en: "red" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      june: { uk: "червень", en: "June" }
    prompt:
      uk: "Тут `category` — обов’язкове поле. Які з чотирьох присвоєнь `tsc` пропустить без помилки?"
      en: "Here `category` is a required field. Which of the four assignments does `tsc` let through without an error?"
    code: |
      interface Wish {
        readonly id: string;
        name: string;
        price: number | null;
        acquired: boolean;
        category: string | null;
      }

      const a: Wish = { id: "w-01", name: "%%headphones%%", price: 80, acquired: false };
      const b: Wish = { id: "w-02", name: "%%lamp%%", price: "45", acquired: false, category: "%%home%%" };
      const c: Wish = { id: "w-03", name: "%%bike%%", price: 240, acquired: false, category: "%%sport%%", note: "%%red%%" };
      const draft = { id: "w-05", name: "%%tickets%%", price: null, acquired: false, category: null, note: "%%june%%" };
      const d: Wish = draft;
    lang: ts
    runnable: false
    answer:
      type: choice
      options:
        - id: only-d
          text:
            uk: "Лише `d`"
            en: "Only `d`"
        - id: a-and-d
          text:
            uk: "`a` і `d`: поле, яке не вказали, просто буде порожнім"
            en: "`a` and `d`: a field you leave out is simply empty"
          why:
            uk: "Пропустити можна лише поле з `?`. `category: string | null` обов’язкове: значення може бути `null`, але саме поле мусить бути. `tsc` повідомляє `TS2741: Property 'category' is missing …`."
            en: "Only a field with `?` may be left out. `category: string | null` is required: the value may be `null`, but the field itself must be there. `tsc` reports `TS2741: Property 'category' is missing …`."
        - id: c-and-d
          text:
            uk: "`c` і `d`: зайві поля нікому не заважають"
            en: "`c` and `d`: extra fields bother nobody"
          why:
            uk: "Для літерала, записаного прямо в місці з типом `Wish`, `tsc` шукає зайві поля: `TS2353: Object literal may only specify known properties, and 'note' does not exist in type 'Wish'`. Для `d` об’єкт прийшов зі змінної, і цієї перевірки немає."
            en: "For a literal written right where a `Wish` is expected, `tsc` looks for extra fields: `TS2353: Object literal may only specify known properties, and 'note' does not exist in type 'Wish'`. For `d` the object came from a variable, and that check does not happen."
        - id: none
          text:
            uk: "Жодного: у `d` теж є зайве поле `note`, а `draft` узагалі не оголошено як `Wish`"
            en: "None: `d` has the extra field `note` too, and `draft` was never declared as a `Wish`"
          why:
            uk: "Назва типу не важить — важить форма. У `draft` є всі п’ять полів потрібних типів, тож він підходить. Зайве поле в об’єкта зі змінної `tsc` не шукає."
            en: "The type’s name does not matter — the shape does. `draft` has all five fields of the right types, so it fits. `tsc` does not look for extra fields in an object that comes from a variable."
      correct: [only-d]
    explanation:
      uk: "Під час підготовки уроку `tsc` 7 повідомив про `a` — `TS2741` (бракує `category`), про `b` — `TS2322` (`\"45\"` — текст, а не число), про `c` — `TS2353` (зайве `note` у літералі). `d` пройшов: форма підходить, а перевірка зайвих полів діє лише на літерал у місці присвоєння."
      en: "When the lesson was prepared, `tsc` 7 reported `TS2741` for `a` (`category` is missing), `TS2322` for `b` (`\"45\"` is text, not a number) and `TS2353` for `c` (the extra `note` in the literal). `d` passed: the shape fits, and the extra-field check applies only to a literal at the place of assignment."

  - id: template-diagram
    kind: visual
    visual: diagram
    title:
      uk: "Wish — шаблон, якого немає під час виконання"
      en: "Wish — a template that does not exist at runtime"
    textEquivalent:
      uk: "Схема показує тип Wish як шаблон поле за полем і три об’єкти-літерали поруч. Перший об’єкт має всі п’ять полів потрібних типів — tsc його приймає. Другому бракує обов’язкового поля category — tsc повідомляє TS2741. Третій має зайве поле note, записане прямо в літералі, — tsc повідомляє TS2353. Наостанок tsc прибирає типи: у JavaScript, який він створює, від Wish не лишається нічого, тож під час виконання перевіряти об’єкт на Wish нема чим."
      en: "The diagram shows the type Wish as a field-by-field template with three object literals next to it. The first object has all five fields of the right types — tsc accepts it. The second lacks the required field category — tsc reports TS2741. The third has an extra field note written right in the literal — tsc reports TS2353. Finally tsc removes the types: nothing of Wish is left in the JavaScript it produces, so at runtime there is nothing to check an object against."
    spec:
      layout: grid
      nodes:
        - { id: full, label: { uk: "усі 5 полів", en: "all 5 fields" }, w: 130, col: 0, row: 0 }
        - { id: missing, label: { uk: "без category", en: "no category" }, w: 130, col: 0, row: 1 }
        - { id: extra, label: { uk: "+ поле note", en: "+ a note field" }, w: 130, col: 0, row: 2 }
        - { id: wish, label: "interface Wish", w: 140, col: 1, row: 1 }
        - { id: js, label: { uk: "JS: нічого від Wish", en: "JS: nothing of Wish" }, shape: note, w: 160, col: 1, row: 3 }
      edges:
        - { id: full-ok, from: full, to: wish, label: "OK" }
        - { id: missing-err, from: missing, to: wish, label: "TS2741" }
        - { id: extra-err, from: extra, to: wish, label: "TS2353" }
        - { id: erase, from: wish, to: js, label: { uk: "tsc стирає", en: "tsc erases" }, kind: dashed }
      steps:
        - caption:
            uk: "`interface Wish` — шаблон: які поля мають бути й якого типу. Ліворуч — три об’єкти-літерали, які присвоюють змінним типу `Wish`."
            en: "`interface Wish` is a template: which fields must be there and of which type. On the left are three object literals assigned to variables of type `Wish`."
          highlight: [wish]
        - caption:
            uk: "Об’єкт з усіма п’ятьма полями потрібних типів підходить до шаблону: `tsc` його приймає."
            en: "The object with all five fields of the right types fits the template: `tsc` accepts it."
          highlight: [full, full-ok, wish]
          dim: [missing, extra, js]
        - caption:
            uk: "Об’єкту бракує обов’язкового поля `category`: `TS2741`. Пропустити дозволено лише поле з `?`."
            en: "The object lacks the required field `category`: `TS2741`. Only a field with `?` may be left out."
          highlight: [missing, missing-err, wish]
          dim: [full, extra, js]
        - caption:
            uk: "У літералі є поле `note`, якого немає в шаблоні: `TS2353`. Перевірка зайвих полів діє лише для літерала прямо в місці присвоєння."
            en: "The literal has a field `note` the template does not have: `TS2353`. The extra-field check applies only to a literal right at the place of assignment."
          highlight: [extra, extra-err, wish]
          dim: [full, missing, js]
        - caption:
            uk: "Після перевірки `tsc` прибирає типи. У JavaScript від `Wish` не лишається нічого — тому `instanceof Wish` неможливий."
            en: "After the check `tsc` removes the types. Nothing of `Wish` is left in the JavaScript — that is why `instanceof Wish` is impossible."
          highlight: [wish, erase, js]
          dim: [full, missing, extra]

  - id: same-shape
    kind: example
    runtime: browser-js
    dir: same-shape
    entry: index.ts
    expectError: true
    strings:
      bike: { uk: "Велосипед", en: "Bicycle" }
    title:
      uk: "Та сама форма — інша назва"
      en: "The same shape — another name"
    body:
      uk: |
        `describeWish` чекає `Wish`, а отримує `idea` типу `GiftIdea` — інша назва, та сама форма. Останній рядок пробує перевірити об’єкт через `instanceof Wish`, як перевіряли б клас.

        Запусти. Перший рядок спрацює, а другий завершиться помилкою: `Wish` після прибирання типів просто не існує. `tsc` повідомив би про це ще до запуску: `TS2693: 'Wish' only refers to a type, but is being used as a value here` («`Wish` — лише тип, а його використано як значення»).
      en: |
        `describeWish` expects a `Wish` and gets `idea` of type `GiftIdea` — another name, the same shape. The last line tries to check the object with `instanceof Wish`, as you would check a class.

        Run it. The first line works, and the second ends with an error: after the types are removed, `Wish` simply does not exist. `tsc` would report it before running: `TS2693: 'Wish' only refers to a type, but is being used as a value here`.
    tryIt:
      uk: |
        1. Прочитай картку помилки: `ReferenceError`, назву `Wish` не визначено.
        2. Заміни останній рядок на `console.log("price" in idea);` і запусти: `true`. Під час виконання перевіряють **поля значення**, а не тип.
        3. Додай перед `console.log` рядок `const copy: Wish = { ...idea };` і виведи `describeWish(copy)`: копія через spread має ту саму форму, тож підходить так само.
      en: |
        1. Read the error card: `ReferenceError`, the name `Wish` is not defined.
        2. Replace the last line with `console.log("price" in idea);` and run: `true`. At runtime you check **the value’s fields**, not a type.
        3. Before the `console.log` lines add `const copy: Wish = { ...idea };` and print `describeWish(copy)`: a spread copy has the same shape, so it fits just as well.
    limits:
      uk: "Пісочниця прибирає типи й виконує JavaScript, що лишився. Типів вона не перевіряє: це робить `tsc` у твоїй теці `ts-lab`."
      en: "The sandbox removes the types and runs the JavaScript that remains. It does not check types: `tsc` in your `ts-lab` folder does that."

  - id: recall-models
    kind: review
    title:
      uk: "Згадай: моделі й форми"
      en: "Recall: models and shapes"
    items:
      - id: data-or-class
        from: js-11-07-inheritance-vs-composition
        prompt:
          uk: "Записи бажань зберігаються в `localStorage` як JSON і читаються назад через `JSON.parse`. Що з цього правда про об’єкти, які повертає `JSON.parse`?"
          en: "Wish records are stored in `localStorage` as JSON and read back with `JSON.parse`. Which of these is true about the objects `JSON.parse` returns?"
        answer:
          type: choice
          options:
            - id: plain
              text:
                uk: "Це прості об’єкти з полями; методів класу в них немає, і `instanceof` будь-якого власного класу дасть `false`"
                en: "They are plain objects with fields; they have no class methods, and `instanceof` any class of your own gives `false`"
            - id: restored
              text:
                uk: "Якщо записи створювали через `new Wish(…)`, `JSON.parse` відновить їх як екземпляри `Wish` з методами"
                en: "If the records were created with `new Wish(…)`, `JSON.parse` restores them as `Wish` instances with methods"
              why:
                uk: "JSON зберігає лише дані. Про клас `JSON.parse` нічого не знає, тож повертає прості об’єкти — тому для записів, що зберігаються, зручніші прості дані плюс функції."
                en: "JSON keeps only data. `JSON.parse` knows nothing about the class, so it returns plain objects — which is why plain data plus functions suits stored records better."
            - id: strings
              text:
                uk: "Це рядки JSON, поки їх не передати в конструктор класу"
                en: "They are JSON strings until you pass them to a class constructor"
              why:
                uk: "`JSON.parse` уже перетворює текст на об’єкти й масиви. Текстом дані є лише в самому `localStorage`."
                en: "`JSON.parse` already turns text into objects and arrays. The data is text only inside `localStorage` itself."
          correct: [plain]
        explanation:
          uk: "Простий об’єкт із даними легко зберегти, відновити й порівняти. Саме таку модель описує `interface`: форму даних, без класу під час виконання."
          en: "A plain data object is easy to store, restore and compare. That is exactly the model an `interface` describes: the shape of the data, with no class at runtime."
      - id: spread-shape
        from: js-04-09-destructuring-spread
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          const task = { id: "t-04", title: "Pay", done: false };
          const finished = { ...task, done: true };
          console.log(Object.keys(finished).join(","));
          console.log(task.done, finished.done);
        verify:
          logs: ["id,title,done", "false true"]
        answer:
          type: choice
          options:
            - id: copy
              code: "id,title,done\nfalse true"
            - id: shared
              code: "id,title,done\ntrue true"
              why:
                uk: "Spread створює **новий** об’єкт і копіює поля; `task` не змінюється."
                en: "Spread creates a **new** object and copies the fields; `task` does not change."
            - id: added
              code: "id,title,done,done\nfalse true"
              why:
                uk: "У об’єкта не буває двох полів з однією назвою: пізніше `done: true` замінює скопійоване значення."
                en: "An object never has two fields with the same name: the later `done: true` replaces the copied value."
          correct: [copy]
        explanation:
          uk: "Копія через spread має **ту саму форму** — ті самі поля, — тож підходить до того самого типу. Структурна типізація тут працює на тебе."
          en: "A spread copy has **the same shape** — the same fields — so it fits the same type. Structural typing works for you here."

  - id: task-store
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: task-store
    entry: index.ts
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      wardrobe: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
    title:
      uk: "Тип запису й інтерфейс сховища"
      en: "A record type and a store interface"
    instructions:
      uk: |
        `createMemoryStore` — сховище справ у пам’яті: фабрика на зразок адаптерів сховища з розділу про класи й композицію, тільки дані живуть у масиві, без `localStorage`.

        1. Напиши `type TaskRecord` для однієї справи: `id` (текст, який не можна змінювати), `title` (текст), `dueDate` (текст або `null`), `done` (`boolean`).
        2. Напиши `interface TaskStore` із трьома методами: `list()` повертає масив справ, `get(id)` — одну справу або `undefined`, `save(task)` нічого не повертає.
        3. Анотуй параметр і результат `createMemoryStore`.

        Коли результат функції має тип `TaskStore`, `tsc` порівняє з ним повернутий об’єкт — і знайде в ньому помилку, через яку програма зараз падає. Виправ її **в об’єкті**, а не в місці виклику.

        Перевірки створюють сховище з іншими справами й викликають `list`, `get` і `save`.
      en: |
        `createMemoryStore` is an in-memory task store: a factory like the storage adapters from the unit on classes and composition, only the data lives in an array, without `localStorage`.

        1. Write `type TaskRecord` for one task: `id` (text that must not change), `title` (text), `dueDate` (text or `null`), `done` (`boolean`).
        2. Write `interface TaskStore` with three methods: `list()` returns an array of tasks, `get(id)` one task or `undefined`, `save(task)` returns nothing.
        3. Annotate the parameter and the result of `createMemoryStore`.

        Once the function’s result has the type `TaskStore`, `tsc` compares the returned object with it — and finds the mistake that makes the program crash now. Fix it **in the object**, not at the call.

        The checks create a store with other tasks and call `list`, `get` and `save`.
    testTitles:
      "list gives all tasks as a new array":
        uk: "`list` повертає всі справи новим масивом"
        en: "`list` gives all tasks as a new array"
      "get finds a task by id and gives undefined for an unknown id":
        uk: "`get` знаходить справу за `id` і дає `undefined` для невідомого `id`"
        en: "`get` finds a task by `id` and gives `undefined` for an unknown `id`"
      "save replaces the task with the same id instead of adding a second one":
        uk: "`save` замінює справу з тим самим `id`, а не додає другу"
        en: "`save` replaces the task with the same `id` instead of adding a second one"
      "the program prints t-03 false, t-01 true":
        uk: "Програма виводить `t-03 false, t-01 true`"
        en: "The program prints `t-03 false, t-01 true`"
    hints:
      nudge:
        uk: "Порівняй назви методів у повернутому об’єкті з назвами, які ти записав в `interface TaskStore`. Усі збігаються літера в літеру?"
        en: "Compare the method names in the returned object with the names you wrote in `interface TaskStore`. Do all of them match letter for letter?"
      explanation:
        uk: "Інтерфейс — це обіцянка: «у сховища є `list`, `get` і `save`». Якщо результат функції анотовано інтерфейсом, `tsc` перевіряє повернутий літерал так само, як змінну, і показує метод, якого інтерфейс не знає. Наприклад, для `interface Counter { increment(): void }` об’єкт `{ incremnet() {} }` дає `TS2561: … 'incremnet' does not exist in type 'Counter'. Did you mean to write 'increment'?`. Пісочниця типів не перевіряє, тож тут таку описку видно лише як `TypeError … is not a function` у місці виклику."
        en: "An interface is a promise: “the store has `list`, `get` and `save`”. If the function’s result is annotated with the interface, `tsc` checks the returned literal just like a variable and points at a method the interface does not know. For example, for `interface Counter { increment(): void }` the object `{ incremnet() {} }` gives `TS2561: … 'incremnet' does not exist in type 'Counter'. Did you mean to write 'increment'?`. The sandbox does not check types, so here such a typo shows up only as `TypeError … is not a function` at the call."
    solutionNote:
      uk: "Описка `lsit` ховалася в об’єкті, а падала програма у виклику `store.list()`. З анотацією `: TaskStore` `tsc` показує її там, де вона є: `TS2353: … 'lsit' does not exist in type 'TaskStore'`. Зверни увагу: параметрам `get(id)` і `save(task)` анотації не потрібні — їхні типи `tsc` бере з інтерфейсу. `interface` для запису й `type` для сховища (або навпаки) теж підходять."
      en: "The typo `lsit` hid in the object, while the program crashed at the call `store.list()`. With the annotation `: TaskStore`, `tsc` points at the place where it is: `TS2353: … 'lsit' does not exist in type 'TaskStore'`. Notice that the parameters of `get(id)` and `save(task)` need no annotations — `tsc` takes their types from the interface. An `interface` for the record and a `type` for the store (or the other way round) work too."
    feedback:
      - when: { test: "list gives all tasks as a new array" }
        message:
          uk: "Ця перевірка викликає `store.list()` і чекає новий масив з усіма справами. Метод має називатися саме `list` — як у твоєму інтерфейсі. Перейменувати виклик на описку не допоможе: перевірки викликають `list`."
          en: "This check calls `store.list()` and expects a new array with all tasks. The method must be named exactly `list` — as in your interface. Renaming the call to the typo does not help: the checks call `list`."
      - when: { error: ReferenceError }
        message:
          uk: "`ReferenceError`: назва не існує під час виконання. `interface` і `type` після прибирання типів зникають, тож `instanceof TaskStore` чи `typeof TaskRecord` у коді неможливі — перевіряй поля значення або довірся `tsc`."
          en: "`ReferenceError`: a name does not exist at runtime. `interface` and `type` vanish when the types are removed, so `instanceof TaskStore` or `typeof TaskRecord` cannot work in code — check the value’s fields or rely on `tsc`."
      - when: { error: TypeError }
        message:
          uk: "`TypeError`: щось викликають як функцію, а воно нею не є. Якщо в картці `store.list is not a function`, порівняй назви методів у повернутому об’єкті з інтерфейсом."
          en: "`TypeError`: something is called as a function but is not one. If the card says `store.list is not a function`, compare the method names in the returned object with the interface."
    limits:
      uk: "Пісочниця прибирає типи й виконує JavaScript, що лишився. Інтерфейс і тип запису перевіряє лише `tsc` у твоїй теці `ts-lab`."
      en: "The sandbox removes the types and runs the JavaScript that remains. Only `tsc` in your `ts-lab` folder checks the interface and the record type."

  - id: check-task-store
    kind: local-task
    runtime: local-web
    title:
      uk: "Перевір модель через tsc"
      en: "Check the model with tsc"
    intro:
      uk: "Працюєш у теці `ts-lab` з попереднього уроку. Кожен крок змінює файл; після кроку збережи файл і запусти ту саму команду. Результати записано з TypeScript 7.0.2 у macOS; номери рядків можуть відрізнятися, якщо твій файл відформатовано інакше."
      en: "You work in the `ts-lab` folder from the previous lesson. Each step changes the file; after the step, save the file and run the same command. The results were recorded with TypeScript 7.0.2 on macOS; line numbers may differ if your file is formatted differently."
    tools:
      - { name: "TypeScript", version: "7.x", note: { uk: "у теці `ts-lab`", en: "in the `ts-lab` folder" } }
      - { name: "VS Code", note: { uk: "будь-яка свіжа версія", en: "any recent version" } }
    steps:
      - text:
          uk: "Створи `src/l02/index.ts`, встав туди свій розв’язок вправи «Тип запису й інтерфейс сховища» і перевір."
          en: "Create `src/l02/index.ts`, paste your solution of the exercise “A record type and a store interface” into it and check."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого не виведено."
          en: "Nothing is printed."
      - text:
          uk: "Перейменуй метод `list` в об’єкті назад на `lsit`."
          en: "Rename the method `list` in the object back to `lsit`."
        command: "npx tsc --noEmit"
        expect:
          uk: "`error TS2353: Object literal may only specify known properties, and 'lsit' does not exist in type 'TaskStore'.` — підкреслено саме `lsit`, а не виклик. Поверни `list`."
          en: "`error TS2353: Object literal may only specify known properties, and 'lsit' does not exist in type 'TaskStore'.` — the underline is on `lsit` itself, not on the call. Put `list` back."
      - text:
          uk: "Допиши в кінець файлу два рядки: `const first = store.list()[0];` і `first.id = \"t-99\";`."
          en: "Add two lines at the end of the file: `const first = store.list()[0];` and `first.id = \"t-99\";`."
        command: "npx tsc --noEmit"
        expect:
          uk: "`error TS2540: Cannot assign to 'id' because it is a read-only property.` Спробуй прибрати `readonly` з `TaskRecord`: помилка зникне. Поверни `readonly` і видали обидва рядки."
          en: "`error TS2540: Cannot assign to 'id' because it is a read-only property.` Try removing `readonly` from `TaskRecord`: the error disappears. Put `readonly` back and delete both lines."
      - text:
          uk: "У справі `t-03` всередині виклику `createMemoryStore([…])` прибери поле `dueDate: null`."
          en: "In the task `t-03` inside the call `createMemoryStore([…])`, remove the field `dueDate: null`."
        command: "npx tsc --noEmit"
        expect:
          uk: "`error TS2741: Property 'dueDate' is missing in type '{ id: string; title: string; done: false; }' but required in type 'TaskRecord'.` Тепер зроби поле необов’язковим — `dueDate?: string | null;` — і запусти ще раз: нічого не виведено."
          en: "`error TS2741: Property 'dueDate' is missing in type '{ id: string; title: string; done: false; }' but required in type 'TaskRecord'.` Now make the field optional — `dueDate?: string | null;` — and run again: nothing is printed."
      - text:
          uk: "Допиши виклик із зайвим полем у літералі: `store.save({ id: \"t-08\", title: \"…\", dueDate: null, done: false, note: \"\" });`. Потім збережи той самий об’єкт спершу в змінну `draft` і передай `store.save(draft)`."
          en: "Add a call with an extra field in the literal: `store.save({ id: \"t-08\", title: \"…\", dueDate: null, done: false, note: \"\" });`. Then store the same object in a variable `draft` first and pass `store.save(draft)`."
        command: "npx tsc --noEmit"
        expect:
          uk: "Для літерала — `error TS2353: Object literal may only specify known properties, and 'note' does not exist in type 'TaskRecord'.` Для змінної `draft` — жодної помилки: форма підходить, а зайві поля шукають лише в літералі."
          en: "For the literal — `error TS2353: Object literal may only specify known properties, and 'note' does not exist in type 'TaskRecord'.` For the variable `draft` — no error: the shape fits, and extra fields are looked for only in a literal."
      - text:
          uk: "Прибери додані рядки й поверни `dueDate` як було, щоб тека знову перевірялася без помилок."
          en: "Remove the added lines and restore `dueDate` as it was, so the folder checks without errors again."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого не виведено."
          en: "Nothing is printed."
    verify:
      - id: clean
        text:
          uk: "Мій розв’язок перевіряється без помилок."
          en: "My solution checks without errors."
      - id: typo-at-source
        text:
          uk: "З анотацією `TaskStore` `tsc` показав описку в самому об’єкті."
          en: "With the `TaskStore` annotation, `tsc` pointed at the typo in the object itself."
      - id: readonly-optional-excess
        text:
          uk: "Я побачив, як `readonly`, `?` і перевірка зайвих полів у літералі змінюють те, що повідомляє `tsc`."
          en: "I saw how `readonly`, `?` and the extra-field check in a literal change what `tsc` reports."
    troubleshooting:
      - problem:
          uk: "Повідомлення про файл з уроку 1"
          en: "Messages about the file from lesson 1"
        fix:
          uk: "`tsc` перевіряє всю теку `src`. Виправ той файл або тимчасово перенеси його за межі `src`."
          en: "`tsc` checks the whole `src` folder. Fix that file or temporarily move it outside `src`."
      - problem:
          uk: "`error TS2451: Cannot redeclare block-scoped variable 'store'.`"
          en: "`error TS2451: Cannot redeclare block-scoped variable 'store'.`"
        fix:
          uk: "У `tsconfig.json` бракує `\"moduleDetection\": \"force\"`: без нього файли без `import`/`export` ділять одну спільну область видимості. Додай рядок із налаштувань першого уроку."
          en: "`tsconfig.json` is missing `\"moduleDetection\": \"force\"`: without it, files without `import`/`export` share one common scope. Add the line from the settings of the first lesson."
    recovery:
      uk: "Якщо файл заплутався, скопіюй розв’язок із платформи ще раз — він там збережений. Теку `ts-lab` це не зачіпає."
      en: "If the file got tangled, copy the solution from the platform again — it is saved there. This does not affect the rest of `ts-lab`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-14
    body:
      uk: "У кроці проєкту ти опишеш запис свого домену — бажання, справу, звичку чи витрату — як `interface` або `type`, з `readonly id` і полями `… | null` там, де значення може не бути. А інтерфейс для адаптера репозиторію з розділу про класи й композицію анотує сам адаптер, тож описку в назві методу `tsc` покаже в ньому, а не у виклику."
      en: "In the project step you will describe your domain’s record — a wish, task, habit or expense — as an `interface` or a `type`, with `readonly id` and `… | null` fields where a value may be missing. And an interface for the repository adapter from the unit on classes and composition annotates the adapter itself, so `tsc` shows a misspelled method name there, not at the call."
