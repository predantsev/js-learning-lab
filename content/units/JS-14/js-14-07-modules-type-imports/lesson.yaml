id: js-14-07-modules-type-imports
unit: JS-14
title:
  uk: "Модулі та type-only імпорти"
  en: "Modules and type-only imports"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Експортувати тип із доменного модуля й імпортувати його через `import type` у модулі інтерфейсу."
    en: "Export a type from a domain module and import it with `import type` in a UI module."
  - uk: "Передбачити, які імпорти лишаться в JavaScript після `tsc`, і пояснити, чому type-only імпорт не додає залежності між модулями під час виконання."
    en: "Predict which imports remain in the emitted JavaScript and explain why a type-only import adds no runtime module dependency."
prerequisites: [js-14-06-unknown-vs-any, js-07-06-esm-import-export]
subskills:
  - { family: P-03, skill: "modules/type-only imports", depth: intro }
glossary: [type-only-import]
selfCheck: [predict-emitted, split-modules]

blocks:
  - id: types-cross-modules
    kind: explanation
    title:
      uk: "Типи теж експортують"
      en: "Types are exported too"
    body:
      uk: |
        Тип, оголошений в одному модулі, інші модулі бачать так само, як функції, — через `export`:

        ```ts
        // domain/wish.ts
        export interface Wish { readonly id: string; name: string; price: number | null }
        export function validateItem(name: string): boolean { … }
        ```

        А імпортують його [[type-only-import|type-only імпортом]]:

        ```ts
        // ui/render.ts
        import type { Wish } from "../domain/wish.ts"; // only a type
        import { type Wish, validateItem } from "../domain/wish.ts"; // a type and a value
        ```

        `import type` каже: «мені потрібен лише тип». Після компіляції такий імпорт зникає повністю, бо типів у JavaScript немає. А звичайний імпорт значення (`validateItem`) лишається — і під час виконання завантажує модуль.

        Слово `type` у фігурних дужках прибирає лише одну назву, а не весь рядок. Тож `import { type Wish } from "../domain/wish.ts"` без жодного значення після `tsc` стає `import {} from "../domain/wish.js"` — і модуль усе одно завантажиться. Коли потрібні лише типи, пиши `import type`.

        У твоєму `tsconfig.json` увімкнено `verbatimModuleSyntax`: з ним `tsc` вимагає позначати типи словом `type` і лишає всі інші імпорти рівно такими, як написано. Тож з коду одразу видно, що зникне, а що ні.
      en: |
        A type declared in one module is visible to other modules the same way as functions — through `export`:

        ```ts
        // domain/wish.ts
        export interface Wish { readonly id: string; name: string; price: number | null }
        export function validateItem(name: string): boolean { … }
        ```

        And it is imported with a [[type-only-import|type-only import]]:

        ```ts
        // ui/render.ts
        import type { Wish } from "../domain/wish.ts"; // only a type
        import { type Wish, validateItem } from "../domain/wish.ts"; // a type and a value
        ```

        `import type` says: “I need only the type”. After compiling such an import disappears completely, because JavaScript has no types. An ordinary value import (`validateItem`) stays — and at runtime it loads the module.

        The word `type` inside the curly braces removes only that one name, not the whole line. So `import { type Wish } from "../domain/wish.ts"` with no value in it becomes `import {} from "../domain/wish.js"` after `tsc` — and the module is loaded all the same. When you need only types, write `import type`.

        Your `tsconfig.json` has `verbatimModuleSyntax` on: with it, `tsc` requires types to be marked with the word `type` and keeps every other import exactly as written. So the code shows at once what will disappear and what will not.

  - id: predict-emitted
    kind: prediction
    prompt:
      uk: "Який JavaScript `tsc` створить із цього файлу `ui/render.ts`?"
      en: "Which JavaScript does `tsc` produce from this file `ui/render.ts`?"
    code: |
      import { type Wish, validateItem } from "../domain/wish.ts";

      export function renderWish(wish: Wish): string {
        const mark = validateItem(wish.name) ? "" : " (!)";
        return `${wish.name}${mark}`;
      }
    lang: ts
    runnable: false
    answer:
      type: choice
      options:
        - id: value-only
          code: "import { validateItem } from \"../domain/wish.js\";\nexport function renderWish(wish) { … }"
        - id: both
          code: "import { Wish, validateItem } from \"../domain/wish.js\";\nexport function renderWish(wish) { … }"
          why:
            uk: "`Wish` — лише тип, у JavaScript його не існує. Якби імпорт лишився, браузер шукав би в модулі експорт `Wish` і не знайшов би його."
            en: "`Wish` is only a type; it does not exist in JavaScript. If the import stayed, the browser would look for an export `Wish` in the module and not find it."
        - id: none
          code: "export function renderWish(wish) { … }"
          why:
            uk: "`validateItem` — функція, і `renderWish` її викликає. Імпорт значення лишається, тож модуль `domain/wish` під час виконання завантажиться."
            en: "`validateItem` is a function, and `renderWish` calls it. A value import stays, so the module `domain/wish` is loaded at runtime."
        - id: object
          code: "const Wish = {};\nimport { validateItem } from \"../domain/wish.js\";\nexport function renderWish(wish) { … }"
          why:
            uk: "Тип не перетворюється на об’єкт: від `interface` у JavaScript не лишається нічого."
            en: "A type does not turn into an object: nothing of an `interface` is left in JavaScript."
      correct: [value-only]
    explanation:
      uk: "Під час підготовки уроку `npx tsc` створив саме `import { validateItem } from \"../domain/wish.js\";` — `type Wish` зник, анотації теж, а `.ts` у шляху замінено на `.js` (це робить `rewriteRelativeImportExtensions` з `tsconfig.json`). Рядок `import type { Wish } …` зник би весь, а `import { type Wish } …` без значень лишив би `import {} from \"../domain/wish.js\"`."
      en: "When the lesson was prepared, `npx tsc` produced exactly `import { validateItem } from \"../domain/wish.js\";` — `type Wish` was gone, the annotations too, and `.ts` in the path was replaced with `.js` (that is `rewriteRelativeImportExtensions` from `tsconfig.json`). A line `import type { Wish } …` would disappear entirely, while `import { type Wish } …` with no values would leave `import {} from \"../domain/wish.js\"`."

  - id: load-or-not
    kind: example
    runtime: browser-js
    dir: load-or-not
    entry: index.ts
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      loaded: { uk: "завантажено", en: "loaded" }
    title:
      uk: "Чи завантажиться domain/wish.ts?"
      en: "Does domain/wish.ts load?"
    body:
      uk: "Модуль `domain/wish.ts` першим рядком пише в консоль `domain/wish.ts завантажено`. `ui/render.ts` бере з нього лише тип — через `import type`. Перш ніж запускати, виріши: з’явиться цей рядок у консолі чи ні? Потім запусти."
      en: "The module `domain/wish.ts` prints `domain/wish.ts loaded` as its first line. `ui/render.ts` takes only a type from it — with `import type`. Before running, decide: will that line appear in the console or not? Then run."
    tryIt:
      uk: |
        1. Запусти: два рядки з бажаннями, а `domain/wish.ts завантажено` немає. Type-only імпорт зник разом із типами, тож модуль ніхто не завантажив.
        2. У `ui/render.ts` заміни імпорт на `import { type Wish, validateItem } from "../domain/wish.ts";`, а в `renderWish` перед `return` додай рядок `if (!validateItem(wish.name)) return "?";`. Запусти: першим рядком тепер `domain/wish.ts завантажено`.
        3. Спробуй `console.log(Wish)` у `ui/render.ts`. Пісочниця покаже `ReferenceError`; `tsc` повідомив би `TS2693: 'Wish' only refers to a type, but is being used as a value here`. Прибери цей рядок.
      en: |
        1. Run it: two lines with wishes, and no `domain/wish.ts loaded`. The type-only import disappeared together with the types, so nobody loaded the module.
        2. In `ui/render.ts` replace the import with `import { type Wish, validateItem } from "../domain/wish.ts";`, and in `renderWish` add the line `if (!validateItem(wish.name)) return "?";` before `return`. Run: the first line is now `domain/wish.ts loaded`.
        3. Try `console.log(Wish)` in `ui/render.ts`. The sandbox shows a `ReferenceError`; `tsc` would report `TS2693: 'Wish' only refers to a type, but is being used as a value here`. Remove that line.
    limits:
      uk: "Пісочниця прибирає типи й виконує JavaScript, що лишився. Вимоги `verbatimModuleSyntax` вона не перевіряє: звичайний `import { Wish }` тут теж спрацює, а `tsc` його відхилить (`TS1484`). І ще одна різниця: `import { type Wish }` без значень пісочниця прибирає повністю, а `tsc` лишає `import {} from …`, тож модуль після `tsc` завантажується."
      en: "The sandbox removes the types and runs the JavaScript that remains. It does not check the `verbatimModuleSyntax` rules: a plain `import { Wish }` works here too, while `tsc` rejects it (`TS1484`). One more difference: the sandbox drops an `import { type Wish }` with no values completely, while `tsc` leaves `import {} from …`, so after `tsc` the module is loaded."

  - id: recall-cycles
    kind: review
    title:
      uk: "Згадай: модулі, що імпортують одне одного"
      en: "Recall: modules that import each other"
    items:
      - id: cycle-risk
        from: js-13-08-module-cycles
        prompt:
          uk: "Модуль `domain/tasks.js` імпортує функцію з `ui/render.js`, а `ui/render.js` — функцію з `domain/tasks.js`. Що з цього правда?"
          en: "The module `domain/tasks.js` imports a function from `ui/render.js`, and `ui/render.js` imports a function from `domain/tasks.js`. Which of these is true?"
        answer:
          type: choice
          options:
            - id: order-matters
              text:
                uk: "Це циклічна залежність: один із модулів почне виконуватися, коли інший ще не завершився, і код, що одразу під час завантаження звертається до ще не ініціалізованої назви, впаде"
                en: "This is a circular dependency: one module starts running while the other has not finished, and code that touches a not-yet-initialized name right during loading crashes"
            - id: refused
              text:
                uk: "Браузер відмовиться завантажувати такі модулі ще до запуску"
                en: "The browser refuses to load such modules before anything runs"
              why:
                uk: "ES-модулі дозволяють цикли: обидва завантажаться. Проблема в порядку виконання, а не в забороні."
                en: "ES modules allow cycles: both load. The problem is the order of execution, not a ban."
            - id: harmless
              text:
                uk: "Цикл завжди нешкідливий: імпорт — це жива прив’язка, тож значення з’являться вчасно"
                en: "A cycle is always harmless: an import is a live binding, so the values arrive in time"
              why:
                uk: "Жива прив’язка рятує лише тоді, коли назву читають пізніше. Якщо її читають під час завантаження, до ініціалізації, буде `ReferenceError`."
                en: "A live binding helps only when the name is read later. If it is read during loading, before initialization, there is a `ReferenceError`."
          correct: [order-matters]
        explanation:
          uk: "Type-only імпорт такого циклу під час виконання не створює: він зникає після компіляції. Тому, якщо `domain` бере з `ui` лише тип, напиши `import type` — реальна залежність лишиться в один бік."
          en: "A type-only import does not create such a cycle at runtime: it disappears after compiling. So if `domain` takes only a type from `ui`, write `import type` — the real dependency stays one-way."

  - id: split-modules
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: split-modules
    entry: index.ts
    strings:
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
    title:
      uk: "Розклади файл на модулі"
      en: "Split a file into modules"
    instructions:
      uk: |
        Увесь код планувальника лежить в `index.ts`. Розклади його за коментарями `->`:

        - `domain/types.ts` — `Priority` і `Task`, з `export`;
        - `domain/validate.ts` — `isPriority` і `validateTitle`, з `export`;
        - `ui/render.ts` — `renderTask`, з `export`;
        - в `index.ts` лишаються імпорти, масив справ і виведення.

        Де модулю потрібні лише типи, імпортуй їх через `import type`; `type` у фігурних дужках — для рядка, який імпортує ще й значення. Шляхи пиши з розширенням `.ts`.

        Перевірки імпортують функції саме з цих трьох модулів і порівнюють виведення програми з початковим. Слова `type` вони не бачать — пісочниця приймає й `import { Task }` без нього; це перевірить `tsc` у локальному завданні (`TS1484`).
      en: |
        All the planner code lives in `index.ts`. Split it along the `->` comments:

        - `domain/types.ts` — `Priority` and `Task`, with `export`;
        - `domain/validate.ts` — `isPriority` and `validateTitle`, with `export`;
        - `ui/render.ts` — `renderTask`, with `export`;
        - `index.ts` keeps the imports, the array of tasks and the output.

        Where a module needs only types, import them with `import type`; `type` inside the curly braces is for a line that also imports values. Write paths with the `.ts` extension.

        The checks import the functions from exactly these three modules and compare the program’s output with the original. They do not see the word `type` — the sandbox accepts `import { Task }` without it too; `tsc` checks that in the local task (`TS1484`).
    testTitles:
      "domain/validate.ts exports isPriority that accepts only the three priorities":
        uk: "`domain/validate.ts` експортує `isPriority`, що приймає лише три пріоритети"
        en: "`domain/validate.ts` exports `isPriority` that accepts only the three priorities"
      "domain/validate.ts exports validateTitle that returns an error key or null":
        uk: "`domain/validate.ts` експортує `validateTitle`, що повертає ключ помилки або `null`"
        en: "`domain/validate.ts` exports `validateTitle` that returns an error key or `null`"
      "ui/render.ts exports renderTask":
        uk: "`ui/render.ts` експортує `renderTask`"
        en: "`ui/render.ts` exports `renderTask`"
      "the program prints the same three lines as before":
        uk: "Програма виводить ті самі три рядки, що й раніше"
        en: "The program prints the same three lines as before"
    hints:
      nudge:
        uk: "Почни з `domain/types.ts`: перенеси обидва типи й додай `export`. Які модулі потім потребують цих типів — і чи потребують вони ще чогось, крім типів?"
        en: "Start with `domain/types.ts`: move both types and add `export`. Which modules then need these types — and do they need anything besides types?"
      explanation:
        uk: "Кожен модуль імпортує те, чим користується. `validate.ts` у запису `value is Priority` використовує тип — це type-only імпорт з `./types.ts`. `render.ts` так само потребує лише типу `Task`. А `index.ts` викликає функції, тож їх імпортує звичайно, а тип масиву — через `import type`. Порівняй з іншою парою: `import type { Habit } from \"./habit.ts\"` і `import { streak } from \"./streak.ts\"`."
        en: "Each module imports what it uses. `validate.ts` uses a type in `value is Priority` — a type-only import from `./types.ts`. `render.ts` likewise needs only the type `Task`. `index.ts` calls functions, so it imports them normally, and the array’s type through `import type`. Compare with another pair: `import type { Habit } from \"./habit.ts\"` and `import { streak } from \"./streak.ts\"`."
    solutionNote:
      uk: "Після компіляції `domain/types.ts` перетворюється на порожній модуль (`export {};`), і жоден інший модуль його не завантажує: усі імпорти з нього — type-only. Реальні залежності — лише `index → validate` і `index → render`. `interface Task` замість `type Task` — теж правильно. `import { type Task }` замість `import type { Task }` теж компілюється й проходить перевірки, але `tsc` тоді лишає `import {} from \"./types.js\"`, і порожній модуль таки завантажується: для самих типів точний інструмент — `import type`."
      en: "After compiling, `domain/types.ts` becomes an empty module (`export {};`), and no other module loads it: every import from it is type-only. The real dependencies are only `index → validate` and `index → render`. `interface Task` instead of `type Task` is correct too. `import { type Task }` instead of `import type { Task }` also compiles and passes the checks, but then `tsc` leaves `import {} from \"./types.js\"`, and the empty module is loaded after all: for types alone the precise tool is `import type`."
    feedback:
      - when: { test: "domain/validate.ts exports validateTitle that returns an error key or null" }
        message:
          uk: "Ця перевірка імпортує `validateTitle` з `domain/validate.ts`. Функція має бути саме в цьому модулі й мати `export`; копія в `index.ts` не рахується."
          en: "This check imports `validateTitle` from `domain/validate.ts`. The function must be in exactly that module and have `export`; a copy in `index.ts` does not count."
      - when: { test: "domain/validate.ts exports isPriority that accepts only the three priorities" }
        message:
          uk: "Ця перевірка імпортує `isPriority` з `domain/validate.ts`. Перенеси функцію туди й додай `export`."
          en: "This check imports `isPriority` from `domain/validate.ts`. Move the function there and add `export`."
      - when: { test: "ui/render.ts exports renderTask" }
        message:
          uk: "Ця перевірка імпортує `renderTask` з `ui/render.ts`. Перенеси функцію туди й додай `export`."
          en: "This check imports `renderTask` from `ui/render.ts`. Move the function there and add `export`."
    limits:
      uk: "Пісочниця прибирає типи й виконує JavaScript, що лишився. Чи позначено типи словом `type`, перевіряє лише `tsc` у твоїй теці `ts-lab`."
      en: "The sandbox removes the types and runs the JavaScript that remains. Only `tsc` in your `ts-lab` folder checks that types are marked with `type`."

  - id: check-modules
    kind: local-task
    runtime: local-web
    title:
      uk: "Імпорти до й після tsc"
      en: "Imports before and after tsc"
    intro:
      uk: "Працюєш у теці `ts-lab`. Результати записано з TypeScript 7.0.2 у macOS."
      en: "You work in the `ts-lab` folder. The results were recorded with TypeScript 7.0.2 on macOS."
    tools:
      - { name: "TypeScript", version: "7.x", note: { uk: "у теці `ts-lab`", en: "in the `ts-lab` folder" } }
    steps:
      - text:
          uk: "Створи в `src/l07/` ті самі чотири файли, що у твоєму розв’язку вправи: `index.ts`, `domain/types.ts`, `domain/validate.ts`, `ui/render.ts`. Перевір."
          en: "Create in `src/l07/` the same four files as in your exercise solution: `index.ts`, `domain/types.ts`, `domain/validate.ts`, `ui/render.ts`. Check."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого не виведено."
          en: "Nothing is printed."
      - text:
          uk: "У `ui/render.ts` прибери слово `type` з імпорту: `import { Task } from \"../domain/types.ts\";`."
          en: "In `ui/render.ts` remove the word `type` from the import: `import { Task } from \"../domain/types.ts\";`."
        command: "npx tsc --noEmit"
        expect:
          uk: "`error TS1484: 'Task' is a type and must be imported using a type-only import when 'verbatimModuleSyntax' is enabled.` Поверни `type`."
          en: "`error TS1484: 'Task' is a type and must be imported using a type-only import when 'verbatimModuleSyntax' is enabled.` Put `type` back."
      - text:
          uk: "Створи JavaScript і відкрий `out/l07/index.js`, `out/l07/domain/types.js` та `out/l07/ui/render.js`."
          en: "Produce the JavaScript and open `out/l07/index.js`, `out/l07/domain/types.js` and `out/l07/ui/render.js`."
        command: "npx tsc"
        expect:
          uk: "В `index.js` лишилися два імпорти: `from \"./domain/validate.js\"` і `from \"./ui/render.js\"` — імпорту з `types` немає. `types.js` містить лише `export {};`. `render.js` починається одразу з `export function renderTask(task) {` — без жодного імпорту. Якщо ж там є `import {} from \"../domain/types.js\";`, у `ui/render.ts` написано `import { type Task }`: заміни на `import type { Task }` і запусти `npx tsc` ще раз."
          en: "`index.js` keeps two imports: `from \"./domain/validate.js\"` and `from \"./ui/render.js\"` — there is no import from `types`. `types.js` holds only `export {};`. `render.js` starts right with `export function renderTask(task) {` — without any import. If it has `import {} from \"../domain/types.js\";` instead, `ui/render.ts` says `import { type Task }`: change it to `import type { Task }` and run `npx tsc` again."
    verify:
      - id: clean
        text:
          uk: "Мої чотири модулі перевіряються без помилок."
          en: "My four modules check without errors."
      - id: ts1484
        text:
          uk: "Я бачив `TS1484` для типу, імпортованого без `type`."
          en: "I saw `TS1484` for a type imported without `type`."
      - id: emitted
        text:
          uk: "У створеному JavaScript type-only імпортів не лишилося, а імпорти функцій лишилися."
          en: "No type-only imports are left in the produced JavaScript, while the function imports remain."
    troubleshooting:
      - problem:
          uk: "`error TS5097: An import path can only end with a '.ts' extension when 'allowImportingTsExtensions' is enabled.`"
          en: "`error TS5097: An import path can only end with a '.ts' extension when 'allowImportingTsExtensions' is enabled.`"
        fix:
          uk: "У `tsconfig.json` бракує `\"rewriteRelativeImportExtensions\": true` з першого уроку: саме це налаштування дозволяє писати шляхи з `.ts` і замінює їх на `.js` у створеному коді."
          en: "`tsconfig.json` lacks `\"rewriteRelativeImportExtensions\": true` from the first lesson: that setting allows paths with `.ts` and replaces them with `.js` in the produced code."
      - problem:
          uk: "`error TS2307: Cannot find module './domain/types.ts' or its corresponding type declarations.` у `ui/render.ts`"
          en: "`error TS2307: Cannot find module './domain/types.ts' or its corresponding type declarations.` in `ui/render.ts`"
        fix:
          uk: "Шлях рахується від файлу, що імпортує. З `ui/render.ts` до `domain` треба вийти рівнем вище: `../domain/types.ts`."
          en: "A path is counted from the importing file. From `ui/render.ts` you go one level up to reach `domain`: `../domain/types.ts`."
    recovery:
      uk: "Теку `out` можна видалити будь-коли — `npx tsc` створить її знову. Файли розв’язку збережено в платформі."
      en: "You can delete the `out` folder at any time — `npx tsc` creates it again. The solution files are saved in the platform."

  - id: to-project
    kind: transfer
    capstoneStep: JS-14
    body:
      uk: "У проєкті вже є `domain/`, `storage/` і `ui/page.js`. У кроці проєкту тип запису житиме в доменному модулі, а `ui/page` і `storage` імпортуватимуть його через `import type` — тож від того, що інтерфейс знає про тип, у браузері не з’явиться жодної нової залежності."
      en: "Your project already has `domain/`, `storage/` and `ui/page.js`. In the project step the record type lives in the domain module, and `ui/page` and `storage` import it with `import type` — so the interface knowing the type adds no new dependency in the browser."
