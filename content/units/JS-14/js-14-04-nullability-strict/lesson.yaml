id: js-14-04-nullability-strict
unit: JS-14
title:
  uk: "null, undefined і строгі перевірки"
  en: "Nullability and strict checks"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачити, які звернення до поля типу `string | null` `tsc` відхилить під `strictNullChecks`, і виправити їх звуженням, `??` або `?.`."
    en: "Predict which reads `tsc` rejects under `strictNullChecks` for a field typed `string | null`, and repair them with narrowing, `??` or `?.`."
  - uk: "Пояснити, що стверджує оператор `!`, і чому він прибирає діагностику, не додаючи жодної перевірки."
    en: "Explain what the non-null assertion `!` claims and why it removes the diagnostic without adding any check."
prerequisites: [js-14-03-unions-narrowing, js-02-04-nullish-optional-chaining]
subskills:
  - { family: P-03, skill: "nullability/strict checks", depth: intro }
glossary: [strict-null-checks, non-null-assertion]
selfCheck: [predict-null-reads, null-reads]

blocks:
  - id: null-is-a-member
    kind: explanation
    title:
      uk: "null — окремий варіант типу"
      en: "null is a separate member of the type"
    body:
      uk: |
        У строгому режимі (`"strict": true` у твоєму `tsconfig.json`) діє [[strict-null-checks|`strictNullChecks`]]: `null` і `undefined` **не** входять у `string` чи `number`. Якщо значення може бути відсутнім, це видно в типі: `category: string | null`, `note?: string` (тобто `string | undefined`).

        А раз це union, діють правила з минулого уроку: поки `null` не відсіяно, читати `category.length` не можна — `tsc` пише `TS18047: 'category' is possibly 'null'`. Відсіяти можна так само, як завжди в JavaScript:

        - звуженням: `if (category !== null) { … }` або `if (category) { … }`;
        - `category?.length` — `undefined`, якщо `category` — `null` чи `undefined`;
        - `category ?? "—"` — запасне значення лише для `null` і `undefined`.

        Кожен спосіб — це справжня перевірка, яка спрацює й під час виконання.
      en: |
        In strict mode (`"strict": true` in your `tsconfig.json`), [[strict-null-checks|`strictNullChecks`]] applies: `null` and `undefined` are **not** part of `string` or `number`. If a value may be missing, the type shows it: `category: string | null`, `note?: string` (that is, `string | undefined`).

        And since that is a union, last lesson’s rules apply: until `null` is filtered out, you cannot read `category.length` — `tsc` says `TS18047: 'category' is possibly 'null'`. You filter it out the way you always do in JavaScript:

        - by narrowing: `if (category !== null) { … }` or `if (category) { … }`;
        - `category?.length` is `undefined` when `category` is `null` or `undefined`;
        - `category ?? "—"` gives a fallback only for `null` and `undefined`.

        Each of these is a real check that also works at runtime.

  - id: predict-null-reads
    kind: prediction
    prompt:
      uk: "Під `strictNullChecks` параметр має тип `string | null`. Які з п’яти позначених рядків `tsc` позначить помилкою?"
      en: "Under `strictNullChecks` the parameter has the type `string | null`. Which of the five marked lines does `tsc` flag as errors?"
    code: |
      function categoryInfo(category: string | null) {
        console.log(category.length); // 1
        console.log(category?.length); // 2
        console.log(category ?? "none"); // 3
        console.log(category!.length); // 4
        if (category) {
          console.log(category.length); // 5
        }
      }
    lang: ts
    runnable: false
    answer:
      type: multi
      options:
        - { id: line-1, text: { uk: "Рядок 1", en: "Line 1" } }
        - id: line-2
          text: { uk: "Рядок 2", en: "Line 2" }
          why:
            uk: "`?.` сам перевіряє `null`: якщо `category` — `null`, вираз дає `undefined` і далі не йде."
            en: "`?.` checks for `null` itself: if `category` is `null`, the expression gives `undefined` and goes no further."
        - id: line-3
          text: { uk: "Рядок 3", en: "Line 3" }
          why:
            uk: "`??` нічого не читає з `category`, лише підставляє `\"none\"` замість `null`."
            en: "`??` reads nothing from `category`; it only puts `\"none\"` in place of `null`."
        - id: line-4
          text: { uk: "Рядок 4", en: "Line 4" }
          why:
            uk: "`!` каже `tsc` «тут точно не `null`», і `tsc` вірить на слово — помилки немає. Але це лише твердження: під час виконання з `null` рядок упаде."
            en: "`!` tells `tsc` “this is surely not `null`”, and `tsc` takes your word for it — there is no error. But it is only a claim: at runtime, with `null`, the line crashes."
        - id: line-5
          text: { uk: "Рядок 5", en: "Line 5" }
          why:
            uk: "`if (category)` відсіює `null` (і порожній текст), тож усередині тип уже `string`."
            en: "`if (category)` filters out `null` (and empty text), so inside it the type is already `string`."
      correct: [line-1]
    explanation:
      uk: "Під час підготовки уроку `tsc` 7 повідомив лише про рядок 1: `TS18047: 'category' is possibly 'null'`. Рядки 2, 3 і 5 справді перевіряють `null`. Рядок 4 теж пройшов — але не тому, що безпечний: `!` просто вимикає це питання."
      en: "When the lesson was prepared, `tsc` 7 reported only line 1: `TS18047: 'category' is possibly 'null'`. Lines 2, 3 and 5 really check for `null`. Line 4 passed too — but not because it is safe: `!` simply switches the question off."

  - id: bang-is-a-claim
    kind: explanation
    title:
      uk: "! — твердження без перевірки"
      en: "! is a claim without a check"
    body:
      uk: |
        `value!` — це [[non-null-assertion|non-null assertion]]: ти обіцяєш `tsc`, що тут не буде ні `null`, ні `undefined`. `tsc` знімає діагностику, а коли прибирає типи, зникає й `!`. Від `wish.category!.length` лишається `wish.category.length` — без жодної перевірки.

        Друга спокуса — вимкнути `strict` або `strictNullChecks` у `tsconfig.json`. Тоді `tsc` перестане питати про `null` зовсім, і рядок `category.length` «пройде». Але `null` у даних нікуди не дінеться: помилка просто переїде з терміналу в програму користувача.

        Правило для цього розділу: строгий режим завжди увімкнено, а `!` не використовуємо — замість нього пишемо перевірку.
      en: |
        `value!` is a [[non-null-assertion|non-null assertion]]: you promise `tsc` that there will be neither `null` nor `undefined` here. `tsc` drops the diagnostic, and when it removes the types, the `!` disappears too. `wish.category!.length` becomes `wish.category.length` — with no check at all.

        The second temptation is to turn off `strict` or `strictNullChecks` in `tsconfig.json`. Then `tsc` stops asking about `null` at all, and the line `category.length` “passes”. But the `null` in the data does not go anywhere: the error just moves from the terminal into the user’s program.

        The rule for this unit: strict mode is always on, and we do not use `!` — we write a check instead.

  - id: bang-claims
    kind: example
    runtime: browser-js
    dir: bang-claims
    entry: index.ts
    expectError: true
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      home: { uk: "Дім", en: "Home" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
    title:
      uk: "! на записі з null"
      en: "! on a record with null"
    body:
      uk: "`tsc` пропускає цей файл без жодної помилки: `!` переконав його, що `category` — не `null`. Запусти й подивись, що станеться з другим записом, у якого `category` — `null`."
      en: "`tsc` lets this file through without a single error: the `!` convinced it that `category` is not `null`. Run it and see what happens with the second record, whose `category` is `null`."
    tryIt:
      uk: |
        1. Запусти: перший рядок — довжина назви категорії, а далі картка `TypeError: Cannot read properties of null (reading 'length')`. Обіцянка `!` виявилася неправдою.
        2. Заміни тіло функції на `return wish.category?.length ?? 0;` і запусти: `0` для запису без категорії, помилки немає.
        3. Зміни тип результату функції на `number | null` і поверни просто `wish.category?.length ?? null`. Тепер «немає категорії» видно в типі, і код, що викликає функцію, мусить це врахувати.
      en: |
        1. Run it: the first line is the length of the category name, and then the card `TypeError: Cannot read properties of null (reading 'length')`. The promise of `!` turned out false.
        2. Replace the function body with `return wish.category?.length ?? 0;` and run: `0` for the record without a category, no error.
        3. Change the function’s return type to `number | null` and return just `wish.category?.length ?? null`. Now “no category” is visible in the type, and the code that calls the function has to take it into account.
    limits:
      uk: "Пісочниця прибирає типи (разом з `!`) і виконує JavaScript, що лишився. Типів вона не перевіряє."
      en: "The sandbox removes the types (the `!` included) and runs the JavaScript that remains. It does not check types."

  - id: recall-nullish
    kind: review
    title:
      uk: "Згадай: ?? проти ||"
      en: "Recall: ?? versus ||"
    items:
      - id: zero-price
        from: js-02-04-nullish-optional-chaining
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          const price = 0;
          const note = "";
          console.log(price || "?", price ?? "?");
          console.log(`[${note || "-"}] [${note ?? "-"}]`);
        verify:
          logs: ["? 0", "[-] []"]
        answer:
          type: choice
          options:
            - id: differs
              code: "? 0\n[-] []"
            - id: same
              code: "? ?\n[-] [-]"
              why:
                uk: "`??` підставляє запасне значення лише для `null` і `undefined`. `0` і `\"\"` — справжні значення, тож `??` їх лишає."
                en: "`??` gives the fallback only for `null` and `undefined`. `0` and `\"\"` are real values, so `??` keeps them."
            - id: keeps
              code: "0 0\n[] []"
              why:
                uk: "`||` дивиться на хибність: `0` і `\"\"` хибні, тож `||` бере праву частину."
                en: "`||` looks at falsiness: `0` and `\"\"` are falsy, so `||` takes the right side."
          correct: [differs]
        explanation:
          uk: "Для полів типу `number | null` це важливо: ціна `0` — справжня ціна. `price ?? …` відрізняє «нуль» від «немає», а `price || …` — ні. `tsc` цієї різниці не помітить: обидва варіанти коректні за типами."
          en: "For fields of type `number | null` this matters: a price of `0` is a real price. `price ?? …` tells “zero” from “none”, and `price || …` does not. `tsc` will not notice this difference: both are correct as far as types go."

  - id: null-reads
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: null-reads
    entry: index.ts
    strings:
      currency: { uk: "грн", en: "UAH" }
      noPrice: { uk: "ціну не вказано", en: "no price" }
      noDate: { uk: "без дати", en: "no date" }
      noCategory: { uk: "без категорії", en: "no category" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      home: { uk: "Дім", en: "Home" }
    title:
      uk: "Три читання полів, яких може не бути"
      en: "Three reads of fields that may be missing"
    instructions:
      uk: |
        Під `strictNullChecks` `tsc` позначає всі три функції: `price`, `dueDate` і `category` можуть бути `null`. Зараз програма ще й падає на першому ж записі.

        Виправ кожне читання **перевіркою**, без жодного `!`:

        - `priceText` — для `null` поверни `"ціну не вказано"`; ціна `0` — справжня ціна: `"0.00 грн"`;
        - `dueMonth` — для `null` поверни `"без дати"`;
        - `categoryLabel` — для `null` поверни `"без категорії"`.

        Перевірки викликають функції із записами з `null`, із ціною `0` і зі звичайними значеннями.
      en: |
        Under `strictNullChecks`, `tsc` flags all three functions: `price`, `dueDate` and `category` may be `null`. Right now the program also crashes on the very first record.

        Fix each read with a **check**, without a single `!`:

        - `priceText` — for `null` return `"no price"`; a price of `0` is a real price: `"0.00 UAH"`;
        - `dueMonth` — for `null` return `"no date"`;
        - `categoryLabel` — for `null` return `"no category"`.

        The checks call the functions with records that have `null`, with a price of `0` and with ordinary values.
    testTitles:
      "priceText formats a price, also 0, and names a missing price":
        uk: "`priceText` форматує ціну, зокрема `0`, і називає відсутню ціну"
        en: "`priceText` formats a price, `0` included, and names a missing price"
      "dueMonth gives the year and month, or the no-date text for null":
        uk: "`dueMonth` дає рік і місяць або «без дати» для `null`"
        en: "`dueMonth` gives the year and month, or “no date” for `null`"
      "categoryLabel gives the category in capitals, or the no-category text for null":
        uk: "`categoryLabel` дає категорію великими літерами або «без категорії» для `null`"
        en: "`categoryLabel` gives the category in capitals, or “no category” for `null`"
      "the program prints the three fallback texts":
        uk: "Програма виводить три запасні тексти"
        en: "The program prints the three fallback texts"
    hints:
      nudge:
        uk: "Для кожної функції спитай: що має статися, коли поле — `null`? Цю гілку треба написати до читання поля."
        en: "For each function ask: what should happen when the field is `null`? That branch has to be written before the field is read."
      explanation:
        uk: "Підійде будь-яка справжня перевірка: `if (x === null) return …`, або `x?.method() ?? \"…\"`. Наприклад, для `nights: number | null` рядок `nights?.toString() ?? \"?\"` дає `\"?\"` лише для `null`. Обережно з `||` і `if (!x)`: вони відкидають і `0`, а ціна `0` — справжня ціна. `!` не підходить зовсім — він нічого не перевіряє."
        en: "Any real check works: `if (x === null) return …`, or `x?.method() ?? \"…\"`. For example, for `nights: number | null` the expression `nights?.toString() ?? \"?\"` gives `\"?\"` only for `null`. Be careful with `||` and `if (!x)`: they also reject `0`, and a price of `0` is a real price. `!` does not work at all — it checks nothing."
    solutionNote:
      uk: "У кожній функції `null` відсіяно справжньою перевіркою: `if (wish.price === null)`, а для тексту — `?.` разом із `??`. Після такої перевірки `tsc` знає, що далі тип уже `number` чи `string`, і програма справді не дійде до читання з `null`. Версія з `!` пройшла б `tsc`, але впала б під час виконання; версія з `||` відкинула б ціну `0`."
      en: "In every function `null` is filtered out by a real check: `if (wish.price === null)`, and for text `?.` together with `??`. After such a check `tsc` knows the type is already `number` or `string`, and the program really never reads from `null`. A version with `!` would pass `tsc` but crash at runtime; a version with `||` would reject a price of `0`."
    feedback:
      - when: { test: "priceText formats a price, also 0, and names a missing price" }
        message:
          uk: "Ця перевірка чекає `\"45.00 грн\"` для `45`, `\"0.00 грн\"` для `0` і `\"ціну не вказано\"` для `null`. Якщо для `0` виходить «ціну не вказано», перевірка відкидає й нуль: порівнюй саме з `null` або використай `??`. А якщо для `null` виходить «0.00 грн», запасне значення `0` сховало відсутню ціну: для `null` потрібна окрема гілка."
          en: "This check expects `\"45.00 UAH\"` for `45`, `\"0.00 UAH\"` for `0` and `\"no price\"` for `null`. If `0` gives “no price”, the check rejects zero too: compare with `null` exactly, or use `??`. And if `null` gives “0.00 UAH”, a fallback of `0` hid the missing price: `null` needs a branch of its own."
      - when: { error: TypeError }
        message:
          uk: "`TypeError: Cannot read properties of null` — поле прочитали, не відсіявши `null`. `!` такої перевірки не додає. Якщо всі перевірки не пройшли разом (`type of priceText: expected \"undefined\" to be \"function\"`), програма впала ще під час завантаження — на одному з трьох викликів унизу файлу: виправ першу помилку в консолі."
          en: "`TypeError: Cannot read properties of null` — a field was read without filtering out `null`. `!` adds no such check. If every check fails at once (`type of priceText: expected \"undefined\" to be \"function\"`), the program crashed while loading — on one of the three calls at the bottom of the file: fix the first console error."
    limits:
      uk: "Пісочниця прибирає типи й виконує JavaScript, що лишився. Діагностики `TS18047` показує лише `tsc` у твоїй теці `ts-lab`."
      en: "The sandbox removes the types and runs the JavaScript that remains. Only `tsc` in your `ts-lab` folder shows the `TS18047` diagnostics."

  - id: check-strict
    kind: local-task
    runtime: local-web
    title:
      uk: "strictNullChecks увімкнено й вимкнено"
      en: "strictNullChecks on and off"
    intro:
      uk: "Працюєш у теці `ts-lab`. Результати записано з TypeScript 7.0.2 у macOS."
      en: "You work in the `ts-lab` folder. The results were recorded with TypeScript 7.0.2 on macOS."
    tools:
      - { name: "TypeScript", version: "7.x", note: { uk: "у теці `ts-lab`", en: "in the `ts-lab` folder" } }
    steps:
      - text:
          uk: "Створи `src/l04/index.ts` з **початковим** кодом вправи «Три читання полів, яких може не бути» (кнопка «Почати спочатку» покаже його, а твій код повертає кнопка «Повернути мій код») і перевір."
          en: "Create `src/l04/index.ts` with the **starting** code of the exercise “Three reads of fields that may be missing” (the “Start over” button shows it, and “Restore my code” returns yours) and check."
        command: "npx tsc --noEmit"
        expect:
          uk: "Три помилки `TS18047`: `'wish.price' is possibly 'null'.`, `'task.dueDate' is possibly 'null'.`, `'wish.category' is possibly 'null'.`"
          en: "Three `TS18047` errors: `'wish.price' is possibly 'null'.`, `'task.dueDate' is possibly 'null'.`, `'wish.category' is possibly 'null'.`"
      - text:
          uk: "Запусти ту саму перевірку з вимкненим `strictNullChecks` (лише для цього запуску; `tsconfig.json` не змінюй)."
          en: "Run the same check with `strictNullChecks` switched off (for this run only; do not change `tsconfig.json`)."
        command: "npx tsc --noEmit --strictNullChecks false"
        expect:
          uk: "Три `TS18047` зникли. Код не став кращим — у пісочниці він так само падає на першому записі. Просто `tsc` перестав питати про `null`. Якщо твій `src/l03/result.ts` перевіряє `if (result.ok)`, тепер з’явиться нова помилка: `error TS2339: Property 'errors' does not exist on type 'ValidationResult'.` Без `strictNullChecks` `tsc` не звужує union за полем `true`/`false` після такої перевірки — вимкнений строгий режим зламав правильний код. Тому назад його не вимикаємо."
          en: "The three `TS18047` are gone. The code did not get better — in the sandbox it crashes on the first record just the same. `tsc` simply stopped asking about `null`. If your `src/l03/result.ts` checks `if (result.ok)`, a new error appears now: `error TS2339: Property 'errors' does not exist on type 'ValidationResult'.` Without `strictNullChecks`, `tsc` does not narrow a union by a `true`/`false` field after such a check — turning strict mode off broke correct code. That is why we keep it on."
      - text:
          uk: "Заміни вміст `src/l04/index.ts` своїм розв’язком і перевір у звичайному, строгому режимі."
          en: "Replace the contents of `src/l04/index.ts` with your solution and check in the normal, strict mode."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого не виведено — і цього разу тому, що кожне читання справді перевірено."
          en: "Nothing is printed — and this time because every read is really checked."
    verify:
      - id: three-ts18047
        text:
          uk: "Я бачив три `TS18047` для початкового коду і жодного — з `--strictNullChecks false`."
          en: "I saw three `TS18047` for the starting code and none with `--strictNullChecks false`."
      - id: clean-strict
        text:
          uk: "Мій розв’язок без `!` перевіряється в строгому режимі без помилок."
          en: "My solution without `!` checks in strict mode without errors."
    troubleshooting:
      - problem:
          uk: "Після `--strictNullChecks false` помилки лишилися"
          en: "Errors remain after `--strictNullChecks false`"
        fix:
          uk: "Подивись на код помилки: прапорець вимикає лише перевірки `null`/`undefined` (`TS18047` та схожі). Інші помилки, наприклад `TS7006`, лишаються, а `TS2339` в іншому уроці може навіть з’явитися — див. крок вище."
          en: "Look at the error code: the flag switches off only the `null`/`undefined` checks (`TS18047` and similar). Other errors, for example `TS7006`, remain, and a `TS2339` in another lesson’s file may even appear — see the step above."
    recovery:
      uk: "Прапорець діє лише на один запуск, тож налаштування не зміняться. Розв’язок вправи завжди можна скопіювати з платформи ще раз."
      en: "The flag affects one run only, so the settings do not change. You can always copy the exercise solution from the platform again."

  - id: to-project
    kind: transfer
    capstoneStep: JS-14
    body:
      uk: "У записах проєкту є поля, яких може не бути: `price` і `category` у бажання, `dueDate` у справи. У кроці проєкту вони отримають тип `… | null`, і кожне їх читання — у підсумках, у фільтрі, у відмальовуванні — пройде через перевірку, а не через `!`."
      en: "Your project’s records have fields that may be missing: `price` and `category` of a wish, `dueDate` of a task. In the project step they get the type `… | null`, and every read of them — in totals, in the filter, in rendering — goes through a check, not through `!`."
