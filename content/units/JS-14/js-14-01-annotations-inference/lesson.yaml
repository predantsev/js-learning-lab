id: js-14-01-annotations-inference
unit: JS-14
title:
  uk: "Типи: анотації та виведення"
  en: "Types: annotations and inference"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Анотувати параметр і тип результату функції та передбачити, які типи `tsc` виведе для змінних без анотацій."
    en: "Annotate a parameter and a return type, and predict the type `tsc` infers for locals written without annotations."
  - uk: "Прочитати діагностику `tsc` (код, повідомлення, рядок) і назвати, яке значення порушує який оголошений тип."
    en: "Read a `tsc` diagnostic (code, message, line) and name which value breaks which declared type."
prerequisites: [js-03-01-functions-and-return, js-01-04-booleans-null-undefined]
subskills:
  - { family: P-03, skill: "type annotations/inference", depth: intro }
glossary: [typescript, type-annotation, type-inference, tsc]
selfCheck: [predict-inferred, labels]

blocks:
  - id: types-before-running
    kind: explanation
    title:
      uk: "TypeScript: перевірка до запуску"
      en: "TypeScript: a check before running"
    body:
      uk: |
        [[typescript|TypeScript]] — це JavaScript, до якого можна дописати **типи**: що саме має лежати в змінній чи параметрі. Файли мають розширення `.ts`.

        ```ts
        function formatTotal(amount: number): string {
          return `${amount} UAH`;
        }
        ```

        `amount: number` і `): string` — це [[type-annotation|анотації типів]]: «параметр — число», «функція повертає текст».

        Типи читає окрема програма — компілятор [[tsc]]. Він перевіряє **кожне використання** до того, як код запуститься, і повідомляє, де значення не збігається з оголошеним типом. А тоді прибирає всі типи, і запускається звичайний JavaScript.

        > [!warning]
        > Пісочниця платформи теж уміє запускати `.ts`-файли, але робить лише другу половину: прибирає типи й виконує код. **Типів вона не перевіряє.** Справжню перевірку зробить `tsc` на твоєму комп’ютері — у кінці уроку ти його встановиш.
      en: |
        [[typescript|TypeScript]] is JavaScript to which you can add **types**: what exactly a variable or a parameter should hold. Its files end in `.ts`.

        ```ts
        function formatTotal(amount: number): string {
          return `${amount} UAH`;
        }
        ```

        `amount: number` and `): string` are [[type-annotation|type annotations]]: “the parameter is a number”, “the function returns text”.

        The types are read by a separate program, the compiler [[tsc]]. It checks **every use** before the code runs and reports where a value does not match the declared type. Then it removes all the types, and plain JavaScript runs.

        > [!warning]
        > The platform’s sandbox can run `.ts` files too, but it does only the second half: it removes the types and runs the code. **It does not check types.** The real check is done by `tsc` on your computer — you will install it at the end of this lesson.

  - id: predict-inferred
    kind: prediction
    prompt:
      uk: "У цьому TypeScript-коді анотацію має лише параметр `price`. Які типи `tsc` визначить для решти?"
      en: "In this TypeScript code only the parameter `price` has an annotation. Which types does `tsc` work out for the rest?"
    code: |
      let total = 0;
      let label = "wish";
      const prices = [80, 45];

      function isPriced(price: number) {
        return price > 0;
      }
    lang: ts
    runnable: false
    answer:
      type: choice
      options:
        - id: inferred
          text:
            uk: "`total` — `number`, `label` — `string`, `prices` — `number[]` (масив чисел), `isPriced` повертає `boolean`"
            en: "`total` is `number`, `label` is `string`, `prices` is `number[]` (an array of numbers), `isPriced` returns `boolean`"
        - id: any
          text:
            uk: "Усе, крім `price`, має тип `any` («що завгодно»): анотацій там немає"
            en: "Everything except `price` has the type `any` (“anything”): there are no annotations there"
          why:
            uk: "`tsc` дивиться на значення, яке ти присвоюєш: `0` — число, `\"wish\"` — текст. Анотація потрібна там, де значення ще немає, як у параметра."
            en: "`tsc` looks at the value you assign: `0` is a number, `\"wish\"` is text. An annotation is needed where there is no value yet, as with a parameter."
        - id: returns-number
          text:
            uk: "Ті самі `number`, `string`, `number[]`, але `isPriced` повертає `number`, як і її параметр"
            en: "The same `number`, `string`, `number[]`, but `isPriced` returns `number`, like its parameter"
          why:
            uk: "Тип результату береться з виразу після `return`. `price > 0` — порівняння, а порівняння дає `true` або `false`, тобто `boolean`."
            en: "The return type comes from the expression after `return`. `price > 0` is a comparison, and a comparison gives `true` or `false`, that is, `boolean`."
        - id: exact
          text:
            uk: "Рівно записані значення: `total` — `0`, `label` — `\"wish\"`, `prices` — `[80, 45]`"
            en: "Exactly the written values: `total` is `0`, `label` is `\"wish\"`, `prices` is `[80, 45]`"
          why:
            uk: "`let` можна перепризначити, а в масив — додати інші числа. Тому `tsc` бере загальний тип: будь-яке число, будь-який текст, масив будь-яких чисел."
            en: "A `let` can be reassigned, and other numbers can be added to an array. So `tsc` takes the general type: any number, any text, an array of any numbers."
      correct: [inferred]
    explanation:
      uk: "Це [[type-inference|виведення типів]]: `tsc` бере тип зі значення, а тип результату — з виразу після `return`. Саме такі типи `tsc` 7 повідомив для цих рядків під час підготовки уроку. Тому змінні з одразу присвоєним значенням зазвичай не анотують. (Для `const total = 0` `tsc` запам’ятав би навіть точне значення `0` — про такі типи йтиметься в уроці про union-типи.)"
      en: "This is [[type-inference|type inference]]: `tsc` takes the type from the value, and the return type from the expression after `return`. These are exactly the types `tsc` 7 reported for these lines when the lesson was prepared. That is why variables that get a value right away are usually not annotated. (For `const total = 0`, `tsc` would even remember the exact value `0` — such types come up in the lesson on union types.)"

  - id: where-to-annotate
    kind: explanation
    title:
      uk: "Де анотація потрібна"
      en: "Where an annotation is needed"
    body:
      uk: |
        Виведення працює там, де є значення. У параметра значення немає, доки функцію не викликали, тому:

        - **параметри** анотуй завжди. У строгому режимі `tsc` без анотації скаже: `Parameter 'price' implicitly has an 'any' type` — «параметр неявно має тип `any`», тобто перевірку для нього вимкнено;
        - **тип результату** функції `tsc` виведе сам, але явна анотація — це обіцянка: якщо згодом якась гілка поверне не те, помилка з’явиться в самій функції, а не десь у місці виклику;
        - **змінні з одразу присвоєним значенням** не анотуй: тип і так видно.

        І найважливіше: анотація лише **описує**, що має бути. Вона нічого не перетворює і не перевіряє під час виконання — після `tsc` її просто немає в коді.
      en: |
        Inference works where there is a value. A parameter has no value until the function is called, so:

        - **annotate parameters** always. In strict mode, without an annotation `tsc` says `Parameter 'price' implicitly has an 'any' type` — the check for it is switched off;
        - **the return type** `tsc` can infer by itself, but an explicit annotation is a promise: if a branch later returns the wrong thing, the error appears in the function itself, not somewhere at a call site;
        - **do not annotate variables that get a value right away**: the type is visible anyway.

        And most important: an annotation only **describes** what should be there. It converts nothing and checks nothing while the program runs — after `tsc` it is simply not in the code.

  - id: add-completion
    kind: example
    runtime: browser-js
    dir: add-completion
    entry: index.ts
    title:
      uk: "Анотація не перетворює значення"
      en: "An annotation does not convert a value"
    body:
      uk: |
        Тут параметр `count` оголошено як `number`, а у функцію передають текст `"3"`, як він лежить у `localStorage`. Перш ніж натиснути **Запустити**, виріши: що виведе консоль — `4`, `31` чи помилку?

        Ця пісочниця прибирає типи й запускає код **без перевірки**. `tsc` цей файл не пропустив би — його повідомлення розберемо далі.
      en: |
        Here the parameter `count` is declared as `number`, and the function gets the text `"3"`, as it is stored in `localStorage`. Before you press **Run**, decide: will the console show `4`, `31` or an error?

        This sandbox removes the types and runs the code **without checking**. `tsc` would not let this file through — we will read its message next.
    tryIt:
      uk: |
        1. Запусти: консоль покаже `31`. Анотація `number` не перетворила текст на число, і `+` склеїв `"3"` з `1`.
        2. Заміни `addCompletion(savedCount)` на `addCompletion(Number(savedCount))` і запусти ще раз: `4`. Перетворює `Number(…)`, а не анотація.
        3. Додай у кінець рядок `console.log(addCompletion.toString());` і запусти: консоль покаже код функції таким, яким він справді виконувався, — без `: number`.
      en: |
        1. Run it: the console shows `31`. The annotation `number` did not turn the text into a number, and `+` joined `"3"` and `1`.
        2. Replace `addCompletion(savedCount)` with `addCompletion(Number(savedCount))` and run again: `4`. `Number(…)` converts, the annotation does not.
        3. Add the line `console.log(addCompletion.toString());` at the end and run: the console shows the function’s code as it really ran — without `: number`.
    limits:
      uk: "Пісочниця прибирає типи й виконує JavaScript, що лишився. Типів вона не перевіряє: це робить `tsc` на твоєму комп’ютері."
      en: "The sandbox removes the types and runs the JavaScript that remains. It does not check types: `tsc` on your computer does that."

  - id: reading-a-diagnostic
    kind: explanation
    title:
      uk: "Читаємо діагностику tsc"
      en: "Reading a tsc diagnostic"
    body:
      uk: |
        Для того самого файлу `tsc` 7 у терміналі пише:

        ```text
        src/l01/streak.ts:8:27 - error TS2345: Argument of type 'string' is not assignable to parameter of type 'number'.

        8 console.log(addCompletion(savedCount));
                                    ~~~~~~~~~~

        Found 1 error in src/l01/streak.ts:8
        ```

        Таке повідомлення називають діагностикою. Читай його як повідомлення про помилку з першого розділу:

        - **місце**: файл, рядок `8`, стовпчик `27`; хвилясте підкреслення показує саме значення;
        - **код** `TS2345` — номер цієї діагностики; за ним її легко знайти в пошуку;
        - **пояснення**: «аргумент типу `string` не можна присвоїти параметру типу `number`». Хто що порушує: значення `savedCount` (текст) — оголошений тип параметра `count` (число).

        Різниця з `ReferenceError` у тому, що це повідомлення з’являється **до запуску**: `31` так і не потрапило б у консоль.
      en: |
        For the same file, `tsc` 7 prints in the terminal:

        ```text
        src/l01/streak.ts:8:27 - error TS2345: Argument of type 'string' is not assignable to parameter of type 'number'.

        8 console.log(addCompletion(savedCount));
                                    ~~~~~~~~~~

        Found 1 error in src/l01/streak.ts:8
        ```

        Such a message is called a diagnostic. Read it like the error messages of the first unit:

        - **the place**: the file, line `8`, column `27`; the wavy underline marks the exact value;
        - **the code** `TS2345` — the number of this diagnostic; it is easy to search for;
        - **the explanation**: “an argument of type `string` is not assignable to a parameter of type `number`”. Who breaks what: the value `savedCount` (text) breaks the declared type of the parameter `count` (a number).

        The difference from a `ReferenceError` is that this message appears **before running**: `31` would never have reached the console.

  - id: recall-coercion
    kind: review
    title:
      uk: "Згадай: явне перетворення"
      en: "Recall: explicit conversion"
    items:
      - id: plus-and-times
        from: js-02-02-equality-coercion
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          const quantity = "2";
          console.log(quantity + 5);
          console.log(Number(quantity) + 5);
          console.log(quantity * 5);
        verify:
          logs: ["25", "7", "10"]
        answer:
          type: choice
          options:
            - id: mixed
              code: "25\n7\n10"
            - id: all-numbers
              code: "7\n7\n10"
              why:
                uk: "Якщо хоча б один бік `+` — текст, `+` склеює: `\"2\" + 5` дає `\"25\"`. Число з тексту робить лише явне `Number(…)`."
                en: "If at least one side of `+` is text, `+` joins: `\"2\" + 5` gives `\"25\"`. Only an explicit `Number(…)` makes a number from text."
            - id: all-text
              code: "25\n25\n25"
              why:
                uk: "`Number(quantity)` уже число, тож `+` додає: `7`. А `*` взагалі не вміє склеювати й неявно перетворює текст на число: `10`."
                en: "`Number(quantity)` is already a number, so `+` adds: `7`. And `*` cannot join at all and implicitly converts the text to a number: `10`."
          correct: [mixed]
        explanation:
          uk: "Неявне приведення типів робить те, що вирішив оператор: `+` склеює, `*` рахує. Явне `Number(…)` робить те, що вирішив ти. TypeScript не замінює жодного з них: він лише заздалегідь показує, де текст потрапляє туди, де чекали число."
          en: "Implicit coercion does what the operator decided: `+` joins, `*` calculates. An explicit `Number(…)` does what you decided. TypeScript replaces neither: it only shows in advance where text gets to a place that expected a number."

  - id: labels
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: labels
    entry: index.ts
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      free: { uk: "безкоштовно", en: "free" }
      currency: { uk: "грн", en: "UAH" }
    title:
      uk: "Анотуй функції й виправ виклик"
      en: "Annotate the functions and fix a call"
    instructions:
      uk: |
        Значення в об’єкті `form` прийшли з форми, тож усі вони — текст.

        1. Додай анотації **лише** параметрам і типам результату трьох функцій: `formatTitle` приймає й повертає текст, `formatPrice` приймає число й повертає текст, `isEmpty` приймає текст і повертає `boolean`. Змінну `form` не анотуй.
        2. Тепер видно, що один виклик передає функції текст замість числа. Виправ **виклик**: перетвори значення явно. Самі функції не змінюй.

        Перевірки запускають функції з різними значеннями й читають, що програма вивела. Анотацій вони не бачать: їх перевіриш `tsc` у локальному завданні нижче.
      en: |
        The values in the `form` object came from a form, so all of them are text.

        1. Add annotations **only** to the parameters and return types of the three functions: `formatTitle` takes and returns text, `formatPrice` takes a number and returns text, `isEmpty` takes text and returns `boolean`. Do not annotate the `form` variable.
        2. Now you can see that one call passes text to a function instead of a number. Fix the **call**: convert the value explicitly. Do not change the functions themselves.

        The checks call the functions with different values and read what the program printed. They do not see annotations: you will check those with `tsc` in the local task below.
    testTitles:
      "formatTitle removes the spaces around a title":
        uk: "`formatTitle` прибирає пробіли навколо назви"
        en: "`formatTitle` removes the spaces around a title"
      "formatPrice gives the free label for 0 and the amount with the currency otherwise":
        uk: "`formatPrice` дає «безкоштовно» для `0`, а інакше — суму з валютою"
        en: "`formatPrice` gives “free” for `0`, and the amount with the currency otherwise"
      "isEmpty is true only for text without visible characters":
        uk: "`isEmpty` дає `true` лише для тексту без видимих символів"
        en: "`isEmpty` is `true` only for text without visible characters"
      "the program prints the title, the free label for the form price, and true":
        uk: "Програма виводить назву, «безкоштовно» для ціни з форми і `true`"
        en: "The program prints the title, “free” for the price from the form, and `true`"
    hints:
      nudge:
        uk: "Знайди функцію, чий параметр ти анотуєш як `number`, і подивись, що їй передають у виклику внизу файлу. Яке там значення: число чи текст?"
        en: "Find the function whose parameter you annotate as `number` and look at what the call at the bottom of the file passes to it. Is that value a number or text?"
      explanation:
        uk: "`formatPrice` порівнює `price === 0`. Текст `\"0\"` строго не дорівнює числу `0`, тому з текстом функція ніколи не скаже «безкоштовно». Анотація `price: number` цього не виправить — вона нічого не перетворює. Перетворити треба там, де текст стає числом, тобто в місці виклику, так само як `Number(\"12\")` робить із `\"12\"` число `12`."
        en: "`formatPrice` compares `price === 0`. The text `\"0\"` is not strictly equal to the number `0`, so with text the function never says “free”. The annotation `price: number` does not fix that — it converts nothing. You convert where text becomes a number, that is, at the call, just as `Number(\"12\")` turns `\"12\"` into the number `12`."
    solutionNote:
      uk: "Анотації описали намір: `formatPrice` чекає число. Виклик `formatPrice(form.price)` цей намір порушував — `tsc` повідомив би `TS2345`, а під час виконання функція тихо виводила «0 грн». Явне `Number(form.price)` у місці виклику виправило і тип, і поведінку. `Number.parseInt(form.price, 10)` тут теж підходить."
      en: "The annotations described the intent: `formatPrice` expects a number. The call `formatPrice(form.price)` broke that intent — `tsc` would report `TS2345`, and at runtime the function quietly printed “0 UAH”. An explicit `Number(form.price)` at the call fixed both the type and the behavior. `Number.parseInt(form.price, 10)` works here too."
    feedback:
      - when: { test: "the program prints the title, the free label for the form price, and true" }
        message:
          uk: "Ця перевірка чекає в консолі три рядки: назву без пробілів, «безкоштовно» і `true`. Якщо другим рядком виходить «0 грн», функція отримує текст `\"0\"`: анотація його не перетворює, перетвори значення явно в місці виклику."
          en: "This check expects three lines in the console: the title without spaces, “free” and `true`. If the second line is “0 UAH”, the function receives the text `\"0\"`: an annotation does not convert it, so convert the value explicitly at the call."
      - when: { test: "formatPrice gives the free label for 0 and the amount with the currency otherwise" }
        message:
          uk: "Ця перевірка викликає `formatPrice(0)` і `formatPrice(45)` з числами. Функцію змінювати не треба: виправлення — у виклику внизу файлу."
          en: "This check calls `formatPrice(0)` and `formatPrice(45)` with numbers. The function does not need to change: the fix belongs in the call at the bottom of the file."
      - when: { error: TypeError }
        message:
          uk: "`TypeError`: значення не того виду, якого чекає код. Якщо всі перевірки кажуть «… is not a function», програма впала ще під час завантаження — прочитай рядок у картці помилки й порівняй зі своєю зміною."
          en: "`TypeError`: a value is not of the kind the code expects. If every check says “… is not a function”, the program crashed while loading — read the line in the error card and compare it with your change."
    limits:
      uk: "Пісочниця прибирає типи й виконує JavaScript, що лишився. Анотації перевіряє лише `tsc` на твоєму комп’ютері."
      en: "The sandbox removes the types and runs the JavaScript that remains. Only `tsc` on your computer checks the annotations."

  - id: set-up-ts-lab
    kind: local-task
    runtime: local-web
    title:
      uk: "Встанови tsc і перевір свій файл"
      en: "Install tsc and check your file"
    intro:
      uk: |
        Ти створиш окрему теку-лабораторію `ts-lab`, де житимуть TypeScript-файли цього розділу. До проєкту вона не належить і нічого в ньому не змінює. Наступні уроки використовуватимуть її знову.

        Команди однакові для macOS, Linux і Windows PowerShell, якщо не сказано інше. Їх перевірено в macOS із Node.js v25.2.1, npm 11.6.2 і TypeScript 7.0.2.
      en: |
        You will create a separate lab folder `ts-lab` for the TypeScript files of this unit. It is not part of your project and changes nothing in it. The next lessons use it again.

        The commands are the same on macOS, Linux and Windows PowerShell unless stated otherwise. They were checked on macOS with Node.js v25.2.1, npm 11.6.2 and TypeScript 7.0.2.
    tools:
      - { name: "Node.js", version: "22.13+" }
      - { name: "npm", version: "10+", note: { uk: "встановлюється разом із Node.js", en: "comes with Node.js" } }
      - { name: "TypeScript", version: "7.x", note: { uk: "встановиш у цьому завданні; він дає команду `tsc`", en: "you install it in this task; it provides the `tsc` command" } }
      - { name: "VS Code", note: { uk: "будь-яка свіжа версія", en: "any recent version" } }
    steps:
      - text:
          uk: "Створи теку. Так у macOS і Linux; у Windows PowerShell пиши без `-p`: `mkdir ~/jsll/ts-lab`."
          en: "Create the folder. This is for macOS and Linux; in Windows PowerShell write it without `-p`: `mkdir ~/jsll/ts-lab`."
        command: "mkdir -p ~/jsll/ts-lab"
      - text:
          uk: "Перейди в неї. Усі наступні команди цього розділу запускай саме тут."
          en: "Go into it. Run every later command of this unit right here."
        command: "cd ~/jsll/ts-lab"
      - text:
          uk: "Створи `package.json`."
          en: "Create `package.json`."
        command: "npm init -y"
        expect:
          uk: "`Wrote to …/ts-lab/package.json:` і вміст файлу."
          en: "`Wrote to …/ts-lab/package.json:` and the file’s contents."
      - text:
          uk: "Познач, що файли тут — ES-модулі, як у браузері."
          en: "Mark the files here as ES modules, as in the browser."
        command: "npm pkg set type=module"
        expect:
          uk: "Команда нічого не виводить, а в `package.json` з’являється `\"type\": \"module\"`."
          en: "The command prints nothing, and `package.json` now has `\"type\": \"module\"`."
      - text:
          uk: "Встанови TypeScript як інструмент розробки (`--save-dev`: у самій програмі він не потрібен)."
          en: "Install TypeScript as a development tool (`--save-dev`: the program itself does not need it)."
        command: "npm install --save-dev typescript"
        expect:
          uk: "`added 2 packages …` і `found 0 vulnerabilities`. Кількість пакетів залежить від системи."
          en: "`added 2 packages …` and `found 0 vulnerabilities`. The number of packages depends on the system."
      - text:
          uk: "Перевір версію. `npx` запускає команду з пакета, встановленого в цій теці."
          en: "Check the version. `npx` runs a command from a package installed in this folder."
        command: "npx tsc --version"
        expect:
          uk: "`Version 7.0.2` (або новіша 7.x)."
          en: "`Version 7.0.2` (or a newer 7.x)."
      - text:
          uk: |
            Відкрий теку у VS Code (`code .` або **File → Open Folder…**) і створи поруч із `package.json` файл `tsconfig.json` — налаштування для `tsc`:

            ```json
            {
              "compilerOptions": {
                "strict": true,
                "target": "es2023",
                "lib": ["es2023", "dom"],
                "module": "esnext",
                "moduleResolution": "bundler",
                "moduleDetection": "force",
                "verbatimModuleSyntax": true,
                "rewriteRelativeImportExtensions": true,
                "rootDir": "src",
                "outDir": "out",
                "types": []
              },
              "include": ["src"]
            }
            ```

            Головне тут: `strict` вмикає всі строгі перевірки, `include` каже перевіряти теку `src`, а `outDir` — куди класти JavaScript без типів. Решту рядків пояснимо, коли вони знадобляться.
          en: |
            Open the folder in VS Code (`code .` or **File → Open Folder…**) and create a file `tsconfig.json` next to `package.json` — the settings for `tsc`:

            ```json
            {
              "compilerOptions": {
                "strict": true,
                "target": "es2023",
                "lib": ["es2023", "dom"],
                "module": "esnext",
                "moduleResolution": "bundler",
                "moduleDetection": "force",
                "verbatimModuleSyntax": true,
                "rewriteRelativeImportExtensions": true,
                "rootDir": "src",
                "outDir": "out",
                "types": []
              },
              "include": ["src"]
            }
            ```

            What matters now: `strict` turns on all strict checks, `include` says to check the folder `src`, and `outDir` says where to put the JavaScript without types. The other lines are explained when they are needed.
      - text:
          uk: "Створи файл `src/l01/index.ts`, встав туди свій розв’язок вправи «Анотуй функції й виправ виклик» і запусти перевірку."
          en: "Create the file `src/l01/index.ts`, paste your solution of the exercise “Annotate the functions and fix a call” into it and run the check."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого: коли помилок немає, `tsc` мовчить і просто повертає запрошення терміналу. `--noEmit` означає «лише перевір, файлів не створюй»."
          en: "Nothing: when there are no errors, `tsc` stays silent and simply returns the terminal prompt. `--noEmit` means “only check, create no files”."
      - text:
          uk: "Поверни у виклику `formatPrice(form.price)` (без перетворення), збережи файл і запусти ту саму команду ще раз."
          en: "Put `formatPrice(form.price)` (without the conversion) back in the call, save the file and run the same command again."
        command: "npx tsc --noEmit"
        expect:
          uk: "`src/l01/index.ts:20:25 - error TS2345: Argument of type 'string' is not assignable to parameter of type 'number'.`, підкреслене `form.price` і `Found 1 error in src/l01/index.ts:20`. Номер рядка й стовпчика може відрізнятися, якщо твій файл відформатовано інакше."
          en: "`src/l01/index.ts:20:25 - error TS2345: Argument of type 'string' is not assignable to parameter of type 'number'.`, an underlined `form.price` and `Found 1 error in src/l01/index.ts:20`. The line and column may differ if your file is formatted differently."
      - text:
          uk: "Поверни виправлений виклик, а натомість прибери анотацію `: number` у параметра `price`. Запусти перевірку знову."
          en: "Restore the fixed call, and instead remove the annotation `: number` from the parameter `price`. Run the check again."
        command: "npx tsc --noEmit"
        expect:
          uk: "`error TS7006: Parameter 'price' implicitly has an 'any' type.` — у строгому режимі параметр без анотації є помилкою."
          en: "`error TS7006: Parameter 'price' implicitly has an 'any' type.` — in strict mode a parameter without an annotation is an error."
      - text:
          uk: "Поверни анотацію, а тоді запусти `tsc` без `--noEmit` і відкрий створений файл `out/l01/index.js`."
          en: "Put the annotation back, then run `tsc` without `--noEmit` and open the created file `out/l01/index.js`."
        command: "npx tsc"
        expect:
          uk: "Команда нічого не виводить. У `out/l01/index.js` той самий код без жодного `: string`, `: number` чи `: boolean`, а в кінці — рядок `export {};` (так `tsc` позначає файл як модуль)."
          en: "The command prints nothing. `out/l01/index.js` holds the same code without any `: string`, `: number` or `: boolean`, and ends with the line `export {};` (this is how `tsc` marks the file as a module)."
      - text:
          uk: "У VS Code наведи вказівник миші на назву `form` у `src/l01/index.ts`."
          en: "In VS Code, hover the mouse pointer over the name `form` in `src/l01/index.ts`."
        expect:
          uk: "Підказка показує виведений тип: `const form: { title: string; price: string; note: string; }`. Усі три поля — `string`: саме тому виклик потребував `Number(…)`."
          en: "The tooltip shows the inferred type: `const form: { title: string; price: string; note: string; }`. All three fields are `string`: that is why the call needed `Number(…)`."
    verify:
      - id: tsc-installed
        text:
          uk: "`npx tsc --version` показав версію 7.x."
          en: "`npx tsc --version` showed a 7.x version."
      - id: clean-check
        text:
          uk: "З моїм розв’язком `npx tsc --noEmit` нічого не вивів."
          en: "With my solution, `npx tsc --noEmit` printed nothing."
      - id: read-ts2345
        text:
          uk: "Я побачив `TS2345` для виклику з текстом і `TS7006` для параметра без анотації та зрозумів, яке значення порушує який тип."
          en: "I saw `TS2345` for the call with text and `TS7006` for the parameter without an annotation, and understood which value breaks which type."
      - id: no-types-left
        text:
          uk: "В `out/l01/index.js` не лишилося жодної анотації."
          en: "No annotation is left in `out/l01/index.js`."
    troubleshooting:
      - problem:
          uk: "`tsc` друкує довгу довідку («COMMON COMMANDS…») замість перевірки"
          en: "`tsc` prints a long help text (“COMMON COMMANDS…”) instead of checking"
        fix:
          uk: "У поточній теці немає `tsconfig.json`. Перевір `pwd` (у PowerShell — `Get-Location`): ти маєш бути в `ts-lab`, а файл має називатися саме `tsconfig.json`."
          en: "There is no `tsconfig.json` in the current folder. Check `pwd` (in PowerShell, `Get-Location`): you must be in `ts-lab`, and the file must be named exactly `tsconfig.json`."
      - problem:
          uk: "`error TS5112: tsconfig.json is present but will not be loaded if files are specified on commandline.`"
          en: "`error TS5112: tsconfig.json is present but will not be loaded if files are specified on commandline.`"
        fix:
          uk: "Ти дописав до команди назву файлу (`npx tsc src/l01/index.ts`). Запускай без назви: `npx tsc --noEmit` сам перевіряє всю теку `src`."
          en: "You added a file name to the command (`npx tsc src/l01/index.ts`). Run it without a name: `npx tsc --noEmit` checks the whole `src` folder by itself."
      - problem:
          uk: "`error TS18003: No inputs were found in config file …` або перевірка не бачить твого файлу"
          en: "`error TS18003: No inputs were found in config file …`, or the check does not see your file"
        fix:
          uk: "Файл має лежати всередині `src` і мати розширення `.ts`, а не `.js` чи `.ts.txt`."
          en: "The file must be inside `src` and end in `.ts`, not `.js` or `.ts.txt`."
      - problem:
          uk: "Windows PowerShell: `npx` не запускається, бо «running scripts is disabled on this system»"
          en: "Windows PowerShell: `npx` does not start because “running scripts is disabled on this system”"
        fix:
          uk: "Запусти команду як `npx.cmd tsc --noEmit` або виконуй команди в Git Bash, як у розділі про локальний запуск."
          en: "Run the command as `npx.cmd tsc --noEmit`, or run the commands in Git Bash, as in the unit on running locally."
      - problem:
          uk: "З’явилися помилки у файлі з іншого уроку"
          en: "Errors appear in a file from another lesson"
        fix:
          uk: "`tsc` перевіряє всю теку `src`. Кожен урок лишай у стані без помилок, коли закінчуєш його, — або тимчасово перенеси незавершений файл за межі `src`."
          en: "`tsc` checks the whole `src` folder. Leave every lesson without errors when you finish it — or temporarily move an unfinished file outside `src`."
    recovery:
      uk: "Теку `ts-lab` можна видалити й створити заново за цими кроками: твій проєкт вона не зачіпає. Розв’язок вправи зберігається в платформі, тож його завжди можна скопіювати ще раз."
      en: "You can delete the `ts-lab` folder and create it again with these steps: it does not touch your project. Your solution of the exercise is kept in the platform, so you can always copy it again."

  - id: to-project
    kind: transfer
    capstoneStep: JS-14
    body:
      uk: "У кроці проєкту цього розділу доменний модуль стане `.ts`-файлом. Першим ділом там анотують параметри функцій `validate…` і `summarize…` — те саме, що ти щойно зробив: параметри й результати описуєш ти, решту `tsc` виводить сам."
      en: "In this unit’s project step the domain module becomes a `.ts` file. The first thing annotated there are the parameters of the `validate…` and `summarize…` functions — the same thing you just did: you describe parameters and results, and `tsc` infers the rest."
