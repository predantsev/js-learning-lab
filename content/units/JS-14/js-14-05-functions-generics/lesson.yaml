id: js-14-05-functions-generics
unit: JS-14
title:
  uk: "Типізовані функції та generics"
  en: "Typed functions and generics"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Типізувати параметри функції, необов’язкові параметри, результат і параметр-callback."
    en: "Type a function’s parameters, optional parameters, return value and a callback parameter."
  - uk: "Написати generic-хелпер на зразок `byId<T extends { id: string }>(items: readonly T[], id: string): T | undefined` і передбачити, чим стане `T` у кожному виклику."
    en: "Write a generic helper such as `byId<T extends { id: string }>(items: readonly T[], id: string): T | undefined` and predict what `T` becomes at each call."
prerequisites: [js-14-04-nullability-strict, js-03-06-higher-order-callbacks]
subskills:
  - { family: P-03, skill: "functions/generics", depth: intro }
glossary: [generic-function, type-parameter, generic-constraint]
selfCheck: [predict-first, sort-by]

blocks:
  - id: function-types
    kind: explanation
    title:
      uk: "Тип функції: параметри, ?, callback"
      en: "A function’s type: parameters, ?, callback"
    body:
      uk: |
        Параметри й результат ти вже анотуєш. Ще два випадки:

        ```ts
        function formatAmount(amountMinor: number, currency?: string): string {
          return `${(amountMinor / 100).toFixed(2)} ${currency ?? "UAH"}`;
        }

        function countWhere(items: string[], test: (item: string) => boolean): number {
          return items.filter(test).length;
        }
        ```

        - `currency?: string` — необов’язковий параметр: його можна не передавати, і тоді він `undefined`. Тому всередині — `??`, як у минулому уроці.
        - `test: (item: string) => boolean` — тип **функції-callback**: вона отримує текст і повертає `boolean`. Стрілка тут — частина запису типу, а не код.

        Коли ти передаєш стрілкову функцію в `countWhere`, її параметр анотувати не треба: `tsc` бере тип з оголошення `test`.
      en: |
        You already annotate parameters and results. Two more cases:

        ```ts
        function formatAmount(amountMinor: number, currency?: string): string {
          return `${(amountMinor / 100).toFixed(2)} ${currency ?? "UAH"}`;
        }

        function countWhere(items: string[], test: (item: string) => boolean): number {
          return items.filter(test).length;
        }
        ```

        - `currency?: string` is an optional parameter: you may leave it out, and then it is `undefined`. That is why there is `??` inside, as in the last lesson.
        - `test: (item: string) => boolean` is the type of a **callback function**: it gets text and returns `boolean`. The arrow here is part of the type, not code.

        When you pass an arrow function to `countWhere`, its parameter needs no annotation: `tsc` takes the type from the declaration of `test`.

  - id: type-parameters
    kind: explanation
    title:
      uk: "Generic: тип як параметр"
      en: "Generic: a type as a parameter"
    body:
      uk: |
        `countWhere` працює лише з текстом. А хелпер, що бере перший елемент, має працювати і з бажаннями, і зі справами — і при цьому пам’ятати, **що** саме повернув:

        ```ts
        function first<T>(items: readonly T[]): T | undefined {
          return items[0];
        }
        ```

        `<T>` — [[type-parameter|параметр типу]]: так само як `items` — місце для значення, `T` — місце для типу. Таку функцію називають [[generic-function|generic-функцією]]. У кожному виклику `tsc` сам виводить `T` з аргументу: для масиву бажань `T` — тип бажання, і результат — «бажання або `undefined`». `readonly T[]` обіцяє, що функція масив не змінює.

        Якщо функції потрібне щось від `T`, це записують [[generic-constraint|обмеженням]]: `<T extends { id: string }>` — «будь-який тип, у якого є текстове `id`».
      en: |
        `countWhere` works only with text. But a helper that takes the first element should work with wishes and with tasks alike — and still remember **what** exactly it returned:

        ```ts
        function first<T>(items: readonly T[]): T | undefined {
          return items[0];
        }
        ```

        `<T>` is a [[type-parameter|type parameter]]: just as `items` is a slot for a value, `T` is a slot for a type. Such a function is called a [[generic-function|generic function]]. At each call `tsc` infers `T` from the argument: for an array of wishes `T` is the wish type, and the result is “a wish or `undefined`”. `readonly T[]` promises that the function does not change the array.

        If the function needs something from `T`, you write a [[generic-constraint|constraint]]: `<T extends { id: string }>` means “any type that has a text `id`”.

  - id: predict-first
    kind: prediction
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
    prompt:
      uk: "Що повертає `first` у кожному з трьох викликів, за даними `tsc`?"
      en: "What does `first` return in each of the three calls, according to `tsc`?"
    code: |
      type Wish = { id: string; name: string; price: number | null };

      function first<T>(items: readonly T[]): T | undefined {
        return items[0];
      }

      const wishes: Wish[] = [{ id: "w-01", name: "%%headphones%%", price: 80 }];

      const a = first(wishes);
      const b = first([]);
      const c = first([80, 45]);
    lang: ts
    runnable: false
    answer:
      type: choice
      options:
        - id: inferred
          text:
            uk: "`a` — `Wish | undefined`, `b` — `undefined`, `c` — `number | undefined`"
            en: "`a` is `Wish | undefined`, `b` is `undefined`, `c` is `number | undefined`"
        - id: any
          text:
            uk: "Усі три — `any`: `T` приймає що завгодно"
            en: "All three are `any`: `T` accepts anything"
          why:
            uk: "`T` приймає будь-який тип, але **запам’ятовує** його в кожному виклику: з масиву `Wish[]` виходить `Wish`. `any` нічого не пам’ятає й вимикає перевірку."
            en: "`T` accepts any type but **remembers** it at each call: an array `Wish[]` gives `Wish`. `any` remembers nothing and switches checking off."
        - id: explicit
          text:
            uk: "Помилка: тип треба вказати явно, `first<Wish>(wishes)`"
            en: "An error: the type must be given explicitly, `first<Wish>(wishes)`"
          why:
            uk: "Явно вказати можна, але не обов’язково: `tsc` виводить `T` з аргументу, так само як виводить тип змінної зі значення."
            en: "You may give it explicitly, but you do not have to: `tsc` infers `T` from the argument, just as it infers a variable’s type from its value."
        - id: no-undefined
          text:
            uk: "`a` — `Wish`, `b` — помилка, `c` — `number`"
            en: "`a` is `Wish`, `b` is an error, `c` is `number`"
          why:
            uk: "Тип результату — `T | undefined`, бо масив може бути порожнім. Для `[]` `T` нічим не заповнено (`never`), тож лишається тільки `undefined`."
            en: "The return type is `T | undefined`, because the array may be empty. For `[]` nothing fills `T` (`never`), so only `undefined` is left."
      correct: [inferred]
    explanation:
      uk: "Саме ці типи `tsc` 7 повідомив під час підготовки уроку. `T` — не «що завгодно», а «той самий тип, що прийшов»: для `a` `tsc` далі не дасть прочитати `a.nmae` (описку) і нагадає, що `a` може бути `undefined`."
      en: "These are exactly the types `tsc` 7 reported when the lesson was prepared. `T` is not “anything” but “the same type that came in”: for `a`, `tsc` will not let you read `a.nmae` (a typo) and will remind you that `a` may be `undefined`."

  - id: by-id
    kind: example
    runtime: browser-js
    dir: by-id
    entry: index.ts
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      water: { uk: "Пити воду", en: "Drink water" }
    title:
      uk: "Один byId для бажань і звичок"
      en: "One byId for wishes and habits"
    body:
      uk: "`byId` має обмеження `T extends { id: string }`, тож підходить і для бажань, і для звичок. Запусти: назва й ціна лампи, кількість виконань звички і `undefined` для невідомого `id`."
      en: "`byId` has the constraint `T extends { id: string }`, so it fits wishes and habits alike. Run it: the lamp’s name and price, the habit’s completion count and `undefined` for an unknown `id`."
    tryIt:
      uk: |
        1. Додай у кінець `console.log(byId.toString());` і запусти: від `<T extends …>` і всіх анотацій не лишилося нічого — generic існує лише для `tsc`.
        2. Заміни `console.log(lamp?.name, lamp?.price);` на `console.log(lamp?.name, lamp?.price, lamp?.completions);`. Пісочниця виведе `undefined`. `tsc` цей рядок відхилив би: `TS2339: Property 'completions' does not exist on type '{ id: string; name: string; price: number; }'` — він знає, що `lamp` — бажання.
        3. А тепер уяви оголошення `function byId(items: any[], id: string): any`. З ним `tsc` той самий рядок **пропускає** — тип бажання загубився. Це перевірено з TypeScript 7.0.2; у локальному завданні нижче побачиш сам.
      en: |
        1. Add `console.log(byId.toString());` at the end and run: nothing is left of `<T extends …>` and of all the annotations — a generic exists for `tsc` only.
        2. Replace `console.log(lamp?.name, lamp?.price);` with `console.log(lamp?.name, lamp?.price, lamp?.completions);`. The sandbox prints `undefined`. `tsc` would reject this line: `TS2339: Property 'completions' does not exist on type '{ id: string; name: string; price: number; }'` — it knows `lamp` is a wish.
        3. Now imagine the declaration `function byId(items: any[], id: string): any`. With it, `tsc` **lets** the same line through — the wish type got lost. This was checked with TypeScript 7.0.2; you will see it yourself in the local task below.
    limits:
      uk: "Пісочниця прибирає типи (разом з `<T>`) і виконує JavaScript, що лишився. Типів вона не перевіряє."
      en: "The sandbox removes the types (`<T>` included) and runs the JavaScript that remains. It does not check types."

  - id: recall-sort
    kind: review
    title:
      uk: "Згадай: sort змінює масив"
      en: "Recall: sort changes the array"
    items:
      - id: sort-mutates
        from: js-05-05-sorting-comparator
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          const prices = [240, 18, 45];
          const sorted = prices.sort((a, b) => a - b);
          console.log(sorted.join(" "));
          console.log(prices.join(" "));
          console.log(sorted === prices);
        verify:
          logs: ["18 45 240", "18 45 240", "true"]
        answer:
          type: choice
          options:
            - id: same-array
              code: "18 45 240\n18 45 240\ntrue"
            - id: copy
              code: "18 45 240\n240 18 45\nfalse"
              why:
                uk: "`sort` упорядковує масив **на місці** й повертає той самий масив, а не копію."
                en: "`sort` orders the array **in place** and returns the same array, not a copy."
            - id: text-order
              code: "18 240 45\n18 240 45\ntrue"
              why:
                uk: "З порівнювачем `(a, b) => a - b` порядок числовий. Текстовий порядок був би без нього."
                en: "With the comparator `(a, b) => a - b` the order is numeric. A text order would come without it."
          correct: [same-array]
        explanation:
          uk: "Тому хелпер, який обіцяє не змінювати масив, сортує копію (`[...items]`, `items.slice()` або `items.toSorted(…)`). Тип `readonly T[]` перетворює цю обіцянку на перевірку: на такому масиві `tsc` не дасть викликати `sort`."
          en: "That is why a helper that promises not to change the array sorts a copy (`[...items]`, `items.slice()` or `items.toSorted(…)`). The type `readonly T[]` turns that promise into a check: on such an array `tsc` will not let you call `sort`."

  - id: sort-by
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: sort-by
    entry: index.ts
    strings:
      bike: { uk: "Велосипед", en: "Bicycle" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      water: { uk: "Полити квіти", en: "Water the plants" }
    title:
      uk: "Generic sortBy"
      en: "A generic sortBy"
    instructions:
      uk: |
        Напиши `sortBy<T>(items: readonly T[], key: (item: T) => number): T[]`:

        - повертає **новий** масив, упорядкований за числом, яке дає `key`, від меншого до більшого;
        - масив, який отримала, не змінює.

        Програма вже сортує бажання за ціною і справи за рангом пріоритету — з одним і тим самим `sortBy`. Перевірки викликають його ще й з витратами та числами.
      en: |
        Write `sortBy<T>(items: readonly T[], key: (item: T) => number): T[]`:

        - it returns a **new** array, ordered by the number `key` gives, smallest first;
        - it does not change the array it received.

        The program already sorts wishes by price and tasks by priority rank — with one and the same `sortBy`. The checks also call it with expenses and with numbers.
    testTitles:
      "sortBy returns the items ordered by the key, smallest first":
        uk: "`sortBy` повертає елементи за зростанням ключа"
        en: "`sortBy` returns the items ordered by the key, smallest first"
      "sortBy returns a new array and leaves the given one unchanged":
        uk: "`sortBy` повертає новий масив, а отриманий лишає без змін"
        en: "`sortBy` returns a new array and leaves the given one unchanged"
      "the program prints the sorted ids and the unchanged first items":
        uk: "Програма виводить упорядковані `id` і незмінені перші елементи"
        en: "The program prints the sorted ids and the unchanged first items"
    hints:
      nudge:
        uk: "Запис типу вже є в умові — почни з нього. Потім подумай: який метод масиву сортує, і що він робить з масивом, на якому його викликали?"
        en: "The type is already in the task — start with it. Then think: which array method sorts, and what does it do to the array it is called on?"
      explanation:
        uk: "`sort` змінює масив на місці, тож сортують копію. Порівнювач отримує два елементи; щоб порівняти їх за ключем, виклич `key` для кожного й відніми одне від одного. Схоже, але для іншої задачі: `[...names].sort((a, b) => a.length - b.length)` упорядковує копію назв за довжиною, не чіпаючи `names`."
        en: "`sort` changes the array in place, so you sort a copy. The comparator gets two elements; to compare them by the key, call `key` for each and subtract one from the other. A similar thing for another task: `[...names].sort((a, b) => a.length - b.length)` orders a copy of the names by length without touching `names`."
    solutionNote:
      uk: "`T` виводиться з масиву в кожному виклику: для `wishes` — бажання, тож у `(wish) => wish.price` параметр `wish` уже типізований і анотація не потрібна. `readonly T[]` не дає випадково викликати `items.sort`: `tsc` повідомив би `TS2339: Property 'sort' does not exist on type 'readonly T[]'`. Копія через spread, `slice()` чи `toSorted` — усі підходять; назва параметра типу (`T`, `Item`) — справа смаку."
      en: "`T` is inferred from the array at each call: for `wishes` it is a wish, so in `(wish) => wish.price` the parameter `wish` is already typed and needs no annotation. `readonly T[]` prevents an accidental `items.sort`: `tsc` would report `TS2339: Property 'sort' does not exist on type 'readonly T[]'`. A copy with spread, `slice()` or `toSorted` all work; the name of the type parameter (`T`, `Item`) is a matter of taste."
    feedback:
      - when: { test: "sortBy returns a new array and leaves the given one unchanged" }
        message:
          uk: "Ця перевірка чекає, що `sortBy` поверне інший масив, а отриманий збереже свій порядок. `sort` упорядковує той масив, на якому його викликали, — сортуй копію."
          en: "This check expects `sortBy` to return a different array and the received one to keep its order. `sort` orders the array it is called on — sort a copy."
      - when: { test: "sortBy returns the items ordered by the key, smallest first" }
        message:
          uk: "Ця перевірка чекає порядок за зростанням числа, яке повертає `key`. Порівнюй `key(a)` з `key(b)`, а не самі елементи."
          en: "This check expects ascending order of the number `key` returns. Compare `key(a)` with `key(b)`, not the elements themselves."
    limits:
      uk: "Пісочниця прибирає типи й виконує JavaScript, що лишився. Типи `sortBy` перевіряє лише `tsc` у твоїй теці `ts-lab`."
      en: "The sandbox removes the types and runs the JavaScript that remains. Only `tsc` in your `ts-lab` folder checks the types of `sortBy`."

  - id: check-generics
    kind: local-task
    runtime: local-web
    title:
      uk: "Generic проти any у tsc"
      en: "Generic versus any in tsc"
    intro:
      uk: "Працюєш у теці `ts-lab`. Результати записано з TypeScript 7.0.2 у macOS."
      en: "You work in the `ts-lab` folder. The results were recorded with TypeScript 7.0.2 on macOS."
    tools:
      - { name: "TypeScript", version: "7.x", note: { uk: "у теці `ts-lab`", en: "in the `ts-lab` folder" } }
    steps:
      - text:
          uk: "Створи `src/l05/sort.ts` зі своїм розв’язком вправи «Generic sortBy» і перевір."
          en: "Create `src/l05/sort.ts` with your solution of the exercise “A generic sortBy” and check."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого не виведено. Зверни увагу: у `(wish) => wish.price` анотації немає, і `tsc` не скаржиться — тип прийшов через `T`."
          en: "Nothing is printed. Notice that `(wish) => wish.price` has no annotation, and `tsc` does not complain — the type came through `T`."
      - text:
          uk: "Заміни в тілі `sortBy` копію на сортування самого масиву: `return items.sort((a, b) => key(a) - key(b));`."
          en: "In the body of `sortBy`, replace the copy with sorting the array itself: `return items.sort((a, b) => key(a) - key(b));`."
        command: "npx tsc --noEmit"
        expect:
          uk: "`error TS2339: Property 'sort' does not exist on type 'readonly T[]'.` (і ще дві `TS7006` для `a` і `b`). `readonly` зловив зміну масиву. Поверни копію."
          en: "`error TS2339: Property 'sort' does not exist on type 'readonly T[]'.` (plus two `TS7006` for `a` and `b`). `readonly` caught the change of the array. Put the copy back."
      - text:
          uk: "Створи `src/l05/by-id.ts` з кодом прикладу «Один byId для бажань і звичок» і додай до виведення лампи `lamp?.completions`, як у кроці 2 прикладу."
          en: "Create `src/l05/by-id.ts` with the code of the example “One byId for wishes and habits” and add `lamp?.completions` to the lamp’s output, as in step 2 of the example."
        command: "npx tsc --noEmit"
        expect:
          uk: "`error TS2339: Property 'completions' does not exist on type '{ id: string; name: string; price: number; }'.`"
          en: "`error TS2339: Property 'completions' does not exist on type '{ id: string; name: string; price: number; }'.`"
      - text:
          uk: "Заміни перший рядок `byId` на `function byId(items: any[], id: string): any {`."
          en: "Replace the first line of `byId` with `function byId(items: any[], id: string): any {`."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого не виведено: з `any` описка в полі більше не помітна. Поверни generic-версію й прибери `lamp?.completions`."
          en: "Nothing is printed: with `any` the wrong field is no longer noticed. Put the generic version back and remove `lamp?.completions`."
    verify:
      - id: clean
        text:
          uk: "Мій `sortBy` перевіряється без помилок, а параметри callback-ів не потребують анотацій."
          en: "My `sortBy` checks without errors, and the callbacks’ parameters need no annotations."
      - id: generic-vs-any
        text:
          uk: "Я бачив, що з generic `tsc` знаходить зайве поле, а з `any` — ні."
          en: "I saw that with a generic `tsc` finds the wrong field, and with `any` it does not."
    troubleshooting:
      - problem:
          uk: "Багато помилок у файлах інших уроків: `error TS2300: Duplicate identifier 'Priority'.`, `error TS2451: Cannot redeclare block-scoped variable 'tasks'.`"
          en: "Many errors in other lessons’ files: `error TS2300: Duplicate identifier 'Priority'.`, `error TS2451: Cannot redeclare block-scoped variable 'tasks'.`"
        fix:
          uk: "У `tsconfig.json` бракує `\"moduleDetection\": \"force\"` з першого уроку. Без нього файли без `import`/`export` ділять одну спільну область видимості, і однакові назви з різних уроків (`Priority`, `tasks`, `wishes`) стикаються. Додай рядок — і кожен файл стане окремим модулем."
          en: "`tsconfig.json` is missing `\"moduleDetection\": \"force\"` from the first lesson. Without it, files without `import`/`export` share one common scope, and equal names from different lessons (`Priority`, `tasks`, `wishes`) collide. Add the line — and every file becomes a module of its own."
      - problem:
          uk: "`Property 'toSorted' does not exist on type 'readonly T[]'`"
          en: "`Property 'toSorted' does not exist on type 'readonly T[]'`"
        fix:
          uk: "`toSorted` з’явився в ES2023. Перевір у `tsconfig.json` рядок `\"lib\": [\"es2023\", \"dom\"]` з першого уроку."
          en: "`toSorted` appeared in ES2023. Check that `tsconfig.json` has the line `\"lib\": [\"es2023\", \"dom\"]` from the first lesson."
    recovery:
      uk: "Обидва файли можна скопіювати з платформи ще раз; приклад повертає до початкового вигляду кнопка «Почати спочатку»."
      en: "Both files can be copied from the platform again; the “Start over” button returns the example to its original form."

  - id: to-project
    kind: transfer
    capstoneStep: JS-14
    body:
      uk: "У кроці проєкту `indexById` стане generic: `indexById<T extends { readonly id: string }>(list: readonly T[]): Map<string, T>` працює з будь-якими записами з `id` і не губить їхній тип — те, що лежить у `Map`, `tsc` і далі знатиме як бажання, справу, звичку чи витрату. У трекері звичок до нього додасться generic `sortBy`."
      en: "In the project step `indexById` becomes generic: `indexById<T extends { readonly id: string }>(list: readonly T[]): Map<string, T>` works with any records that have an `id` and does not lose their type — whatever lies in the `Map`, `tsc` still knows as a wish, task, habit or expense. In the habit tracker a generic `sortBy` joins it."
