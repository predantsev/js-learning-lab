id: js-14-03-unions-narrowing
unit: JS-14
title:
  uk: "Union-типи, звуження та дискримінанти"
  en: "Unions, narrowing and discriminants"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Звузити union-тип через `typeof`, `in`, порівняння й поле-дискримінант і назвати тип значення в кожній гілці."
    en: "Narrow a union with `typeof`, `in`, equality and a discriminant property, and state the type of the value inside each branch."
  - uk: "Описати результат валідації як `{ ok: true, value } | { ok: false, errors }`, обробити обидва варіанти й додати перевірку `never`, яка робить пропущений випадок помилкою компіляції."
    en: "Model a validation result as `{ ok: true, value } | { ok: false, errors }`, handle both members, and add a `never` check that makes a missing case a compile error."
prerequisites: [js-14-02-modeling-domain-types, js-02-05-if-else-switch]
subskills:
  - { family: P-03, skill: "unions/narrowing/discriminants", depth: intro }
glossary: [union-type, type-narrowing, discriminated-union, literal-type, exhaustiveness-check]
selfCheck: [predict-branches, describe-result]

blocks:
  - id: one-of-several
    kind: explanation
    title:
      uk: "Одне з кількох"
      en: "One of several"
    body:
      uk: |
        [[union-type|Union-тип]] `A | B` означає: значення — **або** `A`, **або** `B`, і заздалегідь невідомо, яке саме. Ти вже бачив `number | null`.

        Варіантами можуть бути й конкретні значення — це [[literal-type|літеральні типи]]:

        ```ts
        type Priority = "low" | "normal" | "high";
        ```

        Тепер `"urgent"` у полі `priority` `tsc` не пропустить: це не один із трьох дозволених рядків.

        Так само описують результат валідації з проєкту:

        ```ts
        type ValidationResult =
          | { ok: true; value: WishInput }
          | { ok: false; errors: Record<string, string> };
        ```

        `Record<string, string>` — об’єкт, у якого ключі й значення — текст: `{ name: "required" }`. Поле `ok` тут — [[discriminated-union|дискримінант]]: його значення (`true` чи `false`) одразу каже, який це варіант.
      en: |
        A [[union-type|union type]] `A | B` means: the value is **either** `A` **or** `B`, and you do not know in advance which one. You have already seen `number | null`.

        The members can also be exact values — these are [[literal-type|literal types]]:

        ```ts
        type Priority = "low" | "normal" | "high";
        ```

        Now `tsc` will not let `"urgent"` into a `priority` field: it is not one of the three allowed strings.

        The validation result from the project is described the same way:

        ```ts
        type ValidationResult =
          | { ok: true; value: WishInput }
          | { ok: false; errors: Record<string, string> };
        ```

        `Record<string, string>` is an object whose keys and values are text: `{ name: "required" }`. The field `ok` here is a [[discriminated-union|discriminant]]: its value (`true` or `false`) tells at once which member this is.

  - id: narrowing
    kind: explanation
    title:
      uk: "Звуження: перевірка, яку tsc розуміє"
      en: "Narrowing: a check tsc understands"
    body:
      uk: |
        Доки варіант невідомий, `tsc` дозволяє лише те, що є **в усіх** варіантах. Тож `result.value` без перевірки — помилка: у варіанта з `ok: false` поля `value` немає.

        Але звичайні перевірки JavaScript `tsc` читає й **звужує** тип усередині гілки — це [[type-narrowing|звуження типу]]:

        | Перевірка | Що лишається в гілці |
        |---|---|
        | `typeof input === "string"` | `string` |
        | `if (result.ok)` | варіант з `ok: true` |
        | `"errors" in result` | варіант, де є `errors` |
        | `priority === "high"` | `"high"` |

        Після `if`, що завершився `return`, лишається решта варіантів. Жодного приведення типу не потрібно: перевірка, яку ти й так написав би, є доказом для `tsc`.
      en: |
        While the member is unknown, `tsc` allows only what exists **in every** member. So `result.value` without a check is an error: the member with `ok: false` has no `value` field.

        But `tsc` reads ordinary JavaScript checks and **narrows** the type inside the branch — this is [[type-narrowing|type narrowing]]:

        | Check | What remains in the branch |
        |---|---|
        | `typeof input === "string"` | `string` |
        | `if (result.ok)` | the member with `ok: true` |
        | `"errors" in result` | the member that has `errors` |
        | `priority === "high"` | `"high"` |

        After an `if` that ended with `return`, the remaining members are left. No cast is needed: the check you would write anyway is the proof for `tsc`.

  - id: predict-branches
    kind: prediction
    prompt:
      uk: "Які типи `tsc` визначить для `input` у місцях `A` і `B` та для `result` у місцях `C` і `D`?"
      en: "Which types does `tsc` work out for `input` at the places `A` and `B`, and for `result` at `C` and `D`?"
    code: |
      type WishInput = { name: string; price: number | null };
      type ValidationResult =
        | { ok: true; value: WishInput }
        | { ok: false; errors: Record<string, string> };

      function show(input: string | number) {
        if (typeof input === "string") {
          return input.toUpperCase(); // A
        }
        return input.toFixed(2); // B
      }

      function report(result: ValidationResult) {
        if (!result.ok) {
          return Object.keys(result.errors).length; // C
        }
        return result.value.price; // D
      }
    lang: ts
    runnable: false
    answer:
      type: choice
      options:
        - id: narrowed
          text:
            uk: "A — `string`, B — `number`, C — варіант з `ok: false`, D — варіант з `ok: true`"
            en: "A is `string`, B is `number`, C is the member with `ok: false`, D is the member with `ok: true`"
        - id: whole-union
          text:
            uk: "Скрізь увесь union: `string | number` і `ValidationResult`. Тому `input.toFixed` і `result.errors` — помилки"
            en: "The whole union everywhere: `string | number` and `ValidationResult`. So `input.toFixed` and `result.errors` are errors"
          why:
            uk: "`tsc` читає перевірки: усередині `typeof input === \"string\"` лишається лише `string`, а після гілки з `return` — лише `number`. Так само `if (!result.ok)` пропускає в гілку лише варіант з `ok: false`, а після неї лишається варіант з `ok: true`."
            en: "`tsc` reads the checks: inside `typeof input === \"string\"` only `string` remains, and after the branch with `return`, only `number`. In the same way `if (!result.ok)` lets only the member with `ok: false` into the branch, and after it the member with `ok: true` remains."
        - id: all-members
          text:
            uk: "A — `string`, B — `number`, а `result` усюди має і `errors`, і `value`: union об’єднує поля обох варіантів"
            en: "A is `string`, B is `number`, and `result` has both `errors` and `value` everywhere: a union combines the fields of both members"
          why:
            uk: "Union — це «один **з**», а не «все разом». Об’єкт з `ok: false` поля `value` не має; без перевірки `tsc` пише `TS2339: Property 'value' does not exist on type 'ValidationResult'`."
            en: "A union means “one **of**”, not “all together”. An object with `ok: false` has no `value` field; without a check `tsc` says `TS2339: Property 'value' does not exist on type 'ValidationResult'`."
      correct: [narrowed]
    explanation:
      uk: "Під час підготовки уроку `tsc` 7 показав саме ці типи: `string`, `number`, `{ ok: false; errors: Record<string, string>; }` і `{ ok: true; value: WishInput; }`. Кожна гілка отримує лише той варіант, який пройшов перевірку, а після гілки з `return` лишається решта."
      en: "When the lesson was prepared, `tsc` 7 showed exactly these types: `string`, `number`, `{ ok: false; errors: Record<string, string>; }` and `{ ok: true; value: WishInput; }`. Each branch gets only the member that passed the check, and after a branch with `return` the rest remains."

  - id: narrowing-trace
    kind: visual
    visual: code-trace
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
    title:
      uk: "Звуження крок за кроком — і що буде без перевірки"
      en: "Narrowing step by step — and what happens without the check"
    textEquivalent:
      uk: "Трасування показує JavaScript, який лишається після прибирання типів. Функція savedName спершу отримує успішний результат: умова result.ok істинна, тож у гілці tsc уже знав, що result — варіант з ok: true, і поле value справді існує; функція повертає назву «Настільна лампа». Потім вона отримує невдалий результат: умова хибна, гілку пропущено, і після неї лишається лише варіант з ok: false, у якого поля value немає; функція його не читає й повертає null. Наостанок функція careless читає result.value.name без перевірки. tsc такий код не пропустив би (TS2339), а під час виконання value в невдалого результату немає, і програма падає з TypeError: Cannot read properties of undefined (reading 'name')."
      en: "The trace shows the JavaScript that remains after the types are removed. The function savedName first gets a successful result: the condition result.ok is true, so inside the branch tsc already knew result is the member with ok: true, and the field value really exists; the function returns the name “Desk lamp”. Then it gets a failed result: the condition is false, the branch is skipped, and after it only the member with ok: false remains, which has no value field; the function does not read it and returns null. Finally the function careless reads result.value.name without a check. tsc would not let that code through (TS2339), and at runtime a failed result has no value, so the program crashes with TypeError: Cannot read properties of undefined (reading 'name')."
    spec:
      file: visuals/narrowing.js
      captions:
        - at: { line: 2, kind: cond, hit: 1 }
          text:
            uk: "Перший виклик: `result` — успішний результат. До цього рядка `tsc` знає лише `ValidationResult` — будь-який із двох варіантів."
            en: "The first call: `result` is the successful result. Up to this line `tsc` knows only `ValidationResult` — either of the two members."
        - at: { line: 3, kind: return, hit: 1 }
          text:
            uk: "Умова істинна. У цій гілці `tsc` звузив `result` до `{ ok: true; value: WishInput }`, і під час виконання поле `value` справді є: функція повертає `\"Настільна лампа\"`."
            en: "The condition is true. In this branch `tsc` narrowed `result` to `{ ok: true; value: WishInput }`, and at runtime the field `value` really is there: the function returns `\"Desk lamp\"`."
        - at: { line: 2, kind: cond, hit: 2 }
          text:
            uk: "Другий виклик: `result` — невдалий результат, `ok` дорівнює `false`."
            en: "The second call: `result` is the failed result, `ok` is `false`."
        - at: { line: 5, kind: return, hit: 1 }
          text:
            uk: "Гілку пропущено. Після неї `tsc` лишив тільки варіант `{ ok: false; errors: … }` — поля `value` в ньому немає, тож функція його й не читає, а повертає `null`."
            en: "The branch was skipped. After it `tsc` kept only the member `{ ok: false; errors: … }` — it has no `value` field, so the function does not read it and returns `null`."
        - at: { line: 8, kind: call }
          text:
            uk: "`careless` читає `result.value` без перевірки. `tsc` повідомив би `TS2339` ще до запуску, але цей JavaScript типів уже не має — і виконується."
            en: "`careless` reads `result.value` without a check. `tsc` would report `TS2339` before running, but this JavaScript has no types any more — and it runs."
        - at: { line: 9, kind: throw }
          text:
            uk: "У невдалого результату `value` немає: `result.value` — `undefined`, а читання `.name` з нього кидає `TypeError`. Саме від цього захищає звуження."
            en: "A failed result has no `value`: `result.value` is `undefined`, and reading `.name` from it throws a `TypeError`. This is exactly what narrowing protects against."

  - id: never-check
    kind: explanation
    title:
      uk: "Перевірка never: жодного забутого випадку"
      en: "The never check: no forgotten case"
    body:
      uk: |
        У `switch` за полем `priority` кожен `case` відсіює один варіант. Після всіх трьох у `default` не лишається **нічого** — тип `never`, «значення, якого не може бути»:

        ```ts
        default: {
          const unhandled: never = priority;
          throw new Error(`Unknown priority: ${unhandled}`);
        }
        ```

        Це [[exhaustiveness-check|перевірка повноти]]. Якщо хтось видалить `case "high"` або додасть у `Priority` четвертий варіант, у `default` потрапить необроблений варіант — `"high"` чи той новий, — а присвоїти його змінній типу `never` неможливо: `tsc` повідомить про пропущений випадок **до запуску**. А `throw` спрацює, якщо невідоме значення все ж прийде під час виконання, наприклад зі збережених даних.

        Без такого `default` `tsc` часто мовчить: `switch` без потрібного `case` — цілком коректний JavaScript.
      en: |
        In a `switch` on the field `priority`, every `case` filters out one member. After all three, **nothing** remains in `default` — the type `never`, “a value that cannot exist”:

        ```ts
        default: {
          const unhandled: never = priority;
          throw new Error(`Unknown priority: ${unhandled}`);
        }
        ```

        This is an [[exhaustiveness-check|exhaustiveness check]]. If someone deletes `case "high"` or adds a fourth member to `Priority`, the unhandled member — `"high"` or the new one — reaches `default`, and it cannot be assigned to a variable of type `never`: `tsc` reports the missing case **before running**. And `throw` fires if an unknown value still arrives at runtime, for example from stored data.

        Without such a `default`, `tsc` often stays silent: a `switch` that lacks a `case` is perfectly valid JavaScript.

  - id: priority-badge
    kind: example
    runtime: browser-js
    dir: priority-badge
    entry: index.ts
    strings:
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      water: { uk: "Полити квіти", en: "Water the plants" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
    title:
      uk: "Пропущений case: з never і без"
      en: "A missing case: with never and without"
    body:
      uk: "Функція дає кожній справі позначку за пріоритетом. Запусти: три рядки з `[!!!]`, `[!]` і `[-]`. Тепер прибери по черзі частини коду й щоразу порівнюй, що побачить пісочниця і що побачив би `tsc` (його результати подано в кроках)."
      en: "The function gives every task a badge by priority. Run it: three lines with `[!!!]`, `[!]` and `[-]`. Now remove parts of the code one at a time and compare each time what the sandbox shows and what `tsc` would show (its results are given in the steps)."
    tryIt:
      uk: |
        1. Видали три рядки `case "high":`, `badge = "!!!";`, `break;` і запусти. Пісочниця кидає `Error: Unknown priority: high` — спрацював `throw` у `default`. `tsc` зупинив би це раніше: `TS2322: Type '"high"' is not assignable to type 'never'.`
        2. Тепер видали ще й увесь блок `default: { … }` і запусти. Помилки немає, а перша справа отримала порожню позначку `[]`. `tsc` для цього файлу теж **нічого не повідомляє** — пропущений випадок став тихою помилкою.
        3. Поверни обидва фрагменти (кнопка **Почати спочатку** або Cmd+Z / Ctrl+Z) і запусти: знову три позначки.
      en: |
        1. Delete the three lines `case "high":`, `badge = "!!!";`, `break;` and run. The sandbox throws `Error: Unknown priority: high` — the `throw` in `default` fired. `tsc` would have stopped this earlier: `TS2322: Type '"high"' is not assignable to type 'never'.`
        2. Now also delete the whole `default: { … }` block and run. There is no error, and the first task got an empty badge `[]`. For this file `tsc` **reports nothing** either — the missing case became a silent bug.
        3. Put both pieces back (the **Start over** button or Cmd+Z / Ctrl+Z) and run: three badges again.
    limits:
      uk: "Пісочниця прибирає типи й виконує JavaScript, що лишився. Типів вона не перевіряє: повідомлення `tsc` у кроках записано з TypeScript 7.0.2."
      en: "The sandbox removes the types and runs the JavaScript that remains. It does not check types: the `tsc` messages in the steps were recorded with TypeScript 7.0.2."

  - id: recall-validation
    kind: review
    title:
      uk: "Згадай: результат валідації"
      en: "Recall: a validation result"
    items:
      - id: ok-errors-shape
        from: js-02-11-independent-validation
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          function checkTitle(title) {
            if (title.trim() === "") {
              return { ok: false, errors: { title: "required" } };
            }
            return { ok: true, value: { title: title.trim() } };
          }

          const result = checkTitle("   ");
          console.log(result.ok, result.value);
          console.log(Object.keys(result.errors).length);
        verify:
          logs: ["false undefined", "1"]
        answer:
          type: choice
          options:
            - id: failed
              code: "false undefined\n1"
            - id: crash
              code: "TypeError"
              why:
                uk: "Читання поля, якого в об’єкта немає, у JavaScript не помилка: воно дає `undefined`. Помилка була б лише при читанні поля **з** `undefined`."
                en: "Reading a field the object does not have is not an error in JavaScript: it gives `undefined`. An error would come only from reading a field **of** `undefined`."
            - id: ok
              code: "true {}\n0"
              why:
                uk: "`\"   \".trim()` — порожній текст, тож спрацьовує перша гілка: `ok: false` з одним полем у `errors`."
                en: "`\"   \".trim()` is empty text, so the first branch runs: `ok: false` with one field in `errors`."
          correct: [failed]
        explanation:
          uk: "Функція валідації повертає один із двох видів об’єкта, і лише поле `ok` каже, який саме. Union-тип записує цю домовленість так, що `tsc` її перевіряє."
          en: "The validation function returns one of two kinds of object, and only the field `ok` says which. A union type writes this agreement down so that `tsc` checks it."

  - id: describe-result
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: describe-result
    entry: index.ts
    strings:
      saved: { uk: "Збережено", en: "Saved" }
      fix: { uk: "Виправ", en: "Fix" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
    title:
      uk: "describeResult для обох варіантів"
      en: "describeResult for both members"
    instructions:
      uk: |
        Допиши `describeResult(result)`:

        - для успішного результату — `"Збережено: <назва>"`, назву бери з `result.value.name`;
        - для невдалого — `"Виправ: <назви полів>"`: ключі `result.errors` через кому й пробіл, наприклад `"Виправ: name, price"`.

        Обійдися без приведення типу (`as`): лише перевірка, яку розуміє `tsc`. Перевірки викликають функцію з іншими результатами й бачать лише її поведінку — приведення, яке пропускає перевірку, впаде на іншому варіанті.
      en: |
        Finish `describeResult(result)`:

        - for a successful result, `"Saved: <name>"`, taking the name from `result.value.name`;
        - for a failed one, `"Fix: <field names>"`: the keys of `result.errors` joined with a comma and a space, for example `"Fix: name, price"`.

        Do it without a cast (`as`): only a check `tsc` understands. The checks call the function with other results and see only its behavior — a cast that skips the check fails on the other member.
    testTitles:
      "a successful result gives the saved line with the name":
        uk: "Успішний результат дає рядок «Збережено» з назвою"
        en: "A successful result gives the “Saved” line with the name"
      "a failed result gives the fix line with every field name":
        uk: "Невдалий результат дає рядок «Виправ» з назвою кожного поля"
        en: "A failed result gives the “Fix” line with every field name"
      "the program prints one line per result":
        uk: "Програма виводить по одному рядку на кожен результат"
        en: "The program prints one line per result"
    hints:
      nudge:
        uk: "Яке поле є в **обох** варіантах і каже, який це варіант?"
        en: "Which field exists in **both** members and tells which member it is?"
      explanation:
        uk: "Спершу перевір дискримінант, а вже **всередині** гілки читай поля цього варіанта. Порядок важливий: поле, якого немає в невдалому результаті, не можна читати до перевірки — ні для `tsc`, ні під час виконання. Так само з `type Light = { on: true; level: number } | { on: false }`: `level` читають лише після `if (light.on)`. Назви полів об’єкта дає `Object.keys(…)`, а `.join(\", \")` склеює їх."
        en: "Check the discriminant first, and read the fields of that member only **inside** the branch. The order matters: a field the failed result lacks must not be read before the check — neither for `tsc` nor at runtime. The same goes for `type Light = { on: true; level: number } | { on: false }`: `level` is read only after `if (light.on)`. `Object.keys(…)` gives an object’s field names, and `.join(\", \")` joins them."
    solutionNote:
      uk: "`if (result.ok)` звужує `result` до успішного варіанта, а після гілки з `return` лишається невдалий — `result.errors` доступне без жодного приведення. Перевірка `\"errors\" in result` чи `switch (result.ok)` працює так само. Читання обох полів **до** перевірки `tsc` відхилив би (`TS2339`), а під час виконання воно падає на невдалому результаті."
      en: "`if (result.ok)` narrows `result` to the successful member, and after the branch with `return` the failed one remains — `result.errors` is available without any cast. The check `\"errors\" in result` or a `switch (result.ok)` works the same way. Reading both fields **before** the check would be rejected by `tsc` (`TS2339`), and at runtime it crashes on a failed result."
    feedback:
      - when: { test: "a failed result gives the fix line with every field name" }
        message:
          uk: "Ця перевірка передає невдалий результат, у якого немає `value`, і чекає `\"Виправ: …\"` з ключами `errors` через `\", \"`. Читай `result.value` лише всередині гілки для успішного результату."
          en: "This check passes a failed result, which has no `value`, and expects `\"Fix: …\"` with the keys of `errors` joined by `\", \"`. Read `result.value` only inside the branch for a successful result."
      - when: { test: "a successful result gives the saved line with the name" }
        message:
          uk: "Ця перевірка чекає для успішного результату рядок `\"Збережено: \"` і назву з `result.value.name`, з двокрапкою й одним пробілом."
          en: "For a successful result this check expects the text `\"Saved: \"` followed by the name from `result.value.name`, with a colon and one space."
      - when: { error: TypeError }
        message:
          uk: "`TypeError: Cannot read properties of undefined` чи `Cannot convert undefined or null to object` (від `Object.keys`) означає, що поле взяли з варіанта, у якого його немає, — ще до перевірки `ok`. Якщо всі перевірки не пройшли разом (`type of describeResult: expected \"undefined\" to be \"function\"`), програма впала ще під час завантаження: виправ першу помилку в консолі — подивись рядок у картці помилки."
          en: "`TypeError: Cannot read properties of undefined` or `Cannot convert undefined or null to object` (from `Object.keys`) means a field was taken from a member that does not have it — before the `ok` check. If every check fails at once (`type of describeResult: expected \"undefined\" to be \"function\"`), the program crashed while loading: fix the first console error — look at the line in the error card."
    limits:
      uk: "Пісочниця прибирає типи й виконує JavaScript, що лишився. Звуження перевіряє лише `tsc` у твоїй теці `ts-lab`."
      en: "The sandbox removes the types and runs the JavaScript that remains. Only `tsc` in your `ts-lab` folder checks the narrowing."

  - id: check-narrowing
    kind: local-task
    runtime: local-web
    title:
      uk: "Звуження й never у tsc"
      en: "Narrowing and never in tsc"
    intro:
      uk: "Працюєш у теці `ts-lab`. Після кожної зміни збережи файл і запусти `npx tsc --noEmit`. Результати записано з TypeScript 7.0.2 у macOS."
      en: "You work in the `ts-lab` folder. After each change, save the file and run `npx tsc --noEmit`. The results were recorded with TypeScript 7.0.2 on macOS."
    tools:
      - { name: "TypeScript", version: "7.x", note: { uk: "у теці `ts-lab`", en: "in the `ts-lab` folder" } }
    steps:
      - text:
          uk: "Створи `src/l03/result.ts` зі своїм розв’язком вправи «describeResult для обох варіантів» і перевір."
          en: "Create `src/l03/result.ts` with your solution of the exercise “describeResult for both members” and check."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого не виведено."
          en: "Nothing is printed."
      - text:
          uk: "Першим рядком усередині `describeResult` допиши `const name = result.value.name;` (до перевірки)."
          en: "As the first line inside `describeResult`, add `const name = result.value.name;` (before the check)."
        command: "npx tsc --noEmit"
        expect:
          uk: "`error TS2339: Property 'value' does not exist on type 'ValidationResult'.` і другий рядок `Property 'value' does not exist on type '{ ok: false; errors: Record<string, string>; }'.` — `tsc` називає саме той варіант, у якого поля немає. Видали доданий рядок."
          en: "`error TS2339: Property 'value' does not exist on type 'ValidationResult'.` and a second line `Property 'value' does not exist on type '{ ok: false; errors: Record<string, string>; }'.` — `tsc` names exactly the member that lacks the field. Delete the added line."
      - text:
          uk: "Створи `src/l03/badge.ts` з кодом прикладу «Пропущений case: з never і без» (у початковому вигляді) і видали в ньому три рядки `case \"high\"`."
          en: "Create `src/l03/badge.ts` with the code of the example “A missing case: with never and without” (in its original form) and delete its three `case \"high\"` lines."
        command: "npx tsc --noEmit"
        expect:
          uk: "`error TS2322: Type '\"high\"' is not assignable to type 'never'.` — підкреслено `unhandled` у `default`."
          en: "`error TS2322: Type '\"high\"' is not assignable to type 'never'.` — `unhandled` in `default` is underlined."
      - text:
          uk: "Видали ще й увесь блок `default: { … }`."
          en: "Also delete the whole `default: { … }` block."
        command: "npx tsc --noEmit"
        expect:
          uk: "Нічого не виведено: без перевірки `never` пропущений випадок `tsc` не помічає. Поверни і `case \"high\"`, і `default`, щоб тека знову перевірялася без помилок."
          en: "Nothing is printed: without the `never` check `tsc` does not notice the missing case. Put back both `case \"high\"` and `default`, so the folder checks without errors again."
    verify:
      - id: clean
        text:
          uk: "Мій `describeResult` перевіряється без помилок і без жодного приведення типу."
          en: "My `describeResult` checks without errors and without a single cast."
      - id: never-reports
        text:
          uk: "Я бачив, що з `never` пропущений `case` — помилка компіляції, а без нього `tsc` мовчить."
          en: "I saw that with `never` a missing `case` is a compile error, and without it `tsc` stays silent."
    troubleshooting:
      - problem:
          uk: "`error TS2366: Function lacks ending return statement and return type does not include 'undefined'.` у `describeResult`"
          en: "`error TS2366: Function lacks ending return statement and return type does not include 'undefined'.` in `describeResult`"
        fix:
          uk: "Друга гілка написана окремим `if (!result.ok) { … }`. Два окремі `if` `tsc` не вважає таким, що покриває всі випадки, і чекає `return` після них. Напиши другу гілку просто як код після першого `if` з `return` (або через `else`)."
          en: "The second branch is written as a separate `if (!result.ok) { … }`. `tsc` does not treat two separate `if`s as covering every case and expects a `return` after them. Write the second branch simply as the code after the first `if` with `return` (or with `else`)."
    recovery:
      uk: "Обидва файли можна скопіювати з платформи ще раз: розв’язок вправи збережено, а приклад відновлюється кнопкою «Почати спочатку»."
      en: "Both files can be copied from the platform again: the exercise solution is saved, and the example is restored with the “Start over” button."

  - id: to-project
    kind: transfer
    capstoneStep: JS-14
    body:
      uk: "У кроці проєкту `validate…` повертатиме саме такий union `{ ok: true, value } | { ok: false, errors }`, а код форми звужуватиме його через `result.ok`. Якщо в твоєму домені є поле з кількома дозволеними значеннями — `priority`, `frequency`, `category` — опиши його літеральним union-типом, а `switch` за ним доповни перевіркою `never`."
      en: "In the project step `validate…` will return exactly such a union `{ ok: true, value } | { ok: false, errors }`, and the form code will narrow it with `result.ok`. If your domain has a field with a few allowed values — `priority`, `frequency`, `category` — describe it as a literal union type, and give a `switch` on it a `never` check."
