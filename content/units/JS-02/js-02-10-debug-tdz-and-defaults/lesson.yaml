id: js-02-10-debug-tdz-and-defaults
unit: JS-02
title:
  uk: "Налагодження: TDZ, затінення і хибне значення за замовчуванням"
  en: "Debug: TDZ, shadowing and a wrong default"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Розпізнати `ReferenceError`, спричинений TDZ, і мовчазне `undefined`, спричинене `var`, та пояснити різницю."
    en: "Diagnose a `ReferenceError` caused by the TDZ and a silent `undefined` caused by `var`, and explain the difference."
  - uk: "Виправити порівняння `==` і значення за замовчуванням через `||`, які неправильно обробляють `0` та `\"\"`."
    en: "Repair a `==` comparison and a `||` default that mishandle `0` and `\"\"`."
prerequisites: [js-02-09-rare-operators-special-values]
subskills:
  - { family: J-02, skill: "legacy var reading", depth: assess }
  - { family: J-02, skill: "hoisting and TDZ", depth: assess }
  - { family: J-02, skill: "shadowing and strict mode", depth: assess }
  - { family: J-01, skill: "equality/coercion/truthiness", depth: assess }
  - { family: J-01, skill: "nullish coalescing/optional chaining", depth: assess }
glossary: []
selfCheck: [predict-report, fix-report]

blocks:
  - id: silent-and-loud
    kind: explanation
    title:
      uk: "Гучні й тихі помилки"
      en: "Loud bugs and silent bugs"
    body:
      uk: |
        Помилки бувають двох видів. **Гучні** зупиняють програму й називають рядок: `ReferenceError`, `TypeError`. **Тихі** нічого не зупиняють — програма просто друкує не те: `undefined` замість підпису, «немає даних» замість нуля.

        Тиха помилка підступніша: якщо консоль не показує помилки, це ще не означає, що порівняння правильне. Тому налагодження починається з порівняння **очікуваного виводу з реальним**, рядок за рядком. Для кожного неправильного рядка йди назад до коду, який його надрукував, і питай:

        - чи не читається ім’я раніше, ніж його задано (TDZ або `var`)?
        - чи не затінене воно зайвим `let`?
        - чи не «з’їдає» `==` або `||` значення `0` чи `""`?

        Виправляй по одному місцю й запускай знову після кожної зміни.
      en: |
        Bugs come in two kinds. **Loud** ones stop the program and name a line: `ReferenceError`, `TypeError`. **Silent** ones stop nothing — the program simply prints the wrong thing: `undefined` instead of a label, “no data” instead of zero.

        A silent bug is sneakier: when the console shows no error, that does not mean the comparison is right. So debugging starts with comparing **the expected output with the real one**, line by line. For each wrong line, walk back to the code that printed it and ask:

        - is a name read before it is set (the TDZ or `var`)?
        - is it shadowed by a stray `let`?
        - does `==` or `||` swallow a `0` or a `""`?

        Fix one place at a time and run again after every change.

  - id: recall-error
    kind: review
    title:
      uk: "Згадай: як читати повідомлення про помилку"
      en: "Recall: how to read an error message"
    items:
      - id: where-to-start
        from: js-01-05-reading-an-error
        prompt:
          uk: "Програма зупинилась із повідомленням `ReferenceError: Cannot access 'waterMark' before initialization` і вказала на рядок 28. З чого почати?"
          en: "The program stopped with `ReferenceError: Cannot access 'waterMark' before initialization` and pointed at line 28. Where do you start?"
        answer:
          type: choice
          options:
            - id: read-line
              text:
                uk: "Відкрити рядок 28 і подивитися, де оголошено `waterMark` — вище чи нижче цього рядка"
                en: "Open line 28 and see where `waterMark` is declared — above or below that line"
            - id: rewrite
              text:
                uk: "Переписати всю програму заново"
                en: "Rewrite the whole program"
              why:
                uk: "Повідомлення вказує на одне місце: назва помилки, пояснення й рядок. Решта програми, найімовірніше, справна."
                en: "The message points at one place: the error name, the explanation and the line. The rest of the program is most likely fine."
            - id: delete-line
              text:
                uk: "Видалити рядок 28"
                en: "Delete line 28"
              why:
                uk: "Так зникне симптом, але не причина: програма перестане робити те, для чого її написали."
                en: "That removes the symptom, not the cause: the program would stop doing what it was written for."
            - id: typo
              text:
                uk: "Шукати одруківку в назві `waterMark`"
                en: "Look for a typo in the name `waterMark`"
              why:
                uk: "Одруківка дала б «is not defined». «Cannot access … before initialization» означає інше: ім’я є, але його читають раніше, ніж оголошено."
                en: "A typo would give “is not defined”. “Cannot access … before initialization” means something else: the name exists, but it is read before it is declared."
          correct: [read-line]
        explanation:
          uk: "Як і в першому розділі: назва помилки (`ReferenceError`), пояснення (`Cannot access … before initialization` — це TDZ) і місце (рядок 28). Відкрий рядок, знайди оголошення `waterMark` і порівняй, що стоїть раніше."
          en: "Just as in the first unit: the error name (`ReferenceError`), the explanation (`Cannot access … before initialization` — that is the TDZ) and the place (line 28). Open the line, find the declaration of `waterMark` and compare which comes first."

  - id: predict-report
    kind: prediction
    strings:
      reached: { uk: "мету досягнуто", en: "goal reached" }
      keepGoing: { uk: "продовжуй", en: "keep going" }
      noData: { uk: "немає даних", en: "no data" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      water: { uk: "Пити воду", en: "Drink water" }
    prompt:
      uk: "Звіт мав би надрукувати «Прогулянка: 0/5», «Прогулянка: продовжуй», «Пити воду: 70», «Пити воду: мету досягнуто». Що він надрукує насправді?"
      en: "The report should print “Go for a walk: 0/5”, “Go for a walk: keep going”, “Drink water: 70”, “Drink water: goal reached”. What does it really print?"
    code: |
      // Weekly habit report: four sections, one console line each.
      const reachedWord = "%%reached%%";
      const keepGoingWord = "%%keepGoing%%";
      const noDataWord = "%%noData%%";

      const walk = { name: "%%walk%%", target: 5, done: 0 };
      const water = { name: "%%water%%", target: 7, done: 7, bonus: 0 };

      // 1. Walk progress: an empty "" means nothing was entered; 0 is real progress.
      const walkProgress = walk.done == "" ? noDataWord : walk.done + "/" + walk.target;
      console.log(walk.name + ":", walkProgress);

      // 2. Walk mark: reachedWord at the target, keepGoingWord below it.
      if (walk.done >= walk.target) {
        var walkMark = reachedWord;
      }
      console.log(walk.name + ":", walkMark);

      // 3. Water points: 10 per completion plus a bonus (20 when missing; 0 means no bonus).
      let points = 0;
      if (water.done > 0) {
        let points = water.done * 10 + (water.bonus || 20);
      }
      console.log(water.name + ":", points);

      // 4. Water mark.
      if (water.done >= water.target) {
        console.log(water.name + ":", waterMark);
        const waterMark = reachedWord;
      }
    verify:
      logs: ["%%walk%%: %%noData%%", "%%walk%%: undefined", "%%water%%: 0"]
      error: ReferenceError
    answer:
      type: choice
      options:
        - id: three-wrong-one-throws
          text:
            uk: "Розділ 1 друкує «немає даних», розділ 2 — `undefined`, розділ 3 — `0`, а розділ 4 зупиняє програму з `ReferenceError`"
            en: "Section 1 prints “no data”, section 2 prints `undefined`, section 3 prints `0`, and section 4 stops the program with a `ReferenceError`"
        - id: error-in-two
          text:
            uk: "Помилка вже в розділі 2: `walkMark` не існує поза блоком"
            en: "An error already in section 2: `walkMark` does not exist outside the block"
          why:
            uk: "`var` не помічає блоків: ім’я `walkMark` існує в усьому скрипті, просто вказує на `undefined`. Помилку дав би `let`."
            en: "`var` ignores blocks: the name `walkMark` exists in the whole script, it just points at `undefined`. A `let` would have given an error."
        - id: no-error-no-bug
          text:
            uk: "Розділи 1–3 друкують правильні рядки — вони ж не дали помилки"
            en: "Sections 1–3 print the right lines — they gave no error, after all"
          why:
            uk: "Відсутність помилки не означає правильності. `0 == \"\"` — `true`, `var` без значення дає `undefined`, а внутрішній `let` затінює `points` — і все це мовчки."
            en: "No error does not mean correct. `0 == \"\"` is `true`, a `var` without a value gives `undefined`, and the inner `let` shadows `points` — all of it silently."
        - id: undefined-in-four
          text:
            uk: "Розділ 4 друкує `undefined`, як і розділ 2"
            en: "Section 4 prints `undefined`, just like section 2"
          why:
            uk: "`const` до свого рядка перебуває в TDZ: читання дає `ReferenceError`, а не `undefined`. Мовчазне `undefined` — це поведінка `var`."
            en: "A `const` is in the TDZ until its line: reading it gives a `ReferenceError`, not `undefined`. A silent `undefined` is how `var` behaves."
      correct: [three-wrong-one-throws]
    explanation:
      uk: "Розділ 1: `0 == \"\"` — `true`, тож нуль став «немає даних». Розділ 2: мети не досягнуто, `var walkMark` так і не отримав значення — `undefined`. Розділ 3: `let points` усередині блоку — нове ім’я, зовнішнє лишилося `0`. Розділ 4: `waterMark` читають до оголошення — `ReferenceError`. Лише одна помилка з чотирьох була гучною."
      en: "Section 1: `0 == \"\"` is `true`, so zero became “no data”. Section 2: the target was not reached, so `var walkMark` never got a value — `undefined`. Section 3: the `let points` inside the block is a new name; the outer one stayed `0`. Section 4: `waterMark` is read before its declaration — a `ReferenceError`. Only one of the four bugs was loud."

  - id: two-reads
    kind: visual
    visual: code-trace
    title:
      uk: "Два читання до оголошення"
      en: "Two reads before a declaration"
    textEquivalent:
      uk: >-
        Ще до першого рядка існують усі імена програми: mark, оголошене через var, дорівнює undefined, а
        label, оголошене через const, — uninitialized. Умова 0 >= 5 хибна, тож блок пропускається і
        рядок var mark = "reached" не виконується. Рядок 6 читає mark: ім’я існує, значення — undefined,
        тому консоль мовчки показує undefined. Це тиха помилка. Рядок 7 читає label ще до рядка 8 з
        оголошенням: ім’я існує, але перебуває в тимчасовій мертвій зоні, тож програма зупиняється з
        ReferenceError: Cannot access 'label' before initialization. Це гучна помилка з точним рядком.
      en: >-
        Before the first line runs, every name of the program exists: mark, declared with var, equals
        undefined, while label, declared with const, is uninitialized. The condition 0 >= 5 is false, so the
        block is skipped and the line var mark = "reached" never runs. Line 6 reads mark: the name exists
        and its value is undefined, so the console silently shows undefined. That is a silent bug. Line 7
        reads label before line 8 declares it: the name exists but is in the temporal dead zone, so the
        program stops with ReferenceError: Cannot access 'label' before initialization. That is a loud bug
        with an exact line.
    spec:
      file: visuals/two-reads.js
      captions:
        - at: { line: 1 }
          text:
            uk: "До старту: `mark` (`var`) уже існує й дорівнює `undefined`, а `label` (`const`) — uninitialized, у TDZ."
            en: "Before the start: `mark` (`var`) already exists and equals `undefined`, while `label` (`const`) is uninitialized, in the TDZ."
        - at: { line: 3, kind: cond }
          text:
            uk: "`0 >= 5` — `false`: блок пропущено, і рядок `var mark = …` не виконається."
            en: "`0 >= 5` is `false`: the block is skipped, and the line `var mark = …` will not run."
        - at: { line: 6 }
          text:
            uk: "Читання `mark`: ім’я існує, значення — `undefined`. Помилки немає, консоль мовчки покаже `undefined`. Це **тиха** помилка."
            en: "Reading `mark`: the name exists and its value is `undefined`. No error — the console silently shows `undefined`. That is a **silent** bug."
        - at: { line: 7, kind: stmt }
          text:
            uk: "Читання `label` до рядка 8: ім’я існує, але досі в TDZ."
            en: "Reading `label` before line 8: the name exists but is still in the TDZ."
        - at: { line: 7, kind: throw }
          text:
            uk: "`ReferenceError: Cannot access 'label' before initialization` — **гучна** помилка з точним рядком. Її знайти легше, ніж тихе `undefined` двома рядками вище."
            en: "`ReferenceError: Cannot access 'label' before initialization` — a **loud** bug with an exact line. It is easier to find than the silent `undefined` two lines above."

  - id: run-report
    kind: example
    runtime: browser-js
    dir: run-report
    entry: index.js
    expectError: true
    strings:
      reached: { uk: "мету досягнуто", en: "goal reached" }
      keepGoing: { uk: "продовжуй", en: "keep going" }
      noData: { uk: "немає даних", en: "no data" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      water: { uk: "Пити воду", en: "Drink water" }
    title:
      uk: "Запусти звіт і звір із передбаченням"
      en: "Run the report and check your prediction"
    body:
      uk: |
        Очікуваний звіт:

        ```text
        Прогулянка: 0/5
        Прогулянка: продовжуй
        Пити воду: 70
        Пити воду: мету досягнуто
        ```

        Запусти програму й порівняй кожен рядок консолі зі своїм передбаченням і з очікуваним звітом.
      en: |
        The expected report:

        ```text
        Go for a walk: 0/5
        Go for a walk: keep going
        Drink water: 70
        Drink water: goal reached
        ```

        Run the program and compare each console line with your prediction and with the expected report.
    tryIt:
      uk: "Виправ спершу гучну помилку: у розділі 4 поміняй місцями два рядки всередині `if` і запусти знову. Програма дійшла до кінця — але чи правильні інші три рядки? Відсутність помилки ще не означає відсутності дефектів. Решту виправиш у вправі нижче."
      en: "Fix the loud bug first: in section 4, swap the two lines inside the `if` and run again. The program now reaches the end — but are the other three lines right? No error does not mean no defects. You will fix the rest in the exercise below."

  - id: fix-report
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: fix-report
    entry: index.js
    strings:
      reached: { uk: "мету досягнуто", en: "goal reached" }
      keepGoing: { uk: "продовжуй", en: "keep going" }
      noData: { uk: "немає даних", en: "no data" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      water: { uk: "Пити воду", en: "Drink water" }
    title:
      uk: "Полагодь тижневий звіт"
      en: "Repair the weekly report"
    instructions:
      uk: |
        Виправ звіт так, щоб він друкував рівно ці чотири рядки:

        ```text
        Прогулянка: 0/5
        Прогулянка: продовжуй
        Пити воду: 70
        Пити воду: мету досягнуто
        ```

        Неправильні всі чотири розділи. Правила в коментарях — це задум автора, їх не змінюй; рядки з `console.log` теж залиш. Виправляй по одному розділу й запускай після кожної зміни.
      en: |
        Repair the report so that it prints exactly these four lines:

        ```text
        Go for a walk: 0/5
        Go for a walk: keep going
        Drink water: 70
        Drink water: goal reached
        ```

        All four sections are wrong. The rules in the comments are the author’s intent — do not change them; keep the `console.log` lines too. Fix one section at a time and run after each change.
    testTitles:
      "runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without errors"
      "shows the walk progress as 0/5":
        uk: "Прогрес прогулянки — «0/5», а не «немає даних»"
        en: "The walk progress is “0/5”, not “no data”"
      "gives the walk a mark":
        uk: "Прогулянка отримує позначку, а не undefined"
        en: "The walk gets a mark, not undefined"
      "counts the water points with a bonus of 0":
        uk: "Бали за воду — 70: бонус 0 означає «без бонусу»"
        en: "The water points are 70: a bonus of 0 means “no bonus”"
      "marks the water goal as reached":
        uk: "Для води надруковано «мету досягнуто»"
        en: "The water line says “goal reached”"
    hints:
      nudge:
        uk: "Запусти й порівняй кожен рядок консолі з очікуваним. Почни з гучної помилки, потім берись за тихі — по одному розділу."
        en: "Run it and compare each console line with the expected one. Start with the loud bug, then move on to the silent ones — one section at a time."
      explanation:
        uk: "Розділ 1: `0 == \"\"` — `true`, тому нуль стає «немає даних»; порівнюй строго: `=== \"\"`. Розділ 2: `var walkMark` задається лише в `if`, тож без досягнутої мети лишається `undefined`; задай `keepGoingWord` перед `if`. Розділ 3: внутрішній `let points` затінює зовнішній, а `|| 20` з’їдає бонус `0`: прибери `let` і заміни `||` на `??`. Розділ 4: `waterMark` читають до оголошення (TDZ) — поміняй рядки місцями."
        en: "Section 1: `0 == \"\"` is `true`, so zero becomes “no data”; compare strictly: `=== \"\"`. Section 2: `var walkMark` is set only inside the `if`, so without a reached target it stays `undefined`; set `keepGoingWord` before the `if`. Section 3: the inner `let points` shadows the outer one, and `|| 20` swallows the bonus `0`: remove the `let` and replace `||` with `??`. Section 4: `waterMark` is read before its declaration (TDZ) — swap the lines."
    solutionNote:
      uk: "Чотири розділи — чотири різні механізми: строга рівність замість `==`; значення за замовчуванням перед `if` замість «витоку» `var`; одне ім’я `points` і `??` замість `||`; оголошення перед використанням. Гучним був лише один дефект — решта мовчки друкували неправильне."
      en: "Four sections, four different mechanisms: strict equality instead of `==`; a default before the `if` instead of a leaking `var`; one name `points` and `??` instead of `||`; declaring before using. Only one defect was loud — the rest silently printed the wrong thing."
    feedback:
      - when: { error: ReferenceError }
        message:
          uk: "Програма зупинилася з `ReferenceError`. «Cannot access … before initialization» — ім’я читають до оголошення (TDZ): постав оголошення вище. «… is not defined» — ім’я оголошене в іншому блоці: оголоси його перед блоком."
          en: "The program stopped with a `ReferenceError`. “Cannot access … before initialization” — the name is read before its declaration (TDZ): move the declaration up. “… is not defined” — the name is declared in another block: declare it before the block."
      - when: { test: "shows the walk progress as 0/5" }
        message:
          uk: "`walk.done` дорівнює `0`, а `0 == \"\"` — `true`. Порожній рядок перевіряй строго: `walk.done === \"\"`."
          en: "`walk.done` is `0`, and `0 == \"\"` is `true`. Check for the empty string strictly: `walk.done === \"\"`."
      - when: { test: "gives the walk a mark" }
        message:
          uk: "Прогулянка не досягла мети, тож `walkMark` лишився `undefined`: `var` створив ім’я, але значення так і не дав. Задай `keepGoingWord` значенням за замовчуванням ще до `if`."
          en: "The walk did not reach its target, so `walkMark` stayed `undefined`: `var` created the name but never gave it a value. Set `keepGoingWord` as the default before the `if`."
      - when: { test: "counts the water points with a bonus of 0" }
        message:
          uk: "Очікується 70: 7 × 10 і бонус 0. Вийшло 0? Внутрішній `let points` затінює зовнішній. Вийшло 90? `||` замінив бонус `0` на 20 — тут потрібен `??`."
          en: "70 is expected: 7 × 10 plus a bonus of 0. Got 0? The inner `let points` shadows the outer one. Got 90? `||` replaced the bonus `0` with 20 — this needs `??`."
      - when: { test: "marks the water goal as reached" }
        message:
          uk: "Рядок друкує `waterMark` раніше, ніж його оголошено. Постав оголошення над `console.log`."
          en: "The line prints `waterMark` before it is declared. Put the declaration above the `console.log`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-02
    body:
      uk: "Коли підписи чи повідомлення в проєкті виглядають «майже правильно», порівняй очікуваний вивід з реальним рядок за рядком і пройди трьома питаннями цього уроку: TDZ чи `var`, затінення, `==` чи `||`."
      en: "When labels or messages in your project look “almost right”, compare the expected output with the real one line by line and go through this lesson’s three questions: TDZ or `var`, shadowing, `==` or `||`."
