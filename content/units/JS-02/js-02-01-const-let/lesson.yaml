id: js-02-01-const-let
unit: JS-02
title:
  uk: "Даємо значенням імена: const і let"
  en: "Naming values: const and let"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Оголосити ім’я через `const` або `let` і пояснити, яке з них дозволяє повторне присвоєння."
    en: "Declare a name with `const` or `let` and explain which one allows reassignment."
  - uk: "Пояснити, що `const` закріплює ім’я, а не заморожує значення: поля запису під `const` можна змінювати."
    en: "Explain that `const` fixes the name, not the value: the fields of a record behind a `const` can still change."
prerequisites: [js-01-04-booleans-null-undefined]
subskills:
  - { family: J-02, skill: "const/let and mutation distinction", depth: intro }
glossary: [binding, const, let, reassignment, record]
selfCheck: [which-stops, const-record, discount]

blocks:
  - id: names-for-values
    kind: explanation
    title:
      uk: "Ім’я для значення"
      en: "A name for a value"
    body:
      uk: |
        Досі значення стояли просто в коді: щоб скористатися ціною двічі, її доводилося двічі й писати. Дай значенню ім’я:

        ```js
        const price = 80;
        console.log(price);       // 80
        console.log(price * 2);   // 160
        ```

        Рядок `const price = 80;` створює [[binding|прив’язку]]: ім’я `price` тепер вказує на значення `80`. Знак `=` тут означає не «дорівнює», а «нехай це ім’я вказує на це значення».

        Є два способи оголосити ім’я:

        - [[const]] — ім’я назавжди вказує на те саме значення. Тому значення треба дати одразу: `const price;` — помилка.
        - [[let]] — ім’я можна згодом спрямувати на інше значення. Це [[reassignment|повторне присвоєння]]:

        ```js
        let count = 1;
        count = 2;           // no let here: the name already exists
        count = count + 1;   // 3
        count += 1;          // the same as count = count + 1, so 4
        ```

        `console.log` уміє показати кілька значень одразу — через кому: `console.log("Кількість:", count)` виведе `Кількість: 4`.
      en: |
        Until now values stood right in the code: to use a price twice, you had to write it twice. Give the value a name:

        ```js
        const price = 80;
        console.log(price);       // 80
        console.log(price * 2);   // 160
        ```

        The line `const price = 80;` creates a [[binding]]: the name `price` now points at the value `80`. Here `=` does not mean “equals”, it means “let this name point at this value”.

        There are two ways to declare a name:

        - [[const]] — the name points at the same value forever. That is why it needs its value straight away: `const price;` is an error.
        - [[let]] — the name can later be pointed at another value. This is [[reassignment]]:

        ```js
        let count = 1;
        count = 2;           // no let here: the name already exists
        count = count + 1;   // 3
        count += 1;          // the same as count = count + 1, so 4
        ```

        `console.log` can show several values at once, separated by commas: `console.log("Count:", count)` prints `Count: 4`.

  - id: which-stops
    kind: prediction
    prompt:
      uk: "Не запускаючи код, вирішуй: що з’явиться в консолі?"
      en: "Without running the code, decide: what appears in the console?"
    code: |
      let wishes = 3;
      wishes = 4;
      console.log(wishes);
      const budget = 500;
      budget = 450;
      console.log(budget);
    verify:
      logs: ["4"]
      error: TypeError
    answer:
      type: choice
      options:
        - id: four-then-error
          text:
            uk: "`4`, а потім помилка в рядку 5. Останній `console.log` не виконається"
            en: "`4`, then an error on line 5. The last `console.log` never runs"
        - id: both
          text:
            uk: "`4` і `450`"
            en: "`4` and `450`"
          why:
            uk: "`const` забороняє спрямувати ім’я на нове значення. У рядку 5 JavaScript зупиняється з помилкою, тож до `450` справа не доходить."
            en: "`const` forbids pointing the name at a new value. On line 5 JavaScript stops with an error, so `450` is never printed."
        - id: silent
          text:
            uk: "`4` і `500`: JavaScript просто проігнорує нове значення"
            en: "`4` and `500`: JavaScript simply ignores the new value"
          why:
            uk: "JavaScript не ігнорує заборонене мовчки — він зупиняється й повідомляє про помилку. Так ти одразу бачиш, що програма робить не те, що задумано."
            en: "JavaScript does not silently ignore what is forbidden — it stops and reports an error. That way you see at once that the program is not doing what you meant."
        - id: let-too
          text:
            uk: "Помилка вже в рядку 2: значення не можна змінювати"
            en: "An error already on line 2: values cannot be changed"
          why:
            uk: "Саме для цього й існує `let`: ім’я, оголошене через `let`, можна спрямувати на нове значення."
            en: "That is exactly what `let` is for: a name declared with `let` can be pointed at a new value."
      correct: [four-then-error]
    explanation:
      uk: "`let` дозволяє повторне присвоєння, тому рядки 1–3 спрацьовують і в консолі з’являється `4`. У рядку 5 програма намагається дати `const`-імені нове значення: JavaScript зупиняється з `TypeError: Assignment to constant variable.` («присвоєння константі»). Рядок 6 уже не виконується."
      en: "`let` allows reassignment, so lines 1–3 work and `4` appears in the console. On line 5 the program tries to give a `const` name a new value: JavaScript stops with `TypeError: Assignment to constant variable.` Line 6 never runs."

  - id: try-const
    kind: example
    runtime: browser-js
    dir: try-const
    entry: index.js
    expectError: true
    strings:
      wishes: { uk: "Бажань:", en: "Wishes:" }
      budget: { uk: "Бюджет:", en: "Budget:" }
    title:
      uk: "Константа, яку намагаються змінити"
      en: "A constant someone tries to change"
    body:
      uk: |
        Запусти програму й прочитай повідомлення: назва помилки — `TypeError`, пояснення — `Assignment to constant variable.`, рядок — 5.

        Перший рядок у консолі встиг з’явитися: помилка трапилась під час виконання, а не під час читання коду.
      en: |
        Run the program and read the message: the error name is `TypeError`, the explanation is `Assignment to constant variable.`, the line is 5.

        The first console line still appeared: the error happened while running, not while reading the code.
    tryIt:
      uk: "Заміни `const budget` на `let budget` і запусти ще раз — тепер виконуються всі рядки. Потім додай під першим рядком ще одне оголошення `let wishes = 5;` і прочитай нову помилку: те саме ім’я не можна оголосити двічі. Цю помилку JavaScript знаходить ще під час читання коду, тому консоль порожня."
      en: "Replace `const budget` with `let budget` and run again — now every line runs. Then add another declaration `let wishes = 5;` under the first line and read the new error: the same name cannot be declared twice. JavaScript finds this one while reading the code, so the console stays empty."

  - id: name-not-value
    kind: explanation
    title:
      uk: "const закріплює ім’я, а не значення"
      en: "const fixes the name, not the value"
    body:
      uk: |
        Часто значення — не одне число, а цілий [[record|запис]]: кілька іменованих значень разом. Запис пишуть у фігурних дужках, а окреме поле читають через крапку:

        ```js
        const wish = { name: "Навушники", price: 80 };
        console.log(wish.price);   // 80
        ```

        Поле можна змінити — і з `const` теж:

        ```js
        wish.price = 70;                          // allowed: the record changes
        wish = { name: "Лампа", price: 45 };      // TypeError: wish is a const
        ```

        `const` закріплює **ім’я**: `wish` завжди вказуватиме на той самий запис. Але сам запис не заморожений — його поля можна змінювати. Тому точніше казати не «незмінне значення», а «ім’я, яке не можна перепризначити».

        У JavaScript записи називаються об’єктами. Докладно про них — у розділі JS-04, а поки нам вистачить фігурних дужок і крапки.
      en: |
        Often a value is not a single number but a whole [[record]]: several named values together. A record is written in curly braces, and a single field is read with a dot:

        ```js
        const wish = { name: "Headphones", price: 80 };
        console.log(wish.price);   // 80
        ```

        A field can be changed — with `const` too:

        ```js
        wish.price = 70;                              // allowed: the record changes
        wish = { name: "Desk lamp", price: 45 };      // TypeError: wish is a const
        ```

        `const` fixes the **name**: `wish` will always point at the same record. The record itself is not frozen — its fields can change. So it is more accurate to say “a name that cannot be reassigned” than “an unchangeable value”.

        In JavaScript, records are called objects. They get a whole unit later (JS-04); for now, curly braces and a dot are all you need.

  - id: const-record
    kind: prediction
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
    prompt:
      uk: "Запис оголошено через `const`. Що виведе програма?"
      en: "The record is declared with `const`. What does the program print?"
    code: |
      const wish = { name: "%%headphones%%", price: 80 };
      wish.price = 70;
      console.log(wish.price);
    verify:
      logs: ["70"]
    answer:
      type: choice
      options:
        - id: seventy
          text:
            uk: "`70`"
            en: "`70`"
        - id: type-error
          text:
            uk: "`TypeError`: запис під `const` змінювати не можна"
            en: "`TypeError`: a record behind a `const` cannot be changed"
          why:
            uk: "`const` забороняє лише спрямувати ім’я `wish` на інше значення. Рядок 2 цього не робить — він змінює поле всередині того самого запису."
            en: "`const` only forbids pointing the name `wish` at another value. Line 2 does not do that — it changes a field inside the same record."
        - id: eighty
          text:
            uk: "`80`: зміна не збережеться"
            en: "`80`: the change does not stick"
          why:
            uk: "Зміна справжня: запис один, і тепер у його полі `price` лежить `70`."
            en: "The change is real: there is one record, and its `price` field now holds `70`."
      correct: [seventy]
    explanation:
      uk: "Рядок 2 не перепризначає `wish` — він змінює поле запису, на який `wish` вказує. Це дозволено. `const` захищає ім’я, а не вміст."
      en: "Line 2 does not reassign `wish` — it changes a field of the record `wish` points at. That is allowed. `const` protects the name, not the contents."

  - id: names-and-values
    kind: visual
    visual: memory-graph
    title:
      uk: "Імена вказують на значення"
      en: "Names point at values"
    textEquivalent:
      uk: >-
        Рядок let price = 80 створює ім’я price, яке вказує на число 80. Рядок let oldPrice = price
        створює друге ім’я, що вказує на те саме значення 80: нічого не перекладається з коробки в
        коробку. Повторне присвоєння price = 70 спрямовує на нове значення лише price, а oldPrice
        лишається на 80. Рядок const wish = { id: "w-01", price: 80 } створює запис, і ім’я wish
        вказує на нього. Рядок wish.price = 70 змінює поле всередині запису: wish і далі вказує на той
        самий запис, тому const тут не заважає. Заборонено інше — спрямувати wish на новий запис:
        таке присвоєння зупинилося б із TypeError.
      en: >-
        The line let price = 80 creates the name price, which points at the number 80. The line
        let oldPrice = price creates a second name pointing at the same value 80: nothing moves from
        one box into another. The reassignment price = 70 points only price at a new value, while
        oldPrice stays on 80. The line const wish = { id: "w-01", price: 80 } creates a record, and the
        name wish points at it. The line wish.price = 70 changes a field inside the record: wish still
        points at the same record, so const does not object. What is forbidden is pointing wish at a
        new record: that assignment would stop with a TypeError.
    spec:
      code: |
        let price = 80;
        let oldPrice = price;
        price = 70;
        const wish = { id: "w-01", price: 80 };
        wish.price = 70;
      states:
        - caption:
            uk: "`let price = 80` створює ім’я `price`, яке вказує на значення `80`."
            en: "`let price = 80` creates the name `price`, pointing at the value `80`."
          line: 1
          bindings:
            - { name: price, kind: let, value: 80 }
        - caption:
            uk: "`let oldPrice = price` — друге ім’я для того самого значення `80`. Ніякої «коробки» не скопійовано: просто два імені."
            en: "`let oldPrice = price` is a second name for the same value `80`. No “box” was copied: there are simply two names."
          line: 2
          bindings:
            - { name: price, kind: let, value: 80 }
            - { name: oldPrice, kind: let, value: 80 }
        - caption:
            uk: "Повторне присвоєння `price = 70` спрямовує на нове значення **лише** `price`. `oldPrice` лишився на `80`."
            en: "The reassignment `price = 70` points **only** `price` at a new value. `oldPrice` stays on `80`."
          line: 3
          bindings:
            - { name: price, kind: let, value: 70 }
            - { name: oldPrice, kind: let, value: 80 }
        - caption:
            uk: "`const wish` вказує на запис (#obj1). Ім’я закріплене: воно завжди вказуватиме саме на цей запис."
            en: "`const wish` points at a record (#obj1). The name is pinned: it will always point at this very record."
          line: 4
          bindings:
            - { name: price, kind: let, value: 70 }
            - { name: oldPrice, kind: let, value: 80 }
            - { name: wish, kind: const, value: { ref: obj1 } }
          heap:
            obj1: { kind: object, props: { id: "w-01", price: 80 } }
        - caption:
            uk: "`wish.price = 70` змінює поле **всередині** запису, а стрілка `wish` нікуди не рухається — тому `const` не заважає. А от `wish = { … }` зупинилося б із `TypeError`."
            en: "`wish.price = 70` changes a field **inside** the record, and the `wish` arrow does not move — so `const` does not object. But `wish = { … }` would stop with a `TypeError`."
          line: 5
          bindings:
            - { name: price, kind: let, value: 70 }
            - { name: oldPrice, kind: let, value: 80 }
            - { name: wish, kind: const, value: { ref: obj1 } }
          heap:
            obj1: { kind: object, props: { id: "w-01", price: 70 } }
          changed: [obj1]

  - id: labels
    kind: analogy
    body:
      uk: |
        Уяви ім’я як наліпку, приклеєну до значення, а не як коробку, у якій значення лежить. `let` — наліпка, яку можна переклеїти на інше значення. `const` — наліпка, приклеєна намертво: переклеїти її не можна, але річ, на якій вона висить, може змінюватися — як зошит із наліпкою «Покупки», у який дописують рядки.

        `let oldPrice = price;` приклеює другу наліпку до того самого значення. Якщо потім переклеїти `price` на нове значення, `oldPrice` лишиться на старому.
      en: |
        Picture a name as a sticker stuck on a value, not as a box the value sits in. `let` is a sticker you can peel off and put on another value. `const` is a sticker glued on for good: you cannot move it, but the thing it sits on can still change — like a notebook labeled “Shopping” that keeps getting new lines.

        `let oldPrice = price;` puts a second sticker on the same value. If you later move `price` to a new value, `oldPrice` stays on the old one.
    limits:
      uk: "Наліпки — лише спосіб говорити про імена: пам’ять комп’ютера влаштована інакше. І коли два імені вказують на один запис, зміна поля через одне ім’я видна через друге — це розберемо в розділі JS-04."
      en: "Stickers are only a way to talk about names: computer memory works differently. And when two names point at one record, a field changed through one name is visible through the other — JS-04 covers that."

  - id: discount
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: discount
    entry: index.js
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      home: { uk: "Дім", en: "Home" }
    title:
      uk: "Бажання зі знижкою"
      en: "A wish on sale"
    instructions:
      uk: |
        У списку бажань — «Настільна лампа»: ціна `45`, категорія «Дім». Згодом магазин знижує ціну на `5`.

        1. Оголоси імена `name`, `price` і `category` з цими значеннями. Подумай, яке з них зміниться — і для кожного обери `const` або `let`.
        2. Зменш `price` на `5`.
        3. Виведи назву, категорію і нову ціну одним `console.log`.

        Текст у коментарях підкаже, де що писати.
      en: |
        The wishlist has a “Desk lamp”: price `45`, category “Home”. Later the shop lowers the price by `5`.

        1. Declare the names `name`, `price` and `category` with these values. Think about which one will change — and pick `const` or `let` for each.
        2. Lower `price` by `5`.
        3. Print the name, the category and the new price with one `console.log`.

        The comments in the code show where each part goes.
    testTitles:
      "declares name, price and category":
        uk: "Оголошено name, price і category з потрібними значеннями"
        en: "name, price and category are declared with the right values"
      "lowers the price by 5":
        uk: "Після знижки ціна дорівнює 40"
        en: "After the discount the price is 40"
      "prints the name, the category and the new price":
        uk: "В одному рядку консолі — назва, категорія і нова ціна"
        en: "One console line shows the name, the category and the new price"
    hints:
      nudge:
        uk: "Яке з трьох значень зміниться далі в програмі? Саме його оголоси інакше, ніж решту."
        en: "Which of the three values changes later in the program? Declare that one differently from the others."
      explanation:
        uk: "Назва й категорія не змінюються — для них `const`. Ціна зміниться, тому `let price = 45;`. Щоб зменшити її, напиши `price = price - 5;` (або коротше `price -= 5;`) — без `let`: ім’я вже існує. `console.log` приймає кілька значень через кому."
        en: "The name and the category never change — use `const` for them. The price changes, so `let price = 45;`. To lower it, write `price = price - 5;` (or `price -= 5;` for short) — without `let`: the name already exists. `console.log` takes several values separated by commas."
    solutionNote:
      uk: "`const` — для того, що не змінюється; `let` — лише для ціни, яку перепризначаєш. `price = price - 5` спершу обчислює праву частину (`45 - 5`), а потім спрямовує `price` на результат `40`. Якби ціна була `const`, програма зупинилася б із `TypeError`."
      en: "`const` is for what never changes; `let` only for the price you reassign. `price = price - 5` first computes the right side (`45 - 5`) and then points `price` at the result, `40`. Had the price been a `const`, the program would stop with a `TypeError`."
    feedback:
      - when: { error: TypeError }
        message:
          uk: "Схоже, ти даєш нове значення імені, оголошеному через `const`. Якщо значення має змінитися, оголоси його через `let`."
          en: "It looks like you give a new value to a name declared with `const`. If a value has to change, declare it with `let`."
      - when: { test: "declares name, price and category" }
        message:
          uk: "Перевірка шукає три імені: `name`, `price` і `category`. Напиши їх саме так і признач значення з умови: назву й категорію — у лапках, ціну — числом без лапок."
          en: "The check looks for three names: `name`, `price` and `category`. Spell them exactly like that and assign the values from the task: the name and the category in quotes, the price as a number without quotes."
      - when: { test: "lowers the price by 5" }
        message:
          uk: "Після знижки `price` має дорівнювати `40`. Зміни саме `price`, без `let` чи `const` перед ним: `price = price - 5;`. Нове ім’я на кшталт `newPrice` не змінює `price`."
          en: "After the discount `price` must be `40`. Change `price` itself, with no `let` or `const` in front: `price = price - 5;`. A new name such as `newPrice` does not change `price`."
      - when: { test: "prints the name, the category and the new price" }
        message:
          uk: "Виведи все одним рядком і вже після знижки: `console.log(name, category, price);`."
          en: "Print everything in one line, after the discount: `console.log(name, category, price);`."

  - id: recall-unassigned
    kind: review
    title:
      uk: "Згадай: ім’я без значення"
      en: "Recall: a name without a value"
    items:
      - id: typeof-unassigned
        from: js-01-04-booleans-null-undefined
        prompt:
          uk: "У першому розділі ти бачив `undefined` як значення «ще не задано». Тепер ім’я оголошено через `let`, але значення йому не дали. Що виведе програма?"
          en: "In the first unit you saw `undefined` as the value for “not set yet”. Now a name is declared with `let` but given no value. What does the program print?"
        code: |
          let note;
          console.log(note, typeof note);
        verify:
          logs: ["undefined undefined"]
        answer:
          type: choice
          options:
            - id: undefined-twice
              text:
                uk: "`undefined undefined`"
                en: "`undefined undefined`"
            - id: null-object
              text:
                uk: "`null object`"
                en: "`null object`"
              why:
                uk: "`null` з’являється лише там, де його присвоїли навмисно. Ім’я без значення вказує на `undefined`."
                en: "`null` appears only where someone assigned it on purpose. A name without a value points at `undefined`."
            - id: reference-error
              text:
                uk: "`ReferenceError`: у `note` немає значення"
                en: "`ReferenceError`: `note` has no value"
              why:
                uk: "Ім’я `note` оголошено, тож JavaScript його знає. Значення ще немає — це і є `undefined`."
                en: "The name `note` is declared, so JavaScript knows it. It has no value yet — and that is exactly `undefined`."
          correct: [undefined-twice]
        explanation:
          uk: "Ось звідки береться [[undefined]]: `let note;` створює ім’я без значення, і JavaScript дає йому `undefined` — «ще не задано». [[typeof]] для нього повертає рядок `\"undefined\"`. А [[null]] з’являється лише там, де його написали навмисно. З `const` так не вийде: йому значення потрібне одразу."
          en: "This is where [[undefined]] comes from: `let note;` creates a name without a value, and JavaScript gives it `undefined` — “not set yet”. [[typeof]] returns the string `\"undefined\"` for it. [[null]], by contrast, appears only where someone wrote it on purpose. This does not work with `const`: it needs its value straight away."

  - id: to-project
    kind: transfer
    capstoneStep: JS-02
    body:
      uk: "У проєкті ти даватимеш імена полям свого запису. Пиши `const` за замовчуванням, а `let` залишай для того, що справді змінюється, — наприклад, для підпису, який збираєш крок за кроком."
      en: "In your project you will name the fields of your record. Use `const` by default and keep `let` for what really changes — for example, a label you build step by step."
