id: js-02-08-shadowing-strict-mode
unit: JS-02
title:
  uk: "Затінення й строгий режим"
  en: "Shadowing and strict mode"
kind: instructional
minutes: 8
contentVersion: 1
objectives:
  - uk: "Помітити затінену змінну й сказати, яку саме змінну читає певний рядок."
    en: "Spot a shadowed name and say which binding a given line reads."
  - uk: "Пояснити, що модулі працюють у строгому режимі і що там стається з присвоєнням неоголошеній змінній."
    en: "Explain that modules run in strict mode and what an assignment to an undeclared name does there."
prerequisites: [js-02-07-var-hoisting-tdz]
subskills:
  - { family: J-02, skill: "shadowing and strict mode", depth: intro }
glossary: [shadowing, strict-mode]
selfCheck: [predict-shadow, shadowed-total]

blocks:
  - id: shadow
    kind: explanation
    title:
      uk: "Дві змінні з однією назвою"
      en: "Two bindings, one name"
    body:
      uk: |
        У вкладеному блоці можна оголосити змінну з назвою, яка вже є зовні. Тоді всередині блоку діє **внутрішня** змінна, а зовнішня тимчасово схована. Це [[shadowing|затінення]].

        ```js
        const category = "food";
        let label = "Витрати";
        if (category === "food") {
          let label = "Їжа";     // a new, separate binding
          console.log(label);    // Їжа
        }
        console.log(label);      // Витрати
        ```

        Внутрішній `let label` — не зміна зовнішнього, а окрема змінна, яка живе до `}`. Шукаючи назву, JavaScript дивиться спершу в найближчий блок, потім назовні. Затінення дозволене, але заплутує — і найчастіше трапляється випадково, коли перед присвоєнням стоїть зайвий `let`.
      en: |
        A nested block may declare a name that already exists outside. Then the **inner** name is the one in effect inside the block, and the outer one is hidden for a while. This is [[shadowing]].

        ```js
        const category = "food";
        let label = "Spending";
        if (category === "food") {
          let label = "Food";    // a new, separate binding
          console.log(label);    // Food
        }
        console.log(label);      // Spending
        ```

        The inner `let label` does not change the outer one — it is a separate name that lives until the `}`. When looking a name up, JavaScript checks the nearest block first and then moves outward. Shadowing is allowed but confusing — and it most often happens by accident, when a stray `let` sits in front of an assignment.

  - id: predict-shadow
    kind: prediction
    prompt:
      uk: "Усередині блоку оголошено ще один `total`. Що виведе програма?"
      en: "Another `total` is declared inside the block. What does the program print?"
    code: |
      let total = 0;
      const amount = 18000;
      if (amount > 0) {
        let total = amount;
        console.log(total);
      }
      console.log(total);
    verify:
      logs: ["18000", "0"]
    answer:
      type: choice
      options:
        - id: inner-then-outer
          text:
            uk: "`18000`, потім `0`"
            en: "`18000`, then `0`"
        - id: updated
          text:
            uk: "`18000`, потім `18000`"
            en: "`18000`, then `18000`"
          why:
            uk: "Внутрішній `let total` створює нову змінну. Зовнішній `total` ніхто не змінював — він так і лишився `0`."
            en: "The inner `let total` creates a new name. Nobody changed the outer `total` — it is still `0`."
        - id: outer-twice
          text:
            uk: "`0`, потім `0`"
            en: "`0`, then `0`"
          why:
            uk: "Усередині блоку найближча змінна `total` — внутрішня, і вона дорівнює `18000`."
            en: "Inside the block the nearest `total` is the inner one, and it equals `18000`."
        - id: redeclared
          text:
            uk: "Помилка: змінну `total` уже оголошено"
            en: "An error: the name `total` is already declared"
          why:
            uk: "Повторне оголошення заборонене лише в тому самому блоці. У вкладеному блоці це затінення, і воно дозволене."
            en: "Declaring a name twice is forbidden only within the same block. In a nested block it is shadowing, and that is allowed."
      correct: [inner-then-outer]
    explanation:
      uk: "Блок `if` має власний `total`. Рядок 5 читає найближчий — внутрішній, `18000`. Після `}` внутрішня змінна зникає, і рядок 7 бачить зовнішній `total`, який так і лишився `0`."
      en: "The `if` block has a `total` of its own. Line 5 reads the nearest one — the inner one, `18000`. After the `}` the inner name is gone, and line 7 sees the outer `total`, which is still `0`."

  - id: nearest-scope
    kind: visual
    visual: code-trace
    title:
      uk: "Найближча змінна перемагає"
      en: "The nearest name wins"
    textEquivalent:
      uk: >-
        Змінну label зі значенням "food" оголошено в області модуля, тобто на верхньому рівні файлу.
        Умова 18000 > 0 правдива, і починається блок if — нова область видимості зі своїм let label,
        поки uninitialized. Тепер існують дві різні змінні label: у блоці й у модулі. Рядок 5 читає
        label, і JavaScript шукає цю назву від найближчого блоку назовні, тож знаходить внутрішнє "fun"
        і друкує його: зовнішня змінна затінена. Коли блок закінчується, внутрішня змінна зникає, і
        рядок 7 знаходить зовнішню label. Вона так і лишилася "food", бо внутрішній let її не змінював.
        У консолі fun, потім food.
      en: >-
        The name label with the value "food" is declared in the module scope. The condition 18000 > 0
        holds and the if block begins — a new scope with a let label of its own, still uninitialized. Now
        there are two different names label: one in the block and one in the module. Line 5 reads label,
        and JavaScript looks the name up from the nearest block outward, so it finds the inner "fun" and
        prints it: the outer one is shadowed. When the block ends, the inner name disappears and line 7
        finds the outer label. It is still "food", because the inner let never changed it. The console
        shows fun, then food.
    spec:
      file: visuals/nearest-scope.js
      captions:
        - at: { line: 2 }
          text:
            uk: "`label` — `\"food\"` в області модуля, тобто на верхньому рівні файлу."
            en: "`label` is `\"food\"` in the module scope, that is, at the top level of the file."
        - at: { line: 3, kind: cond }
          text:
            uk: "`18000 > 0` — `true`, заходимо в блок."
            en: "`18000 > 0` is `true`, so we enter the block."
        - at: { line: 4 }
          text:
            uk: "У блоці — **своя** змінна `label`, поки uninitialized. Тепер змінних `label` дві: у блоці й у модулі."
            en: "The block has a `label` **of its own**, still uninitialized. Now there are two names `label`: in the block and in the module."
        - at: { line: 5 }
          text:
            uk: "Рядок 5 читає `label`. JavaScript шукає від найближчого блоку назовні й знаходить внутрішнє `\"fun\"`. Зовнішня змінна затінена, але не змінена."
            en: "Line 5 reads `label`. JavaScript searches from the nearest block outward and finds the inner `\"fun\"`. The outer one is shadowed, not changed."
        - at: { line: 7, kind: stmt }
          text:
            uk: "Блок закінчився, і внутрішня змінна `label` зникла. Найближча тепер — зовнішня, і вона так і лишилася `\"food\"`."
            en: "The block is over and the inner `label` is gone. The nearest one now is the outer `label`, still `\"food\"`."
        - at: { line: 7, kind: end }
          text:
            uk: "У консолі `fun`, потім `food`: дві різні змінні, кожна зі своїм значенням."
            en: "The console shows `fun`, then `food`: two different names, each with its own value."

  - id: recall-reference-error
    kind: review
    title:
      uk: "Згадай: ReferenceError"
      en: "Recall: ReferenceError"
    items:
      - id: unknown-name
        from: js-01-05-reading-an-error
        prompt:
          uk: "У рядку 2 — одруківка. Що станеться під час запуску?"
          en: "Line 2 has a typo. What happens when this runs?"
        code: |
          let total = 0;
          totl = 5;
          console.log(total);
        verify:
          logs: []
          error: ReferenceError
        answer:
          type: choice
          options:
            - id: reference-error
              text:
                uk: "`ReferenceError` у рядку 2: назви `totl` JavaScript не знає"
                en: "A `ReferenceError` on line 2: JavaScript does not know the name `totl`"
            - id: five
              text:
                uk: "Виведе `5`"
                en: "It prints `5`"
              why:
                uk: "JavaScript не здогадується, що малося на увазі `total`. Для нього `totl` — просто невідома назва."
                en: "JavaScript does not guess that `total` was meant. To it, `totl` is just an unknown name."
            - id: zero
              text:
                uk: "Виведе `0`"
                en: "It prints `0`"
              why:
                uk: "Програма зупиниться вже в рядку 2, тож до `console.log` справа не дійде."
                en: "The program stops on line 2 already, so it never reaches `console.log`."
            - id: syntax-error
              text:
                uk: "`SyntaxError`"
                en: "A `SyntaxError`"
              why:
                uk: "Код прочитати можна. Проблема виникає під час виконання, коли трапляється невідома назва, — це `ReferenceError`."
                en: "The code can be read. The problem shows up while running, when an unknown name appears — that is a `ReferenceError`."
          correct: [reference-error]
        explanation:
          uk: "`ReferenceError` означає звернення до назви, якої JavaScript не знає. Тут це одруківка: `totl` замість `total`. Те, що програма зупинилася, а не створила мовчки нову змінну, — заслуга строгого режиму."
          en: "A `ReferenceError` means the code used a name JavaScript does not know. Here it is a typo: `totl` instead of `total`. That the program stopped instead of silently creating a new name is thanks to strict mode."

  - id: strict
    kind: explanation
    title:
      uk: "Строгий режим"
      en: "Strict mode"
    body:
      uk: |
        Що буде, якщо присвоїти значення назві, яку ніде не оголошено?

        ```js
        let total = 0;
        totl = 5;    // a typo: total was meant
        ```

        Колись JavaScript мовчки створював таку змінну, і одруківка ставала тихою помилкою: `total` лишався `0`, а програма йшла далі. Сучасний код працює у [[strict-mode|строгому режимі (strict mode)]]: там присвоєння неоголошеній назві зупиняє програму з `ReferenceError: totl is not defined`.

        Код на цій платформі, як і в сучасних проєктах, виконується як **модуль** — окремий файл зі своїми змінними верхнього рівня, — а модулі **завжди** працюють у строгому режимі. У старих скриптах його вмикають рядком коду `"use strict";` на початку файла.
      en: |
        What happens if you assign a value to a name that is declared nowhere?

        ```js
        let total = 0;
        totl = 5;    // a typo: total was meant
        ```

        Long ago JavaScript silently created such a name, and the typo became a silent bug: `total` stayed `0` and the program carried on. Modern code runs in [[strict-mode|strict mode]]: there, assigning to an undeclared name stops the program with `ReferenceError: totl is not defined`.

        The code on this platform, like code in modern projects, runs as a **module** — a separate file with top-level names of its own — and modules **always** run in strict mode. Old scripts switch it on with the line `"use strict";` at the top of the file.

  - id: try-shadow
    kind: example
    runtime: browser-js
    dir: try-shadow
    entry: index.js
    strings:
      inside: { uk: "У блоці:", en: "Inside the block:" }
      outside: { uk: "Після блоку:", en: "After the block:" }
    title:
      uk: "Перейменуй — і все видно"
      en: "Rename it and everything is clear"
    body:
      uk: |
        Запусти: у блоці `total` дорівнює ціні обіду, а після блоку — знову `0`.
      en: |
        Run it: inside the block `total` equals the price of lunch, and after the block it is `0` again.
    tryIt:
      uk: |
        1. Перейменуй внутрішню змінну на `lunchTotal` (і в `console.log` під нею) — тепер одразу видно, що змінних дві.
        2. Поверни внутрішній змінній назву `total` (і в `console.log` теж) і прибери перед нею `let` — тепер блок змінює зовнішній `total`, і після блоку теж друкується ціна обіду.
        3. Додай у кінці рядок коду `totl = 1;` з одруківкою й прочитай `ReferenceError`: у строгому режимі неоголошена змінна мовчки не створюється.
      en: |
        1. Rename the inner name to `lunchTotal` (and in the `console.log` below it) — now you can see at once that there are two names.
        2. Rename the inner one back to `total` (in the `console.log` too) and remove the `let` in front of it — now the block changes the outer `total`, and the price of lunch is printed after the block too.
        3. Add a line `totl = 1;` with a typo at the end and read the `ReferenceError`: in strict mode an undeclared name is never created silently.

  - id: shadowed-total
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: shadowed-total
    entry: index.js
    strings:
      day: { uk: "День", en: "Day" }
      week: { uk: "За тиждень:", en: "Week total:" }
    title:
      uk: "Підсумок, що лишається нулем"
      en: "A total that stays zero"
    instructions:
      uk: |
        Програма рахує витрати на проїзд за тиждень: щодня один квиток за `800` копійок. Після кожного дня консоль має показувати накопичений підсумок, а наприкінці — суму за тиждень:

        ```text
        День 1 800
        День 2 1600
        …
        День 7 5600
        За тиждень: 5600
        ```

        Зараз щодня видно `800`, а за тиждень — `0`. Знайди причину й виправ, не змінюючи очікуваного виводу.
      en: |
        The program adds up a week of transit costs: one fare of `800` minor units per day. After each day the console should show the running total, and at the end the week total:

        ```text
        Day 1 800
        Day 2 1600
        …
        Day 7 5600
        Week total: 5600
        ```

        Right now every day shows `800` and the week shows `0`. Find the cause and fix it without changing the expected output.
    testTitles:
      "the running total grows every day":
        uk: "Накопичений підсумок зростає щодня"
        en: "The running total grows every day"
      "the week total is 5600":
        uk: "Підсумок за тиждень — 5600"
        en: "The week total is 5600"
    hints:
      nudge:
        uk: "Скільки різних змінних `total` існує в цій програмі? Яку з них друкує останній рядок коду?"
        en: "How many different names `total` exist in this program? Which one does the last line print?"
      explanation:
        uk: "Усередині циклу стоїть ще одне оголошення `total`. На кожному проході воно створює нову змінну, яка затіняє зовнішню й починає з нуля, — тож додавання дістається їй, а не зовнішньому підсумку. Щоб тіло змінювало зовнішній `total` — той, який друкує останній рядок, — у циклі не має бути власного `total`."
        en: "There is one more declaration of `total` inside the loop. On every pass it creates a new name that shadows the outer one and starts from zero — so the addition goes to it, not to the outer total. For the body to change the outer `total` — the one the last line prints — the loop must not have a `total` of its own."
    solutionNote:
      uk: "У циклі більше немає власного `total`, тож `total = total + fare` змінює зовнішній підсумок: щодня +800, за тиждень — 5600. Затінення дозволене, і саме тому воно підступне: програма не падає, а мовчки рахує не те."
      en: "The loop no longer has a `total` of its own, so `total = total + fare` changes the outer total: +800 a day, 5600 for the week. Shadowing is allowed, and that is exactly what makes it sneaky: the program does not crash, it silently computes the wrong thing."
    feedback:
      - when: { test: "the week total is 5600" }
        message:
          uk: "Тиждень — це 7 × 800 = 5600. Вийшов `0`? Тоді тіло циклу змінює не зовнішній `total`, а власну змінну з тією самою назвою, яка його затіняє."
          en: "A week is 7 × 800 = 5600. Got `0`? Then the loop body changes not the outer `total` but a name of its own with the same spelling, which shadows it."
      - when: { test: "the running total grows every day" }
        message:
          uk: "Щодня підсумок має зростати: 800, 1600, 2400… Щодня `800`? Значить, на кожному проході підсумок створюється заново й починається з нуля."
          en: "The total must grow every day: 800, 1600, 2400… Is it `800` every day? Then the total is created anew on every pass and starts from zero."
      - when: { error: ReferenceError }
        message:
          uk: "Програма не знайшла змінну, яку називає повідомлення. Якщо це `total`, то, мабуть, зникло його оголошення перед циклом: підсумок, потрібний і в циклі, і після нього, оголошують **перед** циклом."
          en: "The program could not find the name the message mentions. If it is `total`, its declaration before the loop has probably gone: a total needed both in the loop and after it is declared **before** the loop."

  - id: to-project
    kind: transfer
    capstoneStep: JS-02
    body:
      uk: "У проєкті легко назвати однаково зовнішню й внутрішню змінну — скажімо, `label`. Давай різні назви, а `let` пиши лише там, де змінна створюється вперше."
      en: "In your project it is easy to give an outer and an inner value the same name — say, `label`. Use different names, and write `let` only where a name is created for the first time."
