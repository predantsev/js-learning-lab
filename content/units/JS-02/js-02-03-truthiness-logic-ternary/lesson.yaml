id: js-02-03-truthiness-logic-ternary
unit: JS-02
title:
  uk: "Правдивість, і/або та тернарний оператор"
  en: "Truthiness, and-or logic and the ternary"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Назвати falsy-значення й передбачити, що повертають `&&` і `||`: один з операндів, а не обов’язково `true` чи `false`."
    en: "Name the falsy values and predict what `&&` and `||` return: one of the operands, not necessarily `true` or `false`."
  - uk: "Читати тернарний оператор і змішаний вираз з `&&` та `||` у порядку пріоритетів."
    en: "Read a ternary and a mixed `&&`/`||` expression in precedence order."
prerequisites: [js-02-02-equality-coercion]
subskills:
  - { family: J-01, skill: "equality/coercion/truthiness", depth: practice }
  - { family: J-01, skill: "arithmetic/logical/assignment/ternary precedence", depth: practice }
glossary: [truthy, falsy, short-circuit, ternary]
selfCheck: [predict-operands, predict-show, status-word]

blocks:
  - id: truthy-falsy
    kind: explanation
    title:
      uk: "Кожне значення — «так» або «ні»"
      en: "Every value is a yes or a no"
    body:
      uk: |
        Коли JavaScript чекає відповіді «так» чи «ні», будь-яке значення він сприймає як одну з них. Як саме — показує `Boolean(значення)`: воно перетворює будь-яке значення на `true` чи `false`.

        Лише кілька значень поводяться як «ні». Їх називають [[falsy]]:

        | Значення | Що це |
        |---|---|
        | `false` | хибність |
        | `0` | нуль (і рідкісний `-0`) |
        | `""` | порожній рядок — текст без жодного символу |
        | `null` | навмисна порожнеча |
        | `undefined` | ще не задано |
        | `NaN` | «не число» |

        Усе інше — [[truthy]]. Навіть `"0"`, `" "` (пробіл) і `"false"`: це непорожні рядки.

        ```js
        console.log(Boolean(0));     // false
        console.log(Boolean("0"));   // true: a non-empty string
        ```

        Є ще один falsy-нуль — `0n`, з ним познайомишся в уроці про рідкісні оператори.
      en: |
        When JavaScript expects a yes or a no, it can read any value that way. `Boolean(value)` shows how: it turns any value into `true` or `false`.

        Only a few values behave like “no”. They are called [[falsy]]:

        | Value | What it is |
        |---|---|
        | `false` | false |
        | `0` | zero (and the rare `-0`) |
        | `""` | the empty string |
        | `null` | deliberately empty |
        | `undefined` | not set yet |
        | `NaN` | “not a number” |

        Everything else is [[truthy]]. Even `"0"`, `" "` (a space) and `"false"`: they are non-empty strings.

        ```js
        console.log(Boolean(0));     // false
        console.log(Boolean("0"));   // true: a non-empty string
        ```

        There is one more falsy zero, `0n` — you will meet it in the lesson on rare operators.

  - id: and-or
    kind: explanation
    title:
      uk: "|| і && повертають операнд"
      en: "|| and && return an operand"
    body:
      uk: |
        `a || b` читай як «перше truthy-значення»: якщо `a` truthy, результат — **саме `a`**, інакше — `b`.

        `a && b` — навпаки, «перше falsy-значення»: якщо `a` falsy, результат — `a`, інакше — `b`.

        ```js
        console.log("Лампа" || "без назви");   // Лампа
        console.log("" || "без назви");        // без назви
        console.log(0 && "Лампа");             // 0
        ```

        Результат — одне з двох значень, а не обов’язково `true` чи `false`. Друге значення JavaScript навіть не обчислює, якщо відповідь уже відома з першого. Це називають [[short-circuit]] — «коротке замикання».
      en: |
        Read `a || b` as “the first truthy value”: if `a` is truthy, the result is **`a` itself**; otherwise it is `b`.

        `a && b` is the opposite, “the first falsy value”: if `a` is falsy, the result is `a`; otherwise it is `b`.

        ```js
        console.log("Lamp" || "untitled");   // Lamp
        console.log("" || "untitled");       // untitled
        console.log(0 && "Lamp");            // 0
        ```

        The result is one of the two values, not necessarily `true` or `false`. JavaScript does not even evaluate the second value when the first one already decides the answer. This is called [[short-circuit]] evaluation.

  - id: predict-operands
    kind: prediction
    strings:
      fallback: { uk: "запасне", en: "fallback" }
    prompt:
      uk: "Що виведе кожен рядок коду?"
      en: "What does each line print?"
    code: |
      console.log(0 || "x");
      console.log("a" && 0);
      console.log(null || undefined);
      console.log("" || 0 || "%%fallback%%");
    verify:
      logs: ["x", "0", "undefined", "%%fallback%%"]
    answer:
      type: choice
      options:
        - id: operands
          text:
            uk: "`x`, `0`, `undefined`, `запасне`"
            en: "`x`, `0`, `undefined`, `fallback`"
        - id: booleans
          text:
            uk: "`true`, `false`, `false`, `true`"
            en: "`true`, `false`, `false`, `true`"
          why:
            uk: "`||` і `&&` не перетворюють результат на `true` чи `false`. Вони повертають те значення, на якому зупинилися."
            en: "`||` and `&&` do not turn the result into `true` or `false`. They return the value they stopped at."
        - id: stop-at-null
          text:
            uk: "`x`, `0`, `null`, `запасне`"
            en: "`x`, `0`, `null`, `fallback`"
          why:
            uk: "`null` — falsy, тож `||` іде далі й повертає друге значення, навіть якщо воно теж falsy: `undefined`."
            en: "`null` is falsy, so `||` moves on and returns the second value, even though it is falsy too: `undefined`."
        - id: and-first
          text:
            uk: "`x`, `a`, `undefined`, `запасне`"
            en: "`x`, `a`, `undefined`, `fallback`"
          why:
            uk: "`&&` зупиняється на першому falsy-значенні. `\"a\"` truthy, тож результатом стає друге — `0`."
            en: "`&&` stops at the first falsy value. `\"a\"` is truthy, so the result is the second one, `0`."
      correct: [operands]
    explanation:
      uk: "`0 || \"x\"`: `0` falsy, тож результат — `\"x\"`. `\"a\" && 0`: `\"a\"` truthy, тож результат — другий операнд, `0`. `null || undefined`: `null` falsy, результат — `undefined`, хоч воно теж falsy. У ланцюжку `\"\" || 0 || \"запасне\"` перше truthy-значення — останнє."
      en: "`0 || \"x\"`: `0` is falsy, so the result is `\"x\"`. `\"a\" && 0`: `\"a\"` is truthy, so the result is the second operand, `0`. `null || undefined`: `null` is falsy, the result is `undefined`, falsy as it is. In the chain `\"\" || 0 || \"fallback\"` the first truthy value is the last one."

  - id: short-circuit-steps
    kind: visual
    visual: code-trace
    title:
      uk: "Хто обчислюється, а хто — ні"
      en: "Which operands get evaluated"
    textEquivalent:
      uk: >-
        Допоміжна функція evaluate друкує номер операнда, який JavaScript зараз обчислює, і дає те
        значення, яке їй передали: evaluate(1, 0) друкує 1 і дає 0, наче на цьому місці просто написано 0.
        У виразі evaluate(1, 0) || evaluate(2, 5) перший операнд дає 0 — falsy, тож
        || обчислює другий і повертає 5. У виразі evaluate(1, 45) || evaluate(2, 0) перший операнд
        дає 45 — truthy, і другий операнд не обчислюється взагалі: результат 45. У виразі
        evaluate(1, 0) && evaluate(2, 45) перший операнд дає 0 — falsy, тож && одразу повертає 0, не
        обчислюючи другий. У виразі evaluate(1, 45) && evaluate(2, 80) перший операнд truthy, тож &&
        обчислює другий і повертає 80. Консоль показує номери обчислених операндів: 1, 2, 1, 1, 1, 2,
        а потім результати 5 45 0 80 — щоразу один з операндів, а не true чи false.
      en: >-
        The helper function evaluate prints the number of the operand JavaScript is evaluating and gives
        back the value it was given: evaluate(1, 0) prints 1 and gives 0, as if 0 were simply written in
        its place. In evaluate(1, 0) || evaluate(2, 5) the first operand gives 0 — falsy — so
        || evaluates the second one and returns 5. In evaluate(1, 45) || evaluate(2, 0) the first operand
        gives 45 — truthy — and the second operand is not evaluated at all: the result is 45. In
        evaluate(1, 0) && evaluate(2, 45) the first operand gives 0 — falsy — so && returns 0 at once
        without evaluating the second. In evaluate(1, 45) && evaluate(2, 80) the first operand is truthy,
        so && evaluates the second and returns 80. The console shows the numbers of the evaluated
        operands, 1, 2, 1, 1, 1, 2, then the results 5 45 0 80 — each time one of the operands, not true
        or false.
    spec:
      file: visuals/short-circuit.js
      captions:
        - at: { line: 6 }
          text:
            uk: "Рядки 1–4 описують допоміжну функцію `evaluate` (писати функції навчишся в розділі JS-03). Тут досить знати одне: `evaluate(1, 0)` друкує в консоль номер операнда — `1` — і дає значення `0`, наче на цьому місці просто написано `0`. Так консоль покаже, які операнди JavaScript справді обчислив. Стеж за консоллю й підсвіченим рядком; `count`, `price`, `free` і `total` поки позначені uninitialized — про це в уроці 7. Перший вираз: `evaluate(1, 0) || evaluate(2, 5)`."
            en: "Lines 1–4 describe a helper function, `evaluate` (writing functions comes in JS-03). All you need here: `evaluate(1, 0)` prints the operand number — `1` — to the console and gives the value `0`, as if `0` were simply written in its place. That way the console shows which operands JavaScript really evaluated. Watch the console and the highlighted line; `count`, `price`, `free` and `total` are marked uninitialized for now — lesson 7 explains that. The first expression: `evaluate(1, 0) || evaluate(2, 5)`."
        - at: { line: 3, kind: return, hit: 1 }
          text:
            uk: "Операнд 1 дав `0` — falsy. Для `||` це ще не відповідь, тож JavaScript обчислює операнд 2."
            en: "Operand 1 gave `0` — falsy. For `||` that is not the answer yet, so JavaScript evaluates operand 2."
        - at: { line: 3, kind: return, hit: 2 }
          text:
            uk: "Операнд 2 дав `5`. Варіантів більше немає, тож `||` повертає саме це значення."
            en: "Operand 2 gave `5`. There are no more options, so `||` returns this very value."
        - at: { line: 7 }
          text:
            uk: "`count` — це `5`, а не `true`. Наступний вираз: `evaluate(1, 45) || evaluate(2, 0)`."
            en: "`count` is `5`, not `true`. The next expression: `evaluate(1, 45) || evaluate(2, 0)`."
        - at: { line: 3, kind: return, hit: 3 }
          text:
            uk: "Операнд 1 дав `45` — truthy. `||` уже знає відповідь і **не обчислює** операнд 2. Це і є short-circuit."
            en: "Operand 1 gave `45` — truthy. `||` already knows the answer and **does not evaluate** operand 2. That is short-circuit evaluation."
        - at: { line: 8 }
          text:
            uk: "`price` — `45`, а цей вираз додав у консоль лише `1`: операнд 2 не обчислювався. Тепер `&&`: `evaluate(1, 0) && evaluate(2, 45)`."
            en: "`price` is `45`, and this expression added only `1` to the console: operand 2 was never evaluated. Now `&&`: `evaluate(1, 0) && evaluate(2, 45)`."
        - at: { line: 3, kind: return, hit: 4 }
          text:
            uk: "Операнд 1 дав `0` — falsy. Для `&&` цього досить: результат — сам `0`, операнд 2 пропускається."
            en: "Operand 1 gave `0` — falsy. For `&&` that settles it: the result is `0` itself, operand 2 is skipped."
        - at: { line: 9 }
          text:
            uk: "`free` — `0`. Останній вираз: `evaluate(1, 45) && evaluate(2, 80)`."
            en: "`free` is `0`. The last expression: `evaluate(1, 45) && evaluate(2, 80)`."
        - at: { line: 3, kind: return, hit: 5 }
          text:
            uk: "Операнд 1 дав `45` — truthy. `&&` ще не знає відповіді й мусить обчислити операнд 2."
            en: "Operand 1 gave `45` — truthy. `&&` does not know the answer yet and has to evaluate operand 2."
        - at: { line: 3, kind: return, hit: 6 }
          text:
            uk: "Операнд 2 дав `80` — і `&&` повертає саме його."
            en: "Operand 2 gave `80` — and `&&` returns exactly that."
        - at: { line: 10, kind: end }
          text:
            uk: "Підсумок: `5 45 0 80`. Щоразу результат — один з операндів, а консоль показує, які операнди взагалі обчислювались: `1, 2, 1, 1, 1, 2`."
            en: "In total: `5 45 0 80`. Each result is one of the operands, and the console shows which operands were evaluated at all: `1, 2, 1, 1, 1, 2`."

  - id: recall-precedence
    kind: review
    title:
      uk: "Згадай: порядок дій"
      en: "Recall: order of operations"
    items:
      - id: times-before-plus
        from: js-01-03-arithmetic-precedence
        prompt:
          uk: "Що виведе цей рядок коду?"
          en: "What does this line print?"
        code: |
          console.log(10 - 4 / 2, (10 - 4) / 2);
        verify:
          logs: ["8 3"]
        answer:
          type: choice
          options:
            - id: precedence
              text:
                uk: "`8 3`"
                en: "`8 3`"
            - id: left-to-right
              text:
                uk: "`3 3`"
                en: "`3 3`"
              why:
                uk: "Ділення виконується раніше за віднімання, навіть якщо стоїть правіше: `10 - 2`."
                en: "Division runs before subtraction even when it stands further right: `10 - 2`."
            - id: parens-ignored
              text:
                uk: "`8 8`"
                en: "`8 8`"
              why:
                uk: "Дужки змінюють порядок: спершу `10 - 4`, потім ділення на `2`."
                en: "Parentheses change the order: first `10 - 4`, then the division by `2`."
          correct: [precedence]
        explanation:
          uk: "`/` має вищий [[precedence|пріоритет]], ніж `-`, а дужки цей порядок змінюють. Логічні оператори теж мають пріоритети — про них одразу далі."
          en: "`/` has a higher [[precedence]] than `-`, and parentheses change that order. Logical operators have precedences too — they come right next."

  - id: ternary-precedence
    kind: explanation
    title:
      uk: "Тернарний оператор і порядок логіки"
      en: "The ternary and the order of logic"
    body:
      uk: |
        [[ternary|Тернарний оператор]] обирає одне з двох значень: `умова ? якщоТак : якщоНі`.

        ```js
        const status = wish.acquired ? "отримано" : "хочу";
        ```

        Це [[expression|вираз]], тому результат можна одразу присвоїти чи вивести.

        Коли у виразі кілька операторів, JavaScript подумки розставляє дужки за [[precedence|пріоритетом]] — від найсильнішого до найслабшого: `!` → порівняння (`>`, `===`) → `&&` → `||` → `? :` → присвоєння `=`. Тобто `&&` «зв’язує» сильніше за `||` — як множення сильніше за додавання:

        ```js
        a && b || c     // means (a && b) || c
        a || b && c     // means a || (b && c)
        ```

        Пріоритет вирішує лише, як вираз поділено на частини. Обчислюються ці частини зліва направо й з коротким замиканням: у другому прикладі, якщо `a` truthy, до `b && c` справа взагалі не дійде.

        Коли сумніваєшся — став дужки. Вони нічого не коштують і допомагають тому, хто читатиме код після тебе.
      en: |
        The [[ternary]] operator picks one of two values: `condition ? ifYes : ifNo`.

        ```js
        const status = wish.acquired ? "got it" : "wanted";
        ```

        It is an [[expression]], so its result can be assigned or printed straight away.

        When an expression has several operators, JavaScript mentally places parentheses by [[precedence]] — from the strongest to the weakest: `!` → comparisons (`>`, `===`) → `&&` → `||` → `? :` → assignment `=`. So `&&` binds tighter than `||` — just as multiplication binds tighter than addition:

        ```js
        a && b || c     // means (a && b) || c
        a || b && c     // means a || (b && c)
        ```

        Precedence only decides how the expression is split into parts. Those parts are evaluated from left to right, with short-circuiting: in the second example, if `a` is truthy, `b && c` is never reached at all.

        When in doubt, add parentheses. They cost nothing and help whoever reads the code after you.

  - id: predict-show
    kind: prediction
    strings:
      show: { uk: "Показати на сьогодні:", en: "Show for today:" }
    prompt:
      uk: "Справу вже виконано, але її термін — сьогодні. Що виведе програма?"
      en: "The task is already done, but it is due today. What does the program print?"
    code: |
      const done = true;
      const highPriority = false;
      const dueToday = true;
      const show = !done && highPriority || dueToday;
      console.log("%%show%%", show);
    verify:
      logs: ["%%show%% true"]
    answer:
      type: choice
      options:
        - id: or-last
          text:
            uk: "`true`: спершу `!done && highPriority`, а потім `|| dueToday`"
            en: "`true`: first `!done && highPriority`, then `|| dueToday`"
        - id: and-last
          text:
            uk: "`false`: `!done` — це `false`, тож усе інше не має значення"
            en: "`false`: `!done` is `false`, so nothing else matters"
          why:
            uk: "Так було б, якби вираз означав `!done && (highPriority || dueToday)`. Але `&&` зв’язує сильніше: це `(!done && highPriority) || dueToday`, а `dueToday` — `true`."
            en: "That would be true if the expression meant `!done && (highPriority || dueToday)`. But `&&` binds tighter: it is `(!done && highPriority) || dueToday`, and `dueToday` is `true`."
        - id: left-to-right
          text:
            uk: "`false`: JavaScript рахує зліва направо, і перша частина вже хибна"
            en: "`false`: JavaScript works left to right, and the first part is already false"
          why:
            uk: "Зліва направо JavaScript справді йде, але спершу групує вираз за пріоритетами: `(!done && highPriority) || dueToday`. Хибна лише ліва група, а після `||` ще стоїть `dueToday`, і воно `true`."
            en: "JavaScript does go from left to right, but first it groups the expression by precedence: `(!done && highPriority) || dueToday`. Only the left group is false, and after the `||` there is still `dueToday`, which is `true`."
      correct: [or-last]
    explanation:
      uk: "За пріоритетами вираз читається так: `((!done) && highPriority) || dueToday`. `!done` — `false`, тож `false && …` — `false`. Далі `false || dueToday` — `true`. Виконану справу програма покаже — це помилка в логіці, яку виправлять дужки."
      en: "By precedence the expression reads as `((!done) && highPriority) || dueToday`. `!done` is `false`, so `false && …` is `false`. Then `false || dueToday` is `true`. The program shows a task that is already done — a logic bug that parentheses will fix."

  - id: try-chain
    kind: example
    runtime: browser-js
    dir: try-chain
    entry: index.js
    strings:
      show: { uk: "Показати на сьогодні:", en: "Show for today:" }
    title:
      uk: "Дужки змінюють сенс"
      en: "Parentheses change the meaning"
    body:
      uk: |
        Задумано так: показувати справу, якщо вона **не виконана** і при цьому важлива **або** на сьогодні. Запусти й переконайся, що виконану справу все одно позначено для показу: у консолі `true`.
      en: |
        The intent: show a task if it is **not done** and, on top of that, important **or** due today. Run it and see that the finished task is still marked to be shown: the console says `true`.
    tryIt:
      uk: "Додай дужки так, щоб вираз означав «не виконана І (важлива АБО на сьогодні)», і запусти — тепер `false`. Потім зміни `done` на `false`: знову `true`. Так ти перевіриш обидва випадки."
      en: "Add parentheses so the expression means “not done AND (important OR due today)” and run it — now it is `false`. Then set `done` to `false`: `true` again. That way you check both cases."

  - id: status-word
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: status-word
    entry: index.js
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      active: { uk: "активна", en: "active" }
      paused: { uk: "на паузі", en: "paused" }
    title:
      uk: "Статус звички одним виразом"
      en: "A habit status in one expression"
    instructions:
      uk: |
        Звичка має поле `active`: `true` — звичка активна, `false` — на паузі.

        Для кожної звички заміни порожні лапки `""` тернарним оператором, який обирає `activeWord` або `pausedWord`. Рядки коду з `console.log` не змінюй.
      en: |
        A habit has an `active` field: `true` means the habit is active, `false` means it is paused.

        For each habit, replace the empty quotes `""` with a ternary that picks `activeWord` or `pausedWord`. Leave the lines of code with `console.log` as they are.
    testTitles:
      "an active habit gets the active word":
        uk: "Активна звичка отримує слово з activeWord"
        en: "An active habit gets the word in activeWord"
      "a paused habit gets the paused word":
        uk: "Звичка на паузі отримує слово з pausedWord"
        en: "A paused habit gets the word in pausedWord"
    hints:
      nudge:
        uk: "Тернарний оператор: `умова ? значенняЯкщоТак : значенняЯкщоНі`. Що тут умова?"
        en: "The ternary: `condition ? valueIfYes : valueIfNo`. What is the condition here?"
      explanation:
        uk: "Умова — саме поле `active` звички: воно вже `true` або `false`, порівнювати його ні з чим не треба. Будова та сама, що в `wish.acquired ? \"отримано\" : \"хочу\"` з пояснення, тільки замість слів у лапках постав змінні зі словами."
        en: "The condition is the habit’s `active` field itself: it is already `true` or `false`, so there is nothing to compare it with. The shape is the same as in `wish.acquired ? \"got it\" : \"wanted\"` from the explanation, only put the names holding the words where the quoted words were."
    solutionNote:
      uk: "`active` уже є булевим значенням, тож він сам — умова. Тернарний оператор повертає одне з двох слів. Запис `active && activeWord || pausedWord` тут теж спрацює, але зламається, щойно перше слово стане falsy, наприклад порожнім рядком; тернарний оператор такої пастки не має."
      en: "`active` is already a boolean, so it is the condition itself. The ternary returns one of the two words. `active && activeWord || pausedWord` also works here, but breaks as soon as the first word becomes falsy, for example an empty string; the ternary has no such trap."
    feedback:
      - when: { test: "an active habit gets the active word" }
        message:
          uk: "Активна звичка має отримати `activeWord`. Отримала `true`? Тоді там `||`: він повертає сам операнд, а не слово. Отримала `pausedWord`? Перевір, чи значення після `?` і після `:` не переплутані і чи не порівнюєш `true` з рядком `\"true\"` (`true == \"true\"` — це `false`)."
          en: "An active habit must get `activeWord`. Got `true`? Then there is a `||`: it returns the operand itself, not the word. Got `pausedWord`? Check that the values after `?` and after `:` are not swapped and that you are not comparing `true` with the string `\"true\"` (`true == \"true\"` is `false`)."
      - when: { test: "a paused habit gets the paused word" }
        message:
          uk: "Звичка на паузі (`active: false`) має отримати `pausedWord`. Перевір порядок: спершу значення для «так», після двокрапки — для «ні»."
          en: "A paused habit (`active: false`) must get `pausedWord`. Check the order: the value for “yes” first, the one for “no” after the colon."

  - id: to-project
    kind: transfer
    capstoneStep: JS-02
    body:
      uk: "У проєкті ти збиратимеш підписи на кшталт «отримано / хочу» чи «щодня / щотижня». Тернарний оператор — найкоротший спосіб обрати одне з двох слів, а дужки в умовах захистять від сюрпризів пріоритету."
      en: "In your project you will build labels like “got it / wanted” or “daily / weekly”. The ternary is the shortest way to pick one of two words, and parentheses in conditions protect you from precedence surprises."
