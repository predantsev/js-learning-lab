id: js-02-07-var-hoisting-tdz
unit: JS-02
title:
  uk: "Читаємо застарілий var, підняття і TDZ"
  en: "Reading legacy var, hoisting and the TDZ"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Пояснити, чому `var`, прочитаний до свого рядка, дає `undefined`, а `let` у такій самій ситуації зупиняє програму (TDZ)."
    en: "Explain why a `var` read before its line gives `undefined`, while a `let` in the same situation stops the program (TDZ)."
  - uk: "Відрізнити блочну область видимості від області видимості всього файлу й сказати, яке оголошення «витікає» з блоку."
    en: "Tell block scope from the scope of the whole file and say which declaration leaks out of a block."
prerequisites: [js-02-05-if-else-switch]
subskills:
  - { family: J-02, skill: "legacy var reading", depth: intro }
  - { family: J-02, skill: "hoisting and TDZ", depth: intro }
  - { family: J-02, skill: "lexical/function/block scope", depth: intro }
glossary: [var, hoisting, temporal-dead-zone, block-scope, function-scope]
selfCheck: [predict-before, smallest-block]

blocks:
  - id: blocks
    kind: explanation
    title:
      uk: "Блок — це фігурні дужки"
      en: "A block is a pair of curly braces"
    body:
      uk: |
        Змінна, оголошена через `let` чи `const` усередині `{ }` — у тілі `if`, `else` чи циклу, — існує лише в цьому блоці. Це [[block-scope|блочна область видимості]].

        ```js
        const price = 45;
        if (price > 40) {
          const note = "дорого";
          console.log(note);     // works
        }
        console.log(note);       // ReferenceError: note is not defined
        ```

        Після закривної дужки `note` зникає. Це зручно: змінна не плутається з іншими й не заважає там, де вона не потрібна. Тому оголошуй змінні в **найменшому** блоці, який ними користується.
      en: |
        A name declared with `let` or `const` inside `{ }` — the body of an `if`, an `else` or a loop — exists only in that block. This is [[block-scope|block scope]].

        ```js
        const price = 45;
        if (price > 40) {
          const note = "pricey";
          console.log(note);     // works
        }
        console.log(note);       // ReferenceError: note is not defined
        ```

        After the closing brace `note` is gone. That is convenient: the name does not get mixed up with others and does not get in the way where it is not needed. So declare names in the **smallest** block that uses them.

  - id: recall-not-yet
    kind: review
    title:
      uk: "Згадай: ще не задано"
      en: "Recall: not set yet"
    items:
      - id: undefined-then-value
        from: js-01-04-booleans-null-undefined
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          let total;
          const bonus = null;
          console.log(total, bonus);
          total = 120;
          console.log(total);
        verify:
          logs: ["undefined null", "120"]
        answer:
          type: choice
          options:
            - id: undefined-null-120
              text:
                uk: "`undefined null`, потім `120`"
                en: "`undefined null`, then `120`"
            - id: both-null
              text:
                uk: "`null null`, потім `120`"
                en: "`null null`, then `120`"
              why:
                uk: "`null` з’являється лише там, де його написали, — як у `bonus`. Змінна без значення вказує на `undefined` — «ще не задано»."
                en: "`null` appears only where someone wrote it — as in `bonus`. A name without a value points at `undefined` — “not set yet”."
            - id: both-undefined
              text:
                uk: "`undefined undefined`, потім `120`"
                en: "`undefined undefined`, then `120`"
              why:
                uk: "`bonus` порожній навмисно: йому присвоїли `null`, тож він `null`."
                en: "`bonus` is empty on purpose: it was assigned `null`, so it is `null`."
            - id: error
              text:
                uk: "`ReferenceError` у рядку 3"
                en: "A `ReferenceError` on line 3"
              why:
                uk: "`total` оголошено в рядку 1, тож JavaScript знає цю змінну — значення просто ще немає."
                en: "`total` is declared on line 1, so JavaScript knows the name — it just has no value yet."
          correct: [undefined-null-120]
        explanation:
          uk: "Після `let total;` змінна вже існує й вказує на [[undefined]], а `bonus` навмисно порожній — [[null]]. Сьогодні подивимось, що буває, коли звертаєшся до змінної ще **до** рядка з її оголошенням: тут `var` і `let` поводяться зовсім по-різному."
          en: "After `let total;` the name exists and points at [[undefined]], while `bonus` is empty on purpose — [[null]]. Today we look at what happens when you use a name **before** the line that declares it: there `var` and `let` behave completely differently."

  - id: var
    kind: explanation
    title:
      uk: "Застарілий var"
      en: "The legacy var"
    body:
      uk: |
        До 2015 року JavaScript мав лише один спосіб оголосити змінну — [[var]]. Ти зустрінеш його в старому коді, тож його треба вміти читати. Від `let` він відрізняється у двох речах.

        1. **`var` не помічає блоків.** Оголошена в `if` чи циклі, така змінна доступна й після блоку — в усьому файлі, а якщо стоїть усередині функції, то в усій функції (функції будуть у розділі JS-03). Це [[function-scope|область видимості функції]].
        2. **Підняття.** Перш ніж виконувати код, JavaScript переглядає його й заздалегідь створює всі оголошені змінні — це називають [[hoisting|hoisting (підняттям)]]. Змінна `var` одразу отримує `undefined`, а **значення** з’являється лише там, де його написано:

        ```js
        console.log(label);    // undefined: the name exists, the value does not yet
        var label = "Лампа";
        console.log(label);    // Лампа
        ```

        Отже, підняття не переносить рядок угору — воно лише заздалегідь створює змінну.
      en: |
        Until 2015 JavaScript had a single way to declare a name — [[var]]. You will meet it in old code, so you need to be able to read it. It differs from `let` in two ways.

        1. **`var` ignores blocks.** Declared in an `if` or a loop, it is available after the block too — in the whole file, or, when it stands inside a function, in the whole function (functions come in JS-03). This is [[function-scope|function scope]].
        2. **Hoisting.** Before running the code, JavaScript looks through it and creates every declared name in advance — this is called [[hoisting]]. A `var` name gets `undefined` straight away, while the **value** appears only where it is written:

        ```js
        console.log(label);    // undefined: the name exists, the value does not yet
        var label = "Lamp";
        console.log(label);    // Lamp
        ```

        So hoisting does not move the line up — it only creates the name in advance.

  - id: predict-before
    kind: prediction
    strings:
      big: { uk: "великий ліміт", en: "a big limit" }
      check: { uk: "перевір витрати", en: "check spending" }
    prompt:
      uk: "Що з’явиться в консолі?"
      en: "What appears in the console?"
    code: |
      console.log(limit);
      var limit = 120;
      if (limit > 100) {
        var size = "%%big%%";
        let note = "%%check%%";
      }
      console.log(size);
      console.log(note);
    verify:
      logs: ["undefined", "%%big%%"]
      error: ReferenceError
    answer:
      type: choice
      options:
        - id: undefined-size-error
          text:
            uk: "`undefined`, «великий ліміт», потім `ReferenceError` на `note`"
            en: "`undefined`, “a big limit”, then a `ReferenceError` on `note`"
        - id: error-first
          text:
            uk: "`ReferenceError` уже в рядку 1"
            en: "A `ReferenceError` already on line 1"
          why:
            uk: "`var limit` піднімається й до свого рядка дає `undefined`. Помилку в такій ситуації дає лише `let` чи `const` — про це далі в уроці."
            en: "`var limit` is hoisted and gives `undefined` before its line. Only `let` or `const` would give an error here — more on that later in the lesson."
        - id: everything
          text:
            uk: "`120`, «великий ліміт», «перевір витрати»"
            en: "`120`, “a big limit”, “check spending”"
          why:
            uk: "Підняття створює змінну заздалегідь, але значення `120` з’являється лише в рядку 2. А `let note` живе тільки всередині блоку `if`."
            en: "Hoisting creates the name in advance, but the value `120` appears only on line 2. And `let note` lives only inside the `if` block."
        - id: size-error
          text:
            uk: "`undefined`, потім `ReferenceError` на `size`"
            en: "`undefined`, then a `ReferenceError` on `size`"
          why:
            uk: "`var` не помічає блоків: `size` доступне й після `if`. Зникає лише `let note`."
            en: "`var` ignores blocks: `size` is available after the `if` too. Only `let note` disappears."
      correct: [undefined-size-error]
    explanation:
      uk: "Рядок 1: змінна `limit` уже існує, але вказує на `undefined`, бо `var` піднімається без значення. Рядок 4: `var size` всередині `if` належить усьому файлу, тож рядок 7 її бачить. Рядок 5: `let note` існує лише в блоці, тому рядок 8 зупиняється з `ReferenceError: note is not defined`."
      en: "Line 1: the name `limit` already exists but points at `undefined`, because `var` is hoisted without its value. Line 4: `var size` inside the `if` belongs to the whole file, so line 7 sees it. Line 5: `let note` exists only in the block, so line 8 stops with `ReferenceError: note is not defined`."

  - id: tdz
    kind: explanation
    title:
      uk: "TDZ: let і const до свого рядка"
      en: "The TDZ: let and const before their line"
    body:
      uk: |
        `let` і `const` теж піднімаються: JavaScript знає про них від самого початку блоку. Але до рядка з оголошенням змінна ще не готова, і звертатися до неї заборонено. Цей проміжок називають [[temporal-dead-zone|тимчасовою мертвою зоною (TDZ)]].

        ```js
        console.log(price);   // ReferenceError: Cannot access 'price' before initialization
        let price = 45;
        ```

        Порівняй два повідомлення: `Cannot access 'price' before initialization` — змінна існує, але ще не готова; `note is not defined` — такої змінної тут немає взагалі.

        TDZ — це захист. Помилка одразу показує, що ти читаєш значення раніше, ніж його задав. `var` у такій ситуації мовчки дає `undefined`, і помилка ховається далі в програмі.
      en: |
        `let` and `const` are hoisted too: JavaScript knows about them from the very start of the block. But until the line with the declaration the name is not ready, and using it is forbidden. That stretch is called the [[temporal-dead-zone|temporal dead zone (TDZ)]].

        ```js
        console.log(price);   // ReferenceError: Cannot access 'price' before initialization
        let price = 45;
        ```

        Compare the two messages: `Cannot access 'price' before initialization` — the name exists but is not ready yet; `note is not defined` — there is no such name here at all.

        The TDZ is a safeguard. The error shows at once that you read a value before setting it. In the same situation `var` silently gives `undefined`, and the mistake hides further down the program.

  - id: scope-frames
    kind: visual
    visual: code-trace
    title:
      uk: "Змінні в часі: undefined, uninitialized і блок"
      en: "Names over time: undefined, uninitialized and a block"
    textEquivalent:
      uk: >-
        Ще до першого рядка JavaScript створює всі змінні файлу. Змінні var — saved і size — одразу
        отримують undefined, тому рядок 1 друкує undefined без помилки. Змінна let price теж існує з
        самого початку, але має стан uninitialized: це тимчасова мертва зона. Рядок 2 дає saved
        значення 120. Умова 120 > 100 правдива, і починається блок if — нова область видимості, у якій
        з’являється let note, поки uninitialized. var size усередині блоку отримує значення "large", але
        належить усьому файлу. Після рядка 5 note дорівнює "check" і друкується. Коли блок
        закінчується, note зникає, а size лишається, бо var не помічає блоків. Рядок 9 читає price ще
        до рядка 10 з оголошенням і зупиняється з ReferenceError: Cannot access 'price' before
        initialization.
      en: >-
        Before the first line runs, JavaScript creates every name of the file. The var names, saved and
        size, get undefined at once, so line 1 prints undefined without an error. The let name price exists
        from the start too, but its state is uninitialized: this is the temporal dead zone. Line 2 gives
        saved the value 120. The condition 120 > 100 holds and the if block begins — a new scope, in which
        let note appears, still uninitialized. var size inside the block gets the value "large", but it
        belongs to the whole file. After line 5, note equals "check" and is printed. When the block
        ends, note disappears while size stays, because var ignores blocks. Line 9 reads price before line
        10 declares it and stops with ReferenceError: Cannot access 'price' before initialization.
    spec:
      file: visuals/scope-frames.js
      captions:
        - at: { line: 1 }
          text:
            uk: "Ще до першого рядка JavaScript створив усі змінні. У панелі «Змінні» вони в групі «модуль» — так плеєр називає весь файл. `saved` і `size` (`var`) уже існують зі значенням `undefined`, а `price` (`let`) — **uninitialized**: це TDZ."
            en: "Before the first line, JavaScript created every name. In the Variables panel they sit in the “module” group — the player’s name for the whole file. `saved` and `size` (`var`) already exist with the value `undefined`, while `price` (`let`) is **uninitialized**: that is the TDZ."
        - at: { line: 2 }
          text:
            uk: "Рядок 1 надрукував `undefined` — без помилки. Тепер `var saved = 120` дає змінній значення."
            en: "Line 1 printed `undefined` — no error. Now `var saved = 120` gives the name its value."
        - at: { line: 3, kind: cond }
          text:
            uk: "`120 > 100` — `true`, тож заходимо в блок."
            en: "`120 > 100` is `true`, so we enter the block."
        - at: { line: 4 }
          text:
            uk: "Блок — нова область видимості: у ній з’явився `note`, поки uninitialized. А `size` належить не блоку, а всьому файлу (група «модуль»)."
            en: "The block is a new scope: `note` has appeared in it, still uninitialized. `size`, however, belongs not to the block but to the whole file (the “module” group)."
        - at: { line: 5 }
          text:
            uk: "`size` отримав значення. `note` ще в TDZ — до свого рядка."
            en: "`size` has its value. `note` is still in the TDZ until its own line."
        - at: { line: 6 }
          text:
            uk: "Рядок 5 виконано: `note` — `\"check\"`, і його можна друкувати."
            en: "Line 5 has run: `note` is `\"check\"` and can be printed."
        - at: { line: 8 }
          text:
            uk: "Блок закінчився — `note` зник разом із ним. `size` лишився: `var` не помічає блоків."
            en: "The block is over — `note` vanished with it. `size` stays: `var` ignores blocks."
        - at: { line: 9, kind: stmt }
          text:
            uk: "Рядок 9 читає `price`. Змінна існує, але рядок 10 з оголошенням ще не виконувався — `price` у TDZ."
            en: "Line 9 reads `price`. The name exists, but line 10 with the declaration has not run yet — `price` is in the TDZ."
        - at: { line: 9, kind: throw }
          text:
            uk: "`ReferenceError: Cannot access 'price' before initialization`. Програма зупинилася, і рядок 10 не виконається. `var` на цьому місці мовчки дав би `undefined`."
            en: "`ReferenceError: Cannot access 'price' before initialization`. The program has stopped, and line 10 will not run. A `var` here would have silently given `undefined`."

  - id: try-tdz
    kind: example
    runtime: browser-js
    dir: try-tdz
    entry: index.js
    strings:
      before: { uk: "До оголошення:", en: "Before the declaration:" }
      after: { uk: "Після:", en: "After:" }
      many: { uk: "багато бажань", en: "many wishes" }
    title:
      uk: "var проти let"
      en: "var versus let"
    body:
      uk: |
        Тут обидві змінні оголошено через `var`, тож програма працює без помилок, хоча перший рядок коду читає `count` ще до оголошення. Запусти й подивись на `undefined` у першому рядку консолі.
      en: |
        Both names here are declared with `var`, so the program runs without errors even though the first line of code reads `count` before its declaration. Run it and look at the `undefined` on the first console line.
    tryIt:
      uk: |
        1. Заміни `var count` на `let count` і прочитай нову помилку: це TDZ.
        2. Поверни `var` і заміни `var label` на `let label` — тепер помилка інша: `label is not defined`.
        3. Як залишити `let` і все ж надрукувати `label` після `if`? Оголоси змінну перед блоком, поки без значення, а всередині блоку лише присвоюй їй значення.
      en: |
        1. Replace `var count` with `let count` and read the new error: this is the TDZ.
        2. Put `var` back and replace `var label` with `let label` — now the error is different: `label is not defined`.
        3. How can you keep `let` and still print `label` after the `if`? Declare the name before the block, without a value for now, and inside the block only assign it a value.

  - id: smallest-block
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: smallest-block
    entry: index.js
    strings:
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      toGo: { uk: "до мети", en: "to go" }
      goal: { uk: "мету досягнуто", en: "goal reached" }
    title:
      uk: "Переписуємо старий код"
      en: "Rewriting old code"
    instructions:
      uk: |
        Цей код написано через `var`. Перепиши його з `const` і `let` так, щоб:

        - вивід лишився таким самим: «Прогулянка: 2 до мети»;
        - кожна змінна була оголошена в найменшому блоці, який нею користується.

        Підказка до перевірки: змінна, яка потрібна лише всередині `if`, не повинна бути видимою поза ним.
      en: |
        This code is written with `var`. Rewrite it with `const` and `let` so that:

        - the output stays the same: “Go for a walk: 2 to go”;
        - every name is declared in the smallest block that uses it.

        A note on the checks: a name needed only inside the `if` must not be visible outside it.
    testTitles:
      "prints the same message as before":
        uk: "Виводить те саме повідомлення, що й раніше"
        en: "Prints the same message as before"
      "left lives only inside its block":
        uk: "left існує лише всередині свого блоку"
        en: "left exists only inside its block"
    hints:
      nudge:
        uk: "Для кожної змінної знайди всі рядки, де вона використовується. Найменший блок, що містить їх усі, — місце для оголошення."
        en: "For each name, find every line that uses it. The smallest block containing all of them is where its declaration goes."
      explanation:
        uk: "`name`, `completions` і `target` ніколи не змінюються й потрібні на верхньому рівні — їм пасує `const` на початку. `left` потрібна лише в першій гілці, тож і оголошувати її варто там. `message` задають обидві гілки, а читає рядок після `if/else`: таку змінну оголошують перед `if`, поки без значення, а в гілках лише присвоюють — як `label` у прикладі уроку."
        en: "`name`, `completions` and `target` never change and are needed at the top level — `const` at the top suits them. `left` is needed only in the first branch, so that is where to declare it. `message` is set by both branches and read by the line after the `if/else`: such a name is declared before the `if`, without a value for now, and the branches only assign it — like `label` in the lesson’s example."
    solutionNote:
      uk: "`left` тепер живе лише в першій гілці, а `message` оголошено один раз перед `if`, бо його читає рядок після блоку. Механічна заміна `var` на `let` тут не працює: `let message` усередині гілки зникає разом із блоком, і `console.log(message)` зупиняється з `ReferenceError`."
      en: "`left` now lives only in the first branch, while `message` is declared once before the `if`, because the line after the block reads it. A mechanical swap of `var` for `let` does not work here: a `let message` inside a branch disappears with the block, and `console.log(message)` stops with a `ReferenceError`."
    feedback:
      - when: { error: ReferenceError }
        message:
          uk: "Подивись, яку назву вказує повідомлення. Якщо це `message`, то змінну, мабуть, оголошено всередині гілки, і після `}` її вже немає: таку змінну оголошують перед `if`, а в гілках лише присвоюють їй значення."
          en: "Look at which name the message mentions. If it is `message`, the name was probably declared inside a branch, so it is gone after the `}`: such a name is declared before the `if`, and the branches only assign it a value."
      - when: { test: "left lives only inside its block" }
        message:
          uk: "`left` потрібна лише в першій гілці — оголоси її всередині цієї гілки. Оголошення на початку програми чи через `var` робить її видимою скрізь."
          en: "`left` is needed only in the first branch — declare it inside that branch. Declaring it at the top of the program, or with `var`, makes it visible everywhere."
      - when: { test: "prints the same message as before" }
        message:
          uk: "Вивід має лишитися таким самим, як у старого коду. Якщо консоль порожня, спершу подивись на помилку над перевірками."
          en: "The output must stay exactly as the old code printed it. If the console is empty, look at the error above the checks first."

  - id: to-project
    kind: transfer
    capstoneStep: JS-02
    body:
      uk: "У проєкті не пиши `var`: `const` за замовчуванням, `let` — коли значення змінюється, і кожну змінну — в найменшому блоці, де вона потрібна. А побачивши `var` у чужому коді, ти тепер знаєш, як його читати."
      en: "Do not write `var` in your project: `const` by default, `let` when a value changes, and every name in the smallest block that needs it. And when you see `var` in someone else’s code, you now know how to read it."
