id: js-02-04-nullish-optional-chaining
unit: JS-02
title:
  uk: "?? і ?. : коректно працюємо з відсутніми значеннями"
  en: "?? and ?. : missing values done right"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Обирати `??` замість `||` для значення за замовчуванням, коли `0` чи `\"\"` — нормальні значення."
    en: "Choose `??` over `||` for a default when `0` or `\"\"` are valid values."
  - uk: "Читати поле можливо відсутнього запису через `?.` без помилки."
    en: "Read a field of a possibly missing record with `?.` without an error."
prerequisites: [js-02-03-truthiness-logic-ternary]
subskills:
  - { family: J-01, skill: "nullish coalescing/optional chaining", depth: intro }
glossary: [nullish, optional-chaining, default-value]
selfCheck: [predict-defaults, predict-chain, free-gift]

blocks:
  - id: or-default
    kind: explanation
    title:
      uk: "Значення за замовчуванням і пастка з ||"
      en: "Default values and the || trap"
    body:
      uk: |
        Часто замість відсутнього значення треба показати щось інше — [[default-value|значення за замовчуванням]]. Ти вже знаєш `||`:

        ```js
        const label = wish.price || "без ціни";
        ```

        Але `||` замінює **будь-яке** falsy-значення. Безкоштовний подарунок має ціну `0` — і `||` назве його «без ціни». Так само зникне порожній рядок `""` чи `false`.

        Для цього є `??`. Він реагує лише на [[nullish]]-значення — `null` і `undefined`, — а все інше залишає як є. Ось листівка, яку ще не надіслано (`sent: false` — це справжня відповідь «ні») і до якої немає нотатки:

        ```js
        const card = { name: "Листівка", sent: false, note: null };
        console.log(card.sent || "невідомо");      // невідомо
        console.log(card.sent ?? "невідомо");      // false
        console.log(card.note ?? "без нотатки");   // без нотатки
        ```

        Правило просте: якщо `0`, `""` чи `false` — нормальні значення, пиши `??`.
      en: |
        Often a missing value has to be replaced with something else — a [[default-value|default value]]. You already know `||`:

        ```js
        const label = wish.price || "no price";
        ```

        But `||` replaces **any** falsy value. A free gift has a price of `0` — and `||` calls it “no price”. An empty string `""` or `false` would vanish the same way.

        That is what `??` is for. It reacts only to [[nullish]] values — `null` and `undefined` — and leaves everything else as it is. Here is a postcard that has not been sent yet (`sent: false` is a real answer, “no”) and has no note:

        ```js
        const card = { name: "Postcard", sent: false, note: null };
        console.log(card.sent || "unknown");   // unknown
        console.log(card.sent ?? "unknown");   // false
        console.log(card.note ?? "no note");   // no note
        ```

        The rule is simple: if `0`, `""` or `false` are valid values, write `??`.

  - id: predict-defaults
    kind: prediction
    strings:
      noPrice: { uk: "без ціни", en: "no price" }
    prompt:
      uk: "Що з’явиться в консолі?"
      en: "What appears in the console?"
    code: |
      const free = 0;
      const unknown = null;
      let notSet;
      console.log(free || "%%noPrice%%", free ?? "%%noPrice%%");
      console.log(unknown || "%%noPrice%%", unknown ?? "%%noPrice%%");
      console.log(notSet || "%%noPrice%%", notSet ?? "%%noPrice%%");
    verify:
      logs: ["%%noPrice%% 0", "%%noPrice%% %%noPrice%%", "%%noPrice%% %%noPrice%%"]
    answer:
      type: choice
      options:
        - id: differ-on-zero
          text:
            uk: "Перший рядок консолі: `без ціни 0`. Другий і третій: `без ціни без ціни`"
            en: "Console line one: `no price 0`. Lines two and three: `no price no price`"
        - id: all-same
          text:
            uk: "Усі три рядки консолі: `без ціни без ціни`"
            en: "All three console lines: `no price no price`"
          why:
            uk: "`??` не чіпає `0`: нуль — не `null` і не `undefined`. Тому в першому рядку праворуч залишається `0`."
            en: "`??` leaves `0` alone: zero is neither `null` nor `undefined`. So the first line keeps `0` on the right."
        - id: or-keeps-zero
          text:
            uk: "Перший рядок консолі: `0 0`"
            en: "Console line one: `0 0`"
          why:
            uk: "`||` вважає `0` falsy й бере значення праворуч. Через це безкоштовний товар перетворюється на «без ціни»."
            en: "`||` treats `0` as falsy and takes the value on its right. That is how a free item turns into “no price”."
        - id: error-on-unset
          text:
            uk: "Третій `console.log` — помилка: `notSet` не має значення"
            en: "The third `console.log` is an error: `notSet` has no value"
          why:
            uk: "`notSet` оголошено без значення, тож воно `undefined`. Це не помилка, а саме той випадок, для якого існують `||` і `??`."
            en: "`notSet` is declared without a value, so it is `undefined`. That is no error — it is exactly the case `||` and `??` exist for."
      correct: [differ-on-zero]
    explanation:
      uk: "На `0` оператори розходяться: `||` бачить falsy-значення й підставляє запасне, `??` бачить справжнє число й залишає його. Для `null` і `undefined` обидва дають запасне значення."
      en: "On `0` the operators disagree: `||` sees a falsy value and substitutes the fallback, `??` sees a real number and keeps it. For `null` and `undefined` both give the fallback."

  - id: try-streaks
    kind: example
    runtime: browser-js
    dir: try-streaks
    entry: index.js
    strings:
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      water: { uk: "Пити воду", en: "Drink water" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
    title:
      uk: "Серія з нуля днів"
      en: "A zero-day streak"
    body:
      uk: |
        Серія — скільки днів поспіль звичку виконано. `0` означає «звичку відстежують, але серія поки нульова», а `null` — «ще не відстежували». Запусти: прогулянка показує «—», ніби даних немає зовсім.
      en: |
        A streak is how many days in a row a habit was done. `0` means “tracked, but the streak is zero for now”, while `null` means “never tracked yet”. Run it: the walk shows “—” as if there were no data at all.
    tryIt:
      uk: "Заміни `||` на `??` у всіх трьох рядках коду з `console.log` і запусти ще раз. Який рядок консолі змінився? Чому два інші — ні?"
      en: "Replace `||` with `??` on all three `console.log` lines and run again. Which console line changed? Why did the other two not?"

  - id: recall-missing
    kind: review
    title:
      uk: "Згадай: null чи undefined"
      en: "Recall: null or undefined"
    strings:
      plants: { uk: "Полити квіти", en: "Water the plants" }
    items:
      - id: null-or-undefined
        from: js-01-04-booleans-null-undefined
        prompt:
          uk: "У справи немає терміну, а поля `priority` у записі немає взагалі. Що виведе програма?"
          en: "The task has no due date, and the record has no `priority` field at all. What does the program print?"
        code: |
          const task = { title: "%%plants%%", dueDate: null };
          console.log(task.dueDate, task.priority);
        verify:
          logs: ["null undefined"]
        answer:
          type: choice
          options:
            - id: null-undefined
              text:
                uk: "`null undefined`"
                en: "`null undefined`"
            - id: null-null
              text:
                uk: "`null null`"
                en: "`null null`"
              why:
                uk: "Поля `priority` немає зовсім, а читання відсутнього поля дає `undefined` — «не задано», а не навмисне `null`."
                en: "There is no `priority` field at all, and reading a missing field gives `undefined` — “not set” — not a deliberate `null`."
            - id: undefined-undefined
              text:
                uk: "`undefined undefined`"
                en: "`undefined undefined`"
              why:
                uk: "`dueDate` задано явно: `null` означає «терміну навмисно немає», і JavaScript показує саме `null`."
                en: "`dueDate` is set explicitly: `null` means “deliberately no due date”, and JavaScript shows exactly `null`."
            - id: error
              text:
                uk: "`ReferenceError`: поля `priority` не існує"
                en: "`ReferenceError`: the `priority` field does not exist"
              why:
                uk: "Читання відсутнього поля — не помилка: JavaScript просто повертає `undefined`."
                en: "Reading a missing field is not an error: JavaScript simply returns `undefined`."
          correct: [null-undefined]
        explanation:
          uk: "[[null]] хтось поставив навмисно: «терміну немає». [[undefined]] означає, що значення ніхто не задавав — тут поля `priority` немає в записі. Обидва — «нічого», і саме для них існують оператори цього уроку."
          en: "Someone put [[null]] there on purpose: “no due date”. [[undefined]] means nobody set a value — here the record simply has no `priority` field. Both mean “nothing”, and this lesson’s operators exist exactly for them."

  - id: optional-chaining
    kind: explanation
    title:
      uk: "?. — обережне читання"
      en: "?. — careful reading"
    body:
      uk: |
        Ще одна пастка — прочитати поле в того, чого немає. `.length` рядка — кількість символів у ньому: `"Дім".length` дає `3`. Але якщо `wish.category` — `null`, то `wish.category.length` зупинить програму:

        ```text
        TypeError: Cannot read properties of null (reading 'length')
        ```

        [[optional-chaining|Optional chaining]] `?.` перевіряє значення ліворуч: якщо воно `null` або `undefined`, читання зупиняється, і результатом стає `undefined` — без помилки. Ось подарунок, який ще не обрано, — замість запису `null`:

        ```js
        const gift = null;
        console.log(gift?.name);                       // undefined
        console.log(gift?.name ?? "нічого не обрано");   // нічого не обрано
        ```

        `?.` і `??` часто працюють разом: перший безпечно читає, другий підставляє значення за замовчуванням. `?.` можна ставити й посеред ланцюжка: `wish?.category?.length` не впаде ні тоді, коли відсутній сам запис `wish`, ні тоді, коли в нього немає категорії.

        > [!warning]
        > Змішувати `??` з `||` чи `&&` без дужок не можна: `a || b ?? c` — синтаксична помилка. Пиши `(a || b) ?? c`.
      en: |
        Another trap is reading a field of something that is not there. A string’s `.length` is its number of characters: `"Home".length` gives `4`. But if `wish.category` is `null`, then `wish.category.length` stops the program:

        ```text
        TypeError: Cannot read properties of null (reading 'length')
        ```

        [[optional-chaining|Optional chaining]] `?.` checks the value on its left: if it is `null` or `undefined`, the read stops and the result is `undefined` — no error. Here is a gift that has not been chosen yet — `null` instead of a record:

        ```js
        const gift = null;
        console.log(gift?.name);                       // undefined
        console.log(gift?.name ?? "nothing chosen");   // nothing chosen
        ```

        `?.` and `??` often work as a pair: the first reads safely, the second supplies the default. `?.` also works in the middle of a chain: `wish?.category?.length` does not fail when the `wish` record itself is missing, nor when it has no category.

        > [!warning]
        > You cannot mix `??` with `||` or `&&` without parentheses: `a || b ?? c` is a syntax error. Write `(a || b) ?? c`.

  - id: predict-chain
    kind: prediction
    strings:
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
    prompt:
      uk: "У квитків немає категорії. Що станеться під час запуску?"
      en: "The tickets have no category. What happens when this runs?"
    code: |
      const tickets = { name: "%%tickets%%", price: null, category: null };
      console.log(tickets.category?.length);
      console.log(tickets.category?.length ?? 0);
      console.log(tickets.category.length);
    verify:
      logs: ["undefined", "0"]
      error: TypeError
    answer:
      type: choice
      options:
        - id: then-error
          text:
            uk: "`undefined`, потім `0`, потім `TypeError` у рядку 4"
            en: "`undefined`, then `0`, then a `TypeError` on line 4"
        - id: zeros
          text:
            uk: "`0`, `0`, `0`"
            en: "`0`, `0`, `0`"
          why:
            uk: "`?.` не вигадує чисел: якщо ліворуч `null`, результат — `undefined`. Нуль з’являється лише там, де його підставив `??`."
            en: "`?.` does not invent numbers: with `null` on the left the result is `undefined`. Zero appears only where `??` supplied it."
        - id: early-error
          text:
            uk: "`TypeError` одразу в рядку 2"
            en: "A `TypeError` right away on line 2"
          why:
            uk: "`?.` саме для того й існує: побачивши `null`, він зупиняє читання без помилки."
            en: "That is exactly what `?.` is for: when it sees `null`, it stops reading without an error."
        - id: no-error
          text:
            uk: "`undefined`, `0`, `undefined`"
            en: "`undefined`, `0`, `undefined`"
          why:
            uk: "Без `?.` JavaScript не зупиняється обережно: читати властивість у `null` — це `TypeError`."
            en: "Without `?.` JavaScript does not stop carefully: reading a property of `null` is a `TypeError`."
      correct: [then-error]
    explanation:
      uk: "Рядок 2: `?.` бачить `null` і повертає `undefined`. Рядок 3: `??` замінює `undefined` на `0`. Рядок 4: звичайна крапка намагається прочитати `length` у `null` — програма зупиняється з `TypeError`."
      en: "Line 2: `?.` sees `null` and returns `undefined`. Line 3: `??` replaces `undefined` with `0`. Line 4: a plain dot tries to read `length` of `null` — the program stops with a `TypeError`."

  - id: free-gift
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: free-gift
    entry: index.js
    strings:
      mug: { uk: "Термочашка", en: "Travel mug" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      phoneCase: { uk: "Чохол для телефону", en: "Phone case" }
      home: { uk: "Дім", en: "Home" }
      noPrice: { uk: "без ціни", en: "no price" }
      noCategory: { uk: "Без категорії", en: "No category" }
    title:
      uk: "Безкоштовне — не «без ціни»"
      en: "Free is not “no price”"
    instructions:
      uk: |
        Програма друкує підписи бажань, але безкоштовна термочашка показує «без ціни». Має бути так:

        ```text
        Термочашка — 0 · Дім
        Настільна лампа — 45 · Дім
        Квитки на концерт — без ціни · Без категорії
        Чохол для телефону — 12 · Без категорії
        ```

        Виправ код, щоб вивід збігся з очікуваним. Зверни увагу: порожня категорія `""` теж має показувати «Без категорії».
      en: |
        The program prints wish labels, but the free travel mug shows “no price”. It should look like this:

        ```text
        Travel mug — 0 · Home
        Desk lamp — 45 · Home
        Concert tickets — no price · No category
        Phone case — 12 · No category
        ```

        Fix the code so the output matches. Note: an empty category `""` must also show “No category”.
    testTitles:
      "a free wish shows its price 0":
        uk: "Безкоштовне бажання показує ціну 0"
        en: "A free wish shows its price 0"
      "a wish without a price still says so":
        uk: "Бажання без ціни так і підписане"
        en: "A wish without a price still says so"
      "an empty category still gets the default":
        uk: "Порожня категорія теж стає «Без категорії»"
        en: "An empty category still becomes “No category”"
      "prints all four labels in order":
        uk: "Виводить усі чотири підписи в тому самому порядку"
        en: "Prints all four labels in the same order"
    hints:
      nudge:
        uk: "Порівняй вивід з очікуваним рядок за рядком. У якому рядку значення «загубилося»? Яке саме це значення?"
        en: "Compare the output with the expected one line by line. On which line did a value get lost? Which value is it?"
      explanation:
        uk: "`||` замінює будь-яке falsy-значення, тому ціна `0` стає «без ціни». Для ціни потрібен `??`: він підставляє запасне значення лише замість `null` і `undefined`. А для категорії порожній рядок теж означає «категорії немає», тож там `||` — саме те, що треба."
        en: "`||` replaces any falsy value, so the price `0` becomes “no price”. The price needs `??`: it substitutes the fallback only for `null` and `undefined`. For the category, though, an empty string also means “no category”, so `||` is exactly right there."
    solutionNote:
      uk: "Дефект — `||` у ціні: нуль falsy, тож безкоштовну річ «знецінено». `??` виправляє ціну, а категорію лишаємо з `||`, бо для неї `\"\"` справді означає «нічого». Обирай оператор за питанням: «значення відсутнє?» — `??`, «значення порожнє чи відсутнє?» — `||`."
      en: "The defect is `||` on the price: zero is falsy, so the free item lost its price. `??` fixes the price, while the category keeps `||`, because for it `\"\"` really means “nothing”. Pick the operator by the question: “is the value missing?” — `??`; “is the value empty or missing?” — `||`."
    feedback:
      - when: { test: "a free wish shows its price 0" }
        message:
          uk: "Ця перевірка очікує рядок «Термочашка — 0 · Дім»: ціна `0` справжня. Бачиш «без ціни»? Значить, запасне значення підставилося й замість нуля — так поводиться оператор, що реагує на будь-яке falsy-значення."
          en: "This check expects the line “Travel mug — 0 · Home”: the price `0` is real. You see “no price”? Then the fallback replaced zero too — that is what an operator reacting to any falsy value does."
      - when: { test: "an empty category still gets the default" }
        message:
          uk: "Ця перевірка очікує рядок «Чохол для телефону — 12 · Без категорії»: порожня категорія `\"\"` теж означає «категорії немає». Бачиш після «·» порожнє місце? Якщо для категорії стоїть `??`, порожній рядок так і лишається порожнім: `??` замінює лише `null` і `undefined`."
          en: "This check expects the line “Phone case — 12 · No category”: an empty category `\"\"` also means “no category”. You see nothing after the “·”? If the category uses `??`, the empty string stays empty: `??` replaces only `null` and `undefined`."
      - when: { test: "a wish without a price still says so" }
        message:
          uk: "Ця перевірка очікує, що квитки (`price: null`) показують «без ціни». Бачиш `null`? Значить, запасне значення для ціни зникло."
          en: "This check expects the tickets (`price: null`) to show “no price”. You see `null`? Then the fallback for the price is gone."

  - id: to-project
    kind: transfer
    capstoneStep: JS-02
    body:
      uk: "У проєкті відсутні поля трапляються постійно: ціна, термін, категорія. Для підпису «без ціни» чи «без терміну» бери `??`, а `?.` — коли не певен, що сам запис існує."
      en: "Missing fields are everywhere in a project: a price, a due date, a category. Use `??` for a “no price” or “no due date” label, and `?.` when you are not sure the record itself exists."
