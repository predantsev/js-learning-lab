id: js-02-05-if-else-switch
unit: JS-02
title:
  uk: "Розгалуження: if/else і switch"
  en: "Branching: if/else and switch"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Простежити, яка гілка ланцюжка `if/else` виконається для заданих даних."
    en: "Trace which branch of an `if/else` chain runs for given data."
  - uk: "Читати `switch` і пояснити, що стається без `break` (fallthrough)."
    en: "Read a `switch` statement and explain what happens without a `break` (fallthrough)."
prerequisites: [js-02-04-nullish-optional-chaining]
subskills:
  - { family: J-03, skill: "if/else and switch fallthrough", depth: intro }
glossary: [branch, if-else, switch, fallthrough]
selfCheck: [predict-branch, predict-switch, status-message]

blocks:
  - id: if-else
    kind: explanation
    title:
      uk: "Програма обирає шлях"
      en: "The program chooses a path"
    body:
      uk: |
        Досі програма виконувала всі рядки підряд. [[if-else|`if`/`else`]] дає їй вибір між [[branch|гілками]]:

        ```js
        if (wish.price === null) {
          console.log("Ціни ще немає");
        } else if (wish.price === 0) {
          console.log("Безкоштовно");
        } else {
          console.log("Ціна:", wish.price);
        }
        ```

        JavaScript перевіряє умови згори донизу й виконує **першу** гілку, умова якої truthy. Решту гілок він пропускає — навіть якщо їхні умови теж були б правдиві. `else` без умови спрацьовує, коли жодна умова не підійшла. Фігурні дужки `{ }` позначають, які рядки належать гілці.
      en: |
        Until now a program ran every line in a row. [[if-else|`if`/`else`]] lets it choose between [[branch|branches]]:

        ```js
        if (wish.price === null) {
          console.log("No price yet");
        } else if (wish.price === 0) {
          console.log("Free");
        } else {
          console.log("Price:", wish.price);
        }
        ```

        JavaScript checks the conditions top to bottom and runs the **first** branch whose condition is truthy. It skips the remaining branches — even if their conditions would be true as well. An `else` without a condition runs when no condition matched. The curly braces `{ }` mark which lines belong to a branch.

  - id: recall-comparisons
    kind: review
    title:
      uk: "Згадай: що дає порівняння"
      en: "Recall: what a comparison gives"
    items:
      - id: comparison-is-boolean
        from: js-01-04-booleans-null-undefined
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const price = 45;
          console.log(price > 50, price === 45, typeof (price > 50));
        verify:
          logs: ["false true boolean"]
        answer:
          type: choice
          options:
            - id: booleans
              text:
                uk: "`false true boolean`"
                en: "`false true boolean`"
            - id: numbers
              text:
                uk: "`45 45 number`"
                en: "`45 45 number`"
              why:
                uk: "Порівняння не повертає саме число — воно відповідає «так» чи «ні»: `true` або `false`."
                en: "A comparison does not return the number itself — it answers yes or no: `true` or `false`."
            - id: text
              text:
                uk: "`false true string`"
                en: "`false true string`"
              why:
                uk: "`true` і `false` — окремий тип, `boolean`, а не текст."
                en: "`true` and `false` are a type of their own, `boolean`, not text."
          correct: [booleans]
        explanation:
          uk: "Кожне [[comparison|порівняння]] — це питання з відповіддю `true` або `false` (тип [[boolean]]). Саме такі відповіді й вирішують, яка гілка `if` виконається."
          en: "Every [[comparison]] is a question answered with `true` or `false` (type [[boolean]]). Answers like these are what decide which `if` branch runs."

  - id: predict-branch
    kind: prediction
    strings:
      big: { uk: "велика витрата", en: "a big expense" }
      medium: { uk: "середня витрата", en: "a medium expense" }
      small: { uk: "дрібна витрата", en: "a small expense" }
    prompt:
      uk: "Сума витрати — 84550 копійок. Що виведе програма?"
      en: "The expense is 84550 minor units. What does the program print?"
    code: |
      const amountMinor = 84550;
      if (amountMinor > 50000) {
        console.log("%%big%%");
      } else if (amountMinor > 10000) {
        console.log("%%medium%%");
      } else {
        console.log("%%small%%");
      }
    verify:
      logs: ["%%big%%"]
    answer:
      type: choice
      options:
        - id: first-only
          text:
            uk: "Лише «велика витрата»"
            en: "Only “a big expense”"
        - id: two-branches
          text:
            uk: "«велика витрата» і «середня витрата»"
            en: "“a big expense” and “a medium expense”"
          why:
            uk: "84550 справді більше і за 50000, і за 10000. Але `if/else` виконує лише **першу** гілку з правдивою умовою, а решту пропускає."
            en: "84550 is indeed greater than both 50000 and 10000. But `if/else` runs only the **first** branch with a true condition and skips the rest."
        - id: second-only
          text:
            uk: "Лише «середня витрата»"
            en: "Only “a medium expense”"
          why:
            uk: "Умови перевіряються згори донизу, і вже перша правдива: `84550 > 50000`."
            en: "The conditions are checked top to bottom, and the very first one is true: `84550 > 50000`."
        - id: all-three
          text:
            uk: "Усі три рядки"
            en: "All three lines"
          why:
            uk: "`else` спрацьовує лише тоді, коли жодна умова вище не підійшла."
            en: "`else` runs only when none of the conditions above matched."
      correct: [first-only]
    explanation:
      uk: "JavaScript перевіряє `84550 > 50000` — `true` — і виконує першу гілку. На цьому ланцюжок завершено: `else if` і `else` навіть не перевіряються. Тому порядок умов важливий: найвужчу умову ставлять першою."
      en: "JavaScript checks `84550 > 50000` — `true` — and runs the first branch. That ends the chain: `else if` and `else` are not even checked. That is why the order of conditions matters: put the narrowest condition first."

  - id: switch
    kind: explanation
    title:
      uk: "switch: вибір за значенням"
      en: "switch: choosing by value"
    body:
      uk: |
        Коли одне значення порівнюєш з кількома варіантами, зручніше [[switch]]:

        ```js
        switch (task.priority) {
          case "high":
            console.log("Терміново");
            break;
          case "low":
            console.log("Коли буде час");
            break;
          default:
            console.log("Звичайна справа");
        }
        ```

        `switch` порівнює значення в дужках з кожним `case` через `===` і починає виконання з першого збігу. `break` означає «вийди зі `switch`». `default` спрацьовує, коли жоден `case` не підійшов.

        Увага: `switch` не зупиняється сам. Якщо `break` немає, виконання «провалюється» в наступний `case` — це називають [[fallthrough]].

        > [!tip]
        > Іноді fallthrough корисний: кілька `case` поспіль без тіла ділять одну гілку.
        > ```js
        > switch (expense.category) {
        >   case "food":
        >   case "home":
        >     console.log("Щоденні витрати");
        >     break;
        >   default:
        >     console.log("Інше");
        > }
        > ```
      en: |
        When one value is compared with several options, [[switch]] is handier:

        ```js
        switch (task.priority) {
          case "high":
            console.log("Urgent");
            break;
          case "low":
            console.log("When there is time");
            break;
          default:
            console.log("A regular task");
        }
        ```

        `switch` compares the value in brackets with each `case` using `===` and starts running at the first match. `break` means “leave the `switch`”. `default` runs when no `case` matched.

        Careful: `switch` does not stop by itself. Without a `break`, execution “falls through” into the next `case` — this is called [[fallthrough]].

        > [!tip]
        > Sometimes fallthrough is useful: several `case` lines in a row with no body share one branch.
        > ```js
        > switch (expense.category) {
        >   case "food":
        >   case "home":
        >     console.log("Everyday spending");
        >     break;
        >   default:
        >     console.log("Other");
        > }
        > ```

  - id: predict-switch
    kind: prediction
    strings:
      urgent: { uk: "Терміново", en: "Urgent" }
      normal: { uk: "Звичайна справа", en: "A regular task" }
      later: { uk: "Коли буде час", en: "When there is time" }
      unknown: { uk: "Невідомий пріоритет", en: "Unknown priority" }
    prompt:
      uk: "Після першого `case` немає `break`. Що виведе програма?"
      en: "The first `case` has no `break`. What does the program print?"
    code: |
      const priority = "high";
      switch (priority) {
        case "high":
          console.log("%%urgent%%");
        case "normal":
          console.log("%%normal%%");
          break;
        case "low":
          console.log("%%later%%");
          break;
        default:
          console.log("%%unknown%%");
      }
    verify:
      logs: ["%%urgent%%", "%%normal%%"]
    answer:
      type: choice
      options:
        - id: falls-through
          text:
            uk: "Два рядки: «Терміново», потім «Звичайна справа»"
            en: "Two lines: “Urgent”, then “A regular task”"
        - id: only-match
          text:
            uk: "Лише «Терміново»"
            en: "Only “Urgent”"
          why:
            uk: "Після `case \"high\"` немає `break`, тож виконання продовжується в наступному `case` — аж до першого `break`. Це і є fallthrough."
            en: "There is no `break` after `case \"high\"`, so execution continues into the next `case` — up to the first `break`. That is fallthrough."
        - id: everything
          text:
            uk: "Усі чотири рядки"
            en: "All four lines"
          why:
            uk: "Виконання зупиняє перший `break` — одразу після «Звичайна справа»."
            en: "The first `break` stops execution — right after “A regular task”."
        - id: nothing
          text:
            uk: "Нічого: без `break` switch не працює"
            en: "Nothing: a switch does not work without `break`"
          why:
            uk: "`switch` працює й без `break` — просто не зупиняється там, де ти, можливо, очікував."
            en: "A `switch` works without `break` too — it just does not stop where you might expect."
      correct: [falls-through]
    explanation:
      uk: "`switch` знаходить `case \"high\"` і починає звідти. `break` у цій гілці немає, тож JavaScript виконує й наступний `case`, не перевіряючи його значення, — до першого `break`."
      en: "The `switch` finds `case \"high\"` and starts there. That branch has no `break`, so JavaScript also runs the next `case` without checking its value — up to the first `break`."

  - id: branch-path
    kind: visual
    visual: code-trace
    title:
      uk: "Шлях виконання крізь if/else і switch"
      en: "The path through if/else and switch"
    textEquivalent:
      uk: >-
        Сума витрати — 21050. Перша умова 21050 > 50000 хибна, тому JavaScript переходить до else if і
        перевіряє 21050 > 10000 — це правда. Виконується лише друга гілка: size стає "medium", а гілку
        else ніхто не перевіряє. Далі switch порівнює priority (у ньому "high") з кожним case через ===
        і починає з case "high", який друкує high. Після нього немає break, тож виконання
        провалюється в case "normal" і друкує normal, хоча priority не дорівнює "normal". Там стоїть
        break — він виходить зі switch, тому case "low" і default не виконуються. У консолі high і normal.
      en: >-
        The expense is 21050. The first condition, 21050 > 50000, is false, so JavaScript moves on to else
        if and checks 21050 > 10000 — true. Only the second branch runs: size becomes "medium", and the
        else branch is never checked. Next, the switch compares priority, which is "high", with each case
        using === and starts at case "high", which prints high. There is no break after it, so execution
        falls through into case "normal" and prints normal, although priority is not "normal". That case
        has a break, which leaves the switch, so case "low" and default never run. The console shows high
        and normal.
    spec:
      file: visuals/branches.js
      captions:
        - at: { line: 1 }
          text:
            uk: "Сума витрати — `21050` копійок. За нею оберемо розмір: великий, середній чи малий."
            en: "The expense is `21050` minor units. Its size will be chosen from it: large, medium or small."
        - at: { line: 2 }
          text:
            uk: "`size` оголошено без значення — його задасть одна з гілок."
            en: "`size` is declared without a value — one of the branches will set it."
        - at: { line: 3, kind: cond }
          text:
            uk: "Перша умова: `21050 > 50000` — `false`. Гілку `if` пропускаємо."
            en: "The first condition: `21050 > 50000` is `false`. The `if` branch is skipped."
        - at: { line: 5, kind: cond }
          text:
            uk: "Друга умова: `21050 > 10000` — `true`."
            en: "The second condition: `21050 > 10000` is `true`."
        - at: { line: 6 }
          text:
            uk: "Виконується друга гілка. Гілку `else` JavaScript навіть не перевірятиме."
            en: "The second branch runs. JavaScript will not even look at the `else` branch."
        - at: { line: 11 }
          text:
            uk: "`size` — `\"medium\"`, і ланцюжок завершено. Тепер `switch`."
            en: "`size` is `\"medium\"` and the chain is over. Now the `switch`."
        - at: { line: 12 }
          text:
            uk: "`switch` порівнює `priority` з кожним `case` через `===` і починає з першого збігу — `case \"high\"`."
            en: "The `switch` compares `priority` with each `case` using `===` and starts at the first match — `case \"high\"`."
        - at: { line: 14 }
          text:
            uk: "Тіло `case \"high\"`: друкує `high`."
            en: "The body of `case \"high\"`: it prints `high`."
        - at: { line: 16 }
          text:
            uk: "`break` не було — виконання **провалюється** в `case \"normal\"`, хоча `priority` зовсім не `\"normal\"`. Значення наступного `case` уже не перевіряється."
            en: "There was no `break`, so execution **falls through** into `case \"normal\"`, although `priority` is not `\"normal\"` at all. The next `case` value is not checked any more."
        - at: { line: 17 }
          text:
            uk: "`break` виходить зі `switch`: `case \"low\"` і `default` не виконаються."
            en: "`break` leaves the `switch`: `case \"low\"` and `default` will not run."
        - at: { line: 23, kind: end }
          text:
            uk: "У консолі `high` і `normal`. Одна гілка `if/else`, але дві гілки `switch` — через пропущений `break`."
            en: "The console shows `high` and `normal`. One `if/else` branch, but two `switch` branches — because of a missing `break`."

  - id: try-switch
    kind: example
    runtime: browser-js
    dir: try-switch
    entry: index.js
    strings:
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      urgent: { uk: "терміново", en: "urgent" }
      normal: { uk: "звичайна справа", en: "a regular task" }
      later: { uk: "коли буде час", en: "when there is time" }
      unknown: { uk: "невідомий пріоритет", en: "unknown priority" }
    title:
      uk: "Пріоритет справи"
      en: "A task’s priority"
    body:
      uk: |
        Тут кожен `case` закінчується `break`, тож спрацьовує рівно одна гілка. Запусти й подивись, яку з них обрано для пріоритету `"high"`.
      en: |
        Here every `case` ends with a `break`, so exactly one branch runs. Run it and see which one is chosen for the priority `"high"`.
    tryIt:
      uk: |
        1. Зміни `priority` на `"normal"`, потім на `"urgent"` — такого `case` немає. Яка гілка спрацює?
        2. Поверни `"high"` і видали `break` під першим `case`. Скільки рядків тепер у консолі?
        3. Поверни `break` і перепиши той самий вибір через `if` / `else if` / `else` з `===` — вивід має лишитися таким самим.
      en: |
        1. Set `priority` to `"normal"`, then to `"urgent"` — there is no such `case`. Which branch runs?
        2. Set it back to `"high"` and delete the `break` under the first `case`. How many lines does the console show now?
        3. Put the `break` back and rewrite the same choice with `if` / `else if` / `else` and `===` — the output must stay the same.

  - id: status-message
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: status-message
    entry: index.js
    strings:
      bill: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      done: { uk: "виконано", en: "done" }
      noDate: { uk: "без терміну", en: "no due date" }
      due: { uk: "до", en: "due" }
    title:
      uk: "Статус справи"
      en: "A task status"
    instructions:
      uk: |
        Для кожної з трьох справ виведи один рядок статусу:

        | Справа | Що вивести |
        |---|---|
        | виконана (`done: true`) | `назва: виконано` |
        | не виконана, без терміну (`dueDate: null`) | `назва: без терміну` |
        | не виконана, з терміном | `назва: до 2026-03-02` |

        Слова вже лежать у `doneWord`, `noDateWord` і `dueWord`. Друкуй, наприклад, так: `console.log(bill.title + ":", doneWord);`. Напиши ланцюжок `if` / `else if` / `else` для кожної справи.
      en: |
        Print one status line for each of the three tasks:

        | Task | What to print |
        |---|---|
        | done (`done: true`) | `title: done` |
        | not done, no due date (`dueDate: null`) | `title: no due date` |
        | not done, with a due date | `title: due 2026-03-02` |

        The words are ready in `doneWord`, `noDateWord` and `dueWord`. Print like this, for example: `console.log(bill.title + ":", doneWord);`. Write an `if` / `else if` / `else` chain for each task.
    testTitles:
      "a done task says done, whatever its date":
        uk: "Виконана справа каже «виконано», навіть якщо має термін"
        en: "A done task says “done”, even when it has a due date"
      "a task without a due date says so":
        uk: "Справа без терміну так і підписана"
        en: "A task without a due date says so"
      "a pending task shows its due date":
        uk: "Невиконана справа показує свій термін"
        en: "A pending task shows its due date"
    hints:
      nudge:
        uk: "Яку умову перевірити першою, щоб виконана справа завжди казала «виконано», навіть коли в неї є дата?"
        en: "Which condition must be checked first so that a done task always says “done”, even when it has a date?"
      explanation:
        uk: "Порядок гілок — це пріоритет. Першою має стояти найважливіша умова — «справу виконано»: виконаній справі термін уже байдужий. Друга — «терміну немає» (`dueDate` дорівнює `null`), а `else` прийме решту. З ланцюжком `if` / `else if` / `else` спрацює рівно одна гілка; окремі `if` можуть спрацювати обидва й надрукувати два рядки."
        en: "The order of the branches is a priority. The most important condition comes first — “the task is done”: a done task no longer cares about its date. The second is “no due date” (`dueDate` equals `null`), and `else` takes the rest. With an `if` / `else if` / `else` chain exactly one branch runs; separate `if`s can both run and print two lines."
    solutionNote:
      uk: "Першою стоїть умова, яка важить найбільше: виконана справа не цікавиться терміном. `else if` гарантує, що спрацює лише одна гілка. Три однакові ланцюжки — незручно, але чесно: у розділі JS-03 ти навчишся записувати таку логіку один раз і викликати для будь-якої справи."
      en: "The condition that matters most comes first: a done task does not care about its date. `else if` guarantees that only one branch runs. Three identical chains are clumsy but honest: in JS-03 you will learn to write such logic once and call it for any task."
    feedback:
      - when: { test: "a done task says done, whatever its date" }
        message:
          uk: "«Оплатити інтернет» виконано, тож рядок має бути лише «виконано». З’явився термін? Тоді умова з датою перевіряється раніше за `done`. Рядків два? Найімовірніше, там окремі `if` замість `else if`."
          en: "“Pay the internet bill” is done, so its line must say only “done”. The due date showed up? Then the date condition is checked before `done`. Two lines? Most likely there are separate `if`s instead of `else if`."
      - when: { test: "a task without a due date says so" }
        message:
          uk: "У «Написати бабусі» `dueDate: null`, тож має надрукуватися лише слово з `noDateWord`. Перевір умову, яка ловить `null`, і що саме друкує її гілка."
          en: "“Write to grandma” has `dueDate: null`, so only the word in `noDateWord` must be printed. Check the condition that catches `null` and what exactly its branch prints."
      - when: { test: "a pending task shows its due date" }
        message:
          uk: "«Полити квіти» ще не виконано, і термін є: рядок має закінчуватися словом з `dueWord` і датою `2026-03-02`."
          en: "“Water the plants” is not done yet and has a due date: the line must end with the word in `dueWord` and the date `2026-03-02`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-02
    body:
      uk: "У проєкті розгалуження обиратимуть повідомлення валідації й підписи: `if/else` — для умов на кшталт «назва порожня», `switch` — для вибору зі списку (пріоритет, частота, категорія), а `default` прийме будь-яке невідоме значення."
      en: "In your project, branching will choose validation messages and labels: `if/else` for conditions like “the name is empty”, `switch` for picking from a list (priority, frequency, category), with `default` catching any unknown value."
