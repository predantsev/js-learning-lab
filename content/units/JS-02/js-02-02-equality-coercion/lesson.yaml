id: js-02-02-equality-coercion
unit: JS-02
title:
  uk: "Рівність і приведення типів"
  en: "Equality and coercion"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачити результат `===` і `==` для значень різних типів і пояснити, яке перетворення робить `==`."
    en: "Predict the result of `===` and `==` for values of different types and explain the conversion `==` makes."
  - uk: "Писати `===` за замовчуванням і назвати єдиний випадок, коли `==` доречний: `== null`."
    en: "Write `===` by default and name the one case where `==` is fine: `== null`."
prerequisites: [js-02-01-const-let]
subskills:
  - { family: J-01, skill: "equality/coercion/truthiness", depth: intro }
glossary: [strict-equality, loose-equality, coercion]
selfCheck: [truth-table, missing-or-free]

blocks:
  - id: two-equals
    kind: explanation
    title:
      uk: "Дві рівності"
      en: "Two equalities"
    body:
      uk: |
        У JavaScript є два оператори рівності.

        - [[strict-equality|Строга рівність]] `===` порівнює і тип, і значення. Різні типи — одразу `false`.
        - [[loose-equality|Нестрога рівність]] `==` спершу намагається звести обидва значення до одного типу, а вже потім порівнює. Таке автоматичне перетворення називають [[coercion|приведенням типів]].

        ```js
        console.log(5 === "5");   // false: a number and a string
        console.log(5 == "5");    // true: "5" is converted to 5 first
        ```

        Шлях `==` для простих значень такий:

        1. Однакові типи — порівнює як `===`.
        2. `true` і `false` стають числами: `true` → `1`, `false` → `0`.
        3. Рядок (текст у лапках) поруч із числом стає числом: `"5"` → `5`, `""` → `0`.
        4. `null` і `undefined` ні на що не перетворюються: вони рівні лише одне одному.

        Для `!==` і `!=` правила ті самі, тільки відповідь протилежна.
      en: |
        JavaScript has two equality operators.

        - [[strict-equality|Strict equality]] `===` compares both the type and the value. Different types give `false` straight away.
        - [[loose-equality|Loose equality]] `==` first tries to bring both values to one type and only then compares. That automatic conversion is called [[coercion]].

        ```js
        console.log(5 === "5");   // false: a number and a string
        console.log(5 == "5");    // true: "5" is converted to 5 first
        ```

        For simple values, the `==` path goes like this:

        1. Same types — it compares like `===`.
        2. `true` and `false` become numbers: `true` → `1`, `false` → `0`.
        3. A string next to a number becomes a number: `"5"` → `5`, `""` → `0`.
        4. `null` and `undefined` are not converted to anything: they equal only each other.

        `!==` and `!=` follow the same rules, with the opposite answer.

  - id: recall-plus
    kind: review
    title:
      uk: "Згадай: плюс із рядком"
      en: "Recall: plus with a string"
    items:
      - id: string-plus-number
        from: js-01-03-arithmetic-precedence
        prompt:
          uk: "Що виведе цей рядок коду?"
          en: "What does this line print?"
        code: |
          console.log("4" + 5, 4 + 5);
        verify:
          logs: ["45 9"]
        answer:
          type: choice
          options:
            - id: glue-then-add
              text:
                uk: "`45 9`"
                en: "`45 9`"
            - id: add-both
              text:
                uk: "`9 9`"
                en: "`9 9`"
              why:
                uk: "Якщо з одного боку `+` стоїть рядок, `+` склеює текст: число `5` спершу перетворюється на рядок `\"5\"`."
                en: "When a string stands on one side of `+`, `+` joins text: the number `5` is first converted to the string `\"5\"`."
            - id: glue-both
              text:
                uk: "`45 45`"
                en: "`45 45`"
              why:
                uk: "Без рядка `+` додає числа: `4 + 5` — це `9`."
                en: "Without a string, `+` adds numbers: `4 + 5` is `9`."
          correct: [glue-then-add]
        explanation:
          uk: "`\"4\" + 5` дає `\"45\"`: JavaScript сам перетворив число на текст. Це теж приведення типів — тільки в протилежний бік, ніж у `==`, де рядок стає числом. Через такі сюрпризи на автоматичне перетворення краще не покладатися."
          en: "`\"4\" + 5` gives `\"45\"`: JavaScript converted the number to text on its own. That is coercion too — just in the opposite direction from `==`, where a string becomes a number. Surprises like these are why you should not rely on automatic conversion."

  - id: truth-table
    kind: prediction
    prompt:
      uk: "Не запускаючи код, познач **усі** порівняння, які виведуть `true`."
      en: "Without running the code, mark **every** comparison that prints `true`."
    code: |
      console.log(0 == "");
      console.log(0 == "0");
      console.log("" == "0");
      console.log(false == "0");
      console.log(null == 0);
      console.log(null == undefined);
      console.log(0 === "");
    verify:
      logs: ["true", "true", "false", "true", "false", "true", "false"]
    answer:
      type: multi
      options:
        - id: zero-empty
          code: '0 == ""'
        - id: zero-zero-text
          code: '0 == "0"'
        - id: empty-zero-text
          code: '"" == "0"'
          why:
            uk: "Обидва значення — рядки, тож перетворення немає: порожній рядок і рядок `\"0\"` різні. Хоча кожен з них `== 0`!"
            en: "Both values are strings, so nothing is converted: the empty string and the string `\"0\"` differ. Even though each of them is `== 0`!"
        - id: false-zero-text
          code: 'false == "0"'
        - id: null-zero
          code: 'null == 0'
          why:
            uk: "`null` при `==` дорівнює лише `null` та `undefined`. На число він не перетворюється."
            en: "With `==`, `null` equals only `null` and `undefined`. It is not converted to a number."
        - id: null-undefined
          code: 'null == undefined'
        - id: strict-zero-empty
          code: '0 === ""'
          why:
            uk: "`===` не перетворює типи: число й рядок — різні типи, отже `false`."
            en: "`===` never converts: a number and a string are different types, so `false`."
      correct: [zero-empty, zero-zero-text, false-zero-text, null-undefined]
    explanation:
      uk: "`0 == \"\"` і `0 == \"0\"` дають `true`, бо рядки перетворюються на числа (`\"\"` → `0`, `\"0\"` → `0`). Але `\"\" == \"0\"` — `false`: обидва рядки, і їх порівнюють як текст. Людина сказала б: якщо A дорівнює B і A дорівнює C, то B дорівнює C. Для `==` це не так. `false == \"0\"` — обидва стають числом `0`. `null == undefined` — окреме правило мови."
      en: "`0 == \"\"` and `0 == \"0\"` are `true` because the strings are converted to numbers (`\"\"` → `0`, `\"0\"` → `0`). But `\"\" == \"0\"` is `false`: both are strings and are compared as text. A person would say that if A equals B and A equals C, then B equals C. With `==` that does not hold. `false == \"0\"`: both become the number `0`. `null == undefined` is a separate rule of the language."

  - id: coercion-path
    kind: visual
    visual: diagram
    title:
      uk: "Шлях == : спершу перетворення, потім порівняння"
      en: "The == path: convert first, compare after"
    textEquivalent:
      uk: >-
        Дві смуги поруч порівнюють ті самі значення двома операторами. Ліва смуга — false == "0":
        значення мають різні типи, boolean і рядок, тож == не порівнює їх як є. Спершу він
        перетворює обидва на числа: false стає 0, а рядок "0" поруч із числом теж стає 0. Тепер
        обидва — числа, і порівняння звичайне: 0 === 0 дає true. Тому false == "0" — це true. Права
        смуга — false === "0": === нічого не перетворює, бачить, що типи різні, і одразу відповідає
        false. Окремий виняток: null і undefined при == на числа не перетворюються — вони рівні тільки
        одне одному, тож null == 0 дає false.
      en: >-
        Two lanes side by side compare the same values with two operators. The left lane is
        false == "0": the values have different types, a boolean and a string, so == does not compare
        them as they are. First it converts both to numbers: false becomes 0, and the string "0" next
        to a number becomes 0 as well. Now both are numbers and the comparison is ordinary: 0 === 0
        gives true. That is why false == "0" is true. The right lane is false === "0": === converts
        nothing, sees that the types differ and answers false at once. A separate exception: null and
        undefined are not converted to numbers by ==; they equal only each other, so null == 0 gives
        false.
    spec:
      layout: grid
      groups:
        - { id: loose-lane, label: { uk: "== перетворює", en: "== converts" } }
        - { id: strict-lane, label: { uk: "=== не перетворює", en: "=== never converts" } }
      nodes:
        - { id: loose-start, group: loose-lane, label: "false == \"0\"", col: 0, row: 0 }
        - { id: loose-convert, group: loose-lane, label: "false→0, \"0\"→0", col: 0, row: 1 }
        - { id: loose-result, group: loose-lane, label: "0 === 0 → true", shape: round, col: 0, row: 2 }
        - { id: strict-start, group: strict-lane, label: "false === \"0\"", col: 1, row: 0 }
        - { id: strict-types, group: strict-lane, label: { uk: "типи різні", en: "types differ" }, col: 1, row: 1 }
        - { id: strict-result, group: strict-lane, label: "false", shape: round, col: 1, row: 2 }
      edges:
        - { id: loose-step-1, from: loose-start, to: loose-convert }
        - { id: loose-step-2, from: loose-convert, to: loose-result }
        - { id: strict-step-1, from: strict-start, to: strict-types }
        - { id: strict-step-2, from: strict-types, to: strict-result }
      hidden: [strict-start, strict-types, strict-result, strict-step-1, strict-step-2]
      steps:
        - caption:
            uk: "`false == \"0\"`: ліворуч boolean, праворуч рядок — різні типи. Як є `==` їх не порівнює."
            en: "`false == \"0\"`: a boolean on the left, a string on the right — different types. `==` does not compare them as they are."
          highlight: [loose-start]
          dim: [loose-convert, loose-result]
        - caption:
            uk: "`==` спершу перетворює: `true` і `false` стають числами (`false` → `0`), а рядок поруч із числом теж стає числом (`\"0\"` → `0`)."
            en: "`==` converts first: `true` and `false` become numbers (`false` → `0`), and a string next to a number becomes a number too (`\"0\"` → `0`)."
          highlight: [loose-convert, loose-step-1]
          dim: [loose-result]
        - caption:
            uk: "Тепер обидва значення — числа, і порівняння звичайне: `0 === 0` → `true`. Ось звідки `true` у `false == \"0\"`."
            en: "Now both values are numbers and the comparison is ordinary: `0 === 0` → `true`. That is where the `true` of `false == \"0\"` comes from."
          highlight: [loose-result, loose-step-2]
        - caption:
            uk: "`===` нічого не перетворює: побачивши boolean і рядок, одразу відповідає `false`. Жодних прихованих кроків — тому `===` і пишуть за замовчуванням."
            en: "`===` converts nothing: seeing a boolean and a string, it answers `false` at once. No hidden steps — that is why `===` is the default."
          show: [strict-start, strict-types, strict-result, strict-step-1, strict-step-2]
          highlight: [strict-start, strict-types, strict-result, strict-step-1, strict-step-2]
          dim: [loose-start, loose-convert, loose-result]
        - caption:
            uk: "Виняток зі шляху `==`: `null` і `undefined` на числа не перетворюються. Вони рівні лише одне одному, тож `null == 0` — `false`."
            en: "One exception to the `==` path: `null` and `undefined` are not converted to numbers. They equal only each other, so `null == 0` is `false`."
          dim: [loose-start, loose-convert, loose-result, strict-start, strict-types, strict-result]

  - id: try-table
    kind: example
    runtime: browser-js
    dir: try-table
    entry: index.js
    title:
      uk: "Таблиця порівнянь"
      en: "A table of comparisons"
    body:
      uk: |
        Запусти таблицю й порівняй кожен рядок консолі зі своєю відповіддю. Ліворуч у кожному рядку — саме порівняння текстом, праворуч — результат.
      en: |
        Run the table and compare each console line with your answer. Each line shows the comparison as text on the left and its result on the right.
    tryIt:
      uk: "Заміни `==` на `===` у рядку коду з `false == \"0\"` — тепер `false`. Потім поверни `==`, але в самому порівнянні заміни `\"0\"` на `\"ні\"`: знову `false`, бо текст, що не є числом, перетворюється на особливе число `NaN` (*not a number*, «не число»), а `NaN` не дорівнює нічому — навіть собі."
      en: "Replace `==` with `===` on the line of code with `false == \"0\"` — now it is `false`. Then bring back `==` but, in the comparison itself, replace `\"0\"` with `\"no\"`: `false` again, because text that is not a number converts to the special number `NaN` (“not a number”), and `NaN` equals nothing — not even itself."

  - id: why-strict
    kind: explanation
    title:
      uk: "Чому професіонали пишуть ==="
      en: "Why professionals write ==="
    body:
      uk: |
        Правила `==` — це таблиця винятків, а не здоровий глузд. Тому в професійному коді домовленість проста: **пиши `===` і `!==`**. Тоді `"5"` і `5` ніколи не стануть «рівними» випадково, а плутанину з типами ти помітиш одразу.

        Єдиний `==`, який ти зустрінеш у хорошому коді, — порівняння з `null`:

        ```js
        const noteMissing = task.note == null;   // true only for null and undefined
        ```

        `x == null` дає `true` рівно для `null` і `undefined` — і більше ні для чого: ні для `0`, ні для `""`, ні для `false`. Тут нічого не перетворюється — це коротший запис двох перевірок: `x === null` або `x === undefined`.

        > [!warning]
        > Одне значення не дорівнює навіть самому собі: `NaN` («not a number», «не число»). Воно з’являється, коли обчислення не має числової відповіді, наприклад `"ні" * 2`. `NaN === NaN` дає `false`. Як розпізнати `NaN`, дізнаєшся в уроці про рідкісні оператори.
      en: |
        The `==` rules are a table of exceptions, not common sense. So professional code follows a simple convention: **write `===` and `!==`**. Then `"5"` and `5` never become “equal” by accident, and a mix-up of types shows up at once.

        The only `==` you will meet in good code is a comparison with `null`:

        ```js
        const noteMissing = task.note == null;   // true only for null and undefined
        ```

        `x == null` is `true` for exactly `null` and `undefined` — and for nothing else: not `0`, not `""`, not `false`. Nothing is converted here — it is a shorter way to write two checks: `x === null` or `x === undefined`.

        > [!warning]
        > One value is not even equal to itself: `NaN` (“not a number”). It appears when a calculation has no numeric answer, for example `"no" * 2`. `NaN === NaN` gives `false`. You will learn how to recognize `NaN` in the lesson on rare operators.

  - id: missing-or-free
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: missing-or-free
    entry: index.js
    strings:
      mug: { uk: "Термочашка", en: "Travel mug" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
    title:
      uk: "Безкоштовне чи без ціни?"
      en: "Free or no price?"
    instructions:
      uk: |
        У списку три бажання. Ціна `0` означає «безкоштовно» — це справжня ціна. `null` означає «ціни ще немає». А в книжки поля `price` немає взагалі, тож `book.price` — це `undefined`: ціни теж немає.

        Заміни кожне `false` порівнянням, яке дає `true` лише тоді, коли ціна **відсутня**. Не пиши відповідь вручну — порівнюй поле `price` кожного запису.
      en: |
        The list has three wishes. A price of `0` means “free” — a real price. `null` means “no price yet”. And the book has no `price` field at all, so `book.price` is `undefined`: no price either.

        Replace each `false` with a comparison that is `true` only when the price is **missing**. Do not type the answer by hand — compare the `price` field of each record.
    testTitles:
      "a price of 0 is not missing":
        uk: "Ціна 0 не вважається відсутньою"
        en: "A price of 0 does not count as missing"
      "a null price is missing":
        uk: "Ціна null — відсутня"
        en: "A null price is missing"
      "a price field that is not there is missing":
        uk: "Відсутнє поле price — теж відсутня ціна"
        en: "A price field that is not there is a missing price too"
    hints:
      nudge:
        uk: "Ціна відсутня, коли вона `null` або її немає зовсім (`undefined`). А `0` — справжня ціна. Яке порівняння відрізняє саме ці два значення від усіх інших?"
        en: "A price is missing when it is `null` or not there at all (`undefined`). `0` is a real price. Which comparison picks out exactly those two values?"
      explanation:
        uk: "Порівняння з `0`, `\"\"` чи `false` через `==` тут підведе: `0 == false` — `true`. Є одне порівняння, що дає `true` рівно для `null` і `undefined`, — `== null`, як у `task.note == null` з пояснення. Тут потрібне саме воно: зі строгим `=== null` поле, якого немає зовсім (`undefined`), лишиться непоміченим."
        en: "Comparing with `0`, `\"\"` or `false` through `==` betrays you here: `0 == false` is `true`. One comparison is `true` for exactly `null` and `undefined` — `== null`, as in `task.note == null` from the explanation. This is the place for it: with a strict `=== null`, a field that is not there at all (`undefined`) goes unnoticed."
    solutionNote:
      uk: "`price == null` — єдиний `==`, який вважають безпечним: він нічого не перетворює й дає `true` лише для `null` та `undefined`. Тому безкоштовна термочашка (`0`) отримує `false`, а квитки й книжка — `true`. Те саме можна записати довше: `price === null || price === undefined` (`||` означає «або» — про нього наступний урок)."
      en: "`price == null` is the one `==` considered safe: it converts nothing and is `true` only for `null` and `undefined`. So the free travel mug (`0`) gets `false`, while the tickets and the book get `true`. The longer spelling of the same thing is `price === null || price === undefined` (`||` means “or” — the next lesson covers it)."
    feedback:
      - when: { test: "a price of 0 is not missing" }
        message:
          uk: "Безкоштовна термочашка має ціну `0` — це не «відсутня» ціна. Якщо порівнюєш із `false`, `0` чи `\"\"` через `==`, нуль проходить як «нічого». Порівнюй із `null`."
          en: "The free travel mug has a price of `0` — not a “missing” price. If you compare with `false`, `0` or `\"\"` through `==`, zero slips through as “nothing”. Compare with `null`."
      - when: { test: "a null price is missing" }
        message:
          uk: "У квитків `price: null` — ціни немає, тож порівняння має дати `true`."
          en: "The tickets have `price: null` — there is no price, so the comparison must give `true`."
      - when: { test: "a price field that is not there is missing" }
        message:
          uk: "У книжки поля `price` немає, тому `book.price` — це `undefined`, а не `null`. `=== null` його не впізнає; `== null` впізнає обидва."
          en: "The book has no `price` field, so `book.price` is `undefined`, not `null`. `=== null` does not catch it; `== null` catches both."

  - id: to-project
    kind: transfer
    capstoneStep: JS-02
    body:
      uk: "У проєкті ти порівнюватимеш поля запису — назву, ціну, категорію. Пиши `===` і `!==`, а `== null` залишай для одного питання: «значення відсутнє?»."
      en: "In your project you will compare the fields of a record — a name, a price, a category. Write `===` and `!==`, and keep `== null` for one question only: “is the value missing?”."
