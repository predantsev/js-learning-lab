id: js-02-06-counting-loops
unit: JS-02
title:
  uk: "Повторення: лічильний цикл for і цикл while"
  en: "Repeating: a counting for loop and while"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Простежити цикл `for` (початок, умова, крок) і цикл `while` по одній ітерації, заповнюючи таблицю ітерацій."
    en: "Trace a `for` loop (start, condition, step) and a `while` loop one iteration at a time, filling in an iteration table."
  - uk: "Передбачити, скільки разів виконається тіло циклу — нуль, один чи багато, — ще до запуску."
    en: "Predict how many times a loop body runs — zero, once or many times — before running it."
prerequisites: [js-02-05-if-else-switch, js-02-01-const-let]
subskills:
  - { family: J-03, skill: "for/while/do-while", depth: intro }
glossary: [counting-loop, loop-condition, iteration-table]
selfCheck: [predict-two-loops, predict-after-loop, sum-and-halve]

blocks:
  - id: repeat
    kind: explanation
    title:
      uk: "Цикл повторює тіло, поки умова правдива"
      en: "A loop repeats its body while the condition holds"
    body:
      uk: |
        Цикл виконує ті самі рядки знову й знову. Найпростіший — `while`:

        ```js
        let count = 1;
        while (count <= 3) {
          console.log(count);
          count = count + 1;
        }
        ```

        Рядки у фігурних дужках — це **тіло** циклу. Перед **кожним** проходом JavaScript перевіряє [[loop-condition|умову циклу]] в дужках після `while`. Truthy — виконує тіло й повертається до умови. Falsy — цикл закінчено, програма йде далі. Тут умову перевірено чотири рази: для `1`, `2`, `3` відповідь «так», для `4` — «ні». Тіло виконалося тричі.

        Хто змінює `count`? Саме тіло. Якщо забути `count = count + 1`, умова лишиться правдивою назавжди, і цикл ніколи не зупиниться. На цій платформі такий цикл зупиняється через 2 секунди, а у звичайному браузері вкладка просто «зависла б».

        > [!note]
        > Існує ще `do { … } while (умова);` — він перевіряє умову **після** тіла, тож тіло виконується щонайменше один раз. Докладніше — у розділі JS-04.
      en: |
        A loop runs the same lines again and again. The simplest one is `while`:

        ```js
        let count = 1;
        while (count <= 3) {
          console.log(count);
          count = count + 1;
        }
        ```

        The lines inside the curly braces are the loop’s **body**. Before **every** pass JavaScript checks the [[loop-condition|loop condition]] in the brackets after `while`. Truthy — it runs the body and comes back to the condition. Falsy — the loop is over and the program moves on. Here the condition is checked four times: for `1`, `2`, `3` the answer is yes, for `4` it is no. The body ran three times.

        Who changes `count`? The body itself. Forget `count = count + 1` and the condition stays true forever, so the loop never stops. On this platform such a loop is stopped after 2 seconds; in an ordinary browser the tab would simply freeze.

        > [!note]
        > There is also `do { … } while (condition);` — it checks the condition **after** the body, so the body runs at least once. More on it in JS-04.

  - id: recall-boundary
    kind: review
    title:
      uk: "Згадай: порівняння на межі"
      en: "Recall: comparisons at the boundary"
    items:
      - id: less-or-equal
        from: js-01-04-booleans-null-undefined
        prompt:
          uk: "Що виведе цей рядок коду?"
          en: "What does this line print?"
        code: |
          console.log(3 <= 5, 5 <= 5, 6 <= 5);
        verify:
          logs: ["true true false"]
        answer:
          type: choice
          options:
            - id: boundary-included
              text:
                uk: "`true true false`"
                en: "`true true false`"
            - id: boundary-excluded
              text:
                uk: "`true false false`"
                en: "`true false false`"
              why:
                uk: "`<=` — «менше **або дорівнює**». `5` дорівнює `5`, тож відповідь `true`."
                en: "`<=` means “less than **or equal to**”. `5` equals `5`, so the answer is `true`."
            - id: all-true
              text:
                uk: "`true true true`"
                en: "`true true true`"
              why:
                uk: "`6` більше за `5`, тож `6 <= 5` — `false`."
                en: "`6` is greater than `5`, so `6 <= 5` is `false`."
          correct: [boundary-included]
        explanation:
          uk: "`<=` включає межу, `<` — ні. У циклах ця різниця вирішує, чи виконається останній прохід — тому порівняння на межі варто перевіряти щоразу."
          en: "`<=` includes the boundary, `<` does not. In loops this difference decides whether the last pass runs — so boundary comparisons are worth checking every time."

  - id: for-loop
    kind: explanation
    title:
      uk: "Лічильний цикл for"
      en: "The counting for loop"
    body:
      uk: |
        Лічильник, умова і крок трапляються так часто, що для них є окремий запис — [[counting-loop|лічильний цикл]] `for`:

        ```js
        for (let day = 1; day <= 3; day++) {
          console.log("День", day);
        }
        ```

        У дужках три частини через `;`:

        1. **початок** `let day = 1` — виконується один раз;
        2. **умова** `day <= 3` — перевіряється перед кожним проходом;
        3. **крок** `day++` — виконується після кожного проходу. `day++` коротко означає «додай до `day` одиницю», те саме, що `day += 1`.

        Один прохід тіла циклу називають **ітерацією**. Щоб передбачити цикл, заповни [[iteration-table|таблицю ітерацій]] — по рядку на кожну перевірку умови:

        | `day` | `day <= 3` | тіло |
        |---|---|---|
        | 1 | true | друкує «День 1» |
        | 2 | true | друкує «День 2» |
        | 3 | true | друкує «День 3» |
        | 4 | false | — цикл завершено |

        Змінна `day` існує лише всередині циклу. Чому так — побачиш у наступному уроці.
      en: |
        A counter, a condition and a step show up so often that they have a notation of their own — the [[counting-loop|counting]] `for` loop:

        ```js
        for (let day = 1; day <= 3; day++) {
          console.log("Day", day);
        }
        ```

        The brackets hold three parts separated by `;`:

        1. the **start** `let day = 1` — runs once;
        2. the **condition** `day <= 3` — checked before every pass;
        3. the **step** `day++` — runs after every pass. `day++` is short for “add one to `day`”, the same as `day += 1`.

        One pass through the loop body is called an **iteration**. To predict a loop, fill in an [[iteration-table|iteration table]] — one row per condition check:

        | `day` | `day <= 3` | body |
        |---|---|---|
        | 1 | true | prints “Day 1” |
        | 2 | true | prints “Day 2” |
        | 3 | true | prints “Day 3” |
        | 4 | false | — the loop is over |

        The name `day` exists only inside the loop. Why that is so, you will see in the next lesson.

  - id: predict-two-loops
    kind: prediction
    prompt:
      uk: "Склади в голові таблицю ітерацій для обох циклів. Що з’явиться в консолі?"
      en: "Build an iteration table in your head for both loops. What appears in the console?"
    code: |
      for (let i = 1; i <= 5; i++) {
        console.log(i);
      }
      let n = 8;
      while (n >= 1) {
        console.log(n);
        n = n / 2;
      }
    verify:
      logs: ["1", "2", "3", "4", "5", "8", "4", "2", "1"]
    answer:
      type: choice
      options:
        - id: both-boundaries
          text:
            uk: "`1 2 3 4 5`, потім `8 4 2 1`"
            en: "`1 2 3 4 5`, then `8 4 2 1`"
        - id: boundaries-lost
          text:
            uk: "`1 2 3 4`, потім `8 4 2`"
            en: "`1 2 3 4`, then `8 4 2`"
          why:
            uk: "`<=` і `>=` включають межу: `5 <= 5` і `1 >= 1` — обидві перевірки дають `true`, тож `5` і `1` теж друкуються."
            en: "`<=` and `>=` include the boundary: `5 <= 5` and `1 >= 1` are both `true`, so `5` and `1` are printed too."
        - id: one-too-many
          text:
            uk: "`1 2 3 4 5`, потім `8 4 2 1 0.5`"
            en: "`1 2 3 4 5`, then `8 4 2 1 0.5`"
          why:
            uk: "Коли `n` стає `0.5`, перевірка `0.5 >= 1` дає `false`, і тіло вже не виконується. Друкується лише те, що пройшло перевірку."
            en: "Once `n` becomes `0.5`, the check `0.5 >= 1` gives `false` and the body does not run any more. Only what passed the check is printed."
        - id: checked-once
          text:
            uk: "`1 2 3 4 5`, потім лише `8`"
            en: "`1 2 3 4 5`, then only `8`"
          why:
            uk: "Умову `while` перевіряють перед **кожним** проходом, а не лише на старті: поки `n >= 1`, тіло виконується знову."
            en: "A `while` condition is checked before **every** pass, not only at the start: as long as `n >= 1`, the body runs again."
      correct: [both-boundaries]
    explanation:
      uk: "`for` виконує тіло для `i` = 1, 2, 3, 4, 5; на `i = 6` перевірка `6 <= 5` хибна. `while` ділить `n` навпіл, поки `n >= 1`: друкує 8, 4, 2, 1, а після `n = 0.5` перевірка вже хибна. Обидва цикли перевіряють умову перед кожним проходом: перший — 6 разів, другий — 5."
      en: "The `for` runs its body for `i` = 1, 2, 3, 4, 5; at `i = 6` the check `6 <= 5` is false. The `while` halves `n` while `n >= 1`: it prints 8, 4, 2, 1, and after `n = 0.5` the check is false. Both loops check their condition before every pass: the first one 6 times, the second one 5 times."

  - id: iteration-steps
    kind: visual
    visual: code-trace
    title:
      uk: "Таблиця ітерацій наживо"
      en: "An iteration table, live"
    textEquivalent:
      uk: >-
        Програма рахує хвилини прогулянок — по 20 щодня — і починає з total = 0. Перший цикл for один
        раз виконує початок let day = 1, а потім повторює три кроки: перевірку умови day <= 3, тіло
        total = total + 20 і крок day++. Для day = 1 умова правдива, total стає 20; для day = 2 — total
        стає 40; для day = 3 — total стає 60. Після кроку day стає 4, перевірка 4 <= 3 хибна, і цикл
        завершується: тіло виконалося тричі, а умова перевірялася чотири рази. Другий цикл починає з
        day = 5, і вже перша перевірка 5 <= 3 хибна, тож його тіло не виконується жодного разу.
        Наприкінці total дорівнює 60.
      en: >-
        The program counts walking minutes — 20 a day — and starts with total = 0. The first for loop runs
        its start let day = 1 once and then repeats three steps: the check day <= 3, the body
        total = total + 20 and the step day++. For day = 1 the condition holds and total becomes 20; for
        day = 2 total becomes 40; for day = 3 total becomes 60. After the step day is 4, the check 4 <= 3 is
        false and the loop ends: the body ran three times while the condition was checked four times. The
        second loop starts with day = 5, and its very first check, 5 <= 3, is false, so its body never
        runs. At the end total is 60.
    spec:
      file: visuals/iterations.js
      captions:
        - at: { line: 1 }
          text:
            uk: "`total` починається з `0`: у ньому накопичуватимуться хвилини прогулянок — по `20` щодня."
            en: "`total` starts at `0`: walking minutes will build up in it — `20` a day."
        - at: { line: 2, kind: cond, hit: 1 }
          text:
            uk: "Початок `let day = 1` виконано один раз. Перевірка: `1 <= 3` — `true`, тож тіло виконується."
            en: "The start `let day = 1` ran once. The check: `1 <= 3` is `true`, so the body runs."
        - at: { line: 3, hit: 1 }
          text:
            uk: "Прохід 1: `total = 0 + 20`."
            en: "Pass 1: `total = 0 + 20`."
        - at: { line: 2, kind: update, hit: 1 }
          text:
            uk: "Тіло завершено, `total` — `20`. Тепер крок `day++`."
            en: "The body is done and `total` is `20`. Now the step `day++`."
        - at: { line: 2, kind: cond, hit: 2 }
          text:
            uk: "Знову перевірка: `2 <= 3` — `true`."
            en: "The check again: `2 <= 3` is `true`."
        - at: { line: 3, hit: 2 }
          text:
            uk: "Прохід 2: `total = 20 + 20`."
            en: "Pass 2: `total = 20 + 20`."
        - at: { line: 2, kind: update, hit: 2 }
          text:
            uk: "`total` — `40`. Крок: `day` стане `3`."
            en: "`total` is `40`. The step: `day` becomes `3`."
        - at: { line: 2, kind: cond, hit: 3 }
          text:
            uk: "Перевірка: `3 <= 3` — `true`. Межа включена, тож буде ще один прохід."
            en: "The check: `3 <= 3` is `true`. The boundary is included, so there is one more pass."
        - at: { line: 3, hit: 3 }
          text:
            uk: "Прохід 3: `total = 40 + 20`."
            en: "Pass 3: `total = 40 + 20`."
        - at: { line: 2, kind: update, hit: 3 }
          text:
            uk: "`total` — `60`. Крок: `day` стане `4`."
            en: "`total` is `60`. The step: `day` becomes `4`."
        - at: { line: 2, kind: cond, hit: 4 }
          text:
            uk: "Перевірка: `4 <= 3` — `false`. Цикл завершено: тіло виконалося 3 рази, а умову перевірено 4 рази."
            en: "The check: `4 <= 3` is `false`. The loop is over: the body ran 3 times, and the condition was checked 4 times."
        - at: { line: 5, kind: cond, hit: 1 }
          text:
            uk: "Другий цикл починає з `day = 5`, і вже перша перевірка `5 <= 3` — `false`. Тіло не виконається жодного разу: це цикл із нулем ітерацій. `total` так і лишається `60`."
            en: "The second loop starts at `day = 5`, and its very first check, `5 <= 3`, is `false`. The body never runs: a loop with zero iterations. `total` stays `60`."

  - id: predict-after-loop
    kind: prediction
    prompt:
      uk: "Що виведе програма після циклу?"
      en: "What does the program print after the loop?"
    code: |
      let step = 3;
      let runs = 0;
      while (step < 10) {
        runs++;
        step = step + 3;
      }
      console.log(runs, step);
    verify:
      logs: ["3 12"]
    answer:
      type: choice
      options:
        - id: runs-and-step
          text:
            uk: "`3 12`"
            en: "`3 12`"
        - id: step-counts
          text:
            uk: "`3 3`"
            en: "`3 3`"
          why:
            uk: "`step` — не лічильник проходів. Він почав з `3` і щоразу зростав на `3`: 6, 9, 12. Проходи рахує `runs`."
            en: "`step` is not a pass counter. It started at `3` and grew by `3` each time: 6, 9, 12. `runs` is what counts the passes."
        - id: last-inside
          text:
            uk: "`3 9`"
            en: "`3 9`"
          why:
            uk: "Після третього проходу `step` стає `12` — саме тому наступна перевірка `12 < 10` дає `false`. Цикл закінчується, коли умова вже хибна, тож останнє значення — `12`."
            en: "After the third pass `step` becomes `12` — which is exactly why the next check, `12 < 10`, gives `false`. A loop ends once the condition is already false, so the last value is `12`."
        - id: once
          text:
            uk: "`1 6`"
            en: "`1 6`"
          why:
            uk: "Умову перевіряють перед **кожним** проходом, а не лише на початку. Поки `step < 10`, тіло виконується знову."
            en: "The condition is checked before **every** pass, not only at the start. As long as `step < 10`, the body runs again."
      correct: [runs-and-step]
    explanation:
      uk: "Таблиця ітерацій: `step` 3 → `runs` 1, `step` 6; `step` 6 → `runs` 2, `step` 9; `step` 9 → `runs` 3, `step` 12; перевірка `12 < 10` хибна. Змінна з умови не мусить дорівнювати кількості проходів — вона дорівнює тому, що зробило з нею тіло."
      en: "The iteration table: `step` 3 → `runs` 1, `step` 6; `step` 6 → `runs` 2, `step` 9; `step` 9 → `runs` 3, `step` 12; the check `12 < 10` is false. The variable in the condition does not have to equal the number of passes — it equals whatever the body did to it."

  - id: try-loops
    kind: example
    runtime: browser-js
    dir: try-loops
    entry: index.js
    strings:
      pass: { uk: "Прохід", en: "Pass" }
      value: { uk: "Значення n:", en: "Value of n:" }
    title:
      uk: "Нуль, один чи багато проходів"
      en: "Zero, one or many passes"
    body:
      uk: |
        Запусти обидва цикли й порівняй консоль зі своїми передбаченнями: рядків «Прохід» має бути п’ять, а рядків «Значення n» — чотири.
      en: |
        Run both loops and compare the console with your predictions: there should be five “Pass” lines and four “Value of n” lines.
    tryIt:
      uk: |
        Щоразу спершу передбач, потім запускай.

        1. Зміни початок `for` на `let i = 6` — скільки разів виконається тіло?
        2. Зроби так, щоб тіло `for` виконалося рівно один раз.
        3. Зміни початкове `n` на `0.5`: скільки рядків надрукує другий цикл?
      en: |
        Predict first each time, then run.

        1. Change the `for` start to `let i = 6` — how many times does the body run?
        2. Make the `for` body run exactly once.
        3. Change the starting `n` to `0.5`: how many lines does the second loop print?

  - id: sum-and-halve
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: sum-and-halve
    entry: index.js
    title:
      uk: "Сума і ділення навпіл"
      en: "A sum and halving"
    instructions:
      uk: |
        1. Циклом `for` додай усі цілі числа від `1` до `n` включно й збережи результат у `sum`.
        2. Циклом `while` порахуй у `halvings`, скільки разів ціну `price` можна поділити навпіл, перш ніж вона стане меншою за `10`. Для ціни `80` це 4 рази: 80 → 40 → 20 → 10 → 5.

        Перш ніж запускати, заповни для себе таблицю ітерацій хоча б на перші два проходи.
      en: |
        1. With a `for` loop, add up all the whole numbers from `1` to `n` inclusive and keep the result in `sum`.
        2. With a `while` loop, count in `halvings` how many times the price `price` can be halved before it drops below `10`. For a price of `80` that is 4 times: 80 → 40 → 20 → 10 → 5.

        Before running, fill in an iteration table for yourself, at least for the first two passes.
    testTitles:
      "adds up 1 to n":
        uk: "sum дорівнює сумі чисел від 1 до n"
        en: "sum equals the sum of the numbers from 1 to n"
      "counts the halvings of the price":
        uk: "halvings дорівнює кількості ділень навпіл до ціни, меншої за 10"
        en: "halvings equals the number of halvings until the price drops below 10"
    hints:
      nudge:
        uk: "Для суми лічильник іде від `1` до `n` включно, а `sum` на кожному проході зростає на значення лічильника. Для ціни: поки ціна не менша за `10` — поділи її навпіл і порахуй це."
        en: "For the sum, the counter goes from `1` up to `n` inclusive, and `sum` grows by the counter on every pass. For the price: while it is not below `10`, halve it and count that."
      explanation:
        uk: "Сума — це накопичення, як хвилини `total` у візуалізації уроку, тільки на кожному проході додається не стале число, а поточне значення лічильника. Межа `n` теж має потрапити в суму, тож умова — «менше або дорівнює». Для ціни умова `while` звучить як «ціна ще не менша за 10», а в тілі дві дії: поділити ціну навпіл і збільшити лічильник. Умову перевіряють перед кожним проходом, тож цикл сам зупиниться, щойно ціна впаде нижче `10`."
        en: "A sum is an accumulation, like the minutes in `total` in the lesson’s visual, except that on every pass you add not a fixed number but the counter’s current value. The boundary `n` must also make it into the sum, so the condition is “less than or equal to”. For the price, the `while` condition reads “the price is not below 10 yet”, and the body does two things: halve the price and increase the counter. The condition is checked before every pass, so the loop stops by itself as soon as the price drops below `10`."
    solutionNote:
      uk: "Сума від 1 до 10 — `55`: тіло виконалося 10 разів. Ціна 160 ділиться п’ять разів: 160 → 80 → 40 → 20 → 10 → 5. Рівно `10` ще ділиться, бо умова «не менша за 10» — це `price >= 10`, а не `price > 10`."
      en: "The sum from 1 to 10 is `55`: the body ran 10 times. The price 160 is halved five times: 160 → 80 → 40 → 20 → 10 → 5. Exactly `10` is still halved, because “not below 10” is `price >= 10`, not `price > 10`."
    feedback:
      - when: { test: "adds up 1 to n" }
        message:
          uk: "Сума від 1 до 10 — це `55`. Вийшло `45`? Цикл не дійшов до `n`: перевір, чи в умові `<=`, а не `<`. Вийшло `10`? Сума не накопичується: на кожному проході `sum` отримує лише поточне число замість того, щоб додати його до вже накопиченого."
          en: "The sum from 1 to 10 is `55`. Got `45`? The loop stopped before `n`: check that the condition uses `<=`, not `<`. Got `10`? The sum does not build up: on every pass `sum` receives just the current number instead of adding it to what has built up so far."
      - when: { test: "counts the halvings of the price" }
        message:
          uk: "Ціну 160 можна поділити навпіл 5 разів, перш ніж вона стане меншою за 10: 160 → 80 → 40 → 20 → 10 → 5. Вийшло `4`? Умова `> 10` зупиняє цикл на ціні рівно `10`, а її ще можна поділити."
          en: "The price 160 can be halved 5 times before it drops below 10: 160 → 80 → 40 → 20 → 10 → 5. Got `4`? The condition `> 10` stops the loop at exactly `10`, which can still be halved."
      - when: { error: LoopBudgetError }
        message:
          uk: "Цикл не зупинявся, тож платформа його перервала, і перевірки не побачили ні `sum`, ні `halvings`. Перевір, чи тіло змінює те, від чого залежить умова: ділить `price` навпіл або збільшує лічильник."
          en: "The loop did not stop, so the platform interrupted it, and the checks saw neither `sum` nor `halvings`. Check that the body changes what the condition depends on: it halves `price` or increases the counter."

  - id: to-project
    kind: transfer
    capstoneStep: JS-02
    body:
      uk: "У цьому розділі в проєкті лише один запис, тож циклу там ще немає роботи. Щойно записів стане список (розділ JS-04), цикл пройде по них так само, як тут лічильник проходить числа, — а таблиця ітерацій допоможе знайти помилку на межі."
      en: "In this unit your project has a single record, so a loop has no work there yet. As soon as the records become a list (JS-04), a loop will walk through them just as the counter walks through numbers here — and an iteration table will help you find a boundary mistake."
