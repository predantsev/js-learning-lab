id: js-02-09-rare-operators-special-values
unit: JS-02
title:
  uk: "Оператори й значення, які ти читатимеш, а не писатимеш"
  en: "Operators and values you will read, not write"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Читати в чужому коді унарний `+`, `!`, `typeof`, `delete`, `in` та `instanceof` і казати, що кожен дає."
    en: "Read unary `+`, `!`, `typeof`, `delete`, `in` and `instanceof` in existing code and say what each produces."
  - uk: "Упізнавати побітові оператори, `Symbol` і `BigInt` та знати межу, за якою треба шукати деталі в довідці."
    en: "Recognize bitwise operators, `Symbol` and `BigInt` and know the point where you need to look details up."
prerequisites: [js-02-08-shadowing-strict-mode]
subskills:
  - { family: J-01, skill: "unary operators/in/instanceof and bitwise reading boundaries", depth: intro }
  - { family: J-01, skill: "Symbol and BigInt read/use boundaries", depth: intro }
glossary: [unary-operator, in-operator, instanceof, bitwise, symbol, bigint]
selfCheck: [predict-table, field-and-number]

blocks:
  - id: unary
    kind: explanation
    title:
      uk: "Оператори з одним операндом"
      en: "Operators with one operand"
    body:
      uk: |
        [[unary-operator|Унарний оператор]] працює з одним значенням. Ти вже знаєш `!` і `typeof`. У чужому коді трапляються ще:

        | Запис | Що робить | Приклад |
        |---|---|---|
        | `+x` | перетворює на число | `+"7"` → `7` |
        | `-x` | перетворює на число й змінює знак | `-"5"` → `-5` |
        | `!x` | «не»: правда ↔ хибність | `!0` → `true` |
        | `!!x` | перетворює на `true` чи `false` | `!!"0"` → `true` |
        | `typeof x` | назва типу як рядок | `typeof 3` → `"number"` |
        | `delete r.f` | видаляє поле із запису | `delete wish.note` |

        `+"7"` і `"7"` — не одне й те саме: плюс перед рядком перетворює його на число. Це працює, але читається погано, тож у своєму коді пиши `Number("7")`: результат той самий, а намір очевидний.

        > [!warning]
        > Не кожен рядок стає нормальним числом. `Number("12 грн")` дає `NaN` — «не число». А `Number("")` дає `0`, хоча порожній рядок — зовсім не число. `NaN` не дорівнює навіть собі, тож перевіряй його так: `Number.isNaN(x)`.
      en: |
        A [[unary-operator|unary operator]] works on a single value. You already know `!` and `typeof`. Existing code also contains:

        | Notation | What it does | Example |
        |---|---|---|
        | `+x` | converts to a number | `+"7"` → `7` |
        | `-x` | converts to a number and flips the sign | `-"5"` → `-5` |
        | `!x` | “not”: true ↔ false | `!0` → `true` |
        | `!!x` | converts to `true` or `false` | `!!"0"` → `true` |
        | `typeof x` | the type name as a string | `typeof 3` → `"number"` |
        | `delete r.f` | removes a field from a record | `delete wish.note` |

        `+"7"` and `"7"` are not the same thing: a plus in front of a string converts it to a number. It works, but it reads poorly, so in your own code write `Number("7")`: the result is the same and the intent is obvious.

        > [!warning]
        > Not every string becomes a proper number. `Number("12 UAH")` gives `NaN` — “not a number”. And `Number("")` gives `0`, although an empty string is no number at all. `NaN` is not even equal to itself, so check it like this: `Number.isNaN(x)`.

  - id: recall-typeof
    kind: review
    title:
      uk: "Згадай: typeof"
      en: "Recall: typeof"
    items:
      - id: typeof-each
        from: js-01-04-booleans-null-undefined
        prompt:
          uk: "Що виведе цей рядок коду?"
          en: "What does this line print?"
        code: |
          console.log(typeof "42", typeof 42, typeof null);
        verify:
          logs: ["string number object"]
        answer:
          type: choice
          options:
            - id: correct-types
              text:
                uk: "`string number object`"
                en: "`string number object`"
            - id: both-numbers
              text:
                uk: "`number number null`"
                en: "`number number null`"
              why:
                uk: "Лапки роблять значення рядком, тож `typeof \"42\"` — `\"string\"`. А для `null` `typeof` дає `\"object\"` — це давня помилка мови."
                en: "Quotes make a value a string, so `typeof \"42\"` is `\"string\"`. And for `null`, `typeof` gives `\"object\"` — an old mistake in the language."
            - id: null-type
              text:
                uk: "`string number null`"
                en: "`string number null`"
              why:
                uk: "`typeof` ніколи не повертає `\"null\"`: для `null` він дає `\"object\"`, хоча `null` — не об’єкт. Цю історичну помилку вже не виправити."
                en: "`typeof` never returns `\"null\"`: for `null` it gives `\"object\"`, although `null` is not an object. That historical mistake can no longer be fixed."
          correct: [correct-types]
        explanation:
          uk: "[[typeof]] повертає назву типу рядком. Для `null` — `\"object\"`: так склалося історично. Сьогодні до списку додадуться ще два типи — `\"bigint\"` і `\"symbol\"`."
          en: "[[typeof]] returns the name of a type as a string. For `null` it is `\"object\"`: a historical accident. Today two more types join the list — `\"bigint\"` and `\"symbol\"`."

  - id: try-convert
    kind: example
    runtime: browser-js
    dir: try-convert
    entry: index.js
    strings:
      uah: { uk: "грн", en: "UAH" }
    title:
      uk: "Текст із форми стає числом"
      en: "Text from a form becomes a number"
    body:
      uk: |
        Те, що людина вводить у поле на сторінці (наприклад, кількість чи ціну), програма завжди отримує текстом. Запусти: перший рядок консолі — добуток двох чисел, отриманих із тексту, другий показує, що дають порожній і нечисловий текст.
      en: |
        Whatever a person types into a field on a page (a quantity or a price, say) always reaches the program as text. Run it: the first console line is the product of two numbers made from text, the second shows what empty and non-numeric text give.
    tryIt:
      uk: |
        1. Заміни `+quantityText` і `+priceText` на `Number(quantityText)` і `Number(priceText)` — результат той самий, але що легше читати?
        2. Заміни `"45"` на `""`, а потім на `"45 грн"`, і подивись, як змінюється перший рядок консолі.
      en: |
        1. Replace `+quantityText` and `+priceText` with `Number(quantityText)` and `Number(priceText)` — the result is the same, but which is easier to read?
        2. Replace `"45"` with `""`, then with `"45 UAH"`, and watch how the first console line changes.

  - id: in-instanceof
    kind: explanation
    title:
      uk: "in та instanceof"
      en: "in and instanceof"
    body:
      uk: |
        [[in-operator|`"dueDate" in task`]] відповідає на питання «чи є в записі поле з такою назвою?» — навіть якщо його значення `null` чи `undefined`. (Поля об’єктів програмісти ще називають **властивостями**, англійською *properties*.) Це інше питання, ніж «яке там значення»:

        ```js
        const task = { title: "Полити квіти", dueDate: null };
        console.log("dueDate" in task);      // true: the field is there
        console.log(task.dueDate == null);   // true: but it holds no value
        console.log("priority" in task);     // false
        delete task.dueDate;
        console.log("dueDate" in task);      // false: the field is gone
        ```

        Обережно: `in` бачить і властивості, які запис отримує «у спадок» від усіх об’єктів, тому `"toString" in task` теж `true`. Звідки вони беруться — у розділі JS-04.

        [[instanceof|`x instanceof Date`]] питає, чи належить значення до певного виду об’єктів, — наприклад, чи це дата. Будь-який запис `{ … }` — об’єкт, тож `task instanceof Object` дає `true`. Для чисел, рядків і `null` відповідь — `false`: це не об’єкти. Як це влаштовано всередині, ти побачиш пізніше в курсі.
      en: |
        [[in-operator|`"dueDate" in task`]] answers the question “does the record have a field with this name?” — even when its value is `null` or `undefined`. (Programmers also call the fields of an object its **properties**.) That is a different question from “what value is there”:

        ```js
        const task = { title: "Water the plants", dueDate: null };
        console.log("dueDate" in task);      // true: the field is there
        console.log(task.dueDate == null);   // true: but it holds no value
        console.log("priority" in task);     // false
        delete task.dueDate;
        console.log("dueDate" in task);      // false: the field is gone
        ```

        Careful: `in` also sees properties a record “inherits” from all objects, so `"toString" in task` is `true` too. Where they come from is explained in JS-04.

        [[instanceof|`x instanceof Date`]] asks whether a value belongs to a certain kind of object — for example, whether it is a date. Any record `{ … }` is an object, so `task instanceof Object` gives `true`. For numbers, strings and `null` the answer is `false`: they are not objects. You will see how this works inside later in the course.

  - id: boundaries
    kind: explanation
    title:
      uk: "Що достатньо впізнати: побітові оператори, Symbol, BigInt"
      en: "What you only need to recognize: bitwise operators, Symbol, BigInt"
    body:
      uk: |
        Три речі трапляються рідко — їх досить **упізнати** й знати, де шукати деталі.

        - [[bitwise|Побітові оператори]] `&`, `|`, `^`, `~`, `<<`, `>>` працюють із двійковими розрядами чисел: `5 & 3` дає `1`. Не плутай їх з `&&` і `||`! У прикладному коді вони рідкісні: побачиш — подивись у довідці MDN (developer.mozilla.org).
        - [[symbol|`Symbol("id")`]] створює унікальне значення: `Symbol("id") === Symbol("id")` — `false`. Ними позначають «приховані» ключі в бібліотеках. `typeof` дає `"symbol"`.
        - [[bigint|BigInt]] — цілі числа будь-якої довжини з `n` у кінці: `7n`. `typeof 7n` — `"bigint"`, а `0n`, як і `0`, — falsy. Головне правило: **BigInt не змішується зі звичайними числами** в арифметиці. `2n * 3` зупиняє програму з `TypeError`; спершу зведи обидва значення до одного типу: `2n * 3n` або `Number(2n) * 3`.
      en: |
        Three things are rare — it is enough to **recognize** them and know where to look the details up.

        - [[bitwise|Bitwise operators]] `&`, `|`, `^`, `~`, `<<`, `>>` work on the binary digits of numbers: `5 & 3` gives `1`. Do not confuse them with `&&` and `||`! They are rare in application code: when you see one, check the MDN reference (developer.mozilla.org).
        - [[symbol|`Symbol("id")`]] creates a unique value: `Symbol("id") === Symbol("id")` is `false`. Libraries use symbols to mark “hidden” keys. `typeof` gives `"symbol"`.
        - [[bigint|BigInt]] is a whole number of any length with an `n` at the end: `7n`. `typeof 7n` is `"bigint"`, and `0n`, like `0`, is falsy. The key rule: **BigInt does not mix with ordinary numbers** in arithmetic. `2n * 3` stops the program with a `TypeError`; bring both values to one type first: `2n * 3n` or `Number(2n) * 3`.

  - id: predict-table
    kind: prediction
    strings:
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
    prompt:
      uk: "Що з’явиться в консолі?"
      en: "What appears in the console?"
    code: |
      const wish = { name: "%%tickets%%", price: null };
      console.log(+"3" + 1);
      console.log(!!"");
      console.log("price" in wish);
      console.log(typeof 10n);
      console.log(10n + 1);
    verify:
      logs: ["4", "false", "true", "bigint"]
      error: TypeError
    answer:
      type: choice
      options:
        - id: all-right
          text:
            uk: "`4`, `false`, `true`, `bigint`, потім `TypeError`"
            en: "`4`, `false`, `true`, `bigint`, then a `TypeError`"
        - id: plus-does-nothing
          text:
            uk: "`31`, `false`, `true`, `bigint`, `11`"
            en: "`31`, `false`, `true`, `bigint`, `11`"
          why:
            uk: "`+\"3\"` перетворює рядок на число, тож `+\"3\" + 1` — це `3 + 1`, тобто `4`. А BigInt зі звичайним числом не змішується: `10n + 1` — це `TypeError`."
            en: "`+\"3\"` converts the string to a number, so `+\"3\" + 1` is `3 + 1`, that is `4`. And a BigInt does not mix with an ordinary number: `10n + 1` is a `TypeError`."
        - id: in-means-value
          text:
            uk: "`4`, `false`, `false`, `bigint`, `11n`"
            en: "`4`, `false`, `false`, `bigint`, `11n`"
          why:
            uk: "`in` перевіряє, чи є поле, а не чи є в нього значення: поле `price` існує, хоч і `null`.І `10n + 1` не дасть `11n` — змішувати BigInt і число не можна."
            en: "`in` checks whether the property exists, not whether it has a value: `price` exists, even though it is `null`. And `10n + 1` does not give `11n` — mixing a BigInt and a number is not allowed."
        - id: truthy-empty
          text:
            uk: "`4`, `true`, `true`, `number`, `11`"
            en: "`4`, `true`, `true`, `number`, `11`"
          why:
            uk: "Порожній рядок — falsy, тож `!!\"\"` дає `false`. А `typeof 10n` — `\"bigint\"`: це окремий тип."
            en: "An empty string is falsy, so `!!\"\"` gives `false`. And `typeof 10n` is `\"bigint\"`: a type of its own."
      correct: [all-right]
    explanation:
      uk: "`+\"3\"` — число `3`, тож `+\"3\" + 1` дає `4`. `!!\"\"` — `false`, бо порожній рядок falsy. `\"price\" in wish` — `true`: поле є, хоч і `null`. `typeof 10n` — `\"bigint\"`. А `10n + 1` змішує BigInt і число — `TypeError: Cannot mix BigInt and other types, use explicit conversions`."
      en: "`+\"3\"` is the number `3`, so `+\"3\" + 1` gives `4`. `!!\"\"` is `false` because an empty string is falsy. `\"price\" in wish` is `true`: the field exists, even though it is `null`. `typeof 10n` is `\"bigint\"`. And `10n + 1` mixes a BigInt with a number — `TypeError: Cannot mix BigInt and other types, use explicit conversions`."

  - id: field-and-number
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: field-and-number
    entry: index.js
    strings:
      coffee: { uk: "Кава", en: "Coffee" }
      taxi: { uk: "Таксі", en: "Taxi" }
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      uah: { uk: "грн", en: "UAH" }
      friends: { uk: "з друзями", en: "with friends" }
    title:
      uk: "Поле є? Сума — число?"
      en: "Is the field there? Is the amount a number?"
    instructions:
      uk: |
        Три чернетки витрат прийшли з форми, і сума в них — текст.

        1. Заміни `false` у `coffeeHasNote` і `taxiHasNote` перевіркою, чи є в чернетці поле `note` взагалі — навіть порожнє. Використай `in`.
        2. Заміни `false` у трьох `…AmountOk` перевіркою, чи текст суми — справжнє число. Перетворюй через `Number(...)` і пам’ятай: `Number("")` дає `0`, тож порожній текст не повинен пройти.
      en: |
        Three expense drafts came from a form, and their amounts are text.

        1. Replace `false` in `coffeeHasNote` and `taxiHasNote` with a check of whether the draft has a `note` field at all — even an empty one. Use `in`.
        2. Replace `false` in the three `…AmountOk` names with a check of whether the amount text is a real number. Convert with `Number(...)` and remember: `Number("")` gives `0`, so an empty text must not pass.
    testTitles:
      "finds a note field even when its value is undefined":
        uk: "Знаходить поле note, навіть коли його значення undefined"
        en: "Finds the note field even when its value is undefined"
      "a draft without a note field has no note":
        uk: "Чернетка без поля note не має примітки"
        en: "A draft without a note field has no note"
      "accepts a numeric amount text":
        uk: "Приймає суму, що є числом у тексті"
        en: "Accepts an amount text that is a number"
      "rejects an empty amount text":
        uk: "Не приймає порожню суму"
        en: "Rejects an empty amount text"
      "rejects an amount text that is not a number":
        uk: "Не приймає суму, яка не є числом"
        en: "Rejects an amount text that is not a number"
    hints:
      nudge:
        uk: "Для `in` назву поля пиши в лапках, як `\"dueDate\" in task` у поясненні. Для суми спершу перевір у прикладі уроку, що дає `Number(\"\")`, а що — `Number(\"300 грн\")`."
        en: "With `in`, put the field name in quotes, as in `\"dueDate\" in task` from the explanation. For the amount, first check in the lesson’s example what `Number(\"\")` gives and what `Number(\"300 UAH\")` gives."
      explanation:
        uk: "`Number(\"\")` — це `0`, а `Number(\"300 грн\")` — `NaN`. Тож сума годиться, коли разом (`&&`) виконано дві умови: текст не порожній **і** число, отримане з тексту, — не `NaN`. `NaN` розпізнає лише `Number.isNaN(...)`: через `===` перевірити його не вийде, бо `NaN === NaN` — `false`."
        en: "`Number(\"\")` is `0`, while `Number(\"300 UAH\")` is `NaN`. So an amount is fine when two conditions hold together (`&&`): the text is not empty **and** the number made from it is not `NaN`. Only `Number.isNaN(...)` recognizes `NaN`: you cannot check for it with `===`, because `NaN === NaN` is `false`."
    solutionNote:
      uk: "`in` відповідає на «чи є поле?», тому в кави `true`, хоч значення `undefined`. Безпечне перетворення має дві частини: текст не порожній (бо `Number(\"\")` — `0`) і результат не `NaN` (перевірка — лише `Number.isNaN`)."
      en: "`in` answers “is the field there?”, which is why the coffee gets `true` although the value is `undefined`. A safe conversion has two parts: the text is not empty (because `Number(\"\")` is `0`) and the result is not `NaN` (checked only with `Number.isNaN`)."
    feedback:
      - when: { test: "finds a note field even when its value is undefined" }
        message:
          uk: "Для кави очікується `true`: поле `note` у неї є, хоч його значення `undefined`. Тут питання не «чи є значення?», а «чи є поле?» — на нього відповідає оператор `in`."
          en: "`true` is expected for the coffee: it has a `note` field, even though its value is `undefined`. The question here is not “is there a value?” but “is the field there?” — the `in` operator answers it."
      - when: { test: "rejects an empty amount text" }
        message:
          uk: "Для таксі з порожньою сумою очікується `false`. Вийшло `true`? Порожній текст пройшов перевірку: `Number(\"\")` дає `0`, а це не `NaN`. Додай ще одну умову — текст не порожній."
          en: "`false` is expected for the taxi with its empty amount. Got `true`? The empty text passed the check: `Number(\"\")` gives `0`, which is not `NaN`. Add one more condition — the text is not empty."
      - when: { test: "rejects an amount text that is not a number" }
        message:
          uk: "Для «300 грн» очікується `false`: такий текст перетворюється на `NaN`. Якщо порівнюєш із `NaN` через `!==`, результат завжди `true`, бо `NaN` не дорівнює навіть собі, — розпізнає його лише `Number.isNaN(...)`."
          en: "`false` is expected for “300 UAH”: such text converts to `NaN`. If you compare with `NaN` through `!==`, the result is always `true`, because `NaN` does not even equal itself — only `Number.isNaN(...)` recognizes it."
      - when: { test: "accepts a numeric amount text" }
        message:
          uk: "`\"180\"` — справжнє число в тексті, тож перевірка має дати `true`. Вийшло `false`, хоч перевірку вже написано? Подивись, чи стоїть `!` перед `Number.isNaN(...)`. Вийшов текст чи число? Результат має бути саме `true`."
          en: "`\"180\"` is a real number written as text, so the check must give `true`. Got `false` although the check is written? See whether there is a `!` before `Number.isNaN(...)`. Got a piece of text or a number? The result must be exactly `true`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-02
    body:
      uk: "Дані з форм у проєкті приходитимуть текстом. Перетворюй їх через `Number(...)` і перевіряй `Number.isNaN`, а `in` допоможе відрізнити «поля немає» від «поле порожнє»."
      en: "Form data in your project will arrive as text. Convert it with `Number(...)` and check `Number.isNaN`, while `in` helps you tell “there is no field” from “the field is empty”."
