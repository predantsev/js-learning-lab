id: js-02-11-independent-validation
unit: JS-02
title:
  uk: "Самостійно: валідація з null, порожнім рядком, нулем і NaN"
  en: "Independent: validation with null/empty/zero/NaN"
kind: assessment
minutes: 20
contentVersion: 1
purpose:
  uk: "Це перевірка розділу без підказок. Ти поєднаєш усе вивчене — типи й `typeof`, `null` та `undefined`, строгі порівняння, `?.` і `??`, розгалуження — у справжній задачі валідації, де трапляються `null`, порожні рядки, нулі й `NaN`. Наприкінці — три короткі питання про `BigInt`, `in` та `instanceof`."
  en: "This is the unit’s skills check, without hints. You combine everything you learned — types and `typeof`, `null` and `undefined`, strict comparisons, `?.` and `??`, branching — in a real validation task full of `null`, empty strings, zeros and `NaN`. At the end come three short questions on `BigInt`, `in` and `instanceof`."
objectives:
  - uk: "Без підказок написати перевірку запису, яка повертає `{ ok: true, value }` або `{ ok: false, errors }` і правильно обробляє `null`, порожній рядок, нуль і `NaN`."
    en: "Without hints, write a check of a record that returns `{ ok: true, value }` or `{ ok: false, errors }` and correctly handles `null`, an empty string, zero and `NaN`."
  - uk: "Пояснити, чому `BigInt` не змішується зі звичайними числами і на що відповідають `in` та `instanceof`."
    en: "Explain why `BigInt` does not mix with ordinary numbers and what `in` and `instanceof` answer."
prerequisites: [js-02-10-debug-tdz-and-defaults]
subskills:
  - { family: J-01, skill: "primitive/reference values", depth: assess }
  - { family: J-01, skill: "typeof and null/undefined", depth: assess }
  - { family: J-01, skill: "arithmetic/logical/assignment/ternary precedence", depth: assess }
  - { family: J-01, skill: "unary operators/in/instanceof and bitwise reading boundaries", depth: assess }
  - { family: J-01, skill: "Symbol and BigInt read/use boundaries", depth: assess }
  - { family: J-03, skill: "if/else and switch fallthrough", depth: assess }
glossary: [validation]

blocks:
  - id: how-checked
    kind: explanation
    title:
      uk: "Як перевірятиметься твій код"
      en: "How your code will be checked"
    body:
      uk: |
        У цій перевірці твій код запускатиметься не один раз, а для багатьох різних записів — так перевіряють справжні програми. Тому він стоїть усередині готової рамки:

        ```js
        function validate(input) {
          const errors = {};

          // your checks go here

          const hasErrors = errors.label !== undefined || errors.amountMinor !== undefined || errors.category !== undefined;
          return hasErrors ? { ok: false, errors: errors } : { ok: true, value: input };
        }
        ```

        Що про неї треба знати (писати такі рамки самому навчишся в розділі JS-03):

        - `validate` — це [[validation|валідація]] однієї витрати. Код між фігурними дужками сам не запускається: перевірка викликає його знову й знову, і щоразу `input` — черговий запис. Іноді замість запису приходить `null`.
        - `errors` — порожній запис. Знайшовши проблему з полем, додай у нього рядок: `errors.label = "required";`.
        - Останні два рядки вже готові: якщо в `errors` є хоч одне поле, `validate` повертає `{ ok: false, errors }`, інакше — `{ ok: true, value: input }`. `return` означає «віддай результат тому, хто викликав». Їх не змінюй.
      en: |
        In this check your code runs not once but for many different records — that is how real programs are tested. That is why it sits inside a ready-made frame:

        ```js
        function validate(input) {
          const errors = {};

          // your checks go here

          const hasErrors = errors.label !== undefined || errors.amountMinor !== undefined || errors.category !== undefined;
          return hasErrors ? { ok: false, errors: errors } : { ok: true, value: input };
        }
        ```

        What you need to know about it (writing frames like this yourself comes in JS-03):

        - `validate` is the [[validation]] of one expense. The code between the curly braces does not run on its own: the checker calls it again and again, and each time `input` is the next record. Sometimes `null` arrives instead of a record.
        - `errors` is an empty record. When you find a problem with a field, add a line to it: `errors.label = "required";`.
        - The last two lines are ready: if `errors` has at least one field, `validate` returns `{ ok: false, errors }`; otherwise it returns `{ ok: true, value: input }`. `return` means “hand the result back to whoever called”. Do not change them.

  - id: recall-literals
    kind: review
    title:
      uk: "Згадай: число чи текст"
      en: "Recall: a number or text"
    items:
      - id: digits-in-quotes
        from: js-01-02-numbers-and-text
        prompt:
          uk: "Що виведе цей рядок?"
          en: "What does this line print?"
        code: |
          console.log("1200" + 5, 1200 + 5, typeof "1200");
        verify:
          logs: ["12005 1205 string"]
        answer:
          type: choice
          options:
            - id: text-and-number
              text:
                uk: "`12005 1205 string`"
                en: "`12005 1205 string`"
            - id: both-numbers
              text:
                uk: "`1205 1205 number`"
                en: "`1205 1205 number`"
              why:
                uk: "Лапки роблять `\"1200\"` рядком, хоч у ньому самі цифри, а `+` з рядком склеює текст."
                en: "Quotes make `\"1200\"` a string even though it holds only digits, and `+` with a string joins text."
            - id: both-glued
              text:
                uk: "`12005 12005 string`"
                en: "`12005 12005 string`"
              why:
                uk: "Без лапок `1200` — число, і `+` додає: `1205`."
                en: "Without quotes `1200` is a number, and `+` adds: `1205`."
          correct: [text-and-number]
        explanation:
          uk: "`\"1200\"` у лапках — текст, навіть якщо складається з цифр. Тож у перевірці нижче сума `\"21050\"` має отримати помилку: справжня сума — число без лапок."
          en: "`\"1200\"` in quotes is text, even when it is made of digits. So in the check below an amount of `\"21050\"` must get an error: a real amount is a number without quotes."

  - id: validate-expense
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: validate-expense
    entry: index.js
    strings:
      lunch: { uk: "Обід", en: "Lunch" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
    title:
      uk: "Валідація витрати"
      en: "Validating an expense"
    instructions:
      uk: |
        Напиши перевірки всередині `validate` для витрати з трьома полями. Кожне поле отримує щонайбільше одну помилку — перевіряй у тому порядку, що в таблиці.

        | Поле | Правильне значення | Ключ помилки |
        |---|---|---|
        | `label` | непорожній рядок | `"required"` — `null`, `undefined` або `""`; `"not-text"` — будь-що, що не рядок |
        | `amountMinor` | ціле число копійок, більше за `0` | `"required"` — `null` або `undefined`; `"not-a-number"` — не тип `number` (наприклад, рядок чи BigInt) або `NaN`; `"not-positive"` — `0` чи менше; `"not-whole"` — є дробова частина |
        | `category` | `"food"`, `"transport"`, `"home"` або `"fun"` | `"required"` — `null`, `undefined` або `""`; `"unknown"` — будь-яке інше значення |

        Якщо замість запису прийшов `null` чи `undefined`, усі три поля вважаються відсутніми. Запис, який перевіряєш, не змінюй.

        Кнопка **Запустити** лише виконує файл: рамка нічого не друкує. Щоб подивитися на результат для власного запису, допиши під рамкою, наприклад, `console.log(validate({ label: "Обід", amountMinor: 21050, category: "food" }));`. **Перевірити** запускає тести з різними записами.
      en: |
        Write the checks inside `validate` for an expense with three fields. Each field gets at most one error — check in the order shown in the table.

        | Field | Valid value | Error key |
        |---|---|---|
        | `label` | a non-empty string | `"required"` — `null`, `undefined` or `""`; `"not-text"` — anything that is not a string |
        | `amountMinor` | a whole number of minor units, greater than `0` | `"required"` — `null` or `undefined`; `"not-a-number"` — not of type `number` (for example a string or a BigInt) or `NaN`; `"not-positive"` — `0` or less; `"not-whole"` — has a fractional part |
        | `category` | `"food"`, `"transport"`, `"home"` or `"fun"` | `"required"` — `null`, `undefined` or `""`; `"unknown"` — any other value |

        If `null` or `undefined` arrives instead of a record, all three fields count as missing. Do not change the record you check.

        The **Run** button only runs the file: the frame prints nothing. To see the result for a record of your own, add a line under the frame, for example `console.log(validate({ label: "Lunch", amountMinor: 21050, category: "food" }));`. **Check** runs the tests with many different records.
    testTitles:
      "validate is still a function":
        uk: "validate і далі є функцією-рамкою"
        en: "validate is still the frame function"
      "accepts a complete expense":
        uk: "Приймає правильну витрату"
        en: "Accepts a complete expense"
      "reports a missing or empty label as required":
        uk: "Відсутня чи порожня назва — \"required\""
        en: "A missing or empty label is \"required\""
      "reports a label that is not text":
        uk: "Назва, що не є рядком, — \"not-text\""
        en: "A label that is not a string is \"not-text\""
      "reports a missing amount as required":
        uk: "Відсутня сума — \"required\""
        en: "A missing amount is \"required\""
      "treats 0 and negative amounts as not positive":
        uk: "0 і від’ємна сума — \"not-positive\", а не «відсутня»"
        en: "0 and negative amounts are \"not-positive\", not “missing”"
      "reports NaN, text and BigInt amounts as not a number":
        uk: "NaN, текст і BigInt у сумі — \"not-a-number\""
        en: "NaN, text and BigInt amounts are \"not-a-number\""
      "reports a fractional amount as not whole":
        uk: "Дробова сума — \"not-whole\""
        en: "A fractional amount is \"not-whole\""
      "checks the category against the list":
        uk: "Категорія перевіряється за списком"
        en: "The category is checked against the list"
      "survives a missing record":
        uk: "Витримує відсутній запис (null чи undefined)"
        en: "Survives a missing record (null or undefined)"
      "reports every problem of a record at once":
        uk: "Повідомляє про всі проблеми запису одразу"
        en: "Reports every problem of a record at once"
      "does not change the record it checks":
        uk: "Не змінює запис, який перевіряє"
        en: "Does not change the record it checks"
    solutionNote:
      uk: "Порядок перевірок захищає від пасток: спершу «відсутнє» (лише `null` і `undefined` — нуль не відсутній!), потім тип (`typeof` разом із `Number.isNaN`, бо `typeof NaN` — `\"number\"`), і лише потім числові умови — до них BigInt і рядки вже не доходять. `input?.` не дає впасти на `null`, а `switch` зі згрупованими `case` перевіряє категорію за списком."
      en: "The order of the checks protects you from the traps: first “missing” (only `null` and `undefined` — zero is not missing!), then the type (`typeof` together with `Number.isNaN`, because `typeof NaN` is `\"number\"`), and only then the numeric conditions, which BigInts and strings never reach. `input?.` keeps a `null` from crashing the check, and a `switch` with grouped `case` lines checks the category against the list."
    feedback:
      - when: { test: "validate is still a function" }
        message:
          uk: "Перевірка не знайшла функцію `validate`: схоже, зламався перший рядок рамки або фігурні дужки. Скопіюй свої перевірки, натисни «Почати спочатку» й встав їх назад у свіжу рамку."
          en: "The checker could not find the `validate` function: the frame’s first line or its braces seem broken. Copy your checks, press “Start over” and paste them back into a fresh frame."
      - when: { test: "accepts a complete expense" }
        message:
          uk: "Правильна витрата має дати `{ ok: true, value: input }`. Якщо приходить `ok: false`, якась перевірка спрацьовує зайво — наприклад, записує в `errors` поле навіть тоді, коли все гаразд (навіть `null` у `errors` вважається помилкою)."
          en: "A valid expense must give `{ ok: true, value: input }`. If `ok: false` comes back, some check fires when it should not — for example, it writes a field to `errors` even when everything is fine (even `null` in `errors` counts as an error)."
      - when: { test: "reports a missing or empty label as required" }
        message:
          uk: "Порожній рядок `\"\"`, `null` і відсутнє поле `label` — це `\"required\"`. Перевіряй їх раніше за тип."
          en: "An empty string `\"\"`, `null` and a missing `label` field are `\"required\"`. Check them before the type."
      - when: { test: "reports a label that is not text" }
        message:
          uk: "Число чи `false` замість назви — це `\"not-text\"`. Пам’ятай: `0 == \"\"` дає `true`, тож нестрога перевірка на порожній рядок назве нуль «required»."
          en: "A number or `false` instead of a label is `\"not-text\"`. Remember: `0 == \"\"` is `true`, so a loose empty-string check calls zero “required”."
      - when: { test: "reports a missing amount as required" }
        message:
          uk: "`null` і `undefined` у сумі — це `\"required\"`."
          en: "`null` and `undefined` amounts are `\"required\"`."
      - when: { test: "treats 0 and negative amounts as not positive" }
        message:
          uk: "`0` — справжнє число, а не відсутня сума. Якщо нуль отримує `\"required\"`, перевірка спирається на falsy-значення (`!amount`). Відсутність перевіряй лише для `null` і `undefined`."
          en: "`0` is a real number, not a missing amount. If zero gets `\"required\"`, the check relies on falsiness (`!amount`). Check for missing values only against `null` and `undefined`."
      - when: { test: "reports NaN, text and BigInt amounts as not a number" }
        message:
          uk: "`typeof NaN` — `\"number\"`, тож одного `typeof` замало: потрібне ще `Number.isNaN`. Рядок `\"21050\"` і `21050n` — не тип `number`. Якщо тест упав із `TypeError` про BigInt, перевір тип раніше за будь-яку арифметику."
          en: "`typeof NaN` is `\"number\"`, so `typeof` alone is not enough: you also need `Number.isNaN`. The string `\"21050\"` and `21050n` are not of type `number`. If the test failed with a `TypeError` about BigInt, check the type before any arithmetic."
      - when: { test: "reports a fractional amount as not whole" }
        message:
          uk: "`210.5` має дробову частину. Остача від ділення цілого числа на 1 — `0`, тож `amount % 1 !== 0` означає «не ціле»."
          en: "`210.5` has a fractional part. A whole number leaves a remainder of `0` when divided by 1, so `amount % 1 !== 0` means “not whole”."
      - when: { test: "checks the category against the list" }
        message:
          uk: "Дозволені лише `\"food\"`, `\"transport\"`, `\"home\"` і `\"fun\"`, і порівняння строге, тож `\"Food\"` — `\"unknown\"`. Порожній рядок і `null` — `\"required\"`. Якщо дозволена категорія стає `\"required\"` чи `\"unknown\"`, у `switch` бракує `break`."
          en: "Only `\"food\"`, `\"transport\"`, `\"home\"` and `\"fun\"` are allowed, and the comparison is strict, so `\"Food\"` is `\"unknown\"`. An empty string and `null` are `\"required\"`. If an allowed category ends up `\"required\"` or `\"unknown\"`, the `switch` is missing a `break`."
      - when: { test: "survives a missing record" }
        message:
          uk: "Коли замість запису приходить `null`, `input.label` зупиняє програму з `TypeError`. Читай поля через `input?.label` або спершу перевір, чи запис узагалі є."
          en: "When `null` arrives instead of a record, `input.label` stops the program with a `TypeError`. Read the fields with `input?.label`, or check first whether there is a record at all."
      - when: { test: "reports every problem of a record at once" }
        message:
          uk: "Кожне поле перевіряється окремо: помилка в назві не повинна зупиняти перевірку суми й категорії."
          en: "Each field is checked separately: an error in the label must not stop the checks of the amount and the category."
      - when: { test: "does not change the record it checks" }
        message:
          uk: "`validate` лише дивиться на запис: не присвоюй нічого в `input.…`. Помилки пиши тільки в `errors`."
          en: "`validate` only looks at the record: do not assign anything to `input.…`. Write errors only to `errors`."

  - id: explain-bigint
    kind: prediction
    prompt:
      uk: "Що станеться і чому?"
      en: "What happens, and why?"
    code: |
      const total = 10n;
      console.log(typeof total);
      console.log(total + 1);
    verify:
      logs: ["bigint"]
      error: TypeError
    answer:
      type: choice
      options:
        - id: no-mixing
          text:
            uk: "`bigint`, потім `TypeError`: BigInt не змішується зі звичайним числом — одне з них треба перетворити явно"
            en: "`bigint`, then a `TypeError`: a BigInt does not mix with an ordinary number — one of them has to be converted explicitly"
        - id: eleven
          text:
            uk: "`bigint`, потім `11`"
            en: "`bigint`, then `11`"
          why:
            uk: "JavaScript не перетворює BigInt на звичайне число сам: великі цілі могли б мовчки втратити точність. Тому він зупиняється з `TypeError`."
            en: "JavaScript does not convert a BigInt to an ordinary number on its own: big whole numbers could silently lose precision. So it stops with a `TypeError`."
        - id: eleven-n
          text:
            uk: "`bigint`, потім `11n`"
            en: "`bigint`, then `11n`"
          why:
            uk: "`11n` вийшло б, якби обидва операнди були BigInt: `10n + 1n`."
            en: "`11n` would come out if both operands were BigInts: `10n + 1n`."
        - id: number-type
          text:
            uk: "`number`, потім `11`"
            en: "`number`, then `11`"
          why:
            uk: "`typeof 10n` — `\"bigint\"`, окремий тип. Саме тому його й не можна мішати з `number`."
            en: "`typeof 10n` is `\"bigint\"`, a type of its own. That is exactly why it cannot be mixed with `number`."
      correct: [no-mixing]
    explanation:
      uk: "BigInt і Number — різні типи, і арифметика між ними заборонена: `10n + 1` дає `TypeError: Cannot mix BigInt and other types, use explicit conversions`. Перетвори явно: `total + 1n` або `Number(total) + 1`."
      en: "BigInt and Number are different types, and arithmetic between them is forbidden: `10n + 1` gives `TypeError: Cannot mix BigInt and other types, use explicit conversions`. Convert explicitly: `total + 1n` or `Number(total) + 1`."

  - id: explain-in
    kind: prediction
    strings:
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
    prompt:
      uk: "На яке питання відповідає `in`? Що виведе рядок?"
      en: "Which question does `in` answer? What does the line print?"
    code: |
      const expense = { id: "e-05", label: "%%cinema%%", note: undefined };
      console.log("id" in expense, "note" in expense, "date" in expense);
    verify:
      logs: ["true true false"]
    answer:
      type: choice
      options:
        - id: field-exists
          text:
            uk: "`true true false`: `in` питає, чи є властивість із такою назвою, — значення не важливе"
            en: "`true true false`: `in` asks whether a property with that name exists — its value does not matter"
        - id: value-matters
          text:
            uk: "`true false false`"
            en: "`true false false`"
          why:
            uk: "Поле `note` у записі є, хоч і зі значенням `undefined`. `in` на значення не дивиться."
            en: "The record does have a `note` field, even though its value is `undefined`. `in` does not look at the value."
        - id: all-true
          text:
            uk: "`true true true`"
            en: "`true true true`"
          why:
            uk: "Поля `date` у записі немає взагалі, тож `false`."
            en: "The record has no `date` field at all, so `false`."
        - id: values
          text:
            uk: "`e-05 undefined undefined`"
            en: "`e-05 undefined undefined`"
          why:
            uk: "`in` не читає значення — він відповідає «так» чи «ні»: `true` або `false`."
            en: "`in` does not read values — it answers yes or no: `true` or `false`."
      correct: [field-exists]
    explanation:
      uk: "`\"назва\" in запис` відповідає, чи є в записі властивість із такою назвою. `id` і `note` є (значення `note` — `undefined`, але поле існує), `date` — немає. Щоб дізнатися значення, читай `expense.note`; щоб дізнатися, чи є поле, — `in`."
      en: "`\"name\" in record` answers whether the record has a property with that name. `id` and `note` exist (the value of `note` is `undefined`, but the field is there); `date` does not. To learn the value, read `expense.note`; to learn whether the field exists, use `in`."

  - id: explain-instanceof
    kind: prediction
    prompt:
      uk: "Що виведе цей рядок?"
      en: "What does this line print?"
    code: |
      const expense = { id: "e-05" };
      console.log(expense instanceof Object, null instanceof Object, typeof null);
    verify:
      logs: ["true false object"]
    answer:
      type: choice
      options:
        - id: honest-instanceof
          text:
            uk: "`true false object`"
            en: "`true false object`"
        - id: null-is-object
          text:
            uk: "`true true object`"
            en: "`true true object`"
          why:
            uk: "`typeof null` каже `\"object\"` через давню помилку мови, але `null` — не об’єкт: `instanceof` чесно відповідає `false`."
            en: "`typeof null` says `\"object\"` because of an old mistake in the language, but `null` is not an object: `instanceof` honestly answers `false`."
        - id: typeof-null
          text:
            uk: "`true false null`"
            en: "`true false null`"
          why:
            uk: "`typeof` ніколи не дає `\"null\"`: для `null` він повертає `\"object\"`."
            en: "`typeof` never gives `\"null\"`: for `null` it returns `\"object\"`."
        - id: record-not-object
          text:
            uk: "`false false object`"
            en: "`false false object`"
          why:
            uk: "Будь-який запис `{ … }` — об’єкт, тож `expense instanceof Object` — `true`."
            en: "Any record `{ … }` is an object, so `expense instanceof Object` is `true`."
      correct: [honest-instanceof]
    explanation:
      uk: "`instanceof Object` питає, чи належить значення до об’єктів: для запису — `true`, для `null` — `false`. Тому перевірка «чи це справжній запис?» не може спиратися лише на `typeof x === \"object\"` — `null` її пройде. Потрібне ще `x !== null`."
      en: "`instanceof Object` asks whether a value belongs to objects: `true` for a record, `false` for `null`. That is why a “is this a real record?” check cannot rely on `typeof x === \"object\"` alone — `null` would pass it. It also needs `x !== null`."

