id: js-17-05-invariants-boundaries
unit: JS-17
title:
  uk: "Інваріанти та граничні випадки"
  en: "Invariants and boundary cases"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Сформулювати інваріант, який структура мусить зберігати (відсортовані унікальні дати виконання, унікальні id, підсумки дорівнюють сумі частин), і перевіряти його після кожної операції."
    en: "State the invariant a structure must keep (sorted unique completions, unique ids, totals equal to the sum of their parts) and check it after every operation."
  - uk: "Вивести з інваріанта граничні випадки (порожньо, один, дублікати, максимальний розмір) і перетворити їх на перевірки."
    en: "Derive boundary cases (empty, one, duplicates, maximum size) from the invariant and turn them into assertions."
prerequisites: [js-17-04-sorting-search-decisions, js-09-03-boundary-cases]
subskills:
  - { family: J-13, skill: "invariants and boundary cases", depth: intro }
glossary: [invariant, postcondition]
selfCheck: [predict-breaks, totals-invariant]

blocks:
  - id: always-true
    kind: explanation
    title:
      uk: "Те, що правдиве після кожного кроку"
      en: "What is true after every step"
    body:
      uk: |
        У трекері звичок дати виконання (`completions`) мають бути **відсортовані за зростанням і без повторів**. Від цього залежить решта коду: серія днів поспіль рахується, ідучи списком по порядку, а двійковий пошук із попереднього уроку взагалі не працює на невідсортованому.

        Таке правило, що мусить бути правдивим після **кожної** операції, — це [[invariant|інваріант]]. Інша річ — [[postcondition|постумова]]: що обіцяє одна конкретна функція, коли повертає результат («після `addCompletion` дата є в списку»).

        Інваріант, записаний лише в коментарі, ніхто не перевіряє. Тому його пишуть **кодом**: функція `assertInvariant(completions)` нічого не повертає, коли все гаразд, і кидає помилку з поясненням, коли правило порушено. Її викликають після кожної операції в тестах — і перша ж зламана операція себе видає.
      en: |
        In the habit tracker, the completion dates (`completions`) must be **sorted ascending, with no repeats**. The rest of the code relies on it: a streak of consecutive days is counted by walking the list in order, and the previous lesson’s binary search does not work on an unsorted one at all.

        Such a rule, which must be true after **every** operation, is an [[invariant]]. A different thing is a [[postcondition]]: what one particular function promises when it returns (“after `addCompletion`, the date is in the list”).

        An invariant written only in a comment is checked by nobody. So it is written as **code**: a function `assertInvariant(completions)` returns nothing when everything is fine and throws an error with an explanation when the rule is broken. It is called after every operation in tests — and the first broken operation gives itself away.

  - id: predict-breaks
    kind: prediction
    prompt:
      uk: "`addCompletion` у цій версії не додає повторів, тож тест «додати нову дату» проходить. Програма застосовує п’ять операцій до звички й для кожної друкує, чи дати досі відсортовані й без повторів. Які операції **порушують** інваріант?"
      en: "In this version `addCompletion` adds no repeats, so the test “add a new date” passes. The program applies five operations to a habit and prints for each whether the dates are still sorted and without repeats. Which operations **break** the invariant?"
    code: |
      function addCompletion(completions, date) {
        if (completions.includes(date)) return completions;
        return [...completions, date];
      }
      function removeCompletion(completions, date) {
        return completions.filter((day) => day !== date);
      }
      // Sorted ascending and without repeats: every date is greater than the one before it.
      const holds = (list) => list.every((day, i) => i === 0 || list[i - 1] < day);

      const habit = ["2026-02-27", "2026-02-28", "2026-03-01"];
      const days = Array.from({ length: 1000 }, (_, i) =>
        new Date(Date.UTC(2023, 0, 1) + i * 86400000).toISOString().slice(0, 10),
      );

      console.log(
        holds(addCompletion(habit, "2026-02-28")),  // a duplicate
        holds(addCompletion(habit, "2026-02-20")),  // an older date
        holds(removeCompletion(habit, "2026-01-01")), // a date that is not there
        holds(addCompletion([], "2026-03-01")),     // into an empty list
        holds(days.reduce(addCompletion, [])),      // 1,000 dates in order
      );
    verify:
      logs: ["true false true true true"]
    answer:
      type: multi
      options:
        - id: duplicate
          text:
            uk: "Додати дату, яка вже є"
            en: "Add a date that is already there"
          why:
            uk: "`includes` бачить повтор і повертає список без змін — інваріант зберігається."
            en: "`includes` sees the repeat and returns the list unchanged — the invariant holds."
        - id: older
          text:
            uk: "Додати старішу дату"
            en: "Add an older date"
        - id: remove-missing
          text:
            uk: "Видалити дату, якої немає"
            en: "Remove a date that is not there"
          why:
            uk: "`filter` нічого не прибирає, і список лишається таким самим відсортованим."
            en: "`filter` removes nothing, and the list stays just as sorted."
        - id: empty
          text:
            uk: "Додати дату до порожнього списку"
            en: "Add a date to an empty list"
          why:
            uk: "Список з однієї дати завжди відсортований і без повторів."
            en: "A list of one date is always sorted and without repeats."
        - id: thousand
          text:
            uk: "Додати по черзі 1 000 дат"
            en: "Add 1,000 dates one by one"
          why:
            uk: "Дати приходять у порядку зростання, тож додавання в кінець їх не перемішує. Великий розмір сам по собі інваріант не ламає — ламає порядок, у якому приходять дані."
            en: "The dates arrive in ascending order, so adding at the end does not shuffle them. A large size alone does not break the invariant — the order in which data arrives does."
      correct: [older]
    explanation:
      uk: "Лише старіша дата: `addCompletion` дописує її в кінець, і `\"2026-02-20\"` опиняється після `\"2026-03-01\"`. Решта операцій інваріант зберігають. Тест «додати нову дату» проходить, бо нова дата пізніша за всі — такий тест перевіряє лише щасливий шлях. Граничний випадок «старіша дата» видно лише тоді, коли знаєш інваріант."
      en: "Only the older date: `addCompletion` appends it at the end, and `\"2026-02-20\"` ends up after `\"2026-03-01\"`. The other operations keep the invariant. The test “add a new date” passes because a new date is later than all the others — such a test checks only the happy path. The boundary case “an older date” is visible only once you know the invariant."

  - id: check-after-every-step
    kind: example
    runtime: browser-js
    dir: check-after-every-step
    entry: index.js
    strings:
      notDate: { uk: "Не дата у форматі YYYY-MM-DD:", en: "Not a YYYY-MM-DD date:" }
      repeated: { uk: "Дата повторюється:", en: "A repeated date:" }
      outOfOrder: { uk: "Порушено порядок:", en: "Out of order:" }
      opDuplicate: { uk: "повтор", en: "a duplicate" }
      opOlder: { uk: "старіша дата", en: "an older date" }
      opRemoveMissing: { uk: "видалити відсутню", en: "remove a missing one" }
      opEmpty: { uk: "у порожній список", en: "into an empty list" }
      opThousand: { uk: "1 000 дат поспіль", en: "1,000 dates in a row" }
    title:
      uk: "Інваріант як код"
      en: "An invariant as code"
    body:
      uk: |
        Тут `assertInvariant` перевіряє три речі по черзі для кожної пари сусідніх дат: формат, повтор і порядок. Програма застосовує ті самі п’ять операцій і після кожної викликає перевірку: `✓` — інваріант тримається (у дужках — кількість дат), `✗` — помилка з поясненням, **яке саме** правило порушено й де.
      en: |
        Here `assertInvariant` checks three things in turn for every pair of neighbouring dates: the format, a repeat and the order. The program applies the same five operations and calls the check after each: `✓` — the invariant holds (the number of dates in brackets), `✗` — an error explaining **which** rule is broken and where.
    tryIt:
      uk: |
        1. Виправ `addCompletion`: нехай повертає `[...completions, date].toSorted()`. Текст `"YYYY-MM-DD"` сортується як дати, тож тепер усі п’ять рядків — `✓`.
        2. Тепер зламай інваріант в обхід `addCompletion`, як це зробив би імпорт, що просто склеює списки: заміни операцію «повтор» на `() => [...fixture, "2026-02-28"]` і запусти. Яке правило назвала помилка — повтор чи порядок? Перевірка ловить **першу** порушену умову, а не обов’язково «справжню» причину.
        3. Заміни ту саму операцію на `() => [...fixture, "2026-02-28"].toSorted()`. Тепер порядок правильний — і помилка називає повтор.
      en: |
        1. Fix `addCompletion`: let it return `[...completions, date].toSorted()`. `"YYYY-MM-DD"` text sorts like dates, so now all five lines are `✓`.
        2. Now break the invariant around `addCompletion`, the way an import that simply glues lists together would: replace the “a duplicate” operation with `() => [...fixture, "2026-02-28"]` and run. Which rule does the error name — the repeat or the order? The check catches the **first** broken condition, not necessarily the “real” cause.
        3. Replace the same operation with `() => [...fixture, "2026-02-28"].toSorted()`. Now the order is right — and the error names the repeat.

  - id: cases-from-invariant
    kind: explanation
    title:
      uk: "Граничні випадки випливають з інваріанта"
      en: "Boundary cases follow from the invariant"
    body:
      uk: |
        Коли інваріант записано, граничні випадки з JS-09 вже не треба вигадувати — їх підказує кожне слово правила:

        | Слово правила | Граничний випадок |
        |---|---|
        | «кожен запис», «сума» | **порожньо**: сума нуля записів — `0`, а не `undefined` |
        | «кожен» | **один** запис: перший і останній збігаються |
        | «унікальні `id`» | **дублікат**: повтор має бути відхилено, а стан — лишитися правильним |
        | «усі записи» | **максимальний розмір**: жодного не загублено, нічого не обрізано |

        Тест граничного випадку робить дві речі: виконує операцію й викликає `assertInvariant`, а потім перевіряє **постумову** — конкретне число чи розмір. Одного інваріанта мало: індекс, що мовчки загубив половину записів, може бути цілком узгодженим сам із собою.
      en: |
        Once the invariant is written, the boundary cases from JS-09 no longer need inventing — every word of the rule suggests them:

        | Word of the rule | Boundary case |
        |---|---|
        | “every record”, “sum” | **empty**: the sum of zero records is `0`, not `undefined` |
        | “every” | **one** record: the first and the last are the same |
        | “unique `id`s” | **a duplicate**: the repeat must be refused, and the state must stay correct |
        | “all records” | **maximum size**: none lost, nothing cut off |

        A boundary-case test does two things: it runs the operation and calls `assertInvariant`, and then it checks the **postcondition** — a specific number or size. The invariant alone is not enough: an index that silently lost half of its records can be perfectly consistent with itself.

  - id: recall-assertions
    kind: review
    title:
      uk: "Пригадай: що порівнює перевірка"
      en: "Recall: what an assertion compares"
    items:
      - id: tobe-new-array
        from: js-09-02-assertions
        prompt:
          uk: "`addCompletion` повертає **новий** масив. У тесті з курсового запускача написано `expect(addCompletion([\"2026-03-01\"], \"2026-03-02\")).toBe([\"2026-03-01\", \"2026-03-02\"])`. Що буде з тестом?"
          en: "`addCompletion` returns a **new** array. A test with the course runner says `expect(addCompletion([\"2026-03-01\"], \"2026-03-02\")).toBe([\"2026-03-01\", \"2026-03-02\"])`. What happens to the test?"
        answer:
          type: choice
          options:
            - id: fails-identity
              text:
                uk: "Падає: `toBe` порівнює тотожність, а це два різні масиви з однаковим вмістом. Потрібен `toEqual`"
                en: "It fails: `toBe` compares identity, and these are two different arrays with the same content. `toEqual` is needed"
            - id: passes
              text:
                uk: "Проходить: вміст однаковий"
                en: "It passes: the content is the same"
              why:
                uk: "Вміст однаковий, але `toBe` питає «це той самий об’єкт?», а масив у дужках `toBe` щойно створено — він інший."
                en: "The content is the same, but `toBe` asks “is it the same object?”, and the array inside `toBe(...)` has just been created — it is a different one."
            - id: throws
              text:
                uk: "Кидає `TypeError`: `toBe` не працює з масивами"
                en: "It throws a `TypeError`: `toBe` does not work with arrays"
              why:
                uk: "`toBe` працює з будь-якими значеннями, просто для масивів і об’єктів порівнює тотожність."
                en: "`toBe` works with any values; for arrays and objects it just compares identity."
          correct: [fails-identity]
        explanation:
          uk: "`toBe` — «те саме значення або той самий об’єкт», `toEqual` — «однаковий вміст». Для постумови «у списку саме такі дати» потрібен `toEqual`. А `toBe` доречний, коли важлива саме тотожність: наприклад, коли функція має повернути **той самий** запис зі списку, а не копію."
          en: "`toBe` means “the same value or the very same object”, `toEqual` means “the same content”. The postcondition “the list holds exactly these dates” needs `toEqual`. `toBe` fits when identity itself matters: for example, when a function must return **the very** record from the list, not a copy."

  - id: totals-invariant
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: totals-invariant
    entry: index.js
    editable: [invariant.js, totals.test.js]
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      lunch: { uk: "Обід", en: "Lunch" }
      duplicateId: { uk: "Витрата з таким id уже є:", en: "An expense with this id already exists:" }
      wrongKey: { uk: "Запис збережено не під своїм id:", en: "A record is stored under another id:" }
      wrongCategory: { uk: "Підсумок категорії не дорівнює сумі її записів:", en: "A category total does not equal the sum of its records:" }
      wrongOverall: { uk: "Загальна сума не дорівнює сумі категорій:", en: "The overall total does not equal the sum of the categories:" }
      tTypical: { uk: "три витрати: підсумок їжі", en: "three expenses: the food total" }
      mFood: { uk: "підсумок категорії food", en: "the food category total" }
      tEmpty: { uk: "жодної витрати", en: "no expenses" }
      tSingle: { uk: "одна витрата", en: "one expense" }
      tDuplicate: { uk: "витрату з наявним id відхилено", en: "an expense with an existing id is refused" }
      tMax: { uk: "10 000 витрат", en: "10,000 expenses" }
      mOverall: { uk: "загальна сума", en: "the overall total" }
      mSize: { uk: "кількість записів", en: "the number of records" }
      mDuplicate: { uk: "addExpense з наявним id", en: "addExpense with an existing id" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Інваріант індексу підсумків і граничні тести"
      en: "The invariant of a totals index and boundary tests"
    instructions:
      uk: |
        У `totals.js` (лише для читання) трекер витрат будує індекс `{ records, byCategory, overall }`: `records` — `Map` від `id` до витрати, `byCategory` — `Map` від категорії до суми `amountMinor`, `overall` — загальна сума.

        1. У `invariant.js` допиши `assertInvariant(totals)`. Вона нічого не повертає, коли індекс узгоджений, і кидає `Error` з поясненням, коли ні. Перевір три правила з коментаря у файлі: кожен запис лежить під своїм `id`; підсумок кожної категорії дорівнює сумі її записів, і в кожної категорії записів є підсумок; `overall` дорівнює сумі підсумків категорій. Індекс вона не змінює.
        2. У `totals.test.js` додай чотири граничні тести: жодної витрати, одна витрата, `addExpense` з `id`, який уже є (має кинути помилку, а індекс — лишитися правильним), і 10 000 витрат. У кожному викликай `assertInvariant` і перевір конкретне число — суму чи кількість записів.

        Перевірка запустить твої тести на справжньому `totals.js` і на трьох зламаних версіях — кожну має зловити хоча б один твій тест.
      en: |
        In `totals.js` (read-only) the expense tracker builds an index `{ records, byCategory, overall }`: `records` is a `Map` from `id` to expense, `byCategory` a `Map` from category to the sum of `amountMinor`, `overall` the overall total.

        1. In `invariant.js`, finish `assertInvariant(totals)`. It returns nothing when the index is consistent and throws an `Error` with an explanation when it is not. Check the three rules from the comment in the file: every record is stored under its own `id`; every category total equals the sum of its records, and every category of the records has a total; `overall` equals the sum of the category totals. It does not change the index.
        2. In `totals.test.js`, add four boundary tests: no expenses, one expense, `addExpense` with an `id` that is already there (it must throw, and the index must stay correct), and 10,000 expenses. In each, call `assertInvariant` and check a specific number — a total or the number of records.

        The check runs your tests against the real `totals.js` and against three broken versions — each must be caught by at least one of your tests.
    testTitles:
      "accepts a consistent index, also an empty one":
        uk: "Приймає узгоджений індекс, зокрема порожній"
        en: "Accepts a consistent index, also an empty one"
      "throws when overall is not the sum of the category totals":
        uk: "Кидає помилку, коли `overall` не дорівнює сумі категорій"
        en: "Throws when `overall` is not the sum of the category totals"
      "throws when a category total does not match its records":
        uk: "Кидає помилку, коли підсумок категорії не збігається з її записами"
        en: "Throws when a category total does not match its records"
      "throws when a category of the records has no total":
        uk: "Кидає помилку, коли в категорії записів немає підсумку"
        en: "Throws when a category of the records has no total"
      "throws when a record is stored under another id":
        uk: "Кидає помилку, коли запис лежить під чужим `id`"
        en: "Throws when a record is stored under another `id`"
      "does not change the index":
        uk: "Не змінює індекс"
        en: "Does not change the index"
      "your tests pass with the real totals.js":
        uk: "Твої тести проходять зі справжнім `totals.js`"
        en: "Your tests pass with the real `totals.js`"
      "one of your tests fails when an empty list of expenses crashes":
        uk: "Твій тест ловить версію, що падає на порожньому списку витрат"
        en: "One of your tests fails when an empty list of expenses crashes"
      "one of your tests fails when addExpense accepts an id that is already there":
        uk: "Твій тест ловить `addExpense`, що приймає наявний `id`"
        en: "One of your tests fails when `addExpense` accepts an `id` that is already there"
      "one of your tests fails when buildTotals stops after 1,000 expenses":
        uk: "Твій тест ловить `buildTotals`, що зупиняється після 1 000 витрат"
        en: "One of your tests fails when `buildTotals` stops after 1,000 expenses"
    hints:
      nudge:
        uk: "Почни з того, щоб **порахувати заново** з `records` те, що мало б бути в `byCategory`, і лише потім порівнюй."
        en: "Start by **computing again** from `records` what should be in `byCategory`, and only then compare."
      explanation:
        uk: "Так звіряють касу наприкінці дня: не вірять підсумку в журналі, а перераховують чеки й порівнюють. Пройди `records` і склади власну `Map` «категорія → сума»; по дорозі перевір, що ключ кожного запису дорівнює його `id`. Потім для кожної категорії зі своєї суми порівняй із `byCategory`, і наприкінці додай усі значення `byCategory` та порівняй з `overall`. Кожне порушення — окрема помилка з поясненням. У тестах: `buildTotals([])` — найкоротший шлях до порожнього випадку, а 10 000 записів зручно зібрати циклом. Для дубліката обгорни виклик у функцію: `toThrow` викликає її сам."
        en: "This is how a till is reconciled at the end of the day: you do not trust the total in the log, you recount the receipts and compare. Walk `records` and build your own `Map` “category → sum”; on the way, check that every record’s key equals its `id`. Then for every category of your sum, compare with `byCategory`, and at the end add up all values of `byCategory` and compare with `overall`. Every violation is a separate error with an explanation. In the tests: `buildTotals([])` is the shortest way to the empty case, and 10,000 records are easy to build with a loop. For the duplicate, wrap the call in a function: `toThrow` calls it itself."
    solutionNote:
      uk: "Інваріант не довіряє збереженим підсумкам: він перераховує їх із записів і порівнює. Тому ловить і підсумок, що розійшовся з записами, і категорію без підсумку, і запис під чужим ключем — а перевірка лише `overall` проти суми категорій пропустила б усе це. Граничні тести поєднують `assertInvariant` з постумовою: версія, що зупиняється після 1 000 витрат, лишається узгодженою сама з собою, і впіймати її може лише перевірка «записів рівно 10 000»."
      en: "The invariant does not trust the stored totals: it recomputes them from the records and compares. That is why it catches a total that drifted from its records, a category without a total and a record under a wrong key — while checking only `overall` against the sum of the categories would miss all of that. The boundary tests combine `assertInvariant` with a postcondition: a version that stops after 1,000 expenses stays consistent with itself, and only the check “exactly 10,000 records” can catch it."
    feedback:
      - when: { test: "accepts a consistent index, also an empty one" }
        message:
          uk: "Ця перевірка дає правильні індекси трьох витрат і нуля витрат і чекає, що `assertInvariant` нічого не кине. Якщо кидає, одне з правил хибно спрацьовує — наприклад, на порожньому індексі сума категорій має бути `0`, а не `undefined`."
          en: "This check passes correct indexes of three expenses and of none and expects `assertInvariant` to throw nothing. If it throws, one of the rules fires by mistake — for example, on an empty index the sum of the categories must be `0`, not `undefined`."
      - when: { test: "throws when a category total does not match its records" }
        message:
          uk: "Ця перевірка збільшує підсумок `food` на 1 і `overall` теж на 1, тож сума категорій з `overall` збігається. Помилку можна знайти, лише порахувавши суму записів `food` заново й порівнявши з `byCategory`."
          en: "This check raises the `food` total by 1 and `overall` by 1 too, so the sum of the categories matches `overall`. The error can be found only by recomputing the sum of the `food` records and comparing it with `byCategory`."
      - when: { test: "throws when a category of the records has no total" }
        message:
          uk: "Ця перевірка прибирає з `byCategory` категорію `transport` (і зменшує `overall`), хоча запис цієї категорії лишився в `records`. Порівнюй, ідучи від категорій **записів**, а не лише від того, що є в `byCategory`."
          en: "This check removes the `transport` category from `byCategory` (and lowers `overall`), although a record of that category is still in `records`. Compare starting from the categories of the **records**, not only from what is in `byCategory`."
      - when: { test: "throws when a record is stored under another id" }
        message:
          uk: "Ця перевірка кладе витрату `e-02` під ключ `e-99` і чекає `Error`. Порівнюй ключ кожного запису `Map` з полем `id` самого запису."
          en: "This check stores the expense `e-02` under the key `e-99` and expects an `Error`. Compare the key of every `Map` entry with the `id` field of the record itself."
      - when: { test: "does not change the index" }
        message:
          uk: "Ця перевірка порівнює індекс до і після виклику. Рахуй суми в нових змінних чи новій `Map`, не змінюючи `records`, `byCategory` чи `overall`."
          en: "This check compares the index before and after the call. Compute the sums in new variables or a new `Map` without changing `records`, `byCategory` or `overall`."
      - when: { test: "your tests pass with the real totals.js" }
        message:
          uk: "Ця перевірка запускає твої тести зі справжнім `totals.js` і правильним інваріантом і чекає, що всі пройдуть. Якщо якийсь падає, у ньому хибне очікування: перевір числа — сума 10 000 витрат по 100 дорівнює `1000000`."
          en: "This check runs your tests with the real `totals.js` and a correct invariant and expects all of them to pass. If one fails, it has a wrong expectation: check the numbers — the total of 10,000 expenses of 100 each is `1000000`."
      - when: { test: "one of your tests fails when an empty list of expenses crashes" }
        message:
          uk: "Ця перевірка чекає, що хоча б один твій тест упаде на `buildTotals`, яка падає на порожньому списку. Додай тест для `buildTotals([])`."
          en: "This check expects at least one of your tests to fail on a `buildTotals` that crashes on an empty list. Add a test for `buildTotals([])`."
      - when: { test: "one of your tests fails when addExpense accepts an id that is already there" }
        message:
          uk: "Ця перевірка чекає, що хоча б один твій тест упаде на `addExpense`, яка мовчки приймає наявний `id`. Додай тест, що чекає помилку від `addExpense` з наявним `id`: `toThrow` потребує функції, яку викличе сам."
          en: "This check expects at least one of your tests to fail on an `addExpense` that silently accepts an existing `id`. Add a test that expects an error from `addExpense` with an existing `id`: `toThrow` needs a function it calls itself."
      - when: { test: "one of your tests fails when buildTotals stops after 1,000 expenses" }
        message:
          uk: "Ця перевірка чекає, що хоча б один твій тест упаде на `buildTotals`, яка бере лише перші 1 000 витрат. Інваріант таку версію не помітить — вона узгоджена сама з собою. Перевір у тесті на 10 000 витрат кількість записів або загальну суму."
          en: "This check expects at least one of your tests to fail on a `buildTotals` that takes only the first 1,000 expenses. The invariant will not notice such a version — it is consistent with itself. In the test with 10,000 expenses, check the number of records or the overall total."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` з’являється, коли щось викликають як функцію, хоча це не функція, або читають властивість `undefined`. `Map` перебирають `for (const [key, value] of map)`, а значення беруть `map.get(key)`, не `map[key]`. Якщо перевірки кажуть «is not a function», з `invariant.js` зник експорт `assertInvariant`."
          en: "A `TypeError` appears when something that is not a function is called as one, or a property of `undefined` is read. A `Map` is walked with `for (const [key, value] of map)`, and values are read with `map.get(key)`, not `map[key]`. If the checks say “is not a function”, the `assertInvariant` export disappeared from `invariant.js`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-17
    body:
      uk: "Запиши інваріант свого проєкту одним реченням — «`id` унікальні», «дати відсортовані», «сума дорівнює сумі частин» — і подумай, після яких операцій його варто перевіряти. Коли в кроці проєкту ти заміниш перетворення на індексоване, тест, що порівнює старий і новий результат, — це та сама перевірка постумови."
      en: "Write your project’s invariant in one sentence — “`id`s are unique”, “dates are sorted”, “the total equals the sum of its parts” — and think about after which operations it is worth checking. When you replace a transform with an indexed one in the project step, a test that compares the old and the new result is the same postcondition check."
