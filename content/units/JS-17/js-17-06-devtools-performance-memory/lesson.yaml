id: js-17-06-devtools-performance-memory
unit: JS-17
title:
  uk: "DevTools: продуктивність, мережа та пам’ять"
  en: "DevTools performance, network and memory"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Записати профіль продуктивності повільної взаємодії й показати довге завдання та функцію, яка в ньому переважає."
    en: "Record a performance profile of a slow interaction and point to the long task and the function that dominates it."
  - uk: "Прочитати мережевий водоспад завантаження фікстур і порівняти два знімки heap, а також сказати, яка панель відповідає на яке питання."
    en: "Read the network waterfall of a fixture load and compare two heap snapshots, and say which panel answers which question."
prerequisites: [js-17-05-invariants-boundaries, js-13-07-memory-leak-diagnosis]
subskills:
  - { family: W-05, skill: "DevTools performance/network/memory", depth: intro }
glossary: [performance-profile, long-task, flame-chart]
selfCheck: [predict-dominant, evidence-note]

blocks:
  - id: three-questions
    kind: explanation
    title:
      uk: "Три панелі — три питання"
      en: "Three panels, three questions"
    body:
      uk: |
        Коли сторінка «гальмує», здогадка за кодом — це гіпотеза, а не відповідь. Відповідь дає [[browser-devtools|DevTools]], і кожна панель відповідає на своє питання:

        | Питання | Панель | Що дивитися |
        |---|---|---|
        | Куди йде час після кліку? | **Performance** | [[long-task\|довге завдання]] і [[flame-chart\|flame chart]] під ним |
        | Коли прийшли дані й скільки чекали? | **Network** | смужку запиту на водоспаді (**Waterfall**) |
        | Що лишається в пам’яті? | **Memory** | два знімки heap і їхнє порівняння |

        Довге завдання — це шматок роботи головного потоку, що триває понад 50 мс: поки воно не закінчилося, сторінка не реагує ні на клік, ні на клавішу. На flame chart ширина смужки — це час, а смужки нижче — функції, які викликала верхня. У таблиці **Bottom-up** стовпець **Self time** показує час, проведений у самій функції, без тих, кого вона викликала.
      en: |
        When a page “lags”, a guess from reading the code is a hypothesis, not an answer. The answer comes from [[browser-devtools|DevTools]], and every panel answers its own question:

        | Question | Panel | What to look at |
        |---|---|---|
        | Where does the time go after a click? | **Performance** | the [[long-task]] and the [[flame-chart]] under it |
        | When did the data arrive, and how long was the wait? | **Network** | the request’s bar on the **Waterfall** |
        | What stays in memory? | **Memory** | two heap snapshots and their comparison |

        A long task is a piece of main-thread work that lasts more than 50 ms: until it ends, the page reacts neither to a click nor to a key. On a flame chart the width of a bar is time, and the bars below are the functions the upper one called. In the **Bottom-up** table, the **Self time** column shows the time spent in the function itself, without the ones it called.

  - id: three-panels
    kind: visual
    visual: diagram
    title:
      uk: "Один повільний клік у трьох панелях"
      en: "One slow click in three panels"
    textEquivalent:
      uk: "Сторінка фільтра витрат має три сліди в DevTools. На панелі Performance клік «Фільтрувати» — це одне довге завдання, а в Bottom-up найбільший Self time має formatDate; цей запис веде до рядка page.js, де toLocaleDateString викликається для кожного рядка списку. На панелі Network видно запит items?lang до лабораторного сервера: його смужка на Waterfall показує очікування й отримання фікстур, і він веде до рядка з fetch у page.js. На панелі Memory два знімки heap — до кліків і після п’яти кліків — порівнюють у режимі Comparison: якщо другий лише трохи більший, старі рядки списку прибрано, і витоку немає. Кожна панель відповідає на своє питання й указує на свій рядок коду."
      en: "The expense filter page leaves three traces in DevTools. In the Performance panel the “Filter” click is one long task, and in Bottom-up formatDate has the largest Self time; that entry leads to the line of page.js where toLocaleDateString is called for every row of the list. In the Network panel there is the items?lang request to the lab server: its bar on the Waterfall shows the wait and the download of the fixtures, and it leads to the line with fetch in page.js. In the Memory panel two heap snapshots — before the clicks and after five clicks — are compared in the Comparison view: if the second is only slightly bigger, the old list rows were removed and there is no leak. Every panel answers its own question and points to its own line of code."
    spec:
      layout: grid
      groups:
        - { id: perf, label: "Performance" }
        - { id: net, label: "Network" }
        - { id: mem, label: "Memory" }
        - { id: code, label: "page.js" }
      nodes:
        - { id: task, group: perf, label: { uk: "довге завдання", en: "long task" }, col: 0, row: 0 }
        - { id: self, group: perf, label: "formatDate", col: 1, row: 0 }
        - { id: request, group: net, label: "items?lang=…", col: 0, row: 1 }
        - { id: bar, group: net, label: "Waterfall", col: 1, row: 1 }
        - { id: snap1, group: mem, label: { uk: "знімок 1", en: "snapshot 1" }, col: 0, row: 2 }
        - { id: snap2, group: mem, label: { uk: "знімок 2", en: "snapshot 2" }, col: 1, row: 2 }
        - { id: fetchLine, group: code, label: { uk: "рядок 4: fetch", en: "line 4: fetch" }, shape: note, col: 0, row: 3 }
        - { id: formatLine, group: code, label: { uk: "рядок 23", en: "line 23" }, shape: note, col: 1, row: 3 }
      edges:
        - { id: task-self, from: task, to: self, label: "Bottom-up" }
        - { id: self-code, from: self, to: formatLine }
        - { id: request-bar, from: request, to: bar }
        - { id: request-code, from: request, to: fetchLine }
        - { id: compare, from: snap1, to: snap2, label: "Comparison" }
      steps:
        - caption:
            uk: "Один клік «Фільтрувати» залишає сліди в трьох панелях. Кожна відповідає на своє питання."
            en: "One “Filter” click leaves traces in three panels. Each answers its own question."
        - highlight: [task, self, task-self, self-code, formatLine]
          dim: [request, bar, snap1, snap2, fetchLine, request-bar, request-code, compare]
          caption:
            uk: "**Куди йде час?** Довге завдання після кліку; у Bottom-up найбільший Self time має `formatDate`, і посилання веде до рядка 23 `page.js`, де оголошено `formatDate`: вона викликає `toLocaleDateString` для кожного рядка списку."
            en: "**Where does the time go?** The long task after the click; in Bottom-up `formatDate` has the largest Self time, and its link leads to line 23 of `page.js`, where `formatDate` is declared: it calls `toLocaleDateString` for every row of the list."
        - highlight: [request, bar, request-bar, request-code, fetchLine]
          dim: [task, self, snap1, snap2, formatLine, task-self, self-code, compare]
          caption:
            uk: "**Коли прийшли дані?** Запит фікстур до лабораторного сервера і його смужка на Waterfall. Він веде до рядка 4 з `fetch`."
            en: "**When did the data arrive?** The fixture request to the lab server and its bar on the Waterfall. It leads to line 4 with `fetch`."
        - highlight: [snap1, snap2, compare]
          dim: [task, self, request, bar, fetchLine, formatLine, task-self, self-code, request-bar, request-code]
          caption:
            uk: "**Що лишається в пам’яті?** Два знімки heap — до і після п’яти кліків — у режимі Comparison. Якщо нових об’єктів не набралися тисячі, витоку немає."
            en: "**What stays in memory?** Two heap snapshots — before and after five clicks — in the Comparison view. If thousands of new objects did not pile up, there is no leak."

  - id: predict-dominant
    kind: prediction
    runnable: false
    prompt:
      uk: "Сторінка трекера витрат фільтрує 20 000 синтетичних витрат за категорією й показує приблизно третину з них. Ось три кроки після натискання «Фільтрувати». Що займе **найбільше** часу в профілі?"
      en: "An expense tracker page filters 20,000 synthetic expenses by category and shows about a third of them. Here are the three steps after pressing “Filter”. What takes the **most** time in the profile?"
    code: |
      function matches(expense, category) {
        return expense.category === category && expense.amountMinor > 0;
      }

      function formatDate(isoDate) {
        return new Date(isoDate + "T00:00:00").toLocaleDateString("uk-UA", { day: "numeric", month: "long" });
      }

      function renderRows(list) {
        const items = list.map((expense) => {
          const item = document.createElement("li");
          item.textContent = `${formatDate(expense.date)} · ${expense.label}`;
          return item;
        });
        document.querySelector("#rows").replaceChildren(...items);
      }

      const kept = expenses.filter((expense) => matches(expense, category));
      renderRows(kept);
    answer:
      type: choice
      options:
        - id: format
          text:
            uk: "`formatDate`: форматування дати всередині циклу"
            en: "`formatDate`: formatting the date inside the loop"
        - id: filter
          text:
            uk: "`filter` з `matches`: перевірка всіх 20 000 записів"
            en: "`filter` with `matches`: checking all 20,000 records"
          why:
            uk: "`matches` справді викликається 20 000 разів, але кожен виклик — два дешеві порівняння. У профілі цієї сторінки `matches` майже непомітна."
            en: "`matches` is indeed called 20,000 times, but each call is two cheap comparisons. In this page’s profile `matches` is barely visible."
        - id: dom
          text:
            uk: "Створення елементів `li` і вставлення їх на сторінку"
            en: "Creating the `li` elements and inserting them into the page"
          why:
            uk: "Робота зі сторінкою помітна, але тут вона одна на рядок і проста. Дорожчим виявляється те, що відбувається для кожного рядка **перед** нею."
            en: "The page work is visible, but here it is one simple step per row. What happens for every row **before** it turns out to be more expensive."
      correct: [format]
    explanation:
      uk: "Ми записали профіль цієї сторінки в Chrome на одній машині: за клік `formatDate` зайняла близько 146 мс власного часу, а `matches` і створення елементів — по кілька мілісекунд. Перевірка навпаки дала те саме: у пісочниці клік тривав близько 150 мс, а коли `formatDate` повертала дату без форматування — менше за 10 мс. Твої числа будуть іншими, але співвідношення — схожим. `toLocaleDateString` щоразу заново готує правила форматування для мови. Читаючи код, легко запідозрити фільтр — він «перевіряє все», — але виміряти вийшло інше. Тому спершу профіль, потім висновок."
      en: "We recorded this page’s profile in Chrome on one machine: per click, `formatDate` took about 146 ms of its own time, while `matches` and creating the elements took a few milliseconds each. The reverse check agreed: in the sandbox the click took about 150 ms, and under 10 ms when `formatDate` returned the date unformatted. Your numbers will differ, but the ratio will be similar. `toLocaleDateString` prepares the formatting rules for the language anew every time. Reading the code, it is easy to suspect the filter — it “checks everything” — but the measurement said otherwise. So first a profile, then a conclusion."

  - id: slow-filter
    kind: example
    runtime: browser-js
    dir: slow-filter
    entry: index.html
    capabilities: { network: lab }
    strings:
      lang: { uk: "uk", en: "en" }
      locale: { uk: "uk-UA", en: "en-GB" }
      heading: { uk: "Витрати за категорією", en: "Expenses by category" }
      categoryLabel: { uk: "Категорія", en: "Category" }
      food: { uk: "Їжа", en: "Food" }
      transport: { uk: "Транспорт", en: "Transport" }
      home: { uk: "Дім", en: "Home" }
      fun: { uk: "Розваги", en: "Fun" }
      filterButton: { uk: "Фільтрувати", en: "Filter" }
      of: { uk: "з", en: "of" }
      click: { uk: "Фільтр", en: "Filter" }
      rows: { uk: "рядків", en: "rows" }
      loaded: { uk: "Завантажено", en: "Loaded" }
      fixtures: { uk: "фікстур", en: "fixtures" }
      expenses: { uk: "витрат", en: "expenses" }
    title:
      uk: "Профілюємо повільний фільтр"
      en: "Profiling a slow filter"
    body:
      uk: |
        Сторінка завантажує шість фікстур витрат з лабораторного HTTP-сервера платформи (`/lab/expenses/items`), робить із них 20 000 синтетичних витрат і по кнопці «Фільтрувати» показує витрати однієї категорії. Рядок під кнопкою й консоль показують час, виміряний `performance.now()` навколо фільтра й рендеру.

        Запусти, натисни «Фільтрувати» кілька разів на вкладці **Сторінка** й подивись на час. Далі — DevTools.
      en: |
        The page loads six expense fixtures from the platform’s lab HTTP server (`/lab/expenses/items`), turns them into 20,000 synthetic expenses and, on the “Filter” button, shows the expenses of one category. The line under the button and the console show the time measured with `performance.now()` around the filter and the render.

        Run it, press “Filter” a few times on the **Page** tab and look at the time. Then — DevTools.
    tryIt:
      uk: |
        Відкрий DevTools на вкладці платформи: F12, або Cmd+Option+I на macOS, або Ctrl+Shift+I у Windows і Linux. Сторінка працює в пісочниці — окремому фреймі з адресою, що починається з `jsll-run-`; Chrome виконує його в окремому процесі, тому DevTools показує його окремо від сторінки платформи. Назви й розташування кнопок DevTools трохи змінюються між версіями Chrome: якщо щось зветься інакше, шукай поруч те саме за змістом.

        1. **Performance.** Натисни кнопку запису (круглу), натисни «Фільтрувати» на сторінці, зупини запис. Знайди довге завдання — його сірий прямокутник позначено червоним кутом — у доріжці фрейму пісочниці. Відкрий під ним **Bottom-up** і впорядкуй за **Self time**: зверху буде `formatDate`. У стовпці файлу замість `page.js` ти побачиш адресу на зразок `blob:null/…` — так платформа завантажує модулі, а назви функцій і номери рядків — твої.
        2. Зміни `SIZE` на `40000`, запусти й запиши профіль ще раз. Що виросло — і в скільки разів?
        3. **Network.** Відкрий панель Network і запусти програму знову: запит `items?lang=…` — це завантаження фікстур, а смужка у стовпці **Waterfall** показує, скільки він чекав і скільки отримував відповідь. Файли самого проєкту (`page.js`, `styles.css`) тут не з’являться: пісочниця віддає їх без мережі.
        4. **Memory.** Обери у списку віртуальних машин JavaScript ту, що належить фрейму `jsll-run-…`, познач **Heap snapshot** і натисни **Take snapshot**. Натисни «Фільтрувати» п’ять разів і зроби другий знімок. Розмір кожного знімка видно під його назвою зліва; у другого знімка обери режим **Comparison**, щоб побачити, яких об’єктів стало більше.
      en: |
        Open DevTools on the platform’s tab: F12, or Cmd+Option+I on macOS, or Ctrl+Shift+I on Windows and Linux. The page runs in the sandbox — a separate frame whose address starts with `jsll-run-`; Chrome runs it in a separate process, so DevTools shows it apart from the platform’s page. The names and places of DevTools controls change a little between Chrome versions: if something is called differently, look nearby for the same idea.

        1. **Performance.** Press the record button (the round one), press “Filter” on the page, stop the recording. Find the long task — its grey box is marked with a red corner — in the sandbox frame’s track. Open **Bottom-up** under it and sort by **Self time**: `formatDate` is at the top. In the file column you see an address like `blob:null/…` instead of `page.js` — that is how the platform loads modules; the function names and line numbers are yours.
        2. Change `SIZE` to `40000`, run and record the profile again. What grew — and by how much?
        3. **Network.** Open the Network panel and run the program again: the request `items?lang=…` is the fixture load, and its bar in the **Waterfall** column shows how long it waited and how long it took to receive the answer. The project’s own files (`page.js`, `styles.css`) do not appear here: the sandbox serves them without the network.
        4. **Memory.** In the list of JavaScript virtual machines, pick the one that belongs to the `jsll-run-…` frame, select **Heap snapshot** and press **Take snapshot**. Press “Filter” five times and take a second snapshot. Each snapshot’s size is shown under its name on the left; for the second snapshot choose the **Comparison** view to see which objects became more numerous.

  - id: reading-memory
    kind: explanation
    title:
      uk: "Що росте — ще не витік"
      en: "What grows is not yet a leak"
    body:
      uk: |
        Під час запису профілю лінія пам’яті часто лізе вгору: кожен клік створює тисячі нових рядків тексту й елементів. Це ще не [[memory-leak|витік]]. Старі рядки списку стають непотрібними, і збирач сміття прибере їх — але тоді, коли сам вирішить.

        Тому висновок роблять із [[heap-snapshot|знімків heap]]: перед кожним знімком DevTools сам запускає збирання сміття, тож у знімок потрапляє лише те, що досі досяжне. Якщо після п’яти кліків другий знімок лише трохи більший за перший, а в **Comparison** немає тисяч нових об’єктів, — пам’ять повертається. Якщо з кожною серією кліків знімок росте на ту саму величину, шукай, хто тримає старі об’єкти: так, як ти це робив у JS-13.

        І завжди записуй, **на якому розмірі даних** ти міряв: «240 мс» без «20 000 витрат» нічого не каже.
      en: |
        While a profile is recorded, the memory line often climbs: every click creates thousands of new strings and elements. That is not yet a [[memory-leak]]. The old list rows become unneeded, and the garbage collector removes them — but when it decides to.

        So the conclusion comes from [[heap-snapshot|heap snapshots]]: before every snapshot DevTools runs garbage collection itself, so the snapshot holds only what is still reachable. If after five clicks the second snapshot is only slightly bigger than the first, and **Comparison** shows no thousands of new objects, the memory comes back. If the snapshot grows by the same amount with every series of clicks, look for what holds the old objects — the way you did it in JS-13.

        And always write down **at what data size** you measured: “240 ms” without “20,000 expenses” says nothing.

  - id: recall-retained
    kind: review
    title:
      uk: "Пригадай: що тримає пам’ять"
      en: "Recall: what holds memory"
    items:
      - id: cache-root
        from: js-13-05-allocation-retained-references
        prompt:
          uk: "Щоб «пришвидшити» фільтр, хтось зберігає кожен показаний список у `Map` на рівні модуля: `cache.set(Date.now(), kept)`. Після 50 кліків другий знімок heap значно більший за перший. Чому збирач сміття не прибрав старі списки?"
          en: "To “speed up” the filter, someone stores every shown list in a module-level `Map`: `cache.set(Date.now(), kept)`. After 50 clicks the second heap snapshot is much bigger than the first. Why did the garbage collector not remove the old lists?"
        answer:
          type: choice
          options:
            - id: reachable
              text:
                uk: "Вони досі досяжні: `Map` на рівні модуля живе весь час, поки працює сторінка, і тримає посилання на кожен список"
                en: "They are still reachable: the module-level `Map` lives as long as the page runs and holds a reference to every list"
            - id: gc-late
              text:
                uk: "Збирач сміття просто ще не запускався"
                en: "The garbage collector simply has not run yet"
              why:
                uk: "Перед знімком heap DevTools сам запускає збирання сміття. Те, що лишилося в знімку, — досяжне."
                en: "DevTools runs garbage collection itself before a heap snapshot. Whatever is left in the snapshot is reachable."
            - id: dom
              text:
                uk: "Їх тримає сторінка: усі списки досі показано"
                en: "The page holds them: all the lists are still shown"
              why:
                uk: "Показано лише останній список: `replaceChildren` прибирає старі рядки. Старі масиви тримає не сторінка, а `cache`."
                en: "Only the last list is shown: `replaceChildren` removes the old rows. The old arrays are held not by the page but by `cache`."
          correct: [reachable]
        explanation:
          uk: "Збирач сміття прибирає лише недосяжне. Змінна на рівні модуля — один із [[gc-root|коренів]], від яких він шукає, тож усе, що лежить у `cache`, лишається. Необмежений кеш — класична причина пам’яті, що росте з кожним кліком; його обмежують розміром або не заводять, поки вимірювання не покаже, що він потрібен."
          en: "The garbage collector removes only what is unreachable. A module-level variable is one of the [[gc-root|roots]] it searches from, so everything in `cache` stays. An unbounded cache is a classic reason for memory that grows with every click; it is bounded by size or not added until a measurement shows it is needed."

  - id: evidence-note
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: evidence-note
    entry: index.html
    editable: [evidence.js]
    strings:
      lang: { uk: "uk", en: "en" }
      heading: { uk: "Частка виконання звичок", en: "Habit completion rates" }
      recalculate: { uk: "Перерахувати", en: "Recalculate" }
      habit: { uk: "Звичка", en: "Habit" }
      habits: { uk: "звичок", en: "habits" }
      sampleInteraction: { uk: "Один клік «Перерахувати» на вкладці Сторінка під час запису", en: "One click on “Recalculate” on the Page tab while recording" }
      altInteraction: { uk: "Клік «Перерахувати» після запуску", en: "A “Recalculate” click after the run" }
    title:
      uk: "Записка з доказами"
      en: "An evidence note"
    instructions:
      uk: |
        Сторінка трекера звичок по кнопці «Перерахувати» рахує частку виконання для кожної звички за три роки. Запусти її й запиши профіль так само, як у прикладі: запис → клік «Перерахувати» → стоп. Потім зроби два знімки heap: до кліку й після трьох кліків.

        Заповни в `evidence.js` записку **зі своїх вимірювань**:

        - `interaction` — що саме ти робив під час запису;
        - `habits` — скільки звичок мала сторінка (подивись у `page.js`);
        - `longTaskMs` — тривалість довгого завдання з панелі Performance (наведи на нього курсор);
        - `topSelfTime` — три різні записи з найбільшим **Self time** у Bottom-up, по порядку; хоча б один із них — функція з `page.js`;
        - `heapBeforeMB` і `heapAfterMB` — розміри двох знімків у мегабайтах.

        Числа на кожній машині свої. Перевірка дивиться, чи записка повна й чи вона узгоджена з тим, що таке довге завдання і що є в `page.js`.
      en: |
        On the “Recalculate” button, the habit tracker page computes the completion rate of every habit over three years. Run it and record a profile the same way as in the example: record → click “Recalculate” → stop. Then take two heap snapshots: before the click and after three clicks.

        Fill in the note in `evidence.js` **from your own measurements**:

        - `interaction` — what exactly you did while recording;
        - `habits` — how many habits the page had (look in `page.js`);
        - `longTaskMs` — the duration of the long task from the Performance panel (hover over it);
        - `topSelfTime` — three different entries with the largest **Self time** in Bottom-up, in order; at least one of them is a function from `page.js`;
        - `heapBeforeMB` and `heapAfterMB` — the sizes of the two snapshots in megabytes.

        The numbers differ on every machine. The check looks at whether the note is complete and consistent with what a long task is and with what is in `page.js`.
    testTitles:
      "the note names the interaction":
        uk: "Записка називає взаємодію"
        en: "The note names the interaction"
      "the note records the dataset size of the page":
        uk: "Записка містить розмір даних сторінки"
        en: "The note records the dataset size of the page"
      "the long task lasts more than 50 ms":
        uk: "Довге завдання триває понад 50 мс"
        en: "The long task lasts more than 50 ms"
      "three different entries by self time, one of them a function of page.js":
        uk: "Три різні записи за Self time, і один із них — функція з `page.js`"
        en: "Three different entries by self time, one of them a function of `page.js`"
      "both heap sizes are recorded":
        uk: "Записано обидва розміри heap"
        en: "Both heap sizes are recorded"
    hints:
      nudge:
        uk: "Почни з панелі Performance: наведи курсор на сірий прямокутник із червоним кутом — підказка покаже його тривалість."
        en: "Start with the Performance panel: hover over the grey box with the red corner — the tooltip shows its duration."
      explanation:
        uk: "Записка з доказами — як протокол лікаря: не «здається, болить серце», а «тиск 150/95 о 9:00». Довге завдання за визначенням довше за 50 мс; якщо в тебе вийшло 16 мс, ти, мабуть, виміряв один кадр, а не завдання після кліку. У Bottom-up назви на зразок `(program)` чи `Layout` — теж чесні записи, але хоча б одна з трьох має бути функцією зі сторінки: інакше записка не вказує, який код змінювати. Розмір знімка — число під його назвою в лівій колонці панелі Memory."
        en: "An evidence note is like a doctor’s record: not “the heart seems to hurt” but “blood pressure 150/95 at 9:00”. A long task is longer than 50 ms by definition; if you got 16 ms, you probably measured one frame, not the task after the click. In Bottom-up, names like `(program)` or `Layout` are honest entries too, but at least one of the three must be a function of the page: otherwise the note does not say which code to change. A snapshot’s size is the number under its name in the left column of the Memory panel."
    solutionNote:
      uk: "Зразок записки — з однієї машини; твої числа будуть іншими, і це нормально. На цій сторінці майже весь власний час забирає `completionRate`: для кожної звички вона для кожного з 1 095 днів викликає `includes` по сотнях дат. Знімки heap до й після кліків майже однакові — пам’ять не росте, тож проблема тут — час, а не витік. У наступному уроці ти візьмеш таку записку за точку відліку й покращиш одне вимірюване місце."
      en: "The sample note comes from one machine; your numbers will differ, and that is fine. On this page `completionRate` takes almost all of the self time: for every habit it calls `includes` over hundreds of dates for each of 1,095 days. The heap snapshots before and after the clicks are almost the same — memory does not grow, so the problem here is time, not a leak. In the next lesson you take such a note as the baseline and improve one measured spot."
    feedback:
      - when: { test: "the note names the interaction" }
        message:
          uk: "Ця перевірка чекає в `interaction` непорожній текст — що саме ти робив під час запису, наприклад який клік."
          en: "This check expects non-empty text in `interaction` — what exactly you did while recording, for example which click."
      - when: { test: "the note records the dataset size of the page" }
        message:
          uk: "Ця перевірка порівнює `habits` зі сталою `HABIT_COUNT` у `page.js`. Число в записці — розмір даних, на якому ти міряв."
          en: "This check compares `habits` with the `HABIT_COUNT` constant in `page.js`. The number in the note is the data size you measured on."
      - when: { test: "the long task lasts more than 50 ms" }
        message:
          uk: "Ця перевірка чекає в `longTaskMs` число, більше за 50: довгим завдання стає саме тоді, коли триває понад 50 мс. Якщо в тебе вийшло менше, перевір, що наводиш курсор на завдання після кліку, а не на кадр чи інше коротке завдання."
          en: "This check expects a number greater than 50 in `longTaskMs`: a task becomes long exactly when it lasts more than 50 ms. If you got less, make sure you hover over the task after the click, not over a frame or another short task."
      - when: { test: "three different entries by self time, one of them a function of page.js" }
        message:
          uk: "Ця перевірка чекає в `topSelfTime` три різні непорожні назви, і хоча б одна з них має бути назвою функції, оголошеної в `page.js`. Назви на зразок `includes` чи `map` — це вбудовані методи, а не функції сторінки: візьми назви з Bottom-up, а не з прочитаного коду."
          en: "This check expects three different non-empty names in `topSelfTime`, and at least one of them must be the name of a function declared in `page.js`. Names like `includes` or `map` are built-in methods, not functions of the page: take the names from Bottom-up, not from reading the code."
      - when: { test: "both heap sizes are recorded" }
        message:
          uk: "Ця перевірка чекає в `heapBeforeMB` і `heapAfterMB` додатні числа — розміри двох знімків heap у мегабайтах, без одиниць і лапок."
          en: "This check expects positive numbers in `heapBeforeMB` and `heapAfterMB` — the sizes of the two heap snapshots in megabytes, without units or quotes."
      - when: { error: SyntaxError }
        message:
          uk: "Якщо картка каже «Код не вдалося запустити», у `evidence.js` найчастіше бракує коми між полями або лапок навколо тексту. Числа пиши без лапок і без «мс» чи «MB»."
          en: "If the card says “The code could not start”, `evidence.js` is most often missing a comma between fields or quotes around text. Write numbers without quotes and without “ms” or “MB”."

  - id: to-project
    kind: transfer
    capstoneStep: JS-17
    body:
      uk: "У кроці проєкту ти запишеш такий самий профіль для свого застосунку на тисячах синтетичних записів — до зміни перетворення й після неї. Без профілю «до» неможливо довести, що зміна щось покращила."
      en: "In the project step you will record the same kind of profile for your own app on thousands of synthetic records — before the change of the transform and after it. Without the “before” profile there is no way to prove that a change improved anything."
