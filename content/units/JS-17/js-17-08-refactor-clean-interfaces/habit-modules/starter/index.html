<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%heading%%</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1.5rem; color: #1f2328; }
      input { font: inherit; padding: 0.3rem 0.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>%%heading%%</h1>
      <label for="search">%%searchLabel%%</label>
      <input id="search" type="search" autocomplete="off">
      <section id="summary" aria-live="polite"></section>
    </main>
    <!-- main.js shows the summary; run-tests.js then runs habits.test.js and prints to the console. -->
    <script type="module" src="main.js"></script>
    <script type="module" src="run-tests.js"></script>
  </body>
</html>
