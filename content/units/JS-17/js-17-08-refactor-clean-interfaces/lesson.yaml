id: js-17-08-refactor-clean-interfaces
unit: JS-17
title:
  uk: "Рефакторинг до чистих інтерфейсів"
  en: "Refactoring toward clean interfaces"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Розібрати заплутану функцію «відфільтрувати — підсумувати — намалювати» на невеликі модулі з чіткими входами й виходами, малими кроками, із зеленими тестами після кожного кроку."
    en: "Refactor a tangled filter-summarize-render function into small modules with clear inputs and outputs, in small steps, with tests green after each step."
  - uk: "Назвати запах коду за кожним кроком (довга функція, повторена умова, прихований глобальний стан) і рефакторинг, що його прибирає."
    en: "Name the code smell (long function, duplicated condition, hidden global state) behind each step and the refactoring that removes it."
prerequisites: [js-17-07-measured-improvement, js-03-07-pure-vs-side-effects]
subskills:
  - { family: P-04, skill: "refactor/clean interfaces", depth: intro }
glossary: [refactoring, code-smell, characterization-test]
selfCheck: [predict-safe-steps, habit-modules]

blocks:
  - id: same-behavior-new-shape
    kind: explanation
    title:
      uk: "Та сама поведінка, нова форма"
      en: "The same behavior, a new shape"
    body:
      uk: |
        [[refactoring|Рефакторинг]] — це зміна **будови** коду без зміни його **поведінки**: те саме на вході — те саме на виході. Виправлення помилки, нова можливість, «покращене» округлення — це вже не рефакторинг, а окремі зміни з окремими тестами.

        Як знати, що поведінка не змінилася? «Код запускається без помилок» — замало. Спершу пишуть [[characterization-test|характеризаційні тести]]: вони фіксують, що код показує **сьогодні**, разом із дивацтвами. Потім ідуть малими кроками: один крок — запуск тестів — далі.

        Що саме змінювати, підказують [[code-smell|запахи коду]]:

        | Запах | Рефакторинг |
        |---|---|
        | довга функція робить три різні речі | **винести функцію** для кожної |
        | та сама умова повторюється | **винести предикат** в одну функцію |
        | функція читає прихований глобальний стан | **передати параметром** |
        | дані й сторінка перемішані | **розділити модулі**: домен окремо, рендер окремо |
      en: |
        [[refactoring|Refactoring]] is a change of the code’s **structure** without a change of its **behavior**: the same input — the same output. A bug fix, a new feature, “better” rounding — those are no longer refactoring but separate changes with separate tests.

        How do you know the behavior did not change? “The code runs without errors” is not enough. First you write [[characterization-test|characterization tests]]: they pin what the code shows **today**, quirks included. Then you go in small steps: one step — run the tests — next.

        [[code-smell|Code smells]] suggest what to change:

        | Smell | Refactoring |
        |---|---|
        | a long function does three different things | **extract a function** for each |
        | the same condition repeats | **extract a predicate** into one function |
        | a function reads hidden global state | **pass it as a parameter** |
        | data and page are mixed | **split the modules**: the domain on its own, the render on its own |

  - id: predict-safe-steps
    kind: prediction
    runnable: false
    strings:
      total: { uk: "Разом", en: "Total" }
      currency: { uk: "грн", en: "UAH" }
    prompt:
      uk: "`renderReport` фільтрує витрати за `view.category`, рахує суму, округлює її до цілих гривень і малює звіт. Характеризаційні тести перевіряють порожній список, одну витрату й фільтр за категорією. Які з чотирьох запропонованих кроків **змінять те, що бачать тести**?"
      en: "`renderReport` filters expenses by `view.category`, adds up the total, rounds it to whole hryvnias and draws the report. Characterization tests check an empty list, one expense and a category filter. Which of the four proposed steps **change what the tests see**?"
    code: |
      // Today, inside renderReport:
      for (const e of expenses) {
        if (view.category === "all" || e.category === view.category) {
          total = total + e.amountMinor;
          count = count + 1;
        }
      }
      sum.textContent = `%%total%% ${Math.round(total / 100)} %%currency%%`;

      // A. const isShown = (e) => view.category === "all" || e.category === view.category;
      //    and use isShown(e) in both loops
      // B. const total = expenses.filter(isShown).reduce((sum, e) => sum + e.amountMinor);
      // C. sum.textContent = `%%total%% ${(total / 100).toFixed(2)} %%currency%%`;   // "show the kopiykas properly"
      // D. function renderReport(root, expenses, category = view.category) { … use category … }
    answer:
      type: multi
      options:
        - id: extract-predicate
          text:
            uk: "A — винести повторену умову в `isShown`"
            en: "A — extract the repeated condition into `isShown`"
          why:
            uk: "Це той самий вираз в одному місці замість двох: результат для кожної витрати не змінюється."
            en: "It is the same expression in one place instead of two: the result for every expense does not change."
        - id: reduce-no-initial
          text:
            uk: "B — замінити цикл на `filter` і `reduce`"
            en: "B — replace the loop with `filter` and `reduce`"
        - id: fix-rounding
          text:
            uk: "C — показувати копійки замість округлення"
            en: "C — show the kopiykas instead of rounding"
        - id: parameter
          text:
            uk: "D — передавати категорію параметром зі значенням за замовчуванням"
            en: "D — pass the category as a parameter with a default value"
          why:
            uk: "Ті, хто викликає `renderReport` по-старому, отримують `view.category` як значення за замовчуванням — поведінка та сама, а залежність стала видимою."
            en: "Callers that call `renderReport` the old way get `view.category` as the default value — the behavior is the same, and the dependency became visible."
      correct: [reduce-no-initial, fix-rounding]
    explanation:
      uk: "B без початкового значення `reduce` ламає всі три випадки: на порожньому списку падає з `TypeError` (старий цикл давав `0`), а з однією витратою бере першим «акумулятором» сам об’єкт витрати — і замість суми виходить `NaN`; з кількома — об’єкт плюс число дає текст, і знову `NaN`. Код «виглядає так само», але тести це ловлять одразу. C змінює текст суми: можливо, копійки й справді кращі, але це **нова поведінка**, і її роблять окремою зміною з оновленим тестом, а не мимохідь. A і D змінюють лише форму коду."
      en: "B without an initial value for `reduce` breaks all three cases: on an empty list it fails with a `TypeError` (the old loop gave `0`), and with one expense it takes the expense object itself as the first “accumulator” — so the total becomes `NaN`; with several, an object plus a number gives text, and `NaN` again. The code “looks the same”, but the tests catch it at once. C changes the text of the total: maybe kopiykas really are better, but that is **new behavior**, and it is made as a separate change with an updated test, not along the way. A and D change only the shape of the code."

  - id: before-after
    kind: visual
    visual: diagram
    title:
      uk: "Залежності до й після"
      en: "Dependencies before and after"
    textEquivalent:
      uk: "До рефакторингу одна функція showSummary читає прихований об’єкт view і малює на сторінці, а фільтр, підрахунок і рендер перемішані в ній. Після рефакторингу showSummary у page.ts лишається єдиним місцем, що читає view: вона передає пошуковий текст у visibleHabits, видимі звички — у summarizeHabits, а підсумок і звички — у renderSummary. visibleHabits і summarizeHabits — доменні функції: вони отримують усе параметрами й не торкаються ні view, ні сторінки. renderSummary лише малює те, що отримала. Стрілки йдуть в один бік — від краю сторінки до домену й рендеру. Кожен крок до цієї форми робили із зеленими характеризаційними тестами."
      en: "Before the refactoring, one function showSummary reads the hidden object view and draws on the page, and the filter, the counting and the render are mixed in it. After the refactoring, showSummary in page.ts stays the only place that reads view: it passes the search text to visibleHabits, the visible habits to summarizeHabits, and the summary and the habits to renderSummary. visibleHabits and summarizeHabits are domain functions: they get everything as parameters and touch neither view nor the page. renderSummary only draws what it was given. The arrows go one way — from the page’s edge to the domain and the render. Every step towards this shape was taken with green characterization tests."
    spec:
      layout: grid
      groups:
        - { id: before, label: { uk: "До", en: "Before" } }
        - { id: after, label: { uk: "Після", en: "After" } }
      nodes:
        - { id: tangled, group: before, label: "showSummary", col: 0, row: 0 }
        - { id: viewBefore, group: before, label: "view", shape: cylinder, col: 1, row: 0 }
        - { id: domBefore, group: before, label: { uk: "сторінка", en: "page" }, shape: note, col: 1, row: 1 }
        - { id: edge, group: after, label: "showSummary", col: 0, row: 2 }
        - { id: viewAfter, group: after, label: "view", shape: cylinder, col: 1, row: 2 }
        - { id: visible, group: after, label: "visibleHabits", shape: round, col: 0, row: 3 }
        - { id: summary, group: after, label: "summarizeHabits", shape: round, col: 1, row: 3 }
        - { id: render, group: after, label: "renderSummary", col: 0, row: 4 }
        - { id: domAfter, group: after, label: { uk: "сторінка", en: "page" }, shape: note, col: 1, row: 4 }
      edges:
        - { id: reads-before, from: tangled, to: viewBefore, label: { uk: "читає", en: "reads" } }
        - { id: draws-before, from: tangled, to: domBefore, label: { uk: "малює", en: "draws" } }
        - { id: reads-after, from: edge, to: viewAfter, label: { uk: "читає", en: "reads" } }
        - { id: to-visible, from: edge, to: visible }
        - { id: to-summary, from: edge, to: summary }
        - { id: to-render, from: edge, to: render }
        - { id: draws-after, from: render, to: domAfter, label: { uk: "малює", en: "draws" } }
      hidden: [edge, viewAfter, visible, summary, render, domAfter, reads-after, to-visible, to-summary, to-render, draws-after]
      steps:
        - caption:
            uk: "**До:** одна функція читає прихований `view`, фільтрує, рахує й малює. Будь-яку частину не перевірити без решти."
            en: "**Before:** one function reads the hidden `view`, filters, counts and draws. No part can be checked without the rest."
        - show: [edge, viewAfter, visible, summary, render, domAfter, reads-after, to-visible, to-summary, to-render, draws-after]
          dim: [tangled, viewBefore, domBefore, reads-before, draws-before]
          caption:
            uk: "**Після:** `showSummary` лишилася на краю сторінки й лише з’єднує три частини. Тільки вона читає `view`."
            en: "**After:** `showSummary` stays at the page’s edge and only connects three parts. Only it reads `view`."
        - highlight: [visible, summary, to-visible, to-summary]
          dim: [tangled, viewBefore, domBefore, reads-before, draws-before, render, domAfter, draws-after]
          caption:
            uk: "Доменні функції отримують усе параметрами: від них немає стрілок ні до `view`, ні до сторінки. Їх перевіряють, просто викликавши."
            en: "The domain functions get everything as parameters: no arrows lead from them to `view` or to the page. They are checked by simply calling them."
        - highlight: [render, domAfter, to-render, draws-after]
          dim: [tangled, viewBefore, domBefore, reads-before, draws-before, visible, summary, to-visible, to-summary]
          caption:
            uk: "`renderSummary` лише малює підсумок, який отримала. Вона не рахує, тож не може порахувати інакше, ніж домен."
            en: "`renderSummary` only draws the summary it was given. It does not count, so it cannot count differently from the domain."
        - caption:
            uk: "До цієї форми дійшли кроками — винести предикат, винести підрахунок, винести рендер, передати пошук параметром — і після кожного кроку характеризаційні тести лишалися зеленими."
            en: "This shape was reached in steps — extract the predicate, extract the counting, extract the render, pass the search as a parameter — and after every step the characterization tests stayed green."

  - id: refactor-steps
    kind: example
    runtime: browser-js
    dir: refactor-steps
    entry: index.js
    strings:
      expenses: { uk: "витрат", en: "expenses" }
      total: { uk: "Разом", en: "Total" }
      currency: { uk: "грн", en: "UAH" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      lunch: { uk: "Обід", en: "Lunch" }
      tAll: { uk: "усі категорії", en: "all categories" }
      tFood: { uk: "лише їжа", en: "food only" }
      tEmpty: { uk: "порожній список", en: "an empty list" }
      tRounding: { uk: "845,50 округлюється до 846", en: "845.50 rounds to 846" }
      mShown: { uk: "що показує звіт", en: "what the report shows" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Малі кроки під захистом тестів"
      en: "Small steps under the tests’ protection"
    body:
      uk: |
        `report.js` — та сама заплутана `renderReport`. `report.test.js` — характеризаційні тести: вони фіксують, що звіт показує сьогодні, навіть дивне округлення 845,50 → 846. Запуск виконує тести: усі чотири зелені.

        Тепер змінюй `report.js` малими кроками й запускай після кожного.
      en: |
        `report.js` holds the same tangled `renderReport`. `report.test.js` holds characterization tests: they pin what the report shows today, even the odd rounding 845.50 → 846. A run runs the tests: all four are green.

        Now change `report.js` in small steps and run after each one.
    tryIt:
      uk: |
        1. **Винести предикат.** Над `renderReport` напиши `const isShown = (e) => view.category === "all" || e.category === view.category;` і заміни обидві повторені умови на `isShown(e)`. Запусти: усе зелене.
        2. **Винести підрахунок.** Напиши чисту функцію `function totalOf(shown) { … }`, яка повертає суму `amountMinor` (почни з `0`), і в `renderReport` бери суму з неї. Запусти.
        3. **Спробуй «покращити».** Заміни `Math.round(total / 100)` на `(total / 100).toFixed(2)`. Запусти: тести червоні. Це не рефакторинг, а зміна поведінки — відкоти її. Якщо копійки справді потрібні, це окреме рішення з оновленим тестом.
        4. **Передати стан параметром.** Додай `renderReport` третій параметр `category = view.category` і використовуй його в `isShown`. Старі виклики працюють як раніше.
      en: |
        1. **Extract a predicate.** Above `renderReport`, write `const isShown = (e) => view.category === "all" || e.category === view.category;` and replace both repeated conditions with `isShown(e)`. Run: everything is green.
        2. **Extract the counting.** Write a pure function `function totalOf(shown) { … }` that returns the sum of `amountMinor` (start from `0`), and take the total from it in `renderReport`. Run.
        3. **Try to “improve”.** Replace `Math.round(total / 100)` with `(total / 100).toFixed(2)`. Run: the tests are red. That is not refactoring but a behavior change — revert it. If kopiykas really are needed, that is a separate decision with an updated test.
        4. **Pass the state as a parameter.** Give `renderReport` a third parameter `category = view.category` and use it in `isShown`. The old calls work as before.

  - id: one-way
    kind: explanation
    title:
      uk: "Чистий інтерфейс — це вхід, вихід і нічого прихованого"
      en: "A clean interface is an input, an output and nothing hidden"
    body:
      uk: |
        Після рефакторингу в модулів чіткі межі:

        - **домен** (`domain/…`) — чисті функції: усе потрібне приходить параметрами, результат — значення. Ні сторінки, ні глобального стану, тож їх перевіряють простим викликом;
        - **рендер** (`ui/…`) — малює те, що отримав, і нічого не рахує;
        - **край** (`page`) — єдине місце, що читає стан сторінки й з’єднує частини.

        Типи з TypeScript роблять інтерфейс видимим: `visibleHabits(habits: readonly Habit[], query: string): Habit[]` каже все без читання тіла. Спільні типи лежать в окремому `types.ts`, а модулі беруть їх через `import type`. Пісочниця прибирає типи перед запуском і не перевіряє їх — перевіряти їх буде компілятор `tsc` у твоєму експортованому проєкті.
      en: |
        After the refactoring the modules have clear boundaries:

        - the **domain** (`domain/…`) — pure functions: everything needed arrives as parameters, the result is a value. No page and no global state, so they are checked with a plain call;
        - the **render** (`ui/…`) — draws what it was given and counts nothing;
        - the **edge** (`page`) — the only place that reads the page’s state and connects the parts.

        TypeScript types make the interface visible: `visibleHabits(habits: readonly Habit[], query: string): Habit[]` tells everything without reading the body. Shared types live in a separate `types.ts`, and modules take them with `import type`. The sandbox removes the types before running and does not check them — the `tsc` compiler will check them in your exported project.

  - id: recall-type-imports
    kind: review
    title:
      uk: "Пригадай: імпорт лише типів"
      en: "Recall: importing only types"
    items:
      - id: type-import-erased
        from: js-14-07-modules-type-imports
        prompt:
          uk: "`domain/summary.ts` починається з `import type { Habit, HabitSummary } from \"../types.ts\";`. Що лишиться від цього рядка в JavaScript, який реально виконається?"
          en: "`domain/summary.ts` starts with `import type { Habit, HabitSummary } from \"../types.ts\";`. What is left of this line in the JavaScript that actually runs?"
        answer:
          type: choice
          options:
            - id: nothing
              text:
                uk: "Нічого: імпорт лише типів повністю зникає разом із типами"
                en: "Nothing: a type-only import disappears completely together with the types"
            - id: runtime-import
              text:
                uk: "Звичайний `import`, який завантажить `types.ts` під час виконання"
                en: "A normal `import` that loads `types.ts` at run time"
              why:
                uk: "Саме цього `import type` і уникає: у `types.ts` немає значень, тож і завантажувати під час виконання нічого."
                en: "That is exactly what `import type` avoids: `types.ts` has no values, so there is nothing to load at run time."
            - id: objects
              text:
                uk: "Два порожні об’єкти `Habit` і `HabitSummary`"
                en: "Two empty objects `Habit` and `HabitSummary`"
              why:
                uk: "Інтерфейси й типи існують лише під час перевірки: у JavaScript для них немає жодного значення."
                en: "Interfaces and types exist only while checking: there is no value for them in JavaScript."
          correct: [nothing]
        explanation:
          uk: "Типи стираються перед запуском, і `import type` стирається разом із ними. Тому модулі можуть ділити типи, не створюючи залежностей під час виконання: стрілки на діаграмі «після» стосуються лише справжніх значень — функцій."
          en: "Types are erased before running, and `import type` is erased with them. That is why modules can share types without creating run-time dependencies: the arrows on the “after” diagram are about real values only — functions."

