    title:
      uk: "Три модулі з однієї функції"
      en: "Three modules out of one function"
    instructions:
      uk: |
        `showSummary` у `page.ts` фільтрує звички за пошуком, рахує підсумок і малює його — усе разом і з прихованим станом `view`. `habits.test.js` — характеризаційні тести; вони зелені й мають такими лишитися.

        Розбери функцію на три модулі, кроками й запускаючи тести після кожного:

        1. `domain/visible.ts`: `visibleHabits(habits, query)` — активні звички, у назві яких є `query`, без огляду на регістр.
        2. `domain/summary.ts`: `summarizeHabits(habits, today)` — `HabitSummary` отриманих звичок: `count`, `doneToday`, `completions`.
        3. `ui/render.ts`: `renderSummary(root, summary, habits)` — малює заголовок, рядок підсумку й список назв, як зараз. Лише малює.
        4. `showSummary` лишається в `page.ts`, читає `view` і лише з’єднує три функції.

        Напиши типи параметрів і результату (типи — у `types.ts`, бери їх через `import type`). Поведінка сторінки не змінюється — зокрема дивацтва, які зафіксовано в тестах. Одна перевірка рахує, скільки елементів сторінки створюють доменні функції: їх має бути нуль. Перевірки бачать лише поведінку: типи пісочниця прибирає перед запуском, тож їх перевірить `tsc` у твоєму експортованому проєкті.
      en: |
        `showSummary` in `page.ts` filters habits by the search, counts a summary and draws it — all together and with the hidden state `view`. `habits.test.js` holds characterization tests; they are green and must stay that way.

        Split the function into three modules, in steps, running the tests after each:

        1. `domain/visible.ts`: `visibleHabits(habits, query)` — the active habits whose name contains `query`, regardless of letter case.
        2. `domain/summary.ts`: `summarizeHabits(habits, today)` — the `HabitSummary` of the habits it gets: `count`, `doneToday`, `completions`.
        3. `ui/render.ts`: `renderSummary(root, summary, habits)` — draws the heading, the summary line and the list of names, as now. It only draws.
        4. `showSummary` stays in `page.ts`, reads `view` and only connects the three functions.

        Write the types of the parameters and the result (the types are in `types.ts`; take them with `import type`). The page’s behavior does not change — including the quirks pinned by the tests. One check counts how many page elements the domain functions create: there must be none. The checks see only behavior: the sandbox removes the types before the run, so `tsc` will check them in your exported project.
    testTitles:
      "the page shows exactly what it showed before the refactoring":
        uk: "Сторінка показує рівно те, що й до рефакторингу"
        en: "The page shows exactly what it showed before the refactoring"
      "visibleHabits keeps the active habits whose name contains the query, in any letter case":
        uk: "`visibleHabits` лишає активні звички з `query` в назві, без огляду на регістр"
        en: "`visibleHabits` keeps the active habits whose name contains the query, in any letter case"
      "visibleHabits uses its query parameter, not view":
        uk: "`visibleHabits` бере параметр `query`, а не `view`"
        en: "`visibleHabits` uses its `query` parameter, not `view`"
      "summarizeHabits counts the habits it receives for the given day":
        uk: "`summarizeHabits` рахує отримані звички для заданого дня"
        en: "`summarizeHabits` counts the habits it receives for the given day"
      "renderSummary draws the summary it is given":
        uk: "`renderSummary` малює саме той підсумок, який отримала"
        en: "`renderSummary` draws the summary it is given"
      "the domain functions do not touch the page":
        uk: "Доменні функції не торкаються сторінки"
        en: "The domain functions do not touch the page"
      "your characterization tests in habits.test.js are still green":
        uk: "Характеризаційні тести з `habits.test.js` досі зелені"
        en: "The characterization tests in `habits.test.js` are still green"
    hints:
      nudge:
        uk: "Почни з повтореної умови: вона стоїть у `showSummary` двічі (а в третьому місці — з додатковою частиною). Це майбутнє тіло `visibleHabits`."
        en: "Start with the repeated condition: it appears in `showSummary` twice (and a third time with an extra part). That is the future body of `visibleHabits`."
      explanation:
        uk: "Так переїжджають, не зупиняючи кафе: спершу виносять одну шафу й перевіряють, що кухня працює, потім наступну. Перший крок — функція видимих звичок, якій пошук приходить параметром; `showSummary` викликає її з `view.query`, а цикли далі йдуть уже лише видимими звичками — тож умова в них зникає. Другий крок — підрахунок: він отримує вже відфільтровані звички й день, а повертає об’єкт із трьома числами. Третій — рендер: копія коду малювання, яка бере числа з підсумку, а не рахує їх. Між кроками запускай тести. Не «виправляй» пошук: пробіл у кінці тести фіксують навмисно."
        en: "This is how you move house without closing the café: first move one cupboard and check that the kitchen still works, then the next one. The first step is a function of visible habits that gets the search as a parameter; `showSummary` calls it with `view.query`, and the loops then walk only the visible habits — so the condition disappears from them. The second step is the counting: it gets the already filtered habits and the day and returns an object with three numbers. The third is the render: a copy of the drawing code that takes the numbers from the summary instead of counting them. Run the tests between steps. Do not “fix” the search: the tests pin the trailing space on purpose."
    solutionNote:
      uk: "Повторена умова стала `visibleHabits` (запах — повторена умова), підрахунок — `summarizeHabits`, малювання — `renderSummary` (довга функція), а `view` читає лише край, `showSummary` (прихований стан). Домен перевіряється простим викликом і не залежить від сторінки, рендер не може «порахувати інакше». Дивацтво з пробілом лишилося: якщо його колись виправлять, це буде окрема зміна з новим тестом. Типи пісочниця прибирає, не перевіряючи, — у VS Code чи `tsc` вони стануть перевіркою інтерфейсів."
      en: "The repeated condition became `visibleHabits` (smell: a duplicated condition), the counting `summarizeHabits` and the drawing `renderSummary` (a long function), and only the edge, `showSummary`, reads `view` (hidden state). The domain is checked with a plain call and does not depend on the page, and the render cannot “count differently”. The trailing-space quirk stayed: if it is fixed one day, that will be a separate change with a new test. The sandbox removes the types without checking them — in VS Code or `tsc` they become a check of the interfaces."
    feedback:
      - when: { test: "the page shows exactly what it showed before the refactoring" }
        message:
          uk: "Ця перевірка викликає `showSummary` з порожнім пошуком, з «ЧИТАТИ» і з «воду » (з пробілом у кінці) і порівнює показане з тим, що було до рефакторингу. Якщо розходиться лише останній випадок, пошук тепер відкидає пробіли — це зміна поведінки."
          en: "This check calls `showSummary` with an empty search, with “READ” and with “water ” (with a trailing space) and compares what is shown with what was shown before the refactoring. If only the last case differs, the search now drops spaces — that is a behavior change."
      - when: { test: "visibleHabits keeps the active habits whose name contains the query, in any letter case" }
        message:
          uk: "Ця перевірка чекає від `visibleHabits(HABITS, \"\")` звички `h-01`, `h-02`, `h-03`, `h-04`, `h-06`, для «ЧИТАТИ» — лише `h-02`, а для «слова» — нічого, бо ця звичка на паузі. Якщо пише `type of the visibleHabits export of domain/visible.ts: expected \"undefined\" to be \"function\"`, з `domain/visible.ts` ще не експортовано `visibleHabits`."
          en: "This check expects `h-01`, `h-02`, `h-03`, `h-04`, `h-06` from `visibleHabits(HABITS, \"\")`, only `h-02` for “READ”, and nothing for “words”, because that habit is paused. If it says `type of the visibleHabits export of domain/visible.ts: expected \"undefined\" to be \"function\"`, `domain/visible.ts` does not export `visibleHabits` yet."
      - when: { test: "visibleHabits uses its query parameter, not view" }
        message:
          uk: "Ця перевірка ставить `view.query` у `\"zzz\"` і викликає `visibleHabits(HABITS, \"\")`: має повернутися п’ять активних звичок. Якщо нуль, функція досі читає прихований `view`."
          en: "This check sets `view.query` to `\"zzz\"` and calls `visibleHabits(HABITS, \"\")`: five active habits must come back. If none do, the function still reads the hidden `view`."
      - when: { test: "summarizeHabits counts the habits it receives for the given day" }
        message:
          uk: "Ця перевірка чекає для активних звичок і дня `2026-03-01` `{ count: 5, doneToday: 4, completions: 9 }`, для `2026-02-28` — `doneToday: 2`, а для порожнього списку — три нулі. Функція рахує саме отримані звички й саме переданий день."
          en: "This check expects `{ count: 5, doneToday: 4, completions: 9 }` for the active habits and the day `2026-03-01`, `doneToday: 2` for `2026-02-28`, and three zeros for an empty list. The function counts exactly the habits it gets and exactly the day passed in."
      - when: { test: "renderSummary draws the summary it is given" }
        message:
          uk: "Ця перевірка дає `renderSummary` вигаданий підсумок (42, 7, 99) і одну звичку й чекає, що на сторінці будуть саме ці числа. Якщо з’являються інші, рендер рахує сам замість малювати отримане."
          en: "This check gives `renderSummary` a made-up summary (42, 7, 99) and one habit and expects exactly these numbers on the page. If other numbers appear, the render counts by itself instead of drawing what it got."
      - when: { test: "the domain functions do not touch the page" }
        message:
          uk: "Ця перевірка рахує елементи, які створюють `visibleHabits` і `summarizeHabits`, і чекає нуль — навіть тимчасовий елемент, щоб «прочитати текст так, як його покаже сторінка». Створення елементів належить `ui/render.ts`."
          en: "This check counts the elements created by `visibleHabits` and `summarizeHabits` and expects zero — even a temporary element used to “read the text the way the page shows it”. Creating elements belongs to `ui/render.ts`."
      - when: { test: "your characterization tests in habits.test.js are still green" }
        message:
          uk: "Ця перевірка ще раз запускає тести з `habits.test.js` і чекає, що жоден не впаде. Консоль після запуску показує, який саме тест червоний."
          en: "This check runs the tests from `habits.test.js` once more and expects none to fail. After a run, the console shows which test is red."
      - when: { error: SyntaxError }
        message:
          uk: "Якщо картка каже «Код не вдалося запустити», найчастіше в одному з `.ts` файлів бракує дужки або неправильно записано тип. Імпорти пиши з розширенням: `../types.ts`, `./domain/visible.ts`."
          en: "If the card says “The code could not start”, most often one of the `.ts` files is missing a bracket or a type is written incorrectly. Write imports with the extension: `../types.ts`, `./domain/visible.ts`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-17
    body:
      uk: "У кроці проєкту ти заміниш квадратичне перетворення індексованим **за тим самим підписом функції** — це теж рефакторинг: спершу характеризаційний тест на старій версії, потім заміна, потім той самий тест зелений."
      en: "In the project step you will replace a quadratic transform with an indexed one **behind the same function signature** — that is refactoring too: first a characterization test on the old version, then the replacement, then the same test green."
