id: js-17-03-bounded-recursion
unit: JS-17
title:
  uk: "Обмежена рекурсія"
  en: "Bounded recursion"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити найбільшу глибину викликів рекурсивного обходу для заданих даних і місце, де з’явиться RangeError через переповнений стек викликів."
    en: "Predict the maximum call depth of a recursive walk for a given input and where a RangeError for an exceeded call stack appears."
  - uk: "Обмежити рекурсію межею глибини й виявленням циклів або переписати її з явним стеком, і пояснити, коли що доречно."
    en: "Bound a recursion with a depth limit and cycle detection, or convert it to an explicit stack, and explain when each choice fits."
prerequisites: [js-17-02-big-o-measured, js-03-08-recursion-base-case]
subskills:
  - { family: J-13, skill: "bounded recursion", depth: intro }
glossary: [depth-limit, cycle-detection, explicit-stack]
selfCheck: [predict-three-inputs, flatten-categories]

blocks:
  - id: one-frame-per-level
    kind: explanation
    title:
      uk: "Один рівень — один кадр"
      en: "One level, one frame"
    body:
      uk: |
        Кожен рекурсивний виклик кладе на [[call-stack|стек викликів]] новий кадр, і той лежить там, доки виклик не поверне результат. Тож найбільша кількість кадрів одночасно дорівнює **глибині** даних: для дерева з трьох рівнів — три кадри, для ланцюжка з 100 000 вкладених категорій — сто тисяч.

        Стек викликів не безрозмірний. Коли кадрів стає забагато, рушій кидає `RangeError: Maximum call stack size exceeded` — це [[stack-overflow|переповнення стеку]]. У Chrome у цій пісочниці ми виміряли кілька тисяч рівнів: від 4 100 до 4 600 для функції з прикладу нижче й близько 10 000–12 000 для порожньої. Число залежить від розміру кадру й рушія і навіть між двома запусками трохи різне, тож закладатися на нього не можна.

        Тести на десяти записах цього не покажуть: глибина — властивість даних, а не коду.
      en: |
        Every recursive call puts a new frame on the [[call-stack]], and it stays there until the call returns. So the largest number of frames at the same time equals the **depth** of the data: three frames for a tree of three levels, a hundred thousand for a chain of 100,000 nested categories.

        The call stack is not endless. When there are too many frames, the engine throws `RangeError: Maximum call stack size exceeded` — a [[stack-overflow]]. In Chrome in this sandbox we measured a few thousand levels: 4,100 to 4,600 for the function in the example below and about 10,000–12,000 for an empty one. The number depends on the frame size and the engine and even differs a little between two runs, so you cannot rely on it.

        Tests on ten records will not show this: depth is a property of the data, not of the code.

  - id: predict-three-inputs
    kind: prediction
    prompt:
      uk: "Рекурсивна `countNodes` рахує вузли дерева категорій. Її запускають на ланцюжку з 10 рівнів, на ланцюжку зі 100 000 рівнів і на дереві, де дитина вказує назад на корінь. Кожен виклик загорнуто в `try`/`catch`. Що виведе консоль?"
      en: "The recursive `countNodes` counts the nodes of a category tree. It runs on a chain of 10 levels, on a chain of 100,000 levels and on a tree in which a child points back to the root. Every call is wrapped in `try`/`catch`. What does the console print?"
    code: |
      function makeChain(levels) {
        let node = { id: "c-" + levels, children: [] };
        for (let i = levels - 1; i >= 1; i--) {
          node = { id: "c-" + i, children: [node] };
        }
        return node;
      }

      function countNodes(node) {
        let total = 1;
        for (const child of node.children) {
          total = total + countNodes(child);
        }
        return total;
      }

      const looped = makeChain(3);
      looped.children[0].children[0].children.push(looped); // c-3 → c-1

      for (const root of [makeChain(10), makeChain(100000), looped]) {
        try {
          console.log(countNodes(root));
        } catch (error) {
          console.log(error.name);
        }
      }
    verify:
      logs: ["10", "RangeError", "RangeError"]
    answer:
      type: choice
      options:
        - id: overflow-twice
          text:
            uk: "`10`, `RangeError`, `RangeError`"
            en: "`10`, `RangeError`, `RangeError`"
        - id: long-works
          text:
            uk: "`10`, `100000`, `RangeError`"
            en: "`10`, `100000`, `RangeError`"
          why:
            uk: "Код правильний, але глибина 100 000 потребує 100 000 кадрів одночасно — у Chrome стек викликів закінчується значно раніше, за кілька тисяч."
            en: "The code is correct, but a depth of 100,000 needs 100,000 frames at once — in Chrome the call stack runs out much earlier, after a few thousand."
        - id: loop-hangs
          text:
            uk: "`10`, `RangeError`, а на дереві з циклом програма зависає, доки платформа її не зупинить"
            en: "`10`, `RangeError`, and on the tree with a cycle the program hangs until the platform stops it"
          why:
            uk: "Зависає нескінченний **цикл**. Нескінченна **рекурсія** щоразу додає кадр, тож швидко впирається в межу стеку й падає з тією самою `RangeError`."
            en: "An endless **loop** hangs. An endless **recursion** adds a frame every time, so it soon hits the stack limit and fails with the same `RangeError`."
        - id: base-case-saves
          text:
            uk: "`10`, `100000`, `3`: у кожного ланцюжка є кінець, і базовий випадок його знайде"
            en: "`10`, `100000`, `3`: every chain has an end, and the base case will find it"
          why:
            uk: "У дереві з циклом кінця немає: після `c-3` знову йде `c-1`. Базовий випадок (вузол без дітей) так і не настає."
            en: "The tree with a cycle has no end: after `c-3` comes `c-1` again. The base case (a node without children) never comes."
      correct: [overflow-twice]
    explanation:
      uk: "Ланцюжок із 10 рівнів — 10 кадрів, усе гаразд. Сто тисяч рівнів — сто тисяч кадрів одночасно, а стек викликів закінчується за кілька тисяч: `RangeError`. У дереві з циклом `c-3` знову веде до `c-1`, вузла без дітей не буде ніколи, і рекурсія падає з тією самою помилкою. Базовий випадок гарантує зупинку лише тоді, коли дані справді скінченні й неглибокі."
      en: "A chain of 10 levels is 10 frames, all fine. A hundred thousand levels is a hundred thousand frames at once, while the call stack runs out after a few thousand: `RangeError`. In the tree with a cycle `c-3` leads back to `c-1`, a node without children never comes, and the recursion fails with the same error. A base case guarantees a stop only when the data really is finite and shallow."

  - id: depth-trace
    kind: visual
    visual: code-trace
    title:
      uk: "Стек викликів росте з глибиною — або лишається пласким"
      en: "The call stack grows with depth — or stays flat"
    textEquivalent:
      uk: "Ланцюжок із чотирьох категорій c-1, c-2, c-3, c-4 обходять двічі. Рекурсивна countNodes викликає себе для кожної дитини: коли вона доходить до c-4, у стеку викликів чотири кадри countNodes, а параметр depth дорівнює 4. Потім виклики повертають 1, 2, 3 і 4, і кадри зникають по одному. countWithStack робить те саме циклом: вузли, до яких ще не дійшли, чекають у масиві stack (у ланцюжку — щоразу не більше одного), а в стеку викликів увесь час лише один кадр countWithStack — хоч на чотирьох рівнях, хоч на ста тисячах. Обидві функції повертають 4, консоль показує 4 4. Справжні 100 000 рівнів тут не показано: покрокове виконання обмежене кількома сотнями кроків."
      en: "A chain of four categories c-1, c-2, c-3, c-4 is walked twice. The recursive countNodes calls itself for every child: when it reaches c-4, the call stack holds four countNodes frames and the depth parameter is 4. Then the calls return 1, 2, 3 and 4, and the frames disappear one by one. countWithStack does the same with a loop: the nodes not reached yet wait in the stack array (in a chain, never more than one), and the call stack holds only one countWithStack frame all the time — whether there are four levels or a hundred thousand. Both functions return 4, and the console shows 4 4. The real 100,000 levels are not shown here: a step-through is limited to a few hundred steps."
    spec:
      file: visuals/depth.js
      steps: captioned
      captions:
        - at: { line: 27 }
          text:
            uk: "Ланцюжок із чотирьох рівнів. Спершу — рекурсивний обхід."
            en: "A chain of four levels. First, the recursive walk."
        - at: { line: 6, hit: 1 }
          text:
            uk: "Перший виклик: `depth` — `1`, у стеку викликів один кадр `countNodes` над кадром модуля."
            en: "The first call: `depth` is `1`, the call stack holds one `countNodes` frame above the module’s frame."
        - at: { line: 6, hit: 3 }
          text:
            uk: "`depth` — `3`: три кадри `countNodes` одночасно. Перші два чекають, доки повернеться третій."
            en: "`depth` is `3`: three `countNodes` frames at once. The first two wait until the third returns."
        - at: { line: 6, hit: 4 }
          text:
            uk: "Найглибший вузол `c-4`: чотири кадри. На ланцюжку зі 100 000 рівнів їх мало б бути сто тисяч — стек викликів закінчився б задовго до того."
            en: "The deepest node `c-4`: four frames. A chain of 100,000 levels would need a hundred thousand — the call stack would run out long before that."
        - at: { line: 10, kind: return, hit: 1 }
          text:
            uk: "`c-4` не має дітей — базовий випадок: повертається `1`, і верхній кадр зникне."
            en: "`c-4` has no children — the base case: `1` is returned, and the top frame is about to go."
        - at: { line: 10, kind: return, hit: 4 }
          text:
            uk: "Перший виклик повертає `4`. Стек викликів спорожнів так само, як заповнювався, — по кадру на рівень."
            en: "The first call returns `4`. The call stack emptied the same way it filled up — one frame per level."
        - at: { line: 19, hit: 1 }
          text:
            uk: "Тепер **явний стек**: вузли чекають у масиві `stack`, а в стеку викликів лише кадр `countWithStack`."
            en: "Now an **explicit stack**: the nodes wait in the `stack` array, and the call stack holds only the `countWithStack` frame."
        - at: { line: 19, hit: 4 }
          text:
            uk: "Четвертий вузол — а стек викликів досі плаский: той самий один кадр. У масиві `stack` чекають лише вузли, до яких ще не дійшли; тут це щоразу не більше одного, бо в ланцюжку в кожного вузла одна дитина. Межа стеку викликів йому не загрожує."
            en: "The fourth node — and the call stack is still flat: the same single frame. The `stack` array holds only the nodes not reached yet; here that is never more than one, because every node of the chain has one child. The call stack’s limit does not threaten it."
        - at: { line: 29, kind: end }
          text:
            uk: "Консоль: `4 4`. Результат однаковий, різниця — де чекають рівні, яких ще не пройдено."
            en: "The console: `4 4`. The result is the same; the difference is where the unvisited levels wait."

  - id: three-inputs
    kind: example
    runtime: browser-js
    dir: three-inputs
    entry: index.js
    strings:
      nodes: { uk: "вузлів", en: "nodes" }
      depth: { uk: "найбільша глибина", en: "deepest level" }
      short: { uk: "10 рівнів:", en: "10 levels:" }
      long: { uk: "100 000 рівнів:", en: "100,000 levels:" }
      loop: { uk: "з циклом:", en: "with a cycle:" }
    title:
      uk: "Три входи для однієї функції"
      en: "Three inputs for one function"
    body:
      uk: |
        `countNodes` тепер ще й запам’ятовує в `deepest` найбільшу глибину, до якої дійшла. Запусти: для кожного входу консоль покаже або кількість вузлів, або помилку й глибину, на якій закінчився стек викликів.
      en: |
        `countNodes` now also remembers in `deepest` the largest depth it reached. Run it: for each input the console shows either the number of nodes, or the error and the depth at which the call stack ran out.
    tryIt:
      uk: |
        1. Додай `countNodes` третій параметр `maxDepth` (і передавай його в рекурсивний виклик та з `tryCount`, наприклад `50`). На початку функції, якщо `depth` більша за `maxDepth`, кинь `RangeError` з повідомленням, де є `node.id`. Запусти: тепер довгий ланцюжок і цикл падають **твоєю** зрозумілою помилкою, щойно проходять 50 рівнів, а не загадковим переповненням.
        2. Допиши під `countNodes` версію з явним стеком і викликай її в `tryCount` замість рекурсивної:

           ```js
           function countWithStack(root) {
             let total = 0;
             const stack = [root];
             while (stack.length > 0) {
               const node = stack.pop();
               total = total + 1;
               for (const child of node.children) {
                 stack.push(child);
               }
             }
             return total;
           }
           ```

           Довгий ланцюжок тепер дає `100000`. А дерево з циклом крутиться без кінця: приблизно за 2 секунди платформа зупинить цикл із `LoopBudgetError`. Цю помилку перехоплює `catch` у `tryCount`, тож вона з’явиться звичайним рядком консолі. «Найбільша глибина» в усіх трьох рядках тепер `0`: нова функція не оновлює `deepest`, бо їй більше не треба рахувати рівні. Явний стек прибирає межу глибини, але не захищає від циклу.
      en: |
        1. Give `countNodes` a third parameter `maxDepth` (pass it to the recursive call and from `tryCount`, say `50`). At the start of the function, if `depth` is greater than `maxDepth`, throw a `RangeError` with a message that contains `node.id`. Run it: now the long chain and the cycle fail with **your** clear error as soon as they pass 50 levels, instead of a puzzling overflow.
        2. Add a version with an explicit stack under `countNodes` and call it in `tryCount` instead of the recursive one:

           ```js
           function countWithStack(root) {
             let total = 0;
             const stack = [root];
             while (stack.length > 0) {
               const node = stack.pop();
               total = total + 1;
               for (const child of node.children) {
                 stack.push(child);
               }
             }
             return total;
           }
           ```

           The long chain now gives `100000`. And the tree with a cycle spins forever: after about 2 seconds the platform stops the loop with `LoopBudgetError`. The `catch` in `tryCount` catches that error, so it appears as an ordinary console line. The “deepest level” in all three lines is now `0`: the new function does not update `deepest`, because it no longer needs to count levels. An explicit stack removes the depth limit, but does not protect against a cycle.

  - id: three-safeguards
    kind: explanation
    title:
      uk: "Три запобіжники і коли який"
      en: "Three safeguards and when to use which"
    body:
      uk: |
        | Запобіжник | Що робить | Коли доречний |
        |---|---|---|
        | [[depth-limit\|межа глибини]] | кидає зрозумілу помилку, щойно рівень більший за `maxDepth` | дані від людини чи з файлу, а розумна глибина відома: категорії рідко глибші за 10 рівнів |
        | [[cycle-detection\|виявлення циклу]] | пам’ятає в `Set` `id` уже відвіданих вузлів; у дереві, де в кожного вузла один батько, повтор означає посилання назад — цикл | дані можуть посилатися назад: імпортований JSON, записи з `parentId` |
        | [[explicit-stack\|явний стек]] | тримає вузли, що чекають, у масиві замість стеку викликів | глибина законно велика — довгий ланцюжок версій чи коментарів |

        Межа глибини й виявлення циклу доповнюють одне одного: межа ловить надто глибокі дані, а `Set` відрізняє цикл від глибини й називає вузол, де дані зациклилися. Явний стек не замінює жодного з них — ти щойно бачив, як він крутиться на циклі.
      en: |
        | Safeguard | What it does | When it fits |
        |---|---|---|
        | [[depth-limit]] | throws a clear error as soon as the level is greater than `maxDepth` | data from a person or a file, with a known reasonable depth: categories are rarely deeper than 10 levels |
        | [[cycle-detection]] | remembers the `id`s of visited nodes in a `Set`; in a tree, where every node has one parent, a repeat means a link back — a cycle | the data can point back: imported JSON, records with a `parentId` |
        | [[explicit-stack]] | keeps the waiting nodes in an array instead of the call stack | the depth is legitimately large — a long chain of versions or comments |

        A depth limit and cycle detection complement each other: the limit catches data that is too deep, and the `Set` tells a cycle from depth and names the node where the data loops. An explicit stack replaces neither — you have just seen it spin on a cycle.

  - id: recall-seen-set
    kind: review
    title:
      uk: "Пригадай: Set для вже побаченого"
      en: "Recall: a Set for what was already seen"
    items:
      - id: set-of-objects
        from: js-12-11-map-set
        prompt:
          uk: "Програма запам’ятовує відвідані категорії в `Set`, але кладе туди **копії** вузлів. Що виведе консоль?"
          en: "The program remembers visited categories in a `Set`, but puts **copies** of the nodes into it. What does the console print?"
        code: |
          const cafe = { id: "k-cafe" };
          const seen = new Set();
          seen.add({ ...cafe });
          console.log(seen.has(cafe), seen.has("k-cafe"), seen.size);
        verify:
          logs: ["false false 1"]
        answer:
          type: choice
          options:
            - id: identity
              text:
                uk: "`false false 1`"
                en: "`false false 1`"
            - id: by-content
              text:
                uk: "`true false 1`"
                en: "`true false 1`"
              why:
                uk: "`Set` порівнює об’єкти за тотожністю, а не за вмістом: копія — інший об’єкт, хоч поля ті самі."
                en: "A `Set` compares objects by identity, not by content: a copy is a different object, even with the same fields."
            - id: by-id
              text:
                uk: "`true true 1`"
                en: "`true true 1`"
              why:
                uk: "`Set` не заглядає всередину об’єктів: рядок `\"k-cafe\"` і об’єкт з полем `id` — різні значення."
                en: "A `Set` does not look inside objects: the string `\"k-cafe\"` and an object with an `id` field are different values."
          correct: [identity]
        explanation:
          uk: "`Set` порівнює значення за правилом SameValueZero — майже як `===`: об’єкти — за тотожністю. Тому для виявлення циклу надійніше класти в `Set` **`id`** — текст, який однаковий для того самого запису, хоч би звідки ти до нього дійшов."
          en: "A `Set` compares values by the SameValueZero rule — almost like `===`: objects by identity. That is why for cycle detection it is more reliable to put the **`id`** into the `Set` — text that is the same for the same record, however you reached it."

  - id: flatten-categories
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: flatten-categories
    entry: index.js
    strings:
      all: { uk: "Усі витрати", en: "All spending" }
      food: { uk: "Їжа", en: "Food" }
      groceries: { uk: "Продукти", en: "Groceries" }
      cafe: { uk: "Кафе", en: "Cafe" }
      fun: { uk: "Розваги", en: "Fun" }
      cinema: { uk: "Кіно", en: "Cinema" }
      home: { uk: "Дім", en: "Home" }
      other: { uk: "Інше", en: "Other" }
      tooDeep: { uk: "Категорія глибша за дозволену кількість рівнів:", en: "A category is deeper than the allowed number of levels:" }
      cycle: { uk: "Категорію вже відвідано, у дереві цикл:", en: "This category was already visited, the tree has a cycle:" }
    title:
      uk: "Плаский список категорій із запобіжниками"
      en: "A flat list of categories with safeguards"
    instructions:
      uk: |
        Допиши `flattenCategories(tree, maxDepth)`. Вона повертає всі категорії дерева в порядку обходу **углиб** як записи `{ id, name, level }`; корінь — рівень 1. Дерево вона не змінює.

        Два запобіжники:

        1. Категорія глибша за `maxDepth` — кинь `RangeError`, у повідомленні якого є `id` цієї категорії.
        2. Категорія з `id`, який уже траплявся, — це цикл: кинь `Error` (саме `Error`, не `RangeError`), у повідомленні якого є цей `id`.

        `id` у дереві унікальні, а назви можуть повторюватися: «Інше» є і в категорії «Розваги», і в категорії «Дім». Можна писати рекурсією або з явним стеком.
      en: |
        Finish `flattenCategories(tree, maxDepth)`. It returns every category of the tree in **depth-first** order as records `{ id, name, level }`; the root is level 1. It does not change the tree.

        Two safeguards:

        1. A category deeper than `maxDepth` — throw a `RangeError` whose message contains that category’s `id`.
        2. A category whose `id` has already appeared is a cycle: throw an `Error` (exactly `Error`, not `RangeError`) whose message contains that `id`.

        The `id`s in the tree are unique, while names may repeat: “Other” is under both the “Fun” and the “Home” category. You may write it with recursion or with an explicit stack.
    testTitles:
      "lists every category depth-first with its level":
        uk: "Перелічує всі категорії вглиб із їхніми рівнями"
        en: "Lists every category depth-first with its level"
      "a single category gives one entry":
        uk: "Одна категорія дає один запис"
        en: "A single category gives one entry"
      "a tree exactly maxDepth levels deep is accepted":
        uk: "Дерево рівно з `maxDepth` рівнів проходить без помилки"
        en: "A tree exactly `maxDepth` levels deep is accepted"
      "one level past maxDepth throws a RangeError naming that category":
        uk: "На рівень глибше за `maxDepth` — `RangeError` з `id` цієї категорії"
        en: "One level past `maxDepth` throws a `RangeError` naming that category"
      "a cycle throws an Error naming the repeated category":
        uk: "Цикл — `Error` з `id` категорії, що повторилася"
        en: "A cycle throws an `Error` naming the repeated category"
      "two categories with the same name are not a cycle":
        uk: "Дві категорії з однаковою назвою — не цикл"
        en: "Two categories with the same name are not a cycle"
      "the tree is not changed":
        uk: "Дерево лишається незмінним"
        en: "The tree is not changed"
    hints:
      nudge:
        uk: "Розбий на дві частини: внутрішня функція `visit(category, level)` обходить дерево, а зовнішня створює список результатів і `Set` побачених `id` один раз, до обходу."
        en: "Split it in two: an inner function `visit(category, level)` walks the tree, while the outer one creates the result list and the `Set` of seen `id`s once, before the walk."
      explanation:
        uk: "Уяви охоронця музею, який веде відвідувачів залами й записує номер кожної зали в журнал. Перш ніж увійти, він дивиться в журнал: якщо номер уже є — група ходить по колу, і він зупиняє екскурсію з цим номером. Якщо зала далі від входу, ніж дозволено, — теж зупиняє, але з іншою причиною. Журнал веде номери, а не назви: «Зала скульптури» може бути на кожному поверсі. Так і тут: дві перевірки на початку кожного кроку, `Set` для `id` і різні типи помилок — `RangeError` для глибини, `Error` для циклу. Рівень дитини — на один більший за рівень батька."
        en: "Picture a museum guard leading visitors through the halls and writing each hall’s number in a log. Before entering, they look in the log: if the number is already there, the group is walking in circles, and the guard stops the tour with that number. If a hall is further from the entrance than allowed, the guard stops too, but for another reason. The log keeps numbers, not names: a “Sculpture hall” may be on every floor. Same here: two checks at the start of every step, a `Set` for `id`s and different error types — `RangeError` for depth, `Error` for a cycle. A child’s level is one more than its parent’s."
    solutionNote:
      uk: "Обидві перевірки стоять на початку кроку, ще до того, як категорія потрапить у список: межа глибини ловить надто глибокі дані, а `Set` з `id` — цикл, і називає вузол, де він замкнувся. Порівняння `level > maxDepth` пропускає рівно `maxDepth` рівнів. Якщо класти в `Set` назви, дві різні «Інше» виглядатимуть як цикл. Варіант із явним стеком тримає пари `[category, level]` у масиві й кладе дітей від останньої, щоб зберегти порядок углиб."
      en: "Both checks stand at the start of a step, before the category goes into the list: the depth limit catches data that is too deep, and the `Set` of `id`s catches a cycle and names the node where it closed. The comparison `level > maxDepth` lets exactly `maxDepth` levels through. If names went into the `Set`, the two different “Other” categories would look like a cycle. The explicit-stack version keeps `[category, level]` pairs in an array and pushes the children from the last one to keep the depth-first order."
    feedback:
      - when: { test: "lists every category depth-first with its level" }
        message:
          uk: "Ця перевірка чекає шість записів `{ id, name, level }` у порядку «Усі витрати», «Їжа», «Продукти», «Кафе», «Розваги», «Кіно» з рівнями 1, 2, 3, 3, 2, 3. Якщо порядок інший, але записи ті самі, діти йдуть не по черзі: з явним стеком клади їх від останньої. Якщо всі перевірки падають разом, подивись на консоль: програма могла впасти ще під час завантаження."
          en: "This check expects six records `{ id, name, level }` in the order “All spending”, “Food”, “Groceries”, “Cafe”, “Fun”, “Cinema” with levels 1, 2, 3, 3, 2, 3. If the order differs but the records are the same, the children are not visited in turn: with an explicit stack, push them from the last one. If every check fails at once, look at the console: the program may have crashed while loading."
      - when: { test: "a tree exactly maxDepth levels deep is accepted" }
        message:
          uk: "Ця перевірка дає ланцюжок із 3 рівнів із `maxDepth` 3 і чекає три записи без помилки. Якщо тут `RangeError`, межа спрацьовує на рівень раніше: порівнюй «більше за», а не «більше або дорівнює»."
          en: "This check passes a chain of 3 levels with `maxDepth` 3 and expects three records without an error. If a `RangeError` is thrown here, the limit fires one level early: compare with “greater than”, not “greater than or equal”."
      - when: { test: "one level past maxDepth throws a RangeError naming that category" }
        message:
          uk: "Ця перевірка дає ланцюжок із 4 рівнів із `maxDepth` 3 і чекає `RangeError`, у повідомленні якого є `c-4` — `id` першої зайвої категорії."
          en: "This check passes a chain of 4 levels with `maxDepth` 3 and expects a `RangeError` whose message contains `c-4` — the `id` of the first category past the limit."
      - when: { test: "a cycle throws an Error naming the repeated category" }
        message:
          uk: "Ця перевірка дає ланцюжок `c-1` → `c-2` → `c-3` → знову `c-1` з `maxDepth` 10 і чекає саме `Error` (не `RangeError`) з `c-1` у повідомленні. Якщо приходить `RangeError`, цикл ловить межа глибини чи переповнення стеку, а не перевірка вже відвіданих `id`."
          en: "This check passes the chain `c-1` → `c-2` → `c-3` → `c-1` again with `maxDepth` 10 and expects exactly `Error` (not `RangeError`) with `c-1` in the message. If a `RangeError` comes, the cycle is caught by the depth limit or a stack overflow, not by a check of already visited `id`s."
      - when: { test: "two categories with the same name are not a cycle" }
        message:
          uk: "Ця перевірка дає дерево з двома різними категоріями «Інше» і чекає п’ять записів без помилки. Якщо тут помилка циклу, у `Set` потрапляють назви, а не `id`."
          en: "This check passes a tree with two different “Other” categories and expects five records without an error. If a cycle error is thrown here, names go into the `Set` instead of `id`s."
      - when: { test: "the tree is not changed" }
        message:
          uk: "Ця перевірка порівнює дерево до і після виклику й чекає, що воно не зміниться: не додавай вузлам полів на зразок `visited` і не прибирай дітей з їхніх масивів."
          en: "This check compares the tree before and after the call and expects no change: do not add fields such as `visited` to the nodes and do not remove children from their arrays."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` з’являється, коли щось викликають як функцію, хоча це не функція, або читають властивість `undefined` — наприклад, `children` неіснуючого вузла. Якщо всі перевірки падають одночасно з повідомленням `type of flattenCategories: expected \"undefined\" to be \"function\"`, програма впала ще під час завантаження: виправ першу помилку в консолі."
          en: "A `TypeError` appears when something that is not a function is called as one, or a property of `undefined` is read — for example, the `children` of a node that does not exist. If every check fails at once with `type of flattenCategories: expected \"undefined\" to be \"function\"`, the program crashed while loading: fix the first error in the console."

  - id: to-project
    kind: transfer
    capstoneStep: JS-17
    body:
      uk: "Якщо твій проєкт обходить щось вкладене — категорії, повтори, імпортовані дані, — подумай, звідки ці дані беруться. Усе, що приходить з файлу чи від людини, заслуговує на межу глибини й перевірку циклів, навіть коли твої тестові дані неглибокі."
      en: "If your project walks anything nested — categories, repeats, imported data — think about where that data comes from. Everything that comes from a file or from a person deserves a depth limit and a cycle check, even when your test data is shallow."
