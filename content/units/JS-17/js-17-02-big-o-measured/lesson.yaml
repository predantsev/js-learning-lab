id: js-17-02-big-o-measured
unit: JS-17
title:
  uk: "Big-O, виміряно"
  en: "Big-O, measured"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Порахувати операції лінійного й вкладеного перетворення для n = 10, 100 і 1 000 та передбачити, як росте кожна кількість."
    en: "Count the operations of a linear and a nested-loop transform for n = 10, 100 and 1,000 and predict how each count grows."
  - uk: "Виміряти ті самі перетворення через performance.now() на синтетичних даних зростаючого розміру з повторами й пояснити, коли час не збігається з підрахунком (мале n, розігрів, сталі множники)."
    en: "Measure the same transforms with performance.now() over growing synthetic sizes with repeated runs, and explain when timings disagree with the counts (small n, warm-up, constant factors)."
  - uk: "Сказати, скільки додаткової пам’яті виділяє кожна версія зі зростанням n."
    en: "State how much extra memory each version allocates as n grows."
prerequisites: [js-17-01-stacks-queues-trees, js-05-06-search-complexity]
subskills:
  - { family: J-13, skill: "Big-O time/space", depth: intro }
  - { family: J-13, skill: "data size measurement", depth: intro }
glossary: [big-o, micro-benchmark]
selfCheck: [predict-counts, one-run-verdict, measure-helper]

blocks:
  - id: growth-not-seconds
    kind: explanation
    title:
      uk: "Big-O рахує кроки, а не секунди"
      en: "Big-O counts steps, not seconds"
    body:
      uk: |
        У JS-05 ти рахував порівняння: лінійний пошук — до `n`, перевірка кожної пари — близько `n × n`. Запис [[big-o|Big-O]] (O(n), O(n²), O(1)) коротко каже, **як росте** кількість кроків, коли росте `n`, і свідомо відкидає дрібниці: `n × (n − 1) / 2` і `n²` — обидва O(n²).

        Через це Big-O **не** каже, скільки мілісекунд займе код. Один крок `Set` дорожчий за одне порівняння двох рядків, а машина, браузер і решта роботи на комп’ютері змінюють час. Big-O каже інше: якщо даних стане вдесятеро більше, O(n) зробить удесятеро більше кроків, а O(n²) — у сто разів.

        Так само рахують пам’ять: скільки **додаткових** значень версія тримає, поки працює.
      en: |
        In JS-05 you counted comparisons: a linear search makes up to `n`, checking every pair about `n × n`. [[big-o|Big-O]] notation (O(n), O(n²), O(1)) briefly says **how the number of steps grows** when `n` grows, and deliberately drops the details: `n × (n − 1) / 2` and `n²` are both O(n²).

        That is why Big-O does **not** say how many milliseconds the code takes. One `Set` step costs more than one comparison of two strings, and the machine, the browser and other work on the computer change the time. Big-O says something else: with ten times more data, O(n) makes ten times more steps, and O(n²) a hundred times more.

        Memory is counted the same way: how many **extra** values a version keeps while it runs.

  - id: predict-counts
    kind: prediction
    prompt:
      uk: "Дві перевірки на дублікати отримують списки з 10, 100 і 1 000 різних `id` — дублікатів немає, тож обидві йдуть до кінця. Кожна рахує свої кроки в `operations`. Що виведуть три `console.log`?"
      en: "Two duplicate checks get lists of 10, 100 and 1,000 different `id`s — there are no duplicates, so both run to the end. Each counts its steps in `operations`. What do the three `console.log` calls print?"
    code: |
      let operations = 0;

      function hasDuplicateNested(ids) {
        for (let i = 0; i < ids.length; i++) {
          for (let j = i + 1; j < ids.length; j++) {
            operations = operations + 1;
            if (ids[i] === ids[j]) return true;
          }
        }
        return false;
      }

      function hasDuplicateWithSet(ids) {
        const seen = new Set();
        for (const id of ids) {
          operations = operations + 1;
          if (seen.has(id)) return true;
          seen.add(id);
        }
        return false;
      }

      for (const n of [10, 100, 1000]) {
        const ids = Array.from({ length: n }, (_, i) => "h-" + i);
        operations = 0;
        hasDuplicateNested(ids);
        const nested = operations;
        operations = 0;
        hasDuplicateWithSet(ids);
        console.log(n, nested, operations);
      }
    verify:
      logs: ["10 45 10", "100 4950 100", "1000 499500 1000"]
    answer:
      type: choice
      options:
        - id: square-vs-linear
          text:
            uk: "`10 45 10`, `100 4950 100`, `1000 499500 1000`"
            en: "`10 45 10`, `100 4950 100`, `1000 499500 1000`"
        - id: both-linear
          text:
            uk: "`10 10 10`, `100 100 100`, `1000 1000 1000`"
            en: "`10 10 10`, `100 100 100`, `1000 1000 1000`"
          why:
            uk: "Внутрішній цикл проходить решту списку для **кожного** елемента зовнішнього. Для 10 записів це 9 + 8 + … + 1 = 45 пар."
            en: "The inner loop walks the rest of the list for **every** item of the outer one. For 10 records that is 9 + 8 + … + 1 = 45 pairs."
        - id: full-square
          text:
            uk: "`10 100 10`, `100 10000 100`, `1000 1000000 1000`"
            en: "`10 100 10`, `100 10000 100`, `1000 1000000 1000`"
          why:
            uk: "Близько, і росте так само — у сто разів на кожен крок. Але внутрішній цикл починає з `i + 1`: кожна пара перевіряється один раз, і запис не порівнюють із собою, тож пар `n × (n − 1) / 2`."
            en: "Close, and it grows the same way — a hundred times per step. But the inner loop starts at `i + 1`: every pair is checked once and no record is compared with itself, so there are `n × (n − 1) / 2` pairs."
        - id: set-free
          text:
            uk: "`10 45 0`, `100 4950 0`, `1000 499500 0`"
            en: "`10 45 0`, `100 4950 0`, `1000 499500 0`"
          why:
            uk: "`Set` швидко відповідає на `has`, але цикл усе одно проходить кожен `id` один раз — і на кожному кроці збільшує лічильник."
            en: "A `Set` answers `has` quickly, but the loop still visits every `id` once — and increases the counter on every step."
      correct: [square-vs-linear]
    explanation:
      uk: "Вкладені цикли перевіряють `n × (n − 1) / 2` пар: 45, 4 950, 499 500. Коли `n` росте вдесятеро, кроків стає приблизно в сто разів більше — це O(n²). Версія з `Set` робить один крок на запис — O(n). Зате вона тримає в `Set` до `n` значень: O(n) додаткової пам’яті, тоді як вкладеним циклам вистачає двох лічильників — O(1)."
      en: "The nested loops check `n × (n − 1) / 2` pairs: 45, 4,950, 499,500. When `n` grows tenfold, the steps grow about a hundredfold — that is O(n²). The `Set` version makes one step per record — O(n). In return it keeps up to `n` values in the `Set`: O(n) extra memory, while the nested loops need just two counters — O(1)."

  - id: count-trace
    kind: visual
    visual: code-trace
    title:
      uk: "Лічильник кроків на восьми записах"
      en: "A step counter on eight records"
    textEquivalent:
      uk: "Обидві перевірки отримують той самий масив із восьми різних id. Вкладена версія бере перший id і порівнює його з кожним із семи наступних — лічильник nestedOps росте від 0 до 7. Потім другий id порівнюється з шістьма наступними, третій — з п’ятьма, і так далі: 7 + 6 + 5 + 4 + 3 + 2 + 1 = 28 порівнянь. Версія з Set проходить масив один раз: для кожного id одна перевірка seen.has і запис seen.add — лічильник setOps доходить до 8, а Set наприкінці тримає всі вісім id. Консоль показує 28 8."
      en: "Both checks get the same array of eight different ids. The nested version takes the first id and compares it with each of the seven following ones — the counter nestedOps grows from 0 to 7. Then the second id is compared with the six following ones, the third with five, and so on: 7 + 6 + 5 + 4 + 3 + 2 + 1 = 28 comparisons. The Set version walks the array once: for every id one seen.has check and one seen.add — the counter setOps reaches 8, and at the end the Set holds all eight ids. The console shows 28 8."
    spec:
      file: visuals/two-checks.js
      steps: captioned
      captions:
        - at: { line: 31 }
          text:
            uk: "Вісім різних `id` — дублікатів немає, тож обом перевіркам доведеться дійти до кінця."
            en: "Eight different `id`s — no duplicates, so both checks have to go all the way."
        - at: { line: 8, hit: 1 }
          text:
            uk: "Перше порівняння: `i = 0`, `j = 1`. `nestedOps` поки `0`."
            en: "The first comparison: `i = 0`, `j = 1`. `nestedOps` is still `0`."
        - at: { line: 8, hit: 7 }
          text:
            uk: "Сьоме порівняння першого рядка: `w-01` порівнюється з останнім, `j = 7`. Лише на перший `id` пішло 7 кроків."
            en: "The seventh comparison of the first row: `w-01` meets the last one, `j = 7`. The first `id` alone took 7 steps."
        - at: { line: 8, hit: 8 }
          text:
            uk: "Тепер `i = 1`: другий `id` порівнюється з шістьма наступними. Кожен наступний рядок на один коротший."
            en: "Now `i = 1`: the second `id` is compared with the six following ones. Every next row is one shorter."
        - at: { line: 8, hit: 28 }
          text:
            uk: "Останнє, 28-ме порівняння: `i = 6`, `j = 7`. 7 + 6 + … + 1 = 28 = 8 × 7 / 2."
            en: "The last, 28th comparison: `i = 6`, `j = 7`. 7 + 6 + … + 1 = 28 = 8 × 7 / 2."
        - at: { line: 32 }
          text:
            uk: "`nestedOps` — `28`. Тепер версія з `Set`."
            en: "`nestedOps` is `28`. Now the `Set` version."
        - at: { line: 22, hit: 1 }
          text:
            uk: "Один прохід: для `w-01` одна перевірка `seen.has`. `seen` — порожній `Set` у панелі об’єктів."
            en: "One pass: one `seen.has` check for `w-01`. `seen` is an empty `Set` in the objects panel."
        - at: { line: 22, hit: 8 }
          text:
            uk: "Восьмий і останній крок: `setOps` — `7`, зараз стане `8`. У `seen` вже сім `id` — це ціна в пам’яті."
            en: "The eighth and last step: `setOps` is `7` and is about to become `8`. `seen` already holds seven `id`s — that is the memory price."
        - at: { line: 33, kind: end }
          text:
            uk: "Консоль: `28 8`. Для восьми записів різниця невелика, але вона росте як `n²` проти `n`."
            en: "The console: `28 8`. For eight records the difference is small, but it grows as `n²` against `n`."

  - id: count-and-time
    kind: example
    runtime: browser-js
    dir: count-and-time
    entry: index.js
    strings:
      wish: { uk: "Бажання", en: "Wish" }
      nested: { uk: "вкладені цикли:", en: "nested loops:" }
      ops: { uk: "кроків", en: "steps" }
      fiveRuns: { uk: "П’ять запусків при n=2000, мс:", en: "Five runs at n=2000, ms:" }
    title:
      uk: "Рахуємо кроки й міряємо час"
      en: "Counting steps and timing them"
    body:
      uk: |
        Програма запускає обидві перевірки на 250, 500, 1 000, 2 000 і 4 000 синтетичних бажань. Кожен розмір вона повторює 5 разів і показує **медіану** часу — середнє за порядком значення: один повільний запуск її не зсуває. В останньому рядку — усі п’ять запусків одного розміру.

        Запусти й порівняй два стовпці: кроки і мілісекунди.
      en: |
        The program runs both checks on 250, 500, 1,000, 2,000 and 4,000 synthetic wishes. It repeats every size 5 times and shows the **median** time — the middle value in sorted order: one slow run does not move it. The last line shows all five runs of one size.

        Run it and compare the two columns: steps and milliseconds.
    tryIt:
      uk: |
        1. Подивись на найменший розмір (250): обидві версії показують від `0.0` до кількох десятих мілісекунди. У цій пісочниці `performance.now()` росте кроками по 0,1 мс, тож коротша робота просто не видна, а різниця в один-два кроки таймера — це шум. Мале `n` не каже, яка версія швидша.
        2. Порівняй кроки й час між 2 000 і 4 000: у вкладених циклів кроків стало вчетверо більше, а у версії з `Set` — удвічі. Чи так само зріс час? Запиши свої числа.
        3. Додай `8000` у список розмірів і запусти ще раз. Криві розходяться ще сильніше. Більше не додавай: при 16 000 вкладена версія робитиме 128 мільйонів кроків на кожен із п’яти запусків.
        4. Запусти програму двічі поспіль і порівняй рядок із п’ятьма запусками. Час одного розміру коливається — саме тому один замір нічого не доводить.
      en: |
        1. Look at the smallest size (250): both versions show anything from `0.0` to a few tenths of a millisecond. In this sandbox `performance.now()` advances in steps of 0.1 ms, so shorter work is simply invisible, and a difference of one or two timer steps is noise. A small `n` does not tell which version is faster.
        2. Compare steps and time between 2,000 and 4,000: the nested loops’ steps grew fourfold, the `Set` version’s twofold. Did the time grow the same way? Write down your numbers.
        3. Add `8000` to the list of sizes and run again. The curves separate even more. Do not go further: at 16,000 the nested version would make 128 million steps for each of the five runs.
        4. Run the program twice in a row and compare the line with five runs. The time of one size fluctuates — that is exactly why one measurement proves nothing.

  - id: when-timings-disagree
    kind: explanation
    title:
      uk: "Коли час не збігається з підрахунком"
      en: "When the timing disagrees with the count"
    body:
      uk: |
        Такий маленький замір одного шматка коду називають [[micro-benchmark|мікробенчмарком]]. Він чесний, лише коли ти знаєш, що могло його зіпсувати:

        | Що бачиш | Чому |
        |---|---|
        | обидві версії `0.0 ms` | робота коротша за крок таймера; збільш `n` |
        | версія з меншою кількістю кроків повільніша | **сталий множник**: один її крок дорожчий (`Set` проти `===`) |
        | перший запуск повільніший | **розігрів**: рушій JavaScript спершу виконує код повільніше, а оптимізує його після кількох викликів |
        | той самий розмір дає різний час | інша робота на машині; дивись на медіану кількох запусків |

        Правило: рахуй кроки, щоб зрозуміти **ріст**, і міряй час на **кількох** розмірах із повторами, щоб побачити, коли цей ріст важить. Записуй розмір даних поруч із кожним числом: «30 мс» без `n` нічого не означає.
      en: |
        Such a small measurement of one piece of code is called a [[micro-benchmark]]. It is honest only when you know what could spoil it:

        | What you see | Why |
        |---|---|
        | both versions `0.0 ms` | the work is shorter than the timer’s step; increase `n` |
        | the version with fewer steps is slower | a **constant factor**: one of its steps costs more (`Set` against `===`) |
        | the first run is slower | **warm-up**: the JavaScript engine first runs code more slowly and optimizes it after a few calls |
        | the same size gives different times | other work on the machine; look at the median of several runs |

        The rule: count steps to understand the **growth**, and time **several** sizes with repeats to see when that growth matters. Write the data size next to every number: “30 ms” without `n` means nothing.

  - id: one-run-verdict
    kind: prediction
    prompt:
      uk: "Колега запустив дві версії перевірки на дублікати один раз на 10 записах і отримав: вкладені цикли — `0.1 ms`, версія з `Set` — `0.2 ms`. Він пише в рев’ю: «Set повільніший, лишаємо вкладені цикли». Що з цього випливає?"
      en: "A colleague ran two versions of a duplicate check once on 10 records and got: nested loops `0.1 ms`, the `Set` version `0.2 ms`. They write in a review: “Set is slower, we keep the nested loops”. What follows from this?"
    answer:
      type: choice
      options:
        - id: proves-nothing
          text:
            uk: "Майже нічого: один запуск, різниця на рівні кроку таймера, і лише одне мале `n`. Треба кілька розмірів, повтори й медіана"
            en: "Almost nothing: one run, a difference at the level of the timer’s step, and only one small `n`. Several sizes, repeats and a median are needed"
        - id: set-slower
          text:
            uk: "Що `Set` повільніший і для 10 записів, і для 10 000"
            en: "That `Set` is slower for 10 records and for 10,000 too"
          why:
            uk: "Для 10 записів вкладені цикли роблять 45 кроків, а для 10 000 — майже 50 мільйонів; версія з `Set` — 10 і 10 000. Замір на одному малому `n` не каже, як поведе себе ріст."
            en: "For 10 records the nested loops make 45 steps, for 10,000 almost 50 million; the `Set` version 10 and 10,000. A measurement at one small `n` says nothing about the growth."
        - id: bigo-wrong
          text:
            uk: "Що Big-O тут помиляється: O(n) мало бути швидшим за O(n²)"
            en: "That Big-O is wrong here: O(n) should have been faster than O(n²)"
          why:
            uk: "Big-O не обіцяє, що O(n) швидше на кожному `n`: він описує ріст і відкидає сталі множники. На малому `n` дорожчий крок може переважити."
            en: "Big-O does not promise that O(n) is faster at every `n`: it describes growth and drops constant factors. At a small `n` a more expensive step can win."
        - id: set-faster
          text:
            uk: "Що насправді швидший `Set`, бо 0,1 і 0,2 мс — це похибка в його користь"
            en: "That `Set` is actually faster, because 0.1 and 0.2 ms are an error in its favour"
          why:
            uk: "Похибка не має «користі»: різниця на рівні кроку таймера не каже нічого ні про одну версію."
            en: "Noise has no “favour”: a difference at the level of the timer’s step says nothing about either version."
      correct: [proves-nothing]
    explanation:
      uk: "Один запуск на 10 записах вимірює переважно шум: крок таймера тут 0,1 мс, а сама робота коротша. Висновок про швидкість потребує кількох розмірів (щоб побачити ріст), кількох повторів кожного (щоб відсіяти випадкові паузи) і чисел разом із `n`."
      en: "One run on 10 records mostly measures noise: the timer’s step here is 0.1 ms, and the work itself is shorter. A conclusion about speed needs several sizes (to see the growth), several repeats of each (to filter out random pauses) and numbers together with `n`."

  - id: recall-keyed-lookup
    kind: review
    title:
      uk: "Пригадай: лінійний пошук і довідник"
      en: "Recall: linear search and a lookup object"
    items:
      - id: lookups-cost
        from: js-05-06-search-complexity
        prompt:
          uk: "У списку 1 000 витрат. Треба знайти 100 витрат за `id`. Скільки кроків у найгіршому випадку займе 100 разів `find`, і скільки — побудова об’єкта-довідника один раз плюс 100 пошуків у ньому?"
          en: "A list holds 1,000 expenses. You need to find 100 expenses by `id`. How many steps does 100 times `find` take in the worst case, and how many does building a lookup object once plus 100 lookups in it take?"
        answer:
          type: choice
          options:
            - id: hundred-thousand-vs-1100
              text:
                uk: "100 000 проти 1 100"
                en: "100,000 against 1,100"
            - id: same
              text:
                uk: "Однаково: обидва способи шукають по 1 000 записів"
                en: "The same: both ways search through 1,000 records"
              why:
                uk: "Довідник проходить список лише один раз — під час побудови. Далі кожен пошук займає один крок."
                en: "The lookup object walks the list only once — while it is built. After that every lookup takes one step."
            - id: hundred-vs-1000
              text:
                uk: "100 проти 1 000"
                en: "100 against 1,000"
              why:
                uk: "Кожен `find` у найгіршому випадку перевіряє всі 1 000 записів, тож 100 пошуків — до 100 000 порівнянь."
                en: "In the worst case every `find` checks all 1,000 records, so 100 searches take up to 100,000 comparisons."
          correct: [hundred-thousand-vs-1100]
        explanation:
          uk: "100 лінійних пошуків × до 1 000 порівнянь = 100 000. Довідник: 1 000 кроків на побудову і по одному на кожен із 100 пошуків = 1 100, плюс пам’ять на 1 000 ключів. Те саме ти щойно бачив із `Set`: менше кроків в обмін на додаткову пам’ять."
          en: "100 linear searches × up to 1,000 comparisons = 100,000. The lookup object: 1,000 steps to build and one for each of the 100 lookups = 1,100, plus memory for 1,000 keys. You have just seen the same with a `Set`: fewer steps in exchange for extra memory."

  - id: measure-helper
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: measure-helper
    entry: index.js
    editable: [measure.js]
    strings:
      scan: { uk: "Перегляд:", en: "Scan:" }
      ops: { uk: "кроків", en: "steps" }
    title:
      uk: "Помічник для вимірювань"
      en: "A measuring helper"
    instructions:
      uk: |
        У `transforms.js` — два способи порахувати справи планувальника на кожну дату. Обидві функції самі будують `n` синтетичних справ і **повертають кількість своїх кроків**. Допиши в `measure.js` дві функції:

        1. `median(values)` повертає середнє за порядком значення списку чисел. Для парної кількості — середнє арифметичне двох середніх значень: `median([4, 1, 3, 2])` → `2.5`. Список, який вона отримала, не змінюється.
        2. `measure(fn, sizes, repeats)` для кожного розміру з `sizes` викликає `fn(size)` рівно `repeats` разів і міряє **кожен** виклик через `performance.now()` — одразу перед викликом і одразу після. Повертає масив рядків `{ size, operations, medianMs }` у порядку `sizes`: `operations` — те, що повернула `fn`, `medianMs` — медіана часів цих викликів.

        Одна перевірка підмінює `performance.now()` штучним годинником, щоб знати точний час кожного виклику, тож міряй саме ним.
      en: |
        `transforms.js` holds two ways to count planner tasks per date. Both functions build `n` synthetic tasks themselves and **return the number of steps they made**. Finish two functions in `measure.js`:

        1. `median(values)` returns the middle value of a list of numbers in sorted order. For an even count, the mean of the two middle values: `median([4, 1, 3, 2])` → `2.5`. The list it receives is not changed.
        2. `measure(fn, sizes, repeats)` calls `fn(size)` exactly `repeats` times for every size in `sizes` and times **each** call with `performance.now()` — right before the call and right after it. It returns an array of rows `{ size, operations, medianMs }` in the order of `sizes`: `operations` is what `fn` returned, `medianMs` is the median of those calls’ times.

        One check replaces `performance.now()` with a fake clock to know the exact time of every call, so time with exactly that.
    testTitles:
      "median of an odd count is the middle value":
        uk: "Медіана непарної кількості — середнє за порядком значення"
        en: "The median of an odd count is the middle value"
      "median of an even count is the mean of the two middle values":
        uk: "Медіана парної кількості — середнє двох середніх значень"
        en: "The median of an even count is the mean of the two middle values"
      "median leaves its list unchanged":
        uk: "`median` не змінює отриманий список"
        en: "`median` leaves its list unchanged"
      "measure calls fn repeats times for every size":
        uk: "`measure` викликає `fn` рівно `repeats` разів для кожного розміру"
        en: "`measure` calls `fn` exactly `repeats` times for every size"
      "measure returns one row per size with the operations fn reported":
        uk: "`measure` повертає по рядку на розмір із кількістю кроків від `fn`"
        en: "`measure` returns one row per size with the step count from `fn`"
      "medianMs is the median of the timed runs":
        uk: "`medianMs` — медіана часів окремих викликів"
        en: "`medianMs` is the median of the separate calls’ times"
    hints:
      nudge:
        uk: "Почни з `median`: як знайти середину відсортованого списку, якщо елементів 3, і якщо їх 4?"
        en: "Start with `median`: how do you find the middle of a sorted list when it has 3 items, and when it has 4?"
      explanation:
        uk: "Медіана оцінок класу: відсортуй копію оцінок від меншої до більшої — для цього `sort` чи `toSorted` потрібна функція порівняння `(a, b) => a - b`, без неї числа сортуються як текст, і `10` стає перед `9`. Візьми середню; якщо оцінок парна кількість, середніх дві — візьми їхнє середнє. `toSorted` повертає нову відсортовану копію, а `sort` змінює сам масив. Для `measure`: зовнішній цикл іде розмірами, внутрішній — повторами; кожен повтор записує різницю двох показів `performance.now()` у масив часів, а наприкінці рядок отримує медіану цього масиву."
        en: "The median of a class’s marks: sort a copy of the marks from low to high — `sort` or `toSorted` needs the compare function `(a, b) => a - b` for that; without it numbers are sorted as text, and `10` comes before `9`. Take the middle one; with an even number of marks there are two middle ones — take their mean. `toSorted` returns a new sorted copy, while `sort` changes the array itself. For `measure`: the outer loop goes over the sizes, the inner one over the repeats; every repeat stores the difference of two `performance.now()` readings in an array of times, and at the end the row gets the median of that array."
    solutionNote:
      uk: "Медіана стійка до одного викиду: якщо з п’яти запусків один потрапив на паузу, середнє арифметичне підскочить, а медіана — ні. Час міряють навколо кожного виклику окремо, бо саме ці окремі значення й порівнює медіана. На своїх числах ти побачиш, що перегляд для кожної дати робить у 30 разів більше кроків, ніж один прохід із `Map`, — це O(n × d), де `d` — кількість дат; при сталих 30 датах обидві версії ростуть лінійно, але з різним множником."
      en: "The median is robust to one outlier: if one of five runs hit a pause, the mean jumps, while the median does not. The time is measured around each call separately, because those separate values are exactly what the median compares. In your numbers you will see that scanning for every date makes 30 times more steps than one pass with a `Map` — that is O(n × d), where `d` is the number of dates; with a fixed 30 dates both versions grow linearly, but with different factors."
    feedback:
      - when: { test: "median of an odd count is the middle value" }
        message:
          uk: "Ця перевірка чекає `2` для `[3, 1, 2]` і `9` для `[9, 10, 2]`. Якщо перше правильне, а друге ні, числа сортуються як текст (`\"10\"` перед `\"2\"`): `sort` і `toSorted` без функції порівняння `(a, b) => a - b` порівнюють текст."
          en: "This check expects `2` for `[3, 1, 2]` and `9` for `[9, 10, 2]`. If the first is right and the second is not, the numbers are sorted as text (`\"10\"` before `\"2\"`): `sort` and `toSorted` without the compare function `(a, b) => a - b` compare text."
      - when: { test: "median of an even count is the mean of the two middle values" }
        message:
          uk: "Ця перевірка чекає `2.5` для `[4, 1, 3, 2]`: після сортування це `[1, 2, 3, 4]`, а середні — `2` і `3`."
          en: "This check expects `2.5` for `[4, 1, 3, 2]`: sorted, it is `[1, 2, 3, 4]`, and the middle ones are `2` and `3`."
      - when: { test: "median leaves its list unchanged" }
        message:
          uk: "Ця перевірка чекає, що після `median([5, 1, 4])` список лишиться `[5, 1, 4]`. `sort` сортує сам масив; візьми `toSorted` або відсортуй копію."
          en: "This check expects the list to stay `[5, 1, 4]` after `median([5, 1, 4])`. `sort` sorts the array itself; use `toSorted` or sort a copy."
      - when: { test: "measure calls fn repeats times for every size" }
        message:
          uk: "Ця перевірка викликає `measure` з розмірами `[10, 20]` і `repeats` 3 і чекає, що `fn` отримає по черзі `10, 10, 10, 20, 20, 20`. Один виклик на розмір — це один замір, а не кілька."
          en: "This check calls `measure` with sizes `[10, 20]` and `repeats` 3 and expects `fn` to receive `10, 10, 10, 20, 20, 20` in turn. One call per size is one measurement, not several."
      - when: { test: "medianMs is the median of the timed runs" }
        message:
          uk: "Ця перевірка підмінює `performance.now()` штучним годинником: виклики при розмірі 10 тривають 5, 1 і 3 мс, при 20 — 8, 30 і 7 мс, тож вона чекає `medianMs` `3` і `8`. Міряй через `performance.now()` навколо кожного виклику `fn` окремо й бери медіану, а не середнє чи один запуск."
          en: "This check replaces `performance.now()` with a fake clock: the calls at size 10 take 5, 1 and 3 ms, at 20 they take 8, 30 and 7 ms, so it expects `medianMs` of `3` and `8`. Time with `performance.now()` around each call of `fn` separately and take the median, not the mean or one run."
      - when: { test: "measure returns one row per size with the operations fn reported" }
        message:
          uk: "Ця перевірка викликає `measure` з функцією, що повертає `size * 2`, розмірами `[10, 20]` і `repeats` 3 і чекає масив рядків, де `size` — `10` і `20`, а `operations` — `20` і `40`: те, що повернув виклик `fn`, а не сума всіх повторів."
          en: "This check calls `measure` with a function that returns `size * 2`, sizes `[10, 20]` and `repeats` 3, and expects an array of rows whose `size` is `10` and `20` and whose `operations` is `20` and `40`: what a call of `fn` returned, not the sum of all repeats."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` у `index.js` зазвичай означає, що в рядку від `measure` немає числового `medianMs` (повідомлення про `toFixed`) або `measure` повертає не масив (повідомлення «… is not iterable»). Якщо перевірки пишуть `type of the … export of measure.js: expected \"undefined\" to be \"function\"`, з `measure.js` зник експорт `median` чи `measure` — назви мають лишитися ті самі."
          en: "A `TypeError` in `index.js` usually means that a row from `measure` has no numeric `medianMs` (a message about `toFixed`) or that `measure` does not return an array (a message “… is not iterable”). If the checks say `type of the … export of measure.js: expected \"undefined\" to be \"function\"`, the `median` or `measure` export disappeared from `measure.js` — the names must stay the same."

  - id: to-project
    kind: transfer
    capstoneStep: JS-17
    body:
      uk: "У кроці проєкту роботу одного перетворення твого застосунку перевірки рахуватимуть так само — кількістю кроків, тобто прочитань поля на великому синтетичному наборі, а не часом. Час ти виміряєш сам: профілем DevTools до зміни й після неї."
      en: "In the project step the checks will count the work of one transform of your app the same way — by the step count, that is, the reads of a field on a large synthetic dataset, not by time. You measure the time yourself: with a DevTools profile before the change and after it."
