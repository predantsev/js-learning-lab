id: js-17-04-sorting-search-decisions
unit: JS-17
title:
  uk: "Рішення щодо сортування та пошуку"
  en: "Sorting and search decisions"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Обрати між лінійним переглядом, індексом Map, сортуванням із двійковим пошуком і масивом, який тримають відсортованим, для заданого співвідношення читань і записів, і обґрунтувати вибір кількістю операцій."
    en: "Choose between a linear scan, a Map index, sort-then-binary-search and a kept-sorted array for a given read/write workload, and justify the choice with operation counts."
  - uk: "Реалізувати двійковий пошук у відсортованій копії й сформулювати його передумову."
    en: "Implement binary search over a sorted copy and state its precondition."
prerequisites: [js-17-03-bounded-recursion, js-05-05-sorting-comparator]
subskills:
  - { family: J-13, skill: "sorting/search decisions", depth: intro }
glossary: [binary-search, precondition]
selfCheck: [predict-strategy, binary-search]

blocks:
  - id: halving
    kind: explanation
    title:
      uk: "Ділимо навпіл"
      en: "Cutting in half"
    body:
      uk: |
        Загадай число від 1 до 100. Я питаю: «Більше за 50?» — «Ні». — «Більше за 25?» — «Так». Кожна відповідь відкидає **половину** варіантів, тож сім питань вистачить для будь-якого числа. Це [[binary-search|двійковий пошук]]: подивитися на середній елемент, порівняти й відкинути половину, де шуканого бути не може.

        Для 100 000 записів досить 17 порівнянь (2¹⁷ = 131 072), а не до 100 000, як у лінійного перегляду. Але працює це лише за однієї [[precondition|передумови]]: масив **відсортовано за тим самим ключем**, за яким шукаєш. У невідсортованому масиві двійковий пошук не впаде з помилкою — він тихо поверне неправильну відповідь.

        Дати у форматі `"YYYY-MM-DD"` можна порівнювати просто `<` і `>`: рік, місяць і день стоять від старшого до молодшого, тож текст іде в тому самому порядку, що й дати. Мовний порядок `localeCompare` для цього не потрібен.
      en: |
        Think of a number from 1 to 100. I ask: “Greater than 50?” — “No.” — “Greater than 25?” — “Yes.” Every answer throws away **half** of the options, so seven questions are enough for any number. That is [[binary-search]]: look at the middle item, compare, and throw away the half where the target cannot be.

        For 100,000 records 17 comparisons are enough (2¹⁷ = 131,072), not up to 100,000 as with a linear scan. But it works only under one [[precondition]]: the array is **sorted by the same key** you search by. In an unsorted array binary search does not fail with an error — it quietly returns a wrong answer.

        Dates in the `"YYYY-MM-DD"` format can be compared with plain `<` and `>`: year, month and day go from the largest unit to the smallest, so the text is in the same order as the dates. The language order of `localeCompare` is not needed for that.

  - id: price-of-sorting
    kind: explanation
    title:
      uk: "Сортування теж коштує"
      en: "Sorting costs too"
    body:
      uk: |
        Двійковий пошук потребує відсортованого масиву, а сортування 100 000 записів робить близько 1,5 мільйона порівнянь — це O(n log n). Тож кожна стратегія спершу платить за підготовку, а потім — за кожне читання й кожен запис:

        | Стратегія | Підготовка | Пошук | Новий запис |
        |---|---|---|---|
        | лінійний перегляд | нічого | до `n` | 1 (`push`) |
        | [[lookup-index\|індекс]] `Map` | `n` | 1 | 1 (`set`) |
        | відсортована копія + двійковий пошук | ~`n log n` | ~`log n` | копію знову треба сортувати |
        | масив, який тримають відсортованим | ~`n log n` раз | ~`log n` | ~`log n`, щоб знайти місце, і зсув решти масиву |

        Вибір залежить не від того, що «швидше взагалі», а від **співвідношення** пошуків і записів.
      en: |
        Binary search needs a sorted array, and sorting 100,000 records makes about 1.5 million comparisons — that is O(n log n). So every strategy first pays for preparation, and then for every read and every write:

        | Strategy | Preparation | Lookup | New record |
        |---|---|---|---|
        | linear scan | nothing | up to `n` | 1 (`push`) |
        | `Map` [[lookup-index\|index]] | `n` | 1 | 1 (`set`) |
        | sorted copy + binary search | ~`n log n` | ~`log n` | the copy has to be sorted again |
        | an array kept sorted | ~`n log n` once | ~`log n` | ~`log n` to find the place, plus moving the rest of the array |

        The choice depends not on what is “faster in general” but on the **ratio** of lookups to writes.

  - id: predict-strategy
    kind: prediction
    prompt:
      uk: "У трекері витрат 100 000 денних підсумків, по одному на дату, у довільному порядку. Записів не додають. Яка стратегія робить найменше операцій для **одного** пошуку за датою, а яка — для **10 000** пошуків?"
      en: "The expense tracker has 100,000 day summaries, one per date, in no particular order. No records are added. Which strategy makes the fewest operations for **one** lookup by date, and which for **10,000** lookups?"
    answer:
      type: choice
      options:
        - id: scan-then-index
          text:
            uk: "Один пошук: перегляд (індекс майже стільки ж), сортування — найдорожче. 10 000 пошуків: індекс `Map`, далі сортування з двійковим пошуком, перегляд — найгірше"
            en: "One lookup: a scan (the index costs about the same), sorting is the most expensive. 10,000 lookups: a `Map` index, then sorting with binary search, the scan is the worst"
        - id: sort-always
          text:
            uk: "В обох випадках — сортування з двійковим пошуком: 17 порівнянь на пошук"
            en: "Sorting with binary search in both cases: 17 comparisons per lookup"
          why:
            uk: "17 порівнянь — це лише пошук. Перед ним треба відсортувати 100 000 записів — близько 1,5 мільйона порівнянь. Для одного пошуку це в 15 разів більше, ніж переглянути весь список."
            en: "17 comparisons is only the lookup. Before it, 100,000 records must be sorted — about 1.5 million comparisons. For one lookup that is 15 times more than scanning the whole list."
        - id: scan-always
          text:
            uk: "В обох випадках — перегляд: він нічого не готує наперед"
            en: "A scan in both cases: it prepares nothing in advance"
          why:
            uk: "Для одного пошуку — так. Але 10 000 переглядів — до мільярда порівнянь, а індекс за 100 000 кроків підготовки відповідає на кожен пошук за один крок."
            en: "For one lookup, yes. But 10,000 scans is up to a billion comparisons, while an index answers every lookup in one step after 100,000 steps of preparation."
        - id: index-far-ahead
          text:
            uk: "В обох випадках індекс `Map` із великим відривом"
            en: "A `Map` index by a wide margin in both cases"
          why:
            uk: "Для одного пошуку відриву немає: побудова індексу — ті самі 100 000 кроків, що й повний перегляд. Індекс окуповується, коли пошуків багато."
            en: "For one lookup there is no margin: building the index is the same 100,000 steps as a full scan. An index pays off when there are many lookups."
      correct: [scan-then-index]
    explanation:
      uk: "Один пошук: перегляд — до 100 000 порівнянь, індекс — 100 000 кроків побудови й 1 пошук, сортування — ~1,5 мільйона й 17. Тут сортувати наперед найгірше. 10 000 пошуків: перегляд — до мільярда, індекс — ~110 000, сортування — ~1,5 мільйона й 170 000. Сортування спершу «завжди швидше» лише тоді, коли пошуків багато, а записів мало."
      en: "One lookup: a scan is up to 100,000 comparisons, the index 100,000 steps to build and 1 lookup, sorting ~1.5 million and 17. Sorting in advance is the worst here. 10,000 lookups: a scan up to a billion, the index ~110,000, sorting ~1.5 million plus 170,000. Sorting first is “always faster” only when there are many lookups and few writes."

  - id: three-strategies
    kind: example
    runtime: browser-js
    dir: three-strategies
    entry: index.js
    strings:
      records: { uk: "підсумків", en: "summaries" }
      rounds: { uk: "раунди", en: "rounds" }
      inserts: { uk: "нових", en: "new" }
      lookups: { uk: "пошуків", en: "lookups" }
      scan: { uk: "Перегляд, операцій:", en: "Scan, operations:" }
      index: { uk: "Індекс Map, операцій:", en: "Map index, operations:" }
      sorted: { uk: "Сортування + двійковий пошук, операцій:", en: "Sort + binary search, operations:" }
    title:
      uk: "Три стратегії на одному навантаженні"
      en: "Three strategies on one workload"
    body:
      uk: |
        Програма будує 100 000 синтетичних денних підсумків у перемішаному порядку й запускає навантаження: кілька **раундів**, у кожному спершу приходять нові підсумки, потім іде серія пошуків за датою. Кожна стратегія рахує свої операції: порівняння під час перегляду й сортування, записи в індекс і читання з нього.

        Двійковий пошук тут рахується формулою «щонайбільше ⌈log₂(n + 1)⌉ порівнянь» — сам пошук ти напишеш у вправі, і її перевірка порахує справжні порівняння. Запуск займає кілька сотень мілісекунд.
      en: |
        The program builds 100,000 synthetic day summaries in shuffled order and runs a workload: a few **rounds**, in each first new summaries arrive, then comes a series of lookups by date. Each strategy counts its operations: comparisons while scanning and sorting, writes into the index and reads from it.

        Binary search is counted here by the formula “at most ⌈log₂(n + 1)⌉ comparisons” — you write the search itself in the exercise, and its check counts the real comparisons. A run takes a few hundred milliseconds.
    tryIt:
      uk: |
        Змінюй сталі вгорі файлу й щоразу передбачай переможця **до** запуску:

        1. `LOOKUPS = 1`. Перегляд майже зрівнюється з індексом, а сортування в десятки разів дорожче за обидва.
        2. `ROUNDS = 1`, `INSERTS = 0`, `LOOKUPS = 300`. Записів немає: сортування один раз — і відсортована копія вже обганяє перегляд.
        3. Поверни `ROUNDS = 3` і постав `INSERTS = 10`, `LOOKUPS = 300`: кожен раунд змушує сортувати копію знову. Більше 300 пошуків не став — перегляд стане надто повільним для цієї пісочниці.
      en: |
        Change the constants at the top of the file and predict the winner **before** every run:

        1. `LOOKUPS = 1`. The scan almost draws level with the index, while sorting costs dozens of times more than either.
        2. `ROUNDS = 1`, `INSERTS = 0`, `LOOKUPS = 300`. There are no writes: one sort — and the sorted copy already beats the scan.
        3. Bring back `ROUNDS = 3` and set `INSERTS = 10`, `LOOKUPS = 300`: every round forces the copy to be sorted again. Do not go above 300 lookups — the scan becomes too slow for this sandbox.

  - id: choose-by-workload
    kind: explanation
    title:
      uk: "Вибір за навантаженням"
      en: "Choosing by workload"
    body:
      uk: |
        | Навантаження | Вибір |
        |---|---|
        | кілька пошуків, сотні записів | лінійний перегляд: простий код важливіший |
        | багато пошуків за точним ключем (`id`, дата), записи будь-коли | індекс `Map`, який змінюють разом зі списком |
        | багато пошуків, записів майже немає, потрібен ще й **порядок** («перші 20 за датою», діапазон дат) | один раз відсортувати й шукати двійково |
        | записи приходять уже по порядку (нові дні в кінець) | тримати масив відсортованим: `push` у кінець нічого не зсуває |

        Обґрунтовуй вибір числами для **свого** навантаження: скільки записів, скільки пошуків, скільки змін між ними.
      en: |
        | Workload | Choice |
        |---|---|
        | a few lookups, hundreds of records | a linear scan: simple code matters more |
        | many lookups by an exact key (`id`, date), writes at any time | a `Map` index changed together with the list |
        | many lookups, almost no writes, and **order** is needed too (“the first 20 by date”, a date range) | sort once and search by halving |
        | records already arrive in order (new days at the end) | keep the array sorted: `push` at the end moves nothing |

        Justify the choice with numbers for **your** workload: how many records, how many lookups, how many changes between them.

  - id: recall-index-snapshot
    kind: review
    title:
      uk: "Пригадай: індекс — це знімок"
      en: "Recall: an index is a snapshot"
    items:
      - id: stale-index
        from: js-12-12-dedup-indexing
        prompt:
          uk: "Індекс побудовано, а потім у список додали витрату. Що виведе консоль?"
          en: "The index was built, and then an expense was added to the list. What does the console print?"
        code: |
          const expenses = [{ id: "e-01", amountMinor: 84550 }];
          const byId = new Map(expenses.map((expense) => [expense.id, expense]));
          expenses.push({ id: "e-02", amountMinor: 52000 });
          console.log(byId.size, byId.get("e-02"));
        verify:
          logs: ["1 undefined"]
        answer:
          type: choice
          options:
            - id: snapshot
              text:
                uk: "`1 undefined`"
                en: "`1 undefined`"
            - id: live
              text:
                uk: "`2 { id: \"e-02\", amountMinor: 52000 }`"
                en: "`2 { id: \"e-02\", amountMinor: 52000 }`"
              why:
                uk: "`Map` не стежить за масивом: його побудували з тих пар, що були на той момент. Нова витрата в індекс не потрапила."
                en: "A `Map` does not watch the array: it was built from the pairs that existed at that moment. The new expense never got into the index."
            - id: error
              text:
                uk: "`TypeError`, бо такого ключа немає"
                en: "A `TypeError`, because there is no such key"
              why:
                uk: "`get` для відсутнього ключа нічого не кидає, а повертає `undefined`."
                en: "`get` for a missing key throws nothing; it returns `undefined`."
          correct: [snapshot]
        explanation:
          uk: "Індекс — знімок списку на момент побудови. Тому в таблиці стратегій індекс має окремий рядок «новий запис»: кожен `push` у список має супроводжуватися `set` в індекс — або індекс треба будувати знову."
          en: "An index is a snapshot of the list at the moment it was built. That is why the index has its own “new record” column in the strategy table: every `push` into the list must come with a `set` into the index — or the index has to be built again."

  - id: binary-search
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: binary-search
    entry: index.js
    editable: [dates.js, dates.test.js]
    strings:
      tMiddle: { uk: "знаходить підсумок посередині", en: "finds a summary in the middle" }
      mMiddle: { uk: "totalMinor підсумку за 2026-02-28", en: "totalMinor of the summary for 2026-02-28" }
      tFirst: { uk: "знаходить перший підсумок", en: "finds the first summary" }
      mFirst: { uk: "підсумок за першу дату", en: "the summary for the first date" }
      tLast: { uk: "знаходить останній підсумок", en: "finds the last summary" }
      mLast: { uk: "підсумок за останню дату", en: "the summary for the last date" }
      tMissing: { uk: "дата між двома наявними дає null", en: "a date between two existing ones gives null" }
      mMissing: { uk: "результат для дати, якої немає", en: "the result for a date that is not there" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Двійковий пошук за датою — з передумовою і тестами"
      en: "Binary search by date — with a precondition and tests"
    instructions:
      uk: |
        1. У `dates.js` допиши `binarySearchByDate(sortedRecords, date)`: двійковим пошуком знайди денний підсумок із цією датою й поверни **сам об’єкт** зі списку; якщо такої дати немає — `null`. У коментарі `Precondition:` своїми словами запиши, яким має бути `sortedRecords`, щоб відповідь була правильною (перевірка чекає там щонайменше три твої слова).
        2. У `dates.test.js` уже є тест для підсумку посередині. Додай ще три: для **першого** підсумку, для **останнього** і для дати, що лежить **між двома наявними** й тому дає `null`.

        **Запустити** виконує твої тести. Перевірка також рахує, скільки разів пошук прочитав поле `date` у списку зі 100 000 підсумків: двійковому пошуку вистачає кількох десятків читань. А ще вона запускає твої тести на трьох зламаних версіях пошуку — кожну має зловити хоча б один твій тест.
      en: |
        1. In `dates.js`, finish `binarySearchByDate(sortedRecords, date)`: use binary search to find the day summary with this date and return **the object itself** from the list; if there is no such date, return `null`. In the `Precondition:` comment, write in your own words what `sortedRecords` must be like for the answer to be right (the check expects at least three words of yours there).
        2. `dates.test.js` already has a test for a summary in the middle. Add three more: for the **first** summary, for the **last** one, and for a date that lies **between two existing ones** and therefore gives `null`.

        **Run** runs your tests. The check also counts how many times the search read the `date` field in a list of 100,000 summaries: binary search needs a few dozen reads. It also runs your tests against three broken versions of the search — each must be caught by at least one of your tests.
    testTitles:
      "finds the first, a middle and the last summary":
        uk: "Знаходить перший, середній і останній підсумки"
        en: "Finds the first, a middle and the last summary"
      "a date that is not in the list gives null":
        uk: "Дата, якої немає в списку, дає `null`"
        en: "A date that is not in the list gives `null`"
      "an empty list and a list of one summary":
        uk: "Порожній список і список з одного підсумку"
        en: "An empty list and a list of one summary"
      "the Precondition comment says what sortedRecords must be":
        uk: "Коментар `Precondition:` каже, яким має бути `sortedRecords`"
        en: "The `Precondition:` comment says what `sortedRecords` must be"
      "it reads only a few dates of 100,000 summaries":
        uk: "Зі 100 000 підсумків читає лише кілька дат"
        en: "It reads only a few dates of 100,000 summaries"
      "your tests pass with a correct binary search":
        uk: "Твої тести проходять із правильним двійковим пошуком"
        en: "Your tests pass with a correct binary search"
      "one of your tests fails when the last summary is never found":
        uk: "Твій тест ловить пошук, що ніколи не знаходить останній підсумок"
        en: "One of your tests fails when the last summary is never found"
      "one of your tests fails when the first summary is never found":
        uk: "Твій тест ловить пошук, що ніколи не знаходить перший підсумок"
        en: "One of your tests fails when the first summary is never found"
      "one of your tests fails when a missing date returns a neighbouring summary":
        uk: "Твій тест ловить пошук, що для відсутньої дати повертає сусідній підсумок"
        en: "One of your tests fails when a missing date returns a neighbouring summary"
    hints:
      nudge:
        uk: "Тримай дві межі — найменший і найбільший номер, де шуканий підсумок ще може бути. Кожне порівняння з серединою має зсувати одну з меж."
        en: "Keep two bounds — the smallest and the largest index where the summary can still be. Every comparison with the middle must move one of the bounds."
      explanation:
        uk: "Згадай пошук слова в паперовому словнику. Розгортаєш посередині: якщо слово на сторінці — готово; якщо шукане слово далі за абеткою, відкидаєш ліву половину разом із цією сторінкою, якщо раніше — праву. Повторюєш, доки лишається хоч одна сторінка; коли не лишилося жодної — слова немає. Найчастіші пастки: зупинитися, коли лишилась ще одна сторінка, і забути «перескочити» середину, через що межа не рухається. Тести на перший і останній елемент ловлять саме їх, а тест на дату між двома наявними — пошук, що повертає «найближче» замість `null`."
        en: "Recall looking up a word in a paper dictionary. You open it in the middle: if the word is on the page, done; if the word comes later in the alphabet, you throw away the left half together with this page, if earlier — the right half. You repeat while at least one page is left; when none is left, the word is not there. The most common traps: stopping while one page is still left, and forgetting to “step past” the middle, so the bound does not move. Tests for the first and the last item catch exactly those, and a test for a date between two existing ones catches a search that returns “the nearest” instead of `null`."
    solutionNote:
      uk: "Межі `low` і `high` — найменший і найбільший номер, де підсумок ще може бути, тож цикл працює, доки `low <= high`: навіть один кандидат треба перевірити. Після порівняння середина відкидається (`middle + 1` або `middle - 1`), інакше межа може застрягнути. Передумова — відсортовано за датою за зростанням, по одному підсумку на дату: двійковий пошук не помітить, якщо це не так, тому її записують там, де її побачить той, хто викликає функцію. Тести на перший, останній і відсутній елемент — саме ті граничні випадки, де двійковий пошук ламається найчастіше."
      en: "The bounds `low` and `high` are the smallest and the largest index where the summary can still be, so the loop runs while `low <= high`: even a single candidate has to be checked. After the comparison the middle is thrown away (`middle + 1` or `middle - 1`), otherwise a bound can get stuck. The precondition — sorted by date ascending, one summary per date: binary search will not notice if that is false, which is why it is written where the caller will see it. Tests for the first, the last and a missing item are exactly the boundary cases where binary search breaks most often."
    feedback:
      - when: { test: "finds the first, a middle and the last summary" }
        message:
          uk: "Ця перевірка шукає першу, середню й останню дати в списку із семи підсумків і чекає **ті самі об’єкти** зі списку. Якщо не знаходиться перший чи останній, перевір дві речі: межі починаються з `0` і `sortedRecords.length - 1`, а цикл працює й тоді, коли межі збіглися — лишився ще один кандидат."
          en: "This check looks up the first, a middle and the last date in a list of seven summaries and expects **the very objects** from the list. If the first or the last one is not found, check two things: the bounds start at `0` and `sortedRecords.length - 1`, and the loop also runs when the bounds meet — one candidate is still left."
      - when: { test: "a date that is not in the list gives null" }
        message:
          uk: "Ця перевірка шукає `2026-02-29` (між двома датами списку), дату до першої й дату після останньої та чекає `null` для кожної. Якщо приходить підсумок, пошук повертає найближчий елемент замість `null`; якщо `undefined` — бракує `return null` після циклу."
          en: "This check looks up `2026-02-29` (between two dates of the list), a date before the first and a date after the last, and expects `null` for each. If a summary comes back, the search returns the nearest item instead of `null`; if `undefined`, a `return null` after the loop is missing."
      - when: { test: "an empty list and a list of one summary" }
        message:
          uk: "Ця перевірка чекає `null` для порожнього списку, сам підсумок для списку з одного, якщо дата збігається, і `null`, якщо ні. Якщо тут `TypeError`, пошук читає `date` елемента, якого немає: перевір умову циклу на порожньому списку."
          en: "This check expects `null` for an empty list, the summary itself for a list of one when the date matches, and `null` when it does not. If a `TypeError` appears here, the search reads `date` of an item that does not exist: check the loop condition on an empty list."
      - when: { test: "the Precondition comment says what sortedRecords must be" }
        message:
          uk: "Ця перевірка шукає в `dates.js` коментар `Precondition:` і чекає після нього щонайменше три твої слова замість заготовки «(write here …)». Залиш саме слово `Precondition:` і допиши після нього, яким має бути `sortedRecords`, щоб двійковий пошук відповідав правильно. Мова й формулювання — твої."
          en: "This check looks for the `Precondition:` comment in `dates.js` and expects at least three of your own words after it instead of the placeholder “(write here …)”. Keep the word `Precondition:` and write after it what `sortedRecords` must be like for binary search to answer correctly. The language and the wording are yours."
      - when: { test: "it reads only a few dates of 100,000 summaries" }
        message:
          uk: "Ця перевірка шукає дату в списку зі 100 000 підсумків і чекає правильний підсумок не більш ніж за 60 читань поля `date`. Якщо читань більше, пошук переглядає записи по одному (`find`, цикл від початку) замість ділити діапазон навпіл."
          en: "This check looks up a date in a list of 100,000 summaries and expects the right summary within at most 60 reads of the `date` field. If there are more reads, the search looks at records one by one (`find`, a loop from the start) instead of halving the range."
      - when: { test: "your tests pass with a correct binary search" }
        message:
          uk: "Ця перевірка запускає твої тести з `dates.test.js` на правильному двійковому пошуку й чекає, що всі пройдуть. Якщо якийсь падає, у ньому неправильне очікування — наприклад, `toBe` для копії об’єкта замість самого підсумку зі списку."
          en: "This check runs your tests from `dates.test.js` against a correct binary search and expects all of them to pass. If one fails, it has a wrong expectation — for example, `toBe` with a copy of an object instead of the summary from the list itself."
      - when: { test: "one of your tests fails when the last summary is never found" }
        message:
          uk: "Ця перевірка спершу запускає твої тести на правильному пошуку (вони мають пройти), а потім чекає, що хоча б один із них упаде на пошуку, який ніколи не знаходить **останній** підсумок. Додай тест, що шукає останню дату списку."
          en: "This check first runs your tests on a correct search (they must pass), then expects at least one of them to fail on a search that never finds the **last** summary. Add a test that looks up the last date of the list."
      - when: { test: "one of your tests fails when the first summary is never found" }
        message:
          uk: "Ця перевірка спершу запускає твої тести на правильному пошуку (вони мають пройти), а потім чекає, що хоча б один із них упаде на пошуку, який ніколи не знаходить **перший** підсумок. Додай тест, що шукає першу дату списку."
          en: "This check first runs your tests on a correct search (they must pass), then expects at least one of them to fail on a search that never finds the **first** summary. Add a test that looks up the first date of the list."
      - when: { test: "one of your tests fails when a missing date returns a neighbouring summary" }
        message:
          uk: "Ця перевірка спершу запускає твої тести на правильному пошуку (вони мають пройти), а потім чекає, що хоча б один із них упаде на пошуку, який для відсутньої дати повертає сусідній підсумок. Шукай дату, що лежить **між** двома датами списку, і чекай `null` — дата після останньої цю помилку не покаже."
          en: "This check first runs your tests on a correct search (they must pass), then expects at least one of them to fail on a search that returns a neighbouring summary for a missing date. Look up a date that lies **between** two dates of the list and expect `null` — a date after the last one does not reveal this mistake."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` у пошуку найчастіше означає читання `date` елемента, якого немає: номер вийшов за межі масиву. Перевір, що середина завжди лежить між `low` і `high`. Якщо перевірки пишуть `type of the binarySearchByDate export of dates.js: expected \"undefined\" to be \"function\"`, з `dates.js` зник експорт `binarySearchByDate`."
          en: "A `TypeError` in the search most often means reading `date` of an item that does not exist: the index went outside the array. Check that the middle always lies between `low` and `high`. If the checks say `type of the binarySearchByDate export of dates.js: expected \"undefined\" to be \"function\"`, the `binarySearchByDate` export disappeared from `dates.js`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-17
    body:
      uk: "Подивись на пошуки свого проєкту: за чим ти шукаєш, як часто, і як часто змінюється список? У кроці проєкту ти заміниш одне квадратичне перетворення на індекс — і цифри з цього уроку допоможуть пояснити, чому саме індекс, а не сортування."
      en: "Look at your project’s lookups: what do you search by, how often, and how often does the list change? In the project step you will replace one quadratic transform with an index — and the numbers from this lesson will help explain why an index and not sorting."
