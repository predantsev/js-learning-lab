  - id: walks
    kind: example
    runtime: browser-js
    dir: walks
    entry: index.js
    strings:
      all: { uk: "Усе", en: "All" }
      home: { uk: "Дім", en: "Home" }
      kitchen: { uk: "Кухня", en: "Kitchen" }
      lighting: { uk: "Освітлення", en: "Lighting" }
      hobby: { uk: "Хобі", en: "Hobby" }
      sport: { uk: "Спорт", en: "Sport" }
      books: { uk: "Книжки", en: "Books" }
      stackWalk: { uk: "Стек (углиб):", en: "Stack (depth-first):" }
      queueWalk: { uk: "Черга (вшир):", en: "Queue (breadth-first):" }
      headIndex: { uk: "індекс голови:", en: "head index:" }
    title:
      uk: "Два обходи і ціна shift()"
      en: "Two walks and the price of shift()"
    body:
      uk: |
        Запусти програму. Перші два рядки — порядки обходу, які ти передбачав. Далі — вимірювання: програма спорожнює чергу з `n` збережень двома способами й показує час.

        - `shift()` забирає перший елемент, а решта масиву **зсувається** на одне місце вперед — так велять правила мови. Chrome для не надто великих масивів уміє цей зсув оминути, тож ціну `shift()` варто виміряти, а не вивести з правила.
        - **Індекс голови** (`head`) нічого не зсуває: це лише номер наступного елемента, який треба забрати, і він росте на 1.

        `performance.now()` дає поточний час у мілісекундах, а `toFixed(1)` записує число з одним знаком після крапки.
      en: |
        Run the program. The first two lines are the walk orders you predicted. Then comes a measurement: the program empties a queue of `n` saves in two ways and shows the time.

        - `shift()` takes the first item, and the rest of the array **moves** one place forward — that is what the language rules say. For arrays that are not too big Chrome can skip that move, so the cost of `shift()` is worth measuring rather than deriving from the rule.
        - A **head index** (`head`) moves nothing: it is only the number of the next item to take, and it grows by 1.

        `performance.now()` gives the current time in milliseconds, and `toFixed(1)` writes a number with one digit after the point.
    tryIt:
      uk: |
        1. У `walkWithStack` заміни `stack.pop()` на `stack.shift()` і запусти. Цикл той самий, але тепер це черга: обхід іде рівнями, справа наліво, бо дітей кладуть від останньої.
        2. Поверни `pop()`. Запусти програму ще двічі й запиши три рядки вимірювань. Не вгадуй — подивись: при 1 000 і 10 000 `shift()` майже нічого не коштує, а при 30 000 — понад сто разів більше, хоча даних лише втричі більше. Це не плавне зростання, а стрибок: до певного розміру Chrome оминає зсув, а далі справді зсуває весь масив на кожному `shift()`. Так поводиться Chrome на цьому прикладі; інший браузер чи інша машина дадуть інші числа й інший поріг.
        3. Додай у список розмірів `60000` і запусти. Якщо цикл працюватиме довше 2 секунд, платформа зупинить його з `LoopBudgetError` — це теж результат вимірювання. Прибери `60000`, коли подивишся.
      en: |
        1. In `walkWithStack`, replace `stack.pop()` with `stack.shift()` and run. The loop is the same, but now it is a queue: the walk goes level by level, right to left, because the children are added from the last one.
        2. Bring back `pop()`. Run the program twice more and write down the three measurement lines. Do not guess — look: at 1,000 and 10,000, `shift()` costs almost nothing, while at 30,000 it costs more than a hundred times as much, although there is only three times as much data. That is not smooth growth but a jump: up to some size Chrome skips the move, and past it every `shift()` really moves the whole array. That is how Chrome behaves on this example; another browser or another machine gives other numbers and another threshold.
        3. Add `60000` to the list of sizes and run. If the loop runs longer than 2 seconds, the platform stops it with `LoopBudgetError` — that is a measurement result too. Remove `60000` once you have seen it.

  - id: recall-bounded-walk
    kind: review
    strings:
      all: { uk: "Усе", en: "All" }
      home: { uk: "Дім", en: "Home" }
      plants: { uk: "Рослини", en: "Plants" }
      bills: { uk: "Рахунки", en: "Bills" }
      work: { uk: "Робота", en: "Work" }
    title:
      uk: "Пригадай: обхід із межею глибини"
      en: "Recall: a walk with a depth limit"
    items:
      - id: count-with-limit
        from: js-03-10-independent-transforms
        prompt:
          uk: "Дерево справ має три рівні. Що виведе консоль? Впиши два числа через пробіл."
          en: "The task tree has three levels. What does the console print? Type two numbers separated by a space."
        code: |
          const leaf = (label) => ({ label, left: null, right: null });
          const tasks = {
            label: "%%all%%",
            left: { label: "%%home%%", left: leaf("%%plants%%"), right: leaf("%%bills%%") },
            right: leaf("%%work%%"),
          };

          function countNodes(node, maxDepth) {
            if (node === null || maxDepth === 0) {
              return 0;
            }
            return 1 + countNodes(node.left, maxDepth - 1) + countNodes(node.right, maxDepth - 1);
          }

          console.log(countNodes(tasks, 2), countNodes(tasks, 0));
        verify:
          logs: ["3 0"]
        answer:
          type: text
          accept: ["3 0", "3, 0"]
          placeholder: { uk: "два числа", en: "two numbers" }
        explanation:
          uk: "З `maxDepth` 2 рахуються лише два рівні: корінь і його двоє дітей — 3 вузли. На третьому рівні `maxDepth` стає `0`, і виклик повертає `0`, не заходячи глибше. З `maxDepth` 0 межа спрацьовує одразу на корені. Межа глибини — перший запобіжник рекурсивного обходу; скоро ти побачиш, чому одного базового випадку буває замало."
          en: "With `maxDepth` 2, only two levels count: the root and its two children — 3 nodes. On the third level `maxDepth` becomes `0`, and the call returns `0` without going deeper. With `maxDepth` 0 the limit fires right at the root. A depth limit is the first safeguard of a recursive walk; soon you will see why a base case alone is sometimes not enough."

  - id: undo-and-saves
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: undo-and-saves
    entry: index.js
    strings:
      v1: { uk: "Полити квіти", en: "Water the plants" }
      v2: { uk: "Полити квіти й фікус", en: "Water the plants and the fig" }
      v3: { uk: "Полити квіти о 9:00", en: "Water the plants at 9:00" }
    title:
      uk: "Скасування і черга збережень"
      en: "Undo and a queue of saves"
    instructions:
      uk: |
        У планувальнику людина редагує назву справи. Допиши чотири функції в `index.js`:

        1. `recordChange(history, snapshot)` дописує назву, якою справа була до зміни, **у кінець** масиву `history`, тож найстаріша зміна лежить на початку.
        2. `undo(history)` забирає з `history` **найновіший** запис і повертає його. Якщо скасовувати нічого, повертає `null`.
        3. `enqueueSave(queue, save, limit)` ставить збереження `save` у кінець черги. Якщо в черзі вже `limit` збережень, спершу викидає **найстаріше** й повертає його; інакше повертає `null`.
        4. `nextSave(queue)` забирає й повертає найстаріше збереження, а для порожньої черги — `null`.

        Останні рядки файлу викликають ці функції. Коли все готово, консоль покаже `Полити квіти о 9:00 | Полити квіти й фікус` і `save-3 save-4`.
      en: |
        In the planner, a person edits a task’s title. Finish four functions in `index.js`:

        1. `recordChange(history, snapshot)` appends the title the task had before the change **to the end** of the `history` array, so the oldest change is at the start.
        2. `undo(history)` takes the **newest** entry out of `history` and returns it. When there is nothing to undo, it returns `null`.
        3. `enqueueSave(queue, save, limit)` puts the save `save` at the end of the queue. If the queue already holds `limit` saves, it first throws out the **oldest** one and returns it; otherwise it returns `null`.
        4. `nextSave(queue)` takes out and returns the oldest save, and `null` for an empty queue.

        The last lines of the file call these functions. When everything is ready, the console shows `Water the plants at 9:00 | Water the plants and the fig` and `save-3 save-4`.
    testTitles:
      "recordChange keeps every snapshot in order":
        uk: "`recordChange` зберігає кожну назву в порядку змін"
        en: "`recordChange` keeps every snapshot in order"
      "undo gives the most recent change first":
        uk: "`undo` спершу повертає найновішу зміну"
        en: "`undo` gives the most recent change first"
      "undo on an empty history gives null":
        uk: "`undo` для порожньої історії повертає `null`"
        en: "`undo` on an empty history gives `null`"
      "saves leave the queue in the order they arrived":
        uk: "Збереження виходять із черги в тому порядку, в якому прийшли"
        en: "Saves leave the queue in the order they arrived"
      "nextSave on an empty queue gives null":
        uk: "`nextSave` для порожньої черги повертає `null`"
        en: "`nextSave` on an empty queue gives `null`"
      "a full queue drops the oldest save and returns it":
        uk: "Повна черга викидає найстаріше збереження й повертає його"
        en: "A full queue drops the oldest save and returns it"
      "a queue that reaches its limit drops nothing":
        uk: "Черга, що лише дійшла до межі, нічого не викидає"
        en: "A queue that reaches its limit drops nothing"
    hints:
      nudge:
        uk: "Для кожної функції спершу виріши, з якого кінця масиву вона забирає: «скасувати» — з того самого, куди щойно поклали, черга — з протилежного."
        en: "For each function, first decide which end of the array it takes from: “undo” from the same end where you just put something, a queue from the opposite one."
      explanation:
        uk: "Подумай про стос тарілок і чергу в касу. Нову тарілку ставлять зверху й беруть теж зверху — це `push` і `pop`. У черзі новенький стає в кінець, а обслуговують першого — це `push` і `shift`. Обидва методи на порожньому масиві повертають `undefined`, а завдання просить `null`, тож перевір довжину масиву перед тим, як забирати. Для обмеженої черги порівняй довжину з `limit` **до** того, як додати нове збереження: якщо місця вже немає, звільни його з того кінця, де стоїть найстаріше."
        en: "Think of a pile of plates and a checkout line. A new plate goes on top and is taken from the top — that is `push` and `pop`. In a line a newcomer joins the end, and the first one is served — that is `push` and `shift`. On an empty array both methods return `undefined`, while the task asks for `null`, so check the array’s length before taking. For the bounded queue, compare the length with `limit` **before** adding the new save: if there is no room left, free it at the end where the oldest one stands."
    solutionNote:
      uk: "`undo` бере з кінця (`pop`) — тому повертає найновішу зміну, як `Ctrl+Z`. Черга бере з початку (`shift`), тож збереження йдуть у тому порядку, в якому їх зробили, і повна черга жертвує найстарішим, а не свіжим. Довжину порівнюють до `push`: при `limit` 3 третє збереження ще вміщується, а четверте витісняє перше. Для черги з кількох збережень `shift` цілком годиться; індекс голови потрібен, коли черга тримає десятки тисяч елементів — і це варто виміряти, а не вгадувати."
      en: "`undo` takes from the end (`pop`) — so it returns the newest change, like `Ctrl+Z`. The queue takes from the start (`shift`), so the saves go in the order they were made, and a full queue sacrifices the oldest one, not the fresh one. The length is compared before `push`: with `limit` 3 the third save still fits, and the fourth pushes out the first. For a queue of a few saves `shift` is perfectly fine; a head index is needed when the queue holds tens of thousands of items — and that is worth measuring, not guessing."
    feedback:
      - when: { test: "undo gives the most recent change first" }
        message:
          uk: "Ця перевірка дає історію `[Полити квіти, Полити квіти й фікус, Полити квіти о 9:00]` і чекає, що перший `undo` поверне `Полити квіти о 9:00`, а другий — `Полити квіти й фікус`. Якщо приходить `Полити квіти`, функція бере з початку масиву (`shift`), а скасування бере з кінця."
          en: "This check passes the history `[Water the plants, Water the plants and the fig, Water the plants at 9:00]` and expects the first `undo` to return `Water the plants at 9:00` and the second `Water the plants and the fig`. If `Water the plants` comes back, the function takes from the start of the array (`shift`), while undo takes from the end."
      - when: { test: "undo on an empty history gives null" }
        message:
          uk: "Ця перевірка викликає `undo([])` і чекає саме `null`. `pop()` на порожньому масиві дає `undefined`, тож спершу перевір, чи є що скасовувати."
          en: "This check calls `undo([])` and expects exactly `null`. `pop()` on an empty array gives `undefined`, so first check whether there is anything to undo."
      - when: { test: "nextSave on an empty queue gives null" }
        message:
          uk: "Ця перевірка викликає `nextSave([])` і чекає саме `null`. `shift()` на порожньому масиві дає `undefined`."
          en: "This check calls `nextSave([])` and expects exactly `null`. `shift()` on an empty array gives `undefined`."
      - when: { test: "a full queue drops the oldest save and returns it" }
        message:
          uk: "Ця перевірка дає чергу `save-1`, `save-2`, `save-3` з межею 3, додає `save-4` і чекає, що `enqueueSave` поверне `save-1`, а в черзі лишаться `save-2`, `save-3`, `save-4`. Якщо в черзі немає `save-4`, функція відкидає нове збереження замість найстарішого."
          en: "This check passes the queue `save-1`, `save-2`, `save-3` with limit 3, adds `save-4` and expects `enqueueSave` to return `save-1`, leaving `save-2`, `save-3`, `save-4` in the queue. If `save-4` is not in the queue, the function throws away the new save instead of the oldest one."
      - when: { test: "a queue that reaches its limit drops nothing" }
        message:
          uk: "Ця перевірка додає три збереження в порожню чергу з межею 3 і чекає від кожного виклику `null` та всіх трьох у черзі. Якщо третє збереження щось витісняє, порівняння з `limit` спрацьовує на одне раніше: черга має право тримати рівно `limit` збережень."
          en: "This check adds three saves to an empty queue with limit 3 and expects `null` from every call and all three in the queue. If the third save pushes something out, the comparison with `limit` fires one step too early: the queue may hold exactly `limit` saves."
      - when: { test: "recordChange keeps every snapshot in order" }
        message:
          uk: "Ця перевірка двічі викликає `recordChange` з порожньою історією й чекає `[Полити квіти, Полити квіти й фікус]` — найстаріша назва на початку, найновіша в кінці. Якщо назви стоять навпаки, функція кладе їх на початок масиву (`unshift`), а не в кінець."
          en: "This check calls `recordChange` twice on an empty history and expects `[Water the plants, Water the plants and the fig]` — the oldest title at the start, the newest at the end. If the titles come in the opposite order, the function puts them at the start of the array (`unshift`) instead of the end."
      - when: { test: "saves leave the queue in the order they arrived" }
        message:
          uk: "Ця перевірка ставить у чергу `save-1`, потім `save-2` і чекає, що перший `nextSave` поверне `save-1`. Якщо приходить `save-2`, `nextSave` бере з кінця масиву (`pop`), як стек, а черга віддає те, що чекає найдовше, — з початку."
          en: "This check queues `save-1`, then `save-2`, and expects the first `nextSave` to return `save-1`. If `save-2` comes back, `nextSave` takes from the end of the array (`pop`), like a stack, while a queue gives back what has waited longest — from the start."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` з’являється, коли щось викликають як функцію, хоча це не функція, або читають властивість `undefined`. Якщо всі перевірки падають одночасно з повідомленням `type of …: expected \"undefined\" to be \"function\"`, програма впала ще під час завантаження: виправ першу помилку в консолі. Чотири функції мають лишитися оголошеними з тими самими назвами."
          en: "A `TypeError` appears when something that is not a function is called as one, or a property of `undefined` is read. If every check fails at once with `type of …: expected \"undefined\" to be \"function\"`, the program crashed while loading: fix the first error in the console. The four functions must stay declared under the same names."

  - id: to-project
    kind: transfer
    capstoneStep: JS-17
    body:
      uk: "У проєкті вже є і списки, і черги, навіть якщо ти так їх не називав: історія змін для «скасувати», збереження, що чекають, вкладені категорії. У кроці проєкту цього розділу ти виміряєш, що з ними стається на десятках тисяч синтетичних записів."
      en: "Your project already has lists and queues, even if you did not call them that: a change history for “undo”, saves that wait, nested categories. In this unit’s project step you will measure what happens to them with tens of thousands of synthetic records."
