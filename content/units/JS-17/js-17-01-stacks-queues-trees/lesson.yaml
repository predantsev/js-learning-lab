    title:
      uk: "Стек і черга на тому самому дереві"
      en: "A stack and a queue on the same tree"
    textEquivalent:
      uk: "Дерево записане як об’єкт children: для кожної назви — масив назв її дітей. Обхід углиб починається зі стеку, де лежить лише «%%all%%». Кожен крок забирає назву з кінця стеку через pop, дописує її в depthFirst і кладе на стек дітей цього вузла від останньої до першої. Після «%%all%%» на стеку «%%hobby%%», «%%home%%»; pop бере «%%home%%», і стек стає «%%hobby%%», «%%lighting%%», «%%kitchen%%». Далі виходять «%%kitchen%%» і «%%lighting%%», і лише тоді «%%hobby%%», а за ним «%%sport%%» і «%%books%%». Обхід ушир починається з черги з «%%all%%». Кожен крок забирає назву з початку через shift і дописує дітей у кінець. Після «%%home%%» черга — «%%hobby%%», «%%kitchen%%», «%%lighting%%», тож наступним виходить «%%hobby%%», і лише потім діти «%%home%%». Консоль показує два порядки: углиб — %%all%% → %%home%% → %%kitchen%% → %%lighting%% → %%hobby%% → %%sport%% → %%books%%; ушир — %%all%% → %%home%% → %%hobby%% → %%kitchen%% → %%lighting%% → %%sport%% → %%books%%."
      en: "The tree is written as the object children: for every name, an array of the names of its children. The depth-first walk starts with a stack holding only “%%all%%”. Every step takes a name from the end of the stack with pop, appends it to depthFirst and pushes that node’s children from the last to the first. After “%%all%%” the stack holds “%%hobby%%”, “%%home%%”; pop takes “%%home%%”, and the stack becomes “%%hobby%%”, “%%lighting%%”, “%%kitchen%%”. Next “%%kitchen%%” and “%%lighting%%” leave, and only then “%%hobby%%”, followed by “%%sport%%” and “%%books%%”. The breadth-first walk starts with a queue holding “%%all%%”. Every step takes a name from the start with shift and appends the children at the end. After “%%home%%” the queue is “%%hobby%%”, “%%kitchen%%”, “%%lighting%%”, so “%%hobby%%” leaves next, and only then the children of “%%home%%”. The console shows the two orders: depth-first — %%all%% → %%home%% → %%kitchen%% → %%lighting%% → %%hobby%% → %%sport%% → %%books%%; breadth-first — %%all%% → %%home%% → %%hobby%% → %%kitchen%% → %%lighting%% → %%sport%% → %%books%%."
