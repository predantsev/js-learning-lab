id: js-17-01-stacks-queues-trees
unit: JS-17
title:
  uk: "Списки, стеки, черги та обхід дерева"
  en: "Lists, stacks, queues and tree traversal"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Реалізувати стек і чергу для операцій із записами та передбачити, у якому порядку з кожного виходять елементи."
    en: "Implement a stack and a queue for record operations and predict the order in which items leave each."
  - uk: "Обійти вкладене дерево категорій углиб — явним стеком — і вшир — чергою, та передбачити порядок відвідування в кожному разі."
    en: "Walk a nested category tree depth-first with an explicit stack and breadth-first with a queue, and predict each visit order."
prerequisites: [js-04-01-arrays-basics, js-03-08-recursion-base-case]
subskills:
  - { family: J-13, skill: "lists/maps/sets/stacks/queues/tree traversal", depth: intro }
glossary: [lifo-stack, fifo-queue, depth-first-traversal, breadth-first-traversal]
selfCheck: [predict-orders, undo-and-saves]

blocks:
  - id: two-ends
    kind: explanation
    title:
      uk: "Звідки брати: з кінця чи з початку"
      en: "Where to take from: the end or the start"
    body:
      uk: |
        Масив уміє додавати й забирати елементи з обох кінців. Від того, **з якого кінця ти забираєш**, залежить порядок, у якому елементи виходять:

        | Структура | Додати | Забрати | Хто виходить першим |
        |---|---|---|---|
        | [[lifo-stack\|стек]] | `push` у кінець | `pop` з кінця | доданий **останнім** |
        | [[fifo-queue\|черга]] | `push` у кінець | `shift` з початку | доданий **першим** |

        Стек — це «скасувати»: `Ctrl+Z` повертає **останню** зміну, потім передостанню. Черга — це збереження, що чекають на мережу: першим має піти те, що чекає найдовше, інакше старіша версія запису перезапише новішу.

        Обидві — звичайні масиви. Різниця лише в тому, яку пару методів ти обрав. Але ця різниця змінює, що станеться з деревом, якщо обходити його за допомогою стеку чи черги.
      en: |
        An array can add and take items at both ends. **Which end you take from** decides the order in which the items leave:

        | Structure | Add | Take | Who leaves first |
        |---|---|---|---|
        | [[lifo-stack\|stack]] | `push` at the end | `pop` from the end | the one added **last** |
        | [[fifo-queue\|queue]] | `push` at the end | `shift` from the start | the one added **first** |

        A stack is “undo”: `Ctrl+Z` brings back the **latest** change, then the one before it. A queue is saves waiting for the network: the one that has waited longest must go first, otherwise an older version of a record overwrites a newer one.

        Both are ordinary arrays. The only difference is the pair of methods you chose. But that difference changes what happens to a tree when you walk it with a stack or with a queue.

  - id: predict-orders
    kind: prediction
    strings:
      all: { uk: "Усе", en: "All" }
      home: { uk: "Дім", en: "Home" }
      kitchen: { uk: "Кухня", en: "Kitchen" }
      lighting: { uk: "Освітлення", en: "Lighting" }
      hobby: { uk: "Хобі", en: "Hobby" }
      sport: { uk: "Спорт", en: "Sport" }
      books: { uk: "Книжки", en: "Books" }
    prompt:
      uk: "Дерево категорій списку бажань: «Усе» → «Дім» (кухня, освітлення) і «Хобі» (спорт, книжки). Дві функції обходять його однаковим циклом, але одна бере вузли зі стеку через `pop`, а друга з черги через `shift`. Що виведуть два `console.log`?"
      en: "A wishlist category tree: “All” → “Home” (kitchen, lighting) and “Hobby” (sport, books). Two functions walk it with the same loop, but one takes nodes from a stack with `pop` and the other from a queue with `shift`. What do the two `console.log` calls print?"
    code: |
      const leaf = (name) => ({ name, children: [] });
      const tree = {
        name: "%%all%%",
        children: [
          { name: "%%home%%", children: [leaf("%%kitchen%%"), leaf("%%lighting%%")] },
          { name: "%%hobby%%", children: [leaf("%%sport%%"), leaf("%%books%%")] },
        ],
      };

      function walkWithStack(root) {
        const order = [];
        const stack = [root];
        while (stack.length > 0) {
          const node = stack.pop();
          order.push(node.name);
          // From the last child to the first, so that the first child is on top.
          for (let i = node.children.length - 1; i >= 0; i--) {
            stack.push(node.children[i]);
          }
        }
        return order;
      }

      function walkWithQueue(root) {
        const order = [];
        const queue = [root];
        while (queue.length > 0) {
          const node = queue.shift();
          order.push(node.name);
          for (const child of node.children) {
            queue.push(child);
          }
        }
        return order;
      }

      console.log(walkWithStack(tree).join(", "));
      console.log(walkWithQueue(tree).join(", "));
    verify:
      logs:
        - "%%all%%, %%home%%, %%kitchen%%, %%lighting%%, %%hobby%%, %%sport%%, %%books%%"
        - "%%all%%, %%home%%, %%hobby%%, %%kitchen%%, %%lighting%%, %%sport%%, %%books%%"
    answer:
      type: choice
      options:
        - id: deep-then-wide
          text:
            uk: "Стек: Усе, Дім, Кухня, Освітлення, Хобі, Спорт, Книжки. Черга: Усе, Дім, Хобі, Кухня, Освітлення, Спорт, Книжки"
            en: "Stack: All, Home, Kitchen, Lighting, Hobby, Sport, Books. Queue: All, Home, Hobby, Kitchen, Lighting, Sport, Books"
        - id: same-order
          text:
            uk: "Обидва однаково: Усе, Дім, Кухня, Освітлення, Хобі, Спорт, Книжки"
            en: "Both the same: All, Home, Kitchen, Lighting, Hobby, Sport, Books"
          why:
            uk: "Цикл однаковий, але `pop` і `shift` беруть з різних кінців. Стек одразу бере щойно додані діти «Дому», а черга спершу доходить до «Хобі», яке чекало довше."
            en: "The loop is the same, but `pop` and `shift` take from different ends. The stack takes the freshly added children of “Home” at once, while the queue first gets to “Hobby”, which has been waiting longer."
        - id: swapped
          text:
            uk: "Стек: Усе, Дім, Хобі, Кухня, Освітлення, Спорт, Книжки. Черга: Усе, Дім, Кухня, Освітлення, Хобі, Спорт, Книжки"
            en: "Stack: All, Home, Hobby, Kitchen, Lighting, Sport, Books. Queue: All, Home, Kitchen, Lighting, Hobby, Sport, Books"
          why:
            uk: "Навпаки: `pop` бере доданий останнім — це діти щойно відвіданого вузла, тож стек іде вглиб. `shift` бере доданий першим, тож черга проходить рівень за рівнем."
            en: "The other way round: `pop` takes the one added last — the children of the node just visited — so the stack goes deep. `shift` takes the one added first, so the queue goes level by level."
        - id: reversed-stack
          text:
            uk: "Стек: Усе, Хобі, Книжки, Спорт, Дім, Освітлення, Кухня. Черга: Усе, Дім, Хобі, Кухня, Освітлення, Спорт, Книжки"
            en: "Stack: All, Hobby, Books, Sport, Home, Lighting, Kitchen. Queue: All, Home, Hobby, Kitchen, Lighting, Sport, Books"
          why:
            uk: "Так було б, якби діти клали на стек від першого до останнього. Тут цикл кладе їх від останнього, тож першою дитиною на вершині опиняється «Дім»."
            en: "That would happen if the children were pushed from the first to the last. Here the loop pushes them from the last, so the first child, “Home”, ends up on top."
      correct: [deep-then-wide]
    explanation:
      uk: "Стек віддає те, що додали останнім: після «Усе» на вершині лежить «Дім», після «Дому» — «Кухня». Обхід іде вглиб гілки й повертається до «Хобі», лише коли «Дім» вичерпано. Черга віддає те, що чекає найдовше: «Хобі» потрапило в чергу раніше за дітей «Дому», тож вийде раніше. Обхід іде рівнями."
      en: "A stack gives back what was added last: after “All”, “Home” is on top; after “Home”, “Kitchen”. The walk goes deep into a branch and returns to “Hobby” only when “Home” is used up. A queue gives back what has waited longest: “Hobby” entered the queue before the children of “Home”, so it leaves earlier. The walk goes level by level."

  - id: walk-order
    kind: explanation
    title:
      uk: "Углиб і вшир"
      en: "Depth-first and breadth-first"
    body:
      uk: |
        Ти щойно побачив два способи обійти дерево:

        - [[depth-first-traversal|обхід углиб]] (depth-first) — стек: спершу вся гілка до кінця, потім сусідня. Так шукають вкладену категорію або рахують вузли однієї гілки;
        - [[breadth-first-traversal|обхід ушир]] (breadth-first) — черга: спершу всі вузли першого рівня, потім другого. Так показують «найближчі» категорії першими або шукають найкоротший шлях.

        У JS-03 ти обходив дерево [[recursion|рекурсією]]. Рекурсивний обхід — теж углиб: роль стеку там виконує [[call-stack|стек викликів]]. Явний стек робить те саме, але ти сам вирішуєш, що в ньому лежить, і він не впирається в ліміт стеку викликів — до цього ми повернемося в уроці про обмежену рекурсію.
      en: |
        You have just seen two ways to walk a tree:

        - [[depth-first-traversal|depth-first]] — a stack: a whole branch to its end first, then the next one. Used to find a nested category or count the nodes of one branch;
        - [[breadth-first-traversal|breadth-first]] — a queue: all nodes of the first level first, then the second. Used to show the “nearest” categories first or to find the shortest path.

        In JS-03 you walked a tree with [[recursion]]. A recursive walk is depth-first too: the [[call-stack]] plays the stack’s role there. An explicit stack does the same, but you decide what lies in it, and it does not run into the call stack’s limit — we come back to that in the lesson on bounded recursion.

