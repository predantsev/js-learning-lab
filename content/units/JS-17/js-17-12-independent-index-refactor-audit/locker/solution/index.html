<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%heading%%</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1.5rem; color: #1f2328; }
      form { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
      input, button { font: inherit; padding: 0.3rem 0.5rem; }
      #waiting { padding-left: 1.2rem; }
      #waiting button { margin-left: 0.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>%%heading%%</h1>
      <form id="lookup-form">
        <label for="lookup">%%codeLabel%%</label>
        <input id="lookup" name="code" placeholder="%%codePlaceholder%%" autocomplete="off">
        <button type="submit">%%find%%</button>
      </form>
      <p id="status" role="status"></p>
      <button type="button" id="load-day">%%loadDay%%</button>
      <h2 id="waiting-heading" tabindex="-1">%%waitingHeading%%</h2>
      <ul id="waiting"></ul>
    </main>
    <script type="module" src="ui/page.js"></script>
    <script type="module" src="run-tests.js"></script>
  </body>
</html>
