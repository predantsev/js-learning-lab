id: js-17-12-independent-index-refactor-audit
unit: JS-17
title:
  uk: "Самостійно: індекс чи черга, рефакторинг, аудит інтерфейсу"
  en: "Independent: index or queue, refactor, UI audit"
kind: assessment
minutes: 35
contentVersion: 1
objectives:
  - uk: "Без підказок обрати й реалізувати індекс чи чергу для незнайомого синтетичного навантаження — з тестами й виміряними доказами на трьох розмірах даних."
    en: "Select and implement, without hints, an index or a queue for an unseen synthetic workload, with tests and measured evidence at three data sizes."
  - uk: "Перебудувати модуль за чистим інтерфейсом, задокументувати рішення й перевірити запропонований diff того самого модуля."
    en: "Refactor the surrounding module behind a clean interface, document the decision and review a provided diff of it."
  - uk: "Перевірити отриманий інтерфейс клавіатурою й скринрідером і покращити одне виміряне вузьке місце, не втративши доступності."
    en: "Audit the resulting UI by keyboard and screen reader, and improve one measured bottleneck without losing accessibility."
purpose:
  uk: "Перевірити, що ідеї розділу працюють разом і без підказок на незнайомому завданні: вибір структури даних за навантаженням, вимірювання на кількох розмірах, рефакторинг за інтерфейсом під захистом тестів, доступність після змін, запис рішення й рев’ю."
  en: "Check that the unit’s ideas work together and without hints on an unfamiliar task: choosing a data structure by workload, measuring at several sizes, refactoring behind an interface under tests, accessibility after the changes, a decision record and a review."
prerequisites: [ js-17-11-debug-quadratic-work ]
subskills:
  - { family: J-13, skill: "lists/maps/sets/stacks/queues/tree traversal", depth: assess }
  - { family: J-13, skill: "sorting/search decisions", depth: assess }
  - { family: J-13, skill: "data size measurement", depth: assess }
  - { family: W-05, skill: "semantic/keyboard/screen reader basics", depth: assess }
  - { family: W-05, skill: "DevTools performance/network/memory", depth: assess }
  - { family: W-05, skill: "measured improvements", depth: assess }
  - { family: P-04, skill: "refactor/clean interfaces", depth: assess }
  - { family: P-04, skill: "documentation and code review", depth: assess }
glossary: []
selfCheck: [ locker, record-and-review ]

blocks:
  - id: how-this-works
    kind: explanation
    title:
      uk: "Як це працює"
      en: "How this works"
    body:
      uk: |
        Це самостійна робота: підказок немає — лише опис того, що має робити код. Кнопка «Показати розв’язок» є, але її перегляд записується в прогрес, тож спершу спробуй сам.

        Завдання — камера схову посилок. Посилки **прибувають** із кодом отримання, люди **шукають** і **забирають** їх за кодом, а ті, що ніхто не забрав, **повертаються відправнику** в порядку прибуття — найстаріша першою. За день прибуває до 10 000 посилок, а в майбутньому складі — до 100 000.

        Перевірки рахують роботу, а не час: скільки разів код читає поле `code` посилок і скільки разів викликаються `shift` чи `splice`. Вимірювання часу на 1 000, 10 000 і 100 000 посилок роби сам — і запиши їх у другій вправі. Якщо перевірка падає, прочитай її назву: вона каже, яку поведінку перевірено.
      en: |
        This is independent work: there are no hints — only a description of what the code must do. The “Show the solution” button is there, but viewing the solution is recorded in your progress, so try on your own first.

        The task is a parcel locker. Parcels **arrive** with a pickup code, people **look them up** and **pick them up** by code, and the ones nobody collected **go back to the sender** in arrival order — the oldest first. Up to 10,000 parcels arrive in a day, and a future warehouse will hold up to 100,000.

        The checks count work, not time: how many times the code reads the parcels’ `code` field and how many times `shift` or `splice` is called. Time the code at 1,000, 10,000 and 100,000 parcels yourself — and write the numbers down in the second exercise. If a check fails, read its name: it tells you which behavior was checked.

  - id: locker
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: locker
    entry: index.html
    editable: [ domain/locker.ts, ui/page.js, index.html, bench.js ]
