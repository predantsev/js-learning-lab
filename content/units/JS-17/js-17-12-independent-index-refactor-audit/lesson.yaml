    title:
      uk: "Камера схову: структура, рефакторинг, аудит"
      en: "A parcel locker: structure, refactoring, audit"
    instructions:
      uk: |
        `domain/locker.ts` — працююча, але повільна камера схову за інтерфейсом `Locker` з `types.ts`. `ui/page.js` і `index.html` — її сторінка. `locker.test.js` — характеризаційні тести; вони зелені.

        1. **Структура.** Переписати `createLocker` так, щоб прибуття й пошук за кодом не переглядали всі посилки, а повернення в порядку прибуття не зсували масив. Інтерфейс `Locker` і поведінка, яку фіксують тести, не змінюються. Перевірка рахує читання поля `code` під час 10 000 прибуттів і 1 000 пошуків і виклики `shift` та `splice` під час повернення 20 000 посилок (не більше 100).
        2. **Вимірювання.** Кнопка «Прийняти посилки за день» — найповільніша взаємодія сторінки. Запиши її профіль до й після зміни, а в `bench.js` зміряй прибуття, пошуки й повернення на 1 000, 10 000 і 100 000 посилок — ці числа знадобляться в наступній вправі.
        3. **Аудит.** Пройди сторінку клавіатурою й деревом доступності. Виправ щонайменше те, що перевіряється: у поля коду є видимий підпис; результат пошуку оголошується; кожна кнопка видачі має назву з кодом посилки; після видачі фокус лишається в списку (на кнопці посилки, що стала на це місце, або на заголовку списку, якщо він порожній).
      en: |
        `domain/locker.ts` is a working but slow parcel locker behind the `Locker` interface from `types.ts`. `ui/page.js` and `index.html` are its page. `locker.test.js` holds characterization tests; they are green.

        1. **Structure.** Rewrite `createLocker` so that arrivals and lookups by code do not look through every parcel, and returns in arrival order do not shift an array. The `Locker` interface and the behavior pinned by the tests do not change. The check counts reads of the `code` field during 10,000 arrivals and 1,000 lookups, and calls of `shift` and `splice` while 20,000 parcels are returned (at most 100).
        2. **Measurement.** The “Receive the day’s parcels” button is the page’s slowest interaction. Record its profile before and after the change, and in `bench.js` time arrivals, lookups and returns at 1,000, 10,000 and 100,000 parcels — you will need these numbers in the next exercise.
        3. **Audit.** Walk the page with the keyboard and the accessibility tree. Fix at least what is checked: the code field has a visible label; the lookup result is announced; every hand-out button has a name that includes the parcel’s code; after a hand-out, focus stays in the list (on the button of the parcel that took that place, or on the list heading when the list is empty).
    testTitles:
      "the locker behaves as before: find, pick up, return the oldest":
        uk: "Камера поводиться як раніше: пошук, видача, повернення найстарішої"
        en: "The locker behaves as before: find, pick up, return the oldest"
      "a code that is already waiting is refused":
        uk: "Код, що вже чекає, не приймається"
        en: "A code that is already waiting is refused"
      "oldest returns a new array, oldest first":
        uk: "`oldest` повертає новий масив, найстаріші першими"
        en: "`oldest` returns a new array, oldest first"
      "10,000 arrivals and 1,000 lookups read the codes only a few times each":
        uk: "10 000 прибуттів і 1 000 пошуків читають коди лише кілька разів"
        en: "10,000 arrivals and 1,000 lookups read the codes only a few times each"
      "returning 20,000 parcels moves no arrays around":
        uk: "Повернення 20 000 посилок не зсуває масивів"
        en: "Returning 20,000 parcels moves no arrays around"
      "the characterization tests in locker.test.js are still green":
        uk: "Характеризаційні тести з `locker.test.js` досі зелені"
        en: "The characterization tests in `locker.test.js` are still green"
      "the code field has a visible label":
        uk: "Поле коду має видимий підпис"
        en: "The code field has a visible label"
      "the result of a lookup is announced":
        uk: "Результат пошуку оголошується"
        en: "The result of a lookup is announced"
      "every hand-out button is a button whose name includes its code":
        uk: "Кожна кнопка видачі — `button` з назвою, де є код посилки"
        en: "Every hand-out button is a `button` whose name includes its code"
      "after a hand-out the focus stays in the list":
        uk: "Після видачі фокус лишається в списку"
        en: "After a hand-out the focus stays in the list"
    solutionNote:
      uk: "Навантаження має дві різні потреби, тож і структур дві: `Map` від коду до посилки — для прибуттів, пошуку й видачі за один крок, і черга в порядку прибуття — масив з індексом голови, щоб повернення нічого не зсувало. Видані посилки лишаються в черзі й пропускаються, коли до них доходить голова. Вимірювання дало сюрприз: «взяти перший запис `Map` і видалити» здається O(1), але в Chrome нова ітерація щоразу переступає через усі видалені записи — 100 000 повернень зайняли ~925 мс проти ~6 мс з індексом голови. Тому зберігай один ітератор (як в альтернативному розв’язку) або чергу з індексом. На сторінці: видимий `label`, `role=\"status\"` для результату, назва кнопки з кодом і повернення фокуса за позицією — як у JS-06."
      en: "The workload has two different needs, so there are two structures: a `Map` from code to parcel — for arrivals, lookups and pickups in one step — and a queue in arrival order — an array with a head index, so that returns move nothing. Picked-up parcels stay in the queue and are skipped when the head reaches them. The measurement brought a surprise: “take the first entry of the `Map` and delete it” looks O(1), but in Chrome every new iteration steps over all deleted entries — 100,000 returns took ~925 ms against ~6 ms with a head index. So keep one iterator (as in the alternative solution) or a queue with an index. On the page: a visible `label`, `role=\"status\"` for the result, a button name with the code and focus returned by position — as in JS-06."
    feedback:
      - when: { test: "the locker behaves as before: find, pick up, return the oldest" }
        message:
          uk: "Ця перевірка шукає, видає й повертає посилки з фікстур і чекає того самого, що давала початкова версія: `null` для відсутнього коду, повернення найстарішої з тих, що **досі чекають**, і `null` для порожньої камери."
          en: "This check looks up, hands out and returns the fixture parcels and expects what the original version gave: `null` for a missing code, returns of the oldest parcel that is **still waiting**, and `null` for an empty locker."
      - when: { test: "a code that is already waiting is refused" }
        message:
          uk: "Ця перевірка додає посилку з кодом `P-1004`, який уже чекає, і чекає `Error`, а в камері — ту саму стару посилку й ту саму кількість."
          en: "This check adds a parcel with the code `P-1004`, which is already waiting, and expects an `Error`, with the same old parcel and the same count left in the locker."
      - when: { test: "oldest returns a new array, oldest first" }
        message:
          uk: "Ця перевірка змінює масив, який повернув `oldest(2)`, і чекає, що наступний виклик дасть ті самі дві найстаріші посилки. Не віддавай назовні внутрішній масив камери."
          en: "This check changes the array returned by `oldest(2)` and expects the next call to give the same two oldest parcels. Do not hand out the locker’s internal array."
      - when: { test: "10,000 arrivals and 1,000 lookups read the codes only a few times each" }
        message:
          uk: "Ця перевірка рахує читання поля `code`: не більше 50 000 за 10 000 прибуттів і не більше 5 000 за 1 000 пошуків. Мільйони читань означають, що кожне прибуття чи пошук досі переглядає всі посилки."
          en: "This check counts reads of the `code` field: at most 50,000 during 10,000 arrivals and at most 5,000 during 1,000 lookups. Millions of reads mean every arrival or lookup still looks through all parcels."
      - when: { test: "returning 20,000 parcels moves no arrays around" }
        message:
          uk: "Ця перевірка повертає 20 000 посилок і рахує виклики `shift` і `splice`: їх має бути не більше 100. Кожен `shift` зсуває решту масиву — на великих чергах це квадратична робота."
          en: "This check returns 20,000 parcels and counts calls of `shift` and `splice`: there must be at most 100. Every `shift` moves the rest of the array — on big queues that is quadratic work."
      - when: { test: "the characterization tests in locker.test.js are still green" }
        message:
          uk: "Ця перевірка ще раз запускає тести з `locker.test.js` і чекає, що жоден не впаде. Консоль після запуску показує, який саме тест червоний."
          en: "This check runs the tests from `locker.test.js` once more and expects none to fail. After a run, the console shows which test is red."
      - when: { test: "the code field has a visible label" }
        message:
          uk: "Ця перевірка шукає `<label for=\"lookup\">` з текстом. Placeholder зникає, щойно людина почала вводити, — це не підпис."
          en: "This check looks for a `<label for=\"lookup\">` with text. A placeholder disappears as soon as a person starts typing — it is not a label."
      - when: { test: "the result of a lookup is announced" }
        message:
          uk: "Ця перевірка чекає, що `#status` — жива область (`role=\"status\"` чи `aria-live`), і що після пошуку `P-1003` її текст містить цей код."
          en: "This check expects `#status` to be a live region (`role=\"status\"` or `aria-live`), and its text to contain the code after looking up `P-1003`."
      - when: { test: "every hand-out button is a button whose name includes its code" }
        message:
          uk: "Ця перевірка бере кожну кнопку в `#waiting` і чекає, що її доступна назва містить код посилки з того самого рядка. Іконка з `aria-hidden` назви не дає."
          en: "This check takes every button in `#waiting` and expects its accessible name to contain the parcel code of the same row. An icon with `aria-hidden` gives no name."
      - when: { test: "after a hand-out the focus stays in the list" }
        message:
          uk: "Ця перевірка клікає першу кнопку видачі й чекає фокус на кнопці в `#waiting` або на заголовку `#waiting-heading`. Перебудова списку створює нові кнопки, тож фокус треба повернути кодом."
          en: "This check clicks the first hand-out button and expects focus on a button inside `#waiting` or on the heading `#waiting-heading`. Rebuilding the list creates new buttons, so focus has to be returned by code."

  - id: recall-focus
    kind: review
    title:
      uk: "Пригадай: фокус після перебудови списку"
      en: "Recall: focus after the list is rebuilt"
    items:
      - id: focus-after-delete
        from: js-06-12-focus-management
        prompt:
          uk: "Людина з клавіатурою видаляє **останній** запис списку, і список перебудовується. Куди за правилом із JS-06 має перейти фокус?"
          en: "A keyboard user deletes the **last** record of a list, and the list is rebuilt. Where should focus go by the rule from JS-06?"
        answer:
          type: choice
          options:
            - id: previous
              text:
                uk: "На кнопку попереднього запису; якщо список порожній — на його заголовок"
                en: "To the previous record’s button; if the list is empty — to its heading"
            - id: first
              text:
                uk: "На першу кнопку списку"
                en: "To the first button of the list"
              why:
                uk: "Людина, що видаляла останній із тридцяти записів, мусила б знову йти з початку."
                en: "A person who was deleting the last of thirty records would have to go from the start again."
            - id: nowhere
              text:
                uk: "Нікуди: браузер сам поставить фокус на наступний елемент"
                en: "Nowhere: the browser puts focus on the next element by itself"
              why:
                uk: "Видалений вузол забирає фокус із собою; куди піде наступний Tab, вирішує браузер. Фокус повертає твій код."
                en: "The removed node takes focus with it; the browser decides where the next Tab goes. Your code returns focus."
          correct: [ previous ]
        explanation:
          uk: "Фокус іде туди, де людина продовжить: на запис, що став на місце видаленого, а якщо видалили останній — на попередній; порожній список — на заголовок із `tabindex=\"-1\"`. Позицію запам’ятовують **до** перебудови, як дані, а не як вузол."
          en: "Focus goes where the person will carry on: to the record that took the deleted one’s place, or, if the last one was deleted, to the previous one; for an empty list — to the heading with `tabindex=\"-1\"`. The position is remembered **before** the rebuild, as data, not as a node."

  - id: record-and-review
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: record-and-review
    entry: index.js
    editable: [ record.js ]
    strings:
      choiceLabel: { uk: "Вибір:", en: "Choice:" }
      blocking: { uk: "блокує", en: "blocks" }
      nonBlocking: { uk: "пропозиція", en: "suggestion" }
      noSuchLine: { uk: "немає такого рядка", en: "no such line" }
      noComments: { uk: "Коментарів ще немає.", en: "No comments yet." }
      sChoice: { uk: "Map від коду до посилки для прибуття, пошуку й видачі; масив з індексом голови як черга повернень у порядку прибуття.", en: "A Map from code to parcel for arrivals, lookups and pickups; an array with a head index as the queue of returns in arrival order." }
      sRejected: { uk: "один масив із some, find і shift", en: "one array with some, find and shift" }
      sRejectedReason: { uk: "кожне прибуття й пошук переглядають усі посилки, а shift на великих чергах зсуває весь масив", en: "every arrival and lookup looks through all parcels, and shift moves the whole array on big queues" }
      sEvidence: { uk: "Старий масив: 1 000 прибуттів — 3 мс, 10 000 — 156 мс, 100 000 не дочекалися. Новий: прибуття 0,2 / 1,6 / 11,8 мс, 1 000 пошуків — 0,2 мс на будь-якому розмірі, повернення всіх 100 000 — 6 мс. «Перший запис Map» на 100 000 поверненнях — 925 мс.", en: "The old array: 1,000 arrivals — 3 ms, 10,000 — 156 ms, 100,000 never finished. The new one: arrivals 0.2 / 1.6 / 11.8 ms, 1,000 lookups — 0.2 ms at any size, returning all 100,000 — 6 ms. “The first entry of a Map” for 100,000 returns — 925 ms." }
      sConsequences: { uk: "Черга тримає посилання на вже видані посилки, поки голова до них не дійде; для довгої роботи масив варто зрідка ущільнювати.", en: "The queue keeps references to parcels already handed out until the head reaches them; for long runs the array should be compacted now and then." }
      c1Problem: { uk: "arrive більше не відхиляє код, що вже чекає: set перезаписує посилку, а в черзі лишаються обидві.", en: "arrive no longer refuses a code that is already waiting: set overwrites the parcel, and both stay in the queue." }
      c1Evidence: { uk: "Дві посилки з кодом P-1004: findByCode дає другу, а waitingCount — 5 замість 4.", en: "Two parcels with the code P-1004: findByCode gives the second one, and waitingCount is 5 instead of 4." }
      c1Suggestion: { uk: "Перед set перевіряти byCode.has і кидати Error, як раніше.", en: "Check byCode.has before set and throw an Error, as before." }
      c2Problem: { uk: "findByCode повертає undefined замість null для відсутнього коду — інтерфейс Locker обіцяє null.", en: "findByCode returns undefined instead of null for a missing code — the Locker interface promises null." }
      c2Evidence: { uk: "Сторінка порівнює результат із null, тож для відсутнього коду читає recipient у undefined і падає з TypeError.", en: "The page compares the result with null, so for a missing code it reads recipient of undefined and fails with a TypeError." }
      c2Suggestion: { uk: "Повертати byCode.get(code) ?? null.", en: "Return byCode.get(code) ?? null." }
      c3Problem: { uk: "Видана посилка лишається в queue, тож nextToReturn поверне відправнику те, що вже забрали.", en: "A handed-out parcel stays in queue, so nextToReturn returns to the sender what was already collected." }
      c3Evidence: { uk: "pickUp('P-1001'), потім nextToReturn() дає P-1001 замість P-1002.", en: "pickUp('P-1001'), then nextToReturn() gives P-1001 instead of P-1002." }
      c3Suggestion: { uk: "Пропускати в черзі посилки, яких уже немає в byCode, і не зсувати масив shift.", en: "Skip parcels in the queue that are no longer in byCode, and do not shift the array." }
      c4Problem: { uk: "waitingCount рахує queue, де лишаються видані посилки.", en: "waitingCount counts queue, which still holds handed-out parcels." }
      c4Evidence: { uk: "Після pickUp('P-1002') waitingCount — 4 замість 3.", en: "After pickUp('P-1002') waitingCount is 4 instead of 3." }
      c4Suggestion: { uk: "Повертати byCode.size.", en: "Return byCode.size." }
      styleProblem: { uk: "Назву byCode можна було б зробити довшою.", en: "The name byCode could be longer." }
      styleEvidence: { uk: "Рядок оголошення змінної.", en: "The line that declares the variable." }
      styleSuggestion: { uk: "Назвати parcelsByCode.", en: "Call it parcelsByCode." }
      weakEvidence: { uk: "Map швидший, бо пошук у ньому — O(1).", en: "A Map is faster because lookups in it are O(1)." }
    title:
      uk: "Запис рішення й рев’ю чужої версії"
      en: "A decision record and a review of another version"
    instructions:
      uk: |
        1. У `record.js` заповни `decision` для своєї камери схову: `choice` — які структури ти обрав для пошуку за кодом і для повернень у порядку прибуття; `rejected` — відкинутий варіант і чому; `evidence` — твої виміри на **1 000, 10 000 і 100 000** посилок; `consequences` — що цей вибір коштує далі.
        2. Колега запропонував іншу версію камери: `pr.diff`, а файл після зміни — `after/domain/locker.js`. Напиши в `comments` щонайменше три коментарі `{ file, line, problem, evidence, suggestion, blocking }` (`file` — `"domain/locker.js"`, `line` — номер рядка в `after/domain/locker.js`). Справжні дефекти мають отримати `blocking: true`.

        **Запустити** показує кожен коментар поруч із рядком, на який він указує. Писати можна українською.
      en: |
        1. In `record.js`, fill in `decision` for your parcel locker: `choice` — which structures you chose for lookups by code and for returns in arrival order; `rejected` — the rejected option and why; `evidence` — your measurements at **1,000, 10,000 and 100,000** parcels; `consequences` — what this choice costs from now on.
        2. A teammate proposed another version of the locker: `pr.diff`, with the file after the change in `after/domain/locker.js`. Write at least three comments `{ file, line, problem, evidence, suggestion, blocking }` in `comments` (`file` is `"domain/locker.js"`, `line` is a line number in `after/domain/locker.js`). Real defects must get `blocking: true`.

        **Run** shows each comment next to the line it points at.
    testTitles:
      "the decision record names the choice, the rejected option and the consequences":
        uk: "Запис рішення називає вибір, відкинутий варіант і наслідки"
        en: "The decision record names the choice, the rejected option and the consequences"
      "the evidence gives numbers at 1,000, 10,000 and 100,000 parcels":
        uk: "Докази містять числа для 1 000, 10 000 і 100 000 посилок"
        en: "The evidence gives numbers at 1,000, 10,000 and 100,000 parcels"
      "at least three comments, each complete and pointing at a real line":
        uk: "Щонайменше три повні коментарі, кожен на справжньому рядку"
        en: "At least three comments, each complete and pointing at a real line"
      "blocking comments name at least two of the defects of the pull request":
        uk: "Блокувальні коментарі називають щонайменше два дефекти pull request"
        en: "Blocking comments name at least two of the defects of the pull request"
    solutionNote:
      uk: "Запис рішення спирається на числа на трьох розмірах, а не на «Map швидший»: саме на 100 000 видно і квадратичне прибуття старої версії, і пастку «першого запису Map». У pull request три справжні дефекти: прибуття без перевірки дубліката, `undefined` замість обіцяного `null` і черга, з якої не прибирають видані посилки (через неї `nextToReturn` повертає забране, а `waitingCount` бреше). Будь-які два з них, позначені як блокери з доказом і пропозицією, — чесне рев’ю; `shift` у поверненнях — ще одна проблема для великих складів."
      en: "The decision record rests on numbers at three sizes, not on “a Map is faster”: it is exactly at 100,000 that both the quadratic arrivals of the old version and the “first entry of a Map” trap show up. The pull request has three real defects: arrivals without a duplicate check, `undefined` instead of the promised `null`, and a queue that handed-out parcels are never removed from (because of it `nextToReturn` returns what was collected and `waitingCount` lies). Any two of them marked as blockers with evidence and a suggestion make an honest review; `shift` in the returns is one more problem for big warehouses."
    feedback:
      - when: { test: "the decision record names the choice, the rejected option and the consequences" }
        message:
          uk: "Ця перевірка чекає в `choice` і `consequences` щонайменше по 10 знаків, а в `rejected` — непорожні `option` і `reason`."
          en: "This check expects at least 10 characters in `choice` and in `consequences`, and non-empty `option` and `reason` in `rejected`."
      - when: { test: "the evidence gives numbers at 1,000, 10,000 and 100,000 parcels" }
        message:
          uk: "Ця перевірка шукає в `evidence` усі три розміри — 1 000, 10 000 і 100 000 (можна `1000`, `1,000`, `1 000` чи `1k`) — і називає ті, яких бракує. Докази без розміру даних не можна перевірити."
          en: "This check looks for all three sizes in `evidence` — 1,000, 10,000 and 100,000 (`1000`, `1,000`, `1 000` or `1k` are all fine) — and names the missing ones. Evidence without a data size cannot be checked."
      - when: { test: "at least three comments, each complete and pointing at a real line" }
        message:
          uk: "Ця перевірка чекає щонайменше три коментарі з `file: \"domain/locker.js\"`, цілим `line`, що існує в `after/domain/locker.js`, `problem`, `evidence` і `suggestion` щонайменше по 10 знаків і `blocking` — `true` чи `false`."
          en: "This check expects at least three comments with `file: \"domain/locker.js\"`, a whole-number `line` that exists in `after/domain/locker.js`, `problem`, `evidence` and `suggestion` of at least 10 characters each, and `blocking` set to `true` or `false`."
      - when: { test: "blocking comments name at least two of the defects of the pull request" }
        message:
          uk: "Ця перевірка дивиться, на які рядки вказують коментарі з `blocking: true`, і чекає щонайменше два різні справжні дефекти зміни. Запусти, щоб побачити рядки своїх коментарів, і перевір кожен метод на поведінку з `types.ts`."
          en: "This check looks at the lines your `blocking: true` comments point at and expects at least two different real defects of the change. Run to see the lines of your comments, and check every method against the behavior in `types.ts`."
      - when: { error: SyntaxError }
        message:
          uk: "Якщо картка каже «Код не вдалося запустити», у `record.js` найчастіше бракує коми між полями чи коментарями або лапок навколо тексту."
          en: "If the card says “The code could not start”, `record.js` is most often missing a comma between fields or comments, or quotes around text."

