<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%heading%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header><h1>%%heading%%</h1></header>
    <main>
      <form id="add" novalidate>
        <label for="label">%%labelField%%</label>
        <input id="label" name="label" required>
        <input id="amount" name="amount" inputmode="decimal" placeholder="%%amountPlaceholder%%">
        <p id="amount-error" class="error" hidden>%%amountError%%</p>
        <button type="submit" class="primary">%%add%%</button>
      </form>
      <p id="saved"></p>
      <div class="filters">
        <input id="filter" type="search" aria-label="%%filterLabel%%">
        <div class="clear" role="button">%%clearFilter%%</div>
      </div>
      <ul id="expenses"></ul>
    </main>
    <script type="module" src="page.js"></script>
  </body>
</html>
