    body:
      uk: "У кроці проєкту ти проведеш такий самий аудит головної дії свого застосунку — перемикача, форми чи фільтра — і запишеш знахідки в README в тому самому форматі: очікування, кроки, серйозність, виправлення."
      en: "In the project step you will run the same audit on your app’s main action — a toggle, a form or a filter — and record the findings in the README in the same format: expectation, steps, severity, fix."
