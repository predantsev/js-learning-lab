id: js-17-10-accessible-website-audit
unit: JS-17
title:
  uk: "Семантика, клавіатура та скринрідер: основи"
  en: "Semantic, keyboard and screen-reader basics"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Перевірити сторінку лише клавіатурою: дійти до кожного елемента керування в логічному порядку з видимим фокусом, скористатися ним і ніде не застрягти."
    en: "Audit a page by keyboard only: reach every control in a logical order with visible focus, operate it, and never get trapped."
  - uk: "Перевірити назви, ролі й стани елементів керування скринрідером або в дереві доступності та переконатися, що динамічні повідомлення оголошуються."
    en: "Check the names, roles and states of controls with a screen reader or the accessibility tree, and confirm that dynamic messages are announced."
  - uk: "Записати кожну знахідку з невиконаним очікуванням, кроками відтворення й виправленням."
    en: "Record each finding with the failed expectation, reproduction steps and a fix."
prerequisites: [js-17-09-documentation-code-review, js-06-02-keyboard-focus-landmarks]
subskills:
  - { family: W-05, skill: "semantic/keyboard/screen reader basics", depth: intro }
glossary: [screen-reader, live-region, accessibility-audit, keyboard-trap]
selfCheck: [predict-announcements, audit-report]

blocks:
  - id: name-role-state
    kind: explanation
    title:
      uk: "Що чує людина зі скринрідером"
      en: "What a screen-reader user hears"
    body:
      uk: |
        [[screen-reader|Скринрідер]] (програма екранного читання) читає не пікселі, а [[accessibility-tree|дерево доступності]]. Для кожного елемента керування він оголошує три речі:

        - **назву** ([[accessible-name|доступне ім’я]]) — «Додати витрату»; її дає підпис, текст кнопки або `aria-label`;
        - **роль** — «кнопка», «поле редагування», «прапорець»;
        - **стан** — «натиснуто», «обов’язкове», «недійсне значення».

        Нативний `<button>` дає роль, фокус, Enter і Space сам. `<div role="button">` дає **лише роль**: скринрідер скаже «кнопка», але Tab до неї не дійде, а Enter нічого не зробить, доки ти сам не допишеш `tabindex` і обробку клавіш.

        Окрема історія — повідомлення, що з’являються пізніше: «Збережено», помилка після відправлення. Скринрідер не стежить за всією сторінкою. Він оголошує зміну лише в [[live-region|живій області]] — елементі з `role="status"` або `aria-live="polite"`, який уже був на сторінці до зміни.
      en: |
        A [[screen-reader]] reads not pixels but the [[accessibility-tree]]. For every control it announces three things:

        - the **name** ([[accessible-name]]) — “Add expense”; it comes from a label, the button’s text or `aria-label`;
        - the **role** — “button”, “edit text”, “checkbox”;
        - the **state** — “pressed”, “required”, “invalid entry”.

        A native `<button>` gives the role, focus, Enter and Space by itself. `<div role="button">` gives **only the role**: the screen reader says “button”, but Tab never reaches it, and Enter does nothing until you add `tabindex` and key handling yourself.

        Messages that appear later are a separate story: “Saved”, an error after submitting. A screen reader does not watch the whole page. It announces a change only in a [[live-region]] — an element with `role="status"` or `aria-live="polite"` that was already on the page before the change.

  - id: predict-announcements
    kind: prediction
    runnable: false
    lang: html
    prompt:
      uk: "Чотири фрагменти сторінки трекера витрат. Людина користується лише клавіатурою й скринрідером. Які з них її **підведуть**?"
      en: "Four fragments of an expense tracker page. A person uses only the keyboard and a screen reader. Which of them **let the person down**?"
    code: |
      <!-- 1. A delete button with an icon -->
      <button type="button"><svg aria-hidden="true">…</svg></button>

      <!-- 2. "Clear the filter" -->
      <div role="button" class="clear">Clear the filter</div>

      <!-- 3. A required amount with an error -->
      <label for="amount">Amount</label>
      <input id="amount" required aria-invalid="true" aria-describedby="amount-error">
      <p id="amount-error">Enter an amount greater than zero.</p>

      <!-- 4. The message after saving: code sets its text to "Saved" -->
      <p id="saved"></p>
    answer:
      type: multi
      options:
        - id: icon-button
          text:
            uk: "1 — кнопка з іконкою"
            en: "1 — the icon button"
        - id: div-button
          text:
            uk: "2 — `div` з `role=\"button\"`"
            en: "2 — the `div` with `role=\"button\"`"
        - id: required-input
          text:
            uk: "3 — обов’язкове поле з помилкою"
            en: "3 — the required field with an error"
          why:
            uk: "Тут усе зв’язано: підпис дає назву «Amount», `required` і `aria-invalid` — стани «обов’язкове» й «недійсне значення», а `aria-describedby` додає текст помилки до опису поля."
            en: "Everything is connected here: the label gives the name “Amount”, `required` and `aria-invalid` give the states “required” and “invalid entry”, and `aria-describedby` adds the error text to the field’s description."
        - id: status
          text:
            uk: "4 — повідомлення «Saved»"
            en: "4 — the “Saved” message"
      correct: [icon-button, div-button, status]
    explanation:
      uk: "1: іконку сховано `aria-hidden`, тексту немає — скринрідер скаже просто «кнопка», без назви. 2: роль є, але Tab до `div` не дійде, а Enter і Space нічого не зроблять. 3: назва, стани й опис помилки на місці. 4: звичайний `<p>` — не жива область, тож «Saved» з’явиться на екрані мовчки. Автоматичний перевіряльник знайде 1, але легко пропустить 2 і 4: їх видно лише клавіатурою й скринрідером."
      en: "1: the icon is hidden with `aria-hidden` and there is no text — the screen reader says just “button”, with no name. 2: the role is there, but Tab never reaches the `div`, and Enter and Space do nothing. 3: the name, the states and the error description are in place. 4: a plain `<p>` is not a live region, so “Saved” appears on screen silently. An automated checker finds 1 but easily misses 2 and 4: they show up only with the keyboard and a screen reader."

  - id: audit-expenses
    kind: example
    runtime: browser-js
    dir: audit-expenses
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      heading: { uk: "Витрати", en: "Expenses" }
      labelField: { uk: "На що", en: "What for" }
      amountPlaceholder: { uk: "Сума, грн", en: "Amount, UAH" }
      amountError: { uk: "Введи суму, більшу за нуль.", en: "Enter an amount greater than zero." }
      add: { uk: "Додати", en: "Add" }
      savedMessage: { uk: "Витрату збережено", en: "Expense saved" }
      filterLabel: { uk: "Фільтр витрат", en: "Filter expenses" }
      clearFilter: { uk: "Очистити фільтр", en: "Clear the filter" }
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
    title:
      uk: "Аудит сторінки витрат"
      en: "Auditing the expense page"
    body:
      uk: |
        На цій сторінці свідомо залишено кілька проблем доступності. Запусти її й проведи [[accessibility-audit|аудит]] на вкладці **Сторінка** — без миші, лише клавішами, а потім із деревом доступності.

        Клацни на заголовок сторінки, щоб фокус почав звідти, і йди клавішею Tab.
      en: |
        Several accessibility problems were left on this page on purpose. Run it and do an [[accessibility-audit]] on the **Page** tab — without the mouse, only with keys, and then with the accessibility tree.

        Click the page heading so that focus starts there, and go on with the Tab key.
    tryIt:
      uk: |
        1. **Порядок і фокус.** Tab і Shift+Tab по всіх елементах. Чи видно, де фокус, на кнопці «Додати»? Чи доходить Tab до «Очистити фільтр»?
        2. **Дія.** Enter у формі з порожньою сумою, Space на кнопці-кошику. До кошика Tab-ом від заголовка не дійти — дорогу закриває поле фільтра (крок 3), тож клацни на текст першої витрати й натисни Tab: фокус почне звідти. Що відбулося і як ти про це дізнався б, не бачачи екрана?
        3. **Пастка.** Дійди Tab-ом до поля фільтра й натисни Tab ще раз, потім Shift+Tab і Escape. Фокус не виходить — це [[keyboard-trap|клавіатурна пастка]]. Вибратися можна лише мишею: клацни деінде на сторінці.
        4. **Назви, ролі, стани.** Правою кнопкою на кнопці-кошику → **Перевірити** (Inspect) → вкладка **Accessibility**. Поле **Name** порожнє. Подивись так само на поле суми: його назва береться лише з placeholder, видимого підпису немає.
        5. **Виправ одне й перевір тим самим способом.** Наприклад, у `page.js` додай кнопці-кошику `remove.setAttribute("aria-label", "Видалити " + expense.label)` — і знову подивись на **Name**. Або в `index.html` дай `<p id="saved">` атрибут `role="status"`.

        Якщо хочеш почути сторінку, увімкни скринрідер системи: VoiceOver на macOS (Cmd+F5), Екранний диктор у Windows (Ctrl+Win+Enter) або безкоштовний NVDA, Orca в Linux.
      en: |
        1. **Order and focus.** Tab and Shift+Tab through every element. Can you see where focus is on the “Add” button? Does Tab reach “Clear the filter”?
        2. **Action.** Press Enter in the form with an empty amount, Space on the trash-can button. Tab from the heading never gets to the trash can — the filter field blocks the way (step 3) — so click the text of the first expense and press Tab: focus starts from there. What happened, and how would you know without seeing the screen?
        3. **Trap.** Tab to the filter field and press Tab once more, then Shift+Tab and Escape. Focus does not leave — that is a [[keyboard-trap]]. The only way out is the mouse: click somewhere else on the page.
        4. **Names, roles, states.** Right-click the trash-can button → **Inspect** → the **Accessibility** tab. The **Name** field is empty. Look at the amount field the same way: its name comes only from the placeholder, there is no visible label.
        5. **Fix one and check it the same way.** For example, in `page.js` give the trash-can button `remove.setAttribute("aria-label", "Delete " + expense.label)` — and look at **Name** again. Or in `index.html` give `<p id="saved">` the attribute `role="status"`.

        If you want to hear the page, turn on the system screen reader: VoiceOver on macOS (Cmd+F5), Narrator on Windows (Ctrl+Win+Enter) or the free NVDA, Orca on Linux.

  - id: checker-is-not-audit
    kind: explanation
    title:
      uk: "Перевіряльник — не аудит"
      en: "A checker is not an audit"
    body:
      uk: |
        Автоматичні перевіряльники (як вкладка Lighthouse у DevTools) корисні: вони швидко знаходять кнопку без назви чи поганий контраст. Але «жодної помилки» від перевіряльника не означає «доступно». Він не натискає Tab і не помічає пастки, не знає, чи логічний порядок фокусу, і не чує, чи оголосилося «Збережено».

        Тому аудит робить людина, і кожну знахідку записує так, щоб її можна було відтворити й виправити:

        | Поле | Приклад |
        |---|---|
        | елемент | поле фільтра `#filter` |
        | невиконане очікування | «Tab переводить фокус до наступного елемента» |
        | кроки | клацнути на заголовок → Tab до фільтра → Tab |
        | серйозність | **critical**: людина без миші далі не пройде |
        | виправлення | не перехоплювати Tab; підказки закривати Escape |

        Серйозність каже, що виправляти першим: пастка чи недоступна дія (`critical`) важливіші за кнопку без назви (`serious`), а та — за невидимий фокус на одному елементі.
      en: |
        Automated checkers (like the Lighthouse tab in DevTools) are useful: they quickly find a button without a name or poor contrast. But “no errors” from a checker does not mean “accessible”. It does not press Tab and does not notice traps, does not know whether the focus order is logical, and does not hear whether “Saved” was announced.

        That is why a person does the audit and records every finding so that it can be reproduced and fixed:

        | Field | Example |
        |---|---|
        | element | the filter field `#filter` |
        | failed expectation | “Tab moves focus to the next element” |
        | steps | click the heading → Tab to the filter → Tab |
        | severity | **critical**: a person without a mouse cannot go further |
        | fix | do not intercept Tab; close suggestions with Escape |

        Severity says what to fix first: a trap or an unreachable action (`critical`) matters more than a button without a name (`serious`), and that more than invisible focus on one element.

  - id: recall-tab-order
    kind: review
    title:
      uk: "Пригадай: порядок Tab і орієнтири"
      en: "Recall: Tab order and landmarks"
    items:
      - id: positive-tabindex
        from: js-06-02-keyboard-focus-landmarks
        prompt:
          uk: "У шапці сторінки посилання «Довідка» має `tabindex=\"1\"`, а решта елементів — без `tabindex`. Людина клацає на початок сторінки й натискає Tab. Куди піде фокус першим?"
          en: "In the page header, the “Help” link has `tabindex=\"1\"`, and the other elements have no `tabindex`. A person clicks at the top of the page and presses Tab. Where does focus go first?"
        answer:
          type: choice
          options:
            - id: help-first
              text:
                uk: "На «Довідку», хоч би де вона стояла в HTML, — і далі порядок уже не збігається зі сторінкою"
                en: "To “Help”, wherever it stands in the HTML — and after that the order no longer matches the page"
            - id: html-order
              text:
                uk: "На перший елемент у порядку HTML"
                en: "To the first element in HTML order"
              why:
                uk: "Так було б без додатного `tabindex`. Елементи з `tabindex=\"1\"` і більшим стрибають попереду всіх."
                en: "That would be so without a positive `tabindex`. Elements with `tabindex=\"1\"` and higher jump ahead of everything."
            - id: skipped
              text:
                uk: "Tab узагалі пропустить «Довідку»"
                en: "Tab skips “Help” altogether"
              why:
                uk: "Пропускає елемент `tabindex=\"-1\"`. Додатне значення робить навпаки — ставить першим."
                en: "`tabindex=\"-1\"` makes Tab skip an element. A positive value does the opposite — it puts the element first."
          correct: [help-first]
        explanation:
          uk: "Додатний `tabindex` — пастка з JS-06: порядок фокусу перестає збігатися з порядком сторінки. В аудиті це знахідка «порядок фокусу не логічний», а виправлення — прибрати `tabindex` і переставити елементи в HTML."
          en: "A positive `tabindex` is the trap from JS-06: the focus order stops matching the page order. In an audit that is the finding “the focus order is not logical”, and the fix is to remove `tabindex` and rearrange the elements in the HTML."

  - id: audit-report
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: audit-report
    entry: index.html
    editable: [audit.js]
    strings:
      lang: { uk: "uk", en: "en" }
      heading: { uk: "Звички на сьогодні", en: "Today’s habits" }
      help: { uk: "Довідка", en: "Help" }
      helpText: { uk: "Відмічай звичку, коли виконав її сьогодні.", en: "Mark a habit when you have done it today." }
      namePlaceholder: { uk: "Нова звичка", en: "New habit" }
      nameError: { uk: "Назва не може бути порожньою.", en: "The name cannot be empty." }
      searchLabel: { uk: "Пошук звички", en: "Search habits" }
      chipsLabel: { uk: "Які звички показати", en: "Which habits to show" }
      active: { uk: "Активні", en: "Active" }
      all: { uk: "Усі", en: "All" }
      today: { uk: "Сьогодні", en: "Today" }
      savedMessage: { uk: "Збережено", en: "Saved" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      read: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      f1Expectation: { uk: "Tab і Shift+Tab виводять фокус із поля пошуку", en: "Tab and Shift+Tab move focus out of the search field" }
      f1Step1: { uk: "Ввести літеру в поле пошуку", en: "Type a letter into the search field" }
      f1Step2: { uk: "Натиснути Tab", en: "Press Tab" }
      f1Step3: { uk: "Натиснути Shift+Tab", en: "Press Shift+Tab" }
      f1Fix: { uk: "Не скасовувати Tab у keydown; підказки закривати Escape", en: "Do not cancel Tab in keydown; close suggestions with Escape" }
      f2Expectation: { uk: "Відмітку «Сьогодні» можна зробити клавіатурою, і чути її стан", en: "The “Today” mark can be set by keyboard, and its state is heard" }
      f2Step1: { uk: "Пройти список клавішею Tab", en: "Walk the list with the Tab key" }
      f2Step2: { uk: "Фокус ніколи не потрапляє на «Сьогодні»", en: "Focus never lands on “Today”" }
      f2Fix: { uk: "Замінити div на button з aria-pressed", en: "Replace the div with a button with aria-pressed" }
      f3Expectation: { uk: "Кнопка додавання має назву, яку оголошує скринрідер", en: "The add button has a name that a screen reader announces" }
      f3Step1: { uk: "Inspect на кнопці з плюсом", en: "Inspect the button with the plus" }
      f3Step2: { uk: "У вкладці Accessibility поле Name порожнє", en: "The Name field in the Accessibility tab is empty" }
      f3Fix: { uk: "Додати видимий текст «Додати звичку» поруч з іконкою", en: "Add the visible text “Add habit” next to the icon" }
      f4Expectation: { uk: "Після відмітки скринрідер оголошує «Збережено»", en: "After a mark the screen reader announces “Saved”" }
      f4Step1: { uk: "Відмітити звичку мишею з увімкненим скринрідером", en: "Mark a habit with the mouse while a screen reader runs" }
      f4Step2: { uk: "Текст з’являється, але нічого не оголошується", en: "The text appears, but nothing is announced" }
      f4Fix: { uk: "Дати #saved атрибут role='status'", en: "Give #saved the attribute role='status'" }
      f5Expectation: { uk: "На фільтрах видно, де фокус", en: "Focus is visible on the filters" }
      f5Step1: { uk: "Дійти Tab до «Активні»", en: "Tab to “Active”" }
      f5Step2: { uk: "Рамки фокусу немає", en: "There is no focus frame" }
      f5Fix: { uk: "Прибрати outline: none або задати власний :focus-visible", en: "Remove outline: none or set an own :focus-visible" }
      f6Expectation: { uk: "Поле нової звички має видимий підпис", en: "The new habit field has a visible label" }
      f6Step1: { uk: "Ввести текст у поле", en: "Type text into the field" }
      f6Step2: { uk: "Placeholder зникає, і не видно, що це за поле", en: "The placeholder disappears, and it is no longer clear what the field is" }
      f6Fix: { uk: "Додати label for='habit-name'", en: "Add a label for='habit-name'" }
      f7Expectation: { uk: "Порядок фокусу збігається з порядком сторінки", en: "The focus order matches the page order" }
      f7Step1: { uk: "Клацнути на початок сторінки", en: "Click at the top of the page" }
      f7Step2: { uk: "Перший Tab потрапляє на «Довідку» в обхід решти", en: "The first Tab lands on “Help”, bypassing the rest" }
      f7Fix: { uk: "Прибрати tabindex='1'", en: "Remove tabindex='1'" }
    title:
      uk: "Звіт аудиту: п’ять знахідок"
      en: "An audit report: five findings"
    instructions:
      uk: |
        На сторінці звичок свідомо залишено вісім проблем доступності. Проведи аудит так само, як у прикладі: Tab, Shift+Tab, Enter, Space, Escape, потім **Перевірити** → **Accessibility** на підозрілих елементах. Не відкривай `page.js`, поки не пройдеш сторінку клавіатурою, — так аудит чесніший.

        У `audit.js` запиши **п’ять** знахідок — кожна про **іншу** проблему:

        - `element` — CSS-селектор елемента, наприклад `"#add-habit"` чи `"#habits .toggle"`;
        - `expectation` — що людина з клавіатурою чи скринрідером очікує й не отримує;
        - `steps` — щонайменше два кроки відтворення;
        - `severity` — `"critical"`, `"serious"`, `"moderate"` або `"minor"`; клавіатурна пастка — завжди `"critical"`;
        - `fix` — що змінити.

        Перевірка шукає кожен селектор на сторінці й дивиться, чи п’ять знахідок указують на п’ять різних закладених проблем. Текст можна писати українською.
      en: |
        Eight accessibility problems were left on the habit page on purpose. Audit it the same way as in the example: Tab, Shift+Tab, Enter, Space, Escape, then **Inspect** → **Accessibility** on suspicious elements. Do not open `page.js` until you have walked the page by keyboard — that keeps the audit honest.

        In `audit.js`, write **five** findings — each about a **different** problem:

        - `element` — a CSS selector of the element, for example `"#add-habit"` or `"#habits .toggle"`;
        - `expectation` — what a keyboard or screen-reader user expects and does not get;
        - `steps` — at least two reproduction steps;
        - `severity` — `"critical"`, `"serious"`, `"moderate"` or `"minor"`; a keyboard trap is always `"critical"`;
        - `fix` — what to change.

        The check looks up every selector on the page and checks whether the five findings point at five different planted problems.
    testTitles:
      "the report has five findings":
        uk: "У звіті п’ять знахідок"
        en: "The report has five findings"
      "every finding points at an element of the page":
        uk: "Кожна знахідка вказує на елемент сторінки"
        en: "Every finding points at an element of the page"
      "the five findings are five different planted problems":
        uk: "П’ять знахідок — п’ять різних закладених проблем"
        en: "The five findings are five different planted problems"
      "every finding states the expectation, the steps, a severity and a fix":
        uk: "Кожна знахідка має очікування, кроки, серйозність і виправлення"
        en: "Every finding states the expectation, the steps, a severity and a fix"
      "a keyboard trap is reported as critical":
        uk: "Клавіатурна пастка має серйозність `critical`"
        en: "A keyboard trap is reported as `critical`"
    hints:
      nudge:
        uk: "Пройди сторінку клавішею Tab від самого початку й записуй, де фокус зникає, стрибає не туди чи застрягає. Потім подивись на кожну кнопку у вкладці Accessibility."
        en: "Walk the page with the Tab key from the very start and note where focus disappears, jumps somewhere odd or gets stuck. Then look at every button in the Accessibility tab."
      explanation:
        uk: "Аудит — як перевірка нової квартири перед заселенням: щоразу та сама дорога від дверей, і кожен недолік записують із місцем, кроками й тим, що полагодити. Порядок: спершу чи дістаєшся до всього клавіатурою і чи бачиш фокус; потім чи можна скористатися кожним елементом (Enter, Space); потім назви, ролі й стани в дереві доступності; наостанок повідомлення, що з’являються після дії. Селектор знахідки має знаходити саме проблемний елемент: його `id` або клас видно у вкладці **Elements**."
        en: "An audit is like inspecting a new flat before moving in: the same way from the door every time, and every defect is written down with its place, the steps and what to repair. The order: first whether you reach everything by keyboard and see the focus; then whether every element can be used (Enter, Space); then names, roles and states in the accessibility tree; last, the messages that appear after an action. A finding’s selector must find exactly the problem element: its `id` or class is visible in the **Elements** tab."
    solutionNote:
      uk: "Ось вісім закладених проблем: «Довідка» з `tabindex=\"1\"` ламає порядок; поле нової звички назване лише placeholder; кнопка з плюсом без назви; помилка назви не пов’язана з полем і не оголошується; пошук — пастка, щойно в ньому є текст; фільтри без видимого фокусу; «Сьогодні» — `div` з `role=\"button\"`, до якого не дійти й у якого немає стану; «Збережено» не в живій області. Будь-які п’ять із них — чесний звіт. Пастка й недоступна відмітка — `critical`: без миші людина не може ні вийти з поля, ні зробити головну дію сторінки."
      en: "These are the eight planted problems: “Help” with `tabindex=\"1\"` breaks the order; the new habit field is named only by its placeholder; the plus button has no name; the name error is not linked to the field and is not announced; the search is a trap as soon as it holds text; the filters have no visible focus; “Today” is a `div` with `role=\"button\"` that cannot be reached and has no state; “Saved” is not in a live region. Any five of them make an honest report. The trap and the unreachable mark are `critical`: without a mouse a person can neither leave the field nor do the page’s main action."
    feedback:
      - when: { test: "the report has five findings" }
        message:
          uk: "Ця перевірка чекає в `findings` рівно п’ять знахідок."
          en: "This check expects exactly five findings in `findings`."
      - when: { test: "every finding points at an element of the page" }
        message:
          uk: "Ця перевірка шукає `element` кожної знахідки через `document.querySelector` і називає ту, для якої нічого не знайшлося. `id` пишуть із `#`, клас — із крапкою: `\"#search\"`, `\".chip\"`."
          en: "This check looks up every finding’s `element` with `document.querySelector` and names the one for which nothing was found. An `id` is written with `#`, a class with a dot: `\"#search\"`, `\".chip\"`."
      - when: { test: "the five findings are five different planted problems" }
        message:
          uk: "Ця перевірка чекає, що кожен селектор указує на елемент із закладеною проблемою і що п’ять знахідок — про п’ять різних проблем. Дві знахідки про дві однакові кнопки «Сьогодні» — це одна проблема."
          en: "This check expects every selector to point at an element with a planted problem and the five findings to be about five different problems. Two findings about two identical “Today” buttons are one problem."
      - when: { test: "every finding states the expectation, the steps, a severity and a fix" }
        message:
          uk: "Ця перевірка чекає в кожній знахідці `expectation` і `fix` щонайменше з 10 знаків, щонайменше два кроки в `steps` і `severity` — одне з `critical`, `serious`, `moderate`, `minor`."
          en: "This check expects `expectation` and `fix` of at least 10 characters in every finding, at least two steps in `steps`, and a `severity` that is one of `critical`, `serious`, `moderate`, `minor`."
      - when: { test: "a keyboard trap is reported as critical" }
        message:
          uk: "Ця перевірка чекає, що знахідка про поле пошуку, з якого не виходить фокус, має `severity: \"critical\"`: людина без миші далі сторінкою не пройде."
          en: "This check expects the finding about the search field that focus cannot leave to have `severity: \"critical\"`: a person without a mouse cannot go any further on the page."
      - when: { error: SyntaxError }
        message:
          uk: "Якщо картка каже «Код не вдалося запустити», в `audit.js` найчастіше бракує коми між знахідками чи полями або лапок навколо тексту. Лапки всередині тексту заміни на «ялинки»."
          en: "If the card says “The code could not start”, `audit.js` is most often missing a comma between findings or fields, or quotes around text. Replace quotes inside the text with typographic ones."

