<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="utf-8">
    <title>%%heading%%</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <h1>%%heading%%</h1>
      <a href="#help" id="help-link" tabindex="1">%%help%%</a>
    </header>
    <main>
      <form id="new-habit">
        <input id="habit-name" name="name" placeholder="%%namePlaceholder%%">
        <button type="submit" id="add-habit"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor"/></svg></button>
      </form>
      <p id="name-error" class="error" hidden>%%nameError%%</p>
      <label for="search">%%searchLabel%%</label>
      <input id="search" type="search">
      <nav class="chips" aria-label="%%chipsLabel%%">
        <button type="button" class="chip" data-show="active">%%active%%</button>
        <button type="button" class="chip" data-show="all">%%all%%</button>
      </nav>
      <ul id="habits"></ul>
      <p id="saved"></p>
      <section id="help"><h2>%%help%%</h2><p>%%helpText%%</p></section>
    </main>
    <script type="module" src="page.js"></script>
  </body>
</html>
