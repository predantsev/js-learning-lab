id: js-17-07-measured-improvement
unit: JS-17
title:
  uk: "Покращуємо одне виміряне вузьке місце"
  en: "Improving one measured bottleneck"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Пройти цикл «виміряти → висунути гіпотезу → змінити одне → виміряти знову → лишити або відкотити» для одного вузького місця підготовленої сторінки."
    en: "Follow the loop measure → hypothesize → change one thing → re-measure → keep or revert for one bottleneck in a prepared page."
  - uk: "Показати тестами й перевіркою з клавіатури, що покращення зберегло поведінку й доступність, і подати числа «до» і «після» разом із розміром даних."
    en: "Show with tests and a keyboard check that the improvement preserved behavior and accessibility, and report before/after numbers with the dataset size."
prerequisites: [js-17-06-devtools-performance-memory, js-17-02-big-o-measured]
subskills:
  - { family: W-05, skill: "measured improvements", depth: intro }
glossary: [bottleneck, performance-baseline]
selfCheck: [predict-best-change, price-list]

blocks:
  - id: one-thing-at-a-time
    kind: explanation
    title:
      uk: "Одне вимірювання, одна зміна"
      en: "One measurement, one change"
    body:
      uk: |
        Покращення продуктивності — це не «переписати все швидше». Це цикл:

        1. **Виміряти** й записати [[performance-baseline|точку відліку]]: медіана кількох запусків і розмір даних.
        2. **Гіпотеза** з профілю: «найбільше Self time у `formatDue` — формат дати готується наново для кожного рядка».
        3. **Змінити одне** — лише те, що стосується гіпотези.
        4. **Виміряти знову** на тому самому розмірі даних.
        5. **Лишити або відкотити.** Зміна, що не дала помітного виграшу, — це просто складніший код; її прибирають.

        Час завжди впирається в одне-два [[bottleneck|вузькі місця]]. Якщо 90 % часу забирає одна функція, прискорення всього іншого вдвічі заощадить лише 5 %.

        І виграш рахується лише тоді, коли **поведінка не змінилася**: ті самі рядки, той самий текст, той самий фокус. Швидка, але трохи інша сторінка — це не оптимізація, а новий дефект.
      en: |
        A performance improvement is not “rewrite everything faster”. It is a loop:

        1. **Measure** and write down a [[performance-baseline|baseline]]: the median of several runs and the data size.
        2. **A hypothesis** from the profile: “`formatDue` has the most Self time — the date format is prepared again for every row”.
        3. **Change one thing** — only what the hypothesis is about.
        4. **Measure again** at the same data size.
        5. **Keep or revert.** A change that brought no visible gain is just more complex code; it is removed.

        The time always comes down to one or two [[bottleneck|bottlenecks]]. If 90 % of the time goes to one function, making everything else twice as fast saves only 5 %.

        And a gain counts only when **the behavior did not change**: the same rows, the same text, the same focus. A fast but slightly different page is not an optimization but a new defect.

  - id: predict-best-change
    kind: prediction
    runnable: false
    prompt:
      uk: "Список планувальника рендерить 5 000 справ (60 різних дат, 2 000 проєктів) за ~120 мс. Є три кандидати на зміну. Яка з них **сама по собі** найбільше скоротить виміряний час?"
      en: "A planner list renders 5,000 tasks (60 different dates, 2,000 projects) in ~120 ms. There are three candidate changes. Which one **on its own** cuts the measured time the most?"
    code: |
      // For every one of the 5,000 rows:
      item.textContent = `${task.title} · ${projectName(task)} · ${formatDue(task.dueDate)}`;
      container.append(item);

      // A. cache the formatted text of each of the 60 dates in a Map
      // B. replace projects.find(...) inside projectName with a Map from id to project
      // C. collect the rows in an array and insert them with one replaceChildren(...rows)
    answer:
      type: choice
      options:
        - id: cache-dates
          text:
            uk: "A — кешувати форматований текст дат"
            en: "A — cache the formatted date text"
        - id: map-projects
          text:
            uk: "B — замінити `find` на `Map`"
            en: "B — replace `find` with a `Map`"
          why:
            uk: "Це прибирає квадратичну роботу, і на більших даних вона б домінувала. Тут `find` проходить у середньому ~1 000 проєктів — це дешеві порівняння, кілька мілісекунд. Ми виміряли: ~10 мс виграшу з ~124."
            en: "It removes quadratic work, and on bigger data that work would dominate. Here `find` walks ~1,000 projects on average — cheap comparisons, a few milliseconds. We measured: ~10 ms gained out of ~124."
        - id: batch-dom
          text:
            uk: "C — вставити всі рядки одним викликом"
            en: "C — insert all rows with one call"
          why:
            uk: "Звучить переконливо, але `append` без читання розмірів між вставками не змушує браузер рахувати розкладку для кожного рядка. Виграш тут у межах шуму."
            en: "It sounds convincing, but `append` without reading sizes between insertions does not force the browser to compute layout for every row. The gain here is within the noise."
      correct: [cache-dates]
    explanation:
      uk: "Ми виміряли всі три в Chrome на цій сторінці (5 000 справ): лише A — з ~124 до ~10 мс, B — мінус ~10 мс, C — у межах шуму. `toLocaleDateString` щоразу заново готує правила формату, а дат лише 60. Алгоритмічна заміна B правильна в принципі, але не тут головна. Профіль показав би це до будь-якої зміни."
      en: "We measured all three in Chrome on this page (5,000 tasks): A alone — from ~124 to ~10 ms, B — minus ~10 ms, C — within the noise. `toLocaleDateString` prepares the format rules anew every time, and there are only 60 dates. The algorithmic change B is right in principle, but it is not the main one here. A profile would have shown that before any change."

  - id: slow-list
    kind: example
    runtime: browser-js
    dir: slow-list
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      locale: { uk: "uk-UA", en: "en-GB" }
      heading: { uk: "Справи на березень", en: "Tasks for March" }
      measureButton: { uk: "Виміряти рендер", en: "Measure the render" }
      project: { uk: "Проєкт", en: "Project" }
      task: { uk: "Справа", en: "Task" }
      tasks: { uk: "справ", en: "tasks" }
      projects: { uk: "проєктів", en: "projects" }
      median: { uk: "медіана рендеру", en: "median render" }
    title:
      uk: "Три кандидати, по одному"
      en: "Three candidates, one at a time"
    body:
      uk: |
        Кнопка «Виміряти рендер» рендерить список п’ять разів і показує медіану разом із розміром даних. Запусти й натисни її двічі-тричі: це твоя точка відліку. Запиши число.

        У `page.js` три кандидати позначено коментарями `Candidate A`, `B` і `C`. Застосовуй їх **по одному**, щоразу вимірюй і повертай назад ті, що не допомогли.
      en: |
        The “Measure the render” button renders the list five times and shows the median together with the data size. Run it and press it two or three times: that is your baseline. Write the number down.

        In `page.js` three candidates are marked with the comments `Candidate A`, `B` and `C`. Apply them **one at a time**, measure every time, and revert the ones that did not help.
    tryIt:
      uk: |
        1. **C:** у `renderTasks` збирай рядки в масив `items`, а замість `container.append(item)` після циклу виклич `container.replaceChildren(...items)`. Виміряй. Різниця більша за розкид між натисканнями? Якщо ні — відкоти.
        2. **B:** над `projectName` збудуй `const projectsById = new Map(projects.map((project) => [project.id, project]));` і бери проєкт через `projectsById.get(task.projectId)`. Виміряй і виріши.
        3. **A:** зроби `const dueTexts = new Map();` і в `formatDue` спершу повертай уже готовий текст для цієї дати, а якщо його ще немає — форматуй, запам’ятовуй і повертай. Виміряй.
        4. Запиши в консоль чи на папері: точку відліку, кожну зміну й її число. Яку з трьох ти лишив би в коді?
      en: |
        1. **C:** in `renderTasks`, collect the rows in an array `items`, and instead of `container.append(item)` call `container.replaceChildren(...items)` after the loop. Measure. Is the difference bigger than the spread between presses? If not, revert.
        2. **B:** above `projectName`, build `const projectsById = new Map(projects.map((project) => [project.id, project]));` and take the project with `projectsById.get(task.projectId)`. Measure and decide.
        3. **A:** make `const dueTexts = new Map();` and in `formatDue` first return the ready text for this date, and if there is none yet, format it, remember it and return it. Measure.
        4. Write down in the console or on paper: the baseline, every change and its number. Which of the three would you keep in the code?

  - id: same-behavior
    kind: explanation
    title:
      uk: "Швидше — і так само"
      en: "Faster — and the same"
    body:
      uk: |
        Перш ніж лишити зміну, доведи, що сторінка робить те саме:

        - **Тести.** Рядки, текст, кількість — ті самі на тих самих даних. Найнадійніше порівняти новий результат зі старим на кількох сотнях синтетичних записів.
        - **Клавіатура.** Пройди сторінку Tab і натисни Space на перемикачі: фокус має лишитися на тому самому записі, як ти робив у JS-06. «Прискорення», яке збирає список одним рядком HTML, часто губить атрибути, на які спирається повернення фокусу, — і мимохідь відкриває небезпечний `innerHTML`.
        - **Звіт.** Точка відліку, гіпотеза, одна зміна, нове число — на тому самому розмірі даних — і що тести й перевірка з клавіатури пройшли. Такий звіт можна перевірити, а «стало швидше» — ні.
      en: |
        Before you keep a change, prove that the page does the same:

        - **Tests.** The rows, the text, the count are the same on the same data. The most reliable way is to compare the new result with the old one on a few hundred synthetic records.
        - **Keyboard.** Walk the page with Tab and press Space on a toggle: focus must stay on the same record, as you did in JS-06. A “speed-up” that builds the list as one HTML string often loses the attributes that returning focus relies on — and opens a dangerous `innerHTML` along the way.
        - **A report.** The baseline, the hypothesis, the one change, the new number — at the same data size — and that the tests and the keyboard check passed. Such a report can be checked; “it got faster” cannot.

  - id: recall-one-pass
    kind: review
    title:
      uk: "Пригадай: рендер списку з даних"
      en: "Recall: rendering a list from data"
    items:
      - id: rebuild-from-data
        from: js-06-13-render-list-from-data
        prompt:
          uk: "`render(list)` будує список із даних і вставляє його на сторінку. Що станеться, якщо викликати її двічі поспіль з тим самим масивом із трьох записів?"
          en: "`render(list)` builds the list from data and inserts it into the page. What happens if it is called twice in a row with the same array of three records?"
        code: |
          const container = document.createElement("ul");
          function render(list) {
            const items = list.map((record) => {
              const item = document.createElement("li");
              item.textContent = record.name;
              return item;
            });
            container.replaceChildren(...items);
          }
          const list = [{ name: "a" }, { name: "b" }, { name: "c" }];
          render(list);
          const firstItem = container.firstElementChild;
          render(list);
          console.log(container.children.length, container.firstElementChild === firstItem);
        verify:
          logs: ["3 false"]
        answer:
          type: choice
          options:
            - id: new-nodes
              text:
                uk: "`3 false`: рядків так само три, але це нові елементи"
                en: "`3 false`: still three rows, but they are new elements"
            - id: six
              text:
                uk: "`6 false`: другий виклик додає ще три рядки"
                en: "`6 false`: the second call adds three more rows"
              why:
                uk: "`replaceChildren` спершу прибирає все, що було в контейнері, тож рядків стільки ж, скільки записів."
                en: "`replaceChildren` first removes everything that was in the container, so there are as many rows as records."
            - id: same-nodes
              text:
                uk: "`3 true`: дані ті самі, тож і елементи ті самі"
                en: "`3 true`: the data is the same, so the elements are the same"
              why:
                uk: "`createElement` щоразу створює новий елемент. Однаковий текст не робить його тим самим вузлом — тому фокус і не повертається сам."
                en: "`createElement` creates a new element every time. The same text does not make it the same node — that is why focus does not come back by itself."
          correct: [new-nodes]
        explanation:
          uk: "Рендер із даних замінює всі рядки новими. Тому будь-яка оптимізація рендеру мусить зберегти те, на що спирається повернення фокусу: ключ запису на кнопці (`data-id`), за яким після рендеру знаходять нову кнопку того самого запису."
          en: "A render from data replaces all rows with new ones. So any optimization of the render must keep what returning focus relies on: the record’s key on the button (`data-id`), used after the render to find the new button of the same record."

  - id: price-list
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: price-list
    entry: index.html
    editable: [render.js, report.js]
    strings:
      lang: { uk: "uk", en: "en" }
      locale: { uk: "uk-UA", en: "en-GB" }
      heading: { uk: "Список бажань", en: "Wishlist" }
      measureButton: { uk: "Виміряти рендер", en: "Measure the render" }
      wishes: { uk: "бажань", en: "wishes" }
      median: { uk: "медіана рендеру", en: "median render" }
      noPrice: { uk: "без ціни", en: "no price" }
      acquired: { uk: "Отримано", en: "Acquired" }
      tech: { uk: "Техніка", en: "Tech" }
      home: { uk: "Дім", en: "Home" }
      sport: { uk: "Спорт", en: "Sport" }
      books: { uk: "Книжки", en: "Books" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      sampleHypothesis: { uk: "У профілі найбільше Self time має formatPrice: toLocaleString готує правила формату ціни для кожного з 5 000 рядків", en: "In the profile formatPrice has the most Self time: toLocaleString prepares the price format rules for each of the 5,000 rows" }
      sampleChange: { uk: "Один Intl.NumberFormat, створений один раз над formatPrice", en: "One Intl.NumberFormat created once above formatPrice" }
    title:
      uk: "Покращення зі звітом"
      en: "An improvement with a report"
    instructions:
      uk: |
        Список бажань рендерить 5 000 синтетичних бажань. Кожен рядок має перемикач «Отримано»: після натискання `page.js` перебудовує список і повертає фокус на перемикач того самого бажання.

        1. Запусти, натисни «Виміряти рендер» кілька разів і запиши медіану — це точка відліку. Запиши профіль кліку на цій кнопці й знайди функцію з найбільшим Self time.
        2. У `render.js` зміни **одне** — те, на що вказав профіль. Текст кожного рядка, кнопки, їхні `data-id` і `aria-pressed` мають лишитися такими самими.
        3. Виміряй знову на тих самих 5 000 бажаннях. Пройди список клавішею Tab і натисни Space на перемикачі: фокус має лишитися на ньому.
        4. Заповни `report.js`.

        Перевірка порівнює текст рядків до і після зміни, клікає перемикач і дивиться, де фокус, а ще рахує, скільки разів під час рендеру 2 000 бажань готуються правила формату ціни (виклики `toLocaleString` і `new Intl.NumberFormat`): після покращення їх має бути не більше 100.
      en: |
        The wishlist renders 5,000 synthetic wishes. Every row has an “Acquired” toggle: when it is pressed, `page.js` rebuilds the list and returns focus to the toggle of the same wish.

        1. Run it, press “Measure the render” a few times and write down the median — that is the baseline. Record a profile of a click on that button and find the function with the most Self time.
        2. In `render.js`, change **one** thing — what the profile pointed at. The text of every row, the buttons, their `data-id` and `aria-pressed` must stay the same.
        3. Measure again on the same 5,000 wishes. Walk the list with the Tab key and press Space on a toggle: focus must stay on it.
        4. Fill in `report.js`.

        The check compares the text of the rows before and after the change, clicks a toggle and looks at where focus is, and also counts how many times the price format rules are prepared while 2,000 wishes are rendered (calls of `toLocaleString` and `new Intl.NumberFormat`): after the improvement there must be at most 100.
    testTitles:
      "every row shows the same text as before the change":
        uk: "Кожен рядок показує той самий текст, що й до зміни"
        en: "Every row shows the same text as before the change"
      "prices are formatted with only a few formatter preparations":
        uk: "Ціни форматуються з кількома підготовками правил, а не з тисячами"
        en: "Prices are formatted with only a few formatter preparations"
      "every toggle button keeps its data-id and aria-pressed":
        uk: "Кожен перемикач зберігає `data-id` і `aria-pressed`"
        en: "Every toggle button keeps its `data-id` and `aria-pressed`"
      "after a toggle the focus stays on the same wish":
        uk: "Після перемикання фокус лишається на тому самому бажанні"
        en: "After a toggle the focus stays on the same wish"
      "the report gives both medians at the dataset size of the page":
        uk: "Звіт дає обидві медіани на розмірі даних сторінки"
        en: "The report gives both medians at the dataset size of the page"
      "the report names the hypothesis and the one change":
        uk: "Звіт називає гіпотезу й одну зміну"
        en: "The report names the hypothesis and the one change"
      "the report confirms the tests and the keyboard check":
        uk: "Звіт підтверджує тести й перевірку з клавіатури"
        en: "The report confirms the tests and the keyboard check"
    hints:
      nudge:
        uk: "Подивись, що в `render.js` відбувається для **кожного** рядка, і що з цього однакове для всіх рядків."
        en: "Look at what happens in `render.js` for **every** row, and what of it is the same for all rows."
      explanation:
        uk: "Кав’ярня не друкує нове меню для кожного гостя: меню однакове, його друкують раз і показують усім. Так і з правилами формату: мова й параметри однакові для всіх 5 000 рядків, а `toLocaleString` з параметрами готує їх наново при кожному виклику. Підготуй правила один раз поза функцією рядка й використовуй їх для кожної ціни — або запам’ятовуй уже готовий текст для ціни, яка трапилася вдруге. Не змінюй параметрів формату: якщо зникне валюта, тексти рядків розійдуться зі старими. І не переписуй рендер у рядок HTML: кнопки мають зберегти `data-id`, на який спирається повернення фокусу."
        en: "A café does not print a new menu for every guest: the menu is the same, so it is printed once and shown to everyone. Same with format rules: the language and the options are the same for all 5,000 rows, while `toLocaleString` with options prepares them anew on every call. Prepare the rules once outside the row function and use them for every price — or remember the ready text for a price that comes up again. Do not change the format options: if the currency disappears, the row texts will differ from the old ones. And do not rewrite the render as an HTML string: the buttons must keep the `data-id` that returning focus relies on."
    solutionNote:
      uk: "Один `Intl.NumberFormat`, створений один раз, дає той самий текст, що й `toLocaleString` з тими самими мовою й параметрами, — але правила готуються один раз, а не 5 000. На машині, де писали цю вправу, медіана впала з ~56 до ~9 мс. Пошук категорії через `find` тут дешевий — категорій лише чотири, тож міняти його немає сенсу: це «оптимізація всього потроху». Кеш текстів за ціною — теж чесне рішення. Обидва зберігають поведінку, тому тести й перевірка фокуса проходять."
      en: "One `Intl.NumberFormat` created once gives the same text as `toLocaleString` with the same language and options — but the rules are prepared once, not 5,000 times. On the machine where this exercise was written, the median fell from ~56 to ~9 ms. Looking up the category with `find` is cheap here — there are only four categories, so changing it makes no sense: that would be “optimizing everything a little”. A cache of texts by price is an honest solution too. Both keep the behavior, which is why the tests and the focus check pass."
    feedback:
      - when: { test: "every row shows the same text as before the change" }
        message:
          uk: "Ця перевірка рендерить 300 бажань і порівнює текст кожного рядка з тим, що був до зміни, й називає перший рядок, що відрізняється. Формат ціни має лишитися тим самим: та сама мова, `style: \"currency\"`, `currency: \"UAH\"`, `maximumFractionDigits: 0`, і «без ціни» для `null`."
          en: "This check renders 300 wishes, compares the text of every row with what it was before the change and names the first row that differs. The price format must stay the same: the same language, `style: \"currency\"`, `currency: \"UAH\"`, `maximumFractionDigits: 0`, and “no price” for `null`."
      - when: { test: "prices are formatted with only a few formatter preparations" }
        message:
          uk: "Ця перевірка рахує виклики `toLocaleString` на числах і `new Intl.NumberFormat` під час рендеру 2 000 бажань і чекає не більше 100. Якщо їх близько 2 000, правила формату досі готуються для кожного рядка."
          en: "This check counts calls of `toLocaleString` on numbers and of `new Intl.NumberFormat` while 2,000 wishes are rendered and expects at most 100. If there are about 2,000, the format rules are still prepared for every row."
      - when: { test: "every toggle button keeps its data-id and aria-pressed" }
        message:
          uk: "Ця перевірка рендерить 8 бажань і чекає 8 кнопок, у кожної — `data-id` її бажання й `aria-pressed` зі значенням `acquired`. Якщо рядки тепер складаються з тексту HTML, атрибути легко загубити — і з ними повернення фокусу."
          en: "This check renders 8 wishes and expects 8 buttons, each with its wish’s `data-id` and an `aria-pressed` equal to `acquired`. If the rows are now built from HTML text, the attributes are easy to lose — and returning focus with them."
      - when: { test: "after a toggle the focus stays on the same wish" }
        message:
          uk: "Ця перевірка клікає перемикач бажання `w-3` на сторінці й чекає, що після перебудови фокус буде на кнопці з `data-id=\"w-3\"`, а `aria-pressed` зміниться. `page.js` шукає нову кнопку саме за `data-id`."
          en: "This check clicks the toggle of wish `w-3` on the page and expects focus on the button with `data-id=\"w-3\"` after the rebuild, with `aria-pressed` changed. `page.js` finds the new button exactly by `data-id`."
      - when: { test: "the report gives both medians at the dataset size of the page" }
        message:
          uk: "Ця перевірка чекає в `datasetSize` кількість бажань сторінки (`WISH_COUNT` у `data.js`), а в `baselineMs` і `afterMs` — додатні числа, де «після» менше за «до»."
          en: "This check expects the page’s number of wishes (`WISH_COUNT` in `data.js`) in `datasetSize`, and positive numbers in `baselineMs` and `afterMs`, with “after” smaller than “before”."
      - when: { test: "the report names the hypothesis and the one change" }
        message:
          uk: "Ця перевірка чекає непорожній текст у `hypothesis` (що, на твою думку, повільне і чому) і в `change` (що саме ти змінив)."
          en: "This check expects non-empty text in `hypothesis` (what you believed was slow and why) and in `change` (what exactly you changed)."
      - when: { test: "the report confirms the tests and the keyboard check" }
        message:
          uk: "Ця перевірка чекає `true` в `testsPassed` і `focusKept`. Постав їх лише тоді, коли інші перевірки пройшли й ти сам пройшов список із клавіатури."
          en: "This check expects `true` in `testsPassed` and `focusKept`. Set them only when the other checks pass and you have walked the list with the keyboard yourself."
      - when: { error: RangeError }
        message:
          uk: "`RangeError` під час форматування означає неприпустимий параметр: мову чи `currency`. Залиш ті самі мову й параметри, що були в `toLocaleString`."
          en: "A `RangeError` while formatting means an invalid option: the language or the `currency`. Keep the same language and options that `toLocaleString` had."

  - id: to-project
    kind: transfer
    capstoneStep: JS-17
    body:
      uk: "У кроці проєкту ти пройдеш той самий цикл на своєму застосунку: точка відліку на великому синтетичному наборі, одна зміна, нове вимірювання, тести, що порівнюють старий і новий результат, і перевірка з клавіатури — а підсумок запишеш у README."
      en: "In the project step you will go through the same loop in your own app: a baseline on a large synthetic dataset, one change, a new measurement, tests that compare the old and the new result, and a keyboard check — and you will write the summary in the README."
