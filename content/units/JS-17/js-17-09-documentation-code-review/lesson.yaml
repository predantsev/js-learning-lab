id: js-17-09-documentation-code-review
unit: JS-17
title:
  uk: "Документація та рев’ю коду"
  en: "Documentation and code review"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Написати розділ README і запис рішення, які пояснюють, як запустити проєкт, які в нього межі модулів і один компроміс разом із відкинутою альтернативою."
    en: "Write a README section and a decision record that explain how to run the project, its module boundaries and one tradeoff with its rejected alternative."
  - uk: "Перевірити підготовлений diff за чек-листом (поведінка, тести, назви, доступність, безпека) і написати коментарі, де є проблема, доказ і пропозиція."
    en: "Review a prepared diff against a checklist (behavior, tests, naming, accessibility, security) and write comments that state the problem, the evidence and a suggestion."
prerequisites: [js-17-08-refactor-clean-interfaces, js-15-12-remotes-pr-review]
subskills:
  - { family: P-04, skill: "documentation and code review", depth: intro }
glossary: [decision-record, review-checklist]
selfCheck: [predict-blockers, review-and-record]

blocks:
  - id: what-review-checks
    kind: explanation
    title:
      uk: "Що перевіряє рев’ю, коли тести зелені"
      en: "What a review checks when the tests are green"
    body:
      uk: |
        У JS-15 ти бачив: [[code-review|рев’ю]] — про правильність і намір, а не про смак. Щоб нічого не пропустити, рецензент іде [[review-checklist|чек-листом]]:

        | Пункт | Питання |
        |---|---|
        | поведінка | чи робить зміна те, що обіцяє опис, і чи не ламає того, що вже працювало? |
        | тести | чи є тест на **нову** поведінку? Зелені старі тести нового не перевіряють |
        | назви й інтерфейси | чи не перейменовано експорт, яким користуються інші модулі? |
        | доступність | чи має кожен елемент керування назву й чи працює з клавіатури? |
        | безпека | чи потрапляє текст користувача в небезпечне місце виводу, як `innerHTML`? |

        Блокує злиття те, що ламає поведінку, безпеку чи доступність, або лишає нову поведінку без тесту. Решта — пропозиції: їх пишуть, але `main` вони не тримають.

        Хороший коментар має три частини: **проблема** («назва справи потрапляє в `innerHTML`»), **доказ** («справа з назвою `<img onerror=…>` виконала код у консолі») і **пропозиція** («створи `span` і постав `textContent`»).
      en: |
        In JS-15 you saw that a [[code-review|review]] is about correctness and intent, not taste. To miss nothing, a reviewer goes through a [[review-checklist|checklist]]:

        | Item | Question |
        |---|---|
        | behavior | does the change do what its description promises, without breaking what already worked? |
        | tests | is there a test for the **new** behavior? Green old tests do not check anything new |
        | names and interfaces | was an export that other modules use renamed? |
        | accessibility | does every control have a name and work with the keyboard? |
        | security | does user text reach a dangerous output place such as `innerHTML`? |

        What blocks a merge is anything that breaks behavior, security or accessibility, or leaves new behavior without a test. The rest are suggestions: they are written, but they do not hold `main` back.

        A good comment has three parts: the **problem** (“the task title goes into `innerHTML`”), the **evidence** (“a task named `<img onerror=…>` ran code in the console”) and a **suggestion** (“create a `span` and set `textContent`”).

  - id: predict-blockers
    kind: prediction
    runnable: false
    lang: diff
    prompt:
      uk: "Pull request «Групувати справи за датою». В описі: «Тести: усі зелені». Ось головне з diff. Які проблеми мають **заблокувати злиття**?"
      en: "The pull request “Group tasks by due date”. The description says: “Tests: all green”. Here is the essence of the diff. Which problems should **block the merge**?"
    code: |
      --- a/domain/planner.js
      +++ b/domain/planner.js
      -export function countDueTasks(tasks, today) {
      +export function countDue(tasks, today) {
      +export function groupByDueDate(tasks) { … }      // new, no test file changed
      --- a/ui/page.js
      +++ b/ui/page.js
      -    row.textContent = task.title;
      +      row.innerHTML = `<span class="title">${task.title}</span>`;
      -    done.textContent = "Done";
      +      done.innerHTML = CHECK_ICON;                  // an svg with aria-hidden="true"
      +  if (tasks.length > 500) {
      --- a/storage/planner.js
      +++ b/storage/planner.js
      -export function saveTasks(storage, tasks) { storage.setItem(…); }
      +export function saveTasks(storage, tasks) {
      +  storage.setItem(…);
      +}
    answer:
      type: multi
      options:
        - id: missing-test
          text:
            uk: "Нова `groupByDueDate` без жодного тесту"
            en: "The new `groupByDueDate` without a single test"
        - id: renamed-export
          text:
            uk: "Експорт `countDueTasks` перейменовано на `countDue`"
            en: "The export `countDueTasks` was renamed to `countDue`"
        - id: inner-html
          text:
            uk: "Назва справи вставляється через `innerHTML`"
            en: "The task title is inserted with `innerHTML`"
        - id: unnamed-button
          text:
            uk: "Кнопка «виконано» — лише іконка, без назви"
            en: "The “done” button is just an icon, with no name"
        - id: magic-number
          text:
            uk: "Число `500` без пояснення"
            en: "The number `500` without an explanation"
          why:
            uk: "Варто запропонувати іменовану сталу (`LARGE_LIST = 500`), але поведінка й безпека від цього не страждають — це пропозиція, не блокер."
            en: "It is worth suggesting a named constant (`LARGE_LIST = 500`), but neither behavior nor safety suffers — it is a suggestion, not a blocker."
        - id: formatting
          text:
            uk: "`saveTasks` переписано на три рядки"
            en: "`saveTasks` was rewritten on three lines"
          why:
            uk: "Це зміна лише форматування: поведінка та сама. Такі речі вирівнює formatter, і рев’ю їх не блокує."
            en: "That is a formatting-only change: the behavior is the same. A formatter evens such things out, and a review does not block them."
      correct: [missing-test, renamed-export, inner-html, unnamed-button]
    explanation:
      uk: "«Тести зелені» — бо жоден тест не торкається нового коду. Перейменований експорт ламає `app.js`, який досі імпортує `countDueTasks`: модуль не завантажиться. `innerHTML` з назвою справи перетворює текст користувача на розмітку — це XSS. Кнопка лише з іконкою `aria-hidden` не має назви: програма екранного читання оголосить просто «кнопка». Магічне число й переформатування — коментарі-пропозиції."
      en: "“Tests are green” — because no test touches the new code. The renamed export breaks `app.js`, which still imports `countDueTasks`: the module will not load. `innerHTML` with the task title turns the user’s text into markup — that is XSS. A button with only an `aria-hidden` icon has no name: a screen reader announces just “button”. The magic number and the reformatting are suggestion comments."

  - id: confirm-issues
    kind: example
    runtime: browser-js
    dir: confirm-issues
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      heading: { uk: "Справи за датою", en: "Tasks by due date" }
      hint: { uk: "Список великий: скористайся пошуком.", en: "The list is long: use the search." }
      plants: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      injected: { uk: "Цей текст із назви справи виконався як код", en: "This text from a task title ran as code" }
      doneClicked: { uk: "Виконано:", en: "Done:" }
      imagesInTitles: { uk: "Елементів img у назвах справ:", en: "img elements inside task titles:" }
      tValid: { uk: "назва з пробілами — дійсна", en: "a title with spaces is valid" }
      mValid: { uk: "validateTask(…).ok", en: "validateTask(…).ok" }
      tEmpty: { uk: "порожня назва — недійсна", en: "an empty title is invalid" }
      mEmpty: { uk: "validateTask(…).ok", en: "validateTask(…).ok" }
      tDue: { uk: "одна справа на сьогодні", en: "one task due today" }
      mDue: { uk: "countDue(…)", en: "countDue(…)" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Доказ для двох коментарів"
      en: "Evidence for two comments"
    body:
      uk: |
        Тут код гілки з pull request: `ui/page.js` і `domain/planner.js` такі самі, як у diff. `main.js` малює три синтетичні справи; назва однієї містить розмітку — таке людина могла б ввести у форму. `run-tests.js` запускає тести гілки.

        Запусти й прочитай консоль: тести зелені — але подивись, що ще там написано.
      en: |
        Here is the branch code of the pull request: `ui/page.js` and `domain/planner.js` are the same as in the diff. `main.js` draws three synthetic tasks; the title of one contains markup — something a person could type into the form. `run-tests.js` runs the branch’s tests.

        Run it and read the console: the tests are green — but look at what else is written there.
    tryIt:
      uk: |
        1. **Тести.** Три тести зелені. Яких функцій із diff вони торкаються? `groupByDueDate` і `renderGroups` не перевіряє жоден — це доказ для коментаря «немає тесту».
        2. **Безпека.** У консолі є рядок «Цей текст із назви справи виконався як код», а лічильник показує один `img` у назвах. Текст із назви справи став розміткою й виконав код — це доказ для коментаря про `innerHTML`.
        3. **Доступність.** На вкладці **Сторінка** клацни правою кнопкою на кнопці з галочкою → **Перевірити** (Inspect) → вкладка **Accessibility**: у полі **Name** порожньо. Це доказ для коментаря про кнопку без назви.
        4. **Перевір пропозицію.** У `ui/page.js` заміни рядок з `row.innerHTML` на створення `span` з класом `title` і `textContent = task.title`. Запусти: рядка «Цей текст із назви справи виконався як код» більше немає, а лічильник показує `0`.
      en: |
        1. **Tests.** Three tests are green. Which functions of the diff do they touch? Neither `groupByDueDate` nor `renderGroups` is checked by any — that is the evidence for the comment “no test”.
        2. **Security.** The console has the line “This text from a task title ran as code”, and the counter shows one `img` inside the titles. The text of a task title became markup and ran code — that is the evidence for the comment about `innerHTML`.
        3. **Accessibility.** On the **Page** tab, right-click the button with the check mark → **Inspect** → the **Accessibility** tab: the **Name** field is empty. That is the evidence for the comment about a button without a name.
        4. **Check the suggestion.** In `ui/page.js`, replace the line with `row.innerHTML` by creating a `span` with the class `title` and `textContent = task.title`. Run: the line “This text from a task title ran as code” is gone, and the counter shows `0`.

  - id: write-it-down
    kind: explanation
    title:
      uk: "README і запис рішення"
      en: "A README and a decision record"
    body:
      uk: |
        «Хороший код документує себе сам» — правда лише наполовину. Код каже, **що** він робить. Він не каже, як запустити проєкт, хто кого має право імпортувати і **чому** обрано саме такий підхід, а не очевидний інший.

        - **README** відповідає людині, яка вперше відкрила репозиторій: команди запуску й тестів у блоці коду, межі модулів (що лежить у `domain/`, `storage/`, `ui/`, хто кого імпортує).
        - [[decision-record|Запис рішення]] (decision record) — коротка нотатка про один компроміс: **контекст** (яку проблему розв’язуємо й на яких даних), **рішення**, **відкинута альтернатива з причиною**, **докази** (числа з розміром даних) і **наслідки** (що тепер доведеться підтримувати).

        Через пів року хтось захоче «спростити» `Map` назад до `filter` для кожної дати. Запис рішення з числами відповість йому раніше, ніж він відкриє профіль.
      en: |
        “Good code documents itself” is only half true. Code says **what** it does. It does not say how to run the project, who may import whom, and **why** this approach was chosen over the obvious other one.

        - The **README** answers a person who has just opened the repository: the commands to run and test in a code block, the module boundaries (what lives in `domain/`, `storage/`, `ui/`, who imports whom).
        - A [[decision-record]] is a short note about one tradeoff: the **context** (which problem, on which data), the **decision**, the **rejected alternative with its reason**, the **evidence** (numbers with the data size) and the **consequences** (what now has to be maintained).

        Half a year later someone will want to “simplify” the `Map` back to a `filter` for every date. A decision record with numbers answers them before they open a profile.

  - id: recall-safe-sinks
    kind: review
    title:
      uk: "Пригадай: безпечні місця виводу"
      en: "Recall: safe sinks"
    items:
      - id: which-sink
        from: js-16-07-xss-safe-sinks
        prompt:
          uk: "Назва справи прийшла з форми. Котрий спосіб показати її на сторінці **безпечний**, навіть якщо в назві є `<img src=x onerror=…>`?"
          en: "A task title came from a form. Which way of showing it on the page is **safe**, even if the title contains `<img src=x onerror=…>`?"
        answer:
          type: choice
          options:
            - id: text-content
              text:
                uk: "`span.textContent = task.title`"
                en: "`span.textContent = task.title`"
            - id: inner-html-span
              text:
                uk: "`row.innerHTML = \"<span>\" + task.title + \"</span>\"`"
                en: "`row.innerHTML = \"<span>\" + task.title + \"</span>\"`"
              why:
                uk: "Склеювання рядків нічого не змінює: браузер розбирає весь рядок як HTML, і `img` з `onerror` стає справжнім елементом."
                en: "Joining strings changes nothing: the browser parses the whole string as HTML, and the `img` with `onerror` becomes a real element."
            - id: inner-html-trim
              text:
                uk: "`row.innerHTML = task.title.trim()`"
                en: "`row.innerHTML = task.title.trim()`"
              why:
                uk: "`trim` прибирає лише пробіли на краях; розмітка лишається розміткою."
                en: "`trim` removes only the spaces at the edges; markup stays markup."
          correct: [text-content]
        explanation:
          uk: "`textContent` записує текст як текст: кутові дужки показуються, а не розбираються. Тому в рев’ю «текст користувача в `innerHTML`» — завжди блокер, а пропозиція до нього — `createElement` і `textContent`."
          en: "`textContent` writes text as text: angle brackets are shown, not parsed. That is why in a review “user text in `innerHTML`” is always a blocker, and the suggestion for it is `createElement` and `textContent`."

  - id: review-and-record
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: review-and-record
    entry: index.js
    editable: [review.js, README.md]
    strings:
      decisionTitle: { uk: "Групувати справи за датою одним проходом із Map", en: "Group tasks by due date in one pass with a Map" }
      decisionLabel: { uk: "Рішення:", en: "Decision:" }
      blocking: { uk: "блокує", en: "blocks" }
      nonBlocking: { uk: "пропозиція", en: "suggestion" }
      noSuchLine: { uk: "немає такого рядка", en: "no such line" }
      noComments: { uk: "Коментарів ще немає.", en: "No comments yet." }
      sContext: { uk: "Сторінка показує справи групами за датою; у великих списках до 5 000 справ на 60 дат.", en: "The page shows tasks in groups by date; large lists hold up to 5,000 tasks over 60 dates." }
      sDecision: { uk: "groupByDueDate проходить список один раз і кладе кожну справу в Map від дати до масиву справ.", en: "groupByDueDate walks the list once and puts every task into a Map from date to an array of tasks." }
      sRejected: { uk: "filter усього списку для кожної дати", en: "a filter of the whole list for every date" }
      sRejectedReason: { uk: "робить n × d порівнянь і росте разом із кількістю дат", en: "makes n × d comparisons and grows with the number of dates" }
      sEvidence: { uk: "5 000 справ, 60 дат: 300 000 порівнянь у filter проти 5 000 кроків одного проходу.", en: "5,000 tasks, 60 dates: 300,000 comparisons with filter against 5,000 steps in one pass." }
      sConsequences: { uk: "Map тримає ще по одному масиву на дату; порядок груп — порядок першої появи дати, тож список треба сортувати до групування.", en: "The Map keeps one more array per date; the order of groups is the order in which dates first appear, so the list must be sorted before grouping." }
      c1Problem: { uk: "Назва справи вставляється через innerHTML, тож текст користувача стає розміткою.", en: "The task title is inserted with innerHTML, so the user’s text becomes markup." }
      c1Evidence: { uk: "Справа з назвою <img src=missing.svg onerror=…> виконала код: у консолі з’явився рядок із onerror.", en: "A task named <img src=missing.svg onerror=…> ran code: the line from onerror appeared in the console." }
      c1Suggestion: { uk: "Створити span з класом title і записати назву в textContent.", en: "Create a span with the class title and write the title into textContent." }
      c2Problem: { uk: "Кнопка «виконано» містить лише іконку з aria-hidden і не має назви.", en: "The “done” button holds only an aria-hidden icon and has no name." }
      c2Evidence: { uk: "У вкладці Accessibility поле Name кнопки порожнє.", en: "In the Accessibility tab the button’s Name field is empty." }
      c2Suggestion: { uk: "Додати видимий текст поруч з іконкою або aria-label із назвою справи.", en: "Add visible text next to the icon or an aria-label with the task title." }
      c3Problem: { uk: "Експорт countDueTasks перейменовано на countDue, а app.js досі імпортує стару назву.", en: "The export countDueTasks was renamed to countDue, while app.js still imports the old name." }
      c3Evidence: { uk: "Рядок 1 app.js: import { countDueTasks } — модуль не завантажиться.", en: "Line 1 of app.js: import { countDueTasks } — the module will not load." }
      c3Suggestion: { uk: "Лишити стару назву або оновити всі імпорти в тому самому pull request.", en: "Keep the old name or update every import in the same pull request." }
      c4Problem: { uk: "Число 500 у перевірці довжини списку нічого не пояснює.", en: "The number 500 in the list length check explains nothing." }
      c4Evidence: { uk: "Рядок 25 ui/page.js: if (tasks.length > 500).", en: "Line 25 of ui/page.js: if (tasks.length > 500)." }
      c4Suggestion: { uk: "Назвати сталу, наприклад LARGE_LIST = 500, з коментарем, звідки ця межа.", en: "Name the constant, for example LARGE_LIST = 500, with a comment on where the limit comes from." }
      c5Problem: { uk: "app.js імпортує countDueTasks, якого більше не існує.", en: "app.js imports countDueTasks, which no longer exists." }
      c5Evidence: { uk: "У domain/planner.js після зміни є лише countDue (рядок 10).", en: "After the change domain/planner.js has only countDue (line 10)." }
      c5Suggestion: { uk: "Перейменувати імпорт або повернути експорт зі старою назвою.", en: "Rename the import or bring back the export under the old name." }
      fmtProblem: { uk: "saveTasks переписано на три рядки.", en: "saveTasks was rewritten on three lines." }
      fmtEvidence: { uk: "Diff storage/planner.js змінює лише розриви рядків.", en: "The diff of storage/planner.js changes only line breaks." }
      fmtSuggestion: { uk: "Нехай форматування робить formatter окремим комітом.", en: "Let the formatter do formatting in a separate commit." }
      runHeading: { uk: "Запуск", en: "Running" }
      modulesHeading: { uk: "Модулі", en: "Modules" }
      modDomain: { uk: "чисті функції справ: перевірка, підрахунок, групування; не знає про сторінку й сховище.", en: "pure task functions: validation, counting, grouping; knows nothing about the page or storage." }
      modStorage: { uk: "читання й запис справ у localStorage; імпортує лише власні сталі.", en: "reading and writing tasks in localStorage; imports only its own constants." }
      modUi: { uk: "малює справи на сторінці; імпортує домен, але не сховище.", en: "draws tasks on the page; imports the domain but not storage." }
      modApp: { uk: "з’єднує домен, сховище й сторінку; єдиний модуль, що імпортує всі три.", en: "connects the domain, storage and the page; the only module that imports all three." }
    title:
      uk: "Рев’ю, запис рішення і README"
      en: "A review, a decision record and a README"
    instructions:
      uk: |
        У `change.diff` — той самий pull request, у папці `after/` — файли гілки після зміни (лише для читання; номери рядків бери звідти).

        1. У `review.js` заповни `decision` — запис рішення про `groupByDueDate`: один прохід із `Map` проти `filter` для кожної дати. У `evidence` мають бути числа з розміром даних.
        2. У `comments` напиши щонайменше три коментарі `{ file, line, problem, evidence, suggestion, blocking }`. `file` — шлях усередині `after/` (наприклад `"ui/page.js"`), `line` — номер рядка в ньому. Серед них мають бути блокувальні коментарі про `innerHTML` з назвою справи і про кнопку без назви; зміну лише форматування не блокуй.
        3. У `README.md` напиши два розділи `## …`: як запустити проєкт (команди в блоці коду) і межі модулів — згадай кожен із чотирьох файлів.

        **Запустити** показує кожен твій коментар поруч із рядком, на який він указує. Коментарі можна писати українською.
      en: |
        `change.diff` holds the same pull request, and the `after/` folder holds the branch’s files after the change (read-only; take the line numbers from there).

        1. In `review.js`, fill in `decision` — a decision record about `groupByDueDate`: one pass with a `Map` against a `filter` for every date. `evidence` must contain numbers with the data size.
        2. In `comments`, write at least three comments `{ file, line, problem, evidence, suggestion, blocking }`. `file` is a path inside `after/` (for example `"ui/page.js"`), `line` is a line number in it. Among them there must be blocking comments about `innerHTML` with the task title and about the button without a name; do not block the formatting-only change.
        3. In `README.md`, write two `## …` sections: how to run the project (the commands in a code block) and the module boundaries — mention each of the four files.

        **Run** shows each of your comments next to the line it points at.
    testTitles:
      "the decision record has context, decision, a rejected option and consequences":
        uk: "Запис рішення має контекст, рішення, відкинутий варіант і наслідки"
        en: "The decision record has context, decision, a rejected option and consequences"
      "the decision record gives numbers as evidence":
        uk: "Запис рішення наводить числа як доказ"
        en: "The decision record gives numbers as evidence"
      "there are at least three comments, each pointing at a real line":
        uk: "Щонайменше три коментарі, кожен указує на справжній рядок"
        en: "At least three comments, each pointing at a real line"
      "every comment states the problem, the evidence and a suggestion":
        uk: "Кожен коментар має проблему, доказ і пропозицію"
        en: "Every comment states the problem, the evidence and a suggestion"
      "a blocking comment points at the innerHTML line with the task title":
        uk: "Блокувальний коментар указує на рядок `innerHTML` з назвою справи"
        en: "A blocking comment points at the `innerHTML` line with the task title"
      "a blocking comment points at the done button that has no name":
        uk: "Блокувальний коментар указує на кнопку «виконано» без назви"
        en: "A blocking comment points at the “done” button that has no name"
      "the formatting-only change does not block the merge":
        uk: "Зміна лише форматування не блокує злиття"
        en: "The formatting-only change does not block the merge"
      "the README explains how to run the project":
        uk: "README пояснює, як запустити проєкт"
        en: "The README explains how to run the project"
      "the README names every module":
        uk: "README називає кожен модуль"
        en: "The README names every module"
    hints:
      nudge:
        uk: "Почни з `after/ui/page.js`: знайди рядки, де назва справи потрапляє на сторінку і де створюється кнопка. Запусти — консоль покаже, на який рядок указує кожен коментар."
        en: "Start with `after/ui/page.js`: find the lines where the task title reaches the page and where the button is created. Run — the console shows which line every comment points at."
      explanation:
        uk: "Коментар у рев’ю схожий на запис у журналі техогляду авто: «передні гальма» (де), «колодки 2 мм» (доказ), «замінити до поїздки» (пропозиція) і чи можна їхати (блокує чи ні). Доказ — це те, що ти бачив сам: рядок у консолі, порожнє поле в Accessibility, номер рядка з імпортом старої назви. Для запису рішення порахуй кроки для обох варіантів на одному розмірі даних — як у попередніх уроках — і напиши, чого вибір коштуватиме далі. README пиши для людини, яка завтра вперше склонує репозиторій."
        en: "A review comment is like an entry in a car inspection log: “front brakes” (where), “pads 2 mm” (evidence), “replace before driving” (suggestion) and whether the car may go (blocks or not). Evidence is what you saw yourself: a line in the console, an empty field in Accessibility, the line number of an import of the old name. For the decision record, count the steps of both options at one data size — as in the previous lessons — and write what the choice will cost from now on. Write the README for a person who will clone the repository for the first time tomorrow."
    solutionNote:
      uk: "Блокери тут — те, що ламає безпеку (`innerHTML` з текстом користувача), доступність (кнопка без назви) і роботу інших модулів (перейменований експорт). Магічне число — пропозиція, переформатування не варте коментаря-блокера. Запис рішення тримає числа з розміром даних і чесні наслідки: `Map` коштує пам’яті, а порядок груп залежить від порядку справ. README відповідає на два питання новенького: «як запустити» і «хто кого імпортує»."
      en: "The blockers here are what breaks security (`innerHTML` with user text), accessibility (a button without a name) and other modules (a renamed export). The magic number is a suggestion, and the reformatting is not worth a blocking comment. The decision record keeps the numbers with the data size and honest consequences: the `Map` costs memory, and the order of the groups depends on the order of the tasks. The README answers a newcomer’s two questions: “how do I run it” and “who imports whom”."
    feedback:
      - when: { test: "the decision record has context, decision, a rejected option and consequences" }
        message:
          uk: "Ця перевірка чекає в `context`, `decision` і `consequences` текст щонайменше з 10 знаків, а в `rejected` — непорожні `option` і `reason`."
          en: "This check expects text of at least 10 characters in `context`, `decision` and `consequences`, and non-empty `option` and `reason` in `rejected`."
      - when: { test: "the decision record gives numbers as evidence" }
        message:
          uk: "Ця перевірка чекає в `evidence` текст, де є хоча б одне число: кількість кроків чи мілісекунд разом із розміром даних."
          en: "This check expects text with at least one number in `evidence`: a number of steps or milliseconds together with the data size."
      - when: { test: "there are at least three comments, each pointing at a real line" }
        message:
          uk: "Ця перевірка чекає щонайменше три коментарі, де `file` — один із `domain/planner.js`, `ui/page.js`, `storage/planner.js`, `app.js`, а `line` — ціле число, номер наявного рядка в цьому файлі папки `after/`."
          en: "This check expects at least three comments where `file` is one of `domain/planner.js`, `ui/page.js`, `storage/planner.js`, `app.js`, and `line` is a whole number, the number of an existing line in that file of the `after/` folder."
      - when: { test: "every comment states the problem, the evidence and a suggestion" }
        message:
          uk: "Ця перевірка чекає в кожному коментарі `problem`, `evidence` і `suggestion` щонайменше з 10 знаків і `blocking` — `true` або `false`."
          en: "This check expects `problem`, `evidence` and `suggestion` of at least 10 characters in every comment and `blocking` set to `true` or `false`."
      - when: { test: "a blocking comment points at the innerHTML line with the task title" }
        message:
          uk: "Ця перевірка шукає коментар із `blocking: true` на рядку `ui/page.js`, де `row.innerHTML` отримує `task.title`. Запусти, щоб побачити, на який рядок указує твій коментар."
          en: "This check looks for a comment with `blocking: true` on the line of `ui/page.js` where `row.innerHTML` gets `task.title`. Run to see which line your comment points at."
      - when: { test: "a blocking comment points at the done button that has no name" }
        message:
          uk: "Ця перевірка шукає коментар із `blocking: true` на рядку `ui/page.js`, де створюється кнопка `done` або куди в неї кладеться `CHECK_ICON`."
          en: "This check looks for a comment with `blocking: true` on the line of `ui/page.js` where the `done` button is created or where `CHECK_ICON` is put into it."
      - when: { test: "the formatting-only change does not block the merge" }
        message:
          uk: "Ця перевірка чекає, що жоден коментар до `storage/planner.js` не має `blocking: true`: там змінилися лише розриви рядків."
          en: "This check expects no comment on `storage/planner.js` to have `blocking: true`: only line breaks changed there."
      - when: { test: "the README explains how to run the project" }
        message:
          uk: "Ця перевірка чекає в `README.md` щонайменше два заголовки, що починаються з `## `, і блок коду між трьома зворотними лапками, де є хоча б одна команда — наприклад `npm install`, `npm run dev` чи `npx serve .`."
          en: "This check expects at least two headings starting with `## ` in `README.md` and a code block between triple backticks with at least one command in it — for example `npm install`, `npm run dev` or `npx serve .`."
      - when: { test: "the README names every module" }
        message:
          uk: "Ця перевірка шукає в `README.md` усі чотири шляхи: `domain/planner.js`, `storage/planner.js`, `ui/page.js`, `app.js`, і називає ті, яких бракує."
          en: "This check looks for all four paths in `README.md`: `domain/planner.js`, `storage/planner.js`, `ui/page.js`, `app.js`, and names the missing ones."
      - when: { error: SyntaxError }
        message:
          uk: "Якщо картка каже «Код не вдалося запустити», у `review.js` найчастіше бракує коми між коментарями чи полями або лапок навколо тексту. Лапки всередині тексту заміни на «ялинки» чи апостроф ’."
          en: "If the card says “The code could not start”, `review.js` is most often missing a comma between comments or fields, or quotes around text. Replace quotes inside the text with typographic ones."

  - id: to-project
    kind: transfer
    capstoneStep: JS-17
    body:
      uk: "У кроці проєкту README твого застосунку отримає розділ про виміряне покращення й аудит, а заміна перетворення на індексоване — короткий запис рішення з числами «до» і «після». Перш ніж комітити, пройди свій diff тим самим чек-листом."
      en: "In the project step, your app’s README gets a section about the measured improvement and the audit, and replacing the transform with an indexed one gets a short decision record with the “before” and “after” numbers. Before committing, go through your diff with the same checklist."
