id: re-02-07-reset-preserve-identity
unit: RE-02
title:
  uk: "Скидаємо й зберігаємо стан"
  en: "Reset and preserve state identity"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити, чи переживе стан компонента повторний рендер, за його місцем у дереві та ключем."
    en: "Predict whether a component's state survives a re-render from its position in the tree and its key."
  - uk: "Скинути форму редагування, коли змінюється вибраний запис, через `key={record.id}`, а фільтр в іншому місці хай зберігає свій стан."
    en: "Reset an edit form when the selected record changes by giving it `key={record.id}`, while a filter elsewhere keeps its state."
prerequisites: [re-02-06-controlled-inputs-typed-events, re-01-05-keys-identity]
subskills:
  - { family: R-02, skill: "reset/preserve identity", depth: intro }
glossary: [tree-position, state-reset]
selfCheck: [switch-predict, wish-switcher]

blocks:
  - id: state-lives-in-the-tree
    kind: explanation
    title:
      uk: "Стан живе в місці дерева"
      en: "State lives at a place in the tree"
    body:
      uk: |
        Стан не належить коду компонента й не прив’язаний до його props. React тримає його для конкретного **місця** в дереві — для [[tree-position|позиції]]: «перший дочірній `EditForm` усередині `main`».

        Поки на тій самій позиції рендериться той самий компонент, React вважає його тим самим і **зберігає** стан — навіть якщо props тепер інші:

        ```jsx
        function EditForm({ task }) {
          const [title, setTitle] = useState(task.title); // used only the first time
          // …
        }

        <EditForm task={selected} />   // selected changed? the old title stays
        ```

        `useState(task.title)` бере початкове значення лише тоді, коли `EditForm` з’являється вперше. Інший `task` у props нового стану не створює: форма показує нову назву в заголовку, а в полі — стару чернетку.

        Стан пропадає, коли компонент **зникає** з цієї позиції: його прибрали з JSX або на тому місці тепер інший компонент. Ще один спосіб — змінити його ключ; про це далі в уроці.
      en: |
        State does not belong to a component's code and is not tied to its props. React keeps it for a particular **place** in the tree — for a [[tree-position]]: “the first `EditForm` child inside `main`”.

        As long as the same component renders at the same position, React treats it as the same one and **keeps** its state — even if its props are different now:

        ```jsx
        function EditForm({ task }) {
          const [title, setTitle] = useState(task.title); // used only the first time
          // …
        }

        <EditForm task={selected} />   // selected changed? the old title stays
        ```

        `useState(task.title)` takes its initial value only when `EditForm` appears for the first time. A different `task` in the props creates no new state: the form shows the new title in its heading and the old draft in the field.

        State is lost when the component **disappears** from that position: it was removed from the JSX, or a different component now stands in that place. One more way is to change its key; that comes later in this lesson.

  - id: switch-predict
    kind: prediction
    lang: jsx
    runnable: false
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
    prompt:
      uk: "Вибрано звичку «Ранкова зарядка». Людина дописує в поле назви знак оклику, а тоді клацає звичку «Прибирання». Що буде в полі назви — без `key` і з `key={selected.id}`?"
      en: "The habit “Morning exercise” is selected. A person adds an exclamation mark in the name field and then clicks the habit “Tidy up”. What is in the name field — without `key` and with `key={selected.id}`?"
    code: |
      function EditForm({ habit }) {
        const [name, setName] = useState(habit.name);
        return <input value={name} onChange={(event) => setName(event.target.value)} />;
      }

      // version A
      <EditForm habit={selected} />
      // version B
      <EditForm key={selected.id} habit={selected} />
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "A: «Ранкова зарядка!»; B: «Прибирання»"
            en: "A: “Morning exercise!”; B: “Tidy up”"
        - id: both-new
          text:
            uk: "В обох: «Прибирання»"
            en: "In both: “Tidy up”"
          why:
            uk: "Без `key` на тій самій позиції той самий компонент — React зберігає його стан, а `useState` уже не дивиться на нові props."
            en: "Without `key` the same component is at the same position — React keeps its state, and `useState` no longer looks at the new props."
        - id: both-old
          text:
            uk: "В обох: «Ранкова зарядка!»"
            en: "In both: “Morning exercise!”"
          why:
            uk: "Інший `key` означає інший компонент: React прибирає старий `EditForm` разом зі станом і створює новий."
            en: "A different `key` means a different component: React removes the old `EditForm` together with its state and creates a new one."
        - id: both-empty
          text:
            uk: "В обох поле порожнє"
            en: "The field is empty in both"
          why:
            uk: "Новий `EditForm` теж отримує початкове значення з `habit.name` — порожнім поле не буває."
            en: "A new `EditForm` also takes its initial value from `habit.name` — the field is never empty."
      correct: [right]
    explanation:
      uk: "У варіанті A `EditForm` лишається на тій самій позиції, тож React зберігає його стан `name` — з дописаним знаком оклику, хоча `habit` уже інша. У варіанті B ключ змінився з `h-01` на `h-04`: для React це інший компонент, старий зникає разом зі станом, а новий бере початкове значення з нової звички."
      en: "In version A `EditForm` stays at the same position, so React keeps its `name` state — with the added exclamation mark, although `habit` is different now. In version B the key changed from `h-01` to `h-04`: for React this is a different component, the old one disappears together with its state, and the new one takes its initial value from the new habit."

  - id: key-resets
    kind: explanation
    title:
      uk: "Ключ — це ім’я компонента"
      en: "A key is the component's name"
    body:
      uk: |
        В уроці про ключі [[list-key|ключ]] допомагав React зіставити елементи масиву між рендерами. Ключ працює й поза списками: він каже, **хто** стоїть на цій позиції.

        ```jsx
        <EditForm key={task.id} task={task} />
        ```

        Поки `task.id` той самий, це той самий `EditForm`, і чернетка зберігається. Змінився `id` — React бачить **інший** компонент: старий прибирає разом зі станом і DOM-вузлами, а новий створює з нуля. Це і є [[state-reset|скидання стану]].

        Ключ став лише на те, що треба скидати. Фільтр списку поруч із формою свого ключа не має, тому зберігає вибране, хоч би скільки разів ти перемикав записи.
      en: |
        In the lesson on keys a [[list-key|key]] helped React match array elements between renders. A key works outside lists too: it says **who** stands at this position.

        ```jsx
        <EditForm key={task.id} task={task} />
        ```

        As long as `task.id` is the same, it is the same `EditForm`, and the draft is kept. Once the `id` changes, React sees a **different** component: it removes the old one together with its state and DOM nodes and creates the new one from scratch. That is a [[state-reset]].

        Put a key only on what has to be reset. A list filter next to the form has no key of its own, so it keeps its selection however many times you switch records.

  - id: tree-diagram
    kind: visual
    visual: diagram
    title:
      uk: "Та сама коробка чи нова"
      en: "The same box or a new one"
    textEquivalent:
      uk: >-
        Дерево: компонент App містить фільтр Filter і форму EditForm. Без ключа після вибору іншого запису EditForm стоїть на тій
        самій позиції, тож React зберігає його стан — стару чернетку, хоча props уже про інший запис. З key={record.id} новий id
        означає інший компонент: React прибирає старий EditForm зі станом і створює новий, з чернеткою з нового запису. Filter
        увесь цей час стоїть на своїй позиції без ключа й зберігає вибраний фільтр.
      en: >-
        The tree: the App component contains the filter Filter and the form EditForm. Without a key, after another record is
        selected EditForm stands at the same position, so React keeps its state — the old draft, although the props are about
        another record now. With key={record.id} the new id means a different component: React removes the old EditForm with its
        state and creates a new one, with a draft from the new record. Filter stands at its own position without a key all this
        time and keeps the selected filter.
    spec:
      layout: grid
      nodes:
        - { id: app, label: "App", col: 0, row: 0, w: 110 }
        - { id: filter, label: "Filter", col: 0, row: 1, w: 110 }
        - { id: form-old, label: "EditForm (h-01)", col: 1, row: 1, w: 150 }
        - { id: form-new, label: "EditForm (h-04)", col: 1, row: 2, w: 150 }
      edges:
        - { id: app-filter, from: app, to: filter }
        - { id: app-form-old, from: app, to: form-old }
        - { id: app-form-new, from: app, to: form-new }
      hidden: [form-new, app-form-new]
      steps:
        - caption:
            uk: "App рендерить фільтр і форму редагування. Обидва мають свій стан: вибраний фільтр і чернетку."
            en: "App renders a filter and an edit form. Both have their own state: the selected filter and a draft."
        - caption:
            uk: "Без ключа: вибрали інший запис — на позиції форми той самий `EditForm`. React зберігає його стан: у полі стара чернетка, хоча props уже про інший запис."
            en: "Without a key: another record is selected — the same `EditForm` stands at the form's position. React keeps its state: the field shows the old draft, although the props are about another record."
          highlight: [form-old]
          annotate:
            - { id: form-old, text: { uk: "стара чернетка", en: "old draft" } }
        - caption:
            uk: "З `key={record.id}`: ключ змінився — для React це інший компонент. Старий `EditForm` зникає разом зі станом…"
            en: "With `key={record.id}`: the key changed — for React this is a different component. The old `EditForm` disappears together with its state…"
          dim: [form-old, app-form-old]
        - caption:
            uk: "…а новий `EditForm` з’являється з нуля й бере чернетку з нового запису. Фільтр без ключа весь цей час на своєму місці й пам’ятає вибране."
            en: "…and a new `EditForm` appears from scratch and takes its draft from the new record. The filter without a key stays in its place all this time and remembers its selection."
          show: [form-new, app-form-new]
          dim: [form-old, app-form-old]
          highlight: [form-new, filter]

  - id: habit-switcher
    kind: example
    runtime: browser-react
    dir: habit-switcher
    entry: main.jsx
    strings:
      title: { uk: "Трекер звичок", en: "Habit tracker" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      editing: { uk: "Редагуємо", en: "Editing" }
      nameLabel: { uk: "Назва", en: "Name" }
    title:
      uk: "Чернетка, що не хоче зникати"
      en: "A draft that will not go away"
    body:
      uk: |
        Кнопки вгорі вибирають звичку, а `EditForm` під ними тримає чернетку назви у своєму стані. Консоль показує, яку звичку отримав `EditForm` і що в його стані. Запусти, допиши щось у поле на вкладці **Сторінка** й вибери іншу звичку.
      en: |
        The buttons at the top select a habit, and `EditForm` below keeps a name draft in its own state. The console shows which habit `EditForm` got and what is in its state. Run it, add something in the field on the **Page** tab and pick another habit.
    tryIt:
      uk: |
        1. Заголовок форми показує нову звичку, а поле — твою стару чернетку. Консоль: `habit = h-04`, але `name` — від першої звички.
        2. Додай ключ: `<EditForm key={selected.id} habit={selected} />`. Запусти, знову змінюй поле й перемикай звички: тепер щоразу в полі назва вибраної звички.
        3. Повернись до звички, яку змінював: чернетки немає. Старий `EditForm` зник разом зі станом — ключ скидає стан, а не ховає його.
      en: |
        1. The form's heading shows the new habit, while the field shows your old draft. Console: `habit = h-04`, but `name` is from the first habit.
        2. Add a key: `<EditForm key={selected.id} habit={selected} />`. Run, change the field again and switch habits: now the field always shows the selected habit's name.
        3. Go back to the habit you edited: the draft is gone. The old `EditForm` disappeared together with its state — a key resets state, it does not hide it.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: замінений елемент"
      en: "Recall: a replaced element"
    items:
      - id: replaced-loses-focus
        from: js-06-12-focus-management
        prompt:
          uk: "Курсор стоїть у полі. Код прибирає цей `<input>` зі сторінки й вставляє на його місце новий, такий самий на вигляд. Де опиниться фокус?"
          en: "The cursor is in a field. Code removes that `<input>` from the page and inserts a new one in its place that looks the same. Where does the focus end up?"
        answer:
          type: choice
          options:
            - id: body
              text:
                uk: "Ніде в полі: фокус втрачено (`document.activeElement` — `body`)"
                en: "Not in the field: focus is lost (`document.activeElement` is `body`)"
            - id: new-input
              text:
                uk: "У новому полі, бо воно на тому самому місці"
                en: "In the new field, because it is in the same place"
              why:
                uk: "Фокус належить конкретному вузлу DOM. Новий вузол — інший об’єкт, навіть якщо виглядає так само."
                en: "Focus belongs to a particular DOM node. A new node is another object, even if it looks the same."
            - id: next
              text:
                uk: "На наступному полі форми"
                en: "On the next field of the form"
              why:
                uk: "Браузер не переносить фокус сам — коли вузол із фокусом зникає, фокус просто втрачається."
                en: "The browser does not move focus by itself — when the focused node disappears, the focus is simply lost."
          correct: [body]
        explanation:
          uk: "Фокус тримає конкретний вузол DOM. Коли його прибирають, фокус втрачається. Зміна `key` робить те саме: React прибирає старі вузли й створює нові, тож фокус у скинутій формі теж губиться. Тому ключ ставлять там, де скидання справді потрібне."
          en: "Focus is held by a particular DOM node. When that node is removed, focus is lost. Changing a `key` does the same: React removes the old nodes and creates new ones, so focus inside a reset form is lost too. That is why a key goes only where a reset is really needed."

  - id: wish-switcher
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: wish-switcher
    entry: main.jsx
    editable: [App.jsx]
    strings:
      title: { uk: "Список бажань", en: "Wishlist" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      all: { uk: "Усі", en: "All" }
      wanted: { uk: "Бажані", en: "Wanted" }
      acquired: { uk: "Отримані", en: "Acquired" }
      editing: { uk: "Редагуємо", en: "Editing" }
      nameLabel: { uk: "Назва", en: "Name" }
      priceLabel: { uk: "Ціна, грн", en: "Price, UAH" }
      draft: { uk: "Чернетка", en: "Draft" }
    title:
      uk: "Перемикач бажань"
      en: "A wish switcher"
    instructions:
      uk: |
        Готові два компоненти: `WishPicker` — список бажань із власним фільтром «Усі» / «Бажані» / «Отримані», і `EditForm` — форма з власною чернеткою. Обидва файли лише для читання. `WishPicker` отримує проп-функцію `onSelect` і викликає її з `id` бажання, на яке клацнули, — так само, як кнопка викликає `onClick`.

        Допиши `App`:

        1. Пам’ятай у стані `id` вибраного бажання; спочатку — перше бажання з `wishes`.
        2. Покажи `WishPicker` з вибраним `id` і `onSelect`, що змінює вибір.
        3. Покажи `EditForm` для вибраного бажання так, щоб для кожного вибраного бажання форма починала з його даних, а не з чернетки попереднього.
        4. Фільтр у `WishPicker` зберігає вибране, коли перемикаєш бажання.

        Кожна перевірка показує власну, щойно створену копію `App`.
      en: |
        Two components are ready: `WishPicker` — a list of wishes with its own “All” / “Wanted” / “Acquired” filter, and `EditForm` — a form with its own draft. Both files are read-only. `WishPicker` gets a function prop `onSelect` and calls it with the `id` of the clicked wish — just as a button calls `onClick`.

        Finish `App`:

        1. Keep the `id` of the selected wish in state; at first, the first wish from `wishes`.
        2. Show `WishPicker` with the selected `id` and an `onSelect` that changes the selection.
        3. Show `EditForm` for the selected wish so that for every selected wish the form starts from that wish's data, not from the previous wish's draft.
        4. The filter in `WishPicker` keeps its selection when you switch wishes.

        Every check shows its own freshly created copy of `App`.
    testTitles:
      "the form shows the first wish at first":
        uk: "Спочатку форма показує перше бажання"
        en: "The form shows the first wish at first"
      "picking another wish shows its name in the form":
        uk: "Вибір іншого бажання показує його назву у формі"
        en: "Picking another wish shows its name in the form"
      "a typed draft does not follow you to another wish or back":
        uk: "Набрана чернетка не переходить на інше бажання й назад"
        en: "A typed draft does not follow you to another wish or back"
      "the picker keeps its filter when another wish is picked":
        uk: "Фільтр у списку зберігається, коли вибрано інше бажання"
        en: "The picker keeps its filter when another wish is picked"
    hints:
      nudge:
        uk: "`EditForm` бере чернетку з props лише тоді, коли з’являється. Що змусить React вважати форму для іншого бажання **іншим** компонентом? І що станеться з тим, на що цей засіб поставлено?"
        en: "`EditForm` takes its draft from props only when it appears. What makes React treat the form for another wish as a **different** component? And what happens to whatever you put it on?"
      explanation:
        uk: "Ключ, який залежить від вибраного запису, — як `key={task.id}` у поясненні, — змушує React створити нову форму, щойно вибір змінюється. Постав його саме на `EditForm` (або на обгортку лише навколо неї): ключ на `<main>` чи на `WishPicker` скине й фільтр."
        en: "A key that depends on the selected record — like `key={task.id}` in the explanation — makes React create a new form as soon as the selection changes. Put it exactly on `EditForm` (or on a wrapper around it alone): a key on `<main>` or on `WishPicker` resets the filter too."
    solutionNote:
      uk: "`key={selected.id}` на `EditForm` робить кожне бажання окремим компонентом форми: новий вибір — нова форма з чернеткою з нового бажання. `WishPicker` стоїть на своїй позиції без ключа, тож його стан фільтра переживає кожне перемикання."
      en: "`key={selected.id}` on `EditForm` makes every wish a separate form component: a new selection means a new form with a draft from the new wish. `WishPicker` stands at its position without a key, so its filter state survives every switch."
    feedback:
      - when: { test: "the form shows the first wish at first" }
        message:
          uk: "Ця перевірка показує новий `App` і чекає в полі назви форми «Навушники» — перше бажання з `wishes`. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check shows a new `App` and expects “Headphones” — the first wish from `wishes` — in the form's name field. If every check fails at once, fix the first error in the console first."
      - when: { test: "picking another wish shows its name in the form" }
        message:
          uk: "Ця перевірка клацає «Настільна лампа» у списку й чекає цю назву в полі форми. Якщо в полі досі перша назва, React зберіг стан старої форми: для іншого бажання форма має бути іншим компонентом."
          en: "This check clicks “Desk lamp” in the list and expects that name in the form's field. If the field still shows the first name, React kept the old form's state: for another wish the form has to be a different component."
      - when: { test: "a typed draft does not follow you to another wish or back" }
        message:
          uk: "Ця перевірка вводить у поле «Чернетка», вибирає «Велосипед», потім знову «Навушники» і щоразу чекає в полі назву вибраного бажання."
          en: "This check types “Draft” into the field, picks “Bicycle”, then “Headphones” again, and every time expects the selected wish's name in the field."
      - when: { test: "the picker keeps its filter when another wish is picked" }
        message:
          uk: "Ця перевірка вибирає фільтр «Бажані», клацає «Велосипед» і чекає в списку лише три бажані: «Навушники», «Настільна лампа», «Велосипед». Якщо видно всі п’ять, `WishPicker` скинувся: ключ стоїть на ньому або на елементі, що його обгортає."
          en: "This check selects the “Wanted” filter, clicks “Bicycle” and expects only three wanted wishes in the list: “Headphones”, “Desk lamp”, “Bicycle”. If all five are shown, `WishPicker` was reset: the key is on it or on an element that wraps it."

  - id: to-project
    kind: transfer
    capstoneStep: RE-02
    body:
      uk: "Наприкінці розділу форма редагування твого проєкту теж отримає ключ з `id` запису: вибрав інший запис — форма починає з його даних. Фільтр — за статусом чи, у витратах, за категорією — лишиться без ключа й не скидатиметься."
      en: "At the end of the unit your project's edit form also gets a key from the record's `id`: pick another record, and the form starts from its data. The filter — by status, or by category in the expense tracker — stays without a key and is not reset."
