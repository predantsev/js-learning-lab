id: re-02-03-updater-queue-batching
unit: RE-02
title:
  uk: "Функції-оновлювачі, черга й батчинг"
  en: "Updater functions, queues and batching"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Використати форму-оновлювач `setCount(c => c + 1)`, коли новий стан залежить від попереднього, і передбачити результат черги."
    en: "Use the updater form `setCount(c => c + 1)` when the next state depends on the previous one, and predict the queued result."
  - uk: "Передбачити результат, коли в одному обробнику змішано нове значення й функції-оновлювачі."
    en: "Predict the result of mixing a replacement value and updater functions in one handler."
  - uk: "Пояснити, що React об’єднує виклики сетерів однієї події в один повторний рендер."
    en: "Explain that React batches the setter calls of one event into a single re-render."
prerequisites: [re-02-02-state-snapshots]
subskills:
  - { family: R-02, skill: "updater queues/batching", depth: intro }
glossary: [updater-function, state-update-queue, batching]
selfCheck: [queue-predict, ticket-counter]

blocks:
  - id: updater-form
    kind: explanation
    title:
      uk: "Передай сетеру функцію"
      en: "Pass the setter a function"
    body:
      uk: |
        Сетер приймає не лише нове значення, а й [[updater-function|функцію-оновлювач]]:

        ```jsx
        setCompleted((c) => c + 1);
        ```

        Ця функція отримує **попереднє** значення стану й повертає наступне. Різниця зі `setCompleted(completed + 1)` — звідки береться число:

        - `setCompleted(completed + 1)` рахує зі знімка рендеру. Скільки б разів ти так викликав сетер в одному обробнику, кожен виклик бачить те саме `completed`.
        - `setCompleted((c) => c + 1)` не читає знімок узагалі. React сам передасть у `c` значення, яке вийшло після всіх попередніх оновлень.

        Правило просте: якщо новий стан обчислюється з попереднього, передавай функцію. Якщо ти ставиш значення, що від попереднього не залежить (`setCompleted(0)`, `setDone(true)`), достатньо самого значення.
      en: |
        A setter takes not only a new value but also an [[updater-function]]:

        ```jsx
        setCompleted((c) => c + 1);
        ```

        That function receives the **previous** state value and returns the next one. The difference from `setCompleted(completed + 1)` is where the number comes from:

        - `setCompleted(completed + 1)` computes from the render's snapshot. However many times you call the setter like that in one handler, every call sees the same `completed`.
        - `setCompleted((c) => c + 1)` does not read the snapshot at all. React itself passes `c` the value that results from all the earlier updates.

        The rule is simple: if the next state is computed from the previous one, pass a function. If you set a value that does not depend on the previous one (`setCompleted(0)`, `setDone(true)`), the value itself is enough.

  - id: the-queue
    kind: explanation
    title:
      uk: "Черга і один рендер на подію"
      en: "The queue and one render per event"
    body:
      uk: |
        Що ж робить сетер? Він додає запис у [[state-update-queue|чергу оновлень]] цього стану. Записи бувають двох видів: значення («постав 5») і функція («візьми попереднє й додай 1»).

        Поки обробник працює, React нічого не рендерить — він лише збирає записи. Коли обробник закінчився, React робить **один** рендер: бере значення стану зі знімка й проходить чергою по порядку. Значення замінює все, що було перед ним; функція отримує результат попереднього кроку.

        Об’єднання всіх оновлень однієї події в один рендер називають [[batching|батчингом]]. Тому три сетери в обробнику дають один рендер, а не три, — і жоден рендер не бачить «напівоновленого» стану.
      en: |
        So what does a setter do? It adds an entry to the [[state-update-queue|update queue]] of that state. Entries are of two kinds: a value (“set 5”) and a function (“take the previous one and add 1”).

        While the handler runs, React renders nothing — it only collects entries. When the handler has finished, React does **one** render: it takes the state value from the snapshot and walks the queue in order. A value replaces whatever came before it; a function gets the result of the previous step.

        Combining all updates of one event into one render is called [[batching]]. That is why three setters in a handler give one render, not three — and no render ever sees a “half-updated” state.

  - id: queue-predict
    kind: prediction
    lang: jsx
    runnable: false
    prompt:
      uk: "`count` дорівнює `0`. Людина клацає один раз кнопку з першим обробником. Потім сторінку відкривають заново, знову з `count = 0`, і клацають один раз кнопку з другим обробником. Що буде на сторінці після кожного кліку?"
      en: "`count` is `0`. A person clicks the button with the first handler once. Then the page is opened again, once more with `count = 0`, and the button with the second handler is clicked once. What does the page show after each click?"
    code: |
      function handleThreeUpdaters() {
        setCount((c) => c + 1);
        setCount((c) => c + 1);
        setCount((c) => c + 1);
      }

      function handleFiveThenOne() {
        setCount(5);
        setCount((c) => c + 1);
      }
    answer:
      type: choice
      options:
        - id: right
          text: { uk: "`3` і `6`", en: "`3` and `6`" }
        - id: one-six
          text: { uk: "`1` і `6`", en: "`1` and `6`" }
          why:
            uk: "`1` вийшло б із `setCount(count + 1)`. Функція-оновлювач не читає знімок: кожна отримує результат попередньої, тож `0 → 1 → 2 → 3`."
            en: "`1` would come from `setCount(count + 1)`. An updater function does not read the snapshot: each one gets the result of the previous one, so `0 → 1 → 2 → 3`."
        - id: three-five
          text: { uk: "`3` і `5`", en: "`3` and `5`" }
          why:
            uk: "Оновлення йдуть по черзі: спершу «постав 5», потім функція отримує `5` і повертає `6`."
            en: "The updates go in order: first “set 5”, then the function receives `5` and returns `6`."
        - id: three-one
          text: { uk: "`3` і `1`", en: "`3` and `1`" }
          why:
            uk: "Функція не отримує знімок `0`: вона отримує те, що лишила попередня позиція черги, тобто `5`."
            en: "The function does not receive the snapshot `0`: it receives what the previous queue entry left, which is `5`."
      correct: [right]
    explanation:
      uk: "Перший обробник ставить у чергу три функції: `0 → 1 → 2 → 3`. Другий — значення й функцію: «постав 5» дає `5`, функція отримує `5` і повертає `6`. В обох випадках React рендерить один раз, коли обробник закінчився."
      en: "The first handler queues three functions: `0 → 1 → 2 → 3`. The second queues a value and a function: “set 5” gives `5`, and the function receives `5` and returns `6`. In both cases React renders once, after the handler has finished."

  - id: queue-timeline
    kind: visual
    visual: render-timeline
    strings:
      completions: { uk: "Виконань", en: "Completions" }
    title:
      uk: "Черга оновлень одного кліку"
      en: "The update queue of one click"
    textEquivalent:
      uk: >-
        Рендер 1 бачить count = 0. Клік викликає обробник, який по черзі ставить у чергу три записи: значення 5, функцію
        c => c + 1 і ще одну таку функцію. Під час обробника React нічого не рендерить. Потім іде один рендер: React починає зі
        значення знімка 0, запис «постав 5» дає 5, перша функція отримує 5 і повертає 6, друга отримує 6 і повертає 7. Рендер 2
        бачить count = 7, і один commit записує «%%completions%%: 7» в DOM.
      en: >-
        Render 1 sees count = 0. A click calls the handler, which queues three entries in order: the value 5, the function
        c => c + 1 and another such function. During the handler React renders nothing. Then comes one render: React starts from
        the snapshot value 0, the entry "set 5" gives 5, the first function receives 5 and returns 6, the second receives 6 and
        returns 7. Render 2 sees count = 7, and one commit writes "%%completions%%: 7" into the DOM.
    spec:
      component: CompletionCounter
      code: |
        function CompletionCounter() {
          const [count, setCount] = useState(0);
          function handleClick() {
            setCount(5);
            setCount((c) => c + 1);
            setCount((c) => c + 1);
          }
          return <button onClick={handleClick}>%%completions%%: {count}</button>;
        }
      steps:
        - phase: render
          render: 1
          line: 2
          reason: { uk: "перший показ компонента", en: "the component is shown for the first time" }
          snapshot: { state: { count: 0 } }
          caption:
            uk: "Рендер 1: знімок `count = 0`."
            en: "Render 1: the snapshot is `count = 0`."
        - phase: commit
          render: 1
          line: 8
          dom: "<button>%%completions%%: 0</button>"
          caption:
            uk: "Commit 1: на екрані «%%completions%%: 0»."
            en: "Commit 1: the screen shows “%%completions%%: 0”."
        - phase: event
          name: click
          line: 4
          sees: { count: 0 }
          actions: ["queue: 5", "queue: c => c + 1", "queue: c => c + 1"]
          queued: { count: 7 }
          caption:
            uk: "Клік: обробник лише **додає записи** в чергу — значення `5` і дві функції. Поки він працює, рендеру немає."
            en: "Click: the handler only **adds entries** to the queue — the value `5` and two functions. While it runs, there is no render."
        - phase: render
          render: 2
          line: 2
          reason: { uk: "черга: 0 → 5 → 6 → 7", en: "the queue: 0 → 5 → 6 → 7" }
          snapshot: { state: { count: 7 } }
          caption:
            uk: "Рендер 2: React проходить чергою по порядку. «Постав 5» дає `5`, перша функція отримує `5` → `6`, друга `6` → `7`. Один рендер на всю подію — це батчинг."
            en: "Render 2: React walks the queue in order. “Set 5” gives `5`, the first function receives `5` → `6`, the second `6` → `7`. One render for the whole event — that is batching."
        - phase: commit
          render: 2
          line: 8
          dom: "<button>%%completions%%: 7</button>"
          caption:
            uk: "Commit 2: один commit записує «%%completions%%: 7». Проміжних `5` і `6` на екрані не було ніколи."
            en: "Commit 2: one commit writes “%%completions%%: 7”. The intermediate `5` and `6` never appeared on the screen."

  - id: queue-lab
    kind: example
    runtime: browser-react
    dir: queue-lab
    entry: main.jsx
    strings:
      habit: { uk: "Пити воду", en: "Drink water" }
      completions: { uk: "Виконань", en: "Completions" }
      threeUpdaters: { uk: "Три оновлювачі", en: "Three updaters" }
      fiveThenOne: { uk: "5, потім +1", en: "5, then +1" }
    title:
      uk: "Черга в дії"
      en: "The queue at work"
    body:
      uk: |
        Тут обидва обробники з передбачення, а компонент виводить рядок `render` на кожен рендер. Запусти й клацни кожну кнопку по разу на вкладці **Сторінка**. Скільки рядків `render` додає один клік?
      en: |
        Here are both handlers from the prediction, and the component prints a `render` line on every render. Run it and click each button once on the **Page** tab. How many `render` lines does one click add?
    tryIt:
      uk: |
        1. Кожен клік додає рівно один рядок `render`, хоча сетер викликано двічі чи тричі. Це батчинг.
        2. У `handleThreeUpdaters` заміни всі три виклики на `setCount(count + 1);` і запусти знову. Тепер кнопка додає лише 1: усі три виклики рахували з того самого знімка.
        3. Поверни функції, але в `handleFiveThenOne` поміняй рядки коду місцями: спершу `setCount((c) => c + 1);`, потім `setCount(5);`. Після кліку на сторінці завжди `5`: значення в кінці черги замінює все, що було перед ним.
      en: |
        1. Every click adds exactly one `render` line, although the setter is called two or three times. That is batching.
        2. In `handleThreeUpdaters` replace all three calls with `setCount(count + 1);` and run again. Now the button adds only 1: all three calls computed from the same snapshot.
        3. Bring the functions back, but in `handleFiveThenOne` swap the two lines of code: first `setCount((c) => c + 1);`, then `setCount(5);`. After a click the page always shows `5`: a value at the end of the queue replaces everything before it.

  - id: real-clicks
    kind: explanation
    title:
      uk: "Коли знімок підводить"
      en: "When the snapshot lets you down"
    body:
      uk: |
        Якщо людина клацає кнопку, кожен клік — окрема подія. React рендерить після кожної, тож наступний клік уже обробляє новий обробник зі свіжим знімком. Тому `setCount(count + 1)` у простому обробнику переживає кліки по одному.

        Знімок підводить, коли кілька оновлень потрапляють в одну чергу до наступного рендеру:

        - кілька викликів сетера в одному обробнику — як у прикладі;
        - кілька подій, оброблених одна за одною в одному завданні, без рендеру між ними — так клацають автоматичні перевірки, коли викликають `button.click()` кілька разів підряд;
        - обробник, що спрацьовує пізніше, — таймер зі знімком старого рендеру.

        Функція-оновлювач правильна в усіх цих випадках, тож для «наступне з попереднього» обирай її завжди.
      en: |
        When a person clicks a button, every click is a separate event. React renders after each one, so the next click is already handled by a new handler with a fresh snapshot. That is why `setCount(count + 1)` in a simple handler survives clicks made one by one.

        The snapshot lets you down when several updates land in one queue before the next render:

        - several setter calls in one handler — as in the example;
        - several events handled one after another in one task, with no render between them — that is how automated checks click when they call `button.click()` several times in a row;
        - a handler that runs later — a timer holding the snapshot of an old render.

        An updater function is right in all of these cases, so for “next from previous” always choose it.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: функцію викликає хтось інший"
      en: "Recall: someone else calls the function"
    items:
      - id: apply-steps
        from: js-03-06-higher-order-callbacks
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          function applyAll(start, steps) {
            let value = start;
            for (const step of steps) {
              value = step(value);
            }
            return value;
          }
          console.log(applyAll(2, [(n) => n * 10, (n) => n + 1]));
        verify:
          logs: ["21"]
        answer:
          type: text
          accept: ["21"]
          placeholder: { uk: "число", en: "a number" }
        explanation:
          uk: "`applyAll` викликає кожну передану функцію сама, передаючи їй результат попередньої: `2 * 10 = 20`, потім `20 + 1 = 21`. Так само React обробляє чергу оновлювачів: ти лише передаєш функції, а викликає їх React, по черзі, з результатом попереднього кроку."
          en: "`applyAll` calls each function it was given by itself, passing it the previous result: `2 * 10 = 20`, then `20 + 1 = 21`. React processes the queue of updaters the same way: you only hand over the functions, and React calls them in order with the result of the previous step."

  - id: ticket-counter
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: ticket-counter
    entry: main.jsx
    editable: [App.jsx]
    strings:
      cinema: { uk: "Квитки в кіно", en: "Cinema tickets" }
      tickets: { uk: "Квитків", en: "Tickets" }
    title:
      uk: "Кнопки +1 і +5 без втрат"
      en: "+1 and +5 buttons that lose nothing"
    instructions:
      uk: |
        Компонент для витрати «Квитки в кіно» показує кількість квитків і дві кнопки. Допиши обробники:

        1. «+1» додає один квиток, «+5» — п’ять.
        2. Жоден клік не губиться, навіть коли кліки надходять одним махом, раніше, ніж React встигає відрендерити між ними.

        Друга вимога — про те, як клацають перевірки: вони викликають `button.click()` кілька разів підряд, тож усі ці кліки обробляються до наступного рендеру. Наприклад, «+1», «+5», «+1» одним махом мають дати `7`. Кожна перевірка показує власну, щойно створену копію компонента, що починає з нуля квитків.
      en: |
        The component for the “Cinema tickets” expense shows the number of tickets and two buttons. Finish the handlers:

        1. “+1” adds one ticket, “+5” adds five.
        2. No click is lost, even when clicks arrive in one go, before React gets a chance to render between them.

        The second requirement is about how the checks click: they call `button.click()` several times in a row, so all those clicks are handled before the next render. For example, “+1”, “+5”, “+1” in one go must give `7`. Every check shows its own freshly created copy of the component, starting from zero tickets.
    testTitles:
      "slow clicks: +1, then +5 gives 6":
        uk: "Повільні кліки: «+1», потім «+5» дають 6"
        en: "Slow clicks: “+1”, then “+5” give 6"
      "three +1 clicks in one go give 3":
        uk: "Три «+1» одним махом дають 3"
        en: "Three “+1” clicks in one go give 3"
      "+1, +5, +1 in one go give 7":
        uk: "«+1», «+5», «+1» одним махом дають 7"
        en: "“+1”, “+5”, “+1” in one go give 7"
    hints:
      nudge:
        uk: "Звідки обробник бере число, до якого додає? Зі знімка свого рендеру — чи з результату попередніх оновлень?"
        en: "Where does the handler get the number it adds to? From the snapshot of its render — or from the result of the earlier updates?"
      explanation:
        uk: "Коли кілька кліків обробляються до рендеру, усі обробники бачать той самий знімок, і `setTickets(tickets + …)` губить попередні кліки. Передай сетеру функцію, що отримує попереднє значення, — як `setCompleted((c) => c + 1)` у поясненні. Обом кнопкам потрібна така форма: досить однієї кнопки зі знімком, щоб «+1, +5, +1» дало не `7`."
        en: "When several clicks are handled before a render, all the handlers see the same snapshot, and `setTickets(tickets + …)` loses the earlier clicks. Pass the setter a function that receives the previous value — like `setCompleted((c) => c + 1)` in the explanation. Both buttons need that form: one button computing from the snapshot is enough for “+1, +5, +1” to give something other than `7`."
    solutionNote:
      uk: "Кожен оновлювач отримує результат попереднього запису черги, тож «+1, +5, +1» дає `0 → 1 → 6 → 7`, хоч би скільки кліків припало на один рендер. Зі знімком усі три обробники бачили б `0`, і переміг би останній запис."
      en: "Every updater receives the result of the previous queue entry, so “+1, +5, +1” gives `0 → 1 → 6 → 7`, however many clicks fall into one render. With the snapshot all three handlers would see `0`, and the last entry would win."
    feedback:
      - when: { test: "slow clicks: +1, then +5 gives 6" }
        message:
          uk: "Ця перевірка клацає «+1», чекає рендеру, клацає «+5» і чекає в абзаці `.tickets` текст «Квитків: 6». Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check clicks “+1”, waits for the render, clicks “+5” and expects “Tickets: 6” in the `.tickets` paragraph. If every check fails at once, fix the first error in the console first."
      - when: { test: "three +1 clicks in one go give 3" }
        message:
          uk: "Ця перевірка тричі викликає `click()` на «+1» без рендеру між ними й чекає «Квитків: 3». Якщо видно `1`, обробник «+1» рахує зі знімка, і всі три кліки поставили те саме значення."
          en: "This check calls `click()` on “+1” three times with no render between them and expects “Tickets: 3”. If you see `1`, the “+1” handler computes from the snapshot, and all three clicks set the same value."
      - when: { test: "+1, +5, +1 in one go give 7" }
        message:
          uk: "Ця перевірка клацає «+1», «+5» і «+1» без рендеру між ними й чекає «Квитків: 7». Обидва обробники мають працювати з попереднім значенням: один обробник зі знімком замінить усе, що стояло в черзі перед ним."
          en: "This check clicks “+1”, “+5” and “+1” with no render between them and expects “Tickets: 7”. Both handlers have to work from the previous value: one handler using the snapshot replaces everything queued before it."

  - id: to-project
    kind: transfer
    capstoneStep: RE-02
    body:
      uk: "У проєкті перемикання статусу запису та додавання в список теж обчислюють новий стан із попереднього. Коли наприкінці розділу писатимеш ці обробники, давай сетеру функцію — тоді швидкі перемикання нічого не загублять."
      en: "In your project, toggling a record's status and adding to the list also compute the next state from the previous one. When you write those handlers at the end of the unit, give the setter a function — then rapid toggles lose nothing."
