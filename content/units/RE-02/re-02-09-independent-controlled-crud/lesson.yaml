id: re-02-09-independent-controlled-crud
unit: RE-02
title:
  uk: "Самостійно: керований CRUD зі стабільними ключами"
  en: "Independent: controlled CRUD with stable keys"
kind: assessment
minutes: 30
contentVersion: 1
objectives:
  - uk: "Без підказок побудувати керований список зі створенням, редагуванням і вилученням, фільтром статусу, незмінними оновленнями, стабільними ключами й формою редагування, що скидається для кожного вибраного запису."
    en: "Build, without hints, a controlled create/edit/delete list with a status filter, immutable updates, stable keys and an edit form that resets for each selected record."
purpose:
  uk: "Перевірити, що ти поєднуєш усе з розділу в новій ситуації: стан і обробники, знімки й оновлювачі, незмінні оновлення, обчислені значення, керовані типізовані поля, ключі й скидання стану."
  en: "Check that you combine everything from the unit in a new situation: state and handlers, snapshots and updaters, immutable updates, computed values, controlled typed fields, keys and state reset."
prerequisites: [re-02-08-debug-stale-setter-derived]
subskills:
  - { family: R-02, skill: "immutable updates", depth: assess }
  - { family: R-02, skill: "controlled inputs", depth: assess }
  - { family: R-02, skill: "event vs render behavior", depth: assess }
  - { family: R-02, skill: "reset/preserve identity", depth: assess }
glossary: []
selfCheck: [task-manager]

blocks:
  - id: brief
    kind: explanation
    title:
      uk: "Завдання"
      en: "The task"
    body:
      uk: |
        Ти будуєш менеджер справ планувальника — з нуля, у `App.tsx`. Підказок немає. Файл `tasks.ts` — частина проєкту, лише для читання: типи, валідатор `validateTask`, тексти помилок `MESSAGES`, початкові справи `startTasks` і `nextTaskId()`.

        Перед тим як писати код, вирішиш для себе:

        - що з того, що видно на екрані, — стан, а що обчислюється під час рендеру;
        - які оновлення залежать від попереднього стану;
        - які компоненти мають свій стан і коли цей стан треба скинути, а коли зберегти.

        Перевірки клацають швидко, надсилають порожні й хибні дані, перемикають справи посеред редагування й сортують список. Перевір такі сценарії сам, перш ніж натиснути **Перевірити**.
      en: |
        You are building the planner's task manager — from scratch, in `App.tsx`. There are no hints. The file `tasks.ts` is part of the project and read-only: the types, the validator `validateTask`, the error texts `MESSAGES`, the starting tasks `startTasks` and `nextTaskId()`.

        Before you write code, decide for yourself:

        - what of what is on the screen is state, and what is computed during render;
        - which updates depend on the previous state;
        - which components have their own state, and when that state has to be reset and when kept.

        The checks click quickly, submit empty and wrong data, switch tasks in the middle of an edit and sort the list. Try such scenarios yourself before you press **Check**.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: оновлення, що зберігає решту полів"
      en: "Recall: an update that keeps the other fields"
    items:
      - id: spread-keeps-fields
        from: js-04-12-independent-records
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const expense = { id: "e-02", amountMinor: 52000, category: "transport" };
          const changed = { ...expense, amountMinor: 50000 };
          console.log(changed.category, changed === expense, expense.amountMinor);
        verify:
          logs: ["transport false 52000"]
        answer:
          type: choice
          options:
            - id: right
              code: "transport false 52000"
            - id: mutated
              code: "transport false 50000"
              why:
                uk: "Spread створює новий об’єкт; присвоєння `amountMinor` у ньому не чіпає `expense`."
                en: "The spread creates a new object; setting `amountMinor` in it does not touch `expense`."
            - id: lost
              code: "undefined false 52000"
              why:
                uk: "`...expense` переносить усі поля, а `amountMinor: 50000` після нього замінює лише одне."
                en: "`...expense` carries over every field, and `amountMinor: 50000` after it replaces only one."
            - id: same
              code: "transport true 50000"
              why:
                uk: "Об’єктний літерал `{ … }` завжди створює новий об’єкт."
                en: "An object literal `{ … }` always creates a new object."
          correct: [right]
        explanation:
          uk: "`{ ...expense, amountMinor: 50000 }` — новий об’єкт з усіма полями старого й одним зміненим; старий лишається як був. Саме так змінюють запис у стані React."
          en: "`{ ...expense, amountMinor: 50000 }` is a new object with all the old fields and one changed; the old one stays as it was. That is exactly how a record in React state is changed."

  - id: task-manager
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-react
    dir: task-manager
    entry: main.tsx
    editable: [App.tsx]
    strings:
      planner: { uk: "Планувальник", en: "Planner" }
      titleLabel: { uk: "Назва", en: "Title" }
      dueLabel: { uk: "Термін", en: "Due date" }
      priorityLabel: { uk: "Пріоритет", en: "Priority" }
      low: { uk: "низький", en: "low" }
      normal: { uk: "звичайний", en: "normal" }
      high: { uk: "високий", en: "high" }
      add: { uk: "Додати", en: "Add" }
      save: { uk: "Зберегти", en: "Save" }
      all: { uk: "Усі", en: "All" }
      pending: { uk: "Очікують", en: "Pending" }
      done: { uk: "Виконані", en: "Done" }
      sort: { uk: "За терміном", en: "By due date" }
      toggle: { uk: "Перемкнути", en: "Toggle" }
      edit: { uk: "Редагувати", en: "Edit" }
      delete: { uk: "Вилучити", en: "Delete" }
      noDue: { uk: "без терміну", en: "no due date" }
      statusDone: { uk: "виконано", en: "done" }
      statusPending: { uk: "очікує", en: "pending" }
      required: { uk: "Введи назву.", en: "Enter a title." }
      tooLong: { uk: "Назва довша за 80 символів.", en: "The title is longer than 80 characters." }
      unknownPriority: { uk: "Невідомий пріоритет.", en: "Unknown priority." }
      badDate: { uk: "Дата має бути у форматі РРРР-ММ-ДД.", en: "The date must look like YYYY-MM-DD." }
      waterPlants: { uk: "Полити квіти", en: "Water the plants" }
      libraryBooks: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      grandmaLetter: { uk: "Написати бабусі листа", en: "Write grandma a letter" }
      payBill: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      payBillOnline: { uk: "Оплатити інтернет онлайн", en: "Pay the internet bill online" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      wardrobe: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
      more: { uk: " сьогодні", en: " today" }
    title:
      uk: "Менеджер справ"
      en: "A task manager"
    instructions:
      uk: |
        Збудуй у `App.tsx` менеджер справ, що починає зі справ `startTasks`. Перевірки шукають елементи за текстом і класами нижче, тож дотримуйся їх точно.

        **Форма** — один `<form>` з полями в підписах-обгортках (`<label>Назва <input …/></label>`):

        - «Назва» — текстове поле; під ним абзац `.title-error`;
        - «Термін» — текстове поле для дати `РРРР-ММ-ДД`; порожнє означає «без терміну» (`null`); під ним абзац `.due-error`;
        - «Пріоритет» — `<select>` зі значеннями `low`, `normal`, `high`; спочатку `normal`;
        - кнопка надсилання: «Додати», коли нічого не редагується, і «Зберегти» під час редагування.

        **Список** — `<ul>`, по одному `<li>` на справу, у кожному: `.title` (назва), `.due` (дата або «без терміну»), `.priority` (`low` / `normal` / `high`), `.status` («виконано» або «очікує») і кнопки «Перемкнути», «Редагувати», «Вилучити».

        **Поведінка:**

        1. Надсилання не перезавантажує сторінку. Дані перевіряє `validateTask`; повідомлення з `MESSAGES` з’являються під своїми полями, і нічого не додається й не змінюється.
        2. Нова правильна справа (без редагування) стає в кінець списку як невиконана з новим `nextTaskId()`; поля й повідомлення очищаються.
        3. «Редагувати» заповнює форму даними цієї справи. «Редагувати» на іншій справі посеред редагування показує дані вже тієї справи, а не попередню чернетку.
        4. «Зберегти» змінює лише цю справу — назву, термін, пріоритет — і зберігає її статус; після цього форма знову порожня й додає нові справи.
        5. «Перемкнути» перемикає статус. Кілька кліків, оброблених до наступного рендеру, не губляться: два кліки по одній справі повертають її статус.
        6. «Вилучити» вилучає лише цю справу.
        7. Фільтр — кнопки «Усі», «Очікують», «Виконані» усередині елемента `.filter`. Вибраний фільтр зберігається під час редагування, а список під ним одразу відображає зміни.
        8. Кнопка `.sort` з текстом «За терміном» вмикає й вимикає сортування за терміном: раніші дати першими, справи без терміну в кінці. Під час сортування рядки переміщуються, а не створюються заново: рядок кожної справи — той самий елемент DOM.
        9. Масив `startTasks` і його об’єкти не змінюються.

        Кожна перевірка показує власну, щойно створену копію `App`. Пісочниця прибирає типи, не перевіряючи їх; щоб перевірити типи, скопіюй `App.tsx` і `tasks.ts` у `src` теки `react-types` з уроку про керовані поля й запусти `npx tsc`.
      en: |
        Build a task manager in `App.tsx` that starts from the tasks in `startTasks`. The checks look for elements by the texts and classes below, so follow them exactly.

        **The form** — one `<form>` with fields inside wrapping labels (`<label>Title <input …/></label>`):

        - “Title” — a text field; under it a `.title-error` paragraph;
        - “Due date” — a text field for a `YYYY-MM-DD` date; empty means “no due date” (`null`); under it a `.due-error` paragraph;
        - “Priority” — a `<select>` with the values `low`, `normal`, `high`; `normal` at first;
        - the submit button: “Add” when nothing is being edited, and “Save” while editing.

        **The list** — a `<ul>` with one `<li>` per task, each with: `.title` (the title), `.due` (the date or “no due date”), `.priority` (`low` / `normal` / `high`), `.status` (“done” or “pending”) and the buttons “Toggle”, “Edit”, “Delete”.

        **Behaviour:**

        1. Submitting does not reload the page. `validateTask` checks the data; the messages from `MESSAGES` appear under their fields, and nothing is added or changed.
        2. A new valid task (when nothing is being edited) goes to the end of the list as pending, with a new `nextTaskId()`; the fields and the messages are cleared.
        3. “Edit” fills the form with that task's data. “Edit” on another task in the middle of an edit shows that task's data, not the previous draft.
        4. “Save” changes only that task — title, due date, priority — and keeps its status; afterwards the form is empty again and adds new tasks.
        5. “Toggle” flips the status. Several clicks handled before the next render are not lost: two clicks on one task bring its status back.
        6. “Delete” removes only that task.
        7. The filter — the buttons “All”, “Pending”, “Done” inside a `.filter` element. The selected filter is kept while editing, and the list under it reflects changes at once.
        8. A `.sort` button with the text “By due date” turns sorting by due date on and off: earlier dates first, tasks without a due date last. While sorting, rows move instead of being created anew: each task's row is the same DOM element.
        9. The `startTasks` array and its objects do not change.

        Every check shows its own freshly created copy of `App`. The sandbox removes types without checking them; to check the types, copy `App.tsx` and `tasks.ts` into `src` of the `react-types` folder from the lesson on controlled fields and run `npx tsc`.
    testTitles:
      "a valid task is added at the end and the form is cleared":
        uk: "Правильна справа додається в кінець, і форма очищається"
        en: "A valid task is added at the end and the form is cleared"
      "an empty due date adds a task without a due date":
        uk: "Порожній термін додає справу без терміну"
        en: "An empty due date adds a task without a due date"
      "an empty title and a wrong date show their messages and add nothing":
        uk: "Порожня назва й хибна дата показують повідомлення й нічого не додають"
        en: "An empty title and a wrong date show their messages and add nothing"
      "submitting does not reload the page":
        uk: "Надсилання не перезавантажує сторінку"
        en: "Submitting does not reload the page"
      "Edit fills the form, and switching tasks mid-edit shows the other task":
        uk: "«Редагувати» заповнює форму, а перемикання посеред редагування показує іншу справу"
        en: "“Edit” fills the form, and switching tasks mid-edit shows the other task"
      "saving an edit changes only that task, keeps its status and empties the form":
        uk: "Збереження змінює лише цю справу, зберігає її статус і очищає форму"
        en: "Saving an edit changes only that task, keeps its status and empties the form"
      "quick toggles in one go are not lost":
        uk: "Швидкі перемикання одним махом не губляться"
        en: "Quick toggles in one go are not lost"
      "the status filter keeps its choice while editing and follows changes":
        uk: "Фільтр статусу зберігає вибір під час редагування й стежить за змінами"
        en: "The status filter keeps its choice while editing and follows changes"
      "sorting by due date moves the rows without replacing them":
        uk: "Сортування за терміном переміщує рядки, а не замінює їх"
        en: "Sorting by due date moves the rows without replacing them"
      "Delete removes only that task":
        uk: "«Вилучити» прибирає лише цю справу"
        en: "“Delete” removes only that task"
      "the starting tasks stay unchanged":
        uk: "Початкові справи лишаються незмінними"
        en: "The starting tasks stay unchanged"
    solutionNote:
      uk: |
        У стані — лише справи, `id` справи, що редагується, вибраний фільтр і прапорець сортування. Видимий список обчислюється з них на кожен рендер, тож фільтр одразу бачить кожну зміну. Усі зміни списку — через функції-оновлювачі й нові масиви та об’єкти: швидкі кліки не губляться, `startTasks` не змінюється. Форма — окремий компонент зі своєю чернеткою і `key` з `id` справи (або `"new"`): інша справа — нова форма з її даними, а фільтр в `App` при цьому не скидається. Рядки списку мають ключ `task.id`, тож під час сортування React переміщує ті самі елементи.
      en: |
        State holds only the tasks, the `id` of the task being edited, the selected filter and the sorting flag. The visible list is computed from them on every render, so the filter sees every change at once. Every list change goes through updater functions and new arrays and objects: quick clicks are not lost, and `startTasks` does not change. The form is a separate component with its own draft and a `key` from the task's `id` (or `"new"`): another task means a new form with its data, while the filter in `App` is not reset. The list rows are keyed by `task.id`, so while sorting React moves the same elements.
    feedback:
      - when: { test: "a valid task is added at the end and the form is cleared" }
        message:
          uk: "Ця перевірка чекає на кнопці форми «Додати», заповнює «Назва», «Термін» (`2026-03-10`) і «Пріоритет» (`high`), надсилає форму й чекає п’ятий рядок із цими даними та статусом «очікує», а поля — порожніми. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі або перевір, що форма й список є на сторінці."
          en: "This check expects “Add” on the form's button, fills “Title”, “Due date” (`2026-03-10`) and “Priority” (`high`), submits the form and expects a fifth row with this data and the status “pending”, and empty fields. If every check fails at once, fix the first error in the console first, or check that the form and the list are on the page."
      - when: { test: "an empty due date adds a task without a due date" }
        message:
          uk: "Ця перевірка надсилає лише назву й чекає в новому рядку «без терміну» у `.due`. Порожнє поле терміну має стати `null`: порожній текст `validateTask` вважає хибною датою."
          en: "This check submits only a title and expects “no due date” in `.due` of the new row. An empty due date field has to become `null`: `validateTask` treats an empty text as a bad date."
      - when: { test: "an empty title and a wrong date show their messages and add nothing" }
        message:
          uk: "Ця перевірка надсилає порожню назву й термін `2026-3-5` і чекає «Введи назву.» у `.title-error`, «Дата має бути у форматі РРРР-ММ-ДД.» у `.due-error` і досі 4 рядки."
          en: "This check submits an empty title and the due date `2026-3-5` and expects “Enter a title.” in `.title-error`, “The date must look like YYYY-MM-DD.” in `.due-error` and still 4 rows."
      - when: { test: "submitting does not reload the page" }
        message:
          uk: "Ця перевірка надсилає форму й чекає, що під час події `submit` типову дію скасовано."
          en: "This check submits the form and expects the default action to be cancelled during the `submit` event."
      - when: { test: "Edit fills the form, and switching tasks mid-edit shows the other task" }
        message:
          uk: "Ця перевірка клацає «Редагувати» біля «Полити квіти» і чекає цю назву в полі та «Зберегти» на кнопці форми; потім дописує текст, клацає «Редагувати» біля «Здати книжки в бібліотеку» і чекає її назву, термін `2026-03-01` і пріоритет `high`. Чернетка форми береться зі справи лише тоді, коли форма з’являється."
          en: "This check clicks “Edit” next to “Water the plants” and expects that title in the field and “Save” on the form's button; then it types more, clicks “Edit” next to “Return library books” and expects its title, the due date `2026-03-01` and the priority `high`. A form's draft is taken from the task only when the form appears."
      - when: { test: "saving an edit changes only that task, keeps its status and empties the form" }
        message:
          uk: "Ця перевірка редагує «Оплатити інтернет» (виконану), міняє назву, зберігає й чекає ту саму послідовність назв лише з новою назвою, статус «виконано» і порожнє поле назви."
          en: "This check edits “Pay the internet bill” (a done task), changes the title, saves and expects the same order of titles with only the new title, the status “done” and an empty title field."
      - when: { test: "quick toggles in one go are not lost" }
        message:
          uk: "Ця перевірка без рендеру між кліками двічі перемикає «Полити квіти» і по разу «Здати книжки в бібліотеку» та «Написати бабусі». Чекає: перша — «очікує», дві інші — «виконано»."
          en: "This check, with no render between the clicks, toggles “Water the plants” twice and “Return library books” and “Write to grandma” once each. It expects: the first “pending”, the other two “done”."
      - when: { test: "the status filter keeps its choice while editing and follows changes" }
        message:
          uk: "Ця перевірка вибирає «Очікують», редагує й зберігає «Написати бабусі», а потім перемикає «Здати книжки в бібліотеку». Після кожного кроку чекає в списку лише невиконані справи з актуальними назвами."
          en: "This check selects “Pending”, edits and saves “Write to grandma”, then toggles “Return library books”. After every step it expects only pending tasks with their current titles in the list."
      - when: { test: "sorting by due date moves the rows without replacing them" }
        message:
          uk: "Ця перевірка клацає `.sort` і чекає порядок «Оплатити інтернет», «Здати книжки в бібліотеку», «Полити квіти», «Написати бабусі», а рядок кожної справи — тим самим елементом, що й до сортування."
          en: "This check clicks `.sort` and expects the order “Pay the internet bill”, “Return library books”, “Water the plants”, “Write to grandma”, with each task's row being the same element as before sorting."
      - when: { test: "Delete removes only that task" }
        message:
          uk: "Ця перевірка вилучає «Здати книжки в бібліотеку» і чекає три інші назви в тому самому порядку."
          en: "This check deletes “Return library books” and expects the three other titles in the same order."
      - when: { test: "the starting tasks stay unchanged" }
        message:
          uk: "Ця перевірка перемикає, редагує й вилучає справи, а потім чекає, що `startTasks` і всі його об’єкти такі самі, як до перевірок."
          en: "This check toggles, edits and deletes tasks, then expects `startTasks` and all its objects to be the same as before the checks."
