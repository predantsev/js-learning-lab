id: re-02-06-controlled-inputs-typed-events
unit: RE-02
title:
  uk: "Керовані поля й типізовані події"
  en: "Controlled inputs and typed events"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Побудувати кероване поле, значення якого береться зі стану й змінюється лише через `onChange`."
    en: "Build a controlled input whose value comes from state and changes only through `onChange`."
  - uk: "Типізувати обробники змін і надсилання (`ChangeEvent<HTMLInputElement>`, `SubmitEvent<HTMLFormElement>`) і скасувати типове надсилання форми."
    en: "Type change and submit handlers (`ChangeEvent<HTMLInputElement>`, `SubmitEvent<HTMLFormElement>`) and prevent the default form submission."
  - uk: "Тримати чернетку форми одним типізованим об’єктом і перевіряти її наявним доменним валідатором під час надсилання."
    en: "Keep the form draft as one typed object and validate it with the existing domain validator on submit."
prerequisites: [re-02-05-derived-values-not-state, js-06-01-forms-inputs-labels]
subskills:
  - { family: R-02, skill: "controlled inputs", depth: intro }
  - { family: P-05, skill: "typed props/state/events/hooks", depth: practice }
glossary: [controlled-input, synthetic-event]
selfCheck: [no-onchange, wish-form]

blocks:
  - id: value-from-state
    kind: explanation
    title:
      uk: "Поле, яке показує стан"
      en: "A field that shows state"
    body:
      uk: |
        У [[controlled-input|керованого поля]] значення бере React — зі стану:

        ```jsx
        const [title, setTitle] = useState("");
        <input value={title} onChange={(event) => setTitle(event.target.value)} />
        ```

        Ось що відбувається, коли людина натискає клавішу:

        1. Браузер показує нову літеру в полі й запускає подію `input`.
        2. React викликає `onChange` — на **кожну** клавішу, а не лише коли поле втрачає фокус, як нативна подія `change`.
        3. Обробник викликає сетер з `event.target.value`, і стан отримує новий текст.
        4. Новий рендер записує `value={title}` назад у поле — тепер там текст зі стану.

        Так у стані завжди те саме, що на екрані, і з ним можна працювати: перевірити, очистити, підставити інше значення.

        `event` тут — [[synthetic-event|синтетична подія]] React: обгортка над подією браузера з тими самими `target`, `currentTarget` і `preventDefault()`.
      en: |
        A [[controlled-input]] gets its value from React — from state:

        ```jsx
        const [title, setTitle] = useState("");
        <input value={title} onChange={(event) => setTitle(event.target.value)} />
        ```

        Here is what happens when a person presses a key:

        1. The browser shows the new letter in the field and fires an `input` event.
        2. React calls `onChange` — on **every** key, not only when the field loses focus like the native `change` event.
        3. The handler calls the setter with `event.target.value`, and state gets the new text.
        4. The new render writes `value={title}` back into the field — now the field holds the text from state.

        This way state always holds what is on the screen, and you can work with it: validate it, clear it, put another value in.

        `event` here is a React [[synthetic-event]]: a wrapper around the browser event with the same `target`, `currentTarget` and `preventDefault()`.

  - id: keystroke-timeline
    kind: visual
    visual: render-timeline
    title:
      uk: "Одна клавіша в керованому полі"
      en: "One keystroke in a controlled field"
    textEquivalent:
      uk: >-
        Рендер 1 бачить price = "4" і записує це значення в поле. Людина натискає клавішу 5: браузер на мить показує "45" і
        запускає подію input, React викликає onChange. Обробник бачить знімок price = "4", а з event.target.value читає "45" і
        викликає setPrice("45"). Рендер 2 бачить price = "45", і commit записує "45" у поле. Якби onChange не було, нічого б не
        попросило нового рендеру, і React повернув би в поле значення зі стану, "4": натиснута клавіша зникла б.
      en: >-
        Render 1 sees price = "4" and writes that value into the field. The person presses the key 5: the browser briefly shows
        "45" and fires an input event, and React calls onChange. The handler sees the snapshot price = "4", reads "45" from
        event.target.value and calls setPrice("45"). Render 2 sees price = "45", and the commit writes "45" into the field.
        Without onChange nothing would ask for a new render, and React would put the value from state, "4", back into the
        field: the key press would vanish.
    spec:
      component: PriceField
      code: |
        function PriceField() {
          const [price, setPrice] = useState("4");
          function handleChange(event) {
            setPrice(event.target.value);
          }
          return <input value={price} onChange={handleChange} />;
        }
      steps:
        - phase: render
          render: 1
          line: 2
          reason: { uk: "перший показ (тут — з уже набраною «4»)", en: "the first display (here with “4” already typed)" }
          snapshot: { state: { price: "4" } }
          caption:
            uk: "Рендер 1: `price` — `\"4\"`, і `value={price}` каже полю показувати саме це."
            en: "Render 1: `price` is `\"4\"`, and `value={price}` tells the field to show exactly that."
        - phase: commit
          render: 1
          line: 6
          dom: "<input value=\"4\">"
          caption:
            uk: "Commit 1: у полі «4»."
            en: "Commit 1: the field shows “4”."
        - phase: event
          name: input → onChange
          line: 4
          sees: { price: "4", "event.target.value": "45" }
          actions: ["setPrice(\"45\")"]
          queued: { price: "45" }
          caption:
            uk: "Людина натискає `5`. Браузер на мить показує «45» і запускає `input`, React викликає `onChange`. Знімок досі `\"4\"`, а новий текст лежить в `event.target.value`."
            en: "The person presses `5`. The browser briefly shows “45” and fires `input`, and React calls `onChange`. The snapshot is still `\"4\"`, and the new text is in `event.target.value`."
        - phase: render
          render: 2
          line: 2
          reason: { uk: "сетер в onChange (price → \"45\")", en: "the setter in onChange (price → \"45\")" }
          snapshot: { state: { price: "45" } }
          caption:
            uk: "Рендер 2: `price` — `\"45\"`."
            en: "Render 2: `price` is `\"45\"`."
        - phase: commit
          render: 2
          line: 6
          dom: "<input value=\"45\">"
          caption:
            uk: "Commit 2: React записує в поле значення зі стану — «45». Без `onChange` нового рендеру не було б, і React повернув би в поле «4»: клавіша зникла б."
            en: "Commit 2: React writes the value from state into the field — “45”. Without `onChange` there would be no new render, and React would put “4” back: the key press would vanish."

  - id: no-onchange
    kind: prediction
    lang: jsx
    runnable: false
    prompt:
      uk: "У формі звички поле назви має `value`, але не має `onChange`. Людина клацає в поле й друкує «Біг». Що буде в полі?"
      en: "In a habit form, the name field has `value` but no `onChange`. A person clicks into the field and types “Run”. What is in the field?"
    code: |
      const [draft, setDraft] = useState({ name: "", frequency: "daily" });

      return <input value={draft.name} />;
    answer:
      type: choice
      options:
        - id: empty
          text:
            uk: "Поле лишається порожнім: літери зникають, а консоль показує попередження React"
            en: "The field stays empty: the letters vanish, and the console shows a React warning"
        - id: typed
          text:
            uk: "У полі «Біг», а `draft.name` лишається порожнім — React лише спостерігає"
            en: "The field shows “Run”, and `draft.name` stays empty — React only watches"
          why:
            uk: "`value` — не спостереження, а наказ: після кожної спроби React повертає в поле значення зі стану."
            en: "`value` is not watching but a command: after every attempt React puts the value from state back into the field."
        - id: synced
          text:
            uk: "У полі «Біг», і `draft.name` теж «Біг»"
            en: "The field shows “Run”, and `draft.name` is “Run” too"
          why:
            uk: "Стан змінює лише сетер, а його тут ніхто не викликає."
            en: "Only the setter changes state, and nobody calls it here."
        - id: error
          text:
            uk: "Сторінка зупиняється з помилкою"
            en: "The page stops with an error"
          why:
            uk: "Це не помилка, а попередження: сторінка працює, просто поле стало лише для читання."
            en: "This is not an error but a warning: the page works, the field has just become read-only."
      correct: [empty]
    explanation:
      uk: "Поле з `value` показує те, що в стані. Без `onChange` ніщо не змінює `draft.name`, тож React щоразу повертає в поле порожній текст. У консолі — попередження ``You provided a `value` prop to a form field without an `onChange` handler. This will render a read-only field.``"
      en: "A field with `value` shows what is in state. Without `onChange` nothing changes `draft.name`, so React puts the empty text back every time. The console shows the warning ``You provided a `value` prop to a form field without an `onChange` handler. This will render a read-only field.``"

  - id: typed-handlers
    kind: explanation
    title:
      uk: "Типи для обробників"
      en: "Types for handlers"
    body:
      uk: |
        У `.tsx`-файлі обробнику дають тип події. Типи імпортують із `react` як типи:

        ```tsx
        import type { ChangeEvent, SubmitEvent } from "react";

        type ExpenseDraft = { label: string; category: string };

        function handleCategoryChange(event: ChangeEvent<HTMLSelectElement>) {
          setDraft({ ...draft, category: event.target.value });
        }

        function handleSubmit(event: SubmitEvent<HTMLFormElement>) {
          event.preventDefault();
          // …
        }
        ```

        - `ChangeEvent<HTMLSelectElement>` — зміна у `<select>`; для `<input>` — `ChangeEvent<HTMLInputElement>`. Тоді `event.target.value` має тип `string`.
        - `SubmitEvent<HTMLFormElement>` — надсилання форми. У старішому коді трапляється `FormEvent`; у `@types/react` 19.3 його позначено застарілим.
        - `useState<ExpenseDraft>(…)` каже, якої форми чернетка: усі поля разом, одним об’єктом.

        Як і в розділі про TypeScript, пісочниця лише прибирає типи й нічого не перевіряє. Перевіряє `tsc` — у локальному завданні цього уроку.

        І ще одне: `onSubmit` у React **не** скасовує перезавантаження сам. `event.preventDefault()` потрібен, як і зі слухачем `submit` у звичайному JavaScript.
      en: |
        In a `.tsx` file a handler gets an event type. The types are imported from `react` as types:

        ```tsx
        import type { ChangeEvent, SubmitEvent } from "react";

        type ExpenseDraft = { label: string; category: string };

        function handleCategoryChange(event: ChangeEvent<HTMLSelectElement>) {
          setDraft({ ...draft, category: event.target.value });
        }

        function handleSubmit(event: SubmitEvent<HTMLFormElement>) {
          event.preventDefault();
          // …
        }
        ```

        - `ChangeEvent<HTMLSelectElement>` is a change in a `<select>`; for an `<input>` it is `ChangeEvent<HTMLInputElement>`. Then `event.target.value` has the type `string`.
        - `SubmitEvent<HTMLFormElement>` is a form submission. Older code uses `FormEvent`; `@types/react` 19.3 marks it deprecated.
        - `useState<ExpenseDraft>(…)` says what shape the draft has: all fields together, in one object.

        As in the TypeScript unit, the sandbox only removes the types and checks nothing. `tsc` checks them — in this lesson's local task.

        One more thing: React's `onSubmit` does **not** cancel the reload by itself. `event.preventDefault()` is needed, just as with a `submit` listener in plain JavaScript.

  - id: habit-form
    kind: example
    runtime: browser-react
    dir: habit-form
    entry: main.tsx
    strings:
      title: { uk: "Нова звичка", en: "A new habit" }
      nameLabel: { uk: "Назва", en: "Name" }
      frequencyLabel: { uk: "Частота", en: "Frequency" }
      daily: { uk: "щодня", en: "daily" }
      weekly: { uk: "щотижня", en: "weekly" }
      save: { uk: "Зберегти", en: "Save" }
    title:
      uk: "Типізована форма звички"
      en: "A typed habit form"
    body:
      uk: |
        Форма звички тримає чернетку одним об’єктом `HabitDraft`, а обидва поля керовані. Компонент виводить чернетку в консоль на кожен рендер. Запусти, надрукуй назву, вибери частоту й натисни «Зберегти» на вкладці **Сторінка**.
      en: |
        The habit form keeps the draft in one `HabitDraft` object, and both fields are controlled. The component prints the draft to the console on every render. Run it, type a name, pick a frequency and press “Save” on the **Page** tab.
    tryIt:
      uk: |
        1. Кожна літера — новий рядок `render:` з новою назвою. Після «Зберегти» — рядок `submit:`.
        2. Прибери з поля назви `onChange={handleNameChange}` і запусти: літери більше не з’являються, а консоль показує попередження React про `value` без `onChange`. Поверни обробник.
        3. Прибери рядок коду `event.preventDefault();` і натисни «Зберегти»: у консолі — примітка платформи, що форма надіслалась би й сторінка перезавантажилась би. У звичайному браузері чернетка зникла б. Поверни рядок коду.
      en: |
        1. Every letter gives a new `render:` line with the new name. After “Save” comes a `submit:` line.
        2. Remove `onChange={handleNameChange}` from the name field and run: letters no longer appear, and the console shows React's warning about `value` without `onChange`. Put the handler back.
        3. Remove the line of code `event.preventDefault();` and press “Save”: the console shows the platform's note that the form would be submitted and the page reloaded. In an ordinary browser the draft would be gone. Put the line of code back.

  - id: check-with-tsc
    kind: local-task
    runtime: local-web
    title:
      uk: "Перевір типи подій через tsc"
      en: "Check the event types with tsc"
    intro:
      uk: |
        Пісочниця не перевіряє типів, тож перевіримо їх на твоєму комп’ютері. Ти створиш у теці курсу `~/js-course` окрему теку `react-types` — лише для перевірки типів React. Самого React вона не запускає: `@types/react` дає `tsc` типи, щоб перевірити `.tsx`-файл.

        Команди однакові для macOS, Linux і Windows PowerShell. Їх перевірено в macOS із Node.js v25.2.1, npm 11.6.2, TypeScript 7.0.2 і `@types/react` 19.3.0; у Linux і Windows їх не запускали.

        Вміст `tsconfig.json` для кроку 6:

        ```json
        {
          "compilerOptions": {
            "strict": true,
            "target": "es2023",
            "lib": ["es2023", "dom"],
            "module": "esnext",
            "moduleResolution": "bundler",
            "jsx": "react-jsx",
            "noEmit": true,
            "types": []
          },
          "include": ["src"]
        }
        ```

        Нове тут: `"jsx": "react-jsx"` дозволяє JSX у `.tsx`-файлах, а `"noEmit": true` каже лише перевіряти, нічого не створюючи.

        Що виведе `tsc` на кроці 9 (перші рядки; у тебе рядок і стовпчик ті самі, якщо файл скопійовано без змін):

        ```text
        src/HabitForm.tsx(28,37): error TS2322: Type '(event: ChangeEvent<HTMLSelectElement, Element>) => void' is not assignable to type 'ChangeEventHandler<HTMLInputElement, HTMLInputElement>'.
          Types of parameters 'event' and 'event' are incompatible.
        …
        ```
      en: |
        The sandbox does not check types, so let us check them on your computer. You will create a separate folder `react-types` in the course folder `~/js-course` — only for checking React types. It does not run React itself: `@types/react` gives `tsc` the types it needs to check a `.tsx` file.

        The commands are the same on macOS, Linux and Windows PowerShell. They were checked on macOS with Node.js v25.2.1, npm 11.6.2, TypeScript 7.0.2 and `@types/react` 19.3.0; they were not run on Linux or Windows.

        The contents of `tsconfig.json` for step 6:

        ```json
        {
          "compilerOptions": {
            "strict": true,
            "target": "es2023",
            "lib": ["es2023", "dom"],
            "module": "esnext",
            "moduleResolution": "bundler",
            "jsx": "react-jsx",
            "noEmit": true,
            "types": []
          },
          "include": ["src"]
        }
        ```

        What is new: `"jsx": "react-jsx"` allows JSX in `.tsx` files, and `"noEmit": true` says to check only and create nothing.

        What `tsc` prints in step 9 (the first lines; your line and column are the same if you copied the file unchanged):

        ```text
        src/HabitForm.tsx(28,37): error TS2322: Type '(event: ChangeEvent<HTMLSelectElement, Element>) => void' is not assignable to type 'ChangeEventHandler<HTMLInputElement, HTMLInputElement>'.
          Types of parameters 'event' and 'event' are incompatible.
        …
        ```
    tools:
      - { name: "Node.js", version: "22 or newer", note: { uk: "той самий, що й у розділі про інструменти", en: "the same one as in the tooling unit" } }
      - { name: "npm", version: "10+", note: { uk: "встановлюється разом із Node.js", en: "comes with Node.js" } }
      - { name: "TypeScript", version: "7.x", note: { uk: "встановиш у цьому завданні", en: "you install it in this task" } }
      - { name: "@types/react", version: "19.3+", note: { uk: "типи React для `tsc`; у старіших версіях немає `SubmitEvent`", en: "React's types for `tsc`; older versions have no `SubmitEvent`" } }
    steps:
      - text:
          uk: "Перейди в теку курсу, створи в ній `react-types` і перейди туди. Якщо теки `~/js-course` ще немає, спершу створи її: `mkdir ~/js-course`. Якщо `react-types` уже є, бо ти проходиш урок удруге, `mkdir` скаже, що тека існує, — просто виконай `cd react-types`."
          en: "Go to the course folder, create `react-types` in it and go there. If there is no `~/js-course` folder yet, create it first: `mkdir ~/js-course`. If `react-types` already exists because you are doing the lesson a second time, `mkdir` says the folder exists — just run `cd react-types`."
        command: "cd ~/js-course\nmkdir react-types\ncd react-types"
      - text:
          uk: "Створи `package.json` і познач файли як ES-модулі."
          en: "Create `package.json` and mark the files as ES modules."
        command: "npm init -y\nnpm pkg set type=module"
        expect:
          uk: "`Wrote to …/react-types/package.json:` і вміст файлу; друга команда нічого не виводить."
          en: "`Wrote to …/react-types/package.json:` and the file's contents; the second command prints nothing."
      - text:
          uk: "Встанови TypeScript і типи React як dev-залежності."
          en: "Install TypeScript and React's types as dev dependencies."
        command: "npm install --save-dev typescript @types/react"
        expect:
          uk: "`added 4 packages, and audited 5 packages in …` і `found 0 vulnerabilities`; кількість пакетів залежить від версій."
          en: "`added 4 packages, and audited 5 packages in …` and `found 0 vulnerabilities`; the number of packages depends on the versions."
      - text:
          uk: "Перевір версію `tsc`."
          en: "Check the `tsc` version."
        command: "npx tsc --version"
        expect:
          uk: "`Version 7.0.2` (або новіша 7.x)."
          en: "`Version 7.0.2` (or a newer 7.x)."
      - text:
          uk: "Відкрий теку у VS Code (`code .` або **File → Open Folder…**)."
          en: "Open the folder in VS Code (`code .` or **File → Open Folder…**)."
        command: "code ."
      - text:
          uk: "Створи поруч із `package.json` файл `tsconfig.json` із вмістом, наведеним на початку завдання."
          en: "Next to `package.json` create the file `tsconfig.json` with the contents shown at the start of the task."
      - text:
          uk: "Створи файл `src/HabitForm.tsx` і скопіюй у нього весь `App.tsx` з прикладу «Типізована форма звички» — у тому вигляді, в якому він був до твоїх змін."
          en: "Create the file `src/HabitForm.tsx` and copy all of `App.tsx` from the example “A typed habit form” into it — as it was before your changes."
      - text:
          uk: "Запусти перевірку."
          en: "Run the check."
        command: "npx tsc"
        expect:
          uk: "Нічого: помилок немає, і `tsc` просто повертає запрошення терміналу."
          en: "Nothing: there are no errors, and `tsc` simply returns to the terminal prompt."
      - text:
          uk: "Дай обробнику назви хибний тип: у рядку коду `function handleNameChange(event: ChangeEvent<HTMLInputElement>)` заміни `HTMLInputElement` на `HTMLSelectElement`, збережи файл і запусти перевірку знову. VS Code ще до запуску підкреслить `onChange={handleNameChange}`."
          en: "Give the name handler a wrong type: in the line of code `function handleNameChange(event: ChangeEvent<HTMLInputElement>)` replace `HTMLInputElement` with `HTMLSelectElement`, save the file and run the check again. VS Code underlines `onChange={handleNameChange}` even before the run."
        command: "npx tsc"
        expect:
          uk: "Помилка `TS2322` на рядку з `onChange={handleNameChange}` — текст на початку завдання. Обробник чекає подію від `<select>`, а `<input>` дасть подію від поля вводу, у якої немає, наприклад, `options`."
          en: "Error `TS2322` on the line with `onChange={handleNameChange}` — the text at the start of the task. The handler expects an event from a `<select>`, but the `<input>` gives an event from an input field, which has no `options`, for example."
      - text:
          uk: "Поверни `HTMLInputElement`, збережи й перевір ще раз."
          en: "Put `HTMLInputElement` back, save and check again."
        command: "npx tsc"
        expect:
          uk: "Знову нічого — помилку виправлено."
          en: "Nothing again — the error is fixed."
    verify:
      - id: tsc-silent
        text:
          uk: "`npx tsc` нічого не вивів для правильного файлу."
          en: "`npx tsc` printed nothing for the correct file."
      - id: tsc-error
        text:
          uk: "Я побачив помилку `TS2322` для хибного типу події й виправив її."
          en: "I saw error `TS2322` for the wrong event type and fixed it."
    troubleshooting:
      - problem:
          uk: "`error TS2307: Cannot find module 'react' or its corresponding type declarations.`"
          en: "`error TS2307: Cannot find module 'react' or its corresponding type declarations.`"
        fix:
          uk: "Не встановлено `@types/react`: виконай `npm install --save-dev @types/react` у теці `react-types`."
          en: "`@types/react` is not installed: run `npm install --save-dev @types/react` in the `react-types` folder."
      - problem:
          uk: "`error TS17004: Cannot use JSX unless the '--jsx' flag is provided.`"
          en: "`error TS17004: Cannot use JSX unless the '--jsx' flag is provided.`"
        fix:
          uk: "У `tsconfig.json` бракує рядка `\"jsx\": \"react-jsx\"` — додай його в `compilerOptions`."
          en: "`tsconfig.json` lacks the line `\"jsx\": \"react-jsx\"` — add it to `compilerOptions`."
    recovery:
      uk: "Тека `react-types` нічого не змінює в інших теках. Якщо щось пішло не так, видали її й почни з кроку 1 — або просто знову скопіюй `App.tsx` з прикладу в `src/HabitForm.tsx`."
      en: "The `react-types` folder changes nothing in other folders. If something goes wrong, delete it and start from step 1 — or simply copy `App.tsx` from the example into `src/HabitForm.tsx` again."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: надсилання форми й валідатор"
      en: "Recall: form submission and the validator"
    items:
      - id: submit-default
        from: js-06-10-events-default-behavior
        prompt:
          uk: "Слухач `submit` на формі читає поля й додає рядок у список, але не викликає `event.preventDefault()`. Що станеться у звичайному браузері, коли людина надішле форму?"
          en: "A `submit` listener on a form reads the fields and adds a row to the list but does not call `event.preventDefault()`. What happens in an ordinary browser when a person submits the form?"
        answer:
          type: choice
          options:
            - id: reload
              text:
                uk: "Рядок додасться, а потім браузер надішле форму й перезавантажить сторінку — рядок зникне"
                en: "The row is added, then the browser submits the form and reloads the page — the row is gone"
            - id: stays
              text:
                uk: "Рядок додасться, і сторінка лишиться як є"
                en: "The row is added, and the page stays as it is"
              why:
                uk: "Надсилання й перезавантаження — типова дія форми. Браузер виконує її після слухача, якщо її не скасувати."
                en: "Submitting and reloading is the form's default action. The browser carries it out after the listener unless it is cancelled."
            - id: nothing
              text:
                uk: "Нічого: слухач не спрацює без `preventDefault`"
                en: "Nothing: the listener does not run without `preventDefault`"
              why:
                uk: "Слухач спрацьовує завжди; `preventDefault` лише скасовує те, що браузер зробить після нього."
                en: "The listener always runs; `preventDefault` only cancels what the browser does after it."
          correct: [reload]
        explanation:
          uk: "Слухач виконується, а потім браузер робить типову дію — надсилає форму й перезавантажує сторінку. З `onSubmit` у React так само: без `event.preventDefault()` сторінка перезавантажилася б, і стан пропав би."
          en: "The listener runs, and then the browser performs the default action — it submits the form and reloads the page. React's `onSubmit` is the same: without `event.preventDefault()` the page would reload, and the state would be lost."
      - id: validator-shape
        from: js-02-11-independent-validation
        prompt:
          uk: "Валідатор повертає `{ ok: true, value }` або `{ ok: false, errors }`. Що виведе цей код?"
          en: "A validator returns `{ ok: true, value }` or `{ ok: false, errors }`. What does this code print?"
        code: |
          function validateTask(input) {
            const title = input.title.trim();
            if (title === "") {
              return { ok: false, errors: { title: "required" } };
            }
            return { ok: true, value: { title } };
          }
          const check = validateTask({ title: "   " });
          console.log(check.ok, check.ok ? check.value.title : check.errors.title);
        verify:
          logs: ["false required"]
        answer:
          type: choice
          options:
            - id: right
              code: "false required"
            - id: spaces
              code: "true    "
              why:
                uk: "`trim()` прибирає пробіли з країв, тож лишається порожній текст, і валідатор повертає помилку."
                en: "`trim()` removes the spaces at the edges, so an empty text is left, and the validator returns an error."
            - id: crash
              code: "false undefined"
              why:
                uk: "Коли `ok` — `false`, код читає `check.errors.title`, а там ключ `\"required\"`."
                en: "When `ok` is `false`, the code reads `check.errors.title`, which holds the key `\"required\"`."
          correct: [right]
        explanation:
          uk: "Три пробіли після `trim()` — порожній текст, тож `ok` хибне, а `errors.title` — ключ `\"required\"`. Форма в React показує текст для цього ключа біля поля, а на `ok: true` бере очищене `value`."
          en: "Three spaces after `trim()` are an empty text, so `ok` is false, and `errors.title` is the key `\"required\"`. A React form shows the text for that key next to the field, and on `ok: true` it takes the cleaned `value`."

  - id: wish-form
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: wish-form
    entry: main.tsx
    editable: [App.tsx]
    strings:
      title: { uk: "Нове бажання", en: "A new wish" }
      nameLabel: { uk: "Назва", en: "Name" }
      priceLabel: { uk: "Ціна, грн", en: "Price, UAH" }
      add: { uk: "Додати", en: "Add" }
      noPrice: { uk: "без ціни", en: "no price" }
      currency: { uk: "грн", en: "UAH" }
      required: { uk: "Введи назву.", en: "Enter a name." }
      tooLong: { uk: "Назва довша за 80 символів.", en: "The name is longer than 80 characters." }
      notNumber: { uk: "Ціна має бути числом.", en: "The price must be a number." }
      negative: { uk: "Ціна не може бути від’ємною.", en: "The price cannot be negative." }
      notWhole: { uk: "Ціна — ціле число гривень.", en: "The price is a whole number of hryvnias." }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
    title:
      uk: "Типізована форма бажання"
      en: "A typed wish form"
    instructions:
      uk: |
        Форма нового бажання вже має підписи, поля, абзаци для повідомлень і список доданих бажань. У `wishes.ts` — валідатор `validateItem` з проєкту, тексти `MESSAGES` і `nextWishId`. Зроби форму робочою:

        1. Тримай обидва поля в **одному** стані-об’єкті типу `WishFields` і зроби обидва поля керованими, з типізованими обробниками змін.
        2. Надсилання форми не перезавантажує сторінку. Типізуй обробник надсилання.
        3. Під час надсилання передай у `validateItem` назву й ціну. Порожнє поле ціни означає `null` (бажання без ціни); інакше ціна — це `Number` від тексту поля.
        4. Якщо валідатор повернув помилки, поклади їх у стан `errors` — повідомлення з’являться під полями.
        5. Якщо все гаразд, додай бажання в кінець списку (`id` дає `nextWishId()`, `acquired: false`, `category: null`), очисти обидва поля й повідомлення.

        Кожна перевірка показує власну, щойно створену копію форми. Пісочниця типів не перевіряє — щоб перевірити їх, скопіюй `App.tsx` і `wishes.ts` у `src` теки `react-types` з локального завдання й запусти `npx tsc`.
      en: |
        The new-wish form already has labels, fields, paragraphs for messages and a list of added wishes. `wishes.ts` holds the project's validator `validateItem`, the `MESSAGES` texts and `nextWishId`. Make the form work:

        1. Keep both fields in **one** state object of type `WishFields` and make both fields controlled, with typed change handlers.
        2. Submitting the form does not reload the page. Type the submit handler.
        3. On submit, pass the name and the price to `validateItem`. An empty price field means `null` (a wish without a price); otherwise the price is `Number` of the field's text.
        4. If the validator returned errors, put them into the `errors` state — the messages appear under the fields.
        5. If everything is fine, add the wish at the end of the list (`id` from `nextWishId()`, `acquired: false`, `category: null`), and clear both fields and the messages.

        Every check shows its own freshly created copy of the form. The sandbox does not check types — to check them, copy `App.tsx` and `wishes.ts` into `src` of the `react-types` folder from the local task and run `npx tsc`.
    testTitles:
      "typing changes both fields":
        uk: "Набраний текст з’являється в обох полях"
        en: "Typing changes both fields"
      "submitting does not reload the page":
        uk: "Надсилання не перезавантажує сторінку"
        en: "Submitting does not reload the page"
      "an empty name shows its message under the name field":
        uk: "Порожня назва — повідомлення під полем назви"
        en: "An empty name shows its message under the name field"
      "a negative price shows its message under the price field":
        uk: "Від’ємна ціна — повідомлення під полем ціни"
        en: "A negative price shows its message under the price field"
      "a valid wish is added once, the fields and messages are cleared":
        uk: "Правильне бажання додається один раз, поля й повідомлення очищаються"
        en: "A valid wish is added once, the fields and messages are cleared"
      "an empty price adds a wish without a price":
        uk: "Порожня ціна додає бажання без ціни"
        en: "An empty price adds a wish without a price"
    hints:
      nudge:
        uk: "Почни з одного `useState<WishFields>` і двох полів, у яких є і `value`, і `onChange`. Що має статися першим ділом в обробнику надсилання?"
        en: "Start with one `useState<WishFields>` and two fields that have both `value` and `onChange`. What has to happen first thing in the submit handler?"
      explanation:
        uk: "Обробник поля, як `handleCategoryChange` у поясненні, копіює чернетку spread’ом і міняє одне поле на `event.target.value`; тип події — `ChangeEvent<HTMLInputElement>`. Обробник надсилання з типом `SubmitEvent<HTMLFormElement>` починає з `event.preventDefault()`, а тоді перетворює текст ціни: порожній текст (після `trim()`) — це `null`, бо `Number(\"\")` дає `0`. Результат `validateItem` має `ok`: на `false` — `setErrors(check.errors)`, на `true` — новий масив бажань, порожня чернетка й порожні `errors`."
        en: "A field handler, like `handleCategoryChange` in the explanation, copies the draft with a spread and changes one field to `event.target.value`; the event type is `ChangeEvent<HTMLInputElement>`. The submit handler, typed `SubmitEvent<HTMLFormElement>`, starts with `event.preventDefault()` and then converts the price text: an empty text (after `trim()`) is `null`, because `Number(\"\")` gives `0`. The result of `validateItem` has `ok`: on `false`, `setErrors(check.errors)`; on `true`, a new wishes array, an empty draft and empty `errors`."
    solutionNote:
      uk: "Обидва поля читають `draft` і змінюють його лише через свої `onChange`, тож у стані завжди те, що на екрані. Обробник надсилання скасовує перезавантаження, перетворює текст ціни на `number | null` — саме такий тип чекає `validateItem` — і за результатом або показує помилки, або додає бажання й скидає чернетку та повідомлення."
      en: "Both fields read `draft` and change it only through their `onChange`, so state always holds what is on the screen. The submit handler cancels the reload, turns the price text into `number | null` — exactly the type `validateItem` expects — and, depending on the result, either shows the errors or adds the wish and resets the draft and the messages."
    feedback:
      - when: { test: "typing changes both fields" }
        message:
          uk: "Ця перевірка друкує назву й ціну і чекає їх у полях. У поля з `value` має бути й `onChange`, що викликає сетер, інакше React повертає в поле старе значення. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check types a name and a price and expects them in the fields. A field with `value` also needs an `onChange` that calls the setter, otherwise React puts the old value back. If every check fails at once, fix the first error in the console first."
      - when: { test: "submitting does not reload the page" }
        message:
          uk: "Ця перевірка надсилає форму й чекає, що під час події `submit` типову дію скасовано: обробник `onSubmit` на `<form>` має викликати `event.preventDefault()`."
          en: "This check submits the form and expects the default action to be cancelled during the `submit` event: the `onSubmit` handler on `<form>` has to call `event.preventDefault()`."
      - when: { test: "an empty name shows its message under the name field" }
        message:
          uk: "Ця перевірка надсилає форму з порожньою назвою й ціною `10` і чекає «Введи назву.» в `.name-error`, порожній `.price-error` і порожній список. Поклади `check.errors` у стан `errors`."
          en: "This check submits the form with an empty name and the price `10` and expects “Enter a name.” in `.name-error`, an empty `.price-error` and an empty list. Put `check.errors` into the `errors` state."
      - when: { test: "a negative price shows its message under the price field" }
        message:
          uk: "Ця перевірка надсилає назву й ціну `-5` і чекає «Ціна не може бути від’ємною.» в `.price-error`. Ціну в `validateItem` передають числом: `Number` від тексту поля."
          en: "This check submits a name and the price `-5` and expects “The price cannot be negative.” in `.price-error`. The price goes to `validateItem` as a number: `Number` of the field's text."
      - when: { test: "a valid wish is added once, the fields and messages are cleared" }
        message:
          uk: "Ця перевірка спершу надсилає порожню форму, потім назву «Навушники» і ціну `80`, і чекає один рядок `Навушники — 80 грн`, порожні поля й порожні повідомлення. Після успіху скинь і чернетку, і `errors`."
          en: "This check first submits an empty form, then the name “Headphones” with the price `80`, and expects one row `Headphones — 80 UAH`, empty fields and empty messages. After a success, reset both the draft and `errors`."
      - when: { test: "an empty price adds a wish without a price" }
        message:
          uk: "Ця перевірка надсилає лише назву «Квитки на концерт» і чекає рядок `Квитки на концерт — без ціни`. Порожнє поле ціни має стати `null`: `Number(\"\")` дає `0`, а не «без ціни»."
          en: "This check submits only the name “Concert tickets” and expects the row `Concert tickets — no price`. An empty price field has to become `null`: `Number(\"\")` gives `0`, not “no price”."

  - id: to-project
    kind: transfer
    capstoneStep: RE-02
    body:
      uk: "Наприкінці розділу оболонка форми твого проєкту стане такою самою: чернетка одним типізованим об’єктом, керовані поля, `onSubmit` з `preventDefault` і доменний валідатор проєкту, що вирішує, додати запис чи показати повідомлення."
      en: "At the end of the unit your project's form shell becomes just like this: a draft in one typed object, controlled fields, `onSubmit` with `preventDefault` and the project's domain validator deciding whether to add a record or show messages."
