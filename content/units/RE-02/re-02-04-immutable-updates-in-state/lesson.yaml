id: re-02-04-immutable-updates-in-state
unit: RE-02
title:
  uk: "Незмінні оновлення стану"
  en: "Immutable updates in state"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Пояснити, чому зміна масиву чи об’єкта стану на місці й виклик сетера з тим самим посиланням не дають повторного рендеру."
    en: "Explain why mutating a state array or object and calling the setter with the same reference skips the re-render."
  - uk: "Додати, оновити й вилучити запис у стані, повертаючи нові масиви й об’єкти через spread, `map` і `filter`."
    en: "Add, update and remove a record in state by returning new arrays and objects with spread, `map` and `filter`."
prerequisites: [re-02-03-updater-queue-batching, js-04-10-immutable-updates]
subskills:
  - { family: R-02, skill: "immutable updates", depth: intro }
glossary: [state-mutation]
selfCheck: [push-or-spread, task-crud]

blocks:
  - id: same-reference
    kind: explanation
    title:
      uk: "React порівнює посилання"
      en: "React compares references"
    body:
      uk: |
        Коли ти викликаєш сетер, React порівнює нове значення зі старим через `Object.is` — для масивів і об’єктів це та сама перевірка тотожності, що й `===`. Якщо це **те саме** посилання, React вирішує, що нічого не змінилося, і рендер пропускає. (Інколи він ще раз викликає функцію компонента, перш ніж це помітить, але в DOM нічого не записує.)

        Тому [[state-mutation|мутація стану]] не працює:

        ```jsx
        function handleAdd() {
          habits.push(walk);   // the same array, changed in place
          setHabits(habits);   // Object.is(old, new) is true: no render
        }
        ```

        Масив справді змінився, але сетер отримав той самий масив, тож для React «нічого не сталося». Новий запис з’явиться на екрані лише тоді, коли компонент відрендериться з якоїсь **іншої** причини — несподівано й не тоді, коли треба.

        Правило: стан не змінюють, а **замінюють**. Сетер завжди отримує новий масив чи новий об’єкт.
      en: |
        When you call a setter, React compares the new value with the old one using `Object.is` — for arrays and objects that is the same identity check as `===`. If it is **the same** reference, React decides that nothing changed and skips the render. (Sometimes it calls the component function once more before it notices, but it writes nothing into the DOM.)

        That is why [[state-mutation]] does not work:

        ```jsx
        function handleAdd() {
          habits.push(walk);   // the same array, changed in place
          setHabits(habits);   // Object.is(old, new) is true: no render
        }
        ```

        The array really changed, but the setter got the same array, so for React “nothing happened”. The new record shows up only when the component renders for some **other** reason — unexpectedly and not when it should.

        The rule: state is not changed, it is **replaced**. The setter always gets a new array or a new object.

  - id: push-or-spread
    kind: prediction
    lang: jsx
    runnable: false
    prompt:
      uk: "У списку бажань два записи. Людина клацає один раз кнопку з `handleAddPush`. Скільки записів буде на сторінці? А після одного кліку кнопки з `handleAddSpread` (знову від двох записів)?"
      en: "The wishlist has two records. A person clicks the button with `handleAddPush` once. How many records are on the page? And after one click on the button with `handleAddSpread` (again starting from two records)?"
    code: |
      function handleAddPush() {
        wishes.push(newWish());
        setWishes(wishes);
      }

      function handleAddSpread() {
        setWishes([...wishes, newWish()]);
      }
    answer:
      type: choice
      options:
        - id: right
          text: { uk: "Після `push` — 2, після spread — 3", en: "After `push`, 2; after the spread, 3" }
        - id: both-three
          text: { uk: "В обох випадках 3", en: "3 in both cases" }
          why:
            uk: "Масив справді став довшим, але сетер отримав те саме посилання. `Object.is` каже «без змін», і React не рендерить."
            en: "The array really got longer, but the setter received the same reference. `Object.is` says “no change”, and React does not render."
        - id: push-four
          text: { uk: "Після `push` — 4, після spread — 3", en: "After `push`, 4; after the spread, 3" }
          why:
            uk: "`push` додає один запис, і нічого не дублюється. Питання лише в тому, чи React узагалі рендерить."
            en: "`push` adds one record, and nothing is duplicated. The only question is whether React renders at all."
        - id: both-two
          text: { uk: "В обох випадках 2", en: "2 in both cases" }
          why:
            uk: "Spread створює **новий** масив: `Object.is` повертає `false`, і React рендерить новий список."
            en: "The spread creates a **new** array: `Object.is` returns `false`, and React renders the new list."
      correct: [right]
    explanation:
      uk: "`push` змінює той самий масив, і `setWishes(wishes)` передає те саме посилання: React порівнює `Object.is(wishes, wishes)` — це `true` — і нічого не рендерить. На сторінці лишаються 2 записи, хоча в масиві вже 3. `[...wishes, newWish()]` — новий масив, тож React рендерить, і записів 3."
      en: "`push` changes the same array, and `setWishes(wishes)` passes the same reference: React compares `Object.is(wishes, wishes)` — that is `true` — and renders nothing. The page keeps showing 2 records, although the array already holds 3. `[...wishes, newWish()]` is a new array, so React renders, and there are 3 records."

  - id: references-graph
    kind: visual
    visual: memory-graph
    title:
      uk: "Мутація й нові масиви в пам’яті"
      en: "Mutation and new arrays in memory"
    textEquivalent:
      uk: >-
        Стан wishes вказує на масив із двома записами, w-01 і w-02. Варіант із мутацією: push додає запис w-03 у той самий
        масив, і setWishes(wishes) передає те саме посилання — Object.is повертає true, і React пропускає рендер. Інший запуск
        з того самого початку: spread створює новий масив added із трьома комірками; перші дві ведуть до тих самих записів w-01 і
        w-02, а третя — до w-03. Object.is повертає false, і React рендерить. Далі map створює ще один новий масив toggled: для
        w-02 — новий об’єкт з acquired: true, а w-01 і w-03 — ті самі об’єкти. Старі масиви й старий запис w-02 не змінено.
      en: >-
        The state wishes points at an array with two records, w-01 and w-02. The mutation variant: push adds the record w-03 to
        the same array, and setWishes(wishes) passes the same reference — Object.is returns true, and React skips the render.
        Another run from the same start: the spread creates a new array added with three slots; the first two lead to the same
        records w-01 and w-02, and the third to w-03. Object.is returns false, and React renders. Then map creates one more new
        array toggled: for w-02 a new object with acquired: true, while w-01 and w-03 are the same objects. The old arrays and
        the old w-02 record are unchanged.
    spec:
      code: |
        // wishes: the state array [w-01, w-02]
        wishes.push(mug);
        setWishes(wishes); // Object.is → true: no render

        // another run, from the same start:
        const added = [...wishes, mug];
        setWishes(added); // Object.is → false: render
        const toggled = added.map((w) =>
          w.id === "w-02" ? { ...w, acquired: true } : w,
        );
      states:
        - caption:
            uk: "Стан `wishes` — посилання на масив #list із двома записами."
            en: "The state `wishes` is a reference to the array #list with two records."
          line: 1
          bindings:
            - { name: wishes, kind: const, value: { ref: list } }
            - { name: mug, kind: const, value: { ref: w03 } }
          heap:
            list: { kind: array, items: [{ ref: w01 }, { ref: w02 }] }
            w01: { kind: object, props: { id: "w-01", acquired: false } }
            w02: { kind: object, props: { id: "w-02", acquired: false } }
            w03: { kind: object, props: { id: "w-03", acquired: false } }
        - caption:
            uk: "`push` дописує посилання на `mug` у **той самий** #list. `setWishes(wishes)` отримує те саме посилання: `Object.is` — `true`, рендеру немає, і на екрані досі два записи."
            en: "`push` appends a reference to `mug` to **the same** #list. `setWishes(wishes)` gets the same reference: `Object.is` is `true`, there is no render, and the screen still shows two records."
          line: 3
          bindings:
            - { name: wishes, kind: const, value: { ref: list } }
            - { name: mug, kind: const, value: { ref: w03 } }
          heap:
            list: { kind: array, items: [{ ref: w01 }, { ref: w02 }, { ref: w03 }] }
            w01: { kind: object, props: { id: "w-01", acquired: false } }
            w02: { kind: object, props: { id: "w-02", acquired: false } }
            w03: { kind: object, props: { id: "w-03", acquired: false } }
          changed: [list]
        - caption:
            uk: "Інший запуск, з того самого початку. Spread створює **новий** масив #added. Його комірки ведуть до тих самих записів — копіюється лише масив. `Object.is(wishes, added)` — `false`, тож React рендерить."
            en: "Another run, from the same start. The spread creates a **new** array #added. Its slots lead to the same records — only the array is copied. `Object.is(wishes, added)` is `false`, so React renders."
          line: 6
          bindings:
            - { name: wishes, kind: const, value: { ref: list } }
            - { name: mug, kind: const, value: { ref: w03 } }
            - { name: added, kind: const, value: { ref: added } }
          heap:
            list: { kind: array, items: [{ ref: w01 }, { ref: w02 }] }
            added: { kind: array, items: [{ ref: w01 }, { ref: w02 }, { ref: w03 }] }
            w01: { kind: object, props: { id: "w-01", acquired: false } }
            w02: { kind: object, props: { id: "w-02", acquired: false } }
            w03: { kind: object, props: { id: "w-03", acquired: false } }
          changed: [added]
        - caption:
            uk: "`map` будує ще один масив #toggled. Для w-02 — **новий** об’єкт #w02v2 з `acquired: true`; w-01 і w-03 — ті самі об’єкти. Старий #w02 не чіпали, тож попередній стан лишився чесним."
            en: "`map` builds one more array #toggled. For w-02 it is a **new** object #w02v2 with `acquired: true`; w-01 and w-03 are the same objects. The old #w02 was not touched, so the previous state stays honest."
          line: 8
          bindings:
            - { name: wishes, kind: const, value: { ref: list } }
            - { name: mug, kind: const, value: { ref: w03 } }
            - { name: added, kind: const, value: { ref: added } }
            - { name: toggled, kind: const, value: { ref: toggled } }
          heap:
            list: { kind: array, items: [{ ref: w01 }, { ref: w02 }] }
            added: { kind: array, items: [{ ref: w01 }, { ref: w02 }, { ref: w03 }] }
            toggled: { kind: array, items: [{ ref: w01 }, { ref: w02v2 }, { ref: w03 }] }
            w01: { kind: object, props: { id: "w-01", acquired: false } }
            w02: { kind: object, props: { id: "w-02", acquired: false } }
            w02v2: { kind: object, props: { id: "w-02", acquired: true } }
            w03: { kind: object, props: { id: "w-03", acquired: false } }
          changed: [toggled, w02v2]

  - id: wish-updates
    kind: example
    runtime: browser-react
    dir: wish-updates
    entry: main.jsx
    strings:
      title: { uk: "Список бажань", en: "Wishlist" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      addPush: { uk: "Додати (push)", en: "Add (push)" }
      addSpread: { uk: "Додати (spread)", en: "Add (spread)" }
      refresh: { uk: "Інший рендер", en: "Another render" }
      wanted: { uk: "бажане", en: "wanted" }
      acquired: { uk: "отримано", en: "acquired" }
      toggle: { uk: "Перемкнути", en: "Toggle" }
    title:
      uk: "Push, spread і зміна на місці"
      en: "Push, spread and a change in place"
    body:
      uk: |
        Список бажань має дві кнопки додавання, кнопку «Інший рендер», що змінює окрему змінну стану `refreshes`, і перемикач «отримано» біля кожного бажання. Консоль показує кожен рендер. Запусти й клацай на вкладці **Сторінка**.
      en: |
        The wishlist has two add buttons, an “Another render” button that changes a separate state variable `refreshes`, and an “acquired” toggle next to every wish. The console shows every render. Run it and click on the **Page** tab.
    tryIt:
      uk: |
        1. Клацни «Додати (push)» двічі: нових рядків `render` немає, і список не змінився.
        2. Клацни «Інший рендер»: з’являються одразу **обидва** додані бажання. Масив давно змінився — React просто не знав про це до наступного рендеру з іншої причини.
        3. Клацни «Додати (spread)»: рендер і нове бажання одразу.
        4. «Перемкнути» не працює: `handleToggle` змінює об’єкт на місці й передає той самий масив. Консоль може навіть показати рядок `render` — React інколи викликає компонент, перш ніж помітить, що масив той самий, — але напис не зміниться. Перепиши тіло так, щоб сетер отримав **новий** масив від `map`, а клацнуте бажання в ньому стало **новим** об’єктом зі spread старого й протилежним `acquired` — як `toggled` у графі пам’яті, тільки з `id` і `!w.acquired`. Запусти й перевір: тепер кожен клік — рендер і новий напис.
      en: |
        1. Click “Add (push)” twice: there are no new `render` lines, and the list did not change.
        2. Click “Another render”: **both** added wishes appear at once. The array changed long ago — React simply did not know until the next render for another reason.
        3. Click “Add (spread)”: a render and the new wish at once.
        4. “Toggle” does not work: `handleToggle` changes the object in place and passes the same array. The console may even show a `render` line — React sometimes calls the component before it notices that the array is the same — but the label does not change. Rewrite its body so that the setter gets a **new** array from `map`, in which the clicked wish becomes a **new** object spread from the old one with the opposite `acquired` — like `toggled` in the memory graph, only with `id` and `!w.acquired`. Run and check: now every click gives a render and a new label.

  - id: nested
    kind: explanation
    title:
      uk: "Spread копіює лише один рівень"
      en: "A spread copies only one level"
    body:
      uk: |
        `[...tasks]` — новий масив, але його комірки ведуть до **тих самих** об’єктів-записів. Тому ось це досі мутація:

        ```jsx
        const copy = [...tasks];
        copy[0].done = true;   // changes the record that the old state also holds
        setTasks(copy);
        ```

        React відрендерить (масив новий), і екран навіть покаже правильне. Але старий стан тепер теж «виконаний» — а з ним усе, що на нього посилається. Коли змінюєш запис усередині списку, заміни й масив, і **сам запис**:

        - додати: новий масив зі spread старого й новим записом;
        - змінити: `map`, що для потрібного запису повертає **новий** об’єкт, наприклад `list.map((h) => (h.id === "h-02" ? { ...h, active: false } : h))`;
        - вилучити: `filter`, що лишає всі записи з іншим `id`.

        Записи, яких зміна не стосується, лишаються тими самими об’єктами — це нормально: їх ніхто не змінює.
      en: |
        `[...tasks]` is a new array, but its slots lead to **the same** record objects. So this is still a mutation:

        ```jsx
        const copy = [...tasks];
        copy[0].done = true;   // changes the record that the old state also holds
        setTasks(copy);
        ```

        React renders (the array is new), and the screen even shows the right thing. But the old state is now “done” too — and so is everything that refers to it. When you change a record inside a list, replace both the array and **the record itself**:

        - add: a new array with a spread of the old one and the new record;
        - change: a `map` that returns a **new** object for the matching record, for example `list.map((h) => (h.id === "h-02" ? { ...h, active: false } : h))`;
        - remove: a `filter` that keeps every record with another `id`.

        Records the change does not concern stay the same objects — that is fine: nobody changes them.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: нові масиви й поверхнева копія"
      en: "Recall: new arrays and the shallow copy"
    items:
      - id: map-shares-records
        from: js-04-10-immutable-updates
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const habits = [
            { id: "h-01", active: true },
            { id: "h-02", active: true },
          ];
          const paused = habits.map((h) => (h.id === "h-02" ? { ...h, active: false } : h));
          console.log(paused === habits, paused[0] === habits[0], paused[1] === habits[1]);
        verify:
          logs: ["false true false"]
        answer:
          type: choice
          options:
            - id: right
              code: "false true false"
            - id: all-new
              code: "false false false"
              why:
                uk: "`map` повертає `h` без змін для записів, яких умова не стосується, — ті самі об’єкти."
                en: "`map` returns `h` unchanged for the records the condition does not concern — the same objects."
            - id: same-array
              code: "true true false"
              why:
                uk: "`map` завжди створює новий масив, навіть якщо елементи ті самі."
                en: "`map` always creates a new array, even if the elements are the same."
          correct: [right]
        explanation:
          uk: "`map` створює новий масив, перший запис переносить як є, а для `h-02` повертає новий об’єкт. Саме таку заміну React помічає: новий масив і новий змінений запис."
          en: "`map` creates a new array, carries the first record over as it is, and returns a new object for `h-02`. That is the kind of replacement React notices: a new array and a new changed record."
      - id: shallow-spread
        from: js-04-08-copying-shallow-deep
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          const expenses = [{ id: "e-01", amountMinor: 84550 }];
          const copy = [...expenses];
          copy[0].amountMinor = 0;
          console.log(expenses[0].amountMinor);
        verify:
          logs: ["0"]
        answer:
          type: text
          accept: ["0"]
          placeholder: { uk: "число", en: "a number" }
        explanation:
          uk: "Spread копіює масив, а не записи в ньому: `copy[0]` і `expenses[0]` — той самий об’єкт. Тому зміна через копію видна й в оригіналі. У стані React така «копія» тихо змінює попередній стан."
          en: "A spread copies the array, not the records in it: `copy[0]` and `expenses[0]` are the same object. So a change through the copy shows in the original too. In React state such a “copy” quietly changes the previous state."

  - id: task-crud
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: task-crud
    entry: main.jsx
    editable: [App.jsx]
    strings:
      planner: { uk: "Планувальник", en: "Planner" }
      waterPlants: { uk: "Полити квіти", en: "Water the plants" }
      libraryBooks: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      newTitle: { uk: "Нова справа", en: "New task" }
      add: { uk: "Додати", en: "Add" }
      toggle: { uk: "Перемкнути", en: "Toggle" }
      remove: { uk: "Вилучити", en: "Remove" }
      done: { uk: "виконано", en: "done" }
      pending: { uk: "очікує", en: "pending" }
    title:
      uk: "Додати, перемкнути, вилучити"
      en: "Add, toggle, remove"
    instructions:
      uk: |
        Список справ уже показує три справи з `tasks.js`, а кнопки вже викликають `handleAdd`, `handleToggle(task.id)` і `handleRemove(task.id)`. Допиши тіла цих трьох обробників:

        1. «Додати» ставить у кінець списку нову справу, яку створює `createTask`.
        2. «Перемкнути» змінює `done` лише в тієї справи, біля якої клацнули; її назва й пріоритет лишаються.
        3. «Вилучити» прибирає зі списку лише цю справу.
        4. Початковий масив із `tasks.js` і його об’єкти не змінюються — ні масив, ні жоден запис.

        Кожна перевірка показує власну, щойно створену копію списку з трьома справами з `tasks.js`. Остання перевірка порівнює масив із `tasks.js` з тим, яким він був до перевірок.
      en: |
        The task list already shows three tasks from `tasks.js`, and the buttons already call `handleAdd`, `handleToggle(task.id)` and `handleRemove(task.id)`. Write the bodies of these three handlers:

        1. “Add” puts the new task that `createTask` creates at the end of the list.
        2. “Toggle” changes `done` only for the task next to which you clicked; its title and priority stay.
        3. “Remove” takes only that task out of the list.
        4. The starting array from `tasks.js` and its objects do not change — neither the array nor any record.

        Every check shows its own freshly created copy of the list, with the three tasks from `tasks.js`. The last check compares the array from `tasks.js` with what it was before the checks.
    testTitles:
      "Add puts a new pending task at the end":
        uk: "«Додати» ставить нову невиконану справу в кінець"
        en: "“Add” puts a new pending task at the end"
      "Toggle flips only that task and keeps its other fields":
        uk: "«Перемкнути» змінює стан лише цієї справи й зберігає інші поля"
        en: "“Toggle” flips only that task and keeps its other fields"
      "Remove takes out only that task":
        uk: "«Вилучити» прибирає лише цю справу"
        en: "“Remove” takes out only that task"
      "the starting tasks stay unchanged":
        uk: "Початкові справи лишаються незмінними"
        en: "The starting tasks stay unchanged"
    hints:
      nudge:
        uk: "Що отримує сетер у кожному обробнику — той самий масив чи новий? А змінений запис — той самий об’єкт чи новий?"
        en: "What does the setter get in each handler — the same array or a new one? And the changed record — the same object or a new one?"
      explanation:
        uk: "Кожен обробник передає сетеру **новий** масив. Для додавання підходить spread старого масиву плюс новий запис. Для перемикання — `map`, що для потрібного `id` повертає новий об’єкт зі spread старого й зміненим полем, а для решти — той самий запис (як `paused` у питанні про звички). Для вилучення — `filter`, що лишає всі записи з іншим `id`. `push`, `splice` і присвоєння полю знайденого запису змінюють масив або запис, який тримає й попередній стан."
        en: "Every handler passes the setter a **new** array. For adding, a spread of the old array plus the new record works. For toggling, a `map` that returns a new object — a spread of the old one with the changed field — for the matching `id`, and the same record for the rest (like `paused` in the habits question). For removing, a `filter` that keeps every record with another `id`. `push`, `splice` and assigning to a field of a found record change an array or a record that the previous state also holds."
    solutionNote:
      uk: "Кожен обробник віддає сетеру новий масив, тож `Object.is` бачить зміну й React рендерить. Змінений запис — новий об’єкт зі spread старого, тому назва й пріоритет переходять у нього, а старий запис лишається таким, яким був. Записи, яких зміна не стосується, переходять у новий масив як є."
      en: "Every handler gives the setter a new array, so `Object.is` sees a change and React renders. The changed record is a new object spread from the old one, so the title and priority carry over, and the old record stays as it was. Records the change does not concern carry over into the new array as they are."
    feedback:
      - when: { test: "Add puts a new pending task at the end" }
        message:
          uk: "Ця перевірка клацає «Додати» один раз і чекає 4 рядки, а в останньому — назву «Нова справа» і стан «очікує». Якщо рядків досі 3, сетер отримав той самий масив (наприклад, після `push`), і React не рендерив. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check clicks “Add” once and expects 4 rows, with the title “New task” and the status “pending” in the last one. If there are still 3 rows, the setter got the same array (for example, after `push`), and React did not render. If every check fails at once, fix the first error in the console first."
      - when: { test: "Toggle flips only that task and keeps its other fields" }
        message:
          uk: "Ця перевірка клацає «Перемкнути» у другому рядку й чекає там стан «виконано» з тією самою назвою й пріоритетом `high`, а в першому й третьому рядках — «очікує». Новий запис має містити **всі** поля старого: зроби spread старого запису й зміни лише `done`."
          en: "This check clicks “Toggle” in the second row and expects the status “done” there with the same title and the priority `high`, and “pending” in the first and third rows. The new record must hold **all** fields of the old one: spread the old record and change only `done`."
      - when: { test: "Remove takes out only that task" }
        message:
          uk: "Ця перевірка клацає «Вилучити» у першому рядку й чекає лише дві назви: «Здати книжки в бібліотеку» і «Написати бабусі», у такому порядку."
          en: "This check clicks “Remove” in the first row and expects only two titles: “Return library books” and “Write to grandma”, in that order."
      - when: { test: "the starting tasks stay unchanged" }
        message:
          uk: "Ця перевірка вилучає, перемикає й додає справу — щоразу в новій копії списку, — а потім чекає, що масив із `tasks.js` і всі його записи такі самі, як до перевірок. `push`, `splice` чи `task.done = …` змінюють масив або запис, який тримає й попередній стан, навіть якщо сетер потім отримує новий масив."
          en: "This check removes, toggles and adds a task — each time in a fresh copy of the list — then expects the array from `tasks.js` and all its records to be the same as before the checks. `push`, `splice` or `task.done = …` change an array or a record that the previous state also holds, even if the setter then gets a new array."

