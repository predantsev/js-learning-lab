id: re-02-01-state-and-events
unit: RE-02
title:
  uk: "Стан і обробники подій"
  en: "State and event handlers"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Додати компоненту змінну стану через `useState` і змінювати її з обробника `onClick`."
    en: "Add a state variable with `useState` and change it from an `onClick` handler."
  - uk: "Відрізнити код, що виконується під час рендеру, від коду обробника події, і передати обробник, а не викликати його."
    en: "Tell code that runs during render from code that runs in an event handler, and pass a handler instead of calling it."
prerequisites: [re-01-07-purity-in-render, js-06-10-events-default-behavior]
subskills:
  - { family: R-02, skill: "event vs render behavior", depth: intro }
glossary: [state-variable, use-state, state-setter, event-handler-prop]
selfCheck: [plain-or-state, task-toggle]

blocks:
  - id: memory-between-renders
    kind: explanation
    title:
      uk: "Пам’ять між рендерами"
      en: "Memory between renders"
    body:
      uk: |
        Компонент — це функція, яку React викликає на кожен рендер. Звичайна змінна `let done = false` усередині неї створюється наново під час кожного виклику: що б ти в неї не записав, наступний рендер почне знову з `false`. І сама зміна такої змінної React нічого не каже — він не знає, що треба рендерити ще раз.

        Щоб компонент щось пам’ятав, йому потрібна [[state-variable|змінна стану]]. Її дає хук [[use-state|useState]]:

        ```jsx
        import { useState } from "react";

        function HabitCard() {
          const [active, setActive] = useState(true);
          // …
        }
        ```

        - `useState(true)` повертає пару: поточне значення (`active`) і [[state-setter|сетер]] (`setActive`) — функцію, що його змінює.
        - `true` — початкове значення; React використає його лише під час першого рендеру.
        - Виклик `setActive(false)` просить React відрендерити компонент знову. У тому новому рендері `useState` поверне вже `false`.
      en: |
        A component is a function that React calls on every render. A plain variable `let done = false` inside it is created anew on every call: whatever you write into it, the next render starts from `false` again. And changing such a variable tells React nothing — it does not know it should render again.

        To remember something, a component needs a [[state-variable]]. The [[use-state|useState]] hook gives one:

        ```jsx
        import { useState } from "react";

        function HabitCard() {
          const [active, setActive] = useState(true);
          // …
        }
        ```

        - `useState(true)` returns a pair: the current value (`active`) and a [[state-setter|setter]] (`setActive`) — the function that changes it.
        - `true` is the initial value; React uses it only on the first render.
        - Calling `setActive(false)` asks React to render the component again. In that new render `useState` returns `false`.

  - id: handlers
    kind: explanation
    title:
      uk: "Обробник події: передай, а не викликай"
      en: "An event handler: pass it, do not call it"
    body:
      uk: |
        Змінювати стан можна не будь-де. Рендер має лишатися чистим: він лише описує, що показати. Зміни відбуваються у відповідь на дії людини — в [[event-handler-prop|обробниках подій]]. У JSX обробник передають через prop на кшталт `onClick`:

        ```jsx
        function handleClick() {
          setActive(!active);
        }
        return <button onClick={handleClick}>Pause</button>;
        ```

        Це той самий [[callback]], що й у `addEventListener`: ти віддаєш функцію, а викличе її React — **пізніше**, коли станеться клік. Тому в дужках стоїть назва функції `handleClick`, без `()`. Запис `onClick={handleClick()}` викликав би функцію просто під час рендеру, а в `onClick` потрапило б те, що вона повернула.

        Обробник може бути й стрілковою функцією, написаною на місці: `onClick={() => setActive(!active)}` — це теж функція, яку React викличе пізніше.
      en: |
        State cannot be changed just anywhere. Render has to stay pure: it only describes what to show. Changes happen in response to what a person does — in [[event-handler-prop|event handlers]]. In JSX a handler is passed through a prop such as `onClick`:

        ```jsx
        function handleClick() {
          setActive(!active);
        }
        return <button onClick={handleClick}>Pause</button>;
        ```

        This is the same kind of [[callback]] as in `addEventListener`: you hand over a function, and React calls it **later**, when the click happens. That is why the braces hold the function name `handleClick`, without `()`. Writing `onClick={handleClick()}` would call the function right during render, and `onClick` would get whatever it returned.

        A handler can also be an arrow function written in place: `onClick={() => setActive(!active)}` — that is a function too, and React calls it later.

  - id: click-timeline
    kind: visual
    visual: render-timeline
    strings:
      pending: { uk: "Очікує", en: "Pending" }
      done: { uk: "Виконано", en: "Done" }
    title:
      uk: "Один клік: обробник, сетер, новий рендер"
      en: "One click: handler, setter, a new render"
    textEquivalent:
      uk: >-
        Компонент TaskStatus має звичайну змінну clicks і змінну стану done. Рендер 1: clicks створюється зі значенням 0,
        useState(false) повертає done = false, і компонент повертає кнопку «%%pending%% · 0». Commit записує її в DOM. Людина
        клацає: React викликає handleClick, створений у рендері 1. Обробник рахує clicks = 0 + 1 і викликає setDone(true) — це
        запит на новий рендер, а не зміна змінної done просто зараз. Рендер 2: React знову викликає TaskStatus від першого
        рядка. Рядок let clicks = 0 виконується ще раз, тож clicks знову 0 — одиниця, записана обробником, жила лише в
        старому виклику. useState повертає done = true. Commit 2 змінює текст кнопки на «%%done%% · 0»: стан запам’ятався,
        звичайна змінна — ні.
      en: >-
        The component TaskStatus has a plain variable clicks and a state variable done. Render 1: clicks is created with the
        value 0, useState(false) returns done = false, and the component returns the button "%%pending%% · 0". The commit writes
        it into the DOM. The person clicks: React calls handleClick, created in render 1. The handler computes clicks = 0 + 1 and
        calls setDone(true) — a request for a new render, not a change of the variable done right now. Render 2: React calls
        TaskStatus again from the first line. The line let clicks = 0 runs once more, so clicks is 0 again — the 1 the handler
        wrote lived only in the old call. useState returns done = true. Commit 2 changes the button text to "%%done%% · 0": the
        state was remembered, the plain variable was not.
    spec:
      component: TaskStatus
      code: |
        function TaskStatus() {
          let clicks = 0;
          const [done, setDone] = useState(false);
          function handleClick() {
            clicks = clicks + 1;
            setDone(!done);
          }
          return (
            <button onClick={handleClick}>
              {done ? "%%done%%" : "%%pending%%"} · {clicks}
            </button>
          );
        }
      steps:
        - phase: render
          render: 1
          line: 3
          reason: { uk: "перший показ компонента", en: "the component is shown for the first time" }
          snapshot: { state: { done: false } }
          caption:
            uk: "Рендер 1: React викликає `TaskStatus()`. `let clicks = 0` створює звичайну змінну, `useState(false)` повертає `done = false`."
            en: "Render 1: React calls `TaskStatus()`. `let clicks = 0` creates a plain variable, `useState(false)` returns `done = false`."
        - phase: commit
          render: 1
          line: 9
          dom: "<button>%%pending%% · 0</button>"
          caption:
            uk: "Commit 1: React записує кнопку в DOM. На екрані «%%pending%% · 0»."
            en: "Commit 1: React writes the button into the DOM. The screen shows “%%pending%% · 0”."
        - phase: event
          name: click
          line: 5
          sees: { done: false, clicks: 0 }
          actions: ["clicks = 0 + 1", "setDone(!false)"]
          queued: { done: true }
          caption:
            uk: "Клік: React викликає `handleClick` — функцію, створену в рендері 1. Вона записує в `clicks` одиницю й викликає `setDone(true)`. Сетер не змінює `done` на місці: він ставить запит на новий рендер."
            en: "Click: React calls `handleClick` — the function created in render 1. It writes 1 into `clicks` and calls `setDone(true)`. The setter does not change `done` in place: it requests a new render."
        - phase: render
          render: 2
          line: 2
          reason: { uk: "сетер попросив новий рендер (done → true)", en: "the setter requested a new render (done → true)" }
          snapshot: { state: { done: true } }
          caption:
            uk: "Рендер 2: React викликає `TaskStatus()` знову, з першого рядка. `let clicks = 0` виконується ще раз — `clicks` знову 0. А `useState` повертає вже `done = true`: це значення React зберіг поза функцією."
            en: "Render 2: React calls `TaskStatus()` again, from the first line. `let clicks = 0` runs once more — `clicks` is 0 again. But `useState` now returns `done = true`: React kept that value outside the function."
        - phase: commit
          render: 2
          line: 10
          dom: "<button>%%done%% · 0</button>"
          caption:
            uk: "Commit 2: змінився лише текст кнопки — «%%done%% · 0». Стан пережив рендер, звичайна змінна — ні."
            en: "Commit 2: only the button text changed — “%%done%% · 0”. The state survived the render, the plain variable did not."

  - id: plain-or-state
    kind: prediction
    lang: jsx
    runnable: false
    strings:
      pending: { uk: "Очікує", en: "Pending" }
      done: { uk: "Виконано", en: "Done" }
    prompt:
      uk: "На сторінці дві кнопки з цих двох компонентів. Кожну клацають двічі. Що показує кожна кнопка після першого кліку й після другого?"
      en: "A page shows one button from each of these two components. Each button is clicked twice. What does each button show after the first click and after the second?"
    code: |
      function PlainToggle() {
        let done = false;
        function handleClick() {
          done = !done;
        }
        return <button onClick={handleClick}>{done ? "%%done%%" : "%%pending%%"}</button>;
      }

      function StateToggle() {
        const [done, setDone] = useState(false);
        function handleClick() {
          setDone(!done);
        }
        return <button onClick={handleClick}>{done ? "%%done%%" : "%%pending%%"}</button>;
      }
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "PlainToggle: «Очікує», потім «Очікує». StateToggle: «Виконано», потім «Очікує»"
            en: "PlainToggle: “Pending”, then “Pending”. StateToggle: “Done”, then “Pending”"
        - id: both-toggle
          text:
            uk: "Обидві: «Виконано», потім «Очікує»"
            en: "Both: “Done”, then “Pending”"
          why:
            uk: "Зміна звичайної змінної не просить React рендерити знову, тож PlainToggle показує те, що повернув свій єдиний рендер. А якби рендер і стався, `let done = false` почав би знову з `false`."
            en: "Changing a plain variable does not ask React to render again, so PlainToggle keeps showing what its only render returned. And even if a render happened, `let done = false` would start from `false` again."
        - id: plain-sticks
          text:
            uk: "PlainToggle: «Виконано», потім «Виконано». StateToggle: «Виконано», потім «Очікує»"
            en: "PlainToggle: “Done”, then “Done”. StateToggle: “Done”, then “Pending”"
          why:
            uk: "Звичайна змінна змінюється всередині обробника, але екран оновлюється лише після нового рендеру — а його ніхто не просив."
            en: "The plain variable does change inside the handler, but the screen updates only after a new render — and nobody asked for one."
        - id: state-sticks
          text:
            uk: "PlainToggle: «Очікує», потім «Очікує». StateToggle: «Виконано», потім «Виконано»"
            en: "PlainToggle: “Pending”, then “Pending”. StateToggle: “Done”, then “Done”"
          why:
            uk: "Другий клік обробляє вже новий `handleClick` з рендеру, де `done` дорівнює `true`, тож `setDone(!done)` ставить `false`."
            en: "The second click is handled by the new `handleClick` from the render where `done` is `true`, so `setDone(!done)` sets `false`."
      correct: [right]
    explanation:
      uk: "У PlainToggle обробник змінює звичайну змінну, але нічого не просить у React: рендер не повторюється, і кнопка лишається «Очікує». У StateToggle кожен `setDone` просить новий рендер, а `useState` у ньому повертає збережене значення: `true` після першого кліку, `false` після другого. Приклад цього уроку дає це перевірити: консоль показує кожен рендер."
      en: "In PlainToggle the handler changes a plain variable but asks React for nothing: no render happens, and the button stays “Pending”. In StateToggle every `setDone` asks for a new render, and `useState` in it returns the kept value: `true` after the first click, `false` after the second. The example of this lesson lets you check it: the console shows every render."

  - id: called-handler
    kind: prediction
    lang: jsx
    runnable: false
    prompt:
      uk: "У StateToggle хтось написав `onClick={handleClick()}` замість `onClick={handleClick}`. Що станеться, коли компонент уперше з’явиться на сторінці?"
      en: "In StateToggle someone wrote `onClick={handleClick()}` instead of `onClick={handleClick}`. What happens when the component first appears on the page?"
    code: |
      function StateToggle() {
        const [done, setDone] = useState(false);
        function handleClick() {
          setDone(!done);
        }
        return <button onClick={handleClick()}>Toggle</button>;
      }
    answer:
      type: choice
      options:
        - id: loop
          text:
            uk: "Сторінка не покаже кнопку: React зупиниться з помилкою «Too many re-renders»"
            en: "The page does not show the button: React stops with the error “Too many re-renders”"
        - id: same
          text:
            uk: "Нічого особливого: дужки не мають значення, кнопка працює так само"
            en: "Nothing special: the parentheses do not matter, the button works the same"
          why:
            uk: "З дужками функція викликається одразу, під час рендеру, а не тоді, коли станеться клік."
            en: "With parentheses the function is called at once, during render, not when the click happens."
        - id: once
          text:
            uk: "Перемикач спрацює один раз під час показу, а потім кнопка нічого не робитиме"
            en: "The toggle runs once while the component is shown, and then the button does nothing"
          why:
            uk: "Виклик сетера під час рендеру просить ще один рендер — а той знову викликає `handleClick()`. Одним разом не обійдеться."
            en: "Calling the setter during render asks for another render — and that one calls `handleClick()` again. It does not stop at once."
        - id: twice
          text:
            uk: "Кожен клік перемикатиме стан двічі"
            en: "Every click toggles the state twice"
          why:
            uk: "У `onClick` потрапляє не функція, а те, що повернув `handleClick()`, — `undefined`. До кліків справа не дійде."
            en: "`onClick` does not get a function but what `handleClick()` returned — `undefined`. Things never get as far as clicks."
      correct: [loop]
    explanation:
      uk: "`handleClick()` виконується під час рендеру. Він викликає `setDone(true)` — це запит на ще один рендер. Новий рендер знову викликає `handleClick()`, той — `setDone(false)`, і так по колу. React рахує такі повтори й після межі зупиняється з помилкою `Too many re-renders. React limits the number of renders to prevent an infinite loop.` Кнопки на сторінці не буде. Обробник треба **передати**: `onClick={handleClick}`."
      en: "`handleClick()` runs during render. It calls `setDone(true)` — a request for another render. The new render calls `handleClick()` again, that one calls `setDone(false)`, and round it goes. React counts such repeats and past a limit stops with the error `Too many re-renders. React limits the number of renders to prevent an infinite loop.` There is no button on the page. The handler has to be **passed**: `onClick={handleClick}`."

  - id: toggle-two-ways
    kind: example
    runtime: browser-react
    dir: toggle-two-ways
    entry: main.jsx
    strings:
      task: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      plainLabel: { uk: "Звичайна змінна", en: "Plain variable" }
      stateLabel: { uk: "Змінна стану", en: "State variable" }
      pending: { uk: "Очікує", en: "Pending" }
      done: { uk: "Виконано", en: "Done" }
      toggle: { uk: "Перемкнути", en: "Toggle" }
    title:
      uk: "Два перемикачі: let і useState"
      en: "Two toggles: let and useState"
    body:
      uk: |
        Тут обидва компоненти з передбачення, і кожен виводить у консоль рядок на кожен рендер і на кожен клік. Натисни **Запустити**: у консолі по одному рядку `render …` від кожного компонента. Потім клацай кнопки на вкладці **Сторінка** й стеж за консоллю.
      en: |
        Here are both components from the prediction, and each prints a console line on every render and on every click. Press **Run**: the console shows one `render …` line from each component. Then click the buttons on the **Page** tab and watch the console.
    tryIt:
      uk: |
        1. Клацни кнопку «Звичайна змінна»: у консолі `click PlainToggle: done = true`, але нового рядка `render` немає, і напис не змінився.
        2. Клацни кнопку «Змінна стану» двічі. Після кожного кліку йде рядок `render StateToggle` з новим значенням: `true`, потім `false`. Зверни увагу: рядок `click …` показує значення **до** зміни.
        3. У `StateToggle` заміни `onClick={handleClick}` на `onClick={handleClick()}` і запусти. Сторінка порожня, у консолі — десятки рядків `click` і `render` (кожен рендер знову викликав обробник), а на картці помилки — `Too many re-renders`. Прибери дужки й запусти знову.
      en: |
        1. Click the “Plain variable” button: the console shows `click PlainToggle: done = true`, but no new `render` line, and the label did not change.
        2. Click the “State variable” button twice. Every click is followed by a `render StateToggle` line with the new value: `true`, then `false`. Note that the `click …` line shows the value **before** the change.
        3. In `StateToggle` replace `onClick={handleClick}` with `onClick={handleClick()}` and run. The page is empty, the console holds dozens of `click` and `render` lines (every render called the handler again), and the error card says `Too many re-renders`. Remove the parentheses and run again.

  - id: recall
    kind: review
    title:
      uk: "Пригадай: render і commit"
      en: "Recall: render and commit"
    items:
      - id: render-without-change
        from: re-01-06-render-vs-commit
        prompt:
          uk: "React ще раз викликав функцію компонента, і вона повернула той самий JSX, що й минулого разу. Що React змінить у DOM під час commit?"
          en: "React called a component function once more, and it returned the same JSX as last time. What does React change in the DOM during the commit?"
        answer:
          type: choice
          options:
            - id: nothing
              text:
                uk: "Нічого: немає різниці — немає змін у DOM"
                en: "Nothing: no difference means no DOM changes"
            - id: all
              text:
                uk: "Перебудує всі DOM-вузли цього компонента"
                en: "It rebuilds all DOM nodes of this component"
              why:
                uk: "Commit змінює лише ті вузли, які відрізняються від попереднього результату рендеру."
                en: "The commit changes only the nodes that differ from the previous render output."
            - id: page
              text:
                uk: "Перемалює всю сторінку"
                en: "It redraws the whole page"
              why:
                uk: "React порівнює новий результат із попереднім і торкається тільки відмінностей, а не всієї сторінки."
                en: "React compares the new output with the previous one and touches only the differences, not the whole page."
          correct: [nothing]
        explanation:
          uk: "Рендер — це виклик функції, що описує UI. Commit записує в DOM лише різницю між новим і попереднім описом. У прикладі цього уроку рендер просить сетер, а commit змінює тільки напис на кнопці."
          en: "A render is a call of the function that describes the UI. The commit writes into the DOM only the difference between the new and the previous description. In this lesson's example the setter asks for the render, and the commit changes only the button label."

  - id: task-toggle
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: task-toggle
    entry: main.jsx
    editable: [App.jsx]
    strings:
      payBill: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      statusDone: { uk: "Стан: виконано", en: "Status: done" }
      statusPending: { uk: "Стан: очікує", en: "Status: pending" }
      markDone: { uk: "Позначити виконаною", en: "Mark as done" }
      markPending: { uk: "Повернути в очікувані", en: "Mark as pending" }
    title:
      uk: "Перемикач стану справи"
      en: "A task status toggle"
    instructions:
      uk: |
        У `task.js` лежить справа з планувальника, вона вже виконана (`done: true`). Компонент `App` показує її назву, абзац зі станом і кнопку, але поки що все це — незмінний текст. Зроби перемикач:

        1. Тримай стан справи в змінній стану. Початкове значення бери з `task.done`, а не пиши вручну.
        2. Абзац `.status` показує «Стан: виконано», коли справу виконано, і «Стан: очікує», коли ні.
        3. Кнопка показує дію, протилежну поточному стану: «Повернути в очікувані» для виконаної справи й «Позначити виконаною» для невиконаної. Клік по ній перемикає стан.

        **Запусти** й поклацай кнопку на вкладці **Сторінка**, а тоді натисни **Перевірити**. Кожна перевірка показує власну, щойно створену копію `App`.
      en: |
        `task.js` holds a task from the planner, and it is already done (`done: true`). The `App` component shows its title, a status paragraph and a button, but so far all of it is fixed text. Make a toggle:

        1. Keep the task's status in a state variable. Take the initial value from `task.done` rather than writing it by hand.
        2. The `.status` paragraph shows “Status: done” when the task is done and “Status: pending” when it is not.
        3. The button shows the action opposite to the current status: “Mark as pending” for a done task and “Mark as done” for a pending one. A click on it flips the status.

        **Run** it and click the button on the **Page** tab, then press **Check**. Every check shows its own freshly created copy of `App`.
    testTitles:
      "starts with the status of the task":
        uk: "Спершу показано стан із `task.done`"
        en: "The status from `task.done` is shown first"
      "one click shows the other status":
        uk: "Після одного кліку — протилежний стан"
        en: "One click shows the other status"
      "a second click shows the first status again":
        uk: "Другий клік повертає початковий стан"
        en: "A second click brings back the first status"
    hints:
      nudge:
        uk: "Що має пам’ятати компонент між рендерами? Звичайна змінна для цього не годиться — чому?"
        en: "What must the component remember between renders? A plain variable will not do — why?"
      explanation:
        uk: "Згадай `HabitCard` з пояснення: `useState(true)` дав пару `active` і `setActive`, а обробник викликав `setActive(!active)`. Тут потрібно те саме для поля `done`, тільки початкове значення — з `task.done`. Текст абзацу й кнопки обери тернарним оператором від цього стану. Обробник передай в `onClick` без дужок."
        en: "Remember `HabitCard` from the explanation: `useState(true)` gave the pair `active` and `setActive`, and the handler called `setActive(!active)`. You need the same for the `done` field here, only the initial value comes from `task.done`. Pick the paragraph and button text with a ternary from that state. Pass the handler to `onClick` without parentheses."
    solutionNote:
      uk: "`useState(task.done)` бере початкове значення зі справи лише на першому рендері; далі його пам’ятає React. Обробник викликає `setDone(!done)` — новий рендер отримує протилежне значення, і обидва тексти, обчислені з нього, змінюються разом."
      en: "`useState(task.done)` takes the initial value from the task only on the first render; after that React remembers it. The handler calls `setDone(!done)` — the new render gets the opposite value, and both texts computed from it change together."
    feedback:
      - when: { test: "starts with the status of the task" }
        message:
          uk: "Ця перевірка показує новий `App` і чекає в абзаці `.status` текст «Стан: виконано», а на кнопці — «Повернути в очікувані», бо `task.done` дорівнює `true`. Початкове значення стану бери з `task.done`. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check shows a new `App` and expects “Status: done” in the `.status` paragraph and “Mark as pending” on the button, because `task.done` is `true`. Take the initial state from `task.done`. If every check fails at once, fix the first error in the console first."
      - when: { test: "one click shows the other status" }
        message:
          uk: "Ця перевірка клацає кнопку один раз і чекає «Стан: очікує» в абзаці та «Позначити виконаною» на кнопці. Звичайна змінна `let` тут не допоможе: її зміна не просить React рендерити знову — потрібен виклик сетера в обробнику."
          en: "This check clicks the button once and expects “Status: pending” in the paragraph and “Mark as done” on the button. A plain `let` variable will not help here: changing it does not ask React to render again — the handler has to call the setter."
      - when: { test: "a second click shows the first status again" }
        message:
          uk: "Ця перевірка клацає двічі й чекає знову «Стан: виконано» і «Повернути в очікувані». Обробник має ставити значення, протилежне **поточному** стану, а не завжди одне й те саме."
          en: "This check clicks twice and expects “Status: done” and “Mark as pending” again. The handler has to set the value opposite to the **current** state, not always the same one."
      - when: { error: Error }
        message:
          uk: "Якщо на картці помилки `Too many re-renders`, обробник викликається під час рендеру: в `onClick` має стояти назва функції без дужок або стрілкова функція."
          en: "If the error card says `Too many re-renders`, the handler is called during render: `onClick` needs the function name without parentheses, or an arrow function."

  - id: to-project
    kind: transfer
    capstoneStep: RE-02
    body:
      uk: "У проєкті кожен запис має свій прапорець стану: отримане бажання, виконана справа, активна звичка. Наприкінці розділу перемикання такого прапорця стане обробником події, що просить React про новий рендер, — а не рядком коду, що змінює DOM вручну."
      en: "In your project every record has a status flag: an acquired wish, a done task, an active habit. At the end of this unit, flipping that flag becomes an event handler that asks React for a new render — not a line of code that changes the DOM by hand."
