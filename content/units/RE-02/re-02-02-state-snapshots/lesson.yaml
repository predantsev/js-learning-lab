id: re-02-02-state-snapshots
unit: RE-02
title:
  uk: "Стан — це знімок кожного рендеру"
  en: "State is a snapshot per render"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Передбачити, яке значення читає обробник одразу після виклику сетера, зокрема коли `setCount(count + 1)` викликано тричі в одному обробнику."
    en: "Predict the value a handler reads right after calling the setter, including `setCount(count + 1)` called three times in one handler."
  - uk: "Пояснити, чому `alert` чи таймер, запущені в обробнику, показують стан того рендеру, у якому їх створено."
    en: "Explain why an alert or a timeout scheduled in a handler shows the state of the render it was created in."
  - uk: "Простежити два рендери поспіль і назвати знімок, який бачить кожен обробник."
    en: "Trace two consecutive renders and name the snapshot each handler closed over."
prerequisites: [re-02-01-state-and-events, js-03-05-closures]
subskills:
  - { family: R-02, skill: "state snapshots", depth: intro }
glossary: [state-snapshot]
selfCheck: [plus-three-predict, timer-predict, delayed-send]

blocks:
  - id: one-render-one-value
    kind: explanation
    title:
      uk: "Один рендер — одне значення"
      en: "One render, one value"
    body:
      uk: |
        Подивись ще раз на рядок `const [days, setDays] = useState(0);`. `days` — це `const`. Під час одного рендеру вона не може змінитися: її створив цей виклик компонента, і вона така до кінця виклику.

        Обробник, який ти пишеш усередині компонента, народжується в тому самому виклику. Він бачить саме цю `days`:

        ```jsx
        function handleClick() {
          setDays(days + 1);
          console.log(days); // the old value: setDays did not change this const
        }
        ```

        `setDays` не переписує `days` у вже запущеному обробнику. Він просить React про **наступний** рендер — новий виклик компонента з **новою** `days`. Тому кажуть, що стан — це [[state-snapshot|знімок]]: кожен рендер має свої значення, і все, що створено в ньому, бачить лише їх.
      en: |
        Look at the line `const [days, setDays] = useState(0);` once more. `days` is a `const`. During one render it cannot change: this call of the component created it, and it stays the same until the call ends.

        A handler you write inside the component is born in that same call. It sees exactly this `days`:

        ```jsx
        function handleClick() {
          setDays(days + 1);
          console.log(days); // the old value: setDays did not change this const
        }
        ```

        `setDays` does not rewrite `days` in a handler that is already running. It asks React for the **next** render — a new call of the component with a **new** `days`. That is why state is called a [[state-snapshot]]: every render has its own values, and everything created in it sees only them.

  - id: photo
    kind: analogy
    body:
      uk: "Кожен рендер — це надрукована фотографія стану. Усе, що зроблено під час рендеру, — JSX, обробники, запущений таймер — тримає в руках саме цю фотографію. Виклик сетера — це замовлення **нової** фотографії, а не малювання по тій, що вже в руках."
      en: "Every render is a printed photo of the state. Everything made during that render — the JSX, the handlers, a scheduled timer — holds that very photo. Calling the setter orders a **new** photo instead of drawing on the one in your hand."
    limits:
      uk: "Нове фото роблять лише тоді, коли React рендерить компонент знову, — не за часом і не тоді, коли ти вдруге читаєш змінну. Кілька замовлень, зроблених під час однієї події, проявляють разом, в одне фото. А «фото» — не копія: обробник тримає живе посилання на `const` свого рендеру, просто ця `const` ніколи не змінюється."
      en: "A new photo is taken only when React renders the component again — not on a timer and not when you read the variable a second time. Several orders placed during one event are developed together into a single photo. And the “photo” is not a copy: the handler keeps a live link to the `const` of its render; that `const` simply never changes."

  - id: plus-three-predict
    kind: prediction
    lang: jsx
    runnable: false
    prompt:
      uk: "Звичка щойно з’явилася на сторінці: `days` дорівнює `0`. Людина один раз клацає «+3». Що покаже `alert` і яке число буде на сторінці після кліку?"
      en: "The habit has just appeared on the page: `days` is `0`. A person clicks “+3” once. What does the `alert` show, and which number is on the page after the click?"
    code: |
      function HabitDays() {
        const [days, setDays] = useState(0);

        function handlePlusThree() {
          setDays(days + 1);
          setDays(days + 1);
          setDays(days + 1);
          alert(days);
        }

        return <button onClick={handlePlusThree}>+3 ({days})</button>;
      }
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "`alert` покаже `0`, на сторінці буде `1`"
            en: "The `alert` shows `0`, the page shows `1`"
        - id: three-three
          text:
            uk: "`alert` покаже `3`, на сторінці буде `3`"
            en: "The `alert` shows `3`, the page shows `3`"
          why:
            uk: "Сетер не змінює `days` на місці, тож `alert` бачить `0`. А всі три виклики рахують `0 + 1` — кожен просить поставити `1`."
            en: "The setter does not change `days` in place, so the `alert` sees `0`. And all three calls compute `0 + 1` — each asks to set `1`."
        - id: zero-three
          text:
            uk: "`alert` покаже `0`, на сторінці буде `3`"
            en: "The `alert` shows `0`, the page shows `3`"
          why:
            uk: "`alert` ти передбачив правильно. Але `days + 1` у кожному виклику — це `0 + 1`: обробник бачить той самий знімок усі три рази."
            en: "You got the `alert` right. But `days + 1` in every call is `0 + 1`: the handler sees the same snapshot all three times."
        - id: one-one
          text:
            uk: "`alert` покаже `1`, на сторінці буде `1`"
            en: "The `alert` shows `1`, the page shows `1`"
          why:
            uk: "`days` — це `const` цього рендеру. Поки обробник працює, вона лишається `0`, хоч би скільки разів ти викликав сетер."
            en: "`days` is a `const` of this render. While the handler runs it stays `0`, however many times you call the setter."
      correct: [right]
    explanation:
      uk: "Обробник створено в рендері, де `days` дорівнює `0`. Тому всі три виклики — це `setDays(0 + 1)`, тобто тричі «постав `1`», а `alert(days)` показує `0`: сетер нічого не змінив у цьому рендері. Наступний рендер отримує `1`. Як змусити такий обробник справді додати три, покаже наступний урок."
      en: "The handler was created in the render where `days` is `0`. So all three calls are `setDays(0 + 1)`, that is, “set `1`” three times, and `alert(days)` shows `0`: the setter changed nothing in this render. The next render gets `1`. How to make such a handler really add three is the topic of the next lesson."

  - id: plus-three
    kind: example
    runtime: browser-react
    dir: plus-three
    entry: main.jsx
    strings:
      habit: { uk: "Ранкова зарядка", en: "Morning exercise" }
      daysDone: { uk: "Днів виконано", en: "Days done" }
    title:
      uk: "Три сетери й alert"
      en: "Three setters and an alert"
    body:
      uk: |
        Це компонент із передбачення, з рядком у консолі на кожен рендер. У цій пісочниці `alert` не відкриває вікна: його текст з’являється на вкладці **Консоль** з позначкою `alert`. Запусти, клацни «+3» на вкладці **Сторінка** й порівняй консоль зі своїм передбаченням.
      en: |
        This is the component from the prediction, with a console line on every render. In this sandbox `alert` opens no window: its text appears on the **Console** tab marked `alert`. Run it, click “+3” on the **Page** tab and compare the console with your prediction.
    tryIt:
      uk: |
        1. Клацни «+3» кілька разів. Кожен клік додає лише 1, а `alert` щоразу показує число, яке було на сторінці **до** кліку.
        2. Додай у кінець `handlePlusThree` рядок коду `setTimeout(() => console.log("3 s later: days =", days), 3000);` і запусти знову. Клацни «+3», а за секунду — ще раз.
        3. Стеж за консоллю: через три секунди після першого кліку з’явиться `3 s later: days = 0`, хоча на сторінці вже `2`. Ще за секунду — `days = 1`. Кожен таймер показав знімок свого рендеру.
      en: |
        1. Click “+3” a few times. Every click adds only 1, and the `alert` always shows the number that was on the page **before** the click.
        2. Add the line of code `setTimeout(() => console.log("3 s later: days =", days), 3000);` at the end of `handlePlusThree` and run again. Click “+3”, and a second later click it again.
        3. Watch the console: three seconds after the first click it shows `3 s later: days = 0`, although the page already shows `2`. A second later comes `days = 1`. Every timer showed the snapshot of its own render.

  - id: snapshots-timeline
    kind: visual
    visual: render-timeline
    strings:
      days: { uk: "днів", en: "days" }
    title:
      uk: "Два рендери, два знімки й таймер"
      en: "Two renders, two snapshots and a timer"
    textEquivalent:
      uk: >-
        Рендер 1 бачить days = 0, і кнопка показує «0 %%days%%». Клік викликає handlePlusThree із рендеру 1: усі три виклики
        сетера рахують 0 + 1, тому в черзі тричі значення 1, а таймер, запущений у цьому ж обробнику, отримує той самий знімок
        days = 0. React рендерить один раз: рендер 2 бачить days = 1, і кнопка показує «1 %%days%%». Через секунду спрацьовує
        таймер і виводить 0 — він тримає знімок рендеру 1, хоча на екрані вже рендер 2.
      en: >-
        Render 1 sees days = 0, and the button shows "0 %%days%%". A click calls handlePlusThree from render 1: all three setter
        calls compute 0 + 1, so the queue holds the value 1 three times, and the timer started in the same handler gets the same
        snapshot days = 0. React renders once: render 2 sees days = 1, and the button shows "1 %%days%%". One second later the
        timer fires and prints 0 — it holds the snapshot of render 1, although the screen already shows render 2.
    spec:
      component: HabitDays
      code: |
        function HabitDays() {
          const [days, setDays] = useState(0);
          function handlePlusThree() {
            setDays(days + 1);
            setDays(days + 1);
            setDays(days + 1);
            setTimeout(() => console.log(days), 1000);
          }
          return <button onClick={handlePlusThree}>{days} %%days%%</button>;
        }
      steps:
        - phase: render
          render: 1
          line: 2
          reason: { uk: "перший показ компонента", en: "the component is shown for the first time" }
          snapshot: { state: { days: 0 } }
          caption:
            uk: "Рендер 1 — перше фото: `days = 0`. У цьому ж виклику народжується `handlePlusThree`, і він бачить `days = 0`."
            en: "Render 1 — the first photo: `days = 0`. `handlePlusThree` is born in this same call, and it sees `days = 0`."
        - phase: commit
          render: 1
          line: 9
          dom: "<button>0 %%days%%</button>"
          caption:
            uk: "Commit 1: на екрані «0 %%days%%»."
            en: "Commit 1: the screen shows “0 %%days%%”."
        - phase: event
          name: click
          line: 4
          sees: { days: 0 }
          actions: ["setDays(0 + 1)", "setDays(0 + 1)", "setDays(0 + 1)", "setTimeout(() => console.log(0), 1000)"]
          queued: { days: 1 }
          caption:
            uk: "Клік: обробник із рендеру 1 тричі рахує `0 + 1` — у черзі тричі «постав 1». Таймер, створений тут, теж тримає фото рендеру 1."
            en: "Click: the handler from render 1 computes `0 + 1` three times — the queue holds “set 1” three times. The timer created here also holds the photo of render 1."
        - phase: render
          render: 2
          line: 2
          reason: { uk: "у черзі оновлення стану (days → 1)", en: "a state update is queued (days → 1)" }
          snapshot: { state: { days: 1 } }
          caption:
            uk: "Рендер 2 — нове фото: React застосовує чергу, і `days = 1`. Це **нова** `const` у новому виклику; стара `days = 0` нікуди не ділася."
            en: "Render 2 — a new photo: React applies the queue, and `days = 1`. This is a **new** `const` in a new call; the old `days = 0` has not gone anywhere."
        - phase: commit
          render: 2
          line: 9
          dom: "<button>1 %%days%%</button>"
          caption:
            uk: "Commit 2: на екрані «1 %%days%%». Один клік, три сетери — плюс один."
            en: "Commit 2: the screen shows “1 %%days%%”. One click, three setters — plus one."
        - phase: idle
          line: 7
          caption:
            uk: "Через секунду таймер виводить `0`. Він закрився над `days` рендеру 1, і та `const` досі дорівнює `0` — хоча на екрані вже рендер 2."
            en: "A second later the timer prints `0`. It closed over `days` of render 1, and that `const` is still `0` — although the screen already shows render 2."

  - id: recall
    kind: review
    title:
      uk: "Пригадай: кожен виклик має свої змінні"
      en: "Recall: every call has its own variables"
    items:
      - id: two-calls-two-bindings
        from: js-03-05-closures
        prompt:
          uk: "Що виведе цей код?"
          en: "What does this code print?"
        code: |
          function makeLogger(count) {
            return () => console.log(count);
          }
          const first = makeLogger(0);
          const second = makeLogger(1);
          first();
          second();
          first();
        verify:
          logs: ["0", "1", "0"]
        answer:
          type: order
          items:
            - { id: a, code: "0" }
            - { id: b, code: "1" }
            - { id: c, code: "0" }
        explanation:
          uk: "Кожен виклик `makeLogger` створює **свій** параметр `count`, і стрілкова функція закривається саме над ним. Тому `first` завжди виводить `0`, хоч би коли її викликали. Рендери компонента працюють так само: кожен виклик — свої `const` зі стану, і обробник бачить змінні свого виклику."
          en: "Every call of `makeLogger` creates **its own** parameter `count`, and the arrow function closes over exactly that one. So `first` always prints `0`, whenever it is called. Component renders work the same way: every call has its own `const` values from state, and a handler sees the variables of its own call."

  - id: timer-predict
    kind: prediction
    lang: jsx
    runnable: false
    strings:
      left: { uk: "Залишок", en: "Left" }
    prompt:
      uk: "Кнопка показує «Залишок: 3». Людина клацає її, а через пів секунди — ще раз. Що виведе таймер першого кліку, коли спрацює?"
      en: "The button shows “Left: 3”. A person clicks it, and half a second later clicks again. What does the timer of the first click print when it fires?"
    code: |
      function ExpenseBudget() {
        const [left, setLeft] = useState(3);

        function handleCount() {
          setLeft(left - 1);
          setTimeout(() => console.log("left:", left), 2000);
        }

        return <button onClick={handleCount}>%%left%%: {left}</button>;
      }
    answer:
      type: choice
      options:
        - id: three
          text: { uk: "`left: 3`", en: "`left: 3`" }
        - id: one
          text: { uk: "`left: 1`", en: "`left: 1`" }
          why:
            uk: "Таймер не читає «останній» стан, коли спрацьовує. Він тримає `left` того рендеру, у якому його запустили."
            en: "A timer does not read the “latest” state when it fires. It keeps the `left` of the render in which it was started."
        - id: two
          text: { uk: "`left: 2`", en: "`left: 2`" }
          why:
            uk: "`2` — це значення, яке клік **попросив** поставити, але в рендері першого кліку `left` усе ще `3`."
            en: "`2` is the value the click **asked** to set, but in the render of the first click `left` is still `3`."
      correct: [three]
    explanation:
      uk: "Перший клік стався в рендері, де `left` дорівнює `3`. Таймер, створений у його обробнику, закрився над цією `left` і через дві секунди виведе `left: 3` — хоча на екрані вже `1`. Таймер другого кліку виведе `left: 2`."
      en: "The first click happened in the render where `left` is `3`. The timer created in its handler closed over that `left` and two seconds later prints `left: 3` — although the screen already shows `1`. The timer of the second click prints `left: 2`."

  - id: delayed-send
    kind: exercise
    mode: guided
    runtime: browser-react
    dir: delayed-send
    entry: main.jsx
    editable: [App.jsx]
    strings:
      title: { uk: "Нагадування", en: "Reminder" }
      reminder: { uk: "Текст", en: "Text" }
      send: { uk: "Надіслати", en: "Send" }
      sent: { uk: "Надіслано:", en: "Sent:" }
      waterPlants: { uk: "Полити квіти", en: "Water the plants" }
      payBill: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      more: { uk: "Купити добриво", en: "Buy fertilizer" }
    title:
      uk: "Надіслати із затримкою"
      en: "Send with a delay"
    instructions:
      uk: |
        Компонент нагадування з планувальника вже має поле, підключене до змінної стану `draft`, і кнопку «Надіслати». Як саме поле пов’язане зі станом, пояснить пізніший урок; тут досить знати, що `draft` — текст у полі під час цього рендеру.

        Допиши `handleSend`:

        1. Одразу після кліку поле стає порожнім — щоб можна було писати наступне нагадування.
        2. Через одну секунду (`1000` мс) у консолі з’являється рядок: «Надіслано:» і через пробіл текст, який був у полі **в момент кліку**.
        3. Те, що людина встигла надрукувати за цю секунду, не потрапляє в надіслане.

        **Запусти**, надішли нагадування й одразу почни друкувати нове. Що виведе консоль за секунду? Потім натисни **Перевірити**. Перевірки чекають справжню секунду, тож тривають кілька секунд.
      en: |
        The reminder component from the planner already has a field connected to the state variable `draft`, and a “Send” button. How exactly the field is tied to state is explained in a later lesson; here it is enough to know that `draft` is the text in the field during this render.

        Finish `handleSend`:

        1. Right after the click the field becomes empty — so the next reminder can be typed.
        2. One second later (`1000` ms) the console shows a line: “Sent:” followed, after a space, by the text that was in the field **at the moment of the click**.
        3. Whatever the person managed to type during that second does not get into what was sent.

        **Run** it, send a reminder and start typing a new one at once. What does the console print a second later? Then press **Check**. The checks wait for a real second, so they take a few seconds.
    testTitles:
      "the field is empty right after the click":
        uk: "Одразу після кліку поле порожнє"
        en: "The field is empty right after the click"
      "nothing is printed before one second has passed":
        uk: "До спливу секунди нічого не виведено"
        en: "Nothing is printed before one second has passed"
      "one second later the text from the moment of the click is printed once":
        uk: "Через секунду один раз виведено текст із моменту кліку"
        en: "One second later the text from the moment of the click is printed once"
    hints:
      nudge:
        uk: "Що побачить функція, яку ти передаси в `setTimeout`, — значення `draft` під час кліку чи пізніше? Згадай, у якому рендері її створено."
        en: "What will the function you pass to `setTimeout` see — the value of `draft` at the click or later? Remember in which render it was created."
      explanation:
        uk: "Таймер, запущений в обробнику, закривається над змінними рендеру, у якому стався клік, — як `setTimeout(() => console.log(\"left:\", left), 2000)` у передбаченні про бюджет. Тож досить у `handleSend` запустити таймер на 1000 мс, що виводить `draft`, і окремо очистити поле сетером з порожнім текстом. Порядок цих двох рядків коду не важливий: сетер не змінює `draft` у вже запущеному обробнику."
        en: "A timer started in a handler closes over the variables of the render in which the click happened — like `setTimeout(() => console.log(\"left:\", left), 2000)` in the budget prediction. So in `handleSend` it is enough to start a 1000 ms timer that prints `draft`, and separately clear the field with the setter and an empty text. The order of these two lines of code does not matter: the setter does not change `draft` in a handler that is already running."
    solutionNote:
      uk: "Стрілкова функція в `setTimeout` створюється в обробнику кліку й тримає `draft` того рендеру. `setDraft(\"\")` замовляє новий рендер із порожнім полем, але не змінює `draft`, яку бачить таймер. Тож через секунду виводиться саме те, що було в полі під час кліку, хоч би що людина надрукувала потім."
      en: "The arrow function in `setTimeout` is created in the click handler and keeps the `draft` of that render. `setDraft(\"\")` orders a new render with an empty field but does not change the `draft` the timer sees. So a second later it prints exactly what was in the field at the click, whatever the person typed afterwards."
    feedback:
      - when: { test: "the field is empty right after the click" }
        message:
          uk: "Ця перевірка вводить текст, клацає «Надіслати» і чекає порожнє поле одразу після кліку. Поле показує `draft`, тож очищати треба стан — сетером, а не DOM. Якщо всі перевірки не пройшли разом, спершу виправ першу помилку в консолі."
          en: "This check types a text, clicks “Send” and expects an empty field right after the click. The field shows `draft`, so the state has to be cleared — with the setter, not through the DOM. If every check fails at once, fix the first error in the console first."
      - when: { test: "nothing is printed before one second has passed" }
        message:
          uk: "Ця перевірка чекає, що за пів секунди після кліку в консолі ще немає нового рядка, що починається з «Надіслано:». `setTimeout` приймає **функцію**: запис `setTimeout(console.log(…), 1000)` викликає `console.log` одразу, а не за секунду."
          en: "This check expects no new line starting with “Sent:” in the console half a second after the click. `setTimeout` takes a **function**: `setTimeout(console.log(…), 1000)` calls `console.log` at once, not a second later."
      - when: { test: "one second later the text from the moment of the click is printed once" }
        message:
          uk: "Ця перевірка вводить текст, клацає, одразу друкує в поле інший текст і через секунду чекає рівно один новий рядок: «Надіслано:» і текст із моменту кліку, через пробіл. Виводь значення `draft`, яке бачить обробник, — а не те, що лежить у полі, коли спрацює таймер."
          en: "This check types a text, clicks, immediately types another text into the field and a second later expects exactly one new line: “Sent:” and the text from the moment of the click, separated by a space. Print the value of `draft` the handler sees — not what is in the field when the timer fires."

  - id: to-project
    kind: transfer
    capstoneStep: RE-02
    body:
      uk: "У проєкті форма теж читатиме значення стану в обробнику. Коли щось у ньому діє не одразу — затримка, таймер, очікування — пам’ятай: воно бачить знімок рендеру, у якому почалося."
      en: "In your project the form will also read state values in a handler. When something there does not act at once — a delay, a timer, waiting — remember that it sees the snapshot of the render where it started."
