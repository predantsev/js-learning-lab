id: rn-03-06-debug-list-identity-keyboard
unit: RN-03
title:
  uk: "Налагодження: ідентичність рядків і клавіатура над полем"
  en: "Debug: list identity and keyboard overlap"
kind: local-task
minutes: 20
contentVersion: 1
purpose:
  uk: "Дві вади нативних CRUD-екранів трапляються найчастіше: правка «переїжджає» в інший рядок після видалення, а останнє поле форми ховається під клавіатуру. Першу можна відтворити й тут, у перегляді, — і полагодити з перевіркою. Другої в браузері немає зовсім: її відтворюють і лагодять на твоєму пристрої, записуючи, що саме видно."
  en: "Two defects of native CRUD screens are the most common: an edit “moves” to another row after a delete, and the last form field hides under the keyboard. The first can be reproduced right here, in the preview — and repaired with a check. The second does not exist in a browser at all: it is reproduced and repaired on your device, recording exactly what you see."
objectives:
  - uk: "Відтворити на своєму пристрої засіяний список, де правка після видалення стрибає в інший рядок, і форму, чиє останнє поле ховається під клавіатуру."
    en: "Reproduce on the declared target a seeded list where an edit jumps to another row after a delete, and a form whose last field hides under the keyboard."
  - uk: "Полагодити обидві вади й підтвердити на своєму пристрої, що стан рядка йде за своїм записом, а кожне поле лишається видимим під час введення."
    en: "Repair both and confirm on the declared target that row state follows its record and every field stays visible while typing."
prerequisites: [rn-03-05-touch-js-vs-ui]
subskills:
  - { family: N-04, skill: "virtualized lists/keys", depth: assess }
  - { family: N-02, skill: "keyboard avoidance", depth: assess }
glossary: []
selfCheck: [predict-after-delete, jumping-edit]

blocks:
  - id: reproduce-first
    kind: explanation
    title:
      uk: "Спершу відтворити, потім лагодити"
      en: "Reproduce first, repair second"
    body:
      uk: |
        Обидві вади з’являються лише за певних дій, тож лагодження починається з **точного рецепта**:

        - **правка, що стрибає**: почни перейменовувати одну справу, не зберігай, видали **іншу**, що стоїть вище, і подивись, що сталося з твоїм текстом і з назвами в полях;
        - **поле під клавіатурою**: торкнися **останнього** поля форми внизу екрана й подивись, чи бачиш, що вводиш, і чи можна натиснути «Зберегти», не ховаючи клавіатуру.

        Запиши, що бачиш, **до** правок. Потім одна причина — одна правка — та сама перевірка. Перша вада живе в коді React, тому її однаково видно в перегляді й на телефоні. Друга залежить від екранної клавіатури, якої в браузері немає.
      en: |
        Both defects appear only after particular actions, so repairing starts from an **exact recipe**:

        - **the jumping edit**: start renaming one task, do not save, remove **another** task above it, and look at what happened to your text and to the names in the fields;
        - **the field under the keyboard**: tap the **last** field of the form at the bottom of the screen and see whether you can see what you type and whether Save can be pressed without hiding the keyboard.

        Write down what you see **before** any edits. Then one cause — one edit — the same check. The first defect lives in React code, so it shows the same in the preview and on a phone. The second depends on the on-screen keyboard, which a browser does not have.

  - id: predict-after-delete
    kind: prediction
    runnable: false
    prompt:
      uk: "Список справ: «Полити квіти», «Здати книжки в бібліотеку», «Написати бабусі». Ключі — індекси, а кожен рядок тримає текст свого поля перейменування у власному `useState`, початково — назву справи. Нічого не вводячи, користувач видаляє «Полити квіти». Що тепер показують два поля?"
      en: "A task list: “Water the plants”, “Return library books”, “Write to grandma”. The keys are indexes, and every row keeps the text of its rename field in its own `useState`, initially the task's title. Without typing anything, the user removes “Water the plants”. What do the two fields show now?"
    answer:
      type: choice
      options:
        - id: shifted
          text:
            uk: "«Полити квіти» і «Здати книжки в бібліотеку» — видалена назва лишилася, а «Написати бабусі» зникла з полів"
            en: "“Water the plants” and “Return library books” — the removed title stayed, and “Write to grandma” disappeared from the fields"
        - id: correct
          text:
            uk: "«Здати книжки в бібліотеку» і «Написати бабусі»"
            en: "“Return library books” and “Write to grandma”"
          why:
            uk: "Так було б із ключами за `id`. З ключами-індексами React бачить ключі `0` і `1` знову й лишає ці рядки з їхнім старим станом; демонтується рядок з ключем `2`."
            en: "That is what keys by `id` would give. With index keys React sees keys `0` and `1` again and keeps those rows with their old state; the row with key `2` is the one unmounted."
        - id: empty
          text:
            uk: "Обидва поля порожні: після видалення рядки створюються заново"
            en: "Both fields are empty: after a delete the rows are created anew"
          why:
            uk: "React створює рядок заново лише для нового ключа. Тут нових ключів немає — один просто зник."
            en: "React creates a row anew only for a new key. There are no new keys here — one simply disappeared."
      correct: [shifted]
    explanation:
      uk: "Стан `useState(task.title)` береться лише при монтуванні. Рядки з ключами `0` і `1` не демонтувалися, тож тримають назви, з якими створилися: «Полити квіти» й «Здати книжки…». Демонтовано рядок `2` — разом із полем «Написати бабусі». Якщо зараз натиснути Enter у першому полі, справа «Здати книжки…» отримає назву видаленої."
      en: "The `useState(task.title)` state is taken only on mount. The rows with keys `0` and `1` were not unmounted, so they hold the titles they were created with: “Water the plants” and “Return library books…”. Row `2` was unmounted — along with the “Write to grandma” field. If you now press Enter in the first field, the task “Return library books” gets the removed task's title."

  - id: recall-debug-keys
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: symptom-of-index-keys
        from: re-01-08-debug-keys-side-effects
        prompt:
          uk: "У вебсписку бажань набраний у рядку текст після видалення іншого бажання опиняється в сусідньому рядку. З чого почати пошук причини?"
          en: "In a web wishlist, text typed into a row ends up in the neighbouring row after another wish is deleted. Where do you start looking for the cause?"
        answer:
          type: choice
          options:
            - id: key
              text:
                uk: "З атрибута `key` рядків: чи не індекс там замість `id`"
                en: "With the rows' `key`: whether it is the index instead of the `id`"
            - id: css
              text:
                uk: "Зі стилів: рядки, мабуть, накладаються"
                en: "With the styles: the rows probably overlap"
              why:
                uk: "Стилі не переносять введений текст між рядками. Текст живе в стані компонента, а стан прив’язаний до ключа."
                en: "Styles do not move typed text between rows. The text lives in component state, and state is tied to the key."
            - id: browser
              text:
                uk: "З браузера: він плутає поля після видалення"
                en: "With the browser: it mixes up fields after a delete"
              why:
                uk: "Браузер показує те, що вирішив React. Яке поле якому рядку дістанеться, визначає ключ."
                en: "The browser shows what React decided. Which field goes to which row is decided by the key."
          correct: [key]
        explanation:
          uk: "«Текст переїхав після видалення чи вставки» — класичний симптом ключа-індексу. У FlatList ключ дає `keyExtractor` (або типовий: `key`, потім `id`, потім індекс)."
          en: "“The text moved after a delete or an insert” is the classic symptom of an index key. In a FlatList the key comes from `keyExtractor` (or the default: `key`, then `id`, then the index)."

  - id: jumping-edit
    kind: exercise
    mode: debug
    runtime: concept-preview
    dir: jumping-edit
    entry: main.jsx
    editable: [TaskScreen.jsx]
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      rename: { uk: "Перейменувати", en: "Rename" }
      remove: { uk: "Видалити", en: "Remove" }
      extra: { uk: " листа", en: " a letter" }
    title:
      uk: "Правка, що стрибає після видалення"
      en: "An edit that jumps after a delete"
    instructions:
      uk: |
        Екран планувальника: кожну справу можна перейменувати прямо в полі (Enter зберігає) або видалити хрестиком. Користувачі скаржаться, що після видалення назви в полях «з’їжджають», а збережене перейменування потрапляє не тій справі.

        1. **Відтвори** на **Сторінці**: допиши щось у поле «Написати бабусі», не натискаючи Enter, і видали «Полити квіти». Подивись, де тепер твій текст і що показують інші поля.
        2. **Знайди причину** в `TaskScreen.jsx` і полагодь її, нічого не видаляючи з можливостей екрана.

        Перевірки щоразу монтують свіжий екран із чотирма справами, видаляють справу й дивляться, чи кожне поле показує свою справу. `tasksReducer.js` і `main.jsx` редагувати не можна.
      en: |
        A planner screen: every task can be renamed right in its field (Enter saves) or removed with the cross. Users complain that after a delete the names in the fields “slide”, and a saved rename lands on the wrong task.

        1. **Reproduce** it on the **Page**: add something to the “Write to grandma” field without pressing Enter, and remove “Water the plants”. See where your text is now and what the other fields show.
        2. **Find the cause** in `TaskScreen.jsx` and repair it without removing anything the screen can do.

        The checks mount a fresh screen with four tasks each time, remove a task and look at whether every field shows its own task. `tasksReducer.js` and `main.jsx` cannot be edited.
    limits:
      uk: "Перевірки працюють у перегляді react-native-web: правила ключів і стану тут ті самі, що на телефоні, бо їх задає React. Екранної клавіатури й нативної прокрутки тут немає — другу ваду цього уроку перевіряють лише на твоєму пристрої."
      en: "The checks run in the react-native-web preview: the rules of keys and state are the same here as on a phone, because React sets them. There is no on-screen keyboard and no native scrolling here — the lesson's second defect is checked only on your device."
    testTitles:
      "after a delete every field shows its own task":
        uk: "Після видалення кожне поле показує свою справу"
        en: "After a delete every field shows its own task"
      "a half-typed rename stays with its task after another task is deleted":
        uk: "Недописане перейменування лишається біля своєї справи, коли видаляють іншу"
        en: "A half-typed rename stays with its task after another task is deleted"
      "submitting a rename after a delete renames the same task":
        uk: "Enter після видалення перейменовує ту саму справу"
        en: "Submitting a rename after a delete renames the same task"
      "removing a task removes exactly that task":
        uk: "Видалення прибирає саме ту справу"
        en: "Removing a task removes exactly that task"
    hints:
      nudge:
        uk: "Дані в reducer правильні — перевір це: видалена справа з `tasks` справді зникає. Тоді чий стан показують поля? Від чого React вирішує, який рядок який?"
        en: "The data in the reducer is right — check it: the removed task really disappears from `tasks`. So whose state do the fields show? What does React use to decide which row is which?"
      explanation:
        uk: "Чернетка — стан `TaskRow`, і React зберігає його за ключем рядка. Якщо ключ — позиція, то після видалення чернетка лишається на позиції, а запис під нею вже інший. Ключ має описувати сам запис: наприклад, для списку покупок — номер товару (`(product) => product.sku`), а не його місце в списку."
        en: "The draft is `TaskRow` state, and React keeps it by the row's key. If the key is a position, after a delete the draft stays at the position while the record under it is a different one. The key must describe the record itself: for a shopping list, say, the product number (`(product) => product.sku`), not its place in the list."
    solutionNote:
      uk: "Вада була в `keyExtractor={(task, index) => String(index)}`. Із ключем `task.id` кожен `TaskRow` прив’язаний до своєї справи: видалення демонтує саме її рядок, а чернетки інших лишаються на місці. Так само працює FlatList без `keyExtractor` — типовий бере `item.id`. Випадковий ключ теж «прибирає» стрибки, але ціною всіх чернеток: кожен рендер створює рядки заново."
      en: "The defect was in `keyExtractor={(task, index) => String(index)}`. With the `task.id` key every `TaskRow` is tied to its task: a delete unmounts exactly its row, and the other drafts stay in place. A FlatList without `keyExtractor` works too — the default takes `item.id`. A random key also “removes” the jumps, but at the cost of every draft: each render creates the rows anew."
    feedback:
      - when: { test: "after a delete every field shows its own task" }
        message:
          uk: "Ця перевірка видаляє «Полити квіти» й очікує, що поле кожної з решти справ показує її власну назву. Якщо поля показують сусідні назви, стан рядків прив’язаний до позицій."
          en: "This check removes “Water the plants” and expects the field of each remaining task to show its own title. If the fields show the neighbours' titles, row state is tied to positions."
      - when: { test: "a half-typed rename stays with its task after another task is deleted" }
        message:
          uk: "Ця перевірка дописує « листа» в поле «Написати бабусі», видаляє «Полити квіти» й очікує дописаний текст у тому самому полі, а в полі «Записатися до стоматолога» — його назву. Якщо дописане зникло, рядки після видалення створюються заново."
          en: "This check adds “ a letter” to the “Write to grandma” field, removes “Water the plants” and expects the added text in the same field, and its own title in the “Book a dentist visit” field. If the added text disappeared, the rows are created anew after the delete."
      - when: { test: "removing a task removes exactly that task" }
        message:
          uk: "Ця перевірка видаляє «Здати книжки в бібліотеку» й очікує в полях саме решту трьох назв у тому самому порядку."
          en: "This check removes “Return library books” and expects exactly the other three titles in the fields, in the same order."

  - id: device-lab
    kind: local-task
    runtime: local-native
    title:
      uk: "Обидві вади на твоєму пристрої"
      en: "Both defects on your device"
    intro:
      uk: |
        Ти створиш окремий маленький проєкт Expo з засіяними вадами, відтвориш їх на своїй заявленій цілі (емулятор Android, симулятор iOS чи фізичний пристрій з RN-01), полагодиш і підтвердиш. Потрібен інтернет (для пакетів), облікові записи — ні.

        > [!warning]
        > Команди й поведінку тут описано за документацією **Expo SDK 57** і **React Native 0.86** (reactnative.dev, версія 0.86, жовтень 2026). Автори курсу **не запускали** їх: на машині, де писали урок, не було нативних інструментів. Тому тут немає прикладів виводу — вір тому, що бачиш у себе, і записуй це.

        Якщо в тебе немає працездатної нативної цілі (наприклад, ти позначив її в RN-01 як непідтримувану), познач це завдання як **невиконане** й переходь далі: наступні уроки від нього не залежать, а в журналі прогресу воно лишиться невиконаним.

        Вміст файла для кроку 2 — заміни ним весь `App.tsx` (копіюй точно, **з вадами**):

        **Крок 2 — `App.tsx`:**

        ```tsx
        // App.tsx: seeded defects for RN-03 — an index key and a form without keyboard avoidance.
        import { useState } from 'react';
        import { FlatList, Pressable, StyleSheet, Text, TextInput, View } from 'react-native';

        type Task = { id: string; title: string };

        const initialTasks: Task[] = [
          { id: 't-01', title: 'Полити квіти' },
          { id: 't-02', title: 'Здати книжки в бібліотеку' },
          { id: 't-03', title: 'Написати бабусі' },
          { id: 't-05', title: 'Записатися до стоматолога' },
        ];

        function TaskRow({ task, onRename, onRemove }: { task: Task; onRename: (title: string) => void; onRemove: () => void }) {
          const [draft, setDraft] = useState(task.title);
          return (
            <View style={styles.row}>
              <TextInput style={styles.input} value={draft} onChangeText={setDraft} onSubmitEditing={() => onRename(draft)} />
              <Pressable accessibilityRole="button" accessibilityLabel={`Видалити: ${task.title}`} style={styles.remove} onPress={onRemove}>
                <Text>✕</Text>
              </Pressable>
            </View>
          );
        }

        export default function App() {
          const [tasks, setTasks] = useState(initialTasks);
          const [title, setTitle] = useState('');
          const [note, setNote] = useState('');
          const [due, setDue] = useState('');

          function add() {
            setTasks([...tasks, { id: `t-new-${tasks.length + 1}`, title: title.trim() || 'Нова справа' }]);
            setTitle('');
            setNote('');
            setDue('');
          }

          return (
            <View style={styles.screen}>
              <FlatList
                style={styles.list}
                data={tasks}
                keyExtractor={(task, index) => String(index)}
                renderItem={({ item }) => (
                  <TaskRow
                    task={item}
                    onRename={(next) => setTasks(tasks.map((t) => (t.id === item.id ? { ...t, title: next } : t)))}
                    onRemove={() => setTasks(tasks.filter((t) => t.id !== item.id))}
                  />
                )}
              />
              <View style={styles.form}>
                <TextInput style={styles.input} placeholder="Нова справа" value={title} onChangeText={setTitle} />
                <TextInput style={styles.input} placeholder="Нотатка" value={note} onChangeText={setNote} />
                <TextInput style={styles.input} placeholder="Термін, РРРР-ММ-ДД" value={due} onChangeText={setDue} />
                <Pressable accessibilityRole="button" style={styles.save} onPress={add}>
                  <Text style={styles.saveText}>Додати</Text>
                </Pressable>
              </View>
            </View>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, paddingTop: 56, backgroundColor: '#ffffff' },
          list: { flex: 1 },
          row: { flexDirection: 'row', alignItems: 'center', gap: 8, paddingHorizontal: 16, paddingVertical: 6 },
          input: { flex: 1, minHeight: 48, borderWidth: 1, borderColor: '#4b5563', borderRadius: 6, paddingHorizontal: 8, marginVertical: 4 },
          remove: { minWidth: 48, minHeight: 48, alignItems: 'center', justifyContent: 'center' },
          form: { padding: 16, borderTopWidth: 1, borderColor: '#d1d5db' },
          save: { minHeight: 48, alignItems: 'center', justifyContent: 'center', backgroundColor: '#1d4ed8', borderRadius: 6 },
          saveText: { color: '#ffffff', fontWeight: '600' },
        });
        ```
      en: |
        You will create a separate small Expo project with seeded defects, reproduce them on your declared target (an Android emulator, an iOS simulator or a physical device from RN-01), repair them and confirm. Internet access is needed (for the packages), accounts are not.

        > [!warning]
        > The commands and behavior here are described from the documentation of **Expo SDK 57** and **React Native 0.86** (reactnative.dev, version 0.86, October 2026). The course authors **did not run** them: the machine this lesson was written on had no native tooling. That is why there is no sample output here — trust what you see on your machine, and write it down.

        If you have no working native target (for example, you marked it unsupported in RN-01), mark this task **not performed** and move on: the next lessons do not depend on it, and it stays recorded as not performed in your progress.

        File content for step 2 — replace the whole `App.tsx` with it (copy it exactly, **with its defects**):

        **Step 2 — `App.tsx`:**

        ```tsx
        // App.tsx: seeded defects for RN-03 — an index key and a form without keyboard avoidance.
        import { useState } from 'react';
        import { FlatList, Pressable, StyleSheet, Text, TextInput, View } from 'react-native';

        type Task = { id: string; title: string };

        const initialTasks: Task[] = [
          { id: 't-01', title: 'Water the plants' },
          { id: 't-02', title: 'Return library books' },
          { id: 't-03', title: 'Write to grandma' },
          { id: 't-05', title: 'Book a dentist visit' },
        ];

        function TaskRow({ task, onRename, onRemove }: { task: Task; onRename: (title: string) => void; onRemove: () => void }) {
          const [draft, setDraft] = useState(task.title);
          return (
            <View style={styles.row}>
              <TextInput style={styles.input} value={draft} onChangeText={setDraft} onSubmitEditing={() => onRename(draft)} />
              <Pressable accessibilityRole="button" accessibilityLabel={`Remove ${task.title}`} style={styles.remove} onPress={onRemove}>
                <Text>✕</Text>
              </Pressable>
            </View>
          );
        }

        export default function App() {
          const [tasks, setTasks] = useState(initialTasks);
          const [title, setTitle] = useState('');
          const [note, setNote] = useState('');
          const [due, setDue] = useState('');

          function add() {
            setTasks([...tasks, { id: `t-new-${tasks.length + 1}`, title: title.trim() || 'New task' }]);
            setTitle('');
            setNote('');
            setDue('');
          }

          return (
            <View style={styles.screen}>
              <FlatList
                style={styles.list}
                data={tasks}
                keyExtractor={(task, index) => String(index)}
                renderItem={({ item }) => (
                  <TaskRow
                    task={item}
                    onRename={(next) => setTasks(tasks.map((t) => (t.id === item.id ? { ...t, title: next } : t)))}
                    onRemove={() => setTasks(tasks.filter((t) => t.id !== item.id))}
                  />
                )}
              />
              <View style={styles.form}>
                <TextInput style={styles.input} placeholder="New task" value={title} onChangeText={setTitle} />
                <TextInput style={styles.input} placeholder="Note" value={note} onChangeText={setNote} />
                <TextInput style={styles.input} placeholder="Due date, YYYY-MM-DD" value={due} onChangeText={setDue} />
                <Pressable accessibilityRole="button" style={styles.save} onPress={add}>
                  <Text style={styles.saveText}>Add</Text>
                </Pressable>
              </View>
            </View>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, paddingTop: 56, backgroundColor: '#ffffff' },
          list: { flex: 1 },
          row: { flexDirection: 'row', alignItems: 'center', gap: 8, paddingHorizontal: 16, paddingVertical: 6 },
          input: { flex: 1, minHeight: 48, borderWidth: 1, borderColor: '#4b5563', borderRadius: 6, paddingHorizontal: 8, marginVertical: 4 },
          remove: { minWidth: 48, minHeight: 48, alignItems: 'center', justifyContent: 'center' },
          form: { padding: 16, borderTopWidth: 1, borderColor: '#d1d5db' },
          save: { minHeight: 48, alignItems: 'center', justifyContent: 'center', backgroundColor: '#1d4ed8', borderRadius: 6 },
          saveText: { color: '#ffffff', fontWeight: '600' },
        });
        ```
    tools:
      - name: "Node.js"
        version: { uk: "22.13 або новіший", en: "22.13 or newer" }
        note:
          uk: "Мінімум для Expo SDK 57 за таблицею версій Expo."
          en: "The minimum for Expo SDK 57 according to the Expo version table."
      - name: "Expo SDK"
        version: "57 (React Native 0.86)"
        note:
          uk: "Шаблон `create-expo-app` ставить поточну версію; якщо в `package.json` новіша, команди ті самі, а поведінку звір із документацією своєї версії."
          en: "The `create-expo-app` template installs the current version; if `package.json` shows a newer one, the commands are the same, but compare behavior with the documentation of your version."
      - name: { uk: "Заявлена ціль", en: "Declared target" }
        note:
          uk: "Емулятор Android, симулятор iOS (лише macOS) чи фізичний пристрій, налаштований у RN-01."
          en: "An Android emulator, an iOS simulator (macOS only) or a physical device, set up in RN-01."
    steps:
      - text:
          uk: "Створи проєкт у теці курсу й перейди в нього. Шаблон `blank-typescript` — без навігації, з TypeScript."
          en: "Create the project in your course folder and change into it. The `blank-typescript` template has no navigation and has TypeScript."
        command: "npx create-expo-app@latest rn-03-debug --template blank-typescript"
        expect:
          uk: "З’явилася тека `rn-03-debug` з `App.tsx` і `package.json`; у `package.json` залежність `expo` версії 57 або новішої."
          en: "A `rn-03-debug` folder appeared with `App.tsx` and `package.json`; `package.json` lists the `expo` dependency at version 57 or newer."
      - text:
          uk: "Заміни весь вміст `App.tsx` файлом із кроку 2 угорі й зафіксуй початковий стан, щоб `git diff` потім показав рівно твої правки. Якщо шаблон не створив репозиторій, спершу виконай `git init`."
          en: "Replace the whole content of `App.tsx` with the step 2 file above and commit the starting state, so that `git diff` later shows exactly your repairs. If the template did not create a repository, run `git init` first."
        command: "git add -A && git commit -m \"Start from the seeded RN-03 defects\""
        expect:
          uk: "Commit створено; `git status` показує чисте робоче дерево."
          en: "The commit is created; `git status` shows a clean working tree."
      - text:
          uk: "Запусти dev-сервер і відкрий застосунок на своїй цілі так само, як у RN-01: у терміналі Expo клавіша `a` відкриває ціль Android, `i` — симулятор iOS, а фізичний пристрій підключається так, як ти налаштував його в RN-01."
          en: "Start the dev server and open the app on your target the same way as in RN-01: in the Expo terminal the `a` key opens the Android target, `i` the iOS simulator, and a physical device connects the way you set it up in RN-01."
        command: "npx expo start"
        expect:
          uk: "На цілі видно чотири справи з полями й хрестиками, а внизу форму з трьома полями й кнопкою «Додати»."
          en: "The target shows four tasks with fields and crosses, and at the bottom a form with three fields and an Add button."
      - text:
          uk: "Відтвори першу ваду: допиши щось у поле «Написати бабусі», не натискаючи клавішу повернення, і видали «Полити квіти». Запиши, де тепер твій текст і що показують інші поля."
          en: "Reproduce the first defect: add something to the “Write to grandma” field without pressing return, and remove “Water the plants”. Write down where your text is now and what the other fields show."
        expect:
          uk: "Найімовірніше, усе як у перегляді: у першому полі досі «Полити квіти», поле «Записатися до стоматолога» зникло, а дописаний текст лишився в третьому рядку, який тепер належить іншій справі. Запиши, що бачиш насправді."
          en: "Most likely it is as in the preview: the first field still says “Water the plants”, the “Book a dentist visit” field disappeared, and the added text stayed in the third row, which now belongs to another task. Write down what you actually see."
      - text:
          uk: "Відтвори другу ваду: торкнися поля «Термін, РРРР-ММ-ДД» унизу. Запиши, чи видно поле й текст, що вводиш, і чи можна натиснути «Додати», поки клавіатура відкрита. На iOS поле зазвичай опиняється під клавіатурою; на Android це залежить від того, як вікно реагує на клавіатуру, тож поле може й лишитися видимим — тоді запиши саме це."
          en: "Reproduce the second defect: tap the “Due date, YYYY-MM-DD” field at the bottom. Write down whether the field and the text you type are visible and whether Add can be pressed while the keyboard is open. On iOS the field usually ends up under the keyboard; on Android it depends on how the window reacts to the keyboard, so the field may stay visible — then write down exactly that."
        expect:
          uk: "У тебе є записані спостереження для обох вад, зроблені до будь-яких правок."
          en: "You have written observations for both defects, made before any edits."
      - text:
          uk: "Полагодь першу ваду так само, як у вправі цього уроку, збережи файл і повтори рецепт першої вади на цілі. Застосунок оновлюється сам; якщо ні — натисни `r` у терміналі Expo."
          en: "Repair the first defect the same way as in this lesson's exercise, save the file and repeat the first defect's recipe on the target. The app updates by itself; if not, press `r` in the Expo terminal."
        expect:
          uk: "Після видалення кожне поле показує свою справу, а дописаний текст лишився біля «Написати бабусі»."
          en: "After the delete every field shows its own task, and the added text stayed next to “Write to grandma”."
      - text:
          uk: "Полагодь другу ваду: обгорни екран у `KeyboardAvoidingView` з `behavior`, зроби форму вмістом, що прокручується, і закривай клавіатуру після «Додати». Не клади весь `FlatList` у `ScrollView` того самого напрямку: тоді список отримує всю висоту вмісту й монтує всі рядки, тобто втрачає вікно. Натомість дай формі власний `ScrollView` з `keyboardShouldPersistTaps=\"handled\"` або перенеси її в `ListFooterComponent` самого `FlatList` і постав `keyboardShouldPersistTaps=\"handled\"` на `FlatList` — він приймає пропси `ScrollView`. Яке значення `behavior` працює на твоїй платформі, перевір і запиши. Повтори рецепт другої вади."
          en: "Repair the second defect: wrap the screen in a `KeyboardAvoidingView` with a `behavior`, make the form scrolling content, and close the keyboard after Add. Do not put the whole `FlatList` inside a `ScrollView` of the same direction: the list then gets the full content height and mounts every row, losing its window. Instead give the form its own `ScrollView` with `keyboardShouldPersistTaps=\"handled\"`, or move it into the `FlatList`'s own `ListFooterComponent` and set `keyboardShouldPersistTaps=\"handled\"` on the `FlatList` — it accepts `ScrollView` props. Check and write down which `behavior` value works on your platform. Repeat the second defect's recipe."
        expect:
          uk: "Поле терміну й кнопку «Додати» видно над клавіатурою, «Додати» спрацьовує з першого дотику, а після нього клавіатура ховається."
          en: "The date field and the Add button are visible above the keyboard, Add works on the first tap, and the keyboard hides after it."
      - text:
          uk: "Подивись свої правки й зафіксуй їх."
          en: "Review your repairs and commit them."
        command: "git diff && git commit -am \"Fix row keys and keyboard avoidance\""
        expect:
          uk: "`git diff` показує лише зміни в `App.tsx`: ключ рядка й обгортки для клавіатури."
          en: "`git diff` shows only changes in `App.tsx`: the row key and the keyboard wrappers."
    verify:
      - id: target-recorded
        text:
          uk: "Я записав свою ціль (тип, версію ОС) і версію `expo` з `package.json`."
          en: "I recorded my target (type, OS version) and the `expo` version from `package.json`."
      - id: both-reproduced
        text:
          uk: "Я відтворив обидві вади на цілі й записав, що бачив, до будь-яких правок (або записав, що поле лишалося видимим)."
          en: "I reproduced both defects on the target and wrote down what I saw before any edits (or wrote down that the field stayed visible)."
      - id: keys-fixed
        text:
          uk: "Після правки на цілі кожне поле показує свою справу після видалення, а дописаний текст лишається біля своєї справи."
          en: "After the repair, on the target every field shows its own task after a delete, and added text stays next to its task."
      - id: keyboard-fixed
        text:
          uk: "Після правки на цілі останнє поле й кнопку «Додати» видно під час введення, «Додати» спрацьовує з першого дотику, а клавіатура ховається після нього."
          en: "After the repair, on the target the last field and the Add button are visible while typing, Add works on the first tap, and the keyboard hides after it."
    troubleshooting:
      - problem:
          uk: "У тебе немає нативної цілі або її не вдається запустити."
          en: "You have no native target, or it does not start."
        fix:
          uk: "Познач завдання як невиконане й переходь до наступного уроку: вправа в перегляді вже перевірила першу ваду. Повернися сюди, коли налаштуєш ціль за RN-01."
          en: "Mark the task not performed and go on to the next lesson: the preview exercise has already checked the first defect. Come back here once you have set up a target following RN-01."
      - problem:
          uk: "Після збереження файла застосунок на цілі не змінився."
          en: "After saving the file the app on the target did not change."
        fix:
          uk: "Натисни `r` у терміналі, де працює `npx expo start`: за документацією Expo це перезавантажує застосунок на підключених пристроях."
          en: "Press `r` in the terminal where `npx expo start` runs: according to the Expo documentation this reloads the app on connected devices."
    recovery:
      uk: "Перший commit «Start from the seeded RN-03 defects» — твоя точка повернення: `git diff` показує все, що ти змінив відтоді, а `git restore App.tsx` повертає засіяний файл, якщо хочеш почати лагодити заново."
      en: "The first commit, “Start from the seeded RN-03 defects”, is your return point: `git diff` shows everything you changed since, and `git restore App.tsx` brings back the seeded file if you want to start repairing again."

  - id: to-project
    kind: transfer
    capstoneStep: RN-03
    body:
      uk: "Нативний CRUD у твоєму проєкті `<проєкт>-native` будується на `FlatList` з ключем за `id` і на платформних адаптерах. Коли він запрацює, можеш пройти на ньому обидва рецепти цього уроку (крок їх не вимагає): видали запис, поки правиш інший, і торкнися останнього поля форми, — і запиши в `EVIDENCE.md`, що бачиш на своїй цілі."
      en: "The native CRUD in your project `<project>-native` is built on a `FlatList` keyed by `id` and on platform adapters. Once it works, you can run both of this lesson's recipes on it (the step does not require them): remove a record while editing another, and tap the last field of the form — and write down in `EVIDENCE.md` what you see on your target."
