id: rn-03-07-independent-native-crud
unit: RN-03
title:
  uk: "Самостійно: нативний CRUD на спільному домені"
  en: "Independent: native CRUD reusing the domain"
kind: assessment
minutes: 40
contentVersion: 1
purpose:
  uk: "Перевірка всього розділу на новому домені — синтетичному списку для читання. Спершу тут, на платформі, ти без підказок реалізуєш адаптери й сховище записів за контрактами, не чіпаючи доменний модуль, — це перевіряють автоматично. Потім на своєму пристрої збираєш нативний CRUD-екран на тих самих контрактах: віртуалізований список із ключами, нативні адаптери й зони дотику потрібного розміру. Цю частину підтверджуєш ти сам."
  en: "A check of the whole unit on a new domain — a synthetic reading list. First, here on the platform, you implement the adapters and a record repository against the contracts without hints and without touching the domain module — this is checked automatically. Then on your device you build a native CRUD screen on the same contracts: a virtualized list with keys, native adapters and touch targets of the right size. You confirm that part yourself."
objectives:
  - uk: "Без підказок побудувати нативний CRUD для синтетичного домену, що імпортує свій чистий доменний модуль без змін, отримує сховище й форматування через адаптери й відповідає мінімумам зони дотику на твоїй цілі."
    en: "Build, without hints, native CRUD for a synthetic domain that imports its pure domain module unchanged, injects storage and formatting through adapters and meets touch-target minimums on the declared target."
prerequisites: [rn-03-06-debug-list-identity-keyboard]
subskills:
  - { family: N-01, skill: "TS/domain reuse", depth: assess }
  - { family: N-01, skill: "platform adapters", depth: assess }
  - { family: N-02, skill: "touch targets", depth: assess }
glossary: []
selfCheck: [reading-adapters]

blocks:
  - id: the-domain
    kind: explanation
    title:
      uk: "Список для читання"
      en: "A reading list"
    body:
      uk: |
        Новий синтетичний домен — книжки, які читаєш. Запис:

        ```ts
        { id: string; title: string; pagesTotal: number; pagesRead: number; finishedOn: 'YYYY-MM-DD' | null }
        ```

        Доменний модуль `readingList.js` уже готовий і **спільний** для вебу й native: `validateBook(input)` (повертає `{ ok, value }` або `{ ok: false, errors }`), `markFinished(book, today)` і `summarizeBooks(books)`. Він не знає ні про сховище, ні про мову, ні про сьогоднішню дату — усе це приходить ззовні.

        Обидві частини перевірки спираються на ті самі контракти з `contracts.ts`: сховище, формат прогресу, годинник і сховище записів (repository) — об’єкт, що зберігає книжки через адаптер сховища й змінює їх лише доменними функціями.
      en: |
        A new synthetic domain — the books you are reading. A record:

        ```ts
        { id: string; title: string; pagesTotal: number; pagesRead: number; finishedOn: 'YYYY-MM-DD' | null }
        ```

        The domain module `readingList.js` is ready and **shared** by web and native: `validateBook(input)` (returns `{ ok, value }` or `{ ok: false, errors }`), `markFinished(book, today)` and `summarizeBooks(books)`. It knows nothing about storage, language or today's date — all of that comes from outside.

        Both parts of the check rest on the same contracts in `contracts.ts`: storage, a progress format, a clock and a record repository — an object that keeps the books through the storage adapter and changes them only with domain functions.

  - id: recall-adapters
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: factory-closure-store
        from: js-11-09-independent-adapters
        prompt:
          uk: "Фабрика сховища «ключ — значення» отримує об’єкт `storage` з методами `load()` і `save(data)`. Чому вона не повинна тримати власну копію записів, а щоразу питати `storage`?"
          en: "A key-value store factory receives a `storage` object with `load()` and `save(data)` methods. Why must it not keep its own copy of the records, and ask `storage` every time instead?"
        answer:
          type: choice
          options:
            - id: single-source
              text:
                uk: "Бо тоді `storage` — єдине джерело правди: інший об’єкт на тому самому сховищі бачить ті самі дані"
                en: "Because then `storage` is the single source of truth: another object on the same storage sees the same data"
            - id: speed
              text:
                uk: "Бо власна копія завжди повільніша за сховище"
                en: "Because an own copy is always slower than the storage"
              why:
                uk: "Копія в пам’яті якраз швидша. Проблема в іншому: вона розходиться з тим, що лежить у сховищі."
                en: "A copy in memory is actually faster. The problem is different: it drifts away from what is in the storage."
            - id: private
              text:
                uk: "Бо в фабриці не можна мати приватних змінних"
                en: "Because a factory cannot have private variables"
              why:
                uk: "Можна — через замикання. Але приватна копія даних тут шкодить, бо сховище перестає бути джерелом правди."
                en: "It can — through a closure. But a private copy of the data hurts here, because the storage stops being the source of truth."
          correct: [single-source]
        explanation:
          uk: "Делегування сховищу робить об’єкт тонкою обгорткою: що б не лежало під ним — `localStorage`, нативний модуль чи подвійник у пам’яті, — дані одні. Те саме вимагає й сховище записів у цій перевірці."
          en: "Delegating to the storage makes the object a thin wrapper: whatever lies beneath — `localStorage`, a native module or an in-memory double — the data is the same. The record repository in this check requires the same."

  - id: reading-adapters
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: reading-adapters
    entry: index.js
    editable: [adapters.ts]
    strings:
      poems: { uk: "Збірка віршів", en: "A poetry collection" }
      guide: { uk: "Посібник з JavaScript", en: "A JavaScript guide" }
      novel: { uk: "Детективний роман", en: "A detective novel" }
      locale: { uk: "uk-UA", en: "en-US" }
    title:
      uk: "Адаптери й сховище записів для списку читання"
      en: "Adapters and a repository for the reading list"
    instructions:
      uk: |
        Реалізуй у `adapters.ts` чотири експорти за контрактами з `contracts.ts`. `readingList.js`, `contracts.ts` і `index.js` редагувати не можна; жодного імпорту платформи. Підказок немає.

        **`createMemoryStorage()`** — `StorageAdapter` у пам’яті: усі три методи повертають `Promise`; незаписаний ключ (зокрема `"toString"`) дає `null`; `removeItem` прибирає значення; кожне сховище окреме; `localStorage` браузера не змінюється.

        **`createProgressFormat(locale)`** — `progress(pagesRead, pagesTotal)` повертає частку прочитаного цілими відсотками через `Intl.NumberFormat` для **переданої** мови: для `en-US` і `30` з `120` — `25%`.

        **`createFixedClock(date)`** — годинник, чий `today()` завжди повертає `date`.

        **`createReadingRepository({ storage, clock })`** — сховище записів:

        - `load()` — книжки з `storage` за ключем `jsll.reading.v1`, або `[]`, якщо там нічого немає;
        - `add(input)` — перевіряє `input` функцією `validateBook`; якщо `ok`, додає `value` в кінець і повертає `{ ok: true }`, інакше нічого не зберігає й повертає `{ ok: false, errors }` з доменного модуля;
        - `finish(id)` — замінює книжку на `markFinished(book, clock.today())`;
        - у `storage` під `jsll.reading.v1` лежить JSON `{ "schemaVersion": 1, "records": [...] }`, і друге сховище записів на тому самому `storage` бачить ті самі книжки — тобто власної копії записів немає.

        Демо в `index.js` додає книжку, завершує її й друкує результат.
      en: |
        Implement four exports in `adapters.ts` following the contracts in `contracts.ts`. `readingList.js`, `contracts.ts` and `index.js` cannot be edited; no platform import. There are no hints.

        **`createMemoryStorage()`** — an in-memory `StorageAdapter`: all three methods return a `Promise`; a key that was never set (`"toString"` included) gives `null`; `removeItem` removes the value; every store is separate; the browser's `localStorage` does not change.

        **`createProgressFormat(locale)`** — `progress(pagesRead, pagesTotal)` returns the share read as a whole percent through `Intl.NumberFormat` for the **given** locale: for `en-US` and `30` of `120`, `25%`.

        **`createFixedClock(date)`** — a clock whose `today()` always returns `date`.

        **`createReadingRepository({ storage, clock })`** — a record repository:

        - `load()` — the books from `storage` under the key `jsll.reading.v1`, or `[]` when nothing is there;
        - `add(input)` — checks `input` with `validateBook`; if `ok`, appends `value` at the end and returns `{ ok: true }`, otherwise stores nothing and returns `{ ok: false, errors }` from the domain module;
        - `finish(id)` — replaces the book with `markFinished(book, clock.today())`;
        - in `storage` under `jsll.reading.v1` lies the JSON `{ "schemaVersion": 1, "records": [...] }`, and a second repository on the same `storage` sees the same books — that is, there is no own copy of the records.

        The demo in `index.js` adds a book, finishes it and prints the result.
    testTitles:
      "the memory storage follows the storage contract":
        uk: "Сховище в пам’яті виконує контракт сховища"
        en: "The memory storage follows the storage contract"
      "two memory storages do not share values":
        uk: "Два сховища в пам’яті не бачать значень одне одного"
        en: "Two memory storages do not share values"
      "the memory storage leaves localStorage untouched":
        uk: "Сховище в пам’яті не змінює `localStorage`"
        en: "The memory storage leaves `localStorage` untouched"
      "progress is a whole percent for the given locale":
        uk: "`progress` — цілі відсотки для переданої мови"
        en: "`progress` is a whole percent for the given locale"
      "the fixed clock returns its date":
        uk: "Фіксований годинник повертає свою дату"
        en: "The fixed clock returns its date"
      "add stores the book validated by the domain module":
        uk: "`add` зберігає книжку, перевірену доменним модулем"
        en: "`add` stores the book validated by the domain module"
      "an invalid book is refused with the domain errors and not stored":
        uk: "Некоректну книжку відхилено з помилками домену й не збережено"
        en: "An invalid book is refused with the domain errors and not stored"
      "finish uses the date from the clock adapter":
        uk: "`finish` бере дату з адаптера годинника"
        en: "`finish` uses the date from the clock adapter"
      "the books live in the given storage as a versioned envelope":
        uk: "Книжки лежать у переданому сховищі у версійованій обгортці"
        en: "The books live in the given storage as a versioned envelope"
    solutionNote:
      uk: "Кожна частина залежить лише від контракту: сховище записів не знає, що під ним `Map`, а домен не знає ні про сховище, ні про дату. Тому той самий `createReadingRepository` працюватиме на телефоні з нативним адаптером сховища й справжнім годинником, а в тестах — з подвійниками. `Intl.NumberFormat` зі `style: 'percent'` очікує частку (`0.25`), а не відсотки (`25`)."
      en: "Every part depends only on a contract: the repository does not know there is a `Map` beneath it, and the domain knows neither about storage nor about the date. That is why the same `createReadingRepository` will work on a phone with a native storage adapter and a real clock, and in tests with doubles. `Intl.NumberFormat` with `style: 'percent'` expects a fraction (`0.25`), not percent (`25`)."
    feedback:
      - when: { test: "the memory storage follows the storage contract" }
        message:
          uk: "Ця перевірка очікує `Promise` з `getItem`, `null` для незаписаного ключа й для `\"toString\"`, той самий текст після `setItem` і `null` після `removeItem`."
          en: "This check expects a `Promise` from `getItem`, `null` for a key never set and for `\"toString\"`, the same text after `setItem` and `null` after `removeItem`."
      - when: { test: "two memory storages do not share values" }
        message:
          uk: "Ця перевірка записує значення в одне сховище й очікує `null` у другому."
          en: "This check writes a value into one store and expects `null` in the other."
      - when: { test: "the memory storage leaves localStorage untouched" }
        message:
          uk: "Ця перевірка очікує, що після `setItem` у `localStorage` немає жодного ключа."
          en: "This check expects no key in `localStorage` after `setItem`."
      - when: { test: "progress is a whole percent for the given locale" }
        message:
          uk: "Ця перевірка порівнює `progress` для `en-US` і `de-DE` з `Intl.NumberFormat` цієї мови зі стилем відсотків без дробової частини. Стиль відсотків множить на 100 сам."
          en: "This check compares `progress` for `en-US` and `de-DE` with that locale's `Intl.NumberFormat` in the percent style without fraction digits. The percent style multiplies by 100 itself."
      - when: { test: "finish uses the date from the clock adapter" }
        message:
          uk: "Ця перевірка створює сховище записів із годинником на `2026-03-01` і очікує після `finish` саме цю дату й усі сторінки прочитаними, а друга книжка лишається без змін."
          en: "This check creates a repository with a clock set to `2026-03-01` and expects exactly that date after `finish`, all pages read, and the second book unchanged."
      - when: { test: "the books live in the given storage as a versioned envelope" }
        message:
          uk: "Ця перевірка читає `jsll.reading.v1` прямо з переданого `storage` і очікує `{ schemaVersion: 1, records: [...] }`, а потім створює друге сховище записів на тому самому `storage` й очікує в ньому ту саму книжку."
          en: "This check reads `jsll.reading.v1` straight from the given `storage` and expects `{ schemaVersion: 1, records: [...] }`, then creates a second repository on the same `storage` and expects the same book in it."

  - id: native-reading-crud
    kind: local-task
    runtime: local-native
    title:
      uk: "Нативний CRUD списку читання на твоїй цілі"
      en: "Native reading-list CRUD on your target"
    intro:
      uk: |
        Друга частина — без підказок, на твоїй заявленій цілі. Побудуй у новому проєкті Expo екран списку читання, що спирається на ті самі контракти й **той самий** `readingList.js`, що й вправа вище. Створи проєкт так само, як у попередньому уроці (`npx create-expo-app@latest rn-03-reading --template blank-typescript`), скопіюй у нього `readingList.js` і `contracts.ts` з вправи **без змін** і свій `adapters.ts`.

        **Що має вийти:**

        - список книжок — `FlatList` з ключем за `id`; кожен рядок показує назву й прогрес через твій `ProgressFormat`;
        - створення (назва й кількість сторінок; помилки з `validateBook` показано під полями), редагування назви, «прочитано» через `finish` і видалення; для редагування й видалення доповни сховище записів власними методами, що теж користуються лише доменом і адаптером сховища;
        - **нативний** адаптер сховища за контрактом `StorageAdapter` поверх модуля «ключ — значення» для React Native — наприклад, пакета `@react-native-async-storage/async-storage`, встановленого через `npx expo install` (детальніше сховище розбиратимеш у RN-05); справжній годинник, що повертає сьогоднішню дату `YYYY-MM-DD`;
        - кожна кнопка — щонайменше 44 × 44 pt (iOS) чи 48 × 48 dp (Android) за видимим розміром або разом із `hitSlop`;
        - `readingList.js` і `contracts.ts` не змінено: `git diff` по них порожній.

        > [!warning]
        > Цю частину описано за документацією **Expo SDK 57** (React Native 0.86) і **React Native 0.87**; автори курсу її не запускали, бо на машині, де писали урок, не було нативних інструментів. Якщо нативної цілі в тебе немає, познач завдання як **невиконане**: наступні уроки від нього не залежать, а частина на платформі вище вже перевірила адаптери.
      en: |
        The second part — without hints, on your declared target. In a new Expo project build a reading-list screen that rests on the same contracts and **the same** `readingList.js` as the exercise above. Create the project the same way as in the previous lesson (`npx create-expo-app@latest rn-03-reading --template blank-typescript`), copy `readingList.js` and `contracts.ts` from the exercise into it **unchanged**, plus your `adapters.ts`.

        **What it must do:**

        - the book list is a `FlatList` keyed by `id`; every row shows the title and the progress through your `ProgressFormat`;
        - create (title and page count; errors from `validateBook` shown under the fields), edit the title, “finished” through `finish`, and delete; for editing and deleting, extend the repository with your own methods that also use only the domain and the storage adapter;
        - a **native** storage adapter following the `StorageAdapter` contract on top of a key-value module for React Native — for example the `@react-native-async-storage/async-storage` package installed with `npx expo install` (you will study storage in depth in RN-05); a real clock that returns today's date as `YYYY-MM-DD`;
        - every button is at least 44 × 44 pt (iOS) or 48 × 48 dp (Android) by its visible size or together with `hitSlop`;
        - `readingList.js` and `contracts.ts` are unchanged: `git diff` on them is empty.

        > [!warning]
        > This part is described from the documentation of **Expo SDK 57** (React Native 0.86) and **React Native 0.87**; the course authors did not run it, because the machine this lesson was written on had no native tooling. If you have no native target, mark the task **not performed**: the next lessons do not depend on it, and the platform part above has already checked the adapters.
    tools:
      - name: "Node.js"
        version: "22.13 or newer"
        note:
          uk: "Мінімум для Expo SDK 57 за таблицею версій Expo."
          en: "The minimum for Expo SDK 57 according to the Expo version table."
      - name: "Expo SDK"
        version: "57 (React Native 0.86)"
        note:
          uk: "`npx expo install` добирає версії пакетів, сумісні з React Native твого проєкту."
          en: "`npx expo install` picks package versions compatible with your project's React Native."
      - name: "Declared target"
        note:
          uk: "Емулятор Android, симулятор iOS (лише macOS) чи фізичний пристрій з RN-01."
          en: "An Android emulator, an iOS simulator (macOS only) or a physical device from RN-01."
    steps:
      - text:
          uk: "Збери екран за вимогами вище й запусти його на своїй цілі через `npx expo start`."
          en: "Build the screen to the requirements above and run it on your target with `npx expo start`."
        expect:
          uk: "Список, форма й кнопки працюють на цілі."
          en: "The list, the form and the buttons work on the target."
      - text:
          uk: "Додай три книжки, перейменуй одну, познач іншу прочитаною, видали третю. Закрий застосунок повністю й відкрий знову."
          en: "Add three books, rename one, mark another finished, delete the third. Close the app completely and open it again."
        expect:
          uk: "Після перезапуску видно ті самі дві книжки з тими самими назвами, прогресом і датою завершення — дані прийшли з нативного сховища."
          en: "After the restart the same two books show with the same titles, progress and finish date — the data came from the native storage."
      - text:
          uk: "Переконайся, що домен і контракти не змінено."
          en: "Make sure the domain and the contracts are unchanged."
        command: "git diff --stat -- readingList.js contracts.ts"
        expect:
          uk: "Команда нічого не виводить."
          en: "The command prints nothing."
    verify:
      - id: crud-on-target
        text:
          uk: "На своїй цілі я створив, перейменував, позначив прочитаною й видалив книжку, і після перезапуску застосунку дані лишилися."
          en: "On my target I created, renamed, marked finished and deleted a book, and the data survived an app restart."
      - id: keyed-list
        text:
          uk: "Список — `FlatList` з ключем за `id`, і після видалення кожен рядок показує свою книжку."
          en: "The list is a `FlatList` keyed by `id`, and after a delete every row shows its own book."
      - id: touch-targets
        text:
          uk: "Кожна кнопка має зону дотику щонайменше 44 × 44 pt чи 48 × 48 dp, і я влучаю в неї з першого разу."
          en: "Every button has a touch target of at least 44 × 44 pt or 48 × 48 dp, and I hit it on the first try."
      - id: domain-unchanged
        text:
          uk: "`git diff` по `readingList.js` і `contracts.ts` порожній, а нативні адаптери живуть в окремих файлах."
          en: "`git diff` on `readingList.js` and `contracts.ts` is empty, and the native adapters live in separate files."
    troubleshooting:
      - problem:
          uk: "У тебе немає нативної цілі або її не вдається запустити."
          en: "You have no native target, or it does not start."
        fix:
          uk: "Познач завдання як невиконане й переходь далі. Повернися сюди, коли налаштуєш ціль за RN-01."
          en: "Mark the task not performed and move on. Come back here once you have set up a target following RN-01."
    recovery:
      uk: "Роби commit після кожної працездатної частини (список, створення, редагування, видалення, адаптер сховища). Якщо щось зламалося, `git diff` покаже зміни відтоді, а `git restore <файл>` поверне останній працездатний стан файла."
      en: "Commit after every working part (the list, create, edit, delete, the storage adapter). If something breaks, `git diff` shows the changes since, and `git restore <file>` brings back the file's last working state."
