id: rn-03-01-state-hooks-reuse
unit: RN-03
title:
  uk: "Стан і hooks у нативному застосунку"
  en: "Reusing state and hooks natively"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Перевикористати reducer і data hook проєкту в нативному екрані без жодної правки й показати єдині рядки, що відрізняються: примітиви, які малює екран."
    en: "Reuse the capstone's typed reducer and data hook in a native screen without editing them, and point to the only lines that differ: the rendered primitives."
  - uk: "Простежити dispatch на native через render, commit і ефекти та передбачити, що правила знімка стану ті самі, що в React DOM."
    en: "Trace a dispatch through render, commit and effects on native and predict that the state-snapshot rules are the same as in React DOM."
prerequisites: [rn-02-09-capstone-native-screens, re-04-06-custom-hooks]
subskills:
  - { family: N-01, skill: "TS/domain reuse", depth: practice }
glossary: []
selfCheck: [predict-two-toggles, native-habits]

blocks:
  - id: same-react
    kind: explanation
    title:
      uk: "React той самий — інші лише примітиви"
      en: "The same React — only the primitives differ"
    body:
      uk: |
        React Native — це не окрема система стану. `useState`, `useReducer`, `useEffect`, [[custom-hook|власні hooks]] і правила рендеру приходять із **того самого пакета `react`**, що й у вебклієнті. Різниця одна: куди React робить commit. У вебі це вузли DOM, на телефоні — нативні view платформи.

        Тому з вебклієнта проєкту без змін переходять:

        - **reducer** — чиста функція `(state, action) => newState`;
        - **data hook** — `useReducer` плюс ефект, що зберігає дані, *якщо* сховище він отримує ззовні.

        Переписати доведеться лише розмітку: `<ul>`/`<li>` стають `View`, текст — `Text`, `<button onClick>` — `Pressable` з `onPress`. Подивись на рядки, що змінилися:

        ```jsx
        // web
        <li key={task.id}><span>{task.title}</span>
          <button onClick={() => dispatch({ type: 'toggle', id: task.id })}>…</button></li>
        // native
        <View key={task.id}><Text>{task.title}</Text>
          <Pressable onPress={() => dispatch({ type: 'toggle', id: task.id })}>…</Pressable></View>
        ```

        `dispatch({ type: 'toggle', id: task.id })` — без жодної зміни.
      en: |
        React Native is not a separate state system. `useState`, `useReducer`, `useEffect`, [[custom-hook|custom hooks]] and the rendering rules come from **the same `react` package** as in the web client. There is one difference: where React commits. On the web it is DOM nodes; on a phone, the platform's native views.

        So these move over from the project's web client unchanged:

        - the **reducer** — a pure function `(state, action) => newState`;
        - the **data hook** — `useReducer` plus an effect that saves the data, *if* it receives its storage from outside.

        Only the markup has to be rewritten: `<ul>`/`<li>` become `View`, text becomes `Text`, `<button onClick>` becomes `Pressable` with `onPress`. Look at the lines that changed:

        ```jsx
        // web
        <li key={task.id}><span>{task.title}</span>
          <button onClick={() => dispatch({ type: 'toggle', id: task.id })}>…</button></li>
        // native
        <View key={task.id}><Text>{task.title}</Text>
          <Pressable onPress={() => dispatch({ type: 'toggle', id: task.id })}>…</Pressable></View>
        ```

        `dispatch({ type: 'toggle', id: task.id })` — not a single change.

  - id: predict-two-toggles
    kind: prediction
    runnable: false
    prompt:
      uk: "Нативний екран планувальника використовує спільний `tasksReducer`. Справа `t-01` зараз не виконана (`done: false`). Користувач один раз натискає кнопку з цим обробником. Що виведе `console.log`, скільки нових рендерів буде і в якому стані залишиться `t-01`?"
      en: "A native planner screen uses the shared `tasksReducer`. Task `t-01` is not done right now (`done: false`). The user presses a button with this handler once. What does `console.log` print, how many new renders happen, and what state is `t-01` left in?"
    code: |
      <Pressable
        accessibilityRole="button"
        onPress={() => {
          dispatch({ type: 'toggle', id: 't-01' });
          dispatch({ type: 'toggle', id: 't-01' });
          console.log(tasks[0].done); // tasks[0] is t-01
        }}
      >
    answer:
      type: choice
      options:
        - id: snapshot
          text:
            uk: "`false`; один новий рендер; `t-01` знову не виконана — її двічі перемкнули"
            en: "`false`; one new render; `t-01` is not done again — it was toggled twice"
        - id: native-immediate
          text:
            uk: "`true`; два нові рендери; `t-01` виконана — на телефоні стан оновлюється одразу"
            en: "`true`; two new renders; `t-01` is done — on a phone state updates immediately"
          why:
            uk: "На телефоні працює той самий React. Обробник бачить знімок стану свого рендеру, а обидва `dispatch` лише ставлять дії в чергу."
            en: "The same React runs on the phone. The handler sees the state snapshot of its own render, and both `dispatch` calls only queue actions."
        - id: two-renders
          text:
            uk: "`false`; два нові рендери, по одному на кожен `dispatch`; `t-01` знову не виконана"
            en: "`false`; two new renders, one per `dispatch`; `t-01` is not done again"
          why:
            uk: "React групує оновлення з одного обробника: reducer виконується для обох дій, а рендер — один. Так само, як у вебі."
            en: "React batches updates from one handler: the reducer runs for both actions, but there is one render. Just like on the web."
        - id: one-toggle
          text:
            uk: "`false`; один новий рендер; `t-01` виконана — друга дія бачить старий стан і теж ставить `true`"
            en: "`false`; one new render; `t-01` is done — the second action also sees the old state and sets `true` too"
          why:
            uk: "Знімок бачить обробник, а не reducer. Reducer отримує результат попередньої дії з черги, тож друга дія перемикає вже `true` назад у `false`."
            en: "The handler sees the snapshot, not the reducer. The reducer receives the result of the previous queued action, so the second action flips the `true` back to `false`."
      correct: [snapshot]
    explanation:
      uk: "Обробник бачить знімок `tasks` того рендеру, в якому його створили, тож друкує `false`. Обидві дії стають у чергу; reducer застосовує їх по черзі (`false → true → false`), і React рендерить один раз. Це правило React, а не браузера, — тому на телефоні воно те саме."
      en: "The handler sees the `tasks` snapshot of the render it was created in, so it prints `false`. Both actions are queued; the reducer applies them in turn (`false → true → false`), and React renders once. This is a React rule, not a browser rule — which is why it is the same on a phone."

  - id: native-tasks
    kind: example
    runtime: concept-preview
    dir: native-tasks
    entry: main.jsx
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      library: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      internet: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      markDone: { uk: "Виконано", en: "Done" }
      undo: { uk: "Повернути", en: "Undo" }
    title:
      uk: "Спільний reducer у нативному списку"
      en: "The shared reducer in a native list"
    body:
      uk: |
        Чотири файли. `tasksReducer.js` і `useTasks.js` — спільний код, який міг би лежати у вебклієнті: у них немає ні DOM, ні сховища. Hook отримує сховище параметром (`storage`) — тут це заглушка, що лише пише в консоль. Платформний код — тільки `TaskList.jsx`.

        Натисни **Запустити**, потім натискай кнопки на **Сторінці** й дивись у консоль: `render N` — новий рендер, `saved 4 tasks` — ефект, що виконується після commit.
      en: |
        Four files. `tasksReducer.js` and `useTasks.js` are shared code that could live in the web client: they contain neither the DOM nor storage. The hook receives the storage as a parameter (`storage`) — here a stand-in that only writes to the console. The only platform code is `TaskList.jsx`.

        Press **Run**, then press the buttons on the **Page** and watch the console: `render N` is a new render, `saved 4 tasks` is the effect that runs after the commit.
    tryIt:
      uk: |
        1. У `TaskList.jsx` заміни обробник `onPress` на той, що в питанні вище: два `dispatch` для `task.id` і `console.log(task.done)` після них. Запусти й натисни кнопку першої справи: у консолі — `false`, один `render` і одне `saved 4 tasks`, а справа лишилася невиконаною.
        2. Поверни один `dispatch` без `console.log` і запусти знову: кожне натискання — рівно один рендер і одне збереження.
      en: |
        1. In `TaskList.jsx` replace the `onPress` handler with the one from the question above: two `dispatch` calls for `task.id` and `console.log(task.done)` after them. Run and press the first task's button: the console shows `false`, one `render` and one `saved 4 tasks`, and the task stays not done.
        2. Go back to a single `dispatch` without `console.log` and run again: every press is exactly one render and one save.
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не нативний застосунок: commit тут іде у вузли DOM, а не в нативні view; немає пристрою, нативних модулів, жестів, крім миші й клавіатури, вигляду конкретної платформи й продуктивності телефона. Перегляд підтверджує поведінку React — стан, рендери, ефекти, — але не те, як екран виглядає чи працює на твоєму пристрої."
      en: "This is a browser preview through react-native-web, not a native app: the commit here goes into DOM nodes, not native views; there is no device, no native modules, no gestures beyond mouse and keyboard, no platform-specific look and no phone performance. The preview confirms React behavior — state, renders, effects — but not how the screen looks or performs on your device."

  - id: dispatch-on-native
    kind: visual
    visual: diagram
    title:
      uk: "Один dispatch на native і у вебі"
      en: "One dispatch on native and on the web"
    textEquivalent:
      uk: "Користувач натискає Pressable, і обробник onPress викликає dispatch з дією toggle. Спільний tasksReducer повертає новий масив справ, не змінюючи старого. React рендерить компонент: виходить нове дерево елементів View, Text і Pressable зі знімком нового стану. Далі commit. Тільки тут шляхи розходяться: у вебклієнті React DOM оновлює вузли DOM, а в React Native рушій оновлює нативні view платформи. Після commit виконується ефект data hook і передає новий масив сховищу, яке hook отримав параметром. Dispatch, reducer, render, ефект і правила знімка однакові на обох платформах; відрізняється лише ціль commit і примітиви в розмітці."
      en: "The user presses a Pressable, and the onPress handler calls dispatch with a toggle action. The shared tasksReducer returns a new tasks array without changing the old one. React renders the component: the result is a new tree of View, Text and Pressable elements with a snapshot of the new state. Next comes the commit. Only here do the paths split: in the web client React DOM updates DOM nodes, while in React Native the renderer updates the platform's native views. After the commit the data hook's effect runs and passes the new array to the storage the hook received as a parameter. Dispatch, reducer, render, effect and the snapshot rules are the same on both platforms; only the commit target and the primitives in the markup differ."
    spec:
      layout: tb
      nodes:
        - { id: press, label: "onPress → dispatch({ type: 'toggle' })", w: 280 }
        - { id: reducer, label: { uk: "tasksReducer (спільний)", en: "tasksReducer (shared)" }, w: 280 }
        - { id: render, label: { uk: "render: View, Text, Pressable", en: "render: View, Text, Pressable" }, w: 280 }
        - { id: commit, label: { uk: "commit: нативні view (у вебі — DOM)", en: "commit: native views (web: DOM)" }, w: 280 }
        - { id: effect, label: { uk: "ефект: storage.save(tasks)", en: "effect: storage.save(tasks)" }, w: 280 }
      edges:
        - { from: press, to: reducer }
        - { from: reducer, to: render }
        - { from: render, to: commit }
        - { from: commit, to: effect }
      steps:
        - caption:
            uk: "Натискання на `Pressable` викликає `onPress`, а він — `dispatch` з дією `toggle`. Обробник бачить знімок стану свого рендеру."
            en: "A press on the `Pressable` calls `onPress`, and it calls `dispatch` with a `toggle` action. The handler sees the state snapshot of its own render."
          highlight: [press]
        - caption:
            uk: "Спільний `tasksReducer` повертає **новий** масив. Той самий файл працює у вебклієнті."
            en: "The shared `tasksReducer` returns a **new** array. The same file works in the web client."
          highlight: [reducer, press->reducer]
        - caption:
            uk: "Render: компонент повертає дерево з `View`, `Text` і `Pressable` зі знімком нового стану. Це єдине місце, де код відрізняється від вебу."
            en: "Render: the component returns a tree of `View`, `Text` and `Pressable` with a snapshot of the new state. This is the only place where the code differs from the web."
          highlight: [render, reducer->render]
        - caption:
            uk: "Commit: тут шляхи розходяться. У вебі оновлюються вузли DOM, на телефоні — нативні view платформи."
            en: "Commit: here the paths split. On the web DOM nodes are updated; on a phone, the platform's native views."
          highlight: [commit, render->commit]
          annotate:
            - { id: commit, text: { uk: "інша ціль commit", en: "a different commit target" } }
        - caption:
            uk: "Після commit виконується ефект data hook: новий масив іде в сховище, яке hook отримав параметром. На обох платформах однаково."
            en: "After the commit the data hook's effect runs: the new array goes to the storage the hook received as a parameter. The same on both platforms."
          highlight: [effect, commit->effect]

  - id: hidden-platform
    kind: explanation
    title:
      uk: "Коли hook не переноситься"
      en: "When a hook does not move over"
    body:
      uk: |
        Hook переноситься без змін, лише якщо всередині немає платформи. Ось hook, який так не зможе:

        ```js
        export function useWishes(initialWishes) {
          const [wishes, dispatch] = useReducer(wishesReducer, initialWishes);
          useEffect(() => {
            localStorage.setItem('jsll.wishlist.v1', JSON.stringify({ schemaVersion: 1, records: wishes }));
          }, [wishes]);
          return [wishes, dispatch];
        }
        ```

        На телефоні глобального `localStorage` немає: перше ж виконання ефекту кине `ReferenceError`. А перегляд у браузері цієї помилки **не покаже** — у браузері `localStorage` є. Це добрий приклад того, чого перегляд не доводить.

        Вихід той самий, що в `useTasks`: hook отримує сховище параметром і викликає лише його методи. Вебклієнт передає обгортку над `localStorage`, нативний застосунок — свою. Як оформити такий контракт, розберемо в наступному уроці.
      en: |
        A hook moves over unchanged only if there is no platform inside it. Here is a hook that cannot:

        ```js
        export function useWishes(initialWishes) {
          const [wishes, dispatch] = useReducer(wishesReducer, initialWishes);
          useEffect(() => {
            localStorage.setItem('jsll.wishlist.v1', JSON.stringify({ schemaVersion: 1, records: wishes }));
          }, [wishes]);
          return [wishes, dispatch];
        }
        ```

        A phone has no global `localStorage`: the very first run of the effect throws a `ReferenceError`. And the browser preview **will not show** this error — the browser does have `localStorage`. It is a good example of what the preview does not prove.

        The cure is the same as in `useTasks`: the hook receives the storage as a parameter and calls only its methods. The web client passes a wrapper around `localStorage`, the native app passes its own. How to shape such a contract is the next lesson.

  - id: recall-snapshot
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: web-counter-snapshot
        from: re-02-02-state-snapshots
        prompt:
          uk: "У вебкомпоненті `count` дорівнює `3`. Користувач один раз натискає кнопку з цим обробником. Що надрукує `console.log` і яким буде `count` після рендеру?"
          en: "In a web component `count` equals `3`. The user presses a button with this handler once. What does `console.log` print, and what is `count` after the render?"
        code: |
          function handleClick() {
            setCount(count + 1);
            setCount(count + 1);
            console.log(count);
          }
        runnable: false
        answer:
          type: choice
          options:
            - id: three-four
              text:
                uk: "Надрукує `3`, після рендеру — `4`"
                en: "Prints `3`; after the render it is `4`"
            - id: five-five
              text:
                uk: "Надрукує `5`, після рендеру — `5`"
                en: "Prints `5`; after the render it is `5`"
              why:
                uk: "`count` у цьому обробнику — знімок рендеру: обидва виклики отримують `3 + 1`."
                en: "`count` in this handler is the render's snapshot: both calls get `3 + 1`."
            - id: three-five
              text:
                uk: "Надрукує `3`, після рендеру — `5`"
                en: "Prints `3`; after the render it is `5`"
              why:
                uk: "Щоб вийшло `5`, другий виклик мав би отримати попереднє значення — це робить форма з функцією `setCount((c) => c + 1)`. Тут обидва рази передано число `4`."
                en: "To get `5`, the second call would need the previous value — that is what the function form `setCount((c) => c + 1)` does. Here the number `4` is passed both times."
          correct: [three-four]
        explanation:
          uk: "Обробник бачить `count` свого рендеру — `3`. Обидва виклики ставлять у чергу число `4`, тож після рендеру `count` дорівнює `4`. З reducer різниця лише в тому, що дію застосовує функція-reducer до результату попередньої дії."
          en: "The handler sees its render's `count` — `3`. Both calls queue the number `4`, so after the render `count` is `4`. With a reducer the only difference is that the reducer function applies each action to the result of the previous one."

  - id: native-habits
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: native-habits
    entry: main.jsx
    editable: [HabitList.jsx]
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      water: { uk: "Пити воду", en: "Drink water" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      pause: { uk: "Призупинити", en: "Pause" }
      resume: { uk: "Відновити", en: "Resume" }
    title:
      uk: "Нативний список звичок на спільному коді"
      en: "A native habit list on shared code"
    instructions:
      uk: |
        `HabitList.jsx` скопіювали з вебклієнта трекера звичок: `<ul>`, `<li>`, `<span>` і `<button>`. У браузері це навіть малюється, але на телефоні таких елементів немає.

        Перепиши **лише розмітку** `HabitList.jsx` на `View`, `Text` і `Pressable` з `react-native`:

        - кожна назва звички й кожен підпис кнопки — всередині `Text`;
        - кнопка — `Pressable` з `onPress` і роллю кнопки (`accessibilityRole="button"` або `role="button"`), щоб програма читання з екрана оголошувала її як кнопку;
        - виклик `useHabits(initialHabits, storage)` і дія `toggle-active` лишаються як є.

        `habitsReducer.js`, `useHabits.js`, `storage.js` і `main.jsx` редагувати не можна — це спільний код і обв’язка перегляду.
      en: |
        `HabitList.jsx` was copied from the habit tracker's web client: `<ul>`, `<li>`, `<span>` and `<button>`. The browser even draws it, but a phone has no such elements.

        Rewrite **only the markup** of `HabitList.jsx` with `View`, `Text` and `Pressable` from `react-native`:

        - every habit name and every button label sits inside `Text`;
        - a button is a `Pressable` with `onPress` and the button role (`accessibilityRole="button"` or `role="button"`), so a screen reader announces it as a button;
        - the `useHabits(initialHabits, storage)` call and the `toggle-active` action stay as they are.

        `habitsReducer.js`, `useHabits.js`, `storage.js` and `main.jsx` cannot be edited — they are the shared code and the preview's wiring.
    limits:
      uk: "Перевірки натискають кнопки в перегляді react-native-web і дивляться, які елементи він намалював. Вони не доводять, що екран так само працює на телефоні: нативних view, пристрою й продуктивності тут немає."
      en: "The checks press buttons in the react-native-web preview and look at which elements it drew. They do not prove that the screen works the same on a phone: there are no native views, no device and no phone performance here."
    testTitles:
      "every element on the screen comes from a React Native component":
        uk: "Кожен елемент екрана походить від компонента React Native"
        en: "Every element on the screen comes from a React Native component"
      "every piece of text sits inside Text":
        uk: "Увесь текст — всередині `Text`"
        en: "Every piece of text sits inside `Text`"
      "each habit name is shown":
        uk: "Назва кожної звички показана"
        en: "Each habit name is shown"
      "every pause or resume control is announced as a button":
        uk: "Кожна кнопка «Призупинити»/«Відновити» має роль кнопки"
        en: "Every Pause or Resume control is announced as a button"
      "pressing the first button pauses the habit through the shared reducer and saves it":
        uk: "Натискання першої кнопки призупиняє звичку через спільний reducer і зберігає її"
        en: "Pressing the first button pauses the habit through the shared reducer and saves it"
    hints:
      nudge:
        uk: "Пройдися розміткою згори донизу й для кожного вебтегу спитай: який нативний примітив робить те саме — контейнер, текст чи те, що натискають?"
        en: "Go through the markup top to bottom and for each web tag ask: which native primitive does the same job — a container, text, or something you press?"
      explanation:
        uk: "Контейнери (`ul`, `li`, `div`) стають `View`, будь-який текст загортають у `Text`, а все, що натискають, — `Pressable`, у якого обробник називається `onPress`, а не `onClick`. Наприклад, рядок кошика `<div><b>{price}</b><button onClick={remove}>…</button></div>` стає `View` з `Text` для ціни й `Pressable` з `onPress={remove}`, а підпис кнопки — теж у `Text`. Те, що повертає `useHabits`, використовуй як є: стан і `dispatch` від платформи не залежать."
        en: "Containers (`ul`, `li`, `div`) become `View`, any text is wrapped in `Text`, and anything you press becomes a `Pressable`, whose handler is called `onPress`, not `onClick`. For example, a cart row `<div><b>{price}</b><button onClick={remove}>…</button></div>` becomes a `View` with a `Text` for the price and a `Pressable` with `onPress={remove}`, and the button label goes into a `Text` too. Use what `useHabits` returns as it is: state and `dispatch` do not depend on the platform."
    solutionNote:
      uk: "Змінилася тільки розмітка: `View` замість `ul`/`li`, `Text` для назви й підпису, `Pressable` з `onPress` і роллю кнопки. Reducer, hook і сховище — ті самі файли, що й у вебі, тож натискання так само проходить через `toggle-active` і потрапляє в `storage.save`."
      en: "Only the markup changed: `View` instead of `ul`/`li`, `Text` for the name and the label, `Pressable` with `onPress` and the button role. The reducer, the hook and the storage are the same files as on the web, so a press still goes through `toggle-active` and reaches `storage.save`."
    feedback:
      - when: { test: "every element on the screen comes from a React Native component" }
        message:
          uk: "Ця перевірка очікує, що на екрані немає елементів, написаних вебтегами (`ul`, `li`, `span`, `button`, `div`…): у списку з повідомлення видно, які лишилися. На телефоні таких елементів немає — заміни їх на `View`, `Text` чи `Pressable`."
          en: "This check expects no elements written as web tags (`ul`, `li`, `span`, `button`, `div`…) on the screen: the list in the message shows which remain. A phone has no such elements — replace them with `View`, `Text` or `Pressable`."
      - when: { test: "every piece of text sits inside Text" }
        message:
          uk: "Ця перевірка очікує, що жоден текст не лежить просто у `View`. Перегляд пише про це помилку в консоль, а на телефоні такий екран не запуститься зовсім. Загорни назву в `Text`."
          en: "This check expects no text lying directly in a `View`. The preview writes an error about it to the console, and on a phone such a screen does not start at all. Wrap the name in `Text`."
      - when: { test: "every pause or resume control is announced as a button" }
        message:
          uk: "Ця перевірка очікує чотири елементи з роллю кнопки, перший — з підписом «Призупинити». `Pressable` сам по собі ролі не має: додай `accessibilityRole=\"button\"` або `role=\"button\"`."
          en: "This check expects four elements with the button role, the first labelled “Pause”. A `Pressable` has no role by itself: add `accessibilityRole=\"button\"` or `role=\"button\"`."
      - when: { test: "pressing the first button pauses the habit through the shared reducer and saves it" }
        message:
          uk: "Ця перевірка натискає першу кнопку й чекає підпису «Відновити» та останнього збереження в `storage`, де `h-01` має `active: false`. Це вийде, лише якщо `onPress` викликає `dispatch` з `useHabits`, а екран показує `habits` звідти ж, а не власну копію в `useState`."
          en: "This check presses the first button and waits for the label “Resume” and for a last save in `storage` in which `h-01` has `active: false`. That only works if `onPress` calls `dispatch` from `useHabits` and the screen shows the `habits` from there too, not its own copy in `useState`."
      - when: { error: ReferenceError }
        message:
          uk: "`ReferenceError` з назвою компонента (`View is not defined`) означає, що його не імпортовано: додай назву в `import { … } from 'react-native'`. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "A `ReferenceError` naming a component (`View is not defined`) means it was not imported: add the name to `import { … } from 'react-native'`. If every check fails at once, fix the first console error first."

  - id: to-project
    kind: transfer
    capstoneStep: RN-03
    body:
      uk: "У кроці проєкту ти підключиш у нативному проєкті `~/js-course/<проєкт>-native` той самий reducer і валідацію, що й у вебклієнті (`validateItem`, `validateTask`, `validateHabit` чи `validateExpense` — залежно від проєкту), як незмінні копії файлів React-проєкту: у них не зміниться жодного рядка, і `diff` це доведе. Сховище, форматування й годинник data hook отримає ззовні, як `useTasks` у цьому уроці."
      en: "In the project step you will wire the same reducer and validation as in the web client (`validateItem`, `validateTask`, `validateHabit` or `validateExpense`, depending on the project) into your native project `~/js-course/<project>-native` as unchanged copies of the React project's files: not a single line in them changes, and `diff` proves it. The data hook will receive storage, formatting and the clock from outside, like `useTasks` in this lesson."
