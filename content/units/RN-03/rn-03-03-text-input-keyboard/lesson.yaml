id: rn-03-03-text-input-keyboard
unit: RN-03
title:
  uk: "Введення тексту й поведінка клавіатури"
  en: "Text input and keyboard behavior"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Налаштувати `TextInput` під його дані (`keyboardType`, `autoCapitalize`, `returnKeyType`) і переводити фокус на наступне поле після клавіші повернення."
    en: "Configure a TextInput for its data (keyboardType, autoCapitalize, returnKeyType) and move focus to the next field on submit."
  - uk: "Тримати поле з фокусом і кнопку збереження над клавіатурою у формі, що прокручується, і закривати клавіатуру після збереження чи дотику поза полем."
    en: "Keep the focused field and the save button visible above the keyboard in a scrolling form, and dismiss the keyboard on save or on a tap outside."
prerequisites: [rn-03-02-platform-adapters, rn-02-04-touch-targets-keyboard]
subskills:
  - { family: N-02, skill: "keyboard avoidance", depth: practice }
glossary: [keyboard-type, return-key-type, keyboard-dismiss]
selfCheck: [predict-decimal-text, amount-field]

blocks:
  - id: input-for-its-data
    kind: explanation
    title:
      uk: "Поле під свої дані"
      en: "A field for its data"
    body:
      uk: |
        На телефоні під полем відкривається екранна клавіатура, і `TextInput` вирішує, **яка**. Три пропси роблять введення зручним:

        | Проп | Що робить | Приклад |
        |---|---|---|
        | [[keyboard-type\|keyboardType]] | вигляд клавіатури | `decimal-pad` для суми, `email-address` для пошти |
        | `autoCapitalize` | велика літера (типово `sentences` — на початку речення) | `none` для коду, `words` для назви категорії |
        | [[return-key-type\|returnKeyType]] | підпис клавіші повернення | `next` між полями, `done` в останньому |

        `returnKeyType` лише підписує клавішу. Дію задає `onSubmitEditing`: щоб перейти на наступне поле, візьми його ref і виклич `focus()`. Однорядкове поле після клавіші повернення типово знімає з себе фокус (за документацією, `submitBehavior` типово `blurAndSubmit`), тож клавіатура може на мить почати ховатися, перш ніж наступне поле отримає фокус. `submitBehavior="submit"` надсилає подію, не знімаючи фокусу, — і клавіатура лишається відкритою, поки фокус переходить далі.

        І ще одна відмінність від вебу: `onChangeText` отримує **сам текст** — рядок, а не об’єкт події. Об’єкт події дає `onChange`, і він інший, ніж у браузері: текст лежить у `event.nativeEvent.text`.
      en: |
        On a phone an on-screen keyboard opens under the field, and the `TextInput` decides **which one**. Three props make typing comfortable:

        | Prop | What it does | Example |
        |---|---|---|
        | [[keyboard-type\|keyboardType]] | how the keyboard looks | `decimal-pad` for an amount, `email-address` for e-mail |
        | `autoCapitalize` | capital letters (default `sentences` — at the start of a sentence) | `none` for a code, `words` for a category name |
        | [[return-key-type\|returnKeyType]] | the label of the return key | `next` between fields, `done` in the last one |

        `returnKeyType` only labels the key. The action is set by `onSubmitEditing`: to move to the next field, take its ref and call `focus()`. A single-line field takes focus off itself after the return key by default (per the documentation, `submitBehavior` defaults to `blurAndSubmit`), so the keyboard may briefly start to hide before the next field gets focus. `submitBehavior="submit"` sends the submit event without taking focus away — and the keyboard stays open while focus moves on.

        And one more difference from the web: `onChangeText` receives **the text itself** — a string, not an event object. The event object comes with `onChange`, and it differs from the browser's: the text is in `event.nativeEvent.text`.

  - id: predict-decimal-text
    kind: prediction
    runnable: false
    strings:
      amount: { uk: "Сума", en: "Amount" }
    prompt:
      uk: "Поле суми налаштоване так, як у коді. Користувач вводить `12,50` і натискає клавішу повернення. Що лежить у `amount` і що станеться з фокусом?"
      en: "The amount field is set up as in the code. The user types `12,50` and presses the return key. What is in `amount`, and what happens to focus?"
    code: |
      const [amount, setAmount] = useState('');
      // …
      <TextInput
        accessibilityLabel="%%amount%%"
        value={amount}
        onChangeText={setAmount}
        keyboardType="decimal-pad"
        returnKeyType="next"
      />
    answer:
      type: choice
      options:
        - id: raw-blur
          text:
            uk: "Текст `\"12,50\"`; поле втрачає фокус, і жодне інше його не отримує"
            en: "The text `\"12,50\"`; the field loses focus and no other field gets it"
        - id: number-next
          text:
            uk: "Число `12.5`; фокус переходить на наступне поле"
            en: "The number `12.5`; focus moves to the next field"
          why:
            uk: "`decimal-pad` лише показує цифрову клавіатуру — нічого не перетворює й не перевіряє. А `returnKeyType=\"next\"` лише підписує клавішу: без `onSubmitEditing` фокус нікуди не переходить."
            en: "`decimal-pad` only shows a numeric keyboard — it converts and checks nothing. And `returnKeyType=\"next\"` only labels the key: without `onSubmitEditing` focus goes nowhere."
        - id: raw-next
          text:
            uk: "Текст `\"12,50\"`; фокус переходить на наступне поле"
            en: "The text `\"12,50\"`; focus moves to the next field"
          why:
            uk: "Підпис `next` — лише текст на клавіші. Перехід треба написати самому: `onSubmitEditing`, ref наступного поля й `focus()`."
            en: "The `next` label is just text on the key. The move has to be written by hand: `onSubmitEditing`, the next field's ref and `focus()`."
        - id: nan
          text:
            uk: "`NaN`, бо кома — не десяткова крапка; поле втрачає фокус"
            en: "`NaN`, because a comma is not a decimal point; the field loses focus"
          why:
            uk: "`NaN` з’явилося б лише після `Number(amount)`. `onChangeText` передає рядок як є, з комою."
            en: "`NaN` would appear only after `Number(amount)`. `onChangeText` passes the string as it is, comma included."
      correct: [raw-blur]
    explanation:
      uk: "`onChangeText` віддає рядок, тож `amount` — `\"12,50\"`, і розбирати його мусить твій код. Клавіатура цифр не гарантує ні числа, ні крапки: кома, дві коми чи порожнє поле — усе можливо. Однорядкове поле після клавіші повернення знімає з себе фокус, а без `onSubmitEditing` ніхто його не підхоплює. Перегляд у браузері поводиться так само: клавіша Enter у ньому — та сама клавіша повернення."
      en: "`onChangeText` hands over a string, so `amount` is `\"12,50\"`, and your code has to parse it. A numeric keyboard guarantees neither a number nor a point: a comma, two commas or an empty field are all possible. A single-line field takes focus off itself after the return key, and without `onSubmitEditing` nobody picks it up. The browser preview behaves the same: its Enter key is the same return key."

  - id: wish-form
    kind: example
    runtime: concept-preview
    dir: wish-form
    entry: main.jsx
    strings:
      nameLabel: { uk: "Назва бажання", en: "Wish name" }
      priceLabel: { uk: "Ціна, грн", en: "Price, UAH" }
      categoryLabel: { uk: "Категорія", en: "Category" }
      save: { uk: "Зберегти", en: "Save" }
    title:
      uk: "Ланцюжок фокусу через три поля"
      en: "A focus chain through three fields"
    body:
      uk: |
        Форма бажання: назва, ціна (`number-pad`, бо ціни цілі) і категорія. Клавіша повернення в перших двох полях переводить фокус далі через ref, в останньому — зберігає й закриває клавіатуру `Keyboard.dismiss()`.

        Натисни **Запустити**, клацни в «Назва бажання» на **Сторінці**, введи щось і натисни Enter — і так у кожному полі. Консоль показує, куди йде фокус (`focus → …`), і що збережено.
      en: |
        A wish form: name, price (`number-pad`, because prices are whole) and category. The return key in the first two fields moves focus on through a ref; in the last one it saves and closes the keyboard with `Keyboard.dismiss()`.

        Press **Run**, click into “Wish name” on the **Page**, type something and press Enter — and so in every field. The console shows where focus goes (`focus → …`) and what was saved.
    tryIt:
      uk: |
        1. Прибери `onSubmitEditing` з поля ціни й запусти: після Enter у ціні фокус нікуди не переходить — `returnKeyType="next"` сам по собі нічого не робить. Поверни рядок.
        2. Зміни `keyboardType` ціни на `"email-address"`. У перегляді нічого не зміниться: ти набираєш на фізичній клавіатурі, а екранна з’являється лише на твоєму пристрої. Так само тут не видно `autoCapitalize`. Поверни `"number-pad"`.
      en: |
        1. Remove `onSubmitEditing` from the price field and run: after Enter in the price, focus goes nowhere — `returnKeyType="next"` does nothing by itself. Put the line back.
        2. Change the price's `keyboardType` to `"email-address"`. Nothing changes in the preview: you type on a physical keyboard, and the on-screen one appears only on your device. `autoCapitalize` is not visible here either. Put `"number-pad"` back.
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не нативний застосунок: екранної клавіатури тут немає, тож не видно ні `keyboardType`, ні `autoCapitalize`, ні того, чи закриває клавіатура поле; `KeyboardAvoidingView` тут не має клавіатури, на яку реагувати. Також немає пристрою, нативних модулів, жестів, крім миші й клавіатури, вигляду платформи й продуктивності телефона. Ланцюжок фокусу й збереження перевіряються тут справді; усе, що стосується клавіатури, — лише на твоєму пристрої."
      en: "This is a browser preview through react-native-web, not a native app: there is no on-screen keyboard here, so you see neither `keyboardType`, nor `autoCapitalize`, nor whether the keyboard covers a field; `KeyboardAvoidingView` has no keyboard to react to here. There is also no device, no native modules, no gestures beyond mouse and keyboard, no platform look and no phone performance. The focus chain and the save are really checked here; everything about the keyboard only on your device."

  - id: keyboard-out-of-the-way
    kind: explanation
    title:
      uk: "Клавіатура не повинна нічого ховати"
      en: "The keyboard must not hide anything"
    body:
      uk: |
        Екранна клавіатура часто займає нижню третину-половину екрана. Щоб поле з фокусом і кнопка «Зберегти» лишалися видимими, форма в прикладі зібрана з трьох частин:

        - `KeyboardAvoidingView` зменшує висоту, зсуває вміст чи додає відступ знизу на висоту клавіатури. Документація радить задавати `behavior` на обох платформах, але вони реагують на нього по-різному, тому значення (`padding`, `height`, `position`) перевіряють на своєму пристрої;
        - `ScrollView` всередині дає догорнути до будь-якого поля, коли місця стало менше;
        - `keyboardShouldPersistTaps="handled"` на `ScrollView`: без нього (типово `never`) перший дотик до «Зберегти», поки клавіатура відкрита, лише закриває клавіатуру, а кнопка натискання не отримує.

        [[keyboard-dismiss|Закривати клавіатуру]] теж треба вчасно: після збереження — `Keyboard.dismiss()`, при дотику поза полями — `ScrollView` з `"handled"` закриє її сам, а `keyboardDismissMode="on-drag"` — коли користувач почне гортати.
      en: |
        The on-screen keyboard often takes up the bottom third to half of the screen. To keep the focused field and the Save button visible, the form in the example is built from three parts:

        - `KeyboardAvoidingView` reduces its height, shifts its content or adds bottom padding by the keyboard's height. The documentation recommends setting `behavior` on both platforms, but they react to it differently, so the value (`padding`, `height`, `position`) is checked on your own device;
        - the `ScrollView` inside lets the user scroll to any field once there is less room;
        - `keyboardShouldPersistTaps="handled"` on the `ScrollView`: without it (the default is `never`) the first tap on Save while the keyboard is open only closes the keyboard, and the button gets no press.

        [[keyboard-dismiss|Closing the keyboard]] has to happen at the right time too: after a save — `Keyboard.dismiss()`; on a tap outside the fields — a `ScrollView` with `"handled"` closes it itself, and `keyboardDismissMode="on-drag"` does when the user starts to scroll.

  - id: recall-inputs
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: web-controlled-input
        from: re-02-06-controlled-inputs-typed-events
        prompt:
          uk: "У вебформі на React поле керується станом: `value={title}`. Що треба написати в `onChange`, щоб поле показувало те, що вводить користувач?"
          en: "In a React web form a field is controlled by state: `value={title}`. What has to be in `onChange` so that the field shows what the user types?"
        answer:
          type: choice
          options:
            - id: target-value
              code: "onChange={(event) => setTitle(event.target.value)}"
            - id: event
              code: "onChange={(event) => setTitle(event)}"
              why:
                uk: "У вебі `onChange` отримує об’єкт події, а не текст. Текст лежить у `event.target.value`."
                en: "On the web `onChange` receives an event object, not the text. The text is in `event.target.value`."
            - id: nothing
              code: "onChange={() => {}}"
              why:
                uk: "Керованим полем володіє стан: якщо його не оновлювати, поле лишається таким, як `title`, і введені символи зникають."
                en: "A controlled field is owned by state: if you do not update it, the field stays as `title` is, and typed characters disappear."
          correct: [target-value]
        explanation:
          uk: "У вебі текст дістають з `event.target.value`. У React Native є коротший шлях: `onChangeText` одразу отримує рядок, тож `onChangeText={setTitle}` — і все."
          en: "On the web the text is taken from `event.target.value`. React Native has a shorter way: `onChangeText` receives the string directly, so `onChangeText={setTitle}` is all it takes."
      - id: keyboard-covers-field
        from: rn-02-04-touch-targets-keyboard
        prompt:
          uk: "Форма з п’яти полів займає весь екран телефона. Користувач торкається останнього поля, і відкривається екранна клавіатура. Що станеться з цим полем, якщо форма — звичайний `View` без жодних налаштувань для клавіатури?"
          en: "A five-field form fills the whole phone screen. The user taps the last field, and the on-screen keyboard opens. What happens to that field if the form is a plain `View` without any keyboard setup?"
        answer:
          type: choice
          options:
            - id: covered
              text:
                uk: "Клавіатура може його закрити: користувач не бачить, що вводить"
                en: "The keyboard may cover it: the user cannot see what they type"
            - id: always-moves
              text:
                uk: "Нічого: система завжди сама піднімає поле над клавіатурою"
                en: "Nothing: the system always lifts the field above the keyboard by itself"
              why:
                uk: "На це не можна покладатися: залежно від платформи й налаштувань вікна поле може лишитися під клавіатурою. Тому форму будують із `KeyboardAvoidingView` і прокруткою й перевіряють на пристрої."
                en: "You cannot rely on that: depending on the platform and the window settings, the field may stay under the keyboard. That is why forms are built with `KeyboardAvoidingView` and scrolling and checked on a device."
          correct: [covered]
        explanation:
          uk: "Без підготовки нижнє поле опиняється під клавіатурою. Звідси правило: форма прокручується й поступається місцем клавіатурі, а перевіряють це на своєму пристрої, бо в браузерному перегляді клавіатури немає."
          en: "Without preparation the bottom field ends up under the keyboard. Hence the rule: the form scrolls and makes room for the keyboard, and you check it on your own device, because the browser preview has no keyboard."

  - id: amount-field
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: amount-field
    entry: main.jsx
    editable: [AmountField.jsx]
    strings:
      amountLabel: { uk: "Сума, грн", en: "Amount, UAH" }
      save: { uk: "Зберегти", en: "Save" }
      amountRequired: { uk: "Введи суму", en: "Enter an amount" }
      amountInvalid: { uk: "Сума — це число більше за нуль, до двох знаків після коми", en: "The amount is a number above zero with up to two decimal places" }
    title:
      uk: "Поле суми, що не губить введене"
      en: "An amount field that keeps what was typed"
    instructions:
      uk: |
        Допиши `AmountField.jsx` — поле суми для трекера витрат:

        - поле керується станом `text` і показує **рівно те, що ввели**, — `12,50` лишається `12,50`, без перетворень;
        - поле просить цифрову клавіатуру з десятковим роздільником (`decimal-pad`);
        - «Зберегти» перевіряє текст спільною функцією `validateAmount` з `expenses.js`. Якщо `ok` — виклич `onSave(value)` (сума в копійках, `12,50` → `1250`) і закрий клавіатуру; якщо ні — нічого не зберігай і покажи під полем повідомлення з `messages` для ключа з `errors.amountMinor`.

        Сам текст не розбирай: правила суми живуть у спільному коді, і вебклієнт користується тими самими. `expenses.js`, `messages.js` і `main.jsx` редагувати не можна.
      en: |
        Finish `AmountField.jsx` — the amount field of the expense tracker:

        - the field is controlled by the `text` state and shows **exactly what was typed** — `12,50` stays `12,50`, with no conversion;
        - the field asks for a numeric keyboard with a decimal separator (`decimal-pad`);
        - Save checks the text with the shared `validateAmount` function from `expenses.js`. If `ok`, call `onSave(value)` (the amount in kopiykas, `12,50` → `1250`) and close the keyboard; if not, save nothing and show the message from `messages` for the key in `errors.amountMinor` under the field.

        Do not parse the text yourself: the amount rules live in the shared code, and the web client uses the same ones. `expenses.js`, `messages.js` and `main.jsx` cannot be edited.
    limits:
      uk: "Перевірки вводять текст і натискають «Зберегти» в перегляді react-native-web. Яку клавіатуру отримає поле, вони бачать лише з атрибута, який перегляд ставить у браузері; саму екранну клавіатуру, `Keyboard.dismiss()` і те, чи поле видно над клавіатурою, перевіряють на твоєму пристрої."
      en: "The checks type text and press Save in the react-native-web preview. Which keyboard the field gets they see only from the attribute the preview sets in the browser; the on-screen keyboard itself, `Keyboard.dismiss()` and whether the field is visible above the keyboard are checked on your device."
    testTitles:
      "the field asks for the decimal keyboard":
        uk: "Поле просить цифрову клавіатуру з десятковим роздільником"
        en: "The field asks for the decimal keyboard"
      "the field keeps exactly the text that was typed":
        uk: "Поле показує рівно те, що ввели"
        en: "The field keeps exactly the text that was typed"
      "saving 12,50 passes 1250 to onSave":
        uk: "Збереження `12,50` передає в `onSave` число `1250`"
        en: "Saving `12,50` passes `1250` to `onSave`"
      "saving abc shows the localized error and saves nothing":
        uk: "Збереження `abc` показує повідомлення й нічого не зберігає"
        en: "Saving `abc` shows the message and saves nothing"
      "saving an empty field shows the required message":
        uk: "Збереження порожнього поля показує «Введи суму»"
        en: "Saving an empty field shows “Enter an amount”"
    hints:
      nudge:
        uk: "Що саме `onChangeText` передає в обробник? І чи треба щось робити з цим значенням, перш ніж покласти його в стан?"
        en: "What exactly does `onChangeText` pass to the handler? And does that value need anything done to it before it goes into state?"
      explanation:
        uk: "Поле зберігає сирий текст, а перетворення відбувається лише при збереженні — так користувач може спокійно ввести `0,`, перш ніж допише копійки. Ось той самий підхід для поля ваги в іншій програмі: `onChangeText={setWeightText}`, а при збереженні `const check = parseWeight(weightText); if (check.ok) submit(check.value); else setProblem(texts[check.errors.weight]);`. Тип клавіатури задають пропсом `keyboardType`."
        en: "The field keeps the raw text, and the conversion happens only on save — so the user can calmly type `0,` before adding the kopiykas. Here is the same approach for a weight field in another program: `onChangeText={setWeightText}`, and on save `const check = parseWeight(weightText); if (check.ok) submit(check.value); else setProblem(texts[check.errors.weight]);`. The keyboard type is set with the `keyboardType` prop."
    solutionNote:
      uk: "Стан тримає рядок, який повертає `onChangeText`, тож поле показує введене без змін. Розбір і правила — у `validateAmount`, тому нативне й вебполе приймають ті самі суми. Помилку показує `Text` з локалізованим повідомленням для `messageKey`, а `Keyboard.dismiss()` після вдалого збереження прибирає клавіатуру — це видно лише на пристрої."
      en: "The state holds the string `onChangeText` returns, so the field shows what was typed unchanged. Parsing and the rules are in `validateAmount`, so the native and the web field accept the same amounts. The error is shown by a `Text` with the localized message for the `messageKey`, and `Keyboard.dismiss()` after a successful save removes the keyboard — which is visible only on a device."
    feedback:
      - when: { test: "the field asks for the decimal keyboard" }
        message:
          uk: "Ця перевірка очікує, що поле суми просить цифрову клавіатуру з десятковим роздільником (`keyboardType=\"decimal-pad\"` чи `inputMode=\"decimal\"`)."
          en: "This check expects the amount field to ask for a numeric keyboard with a decimal separator (`keyboardType=\"decimal-pad\"` or `inputMode=\"decimal\"`)."
      - when: { test: "the field keeps exactly the text that was typed" }
        message:
          uk: "Ця перевірка вводить `12,50` і очікує в полі саме `12,50`. Поле має бути керованим (`value` і `onChangeText`) і зберігати рядок без перетворення на число."
          en: "This check types `12,50` and expects exactly `12,50` in the field. The field must be controlled (`value` and `onChangeText`) and keep the string without turning it into a number."
      - when: { test: "saving 12,50 passes 1250 to onSave" }
        message:
          uk: "Ця перевірка очікує, що після введення `12,50` і «Зберегти» `onSave` отримає рівно один раз число `1250` — результат `validateAmount`, а не власного розбору."
          en: "This check expects that after typing `12,50` and pressing Save, `onSave` receives exactly once the number `1250` — the result of `validateAmount`, not of your own parsing."
      - when: { test: "saving abc shows the localized error and saves nothing" }
        message:
          uk: "Ця перевірка очікує після `abc` текст повідомлення з `messages` (не сам ключ) і жодного виклику `onSave`. Перевір `ok`, перш ніж зберігати."
          en: "This check expects the message text from `messages` (not the key itself) after `abc`, and no call of `onSave`. Check `ok` before saving."
      - when: { test: "saving an empty field shows the required message" }
        message:
          uk: "Ця перевірка очікує для порожнього поля повідомлення для ключа `amountRequired`."
          en: "This check expects the message for the key `amountRequired` for an empty field."
      - when: { error: TypeError }
        message:
          uk: "`TypeError` під час введення часто означає, що `onChangeText` обробляють як вебподію (`event.target.value`): він отримує рядок, а не об’єкт події."
          en: "A `TypeError` while typing often means `onChangeText` is handled like a web event (`event.target.value`): it receives a string, not an event object."

  - id: to-project
    kind: transfer
    capstoneStep: RN-03
    body:
      uk: "Форма створення й редагування в кроці проєкту зберігає сирий текст у стані й перевіряє його спільною функцією (`validateItem`, `validateTask`, `validateHabit` чи `validateExpense`) без змін. Клавіатуру за даними поля й ланцюжок фокусу варто додати й там, а чи не ховається форма під клавіатурою, перевір на своєму пристрої."
      en: "The create and edit form of the project step keeps the raw text in state and checks it with the shared function (`validateItem`, `validateTask`, `validateHabit` or `validateExpense`), unchanged. A keyboard that fits each field and a focus chain are worth adding there too, and check on your own device whether the form hides under the keyboard."
