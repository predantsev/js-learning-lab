id: rn-03-04-flatlist-keys
unit: RN-03
title:
  uk: "Віртуалізовані списки й ключі"
  en: "Virtualized lists and keys"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Показати довгий список записів через `FlatList` (`data`, `renderItem`, `keyExtractor`) і пояснити, чому в кожен момент змонтоване лише вікно рядків."
    en: "Render a long record list with FlatList (data, renderItem, keyExtractor) and explain why only a window of rows is mounted at any moment."
  - uk: "Передбачити, що станеться зі станом рядка, наприклад недописаним текстом, коли ключі — індекси, а запис вставили на початок."
    en: "Predict what happens to row state, such as half-typed text, when keys are indexes and a record is inserted at the top."
prerequisites: [rn-03-03-text-input-keyboard, re-01-05-keys-identity, re-07-05-long-lists-windowing]
subskills:
  - { family: N-04, skill: "virtualized lists/keys", depth: intro }
glossary: [flatlist, key-extractor]
selfCheck: [predict-mounted, predict-index-note, wish-list]

blocks:
  - id: flatlist-basics
    kind: explanation
    title:
      uk: "FlatList: дані, рядок, ключ"
      en: "FlatList: data, row, key"
    body:
      uk: |
        `ScrollView` з `map` створює **кожен** рядок одразу: тисяча записів — тисяча змонтованих компонентів і нативних view, навіть якщо на екрані вміщається вісім. Документація React Native прямо радить для довгих списків [[flatlist|FlatList]]:

        ```jsx
        <FlatList
          data={tasks}                                   // the array of records
          renderItem={({ item }) => <TaskRow task={item} />}
          keyExtractor={(task) => task.id}               // a stable key per record
        />
        ```

        FlatList — це [[list-windowing|windowing]], який ти бачив у вебі, але вбудований. Спершу він монтує перші `initialNumToRender` рядків (типово 10), а далі тримає **вікно рендеру** навколо видимої частини — до `windowSize` висот екрана (типово 21: екран і до десяти вище й нижче). Решта — порожнє місце потрібної висоти.

        [[key-extractor|keyExtractor]] дає кожному рядку ключ React. Без нього FlatList бере `item.key`, потім `item.id`, а як немає й цього — індекс.
      en: |
        A `ScrollView` with `map` creates **every** row at once: a thousand records are a thousand mounted components and native views, even when eight fit on the screen. The React Native documentation directly recommends [[flatlist|FlatList]] for long lists:

        ```jsx
        <FlatList
          data={tasks}                                   // the array of records
          renderItem={({ item }) => <TaskRow task={item} />}
          keyExtractor={(task) => task.id}               // a stable key per record
        />
        ```

        FlatList is the [[list-windowing|windowing]] you saw on the web, but built in. It first mounts the first `initialNumToRender` rows (10 by default), and then keeps a **render window** around the visible part — up to `windowSize` screen heights (21 by default: the screen plus up to ten above and below). The rest is empty space of the right height.

        [[key-extractor|keyExtractor]] gives each row a React key. Without it, FlatList takes `item.key`, then `item.id`, and if neither exists, the index.

  - id: predict-mounted
    kind: prediction
    runnable: false
    prompt:
      uk: "Планувальник має 1 000 синтетичних справ, рядок — 40 одиниць заввишки, на екрані вміщається 8. Скільки рядків змонтовано одразу після першого показу: у `FlatList` і в `ScrollView` з `map`?"
      en: "A planner has 1,000 synthetic tasks, a row is 40 units tall, and 8 fit on the screen. How many rows are mounted right after the first display: in a `FlatList` and in a `ScrollView` with `map`?"
    answer:
      type: choice
      options:
        - id: window-vs-all
          text:
            uk: "FlatList — перша порція в 10 рядків, далі вікно в кілька екранів; ScrollView — усі 1 000"
            en: "FlatList — a first batch of 10 rows, then a window of a few screens; ScrollView — all 1,000"
        - id: both-visible
          text:
            uk: "Обидва — лише 8 видимих: решту телефон не малює"
            en: "Both — only the 8 visible ones: the phone does not draw the rest"
          why:
            uk: "Не малювати й не створювати — різні речі. ScrollView створює компонент і view для кожного рядка, навіть того, що далеко за екраном; FlatList не створює їх зовсім."
            en: "Not drawing and not creating are different things. A ScrollView creates a component and a view for every row, even far off screen; a FlatList does not create them at all."
        - id: both-all
          text:
            uk: "Обидва — усі 1 000: FlatList лише швидше гортає"
            en: "Both — all 1,000: FlatList just scrolls faster"
          why:
            uk: "FlatList монтує лише вікно навколо видимої частини, а рядки поза ним замінює порожнім місцем. Саме тому він економить пам’ять."
            en: "FlatList mounts only a window around the visible part and replaces the rows outside it with empty space. That is exactly why it saves memory."
      correct: [window-vs-all]
    explanation:
      uk: "ScrollView монтує все, що отримав. FlatList починає з `initialNumToRender` (10) рядків, а потім, вимірявши екран, доповнює вікно до кількох екранів навколо видимої частини — але ніколи не всі 1 000, доки ти не прогорнеш увесь список. Приклад нижче показує лічильник змонтованих рядків."
      en: "A ScrollView mounts everything it got. A FlatList starts with `initialNumToRender` (10) rows and then, once it has measured the screen, fills a window of a few screens around the visible part — but never all 1,000 unless you scroll through the whole list. The example below shows a counter of mounted rows."

  - id: mounted-rows
    kind: example
    runtime: concept-preview
    dir: mounted-rows
    entry: main.jsx
    strings:
      task: { uk: "Справа", en: "Task" }
      switch: { uk: "перемкнути", en: "switch" }
      mounted: { uk: "Змонтовано рядків", en: "Mounted rows" }
    title:
      uk: "Скільки рядків існує насправді"
      en: "How many rows really exist"
    body:
      uk: |
        1 000 справ, рядок 40 одиниць, видима частина 320 — вісім рядків. Кожен `TaskRow` при монтуванні додає 1 до лічильника, при демонтуванні — віднімає.

        Натисни **Запустити** й подивись на «Змонтовано рядків» на **Сторінці**: для FlatList це спершу 10, а за мить, коли список виміряє екран, — кілька десятків (близько сотні, залежно від розміру панелі), але не тисяча. Перемкни на «ScrollView + map» — 1 000.
      en: |
        1,000 tasks, a 40-unit row, a 320-unit visible part — eight rows. Every `TaskRow` adds 1 to the counter when it mounts and subtracts 1 when it unmounts.

        Press **Run** and look at “Mounted rows” on the **Page**: for FlatList it is 10 at first and, a moment later, once the list has measured the screen, several tens (around a hundred, depending on the panel size), but not a thousand. Switch to “ScrollView + map” — 1,000.
    tryIt:
      uk: |
        1. Повернися до FlatList і прогорни список далеко вниз, до справи 400 чи далі: лічильник тримається в межах однієї-двох сотень — рядки, що вийшли з вікна, демонтуються. Перші 10 лишаються завжди: документація каже, що рядки першої порції не демонтуються, щоб швидко повернутися на початок.
        2. Додай FlatList проп `windowSize={3}` і запусти: вікно тепер — лише екран і по одному екрану вище й нижче, тож лічильник менший. Ціна — під час швидкого гортання можна на мить побачити порожнє місце: документація описує саме цей компроміс між пам’яттю й заповненням.
      en: |
        1. Switch back to FlatList and scroll far down the list, to task 400 or further: the counter stays within one or two hundred — rows that left the window are unmounted. The first 10 always stay: the documentation says the rows of the first batch are never unmounted, so that going back to the top is fast.
        2. Add the prop `windowSize={3}` to the FlatList and run: the window is now just the screen plus one screen above and one below, so the counter is smaller. The price: while scrolling fast you may briefly see empty space — the documentation describes exactly this trade-off between memory and fill.
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не нативний застосунок: точні числа тут залежать від браузера й розміру панелі, а не від телефона, і рядки — вузли DOM, а не нативні view. Немає пристрою, нативних модулів, жестів, крім миші й клавіатури, вигляду платформи й продуктивності телефона. Перегляд показує сам принцип вікна; швидкість і пам’ять великого списку перевіряють на пристрої."
      en: "This is a browser preview through react-native-web, not a native app: the exact numbers here depend on the browser and the panel size, not on a phone, and the rows are DOM nodes, not native views. There is no device, no native modules, no gestures beyond mouse and keyboard, no platform look and no phone performance. The preview shows the principle of the window; the speed and memory of a big list are checked on a device."

  - id: list-window
    kind: visual
    visual: diagram
    title:
      uk: "Вікно рендеру й ключі рядків"
      en: "The render window and row keys"
    textEquivalent:
      uk: "Список має 1 000 записів. ScrollView з map монтує всі 1 000 рядків. FlatList спершу монтує 10 рядків, а потім тримає вікно рендеру навколо видимої частини екрана; рядки вище й нижче вікна не змонтовані — замість них порожнє місце потрібної висоти. Коли користувач гортає, вікно зсувається: нові рядки монтуються, а ті, що вийшли з вікна, демонтуються разом зі своїм станом. Ключ кожного рядка прив’язує його стан до запису. Якщо ключ — id запису, недописана нотатка лишається біля свого запису, навіть коли на початок вставили новий. Якщо ключ — індекс, після вставки на початок кожен рядок отримує інший запис, а нотатка лишається на тій самій позиції — тобто біля чужого запису."
      en: "The list has 1,000 records. A ScrollView with map mounts all 1,000 rows. A FlatList first mounts 10 rows and then keeps a render window around the visible part of the screen; the rows above and below the window are not mounted — there is empty space of the right height instead. When the user scrolls, the window slides: new rows mount, and the ones that left the window unmount together with their state. Every row's key ties its state to a record. If the key is the record's id, a half-typed note stays with its record even when a new one is inserted at the top. If the key is the index, after an insert at the top every row gets a different record, while the note stays at the same position — that is, next to someone else's record."
    spec:
      layout: tb
      nodes:
        - { id: above, label: { uk: "вище вікна: порожнє місце", en: "above the window: empty space" }, w: 300 }
        - { id: window, label: { uk: "вікно рендеру: змонтовані рядки", en: "render window: mounted rows" }, w: 300 }
        - { id: screen, label: { uk: "видима частина екрана", en: "visible part of the screen" }, w: 300, shape: pill }
        - { id: below, label: { uk: "нижче вікна: порожнє місце", en: "below the window: empty space" }, w: 300 }
        - { id: keyid, label: { uk: "key = id: нотатка біля свого запису", en: "key = id: the note stays with its record" }, w: 300, shape: note }
        - { id: keyindex, label: { uk: "key = індекс: нотатка біля чужого", en: "key = index: the note sits by another record" }, w: 300, shape: note }
      edges:
        - { from: above, to: window, kind: line }
        - { from: window, to: screen, kind: line }
        - { from: screen, to: below, kind: line }
        - { from: below, to: keyid, kind: line }
        - { from: keyid, to: keyindex, kind: line }
      hidden: [keyid, keyindex]
      steps:
        - caption:
            uk: "`ScrollView` з `map`: змонтовані всі 1 000 рядків — і над екраном, і під ним."
            en: "A `ScrollView` with `map`: all 1,000 rows are mounted — above the screen and below it."
          highlight: [above, window, screen, below]
        - caption:
            uk: "`FlatList`: спершу 10 рядків, далі вікно рендеру навколо видимої частини. Вище й нижче — лише порожнє місце потрібної висоти."
            en: "`FlatList`: first 10 rows, then a render window around the visible part. Above and below there is only empty space of the right height."
          highlight: [window, screen]
          dim: [above, below]
        - caption:
            uk: "Користувач гортає — вікно зсувається. Рядки, що вийшли з нього, демонтуються **разом зі своїм станом**: недописаний текст у такому рядку зникне."
            en: "The user scrolls — the window slides. Rows that left it are unmounted **together with their state**: half-typed text in such a row disappears."
          highlight: [window]
          dim: [above, below]
          annotate:
            - { id: window, text: { uk: "вікно зсунулося", en: "the window slid" } }
        - caption:
            uk: "Ключ — `id` запису: після вставки на початок кожен рядок лишається біля свого запису, і нотатка теж."
            en: "The key is the record's `id`: after an insert at the top every row stays with its record, and so does the note."
          show: [keyid]
          highlight: [keyid]
          dim: [above, window, screen, below]
        - caption:
            uk: "Ключ — індекс: після вставки рядок з індексом 2 показує вже інший запис, а нотатка лишилася в ньому — біля чужого запису."
            en: "The key is the index: after the insert the row at index 2 shows another record, and the note stayed in it — next to someone else's record."
          show: [keyindex]
          highlight: [keyindex]
          dim: [above, window, screen, below, keyid]

  - id: predict-index-note
    kind: prediction
    runnable: false
    prompt:
      uk: "Трекер звичок показує три звички у `FlatList` з `keyExtractor={(habit, index) => String(index)}`. Кожен рядок тримає недописану нотатку у власному `useState`. Користувач почав нотатку біля третьої звички, «Пити воду», а потім на початок списку додали нову звичку. Біля якої звички тепер ця нотатка?"
      en: "A habit tracker shows three habits in a `FlatList` with `keyExtractor={(habit, index) => String(index)}`. Each row keeps a half-typed note in its own `useState`. The user started a note next to the third habit, “Drink water”, and then a new habit was added at the top of the list. Which habit is the note next to now?"
    answer:
      type: choice
      options:
        - id: second
          text:
            uk: "Біля другої звички, що тепер стоїть третьою, — не «Пити воду»"
            en: "Next to the second habit, which now stands third — not “Drink water”"
        - id: water
          text:
            uk: "Біля «Пити воду»: FlatList сам стежить, де який запис"
            en: "Next to “Drink water”: FlatList tracks on its own which record is where"
          why:
            uk: "FlatList розпізнає рядки лише за ключем, який ти дав. Ключ «2» тепер належить іншому запису, і стан рядка «2» іде до нього."
            en: "FlatList recognizes rows only by the key you gave it. The key “2” now belongs to another record, and the state of row “2” goes with it."
        - id: gone
          text:
            uk: "Ніде: нотатка зникає, бо список змінився"
            en: "Nowhere: the note disappears because the list changed"
          why:
            uk: "Рядок з ключем «2» не демонтувався — React бачить той самий ключ і лишає компонент разом із його станом, лише з іншим записом."
            en: "The row with key “2” was not unmounted — React sees the same key and keeps the component with its state, just with another record."
      correct: [second]
    explanation:
      uk: "Ключі `0`, `1`, `2` були й лишилися, плюс з’явився `3`. React зберігає стан за ключем, тож нотатка лишилася в рядку з ключем `2` — а там тепер друга звичка зі старого списку. Ключ з `id` прив’язав би нотатку до «Пити воду». Приклад нижче показує обидва варіанти."
      en: "Keys `0`, `1`, `2` existed before and still do, plus a new `3` appeared. React keeps state by key, so the note stayed in the row with key `2` — which now holds the second habit of the old list. A key from the `id` would have tied the note to “Drink water”. The example below shows both variants."

  - id: habit-notes
    kind: example
    runtime: concept-preview
    dir: habit-notes
    entry: main.jsx
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      note: { uk: "Нотатка", en: "Note" }
      addTop: { uk: "Додати звичку на початок", en: "Add a habit at the top" }
    title:
      uk: "Нотатка, що переїжджає"
      en: "A note that moves house"
    body:
      uk: |
        Ключі тут — індекси. Натисни **Запустити**, на **Сторінці** почни нотатку біля «Пити воду» й натисни «Додати звичку на початок». Нотатка тепер біля «Читати 20 хвилин».
      en: |
        The keys here are indexes. Press **Run**, on the **Page** start a note next to “Drink water” and press “Add a habit at the top”. The note is now next to “Read for 20 minutes”.
    tryIt:
      uk: "Заміни `keyExtractor` на `(habit) => habit.id` і повтори: нотатка лишається біля «Пити воду», хоч би скільки звичок додати згори."
      en: "Change `keyExtractor` to `(habit) => habit.id` and repeat: the note stays next to “Drink water”, however many habits you add at the top."
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не нативний застосунок: правила ключів і стану тут ті самі, що на телефоні, бо їх задає React, але немає пристрою, екранної клавіатури, нативних модулів, жестів, крім миші й клавіатури, вигляду платформи й продуктивності телефона."
      en: "This is a browser preview through react-native-web, not a native app: the rules of keys and state are the same here as on a phone, because React sets them, but there is no device, no on-screen keyboard, no native modules, no gestures beyond mouse and keyboard, no platform look and no phone performance."

  - id: state-above-the-list
    kind: explanation
    title:
      uk: "Де тримати чернетки"
      en: "Where to keep drafts"
    body:
      uk: |
        Навіть із правильними ключами стан усередині рядка FlatList ненадійний: документація попереджає, що він **не зберігається**, коли рядок виходить із вікна рендеру. Нотатку в рядку 5 буде втрачено, якщо прогорнути на 300 рядків нижче й назад.

        Тому дані, які не можна губити, тримай **над списком** — у стані екрана чи reducer, ключованими за `id`:

        ```jsx
        const [drafts, setDrafts] = useState({}); // { [record.id]: text }
        ```

        Рядок отримує `draft` і `onDraftChange` пропсами й нічого важливого сам не пам’ятає. Тоді й ключ-індекс, і демонтування не зможуть переплутати чи стерти чернетку.
      en: |
        Even with correct keys, state inside a FlatList row is unreliable: the documentation warns that it is **not preserved** when the row leaves the render window. A note in row 5 is lost if you scroll 300 rows down and back.

        So keep data that must not be lost **above the list** — in the screen's state or reducer, keyed by `id`:

        ```jsx
        const [drafts, setDrafts] = useState({}); // { [record.id]: text }
        ```

        The row receives `draft` and `onDraftChange` as props and remembers nothing important itself. Then neither an index key nor unmounting can mix up or erase a draft.

  - id: recall-keys
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: key-from-identity
        from: re-01-05-keys-identity
        prompt:
          uk: "У вебсписку справ кожен `<li>` має прапорець зі своїм станом. Який ключ лишить позначку біля правильної справи, коли список відсортують за терміном?"
          en: "In a web task list every `<li>` has a checkbox with its own state. Which key keeps the mark next to the right task when the list is sorted by due date?"
        answer:
          type: choice
          options:
            - id: id
              code: "key={task.id}"
            - id: index
              code: "key={index}"
              why:
                uk: "Після сортування на індексі 0 стоїть інша справа, а стан лишається з ключем 0."
                en: "After sorting, index 0 holds another task, while the state stays with key 0."
            - id: random
              code: "key={Math.random()}"
              why:
                uk: "Новий ключ на кожен рендер — React щоразу створює рядок заново, і будь-який стан зникає."
                en: "A new key on every render — React creates the row anew every time, and any state disappears."
          correct: [id]
        explanation:
          uk: "Ключ має описувати **ідентичність** запису, а не його місце. У FlatList те саме правило, тільки ключ дає `keyExtractor`."
          en: "A key must describe the record's **identity**, not its place. FlatList has the same rule; only the key comes from `keyExtractor`."
      - id: windowing-cost
        from: re-07-05-long-lists-windowing
        prompt:
          uk: "Список із windowing у вебі показує 30 рядків із 5 000. Користувач поставив фокус на кнопку в рядку й прогорнув далеко вниз. Що сталося з фокусом?"
          en: "A windowed web list shows 30 rows out of 5,000. The user put focus on a button in a row and scrolled far down. What happened to the focus?"
        answer:
          type: choice
          options:
            - id: lost
              text:
                uk: "Рядок вийшов з вікна й зник із DOM, а фокус упав на `body`"
                en: "The row left the window and disappeared from the DOM, and focus fell to `body`"
            - id: kept
              text:
                uk: "Фокус лишився на кнопці: браузер пам’ятає його й поза вікном"
                en: "Focus stayed on the button: the browser remembers it outside the window too"
              why:
                uk: "Поза вікном рядка немає взагалі — фокусу ні на чому лишатися."
                en: "Outside the window the row does not exist at all — there is nothing for focus to stay on."
          correct: [lost]
        explanation:
          uk: "Усе, що живе в рядку, зникає разом із ним, коли рядок виходить із вікна: у вебі — фокус, у FlatList — і стан компонента рядка."
          en: "Everything that lives in a row disappears with it when the row leaves the window: on the web, focus; in a FlatList, the row component's state too."

  - id: wish-list
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: wish-list
    entry: main.jsx
    editable: [WishList.jsx]
    strings:
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      book: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      mug: { uk: "Термочашка", en: "Travel mug" }
      plant: { uk: "Кімнатна рослина", en: "House plant" }
      acquired: { uk: "Отримано", en: "Acquired" }
      wanted: { uk: "Бажане", en: "Wanted" }
      note: { uk: "Нотатка", en: "Note" }
      empty: { uk: "Список бажань порожній", en: "The wishlist is empty" }
      addTop: { uk: "Додати бажання на початок", en: "Add a wish at the top" }
      draft: { uk: "подарунок на день народження", en: "birthday present" }
    title:
      uk: "Список бажань на FlatList"
      en: "A wishlist on FlatList"
    instructions:
      uk: |
        `WishList.jsx` зараз — `ScrollView` з `map` і ключами-індексами. Перепиши його на `FlatList`:

        - кожне бажання показує готова картка `WishCard`;
        - ключ кожного рядка — `id` бажання, тож нотатка в картці лишається біля свого бажання, коли нове додають на початок;
        - між картками — `Separator`, але не перед першою й не після останньої;
        - порожній список показує `EmptyWishes`.

        Перевірки також монтують твій список із 1 000 бажань і рахують картки: їх має бути менше за 500 — FlatList монтує лише вікно. `WishCard.jsx`, `Separator.jsx`, `EmptyWishes.jsx` і `main.jsx` редагувати не можна. Кнопка над списком у перегляді додає бажання на початок — спробуй на ній нотатку.
      en: |
        `WishList.jsx` is now a `ScrollView` with `map` and index keys. Rewrite it with `FlatList`:

        - every wish is shown by the ready `WishCard` card;
        - every row's key is the wish's `id`, so the note in a card stays with its wish when a new one is added at the top;
        - `Separator` goes between cards, but not before the first or after the last;
        - an empty list shows `EmptyWishes`.

        The checks also mount your list with 1,000 wishes and count the cards: there must be fewer than 500 — FlatList mounts only a window. `WishCard.jsx`, `Separator.jsx`, `EmptyWishes.jsx` and `main.jsx` cannot be edited. The button above the list in the preview adds a wish at the top — try a note with it.
    limits:
      uk: "Перевірки монтують список у перегляді react-native-web і рахують вузли, які він створив. Точна кількість змонтованих рядків на телефоні інша, а швидкість гортання й пам’ять тут не видно — їх перевіряють на пристрої."
      en: "The checks mount the list in the react-native-web preview and count the nodes it created. The exact number of mounted rows on a phone is different, and scrolling speed and memory are not visible here — they are checked on a device."
    testTitles:
      "the list shows every wish of a short list":
        uk: "Список показує кожне бажання короткого списку"
        en: "The list shows every wish of a short list"
      "a 1,000-wish list mounts only a window of rows":
        uk: "Для 1 000 бажань змонтовано лише вікно рядків (менше за 500)"
        en: "A 1,000-wish list mounts only a window of rows (fewer than 500)"
      "an empty list shows the empty message":
        uk: "Порожній список показує «Список бажань порожній»"
        en: "An empty list shows “The wishlist is empty”"
      "separators sit only between cards":
        uk: "Розділювачі стоять лише між картками"
        en: "Separators sit only between cards"
      "a half-typed note stays with its wish after a wish is added at the top":
        uk: "Недописана нотатка лишається біля свого бажання, коли нове додали на початок"
        en: "A half-typed note stays with its wish after a wish is added at the top"
    hints:
      nudge:
        uk: "У FlatList є окремі пропси для того, що ти зараз робиш вручну або не робиш зовсім: рядок, ключ, розділювач, порожній стан. Глянь, що з цього списку вже є в твоєму коді."
        en: "FlatList has separate props for what you now do by hand or not at all: the row, the key, the separator, the empty state. See which of these your code already has."
      explanation:
        uk: "`data` — масив, `renderItem` отримує об’єкт з полем `item` і повертає рядок, `keyExtractor` повертає ключ запису. `ItemSeparatorComponent` малюється лише між рядками, `ListEmptyComponent` — коли `data` порожній. Наприклад, список міст: `<FlatList data={cities} renderItem={({ item }) => <CityRow city={item} />} keyExtractor={(city) => city.code} ListEmptyComponent={NoCities} />`. Якщо ключ — індекс, стан картки після вставки на початок дістанеться іншому запису."
        en: "`data` is the array, `renderItem` receives an object with an `item` field and returns a row, `keyExtractor` returns the record's key. `ItemSeparatorComponent` is drawn only between rows, `ListEmptyComponent` when `data` is empty. For example, a list of cities: `<FlatList data={cities} renderItem={({ item }) => <CityRow city={item} />} keyExtractor={(city) => city.code} ListEmptyComponent={NoCities} />`. If the key is the index, a card's state goes to another record after an insert at the top."
    solutionNote:
      uk: "FlatList монтує лише вікно рядків, `keyExtractor={(wish) => wish.id}` прив’язує стан картки до бажання, `ItemSeparatorComponent` малює лінію лише між картками, а `ListEmptyComponent` показує порожній стан. Можна й без `keyExtractor`: типовий бере `item.id`, — але явний ключ показує читачеві коду, на чому тримається ідентичність."
      en: "FlatList mounts only a window of rows, `keyExtractor={(wish) => wish.id}` ties a card's state to its wish, `ItemSeparatorComponent` draws a line only between cards, and `ListEmptyComponent` shows the empty state. It also works without `keyExtractor`: the default takes `item.id` — but an explicit key shows the reader what identity rests on."
    feedback:
      - when: { test: "a 1,000-wish list mounts only a window of rows" }
        message:
          uk: "Ця перевірка монтує список із 1 000 бажань і очікує від 1 до 499 змонтованих карток. `ScrollView` з `map` монтує всі 1 000 — тут потрібен `FlatList`."
          en: "This check mounts a list of 1,000 wishes and expects between 1 and 499 mounted cards. A `ScrollView` with `map` mounts all 1,000 — a `FlatList` is needed here."
      - when: { test: "an empty list shows the empty message" }
        message:
          uk: "Ця перевірка монтує порожній список і очікує текст «Список бажань порожній» з `EmptyWishes`."
          en: "This check mounts an empty list and expects the text “The wishlist is empty” from `EmptyWishes`."
      - when: { test: "separators sit only between cards" }
        message:
          uk: "Ця перевірка очікує для 6 карток рівно 5 розділювачів. Якщо їх 6, розділювач малюється в кожному рядку, а не між рядками."
          en: "This check expects exactly 5 separators for 6 cards. If there are 6, the separator is drawn in every row rather than between rows."
      - when: { test: "a half-typed note stays with its wish after a wish is added at the top" }
        message:
          uk: "Ця перевірка вводить нотатку біля «Велосипед», додає бажання на початок і очікує нотатку біля «Велосипед», а біля «Настільна лампа» — порожньо. Ключ рядка має походити з `id` бажання, а не з індексу."
          en: "This check types a note next to “Bicycle”, adds a wish at the top and expects the note next to “Bicycle” and nothing next to “Desk lamp”. The row's key must come from the wish's `id`, not from the index."

  - id: to-project
    kind: transfer
    capstoneStep: RN-03
    body:
      uk: "У кроці проєкту список записів на `native/` стане `FlatList` з ключем за `id`: створення, редагування й видалення записів, а також зміна статусу мають лишати кожен рядок біля свого запису."
      en: "In the project step the record list in `native/` becomes a `FlatList` keyed by `id`: creating, editing, removing records and changing their status must keep every row next to its own record."
