id: js-07-03-try-catch-finally
unit: JS-07
title:
  uk: "try/catch/finally і поширення помилок"
  en: "try/catch/finally and propagation"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Простежити, як помилка йде вгору через функції, що викликали одна одну, до найближчого `try/catch`, і передбачити, які рядки коду буде пропущено."
    en: "Trace an error propagating up through callers to the nearest enclosing `try/catch` and predict which lines are skipped."
  - uk: "Використати `finally` для прибирання, яке має відбутися і після успіху, і після помилки, а помилки, які функція не може обробити, кинути далі — ту саму або загорнуту з `cause`."
    en: "Use `finally` for cleanup that must run on success and on failure, and rethrow errors the current function cannot handle — the same error or a wrapper with `cause`."
prerequisites: [js-07-02-throw-error-types-cause, js-06-10-events-default-behavior]
subskills:
  - { family: J-10, skill: "try/catch/finally", depth: intro }
  - { family: J-10, skill: "cleanup and propagation", depth: intro }
  - { family: J-10, skill: "Error types/cause and throw", depth: practice }
glossary: [try-catch, finally-block, error-propagation, rethrow]
selfCheck: [chain-order, listener-escape, save-task]

blocks:
  - id: catch-it
    kind: explanation
    title:
      uk: "try/catch: перехопити помилку"
      en: "try/catch: catching an error"
    body:
      uk: |
        Досі будь-яка помилка зупиняла весь запуск. [[try-catch|`try/catch`]] дає змогу її перехопити:

        ```js
        try {
          const total = sumAll(expenses);
          console.log(total);
        } catch (error) {
          console.log("not counted: " + error.message);
        }
        ```

        Якщо код у `try` — **або будь-яка функція, яку він викликав**, хоч на три кадри глибше, — кидає помилку, JavaScript зупиняє всі ці виклики й переходить у `catch`. Це [[error-propagation|поширення помилки]]: вона йде стеком угору до найближчого `catch`. Усі рядки коду між місцем помилки й `catch` пропускаються.

        `error` у дужках — кинутий об’єкт помилки з `name`, `message` і `stack`. Після `catch` програма продовжується як звичайно, з рядка коду після всієї конструкції.
      en: |
        So far any error stopped the whole run. [[try-catch|`try/catch`]] lets you catch it:

        ```js
        try {
          const total = sumAll(expenses);
          console.log(total);
        } catch (error) {
          console.log("not counted: " + error.message);
        }
        ```

        If the code in `try` — **or any function it called**, even three frames deeper — throws, JavaScript stops all those calls and jumps to `catch`. That is [[error-propagation|error propagation]]: the error travels up the stack to the nearest `catch`. Every line of code between the error and the `catch` is skipped.

        `error` in the brackets is the thrown error object with `name`, `message` and `stack`. After `catch` the program goes on as usual, from the line after the whole construction.

  - id: chain-order
    kind: prediction
    strings:
      building: { uk: "будую", en: "building" }
      allBuilt: { uk: "усе готово", en: "all built" }
      caught: { uk: "перехоплено:", en: "caught:" }
      finallyRan: { uk: "finally виконано", en: "finally ran" }
      after: { uk: "далі", en: "after" }
      uah: { uk: "грн", en: "UAH" }
    prompt:
      uk: "`buildRow` кидає помилку для бажання з від’ємною ціною. Що з’явиться в консолі?"
      en: "`buildRow` throws an error for a wish with a negative price. What appears in the console?"
    code: |
      function formatPrice(price) {
        return price + " %%uah%%";
      }

      function buildRow(wish) {
        console.log("%%building%% " + wish.id);
        if (wish.price < 0) {
          throw new RangeError("negative price: " + wish.price);
        }
        return wish.id + ": " + formatPrice(wish.price);
      }

      function buildRows(wishes) {
        const rows = [];
        for (const wish of wishes) {
          rows.push(buildRow(wish));
        }
        console.log("%%allBuilt%%");
        return rows;
      }

      try {
        const rows = buildRows([
          { id: "w-01", price: 80 },
          { id: "w-03", price: -240 },
          { id: "w-04", price: 25 },
        ]);
        console.log(rows.length);
      } catch (error) {
        console.log("%%caught%% " + error.message);
      } finally {
        console.log("%%finallyRan%%");
      }
      console.log("%%after%%");
    verify:
      logs: ["%%building%% w-01", "%%building%% w-03", "%%caught%% negative price: -240", "%%finallyRan%%", "%%after%%"]
    answer:
      type: choice
      options:
        - id: caught-finally-after
          code: "%%building%% w-01\n%%building%% w-03\n%%caught%% negative price: -240\n%%finallyRan%%\n%%after%%"
        - id: skips-bad-wish
          code: "%%building%% w-01\n%%building%% w-03\n%%building%% w-04\n%%allBuilt%%\n2\n%%finallyRan%%\n%%after%%"
          why:
            uk: "Помилка не пропускає одне бажання — вона зупиняє `buildRow`, цикл у `buildRows` і решту `try`. `w-04` вже не будується: виконання перестрибує в `catch`."
            en: "The error does not skip one wish — it stops `buildRow`, the loop in `buildRows` and the rest of `try`. `w-04` is never built: execution jumps to `catch`."
        - id: no-finally
          code: "%%building%% w-01\n%%building%% w-03\n%%caught%% negative price: -240\n%%after%%"
          why:
            uk: "`finally` виконується завжди: і коли `try` завершився без помилок, і коли помилку перехопив `catch`."
            en: "`finally` always runs: when `try` finished without errors, and when `catch` caught an error."
        - id: stops-after-catch
          code: "%%building%% w-01\n%%building%% w-03\n%%caught%% negative price: -240\n%%finallyRan%%"
          why:
            uk: "Перехоплена помилка вже не зупиняє програму: після `catch` і `finally` виконання йде далі, до наступного рядка коду."
            en: "A caught error no longer stops the program: after `catch` and `finally` execution goes on to the next line of code."
      correct: [caught-finally-after]
    explanation:
      uk: "`w-01` будується. Для `w-03` `buildRow` кидає `RangeError` — і пропускається все до найближчого `catch`: решта `buildRow`, цикл і `console.log` у `buildRows`, `console.log(rows.length)` у `try`. `catch` друкує повідомлення, потім завжди виконується `finally`, і програма йде далі."
      en: "`w-01` is built. For `w-03`, `buildRow` throws a `RangeError` — and everything up to the nearest `catch` is skipped: the rest of `buildRow`, the loop and the `console.log` in `buildRows`, the `console.log(rows.length)` in `try`. `catch` prints the message, then `finally` always runs, and the program goes on."

  - id: unwind-steps
    kind: visual
    visual: code-trace
    title:
      uk: "Крок за кроком: помилка йде до catch"
      en: "Step by step: the error travels to catch"
    textEquivalent:
      uk: "Програма вмикає прапорець busy і в блоці try викликає sumAll зі списком двох витрат. sumAll викликає addToTotal, а та — readAmount: у стеку викликів три кадри над кодом файла, і всі вони всередині try. Для e-04 сума додатна, readAmount повертає 9990, addToTotal друкує added e-04 і повертає суму. Для e-07 сума -500, тож readAmount кидає RangeError. Найближчого catch немає ні в readAmount, ні в addToTotal, ні в sumAll, тож JavaScript зупиняє всі три виклики: рядок коду з console.log у addToTotal, решта циклу й return у sumAll та рядок коду з total у try пропускаються. Виконання переходить у catch, де змінна error — кинутий об’єкт помилки, і catch друкує caught: amount must be above 0. Потім виконується finally і вимикає прапорець busy. Програма продовжується після всієї конструкції й друкує busy false."
      en: "The program turns the busy flag on and, inside the try block, calls sumAll with a list of two expenses. sumAll calls addToTotal, which calls readAmount: there are three frames on the call stack above the file’s code, and all of them are inside try. For e-04 the amount is positive, readAmount returns 9990, addToTotal prints added e-04 and returns the sum. For e-07 the amount is -500, so readAmount throws a RangeError. There is no catch in readAmount, in addToTotal or in sumAll, so JavaScript stops all three calls: the console.log line in addToTotal, the rest of the loop and the return in sumAll, and the total line in try are skipped. Execution jumps into catch, where the variable error is the thrown error object, and catch prints caught: amount must be above 0. Then finally runs and turns the busy flag off. The program goes on after the whole construction and prints busy false."
    spec:
      file: visuals/unwind.js
      captions:
        - at: { line: 22 }
          text:
            uk: "Прапорець `busy` вмикається перед роботою — наче індикатор «рахую…» на сторінці."
            en: "The `busy` flag is turned on before the work — like a “counting…” indicator on a page."
        - at: { line: 1, kind: call }
          text:
            uk: "Витрата `e-04`: у **Call stack** три кадри над кодом файла — `readAmount`, `addToTotal`, `sumAll`. Усі вони виконуються **всередині** `try`."
            en: "Expense `e-04`: the **Call stack** holds three frames above the file’s code — `readAmount`, `addToTotal`, `sumAll`. All of them run **inside** `try`."
        - at: { line: 10 }
          text:
            uk: "Для `e-04` усе гаразд: `readAmount` повернула суму, і `addToTotal` друкує в консоль повідомлення."
            en: "For `e-04` everything is fine: `readAmount` returned the amount, and `addToTotal` prints a line to the console."
        - at: { line: 3, kind: stmt }
          text:
            uk: "Витрата `e-07` має суму `-500`. Зараз `readAmount` кине `RangeError` — на три кадри глибше, ніж `try`."
            en: "Expense `e-07` has the amount `-500`. Now `readAmount` will throw a `RangeError` — three frames deeper than `try`."
        - at: { line: 3, kind: throw }
          text:
            uk: "Помилку кинуто. Найближчого `catch` немає ні в `readAmount`, ні в `addToTotal`, ні в `sumAll`, тож усі три виклики зупиняються. Пропускаються: `console.log` у `addToTotal` (рядок коду 10), решта циклу й `return` у `sumAll`, `console.log` у `try` (рядок коду 28)."
            en: "The error is thrown. There is no `catch` in `readAmount`, `addToTotal` or `sumAll`, so all three calls stop. Skipped: the `console.log` in `addToTotal` (line 10), the rest of the loop and the `return` in `sumAll`, the `console.log` in `try` (line 28)."
        - at: { line: 30 }
          text:
            uk: "Стек знову порожній, а виконання — у `catch`. Змінна `error` — той самий об’єкт `RangeError`, що його кинула `readAmount`."
            en: "The stack is empty again, and execution is in `catch`. The variable `error` is the same `RangeError` object that `readAmount` threw."
        - at: { line: 32 }
          text:
            uk: "`finally` виконується після `catch` — так само він виконався б і після успішного `try`. Прапорець `busy` вимикається за будь-якого результату."
            en: "`finally` runs after `catch` — it would run after a successful `try` just the same. The `busy` flag is turned off whatever the outcome."
        - at: { line: 34, kind: stmt }
          text:
            uk: "Помилку оброблено, тож програма просто йде далі — з рядка коду після всієї конструкції."
            en: "The error was handled, so the program simply goes on — from the line after the whole construction."

  - id: finally-and-rethrow
    kind: explanation
    title:
      uk: "finally і помилки, які не твої"
      en: "finally and errors that are not yours"
    body:
      uk: |
        [[finally-block|`finally`]] виконується **завжди**: після успішного `try`, після `catch` і навіть тоді, коли помилка йде далі чи функція виходить через `return`. Тому прибирання пишуть саме там:

        ```js
        function exportReport(expenses) {
          spinner.hidden = false;
          try {
            return buildCsv(expenses);   // may throw
          } finally {
            spinner.hidden = true;       // runs after return and after an error alike
          }
        }
        ```

        А `catch` має обробляти лише ті помилки, які функція **розуміє**. Решту — [[rethrow|кинути далі]]:

        ```js
        } catch (error) {
          if (!(error instanceof TypeError)) {
            throw error;                 // not ours: pass it on unchanged
          }
          showMessage("the discount was not applied");
        }
        ```

        `instanceof` питає, чи належить помилка до певного виду (у JS-02 ти бачив те саме для дат: `x instanceof Date`). Невідому помилку можна кинути ту саму або нову — з контекстом і оригіналом у `cause`. Найгірше — порожній `catch`: тоді помилка зникає без сліду.
      en: |
        [[finally-block|`finally`]] runs **always**: after a successful `try`, after `catch`, and even when the error goes further or the function leaves with `return`. That is why cleanup is written there:

        ```js
        function exportReport(expenses) {
          spinner.hidden = false;
          try {
            return buildCsv(expenses);   // may throw
          } finally {
            spinner.hidden = true;       // runs after return and after an error alike
          }
        }
        ```

        And `catch` should handle only the errors the function **understands**. The rest it [[rethrow|throws further]]:

        ```js
        } catch (error) {
          if (!(error instanceof TypeError)) {
            throw error;                 // not ours: pass it on unchanged
          }
          showMessage("the discount was not applied");
        }
        ```

        `instanceof` asks whether the error is of a certain kind (in JS-02 you saw the same for dates: `x instanceof Date`). An unknown error can be thrown again as it is, or as a new one — with context and the original in `cause`. The worst option is an empty `catch`: then the error vanishes without a trace.

  - id: wrap-cause
    kind: example
    runtime: browser-js
    dir: wrap-cause
    entry: index.js
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      gift: { uk: "Подарунок", en: "Gift" }
      lots: { uk: "багато", en: "a lot" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      imported: { uk: "Імпортовано витрат: ", en: "Expenses imported: " }
    title:
      uk: "Хто знає «що», а хто — «чому»"
      en: "Who knows “what” and who knows “why”"
    body:
      uk: |
        Тут три рівні. `toMinor` перетворює текст суми на копійки й кидає `TypeError`, якщо не може (`Math.round` округлює до цілого). `importExpense` перехоплює цю помилку й кидає нову: вона знає, **яку** витрату не вдалося імпортувати, а оригінал кладе в `cause`. `importAll` пропускає зламану витрату й іде далі. Натисни **Запустити**.
      en: |
        There are three levels here. `toMinor` turns the amount text into kopiykas and throws a `TypeError` when it cannot (`Math.round` rounds to a whole number). `importExpense` catches that error and throws a new one: it knows **which** expense could not be imported, and it puts the original into `cause`. `importAll` skips a broken expense and goes on. Press **Run**.
    tryIt:
      uk: |
        1. У консолі два рівні пояснення: `message` каже, **яку** витрату не імпортовано, а `cause` — **чому**. Імпортовано дві витрати з трьох.
        2. У `importAll` перенеси `try {` перед `for`, а `catch` — після кінця циклу. Запусти: тепер імпортовано лише одну витрату. Місце `try/catch` вирішує, що продовжиться після помилки. Поверни як було (Ctrl+Z).
        3. Прибери `, { cause: error }` в `importExpense` і запусти: замість причини консоль показує `undefined` — низькорівневе «чому» загубилося.
      en: |
        1. The console has two levels of explanation: `message` says **which** expense was not imported, and `cause` says **why**. Two expenses out of three were imported.
        2. In `importAll`, move `try {` in front of `for` and the `catch` after the end of the loop. Run: now only one expense is imported. Where `try/catch` stands decides what goes on after an error. Undo it (Ctrl+Z).
        3. Remove `, { cause: error }` in `importExpense` and run: instead of the cause, the console shows `undefined` — the low-level “why” is lost.

  - id: recall
    kind: review
    title:
      uk: "Згадай: коли працює обробник"
      en: "Recall: when a listener runs"
    items:
      - id: listener-later
        from: js-06-10-events-default-behavior
        prompt:
          uk: "`button.click()` імітує клік по кнопці. Що виведе програма?"
          en: "`button.click()` imitates a click on the button. What does the program print?"
        code: |
          const button = document.createElement("button");
          let clicks = 0;

          button.addEventListener("click", () => {
            clicks = clicks + 1;
            console.log("click " + clicks);
          });
          console.log("ready " + clicks);

          button.click();
          button.click();
          console.log("end " + clicks);
        verify:
          logs: ["ready 0", "click 1", "click 2", "end 2"]
        answer:
          type: choice
          options:
            - id: later
              code: "ready 0\nclick 1\nclick 2\nend 2"
            - id: at-registration
              code: "click 1\nready 1\nclick 2\nclick 3\nend 3"
              why:
                uk: "`addEventListener` лише запам’ятовує функцію. Сама функція виконується пізніше — щоразу, коли трапляється подія."
                en: "`addEventListener` only remembers the function. The function itself runs later — every time the event happens."
            - id: once
              code: "ready 0\nclick 1\nend 1"
              why:
                uk: "Обробник не зникає після першого виклику: він спрацьовує на кожну подію, доки його не прибрали."
                en: "A listener does not disappear after its first call: it runs for every event until it is removed."
          correct: [later]
        explanation:
          uk: "Реєстрація лише запам’ятовує функцію — тому «ready 0». Сам обробник виконується пізніше, щоразу, коли трапляється подія. Це важливо для наступного питання: на момент кліку код, що реєстрував обробник, уже давно завершився."
          en: "Registering only remembers the function — hence “ready 0”. The listener itself runs later, every time the event happens. That matters for the next question: by the time of the click, the code that registered the listener has long finished."

  - id: listener-escape
    kind: prediction
    strings:
      added: { uk: "обробник додано", en: "listener added" }
      caught: { uk: "перехоплено:", en: "caught:" }
      afterClick: { uk: "після кліку", en: "after the click" }
    prompt:
      uk: "`try` обгортає реєстрацію обробника, а обробник кидає помилку під час кліку. `button.click()` імітує клік. Що буде в консолі?"
      en: "`try` wraps the registration of a listener, and the listener throws an error during a click. `button.click()` imitates a click. What happens in the console?"
    code: |
      const button = document.createElement("button");
      document.body.append(button);

      try {
        button.addEventListener("click", () => {
          throw new Error("save failed");
        });
        console.log("%%added%%");
      } catch (error) {
        console.log("%%caught%% " + error.message);
      }

      button.click();
      console.log("%%afterClick%%");
    verify:
      logs: ["%%added%%", "%%afterClick%%"]
      error: Error
    answer:
      type: choice
      options:
        - id: escapes
          text:
            uk: "«обробник додано», «після кліку» — а `save failed` лишається необробленою помилкою"
            en: "“listener added”, “after the click” — and `save failed` stays an uncaught error"
        - id: caught
          text:
            uk: "«обробник додано», «перехоплено: save failed», «після кліку»"
            en: "“listener added”, “caught: save failed”, “after the click”"
          why:
            uk: "`try` завершився, щойно обробник зареєструвався. Коли згодом настає клік, браузер викликає обробник сам — поза будь-яким `try`, тож `catch` не спрацьовує."
            en: "`try` finished as soon as the listener was registered. When the click comes later, the browser calls the listener by itself — outside any `try`, so `catch` never runs."
        - id: caught-at-once
          text:
            uk: "«перехоплено: save failed» одразу, ще до кліку"
            en: "“caught: save failed” right away, before the click"
          why:
            uk: "`addEventListener` нічого не виконує — лише запам’ятовує функцію. Помилка може статися тільки тоді, коли обробник викличуть."
            en: "`addEventListener` runs nothing — it only remembers the function. The error can only happen when the listener is called."
        - id: stops-all
          text:
            uk: "«обробник додано», а потім помилка, і «після кліку» вже не з’являється"
            en: "“listener added”, then the error, and “after the click” never appears"
          why:
            uk: "Помилку обробника браузер повідомляє окремо — вона не потрапляє в код, який викликав `click()`. Тому наступний рядок коду виконується."
            en: "The browser reports a listener’s error separately — it does not reach the code that called `click()`. So the next line of code runs."
      correct: [escapes]
    explanation:
      uk: "`try/catch` перехоплює лише помилки, кинуті, **поки** виконується його блок. Блок завершився, щойно обробник зареєструвався. Під час кліку браузер викликає обробник окремо, тож його помилка — необроблена; а код після `click()` іде далі, бо помилку обробника браузер повідомляє окремо. Щоб обробити помилки обробника, `try/catch` ставлять **усередину** нього."
      en: "`try/catch` catches only errors thrown **while** its block runs. The block finished as soon as the listener was registered. During the click the browser calls the listener on its own, so its error is uncaught; and the code after `click()` goes on, because the browser reports a listener’s error separately. To handle a listener’s errors, `try/catch` goes **inside** it."

  - id: click-escape
    kind: example
    runtime: browser-js
    dir: click-escape
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      pageTitle: { uk: "Список бажань", en: "Wishlist" }
      countButton: { uk: "Порахувати суму", en: "Count the total" }
      headphones: { uk: "Навушники", en: "Headphones" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      counting: { uk: "Рахую…", en: "Counting…" }
      total: { uk: "Разом: ", en: "Total: " }
      uah: { uk: "грн", en: "UAH" }
      failed: { uk: "Не вдалося порахувати: ", en: "Could not count: " }
    title:
      uk: "try не там, де треба"
      en: "try in the wrong place"
    body:
      uk: |
        Кнопка рахує суму бажань. Поки рахує, вона вимкнена (`button.disabled = true`) і показує «Рахую…». Але в квитків на концерт ціни ще немає, тож `totalPrice` кидає `TypeError`. `try/catch` у коді є — тільки навколо реєстрації обробника. Натисни **Запустити**, а тоді кнопку на **Сторінці**.
      en: |
        The button counts the total of the wishes. While counting, it is disabled (`button.disabled = true`) and shows “Counting…”. But the concert tickets have no price yet, so `totalPrice` throws a `TypeError`. There is a `try/catch` in the code — only around the registration of the listener. Press **Run**, then the button on the **Page**.
    tryIt:
      uk: |
        1. Після кліку з’являється картка помилки, «Рахую…» так і висить, а кнопка лишається вимкненою: рядок коду, що мав її ввімкнути, не виконався. `catch` не спрацював.
        2. Перенеси `try/catch` **у** обробник: обгорни `try` лише рядок коду з `totalPrice`, а в `catch` покажи повідомлення помилки. `button.disabled = false;` перенеси в блок `finally` після `catch`. Зовнішній `try/catch` прибери. Запусти й натисни кнопку: тепер видно повідомлення, а кнопка знову активна.
        3. Дай квиткам ціну `30` замість `null` і запусти: сума з’являється, а `finally` так само вмикає кнопку.
      en: |
        1. After the click an error card appears, “Counting…” is stuck, and the button stays disabled: the line of code that should have enabled it never ran. `catch` did not run.
        2. Move the `try/catch` **into** the listener: wrap only the line with `totalPrice` in `try`, and show the error’s message in `catch`. Move `button.disabled = false;` into a `finally` block after `catch`. Remove the outer `try/catch`. Run and press the button: now you see the message, and the button is enabled again.
        3. Give the tickets the price `30` instead of `null` and run: the total appears, and `finally` enables the button just the same.

  - id: save-task
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: save-task
    entry: index.js
    strings:
      saved: { uk: "Збережено", en: "Saved" }
      full: { uk: "Планувальник заповнено: не більше 3 справ", en: "The planner is full: at most 3 tasks" }
      water: { uk: "Полити квіти", en: "Water the plants" }
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
      dentist: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
    title:
      uk: "Зберегти справу й прибрати за собою"
      en: "Save a task and clean up"
    instructions:
      uk: |
        Напиши `saveTask(task, store)` для планувальника. `store` — функція, яка зберігає справу або кидає помилку; її передають параметром, тож `saveTask` працює з будь-яким сховищем.

        - Поки `store` працює, `state.saving` дорівнює `true`, а потім **завжди** знову `false` — за будь-якого результату.
        - Успіх: `state.message` стає `MESSAGES.saved`, функція повертає `true`.
        - `RangeError` від `store` означає «планувальник заповнено»: `state.message` стає `MESSAGES.full`, функція повертає `false` і нічого не кидає.
        - Будь-яка інша помилка — не справа `saveTask`: вона має піти далі — та сама або нова з оригіналом у `cause`.

        Унизу файла готове сховище `storeInPlanner` (воно приймає щонайбільше три справи) і цикл, що зберігає чотири справи.
      en: |
        Write `saveTask(task, store)` for the planner. `store` is a function that saves the task or throws an error; it is passed in as a parameter, so `saveTask` works with any storage.

        - While `store` works, `state.saving` is `true`, and afterwards it is **always** `false` again — whatever the outcome.
        - Success: `state.message` becomes `MESSAGES.saved`, and the function returns `true`.
        - A `RangeError` from `store` means “the planner is full”: `state.message` becomes `MESSAGES.full`, and the function returns `false` and throws nothing.
        - Any other error is not `saveTask`’s business: it must go further — the same one, or a new one with the original in `cause`.

        At the bottom of the file there is a ready-made store, `storeInPlanner` (it accepts at most three tasks), and a loop that saves four tasks.
    testTitles:
      "returns true and reports success when the store accepts the task":
        uk: "Повертає true і повідомляє про успіх, коли сховище прийняло справу"
        en: "Returns true and reports success when the store accepts the task"
      "the saving flag is on while the store works":
        uk: "Прапорець saving увімкнений, поки працює сховище"
        en: "The saving flag is on while the store works"
      "the saving flag is off after a success":
        uk: "Прапорець saving вимкнений після успіху"
        en: "The saving flag is off after a success"
      "a RangeError becomes a message, not an error":
        uk: "RangeError стає повідомленням, а не помилкою"
        en: "A RangeError becomes a message, not an error"
      "the saving flag is off after a RangeError":
        uk: "Прапорець saving вимкнений після RangeError"
        en: "The saving flag is off after a RangeError"
      "any other error goes further":
        uk: "Будь-яка інша помилка йде далі"
        en: "Any other error goes further"
      "the saving flag is off even when the error goes further":
        uk: "Прапорець saving вимкнений навіть тоді, коли помилка йде далі"
        en: "The saving flag is off even when the error goes further"
    hints:
      nudge:
        uk: "Яку частину роботи треба зробити за будь-якого результату — успіху, обробленої помилки чи помилки, що йде далі?"
        en: "Which part of the work must happen whatever the outcome — success, a handled error or an error that goes further?"
      explanation:
        uk: "Виклик `store` обгорни в `try`. У `catch` спершу з’ясуй вид помилки через `instanceof`: `RangeError` обробляєш тут — повідомлення й `false`; будь-що інше кидаєш знову. Вимкнення прапорця постав у `finally`: цей блок виконується і після `return`, і після `throw`."
        en: "Wrap the call to `store` in `try`. In `catch`, first find out the kind of error with `instanceof`: a `RangeError` is handled right there — the message and `false`; anything else is thrown again. Put turning the flag off into `finally`: that block runs after `return` and after `throw` alike."
    solutionNote:
      uk: "`try` охоплює лише роботу, що може зламатися. `catch` обробляє одну відому ситуацію — заповнений планувальник — і кидає далі все інше, тож несподівана помилка не перетворюється на хибне «планувальник заповнено». `finally` вимикає прапорець за будь-якого виходу з функції: після `return true`, після `return false` і після `throw`."
      en: "`try` covers only the work that can break. `catch` handles one known situation — a full planner — and throws everything else further, so an unexpected error does not turn into a false “the planner is full”. `finally` turns the flag off however the function leaves: after `return true`, after `return false` and after `throw`."
    feedback:
      - when: { test: "returns true and reports success when the store accepts the task" }
        message:
          uk: "Коли `store` нічого не кидає, `saveTask` має викликати його з тією самою справою, записати в `state.message` значення `MESSAGES.saved` і повернути `true`."
          en: "When `store` throws nothing, `saveTask` must call it with that same task, put `MESSAGES.saved` into `state.message` and return `true`."
      - when: { test: "the saving flag is on while the store works" }
        message:
          uk: "Поки працює `store`, `state.saving` має бути `true`: увімкни прапорець ще до виклику `store`."
          en: "While `store` works, `state.saving` must be `true`: turn the flag on before calling `store`."
      - when: { test: "the saving flag is off after a success" }
        message:
          uk: "Після успішного збереження `state.saving` має знову бути `false`."
          en: "After a successful save `state.saving` must be `false` again."
      - when: { test: "a RangeError becomes a message, not an error" }
        message:
          uk: "`RangeError` від `store` означає «планувальник заповнено», і цю ситуацію `saveTask` обробляє сама: `state.message` стає `MESSAGES.full`, функція повертає `false` і нічого не кидає далі."
          en: "A `RangeError` from `store` means “the planner is full”, and `saveTask` handles this situation itself: `state.message` becomes `MESSAGES.full`, the function returns `false` and throws nothing further."
      - when: { test: "the saving flag is off after a RangeError" }
        message:
          uk: "Після `RangeError` прапорець `state.saving` теж має повернутися до `false`."
          en: "After a `RangeError` the `state.saving` flag must return to `false` as well."
      - when: { test: "any other error goes further" }
        message:
          uk: "Помилку іншого виду `saveTask` не обробляє: вона має піти далі — та сама або нова, у якої оригінал лежить у `cause`. Якщо `catch` не кидає її знову, вона зникає без сліду, а якщо кидає нову без `cause` — губиться причина."
          en: "An error of another kind is not handled by `saveTask`: it must go further — the same one, or a new one with the original in `cause`. If `catch` does not throw it again, it vanishes without a trace; if it throws a new one without `cause`, the reason is lost."
      - when: { test: "the saving flag is off even when the error goes further" }
        message:
          uk: "Навіть коли помилка йде далі, `state.saving` має повернутися до `false`. Код, що стоїть після `throw` у `catch`, уже не виконується — для такого прибирання є `finally`."
          en: "Even when the error goes further, `state.saving` must return to `false`. Code after `throw` in `catch` never runs — that kind of cleanup is what `finally` is for."

  - id: to-project
    kind: transfer
    capstoneStep: JS-07
    body:
      uk: "У кроці проєкту завантаження збережених записів може зламатися. Обгорни в `try/catch` саме те місце, де ти знаєш, що робити з помилкою, — показати повідомлення й почати з початкових записів, — а прибирання на зразок вимкненого індикатора завантаження постав у `finally`."
      en: "In the project step, loading saved records can break. Wrap in `try/catch` exactly the place where you know what to do with the error — show a message and start from the starting records — and put cleanup such as turning off a loading indicator into `finally`."
