id: js-07-05-persist-reload
unit: JS-07
title:
  uk: "Зберігаємо й відновлюємо дані в ізольованому сховищі"
  en: "Persist and reload with isolated storage"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Зберегти записи як JSON `{ schemaVersion, records }` під ключем із версією в ізольованому сховищі вправи й відновити їх після перезапуску."
    en: "Save records as `{ schemaVersion, records }` JSON under a versioned key in the sandbox’s isolated storage and reload them after a restart."
  - uk: "Перевірити збережені дані під час завантаження й працювати далі з видимим повідомленням, коли їх немає, вони не читаються, мають іншу версію чи містять неправильні записи, — не втративши оригіналу."
    en: "Validate stored data on load and keep working with a visible message when it is missing, unparsable, the wrong version or holds invalid records, without losing the original."
  - uk: "Пояснити, що збережені дані належать адресі сторінки в цьому браузері, тож той самий застосунок за іншою адресою починає з порожнього сховища."
    en: "Explain that the stored data belongs to this page’s address in this browser, so the same app opened at another address starts empty."
prerequisites: [js-07-04-json, js-02-11-independent-validation]
subskills:
  - { family: J-10, skill: "JSON parse/serialize limitations", depth: practice }
glossary: [persistence, storage-key, schema-version]
selfCheck: [only-text, four-loads, load-records]

blocks:
  - id: storage-basics
    kind: explanation
    title:
      uk: "localStorage: текст, що переживає перезапуск"
      en: "localStorage: text that survives a restart"
    body:
      uk: |
        Усе, що програма тримає в змінних, зникає, щойно сторінку закрили чи оновили. Щоб дані лишалися — це називають [[persistence|збереженням (persistence)]], — браузер дає `localStorage`:

        ```js
        localStorage.setItem("jsll.planner.v1", text); // save text under a key
        localStorage.getItem("jsll.planner.v1");       // that text, or null when nothing is saved
        localStorage.removeItem("jsll.planner.v1");    // delete it
        ```

        - Сховище тримає **лише текст**, тож записи спершу перетворюють на JSON.
        - [[storage-key|Ключ]] містить назву проєкту й версію: `jsll.planner.v1`.
        - Самі дані загортають в об’єкт `{ schemaVersion: 1, records: [...] }`. [[schema-version|Версія схеми]] каже, яку форму мають дані, — і наступна версія застосунку впізнає старі дані.

        Сховище належить **адресі сторінки** — схемі (`http`), хосту (`localhost`) і порту (`5173`) — у цьому браузері. На платформі кожен приклад і кожна вправа мають власне окреме сховище: його видно на вкладці **Сховище**.
      en: |
        Everything a program keeps in variables vanishes as soon as the page is closed or reloaded. To keep data — that is called [[persistence]] — the browser offers `localStorage`:

        ```js
        localStorage.setItem("jsll.planner.v1", text); // save text under a key
        localStorage.getItem("jsll.planner.v1");       // that text, or null when nothing is saved
        localStorage.removeItem("jsll.planner.v1");    // delete it
        ```

        - The storage keeps **only text**, so records are turned into JSON first.
        - The [[storage-key|key]] holds the project name and a version: `jsll.planner.v1`.
        - The data itself is wrapped in an object `{ schemaVersion: 1, records: [...] }`. The [[schema-version|schema version]] says which shape the data has — so the next version of the app recognizes old data.

        The storage belongs to the **page’s address** — the scheme (`http`), the host (`localhost`) and the port (`5173`) — in this browser. On the platform every example and every exercise has its own separate storage: you can see it on the **Storage** tab.

  - id: only-text
    kind: prediction
    prompt:
      uk: "У сховище кладуть число й об’єкт. Що надрукує програма?"
      en: "A number and an object are put into storage. What does the program print?"
    code: |
      localStorage.setItem("count", 3);
      localStorage.setItem("wish", { id: "w-01", price: 80 });

      console.log(typeof localStorage.getItem("count"), localStorage.getItem("wish"));
    verify:
      logs: ["string [object Object]"]
    answer:
      type: choice
      options:
        - id: text-only
          code: "string [object Object]"
        - id: kept-as-is
          code: 'number {id: "w-01", price: 80}'
          why:
            uk: "Сховище не тримає чисел чи об’єктів: усе, що в нього кладуть, стає текстом. Тому `getItem` завжди повертає текст (або `null`)."
            en: "The storage does not keep numbers or objects: whatever goes into it becomes text. That is why `getItem` always returns text (or `null`)."
        - id: json-for-free
          code: 'string {"id":"w-01","price":80}'
          why:
            uk: "`setItem` не робить JSON сам: він перетворює значення на текст так, як `String(value)`, а для об’єкта це `\"[object Object]\"`. JSON треба робити самому — `JSON.stringify`."
            en: "`setItem` does not make JSON by itself: it turns the value into text the way `String(value)` does, and for an object that is `\"[object Object]\"`. You have to make the JSON yourself — `JSON.stringify`."
      correct: [text-only]
    explanation:
      uk: "Сховище перетворює кожне значення на текст: `3` стає `\"3\"`, а об’єкт — на `\"[object Object]\"`, і дані бажання просто губляться. Тому перед `setItem` завжди `JSON.stringify`, а після `getItem` — `JSON.parse`."
      en: "The storage turns every value into text: `3` becomes `\"3\"`, and the object becomes `\"[object Object]\"` — the wish’s data is simply lost. That is why `JSON.stringify` always comes before `setItem`, and `JSON.parse` after `getItem`."

  - id: other-address
    kind: prediction
    prompt:
      uk: "Ти зберіг список бажань у застосунку, відкритому за адресою `http://localhost:5173`. Потім у тому самому браузері відкриваєш той самий застосунок за адресою `http://127.0.0.1:5173`. Що він знайде у своєму `localStorage`?"
      en: "You saved your wishlist in an app opened at `http://localhost:5173`. Then, in the same browser, you open the same app at `http://127.0.0.1:5173`. What does it find in its `localStorage`?"
    answer:
      type: choice
      options:
        - id: empty
          text:
            uk: "Нічого: адреса інша, тож і сховище інше"
            en: "Nothing: the address is different, so the storage is different too"
        - id: same-list
          text:
            uk: "Той самий список: це той самий комп’ютер і той самий застосунок"
            en: "The same list: it is the same computer and the same app"
          why:
            uk: "Сховище прив’язане до адреси сторінки — схеми, хосту й порту. `localhost` і `127.0.0.1` ведуть на той самий комп’ютер, але для браузера це різні хости."
            en: "The storage is tied to the page’s address — the scheme, the host and the port. `localhost` and `127.0.0.1` lead to the same computer, but for the browser they are different hosts."
        - id: from-server
          text:
            uk: "Список, який браузер підтягне із сервера застосунку"
            en: "The list, which the browser fetches from the app’s server"
          why:
            uk: "`localStorage` ніколи не покидає браузера: сервер про нього нічого не знає."
            en: "`localStorage` never leaves the browser: the server knows nothing about it."
      correct: [empty]
    explanation:
      uk: "Дані `localStorage` належать адресі сторінки — схемі, хосту й порту — у конкретному браузері. Інший хост, інший порт, інший браузер чи інший профіль браузера — і застосунок починає з порожнього сховища. Детальніше про те, що браузер вважає «тією самою адресою», — у JS-16."
      en: "`localStorage` data belongs to the page’s address — the scheme, the host and the port — in one particular browser. Another host, another port, another browser or another browser profile, and the app starts with empty storage. What the browser considers “the same address” is covered in detail in JS-16."

  - id: four-loads
    kind: prediction
    prompt:
      uk: "`naiveTotal` читає збережені витрати без жодних перевірок, а `show` друкує суму або назву помилки, яку кинула `naiveTotal`. Сховище чотири рази змінюють. Що надрукує програма?"
      en: "`naiveTotal` reads saved expenses without any checks, and `show` prints either the total or the name of the error `naiveTotal` threw. The storage is changed four times. What does the program print?"
    code: |
      const KEY = "jsll.expenses.v1";

      function naiveTotal() {
        const saved = JSON.parse(localStorage.getItem(KEY));
        let total = 0;
        for (const expense of saved.records) {
          total = total + expense.amountMinor;
        }
        return total;
      }

      function show(label) {
        try {
          console.log(label + ": " + naiveTotal());
        } catch (error) {
          console.log(label + ": " + error.name);
        }
      }

      localStorage.setItem(KEY, JSON.stringify({ schemaVersion: 1, records: [{ amountMinor: 9990 }, { amountMinor: 18000 }] }));
      show("A");
      localStorage.removeItem(KEY);
      show("B");
      localStorage.setItem(KEY, "not json");
      show("C");
      localStorage.setItem(KEY, JSON.stringify({ schemaVersion: 1, records: [{ amountMinor: 9990 }, { amountMinor: "80" }] }));
      show("D");
    verify:
      logs: ["A: 27990", "B: TypeError", "C: SyntaxError", "D: 999080"]
    answer:
      type: choice
      options:
        - id: all-four
          code: "A: 27990\nB: TypeError\nC: SyntaxError\nD: 999080"
        - id: parse-null-throws
          code: "A: 27990\nB: SyntaxError\nC: SyntaxError\nD: 10070"
          why:
            uk: "`JSON.parse(null)` не кидає помилки: `null` стає текстом `\"null\"`, а це правильний JSON. `TypeError` з’являється рядком коду нижче — під час читання `.records` у `null`. А `\"80\"` — текст, тож `9990 + \"80\"` склеює: `\"999080\"`."
            en: "`JSON.parse(null)` does not throw: `null` becomes the text `\"null\"`, which is valid JSON. The `TypeError` comes one line of code later — when reading `.records` of `null`. And `\"80\"` is text, so `9990 + \"80\"` glues: `\"999080\"`."
        - id: empty-is-zero
          code: "A: 27990\nB: 0\nC: SyntaxError\nD: 10070"
          why:
            uk: "Порожнє сховище — це не порожній список: `getItem` дає `null`, а в `null` немає `records`. А сума з текстом `\"80\"` не додає, а склеює."
            en: "Empty storage is not an empty list: `getItem` gives `null`, and `null` has no `records`. And a sum with the text `\"80\"` does not add, it glues."
        - id: d-throws
          code: "A: 27990\nB: TypeError\nC: SyntaxError\nD: TypeError"
          why:
            uk: "Для `D` ніщо не кидає: `+` з текстом просто склеює. Результат тихо неправильний — найпідступніший випадок."
            en: "Nothing throws for `D`: `+` with text simply glues. The result is quietly wrong — the sneakiest case."
      correct: [all-four]
    explanation:
      uk: "Лише `A` дає правильну суму. `B`: нічого не збережено, `getItem` дає `null`, `JSON.parse(null)` — теж `null` без помилки, а читання `.records` у `null` кидає `TypeError`. `C`: текст не JSON — `SyntaxError`. `D`: формально все читається, але сума — текст `\"80\"`, і `+` склеює `9990` і `\"80\"` у `\"999080\"`. Збережене не обов’язково повертається таким, яким ти його зберігав: його треба перевіряти."
      en: "Only `A` gives the right total. `B`: nothing is saved, `getItem` gives `null`, `JSON.parse(null)` is `null` too, with no error, and reading `.records` of `null` throws a `TypeError`. `C`: the text is not JSON — a `SyntaxError`. `D`: formally everything reads fine, but an amount is the text `\"80\"`, and `+` glues `9990` and `\"80\"` into `\"999080\"`. What was saved does not necessarily come back the way you saved it: it has to be checked."

  - id: recall
    kind: review
    title:
      uk: "Згадай: текст «80» і число 80"
      en: "Recall: the text “80” and the number 80"
    items:
      - id: loose-equal
        from: js-02-02-equality-coercion
        prompt:
          uk: "У збереженій витраті сума записана текстом. Що надрукує програма?"
          en: "In a saved expense the amount is written as text. What does the program print?"
        code: |
          const stored = { amountMinor: "80" };
          console.log(stored.amountMinor == 80, stored.amountMinor === 80);
        verify:
          logs: ["true false"]
        answer:
          type: choice
          options:
            - id: loose-true
              code: "true false"
            - id: both-true
              code: "true true"
              why:
                uk: "`===` порівнює й тип: текст `\"80\"` і число `80` для нього різні значення."
                en: "`===` compares the type too: for it, the text `\"80\"` and the number `80` are different values."
            - id: both-false
              code: "false false"
              why:
                uk: "`==` спершу перетворює текст на число, тож `\"80\" == 80` дає `true`."
                en: "`==` first converts the text into a number, so `\"80\" == 80` gives `true`."
          correct: [loose-true]
        explanation:
          uk: "`==` ховає різницю між текстом і числом, а `===` її показує. Під час перевірки збережених даних це важливо: перевірка через `==` пропустила б суму-текст, а далі `+` склеїв би її з іншими числами."
          en: "`==` hides the difference between text and a number, while `===` shows it. When checking stored data this matters: a check with `==` would let a text amount through, and later `+` would glue it to other numbers."

  - id: check-on-load
    kind: explanation
    title:
      uk: "Перевіряй під час завантаження"
      en: "Check on load"
    body:
      uk: |
        Завантаження — це місце, де в програму заходять дані ззовні. Перевіряй їх по черзі:

        | Ситуація | Як помітити | Що робити |
        |---|---|---|
        | нічого не збережено | `getItem` дав `null` | почати з початкових записів, без попередження |
        | текст не JSON | `JSON.parse` кинув `SyntaxError` | попередити, зберегти копію, почати з початкових записів |
        | інша форма чи версія | `schemaVersion !== 1` або `records` — не масив | те саме |
        | неправильний запис | перевірка запису повернула `ok: false` | те саме |

        - `null` перевіряй **до** `JSON.parse`: `JSON.parse(null)` не кидає помилки, а тихо дає `null`.
        - Версію порівнюй через `===`, бо `"1" == 1` — `true`. `Array.isArray(value)` відповідає, чи значення — масив.
        - Перш ніж щось замінити, **збережи оригінальний текст** під окремим ключем, наприклад `jsll.planner.v1.backup`. Тоді зіпсовані дані можна буде відновити вручну, а не втратити.
      en: |
        Loading is where data from outside enters the program. Check it step by step:

        | Situation | How to notice | What to do |
        |---|---|---|
        | nothing is saved | `getItem` gave `null` | start from the starting records, no warning |
        | the text is not JSON | `JSON.parse` threw a `SyntaxError` | warn, keep a copy, start from the starting records |
        | another shape or version | `schemaVersion !== 1`, or `records` is not an array | the same |
        | an invalid record | the record check returned `ok: false` | the same |

        - Check for `null` **before** `JSON.parse`: `JSON.parse(null)` does not throw, it quietly gives `null`.
        - Compare the version with `===`, because `"1" == 1` is `true`. `Array.isArray(value)` answers whether a value is an array.
        - Before you replace anything, **keep the original text** under a separate key, for example `jsll.planner.v1.backup`. Then damaged data can be recovered by hand instead of being lost.

  - id: load-sequence
    kind: visual
    visual: sequence
    title:
      uk: "Зберегти, закрити, відкрити знову"
      en: "Save, close, open again"
    textEquivalent:
      uk: "Учасники — код сторінки й localStorage. Код записує під ключ jsll.wishlist.v1 текст JSON з schemaVersion 1 і списком бажань. Сторінку закривають і відкривають знову: усе, що було в змінних, зникло, а сховище лишилося. Під час старту код просить getItem із тим самим ключем і отримує назад текст — не об’єкти. Він розбирає текст через JSON.parse, перевіряє, що schemaVersion дорівнює 1 і що кожне бажання правильне, і показує список. Під час наступного старту під ключем виявляється зіпсований текст not json. JSON.parse кидає SyntaxError, код перехоплює її і, перш ніж щось змінювати, записує оригінальний текст під ключ jsll.wishlist.v1.backup. Тоді він показує попередження й починає з початкових записів. Якби під ключем не було нічого, getItem повернув би null, і код просто почав би з початкових записів без попередження."
      en: "The participants are the page code and localStorage. The code writes JSON text with schemaVersion 1 and a list of wishes under the key jsll.wishlist.v1. The page is closed and opened again: everything that was in variables is gone, but the storage stayed. On start the code asks getItem with the same key and gets text back — not objects. It parses the text with JSON.parse, checks that schemaVersion is 1 and that every wish is valid, and shows the list. On the next start the key holds damaged text, not json. JSON.parse throws a SyntaxError, the code catches it and, before changing anything, writes the original text under the key jsll.wishlist.v1.backup. Then it shows a warning and starts from the starting records. If the key held nothing, getItem would return null, and the code would simply start from the starting records without a warning."
    spec:
      actors:
        - { id: page, label: { uk: "Код сторінки", en: "Page code" } }
        - { id: storage, label: "localStorage" }
      intro:
        uk: "Двоє учасників: код сторінки, який живе лише поки сторінка відкрита, і `localStorage`, що зберігає текст між запусками."
        en: "Two participants: the page code, which lives only while the page is open, and `localStorage`, which keeps text between runs."
      messages:
        - from: page
          to: storage
          label: 'setItem("jsll.wishlist.v1", text)'
          note:
            uk: 'text = JSON.stringify({ schemaVersion: 1, records })'
            en: 'text = JSON.stringify({ schemaVersion: 1, records })'
          caption:
            uk: "Зберегти: записи → JSON → текст під ключем із версією. Сховище бачить лише текст."
            en: "Save: records → JSON → text under a versioned key. The storage sees only text."
        - from: page
          to: page
          kind: note
          label: { uk: "сторінку закрили й відкрили", en: "the page is closed and opened" }
          caption:
            uk: "Сторінку закрили й відкрили знову. Змінні зникли разом зі старим запуском, а сховище лишилося."
            en: "The page is closed and opened again. The variables vanished with the old run, but the storage stayed."
        - from: page
          to: storage
          label: 'getItem("jsll.wishlist.v1")'
          caption:
            uk: "Старт: код просить текст за тим самим ключем. Якби там нічого не було, відповіддю був би `null` — і код почав би з початкових записів без попередження."
            en: "Start: the code asks for the text under the same key. Had nothing been there, the answer would be `null` — and the code would start from the starting records without a warning."
        - from: storage
          to: page
          kind: return
          label: '{"schemaVersion":1,"records":[…]}'
          caption:
            uk: "Повертається **текст**, не об’єкти. Яким би він не був, програма ще не знає, чи йому можна вірити."
            en: "What comes back is **text**, not objects. Whatever it is, the program does not know yet whether it can be trusted."
        - from: page
          to: page
          kind: note
          label: { uk: "JSON.parse → версія 1? → кожне бажання правильне?", en: "JSON.parse → version 1? → every wish valid?" }
          caption:
            uk: "Перевірки по черзі: розбір, версія, кожен запис. Усе гаразд — список з’являється на сторінці."
            en: "Checks one after another: parsing, version, every record. All fine — the list appears on the page."
        - from: page
          to: storage
          label: 'getItem("jsll.wishlist.v1")'
          caption:
            uk: "Наступний старт. Цього разу під ключем щось зіпсувалося."
            en: "The next start. This time something under the key got damaged."
        - from: storage
          to: page
          kind: return
          label: '"not json"'
          caption:
            uk: "Сховище чесно віддає те, що в ньому лежить, — навіть якщо це вже не JSON."
            en: "The storage honestly hands over what it holds — even if it is no longer JSON."
        - from: page
          to: page
          kind: note
          label: { uk: "JSON.parse кидає SyntaxError → catch", en: "JSON.parse throws SyntaxError → catch" }
          caption:
            uk: "`JSON.parse` кидає `SyntaxError`, і `catch` її перехоплює: сторінка не падає."
            en: "`JSON.parse` throws a `SyntaxError`, and `catch` catches it: the page does not crash."
        - from: page
          to: storage
          label: 'setItem("jsll.wishlist.v1.backup", "not json")'
          caption:
            uk: "**Спершу копія:** оригінальний текст іде під окремий ключ. Лише тепер його можна замінювати."
            en: "**Copy first:** the original text goes under a separate key. Only now may it be replaced."
        - from: page
          to: page
          kind: note
          label: { uk: "попередження + початкові записи", en: "warning + starting records" }
          caption:
            uk: "Сторінка показує попередження й починає з початкових записів. Користувач знає, що сталося, а зіпсовані дані не загубилися."
            en: "The page shows a warning and starts from the starting records. The user knows what happened, and the damaged data is not lost."

  - id: saved-wishes
    kind: example
    runtime: browser-js
    dir: saved-wishes
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      pageTitle: { uk: "Список бажань", en: "Wishlist" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      tickets: { uk: "Квитки на концерт", en: "Concert tickets" }
      acquired: { uk: "отримано", en: "acquired" }
      firstStart: { uk: "Перший запуск: список узято з початкових записів.", en: "First start: the list comes from the starting records." }
      loaded: { uk: "Список завантажено зі сховища.", en: "The list was loaded from storage." }
      loadFailed: { uk: "Не вдалося завантажити: ", en: "Could not load: " }
      damaged: { uk: "Збережені дані зіпсовані. Оригінал збережено під ключем jsll.wishlist.v1.backup, а список почато з початкових записів.", en: "The saved data is damaged. The original is kept under the key jsll.wishlist.v1.backup, and the list starts from the starting records." }
    title:
      uk: "Список бажань, що пам’ятає себе"
      en: "A wishlist that remembers itself"
    body:
      uk: |
        Сторінка завантажує бажання зі сховища, перевіряє їх і зберігає після кожної зміни. Тут інший підхід, ніж у таблиці вище: будь-яку проблему `loadWishes` кидає як помилку всередині `try`, а один `catch` робить копію тексту й повертає початкові записи — **фікстури** проєкту. Позначка «отримано» — прапорець (checkbox) біля кожного бажання. Натисни **Запустити** й подивись на повідомлення над списком.
      en: |
        The page loads the wishes from storage, checks them and saves after every change. The approach differs from the table above: `loadWishes` throws every problem as an error inside `try`, and one `catch` copies the text and returns the starting records — the project’s **fixtures**. The “acquired” mark is a checkbox next to every wish. Press **Run** and look at the message above the list.
    tryIt:
      uk: |
        1. Перший запуск: список із початкових записів. Познач бажання «Настільна лампа» як отримане й відкрий вкладку **Сховище**: під ключем `jsll.wishlist.v1` лежить текст JSON.
        2. Запусти ще раз — це як закрити й знову відкрити сторінку. Позначка на місці, а повідомлення каже, що список завантажено зі сховища.
        3. Додай на початок `main.js` рядок коду `localStorage.setItem("jsll.wishlist.v1", "not json");` і запусти. З’являється попередження, у консолі — причина, список починається з початкових записів, а на вкладці **Сховище** оригінал лежить під ключем `jsll.wishlist.v1.backup`. Прибери доданий рядок коду й запусти ще раз: тепер завантажуються збережені початкові записи.
        4. Натисни **Очистити сховище** на вкладці **Сховище** й запусти знову — знову перший запуск.
      en: |
        1. First start: the list comes from the starting records. Mark “Desk lamp” as acquired and open the **Storage** tab: the key `jsll.wishlist.v1` holds JSON text.
        2. Run again — that is like closing and reopening the page. The mark is still there, and the message says the list was loaded from storage.
        3. Add the line `localStorage.setItem("jsll.wishlist.v1", "not json");` at the start of `main.js` and run. A warning appears, the console shows the reason, the list starts from the starting records, and on the **Storage** tab the original sits under the key `jsll.wishlist.v1.backup`. Remove the added line and run once more: now the saved starting records load.
        4. Press **Clear storage** on the **Storage** tab and run again — a first start once more.

  - id: load-records
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: load-records
    entry: index.js
    strings:
      water: { uk: "Полити квіти", en: "Water the plants" }
      grandma: { uk: "Написати бабусі", en: "Write to grandma" }
    title:
      uk: "Завантажити планувальник обережно"
      en: "Load the planner carefully"
    instructions:
      uk: |
        Напиши `loadRecords(storage)` для планувальника. `storage` — об’єкт із `getItem` і `setItem`, як `localStorage`. Дані лежать під ключем `KEY` у вигляді `{ schemaVersion: 1, records: [...] }`. Функція повертає:

        - `{ ok: true, records }` — коли все гаразд (порожній список теж правильний);
        - `{ ok: false, reason: "missing" }` — коли під ключем нічого немає;
        - `{ ok: false, reason: "unparsable" }` — коли текст не читається як JSON;
        - `{ ok: false, reason: "wrong-version" }` — коли розібране значення не має вигляду `{ schemaVersion: 1, records: масив }`;
        - `{ ok: false, reason: "invalid-record" }` — коли хоч одна справа не проходить готову `validateTask`.

        Для кожної невдачі, крім `missing`, функція спершу записує збережений текст під ключ `BACKUP_KEY`. Сам текст під `KEY` вона не змінює й помилок не кидає.
      en: |
        Write `loadRecords(storage)` for the planner. `storage` is an object with `getItem` and `setItem`, like `localStorage`. The data lies under the key `KEY` in the form `{ schemaVersion: 1, records: [...] }`. The function returns:

        - `{ ok: true, records }` — when everything is fine (an empty list is valid too);
        - `{ ok: false, reason: "missing" }` — when nothing is stored under the key;
        - `{ ok: false, reason: "unparsable" }` — when the text cannot be read as JSON;
        - `{ ok: false, reason: "wrong-version" }` — when the parsed value is not of the form `{ schemaVersion: 1, records: array }`;
        - `{ ok: false, reason: "invalid-record" }` — when at least one task fails the ready-made `validateTask`.

        For every failure except `missing`, the function first writes the stored text under the key `BACKUP_KEY`. It does not change the text under `KEY` itself, and it throws no errors.
    testTitles:
      "the file runs to its end":
        uk: "Файл виконується до кінця"
        en: "The file runs to its end"
      "valid stored data gives ok and the records":
        uk: "Правильні дані дають ok і записи"
        en: "Valid stored data gives ok and the records"
      "nothing stored gives missing and no backup":
        uk: "Коли нічого не збережено — missing і без резервної копії"
        en: "Nothing stored gives missing and no backup"
      "text that is not JSON gives unparsable":
        uk: "Текст, що не є JSON, дає unparsable"
        en: "Text that is not JSON gives unparsable"
      "another shape or version gives wrong-version":
        uk: "Інша форма чи версія дає wrong-version"
        en: "Another shape or version gives wrong-version"
      "an invalid record gives invalid-record":
        uk: "Неправильний запис дає invalid-record"
        en: "An invalid record gives invalid-record"
      "every failure keeps the stored text in the backup key":
        uk: "Кожна невдача зберігає текст під ключем резервної копії"
        en: "Every failure keeps the stored text in the backup key"
      "loadRecords never changes the stored text":
        uk: "loadRecords ніколи не змінює збереженого тексту"
        en: "loadRecords never changes the stored text"
    hints:
      nudge:
        uk: "Перевіряй по черзі, від найпростішого: чи є текст узагалі, чи читається він як JSON, чи має потрібну форму, чи правильна кожна справа."
        en: "Check one thing after another, from the simplest: is there any text at all, can it be read as JSON, does it have the right shape, is every task valid."
      explanation:
        uk: "`getItem` дає `null`, коли нічого немає, — перевір це до розбору. Сам `JSON.parse` обгорни `try/catch`. Форму перевір через `?.` і `===` для версії та `Array.isArray` для `records`, а кожну справу — через властивість `ok` результату `validateTask`. Перед кожним поверненням невдачі, коли текст є, запиши його копію під `BACKUP_KEY`."
        en: "`getItem` gives `null` when there is nothing — check that before parsing. Wrap `JSON.parse` itself in `try/catch`. Check the shape with `?.` and `===` for the version and `Array.isArray` for `records`, and every task through the `ok` property of the `validateTask` result. Before every failure return, when there is text, write its copy under `BACKUP_KEY`."
    solutionNote:
      uk: "Перевірки йдуть від найпростішої: немає тексту → не JSON → не та форма → неправильний запис. `null` перевірено до `JSON.parse`, бо той не кидає для `null`. Версія порівнюється через `===`, тож текст `\"1\"` не проходить. Кожна невдача з текстом спершу кладе його в резервний ключ, а основний ключ функція лише читає: замінити дані вирішить код сторінки, вже маючи копію."
      en: "The checks go from the simplest: no text → not JSON → wrong shape → invalid record. `null` is checked before `JSON.parse`, because that one does not throw for `null`. The version is compared with `===`, so the text `\"1\"` does not pass. Every failure with text first puts it into the backup key, and the main key is only read: the page code decides to replace the data, already holding a copy."
    feedback:
      - when: { test: "the file runs to its end" }
        message:
          uk: "Ця перевірка чекає, що файл виконається до кінця без необробленої помилки. Якщо на картці помилки `SyntaxError` з рядка коду з `JSON.parse`, то `loadRecords` не перехоплює помилку розбору."
          en: "This check expects the file to run to its end without an uncaught error. If the error card shows a `SyntaxError` from the line with `JSON.parse`, `loadRecords` does not catch the parsing error."
      - when: { test: "valid stored data gives ok and the records" }
        message:
          uk: "Ця перевірка зберігає `{ schemaVersion: 1, records: [...] }` із правильними справами (а також з порожнім списком) і чекає `{ ok: true, records }` — ті самі справи, що в тексті."
          en: "This check stores `{ schemaVersion: 1, records: [...] }` with valid tasks (and also with an empty list) and expects `{ ok: true, records }` — the same tasks as in the text."
      - when: { test: "nothing stored gives missing and no backup" }
        message:
          uk: "Ця перевірка нічого не зберігає й чекає `{ ok: false, reason: \"missing\" }` та порожній ключ резервної копії. `getItem` у такому разі дає `null`, а `JSON.parse(null)` не кидає помилки — тож цей випадок перевіряють до розбору."
          en: "This check stores nothing and expects `{ ok: false, reason: \"missing\" }` and an empty backup key. In that case `getItem` gives `null`, and `JSON.parse(null)` does not throw — so this case is checked before parsing."
      - when: { test: "text that is not JSON gives unparsable" }
        message:
          uk: "Ця перевірка зберігає `not json` і недописаний JSON і для кожного чекає `{ ok: false, reason: \"unparsable\" }` — повернений результат, а не помилку, що вилітає з функції."
          en: "This check stores `not json` and unfinished JSON and, for each, expects `{ ok: false, reason: \"unparsable\" }` — a returned result, not an error flying out of the function."
      - when: { test: "another shape or version gives wrong-version" }
        message:
          uk: "Ця перевірка зберігає значення, що не мають вигляду `{ schemaVersion: 1, records: масив }`: версію `2` і версію-текст `\"1\"`, об’єкт без версії, `records` текстом, `null`, масив замість об’єкта. Для кожного вона чекає `{ ok: false, reason: \"wrong-version\" }`. Пам’ятай: `\"1\" == 1` дає `true`."
          en: "This check stores values that are not of the form `{ schemaVersion: 1, records: array }`: version `2` and the text version `\"1\"`, an object without a version, `records` as text, `null`, an array instead of an object. For each it expects `{ ok: false, reason: \"wrong-version\" }`. Remember: `\"1\" == 1` gives `true`."
      - when: { test: "an invalid record gives invalid-record" }
        message:
          uk: "Ця перевірка зберігає списки, де одна справа не проходить `validateTask` (дата `01.03.2026`, пріоритет `urgent`, `done` текстом), і чекає `{ ok: false, reason: \"invalid-record\" }`."
          en: "This check stores lists in which one task fails `validateTask` (the date `01.03.2026`, the priority `urgent`, `done` as text) and expects `{ ok: false, reason: \"invalid-record\" }`."
      - when: { test: "every failure keeps the stored text in the backup key" }
        message:
          uk: "Для кожної невдачі, крім `missing`, ця перевірка чекає під ключем `jsll.planner.v1.backup` точно той текст, що лежав під основним ключем."
          en: "For every failure except `missing`, this check expects exactly the text that lay under the main key to be under `jsll.planner.v1.backup`."
      - when: { test: "loadRecords never changes the stored text" }
        message:
          uk: "Ця перевірка чекає, що після `loadRecords` під основним ключем лежить той самий текст, що й до виклику. Функція лише читає й робить резервну копію; замінювати дані вирішує той, хто її викликав."
          en: "This check expects the main key to hold the same text after `loadRecords` as before the call. The function only reads and makes a backup; replacing the data is decided by whoever called it."

  - id: to-project
    kind: transfer
    capstoneStep: JS-07
    body:
      uk: "У кроці проєкту твої записи житимуть під ключем `jsll.<проєкт>.v1` у вигляді `{ schemaVersion: 1, records }`. Під час завантаження перевір їх так само по черзі; для зіпсованих даних збережи копію під ключем `.backup`, покажи зрозуміле повідомлення й почни з початкових записів — фікстур проєкту."
      en: "In the project step your records live under the key `jsll.<project>.v1` as `{ schemaVersion: 1, records }`. On load, check them step by step in the same way; for damaged data keep a copy under a `.backup` key, show a clear message and start from the starting records — the project’s fixtures."
