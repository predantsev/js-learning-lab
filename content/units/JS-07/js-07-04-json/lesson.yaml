id: js-07-04-json
unit: JS-07
title:
  uk: "JSON: серіалізація, розбір і їхні межі"
  en: "JSON: serialize and parse, with limits"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити, що `JSON.stringify` зробить з `undefined`, функцією, `NaN`, датою та вкладеними об’єктами, і що поверне `JSON.parse`."
    en: "Predict what `JSON.stringify` produces for `undefined`, functions, `NaN`, a `Date` and nested objects, and what `JSON.parse` gives back."
  - uk: "Пояснити, чому об’єкт, що містить сам себе, не серіалізується, а дата після розбору повертається текстом."
    en: "Explain why a cyclic object throws on stringify and why a parsed `Date` comes back as a string."
  - uk: "Перехопити `SyntaxError` від `JSON.parse` для зіпсованого тексту й повернути результат-невдачу замість падіння програми."
    en: "Catch the `SyntaxError` from `JSON.parse` on malformed text and return a failure result instead of crashing."
prerequisites: [js-07-03-try-catch-finally, js-04-08-copying-shallow-deep]
subskills:
  - { family: J-10, skill: "JSON parse/serialize limitations", depth: intro }
glossary: [json, serialization, deserialization, cyclic-reference]
selfCheck: [what-survives, stored-text]

blocks:
  - id: what-json-is
    kind: explanation
    title:
      uk: "JSON — дані як текст"
      en: "JSON — data as text"
    body:
      uk: |
        Об’єкт живе лише в пам’яті працюючої програми. Щоб зберегти його чи передати іншій програмі, його перетворюють на текст. Найпоширеніший формат такого тексту — [[json|JSON]].

        ```js
        const task = { id: "t-01", done: false, tags: ["home"] };
        const text = JSON.stringify(task); // '{"id":"t-01","done":false,"tags":["home"]}'
        const copy = JSON.parse(text);     // a new object made from the text
        ```

        - `JSON.stringify` — [[serialization|серіалізація]]: значення стає текстом.
        - `JSON.parse` — [[deserialization|десеріалізація]]: з тексту створюється **нове** значення.

        JSON схожий на запис об’єкта в JavaScript, але суворіший: ключі й тексти — лише в подвійних лапках, а значення — лише тексти, числа, `true`/`false`, `null`, масиви й об’єкти. Ні `undefined`, ні функцій, ні дат у JSON немає.
      en: |
        An object lives only in the memory of a running program. To save it or hand it to another program, it is turned into text. The most common format for such text is [[json|JSON]].

        ```js
        const task = { id: "t-01", done: false, tags: ["home"] };
        const text = JSON.stringify(task); // '{"id":"t-01","done":false,"tags":["home"]}'
        const copy = JSON.parse(text);     // a new object made from the text
        ```

        - `JSON.stringify` is [[serialization]]: a value becomes text.
        - `JSON.parse` is [[deserialization]]: a **new** value is made from the text.

        JSON looks like an object written in JavaScript, but it is stricter: keys and texts only in double quotes, and the values can only be texts, numbers, `true`/`false`, `null`, arrays and objects. JSON has no `undefined`, no functions and no dates.

  - id: what-survives
    kind: prediction
    prompt:
      uk: "`new Date(\"2026-03-01\")` створює об’єкт дати — момент часу. Що надрукує програма?"
      en: "`new Date(\"2026-03-01\")` creates a date object — a moment in time. What does the program print?"
    code: |
      const expense = {
        id: "e-07",
        note: undefined,
        amountMinor: NaN,
        paidOn: new Date("2026-03-01"),
        tags: ["food", "weekly"],
      };
      console.log(JSON.stringify(expense));
    verify:
      logs: ['{"id":"e-07","amountMinor":null,"paidOn":"2026-03-01T00:00:00.000Z","tags":["food","weekly"]}']
    answer:
      type: choice
      options:
        - id: json-rules
          code: '{"id":"e-07","amountMinor":null,"paidOn":"2026-03-01T00:00:00.000Z","tags":["food","weekly"]}'
        - id: everything-kept
          code: '{"id":"e-07","note":undefined,"amountMinor":NaN,"paidOn":"2026-03-01","tags":["food","weekly"]}'
          why:
            uk: "У JSON немає `undefined` і `NaN`: поле з `undefined` просто пропадає, а `NaN` стає `null`. А дата записується повним моментом часу, не лише днем."
            en: "JSON has no `undefined` and no `NaN`: a field holding `undefined` simply disappears, and `NaN` becomes `null`. And a date is written as the full moment in time, not just the day."
        - id: nulls-and-object
          code: '{"id":"e-07","note":null,"amountMinor":null,"paidOn":{},"tags":["food","weekly"]}'
          why:
            uk: "Поле з `undefined` не стає `null` — його пропущено зовсім. А дата не порожній об’єкт: `JSON.stringify` записує її текстом на зразок `\"2026-03-01T00:00:00.000Z\"`."
            en: "A field holding `undefined` does not become `null` — it is skipped entirely. And a date is not an empty object: `JSON.stringify` writes it as text like `\"2026-03-01T00:00:00.000Z\"`."
        - id: js-object-text
          code: '{id:"e-07",amountMinor:null,paidOn:"2026-03-01T00:00:00.000Z",tags:["food","weekly"]}'
          why:
            uk: "У JSON ключі завжди стоять у подвійних лапках: `\"id\"`, а не `id`. Це текст за суворими правилами, а не код JavaScript."
            en: "In JSON keys always stand in double quotes: `\"id\"`, not `id`. It is text with strict rules, not JavaScript code."
      correct: [json-rules]
    explanation:
      uk: "`JSON.stringify` записує лише те, що вміє JSON. Поле `note` з `undefined` пропало, `NaN` став `null`, а дату перетворено на текст — повний момент часу у світовому часі (UTC). Вкладений масив `tags` записано як є."
      en: "`JSON.stringify` writes only what JSON can hold. The `note` field holding `undefined` vanished, `NaN` became `null`, and the date was turned into text — the full moment in world time (UTC). The nested `tags` array was written as it is."

  - id: after-parse
    kind: prediction
    prompt:
      uk: "Той самий текст розбирають назад. Що надрукує програма?"
      en: "The same kind of text is parsed back. What does the program print?"
    code: |
      const text = JSON.stringify({ paidOn: new Date("2026-03-01"), amountMinor: NaN, tags: ["food"] });
      const back = JSON.parse(text);
      console.log(typeof back.paidOn, back.amountMinor, back.tags[0]);
    verify:
      logs: ["string null food"]
    answer:
      type: choice
      options:
        - id: string-null
          code: "string null food"
        - id: date-comes-back
          code: "object NaN food"
          why:
            uk: "`JSON.parse` не знає, що текст колись був датою: для нього це звичайний текст. А `NaN` втратився ще під час серіалізації — у тексті вже `null`."
            en: "`JSON.parse` does not know the text was once a date: to it, it is ordinary text. And `NaN` was lost during serialization already — the text holds `null`."
        - id: object-null
          code: "object null food"
          why:
            uk: "Дата повертається текстом: `typeof` дає `\"string\"`. Щоб знову мати дату, її треба створити самому з цього тексту."
            en: "The date comes back as text: `typeof` gives `\"string\"`. To have a date again, you must create it yourself from that text."
      correct: [string-null]
    explanation:
      uk: "Розбір дає рівно те, що записано в тексті: дата стала текстом, `NaN` — `null`, масив — новим масивом із тими самими значеннями. Тому `JSON.parse(JSON.stringify(x))` — це не точна копія: що JSON не вміє, змінюється або губиться."
      en: "Parsing gives exactly what the text holds: the date became text, `NaN` became `null`, the array became a new array with the same values. That is why `JSON.parse(JSON.stringify(x))` is not an exact copy: whatever JSON cannot hold changes or gets lost."

  - id: round-trip-limits
    kind: explanation
    title:
      uk: "Що JSON не переносить"
      en: "What JSON does not carry"
    body:
      uk: |
        | Значення | У тексті JSON | Після `JSON.parse` |
        |---|---|---|
        | поле з `undefined`, функція | пропущено | поля немає |
        | `NaN`, `Infinity` | `null` | `null` |
        | `new Date(…)` | `"2026-03-01T00:00:00.000Z"` | текст, а не дата |
        | вкладені масиви й об’єкти | записано повністю | нові масиви й об’єкти |
        | об’єкт, що містить сам себе | `TypeError` | — |

        Останній рядок таблиці — [[cyclic-reference|циклічне посилання]]: якщо `task.self = task`, текст вийшов би нескінченним, тож `JSON.stringify` кидає `TypeError`.

        Саме тому в наших проєктах дати — тексти `"YYYY-MM-DD"`, а суми — цілі числа в копійках: такі значення проходять крізь JSON без жодних змін.
      en: |
        | Value | In the JSON text | After `JSON.parse` |
        |---|---|---|
        | a field holding `undefined`, a function | skipped | the field is missing |
        | `NaN`, `Infinity` | `null` | `null` |
        | `new Date(…)` | `"2026-03-01T00:00:00.000Z"` | text, not a date |
        | nested arrays and objects | written in full | new arrays and objects |
        | an object that contains itself | `TypeError` | — |

        The last row of the table is a [[cyclic-reference|cyclic reference]]: if `task.self = task`, the text would be endless, so `JSON.stringify` throws a `TypeError`.

        That is exactly why in our projects dates are `"YYYY-MM-DD"` texts and amounts are whole numbers in kopiykas: such values pass through JSON without any change.

  - id: recall
    kind: review
    title:
      uk: "Згадай: поверхнева й глибока копія"
      en: "Recall: shallow and deep copies"
    items:
      - id: spread-or-json
        from: js-04-08-copying-shallow-deep
        prompt:
          uk: "Звичку скопіювали двома способами, а потім у масив `completions` оригіналу додали день. Що надрукує програма?"
          en: "A habit was copied in two ways, and then a day was added to the original’s `completions` array. What does the program print?"
        code: |
          const habit = { id: "h-02", completions: ["2026-02-28"] };
          const viaSpread = { ...habit };
          const viaJson = JSON.parse(JSON.stringify(habit));

          habit.completions.push("2026-03-01");
          console.log(viaSpread.completions.length, viaJson.completions.length);
        verify:
          logs: ["2 1"]
        answer:
          type: choice
          options:
            - id: spread-shares
              code: "2 1"
            - id: both-copies
              code: "1 1"
              why:
                uk: "Spread копіює лише верхній рівень: `viaSpread.completions` — той самий масив, що й у `habit`, тож доданий день видно і там."
                en: "Spread copies only the top level: `viaSpread.completions` is the same array as in `habit`, so the added day shows there too."
            - id: both-shared
              code: "2 2"
              why:
                uk: "Після `JSON.parse` масив `completions` — новий, створений із тексту. Він не пов’язаний з оригіналом."
                en: "After `JSON.parse` the `completions` array is new, made from the text. It is not connected to the original."
          correct: [spread-shares]
        explanation:
          uk: "Spread дає поверхневу копію: вкладений масив спільний. Перетворення в JSON і назад створює все заново — тому його колись і використовували як глибоку копію. Але воно губить `undefined`, функції й дати, тож для копіювання тепер є `structuredClone`, а JSON потрібен для збереження й передавання даних."
          en: "Spread gives a shallow copy: the nested array is shared. Going to JSON and back creates everything anew — that is why it was once used as a deep copy. But it loses `undefined`, functions and dates, so copying now has `structuredClone`, and JSON is for saving and sending data."

  - id: round-trip
    kind: example
    runtime: browser-js
    dir: round-trip
    entry: index.js
    strings:
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
    title:
      uk: "Туди й назад — і як це зламати"
      en: "There and back — and how to break it"
    body:
      uk: |
        Справа з планувальника стає текстом JSON, а потім — новим об’єктом. Натисни **Запустити** й подивись на **Консоль**.
      en: |
        A task from the planner becomes JSON text and then a new object. Press **Run** and look at the **Console**.
    tryIt:
      uk: |
        1. У першому рядку консолі — текст JSON: ключі в подвійних лапках. Дата `"2026-03-01"` — уже текст, тож вона повернулася без змін. `back === task` дає `false`: це новий об’єкт.
        2. Після рядка коду з `const task` додай `task.self = task;` і запусти. `TypeError`: об’єкт містить сам себе, і текст вийшов би нескінченним. Прибери цей рядок коду.
        3. Заміни `JSON.parse(text)` на `JSON.parse(text.slice(0, -1))` — це текст без останнього символу, `}`. Запусти: `SyntaxError`, бо текст JSON недописаний. Повідомлення каже, чого бракує і де.
      en: |
        1. The first console line is the JSON text: keys in double quotes. The date `"2026-03-01"` is already text, so it came back unchanged. `back === task` gives `false`: it is a new object.
        2. After the line with `const task`, add `task.self = task;` and run. A `TypeError`: the object contains itself, and the text would be endless. Remove that line.
        3. Replace `JSON.parse(text)` with `JSON.parse(text.slice(0, -1))` — the text without its last character, `}`. Run: a `SyntaxError`, because the JSON text is unfinished. The message says what is missing and where.

  - id: parse-safely
    kind: explanation
    title:
      uk: "Розбирати обережно"
      en: "Parsing with care"
    body:
      uk: |
        Текст, що прийшов ззовні — зі сховища, з файла, з мережі, — може бути зіпсованим. Для такого тексту `JSON.parse` кидає `SyntaxError`. Назва та сама, що в помилки читання коду, але ця виникає **під час виконання** — тож `try/catch` її перехоплює.

        ```js
        function readTheme(text) {
          let settings;
          try {
            settings = JSON.parse(text);
          } catch (error) {
            console.log("unreadable settings: " + error.message);
            return "light";
          }
          return settings.theme;
        }
        ```

        Зверни увагу: у `try` лише `JSON.parse` — те єдине, що тут може кинути. Що робити з невдачею, вирішує функція: тут — узяти тему за замовчуванням, у вправі нижче — повернути результат `{ ok: false, reason }`, щоб вирішив той, хто викликав.
      en: |
        Text that came from outside — from storage, a file, the network — may be damaged. For such text `JSON.parse` throws a `SyntaxError`. It has the same name as a code-reading error, but this one happens **while the program runs** — so `try/catch` catches it.

        ```js
        function readTheme(text) {
          let settings;
          try {
            settings = JSON.parse(text);
          } catch (error) {
            console.log("unreadable settings: " + error.message);
            return "light";
          }
          return settings.theme;
        }
        ```

        Notice: `try` holds only `JSON.parse` — the one thing here that can throw. What to do about a failure is the function’s decision: here, take the default theme; in the exercise below, return a `{ ok: false, reason }` result so the caller decides.

  - id: stored-text
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: stored-text
    entry: index.js
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      bulbs: { uk: "Лампочки", en: "Light bulbs" }
      lunch: { uk: "Обід", en: "Lunch" }
      transit: { uk: "Проїзний", en: "Transit pass" }
    title:
      uk: "Витрати як текст і назад"
      en: "Expenses as text and back"
    instructions:
      uk: |
        Трекер витрат зберігає записи текстом. У записі поле `date` буває двох видів: об’єкт дати (`new Date("2026-03-01")`) або вже текст `"2026-03-01"`.

        - `toStoredText(records)` повертає текст JSON усіх записів, де **кожна** дата — текст `"YYYY-MM-DD"`. Для об’єкта дати є готова `toDay(date)`. Самі записи, які отримала функція, не змінюються.
        - `fromStoredText(text)` повертає `{ ok: true, records }` для правильного тексту й `{ ok: false, reason }` — коли `JSON.parse` кидає помилку. `reason` — текст повідомлення помилки. Функція не кидає помилок далі.

        Перевірити, чи значення — об’єкт дати, допоможе `instanceof Date`.
      en: |
        The expense tracker stores records as text. A record’s `date` field comes in two kinds: a date object (`new Date("2026-03-01")`) or already the text `"2026-03-01"`.

        - `toStoredText(records)` returns the JSON text of all the records, where **every** date is the text `"YYYY-MM-DD"`. For a date object there is a ready-made `toDay(date)`. The records the function receives stay unchanged.
        - `fromStoredText(text)` returns `{ ok: true, records }` for valid text and `{ ok: false, reason }` when `JSON.parse` throws. `reason` is the text of the error’s message. The function throws no errors further.

        `instanceof Date` helps check whether a value is a date object.
    testTitles:
      "the file runs to its end":
        uk: "Файл виконується до кінця"
        en: "The file runs to its end"
      "toStoredText returns JSON text":
        uk: "toStoredText повертає текст JSON"
        en: "toStoredText returns JSON text"
      "every date is stored as YYYY-MM-DD text":
        uk: "Кожна дата зберігається текстом YYYY-MM-DD"
        en: "Every date is stored as YYYY-MM-DD text"
      "the other fields are stored unchanged":
        uk: "Інші поля зберігаються без змін"
        en: "The other fields are stored unchanged"
      "toStoredText leaves the records unchanged":
        uk: "toStoredText не змінює самих записів"
        en: "toStoredText leaves the records unchanged"
      "fromStoredText reads valid text back":
        uk: "fromStoredText читає правильний текст"
        en: "fromStoredText reads valid text back"
      "fromStoredText returns a failure for malformed text instead of throwing":
        uk: "fromStoredText повертає невдачу для зіпсованого тексту, а не кидає помилку"
        en: "fromStoredText returns a failure for malformed text instead of throwing"
      "a round trip gives the records back with day dates":
        uk: "Туди й назад записи повертаються з датами-днями"
        en: "A round trip gives the records back with day dates"
    hints:
      nudge:
        uk: "У `toStoredText` спершу зроби нові записи з датами-текстами, а вже потім серіалізуй. У `fromStoredText` подумай, що з усього може кинути помилку."
        en: "In `toStoredText`, first make new records with text dates, and only then serialize. In `fromStoredText`, think about which part can throw."
      explanation:
        uk: "Новий запис із заміненим полем дає spread: `{ ...record, поле: нове значення }`, а `map` робить так для кожного запису — оригінали лишаються цілими. Об’єкт дати перетвори через `toDay`, а текст залиш як є. У `fromStoredText` кинути може лише `JSON.parse`: обгорни його в `try`, а в `catch` поверни результат-невдачу з `error.message`."
        en: "A new record with one field replaced comes from spread: `{ ...record, field: newValue }`, and `map` does it for every record — the originals stay intact. Turn a date object into text with `toDay`, and leave text as it is. In `fromStoredText` only `JSON.parse` can throw: wrap it in `try`, and in `catch` return a failure result with `error.message`."
    solutionNote:
      uk: "`toStoredText` будує нові записи, тож вхідні не змінюються, і перетворює кожен об’єкт дати на `\"YYYY-MM-DD\"` ще до `JSON.stringify` — інакше дата стала б довгим моментом часу. `fromStoredText` тримає в `try` лише `JSON.parse` і перетворює `SyntaxError` на результат `{ ok: false, reason }`: той, хто викликає, сам вирішить, що показати, а програма не падає."
      en: "`toStoredText` builds new records, so the input stays unchanged, and turns every date object into `\"YYYY-MM-DD\"` before `JSON.stringify` — otherwise the date would become a long moment in time. `fromStoredText` keeps only `JSON.parse` in `try` and turns a `SyntaxError` into a `{ ok: false, reason }` result: the caller decides what to show, and the program does not crash."
    feedback:
      - when: { test: "the file runs to its end" }
        message:
          uk: "Необроблена помилка зупинила файл до кінця, і перевірки не бачать функцій. Подивись на картку помилки: якщо це `SyntaxError` з останнього рядка коду, то `fromStoredText` не перехоплює помилку `JSON.parse`."
          en: "An uncaught error stopped the file before its end, and the checks cannot see the functions. Look at the error card: if it is a `SyntaxError` from the last line of code, `fromStoredText` does not catch the error from `JSON.parse`."
      - when: { test: "toStoredText returns JSON text" }
        message:
          uk: "`toStoredText` має повертати текст, який `JSON.parse` прочитає, — результат `JSON.stringify`."
          en: "`toStoredText` must return text that `JSON.parse` can read — the result of `JSON.stringify`."
      - when: { test: "every date is stored as YYYY-MM-DD text" }
        message:
          uk: "У збереженому тексті кожна дата має бути днем `\"YYYY-MM-DD\"`. Об’єкт дати сам `JSON.stringify` запише як `\"2026-02-27T00:00:00.000Z\"` — перетвори його через `toDay` ще до серіалізації. Дату-текст залиш як є."
          en: "In the stored text every date must be a day, `\"YYYY-MM-DD\"`. On its own, `JSON.stringify` writes a date object as `\"2026-02-27T00:00:00.000Z\"` — turn it with `toDay` before serializing. Leave a text date as it is."
      - when: { test: "the other fields are stored unchanged" }
        message:
          uk: "Окрім дати, усі поля запису — `id`, `label`, `amountMinor`, `category` — мають потрапити в текст без змін."
          en: "Apart from the date, every field of a record — `id`, `label`, `amountMinor`, `category` — must get into the text unchanged."
      - when: { test: "toStoredText leaves the records unchanged" }
        message:
          uk: "Після виклику `toStoredText` у записі, який вона отримала, дата має лишитися тим самим об’єктом дати. Не міняй поле в отриманих записах — будуй нові записи через spread."
          en: "After the call to `toStoredText`, the record it received must still hold the same date object. Do not change the field in the records you received — build new records with spread."
      - when: { test: "fromStoredText reads valid text back" }
        message:
          uk: "Для правильного тексту `fromStoredText` повертає `{ ok: true, records }`, де `records` — результат `JSON.parse`."
          en: "For valid text `fromStoredText` returns `{ ok: true, records }`, where `records` is the result of `JSON.parse`."
      - when: { test: "fromStoredText returns a failure for malformed text instead of throwing" }
        message:
          uk: "Для зіпсованого тексту `fromStoredText` не кидає помилку й не вдає, що все гаразд: вона повертає `{ ok: false, reason }`, де `reason` — непорожній текст повідомлення помилки."
          en: "For malformed text `fromStoredText` neither throws nor pretends everything is fine: it returns `{ ok: false, reason }`, where `reason` is the non-empty text of the error’s message."
      - when: { test: "a round trip gives the records back with day dates" }
        message:
          uk: "`fromStoredText(toStoredText(records))` має повернути `ok: true` і ті самі записи, де всі дати — дні `\"YYYY-MM-DD\"`."
          en: "`fromStoredText(toStoredText(records))` must return `ok: true` and the same records, with every date a `\"YYYY-MM-DD\"` day."

  - id: to-project
    kind: transfer
    capstoneStep: JS-07
    body:
      uk: "У кроці проєкту записи збережуться текстом JSON. Твої записи вже зручні для цього: дати — тексти `\"YYYY-MM-DD\"`, суми й ціни — числа, порожні значення — `null`, а не `undefined`. А читати збережений текст ти будеш так само обережно: зіпсований текст — це результат-невдача, а не падіння сторінки."
      en: "In the project step, records are saved as JSON text. Your records already suit it: dates are `\"YYYY-MM-DD\"` texts, amounts and prices are numbers, empty values are `null`, not `undefined`. And you will read the saved text just as carefully: damaged text is a failure result, not a crashed page."
