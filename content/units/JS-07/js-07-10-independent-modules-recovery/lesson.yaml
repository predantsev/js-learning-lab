id: js-07-10-independent-modules-recovery
unit: JS-07
title:
  uk: "Самостійно: розбити на модулі й відновити недійсні збережені дані"
  en: "Independent: split modules and recover invalid stored data"
kind: assessment
minutes: 25
contentVersion: 1
purpose:
  uk: "Самостійно поєднати все з цього розділу в новій ситуації: розбити готовий застосунок на модулі, завантажити рідкісну частину на вимогу, вистояти проти зіпсованих збережених даних — і показати, що відрізняєш CommonJS від ES-модулів."
  en: "Combine everything from this unit on your own in a new situation: split a ready app into modules, load a rarely used part on demand, withstand damaged saved data — and show that you can tell CommonJS from ES modules."
objectives:
  - uk: "Без підказок розбити наданий однофайловий застосунок на модулі domain, storage і ui, завантажувати один модуль на вимогу й відновлюватися після чотирьох видів недійсних збережених даних."
    en: "Split a supplied single-file app into domain, storage and ui ES modules without hints, load one module on demand, and recover from four kinds of invalid stored data."
  - uk: "Переписати короткий модуль CommonJS як ES-модуль і пояснити межу між ними: де працює кожен і як прив’язується імпортоване значення."
    en: "Rewrite a short CommonJS module as an ES module and explain the boundary between them: where each runs and how an imported value is bound."
prerequisites: [js-07-09-debug-swallowed-errors]
subskills:
  - { family: J-10, skill: "ESM imports/exports/live bindings", depth: assess }
  - { family: J-10, skill: "dynamic import", depth: assess }
  - { family: J-10, skill: "CommonJS interoperability context", depth: assess }
glossary: []

blocks:
  - id: the-task
    kind: explanation
    title:
      uk: "Що перевіряє цей урок"
      en: "What this lesson checks"
    body:
      uk: |
        Тут ти працюєш **без підказок**: лише умова, редактор і перевірки. Знадобиться весь розділ — модулі й шляхи до них, `import()`, обережне завантаження збережених даних із резервною копією, CommonJS.

        Перевірки не дивляться на текст твого коду: вони завантажують твої модулі, викликають їхні експорти на **власних** даних (і зіпсованих теж), натискають кнопки й читають сторінку. Сховище вправи перевірки щоразу повертають таким, яким воно було.

        Якщо перевірка не проходить, прочитай її назву й повідомлення: вони кажуть, *що* очікувалося, а не *як* це написати.
      en: |
        Here you work **without hints**: just the task, the editor and the checks. You will need the whole unit — modules and the paths to them, `import()`, careful loading of saved data with a backup, CommonJS.

        The checks do not look at the text of your code: they load your modules, call their exports on **their own** data (damaged data too), press buttons and read the page. The checks always put the exercise’s storage back the way it was.

        If a check fails, read its title and message: they say *what* was expected, not *how* to write it.

  - id: split-loans
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: split-loans
    entry: index.html
    editable: [main.js, domain/loans.js, storage/loans.js, ui/render.js, stats.js]
    strings:
      lang: { uk: "uk", en: "en" }
      pageTitle: { uk: "Бібліотечні позики", en: "Library loans" }
      statsButton: { uk: "Статистика", en: "Statistics" }
      damaged: { uk: "Збережені позики зіпсовані: оригінал лежить під ключем jsll.loans.v1.backup, показано початкові записи.", en: "The saved loans are damaged: the original is kept under the key jsll.loans.v1.backup, the starting records are shown." }
      book1: { uk: "Подорож до моря", en: "A Trip to the Sea" }
      book2: { uk: "Сад на підвіконні", en: "A Garden on the Windowsill" }
      book3: { uk: "Історія мостів", en: "A History of Bridges" }
      book4: { uk: "Задачі для розуму", en: "Puzzles for the Mind" }
      overdueText: { uk: "Прострочено: ", en: "Overdue: " }
      returnedText: { uk: "повернуто", en: "returned" }
      statsText: { uk: "Прострочено серед неповернутих: ", en: "Overdue among open loans: " }
    title:
      uk: "Позики: модулі, статистика на вимогу, відновлення"
      en: "Loans: modules, statistics on demand, recovery"
    instructions:
      uk: |
        Застосунок бібліотечних позик зараз увесь у `main.js`. Розбий його на модулі, які описано вгорі кожного файла:

        - `domain/loans.js` — іменовані експорти `validateLoan` і `countOverdue`, без сторінки й сховища.
        - `storage/loans.js` — `loadLoans(storage)` і `saveLoans(storage, loans)`. `loadLoans` повертає `{ ok: true, loans }` або `{ ok: false, reason }` з причиною `"missing"`, `"unparsable"`, `"wrong-version"` чи `"invalid-record"`; для трьох останніх спершу копіює збережений текст під ключ `jsll.loans.v1.backup`, а текст під `jsll.loans.v1` ніколи не змінює.
        - `ui/render.js` — `render(loans, message, overdue)`.
        - `stats.js` — `overdueShare(loans, today)`. Цей модуль завантажується лише після кліку на «Статистика» і виконується один раз.
        - `main.js` — лише збирає все разом: функція `start(storage)` завантажує позики, показує їх і зберігає назад. Коли збережені дані зіпсовані (усе, крім `missing`), вона показує `MESSAGES.damaged` і початкові записи; першого запуску (`missing`) нічим не позначає.

        Те, що бачить користувач, не змінюється. `main.js` не тримає власних копій функцій, які тепер живуть у модулях.
      en: |
        The library loans app is currently all in `main.js`. Split it into the modules described at the top of each file:

        - `domain/loans.js` — the named exports `validateLoan` and `countOverdue`, with no page and no storage.
        - `storage/loans.js` — `loadLoans(storage)` and `saveLoans(storage, loans)`. `loadLoans` returns `{ ok: true, loans }` or `{ ok: false, reason }` with the reason `"missing"`, `"unparsable"`, `"wrong-version"` or `"invalid-record"`; for the last three it first copies the saved text under the key `jsll.loans.v1.backup`, and it never changes the text under `jsll.loans.v1`.
        - `ui/render.js` — `render(loans, message, overdue)`.
        - `stats.js` — `overdueShare(loans, today)`. This module is loaded only after a click on “Statistics” and runs once.
        - `main.js` — only puts everything together: the function `start(storage)` loads the loans, shows them and saves them back. When the saved data is damaged (anything except `missing`), it shows `MESSAGES.damaged` and the starting records; it marks a first start (`missing`) with nothing.

        What the user sees does not change. `main.js` keeps no copies of its own of the functions that now live in modules.
