    solutionNote:
      uk: "`domain/loans.js` тримає чисті правила, `storage/loans.js` — читання й запис із перевірками та резервною копією, `ui/render.js` — сторінку, а `main.js` лише поєднує їх і вирішує, що показати. `stats.js` завантажується через `import()` у обробнику кнопки, тож на старті його немає, а після першого кліку браузер виконує його один раз. Імпортовані назви — ті самі функції, що в модулях."
      en: "`domain/loans.js` holds the pure rules, `storage/loans.js` the reading and writing with checks and a backup, `ui/render.js` the page, and `main.js` only connects them and decides what to show. `stats.js` is loaded with `import()` in the button’s listener, so it is not there at the start, and after the first click the browser runs it once. The imported names are the same functions as in the modules."
