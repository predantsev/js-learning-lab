  - id: recall
    kind: review
    title:
      uk: "Згадай: сторінка змінюється, коли малюєш"
      en: "Recall: the page changes when you render"
    items:
      - id: render-again
        from: js-06-13-render-list-from-data
        prompt:
          uk: "`render` перебудовує список із даних. Що надрукує програма?"
          en: "`render` rebuilds the list from data. What does the program print?"
        code: |
          const list = document.createElement("ul");
          document.body.append(list);

          function render(ids) {
            list.replaceChildren();
            for (const id of ids) {
              const item = document.createElement("li");
              item.textContent = id;
              list.append(item);
            }
          }

          let ids = ["l-01", "l-02", "l-03"];
          render(ids);
          ids = ids.filter((id) => id !== "l-02");
          console.log(list.children.length);
          render(ids);
          console.log(list.children.length);
        verify:
          logs: ["3", "2"]
        answer:
          type: choice
          options:
            - id: three-two
              code: "3\n2"
            - id: two-two
              code: "2\n2"
              why:
                uk: "Нове значення `ids` саме сторінку не змінює: список перебудовується лише тоді, коли знову викликають `render`."
                en: "A new value of `ids` does not change the page by itself: the list is rebuilt only when `render` is called again."
            - id: three-three
              code: "3\n3"
              why:
                uk: "Другий виклик `render` очищує список через `replaceChildren` і будує його з нових даних — двох позик."
                en: "The second call of `render` clears the list with `replaceChildren` and builds it from the new data — two loans."
          correct: [three-two]
        explanation:
          uk: "Дані й сторінка — різні речі: зміна масиву не змінює DOM. Одна функція `render` будує сторінку з даних, і її викликають щоразу, коли дані змінилися, — так само `start` у вправі вище малює позики після завантаження."
          en: "Data and the page are different things: changing an array does not change the DOM. One `render` function builds the page from data, and it is called every time the data has changed — the same way `start` in the exercise above draws the loans after loading."

  - id: cjs-labels
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: cjs-labels
    entry: main.js
    editable: [labels.js]
    strings:
      book1: { uk: "Подорож до моря", en: "A Trip to the Sea" }
      book2: { uk: "Сад на підвіконні", en: "A Garden on the Windowsill" }
    title:
      uk: "П’ять рядків коду з CommonJS"
      en: "Five lines of CommonJS code"
    instructions:
      uk: |
        `labels.js` написано в CommonJS. Перепиши його як ES-модуль, щоб `main.js`, який імпортує `{ loanLabel }`, працював у браузері. `dates.js` уже ES-модуль. Поведінка `loanLabel` не змінюється.
      en: |
        `labels.js` is written in CommonJS. Rewrite it as an ES module so that `main.js`, which imports `{ loanLabel }`, works in the browser. `dates.js` is already an ES module. The behavior of `loanLabel` does not change.
    testTitles:
      "labels.js loads as an ES module":
        uk: "labels.js завантажується як ES-модуль"
        en: "labels.js loads as an ES module"
      "labels.js exports loanLabel by name":
        uk: "labels.js експортує loanLabel за назвою"
        en: "labels.js exports loanLabel by name"
      "loanLabel builds the label with the formatted day":
        uk: "loanLabel будує підпис із відформатованою датою"
        en: "loanLabel builds the label with the formatted day"
      "main.js prints the label":
        uk: "main.js друкує підпис"
        en: "main.js prints the label"
    solutionNote:
      uk: "`require` став статичним `import` з тим самим шляхом, а `module.exports = { loanLabel }` — іменованим експортом: `main.js` імпортує саме назву. Default-експорт об’єкта тут не підійшов би."
      en: "`require` became a static `import` with the same path, and `module.exports = { loanLabel }` became a named export: `main.js` imports exactly the name. A default export of an object would not fit here."
    feedback:
      - when: { test: "labels.js loads as an ES module" }
        message:
          uk: "Ця перевірка завантажує `labels.js` і чекає, що він виконається без помилки. У браузері немає `require` і `module`."
          en: "This check loads `labels.js` and expects it to run without an error. The browser has no `require` and no `module`."
      - when: { test: "labels.js exports loanLabel by name" }
        message:
          uk: "Ця перевірка шукає в `labels.js` іменований експорт `loanLabel` — саме таку назву імпортує `main.js`."
          en: "This check looks in `labels.js` for the named export `loanLabel` — exactly the name that `main.js` imports."
      - when: { test: "loanLabel builds the label with the formatted day" }
        message:
          uk: "Ця перевірка чекає від `loanLabel` назву книжки, ` — ` і дату у вигляді `27.02.2026`."
          en: "This check expects the book title, ` — ` and the date in the form `27.02.2026` from `loanLabel`."
      - when: { test: "main.js prints the label" }
        message:
          uk: "Ця перевірка чекає, що вся програма виконається без помилок і `main.js` надрукує підпис позики."
          en: "This check expects the whole program to run without errors and `main.js` to print the loan’s label."

  - id: boundary
    kind: prediction
    prompt:
      uk: "Межа між CommonJS і ES-модулями. Які твердження правильні? Обери всі."
      en: "The boundary between CommonJS and ES modules. Which statements are true? Choose all that are."
    answer:
      type: multi
      options:
        - id: browser-no-require
          text:
            uk: "У браузері `require` не існує: файл із ним кидає `ReferenceError`."
            en: "In the browser `require` does not exist: a file with it throws a `ReferenceError`."
        - id: require-copies
          text:
            uk: "`const { count } = require(\"./counter.js\")` бере значення `count` тієї миті: пізніші зміни в `counter.js` через цю назву вже не видно."
            en: "`const { count } = require(\"./counter.js\")` takes the value of `count` at that moment: later changes inside `counter.js` are not visible through that name."
        - id: import-live
          text:
            uk: "Після `import { count } from \"./counter.js\"` модуль завжди читає поточне значення `count`, але присвоїти йому нічого не може."
            en: "After `import { count } from \"./counter.js\"` a module always reads the current value of `count`, but cannot assign anything to it."
        - id: mix-freely
          text:
            uk: "`require` і `import` можна вільно змішувати в одному файлі для браузера."
            en: "`require` and `import` can be mixed freely in one file for the browser."
          why:
            uk: "У браузері працює лише `import`: `require` там немає зовсім."
            en: "Only `import` works in the browser: there is no `require` there at all."
        - id: import-copy
          text:
            uk: "Імпортована назва — копія значення, зроблена тоді, коли виконався рядок коду з `import`."
            en: "An imported name is a copy of the value, made when the line with `import` ran."
          why:
            uk: "Імпорт — жива прив’язка: він щоразу читає змінну модуля-власника."
            en: "An import is a live binding: it reads the owning module’s variable every time."
        - id: node-only-cjs
          text:
            uk: "Node.js уміє виконувати лише CommonJS."
            en: "Node.js can run only CommonJS."
          why:
            uk: "Node.js виконує і ES-модулі; яку систему має файл, вирішують його розширення (`.mjs`, `.cjs`) чи налаштування проєкту."
            en: "Node.js runs ES modules too; a file’s extension (`.mjs`, `.cjs`) or the project’s settings decide which system it uses."
      correct: [browser-no-require, require-copies, import-live]
    explanation:
      uk: "CommonJS — старша система Node.js: `require` виконується як звичайний виклик і повертає об’єкт експортів, а деструктуризація копіює значення тієї миті. ES-модулі працюють і в браузері, і в Node.js: імпорти обробляються до запуску, а імпортована назва — жива прив’язка лише для читання."
      en: "CommonJS is the older system of Node.js: `require` runs as an ordinary call and returns the exports object, and destructuring copies the values of that moment. ES modules work both in the browser and in Node.js: imports are handled before running, and an imported name is a read-only live binding."

