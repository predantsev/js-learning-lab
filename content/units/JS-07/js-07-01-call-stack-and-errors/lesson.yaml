id: js-07-01-call-stack-and-errors
unit: JS-07
title:
  uk: "Синхронний стек викликів і що таке помилка"
  en: "The synchronous call stack and what an error is"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Прочитати stack trace згори донизу й назвати функцію, де кинуто помилку, та ланцюжок викликів, що до неї привів."
    en: "Read a stack trace top-down and name the function where the error was thrown and the chain of callers that led there."
  - uk: "Передбачити, які рядки консолі ще з’являться після необробленої помилки і які обробники подій продовжать працювати."
    en: "Predict which console lines still run after an uncaught error stops the current script, and which later handlers still work."
prerequisites: [js-03-08-recursion-base-case, js-01-05-reading-an-error, js-06-16-capstone-ui]
subskills:
  - { family: J-10, skill: "Error types/cause and throw", depth: intro }
glossary: [stack-trace, error-object, uncaught-exception]
selfCheck: [which-lines, trace-a-chain]

blocks:
  - id: stop-the-run
    kind: explanation
    title:
      uk: "Помилка зупиняє поточний запуск"
      en: "An error stops the current run"
    body:
      uk: |
        У JS-01 ти бачив: програма зупиняється на рядку коду з помилкою, і все, що нижче, не виконується. Тепер помилка трапляється **всередині функції**, яку викликала інша функція.

        Коли JavaScript не може виконати дію — наприклад, прочитати властивість у `undefined`, — він створює [[error-object|об’єкт помилки]] з типом (`TypeError`) і поясненням. Потім зупиняє функцію, що працює, **і всі функції, які чекають на неї** в [[call-stack|стеку викликів]]: жодна з них не отримає відповіді.

        Якщо помилку ніхто не обробив, це [[uncaught-exception|необроблена помилка]]. Поточний запуск програми на ній закінчується. Але сторінка не «вмирає»: обробники подій, які встигли зареєструватися, спрацюють і після помилки. Як обробляти помилки самостійно, розберемо через два уроки.
      en: |
        In JS-01 you saw that a program stops on the line of code with the error, and nothing below it runs. Now the error happens **inside a function** that another function called.

        When JavaScript cannot carry out an action — for example, read a property of `undefined` — it creates an [[error-object|error object]] with a type (`TypeError`) and an explanation. Then it stops the running function **and every function waiting for it** on the [[call-stack|call stack]]: none of them gets an answer.

        If nobody handles the error, it is an [[uncaught-exception|uncaught exception]]. The current run of the program ends there. But the page does not “die”: event listeners that were registered in time still run after the error. How to handle errors yourself comes two lessons later.

  - id: which-lines
    kind: prediction
    strings:
      start: { uk: "початок", en: "start" }
      rank: { uk: "ранг", en: "rank" }
      printedAll: { uk: "усе надруковано", en: "printed all" }
      end: { uk: "кінець", en: "end" }
    prompt:
      uk: "Справа `t-08` має пріоритет `\"urgent\"`, якого немає в об’єкті `priorities`. Що з’явиться в консолі?"
      en: "Task `t-08` has the priority `\"urgent\"`, which is not in the `priorities` object. What appears in the console?"
    code: |
      const priorities = { low: { rank: 3 }, normal: { rank: 2 }, high: { rank: 1 } };

      function rankOf(task) {
        return priorities[task.priority].rank;
      }

      function describe(task) {
        return task.id + " — %%rank%% " + rankOf(task);
      }

      function printAll(tasks) {
        for (const task of tasks) {
          console.log(describe(task));
        }
        console.log("%%printedAll%%");
      }

      console.log("%%start%%");
      printAll([
        { id: "t-02", priority: "high" },
        { id: "t-08", priority: "urgent" },
        { id: "t-03", priority: "low" },
      ]);
      console.log("%%end%%");
    verify:
      logs: ["%%start%%", "t-02 — %%rank%% 1"]
      error: TypeError
    answer:
      type: choice
      options:
        - id: two-then-error
          text:
            uk: "«початок», «t-02 — ранг 1», а далі помилка — і більше нічого"
            en: "“start”, “t-02 — rank 1”, then the error — and nothing more"
        - id: skips-broken
          text:
            uk: "«початок», «t-02 — ранг 1», «t-03 — ранг 3», «усе надруковано», «кінець»"
            en: "“start”, “t-02 — rank 1”, “t-03 — rank 3”, “printed all”, “end”"
          why:
            uk: "JavaScript не перестрибує через «погану» справу. Помилка зупиняє `rankOf`, а з нею й `describe`, `printAll` і код файла, що на них чекали. До `t-03` черга не доходить."
            en: "JavaScript does not jump over the “bad” task. The error stops `rankOf`, and with it `describe`, `printAll` and the file’s code that were waiting for them. `t-03` never gets its turn."
        - id: only-the-function
          text:
            uk: "«початок», «t-02 — ранг 1», «кінець»"
            en: "“start”, “t-02 — rank 1”, “end”"
          why:
            uk: "Помилка зупиняє не лише функцію, де виникла, а всі кадри стеку під нею — аж до коду самого файла. Тому `console.log` з «кінець» теж не виконується."
            en: "The error stops not only the function where it happened but every frame of the stack below it — down to the file’s own code. So the `console.log` with “end” does not run either."
        - id: undefined-rank
          text:
            uk: "«початок», «t-02 — ранг 1», «t-08 — ранг undefined», «t-03 — ранг 3», «усе надруковано», «кінець»"
            en: "“start”, “t-02 — rank 1”, “t-08 — rank undefined”, “t-03 — rank 3”, “printed all”, “end”"
          why:
            uk: "`priorities[\"urgent\"]` справді дає тихе `undefined`. Але далі код читає `.rank` **у** цього `undefined` — а це вже `TypeError`, не ще одне `undefined`."
            en: "`priorities[\"urgent\"]` does give a quiet `undefined`. But then the code reads `.rank` **of** that `undefined` — and that is a `TypeError`, not another `undefined`."
        - id: nothing
          text:
            uk: "Нічого: програма з помилкою не запускається"
            en: "Nothing: a program with an error does not start"
          why:
            uk: "Так поводиться лише помилка читання коду (`SyntaxError`). Цей код прочитано без проблем, тож рядки коду до помилки виконуються."
            en: "Only a code-reading error (`SyntaxError`) behaves like that. This code was read without trouble, so the lines before the error run."
      correct: [two-then-error]
    explanation:
      uk: "Для `t-02` усе гаразд, і її рядок у консолі з’являється. Для `t-08` вираз `priorities[task.priority]` дає `undefined`, а читання `.rank` у `undefined` кидає `TypeError`. Помилка зупиняє `rankOf`, потім `describe`, що чекала на її відповідь, потім `printAll` і, нарешті, код самого файла. Тому ні `t-03`, ні «усе надруковано», ні «кінець» не з’являються."
      en: "For `t-02` everything is fine, and its console line appears. For `t-08` the expression `priorities[task.priority]` gives `undefined`, and reading `.rank` of `undefined` throws a `TypeError`. The error stops `rankOf`, then `describe`, which was waiting for its answer, then `printAll` and finally the file’s own code. So neither `t-03`, nor “printed all”, nor “end” appears."

  - id: read-the-trace
    kind: explanation
    title:
      uk: "Як читати stack trace"
      en: "How to read a stack trace"
    body:
      uk: |
        Разом з об’єктом помилки браузер записує [[stack-trace|stack trace]] — список [[call-frame|кадрів]], які були в стеку викликів у мить помилки. Ось він для програми, яка показує, коли востаннє виконано кожну звичку (її код — у покроковій візуалізації нижче):

        ```text
        TypeError: Cannot read properties of undefined (reading 'length')
            at lastDone (index.js:2:35)
            at formatHabit (index.js:7:15)
            at render (index.js:13:17)
            at index.js:17:1
        ```

        Читай **згори донизу**:

        - **Перший рядок** stack trace — що сталося: тип і пояснення, як у JS-01.
        - **Перший кадр** — де помилку кинуто: функція `lastDone`, рядок коду 2, символ 35.
        - **Наступні кадри** — хто кого викликав: `lastDone` викликала `formatHabit` (рядок коду 7), а її — `render` (рядок коду 13).
        - **Останній кадр**, без назви функції, — код самого файла, з якого все почалося (рядок коду 17).

        > [!warning]
        > Перший кадр — місце, де JavaScript **помітив** проблему, а не обов’язково місце, де її треба виправляти. Якщо цей рядок коду правильний, спускайся кадрами вниз, доки не знайдеш, звідки прийшло погане значення.
      en: |
        Together with the error object, the browser records a [[stack-trace|stack trace]] — the list of [[call-frame|frames]] that were on the call stack at the moment of the error. Here it is for a program that shows when each habit was last done (its code is in the step-through visual below):

        ```text
        TypeError: Cannot read properties of undefined (reading 'length')
            at lastDone (index.js:2:35)
            at formatHabit (index.js:7:15)
            at render (index.js:13:17)
            at index.js:17:1
        ```

        Read it **top-down**:

        - **The first line** of the stack trace says what happened: the type and the explanation, as in JS-01.
        - **The first frame** is where the error was thrown: the function `lastDone`, line 2, column 35.
        - **The next frames** say who called whom: `lastDone` was called by `formatHabit` (line 7), and that one by `render` (line 13).
        - **The last frame**, without a function name, is the file’s own code where it all started (line 17).

        > [!warning]
        > The first frame is where JavaScript **noticed** the problem, not necessarily the place to fix. If that line of code is correct, go down the frames until you find where the bad value came from.

  - id: trace-steps
    kind: visual
    visual: code-trace
    title:
      uk: "Крок за кроком: звідки береться кожен кадр"
      en: "Step by step: where every frame comes from"
    textEquivalent:
      uk: "Програма викликає render зі списком двох звичок. У першої звички, h-03, є масив completions, а в другої, h-07, поле названо completion, без s у кінці. render кладе на стек свій кадр і перебирає звички. Для h-03 вона викликає formatHabit, а та — lastDone: у стеку викликів три кадри над кодом файла, верхній працює, решта чекають. lastDone рахує кількість днів і повертає останній день, 2026-03-01, її кадр знімається; formatHabit повертає текст h-03: 2026-03-01, і render друкує його. Для h-07 стек знову виростає до трьох кадрів, але вираз habit.completions дає undefined, бо такого поля немає, а читання length у undefined кидає TypeError. У цю мить у стеку викликів lastDone, formatHabit, render і код файла — саме ці кадри й у такому порядку друкує stack trace. Помилку ніхто не обробляє, тож зупиняються всі кадри разом, і останній console.log із done не виконується. Рядок коду 2 правильний; виправляти треба назву поля в даних звички h-07."
      en: "The program calls render with a list of two habits. The first habit, h-03, has a completions array, while in the second, h-07, the field is named completion, without the s at the end. render puts its frame on the stack and goes through the habits. For h-03 it calls formatHabit, which calls lastDone: there are three frames on the call stack above the file’s code, the top one runs and the others wait. lastDone counts the days and returns the last one, 2026-03-01, and its frame is removed; formatHabit returns the text h-03: 2026-03-01, and render prints it. For h-07 the stack grows to three frames again, but habit.completions gives undefined because there is no such field, and reading length of undefined throws a TypeError. At that moment the call stack holds lastDone, formatHabit, render and the file’s code — exactly the frames, in exactly that order, that the stack trace prints. Nobody handles the error, so all the frames stop together, and the last console.log with done never runs. Line 2 is correct; what needs fixing is the field name in the data of habit h-07."
    spec:
      file: visuals/habits-trace.js
      captions:
        - at: { line: 17 }
          text:
            uk: "Код файла викликає `render` зі списком двох звичок. Придивись до другої: у `h-07` поле називається `completion` — без «s» у кінці."
            en: "The file’s code calls `render` with a list of two habits. Look closely at the second one: in `h-07` the field is called `completion` — without the “s” at the end."
        - at: { line: 11, kind: call }
          text:
            uk: "`render` кладе на стек свій кадр. Під ним у **Call stack** — кадр коду файла, який чекає, доки `render` завершиться."
            en: "`render` puts its frame on the stack. Below it in the **Call stack** is the frame of the file’s code, waiting for `render` to finish."
        - at: { line: 1, kind: call }
          text:
            uk: "Звичка `h-03`: `render` викликала `formatHabit`, а та — `lastDone`. Тепер у **Call stack** три кадри над кодом файла. Працює верхній, решта чекають на відповідь."
            en: "Habit `h-03`: `render` called `formatHabit`, and that one called `lastDone`. Now there are three frames above the file’s code in the **Call stack**. The top one runs, the others wait for an answer."
        - at: { line: 3, kind: return }
          text:
            uk: "`lastDone` повертає останній день, `\"2026-03-01\"`, і її кадр знімається."
            en: "`lastDone` returns the last day, `\"2026-03-01\"`, and its frame is removed."
        - at: { line: 8, kind: return }
          text:
            uk: "`formatHabit` повертає текст для `h-03`. `render` надрукує його — у **Console** з’явиться перший рядок."
            en: "`formatHabit` returns the text for `h-03`. `render` will print it — the first line appears in the **Console**."
        - at: { line: 1, kind: call, hit: 2 }
          text:
            uk: "Звичка `h-07`: стек знову виріс до трьох кадрів над кодом файла — `lastDone`, `formatHabit`, `render`."
            en: "Habit `h-07`: the stack has grown to three frames above the file’s code again — `lastDone`, `formatHabit`, `render`."
        - at: { line: 2, kind: stmt, hit: 2 }
          text:
            uk: "Поля `completions` у цієї звички немає, тож `habit.completions` дасть `undefined`. А прочитати `length` у `undefined` неможливо."
            en: "This habit has no `completions` field, so `habit.completions` will give `undefined`. And reading `length` of `undefined` is impossible."
        - at: { line: 2, kind: throw }
          text:
            uk: "`TypeError`! Подивись на **Call stack**: `lastDone`, `formatHabit`, `render`, код файла — це й є stack trace, у тому самому порядку. Помилку ніхто не обробляє, тож зупиняються всі кадри разом, і `console.log(\"done\")` уже не виконається. Рядок коду 2 правильний: виправляти треба дані звички `h-07`."
            en: "`TypeError`! Look at the **Call stack**: `lastDone`, `formatHabit`, `render`, the file’s code — that is the stack trace, in the same order. Nobody handles the error, so all the frames stop together, and `console.log(\"done\")` never runs. Line 2 is correct: what needs fixing is the data of habit `h-07`."

  - id: frame-order
    kind: prediction
    strings:
      rank: { uk: "ранг", en: "rank" }
    prompt:
      uk: "Програма зі справами впала на справі з пріоритетом `\"urgent\"`. Розстав рядки її stack trace в тому порядку, в якому їх надрукує браузер, — згори донизу."
      en: "This program with tasks crashed on the task with the priority `\"urgent\"`. Put the lines of its stack trace in the order the browser prints them — top to bottom."
    code: |
      const priorities = { low: { rank: 3 }, normal: { rank: 2 }, high: { rank: 1 } };

      function rankOf(task) {
        return priorities[task.priority].rank;
      }

      function describe(task) {
        return task.id + " — %%rank%% " + rankOf(task);
      }

      function printAll(tasks) {
        for (const task of tasks) {
          console.log(describe(task));
        }
      }

      printAll([{ id: "t-08", priority: "urgent" }]);
    answer:
      type: order
      items:
        - id: message
          code: "TypeError: Cannot read properties of undefined (reading 'rank')"
        - id: rank-of
          code: "at rankOf (index.js:4:36)"
        - id: describe
          code: "at describe (index.js:8:33)"
        - id: print-all
          code: "at printAll (index.js:13:17)"
        - id: file
          code: "at index.js:17:1"
    explanation:
      uk: "Спершу — що сталося. Далі кадри від найглибшого: помилку кинуто в `rankOf`, її викликала `describe`, ту — `printAll`, а `printAll` — код файла. Рядок коду 4 у `rankOf` правильний; погане значення, `\"urgent\"`, прийшло з самого низу — зі списку справ, який передав код файла."
      en: "First, what happened. Then the frames from the deepest one: the error was thrown in `rankOf`, which was called by `describe`, which was called by `printAll`, which was called by the file’s code. Line 4 in `rankOf` is correct; the bad value, `\"urgent\"`, came from the very bottom — from the list of tasks that the file’s code passed in."

  - id: habits-page
    kind: example
    runtime: browser-js
    dir: habits-page
    entry: index.html
    expectError: true
    strings:
      lang: { uk: "uk", en: "en" }
      pageTitle: { uk: "Трекер звичок", en: "Habit tracker" }
      countButton: { uk: "Скільки звичок?", en: "How many habits?" }
      countText: { uk: "Звичок у списку: ", en: "Habits in the list: " }
      never: { uk: "ще не виконано", en: "not done yet" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      stretch: { uk: "Розтяжка", en: "Stretching" }
      water: { uk: "Пити воду", en: "Drink water" }
      renderedAll: { uk: "Список показано повністю", en: "The whole list is shown" }
    title:
      uk: "Сторінка, що впала на третій звичці"
      en: "A page that crashed on the third habit"
    body:
      uk: |
        Ця сторінка трекера звичок показує, коли кожну звичку виконано востаннє. Натисни **Запустити**, а тоді відкрий вкладку **Консоль**.

        Картка помилки показує тип, пояснення й лише одне місце — те, де помилку кинуто. Тому перші рядки коду в `main.js` реєструють обробник події `error` на `window` — об’єкті самої сторінки. Браузер викликає цей обробник для кожної помилки, яку не обробив жоден код, а `event.error` — це її об’єкт помилки. Обробник друкує `event.error.stack`, тож у консолі видно весь stack trace.
      en: |
        This habit tracker page shows when each habit was last done. Press **Run**, then open the **Console** tab.

        The error card shows the type, the explanation and only one place — where the error was thrown. That is why the first lines of code in `main.js` register a listener for the `error` event on `window` — the object of the page itself. The browser calls this listener for every error that no code handled, and `event.error` is its error object. The listener prints `event.error.stack`, so the console shows the whole stack trace.
    tryIt:
      uk: |
        1. На вкладці **Сторінка** лише дві звички з чотирьох. Прочитай stack trace у **Консолі** згори донизу: у якій функції кинуто помилку і хто її викликав?
        2. Перш ніж натиснути «Скільки звичок?», виріши: спрацює кнопка після помилки чи ні? Натисни й перевір.
        3. Рядок коду 7 у `lastDone` правильний. Останній кадр вказує на виклик `render(habits)`: погане значення прийшло звідти. Знайди звичку, у якої поле записано інакше, ніж в інших, і виправ **дані**, а не `lastDone`. Запусти знову: чотири звички, жодної помилки, а в консолі — «Список показано повністю».
      en: |
        1. The **Page** tab shows only two habits out of four. Read the stack trace in the **Console** top-down: in which function was the error thrown, and who called it?
        2. Before you press “How many habits?”, decide: will the button work after the error or not? Press it and check.
        3. Line 7 in `lastDone` is correct. The last frame points at the call `render(habits)`: the bad value came from there. Find the habit whose field is written differently from the others and fix the **data**, not `lastDone`. Run again: four habits, no error, and the console says “The whole list is shown”.

  - id: live-stack
    kind: explanation
    title:
      uk: "Stack trace без помилки"
      en: "A stack trace without an error"
    body:
      uk: |
        Об’єкт помилки можна створити, нічого не зупиняючи: `new Error("пояснення")` створює його так само, як `new Date()` створює дату. Поки його не кинуто, програма працює далі. А властивість `stack` у нього є одразу — це stack trace тієї миті, коли об’єкт створено.

        ```js
        function markDone(task) {
          console.log(new Error("markDone").stack);
          return { ...task, done: true };
        }
        ```

        Перший рядок коду функції друкує, **хто її викликав** і через які функції, а далі `markDone` працює як звичайно. Так перевіряють, яким шляхом програма дійшла до певного місця.

        > [!note]
        > В інструментах розробника браузера (DevTools) те саме робить `console.trace()`. Консоль платформи `console.trace()` не показує, тому тут друкуй `stack` сам.
      en: |
        You can create an error object without stopping anything: `new Error("explanation")` creates one, just as `new Date()` creates a date. Until it is thrown, the program keeps running. And it has its `stack` property right away — the stack trace of the moment the object was created.

        ```js
        function markDone(task) {
          console.log(new Error("markDone").stack);
          return { ...task, done: true };
        }
        ```

        The function’s first line of code prints **who called it** and through which functions, and then `markDone` works as usual. That is how you check which path the program took to reach a certain place.

        > [!note]
        > In the browser’s developer tools (DevTools), `console.trace()` does the same. The platform’s console does not show `console.trace()`, so here you print `stack` yourself.

  - id: recall
    kind: review
    title:
      uk: "Згадай: кадри рекурсії"
      en: "Recall: frames of recursion"
    items:
      - id: enter-leave
        from: js-03-08-recursion-base-case
        prompt:
          uk: "Що виведе програма?"
          en: "What does the program print?"
        code: |
          function visit(level) {
            console.log("→ " + level);
            if (level < 2) {
              visit(level + 1);
            }
            console.log("← " + level);
          }

          visit(1);
        verify:
          logs: ["→ 1", "→ 2", "← 2", "← 1"]
        answer:
          type: choice
          options:
            - id: nested
              code: "→ 1\n→ 2\n← 2\n← 1"
            - id: one-by-one
              code: "→ 1\n← 1\n→ 2\n← 2"
              why:
                uk: "`visit(1)` не завершується перед `visit(2)`: вона чекає, доки `visit(2)` поверне керування, і лише потім друкує «← 1»."
                en: "`visit(1)` does not finish before `visit(2)`: it waits until `visit(2)` gives control back, and only then prints “← 1”."
            - id: first-out-first
              code: "→ 1\n→ 2\n← 1\n← 2"
              why:
                uk: "Кадри знімаються у зворотному порядку: першим завершується найновіший, з `level = 2`."
                en: "Frames come off in reverse order: the newest one, with `level = 2`, finishes first."
          correct: [nested]
        explanation:
          uk: "Кожен виклик кладе кадр на стек: спершу `visit(1)`, над ним `visit(2)`. Верхній кадр завершується першим, тому «← 2» стоїть перед «← 1». Так само влаштований stack trace: зверху — найновіший кадр, знизу — найстаріший."
          en: "Every call puts a frame on the stack: first `visit(1)`, then `visit(2)` above it. The top frame finishes first, so “← 2” comes before “← 1”. A stack trace is built the same way: the newest frame on top, the oldest at the bottom."

  - id: trace-a-chain
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: trace-a-chain
    entry: index.js
    strings:
      lunch: { uk: "Обід", en: "Lunch" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      uah: { uk: "грн", en: "UAH" }
    title:
      uk: "Покажи шлях до функції"
      en: "Show the path to a function"
    instructions:
      uk: |
        Напиши три функції для однієї витрати. Вони викликають одна одну: `printExpense` → `formatRow` → `formatAmount`.

        - `formatAmount(amountMinor)` повертає суму в гривнях із двома цифрами після крапки: `21050` → «210.50 грн». Суми зберігаються в копійках, тож поділи на 100; метод `toFixed(2)` перетворює число на текст рівно з двома цифрами після крапки: `(9.9).toFixed(2)` дає `"9.90"`. Перед `return` функція друкує в консоль stack trace цієї миті.
        - `formatRow(expense)` повертає назву витрати, двокрапку з пробілом і суму від `formatAmount`: «Обід: 210.50 грн».
        - `printExpense(expense)` виводить у консоль текст, який повертає `formatRow`.

        Запусти й прочитай stack trace у консолі: він має показати весь шлях від коду файла до `formatAmount`.
      en: |
        Write three functions for one expense. They call each other: `printExpense` → `formatRow` → `formatAmount`.

        - `formatAmount(amountMinor)` returns the amount in hryvnias with two digits after the point: `21050` → “210.50 UAH”. Amounts are stored in kopiykas, so divide by 100; the method `toFixed(2)` turns a number into text with exactly two digits after the point: `(9.9).toFixed(2)` gives `"9.90"`. Before `return`, the function prints the stack trace of that moment to the console.
        - `formatRow(expense)` returns the expense label, a colon with a space and the amount from `formatAmount`: “Lunch: 210.50 UAH”.
        - `printExpense(expense)` prints the text that `formatRow` returns to the console.

        Run it and read the stack trace in the console: it must show the whole path from the file’s code to `formatAmount`.
    testTitles:
      "the program runs without an error":
        uk: "Програма виконується без помилок"
        en: "The program runs without an error"
      "formatAmount returns hryvnias with two digits after the point":
        uk: "formatAmount повертає гривні з двома цифрами після крапки"
        en: "formatAmount returns hryvnias with two digits after the point"
      "formatRow joins the label and the amount":
        uk: "formatRow поєднує назву й суму"
        en: "formatRow joins the label and the amount"
      "printExpense prints the row":
        uk: "printExpense виводить текст витрати"
        en: "printExpense prints the expense text"
      "formatAmount prints the stack trace of the chain":
        uk: "formatAmount друкує stack trace усього ланцюжка"
        en: "formatAmount prints the stack trace of the whole chain"
    hints:
      nudge:
        uk: "Почни з найглибшої функції: `formatAmount` нікого не викликає. Тоді `formatRow` викличе її, а `printExpense` — `formatRow`."
        en: "Start with the deepest function: `formatAmount` calls nobody. Then `formatRow` will call it, and `printExpense` will call `formatRow`."
      explanation:
        uk: "Stack trace «без помилки» дає об’єкт помилки, якого ніхто не кидає: його властивість `stack` описує стек тієї миті, коли об’єкт створено. Отже, об’єкт треба створити **всередині** `formatAmount` — там, де ланцюжок найглибший, — і вивести в консоль його `stack`, а не сам об’єкт."
        en: "A stack trace “without an error” comes from an error object that nobody throws: its `stack` property describes the stack of the moment the object was created. So the object has to be created **inside** `formatAmount` — where the chain is deepest — and its `stack`, not the object itself, printed to the console."
    solutionNote:
      uk: "`new Error(…)` у `formatAmount` нічого не зупиняє, а його `stack` перелічує кадри від `formatAmount` через `formatRow` і `printExpense` до коду файла — точний шлях виклику. Ділення на 100 переводить копійки в гривні, а `toFixed(2)` дає рівно дві цифри після крапки навіть для `180.00`."
      en: "`new Error(…)` in `formatAmount` stops nothing, and its `stack` lists the frames from `formatAmount` through `formatRow` and `printExpense` to the file’s code — the exact call path. Dividing by 100 turns kopiykas into hryvnias, and `toFixed(2)` gives exactly two digits after the point, even for `180.00`."
    feedback:
      - when: { test: "formatAmount returns hryvnias with two digits after the point" }
        message:
          uk: "`formatAmount` має повертати текст на зразок «210.50 грн»: 21050 → «210.50 грн», 18000 → «180.00 грн». Поділи суму на 100, а `toFixed(2)` дасть рівно дві цифри після крапки; після числа — пробіл і «грн»."
          en: "`formatAmount` must return text like “210.50 UAH”: 21050 → “210.50 UAH”, 18000 → “180.00 UAH”. Divide the amount by 100, and `toFixed(2)` gives exactly two digits after the point; after the number comes a space and “UAH”."
      - when: { test: "formatRow joins the label and the amount" }
        message:
          uk: "`formatRow` має повертати назву витрати, потім «: » і результат `formatAmount` — наприклад, «Кава з друзями: 180.00 грн»."
          en: "`formatRow` must return the expense label, then “: ” and the result of `formatAmount` — for example, “Coffee with friends: 180.00 UAH”."
      - when: { test: "printExpense prints the row" }
        message:
          uk: "Ця перевірка шукає в консолі текст «Обід: 210.50 грн» — те, що повертає `formatRow`, виведене через `console.log` у `printExpense`."
          en: "This check looks in the console for the text “Lunch: 210.50 UAH” — what `formatRow` returns, printed with `console.log` in `printExpense`."
      - when: { test: "formatAmount prints the stack trace of the chain" }
        message:
          uk: "Ця перевірка шукає в консолі stack trace, де `formatAmount`, `formatRow` і `printExpense` ідуть саме в такому порядку. Такий текст дає властивість `stack` об’єкта помилки, створеного **всередині `formatAmount`**. Сам об’єкт помилки консоль показує лише першим рядком, а `console.trace()` консоль платформи не показує взагалі."
          en: "This check looks in the console for a stack trace in which `formatAmount`, `formatRow` and `printExpense` come in exactly this order. Such text comes from the `stack` property of an error object created **inside `formatAmount`**. The console shows an error object itself only as its first line, and the platform’s console does not show `console.trace()` at all."

  - id: to-project
    kind: transfer
    capstoneStep: JS-07
    body:
      uk: "Коли сторінка твого проєкту впаде, не поспішай виправляти рядок коду з картки помилки. Прочитай stack trace донизу й знайди, звідки прийшло погане значення: найчастіше це запис із пропущеним чи перекрученим полем, який функції отримали ззовні. У кроці проєкту цього розділу таких записів буде чимало — вони прийдуть зі сховища."
      en: "When your project’s page crashes, do not rush to fix the line of code from the error card. Read the stack trace downwards and find where the bad value came from: most often it is a record with a missing or misspelled field that the functions received from outside. This unit’s project step has plenty of such records — they will come from storage."
