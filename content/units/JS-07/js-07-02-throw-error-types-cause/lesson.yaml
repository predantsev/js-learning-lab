id: js-07-02-throw-error-types-cause
unit: JS-07
title:
  uk: "throw, типи помилок і cause"
  en: "throw, Error types and cause"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Кинути `Error`, `TypeError` або `RangeError`, тип якої відповідає проблемі, а повідомлення називає погане значення."
    en: "Throw an `Error`, `TypeError` or `RangeError` whose type matches the problem and whose message names the bad value."
  - uk: "Додати до нової помилки подробиці через `new Error(message, { cause })` і прочитати в консолі і `message`, і `cause`."
    en: "Attach the details of a problem to a new error with `new Error(message, { cause })` and read both its `message` and its `cause` in the console."
  - uk: "Пояснити, чому кинутий текст губить stack trace, а повернутий `null` ховає проблему від того, хто викликав."
    en: "Explain why a thrown string loses the stack trace and why a returned `null` hides the problem from the caller."
prerequisites: [js-07-01-call-stack-and-errors, js-02-11-independent-validation]
subskills:
  - { family: J-10, skill: "Error types/cause and throw", depth: practice }
glossary: [throw-statement, type-error, range-error, error-cause]
selfCheck: [string-thrown, price-guard]

blocks:
  - id: throw-it
    kind: explanation
    title:
      uk: "throw: зупинитися й повідомити"
      en: "throw: stop and report"
    body:
      uk: |
        У попередньому уроці помилки кидав сам JavaScript. Свою помилку кидає інструкція [[throw-statement|`throw`]]:

        ```js
        function setAmount(expense, amountMinor) {
          if (amountMinor <= 0) {
            throw new RangeError("amountMinor must be above 0, got " + amountMinor);
          }
          return { ...expense, amountMinor: amountMinor };
        }
        ```

        `throw` зупиняє функцію там, де стоїть, і помилка йде стеком викликів угору — так само, як `TypeError` у попередньому уроці. Рядок коду з `return` уже не виконається.

        Обирай тип, який називає проблему:

        | Тип | Коли | Приклад |
        |---|---|---|
        | [[type-error\|TypeError]] | значення не того типу | сума — текст `"845"` замість числа |
        | [[range-error\|RangeError]] | тип правильний, але значення поза дозволеними межами чи переліком | сума `-500`; пріоритет `"urgent"` |
        | `Error` | загальна проблема, точніший тип не підходить | витрату не вдалося зберегти |

        У повідомленні пиши, **що очікувалося і що прийшло**: `amountMinor must be above 0, got -500`. Повідомлення помилок читають розробники, тому їх зазвичай пишуть англійською — як і вбудовані.
      en: |
        In the previous lesson JavaScript threw the errors itself. Your own error is thrown by the [[throw-statement|`throw`]] statement:

        ```js
        function setAmount(expense, amountMinor) {
          if (amountMinor <= 0) {
            throw new RangeError("amountMinor must be above 0, got " + amountMinor);
          }
          return { ...expense, amountMinor: amountMinor };
        }
        ```

        `throw` stops the function right where it stands, and the error travels up the call stack — just like the `TypeError` in the previous lesson. The line with `return` never runs.

        Choose the type that names the problem:

        | Type | When | Example |
        |---|---|---|
        | [[type-error\|TypeError]] | the value has the wrong type | the amount is the text `"845"` instead of a number |
        | [[range-error\|RangeError]] | the type is right, but the value is outside the allowed range or list | the amount `-500`; the priority `"urgent"` |
        | `Error` | a general problem, no more precise type fits | the expense could not be saved |

        In the message, write **what was expected and what came in**: `amountMinor must be above 0, got -500`. Error messages are read by developers, so they are usually written in English — like the built-in ones.

  - id: string-thrown
    kind: prediction
    prompt:
      uk: "Ця програма кидає не об’єкт помилки, а текст. Обробник події `error` на `window` друкує тип того, що він отримав, і його властивість `stack`. Що з’явиться в консолі?"
      en: "This program throws text instead of an error object. The `error` event listener on `window` prints the type of what it received and its `stack` property. What appears in the console?"
    code: |
      window.addEventListener("error", (event) => {
        console.log(typeof event.error, event.error.stack);
      });

      function setPriority(task, priority) {
        if (priority !== "low" && priority !== "normal" && priority !== "high") {
          throw "bad priority";
        }
        return { ...task, priority: priority };
      }

      setPriority({ id: "t-02", priority: "normal" }, "urgent");
    verify:
      logs: ["string undefined"]
      error: "Thrown value"
    answer:
      type: choice
      options:
        - id: string-no-stack
          code: "string undefined"
        - id: object-with-stack
          text:
            uk: "`object` і stack trace, що починається з `setPriority`"
            en: "`object` and a stack trace that starts at `setPriority`"
          why:
            uk: "`throw` передає значення як є. JavaScript не загортає текст в об’єкт помилки, тож немає чому зберегти stack trace."
            en: "`throw` passes the value on as it is. JavaScript does not wrap the text in an error object, so there is nothing to keep a stack trace."
        - id: string-with-stack
          text:
            uk: "`string` і stack trace, що починається з `setPriority`"
            en: "`string` and a stack trace that starts at `setPriority`"
          why:
            uk: "Властивість `stack` з’являється лише в об’єкта помилки, у мить його створення. У звичайного тексту її немає: `\"bad priority\".stack` — це `undefined`."
            en: "The `stack` property appears only on an error object, at the moment it is created. Plain text has none: `\"bad priority\".stack` is `undefined`."
        - id: cannot-throw-text
          text:
            uk: "Нічого: `throw` приймає лише об’єкти помилок"
            en: "Nothing: `throw` accepts only error objects"
          why:
            uk: "JavaScript дозволяє кинути будь-яке значення — текст, число, навіть `null`. У цьому й пастка: ніхто не попередить, що кинуто не об’єкт помилки."
            en: "JavaScript lets you throw any value — text, a number, even `null`. That is the trap: nobody warns you that what was thrown is not an error object."
      correct: [string-no-stack]
    explanation:
      uk: "`event.error` — саме те, що кинули: текст. У тексту немає ні `name`, ні `stack`, тож код, який отримає таку «помилку», не дізнається ні її типу, ні місця, звідки її кинуто. Навіть картка помилки на платформі не може назвати рядок коду."
      en: "`event.error` is exactly what was thrown: text. Text has neither `name` nor `stack`, so code that receives such an “error” learns neither its type nor the place it was thrown from. Even the platform’s error card cannot name the line of code."

  - id: two-throws
    kind: example
    runtime: browser-js
    dir: two-throws
    entry: index.js
    expectError: true
    strings:
      books: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
    title:
      uk: "Текст проти об’єкта помилки"
      en: "Text versus an error object"
    body:
      uk: |
        Обробник події `error` друкує `name`, `message` і `stack` того, що кинули. Поки що `setPriority` кидає текст. Натисни **Запустити** й подивись на **Консоль**.
      en: |
        The `error` event listener prints the `name`, `message` and `stack` of whatever was thrown. For now `setPriority` throws text. Press **Run** and look at the **Console**.
    tryIt:
      uk: |
        1. Перший рядок консолі — справа з новим пріоритетом. Далі три `undefined`: у тексту немає ні типу, ні повідомлення, ні stack trace. Картка помилки теж не називає рядка коду.
        2. Постав `//` на початку рядка коду з `throw "bad priority";` і прибери `//` з наступного рядка коду. Запусти знову.
        3. Тепер у консолі тип `RangeError`, повідомлення зі значенням `urgent` і stack trace: помилку кинуто в `setPriority`, а викликав її рядок коду `setPriority(books, "urgent")`.
      en: |
        1. The first console line is the task with its new priority. Then come three `undefined`s: text has no type, no message and no stack trace. The error card cannot name a line of code either.
        2. Put `//` at the start of the line `throw "bad priority";` and remove the `//` from the next line. Run again.
        3. Now the console shows the type `RangeError`, a message with the value `urgent`, and a stack trace: the error was thrown in `setPriority`, which was called by the line `setPriority(books, "urgent")`.

  - id: null-sneaks-in
    kind: prediction
    strings:
      eighty: { uk: "вісімдесят", en: "eighty" }
    prompt:
      uk: "`parsePrice` повертає `null`, коли текст не схожий на число. Що виведе програма?"
      en: "`parsePrice` returns `null` when the text does not look like a number. What does the program print?"
    code: |
      function parsePrice(text) {
        const price = Number(text);
        if (Number.isNaN(price)) {
          return null;
        }
        return price;
      }

      let total = 0;
      for (const text of ["45", "%%eighty%%", "18"]) {
        total = total + parsePrice(text);
      }
      console.log(total);
    verify:
      logs: ["63"]
    answer:
      type: choice
      options:
        - id: sixty-three
          code: "63"
        - id: nan
          code: "NaN"
          why:
            uk: "`null` в арифметиці стає `0`, а не `NaN`. Тому сума не «ламається» — вона тихо стає меншою."
            en: "In arithmetic `null` becomes `0`, not `NaN`. So the total does not “break” — it quietly gets smaller."
        - id: type-error
          text:
            uk: "`TypeError` на другому тексті"
            en: "A `TypeError` on the second text"
          why:
            uk: "Нічого не кидається: `parsePrice` чесно повертає `null`, а `45 + null` дає `45`. Помилки немає — саме це й небезпечно."
            en: "Nothing is thrown: `parsePrice` honestly returns `null`, and `45 + null` gives `45`. There is no error — and that is exactly the danger."
        - id: all-three
          code: "143"
          why:
            uk: "`Number` не розуміє слів: для такого тексту він дає `NaN`, і `parsePrice` повертає `null`."
            en: "`Number` does not understand words: for such text it gives `NaN`, and `parsePrice` returns `null`."
      correct: [sixty-three]
    explanation:
      uk: "Друга ціна тихо зникла з суми: `45 + null` — це `45`. Програма не впала й не попередила — просто показала неправильне число. Хто викликав `parsePrice`, той мав перевірити `null`, але забув — і ніщо йому не нагадало."
      en: "The second price quietly vanished from the total: `45 + null` is `45`. The program did not crash and did not warn — it just showed the wrong number. Whoever called `parsePrice` had to check for `null` but forgot — and nothing reminded them."

  - id: recall
    kind: review
    title:
      uk: "Згадай: результат перевірки"
      en: "Recall: a validation result"
    items:
      - id: form-result
        from: js-02-11-independent-validation
        prompt:
          uk: "Користувач надіслав форму витрати з порожньою назвою й сумою `0`. Що має повернути функція перевірки, щоб форма показала повідомлення біля **обох** полів?"
          en: "A user submitted the expense form with an empty label and the amount `0`. What should the validation function return so that the form shows a message next to **both** fields?"
        answer:
          type: choice
          options:
            - id: result-object
              code: '{ ok: false, errors: { label: "required", amountMinor: "not-positive" } }'
            - id: throw-first
              code: 'throw new Error("label is required")'
              why:
                uk: "`throw` зупиняє перевірку на першій проблемі — про суму форма вже не дізнається. Формі потрібен перелік **усіх** проблем."
                en: "`throw` stops the check at the first problem — the form never learns about the amount. The form needs a list of **all** the problems."
            - id: just-null
              code: "null"
              why:
                uk: "`null` каже лише «щось не так», але не каже, що саме й у якому полі."
                en: "`null` only says “something is wrong”, not what or in which field."
          correct: [result-object]
        explanation:
          uk: "Перевірка для форми повертає результат: `ok` і проблеми **всіх** полів одразу. Форма читає його й показує повідомлення біля кожного поля. Порожнє поле у формі — звичайна ситуація, тож кидати помилку тут не потрібно: треба показати користувачеві, що виправити."
          en: "A check for a form returns a result: `ok` and the problems of **all** fields at once. The form reads it and shows a message next to every field. An empty field in a form is an ordinary situation, so there is no need to throw here: the user must be shown what to fix."

  - id: null-or-throw
    kind: explanation
    title:
      uk: "Повернути результат чи кинути помилку?"
      en: "Return a result or throw?"
    body:
      uk: |
        Обидва способи кажуть «щось не так», але по-різному:

        - **Повернути результат** (`{ ok: false, errors }`) — коли проблема очікувана і той, хто викликає, знає, що з нею робити. Так працює перевірка форми.
        - **Кинути помилку** — коли функція не може виконати свою роботу і продовжувати не можна. Помилка зупиняє все там, де проблему помітили, і несе тип та повідомлення.

        Повертати `null` для поганих даних — найгірше з обох. Як у прогнозі з `parsePrice`, `null` мовчки йде далі, а в арифметиці стає `0`. Проблема спливає пізніше й далеко від причини — або не спливає взагалі.
      en: |
        Both ways say “something is wrong”, but differently:

        - **Return a result** (`{ ok: false, errors }`) — when the problem is expected and the caller knows what to do with it. That is how a form check works.
        - **Throw an error** — when the function cannot do its job and carrying on is impossible. The error stops everything right where the problem was noticed, and it carries a type and a message.

        Returning `null` for bad data is the worst of both. As in the prediction with `parsePrice`, `null` silently moves on and becomes `0` in arithmetic. The problem surfaces later and far from its cause — or never.

  - id: with-cause
    kind: explanation
    title:
      uk: "Причина помилки: cause"
      en: "An error’s cause"
    body:
      uk: |
        Буває, що функція не може виконати роботу через дрібнішу проблему. Тоді вона кидає **свою** зрозумілу помилку, а подробиці додає як [[error-cause|причину]] — другим аргументом `new Error`:

        ```js
        function saveExpense(input) {
          const result = validateExpense(input);
          if (!result.ok) {
            throw new Error("expense cannot be saved", { cause: result.errors });
          }
          // … save the expense
        }
        ```

        Тепер у помилки дві частини: `message` каже, **що** не вдалося, а `cause` — **чому**, наприклад `{ label: "required" }`. Причиною може бути будь-яке значення: об’єкт із подробицями, як тут, або інша помилка — це буде в наступному уроці.
      en: |
        Sometimes a function cannot do its job because of a smaller problem. Then it throws **its own** clear error and adds the details as the [[error-cause|cause]] — the second argument of `new Error`:

        ```js
        function saveExpense(input) {
          const result = validateExpense(input);
          if (!result.ok) {
            throw new Error("expense cannot be saved", { cause: result.errors });
          }
          // … save the expense
        }
        ```

        Now the error has two parts: `message` says **what** failed, and `cause` says **why**, for example `{ label: "required" }`. The cause can be any value: an object with details, as here, or another error — that comes in the next lesson.

  - id: save-with-cause
    kind: example
    runtime: browser-js
    dir: save-with-cause
    entry: index.js
    expectError: true
    strings:
      saved: { uk: "Збережено: ", en: "Saved: " }
      water: { uk: "Пити воду", en: "Drink water" }
    title:
      uk: "Помилка з причиною"
      en: "An error with a cause"
    body:
      uk: |
        `saveHabit` зберігає звичку лише тоді, коли `validateHabit` не знайшла проблем. Інакше вона кидає `Error` з причиною — переліком проблем полів. Обробник події `error` друкує `message` і `cause`. Натисни **Запустити**.
      en: |
        `saveHabit` saves a habit only when `validateHabit` found no problems. Otherwise it throws an `Error` with a cause — the list of field problems. The `error` event listener prints `message` and `cause`. Press **Run**.
    tryIt:
      uk: |
        1. Перша звичка збереглася. Для другої консоль показує, **що** не вдалося (`message`) і **чому** (`cause`: обидва поля).
        2. Картка помилки показує `message`, а під ним — причину з властивості `cause`. Код, що отримує помилку, читає причину сам: тут це обробник події `error`.
        3. Зміни другу звичку на `{ name: "Читати", frequency: "weekly" }` і запусти: тепер вона зберігається. Потім зроби `frequency: "hourly"` — у причині залишиться тільки `frequency`.
      en: |
        1. The first habit was saved. For the second, the console shows **what** failed (`message`) and **why** (`cause`: both fields).
        2. The error card shows the `message` and, below it, the cause from the `cause` property. Code that receives the error reads the cause itself: here that is the `error` event listener.
        3. Change the second habit to `{ name: "Read", frequency: "weekly" }` and run: now it is saved. Then make it `frequency: "hourly"` — only `frequency` stays in the cause.

  - id: price-guard
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: price-guard
    entry: index.js
    title:
      uk: "Охоронець ціни"
      en: "A price guard"
    instructions:
      uk: |
        Напиши `assertValidPrice(value)` для списку бажань. Вона перевіряє ціну й повертає її, якщо все гаразд:

        - `null` — дозволене значення, «ціни ще немає». Поверни `null`.
        - Для всього, що не є числом, — тексту `"80"`, `undefined`, а також `NaN` — функція кидає `TypeError`.
        - Для від’ємного числа вона кидає `RangeError`.
        - Будь-яке інше число, зокрема `0`, функція повертає без змін.

        Повідомлення помилки має містити значення, яке прийшло, — наприклад, `price must be at least 0, got -5`.

        Унизу файла є виклики для спроб. Помилковий виклик зупинить файл, тому пробуй їх по одному, а перед **Перевірити** знову постав `//`.
      en: |
        Write `assertValidPrice(value)` for the wishlist. It checks a price and returns it when everything is fine:

        - `null` is an allowed value: “no price yet”. Return `null`.
        - For anything that is not a number — the text `"80"`, `undefined`, and also `NaN` — the function throws a `TypeError`.
        - For a negative number it throws a `RangeError`.
        - Any other number, `0` included, is returned unchanged.

        The error message must contain the value that came in — for example, `price must be at least 0, got -5`.

        At the bottom of the file there are calls to try. A wrong call stops the file, so try them one at a time, and put the `//` back before you press **Check**.
    testTitles:
      "the file runs to its end":
        uk: "Файл виконується до кінця"
        en: "The file runs to its end"
      "returns a valid price unchanged":
        uk: "Повертає правильну ціну без змін"
        en: "Returns a valid price unchanged"
      "accepts null as no price":
        uk: "Приймає null як «ціни ще немає»"
        en: "Accepts null as “no price yet”"
      "throws a TypeError for a price written as text":
        uk: "Кидає TypeError для ціни, записаної текстом"
        en: "Throws a TypeError for a price written as text"
      "throws a TypeError for a missing price":
        uk: "Кидає TypeError, коли ціни немає зовсім (undefined)"
        en: "Throws a TypeError when the price is missing (undefined)"
      "throws a TypeError for NaN":
        uk: "Кидає TypeError для NaN"
        en: "Throws a TypeError for NaN"
      "throws a RangeError for a negative price":
        uk: "Кидає RangeError для від’ємної ціни"
        en: "Throws a RangeError for a negative price"
      "the message names the bad value":
        uk: "Повідомлення називає погане значення"
        en: "The message names the bad value"
    hints:
      nudge:
        uk: "Порядок перевірок важливий. Що станеться з `null`, якщо першою буде перевірка `typeof`?"
        en: "The order of the checks matters. What happens to `null` if the `typeof` check comes first?"
      explanation:
        uk: "`typeof null` дає `\"object\"`, а `typeof NaN` — `\"number\"`, тож обидва випадки треба відділити окремо: `null` — найперше й одразу повернути, а `NaN` — разом із перевіркою типу, через `Number.isNaN`. Кожна погана гілка закінчується `throw` з об’єктом помилки потрібного типу; до повідомлення допиши значення через `+`."
        en: "`typeof null` gives `\"object\"`, and `typeof NaN` gives `\"number\"`, so both cases need their own check: `null` first of all, returned at once, and `NaN` together with the type check, through `Number.isNaN`. Each bad branch ends with `throw` and an error object of the right type; append the value to the message with `+`."
    solutionNote:
      uk: "`null` перевіряється першим, бо `typeof null` — `\"object\"`. `NaN` має тип `number`, тому його відсіює `Number.isNaN`. Тип помилки каже, **яка** проблема (`TypeError` чи `RangeError`), а значення в повідомленні — **з чим** саме. Той, хто викличе `assertValidPrice` з поганим значенням, отримає помилку одразу, а не тихий `null`."
      en: "`null` is checked first because `typeof null` is `\"object\"`. `NaN` has the type `number`, so `Number.isNaN` filters it out. The error type says **which** problem it is (`TypeError` or `RangeError`), and the value in the message says **with what**. Whoever calls `assertValidPrice` with a bad value gets an error at once, not a quiet `null`."
    feedback:
      - when: { test: "the file runs to its end" }
        message:
          uk: "Ця перевірка чекає, що файл виконається до кінця без необробленої помилки — інакше перевірки не бачать функції. Якщо на картці помилки твій пробний виклик унизу файла, знову постав перед ним `//`; якщо ні — прочитай тип, повідомлення й рядок коду на картці."
          en: "This check expects the file to run to its end without an uncaught error — otherwise the checks cannot see the function. If the error card shows your trial call at the bottom of the file, put the `//` back in front of it; if not, read the type, the message and the line of code on the card."
      - when: { test: "returns a valid price unchanged" }
        message:
          uk: "Для правильної ціни функція нічого не кидає й повертає ту саму ціну — зокрема `0`, бо безкоштовна річ — теж правильна ціна."
          en: "For a valid price the function throws nothing and returns the same price — `0` included, because a free thing is a valid price too."
      - when: { test: "accepts null as no price" }
        message:
          uk: "`null` у полі ціни означає «ціни ще немає» — це дозволене значення, його треба повернути. Перевір `null` найпершим: `typeof null` дає `\"object\"`, тож інакше `null` потрапить у перевірку типу."
          en: "`null` in the price field means “no price yet” — it is an allowed value and must be returned. Check `null` first of all: `typeof null` gives `\"object\"`, so otherwise `null` lands in the type check."
      - when: { test: "throws a TypeError for a price written as text" }
        message:
          uk: "Для тексту `\"80\"` функція має кинути об’єкт помилки типу `TypeError` — не текст, не `null` і не загальний `Error`: тип мусить сказати, що проблема саме в типі значення."
          en: "For the text `\"80\"` the function must throw an error object of type `TypeError` — not text, not `null` and not a general `Error`: the type must say that the problem is the value’s type."
      - when: { test: "throws a TypeError for a missing price" }
        message:
          uk: "`undefined` — це «ціну взагалі не передали», а не «ціни ще немає». Для нього теж потрібна `TypeError`."
          en: "`undefined` means “no price was passed at all”, not “no price yet”. It needs a `TypeError` too."
      - when: { test: "throws a TypeError for NaN" }
        message:
          uk: "Ця перевірка чекає `TypeError` для `NaN`. Зверни увагу: `typeof NaN` дає `\"number\"`, тож сама перевірка `typeof` `NaN` не відсіює — для нього є `Number.isNaN`."
          en: "This check expects a `TypeError` for `NaN`. Note: `typeof NaN` gives `\"number\"`, so a `typeof` check alone does not filter `NaN` out — that is what `Number.isNaN` is for."
      - when: { test: "throws a RangeError for a negative price" }
        message:
          uk: "Від’ємна ціна — число, тобто тип правильний, а значення поза межами. Для неї потрібна `RangeError`."
          en: "A negative price is a number, so the type is right but the value is out of range. It needs a `RangeError`."
      - when: { test: "the message names the bad value" }
        message:
          uk: "Повідомлення помилки має містити саме значення, яке прийшло: для `-5` — «-5», для `\"80\"` — «80», для `NaN` — «NaN». Тоді з консолі одразу видно, з чим була проблема."
          en: "The error message must contain the very value that came in: “-5” for `-5`, “80” for `\"80\"`, “NaN” for `NaN`. Then the console shows at once what the problem was with."

  - id: to-project
    kind: transfer
    capstoneStep: JS-07
    body:
      uk: "У кроці проєкту ти перевірятимеш записи, що прийшли зі сховища. Функція, яка не може працювати з поганим записом, кидає помилку з типом і значенням у повідомленні, а перевірка для форми, як і раніше, повертає `{ ok, errors }`. А подробиці перевірки стануть причиною (`cause`) помилки збереження чи завантаження."
      en: "In the project step you will check records that came from storage. A function that cannot work with a bad record throws an error with a type and the value in its message, while the form check still returns `{ ok, errors }`. And the details of a check become the `cause` of a save or load error."
