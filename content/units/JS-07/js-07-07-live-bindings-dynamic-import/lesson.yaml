id: js-07-07-live-bindings-dynamic-import
unit: JS-07
title:
  uk: "Живі прив’язки та динамічний import"
  en: "Live bindings and dynamic import"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Передбачити, що побачить модуль, який імпортує змінну `let`, після того як модуль-власник присвоїть їй нове значення, і пояснити, чому сам імпортер присвоїти їй не може."
    en: "Predict what an importer sees after the exporting module reassigns an exported `let`, and explain why the importer itself cannot assign to it."
  - uk: "Завантажити рідко потрібний модуль на вимогу через `import()`, скористатися ним через `.then`, коли він прийде, і показати запасне повідомлення, якщо завантаження не вдалося."
    en: "Load a rarely used module on demand with `import()`, use it with `.then` once it arrives, and show a fallback message when loading fails."
prerequisites: [js-07-06-esm-import-export, js-02-01-const-let]
subskills:
  - { family: J-10, skill: "ESM imports/exports/live bindings", depth: practice }
  - { family: J-10, skill: "dynamic import", depth: intro }
glossary: [live-binding, dynamic-import]
selfCheck: [streak-view, next-line, help-on-demand]

blocks:
  - id: live
    kind: explanation
    title:
      uk: "Імпорт — це не копія"
      en: "An import is not a copy"
    body:
      uk: |
        Звичайна змінна отримує значення в мить присвоєння. З імпортом інакше: імпортована назва — це [[live-binding|жива прив’язка]], «віконце» на змінну в модулі-власнику. Коли той модуль присвоює своїй змінній нове значення, усі, хто її імпортував, одразу бачать нове.

        ```js
        // visits.js
        export let visits = 0;
        export function addVisit() {
          visits = visits + 1;   // only this module may assign to visits
        }
        ```

        Але віконце — лише для читання. Присвоїти імпортованій назві не може ніхто, крім модуля, що її оголосив: спроба кидає `TypeError`. Так у кожної змінної є один власник — і завжди відомо, хто її змінює.
      en: |
        An ordinary variable gets its value at the moment of assignment. An import is different: an imported name is a [[live-binding|live binding]], a “window” onto the variable in the module that owns it. When that module assigns a new value to its variable, everyone who imported it sees the new value at once.

        ```js
        // visits.js
        export let visits = 0;
        export function addVisit() {
          visits = visits + 1;   // only this module may assign to visits
        }
        ```

        But the window is read-only. Nobody but the module that declared the name can assign to an imported name: trying throws a `TypeError`. That way every variable has one owner — and you always know who changes it.

  - id: streak-view
    kind: prediction
    prompt:
      uk: |
        `main.js` імпортує `streak` і функцію, що його збільшує. Що станеться під час запуску?

        ```js
        // streak.js
        export let streak = 0;
        export function markToday() {
          streak = streak + 1;
        }
        ```

        ```js
        // main.js
        import { streak, markToday } from "./streak.js";
        const before = streak;
        markToday();
        markToday();
        console.log(before, streak);
        streak = 10;
        console.log(streak);
        ```
      en: |
        `main.js` imports `streak` and the function that increases it. What happens when it runs?

        ```js
        // streak.js
        export let streak = 0;
        export function markToday() {
          streak = streak + 1;
        }
        ```

        ```js
        // main.js
        import { streak, markToday } from "./streak.js";
        const before = streak;
        markToday();
        markToday();
        console.log(before, streak);
        streak = 10;
        console.log(streak);
        ```
    answer:
      type: choice
      options:
        - id: live-read-only
          text:
            uk: "`0 2`, а потім `TypeError: Assignment to constant variable.`"
            en: "`0 2`, then `TypeError: Assignment to constant variable.`"
        - id: copy
          text:
            uk: "`0 0`, а потім `10`"
            en: "`0 0`, then `10`"
          why:
            uk: "Імпортована назва — не копія, зроблена під час імпорту: вона щоразу читає змінну в `streak.js`, тож після двох викликів `markToday` бачить `2`. І присвоїти їй `main.js` не може."
            en: "An imported name is not a copy made at import time: it reads the variable in `streak.js` every time, so after two calls of `markToday` it sees `2`. And `main.js` cannot assign to it."
        - id: writable
          text:
            uk: "`0 2`, а потім `10`"
            en: "`0 2`, then `10`"
          why:
            uk: "Для того, хто імпортує, назва лише для читання — навіть якщо в `streak.js` її оголошено через `let`. Присвоєння кидає `TypeError`, і другий `console.log` не виконується."
            en: "For the importer the name is read-only — even if `streak.js` declares it with `let`. The assignment throws a `TypeError`, and the second `console.log` never runs."
        - id: before-changes
          text:
            uk: "`2 2`, а потім `TypeError: Assignment to constant variable.`"
            en: "`2 2`, then `TypeError: Assignment to constant variable.`"
          why:
            uk: "`before` — звичайна `const`: вона отримала значення `0` до викликів і більше не змінюється. Живе лише саме імпортоване `streak`."
            en: "`before` is an ordinary `const`: it got the value `0` before the calls and never changes again. Only the imported `streak` itself is live."
      correct: [live-read-only]
    explanation:
      uk: "`before` узяла значення `0` один раз. А `streak` у `main.js` щоразу читає змінну з `streak.js`, де `markToday` двічі присвоїла нове значення, — тому `2`. Присвоєння `streak = 10` у `main.js` кидає `TypeError: Assignment to constant variable.`: змінювати змінну може лише її модуль-власник."
      en: "`before` took the value `0` once. But `streak` in `main.js` reads the variable from `streak.js` every time, where `markToday` assigned a new value twice — hence `2`. The assignment `streak = 10` in `main.js` throws `TypeError: Assignment to constant variable.`: only the owning module can change the variable."

  - id: on-demand
    kind: explanation
    title:
      uk: "import(): завантажити, коли знадобиться"
      en: "import(): load when needed"
    body:
      uk: |
        Статичний `import` на початку файла завантажує модуль одразу, ще до першого рядка коду. А модуль, потрібний рідко, — статистику, довідку, звіт — можна завантажити лише тоді, коли він знадобився. Для цього є [[dynamic-import|динамічний `import()`]]:

        ```js
        document.querySelector("#report").addEventListener("click", () => {
          import("./report.js").then((report) => {
            report.show(expenses);
          });
        });
        ```

        - `import("./report.js")` починає завантаження й одразу повертає [[promise|promise]] — об’єкт, що видасть результат пізніше. Докладно promises — у JS-08.
        - `.then(функція)` каже, що зробити з модулем, коли він прийде: функція отримує об’єкт модуля з усіма його експортами.
        - `.catch(функція)` каже, що зробити, якщо завантажити не вдалося.

        > [!note]
        > Шлях, записаний прямо в лапках `import("…")`, платформа перевіряє ще до запуску: хибний шлях зупиняє весь запуск із карткою «Код не вдалося запустити». Браузер поза платформою запустив би сторінку й повідомив про помилку лише тоді, коли виконується `import()`. Шлях зі змінної і платформа, і браузер перевіряють уже під час виконання.
      en: |
        A static `import` at the top of a file loads the module right away, before the first line of code. But a module that is rarely needed — statistics, help, a report — can be loaded only when it is needed. That is what [[dynamic-import|dynamic `import()`]] is for:

        ```js
        document.querySelector("#report").addEventListener("click", () => {
          import("./report.js").then((report) => {
            report.show(expenses);
          });
        });
        ```

        - `import("./report.js")` starts loading and immediately returns a [[promise]] — an object that will hand over a result later. Promises are covered in detail in JS-08.
        - `.then(function)` says what to do with the module when it arrives: the function receives the module object with all its exports.
        - `.catch(function)` says what to do if loading failed.

        > [!note]
        > A path written directly in the quotes of `import("…")` is checked by the platform before running: a wrong path stops the whole run with the card “The code could not start”. A browser outside the platform would start the page and report the error only when `import()` runs. A path from a variable is checked by both the platform and the browser while the program runs.

  - id: next-line
    kind: prediction
    prompt:
      uk: |
        Що надрукує `main.js`?

        ```js
        // help.js
        export const helpText = "Натисни звичку, щоб позначити її";
        ```

        ```js
        // main.js
        let shown = "?";
        import("./help.js").then((help) => {
          shown = help.helpText;
          console.log("then: " + shown);
        });
        console.log("next line: " + shown);
        ```
      en: |
        What does `main.js` print?

        ```js
        // help.js
        export const helpText = "Tap a habit to mark it";
        ```

        ```js
        // main.js
        let shown = "?";
        import("./help.js").then((help) => {
          shown = help.helpText;
          console.log("then: " + shown);
        });
        console.log("next line: " + shown);
        ```
    answer:
      type: choice
      options:
        - id: next-line-first
          text:
            uk: "Спершу «next line: ?», а потім «then: …» з текстом довідки"
            en: "First “next line: ?”, then “then: …” with the help text"
        - id: waits
          text:
            uk: "Спершу «then: …» з текстом довідки, а потім «next line: …» з тим самим текстом"
            en: "First “then: …” with the help text, then “next line: …” with the same text"
          why:
            uk: "`import()` не зупиняє код: він лише починає завантаження. Наступний рядок коду виконується одразу, а функція з `.then` — пізніше, коли модуль прийде."
            en: "`import()` does not stop the code: it only starts loading. The next line of code runs at once, and the function in `.then` runs later, when the module arrives."
        - id: only-next
          text:
            uk: "Лише «next line: ?»: функція з `.then` не виконається, бо програма вже дійшла до кінця"
            en: "Only “next line: ?”: the function in `.then` never runs because the program has already reached its end"
          why:
            uk: "Кінець файла не скасовує завантаження: коли модуль прийде, браузер викличе функцію з `.then`, як згодом викликає обробник кліку."
            en: "The end of the file does not cancel loading: when the module arrives, the browser calls the function in `.then`, just as it later calls a click listener."
        - id: syntax
          text:
            uk: "Код не запуститься: `import` можна писати лише на початку файла"
            en: "The code does not start: `import` can only be written at the start of a file"
          why:
            uk: "Це правило для статичного `import … from`. `import()` — вираз, його можна писати будь-де, навіть усередині функції чи обробника."
            en: "That rule is for the static `import … from`. `import()` is an expression, it can be written anywhere, even inside a function or a listener."
      correct: [next-line-first]
    explanation:
      uk: "`import(\"./help.js\")` лише починає завантаження, тож наступний рядок коду друкує ще старе `?`. Модуль приходить пізніше — тоді й виконується функція з `.then`. Тому все, що потребує модуля, пишуть **усередині** `.then`, а не на наступному рядку коду."
      en: "`import(\"./help.js\")` only starts loading, so the next line of code still prints the old `?`. The module arrives later — that is when the function in `.then` runs. So everything that needs the module is written **inside** `.then`, not on the next line of code."

  - id: binding-and-loading
    kind: visual
    visual: diagram
    title:
      uk: "Одна змінна, два модулі — і модуль на вимогу"
      en: "One variable, two modules — and a module on demand"
    textEquivalent:
      uk: "main.js імпортує streak зі streak.js. Імпортована назва не містить копії: це віконце на змінну let streak у streak.js, де зараз 0. main.js викликає markToday, а та, будучи частиною streak.js, присвоює власній змінній 1. Коли main.js знову читає streak, він бачить 1 — ту саму змінну, ніхто нічого не копіював. Якщо main.js спробує присвоїти streak = 10, буде TypeError: змінювати змінну може лише її модуль-власник. stats.js на старті не входить у граф модулів, бо жоден статичний import на нього не вказує. Пунктирна стрілка — import(): після кліку на кнопку браузер завантажує й виконує stats.js, і лише тоді функція з .then отримує модуль; наступний рядок коду після import() до того часу вже виконався."
      en: "main.js imports streak from streak.js. The imported name holds no copy: it is a window onto the variable let streak in streak.js, which is 0 now. main.js calls markToday, which, being part of streak.js, assigns 1 to its own variable. When main.js reads streak again, it sees 1 — the same variable, nobody copied anything. If main.js tries streak = 10, there is a TypeError: only the owning module can change the variable. At the start stats.js is not part of the module graph, because no static import points to it. The dashed arrow is import(): after a click on the button the browser loads and runs stats.js, and only then does the function in .then receive the module; by that time the next line of code after import() has already run."
    spec:
      layout: grid
      nodes:
        - { id: importer, label: "main.js", col: 0, row: 0 }
        - { id: slot, label: "let streak", col: 1, row: 0 }
        - { id: mark, label: "markToday()", col: 1, row: 1 }
        - { id: button, label: { uk: "кнопка", en: "button" }, shape: pill, col: 0, row: 2 }
        - { id: stats, label: "stats.js", col: 1, row: 2 }
      edges:
        - { id: reads, from: importer, to: slot, label: { uk: "читає", en: "reads" } }
        - { id: calls, from: importer, to: mark, label: { uk: "викликає", en: "calls" } }
        - { id: writes, from: mark, to: slot, label: { uk: "записує", en: "writes" } }
        - { id: lazy, from: button, to: stats, label: "import()", kind: dashed }
      hidden: [button, stats, lazy]
      steps:
        - highlight: [importer, reads, slot]
          dim: [mark, calls, writes]
          annotate:
            - { id: slot, text: "0" }
          caption:
            uk: "`main.js` імпортує `streak`. Його назва не тримає копії: це віконце на змінну `let streak` у `streak.js`, де зараз `0`."
            en: "`main.js` imports `streak`. Its name keeps no copy: it is a window onto the variable `let streak` in `streak.js`, which is `0` now."
        - highlight: [calls, mark, writes, slot]
          annotate:
            - { id: slot, text: "1" }
          caption:
            uk: "`main.js` викликає `markToday()`. Ця функція — частина `streak.js`, тож вона присвоює **власній** змінній: тепер `1`."
            en: "`main.js` calls `markToday()`. This function is part of `streak.js`, so it assigns to its **own** variable: now `1`."
        - highlight: [importer, reads]
          annotate:
            - { id: slot, text: "1" }
            - { id: importer, text: { uk: "бачить 1", en: "sees 1" } }
          caption:
            uk: "`main.js` знову читає `streak` — і бачить `1`: та сама змінна, ніхто нічого не копіював."
            en: "`main.js` reads `streak` again — and sees `1`: the same variable, nobody copied anything."
        - highlight: [importer]
          annotate:
            - { id: importer, text: "streak = 10 → TypeError" }
          caption:
            uk: "А записати в цю змінну `main.js` не може: присвоєння імпортованій назві кидає `TypeError`. Змінює змінну лише модуль, що її оголосив."
            en: "But `main.js` cannot write into that variable: assigning to an imported name throws a `TypeError`. Only the module that declared the variable changes it."
        - show: [button, stats, lazy]
          highlight: [button, lazy, stats]
          dim: [importer, slot, mark, reads, calls, writes]
          caption:
            uk: "`stats.js` на старті не входить у граф: жоден статичний `import` на нього не вказує. Пунктир — `import()`: зв’язок, який з’явиться лише тоді, коли код його попросить."
            en: "At the start `stats.js` is not in the graph: no static `import` points to it. The dashed line is `import()`: a link that appears only when the code asks for it."
        - highlight: [lazy, stats]
          dim: [importer, slot, mark, reads, calls, writes]
          annotate:
            - { id: stats, text: { uk: "завантажено", en: "loaded" } }
          caption:
            uk: "Клік: `import(\"./stats.js\")` починає завантаження. Браузер завантажує й виконує `stats.js`, і лише тоді функція з `.then` отримує модуль — наступний рядок коду після `import()` уже давно виконався."
            en: "A click: `import(\"./stats.js\")` starts loading. The browser loads and runs `stats.js`, and only then does the function in `.then` receive the module — the next line of code after `import()` ran long ago."

  - id: live-and-lazy
    kind: example
    runtime: browser-js
    dir: live-and-lazy
    entry: index.html
    strings:
      lang: { uk: "uk", en: "en" }
      pageTitle: { uk: "Пити воду", en: "Drink water" }
      markButton: { uk: "Позначити сьогодні", en: "Mark today" }
      statsButton: { uk: "Статистика", en: "Statistics" }
      streakNow: { uk: "Серія: ", en: "Streak: " }
      noStreak: { uk: "Серії ще немає.", en: "No streak yet." }
      streakOf: { uk: "Днів поспіль: ", en: "Days in a row: " }
    title:
      uk: "Жива серія й статистика на вимогу"
      en: "A live streak and statistics on demand"
    body:
      uk: |
        `streak.js` зберігає серію, `stats.js` вміє її описати, а `main.js` реагує на дві кнопки. Натисни **Запустити**, подивись на **Консоль**, а тоді клацай кнопки на вкладці **Сторінка**.
      en: |
        `streak.js` keeps the streak, `stats.js` can describe it, and `main.js` reacts to two buttons. Press **Run**, look at the **Console**, then click the buttons on the **Page** tab.
    tryIt:
      uk: |
        1. Консоль: `▶ stats.js`, а потім `▶ main.js` — статистику завантажено на старті, хоч її ще ніхто не просив. Двічі натисни «Позначити сьогодні»: `main.js` показує `2`, хоча змінювала серію лише `streak.js`.
        2. Додай в обробник кнопки «Позначити сьогодні» першим рядком коду `streak = 0;`, запусти й натисни: `TypeError: Assignment to constant variable.` Прибери цей рядок коду.
        3. Видали рядок коду зі статичним імпортом `stats.js`, а в обробнику кнопки «Статистика» заміни присвоєння на `import("./stats.js").then((stats) => { output.textContent = stats.describeStreak(streak); });`. Запусти: на старті `▶ stats.js` немає. Він з’явиться після першого кліку на «Статистика» — і лише один раз, хоч скільки клікай.
      en: |
        1. The console: `▶ stats.js`, then `▶ main.js` — the statistics were loaded at the start, although nobody asked for them yet. Press “Mark today” twice: `main.js` shows `2`, although only `streak.js` changed the streak.
        2. Add `streak = 0;` as the first line of code in the “Mark today” listener, run and press it: `TypeError: Assignment to constant variable.` Remove that line.
        3. Delete the line with the static import of `stats.js`, and in the “Statistics” listener replace the assignment with `import("./stats.js").then((stats) => { output.textContent = stats.describeStreak(streak); });`. Run: there is no `▶ stats.js` at the start. It appears after the first click on “Statistics” — and only once, however many times you click.

  - id: recall
    kind: review
    title:
      uk: "Згадай: звичайна змінна бере значення"
      en: "Recall: an ordinary variable takes a value"
    items:
      - id: plain-binding
        from: js-02-01-const-let
        prompt:
          uk: "Тут немає модулів, лише звичайні змінні. Що надрукує програма?"
          en: "There are no modules here, just ordinary variables. What does the program print?"
        code: |
          let streak = 1;
          const shown = streak;
          streak = streak + 1;
          console.log(shown, streak);
        verify:
          logs: ["1 2"]
        answer:
          type: choice
          options:
            - id: one-two
              code: "1 2"
            - id: two-two
              code: "2 2"
              why:
                uk: "`shown` отримала значення `1` в мить присвоєння. Нове присвоєння `streak` на неї вже не впливає: це окрема назва зі своїм значенням."
                en: "`shown` got the value `1` at the moment of assignment. A new assignment to `streak` no longer affects it: it is a separate name with its own value."
            - id: one-one
              code: "1 1"
              why:
                uk: "`streak` оголошено через `let`, тож присвоєння `streak = streak + 1` змінює її значення на `2`."
                en: "`streak` is declared with `let`, so the assignment `streak = streak + 1` changes its value to `2`."
          correct: [one-two]
        explanation:
          uk: "[[binding|Прив’язка]] — назва, що вказує на значення. `const shown = streak` дала назві `shown` значення `1`, і далі вона з `streak` не пов’язана. Імпорт працює інакше: імпортована назва не отримує значення, а щоразу читає змінну модуля-власника."
          en: "A [[binding]] is a name that points at a value. `const shown = streak` gave the name `shown` the value `1`, and after that it is not connected to `streak`. An import works differently: an imported name does not receive a value, it reads the owning module’s variable every time."

  - id: help-on-demand
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: help-on-demand
    entry: index.html
    editable: [main.js]
    strings:
      lang: { uk: "uk", en: "en" }
      pageTitle: { uk: "Трекер витрат", en: "Expense tracker" }
      helpButton: { uk: "Довідка", en: "Help" }
      helpText: { uk: "Додай витрату, обери категорію — підсумок оновиться сам.", en: "Add an expense, pick a category — the total updates by itself." }
      fallback: { uk: "Довідка зараз недоступна.", en: "Help is not available right now." }
    title:
      uk: "Довідка на вимогу"
      en: "Help on demand"
    instructions:
      uk: |
        Довідкою користуються рідко, тож `help.js` не варто завантажувати на старті. Напиши `showHelp(path)` у `main.js`:

        - Модуль за шляхом `path` завантажується лише під час виклику `showHelp`, через `import()`.
        - Коли модуль прийде, абзац `#help` показує його `helpText`.
        - Якщо завантажити не вдалося — наприклад, шлях хибний, — абзац показує `FALLBACK`.

        Обробник кнопки «Довідка» вже викликає `showHelp(HELP_PATH)`. `help.js` під час виконання друкує `▶ help.js` — так видно, коли його завантажено.
      en: |
        Help is rarely used, so `help.js` should not be loaded at the start. Write `showHelp(path)` in `main.js`:

        - The module at `path` is loaded only when `showHelp` is called, with `import()`.
        - When the module arrives, the paragraph `#help` shows its `helpText`.
        - If loading fails — for example, the path is wrong — the paragraph shows `FALLBACK`.

        The “Help” button’s listener already calls `showHelp(HELP_PATH)`. When `help.js` runs it prints `▶ help.js` — that shows when it was loaded.
    testTitles:
      "the page opens without an error":
        uk: "Сторінка відкривається без помилок"
        en: "The page opens without an error"
      "help.js is not loaded before the first click":
        uk: "help.js не завантажується до першого кліку"
        en: "help.js is not loaded before the first click"
      "clicking Help shows the help text":
        uk: "Клік на «Довідка» показує текст довідки"
        en: "Clicking Help shows the help text"
      "help.js is loaded once, even after another click":
        uk: "help.js завантажується один раз, навіть після ще одного кліку"
        en: "help.js is loaded once, even after another click"
      "a wrong path shows the fallback message":
        uk: "Хибний шлях показує запасне повідомлення"
        en: "A wrong path shows the fallback message"
    hints:
      nudge:
        uk: "Що повертає `import()` одразу — сам модуль чи щось, що видасть модуль пізніше? Де тоді має стояти код, якому потрібен `helpText`?"
        en: "What does `import()` return right away — the module itself, or something that hands over the module later? Where, then, must the code that needs `helpText` stand?"
      explanation:
        uk: "`import(path)` приймає шлях зі змінної так само, як текст у лапках. Результат потрібно чекати: запис у `helpArea` роби у функції, яку передаєш у `.then` — вона отримає об’єкт модуля. А запасне повідомлення став у функції для `.catch`, яку ланцюжком дописують після `.then`."
        en: "`import(path)` takes a path from a variable just like text in quotes. The result has to be waited for: write into `helpArea` inside the function you pass to `.then` — it receives the module object. And put the fallback message into a function for `.catch`, chained after `.then`."
    solutionNote:
      uk: "`import(path)` завантажує модуль лише в мить виклику, а браузер виконує його один раз — повторний клік отримує вже готовий модуль. Усе, що потребує `helpText`, стоїть у `.then`, а `.catch` перетворює невдале завантаження на зрозуміле повідомлення замість необробленої помилки."
      en: "`import(path)` loads the module only at the moment of the call, and the browser runs it once — a second click gets the module that is already there. Everything that needs `helpText` stands in `.then`, and `.catch` turns a failed load into a clear message instead of an unhandled error."
    feedback:
      - when: { test: "the page opens without an error" }
        message:
          uk: "Ця перевірка чекає, що сторінка відкриється без помилок. До першого кліку `main.js` лише знаходить елементи сторінки й реєструє обробник кнопки — модуль довідки на старті не потрібен. Прочитай тип і повідомлення на картці помилки."
          en: "This check expects the page to open without errors. Before the first click, `main.js` only finds the page elements and registers the button’s listener — the help module is not needed at the start. Read the type and the message on the error card."
      - when: { test: "help.js is not loaded before the first click" }
        message:
          uk: "Ця перевірка чекає, що до першого кліку в консолі немає `▶ help.js`, тобто модуль ще не завантажено. Статичний `import … from \"./help.js\"` на початку файла завантажує його одразу — тут потрібен `import()` усередині `showHelp`."
          en: "This check expects no `▶ help.js` in the console before the first click, that is, the module is not loaded yet. A static `import … from \"./help.js\"` at the start of the file loads it at once — what is needed here is `import()` inside `showHelp`."
      - when: { test: "clicking Help shows the help text" }
        message:
          uk: "Ця перевірка натискає «Довідка» й чекає в `#help` текст довідки з `help.js`. Модуль приходить не на наступному рядку коду, а пізніше — у функцію, передану в `.then`."
          en: "This check presses “Help” and expects the help text from `help.js` in `#help`. The module arrives not on the next line of code but later — in the function passed to `.then`."
      - when: { test: "help.js is loaded once, even after another click" }
        message:
          uk: "Ця перевірка натискає «Довідка» вдруге й чекає, що `▶ help.js` у консолі так і один."
          en: "This check presses “Help” a second time and expects `▶ help.js` to still appear only once in the console."
      - when: { test: "a wrong path shows the fallback message" }
        message:
          uk: "Ця перевірка викликає `showHelp` із шляхом до файла, якого немає, і чекає в `#help` текст `FALLBACK`. Завантажуй саме той шлях, що прийшов у параметрі, і обробляй невдачу в `.catch`."
          en: "This check calls `showHelp` with a path to a file that does not exist and expects the `FALLBACK` text in `#help`. Load exactly the path that came in the parameter, and handle the failure in `.catch`."

  - id: to-project
    kind: transfer
    capstoneStep: JS-07
    body:
      uk: "У кроці проєкту модулі `domain/` експортуватимуть функції, а дані зберігатимуться в одному місці — у модулі, що ними володіє. Якщо в твоєму проєкті є рідко потрібна частина — підсумки за місяць, довідка, — її можна завантажувати через `import()` лише тоді, коли користувач її відкриє."
      en: "In the project step, `domain/` modules export functions, and data lives in one place — in the module that owns it. If your project has a rarely needed part — monthly summaries, help — it can be loaded with `import()` only when the user opens it."
