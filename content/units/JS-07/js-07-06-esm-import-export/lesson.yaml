id: js-07-06-esm-import-export
unit: JS-07
title:
  uk: "ES-модулі: import і export"
  en: "ES modules: import and export"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Розділити один скрипт на модулі domain і ui з іменованими експортами й імпортувати їх відносними шляхами."
    en: "Split one script into domain and ui modules with named exports and import them with relative specifiers."
  - uk: "Намалювати граф модулів невеликого проєкту й передбачити, у якому порядку модулі виконуються."
    en: "Draw the module graph of a small project and predict the order in which its modules evaluate."
prerequisites: [js-07-05-persist-reload, js-03-07-pure-vs-side-effects]
subskills:
  - { family: J-10, skill: "ESM imports/exports/live bindings", depth: intro }
glossary: [es-module, named-export, default-export, module-specifier, module-graph]
selfCheck: [eval-order, private-scope, split-records]

blocks:
  - id: modules
    kind: explanation
    title:
      uk: "Модуль — файл зі своїми межами"
      en: "A module is a file with its own borders"
    body:
      uk: |
        Коли проєкт росте, в одному файлі змішуються правила даних і робота зі сторінкою. Їх розносять по [[es-module|модулях]] — окремих файлах, і кожен має **власну** область видимості. Назва з одного модуля не видна в іншому, доки перший її не експортує, а другий не імпортує:

        ```js
        // domain/habits.js
        const DAILY = "daily";              // not exported: invisible outside
        export function isDaily(habit) {    // a named export
          return habit.frequency === DAILY;
        }

        // ui/list.js
        import { isDaily } from "../domain/habits.js";
        ```

        - [[named-export|Іменований експорт]] — `export` перед функцією чи `const`. Імпортують його у фігурних дужках за тією самою назвою.
        - Текст у лапках після `from` — [[module-specifier|специфікатор модуля]]. У браузері відносний шлях починається з `./` (та сама тека) чи `../` (тека вище) — від файла, **де написано** `import`, — і закінчується розширенням `.js`.

        Рядок коду `import { later } from "./later.js"`, який ти бачив у JS-03, — саме такий імпорт. А сторінка підключає головний модуль через `<script type="module" src="./main.js">`.
      en: |
        As a project grows, data rules and page work get mixed in one file. They are spread over [[es-module|modules]] — separate files, each with its **own** scope. A name from one module is not visible in another until the first one exports it and the second one imports it:

        ```js
        // domain/habits.js
        const DAILY = "daily";              // not exported: invisible outside
        export function isDaily(habit) {    // a named export
          return habit.frequency === DAILY;
        }

        // ui/list.js
        import { isDaily } from "../domain/habits.js";
        ```

        - A [[named-export|named export]] is `export` in front of a function or a `const`. It is imported in curly braces under the same name.
        - The text in quotes after `from` is the [[module-specifier|module specifier]]. In the browser a relative path starts with `./` (the same folder) or `../` (the folder above) — counted from the file **where** `import` is written — and ends with the `.js` extension.

        The line `import { later } from "./later.js"` that you saw in JS-03 is exactly such an import. And a page loads its main module with `<script type="module" src="./main.js">`.

  - id: eval-order
    kind: prediction
    prompt:
      uk: |
        Проєкт із трьох файлів, і кожен на верхньому рівні друкує свою назву. `main.js` — головний модуль сторінки. Що з’явиться в консолі першими трьома рядками?

        ```js
        // domain.js
        console.log("▶ domain.js");
        export function total(expenses) { /* … */ }
        ```

        ```js
        // ui.js
        import { total } from "./domain.js";
        console.log("▶ ui.js");
        export function totalText(expenses) { /* … */ }
        ```

        ```js
        // main.js
        import { totalText } from "./ui.js";
        import { total } from "./domain.js";
        console.log("▶ main.js");
        ```
      en: |
        A project of three files, and each prints its name at the top level. `main.js` is the page’s main module. What appears in the console as the first three lines?

        ```js
        // domain.js
        console.log("▶ domain.js");
        export function total(expenses) { /* … */ }
        ```

        ```js
        // ui.js
        import { total } from "./domain.js";
        console.log("▶ ui.js");
        export function totalText(expenses) { /* … */ }
        ```

        ```js
        // main.js
        import { totalText } from "./ui.js";
        import { total } from "./domain.js";
        console.log("▶ main.js");
        ```
    answer:
      type: choice
      options:
        - id: dependencies-first
          code: "▶ domain.js\n▶ ui.js\n▶ main.js"
        - id: top-down
          code: "▶ main.js\n▶ ui.js\n▶ domain.js"
          why:
            uk: "Код модуля виконується лише тоді, коли все, що він імпортує, уже готове. Тож `main.js` — останній, а не перший."
            en: "A module’s code runs only when everything it imports is ready. So `main.js` comes last, not first."
        - id: import-order
          code: "▶ ui.js\n▶ domain.js\n▶ main.js"
          why:
            uk: "`ui.js` сам імпортує `domain.js`, тож `domain.js` мусить виконатися раніше за `ui.js`."
            en: "`ui.js` itself imports `domain.js`, so `domain.js` has to run before `ui.js`."
        - id: twice
          code: "▶ domain.js\n▶ ui.js\n▶ domain.js\n▶ main.js"
          why:
            uk: "Модуль виконується **один раз**, хоч скільки файлів його імпортує. Другий імпорт отримує той самий, уже готовий модуль."
            en: "A module runs **once**, however many files import it. The second import gets the same module, already done."
      correct: [dependencies-first]
    explanation:
      uk: "Браузер іде від `main.js` імпортами вглиб: `main.js` → `ui.js` → `domain.js`. `domain.js` нічого не імпортує, тож виконується першим, за ним — `ui.js`, чия залежність уже готова. Другий імпорт `domain.js` з `main.js` нічого не запускає: модуль уже виконано. Останнім виконується сам `main.js`. Нижче — той самий граф крок за кроком, а далі — цей проєкт, щоб запустити."
      en: "The browser goes from `main.js` deeper along the imports: `main.js` → `ui.js` → `domain.js`. `domain.js` imports nothing, so it runs first, then `ui.js`, whose dependency is ready. The second import of `domain.js` from `main.js` starts nothing: the module has already run. `main.js` itself runs last. Below is the same graph step by step, and then this project to run."

  - id: module-graph
    kind: visual
    visual: diagram
    title:
      uk: "Граф модулів: хто кого імпортує"
      en: "The module graph: who imports whom"
    textEquivalent:
      uk: "Чотири вузли: сторінка index.html, головний модуль main.js, ui/render.js і domain/records.js. Стрілки — імпорти: index.html підключає main.js через script type=module, main.js імпортує ui/render.js і domain/records.js, а ui/render.js теж імпортує domain/records.js. Перш ніж виконати хоч рядок коду main.js, браузер читає всі його імпорти й іде ними вглиб. domain/records.js нічого не імпортує, тож виконується першим. Потім виконується ui/render.js: його залежність уже готова. Імпорт domain/records.js з main.js вже нічого не запускає: модуль виконано, і main.js отримує той самий модуль. Останнім виконується main.js, коли всі його імпорти готові. Кожен модуль виконано рівно один раз, залежності — раніше за тих, хто їх імпортує."
      en: "Four nodes: the page index.html, the main module main.js, ui/render.js and domain/records.js. The arrows are imports: index.html loads main.js through script type=module, main.js imports ui/render.js and domain/records.js, and ui/render.js also imports domain/records.js. Before running a single line of main.js, the browser reads all of its imports and follows them deeper. domain/records.js imports nothing, so it runs first. Then ui/render.js runs: its dependency is ready. The import of domain/records.js from main.js starts nothing any more: the module has run, and main.js gets the same module. main.js runs last, when all its imports are ready. Every module ran exactly once, and dependencies ran before the modules that import them."
    spec:
      layout: grid
      nodes:
        - { id: page, label: "index.html", shape: note, col: 0, row: 0 }
        - { id: main, label: "main.js", col: 0, row: 1 }
        - { id: ui, label: "ui/render.js", col: 1, row: 2 }
        - { id: domain, label: "domain/records.js", col: 0, row: 3 }
      edges:
        - { id: load, from: page, to: main, label: "type=module" }
        - { id: main-ui, from: main, to: ui, label: "import" }
        - { id: ui-domain, from: ui, to: domain, label: "import" }
        - { id: main-domain, from: main, to: domain, label: "import" }
      steps:
        - caption:
            uk: "Граф модулів проєкту. Стрілка веде від файла до того, що він імпортує: «мені потрібен цей модуль»."
            en: "The project’s module graph. An arrow goes from a file to what it imports: “I need this module”."
        - highlight: [page, load, main]
          dim: [ui, domain, main-ui, ui-domain, main-domain]
          caption:
            uk: "Сторінка підключає `main.js` як модуль. Але перш ніж виконати хоч рядок коду `main.js`, браузер читає **всі** його імпорти."
            en: "The page loads `main.js` as a module. But before running a single line of `main.js`, the browser reads **all** of its imports."
        - highlight: [main-ui, ui, ui-domain, domain]
          dim: [page, load, main-domain]
          annotate:
            - { id: domain, text: { uk: "виконується 1-м", en: "runs 1st" } }
          caption:
            uk: "Браузер іде імпортами вглиб: `main.js` → `ui/render.js` → `domain/records.js`. Останній нічого не імпортує, тож виконується **першим**."
            en: "The browser follows the imports deeper: `main.js` → `ui/render.js` → `domain/records.js`. The last one imports nothing, so it runs **first**."
        - highlight: [ui]
          dim: [page, load, main-domain]
          annotate:
            - { id: domain, text: { uk: "готовий", en: "ready" } }
            - { id: ui, text: { uk: "виконується 2-м", en: "runs 2nd" } }
          caption:
            uk: "Тепер виконується `ui/render.js`: його єдина залежність уже готова."
            en: "Now `ui/render.js` runs: its only dependency is ready."
        - highlight: [main-domain, domain]
          dim: [page, load, ui-domain]
          annotate:
            - { id: main-domain, text: { uk: "уже виконано", en: "already done" } }
          caption:
            uk: "`main.js` теж імпортує `domain/records.js`. Цей модуль уже виконано, тож удруге його код не запускається: `main.js` отримує той самий модуль."
            en: "`main.js` imports `domain/records.js` too. That module has already run, so its code does not start a second time: `main.js` gets the same module."
        - highlight: [main]
          dim: [page, load]
          annotate:
            - { id: main, text: { uk: "виконується 3-м", en: "runs 3rd" } }
          caption:
            uk: "Останнім виконується `main.js`: усе, що він імпортує, готове. Кожен модуль виконано рівно один раз — залежності раніше за тих, хто їх імпортує."
            en: "`main.js` runs last: everything it imports is ready. Every module ran exactly once — dependencies before the modules that import them."

  - id: three-modules
    kind: example
    runtime: browser-js
    dir: three-modules
    entry: main.js
    strings:
      totalLabel: { uk: "Разом: ", en: "Total: " }
      uah: { uk: "грн", en: "UAH" }
    title:
      uk: "Три модулі й четвертий, якого ніхто не імпортує"
      en: "Three modules and a fourth that nobody imports"
    body:
      uk: |
        Тут файли з прогнозу, а ще `stats.js`, який поки ніхто не імпортує. Натисни **Запустити** й подивись на **Консоль**; файли перемикай вкладками над редактором.
      en: |
        Here are the files from the prediction, plus `stats.js`, which nobody imports yet. Press **Run** and look at the **Console**; switch between files with the tabs above the editor.
    tryIt:
      uk: |
        1. Порядок: `domain.js`, `ui.js`, `main.js` — і жодного рядка в консолі від `stats.js`: модуль, якого ніхто не імпортує, не виконується зовсім.
        2. У `main.js` додай третім імпортом `import { average } from "./stats.js";`, а в кінець — `console.log(average(expenses));`. Запусти: `stats.js` теж імпортує `domain.js`, але `▶ domain.js` у консолі все одно один раз.
        3. У `domain.js` прибери слово `export` перед `function total` і запусти. Консоль порожня, а на картці помилки — `SyntaxError` про модуль, що «does not provide an export named 'total'». Жоден модуль не виконався: граф не зібрався. Поверни `export`.
      en: |
        1. The order: `domain.js`, `ui.js`, `main.js` — and not a single line from `stats.js`: a module that nobody imports does not run at all.
        2. In `main.js`, add `import { average } from "./stats.js";` as the third import, and `console.log(average(expenses));` at the end. Run: `stats.js` imports `domain.js` too, yet `▶ domain.js` appears in the console only once.
        3. In `domain.js`, remove the word `export` in front of `function total` and run. The console is empty, and the error card shows a `SyntaxError` about a module that “does not provide an export named 'total'”. Not a single module ran: the graph could not be put together. Put `export` back.

  - id: private-scope
    kind: prediction
    prompt:
      uk: |
        `main.js` імпортує лише `isFull`. Що станеться під час запуску?

        ```js
        // limits.js
        const LIMIT = 3;
        export function isFull(tasks) {
          return tasks.length >= LIMIT;
        }
        ```

        ```js
        // main.js
        import { isFull } from "./limits.js";
        console.log(isFull(["t-01", "t-02", "t-03"]));
        console.log(LIMIT);
        ```
      en: |
        `main.js` imports only `isFull`. What happens when it runs?

        ```js
        // limits.js
        const LIMIT = 3;
        export function isFull(tasks) {
          return tasks.length >= LIMIT;
        }
        ```

        ```js
        // main.js
        import { isFull } from "./limits.js";
        console.log(isFull(["t-01", "t-02", "t-03"]));
        console.log(LIMIT);
        ```
    answer:
      type: choice
      options:
        - id: reference-error
          text:
            uk: "`true`, а потім `ReferenceError: LIMIT is not defined`"
            en: "`true`, then `ReferenceError: LIMIT is not defined`"
        - id: shared
          text:
            uk: "`true`, а потім `3`"
            en: "`true`, then `3`"
          why:
            uk: "Модулі не ділять змінних, наче один великий скрипт. `LIMIT` живе лише в `limits.js`: його не експортовано й не імпортовано, тож у `main.js` такої назви немає."
            en: "Modules do not share variables as if they were one big script. `LIMIT` lives only in `limits.js`: it is not exported or imported, so `main.js` has no such name."
        - id: isfull-breaks
          text:
            uk: "`ReferenceError` уже в `isFull`: вона не бачить `LIMIT`, бо його не експортовано"
            en: "A `ReferenceError` already in `isFull`: it cannot see `LIMIT` because it is not exported"
          why:
            uk: "`isFull` написано в тому самому модулі, що й `LIMIT`, тож вона його бачить. `export` потрібен лише для того, щоб назву бачили **інші** файли."
            en: "`isFull` is written in the same module as `LIMIT`, so it sees it. `export` is only needed for **other** files to see a name."
        - id: load-error
          text:
            uk: "Нічого не виконається: граф модулів не збереться"
            en: "Nothing runs: the module graph cannot be put together"
          why:
            uk: "Граф збирається з `import`, а `main.js` імпортує лише `isFull`, яку справді експортовано. `LIMIT` для нього — просто невідома назва, і помилка з’являється лише тоді, коли виконується рядок коду з нею."
            en: "The graph is put together from `import`s, and `main.js` imports only `isFull`, which really is exported. To `main.js`, `LIMIT` is just an unknown name, and the error appears only when the line of code with it runs."
      correct: [reference-error]
    explanation:
      uk: "`isFull` бачить `LIMIT`, бо вони в одному модулі, тож перший рядок коду друкує `true`. А в `main.js` назви `LIMIT` немає: модуль бачить лише свої назви й те, що імпортував. Тому другий рядок коду кидає `ReferenceError`. Щоб `LIMIT` був потрібен іншим файлам, його треба експортувати й імпортувати — як і функцію."
      en: "`isFull` sees `LIMIT` because they are in one module, so the first line of code prints `true`. But `main.js` has no name `LIMIT`: a module sees only its own names and what it imported. So the second line throws a `ReferenceError`. If other files need `LIMIT`, it has to be exported and imported — just like a function."

  - id: default-export
    kind: explanation
    title:
      uk: "Default-експорт і чому ми обираємо іменовані"
      en: "The default export and why we choose named ones"
    body:
      uk: |
        Окрім іменованих, модуль може мати один [[default-export|default-експорт]]:

        ```js
        // domain/report.js
        export default function buildReport(expenses) { /* … */ }

        // ui/page.js
        import buildReport from "../domain/report.js";  // no braces, any name works
        import makeReport from "../domain/report.js";   // the same function under another name
        ```

        Імпортують його без фігурних дужок і **під будь-якою назвою**. Через це в різних файлах та сама функція може називатися по-різному, а пошук за назвою в редакторі її не знайде. Тому в курсі ми експортуємо за назвою: назва однакова всюди, а помилку в ній браузер помітить ще до запуску. Default-експорти ти зустрінеш у чужому коді — їх варто вміти читати.
      en: |
        Besides named ones, a module can have one [[default-export|default export]]:

        ```js
        // domain/report.js
        export default function buildReport(expenses) { /* … */ }

        // ui/page.js
        import buildReport from "../domain/report.js";  // no braces, any name works
        import makeReport from "../domain/report.js";   // the same function under another name
        ```

        It is imported without curly braces and **under any name**. Because of that, the same function can have different names in different files, and searching by name in the editor will not find it. That is why the course exports by name: the name is the same everywhere, and the browser notices a typo in it before running. You will meet default exports in other people’s code — it is worth being able to read them.

  - id: recall
    kind: review
    title:
      uk: "Згадай: чисті функції"
      en: "Recall: pure functions"
    items:
      - id: which-pure
        from: js-03-07-pure-vs-side-effects
        prompt:
          uk: "Модуль `domain/` має містити лише чисті функції: ті, що лише обчислюють результат із аргументів і нічого не змінюють навколо. Які з цих функцій можна туди перенести? Обери всі."
          en: "A `domain/` module must contain only pure functions: they only compute a result from their arguments and change nothing around them. Which of these functions can move there? Choose all that can."
        answer:
          type: multi
          options:
            - id: count-done
              code: "function countDone(tasks) {\n  return tasks.filter((task) => task.done).length;\n}"
            - id: is-overdue
              code: "function isOverdue(task, today) {\n  return task.dueDate !== null && task.dueDate < today;\n}"
            - id: show-count
              code: "function showCount(count) {\n  document.querySelector(\"#count\").textContent = count;\n}"
              why:
                uk: "Змінює сторінку — це побічний ефект. Їй місце в модулі інтерфейсу."
                en: "It changes the page — that is a side effect. It belongs in an interface module."
            - id: save-tasks
              code: "function saveTasks(tasks) {\n  localStorage.setItem(\"jsll.planner.v1\", JSON.stringify(tasks));\n}"
              why:
                uk: "Пише в сховище — теж побічний ефект: після виклику щось у світі змінилося."
                en: "It writes to storage — a side effect too: after the call something in the world has changed."
            - id: log-count
              code: "function logCount(tasks) {\n  console.log(tasks.length);\n}"
              why:
                uk: "Друк у консоль — побічний ефект. Функція нічого не повертає, а лише щось робить."
                en: "Printing to the console is a side effect. The function returns nothing, it only does something."
          correct: [count-done, is-overdue]
        explanation:
          uk: "`countDone` і `isOverdue` лише обчислюють результат з аргументів — їх легко перевірити й використати в будь-якому модулі. Сторінка, сховище й консоль — це ефекти: вони живуть у модулях `ui/` чи `storage/`, «на краю» програми."
          en: "`countDone` and `isOverdue` only compute a result from their arguments — they are easy to check and to use in any module. The page, storage and the console are effects: they live in `ui/` or `storage/` modules, at the “edge” of the program."

  - id: split-records
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: split-records
    entry: index.html
    editable: [ui/render.js, domain/records.js]
    strings:
      lang: { uk: "uk", en: "en" }
      pageTitle: { uk: "Трекер звичок", en: "Habit tracker" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      water: { uk: "Пити воду", en: "Drink water" }
      words: { uk: "Вчити англійські слова", en: "Learn English words" }
      read: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      walk: { uk: "Прогулянка", en: "Go for a walk" }
      tidy: { uk: "Прибирання", en: "Tidy up" }
      activeText: { uk: "Активних: ", en: "Active: " }
      completionsText: { uk: "виконань: ", en: "completions: " }
      invalid: { uk: "Неправильна звичка ", en: "Invalid habit " }
    title:
      uk: "Правила — у domain, сторінка — в ui"
      en: "Rules in domain, the page in ui"
    instructions:
      uk: |
        Зараз `ui/render.js` містить і правила звичок, і роботу зі сторінкою. Розділи їх:

        - Перенеси `validateRecord` і `summarize` у `domain/records.js` та зроби їх іменованими експортами.
        - У `ui/render.js` залиш лише `render` і імпортуй обидві функції з `domain/records.js`.

        Сторінка має показувати те саме, що й до змін: підсумок і список. `main.js` і `index.html` не змінюються.
      en: |
        Right now `ui/render.js` holds both the habit rules and the page work. Split them:

        - Move `validateRecord` and `summarize` into `domain/records.js` and make them named exports.
        - In `ui/render.js`, keep only `render` and import both functions from `domain/records.js`.

        The page must show the same as before: the summary and the list. `main.js` and `index.html` do not change.
    testTitles:
      "the page opens without an error":
        uk: "Сторінка відкривається без помилок"
        en: "The page opens without an error"
      "domain/records.js exports validateRecord":
        uk: "domain/records.js експортує validateRecord"
        en: "domain/records.js exports validateRecord"
      "domain/records.js exports summarize":
        uk: "domain/records.js експортує summarize"
        en: "domain/records.js exports summarize"
      "validateRecord still checks the name and the frequency":
        uk: "validateRecord, як і раніше, перевіряє назву й частоту"
        en: "validateRecord still checks the name and the frequency"
      "summarize still counts active habits and completions":
        uk: "summarize, як і раніше, рахує активні звички й виконання"
        en: "summarize still counts active habits and completions"
      "ui/render.js uses the functions from domain/records.js":
        uk: "ui/render.js користується функціями з domain/records.js"
        en: "ui/render.js uses the functions from domain/records.js"
      "the page shows the same summary and list":
        uk: "Сторінка показує той самий підсумок і список"
        en: "The page shows the same summary and list"
    hints:
      nudge:
        uk: "Почни з `domain/records.js`: що має бути в цьому файлі, щоб інший файл міг скористатися його функціями?"
        en: "Start with `domain/records.js`: what does this file need so that another file can use its functions?"
      explanation:
        uk: "Перенеси обидві функції без змін і постав перед кожною `export`. Тоді на самому початку `ui/render.js` імпортуй їх у фігурних дужках за тими самими назвами. Шлях рахуй від файла `ui/render.js`: щоб вийти з теки `ui` в теку вище, він починається з `../`, а закінчується розширенням `.js`."
        en: "Move both functions unchanged and put `export` in front of each. Then, at the very start of `ui/render.js`, import them in curly braces under the same names. Count the path from the file `ui/render.js`: to get out of the `ui` folder into the folder above, it starts with `../`, and it ends with the `.js` extension."
    solutionNote:
      uk: "Тепер `domain/records.js` — чисті правила звичок, які можна перевірити й використати деінде без сторінки, а `ui/render.js` лише малює. Імпорт `../domain/records.js` рахується від `ui/render.js`. Імпортовані назви — ті самі функції, а не копії: перевірка порівнює їх через `===`."
      en: "Now `domain/records.js` holds pure habit rules that can be checked and reused elsewhere without the page, and `ui/render.js` only draws. The import `../domain/records.js` is counted from `ui/render.js`. The imported names are the same functions, not copies: the check compares them with `===`."
    feedback:
      - when: { test: "the page opens without an error" }
        message:
          uk: "Ця перевірка чекає, що сторінка відкриється без помилок. Якщо на картці помилки `ReferenceError: … is not defined`, файл користується назвою, яку не імпортував. Якщо там `SyntaxError` про модуль, що «does not provide an export named …», — у модулі немає такого експорту."
          en: "This check expects the page to open without errors. If the error card shows `ReferenceError: … is not defined`, a file uses a name it did not import. If it shows a `SyntaxError` about a module that “does not provide an export named …”, the module has no such export."
      - when: { test: "domain/records.js exports validateRecord" }
        message:
          uk: "Ця перевірка шукає серед експортів `domain/records.js` функцію `validateRecord` — оголошену з `export` перед нею."
          en: "This check looks for the function `validateRecord` among the exports of `domain/records.js` — declared with `export` in front of it."
      - when: { test: "domain/records.js exports summarize" }
        message:
          uk: "Ця перевірка шукає серед експортів `domain/records.js` функцію `summarize` — оголошену з `export` перед нею."
          en: "This check looks for the function `summarize` among the exports of `domain/records.js` — declared with `export` in front of it."
      - when: { test: "validateRecord still checks the name and the frequency" }
        message:
          uk: "Ця перевірка викликає `validateRecord` з `domain/records.js` для правильної звички й для звички без назви та з частотою `monthly` і чекає тих самих результатів, що давала функція до перенесення. Переносять без змін."
          en: "This check calls `validateRecord` from `domain/records.js` for a valid habit and for a habit with no name and the frequency `monthly`, and expects the same results the function gave before the move. Moving means no changes."
      - when: { test: "summarize still counts active habits and completions" }
        message:
          uk: "Ця перевірка викликає `summarize` з `domain/records.js` для двох звичок і чекає `{ count: 2, active: 1, completions: 2 }` — як до перенесення."
          en: "This check calls `summarize` from `domain/records.js` for two habits and expects `{ count: 2, active: 1, completions: 2 }` — as before the move."
      - when: { test: "ui/render.js uses the functions from domain/records.js" }
        message:
          uk: "Ця перевірка чекає, що `ui/render.js` бере `validateRecord` і `summarize` з `domain/records.js` через `import`, а не тримає власних копій."
          en: "This check expects `ui/render.js` to take `validateRecord` and `summarize` from `domain/records.js` through `import` instead of keeping copies of its own."
      - when: { test: "the page shows the same summary and list" }
        message:
          uk: "Ця перевірка чекає на сторінці той самий підсумок і той самий список, що й до перенесення."
          en: "This check expects the page to show the same summary and the same list as before the move."

  - id: to-project
    kind: transfer
    capstoneStep: JS-07
    body:
      uk: "У кроці проєкту ти розділиш свій застосунок так само: правила твого домену (`validate…`, підсумки) — у `domain/`, малювання й обробники подій — в `ui/`. Перед тим як переносити, вирішуй для кожної функції: вона лише обчислює чи щось робить зі сторінкою чи сховищем?"
      en: "In the project step you will split your app the same way: your domain’s rules (`validate…`, summaries) go to `domain/`, drawing and event listeners to `ui/`. Before moving a function, decide: does it only compute, or does it do something with the page or storage?"
