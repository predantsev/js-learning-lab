id: rn-06-01-fixtures-mock-service
unit: RN-06
title:
  uk: "Фікстури й наданий mock-сервіс"
  en: "Fixtures and the supplied mock service"
kind: instructional
minutes: 15
contentVersion: 1
objectives:
  - uk: "Завантажувати записи проєкту з вбудованих фікстур через той самий інтерфейс джерела даних, через який згодом застосунок говоритиме з наданим mock-сервісом."
    en: "Load capstone records from bundled fixtures through the same data-source interface that will later talk to the supplied mock service."
  - uk: "Запускати й зупиняти наданий mock-сервіс задокументованими командами й пояснювати, чому до розділу Node.js власний бекенд не потрібен."
    en: "Start and stop the supplied mock service with its documented commands, and explain why no learner-built backend is needed before the Node stage."
prerequisites: [rn-05-08-capstone-native-persistence, re-06-01-fetch-lifecycle]
subskills:
  - { family: N-06, skill: "fixture/mock-service before Node", depth: intro }
glossary: [bundled-fixture, mock-service]
selfCheck: [predict-states, fixture-source]

blocks:
  - id: three-sources
    kind: explanation
    title:
      uk: "Три джерела даних — один інтерфейс"
      en: "Three data sources, one interface"
    body:
      uk: |
        Досі екрани твого нативного застосунку брали записи зі сховища пристрою. Тепер їм потрібні дані «ззовні». Звідки їх брати, поки ти не написав жодного сервера?

        - **[[bundled-fixture|Вбудовані фікстури]]** — синтетичні записи, що лежать у самому застосунку. Мережі немає: дані є одразу, нічого не ламається.
        - **Наданий [[mock-service|mock-сервіс]]** — маленький HTTP-сервер курсу, який ти запускаєш на своєму комп’ютері однією командою. Запити йдуть по справжньому HTTP, а сервіс на замовлення відповідає із затримкою, статусом 503 чи взагалі мовчить. Писати його не треба — він уже готовий.
        - **Справжній API** — твій власний сервер; ти напишеш його в розділі Node.js і підключиш у NO-06.

        Щоб міняти джерела без переписування екрана, екран знає лише інтерфейс: метод `list(signal)`, що повертає promise масиву записів. Хто саме його виконує — фікстури чи мережа, — екранові байдуже.
      en: |
        Until now your native app's screens took records from the device's storage. Now they need data from "outside". Where do you get it before you have written any server?

        - **[[bundled-fixture|Bundled fixtures]]** — synthetic records that live inside the app itself. No network: the data is there at once, nothing breaks.
        - **The supplied [[mock-service|mock service]]** — a small HTTP server from the course that you start on your computer with one command. Requests travel over real HTTP, and on request the service answers with a delay, with status 503, or not at all. You do not write it — it is ready.
        - **A real API** — your own server; you will write it in the Node.js stage and connect it in NO-06.

        To swap sources without rewriting the screen, the screen knows only an interface: a method `list(signal)` that returns a promise of an array of records. Who carries it out — fixtures or the network — makes no difference to the screen.

  - id: sources-diagram
    kind: visual
    visual: diagram
    title:
      uk: "Екран, інтерфейс і три джерела"
      en: "The screen, the interface and three sources"
    textEquivalent:
      uk: "Згори — екран списку бажань. Він викликає лише RecordsSource.list(signal). Під інтерфейсом — три джерела. Вбудовані фікстури відповідають одразу й без мережі. Наданий mock-сервіс на твоєму комп’ютері відповідає по справжньому HTTP і вміє затримку, помилку 503 й мовчання. Справжній API з’явиться лише в NO-06. Коли джерело змінюється, екран і доменний код лишаються тими самими."
      en: "At the top is the wishlist screen. It calls only RecordsSource.list(signal). Under the interface are three sources. Bundled fixtures answer at once, without a network. The supplied mock service on your computer answers over real HTTP and can delay, fail with 503 or stay silent. The real API arrives only in NO-06. When the source changes, the screen and the domain code stay the same."
    spec:
      layout: grid
      nodes:
        - { id: screen, label: { uk: "Екран бажань", en: "Wishlist screen" }, col: 0, row: 0, w: 230 }
        - { id: iface, label: "RecordsSource.list(signal)", shape: round, col: 0, row: 1, w: 230 }
        - { id: fixtures, label: { uk: "вбудовані фікстури", en: "bundled fixtures" }, col: 0, row: 2, w: 230 }
        - { id: mock, label: { uk: "mock-сервіс (HTTP)", en: "mock service (HTTP)" }, col: 0, row: 3, w: 230 }
        - { id: api, label: { uk: "справжній API (NO-06)", en: "real API (NO-06)" }, shape: note, col: 0, row: 4, w: 230 }
      edges:
        - { id: calls, from: screen, to: iface }
        - { id: to-fixtures, from: iface, to: fixtures, label: { uk: "без мережі", en: "no network" } }
        - { id: to-mock, from: fixtures, to: mock, kind: dashed, label: { uk: "або", en: "or" } }
        - { id: to-api, from: mock, to: api, kind: dashed, label: { uk: "згодом", en: "later" } }
      steps:
        - highlight: [screen, iface, calls]
          caption:
            uk: "Екран викликає лише `list(signal)` і отримує promise масиву записів."
            en: "The screen calls only `list(signal)` and gets a promise of an array of records."
        - highlight: [fixtures, to-fixtures]
          dim: [mock, api]
          caption:
            uk: "Перше джерело — вбудовані фікстури: дані вже в застосунку, мережа не потрібна."
            en: "The first source is the bundled fixtures: the data is already in the app, no network needed."
        - highlight: [mock, to-mock]
          dim: [fixtures, api]
          caption:
            uk: "Друге — наданий mock-сервіс: справжній HTTP на твоєму комп’ютері, із затримкою, 503 чи мовчанням на замовлення."
            en: "The second is the supplied mock service: real HTTP on your computer, with a delay, a 503 or silence on request."
        - highlight: [api, to-api]
          dim: [fixtures, mock]
          caption:
            uk: "Третє — справжній API. Його ти напишеш і підключиш у розділі Node.js."
            en: "The third is a real API. You will write and connect it in the Node.js stage."
        - highlight: [screen]
          caption:
            uk: "Джерела змінювалися, а екран — ні: він бачить той самий `list(signal)`."
            en: "The sources changed, the screen did not: it sees the same `list(signal)`."

  - id: predict-states
    kind: prediction
    prompt:
      uk: "Екран списку треба перевірити в чотирьох станах: дані одразу, довге завантаження, відповідь 503 і запит, на який сервер так і не відповідає. Що з цього здатні показати вбудовані фікстури, що повертають записи одразу, і наданий mock-сервіс — якщо власного сервера в тебе немає?"
      en: "A list screen must be checked in four states: data at once, a long load, a 503 answer and a request the server never answers. Which of these can bundled fixtures that return the records at once, and the supplied mock service, produce — when you have no server of your own?"
    runnable: false
    answer:
      type: choice
      options:
        - id: right
          text:
            uk: "Фікстури — лише «дані одразу»; mock-сервіс — усі чотири (затримка, 503, мовчання на замовлення)"
            en: "Fixtures — only “data at once”; the mock service — all four (a delay, a 503, silence on request)"
        - id: own-server
          text:
            uk: "Нічого з цього без власного сервера: стани мережі видно лише з бекендом, який ти написав сам"
            en: "None of these without your own server: network states only show up with a backend you wrote yourself"
          why:
            uk: "Наданий mock-сервіс — уже справжній HTTP-сервер. Він відповідає із затримкою, статусом чи мовчить за параметром у запиті, тож власний бекенд для цього не потрібен."
            en: "The supplied mock service already is a real HTTP server. It answers with a delay, a status or silence on a query parameter, so you need no backend of your own for this."
        - id: fixtures-all
          text:
            uk: "Фікстури — усі чотири, адже це ті самі дані"
            en: "Fixtures — all four, since it is the same data"
          why:
            uk: "Фікстури, що віддають записи одразу, ніколи не чекають і не падають. Затримку чи 503 вони дадуть лише тоді, коли ти напишеш таку симуляцію сам."
            en: "Fixtures that return the records at once never wait and never fail. They give a delay or a 503 only if you write such a simulation yourself."
      correct: [right]
    explanation:
      uk: "Фікстури — найшвидший спосіб побачити екран з даними. Стани мережі — завантаження, помилки, мовчання — дає mock-сервіс, бо між застосунком і даними там справжнє HTTP-з’єднання."
      en: "Fixtures are the quickest way to see the screen with data. Network states — loading, errors, silence — come from the mock service, because there is a real HTTP connection between the app and the data."

  - id: recall-fetch-lifecycle
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: first-render-status
        from: re-06-01-fetch-lifecycle
        prompt:
          uk: "Компонент React завантажує записи в `useEffect`, а початковий стан — `{ status: 'loading' }`. Що бачить користувач на найпершому рендері, ще до запуску ефекту?"
          en: "A React component loads records in `useEffect`, and its initial state is `{ status: 'loading' }`. What does the user see on the very first render, before the effect has even started?"
        answer:
          type: choice
          options:
            - id: loading
              text:
                uk: "Стан завантаження"
                en: "The loading state"
            - id: data
              text:
                uk: "Уже дані, якщо сервер швидкий"
                en: "The data already, if the server is fast"
              why:
                uk: "Ефект запускається лише після commit першого рендеру. Навіть найшвидша відповідь приходить пізніше, і дані покаже наступний рендер."
                en: "The effect starts only after the first render is committed. Even the fastest answer comes later, and the next render shows the data."
            - id: blank
              text:
                uk: "Порожній екран без жодного стану"
                en: "An empty screen with no state at all"
              why:
                uk: "Перший рендер показує початковий стан — тут це `loading`."
                en: "The first render shows the initial state — here that is `loading`."
          correct: [loading]
        explanation:
          uk: "Рендер → commit → ефект запускає запит → відповідь змінює стан → новий рендер. Тому стан завантаження видно завжди, хоч і мить."
          en: "Render → commit → the effect starts the request → the answer changes state → a new render. So the loading state is always visible, if only for a moment."

  - id: records-sources
    kind: example
    runtime: concept-preview
    dir: records-sources
    entry: main.jsx
    strings:
      heading: { uk: "Список бажань", en: "Wishlist" }
      headphones: { uk: "Навушники", en: "Headphones" }
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      bicycle: { uk: "Велосипед", en: "Bicycle" }
      loading: { uk: "Завантаження…", en: "Loading…" }
      failed: { uk: "Не вдалося завантажити", en: "Could not load" }
      loadedIn: { uk: "Завантажено за", en: "Loaded in" }
    title:
      uk: "Один екран — два джерела"
      en: "One screen, two sources"
    body:
      uk: |
        Екран `WishlistScreen` отримує джерело як пропс і викликає лише `source.list(signal)`. У `sources.js` два джерела з однаковою формою: `bundledSource` (фікстури) і `simulatedMockSource` — **симуляція** відповіді mock-сервісу із затримкою та статусом.

        Натисни **Запустити**: з фікстурами список з’являється майже миттєво.
      en: |
        The `WishlistScreen` screen gets its source as a prop and calls only `source.list(signal)`. `sources.js` has two sources with the same shape: `bundledSource` (fixtures) and `simulatedMockSource` — a **simulation** of the mock service's answer with a delay and a status.

        Press **Run**: with fixtures the list appears almost at once.
    tryIt:
      uk: |
        1. У `main.jsx` зміни `SOURCE` на `'mock'` і запусти: спершу видно «Завантаження…», а через 800 мс — той самий список і час завантаження.
        2. Зміни `delayMs` на `1500` і запусти ще раз: стан завантаження триває довше.
        3. Зміни `status: 200` на `status: 503` і запусти: замість списку — повідомлення про помилку. Компонент `WishlistScreen` ти не чіпав.
      en: |
        1. In `main.jsx` change `SOURCE` to `'mock'` and run: first “Loading…” is visible, and after 800 ms the same list and the load time.
        2. Change `delayMs` to `1500` and run again: the loading state lasts longer.
        3. Change `status: 200` to `status: 503` and run: an error message instead of the list. You did not touch the `WishlistScreen` component.
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не нативний застосунок. `simulatedMockSource` лише імітує затримку й статус таймером: справжнього HTTP-запиту тут немає, і до сервісу на твоєму комп’ютері перегляд не дістається. Справжні запити до mock-сервісу застосунок надсилає на твоїй заявленій цілі — з емулятора, симулятора чи телефона."
      en: "This is a browser preview through react-native-web, not a native app. `simulatedMockSource` only imitates a delay and a status with a timer: there is no real HTTP request here, and the preview does not reach a service on your computer. The app sends real requests to the mock service on your declared target — from an emulator, a simulator or a phone."

  - id: data-proves
    kind: prediction
    prompt:
      uk: "Ти запустив застосунок на телефоні, і список бажань завантажився з наданого mock-сервісу на твоєму комп’ютері. Що це доводить?"
      en: "You ran the app on a phone, and the wishlist loaded from the supplied mock service on your computer. What does that prove?"
    runnable: false
    answer:
      type: choice
      options:
        - id: path
          text:
            uk: "Що запит застосунку, розбір відповіді й стани екрана працюють по справжньому HTTP до твого комп’ютера"
            en: "That the app's request, response parsing and screen states work over real HTTP to your computer"
        - id: backend
          text:
            uk: "Що застосунок працюватиме зі справжнім бекендом"
            en: "That the app will work with a real backend"
          why:
            uk: "Справжній бекенд має іншу адресу, HTTPS, вхід користувача, інші дані й іншу затримку. Mock-сервіс нічого з цього не перевіряє — інтеграцію перевіряють у NO-06."
            en: "A real backend has another address, HTTPS, user sign-in, other data and other latency. The mock service checks none of that — the integration is checked in NO-06."
        - id: nothing
          text:
            uk: "Нічого: дані з mock-сервісу не відрізняються від фікстур"
            en: "Nothing: data from the mock service is no different from fixtures"
          why:
            uk: "Дані ті самі, а шлях інший: запит пройшов мережею з пристрою до комп’ютера, і застосунок розібрав справжню HTTP-відповідь. Фікстури цього не перевіряють."
            en: "The data is the same, the path is not: the request went over the network from the device to the computer, and the app parsed a real HTTP answer. Fixtures check none of that."
      correct: [path]
    explanation:
      uk: "Mock-сервіс перевіряє твою сторону — запит, адресу, розбір, стани. Він не замінює справжній бекенд: його контракт навмисно простий і незмінний."
      en: "The mock service checks your side — the request, the address, the parsing, the states. It does not stand in for a real backend: its contract is simple and fixed on purpose."

  - id: fixture-source
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: fixture-source
    entry: index.ts
    editable: [source.ts]
    strings:
      t01: { uk: "Полити квіти", en: "Water the plants" }
      t02: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      t04: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      t05: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
    title:
      uk: "Джерело даних з фікстур для планувальника"
      en: "A fixture data source for the planner"
    instructions:
      uk: |
        У `source.ts`:

        1. Допиши інтерфейс `RecordsSource<T>`: метод `list`, що приймає необов’язковий `AbortSignal` і повертає promise масиву `T`.
        2. Допиши `createFixtureSource(records)`: він повертає об’єкт з методом `list()`, що
           - повертає **promise**, а не масив;
           - виконується з усіма переданими справами;
           - на кожен виклик дає **новий** масив: якщо екран його відсортує чи розверне, вбудовані фікстури не зміняться.

        Код екрана в `screen.ts` уже готовий і бачить лише інтерфейс. Пісочниця прибирає типи й не перевіряє їх — інтерфейс перевірить `tsc` у твоєму локальному проєкті; перевірки тут дивляться на поведінку.
      en: |
        In `source.ts`:

        1. Complete the `RecordsSource<T>` interface: a method `list` that takes an optional `AbortSignal` and returns a promise of an array of `T`.
        2. Complete `createFixtureSource(records)`: it returns an object with a `list()` method that
           - returns a **promise**, not an array;
           - resolves with all the given tasks;
           - gives a **new** array on every call: if the screen sorts or reverses it, the bundled fixtures do not change.

        The screen code in `screen.ts` is ready and sees only the interface. The sandbox strips types and does not check them — `tsc` in your local project checks the interface; the checks here look at behavior.
    testTitles:
      "list() returns a promise":
        uk: "`list()` повертає promise"
        en: "`list()` returns a promise"
      "list() resolves with all the bundled tasks":
        uk: "`list()` виконується з усіма вбудованими справами"
        en: "`list()` resolves with all the bundled tasks"
      "every call resolves a new array, so changing it leaves the bundle as it was":
        uk: "Кожен виклик дає новий масив, тож його зміна не чіпає фікстури"
        en: "Every call gives a new array, so changing it leaves the fixtures as they were"
      "the screen code gets the pending titles through the source":
        uk: "Код екрана отримує назви невиконаних справ через джерело"
        en: "The screen code gets the titles of pending tasks through the source"
    hints:
      nudge:
        uk: "Що має повернути `list()`, щоб із ним можна було працювати так само, як з відповіддю мережі? І що станеться з фікстурами, якщо всі виклики отримують один і той самий масив?"
        en: "What must `list()` return so it can be used the same way as a network answer? And what happens to the fixtures if every call gets one and the same array?"
      explanation:
        uk: "Відповідь мережі завжди приходить пізніше, тому інтерфейс обіцяє promise навіть там, де дані вже є: є способи загорнути готове значення в promise, які ти бачив у розділі про асинхронність. А масив передається за посиланням: якщо всі виклики отримують той самий масив, будь-яка зміна в одному місці видна всюди. Кожен виклик має отримувати власну копію."
        en: "A network answer always comes later, so the interface promises a promise even where the data is already there: you saw ways to wrap a ready value in a promise in the async unit. And an array is passed by reference: if every call gets the same array, a change in one place is visible everywhere. Each call must get its own copy."
    solutionNote:
      uk: "`list()` повертає promise нового масиву. Код екрана чекає на нього через `await` і не знає, що мережі тут немає. Коли згодом замість фікстур з’явиться джерело, яке ходить до mock-сервісу, `screen.ts` не зміниться."
      en: "`list()` returns a promise of a new array. The screen code waits for it with `await` and does not know there is no network here. When a source that talks to the mock service replaces the fixtures later, `screen.ts` does not change."
    feedback:
      - when: { test: "list() returns a promise" }
        message:
          uk: "Ця перевірка чекає, що `list()` повертає promise — об’єкт з методом `then`. Масив, повернутий напряму, `await` у коді екрана ще проковтне, але джерело, яке ходить у мережу, відповісти одразу не може."
          en: "This check expects `list()` to return a promise — an object with a `then` method. An array returned directly is still swallowed by `await` in the screen code, but a source that goes to the network cannot answer at once."
      - when: { test: "every call resolves a new array, so changing it leaves the bundle as it was" }
        message:
          uk: "Ця перевірка розвертає масив з першого виклику й чекає, що другий виклик і самі фікстури мають початковий порядок. Для цього кожен виклик має давати копію, а не масив `records`."
          en: "This check reverses the array from the first call and expects the second call and the fixtures themselves to keep the original order. For that every call must give a copy, not the `records` array."
      - when: { test: "the screen code gets the pending titles through the source" }
        message:
          uk: "Ця перевірка передає твоє джерело в `pendingTitles` з `screen.ts` і чекає три назви невиконаних справ. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "This check passes your source to `pendingTitles` from `screen.ts` and expects the three titles of pending tasks. If every check fails at once, fix the first error in the console first."

  - id: mock-service
    kind: example
    runtime: isolated-node
    dir: mock-service
    entry: index.js
    capabilities: { network: loopback }
    strings:
      lang: { uk: "uk", en: "en" }
    title:
      uk: "Наданий mock-сервіс — справжній Node.js"
      en: "The supplied mock service — real Node.js"
    body:
      uk: |
        Це вже не симуляція: `mock-service.mjs` — сам mock-сервіс курсу, а `index.js` запускає його справжнім Node.js на твоєму комп’ютері, надсилає два запити й зупиняє. Розбиратися в коді сервісу не треба — сервери ти писатимеш у розділі Node.js. Важливі лише його адреси й перемикачі, описані в коментарі на початку файлу.

        Назви записів у сервісі зберігаються одразу двома мовами (`{ uk: …, en: … }`), а параметр `?lang=uk` чи `?lang=en` вибирає, якою відповідати. Так навмисно: файл ти скопіюєш до себе один раз, і він служитиме обом мовам курсу.

        Натисни **Запустити**. Рядки `[mock] …` — журнал самого сервісу: кожен запит, статус і звідки він прийшов.
      en: |
        This is no simulation: `mock-service.mjs` is the course's mock service itself, and `index.js` starts it with real Node.js on your computer, sends two requests and stops it. You do not need to understand the service's code — you will write servers in the Node.js stage. What matters are its addresses and switches, described in the comment at the top of the file.

        The service keeps record names in both languages at once (`{ uk: …, en: … }`), and the `?lang=uk` or `?lang=en` parameter picks which one it answers in. That is on purpose: you copy the file once, and it serves both languages of the course.

        Press **Run**. The `[mock] …` lines are the service's own log: every request, its status and where it came from.
    tryIt:
      uk: |
        1. У `index.js` додай у масив `paths` рядок `'/records/expenses?lang=%%lang%%&delay=500'` і запусти: третя відповідь — витрати — приходить на пів секунди пізніше.
        2. Додай `'/records/books'` і запусти: такої колекції немає, сервіс відповідає 404.
      en: |
        1. In `index.js` add the string `'/records/expenses?lang=%%lang%%&delay=500'` to the `paths` array and run: the third answer — the expenses — comes half a second later.
        2. Add `'/records/books'` and run: there is no such collection, the service answers 404.

  - id: start-mock-service
    kind: local-task
    runtime: local-web
    title:
      uk: "Запусти й зупини mock-сервіс на своєму комп’ютері"
      en: "Start and stop the mock service on your computer"
    intro:
      uk: |
        Тут потрібні лише Node.js і термінал — ні емулятора, ні телефона. Сервіс житиме в окремій теці `~/js-course/rn06-mock`; ним користуватимуться наступні уроки цього розділу.

        Усі команди виконано під час підготовки уроку на macOS з Node.js v25.2.1 і curl; вивід нижче справжній. У Windows PowerShell пиши `curl.exe` замість `curl`: просте `curl` там — інша команда.

        **Крок 3 — що друкує запуск:**

        ```text
        Mock service listening on http://127.0.0.1:7310
        Only this computer can reach it (loopback).
        Stop it with Ctrl+C.
        ```

        **Крок 4 — три запити з другого терміналу (уривок):**

        ```text
        $ curl -sS http://127.0.0.1:7310/health
        {"ok":true}
        $ curl -sS "http://127.0.0.1:7310/records/wishlist?lang=en"
        [{"id":"w-01","name":"Headphones","price":80,"acquired":false,"category":"Tech"},…]
        $ curl -sS -i "http://127.0.0.1:7310/records/planner?status=503"
        HTTP/1.1 503 Service Unavailable
        content-type: application/json; charset=utf-8
        …
        {"error":"rehearsed status 503"}
        ```

        **Крок 5 — журнал сервісу в першому терміналі:**

        ```text
        [mock] GET /health → 200 from 127.0.0.1
        [mock] GET /records/wishlist?lang=en → 200 from 127.0.0.1
        [mock] GET /records/planner?status=503 → 503 from 127.0.0.1
        ```

        **Крок 6 — після Ctrl+C:**

        ```text
        Mock service stopped.
        $ curl -sS http://127.0.0.1:7310/health
        curl: (7) Failed to connect to 127.0.0.1 port 7310 after 0 ms: Couldn't connect to server
        ```
      en: |
        You only need Node.js and a terminal here — no emulator, no phone. The service lives in its own folder `~/js-course/rn06-mock`; the next lessons of this unit use it.

        All commands were run while preparing this lesson on macOS with Node.js v25.2.1 and curl; the output below is real. In Windows PowerShell type `curl.exe` instead of `curl`: a plain `curl` is a different command there.

        **Step 3 — what starting it prints:**

        ```text
        Mock service listening on http://127.0.0.1:7310
        Only this computer can reach it (loopback).
        Stop it with Ctrl+C.
        ```

        **Step 4 — three requests from a second terminal (an excerpt):**

        ```text
        $ curl -sS http://127.0.0.1:7310/health
        {"ok":true}
        $ curl -sS "http://127.0.0.1:7310/records/wishlist?lang=en"
        [{"id":"w-01","name":"Headphones","price":80,"acquired":false,"category":"Tech"},…]
        $ curl -sS -i "http://127.0.0.1:7310/records/planner?status=503"
        HTTP/1.1 503 Service Unavailable
        content-type: application/json; charset=utf-8
        …
        {"error":"rehearsed status 503"}
        ```

        **Step 5 — the service's log in the first terminal:**

        ```text
        [mock] GET /health → 200 from 127.0.0.1
        [mock] GET /records/wishlist?lang=en → 200 from 127.0.0.1
        [mock] GET /records/planner?status=503 → 503 from 127.0.0.1
        ```

        **Step 6 — after Ctrl+C:**

        ```text
        Mock service stopped.
        $ curl -sS http://127.0.0.1:7310/health
        curl: (7) Failed to connect to 127.0.0.1 port 7310 after 0 ms: Couldn't connect to server
        ```
    tools:
      - { name: "Node.js", version: "22 or newer", note: { uk: "перевірено з v25.2.1", en: "checked with v25.2.1" } }
      - { name: "curl", note: { uk: "є в macOS, Linux і Windows 10/11 (у PowerShell — `curl.exe`)", en: "ships with macOS, Linux and Windows 10/11 (in PowerShell: `curl.exe`)" } }
    steps:
      - text:
          uk: "Створи теку для сервісу й перейди в неї."
          en: "Create a folder for the service and go into it."
        command: "mkdir -p ~/js-course/rn06-mock\ncd ~/js-course/rn06-mock"
      - text:
          uk: "Створи в цій теці файл `mock-service.mjs` у VS Code і встав у нього весь вміст файлу `mock-service.mjs` з прикладу «Наданий mock-сервіс — справжній Node.js» (відкрий його вкладку, клацни в код, виділи все й скопіюй). Збережи файл."
          en: "Create the file `mock-service.mjs` in this folder in VS Code and paste into it the whole content of the `mock-service.mjs` file from the example “The supplied mock service — real Node.js” (open its tab, click into the code, select all and copy). Save the file."
        expect:
          uk: "Файл починається з коментаря `// The course's mock service…` і закінчується обробником `SIGINT`."
          en: "The file starts with the comment `// The course's mock service…` and ends with the `SIGINT` handler."
      - text:
          uk: "Запусти сервіс. Термінал лишається зайнятим, доки сервіс працює."
          en: "Start the service. The terminal stays busy while the service runs."
        command: "node mock-service.mjs"
        expect:
          uk: "Три рядки з кроку 3 вступу: адреса `http://127.0.0.1:7310` і нагадування про Ctrl+C."
          en: "The three lines from step 3 of the introduction: the address `http://127.0.0.1:7310` and the Ctrl+C reminder."
      - text:
          uk: "Відкрий **другий** термінал і надішли три запити: перевірку, список бажань англійською й навмисну помилку 503."
          en: "Open a **second** terminal and send three requests: the health check, the wishlist in English and a deliberate 503."
        command: "curl -sS http://127.0.0.1:7310/health\ncurl -sS \"http://127.0.0.1:7310/records/wishlist?lang=en\"\ncurl -sS -i \"http://127.0.0.1:7310/records/planner?status=503\""
        expect:
          uk: "Як у кроці 4 вступу: `{\"ok\":true}`, масив бажань і `HTTP/1.1 503 Service Unavailable`."
          en: "As in step 4 of the introduction: `{\"ok\":true}`, an array of wishes and `HTTP/1.1 503 Service Unavailable`."
      - text:
          uk: "Подивись у перший термінал: на кожен запит сервіс записав рядок `[mock] …` зі статусом і адресою, звідки прийшов запит."
          en: "Look at the first terminal: for every request the service wrote a `[mock] …` line with the status and the address the request came from."
        expect:
          uk: "Три рядки, як у кроці 5 вступу."
          en: "Three lines, as in step 5 of the introduction."
      - text:
          uk: "Зупини сервіс: у першому терміналі натисни Ctrl+C. Потім у другому повтори перевірку."
          en: "Stop the service: press Ctrl+C in the first terminal. Then repeat the health check in the second one."
        command: "curl -sS http://127.0.0.1:7310/health"
        expect:
          uk: "Перший термінал написав `Mock service stopped.` (термінал може спершу показати `^C` — так він відображає натискання), а `curl` — `Failed to connect`: сервісу більше немає."
          en: "The first terminal printed `Mock service stopped.` (the terminal may show `^C` first — that is how it echoes the key press), and `curl` says `Failed to connect`: the service is gone."
    verify:
      - id: started
        text:
          uk: "Сервіс запустився командою `node mock-service.mjs` і відповів `{\"ok\":true}` на `/health`."
          en: "The service started with `node mock-service.mjs` and answered `{\"ok\":true}` on `/health`."
      - id: rehearsed-503
        text:
          uk: "Запит з `?status=503` повернув статус 503, а журнал сервісу показав рядок для кожного запиту."
          en: "The request with `?status=503` returned status 503, and the service's log showed a line for every request."
      - id: stopped
        text:
          uk: "Після Ctrl+C сервіс написав `Mock service stopped.`, і `curl` більше не зміг до нього підключитися."
          en: "After Ctrl+C the service printed `Mock service stopped.`, and `curl` could no longer connect to it."
    troubleshooting:
      - problem:
          uk: "Під час запуску Node друкує стек, а в ньому рядок `Error: listen EADDRINUSE: address already in use 127.0.0.1:7310`"
          en: "On start Node prints a stack with the line `Error: listen EADDRINUSE: address already in use 127.0.0.1:7310`"
        fix:
          uk: "Порт 7310 уже зайнятий — найчастіше сервісом, запущеним раніше в іншому терміналі. Зупини його там Ctrl+C або запусти цей на іншому порту: `node mock-service.mjs --port 7311` (і тоді пиши 7311 у запитах)."
          en: "Port 7310 is already taken — most often by the service started earlier in another terminal. Stop it there with Ctrl+C, or start this one on another port: `node mock-service.mjs --port 7311` (and then use 7311 in the requests)."
      - problem:
          uk: "Одразу після запуску `SyntaxError: Invalid or unexpected token` (чи інший `SyntaxError`) з номером рядка у файлі"
          en: "Right after starting, `SyntaxError: Invalid or unexpected token` (or another `SyntaxError`) with a line number in the file"
        fix:
          uk: "Найчастіше файл скопійовано не повністю. Відкрий вкладку `mock-service.mjs` у прикладі ще раз, виділи все й заміни вміст файлу."
          en: "Most often the file was not copied completely. Open the `mock-service.mjs` tab in the example again, select all and replace the file's content."
      - problem:
          uk: "У Windows PowerShell команда `curl` друкує щось зовсім інше, ніж у вступі"
          en: "In Windows PowerShell the `curl` command prints something quite different from the introduction"
        fix:
          uk: "У Windows PowerShell 5.1 `curl` — це псевдонім іншої команди (`Invoke-WebRequest`), за документацією Microsoft; під час підготовки уроку Windows не перевіряли. Пиши `curl.exe` з тими самими аргументами."
          en: "In Windows PowerShell 5.1 `curl` is an alias of another command (`Invoke-WebRequest`), per Microsoft's documentation; Windows was not checked while preparing this lesson. Type `curl.exe` with the same arguments."
    recovery:
      uk: "Сервіс нічого не записує на диск: зупинка Ctrl+C і новий запуск повертають його до початкового стану. Якщо файл зіпсувався, заміни весь його вміст файлом з прикладу."
      en: "The service writes nothing to disk: stopping it with Ctrl+C and starting it again returns it to its initial state. If the file got damaged, replace its whole content with the file from the example."

  - id: to-project
    kind: transfer
    capstoneStep: RN-06
    body:
      uk: "У кроці проєкту твій нативний застосунок отримає джерело записів з тим самим інтерфейсом `list(signal)`: спершу з вбудованих фікстур твого домену, потім — з наданого mock-сервісу (`/records/wishlist`, `/records/planner`, `/records/habits` чи `/records/expenses`). Екрани й доменні функції проєкту при цьому не зміняться."
      en: "In the project step your native app gets a records source with the same `list(signal)` interface: first from your domain's bundled fixtures, then from the supplied mock service (`/records/wishlist`, `/records/planner`, `/records/habits` or `/records/expenses`). The project's screens and domain functions do not change in the process."
