  - id: release-gate-note
    kind: explanation
    title:
      uk: "А третя причина на цілі?"
      en: "And the third cause on the target?"
    body:
      uk: |
        Політику простого HTTP Expo Go на заявленій цілі не покаже: це готовий застосунок зі своїми налаштуваннями, а налаштування твого проєкту діють лише у збірці з нього. Якщо в тебе вже встановлені інструменти для нативних збірок (Android Studio з Android SDK чи Xcode), можеш побачити її сам: release-збірка (`npx expo run:android --variant release`) з тим самим `http://10.0.2.2:7310` не дістанеться сервісу, а журнал сервісу лишиться порожнім. Ці команди під час підготовки уроку не запускали.

        Правильний ремонт тут — не вмикати простий HTTP в release, а пам’ятати, що release ходить до справжнього API по HTTPS, а адреса mock-сервісу живе лише в debug-конфігурації — як у вправі з перевіркою транспорту.
      en: |
        Expo Go on the declared target will not show the plain-HTTP policy: it is a ready-made app with its own settings, and your project's settings apply only in a build made from it. If you already have the tools for native builds installed (Android Studio with the Android SDK, or Xcode), you can see it yourself: a release build (`npx expo run:android --variant release`) with the same `http://10.0.2.2:7310` does not reach the service, and the service's log stays empty. These commands were not run while preparing this lesson.

        The right repair here is not to turn plain HTTP on in a release, but to remember that a release talks to the real API over HTTPS, while the mock service's address lives only in the debug configuration — as in the transport-check exercise.

