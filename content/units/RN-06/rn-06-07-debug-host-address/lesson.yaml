id: rn-06-07-debug-host-address
unit: RN-06
title:
  uk: "Налагодження: адреса хоста й мережевий збій"
  en: "Debug: host address and network failure"
kind: local-task
minutes: 20
contentVersion: 1
purpose:
  uk: "Екран даних, що не дістається mock-сервісу, — найчастіша перша зустріч з мережею в нативному застосунку. Причин зазвичай три: хост, який на цілі означає не те, що ти думаєш, політика платформи щодо простого HTTP і запит без дедлайну. Зовні вони схожі, але залишають різні сліди в журналах. Ти спершу знайдеш і полагодиш усі три в навчальному коді, а потім відтвориш і полагодиш дві з них на своїй заявленій цілі з запущеним mock-сервісом."
  en: "A data screen that cannot reach the mock service is the most common first meeting with the network in a native app. There are usually three causes: a host that means something else on the target than you think, the platform's policy on plain HTTP, and a request without a deadline. They look alike from outside but leave different traces in the logs. You first find and repair all three in lab code, then reproduce and repair two of them on your declared target with the mock service running."
objectives:
  - uk: "Відтворити на заявленій цілі підготовлений екран даних, який не дістається запущеного mock-сервісу, і за журналами визначити, що причина — адреса хоста, політика простого HTTP чи відсутній тайм-аут."
    en: "Reproduce on the declared target a seeded data screen that cannot reach the running mock service, and tell from the logs whether the cause is the host address, the cleartext policy or a missing timeout."
  - uk: "Полагодити причини й підтвердити, що список завантажується, зупинений сервіс веде до стану офлайну, а повтори закінчуються на межі бюджету."
    en: "Repair the causes, then confirm the list loads, a stopped service leads to the offline state and retries stop at the budget."
prerequisites: [rn-06-06-permissions-capability-checks]
subskills:
  - { family: N-06, skill: "emulator/device addressing", depth: assess }
  - { family: N-06, skill: "fetch/cancellation/timeouts/retry", depth: assess }
  - { family: N-06, skill: "platform network configuration", depth: assess }
glossary: []
selfCheck: [seeded-source]

blocks:
  - id: three-traces
    kind: explanation
    title:
      uk: "Три причини — три різні сліди"
      en: "Three causes, three different traces"
    body:
      uk: |
        Застосунок каже лише «не завантажилось». Що сталося насправді, видно з двох журналів: журналу застосунку (рядки `console.log` у терміналі dev-сервера) і журналу mock-сервісу (`[mock] …`).

        | Причина | Журнал застосунку | Журнал mock-сервісу |
        |---|---|---|
        | хост не той (`localhost` з емулятора чи телефона) | швидко `TypeError: Network request failed` | **порожньо** — запит не дійшов |
        | політика платформи блокує простий HTTP | так само відхилений `fetch`; на Android причину пояснює системний журнал (Logcat) — на пристрої ми цього не бачили | **порожньо** |
        | немає тайм-ауту, а сервіс мовчить | «Завантаження…» без кінця, жодного рядка про збій | рядок є: запит **дійшов** і чекає |

        Перші дві причини відрізняє те, що змінилося: з тим самим хостом `curl` з комп’ютера працює, і в debug-збірці теж працює — ламається лише збірка з іншою політикою. Порядок той самий, що й завжди: відтворити, прочитати обидва журнали, полагодити одну причину, перевірити тим самим способом.
      en: |
        The app only says “did not load”. What really happened shows in two logs: the app's log (the `console.log` lines in the dev server's terminal) and the mock service's log (`[mock] …`).

        | Cause | App log | Mock service log |
        |---|---|---|
        | the wrong host (`localhost` from an emulator or phone) | a quick `TypeError: Network request failed` | **empty** — the request never arrived |
        | the platform policy blocks plain HTTP | likewise a rejected `fetch`; on Android the system log (Logcat) explains the cause — we have not seen it on a device | **empty** |
        | no timeout, and the service is silent | “Loading…” forever, no line about a failure | there is a line: the request **arrived** and waits |

        The first two causes are told apart by what changed: with the same host `curl` from the computer works, and it works in a debug build too — only a build with a different policy breaks. The routine is the usual one: reproduce, read both logs, repair one cause, check the same way.

  - id: seeded-source
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: seeded-source
    entry: index.js
    editable: [devConfig.js, networkSecurityConfig.js, loadRecords.js]
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
    title:
      uk: "Екран витрат не завантажується на емуляторі"
      en: "The expenses screen does not load on the emulator"
    instructions:
      uk: |
        Звіт про ваду: «На емуляторі Android екран витрат одразу показує помилку. Коли ж сервіс зависає, екран крутить "Завантаження…" без кінця». `index.js` відтворює обидва симптоми — натисни **Запустити** й прочитай консоль.

        Знайди й полагодь три причини у трьох файлах:

        - `devConfig.js` — кожна ціль має отримати хост, через який вона справді бачить комп’ютер (таблиця з уроку про адресу хоста);
        - `networkSecurityConfig.js` — вміст файлу `network_security_config.xml` (платформа тримає його в рядку JavaScript): debug-конфігурація Android має дозволяти простий HTTP до хостів, якими користуються емулятор і телефон на USB, і **ні до чого більше**;
        - `loadRecords.js` — запит, на який немає відповіді за `timeoutMs`, має бути скасований (`signal`, переданий у `fetchFn`, — `aborted`), а `loadRecords` — відхилитися з помилкою, назва якої `TimeoutError`.

        `policy.js` читає XML так, як Android застосовує його до простого HTTP.
      en: |
        The bug report: “On the Android emulator the expenses screen shows an error at once. And when the service hangs, the screen spins "Loading…" forever.” `index.js` reproduces both symptoms — press **Run** and read the console.

        Find and repair three causes in three files:

        - `devConfig.js` — every target must get a host through which it really sees the computer (the table from the host-address lesson);
        - `networkSecurityConfig.js` — the content of the `network_security_config.xml` file (the platform keeps it in a JavaScript string): Android's debug configuration must allow plain HTTP to the hosts the emulator and a USB phone use, and **to nothing else**;
        - `loadRecords.js` — a request with no answer within `timeoutMs` must be aborted (the `signal` passed to `fetchFn` is `aborted`), and `loadRecords` must reject with an error named `TimeoutError`.

        `policy.js` reads the XML the way Android applies it to plain HTTP.
    testTitles:
      "each target gets a host it can reach":
        uk: "Кожна ціль отримує хост, до якого може дістатися"
        en: "Each target gets a host it can reach"
      "the debug config permits plain HTTP to the Android development hosts":
        uk: "Debug-конфігурація дозволяє простий HTTP до хостів розробки Android"
        en: "The debug config permits plain HTTP to the Android development hosts"
      "the debug config permits plain HTTP to nothing else":
        uk: "Debug-конфігурація не дозволяє простий HTTP ні до чого іншого"
        en: "The debug config permits plain HTTP to nothing else"
      "a silent service ends in a TimeoutError and an aborted request":
        uk: "Мовчазний сервіс закінчується `TimeoutError` і скасованим запитом"
        en: "A silent service ends in a `TimeoutError` and an aborted request"
      "a working service still loads the records":
        uk: "Робочий сервіс, як і раніше, віддає записи"
        en: "A working service still gives the records"
    hints:
      nudge:
        uk: "Перший рядок консолі каже, куди йде запит з емулятора, другий — чи дозволено туди простий HTTP, третій — чим закінчився запит до мовчазного сервісу. Кожен рядок веде до одного файлу."
        en: "The first console line says where the emulator's request goes, the second whether plain HTTP is allowed there, the third how the request to the silent service ended. Each line leads to one file."
      explanation:
        uk: |
          `localhost` на емуляторі — сам емулятор; комп’ютер для нього має окрему адресу. У XML доменом є саме той хост, що стоїть в адресі запиту: виняток для `localhost` нічого не дає запиту на іншу адресу, а `base-config` з дозволом відкриває простий HTTP усім.

          Дедлайн запиту — таймер, який скасовує контролер запиту, і прапорець, що це був саме тайм-аут. Таймер потрібно прибрати, коли відповідь прийшла вчасно.
        en: |
          `localhost` on the emulator is the emulator itself; the computer has a separate address for it. In the XML the domain is exactly the host in the request's address: an exception for `localhost` does nothing for a request to another address, and a `base-config` with permission opens plain HTTP to everyone.

          A request's deadline is a timer that aborts the request's controller, plus a flag that it was the timeout. The timer has to be cleared when the answer came in time.
    solutionNote:
      uk: "Три причини — три різні шари: адреса (`devConfig.js`), політика платформи (XML) і час (`loadRecords.js`). Виняток у XML названо поіменно для хостів розробки, тож справжні сервери все одно отримують лише HTTPS. А таймер не лише перестає чекати, а й скасовує запит — інакше з’єднання висіло б далі."
      en: "Three causes, three different layers: the address (`devConfig.js`), the platform policy (the XML) and time (`loadRecords.js`). The XML exception names the development hosts one by one, so real servers still get only HTTPS. And the timer does not just stop waiting — it aborts the request, otherwise the connection would keep hanging."
    feedback:
      - when: { test: "each target gets a host it can reach" }
        message:
          uk: "Ця перевірка чекає `10.0.2.2` для емулятора Android, `127.0.0.1` чи `localhost` для симулятора iOS і для телефона на USB після `adb reverse`, і `LAN_ADDRESS` для телефона у Wi-Fi."
          en: "This check expects `10.0.2.2` for the Android emulator, `127.0.0.1` or `localhost` for the iOS simulator and for the USB phone after `adb reverse`, and `LAN_ADDRESS` for the Wi-Fi phone."
      - when: { test: "the debug config permits plain HTTP to the Android development hosts" }
        message:
          uk: "Ця перевірка бере хости з твого `devConfig.js` для `android-emulator` і `android-usb` і чекає, що XML дозволяє до них простий HTTP. Домен у `domain-config` має збігатися з хостом в адресі запиту."
          en: "This check takes the hosts from your `devConfig.js` for `android-emulator` and `android-usb` and expects the XML to allow plain HTTP to them. The domain in `domain-config` must match the host in the request's address."
      - when: { test: "the debug config permits plain HTTP to nothing else" }
        message:
          uk: "Ця перевірка чекає, що до `api.expenses.example` і `example.com` простий HTTP заборонено. `base-config` з `cleartextTrafficPermitted=\"true\"` відкриває його для всіх хостів."
          en: "This check expects plain HTTP to `api.expenses.example` and `example.com` to be forbidden. A `base-config` with `cleartextTrafficPermitted=\"true\"` opens it to every host."
      - when: { test: "a silent service ends in a TimeoutError and an aborted request" }
        message:
          uk: "Ця перевірка дає `fetchFn`, що ніколи не відповідає, з `timeoutMs: 100`, і чекає відхилення з назвою `TimeoutError` та скасованого `signal`, який отримав `fetchFn`. Таймер, що лише перестає чекати, лишає з’єднання відкритим."
          en: "This check gives a `fetchFn` that never answers, with `timeoutMs: 100`, and expects a rejection named `TimeoutError` and an aborted `signal` received by `fetchFn`. A timer that only stops waiting leaves the connection open."
      - when: { error: SyntaxError }
        message:
          uk: "Якщо помилка в `.js`-файлі — перевір дужки й лапки там, де ти змінював код. Якщо `policy.js` пише, що XML не well-formed, — у рядку `networkSecurityConfig` кожен тег має закриватися (`<domain …>…</domain>`, `<base-config … />`)."
          en: "If the error is in a `.js` file, check the brackets and quotes where you changed the code. If `policy.js` says the XML is not well-formed, every tag in the `networkSecurityConfig` string must be closed (`<domain …>…</domain>`, `<base-config … />`)."

  - id: recall-http-vs-rejected
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: http-error-vs-rejection
        from: js-16-09-debug-http-fetch-cors
        prompt:
          uk: "У першому випадку сервер відповів 503, у другому запит узагалі не дійшов до сервера. Чим вони відрізняються для коду, що викликав `fetch`?"
          en: "In the first case the server answered 503, in the second the request never reached the server. How do they differ for the code that called `fetch`?"
        answer:
          type: choice
          options:
            - id: resolve-vs-reject
              text:
                uk: "503 — `fetch` виконується з відповіддю, де `ok` — `false`; недійшов запит — `fetch` відхиляється"
                en: "503 — `fetch` resolves with a response whose `ok` is `false`; the request that never arrived — `fetch` rejects"
            - id: both-reject
              text:
                uk: "В обох випадках `fetch` відхиляється"
                en: "In both cases `fetch` rejects"
              why:
                uk: "503 — це відповідь сервера. `fetch` відхиляється лише тоді, коли відповіді немає."
                en: "A 503 is the server's answer. `fetch` rejects only when there is no answer."
            - id: same
              text:
                uk: "Нічим: в обох випадках `response.status` дорівнює 0"
                en: "Nothing: in both cases `response.status` is 0"
              why:
                uk: "Коли запит не дійшов, відповіді немає зовсім — немає й `response`."
                en: "When the request never arrived there is no answer at all — so no `response` either."
          correct: [resolve-vs-reject]
        explanation:
          uk: "Саме тому порожній журнал сервісу й відхилений `fetch` разом кажуть «запит не дійшов», а рядок у журналі з 503 — «дійшов, але сервер не впорався»."
          en: "That is why an empty service log and a rejected `fetch` together say “the request never arrived”, while a log line with a 503 says “it arrived, but the server failed”."

  - id: on-target
    kind: local-task
    runtime: local-native
    title:
      uk: "Хост і тайм-аут на твоїй заявленій цілі"
      en: "The host and the timeout on your declared target"
    intro:
      uk: |
        Це завдання виконується на твоєму комп’ютері й на **заявленій цілі** з розділу RN-01. Потрібні mock-сервіс з уроку про фікстури (тека `~/js-course/rn06-mock`; якщо її немає — створи її кроками того уроку) і твій `fetchWithRetry` з уроку про тайм-аути й повтори (файли `retry.js` і `wait.js` вправи; якщо ти її не розв’язав, візьми розв’язок, показаний там).

        Що перевірено під час підготовки уроку (macOS, Node.js v25.2.1, Expo SDK 57, React Native 0.86.3): проєкт із шаблону `blank-typescript@sdk-57` з файлами з кроків 3 і 9 проходить `npx tsc --noEmit` без жодного повідомлення, а `npx expo export --platform android` збирає його без помилок; вивід mock-сервісу справжній. **Запуск на пристрої (крок 5 і далі) не перевірено** — нативних інструментів там немає; що покаже твоя ціль і термінал dev-сервера, запиши сам.

        Якщо емулятора, симулятора чи телефона немає, натисни **«У мене немає емулятора чи пристрою»**: завдання запишеться як не виконане, і ти підеш далі — вправа вище вже закрила частину в навчальному коді.

        **Крок 3 — `data.js`** (новий файл поруч з `App.tsx`):

        ```js
        // RN-06 seeded data source: the host and the timeout are wrong on purpose.
        const BASE_URL = 'http://localhost:7310'; // the same host for every target
        const QUERY = '?lang=uk'; // later: '?lang=uk&hang=1'

        export async function loadWishes(signal) {
          const url = `${BASE_URL}/records/wishlist${QUERY}`;
          console.log('GET', url);
          const response = await fetch(url, { signal }); // no timeout
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        }
        ```

        **Крок 3 — `App.tsx`** (повністю заміни ним файл):

        ```tsx
        // RN-06 lab screen: shows what loadWishes() in data.js returns, or why it failed.
        import { useEffect, useState } from 'react';
        import { Pressable, StyleSheet, Text, View } from 'react-native';
        import { loadWishes } from './data.js';

        type Wish = { id: string; name: string };
        type ScreenState = { status: 'loading' | 'ready' | 'error'; wishes: Wish[]; problem?: string };

        export default function App() {
          const [state, setState] = useState<ScreenState>({ status: 'loading', wishes: [] });
          const [round, setRound] = useState(0);

          useEffect(() => {
            const controller = new AbortController();
            setState((s) => ({ ...s, status: 'loading' }));
            loadWishes(controller.signal).then(
              (wishes: Wish[]) => setState({ status: 'ready', wishes }),
              (error: Error) => {
                if (error.name === 'AbortError') return;
                console.log('load failed:', error.name, error.message);
                setState((s) => ({ ...s, status: 'error', problem: `${error.name}: ${error.message}` }));
              },
            );
            return () => controller.abort();
          }, [round]);

          return (
            <View style={styles.screen}>
              <Text style={styles.heading}>Список бажань</Text>
              {state.status === 'loading' && <Text>Завантаження…</Text>}
              {state.status === 'error' && <Text style={styles.problem}>{state.problem}</Text>}
              {state.wishes.map((wish) => <Text key={wish.id}>{wish.name}</Text>)}
              <Pressable accessibilityRole="button" onPress={() => setRound((n) => n + 1)} style={styles.button}>
                <Text style={styles.buttonText}>Оновити</Text>
              </Pressable>
            </View>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, paddingTop: 64, paddingHorizontal: 16, gap: 8, backgroundColor: '#ffffff' },
          heading: { fontSize: 20, fontWeight: '600' },
          problem: { color: '#b91c1c' },
          button: { alignSelf: 'flex-start', marginTop: 8, padding: 12, borderRadius: 6, backgroundColor: '#1d4ed8' },
          buttonText: { color: '#ffffff', fontWeight: '600' },
        });
        ```

        **Крок 7 — виправлений рядок `BASE_URL` у `data.js`:**

        ```js
        // Android emulator: the host alias. iOS simulator, or a USB phone after adb reverse: 127.0.0.1.
        const BASE_URL = Platform.OS === 'android' ? 'http://10.0.2.2:7310' : 'http://127.0.0.1:7310';
        ```

        і першим рядком файлу — `import { Platform } from 'react-native';`. Для телефона Android на кабелі спершу виконай `adb reverse tcp:7310 tcp:7310` і пиши `'http://127.0.0.1:7310'` для обох платформ. Телефон у Wi-Fi — LAN-адреса комп’ютера й сервіс, запущений з `--host 0.0.0.0` (див. урок про адресу хоста).

        **Крок 9 — `data.js` з тайм-аутом і повторами** (повністю заміни ним файл; `retry.js` і `wait.js` лежать поруч):

        ```js
        // RN-06 data source, repaired: a host per target, a timeout and bounded retry.
        import { Platform } from 'react-native';
        import { fetchWithRetry } from './retry.js';

        // Android emulator: the host alias. iOS simulator, or a USB phone after adb reverse: 127.0.0.1.
        const BASE_URL = Platform.OS === 'android' ? 'http://10.0.2.2:7310' : 'http://127.0.0.1:7310';
        const QUERY = '?lang=uk&hang=1';

        export async function loadWishes(signal) {
          const url = `${BASE_URL}/records/wishlist${QUERY}`;
          console.log('GET', url);
          const response = await fetchWithRetry(url, { fetchFn: fetch, timeoutMs: 3000, maxAttempts: 3, baseDelayMs: 500, signal });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        }
        ```
      en: |
        This task runs on your computer and on your **declared target** from unit RN-01. You need the mock service from the fixtures lesson (the folder `~/js-course/rn06-mock`; if it is missing, create it with the steps of that lesson) and your `fetchWithRetry` from the timeouts-and-retry lesson (the exercise's `retry.js` and `wait.js`; if you did not solve it, take the solution shown there).

        What was checked while preparing this lesson (macOS, Node.js v25.2.1, Expo SDK 57, React Native 0.86.3): a project from the `blank-typescript@sdk-57` template with the files from steps 3 and 9 passes `npx tsc --noEmit` without any message, and `npx expo export --platform android` bundles it without errors; the mock service's output is real. **Running on a device (step 5 onwards) was not checked** — there are no native tools there; write down yourself what your target and the dev server's terminal show.

        If you have no emulator, simulator or phone, press **“I have no emulator or device”**: the task is recorded as not performed, and you move on — the exercise above already covered a part in lab code.

        **Step 3 — `data.js`** (a new file next to `App.tsx`):

        ```js
        // RN-06 seeded data source: the host and the timeout are wrong on purpose.
        const BASE_URL = 'http://localhost:7310'; // the same host for every target
        const QUERY = '?lang=en'; // later: '?lang=en&hang=1'

        export async function loadWishes(signal) {
          const url = `${BASE_URL}/records/wishlist${QUERY}`;
          console.log('GET', url);
          const response = await fetch(url, { signal }); // no timeout
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        }
        ```

        **Step 3 — `App.tsx`** (replace the whole file with it):

        ```tsx
        // RN-06 lab screen: shows what loadWishes() in data.js returns, or why it failed.
        import { useEffect, useState } from 'react';
        import { Pressable, StyleSheet, Text, View } from 'react-native';
        import { loadWishes } from './data.js';

        type Wish = { id: string; name: string };
        type ScreenState = { status: 'loading' | 'ready' | 'error'; wishes: Wish[]; problem?: string };

        export default function App() {
          const [state, setState] = useState<ScreenState>({ status: 'loading', wishes: [] });
          const [round, setRound] = useState(0);

          useEffect(() => {
            const controller = new AbortController();
            setState((s) => ({ ...s, status: 'loading' }));
            loadWishes(controller.signal).then(
              (wishes: Wish[]) => setState({ status: 'ready', wishes }),
              (error: Error) => {
                if (error.name === 'AbortError') return;
                console.log('load failed:', error.name, error.message);
                setState((s) => ({ ...s, status: 'error', problem: `${error.name}: ${error.message}` }));
              },
            );
            return () => controller.abort();
          }, [round]);

          return (
            <View style={styles.screen}>
              <Text style={styles.heading}>Wishlist</Text>
              {state.status === 'loading' && <Text>Loading…</Text>}
              {state.status === 'error' && <Text style={styles.problem}>{state.problem}</Text>}
              {state.wishes.map((wish) => <Text key={wish.id}>{wish.name}</Text>)}
              <Pressable accessibilityRole="button" onPress={() => setRound((n) => n + 1)} style={styles.button}>
                <Text style={styles.buttonText}>Reload</Text>
              </Pressable>
            </View>
          );
        }

        const styles = StyleSheet.create({
          screen: { flex: 1, paddingTop: 64, paddingHorizontal: 16, gap: 8, backgroundColor: '#ffffff' },
          heading: { fontSize: 20, fontWeight: '600' },
          problem: { color: '#b91c1c' },
          button: { alignSelf: 'flex-start', marginTop: 8, padding: 12, borderRadius: 6, backgroundColor: '#1d4ed8' },
          buttonText: { color: '#ffffff', fontWeight: '600' },
        });
        ```

        **Step 7 — the repaired `BASE_URL` line in `data.js`:**

        ```js
        // Android emulator: the host alias. iOS simulator, or a USB phone after adb reverse: 127.0.0.1.
        const BASE_URL = Platform.OS === 'android' ? 'http://10.0.2.2:7310' : 'http://127.0.0.1:7310';
        ```

        and as the file's first line, `import { Platform } from 'react-native';`. For an Android phone on a cable run `adb reverse tcp:7310 tcp:7310` first and write `'http://127.0.0.1:7310'` for both platforms. A phone on Wi-Fi: the computer's LAN address and the service started with `--host 0.0.0.0` (see the host-address lesson).

        **Step 9 — `data.js` with a timeout and retries** (replace the whole file with it; `retry.js` and `wait.js` sit next to it):

        ```js
        // RN-06 data source, repaired: a host per target, a timeout and bounded retry.
        import { Platform } from 'react-native';
        import { fetchWithRetry } from './retry.js';

        // Android emulator: the host alias. iOS simulator, or a USB phone after adb reverse: 127.0.0.1.
        const BASE_URL = Platform.OS === 'android' ? 'http://10.0.2.2:7310' : 'http://127.0.0.1:7310';
        const QUERY = '?lang=en&hang=1';

        export async function loadWishes(signal) {
          const url = `${BASE_URL}/records/wishlist${QUERY}`;
          console.log('GET', url);
          const response = await fetchWithRetry(url, { fetchFn: fetch, timeoutMs: 3000, maxAttempts: 3, baseDelayMs: 500, signal });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        }
        ```
