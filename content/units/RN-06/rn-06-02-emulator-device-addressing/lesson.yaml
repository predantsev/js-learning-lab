id: rn-06-02-emulator-device-addressing
unit: RN-06
title:
  uk: "Адреса хоста з емулятора й пристрою"
  en: "Emulator/device addressing"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Передбачати, куди вказує `localhost` з емулятора Android, симулятора iOS і фізичного телефона, і вибирати правильну адресу хоста для кожного."
    en: "Predict where 'localhost' points from an Android emulator, an iOS simulator and a physical device, and choose the right host address for each."
  - uk: "Тримати базову адресу mock-сервісу в одному значенні конфігурації для кожної цілі, а не вписувати хост у запити."
    en: "Keep the mock-service base URL in one per-target config value instead of hard-coding it in requests."
  - uk: "Пояснювати, чому на нативний fetch не діють браузерні правила CORS, і що це змінює, а що — ні."
    en: "Explain why native fetch is not subject to browser CORS rules and what that does and does not change."
prerequisites: [rn-06-01-fixtures-mock-service, rn-01-02-toolchain-setup]
subskills:
  - { family: N-06, skill: "emulator/device addressing", depth: intro }
glossary: [emulator-host-alias, port-reverse, lan-address]
selfCheck: [predict-localhost, habit-config]

blocks:
  - id: localhost-is-here
    kind: explanation
    title:
      uk: "`localhost` — це «цей пристрій», а не «мій комп’ютер»"
      en: "`localhost` means “this device”, not “my computer”"
    body:
      uk: |
        Mock-сервіс слухає на твоєму комп’ютері адресу `127.0.0.1:7310` — loopback, тобто «цей самий пристрій». `curl` з того ж комп’ютера до нього дістається. А застосунок?

        | Ціль | Що для неї `localhost` | Як дістатися сервісу |
        |---|---|---|
        | емулятор Android | сам емулятор — окрема віртуальна машина | [[emulator-host-alias\|адреса-псевдонім]] `10.0.2.2` = loopback комп’ютера |
        | симулятор iOS | комп’ютер: симулятор — програма на Mac і ділить з ним мережу | `127.0.0.1` чи `localhost` |
        | телефон Android через USB | сам телефон | `adb reverse tcp:7310 tcp:7310` ([[port-reverse\|перенаправлення порту]]), далі `127.0.0.1` |
        | будь-який телефон через Wi-Fi | сам телефон | [[lan-address\|LAN-адреса]] комп’ютера (`192.168.…`) — і сервіс, запущений з `--host 0.0.0.0` |

        `adb reverse` — команда інструментів Android; для iPhone, навіть під’єднаного кабелем, лишається останній рядок.

        Останній рядок — свідоме рішення: з `--host 0.0.0.0` сервіс бачать **усі** пристрої твоєї мережі, тож запускай його так лише на час перевірки й зупиняй після.

        Те, що адреса відкривається в браузері комп’ютера, нічого не каже про телефон: браузер працює на тому самому комп’ютері, що й сервіс.
      en: |
        The mock service listens on your computer at `127.0.0.1:7310` — loopback, meaning “this very device”. `curl` on the same computer reaches it. And the app?

        | Target | What `localhost` means there | How to reach the service |
        |---|---|---|
        | Android emulator | the emulator itself — a separate virtual machine | the [[emulator-host-alias\|alias address]] `10.0.2.2` = the computer's loopback |
        | iOS simulator | the computer: the simulator is a program on the Mac and shares its network | `127.0.0.1` or `localhost` |
        | Android phone over USB | the phone itself | `adb reverse tcp:7310 tcp:7310` ([[port-reverse\|port reverse]]), then `127.0.0.1` |
        | any phone over Wi-Fi | the phone itself | the computer's [[lan-address\|LAN address]] (`192.168.…`) — and the service started with `--host 0.0.0.0` |

        `adb reverse` is an Android tool command; an iPhone, even on a cable, uses the last row.

        The last row is a deliberate decision: with `--host 0.0.0.0` **every** device on your network sees the service, so start it that way only for the check and stop it afterwards.

        That the address opens in your computer's browser says nothing about the phone: the browser runs on the same computer as the service.

  - id: predict-localhost
    kind: prediction
    prompt:
      uk: "Mock-сервіс слухає лише loopback комп’ютера (`127.0.0.1:7310`). Застосунок надсилає запит на `http://localhost:7310/records/planner` з трьох цілей: емулятора Android, симулятора iOS і телефона Android, під’єднаного кабелем USB (без `adb reverse`). Де запит дійде до сервісу?"
      en: "The mock service listens only on the computer's loopback (`127.0.0.1:7310`). The app sends a request to `http://localhost:7310/records/planner` from three targets: an Android emulator, an iOS simulator and an Android phone connected by USB (without `adb reverse`). Where does the request reach the service?"
    runnable: false
    answer:
      type: choice
      options:
        - id: ios-only
          text:
            uk: "Лише із симулятора iOS"
            en: "Only from the iOS simulator"
        - id: all
          text:
            uk: "З усіх трьох: `localhost` — це мій комп’ютер"
            en: "From all three: `localhost` is my computer"
          why:
            uk: "`localhost` завжди означає пристрій, на якому працює код. Емулятор і телефон — окремі пристрої зі своїм loopback, де на порту 7310 ніхто не слухає."
            en: "`localhost` always means the device the code runs on. The emulator and the phone are separate devices with their own loopback, where nothing listens on port 7310."
        - id: usb-too
          text:
            uk: "Із симулятора iOS і з телефона на кабелі: кабель з’єднує його з комп’ютером"
            en: "From the iOS simulator and from the phone on the cable: the cable connects it to the computer"
          why:
            uk: "Кабель сам по собі запитів не пересилає. Порт телефона з’єднує з портом комп’ютера лише `adb reverse`."
            en: "The cable on its own forwards no requests. Only `adb reverse` connects a port of the phone to a port of the computer."
        - id: emulator-too
          text:
            uk: "Із симулятора iOS і з емулятора Android: обидва працюють на комп’ютері"
            en: "From the iOS simulator and from the Android emulator: both run on the computer"
          why:
            uk: "Емулятор Android — віртуальна машина з власною мережею. Його `localhost` — він сам; комп’ютер для нього — `10.0.2.2`."
            en: "The Android emulator is a virtual machine with its own network. Its `localhost` is itself; the computer is `10.0.2.2` to it."
      correct: [ios-only]
    explanation:
      uk: "Симулятор iOS ділить мережу з Mac, тож його `localhost` — комп’ютер. Емулятор Android доходить до комп’ютера через `10.0.2.2`, телефон на кабелі — після `adb reverse`, телефон у Wi-Fi — через LAN-адресу. Ці правила описують документація емулятора Android і React Native; на пристроях під час підготовки уроку їх не перевіряли."
      en: "The iOS simulator shares the Mac's network, so its `localhost` is the computer. The Android emulator reaches the computer through `10.0.2.2`, the phone on a cable after `adb reverse`, a phone on Wi-Fi through the LAN address. These rules come from the Android emulator and React Native documentation; they were not checked on devices while preparing this lesson."

  - id: hop-by-hop
    kind: visual
    visual: sequence
    title:
      uk: "Один запит — чотири цілі"
      en: "One request, four targets"
    textEquivalent:
      uk: "Застосунок на емуляторі Android шле запит на localhost:7310 і отримує Network request failed: localhost — це сам емулятор. Той самий запит на 10.0.2.2:7310 емулятор передає на loopback комп’ютера, і сервіс відповідає 200. Симулятор iOS шле запит на localhost:7310, і він одразу потрапляє на комп’ютер, бо симулятор ділить з ним мережу. Телефон на кабелі USB без adb reverse отримує помилку; після adb reverse tcp:7310 tcp:7310 його localhost:7310 пересилається на комп’ютер. Телефон у Wi-Fi шле запит на LAN-адресу комп’ютера, і він доходить, лише коли сервіс запущено з --host 0.0.0.0."
      en: "The app on an Android emulator sends a request to localhost:7310 and gets Network request failed: localhost is the emulator itself. The same request to 10.0.2.2:7310 is passed by the emulator to the computer's loopback, and the service answers 200. The iOS simulator sends a request to localhost:7310, and it lands on the computer at once, because the simulator shares its network. A phone on a USB cable without adb reverse gets an error; after adb reverse tcp:7310 tcp:7310 its localhost:7310 is forwarded to the computer. A phone on Wi-Fi sends the request to the computer's LAN address, and it arrives only when the service was started with --host 0.0.0.0."
    spec:
      actors:
        - { id: app, label: { uk: "Застосунок", en: "App" } }
        - { id: device, label: { uk: "Мережа цілі", en: "Target network" } }
        - { id: computer, label: { uk: "Комп’ютер :7310", en: "Computer :7310" } }
      messages:
        - from: app
          to: device
          label: "GET localhost:7310"
          caption:
            uk: "**Емулятор Android:** запит на `localhost` лишається всередині емулятора — там на порту 7310 нікого немає."
            en: "**Android emulator:** a request to `localhost` stays inside the emulator — nothing is on port 7310 there."
        - from: device
          to: app
          kind: return
          label: "Network request failed"
          caption:
            uk: "`fetch` React Native відхиляється з `TypeError: Network request failed`. Сервіс про цей запит нічого не знає — у його журналі рядка немає."
            en: "React Native's `fetch` rejects with `TypeError: Network request failed`. The service knows nothing of this request — there is no line in its log."
        - from: app
          to: computer
          label: "GET 10.0.2.2:7310"
          caption:
            uk: "Через псевдонім `10.0.2.2` емулятор передає запит на loopback комп’ютера."
            en: "Through the alias `10.0.2.2` the emulator passes the request to the computer's loopback."
        - from: computer
          to: app
          kind: return
          label: "200 [ … ]"
          caption:
            uk: "Сервіс відповідає 200, а в його журналі з’являється рядок з адресою `127.0.0.1`."
            en: "The service answers 200, and a line with the address `127.0.0.1` appears in its log."
        - from: app
          to: computer
          label: "GET localhost:7310 (iOS)"
          caption:
            uk: "**Симулятор iOS** ділить мережу з Mac, тож його `localhost` — уже комп’ютер."
            en: "**The iOS simulator** shares the Mac's network, so its `localhost` already is the computer."
        - from: app
          to: device
          label: "GET localhost:7310 (USB)"
          caption:
            uk: "**Телефон на кабелі:** без `adb reverse` його `localhost` — він сам, і запит падає так само, як на емуляторі."
            en: "**Phone on a cable:** without `adb reverse` its `localhost` is itself, and the request fails just as on the emulator."
        - from: device
          to: computer
          label: "adb reverse tcp:7310 tcp:7310"
          caption:
            uk: "Після `adb reverse tcp:7310 tcp:7310` порт 7310 телефона пересилається на порт 7310 комп’ютера, і той самий `localhost` спрацьовує."
            en: "After `adb reverse tcp:7310 tcp:7310` the phone's port 7310 is forwarded to the computer's port 7310, and the same `localhost` works."
        - from: app
          to: computer
          label: "GET 192.168.1.20:7310 (Wi-Fi)"
          note: { uk: "лише якщо сервіс запущено з --host 0.0.0.0", en: "only if the service runs with --host 0.0.0.0" }
          caption:
            uk: "**Телефон у Wi-Fi** звертається до LAN-адреси комп’ютера. Сервіс, що слухає лише loopback, такого з’єднання не прийме."
            en: "**A phone on Wi-Fi** addresses the computer's LAN address. A service that listens only on loopback does not accept such a connection."

  - id: no-cors-here
    kind: explanation
    title:
      uk: "А CORS?"
      en: "And CORS?"
    body:
      uk: |
        Правила same-origin і CORS виконує **браузер**: він не віддає коду сторінки відповідь з іншого походження, якщо сервер цього не дозволив заголовками. Застосунок React Native — не сторінка в браузері: у нього немає походження, і ніхто не перевіряє заголовки CORS. `fetch` у React Native передає запит мережевому клієнту платформи (OkHttp на Android, `NSURLSession` в iOS — так у вихідному коді react-native 0.86.3), а той про походження нічого не знає.

        Що це **не** змінює:

        - адреса й досяжність лишаються твоїм завданням — саме вони ламаються найчастіше;
        - CORS ніколи не захищав сервер: будь-який застосунок чи `curl` надсилає запити напряму, тож сервер сам перевіряє, хто й що може робити (це буде в розділі Node.js);
        - якщо той самий код запустити як веб-версію (наприклад, через react-native-web у браузері), правила CORS знову діють.
      en: |
        The same-origin and CORS rules are enforced by the **browser**: it does not hand a page's code a response from another origin unless the server allowed it with headers. A React Native app is not a page in a browser: it has no origin, and nobody checks CORS headers. `fetch` in React Native hands the request to the platform's network client (OkHttp on Android, `NSURLSession` on iOS — so in react-native 0.86.3's source), and that client knows nothing about origins.

        What this does **not** change:

        - the address and reachability stay your job — they are what breaks most often;
        - CORS never protected the server: any app or `curl` sends requests directly, so the server itself checks who may do what (that comes in the Node.js stage);
        - if the same code runs as a web version (for example, through react-native-web in a browser), the CORS rules apply again.

  - id: recall-cors
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: who-enforces-cors
        from: js-16-04-same-origin-cors
        prompt:
          uk: "Сторінка з `http://localhost:5173` робить `fetch` на `http://localhost:7310/records`. Сервер відповідає 200, але без заголовка `Access-Control-Allow-Origin`. Що відбувається?"
          en: "A page from `http://localhost:5173` calls `fetch` on `http://localhost:7310/records`. The server answers 200 but without an `Access-Control-Allow-Origin` header. What happens?"
        answer:
          type: choice
          options:
            - id: browser-hides
              text:
                uk: "Запит доходить до сервера, але браузер не віддає відповідь коду сторінки: `fetch` відхиляється з `TypeError`"
                en: "The request reaches the server, but the browser does not hand the answer to the page's code: `fetch` rejects with a `TypeError`"
            - id: server-refuses
              text:
                uk: "Сервер відмовляється обробляти запит з іншого порту"
                en: "The server refuses to handle a request from another port"
              why:
                uk: "Сервер обробив запит і відповів 200. Блокує відповідь браузер, бо в ній немає дозволу CORS."
                en: "The server handled the request and answered 200. The browser blocks the answer, because it has no CORS permission."
            - id: same-host
              text:
                uk: "Усе працює: хост той самий, `localhost`"
                en: "It all works: the host is the same, `localhost`"
              why:
                uk: "Походження — це схема, хост **і порт**. 5173 і 7310 — різні походження."
                en: "An origin is the scheme, the host **and the port**. 5173 and 7310 are different origins."
          correct: [browser-hides]
        explanation:
          uk: "CORS — правило браузера, яке він застосовує до відповіді. Саме тому застосунок React Native, де браузера немає, цього блокування не має."
          en: "CORS is a browser rule it applies to the response. That is exactly why a React Native app, which has no browser, has no such blocking."

  - id: request-log
    kind: example
    runtime: concept-preview
    dir: request-log
    entry: main.jsx
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      records: { uk: "записи", en: "records" }
      target: { uk: "Ціль", en: "Target" }
    title:
      uk: "Одна адреса для всіх цілей"
      en: "One address for every target"
    body:
      uk: |
        `targetSim.js` симулює мережу чотирьох цілей за правилами з таблиці: він вирішує, чи дійде запит до сервісу на комп’ютері, і якщо ні — відхиляється з тією самою помилкою, що й `fetch` React Native. У `main.jsx` адреса записана однією константою `BASE_URL`.

        Натисни **Запустити**: із симулятора iOS запит на `localhost` проходить.
      en: |
        `targetSim.js` simulates the network of four targets by the rules from the table: it decides whether a request reaches the service on the computer and, if not, rejects with the same error as React Native's `fetch`. In `main.jsx` the address is written as one constant, `BASE_URL`.

        Press **Run**: from the iOS simulator the request to `localhost` goes through.
    tryIt:
      uk: |
        1. Зміни `SIMULATED_TARGET` на `'android-emulator'` і запусти: `TypeError: Network request failed`.
        2. Зміни `BASE_URL` на `'http://10.0.2.2:7310'` і запусти: емулятор отримує записи.
        3. Не змінюючи `BASE_URL`, поверни `SIMULATED_TARGET` на `'ios-simulator'` і запусти: тепер падає симулятор. Одна константа не підходить усім цілям — адресу треба вибирати за ціллю.
      en: |
        1. Change `SIMULATED_TARGET` to `'android-emulator'` and run: `TypeError: Network request failed`.
        2. Change `BASE_URL` to `'http://10.0.2.2:7310'` and run: the emulator gets the records.
        3. Without changing `BASE_URL`, put `SIMULATED_TARGET` back to `'ios-simulator'` and run: now the simulator fails. One constant does not suit every target — the address must be chosen per target.
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не нативний застосунок. Справжніх запитів тут немає: `targetSim.js` лише застосовує правила досяжності з документації емулятора Android і React Native. Чи доходить запит насправді — залежить від твоєї цілі, брандмауера й мережі, і це перевіряють на заявленій цілі з запущеним mock-сервісом."
      en: "This is a browser preview through react-native-web, not a native app. There are no real requests here: `targetSim.js` only applies the reachability rules from the Android emulator and React Native documentation. Whether a request really arrives depends on your target, firewall and network, and that is checked on your declared target with the mock service running."

  - id: habit-config
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: habit-config
    entry: main.jsx
    editable: [devConfig.js]
    strings:
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      water: { uk: "Пити воду", en: "Drink water" }
      habits: { uk: "звички завантажено", en: "habits loaded" }
    title:
      uk: "Адреса mock-сервісу для кожної цілі"
      en: "The mock service address for each target"
    instructions:
      uk: |
        Джерело звичок у `source.js` не знає жодного хоста: базову адресу воно бере з `mockBaseUrl(target)` у `devConfig.js`. Допиши цю функцію:

        - `'android-emulator'` → адреса, через яку емулятор бачить loopback комп’ютера, **без** `adb reverse`;
        - `'ios-simulator'` і `'android-usb'` (з уже виконаним `adb reverse`) → loopback (`localhost` чи `127.0.0.1`);
        - `'phone-wifi'` → `LAN_ADDRESS`;
        - порт — завжди `MOCK_PORT`, без скісної риски в кінці;
        - для невідомої цілі (наприклад, з одруківкою) функція **кидає помилку**, а не вгадує адресу.

        Перегляд показує, скільки звичок завантажила кожна ціль.
      en: |
        The habits source in `source.js` knows no host: it takes the base address from `mockBaseUrl(target)` in `devConfig.js`. Complete that function:

        - `'android-emulator'` → the address through which the emulator sees the computer's loopback, **without** `adb reverse`;
        - `'ios-simulator'` and `'android-usb'` (with `adb reverse` already done) → loopback (`localhost` or `127.0.0.1`);
        - `'phone-wifi'` → `LAN_ADDRESS`;
        - the port is always `MOCK_PORT`, with no trailing slash;
        - for an unknown target (for example, with a typo) the function **throws an error** rather than guessing an address.

        The preview shows how many habits each target loaded.
    limits:
      uk: "Перевірки застосовують правила досяжності з `targetSim.js`, а не справжню мережу емулятора чи телефона. Що твоя ціль справді дістається mock-сервісу, перевіряють локально — у завданні уроку з налагодження адреси хоста."
      en: "The checks apply the reachability rules from `targetSim.js`, not a real emulator or phone network. That your target really reaches the mock service is checked locally — in the task of the host-address debugging lesson."
    testTitles:
      "the Android emulator reaches the computer without adb reverse":
        uk: "Емулятор Android дістається комп’ютера без `adb reverse`"
        en: "The Android emulator reaches the computer without `adb reverse`"
      "the iOS simulator and the USB phone use the loopback address":
        uk: "Симулятор iOS і телефон на USB використовують loopback"
        en: "The iOS simulator and the USB phone use the loopback address"
      "a phone over Wi-Fi uses the LAN address":
        uk: "Телефон у Wi-Fi використовує `LAN_ADDRESS`"
        en: "A phone over Wi-Fi uses `LAN_ADDRESS`"
      "an unknown target throws an error instead of guessing":
        uk: "Невідома ціль кидає помилку, а не вгадує адресу"
        en: "An unknown target throws an error instead of guessing"
    hints:
      nudge:
        uk: "Для кожної цілі спитай себе: що для неї означає `localhost` — комп’ютер чи вона сама? Таблиця на початку уроку відповідає на це для всіх чотирьох."
        en: "For each target ask yourself: what does `localhost` mean there — the computer or the target itself? The table at the start of the lesson answers this for all four."
      explanation:
        uk: "Адресу зручно тримати в об’єкті «ціль → хост» і будувати з нього `http://${host}:${port}`. Так само, наприклад, вибирають валюту за країною: `{ ua: 'UAH', pl: 'PLN' }[country]`. Якщо ключа немає, об’єкт дає `undefined` — саме тут і треба кинути помилку, щоб одруківка не перетворилася на тихий запит не туди."
        en: "It is convenient to keep the addresses in a “target → host” object and build `http://${host}:${port}` from it. A currency is picked by country the same way: `{ ua: 'UAH', pl: 'PLN' }[country]`. When the key is missing the object gives `undefined` — that is exactly where to throw an error, so a typo does not turn into a quiet request to the wrong place."
    solutionNote:
      uk: "Хост залежить від цілі, а порт і шлях — ні. Тому джерело даних у `source.js` не змінюється, коли ти переходиш з емулятора на телефон: змінюється одне значення конфігурації. Помилка для невідомої цілі ловить одруківку одразу, а не через загадковий `Network request failed`."
      en: "The host depends on the target, the port and path do not. So the data source in `source.js` does not change when you move from the emulator to a phone: one config value changes. The error for an unknown target catches a typo at once, not through a mysterious `Network request failed`."
    feedback:
      - when: { test: "the Android emulator reaches the computer without adb reverse" }
        message:
          uk: "Ця перевірка чекає `http://10.0.2.2:7310` для `'android-emulator'` і завантаження звичок без `adb reverse`. `localhost` в емуляторі — сам емулятор, а не комп’ютер."
          en: "This check expects `http://10.0.2.2:7310` for `'android-emulator'` and the habits to load without `adb reverse`. `localhost` in the emulator is the emulator itself, not the computer."
      - when: { test: "the iOS simulator and the USB phone use the loopback address" }
        message:
          uk: "Ця перевірка чекає для `'ios-simulator'` і `'android-usb'` рівно `http://localhost:7310` чи `http://127.0.0.1:7310` — без скісної риски в кінці — і що обидві цілі завантажують звички. Якщо всі перевірки падають разом, спершу виправ першу помилку в консолі."
          en: "This check expects exactly `http://localhost:7310` or `http://127.0.0.1:7310` — with no trailing slash — for `'ios-simulator'` and `'android-usb'`, and both targets to load the habits. If every check fails at once, fix the first error in the console first."
      - when: { test: "a phone over Wi-Fi uses the LAN address" }
        message:
          uk: "Ця перевірка чекає `http://` + `LAN_ADDRESS` + `:7310` для `'phone-wifi'`. Телефон у Wi-Fi бачить комп’ютер лише за його адресою в мережі."
          en: "This check expects `http://` + `LAN_ADDRESS` + `:7310` for `'phone-wifi'`. A phone on Wi-Fi sees the computer only at its address in the network."
      - when: { test: "an unknown target throws an error instead of guessing" }
        message:
          uk: "Ця перевірка викликає `mockBaseUrl('android-emulater')` з одруківкою й чекає, що функція кине помилку. Адреса за замовчуванням тут сховала б одруківку за помилкою мережі."
          en: "This check calls `mockBaseUrl('android-emulater')` with a typo and expects the function to throw. A default address here would hide the typo behind a network error."

  - id: to-project
    kind: transfer
    capstoneStep: RN-06
    body:
      uk: "У кроці проєкту ти додаси в `~/js-course/<проєкт>-native` такий самий модуль конфігурації (`src/devConfig.ts`): базова адреса mock-сервісу для твоєї заявленої цілі, а джерело записів бере її звідти. Жоден запит проєкту не міститиме хоста напряму."
      en: "In the project step you add the same kind of config module in `~/js-course/<project>-native` (`src/devConfig.ts`): the mock service's base address for your declared target, and the records source takes it from there. No request in the project will contain a host directly."
