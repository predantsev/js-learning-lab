id: rn-06-04-offline-error-state
unit: RN-06
title:
  uk: "Стан офлайну й помилок"
  en: "Offline and error state"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Розрізняти офлайн, тайм-аут, помилку сервера й неправильну відповідь і давати кожному чесне локалізоване повідомлення з правильною наступною дією."
    en: "Distinguish offline, timeout, server error and invalid response, and give each an honest, localized message with the right next action."
  - uk: "Коли мережа підвела, далі показувати останні завантажені чи вбудовані дані з їхнім віком, а не порожній список."
    en: "Keep showing the last loaded or bundled data with its age when the network fails, instead of an empty list."
prerequisites: [rn-06-03-fetch-cancel-timeout-retry, rn-05-04-offline-cache-authority]
subskills:
  - { family: N-06, skill: "offline/error state", depth: intro }
glossary: [network-reachability]
selfCheck: [predict-failure-states, status-banner]

blocks:
  - id: four-failures
    kind: explanation
    title:
      uk: "Чотири різні збої — чотири різні повідомлення"
      en: "Four different failures, four different messages"
    body:
      uk: |
        «Щось пішло не так» нічого не каже людині. Збої мережі різні, і в кожного своя наступна дія:

        | Збій | Як його видно в коді | Що допомагає |
        |---|---|---|
        | **офлайн** — сервера не досягти | `fetch` відхиляється з `TypeError: Network request failed` | показати збережені чи вбудовані дані; політика вже повторила запит у межах бюджету, тож ще одна спроба зараз дасть те саме — повтори, коли зв’язок повернеться |
        | **тайм-аут** | твій `fetchWithRetry` відхиляється з `TimeoutError` | спробувати ще |
        | **помилка сервера** | `response.status` 500–599 | спробувати ще |
        | **неправильна відповідь** | статус 200, але тіло не проходить перевірку під час виконання | показати вбудовані дані: те саме зламане тіло прийде знову |

        І головне: збій мережі — не привід **стирати** те, що вже є. Останні завантажені дані лишаються на екрані з позначкою віку («оновлено 5 хв тому»), а банер над ними пояснює, що сталося.
      en: |
        “Something went wrong” tells a person nothing. Network failures differ, and each has its own next action:

        | Failure | How the code sees it | What helps |
        |---|---|---|
        | **offline** — the server cannot be reached | `fetch` rejects with `TypeError: Network request failed` | show saved or bundled data; the policy already retried within its budget, so one more attempt now gives the same — retry when the connection is back |
        | **timeout** | your `fetchWithRetry` rejects with `TimeoutError` | try again |
        | **server error** | `response.status` 500–599 | try again |
        | **invalid answer** | status 200, but the body fails runtime validation | show bundled data: the same broken body would come again |

        And the main thing: a network failure is no reason to **erase** what is already there. The last loaded data stays on screen with its age (“updated 5 min ago”), and a banner above it explains what happened.

  - id: online-is-a-hint
    kind: explanation
    title:
      uk: "«Онлайн» — лише підказка"
      en: "“Online” is only a hint"
    body:
      uk: |
        Застосунок може спитати систему про мережу — наприклад, `getNetworkStateAsync()` з бібліотеки `expo-network` повертає `isConnected` та `isInternetReachable` (за документацією Expo; на пристрої під час підготовки уроку не перевірено). Це [[network-reachability|досяжність мережі]], а не досяжність **твого** сервера.

        «Онлайн» не гарантує, що запит пройде: сервіс зупинено, адреса хоста неправильна, Wi-Fi у кафе ще вимагає входу. Тому відповідь дає лише сам запит. Інформацію про мережу використовуй, щоб краще пояснити збій («ти офлайн» проти «сервер не відповідає») чи щоб повторити запит, коли мережа повернулася, — але не замість обробки помилки.
      en: |
        The app can ask the system about the network — for example, `getNetworkStateAsync()` from the `expo-network` library returns `isConnected` and `isInternetReachable` (per Expo's documentation; not checked on a device while preparing this lesson). That is [[network-reachability|network reachability]], not the reachability of **your** server.

        “Online” does not guarantee the request will succeed: the service is stopped, the host address is wrong, the café Wi-Fi still wants a sign-in. So only the request itself gives the answer. Use network information to explain a failure better (“you are offline” versus “the server does not answer”) or to retry when the network comes back — but not instead of handling the error.

  - id: screen-states
    kind: visual
    visual: diagram
    title:
      uk: "Стани екрана списку"
      en: "The list screen's states"
    textEquivalent:
      uk: "Екран починає зі стану завантаження. Успішна відповідь, що пройшла перевірку, веде до свіжих даних. Помилка мережі веде до офлайну, тайм-аут чи 5xx — до помилки сервера, а тіло, що не пройшло перевірку, — до неправильної відповіді. З кожного стану збою екран показує останні дані з їхнім віком, а не порожній список. Офлайн і неправильна відповідь пропонують вбудовані дані, помилка сервера — повтор."
      en: "The screen starts in the loading state. A successful answer that passes validation leads to fresh data. A network error leads to offline, a timeout or 5xx to server error, and a body that fails validation to invalid answer. From every failure state the screen shows the last data with its age, not an empty list. Offline and invalid answer offer the bundled data, server error offers a retry."
    spec:
      layout: grid
      nodes:
        - { id: loading, label: { uk: "завантаження", en: "loading" }, shape: round, col: 0, row: 0, w: 150 }
        - { id: fresh, label: { uk: "свіжі дані", en: "fresh data" }, shape: round, col: 0, row: 1, w: 150 }
        - { id: stale, label: { uk: "останні дані + вік", en: "last data + age" }, shape: round, col: 0, row: 3, w: 150 }
        - { id: offline, label: { uk: "офлайн", en: "offline" }, col: 1, row: 0, w: 160 }
        - { id: server, label: { uk: "тайм-аут / 5xx", en: "timeout / 5xx" }, col: 1, row: 1, w: 160 }
        - { id: invalid, label: { uk: "неправильна відповідь", en: "invalid answer" }, col: 1, row: 2, w: 160 }
      edges:
        - { id: ok, from: loading, to: fresh, label: { uk: "200 + перевірку пройдено", en: "200 + valid" } }
        - { id: to-offline, from: loading, to: offline }
        - { id: to-server, from: loading, to: server }
        - { id: to-invalid, from: loading, to: invalid }
        - { id: offline-stale, from: offline, to: stale, kind: dashed }
        - { id: server-stale, from: server, to: stale, kind: dashed }
        - { id: invalid-stale, from: invalid, to: stale, kind: dashed }
      steps:
        - highlight: [loading]
          caption:
            uk: "Запит іде: екран у стані завантаження."
            en: "The request is on its way: the screen is loading."
        - highlight: [fresh, ok]
          caption:
            uk: "Статус 200 і тіло пройшло перевірку — свіжі дані, вік обнуляється."
            en: "Status 200 and the body passed validation — fresh data, the age resets."
        - highlight: [offline, to-offline, stale, offline-stale]
          annotate:
            - { id: offline, text: { uk: "вбудовані дані", en: "bundled data" } }
          caption:
            uk: "`Network request failed` — офлайн. Список лишається: останні дані з віком, а банер пропонує вбудовані дані."
            en: "`Network request failed` — offline. The list stays: the last data with its age, and the banner offers the bundled data."
        - highlight: [server, to-server, stale, server-stale]
          annotate:
            - { id: server, text: { uk: "спробувати ще", en: "try again" } }
          caption:
            uk: "Тайм-аут чи 5xx після всіх спроб — помилка сервера. Останні дані на місці, банер пропонує спробувати ще."
            en: "A timeout or 5xx after all attempts — server error. The last data stays, the banner offers to try again."
        - highlight: [invalid, to-invalid, stale, invalid-stale]
          annotate:
            - { id: invalid, text: { uk: "вбудовані дані", en: "bundled data" } }
          caption:
            uk: "200, але тіло не пройшло перевірку — неправильна відповідь. Зламані дані на екран не потрапляють, а повтор дав би те саме."
            en: "A 200, but the body failed validation — invalid answer. The broken data never reaches the screen, and a retry would give the same."
        - highlight: [stale]
          caption:
            uk: "Хоч би що сталося, екран не порожніє: людина бачить останні дані й знає, наскільки вони старі."
            en: "Whatever happened, the screen does not go empty: the person sees the last data and knows how old it is."

  - id: predict-failure-states
    kind: prediction
    prompt:
      uk: "На екрані витрат уже є список, завантажений 10 хвилин тому. Наступне оновлення закінчується так: (а) телефон у режимі польоту; (б) тайм-аут після всіх спроб; (в) статус 500; (г) статус 200 з тілом `{\"records\":\"not-a-list\"}`. Що має показати добре зроблений екран?"
      en: "The expenses screen already shows a list loaded 10 minutes ago. The next refresh ends like this: (a) the phone is in airplane mode; (b) a timeout after all attempts; (c) status 500; (d) status 200 with the body `{\"records\":\"not-a-list\"}`. What should a well-made screen show?"
    runnable: false
    answer:
      type: choice
      options:
        - id: keep
          text:
            uk: "У всіх чотирьох — той самий список з віком «10 хв тому» і банер: (а) офлайн → вбудовані дані, (б) і (в) → спробувати ще, (г) неправильна відповідь → вбудовані дані"
            en: "In all four — the same list aged “10 min ago” and a banner: (a) offline → bundled data, (b) and (c) → try again, (d) invalid answer → bundled data"
        - id: clear
          text:
            uk: "У всіх чотирьох — порожній список і повідомлення про помилку: старим даним уже не можна вірити"
            en: "In all four — an empty list and an error message: the old data can no longer be trusted"
          why:
            uk: "Дані десятихвилинної давності корисніші за порожній екран, якщо людина бачить їхній вік. Стерти їх — означає покарати користувача за збій мережі."
            en: "Ten-minute-old data is more useful than an empty screen when the person sees its age. Erasing it punishes the user for a network failure."
        - id: show-body
          text:
            uk: "(а)–(в) — список з віком; (г) — нові дані з відповіді, адже статус 200"
            en: "(a)–(c) — the list with its age; (d) — the new data from the answer, since the status is 200"
          why:
            uk: "Статус 200 каже лише, що сервер відповів. Тіло не пройшло перевірку — показувати його не можна, інакше екран зламається чи покаже нісенітницю."
            en: "Status 200 only says the server answered. The body failed validation — it must not be shown, or the screen breaks or shows nonsense."
      correct: [keep]
    explanation:
      uk: "Збій змінює банер, а не дані. Кожен вид збою отримує своє пояснення й дію, а список з віком лишається, доки не прийдуть нові правильні дані."
      en: "A failure changes the banner, not the data. Each kind of failure gets its own explanation and action, and the list with its age stays until new valid data arrives."

  - id: recall-authority
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: offline-authority
        from: rn-05-04-offline-cache-authority
        prompt:
          uk: "Телефон офлайн, і користувач позначає справу виконаною. Що є джерелом істини для цієї справи, доки зв’язку немає?"
          en: "The phone is offline, and the user marks a task as done. What is the source of truth for that task while there is no connection?"
        answer:
          type: choice
          options:
            - id: device
              text:
                uk: "Сховище на пристрої"
                en: "The store on the device"
            - id: server
              text:
                uk: "Сервер: те, що на пристрої, — лише копія"
                en: "The server: what is on the device is only a copy"
              why:
                uk: "У проєкті поки немає сервера, який зберігав би записи: зміна живе лише у сховищі на пристрої, і саме воно — джерело істини. Сервер стане ним лише з NO-06."
                en: "The project has no server that keeps records yet: the change lives only in the device store, and that store is the authority. A server becomes one only from NO-06."
            - id: none
              text:
                uk: "Ніщо: офлайн зміни не можна зберігати"
                en: "Nothing: changes cannot be kept offline"
              why:
                uk: "Нативний застосунок має власне сховище саме для того, щоб працювати без мережі."
                en: "A native app has its own store exactly so it can work without a network."
          correct: [device]
        explanation:
          uk: "Тому й список у стані офлайну береться зі сховища чи вбудованих даних, а не зникає."
          en: "That is also why the list in the offline state comes from the store or the bundled data instead of disappearing."
      - id: fetch-500
        from: js-08-07-failures-loading-error
        prompt:
          uk: "Сервер відповів статусом 500. Що робить promise, який повернув `fetch`?"
          en: "The server answered with status 500. What does the promise returned by `fetch` do?"
        answer:
          type: choice
          options:
            - id: resolves
              text:
                uk: "Виконується з відповіддю, у якої `ok` дорівнює `false`"
                en: "Resolves with a response whose `ok` is `false`"
            - id: rejects
              text:
                uk: "Відхиляється з помилкою"
                en: "Rejects with an error"
              why:
                uk: "`fetch` відхиляється лише тоді, коли відповіді немає зовсім (збій мережі, скасування). Статус 500 — теж відповідь."
                en: "`fetch` rejects only when there is no answer at all (a network failure, an abort). Status 500 is still an answer."
          correct: [resolves]
        explanation:
          uk: "Тож помилку сервера твій код помічає сам — перевіркою `response.ok` чи `response.status`, — а офлайн приходить як відхилений promise."
          en: "So your code notices a server error itself — by checking `response.ok` or `response.status` — while offline arrives as a rejected promise."

  - id: expenses-status
    kind: example
    runtime: concept-preview
    dir: expenses-status
    entry: main.jsx
    strings:
      groceries: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      pass: { uk: "Проїзний", en: "Transit pass" }
      coffee: { uk: "Кава з друзями", en: "Coffee with friends" }
      reload: { uk: "Оновити", en: "Refresh" }
      loading: { uk: "Завантаження…", en: "Loading…" }
      problem: { uk: "Збій", en: "Failure" }
      updated: { uk: "Оновлено", en: "Updated" }
      secondsAgo: { uk: "с тому", en: "s ago" }
      modeOk: { uk: "Сервіс працює", en: "Service works" }
      modeAirplane: { uk: "Режим польоту", en: "Airplane mode" }
      modeServer: { uk: "Сервер: 500", en: "Server: 500" }
      modeInvalid: { uk: "Неправильне тіло", en: "Invalid body" }
    title:
      uk: "Екран, що стирає список"
      en: "A screen that erases its list"
    body:
      uk: |
        Кнопки вгорі вибирають, що зробить **симульований** сервіс на наступне оновлення. `loadExpenses()` перетворює кожен збій на помилку з полем `kind`: `offline`, `server` чи `invalid`.

        Натисни **Запустити**, потім **Оновити**: з’являються три витрати й вік даних. Тепер вибери «Режим польоту» й онови ще раз — список зник. Обробник помилки в `catch` стирає все.
      en: |
        The buttons at the top choose what the **simulated** service does on the next refresh. `loadExpenses()` turns every failure into an error with a `kind` field: `offline`, `server` or `invalid`.

        Press **Run**, then **Refresh**: three expenses and the data's age appear. Now choose “Airplane mode” and refresh again — the list is gone. The error handler in `catch` erases everything.
    tryIt:
      uk: |
        1. У `catch` заміни `setState({ records: [], loadedAt: null, problem: error.kind, busy: false });` на `setState((s) => ({ ...s, problem: error.kind, busy: false }));` і запусти знову.
        2. Онови з «Сервіс працює», потім вибери «Режим польоту» й онови: список лишається, вік росте, а над ним — `offline`.
        3. Спробуй «Сервер: 500» і «Неправильне тіло»: список теж лишається, змінюється лише вид збою. Вибери «Сервіс працює» й онови — збій зникає, вік обнуляється.
      en: |
        1. In `catch` replace `setState({ records: [], loadedAt: null, problem: error.kind, busy: false });` with `setState((s) => ({ ...s, problem: error.kind, busy: false }));` and run again.
        2. Refresh with “Service works”, then choose “Airplane mode” and refresh: the list stays, the age grows, and `offline` is shown above it.
        3. Try “Server: 500” and “Invalid body”: the list stays too, only the kind of failure changes. Choose “Service works” and refresh — the failure goes away, the age resets.
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не нативний застосунок. Режим польоту, 500 і неправильне тіло тут лише симульовані: справжньої мережі, системного стану зв’язку чи `expo-network` немає. Як застосунок поводиться без мережі насправді, перевіряють на заявленій цілі, зупинивши mock-сервіс чи ввімкнувши режим польоту."
      en: "This is a browser preview through react-native-web, not a native app. Airplane mode, the 500 and the invalid body are only simulated here: there is no real network, no system connectivity state and no `expo-network`. How the app really behaves without a network is checked on your declared target by stopping the mock service or turning on airplane mode."

  - id: status-banner
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: status-banner
    entry: main.jsx
    editable: [StatusBanner.jsx]
    strings:
      offline: { uk: "Немає зв’язку із сервером. Показуємо збережені дані.", en: "No connection to the server. Showing saved data." }
      timeout: { uk: "Сервер не відповів вчасно.", en: "The server did not answer in time." }
      server: { uk: "Сервер зараз не впорався із запитом.", en: "The server could not handle the request right now." }
      invalid: { uk: "Сервер надіслав дані, які застосунок не розуміє.", en: "The server sent data the app does not understand." }
      retry: { uk: "Спробувати ще", en: "Try again" }
      useBundled: { uk: "Показати вбудовані дані", en: "Show bundled data" }
      exercise: { uk: "Ранкова зарядка", en: "Morning exercise" }
      reading: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
    title:
      uk: "Банер стану для екрана звичок"
      en: "A status banner for the habits screen"
    instructions:
      uk: |
        Допиши `StatusBanner({ failure, onRetry, onUseBundled })` у `StatusBanner.jsx`. Тексти вже є в `texts.js`.

        - `failure === null` — банера немає зовсім.
        - Кожен вид збою показує **своє** повідомлення з `MESSAGES`.
        - `'timeout'` і `'server'` мають одну кнопку `ACTIONS.retry`, що викликає `onRetry`.
        - `'offline'` і `'invalid'` мають одну кнопку `ACTIONS.useBundled`, що викликає `onUseBundled`: повтор зараз дав би той самий результат.
        - Банер оголошується скрінрідером: його контейнер має `accessibilityRole="alert"`.

        Перегляд показує банер для кожного випадку, а під ним — лічильники натискань двох дій.
      en: |
        Complete `StatusBanner({ failure, onRetry, onUseBundled })` in `StatusBanner.jsx`. The texts are ready in `texts.js`.

        - `failure === null` — no banner at all.
        - Each kind of failure shows **its own** message from `MESSAGES`.
        - `'timeout'` and `'server'` have one button `ACTIONS.retry` that calls `onRetry`.
        - `'offline'` and `'invalid'` have one button `ACTIONS.useBundled` that calls `onUseBundled`: a retry now would give the same result.
        - The banner is announced by a screen reader: its container has `accessibilityRole="alert"`.

        The preview shows the banner for every case, with counters of presses on the two actions below it.
    limits:
      uk: "Банер малює браузер через react-native-web, а `accessibilityRole=\"alert\"` перевіряється як атрибут `role=\"alert\"` на сторінці. Що саме й коли скаже TalkBack чи VoiceOver, перевіряють на заявленій цілі."
      en: "The browser draws the banner through react-native-web, and `accessibilityRole=\"alert\"` is checked as a `role=\"alert\"` attribute on the page. What TalkBack or VoiceOver says and when is checked on your declared target."
    testTitles:
      "no failure shows no banner":
        uk: "Без збою банера немає"
        en: "No failure shows no banner"
      "each failure kind shows its own message":
        uk: "Кожен вид збою показує своє повідомлення"
        en: "Each kind of failure shows its own message"
      "timeout and server error offer Try again":
        uk: "Тайм-аут і помилка сервера пропонують «Спробувати ще»"
        en: "A timeout and a server error offer “Try again”"
      "offline and an invalid answer offer the bundled data instead of a retry":
        uk: "Офлайн і неправильна відповідь пропонують вбудовані дані замість повтору"
        en: "Offline and an invalid answer offer the bundled data instead of a retry"
      "the banner is announced as an alert":
        uk: "Банер має `accessibilityRole=\"alert\"`"
        en: "The banner has `accessibilityRole=\"alert\"`"
    hints:
      nudge:
        uk: "Тобі треба дві відповідності: «вид збою → повідомлення» і «вид збою → дія». Перша вже лежить у `MESSAGES`. Як записати другу так само коротко?"
        en: "You need two mappings: “kind of failure → message” and “kind of failure → action”. The first one already sits in `MESSAGES`. How can you write the second one just as briefly?"
      explanation:
        uk: "Коли значення залежить від виду, зручно мати об’єкт-таблицю й брати з нього за ключем: `ICONS[weather]`, де `ICONS = { rain: '☔', sun: '☀️' }`. Так само кнопку можна вибрати за видом збою, а обробник натискання — залежно від вибраної дії. Для оголошення банера потрібна роль контейнера, а не кнопки."
        en: "When a value depends on a kind, a table object and a lookup by key are convenient: `ICONS[weather]`, where `ICONS = { rain: '☔', sun: '☀️' }`. In the same way the button can be chosen by the kind of failure, and the press handler by the chosen action. Announcing the banner needs a role on the container, not on the button."
    solutionNote:
      uk: "Повідомлення й дія беруться з двох таблиць за видом збою, тож новий вид — це два рядки, а не нова гілка `if`. Повтор пропонується лише там, де він може дати інший результат."
      en: "The message and the action come from two tables by the kind of failure, so a new kind is two lines, not a new `if` branch. A retry is offered only where it can give another result."
    feedback:
      - when: { test: "each failure kind shows its own message" }
        message:
          uk: "Ця перевірка чекає, що кожен випадок показує лише своє повідомлення з `MESSAGES`: `offline` — повідомлення про зв’язок, `timeout` — про тайм-аут і так далі."
          en: "This check expects each case to show only its own message from `MESSAGES`: `offline` the connection message, `timeout` the timeout one, and so on."
      - when: { test: "offline and an invalid answer offer the bundled data instead of a retry" }
        message:
          uk: "Ця перевірка чекає в випадках `offline` і `invalid` рівно одну кнопку з текстом `ACTIONS.useBundled`, що викликає `onUseBundled`. Повтор там дав би той самий збій."
          en: "This check expects exactly one button with the text `ACTIONS.useBundled` that calls `onUseBundled` in the `offline` and `invalid` cases. A retry there would give the same failure."
      - when: { test: "the banner is announced as an alert" }
        message:
          uk: "Ця перевірка шукає в кожному випадку збою елемент з `role=\"alert\"`. Його дає `accessibilityRole=\"alert\"` на контейнері банера."
          en: "This check looks for an element with `role=\"alert\"` in every failure case. `accessibilityRole=\"alert\"` on the banner's container gives it."

  - id: to-project
    kind: transfer
    capstoneStep: RN-06
    body:
      uk: "У кроці проєкту список твого домену не порожнітиме через збій: коли mock-сервіс недосяжний, він показує вбудовані фікстури, а підсумки рахуються лише з даних, що справді завантажилися."
      en: "In the project step your domain's list does not go empty because of a failure: when the mock service is unreachable it shows the bundled fixtures, and the totals are computed only from data that actually loaded."
