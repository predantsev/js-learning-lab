id: js-09-05-mocks-vs-real
unit: JS-09
title:
  uk: "Mocks проти справжніх доказів"
  en: "Mocks versus real evidence"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Замінити залежність `fetch` у функції завантаження підробкою, що повертає фікстуру, і сказати, що такий тест доводить, а що ні."
    en: "Replace the fetch dependency of a loading function with a fake that returns a fixture, and state what that test does and does not prove."
  - uk: "Вирішити для трьох тверджень (розбір працює, сервер надсилає саме таку форму даних, застосунок оговтується без мережі), що для кожного є доказом: тест із підробкою чи справжній запуск."
    en: "Decide for three claims (parsing works, the server sends that shape, the app recovers when offline) whether a mock or a real run is the evidence."
prerequisites: [js-09-04-deterministic-fixtures, js-08-06-fetch-basics]
subskills:
  - { family: P-04, skill: "mocks vs actual evidence", depth: intro }
glossary: [test-double, mock, stub]
selfCheck: [what-slips, which-evidence, error-state]

blocks:
  - id: doubles
    kind: explanation
    title:
      uk: "Підробка замість мережі"
      en: "A fake instead of the network"
    body:
      uk: |
        Функція, що завантажує дані через `fetch`, залежить від сервера: він може бути повільним, недоступним, а його дані — змінюватися. Тест такої функції тоді нестабільний. Тому залежність роблять **параметром**, а в тесті передають підробку:

        ```js
        export async function loadWishes(fetchFn = fetch) {
          const response = await fetchFn("/lab/wishlist/items");
          // …
        }

        // in a test: an answer prepared in advance, no network at all
        const fakeFetch = async () => ({ ok: true, status: 200, json: async () => ({ items: [] }) });
        await loadWishes(fakeFetch);
        ```

        Замінник справжньої залежності в тесті — [[test-double]]. Той, що лише повертає підготовлену відповідь, — [[stub]]; той, що ще й запам’ятовує, як його викликали, щоб тест це перевірив, — [[mock]]. У розмові «моком» часто називають будь-яку підробку.
      en: |
        A function that loads data through `fetch` depends on a server: it can be slow, unavailable, and its data can change. A test of such a function is then flaky. So the dependency is made a **parameter**, and a test passes in a fake:

        ```js
        export async function loadWishes(fetchFn = fetch) {
          const response = await fetchFn("/lab/wishlist/items");
          // …
        }

        // in a test: an answer prepared in advance, no network at all
        const fakeFetch = async () => ({ ok: true, status: 200, json: async () => ({ items: [] }) });
        await loadWishes(fakeFetch);
        ```

        A stand-in for a real dependency in a test is a [[test-double]]. One that only returns a prepared answer is a [[stub]]; one that also records how it was called, so the test can check that, is a [[mock]]. In conversation, “mock” often means any fake.

  - id: what-slips
    kind: prediction
    prompt:
      uk: |
        Тест функції `loadTasks(fetchFn)` передає підробку, яка ігнорує адресу й завжди відповідає `ok: true` з двома справами. Тест перевіряє лише, що справ дві.

        У коді `loadTasks` з’являються три дефекти:

        - адресу написано з помилкою: `/lab/planer/items`;
        - зникла перевірка `response.ok`;
        - код читає `item.titel` замість `item.title`, і в підробленій відповіді хтось написав `titel` так само.

        Скільки з цих дефектів упіймає цей тест?
      en: |
        A test of the function `loadTasks(fetchFn)` passes a fake that ignores the address and always answers `ok: true` with two tasks. The test checks only that there are two tasks.

        Three defects appear in the code of `loadTasks`:

        - the address has a typo: `/lab/planer/items`;
        - the `response.ok` check is gone;
        - the code reads `item.titel` instead of `item.title`, and someone wrote `titel` the same way in the fake answer.

        How many of these defects will this test catch?
    answer:
      type: choice
      options:
        - id: none
          text: { uk: "Жодного", en: "None" }
        - id: all
          text: { uk: "Усі три: тест же проходить через увесь код `loadTasks`", en: "All three: the test does run through all of `loadTasks`" }
          why:
            uk: "Проходить, але підробка відповідає однаково на будь-яку адресу, завжди з `ok: true` і з тими полями, які в неї вписали. Жоден із трьох дефектів не змінює того, що бачить тест."
            en: "It does, but the fake answers the same for any address, always with `ok: true` and with whatever fields were written into it. None of the three defects changes what the test sees."
        - id: url-only
          text: { uk: "Лише неправильну адресу", en: "Only the wrong address" }
          why:
            uk: "Підробка не дивиться на адресу. Тест і не міг би її помітити — хіба що перевіряв би, з якою адресою викликали підробку."
            en: "The fake does not look at the address. The test could not notice it — unless it checked which address the fake was called with."
        - id: ok-only
          text: { uk: "Лише зниклу перевірку `ok`", en: "Only the missing `ok` check" }
          why:
            uk: "Підробка завжди відповідає `ok: true`, тож гілка для помилки ніколи не виконується — ні з перевіркою, ні без неї."
            en: "The fake always answers `ok: true`, so the error branch never runs — with the check or without it."
      correct: [none]
    explanation:
      uk: "Тест із підробкою доводить лише одне: **якщо** відповідь має саме таку форму, `loadTasks` правильно її обробляє. Чи правильна адреса, чи сервер справді надсилає `title` і як код поводиться з помилкою — цей тест не знає. Зелений тест із підробкою — не доказ, що справжній код мережі працює."
      en: "A test with a fake proves just one thing: **if** the answer has exactly that shape, `loadTasks` handles it correctly. Whether the address is right, whether the server really sends `title`, and how the code treats an error — this test does not know. A green test with a fake is not proof that the real network code works."

  - id: mock-and-real
    kind: example
    runtime: browser-js
    dir: mock-and-real
    entry: index.js
    capabilities: { network: lab }
    strings:
      lang: { uk: "uk", en: "en" }
      t01: { uk: "Полити квіти", en: "Water the plants" }
      t04: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      tFake: { uk: "з підробкою: завантажує справи з відповіді", en: "with a fake: loads the tasks from the answer" }
      tReal: { uk: "зі справжнім лабораторним сервером: справи мають назви", en: "with the real lab server: the tasks have titles" }
      mState: { uk: "стан", en: "state" }
      mIds: { uk: "id справ", en: "task ids" }
      mNotEmpty: { uk: "сервер повернув хоч одну справу", en: "the server returned at least one task" }
      mTitle: { uk: "тип title у справи", en: "type of title in task" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Той самий тест: з підробкою і наживо"
      en: "The same test: with a fake and for real"
    body:
      uk: |
        Тут два тести `loadTasks`. Перший передає підробку `fakeFetch`. Другий викликає `loadTasks()` без аргументу, тобто зі справжнім `fetch`, і йде до справжнього лабораторного сервера платформи — на твоєму комп’ютері, з синтетичними справами. Запусти: обидва проходять.

        Тепер ламай `tasks-api.js` і щоразу дивись, **який** тест помічає дефект.
      en: |
        Here are two tests of `loadTasks`. The first passes the fake `fakeFetch`. The second calls `loadTasks()` without an argument, that is, with the real `fetch`, and goes to the platform’s real lab server — on your computer, with synthetic tasks. Run it: both pass.

        Now break `tasks-api.js` and each time see **which** test notices the defect.
    tryIt:
      uk: |
        1. В адресі заміни `planner` на `planer` і запусти. Тест із підробкою проходить. Справжній сервер не знає такої колекції й відповідає порожнім списком — і падає справжній тест. Виправ адресу.
        2. Заміни `item.title` на `item.titel` і запусти. Тест із підробкою знову проходить: він перевіряє лише `id`. Справжній тест падає, бо `title` тепер `undefined`. Поверни `title`.
        3. Подумай: чи може справжній тест перевірити, що буде, коли сервер відповість `500`? Лабораторний сервер курсу має для цього спеціальну адресу (`/lab/status/500` з JS-08), але справжній робочий сервер помилкою на замовлення не відповість, а відсутність мережі справжнім запуском не зобразиш. Тому для помилок і роботи без мережі потрібна підробка.
      en: |
        1. In the address replace `planner` with `planer` and run. The test with the fake passes. The real server does not know that collection and answers with an empty list — and the real test fails. Fix the address.
        2. Replace `item.title` with `item.titel` and run. The test with the fake passes again: it checks only the `id`s. The real test fails because `title` is now `undefined`. Put `title` back.
        3. Think: can the real test check what happens when the server answers `500`? The course’s lab server has a special address for that (`/lab/status/500` from JS-08), but a real production server will not answer with an error on request, and a real run cannot stage a missing network. So for errors and for working without a network you need a fake.

  - id: two-runs
    kind: visual
    visual: diagram
    title:
      uk: "Що доводить кожен запуск"
      en: "What each run proves"
    textEquivalent:
      uk: "Той самий тест loadTasks запускається двома способами. Ліворуч — з підробкою: тест викликає loadTasks, а та замість мережі звертається до fakeFetch, яка повертає відповідь, написану в самому тесті. Такий запуск швидкий і щоразу однаковий, і він може зобразити будь-яку відповідь, навіть 500 чи відсутність мережі. Він доводить, що loadTasks правильно обробляє відповідь саме такої форми. Але адресу він не перевіряє, і чи надсилає сервер такі самі поля, не знає. Праворуч — справжній запуск: тест викликає loadTasks, та — справжній fetch, а той іде до лабораторного сервера. Такий запуск доводить, що адреса правильна й сервер справді надсилає справи з полями id і title, але він повільніший, залежить від сервера, а справжній робочий сервер не відповість помилкою на замовлення. Тому потрібні обидва: підробка — для логіки й станів помилки, справжній запуск — для домовленості із сервером."
      en: "The same loadTasks test runs in two ways. On the left, with a fake: the test calls loadTasks, which instead of the network turns to fakeFetch, and that returns an answer written in the test itself. This run is fast and the same every time, and it can stage any answer, even 500 or no network. It proves that loadTasks handles an answer of exactly that shape correctly. But it does not check the address, and it does not know whether the server sends the same fields. On the right is the real run: the test calls loadTasks, which calls the real fetch, which goes to the lab server. This run proves that the address is right and that the server really sends tasks with the fields id and title, but it is slower, depends on the server, and a real production server will not answer with an error on request. So you need both: the fake for logic and error states, the real run for the agreement with the server."
    spec:
      layout: lr
      groups:
        - { id: fake, label: { uk: "З підробкою", en: "With a fake" } }
        - { id: real, label: { uk: "Наживо", en: "For real" } }
      nodes:
        - { id: test1, group: fake, label: { uk: "тест", en: "test" }, shape: round }
        - { id: load1, group: fake, label: "loadTasks" }
        - { id: stub, group: fake, label: "fakeFetch", shape: note }
        - { id: test2, group: real, label: { uk: "тест", en: "test" }, shape: round }
        - { id: load2, group: real, label: "loadTasks" }
        - { id: fetch, group: real, label: "fetch" }
        - { id: server, group: real, label: { uk: "лаб-сервер", en: "lab server" }, shape: cylinder }
      edges:
        - { id: t1-l1, from: test1, to: load1 }
        - { id: l1-stub, from: load1, to: stub }
        - { id: t2-l2, from: test2, to: load2 }
        - { id: l2-fetch, from: load2, to: fetch }
        - { id: fetch-server, from: fetch, to: server, label: "HTTP", kind: both }
      steps:
        - caption:
            uk: "Той самий тест `loadTasks`, запущений двома способами: ліворуч `fetch` замінено підробкою, праворуч запит іде до справжнього сервера."
            en: "The same `loadTasks` test run in two ways: on the left `fetch` is replaced by a fake, on the right the request goes to the real server."
        - caption:
            uk: "**З підробкою:** `fakeFetch` повертає відповідь, яку написав автор тесту. Запуск швидкий, однаковий щоразу й може зобразити `500` чи відсутність мережі. Доводить: таку відповідь `loadTasks` обробляє правильно."
            en: "**With a fake:** `fakeFetch` returns an answer the test’s author wrote. The run is fast, the same every time, and can stage a `500` or no network. It proves: `loadTasks` handles such an answer correctly."
          highlight: [test1, load1, stub, t1-l1, l1-stub]
          dim: [test2, load2, fetch, server]
          annotate:
            - { id: stub, text: { uk: "відповідь з тесту", en: "answer from the test" } }
        - caption:
            uk: "Чого підробка **не** доводить: що адреса правильна і що сервер надсилає ті самі поля. До справжнього сервера цей запуск не доходить."
            en: "What the fake does **not** prove: that the address is right and that the server sends the same fields. This run never reaches the real server."
          highlight: [stub]
          dim: [test1, load1, test2, load2, fetch, server]
          annotate:
            - { id: stub, text: { uk: "адреса? поля?", en: "address? fields?" } }
        - caption:
            uk: "**Наживо:** справжній `fetch` іде до лабораторного сервера. Доводить: адреса правильна, і сервер справді надсилає справи з `id` і `title`. Але запуск повільніший і залежить від сервера."
            en: "**For real:** the real `fetch` goes to the lab server. It proves: the address is right and the server really sends tasks with `id` and `title`. But the run is slower and depends on the server."
          highlight: [test2, load2, fetch, server, t2-l2, l2-fetch, fetch-server]
          dim: [test1, load1, stub]
        - caption:
            uk: "Потрібні обидва: підробка — для логіки й станів помилки, справжній запуск — для домовленості із сервером."
            en: "You need both: the fake for logic and error states, the real run for the agreement with the server."
          highlight: [stub, server]

  - id: which-evidence
    kind: prediction
    prompt:
      uk: "Для якого з цих тверджень доказом є лише справжній запуск, а не тест із підробкою?"
      en: "For which of these claims is only a real run the evidence, not a test with a fake?"
    answer:
      type: choice
      options:
        - id: shape
          text: { uk: "Сервер надсилає справи з полями `id`, `title` і `done`", en: "The server sends tasks with the fields `id`, `title` and `done`" }
        - id: parsing
          text: { uk: "`loadTasks` перетворює відповідь `{ items: [...] }` на список справ", en: "`loadTasks` turns the answer `{ items: [...] }` into a list of tasks" }
          why:
            uk: "Це логіка самої функції. Підробка з відомою відповіддю перевіряє її швидко й щоразу однаково — це якраз її робота."
            en: "That is the function’s own logic. A fake with a known answer checks it quickly and the same way every time — that is exactly its job."
        - id: offline
          text: { uk: "Без мережі застосунок показує повідомлення про помилку", en: "Without a network the app shows an error message" }
          why:
            uk: "Справжню мережу на замовлення не вимкнеш, а підробка, що кидає `TypeError: Failed to fetch`, зображує її відсутність щоразу однаково. Тут підробка — кращий доказ."
            en: "You cannot switch the real network off on request, while a fake that throws `TypeError: Failed to fetch` stages its absence the same way every time. Here the fake is the better evidence."
      correct: [shape]
    explanation:
      uk: "Форму даних знає лише сервер: підробка повторює те, що в неї вписав автор тесту, навіть якщо він помилився. А розбір відповіді й поведінку без мережі краще перевіряти підробкою — швидко, детерміновано й без залежності від сервера."
      en: "Only the server knows the shape of the data: a fake repeats what the test’s author wrote into it, even if they were wrong. Parsing the answer and the behavior without a network are better checked with a fake — quickly, deterministically and without depending on the server."

  - id: error-state
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: error-state
    entry: index.js
    editable: [expenses.test.js]
    strings:
      lang: { uk: "uk", en: "en" }
      solutionTest: { uk: "відповідь 500 дає стан помилки зі статусом", en: "a 500 answer gives an error state with the status" }
      mError: { uk: "результат при відповіді 500", en: "result for a 500 answer" }
      mState: { uk: "стан", en: "state" }
      mStatus: { uk: "статус", en: "status" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Тест стану помилки з підробкою"
      en: "A test of the error state with a fake"
    instructions:
      uk: |
        `loadExpenses(fetchFn)` у файлі `expenses-api.js` завантажує витрати. Коли відповідь не `ok`, функція повертає `{ state: "error", status }` зі статусом відповіді.

        Справжній сервер тут недоступний (мережі у вправі немає), а справжній робочий сервер помилкою на замовлення не відповідає. Тож напиши в `expenses.test.js` асинхронний тест:

        1. Створи підробку `fetch`, яка відповідає об’єктом з `ok: false` і `status: 500`.
        2. Виклич `loadExpenses` з нею й дочекайся результату через `await`.
        3. Перевір, що результат — стан помилки зі статусом `500`.

        Над тестом напиши коментар: чого цей тест **не** доводить.
      en: |
        `loadExpenses(fetchFn)` in the file `expenses-api.js` loads the expenses. When the answer is not `ok`, the function returns `{ state: "error", status }` with the answer’s status.

        The real server is not reachable here (the exercise has no network), and a real production server does not answer with an error on request. So write an async test in `expenses.test.js`:

        1. Create a fake `fetch` that answers with an object with `ok: false` and `status: 500`.
        2. Call `loadExpenses` with it and wait for the result with `await`.
        3. Check that the result is an error state with the status `500`.

        Above the test, write a comment: what this test does **not** prove.
    testTitles:
      "your tests pass with the correct loadExpenses":
        uk: "Твої тести проходять із правильною `loadExpenses`"
        en: "Your tests pass with the correct `loadExpenses`"
      "one of your tests fails when loadExpenses ignores response.ok":
        uk: "Твій тест падає, коли `loadExpenses` не дивиться на `response.ok`"
        en: "Your test fails when `loadExpenses` ignores `response.ok`"
      "one of your tests fails when the error state has no status":
        uk: "Твій тест падає, коли в стані помилки немає статусу"
        en: "Your test fails when the error state has no status"
    hints:
      nudge:
        uk: "Підробка — звичайна асинхронна функція, що повертає об’єкт, схожий на відповідь. А тест, у якому є `await`, має бути `async`."
        en: "A fake is an ordinary async function that returns an object that looks like a response. And a test that uses `await` must be `async`."
      explanation:
        uk: "`loadExpenses` бере з відповіді лише `ok`, `status` і, якщо все гаразд, `json()`. Тому підробці досить цих полів. Без `await` у змінній опиниться promise, а не результат, і в нього немає поля `state`. Так виглядає тест для іншої функції з підробкою, що відповідає `404`: `const result = await loadWish(async () => ({ ok: false, status: 404 }), \"w-09\");` — і далі перевірка `result`."
        en: "`loadExpenses` takes only `ok`, `status` and, when all is well, `json()` from the answer. So those fields are enough for the fake. Without `await` the variable holds a promise rather than the result, and a promise has no `state` field. Here is a test of another function with a fake answering `404`: `const result = await loadWish(async () => ({ ok: false, status: 404 }), \"w-09\");` — followed by a check of `result`."
    solutionNote:
      uk: "Підробка відповідає `ok: false` і `status: 500`, тест чекає результат через `await` і порівнює весь об’єкт `{ state: \"error\", status: 500 }`. Він доводить, як `loadExpenses` обробляє відповідь 500, — і не доводить, що справжній сервер колись так відповість, що адреса правильна чи що сторінка покаже користувачеві помилку."
      en: "The fake answers `ok: false` and `status: 500`, the test waits for the result with `await` and compares the whole `{ state: \"error\", status: 500 }` object. It proves how `loadExpenses` treats a 500 answer — and does not prove that the real server will ever answer like that, that the address is right, or that the page shows the user an error."
    feedback:
      - when: { test: "your tests pass with the correct loadExpenses" }
        message:
          uk: "Ця перевірка очікує хоча б один тест, який проходить із правильною `loadExpenses`. Якщо в консолі видно, що отримано `{}` замість об’єкта зі `state`, бракує `await` перед викликом. Якщо там `Failed to fetch`, тест викликав справжній `fetch` — передай свою підробку аргументом."
          en: "This check expects at least one test that passes with the correct `loadExpenses`. If the console shows `{}` was received instead of an object with `state`, the `await` before the call is missing. If it says `Failed to fetch`, the test called the real `fetch` — pass your fake as the argument."
      - when: { test: "one of your tests fails when loadExpenses ignores response.ok" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили з правильним кодом (див. першу перевірку). Потім вона запускає твої тести з версією, яка не дивиться на `response.ok`, і очікує, що хоч один упаде. Потрібна підробка з `ok: false` і перевірка, що стан — `\"error\"`."
          en: "This check first needs all your tests to pass with the correct code (see the first check). Then it runs your tests against a version that ignores `response.ok` and expects at least one to fail. You need a fake with `ok: false` and a check that the state is `\"error\"`."
      - when: { test: "one of your tests fails when the error state has no status" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили з правильним кодом (див. першу перевірку). Потім вона запускає твої тести з версією, що повертає `{ state: \"error\" }` без статусу, і очікує, що хоч один упаде. Перевір і статус `500`, а не лише `state`."
          en: "This check first needs all your tests to pass with the correct code (see the first check). Then it runs your tests against a version that returns `{ state: \"error\" }` without the status and expects at least one to fail. Check the status `500` too, not only `state`."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: у файлі тестів синтаксична помилка. Якщо в повідомленні йдеться про `await`, функція тесту має бути `async`: `test(\"…\", async () => { … })`."
          en: "The code could not start: the test file has a syntax error. If the message mentions `await`, the test function must be `async`: `test(\"…\", async () => { … })`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: await-order
        from: js-08-05-async-await
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          async function loadCount() {
            return 3;
          }
          const pending = loadCount();
          console.log(pending instanceof Promise);
          console.log(await loadCount());
        verify: { logs: ["true", "3"] }
        answer:
          type: choice
          options:
            - id: true-3
              code: "true\n3"
            - id: false-3
              code: "false\n3"
              why:
                uk: "`async`-функція **завжди** повертає promise, навіть коли всередині просто `return 3`."
                en: "An `async` function **always** returns a promise, even when it just does `return 3` inside."
            - id: true-promise
              code: "true\nPromise"
              why:
                uk: "`await` чекає, доки promise виконається, і дає його значення — `3`."
                en: "`await` waits until the promise is fulfilled and gives its value — `3`."
          correct: [true-3]
        explanation:
          uk: "Виклик `async`-функції повертає promise, а значення дає `await`. Тому в асинхронному тесті без `await` перевірка порівнювала б promise, а не результат."
          en: "Calling an `async` function returns a promise, and `await` gives its value. That is why in an async test without `await` the check would compare a promise, not the result."

  - id: to-project
    kind: transfer
    capstoneStep: JS-09
    body:
      uk: "Доменні функції твого проєкту чисті, тож їм підробки не потрібні — передай дані й порівняй результат. Підробку бери лише там, де код іде в мережу чи сховище, і пам’ятай: тест із нею доводить обробку відповіді, а не роботу справжнього сервера."
      en: "Your project’s domain functions are pure, so they need no fakes — pass the data and compare the result. Use a fake only where code goes to the network or storage, and remember: a test with one proves how the answer is handled, not that the real server works."
