id: js-09-01-why-tests
unit: JS-09
title:
  uk: "Навіщо тести і якими вони бувають"
  en: "Why tests, and which kinds exist"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Пояснити, що перевіряє unit-тест, інтеграційний тест, тест рівня користувача й end-to-end тест, і вибрати найдешевший, який помітить описаний дефект."
    en: "State what a unit, an integration, a user-level and an end-to-end test each check, and pick the cheapest one that would catch a described defect."
  - uk: "Запустити невеликий набір тестів і прочитати, який тест упав, що очікувалося і що отримано."
    en: "Run a small test suite and read which test failed and its expected and actual values."
prerequisites: [js-08-13-capstone-async-load, js-03-07-pure-vs-side-effects]
subskills:
  - { family: P-04, skill: "unit/integration/user/E2E purposes", depth: intro }
glossary: [automated-test, unit-test, integration-test, end-to-end-test, test-suite]
selfCheck: [which-tests-fail, first-test]

blocks:
  - id: click-or-code
    kind: explanation
    title:
      uk: "Поклацати чи написати перевірку"
      en: "Click through or write a check"
    body:
      uk: |
        Ти змінив функцію фільтра й хочеш переконатися, що нічого не зламалося. Можна відкрити застосунок і поклацати: додати справу, увімкнути фільтр, перезавантажити сторінку. Це працює — один раз. Після наступної зміни треба клацати знову, і так після кожної, а з часом ти пропустиш якийсь крок.

        [[automated-test|Автоматичний тест]] — це код, який викликає твій код і порівнює результат з очікуваним:

        ```js
        test("counts only pending tasks", () => {
          expect(countPending(tasks)).toBe(2);
        });
        ```

        `test(назва, функція)` реєструє тест. `expect(значення).toBe(очікуване)` порівнює: якщо значення інше, тест **падає** й показує, що очікувалося і що отримано. [[test-suite|Набір тестів]] перевіряє десятки випадків за секунду — щоразу однаково й після кожної зміни.
      en: |
        You changed the filter function and want to be sure nothing broke. You could open the app and click through: add a task, switch the filter on, reload the page. That works — once. After the next change you have to click again, after every change, and sooner or later you skip a step.

        An [[automated-test|automated test]] is code that calls your code and compares the result with what you expect:

        ```js
        test("counts only pending tasks", () => {
          expect(countPending(tasks)).toBe(2);
        });
        ```

        `test(name, fn)` registers a test. `expect(value).toBe(expected)` compares: if the value is different, the test **fails** and shows what was expected and what it got. A [[test-suite]] checks dozens of cases in a second — the same way every time, after every change.

  - id: four-kinds
    kind: explanation
    title:
      uk: "Чотири види тестів"
      en: "Four kinds of tests"
    body:
      uk: |
        Тести відрізняються тим, яку частину застосунку вони проходять. Ось чотири види на прикладі фільтра справ:

        | Вид | Що перевіряє | Приклад |
        |---|---|---|
        | [[unit-test\|Unit-тест]] | одну функцію, без сторінки й сховища | `filterByStatus(tasks, "done")` повертає лише виконані справи |
        | [[integration-test\|Інтеграційний тест]] | кілька модулів разом | справи зі сховища завантажуються й показуються списком |
        | Тест рівня користувача | сторінку через дії людини: клік, введення тексту | клік на «Виконані» лишає на сторінці тільки виконані справи |
        | [[end-to-end-test\|End-to-end тест]] | увесь застосунок у справжньому браузері | позначити справу, перезавантажити сторінку — справа на місці |

        Що вище в таблиці, то тест швидший і точніше показує, **де** дефект. Що нижче, то більше частин він охоплює, але працює повільніше, а коли падає, каже лише «десь зламалося». End-to-end тести запускають окремі інструменти (наприклад, Playwright), які керують браузером.

        Перевірки на цій платформі (вкладка «Перевірки») — теж тести: вони викликають твої функції, а у вправах зі сторінкою натискають кнопки, як користувач.
      en: |
        Tests differ in which part of the app they pass through. Here are four kinds, using a task filter as the example:

        | Kind | What it checks | Example |
        |---|---|---|
        | [[unit-test\|Unit test]] | one function, without the page or storage | `filterByStatus(tasks, "done")` returns only done tasks |
        | [[integration-test\|Integration test]] | several modules together | tasks are loaded from storage and shown as a list |
        | User-level test | the page through a person’s actions: clicks, typing | clicking “Done” leaves only done tasks on the page |
        | [[end-to-end-test\|End-to-end test]] | the whole app in a real browser | mark a task, reload the page — the task is still there |

        The higher in the table, the faster the test and the more precisely it shows **where** the defect is. The lower, the more parts it covers, but it runs slower, and when it fails it only says “something broke somewhere”. End-to-end tests are run by separate tools (for example, Playwright) that drive a browser.

        The checks on this platform (the “Checks” tab) are tests too: they call your functions, and in exercises with a page they press buttons the way a user does.

  - id: layers
    kind: visual
    visual: diagram
    title:
      uk: "Які шари проходить кожен тест"
      en: "Which layers each test passes through"
    textEquivalent:
      uk: "Одна функція застосунку — фільтр справ за статусом — має чотири шари. Найглибший — доменна функція filterByStatus. Над нею модулі, що завантажують справи й показують список (load і render). Над ними сторінка з кнопкою фільтра «Виконані». Зверху — увесь застосунок, який можна перезавантажити. Unit-тест викликає лише filterByStatus. Інтеграційний тест запускає load і render, а ті вже викликають filterByStatus. Тест рівня користувача натискає кнопку на сторінці, і клік проходить через render до filterByStatus. End-to-end тест відкриває весь застосунок, перезавантажує його й проходить усі шари до самого низу. Якщо дефект сидить у порівнянні всередині filterByStatus, його бачить кожен тест, що доходить до цього порівняння, але тільки unit-тест одразу називає функцію, де він сидить."
      en: "One feature of the app — filtering tasks by status — has four layers. The deepest is the domain function filterByStatus. Above it are the modules that load the tasks and show the list (load and render). Above them is the page with the “Done” filter button. On top is the whole app, which can be reloaded. A unit test calls only filterByStatus. An integration test runs load and render, and they in turn call filterByStatus. A user-level test presses the button on the page, and the click goes through render down to filterByStatus. An end-to-end test opens the whole app, reloads it and passes through every layer to the very bottom. If a defect sits in the comparison inside filterByStatus, every test that reaches that comparison sees it, but only the unit test names the function where it sits right away."
    spec:
      layout: lr
      groups:
        - { id: tests, label: { uk: "Тести", en: "Tests" } }
        - { id: app, label: { uk: "Застосунок", en: "The app" } }
      nodes:
        - { id: e2e, group: tests, label: "end-to-end", shape: round }
        - { id: user, group: tests, label: { uk: "користувацький", en: "user-level" }, shape: round }
        - { id: integration, group: tests, label: { uk: "інтеграційний", en: "integration" }, shape: round }
        - { id: unit, group: tests, label: "unit", shape: round }
        - { id: whole, group: app, label: { uk: "застосунок", en: "whole app" } }
        - { id: page, group: app, label: { uk: "кнопка фільтра", en: "filter button" } }
        - { id: wiring, group: app, label: "load + render" }
        - { id: domain, group: app, label: "filterByStatus" }
      edges:
        - { id: e2e-whole, from: e2e, to: whole }
        - { id: user-page, from: user, to: page }
        - { id: int-wiring, from: integration, to: wiring }
        - { id: unit-domain, from: unit, to: domain }
        - { id: whole-page, from: whole, to: page, kind: dashed }
        - { id: page-wiring, from: page, to: wiring, kind: dashed }
        - { id: wiring-domain, from: wiring, to: domain, kind: dashed }
      steps:
        - caption:
            uk: "Праворуч — чотири шари однієї функції застосунку: фільтра справ. Пунктир показує, хто кого викликає: кожен шар спирається на той, що нижче."
            en: "On the right are the four layers of one app feature: the task filter. The dashed lines show who calls whom: every layer relies on the one below."
        - caption:
            uk: "**Unit-тест** викликає тільки `filterByStatus`. Він виконується за мілісекунди, і коли падає, ти вже знаєш, у якій функції шукати."
            en: "A **unit test** calls only `filterByStatus`. It runs in milliseconds, and when it fails you already know which function to look in."
          highlight: [unit, domain, unit-domain]
          dim: [e2e, user, integration, whole, page, wiring]
        - caption:
            uk: "**Інтеграційний тест** запускає `load` і `render` разом — і через них доходить до `filterByStatus`. Він помітить, якщо модулі погано з’єднані між собою."
            en: "An **integration test** runs `load` and `render` together — and through them reaches `filterByStatus`. It notices when the modules are wired together badly."
          highlight: [integration, wiring, domain, int-wiring, wiring-domain]
          dim: [e2e, user, unit, whole, page]
        - caption:
            uk: "**Тест рівня користувача** натискає кнопку на сторінці. Клік проходить через `render` аж до `filterByStatus`."
            en: "A **user-level test** presses the button on the page. The click goes through `render` all the way down to `filterByStatus`."
          highlight: [user, page, wiring, domain, user-page, page-wiring, wiring-domain]
          dim: [e2e, integration, unit, whole]
        - caption:
            uk: "**End-to-end тест** відкриває весь застосунок, перезавантажує сторінку й проходить усі шари. Він найповільніший і, коли падає, не каже, у якому шарі біда."
            en: "An **end-to-end test** opens the whole app, reloads the page and passes through every layer. It is the slowest, and when it fails it does not say which layer is at fault."
          highlight: [e2e, whole, page, wiring, domain, e2e-whole, whole-page, page-wiring, wiring-domain]
          dim: [user, integration, unit]
        - caption:
            uk: "Дефект у `filterByStatus` бачить кожен тест, що доходить до зламаного рядка коду. Найдешевше його ловить unit-тест — і саме він одразу показує місце."
            en: "Every test that reaches the broken line sees a defect in `filterByStatus`. The cheapest one to catch it is the unit test — and it is the one that shows the place right away."
          highlight: [domain, unit, unit-domain]
          annotate:
            - { id: domain, text: { uk: "дефект тут", en: "defect here" } }

  - id: which-tests-fail
    kind: prediction
    prompt:
      uk: |
        У застосунку-планувальнику є чотири тести фільтра справ:

        - **A** (unit): `filterByStatus(tasks, "done")` повертає лише виконані справи.
        - **B** (інтеграційний): справи зі сховища завантажуються й показуються списком з фільтром «Усі».
        - **C** (рівня користувача): клік на кнопку «Виконані» лишає на сторінці тільки виконані справи.
        - **D** (end-to-end): позначити справу виконаною, перезавантажити сторінку, увімкнути «Виконані» — справа є в списку.

        У функції `filterByStatus` порівняння статусу написано з помилкою. Які тести впадуть?
      en: |
        A planner app has four tests of its task filter:

        - **A** (unit): `filterByStatus(tasks, "done")` returns only done tasks.
        - **B** (integration): tasks are loaded from storage and shown as a list with the filter “All”.
        - **C** (user-level): clicking the “Done” button leaves only done tasks on the page.
        - **D** (end-to-end): mark a task done, reload the page, switch on “Done” — the task is in the list.

        The status comparison in `filterByStatus` is written wrong. Which tests fail?
    code: |
      export function filterByStatus(tasks, status) {
        if (status === "all") return [...tasks];
        const wantDone = status === "done";
        return tasks.filter((task) => task.done !== wantDone); // should be ===
      }
    runnable: false
    answer:
      type: choice
      options:
        - id: a-c-d
          text: { uk: "A, C і D", en: "A, C and D" }
        - id: only-a
          text: { uk: "Лише A: дефект у функції, тож падає тільки її unit-тест", en: "Only A: the defect is in a function, so only its unit test fails" }
          why:
            uk: "C і D теж викликають `filterByStatus`, коли вмикають фільтр «Виконані», — просто через кнопку й сторінку. Тест падає, якщо дорогою проходить через зламаний рядок коду."
            en: "C and D call `filterByStatus` too when they switch on the “Done” filter — just through the button and the page. A test fails when its path goes through the broken line."
        - id: all-four
          text: { uk: "Усі чотири: код зламано, отже, падає все", en: "All four: the code is broken, so everything fails" }
          why:
            uk: "B вмикає фільтр «Усі», а для нього функція повертає всі справи ще до порівняння. B проходить, хоча дефект є: тест перевіряє лише те, про що питає."
            en: "B uses the filter “All”, and for it the function returns all tasks before the comparison. B passes even though the defect is there: a test checks only what it asks about."
        - id: only-d
          text: { uk: "Лише D: тільки він перевіряє застосунок цілком", en: "Only D: only it checks the whole app" }
          why:
            uk: "Перевіряти «цілком» не означає бачити більше дефектів. A і C теж доходять до зламаного порівняння — і падають, причому A робить це найшвидше."
            en: "Checking “the whole thing” does not mean seeing more defects. A and C reach the broken comparison too — and fail, and A does it fastest."
      correct: [a-c-d]
    explanation:
      uk: "Падають A, C і D: усі три проходять через зламане порівняння. Але лише A одразу каже, *де* дефект, і виконується за мілісекунди; C і D повідомлять тільки, що на сторінці не ті справи. А B проходить, хоч код зламаний. Тому тести, що проходять, — не доказ відсутності помилок: вони доводять лише те, що перевіряють."
      en: "A, C and D fail: all three pass through the broken comparison. But only A says right away *where* the defect is, and it runs in milliseconds; C and D only report that the page shows the wrong tasks. And B passes although the code is broken. So passing tests are not proof that there are no bugs: they prove only what they check."

  - id: reading-results
    kind: explanation
    title:
      uk: "Як читати результат тестів"
      en: "How to read test results"
    body:
      uk: |
        У прикладах і вправах цього розділу тести запускає маленький файл `testing.js`, написаний для курсу. Його можна прочитати, але змінювати не треба. Справжні інструменти — Vitest, Jest — працюють за тією ж ідеєю: `test` реєструє тест, `expect` порівнює, а невдале порівняння кидає помилку, і тест падає.

        Файл `index.js` імпортує файл із тестами й запускає їх. У консолі з’являється по рядку на тест:

        ```text
        ✓ назва тесту, який пройшов
        ✗ назва тесту, який упав — очікувалося …, отримано …
        ```

        Рядок консолі з `✗` — найцінніший: у ньому назва тесту, очікуване й отримане значення. Різниця між ними — перша підказка, де шукати дефект.
      en: |
        In the examples and exercises of this unit the tests are run by a small file, `testing.js`, written for the course. You can read it, but you do not need to change it. The real tools — Vitest, Jest — work on the same idea: `test` registers a test, `expect` compares, and a failed comparison throws an error, so the test fails.

        The file `index.js` imports the test file and runs the tests. The console gets one line per test:

        ```text
        ✓ name of a test that passed
        ✗ name of a test that failed — expected …, got …
        ```

        The console line with `✗` is the most valuable: it holds the test’s name, the expected value and the actual one. The difference between them is the first clue where to look for the defect.

  - id: filter-suite
    kind: example
    runtime: browser-js
    dir: filter-suite
    entry: index.js
    strings:
      t01: { uk: "Полити квіти", en: "Water the plants" }
      t04: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
      t05: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      t06: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
      testDone: { uk: "фільтр «done» лишає тільки виконані справи", en: "the filter “done” keeps only done tasks" }
      testPending: { uk: "фільтр «pending» лишає тільки невиконані справи", en: "the filter “pending” keeps only pending tasks" }
      testAll: { uk: "фільтр «all» лишає всі справи", en: "the filter “all” keeps every task" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Набір тестів для фільтра"
      en: "A test suite for the filter"
    body:
      uk: |
        Тут три unit-тести для `filterByStatus` з файла `tasks.js`, і в цій функції той самий дефект. Натисни **Запустити** й прочитай консоль: які тести впали, що вони очікували й що отримали.

        Тести порівнюють не цілі справи, а лише їхні `id` (`.map((task) => task.id)`) — так результат коротший і його легко прочитати. Для списків тут стоїть `toEqual`, а не `toBe`: `toEqual` порівнює вміст. Чому `toBe` для списків не годиться, з’ясуємо в наступному уроці.
      en: |
        Here are three unit tests for `filterByStatus` from the file `tasks.js`, and that function has the same defect. Press **Run** and read the console: which tests failed, what they expected and what they got.

        The tests do not compare whole tasks, only their `id`s (`.map((task) => task.id)`) — the result is shorter and easy to read. For lists they use `toEqual`, not `toBe`: `toEqual` compares the contents. Why `toBe` does not fit lists is the topic of the next lesson.
    tryIt:
      uk: |
        1. Порівняй рядки консолі з `✗`: для «done» тест отримав саме ті `id`, яких очікував тест для «pending», і навпаки. Отже, умову фільтра перевернуто.
        2. У `tasks.js` заміни `!==` на `===` і запусти знову. Тепер усі три тести з `✓`.
        3. Тест «all» проходив і до виправлення: він не доходить до порівняння. Зміни в ньому `4` на `3` і запусти — так виглядає тест, що падає через помилку в самому тесті. Поверни `4`.
      en: |
        1. Compare the console lines with `✗`: for “done” the test got exactly the `id`s the “pending” test expected, and the other way round. So the filter’s condition is inverted.
        2. In `tasks.js` replace `!==` with `===` and run again. Now all three tests have `✓`.
        3. The “all” test passed even before the fix: it never reaches the comparison. Change `4` to `3` in it and run — this is what a test failing because of a mistake in the test itself looks like. Put `4` back.

  - id: anatomy
    kind: explanation
    title:
      uk: "З чого складається тест"
      en: "What a test is made of"
    body:
      uk: |
        Кожен тест у файлі `tasks.test.js` має три частини:

        1. **Дані** — невеликий зразок, придуманий для тесту: кілька справ з відомими `id` і статусами.
        2. **Виклик** — функція, яку перевіряємо, з цими даними.
        3. **Порівняння** — `expect(отримане).toBe(очікуване)`.

        Очікуване значення ти пишеш **сам**, наперед, з умови задачі: «для цих справ має вийти ось це». Не копіюй його з того, що функція повертає зараз, — тоді тест погодиться і з дефектом.

        `toBe` порівнює числа й текст точно: `"Лампа: 45"` і `"Лампа 45"` — різні значення, бо в другому немає двокрапки. Вгорі файла з тестами завжди два імпорти: `test` і `expect` з `./testing.js` та функція, яку перевіряєш.
      en: |
        Every test in the file `tasks.test.js` has three parts:

        1. **Data** — a small sample made up for the test: a few tasks with known `id`s and statuses.
        2. **The call** — the function under test, called with that data.
        3. **The comparison** — `expect(actual).toBe(expected)`.

        You write the expected value **yourself**, in advance, from the task’s requirements: “for these tasks the result must be this”. Do not copy it from what the function returns right now — then the test agrees with the defect too.

        `toBe` compares numbers and text exactly: `"Lamp: 45"` and `"Lamp 45"` are different values, because the second has no colon. A test file always starts with two imports: `test` and `expect` from `./testing.js`, and the function you are testing.

  - id: first-test
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: first-test
    entry: index.js
    editable: [label.test.js]
    strings:
      noPrice: { uk: "ціну не вказано", en: "no price given" }
      w01: { uk: "Навушники", en: "Headphones" }
      w05: { uk: "Квитки на концерт", en: "Concert tickets" }
      solutionTest: { uk: "показує назву і ціну бажання", en: "shows the wish’s name and price" }
      altTest: { uk: "показує бажання без ціни", en: "shows a wish without a price" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Твій перший тест"
      en: "Your first test"
    instructions:
      uk: |
        У файлі `label.js` готова функція `formatLabel(item)`. Вона повертає текст для бажання в списку: назву, двокрапку, пробіл і ціну, а якщо ціни немає (`price: null`) — слова «ціну не вказано». Наприклад, для бажання з назвою «Велосипед» і ціною `240` вийде `Велосипед: 240`.

        Напиши у файлі `label.test.js` свій перший тест:

        1. Створи зразок бажання — об’єкт з полями `id`, `name`, `price` і `acquired`.
        2. Виклич з ним `formatLabel`.
        3. Порівняй результат через `expect(…).toBe(…)` з точним текстом, який має вийти.

        Натисни **Запустити**: у консолі має з’явитися `✓` і назва твого тесту. Потім **Перевірити**: перевірки запустять твій тест ще й на двох зламаних версіях `formatLabel`, і хороший тест помітить обидві.
      en: |
        The file `label.js` has a ready function `formatLabel(item)`. It returns the text for a wish in the list: the name, a colon, a space and the price, or the words “no price given” when there is no price (`price: null`). For example, a wish named “Bicycle” with the price `240` gives `Bicycle: 240`.

        Write your first test in the file `label.test.js`:

        1. Create a sample wish — an object with the fields `id`, `name`, `price` and `acquired`.
        2. Call `formatLabel` with it.
        3. Compare the result with `expect(…).toBe(…)` against the exact text it must produce.

        Press **Run**: the console should show `✓` and your test’s name. Then press **Check**: the checks also run your test against two broken versions of `formatLabel`, and a good test notices both.
    testTitles:
      "your tests pass with the correct formatLabel":
        uk: "Твої тести є і проходять із правильною `formatLabel`"
        en: "Your tests exist and pass with the correct `formatLabel`"
      "one of your tests fails when the price is missing from the text":
        uk: "Твій тест падає, коли `formatLabel` губить ціну"
        en: "Your test fails when `formatLabel` loses the price"
      "one of your tests fails when the space after the colon is missing":
        uk: "Твій тест падає, коли `formatLabel` губить пробіл після двокрапки"
        en: "Your test fails when `formatLabel` loses the space after the colon"
    hints:
      nudge:
        uk: "Подивись, як побудовано тести у файлі `tasks.test.js` з прикладу про фільтр: дані, виклик функції, `expect`."
        en: "Look at how the tests in `tasks.test.js` from the filter example are built: data, a call of the function, `expect`."
      explanation:
        uk: "`toBe` порівнює текст символ за символом, тому очікуваний текст склади так, як його будує функція: назва, двокрапка, пробіл, ціна. Для іншої функції — скажімо, `formatDue(task)`, що повертає назву справи й дату, — тест виглядав би так: `expect(formatDue(task)).toBe(\"Полити квіти: 2026-03-02\")`. Очікуване значення ти пишеш сам, а не отримуєш від `formatLabel`."
        en: "`toBe` compares text character by character, so build the expected text the way the function builds it: name, colon, space, price. For another function — say, `formatDue(task)`, which returns a task’s title and date — a test would look like this: `expect(formatDue(task)).toBe(\"Water the plants: 2026-03-02\")`. You write the expected value yourself instead of getting it from `formatLabel`."
    solutionNote:
      uk: "Тест має дані (бажання «Навушники» з ціною 80), виклик (`formatLabel(item)`) і порівняння з текстом, написаним наперед. Тому він падає з обома зламаними версіями: одна повертає лише назву, інша губить пробіл. Тест без `expect` або тест, що порівнює `formatLabel` саму з собою, пройшов би завжди — і нічого б не довів."
      en: "The test has data (the wish “Headphones” priced 80), a call (`formatLabel(item)`) and a comparison with text written in advance. That is why it fails with both broken versions: one returns only the name, the other loses the space. A test without `expect`, or one comparing `formatLabel` with itself, would always pass — and prove nothing."
    feedback:
      - when: { test: "your tests pass with the correct formatLabel" }
        message:
          uk: "Ця перевірка очікує, що в `label.test.js` є хоча б один `test(…)` і всі тести проходять із правильною `formatLabel`. Якщо в консолі є `✗`, порівняй «очікувалося» з «отримано»: двокрапка, пробіл і кожна літера мають збігатися. Якщо поруч із `✗` написано `ReferenceError`, якоїсь назви бракує в імпортах угорі файла."
          en: "This check expects at least one `test(…)` in `label.test.js`, with every test passing against the correct `formatLabel`. If the console shows `✗`, compare “expected” with “got”: the colon, the space and every letter must match. If the `✗` line says `ReferenceError`, a name is missing from the imports at the top of the file."
      - when: { test: "one of your tests fails when the price is missing from the text" }
        message:
          uk: "Ця перевірка запускає твої тести з версією `formatLabel`, яка повертає лише назву, і очікує, що хоч один тест упаде. Тест без `expect` або тест, що порівнює `formatLabel` саму з собою, проходить за будь-якого коду — порівнюй із текстом, який написав ти."
          en: "This check runs your tests against a version of `formatLabel` that returns only the name and expects at least one test to fail. A test without `expect`, or one that compares `formatLabel` with itself, passes whatever the code does — compare with text you wrote yourself."
      - when: { test: "one of your tests fails when the space after the colon is missing" }
        message:
          uk: "Ця перевірка запускає твої тести з версією, де після двокрапки немає пробілу, і очікує, що хоч один тест упаде. Таку різницю помічає порівняння всього тексту через `toBe`."
          en: "This check runs your tests against a version without the space after the colon and expects at least one test to fail. Comparing the whole text with `toBe` notices that difference."
      - when: { error: ReferenceError }
        message:
          uk: "У файлі тестів є назва, якої JavaScript не знає. `test`, `expect` і `formatLabel` імпортовано вгорі файла — перевір, що вони написані саме так і що імпорти на місці."
          en: "The test file uses a name JavaScript does not know. `test`, `expect` and `formatLabel` are imported at the top of the file — check that they are spelled exactly like that and that the imports are still there."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: у файлі тестів синтаксична помилка. Найчастіше бракує дужки чи лапки в кінці `test(…, () => { … });` — порахуй, чи кожна відкрита дужка закрита."
          en: "The code could not start: the test file has a syntax error. Most often a bracket or a quote is missing at the end of `test(…, () => { … });` — count whether every opened bracket is closed."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: easiest-to-test
        from: js-03-07-pure-vs-side-effects
        prompt:
          uk: "Яку з трьох функцій найпростіше перевірити unit-тестом?"
          en: "Which of the three functions is the easiest to check with a unit test?"
        answer:
          type: choice
          options:
            - id: pure
              text:
                uk: "`totalPrice(items)`: отримує масив і повертає число, нічого не змінюючи"
                en: "`totalPrice(items)`: receives an array and returns a number, changing nothing"
            - id: page
              text:
                uk: "`showTotal()`: читає бажання з localStorage і пише суму на сторінку"
                en: "`showTotal()`: reads the wishes from localStorage and writes the sum to the page"
              why:
                uk: "Щоб її перевірити, треба підготувати сховище й сторінку, а потім читати сторінку. Вона має побічні ефекти й залежить від зовнішнього стану."
                en: "To check it you have to prepare storage and a page, and then read the page. It has side effects and depends on outside state."
            - id: log
              text:
                uk: "`printTotal(items)`: рахує суму й друкує її через `console.log`, нічого не повертаючи"
                en: "`printTotal(items)`: computes the sum and prints it with `console.log`, returning nothing"
              why:
                uk: "Їй нічого порівнювати: результат іде в консоль, а повертається `undefined`. Тест мав би перехоплювати вивід."
                en: "There is nothing to compare: the result goes to the console and `undefined` is returned. A test would have to capture the output."
          correct: [pure]
        explanation:
          uk: "Чиста функція з тими самими вхідними даними завжди дає той самий результат і нічого не змінює поза собою. Тесту досить викликати її й порівняти повернене значення. Тому доменні функції проєкту пишуть чистими: їх легко тестувати unit-тестами."
          en: "A pure function always gives the same result for the same inputs and changes nothing outside itself. A test only has to call it and compare the returned value. That is why a project’s domain functions are written pure: they are easy to cover with unit tests."

  - id: to-project
    kind: transfer
    capstoneStep: JS-09
    body:
      uk: "У кроці проєкту цього розділу ти напишеш тести для доменних функцій свого проєкту — наприклад, `validateItem` і `summarizeItems` у списку бажань чи `countDueTasks` у планувальнику. Почни з unit-тестів: вони найдешевші й найточніше показують, де дефект."
      en: "In this unit’s project step you will write tests for your project’s domain functions — for example, `validateItem` and `summarizeItems` in the wishlist or `countDueTasks` in the planner. Start with unit tests: they are the cheapest and show most precisely where a defect is."
