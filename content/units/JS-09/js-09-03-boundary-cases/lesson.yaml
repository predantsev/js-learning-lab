id: js-09-03-boundary-cases
unit: JS-09
title:
  uk: "Граничні випадки: порожньо, один, багато, null"
  en: "Boundary cases: empty, one, many, null"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Перелічити граничні вхідні дані функції (порожньо, один, багато, null чи відсутнє поле, точні межі на кшталт 80 і 81 символу) і написати по тесту на кожну межу."
    en: "List the boundary inputs of a function (empty, one, many, null or missing, exact limits such as 80 versus 81 characters) and write one test per boundary."
  - uk: "Віднести повідомлення про помилку до граничного випадку й назвати тест, який її впіймав би."
    en: "Classify a bug report by the boundary it belongs to and name the test that would have caught it."
prerequisites: [js-09-02-assertions, js-02-11-independent-validation]
subskills:
  - { family: P-04, skill: "assertions/boundaries", depth: practice }
glossary: [boundary-case]
selfCheck: [which-break, report-to-test, habit-boundaries]

blocks:
  - id: edges
    kind: explanation
    title:
      uk: "Дефекти живуть на краях"
      en: "Defects live at the edges"
    body:
      uk: |
        Звичайні дані — три-чотири записи з нормальними назвами й цінами — майже завжди працюють: на них код і писали. Ламається він на краях: коли список порожній, коли в записі `null`, коли назва рівно на межі дозволеної довжини. Такі вхідні дані називають [[boundary-case|граничними випадками]].

        Перелік, з яким варто підходити до кожної функції:

        | Межа | Приклади |
        |---|---|
        | Кількість | порожній список, один запис, багато записів |
        | Відсутнє значення | `null`, поле, якого немає, порожній текст `""`, текст із самих пробілів |
        | Точна межа | рівно 80 символів і 81; `0` і `-1`; сьогоднішня дата і вчорашня |

        Перевіряй **обидва** боки межі: 80 має пройти, а 81 — ні. Тест лише на 81 не помітить, якщо хтось помилково відкине і 80.
      en: |
        Ordinary data — three or four records with normal names and prices — almost always works: that is what the code was written for. It breaks at the edges: when the list is empty, when a record holds `null`, when a name is exactly at the length limit. Such inputs are called [[boundary-case|boundary cases]].

        A list to bring to every function:

        | Boundary | Examples |
        |---|---|
        | Count | an empty list, one record, many records |
        | Missing value | `null`, a field that is not there, empty text `""`, text of spaces only |
        | Exact limit | exactly 80 characters and 81; `0` and `-1`; today’s date and yesterday’s |

        Check **both** sides of a limit: 80 must pass and 81 must not. A test only for 81 will not notice if someone wrongly rejects 80 too.

  - id: which-break
    kind: prediction
    prompt:
      uk: "За правилом списку бажань середня ціна рахується лише серед бажань **з ціною**, а коли таких немає, функція має повернути `null`. Ось перша версія `averagePrice` і чотири виклики. Які з них дають **неправильну** відповідь?"
      en: "By the wishlist rule, the average price counts only wishes **with a price**, and when there are none the function must return `null`. Here is a first version of `averagePrice` and four calls. Which of them give a **wrong** answer?"
    code: |
      function averagePrice(items) {
        let sum = 0;
        for (const item of items) {
          sum += item.price;
        }
        return sum / items.length;
      }

      const many = [];
      for (let i = 1; i <= 1000; i++) {
        many.push({ id: `w-${i}`, price: 10 });
      }

      console.log(averagePrice([]));                                  // empty
      console.log(averagePrice([{ id: "w-02", price: 45 }]));         // one
      console.log(averagePrice([{ id: "w-01", price: 80 }, { id: "w-05", price: null }])); // null price
      console.log(averagePrice(many));                                // many
    verify: { logs: ["NaN", "45", "40", "10"] }
    answer:
      type: multi
      options:
        - id: empty
          text: { uk: "Порожній список", en: "The empty list" }
        - id: one
          text: { uk: "Одне бажання", en: "One wish" }
          why:
            uk: "Сума `45`, поділена на `1`, дає `45` — саме те, що треба."
            en: "The sum `45` divided by `1` gives `45` — exactly right."
        - id: null-price
          text: { uk: "Бажання з ціною `null`", en: "A wish with the price `null`" }
        - id: many
          text: { uk: "1000 бажань", en: "1,000 wishes" }
          why:
            uk: "Велика кількість — не завжди межа. Тут 1000 бажань по `10` дають рівно `10`: цикл обробляє довгий список так само, як короткий."
            en: "A large count is not always a boundary. Here 1,000 wishes at `10` give exactly `10`: the loop handles a long list the same way as a short one."
      correct: [empty, null-price]
    explanation:
      uk: "Порожній список дає `0 / 0`, тобто `NaN`, а мав би дати `null`. Для `[80, null]` функція додає `null` як `0` (`80 + null` — це `80`) і ділить на `2`: виходить `40` замість `80`. Обидва дефекти сидять на краях — і обидва мовчазні: помилки немає, просто неправильне число. А 1000 записів працюють: «гранично» не означає «дуже багато»."
      en: "The empty list gives `0 / 0`, that is `NaN`, where it should give `null`. For `[80, null]` the function adds `null` as `0` (`80 + null` is `80`) and divides by `2`: that is `40` instead of `80`. Both defects sit at the edges — and both are silent: no error, just a wrong number. And 1,000 records work: “boundary” does not mean “very many”."

  - id: name-boundaries
    kind: example
    runtime: browser-js
    dir: name-boundaries
    entry: index.js
    strings:
      w03: { uk: "Велосипед", en: "Bicycle" }
      cTypical: { uk: "звичайна назва — дійсна", en: "a typical name is valid" }
      cEmpty: { uk: "порожня назва — недійсна", en: "an empty name is invalid" }
      cSpaces: { uk: "назва з самих пробілів — недійсна", en: "a name of spaces only is invalid" }
      cOne: { uk: "1 символ — дійсна", en: "1 character is valid" }
      c80: { uk: "рівно 80 символів — дійсна", en: "exactly 80 characters is valid" }
      c81: { uk: "81 символ — недійсна", en: "81 characters is invalid" }
      c80Padded: { uk: "80 символів із пробілами довкола — дійсна", en: "80 characters with spaces around is valid" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Таблиця граничних тестів"
      en: "A table of boundary tests"
    body:
      uk: |
        Назва бажання дійсна, якщо після обрізання пробілів довкола (`trim`) у ній від 1 до 80 символів. Тести тут записано **таблицею**: кожен рядок масиву `cases` — назва тесту, вхідний текст і чи має він пройти. Цикл `for…of` перетворює кожен рядок на окремий тест.

        `"a".repeat(80)` — це текст із 80 літер `a`: так зручно отримати рівно потрібну довжину.

        Запусти: усі сім тестів проходять.
      en: |
        A wish name is valid when it has 1 to 80 characters after trimming the spaces around it (`trim`). The tests here are written as a **table**: every row of the `cases` array is a test name, the input text and whether it must be valid. The `for…of` loop turns each row into a separate test.

        `"a".repeat(80)` is a text of 80 letters `a`: a handy way to get exactly the length you need.

        Run it: all seven tests pass.
    tryIt:
      uk: |
        1. У `wishes.js` заміни `80` на `79` і запусти. Падають рівно ті тести, що стоять на межі: «рівно 80 символів» і «80 символів із пробілами». Звичайна назва далі проходить — вона далеко від межі.
        2. Тепер заміни `79` на `81` і запусти. Цього разу падає тест «81 символ».
        3. Поверни `80`. Кожну зсунуту межу впіймав свій тест — саме тому перевіряють обидва її боки.
      en: |
        1. In `wishes.js` replace `80` with `79` and run. Exactly the tests sitting on the limit fail: “exactly 80 characters” and “80 characters with spaces around”. The typical name still passes — it is far from the limit.
        2. Now replace `79` with `81` and run. This time the “81 characters” test fails.
        3. Put `80` back. Each shifted limit was caught by its own test — that is why both sides of a limit are checked.

  - id: report-to-test
    kind: prediction
    prompt:
      uk: "Користувач трекера звичок пише: «Звичку з назвою рівно 80 символів зберегти не вдається, а з назвою на 79 символів — вдається». Який тест упіймав би цей дефект ще до того, як застосунок потрапив до користувачів?"
      en: "A habit tracker user writes: “A habit whose name is exactly 80 characters cannot be saved, but one with 79 characters can.” Which test would have caught this defect before the app reached users?"
    answer:
      type: choice
      options:
        - id: exact-80
          text: { uk: "Тест, що назва рівно на 80 символів — дійсна", en: "A test that a name of exactly 80 characters is valid" }
        - id: typical
          text: { uk: "Тест зі звичайною назвою «Пити воду»", en: "A test with the typical name “Drink water”" }
          why:
            uk: "Звичайна назва далеко від межі: з таким дефектом вона далі проходить."
            en: "A typical name is far from the limit: with this defect it still passes."
        - id: many
          text: { uk: "Тест із тисячею звичок", en: "A test with a thousand habits" }
          why:
            uk: "Дефект не в кількості звичок, а в довжині однієї назви. Межа тут — 80 символів."
            en: "The defect is not about the number of habits but about the length of one name. The boundary here is 80 characters."
        - id: empty
          text: { uk: "Тест, що порожня назва — недійсна", en: "A test that an empty name is invalid" }
          why:
            uk: "Це інший край того самого правила: нижня межа. Дефект сидить на верхній — на 80."
            en: "That is the other edge of the same rule: the lower limit. The defect sits at the upper one — at 80."
      correct: [exact-80]
    explanation:
      uk: "Це дефект точної межі: найімовірніше, у коді `>= 80` замість `> 80`. Його ловить лише тест, що стоїть рівно на межі. Коли приходить повідомлення про помилку, спершу назви межу («точна межа — 80»), а потім напиши тест саме для неї."
      en: "This is an exact-limit defect: most likely the code says `>= 80` instead of `> 80`. Only a test sitting exactly on the limit catches it. When a bug report arrives, first name the boundary (“exact limit — 80”), then write a test for exactly that."

  - id: habit-boundaries
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: habit-boundaries
    entry: index.js
    editable: [habits.test.js]
    strings:
      h01: { uk: "Ранкова зарядка", en: "Morning exercise" }
      h03: { uk: "Пити воду", en: "Drink water" }
      h04: { uk: "Прибирання", en: "Tidy up" }
      h06: { uk: "Прогулянка", en: "Go for a walk" }
      tTypical: { uk: "звичайна назва — дійсна", en: "a typical name is valid" }
      tOther: { uk: "інші звичайні назви — теж дійсні", en: "other typical names are valid too" }
      tEmpty: { uk: "порожня назва дає помилку required", en: "an empty name gives the error required" }
      tSpaces: { uk: "назва з самих пробілів дає помилку required", en: "a name of spaces only gives the error required" }
      t80: { uk: "рівно 80 символів — дійсна", en: "exactly 80 characters is valid" }
      t81: { uk: "81 символ дає помилку too-long", en: "81 characters gives the error too-long" }
      tNoFrequency: { uk: "без frequency частота — daily", en: "no frequency means daily" }
      mTypical: { uk: "звичайна назва", en: "typical name" }
      mEmpty: { uk: "порожня назва", en: "empty name" }
      mSpaces: { uk: "назва з пробілів", en: "name of spaces" }
      m80: { uk: "назва на 80 символів", en: "name of 80 characters" }
      m81: { uk: "назва на 81 символ", en: "name of 81 characters" }
      mNoFrequency: { uk: "чернетка без frequency", en: "draft without frequency" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Граничні тести для validateHabit"
      en: "Boundary tests for validateHabit"
    instructions:
      uk: |
        У `habits.js` — `validateHabit` з проєкту трекера звичок. Її правила:

        - `name` після обрізання пробілів довкола має містити від 1 до 80 символів; порожня назва дає помилку `"required"`, задовга — `"too-long"`;
        - `frequency` — необов’язкове поле: якщо його немає, береться `"daily"`;
        - функція повертає `{ ok: true, value: { name, frequency } }` або `{ ok: false, errors: { … } }`.

        У файлі тестів уже є тест для звичайної назви. Додай по тесту на кожну межу:

        1. порожня назва `""`;
        2. назва з самих пробілів;
        3. назва рівно на 80 символів (дійсна);
        4. назва на 81 символ (недійсна);
        5. чернетка взагалі без поля `frequency` (дійсна, частота — `"daily"`).

        Перевірки запустять твої тести з чотирма зламаними версіями `validateHabit` — кожна зламана на одній межі.
      en: |
        `habits.js` holds `validateHabit` from the habit tracker project. Its rules:

        - `name`, after trimming the spaces around it, must have 1 to 80 characters; an empty name gives the error `"required"`, a too long one `"too-long"`;
        - `frequency` is an optional field: when it is missing, `"daily"` is used;
        - the function returns `{ ok: true, value: { name, frequency } }` or `{ ok: false, errors: { … } }`.

        The test file already has a test for a typical name. Add one test per boundary:

        1. an empty name `""`;
        2. a name of spaces only;
        3. a name of exactly 80 characters (valid);
        4. a name of 81 characters (invalid);
        5. a draft without the `frequency` field at all (valid, frequency `"daily"`).

        The checks run your tests against four broken versions of `validateHabit` — each broken at one boundary.
    testTitles:
      "your tests pass with the correct validateHabit":
        uk: "Твої тести проходять із правильною `validateHabit`"
        en: "Your tests pass with the correct `validateHabit`"
      "one of your tests fails when spaces around the name are not trimmed":
        uk: "Твій тест падає, коли пробіли довкола назви не обрізаються"
        en: "Your test fails when the spaces around the name are not trimmed"
      "one of your tests fails when a name of exactly 80 characters is rejected":
        uk: "Твій тест падає, коли назву рівно на 80 символів відкинуто"
        en: "Your test fails when a name of exactly 80 characters is rejected"
      "one of your tests fails when a name of 81 characters is accepted":
        uk: "Твій тест падає, коли назву на 81 символ прийнято"
        en: "Your test fails when a name of 81 characters is accepted"
      "one of your tests fails when a missing frequency is not treated as daily":
        uk: "Твій тест падає, коли відсутню `frequency` не вважають `\"daily\"`"
        en: "Your test fails when a missing `frequency` is not treated as `\"daily\"`"
    hints:
      nudge:
        uk: "Згадай таблицю меж: відсутнє значення, точна межа з обох боків. Назву потрібної довжини зручно зробити через `repeat`."
        en: "Recall the boundary table: a missing value, an exact limit from both sides. A name of the length you need is easy to make with `repeat`."
      explanation:
        uk: "Для меж 80 і 81 потрібні два тести: один на самій межі (80 — дійсна), другий одразу за нею (81 — недійсна). 79 і 82 не годяться: зсув межі на один символ вони не помітять. Для поля, якого немає, просто не пиши його в об’єкті. Так виглядав би схожий тест для витрати: `expect(validateExpense({ label: \"x\".repeat(30), amountMinor: 100 }).ok, \"мітка на 30 символів\").toBe(true)`."
        en: "For the limits 80 and 81 you need two tests: one right on the limit (80 is valid) and one just past it (81 is invalid). 79 and 82 will not do: they do not notice the limit moving by one character. For a field that is missing, just leave it out of the object. A similar test for an expense would look like this: `expect(validateExpense({ label: \"x\".repeat(30), amountMinor: 100 }).ok, \"label of 30 characters\").toBe(true)`."
    solutionNote:
      uk: "Кожна межа отримала свій тест, і кожна зламана версія падає на «своєму»: без `trim` — на назві з пробілів, `>= 80` — на 80 символах, `> 81` — на 81, без `?? \"daily\"` — на чернетці без частоти. Звичайна назва не впіймала жодної з цих версій."
      en: "Every boundary got its own test, and every broken version fails on “its” test: no `trim` on the name of spaces, `>= 80` on 80 characters, `> 81` on 81, no `?? \"daily\"` on the draft without a frequency. The typical name caught none of these versions."
    feedback:
      - when: { test: "your tests pass with the correct validateHabit" }
        message:
          uk: "Ця перевірка очікує, що всі твої тести проходять із правильною `validateHabit`. Перевір очікування за правилами: 80 символів — ще дійсна назва, 81 — вже ні; без `frequency` чернетка дійсна."
          en: "This check expects all your tests to pass with the correct `validateHabit`. Check your expectations against the rules: 80 characters is still a valid name, 81 is not; a draft without `frequency` is valid."
      - when: { test: "one of your tests fails when spaces around the name are not trimmed" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили з правильним кодом (див. першу перевірку). Потім вона запускає твої тести з версією без `trim` і очікує, що хоч один упаде. Потрібен тест, де назва складається лише з пробілів і має бути недійсною."
          en: "This check first needs all your tests to pass with the correct code (see the first check). Then it runs your tests against a version without `trim` and expects at least one to fail. You need a test where the name is only spaces and must be invalid."
      - when: { test: "one of your tests fails when a name of exactly 80 characters is rejected" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили з правильним кодом (див. першу перевірку). Потім вона запускає твої тести з версією, що відкидає вже 80 символів, і очікує, що хоч один упаде. Потрібен тест саме на 80 символів, що чекає дійсної назви; 79 цього зсуву не помітить."
          en: "This check first needs all your tests to pass with the correct code (see the first check). Then it runs your tests against a version that already rejects 80 characters and expects at least one to fail. You need a test of exactly 80 characters that expects a valid name; 79 will not notice that shift."
      - when: { test: "one of your tests fails when a name of 81 characters is accepted" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили з правильним кодом (див. першу перевірку). Потім вона запускає твої тести з версією, що приймає 81 символ, і очікує, що хоч один упаде. Потрібен тест саме на 81 символ, що чекає недійсної назви; 82 цього зсуву не помітить."
          en: "This check first needs all your tests to pass with the correct code (see the first check). Then it runs your tests against a version that accepts 81 characters and expects at least one to fail. You need a test of exactly 81 characters that expects an invalid name; 82 will not notice that shift."
      - when: { test: "one of your tests fails when a missing frequency is not treated as daily" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили з правильним кодом (див. першу перевірку). Потім вона запускає твої тести з версією, що не підставляє `\"daily\"`, і очікує, що хоч один упаде. Потрібен тест із чернеткою, у якій поля `frequency` немає зовсім, — вона має бути дійсною."
          en: "This check first needs all your tests to pass with the correct code (see the first check). Then it runs your tests against a version that does not fill in `\"daily\"` and expects at least one to fail. You need a test with a draft that has no `frequency` field at all — it must be valid."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: у файлі тестів синтаксична помилка. Перевір дужки й коми, особливо в об’єктах `{ name: …, frequency: … }` усередині виклику."
          en: "The code could not start: the test file has a syntax error. Check the brackets and commas, especially in the objects `{ name: …, frequency: … }` inside a call."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: missing-or-not
        from: js-02-11-independent-validation
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          console.log(typeof NaN, 0 ?? "missing", null ?? "missing");
        verify: { logs: ["number 0 missing"] }
        answer:
          type: choice
          options:
            - id: right
              code: "number 0 missing"
            - id: zero-missing
              code: "number missing missing"
              why:
                uk: "`??` підставляє запасне значення лише для `null` і `undefined`. Нуль — справжнє значення, а не відсутнє."
                en: "`??` uses the fallback only for `null` and `undefined`. Zero is a real value, not a missing one."
            - id: nan-type
              code: "NaN 0 missing"
              why:
                uk: "`NaN` має тип `\"number\"` — тому валідація чисел окремо перевіряє `Number.isNaN`."
                en: "`NaN` has the type `\"number\"` — that is why number validation checks `Number.isNaN` separately."
          correct: [right]
        explanation:
          uk: "`typeof NaN` — `\"number\"`, `0 ?? \"missing\"` — `0`, бо нуль не відсутній, а `null ?? \"missing\"` — `\"missing\"`. Саме такі значення — `0`, `NaN`, `null`, `\"\"` — і стають граничними випадками в тестах валідації."
          en: "`typeof NaN` is `\"number\"`, `0 ?? \"missing\"` is `0` because zero is not missing, and `null ?? \"missing\"` is `\"missing\"`. Exactly these values — `0`, `NaN`, `null`, `\"\"` — become the boundary cases in validation tests."

  - id: to-project
    kind: transfer
    capstoneStep: JS-09
    body:
      uk: "Перш ніж писати тести для свого проєкту, випиши межі кожної доменної функції: порожній список, один запис, `null` (ціна бажання, `dueDate` справи), точні межі (80 і 81 символ назви, сьогоднішня дата). Кожна межа — окремий тест."
      en: "Before you write tests for your project, list the boundaries of every domain function: an empty list, one record, `null` (a wish’s price, a task’s `dueDate`), exact limits (80 and 81 characters in a name, today’s date). Every boundary is a separate test."
