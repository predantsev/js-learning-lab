        uk: "Твій тест падає, коли `saveBooks` нічого не зберігає"
        en: "Your test fails when `saveBooks` saves nothing"
      "one of your tests fails when submitting the form adds no book":
        uk: "Твій тест падає, коли надсилання форми не додає книжки"
        en: "Your test fails when submitting the form adds no book"
    solutionNote:
      uk: "Функції `books.js` повертають нові масиви (spread, `map`, `filter`) і не чіпають переданих. `loadBooks` перехоплює `SyntaxError` від `JSON.parse`, перевіряє версію й масив і фільтрує записи через `isBook`. Один обробник `submit` на `root` працює і для форми, яку перемалювали. Тести використовують свіжі дані й підробку сховища в кожному тесті, тому кожен із шести дефектів ловить «свій» тест."
      en: "The functions in `books.js` return new arrays (spread, `map`, `filter`) and leave the ones passed in alone. `loadBooks` catches the `SyntaxError` from `JSON.parse`, checks the version and the array, and filters the records through `isBook`. One `submit` handler on `root` also works for a form that was redrawn. The tests use fresh data and a fake storage in every test, so each of the six defects is caught by “its” test."
    feedback:
      - when: { test: "addBook returns a new list with the book at the end" }
        message:
          uk: "Ця перевірка очікує новий масив із книжкою в кінці, а переданий масив — без змін."
          en: "This check expects a new array with the book at the end, and the array passed in unchanged."
      - when: { test: "updateBook replaces one book with an updated copy" }
        message:
          uk: "Ця перевірка очікує новий масив, де книжку з цим `id` замінено копією зі змінами, інші книжки — ті самі об’єкти, а переданий масив і його записи не змінилися."
          en: "This check expects a new array where the book with this `id` is replaced by a copy with the changes, the other books are the same objects, and the array passed in and its records are unchanged."
      - when: { test: "removeBook leaves out the book with that id" }
        message:
          uk: "Ця перевірка очікує новий масив без книжки з цим `id`; переданий масив має лишитися з трьома книжками."
          en: "This check expects a new array without the book with this `id`; the array passed in must still hold three books."
      - when: { test: "booksWithStatus keeps the books with the status, and all of them for all" }
        message:
          uk: "Ця перевірка очікує лише книжки з указаним статусом у їхньому порядку, `[]`, коли таких немає, і всі книжки для `\"all\"`."
          en: "This check expects only the books with the given status in their order, `[]` when there are none, and every book for `\"all\"`."
      - when: { test: "saveBooks writes schemaVersion 1 and the books under jsll.reading.v1" }
        message:
          uk: "Ця перевірка очікує під ключем `jsll.reading.v1` JSON-текст об’єкта `{ schemaVersion: 1, books }`."
          en: "This check expects the JSON text of the object `{ schemaVersion: 1, books }` under the key `jsll.reading.v1`."
      - when: { test: "loadBooks gives [] for missing, unparsable or wrong-version data" }
        message:
          uk: "Ця перевірка очікує `[]` без помилки для: нічого не збережено, текст не JSON, `schemaVersion` не 1, `books` не масив, текст `null`; і самі книжки для правильних даних."
          en: "This check expects `[]` without an error for: nothing saved, text that is not JSON, `schemaVersion` other than 1, `books` that is not an array, the text `null`; and the books themselves for valid data."
      - when: { test: "loadBooks leaves out invalid records" }
        message:
          uk: "Ця перевірка зберігає вперемішку дійсні й недійсні записи (`null`, `id`-число, назва з пробілів, невідомий статус) і очікує лише дійсні, у їхньому порядку."
          en: "This check stores valid and invalid records mixed together (`null`, a number `id`, a title of spaces, an unknown status) and expects only the valid ones, in their order."
      - when: { test: "mount shows the books already in storage" }
        message:
          uk: "Ця перевірка кладе три книжки в підробку сховища, викликає `mount` і очікує три пункти списку."
          en: "This check puts three books into a fake storage, calls `mount` and expects three list items."
      - when: { test: "submitting the form adds a book, shows it and saves it" }
        message:
          uk: "Ця перевірка вводить назву з пробілами довкола, надсилає форму й очікує: стандартну дію скасовано, у списку один пункт із назвою, у сховищі — книжка зі статусом `\"to-read\"`. Після другого надсилання — дві книжки з різними `id`."
          en: "This check types a title with spaces around it, submits the form and expects: the default action cancelled, one list item with the title, a book with the status `\"to-read\"` in storage. After a second submit — two books with different `id`s."
      - when: { test: "a title of spaces adds nothing" }
        message:
          uk: "Ця перевірка надсилає назву з самих пробілів і очікує, що в списку й сховищі нічого не з’явиться."
          en: "This check submits a title of spaces only and expects nothing to appear in the list or in storage."
      - when: { test: "a title longer than 80 characters adds nothing, and one of exactly 80 is added" }
        message:
          uk: "Ця перевірка надсилає назву з 81 символу й очікує, що нічого не додано, а потім назву рівно з 80 символів — і очікує один пункт списку. Дозволено від 1 до 80 символів включно, після обрізання пробілів."
          en: "This check submits a title of 81 characters and expects nothing to be added, then a title of exactly 80 characters and expects one list item. 1 to 80 characters inclusive are allowed, after trimming."
      - when: { test: "the submit is handled by one listener on root" }
        message:
          uk: "Ця перевірка замінює форму її копією (у копії немає власних обробників) і надсилає її. Додати книжку зможе лише обробник на `root`."
          en: "This check replaces the form with a copy of it (the copy has no handlers of its own) and submits it. Only a handler on `root` can add the book."
      - when: { test: "your tests pass with the reference modules" }
        message:
          uk: "Ця перевірка запускає твій `books.test.js` з еталонними модулями й очікує, що всі тести пройдуть. Тести мають покладатися лише на те, що описано в умові: підготовлені тобою дані, `STORAGE_KEY`, `MARKUP` і поля книжки."
          en: "This check runs your `books.test.js` with reference modules and expects every test to pass. The tests may rely only on what the task describes: data you prepared, `STORAGE_KEY`, `MARKUP` and the book’s fields."
      - when: { test: "one of your tests fails when loadBooks gives null for empty storage" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили з еталонними модулями (див. перевірку про них). Потім вона запускає твої тести з `loadBooks`, яка для порожнього сховища повертає `null`, і очікує, що хоч один упаде."
          en: "This check first needs all your tests to pass with the reference modules (see that check). Then it runs your tests with a `loadBooks` that returns `null` for empty storage and expects at least one to fail."
      - when: { test: "one of your tests fails when addBook changes the list it receives" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили з еталонними модулями (див. перевірку про них). Потім вона запускає твої тести з `addBook`, яка додає книжку в сам переданий масив, і очікує, що хоч один упаде."
          en: "This check first needs all your tests to pass with the reference modules (see that check). Then it runs your tests with an `addBook` that pushes the book into the array passed in and expects at least one to fail."
      - when: { test: "one of your tests fails when booksWithStatus ignores the status" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили з еталонними модулями (див. перевірку про них). Потім вона запускає твої тести з `booksWithStatus`, що повертає всі книжки, і очікує, що хоч один упаде."
          en: "This check first needs all your tests to pass with the reference modules (see that check). Then it runs your tests with a `booksWithStatus` that returns every book and expects at least one to fail."
      - when: { test: "one of your tests fails when loadBooks throws on text that is not JSON" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили з еталонними модулями (див. перевірку про них). Потім вона запускає твої тести з `loadBooks`, що не перехоплює помилку `JSON.parse`, і очікує, що хоч один упаде."
          en: "This check first needs all your tests to pass with the reference modules (see that check). Then it runs your tests with a `loadBooks` that does not catch the `JSON.parse` error and expects at least one to fail."
      - when: { test: "one of your tests fails when saveBooks saves nothing" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили з еталонними модулями (див. перевірку про них). Потім вона запускає твої тести з `saveBooks`, що нічого не пише у сховище, і очікує, що хоч один упаде."
          en: "This check first needs all your tests to pass with the reference modules (see that check). Then it runs your tests with a `saveBooks` that writes nothing to storage and expects at least one to fail."
      - when: { test: "one of your tests fails when submitting the form adds no book" }
        message:
          uk: "Ця перевірка спершу вимагає, щоб усі твої тести проходили з еталонними модулями (див. перевірку про них). Потім вона запускає твої тести з `mount`, де надсилання форми нічого не додає, і очікує, що хоч один упаде."
          en: "This check first needs all your tests to pass with the reference modules (see that check). Then it runs your tests with a `mount` where submitting the form adds nothing and expects at least one to fail."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: синтаксична помилка в одному з файлів — назву файла й рядок видно в картці помилки."
          en: "The code could not start: one of the files has a syntax error — the error card shows the file name and line."
      - when: { error: TypeError }
        message:
          uk: "Під час запуску сталася `TypeError`. Якщо вона в `ui.js` чи `storage.js`, сторінка не змонтувалася — подивись на рядок у картці помилки й перевір, що кожна функція повертає те, що описано над нею."
          en: "A `TypeError` happened while starting. If it is in `ui.js` or `storage.js`, the page did not mount — look at the line in the error card and check that every function returns what its comment describes."

  - id: to-project
    kind: transfer
    capstoneStep: JS-09
    body:
      uk: "Те саме тепер у твоєму проєкті: тести для валідації, фільтра, сортування й похідного значення доменних функцій, свіжі фікстури й зафіксований «сьогодні» — і закладений дефект, який ці тести мають знайти."
      en: "Now the same in your project: tests for the validation, filter, sort and derived value of your domain functions, fresh fixtures and a fixed today — and a seeded defect these tests must find."
