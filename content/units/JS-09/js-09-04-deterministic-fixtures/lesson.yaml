id: js-09-04-deterministic-fixtures
unit: JS-09
title:
  uk: "Детерміновані фікстури та зафіксований «сьогодні»"
  en: "Deterministic fixtures and a fixed clock"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Зробити функцію, що залежить від дати, придатною до тестування: передавати «сьогодні» параметром, а не читати годинник усередині."
    en: "Make a date-dependent function testable by passing today in as a parameter instead of reading the clock inside it."
  - uk: "Будувати кожен тест зі свіжих синтетичних фікстур, щоб порядок тестів і попередні тести не впливали на результат."
    en: "Build each test from fresh synthetic fixtures so test order and earlier tests cannot change the result."
prerequisites: [js-09-03-boundary-cases, js-04-10-immutable-updates]
subskills:
  - { family: P-04, skill: "deterministic fixtures", depth: intro }
glossary: [test-fixture, deterministic-test, fixed-clock, flaky-test]
selfCheck: [clock-predict, fresh-habits]

blocks:
  - id: the-calendar
    kind: explanation
    title:
      uk: "Тест, що залежить від календаря"
      en: "A test that depends on the calendar"
    body:
      uk: |
        Справа прострочена, якщо вона не виконана, має термін і цей термін раніше за сьогодні. Перша думка — дізнатися «сьогодні» всередині функції:

        ```js
        function isOverdue(task) {
          const today = new Date().toISOString().slice(0, 10); // "YYYY-MM-DD" today
          return !task.done && task.dueDate !== null && task.dueDate < today;
        }
        ```

        `new Date()` — поточний момент за годинником комп’ютера. Тепер результат залежить не лише від `task`, а й від того, **коли** запустили код. Тест для такої функції сьогодні проходить, а за тиждень падає, хоча код ніхто не чіпав.

        Тест, який з тим самим кодом дає той самий результат будь-коли й на будь-якому комп’ютері, називають [[deterministic-test|детермінованим]].
      en: |
        A task is overdue when it is not done, has a due date, and that date is before today. The first idea is to find out “today” inside the function:

        ```js
        function isOverdue(task) {
          const today = new Date().toISOString().slice(0, 10); // "YYYY-MM-DD" today
          return !task.done && task.dueDate !== null && task.dueDate < today;
        }
        ```

        `new Date()` is the current moment by the computer’s clock. Now the result depends not only on `task` but also on **when** the code runs. A test for such a function passes today and fails in a week, although nobody touched the code.

        A test that gives the same result with the same code at any time and on any computer is called [[deterministic-test|deterministic]].

  - id: clock-predict
    kind: prediction
    prompt:
      uk: "Функція `isOverdue(task)` усередині бере сьогоднішню дату з `new Date()`. Тест перевіряє, що справа з `dueDate: \"2026-03-02\"` (не виконана) **не** прострочена: `expect(isOverdue(task)).toBe(false)`. Що буде, якщо запустити цей тест 1 березня 2026 року, а потім 3 березня 2026 року?"
      en: "The function `isOverdue(task)` takes today’s date from `new Date()` inside. A test checks that a task with `dueDate: \"2026-03-02\"` (not done) is **not** overdue: `expect(isOverdue(task)).toBe(false)`. What happens if this test runs on March 1, 2026, and then on March 3, 2026?"
    answer:
      type: choice
      options:
        - id: pass-then-fail
          text: { uk: "1 березня проходить, 3 березня падає", en: "It passes on March 1 and fails on March 3" }
        - id: pass-both
          text: { uk: "Проходить обидва рази: код той самий", en: "It passes both times: the code is the same" }
          why:
            uk: "Код той самий, але `new Date()` повертає інший день. 3 березня термін `2026-03-02` уже позаду, і функція чесно повертає `true`."
            en: "The code is the same, but `new Date()` returns a different day. On March 3 the due date `2026-03-02` is already past, and the function honestly returns `true`."
        - id: fail-both
          text: { uk: "Падає обидва рази", en: "It fails both times" }
          why:
            uk: "1 березня термін ще попереду: `\"2026-03-02\" < \"2026-03-01\"` — хибно, тож функція повертає `false`, як і чекає тест."
            en: "On March 1 the due date is still ahead: `\"2026-03-02\" < \"2026-03-01\"` is false, so the function returns `false`, as the test expects."
        - id: fail-then-pass
          text: { uk: "1 березня падає, 3 березня проходить", en: "It fails on March 1 and passes on March 3" }
          why:
            uk: "Навпаки: до терміну справа не прострочена (тест проходить), після — прострочена (тест падає)."
            en: "The other way round: before the due date the task is not overdue (the test passes), after it, it is (the test fails)."
      correct: [pass-then-fail]
    explanation:
      uk: "Результат тесту залежить від дня запуску, а не від коду. Такий тест рано чи пізно впаде в когось на комп’ютері без жодної зміни в коді — і всі витратять час, шукаючи дефект, якого немає. Вихід — не читати годинник у функції, а передати «сьогодні» параметром."
      en: "The test’s result depends on the day it runs, not on the code. Sooner or later such a test fails on someone’s computer without any change to the code — and everyone wastes time hunting a defect that is not there. The way out is not to read the clock inside the function but to pass “today” in as a parameter."

  - id: clock
    kind: example
    runtime: browser-js
    dir: clock
    entry: index.js
    strings:
      t01: { uk: "Полити квіти", en: "Water the plants" }
      tNotOverdue: { uk: "справа з терміном 2026-03-02 не прострочена", en: "a task due 2026-03-02 is not overdue" }
      mOverdue: { uk: "isOverdue", en: "isOverdue" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Зафіксуй «сьогодні»"
      en: "Fix “today” in place"
    body:
      uk: |
        Тут `isOverdue` ще читає годинник. Запусти: якщо сьогодні пізніше за 2 березня 2026 року, тест падає з `очікувалося false, отримано true`. Код при цьому правильний — неправильний тест, бо він залежить від календаря.

        Виправимо це так, як у твоєму проєкті: функція отримує «сьогодні» параметром. Такий прийом називають [[fixed-clock|зафіксованим годинником]]: у тесті «сьогодні» — це будь-яка дата, яку ти вибереш.
      en: |
        Here `isOverdue` still reads the clock. Run it: if today is later than March 2, 2026, the test fails with `expected false, got true`. The code is right — the test is wrong, because it depends on the calendar.

        Let’s fix this the way your project does it: the function receives “today” as a parameter. This technique is called a [[fixed-clock|fixed clock]]: in a test, “today” is any date you choose.
    tryIt:
      uk: |
        1. У `tasks.js` зміни заголовок функції на `isOverdue(task, today)` і видали рядок з `new Date()`.
        2. У тесті виклич `isOverdue(task, "2026-03-01")` і запусти. Тест проходить — і проходитиме будь-коли.
        3. Скопіюй тест, дай копії назву на кшталт «справа з терміном 2026-03-02 прострочена 3 березня» і в ній виклич `isOverdue(task, "2026-03-03")` з очікуванням `true`. Тепер обидва дні перевірено, і жоден не залежить від того, коли ти натиснеш «Запустити».
      en: |
        1. In `tasks.js` change the function’s header to `isOverdue(task, today)` and delete the line with `new Date()`.
        2. In the test call `isOverdue(task, "2026-03-01")` and run. The test passes — and will pass any time.
        3. Copy the test, name the copy something like “a task due 2026-03-02 is overdue on March 3”, and in it call `isOverdue(task, "2026-03-03")` expecting `true`. Now both days are checked, and neither depends on when you press “Run”.

  - id: fresh-data
    kind: explanation
    title:
      uk: "Свіжі фікстури для кожного тесту"
      en: "Fresh fixtures for every test"
    body:
      uk: |
        Дані, підготовлені для тестів, — це [[test-fixture|фікстури]]. Здається зручним оголосити один масив угорі файла й брати його в усіх тестах. Але якщо один тест змінює цей масив — позначає звичку призупиненою, додає день, — наступний отримує вже змінені дані. Тоді результат залежить від **порядку** тестів: окремо кожен проходить, разом — ні.

        Тест, що то проходить, то падає без жодної зміни в коді, називають [[flaky-test|нестабільним]]. Деякі інструменти навіть уміють запускати тести у випадковому порядку, щоб такі залежності спливали.

        Ліки — давати кожному тесту **власні** дані. Найпростіше зберігати фікстури як JSON-текст і щоразу розбирати його: `JSON.parse` створює всі масиви й об’єкти наново, на будь-якій глибині.
      en: |
        Data prepared for tests are [[test-fixture|fixtures]]. It seems handy to declare one array at the top of the file and use it in every test. But if one test changes that array — marks a habit paused, adds a day — the next one gets data that is already changed. Then the result depends on the **order** of the tests: each passes alone, together they do not.

        A test that sometimes passes and sometimes fails without any change in the code is called [[flaky-test|flaky]]. Some tools can even run tests in random order to bring such dependencies to the surface.

        The cure is to give every test **its own** data. The simplest way is to keep fixtures as JSON text and parse it every time: `JSON.parse` creates all arrays and objects anew, at any depth.

  - id: fresh-habits
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: fresh-habits
    entry: index.js
    editable: [fixtures.js, habits.test.js]
    strings:
      h01: { uk: "Ранкова зарядка", en: "Morning exercise" }
      h02: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
      h03: { uk: "Пити воду", en: "Drink water" }
      h05: { uk: "Вчити англійські слова", en: "Learn English words" }
      tPause: { uk: "призупинена звичка зменшує кількість активних", en: "pausing a habit lowers the active count" }
      tCount: { uk: "у фікстурах три активні звички", en: "the fixtures have three active habits" }
      mPause: { uk: "активних після паузи h-01", en: "active after pausing h-01" }
      mCount: { uk: "активних у фікстурах", en: "active in the fixtures" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Кожному тесту — свої звички"
      en: "Each test gets its own habits"
    instructions:
      uk: |
        Запусти програму: другий тест падає (`очікувалося 3, отримано 2`), хоча `countActive` правильна. Перший тест призупинив звичку в спільному масиві `habits`, і другий отримав уже змінені дані.

        Виправ це:

        1. У `fixtures.js` допиши й експортуй функцію `makeFixtures()`. Кожен виклик має повертати **нові** звички, розібрані з `FIXTURE_JSON`, — нові масиви й нові об’єкти.
        2. У `habits.test.js` імпортуй `makeFixtures` і в **кожному** тесті отримуй з неї власні дані.

        Обидва тести мають проходити в будь-якому порядку: перевірки запустять їх і задом наперед.
      en: |
        Run the program: the second test fails (`expected 3, got 2`), although `countActive` is correct. The first test paused a habit in the shared `habits` array, and the second one got data that was already changed.

        Fix it:

        1. In `fixtures.js` write and export a function `makeFixtures()`. Every call must return **new** habits parsed from `FIXTURE_JSON` — new arrays and new objects.
        2. In `habits.test.js` import `makeFixtures` and get fresh data from it in **every** test.

        Both tests must pass in any order: the checks also run them back to front.
    testTitles:
      "makeFixtures returns the four habits of FIXTURE_JSON":
        uk: "`makeFixtures` повертає чотири звички з `FIXTURE_JSON`"
        en: "`makeFixtures` returns the four habits of `FIXTURE_JSON`"
      "every call of makeFixtures returns new arrays and new objects":
        uk: "Кожен виклик `makeFixtures` повертає нові масиви й нові об’єкти"
        en: "Every call of `makeFixtures` returns new arrays and new objects"
      "your tests pass in the order they are written":
        uk: "Твої тести проходять у тому порядку, у якому написані"
        en: "Your tests pass in the order they are written"
      "your tests pass in reverse order too":
        uk: "Твої тести проходять і в зворотному порядку"
        en: "Your tests pass in reverse order too"
      "one of your tests fails when countActive counts paused habits too":
        uk: "Твій тест падає, коли `countActive` рахує й призупинені звички"
        en: "Your test fails when `countActive` counts paused habits too"
    hints:
      nudge:
        uk: "`JSON.parse` щоразу будує все наново. Що буде, якщо викликати його не один раз угорі файла, а при кожному виклику функції?"
        en: "`JSON.parse` builds everything anew every time. What happens if you call it not once at the top of the file but on every call of a function?"
      explanation:
        uk: "Функція, яка лише повертає вже розібраний масив, видає щоразу **той самий** масив, а копія через `[...масив]` — новий масив із **тими самими** об’єктами всередині. Нові дані на всіх рівнях найпростіше отримати, якщо будувати їх наново при кожному виклику функції — а `JSON.parse` саме це й робить. А в тестах функцію треба викликати на початку **кожного** тесту, а не один раз угорі файла."
        en: "A function that only returns an already parsed array hands out **the same** array every time, and a copy made with `[...array]` is a new array with **the same** objects inside. The simplest way to get new data at every level is to build it anew on every call of the function — and `JSON.parse` does exactly that. And in the tests the function must be called at the start of **every** test, not once at the top of the file."
    solutionNote:
      uk: "`makeFixtures` розбирає `FIXTURE_JSON` при кожному виклику, тож кожен тест отримує власні масиви й об’єкти. Тест, що призупиняє звичку, змінює лише свою копію, і другий тест бачить три активні звички за будь-якого порядку."
      en: "`makeFixtures` parses `FIXTURE_JSON` on every call, so every test gets its own arrays and objects. The test that pauses a habit changes only its own copy, and the second test sees three active habits in any order."
    feedback:
      - when: { test: "makeFixtures returns the four habits of FIXTURE_JSON" }
        message:
          uk: "Ця перевірка очікує, що `fixtures.js` експортує функцію `makeFixtures` і вона повертає ті самі чотири звички, що записано в `FIXTURE_JSON`. Не забудь слово `export` перед `function`."
          en: "This check expects `fixtures.js` to export a function `makeFixtures` that returns the same four habits as written in `FIXTURE_JSON`. Do not forget the word `export` before `function`."
      - when: { test: "every call of makeFixtures returns new arrays and new objects" }
        message:
          uk: "Ця перевірка викликає `makeFixtures` двічі й очікує, що результати не мають спільних масивів чи об’єктів — навіть усередині, на рівні окремої звички та її `completions`. Розібраний один раз масив або його копія через spread цього не дають."
          en: "This check calls `makeFixtures` twice and expects the results to share no arrays or objects — not even inside, at the level of one habit and its `completions`. An array parsed once, or a spread copy of it, does not give that."
      - when: { test: "your tests pass in the order they are written" }
        message:
          uk: "Ця перевірка запускає твої тести на свіжій копії `fixtures.js` і очікує, що всі пройдуть. Якщо падає «три активні звички», тест про паузу, найімовірніше, змінив спільні дані: кожен тест має брати свої звички з `makeFixtures()`."
          en: "This check runs your tests on a fresh copy of `fixtures.js` and expects all of them to pass. If “three active habits” fails, the pause test most likely changed shared data: every test must take its own habits from `makeFixtures()`."
      - when: { test: "your tests pass in reverse order too" }
        message:
          uk: "Ця перевірка запускає твої тести задом наперед і очікує, що всі пройдуть. Тести, які проходять лише в одному порядку, залежать один від одного через спільні дані."
          en: "This check runs your tests back to front and expects all of them to pass. Tests that pass only in one order depend on each other through shared data."
      - when: { test: "one of your tests fails when countActive counts paused habits too" }
        message:
          uk: "Ця перевірка запускає твої тести з `countActive`, що рахує всі звички, і очікує, що хоч один упаде. Тести мають і далі порівнювати кількість з очікуваним числом."
          en: "This check runs your tests against a `countActive` that counts every habit and expects at least one to fail. The tests must still compare the count with an expected number."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: синтаксична помилка в одному з файлів. Подивись на назву файла й рядок у картці помилки. Довгий рядок `FIXTURE_JSON` краще не змінювати."
          en: "The code could not start: one of the files has a syntax error. Look at the file name and line in the error card. Better leave the long `FIXTURE_JSON` line unchanged."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: parse-twice
        from: js-07-04-json
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const text = '[{"id":"e-01","amountMinor":84550}]';
          const first = JSON.parse(text);
          const second = JSON.parse(text);
          console.log(first[0] === second[0], first[0].amountMinor === second[0].amountMinor);
        verify: { logs: ["false true"] }
        answer:
          type: choice
          options:
            - id: false-true
              code: "false true"
            - id: true-true
              code: "true true"
              why:
                uk: "Кожен `JSON.parse` будує нові об’єкти. Вміст у них однаковий, але це два різні об’єкти."
                en: "Every `JSON.parse` builds new objects. Their content is equal, but they are two different objects."
            - id: false-false
              code: "false false"
              why:
                uk: "Числа порівнюються за значенням: `84550 === 84550` — `true`."
                en: "Numbers are compared by value: `84550 === 84550` is `true`."
          correct: [false-true]
        explanation:
          uk: "`JSON.parse` щоразу створює нові масиви й об’єкти з тим самим вмістом. Саме тому функція, що розбирає JSON при кожному виклику, дає кожному тесту його власні дані."
          en: "`JSON.parse` creates new arrays and objects with the same content every time. That is exactly why a function that parses JSON on every call gives every test its own data."

  - id: to-project
    kind: transfer
    capstoneStep: JS-09
    body:
      uk: "Якщо доменна функція твого проєкту залежить від дати, «сьогодні» має приходити параметром (у планувальнику `countDueTasks(tasks, today)` уже так і зроблено) — у тестах вибирай його сам, наприклад `\"2026-03-01\"`. А дані для тестів (бажання, справи, звички чи витрати з фікстур проєкту) отримуй у кожному тесті заново, з функції на кшталт `makeFixtures()`."
      en: "If a domain function of your project depends on the date, “today” must come in as a parameter (the planner’s `countDueTasks(tasks, today)` already works that way) — in tests, choose it yourself, for example `\"2026-03-01\"`. And get the test data (wishes, tasks, habits or expenses from the project’s fixtures) anew in every test, from a function like `makeFixtures()`."
