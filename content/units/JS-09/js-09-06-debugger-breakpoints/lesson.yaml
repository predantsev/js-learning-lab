id: js-09-06-debugger-breakpoints
unit: JS-09
title:
  uk: "Breakpoints і покрокове виконання"
  en: "Breakpoints and stepping"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Зупинити код на breakpoint чи інструкції `debugger` в інструментах розробника браузера, пройти кроками over, into й out і прочитати локальні змінні та стек викликів у момент паузи."
    en: "Pause code with a breakpoint or a debugger statement in the browser DevTools, step over, into and out of calls, and read local variables and the call stack at the pause."
  - uk: "Пояснити, чому відлагоджувач може показувати написаний тобою код, навіть коли виконується перетворений (source maps — у JS-15)."
    en: "Explain why the debugger can show the code you wrote even when the code that runs was transformed (source maps are practiced in JS-15)."
prerequisites: [js-09-05-mocks-vs-real, js-07-01-call-stack-and-errors]
subskills:
  - { family: P-04, skill: "breakpoints/source maps", depth: intro }
glossary: [browser-devtools, breakpoint, debugger-statement, step-over, step-into]
selfCheck: [third-pause, step-over-runs, nan-totals]

blocks:
  - id: pause-not-print
    kind: explanation
    title:
      uk: "Зупинити програму замість друку"
      en: "Pause the program instead of printing"
    body:
      uk: |
        `console.log` показує одне значення в одному місці — і щоб поставити нове питання, треба дописати рядок і запустити знову. [[breakpoint|Breakpoint]] робить інакше: він **зупиняє** програму перед указаним рядком коду. Під час паузи видно всі змінні, стек викликів, і програму можна вести далі крок за кроком.

        Breakpoints живуть в [[browser-devtools|інструментах розробника браузера]] (DevTools), на панелі **Sources**. Кроки після паузи:

        | Кнопка | Клавіша в Chrome | Що робить |
        |---|---|---|
        | Resume | F8 | виконувати далі до наступного breakpoint |
        | [[step-over\|Step over]] | F10 | виконати поточний рядок коду **цілком**, разом із функціями, які він викликає, і зупинитися на наступному |
        | [[step-into\|Step into]] | F11 | якщо рядок викликає функцію — зайти всередину й зупинитися на її першому рядку |
        | Step out | Shift+F11 | доробити поточну функцію й зупинитися там, звідки її викликали |

        Ще один спосіб поставити паузу — написати в коді [[debugger-statement|інструкцію]] `debugger;`. Коли DevTools відкрито, програма зупиниться на ній; коли закрито — інструкція нічого не робить.
      en: |
        `console.log` shows one value in one place — and to ask a new question you have to add a line and run again. A [[breakpoint]] works differently: it **pauses** the program before the given line of code. During the pause you can see every variable and the call stack, and you can move the program on step by step.

        Breakpoints live in the [[browser-devtools|browser’s developer tools]] (DevTools), in the **Sources** panel. The steps after a pause:

        | Button | Key in Chrome | What it does |
        |---|---|---|
        | Resume | F8 | run on until the next breakpoint |
        | [[step-over\|Step over]] | F10 | run the current line of code **completely**, including the functions it calls, and pause on the next one |
        | [[step-into\|Step into]] | F11 | if the line calls a function, go inside and pause on its first line |
        | Step out | Shift+F11 | finish the current function and pause where it was called from |

        One more way to set a pause is to write the [[debugger-statement|statement]] `debugger;` in the code. With DevTools open, the program stops on it; with DevTools closed, it does nothing.

  - id: third-pause
    kind: prediction
    prompt:
      uk: "Breakpoint стоїть на рядку 8 (`total += priceOf(items[i]);`). Програма зупиняється на ньому щоразу, **перш ніж** рядок виконається. Які значення `total` та `i` видно на **третій** паузі?"
      en: "A breakpoint sits on line 8 (`total += priceOf(items[i]);`). The program pauses on it every time **before** the line runs. Which values of `total` and `i` are shown at the **third** pause?"
    code: |
      function priceOf(item) {
        return item.price ?? 0;
      }

      function summarize(items) {
        let total = 0;
        for (let i = 0; i < items.length; i++) {
          total += priceOf(items[i]);
        }
        return total;
      }

      const wishes = [
        { id: "w-01", price: 80 },
        { id: "w-02", price: 45 },
        { id: "w-05", price: null },
        { id: "w-03", price: 240 },
      ];
      console.log(summarize(wishes));
    runnable: false
    answer:
      type: choice
      options:
        - id: t125-i2
          text: { uk: "`total` = 125, `i` = 2", en: "`total` = 125, `i` = 2" }
        - id: t125-i3
          text: { uk: "`total` = 125, `i` = 3", en: "`total` = 125, `i` = 3" }
          why:
            uk: "`i` починається з `0`: перша пауза — `i` = 0, друга — 1, третя — 2."
            en: "`i` starts at `0`: the first pause has `i` = 0, the second 1, the third 2."
        - id: t80-i2
          text: { uk: "`total` = 80, `i` = 2", en: "`total` = 80, `i` = 2" }
          why:
            uk: "До третьої паузи рядок 8 уже виконався двічі: додано `80` і `45`."
            en: "Before the third pause, line 8 has already run twice: `80` and `45` were added."
        - id: t125-done
          text: { uk: "`total` = 125, і ціну `w-05` уже додано", en: "`total` = 125, and the price of `w-05` is already added" }
          why:
            uk: "Пауза показує стан **перед** рядком: третє бажання, `w-05`, ще не додано. (Його ціна `null` дала б `0`, тож `total` після рядка й так буде 125.)"
            en: "A pause shows the state **before** the line: the third wish, `w-05`, has not been added yet. (Its price `null` would give `0`, so `total` stays 125 after the line anyway.)"
      correct: [t125-i2]
    explanation:
      uk: "На третій паузі рядок 8 виконався вже двічі: `0 + 80 + 45 = 125`, а лічильник `i` дорахував до `2`. Зараз на черзі `items[2]` — бажання `w-05` з ціною `null`. Пауза завжди показує стан **перед** рядком, на якому стоїть breakpoint."
      en: "At the third pause line 8 has already run twice: `0 + 80 + 45 = 125`, and the counter `i` has reached `2`. Next in line is `items[2]` — the wish `w-05` with the price `null`. A pause always shows the state **before** the line with the breakpoint."

  - id: paused-run
    kind: visual
    visual: code-trace
    title:
      uk: "Пауза за паузою в summarize"
      en: "Pause after pause in summarize"
    textEquivalent:
      uk: "Програма викликає summarize зі списком чотирьох бажань. Breakpoint на рядку 8 зупиняє її вперше, коли i дорівнює 0, а total — 0; у стеку викликів summarize лежить над кодом файла. Step into з цієї паузи заходить у priceOf: у стеку тепер три кадри, і priceOf зверху. priceOf повертає 80; step out доробив би її й повернув нас у summarize. Наступна пауза на рядку 8 — друга: i дорівнює 1, total — 80, тобто step over виконав і рядок, і виклик priceOf усередині нього. На третій паузі i дорівнює 2, total — 125, і на черзі бажання w-05 з ціною null; умовний breakpoint з умовою items[i].price === null зупинився б лише тут. Після четвертого проходу summarize повертає 365."
      en: "The program calls summarize with a list of four wishes. The breakpoint on line 8 pauses it for the first time when i is 0 and total is 0; on the call stack summarize lies above the file’s code. Step into from this pause goes into priceOf: the stack now has three frames, with priceOf on top. priceOf returns 80; step out would finish it and bring us back to summarize. The next pause on line 8 is the second one: i is 1 and total is 80, so step over ran both the line and the priceOf call inside it. At the third pause i is 2, total is 125, and next in line is the wish w-05 with the price null; a conditional breakpoint with the condition items[i].price === null would pause only here. After the fourth pass summarize returns 365."
    spec:
      file: visuals/summarize.js
      captions:
        - at: { line: 8, hit: 1 }
          text:
            uk: "**Перша пауза** на breakpoint у рядку 8: `i` = 0, `total` = 0. У **Call stack** `summarize` лежить над кодом файла."
            en: "**The first pause** at the breakpoint on line 8: `i` = 0, `total` = 0. In the **Call stack**, `summarize` lies above the file’s code."
        - at: { line: 1, kind: call, hit: 1 }
          text:
            uk: "**Step into** з першої паузи: ми всередині `priceOf`. У **Call stack** вона зверху, під нею чекає `summarize`."
            en: "**Step into** from the first pause: we are inside `priceOf`. In the **Call stack** it is on top, with `summarize` waiting below it."
        - at: { line: 2, kind: return, hit: 1 }
          text:
            uk: "`priceOf` повертає `80`. **Step out** доробив би її саме так і повернув нас у `summarize`."
            en: "`priceOf` returns `80`. **Step out** would finish it exactly like this and bring us back to `summarize`."
        - at: { line: 8, hit: 2 }
          text:
            uk: "**Друга пауза:** `i` = 1, `total` = 80. **Step over** з першої паузи виконав увесь рядок — разом із викликом `priceOf` — і нічого не пропустив."
            en: "**The second pause:** `i` = 1, `total` = 80. **Step over** from the first pause ran the whole line — including the `priceOf` call — and skipped nothing."
        - at: { line: 8, hit: 3 }
          text:
            uk: "**Третя пауза:** `i` = 2, `total` = 125. На черзі `w-05` з ціною `null`. Умовний breakpoint з умовою `items[i].price === null` зупинився б лише тут."
            en: "**The third pause:** `i` = 2, `total` = 125. Next in line is `w-05` with the price `null`. A conditional breakpoint with the condition `items[i].price === null` would pause only here."
        - at: { line: 10, kind: return }
          text:
            uk: "Після четвертого проходу `summarize` повертає `365`, і її кадр знімається зі стеку."
            en: "After the fourth pass `summarize` returns `365`, and its frame leaves the stack."

  - id: step-over-runs
    kind: prediction
    prompt:
      uk: "Програма стоїть на першій паузі на рядку `total += priceOf(items[i]);`, де `total` = 0, а перше бажання коштує 80. Ти натискаєш **Step over**. Що відбудеться?"
      en: "The program is at the first pause on the line `total += priceOf(items[i]);`, where `total` = 0 and the first wish costs 80. You press **Step over**. What happens?"
    answer:
      type: choice
      options:
        - id: runs-call
          text: { uk: "`priceOf` виконається, і на наступній паузі `total` = 80", en: "`priceOf` runs, and at the next pause `total` = 80" }
        - id: skips-call
          text: { uk: "Виклик `priceOf` пропуститься, і `total` залишиться 0", en: "The `priceOf` call is skipped, and `total` stays 0" }
          why:
            uk: "Step over нічого не пропускає: він виконує рядок цілком, просто не зупиняється всередині функцій, які цей рядок викликає."
            en: "Step over skips nothing: it runs the line completely, it just does not pause inside the functions that line calls."
        - id: enters
          text: { uk: "Програма зупиниться на першому рядку `priceOf`", en: "The program pauses on the first line of `priceOf`" }
          why:
            uk: "Так поводиться **Step into**. Step over проходить виклик, не заходячи всередину."
            en: "That is what **Step into** does. Step over goes through the call without stepping inside."
      correct: [runs-call]
    explanation:
      uk: "Step over означає «виконай цей рядок цілком і зупинись на наступному». Функції, які рядок викликає, виконуються повністю — просто без пауз усередині. Щоб подивитися, що робить `priceOf`, потрібен Step into."
      en: "Step over means “run this line completely and pause on the next one”. The functions the line calls run fully — just without pauses inside. To see what `priceOf` does, you need Step into."

  - id: here-and-devtools
    kind: explanation
    title:
      uk: "Кроки на платформі й справжні DevTools"
      en: "Steps on the platform and the real DevTools"
    body:
      uk: |
        Поруч із кнопкою «Запустити» є **«Виконати покроково»**. Вона виконує твій код і записує кожен крок, а на вкладці **«Кроки»** ти рухаєшся ними кнопками «‹ Назад» і «Далі ›» і бачиш «Змінні», «Call stack» і «Console» на кожному кроці. Це запис, а не жива пауза, — зате його можна гортати й назад.

        Живі breakpoints у DevTools краще пробувати в окремій вкладці браузера. Код у пісочниці платформи теж можна зупинити, але платформа стежить, чи він відповідає: за 3 секунди паузи вона попереджає, що код не відповідає, а приблизно за 11 секунд зупиняє виконання з повідомленням про нескінченний цикл.

        І ще одне: браузер виконує не зовсім той код, що ти написав. Платформа перед запуском додає до кожного циклу сторожа, що зупиняє нескінченні цикли:

        ```js
        for (const item of items) {if ((++_lc & 255) === 0 && Date.now() - _ls > 2000) __jsllLoopExceeded(3, 2000);
        ```

        Номери рядків вона зберігає, тому повідомлення про помилки вказують на твої рядки. Великі проєкти перетворюють код сильніше (об’єднують файли, стискають), і тоді DevTools показує твій код завдяки **source map** — файлу-відповідності між перетвореним кодом і написаним. Їх ти налаштуєш у JS-15.
      en: |
        Next to the “Run” button there is **“Step through”**. It runs your code and records every step, and in the **“Steps”** tab you move through them with “‹ Previous” and “Next ›” and see “Variables”, “Call stack” and “Console” at every step. It is a recording, not a live pause — but you can also go backwards through it.

        Live breakpoints in DevTools are best tried in a separate browser tab. Code in the platform’s sandbox can be paused too, but the platform watches whether it responds: after 3 seconds of pause it warns that the code is not responding, and after about 11 seconds it stops the run with a message about an endless loop.

        One more thing: the browser does not run exactly the code you wrote. Before running, the platform adds a guard to every loop that stops endless loops:

        ```js
        for (const item of items) {if ((++_lc & 255) === 0 && Date.now() - _ls > 2000) __jsllLoopExceeded(3, 2000);
        ```

        It keeps the line numbers, so error messages point at your lines. Big projects transform code much more (they merge files, compress them), and then DevTools shows your code thanks to a **source map** — a file that maps the transformed code back to what was written. You will set them up in JS-15.

  - id: step-summary
    kind: example
    runtime: browser-js
    dir: step-summary
    entry: index.js
    title:
      uk: "Пройди summarize покроково"
      en: "Step through summarize"
    body:
      uk: |
        Тут той самий код, що на картинці вище. Натисни **«Виконати покроково»** і відкрий вкладку **«Кроки»**.
      en: |
        This is the same code as in the picture above. Press **“Step through”** and open the **“Steps”** tab.
    tryIt:
      uk: |
        1. Тисни «Далі ›», доки підсвічений рядок не стане рядком 8 утретє. Перевір свій прогноз: що показують «Змінні» для `total` та `i`?
        2. Іди далі на один крок: підсвічення переходить у рядок 1, а в «Call stack» над `summarize` з’являється `priceOf`. Так виглядає step into.
        3. Заміни ціну `w-05` з `null` на `"20"` (у лапках) і знову виконай покроково. Знайди крок, де `total` перестає бути числом. Потім поверни `null`.
      en: |
        1. Press “Next ›” until the highlighted line becomes line 8 for the third time. Check your prediction: what do the “Variables” show for `total` and `i`?
        2. Go one more step: the highlight moves to line 1, and `priceOf` appears above `summarize` in the “Call stack”. That is what step into looks like.
        3. Change the price of `w-05` from `null` to `"20"` (in quotes) and step through again. Find the step where `total` stops being a number. Then put `null` back.

  - id: devtools-snippet
    kind: local-task
    runtime: local-web
    title:
      uk: "Справжні breakpoints у Chrome DevTools"
      en: "Real breakpoints in Chrome DevTools"
    intro:
      uk: "Тут ти працюєш у звичайній вкладці Chrome, поза платформою. Сніпет (snippet) у DevTools — це невеликий код, який браузер зберігає й запускає просто на відкритій сторінці. Ніяких файлів створювати не треба."
      en: "Here you work in an ordinary Chrome tab, outside the platform. A snippet in DevTools is a small piece of code that the browser keeps and runs right on the open page. No files need to be created."
    tools:
      - name: "Google Chrome"
        version: "154"
        note:
          uk: "Інші браузери на основі Chromium мають ті самі DevTools; назви можуть трохи відрізнятися."
          en: "Other Chromium-based browsers have the same DevTools; names may differ slightly."
    steps:
      - text:
          uk: "Відкрий нову вкладку й DevTools: F12, або Cmd+Option+I на macOS, або Ctrl+Shift+I у Windows і Linux. Перейди на панель **Sources**."
          en: "Open a new tab and DevTools: F12, or Cmd+Option+I on macOS, or Ctrl+Shift+I on Windows and Linux. Go to the **Sources** panel."
      - text:
          uk: "Ліворуч відкрий вкладку **Snippets** і натисни **+ New snippet**. Встав код:\n\n```js\nfunction priceOf(item) {\n  return item.price ?? 0;\n}\n\nfunction summarize(items) {\n  let total = 0;\n  for (let i = 0; i < items.length; i++) {\n    total += priceOf(items[i]);\n  }\n  return total;\n}\n\nconsole.log(summarize([\n  { id: \"w-01\", price: 80 },\n  { id: \"w-02\", price: 45 },\n  { id: \"w-05\", price: null },\n  { id: \"w-03\", price: 240 },\n]));\n```"
          en: "On the left, open the **Snippets** tab and press **+ New snippet**. Paste the code:\n\n```js\nfunction priceOf(item) {\n  return item.price ?? 0;\n}\n\nfunction summarize(items) {\n  let total = 0;\n  for (let i = 0; i < items.length; i++) {\n    total += priceOf(items[i]);\n  }\n  return total;\n}\n\nconsole.log(summarize([\n  { id: \"w-01\", price: 80 },\n  { id: \"w-02\", price: 45 },\n  { id: \"w-05\", price: null },\n  { id: \"w-03\", price: 240 },\n]));\n```"
      - text:
          uk: "Клацни номер рядка `total += priceOf(items[i]);` (рядок 8) — з’явиться позначка breakpoint. Запусти сніпет: Cmd+Enter (macOS) або Ctrl+Enter."
          en: "Click the line number of `total += priceOf(items[i]);` (line 8) — a breakpoint marker appears. Run the snippet: Cmd+Enter (macOS) or Ctrl+Enter."
        expect:
          uk: "Програма зупиняється на рядку 8. Праворуч у **Scope** видно `i` = 0 і `total` = 0, а в **Call Stack** — `summarize`."
          en: "The program pauses on line 8. On the right, **Scope** shows `i` = 0 and `total` = 0, and the **Call Stack** shows `summarize`."
      - text:
          uk: "Натисни **Step into** (F11): ти всередині `priceOf`, і вона зверху в Call Stack. Натисни **Step out** (Shift+F11) — повернешся в `summarize`. Далі кілька разів **Step over** (F10) і стеж, як змінюються `i` та `total`."
          en: "Press **Step into** (F11): you are inside `priceOf`, and it is on top of the Call Stack. Press **Step out** (Shift+F11) — you are back in `summarize`. Then press **Step over** (F10) a few times and watch `i` and `total` change."
      - text:
          uk: "У панелі **Watch** натисни **+** і впиши `total`: тепер його значення видно постійно. Натисни **Resume** (F8), щоб програма завершилася."
          en: "In the **Watch** pane press **+** and type `total`: now its value is always visible. Press **Resume** (F8) to let the program finish."
      - text:
          uk: "Клацни правою кнопкою по позначці breakpoint, вибери **Edit breakpoint** і впиши умову `items[i].price === null`. Запусти сніпет знову."
          en: "Right-click the breakpoint marker, choose **Edit breakpoint** and type the condition `items[i].price === null`. Run the snippet again."
        expect:
          uk: "Програма зупиняється лише один раз — коли `i` = 2, на бажанні `w-05`."
          en: "The program pauses only once — when `i` = 2, at the wish `w-05`."
      - text:
          uk: "Прибери breakpoint (клацни його позначку ще раз), допиши в цикл перед рядком 8 інструкцію `debugger;` і запусти сніпет. Програма зупиниться на ній, хоча breakpoints немає."
          en: "Remove the breakpoint (click its marker again), add the statement `debugger;` inside the loop before line 8 and run the snippet. The program pauses on it, although there are no breakpoints."
    verify:
      - id: paused-and-read
        text:
          uk: "Я зупинив програму на breakpoint і прочитав `i` та `total` у Scope."
          en: "I paused the program at a breakpoint and read `i` and `total` in Scope."
      - id: stepped
        text:
          uk: "Я зайшов у `priceOf` через Step into, побачив її в Call Stack і вийшов через Step out."
          en: "I went into `priceOf` with Step into, saw it in the Call Stack and left it with Step out."
      - id: conditional
        text:
          uk: "Умовний breakpoint зупинив програму лише на `w-05`."
          en: "The conditional breakpoint paused the program only at `w-05`."
    troubleshooting:
      - problem:
          uk: "Вкладки Snippets не видно."
          en: "The Snippets tab is not visible."
        fix:
          uk: "Ліва частина панелі Sources може бути вузькою: натисни `»` угорі неї. Або відкрий меню команд (Cmd+Shift+P / Ctrl+Shift+P) і введи `Show Snippets`."
          en: "The left part of the Sources panel may be narrow: press `»` at its top. Or open the command menu (Cmd+Shift+P / Ctrl+Shift+P) and type `Show Snippets`."
      - problem:
          uk: "Сніпет виконується, але не зупиняється."
          en: "The snippet runs but does not pause."
        fix:
          uk: "Перевір, що позначка breakpoint стоїть на рядку всередині циклу і що breakpoints не вимкнено кнопкою **Deactivate breakpoints** (перекреслена позначка вгорі панелі налагодження)."
          en: "Check that the breakpoint marker is on a line inside the loop and that breakpoints are not switched off with the **Deactivate breakpoints** button (a crossed-out marker at the top of the debugger pane)."
      - problem:
          uk: "F10 чи F11 на ноутбуці змінюють гучність або яскравість."
          en: "F10 or F11 on a laptop changes the volume or brightness."
        fix:
          uk: "Натискай їх разом із клавішею Fn або користуйся кнопками зі стрілками на панелі налагодження над Scope."
          en: "Press them together with the Fn key, or use the arrow buttons in the debugger toolbar above Scope."
    recovery:
      uk: "Щоб почати з чистого аркуша, клацни правою кнопкою в панелі **Breakpoints** і вибери **Remove all breakpoints**, а потім натисни Resume (F8). Сніпет можна видалити з контекстного меню у вкладці Snippets; на платформі він нічого не змінює."
      en: "To start from a clean slate, right-click in the **Breakpoints** pane, choose **Remove all breakpoints**, then press Resume (F8). The snippet can be deleted from its context menu in the Snippets tab; it changes nothing on the platform."

  - id: nan-totals
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: nan-totals
    entry: index.js
    strings:
      e01: { uk: "Продукти на тиждень", en: "Weekly groceries" }
      e02: { uk: "Проїзний", en: "Transit pass" }
      e03: { uk: "Кава з друзями", en: "Coffee with friends" }
      e04: { uk: "Лампочки", en: "Light bulbs" }
      e05: { uk: "Квитки в кіно", en: "Cinema tickets" }
      e06: { uk: "Обід", en: "Lunch" }
    title:
      uk: "Звідки береться NaN"
      en: "Where the NaN comes from"
    instructions:
      uk: |
        `totalsByCategory` має повертати суми витрат у копійках для всіх чотирьох категорій проєкту — `food`, `transport`, `home` і `fun`; категорія без витрат має суму `0`. Запусти програму: одна сума — `NaN`.

        Знайди причину **без** `console.log`: натисни «Виконати покроково» й іди кроками, стежачи за об’єктом `totals` (його поля видно в панелі «Heap (об’єкти)»). Знайди перший крок, де з’являється `NaN`, і зрозумій, що було перед ним.

        Виправ функцію. Програма має друкувати лише рядок із сумами.
      en: |
        `totalsByCategory` must return the expense totals in minor units for all four project categories — `food`, `transport`, `home` and `fun`; a category without expenses has the total `0`. Run the program: one total is `NaN`.

        Find the cause **without** `console.log`: press “Step through” and walk the steps, watching the `totals` object (its fields are shown in the “Heap (objects)” panel). Find the first step where `NaN` appears and work out what was there before it.

        Fix the function. The program must print only the line with the totals.
    testTitles:
      "gives the right totals for the six project expenses":
        uk: "Дає правильні суми для шести витрат проєкту"
        en: "Gives the right totals for the six project expenses"
      "counts a list with a single home expense":
        uk: "Рахує список з однією витратою категорії `home`"
        en: "Counts a list with a single `home` expense"
      "gives all four categories with 0 for an empty list":
        uk: "Для порожнього списку дає всі чотири категорії з `0`"
        en: "Gives all four categories with `0` for an empty list"
      "prints only the totals line":
        uk: "Друкує лише рядок із сумами"
        en: "Prints only the line with the totals"
    hints:
      nudge:
        uk: "У «Кроках» знайди перший крок, де одна з властивостей `totals` стає `NaN`. Яке значення в неї було на кроці перед ним?"
        en: "In “Steps” find the first step where one of the properties of `totals` becomes `NaN`. What value did it have on the step before?"
      explanation:
        uk: "Читання властивості, якої в об’єкті немає, дає `undefined`, а `undefined + число` — це `NaN`. Схожий випадок: `const counts = { done: 0 }; counts.pending += 1;` дає `counts.pending` = `NaN`, бо початкового значення для `pending` ніхто не задав. Подумай, звідки має взятися початкова сума для кожної з чотирьох категорій."
        en: "Reading a property the object does not have gives `undefined`, and `undefined + number` is `NaN`. A similar case: `const counts = { done: 0 }; counts.pending += 1;` makes `counts.pending` `NaN`, because nobody set a starting value for `pending`. Think about where the starting total for each of the four categories should come from."
    solutionNote:
      uk: "У початковому об’єкті `totals` бракувало `home: 0`. Перша витрата категорії `home` (`e-04`) додавала число до `undefined` і давала `NaN`, а далі `NaN` лише поширювався. З `home: 0` усі чотири категорії мають початкову суму, і порожній список теж дає чотири нулі."
      en: "The starting `totals` object was missing `home: 0`. The first `home` expense (`e-04`) added a number to `undefined` and produced `NaN`, and from then on `NaN` only spread. With `home: 0` all four categories have a starting total, and an empty list also gives four zeros."
    feedback:
      - when: { test: "gives the right totals for the six project expenses" }
        message:
          uk: "Ця перевірка очікує суми `food` 105600, `transport` 52000, `home` 9990 і `fun` 48000. Якщо одна з них `NaN`, у неї не було початкового значення, коли до неї вперше додали число."
          en: "This check expects the totals `food` 105600, `transport` 52000, `home` 9990 and `fun` 48000. If one of them is `NaN`, it had no starting value when a number was first added to it."
      - when: { test: "gives all four categories with 0 for an empty list" }
        message:
          uk: "Ця перевірка викликає функцію з порожнім списком і очікує всі чотири категорії з `0`. Сума, що з’являється лише після першої витрати, тут відсутня: початкові значення мають бути для всіх категорій одразу."
          en: "This check calls the function with an empty list and expects all four categories with `0`. A total that only appears after the first expense is missing here: the starting values must exist for all categories from the start."
      - when: { test: "prints only the totals line" }
        message:
          uk: "Ця перевірка очікує, що програма друкує один рядок — суми. Якщо ти додавав `console.log` під час пошуку, прибери його."
          en: "This check expects the program to print one line — the totals. If you added a `console.log` while searching, remove it."
      - when: { error: TypeError }
        message:
          uk: "Під час виконання сталася `TypeError`. Якщо програма впала ще під час запуску, перевірки не знаходять `totalsByCategory` — спершу виправ рядок із картки помилки."
          en: "A `TypeError` happened while running. If the program crashed while starting, the checks cannot find `totalsByCategory` — fix the line from the error card first."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: top-frame
        from: js-07-01-call-stack-and-errors
        prompt:
          uk: |
            Програма впала з таким stack trace:

            ```text
            TypeError: Cannot read properties of undefined (reading 'price')
                at priceOf (index.js:2:15)
                at summarize (index.js:8:14)
                at index.js:19:13
            ```

            У якій функції виконувався код, коли сталася помилка?
          en: |
            A program crashed with this stack trace:

            ```text
            TypeError: Cannot read properties of undefined (reading 'price')
                at priceOf (index.js:2:15)
                at summarize (index.js:8:14)
                at index.js:19:13
            ```

            In which function was the code running when the error happened?
        answer:
          type: choice
          options:
            - id: price-of
              text: { uk: "`priceOf`", en: "`priceOf`" }
            - id: summarize
              text: { uk: "`summarize`", en: "`summarize`" }
              why:
                uk: "`summarize` чекала на відповідь `priceOf` — у stack trace вона другий кадр, під тією, що працювала."
                en: "`summarize` was waiting for `priceOf` to answer — it is the second frame in the stack trace, below the one that was running."
            - id: file
              text: { uk: "Код файла на рядку 19", en: "The file’s code on line 19" }
              why:
                uk: "Код файла — найнижчий кадр: він почав ланцюжок викликів, але сам у ту мить чекав."
                en: "The file’s code is the bottom frame: it started the chain of calls, but at that moment it was waiting itself."
          correct: [price-of]
        explanation:
          uk: "Верхній рядок stack trace — функція, що виконувалася в мить помилки; нижче — ті, що чекали на неї. Панель **Call Stack** у DevTools показує той самий ланцюжок, але під час паузи — ще до помилки."
          en: "The top line of a stack trace is the function that was running when the error happened; below are the ones waiting for it. The **Call Stack** pane in DevTools shows the same chain, but during a pause — before any error."

  - id: to-project
    kind: transfer
    capstoneStep: JS-09
    body:
      uk: "Коли тест твого проєкту падає, а причина неочевидна, не засипай код `console.log`: виконай доменну функцію покроково й подивись, на якому кроці значення стає не тим. Знайдену причину закріпи тестом — про це наступний урок."
      en: "When a test in your project fails and the cause is not obvious, do not flood the code with `console.log`: step through the domain function and see at which step a value goes wrong. Pin the cause down with a test — that is the next lesson."
