id: js-09-02-assertions
unit: JS-09
title:
  uk: "Assertions: перевіряємо очікуване"
  en: "Assertions"
kind: instructional
minutes: 12
contentVersion: 1
objectives:
  - uk: "Писати assertions на строгу рівність, на рівність вмісту об’єктів і масивів та на очікувану помилку — кожну з повідомленням, що каже, що саме перевіряється."
    en: "Write assertions for strict equality, deep equality of objects and arrays, and an expected throw, each with a message that states the intent."
  - uk: "Пояснити, чому assertion на строгу рівність двох окремо створених записів падає, навіть коли всі поля збігаються."
    en: "Explain why a strict-equality assertion on two separately built records fails even when every field matches."
prerequisites: [js-09-01-why-tests, js-04-07-reference-identity]
subskills:
  - { family: P-04, skill: "assertions/boundaries", depth: intro }
glossary: [assertion, test-case, expected-value, actual-value]
selfCheck: [which-pass, sort-assertions]

blocks:
  - id: three-assertions
    kind: explanation
    title:
      uk: "Три види перевірок"
      en: "Three kinds of checks"
    body:
      uk: |
        Рядок коду `expect(…).toBe(…)` — це [[assertion]]: твердження, яке мусить бути правдою, інакше тест падає. Ліворуч — [[actual-value|фактичне значення]] (що повернув код), праворуч — [[expected-value|очікуване]] (що має бути за умовою задачі).

        | Перевірка | Проходить, коли |
        |---|---|
        | `expect(a).toBe(b)` | `a` і `b` — те саме число чи текст **або той самий об’єкт** |
        | `expect(a).toEqual(b)` | у `a` і `b` **однаковий вміст**: ті самі поля з тими самими значеннями; у масивах — ті самі елементи в тому самому порядку |
        | `expect(() => f(x)).toThrow(RangeError)` | виклик `f(x)` кидає помилку (тут — саме `RangeError`) |

        `toBe` порівнює так само, як `===`: два окремо створені об’єкти для нього різні, навіть з однаковими полями. Для записів і списків, зібраних кодом, бери `toEqual`.
      en: |
        The line of code `expect(…).toBe(…)` is an [[assertion]]: a statement that must be true, otherwise the test fails. On the left is the [[actual-value|actual value]] (what the code returned), on the right the [[expected-value|expected value]] (what the requirements say it must be).

        | Check | Passes when |
        |---|---|
        | `expect(a).toBe(b)` | `a` and `b` are the same number or text **or the very same object** |
        | `expect(a).toEqual(b)` | `a` and `b` have **the same content**: the same fields with the same values; for arrays, the same items in the same order |
        | `expect(() => f(x)).toThrow(RangeError)` | calling `f(x)` throws an error (here, a `RangeError` in particular) |

        `toBe` compares the way `===` does: two separately built objects are different to it, even with equal fields. For records and lists that your code builds, use `toEqual`.

  - id: which-pass
    kind: prediction
    strings:
      w02: { uk: "Настільна лампа", en: "Desk lamp" }
    prompt:
      uk: "Функція `assertValidPrice(price)` кидає `RangeError`, якщо ціна від’ємна. Які з шести перевірок пройдуть? Познач усі, що пройдуть."
      en: "The function `assertValidPrice(price)` throws a `RangeError` when the price is negative. Which of the six checks pass? Mark every one that passes."
    code: |
      const saved = { id: "w-02", name: "%%w02%%", price: 45 };
      const loaded = { id: "w-02", name: "%%w02%%", price: 45 };

      expect(loaded.price).toBe(45);                           // A
      expect(loaded).toBe(saved);                              // B
      expect(loaded).toEqual(saved);                           // C
      expect(["w-01", "w-02"]).toEqual(["w-02", "w-01"]);      // D
      expect(() => assertValidPrice(-1)).toThrow(RangeError);  // E
      expect(assertValidPrice(-1)).toThrow(RangeError);        // F
    runnable: false
    answer:
      type: multi
      options:
        - id: a
          text: { uk: "A", en: "A" }
        - id: b
          text: { uk: "B", en: "B" }
          why:
            uk: "`toBe` порівнює як `===`. `saved` і `loaded` створено окремо — це два різні об’єкти, хоч поля в них однакові."
            en: "`toBe` compares like `===`. `saved` and `loaded` were built separately — they are two different objects, even though their fields match."
        - id: c
          text: { uk: "C", en: "C" }
        - id: d
          text: { uk: "D", en: "D" }
          why:
            uk: "`toEqual` порівнює масиви елемент за елементом **у порядку**: на першому місці `\"w-01\"` проти `\"w-02\"` — вже різниця."
            en: "`toEqual` compares arrays item by item **in order**: in first place it is `\"w-01\"` against `\"w-02\"` — already a difference."
        - id: e
          text: { uk: "E", en: "E" }
        - id: f
          text: { uk: "F", en: "F" }
          why:
            uk: "Тут `assertValidPrice(-1)` виконується **до** `expect`, щоб обчислити аргумент. Помилка вилітає раніше, ніж `toThrow` встигає її зловити, — і тест падає з `RangeError`."
            en: "Here `assertValidPrice(-1)` runs **before** `expect`, to compute the argument. The error flies out before `toThrow` can catch it — and the test fails with a `RangeError`."
      correct: [a, c, e]
    explanation:
      uk: "Проходять A, C і E. B падає, бо `toBe` вимагає того самого об’єкта, а не однакового вмісту. D падає, бо в масивах важливий порядок. F падає, бо `toThrow` потребує **функції**, яку викличе сам: `() => assertValidPrice(-1)`, — а не результату виклику."
      en: "A, C and E pass. B fails because `toBe` demands the very same object, not equal content. D fails because order matters in arrays. F fails because `toThrow` needs a **function** to call itself — `() => assertValidPrice(-1)` — not the result of a call."

  - id: six-assertions
    kind: example
    runtime: browser-js
    dir: six-assertions
    entry: index.js
    strings:
      w02: { uk: "Настільна лампа", en: "Desk lamp" }
      priceError: { uk: "Ціна має бути числом, не меншим за 0", en: "The price must be a number of 0 or more" }
      aA: { uk: "A: toBe для числа", en: "A: toBe for a number" }
      aB: { uk: "B: toBe для двох записів", en: "B: toBe for two records" }
      aC: { uk: "C: toEqual для двох записів", en: "C: toEqual for two records" }
      aD: { uk: "D: toEqual для масивів в іншому порядку", en: "D: toEqual for arrays in another order" }
      aE: { uk: "E: toThrow з функцією", en: "E: toThrow with a function" }
      aF: { uk: "F: toThrow з результатом виклику", en: "F: toThrow with the result of a call" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Шість перевірок наживо"
      en: "Six checks, for real"
    body:
      uk: |
        Ті самі шість перевірок, кожна у власному тесті. Натисни **Запустити** й порівняй консоль зі своїм прогнозом.

        Подивись, що саме пише кожен рядок консолі з `✗`. Для B бігунець тестів підказує, що вміст однаковий, але об’єкти різні. Для F у рядку стоїть `RangeError` — ця помилка вилетіла з виклику ще до `toThrow`.
      en: |
        The same six checks, each in its own test. Press **Run** and compare the console with your prediction.

        Look at what each console line with `✗` says. For B the test runner hints that the content is equal but the objects are different. For F the line shows `RangeError` — that error flew out of the call before `toThrow` was reached.
    tryIt:
      uk: |
        1. У тесті B заміни `toBe` на `toEqual` і запусти: тепер він проходить.
        2. У тесті F загорни виклик у функцію: `expect(() => assertValidPrice(-1))` — і він теж проходить.
        3. У тесті A заміни `45` на `40` і запусти. Прочитай повідомлення: `очікувалося 40, отримано 45`.
        4. Додай до тієї самої перевірки другий аргумент — опис: `expect(loaded.price, "ціна після завантаження").toBe(40)`. Тепер рядок консолі починається з твого опису. Поверни `45`.
      en: |
        1. In test B replace `toBe` with `toEqual` and run: now it passes.
        2. In test F wrap the call in a function: `expect(() => assertValidPrice(-1))` — and it passes too.
        3. In test A replace `45` with `40` and run. Read the message: `expected 40, got 45`.
        4. Give the same check a second argument — a description: `expect(loaded.price, "price after loading").toBe(40)`. Now the console line starts with your description. Put `45` back.

  - id: messages
    kind: explanation
    title:
      uk: "Повідомлення й тест без перевірки"
      en: "Messages, and a test with no check"
    body:
      uk: |
        Другий аргумент `expect` — короткий опис того, **що** перевіряється. Коли тест падає через місяць, рядок `ціна після завантаження: очікувалося 40, отримано 45` пояснює більше, ніж просто `очікувалося 40, отримано 45`.

        Тест — це [[test-case|тестовий випадок]]: назва, підготовлені дані й перевірки. А що, коли перевірок немає зовсім?

        ```js
        test("sums the wanted wishes", () => {
          summarizeItems(items); // nothing is compared
        });
        ```

        Такий тест **проходить** — і в цьому бігунці, і в Vitest чи Jest. Він доводить лише одне: функція не кинула помилку. Правильна вона чи ні, він не перевіряє. Тому кожен тест має містити хоча б одну перевірку, яка впаде, якщо результат неправильний.
      en: |
        The second argument of `expect` is a short description of **what** is being checked. When a test fails a month from now, the line `price after loading: expected 40, got 45` explains more than just `expected 40, got 45`.

        A test is a [[test-case]]: a name, prepared data and checks. And what if there are no checks at all?

        ```js
        test("sums the wanted wishes", () => {
          summarizeItems(items); // nothing is compared
        });
        ```

        Such a test **passes** — in this runner, and in Vitest or Jest too. It proves only one thing: the function did not throw. Whether it is correct, the test does not check. So every test needs at least one check that fails when the result is wrong.

  - id: no-check
    kind: prediction
    prompt:
      uk: |
        Цей тест проходить:

        ```js
        test("counts the due tasks", () => {
          const tasks = [{ id: "t-02", dueDate: "2026-03-01", done: false }];
          countDueTasks(tasks, "2026-03-01");
        });
        ```

        Що він доводить про `countDueTasks`?
      en: |
        This test passes:

        ```js
        test("counts the due tasks", () => {
          const tasks = [{ id: "t-02", dueDate: "2026-03-01", done: false }];
          countDueTasks(tasks, "2026-03-01");
        });
        ```

        What does it prove about `countDueTasks`?
    answer:
      type: choice
      options:
        - id: no-throw
          text: { uk: "Лише те, що з цими даними функція не кидає помилку", en: "Only that the function does not throw with this data" }
        - id: correct
          text: { uk: "Що функція правильно рахує справи до терміну", en: "That the function counts due tasks correctly" }
          why:
            uk: "Тест ніде не порівнює повернене число з очікуваним. Він пройшов би, навіть якби функція повертала `0`, `-7` чи `\"hello\"`."
            en: "The test never compares the returned number with an expected one. It would pass even if the function returned `0`, `-7` or `\"hello\"`."
        - id: fails
          text: { uk: "Нічого: тест без перевірки рахується таким, що впав", en: "Nothing: a test without a check counts as failed" }
          why:
            uk: "Тест падає, лише коли всередині вилітає помилка. Без перевірки її нема кому кинути, тож він проходить — і саме тому оманливий."
            en: "A test fails only when an error flies out inside it. Without a check nothing throws, so it passes — and that is exactly why it is misleading."
      correct: [no-throw]
    explanation:
      uk: "Тест падає, тільки коли всередині нього вилітає помилка. Тут немає `expect`, тож помилку могла б кинути лише сама функція. Щоб тест щось доводив, додай перевірку результату: `expect(countDueTasks(tasks, \"2026-03-01\")).toBe(1)`."
      en: "A test fails only when an error flies out inside it. There is no `expect` here, so only the function itself could throw. For the test to prove something, check the result: `expect(countDueTasks(tasks, \"2026-03-01\")).toBe(1)`."

  - id: sort-assertions
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: sort-assertions
    entry: index.js
    editable: [tasks.test.js]
    strings:
      unknownKey: { uk: "Невідомий ключ сортування", en: "Unknown sort key" }
      t01: { uk: "Полити квіти", en: "Water the plants" }
      t02: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
      t03: { uk: "Написати бабусі", en: "Write to grandma" }
      t05: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
      tOrder: { uk: "сортує за dueDate: найраніша дата перша, без дати — в кінці", en: "sorts by dueDate: earliest first, no date last" }
      tUnchanged: { uk: "не змінює масив, який отримала", en: "does not change the array it receives" }
      tUnknown: { uk: "кидає RangeError для невідомого ключа", en: "throws a RangeError for an unknown key" }
      mOrder: { uk: "порядок id за dueDate", en: "order of ids by dueDate" }
      mUnchanged: { uk: "порядок id у переданому масиві", en: "order of ids in the array passed in" }
      mUnknown: { uk: "сортування за невідомим ключем", en: "sorting by an unknown key" }
      mNewArray: { uk: "повертає новий масив", en: "returns a new array" }
      rExpected: { uk: "очікувалося", en: "expected" }
      rGot: { uk: "отримано", en: "got" }
      rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
      rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
      rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
      rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
      rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
      rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
    title:
      uk: "Перевірки для sortTasks"
      en: "Checks for sortTasks"
    instructions:
      uk: |
        У файлі `tasks.js` готова функція планувальника `sortTasks(tasks, key)`:

        - з ключем `"dueDate"` повертає **новий** масив справ: найраніша дата перша, справи без дати (`dueDate: null`) — у кінці;
        - масив, який отримала, не змінює;
        - з невідомим ключем кидає `RangeError`.

        У `tasks.test.js` вже є три тести без перевірок. Допиши в кожен дані й перевірку:

        1. Порядок: справи в перемішаному порядку → після сортування `id` у правильному порядку.
        2. Незмінність: після виклику переданий масив має той самий порядок, що й до нього.
        3. Помилка: сортування за ключем, якого немає (наприклад, `"title"`), кидає `RangeError`.

        Кожен тест хай створює **власний** масив справ, а кожна перевірка має другим аргументом опис того, що перевіряє.
      en: |
        The file `tasks.js` has a ready planner function `sortTasks(tasks, key)`:

        - with the key `"dueDate"` it returns a **new** array of tasks: the earliest date first, tasks without a date (`dueDate: null`) last;
        - it does not change the array it received;
        - with an unknown key it throws a `RangeError`.

        `tasks.test.js` already has three tests without checks. Give each one data and a check:

        1. Order: tasks in a mixed order → after sorting, the `id`s are in the right order.
        2. Unchanged input: after the call, the array passed in has the same order as before.
        3. The error: sorting by a key that does not exist (for example, `"title"`) throws a `RangeError`.

        Let every test build **its own** array of tasks, and give every check a second argument that describes what it checks.
    testTitles:
      "your tests pass with the correct sortTasks":
        uk: "Твої тести є і проходять із правильною `sortTasks`"
        en: "Your tests exist and pass with the correct `sortTasks`"
      "one of your tests fails when sortTasks puts the latest date first":
        uk: "Твій тест падає, коли `sortTasks` ставить найпізнішу дату першою"
        en: "Your test fails when `sortTasks` puts the latest date first"
      "one of your tests fails when sortTasks changes the array it receives":
        uk: "Твій тест падає, коли `sortTasks` змінює отриманий масив"
        en: "Your test fails when `sortTasks` changes the array it receives"
      "one of your tests fails when sortTasks accepts an unknown key":
        uk: "Твій тест падає, коли `sortTasks` приймає невідомий ключ"
        en: "Your test fails when `sortTasks` accepts an unknown key"
      "every failure message starts with your own description":
        uk: "Кожне повідомлення про провал починається з твого опису"
        en: "Every failure message starts with your own description"
    hints:
      nudge:
        uk: "Для масивів, які повертає функція, підходить `toEqual`, а не `toBe`. Для помилки `toThrow` потрібна функція-обгортка."
        en: "For arrays that a function returns, `toEqual` fits, not `toBe`. For the error, `toThrow` needs a wrapper function."
      explanation:
        uk: "Щоб перевірити незмінність, запам’ятай порядок `id` у масиві до виклику (або напиши його вручну), виклич `sortTasks`, а тоді порівняй порядок `id` того самого масиву з запам’ятаним. Це спрацює, лише якщо масив спочатку **не** відсортований — інакше сортування на місці нічого не змінить. Схожа перевірка для списку бажань: `expect(items.map((item) => item.id), \"порядок бажань\").toEqual([\"w-03\", \"w-01\"])`."
        en: "To check the input is unchanged, remember the order of `id`s in the array before the call (or write it out by hand), call `sortTasks`, then compare the order of `id`s of that same array with what you remembered. This only works if the array is **not** sorted to begin with — otherwise sorting in place changes nothing. A similar check for a wishlist: `expect(items.map((item) => item.id), \"order of wishes\").toEqual([\"w-03\", \"w-01\"])`."
    solutionNote:
      uk: "Кожен тест будує свій масив у перемішаному порядку. Порядок перевіряє `toEqual` над `id`, незмінність — порівняння порядку `id` того самого масиву після виклику, а помилку — `toThrow(RangeError)` з функцією-обгорткою. Опис у другому аргументі робить кожен провал зрозумілим без читання коду тесту."
      en: "Every test builds its own array in a mixed order. The order is checked with `toEqual` over the `id`s, the unchanged input by comparing the order of `id`s of that same array after the call, and the error with `toThrow(RangeError)` on a wrapper function. The description in the second argument makes every failure understandable without reading the test code."
    feedback:
      - when: { test: "your tests pass with the correct sortTasks" }
        message:
          uk: "Ця перевірка очікує, що всі твої тести проходять із правильною `sortTasks`. Якщо в консолі `RangeError` поруч із `✗`, виклик не загорнуто у функцію: `toThrow` потребує `() => sortTasks(…)`. Якщо там `(вміст однаковий, але це два різні об’єкти)`, заміни `toBe` на `toEqual`."
          en: "This check expects all your tests to pass with the correct `sortTasks`. If the console shows `RangeError` next to `✗`, the call is not wrapped in a function: `toThrow` needs `() => sortTasks(…)`. If it says `(same content, but two different objects)`, replace `toBe` with `toEqual`."
      - when: { test: "one of your tests fails when sortTasks puts the latest date first" }
        message:
          uk: "Ця перевірка запускає твої тести з `sortTasks`, що ставить найпізнішу дату першою, і очікує, що хоч один упаде. Тест порядку має порівнювати весь список `id` з правильним порядком, а справи в ньому — мати різні дати."
          en: "This check runs your tests against a `sortTasks` that puts the latest date first and expects at least one to fail. The order test must compare the whole list of `id`s with the right order, and its tasks must have different dates."
      - when: { test: "one of your tests fails when sortTasks changes the array it receives" }
        message:
          uk: "Ця перевірка запускає твої тести з `sortTasks`, яка сортує сам отриманий масив, і очікує, що хоч один упаде. Тест незмінності має працювати з масивом, який ще **не** відсортовано. Якщо всі тести ділять один масив, попередній тест міг уже його відсортувати — створи масив усередині тесту."
          en: "This check runs your tests against a `sortTasks` that sorts the received array itself and expects at least one to fail. The unchanged-input test must work on an array that is **not** sorted yet. If all tests share one array, an earlier test may have sorted it already — build the array inside the test."
      - when: { test: "one of your tests fails when sortTasks accepts an unknown key" }
        message:
          uk: "Ця перевірка запускає твої тести з `sortTasks`, яка для невідомого ключа повертає копію замість помилки, і очікує, що хоч один упаде. Потрібна перевірка `toThrow` для ключа, якого функція не знає."
          en: "This check runs your tests against a `sortTasks` that returns a copy instead of throwing for an unknown key and expects at least one to fail. You need a `toThrow` check for a key the function does not know."
      - when: { test: "every failure message starts with your own description" }
        message:
          uk: "Ця перевірка дивиться, як падають твої тести зі зламаними версіями: кожен рядок провалу має починатися з твого опису. Додай опис другим аргументом у кожен `expect(…, \"що перевіряю\")`."
          en: "This check looks at how your tests fail with the broken versions: every failure line must start with your description. Add a description as the second argument of every `expect(…, \"what I check\")`."
      - when: { error: SyntaxError }
        message:
          uk: "Код не вдалося запустити: у файлі тестів синтаксична помилка. Найчастіше бракує дужки чи коми — наприклад, між значенням і описом у `expect(значення, \"опис\")`."
          en: "The code could not start: the test file has a syntax error. Most often a bracket or a comma is missing — for example, between the value and the description in `expect(value, \"description\")`."

  - id: recall
    kind: review
    title:
      uk: "Пригадай"
      en: "Recall"
    items:
      - id: same-or-equal
        from: js-04-07-reference-identity
        prompt:
          uk: "Що надрукує цей код?"
          en: "What does this code print?"
        code: |
          const lamp = { id: "w-02", price: 45 };
          const same = lamp;
          const copy = { id: "w-02", price: 45 };
          console.log(lamp === same, lamp === copy);
        verify: { logs: ["true false"] }
        answer:
          type: choice
          options:
            - id: true-false
              code: "true false"
            - id: true-true
              code: "true true"
              why:
                uk: "`copy` — окремий об’єкт з тими самими полями. `===` для об’єктів перевіряє, чи це той самий об’єкт, а не чи однаковий вміст."
                en: "`copy` is a separate object with the same fields. For objects, `===` checks whether it is the same object, not whether the content is equal."
            - id: false-false
              code: "false false"
              why:
                uk: "`same = lamp` не копіює об’єкт: обидві назви вказують на один і той самий об’єкт."
                en: "`same = lamp` does not copy the object: both names point to one and the same object."
          correct: [true-false]
        explanation:
          uk: "`same` вказує на той самий об’єкт, що й `lamp`, а `copy` — на інший, хоч і з однаковими полями. Саме тому `toBe` (як `===`) для двох окремо створених записів падає, а `toEqual` проходить."
          en: "`same` points to the same object as `lamp`, while `copy` points to another one, even with equal fields. That is why `toBe` (like `===`) fails for two separately built records and `toEqual` passes."
      - id: comparator-sign
        from: js-05-05-sorting-comparator
        prompt:
          uk: "Компаратор у `toSorted((a, b) => …)` повернув `-1` для пари `a` = справа t-02, `b` = справа t-01. Що це означає для порядку?"
          en: "The comparator in `toSorted((a, b) => …)` returned `-1` for the pair `a` = task t-02, `b` = task t-01. What does that mean for the order?"
        answer:
          type: choice
          options:
            - id: a-first
              text: { uk: "t-02 стане перед t-01", en: "t-02 goes before t-01" }
            - id: b-first
              text: { uk: "t-01 стане перед t-02", en: "t-01 goes before t-02" }
              why:
                uk: "Від’ємне число означає «`a` перед `b`», а `a` тут — t-02."
                en: "A negative number means “`a` before `b`”, and `a` here is t-02."
            - id: removed
              text: { uk: "Одну зі справ буде прибрано, бо результат від’ємний", en: "One of the tasks is removed because the result is negative" }
              why:
                uk: "Компаратор лише вирішує порядок пари. Кількість елементів сортування не змінює."
                en: "A comparator only decides the order of a pair. Sorting never changes the number of items."
          correct: [a-first]
        explanation:
          uk: "Менше нуля — `a` перед `b`; більше нуля — `b` перед `a`; нуль — порядок пари не змінюється. Тест порядку перевіряє саме це: що справи вишикувалися так, як задумано."
          en: "Below zero — `a` before `b`; above zero — `b` before `a`; zero — the pair keeps its order. An order test checks exactly that: the tasks lined up the way they were meant to."

  - id: to-project
    kind: transfer
    capstoneStep: JS-09
    body:
      uk: "У тестах свого проєкту порівнюй записи й списки через `toEqual`, а числа й текст — через `toBe`. Для `validate…` перевіряй увесь повернений об’єкт `{ ok, … }`, а не лише одне поле, і давай кожній перевірці опис — він знадобиться, коли тест упаде."
      en: "In your project’s tests compare records and lists with `toEqual`, and numbers and text with `toBe`. For `validate…` check the whole returned `{ ok, … }` object, not just one field, and give every check a description — you will need it when the test fails."
