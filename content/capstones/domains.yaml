# Canonical capstone domain contract, shared by every stage (JavaScript → React → React Native → Node.js).
# Identifiers and comments are English; learner-facing example text is localized (uk default, en).
# All data here is synthetic. No production wishlist source, assets or records are used.
schemaVersion: 1

# Rules common to all four capstones.
common:
  ids: "Opaque unique strings (for example 'w-01'); never derived from user-visible text."
  dates: "Calendar dates are plain 'YYYY-MM-DD' strings. No time-of-day and no timezone arithmetic in the capstone; the current day is always passed in as a parameter so behavior is testable."
  storageKey: "jsll.<capstoneId>.v1"   # value: { schemaVersion: 1, records: [...] }
  validation: "validate*(input) returns { ok: true, value } or { ok: false, errors: { field: messageKey } }; UI text for messageKey is localized."
  operations: [create, update, remove, toggle-status, filter, search-by-text, sort, summarize, serialize, restore]
  boundaries: "No payments, bank connections, scraping, complex calendars/timezones or medical claims."

capstones:
  wishlist:
    title: { uk: "Список бажань", en: "Wishlist" }
    pitch:
      uk: "Збирай речі, які хочеш отримати, і відмічай уже отримані."
      en: "Collect things you would like to have and mark the ones you already got."
    entity: { singular: item, plural: items, uk: { singular: "бажання", plural: "бажання" }, en: { singular: "wish", plural: "wishes" } }
    record:
      id: "string"
      name: "string, 1–80 characters after trimming"
      price: "number | null — optional, non-negative, whole currency units"
      acquired: "boolean, default false"
      category: "string | null — optional free text, at most 30 characters"
    statusFilter: { field: acquired, values: [wanted, acquired] }
    derived: "item count; total price of wanted items that have a price (items without a price are counted separately)"
    extension: "acquired flag and optional category"
    fixtures:
      - { id: w-01, name: { uk: "Навушники", en: "Headphones" }, price: 80, acquired: false, category: { uk: "Техніка", en: "Tech" } }
      - { id: w-02, name: { uk: "Настільна лампа", en: "Desk lamp" }, price: 45, acquired: false, category: { uk: "Дім", en: "Home" } }
      - { id: w-03, name: { uk: "Велосипед", en: "Bicycle" }, price: 240, acquired: false, category: { uk: "Спорт", en: "Sport" } }
      - { id: w-04, name: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }, price: 25, acquired: true, category: { uk: "Книжки", en: "Books" } }
      - { id: w-05, name: { uk: "Квитки на концерт", en: "Concert tickets" }, price: null, acquired: false, category: null }
      - { id: w-06, name: { uk: "Термочашка", en: "Travel mug" }, price: 18, acquired: true, category: { uk: "Дім", en: "Home" } }

  planner:
    title: { uk: "Планувальник", en: "Planner" }
    pitch:
      uk: "Записуй справи, став терміни та відмічай виконане."
      en: "Write down tasks, set due dates and mark what is done."
    entity: { singular: task, plural: tasks, uk: { singular: "справа", plural: "справи" }, en: { singular: "task", plural: "tasks" } }
    record:
      id: "string"
      title: "string, 1–80 characters after trimming"
      dueDate: "'YYYY-MM-DD' | null — optional calendar date"
      done: "boolean, default false"
      priority: "'low' | 'normal' | 'high', default 'normal'"
    statusFilter: { field: done, values: [pending, done] }
    derived: "count of pending tasks that are due on or before the given day (tasks without a due date are never due)"
    extension: "due date and priority"
    fixtures:
      - { id: t-01, title: { uk: "Полити квіти", en: "Water the plants" }, dueDate: "2026-03-02", done: false, priority: normal }
      - { id: t-02, title: { uk: "Здати книжки в бібліотеку", en: "Return library books" }, dueDate: "2026-03-01", done: false, priority: high }
      - { id: t-03, title: { uk: "Написати бабусі", en: "Write to grandma" }, dueDate: null, done: false, priority: low }
      - { id: t-04, title: { uk: "Оплатити інтернет", en: "Pay the internet bill" }, dueDate: "2026-02-27", done: true, priority: high }
      - { id: t-05, title: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }, dueDate: "2026-03-10", done: false, priority: normal }
      - { id: t-06, title: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }, dueDate: "2026-03-05", done: true, priority: low }

  habits:
    title: { uk: "Трекер звичок", en: "Habit tracker" }
    pitch:
      uk: "Обери звички й відмічай дні, коли їх виконано."
      en: "Pick habits and mark the days you completed them."
    entity: { singular: habit, plural: habits, uk: { singular: "звичка", plural: "звички" }, en: { singular: "habit", plural: "habits" } }
    record:
      id: "string"
      name: "string, 1–80 characters after trimming"
      frequency: "'daily' | 'weekly', default 'daily'"
      active: "boolean, default true"
      completions: "string[] — unique 'YYYY-MM-DD' dates, kept sorted ascending"
    statusFilter: { field: active, values: [active, paused] }
    derived: "completion count; completion rate over a given list of days; simple streak = consecutive days ending on the given day (assumption: daily habits only, plain calendar dates)"
    extension: "dated completions and a simple streak with stated date assumptions"
    fixtures:
      - { id: h-01, name: { uk: "Ранкова зарядка", en: "Morning exercise" }, frequency: daily, active: true, completions: ["2026-02-27", "2026-02-28", "2026-03-01"] }
      - { id: h-02, name: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }, frequency: daily, active: true, completions: ["2026-02-26", "2026-02-28", "2026-03-01"] }
      - { id: h-03, name: { uk: "Пити воду", en: "Drink water" }, frequency: daily, active: true, completions: ["2026-03-01"] }
      - { id: h-04, name: { uk: "Прибирання", en: "Tidy up" }, frequency: weekly, active: true, completions: ["2026-02-22", "2026-03-01"] }
      - { id: h-05, name: { uk: "Вчити англійські слова", en: "Learn English words" }, frequency: daily, active: false, completions: ["2026-02-20"] }
      - { id: h-06, name: { uk: "Прогулянка", en: "Go for a walk" }, frequency: daily, active: true, completions: [] }

  expenses:
    title: { uk: "Трекер витрат", en: "Expense tracker" }
    pitch:
      uk: "Записуй витрати й дивись, на що йдуть гроші."
      en: "Record expenses and see where the money goes."
    entity: { singular: expense, plural: expenses, uk: { singular: "витрата", plural: "витрати" }, en: { singular: "expense", plural: "expenses" } }
    record:
      id: "string"
      label: "string, 1–80 characters after trimming"
      amountMinor: "integer > 0 — amount in minor units (kopiykas/cents) of the project currency"
      date: "'YYYY-MM-DD'"
      category: "string, 1–30 characters; one of the project's category list"
    currency: "One fixed currency per project (default UAH, 2 decimal places). Amounts are stored as integers in minor units and formatted only for display."
    statusFilter: { field: category, values: "the project's category list" }
    derived: "total per category and overall total, in minor units"
    extension: "fixed currency per project, integer minor units and category totals"
    categories:
      - { id: food, uk: "Їжа", en: "Food" }
      - { id: transport, uk: "Транспорт", en: "Transport" }
      - { id: home, uk: "Дім", en: "Home" }
      - { id: fun, uk: "Розваги", en: "Fun" }
    fixtures:
      - { id: e-01, label: { uk: "Продукти на тиждень", en: "Weekly groceries" }, amountMinor: 84550, date: "2026-03-01", category: food }
      - { id: e-02, label: { uk: "Проїзний", en: "Transit pass" }, amountMinor: 52000, date: "2026-03-01", category: transport }
      - { id: e-03, label: { uk: "Кава з друзями", en: "Coffee with friends" }, amountMinor: 18000, date: "2026-02-28", category: fun }
      - { id: e-04, label: { uk: "Лампочки", en: "Light bulbs" }, amountMinor: 9990, date: "2026-02-27", category: home }
      - { id: e-05, label: { uk: "Квитки в кіно", en: "Cinema tickets" }, amountMinor: 30000, date: "2026-02-27", category: fun }
      - { id: e-06, label: { uk: "Обід", en: "Lunch" }, amountMinor: 21050, date: "2026-03-02", category: food }
