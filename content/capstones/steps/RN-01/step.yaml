# Capstone step of unit RN-01 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson of kind capstone-step of RN-01 from this file.
# A local step: done in the learner's editor, terminal and on the declared native target; no platform
# checks. The project page shows only the intro of a local step, so the intro carries the whole procedure.
# Every computer-side command was run on macOS (Node.js 25.2.1, npm 11.6.2, create-expo-app 5.0.0,
# Expo SDK 57: expo 57.0.26, react-native 0.86.3) in a scratch home on all four projects, continuing the
# RE-12 references: create-expo-app, the copies, npm pkg set, tsc, the course test runner, expo install
# --check, expo export for android and ios, diff and the commit. That computer had no emulator, simulator
# or phone: nothing was run on a native target, and the intro quotes no device output. Quoted output is
# from the wishlist run.
# reference/ is the native project after the step without the files the template generates and the
# platform cannot carry (assets/*.png, LICENSE, package-lock.json, node_modules/).
unit: RN-01
mode: local
entry: App.tsx
title:
  uk: "Нативний проєкт поруч із веб-клієнтом"
  en: "A native project next to the web client"
intro:
  uk: |
    Твій проєкт отримує другий клієнт — нативний застосунок на Expo SDK 57 (React Native 0.86). Він живе в **окремій теці поруч** із React-проєктом: `~/js-course/<проєкт>-native` (наприклад, `~/js-course/wishlist-native`). Правила домену він не переписує, а бере копії файлів React-проєкту без жодної зміни. Перший екран — hello-екран: один справжній стартовий запис через спільний форматер і назва платформи.

    | Проєкт | Тека | Запис | Спільний форматер | Що показує екран (у нас, українською) |
    |---|---|---|---|---|
    | Список бажань | `wishlist-native` | `w-01` | `formatItemLabel` | «Навушники — 80» |
    | Планувальник | `planner-native` | `t-01` | `formatTaskLabel` | «Полити квіти (2026-03-02) · звичайний», «ще не виконано» |
    | Трекер звичок | `habits-native` | `h-01` | `formatHabitLabel` | «Ранкова зарядка · щодня», «Виконань: 3» |
    | Трекер витрат | `expenses-native` | `e-01` | `formatExpenseLabel` | «Продукти на тиждень — 845,50 грн», «2026-03-01 · Їжа» |

    **Чому окрема тека, а не тека всередині React-проєкту.** Metro, як його налаштовує шаблон Expo, збирає лише файли всередині теки проєкту: імпорт `../domain/wishes.ts` з теки, вкладеної в React-проєкт, у нас закінчився `Unable to resolve module ../domain/wishes.ts`. Тож спільні файли — **копії**, і їхній список із правилами живе в `docs/shared-code.md`. До того ж React-проєкт лишається таким, яким ти випустив його як 1.0.0: його `npm run ci` не бачить жодного нового файлу. Цей вибір діє на всі кроки React Native.

    Нижче — «Список бажань». Команди на комп’ютері виконано на macOS (Node.js 25.2.1, npm 11.6.2, create-expo-app 5.0.0) на всіх чотирьох проєктах. Емулятора, симулятора й телефона на тому комп’ютері не було: кроки 8–9 описано за документацією Expo SDK 57 і уроком про hello-екран, їхнього виводу тут немає.

    **1. Стан на початку.** `cd ~/js-course/wishlist`, `git status` — чисто, `git describe --tags` — `v1.0.0`. Файл `~/js-course/native-target.md` з уроку про інструменти називає твою заявлену ціль (або каже, що її немає).

    **2. Новий проєкт поруч.** `cd ~/js-course`, потім `npx create-expo-app@latest wishlist-native --template blank-typescript@sdk-57 --no-agents-md`. У нас спершу `Creating wishlist-native using the blank-typescript@sdk-57 template.`, наприкінці `✅ Your project is ready!`. `cd wishlist-native`, `git log --oneline` — один commit `Initial commit`. Тека `~/js-course` сама не репозиторій, тому в нової теки — власний Git.

    **3. Копії спільного коду.** `mkdir -p domain data tests`, потім `cp ../wishlist/domain/wishes.ts domain/`, `cp ../wishlist/data/model.ts ../wishlist/data/wishes.json data/` і `cp ../wishlist/tests/testing.js ../wishlist/tests/domain.test.js ../wishlist/tests/model.test.js tests/`. Шляхи всередині копій (`../domain/wishes.ts`) лишаються правильними, бо структура тек та сама. Нічого в копіях не змінюй. Запиши в `docs/shared-code.md`, що звідки скопійовано і як перевірити, що копії не розійшлися.

    **4. Налаштування.** У `tsconfig.json` додай до `compilerOptions` `"lib": ["ESNext"]` і `"allowImportingTsExtensions": true`. Без другого `npx tsc --noEmit` каже `error TS5097: An import path can only end with a '.ts' extension when 'allowImportingTsExtensions' is enabled.`; перше прибирає типи DOM, тож `document` у спільному файлі — помилка `TS2584: Cannot find name 'document'` (ми перевірили на пробному файлі). Потім `npm pkg set type=module scripts.typecheck="tsc --noEmit" scripts.test="node run-tests.js"`: без `"type": "module"` Node.js на кожному запуску тестів друкує попередження `[MODULE_TYPELESS_PACKAGE_JSON]`; із ним `npx expo export` у нас збирав так само.

    **5. Тести.** `run-tests.js` у корені імпортує `./tests/domain.test.js` і `./tests/model.test.js`, викликає `run()` з `./tests/testing.js` і при хоч одному провалі ставить `process.exitCode = 1` — так само, як у React-проєкті.

    **6. Hello-екран.** У `App.tsx`: `parseItemList(fixtures.records)` перевіряє стартові записи з `data/wishes.json`, `indexById(…).get(HELLO_ID)` знаходить `w-01`, а текст дає `formatItemLabel`. Заголовок — `<Text role="heading">` з назвою проєкту; під записом — рядок «Платформа: » і `Platform.OS`. Якщо запису немає, екран каже «Такого бажання немає», а не падає.

    **7. Перевірка на комп’ютері.** `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — жодного рядка; `npm test` — `Пройшли: 19 · не пройшли: 0`; `diff -r ../wishlist/domain domain` і `diff ../wishlist/data/model.ts data/model.ts` — жодного рядка; `npx expo export --platform android` — у нас `Android Bundled 1474ms index.ts (583 modules)` (тека `dist/` уже в `.gitignore` шаблону).

    **8. На заявленій цілі.** `npm start`, далі як в уроці про hello-екран: Android-телефон — Expo Go і QR-код, емулятор Android — клавіша `a`, симулятор iOS — `i`, iPhone — власна збірка Expo Go через TestFlight. Очікувано: заголовок «Список бажань», рядок «Навушники — 80» і «Платформа: android» (чи `ios`). Потім зміни `HELLO_ID` на `w-04` — має з’явитися «Книжка про JavaScript — 25 · отримано», на `w-05` — «Квитки на концерт — без ціни»; і поверни `w-01`. Цих екранів ми не бачили: вони виведені з тих самих функцій, запущених у Node.js.

    **9. Доказ.** У `EVIDENCE.md` — розділ «RN-01»: що зроблено на комп’ютері (рядки з кроку 7) і що на цілі — ціль, режим збірки (debug, Expo Go), Expo SDK, рядок журналу Metro, знімок екрана. **Немає емулятора чи телефона?** Зроби кроки 1–7 і 9, а замість результату на цілі запиши, що саме не виконано, на якій цілі, чому і що потрібно, щоб повернутися, — без жодного «побаченого» результату. Платформа цей крок не перевіряє, тож чесний запис — твій єдиний доказ; наступні кроки відкриті й так.

    **10. Commit.** `git status --short` — ` M App.tsx`, ` M package.json`, ` M tsconfig.json`, `?? EVIDENCE.md`, `?? data/`, `?? docs/`, `?? domain/`, `?? run-tests.js`, `?? tests/`. `git add -A`, `git commit -m "Show a hello screen with one shared starting record"` — у нас `12 files changed`.

    **Самоперевірка:** `diff` з кроку 7 нічого не друкує; `npx tsc --noEmit` і `npm test` проходять; `EVIDENCE.md` містить або те, що ти справді бачив на цілі, або чесний запис «не виконано»; React-проєкт не змінився (`git status` у `~/js-course/wishlist` — чисто).

    **Якщо щось пішло не так:** `npx expo install --check` називає розбіжність версій — `npx expo install --fix`, не `npm audit fix --force`. `Unable to resolve module` — імпорт виходить за теку проєкту: файл має бути скопійований усередину. `TS5097` — немає `allowImportingTsExtensions`.

    Еталон кроку — `Завантажити: RN-01 — Нативний проєкт поруч із веб-клієнтом` після експорту. У ньому немає файлів, які створює шаблон і які платформа не переносить: `assets/*.png`, `LICENSE`, `package-lock.json`, `node_modules/`. Щоб скористатися еталоном, створи проєкт командою з кроку 2, скопіюй файли еталона поверх і виконай `npm install`. Команди виконано лише на macOS; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    Your project gets a second client: a native app on Expo SDK 57 (React Native 0.86). It lives in a **separate folder next to** the React project: `~/js-course/<project>-native` (for example `~/js-course/wishlist-native`). It does not rewrite the domain rules; it takes copies of the React project's files without a single change. The first screen is a hello screen: one real starting record through the shared formatter, and the platform's name.

    | Project | Folder | Record | Shared formatter | What the screen shows (ours, in English) |
    |---|---|---|---|---|
    | Wishlist | `wishlist-native` | `w-01` | `formatItemLabel` | “Headphones — 80” |
    | Planner | `planner-native` | `t-01` | `formatTaskLabel` | “Water the plants (2026-03-02) · normal”, “not done yet” |
    | Habit tracker | `habits-native` | `h-01` | `formatHabitLabel` | “Morning exercise · daily”, “Completions: 3” |
    | Expense tracker | `expenses-native` | `e-01` | `formatExpenseLabel` | “Weekly groceries — 845.50 UAH”, “2026-03-01 · Food” |

    **Why a separate folder and not a folder inside the React project.** Metro, as the Expo template sets it up, bundles only the files inside the project folder: an import of `../domain/wishes.ts` from a folder nested in the React project ended for us with `Unable to resolve module ../domain/wishes.ts`. So the shared files are **copies**, and their list with the rules lives in `docs/shared-code.md`. Besides, the React project stays as you released it as 1.0.0: its `npm run ci` sees no new file. This choice holds for every React Native step.

    Below is the wishlist. The computer commands were run on macOS (Node.js 25.2.1, npm 11.6.2, create-expo-app 5.0.0) on all four projects. That computer had no emulator, simulator or phone: steps 8–9 follow the Expo SDK 57 documentation and the hello-screen lesson, and no output of theirs is quoted here.

    **1. The starting state.** `cd ~/js-course/wishlist`, `git status` — clean, `git describe --tags` — `v1.0.0`. The file `~/js-course/native-target.md` from the tooling lesson names your declared target (or says there is none).

    **2. A new project next to it.** `cd ~/js-course`, then `npx create-expo-app@latest wishlist-native --template blank-typescript@sdk-57 --no-agents-md`. For us first `Creating wishlist-native using the blank-typescript@sdk-57 template.`, at the end `✅ Your project is ready!`. `cd wishlist-native`, `git log --oneline` — one commit `Initial commit`. The folder `~/js-course` itself is not a repository, so the new folder gets its own Git.

    **3. Copies of the shared code.** `mkdir -p domain data tests`, then `cp ../wishlist/domain/wishes.ts domain/`, `cp ../wishlist/data/model.ts ../wishlist/data/wishes.json data/` and `cp ../wishlist/tests/testing.js ../wishlist/tests/domain.test.js ../wishlist/tests/model.test.js tests/`. The paths inside the copies (`../domain/wishes.ts`) stay right because the folder structure is the same. Change nothing in the copies. Write into `docs/shared-code.md` what was copied from where and how to check that the copies have not drifted apart.

    **4. Settings.** In `tsconfig.json` add `"lib": ["ESNext"]` and `"allowImportingTsExtensions": true` to `compilerOptions`. Without the second, `npx tsc --noEmit` says `error TS5097: An import path can only end with a '.ts' extension when 'allowImportingTsExtensions' is enabled.`; the first removes the DOM types, so `document` in a shared file is an error `TS2584: Cannot find name 'document'` (we checked with a probe file). Then `npm pkg set type=module scripts.typecheck="tsc --noEmit" scripts.test="node run-tests.js"`: without `"type": "module"` Node.js prints the warning `[MODULE_TYPELESS_PACKAGE_JSON]` on every test run; with it, `npx expo export` bundled just the same for us.

    **5. Tests.** `run-tests.js` in the root imports `./tests/domain.test.js` and `./tests/model.test.js`, calls `run()` from `./tests/testing.js` and sets `process.exitCode = 1` when any test fails — just as in the React project.

    **6. The hello screen.** In `App.tsx`: `parseItemList(fixtures.records)` checks the starting records of `data/wishes.json`, `indexById(…).get(HELLO_ID)` finds `w-01`, and `formatItemLabel` gives the text. The heading is a `<Text role="heading">` with the project's name; under the record a line “Platform: ” and `Platform.OS`. When the record is missing the screen says “There is no such wish” instead of crashing.

    **7. The check on the computer.** `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — not a single line; `npm test` — `Passed: 19 · failed: 0`; `diff -r ../wishlist/domain domain` and `diff ../wishlist/data/model.ts data/model.ts` — not a single line; `npx expo export --platform android` — for us `Android Bundled 1474ms index.ts (583 modules)` (the `dist/` folder is already in the template's `.gitignore`).

    **8. On the declared target.** `npm start`, then as in the hello-screen lesson: an Android phone — Expo Go and the QR code, an Android emulator — the `a` key, the iOS simulator — `i`, an iPhone — your own Expo Go build through TestFlight. Expected: the heading “Wishlist”, the line “Headphones — 80” and “Platform: android” (or `ios`). Then change `HELLO_ID` to `w-04` — “A book about JavaScript — 25 · acquired” should appear, to `w-05` — “Concert tickets — no price”; and put `w-01` back. We have not seen these screens: they are derived from the same functions run in Node.js.

    **9. Evidence.** In `EVIDENCE.md`, a section “RN-01”: what was done on the computer (the lines of step 7) and what on the target — the target, the build mode (debug, Expo Go), the Expo SDK, a Metro log line, a screenshot. **No emulator or phone?** Do steps 1–7 and 9, and instead of a result on the target write down what exactly was not performed, on which target, why, and what it takes to come back — without any “seen” result. The platform does not check this step, so an honest record is your only evidence; the next steps are open either way.

    **10. Commit.** `git status --short` — ` M App.tsx`, ` M package.json`, ` M tsconfig.json`, `?? EVIDENCE.md`, `?? data/`, `?? docs/`, `?? domain/`, `?? run-tests.js`, `?? tests/`. `git add -A`, `git commit -m "Show a hello screen with one shared starting record"` — for us `12 files changed`.

    **Self-check:** the `diff` of step 7 prints nothing; `npx tsc --noEmit` and `npm test` pass; `EVIDENCE.md` holds either what you really saw on the target or an honest “not performed” record; the React project did not change (`git status` in `~/js-course/wishlist` — clean).

    **If something goes wrong:** `npx expo install --check` names a version mismatch — `npx expo install --fix`, not `npm audit fix --force`. `Unable to resolve module` — an import leaves the project folder: the file must be copied inside. `TS5097` — `allowImportingTsExtensions` is missing.

    The step's reference is `Download: RN-01 — A native project next to the web client` after the export. It lacks the files the template creates and the platform does not carry: `assets/*.png`, `LICENSE`, `package-lock.json`, `node_modules/`. To use the reference, create the project with the command of step 2, copy the reference's files over it and run `npm install`. The commands were run on macOS only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це крок твого проєкту: окремий нативний проєкт, спільний доменний код і hello-екран із цього розділу ти застосовуєш до власного застосунку. Платформа цей крок не перевіряє: доказ — вивід команд, `EVIDENCE.md` і commit."
  en: "This is a step of your project: you apply this unit's separate native project, shared domain code and hello screen to your own app. The platform does not check this step: the evidence is the command output, `EVIDENCE.md` and the commit."
objectives:
  - uk: "Створити нативний проєкт Expo SDK 57 поруч із React-проєктом і перенести в нього спільний домен і контракт як незмінні копії, перевірені `diff`, `tsc` і тестами."
    en: "Create an Expo SDK 57 native project next to the React project and bring the shared domain and contract into it as unchanged copies, checked with `diff`, `tsc` and the tests."
  - uk: "Показати один справжній стартовий запис через спільний форматер на заявленій цілі й чесно записати результат або те, що перевірку не виконано."
    en: "Show one real starting record through the shared formatter on the declared target and honestly record the result, or that the check was not performed."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й на заявленій нативній цілі: що зробити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and on the declared native target: what to do, the expected output and the self-check list are above and on the step's page in your project."
