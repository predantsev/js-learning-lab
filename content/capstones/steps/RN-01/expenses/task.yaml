# Expense tracker variant of step RN-01 (a local step: done in the learner's editor, terminal and on the
# declared native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1,
# Expo SDK 57) on the scratch project of this capstone; nothing was run on an emulator, a simulator or a phone.
strings:
  platformLabel: { uk: "Платформа", en: "Platform" }
instructions:
  uk: |
    Створи нативний проєкт поруч із React-проєктом і покажи в ньому одну стартову витрату через спільний форматер. Платформа цей крок не перевіряє.

    1. `cd ~/js-course`, `npx create-expo-app@latest expenses-native --template blank-typescript@sdk-57 --no-agents-md`, `cd expenses-native`.
    2. Скопіюй без змін: `domain/expenses.ts`, `data/model.ts`, `data/expenses.json`, `tests/testing.js`, `tests/domain.test.js`, `tests/model.test.js` з `../expenses`; список і правила — у `docs/shared-code.md`.
    3. `tsconfig.json`: `"lib": ["ESNext"]`, `"allowImportingTsExtensions": true`; `npm pkg set type=module scripts.typecheck="tsc --noEmit" scripts.test="node run-tests.js"`; `run-tests.js` запускає обидва тести.
    4. `App.tsx`: `parseExpenseList(fixtures.records)`, запис `e-01` через `indexById`, текст — `formatExpenseLabel` (сума з `amountMinor` у гривнях), під ним дата й `categoryText(category)`; заголовок «%%projectTitle%%», рядок «%%platformLabel%%: » і `Platform.OS`; без запису — «%%notFoundTitle%%».
    5. На заявленій цілі: `npm start`, Expo Go (або `a` / `i`); потім `HELLO_ID` = `e-04`, і назад `e-01`.
    6. `EVIDENCE.md`, розділ «RN-01»; `git add -A`, `git commit -m "Show a hello screen with one shared starting record"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx expo install --check` — `Dependencies are up to date`.
    - `npx tsc --noEmit` — жодного рядка.
    - `npm test` — 18 тестів, «не пройшли: 0».
    - `diff -r ../expenses/domain domain` і `diff ../expenses/data/model.ts data/model.ts` — жодного рядка.
    - `npx expo export --platform android` — рядок `Android Bundled … index.ts (… modules)`.
    - На цілі: «%%projectTitle%%», «%%fixture1Name%% — 845%%decimalMark%%50 %%currency%%», «2026-03-01 · %%categoryFood%%» і назва платформи; `e-04` — «%%fixture4Name%% — 99%%decimalMark%%90 %%currency%%» і «2026-02-27 · %%categoryHome%%».
    - `git status` у `~/js-course/expenses` — чисто: React-проєкт не змінився.

    **Доказ:** commit і `EVIDENCE.md` — рядки команд із самоперевірки й результат на цілі (ціль, debug у Expo Go, Expo SDK 57, рядок журналу Metro, знімок екрана). Немає цілі — запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися; без результату.
  en: |
    Create a native project next to the React project and show one starting expense in it through the shared formatter. The platform does not check this step.

    1. `cd ~/js-course`, `npx create-expo-app@latest expenses-native --template blank-typescript@sdk-57 --no-agents-md`, `cd expenses-native`.
    2. Copy unchanged: `domain/expenses.ts`, `data/model.ts`, `data/expenses.json`, `tests/testing.js`, `tests/domain.test.js`, `tests/model.test.js` from `../expenses`; the list and the rules go into `docs/shared-code.md`.
    3. `tsconfig.json`: `"lib": ["ESNext"]`, `"allowImportingTsExtensions": true`; `npm pkg set type=module scripts.typecheck="tsc --noEmit" scripts.test="node run-tests.js"`; `run-tests.js` runs both tests.
    4. `App.tsx`: `parseExpenseList(fixtures.records)`, the record `e-01` through `indexById`, the text from `formatExpenseLabel` (the amount from `amountMinor` in hryvnias), under it the date and `categoryText(category)`; the heading “%%projectTitle%%”, a line “%%platformLabel%%: ” and `Platform.OS`; without the record — “%%notFoundTitle%%”.
    5. On the declared target: `npm start`, Expo Go (or `a` / `i`); then `HELLO_ID` = `e-04`, and back to `e-01`.
    6. `EVIDENCE.md`, a section “RN-01”; `git add -A`, `git commit -m "Show a hello screen with one shared starting record"`.

    **Self-check — confirm every item yourself:**

    - `npx expo install --check` — `Dependencies are up to date`.
    - `npx tsc --noEmit` — not a single line.
    - `npm test` — 18 tests, “failed: 0”.
    - `diff -r ../expenses/domain domain` and `diff ../expenses/data/model.ts data/model.ts` — not a single line.
    - `npx expo export --platform android` — a line `Android Bundled … index.ts (… modules)`.
    - On the target: “%%projectTitle%%”, “%%fixture1Name%% — 845%%decimalMark%%50 %%currency%%”, “2026-03-01 · %%categoryFood%%” and the platform's name; `e-04` — “%%fixture4Name%% — 99%%decimalMark%%90 %%currency%%” and “2026-02-27 · %%categoryHome%%”.
    - `git status` in `~/js-course/expenses` — clean: the React project did not change.

    **Evidence:** the commit and `EVIDENCE.md` — the command lines of the self-check and the result on the target (the target, debug in Expo Go, Expo SDK 57, a Metro log line, a screenshot). No target — a “not performed” record: what, on which target, why, what it takes to come back; no result.
