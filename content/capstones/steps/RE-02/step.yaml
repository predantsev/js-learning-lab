# Capstone step of unit RE-02 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson re-02-10-capstone-state from this file.
# A local step: done in the learner's editor, terminal and browser; no platform checks. The project page
# shows only the intro of a local step, so the intro carries the whole procedure.
# Every command was run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome) in a scratch home on
# all four projects, continuing the RE-01 scratch projects (React 19.3.0, TypeScript 7.0.2, esbuild
# 0.28.2); every browser check below ran in Chrome against `npm start`. Quoted output is from the
# wishlist run (Ukrainian output in the uk text, English output in the en text).
# reference/ holds the same file set as RE-01 (export- and npm-generated files excluded).
unit: RE-02
mode: local
entry: index.html
title:
  uk: "Інтерактивний стан"
  en: "Interactive state"
intro:
  uk: |
    Сторінка з попереднього кроку лише показує записи. Тепер вона оживає: форма створює й редагує запис, фільтр звужує список за статусом (у трекері витрат — за категорією), а кнопки на картках змінюють запис. Кожна зміна — це новий список, який обчислюють доменні функції; [[state-setter|сетер]] отримує [[updater-function|функцію-оновлювач]], тож кілька швидких кліків нічого не гублять. Модулі `domain/` і `storage/` знову не змінюються.

    **Важливо: зміни ще не зберігаються.** Після перезавантаження сторінка знову показує записи зі сховища чи з `data/`, бо на цьому кроці ніхто не записує список у `localStorage`. Це очікувано: збереження з’явиться на кроці про ефекти.

    | Проєкт | Фільтр: значення й функція | Кнопки картки | Функції домену в обробниках |
    |---|---|---|---|
    | Список бажань | `"all"`, `"wanted"`, `"acquired"`; `filterItems` | «Позначити отриманим» / «Повернути в бажані», редагувати, видалити | `validateItem`, `addItem`, `updateItem`, `removeItem` |
    | Планувальник | `"all"`, `"pending"`, `"done"`; `filterTasks` | «Позначити виконаною» / «Повернути в невиконані», редагувати, видалити | `validateTask`, `addTask`, `updateTask`, `removeTask` |
    | Трекер звичок | `"all"`, `"active"`, `"paused"`; `filterHabits` | «Позначити сьогодні», редагувати, видалити | `validateHabit`, `addHabit`, `updateHabit`, `removeHabit`, `completeHabit(previous, id, today)` — день приходить через props, і той самий день не додається вдруге |
    | Трекер витрат | `"all"` або категорія; `filterExpenses`, перевірка — `isCategoryId` | редагувати, видалити | `validateExpense`, `parseAmountMinor` (гривні з поля → цілі копійки), `formatAmount` (копійки → текст поля), `addExpense`, `updateExpense`, `removeExpense` |

    Нижче — «Список бажань»; для свого проєкту підстав назви з таблиці й зі свого `domain/`. Перевірено на macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2, Chrome) на всіх чотирьох проєктах.

    **1. Стан на початку.** `cd ~/js-course/wishlist`, `git status` — чисто, `git log --oneline -1` — commit кроку про компоненти.

    **2. Список стає станом `App`.** `main.tsx` передає прочитаний список як початкове значення: `<App initialItems={items} />`. В `App` три [[state-variable|змінні стану]], і всі три живуть тут, бо їх читають і форма, і список:

    ```tsx
    const [items, setItems] = useState<Wish[]>(initialItems);
    const [editingId, setEditingId] = useState<string | null>(null);
    const [filter, setFilter] = useState<Filter>("all");
    ```

    `type Filter = "all" | WishStatus;`. Запис, що редагується, видимі записи й зведення не зберігай у стані — обчислюй під час рендеру: `items.find(…)`, `filter === "all" ? items : filterItems(items, filter)`, `summarizeItems(items)`.

    **3. Обробники в `App`** передають сетеру функцію-оновлювач, а нові списки рахують доменні функції:

    ```tsx
    function handleToggle(id: string) {
      setItems((previous) => {
        const item = previous.find((one) => one.id === id);
        return item === undefined ? previous : updateItem(previous, id, { acquired: !item.acquired });
      });
    }
    ```

    Так само `handleSave` (новий запис — `addItem(previous, newId(previous), fields)`, редагування — `updateItem(previous, id, fields)` і `setEditingId(null)`) і `handleRemove` (`removeItem`; якщо видалили запис, що редагується, — `setEditingId(null)`). `newId` — функцію з `ui/page.js`, яка шукає вільний id, — перенеси в `App.tsx` з параметром-списком; стару сторінку показує `git show HEAD~1:ui/page.js`.

    **4. Фільтр** — [[controlled-input|керований]] `<select id="list-filter" value={filter} onChange={handleFilter}>` з підписом «Показати» і тими самими варіантами, що були у старій сторінці. `event.target.value` — це будь-який текст, тож обробник перевіряє його, перш ніж покласти в стан:

    ```tsx
    function handleFilter(event: ChangeEvent<HTMLSelectElement>) {
      const value = event.target.value;
      if (value === "all" || value === "wanted" || value === "acquired") {
        setFilter(value);
      }
    }
    ```

    Порожній після фільтра список показує окремий текст («Із цим фільтром бажань немає.»), а не «Бажань поки немає…».

    **5. `ItemForm`** отримує `{ item: Wish | null; categories: string[]; onSave: (fields: WishFields) => void; onCancel: () => void }`, де `export type WishFields = Omit<Wish, "id">;`. Чернетка — один об’єкт стану `{ name, price, category, acquired }`, де ціна — текст, як його ввели (порожній рядок — «без ціни»). Кожне поле керується: `value={draft.name}` і `onChange={(event) => setDraft({ ...draft, name: event.target.value })}`, у позначки — `checked` і `event.target.checked`. `handleSubmit(event: SubmitEvent<HTMLFormElement>)` спершу викликає `event.preventDefault()`, потім `validateItem`: з помилками — показує повідомлення під полями (функцію `messageFor` перенеси зі старої сторінки, а поле з помилкою отримує `aria-invalid`), без помилок — викликає `onSave` і очищає чернетку. Коли `item` не `null`, поруч зі «Зберегти» є кнопка «Скасувати редагування».

    В `App` форма стоїть з [[list-key|ключем]] `<ItemForm key={editingId ?? "new"} … />`: інший `key` — нова форма, тож вибір іншого запису починає чернетку з його даних (`useState` читає початкове значення лише під час першого рендеру).

    **6. Картки.** `ItemList` передає далі `onToggle`, `onEdit` і `onRemove` (`(id: string) => void`). `ItemCard` показує кнопки зі старої сторінки, і кожна в `aria-label` називає запис, наприклад `"Редагувати: " + item.name`, щоб кнопки різних карток розрізнялися. Видалення спершу питає підтвердження: прапорець `confirming` потрібен лише цій картці, тож він — її власний `useState(false)`.

    **7. Перевірка інструментами.** `npm run typecheck` і `npm run lint` — лише рядки заголовка; `npm run build` — `dist/app.js      1.2mb ⚠️` і `⚡ Done in 41ms`; `npm test` — `Пройшли: 30 · не пройшли: 0`, як і раніше.

    **8. Перевірка в браузері** (`npm start`, `http://127.0.0.1:4310/`). Ми перевіряли з порожнім сховищем і шістьма початковими бажаннями:

    - «Зберегти» з порожньою формою — під полем назви `Вкажи назву бажання`, карток так само шість;
    - нове бажання «Рюкзак» за 30 — сьома картка, форма порожня, зведення `Бажань: 7 · Ще хочу на суму: 395 грн · Без ціни: 1`;
    - «Редагувати» на «Навушниках» — поля заповнено, ціна 90 — картка показує `90 грн`; «Редагувати» на іншій картці посеред редагування перемикає форму на неї;
    - три швидкі кліки «Позначити отриманим» на «Велосипеді» — картка з позначкою «отримано» (непарна кількість перемикань);
    - фільтр «отримані» — три картки; «усі» — знову всі;
    - «Видалити» на «Термочашці» — питання «Видалити це бажання?», «Так, видалити» — картки немає;
    - перезавантаження — знову шість початкових бажань: зберігати ще нічого.

    У Console при цьому немає червоних повідомлень.

    **9. Commit.** `git status --short` — ` M main.tsx`, ` M ui/App.tsx`, ` M ui/ItemCard.tsx`, ` M ui/ItemForm.tsx`, ` M ui/ItemList.tsx`. Потім `git add -A` і `git commit -m "Make the form, the filter and the card buttons work"` — `[main 4c69e36] Make the form, the filter and the card buttons work` і `5 files changed, 199 insertions(+), 31 deletions(-)`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.

    **Самоперевірка:** кожен пункт кроку 8 справджується на твоїй сторінці; `npm run typecheck` і `npm run lint` — без зауважень, `npm test` — `не пройшли: 0`; у commit лише файли з `main.tsx` і `ui/`.

    **Якщо щось пішло не так** (усе відтворено на «Списку бажань»):

    - Після «Зберегти» сторінка перезавантажується, в адресі з’являється `?name=&price=&category=`, а нового запису немає — у `handleSubmit` бракує `event.preventDefault()`, і браузер надсилає форму сам.
    - `error TS2322: Type 'void' is not assignable to type 'MouseEventHandler<HTMLButtonElement> | undefined'.`, а в Console ``Cannot update a component (`App`) while rendering a different component (`ItemCard`)``, після якого без кінця повторюється червоне `There was an error during concurrent rendering but React was able to recover by instead synchronously rendering the entire root.` (кожен рендер знову перемикає записи) — написано `onClick={onToggle(item.id)}`: функцію викликано під час рендеру. Передай функцію: `onClick={() => onToggle(item.id)}`.
    - «Редагувати» не заповнює форму — у `ItemForm` немає `key={editingId ?? "new"}`.
    - Поле не реагує на введення, а в Console ``You provided a `value` prop to a form field without an `onChange` handler.`` — у поля є `value`, але немає `onChange`.
    - Кнопка перемикання нічого не змінює, і Console мовчить — оновлювач змінив запис на місці й повернув той самий список: React бачить той самий масив і не перемальовує сторінку. Поверни новий список від `updateItem`.

    Еталон кроку — кнопка `Завантажити: RE-02 — Інтерактивний стан` у розділі «Еталони для завантаження» після експорту; розпакуй окремо й порівнюй. Команди виконано лише на macOS; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    The page of the previous step only shows the records. Now it comes alive: the form creates and edits a record, the filter narrows the list by status (by category in the expense tracker), and the card buttons change a record. Every change is a new list computed by the domain functions; the [[state-setter|setter]] gets an [[updater-function]], so several quick clicks lose nothing. The `domain/` and `storage/` modules again do not change.

    **Important: changes are not saved yet.** After a reload the page again shows the records from the storage or from `data/`, because in this step nothing writes the list to `localStorage`. That is expected: saving arrives in the effects step.

    | Project | Filter: values and function | Card buttons | Domain functions in the handlers |
    |---|---|---|---|
    | Wishlist | `"all"`, `"wanted"`, `"acquired"`; `filterItems` | “Mark as acquired” / “Back to wanted”, edit, delete | `validateItem`, `addItem`, `updateItem`, `removeItem` |
    | Planner | `"all"`, `"pending"`, `"done"`; `filterTasks` | “Mark as done” / “Back to pending”, edit, delete | `validateTask`, `addTask`, `updateTask`, `removeTask` |
    | Habit tracker | `"all"`, `"active"`, `"paused"`; `filterHabits` | “Mark today”, edit, delete | `validateHabit`, `addHabit`, `updateHabit`, `removeHabit`, `completeHabit(previous, id, today)` — the day comes through props, and the same day is never added twice |
    | Expense tracker | `"all"` or a category; `filterExpenses`, checked with `isCategoryId` | edit, delete | `validateExpense`, `parseAmountMinor` (hryvnias from the field → whole kopiykas), `formatAmount` (kopiykas → the field's text), `addExpense`, `updateExpense`, `removeExpense` |

    Below is the wishlist; for your project use the names from the table and from your own `domain/`. Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2, Chrome) on all four projects.

    **1. The starting state.** `cd ~/js-course/wishlist`, `git status` — clean, `git log --oneline -1` — the commit of the components step.

    **2. The list becomes state of `App`.** `main.tsx` passes the list it read as the starting value: `<App initialItems={items} />`. `App` has three [[state-variable|state variables]], and all three live here because both the form and the list read them:

    ```tsx
    const [items, setItems] = useState<Wish[]>(initialItems);
    const [editingId, setEditingId] = useState<string | null>(null);
    const [filter, setFilter] = useState<Filter>("all");
    ```

    `type Filter = "all" | WishStatus;`. Do not keep the record being edited, the visible records or the summary in state — compute them during render: `items.find(…)`, `filter === "all" ? items : filterItems(items, filter)`, `summarizeItems(items)`.

    **3. The handlers in `App`** pass the setter an updater function, and the domain functions compute the new lists:

    ```tsx
    function handleToggle(id: string) {
      setItems((previous) => {
        const item = previous.find((one) => one.id === id);
        return item === undefined ? previous : updateItem(previous, id, { acquired: !item.acquired });
      });
    }
    ```

    `handleSave` works the same way (a new record — `addItem(previous, newId(previous), fields)`, an edit — `updateItem(previous, id, fields)` and `setEditingId(null)`), and so does `handleRemove` (`removeItem`; if the record being edited was removed, `setEditingId(null)`). Move `newId` — the function of `ui/page.js` that finds a free id — into `App.tsx` with the list as a parameter; `git show HEAD~1:ui/page.js` shows the old page.

    **4. The filter** is a [[controlled-input|controlled]] `<select id="list-filter" value={filter} onChange={handleFilter}>` with the label “Show” and the same options as on the old page. `event.target.value` is any text, so the handler checks it before putting it into state:

    ```tsx
    function handleFilter(event: ChangeEvent<HTMLSelectElement>) {
      const value = event.target.value;
      if (value === "all" || value === "wanted" || value === "acquired") {
        setFilter(value);
      }
    }
    ```

    A list that the filter leaves empty shows its own text (“No wishes match this filter.”), not “There are no wishes yet…”.

    **5. `ItemForm`** gets `{ item: Wish | null; categories: string[]; onSave: (fields: WishFields) => void; onCancel: () => void }`, where `export type WishFields = Omit<Wish, "id">;`. The draft is one state object `{ name, price, category, acquired }`, where the price is text as it was typed (an empty string means “no price”). Every field is controlled: `value={draft.name}` and `onChange={(event) => setDraft({ ...draft, name: event.target.value })}`; the checkbox uses `checked` and `event.target.checked`. `handleSubmit(event: SubmitEvent<HTMLFormElement>)` first calls `event.preventDefault()`, then `validateItem`: with errors it shows the messages under the fields (move the `messageFor` function over from the old page, and a field with an error gets `aria-invalid`), without errors it calls `onSave` and clears the draft. When `item` is not `null`, a “Cancel editing” button stands next to “Save”.

    In `App` the form has a [[list-key|key]]: `<ItemForm key={editingId ?? "new"} … />`. Another `key` means a new form, so picking another record starts the draft from its data (`useState` reads its starting value only on the first render).

    **6. The cards.** `ItemList` passes `onToggle`, `onEdit` and `onRemove` (`(id: string) => void`) on. `ItemCard` shows the buttons of the old page, and each one names the record in its `aria-label`, for example `"Edit: " + item.name`, so the buttons of different cards are told apart. Deleting asks for a confirmation first: only this card needs the `confirming` flag, so it is the card's own `useState(false)`.

    **7. Check with the tools.** `npm run typecheck` and `npm run lint` — only the header lines; `npm run build` — `dist/app.js      1.2mb ⚠️` and `⚡ Done in 40ms`; `npm test` — `Passed: 30 · failed: 0`, as before.

    **8. Check in the browser** (`npm start`, `http://127.0.0.1:4310/`). We checked with an empty storage and the six starting wishes (the names below are those of an English project):

    - “Save” with an empty form — `Enter a name for the wish` under the name field, still six cards;
    - a new wish “Backpack” for 30 — a seventh card, an empty form, the summary `Wishes: 7 · Still wanted, total: UAH 395 · Without a price: 1`;
    - “Edit” on “Headphones” — the fields are filled, a price of 90 — the card shows `UAH 90`; “Edit” on another card in the middle of an edit switches the form to it;
    - three quick clicks of “Mark as acquired” on “Bicycle” — the card has the “acquired” mark (an odd number of switches);
    - the filter “acquired” — three cards; “all” — all of them again;
    - “Delete” on “Travel mug” — the question “Delete this wish?”, “Yes, delete” — the card is gone;
    - a reload — the six starting wishes again: nothing is saved yet.

    Meanwhile the Console has no red messages.

    **9. Commit.** `git status --short` — ` M main.tsx`, ` M ui/App.tsx`, ` M ui/ItemCard.tsx`, ` M ui/ItemForm.tsx`, ` M ui/ItemList.tsx`. Then `git add -A` and `git commit -m "Make the form, the filter and the card buttons work"` — `[main f94bcc5] Make the form, the filter and the card buttons work` and `5 files changed, 199 insertions(+), 31 deletions(-)`; `git diff HEAD~1 --stat -- domain storage` prints nothing.

    **Self-check:** every item of step 8 holds on your page; `npm run typecheck` and `npm run lint` have no findings, `npm test` — `failed: 0`; the commit has only `main.tsx` and files in `ui/`.

    **If something goes wrong** (all reproduced on the wishlist):

    - After “Save” the page reloads, the address gets `?name=&price=&category=`, and there is no new record — `handleSubmit` lacks `event.preventDefault()`, so the browser submits the form itself.
    - `error TS2322: Type 'void' is not assignable to type 'MouseEventHandler<HTMLButtonElement> | undefined'.`, and the Console says ``Cannot update a component (`App`) while rendering a different component (`ItemCard`)``, followed by an endless series of red `There was an error during concurrent rendering but React was able to recover by instead synchronously rendering the entire root.` (every render toggles the records again) — the code says `onClick={onToggle(item.id)}`: the function is called during render. Pass a function: `onClick={() => onToggle(item.id)}`.
    - “Edit” does not fill the form — `ItemForm` has no `key={editingId ?? "new"}`.
    - A field ignores typing, and the Console says ``You provided a `value` prop to a form field without an `onChange` handler.`` — the field has `value` but no `onChange`.
    - The toggle button changes nothing, and the Console is silent — the updater changed the record in place and returned the same list: React sees the same array and does not redraw the page. Return the new list of `updateItem`.

    The step's reference is the `Download: RE-02 — Interactive state` button in the “References to download” section after the export; unpack it separately and compare. The commands were run on macOS only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це крок твого проєкту: стан, обробники подій, функції-оновлювачі, незмінні оновлення й керовані поля з цього розділу ти застосовуєш, щоб форма, фільтр і кнопки карток власного застосунку запрацювали в React. Платформа цей крок не перевіряє: доказ — твоя перевірка в браузері й commit."
  en: "This is a step of your project: you apply this unit's state, event handlers, updater functions, immutable updates and controlled fields so that the form, the filter and the card buttons of your own app work in React. The platform does not check this step: the evidence is your check in the browser and the commit."
objectives:
  - uk: "Перетворити оболонку форми на керовану типізовану форму, яка створює й редагує запис через доменний валідатор і починається з даних вибраного запису завдяки `key`."
    en: "Turn the form shell into a controlled typed form that creates and edits a record through the domain validator and starts from the selected record's data thanks to a `key`."
  - uk: "Додати фільтр за статусом (у трекері витрат — за категорією) як керований `<select>`, а видимі записи й зведення обчислювати під час рендеру."
    en: "Add the status filter (the category filter in the expense tracker) as a controlled `<select>` and compute the visible records and the summary during render."
  - uk: "Змінювати список лише незмінно — функціями-оновлювачами з доменними функціями — і перевірити в браузері створення, редагування, зміну статусу, фільтр і видалення з підтвердженням."
    en: "Change the list only immutably — with updater functions that call the domain functions — and check creating, editing, the status change, the filter and the confirmed delete in the browser."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й браузері на твоєму комп’ютері: що змінити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and a browser on your computer: what to change, the expected output and the self-check list are above and on the step's page in your project."
