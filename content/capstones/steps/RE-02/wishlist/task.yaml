# Wishlist variant of step RE-02 (a local step: done in the learner's editor, terminal and browser, no
# platform checks). Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2,
# Chrome) on the scratch project of this capstone after RE-01.
strings:
  filterEmptyMessage: { uk: "Із цим фільтром бажань немає.", en: "No wishes match this filter." }
  cancelEditLabel: { uk: "Скасувати редагування", en: "Cancel editing" }
instructions:
  uk: |
    Зроби сторінку `~/js-course/wishlist` інтерактивною, не змінюючи `domain/` і `storage/`. Платформа цей крок не перевіряє; доказ — перевірка в браузері й commit. Зміни ще не зберігаються: після перезавантаження сторінка показує збережений або початковий список — збереження з’явиться на наступному кроці.

    1. `main.tsx` передає список як початкове значення: `<App initialItems={items} … />`. В `App` — `useState<Wish[]>(initialItems)`, `editingId` (`string | null`) і `filter` типу `"all" | WishStatus` → `filterItems`; значення фільтра — "all", "wanted", "acquired".
    2. Запис, що редагується, видимі записи й зведення обчислюй під час рендеру, не зберігай у стані.
    3. Обробники передають сетеру функцію-оновлювач: `handleSave` (`addItem` з `newId(previous)` або `updateItem`), `handleToggle` (`updateItem` з `acquired: !item.acquired`), `handleRemove` (`removeItem`); `newId` перенеси зі старої `ui/page.js` (`git show HEAD~1:ui/page.js`).
    4. Фільтр — керований `<select id="list-filter">` з підписом «%%filterLabel%%»; обробник кладе в стан лише відоме значення. Порожній після фільтра список показує «%%filterEmptyMessage%%».
    5. `ItemForm` — керована форма з чернеткою `{ name, price, category, acquired }` (ціна — текст; порожня — «%%noPrice%%»); `handleSubmit(event: SubmitEvent<HTMLFormElement>)` викликає `event.preventDefault()` і `validateItem`; повідомлення помилок — під полями, з `aria-invalid`; кнопка «%%cancelEditLabel%%» під час редагування. В `App` — `<ItemForm key={editingId ?? "new"} … />`.
    6. `ItemList` передає обробники в `ItemCard`; кнопки картки — «%%markAcquiredLabel%%» / «%%markWantedLabel%%», «%%editLabel%%», «%%deleteLabel%%», кожна з `aria-label`, що називає запис; видалення спершу показує «%%confirmQuestion%%» (власний `useState(false)` картки).
    7. `npm run typecheck` і `npm run lint` — без зауважень; `npm test` — 30 тестів і `не пройшли: 0`.
    8. `npm start`, `http://127.0.0.1:4310/`: порожнє «%%saveLabel%%» — «%%requiredMessage%%»; нове бажання — сьома картка й новий підсумок; редагування заповнює форму; три швидкі перемикання — позначка «%%acquiredMark%%»; фільтр «%%filterAcquired%%» — лише отримані; видалення питає «%%confirmQuestion%%»; після перезавантаження — знову початковий список.
    9. `git add -A`, `git commit -m "Make the form, the filter and the card buttons work"`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.
  en: |
    Make the page of `~/js-course/wishlist` interactive without changing `domain/` and `storage/`. The platform does not check this step; the evidence is the check in the browser and the commit. Changes are not saved yet: after a reload the page shows the saved or the starting list — saving arrives in the next step.

    1. `main.tsx` passes the list as the starting value: `<App initialItems={items} … />`. `App` has `useState<Wish[]>(initialItems)`, `editingId` (`string | null`) and `filter` of type `"all" | WishStatus` → `filterItems`; the filter values are "all", "wanted", "acquired".
    2. Compute the record being edited, the visible records and the summary during render; do not keep them in state.
    3. The handlers pass the setter an updater function: `handleSave` (`addItem` with `newId(previous)` or `updateItem`), `handleToggle` (`updateItem` with `acquired: !item.acquired`), `handleRemove` (`removeItem`); move `newId` over from the old `ui/page.js` (`git show HEAD~1:ui/page.js`).
    4. The filter is a controlled `<select id="list-filter">` with the label “%%filterLabel%%”; its handler puts only a known value into state. A list the filter leaves empty shows “%%filterEmptyMessage%%”.
    5. `ItemForm` is a controlled form with the draft `{ name, price, category, acquired }` (the price is text; empty means “%%noPrice%%”); `handleSubmit(event: SubmitEvent<HTMLFormElement>)` calls `event.preventDefault()` and `validateItem`; error messages go under the fields, with `aria-invalid`; a “%%cancelEditLabel%%” button while editing. In `App`: `<ItemForm key={editingId ?? "new"} … />`.
    6. `ItemList` passes the handlers on to `ItemCard`; the card buttons are “%%markAcquiredLabel%%” / “%%markWantedLabel%%”, “%%editLabel%%”, “%%deleteLabel%%”, each with an `aria-label` that names the record; a delete first shows “%%confirmQuestion%%” (the card's own `useState(false)`).
    7. `npm run typecheck` and `npm run lint` — no findings; `npm test` — 30 tests and `failed: 0`.
    8. `npm start`, `http://127.0.0.1:4310/`: an empty “%%saveLabel%%” — “%%requiredMessage%%”; a new wish — a seventh card and a new summary; an edit fills the form; three quick toggles — the “%%acquiredMark%%” mark; the filter “%%filterAcquired%%” — only acquired wishes; a delete asks “%%confirmQuestion%%”; after a reload, the starting list again.
    9. `git add -A`, `git commit -m "Make the form, the filter and the card buttons work"`; `git diff HEAD~1 --stat -- domain storage` prints nothing.
