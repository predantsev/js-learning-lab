# Habit tracker variant of step RE-02 (a local step: done in the learner's editor, terminal and browser, no
# platform checks). Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2,
# Chrome) on the scratch project of this capstone after RE-01.
strings:
  filterEmptyMessage: { uk: "Із цим фільтром звичок немає.", en: "No habits match this filter." }
  cancelEditLabel: { uk: "Скасувати редагування", en: "Cancel editing" }
instructions:
  uk: |
    Зроби сторінку `~/js-course/habits` інтерактивною, не змінюючи `domain/` і `storage/`. Платформа цей крок не перевіряє; доказ — перевірка в браузері й commit. Зміни ще не зберігаються: після перезавантаження сторінка показує збережений або початковий список — збереження з’явиться на наступному кроці.

    1. `main.tsx` передає список як початкове значення: `<App initialHabits={habits} … />`. В `App` — `useState<Habit[]>(initialHabits)`, `editingId` (`string | null`) і `filter` типу `"all" | HabitStatus` → `filterHabits`; значення фільтра — "all", "active", "paused".
    2. Запис, що редагується, видимі записи й зведення обчислюй під час рендеру, не зберігай у стані.
    3. Обробники передають сетеру функцію-оновлювач: `handleSave` (`addHabit` з `newId(previous)` або `updateHabit`), `handleMarkToday` (`completeHabit(previous, id, today)` — день із props, повторно не додається), `handleRemove` (`removeHabit`); `newId` перенеси зі старої `ui/page.js` (`git show HEAD~1:ui/page.js`).
    4. Фільтр — керований `<select id="list-filter">` з підписом «%%filterLabel%%»; обробник кладе в стан лише відоме значення. Порожній після фільтра список показує «%%filterEmptyMessage%%».
    5. `HabitForm` — керована форма з чернеткою `{ name, frequency, active }` (частота спершу `"daily"`, звичка спершу активна; дати виконань форма не змінює); `handleSubmit(event: SubmitEvent<HTMLFormElement>)` викликає `event.preventDefault()` і `validateHabit`; повідомлення помилок — під полями, з `aria-invalid`; кнопка «%%cancelEditLabel%%» під час редагування. В `App` — `<HabitForm key={editingId ?? "new"} … />`.
    6. `HabitList` передає обробники в `HabitCard`; кнопки картки — «%%markTodayLabel%%», «%%editLabel%%», «%%deleteLabel%%», кожна з `aria-label`, що називає запис; видалення спершу показує «%%confirmQuestion%%» (власний `useState(false)` картки).
    7. `npm run typecheck` і `npm run lint` — без зауважень; `npm test` — 29 тестів і `не пройшли: 0`.
    8. `npm start`, `http://127.0.0.1:4310/`: порожнє «%%saveLabel%%» — «%%requiredMessage%%»; нова звичка — сьома картка; редагування заповнює форму; три кліки «%%markTodayLabel%%» додають день один раз («%%completionsLabel%%» зростає на 1, з’являється «%%doneTodayMark%%»); фільтр «%%filterPaused%%» — лише звички на паузі; видалення питає «%%confirmQuestion%%»; після перезавантаження — знову початковий список.
    9. `git add -A`, `git commit -m "Make the form, the filter and the card buttons work"`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.
  en: |
    Make the page of `~/js-course/habits` interactive without changing `domain/` and `storage/`. The platform does not check this step; the evidence is the check in the browser and the commit. Changes are not saved yet: after a reload the page shows the saved or the starting list — saving arrives in the next step.

    1. `main.tsx` passes the list as the starting value: `<App initialHabits={habits} … />`. `App` has `useState<Habit[]>(initialHabits)`, `editingId` (`string | null`) and `filter` of type `"all" | HabitStatus` → `filterHabits`; the filter values are "all", "active", "paused".
    2. Compute the record being edited, the visible records and the summary during render; do not keep them in state.
    3. The handlers pass the setter an updater function: `handleSave` (`addHabit` with `newId(previous)` or `updateHabit`), `handleMarkToday` (`completeHabit(previous, id, today)` — the day comes from props and is never added twice), `handleRemove` (`removeHabit`); move `newId` over from the old `ui/page.js` (`git show HEAD~1:ui/page.js`).
    4. The filter is a controlled `<select id="list-filter">` with the label “%%filterLabel%%”; its handler puts only a known value into state. A list the filter leaves empty shows “%%filterEmptyMessage%%”.
    5. `HabitForm` is a controlled form with the draft `{ name, frequency, active }` (the frequency starts as `"daily"`, a habit starts active; the form never changes the completions); `handleSubmit(event: SubmitEvent<HTMLFormElement>)` calls `event.preventDefault()` and `validateHabit`; error messages go under the fields, with `aria-invalid`; a “%%cancelEditLabel%%” button while editing. In `App`: `<HabitForm key={editingId ?? "new"} … />`.
    6. `HabitList` passes the handlers on to `HabitCard`; the card buttons are “%%markTodayLabel%%”, “%%editLabel%%”, “%%deleteLabel%%”, each with an `aria-label` that names the record; a delete first shows “%%confirmQuestion%%” (the card's own `useState(false)`).
    7. `npm run typecheck` and `npm run lint` — no findings; `npm test` — 29 tests and `failed: 0`.
    8. `npm start`, `http://127.0.0.1:4310/`: an empty “%%saveLabel%%” — “%%requiredMessage%%”; a new habit — a seventh card; an edit fills the form; three clicks of “%%markTodayLabel%%” add the day once (“%%completionsLabel%%” grows by 1, “%%doneTodayMark%%” appears); the filter “%%filterPaused%%” — only paused habits; a delete asks “%%confirmQuestion%%”; after a reload, the starting list again.
    9. `git add -A`, `git commit -m "Make the form, the filter and the card buttons work"`; `git diff HEAD~1 --stat -- domain storage` prints nothing.
