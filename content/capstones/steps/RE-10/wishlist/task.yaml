# Wishlist variant of step RE-10 (a local step: done in the learner's editor, terminal and browser, no
# platform checks). Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2,
# Chrome) on the scratch project of this capstone after RE-09. tests.html caught three deliberately wrong versions
# (the same lazy on retry, Suspense around the whole app, the search not applied).
strings:
  summaryLinkLabel: { uk: "Підсумки бажань", en: "Wishlist totals" }
  summaryTitle: { uk: "Підсумки бажань", en: "Wishlist totals" }
  searchingMessage: { uk: "Шукаю…", en: "Searching…" }
  searchEmptyMessage: { uk: "Нічого не знайдено.", en: "Nothing found." }
  loadingSummaryMessage: { uk: "Завантажую підсумки…", en: "Loading the summary…" }
  reloadHintMessage: { uk: "Браузер пам’ятає файл, який не завантажився, до перезавантаження сторінки.", en: "The browser remembers a file that failed to load until the page is reloaded." }
  reloadPageLabel: { uk: "Перезавантажити сторінку", en: "Reload the page" }
instructions:
  uk: |
    Ліниво завантаж один маршрут проєкту з власною межею Suspense і справжньою повторною спробою, а пошук зроби transition. `domain/`, `storage/` і `data/` не змінюються. Платформа цей крок не перевіряє.

    1. `package.json`: `"build": "esbuild main.tsx --bundle --splitting --sourcemap --format=esm --outdir=dist --entry-names=app"`; після `npm run build` у `dist/` — `app.js` і окремий файл `ItemTotals-….js`.
    2. `ui/ItemTotals.tsx` (`export default`) показує кількість бажань, сума цін бажаного (`summarizeItems`) і скільки бажань без ціни.
    3. `ui/SummaryRoute.tsx`: `useState(() => lazy(loadSummary))`, `<Suspense fallback={<p role="status">%%loadingSummaryMessage%%</p>}>` лише навколо цього маршруту, `ScreenBoundary` з `key={attempt}`, `onRetry`, що створює новий `lazy`, і `extra` — «%%reloadPageLabel%%» після невдалої повторної спроби; `summaryImport.failNext` / `delayMs` — для тестів. Маршрут `summary` у `App` стоїть перед `:id`; посилання «%%summaryLinkLabel%%» — над списком.
    4. `ItemsScreen`: поле «%%searchLabel%%» — термінове `text`; `query` і перша сторінка — у `startTransition`; список — `searchItems(shown, query)` за `name` або `category`; поки `isPending` — «%%searchingMessage%%» у `role="status"` і клас `stale` (приглушений список).
    5. `tests/ui.test.tsx`: fallback, потім підсумок; невдале завантаження → помилка → «%%tryAgainLabel%%» → підсумок; дві невдачі поспіль → «%%reloadPageLabel%%»; пошук показує кожну літеру й лишає одну картку.
    6. `npm run typecheck`, `npm run lint` — без зауважень; `npm test` — 37 тестів і `не пройшли: 0`; `tests.html` — 12 рядків `✓`.
    7. Збій завантаження вручну: `npm start`, видали `dist/ItemTotals-*.js`, відкрий «%%summaryLinkLabel%%» — помилка з «%%tryAgainLabel%%»; `npm run build` в іншому терміналі; «%%tryAgainLabel%%» — знову помилка (браузер не питає сервер ще раз) і кнопка «%%reloadPageLabel%%»; вона показує підсумок за тією самою адресою.
    8. `git add -A`, `git commit -m "Load the summary route lazily and search in a transition" -m "Versions: react 19.3.0, react-dom 19.3.0, esbuild 0.28.2 (npm ls). lazy, Suspense and useTransition are stable React APIs in this version."`.
  en: |
    Lazy-load one route of the project behind its own Suspense boundary with a real retry, and make the search a transition. `domain/`, `storage/` and `data/` do not change. The platform does not check this step.

    1. `package.json`: `"build": "esbuild main.tsx --bundle --splitting --sourcemap --format=esm --outdir=dist --entry-names=app"`; after `npm run build`, `dist/` has `app.js` and a separate `ItemTotals-….js` file.
    2. `ui/ItemTotals.tsx` (`export default`) shows the number of wishes, the wanted price total (`summarizeItems`) and how many wishes have no price.
    3. `ui/SummaryRoute.tsx`: `useState(() => lazy(loadSummary))`, `<Suspense fallback={<p role="status">%%loadingSummaryMessage%%</p>}>` around this route only, a `ScreenBoundary` with `key={attempt}`, an `onRetry` that creates a new `lazy` and an `extra` — “%%reloadPageLabel%%” after a failed retry; `summaryImport.failNext` / `delayMs` for the tests. The `summary` route stands before `:id` in `App`; the “%%summaryLinkLabel%%” link is above the list.
    4. `ItemsScreen`: the “%%searchLabel%%” field is the urgent `text`; `query` and the first page go into `startTransition`; the list is `searchItems(shown, query)` by `name` or `category`; while `isPending` — “%%searchingMessage%%” in `role="status"` and the class `stale` (a dimmed list).
    5. `tests/ui.test.tsx`: the fallback, then the summary; a failed load → the error → “%%tryAgainLabel%%” → the summary; two failures in a row → “%%reloadPageLabel%%”; the search shows every letter and keeps one card.
    6. `npm run typecheck`, `npm run lint` — no findings; `npm test` — 37 tests and `failed: 0`; `tests.html` — 12 `✓` lines.
    7. A failed load by hand: `npm start`, delete `dist/ItemTotals-*.js`, open “%%summaryLinkLabel%%” — the error with “%%tryAgainLabel%%”; `npm run build` in another terminal; “%%tryAgainLabel%%” — the error again (the browser does not ask the server again) and the “%%reloadPageLabel%%” button; it shows the summary at the same address.
    8. `git add -A`, `git commit -m "Load the summary route lazily and search in a transition" -m "Versions: react 19.3.0, react-dom 19.3.0, esbuild 0.28.2 (npm ls). lazy, Suspense and useTransition are stable React APIs in this version."`.
