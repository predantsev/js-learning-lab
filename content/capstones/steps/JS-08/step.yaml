# Capstone step of unit JS-08 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-08-13-capstone-async-load from this file.
unit: JS-08
mode: in-platform
entry: index.html
title:
  uk: "Асинхронне завантаження зі станами"
  en: "Asynchronous loading with states"
intro:
  uk: |
    Досі початкові записи жили в коді й з’являлися миттєво. У справжніх застосунках дані приходять «пізніше» — з мережі чи з файлу, — і поки їх немає, сторінка має щось казати людині. На цьому кроці початкові записи переїжджають у файл проєкту `data/<записи>.json` і приходять через `fetch`.

    - `data/fixtures.js` — async-функція `loadFixtures(signal)`: запит, перевірка `response.ok`, Content-Type і кожного запису тією самою функцією перевірки, що й для збережених даних.
    - Сторінка проходить стани: **завантаження** (текст, карток немає, зберегти ще не можна), **готово** (картки або, якщо записів немає, текст про порожній список), **помилка** (окреме повідомлення для відповіді не `ok`, для відсутнього з’єднання й для пошкодженого файлу та кнопка повтору).
    - Сторінку змінює лише найновіше завантаження: новий старт скасовує попередній запит через `AbortController` (або відкидає застарілу відповідь), і скасування не показується як помилка.
    - Збережені записи з попереднього кроку, як і раніше, мають перевагу: з ними запиту немає взагалі.
  en: |
    So far the starting records lived in the code and appeared at once. In real apps data arrives “later” — from the network or from a file — and until it is there, the page has to tell the person something. In this step the starting records move into the project file `data/<records>.json` and arrive through `fetch`.

    - `data/fixtures.js` — the async function `loadFixtures(signal)`: the request, the check of `response.ok`, of the Content-Type and of every record with the same check function the saved data uses.
    - The page goes through states: **loading** (a text, no cards, nothing can be saved yet), **ready** (the cards or, when there are no records, a text about the empty list), **error** (a separate message for an answer that is not `ok`, for no connection and for a damaged file, and a retry button).
    - Only the latest load changes the page: a new start aborts the previous request with `AbortController` (or drops the stale answer), and an abort is not shown as an error.
    - The saved records of the previous step still win: with them there is no request at all.
purpose:
  uk: "Це крок твого проєкту: promises, `async`/`await`, `fetch`, стани завантаження й помилки, повтор і скасування із цього розділу ти застосовуєш до власного застосунку. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply this unit's promises, `async`/`await`, `fetch`, loading and error states, retry and cancellation to your own app. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Завантажити початкові записи проєкту з JSON-файлу через `fetch` в async-функції, перевіривши статус, Content-Type і кожен запис."
    en: "Load the project's starting records from a JSON file through `fetch` in an async function, checking the status, the Content-Type and every record."
  - uk: "Показувати стани завантаження, порожнього списку й помилки (окремо для відповіді не `ok`, відсутнього з’єднання й пошкоджених даних) із кнопкою повтору."
    en: "Show loading, empty-list and error states (separately for an answer that is not `ok`, no connection and damaged data) with a retry button."
  - uk: "Скасовувати застаріле завантаження через `AbortController`, щоб сторінку змінювала лише найновіша відповідь, а скасування не показувалося як помилка."
    en: "Abort a stale load with `AbortController` so that only the latest answer changes the page and an abort is not shown as an error."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередні кроки не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
