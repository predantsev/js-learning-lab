# Wishlist variant of step JS-08. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  loadingMessage:
    uk: "Завантажую початкові бажання…"
    en: "Loading the starting wishes…"
  loadHttpError:
    uk: "Початкові бажання не завантажилися. Код відповіді:"
    en: "The starting wishes did not load. Response status:"
  loadNetworkError:
    uk: "Немає з’єднання, тож початкові бажання не завантажилися."
    en: "There is no connection, so the starting wishes did not load."
  loadDataError:
    uk: "Файл початкових бажань пошкоджений, тож вони не завантажилися."
    en: "The file of the starting wishes is damaged, so they did not load."
  retryLoadLabel:
    uk: "Завантажити ще раз"
    en: "Load again"
  emptyMessage:
    uk: "Бажань поки немає. Додай перше через форму."
    en: "There are no wishes yet. Add the first one with the form."
instructions:
  uk: |
    Початкові бажання переїжджають із коду у файл проєкту й приходять через `fetch` — так, як приходили б із сервера. Форма, картки й збереження з попереднього кроку працюють, як і раніше.

    **Файл `data/wishes.json`.** Створи його з текстом `{ "schemaVersion": 1, "records": [ … ] }`, де `records` — ті самі шість бажань `w-01`…`w-06` з тими самими полями й текстами, що в `items`. Це JSON, тож назви полів і тексти беруться в подвійні лапки, а `null`, числа, `true` і `false` — без лапок. `items` із `domain/wishes.js` після цього можна прибрати.

    **Модуль `data/fixtures.js`.** Напиши `export async function loadFixtures(signal)`:

    - робить `fetch("./data/wishes.json", { signal })` — адреса в `fetch` відраховується від сторінки `index.html`, а не від файлу модуля;
    - для відповіді не `ok` відхиляє `Error` із властивістю `status` — кодом відповіді;
    - для відповіді, що не є JSON, не є `{ schemaVersion: 1, records: масив }` або має пошкоджений запис, відхиляє `Error`. Записи перевіряй тією самою функцією, що й збережені: функцію перевірки запису зі `storage/wishes.js` (в еталоні попереднього кроку — `isUsableItem`) зроби іменованим експортом та імпортуй;
    - інакше повертає масив `records`.

    Збій мережі й скасування не перехоплюй: вони виходять із функції як є.

    **Сторінка.** У `index.html` додай елемент `role="status"` для повідомлень завантаження, кнопку «%%retryLoadLabel%%» (`type="button"`) і текст «%%emptyMessage%%». У `ui/page.js`:

    - `start(storage)` викликає `loadItems`. Якщо `ok`, збережені бажання показуються одразу й **без запиту**. Інакше — нічого не збережено або дані пошкоджені (тоді «%%loadErrorMessage%%», як і раніше) — сторінка завантажує початкові бажання через `loadFixtures`.
    - **Завантаження:** поки відповідь у дорозі, видно «%%loadingMessage%%», карток немає, кнопка «%%saveLabel%%» вимкнена (`disabled`), кнопки «%%retryLoadLabel%%» не видно (`hidden`).
    - **Готово:** картки отриманих бажань, текст завантаження зникає, «%%saveLabel%%» знову працює. Якщо бажань немає (отриманих чи збережених), видно «%%emptyMessage%%». Під час завантаження й після помилки цього тексту немає: тоді ще невідомо, чи список порожній.
    - **Помилка:** карток немає, «%%saveLabel%%» вимкнена, видно кнопку «%%retryLoadLabel%%» і одне повідомлення:
      - відповідь не `ok` — «%%loadHttpError%%», пробіл і код відповіді, наприклад `404`;
      - `fetch` відхилено без відповіді (`TypeError`) — «%%loadNetworkError%%»;
      - файл пошкоджений — «%%loadDataError%%».
    - Кнопка «%%retryLoadLabel%%» робить запит ще раз і знову проводить сторінку через ці стани.
    - **Лише найновіше завантаження змінює сторінку.** `start` може виконатися знову, поки попередня відповідь ще в дорозі (так перевірки імітують перезапуск). Тримай `AbortController` поточного завантаження: новий `start` і новий запит спершу скасовують попередній, а `AbortError` мовчки завершує скасоване завантаження — без повідомлення про помилку. Номер запиту, як в уроці про застарілі відповіді, теж підходить.

    **Перевір сам.** Якщо у вкладці «Сховище» вже є збережені бажання, вони мають перевагу й запиту не буде: щоб побачити завантаження, натисни там «Очистити сховище…» (потрібні дані спершу збережи знімком). Потім тимчасово зміни адресу в `fetch` на `./data/missing.json` і запусти: має з’явитися повідомлення з `404` і кнопка «%%retryLoadLabel%%». Поверни адресу, зітри одну кому в `data/wishes.json` — тепер «%%loadDataError%%». Поверни кому. Локальний файл приходить за мить, тож текст завантаження ти навряд чи помітиш: перевірки сповільнюють відповідь самі.

    **Як перевірятиметься:** перевірки починають із порожнього сховища й переконуються, що з першого запуску приходять шість бажань. Далі вони замінюють `fetch` власними відповідями — повільною, `404`, `500`, без з’єднання, з HTML-сторінкою, зі зламаним JSON, зі `schemaVersion: 2`, з `null`, із записом без назви, з порожнім списком — і самі викликають `start(storage)` з `ui/page.js`, іноді двічі поспіль, щоб друга відповідь прийшла раніше за першу. Вони **рахують запити**: з правильними збереженими бажаннями їх нуль, із пошкодженими — один, а після помилки й натискання «%%retryLoadLabel%%» — два. Ще вони викликають `loadFixtures` напряму й додають бажання через форму.
  en: |
    The starting wishes move out of the code into a project file and arrive through `fetch` — the way they would arrive from a server. The form, the cards and the saving of the previous step work as before.

    **The file `data/wishes.json`.** Create it with the text `{ "schemaVersion": 1, "records": [ … ] }`, where `records` are the same six wishes `w-01`…`w-06` with the same fields and texts as in `items`. This is JSON, so field names and texts go in double quotes, while `null`, numbers, `true` and `false` go without quotes. After that, `items` can be removed from `domain/wishes.js`.

    **The module `data/fixtures.js`.** Write `export async function loadFixtures(signal)`:

    - it calls `fetch("./data/wishes.json", { signal })` — an address in `fetch` is resolved from the page `index.html`, not from the module file;
    - for an answer that is not `ok` it rejects with an `Error` that has a `status` property — the status code;
    - for an answer that is not JSON, is not `{ schemaVersion: 1, records: array }` or has a damaged record, it rejects with an `Error`. Check the records with the same function as the saved ones: make the record check function of `storage/wishes.js` (`isUsableItem` in the reference of the previous step) a named export and import it;
    - otherwise it returns the array `records`.

    Do not catch a network failure or an abort: they leave the function as they are.

    **The page.** In `index.html` add an element with `role="status"` for the loading messages, a “%%retryLoadLabel%%” button (`type="button"`) and the text “%%emptyMessage%%”. In `ui/page.js`:

    - `start(storage)` calls `loadItems`. If `ok`, the saved wishes are shown at once and **without a request**. Otherwise — nothing is saved or the data is damaged (then “%%loadErrorMessage%%”, as before) — the page loads the starting wishes with `loadFixtures`.
    - **Loading:** while the answer is on its way, “%%loadingMessage%%” is visible, there are no cards, the “%%saveLabel%%” button is disabled (`disabled`), and the “%%retryLoadLabel%%” button is not visible (`hidden`).
    - **Ready:** the cards of the wishes received, the loading text is gone, “%%saveLabel%%” works again. If there are no wishes (received or saved), “%%emptyMessage%%” is visible. While loading and after an error this text is not there: then it is not known yet whether the list is empty.
    - **Error:** no cards, “%%saveLabel%%” is disabled, the “%%retryLoadLabel%%” button is visible, and one message:
      - an answer that is not `ok` — “%%loadHttpError%%”, a space and the status code, for example `404`;
      - `fetch` rejected without an answer (`TypeError`) — “%%loadNetworkError%%”;
      - a damaged file — “%%loadDataError%%”.
    - The “%%retryLoadLabel%%” button makes the request again and takes the page through these states again.
    - **Only the latest load changes the page.** `start` may run again while the previous answer is still on its way (this is how the checks imitate a restart). Keep the `AbortController` of the current load: a new `start` and a new request first abort the previous one, and an `AbortError` quietly ends the aborted load — with no error message. A request number, as in the lesson on stale responses, works too.

    **Check it yourself.** If the “Storage” tab already holds saved wishes, they win and there is no request: to see the loading, press “Clear storage…” there (save data you need in a snapshot first). Then temporarily change the address in `fetch` to `./data/missing.json` and run: a message with `404` and the “%%retryLoadLabel%%” button must appear. Put the address back, delete one comma in `data/wishes.json` — now “%%loadDataError%%”. Put the comma back. A local file arrives in an instant, so you will hardly notice the loading text: the checks slow the answer down themselves.

    **How it is checked:** the checks start with an empty storage and make sure that six wishes arrive on the first run. Then they replace `fetch` with answers of their own — a slow one, `404`, `500`, no connection, an HTML page, broken JSON, `schemaVersion: 2`, `null`, a record without a name, an empty list — and call `start(storage)` of `ui/page.js` themselves, sometimes twice in a row so that the second answer arrives before the first. They **count the requests**: with valid saved wishes there are none, with damaged ones one, and after an error and a click on “%%retryLoadLabel%%” two. They also call `loadFixtures` directly and add a wish with the form.
nudge:
  uk: "Згадай урок про стани запиту: одна функція показує стан, а async-функція завантаження спершу показує «завантаження», потім у `try` чекає дані, а в `catch` обирає повідомлення за `status` чи типом помилки. Для скасування — урок про `AbortController`: змінна з контролером поточного запиту живе на верхньому рівні модуля, а не всередині функції, інакше новий виклик не бачить попереднього."
  en: "Recall the lesson on request states: one function shows a state, and the async load function first shows “loading”, then waits for the data in `try` and picks the message by `status` or the error's type in `catch`. For aborting, the lesson on `AbortController`: the variable with the current request's controller lives at the top level of the module, not inside the function, otherwise a new call cannot see the previous one."
