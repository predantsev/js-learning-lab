feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js` і всі імпортовані модулі виконаються без помилки; інакше решта перевірок бачить порожню сторінку. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там `SyntaxError` про `import`, то назва в `import { … }` не збігається з іменованим експортом модуля — наприклад, функція перевірки запису в `storage/wishes.js` ще без `export`."
      en: "This check expects `app.js` and every imported module to run without an error; otherwise the other checks see an empty page. The “Console” tab shows the error name and the line of code. If it shows a `SyntaxError` about `import`, a name in `import { … }` does not match a named export of the module — for example, the record check function in `storage/wishes.js` has no `export` yet."
  - when: { test: "with nothing saved the six starting wishes arrive" }
    message:
      uk: "Ця перевірка дивиться на перший запуск із порожнім сховищем: після відповіді справжнього файлу мають бути шість карток `w-01`…`w-06` по порядку й жодного повідомлення про завантаження чи помилку. Якщо там «%%loadHttpError%% 404», то адреса в `fetch` не веде до `data/wishes.json`: вона відраховується від `index.html`. Якщо «%%loadDataError%%» — перевір JSON у файлі: подвійні лапки, коми між записами, жодної коми після останнього."
      en: "This check looks at the first run with an empty storage: after the real file answers, there must be six cards `w-01`…`w-06` in order and no loading or error message. If it shows “%%loadHttpError%% 404”, the address in `fetch` does not lead to `data/wishes.json`: it is resolved from `index.html`. If “%%loadDataError%%” — check the JSON in the file: double quotes, commas between records, no comma after the last one."
  - when: { test: "loadFixtures returns the checked wishes of the file" }
    message:
      uk: "Ця перевірка завантажує `data/fixtures.js` і чекає іменований експорт `loadFixtures`. Виклик `loadFixtures(signal)` зі справжнім файлом має дати масив шести бажань — саме `records`, а не весь об’єкт файлу. Відповідь `404` і файл із бажанням без назви мають відхилити promise. Для `404` перевірка ще чекає в `Error` властивість `status` зі значенням `404`."
      en: "This check loads `data/fixtures.js` and expects the named export `loadFixtures`. A call `loadFixtures(signal)` with the real file must give the array of six wishes — exactly `records`, not the whole object of the file. An answer `404` and a file with a wish without a name must reject the promise. For `404` the check also expects the `Error` to have the property `status` with the value `404`."
  - when: { test: "while the starting wishes load the page says so" }
    message:
      uk: "Ця перевірка затримує відповідь на 400 мс і через 60 мс після `start(storage)` чекає видимий текст «%%loadingMessage%%», жодної картки й жодної видимої кнопки «%%retryLoadLabel%%»; після відповіді — шість карток і жодного тексту завантаження. Стан завантаження треба показати до першого `await`."
      en: "This check delays the answer by 400 ms and, 60 ms after `start(storage)`, expects the visible text “%%loadingMessage%%”, no cards and no visible “%%retryLoadLabel%%” button; after the answer — six cards and no loading text. The loading state has to be shown before the first `await`."
  - when: { test: "the starting wishes are the ones the file answers" }
    message:
      uk: "Ця перевірка відповідає на запит трьома бажаннями `w-02`, `w-7`, `w-8` і чекає запит до `data/wishes.json` та саме ці три картки. Якщо карток шість, то сторінка бере бажання з коду, а не з відповіді `fetch`."
      en: "This check answers the request with three wishes `w-02`, `w-7`, `w-8` and expects a request for `data/wishes.json` and exactly these three cards. If there are six cards, the page takes the wishes from the code instead of the `fetch` answer."
  - when: { test: "an answer that is not ok shows its status and a retry button" }
    message:
      uk: "Ця перевірка відповідає `404`, потім `500` і щоразу чекає «%%loadHttpError%%» з кодом відповіді після нього, жодної картки й видиму ввімкнену кнопку «%%retryLoadLabel%%». `fetch` не відхиляє promise для таких відповідей: це робить перевірка `response.ok`."
      en: "This check answers `404`, then `500`, and each time expects “%%loadHttpError%%” with the status code after it, no cards and a visible, enabled “%%retryLoadLabel%%” button. `fetch` does not reject for such answers: the check of `response.ok` does that."
  - when: { test: "no connection shows the connection message and a retry button" }
    message:
      uk: "Ця перевірка відхиляє `fetch` з `TypeError`, як без з’єднання, і чекає «%%loadNetworkError%%», жодної картки й видиму ввімкнену кнопку «%%retryLoadLabel%%». Такий збій приходить у `catch`, і в нього немає `status`."
      en: "This check rejects `fetch` with a `TypeError`, as without a connection, and expects “%%loadNetworkError%%”, no cards and a visible, enabled “%%retryLoadLabel%%” button. Such a failure arrives in `catch`, and it has no `status`."
  - when: { test: "a damaged file shows the damaged-data message" }
    message:
      uk: "Ця перевірка відповідає по черзі HTML-сторінкою, зламаним JSON, `schemaVersion: 2`, `null` і списком із бажанням без назви, і щоразу чекає «%%loadDataError%%» та жодної картки. Повідомлення внизу називає відповідь, на якій сторінка повелася інакше. `response.json()` на зламаному тексті відхиляється з `SyntaxError` — і це теж пошкоджений файл."
      en: "This check answers in turn with an HTML page, broken JSON, `schemaVersion: 2`, `null` and a list with a wish without a name, and each time expects “%%loadDataError%%” and no cards. The message below names the answer where the page behaved differently. `response.json()` on broken text rejects with a `SyntaxError` — that is a damaged file too."
  - when: { test: "the retry button loads the wishes again" }
    message:
      uk: "Ця перевірка відповідає спершу `404`, натискає «%%retryLoadLabel%%», а другу відповідь затримує на 300 мс. Вона чекає: після натискання — «%%loadingMessage%%» і жодної видимої кнопки «%%retryLoadLabel%%»; потім шість карток без повідомлення про помилку; разом рівно два запити."
      en: "This check first answers `404`, clicks “%%retryLoadLabel%%” and delays the second answer by 300 ms. It expects: after the click — “%%loadingMessage%%” and no visible “%%retryLoadLabel%%” button; then six cards with no error message; exactly two requests in total."
  - when: { test: "an empty starting list says so, but only once it has arrived" }
    message:
      uk: "Ця перевірка відповідає порожнім списком `records: []` із затримкою 300 мс. Поки відповідь у дорозі, тексту «%%emptyMessage%%» видно не має бути; після неї — він видний, а карток і повідомлень про помилку немає. Потім вона запускає сторінку з порожнім збереженим списком і теж чекає «%%emptyMessage%%»."
      en: "This check answers an empty list `records: []` after 300 ms. While the answer is on its way, the text “%%emptyMessage%%” must not be visible; after it, the text is visible, and there are no cards and no error messages. Then it starts the page with an empty saved list and expects “%%emptyMessage%%” too."
  - when: { test: "the form saves only when the list is ready" }
    message:
      uk: "Ця перевірка чекає вимкнену кнопку «%%saveLabel%%» форми під час завантаження й після відповіді `404`, а ввімкнену — після отриманих бажань і після старту зі збереженими бажаннями."
      en: "This check expects the form's “%%saveLabel%%” button to be disabled while loading and after an answer `404`, and enabled after the wishes arrived and after a start with saved wishes."
  - when: { test: "only the latest start changes the page" }
    message:
      uk: "Ця перевірка викликає `start(storage)` двічі: перша відповідь (шість бажань) приходить через 700 мс, друга (`w-02`, `w-7`, `w-8`) — через 250 мс. Вона чекає, що після другого старту немає повідомлення про помилку й кнопки «%%retryLoadLabel%%», а картки — `w-02`, `w-7`, `w-8` і після того, як мала б прийти перша відповідь. Якщо там шість карток, то стара відповідь замінила новішу; якщо повідомлення про помилку, то скасований запит (`AbortError`) показано як збій."
      en: "This check calls `start(storage)` twice: the first answer (six wishes) arrives after 700 ms, the second (`w-02`, `w-7`, `w-8`) after 250 ms. It expects no error message and no “%%retryLoadLabel%%” button after the second start, and the cards `w-02`, `w-7`, `w-8` also after the first answer would have arrived. If there are six cards, the old answer replaced the newer one; if there is an error message, the aborted request (`AbortError`) was shown as a failure."
  - when: { test: "saved wishes win and need no request" }
    message:
      uk: "Ця перевірка зберігає три правильні бажання `w-02`, `w-7`, `w-8`, викликає `start(storage)` і чекає саме ці картки, нуль запитів і жодного тексту завантаження чи помилки. Запит потрібен лише тоді, коли `loadItems` не повернув `ok`."
      en: "This check saves three valid wishes `w-02`, `w-7`, `w-8`, calls `start(storage)` and expects exactly these cards, zero requests and no loading or error text. A request is needed only when `loadItems` did not return `ok`."
  - when: { test: "damaged saved data shows its message and loads the starting wishes" }
    message:
      uk: "Ця перевірка зберігає текст `{bad` і чекає: «%%loadErrorMessage%%», рівно один запит, шість карток `w-01`…`w-06` після відповіді й `{bad` під ключем `jsll.wishlist.v1.backup`."
      en: "This check saves the text `{bad` and expects: “%%loadErrorMessage%%”, exactly one request, six cards `w-01`…`w-06` after the answer, and `{bad` under the key `jsll.wishlist.v1.backup`."
  - when: { test: "a wish added after loading is saved with a new id" }
    message:
      uk: "Ця перевірка після завантаження шести бажань додає «%%newName%%» через форму й чекає під ключем `jsll.wishlist.v1` JSON зі `schemaVersion: 1` і сімома записами з різними `id`. Якщо там нічого немає, то кнопка «%%saveLabel%%» лишилася вимкненою або зміна не викликає `saveItems`."
      en: "After the six wishes have loaded, this check adds “%%newName%%” with the form and expects JSON with `schemaVersion: 1` and seven records with different `id`s under the key `jsll.wishlist.v1`. If nothing is there, the “%%saveLabel%%” button stayed disabled or the change does not call `saveItems`."
  - when: { error: TypeError }
    message:
      uk: "`TypeError` під час перевірок часто означає, що код читає поле значення, якого немає: наприклад, `start` не експортовано з `ui/page.js`, елемент не знайдено через `querySelector` (`null`) або в `catch` прийшла помилка без очікуваних полів. Рядок коду показує вкладка «Консоль»."
      en: "A `TypeError` during the checks often means the code reads a field of a value that is not there: for example, `start` is not exported from `ui/page.js`, an element was not found by `querySelector` (`null`), or `catch` received an error without the expected fields. The “Console” tab shows the line of code."
