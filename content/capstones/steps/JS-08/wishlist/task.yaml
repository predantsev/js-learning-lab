    uk: "Проєкт запускається без помилок"
    en: "The project starts without errors"
  "with nothing saved the six starting wishes arrive":
    uk: "Без збережених даних приходять шість початкових бажань"
    en: "With nothing saved the six starting wishes arrive"
  "loadFixtures returns the checked wishes of the file":
    uk: "`loadFixtures` повертає перевірені бажання з `data/wishes.json` і відхиляє погані відповіді"
    en: "`loadFixtures` returns the checked wishes of `data/wishes.json` and rejects bad answers"
  "while the starting wishes load the page says so":
    uk: "Поки бажання завантажуються, видно «%%loadingMessage%%» і немає карток"
