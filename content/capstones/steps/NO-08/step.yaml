# Capstone step of unit NO-08 — the Node.js checkpoint CP-NO (wording shared by the four capstones; what each
# project must prove is in <capstone>/task.yaml). An assessment: the intro and the task say what must be true and
# how it is proved, never how to build it; the reference/ is the complete model solution. It closes the course's
# capstone chain.
# The compiler also writes the syllabus lesson of kind capstone-step of NO-08 from this file.
# A local step: done in the learner's editor, terminal and browser; no platform checks.
# Teaching order: …, NO-12, NO-13, NO-08 — this step continues the NO-13 reference.
# Every command was run on macOS in a scratch home on all four projects, continuing the NO-13 references, in a
# Ukrainian and an English workspace, on Node.js 25.2.1 (npm 11.6.2) and on Node.js 22.13.1 (npm 10.9.2, with
# NODE_OPTIONS=--experimental-strip-types for the .ts files): npm test (with the model's tests/checkpoint.test.ts,
# three times in a row on each version), npm run lint, npm run ci (the artifact 1.2.0). The browser part ran in
# Google Chrome 154.0.8037.93 driven by playwright-core (channel "chrome", no window): the artifact in production
# mode on 4311 with a fresh data folder, the web app on 4310; a record added and one changed from the page, the
# server stopped with SIGTERM and started again, check:deploy's summary before and after, the page reloaded, a
# create with an invalid body, the server stopped and the page reloaded. Deliberately wrong variants were run
# against the model's checkpoint tests (in the task files' headers). No native target: the native check is
# recorded as not performed. Quoted output is from the wishlist run in the Ukrainian workspace on Node.js 25.2.1.
# Not run: Linux, Windows, other browsers, a native target.
# reference/ is the NO-13 reference plus the model's tests/checkpoint.test.ts and docs/CP-NO.md (without
# node_modules/, package-lock.json and the runtime folders of the server).
unit: NO-08
mode: local
entry: index.html
title:
  uk: "Контрольна точка CP-NO: наскрізна інтеграція"
  en: "Checkpoint CP-NO: end-to-end integration"
intro:
  uk: |
    Контрольна точка етапу Node.js і остання точка проєкту в курсі. Без підказок доведи, що твій проєкт працює наскрізь: сторінка у браузері → HTTP → API → сховище → файл — і назад, після перезапуску сервера. Що саме має бути правдою — у завданні твого проєкту й нижче; **як** — вирішуєш ти. Усе потрібне вже є в проєкті після NO-13; якщо якась перевірка не проходить — знайди причину й виправ, це теж частина точки.

    | Проєкт | Зміни з вебклієнта | Що доводить перезапуск | Що пояснити |
    |---|---|---|---|
    | Список бажань | нове бажання, його `acquired` | бажання, `acquired` і сума цін бажаних | чому `acquired` вирішує сервер, а не кеш клієнта |
    | Планувальник | справа з `dueDate` і `priority`, інша — `done` | кількість невиконаних справ із терміном до фіксованого дня | чому `today` передається параметром, а не береться з годинника |
    | Трекер звичок | сьогоднішнє виконання щоденної звички, інша — на паузі | `completions` і серія на фіксований день | припущення щодо дат у підрахунку серії |
    | Трекер витрат | витрата в наявній категорії | суми за категоріями й загальна в `amountMinor` — точно | чому суми лишаються цілими на всьому шляху |

    | Перевірка | Що зробити | Доказ |
    |---|---|---|
    | створення | додати запис на сторінці (сервер — з артефакту, `NODE_ENV=production`) | картка на сторінці, рядок `POST /v1/records 201` у лозі сервера, запис у справжньому `GET /v1/records` |
    | зміна | змінити запис на сторінці | рядок `PATCH` (у трекері звичок — `POST …/completions`) з `200` у лозі, нове значення в `GET` |
    | перезапуск | `kill -TERM`, старт того самого артефакту на тих самих даних | код виходу `0`; рядок `summary:` `check:deploy` до й після — однаковий |
    | перезавантаження | перезавантажити сторінку | ті самі записи й похідне значення, що до перезапуску |
    | хибний ввід | створення з хибним тілом | рівно `400`, у лозі `400`, нічого не збережено |
    | клієнт без сервера | зупинити сервер, перезавантажити сторінку, спробувати зміну | сторінка чесно каже «немає з’єднання» й нічого не вигадує |
    | нативний компаньйон | ті самі кроки на заявленій цілі | виконано — запис із ціллю й побаченим; немає цілі — **не виконано**, причина й шлях назад |

    Кожен доказ — з одного з трьох джерел і записаний так, щоб його можна було повторити: справжній запит (рядок логу сервера з `requestId` і відповідь `curl`/`fetch` зі статусом), перезапуск (той самий запит до нового процесу), сторінка (що показав браузер після перезавантаження й без сервера). Тест, що бачить це так, як людина, — частина доказу: шість перевірок через сам код вебклієнта проти справжнього процесу сервера. Нативна перевірка без цілі — це «не виконано» з причиною, ніколи не «пройдено».

    Перевірено на macOS на всіх чотирьох проєктах в українському й англійському проєктах — на Node.js 25.2.1 і 22.13.1, у Google Chrome 154; цілі для нативного компаньйона не було. Нижче — «Список бажань» в українському проєкті на 25.2.1.

    **1. Стан на початку.** `cd ~/js-course/<проєкт>`, `git status` — чисто, останній commit — `Server-render the list page: …` (NO-13). Артефакт `1.2.0` (`npm run ci` у `server/`), його запис і розпакована тека — як у runbook-у.

    **2. Перевірки.** Усі сім із таблиці, сервер — з артефакту в production-режимі на свіжій теці даних, вебзастосунок — `npm start` з `DATA_SOURCE=http`. У нас («Список бажань»: нове бажання «Ліхтарик», 120, позначене отриманим):

    ```text
    сторінка:   Ціна: 120 грн · Бажань: 7 · Ще хочу на суму: 365 грн · Без ціни: 1
    лог:        OPTIONS /v1/records 204 · POST /v1/records 201 · OPTIONS /v1/records/w-07 204 · PATCH /v1/records/w-07 200
    до:         summary: 7 wishes, wanted total 365, without a price 1
    kill -TERM: exit code 0;  той самий артефакт знову
    після:      summary: 7 wishes, wanted total 365, without a price 1
    GET /v1/records → {"id":"w-07","name":"Ліхтарик","price":120,"acquired":true,"category":null}
    POST /v1/records з {} → 400 {"error":{"code":"VALIDATION_FAILED",…,"details":{"name":"required"},…}}
    без сервера: Список не завантажився (немає з’єднання)
    ```

    **3. Тест, що бачить це як людина.** Шість перевірок — створення, зміна, перезапуск, перезавантаження, хибний ввід, клієнт без сервера — як `node:test` у `server/`, через HTTP-джерело вебклієнта проти справжнього процесу сервера (старт через `node`, зупинка `SIGTERM`, новий старт на тих самих даних). Тест має падати на зламаній інтеграції: зміни лише в пам’яті, хибний ввід як `500`, завершення з кодом `1`, зміна, яку клієнт не надсилає, клієнт, що без сервера показує порожній список.

    **4. Записи — `docs/CP-NO.md`.** План (вимога → компонент → перевірка → доказ), докази всіх перевірок із побаченим виводом, нативний запис, пояснення твого проєкту (таблиця вгорі, 4–6 речень своїми словами), один запис рішення (контекст, варіанти з їхніми режимами відмови, вибір, наслідки), компроміси щонайменше для трьох рішень (сховище, політика кешу, помилки й повтори: що вибрано, що ні, **доказ** і одна умова, за якої вибрав би інакше; твердження без доказу позначене «не перевірено»), опис PR із кроками перевірки й нотатка runbook-у з одним симптомом. У нативному проєкті — розділ «CP-NO» в `EVIDENCE.md`.

    **5. Commit.** `npm test` у теці проєкту й у `server/`, `npm run lint` — без помилок; `git add -A`, `git commit -m "CP-NO: prove the end-to-end integration: the checkpoint tests, the evidence and the trade-offs"`; у нативному проєкті — свій commit.

    **Самоперевірка — рубрика CP-NO:** кожна перевірка таблиці має свій доказ із твого комп’ютера, повторюваний за записом; запис, створений і змінений на сторінці, є в справжньому `GET` після перезапуску, а `summary:` до й після однаковий; хибний ввід — рівно `400`; без сервера сторінка нічого не вигадує; тест шести перевірок проходить і падає на зламаній інтеграції; пояснення й компроміси спираються на докази, а не на переконання; нативна перевірка виконана або чесно записана як не виконана; `git status` — чисто.

    Референс кроку — `Завантажити: NO-08 — Контрольна точка CP-NO: наскрізна інтеграція` після експорту; відкрий його лише після власної спроби. Команди виконувалися лише на macOS і в Chrome; на Linux чи Windows (Git Bash) і на нативній цілі — ні.
  en: |
    The checkpoint of the Node.js stage and the project's last point in the course. Without hints, prove that your project works end to end: the page in the browser → HTTP → API → store → file — and back, after a server restart. What exactly must be true is in your project's task and below; **how** is up to you. Everything needed is already in the project after NO-13; if a check fails, find the cause and fix it — that is part of the checkpoint too.

    | Project | Changes from the web client | What the restart proves | What to explain |
    |---|---|---|---|
    | Wishlist | a new wish, its `acquired` | the wish, `acquired` and the total price of wanted things | why the server, not the client cache, decides `acquired` |
    | Planner | a task with a `dueDate` and a `priority`, another one `done` | the count of pending tasks due by a fixed day | why `today` is passed in rather than read from the clock |
    | Habit tracker | today's completion of a daily habit, another one paused | the `completions` and the streak for a fixed day | the date assumptions of the streak |
    | Expense tracker | an expense in an existing category | the per-category and overall totals in `amountMinor` — exactly | why the amounts stay integers all the way |

    | Check | What to do | Evidence |
    |---|---|---|
    | create | add a record on the page (the server from the artifact, `NODE_ENV=production`) | the card on the page, a `POST /v1/records 201` line in the server log, the record in a real `GET /v1/records` |
    | update | change a record on the page | a `PATCH` line (in the habit tracker `POST …/completions`) with `200` in the log, the new value in `GET` |
    | restart | `kill -TERM`, start the same artifact on the same data | exit code `0`; the `summary:` line of `check:deploy` before and after — the same |
    | reload | reload the page | the same records and derived value as before the restart |
    | invalid input | a create with a wrong body | exactly `400`, `400` in the log, nothing stored |
    | a client without the server | stop the server, reload the page, try a change | the page honestly says "no connection" and invents nothing |
    | the native companion | the same steps on the declared target | performed — a record with the target and what you saw; no target — **not performed**, the reason and the way back |

    Every piece of evidence comes from one of three sources and is written down so it can be repeated: a real request (a server log line with its `requestId` and a `curl`/`fetch` answer with its status), the restart (the same request to the new process), the page (what the browser showed after a reload and without the server). A test that sees it as a person does is part of the evidence: the six checks through the web client's own code against the real server process. A native check without a target is "not performed" with a reason, never "passed".

    Checked on macOS on all four projects in a Ukrainian and an English project — on Node.js 25.2.1 and 22.13.1, in Google Chrome 154; there was no target for the native companion. Below is the Wishlist in a Ukrainian project on 25.2.1.

    **1. The starting state.** `cd ~/js-course/<project>`, `git status` — clean, the last commit is `Server-render the list page: …` (NO-13). The artifact `1.2.0` (`npm run ci` in `server/`), its record and the unpacked folder — as in the runbook.

    **2. The checks.** All seven of the table, the server from the artifact in production mode on a fresh data folder, the web app with `npm start` and `DATA_SOURCE=http`. For us (the Wishlist: a new wish "Ліхтарик", 120, marked acquired; the page text is Ukrainian):

    ```text
    page:       Ціна: 120 грн · Бажань: 7 · Ще хочу на суму: 365 грн · Без ціни: 1
    log:        OPTIONS /v1/records 204 · POST /v1/records 201 · OPTIONS /v1/records/w-07 204 · PATCH /v1/records/w-07 200
    before:     summary: 7 wishes, wanted total 365, without a price 1
    kill -TERM: exit code 0;  the same artifact again
    after:      summary: 7 wishes, wanted total 365, without a price 1
    GET /v1/records → {"id":"w-07","name":"Ліхтарик","price":120,"acquired":true,"category":null}
    POST /v1/records with {} → 400 {"error":{"code":"VALIDATION_FAILED",…,"details":{"name":"required"},…}}
    no server:  Список не завантажився (немає з’єднання)
    ```

    **3. A test that sees it as a person does.** The six checks — create, update, restart, reload, invalid input, a client without the server — as `node:test` in `server/`, through the web client's HTTP source against the real server process (started with `node`, stopped with `SIGTERM`, started again on the same data). The test must fail on a broken integration: changes kept only in memory, invalid input answered `500`, a shutdown with exit code `1`, a change the client never sends, a client that shows an empty list without the server.

    **4. The records — `docs/CP-NO.md`.** The plan (requirement → component → check → evidence), the evidence of every check with the output you saw, the native record, your project's explanation (the table above, 4–6 sentences in your own words), one decision record (the context, the options with their failure modes, the choice, the consequences), trade-offs for at least three decisions (storage, cache policy, errors and retries: what was chosen, what was not, the **evidence**, and one condition under which you would choose otherwise; a claim without evidence is marked "not verified"), a PR description with the verification steps and a runbook note with one symptom. In the native project — a section "CP-NO" in `EVIDENCE.md`.

    **5. The commit.** `npm test` in the project folder and in `server/`, `npm run lint` — no errors; `git add -A`, `git commit -m "CP-NO: prove the end-to-end integration: the checkpoint tests, the evidence and the trade-offs"`; the native project gets its own commit.

    **Self-check — the CP-NO rubric:** every check of the table has its own evidence from your computer, repeatable from the record; a record created and changed on the page is in a real `GET` after the restart, and the `summary:` before and after is the same; invalid input is exactly `400`; without the server the page invents nothing; the test of the six checks passes and fails on a broken integration; the explanation and the trade-offs rest on evidence, not on belief; the native check is performed or honestly recorded as not performed; `git status` — clean.

    The step's reference is `Download: NO-08 — Checkpoint CP-NO: end-to-end integration` after the export; open it only after your own attempt. The commands were run on macOS and in Chrome only; they were not run on Linux or Windows (Git Bash) or on a native target.
purpose:
  uk: "Це контрольна точка твого проєкту на етапі Node.js: наскрізна інтеграція вебклієнта, локального API, сховища, захисту й production-старту, доведена справжніми запитами, перезапуском і поведінкою сторінки, з поясненням компромісів — без підказок. Платформа цей крок не перевіряє: доказ — тести, `docs/CP-NO.md`, нативний запис і commit."
  en: "This is the checkpoint of your project at the Node.js stage: the end-to-end integration of the web client, the local API, the store, the hardening and the production start, proved with real requests, a restart and the page's behaviour, with the trade-offs explained — without hints. The platform does not check this step: the evidence is the tests, `docs/CP-NO.md`, the native record and the commit."
objectives:
  - uk: "Без підказок завершити наскрізну інтеграцію проєкту й довести справжніми запитами, логом сервера, перезапуском і поведінкою сторінки, що зміни з вебклієнта зберігаються, а хибний ввід і відсутній сервер обробляються чесно."
    en: "Complete the project's end-to-end integration without hints and prove with real requests, the server log, a restart and the page's behaviour that changes from the web client are kept, and that invalid input and a missing server are handled honestly."
  - uk: "Пояснити компроміси свого проєкту на доказах — запис рішення, компроміси, опис PR і нотатка runbook-у — і записати нативну перевірку як виконану або як не виконану з причиною."
    en: "Explain your project's trade-offs on evidence — a decision record, trade-offs, a PR description and a runbook note — and record the native check as performed or as not performed with its reason."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й браузері на твоєму комп’ютері: що має бути правдою, як це довести, і рубрика самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and a browser on your computer: what must be true, how to prove it and the self-check rubric are above and on the step's page in your project."
