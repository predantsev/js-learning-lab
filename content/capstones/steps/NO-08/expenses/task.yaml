# Expense tracker variant of the checkpoint CP-NO. An assessment: the instructions say what must be true and how
# it is proved, not how to build it; reference/ is the model solution (tests/checkpoint.test.ts and docs/CP-NO.md
# on top of NO-13), checked on macOS on Node.js 25.2.1 and 22.13.1 (npm test 79, the checkpoint tests 3 times in a
# row on each) and in Chrome 154 against the artifact 1.2.0 in production mode, in a Ukrainian workspace (an
# English one: npm test). Wrong variants run against tests/checkpoint.test.ts, each failed at least one test:
# changes kept only in memory, an invalid create answered 500, a shutdown with exit code 1, the client's change
# never sent, a client that shows an empty list without the server. Nothing was run on a native target. Not run
# on Linux or Windows.
instructions:
  uk: |
    Контрольна точка CP-NO — без підказок: що має бути правдою і як це доводиться; як — вирішуєш ти. Платформа цей крок не перевіряє.

    1. **Створення з вебклієнта.** Сервер — з артефакту в production-режимі на свіжій теці даних; на сторінці `http://127.0.0.1:4310/` ти додаєш витрату в **наявну** категорію. У лозі сервера — `POST /v1/records` `201` з його `requestId`.
    2. **Перезапуск.** `kill -TERM` — код `0`; той самий артефакт на тих самих даних. Справжній `GET /v1/records` після нього містить витрату з її `amountMinor`, а рядок `summary:` `check:deploy` до й після — однаковий: суми за категоріями й загальна в `amountMinor` точні — сума категорії виросла рівно на `amountMinor` нової витрати, решта не змінилася.
    3. **Перезавантаження й без сервера.** Після перезавантаження сторінка показує ті самі суми, що до перезапуску; із зупиненим сервером — «%%listLoadFailedMessage%% (%%noConnectionLabel%%)», без вигаданого списку.
    4. **Хибний ввід.** Створення з хибним тілом (зокрема з дробовим `amountMinor`) — рівно `400 VALIDATION_FAILED`, у лозі `400`, нічого не збережено.
    5. **Тест.** `node:test` у `server/`, що проводить шість перевірок через HTTP-джерело вебклієнта проти справжнього процесу сервера; очікувані суми він обчислює зі списку до змін плюс `amountMinor` нової витрати — цілими числами, без округлення; падає на зламаній інтеграції.
    6. **`docs/CP-NO.md`.** План, докази з побаченим виводом, пояснення — **чому суми лишаються цілими числами на всьому шляху** (форма, API, сховище, підсумки; форматування — лише на краю); запис рішення; компроміси (сховище, політика кешу, помилки й повтори) з доказами; опис PR; нотатка runbook-у. У нативному проєкті — розділ «CP-NO» в `EVIDENCE.md`: виконано на заявленій цілі або не виконано з причиною.
    7. Commit; `git status` — чисто; `npm test` у теці проєкту й у `server/`, `npm run lint` — без помилок.
  en: |
    Checkpoint CP-NO — without hints: what must be true and how it is proved; how is up to you. The platform does not check this step.

    1. **Create from the web client.** The server runs from the artifact in production mode on a fresh data folder; on the page `http://127.0.0.1:4310/` you add an expense in an **existing** category. The server log has `POST /v1/records` `201` with its `requestId`.
    2. **A restart.** `kill -TERM` — exit code `0`; the same artifact on the same data. A real `GET /v1/records` after it holds the expense with its `amountMinor`, and the `summary:` line of `check:deploy` before and after is the same: the per-category and overall totals in `amountMinor` are exact — the category total grew by exactly the new expense's `amountMinor`, the others did not change.
    3. **A reload and no server.** After a reload the page shows the same totals as before the restart; with the server stopped — "%%listLoadFailedMessage%% (%%noConnectionLabel%%)", no invented list.
    4. **Invalid input.** A create with a wrong body (a fractional `amountMinor` too) — exactly `400 VALIDATION_FAILED`, `400` in the log, nothing stored.
    5. **A test.** A `node:test` in `server/` that runs the six checks through the web client's HTTP source against the real server process; it computes the expected totals from the list before the changes plus the new expense's `amountMinor` — as integers, no rounding; it fails on a broken integration.
    6. **`docs/CP-NO.md`.** The plan, the evidence with the output you saw, the explanation — **why the amounts stay integers all the way** (the form, the API, the store, the totals; formatting only at the edge); a decision record; trade-offs (storage, cache policy, errors and retries) with evidence; a PR description; a runbook note. In the native project — a section "CP-NO" in `EVIDENCE.md`: performed on the declared target, or not performed with its reason.
    7. A commit; `git status` — clean; `npm test` in the project folder and in `server/`, `npm run lint` — no errors.
