# Wishlist variant of the checkpoint CP-NO. An assessment: the instructions say what must be true and how it is
# proved, not how to build it; reference/ is the model solution (tests/checkpoint.test.ts and docs/CP-NO.md on top
# of NO-13), checked on macOS on Node.js 25.2.1 and 22.13.1 (npm test 76, the checkpoint tests 3 times in a row on
# each) and in Chrome 154 against the artifact 1.2.0 in production mode, in a Ukrainian workspace (an English one:
# npm test). Wrong variants run against tests/checkpoint.test.ts, each failed at least one test: changes kept only
# in memory, an invalid create answered 500, a shutdown with exit code 1, the client's mark never sent, a client
# that shows an empty list without the server. Nothing was run on a native target. Not run on Linux or Windows.
instructions:
  uk: |
    Контрольна точка CP-NO — без підказок: що має бути правдою і як це доводиться; як — вирішуєш ти. Платформа цей крок не перевіряє.

    1. **Створення й зміна з вебклієнта.** Сервер — з артефакту в production-режимі на свіжій теці даних; на сторінці `http://127.0.0.1:4310/` ти додаєш бажання із ціною і позначаєш його «%%acquiredMark%%». У лозі сервера — `POST /v1/records` `201` і `PATCH /v1/records/:id` `200` з їхніми `requestId`.
    2. **Перезапуск.** `kill -TERM` — код `0`; той самий артефакт на тих самих даних. Справжній `GET /v1/records` після нього містить бажання з `"acquired":true`, а рядок `summary:` `check:deploy` до й після — однаковий (кількість, сума цін бажаних).
    3. **Перезавантаження й без сервера.** Після перезавантаження сторінка показує те саме, що до перезапуску; із зупиненим сервером — «%%listLoadFailedMessage%% (%%noConnectionLabel%%)», без вигаданого списку.
    4. **Хибний ввід.** Створення з хибним тілом — рівно `400 VALIDATION_FAILED`, у лозі `400`, нічого не збережено.
    5. **Тест.** `node:test` у `server/`, що проводить шість перевірок (створення, зміна, перезапуск, перезавантаження, хибний ввід, клієнт без сервера) через HTTP-джерело вебклієнта проти справжнього процесу сервера; падає на зламаній інтеграції.
    6. **`docs/CP-NO.md`.** План, докази з побаченим виводом, пояснення — **чому `acquired` вирішує сервер, а не кеш клієнта**, і чому сума цін бажаних рахується зі списку сервера; запис рішення; компроміси (сховище, політика кешу, помилки й повтори) з доказами; опис PR; нотатка runbook-у. У нативному проєкті — розділ «CP-NO» в `EVIDENCE.md`: виконано на заявленій цілі або не виконано з причиною.
    7. Commit; `git status` — чисто; `npm test` у теці проєкту й у `server/`, `npm run lint` — без помилок.
  en: |
    Checkpoint CP-NO — without hints: what must be true and how it is proved; how is up to you. The platform does not check this step.

    1. **Create and change from the web client.** The server runs from the artifact in production mode on a fresh data folder; on the page `http://127.0.0.1:4310/` you add a wish with a price and mark it "%%acquiredMark%%". The server log has `POST /v1/records` `201` and `PATCH /v1/records/:id` `200` with their `requestId`s.
    2. **A restart.** `kill -TERM` — exit code `0`; the same artifact on the same data. A real `GET /v1/records` after it holds the wish with `"acquired":true`, and the `summary:` line of `check:deploy` before and after is the same (the count, the total price of wanted things).
    3. **A reload and no server.** After a reload the page shows the same as before the restart; with the server stopped — "%%listLoadFailedMessage%% (%%noConnectionLabel%%)", no invented list.
    4. **Invalid input.** A create with a wrong body — exactly `400 VALIDATION_FAILED`, `400` in the log, nothing stored.
    5. **A test.** A `node:test` in `server/` that runs the six checks (create, update, restart, reload, invalid input, a client without the server) through the web client's HTTP source against the real server process; it fails on a broken integration.
    6. **`docs/CP-NO.md`.** The plan, the evidence with the output you saw, the explanation — **why the server, not the client cache, decides `acquired`**, and why the total price of wanted things is computed from the server's list; a decision record; trade-offs (storage, cache policy, errors and retries) with evidence; a PR description; a runbook note. In the native project — a section "CP-NO" in `EVIDENCE.md`: performed on the declared target, or not performed with its reason.
    7. A commit; `git status` — clean; `npm test` in the project folder and in `server/`, `npm run lint` — no errors.
