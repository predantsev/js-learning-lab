      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона підставляє версію, де `validateItem` відхиляє назву вже з 80 символів, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому назва рівно з 80 символів має пройти."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it puts in a version where `validateItem` already rejects a name of 80 characters, and expects at least one of your tests to fail. A test in which a name of exactly 80 characters must pass notices this defect."
  - when: { test: "your tests catch a name limit that still accepts 81 characters" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона підставляє версію, де `validateItem` пропускає ще й назву з 81 символу, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому назва з 81 символу дає помилку `\"too-long\"`."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it puts in a version where `validateItem` still accepts a name of 81 characters, and expects at least one of your tests to fail. A test in which a name of 81 characters gives the error `\"too-long\"` notices this defect."
  - when: { test: "your tests catch a price of 0 rejected as negative" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона підставляє версію, де `validateItem` відхиляє ціну `0` як від’ємну, і чекає, що хоча б один твій тест упаде. Ціна `0` — межа правила «не менше нуля»."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it puts in a version where `validateItem` rejects the price `0` as negative, and expects at least one of your tests to fail. The price `0` is the boundary of the rule “not below zero”."
  - when: { test: "your tests catch a missing price counted as a price of 0" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона підставляє версію, де `summarizeItems` рахує бажання з `price: null` як бажання із ціною `0`: `wantedTotal` той самий, а `wantedWithoutPrice` — `0`, і чекає, що хоча б один твій тест упаде."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it puts in a version where `summarizeItems` counts a wish with `price: null` as one with the price `0`: `wantedTotal` is the same, and `wantedWithoutPrice` is `0`, and expects at least one of your tests to fail."
  - when: { test: "your tests catch acquired wishes counted in the wanted total" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона підставляє версію, де `summarizeItems` додає до `wantedTotal` і отримані бажання, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест, у даних якого є отримане бажання із ціною."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it puts in a version where `summarizeItems` adds acquired wishes to `wantedTotal` too, and expects at least one of your tests to fail. Only a test whose data has an acquired wish with a price notices this defect."
  - when: { test: "your tests catch a summary that throws for an empty list" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона підставляє версію, де `summarizeItems` кидає `TypeError`, коли немає жодного бажаного із ціною (наприклад, для `[]`), і чекає, що хоча б один твій тест упаде."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it puts in a version where `summarizeItems` throws a `TypeError` when there is no wanted wish with a price (for example, for `[]`), and expects at least one of your tests to fail."
  - when: { test: "your tests catch a filter that ignores the status" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона підставляє версію, де `filterItems` повертає всі бажання, хоч би який статус передано, і чекає, що хоча б один твій тест упаде."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it puts in a version where `filterItems` returns every wish, whatever status is passed, and expects at least one of your tests to fail."
  - when: { test: "your tests catch a sort that puts wishes without a price first" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона підставляє версію, де `sortItemsByPrice` ставить бажання без ціни перед усіма іншими, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест, у даних якого є бажання без ціни."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it puts in a version where `sortItemsByPrice` puts wishes without a price before all others, and expects at least one of your tests to fail. Only a test whose data has a wish without a price notices this defect."
  - when: { test: "your tests catch a missing price rejected as not a number" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона підставляє версію, де `validateItem` дає для ціни `null` помилку `\"not-a-number\"`, і чекає, що хоча б один твій тест упаде."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it puts in a version where `validateItem` gives the error `\"not-a-number\"` for the price `null`, and expects at least one of your tests to fail."
  - when: { test: "your tests catch a sort that puts expensive wishes first" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона підставляє версію, де `sortItemsByPrice` ставить дорожчі бажання перед дешевшими, і чекає, що хоча б один твій тест упаде."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it puts in a version where `sortItemsByPrice` puts more expensive wishes before cheaper ones, and expects at least one of your tests to fail."
  - when: { test: "your tests catch a filter whose acquired status keeps the wanted wishes" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона підставляє версію, де `filterItems(list, \"acquired\")` повертає ще не отримані бажання, а `\"wanted\"` працює правильно, і чекає, що хоча б один твій тест упаде."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it puts in a version where `filterItems(list, \"acquired\")` returns the wanted wishes while `\"wanted\"` works correctly, and expects at least one of your tests to fail."
  - when: { test: "the tests need no page" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона запускає їх там, де немає `document`, `window` і `localStorage`, як у Node.js, і чекає ті самі успіхи. Якщо тут помилка про `document` чи `localStorage`, то тест або імпортований ним модуль звертається до сторінки чи сховища: тестуй лише функції з `domain/wishes.js`."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it runs them where there is no `document`, `window` or `localStorage`, as in Node.js, and expects the same passes. If it shows an error about `document` or `localStorage`, a test or a module it imports reaches for the page or the storage: test only the functions of `domain/wishes.js`."
  - when: { test: "tests/testing.js reports a failed expectation" }
    message:
      uk: "Ця перевірка завантажує окрему копію твого `tests/testing.js`, реєструє в ній тест з `expect(1 + 1).toBe(3)` і тест, що має пройти, та чекає від `run()` результати «не пройшов», потім «пройшов». Якщо тут помилка, то файл змінено: встав текст раннера з кінця завдання ще раз, без змін."
      en: "This check loads a separate copy of your `tests/testing.js`, registers in it a test with `expect(1 + 1).toBe(3)` and a test that must pass, and expects `run()` to give the results “failed”, then “passed”. If it fails, the file was changed: paste the runner text from the end of the task again, unchanged."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Якщо підсумку немає, то `index.html` не завантажує `run-tests.js` або `run-tests.js` не викликає `run()`. Якщо невдалих більше нуля, то котрийсь тест не проходить із правилами твого проєкту: рядок `✗` у «Консолі» називає його."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. If there is no summary, `index.html` does not load `run-tests.js` or `run-tests.js` does not call `run()`. If more than zero failed, some test does not pass with the rules of your project: the `✗` line in the “Console” names it."
  - when: { test: "run-tests.js sets exit code 1 under Node when a test fails" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js` і хоча б одна зламана версія змушує якийсь тест упасти. Потім вона двічі виконує `run-tests.js` з підробленим `process` (як у Node.js): із правильною версією `process.exitCode` не має стати `1`, а зі зламаною — має."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js` and at least one broken version to make some test fail. Then it runs `run-tests.js` twice with a stand-in `process` (as in Node.js): with the correct version `process.exitCode` must not become `1`, with the broken one it must."
