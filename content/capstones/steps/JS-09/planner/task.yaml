  - when: { test: "your tests catch a title limit that already rejects 80 characters" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/tasks.js`. Потім вона підставляє версію, де `validateTask` відхиляє назву вже з 80 символів, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому назва рівно з 80 символів має пройти."
      en: "This check first expects all your tests to pass with the correct `domain/tasks.js`. Then it puts in a version where `validateTask` already rejects a title of 80 characters, and expects at least one of your tests to fail. A test in which a title of exactly 80 characters must pass notices this defect."
  - when: { test: "your tests catch a title limit that still accepts 81 characters" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/tasks.js`. Потім вона підставляє версію, де `validateTask` пропускає ще й назву з 81 символу, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому назва з 81 символу дає помилку `\"too-long\"`."
      en: "This check first expects all your tests to pass with the correct `domain/tasks.js`. Then it puts in a version where `validateTask` still accepts a title of 81 characters, and expects at least one of your tests to fail. A test in which a title of 81 characters gives the error `\"too-long\"` notices this defect."
  - when: { test: "your tests catch an unknown priority accepted" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/tasks.js`. Потім вона підставляє версію, де `validateTask` пропускає будь-який пріоритет, і чекає, що хоча б один твій тест упаде."
      en: "This check first expects all your tests to pass with the correct `domain/tasks.js`. Then it puts in a version where `validateTask` accepts any priority, and expects at least one of your tests to fail."
  - when: { test: "your tests catch a due count that misses tasks due on the day itself" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/tasks.js`. Потім вона підставляє версію, де `countDueTasks` порівнює дати через `<` замість `<=`, тож справа з терміном саме в переданий день не рахується, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест, у даних якого є невиконана справа з `dueDate`, що дорівнює переданому «сьогодні»."
      en: "This check first expects all your tests to pass with the correct `domain/tasks.js`. Then it puts in a version where `countDueTasks` compares the dates with `<` instead of `<=`, so a task due exactly on the given day is not counted, and expects at least one of your tests to fail. Only a test whose data has a pending task whose `dueDate` equals the “today” passed in notices this defect."
  - when: { test: "your tests catch done tasks counted as due" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/tasks.js`. Потім вона підставляє версію, де `countDueTasks` рахує й виконані справи, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест, у даних якого є виконана справа з терміном до «сьогодні»."
      en: "This check first expects all your tests to pass with the correct `domain/tasks.js`. Then it puts in a version where `countDueTasks` counts done tasks too, and expects at least one of your tests to fail. Only a test whose data has a done task due before “today” notices this defect."
  - when: { test: "your tests catch a due count that counts later tasks instead of earlier ones" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/tasks.js`. Потім вона підставляє версію, де `countDueTasks` порівнює через `>=` замість `<=`: рахує справи з терміном сьогодні й пізніше, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест зі справою на завтра (вона не рахується) або зі справою на вчора (рахується)."
      en: "This check first expects all your tests to pass with the correct `domain/tasks.js`. Then it puts in a version where `countDueTasks` compares with `>=` instead of `<=`: it counts tasks due today and later, and expects at least one of your tests to fail. A test with a task due tomorrow (it does not count) or one due yesterday (it counts) notices this defect."
  - when: { test: "your tests catch a filter that ignores the status" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/tasks.js`. Потім вона підставляє версію, де `filterTasks` повертає всі справи, хоч би який статус передано, і чекає, що хоча б один твій тест упаде."
      en: "This check first expects all your tests to pass with the correct `domain/tasks.js`. Then it puts in a version where `filterTasks` returns every task, whatever status is passed, and expects at least one of your tests to fail."
  - when: { test: "your tests catch a sort that puts tasks without a due date first" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/tasks.js`. Потім вона підставляє версію, де `sortTasks` ставить справи без `dueDate` перед усіма іншими, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест, у даних якого є справа без терміну."
      en: "This check first expects all your tests to pass with the correct `domain/tasks.js`. Then it puts in a version where `sortTasks` puts tasks without `dueDate` before all others, and expects at least one of your tests to fail. Only a test whose data has a task without a due date notices this defect."
  - when: { test: "the tests need no page" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/tasks.js`. Потім вона запускає їх там, де немає `document`, `window` і `localStorage`, як у Node.js, і чекає ті самі успіхи. Якщо тут помилка про `document` чи `localStorage`, то тест або імпортований ним модуль звертається до сторінки чи сховища: тестуй лише функції з `domain/tasks.js`."
      en: "This check first expects all your tests to pass with the correct `domain/tasks.js`. Then it runs them where there is no `document`, `window` or `localStorage`, as in Node.js, and expects the same passes. If it shows an error about `document` or `localStorage`, a test or a module it imports reaches for the page or the storage: test only the functions of `domain/tasks.js`."
  - when: { test: "tests/testing.js reports a failed expectation" }
    message:
      uk: "Ця перевірка завантажує окрему копію твого `tests/testing.js`, реєструє в ній тест з `expect(1 + 1).toBe(3)` і тест, що має пройти, та чекає від `run()` результати «не пройшов», потім «пройшов». Якщо тут помилка, то файл змінено: встав текст раннера з кінця завдання ще раз, без змін."
      en: "This check loads a separate copy of your `tests/testing.js`, registers in it a test with `expect(1 + 1).toBe(3)` and a test that must pass, and expects `run()` to give the results “failed”, then “passed”. If it fails, the file was changed: paste the runner text from the end of the task again, unchanged."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Якщо підсумку немає, то `index.html` не завантажує `run-tests.js` або `run-tests.js` не викликає `run()`. Якщо невдалих більше нуля, то котрийсь тест не проходить із правилами твого проєкту: рядок `✗` у «Консолі» називає його."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. If there is no summary, `index.html` does not load `run-tests.js` or `run-tests.js` does not call `run()`. If more than zero failed, some test does not pass with the rules of your project: the `✗` line in the “Console” names it."
  - when: { test: "run-tests.js sets exit code 1 under Node when a test fails" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/tasks.js` і хоча б одна зламана версія змушує якийсь тест упасти. Потім вона двічі виконує `run-tests.js` з підробленим `process` (як у Node.js): із правильною версією `process.exitCode` не має стати `1`, а зі зламаною — має."
      en: "This check first expects all your tests to pass with the correct `domain/tasks.js` and at least one broken version to make some test fail. Then it runs `run-tests.js` twice with a stand-in `process` (as in Node.js): with the correct version `process.exitCode` must not become `1`, with the broken one it must."
