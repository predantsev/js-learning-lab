strings:
  rExpected: { uk: "очікувалося", en: "expected" }
  rGot: { uk: "отримано", en: "got" }
  rSameFields: { uk: "(вміст однаковий, але це два різні об’єкти)", en: "(same content, but two different objects)" }
  rNeedsFunction: { uk: "toThrow чекає функцію: напиши expect(() => …)", en: "toThrow needs a function: write expect(() => …)" }
  rDidNotThrow: { uk: "функція не кинула помилку", en: "the function did not throw" }
  rOtherError: { uk: "очікувалася помилка", en: "expected an error of type" }
  rSummary: { uk: "Пройшли: {passed} · не пройшли: {failed}", en: "Passed: {passed} · failed: {failed}" }
  rNoTests: { uk: "Тестів ще немає: додай test(…) у файл тестів.", en: "No tests yet: add test(…) to the test file." }
instructions:
  uk: |
    Сторінка не змінюється. Ти додаєш тести для правил із `domain/tasks.js`: вони запускаються разом зі сторінкою (рядки `✓` і `✗` у вкладці «Консоль»), а після експорту — командою `node run-tests.js` на твоєму комп’ютері.

    **Файли.**

    - `tests/testing.js` — раннер курсу, той самий, що в уроках розділу. Створи файл і встав текст із кінця завдання без змін.
    - `tests/domain.test.js` — твої тести. Він починається з `import { test, expect } from "./testing.js";` та імпорту потрібних функцій із `../domain/tasks.js`.
    - `run-tests.js` у корені проєкту — запускач (текст нижче). У `index.html` після рядка коду з `app.js` додай `<script type="module" src="run-tests.js"></script>`.

    **Що мають перевіряти тести.** Тестуй лише чисті функції з `domain/tasks.js` — без `document`, `localStorage` і сторінки, — тоді ці самі тести працюватимуть і в Node.js. Дані для тестів створюй у самому файлі тестів, наприклад функцією, що щоразу повертає новий масив, а не бери їх із `data/tasks.json`.

    - `validateTask`: назва справи з 80 символів проходить, з 81 — ні (`"a".repeat(81)` дає 81 літеру); невідомий пріоритет, наприклад `"urgent"`, — помилка `"unknown"`.
    - `countDueTasks(list, day)`: зафіксуй «сьогодні» сталою, наприклад `const TODAY = "2026-03-01";`, і передавай її в кожен виклик — не бери поточну дату. Справа з `dueDate` цього самого дня рахується, з учорашнім — теж, із завтрашнім — ні; виконана (`done: true`) і справа без `dueDate` не рахуються ніколи; порожній список дає `0`.
    - `filterTasks`: окремо `"pending"` і `"done"`.
    - `sortTasks`: раніший термін спершу, справи без терміну — у кінці.

    **Запускач `run-tests.js`.** Під Node.js, коли хоч один тест упав, він ставить `process.exitCode = 1`: так команда завершується з кодом `1`, і інші програми бачать, що тести не пройшли. Він бере `process` через `globalThis` — глобальний об’єкт, що є і в Node.js, і в браузері: у браузері `globalThis.process` — просто `undefined`, тож сторінка цю частину пропускає, а ESLint із браузерними налаштуваннями не скаржиться на невідому назву `process`.

    ```js
    // Runs the tests of tests/domain.test.js and prints one line per test.
    import "./tests/domain.test.js";
    import { run } from "./tests/testing.js";

    const results = await run();

    // Under Node.js a failed test makes the command fail (exit code 1).
    const nodeProcess = globalThis.process; // Node.js has it, a browser does not
    if (nodeProcess !== undefined && results.some((result) => !result.passed)) {
      nodeProcess.exitCode = 1;
    }
    ```

    **Перевір сам.** Натисни «Запустити»: у «Консолі» — рядок `✓` на кожен тест і підсумок «%%rSummary%%». Тимчасово зламай одну функцію в `domain/tasks.js` (наприклад, заміни `> 80` на `>= 80`), запусти ще раз: має впасти саме тест про цю межу. Поверни як було.

    **Як перевірятиметься.** Перевірки запускають твій `tests/domain.test.js` ще раз, підставляючи замість `domain/tasks.js` інші версії, а замість `tests/testing.js` — раннер курсу без змін. Спершу з правильною версією: тоді всі твої тести мають пройти. Потім по черзі з вісьмома зламаними версіями, у кожній — один дефект (його називає назва перевірки), і з кожною хоча б один твій тест має впасти. Ще перевірки запускають тести там, де немає сторінки (як у Node.js), переконуються, що твій `tests/testing.js` повідомляє про невиконане очікування, шукають у «Консолі» підсумок без жодного невдалого тесту й виконують `run-tests.js` з підробленим `process`, як у Node.js: коли тест падає, `process.exitCode` має стати `1`. Під час цих запусків глобальні помічники перевірок (`test`, `expect`, `screen`, `L` та інші) сховано, тож `test` і `expect` імпортуй із `./testing.js`.

    **Файл `tests/testing.js`** (скопіюй без змін):

    ```js
    // A small test runner written for this course. Read it if you like; you do not change it.
    // Real test runners (Vitest, Jest) work the same way: test(name, fn) registers a test,
    // expect(actual).toBe(expected) compares, and a failed comparison throws an error.
    const WORDS = {
      expected: "%%rExpected%%",
      got: "%%rGot%%",
      sameFields: "%%rSameFields%%",
      needsFunction: "%%rNeedsFunction%%",
      didNotThrow: "%%rDidNotThrow%%",
      otherError: "%%rOtherError%%",
      summary: "%%rSummary%%",
      noTests: "%%rNoTests%%",
    };

    const registered = [];

    export function test(name, fn) {
      registered.push({ name, fn });
    }

    class AssertionError extends Error {
      name = "AssertionError";
    }

    function isObject(value) {
      return value !== null && typeof value === "object" && !Array.isArray(value);
    }

    // Same content: arrays item by item, in order; objects key by key, in any key order.
    function equal(a, b) {
      if (Object.is(a, b)) return true;
      if (Array.isArray(a) && Array.isArray(b)) {
        return a.length === b.length && a.every((item, index) => equal(item, b[index]));
      }
      if (isObject(a) && isObject(b)) {
        const keys = Object.keys(a);
        return keys.length === Object.keys(b).length && keys.every((key) => Object.hasOwn(b, key) && equal(a[key], b[key]));
      }
      return false;
    }

    function show(value) {
      if (typeof value === "string") return JSON.stringify(value);
      if (typeof value === "function") return `[function ${value.name || "anonymous"}]`;
      if (Array.isArray(value)) return `[${value.map(show).join(", ")}]`;
      if (isObject(value)) {
        const entries = Object.entries(value).map(([key, item]) => `${key}: ${show(item)}`);
        return entries.length === 0 ? "{}" : `{ ${entries.join(", ")} }`;
      }
      return String(value);
    }

    export function expect(actual, message = "") {
      const fail = (text) => {
        throw new AssertionError(message ? `${message}: ${text}` : text);
      };
      return {
        // Identity: the same primitive value, or the very same object.
        toBe(expected) {
          if (Object.is(actual, expected)) return;
          const hint = typeof actual === "object" && actual !== null && equal(actual, expected) ? ` ${WORDS.sameFields}` : "";
          fail(`${WORDS.expected} ${show(expected)}, ${WORDS.got} ${show(actual)}${hint}`);
        },
        // Same content, even if these are two different objects or arrays.
        toEqual(expected) {
          if (equal(actual, expected)) return;
          fail(`${WORDS.expected} ${show(expected)}, ${WORDS.got} ${show(actual)}`);
        },
        // `actual` must be a function; it is called here and must throw.
        toThrow(ErrorType) {
          if (typeof actual !== "function") fail(WORDS.needsFunction);
          try {
            actual();
          } catch (error) {
            if (ErrorType === undefined || error instanceof ErrorType) return;
            fail(`${WORDS.otherError} ${ErrorType.name}, ${WORDS.got} ${error.name}: ${error.message}`);
          }
          fail(WORDS.didNotThrow);
        },
      };
    }

    // Runs every registered test, one after another, and prints one line per test.
    export async function run({ print = true, reverse = false } = {}) {
      const queue = reverse ? [...registered].reverse() : registered;
      const results = [];
      for (const { name, fn } of queue) {
        try {
          await fn();
          results.push({ name, passed: true });
        } catch (error) {
          const text = error instanceof AssertionError ? error.message : error instanceof Error ? `${error.name}: ${error.message}` : String(error);
          results.push({ name, passed: false, message: text });
        }
      }
      if (print) {
        if (results.length === 0) console.log(WORDS.noTests);
        for (const result of results) {
          if (result.passed) console.log(`✓ ${result.name}`);
          else console.error(`✗ ${result.name} — ${result.message}`);
        }
        const failed = results.filter((result) => !result.passed).length;
        console.log(WORDS.summary.replace("{passed}", results.length - failed).replace("{failed}", failed));
      }
      return results;
    }
    ```
  en: |
    The page does not change. You add tests for the rules of `domain/tasks.js`: they run together with the page (the `✓` and `✗` lines in the “Console” tab), and after the export with the command `node run-tests.js` on your computer.

    **Files.**

    - `tests/testing.js` — the course runner, the same as in this unit's lessons. Create the file and paste the text from the end of the task unchanged.
    - `tests/domain.test.js` — your tests. It starts with `import { test, expect } from "./testing.js";` and an import of the functions you need from `../domain/tasks.js`.
    - `run-tests.js` in the project folder — the driver (text below). In `index.html`, after the line of code with `app.js`, add `<script type="module" src="run-tests.js"></script>`.

    **What the tests must check.** Test only the pure functions of `domain/tasks.js` — no `document`, no `localStorage`, no page — then the same tests also work in Node.js. Create the test data in the test file itself, for example with a function that returns a new array every time, instead of taking it from `data/tasks.json`.

    - `validateTask`: a title of 80 characters passes, one of 81 does not (`"a".repeat(81)` gives 81 letters); an unknown priority, for example `"urgent"`, gives the error `"unknown"`.
    - `countDueTasks(list, day)`: fix “today” as a constant, for example `const TODAY = "2026-03-01";`, and pass it to every call — do not take the current date. A task whose `dueDate` is that very day counts, one due yesterday counts too, one due tomorrow does not; a done task (`done: true`) and a task without `dueDate` never count; an empty list gives `0`.
    - `filterTasks`: `"pending"` and `"done"` separately.
    - `sortTasks`: earlier due dates first, tasks without a due date at the end.

    **The driver `run-tests.js`.** Under Node.js, when at least one test failed, it sets `process.exitCode = 1`: the command then ends with the code `1`, and other programs see that the tests did not pass. It takes `process` through `globalThis` — the global object that exists both in Node.js and in a browser: in a browser `globalThis.process` is just `undefined`, so the page skips this part, and ESLint with browser settings does not complain about an unknown name `process`.

    ```js
    // Runs the tests of tests/domain.test.js and prints one line per test.
    import "./tests/domain.test.js";
    import { run } from "./tests/testing.js";

    const results = await run();

    // Under Node.js a failed test makes the command fail (exit code 1).
    const nodeProcess = globalThis.process; // Node.js has it, a browser does not
    if (nodeProcess !== undefined && results.some((result) => !result.passed)) {
      nodeProcess.exitCode = 1;
    }
    ```

    **Check it yourself.** Press “Run”: the “Console” shows a `✓` line for every test and the summary “%%rSummary%%”. Temporarily break one function in `domain/tasks.js` (for example, replace `> 80` with `>= 80`) and run again: exactly the test about that limit must fail. Put it back.

    **How it is checked.** The checks run your `tests/domain.test.js` again, with other versions in place of `domain/tasks.js` and the unchanged course runner in place of `tests/testing.js`. First with the correct version: then all your tests must pass. Then in turn with eight broken versions, each with one defect (the check's title names it), and with each of them at least one of your tests must fail. The checks also run the tests where there is no page (as in Node.js), make sure that your `tests/testing.js` reports an unmet expectation, look in the “Console” for a summary with no failed test, and run `run-tests.js` with a stand-in `process` like the one of Node.js: when a test fails, `process.exitCode` must become `1`. During these runs the helper globals of the checks (`test`, `expect`, `screen`, `L` and others) are hidden, so import `test` and `expect` from `./testing.js`.

    **The file `tests/testing.js`** (copy it unchanged):

    ```js
    // A small test runner written for this course. Read it if you like; you do not change it.
    // Real test runners (Vitest, Jest) work the same way: test(name, fn) registers a test,
    // expect(actual).toBe(expected) compares, and a failed comparison throws an error.
    const WORDS = {
      expected: "%%rExpected%%",
      got: "%%rGot%%",
      sameFields: "%%rSameFields%%",
      needsFunction: "%%rNeedsFunction%%",
      didNotThrow: "%%rDidNotThrow%%",
      otherError: "%%rOtherError%%",
      summary: "%%rSummary%%",
      noTests: "%%rNoTests%%",
    };

    const registered = [];

    export function test(name, fn) {
      registered.push({ name, fn });
    }

    class AssertionError extends Error {
      name = "AssertionError";
    }

    function isObject(value) {
      return value !== null && typeof value === "object" && !Array.isArray(value);
    }

    // Same content: arrays item by item, in order; objects key by key, in any key order.
    function equal(a, b) {
      if (Object.is(a, b)) return true;
      if (Array.isArray(a) && Array.isArray(b)) {
        return a.length === b.length && a.every((item, index) => equal(item, b[index]));
      }
      if (isObject(a) && isObject(b)) {
        const keys = Object.keys(a);
        return keys.length === Object.keys(b).length && keys.every((key) => Object.hasOwn(b, key) && equal(a[key], b[key]));
      }
      return false;
    }

    function show(value) {
      if (typeof value === "string") return JSON.stringify(value);
      if (typeof value === "function") return `[function ${value.name || "anonymous"}]`;
      if (Array.isArray(value)) return `[${value.map(show).join(", ")}]`;
      if (isObject(value)) {
        const entries = Object.entries(value).map(([key, item]) => `${key}: ${show(item)}`);
        return entries.length === 0 ? "{}" : `{ ${entries.join(", ")} }`;
      }
      return String(value);
    }

    export function expect(actual, message = "") {
      const fail = (text) => {
        throw new AssertionError(message ? `${message}: ${text}` : text);
      };
      return {
        // Identity: the same primitive value, or the very same object.
        toBe(expected) {
          if (Object.is(actual, expected)) return;
          const hint = typeof actual === "object" && actual !== null && equal(actual, expected) ? ` ${WORDS.sameFields}` : "";
          fail(`${WORDS.expected} ${show(expected)}, ${WORDS.got} ${show(actual)}${hint}`);
        },
        // Same content, even if these are two different objects or arrays.
        toEqual(expected) {
          if (equal(actual, expected)) return;
          fail(`${WORDS.expected} ${show(expected)}, ${WORDS.got} ${show(actual)}`);
        },
        // `actual` must be a function; it is called here and must throw.
        toThrow(ErrorType) {
          if (typeof actual !== "function") fail(WORDS.needsFunction);
          try {
            actual();
          } catch (error) {
            if (ErrorType === undefined || error instanceof ErrorType) return;
            fail(`${WORDS.otherError} ${ErrorType.name}, ${WORDS.got} ${error.name}: ${error.message}`);
          }
          fail(WORDS.didNotThrow);
        },
      };
    }

    // Runs every registered test, one after another, and prints one line per test.
    export async function run({ print = true, reverse = false } = {}) {
      const queue = reverse ? [...registered].reverse() : registered;
      const results = [];
      for (const { name, fn } of queue) {
        try {
          await fn();
          results.push({ name, passed: true });
        } catch (error) {
          const text = error instanceof AssertionError ? error.message : error instanceof Error ? `${error.name}: ${error.message}` : String(error);
          results.push({ name, passed: false, message: text });
        }
      }
      if (print) {
        if (results.length === 0) console.log(WORDS.noTests);
        for (const result of results) {
          if (result.passed) console.log(`✓ ${result.name}`);
          else console.error(`✗ ${result.name} — ${result.message}`);
        }
        const failed = results.filter((result) => !result.passed).length;
        console.log(WORDS.summary.replace("{passed}", results.length - failed).replace("{failed}", failed));
      }
      return results;
    }
    ```
nudge:
  uk: "Згадай урок про граничні випадки: межа «не більше 80» потребує двох тестів — рівно на межі й на крок за нею. А щоб тест помітив дефект у підсумку, порівнюй увесь результат через `toEqual`, а не одне поле: дефект часто ховається саме в полі, яке ти не перевірив."
  en: "Recall the lesson on boundary cases: a limit “at most 80” needs two tests — exactly at the limit and one step past it. And for a test to notice a defect in the summary, compare the whole result with `toEqual`, not one field: a defect often hides in exactly the field you did not check."
