  - when: { test: "the tests pass with the correct domain module" }
    message:
      uk: "Ця перевірка запускає `tests/domain.test.js` з правильним `domain/habits.js` і раннером курсу без змін і чекає хоча б один тест і жодного, що впав. Повідомлення внизу називає тест, що впав, або помилку. Якщо там «there is no file tests/domain.test.js», то файл лежить не в теці `tests/` або має іншу назву. Якщо там `ReferenceError` про `test` чи `expect`, то їх не імпортовано з `./testing.js`."
      en: "This check runs `tests/domain.test.js` with the correct `domain/habits.js` and the unchanged course runner, and expects at least one test and none that fails. The message below names the failed test or the error. If it says “there is no file tests/domain.test.js”, the file is not in the folder `tests/` or has another name. If it shows a `ReferenceError` about `test` or `expect`, they are not imported from `./testing.js`."
  - when: { test: "your tests catch a name limit that already rejects 80 characters" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.js`. Потім вона підставляє версію, де `validateHabit` відхиляє назву вже з 80 символів, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому назва рівно з 80 символів має пройти."
      en: "This check first expects all your tests to pass with the correct `domain/habits.js`. Then it puts in a version where `validateHabit` already rejects a name of 80 characters, and expects at least one of your tests to fail. A test in which a name of exactly 80 characters must pass notices this defect."
  - when: { test: "your tests catch a name limit that still accepts 81 characters" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.js`. Потім вона підставляє версію, де `validateHabit` пропускає ще й назву з 81 символу, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому назва з 81 символу дає помилку `\"too-long\"`."
      en: "This check first expects all your tests to pass with the correct `domain/habits.js`. Then it puts in a version where `validateHabit` still accepts a name of 81 characters, and expects at least one of your tests to fail. A test in which a name of 81 characters gives the error `\"too-long\"` notices this defect."
  - when: { test: "your tests catch an unknown frequency accepted" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.js`. Потім вона підставляє версію, де `validateHabit` пропускає будь-яку частоту, і чекає, що хоча б один твій тест упаде."
      en: "This check first expects all your tests to pass with the correct `domain/habits.js`. Then it puts in a version where `validateHabit` accepts any frequency, and expects at least one of your tests to fail."
  - when: { test: "your tests catch completions outside the given days counted" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.js`. Потім вона підставляє версію, де `summarizeHabit` рахує всі `completions` звички, а не лише ті, що припадають на передані дні, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест, у даних якого є виконання раніше за перший із переданих днів."
      en: "This check first expects all your tests to pass with the correct `domain/habits.js`. Then it puts in a version where `summarizeHabit` counts all `completions` of the habit, not only those on the days passed in, and expects at least one of your tests to fail. Only a test whose data has a completion before the first of the days passed in notices this defect."
  - when: { test: "your tests catch a rate of NaN when there are no days" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.js`. Потім вона підставляє версію, де `summarizeHabit(habit, [])` дає `rate: NaN` замість `0`, і чекає, що хоча б один твій тест упаде. `toBe(0)` для `NaN` не проходить."
      en: "This check first expects all your tests to pass with the correct `domain/habits.js`. Then it puts in a version where `summarizeHabit(habit, [])` gives `rate: NaN` instead of `0`, and expects at least one of your tests to fail. `toBe(0)` does not pass for `NaN`."
  - when: { test: "your tests catch a rate in percent instead of a share" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.js`. Потім вона підставляє версію, де `summarizeHabit` дає `rate` у відсотках (`50` замість `0.5`), і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, що перевіряє `rate`, коли звичку виконано хоча б в один із днів."
      en: "This check first expects all your tests to pass with the correct `domain/habits.js`. Then it puts in a version where `summarizeHabit` gives `rate` in percent (`50` instead of `0.5`), and expects at least one of your tests to fail. A test that checks `rate` when the habit was completed on at least one of the days notices this defect."
  - when: { test: "your tests catch a filter that ignores the status" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.js`. Потім вона підставляє версію, де `filterHabits` повертає всі звички, хоч би який статус передано, і чекає, що хоча б один твій тест упаде."
      en: "This check first expects all your tests to pass with the correct `domain/habits.js`. Then it puts in a version where `filterHabits` returns every habit, whatever status is passed, and expects at least one of your tests to fail."
  - when: { test: "your tests catch a sort in reverse alphabetical order" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.js`. Потім вона підставляє версію, де `sortHabitsByName` ставить назви від останньої літери абетки до першої, і чекає, що хоча б один твій тест упаде."
      en: "This check first expects all your tests to pass with the correct `domain/habits.js`. Then it puts in a version where `sortHabitsByName` orders the names from the last letter of the alphabet to the first, and expects at least one of your tests to fail."
  - when: { test: "your tests catch a filter whose paused status keeps the active habits" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.js`. Потім вона підставляє версію, де `filterHabits(list, \"paused\")` повертає активні звички, а `\"active\"` працює правильно, і чекає, що хоча б один твій тест упаде."
      en: "This check first expects all your tests to pass with the correct `domain/habits.js`. Then it puts in a version where `filterHabits(list, \"paused\")` returns the active habits while `\"active\"` works correctly, and expects at least one of your tests to fail."
  - when: { test: "the tests need no page" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.js`. Потім вона запускає їх там, де немає `document`, `window` і `localStorage`, як у Node.js, і чекає ті самі успіхи. Якщо тут помилка про `document` чи `localStorage`, то тест або імпортований ним модуль звертається до сторінки чи сховища: тестуй лише функції з `domain/habits.js`."
      en: "This check first expects all your tests to pass with the correct `domain/habits.js`. Then it runs them where there is no `document`, `window` or `localStorage`, as in Node.js, and expects the same passes. If it shows an error about `document` or `localStorage`, a test or a module it imports reaches for the page or the storage: test only the functions of `domain/habits.js`."
  - when: { test: "tests/testing.js reports a failed expectation" }
    message:
      uk: "Ця перевірка завантажує окрему копію твого `tests/testing.js`, реєструє в ній тест з `expect(1 + 1).toBe(3)` і тест, що має пройти, та чекає від `run()` результати «не пройшов», потім «пройшов». Якщо тут помилка, то файл змінено: встав текст раннера з кінця завдання ще раз, без змін."
      en: "This check loads a separate copy of your `tests/testing.js`, registers in it a test with `expect(1 + 1).toBe(3)` and a test that must pass, and expects `run()` to give the results “failed”, then “passed”. If it fails, the file was changed: paste the runner text from the end of the task again, unchanged."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Якщо підсумку немає, то `index.html` не завантажує `run-tests.js` або `run-tests.js` не викликає `run()`. Якщо невдалих більше нуля, то котрийсь тест не проходить із правилами твого проєкту: рядок `✗` у «Консолі» називає його."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. If there is no summary, `index.html` does not load `run-tests.js` or `run-tests.js` does not call `run()`. If more than zero failed, some test does not pass with the rules of your project: the `✗` line in the “Console” names it."
  - when: { test: "run-tests.js sets exit code 1 under Node when a test fails" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.js` і хоча б одна зламана версія змушує якийсь тест упасти. Потім вона двічі виконує `run-tests.js` з підробленим `process` (як у Node.js): із правильною версією `process.exitCode` не має стати `1`, а зі зламаною — має."
      en: "This check first expects all your tests to pass with the correct `domain/habits.js` and at least one broken version to make some test fail. Then it runs `run-tests.js` twice with a stand-in `process` (as in Node.js): with the correct version `process.exitCode` must not become `1`, with the broken one it must."
