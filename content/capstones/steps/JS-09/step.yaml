# Capstone step of unit JS-09 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-09-09-capstone-tests from this file.
unit: JS-09
mode: in-platform
entry: index.html
title:
  uk: "Тести для правил проєкту"
  en: "Tests for the project's rules"
intro:
  uk: |
    Правила твого проєкту — перевірка чернетки, підсумок, фільтр, сортування — досі перевірялися тільки очима: запусти й подивись. На цьому кроці в проєкту з’являються тести, які перевіряють ці правила щоразу, коли сторінка запускається.

    - `tests/testing.js` — раннер курсу з уроків розділу, без змін: `test(name, fn)` реєструє тест, `expect(actual).toBe(…)` / `.toEqual(…)` / `.toThrow(…)` порівнюють, `run()` запускає все.
    - `tests/domain.test.js` — твої тести чистих функцій із `domain/`: граничні випадки (рівно на межі й на крок за нею), порожній список, свіжі дані для кожного тесту й зафіксована дата там, де правило залежить від дня.
    - `run-tests.js` — запускач: сторінка виконує його після `app.js`, а на твоєму комп’ютері його запускає `node run-tests.js`. Під Node.js тест, що впав, робить код завершення `1`.

    Тест має цінність, лише якщо він падає, коли правило зламане. Тому перевірки цього кроку запускають твої тести з правильними правилами (усі мають пройти) і з кількома зламаними версіями, у кожній з яких один дефект (хоча б один тест має впасти).
  en: |
    The rules of your project — the draft check, the summary, the filter, the sort — have so far only been checked by eye: run it and look. In this step the project gets tests that check these rules every time the page starts.

    - `tests/testing.js` — the course runner from this unit's lessons, unchanged: `test(name, fn)` registers a test, `expect(actual).toBe(…)` / `.toEqual(…)` / `.toThrow(…)` compare, `run()` runs them all.
    - `tests/domain.test.js` — your tests of the pure functions of `domain/`: boundary cases (exactly at the limit and one step past it), an empty list, fresh data for every test and a fixed date where a rule depends on the day.
    - `run-tests.js` — the driver: the page runs it after `app.js`, and on your computer `node run-tests.js` runs it. Under Node.js a failed test gives the exit code `1`.

    A test is only worth something if it fails when the rule is broken. So the checks of this step run your tests with the correct rules (all must pass) and with several broken versions, each with one defect (at least one test must fail).
purpose:
  uk: "Це крок твого проєкту: assertion-тести, граничні випадки й детерміновані фікстури з цього розділу ти застосовуєш до правил власного застосунку. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply this unit's assertion tests, boundary cases and deterministic fixtures to the rules of your own app. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Написати assertion-тести для чистих функцій домену проєкту: межа довжини назви з обох боків, порожній список, похідне значення, фільтр і сортування."
    en: "Write assertion tests for the pure domain functions of the project: the name length limit from both sides, an empty list, the derived value, the filter and the sort."
  - uk: "Будувати свіжі тестові дані в кожному тесті й фіксувати дату там, де правило залежить від дня, щоб тести давали той самий результат щоразу."
    en: "Build fresh test data in every test and fix the date where a rule depends on the day, so the tests give the same result every time."
  - uk: "Підключити запускач тестів, який працює на сторінці й під Node.js, де тест, що впав, дає код завершення `1`."
    en: "Wire a test driver that works on the page and under Node.js, where a failed test gives the exit code `1`."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередні кроки не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
