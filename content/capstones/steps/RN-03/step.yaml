# Capstone step of unit RN-03 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson of kind capstone-step of RN-03 from this file.
# A local step: done in the learner's editor, terminal and on the declared native target; no platform
# checks. The project page shows only the intro of a local step, so the intro carries the whole procedure.
# Every computer-side command was run on macOS (Node.js 25.2.1, npm 11.6.2, Expo SDK 57) in a scratch home
# on all four projects, continuing the RN-02 scratch projects: the copy of the reducer and its test, tsc,
# the course test runner (Ukrainian and English strings; TZ=Pacific/Kiritimati and TZ=Pacific/Pago_Pago),
# expo export for android and ios, the commit. Deliberately wrong variants (a formatter without
# timeZone "UTC", an empty category kept as "") were run against the tests and failed them. Nothing was
# run on an emulator, a simulator or a phone. Quoted output is from the wishlist run.
# reference/ is the native project after the step without the files the template generates and the
# platform cannot carry (assets/*.png, LICENSE, package-lock.json, node_modules/).
unit: RN-03
mode: local
entry: App.tsx
title:
  uk: "Записи в нативному списку: додати, змінити, прибрати"
  en: "Records in a native list: add, change, remove"
intro:
  uk: |
    Екран оживає: записи можна створювати, змінювати, позначати й прибирати. Список — `FlatList` із ключем `id`. Кожну зміну обробляє **reducer React-проєкту**, скопійований без змін, а все, що залежить від платформи, — **адаптер**, який екран отримує з `App.tsx`: сховище й форматування (або годинник). Доменний код не змінюється.

    | Проєкт | Reducer (копія) | Адаптер платформи | Що показує через адаптер |
    |---|---|---|---|
    | Список бажань | `itemsReducer` | `createPriceFormat` | ціна: «80 ₴», «1 250 ₴» або «без ціни» |
    | Планувальник | `tasksReducer` | `createDateFormat` | термін: «2 березня 2026 р.» або «без терміну» |
    | Трекер звичок | `habitsReducer` | `createSystemClock` | сьогоднішня дата для «Позначити сьогодні» → `completeHabit` |
    | Трекер витрат | `expensesReducer` | `createMoneyFormat` | сума: «845,50 ₴»; підсумки категорій рахує `summarizeExpenses` |

    У кожному проєкті є ще `createMemoryStorage()`: сховище в пам’яті з тими самими трьома методами, що й сховище пристрою (`getItem`, `setItem`, `removeItem`). У цьому кроці записи зберігаються через нього, тож **після перезапуску застосунку їх немає** — сховище пристрою з’явиться в кроці про збереження, і екран тоді не зміниться.

    Нижче — «Список бажань». Команди на комп’ютері виконано на macOS (Node.js 25.2.1, Expo SDK 57) на всіх чотирьох проєктах; тексти адаптерів вище — із Node.js. Емулятора, симулятора й телефона не було: крок 8 описано за документацією React Native 0.86 і уроками розділу; як Hermes на пристрої форматує ці числа й дати, ми не бачили.

    **1. Стан на початку.** `cd ~/js-course/wishlist-native`, `git status` — чисто, `git log --oneline -1` — commit екрана зі списком і формою.

    **2. Ще одна копія.** `mkdir -p ui`, `cp ../wishlist/ui/itemsReducer.ts ui/`, `cp ../wishlist/tests/reducer.test.js tests/`; додай обидва файли в таблицю `docs/shared-code.md`, а тест — у `run-tests.js`. `diff ../wishlist/ui/itemsReducer.ts ui/itemsReducer.ts` — жодного рядка. Коментарі копії згадують API React-проєкту — так і лишається.

    **3. Контракти й адаптери.** `src/contracts.ts` — лише типи: `StorageAdapter` (`getItem`, `setItem`, `removeItem` — усі повертають `Promise`) і `PriceFormat` (`price(price: number | null): string`). `src/adapters.ts` без імпорту `react-native`: `createMemoryStorage()` (`Map` усередині фабрики) і `createPriceFormat(locale, noPriceLabel)` на `Intl.NumberFormat` з `currency: "UAH"` і `maximumFractionDigits: 0`. `src/snapshot.ts`: ключ `KEY = "jsll.wishlist.v1"` і `saveSnapshot(storage, records)`, що пише `{ schemaVersion: 1, records }` — той самий ключ і та сама форма, що в React-проєкті. Вибирає адаптери лише `App.tsx`.

    **4. Чернетка → поля.** У `src/draft.ts` додай `fieldsOf(value, draft, acquired)`: очищені назва й ціна з `checkDraft`, категорія без пробілів по краях (порожня — `null`) і `acquired` бажання, яке змінюють (для нового — `false`). Це ті поля, які чекає `itemsReducer`.

    **5. Форма й рядок.** `ItemForm` отримує `item` (або `null` для нового), `onSave(fields)` і, для редагування, `onCancel`; правильна чернетка йде в `onSave`, і форма знову порожня. Клавіша повернення переводить фокус: назва → ціна → категорія (`returnKeyType="next"`, `onSubmitEditing` і `ref.focus()`), на останньому полі — «готово» й збереження; ціна відкриває цифрову клавіатуру (`keyboardType="number-pad"`). `ItemRow` показує ціну через `format.price(…)` і має кнопки «Позначити отриманим» / «Повернути в бажані», «Редагувати», «Видалити»; видалення питає «Видалити це бажання?» просто в рядку. Кожна кнопка — `Pressable` щонайменше 48 × 48.

    **6. Список.** `ItemsScreen`: `useReducer(itemsReducer, initialItems)`; `FlatList` з `data={items}`, `keyExtractor={(item) => item.id}`, `keyboardShouldPersistTaps="handled"`; форма нового бажання й заголовок — у `ListHeaderComponent`, порожній список — `ListEmptyComponent` («Бажань поки немає…»); рядок, який редагують, сам стає формою. `useEffect` з `[storage, items]` зберігає кожен новий список через `saveSnapshot`.

    **7. Перевірка на комп’ютері.** `npx tsc --noEmit` — жодного рядка; `npm test` — `Пройшли: 30 · не пройшли: 0` (нові тести: сховище в пам’яті, форма знімка під `jsll.wishlist.v1`, `price(null)` — «без ціни», `fieldsOf`); `diff` копій — жодного рядка; `npx expo export --platform android` — у нас `Android Bundled 1421ms index.ts (601 modules)`.

    **8. На заявленій цілі.** `npm start`. Додай бажання «Рюкзак» за 30 — воно з’являється в кінці списку з «30 ₴»; «Редагувати» → рядок стає формою з його полями, нова ціна → рядок оновлюється; «Позначити отриманим» → «отримано», кнопка тепер «Повернути в бажані»; «Видалити» → питання в рядку → «Так, видалити» → рядка немає. Клавіша повернення переходить з поля на поле, ціна відкриває цифрову клавіатуру. Перезапусти застосунок — список знову стартовий: це очікувано для сховища в пам’яті. Цих екранів ми не бачили.

    **9. Доказ і commit.** У `EVIDENCE.md` — розділ «RN-03» (рядки кроку 7 і побачене на цілі, або запис «не виконано»; тоді на сторінці кроку — «У мене немає емулятора чи пристрою», а не «Цей крок виконано»). `git status --short` — серед іншого `?? ui/`, `?? src/adapters.ts`, `?? src/contracts.ts`, `?? src/snapshot.ts`, `?? tests/adapters.test.js`, `?? tests/reducer.test.js`. `git add -A`, `git commit -m "Create, edit and delete records in a FlatList through platform adapters"` — у нас `17 files changed`.

    **Самоперевірка:** `domain/`, `data/model.ts` і reducer — копії без змін (`diff` порожній); `src/adapters.ts`, `src/snapshot.ts` і `src/draft.ts` не імпортують `react-native`; екран не створює адаптерів сам — їх передає `App.tsx`; `keyExtractor` повертає `id`, а не індекс.

    **Якщо щось пішло не так:** після видалення текст, набраний в іншому рядку, «перескакує» — ключ списку не `id`. Кнопка «Зберегти» спрацьовує лише з другого дотику, поки відкрита клавіатура, — у `FlatList` немає `keyboardShouldPersistTaps="handled"`. `tsc` каже, що в `ItemsAction` немає такого `type`, — назви дій дивись у скопійованому `ui/itemsReducer.ts`, не вигадуй нових.

    Еталон кроку — `Завантажити: RN-03 — Записи в нативному списку: додати, змінити, прибрати` після експорту (без `assets/*.png`, `LICENSE`, `package-lock.json` і `node_modules/` — див. крок RN-01). Команди виконано лише на macOS; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    The screen comes alive: records can be created, changed, marked and removed. The list is a `FlatList` keyed by `id`. Every change is an action of the **React project's reducer**, copied unchanged, and everything that depends on the platform is an **adapter** the screen receives from `App.tsx`: the storage and the formatting (or the clock). The domain code does not change.

    | Project | Reducer (a copy) | Platform adapter | What it shows through the adapter |
    |---|---|---|---|
    | Wishlist | `itemsReducer` | `createPriceFormat` | the price: “UAH 80”, “UAH 1,250” or “no price” |
    | Planner | `tasksReducer` | `createDateFormat` | the due date: “March 2, 2026” or “no due date” |
    | Habit tracker | `habitsReducer` | `createSystemClock` | today's date for “Mark today” → `completeHabit` |
    | Expense tracker | `expensesReducer` | `createMoneyFormat` | the amount: “UAH 845.50”; `summarizeExpenses` computes the category totals |

    Every project also has `createMemoryStorage()`: a storage in memory with the same three methods as the device storage (`getItem`, `setItem`, `removeItem`). In this step the records are saved through it, so **after an app restart they are gone** — the device storage comes in the persistence step, and the screen will not change then.

    Below is the wishlist. The computer commands were run on macOS (Node.js 25.2.1, Expo SDK 57) on all four projects; the adapter texts above come from Node.js. There was no emulator, simulator or phone: step 8 follows the React Native 0.86 documentation and this unit's lessons; how Hermes on a device formats these numbers and dates we have not seen.

    **1. The starting state.** `cd ~/js-course/wishlist-native`, `git status` — clean, `git log --oneline -1` — the commit of the screen with the list and the form.

    **2. One more copy.** `mkdir -p ui`, `cp ../wishlist/ui/itemsReducer.ts ui/`, `cp ../wishlist/tests/reducer.test.js tests/`; add both files to the table of `docs/shared-code.md`, and the test to `run-tests.js`. `diff ../wishlist/ui/itemsReducer.ts ui/itemsReducer.ts` — not a single line. The copy's comments mention the React project's API — they stay so.

    **3. Contracts and adapters.** `src/contracts.ts` — types only: `StorageAdapter` (`getItem`, `setItem`, `removeItem` — all return a `Promise`) and `PriceFormat` (`price(price: number | null): string`). `src/adapters.ts` without an import of `react-native`: `createMemoryStorage()` (a `Map` inside the factory) and `createPriceFormat(locale, noPriceLabel)` on `Intl.NumberFormat` with `currency: "UAH"` and `maximumFractionDigits: 0`. `src/snapshot.ts`: the key `KEY = "jsll.wishlist.v1"` and `saveSnapshot(storage, records)`, which writes `{ schemaVersion: 1, records }` — the same key and the same shape as in the React project. Only `App.tsx` chooses the adapters.

    **4. Draft → fields.** Add `fieldsOf(value, draft, acquired)` to `src/draft.ts`: the cleaned name and price from `checkDraft`, the category without spaces at the edges (empty is `null`) and the `acquired` of the wish being changed (`false` for a new one). These are the fields `itemsReducer` expects.

    **5. The form and the row.** `ItemForm` gets `item` (or `null` for a new one), `onSave(fields)` and, for editing, `onCancel`; a valid draft goes to `onSave`, and the form is empty again. The return key moves the focus: name → price → category (`returnKeyType="next"`, `onSubmitEditing` and `ref.focus()`), on the last field “done” and a save; the price opens a digit keyboard (`keyboardType="number-pad"`). `ItemRow` shows the price through `format.price(…)` and has the buttons “Mark as acquired” / “Back to wanted”, “Edit”, “Delete”; a delete asks “Delete this wish?” right in the row. Every button is a `Pressable` at least 48 × 48.

    **6. The list.** `ItemsScreen`: `useReducer(itemsReducer, initialItems)`; a `FlatList` with `data={items}`, `keyExtractor={(item) => item.id}`, `keyboardShouldPersistTaps="handled"`; the new-wish form and the heading in `ListHeaderComponent`, an empty list as `ListEmptyComponent` (“There are no wishes yet…”); the row being edited becomes the form itself. A `useEffect` with `[storage, items]` saves every new list through `saveSnapshot`.

    **7. The check on the computer.** `npx tsc --noEmit` — not a single line; `npm test` — `Passed: 30 · failed: 0` (the new tests: the memory storage, the snapshot shape under `jsll.wishlist.v1`, `price(null)` — “no price”, `fieldsOf`); the `diff` of the copies — not a single line; `npx expo export --platform android` — for us `Android Bundled 1421ms index.ts (601 modules)`.

    **8. On the declared target.** `npm start`. Add the wish “Backpack” for 30 — it appears at the end of the list with “UAH 30”; “Edit” → the row becomes a form with its fields, a new price → the row updates; “Mark as acquired” → “acquired”, the button now says “Back to wanted”; “Delete” → the question in the row → “Yes, delete” → the row is gone. The return key moves from field to field, the price opens a digit keyboard. Restart the app — the list is the starting one again: that is expected with the memory storage. We have not seen these screens.

    **9. Evidence and commit.** In `EVIDENCE.md`, a section “RN-03” (the lines of step 7 and what you saw on the target, or a “not performed” record; then, on the step's page, “I have no emulator or device”, not “I have done this step”). `git status --short` — among others `?? ui/`, `?? src/adapters.ts`, `?? src/contracts.ts`, `?? src/snapshot.ts`, `?? tests/adapters.test.js`, `?? tests/reducer.test.js`. `git add -A`, `git commit -m "Create, edit and delete records in a FlatList through platform adapters"` — for us `17 files changed`.

    **Self-check:** `domain/`, `data/model.ts` and the reducer are unchanged copies (the `diff` is empty); `src/adapters.ts`, `src/snapshot.ts` and `src/draft.ts` do not import `react-native`; the screen creates no adapter itself — `App.tsx` passes them; `keyExtractor` returns the `id`, not the index.

    **If something goes wrong:** after a delete, text typed in another row “jumps” — the list key is not the `id`. “Save” works only on the second tap while the keyboard is open — the `FlatList` has no `keyboardShouldPersistTaps="handled"`. `tsc` says `ItemsAction` has no such `type` — look up the action names in the copied `ui/itemsReducer.ts`, do not invent new ones.

    The step's reference is `Download: RN-03 — Records in a native list: add, change, remove` after the export (without `assets/*.png`, `LICENSE`, `package-lock.json` and `node_modules/` — see step RN-01). The commands were run on macOS only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це крок твого проєкту: стан і reducer, адаптери платформи, клавіатуру й FlatList із ключами із цього розділу ти застосовуєш до власного застосунку. Платформа цей крок не перевіряє: доказ — вивід команд, тести, `EVIDENCE.md` і commit."
  en: "This is a step of your project: you apply this unit's state and reducer, platform adapters, keyboard and keyed FlatList to your own app. The platform does not check this step: the evidence is the command output, the tests, `EVIDENCE.md` and the commit."
objectives:
  - uk: "Створювати, змінювати, позначати й прибирати записи у `FlatList` з ключем `id` через reducer React-проєкту, скопійований без змін."
    en: "Create, change, mark and remove records in a `FlatList` keyed by `id` through the React project's reducer, copied unchanged."
  - uk: "Винести сховище й форматування (або годинник) в адаптери, які передає `App.tsx`, і перевірити їх тестами в Node.js."
    en: "Move the storage and the formatting (or the clock) into adapters that `App.tsx` passes in, and check them with tests in Node.js."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й на заявленій нативній цілі: що зробити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and on the declared native target: what to do, the expected output and the self-check list are above and on the step's page in your project."
