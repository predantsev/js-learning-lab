# Wishlist variant of step RN-03 (a local step: done in the learner's editor, terminal and on the declared
# native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1, Expo SDK
# 57) on the scratch project of this capstone; nothing was run on an emulator, a simulator or a phone.
instructions:
  uk: |
    Додавай, змінюй, позначай і прибирай бажання в нативному списку через reducer React-проєкту й адаптери платформи. Доменний код не змінюється. Платформа цей крок не перевіряє.

    1. Копії без змін: `ui/itemsReducer.ts` і `tests/reducer.test.js` з `../wishlist`; рядок у `docs/shared-code.md`, тест — у `run-tests.js`.
    2. `src/contracts.ts`: `StorageAdapter` (`getItem`, `setItem`, `removeItem`, усі асинхронні), `PriceFormat`. `src/adapters.ts`: `createMemoryStorage()`, `createPriceFormat(locale, noPriceLabel)`. `src/snapshot.ts`: `KEY = "jsll.wishlist.v1"`, `saveSnapshot`. Жоден не імпортує `react-native`; адаптери створює лише `App.tsx`.
    3. `src/draft.ts`: `fieldsOf(value, draft, acquired)` — поля для `itemsReducer`.
    4. `ItemForm`: нове бажання або редагування (`item`, `onSave`, `onCancel`); клавіша повернення назва → ціна → категорія; ціна — `number-pad`.
    5. `ItemRow`: ціна через `format.price`; «%%markAcquiredLabel%%» / «%%markWantedLabel%%», «%%editLabel%%», «%%deleteLabel%%» з питанням «%%confirmQuestion%%» у рядку.
    6. `ItemsScreen`: `useReducer(itemsReducer, …)`, `FlatList` з `keyExtractor={(item) => item.id}`, `keyboardShouldPersistTaps="handled"`, форма в `ListHeaderComponent`, «%%emptyMessage%%» у `ListEmptyComponent`; `saveSnapshot` після кожної зміни.
    7. `EVIDENCE.md`, розділ «RN-03»; `git commit -m "Create, edit and delete records in a FlatList through platform adapters"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx tsc --noEmit` — жодного рядка; `npm test` — 30 тестів, «не пройшли: 0».
    - `diff -r ../wishlist/domain domain`, `diff ../wishlist/data/model.ts data/model.ts`, `diff ../wishlist/ui/itemsReducer.ts ui/itemsReducer.ts` — жодного рядка.
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі: «%%newName%%» за 30 з’являється в кінці списку із ціною через адаптер; без ціни — «%%noPrice%%».
    - На цілі: «%%editLabel%%» перетворює рядок на форму з його полями; збережена зміна видна в рядку.
    - На цілі: «%%markAcquiredLabel%%» → «%%acquiredMark%%»; «%%deleteLabel%%» → «%%confirmQuestion%%» → «%%confirmDeleteLabel%%» → рядка немає.
    - На цілі: клавіша повернення переводить з поля на поле, ціна відкриває цифрову клавіатуру; після перезапуску список знову стартовий (сховище в пам’яті).

    **Доказ:** commit і `EVIDENCE.md` — рядки команд і те, що ти бачив на цілі, або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися. Без цілі натисни на цій сторінці «У мене немає емулятора чи пристрою», а не «Цей крок виконано».
  en: |
    Add, change, mark and remove wishes in a native list through the React project's reducer and platform adapters. The domain code does not change. The platform does not check this step.

    1. Unchanged copies: `ui/itemsReducer.ts` and `tests/reducer.test.js` from `../wishlist`; a row in `docs/shared-code.md`, the test in `run-tests.js`.
    2. `src/contracts.ts`: `StorageAdapter` (`getItem`, `setItem`, `removeItem`, all asynchronous), `PriceFormat`. `src/adapters.ts`: `createMemoryStorage()`, `createPriceFormat(locale, noPriceLabel)`. `src/snapshot.ts`: `KEY = "jsll.wishlist.v1"`, `saveSnapshot`. None imports `react-native`; only `App.tsx` creates the adapters.
    3. `src/draft.ts`: `fieldsOf(value, draft, acquired)` — the fields for `itemsReducer`.
    4. `ItemForm`: a new wish or an edit (`item`, `onSave`, `onCancel`); the return key goes name → price → category; the price is `number-pad`.
    5. `ItemRow`: the price through `format.price`; “%%markAcquiredLabel%%” / “%%markWantedLabel%%”, “%%editLabel%%”, “%%deleteLabel%%” with the question “%%confirmQuestion%%” in the row.
    6. `ItemsScreen`: `useReducer(itemsReducer, …)`, a `FlatList` with `keyExtractor={(item) => item.id}`, `keyboardShouldPersistTaps="handled"`, the form in `ListHeaderComponent`, “%%emptyMessage%%” in `ListEmptyComponent`; `saveSnapshot` after every change.
    7. `EVIDENCE.md`, a section “RN-03”; `git commit -m "Create, edit and delete records in a FlatList through platform adapters"`.

    **Self-check — confirm every item yourself:**

    - `npx tsc --noEmit` — not a single line; `npm test` — 30 tests, “failed: 0”.
    - `diff -r ../wishlist/domain domain`, `diff ../wishlist/data/model.ts data/model.ts`, `diff ../wishlist/ui/itemsReducer.ts ui/itemsReducer.ts` — not a single line.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target: “%%newName%%” for 30 appears at the end of the list with the price through the adapter; without a price — “%%noPrice%%”.
    - On the target: “%%editLabel%%” turns the row into a form with its fields; a saved change shows in the row.
    - On the target: “%%markAcquiredLabel%%” → “%%acquiredMark%%”; “%%deleteLabel%%” → “%%confirmQuestion%%” → “%%confirmDeleteLabel%%” → the row is gone.
    - On the target: the return key moves from field to field, the price opens a digit keyboard; after a restart the list is the starting one again (the memory storage).

    **Evidence:** the commit and `EVIDENCE.md` — the command lines and what you saw on the target, or a “not performed” record: what, on which target, why, what it takes to come back. Without a target, press “I have no emulator or device” on this page, not “I have done this step”.
