# Expense tracker variant of step RN-03 (a local step: done in the learner's editor, terminal and on the
# declared native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1,
# Expo SDK 57) on the scratch project of this capstone; nothing was run on an emulator, a simulator or a phone.
instructions:
  uk: |
    Додавай, змінюй і прибирай витрати в нативному списку через reducer React-проєкту й адаптери платформи; підсумки категорій рахує незмінний домен. Платформа цей крок не перевіряє.

    1. Копії без змін: `ui/expensesReducer.ts` і `tests/reducer.test.js` з `../expenses`; рядок у `docs/shared-code.md`, тест — у `run-tests.js`.
    2. `src/contracts.ts`: `StorageAdapter` (`getItem`, `setItem`, `removeItem`, усі асинхронні), `MoneyFormat`. `src/adapters.ts`: `createMemoryStorage()`, `createMoneyFormat(locale)` — `Intl.NumberFormat` з `currency: "UAH"`, ділення на 100 лише тут. `src/snapshot.ts`: `KEY = "jsll.expenses.v1"`, `saveSnapshot`. Жоден не імпортує `react-native`; адаптери створює лише `App.tsx`.
    3. `src/draft.ts`: `fieldsOf(value)` — поля для `expensesReducer`.
    4. `ExpenseForm`: нова витрата або редагування (`expense`, `onSave`, `onCancel`); клавіша повернення назва → сума → дата; сума — `decimal-pad`.
    5. `ExpenseRow`: сума через `format.money`; «%%editLabel%%», «%%deleteLabel%%» з питанням «%%confirmQuestion%%» у рядку. `CategoryTotals`: «%%totalLabel%%» і чотири категорії з `summarizeExpenses`.
    6. `ExpensesScreen`: `useReducer(expensesReducer, …)`, `FlatList` з `keyExtractor={(expense) => expense.id}`, `keyboardShouldPersistTaps="handled"`, форма й підсумки в `ListHeaderComponent`, «%%emptyMessage%%» у `ListEmptyComponent`; `saveSnapshot` після кожної зміни.
    7. `EVIDENCE.md`, розділ «RN-03»; `git commit -m "Create, edit and delete records in a FlatList through platform adapters"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx tsc --noEmit` — жодного рядка; `npm test` — 29 тестів, «не пройшли: 0».
    - `diff -r ../expenses/domain domain`, `diff ../expenses/data/model.ts data/model.ts`, `diff ../expenses/ui/expensesReducer.ts ui/expensesReducer.ts` — жодного рядка.
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі: «%%fixture1Name%%» показує суму 845%%decimalMark%%50 через адаптер; «%%totalLabel%%» і чотири категорії над списком.
    - На цілі: «%%newName%%» за 120%%decimalMark%%5 з’являється в кінці списку, і підсумок «%%categoryTransport%%» зростає на ту саму суму.
    - На цілі: «%%editLabel%%» перетворює рядок на форму з його полями; «%%deleteLabel%%» → «%%confirmQuestion%%» → «%%confirmDeleteLabel%%» → рядка немає, підсумки менші.
    - На цілі: сума відкриває цифрову клавіатуру з роздільником; після перезапуску список знову стартовий (сховище в пам’яті).

    **Доказ:** commit і `EVIDENCE.md` — рядки команд і те, що ти бачив на цілі, або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися.
  en: |
    Add, change and remove expenses in a native list through the React project's reducer and platform adapters; the unchanged domain computes the category totals. The platform does not check this step.

    1. Unchanged copies: `ui/expensesReducer.ts` and `tests/reducer.test.js` from `../expenses`; a row in `docs/shared-code.md`, the test in `run-tests.js`.
    2. `src/contracts.ts`: `StorageAdapter` (`getItem`, `setItem`, `removeItem`, all asynchronous), `MoneyFormat`. `src/adapters.ts`: `createMemoryStorage()`, `createMoneyFormat(locale)` — `Intl.NumberFormat` with `currency: "UAH"`, the division by 100 only here. `src/snapshot.ts`: `KEY = "jsll.expenses.v1"`, `saveSnapshot`. None imports `react-native`; only `App.tsx` creates the adapters.
    3. `src/draft.ts`: `fieldsOf(value)` — the fields for `expensesReducer`.
    4. `ExpenseForm`: a new expense or an edit (`expense`, `onSave`, `onCancel`); the return key goes label → amount → date; the amount is `decimal-pad`.
    5. `ExpenseRow`: the amount through `format.money`; “%%editLabel%%”, “%%deleteLabel%%” with the question “%%confirmQuestion%%” in the row. `CategoryTotals`: “%%totalLabel%%” and the four categories from `summarizeExpenses`.
    6. `ExpensesScreen`: `useReducer(expensesReducer, …)`, a `FlatList` with `keyExtractor={(expense) => expense.id}`, `keyboardShouldPersistTaps="handled"`, the form and the totals in `ListHeaderComponent`, “%%emptyMessage%%” in `ListEmptyComponent`; `saveSnapshot` after every change.
    7. `EVIDENCE.md`, a section “RN-03”; `git commit -m "Create, edit and delete records in a FlatList through platform adapters"`.

    **Self-check — confirm every item yourself:**

    - `npx tsc --noEmit` — not a single line; `npm test` — 29 tests, “failed: 0”.
    - `diff -r ../expenses/domain domain`, `diff ../expenses/data/model.ts data/model.ts`, `diff ../expenses/ui/expensesReducer.ts ui/expensesReducer.ts` — not a single line.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target: “%%fixture1Name%%” shows the amount 845%%decimalMark%%50 through the adapter; “%%totalLabel%%” and the four categories above the list.
    - On the target: “%%newName%%” for 120%%decimalMark%%5 appears at the end of the list, and the “%%categoryTransport%%” total grows by the same amount.
    - On the target: “%%editLabel%%” turns the row into a form with its fields; “%%deleteLabel%%” → “%%confirmQuestion%%” → “%%confirmDeleteLabel%%” → the row is gone, the totals are smaller.
    - On the target: the amount opens a digit keyboard with a separator; after a restart the list is the starting one again (the memory storage).

    **Evidence:** the commit and `EVIDENCE.md` — the command lines and what you saw on the target, or a “not performed” record: what, on which target, why, what it takes to come back.
