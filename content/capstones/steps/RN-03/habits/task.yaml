# Habit tracker variant of step RN-03 (a local step: done in the learner's editor, terminal and on the
# declared native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1,
# Expo SDK 57) on the scratch project of this capstone; nothing was run on an emulator, a simulator or a phone.
instructions:
  uk: |
    Додавай, змінюй, став на паузу, позначай сьогодні й прибирай звички в нативному списку через reducer React-проєкту й адаптери платформи. Доменний код не змінюється. Платформа цей крок не перевіряє.

    1. Копії без змін: `ui/habitsReducer.ts` і `tests/reducer.test.js` з `../habits`; рядок у `docs/shared-code.md`, тест — у `run-tests.js`.
    2. `src/contracts.ts`: `StorageAdapter` (`getItem`, `setItem`, `removeItem`, усі асинхронні), `ClockAdapter` (`today()` → `"YYYY-MM-DD"`). `src/adapters.ts`: `createMemoryStorage()`, `createSystemClock()` (дата в часовому поясі пристрою), `createFixedClock(day)`. `src/snapshot.ts`: `KEY = "jsll.habits.v1"`, `saveSnapshot`. Жоден не імпортує `react-native`; адаптери створює лише `App.tsx`.
    3. `src/draft.ts`: `fieldsOf(value, active)` — поля для `habitsReducer`.
    4. `HabitForm`: нова звичка або редагування (`habit`, `onSave`, `onCancel`).
    5. `HabitRow`: «%%doneTodayMark%%», коли в `completions` є сьогоднішня дата; «%%markTodayLabel%%» (дія `completionAdded` з `day: clock.today()` → `completeHabit`), «%%pauseLabel%%» / «%%resumeLabel%%», «%%editLabel%%», «%%deleteLabel%%» з питанням «%%confirmQuestion%%» у рядку.
    6. `HabitsScreen`: `useReducer(habitsReducer, …)`, `FlatList` з `keyExtractor={(habit) => habit.id}`, `keyboardShouldPersistTaps="handled"`, форма в `ListHeaderComponent`, «%%emptyMessage%%» у `ListEmptyComponent`; `saveSnapshot` після кожної зміни.
    7. `EVIDENCE.md`, розділ «RN-03»; `git commit -m "Create, edit and delete records in a FlatList through platform adapters"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx tsc --noEmit` — жодного рядка; `npm test` — 30 тестів, «не пройшли: 0» (серед них: з фіксованим годинником «сьогодні» додається один раз і стає на своє місце).
    - `diff -r ../habits/domain domain`, `diff ../habits/data/model.ts data/model.ts`, `diff ../habits/ui/habitsReducer.ts ui/habitsReducer.ts` — жодного рядка.
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі: «%%markTodayLabel%%» у «%%fixture1Name%%» → «%%doneTodayMark%%», кнопка зникає; повторно та сама дата не додається.
    - На цілі: «%%newName%%» з’являється в кінці списку; «%%editLabel%%» перетворює рядок на форму з його полями.
    - На цілі: «%%pauseLabel%%» → «%%pausedMark%%»; «%%deleteLabel%%» → «%%confirmQuestion%%» → «%%confirmDeleteLabel%%» → рядка немає.
    - На цілі: після перезапуску список знову стартовий (сховище в пам’яті).

    **Доказ:** commit і `EVIDENCE.md` — рядки команд і те, що ти бачив на цілі, або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися. Без цілі натисни на цій сторінці «У мене немає емулятора чи пристрою», а не «Цей крок виконано».
  en: |
    Add, change, pause, mark today and remove habits in a native list through the React project's reducer and platform adapters. The domain code does not change. The platform does not check this step.

    1. Unchanged copies: `ui/habitsReducer.ts` and `tests/reducer.test.js` from `../habits`; a row in `docs/shared-code.md`, the test in `run-tests.js`.
    2. `src/contracts.ts`: `StorageAdapter` (`getItem`, `setItem`, `removeItem`, all asynchronous), `ClockAdapter` (`today()` → `"YYYY-MM-DD"`). `src/adapters.ts`: `createMemoryStorage()`, `createSystemClock()` (the date in the device's time zone), `createFixedClock(day)`. `src/snapshot.ts`: `KEY = "jsll.habits.v1"`, `saveSnapshot`. None imports `react-native`; only `App.tsx` creates the adapters.
    3. `src/draft.ts`: `fieldsOf(value, active)` — the fields for `habitsReducer`.
    4. `HabitForm`: a new habit or an edit (`habit`, `onSave`, `onCancel`).
    5. `HabitRow`: “%%doneTodayMark%%” when `completions` holds today's date; “%%markTodayLabel%%” (the action `completionAdded` with `day: clock.today()` → `completeHabit`), “%%pauseLabel%%” / “%%resumeLabel%%”, “%%editLabel%%”, “%%deleteLabel%%” with the question “%%confirmQuestion%%” in the row.
    6. `HabitsScreen`: `useReducer(habitsReducer, …)`, a `FlatList` with `keyExtractor={(habit) => habit.id}`, `keyboardShouldPersistTaps="handled"`, the form in `ListHeaderComponent`, “%%emptyMessage%%” in `ListEmptyComponent`; `saveSnapshot` after every change.
    7. `EVIDENCE.md`, a section “RN-03”; `git commit -m "Create, edit and delete records in a FlatList through platform adapters"`.

    **Self-check — confirm every item yourself:**

    - `npx tsc --noEmit` — not a single line; `npm test` — 30 tests, “failed: 0” (among them: with a fixed clock, “today” is added once and lands in its place).
    - `diff -r ../habits/domain domain`, `diff ../habits/data/model.ts data/model.ts`, `diff ../habits/ui/habitsReducer.ts ui/habitsReducer.ts` — not a single line.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target: “%%markTodayLabel%%” on “%%fixture1Name%%” → “%%doneTodayMark%%”, the button disappears; the same date is never added twice.
    - On the target: “%%newName%%” appears at the end of the list; “%%editLabel%%” turns the row into a form with its fields.
    - On the target: “%%pauseLabel%%” → “%%pausedMark%%”; “%%deleteLabel%%” → “%%confirmQuestion%%” → “%%confirmDeleteLabel%%” → the row is gone.
    - On the target: after a restart the list is the starting one again (the memory storage).

    **Evidence:** the commit and `EVIDENCE.md` — the command lines and what you saw on the target, or a “not performed” record: what, on which target, why, what it takes to come back. Without a target, press “I have no emulator or device” on this page, not “I have done this step”.
