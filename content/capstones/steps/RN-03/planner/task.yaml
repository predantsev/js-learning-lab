# Planner variant of step RN-03 (a local step: done in the learner's editor, terminal and on the declared
# native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1, Expo SDK
# 57) on the scratch project of this capstone; nothing was run on an emulator, a simulator or a phone.
instructions:
  uk: |
    Додавай, змінюй, позначай і прибирай справи в нативному списку через reducer React-проєкту й адаптери платформи. Доменний код не змінюється. Платформа цей крок не перевіряє.

    1. Копії без змін: `ui/tasksReducer.ts` і `tests/reducer.test.js` з `../planner`; рядок у `docs/shared-code.md`, тест — у `run-tests.js`.
    2. `src/contracts.ts`: `StorageAdapter` (`getItem`, `setItem`, `removeItem`, усі асинхронні), `DateFormat`. `src/adapters.ts`: `createMemoryStorage()`, `createDateFormat(locale, noDueDateLabel)` — `Intl.DateTimeFormat` з `dateStyle: "long"` і `timeZone: "UTC"`. `src/snapshot.ts`: `KEY = "jsll.planner.v1"`, `saveSnapshot`. Жоден не імпортує `react-native`; адаптери створює лише `App.tsx`.
    3. `src/draft.ts`: `fieldsOf(value, done)` — поля для `tasksReducer`.
    4. `TaskForm`: нова справа або редагування (`task`, `onSave`, `onCancel`); клавіша повернення назва → термін.
    5. `TaskRow`: термін через `format.day`; «%%markDoneLabel%%» / «%%markPendingLabel%%», «%%editLabel%%», «%%deleteLabel%%» з питанням «%%confirmQuestion%%» у рядку.
    6. `TasksScreen`: `useReducer(tasksReducer, …)`, `FlatList` з `keyExtractor={(task) => task.id}`, `keyboardShouldPersistTaps="handled"`, форма в `ListHeaderComponent`, «%%emptyMessage%%» у `ListEmptyComponent`; `saveSnapshot` після кожної зміни.
    7. `EVIDENCE.md`, розділ «RN-03»; `git commit -m "Create, edit and delete records in a FlatList through platform adapters"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx tsc --noEmit` — жодного рядка; `npm test` — 31 тест, «не пройшли: 0»; так само з `TZ=Pacific/Pago_Pago npm test` і `TZ=Pacific/Kiritimati npm test` (часові пояси по обидва боки від UTC).
    - `diff -r ../planner/domain domain`, `diff ../planner/data/model.ts data/model.ts`, `diff ../planner/ui/tasksReducer.ts ui/tasksReducer.ts` — жодного рядка.
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі: «%%fixture1Name%%» має довгу дату 2 березня 2026 мовою проєкту, «%%fixture3Name%%» — «%%noDueDate%%».
    - На цілі: «%%newName%%» з терміном `2026-03-04` з’являється в кінці списку; «%%editLabel%%» перетворює рядок на форму з його полями.
    - На цілі: «%%markDoneLabel%%» → «%%doneMark%%»; «%%deleteLabel%%» → «%%confirmQuestion%%» → «%%confirmDeleteLabel%%» → рядка немає.
    - На цілі: клавіша повернення переводить з назви на термін; після перезапуску список знову стартовий (сховище в пам’яті).

    **Доказ:** commit і `EVIDENCE.md` — рядки команд і те, що ти бачив на цілі, або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися. Без цілі натисни на цій сторінці «У мене немає емулятора чи пристрою», а не «Цей крок виконано».
  en: |
    Add, change, mark and remove tasks in a native list through the React project's reducer and platform adapters. The domain code does not change. The platform does not check this step.

    1. Unchanged copies: `ui/tasksReducer.ts` and `tests/reducer.test.js` from `../planner`; a row in `docs/shared-code.md`, the test in `run-tests.js`.
    2. `src/contracts.ts`: `StorageAdapter` (`getItem`, `setItem`, `removeItem`, all asynchronous), `DateFormat`. `src/adapters.ts`: `createMemoryStorage()`, `createDateFormat(locale, noDueDateLabel)` — `Intl.DateTimeFormat` with `dateStyle: "long"` and `timeZone: "UTC"`. `src/snapshot.ts`: `KEY = "jsll.planner.v1"`, `saveSnapshot`. None imports `react-native`; only `App.tsx` creates the adapters.
    3. `src/draft.ts`: `fieldsOf(value, done)` — the fields for `tasksReducer`.
    4. `TaskForm`: a new task or an edit (`task`, `onSave`, `onCancel`); the return key goes title → due date.
    5. `TaskRow`: the due date through `format.day`; “%%markDoneLabel%%” / “%%markPendingLabel%%”, “%%editLabel%%”, “%%deleteLabel%%” with the question “%%confirmQuestion%%” in the row.
    6. `TasksScreen`: `useReducer(tasksReducer, …)`, a `FlatList` with `keyExtractor={(task) => task.id}`, `keyboardShouldPersistTaps="handled"`, the form in `ListHeaderComponent`, “%%emptyMessage%%” in `ListEmptyComponent`; `saveSnapshot` after every change.
    7. `EVIDENCE.md`, a section “RN-03”; `git commit -m "Create, edit and delete records in a FlatList through platform adapters"`.

    **Self-check — confirm every item yourself:**

    - `npx tsc --noEmit` — not a single line; `npm test` — 31 tests, “failed: 0”; the same with `TZ=Pacific/Pago_Pago npm test` and `TZ=Pacific/Kiritimati npm test` (time zones on both sides of UTC).
    - `diff -r ../planner/domain domain`, `diff ../planner/data/model.ts data/model.ts`, `diff ../planner/ui/tasksReducer.ts ui/tasksReducer.ts` — not a single line.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target: “%%fixture1Name%%” has the long date of March 2, 2026 in the project's language, “%%fixture3Name%%” — “%%noDueDate%%”.
    - On the target: “%%newName%%” with the due date `2026-03-04` appears at the end of the list; “%%editLabel%%” turns the row into a form with its fields.
    - On the target: “%%markDoneLabel%%” → “%%doneMark%%”; “%%deleteLabel%%” → “%%confirmQuestion%%” → “%%confirmDeleteLabel%%” → the row is gone.
    - On the target: the return key moves from the title to the due date; after a restart the list is the starting one again (the memory storage).

    **Evidence:** the commit and `EVIDENCE.md` — the command lines and what you saw on the target, or a “not performed” record: what, on which target, why, what it takes to come back. Without a target, press “I have no emulator or device” on this page, not “I have done this step”.
