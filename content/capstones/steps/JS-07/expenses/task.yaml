# Expenses variant of step JS-07. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  loadErrorMessage:
    uk: "Збережені витрати не вдалося прочитати, тож показано початковий список. Старі дані лежать під ключем jsll.expenses.v1.backup."
    en: "The saved expenses could not be read, so the starting list is shown. The old data is kept under the key jsll.expenses.v1.backup."
instructions:
  uk: |
    Сторінка й правила вже працюють; тепер код розходиться по модулях, а витрати переживають перезапуск. Поведінка форми й карток з попереднього кроку не змінюється.

    **Модулі.** Імпортуй з розширенням і відносним шляхом (з `ui/page.js` до правил — `../domain/expenses.js`).

    - `domain/expenses.js` — чисті функції з `app.js` (`validateExpense`, `addExpense`, `updateExpense`, `removeExpense`, `summarizeExpenses` і решта функцій попередніх кроків, крім `messageFor`) та `expenses`, з іменованим `export` для всього, що потрібне іншим модулям. Тут немає `document` і `localStorage`.
    - `storage/expenses.js` — `loadExpenses(storage)` і `saveExpenses(storage, list)`; сховище приходить параметром.
    - `ui/page.js` — усе, що торкається сторінки: елементи, `messageFor`, `render()`, обробники, а також `export function start(storage)`.
    - `app.js` — лише імпорт `start` і виклик `start(localStorage)`.

    Жоден модуль не тримає власних копій функцій іншого модуля: він їх імпортує.

    **Збереження.** `saveExpenses(storage, list)` записує під ключем `jsll.expenses.v1` текст `JSON.stringify({ schemaVersion: 1, records: list })`. Кожна зміна на сторінці — додавання, збережене редагування, підтверджене видалення — одразу зберігає новий список у те сховище, яке отримав `start`.

    **Завантаження.** `loadExpenses(storage)` повертає:

    - `{ ok: true, expenses }` — збережені витрати;
    - `{ ok: false, reason: "missing" }` — під ключем нічого немає;
    - `{ ok: false, reason: "unparsable" }` — `JSON.parse` кинув помилку;
    - `{ ok: false, reason: "wrong-version" }` — значення не є об’єктом зі `schemaVersion: 1` і масивом `records` (сюди належать і `null`, і голий масив);
    - `{ ok: false, reason: "invalid-record" }` — хоча б один запис пошкоджений: не об’єкт, `id`, `label` чи `date` не текст або `validateExpense` його не пропускає.

    В останніх трьох випадках `loadExpenses` спершу кладе збережений текст без змін під ключ `jsll.expenses.v1.backup`. Текст під основним ключем завантаження ніколи не змінює.

    **Запуск.** `start(storage)` завантажує витрати. Якщо `ok`, сторінка показує збережений список, інакше — початковий `expenses`. Над підсумком стоїть `<p id="status" role="status">`: коли причина не `"missing"`, у ньому «%%loadErrorMessage%%», інакше він порожній. `start` може виконатися не один раз (так перевірки імітують перезапуск), тому обробники форми й списку вішаються один раз на верхньому рівні `ui/page.js`, а не всередині `start`.

    **Нові `id`.** Після перезапуску збережений список уже може мати `"e-7"` чи `"e-8"`, тож лічильник, що щоразу починає з 7, дасть повтор. Новий запис отримує `id`, якого немає в жодного запису поточного списку.

    **Перевір сам:** додай запис через форму й натисни «Запустити» ще раз — він на місці, а вкладка «Сховище» показує збережений JSON. Щоб побачити відновлення, тимчасово додай на початок `app.js` рядок коду `localStorage.setItem("jsll.expenses.v1", "{bad");`, запусти, переконайся, що є повідомлення й початковий список, і прибери цей рядок.

    **Як перевірятиметься:** перевірки починають із порожнього сховища. Вони завантажують `domain/expenses.js` і `storage/expenses.js` та викликають їхні функції з підготовленим вмістом сховища; додають і видаляють записи на сторінці й читають збережений JSON. «Перезапуск» — це повторне виконання `app.js`; імпортовані модулі при цьому не виконуються вдруге, тому сам `app.js` має викликати `start`. Перезапуск відбувається з пошкодженими текстами (`{bad`, `schemaVersion: 2`, запис без назви) і з трьома правильними записами `e-02`, `e-7`, `e-8`, до яких потім додається ще один. Наприкінці `expenses` має лишитися тими самими шістьма витратами.
  en: |
    The page and the rules already work; now the code spreads over modules, and the expenses survive a restart. The behavior of the form and the cards from the previous step does not change.

    **Modules.** Import with the extension and a relative path (from `ui/page.js` to the rules — `../domain/expenses.js`).

    - `domain/expenses.js` — the pure functions from `app.js` (`validateExpense`, `addExpense`, `updateExpense`, `removeExpense`, `summarizeExpenses` and the other functions of the earlier steps, except `messageFor`) and `expenses`, with a named `export` for everything other modules need. There is no `document` and no `localStorage` here.
    - `storage/expenses.js` — `loadExpenses(storage)` and `saveExpenses(storage, list)`; the storage comes in as a parameter.
    - `ui/page.js` — everything that touches the page: the elements, `messageFor`, `render()`, the handlers, and `export function start(storage)`.
    - `app.js` — only the import of `start` and the call `start(localStorage)`.

    No module keeps its own copies of another module's functions: it imports them.

    **Saving.** `saveExpenses(storage, list)` writes the text `JSON.stringify({ schemaVersion: 1, records: list })` under the key `jsll.expenses.v1`. Every change on the page — an add, a saved edit, a confirmed delete — saves the new list at once into the storage `start` received.

    **Loading.** `loadExpenses(storage)` returns:

    - `{ ok: true, expenses }` — the saved expenses;
    - `{ ok: false, reason: "missing" }` — nothing is saved under the key;
    - `{ ok: false, reason: "unparsable" }` — `JSON.parse` threw an error;
    - `{ ok: false, reason: "wrong-version" }` — the value is not an object with `schemaVersion: 1` and an array `records` (`null` and a bare array belong here too);
    - `{ ok: false, reason: "invalid-record" }` — at least one record is damaged: not an object, `id`, `label` or `date` is not text, or `validateExpense` rejects it.

    In the last three cases `loadExpenses` first puts the saved text unchanged under the key `jsll.expenses.v1.backup`. Loading never changes the text under the main key.

    **Start.** `start(storage)` loads the expenses. If `ok`, the page shows the saved list, otherwise the starting `expenses`. Above the summary there is a `<p id="status" role="status">`: when the reason is not `"missing"`, it holds “%%loadErrorMessage%%”, otherwise it is empty. `start` may run more than once (this is how the checks imitate a restart), so the form and list handlers are attached once at the top level of `ui/page.js`, not inside `start`.

    **New `id`s.** After a restart the saved list may already have `"e-7"` or `"e-8"`, so a counter that starts at 7 every time gives a repeat. A new record gets an `id` that no record of the current list has.

    **Check it yourself:** add a record with the form and press “Run” again — it is still there, and the “Storage” tab shows the saved JSON. To see the recovery, temporarily add the line of code `localStorage.setItem("jsll.expenses.v1", "{bad");` at the top of `app.js`, run, make sure the message and the starting list appear, and remove that line.

    **How it is checked:** the checks start with an empty storage. They load `domain/expenses.js` and `storage/expenses.js` and call their functions with prepared storage contents; they add and delete records on the page and read the saved JSON. A “restart” runs `app.js` again; imported modules are not run a second time, so `app.js` itself must call `start`. The restarts use damaged texts (`{bad`, `schemaVersion: 2`, a record without a name) and three valid records `e-02`, `e-7`, `e-8`, to which one more is then added. At the end `expenses` must still be the same six expenses.
nudge:
  uk: "Згадай урок про незалежні модулі: `loadLoans` там спершу брав текст через `getItem`, потім розбирав його в `try`/`catch`, перевіряв `schemaVersion` і `Array.isArray(records)`, а кожен запис — функцією перевірки, і для кожної невдачі мав окрему причину. Невелика внутрішня функція, яка кладе текст під резервний ключ і повертає `{ ok: false, reason }`, прибирає повтори. Для вільного `id` можна брати числа по черзі й пропускати ті, що вже є в списку (`some`)."
  en: "Recall the lesson on independent modules: `loadLoans` there first took the text with `getItem`, then parsed it in `try`/`catch`, checked `schemaVersion` and `Array.isArray(records)`, and every record with the check function, with a separate reason for every failure. A small inner function that puts the text under the backup key and returns `{ ok: false, reason }` removes the repetition. For a free `id`, you can take numbers in turn and skip the ones the list already has (`some`)."
testTitles:
  "the script runs without errors":
    uk: "Проєкт запускається без помилок"
    en: "The project starts without errors"
  "domain/expenses.js exports the rules and the starting list":
    uk: "`domain/expenses.js` експортує правила й початковий список `expenses`"
    en: "`domain/expenses.js` exports the rules and the starting list `expenses`"
  "the other modules use the domain functions instead of copies":
    uk: "Інші модулі імпортують функції правил і сховища, а не тримають копії; сторінка — у теці `ui/`"
    en: "The other modules import the rule and storage functions instead of keeping copies; the page is in the folder `ui/`"
  "with nothing saved the page shows the six expenses and no message":
    uk: "Без збережених даних сторінка показує шість витрат і порожній `role=\"status\"`"
    en: "With nothing saved the page shows six expenses and an empty `role=\"status\"`"
  "a change on the page is saved with schemaVersion 1":
    uk: "Додавання й видалення на сторінці зберігаються як `{ schemaVersion: 1, records }`"
    en: "Adding and deleting on the page are saved as `{ schemaVersion: 1, records }`"
  "loadExpenses reads valid saved expenses":
    uk: "`loadExpenses` читає правильні збережені витрати"
    en: "`loadExpenses` reads valid saved expenses"
  "loadExpenses reports missing data without a backup":
    uk: "`loadExpenses` повідомляє `\"missing\"`, коли нічого не збережено, і не створює резервну копію"
    en: "`loadExpenses` reports `\"missing\"` when nothing is saved and creates no backup"
  "loadExpenses names what is wrong with damaged data":
    uk: "`loadExpenses` називає причину для пошкоджених даних"
    en: "`loadExpenses` names the reason for damaged data"
  "damaged data stays saved and is copied under the backup key":
    uk: "Завантаження не змінює збережений текст, а пошкоджений кладе під резервний ключ"
    en: "Loading does not change the saved text and puts damaged text under the backup key"
  "saveExpenses saves the expenses with schemaVersion 1":
    uk: "`saveExpenses` зберігає витрати з `schemaVersion: 1`"
    en: "`saveExpenses` saves the expenses with `schemaVersion: 1`"
  "damaged saved data shows the message and the starting expenses after a restart":
    uk: "Після перезапуску з пошкодженими даними — повідомлення й початкові витрати"
    en: "After a restart with damaged data — the message and the starting expenses"
  "saved expenses come back after a restart, without the message":
    uk: "Після перезапуску збережені витрати повертаються, а повідомлення немає"
    en: "After a restart the saved expenses come back, and there is no message"
  "an expense added after a restart gets an id no other expense has":
    uk: "Запис, доданий після перезапуску, отримує `id`, якого більше ні в кого немає"
    en: "An expense added after a restart gets an `id` no other expense has"
  "expenses stays the starting list":
    uk: "`expenses` після всіх дій і перезапусків лишається тими самими шістьма витратами"
    en: "`expenses` is still the same six expenses after all actions and restarts"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js` і всі імпортовані модулі виконаються без помилки; інакше решта перевірок бачить порожню сторінку. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там `SyntaxError` про `export` чи `import`, то назва в `import { … }` не збігається з іменованим експортом модуля. Якщо там помилка завантаження файлу, то шлях в `import` має бути відносним і з `.js`: з `ui/page.js` до правил — `../domain/expenses.js`."
      en: "This check expects `app.js` and every imported module to run without an error; otherwise the other checks see an empty page. The “Console” tab shows the error name and the line of code. If it shows a `SyntaxError` about `export` or `import`, a name in `import { … }` does not match a named export of the module. If it shows a file loading error, the path in `import` must be relative and end with `.js`: from `ui/page.js` to the rules it is `../domain/expenses.js`."
  - when: { test: "domain/expenses.js exports the rules and the starting list" }
    message:
      uk: "Ця перевірка завантажує `domain/expenses.js` і чекає іменовані експорти `validateExpense`, `addExpense`, `updateExpense`, `removeExpense`, `summarizeExpenses` (функції) та `expenses` — ті самі шість початкових витрат, що й раніше. Без `export` перед оголошенням інший модуль цю назву не бачить. Якщо вгорі «Failed to resolve module specifier», то файлу `domain/expenses.js` немає або його назва інша."
      en: "This check loads `domain/expenses.js` and expects the named exports `validateExpense`, `addExpense`, `updateExpense`, `removeExpense`, `summarizeExpenses` (functions) and `expenses` — the same six starting expenses as before. Without `export` before a declaration, other modules cannot see that name. If it says “Failed to resolve module specifier” above, there is no file `domain/expenses.js` or its name differs."
  - when: { test: "the other modules use the domain functions instead of copies" }
    message:
      uk: "Ця перевірка чекає хоча б один файл `.js` у теці `ui/` і порівнює функції з такими назвами, як у `domain/expenses.js` чи `storage/expenses.js`, в усіх інших модулях: кожна має бути тією самою функцією, яку експортує її модуль. Якщо тут не збігається назва, то в цьому файлі лишилася власна копія, а її треба замінити на `import`."
      en: "This check expects at least one `.js` file in the folder `ui/` and compares the functions named like the ones of `domain/expenses.js` or `storage/expenses.js` in all other modules: each must be the very function its module exports. If a name does not match here, that file still has its own copy, and it needs to become an `import`."
  - when: { test: "with nothing saved the page shows the six expenses and no message" }
    message:
      uk: "Ця перевірка дивиться на першу появу сторінки з порожнім сховищем і чекає шість карток `e-01`…`e-06` та порожній елемент `role=\"status\"`. Відсутні дані — звичайний перший запуск, тож причина `\"missing\"` повідомлення не показує."
      en: "This check looks at the first appearance of the page with an empty storage and expects six cards `e-01`…`e-06` and an empty `role=\"status\"` element. Missing data is an ordinary first start, so the reason `\"missing\"` shows no message."
  - when: { test: "a change on the page is saved with schemaVersion 1" }
    message:
      uk: "Ця перевірка додає «%%newName%%» через форму, а потім підтверджено видаляє `e-03`, і після кожної дії читає JSON під ключем `jsll.expenses.v1`: там `schemaVersion: 1` і `records` — поточний список (7, потім 6 записів). Якщо там нічого немає, то зміна малює сторінку, але не викликає `saveExpenses`."
      en: "This check adds “%%newName%%” with the form, then deletes `e-03` with a confirmation, and after each action reads the JSON under the key `jsll.expenses.v1`: it holds `schemaVersion: 1` and `records` — the current list (7, then 6 records). If nothing is there, the change draws the page but does not call `saveExpenses`."
  - when: { test: "loadExpenses reads valid saved expenses" }
    message:
      uk: "Ця перевірка зберігає три правильні записи як `{ schemaVersion: 1, records }` і чекає від `loadExpenses(storage)` рівно `{ ok: true, expenses: [ці три записи] }`."
      en: "This check saves three valid records as `{ schemaVersion: 1, records }` and expects exactly `{ ok: true, expenses: [these three records] }` from `loadExpenses(storage)`."
  - when: { test: "loadExpenses reports missing data without a backup" }
    message:
      uk: "Ця перевірка очищає сховище й чекає від `loadExpenses(storage)` `{ ok: false, reason: \"missing\" }`, а під ключем `jsll.expenses.v1.backup` — нічого: для відсутніх даних резервна копія не потрібна. `getItem` для відсутнього ключа повертає `null`."
      en: "This check clears the storage and expects `{ ok: false, reason: \"missing\" }` from `loadExpenses(storage)` and nothing under the key `jsll.expenses.v1.backup`: missing data needs no backup. `getItem` returns `null` for a missing key."
  - when: { test: "loadExpenses names what is wrong with damaged data" }
    message:
      uk: "Ця перевірка зберігає по черзі: текст, що не є JSON (чекає `\"unparsable\"`); `schemaVersion: 2`, `records` як текст, `null` і голий масив (`\"wrong-version\"`); запис без назви, `amountMinor: 845.5` і `category: \"travel\"` (`\"invalid-record\"`). Повідомлення внизу називає вміст, на якому відповідь відрізнилася. Якщо там «it threw TypeError», то код читає поле значення `null`: `JSON.parse(\"null\")` дає `null`, і цей випадок теж має повернути `\"wrong-version\"`."
      en: "This check saves in turn: text that is not JSON (expects `\"unparsable\"`); `schemaVersion: 2`, `records` as text, `null` and a bare array (`\"wrong-version\"`); a record without a label, `amountMinor: 845.5` and `category: \"travel\"` (`\"invalid-record\"`). The message below names the content where the answer differed. If it says “it threw TypeError”, the code reads a field of the value `null`: `JSON.parse(\"null\")` gives `null`, and this case must return `\"wrong-version\"` too."
  - when: { test: "damaged data stays saved and is copied under the backup key" }
    message:
      uk: "Ця перевірка після кожного завантаження чекає під `jsll.expenses.v1` той самий текст, що був збережений, а для кожного пошкодженого вмісту — точно той самий текст і під `jsll.expenses.v1.backup`. Якщо резервна копія відрізняється, то туди потрапив не збережений текст, а щось інше, наприклад результат `JSON.stringify`."
      en: "After every load, this check expects the same text as saved under `jsll.expenses.v1`, and for every damaged content exactly the same text under `jsll.expenses.v1.backup` too. If the backup differs, something other than the saved text went there, for example a result of `JSON.stringify`."
  - when: { test: "saveExpenses saves the expenses with schemaVersion 1" }
    message:
      uk: "Ця перевірка викликає `saveExpenses(storage, три записи)` і чекає, що `JSON.parse` тексту під `jsll.expenses.v1` дає `{ schemaVersion: 1, records: [ці три записи] }`."
      en: "This check calls `saveExpenses(storage, three records)` and expects `JSON.parse` of the text under `jsll.expenses.v1` to give `{ schemaVersion: 1, records: [these three records] }`."
  - when: { test: "damaged saved data shows the message and the starting expenses after a restart" }
    message:
      uk: "Ця перевірка зберігає `{bad`, потім `schemaVersion: 2`, потім запис без назви, щоразу виконує `app.js` знову й чекає: жодної помилки, у `role=\"status\"` — «%%loadErrorMessage%%», картки `e-01`…`e-06`, а під `jsll.expenses.v1.backup` — збережений текст. Якщо картки не змінилися після перезапуску, то `app.js` не викликає `start` сам: імпортований модуль повторно не виконується."
      en: "This check saves `{bad`, then `schemaVersion: 2`, then a record without a name, runs `app.js` again every time and expects: no error, “%%loadErrorMessage%%” in `role=\"status\"`, the cards `e-01`…`e-06`, and the saved text under `jsll.expenses.v1.backup`. If the cards did not change after a restart, `app.js` does not call `start` itself: an imported module is not run again."
  - when: { test: "saved expenses come back after a restart, without the message" }
    message:
      uk: "Ця перевірка зберігає три правильні записи `e-02`, `e-7`, `e-8`, виконує `app.js` знову й чекає саме ці три картки в цьому порядку, картку `e-02` зі збереженими значеннями та порожній `role=\"status\"`: повідомлення з попереднього перезапуску має зникнути."
      en: "This check saves three valid records `e-02`, `e-7`, `e-8`, runs `app.js` again and expects exactly these three cards in this order, the card `e-02` with the saved values, and an empty `role=\"status\"`: the message of the previous restart must be gone."
  - when: { test: "an expense added after a restart gets an id no other expense has" }
    message:
      uk: "Ця перевірка після перезапуску з `e-02`, `e-7`, `e-8` додає ще один запис і чекає 4 збережені записи з різними `id`. Якщо новий `id` повторює збережений, то він береться з лічильника, який не знає про збережений список."
