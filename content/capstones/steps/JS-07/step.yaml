# Capstone step of unit JS-07 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-07-11-capstone-modules-persistence from this file.
unit: JS-07
mode: in-platform
entry: index.html
title:
  uk: "Модулі й збережені дані"
  en: "Modules and saved data"
intro:
  uk: |
    Досі весь проєкт жив в одному `app.js`, а після перезапуску сторінка забувала всі зміни. На цьому кроці код розходиться по ES-модулях, а записи зберігаються між запусками.

    - `domain/` — правила домену й початкові дані: чисті функції без сторінки й без сховища.
    - `storage/` — збереження й завантаження: записи лежать у сховищі як JSON `{ schemaVersion: 1, records }` під ключем `jsll.<проєкт>.v1`.
    - `ui/` — сторінка: картки, форма, кнопки.
    - `app.js` лише запускає сторінку.

    Збережені дані — це вхід ззовні, і довіряти йому не можна: текст міг зіпсуватися, а запис — втратити поле. Тому завантаження спершу розбирає JSON у `try`/`catch`, перевіряє версію й кожен запис тією самою функцією перевірки, що й форма. Пошкоджене не показується й не губиться: сторінка повідомляє про проблему, а збережений текст лишається копією під окремим ключем.
  en: |
    So far the whole project lived in one `app.js`, and after a restart the page forgot every change. In this step the code spreads over ES modules, and the records are kept between runs.

    - `domain/` — the domain's rules and the starting data: pure functions with no page and no storage.
    - `storage/` — saving and loading: the records lie in the storage as the JSON `{ schemaVersion: 1, records }` under the key `jsll.<project>.v1`.
    - `ui/` — the page: cards, the form, the buttons.
    - `app.js` only starts the page.

    Saved data is input from outside, and it cannot be trusted: the text may be broken, and a record may have lost a field. So loading first parses the JSON in `try`/`catch`, then checks the version and every record with the same check function the form uses. Damaged data is neither shown nor lost: the page reports the problem, and the saved text stays as a copy under a separate key.
purpose:
  uk: "Це крок твого проєкту: модулі, JSON, `try`/`catch` і збереження із цього розділу ти застосовуєш до власного застосунку. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply this unit's modules, JSON, `try`/`catch` and saving to your own app. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Розкласти проєкт на ES-модулі `domain/`, `storage/` і `ui/` з іменованими експортами, лишивши в `app.js` тільки запуск."
    en: "Split the project into the ES modules `domain/`, `storage/` and `ui/` with named exports, leaving only the start in `app.js`."
  - uk: "Зберігати записи після кожної зміни як JSON зі `schemaVersion` і відновлювати їх під час запуску."
    en: "Save the records after every change as JSON with a `schemaVersion` and restore them at start."
  - uk: "Під час завантаження відкидати непрочитні дані й пошкоджені записи з видимим повідомленням, зберігаючи копію збереженого тексту."
    en: "On load, reject unreadable data and damaged records with a visible message while keeping a copy of the saved text."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередні кроки не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
