# Expense tracker variant of step JS-03. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  labelRequiredMessage: { uk: "Вкажи назву витрати", en: "Enter a label for the expense" }
  tooLongMessage: { uk: "Назва задовга: не більше 80 символів", en: "The label is too long: 80 characters at most" }
  # The keys below repeat step JS-02 with identical text (the compiler accepts an identical
  # redefinition). They keep this step compilable when JS-02 is swapped out, as
  # tests/e2e/project.test.mjs does with a synthetic JS-02 in its copy of the content.
  # requiredMessage is the category message; invalidMessage is the amount message.
  secondName: { uk: "Лампочки", en: "Light bulbs" }
  decimalMark: { uk: ",", en: "." }
  currency: { uk: "грн", en: "UAH" }
  draftLabel: { uk: "Таксі", en: "Taxi" }
  requiredMessage: { uk: "Обери категорію", en: "Choose a category" }
  invalidMessage: { uk: "Сума має бути цілим числом копійок більшим за нуль", en: "The amount must be whole kopiykas above zero" }
  firstCheck: { uk: "520,00", en: "520.00" }
  secondCheck: { uk: "99,90", en: "99.90" }
instructions:
  uk: |
    На попередньому кроці код суми й підпису повторився двічі, а перевірка вміла працювати лише з однією чернеткою. Тепер винеси ці правила в **чисті функції**: вони отримують дані й повертають результат — нічого не друкують і не змінюють ні сторінку, ні отримані записи. Оголоси їх у `app.js` на верхньому рівні (не всередині іншої функції чи блоку) з такими самими назвами, як тут.

    1. **`formatAmount(amountMinor)`** повертає суму для показу: цілі гривні, «%%decimalMark%%» і рівно дві цифри копійок — лише це, без валюти й пробілів. Наприклад, `52000` → `%%firstCheck%%`, `9990` → `%%secondCheck%%`, `5` → `0%%decimalMark%%05`.
    2. **`formatExpenseLabel(expense)`** повертає підпис витрати: назву, роздільник на твій смак, суму з `formatAmount` і «%%currency%%». Наприклад: «%%nameValue%% — %%firstCheck%% %%currency%%».
    3. **`validateExpense(input)`** перевіряє чернетку й повертає результат за договором проєкту:
       - `{ ok: true, value }`, коли помилок немає. `value` — **новий** запис із полями `label` (назва без пробілів на краях), `amountMinor`, `date` і `category` з чернетки (дату поки не перевіряй);
       - `{ ok: false, errors }`, коли помилки є. В `errors` — лише поля з проблемами, кожне з **ключем** помилки:

       | Поле | Коли це помилка | Ключ |
       |---|---|---|
       | `label` | після обрізання пробілів назва порожня, або поля `label` немає | `"required"` |
       | `label` | після обрізання пробілів довша за 80 символів | `"too-long"` |
       | `amountMinor` | не ціле число, більше за нуль: `0`, `-100`, `150.5`, текст `"15000"`, `NaN` чи поля немає | `"not-positive-integer"` |
       | `category` | не `"food"`, не `"transport"`, не `"home"` і не `"fun"` — зокрема порожній текст `""` чи поля немає | `"unknown"` |

       Чернетку `input` функція лише читає й не змінює.
    4. **Сторінка.** Код наприкінці `app.js` тепер лише викликає функції й записує результати в ті самі абзаци: підписи двох витрат дає `formatExpenseLabel`, а повідомлення чернетки — ключі з `validateExpense`. Текст для ключа зручно повертати маленькою чистою функцією, наприклад `messageFor(key)`: `"required"` → «%%labelRequiredMessage%%», `"too-long"` → «%%tooLongMessage%%», `"not-positive-integer"` → «%%invalidMessage%%», `"unknown"` → «%%requiredMessage%%», немає ключа → порожній текст `""`. Сторінка має показувати те саме, що й після попереднього кроку.

    **Як перевірятиметься:** платформа викликає твої функції з багатьма різними сумами, витратами й чернетками — великі й малі суми, копійки з нулем попереду, порожня назва, самі пробіли, 80 і 81 символ, кожна категорія й чужі категорії, хибні суми, кілька помилок одразу — і порівнює результати з описом вище. Ще вона перевіряє, що функції нічого не друкують, не змінюють сторінку й отримані записи та для тих самих даних повертають той самий результат, а сторінка показує ті самі підписи й повідомлення.

    Перш ніж перевіряти, виведи через `console.log` результати кількох викликів — для двох-трьох своїх сум і однієї хибної чернетки — і подивись на них на вкладці «Консоль».
  en: |
    In the previous step the amount and label code was repeated twice, and the check could only handle one draft. Now move these rules into **pure functions**: they take data and return a result — they print nothing and change neither the page nor the records they receive. Declare them in `app.js` at the top level (not inside another function or block) with exactly the names used here.

    1. **`formatAmount(amountMinor)`** returns the amount for display: whole hryvnias, “%%decimalMark%%” and exactly two digits of kopiykas — only this, without the currency or spaces. For example, `52000` → `%%firstCheck%%`, `9990` → `%%secondCheck%%`, `5` → `0%%decimalMark%%05`.
    2. **`formatExpenseLabel(expense)`** returns an expense's label: the label, a separator of your choice, the amount from `formatAmount` and “%%currency%%”. For example: “%%nameValue%% — %%firstCheck%% %%currency%%”.
    3. **`validateExpense(input)`** checks a draft and returns a result by the project's contract:
       - `{ ok: true, value }` when there are no problems. `value` is a **new** record with the fields `label` (the label without spaces at the edges), `amountMinor`, `date` and `category` from the draft (do not check the date yet);
       - `{ ok: false, errors }` when there are problems. `errors` holds only the fields with a problem, each with an error **key**:

       | Field | When it is a problem | Key |
       |---|---|---|
       | `label` | empty after trimming the spaces, or there is no `label` field | `"required"` |
       | `label` | longer than 80 characters after trimming the spaces | `"too-long"` |
       | `amountMinor` | not a whole number above zero: `0`, `-100`, `150.5`, the text `"15000"`, `NaN` or no field | `"not-positive-integer"` |
       | `category` | not `"food"`, `"transport"`, `"home"` or `"fun"` — including the empty text `""` or no field | `"unknown"` |

       The function only reads the draft `input` and does not change it.
    4. **The page.** The code at the end of `app.js` now only calls the functions and writes their results into the same paragraphs: `formatExpenseLabel` gives the two expenses' labels, and the keys from `validateExpense` give the draft's messages. A small pure function is handy for the text of a key, for example `messageFor(key)`: `"required"` → “%%labelRequiredMessage%%”, `"too-long"` → “%%tooLongMessage%%”, `"not-positive-integer"` → “%%invalidMessage%%”, `"unknown"` → “%%requiredMessage%%”, no key → the empty text `""`. The page must show the same as after the previous step.

    **How it is checked:** the platform calls your functions with many different amounts, expenses and drafts — large and small amounts, kopiykas with a leading zero, an empty label, only spaces, 80 and 81 characters, every category and foreign ones, bad amounts, several problems at once — and compares the results with the description above. It also checks that the functions print nothing, change neither the page nor the records they receive, and return the same result for the same data, and that the page shows the same labels and messages.

    Before checking, print the results of a few calls with `console.log` — for two or three amounts of your own and one bad draft — and look at them on the “Console” tab.
nudge:
  uk: "Почни з `formatAmount`: перенеси в неї обчислення гривень і копійок, заміни конкретну суму параметром і поверни текст через `return`. Тоді `formatExpenseLabel` лише складає назву, результат `formatAmount` і валюту. Для `validateExpense` пригадай рамку з уроку про валідацію: порожній запис `errors`, перевірки, що додають у нього ключі, і `return` наприкінці. У `switch` кілька гілок `case` можуть ділити спільний код."
  en: "Start with `formatAmount`: move the hryvnia and kopiyka arithmetic into it, replace the specific amount with a parameter and hand the text back with `return`. Then `formatExpenseLabel` only joins the label, the result of `formatAmount` and the currency. For `validateExpense`, recall the frame from the validation lesson: an empty `errors` record, checks that add keys to it, and a `return` at the end. In a `switch`, several `case` branches can share code."
testTitles:
  "the script runs without errors":
    uk: "Скрипт працює без помилок"
    en: "The script runs without errors"
  "the page shows the labels and the draft messages":
    uk: "Сторінка показує ті самі підписи й повідомлення чернетки, що й раніше"
    en: "The page shows the same labels and draft messages as before"
  "formatAmount gives hryvnias and two digits of kopiykas":
    uk: "`formatAmount` дає гривні, «%%decimalMark%%» і дві цифри копійок: `52000` → `%%firstCheck%%`"
    en: "`formatAmount` gives hryvnias, “%%decimalMark%%” and two digits of kopiykas: `52000` → `%%firstCheck%%`"
  "formatAmount keeps a leading zero in small amounts":
    uk: "`formatAmount` пише нуль перед копійками, коли їх менше десяти: `5` → `0%%decimalMark%%05`"
    en: "`formatAmount` writes a zero before fewer than ten kopiykas: `5` → `0%%decimalMark%%05`"
  "formatExpenseLabel returns the label, the amount and the currency":
    uk: "`formatExpenseLabel` повертає текст із назвою, сумою й «%%currency%%»"
    en: "`formatExpenseLabel` returns text with the label, the amount and “%%currency%%”"
  "validateExpense accepts a valid expense and trims its label":
    uk: "`validateExpense` приймає правильну чернетку й обрізає пробіли в назві"
    en: "`validateExpense` accepts a valid draft and trims the spaces of the label"
  "validateExpense accepts every category of the list":
    uk: "`validateExpense` приймає кожну категорію зі списку"
    en: "`validateExpense` accepts every category of the list"
  "validateExpense requires a label":
    uk: "`validateExpense` дає `\"required\"` для порожньої, пробільної чи відсутньої назви"
    en: "`validateExpense` gives `\"required\"` for an empty, blank or missing label"
  "validateExpense rejects a label longer than 80 characters":
    uk: "`validateExpense` дає `\"too-long\"` для назви понад 80 символів"
    en: "`validateExpense` gives `\"too-long\"` for a label over 80 characters"
  "validateExpense rejects an amount that is not a positive whole number":
    uk: "`validateExpense` дає `\"not-positive-integer\"` для суми, що не є цілим числом більшим за нуль"
    en: "`validateExpense` gives `\"not-positive-integer\"` for an amount that is not a whole number above zero"
  "validateExpense rejects a category outside the list":
    uk: "`validateExpense` дає `\"unknown\"` для категорії поза списком"
    en: "`validateExpense` gives `\"unknown\"` for a category outside the list"
  "validateExpense lists every field with a problem and only those":
    uk: "`errors` містить кожне поле з проблемою — і лише такі поля"
    en: "`errors` holds every field with a problem — and only those fields"
  "the functions only return values":
    uk: "Функції лише повертають значення: нічого не друкують і не змінюють сторінку чи отримані записи"
    en: "The functions only return values: they print nothing and change neither the page nor the records they get"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що скрипт виконається до кінця без помилки; інакше не проходять і перевірки сторінки. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль». Якщо там `ReferenceError`, то скрипт звертається до назви, якої не знає: звір написання з оголошенням і те, що змінну, оголошену через `const`, використано нижче за її оголошення."
      en: "This check expects the script to run to the end without an error; otherwise the page checks fail too. The “Console” tab shows the error name and the line of code where it happened. If it shows `ReferenceError`, the script uses a name it does not know: compare the spelling with the declaration, and check that a variable declared with `const` is used below its declaration."
  - when: { test: "the page shows the labels and the draft messages" }
    message:
      uk: "Ця перевірка чекає на сторінці те саме, що й після попереднього кроку: підписи «%%nameValue%%» і «%%secondName%%» із сумами й «%%currency%%» та обидва повідомлення чернетки. Їх записують рядки коду наприкінці `app.js` — у ті самі абзаци з `id`."
      en: "This check expects the page to show the same as after the previous step: the labels of “%%nameValue%%” and “%%secondName%%” with their amounts and “%%currency%%”, and both draft messages. The lines of code at the end of `app.js` write them into the same paragraphs with `id`s."
  - when: { test: "formatAmount gives hryvnias and two digits of kopiykas" }
    message:
      uk: "Ця перевірка чекає від `formatAmount` лише суму — без валюти й пробілів, наприклад `%%firstCheck%%` для `52000`. Якщо в повідомленні перевірки `scope.formatAmount is not a function`, то функції з такою назвою немає на верхньому рівні `app.js`. Якщо функція повертає `undefined`, у ній не виконується `return`."
      en: "This check expects `formatAmount` to return only the amount — no currency and no spaces, for example `%%firstCheck%%` for `52000`. If the check's message says `scope.formatAmount is not a function`, there is no function with this name at the top level of `app.js`. If the function returns `undefined`, no `return` runs in it."
  - when: { test: "formatAmount keeps a leading zero in small amounts" }
    message:
      uk: "Ця перевірка чекає дві цифри копійок і для малих сум: `5` → `0%%decimalMark%%05`, `100` → `1%%decimalMark%%00`, `1009` → `10%%decimalMark%%09`, `0` → `0%%decimalMark%%00`. Сума, менша за `100`, дає `0` гривень."
      en: "This check expects two digits of kopiykas for small amounts too: `5` → `0%%decimalMark%%05`, `100` → `1%%decimalMark%%00`, `1009` → `10%%decimalMark%%09`, `0` → `0%%decimalMark%%00`. An amount below `100` gives `0` hryvnias."
  - when: { test: "formatExpenseLabel returns the label, the amount and the currency" }
    message:
      uk: "Ця перевірка чекає підпис, у якому йдуть назва витрати, сума так, як її повертає `formatAmount`, і «%%currency%%» — саме в такому порядку."
      en: "This check expects a label with the expense label, the amount as `formatAmount` returns it, and “%%currency%%” — in this order."
  - when: { test: "validateExpense accepts a valid expense and trims its label" }
    message:
      uk: "Ця перевірка чекає для правильної чернетки `{ ok: true, value }`, де `value.label` — назва без пробілів на краях, а `amountMinor`, `date` і `category` — значення з чернетки. Назва рівно з 80 символів і сума `1` — правильні."
      en: "This check expects `{ ok: true, value }` for a valid draft, where `value.label` is the label without spaces at the edges and `amountMinor`, `date` and `category` come from the draft. A label of exactly 80 characters and an amount of `1` are valid."
  - when: { test: "validateExpense accepts every category of the list" }
    message:
      uk: "Ця перевірка чекає `ok: true` для кожної з чотирьох категорій: `\"food\"`, `\"transport\"`, `\"home\"` і `\"fun\"`."
      en: "This check expects `ok: true` for each of the four categories: `\"food\"`, `\"transport\"`, `\"home\"` and `\"fun\"`."
  - when: { test: "validateExpense requires a label" }
    message:
      uk: "Ця перевірка чекає `errors.label` — `\"required\"` для назви `\"\"`, для назви з самих пробілів і для чернетки без поля `label`. Якщо бачиш `TypeError` про `trim`, то `.trim()` викликано для `undefined`: у чернетки без поля `label` немає тексту, який можна обрізати."
      en: "This check expects `errors.label` to be `\"required\"` for the label `\"\"`, for a label of only spaces and for a draft without a `label` field. If you see a `TypeError` about `trim`, `.trim()` was called on `undefined`: a draft without a `label` field has no text to trim."
  - when: { test: "validateExpense rejects a label longer than 80 characters" }
    message:
      uk: "Ця перевірка чекає `\"too-long\"` для назви з 81 символу, але приймає назву з 80 символів і пробілами на краях: довжину (`.length`) порівнюють уже після обрізання пробілів."
      en: "This check expects `\"too-long\"` for a label of 81 characters, but accepts a label of 80 characters with spaces at the edges: the length (`.length`) is compared after the spaces are trimmed."
  - when: { test: "validateExpense rejects an amount that is not a positive whole number" }
    message:
      uk: "Ця перевірка чекає `errors.amountMinor` — `\"not-positive-integer\"` для `0`, `-100`, `150.5`, тексту `\"15000\"`, `NaN` і чернетки без суми. Правильна сума — число, не `NaN`, більше за нуль і без дробової частини."
      en: "This check expects `errors.amountMinor` to be `\"not-positive-integer\"` for `0`, `-100`, `150.5`, the text `\"15000\"`, `NaN` and a draft without an amount. A valid amount is a number, not `NaN`, above zero and without a fractional part."
  - when: { test: "validateExpense rejects a category outside the list" }
    message:
      uk: "Ця перевірка чекає `errors.category` — `\"unknown\"` для порожнього тексту `\"\"`, `\"travel\"`, `\"Food\"` і чернетки без категорії: порівняння строге, і великі літери теж важать."
      en: "This check expects `errors.category` to be `\"unknown\"` for the empty text `\"\"`, `\"travel\"`, `\"Food\"` and a draft without a category: the comparison is strict, and capital letters matter too."
  - when: { test: "validateExpense lists every field with a problem and only those" }
    message:
      uk: "Ця перевірка чекає в `errors` ключі всіх полів із проблемами — для порожньої назви, суми `0` і порожньої категорії всі три — і жодного поля без проблеми, навіть із порожнім текстом. Якщо бачиш не всі ключі, перевірка наступних полів не виконується після першої знайденої помилки."
      en: "This check expects `errors` to hold the keys of all fields with a problem — all three for an empty label, the amount `0` and an empty category — and no field without a problem, not even with empty text. If you see only some of the keys, the later fields are not checked after the first problem is found."
  - when: { test: "the functions only return values" }
    message:
      uk: "Ця перевірка викликає функції з новими даними й чекає, що нічого не надруковано, сторінка й отримані записи не змінилися, а повторний виклик повертає той самий результат. Якщо щось змінилося, шукай у функціях `console.log`, рядки коду з `document` і присвоєння полям отриманого запису."
      en: "This check calls the functions with new data and expects that nothing is printed, the page and the received records stay unchanged, and a second call returns the same result. If something changed, look in the functions for `console.log`, lines of code with `document` and assignments to fields of the received record."
