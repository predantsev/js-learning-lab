# Capstone step of unit JS-03 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-03-11-capstone-extract-functions from this file.
unit: JS-03
mode: in-platform
entry: index.html
title:
  uk: "Чисті функції домену"
  en: "Pure domain functions"
intro:
  uk: |
    На попередньому кроці код підпису повторився для двох записів, а перевірка вміла працювати лише з однією чернеткою. Тепер ти [[extract-function|виносиш цей код у функції]]: правило записується один раз, а викликати його можна для будь-якого запису.

    Функції домену — [[pure-function|чисті]]. Функція підпису отримує запис і повертає текст. Функція перевірки отримує чернетку й повертає результат за договором проєкту: `{ ok: true, value }` з очищеними даними або `{ ok: false, errors }` з ключем помилки для кожного поля з проблемою. Жодна з них нічого не друкує, не змінює сторінку й не змінює запис, який отримала. Ці [[side-effect|побічні ефекти]] залишаються в кількох рядках наприкінці `app.js`: вони викликають функції й записують результати на сторінку.

    Чисті функції легко перевірити — і платформа так і робить: викликає твої функції з десятками різних записів, а не лише з тими, що на сторінці. Ті самі функції ти візьмеш із собою в наступні розділи.
  en: |
    In the previous step the label code was repeated for two records, and the check could only handle one draft. Now you [[extract-function|move this code into functions]]: a rule is written once and can be called for any record.

    The domain functions are [[pure-function|pure]]. The label function takes a record and returns text. The check function takes a draft and returns a result by the project's contract: `{ ok: true, value }` with the cleaned data, or `{ ok: false, errors }` with an error key for every field that has a problem. Neither of them prints anything, changes the page or changes the record it received. These [[side-effect|side effects]] stay in a few lines at the end of `app.js`: they call the functions and write the results onto the page.

    Pure functions are easy to check — and the platform does exactly that: it calls your functions with dozens of different records, not only the ones on the page. You take the same functions along into the next units.
purpose:
  uk: "Це крок твого проєкту: функції, область видимості й чистоту із цього розділу ти застосовуєш до власного коду — правила проєкту стають функціями, які можна перевірити й перевикористати. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply this unit's functions, scope and purity to your own code — the project's rules become functions you can check and reuse. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Винести код підпису в чисту функцію, яка отримує запис і повертає текст, нічого не друкує й не змінює ні сторінку, ні запис."
    en: "Move the label code into a pure function that takes a record and returns text, without printing anything or changing the page or the record."
  - uk: "Написати функцію перевірки, яка повертає `{ ok: true, value }` з очищеними даними або `{ ok: false, errors }` з ключем помилки для кожного поля з проблемою."
    en: "Write a check function that returns `{ ok: true, value }` with the cleaned data or `{ ok: false, errors }` with an error key for every field that has a problem."
  - uk: "Залишити на сторінці лише виклики функцій і запис їхніх результатів так, щоб сторінка показувала те саме, що й раніше."
    en: "Leave only the function calls and the writing of their results on the page side, so that the page shows the same as before."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередні кроки не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
