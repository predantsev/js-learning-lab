# Planner variant of step JS-03. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  priorityLow: { uk: "низький", en: "low" }
  priorityNormal: { uk: "звичайний", en: "normal" }
  priorityHigh: { uk: "високий", en: "high" }
  tooLongMessage: { uk: "Назва задовга: не більше 80 символів", en: "The title is too long: 80 characters at most" }
  # The keys below repeat step JS-02 with identical text (the compiler accepts an identical
  # redefinition). They keep this step compilable when JS-02 is swapped out, as
  # tests/e2e/project.test.mjs does with a synthetic JS-02 in its copy of the content.
  secondName: { uk: "Написати бабусі", en: "Write to grandma" }
  noDueDate: { uk: "без терміну", en: "no due date" }
  requiredMessage: { uk: "Вкажи назву справи", en: "Enter a title for the task" }
  invalidMessage: { uk: "Невідомий пріоритет", en: "Unknown priority" }
  firstCheck: { uk: "2026-03-02", en: "2026-03-02" }
  secondCheck: { uk: "без терміну", en: "no due date" }
instructions:
  uk: |
    На попередньому кроці код підпису повторився двічі, а перевірка вміла працювати лише з однією чернеткою. Тепер винеси ці правила в **чисті функції**: вони отримують дані й повертають результат — нічого не друкують і не змінюють ні сторінку, ні отримані записи. Оголоси їх у `app.js` на верхньому рівні (не всередині іншої функції чи блоку) з такими самими назвами, як тут.

    1. **`formatTaskLabel(task)`** повертає підпис справи: назву, термін у дужках (або «%%noDueDate%%», коли терміну немає — `null`) і пріоритет словом: `"low"` → «%%priorityLow%%», `"normal"` → «%%priorityNormal%%», `"high"` → «%%priorityHigh%%». Наприклад: «%%nameValue%% (2026-03-02) · %%priorityNormal%%». Роздільник між частинами обери сам.
    2. **`validateTask(input)`** перевіряє чернетку й повертає результат за договором проєкту:
       - `{ ok: true, value }`, коли помилок немає. `value` — **новий** запис із полями `title` (назва без пробілів на краях), `dueDate` (термін або `null`, якщо його немає) і `priority`. Якщо пріоритету немає (`null` чи поля немає взагалі), він стає `"normal"`;
       - `{ ok: false, errors }`, коли помилки є. В `errors` — лише поля з проблемами, кожне з **ключем** помилки:

       | Поле | Коли це помилка | Ключ |
       |---|---|---|
       | `title` | після обрізання пробілів назва порожня, або поля `title` немає | `"required"` |
       | `title` | після обрізання пробілів довша за 80 символів | `"too-long"` |
       | `priority` | не `"low"`, не `"normal"` і не `"high"` (великі й малі літери важать) | `"unknown"` |

       Чернетку `input` функція лише читає й не змінює.
    3. **Сторінка.** Код наприкінці `app.js` тепер лише викликає функції й записує результати в ті самі абзаци: підписи двох справ дає `formatTaskLabel`, а повідомлення чернетки — ключі з `validateTask`. Текст для ключа зручно повертати маленькою чистою функцією, наприклад `messageFor(key)`: `"required"` → «%%requiredMessage%%», `"too-long"` → «%%tooLongMessage%%», `"unknown"` → «%%invalidMessage%%», немає ключа → порожній текст `""`. Підписи тепер довші — з пріоритетом, а повідомлення лишаються ті самі.

    **Як перевірятиметься:** платформа викликає твої функції з багатьма різними справами й чернетками — порожня назва, самі пробіли, 80 і 81 символ, справа без терміну, кожен пріоритет, `"urgent"`, `"HIGH"`, відсутній пріоритет, кілька помилок одразу — і порівнює результати з описом вище. Ще вона перевіряє, що функції нічого не друкують, не змінюють сторінку й отримані записи та для тих самих даних повертають той самий результат, а сторінка показує підписи й повідомлення.

    Перш ніж перевіряти, виведи через `console.log` результати кількох викликів — для двох-трьох своїх справ і однієї хибної чернетки — і подивись на них на вкладці «Консоль».
  en: |
    In the previous step the label code was repeated twice, and the check could only handle one draft. Now move these rules into **pure functions**: they take data and return a result — they print nothing and change neither the page nor the records they receive. Declare them in `app.js` at the top level (not inside another function or block) with exactly the names used here.

    1. **`formatTaskLabel(task)`** returns a task's label: the title, the due date in brackets (or “%%noDueDate%%” when there is no due date — `null`) and the priority as a word: `"low"` → “%%priorityLow%%”, `"normal"` → “%%priorityNormal%%”, `"high"` → “%%priorityHigh%%”. For example: “%%nameValue%% (2026-03-02) · %%priorityNormal%%”. Choose the separator between the parts yourself.
    2. **`validateTask(input)`** checks a draft and returns a result by the project's contract:
       - `{ ok: true, value }` when there are no problems. `value` is a **new** record with the fields `title` (the title without spaces at the edges), `dueDate` (the due date, or `null` when there is none) and `priority`. When there is no priority (`null` or no field at all), it becomes `"normal"`;
       - `{ ok: false, errors }` when there are problems. `errors` holds only the fields with a problem, each with an error **key**:

       | Field | When it is a problem | Key |
       |---|---|---|
       | `title` | empty after trimming the spaces, or there is no `title` field | `"required"` |
       | `title` | longer than 80 characters after trimming the spaces | `"too-long"` |
       | `priority` | not `"low"`, `"normal"` or `"high"` (upper and lower case matter) | `"unknown"` |

       The function only reads the draft `input` and does not change it.
    3. **The page.** The code at the end of `app.js` now only calls the functions and writes their results into the same paragraphs: `formatTaskLabel` gives the two tasks' labels, and the keys from `validateTask` give the draft's messages. A small pure function is handy for the text of a key, for example `messageFor(key)`: `"required"` → “%%requiredMessage%%”, `"too-long"` → “%%tooLongMessage%%”, `"unknown"` → “%%invalidMessage%%”, no key → the empty text `""`. The labels are now longer — with the priority — and the messages stay the same.

    **How it is checked:** the platform calls your functions with many different tasks and drafts — an empty title, only spaces, 80 and 81 characters, a task without a due date, every priority, `"urgent"`, `"HIGH"`, a missing priority, several problems at once — and compares the results with the description above. It also checks that the functions print nothing, change neither the page nor the records they receive, and return the same result for the same data, and that the page shows the labels and the messages.

    Before checking, print the results of a few calls with `console.log` — for two or three tasks of your own and one bad draft — and look at them on the “Console” tab.
nudge:
  uk: "Почни з `formatTaskLabel`: перенеси в неї код, що складав підпис, заміни конкретну справу параметром і поверни текст через `return`. Слово для пріоритету зручно обирати окремою маленькою функцією зі `switch`. Для `validateTask` пригадай рамку з уроку про валідацію: порожній запис `errors`, перевірки, що додають у нього ключі, і `return` наприкінці. Відсутнє поле читається як `undefined` — згадай, як отримати запасне значення."
  en: "Start with `formatTaskLabel`: move the code that built the label into it, replace the specific task with a parameter and hand the text back with `return`. A small separate function with a `switch` is handy for the priority word. For `validateTask`, recall the frame from the validation lesson: an empty `errors` record, checks that add keys to it, and a `return` at the end. A missing field reads as `undefined` — recall how to get a fallback value."
testTitles:
  "the script runs without errors":
    uk: "Код у `app.js` працює без помилок"
    en: "The script runs without errors"
  "the page shows the labels and the draft messages":
    uk: "Сторінка показує підписи двох справ і повідомлення чернетки"
    en: "The page shows the two tasks' labels and the draft messages"
  "formatTaskLabel returns the title and the due date":
    uk: "`formatTaskLabel` повертає текст із назвою й терміном"
    en: "`formatTaskLabel` returns text with the title and the due date"
  "formatTaskLabel uses the no-due-date text for a missing due date":
    uk: "`formatTaskLabel` пише «%%noDueDate%%», коли термін `null`"
    en: "`formatTaskLabel` writes “%%noDueDate%%” when the due date is `null`"
  "formatTaskLabel names the priority in words":
    uk: "`formatTaskLabel` називає пріоритет словом: «%%priorityLow%%», «%%priorityNormal%%» чи «%%priorityHigh%%»"
    en: "`formatTaskLabel` names the priority as a word: “%%priorityLow%%”, “%%priorityNormal%%” or “%%priorityHigh%%”"
  "validateTask accepts a valid task and trims its title":
    uk: "`validateTask` приймає правильну чернетку й обрізає пробіли в назві"
    en: "`validateTask` accepts a valid draft and trims the spaces of the title"
  "validateTask fills in the defaults":
    uk: "`validateTask` дає `priority: \"normal\"` і `dueDate: null`, коли їх немає"
    en: "`validateTask` gives `priority: \"normal\"` and `dueDate: null` when they are missing"
  "validateTask requires a title":
    uk: "`validateTask` дає `\"required\"` для порожньої, пробільної чи відсутньої назви"
    en: "`validateTask` gives `\"required\"` for an empty, blank or missing title"
  "validateTask rejects a title longer than 80 characters":
    uk: "`validateTask` дає `\"too-long\"` для назви понад 80 символів"
    en: "`validateTask` gives `\"too-long\"` for a title over 80 characters"
  "validateTask rejects an unknown priority":
    uk: "`validateTask` дає `\"unknown\"` для пріоритету поза `low`, `normal` і `high`"
    en: "`validateTask` gives `\"unknown\"` for a priority other than `low`, `normal` and `high`"
  "validateTask lists every field with a problem and only those":
    uk: "`errors` містить кожне поле з проблемою — і лише такі поля"
    en: "`errors` holds every field with a problem — and only those fields"
  "the functions only return values":
    uk: "Функції лише повертають значення: нічого не друкують і не змінюють сторінку чи отримані записи"
    en: "The functions only return values: they print nothing and change neither the page nor the records they get"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки; інакше не проходять і перевірки сторінки. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль». Якщо там `ReferenceError`, то код звертається до назви, якої не знає: звір написання з оголошенням і те, що змінну, оголошену через `const`, використано нижче за її оголошення."
      en: "This check expects the script to run to the end without an error; otherwise the page checks fail too. The “Console” tab shows the error name and the line of code where it happened. If it shows `ReferenceError`, the script uses a name it does not know: compare the spelling with the declaration, and check that a variable declared with `const` is used below its declaration."
  - when: { test: "the page shows the labels and the draft messages" }
    message:
      uk: "Ця перевірка чекає на сторінці підписи «%%nameValue%%» (з терміном `2026-03-02`) і «%%secondName%%» (з «%%noDueDate%%») та обидва повідомлення чернетки. Їх записують рядки коду наприкінці `app.js` — у ті самі абзаци з `id`."
      en: "This check expects the page to show the labels of “%%nameValue%%” (with the due date `2026-03-02`) and “%%secondName%%” (with “%%noDueDate%%”) and both draft messages. The lines of code at the end of `app.js` write them into the same paragraphs with `id`s."
  - when: { test: "formatTaskLabel returns the title and the due date" }
    message:
      uk: "Ця перевірка викликає `formatTaskLabel` зі справою й чекає текст, у якому після назви стоїть термін. Якщо в повідомленні перевірки `scope.formatTaskLabel is not a function`, то функції з такою назвою немає на верхньому рівні `app.js`. Якщо функція повертає `undefined`, у ній не виконується `return`: `console.log` лише друкує."
      en: "This check calls `formatTaskLabel` with a task and expects text with the due date after the title. If the check's message says `scope.formatTaskLabel is not a function`, there is no function with this name at the top level of `app.js`. If the function returns `undefined`, no `return` runs in it: `console.log` only prints."
  - when: { test: "formatTaskLabel uses the no-due-date text for a missing due date" }
    message:
      uk: "Ця перевірка чекає «%%noDueDate%%» у підписі справи з `dueDate: null`. Якщо там `null`, то `??` отримав увесь складений текст, а не термін: `+` виконується раніше за `??`."
      en: "This check expects “%%noDueDate%%” in the label of a task with `dueDate: null`. If it shows `null`, `??` received the whole joined text instead of the due date: `+` runs before `??`."
  - when: { test: "formatTaskLabel names the priority in words" }
    message:
      uk: "Ця перевірка чекає для кожного пріоритету саме його слово й жодного іншого. Якщо для `\"low\"` з’являється й інше слово, виконання провалюється з гілки `\"low\"` у наступну гілку `switch`."
      en: "This check expects exactly its own word for every priority and no other. If `\"low\"` also gets another word, execution falls through from the `\"low\"` branch into the next branch of the `switch`."
  - when: { test: "validateTask accepts a valid task and trims its title" }
    message:
      uk: "Ця перевірка чекає для правильної чернетки `{ ok: true, value }`, де `value.title` — назва без пробілів на краях, а `value.dueDate` і `value.priority` — значення із чернетки. Назва рівно з 80 символів — правильна."
      en: "This check expects `{ ok: true, value }` for a valid draft, where `value.title` is the title without spaces at the edges and `value.dueDate` and `value.priority` come from the draft. A title of exactly 80 characters is valid."
  - when: { test: "validateTask fills in the defaults" }
    message:
      uk: "Ця перевірка чекає для чернетки без пріоритету `value.priority` — `\"normal\"`, а без терміну — `value.dueDate` — `null`, як записано в договорі проєкту. Відсутнє поле читається як `undefined`."
      en: "This check expects `value.priority` to be `\"normal\"` for a draft without a priority, and `value.dueDate` to be `null` for one without a due date, as the project's contract says. A missing field reads as `undefined`."
  - when: { test: "validateTask requires a title" }
    message:
      uk: "Ця перевірка чекає `errors.title` — `\"required\"` для назви `\"\"`, для назви із самих пробілів і для чернетки без поля `title`. Якщо бачиш `TypeError` про `trim`, то `.trim()` викликано для `undefined`: у чернетки без поля `title` немає тексту, який можна обрізати."
      en: "This check expects `errors.title` to be `\"required\"` for the title `\"\"`, for a title of only spaces and for a draft without a `title` field. If you see a `TypeError` about `trim`, `.trim()` was called on `undefined`: a draft without a `title` field has no text to trim."
  - when: { test: "validateTask rejects a title longer than 80 characters" }
    message:
      uk: "Ця перевірка чекає `\"too-long\"` для назви з 81 символу, але приймає назву з 80 символів і пробілами на краях: довжину (`.length`) порівнюють уже після обрізання пробілів."
      en: "This check expects `\"too-long\"` for a title of 81 characters, but accepts a title of 80 characters with spaces at the edges: the length (`.length`) is compared after the spaces are trimmed."
  - when: { test: "validateTask rejects an unknown priority" }
    message:
      uk: "Ця перевірка чекає `errors.priority` — `\"unknown\"` для `\"urgent\"`, `\"HIGH\"` і порожнього тексту `\"\"`: порівняння строге. Лише `null` і відсутній пріоритет стають `\"normal\"`."
      en: "This check expects `errors.priority` to be `\"unknown\"` for `\"urgent\"`, `\"HIGH\"` and the empty text `\"\"`: the comparison is strict. Only `null` and a missing priority become `\"normal\"`."
  - when: { test: "validateTask lists every field with a problem and only those" }
    message:
      uk: "Ця перевірка чекає в `errors` ключі всіх полів із проблемами — для порожньої назви й пріоритету `\"urgent\"` обидва — і жодного поля без проблеми, навіть із порожнім текстом. Якщо бачиш лише один ключ, перевірка другого поля не виконується після першої знайденої помилки."
      en: "This check expects `errors` to hold the keys of all fields with a problem — both for an empty title and the priority `\"urgent\"` — and no field without a problem, not even with empty text. If you see only one key, the second field is not checked after the first problem is found."
  - when: { test: "the functions only return values" }
    message:
      uk: "Ця перевірка викликає функції з новими даними й чекає, що нічого не надруковано, сторінка й отримані записи не змінилися, а повторний виклик повертає той самий результат. Якщо щось змінилося, шукай у функціях `console.log`, рядки коду з `document` і присвоєння полям отриманого запису."
      en: "This check calls the functions with new data and expects that nothing is printed, the page and the received records stay unchanged, and a second call returns the same result. If something changed, look in the functions for `console.log`, lines of code with `document` and assignments to fields of the received record."
