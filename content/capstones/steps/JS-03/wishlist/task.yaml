# Wishlist variant of step JS-03. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  acquiredMark: { uk: "отримано", en: "acquired" }
  tooLongMessage: { uk: "Назва задовга: не більше 80 символів", en: "The name is too long: 80 characters at most" }
  notNumberMessage: { uk: "Ціна має бути числом", en: "The price must be a number" }
  # The keys below repeat step JS-02 with identical text (the compiler accepts an identical
  # redefinition). They keep this step compilable when JS-02 is swapped out, as
  # tests/e2e/project.test.mjs does with a synthetic JS-02 in its copy of the content.
  firstCategory: { uk: "Техніка", en: "Tech" }
  secondName: { uk: "Квитки на концерт", en: "Concert tickets" }
  noPrice: { uk: "без ціни", en: "no price" }
  requiredMessage: { uk: "Вкажи назву бажання", en: "Enter a name for the wish" }
  invalidMessage: { uk: "Ціна не може бути меншою за нуль", en: "The price cannot be below zero" }
  firstCheck: { uk: "80", en: "80" }
  secondCheck: { uk: "без ціни", en: "no price" }
instructions:
  uk: |
    На попередньому кроці код підпису повторився двічі, а перевірка вміла працювати лише з однією чернеткою. Тепер винеси ці правила в **чисті функції**: вони отримують дані й повертають результат — нічого не друкують і не змінюють ні сторінку, ні отримані записи. Оголоси їх у `app.js` на верхньому рівні (не всередині іншої функції чи блоку) з такими самими назвами, як тут.

    1. **`formatItemLabel(item)`** повертає підпис бажання: назву, роздільник на твій смак і ціну, а коли ціни немає (`null`), — «%%noPrice%%». Ціна `0` — справжня ціна, а не «%%noPrice%%». Якщо бажання вже отримане (`acquired` — `true`), у кінці підпису стоїть позначка «%%acquiredMark%%».
    2. **`validateItem(input)`** перевіряє чернетку й повертає результат за договором проєкту:
       - `{ ok: true, value }`, коли помилок немає. `value` — **новий** запис із полями `name` (назва без пробілів на краях) і `price` (`null`, якщо ціна `null` або поля `price` немає взагалі);
       - `{ ok: false, errors }`, коли помилки є. В `errors` — лише поля з проблемами, кожне з **ключем** помилки:

       | Поле | Коли це помилка | Ключ |
       |---|---|---|
       | `name` | після обрізання пробілів назва порожня, або поля `name` немає | `"required"` |
       | `name` | після обрізання пробілів довша за 80 символів | `"too-long"` |
       | `price` | не число, наприклад текст `"45"` чи `NaN` | `"not-a-number"` |
       | `price` | число, менше за нуль | `"negative"` |

       Чернетку `input` функція лише читає й не змінює.
    3. **Сторінка.** Код наприкінці `app.js` тепер лише викликає функції й записує результати в ті самі абзаци: підписи двох бажань дає `formatItemLabel`, а повідомлення чернетки — ключі з `validateItem`. Текст для ключа зручно повертати маленькою чистою функцією, наприклад `messageFor(key)`: `"required"` → «%%requiredMessage%%», `"too-long"` → «%%tooLongMessage%%», `"not-a-number"` → «%%notNumberMessage%%», `"negative"` → «%%invalidMessage%%», немає ключа → порожній текст `""`. Сторінка має показувати те саме, що й після попереднього кроку.

    **Як перевірятиметься:** платформа викликає твої функції з багатьма різними бажаннями й чернетками — порожня назва, самі пробіли, 80 і 81 символ, ціна `0`, `null`, `-1`, `"45"`, кілька помилок одразу — і порівнює результати з описом вище. Ще вона перевіряє, що функції нічого не друкують, не змінюють сторінку й отримані записи та для тих самих даних повертають той самий результат, а сторінка показує ті самі підписи й повідомлення.

    Перш ніж перевіряти, виведи через `console.log` результати кількох викликів — для двох-трьох своїх бажань і однієї хибної чернетки — і подивись на них на вкладці «Консоль».
  en: |
    In the previous step the label code was repeated twice, and the check could only handle one draft. Now move these rules into **pure functions**: they take data and return a result — they print nothing and change neither the page nor the records they receive. Declare them in `app.js` at the top level (not inside another function or block) with exactly the names used here.

    1. **`formatItemLabel(item)`** returns a wish's label: the name, a separator of your choice and the price, or “%%noPrice%%” when there is no price (`null`). A price of `0` is a real price, not “%%noPrice%%”. When the wish is already acquired (`acquired` is `true`), the label ends with the mark “%%acquiredMark%%”.
    2. **`validateItem(input)`** checks a draft and returns a result by the project's contract:
       - `{ ok: true, value }` when there are no problems. `value` is a **new** record with the fields `name` (the name without spaces at the edges) and `price` (`null` when the price is `null` or there is no `price` field at all);
       - `{ ok: false, errors }` when there are problems. `errors` holds only the fields with a problem, each with an error **key**:

       | Field | When it is a problem | Key |
       |---|---|---|
       | `name` | empty after trimming the spaces, or there is no `name` field | `"required"` |
       | `name` | longer than 80 characters after trimming the spaces | `"too-long"` |
       | `price` | not a number, for example the text `"45"` or `NaN` | `"not-a-number"` |
       | `price` | a number below zero | `"negative"` |

       The function only reads the draft `input` and does not change it.
    3. **The page.** The code at the end of `app.js` now only calls the functions and writes their results into the same paragraphs: `formatItemLabel` gives the two wishes' labels, and the keys from `validateItem` give the draft's messages. A small pure function is handy for the text of a key, for example `messageFor(key)`: `"required"` → “%%requiredMessage%%”, `"too-long"` → “%%tooLongMessage%%”, `"not-a-number"` → “%%notNumberMessage%%”, `"negative"` → “%%invalidMessage%%”, no key → the empty text `""`. The page must show the same as after the previous step.

    **How it is checked:** the platform calls your functions with many different wishes and drafts — an empty name, only spaces, 80 and 81 characters, a price of `0`, `null`, `-1`, `"45"`, several problems at once — and compares the results with the description above. It also checks that the functions print nothing, change neither the page nor the records they receive, and return the same result for the same data, and that the page shows the same labels and messages.

    Before checking, print the results of a few calls with `console.log` — for two or three wishes of your own and one bad draft — and look at them on the “Console” tab.
nudge:
  uk: "Почни з `formatItemLabel`: перенеси в неї код, що складав підпис, заміни конкретне бажання параметром і поверни текст через `return`. Для `validateItem` пригадай рамку з уроку про валідацію: порожній запис `errors`, перевірки, що додають у нього ключі, і `return` наприкінці. Чернетка без поля `name` дає `undefined`, а в `undefined` немає `.trim()` — згадай, як отримати запасне значення."
  en: "Start with `formatItemLabel`: move the code that built the label into it, replace the specific wish with a parameter and hand the text back with `return`. For `validateItem`, recall the frame from the validation lesson: an empty `errors` record, checks that add keys to it, and a `return` at the end. A draft without a `name` field gives `undefined`, and `undefined` has no `.trim()` — recall how to get a fallback value."
testTitles:
  "the script runs without errors":
    uk: "Код у `app.js` працює без помилок"
    en: "The script runs without errors"
  "formatItemLabel returns the name and the price":
    uk: "`formatItemLabel` повертає текст із назвою й ціною"
    en: "`formatItemLabel` returns text with the name and the price"
  "formatItemLabel uses the no-price text only for a missing price":
    uk: "`formatItemLabel` пише «%%noPrice%%» лише тоді, коли ціна `null`, а не для ціни `0`"
    en: "`formatItemLabel` writes “%%noPrice%%” only when the price is `null`, not for a price of `0`"
  "formatItemLabel marks acquired wishes":
    uk: "`formatItemLabel` додає «%%acquiredMark%%» лише отриманим бажанням"
    en: "`formatItemLabel` adds “%%acquiredMark%%” to acquired wishes only"
  "validateItem accepts a valid wish and trims its name":
    uk: "`validateItem` приймає правильну чернетку й обрізає пробіли в назві"
    en: "`validateItem` accepts a valid draft and trims the spaces of the name"
  "validateItem turns a missing price into null":
    uk: "`validateItem` дає `price: null`, коли ціни немає"
    en: "`validateItem` gives `price: null` when there is no price"
  "validateItem requires a name":
    uk: "`validateItem` дає `\"required\"` для порожньої, пробільної чи відсутньої назви"
    en: "`validateItem` gives `\"required\"` for an empty, blank or missing name"
  "validateItem rejects a name longer than 80 characters":
    uk: "`validateItem` дає `\"too-long\"` для назви понад 80 символів"
    en: "`validateItem` gives `\"too-long\"` for a name over 80 characters"
  "validateItem rejects a negative price":
    uk: "`validateItem` дає `\"negative\"` для ціни, меншої за нуль"
    en: "`validateItem` gives `\"negative\"` for a price below zero"
  "validateItem rejects a price that is not a number":
    uk: "`validateItem` дає `\"not-a-number\"` для ціни-тексту й `NaN`"
    en: "`validateItem` gives `\"not-a-number\"` for a text price and `NaN`"
  "validateItem lists every field with a problem and only those":
    uk: "`errors` містить кожне поле з проблемою — і лише такі поля"
    en: "`errors` holds every field with a problem — and only those fields"
  "the functions only return values":
    uk: "Функції лише повертають значення: нічого не друкують і не змінюють сторінку чи отримані записи"
    en: "The functions only return values: they print nothing and change neither the page nor the records they get"
  "the page shows the labels and the draft messages":
    uk: "Сторінка показує ті самі підписи й повідомлення чернетки, що й раніше"
    en: "The page shows the same labels and draft messages as before"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки; інакше не проходять і перевірки сторінки. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль». Якщо там `ReferenceError`, то код звертається до назви, якої не знає: звір написання з оголошенням і те, що змінну, оголошену через `const`, використано нижче за її оголошення."
      en: "This check expects the script to run to the end without an error; otherwise the page checks fail too. The “Console” tab shows the error name and the line of code where it happened. If it shows `ReferenceError`, the script uses a name it does not know: compare the spelling with the declaration, and check that a variable declared with `const` is used below its declaration."
  - when: { test: "the page shows the labels and the draft messages" }
    message:
      uk: "Ця перевірка чекає на сторінці те саме, що й після попереднього кроку: підписи «%%nameValue%%» і «%%secondName%%» та обидва повідомлення чернетки. Їх записують рядки коду наприкінці `app.js` — у ті самі абзаци з `id`."
      en: "This check expects the page to show the same as after the previous step: the labels of “%%nameValue%%” and “%%secondName%%” and both draft messages. The lines of code at the end of `app.js` write them into the same paragraphs with `id`s."
  - when: { test: "formatItemLabel returns the name and the price" }
    message:
      uk: "Ця перевірка викликає `formatItemLabel` з бажанням і чекає текст, у якому після назви стоїть ціна. Якщо в повідомленні перевірки `scope.formatItemLabel is not a function`, то функції з такою назвою немає на верхньому рівні `app.js`. Якщо функція повертає `undefined`, у ній не виконується `return`: `console.log` лише друкує."
      en: "This check calls `formatItemLabel` with a wish and expects text with the price after the name. If the check's message says `scope.formatItemLabel is not a function`, there is no function with this name at the top level of `app.js`. If the function returns `undefined`, no `return` runs in it: `console.log` only prints."
  - when: { test: "formatItemLabel uses the no-price text only for a missing price" }
    message:
      uk: "Ця перевірка чекає «%%noPrice%%» лише для ціни `null`, а для ціни `0` — сам `0`. Якщо для ціни `0` з’являється «%%noPrice%%», запасний текст спрацьовує для будь-якого хибного значення, а `0` — хибне значення."
      en: "This check expects “%%noPrice%%” only for the price `null`, and `0` itself for a price of `0`. If “%%noPrice%%” appears for a price of `0`, the fallback text kicks in for any falsy value, and `0` is falsy."
  - when: { test: "formatItemLabel marks acquired wishes" }
    message:
      uk: "Ця перевірка чекає позначку «%%acquiredMark%%» у підписі бажання з `acquired: true` і не чекає її в підписі бажання з `acquired: false`. Умова має читати поле бажання, яке функція отримала як параметр."
      en: "This check expects the mark “%%acquiredMark%%” in the label of a wish with `acquired: true` and not in the label of a wish with `acquired: false`. The condition must read the field of the wish the function received as its parameter."
  - when: { test: "validateItem accepts a valid wish and trims its name" }
    message:
      uk: "Ця перевірка чекає для правильної чернетки `{ ok: true, value }`, де `value.name` — назва без пробілів на краях, а `value.price` — ціна. Правильні також ціна `0` (у `value.price` вона лишається `0`, а не `null`) і назва рівно з 80 символів."
      en: "This check expects `{ ok: true, value }` for a valid draft, where `value.name` is the name without spaces at the edges and `value.price` is the price. A price of `0` (it stays `0` in `value.price`, not `null`) and a name of exactly 80 characters are valid too."
  - when: { test: "validateItem turns a missing price into null" }
    message:
      uk: "Ця перевірка чекає `value.price` — `null` і для ціни `null`, і для чернетки без поля `price`. Відсутнє поле читається як `undefined`, а договір проєкту позначає відсутню ціну саме `null`."
      en: "This check expects `value.price` to be `null` both for the price `null` and for a draft without a `price` field. A missing field reads as `undefined`, and the project's contract marks a missing price with `null`."
  - when: { test: "validateItem requires a name" }
    message:
      uk: "Ця перевірка чекає `errors.name` — `\"required\"` для назви `\"\"`, для назви із самих пробілів і для чернетки без поля `name`. Якщо бачиш `TypeError` про `trim`, то `.trim()` викликано для `undefined`: у чернетки без поля `name` немає тексту, який можна обрізати."
      en: "This check expects `errors.name` to be `\"required\"` for the name `\"\"`, for a name of only spaces and for a draft without a `name` field. If you see a `TypeError` about `trim`, `.trim()` was called on `undefined`: a draft without a `name` field has no text to trim."
  - when: { test: "validateItem rejects a name longer than 80 characters" }
    message:
      uk: "Ця перевірка чекає `\"too-long\"` для назви з 81 символу, але приймає назву з 80 символів і пробілами на краях: довжину (`.length`) порівнюють уже після обрізання пробілів."
      en: "This check expects `\"too-long\"` for a name of 81 characters, but accepts a name of 80 characters with spaces at the edges: the length (`.length`) is compared after the spaces are trimmed."
  - when: { test: "validateItem rejects a negative price" }
    message:
      uk: "Ця перевірка чекає `errors.price` — `\"negative\"` для цін `-1` і `-0.5`. Ціна `null` означає «ціни немає» й такої помилки не дає."
      en: "This check expects `errors.price` to be `\"negative\"` for the prices `-1` and `-0.5`. The price `null` means “no price” and gives no such error."
  - when: { test: "validateItem rejects a price that is not a number" }
    message:
      uk: "Ця перевірка чекає `errors.price` — `\"not-a-number\"` для тексту `\"45\"` і для `NaN`. Для тексту `typeof` дає `\"string\"`, а для `NaN` — `\"number\"`, тож `NaN` одним лише `typeof` не відрізнити."
      en: "This check expects `errors.price` to be `\"not-a-number\"` for the text `\"45\"` and for `NaN`. For text, `typeof` gives `\"string\"`, but for `NaN` it gives `\"number\"`, so `typeof` alone cannot tell `NaN` apart."
  - when: { test: "validateItem lists every field with a problem and only those" }
    message:
      uk: "Ця перевірка чекає в `errors` ключі всіх полів із проблемами — для порожньої назви й ціни `-5` обидва — і жодного поля без проблеми, навіть із порожнім текстом. Якщо бачиш лише один ключ, перевірка другого поля не виконується після першої знайденої помилки."
      en: "This check expects `errors` to hold the keys of all fields with a problem — both for an empty name and the price `-5` — and no field without a problem, not even with empty text. If you see only one key, the second field is not checked after the first problem is found."
  - when: { test: "the functions only return values" }
    message:
      uk: "Ця перевірка викликає функції з новими даними й чекає, що нічого не надруковано, сторінка й отримані записи не змінилися, а повторний виклик повертає той самий результат. Якщо щось змінилося, шукай у функціях `console.log`, рядки коду з `document` і присвоєння полям отриманого запису."
      en: "This check calls the functions with new data and expects that nothing is printed, the page and the received records stay unchanged, and a second call returns the same result. If something changed, look in the functions for `console.log`, lines of code with `document` and assignments to fields of the received record."
