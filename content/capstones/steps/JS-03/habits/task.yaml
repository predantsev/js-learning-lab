# Habit tracker variant of step JS-03. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  pausedMark: { uk: "на паузі", en: "paused" }
  tooLongMessage: { uk: "Назва задовга: не більше 80 символів", en: "The name is too long: 80 characters at most" }
  # The keys below repeat step JS-02 with identical text (the compiler accepts an identical
  # redefinition). They keep this step compilable when JS-02 is swapped out, as
  # tests/e2e/project.test.mjs does with a synthetic JS-02 in its copy of the content.
  secondName: { uk: "Прибирання", en: "Tidy up" }
  daily: { uk: "щодня", en: "daily" }
  weekly: { uk: "щотижня", en: "weekly" }
  requiredMessage: { uk: "Вкажи назву звички", en: "Enter a name for the habit" }
  invalidMessage: { uk: "Невідома частота", en: "Unknown frequency" }
  firstCheck: { uk: "щодня", en: "daily" }
  secondCheck: { uk: "щотижня", en: "weekly" }
instructions:
  uk: |
    На попередньому кроці код підпису повторився двічі — разом зі `switch` для частоти, — а перевірка вміла працювати лише з однією чернеткою. Тепер винеси ці правила в **чисті функції**: вони отримують дані й повертають результат — нічого не друкують і не змінюють ні сторінку, ні отримані записи. Оголоси їх у `app.js` на верхньому рівні (не всередині іншої функції чи блоку) з такими самими назвами, як тут.

    1. **`formatHabitLabel(habit)`** повертає підпис звички: назву, роздільник на твій смак і частоту словом (`"daily"` → «%%daily%%», `"weekly"` → «%%weekly%%»). Якщо звичка на паузі (`active` — `false`), у кінці підпису стоїть позначка «%%pausedMark%%».
    2. **`validateHabit(input)`** перевіряє чернетку й повертає результат за договором проєкту:
       - `{ ok: true, value }`, коли помилок немає. `value` — **новий** запис із полями `name` (назва без пробілів на краях) і `frequency`. Якщо частоти немає (`null` чи поля немає взагалі), вона стає `"daily"`;
       - `{ ok: false, errors }`, коли помилки є. В `errors` — лише поля з проблемами, кожне з **ключем** помилки:

       | Поле | Коли це помилка | Ключ |
       |---|---|---|
       | `name` | після обрізання пробілів назва порожня, або поля `name` немає | `"required"` |
       | `name` | після обрізання пробілів довша за 80 символів | `"too-long"` |
       | `frequency` | не `"daily"` і не `"weekly"` (великі й малі літери важать) | `"unknown"` |

       Чернетку `input` функція лише читає й не змінює.
    3. **Сторінка.** Код наприкінці `app.js` тепер лише викликає функції й записує результати в ті самі абзаци: підписи двох звичок дає `formatHabitLabel`, а повідомлення чернетки — ключі з `validateHabit`. Текст для ключа зручно повертати маленькою чистою функцією, наприклад `messageFor(key)`: `"required"` → «%%requiredMessage%%», `"too-long"` → «%%tooLongMessage%%», `"unknown"` → «%%invalidMessage%%», немає ключа → порожній текст `""`. Сторінка має показувати те саме, що й після попереднього кроку.

    **Як перевірятиметься:** платформа викликає твої функції з багатьма різними звичками й чернетками — порожня назва, самі пробіли, 80 і 81 символ, обидві частоти, звичка на паузі, `"monthly"`, `"Daily"`, відсутня частота, кілька помилок одразу — і порівнює результати з описом вище. Ще вона перевіряє, що функції нічого не друкують, не змінюють сторінку й отримані записи та для тих самих даних повертають той самий результат, а сторінка показує ті самі підписи й повідомлення.

    Перш ніж перевіряти, виведи через `console.log` результати кількох викликів — для двох-трьох своїх звичок і однієї хибної чернетки — і подивись на них на вкладці «Консоль».
  en: |
    In the previous step the label code was repeated twice — together with the `switch` for the frequency — and the check could only handle one draft. Now move these rules into **pure functions**: they take data and return a result — they print nothing and change neither the page nor the records they receive. Declare them in `app.js` at the top level (not inside another function or block) with exactly the names used here.

    1. **`formatHabitLabel(habit)`** returns a habit's label: the name, a separator of your choice and the frequency as a word (`"daily"` → “%%daily%%”, `"weekly"` → “%%weekly%%”). When the habit is paused (`active` is `false`), the label ends with the mark “%%pausedMark%%”.
    2. **`validateHabit(input)`** checks a draft and returns a result by the project's contract:
       - `{ ok: true, value }` when there are no problems. `value` is a **new** record with the fields `name` (the name without spaces at the edges) and `frequency`. When there is no frequency (`null` or no field at all), it becomes `"daily"`;
       - `{ ok: false, errors }` when there are problems. `errors` holds only the fields with a problem, each with an error **key**:

       | Field | When it is a problem | Key |
       |---|---|---|
       | `name` | empty after trimming the spaces, or there is no `name` field | `"required"` |
       | `name` | longer than 80 characters after trimming the spaces | `"too-long"` |
       | `frequency` | not `"daily"` or `"weekly"` (upper and lower case matter) | `"unknown"` |

       The function only reads the draft `input` and does not change it.
    3. **The page.** The code at the end of `app.js` now only calls the functions and writes their results into the same paragraphs: `formatHabitLabel` gives the two habits' labels, and the keys from `validateHabit` give the draft's messages. A small pure function is handy for the text of a key, for example `messageFor(key)`: `"required"` → “%%requiredMessage%%”, `"too-long"` → “%%tooLongMessage%%”, `"unknown"` → “%%invalidMessage%%”, no key → the empty text `""`. The page must show the same as after the previous step.

    **How it is checked:** the platform calls your functions with many different habits and drafts — an empty name, only spaces, 80 and 81 characters, both frequencies, a paused habit, `"monthly"`, `"Daily"`, a missing frequency, several problems at once — and compares the results with the description above. It also checks that the functions print nothing, change neither the page nor the records they receive, and return the same result for the same data, and that the page shows the same labels and messages.

    Before checking, print the results of a few calls with `console.log` — for two or three habits of your own and one bad draft — and look at them on the “Console” tab.
nudge:
  uk: "Почни з `formatHabitLabel`: перенеси в неї один зі своїх `switch` і код, що складав підпис, заміни конкретну звичку параметром і поверни текст через `return`; другий `switch` більше не потрібен. Для `validateHabit` пригадай рамку з уроку про валідацію: порожній запис `errors`, перевірки, що додають у нього ключі, і `return` наприкінці. Відсутнє поле читається як `undefined` — згадай, як отримати запасне значення."
  en: "Start with `formatHabitLabel`: move one of your `switch` statements and the code that built the label into it, replace the specific habit with a parameter and hand the text back with `return`; the second `switch` is no longer needed. For `validateHabit`, recall the frame from the validation lesson: an empty `errors` record, checks that add keys to it, and a `return` at the end. A missing field reads as `undefined` — recall how to get a fallback value."
testTitles:
  "the script runs without errors":
    uk: "Код у `app.js` працює без помилок"
    en: "The script runs without errors"
  "the page shows the labels and the draft messages":
    uk: "Сторінка показує ті самі підписи й повідомлення чернетки, що й раніше"
    en: "The page shows the same labels and draft messages as before"
  "formatHabitLabel returns the name and the frequency in words":
    uk: "`formatHabitLabel` повертає текст із назвою й частотою словом"
    en: "`formatHabitLabel` returns text with the name and the frequency as a word"
  "formatHabitLabel marks paused habits":
    uk: "`formatHabitLabel` додає «%%pausedMark%%» лише звичкам на паузі"
    en: "`formatHabitLabel` adds “%%pausedMark%%” to paused habits only"
  "validateHabit accepts a valid habit and trims its name":
    uk: "`validateHabit` приймає правильну чернетку й обрізає пробіли в назві"
    en: "`validateHabit` accepts a valid draft and trims the spaces of the name"
  "validateHabit fills in the default frequency":
    uk: "`validateHabit` дає `frequency: \"daily\"`, коли частоти немає"
    en: "`validateHabit` gives `frequency: \"daily\"` when the frequency is missing"
  "validateHabit requires a name":
    uk: "`validateHabit` дає `\"required\"` для порожньої, пробільної чи відсутньої назви"
    en: "`validateHabit` gives `\"required\"` for an empty, blank or missing name"
  "validateHabit rejects a name longer than 80 characters":
    uk: "`validateHabit` дає `\"too-long\"` для назви понад 80 символів"
    en: "`validateHabit` gives `\"too-long\"` for a name over 80 characters"
  "validateHabit rejects an unknown frequency":
    uk: "`validateHabit` дає `\"unknown\"` для частоти поза `daily` і `weekly`"
    en: "`validateHabit` gives `\"unknown\"` for a frequency other than `daily` and `weekly`"
  "validateHabit lists every field with a problem and only those":
    uk: "`errors` містить кожне поле з проблемою — і лише такі поля"
    en: "`errors` holds every field with a problem — and only those fields"
  "the functions only return values":
    uk: "Функції лише повертають значення: нічого не друкують і не змінюють сторінку чи отримані записи"
    en: "The functions only return values: they print nothing and change neither the page nor the records they get"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки; інакше не проходять і перевірки сторінки. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль». Якщо там `ReferenceError`, то код звертається до назви, якої не знає: звір написання з оголошенням і те, що змінну, оголошену через `const`, використано нижче за її оголошення."
      en: "This check expects the script to run to the end without an error; otherwise the page checks fail too. The “Console” tab shows the error name and the line of code where it happened. If it shows `ReferenceError`, the script uses a name it does not know: compare the spelling with the declaration, and check that a variable declared with `const` is used below its declaration."
  - when: { test: "the page shows the labels and the draft messages" }
    message:
      uk: "Ця перевірка чекає на сторінці те саме, що й після попереднього кроку: підписи «%%nameValue%%» і «%%secondName%%» із частотою та обидва повідомлення чернетки. Їх записують рядки коду наприкінці `app.js` — у ті самі абзаци з `id`."
      en: "This check expects the page to show the same as after the previous step: the labels of “%%nameValue%%” and “%%secondName%%” with their frequency and both draft messages. The lines of code at the end of `app.js` write them into the same paragraphs with `id`s."
  - when: { test: "formatHabitLabel returns the name and the frequency in words" }
    message:
      uk: "Ця перевірка викликає `formatHabitLabel` зі звичками `\"daily\"` і `\"weekly\"` і чекає текст із назвою та лише відповідним словом частоти. Якщо в повідомленні перевірки `scope.formatHabitLabel is not a function`, то функції з такою назвою немає на верхньому рівні `app.js`. Якщо звичка `\"daily\"` отримує «%%weekly%%», виконання провалюється з гілки `\"daily\"` у наступну гілку `switch`."
      en: "This check calls `formatHabitLabel` with a `\"daily\"` and a `\"weekly\"` habit and expects text with the name and only the matching frequency word. If the check's message says `scope.formatHabitLabel is not a function`, there is no function with this name at the top level of `app.js`. If a `\"daily\"` habit gets “%%weekly%%”, execution falls through from the `\"daily\"` branch into the next branch of the `switch`."
  - when: { test: "formatHabitLabel marks paused habits" }
    message:
      uk: "Ця перевірка чекає позначку «%%pausedMark%%» у підписі звички з `active: false` і не чекає її в підписі звички з `active: true`. Умова має читати поле звички, яку функція отримала як параметр."
      en: "This check expects the mark “%%pausedMark%%” in the label of a habit with `active: false` and not in the label of a habit with `active: true`. The condition must read the field of the habit the function received as its parameter."
  - when: { test: "validateHabit accepts a valid habit and trims its name" }
    message:
      uk: "Ця перевірка чекає для правильної чернетки `{ ok: true, value }`, де `value.name` — назва без пробілів на краях, а `value.frequency` — частота із чернетки. Назва рівно з 80 символів — правильна."
      en: "This check expects `{ ok: true, value }` for a valid draft, where `value.name` is the name without spaces at the edges and `value.frequency` comes from the draft. A name of exactly 80 characters is valid."
  - when: { test: "validateHabit fills in the default frequency" }
    message:
      uk: "Ця перевірка чекає для чернетки без частоти (поля немає або воно `null`) `value.frequency` — `\"daily\"`, як записано в договорі проєкту. Відсутнє поле читається як `undefined`."
      en: "This check expects `value.frequency` to be `\"daily\"` for a draft without a frequency (no field, or `null`), as the project's contract says. A missing field reads as `undefined`."
  - when: { test: "validateHabit requires a name" }
    message:
      uk: "Ця перевірка чекає `errors.name` — `\"required\"` для назви `\"\"`, для назви із самих пробілів і для чернетки без поля `name`. Якщо бачиш `TypeError` про `trim`, то `.trim()` викликано для `undefined`: у чернетки без поля `name` немає тексту, який можна обрізати."
      en: "This check expects `errors.name` to be `\"required\"` for the name `\"\"`, for a name of only spaces and for a draft without a `name` field. If you see a `TypeError` about `trim`, `.trim()` was called on `undefined`: a draft without a `name` field has no text to trim."
  - when: { test: "validateHabit rejects a name longer than 80 characters" }
    message:
      uk: "Ця перевірка чекає `\"too-long\"` для назви з 81 символу, але приймає назву з 80 символів і пробілами на краях: довжину (`.length`) порівнюють уже після обрізання пробілів."
      en: "This check expects `\"too-long\"` for a name of 81 characters, but accepts a name of 80 characters with spaces at the edges: the length (`.length`) is compared after the spaces are trimmed."
  - when: { test: "validateHabit rejects an unknown frequency" }
    message:
      uk: "Ця перевірка чекає `errors.frequency` — `\"unknown\"` для `\"monthly\"`, `\"Daily\"` і порожнього тексту `\"\"`: порівняння строге. Лише `null` і відсутня частота стають `\"daily\"`."
      en: "This check expects `errors.frequency` to be `\"unknown\"` for `\"monthly\"`, `\"Daily\"` and the empty text `\"\"`: the comparison is strict. Only `null` and a missing frequency become `\"daily\"`."
  - when: { test: "validateHabit lists every field with a problem and only those" }
    message:
      uk: "Ця перевірка чекає в `errors` ключі всіх полів із проблемами — для порожньої назви й частоти `\"monthly\"` обидва — і жодного поля без проблеми, навіть із порожнім текстом. Якщо бачиш лише один ключ, перевірка другого поля не виконується після першої знайденої помилки."
      en: "This check expects `errors` to hold the keys of all fields with a problem — both for an empty name and the frequency `\"monthly\"` — and no field without a problem, not even with empty text. If you see only one key, the second field is not checked after the first problem is found."
  - when: { test: "the functions only return values" }
    message:
      uk: "Ця перевірка викликає функції з новими даними й чекає, що нічого не надруковано, сторінка й отримані записи не змінилися, а повторний виклик повертає той самий результат. Якщо щось змінилося, шукай у функціях `console.log`, рядки коду з `document` і присвоєння полям отриманого запису."
      en: "This check calls the functions with new data and expects that nothing is printed, the page and the received records stay unchanged, and a second call returns the same result. If something changed, look in the functions for `console.log`, lines of code with `document` and assignments to fields of the received record."
