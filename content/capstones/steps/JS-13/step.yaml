# The compiler also writes the syllabus lesson js-13-13-capstone-lazy-paging-cleanup from this file.
# The step is checked in the platform and continues from the JS-12 reference.
unit: JS-13
mode: in-platform
entry: index.html
title:
  uk: "Сторінки списку й прибирання"
  en: "List pages and cleanup"
intro:
  uk: |
    Список проєкту росте, і показувати його весь одразу вже не треба. На цьому кроці сторінка показує записи порціями, а все, що вона вмикає, вміє й вимкнути.

    - **Ліниві сторінки.** [[generator|Генератор]] `paginate(items, size)` віддає записи сторінками по `size` — кожну лише тоді, коли її попросили ([[lazy-evaluation|ліниве обчислення]]). Кнопка «Показати ще» бере в нього наступну сторінку.
    - **Пошук із паузою.** Поле пошуку фільтрує список не на кожну літеру, а коли введення стихло на 300 мс: кожне введення скасовує попередній таймер (`clearTimeout`) і ставить новий (`setTimeout`). Такий прийом називають debounce.
    - **[[teardown|Teardown]].** Новий експорт `teardown()` з `ui/page.js` знімає всі listeners сторінки одним сигналом `AbortController`, скасовує таймер пошуку, закриває генератор і перериває завантаження, що ще триває. Другий виклик нічого не робить ([[idempotent-cleanup|ідемпотентне прибирання]]), а `start(storage)` спершу викликає `teardown()` — тож перезапуск сторінки ніколи не подвоює listeners.

    Перевірки цього кроку рахують лише listeners, додані через `addEventListener`: після `teardown()` їх має лишитися нуль. Таймери перевірки підміняють своїм годинником, тож чекати 300 мс справжнього часу не треба.

    > [!note]
    > Якщо ти вже експортував проєкт (контрольна точка CP-JS), твої локальні файли — головні, і платформа їх не змінює. Тоді спершу зроби commit у своїй теці, завантаж еталон цього кроку з екрана проєкту й перенеси зміни вручну, звіряючи файли, як у уроках розділу JS-10.
  en: |
    The project's list grows, and there is no need to show all of it at once any more. In this step the page shows the records in portions, and everything it switches on, it can also switch off.

    - **Lazy pages.** A [[generator]] `paginate(items, size)` yields the records in pages of `size` — each one only when it is asked for ([[lazy-evaluation]]). The “Show more” button takes the next page from it.
    - **Search with a pause.** The search field filters the list not on every letter but when typing has been quiet for 300 ms: every input cancels the previous timer (`clearTimeout`) and sets a new one (`setTimeout`). This technique is called debounce.
    - **[[teardown|Teardown]].** A new export `teardown()` of `ui/page.js` removes all the page's listeners with one `AbortController` signal, cancels the search timer, closes the generator and aborts a load that is still running. A second call does nothing ([[idempotent-cleanup]]), and `start(storage)` calls `teardown()` first — so a restart of the page never doubles the listeners.

    The checks of this step count only listeners added with `addEventListener`: after `teardown()` none may be left. The checks replace the timers with a clock of their own, so there is no waiting for 300 ms of real time.

    > [!note]
    > If you have already exported the project (checkpoint CP-JS), your local files are the main ones, and the platform does not change them. Then first make a commit in your folder, download this step's reference from the project screen and carry the changes over by hand, comparing the files, as in the lessons of unit JS-10.
purpose:
  uk: "Це крок твого проєкту: генератори, лінива обробка та прибирання listeners і таймерів із цього розділу ти застосовуєш до списку власного застосунку. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply this unit's generators, lazy processing and cleanup of listeners and timers to the list of your own app. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Написати генератор, що ліниво віддає записи проєкту сторінками, і показувати їх кнопкою «Показати ще»."
    en: "Write a generator that lazily yields the project's records in pages, and show them with a “Show more” button."
  - uk: "Відкладати пошук до паузи у введенні таймером, який кожне нове введення скасовує."
    en: "Delay the search until typing pauses, with a timer that every new input cancels."
  - uk: "Написати ідемпотентний `teardown()`, що знімає всі listeners сторінки, скасовує таймер і закриває генератор, і перевірити, що після нього не лишається активних listeners."
    en: "Write an idempotent `teardown()` that removes every listener of the page, cancels the timer and closes the generator, and verify that no active listener is left after it."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередні кроки не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
