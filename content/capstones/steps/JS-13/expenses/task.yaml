# Expenses variant of step JS-13. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  moreLabel: { uk: "Показати ще", en: "Show more" }
  searchLabel: { uk: "Пошук", en: "Search" }
  filterLabel: { uk: "Показати", en: "Show" }
  filterAll: { uk: "усі", en: "all" }
instructions:
  uk: |
    Список показує витрати порціями по чотири, шукає за назвою після паузи у введенні, а все, що сторінка вмикає, вимикає `teardown()`.

    **1. Генератор `paginate(items, size)`** (іменований експорт `domain/expenses.js`, `function*`) віддає масиви по `size` елементів: `[1, 2, 3, 4, 5]` із `size` 2 — це `[1, 2]`, `[3, 4]`, `[5]`; порожній список не дає жодної сторінки. Наступну сторінку він вирізає (`slice`) лише тоді, коли її попросили: якщо після першої сторінки в масив додали елемент, наступна сторінка його вже містить.

    **2. Сторінки на сторінці.** У `index.html` під списком додай `<button id="show-more" type="button" hidden>%%moreLabel%%</button>`. У `ui/page.js`:

    - `render()` закриває попередній генератор (`pages?.return()`), створює новий — `paginate(показані, 4)` — і бере з нього стільки сторінок, скільки було показано (спершу одну), тож після будь-якої зміни видно стільки ж карток, як і до неї;
    - клік «%%moreLabel%%» бере **наступну сторінку того самого генератора** й додає її картки в кінець списку (`list.append`), не перемальовуючи вже показані;
    - кнопка прихована, коли показано всі картки.

    **3. Пошук із паузою.** Над списком додай поле з підписом: `<label for="search">%%searchLabel%%</label>` і `<input id="search" type="search">`. Список показує лише витрати, що знаходить `searchExpenses(current, запит)` з кроку про дані. Подія `input` не шукає одразу: вона скасовує попередній таймер (`clearTimeout`) і ставить новий на 300 мс (`setTimeout`), а вже він записує запит, повертає список на першу сторінку й викликає `render()`. Так набрані підряд літери дають один пошук — цей прийом називають debounce.

    Поруч із полем пошуку додай фільтр: `<label for="list-filter">%%filterLabel%%</label>` і `<select id="list-filter">` з варіантами «%%filterAll%%» (`value="all"`), чотири категорії зі значеннями `"food"`, `"transport"`, `"home"`, `"fun"` і текстом «%%categoryFood%%», «%%categoryTransport%%», «%%categoryHome%%», «%%categoryFun%%». Подія `change` фільтра одразу, без таймера, записує вибране значення, повертає список на першу сторінку й викликає `render()`; `render()` спершу бере `filterExpenses(current, значення)` (для `"all"` — увесь список), а потім шукає в результаті.

    **4. `teardown()`.** Обробники `submit` форми, `click` списку, кнопки повтору й «%%moreLabel%%», `input` поля пошуку та `change` фільтра стають іменованими функціями, і `start(storage)` додає їх через `addEventListener(тип, функція, { signal })` з одним `AbortController`. Іменований експорт `teardown()` з `ui/page.js`:

    - викликає `abort()` цього контролера — так усі listeners знімаються одним викликом;
    - скасовує таймер пошуку, закриває генератор (`return()`) і перериває завантаження початкових витрат, що ще триває;
    - вдруге нічого не робить (наприклад, контролер після прибирання стає `null`, і `teardown()` одразу повертається).

    `start(storage)` першим рядком коду викликає `teardown()`: тоді другий запуск сторінки не подвоює listeners, і одне натискання «%%saveLabel%%» додає один запис, а не два.

    **5. Тести.** Допиши в `tests/domain.test.js` тести для `paginate`: і для списку, що ділиться на `size` націло, і для такого, де остання сторінка коротша.

    **Як перевірятиметься.** Перевірки викликають `paginate` з різними списками, перезапускають сторінку викликом `start(storage)`, натискають «%%moreLabel%%», зберігають запис через форму, вибирають фільтр і вводять текст у поле пошуку. Таймери перевірки підміняють своїм годинником (`setTimeout`, `clearTimeout`, `setInterval`, `clearInterval`), тож бачать, скільки таймерів чекає, і запускають їх самі, без справжніх 300 мс. Listeners вони рахують, підміняючи `addEventListener` і `removeEventListener`: рахуються лише listeners на елементах сторінки, `document` і `window`, а знятий через `AbortController` вважається знятим. Після `teardown()` таких listeners має бути нуль, після другого `start(storage)` — стільки ж, як після першого. Ще перевірки викликають `teardown()`, поки початкові записи завантажуються, і чекають, що вони так і не з’являться. Твої тести запускаються з версією `domain/expenses.js` від курсу (усі мають пройти) і з версією, де `paginate` губить коротку останню сторінку, — з нею хоча б один тест має впасти.
  en: |
    The list shows the expenses in portions of four, searches by label after a pause in typing, and `teardown()` switches off everything the page switches on.

    **1. The generator `paginate(items, size)`** (a named export of `domain/expenses.js`, a `function*`) yields arrays of `size` items: `[1, 2, 3, 4, 5]` with `size` 2 gives `[1, 2]`, `[3, 4]`, `[5]`; an empty list yields no page. It cuts the next page (`slice`) only when it is asked for: if an item is added to the array after the first page, the next page already contains it.

    **2. Pages on the page.** In `index.html`, under the list, add `<button id="show-more" type="button" hidden>%%moreLabel%%</button>`. In `ui/page.js`:

    - `render()` closes the previous generator (`pages?.return()`), creates a new one — `paginate(shown, 4)` — and takes as many pages from it as were shown (one at first), so after any change as many cards are visible as before it;
    - a click on “%%moreLabel%%” takes **the next page of the same generator** and adds its cards at the end of the list (`list.append`), without redrawing the ones already shown;
    - the button is hidden when every card is shown.

    **3. Search with a pause.** Above the list add a labelled field: `<label for="search">%%searchLabel%%</label>` and `<input id="search" type="search">`. The list shows only the expenses that `searchExpenses(current, query)` from the data step finds. The `input` event does not search right away: it cancels the previous timer (`clearTimeout`) and sets a new one for 300 ms (`setTimeout`), and that one stores the query, takes the list back to the first page and calls `render()`. So letters typed in a row give one search — this technique is called debounce.

    Next to the search field add a filter: `<label for="list-filter">%%filterLabel%%</label>` and `<select id="list-filter">` with the options “%%filterAll%%” (`value="all"`), the four categories with the values `"food"`, `"transport"`, `"home"`, `"fun"` and the text “%%categoryFood%%”, “%%categoryTransport%%”, “%%categoryHome%%”, “%%categoryFun%%”. The filter's `change` event right away, without a timer, stores the chosen value, takes the list back to the first page and calls `render()`; `render()` first takes `filterExpenses(current, value)` (the whole list for `"all"`), then searches in the result.

    **4. `teardown()`.** The handlers of the form's `submit`, the list's `click`, the retry and “%%moreLabel%%” buttons, the search field's `input` and the filter's `change` become named functions, and `start(storage)` adds them with `addEventListener(type, handler, { signal })` and one `AbortController`. The named export `teardown()` of `ui/page.js`:

    - calls `abort()` of this controller — so every listener is removed with one call;
    - cancels the search timer, closes the generator (`return()`) and aborts a load of the starting expenses that is still running;
    - does nothing the second time (for example, the controller becomes `null` after the cleanup, and `teardown()` returns right away).

    `start(storage)` calls `teardown()` in its first line of code: then a second start of the page does not double the listeners, and one press of “%%saveLabel%%” adds one record, not two.

    **5. Tests.** Add tests for `paginate` to `tests/domain.test.js`: for a list that divides by `size` evenly and for one whose last page is shorter.

    **How it is checked.** The checks call `paginate` with different lists, restart the page by calling `start(storage)`, press “%%moreLabel%%”, save a record through the form, choose a filter and type into the search field. The checks replace the timers with a clock of their own (`setTimeout`, `clearTimeout`, `setInterval`, `clearInterval`), so they see how many timers are waiting and run them themselves, without 300 real milliseconds. They count listeners by replacing `addEventListener` and `removeEventListener`: only listeners on page elements, `document` and `window` count, and one removed through an `AbortController` counts as removed. After `teardown()` there must be none of them, after a second `start(storage)` as many as after the first. The checks also call `teardown()` while the starting records load and expect them never to appear. Your tests run with the course's version of `domain/expenses.js` (all must pass) and with a version where `paginate` loses the short last page — with it, at least one test must fail.
nudge:
  uk: "Генератор віддає значення через `yield` у циклі, а цикл іде від `0` з кроком `size`, поки початок сторінки ще в межах масиву. Для `teardown()` збережи все, що треба вимкнути: контролер listeners, номер таймера й сам генератор."
  en: "A generator gives values with `yield` in a loop, and the loop goes from `0` in steps of `size` while the start of the page is still inside the array. For `teardown()` keep everything that has to be switched off: the listeners' controller, the timer's id and the generator itself."
