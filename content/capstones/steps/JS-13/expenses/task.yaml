feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там `TypeError` про `null`, то `ui/page.js` шукає елемент, якого немає в `index.html`: `#show-more` чи `#search`."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. If it shows a `TypeError` about `null`, `ui/page.js` looks for an element that `index.html` does not have: `#show-more` or `#search`."
  - when: { test: "paginate yields pages of at most size" }
    message:
      uk: "Ця перевірка чекає іменований експорт `paginate` у `domain/expenses.js`, що повертає ітератор (генератор), і сторінки `[[1, 2], [3, 4], [5]]` для `[1, 2, 3, 4, 5]` із `size` 2, `[[1, 2], [3, 4]]` для чотирьох чисел, `[[1, 2, 3]]` для трьох із `size` 4 і жодної сторінки для `[]`."
      en: "This check expects a named export `paginate` in `domain/expenses.js` that returns an iterator (a generator), and the pages `[[1, 2], [3, 4], [5]]` for `[1, 2, 3, 4, 5]` with `size` 2, `[[1, 2], [3, 4]]` for four numbers, `[[1, 2, 3]]` for three with `size` 4 and no page for `[]`."
  - when: { test: "paginate builds a page only when asked" }
    message:
      uk: "Ця перевірка бере першу сторінку `[1, 2]` списку `[1, 2, 3]` із `size` 2, потім додає в масив `4` і чекає, що решта сторінок — `[[3, 4]]`. Так буде, коли генератор вирізає кожну сторінку лише на запит, а не готує всі одразу."
      en: "This check takes the first page `[1, 2]` of the list `[1, 2, 3]` with `size` 2, then adds `4` to the array and expects the remaining pages to be `[[3, 4]]`. That is what happens when the generator cuts every page only on request instead of preparing them all at once."
  - when: { test: "the list shows four cards and a Show more button" }
    message:
      uk: "Ця перевірка перезапускає сторінку з порожнім сховищем і чекає чотири картки `e-01`…`e-04` та видиму кнопку, чия назва містить «%%moreLabel%%»."
      en: "This check restarts the page with an empty storage and expects four cards `e-01`…`e-04` and a visible button whose name contains “%%moreLabel%%”."
  - when: { test: "Show more adds the next page under the cards" }
    message:
      uk: "Ця перевірка натискає «%%moreLabel%%» і чекає шість карток по порядку, причому картка `e-01` — той самий елемент, що й до кліку: наступну сторінку треба додати (`append`), а не перемалювати список. Коли показано всі картки, кнопка прихована."
      en: "This check presses “%%moreLabel%%” and expects six cards in order, with the card `e-01` the same element as before the click: the next page must be added (`append`), not the list redrawn. When every card is shown, the button is hidden."
  - when: { test: "a change keeps the pages that were shown" }
    message:
      uk: "Ця перевірка показує дві сторінки, зберігає через форму нова витрата і чекає сім карток і сім записів у сховищі: після зміни `render()` бере з нового генератора стільки ж сторінок, скільки було показано."
      en: "This check shows two pages, saves a new expense through the form and expects seven cards and seven saved records: after a change `render()` takes as many pages from the new generator as were shown."
  - when: { test: "the search waits for a pause in typing" }
    message:
      uk: "Ця перевірка підміняє таймери своїм годинником, вводить у поле «%%searchLabel%%» назву «%%fixture5Name%%» по літері (подія `input` на кожну) і чекає рівно один таймер на 300 мс і ще ті самі чотири картки; після того як таймер спрацює — лише картку `e-05`. Якщо таймерів більше, то нове введення не скасовує попередній (`clearTimeout`)."
      en: "This check replaces the timers with its own clock, types the name “%%fixture5Name%%” into the field “%%searchLabel%%” letter by letter (an `input` event for each) and expects exactly one timer of 300 ms and still the same four cards; after the timer runs — only the card `e-05`. If there are more timers, a new input does not cancel the previous one (`clearTimeout`)."
  - when: { test: "the filter narrows the list at once" }
    message:
      uk: "Ця перевірка шукає поле `<select>` з підписом «%%filterLabel%%», вибирає значення `\"fun\"` і чекає жодного нового таймера й лише картки `e-03` і `e-05`, а після `\"all\"` — знову чотири картки. Подія `change` фільтра викликає `render()` одразу, а `render()` бере `filterExpenses` перед пошуком."
      en: "This check looks for a `<select>` field labelled “%%filterLabel%%”, chooses the value `\"fun\"` and expects no new timer and only the cards `e-03` and `e-05`, and after `\"all\"` four cards again. The filter's `change` event calls `render()` right away, and `render()` takes `filterExpenses` before the search."
  - when: { test: "teardown removes every listener the page added" }
    message:
      uk: "Ця перевірка чекає іменований експорт `teardown` в `ui/page.js`. Вона рахує listeners на елементах сторінки, `document` і `window`, додані через `addEventListener`: після `start(storage)` їх більше нуля, після другого `start(storage)` — стільки ж (`start` спершу викликає `teardown()`), а після `teardown()` — нуль. Listener, доданий без `{ signal }` і без пари `removeEventListener`, лишається."
      en: "This check expects a named export `teardown` in `ui/page.js`. It counts the listeners on page elements, `document` and `window` added with `addEventListener`: after `start(storage)` more than zero, after a second `start(storage)` the same number (`start` calls `teardown()` first), and zero after `teardown()`. A listener added without `{ signal }` and without a matching `removeEventListener` stays."
  - when: { test: "after teardown the page does nothing" }
    message:
      uk: "Ця перевірка викликає `teardown()`, потім натискає «%%moreLabel%%» і вводить текст у поле пошуку та чекає ті самі чотири картки й жодного нового таймера: після `teardown()` у сторінки немає listeners."
      en: "This check calls `teardown()`, then presses “%%moreLabel%%” and types into the search field, and expects the same four cards and no new timer: after `teardown()` the page has no listeners."
  - when: { test: "teardown cancels a pending search" }
    message:
      uk: "Ця перевірка вводить текст у поле пошуку (чекає один таймер), викликає `teardown()` і чекає нуль таймерів і ті самі чотири картки. Збережи номер таймера й виклич для нього `clearTimeout` у `teardown()`."
      en: "This check types into the search field (expects one timer), calls `teardown()` and expects zero timers and the same four cards. Keep the timer's id and call `clearTimeout` for it in `teardown()`."
  - when: { test: "teardown stops a load that is still on its way" }
    message:
      uk: "Ця перевірка запускає сторінку з порожнім сховищем, тож початкові витрат завантажуються через `fetch` (перевірка відповідає через 300 мс), і викликає `teardown()`, поки відповідь у дорозі. Коли відповідь мала б прийти, карток на сторінці не має бути: `teardown()` викликає `abort()` контролера цього завантаження."
      en: "This check starts the page with an empty storage, so the starting expenses load through `fetch` (the check answers after 300 ms), and calls `teardown()` while the answer is on its way. When the answer would have arrived, the page must show no cards: `teardown()` calls `abort()` on the controller of that load."
  - when: { test: "teardown is safe to call twice and the page starts again" }
    message:
      uk: "Ця перевірка двічі поспіль викликає `teardown()` і чекає, що другий виклик не кидає помилку. Потім вона двічі викликає `start(storage)`, зберігає один запис через форму й чекає сім записів у сховищі: вісім означало б, що обробник `submit` спрацював двічі."
      en: "This check calls `teardown()` twice in a row and expects the second call not to throw. Then it calls `start(storage)` twice, saves one record through the form and expects seven saved records: eight would mean the `submit` handler ran twice."
  - when: { test: "your domain tests pass with a correct domain module" }
    message:
      uk: "Ця перевірка запускає `tests/domain.test.js` з версією `domain/expenses.js` від курсу й раннером курсу та чекає хоча б один тест і жодного, що впав. Повідомлення внизу називає тест, що впав, або помилку."
      en: "This check runs `tests/domain.test.js` with the course's version of `domain/expenses.js` and the course runner, and expects at least one test and none that fails. The message below names the failed test or the error."
  - when: { test: "your tests catch a paginate that drops the short last page" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/expenses.js`. Потім вона підставляє версію, де `paginate` зупиняється перед останньою сторінкою, коротшою за `size`, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест зі списком, що не ділиться на `size` націло."
      en: "This check first expects all your tests to pass with the correct `domain/expenses.js`. Then it puts in a version where `paginate` stops before a last page shorter than `size`, and expects at least one of your tests to fail. Only a test with a list that does not divide by `size` evenly notices this defect."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
