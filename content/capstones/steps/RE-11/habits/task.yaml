# Habit tracker variant of step RE-11 (a local step: done in the learner's editor, terminal and browser, no
# platform checks). Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2,
# Chrome) on the scratch project of this capstone after RE-10. The formatter outputs and time zones quoted in
# docs/boundary-review.md were measured in Node.js 25.2.1 and Chrome 154; the hydration risk itself is a prediction for NO-13.
instructions:
  uk: |
    Дизайн-рев’ю на папері: межа сервер/клієнт у дереві компонентів проєкту, що її ніколи не перетинає, і один передбачений ризик гідратації. Код застосунку не змінюється. Платформа цей крок не перевіряє.

    1. `docs/boundary-review.md`, розділ «The component tree»: дерево компонентів проєкту з позначками `server` / `client` і причиною кожної.
    2. Серверні: список і картки звичок, рядок часток, `HabitStreaks`, `HabitDetail`. Клієнтські: «%%markTodayLabel%%», «%%pauseLabel%%» / «%%resumeLabel%%», видалення з підтвердженням, фільтр і пошук; а також кеш, роутер і межа помилок.
    3. Розділ «Never crosses to the client»: доступ до сховища (`data/api.ts`, `storage/`), будь-який майбутній ключ (`.env`, `process.env` лише на сервері — усе, що імпортує `main.tsx`, потрапляє в публічний `dist/`), функції як props від серверного компонента, модулі лише для браузера (`ui/router.tsx`, `ui/profile.ts`, `data/api.ts`) і адреси з `#`, яких сервер не бачить.
    4. Розділ про один ризик гідратації: серія `streakOf` з поточним днем клієнта замість переданого: Node.js — `Europe/Madrid`, контекст Chrome — `Pacific/Auckland`; передбачення, вихід і як це перевірить NO-13 (`renderToString` → `hydrateRoot` → Console). Позначено як неперевірене.
    5. Код застосунку не змінюється: `git status --short` — лише `?? docs/boundary-review.md`; `npm test` і `tests.html` — як після попереднього кроку.
    6. `git add -A`, `git commit -m "Review the server and client boundary on paper"`.
  en: |
    A design review on paper: the server/client boundary in the project's component tree, what never crosses it, and one predicted hydration risk. The app code does not change. The platform does not check this step.

    1. `docs/boundary-review.md`, the section “The component tree”: the project's component tree with `server` / `client` marks and the reason for each.
    2. Server: the habit list and cards, the rates line, `HabitStreaks`, `HabitDetail`. Client: “%%markTodayLabel%%”, “%%pauseLabel%%” / “%%resumeLabel%%”, delete with the confirmation, the filter and the search; also the cache, the router and the error boundary.
    3. The section “Never crosses to the client”: storage access (`data/api.ts`, `storage/`), any future key (`.env`, `process.env` on the server only — whatever `main.tsx` imports ends up in the public `dist/`), functions as props from a server component, browser-only modules (`ui/router.tsx`, `ui/profile.ts`, `data/api.ts`) and `#` addresses a server never sees.
    4. The section on one hydration risk: the `streakOf` streak with the client's current day instead of the passed-in one: Node.js — `Europe/Madrid`, a Chrome context — `Pacific/Auckland`; the prediction, the way out and how NO-13 will check it (`renderToString` → `hydrateRoot` → Console). Marked as unconfirmed.
    5. The app code does not change: `git status --short` — only `?? docs/boundary-review.md`; `npm test` and `tests.html` — as after the previous step.
    6. `git add -A`, `git commit -m "Review the server and client boundary on paper"`.
