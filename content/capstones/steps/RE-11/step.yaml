# Capstone step of unit RE-11 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson of kind capstone-step of RE-11 from this file.
# A local step: done in the learner's editor and terminal; no platform checks. The project page shows only
# the intro of a local step, so the intro carries the whole procedure.
# Every command was run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0) in a scratch home on all four
# projects, continuing the RE-10 scratch projects. The formatter outputs and time zones in the table were
# measured with the same Intl calls in Node.js 25.2.1 and in a headless Chrome 154 context (locale de-DE,
# zone Pacific/Auckland). No server render or hydration was run: that is NO-13.
# reference/ holds the same file set as RE-10 plus docs/boundary-review.md.
unit: RE-11
mode: local
entry: index.html
title:
  uk: "Межа сервера й клієнта на папері"
  en: "The server–client boundary on paper"
intro:
  uk: |
    Дизайн-рев’ю без коду: де в твоєму проєкті пройшла б межа між сервером і клієнтом, що її ніколи не перетинає і де при гідратації найімовірніше розійдуться сервер і браузер. Результат — `docs/boundary-review.md`; код застосунку не змінюється. По-справжньому сервер і гідратацію перевірять у NO-13.

    | Проєкт | Серверні (приклади) | Клієнтські (приклади) | Передбачений ризик гідратації |
    |---|---|---|---|
    | Список бажань | список, картки, `ItemTotals` | форма, перемикач «отримано», видалення | `price` через `formatPrice` |
    | Планувальник | список, картки, `DueToday` | перемикач «виконано», вибір пріоритету | «сьогодні» з годинника замість переданого дня |
    | Трекер звичок | список, картки, `HabitStreaks` | «виконано сьогодні», пауза | серія з поточним днем клієнта |
    | Трекер витрат | список, картки, `CategoryTotals` | форма, фільтр категорій | `amountMinor` через `formatMoney` |

    Нижче — «Список бажань»; файл написано для всіх чотирьох проєктів.

    **1. Стан на початку.** `cd ~/js-course/wishlist`, `git status` — чисто, `git log --oneline -1` — commit кроку про лінивий маршрут.

    **2. Дерево компонентів.** Створи `docs/boundary-review.md` і в розділі «The component tree» намалюй дерево (`App` → провайдер кешу → `Router` → layout → екрани й їхні частини) з позначкою для кожного вузла: `server` — лише перетворює отримані дані на розмітку; `client` — потребує браузера: стан, ефекти, обробники подій, об’єкти браузера. У нас `server`: `ItemsLayout`, рядок підсумку, `ItemList` і `ItemCard`, `ItemDetail`, `ItemTotals`, `NotFound`; `client`: `App` (адреса з `location.hash`), кеш, роутер, `ScreenBoundary`, `ItemsScreen` (фільтр, пошук, `useTransition`), `ItemForm`, перемикач «Позначити отриманим», видалення з підтвердженням, `QueryState`, `SummaryRoute`. Під деревом чесно запиши: позначки описують задум, не нинішній код — зараз «серверні» компоненти читають дані хуком або отримують обробники, тож для сервера вони мали б отримувати дані як props, а перемикачі стали б маленькими клієнтськими компонентами всередині.

    **3. Що ніколи не перетинає межу.** Розділ «Never crosses to the client»: доступ до сховища (`data/api.ts` з `localStorage`, `storage/`); будь-який майбутній ключ — у `.env`, читається через `process.env` лише на сервері й ніколи не імпортується файлом, який імпортує `main.tsx` (esbuild кладе все імпортоване в публічний `dist/`); функції як props від серверного компонента (`onToggle`, `onRemove` створюються в клієнтських); модулі лише для браузера — `ui/router.tsx` (`location.hash`, `window.history`), `ui/profile.ts` і `data/api.ts` (читають `location.search` і `localStorage` уже під час завантаження модуля) — на сервері вони впадуть. І `#/items/…` сервер не бачить узагалі: для серверного рендерингу потрібні звичайні шляхи `/items/…`.

    **4. Один ризик гідратації — виміряй те, що можна.** `LOCALE` у `ui/format.js` фіксований, тож мова браузера не втручається. Але ми викликали той самий `Intl.NumberFormat`, що й `formatPrice`, у Node.js 25.2.1 (там був би серверний рендер) і в Chrome 154 (там гідратація): `formatPrice(1250, "uk-UA")` — `1 250 ₴` у Node.js і `1 250 грн` у Chrome; з `"en-US"` — однаково `UAH 1,250`; без локалі — `UAH 1,250` (Node.js, `en-US`) проти `1.250 UAH` (Chrome у `de-DE`). Передбачення: з `"uk-UA"` серверний HTML має `365 ₴`, а перший рендер клієнта — `365 грн`, React 19 повідомить про розбіжність гідратації й перемалює підсумок на клієнті. Вихід, який спробуємо в NO-13: форматувати один раз на сервері й надіслати текст або надіслати число й форматувати лише на клієнті після монтування. Для планувальника й звичок ризик — «сьогодні» з `new Date()` під час рендеру: Node.js на нашому комп’ютері в `Europe/Madrid`, контекст Chrome — у `Pacific/Auckland`; зараз день передається з `main.tsx`, і так має лишитися.

    **5. Як це перевірить NO-13.** Останній розділ: той самий компонент з тими самими даними — `renderToString` у Node.js, HTML у сторінку, `hydrateRoot` у Chrome, і Console покаже помилку гідратації з текстом, що різниться; потім вихід — і помилки немає. Познач, що це передбачення (unconfirmed): виміряно лише виводи форматера й часові пояси.

    **6. Код не змінився.** `git status --short` — лише `?? docs/boundary-review.md`. `npm test` — `Пройшли: 37 · не пройшли: 0`, як після попереднього кроку.

    **7. Commit.** `git add -A`, `git commit -m "Review the server and client boundary on paper"` — `[main 3a2868c] Review the server and client boundary on paper` і `1 file changed, 82 insertions(+)`.

    **Самоперевірка:** кожен вузол дерева має `server` або `client` з причиною; у списку «never crosses» є сховище, ключі, функції й модулі лише для браузера; ризик гідратації спирається на справжній код твого проєкту (файл і функцію) і позначений як неперевірений; `git diff HEAD~1 --stat` — лише `docs/boundary-review.md`.

    **Якщо щось пішло не так:** у твоєму Node.js і Chrome обидва виводи однакові — це теж результат: запиши версії й передбач інший ризик з того, що реально читає браузер під час рендеру (годинник, `localStorage`, `location`).

    Еталон кроку — `Завантажити: RE-11 — Межа сервера й клієнта на папері` після експорту. Виміри зроблено лише на macOS у Node.js 25.2.1 і Chrome 154; в інших версіях дані локалей можуть бути іншими.
  en: |
    A design review without code: where the boundary between server and client would run in your project, what never crosses it, and where the server and the browser are most likely to disagree during hydration. The result is `docs/boundary-review.md`; the app code does not change. The server and hydration are checked for real in NO-13.

    | Project | Server (examples) | Client (examples) | Predicted hydration risk |
    |---|---|---|---|
    | Wishlist | list, cards, `ItemTotals` | form, “acquired” toggle, delete | `price` through `formatPrice` |
    | Planner | list, cards, `DueToday` | “done” toggle, priority select | “today” from the clock instead of the passed-in day |
    | Habit tracker | list, cards, `HabitStreaks` | “done today”, pause | the streak with the client's current day |
    | Expense tracker | list, cards, `CategoryTotals` | form, category filter | `amountMinor` through `formatMoney` |

    Below is the wishlist; the file was written for all four projects.

    **1. The starting state.** `cd ~/js-course/wishlist`, `git status` — clean, `git log --oneline -1` — the commit of the lazy route step.

    **2. The component tree.** Create `docs/boundary-review.md` and in the section “The component tree” draw the tree (`App` → the cache provider → `Router` → the layout → the screens and their parts) with a mark for every node: `server` — only turns the data it is given into markup; `client` — needs the browser: state, effects, event handlers, browser objects. For us `server`: `ItemsLayout`, the summary line, `ItemList` and `ItemCard`, `ItemDetail`, `ItemTotals`, `NotFound`; `client`: `App` (the address from `location.hash`), the cache, the router, `ScreenBoundary`, `ItemsScreen` (filter, search, `useTransition`), `ItemForm`, the “Mark as acquired” toggle, delete with the confirmation, `QueryState`, `SummaryRoute`. Under the tree write honestly: the marks describe the design, not today's code — today the “server” components read their data through a hook or take handlers, so for a server they would take the data as props, and the toggles would become small client components inside them.

    **3. What never crosses.** The section “Never crosses to the client”: storage access (`data/api.ts` with `localStorage`, `storage/`); any future key — in `.env`, read with `process.env` on the server only and never imported by a file that `main.tsx` imports (esbuild puts everything imported into the public `dist/`); functions as props from a server component (`onToggle`, `onRemove` are created in client ones); browser-only modules — `ui/router.tsx` (`location.hash`, `window.history`), `ui/profile.ts` and `data/api.ts` (they read `location.search` and `localStorage` as soon as the module loads) — would throw on a server. And a server never sees `#/items/…` at all: server rendering needs plain paths `/items/…`.

    **4. One hydration risk — measure what you can.** `LOCALE` in `ui/format.js` is fixed, so the browser's language does not enter. But we made the same `Intl.NumberFormat` call as `formatPrice` in Node.js 25.2.1 (where a server render would run) and in Chrome 154 (where hydration runs): `formatPrice(1250, "uk-UA")` — `1 250 ₴` in Node.js and `1 250 грн` in Chrome; with `"en-US"` — `UAH 1,250` in both; with no locale — `UAH 1,250` (Node.js, `en-US`) against `1.250 UAH` (Chrome in `de-DE`). The prediction: with `"uk-UA"` the server HTML has `365 ₴` and the client's first render `365 грн`; React 19 reports a hydration mismatch and re-renders the summary on the client. The way out to try in NO-13: format once on the server and send the text, or send the number and format it only on the client after mounting. For the planner and habits the risk is “today” from `new Date()` during render: Node.js on our computer is in `Europe/Madrid`, a Chrome context in `Pacific/Auckland`; today the day is passed in from `main.tsx`, and it should stay so.

    **5. How NO-13 will check it.** The last section: the same component with the same data — `renderToString` in Node.js, the HTML into the page, `hydrateRoot` in Chrome, and the Console shows a hydration error with the differing text; then the way out — and no error. Mark it as a prediction (unconfirmed): only the formatter outputs and the time zones were measured.

    **6. The code did not change.** `git status --short` — only `?? docs/boundary-review.md`. `npm test` — `Passed: 37 · failed: 0`, as after the previous step.

    **7. Commit.** `git add -A`, `git commit -m "Review the server and client boundary on paper"` — `[main 67f42e0] Review the server and client boundary on paper` and `1 file changed, 82 insertions(+)`.

    **Self-check:** every node of the tree has `server` or `client` with a reason; the “never crosses” list has storage, keys, functions and browser-only modules; the hydration risk rests on your project's real code (a file and a function) and is marked as unconfirmed; `git diff HEAD~1 --stat` — only `docs/boundary-review.md`.

    **If something goes wrong:** your Node.js and Chrome give the same output — that is a result too: write down the versions and predict another risk from what the browser really reads during render (the clock, `localStorage`, `location`).

    The step's reference is `Download: RE-11 — The server–client boundary on paper` after the export. The measurements were made only on macOS in Node.js 25.2.1 and Chrome 154; other versions may carry different locale data.
purpose:
  uk: "Це крок твого проєкту: модель CSR/SSR, межу серверних і клієнтських компонентів, серіалізацію й секрети з цього розділу ти застосовуєш до власного застосунку — на рівні дизайну. Платформа цей крок не перевіряє: доказ — `docs/boundary-review.md` і commit без змін коду."
  en: "This is a step of your project: you apply this unit's CSR/SSR model, the server/client component boundary, serialization and secrets to your own app — at the design level. The platform does not check this step: the evidence is `docs/boundary-review.md` and a commit without code changes."
objectives:
  - uk: "Позначити в дереві компонентів проєкту серверні й клієнтські частини з причиною й перелічити, що ніколи не перетинає межу."
    en: "Mark the server and client parts of the project's component tree with a reason and list what never crosses the boundary."
  - uk: "Передбачити один ризик гідратації, що спирається на справжній код проєкту, виміряти те, що можна виміряти без сервера, і описати перевірку в NO-13."
    en: "Predict one hydration risk that rests on the project's real code, measure what can be measured without a server and describe the check in NO-13."
transfer:
  uk: "Цей крок виконується в редакторі й терміналі на твоєму комп’ютері: що написати, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor and a terminal on your computer: what to write, the expected output and the self-check list are above and on the step's page in your project."
