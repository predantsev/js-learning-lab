# Planner variant of step JS-01. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  projectTitle: { uk: "Планувальник", en: "Planner" }
  nameLabel: { uk: "Справа", en: "Task" }
  nameValue: { uk: "Полити квіти", en: "Water the plants" }
  valueLabel: { uk: "Термін", en: "Due date" }
  valueText: { uk: "2026-03-02", en: "2026-03-02" }
  valueCheck: { uk: "2026-03-02", en: "2026-03-02" }
  imageAlt: { uk: "Планшет зі списком справ, дві з них позначено", en: "A clipboard with a to-do list, two items ticked" }
instructions:
  uk: |
    Перед тобою стартова сторінка проєкту. Натисни **Запустити** й подивись на сторінку та консоль. Потім зміни файл `index.html`:

    1. Текст «%%startTitle%%» трапляється двічі: у `<title>` (назва вкладки) і в заголовку `<h1>`. Заміни обидва на назву проєкту — **%%projectTitle%%**.
    2. Після абзаців усередині `<main>` додай картинку з теки `images`: `<img src="images/task.svg" alt="...">`. В `alt` коротко опиши, що на картинці: цей текст прочитає людина, яка не бачить зображення.
    3. Нижче додай першу справу — два рядки, де кожне значення має підпис:
       - %%nameLabel%%: %%nameValue%%
       - %%valueLabel%%: %%valueText%%

       Дату пиши саме так, як тут (рік-місяць-день): у цьому форматі проєкт зберігатиме всі дати. Кожен рядок може бути окремим абзацом `<p>`; підійде й маленька таблиця з рядком заголовків.

    Запусти ще раз, переконайся, що сторінка показує все потрібне, і натисни **Перевірити крок**.
  en: |
    This is your project's starter page. Press **Run** and look at the page and the console. Then change `index.html`:

    1. The text “%%startTitle%%” appears twice: in `<title>` (the tab title) and in the `<h1>` heading. Replace both with the project name — **%%projectTitle%%**.
    2. After the paragraphs inside `<main>`, add the picture from the `images` folder: `<img src="images/task.svg" alt="...">`. In `alt`, briefly describe what the picture shows: a person who cannot see the image reads this text.
    3. Below it, add the first task — two lines where each value has a label:
       - %%nameLabel%%: %%nameValue%%
       - %%valueLabel%%: %%valueText%%

       Write the date exactly like this (year-month-day): the project will store every date in this format. Each line can be its own `<p>` paragraph; a small table with a header row works too.

    Run again, make sure the page shows everything, and press **Check step**.
nudge:
  uk: "Почни з пошуку: текст «%%startTitle%%» є у файлі двічі. Нові елементи додавай між `<main>` і `</main>`, після останнього `</p>`. У тега `<img>` немає закривального тега — лише атрибути `src` і `alt`."
  en: "Start by searching: “%%startTitle%%” appears in the file twice. Add new elements between `<main>` and `</main>`, after the last `</p>`. The `<img>` tag has no closing tag — only the `src` and `alt` attributes."
testTitles:
  "page keeps its main landmark":
    uk: "На сторінці лишається один елемент `<main>`"
    en: "The page still has one `<main>` element"
  "tab title names the project":
    uk: "Назва вкладки (`<title>`) містить «%%projectTitle%%»"
    en: "The tab title (`<title>`) contains “%%projectTitle%%”"
  "heading names the project":
    uk: "Заголовок `<h1>` у `<main>` містить «%%projectTitle%%»"
    en: "The `<h1>` heading inside `<main>` contains “%%projectTitle%%”"
  "record name is shown with its label":
    uk: "Справа показана з підписом: «%%nameLabel%%: %%nameValue%%»"
    en: "The task is shown with its label: “%%nameLabel%%: %%nameValue%%”"
  "second value is shown with its label":
    uk: "Термін показано з підписом: «%%valueLabel%%: %%valueText%%»"
    en: "The due date is shown with its label: “%%valueLabel%%: %%valueText%%”"
  "picture has alt text and is shown":
    uk: "Картинка `images/task.svg` показана й має текст `alt`"
    en: "The picture `images/task.svg` is shown and has `alt` text"
feedback:
  - when: { test: "page keeps its main landmark" }
    message:
      uk: "Елемент `<main>` зник або їх став не один. Залиш один `<main>` навколо вмісту сторінки: так допоміжні технології знаходять головну частину."
      en: "The `<main>` element is gone or there is more than one. Keep a single `<main>` around the page content: assistive technology uses it to find the main part."
  - when: { test: "tab title names the project" }
    message:
      uk: "Знайди в `<head>` рядок `<title>%%startTitle%%</title>` і заміни текст між тегами на «%%projectTitle%%»."
      en: "Find the line `<title>%%startTitle%%</title>` in `<head>` and replace the text between the tags with “%%projectTitle%%”."
  - when: { test: "heading names the project" }
    message:
      uk: "Заголовок `<h1>` має бути всередині `<main>` і містити «%%projectTitle%%». Зміни текст між `<h1>` і `</h1>`."
      en: "The `<h1>` heading must be inside `<main>` and contain “%%projectTitle%%”. Change the text between `<h1>` and `</h1>`."
  - when: { test: "record name is shown with its label" }
    message:
      uk: "Додай у `<main>` рядок, де поруч стоять підпис і значення, наприклад `<p>%%nameLabel%%: %%nameValue%%</p>`. Підпис і значення мають бути в одному абзаці або в одній таблиці."
      en: "Add a line inside `<main>` where the label and the value stand together, for example `<p>%%nameLabel%%: %%nameValue%%</p>`. The label and the value must be in the same paragraph or the same table."
  - when: { test: "second value is shown with its label" }
    message:
      uk: "Додай ще один рядок із підписом, наприклад `<p>%%valueLabel%%: %%valueText%%</p>`. Перевір і формат дати: рік-місяць-день, через дефіси."
      en: "Add one more labeled line, for example `<p>%%valueLabel%%: %%valueText%%</p>`. Check the date format too: year-month-day, with hyphens."
  - when: { test: "picture has alt text and is shown" }
    message:
      uk: "Потрібен тег `<img>` усередині `<main>` з двома атрибутами: `src=\"images/task.svg\"` (шлях до файла від `index.html`) і `alt` з коротким описом. Якщо картинки не видно в перегляді, перевір назву теки й файла — у консолі буде підказка."
      en: "You need an `<img>` tag inside `<main>` with two attributes: `src=\"images/task.svg\"` (the path from `index.html`) and `alt` with a short description. If the picture does not appear in the preview, check the folder and file name — the console shows a hint."
