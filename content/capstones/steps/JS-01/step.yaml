# Capstone step of unit JS-01 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-01-10-capstone-starter-page from this file.
unit: JS-01
mode: in-platform
entry: index.html
title:
  uk: "Стартова сторінка проєкту"
  en: "Your project's starter page"
intro:
  uk: |
    Твій [[capstone|наскрізний проєкт]] починається з маленької сторінки. Вона складається з трьох файлів: `index.html` — розмітка, `styles.css` — оформлення, `app.js` — модуль JavaScript, який поки лише пише кілька рядків у консоль. У теці `images` лежить картинка для проєкту.

    На цьому кроці ти робиш зі сторінкою те саме, що в уроках розділу: **запускаєш, змінюєш і дивишся на результат**. Ти даси сторінці назву свого проєкту, додаси картинку з текстом `alt` і перший запис із підписами.

    Працюєш на екрані **«Мій проєкт»**: там завдання для твого варіанта, редактор файлів, перегляд сторінки й перевірки. Крок зараховується, лише коли перевірки платформи проходять на твоїх файлах.
  en: |
    Your [[capstone|capstone project]] starts as a small page made of three files: `index.html` — the markup, `styles.css` — the styles, and `app.js` — a JavaScript module that for now only prints a few lines to the console. The `images` folder holds a picture for the project.

    In this step you do with the page what you did in the unit's lessons: **run it, change it and look at the result**. You give the page your project's name, add the picture with `alt` text and a first record with labels.

    You work on the **My project** screen: it has the task for your variant, a file editor, the page preview and the checks. The step counts only when the platform checks pass on your own files.
purpose:
  uk: "Це крок твого проєкту: усе, що вивчено в розділі, ти застосовуєш до власної стартової сторінки. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply what the unit taught to your own starter page. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Запустити стартову сторінку проєкту й знайти її результат у перегляді та консолі."
    en: "Run the project's starter page and find its result in the preview and the console."
  - uk: "Змінити назву вкладки й заголовок `<h1>` на назву свого проєкту."
    en: "Change the tab title and the `<h1>` heading to your project's name."
  - uk: "Додати картинку з текстом `alt` і один запис із підписаними значеннями."
    en: "Add a picture with `alt` text and one record with labeled values."
transfer:
  uk: "Відкрий цей крок у своєму проєкті. Там є завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередніх кроків бракує, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are missing, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
