# Habit tracker variant of step NO-01 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS (Node.js 25.2.1, npm 11.6.2, TypeScript 7.0.2) on the scratch project of this capstone after
# RE-12, in a Ukrainian and an English workspace; not run on Linux or Windows (the review of 2026-10-05 ran the
# wishlist on Node.js 22.13.1 with --experimental-strip-types and on 22.23.3).
instructions:
  uk: |
    Додай до проєкту теку `server/` зі скриптом для Node, що друкує виконання й серії активних звичок на заданий день. Платформа цей крок не перевіряє.

    1. `server/package.json`: `"type": "module"` (замість `"commonjs"` від `npm init -y`), скрипти `summary` і `typecheck`, `npm install -D typescript@7 @types/node@22`; `server/tsconfig.json` — як в уроці, з `"include": ["src/**/*.ts"]`.
    2. `src/config.ts`: `loadConfig(env)` — `LOCALE` `uk` або `en` (за замовчуванням `uk`) і обов’язкова `TODAY`: справжня дата `YYYY-MM-DD`; усі помилки разом.
    3. `src/fixtures.ts`: `loadFixtures()` читає `../../data/habits.json` від `import.meta.dirname` і пропускає записи через `parseHabitList`.
    4. `src/summary.ts`: для кожної звички з `filterHabits(habits, "active")` — кількість виконань до `TODAY` включно й серія з `streakOf` (`ui/streak.ts`, та сама функція, що у вебзастосунку); підписи мовою з `LOCALE`.
    5. `docs/server.md`, розділ «NO-01»; `git commit -m "Add server/ with a typed summary script"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `TODAY=2026-03-02 npm run summary` — 5 активних звичок; «%%fixture1Name%%» — виконань 3, серія 3; «%%fixture2Name%%» — 3 і 2; «%%fixture6Name%%» — 0 і 0. (Ще не виконаний `TODAY` серію не обриває: тоді `streakOf` рахує до вчора.)
    - Без `TODAY` — `TODAY is required, for example TODAY=2026-03-01`; `TODAY=2026-02-31` — `TODAY must be a real date YYYY-MM-DD, got "2026-02-31"`; обидва — код виходу `1`, без стеку.
    - Без `data/habits.json` — `Не вдалося прочитати …` і код `1`.
    - З кореня проєкту `TODAY=2026-03-02 node server/src/summary.ts` — той самий підсумок, що й у `server/`.
    - `npm run typecheck` — жодного рядка від `tsc`; `git status` після commit — чисто, `server/node_modules/` не в Git.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Add a `server/` folder with a Node script that prints the completions and streaks of the active habits on a given day. The platform does not check this step.

    1. `server/package.json`: `"type": "module"` (instead of the `"commonjs"` of `npm init -y`), the scripts `summary` and `typecheck`, `npm install -D typescript@7 @types/node@22`; `server/tsconfig.json` — as in the lesson, with `"include": ["src/**/*.ts"]`.
    2. `src/config.ts`: `loadConfig(env)` — `LOCALE` `uk` or `en` (`uk` by default) and a required `TODAY`: a real date `YYYY-MM-DD`; all errors together.
    3. `src/fixtures.ts`: `loadFixtures()` reads `../../data/habits.json` from `import.meta.dirname` and passes the records through `parseHabitList`.
    4. `src/summary.ts`: for every habit of `filterHabits(habits, "active")` — the number of completions up to and including `TODAY` and the streak from `streakOf` (`ui/streak.ts`, the same function the web app uses); the labels in the language of `LOCALE`.
    5. `docs/server.md`, a section “NO-01”; `git commit -m "Add server/ with a typed summary script"`.

    **Self-check — confirm every item yourself:**

    - `TODAY=2026-03-02 npm run summary` — 5 active habits; “%%fixture1Name%%” — 3 completions, streak 3; “%%fixture2Name%%” — 3 and 2; “%%fixture6Name%%” — 0 and 0. (A `TODAY` that is not completed yet does not break the streak: `streakOf` then counts up to yesterday.)
    - Without `TODAY` — `TODAY is required, for example TODAY=2026-03-01`; `TODAY=2026-02-31` — `TODAY must be a real date YYYY-MM-DD, got "2026-02-31"`; both — exit code `1`, no stack trace.
    - Without `data/habits.json` — `Не вдалося прочитати …` (with `LOCALE=en`: `Cannot read …`) and exit code `1`.
    - From the project root `TODAY=2026-03-02 node server/src/summary.ts` — the same summary as in `server/`.
    - `npm run typecheck` — not a single line from `tsc`; `git status` after the commit — clean, `server/node_modules/` is not in Git.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
