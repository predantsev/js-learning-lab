# Expense tracker variant of step NO-01 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS (Node.js 25.2.1, npm 11.6.2, TypeScript 7.0.2) on the scratch project of this capstone after
# RE-12, in a Ukrainian and an English workspace; not run on Linux or Windows (the review of 2026-10-05 ran the
# wishlist on Node.js 22.13.1 with --experimental-strip-types and on 22.23.3).
instructions:
  uk: |
    Додай до проєкту теку `server/` зі скриптом для Node, що друкує суми за категоріями й загальну суму. Платформа цей крок не перевіряє.

    1. `server/package.json`: `"type": "module"` (замість `"commonjs"` від `npm init -y`), скрипти `summary` і `typecheck`, `npm install -D typescript@7 @types/node@22`; `server/tsconfig.json` — як в уроці, з `"include": ["src/**/*.ts"]`.
    2. `src/config.ts`: `loadConfig(env)` — `LOCALE` `uk` або `en` (за замовчуванням `uk`), усі помилки разом.
    3. `src/fixtures.ts`: `loadFixtures()` читає `../../data/expenses.json` від `import.meta.dirname` і пропускає записи через `parseExpenseList`.
    4. `src/summary.ts`: сума кожної із чотирьох категорій і загальна сума з `summarizeExpenses` — у цілих копійках; `src/format.ts` ділить на 100 лише для виводу (`Intl.NumberFormat` з валютою `UAH`); підписи й назви категорій мовою з `LOCALE`.
    5. `docs/server.md`, розділ «NO-01»; `git commit -m "Add server/ with a typed summary script"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm run summary` — «Їжа» 1 056,00 ₴, «Транспорт» 520,00 ₴, «Дім» 99,90 ₴, «Розваги» 480,00 ₴, «Разом» 2 155,90 ₴; `LOCALE=en npm run summary` — `Food: UAH 1,056.00` … `Total: UAH 2,155.90`.
    - `LOCALE=ua node src/summary.ts` — повідомлення з `"ua"` і код виходу `1`, без стеку.
    - Без `data/expenses.json` — `Не вдалося прочитати …` і код `1`.
    - З кореня проєкту `node server/src/summary.ts` — той самий підсумок, що й у `server/`.
    - `npm run typecheck` — жодного рядка від `tsc`; `git status` після commit — чисто, `server/node_modules/` не в Git.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Add a `server/` folder with a Node script that prints the total of every category and the overall total. The platform does not check this step.

    1. `server/package.json`: `"type": "module"` (instead of the `"commonjs"` of `npm init -y`), the scripts `summary` and `typecheck`, `npm install -D typescript@7 @types/node@22`; `server/tsconfig.json` — as in the lesson, with `"include": ["src/**/*.ts"]`.
    2. `src/config.ts`: `loadConfig(env)` — `LOCALE` `uk` or `en` (`uk` by default), all errors together.
    3. `src/fixtures.ts`: `loadFixtures()` reads `../../data/expenses.json` from `import.meta.dirname` and passes the records through `parseExpenseList`.
    4. `src/summary.ts`: the total of each of the four categories and the overall total from `summarizeExpenses` — in whole kopiykas; `src/format.ts` divides by 100 only for the output (`Intl.NumberFormat` with the currency `UAH`); the labels and the category names in the language of `LOCALE`.
    5. `docs/server.md`, a section “NO-01”; `git commit -m "Add server/ with a typed summary script"`.

    **Self-check — confirm every item yourself:**

    - `npm run summary` — “Їжа” 1 056,00 ₴, “Транспорт” 520,00 ₴, “Дім” 99,90 ₴, “Розваги” 480,00 ₴, “Разом” 2 155,90 ₴; `LOCALE=en npm run summary` — `Food: UAH 1,056.00` … `Total: UAH 2,155.90`.
    - `LOCALE=ua node src/summary.ts` — a message with `"ua"` and exit code `1`, no stack trace.
    - Without `data/expenses.json` — `Не вдалося прочитати …` (with `LOCALE=en`: `Cannot read …`) and exit code `1`.
    - From the project root `node server/src/summary.ts` — the same summary as in `server/`.
    - `npm run typecheck` — not a single line from `tsc`; `git status` after the commit — clean, `server/node_modules/` is not in Git.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
