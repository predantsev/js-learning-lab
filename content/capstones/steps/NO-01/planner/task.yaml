# Planner variant of step NO-01 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS (Node.js 25.2.1, npm 11.6.2, TypeScript 7.0.2) on the scratch project of this capstone after
# RE-12, in a Ukrainian and an English workspace; not run on Node.js 22, Linux or Windows.
instructions:
  uk: |
    Додай до проєкту теку `server/` зі скриптом для Node, що друкує, які справи треба зробити до заданого дня. Платформа цей крок не перевіряє.

    1. `server/package.json`: `"type": "module"` (замість `"commonjs"` від `npm init -y`), скрипти `summary` і `typecheck`, `npm install -D typescript@7 @types/node@22`; `server/tsconfig.json` — як в уроці, з `"include": ["src/**/*.ts"]`.
    2. `src/config.ts`: `loadConfig(env)` — `LOCALE` `uk` або `en` (за замовчуванням `uk`) і обов’язкова `TODAY`: справжня дата `YYYY-MM-DD`; усі помилки разом.
    3. `src/fixtures.ts`: `loadFixtures()` читає `../../data/tasks.json` від `import.meta.dirname` і пропускає записи через `parseTaskList`.
    4. `src/summary.ts`: `countDueTasks(tasks, today)` і назви цих справ у порядку `sortTasks`; підписи мовою з `LOCALE`.
    5. `docs/server.md`, розділ «NO-01»; `git commit -m "Add server/ with a typed summary script"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `TODAY=2026-03-02 npm run summary` — 2 справи: «%%fixture2Name%%» (2026-03-01) і «%%fixture1Name%%» (2026-03-02); з `TODAY=2026-03-01` — одна.
    - Без `TODAY` — `TODAY is required, for example TODAY=2026-03-01`; `TODAY=2026-02-31` — `TODAY must be a real date YYYY-MM-DD, got "2026-02-31"`; обидва — код виходу `1`, без стеку.
    - Без `data/tasks.json` — `Не вдалося прочитати …` і код `1`.
    - `npm run typecheck` — жодного рядка; `git status` після commit — чисто, `server/node_modules/` не в Git.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Add a `server/` folder with a Node script that prints which tasks are due by a given day. The platform does not check this step.

    1. `server/package.json`: `"type": "module"` (instead of the `"commonjs"` of `npm init -y`), the scripts `summary` and `typecheck`, `npm install -D typescript@7 @types/node@22`; `server/tsconfig.json` — as in the lesson, with `"include": ["src/**/*.ts"]`.
    2. `src/config.ts`: `loadConfig(env)` — `LOCALE` `uk` or `en` (`uk` by default) and a required `TODAY`: a real date `YYYY-MM-DD`; all errors together.
    3. `src/fixtures.ts`: `loadFixtures()` reads `../../data/tasks.json` from `import.meta.dirname` and passes the records through `parseTaskList`.
    4. `src/summary.ts`: `countDueTasks(tasks, today)` and the titles of those tasks in the order of `sortTasks`; the labels in the language of `LOCALE`.
    5. `docs/server.md`, a section “NO-01”; `git commit -m "Add server/ with a typed summary script"`.

    **Self-check — confirm every item yourself:**

    - `TODAY=2026-03-02 npm run summary` — 2 tasks: “%%fixture2Name%%” (2026-03-01) and “%%fixture1Name%%” (2026-03-02); with `TODAY=2026-03-01` — one.
    - Without `TODAY` — `TODAY is required, for example TODAY=2026-03-01`; `TODAY=2026-02-31` — `TODAY must be a real date YYYY-MM-DD, got "2026-02-31"`; both — exit code `1`, no stack trace.
    - Without `data/tasks.json` — `Не вдалося прочитати …` (with `LOCALE=en`: `Cannot read …`) and exit code `1`.
    - `npm run typecheck` — not a single line; `git status` after the commit — clean, `server/node_modules/` is not in Git.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
