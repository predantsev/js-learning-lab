# Capstone step of unit NO-01 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson of kind capstone-step of NO-01 from this file.
# A local step: done in the learner's editor and terminal; no platform checks. The project page shows only
# the intro of a local step, so the intro carries the whole procedure.
# Every command was run on macOS (Node.js 25.2.1, npm 11.6.2, TypeScript 7.0.2, @types/node 22.20.5) in a
# scratch home on all four projects, continuing the RE-12 scratch projects (Ukrainian workspaces):
# npm init -y, npm install -D typescript@7 @types/node@22, npm run summary with LOCALE=uk/en (and TODAY in the
# planner and the habit tracker), an invalid LOCALE or TODAY (exit code 1), a missing and a damaged fixtures
# file (exit code 1), npm run typecheck, the commit. Deliberately wrong variants were run and failed as quoted:
# a relative import without .ts (ERR_MODULE_NOT_FOUND), server/package.json without "type": "module"
# (MODULE_TYPELESS_PACKAGE_JSON warning), a type imported without `import type` (SyntaxError at run time,
# TS1484 in tsc), a type error (TS2339 in tsc while node still ran), "types": [] (TS2591). Review 2026-10-05
# also ran the wishlist on Node.js 22.13.1 (ERR_UNKNOWN_FILE_EXTENSION without the flag, the same three lines
# after an ExperimentalWarning with --experimental-strip-types, tsc -p . clean) and 22.23.3 (no flag needed).
# Not run: Linux, Windows. Quoted output is from the wishlist run.
# reference/ is the RE-12 reference plus server/ (without node_modules/ and package-lock.json) and docs/server.md.
unit: NO-01
mode: local
entry: index.html
title:
  uk: "Тека server/: типізований Node-скрипт"
  en: "server/: a typed Node script"
intro:
  uk: |
    У твоєму проєкті з’являється перша частина, яку виконує Node.js, а не браузер: тека `server/` у тому самому проєкті `~/js-course/<проєкт>`. Скрипт `server/src/summary.ts` читає стартові записи вебзастосунку з `data/`, перевіряє їх тим самим контрактом, що й відповідь API, бере налаштування з оточення через `loadConfig` і друкує підсумок. Доменні функції з `domain/` він імпортує без змін — вони не знають ні про сторінку, ні про `document`.

    | Проєкт | Фікстури | Змінні оточення | Що друкує |
    |---|---|---|---|
    | Список бажань | `data/wishes.json` через `parseItemList` | `LOCALE` | кількість, «Ще хочу на суму» з `summarizeItems`, бажані без ціни |
    | Планувальник | `data/tasks.json` через `parseTaskList` | `LOCALE`, `TODAY` | скільки невиконаних справ мають термін до `TODAY` включно, з назвами |
    | Трекер звичок | `data/habits.json` через `parseHabitList` | `LOCALE`, `TODAY` | для кожної активної звички — виконання до `TODAY` і серію з `streakOf` (`ui/streak.ts`) |
    | Трекер витрат | `data/expenses.json` через `parseExpenseList` | `LOCALE` | суми категорій і загальну суму з `summarizeExpenses`, у копійках, форматовані лише для виводу |

    `LOCALE` (`uk` або `en`, за замовчуванням `uk`) обирає мову підписів; назви записів лишаються мовою твого проєкту — вони з файла даних. `TODAY` — обов’язкова справжня дата `YYYY-MM-DD`: `2026-02-31` не проходить.

    Перевірено на macOS (Node.js 25.2.1, npm 11.6.2, TypeScript 7.0.2) на всіх чотирьох проєктах; нижче — вивід «Списку бажань» в українському проєкті. Node.js 22: за документацією Node.js 22 (сторінка [Modules: TypeScript](https://nodejs.org/docs/latest-v22.x/api/typescript.html)) type stripping увімкнено за замовчуванням від 22.18 — у нас на 22.23.3 `node src/summary.ts` надрукував той самий вивід без прапорця. У 22.13–22.17 замість `npm run summary` запускай `node --experimental-strip-types src/summary.ts`: у нас на 22.13.1 без прапорця — `ERR_UNKNOWN_FILE_EXTENSION`, із прапорцем — спершу `ExperimentalWarning`, а тоді той самий підсумок. Форма `LOCALE=en node …` — для терміналів macOS і Linux; Linux і Windows не перевірялися.

    **1. Стан на початку.** `cd ~/js-course/wishlist`, `git status` — чисто, `git log --oneline -1` — commit випуску 1.0.0.

    **2. Пакет `server/`.** `mkdir -p server/src`, `cd server`, `npm init -y`. Увага: npm 11 пише в новий `package.json` рядок `"type": "commonjs"` — заміни його на `"type": "module"`, інакше файли `.ts` у `server/` не вважатимуться ES-модулями. Додай скрипти `"summary": "node src/summary.ts"` і `"typecheck": "tsc -p ."` і `"engines": { "node": ">=22.13" }`. Потім `npm install -D typescript@7 @types/node@22` — у нас `added 4 packages`, у `package.json` — `"@types/node": "^22.20.5"` і `"typescript": "^7.0.2"`. Тека `server/node_modules/` у Git не потрапляє: її вже відкидає рядок `node_modules/` у `.gitignore` проєкту.

    **3. `server/tsconfig.json`.** Ті самі налаштування, що в уроці про TypeScript у Node: `strict`, `noEmit`, `"target": "es2023"`, `"module": "nodenext"`, `"types": ["node"]`, `allowImportingTsExtensions`, `verbatimModuleSyntax`, `erasableSyntaxOnly` — і `"include": ["src/**/*.ts"]`. `tsc` іде за імпортами, тож перевіряє й `domain/` та `data/model.ts`, які скрипт імпортує.

    **4. `src/config.ts`.** `loadConfig(env)` повертає `{ ok: true, value }` або `{ ok: false, errors }` зі списком **усіх** помилок; кожне повідомлення називає змінну й отримане значення: `LOCALE must be uk or en, got "ua"`.

    **5. `src/fixtures.ts`.** `loadFixtures()` будує шлях від `import.meta.dirname` (`../../data/wishes.json`), а не від робочої теки, читає файл через `readFile` з `node:fs/promises` з кодуванням `utf8`, перевіряє `{ schemaVersion: 1, records }` і пропускає записи через `parseItemList` з `data/model.ts`. `JSON.parse(…) as Wish[]` — це обіцянка, яку ніхто не перевіряє. Типи імпортуються як `import type { Wish }`, відносні імпорти — з розширенням `.ts`.

    **6. `src/summary.ts`.** `main()` повертає код виходу: невдала конфігурація — повідомлення в stderr і `1`; файл не читається — `Не вдалося прочитати <шлях>: …` і `1`; усе гаразд — підсумок і `0`. В останньому рядку `process.exitCode = await main();`, а не `process.exit()`. У `try` — лише завантаження, щоб помилку в коді нижче не видати за пошкоджений файл.

    **7. Запуск.** `npm run summary` — у нас:

    ```text
    Бажань: 6
    Ще хочу на суму: 365 ₴
    Бажаних без ціни: 1
    ```

    `LOCALE=en npm run summary` — `Wishes: 6`, `Still wanted for: UAH 365`, `Wanted without a price: 1`. `LOCALE=ua node src/summary.ts; echo "exit $?"` — `LOCALE must be uk or en, got "ua"` і `exit 1`. Перейменуй на хвилину `data/wishes.json` — `Не вдалося прочитати …/data/wishes.json: ENOENT: no such file or directory, …` і код `1`; поверни назву.

    **8. Типи.** `npm run typecheck` — після двох рядків заголовка npm (`> … typecheck`, `> tsc -p .`) жодного рядка від `tsc`. Перевір, що це справді перевірка: допиши на хвилину `.toUpperCase()` після `summary.wantedWithoutPrice` — `tsc` пише `error TS2339: Property 'toUpperCase' does not exist on type 'number'.`, а `node src/summary.ts` усе одно запускається: друкує два рядки підсумку й лише тоді падає з `TypeError: summary.wantedWithoutPrice.toUpperCase is not a function` і кодом `1`. Прибери зміну.

    **9. Доказ і commit.** У `docs/server.md` — розділ «NO-01»: версії, команди й побачений вивід кроків 7 і 8. `cd ..`, `git add -A`, `git status --short` — лише `docs/server.md` і файли `server/` (без `node_modules/`), `git commit -m "Add server/ with a typed summary script"`.

    **Самоперевірка:** `server/package.json` має `"type": "module"`; кожен відносний імпорт — з `.ts`, типи — через `import type`; `loadConfig` повертає всі помилки разом; невірне значення з оточення дає повідомлення й код `1`, а не стек; фікстури проходять `parse…List`; з кореня проєкту `node server/src/summary.ts` друкує той самий підсумок, що й `npm run summary` у `server/` (шлях від `import.meta.dirname`, а не від робочої теки); `npm run typecheck` — без помилок; `git status` після commit — чисто.

    **Якщо щось не так:** `ERR_MODULE_NOT_FOUND … Cannot find module '…/server/src/config'` — у відносному імпорті немає `.ts`. Попередження `MODULE_TYPELESS_PACKAGE_JSON` — у `server/package.json` немає `"type": "module"` (у нас Node 25 після нього все ж запустив файл). `SyntaxError: The requested module '../../domain/wishes.ts' does not provide an export named 'Wish'` — тип імпортовано без `import type` (`tsc` про це ж каже `TS1484`). `error TS2591: Cannot find name 'node:fs/promises'` — не встановлено `@types/node` або в `tsconfig.json` немає `"types": ["node"]`. `ERR_UNKNOWN_FILE_EXTENSION ".ts"` — Node старіший за 22.18 запущено без прапорця (у нас — на Node 22.13.1).

    Референс кроку — `Завантажити: NO-01 — Тека server/: типізований Node-скрипт` після експорту; відкрий його після власної спроби.
  en: |
    Your project gets its first part that Node.js runs instead of the browser: a `server/` folder inside the same project `~/js-course/<project>`. The script `server/src/summary.ts` reads the web app's starting records from `data/`, checks them with the same contract as an API answer, takes its settings from the environment through `loadConfig` and prints a summary. It imports the domain functions of `domain/` unchanged — they know nothing about a page or `document`.

    | Project | Fixtures | Environment variables | What it prints |
    |---|---|---|---|
    | Wishlist | `data/wishes.json` through `parseItemList` | `LOCALE` | the count, the wanted total from `summarizeItems`, the wanted wishes without a price |
    | Planner | `data/tasks.json` through `parseTaskList` | `LOCALE`, `TODAY` | how many pending tasks are due on or before `TODAY`, with their titles |
    | Habit tracker | `data/habits.json` through `parseHabitList` | `LOCALE`, `TODAY` | for every active habit, its completions up to `TODAY` and its streak from `streakOf` (`ui/streak.ts`) |
    | Expense tracker | `data/expenses.json` through `parseExpenseList` | `LOCALE` | the category totals and the overall total from `summarizeExpenses`, in kopiykas, formatted only for the output |

    `LOCALE` (`uk` or `en`, `uk` by default) picks the language of the labels; record names stay in your project's language — they come from the data file. `TODAY` is a required real date `YYYY-MM-DD`: `2026-02-31` does not pass.

    Checked on macOS (Node.js 25.2.1, npm 11.6.2, TypeScript 7.0.2) on all four projects; below is the output of the Wishlist in a Ukrainian project. Node.js 22: according to the Node.js 22 documentation (the page [Modules: TypeScript](https://nodejs.org/docs/latest-v22.x/api/typescript.html)) type stripping is on by default from 22.18 — for us on 22.23.3 `node src/summary.ts` printed the same output without a flag. On 22.13–22.17 run `node --experimental-strip-types src/summary.ts` instead of `npm run summary`: for us on 22.13.1 it was `ERR_UNKNOWN_FILE_EXTENSION` without the flag, and with it first an `ExperimentalWarning`, then the same summary. The form `LOCALE=en node …` is for macOS and Linux terminals; Linux and Windows were not checked.

    **1. The starting state.** `cd ~/js-course/wishlist`, `git status` — clean, `git log --oneline -1` — the commit of release 1.0.0.

    **2. The `server/` package.** `mkdir -p server/src`, `cd server`, `npm init -y`. Watch out: npm 11 writes the line `"type": "commonjs"` into the new `package.json` — replace it with `"type": "module"`, otherwise the `.ts` files in `server/` are not treated as ES modules. Add the scripts `"summary": "node src/summary.ts"` and `"typecheck": "tsc -p ."` and `"engines": { "node": ">=22.13" }`. Then `npm install -D typescript@7 @types/node@22` — for us `added 4 packages`, and `package.json` got `"@types/node": "^22.20.5"` and `"typescript": "^7.0.2"`. The folder `server/node_modules/` does not get into Git: the line `node_modules/` of the project's `.gitignore` already leaves it out.

    **3. `server/tsconfig.json`.** The same settings as in the lesson about TypeScript in Node: `strict`, `noEmit`, `"target": "es2023"`, `"module": "nodenext"`, `"types": ["node"]`, `allowImportingTsExtensions`, `verbatimModuleSyntax`, `erasableSyntaxOnly` — and `"include": ["src/**/*.ts"]`. `tsc` follows the imports, so it also checks `domain/` and `data/model.ts`, which the script imports.

    **4. `src/config.ts`.** `loadConfig(env)` returns `{ ok: true, value }` or `{ ok: false, errors }` with a list of **all** errors; every message names the variable and the value received: `LOCALE must be uk or en, got "ua"`.

    **5. `src/fixtures.ts`.** `loadFixtures()` builds the path from `import.meta.dirname` (`../../data/wishes.json`), not from the working directory, reads the file with `readFile` from `node:fs/promises` with the `utf8` encoding, checks `{ schemaVersion: 1, records }` and passes the records through `parseItemList` from `data/model.ts`. `JSON.parse(…) as Wish[]` is a promise nobody checks. Types are imported as `import type { Wish }`, relative imports carry the `.ts` extension.

    **6. `src/summary.ts`.** `main()` returns the exit code: an invalid configuration — the messages on stderr and `1`; the file cannot be read — `Cannot read <path>: …` and `1`; all is well — the summary and `0`. The last line is `process.exitCode = await main();`, not `process.exit()`. Only the loading is inside `try`, so a mistake in the code below it is not reported as a damaged file.

    **7. Run it.** `npm run summary` — for us:

    ```text
    Бажань: 6
    Ще хочу на суму: 365 ₴
    Бажаних без ціни: 1
    ```

    `LOCALE=en npm run summary` — `Wishes: 6`, `Still wanted for: UAH 365`, `Wanted without a price: 1`. `LOCALE=ua node src/summary.ts; echo "exit $?"` — `LOCALE must be uk or en, got "ua"` and `exit 1`. Rename `data/wishes.json` for a minute — `Не вдалося прочитати …/data/wishes.json: ENOENT: no such file or directory, …` and exit code `1` (the label is Ukrainian because `LOCALE` defaults to `uk`); rename it back.

    **8. Types.** `npm run typecheck` — after npm's two header lines (`> … typecheck`, `> tsc -p .`) not a single line from `tsc`. Check that this really checks: append `.toUpperCase()` after `summary.wantedWithoutPrice` for a minute — `tsc` writes `error TS2339: Property 'toUpperCase' does not exist on type 'number'.`, while `node src/summary.ts` still starts: it prints two lines of the summary and only then fails with `TypeError: summary.wantedWithoutPrice.toUpperCase is not a function` and exit code `1`. Remove the change.

    **9. Evidence and the commit.** In `docs/server.md` — a section “NO-01”: the versions, the commands and the output you saw in steps 7 and 8. `cd ..`, `git add -A`, `git status --short` — only `docs/server.md` and the files of `server/` (no `node_modules/`), `git commit -m "Add server/ with a typed summary script"`.

    **Self-check:** `server/package.json` has `"type": "module"`; every relative import carries `.ts`, types come through `import type`; `loadConfig` returns all errors together; an invalid value from the environment gives a message and exit code `1`, not a stack trace; the fixtures pass `parse…List`; from the project root `node server/src/summary.ts` prints the same summary as `npm run summary` in `server/` (the path comes from `import.meta.dirname`, not from the working directory); `npm run typecheck` — no errors; `git status` after the commit — clean.

    **If something goes wrong:** `ERR_MODULE_NOT_FOUND … Cannot find module '…/server/src/config'` — a relative import lacks `.ts`. The warning `MODULE_TYPELESS_PACKAGE_JSON` — `server/package.json` lacks `"type": "module"` (for us Node 25 still ran the file after it). `SyntaxError: The requested module '../../domain/wishes.ts' does not provide an export named 'Wish'` — a type was imported without `import type` (`tsc` says the same with `TS1484`). `error TS2591: Cannot find name 'node:fs/promises'` — `@types/node` is not installed or `tsconfig.json` lacks `"types": ["node"]`. `ERR_UNKNOWN_FILE_EXTENSION ".ts"` — a Node older than 22.18 started without the flag (for us on Node 22.13.1).

    The step's reference is `Download: NO-01 — server/: a typed Node script` after the export; open it after your own attempt.
purpose:
  uk: "Це крок твого проєкту: процес, змінні оточення, ES-модулі й TypeScript у Node із цього розділу ти застосовуєш до власного проєкту — він отримує теку `server/` із першим скриптом для Node. Платформа цей крок не перевіряє: доказ — вивід команд, `docs/server.md` і commit."
  en: "This is a step of your project: you apply this unit's process, environment variables, ES modules and TypeScript in Node to your own project — it gets a `server/` folder with its first Node script. The platform does not check this step: the evidence is the command output, `docs/server.md` and the commit."
objectives:
  - uk: "Додати до проєкту теку `server/` з власним `package.json` (`\"type\": \"module\"`) і `tsconfig.json`, у якій типізований скрипт імпортує спільні доменні функції й фікстури вебзастосунку без копіювання."
    en: "Add a `server/` folder with its own `package.json` (`\"type\": \"module\"`) and `tsconfig.json` to the project, in which a typed script imports the web app's shared domain functions and fixtures without copying them."
  - uk: "Читати налаштування з оточення через `loadConfig`, що зупиняє скрипт зрозумілим повідомленням і кодом виходу `1`, перевіряти фікстури під час виконання й типи — через `tsc`."
    en: "Read the settings from the environment through `loadConfig`, which stops the script with a readable message and exit code `1`, check the fixtures at run time and the types with `tsc`."
transfer:
  uk: "Цей крок виконується в редакторі й терміналі на твоєму комп’ютері: що зробити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor and a terminal on your computer: what to do, the expected output and the self-check list are above and on the step's page in your project."
