# Wishlist variant of step RN-11 (a local step: done in the learner's editor, terminal and on the
# declared native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1,
# Expo SDK 57, keytool, expo prebuild with the release-signing plugin) on the scratch project of this
# capstone; no APK was built, installed or read back, and nothing was run on a device.
instructions:
  uk: |
    Підписаний випуск із власним ідентифікатором `com.example.jsll.wishlist`: збірка 1, потім збірка 2 поверх неї як оновлення, і `RELEASE.md`. Без магазинів і облікових записів. Платформа цей крок не перевіряє.

    1. `app.json`: `version` `1.0.0`, `android.package` і `ios.bundleIdentifier` — `com.example.jsll.wishlist`, `android.versionCode` `1`, `ios.buildNumber` `"1"`.
    2. `keytool -genkeypair -v -storetype PKCS12 …` у `~/keys` (поза проєктом); паролі й повний шлях — у `~/.gradle/gradle.properties`; `*.keystore` у `.gitignore`.
    3. `plugins/with-release-signing.js` з уроку про артефакти і `"plugins": ["./plugins/with-release-signing"]`; `npx expo prebuild --platform android` — у `build.gradle` твій `applicationId`, версії й `signingConfig signingConfigs.release`.
    4. Бандл `npx expo export --platform android`: `MYAPP_UPLOAD` і `keystore` — `0`; кнопка «%%serviceLinkLabel%%» лише під `__DEV__`.
    5. Commit збірки 1; `npx expo run:android --variant release` (чи iOS-симулятор, Release); перевірка без Metro: шість стартових бажань і «%%summaryWantedTotal%%» на суму 365; бажання, позначене «%%acquiredMark%%» у збірці 1, на місці після збірки 2; читання артефакту (`dumpsys`, `apksigner`, `unzip`).
    6. Збірка 2: `1.0.1`, `versionCode` `2`, `buildNumber` `"2"`, знову `prebuild`, встановлення поверх без видалення; `npx expo prebuild --platform ios --no-install` для іншої платформи.
    7. `RELEASE.md` (ідентифікатори й версії, ключ, докази артефакту, чек-лист, приватність, шлях оновлення, межі відкату — чому повернутися до збірки 1 — не просте перевстановлення (versionCode, видалення стирає дані) і що замість цього, інша платформа); `EVIDENCE.md`, розділ «RN-11»; commit збірки 2.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx tsc --noEmit` — жодного рядка; `npm test` — 53 тестів курсового runner і Jest `Tests: 3 passed, 3 total`.
    - `grep -n -E "applicationId|versionCode|signingConfig signingConfigs" android/app/build.gradle` — `com.example.jsll.wishlist`, `versionCode 2`, `signingConfigs.release`.
    - `git status --short` — чисто; `git grep -n -i "password" -- . ":!node_modules"` — лише назви властивостей у плагіні; ключа в репозиторії немає.
    - На цілі: збірка 1 встановлена й працює з зупиненим Metro; збірка 2 встановлена поверх; відбиток `apksigner` = `keytool -list`.
    - `RELEASE.md` має всі розділи; невиконане на цілі позначено «not performed».

    **Доказ:** два commit, `RELEASE.md` і `EVIDENCE.md` — рядки команд і те, що ти бачив на цілі, або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися.
  en: |
    A signed release with its own id `com.example.jsll.wishlist`: build 1, then build 2 over it as an update, and `RELEASE.md`. No stores and no accounts. The platform does not check this step.

    1. `app.json`: `version` `1.0.0`, `android.package` and `ios.bundleIdentifier` — `com.example.jsll.wishlist`, `android.versionCode` `1`, `ios.buildNumber` `"1"`.
    2. `keytool -genkeypair -v -storetype PKCS12 …` in `~/keys` (outside the project); the passwords and the full path in `~/.gradle/gradle.properties`; `*.keystore` in `.gitignore`.
    3. `plugins/with-release-signing.js` of the build-artifacts lesson and `"plugins": ["./plugins/with-release-signing"]`; `npx expo prebuild --platform android` — `build.gradle` has your `applicationId`, the versions and `signingConfig signingConfigs.release`.
    4. The bundle of `npx expo export --platform android`: `MYAPP_UPLOAD` and `keystore` — `0`; the “%%serviceLinkLabel%%” button only under `__DEV__`.
    5. The commit of build 1; `npx expo run:android --variant release` (or the iOS simulator, Release); a check without Metro: the six starting wishes and “%%summaryWantedTotal%%” for 365; a wish marked “%%acquiredMark%%” in build 1 is still there after build 2; the artifact read back (`dumpsys`, `apksigner`, `unzip`).
    6. Build 2: `1.0.1`, `versionCode` `2`, `buildNumber` `"2"`, `prebuild` again, installed over without uninstalling; `npx expo prebuild --platform ios --no-install` for the other platform.
    7. `RELEASE.md` (ids and versions, the key, artifact evidence, the checklist, privacy, the update path, the rollback limits — why going back to build 1 is not a simple reinstall (versionCode, uninstalling erases the data) and what to do instead, the other platform); `EVIDENCE.md`, a section “RN-11”; the commit of build 2.

    **Self-check — confirm every item yourself:**

    - `npx tsc --noEmit` — not a single line; `npm test` — 53 course-runner tests and Jest `Tests: 3 passed, 3 total`.
    - `grep -n -E "applicationId|versionCode|signingConfig signingConfigs" android/app/build.gradle` — `com.example.jsll.wishlist`, `versionCode 2`, `signingConfigs.release`.
    - `git status --short` — clean; `git grep -n -i "password" -- . ":!node_modules"` — only the property names in the plugin; no key in the repository.
    - On the target: build 1 installed and working with Metro stopped; build 2 installed over it; the `apksigner` fingerprint = `keytool -list`.
    - `RELEASE.md` has every section; what was not done on the target says “not performed”.

    **Evidence:** two commits, `RELEASE.md` and `EVIDENCE.md` — the command lines and what you saw on the target, or a “not performed” record: what, on which target, why, what it takes to come back.
