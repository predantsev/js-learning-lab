# Capstone step of unit RN-11 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson of kind capstone-step of RN-11 from this file.
# Teaching order: …, RN-07, RN-11, RN-08 — this step continues the RN-07 reference.
# A local step: done in the learner's editor, terminal and on the declared native target; no platform
# checks. The project page shows only the intro of a local step, so the intro carries the whole procedure.
# Every computer-side command was run on macOS (Node.js 25.2.1, npm 11.6.2, Expo SDK 57, a JDK keytool) in
# a scratch home on all four projects, continuing the RN-07 scratch projects: keytool -genkeypair and
# -list outside the projects (a scratch password, never committed), the build 1 and build 2 configs,
# `npx expo prebuild --platform android --no-install` (and ios) with the with-release-signing plugin of
# the build-artifacts lesson, the generated build.gradle, Info.plist and project.pbxproj, expo export of
# the release bundle with grep checks, tsc, `npm test`, two commits. No Android SDK, Gradle build, adb,
# apksigner, Xcode, emulator, simulator or phone was available: no APK or app was built, installed or
# read back, and no store or EAS service was used. Quoted output is from the wishlist run.
# reference/ is the native project after build 2 without the files the template generates and the
# platform cannot carry (assets/*.png, LICENSE, package-lock.json, node_modules/); /android and /ios
# are generated and ignored.
unit: RN-11
mode: local
entry: App.tsx
title:
  uk: "Підписаний випуск: ідентифікатор, версії, ключ і оновлення"
  en: "A signed release: id, versions, key and update"
intro:
  uk: |
    Проєкт стає застосунком, який можна встановити як справжній випуск: власний ідентифікатор замість заглушки, версія 1.0.0 зі збіркою 1, підпис власним ключем, що живе поза репозиторієм, і збірка 2, встановлена поверх першої як оновлення. `RELEASE.md` записує ідентифікатори, ключову гігієну, докази артефакту, перевірку, приватність, шлях оновлення, межі відкату й іншу платформу. Жодних магазинів і облікових записів.

    | Проєкт | Ідентифікатор | Що перевірити у випуску | Межа відкату в `RELEASE.md` |
    |---|---|---|---|
    | Список бажань | `com.example.jsll.wishlist` | стартові бажання й «ще хочу на суму» 365; збірка 2 поверх 1 | чому збірка 1 — не просте перевстановлення |
    | Планувальник | `com.example.jsll.planner` | справи на сьогодні рахуються так само, як у debug | що лишається в користувачів після виправлення вперед |
    | Трекер звичок | `com.example.jsll.habits` | виконання й серія переживають оновлення 1 → 2 | межа відкату для зміни схеми в збірці 2 |
    | Трекер витрат | `com.example.jsll.expenses` | підсумки в `amountMinor` і їх показ — як у debug | у бандлі немає ключів; чим відрізнялася б інша платформа |

    Нижче — «Список бажань». Команди на комп’ютері виконано на macOS (Node.js 25.2.1, Expo SDK 57) на всіх чотирьох проєктах. Android SDK, Gradle, `adb`, Xcode, емулятора, симулятора й телефона не було: жоден APK не зібрано, не встановлено й не прочитано назад — кроки 7–8 описано за уроками про випуск і документацією React Native 0.86.

    **1. Стан на початку.** `cd ~/js-course/wishlist-native`, `git status` — чисто, `git log --oneline -1` — commit тестів.

    **2. Ідентифікатор і версії.** В `app.json`: `"version": "1.0.0"`, в `ios` — `"bundleIdentifier": "com.example.jsll.wishlist"` і `"buildNumber": "1"`, в `android` — `"package": "com.example.jsll.wishlist"` і `"versionCode": 1` (поруч із наявними полями). Ідентифікатор після першого встановлення не змінюється: інший — це інший застосунок поруч.

    **3. Ключ поза проєктом.** `mkdir -p ~/keys`, `cd ~/keys`, `keytool -genkeypair -v -storetype PKCS12 -keystore wishlist-upload.keystore -alias wishlist-upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Wishlist"` — у нас `Generating 2,048 bit RSA key pair and self-signed certificate (SHA384withRSA) with a validity of 10,000 days` і `[Storing wishlist-upload.keystore]`; `keytool -list -keystore wishlist-upload.keystore` — `Keystore type: PKCS12` і `Certificate fingerprint (SHA-256): …` — запиши відбиток. Паролі й шлях — лише в `~/.gradle/gradle.properties` (`MYAPP_UPLOAD_STORE_FILE` з повним шляхом, `MYAPP_UPLOAD_KEY_ALIAS`, `MYAPP_UPLOAD_STORE_PASSWORD`, `MYAPP_UPLOAD_KEY_PASSWORD`). У `.gitignore` проєкту додай `*.keystore`.

    **4. Підпис через config plugin.** `plugins/with-release-signing.js` — файл з уроку про артефакти без змін, а в `app.json` — `"plugins": ["./plugins/with-release-signing"]`. `npx expo prebuild --platform android` — у нас `✔ Updated package.json` (скрипти `android` і `ios` стають `expo run:android` і `expo run:ios`) і `✔ Finished prebuild`; `grep -n -E "applicationId|versionCode|versionName|signingConfig signingConfigs" android/app/build.gradle` — `applicationId 'com.example.jsll.wishlist'`, `versionCode 1`, `versionName "1.0.0"`, `signingConfig signingConfigs.debug` (для debug) і `signingConfig signingConfigs.release`. Тека `android/` у `.gitignore`.

    **5. Що їде в бандлі.** `npx expo export --platform android --output-dir release-check`, потім `grep -c -a -F` у `release-check/_expo/static/js/android/*.hbc`: `MYAPP_UPLOAD` — `0`, `keystore` — `0`, `jsll.wishlist.v1` — `1` (код застосунку на місці), `10.0.2.2` — `1`: адреса навчального сервісу лишається в модулі `devConfig`, тож кнопку його екрана тепер показує лише розробницька збірка (`__DEV__`), а випуск і так не дозволяє `http://`. `rm -r release-check`. Hermes зберігає не-латинський текст у UTF-16 — шукай лише латиницю.

    **6. Commit збірки 1.** `git add -A`, `git commit -m "Release 1.0.0 (build 1): own ids and release signing through a config plugin"`.

    **7. Випуск на цілі.** `npx expo run:android --variant release` (iOS-симулятор: `npx expo run:ios --configuration Release`) — збирає, встановлює й відкриває. Перевір без запущеного Metro: шість бажань, «Ще хочу на суму: 365 ₴». Прочитай артефакт назад: `adb shell dumpsys package com.example.jsll.wishlist | grep -E "versionCode|versionName"`, `apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk` (SHA-256 — той самий, що в `keytool -list`), розмір APK і `unzip -l … | grep keystore` — нічого. Якщо раніше стояла debug-збірка, установка відмовить через інший підпис — `adb uninstall com.example.jsll.wishlist`.

    **8. Збірка 2 як оновлення.** `"version": "1.0.1"`, `"versionCode": 2`, `"buildNumber": "2"`, знову `npx expo prebuild --platform android` (у нас `versionCode 2`, `versionName "1.0.1"`) і `npx expo run:android --variant release` поверх збірки 1, без видалення: позначене бажання на місці. Для іншої платформи — `npx expo prebuild --platform ios --no-install`: у нас `CFBundleShortVersionString` `1.0.1`, `CFBundleVersion` `2`, `PRODUCT_BUNDLE_IDENTIFIER = "com.example.jsll.wishlist"`. Кроків 7–8 на пристрої ми не виконували.

    **9. Нотатки й commit.** `RELEASE.md`: ідентифікатори й версії, ключ і гігієна (де ключ, де паролі, резервна копія, що робити, якщо витік), докази артефакту обох збірок, чек-лист (перший запуск, перезапуск, оновлення поверх, Metro зупинено), приватність (дані лишаються на пристрої), шлях оновлення (новий підписаний APK; `expo-updates` немає, тож кожна зміна — нова збірка), межі відкату, інша платформа. У `EVIDENCE.md` — розділ «RN-11»: рядки команд на комп’ютері й те, що ти бачив на цілі, або запис «не виконано» (тоді на сторінці кроку — «У мене немає емулятора чи пристрою», а не «Цей крок виконано»). `git grep -n -i "password" -- . ":!node_modules"` — лише назви властивостей у плагіні й рядки `RELEASE.md`, що їх називають, без жодного значення пароля (у нас — 5 рядків); `git ls-files | grep -i keystore` — нічого. `git add -A`, `git commit -m "Release 1.0.1 (build 2) with the release notes"`.

    **Самоперевірка:** ідентифікатор не `com.anonymous…`; versionCode лише зростає; ключ і паролі поза репозиторієм, `git status` і `git grep` це підтверджують; release підписаний не debug-ключем (`signingConfigs.release` у `build.gradle`, відбиток `apksigner` = `keytool`); випуск працює із зупиненим Metro; `RELEASE.md` має всі розділи.

    **Якщо щось пішло не так:** `prebuild` падає з `with-release-signing: the template of build.gradle changed` — плагін не знайшов місця для блоку, release інакше підписався б debug-ключем. Підпис не знаходить ключа — у `MYAPP_UPLOAD_STORE_FILE` не повний шлях (Gradle не розгортає `~`). Нова версія не встановлюється поверх — versionCode не більший, або `prebuild` не перезапускали після зміни `app.json`.

    Еталон кроку — `Завантажити: RN-11 — Підписаний випуск: ідентифікатор, версії, ключ і оновлення` після експорту (стан після збірки 2; без `assets/*.png`, `LICENSE`, `package-lock.json` і `node_modules/` — див. крок RN-01; ключа в ньому немає й бути не може). Команди виконано лише на macOS; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    The project becomes an app you can install as a real release: its own id instead of a placeholder, version 1.0.0 with build 1, a signature with your own key that lives outside the repository, and build 2 installed over the first as an update. `RELEASE.md` records the ids, the key hygiene, the artifact evidence, the smoke check, privacy, the update path, the rollback limits and the other platform. No stores and no accounts.

    | Project | Id | What to check in the release | Rollback limit in `RELEASE.md` |
    |---|---|---|---|
    | Wishlist | `com.example.jsll.wishlist` | the starting wishes and “still wanted, total” 365; build 2 over build 1 | why build 1 is not a simple reinstall |
    | Planner | `com.example.jsll.planner` | tasks due today counted the same as in debug | what users keep after a forward fix |
    | Habit tracker | `com.example.jsll.habits` | completions and the streak survive the update 1 → 2 | the rollback limit of a schema change in build 2 |
    | Expense tracker | `com.example.jsll.expenses` | totals in `amountMinor` and their display as in debug | no keys in the bundle; how the other platform would differ |

    Below is the wishlist. The computer commands were run on macOS (Node.js 25.2.1, Expo SDK 57) on all four projects. There was no Android SDK, Gradle, `adb`, Xcode, emulator, simulator or phone: no APK was built, installed or read back — steps 7–8 follow the release lessons and the React Native 0.86 documentation.

    **1. The starting state.** `cd ~/js-course/wishlist-native`, `git status` — clean, `git log --oneline -1` — the tests commit.

    **2. The id and the versions.** In `app.json`: `"version": "1.0.0"`, in `ios` — `"bundleIdentifier": "com.example.jsll.wishlist"` and `"buildNumber": "1"`, in `android` — `"package": "com.example.jsll.wishlist"` and `"versionCode": 1` (next to the existing fields). The id does not change after the first install: another id is another app next to it.

    **3. A key outside the project.** `mkdir -p ~/keys`, `cd ~/keys`, `keytool -genkeypair -v -storetype PKCS12 -keystore wishlist-upload.keystore -alias wishlist-upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Wishlist"` — for us `Generating 2,048 bit RSA key pair and self-signed certificate (SHA384withRSA) with a validity of 10,000 days` and `[Storing wishlist-upload.keystore]`; `keytool -list -keystore wishlist-upload.keystore` — `Keystore type: PKCS12` and `Certificate fingerprint (SHA-256): …` — write the fingerprint down. The passwords and the path go only into `~/.gradle/gradle.properties` (`MYAPP_UPLOAD_STORE_FILE` with the full path, `MYAPP_UPLOAD_KEY_ALIAS`, `MYAPP_UPLOAD_STORE_PASSWORD`, `MYAPP_UPLOAD_KEY_PASSWORD`). Add `*.keystore` to the project's `.gitignore`.

    **4. Signing through a config plugin.** `plugins/with-release-signing.js` — the file of the build-artifacts lesson unchanged, and in `app.json` — `"plugins": ["./plugins/with-release-signing"]`. `npx expo prebuild --platform android` — for us `✔ Updated package.json` (the `android` and `ios` scripts become `expo run:android` and `expo run:ios`) and `✔ Finished prebuild`; `grep -n -E "applicationId|versionCode|versionName|signingConfig signingConfigs" android/app/build.gradle` — `applicationId 'com.example.jsll.wishlist'`, `versionCode 1`, `versionName "1.0.0"`, `signingConfig signingConfigs.debug` (for debug) and `signingConfig signingConfigs.release`. The `android/` folder is in `.gitignore`.

    **5. What goes into the bundle.** `npx expo export --platform android --output-dir release-check`, then `grep -c -a -F` in `release-check/_expo/static/js/android/*.hbc`: `MYAPP_UPLOAD` — `0`, `keystore` — `0`, `jsll.wishlist.v1` — `1` (the app's code is there), `10.0.2.2` — `1`: the mock service's address stays in the `devConfig` module, so the button of its screen is now shown only by a development build (`__DEV__`), and a release does not allow `http://` anyway. `rm -r release-check`. Hermes stores non-Latin text as UTF-16 — search for Latin text only.

    **6. Commit of build 1.** `git add -A`, `git commit -m "Release 1.0.0 (build 1): own ids and release signing through a config plugin"`.

    **7. The release on the target.** `npx expo run:android --variant release` (iOS simulator: `npx expo run:ios --configuration Release`) — builds, installs and opens it. Check without Metro running: six wishes, “Still wanted, total: UAH 365”. Read the artifact back: `adb shell dumpsys package com.example.jsll.wishlist | grep -E "versionCode|versionName"`, `apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk` (the SHA-256 is the one of `keytool -list`), the APK's size and `unzip -l … | grep keystore` — nothing. If a debug build was installed before, the install refuses because of the other signature — `adb uninstall com.example.jsll.wishlist`.

    **8. Build 2 as an update.** `"version": "1.0.1"`, `"versionCode": 2`, `"buildNumber": "2"`, `npx expo prebuild --platform android` again (for us `versionCode 2`, `versionName "1.0.1"`) and `npx expo run:android --variant release` over build 1, without uninstalling: the marked wish is still there. For the other platform — `npx expo prebuild --platform ios --no-install`: for us `CFBundleShortVersionString` `1.0.1`, `CFBundleVersion` `2`, `PRODUCT_BUNDLE_IDENTIFIER = "com.example.jsll.wishlist"`. We did not perform steps 7–8 on a device.

    **9. Notes and commit.** `RELEASE.md`: ids and versions, the key and its hygiene (where the key is, where the passwords are, the backup, what to do if it leaks), the artifact evidence of both builds, the checklist (first start, restart, update over, Metro stopped), privacy (the data stays on the device), the update path (a new signed APK; there is no `expo-updates`, so every change is a new build), the rollback limits, the other platform. In `EVIDENCE.md`, a section “RN-11”: the command lines on the computer and what you saw on the target, or a “not performed” record (then, on the step's page, “I have no emulator or device”, not “I have done this step”). `git grep -n -i "password" -- . ":!node_modules"` — only the property names in the plugin and the `RELEASE.md` lines that name them, with no password value (5 lines for us); `git ls-files | grep -i keystore` — nothing. `git add -A`, `git commit -m "Release 1.0.1 (build 2) with the release notes"`.

    **Self-check:** the id is not `com.anonymous…`; versionCode only grows; the key and the passwords are outside the repository, as `git status` and `git grep` confirm; the release is not signed with the debug key (`signingConfigs.release` in `build.gradle`, the `apksigner` fingerprint = `keytool`); the release works with Metro stopped; `RELEASE.md` has every section.

    **If something goes wrong:** `prebuild` fails with `with-release-signing: the template of build.gradle changed` — the plugin did not find the place for the block; otherwise release would be signed with the debug key. Signing does not find the key — `MYAPP_UPLOAD_STORE_FILE` has no full path (Gradle does not expand `~`). A new version does not install over the old one — versionCode is not higher, or `prebuild` was not run again after `app.json` changed.

    The step's reference is `Download: RN-11 — A signed release: id, versions, key and update` after the export (the state after build 2; without `assets/*.png`, `LICENSE`, `package-lock.json` and `node_modules/` — see step RN-01; it has no key and cannot have one). The commands were run on macOS only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це крок твого проєкту: ідентифікатори й версії, ключ поза репозиторієм, підпис через config plugin, перевірку артефакту, оновлення й межі відкату із цього розділу ти застосовуєш до власного застосунку. Платформа цей крок не перевіряє: доказ — вивід команд, `RELEASE.md`, `EVIDENCE.md` і два commit."
  en: "This is a step of your project: you apply this unit's ids and versions, a key outside the repository, signing through a config plugin, the artifact check, the update and the rollback limits to your own app. The platform does not check this step: the evidence is the command output, `RELEASE.md`, `EVIDENCE.md` and two commits."
objectives:
  - uk: "Дати проєкту власний ідентифікатор і версії, підписати випуск ключем, що живе поза репозиторієм, і перевірити, що в артефакті немає ключів і розробницького коду, який би виконувався."
    en: "Give the project its own id and versions, sign the release with a key that lives outside the repository, and check that the artifact holds no keys and no development code that would run."
  - uk: "Встановити збірку 1 і збірку 2 поверх неї на заявленій цілі та записати в `RELEASE.md` шлях оновлення, межі відкату й відмінності іншої платформи."
    en: "Install build 1 and build 2 over it on the declared target and record in `RELEASE.md` the update path, the rollback limits and how the other platform differs."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й на заявленій нативній цілі: що зробити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and on the declared native target: what to do, the expected output and the self-check list are above and on the step's page in your project."
