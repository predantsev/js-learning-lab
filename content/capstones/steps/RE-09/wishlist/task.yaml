# Wishlist variant of step RE-09 (a local step: done in the learner's editor, terminal and browser, no
# platform checks). Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2,
# Chrome) on the scratch project of this capstone after RE-07. The tests caught three deliberately wrong versions (a cast
# instead of the schema, a lenient field check, no duplicate-id check) on the wishlist and habit tracker.
instructions:
  uk: |
    Перевіряй кожну відповідь API схемою під час виконання, перш ніж застосунок вважатиме її типізованими даними. `domain/`, `storage/` і reducer не змінюються. Платформа цей крок не перевіряє.

    1. `data/model.ts`: `parseItem(input: unknown)` і `parseItemList(input: unknown)` повертають `{ ok: true, value }` або `{ ok: false, errors }` з кодом для кожного поля (`name` 1–80 символів, `price` — невід’ємне ціле або `null`, `acquired` — boolean, `category` до 30 символів або `null`); у списку ключ має позицію (`"2.price"`), однакові `id` — `errors.id = "duplicate"`. Без `as` і без `any`.
    2. `data/api.ts`: `listItems` повертає `Promise<unknown>` — копію через `JSON.stringify` / `JSON.parse`; `settings.nextListAnswer` один раз підміняє відповідь (для тестів).
    3. `ui/itemsCache.tsx`: у кеш потрапляє лише `parsed.value`; інакше стан помилки «%%listLoadFailedMessage%% (%%badDataLabel%%: 1.price: notWholeNonNegative)» у `role="status"` і кнопка «%%retryLoadLabel%%».
    4. `tests/model.test.js` (у `run-tests.js`): правильний запис проходить; зламане поле назване з позицією; відсутнє поле, не-об’єкт, однакові `id` і не-масив відхилено.
    5. `tests/ui.test.tsx`: відповідь API з `price: 12.5` стає станом помилки з «1.price: notWholeNonNegative». Тест відкату з попереднього кроку (невдале перемикання «%%acquiredMark%%» відкочує це бажання) лишається і проходить.
    6. `npm run typecheck`, `npm run lint` — без зауважень; `npm test` — 37 тестів і `не пройшли: 0`; `tests.html` — вісім рядків `✓`.
    7. `git add -A`, `git commit -m "Check every API answer with a runtime schema"`.
  en: |
    Check every API answer with a runtime schema before the app treats it as typed data. `domain/`, `storage/` and the reducer do not change. The platform does not check this step.

    1. `data/model.ts`: `parseItem(input: unknown)` and `parseItemList(input: unknown)` return `{ ok: true, value }` or `{ ok: false, errors }` with a code for every field (`name` 1–80 characters, `price` a non-negative whole number or `null`, `acquired` a boolean, `category` up to 30 characters or `null`); in a list the key carries the position (`"2.price"`), equal ids give `errors.id = "duplicate"`. No `as` and no `any`.
    2. `data/api.ts`: `listItems` returns `Promise<unknown>` — a copy through `JSON.stringify` / `JSON.parse`; `settings.nextListAnswer` replaces the answer once (for the tests).
    3. `ui/itemsCache.tsx`: only `parsed.value` reaches the cache; otherwise the error state “%%listLoadFailedMessage%% (%%badDataLabel%%: 1.price: notWholeNonNegative)” in `role="status"` and the “%%retryLoadLabel%%” button.
    4. `tests/model.test.js` (in `run-tests.js`): a valid record passes; a broken field is named with its position; a missing field, a non-object, equal ids and a non-array are refused.
    5. `tests/ui.test.tsx`: an API answer with `price: 12.5` becomes an error state with “1.price: notWholeNonNegative”. The rollback test of the previous step (a failed “%%acquiredMark%%” toggle rolls back that wish) stays and passes.
    6. `npm run typecheck`, `npm run lint` — no findings; `npm test` — 37 tests and `failed: 0`; `tests.html` — eight `✓` lines.
    7. `git add -A`, `git commit -m "Check every API answer with a runtime schema"`.
