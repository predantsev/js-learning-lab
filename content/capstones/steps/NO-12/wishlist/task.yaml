# Wishlist variant of step NO-12 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS on the scratch project of this capstone after NO-06, in a Ukrainian and an English workspace,
# on Node.js 25.2.1 and 22.13.1: npm test in server/ (66, of them 9 in tests/ops.test.ts; the ops tests 3 times
# in a row on each version), npm run check, npm run check:server, and the whole rehearsal of the intro by a
# script (rehearse12.sh in the hand-back) three times: uk on 25.2.1 and 22.13.1, en on 25.2.1. Latency test:
# p95 of GET /v1/records?sort=name&limit=20 on 20,000 wishes measured 55.9–58.3 ms (25.2.1) and 41.5–44.1 ms
# (22.13.1); budget 250 ms. Wrong variants run against tests/ops.test.ts, each failed at least one test: no
# SIGTERM handler, idle connections not closed after an in-flight answer, no deadline, a deadline that exits 0,
# /readyz ignoring the store, /readyz ignoring the shutdown, the raw path as the metric label, 5xx not counted
# as errors, no p95 line, any SHUTDOWN_DEADLINE_MS, "*" in ALLOWED_ORIGINS, the build keeping .ts imports, the
# build forgetting the starting records, the drill not comparing, a sort repeated for every wish of the page.
# Equivalent (not detectable, and harmless): the drill's own "never the live folder" guard removed — the
# "folder is not empty" refusal stops it first. Not run on Linux or Windows.
instructions:
  uk: |
    Запусти сервер списку бажань як сервіс: з артефакту, з `/readyz` і лічильниками запитів за маршрутами; віднови backup у нову теку й переконайся, що кількість бажань і сума цін бажаних речей збігаються; відкотися до попередньої збірки. Платформа цей крок не перевіряє.

    1. `src/config.ts`: `SHUTDOWN_DEADLINE_MS`, `NODE_ENV`.
    2. `src/metrics.ts` (`createMetrics`, `routeLabel`); у `src/server.ts` — `/livez`, `/readyz`, `/metrics`, параметр `ops` (`{ metrics, health }`) у `createRecordsServer`, завершення за `SIGTERM`/`SIGINT` з дедлайном і `closeIdleConnections()` після відповіді.
    3. `scripts/build.mjs` (`RUN_TIME_FILES = ["data/wishes.json"]`), `scripts/pack.mjs`, `scripts/ci.mjs`, `scripts/load.mjs`, `scripts/top-self-time.mjs`; `src/check-deploy.ts` (фільтри `?acquired=false|true`, `?sort=price`, `summary:` з кількістю й сумою бажаних), `src/restore-drill.ts` (кількість, `id`, сума бажаних); `BACKUP_NAME` експортовано з `src/backup.ts`.
    4. `package.json`: версія `1.0.0`, скрипти `build`, `pack`, `ci`, `load`, `restore-drill`, `check:deploy`, `profile:top`; у `.gitignore` проєкту — `server/release/`, `server/artifacts/`, `server/profiles/`; в `ignores` файлу `eslint.config.mjs` — `server/release/`, `server/.check/`.
    5. `tests/ops.test.ts`; `RUNBOOK.md`.
    6. Репетиція з інтро. Дефект 1.1.0: у `src/list.ts` фільтр `acquired` навпаки (`String(wish.acquired) !== acquired`).
    7. `docs/server.md`, розділ «NO-12»; два commit-и з інтро.

    Назви тестів для кроку 11 інтро — як в інтро (вони з цього проєкту).

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ tests 66`, `ℹ fail 0`; `npm run check` і `npm run check:server` — усі `✔`; `npm run lint` у теці проєкту після `npm run ci` — без помилок.
    - `shasum -a 256` артефакту дорівнює `sha256` його запису; запис каже `"ci": "passed"`.
    - Після `SIGTERM` під навантаженням — код `0`, а записів на диску = 6 + усі `201` обох навантажень.
    - `restore-drill` — `✔ the restored store answers the same as the live one`; `check:deploy` на 4311 і 4312 — однаковий рядок `summary:`.
    - 1.1.0: CI зупинився на `test`; `check:deploy` — `✖ ?acquired=false answers only wanted wishes`; після відкату до 1.0.0 — усі `✔`.

    **Доказ:** два commit-и, `RUNBOOK.md` і `docs/server.md` із командами й побаченим виводом.
  en: |
    Run the wishlist server as a service: from an artifact, with `/readyz` and per-route request counts; restore a backup into a new folder and make sure the count of wishes and the total price of wanted things match; roll back to the previous build. The platform does not check this step.

    1. `src/config.ts`: `SHUTDOWN_DEADLINE_MS`, `NODE_ENV`.
    2. `src/metrics.ts` (`createMetrics`, `routeLabel`); in `src/server.ts` — `/livez`, `/readyz`, `/metrics`, the `ops` parameter (`{ metrics, health }`) of `createRecordsServer`, the shutdown on `SIGTERM`/`SIGINT` with a deadline and `closeIdleConnections()` after an answer.
    3. `scripts/build.mjs` (`RUN_TIME_FILES = ["data/wishes.json"]`), `scripts/pack.mjs`, `scripts/ci.mjs`, `scripts/load.mjs`, `scripts/top-self-time.mjs`; `src/check-deploy.ts` (the filters `?acquired=false|true`, `?sort=price`, a `summary:` with the count and the wanted total), `src/restore-drill.ts` (the count, the `id`s, the wanted total); `BACKUP_NAME` exported from `src/backup.ts`.
    4. `package.json`: version `1.0.0`, the scripts `build`, `pack`, `ci`, `load`, `restore-drill`, `check:deploy`, `profile:top`; in the project's `.gitignore` — `server/release/`, `server/artifacts/`, `server/profiles/`; in the `ignores` of `eslint.config.mjs` — `server/release/`, `server/.check/`.
    5. `tests/ops.test.ts`; `RUNBOOK.md`.
    6. The rehearsal of the intro. The defect of 1.1.0: the `acquired` filter of `src/list.ts` reversed (`String(wish.acquired) !== acquired`).
    7. `docs/server.md`, a section "NO-12"; the two commits of the intro.

    The test names for step 11 of the intro are those of the intro (they come from this project).

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ tests 66`, `ℹ fail 0`; `npm run check` and `npm run check:server` — every check `✔`; `npm run lint` in the project folder after `npm run ci` — no errors.
    - `shasum -a 256` of the artifact equals the `sha256` of its record; the record says `"ci": "passed"`.
    - After `SIGTERM` under load — exit code `0`, and the records on disk = 6 + every `201` of both loads.
    - `restore-drill` — `✔ the restored store answers the same as the live one`; `check:deploy` on 4311 and 4312 — the same `summary:` line.
    - 1.1.0: CI stopped at `test`; `check:deploy` — `✖ ?acquired=false answers only wanted wishes`; after the rollback to 1.0.0 — every line `✔`.

    **Evidence:** the two commits, `RUNBOOK.md` and `docs/server.md` with the commands and the output you saw.
