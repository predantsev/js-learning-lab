# Expense tracker variant of step NO-12 (a local step: done in the learner's editor and terminal; no platform
# checks). Checked on macOS on the scratch project of this capstone after NO-06, in a Ukrainian and an English
# workspace, on Node.js 25.2.1 and 22.13.1: npm test in server/ (69, of them 9 in tests/ops.test.ts), npm run
# check, npm run check:server, and the whole rehearsal of the intro by a script on both versions (records on
# disk = 6 + every 201: 643 = 6 + 476 + 161 on 25.2.1, 639 = 6 + 468 + 165 on 22.13.1). Latency test: p95 of
# GET /v1/records?sort=amountMinor&limit=20 on 20,000 expenses measured 18.8–24.3 ms (25.2.1) and 19.6–21.9 ms
# (22.13.1); budget 100 ms. Wrong variants run against tests/ops.test.ts, each failed at least one test: the
# wishlist's list (see its task header), with "a sort for every 100 expenses of the filtered list" in place of
# the per-wish sort (a numeric sort 20 times stayed under the budget: 33–38 ms) and one latency histogram for
# every route. Equivalent: the drill's "never the live folder" guard (the "not empty" refusal stops it first).
# Not run on Linux or Windows.
instructions:
  uk: |
    Запусти сервер трекера витрат як сервіс, з гістограмою затримки за маршрутами; віднови backup у нову теку й переконайся, що загальна сума й суми за категоріями в `amountMinor` збігаються до копійки; відкоти оновлення. Платформа цей крок не перевіряє.

    1. `src/config.ts`: `SHUTDOWN_DEADLINE_MS`, `NODE_ENV`.
    2. `src/metrics.ts` (`createMetrics`, `routeLabel`; гістограма затримки — окрема для кожного маршруту); у `src/server.ts` — `/livez`, `/readyz`, `/metrics`, параметр `ops` у `createRecordsServer`, завершення за `SIGTERM`/`SIGINT` з дедлайном і `closeIdleConnections()` після відповіді.
    3. `scripts/build.mjs` (`RUN_TIME_FILES = ["data/expenses.json"]`), `scripts/pack.mjs`, `scripts/ci.mjs`, `scripts/load.mjs`, `scripts/top-self-time.mjs`; `src/check-deploy.ts` (кожен `?category=`, разом — увесь список, `?sort=amountMinor`, `summary:` із загальною сумою й сумами за категоріями в `amountMinor`), `src/restore-drill.ts` (кількість, `id`, загальна сума й суми за категоріями); `BACKUP_NAME` експортовано з `src/backup.ts`.
    4. `package.json`: версія `1.0.0` і скрипти, як в інтро; у `.gitignore` проєкту — `server/release/`, `server/artifacts/`, `server/profiles/`; в `ignores` файлу `eslint.config.mjs` — `server/release/`, `server/.check/`.
    5. `tests/ops.test.ts`; `RUNBOOK.md` (симптом інциденту: фільтр категорії показує чужі витрати).
    6. Репетиція з інтро. Дефект 1.1.0: у `src/list.ts` фільтр категорії навпаки (`expense.category !== category`).
    7. `docs/server.md`, розділ «NO-12»; два commit-и з інтро.

    Гістограма за маршрутом — це рядки `http_request_duration_ms{route="/v1/records",quantile="0.5"|"0.95"|"0.99"}` і `_count` у `/metrics`: p50 і p95 читай звідти, а не з середнього. Назви тестів для кроку 11 інтро — ті самі, що в інтро; латентний тест — `a sorted page of 20,000 synthetic expenses stays within the latency budget`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ tests 69`, `ℹ fail 0`; `npm run check` і `npm run check:server` — усі `✔`; `npm run lint` у теці проєкту після `npm run ci` — без помилок.
    - `shasum -a 256` артефакту дорівнює `sha256` його запису; запис каже `"ci": "passed"`.
    - Після `SIGTERM` під навантаженням — код `0`, а витрат на диску = 6 + усі `201` обох навантажень.
    - `restore-drill` — `✔ the restored store answers the same as the live one`; `check:deploy` на 4311 і 4312 — однаковий рядок `summary:` з тими самими сумами в `amountMinor`.
    - 1.1.0: CI зупинився на `test`; `check:deploy` — `✖ ?category=food answers only food expenses`; після відкату до 1.0.0 — усі `✔`.

    **Доказ:** два commit-и, `RUNBOOK.md` і `docs/server.md` із командами й побаченим виводом.
  en: |
    Run the expense server as a service, with a per-route latency histogram; restore a backup into a new folder and make sure the overall and per-category totals in `amountMinor` match to the minor unit; roll an upgrade back. The platform does not check this step.

    1. `src/config.ts`: `SHUTDOWN_DEADLINE_MS`, `NODE_ENV`.
    2. `src/metrics.ts` (`createMetrics`, `routeLabel`; a latency histogram of its own for every route); in `src/server.ts` — `/livez`, `/readyz`, `/metrics`, the `ops` parameter of `createRecordsServer`, the shutdown on `SIGTERM`/`SIGINT` with a deadline and `closeIdleConnections()` after an answer.
    3. `scripts/build.mjs` (`RUN_TIME_FILES = ["data/expenses.json"]`), `scripts/pack.mjs`, `scripts/ci.mjs`, `scripts/load.mjs`, `scripts/top-self-time.mjs`; `src/check-deploy.ts` (every `?category=`, together the whole list, `?sort=amountMinor`, a `summary:` with the overall total and the per-category totals in `amountMinor`), `src/restore-drill.ts` (the count, the `id`s, the overall and the per-category totals); `BACKUP_NAME` exported from `src/backup.ts`.
    4. `package.json`: version `1.0.0` and the scripts of the intro; in the project's `.gitignore` — `server/release/`, `server/artifacts/`, `server/profiles/`; in the `ignores` of `eslint.config.mjs` — `server/release/`, `server/.check/`.
    5. `tests/ops.test.ts`; `RUNBOOK.md` (the incident's symptom: the category filter shows other categories' expenses).
    6. The rehearsal of the intro. The defect of 1.1.0: the category filter of `src/list.ts` reversed (`expense.category !== category`).
    7. `docs/server.md`, a section "NO-12"; the two commits of the intro.

    The per-route histogram is the lines `http_request_duration_ms{route="/v1/records",quantile="0.5"|"0.95"|"0.99"}` and `_count` of `/metrics`: read p50 and p95 there, not from an average. The test names for step 11 of the intro are those of the intro; the latency test is `a sorted page of 20,000 synthetic expenses stays within the latency budget`.

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ tests 69`, `ℹ fail 0`; `npm run check` and `npm run check:server` — every check `✔`; `npm run lint` in the project folder after `npm run ci` — no errors.
    - `shasum -a 256` of the artifact equals the `sha256` of its record; the record says `"ci": "passed"`.
    - After `SIGTERM` under load — exit code `0`, and the expenses on disk = 6 + every `201` of both loads.
    - `restore-drill` — `✔ the restored store answers the same as the live one`; `check:deploy` on 4311 and 4312 — the same `summary:` line with the same totals in `amountMinor`.
    - 1.1.0: CI stopped at `test`; `check:deploy` — `✖ ?category=food answers only food expenses`; after the rollback to 1.0.0 — every line `✔`.

    **Evidence:** the two commits, `RUNBOOK.md` and `docs/server.md` with the commands and the output you saw.
