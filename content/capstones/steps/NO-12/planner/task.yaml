# Planner variant of step NO-12 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS on the scratch project of this capstone after NO-06, in a Ukrainian and an English workspace,
# on Node.js 25.2.1 and 22.13.1: npm test in server/ (72, of them 9 in tests/ops.test.ts), npm run check,
# npm run check:server, and the whole rehearsal of the intro by a script on both versions, with the fixed day
# 2026-03-02 (records on disk = 6 + every 201: 617 = 6 + 446 + 165 on 25.2.1, 608 = 6 + 457 + 145 on 22.13.1).
# Latency test: p95 of GET /v1/records?sort=title&limit=20 on 20,000 tasks measured 63.9–68.0 ms (25.2.1) and
# 49.1–52.1 ms (22.13.1); budget 300 ms. Wrong variants run against tests/ops.test.ts, each failed at least one
# test: the wishlist's list (see its task header; the "never the live folder" guard is caught here, the test
# checks the refusal message) plus the drill without TODAY; three check:deploy mistakes (the priority order not
# checked, any day text taken, the summary counted on the computer's today) failed a check script run against
# a defective server. Not run on Linux or Windows.
instructions:
  uk: |
    Запусти сервер планувальника в production-режимі; віднови backup і переконайся, що кількість невиконаних справ і справ із терміном до фіксованого дня збігаються; відрепетируй відкат після оновлення, яке ламає сортування за `priority`. Платформа цей крок не перевіряє.

    1. `src/config.ts`: `SHUTDOWN_DEADLINE_MS`, `NODE_ENV`.
    2. `src/metrics.ts` (`createMetrics`, `routeLabel`); у `src/server.ts` — `/livez`, `/readyz`, `/metrics`, параметр `ops` у `createRecordsServer`, завершення за `SIGTERM`/`SIGINT` з дедлайном і `closeIdleConnections()` після відповіді.
    3. `scripts/build.mjs` (`RUN_TIME_FILES = ["data/tasks.json"]`), `scripts/pack.mjs`, `scripts/ci.mjs`, `scripts/load.mjs`, `scripts/top-self-time.mjs`; `src/check-deploy.ts` (`?done=false|true`, разом — увесь список, `?sort=priority` — `high`, `normal`, `low`, `summary:` з кількістю, невиконаними й із терміном до дня), `src/restore-drill.ts` (кількість, `id`, невиконані й із терміном до дня `TODAY`); `BACKUP_NAME` експортовано з `src/backup.ts`.
    4. `package.json`: версія `1.0.0` і скрипти, як в інтро; у `.gitignore` проєкту — `server/release/`, `server/artifacts/`, `server/profiles/`; в `ignores` файлу `eslint.config.mjs` — `server/release/`, `server/.check/`.
    5. `tests/ops.test.ts`; `RUNBOOK.md` (симптом інциденту: справи з високим пріоритетом опинилися в кінці).
    6. Репетиція з інтро з фіксованим днем: `TODAY=2026-03-02` для `backup` і `restore-drill`, день — другий аргумент `check:deploy` (`npm run -s check:deploy -- http://127.0.0.1:4311 2026-03-02`; без дня — відмова: день ніколи не береться з годинника). Дефект 1.1.0: у `src/list.ts` порядок пріоритетів навпаки (`PRIORITY_RANK` `high: 2`, `low: 0`).
    7. `docs/server.md`, розділ «NO-12»; два commit-и з інтро.

    Назви тестів для кроку 11 інтро — ті самі, що в інтро; латентний тест — `a page sorted by title of 20,000 synthetic tasks stays within the latency budget`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ tests 72`, `ℹ fail 0`; `npm run check` і `npm run check:server` — усі `✔`; `npm run lint` у теці проєкту після `npm run ci` — без помилок.
    - `shasum -a 256` артефакту дорівнює `sha256` його запису; запис каже `"ci": "passed"`.
    - Після `SIGTERM` під навантаженням — код `0`, а справ на диску = 6 + усі `201` обох навантажень.
    - `restore-drill` — `✔ the restored store answers the same as the live one`; `check:deploy` на 4311 і 4312 з тим самим днем — однаковий рядок `summary:` (`… pending …, due on or before 2026-03-02 …`).
    - 1.1.0: CI зупинився на `test`; `check:deploy` — `✖ ?sort=priority goes high, normal, low`; після відкату до 1.0.0 — усі `✔`.

    **Доказ:** два commit-и, `RUNBOOK.md` і `docs/server.md` із командами й побаченим виводом.
  en: |
    Run the planner server in production mode; restore a backup and make sure the counts of pending tasks and of tasks due by a fixed day match; rehearse a rollback after an upgrade that breaks sorting by `priority`. The platform does not check this step.

    1. `src/config.ts`: `SHUTDOWN_DEADLINE_MS`, `NODE_ENV`.
    2. `src/metrics.ts` (`createMetrics`, `routeLabel`); in `src/server.ts` — `/livez`, `/readyz`, `/metrics`, the `ops` parameter of `createRecordsServer`, the shutdown on `SIGTERM`/`SIGINT` with a deadline and `closeIdleConnections()` after an answer.
    3. `scripts/build.mjs` (`RUN_TIME_FILES = ["data/tasks.json"]`), `scripts/pack.mjs`, `scripts/ci.mjs`, `scripts/load.mjs`, `scripts/top-self-time.mjs`; `src/check-deploy.ts` (`?done=false|true`, together the whole list, `?sort=priority` — `high`, `normal`, `low`, a `summary:` with the count, the pending ones and those due by the day), `src/restore-drill.ts` (the count, the `id`s, the pending ones and those due by the day `TODAY`); `BACKUP_NAME` exported from `src/backup.ts`.
    4. `package.json`: version `1.0.0` and the scripts of the intro; in the project's `.gitignore` — `server/release/`, `server/artifacts/`, `server/profiles/`; in the `ignores` of `eslint.config.mjs` — `server/release/`, `server/.check/`.
    5. `tests/ops.test.ts`; `RUNBOOK.md` (the incident's symptom: high-priority tasks ended up last).
    6. The rehearsal of the intro with a fixed day: `TODAY=2026-03-02` for `backup` and `restore-drill`, the day as the second argument of `check:deploy` (`npm run -s check:deploy -- http://127.0.0.1:4311 2026-03-02`; without a day it refuses: the day is never read from the clock). The defect of 1.1.0: the priority order of `src/list.ts` reversed (`PRIORITY_RANK` `high: 2`, `low: 0`).
    7. `docs/server.md`, a section "NO-12"; the two commits of the intro.

    The test names for step 11 of the intro are those of the intro; the latency test is `a page sorted by title of 20,000 synthetic tasks stays within the latency budget`.

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ tests 72`, `ℹ fail 0`; `npm run check` and `npm run check:server` — every check `✔`; `npm run lint` in the project folder after `npm run ci` — no errors.
    - `shasum -a 256` of the artifact equals the `sha256` of its record; the record says `"ci": "passed"`.
    - After `SIGTERM` under load — exit code `0`, and the tasks on disk = 6 + every `201` of both loads.
    - `restore-drill` — `✔ the restored store answers the same as the live one`; `check:deploy` on 4311 and 4312 with the same day — the same `summary:` line (`… pending …, due on or before 2026-03-02 …`).
    - 1.1.0: CI stopped at `test`; `check:deploy` — `✖ ?sort=priority goes high, normal, low`; after the rollback to 1.0.0 — every line `✔`.

    **Evidence:** the two commits, `RUNBOOK.md` and `docs/server.md` with the commands and the output you saw.
