<!doctype html>
<html lang="%%htmlLang%%">
<head>
  <meta charset="utf-8">
  <title>%%projectTitle%%</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- React draws the whole page into #root. The browser cannot run .tsx, so `npm run build`
       turns main.tsx and everything it imports into dist/app.js; a module loaded with import()
       (the lazy summary route) goes into its own file in dist/, fetched when the route opens. -->
  <div id="root"></div>
  <script type="module" src="dist/app.js"></script>
</body>
</html>
