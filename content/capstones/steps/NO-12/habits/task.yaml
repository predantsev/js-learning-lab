# Habit tracker variant of step NO-12 (a local step: done in the learner's editor and terminal; no platform
# checks). Checked on macOS on the scratch project of this capstone after NO-06, in a Ukrainian and an English
# workspace, on Node.js 25.2.1 and 22.13.1: npm test in server/ (79, of them 10 in tests/ops.test.ts), npm run
# check and npm run check:server (25.2.1), and the whole rehearsal of the intro by a script on both versions, with
# the fixed day 2026-03-01 (records on disk = 6 + every 201: 365 = 6 + 260 + 99 on 25.2.1, 373 = 6 + 264 + 103 on
# 22.13.1). The load also marks days done: 261 answers 200, habit_completions_recorded_total 259 — two of the
# days were already there. Latency test: p95 of a sorted page of 20,000 synthetic habits (30 days each) measured
# 89–94 ms (25.2.1) and 87–94 ms (22.13.1); budget 400 ms. Wrong variants run against tests/ops.test.ts, each
# failed at least one test: the wishlist's list (see its task header) plus a completion counted even when the day
# is already there, a completion never counted, the completions route not labelled, the drill counting on the
# local day without TODAY; check:deploy mistakes failed a check script run against defective servers. Equivalent: the drill's "never the live
# folder" guard (the "not empty" refusal stops it first, the live file unchanged). Not run on Linux or Windows.
instructions:
  uk: |
    Запусти сервер трекера звичок у production-режимі з метрикою записаних виконань; віднови backup і переконайся, що кількість виконань і серія кожної звички на фіксований день збігаються; відкоти оновлення. Платформа цей крок не перевіряє.

    1. `src/config.ts`: `SHUTDOWN_DEADLINE_MS`, `NODE_ENV`.
    2. `src/metrics.ts` (`createMetrics`, `routeLabel` з `/v1/records/:id/completions`) і лічильник `habit_completions_recorded_total` — лише днів, які `POST /v1/records/:id/completions` справді додав (не тих, що вже були); у `src/server.ts` — `/livez`, `/readyz`, `/metrics`, параметр `ops` у `createRecordsServer`, завершення за `SIGTERM`/`SIGINT` з дедлайном і `closeIdleConnections()` після відповіді.
    3. `scripts/build.mjs` (`RUN_TIME_FILES = ["data/habits.json"]`), `scripts/pack.mjs`, `scripts/ci.mjs`, `scripts/load.mjs`, `scripts/top-self-time.mjs`; `src/check-deploy.ts` (`?active=true|false`, разом — увесь список, `?sort=name`, `summary:` з кількістю звичок, днів виконання й серіями на день — другий аргумент), `src/restore-drill.ts` (кількість, `id`, виконання й серії на день `TODAY`); `BACKUP_NAME` експортовано з `src/backup.ts`.
    4. `package.json`: версія `1.0.0` і скрипти, як в інтро; у `.gitignore` проєкту — `server/release/`, `server/artifacts/`, `server/profiles/`; в `ignores` файлу `eslint.config.mjs` — `server/release/`, `server/.check/`.
    5. `tests/ops.test.ts` (і `habit_completions_recorded_total counts only the days that "done" really added`); `RUNBOOK.md` (симптом інциденту: у списку активних звичок — звички на паузі).
    6. Репетиція з інтро з фіксованим днем: `TODAY=2026-03-01` для `backup` і `restore-drill`, день — другий аргумент `check:deploy` (`npm run -s check:deploy -- http://127.0.0.1:4311 2026-03-01`). Дефект 1.1.0: у `src/list.ts` фільтр `active` навпаки (`String(habit.active) !== active`).
    7. `docs/server.md`, розділ «NO-12»; два commit-и з інтро.

    Назви тестів для кроку 11 інтро — ті самі, що в інтро; латентний тест — `a sorted page of 20,000 synthetic habits stays within the latency budget`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ tests 79`, `ℹ fail 0`; `npm run check` і `npm run check:server` — усі `✔`; `npm run lint` у теці проєкту після `npm run ci` — без помилок.
    - `shasum -a 256` артефакту дорівнює `sha256` його запису; запис каже `"ci": "passed"`.
    - Після навантаження `/metrics` має `habit_completions_recorded_total` — не більше за кількість відповідей `200` маршруту `/v1/records/:id/completions` (у нас 259 із 261: два дні вже були).
    - Після `SIGTERM` під навантаженням — код `0`, а звичок на диску = 6 + усі `201` обох навантажень.
    - `restore-drill` — `✔ the restored store answers the same as the live one`; `check:deploy` на 4311 і 4312 з тим самим днем — однаковий рядок `summary:` із серіями.
    - 1.1.0: CI зупинився на `test`; `check:deploy` — `✖ ?active=true answers only active habits`; після відкату до 1.0.0 — усі `✔`.

    **Доказ:** два commit-и, `RUNBOOK.md` і `docs/server.md` із командами й побаченим виводом.
  en: |
    Run the habit server in production mode with a metric of recorded completions; restore a backup and make sure each habit's completion count and streak for a fixed day match; roll an upgrade back. The platform does not check this step.

    1. `src/config.ts`: `SHUTDOWN_DEADLINE_MS`, `NODE_ENV`.
    2. `src/metrics.ts` (`createMetrics`, `routeLabel` with `/v1/records/:id/completions`) and the counter `habit_completions_recorded_total` — only of the days that `POST /v1/records/:id/completions` really added (not of those already there); in `src/server.ts` — `/livez`, `/readyz`, `/metrics`, the `ops` parameter of `createRecordsServer`, the shutdown on `SIGTERM`/`SIGINT` with a deadline and `closeIdleConnections()` after an answer.
    3. `scripts/build.mjs` (`RUN_TIME_FILES = ["data/habits.json"]`), `scripts/pack.mjs`, `scripts/ci.mjs`, `scripts/load.mjs`, `scripts/top-self-time.mjs`; `src/check-deploy.ts` (`?active=true|false`, together the whole list, `?sort=name`, a `summary:` with the count of habits, of completion days and the streaks for the day of the second argument), `src/restore-drill.ts` (the count, the `id`s, the completions and the streaks for the day `TODAY`); `BACKUP_NAME` exported from `src/backup.ts`.
    4. `package.json`: version `1.0.0` and the scripts of the intro; in the project's `.gitignore` — `server/release/`, `server/artifacts/`, `server/profiles/`; in the `ignores` of `eslint.config.mjs` — `server/release/`, `server/.check/`.
    5. `tests/ops.test.ts` (and `habit_completions_recorded_total counts only the days that "done" really added`); `RUNBOOK.md` (the incident's symptom: the list of active habits shows paused ones).
    6. The rehearsal of the intro with a fixed day: `TODAY=2026-03-01` for `backup` and `restore-drill`, the day as the second argument of `check:deploy` (`npm run -s check:deploy -- http://127.0.0.1:4311 2026-03-01`). The defect of 1.1.0: the `active` filter of `src/list.ts` reversed (`String(habit.active) !== active`).
    7. `docs/server.md`, a section "NO-12"; the two commits of the intro.

    The test names for step 11 of the intro are those of the intro; the latency test is `a sorted page of 20,000 synthetic habits stays within the latency budget`.

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ tests 79`, `ℹ fail 0`; `npm run check` and `npm run check:server` — every check `✔`; `npm run lint` in the project folder after `npm run ci` — no errors.
    - `shasum -a 256` of the artifact equals the `sha256` of its record; the record says `"ci": "passed"`.
    - After the load `/metrics` has `habit_completions_recorded_total` — no more than the `200` answers of the route `/v1/records/:id/completions` (for us 259 of 261: two days were already there).
    - After `SIGTERM` under load — exit code `0`, and the habits on disk = 6 + every `201` of both loads.
    - `restore-drill` — `✔ the restored store answers the same as the live one`; `check:deploy` on 4311 and 4312 with the same day — the same `summary:` line with the streaks.
    - 1.1.0: CI stopped at `test`; `check:deploy` — `✖ ?active=true answers only active habits`; after the rollback to 1.0.0 — every line `✔`.

    **Evidence:** the two commits, `RUNBOOK.md` and `docs/server.md` with the commands and the output you saw.
