# Capstone step of unit RE-07 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson of kind capstone-step of RE-07 from this file.
# A local step: done in the learner's editor, terminal and browser; no platform checks. The project page
# shows only the intro of a local step, so the intro carries the whole procedure.
# Every command was run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome) in a scratch home on all
# four projects, continuing the RE-06 scratch projects. The Profiler numbers come from a headless Chrome
# run of the development build (before = the same code with one page of 1,000,000 cards); the keyboard
# walk-through used only Tab, Shift+Tab, Enter and typing. Quoted output is from the wishlist run.
# reference/ holds the same file set as RE-01 (export- and npm-generated files excluded) plus docs/.
unit: RE-07
mode: local
entry: index.html
title:
  uk: "Клавіатура й одне виміряне вузьке місце"
  en: "The keyboard and one measured bottleneck"
intro:
  uk: |
    Два завдання. Перше — перевірити, що кожну дію проєкту можна виконати лише з клавіатури. Друге — знайти **одне** повільне місце на великих синтетичних даних, виміряти його `<Profiler>` і виправити саме його — без `memo`, `useMemo` чи `useCallback` «про всяк випадок». `domain/` і `storage/` не змінюються.

    | Проєкт | Синтетичних записів (`?synthetic=`) | `<Profiler>`: монтування списку до → після (у нас) |
    |---|---|---|
    | Список бажань | 2000, `makeSyntheticWishes` | 174.6 мс → 13.5 мс |
    | Планувальник | 2000, `makeSyntheticTasks` | 204.8 мс → 13.5 мс |
    | Трекер звичок | 500, `makeSyntheticHabits(count, 365)` | 98.8 мс → 19.0 мс |
    | Трекер витрат | 5000, `makeSyntheticExpenses` | 337.5 мс → 12.9 мс |

    Нижче — «Список бажань»; перевірено на macOS (Node.js 25.2.1, React 19.3.0, esbuild 0.28.2, Chrome) на всіх чотирьох проєктах.

    **1. Стан на початку.** `cd ~/js-course/wishlist`, `git status` — чисто, `git log --oneline -1` — commit кроку про асинхронні дані.

    **2. Клавіатура.** `npm start`, `http://127.0.0.1:4310/`, миша — убік. Ми пройшли так: Tab від початку сторінки — фокус на полі назви; назва й Enter — нова картка; Tab до «Позначити отриманим» і Enter — позначка, а фокус лишається на кнопці (тепер «Повернути в бажані»); Tab — посилання «Редагувати», Enter — форма з фокусом на заголовку; Tab, Tab — ціна, нове число й Enter — сторінка бажання з новою ціною; на ній кнопки «Видалити» немає, тож Tab до «← До списку» й Enter — список; Tab до «Видалити» й Enter — фокус на «Скасувати»; Shift+Tab, Enter на «Так, видалити» — картки немає, фокус на «Видалити» наступної. Якщо якась дія у твоєму проєкті не досягається Tab чи губить фокус, виправ її, перш ніж міряти.

    **3. Синтетичні дані й вимірювання.** У `data/api.ts`: якщо в адресі (до `#`) є `?synthetic=N`, «сервер» віддає N згенерованих записів `makeSyntheticWishes(N)` зі старого `data/synthetic.js` і тримає їх у пам’яті, тож збережені бажання не читаються й не перезаписуються. Згенеровані об’єкти — звичайний JavaScript, тому їх пропускає предикат типу зі `storage/`: `makeSyntheticWishes(count).filter(isUsableItem)` (без нього `tsc` для планувальника, звичок і витрат каже `Type 'string' is not assignable to type 'Priority'` і подібне). `ui/profile.ts` експортує `reportRender` для `<Profiler id="list" onRender={reportRender}>` навколо списку: якщо в адресі є `?profile`, після кожного commit у Console рядок `profile list mount 174.6 ms`. Відкрий `http://127.0.0.1:4310/?synthetic=2000&profile#/items`, змінюй фільтр і запиши числа.

    **4. Одна виміряна причина.** У нас найдовше займав рендер **усіх** карток одразу: `profile list mount 174.6 ms`, а повернення фільтра «усі» — `update 138.6 ms`. Тож список показує 50 карток (`const PAGE_SIZE = 50;`, `shown.slice(0, pages * PAGE_SIZE)`), кнопка «Показати ще» додає наступні 50, фокус переходить на першу нову картку, а зміна фільтра починає з першої сторінки. Після цього: `profile list mount 13.5 ms`, `update 11.1 ms`. `memo`, `useMemo` чи `useCallback` ми не додавали — нічого іншого вимірювання повільним не показало. Числа запиши в `docs/performance.md` (як міряв, до, після, причина).

    **5. Тести.** У `tests/ui.test.tsx` додай тест: 60 записів — 50 карток; «Показати ще» — 60, фокус на назві 51-го, кнопки більше немає. Потім знову весь шлях кроку 2 і `tests.html`.

    **6. Перевірка.** `npm run typecheck`, `npm run lint` — лише рядки заголовка; `npm test` — `Пройшли: 33 · не пройшли: 0`; `tests.html` — сім рядків `✓` і `Пройшли: 7 · не пройшли: 0`.

    **7. Commit.** `git status --short` — ` M data/api.ts`, ` M tests/ui.test.tsx`, ` M ui/ItemsScreen.tsx`, `?? docs/`, `?? ui/profile.ts`. `git add -A`, `git commit -m "Show long lists a page at a time, measured with the Profiler"` — `[main 6c17f7a] Show long lists a page at a time, measured with the Profiler` і `5 files changed, 93 insertions(+), 5 deletions(-)`.

    **Самоперевірка:** кожна дія кроку 2 — без миші; `docs/performance.md` містить числа до й після з твого комп’ютера; з `?synthetic=…` збережені записи не змінилися (перевір без параметра); `tests.html` — `не пройшли: 0`.

    **Якщо щось пішло не так:** чисел у Console немає — в адресі немає `?profile` або параметри стоять після `#` (вони мають бути перед ним: `/?synthetic=2000&profile#/items`). У Console розробницька збірка показує більші числа, ніж production: порівнюй лише «до» й «після» на тому самому комп’ютері.

    Еталон кроку — `Завантажити: RE-07 — Клавіатура й одне виміряне вузьке місце` після експорту. Команди виконано лише на macOS; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    Two tasks. First, check that every action of the project can be done with the keyboard alone. Second, find **one** slow spot on large synthetic data, measure it with `<Profiler>` and fix exactly that — no `memo`, `useMemo` or `useCallback` “just in case”. `domain/` and `storage/` do not change.

    | Project | Synthetic records (`?synthetic=`) | `<Profiler>`: list mount before → after (ours) |
    |---|---|---|
    | Wishlist | 2000, `makeSyntheticWishes` | 174.6 ms → 13.5 ms |
    | Planner | 2000, `makeSyntheticTasks` | 204.8 ms → 13.5 ms |
    | Habit tracker | 500, `makeSyntheticHabits(count, 365)` | 98.8 ms → 19.0 ms |
    | Expense tracker | 5000, `makeSyntheticExpenses` | 337.5 ms → 12.9 ms |

    Below is the wishlist; checked on macOS (Node.js 25.2.1, React 19.3.0, esbuild 0.28.2, Chrome) on all four projects.

    **1. The starting state.** `cd ~/js-course/wishlist`, `git status` — clean, `git log --oneline -1` — the commit of the async data step.

    **2. The keyboard.** `npm start`, `http://127.0.0.1:4310/`, the mouse aside. We went like this: Tab from the top of the page — focus on the name field; a name and Enter — a new card; Tab to “Mark as acquired” and Enter — the mark, while focus stays on the button (now “Back to wanted”); Tab — the “Edit” link, Enter — the form with focus on its heading; Tab, Tab — the price, a new number and Enter — the wish's page with the new price; it has no “Delete” button, so Tab to “← To the list” and Enter — the list; Tab to “Delete” and Enter — focus on “Cancel”; Shift+Tab, Enter on “Yes, delete” — the card is gone, focus on “Delete” of the next one. If an action of your project cannot be reached with Tab or loses focus, fix it before measuring.

    **3. Synthetic data and the measurement.** In `data/api.ts`: when the address (before the `#`) has `?synthetic=N`, the “server” answers with N records generated by `makeSyntheticWishes(N)` of the old `data/synthetic.js` and keeps them in memory, so the saved wishes are neither read nor overwritten. The generated objects are plain JavaScript, so they go through the type predicate of `storage/`: `makeSyntheticWishes(count).filter(isUsableItem)` (without it `tsc` says `Type 'string' is not assignable to type 'Priority'` and the like for the planner, habits and expenses). `ui/profile.ts` exports `reportRender` for a `<Profiler id="list" onRender={reportRender}>` around the list: when the address has `?profile`, every commit prints a line such as `profile list mount 174.6 ms` in the Console. Open `http://127.0.0.1:4310/?synthetic=2000&profile#/items`, change the filter and note the numbers.

    **4. One measured cause.** For us, rendering **every** card at once took the longest: `profile list mount 174.6 ms`, and going back to the filter “all” — `update 138.6 ms`. So the list shows 50 cards (`const PAGE_SIZE = 50;`, `shown.slice(0, pages * PAGE_SIZE)`), a “Show more” button adds the next 50, focus moves to the first new card, and a filter change starts from the first page. After that: `profile list mount 13.5 ms`, `update 11.1 ms`. We added no `memo`, `useMemo` or `useCallback` — the measurement showed nothing else as slow. Write the numbers into `docs/performance.md` (how you measured, before, after, the cause).

    **5. Tests.** Add a test to `tests/ui.test.tsx`: 60 records — 50 cards; “Show more” — 60, focus on the 51st name, no button any more. Then walk the whole path of step 2 again and open `tests.html`.

    **6. Check.** `npm run typecheck`, `npm run lint` — only the header lines; `npm test` — `Passed: 33 · failed: 0`; `tests.html` — seven `✓` lines and `Passed: 7 · failed: 0`.

    **7. Commit.** `git status --short` — ` M data/api.ts`, ` M tests/ui.test.tsx`, ` M ui/ItemsScreen.tsx`, `?? docs/`, `?? ui/profile.ts`. `git add -A`, `git commit -m "Show long lists a page at a time, measured with the Profiler"` — `[main 616a114] Show long lists a page at a time, measured with the Profiler` and `5 files changed, 93 insertions(+), 5 deletions(-)`.

    **Self-check:** every action of step 2 without the mouse; `docs/performance.md` holds the before and after numbers of your computer; with `?synthetic=…` the saved records did not change (check without the parameter); `tests.html` — `failed: 0`.

    **If something goes wrong:** no numbers in the Console — the address has no `?profile`, or the parameters stand after the `#` (they belong before it: `/?synthetic=2000&profile#/items`). The development build shows larger numbers than production: compare only before and after on the same computer.

    The step's reference is `Download: RE-07 — The keyboard and one measured bottleneck` after the export. The commands were run on macOS only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це крок твого проєкту: доступність із клавіатури, Profiler і правило «спершу виміряй» з цього розділу ти застосовуєш до власного застосунку. Платформа цей крок не перевіряє: доказ — числа до й після, тести й commit."
  en: "This is a step of your project: you apply this unit's keyboard accessibility, the Profiler and the “measure first” rule to your own app. The platform does not check this step: the evidence is the before and after numbers, the tests and the commit."
objectives:
  - uk: "Виконати кожну дію проєкту лише з клавіатури й виправити те, що губить фокус."
    en: "Do every action of the project with the keyboard alone and fix whatever loses focus."
  - uk: "Виміряти список на великих синтетичних даних `<Profiler>`, усунути одну виміряну причину й записати числа до й після."
    en: "Measure the list on large synthetic data with `<Profiler>`, fix one measured cause and record the before and after numbers."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й браузері на твоєму комп’ютері: що змінити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and a browser on your computer: what to change, the expected output and the self-check list are above and on the step's page in your project."
