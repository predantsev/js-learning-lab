# Expense tracker variant of step RE-07 (a local step: done in the learner's editor, terminal and browser, no
# platform checks). Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2,
# Chrome) on the scratch project of this capstone after RE-06.
instructions:
  uk: |
    Зроби проєкт повністю керованим із клавіатури й усунь одне виміряне вузьке місце. `domain/` і `storage/` не змінюються. Платформа цей крок не перевіряє.

    1. Лише з клавіатури (Tab, Shift+Tab, Enter, набір): додати, змінити (зокрема категорію) і видалити з підтвердженням; після кожної дії фокус лишається на зрозумілому місці. Що не досягається — виправ.
    2. `data/api.ts`: з `?synthetic=N` в адресі (до `#`) «сервер» віддає `makeSyntheticExpenses(N).filter(isUsableExpense)` лише з пам’яті.
    3. `ui/profile.ts` — `reportRender` для `<Profiler id="list" onRender={reportRender}>` навколо списку в `ExpensesScreen`; з `?profile` він друкує `profile list <фаза> <мс>`.
    4. `http://127.0.0.1:4310/?synthetic=5000&profile#/expenses` — запиши монтування й зміну фільтра (у нас монтування 337.5 мс).
    5. Виправ одну виміряну причину: у нас — рендер усіх карток; тепер 50 карток і «%%moreLabel%%» (фокус на першу нову, фільтр починає з першої сторінки). У нас монтування стало 12.9 мс. Без `memo`/`useMemo`/`useCallback`.
    6. `docs/performance.md` — як міряв, до, після, причина; тест «%%moreLabel%%» у `tests/ui.test.tsx` (60 записів → 50 карток → 60, фокус на 51-й).
    7. `npm run typecheck`, `npm run lint` — без зауважень; `npm test` — 32 тести і `не пройшли: 0`; `tests.html` — сім рядків `✓`.
    8. `git add -A`, `git commit -m "Show long lists a page at a time, measured with the Profiler"`.
  en: |
    Make the project fully keyboard-operable and fix one measured bottleneck. `domain/` and `storage/` do not change. The platform does not check this step.

    1. With the keyboard alone (Tab, Shift+Tab, Enter, typing): add, edit (the category too) and delete with the confirmation; after every action focus stays somewhere sensible. Fix what cannot be reached.
    2. `data/api.ts`: with `?synthetic=N` in the address (before the `#`) the “server” answers with `makeSyntheticExpenses(N).filter(isUsableExpense)` from memory only.
    3. `ui/profile.ts` — `reportRender` for a `<Profiler id="list" onRender={reportRender}>` around the list in `ExpensesScreen`; with `?profile` it prints `profile list <phase> <ms>`.
    4. `http://127.0.0.1:4310/?synthetic=5000&profile#/expenses` — note the mount and a filter change (our mount: 337.5 ms).
    5. Fix one measured cause: for us, rendering every card; now 50 cards and “%%moreLabel%%” (focus on the first new one, a filter starts from the first page). Our mount became 12.9 ms. No `memo`/`useMemo`/`useCallback`.
    6. `docs/performance.md` — how you measured, before, after, the cause; a “%%moreLabel%%” test in `tests/ui.test.tsx` (60 records → 50 cards → 60, focus on the 51st).
    7. `npm run typecheck`, `npm run lint` — no findings; `npm test` — 32 tests and `failed: 0`; `tests.html` — seven `✓` lines.
    8. `git add -A`, `git commit -m "Show long lists a page at a time, measured with the Profiler"`.
