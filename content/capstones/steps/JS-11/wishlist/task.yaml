  - when: { test: "the form and the delete button still change and save the list" }
    message:
      uk: "Ця перевірка додає через форму бажання «%%newName%%» із ціною 30 і чекає сьому картку й це бажання останнім у збереженому списку, а потім видаляє `w-03` («%%deleteLabel%%», «%%confirmDeleteLabel%%») і чекає збережені `id` без `w-03`. Форма й видалення тепер викликають `add` і `remove` репозиторію."
      en: "This check adds the wish “%%newName%%” with the price 30 through the form and expects a seventh card and this wish last in the saved list, then deletes `w-03` (“%%deleteLabel%%”, “%%confirmDeleteLabel%%”) and expects the saved `id`s without `w-03`. The form and the delete now call `add` and `remove` of the repository."
  - when: { test: "your repository tests pass with a correct repository" }
    message:
      uk: "Ця перевірка запускає `tests/repository.test.js` з версією `storage/repository.js` від курсу (її методи, що змінюють список, нічого не повертають) і раннером курсу та чекає хоча б один тест і жодного, що впав. Повідомлення внизу називає тест, що впав, або помилку. Якщо там «there is no file tests/repository.test.js», то файл лежить не в теці `tests/` або має іншу назву."
      en: "This check runs `tests/repository.test.js` with the course's version of `storage/repository.js` (its methods that change the list return nothing) and the course runner, and expects at least one test and none that fails. The message below names the failed test or the error. If it says “there is no file tests/repository.test.js”, the file is not in the folder `tests/` or has another name."
  - when: { test: "your tests catch a class that adds an invalid draft" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним репозиторієм. Потім вона підставляє версію, де `add` класу не викликає `addItem` і додає будь-яку чернетку, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому неправильна чернетка нічого не додає."
      en: "This check first expects all your tests to pass with a correct repository. Then it puts in a version where `add` of the class does not call `addItem` and adds any draft, and expects at least one of your tests to fail. A test in which an invalid draft adds nothing notices this defect."
  - when: { test: "your tests catch a class whose toggle only ever sets acquired" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним репозиторієм. Потім вона підставляє версію, де `toggleAcquired` класу завжди ставить `acquired: true`, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, що перемикає те саме бажання двічі й чекає `false`."
      en: "This check first expects all your tests to pass with a correct repository. Then it puts in a version where `toggleAcquired` of the class always sets `acquired: true`, and expects at least one of your tests to fail. A test that toggles the same wish twice and expects `false` notices this defect."
  - when: { test: "your tests catch a class whose toggle is not saved" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним репозиторієм. Потім вона підставляє версію, де `toggleAcquired` класу змінює список, але не зберігає його, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, що після перемикання читає тестове сховище через `loadItems`."
      en: "This check first expects all your tests to pass with a correct repository. Then it puts in a version where `toggleAcquired` of the class changes the list but does not save it, and expects at least one of your tests to fail. A test that reads the test storage with `loadItems` after a toggle notices this defect."
  - when: { test: "your tests catch a factory whose total counts acquired wishes" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним репозиторієм. Потім вона підставляє версію, де `totalWantedPrice` фабрики (а не класу) додає й ціни отриманих бажань, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест фабрики з отриманим бажанням із ціною в даних — той самий набір тестів, запущений і для класу, і для фабрики."
      en: "This check first expects all your tests to pass with a correct repository. Then it puts in a version where `totalWantedPrice` of the factory (not of the class) also adds the prices of acquired wishes, and expects at least one of your tests to fail. Only a test of the factory with an acquired wish with a price in its data notices it — the same set of tests, run for the class and for the factory."
  - when: { test: "run-tests.js runs the repository tests too" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести репозиторію проходять із правильною версією, а хоча б одна зламана змушує якийсь тест упасти. Потім вона двічі виконує `run-tests.js` з підробленим `process` (як у Node.js): із правильною версією `process.exitCode` не має стати `1`, а зі зламаною — має. Для цього `run-tests.js` імпортує `./tests/repository.test.js`."
      en: "This check first expects all your repository tests to pass with the correct version and at least one broken version to make some test fail. Then it runs `run-tests.js` twice with a stand-in `process` (as in Node.js): with the correct version `process.exitCode` must not become `1`, with the broken one it must. For that `run-tests.js` imports `./tests/repository.test.js`."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
