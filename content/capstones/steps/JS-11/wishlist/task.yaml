feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там `TypeError: Cannot read properties of undefined (reading '#…')`, то метод класу викликано без репозиторію перед крапкою: виклич `repository.toggleAcquired(id)` або передай метод через `bind`."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. If it shows `TypeError: Cannot read properties of undefined (reading '#…')`, a method of the class is called without the repository before the dot: call `repository.toggleAcquired(id)` or pass the method on with `bind`."
  - when: { test: "storage/repository.js exports the class and the factory" }
    message:
      uk: "Ця перевірка імпортує `storage/repository.js`, чекає іменовані експорти `WishlistRepository` (клас) і `createWishlistRepository` (функція), створює обидва з тестовим сховищем і шістьма бажаннями й чекає ті самі `id` у `items`. Повідомлення внизу називає те, чого бракує."
      en: "This check imports `storage/repository.js`, expects the named exports `WishlistRepository` (a class) and `createWishlistRepository` (a function), creates both with a test storage and six wishes, and expects the same `id`s in `items`. The message below names what is missing."
  - when: { test: "both designs keep the list out of reach" }
    message:
      uk: "Ця перевірка чекає, що в об’єкта репозиторію немає власної властивості з масивом (список у приватному полі класу або в змінній фабрики), що `items` щоразу повертає копію (`push` у неї нічого не змінює) і що присвоєння `repository.items = []` не замінює список. У класі список зберігає `#items`, а `items` — це `get items()`."
      en: "This check expects the repository object to have no own property holding an array (the list lives in a private field of the class or a variable of the factory), `items` to return a copy every time (a `push` into it changes nothing), and an assignment `repository.items = []` not to replace the list. In the class, `#items` holds the list and `items` is `get items()`."
  - when: { test: "both designs add a valid wish and refuse an invalid one" }
    message:
      uk: "Ця перевірка викликає `add(\"w-7\", { name, price: 30 })` і чекає нове бажання в кінці `items` з `acquired: false` і `category: null` (так його будує `addItem`), а дві неправильні чернетки (порожня назва, ціна `-5`) не мають нічого додати."
      en: "This check calls `add(\"w-7\", { name, price: 30 })` and expects a new wish at the end of `items` with `acquired: false` and `category: null` (that is how `addItem` builds it), and two invalid drafts (an empty name, a price of `-5`) must add nothing."
  - when: { test: "both designs toggle acquired there and back" }
    message:
      uk: "Ця перевірка двічі викликає `toggleAcquired(\"w-01\")` і чекає `acquired` спершу `true`, потім `false`; для отриманого бажання `w-04` один виклик дає `false`. Інші бажання не мають змінитися."
      en: "This check calls `toggleAcquired(\"w-01\")` twice and expects `acquired` to be `true`, then `false`; for the acquired wish `w-04` one call gives `false`. The other wishes must not change."
  - when: { test: "both designs save every change" }
    message:
      uk: "Ця перевірка після кожного з викликів `add`, `toggleAcquired`, `update` і `remove` читає з тестового сховища значення ключа `jsll.wishlist.v1` і чекає `{ schemaVersion: 1, records }` з тим самим списком, що в `items`. Збережи список через `saveItems` у кожному методі, що його змінює."
      en: "After each of the calls `add`, `toggleAcquired`, `update` and `remove` this check reads the value of the key `jsll.wishlist.v1` from the test storage and expects `{ schemaVersion: 1, records }` with the same list as in `items`. Save the list with `saveItems` in every method that changes it."
  - when: { test: "both designs compute the wanted total" }
