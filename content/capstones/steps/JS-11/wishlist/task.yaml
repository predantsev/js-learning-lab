# Wishlist variant of step JS-11. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  markAcquiredLabel: { uk: "Позначити отриманим", en: "Mark as acquired" }
  markWantedLabel: { uk: "Повернути в бажані", en: "Back to wanted" }
instructions:
  uk: |
    Список бажань і його збереження переходять у новий файл `storage/repository.js`. Він імпортує `addItem`, `updateItem`, `removeItem`, `summarizeItems` з `../domain/wishes.js` і `saveItems` з `./wishes.js`.

    **1. Клас `WishlistRepository`** (іменований експорт).

    - `new WishlistRepository(storage, items)` — `storage` — об’єкт із `getItem` і `setItem` (на сторінці це `localStorage`), `items` — початковий масив бажань. Тримай обидва в **приватних** полях (`#storage`, `#items`), а масив скопіюй.
    - `items` — getter лише для читання: повертає **копію** списку, тож `repository.items.push(…)` нічого в репозиторії не змінює.
    - `add(id, input)` — додає бажання через `addItem`; чернетка, яку `validateItem` відхиляє, нічого не змінює.
    - `update(id, changes)` і `remove(id)` — через `updateItem` і `removeItem`.
    - `toggleAcquired(id)` — отримане бажання стає бажаним, бажане — отриманим.
    - `totalWantedPrice()` — сума цін бажаних (не отриманих) бажань, у яких є ціна; для порожнього списку — `0`.
    - Кожен метод, що змінює список, одразу зберігає його через `saveItems(storage, список)`.

    **2. Фабрика `createWishlistRepository(storage, items)`** (іменований експорт) повертає об’єкт з тими самими `items`, `add`, `update`, `remove`, `toggleAcquired` і `totalWantedPrice`. Список тримай у змінній усередині фабрики (замикання), а не у властивості об’єкта; getter в об’єкті записують так: `get items() { … }`.

    **3. Сторінка `ui/page.js`.**

    - Коли список стає відомим (збережені бажання в `start` або початкові після `loadFixtures`), створи `new WishlistRepository(store, список)`.
    - Форма й кнопки картки більше не викликають `addItem`/`updateItem`/`removeItem` і `saveItems` самі: вони викликають `add`, `update`, `remove` репозиторію, а потім малюють `repository.items`. Функція `change` більше не потрібна.
    - У кожну картку додай кнопку з текстом «%%markAcquiredLabel%%» для бажаного бажання й «%%markWantedLabel%%» для отриманого. Її клік викликає `toggleAcquired` репозиторію й малює список заново; фокус лишається на цій кнопці в новій картці (платформа фокус не перевіряє — пройди це клавіатурою сам).

    **4. Тести `tests/repository.test.js`.** Один набір тестів для обох варіантів:

    ```js
    const designs = [
      ["class", (storage, items) => new WishlistRepository(storage, items)],
      ["factory", (storage, items) => createWishlistRepository(storage, items)],
    ];
    for (const [design, create] of designs) {
      test(design + ": …", () => { … });
    }
    ```

    Замість `localStorage` тести дають маленький об’єкт-замінник з `getItem` і `setItem`, що тримає текст у звичайному об’єкті, а збережене перевіряють через `loadItems` з `../storage/wishes.js`. Тести мають перевіряти: `add` з правильною й неправильною чернеткою, `toggleAcquired` двічі поспіль (туди й назад), що після зміни збережено той самий список, і `totalWantedPrice` з отриманим бажанням і бажанням без ціни в даних. У `run-tests.js` додай `import "./tests/repository.test.js";` поруч з імпортом тестів домену.

    **Перевір сам: де губиться `this`.** Тимчасово заміни в обробнику кнопки виклик `repository.toggleAcquired(id)` на два рядки коду `const toggle = repository.toggleAcquired;` і `toggle(id);`, натисни кнопку: у «Консолі» — `TypeError: Cannot read properties of undefined (reading '#items')`. Метод викликано без об’єкта перед крапкою, тож `this` — `undefined`, а не репозиторій. Створи на сторінці фабрику замість класу — і той самий код працює, бо методам фабрики `this` не потрібен. Поверни клас і виклик як метод (або `repository.toggleAcquired.bind(repository)`, якщо метод треба передати далі).

    **Як перевірятиметься.** Перевірки створюють обидва варіанти з тестовим сховищем і перевіряють кожен метод, копію в `items`, те, що жодна власна властивість об’єкта не тримає масив, і збереження після кожної зміни. На сторінці вони натискають нову кнопку, форму й видалення, а потім перезапускають сторінку викликом `start(storage)`. Твої тести з `tests/repository.test.js` запускаються з версією `storage/repository.js` від курсу, методи якої (`add`, `update`, `remove`, `toggleAcquired`) нічого не повертають, — тож перевіряй результат через `items` і сховище, — а потім із чотирма зламаними версіями: хоча б один твій тест має впасти з кожною. Під час цих запусків глобальні помічники перевірок сховано, тож `test` і `expect` імпортуй із `./testing.js`.
  en: |
    The wishlist and its saving move into the new file `storage/repository.js`. It imports `addItem`, `updateItem`, `removeItem`, `summarizeItems` from `../domain/wishes.js` and `saveItems` from `./wishes.js`.

    **1. The class `WishlistRepository`** (a named export).

    - `new WishlistRepository(storage, items)` — `storage` is an object with `getItem` and `setItem` (on the page it is `localStorage`), `items` is the starting array of wishes. Keep both in **private** fields (`#storage`, `#items`), and copy the array.
    - `items` is a read-only getter: it returns a **copy** of the list, so `repository.items.push(…)` changes nothing in the repository.
    - `add(id, input)` adds a wish through `addItem`; a draft that `validateItem` rejects changes nothing.
    - `update(id, changes)` and `remove(id)` work through `updateItem` and `removeItem`.
    - `toggleAcquired(id)` makes an acquired wish wanted and a wanted one acquired.
    - `totalWantedPrice()` is the sum of the prices of the wanted (not acquired) wishes that have a price; `0` for an empty list.
    - Every method that changes the list saves it right away with `saveItems(storage, list)`.

    **2. The factory `createWishlistRepository(storage, items)`** (a named export) returns an object with the same `items`, `add`, `update`, `remove`, `toggleAcquired` and `totalWantedPrice`. Keep the list in a variable inside the factory (a closure), not in a property of the object; a getter in an object is written as `get items() { … }`.

    **3. The page `ui/page.js`.**

    - When the list becomes known (the saved wishes in `start`, or the starting ones after `loadFixtures`), create `new WishlistRepository(store, list)`.
    - The form and the card buttons no longer call `addItem`/`updateItem`/`removeItem` and `saveItems` themselves: they call `add`, `update`, `remove` of the repository, then draw `repository.items`. The function `change` is no longer needed.
    - Add a button to every card with the text “%%markAcquiredLabel%%” for a wanted wish and “%%markWantedLabel%%” for an acquired one. Its click calls `toggleAcquired` of the repository and draws the list again; focus stays on this button in the new card (the platform does not check focus — go through it with the keyboard yourself).

    **4. Tests `tests/repository.test.js`.** One set of tests for both designs:

    ```js
    const designs = [
      ["class", (storage, items) => new WishlistRepository(storage, items)],
      ["factory", (storage, items) => createWishlistRepository(storage, items)],
    ];
    for (const [design, create] of designs) {
      test(design + ": …", () => { … });
    }
    ```

    Instead of `localStorage` the tests pass a small stand-in object with `getItem` and `setItem` that keeps the text in a plain object, and they check what was saved with `loadItems` from `../storage/wishes.js`. The tests must check: `add` with a valid and an invalid draft, `toggleAcquired` twice in a row (there and back), that the same list is saved after a change, and `totalWantedPrice` with an acquired wish and a wish without a price in the data. In `run-tests.js` add `import "./tests/repository.test.js";` next to the import of the domain tests.

    **Check it yourself: where `this` gets lost.** In the button handler, temporarily replace the call `repository.toggleAcquired(id)` with two lines of code, `const toggle = repository.toggleAcquired;` and `toggle(id);`, and press the button: the “Console” shows `TypeError: Cannot read properties of undefined (reading '#items')`. The method is called with no object before the dot, so `this` is `undefined`, not the repository. Create the factory on the page instead of the class, and the same code works, because the factory's methods need no `this`. Put back the class and the call as a method (or `repository.toggleAcquired.bind(repository)` if the method has to be passed on).

    **How it is checked.** The checks create both designs with a test storage and check every method, the copy in `items`, that no own property of the object holds an array, and the saving after every change. On the page they press the new button, the form and the delete, then restart the page by calling `start(storage)`. Your tests in `tests/repository.test.js` run with the course's version of `storage/repository.js`, whose methods (`add`, `update`, `remove`, `toggleAcquired`) return nothing — so check the result through `items` and the storage — and then with four broken versions: at least one of your tests must fail with each. During these runs the helper globals of the checks are hidden, so import `test` and `expect` from `./testing.js`.
nudge:
  uk: "Почни з класу й тестів до нього, а фабрику пиши, коли тести класу зелені: тоді другий елемент у масиві `designs` одразу покаже, чим фабрика відрізняється. У фабриці методи — звичайні функції в об’єкті, що беруть список зі змінної довкола, тому `this` їм не потрібен."
  en: "Start with the class and its tests, and write the factory once the class tests are green: then the second item of the `designs` array shows right away where the factory differs. In the factory the methods are ordinary functions in an object that take the list from the variable around them, so they need no `this`."
