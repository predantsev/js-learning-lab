      en: "This check restarts the page with an empty storage and expects six cards. Then in the card `w-01` it looks for a button whose name contains “%%markAcquiredLabel%%” (in the card of the acquired `w-04` — “%%markWantedLabel%%”), presses it and expects “%%acquiredMark%%” in the card, a “%%markWantedLabel%%” button and “%%summaryWantedTotal%%: 285” in the summary, and after a second click “%%markAcquiredLabel%%” again. If the click does nothing and the “Console” shows a `TypeError`, `this` got lost in the method."
