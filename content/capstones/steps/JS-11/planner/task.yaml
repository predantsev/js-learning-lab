# Planner variant of step JS-11. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  markDoneLabel: { uk: "Позначити виконаною", en: "Mark as done" }
  markPendingLabel: { uk: "Повернути в невиконані", en: "Back to pending" }
instructions:
  uk: |
    Список справ і його збереження переходять у новий файл `storage/repository.js`. Він імпортує `addTask`, `updateTask`, `removeTask`, `countDueTasks` з `../domain/tasks.js` і `saveTasks` з `./tasks.js`.

    **1. Клас `PlannerRepository`** (іменований експорт).

    - `new PlannerRepository(storage, tasks)` — `storage` — об’єкт із `getItem` і `setItem` (на сторінці це `localStorage`), `tasks` — початковий масив справ. Тримай обидва в **приватних** полях (`#storage`, `#tasks`), а масив скопіюй.
    - `items` — getter лише для читання: повертає **копію** списку, тож `repository.items.push(…)` нічого в репозиторії не змінює.
    - `add(id, input)` — додає справу через `addTask`; чернетка, яку `validateTask` відхиляє, нічого не змінює.
    - `update(id, changes)` і `remove(id)` — через `updateTask` і `removeTask`.
    - `toggleDone(id)` — виконана справа стає невиконаною, невиконана — виконаною.
    - `countDueBy(day)` — скільки невиконаних справ мають термін у день `day` (текст `"YYYY-MM-DD"`) або раніше; справа без терміну ніколи не рахується. Це те саме правило, що в `countDueTasks`.
    - Кожен метод, що змінює список, одразу зберігає його через `saveTasks(storage, список)`.

    **2. Фабрика `createPlannerRepository(storage, tasks)`** (іменований експорт) повертає об’єкт з тими самими `items`, `add`, `update`, `remove`, `toggleDone` і `countDueBy`. Список тримай у змінній усередині фабрики (замикання), а не у властивості об’єкта; getter в об’єкті записують так: `get items() { … }`.

    **3. Сторінка `ui/page.js`.**

    - Коли список стає відомим (збережені справи в `start` або початкові після `loadFixtures`), створи `new PlannerRepository(store, список)`. Підсумок «%%dueSummary%%» рахуй через `repository.countDueBy(today)`.
    - Форма й кнопки картки більше не викликають `addTask`/`updateTask`/`removeTask` і `saveTasks` самі: вони викликають `add`, `update`, `remove` репозиторію, а потім малюють `repository.items`. Функція `change` більше не потрібна.
    - У кожну картку додай кнопку з текстом «%%markDoneLabel%%» для невиконаної справи й «%%markPendingLabel%%» для виконаної. Її клік викликає `toggleDone` репозиторію й малює список заново; фокус лишається на цій кнопці в новій картці (платформа фокус не перевіряє — пройди це клавіатурою сам).

    **4. Тести `tests/repository.test.js`.** Один набір тестів для обох варіантів:

    ```js
    const designs = [
      ["class", (storage, tasks) => new PlannerRepository(storage, tasks)],
      ["factory", (storage, tasks) => createPlannerRepository(storage, tasks)],
    ];
    for (const [design, create] of designs) {
      test(design + ": …", () => { … });
    }
    ```

    Замість `localStorage` тести дають маленький об’єкт-замінник з `getItem` і `setItem`, що тримає текст у звичайному об’єкті, а збережене перевіряють через `loadTasks` з `../storage/tasks.js`. Тести мають перевіряти: `add` з правильною й неправильною чернеткою, `toggleDone` двічі поспіль (туди й назад), що після зміни збережено той самий список, і `countDueBy` з виконаною справою, термін якої вже настав, і справою без терміну в даних. У `run-tests.js` додай `import "./tests/repository.test.js";` поруч з імпортом тестів домену.

    **Перевір сам: де губиться `this`.** Тимчасово заміни в обробнику кнопки виклик `repository.toggleDone(id)` на два рядки коду `const toggle = repository.toggleDone;` і `toggle(id);`, натисни кнопку: у «Консолі» — `TypeError: Cannot read properties of undefined (reading '#tasks')`. Метод викликано без об’єкта перед крапкою, тож `this` — `undefined`, а не репозиторій. Створи на сторінці фабрику замість класу — і той самий код працює, бо методам фабрики `this` не потрібен. Поверни клас і виклик як метод (або `repository.toggleDone.bind(repository)`, якщо метод треба передати далі).

    **Як перевірятиметься.** Перевірки створюють обидва варіанти з тестовим сховищем і перевіряють кожен метод, копію в `items`, те, що жодна власна властивість об’єкта не тримає масив, і збереження після кожної зміни. На сторінці вони натискають нову кнопку, форму й видалення, а потім перезапускають сторінку викликом `start(storage)`. Твої тести з `tests/repository.test.js` запускаються з версією `storage/repository.js` від курсу, методи якої (`add`, `update`, `remove`, `toggleDone`) нічого не повертають, — тож перевіряй результат через `items` і сховище, — а потім із чотирма зламаними версіями: хоча б один твій тест має впасти з кожною. Під час цих запусків глобальні помічники перевірок сховано, тож `test` і `expect` імпортуй із `./testing.js`.
  en: |
    The list of tasks and its saving move into the new file `storage/repository.js`. It imports `addTask`, `updateTask`, `removeTask`, `countDueTasks` from `../domain/tasks.js` and `saveTasks` from `./tasks.js`.

    **1. The class `PlannerRepository`** (a named export).

    - `new PlannerRepository(storage, tasks)` — `storage` is an object with `getItem` and `setItem` (on the page it is `localStorage`), `tasks` is the starting array of tasks. Keep both in **private** fields (`#storage`, `#tasks`), and copy the array.
    - `items` is a read-only getter: it returns a **copy** of the list, so `repository.items.push(…)` changes nothing in the repository.
    - `add(id, input)` adds a task through `addTask`; a draft that `validateTask` rejects changes nothing.
    - `update(id, changes)` and `remove(id)` work through `updateTask` and `removeTask`.
    - `toggleDone(id)` makes a done task pending and a pending one done.
    - `countDueBy(day)` is how many pending tasks are due on the day `day` (the text `"YYYY-MM-DD"`) or earlier; a task without a due date never counts. It is the same rule as in `countDueTasks`.
    - Every method that changes the list saves it right away with `saveTasks(storage, list)`.

    **2. The factory `createPlannerRepository(storage, tasks)`** (a named export) returns an object with the same `items`, `add`, `update`, `remove`, `toggleDone` and `countDueBy`. Keep the list in a variable inside the factory (a closure), not in a property of the object; a getter in an object is written as `get items() { … }`.

    **3. The page `ui/page.js`.**

    - When the list becomes known (the saved tasks in `start`, or the starting ones after `loadFixtures`), create `new PlannerRepository(store, list)`. Compute the summary “%%dueSummary%%” with `repository.countDueBy(today)`.
    - The form and the card buttons no longer call `addTask`/`updateTask`/`removeTask` and `saveTasks` themselves: they call `add`, `update`, `remove` of the repository, then draw `repository.items`. The function `change` is no longer needed.
    - Add a button to every card with the text “%%markDoneLabel%%” for a pending task and “%%markPendingLabel%%” for a done one. Its click calls `toggleDone` of the repository and draws the list again; focus stays on this button in the new card (the platform does not check focus — go through it with the keyboard yourself).

    **4. Tests `tests/repository.test.js`.** One set of tests for both designs:

    ```js
    const designs = [
      ["class", (storage, tasks) => new PlannerRepository(storage, tasks)],
      ["factory", (storage, tasks) => createPlannerRepository(storage, tasks)],
    ];
    for (const [design, create] of designs) {
      test(design + ": …", () => { … });
    }
    ```

    Instead of `localStorage` the tests pass a small stand-in object with `getItem` and `setItem` that keeps the text in a plain object, and they check what was saved with `loadTasks` from `../storage/tasks.js`. The tests must check: `add` with a valid and an invalid draft, `toggleDone` twice in a row (there and back), that the same list is saved after a change, and `countDueBy` with a done task whose due date has already come and a task without a due date in the data. In `run-tests.js` add `import "./tests/repository.test.js";` next to the import of the domain tests.

    **Check it yourself: where `this` gets lost.** In the button handler, temporarily replace the call `repository.toggleDone(id)` with two lines of code, `const toggle = repository.toggleDone;` and `toggle(id);`, and press the button: the “Console” shows `TypeError: Cannot read properties of undefined (reading '#tasks')`. The method is called with no object before the dot, so `this` is `undefined`, not the repository. Create the factory on the page instead of the class, and the same code works, because the factory's methods need no `this`. Put back the class and the call as a method (or `repository.toggleDone.bind(repository)` if the method has to be passed on).

    **How it is checked.** The checks create both designs with a test storage and check every method, the copy in `items`, that no own property of the object holds an array, and the saving after every change. On the page they press the new button, the form and the delete, then restart the page by calling `start(storage)`. Your tests in `tests/repository.test.js` run with the course's version of `storage/repository.js`, whose methods (`add`, `update`, `remove`, `toggleDone`) return nothing — so check the result through `items` and the storage — and then with four broken versions: at least one of your tests must fail with each. During these runs the helper globals of the checks are hidden, so import `test` and `expect` from `./testing.js`.
nudge:
  uk: "Почни з класу й тестів до нього, а фабрику пиши, коли тести класу зелені: тоді другий елемент у масиві `designs` одразу покаже, чим фабрика відрізняється. У фабриці методи — звичайні функції в об’єкті, що беруть список зі змінної довкола, тому `this` їм не потрібен."
  en: "Start with the class and its tests, and write the factory once the class tests are green: then the second item of the `designs` array shows right away where the factory differs. In the factory the methods are ordinary functions in an object that take the list from the variable around them, so they need no `this`."
