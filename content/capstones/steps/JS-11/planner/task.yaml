feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там `TypeError: Cannot read properties of undefined (reading '#…')`, то метод класу викликано без репозиторію перед крапкою: виклич `repository.toggleDone(id)` або передай метод через `bind`."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. If it shows `TypeError: Cannot read properties of undefined (reading '#…')`, a method of the class is called without the repository before the dot: call `repository.toggleDone(id)` or pass the method on with `bind`."
  - when: { test: "storage/repository.js exports the class and the factory" }
    message:
      uk: "Ця перевірка імпортує `storage/repository.js`, чекає іменовані експорти `PlannerRepository` (клас) і `createPlannerRepository` (функція), створює обидва з тестовим сховищем і шістьма справами й чекає ті самі `id` у `items`. Повідомлення внизу називає те, чого бракує."
      en: "This check imports `storage/repository.js`, expects the named exports `PlannerRepository` (a class) and `createPlannerRepository` (a function), creates both with a test storage and six tasks, and expects the same `id`s in `items`. The message below names what is missing."
  - when: { test: "both designs keep the list out of reach" }
    message:
      uk: "Ця перевірка чекає, що в об’єкта репозиторію немає власної властивості з масивом (список у приватному полі класу або в змінній фабрики), що `items` щоразу повертає копію (`push` у неї нічого не змінює) і що присвоєння `repository.items = []` не замінює список. У класі список зберігає `#tasks`, а `items` — це `get items()`."
      en: "This check expects the repository object to have no own property holding an array (the list lives in a private field of the class or a variable of the factory), `items` to return a copy every time (a `push` into it changes nothing), and an assignment `repository.items = []` not to replace the list. In the class, `#tasks` holds the list and `items` is `get items()`."
  - when: { test: "both designs add a valid task and refuse an invalid one" }
    message:
      uk: "Ця перевірка викликає `add(\"t-7\", { title, dueDate: \"2026-03-04\", priority: \"high\" })` і чекає нову справу в кінці `items` з `done: false` (так її будує `addTask`), а дві неправильні чернетки (порожня назва, пріоритет `\"urgent\"`) не мають нічого додати."
      en: "This check calls `add(\"t-7\", { title, dueDate: \"2026-03-04\", priority: \"high\" })` and expects a new task at the end of `items` with `done: false` (that is how `addTask` builds it), and two invalid drafts (an empty title, the priority `\"urgent\"`) must add nothing."
  - when: { test: "both designs toggle done there and back" }
    message:
      uk: "Ця перевірка двічі викликає `toggleDone(\"t-01\")` і чекає `done` спершу `true`, потім `false`; для виконаної справи `t-04` один виклик дає `false`. Інші справи не мають змінитися."
      en: "This check calls `toggleDone(\"t-01\")` twice and expects `done` to be `true`, then `false`; for the done task `t-04` one call gives `false`. The other tasks must not change."
  - when: { test: "both designs save every change" }
    message:
      uk: "Ця перевірка після кожного з викликів `add`, `toggleDone`, `update` і `remove` читає з тестового сховища значення ключа `jsll.planner.v1` і чекає `{ schemaVersion: 1, records }` з тим самим списком, що в `items`. Збережи список через `saveTasks` у кожному методі, що його змінює."
      en: "After each of the calls `add`, `toggleDone`, `update` and `remove` this check reads the value of the key `jsll.planner.v1` from the test storage and expects `{ schemaVersion: 1, records }` with the same list as in `items`. Save the list with `saveTasks` in every method that changes it."
  - when: { test: "both designs count the tasks due by a day" }
    message:
      uk: "Ця перевірка чекає від `countDueBy(day)` число: для шести початкових справ `2` на `\"2026-03-02\"` (`t-01` і `t-02`) і `3` на `\"2026-03-10\"`, `0` для порожнього списку й `1` на `\"2026-03-02\"` після того, як `t-02` став виконаним. Виконані справи й справа без терміну не рахуються."
      en: "This check expects `countDueBy(day)` to return a number: for the six starting tasks `2` on `\"2026-03-02\"` (`t-01` and `t-02`) and `3` on `\"2026-03-10\"`, `0` for an empty list and `1` on `\"2026-03-02\"` after `t-02` became done. Done tasks and the task without a due date do not count."
  - when: { test: "every card has a button that marks the task done and back" }
    message:
      uk: "Ця перевірка перезапускає сторінку з порожнім сховищем і чекає шість карток. Потім у картці `t-01` вона шукає кнопку, чия назва містить «%%markDoneLabel%%» (у картці виконаної `t-04` — «%%markPendingLabel%%»), натискає її й чекає в картці «%%doneMark%%», кнопку «%%markPendingLabel%%» і «%%dueSummary%% 2026-03-02: 1» у підсумку, а після другого кліку — знову «%%markDoneLabel%%». Якщо клік нічого не робить і в «Консолі» `TypeError`, то `this` у методі загубився."
      en: "This check restarts the page with an empty storage and expects six cards. Then in the card `t-01` it looks for a button whose name contains “%%markDoneLabel%%” (in the card of the done `t-04` — “%%markPendingLabel%%”), presses it and expects “%%doneMark%%” in the card, a “%%markPendingLabel%%” button and “%%dueSummary%% 2026-03-02: 1” in the summary, and after a second click “%%markDoneLabel%%” again. If the click does nothing and the “Console” shows a `TypeError`, `this` got lost in the method."
  - when: { test: "a toggle is saved and survives a restart" }
    message:
      uk: "Ця перевірка натискає «%%markDoneLabel%%» у картці `t-02`, чекає `done: true` для `t-02` у збереженому значенні ключа `jsll.planner.v1`, потім викликає `start(storage)` ще раз і чекає в картці `t-02` «%%doneMark%%»."
      en: "This check presses “%%markDoneLabel%%” in the card `t-02`, expects `done: true` for `t-02` in the saved value of the key `jsll.planner.v1`, then calls `start(storage)` again and expects “%%doneMark%%” in the card `t-02`."
  - when: { test: "the form and the delete button still change and save the list" }
    message:
      uk: "Ця перевірка додає через форму справу «%%newName%%» з терміном 2026-03-04 і чекає сьому картку й цю справу останньою в збереженому списку, а потім видаляє `t-03` («%%deleteLabel%%», «%%confirmDeleteLabel%%») і чекає збережені `id` без `t-03`. Форма й видалення тепер викликають `add` і `remove` репозиторію."
      en: "This check adds the task “%%newName%%” due on 2026-03-04 through the form and expects a seventh card and this task last in the saved list, then deletes `t-03` (“%%deleteLabel%%”, “%%confirmDeleteLabel%%”) and expects the saved `id`s without `t-03`. The form and the delete now call `add` and `remove` of the repository."
  - when: { test: "your repository tests pass with a correct repository" }
    message:
      uk: "Ця перевірка запускає `tests/repository.test.js` з версією `storage/repository.js` від курсу (її методи, що змінюють список, нічого не повертають) і раннером курсу та чекає хоча б один тест і жодного, що впав. Повідомлення внизу називає тест, що впав, або помилку. Якщо там «there is no file tests/repository.test.js», то файл лежить не в теці `tests/` або має іншу назву."
      en: "This check runs `tests/repository.test.js` with the course's version of `storage/repository.js` (its methods that change the list return nothing) and the course runner, and expects at least one test and none that fails. The message below names the failed test or the error. If it says “there is no file tests/repository.test.js”, the file is not in the folder `tests/` or has another name."
  - when: { test: "your tests catch a class that adds an invalid draft" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним репозиторієм. Потім вона підставляє версію, де `add` класу не викликає `addTask` і додає будь-яку чернетку, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому неправильна чернетка нічого не додає."
      en: "This check first expects all your tests to pass with a correct repository. Then it puts in a version where `add` of the class does not call `addTask` and adds any draft, and expects at least one of your tests to fail. A test in which an invalid draft adds nothing notices this defect."
  - when: { test: "your tests catch a class whose toggle only ever sets done" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним репозиторієм. Потім вона підставляє версію, де `toggleDone` класу завжди ставить `done: true`, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, що перемикає ту саму справу двічі й чекає `false`."
      en: "This check first expects all your tests to pass with a correct repository. Then it puts in a version where `toggleDone` of the class always sets `done: true`, and expects at least one of your tests to fail. A test that toggles the same task twice and expects `false` notices this defect."
  - when: { test: "your tests catch a class whose toggle is not saved" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним репозиторієм. Потім вона підставляє версію, де `toggleDone` класу змінює список, але не зберігає його, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, що після перемикання читає тестове сховище через `loadTasks`."
      en: "This check first expects all your tests to pass with a correct repository. Then it puts in a version where `toggleDone` of the class changes the list but does not save it, and expects at least one of your tests to fail. A test that reads the test storage with `loadTasks` after a toggle notices this defect."
  - when: { test: "your tests catch a factory whose count includes done tasks" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним репозиторієм. Потім вона підставляє версію, де `countDueBy` фабрики (а не класу) рахує й виконані справи, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест фабрики з виконаною справою, термін якої настав, — той самий набір тестів, запущений і для класу, і для фабрики."
      en: "This check first expects all your tests to pass with a correct repository. Then it puts in a version where `countDueBy` of the factory (not of the class) also counts done tasks, and expects at least one of your tests to fail. Only a test of the factory with a done task whose due date has come notices it — the same set of tests, run for the class and for the factory."
  - when: { test: "run-tests.js runs the repository tests too" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести репозиторію проходять із правильною версією, а хоча б одна зламана змушує якийсь тест упасти. Потім вона двічі виконує `run-tests.js` з підробленим `process` (як у Node.js): із правильною версією `process.exitCode` не має стати `1`, а зі зламаною — має. Для цього `run-tests.js` імпортує `./tests/repository.test.js`."
      en: "This check first expects all your repository tests to pass with the correct version and at least one broken version to make some test fail. Then it runs `run-tests.js` twice with a stand-in `process` (as in Node.js): with the correct version `process.exitCode` must not become `1`, with the broken one it must. For that `run-tests.js` imports `./tests/repository.test.js`."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
