# Habits variant of step JS-11. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  markTodayLabel: { uk: "Позначити сьогодні", en: "Mark today" }
  doneTodayMark: { uk: "Сьогодні виконано", en: "Completed today" }
instructions:
  uk: |
    Список звичок і його збереження переходять у новий файл `storage/repository.js`. Він імпортує `addHabit`, `updateHabit`, `removeHabit`, `completeHabit`, `summarizeHabit` з `../domain/habits.js` і `saveHabits` з `./habits.js`.

    **1. Клас `HabitRepository`** (іменований експорт).

    - `new HabitRepository(storage, habits)` — `storage` — об’єкт із `getItem` і `setItem` (на сторінці це `localStorage`), `habits` — початковий масив звичок. Тримай обидва в **приватних** полях (`#storage`, `#habits`), а масив скопіюй.
    - `items` — getter лише для читання: повертає **копію** списку, тож `repository.items.push(…)` нічого в репозиторії не змінює.
    - `add(id, input)` — додає звичку через `addHabit`; чернетка, яку `validateHabit` відхиляє, нічого не змінює.
    - `update(id, changes)` і `remove(id)` — через `updateHabit` і `removeHabit`.
    - `markCompleted(id, day)` — додає день `day` (текст `"YYYY-MM-DD"`, не раніший за збережені дати) до `completions` звички через `completeHabit`; день, що вже є, не додається вдруге.
    - `completionRate(id, days)` — частка днів із масиву `days`, коли звичку виконано (`summarizeHabit(habit, days).rate`); для невідомого `id` — `0`.
    - Кожен метод, що змінює список, одразу зберігає його через `saveHabits(storage, список)`.

    **2. Фабрика `createHabitRepository(storage, habits)`** (іменований експорт) повертає об’єкт з тими самими `items`, `add`, `update`, `remove`, `markCompleted` і `completionRate`. Список тримай у змінній усередині фабрики (замикання), а не у властивості об’єкта; getter в об’єкті записують так: `get items() { … }`.

    **3. Сторінка `ui/page.js`.**

    - Коли список стає відомим (збережені звички в `start` або початкові після `loadFixtures`), створи `new HabitRepository(store, список)`.
    - Форма й кнопки картки більше не викликають `addHabit`/`updateHabit`/`removeHabit` і `saveHabits` самі: вони викликають `add`, `update`, `remove` репозиторію, а потім малюють `repository.items`. Функція `change` більше не потрібна.
    - Біля `lastDays` додай `const today = "2026-03-02";` — день, який записує кнопка (як і `lastDays`, він зафіксований, щоб сторінка щоразу показувала те саме). У кожну картку додай кнопку з текстом «%%markTodayLabel%%». Її клік викликає `markCompleted(id, today)` репозиторію й малює список заново; фокус лишається на цій кнопці в новій картці (платформа фокус не перевіряє — пройди це клавіатурою сам). Картка звички, у `completions` якої є `today`, показує ще й текст «%%doneTodayMark%%».

    **4. Тести `tests/repository.test.js`.** Один набір тестів для обох варіантів:

    ```js
    const designs = [
      ["class", (storage, habits) => new HabitRepository(storage, habits)],
      ["factory", (storage, habits) => createHabitRepository(storage, habits)],
    ];
    for (const [design, create] of designs) {
      test(design + ": …", () => { … });
    }
    ```

    Замість `localStorage` тести дають маленький об’єкт-замінник з `getItem` і `setItem`, що тримає текст у звичайному об’єкті, а збережене перевіряють через `loadHabits` з `../storage/habits.js`. Тести мають перевіряти: `add` з правильною й неправильною чернеткою, `markCompleted` з тим самим днем двічі поспіль (день є лише раз), що після зміни збережено той самий список, і `completionRate` для звички, у якої є виконання й поза переданими днями. У `run-tests.js` додай `import "./tests/repository.test.js";` поруч з імпортом тестів домену.

    **Перевір сам: де губиться `this`.** Тимчасово заміни в обробнику кнопки виклик `repository.markCompleted(id, today)` на два рядки коду `const mark = repository.markCompleted;` і `mark(id, today);`, натисни кнопку: у «Консолі» — `TypeError: Cannot read properties of undefined (reading '#habits')`. Метод викликано без об’єкта перед крапкою, тож `this` — `undefined`, а не репозиторій. Створи на сторінці фабрику замість класу — і той самий код працює, бо методам фабрики `this` не потрібен. Поверни клас і виклик як метод (або `repository.markCompleted.bind(repository)`, якщо метод треба передати далі).

    **Як перевірятиметься.** Перевірки створюють обидва варіанти з тестовим сховищем і перевіряють кожен метод, копію в `items`, те, що жодна власна властивість об’єкта не тримає масив, і збереження після кожної зміни. На сторінці вони натискають нову кнопку, форму й видалення, а потім перезапускають сторінку викликом `start(storage)`. Твої тести з `tests/repository.test.js` запускаються з версією `storage/repository.js` від курсу, методи якої (`add`, `update`, `remove`, `markCompleted`) нічого не повертають, — тож перевіряй результат через `items` і сховище, — а потім із чотирма зламаними версіями: хоча б один твій тест має впасти з кожною. Під час цих запусків глобальні помічники перевірок сховано, тож `test` і `expect` імпортуй із `./testing.js`.
  en: |
    The list of habits and its saving move into the new file `storage/repository.js`. It imports `addHabit`, `updateHabit`, `removeHabit`, `completeHabit`, `summarizeHabit` from `../domain/habits.js` and `saveHabits` from `./habits.js`.

    **1. The class `HabitRepository`** (a named export).

    - `new HabitRepository(storage, habits)` — `storage` is an object with `getItem` and `setItem` (on the page it is `localStorage`), `habits` is the starting array of habits. Keep both in **private** fields (`#storage`, `#habits`), and copy the array.
    - `items` is a read-only getter: it returns a **copy** of the list, so `repository.items.push(…)` changes nothing in the repository.
    - `add(id, input)` adds a habit through `addHabit`; a draft that `validateHabit` rejects changes nothing.
    - `update(id, changes)` and `remove(id)` work through `updateHabit` and `removeHabit`.
    - `markCompleted(id, day)` adds the day `day` (the text `"YYYY-MM-DD"`, not earlier than the stored dates) to the habit's `completions` through `completeHabit`; a day that is already there is not added again.
    - `completionRate(id, days)` is the share of the days in the array `days` on which the habit was completed (`summarizeHabit(habit, days).rate`); `0` for an unknown `id`.
    - Every method that changes the list saves it right away with `saveHabits(storage, list)`.

    **2. The factory `createHabitRepository(storage, habits)`** (a named export) returns an object with the same `items`, `add`, `update`, `remove`, `markCompleted` and `completionRate`. Keep the list in a variable inside the factory (a closure), not in a property of the object; a getter in an object is written as `get items() { … }`.

    **3. The page `ui/page.js`.**

    - When the list becomes known (the saved habits in `start`, or the starting ones after `loadFixtures`), create `new HabitRepository(store, list)`.
    - The form and the card buttons no longer call `addHabit`/`updateHabit`/`removeHabit` and `saveHabits` themselves: they call `add`, `update`, `remove` of the repository, then draw `repository.items`. The function `change` is no longer needed.
    - Next to `lastDays` add `const today = "2026-03-02";` — the day the button records (like `lastDays`, it is fixed, so the page shows the same every time). Add a button with the text “%%markTodayLabel%%” to every card. Its click calls `markCompleted(id, today)` of the repository and draws the list again; focus stays on this button in the new card (the platform does not check focus — go through it with the keyboard yourself). The card of a habit whose `completions` contain `today` also shows the text “%%doneTodayMark%%”.

    **4. Tests `tests/repository.test.js`.** One set of tests for both designs:

    ```js
    const designs = [
      ["class", (storage, habits) => new HabitRepository(storage, habits)],
      ["factory", (storage, habits) => createHabitRepository(storage, habits)],
    ];
    for (const [design, create] of designs) {
      test(design + ": …", () => { … });
    }
    ```

    Instead of `localStorage` the tests pass a small stand-in object with `getItem` and `setItem` that keeps the text in a plain object, and they check what was saved with `loadHabits` from `../storage/habits.js`. The tests must check: `add` with a valid and an invalid draft, `markCompleted` with the same day twice in a row (the day is there once), that the same list is saved after a change, and `completionRate` for a habit that also has completions outside the given days. In `run-tests.js` add `import "./tests/repository.test.js";` next to the import of the domain tests.

    **Check it yourself: where `this` gets lost.** In the button handler, temporarily replace the call `repository.markCompleted(id, today)` with two lines of code, `const mark = repository.markCompleted;` and `mark(id, today);`, and press the button: the “Console” shows `TypeError: Cannot read properties of undefined (reading '#habits')`. The method is called with no object before the dot, so `this` is `undefined`, not the repository. Create the factory on the page instead of the class, and the same code works, because the factory's methods need no `this`. Put back the class and the call as a method (or `repository.markCompleted.bind(repository)` if the method has to be passed on).

    **How it is checked.** The checks create both designs with a test storage and check every method, the copy in `items`, that no own property of the object holds an array, and the saving after every change. On the page they press the new button, the form and the delete, then restart the page by calling `start(storage)`. Your tests in `tests/repository.test.js` run with the course's version of `storage/repository.js`, whose methods (`add`, `update`, `remove`, `markCompleted`) return nothing — so check the result through `items` and the storage — and then with four broken versions: at least one of your tests must fail with each. During these runs the helper globals of the checks are hidden, so import `test` and `expect` from `./testing.js`.
nudge:
  uk: "Почни з класу й тестів до нього, а фабрику пиши, коли тести класу зелені: тоді другий елемент у масиві `designs` одразу покаже, чим фабрика відрізняється. У фабриці методи — звичайні функції в об’єкті, що беруть список зі змінної довкола, тому `this` їм не потрібен."
  en: "Start with the class and its tests, and write the factory once the class tests are green: then the second item of the `designs` array shows right away where the factory differs. In the factory the methods are ordinary functions in an object that take the list from the variable around them, so they need no `this`."
