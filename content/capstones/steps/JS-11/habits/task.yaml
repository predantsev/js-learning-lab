feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там `TypeError: Cannot read properties of undefined (reading '#…')`, то метод класу викликано без репозиторію перед крапкою: виклич `repository.markCompleted(id, today)` або передай метод через `bind`."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. If it shows `TypeError: Cannot read properties of undefined (reading '#…')`, a method of the class is called without the repository before the dot: call `repository.markCompleted(id, today)` or pass the method on with `bind`."
  - when: { test: "storage/repository.js exports the class and the factory" }
    message:
      uk: "Ця перевірка імпортує `storage/repository.js`, чекає іменовані експорти `HabitRepository` (клас) і `createHabitRepository` (функція), створює обидва з тестовим сховищем і шістьма звичками й чекає ті самі `id` у `items`. Повідомлення внизу називає те, чого бракує."
      en: "This check imports `storage/repository.js`, expects the named exports `HabitRepository` (a class) and `createHabitRepository` (a function), creates both with a test storage and six habits, and expects the same `id`s in `items`. The message below names what is missing."
  - when: { test: "both designs keep the list out of reach" }
    message:
      uk: "Ця перевірка чекає, що в об’єкта репозиторію немає власної властивості з масивом (список у приватному полі класу або в змінній фабрики), що `items` щоразу повертає копію (`push` у неї нічого не змінює) і що присвоєння `repository.items = []` не замінює список. У класі список зберігає `#habits`, а `items` — це `get items()`."
      en: "This check expects the repository object to have no own property holding an array (the list lives in a private field of the class or a variable of the factory), `items` to return a copy every time (a `push` into it changes nothing), and an assignment `repository.items = []` not to replace the list. In the class, `#habits` holds the list and `items` is `get items()`."
  - when: { test: "both designs add a valid habit and refuse an invalid one" }
    message:
      uk: "Ця перевірка викликає `add(\"h-7\", { name, frequency: \"weekly\" })` і чекає нову звичку в кінці `items` з `active: true` і порожнім `completions` (так її будує `addHabit`), а дві неправильні чернетки (порожня назва, частота `\"monthly\"`) не мають нічого додати."
      en: "This check calls `add(\"h-7\", { name, frequency: \"weekly\" })` and expects a new habit at the end of `items` with `active: true` and empty `completions` (that is how `addHabit` builds it), and two invalid drafts (an empty name, the frequency `\"monthly\"`) must add nothing."
  - when: { test: "both designs mark a day once" }
    message:
      uk: "Ця перевірка двічі викликає `markCompleted(\"h-06\", \"2026-03-02\")` і чекає `completions` `[\"2026-03-02\"]`, а для `h-01` один виклик додає `\"2026-03-02\"` у кінець його трьох дат. Інші звички не мають змінитися."
      en: "This check calls `markCompleted(\"h-06\", \"2026-03-02\")` twice and expects the `completions` `[\"2026-03-02\"]`, and for `h-01` one call adds `\"2026-03-02\"` after its three dates. The other habits must not change."
  - when: { test: "both designs save every change" }
    message:
      uk: "Ця перевірка після кожного з викликів `add`, `markCompleted`, `update` і `remove` читає з тестового сховища значення ключа `jsll.habits.v1` і чекає `{ schemaVersion: 1, records }` з тим самим списком, що в `items`. Збережи список через `saveHabits` у кожному методі, що його змінює."
      en: "After each of the calls `add`, `markCompleted`, `update` and `remove` this check reads the value of the key `jsll.habits.v1` from the test storage and expects `{ schemaVersion: 1, records }` with the same list as in `items`. Save the list with `saveHabits` in every method that changes it."
  - when: { test: "both designs compute the completion rate over the given days" }
    message:
      uk: "Ця перевірка передає дні `[\"2026-02-26\", \"2026-02-27\", \"2026-02-28\", \"2026-03-01\"]` і чекає від `completionRate` `0.75` для `h-01`, `0.25` для `h-04` (його виконання `2026-02-22` поза цими днями), `0` для `h-06`, `0` для порожнього масиву днів і `0` для невідомого `id`."
      en: "This check passes the days `[\"2026-02-26\", \"2026-02-27\", \"2026-02-28\", \"2026-03-01\"]` and expects `completionRate` to give `0.75` for `h-01`, `0.25` for `h-04` (its completion on `2026-02-22` is outside these days), `0` for `h-06`, `0` for an empty array of days and `0` for an unknown `id`."
  - when: { test: "every card has a button that marks today once" }
    message:
      uk: "Ця перевірка перезапускає сторінку з порожнім сховищем і чекає шість карток. Потім у картці `h-01` вона натискає кнопку, чия назва містить «%%markTodayLabel%%», і чекає в картці «%%doneTodayMark%%» та «%%completionsLabel%%: 4»; після другого кліку там має лишитися «%%completionsLabel%%: 4», а збережені дати `h-01` — закінчуватися на `\"2026-03-02\"`. Якщо клік нічого не робить і в «Консолі» `TypeError`, то `this` у методі загубився."
      en: "This check restarts the page with an empty storage and expects six cards. Then in the card `h-01` it presses the button whose name contains “%%markTodayLabel%%” and expects “%%doneTodayMark%%” and “%%completionsLabel%%: 4” in the card; after a second click “%%completionsLabel%%: 4” must stay, and the saved dates of `h-01` must end with `\"2026-03-02\"`. If the click does nothing and the “Console” shows a `TypeError`, `this` got lost in the method."
  - when: { test: "a mark is saved and survives a restart" }
    message:
      uk: "Ця перевірка натискає «%%markTodayLabel%%» у картці `h-06`, чекає `\"2026-03-02\"` у `completions` звички `h-06` у збереженому значенні ключа `jsll.habits.v1`, потім викликає `start(storage)` ще раз і чекає в картці `h-06` «%%doneTodayMark%%»."
      en: "This check presses “%%markTodayLabel%%” in the card `h-06`, expects `\"2026-03-02\"` in the `completions` of `h-06` in the saved value of the key `jsll.habits.v1`, then calls `start(storage)` again and expects “%%doneTodayMark%%” in the card `h-06`."
  - when: { test: "the form and the delete button still change and save the list" }
    message:
      uk: "Ця перевірка додає через форму звичку «%%newName%%» і чекає сьому картку й цю звичку останньою в збереженому списку, а потім видаляє `h-03` («%%deleteLabel%%», «%%confirmDeleteLabel%%») і чекає збережені `id` без `h-03`. Форма й видалення тепер викликають `add` і `remove` репозиторію."
      en: "This check adds the habit “%%newName%%” through the form and expects a seventh card and this habit last in the saved list, then deletes `h-03` (“%%deleteLabel%%”, “%%confirmDeleteLabel%%”) and expects the saved `id`s without `h-03`. The form and the delete now call `add` and `remove` of the repository."
  - when: { test: "your repository tests pass with a correct repository" }
    message:
      uk: "Ця перевірка запускає `tests/repository.test.js` з версією `storage/repository.js` від курсу (її методи, що змінюють список, нічого не повертають) і раннером курсу та чекає хоча б один тест і жодного, що впав. Повідомлення внизу називає тест, що впав, або помилку. Якщо там «there is no file tests/repository.test.js», то файл лежить не в теці `tests/` або має іншу назву."
      en: "This check runs `tests/repository.test.js` with the course's version of `storage/repository.js` (its methods that change the list return nothing) and the course runner, and expects at least one test and none that fails. The message below names the failed test or the error. If it says “there is no file tests/repository.test.js”, the file is not in the folder `tests/` or has another name."
  - when: { test: "your tests catch a class that adds an invalid draft" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним репозиторієм. Потім вона підставляє версію, де `add` класу не викликає `addHabit` і додає будь-яку чернетку, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому неправильна чернетка нічого не додає."
      en: "This check first expects all your tests to pass with a correct repository. Then it puts in a version where `add` of the class does not call `addHabit` and adds any draft, and expects at least one of your tests to fail. A test in which an invalid draft adds nothing notices this defect."
  - when: { test: "your tests catch a class that marks the same day twice" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним репозиторієм. Потім вона підставляє версію, де `markCompleted` класу додає день, навіть якщо він уже є, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, що позначає той самий день двічі й чекає його в `completions` один раз."
      en: "This check first expects all your tests to pass with a correct repository. Then it puts in a version where `markCompleted` of the class adds the day even if it is already there, and expects at least one of your tests to fail. A test that marks the same day twice and expects it once in `completions` notices this defect."
  - when: { test: "your tests catch a class whose mark is not saved" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним репозиторієм. Потім вона підставляє версію, де `markCompleted` класу змінює список, але не зберігає його, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, що після позначки читає тестове сховище через `loadHabits`."
      en: "This check first expects all your tests to pass with a correct repository. Then it puts in a version where `markCompleted` of the class changes the list but does not save it, and expects at least one of your tests to fail. A test that reads the test storage with `loadHabits` after a mark notices this defect."
  - when: { test: "your tests catch a factory whose rate counts days outside the range" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним репозиторієм. Потім вона підставляє версію, де `completionRate` фабрики (а не класу) ділить усі виконання звички на кількість днів, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест фабрики зі звичкою, виконаною й поза переданими днями, — той самий набір тестів, запущений і для класу, і для фабрики."
      en: "This check first expects all your tests to pass with a correct repository. Then it puts in a version where `completionRate` of the factory (not of the class) divides all completions of the habit by the number of days, and expects at least one of your tests to fail. Only a test of the factory with a habit also completed outside the given days notices it — the same set of tests, run for the class and for the factory."
  - when: { test: "run-tests.js runs the repository tests too" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести репозиторію проходять із правильною версією, а хоча б одна зламана змушує якийсь тест упасти. Потім вона двічі виконує `run-tests.js` з підробленим `process` (як у Node.js): із правильною версією `process.exitCode` не має стати `1`, а зі зламаною — має. Для цього `run-tests.js` імпортує `./tests/repository.test.js`."
      en: "This check first expects all your repository tests to pass with the correct version and at least one broken version to make some test fail. Then it runs `run-tests.js` twice with a stand-in `process` (as in Node.js): with the correct version `process.exitCode` must not become `1`, with the broken one it must. For that `run-tests.js` imports `./tests/repository.test.js`."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
