# The step is checked in the platform: it continues from the JS-09 reference (JS-15 and JS-10 are
# local steps, so the platform project still holds the JS-09 files).
unit: JS-11
mode: in-platform
entry: index.html
title:
  uk: "Репозиторій: клас і фабрика"
  en: "Repository: a class and a factory"
intro:
  uk: |
    Досі сторінка сама тримала список записів у змінній і сама викликала збереження після кожної зміни. На цьому кроці список і його збереження переходять в одне місце — [[adapter|репозиторій]] у новому файлі `storage/repository.js`. Сторінка більше не змінює список напряму: вона просить репозиторій додати, змінити чи видалити запис, а репозиторій сам усе зберігає.

    Ти пишеш той самий репозиторій двома способами із цього розділу:

    - **клас** із [[private-field|приватними полями]] `#…` для списку й сховища та [[getter|getter]] `items`, що віддає копію списку;
    - **фабрику** `create…Repository(storage, records)`, де список тримає [[closure|замикання]], а методи обходяться без `this`.

    Обидва варіанти проходять **ті самі** тести: у `tests/repository.test.js` один набір тестів крутиться в циклі для класу й для фабрики. А обробник кнопки в картці викликає метод класу так, щоб `this` не загубився: саме тут клас і фабрика поводяться по-різному.

    > [!note]
    > Якщо ти вже експортував проєкт (контрольна точка CP-JS), твої локальні файли — головні, і платформа їх не змінює. Тоді спершу зроби commit у своїй теці, завантаж еталон цього кроку з екрана проєкту й перенеси зміни вручну, звіряючи файли, як у уроках розділу JS-10.
  en: |
    Until now the page itself kept the list of records in a variable and itself called the saving after every change. In this step the list and its saving move into one place — a [[adapter|repository]] in the new file `storage/repository.js`. The page no longer changes the list directly: it asks the repository to add, change or delete a record, and the repository saves everything itself.

    You write the same repository in two ways from this unit:

    - a **class** with [[private-field|private fields]] `#…` for the list and the storage and a [[getter]] `items` that gives a copy of the list;
    - a **factory** `create…Repository(storage, records)`, where a [[closure]] keeps the list and the methods do without `this`.

    Both designs pass **the same** tests: in `tests/repository.test.js` one set of tests runs in a loop for the class and for the factory. And a button handler in the card calls a method of the class so that `this` is not lost: this is exactly where the class and the factory behave differently.

    > [!note]
    > If you have already exported the project (checkpoint CP-JS), your local files are the main ones, and the platform does not change them. Then first make a commit in your folder, download this step's reference from the project screen and carry the changes over by hand, comparing the files, as in the lessons of unit JS-10.
purpose:
  uk: "Це крок твого проєкту: класи з приватними полями, фабрики із замиканнями та правила `this` із цього розділу ти застосовуєш до сховища власного застосунку. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply this unit's classes with private fields, factories with closures and the rules of `this` to the storage of your own app. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Написати репозиторій записів проєкту як клас із приватними полями, getter для читання й методами, що зберігають кожну зміну."
    en: "Write the repository of the project's records as a class with private fields, a read-only getter and methods that save every change."
  - uk: "Написати еквівалентну фабрику, що тримає дані в замиканні, і запустити один набір тестів для обох варіантів."
    en: "Write an equivalent factory that keeps the data in a closure, and run one test suite against both designs."
  - uk: "Під’єднати обробник кнопки на сторінці до методу класу так, щоб `this` усередині методу був репозиторієм."
    en: "Wire a button handler on the page to a method of the class so that `this` inside the method is the repository."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередні кроки не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
