# Capstone step of unit JS-05 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-05-10-capstone-search-filter-summary from this file.
unit: JS-05
mode: in-platform
entry: index.html
title:
  uk: "Пошук, фільтр, сортування й підсумок"
  en: "Search, filter, sort and summary"
intro:
  uk: |
    Список уже вміє змінюватися. Тепер проєкт навчиться відповідати на запитання про нього: які записи містять потрібний текст, які мають певний стан, у якому порядку їх показати і скільки чого набралося разом.

    Кожна відповідь — чиста функція, яка перетворює список і не змінює його: [[array-filter|filter]] відбирає записи, [[comparator|компаратор]] задає порядок для `toSorted`, [[array-reduce|reduce]] згортає список в одне значення. Сортування — найпідступніше місце: `sort` переставляє записи в тому самому масиві ([[in-place-sort]]), тож сортуй копію.

    Підсумок — це [[derived-value|похідне значення]]: його не зберігають поруч зі списком, а щоразу обчислюють зі списку, тож він не може розійтися з даними. Сторінка покаже підсумок, відфільтрований і впорядкований список та результат пошуку.
  en: |
    The list can already change. Now the project learns to answer questions about it: which records contain some text, which are in a given state, in what order to show them and how much adds up in total.

    Every answer is a pure function that transforms the list without changing it: [[array-filter|filter]] picks records, a [[comparator]] sets the order for `toSorted`, [[array-reduce|reduce]] folds the list into one value. Sorting is the trickiest part: `sort` reorders the records inside the same array ([[in-place-sort]]), so sort a copy.

    A summary is a [[derived-value]]: it is not stored next to the list but computed from the list every time, so it cannot drift away from the data. The page shows the summary, a filtered and ordered list and a search result.
purpose:
  uk: "Це крок твого проєкту: перетворення списків із цього розділу — filter, toSorted, reduce і пошук — ти застосовуєш до власного списку записів. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply this unit's list transformations — filter, toSorted, reduce and search — to your own list of records. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Знайти записи за частиною тексту без огляду на великі й малі літери та відібрати записи з потрібним станом."
    en: "Find records by a part of their text regardless of upper and lower case, and pick the records in a given state."
  - uk: "Упорядкувати копію списку компаратором, який ставить відсутні значення в кінець і зберігає порядок рівних записів."
    en: "Order a copy of the list with a comparator that puts missing values last and keeps the order of equal records."
  - uk: "Обчислити підсумок списку чистою функцією й правильно обробити порожній список."
    en: "Compute the list's summary with a pure function and handle an empty list correctly."
  - uk: "Показати на сторінці підсумок, відфільтрований і впорядкований список та результат пошуку, не змінивши вихідного списку."
    en: "Show the summary, a filtered and ordered list and a search result on the page without changing the original list."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередні кроки не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
