# Expense tracker variant of step JS-05. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  categoryFood: { uk: "Їжа", en: "Food" }
  categoryTransport: { uk: "Транспорт", en: "Transport" }
  categoryHome: { uk: "Дім", en: "Home" }
  categoryFun: { uk: "Розваги", en: "Fun" }
  totalLabel: { uk: "Разом", en: "Total" }
  searchQuery: { uk: "кіно", en: "cinema" }
instructions:
  uk: |
    Тепер проєкт відповідатиме на запитання про список. Напиши на верхньому рівні `app.js` чотири чисті функції. Параметр `list` — будь-який список витрат; жодна функція не змінює ні його, ні витрати в ньому.

    1. **`searchExpenses(list, query)`** повертає витрати, у назві яких є текст `query`, — без огляду на великі й малі літери та на пробіли на краях запиту. Порожній запит (чи запит із самих пробілів) залишає всі витрати; якщо нічого не знайдено — порожній масив.
    2. **`filterExpenses(list, category)`** повертає витрати категорії `category` (`"food"`, `"transport"`, `"home"` чи `"fun"`); якщо таких немає — порожній масив.
    3. **`sortExpenses(list, field)`** повертає **новий** масив, упорядкований за полем `field` від меншого до більшого: `"amountMinor"` — за сумою, `"date"` — за датою (дати записані текстом `"РРРР-ММ-ДД"`, тож їх можна порівнювати як текст). Витрати з однаковим значенням поля зберігають свій порядок. Отриманий список свого порядку не змінює.
    4. **`summarizeExpenses(list)`** повертає підсумок `{ total, byCategory }`: `total` — сума всіх витрат, `byCategory` — запис із сумою для кожної із чотирьох категорій: `{ food, transport, home, fun }`. Категорія без витрат має `0`, а для порожнього списку всі суми — `0`. Суми — цілі копійки, як і в записах.

    **Сторінка.** У `index.html` заміни абзаци `list-before` і `list-after` трьома порожніми абзацами з `id` `summary`, `food` і `search`; абзаци повідомлень чернетки залиш. Три зміни списку з попереднього кроку наприкінці `app.js` можна прибрати, а функції `addExpense`, `updateExpense` і `removeExpense` — залиш. Наприкінці `app.js` запиши в абзаци:

    - `summary` — суми для `expenses` у такому вигляді, кожну через `formatAmount`: «%%categoryFood%%: 1056%%decimalMark%%00 · %%categoryTransport%%: 520%%decimalMark%%00 · %%categoryHome%%: 99%%decimalMark%%90 · %%categoryFun%%: 480%%decimalMark%%00 · %%totalLabel%%: 2155%%decimalMark%%90 %%currency%%» (роздільники — на твій смак);
    - `food` — підписи витрат категорії `"food"` від меншої суми до більшої, через `; `, як на попередньому кроці;
    - `search` — підписи витрат, знайдених за запитом «%%searchQuery%%».

    **Як перевірятиметься:** на сторінці є суми чотирьох категорій і загальна сума в цьому порядку; витрати на їжу від меншої суми — «%%fixture6Name%%», потім «%%fixture1Name%%» — без інших; і результат пошуку, у якому лише «%%fixture5Name%%». Ще платформа викликає твої функції зі своїм списком — з однаковими сумами й датами, категорією без витрат, порожнім списком — і перевіряє результати, порядок рівних витрат і те, що отриманий список не змінився.

    Перш ніж перевіряти, виведи через `console.log` результат `sortExpenses(expenses, "date")`, а потім сам `expenses`, і подивись на вкладку «Консоль»: порядок `expenses` має лишитися тим самим.
  en: |
    Now the project answers questions about the list. Write four pure functions at the top level of `app.js`. The parameter `list` is any list of expenses; no function changes it or the expenses in it.

    1. **`searchExpenses(list, query)`** returns the expenses whose label contains the text `query` — regardless of upper and lower case and of spaces at the edges of the query. An empty query (or one of only spaces) keeps every expense; when nothing is found, it returns an empty array.
    2. **`filterExpenses(list, category)`** returns the expenses of the category `category` (`"food"`, `"transport"`, `"home"` or `"fun"`); when there are none, an empty array.
    3. **`sortExpenses(list, field)`** returns a **new** array ordered by the field `field` from smaller to larger: `"amountMinor"` — by amount, `"date"` — by date (dates are `"YYYY-MM-DD"` text, so they can be compared as text). Expenses with an equal value of the field keep their order. The received list keeps its own order.
    4. **`summarizeExpenses(list)`** returns the summary `{ total, byCategory }`: `total` — the sum of all expenses, `byCategory` — a record with the sum of each of the four categories: `{ food, transport, home, fun }`. A category without expenses has `0`, and for an empty list every sum is `0`. The sums are whole kopiykas, as in the records.

    **The page.** In `index.html`, replace the paragraphs `list-before` and `list-after` with three empty paragraphs with the `id`s `summary`, `food` and `search`; keep the draft message paragraphs. You can remove the three list changes of the previous step at the end of `app.js`, but keep the functions `addExpense`, `updateExpense` and `removeExpense`. At the end of `app.js`, write into the paragraphs:

    - `summary` — the sums of `expenses` in this form, each through `formatAmount`: “%%categoryFood%%: 1056%%decimalMark%%00 · %%categoryTransport%%: 520%%decimalMark%%00 · %%categoryHome%%: 99%%decimalMark%%90 · %%categoryFun%%: 480%%decimalMark%%00 · %%totalLabel%%: 2155%%decimalMark%%90 %%currency%%” (the separators are up to you);
    - `food` — the labels of the `"food"` expenses from the smaller amount to the larger, separated by `; ` as in the previous step;
    - `search` — the labels of the expenses found for the query “%%searchQuery%%”.

    **How it is checked:** the page has the sums of the four categories and the overall total in this order; the food expenses from the smaller amount — “%%fixture6Name%%”, then “%%fixture1Name%%” — without the others; and the search result holding only “%%fixture5Name%%”. The platform also calls your functions with its own list — with equal amounts and dates, a category without expenses, an empty list — and checks the results, the order of equal expenses and that the received list did not change.

    Before checking, print with `console.log` the result of `sortExpenses(expenses, "date")` and then `expenses` itself, and look at the “Console” tab: the order of `expenses` must stay the same.
nudge:
  uk: "Пошук і фільтр — це `filter` з умовою. Текст шукає `includes`, а великі й малі літери вирівнює `toLowerCase` з обох боків: `\"Hello World\".toLowerCase().includes(\"world\")` дає `true`. Назву поля, яка прийшла в параметрі, читають через квадратні дужки: `settings[key]`. А суму однієї категорії легко читати як ланцюжок: `orders.filter((order) => order.paid).reduce((sum, order) => sum + order.total, 0)` рахує суму оплачених замовлень."
  en: "Search and filter are a `filter` with a condition. `includes` looks for text, and `toLowerCase` on both sides evens out upper and lower case: `\"Hello World\".toLowerCase().includes(\"world\")` gives `true`. A field whose name arrives in a parameter is read with square brackets: `settings[key]`. And one category's sum reads well as a chain: `orders.filter((order) => order.paid).reduce((sum, order) => sum + order.total, 0)` adds up the paid orders."
