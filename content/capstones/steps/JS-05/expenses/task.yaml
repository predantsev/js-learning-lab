feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки; інакше не проходять і перевірки сторінки. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль». Якщо там `ReferenceError` про `withNewExpense` чи `changed`, то код сторінки ще звертається до змінних, яких уже немає."
      en: "This check expects the script to run to the end without an error; otherwise the page checks fail too. The “Console” tab shows the error name and the line of code where it happened. If it shows a `ReferenceError` about `withNewExpense` or `changed`, the page code still uses variables that are gone."
  - when: { test: "the page shows the totals by category and the overall total" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого по порядку йдуть «%%categoryFood%%» `1056%%decimalMark%%00`, «%%categoryTransport%%» `520%%decimalMark%%00`, «%%categoryHome%%» `99%%decimalMark%%90`, «%%categoryFun%%» `480%%decimalMark%%00` і «%%totalLabel%%» `2155%%decimalMark%%90`. Якщо бачиш `105600` замість `1056%%decimalMark%%00`, суму показано в копійках, без `formatAmount`."
      en: "This check looks inside `<main>` for an element whose text has “%%categoryFood%%” `1056%%decimalMark%%00`, “%%categoryTransport%%” `520%%decimalMark%%00`, “%%categoryHome%%” `99%%decimalMark%%90`, “%%categoryFun%%” `480%%decimalMark%%00` and “%%totalLabel%%” `2155%%decimalMark%%90` in this order. If you see `105600` instead of `1056%%decimalMark%%00`, the sum is shown in kopiykas, without `formatAmount`."
  - when: { test: "the page shows the food expenses by amount" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого спершу «%%fixture6Name%%», потім «%%fixture1Name%%», а інших витрат з `expenses` немає."
      en: "This check looks inside `<main>` for an element whose text has “%%fixture6Name%%” first, then “%%fixture1Name%%”, and no other expense of `expenses`."
  - when: { test: "the page shows the search result" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент із результатом пошуку за «%%searchQuery%%»: у ньому є «%%fixture5Name%%» і немає жодної іншої витрати з `expenses`."
      en: "This check looks inside `<main>` for an element with the search result for “%%searchQuery%%”: it has “%%fixture5Name%%” and no other expense of `expenses`."
  - when: { test: "searchExpenses finds expenses by a part of the label, ignoring case" }
    message:
      uk: "Ця перевірка викликає `searchExpenses` зі своїм списком і чекає для запитів `\"BuS\"` і `\"  bus \"` витрати «Bus ticket» і «Night bus» — ті самі об’єкти, у тому самому порядку. Якщо знаходиться менше, то тексти порівнюються з різними великими й малими літерами або з пробілами на краях запиту."
      en: "This check calls `searchExpenses` with its own list and expects the expenses “Bus ticket” and “Night bus” — the same objects, in the same order — for the queries `\"BuS\"` and `\"  bus \"`. If fewer are found, the texts are compared with different upper and lower case or with the spaces at the edges of the query."
  - when: { test: "searchExpenses with an empty query keeps every expense and finds nothing for unknown text" }
    message:
      uk: "Ця перевірка чекає всі витрати для порожнього запиту й запиту із самих пробілів, а для тексту, якого немає в жодній назві, і для порожнього списку — порожній масив."
      en: "This check expects every expense for an empty query and for a query of only spaces, and an empty array for text that is in no label and for an empty list."
  - when: { test: "filterExpenses keeps the expenses of one category" }
    message:
      uk: "Ця перевірка чекає для `\"transport\"` і `\"food\"` лише витрати цієї категорії, у тому самому порядку, а для категорії без витрат — порожній масив."
      en: "This check expects only the expenses of that category, in the same order, for `\"transport\"` and `\"food\"`, and an empty array for a category without expenses."
  - when: { test: "sortExpenses orders a copy by amount or by date" }
    message:
      uk: "Ця перевірка чекає новий масив: за `\"amountMinor\"` — суми `800`, `800`, `1200`, `2500`, `3000`, за `\"date\"` — дати від `2026-02-28` до `2026-03-02`; витрати з однаковою сумою чи датою лишаються в порядку списку. Отриманий список свого порядку не змінює — якщо змінився й він, сортування відбулося в ньому самому, а не в копії."
      en: "This check expects a new array: for `\"amountMinor\"` the amounts `800`, `800`, `1200`, `2500`, `3000`, for `\"date\"` the dates from `2026-02-28` to `2026-03-02`; expenses with an equal amount or date keep the list's order. The received list keeps its own order — if it changed too, the sorting happened in it instead of in a copy."
  - when: { test: "summarizeExpenses gives the total of every category and the overall total" }
    message:
      uk: "Ця перевірка чекає для шести витрат проєкту `{ total: 215590, byCategory: { food: 105600, transport: 52000, home: 9990, fun: 48000 } }`, а для свого списку без витрат на дім — `home: 0`: кожна із чотирьох категорій є в `byCategory`, навіть без витрат."
      en: "This check expects `{ total: 215590, byCategory: { food: 105600, transport: 52000, home: 9990, fun: 48000 } }` for the project's six expenses, and `home: 0` for its own list without home expenses: each of the four categories is in `byCategory`, even without expenses."
  - when: { test: "summarizeExpenses of an empty list is all zeros" }
    message:
      uk: "Ця перевірка чекає для порожнього списку `{ total: 0, byCategory: { food: 0, transport: 0, home: 0, fun: 0 } }`. Якщо бачиш `TypeError` про `reduce`, то `reduce` викликано для порожнього масиву без початкового значення."
      en: "This check expects `{ total: 0, byCategory: { food: 0, transport: 0, home: 0, fun: 0 } }` for an empty list. If you see a `TypeError` about `reduce`, `reduce` was called on an empty array without an initial value."
