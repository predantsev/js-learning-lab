    en: "The page shows the summary: “%%summaryCount%%” `6`, “%%summaryWantedTotal%%” `365`, “%%summaryNoPrice%%” `1`"
  "the page shows the wanted wishes cheapest first":
    uk: "Сторінка показує ще не отримані бажання від найдешевшого"
    en: "The page shows the wishes not acquired yet, cheapest first"
  "the page shows the search result":
    uk: "Сторінка показує результат пошуку за «%%searchQuery%%»"
    en: "The page shows the search result for “%%searchQuery%%”"
  "searchItems finds wishes by a part of the name, ignoring case":
    uk: "`searchItems` знаходить бажання за частиною назви без огляду на великі й малі літери"
    en: "`searchItems` finds wishes by a part of the name regardless of case"
  "searchItems with an empty query keeps every wish and finds nothing for unknown text":
    uk: "`searchItems` з порожнім запитом лишає всі бажання, а для чужого тексту дає порожній масив"
    en: "`searchItems` keeps every wish for an empty query and gives an empty array for unknown text"
  "filterItems keeps the wanted or the acquired wishes":
    uk: "`filterItems` відбирає ще не отримані або отримані бажання"
    en: "`filterItems` picks the wishes not acquired yet or the acquired ones"
  "sortItemsByPrice orders a copy cheapest first with priceless wishes last":
    uk: "`sortItemsByPrice` упорядковує копію від найдешевшого, бажання без ціни — у кінці"
    en: "`sortItemsByPrice` orders a copy cheapest first, wishes without a price last"
  "summarizeItems counts the wishes and sums the wanted prices":
    uk: "`summarizeItems` рахує бажання й суму цін ще не отриманих"
    en: "`summarizeItems` counts the wishes and adds up the prices of those not acquired yet"
  "summarizeItems of an empty list is all zeros":
    uk: "`summarizeItems` для порожнього списку дає нулі"
    en: "`summarizeItems` gives zeros for an empty list"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки; інакше не проходять і перевірки сторінки. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль». Якщо там `ReferenceError` про `withNewItem` чи `changed`, то код сторінки ще звертається до змінних, яких уже немає."
      en: "This check expects the script to run to the end without an error; otherwise the page checks fail too. The “Console” tab shows the error name and the line of code where it happened. If it shows a `ReferenceError` about `withNewItem` or `changed`, the page code still uses variables that are gone."
  - when: { test: "the page shows the summary of the list" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого по порядку йдуть «%%summaryCount%%», `6`, «%%summaryWantedTotal%%», `365`, «%%summaryNoPrice%%» і `1` — підсумок для шести бажань з `items`. Якщо числа інші, порівняй їх із тим, що повертає `summarizeItems(items)`."
      en: "This check looks inside `<main>` for an element whose text has “%%summaryCount%%”, `6`, “%%summaryWantedTotal%%”, `365`, “%%summaryNoPrice%%” and `1` in this order — the summary of the six wishes of `items`. If the numbers differ, compare them with what `summarizeItems(items)` returns."
  - when: { test: "the page shows the wanted wishes cheapest first" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого ще не отримані бажання йдуть від найдешевшого — «%%fixture2Name%%», «%%fixture1Name%%», «%%fixture3Name%%», «%%fixture5Name%%» — і немає отриманих «%%fixture4Name%%» та «%%fixture6Name%%»."
      en: "This check looks inside `<main>` for an element whose text has the wishes not acquired yet cheapest first — “%%fixture2Name%%”, “%%fixture1Name%%”, “%%fixture3Name%%”, “%%fixture5Name%%” — and no acquired “%%fixture4Name%%” or “%%fixture6Name%%”."
  - when: { test: "the page shows the search result" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент із результатом пошуку за «%%searchQuery%%»: у ньому є «%%fixture2Name%%» і немає жодного іншого бажання з `items`."
      en: "This check looks inside `<main>` for an element with the search result for “%%searchQuery%%”: it has “%%fixture2Name%%” and no other wish of `items`."
  - when: { test: "searchItems finds wishes by a part of the name, ignoring case" }
    message:
      uk: "Ця перевірка викликає `searchItems` зі своїм списком і чекає для запитів `\"LaMp\"` і `\"  lamp \"` бажання «Desk lamp» і «Lamp oil» — ті самі об’єкти, у тому самому порядку. Якщо знаходиться менше, то тексти порівнюються з різними великими й малими літерами або з пробілами на краях запиту."
      en: "This check calls `searchItems` with its own list and expects the wishes “Desk lamp” and “Lamp oil” — the same objects, in the same order — for the queries `\"LaMp\"` and `\"  lamp \"`. If fewer are found, the texts are compared with different upper and lower case or with the spaces at the edges of the query."
  - when: { test: "searchItems with an empty query keeps every wish and finds nothing for unknown text" }
    message:
      uk: "Ця перевірка чекає всі бажання для порожнього запиту й запиту із самих пробілів, а для тексту, якого немає в жодній назві, і для порожнього списку — порожній масив."
      en: "This check expects every wish for an empty query and for a query of only spaces, and an empty array for text that is in no name and for an empty list."
  - when: { test: "filterItems keeps the wanted or the acquired wishes" }
    message:
      uk: "Ця перевірка чекає для `\"wanted\"` лише бажання з `acquired: false`, для `\"acquired\"` — лише з `acquired: true`, у тому самому порядку, а для порожнього списку — порожній масив."
      en: "This check expects only the wishes with `acquired: false` for `\"wanted\"` and only those with `acquired: true` for `\"acquired\"`, in the same order, and an empty array for an empty list."
  - when: { test: "sortItemsByPrice orders a copy cheapest first with priceless wishes last" }
    message:
      uk: "Ця перевірка чекає новий масив у порядку цін `0`, `12`, `45`, `45`, а потім два бажання без ціни; два бажання із ціною `45`, як і два без ціни, лишаються в порядку списку. Отриманий список свого порядку не змінює — якщо змінився й він, сортування відбулося в ньому самому, а не в копії. Якщо бажання без ціни опинилися не в кінці, компаратор порівнює `null` як число."
      en: "This check expects a new array in the price order `0`, `12`, `45`, `45`, followed by the two wishes without a price; the two wishes priced `45`, like the two without a price, keep the list's order. The received list keeps its own order — if it changed too, the sorting happened in it instead of in a copy. If the wishes without a price are not last, the comparator compares `null` as a number."
  - when: { test: "summarizeItems counts the wishes and sums the wanted prices" }
    message:
      uk: "Ця перевірка чекає для шести бажань проєкту `{ count: 6, wantedTotal: 365, wantedWithoutPrice: 1 }`, а для свого списку із ціною `0` і бажаннями без ціни — `{ count: 6, wantedTotal: 45, wantedWithoutPrice: 1 }`: ціна `0` — справжня ціна, а отримані бажання в суму й у лічильник без ціни не входять."
      en: "This check expects `{ count: 6, wantedTotal: 365, wantedWithoutPrice: 1 }` for the project's six wishes, and `{ count: 6, wantedTotal: 45, wantedWithoutPrice: 1 }` for its own list with a price of `0` and wishes without a price: a price of `0` is a real price, and acquired wishes count neither in the total nor among those without a price."
  - when: { test: "summarizeItems of an empty list is all zeros" }
    message:
      uk: "Ця перевірка чекає для порожнього списку `{ count: 0, wantedTotal: 0, wantedWithoutPrice: 0 }`. Якщо бачиш `TypeError` про `reduce`, то `reduce` викликано для порожнього масиву без початкового значення."
      en: "This check expects `{ count: 0, wantedTotal: 0, wantedWithoutPrice: 0 }` for an empty list. If you see a `TypeError` about `reduce`, `reduce` was called on an empty array without an initial value."
