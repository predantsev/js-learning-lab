# Wishlist variant of step JS-05. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  summaryCount: { uk: "Бажань", en: "Wishes" }
  summaryWantedTotal: { uk: "Ще хочу на суму", en: "Still wanted, total" }
  summaryNoPrice: { uk: "Без ціни", en: "Without a price" }
  searchQuery: { uk: "лампа", en: "lamp" }
instructions:
  uk: |
    Тепер проєкт відповідатиме на запитання про список. Напиши на верхньому рівні `app.js` чотири чисті функції. Параметр `list` — будь-який список бажань; жодна функція не змінює ні його, ні бажання в ньому.

    1. **`searchItems(list, query)`** повертає бажання, у назві яких є текст `query`, — без огляду на великі й малі літери та на пробіли на краях запиту. Порожній запит (чи запит із самих пробілів) залишає всі бажання; якщо нічого не знайдено — порожній масив.
    2. **`filterItems(list, status)`** повертає бажання зі станом `status`: `"wanted"` — ще не отримані (`acquired: false`), `"acquired"` — отримані.
    3. **`sortItemsByPrice(list)`** повертає **новий** масив, упорядкований за ціною від меншої до більшої; бажання без ціни (`null`) — у кінці. Бажання з однаковою ціною, як і бажання без ціни між собою, зберігають свій порядок. Отриманий список свого порядку не змінює.
    4. **`summarizeItems(list)`** повертає підсумок `{ count, wantedTotal, wantedWithoutPrice }`: `count` — скільки всього бажань; `wantedTotal` — сума цін ще не отриманих бажань, у яких ціна є; `wantedWithoutPrice` — скільки ще не отриманих бажань без ціни. Для порожнього списку всі три — `0`. Ціна `0` — справжня ціна.

    **Сторінка.** У `index.html` заміни абзаци `list-before` і `list-after` трьома порожніми абзацами з `id` `summary`, `wanted` і `search`; абзаци повідомлень чернетки залиш. Три зміни списку з попереднього кроку наприкінці `app.js` можна прибрати, а функції `addItem`, `updateItem` і `removeItem` — залиш. Наприкінці `app.js` запиши в абзаци:

    - `summary` — підсумок для `items` у такому вигляді: «%%summaryCount%%: 6 · %%summaryWantedTotal%%: 365 · %%summaryNoPrice%%: 1» (числа — з `summarizeItems`, роздільники — на твій смак);
    - `wanted` — підписи ще не отриманих бажань від найдешевшого, через `; `, як на попередньому кроці;
    - `search` — підписи бажань, знайдених за запитом «%%searchQuery%%».

    **Як перевірятиметься:** на сторінці є підсумок із цими трьома числами по порядку; ще не отримані бажання від найдешевшого — «%%fixture2Name%%», «%%fixture1Name%%», «%%fixture3Name%%», «%%fixture5Name%%» — без отриманих; і результат пошуку, у якому лише «%%fixture2Name%%». Ще платформа викликає твої функції зі своїм списком — із ціною `0`, однаковими цінами, бажаннями без ціни, порожнім списком — і перевіряє результати, порядок рівних бажань і те, що отриманий список не змінився.

    Перш ніж перевіряти, виведи через `console.log` результат `sortItemsByPrice(items)`, а потім сам `items`, і подивись на вкладку «Консоль»: порядок `items` має лишитися тим самим.
  en: |
    Now the project answers questions about the list. Write four pure functions at the top level of `app.js`. The parameter `list` is any list of wishes; no function changes it or the wishes in it.

    1. **`searchItems(list, query)`** returns the wishes whose name contains the text `query` — regardless of upper and lower case and of spaces at the edges of the query. An empty query (or one of only spaces) keeps every wish; when nothing is found, it returns an empty array.
    2. **`filterItems(list, status)`** returns the wishes in the state `status`: `"wanted"` — not acquired yet (`acquired: false`), `"acquired"` — acquired.
    3. **`sortItemsByPrice(list)`** returns a **new** array ordered by price from lower to higher; wishes without a price (`null`) go last. Wishes with the same price, like the wishes without a price among themselves, keep their order. The received list keeps its own order.
    4. **`summarizeItems(list)`** returns the summary `{ count, wantedTotal, wantedWithoutPrice }`: `count` — how many wishes there are; `wantedTotal` — the total price of the wishes not acquired yet that have a price; `wantedWithoutPrice` — how many wishes not acquired yet have no price. For an empty list all three are `0`. A price of `0` is a real price.

    **The page.** In `index.html`, replace the paragraphs `list-before` and `list-after` with three empty paragraphs with the `id`s `summary`, `wanted` and `search`; keep the draft message paragraphs. You can remove the three list changes of the previous step at the end of `app.js`, but keep the functions `addItem`, `updateItem` and `removeItem`. At the end of `app.js`, write into the paragraphs:

    - `summary` — the summary of `items` in this form: “%%summaryCount%%: 6 · %%summaryWantedTotal%%: 365 · %%summaryNoPrice%%: 1” (the numbers come from `summarizeItems`, the separators are up to you);
    - `wanted` — the labels of the wishes not acquired yet, cheapest first, separated by `; ` as in the previous step;
    - `search` — the labels of the wishes found for the query “%%searchQuery%%”.

    **How it is checked:** the page has the summary with these three numbers in order; the wishes not acquired yet, cheapest first — “%%fixture2Name%%”, “%%fixture1Name%%”, “%%fixture3Name%%”, “%%fixture5Name%%” — without the acquired ones; and the search result holding only “%%fixture2Name%%”. The platform also calls your functions with its own list — with a price of `0`, equal prices, wishes without a price, an empty list — and checks the results, the order of equal wishes and that the received list did not change.

    Before checking, print with `console.log` the result of `sortItemsByPrice(items)` and then `items` itself, and look at the “Console” tab: the order of `items` must stay the same.
nudge:
  uk: "Пошук і фільтр — це `filter` з умовою. Текст шукає `includes`, а великі й малі літери вирівнює `toLowerCase` з обох боків: `\"Hello World\".toLowerCase().includes(\"world\")` дає `true`. Для сортування згадай компаратор, який ставить `null` у кінець, і `toSorted`, що не чіпає старий масив. Підсумок легко читати як ланцюжок кроків: наприклад, `orders.filter((order) => order.paid).reduce((sum, order) => sum + order.total, 0)` рахує суму оплачених замовлень."
  en: "Search and filter are a `filter` with a condition. `includes` looks for text, and `toLowerCase` on both sides evens out upper and lower case: `\"Hello World\".toLowerCase().includes(\"world\")` gives `true`. For sorting, recall the comparator that puts `null` last, and `toSorted`, which leaves the old array alone. A summary reads well as a chain of steps: for example, `orders.filter((order) => order.paid).reduce((sum, order) => sum + order.total, 0)` adds up the paid orders."
