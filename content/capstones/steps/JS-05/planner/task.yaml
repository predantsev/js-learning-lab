# Planner variant of step JS-05. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  dueSummary: { uk: "Треба зробити станом на", en: "Due as of" }
  searchQuery: { uk: "книжки", en: "books" }
instructions:
  uk: |
    Тепер проєкт відповідатиме на запитання про список. Напиши на верхньому рівні `app.js` чотири чисті функції. Параметр `list` — будь-який список справ; жодна функція не змінює ні його, ні справи в ньому.

    1. **`searchTasks(list, query)`** повертає справи, у назві яких є текст `query`, — без огляду на великі й малі літери та на пробіли на краях запиту. Порожній запит (чи запит із самих пробілів) залишає всі справи; якщо нічого не знайдено — порожній масив.
    2. **`filterTasks(list, status)`** повертає справи зі станом `status`: `"pending"` — ще не виконані (`done: false`), `"done"` — виконані.
    3. **`sortTasks(list)`** повертає **новий** масив, упорядкований за терміном від ранішого до пізнішого; справи без терміну (`null`) — у кінці. Справи з однаковим терміном (і справи без терміну між собою) упорядковані за пріоритетом: спершу `"high"`, потім `"normal"`, потім `"low"`. Справи з однаковим терміном і пріоритетом зберігають свій порядок. Отриманий список свого порядку не змінює.
    4. **`countDueTasks(list, day)`** повертає, скільки ще не виконаних справ мають термін `day` або раніший. Справа без терміну ніколи не потрапляє в цей лік. Дати записані текстом `"РРРР-ММ-ДД"`, тож їх можна порівнювати як текст.

    **Сторінка.** У `index.html` заміни абзаци `list-before` і `list-after` трьома порожніми абзацами з `id` `summary`, `pending` і `search`; абзаци повідомлень чернетки залиш. Три зміни списку з попереднього кроку наприкінці `app.js` можна прибрати, а функції `addTask`, `updateTask` і `removeTask` — залиш. Наприкінці `app.js` запиши в абзаци:

    - `summary` — скільки справ із `tasks` треба зробити станом на день `"2026-03-02"`, у такому вигляді: «%%dueSummary%% 2026-03-02: 2» (число — з `countDueTasks`);
    - `pending` — підписи ще не виконаних справ у порядку `sortTasks`, через `; `, як на попередньому кроці;
    - `search` — підписи справ, знайдених за запитом «%%searchQuery%%».

    **Як перевірятиметься:** на сторінці є «%%dueSummary%%», дата `2026-03-02` і після неї число `2`; ще не виконані справи по порядку — «%%fixture2Name%%», «%%fixture1Name%%», «%%fixture5Name%%», «%%fixture3Name%%» — без виконаних; і результат пошуку, у якому лише «%%fixture2Name%%». Ще платформа викликає твої функції зі своїм списком — з однаковими термінами й пріоритетами, справами без терміну, днем, що збігається з терміном, порожнім списком — і перевіряє результати, порядок рівних справ і те, що отриманий список не змінився.

    Перш ніж перевіряти, виведи через `console.log` результат `sortTasks(tasks)`, а потім сам `tasks`, і подивись на вкладку «Консоль»: порядок `tasks` має лишитися тим самим.
  en: |
    Now the project answers questions about the list. Write four pure functions at the top level of `app.js`. The parameter `list` is any list of tasks; no function changes it or the tasks in it.

    1. **`searchTasks(list, query)`** returns the tasks whose title contains the text `query` — regardless of upper and lower case and of spaces at the edges of the query. An empty query (or one of only spaces) keeps every task; when nothing is found, it returns an empty array.
    2. **`filterTasks(list, status)`** returns the tasks in the state `status`: `"pending"` — not done yet (`done: false`), `"done"` — done.
    3. **`sortTasks(list)`** returns a **new** array ordered by due date from earlier to later; tasks without a due date (`null`) go last. Tasks with the same due date (and the tasks without a due date among themselves) are ordered by priority: `"high"` first, then `"normal"`, then `"low"`. Tasks with the same due date and priority keep their order. The received list keeps its own order.
    4. **`countDueTasks(list, day)`** returns how many tasks not done yet are due on `day` or earlier. A task without a due date never counts. Dates are written as `"YYYY-MM-DD"` text, so they can be compared as text.

    **The page.** In `index.html`, replace the paragraphs `list-before` and `list-after` with three empty paragraphs with the `id`s `summary`, `pending` and `search`; keep the draft message paragraphs. You can remove the three list changes of the previous step at the end of `app.js`, but keep the functions `addTask`, `updateTask` and `removeTask`. At the end of `app.js`, write into the paragraphs:

    - `summary` — how many tasks of `tasks` are due as of the day `"2026-03-02"`, in this form: “%%dueSummary%% 2026-03-02: 2” (the number comes from `countDueTasks`);
    - `pending` — the labels of the tasks not done yet in the order of `sortTasks`, separated by `; ` as in the previous step;
    - `search` — the labels of the tasks found for the query “%%searchQuery%%”.

    **How it is checked:** the page has “%%dueSummary%%”, the date `2026-03-02` and the number `2` after it; the tasks not done yet in order — “%%fixture2Name%%”, “%%fixture1Name%%”, “%%fixture5Name%%”, “%%fixture3Name%%” — without the done ones; and the search result holding only “%%fixture2Name%%”. The platform also calls your functions with its own list — with equal due dates and priorities, tasks without a due date, a day equal to a due date, an empty list — and checks the results, the order of equal tasks and that the received list did not change.

    Before checking, print with `console.log` the result of `sortTasks(tasks)` and then `tasks` itself, and look at the “Console” tab: the order of `tasks` must stay the same.
nudge:
  uk: "Пошук і фільтр — це `filter` з умовою. Текст шукає `includes`, а великі й малі літери вирівнює `toLowerCase` з обох боків: `\"Hello World\".toLowerCase().includes(\"world\")` дає `true`. Компаратор із двома правилами спершу порівнює головне поле й лише за рівності переходить до другого — так, як словник упорядковує слова спершу за першою літерою, а потім за другою. Рахувати зручно ланцюжком: `orders.filter((order) => order.paid).length` — кількість оплачених замовлень."
  en: "Search and filter are a `filter` with a condition. `includes` looks for text, and `toLowerCase` on both sides evens out upper and lower case: `\"Hello World\".toLowerCase().includes(\"world\")` gives `true`. A comparator with two rules compares the main field first and moves on to the second one only when they are equal — the way a dictionary orders words by the first letter, then by the second. Counting reads well as a chain: `orders.filter((order) => order.paid).length` is the number of paid orders."
testTitles:
  "the script runs without errors":
    uk: "Код у `app.js` працює без помилок"
    en: "The script runs without errors"
  "the page shows how many tasks are due":
    uk: "Сторінка показує, скільки справ треба зробити станом на `2026-03-02`: `2`"
    en: "The page shows how many tasks are due as of `2026-03-02`: `2`"
  "the page shows the pending tasks in order":
    uk: "Сторінка показує ще не виконані справи за терміном і пріоритетом"
    en: "The page shows the tasks not done yet by due date and priority"
  "the page shows the search result":
    uk: "Сторінка показує результат пошуку за «%%searchQuery%%»"
    en: "The page shows the search result for “%%searchQuery%%”"
  "searchTasks finds tasks by a part of the title, ignoring case":
    uk: "`searchTasks` знаходить справи за частиною назви без огляду на великі й малі літери"
    en: "`searchTasks` finds tasks by a part of the title regardless of case"
  "searchTasks with an empty query keeps every task and finds nothing for unknown text":
    uk: "`searchTasks` з порожнім запитом лишає всі справи, а для чужого тексту дає порожній масив"
    en: "`searchTasks` keeps every task for an empty query and gives an empty array for unknown text"
  "filterTasks keeps the pending or the done tasks":
    uk: "`filterTasks` відбирає ще не виконані або виконані справи"
    en: "`filterTasks` picks the tasks not done yet or the done ones"
  "sortTasks orders a copy by due date and then by priority":
    uk: "`sortTasks` упорядковує копію за терміном, а за однакового терміну — за пріоритетом"
    en: "`sortTasks` orders a copy by due date, and by priority for equal due dates"
  "countDueTasks counts the pending tasks due on or before the day":
    uk: "`countDueTasks` рахує не виконані справи з терміном цього дня або раніше"
    en: "`countDueTasks` counts the tasks not done yet that are due on the day or earlier"
  "countDueTasks of an empty list is zero":
    uk: "`countDueTasks` для порожнього списку дає `0`"
    en: "`countDueTasks` gives `0` for an empty list"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки; інакше не проходять і перевірки сторінки. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль». Якщо там `ReferenceError` про `withNewTask` чи `changed`, то код сторінки ще звертається до змінних, яких уже немає."
      en: "This check expects the script to run to the end without an error; otherwise the page checks fail too. The “Console” tab shows the error name and the line of code where it happened. If it shows a `ReferenceError` about `withNewTask` or `changed`, the page code still uses variables that are gone."
  - when: { test: "the page shows how many tasks are due" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого по порядку йдуть «%%dueSummary%%», `2026-03-02` і число `2` — скільки справ із `tasks` треба зробити станом на цей день. Якщо число інше, порівняй його з тим, що повертає `countDueTasks(tasks, \"2026-03-02\")`."
      en: "This check looks inside `<main>` for an element whose text has “%%dueSummary%%”, `2026-03-02` and the number `2` in this order — how many tasks of `tasks` are due as of that day. If the number differs, compare it with what `countDueTasks(tasks, \"2026-03-02\")` returns."
  - when: { test: "the page shows the pending tasks in order" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого ще не виконані справи йдуть за терміном і пріоритетом — «%%fixture2Name%%», «%%fixture1Name%%», «%%fixture5Name%%», «%%fixture3Name%%» — і немає виконаних «%%fixture4Name%%» та «%%fixture6Name%%»."
      en: "This check looks inside `<main>` for an element whose text has the tasks not done yet by due date and priority — “%%fixture2Name%%”, “%%fixture1Name%%”, “%%fixture5Name%%”, “%%fixture3Name%%” — and no done “%%fixture4Name%%” or “%%fixture6Name%%”."
  - when: { test: "the page shows the search result" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент із результатом пошуку за «%%searchQuery%%»: у ньому є «%%fixture2Name%%» і немає жодної іншої справи з `tasks`."
      en: "This check looks inside `<main>` for an element with the search result for “%%searchQuery%%”: it has “%%fixture2Name%%” and no other task of `tasks`."
  - when: { test: "searchTasks finds tasks by a part of the title, ignoring case" }
    message:
      uk: "Ця перевірка викликає `searchTasks` зі своїм списком і чекає для запитів `\"BrEaD\"` і `\"  bread \"` справи «Buy bread» і «Bake Bread» — ті самі об’єкти, у тому самому порядку. Якщо знаходиться менше, то тексти порівнюються з різними великими й малими літерами або з пробілами на краях запиту."
      en: "This check calls `searchTasks` with its own list and expects the tasks “Buy bread” and “Bake Bread” — the same objects, in the same order — for the queries `\"BrEaD\"` and `\"  bread \"`. If fewer are found, the texts are compared with different upper and lower case or with the spaces at the edges of the query."
  - when: { test: "searchTasks with an empty query keeps every task and finds nothing for unknown text" }
    message:
      uk: "Ця перевірка чекає всі справи для порожнього запиту й запиту із самих пробілів, а для тексту, якого немає в жодній назві, і для порожнього списку — порожній масив."
      en: "This check expects every task for an empty query and for a query of only spaces, and an empty array for text that is in no title and for an empty list."
  - when: { test: "filterTasks keeps the pending or the done tasks" }
    message:
      uk: "Ця перевірка чекає для `\"pending\"` лише справи з `done: false`, для `\"done\"` — лише з `done: true`, у тому самому порядку, а для порожнього списку — порожній масив."
      en: "This check expects only the tasks with `done: false` for `\"pending\"` and only those with `done: true` for `\"done\"`, in the same order, and an empty array for an empty list."
  - when: { test: "sortTasks orders a copy by due date and then by priority" }
    message:
      uk: "Ця перевірка чекає новий масив: спершу термін `2026-03-01`, потім три справи з терміном `2026-03-05` — `\"high\"` перед двома `\"normal\"`, які лишаються в порядку списку, — і в кінці дві справи без терміну, `\"high\"` перед `\"low\"`. Отриманий список свого порядку не змінює — якщо змінився й він, сортування відбулося в ньому самому, а не в копії."
      en: "This check expects a new array: first the due date `2026-03-01`, then the three tasks due `2026-03-05` — `\"high\"` before the two `\"normal\"` ones, which keep the list's order — and the two tasks without a due date at the end, `\"high\"` before `\"low\"`. The received list keeps its own order — if it changed too, the sorting happened in it instead of in a copy."
  - when: { test: "countDueTasks counts the pending tasks due on or before the day" }
    message:
      uk: "Ця перевірка чекає для шести справ проєкту `2` на день `2026-03-02` і `3` на `2026-03-10`, а для свого списку — `3` на `2026-03-05` (справа з терміном саме цього дня теж рахується) і `0` на `2026-03-04`: виконані справи й справи без терміну не рахуються."
      en: "This check expects `2` for the project's six tasks on `2026-03-02` and `3` on `2026-03-10`, and for its own list `3` on `2026-03-05` (a task due on that very day counts too) and `0` on `2026-03-04`: done tasks and tasks without a due date do not count."
  - when: { test: "countDueTasks of an empty list is zero" }
    message:
      uk: "Ця перевірка чекає `0` для порожнього списку. Якщо бачиш `TypeError` про `reduce`, то `reduce` викликано для порожнього масиву без початкового значення."
      en: "This check expects `0` for an empty list. If you see a `TypeError` about `reduce`, `reduce` was called on an empty array without an initial value."
