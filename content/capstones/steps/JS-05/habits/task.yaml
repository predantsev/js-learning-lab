    en: "The script runs without errors"
  "the page shows the active habits sorted by name":
    uk: "Сторінка показує активні звички за абеткою, без звички на паузі"
    en: "The page shows the active habits alphabetically, without the paused one"
  "the page shows the completion rates":
    uk: "Сторінка показує частку виконаних днів: «%%fixture1Name%%» — `75`, «%%fixture3Name%%» — `25`"
    en: "The page shows the share of completed days: “%%fixture1Name%%” `75`, “%%fixture3Name%%” `25`"
  "the page shows the search result":
    uk: "Сторінка показує результат пошуку за «%%searchQuery%%»"
    en: "The page shows the search result for “%%searchQuery%%”"
