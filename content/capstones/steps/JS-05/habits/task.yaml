# Habit tracker variant of step JS-05. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  searchQuery: { uk: "вод", en: "water" }
instructions:
  uk: |
    Тепер проєкт відповідатиме на запитання про список. Напиши на верхньому рівні `app.js` чотири чисті функції. Параметр `list` — будь-який список звичок; жодна функція не змінює ні його, ні звички в ньому, ні їхні масиви дат.

    1. **`searchHabits(list, query)`** повертає звички, у назві яких є текст `query`, — без огляду на великі й малі літери та на пробіли на краях запиту. Порожній запит (чи запит із самих пробілів) залишає всі звички; якщо нічого не знайдено — порожній масив.
    2. **`filterHabits(list, status)`** повертає звички зі станом `status`: `"active"` — активні (`active: true`), `"paused"` — на паузі.
    3. **`sortHabitsByName(list)`** повертає **новий** масив, упорядкований за назвою за абеткою — так, як порівнює текст `localeCompare`, тож великі й малі літери не розводять назви. Звички з однаковою назвою зберігають свій порядок. Отриманий список свого порядку не змінює.
    4. **`summarizeHabit(habit, days)`** повертає підсумок `{ count, rate }` для однієї звички за масив днів `days`: `count` — у скількох із цих днів звичку виконано, `rate` — яка це частка днів (від `0` до `1`). Якщо днів немає, обидва — `0`, а не `NaN`.

    **Сторінка.** У `index.html` заміни абзаци `list-before` і `list-after` двома порожніми абзацами з `id` `summary` і `search`; абзаци повідомлень чернетки залиш. Чотири зміни списку з попереднього кроку наприкінці `app.js` можна прибрати, а функції `addHabit`, `updateHabit`, `removeHabit` і `completeHabit` — залиш. Наприкінці `app.js` запиши в абзаци:

    - `summary` — активні звички з `habits` за назвою, кожну із часткою виконаних днів у відсотках за дні `["2026-02-26", "2026-02-27", "2026-02-28", "2026-03-01"]`, через `; `: наприклад, «%%fixture1Name%% — 75%»;
    - `search` — підписи звичок, знайдених за запитом «%%searchQuery%%».

    **Як перевірятиметься:** на сторінці є активні звички за абеткою — без звички на паузі «%%fixture5Name%%», — де «%%fixture1Name%%» має `75`, а «%%fixture3Name%%» — `25`; і результат пошуку, у якому лише «%%fixture3Name%%». Ще платформа викликає твої функції зі своїм списком — з назвами з різними великими й малими літерами, однаковими назвами, звичками без дат, порожнім масивом днів — і перевіряє результати, порядок рівних звичок і те, що отримані дані не змінилися.

    Перш ніж перевіряти, виведи через `console.log` результат `sortHabitsByName(habits)`, а потім сам `habits`, і подивись на вкладку «Консоль»: порядок `habits` має лишитися тим самим.
  en: |
    Now the project answers questions about the list. Write four pure functions at the top level of `app.js`. The parameter `list` is any list of habits; no function changes it, the habits in it or their arrays of dates.

    1. **`searchHabits(list, query)`** returns the habits whose name contains the text `query` — regardless of upper and lower case and of spaces at the edges of the query. An empty query (or one of only spaces) keeps every habit; when nothing is found, it returns an empty array.
    2. **`filterHabits(list, status)`** returns the habits in the state `status`: `"active"` — active (`active: true`), `"paused"` — paused.
    3. **`sortHabitsByName(list)`** returns a **new** array ordered by name alphabetically — the way `localeCompare` compares text, so upper and lower case do not separate the names. Habits with the same name keep their order. The received list keeps its own order.
    4. **`summarizeHabit(habit, days)`** returns the summary `{ count, rate }` of one habit over the array of days `days`: `count` — on how many of these days the habit was completed, `rate` — which share of the days that is (from `0` to `1`). When there are no days, both are `0`, not `NaN`.

    **The page.** In `index.html`, replace the paragraphs `list-before` and `list-after` with two empty paragraphs with the `id`s `summary` and `search`; keep the draft message paragraphs. You can remove the four list changes of the previous step at the end of `app.js`, but keep the functions `addHabit`, `updateHabit`, `removeHabit` and `completeHabit`. At the end of `app.js`, write into the paragraphs:

    - `summary` — the active habits of `habits` by name, each with its share of completed days in percent over the days `["2026-02-26", "2026-02-27", "2026-02-28", "2026-03-01"]`, separated by `; `: for example, “%%fixture1Name%% — 75%”;
    - `search` — the labels of the habits found for the query “%%searchQuery%%”.

    **How it is checked:** the page has the active habits alphabetically — without the paused habit “%%fixture5Name%%” — where “%%fixture1Name%%” has `75` and “%%fixture3Name%%” has `25`; and the search result holding only “%%fixture3Name%%”. The platform also calls your functions with its own list — with names in different upper and lower case, equal names, habits without dates, an empty array of days — and checks the results, the order of equal habits and that the received data did not change.

    Before checking, print with `console.log` the result of `sortHabitsByName(habits)` and then `habits` itself, and look at the “Console” tab: the order of `habits` must stay the same.
nudge:
  uk: "Пошук і фільтр — це `filter` з умовою. Текст шукає `includes`, а великі й малі літери вирівнює `toLowerCase` з обох боків: `\"Hello World\".toLowerCase().includes(\"world\")` дає `true`. Компаратор для тексту — `localeCompare`, а сортують копію через `toSorted`. Частка — це «скільки з усіх»: якщо з 8 питань тесту правильних 6, частка — `6 / 8`; а коли питань немає зовсім, ділити на нуль не можна."
  en: "Search and filter are a `filter` with a condition. `includes` looks for text, and `toLowerCase` on both sides evens out upper and lower case: `\"Hello World\".toLowerCase().includes(\"world\")` gives `true`. The comparator for text is `localeCompare`, and a copy is sorted with `toSorted`. A share is “how many out of all”: when 6 of 8 quiz answers are right, the share is `6 / 8`; and when there are no answers at all, you cannot divide by zero."
