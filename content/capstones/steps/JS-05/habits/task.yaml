    uk: "`searchHabits` знаходить звички за частиною назви без огляду на великі й малі літери"
    en: "`searchHabits` finds habits by a part of the name regardless of case"
  "searchHabits with an empty query keeps every habit and finds nothing for unknown text":
    uk: "`searchHabits` з порожнім запитом лишає всі звички, а для чужого тексту дає порожній масив"
    en: "`searchHabits` keeps every habit for an empty query and gives an empty array for unknown text"
  "filterHabits keeps the active or the paused habits":
    uk: "`filterHabits` відбирає активні звички або звички на паузі"
    en: "`filterHabits` picks the active or the paused habits"
  "sortHabitsByName orders a copy alphabetically":
    uk: "`sortHabitsByName` упорядковує копію за абеткою"
    en: "`sortHabitsByName` orders a copy alphabetically"
  "summarizeHabit counts the completed days and the rate":
    uk: "`summarizeHabit` рахує виконані дні й їхню частку"
    en: "`summarizeHabit` counts the completed days and their share"
  "summarizeHabit with no days gives zeros, not NaN":
    uk: "`summarizeHabit` без днів дає нулі, а не `NaN`"
    en: "`summarizeHabit` gives zeros, not `NaN`, when there are no days"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки; інакше не проходять і перевірки сторінки. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль». Якщо там `ReferenceError` про `withNewHabit` чи `changed`, то код сторінки ще звертається до змінних, яких уже немає."
      en: "This check expects the script to run to the end without an error; otherwise the page checks fail too. The “Console” tab shows the error name and the line of code where it happened. If it shows a `ReferenceError` about `withNewHabit` or `changed`, the page code still uses variables that are gone."
  - when: { test: "the page shows the active habits sorted by name" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого всі активні звички з `habits` ідуть за абеткою, а звички на паузі «%%fixture5Name%%» немає."
      en: "This check looks inside `<main>` for an element whose text has all active habits of `habits` in alphabetical order and no paused habit “%%fixture5Name%%”."
  - when: { test: "the page shows the completion rates" }
    message:
      uk: "Ця перевірка шукає в тому самому елементі після «%%fixture1Name%%» число `75`, а після «%%fixture3Name%%» — `25`: частку виконаних днів із чотирьох у відсотках. Якщо там `0.75`, частку ще не переведено у відсотки — це теж зараховується; якщо інше число, порівняй його з тим, що повертає `summarizeHabit`."
      en: "This check looks in that same element for the number `75` after “%%fixture1Name%%” and `25` after “%%fixture3Name%%”: the share of the four days completed, in percent. If it shows `0.75`, the share is not in percent yet — that is accepted too; if it is another number, compare it with what `summarizeHabit` returns."
  - when: { test: "the page shows the search result" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент із результатом пошуку за «%%searchQuery%%»: у ньому є «%%fixture3Name%%» і немає жодної іншої звички з `habits`."
      en: "This check looks inside `<main>` for an element with the search result for “%%searchQuery%%”: it has “%%fixture3Name%%” and no other habit of `habits`."
  - when: { test: "searchHabits finds habits by a part of the name, ignoring case" }
    message:
      uk: "Ця перевірка викликає `searchHabits` зі своїм списком і чекає для запитів `\"YoGa\"` і `\"  yoga \"` звички «yoga» і «Morning Yoga» — ті самі об’єкти, у тому самому порядку. Якщо знаходиться менше, то тексти порівнюються з різними великими й малими літерами або з пробілами на краях запиту."
      en: "This check calls `searchHabits` with its own list and expects the habits “yoga” and “Morning Yoga” — the same objects, in the same order — for the queries `\"YoGa\"` and `\"  yoga \"`. If fewer are found, the texts are compared with different upper and lower case or with the spaces at the edges of the query."
  - when: { test: "searchHabits with an empty query keeps every habit and finds nothing for unknown text" }
    message:
      uk: "Ця перевірка чекає всі звички для порожнього запиту й запиту із самих пробілів, а для тексту, якого немає в жодній назві, і для порожнього списку — порожній масив."
      en: "This check expects every habit for an empty query and for a query of only spaces, and an empty array for text that is in no name and for an empty list."
  - when: { test: "filterHabits keeps the active or the paused habits" }
    message:
      uk: "Ця перевірка чекає для `\"active\"` лише звички з `active: true`, для `\"paused\"` — лише з `active: false`, у тому самому порядку, а для порожнього списку — порожній масив."
      en: "This check expects only the habits with `active: true` for `\"active\"` and only those with `active: false` for `\"paused\"`, in the same order, and an empty array for an empty list."
  - when: { test: "sortHabitsByName orders a copy alphabetically" }
    message:
      uk: "Ця перевірка чекає для назв «yoga», «Stretching», «Morning Yoga», «meditation», «Stretching» новий масив у порядку «meditation», «Morning Yoga», «Stretching», «Stretching», «yoga»: за абеткою, як порівнює `localeCompare`, а не за кодами літер, де всі великі стоять перед малими. Дві звички «Stretching» лишаються в порядку списку, а отриманий список свого порядку не змінює."
      en: "This check expects a new array for the names “yoga”, “Stretching”, “Morning Yoga”, “meditation”, “Stretching” in the order “meditation”, “Morning Yoga”, “Stretching”, “Stretching”, “yoga”: alphabetical, the way `localeCompare` compares, not by character codes, where every capital letter comes before every small one. The two “Stretching” habits keep the list's order, and the received list keeps its own order."
  - when: { test: "summarizeHabit counts the completed days and the rate" }
    message:
      uk: "Ця перевірка чекає для звички з датами `2026-03-01`, `2026-03-02`, `2026-03-03` за дні з `2026-03-01` по `2026-03-04` підсумок `{ count: 3, rate: 0.75 }`, а для звички, виконаної лише поза цими днями, — `{ count: 0, rate: 0 }`. Дати звички поза переданими днями не рахуються."
      en: "This check expects the summary `{ count: 3, rate: 0.75 }` for a habit with the dates `2026-03-01`, `2026-03-02`, `2026-03-03` over the days from `2026-03-01` to `2026-03-04`, and `{ count: 0, rate: 0 }` for a habit completed only outside these days. A habit's dates outside the given days do not count."
  - when: { test: "summarizeHabit with no days gives zeros, not NaN" }
    message:
      uk: "Ця перевірка чекає `{ count: 0, rate: 0 }` для порожнього масиву днів. Якщо `rate` — `NaN`, то частку обчислено діленням нуля на нуль."
      en: "This check expects `{ count: 0, rate: 0 }` for an empty array of days. If `rate` is `NaN`, the share was computed by dividing zero by zero."
