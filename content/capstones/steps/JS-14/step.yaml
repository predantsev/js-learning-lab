# Capstone step of unit JS-14 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-14-11-capstone-typed-domain from this file.
# The step is checked in the platform and continues from the JS-13 reference. The reference's .ts
# files were checked with TypeScript 7.0.2 (`tsc -p .` with the step's tsconfig.json: no errors) and
# run with Node.js 25.2.1 (`node run-tests.js`) after localization.
unit: JS-14
mode: in-platform
entry: index.html
title:
  uk: "Типізований домен"
  en: "A typed domain"
intro:
  uk: |
    Правила проєкту — модуль домену й модуль сховища — переходять на [[typescript|TypeScript]]: файли `domain/….ts` і `storage/….ts` замість `.js`. Типи описують запис, чернетку й [[union-type|union]] результату перевірки, [[generic-function|generic]]-хелпер `indexById` працює для будь-яких записів з `id`, а збережені дані приходять як [[unknown-type|`unknown`]] і перевіряються поле за полем ([[runtime-validation|перевірка під час виконання]]).

    > [!warning]
    > Типи перевіряє лише [[tsc|`tsc`]]. Платформа, як і Node.js, перед запуском просто прибирає типи ([[type-erasure|стирання типів]]) і **не** повідомляє про помилки в них: файл із неправильним типом тут запуститься. Тому перевірки цього кроку дивляться лише на поведінку, а строгу перевірку типів ти робиш у експортованому проєкті командою `npx tsc --noEmit` — для неї в проєкті з’являється `tsconfig.json`.

    Імпорти тепер закінчуються на `.ts` (`../domain/….ts`): так модуль знаходять і Node.js, і `tsc` з налаштуванням `allowImportingTsExtensions`. Браузер сам TypeScript не виконує: у експортованому проєкті `.ts` для сторінки перетворює на JavaScript крок збирання, як-от esbuild із розділу JS-15, а `node run-tests.js` запускає `.ts` напряму в Node.js, де прибирання типів увімкнено (перевірено на Node.js 25).

    > [!note]
    > Якщо ти вже експортував проєкт (контрольна точка CP-JS), твої локальні файли — головні, і платформа їх не змінює. Тоді спершу зроби commit у своїй теці, завантаж еталон цього кроку з екрана проєкту й перенеси зміни вручну, звіряючи файли, як у уроках розділу JS-10.
  en: |
    The project's rules — the domain module and the storage module — move to [[typescript|TypeScript]]: the files `domain/….ts` and `storage/….ts` instead of `.js`. Types describe the record, the draft and the [[union-type|union]] of the check result, a [[generic-function|generic]] helper `indexById` works for any records with an `id`, and saved data arrives as [[unknown-type|`unknown`]] and is checked field by field ([[runtime-validation]]).

    > [!warning]
    > Only [[tsc|`tsc`]] checks types. The platform, like Node.js, simply removes the types before running ([[type-erasure]]) and does **not** report errors in them: a file with a wrong type runs here. So the checks of this step look at behaviour only, and you do the strict type check in the exported project with the command `npx tsc --noEmit` — the project gets a `tsconfig.json` for it.

    Imports now end with `.ts` (`../domain/….ts`): that is how both Node.js and `tsc` with the setting `allowImportingTsExtensions` find the module. A browser does not run TypeScript itself: in the exported project a build step, such as esbuild from unit JS-15, turns the `.ts` for the page into JavaScript, and `node run-tests.js` runs `.ts` directly in a Node.js that removes types (checked on Node.js 25).

    > [!note]
    > If you have already exported the project (checkpoint CP-JS), your local files are the main ones, and the platform does not change them. Then first make a commit in your folder, download this step's reference from the project screen and carry the changes over by hand, comparing the files, as in the lessons of unit JS-10.
purpose:
  uk: "Це крок твого проєкту: типи записів, union-результати, generic-хелпери, `unknown` і перевірку під час виконання з цього розділу ти застосовуєш до домену власного застосунку. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply this unit's record types, union results, generic helpers, `unknown` and runtime validation to the domain of your own app. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Описати типи запису, чернетки й union результату перевірки та перевести модулі домену й сховища на TypeScript з імпортами `.ts`."
    en: "Describe the types of the record, the draft and the union of the check result, and move the domain and storage modules to TypeScript with `.ts` imports."
  - uk: "Написати generic-хелпер, що зберігає тип записів, і перевіряти збережені дані, які приходять як `unknown`, поле за полем."
    en: "Write a generic helper that keeps the record type, and check saved data that arrives as `unknown` field by field."
  - uk: "Пояснити, що перевіряє `tsc` до запуску, а що — перевірка під час виконання, і запустити строгий `tsc` у експортованому проєкті."
    en: "Explain what `tsc` checks before running and what the runtime validation checks, and run a strict `tsc` in the exported project."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередні кроки не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
