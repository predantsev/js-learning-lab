# Expenses variant of step JS-14. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings: {}
instructions:
  uk: |
    Модулі `domain/expenses.js` і `storage/expenses.js` стають TypeScript-файлами `domain/expenses.ts` і `storage/expenses.ts`. Поведінка сторінки не змінюється; додається одне правило — збережені витрати з однаковим `id` вважаються пошкодженими.

    **1. Типи в `domain/expenses.ts`** (експортуй їх):

    - `CategoryId` — union `"food" | "transport" | "home" | "fun"`;
    - `Expense` — `{ readonly id: string; label: string; amountMinor: number; date: string; category: CategoryId }`;
    - `ExpenseDraft` — чернетка з форми без `id`, кожне поле необов’язкове, а `category?: string` — будь-який текст, доки його не перевірено;
    - `ValidationResult` — union `{ ok: true; value: { label: string; amountMinor: number; date: string; category: CategoryId } } | { ok: false; errors: ExpenseErrors }`, де `ExpenseErrors` має необов’язкові `label`, `amountMinor`, `category` і `date` із ключами помилок (`"required"`, `"too-long"`, `"not-positive-integer"`, `"unknown"`, `"bad-date"`);
    - `ExpenseSummary` — `{ total: number; byCategory: Record<CategoryId, number> }`: `Record` має рівно чотири ключі, тож `tsc` помітить пропущену чи неправильно написану категорію в `summarizeExpenses`.

    Анотуй параметри й результати всіх функцій модуля. `indexById` стає generic: `indexById<T extends { readonly id: string }>(list: readonly T[]): Map<string, T>` — працює для будь-яких записів з `id`, а `Map` зберігає їхній тип. Щоб `validateExpense` повертала `CategoryId`, а не будь-який текст, напиши предикат типу `isCategoryId(value: unknown): value is CategoryId` і перевір ним категорію; `totalsByCategory` повертає `Map<CategoryId, number>`. Без `any`, `as` і `!`.

    **2. `storage/expenses.ts`.** Імпортуй `validateExpense` звичайним імпортом, а тип `Expense` — через `import type`. `isUsableExpense(value: unknown): value is Expense` перевіряє значення поле за полем: це об’єкт (не `null`), у ньому є `id`, `label`, `date` і `category` — текст, `amountMinor` — число (кожне поле перевір через `"поле" in value` і `typeof`), і `validateExpense` для всіх полів дає `ok: true`: так відновлена сума `845.5` чи `0` вважається пошкодженою — `amountMinor` має бути цілим числом більшим за нуль. `loadExpenses` читає результат `JSON.parse` як `unknown`, а коли дві збережені витрати мають той самий `id`, повертає `{ ok: false, reason: "duplicate-id" }` і, як і для інших причин, спершу копіює текст під ключ резервної копії.

    **3. Імпорти — з `.ts`.** Видали `domain/expenses.js` і `storage/expenses.js` і зміни в усіх модулях шляхи на `../domain/expenses.ts`, `../storage/expenses.ts`, `./expenses.ts`. Платформа знайшла б і старий шлях `.js`, але Node.js і браузер — ні.

    **4. `tsconfig.json`** у корені проєкту — для перевірки в експортованому проєкті командою `npx tsc --noEmit`:

    ```json
    {
      "compilerOptions": {
        "strict": true,
        "noEmit": true,
        "target": "es2023",
        "lib": ["es2023", "dom"],
        "module": "esnext",
        "moduleResolution": "bundler",
        "moduleDetection": "force",
        "verbatimModuleSyntax": true,
        "allowImportingTsExtensions": true,
        "types": []
      },
      "include": ["domain/**/*.ts", "storage/**/*.ts"]
    }
    ```

    **5. Тести.** `tests/domain.test.js` лишається JavaScript-файлом і імпортує `../domain/expenses.ts`. Допиши тест: `indexById` для записів, у яких два мають той самий `id`, лишає перший.

    **Як перевірятиметься.** Перевірки не бачать типів: платформа прибирає їх перед запуском і не перевіряє, тож тип, який `tsc` відхилив би, тут не помітний — його ловить лише `npx tsc --noEmit`. Перевірки дивляться, що `.ts`-файли є, а старих `.js` немає, що кожен відносний імпорт указує на наявний файл (як шукає Node.js — без заміни `.js` на `.ts`), що `tsconfig.json` вмикає `strict`, що правила поводяться як раніше, що `isUsableExpense` відхиляє неповні й неправильні значення, а `loadExpenses` — повторний `id`, і що сторінка зі збереженими витратами з однаковим `id` показує початкові. Твої тести запускаються з `domain/expenses.ts` від курсу (з прибраними типами) — усі мають пройти — і з версією, де `indexById` лишає останній запис повторного `id`: з нею хоча б один тест має впасти.
  en: |
    The modules `domain/expenses.js` and `storage/expenses.js` become the TypeScript files `domain/expenses.ts` and `storage/expenses.ts`. The behaviour of the page does not change; one rule is added — saved expenses with the same `id` count as damaged.

    **1. Types in `domain/expenses.ts`** (export them):

    - `CategoryId` — the union `"food" | "transport" | "home" | "fun"`;
    - `Expense` — `{ readonly id: string; label: string; amountMinor: number; date: string; category: CategoryId }`;
    - `ExpenseDraft` — a draft from the form without `id`, every field optional, and `category?: string` — any text until it is checked;
    - `ValidationResult` — the union `{ ok: true; value: { label: string; amountMinor: number; date: string; category: CategoryId } } | { ok: false; errors: ExpenseErrors }`, where `ExpenseErrors` has optional `label`, `amountMinor`, `category` and `date` with the error keys (`"required"`, `"too-long"`, `"not-positive-integer"`, `"unknown"`, `"bad-date"`);
    - `ExpenseSummary` — `{ total: number; byCategory: Record<CategoryId, number> }`: a `Record` has exactly the four keys, so `tsc` notices a missing or misspelled category in `summarizeExpenses`.

    Annotate the parameters and results of every function of the module. `indexById` becomes generic: `indexById<T extends { readonly id: string }>(list: readonly T[]): Map<string, T>` — it works for any records with an `id`, and the `Map` keeps their type. For `validateExpense` to return a `CategoryId` and not any text, write a type predicate `isCategoryId(value: unknown): value is CategoryId` and check the category with it; `totalsByCategory` returns a `Map<CategoryId, number>`. No `any`, `as` or `!`.

    **2. `storage/expenses.ts`.** Import `validateExpense` with an ordinary import, and the type `Expense` with `import type`. `isUsableExpense(value: unknown): value is Expense` checks the value field by field: it is an object (not `null`), it has `id`, `label`, `date` and `category` as text, `amountMinor` as a number (check every field with `"field" in value` and `typeof`), and `validateExpense` gives `ok: true` for all the fields: so a restored amount of `845.5` or `0` counts as damaged — `amountMinor` must be a whole number above zero. `loadExpenses` reads the result of `JSON.parse` as `unknown`, and when two saved expenses have the same `id`, it returns `{ ok: false, reason: "duplicate-id" }` and, as for the other reasons, first copies the text under the backup key.

    **3. Imports end with `.ts`.** Delete `domain/expenses.js` and `storage/expenses.js` and change the paths in every module to `../domain/expenses.ts`, `../storage/expenses.ts`, `./expenses.ts`. The platform would also find the old `.js` path, but Node.js and a browser would not.

    **4. `tsconfig.json`** in the project folder — for the check in the exported project with the command `npx tsc --noEmit`:

    ```json
    {
      "compilerOptions": {
        "strict": true,
        "noEmit": true,
        "target": "es2023",
        "lib": ["es2023", "dom"],
        "module": "esnext",
        "moduleResolution": "bundler",
        "moduleDetection": "force",
        "verbatimModuleSyntax": true,
        "allowImportingTsExtensions": true,
        "types": []
      },
      "include": ["domain/**/*.ts", "storage/**/*.ts"]
    }
    ```

    **5. Tests.** `tests/domain.test.js` stays a JavaScript file and imports `../domain/expenses.ts`. Add a test: for records of which two have the same `id`, `indexById` keeps the first.

    **How it is checked.** The checks do not see types: the platform removes them before running and does not check them, so a type that `tsc` would reject is invisible here — only `npx tsc --noEmit` catches it. The checks look that the `.ts` files are there and the old `.js` ones are not, that every relative import points at an existing file (as Node.js looks for it — without turning `.js` into `.ts`), that `tsconfig.json` switches on `strict`, that the rules behave as before, that `isUsableExpense` rejects incomplete and wrong values and `loadExpenses` a repeated `id`, and that the page with saved expenses sharing an `id` shows the starting ones. Your tests run with the course's `domain/expenses.ts` (with the types removed) — all must pass — and with a version where `indexById` keeps the last record of a repeated `id`: with it, at least one test must fail.
nudge:
  uk: "`\"amountMinor\" in value` звужує `unknown` до об’єкта, у якого точно є поле `amountMinor`, тож після нього `typeof value.amountMinor` уже можна писати без `as`. А `records.every(isUsableExpense)` з предикатом типу каже `tsc`, що весь масив — `Expense[]`."
  en: "`\"amountMinor\" in value` narrows `unknown` to an object that surely has an `amountMinor` field, so after it you can write `typeof value.amountMinor` without `as`. And `records.every(isUsableExpense)` with a type predicate tells `tsc` that the whole array is `Expense[]`."
