feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Помилку в типах платформа не показує: вона прибирає типи й запускає код, тож тут видно лише помилки JavaScript і завантаження файлів."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. The platform does not show a type error: it removes the types and runs the code, so only JavaScript errors and file loading errors show here."
  - when: { test: "the domain and storage modules are TypeScript files" }
    message:
      uk: "Ця перевірка чекає файли `domain/wishes.ts` і `storage/wishes.ts` і жодного з файлів `domain/wishes.js`, `storage/wishes.js`. Перейменуй модулі (кнопка «Перейменувати» біля файлу) або створи нові й видали старі."
      en: "This check expects the files `domain/wishes.ts` and `storage/wishes.ts` and neither of the files `domain/wishes.js`, `storage/wishes.js`. Rename the modules (the “Rename” button next to the file) or create new ones and delete the old ones."
  - when: { test: "every import names a file that exists" }
    message:
      uk: "Ця перевірка проходить імпорти від `app.js` і `run-tests.js` так, як Node.js і браузер шукають файли: шлях має збігатися з наявним файлом буквально. Повідомлення внизу називає файл і шлях, що нікуди не веде, наприклад `ui/page.js → ../domain/wishes.js`: заміни його на `../domain/wishes.ts`."
      en: "This check follows the imports from `app.js` and `run-tests.js` the way Node.js and a browser look for files: the path must match an existing file exactly. The message below names the file and the path that leads nowhere, for example `ui/page.js → ../domain/wishes.js`: change it to `../domain/wishes.ts`."
  - when: { test: "tsconfig.json asks for strict checking" }
    message:
      uk: "Ця перевірка читає `tsconfig.json` у корені проєкту як JSON і чекає в `compilerOptions` `\"strict\": true` та `\"allowImportingTsExtensions\": true` (або `\"rewriteRelativeImportExtensions\": true`). Без останнього `tsc` не прийме імпорти, що закінчуються на `.ts`."
      en: "This check reads `tsconfig.json` in the project folder as JSON and expects `\"strict\": true` and `\"allowImportingTsExtensions\": true` (or `\"rewriteRelativeImportExtensions\": true`) in `compilerOptions`. Without the latter `tsc` does not accept imports that end with `.ts`."
  - when: { test: "the domain rules behave as before" }
    message:
      uk: "Ця перевірка імпортує `domain/wishes.ts` і чекає від `validateItem`, `summarizeItems` і `sortItemsByPrice` тих самих результатів, що й до переходу на TypeScript. Типи не змінюють поведінки: якщо результат інший, змінився сам код функції."
      en: "This check imports `domain/wishes.ts` and expects `validateItem`, `summarizeItems` and `sortItemsByPrice` to give the same results as before the move to TypeScript. Types do not change behaviour: if a result differs, the code of the function itself changed."
  - when: { test: "isUsableItem checks every field of an unknown value" }
    message:
      uk: "Ця перевірка імпортує `storage/wishes.ts` і чекає від `isUsableItem` `true` для повного бажання та `false` для `null`, числа, тексту, масиву, `{}`, бажання без поля `price`, із ціною `\"80\"` чи `12.5`, з `id` `1`, без назви, з `acquired: \"yes\"` і з категорією `5`. Повідомлення внизу називає значення, для якого відповідь інша."
      en: "This check imports `storage/wishes.ts` and expects `isUsableItem` to give `true` for a complete wish and `false` for `null`, a number, text, an array, `{}`, a wish without the field `price`, with the price `\"80\"` or `12.5`, with the `id` `1`, without a name, with `acquired: \"yes\"` and with the category `5`. The message below names the value with a different answer."
  - when: { test: "loadItems refuses saved records with a repeated id" }
    message:
      uk: "Ця перевірка дає `loadItems` тестове сховище, де під ключем `jsll.wishlist.v1` збережено два бажання з `id` `w-01`, і чекає `{ ok: false, reason: \"duplicate-id\" }`, той самий текст під ключем `jsll.wishlist.v1.backup` і незмінений основний ключ, а для шести початкових бажань — `{ ok: true, items: … }`."
      en: "This check gives `loadItems` a test storage where two wishes with the `id` `w-01` are saved under the key `jsll.wishlist.v1`, and expects `{ ok: false, reason: \"duplicate-id\" }`, the same text under the key `jsll.wishlist.v1.backup` and the main key unchanged, and `{ ok: true, items: … }` for the six starting wishes."
  - when: { test: "indexById works for any records with an id" }
    message:
      uk: "Ця перевірка викликає `indexById` для записів, що не є бажаннями (`{ id, step }`), і чекає `Map` з ключами `a` і `b`, де для `a` лишився перший запис (той самий об’єкт)."
      en: "This check calls `indexById` for records that are not wishes (`{ id, step }`) and expects a `Map` with the keys `a` and `b`, where the first record (the very object) stayed for `a`."
  - when: { test: "saved wishes with a repeated id are not shown" }
    message:
      uk: "Ця перевірка зберігає два бажання з `id` `w-01`, викликає `start(storage)` і чекає першу сторінку шести початкових бажань та «%%loadErrorMessage%%». Так і буде, коли `loadItems` повертає `\"duplicate-id\"`."
      en: "This check saves two wishes with the `id` `w-01`, calls `start(storage)` and expects the first page of the six starting wishes and “%%loadErrorMessage%%”. That is what happens when `loadItems` returns `\"duplicate-id\"`."
  - when: { test: "your domain tests import the .ts module and pass" }
    message:
      uk: "Ця перевірка запускає `tests/domain.test.js` з `domain/wishes.ts` від курсу (з прибраними типами) і раннером курсу та чекає хоча б один тест і жодного, що впав. Якщо там «there is no file», то тест імпортує `../domain/wishes.js`: заміни на `../domain/wishes.ts`. Тести мають лишатися файлом `.js`."
      en: "This check runs `tests/domain.test.js` with the course's `domain/wishes.ts` (with the types removed) and the course runner, and expects at least one test and none that fails. If it says “there is no file”, the test imports `../domain/wishes.js`: change it to `../domain/wishes.ts`. The tests must stay a `.js` file."
  - when: { test: "your tests catch an indexById that keeps the last of a repeated id" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.ts`. Потім вона підставляє версію, де `indexById` записує в `Map` кожен запис, тож для повторного `id` лишається останній, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест із двома записами з тим самим `id`."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.ts`. Then it puts in a version where `indexById` writes every record into the `Map`, so the last one stays for a repeated `id`, and expects at least one of your tests to fail. Only a test with two records with the same `id` notices this defect."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
