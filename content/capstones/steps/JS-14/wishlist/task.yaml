# Wishlist variant of step JS-14. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings: {}
instructions:
  uk: |
    Модулі `domain/wishes.js` і `storage/wishes.js` стають TypeScript-файлами `domain/wishes.ts` і `storage/wishes.ts`. Поведінка сторінки не змінюється; додається одне правило — збережені бажання з однаковим `id` вважаються пошкодженими.

    **1. Типи в `domain/wishes.ts`** (експортуй їх):

    - `Wish` — `{ readonly id: string; name: string; price: number | null; acquired: boolean; category: string | null }`;
    - `WishDraft` — те саме без `id`, і кожне поле необов’язкове (`name?: string` …): так виглядає чернетка з форми;
    - `ValidationResult` — union `{ ok: true; value: { name: string; price: number | null } } | { ok: false; errors: WishErrors }`, де `WishErrors` має необов’язкові `name` і `price` із ключами помилок (`"required"`, `"too-long"`, `"not-a-number"`, `"negative"`, `"not-whole"`).

    Анотуй параметри й результати всіх функцій модуля. `indexById` стає generic: `indexById<T extends { readonly id: string }>(list: readonly T[]): Map<string, T>` — працює для будь-яких записів з `id`, а `Map` зберігає їхній тип. Щоб `tsc` знав, що в сумі `summarizeItems` лише числа, відфільтруй бажання із ціною функцією-предикатом типу (`item is Wish & { price: number }`). Без `any`, `as` і `!`.

    **2. `storage/wishes.ts`.** Імпортуй `validateItem` звичайним імпортом, а тип `Wish` — через `import type`. `isUsableItem(value: unknown): value is Wish` перевіряє значення поле за полем: це об’єкт (не `null`), у ньому є `id` і `name` — текст, `price` — число або `null`, `acquired` — `true`/`false`, `category` — текст або `null` (кожне поле перевір через `"поле" in value` і `typeof`), і `validateItem` для назви й ціни дає `ok: true`. `loadItems` читає результат `JSON.parse` як `unknown`, а коли два збережені бажання мають той самий `id`, повертає `{ ok: false, reason: "duplicate-id" }` і, як і для інших причин, спершу копіює текст під ключ резервної копії.

    **3. Імпорти — з `.ts`.** Видали `domain/wishes.js` і `storage/wishes.js` і зміни в усіх модулях шляхи на `../domain/wishes.ts`, `../storage/wishes.ts`, `./wishes.ts`. Платформа знайшла б і старий шлях `.js`, але Node.js і браузер — ні.

    **4. `tsconfig.json`** у корені проєкту — для перевірки в експортованому проєкті командою `npx tsc --noEmit`:

    ```json
    {
      "compilerOptions": {
        "strict": true,
        "noEmit": true,
        "target": "es2023",
        "lib": ["es2023", "dom"],
        "module": "esnext",
        "moduleResolution": "bundler",
        "moduleDetection": "force",
        "verbatimModuleSyntax": true,
        "allowImportingTsExtensions": true,
        "types": []
      },
      "include": ["domain/**/*.ts", "storage/**/*.ts"]
    }
    ```

    **5. Тести.** `tests/domain.test.js` лишається JavaScript-файлом і імпортує `../domain/wishes.ts`. Допиши тест: `indexById` для записів, у яких два мають той самий `id`, лишає перший.

    **Як перевірятиметься.** Перевірки не бачать типів: платформа прибирає їх перед запуском і не перевіряє, тож тип, який `tsc` відхилив би, тут не помітний — його ловить лише `npx tsc --noEmit`. Перевірки дивляться, що `.ts`-файли є, а старих `.js` немає, що кожен відносний імпорт указує на наявний файл (як шукає Node.js — без заміни `.js` на `.ts`), що `tsconfig.json` вмикає `strict`, що правила поводяться як раніше, що `isUsableItem` відхиляє неповні й неправильні значення, а `loadItems` — повторний `id`, і що сторінка зі збереженими бажаннями з однаковим `id` показує початкові. Твої тести запускаються з `domain/wishes.ts` від курсу (з прибраними типами) — усі мають пройти — і з версією, де `indexById` лишає останній запис повторного `id`: з нею хоча б один тест має впасти.
  en: |
    The modules `domain/wishes.js` and `storage/wishes.js` become the TypeScript files `domain/wishes.ts` and `storage/wishes.ts`. The behaviour of the page does not change; one rule is added — saved wishes with the same `id` count as damaged.

    **1. Types in `domain/wishes.ts`** (export them):

    - `Wish` — `{ readonly id: string; name: string; price: number | null; acquired: boolean; category: string | null }`;
    - `WishDraft` — the same without `id`, and every field optional (`name?: string` …): that is what a draft from the form looks like;
    - `ValidationResult` — the union `{ ok: true; value: { name: string; price: number | null } } | { ok: false; errors: WishErrors }`, where `WishErrors` has optional `name` and `price` with the error keys (`"required"`, `"too-long"`, `"not-a-number"`, `"negative"`, `"not-whole"`).

    Annotate the parameters and results of every function of the module. `indexById` becomes generic: `indexById<T extends { readonly id: string }>(list: readonly T[]): Map<string, T>` — it works for any records with an `id`, and the `Map` keeps their type. For `tsc` to know that the sum in `summarizeItems` has only numbers, filter the wishes with a price through a type predicate function (`item is Wish & { price: number }`). No `any`, `as` or `!`.

    **2. `storage/wishes.ts`.** Import `validateItem` with an ordinary import, and the type `Wish` with `import type`. `isUsableItem(value: unknown): value is Wish` checks the value field by field: it is an object (not `null`), it has `id` and `name` as text, `price` as a number or `null`, `acquired` as `true`/`false`, `category` as text or `null` (check every field with `"field" in value` and `typeof`), and `validateItem` gives `ok: true` for the name and the price. `loadItems` reads the result of `JSON.parse` as `unknown`, and when two saved wishes have the same `id`, it returns `{ ok: false, reason: "duplicate-id" }` and, as for the other reasons, first copies the text under the backup key.

    **3. Imports end with `.ts`.** Delete `domain/wishes.js` and `storage/wishes.js` and change the paths in every module to `../domain/wishes.ts`, `../storage/wishes.ts`, `./wishes.ts`. The platform would also find the old `.js` path, but Node.js and a browser would not.

    **4. `tsconfig.json`** in the project folder — for the check in the exported project with the command `npx tsc --noEmit`:

    ```json
    {
      "compilerOptions": {
        "strict": true,
        "noEmit": true,
        "target": "es2023",
        "lib": ["es2023", "dom"],
        "module": "esnext",
        "moduleResolution": "bundler",
        "moduleDetection": "force",
        "verbatimModuleSyntax": true,
        "allowImportingTsExtensions": true,
        "types": []
      },
      "include": ["domain/**/*.ts", "storage/**/*.ts"]
    }
    ```

    **5. Tests.** `tests/domain.test.js` stays a JavaScript file and imports `../domain/wishes.ts`. Add a test: for records of which two have the same `id`, `indexById` keeps the first.

    **How it is checked.** The checks do not see types: the platform removes them before running and does not check them, so a type that `tsc` would reject is invisible here — only `npx tsc --noEmit` catches it. The checks look that the `.ts` files are there and the old `.js` ones are not, that every relative import points at an existing file (as Node.js looks for it — without turning `.js` into `.ts`), that `tsconfig.json` switches on `strict`, that the rules behave as before, that `isUsableItem` rejects incomplete and wrong values and `loadItems` a repeated `id`, and that the page with saved wishes sharing an `id` shows the starting ones. Your tests run with the course's `domain/wishes.ts` (with the types removed) — all must pass — and with a version where `indexById` keeps the last record of a repeated `id`: with it, at least one test must fail.
nudge:
  uk: "`\"price\" in value` звужує `unknown` до об’єкта, у якого точно є поле `price`, тож після нього `typeof value.price` уже можна писати без `as`. А `records.every(isUsableItem)` з предикатом типу каже `tsc`, що весь масив — `Wish[]`."
  en: "`\"price\" in value` narrows `unknown` to an object that surely has a `price` field, so after it you can write `typeof value.price` without `as`. And `records.every(isUsableItem)` with a type predicate tells `tsc` that the whole array is `Wish[]`."
