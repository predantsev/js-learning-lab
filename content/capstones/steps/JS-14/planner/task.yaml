# Planner variant of step JS-14. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings: {}
instructions:
  uk: |
    Модулі `domain/tasks.js` і `storage/tasks.js` стають TypeScript-файлами `domain/tasks.ts` і `storage/tasks.ts`. Поведінка сторінки не змінюється; додається одне правило — збережені справи з однаковим `id` вважаються пошкодженими.

    **1. Типи в `domain/tasks.ts`** (експортуй їх):

    - `Priority` — union `"low" | "normal" | "high"`;
    - `Task` — `{ readonly id: string; title: string; dueDate: string | null; done: boolean; priority: Priority }`;
    - `TaskDraft` — чернетка з форми без `id`, кожне поле необов’язкове, а `priority?: string` — будь-який текст, доки його не перевірено;
    - `ValidationResult` — union `{ ok: true; value: { title: string; dueDate: string | null; priority: Priority } } | { ok: false; errors: TaskErrors }`, де `TaskErrors` має необов’язкові `title`, `priority` і `dueDate` із ключами помилок (`"required"`, `"too-long"`, `"unknown"`, `"bad-date"`).

    Анотуй параметри й результати всіх функцій модуля. `indexById` стає generic: `indexById<T extends { readonly id: string }>(list: readonly T[]): Map<string, T>` — працює для будь-яких записів з `id`, а `Map` зберігає їхній тип. Щоб `validateTask` повертала `Priority`, а не будь-який текст, напиши предикат типу `isPriority(value: unknown): value is Priority` і перевір ним пріоритет; у `countDueTasks` після `task.dueDate !== null` `tsc` сам звужує термін до `string`. Без `any`, `as` і `!`.

    **2. `storage/tasks.ts`.** Імпортуй `validateTask` звичайним імпортом, а тип `Task` — через `import type`. `isUsableTask(value: unknown): value is Task` перевіряє значення поле за полем: це об’єкт (не `null`), у ньому є `id` і `title` — текст, `dueDate` — текст або `null`, `done` — `true`/`false`, `priority` — текст (кожне поле перевір через `"поле" in value` і `typeof`), і `validateTask` для назви, терміну й пріоритету дає `ok: true`. `loadTasks` читає результат `JSON.parse` як `unknown`, а коли дві збережені справи мають той самий `id`, повертає `{ ok: false, reason: "duplicate-id" }` і, як і для інших причин, спершу копіює текст під ключ резервної копії.

    **3. Імпорти — з `.ts`.** Видали `domain/tasks.js` і `storage/tasks.js` і зміни в усіх модулях шляхи на `../domain/tasks.ts`, `../storage/tasks.ts`, `./tasks.ts`. Платформа знайшла б і старий шлях `.js`, але Node.js і браузер — ні.

    **4. `tsconfig.json`** у корені проєкту — для перевірки в експортованому проєкті командою `npx tsc --noEmit`:

    ```json
    {
      "compilerOptions": {
        "strict": true,
        "noEmit": true,
        "target": "es2023",
        "lib": ["es2023", "dom"],
        "module": "esnext",
        "moduleResolution": "bundler",
        "moduleDetection": "force",
        "verbatimModuleSyntax": true,
        "allowImportingTsExtensions": true,
        "types": []
      },
      "include": ["domain/**/*.ts", "storage/**/*.ts"]
    }
    ```

    **5. Тести.** `tests/domain.test.js` лишається JavaScript-файлом і імпортує `../domain/tasks.ts`. Допиши тест: `indexById` для записів, у яких два мають той самий `id`, лишає перший.

    **Як перевірятиметься.** Перевірки не бачать типів: платформа прибирає їх перед запуском і не перевіряє, тож тип, який `tsc` відхилив би, тут не помітний — його ловить лише `npx tsc --noEmit`. Перевірки дивляться, що `.ts`-файли є, а старих `.js` немає, що кожен відносний імпорт указує на наявний файл (як шукає Node.js — без заміни `.js` на `.ts`), що `tsconfig.json` вмикає `strict`, що правила поводяться як раніше, що `isUsableTask` відхиляє неповні й неправильні значення, а `loadTasks` — повторний `id`, і що сторінка зі збереженими справами з однаковим `id` показує початкові. Твої тести запускаються з `domain/tasks.ts` від курсу (з прибраними типами) — усі мають пройти — і з версією, де `indexById` лишає останній запис повторного `id`: з нею хоча б один тест має впасти.
  en: |
    The modules `domain/tasks.js` and `storage/tasks.js` become the TypeScript files `domain/tasks.ts` and `storage/tasks.ts`. The behaviour of the page does not change; one rule is added — saved tasks with the same `id` count as damaged.

    **1. Types in `domain/tasks.ts`** (export them):

    - `Priority` — the union `"low" | "normal" | "high"`;
    - `Task` — `{ readonly id: string; title: string; dueDate: string | null; done: boolean; priority: Priority }`;
    - `TaskDraft` — a draft from the form without `id`, every field optional, and `priority?: string` — any text until it is checked;
    - `ValidationResult` — the union `{ ok: true; value: { title: string; dueDate: string | null; priority: Priority } } | { ok: false; errors: TaskErrors }`, where `TaskErrors` has optional `title`, `priority` and `dueDate` with the error keys (`"required"`, `"too-long"`, `"unknown"`, `"bad-date"`).

    Annotate the parameters and results of every function of the module. `indexById` becomes generic: `indexById<T extends { readonly id: string }>(list: readonly T[]): Map<string, T>` — it works for any records with an `id`, and the `Map` keeps their type. For `validateTask` to return a `Priority` and not any text, write a type predicate `isPriority(value: unknown): value is Priority` and check the priority with it; in `countDueTasks` after `task.dueDate !== null` `tsc` narrows the due date to `string` by itself. No `any`, `as` or `!`.

    **2. `storage/tasks.ts`.** Import `validateTask` with an ordinary import, and the type `Task` with `import type`. `isUsableTask(value: unknown): value is Task` checks the value field by field: it is an object (not `null`), it has `id` and `title` as text, `dueDate` as text or `null`, `done` as `true`/`false`, `priority` as text (check every field with `"field" in value` and `typeof`), and `validateTask` gives `ok: true` for the title, the due date and the priority. `loadTasks` reads the result of `JSON.parse` as `unknown`, and when two saved tasks have the same `id`, it returns `{ ok: false, reason: "duplicate-id" }` and, as for the other reasons, first copies the text under the backup key.

    **3. Imports end with `.ts`.** Delete `domain/tasks.js` and `storage/tasks.js` and change the paths in every module to `../domain/tasks.ts`, `../storage/tasks.ts`, `./tasks.ts`. The platform would also find the old `.js` path, but Node.js and a browser would not.

    **4. `tsconfig.json`** in the project folder — for the check in the exported project with the command `npx tsc --noEmit`:

    ```json
    {
      "compilerOptions": {
        "strict": true,
        "noEmit": true,
        "target": "es2023",
        "lib": ["es2023", "dom"],
        "module": "esnext",
        "moduleResolution": "bundler",
        "moduleDetection": "force",
        "verbatimModuleSyntax": true,
        "allowImportingTsExtensions": true,
        "types": []
      },
      "include": ["domain/**/*.ts", "storage/**/*.ts"]
    }
    ```

    **5. Tests.** `tests/domain.test.js` stays a JavaScript file and imports `../domain/tasks.ts`. Add a test: for records of which two have the same `id`, `indexById` keeps the first.

    **How it is checked.** The checks do not see types: the platform removes them before running and does not check them, so a type that `tsc` would reject is invisible here — only `npx tsc --noEmit` catches it. The checks look that the `.ts` files are there and the old `.js` ones are not, that every relative import points at an existing file (as Node.js looks for it — without turning `.js` into `.ts`), that `tsconfig.json` switches on `strict`, that the rules behave as before, that `isUsableTask` rejects incomplete and wrong values and `loadTasks` a repeated `id`, and that the page with saved tasks sharing an `id` shows the starting ones. Your tests run with the course's `domain/tasks.ts` (with the types removed) — all must pass — and with a version where `indexById` keeps the last record of a repeated `id`: with it, at least one test must fail.
nudge:
  uk: "`\"dueDate\" in value` звужує `unknown` до об’єкта, у якого точно є поле `dueDate`, тож після нього `typeof value.dueDate` уже можна писати без `as`. А `records.every(isUsableTask)` з предикатом типу каже `tsc`, що весь масив — `Task[]`."
  en: "`\"dueDate\" in value` narrows `unknown` to an object that surely has a `dueDate` field, so after it you can write `typeof value.dueDate` without `as`. And `records.every(isUsableTask)` with a type predicate tells `tsc` that the whole array is `Task[]`."
