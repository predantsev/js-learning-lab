feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Помилку в типах платформа не показує: вона прибирає типи й запускає код, тож тут видно лише помилки JavaScript і завантаження файлів."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. The platform does not show a type error: it removes the types and runs the code, so only JavaScript errors and file loading errors show here."
  - when: { test: "the domain and storage modules are TypeScript files" }
    message:
      uk: "Ця перевірка чекає файли `domain/tasks.ts` і `storage/tasks.ts` і жодного з файлів `domain/tasks.js`, `storage/tasks.js`. Перейменуй модулі (кнопка «Перейменувати» біля файлу) або створи нові й видали старі."
      en: "This check expects the files `domain/tasks.ts` and `storage/tasks.ts` and neither of the files `domain/tasks.js`, `storage/tasks.js`. Rename the modules (the “Rename” button next to the file) or create new ones and delete the old ones."
  - when: { test: "every import names a file that exists" }
    message:
      uk: "Ця перевірка проходить імпорти від `app.js` і `run-tests.js` так, як Node.js і браузер шукають файли: шлях має збігатися з наявним файлом буквально. Повідомлення внизу називає файл і шлях, що нікуди не веде, наприклад `ui/page.js → ../domain/tasks.js`: заміни його на `../domain/tasks.ts`."
      en: "This check follows the imports from `app.js` and `run-tests.js` the way Node.js and a browser look for files: the path must match an existing file exactly. The message below names the file and the path that leads nowhere, for example `ui/page.js → ../domain/tasks.js`: change it to `../domain/tasks.ts`."
  - when: { test: "tsconfig.json asks for strict checking" }
    message:
      uk: "Ця перевірка читає `tsconfig.json` у корені проєкту як JSON і чекає в `compilerOptions` `\"strict\": true` та `\"allowImportingTsExtensions\": true` (або `\"rewriteRelativeImportExtensions\": true`). Без останнього `tsc` не прийме імпорти, що закінчуються на `.ts`."
      en: "This check reads `tsconfig.json` in the project folder as JSON and expects `\"strict\": true` and `\"allowImportingTsExtensions\": true` (or `\"rewriteRelativeImportExtensions\": true`) in `compilerOptions`. Without the latter `tsc` does not accept imports that end with `.ts`."
  - when: { test: "the domain rules behave as before" }
    message:
      uk: "Ця перевірка імпортує `domain/tasks.ts` і чекає від `validateTask`, `countDueTasks` і `sortTasks` тих самих результатів, що й до переходу на TypeScript. Типи не змінюють поведінки: якщо результат інший, змінився сам код функції."
      en: "This check imports `domain/tasks.ts` and expects `validateTask`, `countDueTasks` and `sortTasks` to give the same results as before the move to TypeScript. Types do not change behaviour: if a result differs, the code of the function itself changed."
  - when: { test: "isUsableTask checks every field of an unknown value" }
    message:
      uk: "Ця перевірка імпортує `storage/tasks.ts` і чекає від `isUsableTask` `true` для повної справи та `false` для `null`, числа, тексту, масиву, `{}`, справи без поля `dueDate`, з пріоритетом `\"urgent\"`, з терміном `\"02.03.2026\"` чи `20260302`, з `id` `1`, без назви й з `done: \"no\"`. Повідомлення внизу називає значення, для якого відповідь інша."
      en: "This check imports `storage/tasks.ts` and expects `isUsableTask` to give `true` for a complete task and `false` for `null`, a number, text, an array, `{}`, a task without the field `dueDate`, with the priority `\"urgent\"`, with the due date `\"02.03.2026\"` or `20260302`, with the `id` `1`, without a title and with `done: \"no\"`. The message below names the value with a different answer."
  - when: { test: "loadTasks refuses saved records with a repeated id" }
    message:
      uk: "Ця перевірка дає `loadTasks` тестове сховище, де під ключем `jsll.planner.v1` збережено дві справи з `id` `t-01`, і чекає `{ ok: false, reason: \"duplicate-id\" }`, той самий текст під ключем `jsll.planner.v1.backup` і незмінений основний ключ, а для шести початкових справ — `{ ok: true, tasks: … }`."
      en: "This check gives `loadTasks` a test storage where two tasks with the `id` `t-01` are saved under the key `jsll.planner.v1`, and expects `{ ok: false, reason: \"duplicate-id\" }`, the same text under the key `jsll.planner.v1.backup` and the main key unchanged, and `{ ok: true, tasks: … }` for the six starting tasks."
  - when: { test: "indexById works for any records with an id" }
    message:
      uk: "Ця перевірка викликає `indexById` для записів, що не є справами (`{ id, step }`), і чекає `Map` з ключами `a` і `b`, де для `a` лишився перший запис (той самий об’єкт)."
      en: "This check calls `indexById` for records that are not tasks (`{ id, step }`) and expects a `Map` with the keys `a` and `b`, where the first record (the very object) stayed for `a`."
  - when: { test: "saved tasks with a repeated id are not shown" }
    message:
      uk: "Ця перевірка зберігає дві справи з `id` `t-01`, викликає `start(storage)` і чекає першу сторінку шести початкових справ та «%%loadErrorMessage%%». Так і буде, коли `loadTasks` повертає `\"duplicate-id\"`."
      en: "This check saves two tasks with the `id` `t-01`, calls `start(storage)` and expects the first page of the six starting tasks and “%%loadErrorMessage%%”. That is what happens when `loadTasks` returns `\"duplicate-id\"`."
  - when: { test: "your domain tests import the .ts module and pass" }
    message:
      uk: "Ця перевірка запускає `tests/domain.test.js` з `domain/tasks.ts` від курсу (з прибраними типами) і раннером курсу та чекає хоча б один тест і жодного, що впав. Якщо там «there is no file», то тест імпортує `../domain/tasks.js`: заміни на `../domain/tasks.ts`. Тести мають лишатися файлом `.js`."
      en: "This check runs `tests/domain.test.js` with the course's `domain/tasks.ts` (with the types removed) and the course runner, and expects at least one test and none that fails. If it says “there is no file”, the test imports `../domain/tasks.js`: change it to `../domain/tasks.ts`. The tests must stay a `.js` file."
  - when: { test: "your tests catch an indexById that keeps the last of a repeated id" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/tasks.ts`. Потім вона підставляє версію, де `indexById` записує в `Map` кожен запис, тож для повторного `id` лишається останній, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест із двома записами з тим самим `id`."
      en: "This check first expects all your tests to pass with the correct `domain/tasks.ts`. Then it puts in a version where `indexById` writes every record into the `Map`, so the last one stays for a repeated `id`, and expects at least one of your tests to fail. Only a test with two records with the same `id` notices this defect."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
