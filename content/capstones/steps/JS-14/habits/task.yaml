# Habits variant of step JS-14. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings: {}
instructions:
  uk: |
    Модулі `domain/habits.js` і `storage/habits.js` стають TypeScript-файлами `domain/habits.ts` і `storage/habits.ts`. Поведінка сторінки не змінюється; додається одне правило — збережені звички з однаковим `id` вважаються пошкодженими.

    **1. Типи в `domain/habits.ts`** (експортуй їх):

    - `Frequency` — union `"daily" | "weekly"`;
    - `Habit` — `{ readonly id: string; name: string; frequency: Frequency; active: boolean; completions: string[] }`;
    - `HabitDraft` — чернетка з форми без `id`, кожне поле необов’язкове, а `frequency?: string` — будь-який текст, доки його не перевірено;
    - `ValidationResult` — union `{ ok: true; value: { name: string; frequency: Frequency } } | { ok: false; errors: HabitErrors }`, де `HabitErrors` має необов’язкові `name` і `frequency` із ключами помилок (`"required"`, `"too-long"`, `"unknown"`).

    Анотуй параметри й результати всіх функцій модуля. `indexById` стає generic: `indexById<T extends { readonly id: string }>(list: readonly T[]): Map<string, T>` — працює для будь-яких записів з `id`, а `Map` зберігає їхній тип. Щоб `validateHabit` повертала `Frequency`, а не будь-який текст, напиши предикат типу `isFrequency(value: unknown): value is Frequency` і перевір ним частоту. Додай generic-хелпер `sortBy<T>(items: readonly T[], key: (item: T) => string): T[]` — відсортовану копію за текстом, який `key` дає для кожного запису (`localeCompare`; записи з тим самим ключем лишаються в тому самому порядку) — і збудуй на ньому `sortHabitsByName` (за назвою) та `uniqueSortedDays` (дні за самим днем). Без `any`, `as` і `!`.

    **2. `storage/habits.ts`.** Імпортуй `validateHabit`, `isCalendarDate` і `uniqueSortedDays` звичайним імпортом, а тип `Habit` — через `import type`. `isUsableHabit(value: unknown): value is Habit` перевіряє значення поле за полем: це об’єкт (не `null`), у ньому є `id`, `name` і `frequency` — текст, `active` — `true`/`false`, `completions` — масив (кожне поле перевір через `"поле" in value`, `typeof` і `Array.isArray`), кожна дата в `completions` — календарна дата, масив дорівнює `uniqueSortedDays(completions)` (без повторів, за зростанням), і `validateHabit` для назви й частоти дає `ok: true`. `loadHabits` читає результат `JSON.parse` як `unknown`, а коли дві збережені звички мають той самий `id`, повертає `{ ok: false, reason: "duplicate-id" }` і, як і для інших причин, спершу копіює текст під ключ резервної копії.

    **3. Імпорти — з `.ts`.** Видали `domain/habits.js` і `storage/habits.js` і зміни в усіх модулях шляхи на `../domain/habits.ts`, `../storage/habits.ts`, `./habits.ts`. Платформа знайшла б і старий шлях `.js`, але Node.js і браузер — ні.

    **4. `tsconfig.json`** у корені проєкту — для перевірки в експортованому проєкті командою `npx tsc --noEmit`:

    ```json
    {
      "compilerOptions": {
        "strict": true,
        "noEmit": true,
        "target": "es2023",
        "lib": ["es2023", "dom"],
        "module": "esnext",
        "moduleResolution": "bundler",
        "moduleDetection": "force",
        "verbatimModuleSyntax": true,
        "allowImportingTsExtensions": true,
        "types": []
      },
      "include": ["domain/**/*.ts", "storage/**/*.ts"]
    }
    ```

    **5. Тести.** `tests/domain.test.js` лишається JavaScript-файлом і імпортує `../domain/habits.ts`. Допиши тест: `indexById` для записів, у яких два мають той самий `id`, лишає перший.

    **Як перевірятиметься.** Перевірки не бачать типів: платформа прибирає їх перед запуском і не перевіряє, тож тип, який `tsc` відхилив би, тут не помітний — його ловить лише `npx tsc --noEmit`. Перевірки дивляться, що `.ts`-файли є, а старих `.js` немає, що кожен відносний імпорт указує на наявний файл (як шукає Node.js — без заміни `.js` на `.ts`), що `tsconfig.json` вмикає `strict`, що правила поводяться як раніше, що `isUsableHabit` відхиляє неповні й неправильні значення, а `loadHabits` — повторний `id`, і що сторінка зі збереженими звичками з однаковим `id` показує початкові. Твої тести запускаються з `domain/habits.ts` від курсу (з прибраними типами) — усі мають пройти — і з версією, де `indexById` лишає останній запис повторного `id`: з нею хоча б один тест має впасти.
  en: |
    The modules `domain/habits.js` and `storage/habits.js` become the TypeScript files `domain/habits.ts` and `storage/habits.ts`. The behaviour of the page does not change; one rule is added — saved habits with the same `id` count as damaged.

    **1. Types in `domain/habits.ts`** (export them):

    - `Frequency` — the union `"daily" | "weekly"`;
    - `Habit` — `{ readonly id: string; name: string; frequency: Frequency; active: boolean; completions: string[] }`;
    - `HabitDraft` — a draft from the form without `id`, every field optional, and `frequency?: string` — any text until it is checked;
    - `ValidationResult` — the union `{ ok: true; value: { name: string; frequency: Frequency } } | { ok: false; errors: HabitErrors }`, where `HabitErrors` has optional `name` and `frequency` with the error keys (`"required"`, `"too-long"`, `"unknown"`).

    Annotate the parameters and results of every function of the module. `indexById` becomes generic: `indexById<T extends { readonly id: string }>(list: readonly T[]): Map<string, T>` — it works for any records with an `id`, and the `Map` keeps their type. For `validateHabit` to return a `Frequency` and not any text, write a type predicate `isFrequency(value: unknown): value is Frequency` and check the frequency with it. Add a generic helper `sortBy<T>(items: readonly T[], key: (item: T) => string): T[]` — a sorted copy by the text that `key` gives for every record (`localeCompare`; records with the same key keep their order) — and build `sortHabitsByName` (by name) and `uniqueSortedDays` (days by the day itself) on it. No `any`, `as` or `!`.

    **2. `storage/habits.ts`.** Import `validateHabit`, `isCalendarDate` and `uniqueSortedDays` with an ordinary import, and the type `Habit` with `import type`. `isUsableHabit(value: unknown): value is Habit` checks the value field by field: it is an object (not `null`), it has `id`, `name` and `frequency` as text, `active` as `true`/`false`, `completions` as an array (check every field with `"field" in value`, `typeof` and `Array.isArray`), every date in `completions` is a calendar date, the array equals `uniqueSortedDays(completions)` (no repeats, ascending), and `validateHabit` gives `ok: true` for the name and the frequency. `loadHabits` reads the result of `JSON.parse` as `unknown`, and when two saved habits have the same `id`, it returns `{ ok: false, reason: "duplicate-id" }` and, as for the other reasons, first copies the text under the backup key.

    **3. Imports end with `.ts`.** Delete `domain/habits.js` and `storage/habits.js` and change the paths in every module to `../domain/habits.ts`, `../storage/habits.ts`, `./habits.ts`. The platform would also find the old `.js` path, but Node.js and a browser would not.

    **4. `tsconfig.json`** in the project folder — for the check in the exported project with the command `npx tsc --noEmit`:

    ```json
    {
      "compilerOptions": {
        "strict": true,
        "noEmit": true,
        "target": "es2023",
        "lib": ["es2023", "dom"],
        "module": "esnext",
        "moduleResolution": "bundler",
        "moduleDetection": "force",
        "verbatimModuleSyntax": true,
        "allowImportingTsExtensions": true,
        "types": []
      },
      "include": ["domain/**/*.ts", "storage/**/*.ts"]
    }
    ```

    **5. Tests.** `tests/domain.test.js` stays a JavaScript file and imports `../domain/habits.ts`. Add a test: for records of which two have the same `id`, `indexById` keeps the first.

    **How it is checked.** The checks do not see types: the platform removes them before running and does not check them, so a type that `tsc` would reject is invisible here — only `npx tsc --noEmit` catches it. The checks look that the `.ts` files are there and the old `.js` ones are not, that every relative import points at an existing file (as Node.js looks for it — without turning `.js` into `.ts`), that `tsconfig.json` switches on `strict`, that the rules behave as before, that `isUsableHabit` rejects incomplete and wrong values and `loadHabits` a repeated `id`, and that the page with saved habits sharing an `id` shows the starting ones. Your tests run with the course's `domain/habits.ts` (with the types removed) — all must pass — and with a version where `indexById` keeps the last record of a repeated `id`: with it, at least one test must fail.
nudge:
  uk: "`\"completions\" in value` звужує `unknown` до об’єкта, у якого точно є поле `completions`, тож після нього `Array.isArray(value.completions)` уже можна писати без `as`. А `records.every(isUsableHabit)` з предикатом типу каже `tsc`, що весь масив — `Habit[]`."
  en: "`\"completions\" in value` narrows `unknown` to an object that surely has a `completions` field, so after it you can write `Array.isArray(value.completions)` without `as`. And `records.every(isUsableHabit)` with a type predicate tells `tsc` that the whole array is `Habit[]`."
