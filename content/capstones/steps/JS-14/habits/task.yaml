feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Помилку в типах платформа не показує: вона прибирає типи й запускає код, тож тут видно лише помилки JavaScript і завантаження файлів."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. The platform does not show a type error: it removes the types and runs the code, so only JavaScript errors and file loading errors show here."
  - when: { test: "the domain and storage modules are TypeScript files" }
    message:
      uk: "Ця перевірка чекає файли `domain/habits.ts` і `storage/habits.ts` і жодного з файлів `domain/habits.js`, `storage/habits.js`. Перейменуй модулі (кнопка «Перейменувати» біля файлу) або створи нові й видали старі."
      en: "This check expects the files `domain/habits.ts` and `storage/habits.ts` and neither of the files `domain/habits.js`, `storage/habits.js`. Rename the modules (the “Rename” button next to the file) or create new ones and delete the old ones."
  - when: { test: "every import names a file that exists" }
    message:
      uk: "Ця перевірка проходить імпорти від `app.js` і `run-tests.js` так, як Node.js і браузер шукають файли: шлях має збігатися з наявним файлом буквально. Повідомлення внизу називає файл і шлях, що нікуди не веде, наприклад `ui/page.js → ../domain/habits.js`: заміни його на `../domain/habits.ts`."
      en: "This check follows the imports from `app.js` and `run-tests.js` the way Node.js and a browser look for files: the path must match an existing file exactly. The message below names the file and the path that leads nowhere, for example `ui/page.js → ../domain/habits.js`: change it to `../domain/habits.ts`."
  - when: { test: "tsconfig.json asks for strict checking" }
    message:
      uk: "Ця перевірка читає `tsconfig.json` у корені проєкту як JSON і чекає в `compilerOptions` `\"strict\": true` та `\"allowImportingTsExtensions\": true` (або `\"rewriteRelativeImportExtensions\": true`). Без останнього `tsc` не прийме імпорти, що закінчуються на `.ts`."
      en: "This check reads `tsconfig.json` in the project folder as JSON and expects `\"strict\": true` and `\"allowImportingTsExtensions\": true` (or `\"rewriteRelativeImportExtensions\": true`) in `compilerOptions`. Without the latter `tsc` does not accept imports that end with `.ts`."
  - when: { test: "the domain rules behave as before" }
    message:
      uk: "Ця перевірка імпортує `domain/habits.ts` і чекає від `validateHabit`, `summarizeHabit` і `sortHabitsByName` тих самих результатів, що й до переходу на TypeScript. Типи не змінюють поведінки: якщо результат інший, змінився сам код функції."
      en: "This check imports `domain/habits.ts` and expects `validateHabit`, `summarizeHabit` and `sortHabitsByName` to give the same results as before the move to TypeScript. Types do not change behaviour: if a result differs, the code of the function itself changed."
  - when: { test: "isUsableHabit checks every field of an unknown value" }
    message:
      uk: "Ця перевірка імпортує `storage/habits.ts` і чекає від `isUsableHabit` `true` для повної звички та `false` для `null`, числа, тексту, масиву, `{}`, звички без поля `completions`, із частотою `\"monthly\"`, з датами не за порядком, з повтореною датою, з датою `\"1.03.2026\"`, з `completions` як текстом і з `active: \"yes\"`. Повідомлення внизу називає значення, для якого відповідь інша."
      en: "This check imports `storage/habits.ts` and expects `isUsableHabit` to give `true` for a complete habit and `false` for `null`, a number, text, an array, `{}`, a habit without the field `completions`, with the frequency `\"monthly\"`, with dates out of order, with a repeated date, with the date `\"1.03.2026\"`, with `completions` as text and with `active: \"yes\"`. The message below names the value with a different answer."
  - when: { test: "loadHabits refuses saved records with a repeated id" }
    message:
      uk: "Ця перевірка дає `loadHabits` тестове сховище, де під ключем `jsll.habits.v1` збережено дві звички з `id` `h-01`, і чекає `{ ok: false, reason: \"duplicate-id\" }`, той самий текст під ключем `jsll.habits.v1.backup` і незмінений основний ключ, а для шести початкових звичок — `{ ok: true, habits: … }`."
      en: "This check gives `loadHabits` a test storage where two habits with the `id` `h-01` are saved under the key `jsll.habits.v1`, and expects `{ ok: false, reason: \"duplicate-id\" }`, the same text under the key `jsll.habits.v1.backup` and the main key unchanged, and `{ ok: true, habits: … }` for the six starting habits."
  - when: { test: "indexById works for any records with an id" }
    message:
      uk: "Ця перевірка викликає `indexById` для записів, що не є звичками (`{ id, step }`), і чекає `Map` з ключами `a` і `b`, де для `a` лишився перший запис (той самий об’єкт)."
      en: "This check calls `indexById` for records that are not habits (`{ id, step }`) and expects a `Map` with the keys `a` and `b`, where the first record (the very object) stayed for `a`."
  - when: { test: "sortBy sorts a copy of any records by a key" }
    message:
      uk: "Ця перевірка чекає іменований експорт `sortBy` у `domain/habits.ts`: для трьох дат із ключем `(day) => day` — нову відсортовану копію, причому переданий масив не змінюється, а для записів `{ id, name }` з ключем `(one) => one.name` — порядок `y`, `x`, `z` (записи з однаковою назвою лишаються в тому самому порядку)."
      en: "This check expects a named export `sortBy` in `domain/habits.ts`: for three dates with the key `(day) => day`, a new sorted copy, with the array passed in unchanged, and for records `{ id, name }` with the key `(one) => one.name`, the order `y`, `x`, `z` (records with the same name keep their order)."
  - when: { test: "saved habits with a repeated id are not shown" }
    message:
      uk: "Ця перевірка зберігає дві звички з `id` `h-01`, викликає `start(storage)` і чекає першу сторінку шести початкових звичок та «%%loadErrorMessage%%». Так і буде, коли `loadHabits` повертає `\"duplicate-id\"`."
      en: "This check saves two habits with the `id` `h-01`, calls `start(storage)` and expects the first page of the six starting habits and “%%loadErrorMessage%%”. That is what happens when `loadHabits` returns `\"duplicate-id\"`."
  - when: { test: "your domain tests import the .ts module and pass" }
    message:
      uk: "Ця перевірка запускає `tests/domain.test.js` з `domain/habits.ts` від курсу (з прибраними типами) і раннером курсу та чекає хоча б один тест і жодного, що впав. Якщо там «there is no file», то тест імпортує `../domain/habits.js`: заміни на `../domain/habits.ts`. Тести мають лишатися файлом `.js`."
      en: "This check runs `tests/domain.test.js` with the course's `domain/habits.ts` (with the types removed) and the course runner, and expects at least one test and none that fails. If it says “there is no file”, the test imports `../domain/habits.js`: change it to `../domain/habits.ts`. The tests must stay a `.js` file."
  - when: { test: "your tests catch an indexById that keeps the last of a repeated id" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.ts`. Потім вона підставляє версію, де `indexById` записує в `Map` кожен запис, тож для повторного `id` лишається останній, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест із двома записами з тим самим `id`."
      en: "This check first expects all your tests to pass with the correct `domain/habits.ts`. Then it puts in a version where `indexById` writes every record into the `Map`, so the last one stays for a repeated `id`, and expects at least one of your tests to fail. Only a test with two records with the same `id` notices this defect."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
