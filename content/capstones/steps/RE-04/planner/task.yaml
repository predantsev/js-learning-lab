# Planner variant of step RE-04 (a local step: done in the learner's editor, terminal and browser, no
# platform checks). Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2,
# Chrome) on the scratch project of this capstone after RE-03.
instructions:
  uk: |
    Дай списку `~/js-course/planner` одного власника — typed reducer у хуку даних — і не губи фокус після видалення. `domain/` і `storage/` не змінюються. Платформа цей крок не перевіряє; доказ — тести, перевірка з клавіатури й commit.

    1. `ui/tasksReducer.ts`: `TaskFields`, `newId` і `TasksAction` з actions `added`, `updated`, `removed`, `doneToggled`; `tasksReducer(tasks, action)` — `switch (action.type)` з доменними функціями й `const unhandled: never = action;` у `default`; `updated` спершу перевіряє чернетку доменним валідатором.
    2. `tests/reducer.test.js` з тестами actions, `import "./tests/reducer.test.js";` у `run-tests.js`, `"ui/**/*.ts"` в `include` у `tsconfig.json`.
    3. `ui/useTasks.ts`: `useReducer(tasksReducer, startingTasks, readSaved)` + ефект запису під ключем `jsll.planner.v1` з залежністю `[tasks]`; над хуком — коментар-контракт.
    4. `App`: `const [tasks, dispatch] = useTasks(startingTasks);`, обробники лише відправляють actions; `editingId` і `filter` лишаються в `App`, підтвердження видалення — у картці.
    5. Фокус: `Section` з `headingRef` і `tabIndex={-1}` на заголовку; в `App` — `focusAfterRemove` (ref) і ефект без масиву залежностей, який після commit фокусує кнопку «%%deleteLabel%%» наступної (чи попередньої) картки або заголовок «%%listTitle%%»; у картці фокус переходить «%%deleteLabel%%» → «%%cancelLabel%%» → «%%deleteLabel%%».
    6. `npm run typecheck` і `npm run lint` — без зауважень; `npm test` — 34 тести і `не пройшли: 0`.
    7. `npm start`, з клавіатури: видалення картки посередині — фокус на «%%deleteLabel%%» наступної; останньої — на попередній; останньої картки фільтра — на заголовку «%%listTitle%%»; після перезавантаження решта записів на місці без дублікатів.
    8. `git add -A`, `git commit -m "Move the list into a typed reducer and a data hook"`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.
  en: |
    Give the list of `~/js-course/planner` one owner — a typed reducer inside a data hook — and do not lose focus after a delete. `domain/` and `storage/` do not change. The platform does not check this step; the evidence is the tests, the keyboard check and the commit.

    1. `ui/tasksReducer.ts`: `TaskFields`, `newId` and `TasksAction` with the actions `added`, `updated`, `removed`, `doneToggled`; `tasksReducer(tasks, action)` is a `switch (action.type)` with the domain functions and `const unhandled: never = action;` in `default`; `updated` checks the draft with the domain validator first.
    2. `tests/reducer.test.js` with tests of the actions, `import "./tests/reducer.test.js";` in `run-tests.js`, `"ui/**/*.ts"` in the `include` of `tsconfig.json`.
    3. `ui/useTasks.ts`: `useReducer(tasksReducer, startingTasks, readSaved)` + the write effect under the key `jsll.planner.v1` with the dependency `[tasks]`; a contract comment above the hook.
    4. `App`: `const [tasks, dispatch] = useTasks(startingTasks);`, the handlers only send actions; `editingId` and `filter` stay in `App`, the delete confirmation in the card.
    5. Focus: `Section` with `headingRef` and `tabIndex={-1}` on the heading; in `App`, `focusAfterRemove` (a ref) and an effect without a dependency array that after the commit focuses the “%%deleteLabel%%” button of the next (or previous) card or the heading “%%listTitle%%”; in the card focus moves “%%deleteLabel%%” → “%%cancelLabel%%” → “%%deleteLabel%%”.
    6. `npm run typecheck` and `npm run lint` — no findings; `npm test` — 34 tests and `failed: 0`.
    7. `npm start`, from the keyboard: deleting a card in the middle — focus on “%%deleteLabel%%” of the next one; the last card — on the previous one; the last card of a filter — on the heading “%%listTitle%%”; after a reload the remaining records are there, without duplicates.
    8. `git add -A`, `git commit -m "Move the list into a typed reducer and a data hook"`; `git diff HEAD~1 --stat -- domain storage` prints nothing.
