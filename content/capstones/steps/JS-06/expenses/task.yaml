# Expense tracker variant of step JS-06. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  formTitle: { uk: "Додати чи змінити витрату", en: "Add or change an expense" }
  listTitle: { uk: "Усі витрати", en: "All expenses" }
  dateFieldLabel: { uk: "Дата", en: "Date" }
  categoryFieldLabel: { uk: "Категорія", en: "Category" }
  chooseCategory: { uk: "— обери категорію —", en: "— choose a category —" }
  saveLabel: { uk: "Зберегти", en: "Save" }
  editLabel: { uk: "Редагувати", en: "Edit" }
  deleteLabel: { uk: "Видалити", en: "Delete" }
  confirmQuestion: { uk: "Видалити цю витрату?", en: "Delete this expense?" }
  confirmDeleteLabel: { uk: "Так, видалити", en: "Yes, delete" }
  cancelLabel: { uk: "Скасувати", en: "Cancel" }
instructions:
  uk: |
    Тепер сторінка стає застосунком: витрати — картки, а форма додає й змінює їх. Функції з попередніх кроків лишаються; змінюється лише те, що робить сторінка.

    **Дані.** `expenses` — початкові шість витрат — більше ніколи не змінюється. Поточний список тримай в окремій змінній `let` (наприклад, `current`); кожна дія дає новий список через `addExpense`, `updateExpense` чи `removeExpense` і заново малює сторінку.

    **Розмітка.** Прибери з `<main>` абзаци з попередніх кроків, крім підсумку `summary`, — їх замінюють форма й список:

    - форма з атрибутом `novalidate` і полями з підписами «%%nameLabel%%» (текст), «%%valueLabel%%» (число в гривнях, `step="0.01"`), «%%dateFieldLabel%%» (поле дати `type="date"`) і «%%categoryFieldLabel%%» (список `<select>`: перший пункт «%%chooseCategory%%» з порожнім значенням, далі «%%categoryFood%%», «%%categoryTransport%%», «%%categoryHome%%», «%%categoryFun%%» зі значеннями `food`, `transport`, `home`, `fun`), а також кнопка надсилання «%%saveLabel%%»; біля полів назви, суми й категорії — елемент для повідомлення, пов’язаний із полем через `aria-describedby`;
    - під формою — абзац підсумку, заголовок списку «%%listTitle%%» з `tabindex="-1"` і порожній список `<ul id="expenses">`.

    **Картки.** Функція `render()` будує з поточного списку по картці `<li data-id="…">` на кожну витрату: назва, сума з `formatAmount` і «%%currency%%», дата, категорія словом і дві кнопки «%%editLabel%%» та «%%deleteLabel%%». У доступній назві кожної кнопки є й назва витрати, наприклад «%%editLabel%%: %%fixture1Name%%». Усі значення потрапляють у картку як текст. Той самий `render()` оновлює підсумок через `summarizeExpenses`.

    **Форма.** Надсилання (кнопкою чи Enter) не перезавантажує сторінку. Чернетка з полів: суму в гривнях перетвори на цілі копійки — помнож на `100` і заокругли через `Math.round(…)` (він дає найближче ціле число: `19.99 * 100` дорівнює `1998.9999999999998`, а після заокруглення — `1999`). Чернетку перевіряє `validateExpense`:

    - є помилки — нічого не додається, біля полів з’являються тексти з `messageFor`, фокус переходить на перше хибне поле;
    - помилок немає — повідомлення зникають, витрата додається (або зберігається зміна), форма очищається, фокус — у поле назви.

    **Кнопки карток.** Один обробник `click` на `#expenses` обслуговує кнопки всіх карток, також доданих пізніше.

    - «%%editLabel%%» заповнює форму цією витратою (суму — у гривнях) і ставить фокус у поле назви; наступне збереження змінює саме її.
    - «%%deleteLabel%%» не видаляє одразу: картка показує питання «%%confirmQuestion%%» і кнопки «%%confirmDeleteLabel%%» та «%%cancelLabel%%» (теж із назвою витрати), фокус — на «%%cancelLabel%%». Вбудований `confirm()` у перегляді недоступний, тож підтвердження будується на сторінці.
    - «%%cancelLabel%%» повертає картку як була, фокус — на її «%%deleteLabel%%».
    - «%%confirmDeleteLabel%%» видаляє витрату; фокус — на «%%deleteLabel%%» наступної картки, якщо її немає — попередньої, якщо список порожній — на заголовок списку.

    **Як перевірятиметься:** платформа, як людина, по черзі надсилає хибну чернетку (порожня назва, сума `0`, без категорії), додає «%%newName%%» за `19.99` і витрату з назвою `<b>Bold</b>`, редагує «%%fixture2Name%%», скасовує й підтверджує видалення «%%fixture3Name%%» — і після кожного кроку дивиться на картки, поля, повідомлення й підсумок. Наприкінці `expenses` має лишитися тими самими шістьма витратами. Фокус платформа не перевіряє: пройди всі дії самою клавіатурою (Tab, Enter, пробіл) і переконайся, що він щоразу там, де описано.
  en: |
    Now the page becomes an app: the expenses are cards, and a form adds and changes them. The functions of the earlier steps stay; only what the page does changes.

    **Data.** `expenses` — the six starting expenses — never changes again. Keep the current list in a separate `let` variable (for example `current`); every action makes a new list with `addExpense`, `updateExpense` or `removeExpense` and draws the page again.

    **Markup.** Remove the paragraphs of the earlier steps from `<main>`, except the summary `summary` — the form and the list replace them:

    - a form with the `novalidate` attribute and fields labeled “%%nameLabel%%” (text), “%%valueLabel%%” (a number in hryvnias, `step="0.01"`), “%%dateFieldLabel%%” (a date field `type="date"`) and “%%categoryFieldLabel%%” (a `<select>`: first the option “%%chooseCategory%%” with an empty value, then “%%categoryFood%%”, “%%categoryTransport%%”, “%%categoryHome%%”, “%%categoryFun%%” with the values `food`, `transport`, `home`, `fun`), and a submit button “%%saveLabel%%”; next to the label, amount and category fields, an element for a message, tied to its field with `aria-describedby`;
    - below the form, the summary paragraph, the list heading “%%listTitle%%” with `tabindex="-1"` and an empty list `<ul id="expenses">`.

    **Cards.** A `render()` function builds a card `<li data-id="…">` from the current list for every expense: the label, the amount from `formatAmount` with “%%currency%%”, the date, the category as a word and two buttons “%%editLabel%%” and “%%deleteLabel%%”. The accessible name of every button also holds the expense's label, for example “%%editLabel%%: %%fixture1Name%%”. Every value goes into the card as text. The same `render()` updates the summary with `summarizeExpenses`.

    **Form.** Submitting (with the button or Enter) does not reload the page. The draft from the fields: turn the amount in hryvnias into whole kopiykas — multiply by `100` and round with `Math.round(…)` (it gives the nearest whole number: `19.99 * 100` equals `1998.9999999999998`, and after rounding it is `1999`). `validateExpense` checks the draft:

    - there are errors — nothing is added, the texts from `messageFor` appear next to the fields, focus moves to the first wrong field;
    - there are none — the messages disappear, the expense is added (or the change saved), the form is cleared, focus goes to the label field.

    **Card buttons.** One `click` handler on `#expenses` serves the buttons of all cards, also of the ones added later.

    - “%%editLabel%%” fills the form with this expense (the amount in hryvnias) and puts focus into the label field; the next save changes exactly this expense.
    - “%%deleteLabel%%” does not delete at once: the card shows the question “%%confirmQuestion%%” and the buttons “%%confirmDeleteLabel%%” and “%%cancelLabel%%” (also with the expense's label), focus goes to “%%cancelLabel%%”. The built-in `confirm()` is not available in the preview, so the confirmation is built on the page.
    - “%%cancelLabel%%” restores the card, focus goes to its “%%deleteLabel%%”.
    - “%%confirmDeleteLabel%%” deletes the expense; focus goes to “%%deleteLabel%%” of the next card, if there is none — of the previous one, if the list is empty — to the list heading.

    **How it is checked:** like a person, the platform submits an invalid draft (an empty label, the amount `0`, no category), adds “%%newName%%” for `19.99` and an expense labeled `<b>Bold</b>`, edits “%%fixture2Name%%”, cancels and then confirms deleting “%%fixture3Name%%” — and after every step it looks at the cards, the fields, the messages and the summary. At the end `expenses` must still be the same six expenses. The platform does not check focus: go through all actions with the keyboard only (Tab, Enter, Space) and make sure it is where described every time.
nudge:
  uk: "Згадай урок про рендеринг списку: одна функція будує елемент для одного запису, а `replaceChildren` ставить нові елементи замість старих. У делегованому обробнику `event.target.closest(\"button\")` знаходить кнопку, навіть якщо клацнули по тексту всередині неї, а `closest(\"[data-id]\")` від кнопки — її картку. Стан «яка витрата зараз редагується» чи «чиє видалення чекає підтвердження» зручно тримати в змінних `let` і читати в `render()`."
  en: "Recall the lesson on rendering a list: one function builds the element for one record, and `replaceChildren` puts the new elements in place of the old ones. In a delegated handler, `event.target.closest(\"button\")` finds the button even when the click landed on text inside it, and `closest(\"[data-id]\")` from the button finds its card. State such as “which expense is being edited” or “whose delete waits for confirmation” is handy to keep in `let` variables and read in `render()`."
testTitles:
  "the script runs without errors":
    uk: "Код у `app.js` працює без помилок"
    en: "The script runs without errors"
  "the form has labeled fields and a submit button":
    uk: "Форма має підписані поля «%%nameLabel%%», «%%valueLabel%%», «%%dateFieldLabel%%» (дата), «%%categoryFieldLabel%%» (список) і кнопку надсилання"
    en: "The form has the labeled fields “%%nameLabel%%”, “%%valueLabel%%”, “%%dateFieldLabel%%” (a date), “%%categoryFieldLabel%%” (a select) and a submit button"
  "every expense is a card with its label, amount, date, category and named buttons":
    uk: "Кожна витрата — картка з назвою, сумою, датою, категорією й кнопками, що називають витрату"
    en: "Every expense is a card with its label, amount, date, category and buttons that name the expense"
  "an invalid draft shows messages next to its fields and adds nothing":
    uk: "Хибна чернетка показує повідомлення біля полів і нічого не додає"
    en: "An invalid draft shows messages next to its fields and adds nothing"
  "a valid draft adds a card, clears the form and the messages and updates the totals":
    uk: "Правильна чернетка додає картку, очищає форму й повідомлення та оновлює суми"
    en: "A valid draft adds a card, clears the form and the messages and updates the totals"
  "a label with markup stays text":
    uk: "Назва з розміткою лишається текстом"
    en: "A label with markup stays text"
  "Edit fills the form and saving changes only that expense":
    uk: "«%%editLabel%%» заповнює форму, а збереження змінює лише цю витрату"
    en: "“%%editLabel%%” fills the form, and saving changes only that expense"
  "Delete asks for confirmation and Cancel keeps the expense":
    uk: "«%%deleteLabel%%» просить підтвердження, а «%%cancelLabel%%» лишає витрату"
    en: "“%%deleteLabel%%” asks for confirmation, and “%%cancelLabel%%” keeps the expense"
  "confirming the delete removes only that expense":
    uk: "«%%confirmDeleteLabel%%» прибирає лише цю витрату"
    en: "“%%confirmDeleteLabel%%” removes only that expense"
  "expenses stays the starting list":
    uk: "`expenses` після всіх дій лишається тими самими шістьма витратами"
    en: "`expenses` is still the same six expenses after all actions"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки; інакше не працюють сторінка й решта перевірок. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там `TypeError` про `null` (наприклад, `reading 'addEventListener'`), то `document.querySelector` не знайшов елемент: селектор має збігатися з `id` в `index.html`."
      en: "This check expects the script to run to the end without an error; otherwise the page and the other checks do not work. The “Console” tab shows the error name and the line of code. If it shows a `TypeError` about `null` (for example `reading 'addEventListener'`), `document.querySelector` found no element: the selector must match an `id` in `index.html`."
  - when: { test: "the form has labeled fields and a submit button" }
    message:
      uk: "Ця перевірка шукає в `<form>` поля, доступна назва яких містить «%%nameLabel%%», «%%valueLabel%%», «%%dateFieldLabel%%» (`type=\"date\"`) і «%%categoryFieldLabel%%» (`<select>`), та кнопку надсилання. Підпис дає полю назву, коли `for` у `<label>` збігається з `id` поля."
      en: "This check looks in the `<form>` for fields whose accessible name holds “%%nameLabel%%”, “%%valueLabel%%”, “%%dateFieldLabel%%” (`type=\"date\"`) and “%%categoryFieldLabel%%” (a `<select>`), and for a submit button. A label names a field when the `for` of the `<label>` matches the field's `id`."
  - when: { test: "every expense is a card with its label, amount, date, category and named buttons" }
    message:
      uk: "Ця перевірка шукає в `#expenses` шість карток з `data-id` від `e-01` до `e-06`: у кожній назва, сума з двома цифрами копійок і «%%currency%%», дата, категорія словом і кнопки «%%editLabel%%» та «%%deleteLabel%%», у доступних назвах яких є назва витрати. Картки з’являються, коли `render()` виконується під час завантаження."
      en: "This check looks in `#expenses` for six cards with `data-id` from `e-01` to `e-06`: each with the label, the amount with two digits of kopiykas and “%%currency%%”, the date, the category as a word, and the buttons “%%editLabel%%” and “%%deleteLabel%%” whose accessible names hold the expense's label. The cards appear when `render()` runs while the page loads."
  - when: { test: "an invalid draft shows messages next to its fields and adds nothing" }
    message:
      uk: "Ця перевірка вводить порожню назву, суму `0` й обирає «%%chooseCategory%%», надсилає форму й чекає, що надсилання скасовано (`preventDefault`), карток не додалося, а в елементах, які поля називають в `aria-describedby`, з’явилися «%%labelRequiredMessage%%», «%%invalidMessage%%» і «%%requiredMessage%%»."
      en: "This check enters an empty label and the amount `0`, picks “%%chooseCategory%%”, submits the form and expects the submit to be prevented (`preventDefault`), no card to be added, and “%%labelRequiredMessage%%”, “%%invalidMessage%%” and “%%requiredMessage%%” to appear in the elements the fields name in `aria-describedby`."
  - when: { test: "a valid draft adds a card, clears the form and the messages and updates the totals" }
    message:
      uk: "Ця перевірка вводить «%%newName%%», суму `19.99`, дату й категорію `transport`, надсилає форму й чекає одну нову картку із сумою `19%%decimalMark%%99`, порожнє поле назви, зниклі повідомлення та підсумок, де після «%%totalLabel%%» стоїть `2175%%decimalMark%%89`. Якщо картки немає, а біля суми повідомлення, то `19.99 * 100` не заокруглено до цілого."
      en: "This check enters “%%newName%%”, the amount `19.99`, a date and the category `transport`, submits the form and expects one new card with the amount `19%%decimalMark%%99`, an empty label field, no old messages and a summary with `2175%%decimalMark%%89` after “%%totalLabel%%”. If there is no card and a message stands next to the amount, `19.99 * 100` was not rounded to a whole number."
  - when: { test: "a label with markup stays text" }
    message:
      uk: "Ця перевірка додає витрату з назвою `<b>Bold</b>` і чекає картку, що показує цю назву буквально, без елемента `<b>`, і суму `5%%decimalMark%%00`."
      en: "This check adds an expense labeled `<b>Bold</b>` and expects a card showing this label literally, without a `<b>` element, and the amount `5%%decimalMark%%00`."
  - when: { test: "Edit fills the form and saving changes only that expense" }
    message:
      uk: "Ця перевірка натискає «%%editLabel%%» у картці `e-02` і чекає в полях її назву, суму `520` (у гривнях), дату `2026-03-01` і категорію `transport`; потім вводить `530.50`, обирає `food` і зберігає: картка `e-02` показує `530%%decimalMark%%50` і «%%categoryFood%%», карток не побільшало, інші не змінилися. Якщо з’явилася друга картка з тією самою назвою, збереження додало нову витрату замість зміни."
      en: "This check presses “%%editLabel%%” on the card `e-02` and expects its label, the amount `520` (in hryvnias), the date `2026-03-01` and the category `transport` in the fields; then it enters `530.50`, picks `food` and saves: the card `e-02` shows `530%%decimalMark%%50` and “%%categoryFood%%”, there are no more cards than before, and the others did not change. If a second card with the same label appeared, saving added a new expense instead of changing it."
  - when: { test: "Delete asks for confirmation and Cancel keeps the expense" }
    message:
      uk: "Ця перевірка натискає «%%deleteLabel%%» у картці `e-03` і чекає, що картка лишилася й показує кнопку «%%confirmDeleteLabel%%»; після «%%cancelLabel%%» картка на місці, а кнопок підтвердження немає."
      en: "This check presses “%%deleteLabel%%” on the card `e-03` and expects the card to stay and show a “%%confirmDeleteLabel%%” button; after “%%cancelLabel%%” the card is still there and the confirmation buttons are gone."
  - when: { test: "confirming the delete removes only that expense" }
    message:
      uk: "Ця перевірка натискає «%%deleteLabel%%», а потім «%%confirmDeleteLabel%%» у картці `e-03` і чекає, що зникла лише вона. Якщо кнопки нових карток не реагують, обробник висить на кнопках, які `render()` уже замінив, а не на списку `#expenses`."
      en: "This check presses “%%deleteLabel%%” and then “%%confirmDeleteLabel%%” on the card `e-03` and expects only that card to be gone. If the buttons of new cards do not react, the handler hangs on buttons `render()` already replaced instead of on the list `#expenses`."
  - when: { test: "expenses stays the starting list" }
    message:
      uk: "Ця перевірка чекає, що `expenses` на верхньому рівні `app.js` після всіх дій на сторінці — ті самі шість витрат із тими самими полями: поточний список живе в окремій змінній, а кожна дія дає новий масив."
      en: "This check expects `expenses` at the top level of `app.js` to be the same six expenses with the same fields after all actions on the page: the current list lives in a separate variable, and every action gives a new array."
