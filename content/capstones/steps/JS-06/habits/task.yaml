# Habit tracker variant of step JS-06. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  formTitle: { uk: "Додати чи змінити звичку", en: "Add or change a habit" }
  listTitle: { uk: "Усі звички", en: "All habits" }
  activeFieldLabel: { uk: "Активна", en: "Active" }
  completionsLabel: { uk: "Виконань", en: "Completions" }
  saveLabel: { uk: "Зберегти", en: "Save" }
  editLabel: { uk: "Редагувати", en: "Edit" }
  deleteLabel: { uk: "Видалити", en: "Delete" }
  confirmQuestion: { uk: "Видалити цю звичку?", en: "Delete this habit?" }
  confirmDeleteLabel: { uk: "Так, видалити", en: "Yes, delete" }
  cancelLabel: { uk: "Скасувати", en: "Cancel" }
instructions:
  uk: |
    Тепер сторінка стає застосунком: звички — картки, а форма додає й змінює їх. Функції з попередніх кроків лишаються; змінюється лише те, що робить сторінка.

    **Дані.** `habits` — початкові шість звичок — більше ніколи не змінюється. Поточний список тримай в окремій змінній `let` (наприклад, `current`); кожна дія дає новий список через `addHabit`, `updateHabit` чи `removeHabit` і заново малює сторінку. `addHabit` тепер бере з чернетки ще й `active` (якщо його немає — `true`). Зміна звички зберігає її дати виконань.

    **Розмітка.** Прибери з `<main>` абзаци з попередніх кроків, крім підсумку `summary`, — їх замінюють форма й список:

    - форма з атрибутом `novalidate` і полями з підписами «%%nameLabel%%» (текст), «%%valueLabel%%» (список `<select>` з пунктами «%%daily%%» і «%%weekly%%» та значеннями `daily` і `weekly`) і «%%activeFieldLabel%%» (прапорець, спершу позначений), а також кнопка надсилання «%%saveLabel%%»; біля поля назви — елемент для повідомлення, пов’язаний із полем через `aria-describedby`;
    - під формою — абзац підсумку, заголовок списку «%%listTitle%%» з `tabindex="-1"` і порожній список `<ul id="habits">`.

    **Картки.** Функція `render()` будує з поточного списку по картці `<li data-id="…">` на кожну звичку: назва, частота словом, «%%completionsLabel%%» з кількістю дат виконань, позначка «%%pausedMark%%» (якщо звичка на паузі) і дві кнопки «%%editLabel%%» та «%%deleteLabel%%». У доступній назві кожної кнопки є й назва звички, наприклад «%%editLabel%%: %%fixture1Name%%». Усі значення потрапляють у картку як текст. Той самий `render()` оновлює підсумок — частки виконаних днів активних звичок.

    **Форма.** Надсилання (кнопкою чи Enter) не перезавантажує сторінку. Чернетку з полів перевіряє `validateHabit`:

    - є помилки — нічого не додається, біля поля назви з’являється текст із `messageFor`, фокус переходить на це поле;
    - помилок немає — повідомлення зникає, звичка додається (або зберігається зміна), форма очищається, фокус — у поле назви.

    **Кнопки карток.** Один обробник `click` на `#habits` обслуговує кнопки всіх карток, також доданих пізніше.

    - «%%editLabel%%» заповнює форму цією звичкою і ставить фокус у поле назви; наступне збереження змінює саме її.
    - «%%deleteLabel%%» не видаляє одразу: картка показує питання «%%confirmQuestion%%» і кнопки «%%confirmDeleteLabel%%» та «%%cancelLabel%%» (теж із назвою звички), фокус — на «%%cancelLabel%%». Вбудований `confirm()` у перегляді недоступний, тож підтвердження будується на сторінці.
    - «%%cancelLabel%%» повертає картку як була, фокус — на її «%%deleteLabel%%».
    - «%%confirmDeleteLabel%%» видаляє звичку; фокус — на «%%deleteLabel%%» наступної картки, якщо її немає — попередньої, якщо список порожній — на заголовок списку.

    **Як перевірятиметься:** платформа, як людина, по черзі надсилає хибні чернетки (порожня назва, назва з 81 символу), додає «%%newName%%» із частотою `weekly` і звичку з назвою `<b>Bold</b>` без позначки «%%activeFieldLabel%%», редагує «%%fixture2Name%%», скасовує й підтверджує видалення «%%fixture3Name%%» — і після кожного кроку дивиться на картки, поля, повідомлення й підсумок. Наприкінці `habits` має лишитися тими самими шістьма звичками. Фокус платформа не перевіряє: пройди всі дії самою клавіатурою (Tab, Enter, пробіл) і переконайся, що він щоразу там, де описано.
  en: |
    Now the page becomes an app: the habits are cards, and a form adds and changes them. The functions of the earlier steps stay; only what the page does changes.

    **Data.** `habits` — the six starting habits — never changes again. Keep the current list in a separate `let` variable (for example `current`); every action makes a new list with `addHabit`, `updateHabit` or `removeHabit` and draws the page again. `addHabit` now also takes `active` from the draft (`true` when it is missing). Changing a habit keeps its completion dates.

    **Markup.** Remove the paragraphs of the earlier steps from `<main>`, except the summary `summary` — the form and the list replace them:

    - a form with the `novalidate` attribute and fields labeled “%%nameLabel%%” (text), “%%valueLabel%%” (a `<select>` with the options “%%daily%%” and “%%weekly%%” and the values `daily` and `weekly`) and “%%activeFieldLabel%%” (a checkbox, ticked at first), and a submit button “%%saveLabel%%”; next to the name field, an element for a message, tied to the field with `aria-describedby`;
    - below the form, the summary paragraph, the list heading “%%listTitle%%” with `tabindex="-1"` and an empty list `<ul id="habits">`.

    **Cards.** A `render()` function builds a card `<li data-id="…">` from the current list for every habit: the name, the frequency as a word, “%%completionsLabel%%” with the number of completion dates, the mark “%%pausedMark%%” (if the habit is paused) and two buttons “%%editLabel%%” and “%%deleteLabel%%”. The accessible name of every button also holds the habit's name, for example “%%editLabel%%: %%fixture1Name%%”. Every value goes into the card as text. The same `render()` updates the summary — the shares of completed days of the active habits.

    **Form.** Submitting (with the button or Enter) does not reload the page. `validateHabit` checks the draft from the fields:

    - there are errors — nothing is added, the text from `messageFor` appears next to the name field, focus moves to that field;
    - there are none — the message disappears, the habit is added (or the change saved), the form is cleared, focus goes to the name field.

    **Card buttons.** One `click` handler on `#habits` serves the buttons of all cards, also of the ones added later.

    - “%%editLabel%%” fills the form with this habit and puts focus into the name field; the next save changes exactly this habit.
    - “%%deleteLabel%%” does not delete at once: the card shows the question “%%confirmQuestion%%” and the buttons “%%confirmDeleteLabel%%” and “%%cancelLabel%%” (also with the habit's name), focus goes to “%%cancelLabel%%”. The built-in `confirm()` is not available in the preview, so the confirmation is built on the page.
    - “%%cancelLabel%%” restores the card, focus goes to its “%%deleteLabel%%”.
    - “%%confirmDeleteLabel%%” deletes the habit; focus goes to “%%deleteLabel%%” of the next card, if there is none — of the previous one, if the list is empty — to the list heading.

    **How it is checked:** like a person, the platform submits invalid drafts (an empty name, a name of 81 characters), adds “%%newName%%” with the frequency `weekly` and a habit named `<b>Bold</b>` without the “%%activeFieldLabel%%” tick, edits “%%fixture2Name%%”, cancels and then confirms deleting “%%fixture3Name%%” — and after every step it looks at the cards, the fields, the messages and the summary. At the end `habits` must still be the same six habits. The platform does not check focus: go through all actions with the keyboard only (Tab, Enter, Space) and make sure it is where described every time.
nudge:
  uk: "Згадай урок про рендеринг списку: одна функція будує елемент для одного запису, а `replaceChildren` ставить нові елементи замість старих. У делегованому обробнику `event.target.closest(\"button\")` знаходить кнопку, навіть якщо клацнули по тексту всередині неї, а `closest(\"[data-id]\")` від кнопки — її картку. Стан «яка звичка зараз редагується» чи «чиє видалення чекає підтвердження» зручно тримати в змінних `let` і читати в `render()`."
  en: "Recall the lesson on rendering a list: one function builds the element for one record, and `replaceChildren` puts the new elements in place of the old ones. In a delegated handler, `event.target.closest(\"button\")` finds the button even when the click landed on text inside it, and `closest(\"[data-id]\")` from the button finds its card. State such as “which habit is being edited” or “whose delete waits for confirmation” is handy to keep in `let` variables and read in `render()`."
testTitles:
  "the script runs without errors":
    uk: "Скрипт працює без помилок"
    en: "The script runs without errors"
  "the form has labeled fields and a submit button":
    uk: "Форма має підписані поля «%%nameLabel%%», «%%valueLabel%%» (список), «%%activeFieldLabel%%» і кнопку надсилання"
    en: "The form has the labeled fields “%%nameLabel%%”, “%%valueLabel%%” (a select), “%%activeFieldLabel%%” and a submit button"
  "every habit is a card with its name, frequency, state, completions and named buttons":
    uk: "Кожна звичка — картка з назвою, частотою, станом, кількістю виконань і кнопками, що називають звичку"
    en: "Every habit is a card with its name, frequency, state, completions count and buttons that name the habit"
  "an invalid draft shows messages next to its fields and adds nothing":
    uk: "Хибна чернетка показує повідомлення біля поля й нічого не додає"
    en: "An invalid draft shows a message next to its field and adds nothing"
  "a valid draft adds a card, clears the form and the messages and updates the summary":
    uk: "Правильна чернетка додає картку, очищає форму й повідомлення та оновлює підсумок"
    en: "A valid draft adds a card, clears the form and the messages and updates the summary"
  "an inactive habit shows the paused mark, and a name with markup stays text":
    uk: "Звичка без позначки «%%activeFieldLabel%%» показує «%%pausedMark%%», а назва з розміткою лишається текстом"
    en: "A habit without the “%%activeFieldLabel%%” tick shows “%%pausedMark%%”, and a name with markup stays text"
  "Edit fills the form and saving changes only that habit":
    uk: "«%%editLabel%%» заповнює форму, а збереження змінює лише цю звичку й зберігає її дати"
    en: "“%%editLabel%%” fills the form, and saving changes only that habit and keeps its dates"
  "Delete asks for confirmation and Cancel keeps the habit":
    uk: "«%%deleteLabel%%» просить підтвердження, а «%%cancelLabel%%» лишає звичку"
    en: "“%%deleteLabel%%” asks for confirmation, and “%%cancelLabel%%” keeps the habit"
  "confirming the delete removes only that habit":
    uk: "«%%confirmDeleteLabel%%» прибирає лише цю звичку"
    en: "“%%confirmDeleteLabel%%” removes only that habit"
  "habits stays the starting list":
    uk: "`habits` після всіх дій лишається тими самими шістьма звичками"
    en: "`habits` is still the same six habits after all actions"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що скрипт виконається до кінця без помилки; інакше не працюють сторінка й решта перевірок. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там `TypeError` про `null` (наприклад, `reading 'addEventListener'`), то `document.querySelector` не знайшов елемент: селектор має збігатися з `id` в `index.html`."
      en: "This check expects the script to run to the end without an error; otherwise the page and the other checks do not work. The “Console” tab shows the error name and the line of code. If it shows a `TypeError` about `null` (for example `reading 'addEventListener'`), `document.querySelector` found no element: the selector must match an `id` in `index.html`."
  - when: { test: "the form has labeled fields and a submit button" }
    message:
      uk: "Ця перевірка шукає в `<form>` поля, доступна назва яких містить «%%nameLabel%%», «%%valueLabel%%» (`<select>`) і «%%activeFieldLabel%%» (прапорець), та кнопку надсилання. Підпис дає полю назву, коли `for` у `<label>` збігається з `id` поля."
      en: "This check looks in the `<form>` for fields whose accessible name holds “%%nameLabel%%”, “%%valueLabel%%” (a `<select>`) and “%%activeFieldLabel%%” (a checkbox), and for a submit button. A label names a field when the `for` of the `<label>` matches the field's `id`."
  - when: { test: "every habit is a card with its name, frequency, state, completions and named buttons" }
    message:
      uk: "Ця перевірка шукає в `#habits` шість карток з `data-id` від `h-01` до `h-06`: у кожній назва, частота словом, «%%completionsLabel%%» з кількістю дат, позначка «%%pausedMark%%» лише в звичок на паузі і кнопки «%%editLabel%%» та «%%deleteLabel%%», у доступних назвах яких є назва звички. Картки з’являються, коли `render()` виконується під час завантаження."
      en: "This check looks in `#habits` for six cards with `data-id` from `h-01` to `h-06`: each with the name, the frequency as a word, “%%completionsLabel%%” with the number of dates, the mark “%%pausedMark%%” only on paused habits, and the buttons “%%editLabel%%” and “%%deleteLabel%%” whose accessible names hold the habit's name. The cards appear when `render()` runs while the page loads."
  - when: { test: "an invalid draft shows messages next to its fields and adds nothing" }
    message:
      uk: "Ця перевірка надсилає форму з порожньою назвою, а потім із назвою з 81 символу, і чекає, що надсилання скасовано (`preventDefault`), карток не додалося, а в елементі, який поле назви називає в `aria-describedby`, з’являються «%%requiredMessage%%», а потім «%%tooLongMessage%%»."
      en: "This check submits the form with an empty name and then with a name of 81 characters, and expects the submit to be prevented (`preventDefault`), no card to be added, and “%%requiredMessage%%” and then “%%tooLongMessage%%” to appear in the element the name field names in `aria-describedby`."
  - when: { test: "a valid draft adds a card, clears the form and the messages and updates the summary" }
    message:
      uk: "Ця перевірка вводить «%%newName%%» і частоту `weekly`, надсилає форму й чекає одну нову активну картку з «%%weekly%%» і «%%completionsLabel%%» `0`, порожнє поле назви, зникле повідомлення й назву «%%newName%%» у підсумку поза списком."
      en: "This check enters “%%newName%%” and the frequency `weekly`, submits the form and expects one new active card with “%%weekly%%” and “%%completionsLabel%%” `0`, an empty name field, no old message, and the name “%%newName%%” in the summary outside the list."
  - when: { test: "an inactive habit shows the paused mark, and a name with markup stays text" }
    message:
      uk: "Ця перевірка додає звичку з назвою `<b>Bold</b>` і знятою позначкою «%%activeFieldLabel%%» й чекає картку, що показує цю назву буквально, без елемента `<b>`, і «%%pausedMark%%»."
      en: "This check adds a habit named `<b>Bold</b>` with the “%%activeFieldLabel%%” tick removed and expects a card showing this name literally, without a `<b>` element, and “%%pausedMark%%”."
  - when: { test: "Edit fills the form and saving changes only that habit" }
    message:
      uk: "Ця перевірка натискає «%%editLabel%%» у картці `h-02` і чекає в полях її назву й частоту `daily`; потім обирає `weekly`, знімає позначку «%%activeFieldLabel%%» і зберігає: картка `h-02` показує «%%weekly%%», «%%pausedMark%%» і досі «%%completionsLabel%%» `3`, карток не побільшало, інші не змінилися. Якщо з’явилася друга картка з тією самою назвою, збереження додало нову звичку замість зміни."
      en: "This check presses “%%editLabel%%” on the card `h-02` and expects its name and the frequency `daily` in the fields; then it picks `weekly`, removes the “%%activeFieldLabel%%” tick and saves: the card `h-02` shows “%%weekly%%”, “%%pausedMark%%” and still “%%completionsLabel%%” `3`, there are no more cards than before, and the others did not change. If a second card with the same name appeared, saving added a new habit instead of changing it."
  - when: { test: "Delete asks for confirmation and Cancel keeps the habit" }
    message:
      uk: "Ця перевірка натискає «%%deleteLabel%%» у картці `h-03` і чекає, що картка лишилася й показує кнопку «%%confirmDeleteLabel%%»; після «%%cancelLabel%%» картка на місці, а кнопок підтвердження немає."
      en: "This check presses “%%deleteLabel%%” on the card `h-03` and expects the card to stay and show a “%%confirmDeleteLabel%%” button; after “%%cancelLabel%%” the card is still there and the confirmation buttons are gone."
  - when: { test: "confirming the delete removes only that habit" }
    message:
      uk: "Ця перевірка натискає «%%deleteLabel%%», а потім «%%confirmDeleteLabel%%» у картці `h-03` і чекає, що зникла лише вона. Якщо кнопки нових карток не реагують, обробник висить на кнопках, які `render()` уже замінив, а не на списку `#habits`."
      en: "This check presses “%%deleteLabel%%” and then “%%confirmDeleteLabel%%” on the card `h-03` and expects only that card to be gone. If the buttons of new cards do not react, the handler hangs on buttons `render()` already replaced instead of on the list `#habits`."
  - when: { test: "habits stays the starting list" }
    message:
      uk: "Ця перевірка чекає, що `habits` на верхньому рівні `app.js` після всіх дій на сторінці — ті самі шість звичок із тими самими полями й датами: поточний список живе в окремій змінній, а кожна дія дає новий масив."
      en: "This check expects `habits` at the top level of `app.js` to be the same six habits with the same fields and dates after all actions on the page: the current list lives in a separate variable, and every action gives a new array."
