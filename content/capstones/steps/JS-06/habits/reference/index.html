<!doctype html>
<html lang="%%htmlLang%%">
<head>
  <meta charset="utf-8">
  <title>%%projectTitle%%</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>%%projectTitle%%</h1>
    <p class="pitch">%%pitch%%</p>
    <img src="images/habit.svg" alt="%%imageAlt%%">

    <form id="habit-form" novalidate>
      <h2>%%formTitle%%</h2>
      <div class="field">
        <label for="habit-name">%%nameLabel%%</label>
        <input id="habit-name" name="name" aria-describedby="habit-name-error">
        <p id="habit-name-error" class="error"></p>
      </div>
      <div class="field">
        <label for="habit-frequency">%%valueLabel%%</label>
        <select id="habit-frequency" name="frequency">
          <option value="daily" selected>%%daily%%</option>
          <option value="weekly">%%weekly%%</option>
        </select>
      </div>
      <div class="field field-check">
        <input id="habit-active" name="active" type="checkbox" checked>
        <label for="habit-active">%%activeFieldLabel%%</label>
      </div>
      <button type="submit">%%saveLabel%%</button>
    </form>

    <p id="summary"></p>
    <h2 id="list-title" tabindex="-1">%%listTitle%%</h2>
    <ul id="habits" class="cards"></ul>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
