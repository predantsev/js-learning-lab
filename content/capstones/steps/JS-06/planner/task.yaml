# Planner variant of step JS-06. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  formTitle: { uk: "Додати чи змінити справу", en: "Add or change a task" }
  listTitle: { uk: "Усі справи", en: "All tasks" }
  priorityFieldLabel: { uk: "Пріоритет", en: "Priority" }
  doneFieldLabel: { uk: "Виконано", en: "Done" }
  doneMark: { uk: "виконано", en: "done" }
  saveLabel: { uk: "Зберегти", en: "Save" }
  editLabel: { uk: "Редагувати", en: "Edit" }
  deleteLabel: { uk: "Видалити", en: "Delete" }
  confirmQuestion: { uk: "Видалити цю справу?", en: "Delete this task?" }
  confirmDeleteLabel: { uk: "Так, видалити", en: "Yes, delete" }
  cancelLabel: { uk: "Скасувати", en: "Cancel" }
instructions:
  uk: |
    Тепер сторінка стає застосунком: справи — картки, а форма додає й змінює їх. Функції з попередніх кроків лишаються; змінюється лише те, що робить сторінка.

    **Дані.** `tasks` — початкові шість справ — більше ніколи не змінюється. Поточний список тримай в окремій змінній `let` (наприклад, `current`); кожна дія дає новий список через `addTask`, `updateTask` чи `removeTask` і заново малює сторінку. `addTask` тепер бере із чернетки ще й `done`.

    **Розмітка.** Прибери з `<main>` абзаци з попередніх кроків, крім підсумку `summary`, — їх замінюють форма й список:

    - форма з атрибутом `novalidate` і полями з підписами «%%nameLabel%%» (текст), «%%valueLabel%%» (поле дати `type="date"`), «%%priorityFieldLabel%%» (список `<select>` з пунктами «%%priorityLow%%», «%%priorityNormal%%», «%%priorityHigh%%» і значеннями `low`, `normal`, `high`) і «%%doneFieldLabel%%» (прапорець), а також кнопка надсилання «%%saveLabel%%»; біля поля назви — елемент для повідомлення, пов’язаний із полем через `aria-describedby`;
    - під формою — абзац підсумку, заголовок списку «%%listTitle%%» з `tabindex="-1"` і порожній список `<ul id="tasks">`.

    **Картки.** Функція `render()` будує з поточного списку по картці `<li data-id="…">` на кожну справу: назва, термін або «%%noDueDate%%», пріоритет словом, позначка «%%doneMark%%» (якщо виконана) і дві кнопки «%%editLabel%%» та «%%deleteLabel%%». У доступній назві кожної кнопки є й назва справи, наприклад «%%editLabel%%: %%fixture1Name%%». Усі значення потрапляють у картку як текст. Той самий `render()` оновлює підсумок через `countDueTasks`.

    **Форма.** Надсилання (кнопкою чи Enter) не перезавантажує сторінку. Чернетка з полів: порожнє поле дати — `null`. Її перевіряє `validateTask`:

    - є помилки — нічого не додається, біля поля назви з’являється текст із `messageFor`, фокус переходить на це поле;
    - помилок немає — повідомлення зникає, справа додається (або зберігається зміна), форма очищається, фокус — у поле назви.

    **Кнопки карток.** Один обробник `click` на `#tasks` обслуговує кнопки всіх карток, також доданих пізніше.

    - «%%editLabel%%» заповнює форму цією справою і ставить фокус у поле назви; наступне збереження змінює саме її.
    - «%%deleteLabel%%» не видаляє одразу: картка показує питання «%%confirmQuestion%%» і кнопки «%%confirmDeleteLabel%%» та «%%cancelLabel%%» (теж із назвою справи), фокус — на «%%cancelLabel%%». Вбудований `confirm()` у перегляді недоступний, тож підтвердження будується на сторінці.
    - «%%cancelLabel%%» повертає картку як була, фокус — на її «%%deleteLabel%%».
    - «%%confirmDeleteLabel%%» видаляє справу; фокус — на «%%deleteLabel%%» наступної картки, якщо її немає — попередньої, якщо список порожній — на заголовок списку.

    **Як перевірятиметься:** платформа, як людина, по черзі надсилає хибні чернетки (порожня назва, назва з 81 символу), додає «%%newName%%» з терміном `2026-03-01` і пріоритетом `high` , справу з назвою `<b>Bold</b>` без терміну та справу з позначеним прапорцем «%%doneFieldLabel%%», редагує «%%fixture2Name%%», скасовує й підтверджує видалення «%%fixture3Name%%» — і після кожного кроку дивиться на картки, поля, повідомлення й підсумок. Наприкінці `tasks` має лишитися тими самими шістьма справами. Фокус платформа не перевіряє: пройди всі дії самою клавіатурою (Tab, Enter, пробіл) і переконайся, що він щоразу там, де описано.
  en: |
    Now the page becomes an app: the tasks are cards, and a form adds and changes them. The functions of the earlier steps stay; only what the page does changes.

    **Data.** `tasks` — the six starting tasks — never changes again. Keep the current list in a separate `let` variable (for example `current`); every action makes a new list with `addTask`, `updateTask` or `removeTask` and draws the page again. `addTask` now also takes `done` from the draft.

    **Markup.** Remove the paragraphs of the earlier steps from `<main>`, except the summary `summary` — the form and the list replace them:

    - a form with the `novalidate` attribute and fields labeled “%%nameLabel%%” (text), “%%valueLabel%%” (a date field `type="date"`), “%%priorityFieldLabel%%” (a `<select>` with the options “%%priorityLow%%”, “%%priorityNormal%%”, “%%priorityHigh%%” and the values `low`, `normal`, `high`) and “%%doneFieldLabel%%” (a checkbox), and a submit button “%%saveLabel%%”; next to the title field, an element for a message, tied to the field with `aria-describedby`;
    - below the form, the summary paragraph, the list heading “%%listTitle%%” with `tabindex="-1"` and an empty list `<ul id="tasks">`.

    **Cards.** A `render()` function builds a card `<li data-id="…">` from the current list for every task: the title, the due date or “%%noDueDate%%”, the priority as a word, the mark “%%doneMark%%” (if done) and two buttons “%%editLabel%%” and “%%deleteLabel%%”. The accessible name of every button also holds the task's title, for example “%%editLabel%%: %%fixture1Name%%”. Every value goes into the card as text. The same `render()` updates the summary with `countDueTasks`.

    **Form.** Submitting (with the button or Enter) does not reload the page. The draft from the fields: an empty date field is `null`. `validateTask` checks it:

    - there are errors — nothing is added, the text from `messageFor` appears next to the title field, focus moves to that field;
    - there are none — the message disappears, the task is added (or the change saved), the form is cleared, focus goes to the title field.

    **Card buttons.** One `click` handler on `#tasks` serves the buttons of all cards, also of the ones added later.

    - “%%editLabel%%” fills the form with this task and puts focus into the title field; the next save changes exactly this task.
    - “%%deleteLabel%%” does not delete at once: the card shows the question “%%confirmQuestion%%” and the buttons “%%confirmDeleteLabel%%” and “%%cancelLabel%%” (also with the task's title), focus goes to “%%cancelLabel%%”. The built-in `confirm()` is not available in the preview, so the confirmation is built on the page.
    - “%%cancelLabel%%” restores the card, focus goes to its “%%deleteLabel%%”.
    - “%%confirmDeleteLabel%%” deletes the task; focus goes to “%%deleteLabel%%” of the next card, if there is none — of the previous one, if the list is empty — to the list heading.

    **How it is checked:** like a person, the platform submits invalid drafts (an empty title, a title of 81 characters), adds “%%newName%%” due `2026-03-01` with the priority `high` , a task titled `<b>Bold</b>` without a due date and a task with the “%%doneFieldLabel%%” box ticked, edits “%%fixture2Name%%”, cancels and then confirms deleting “%%fixture3Name%%” — and after every step it looks at the cards, the fields, the messages and the summary. At the end `tasks` must still be the same six tasks. The platform does not check focus: go through all actions with the keyboard only (Tab, Enter, Space) and make sure it is where described every time.
nudge:
  uk: "Згадай урок про рендеринг списку: одна функція будує елемент для одного запису, а `replaceChildren` ставить нові елементи замість старих. У делегованому обробнику `event.target.closest(\"button\")` знаходить кнопку, навіть якщо клацнули по тексту всередині неї, а `closest(\"[data-id]\")` від кнопки — її картку. Стан «яка справа зараз редагується» чи «чиє видалення чекає підтвердження» зручно тримати в змінних `let` і читати в `render()`."
  en: "Recall the lesson on rendering a list: one function builds the element for one record, and `replaceChildren` puts the new elements in place of the old ones. In a delegated handler, `event.target.closest(\"button\")` finds the button even when the click landed on text inside it, and `closest(\"[data-id]\")` from the button finds its card. State such as “which task is being edited” or “whose delete waits for confirmation” is handy to keep in `let` variables and read in `render()`."
testTitles:
  "the script runs without errors":
    uk: "Код у `app.js` працює без помилок"
    en: "The script runs without errors"
  "the form has labeled fields and a submit button":
    uk: "Форма має підписані поля «%%nameLabel%%», «%%valueLabel%%» (дата), «%%priorityFieldLabel%%» (список), «%%doneFieldLabel%%» і кнопку надсилання"
    en: "The form has the labeled fields “%%nameLabel%%”, “%%valueLabel%%” (a date), “%%priorityFieldLabel%%” (a select), “%%doneFieldLabel%%” and a submit button"
  "every task is a card with its title, due date, priority, state and named buttons":
    uk: "Кожна справа — картка з назвою, терміном, пріоритетом, станом і кнопками, що називають справу"
    en: "Every task is a card with its title, due date, priority, state and buttons that name the task"
  "an invalid draft shows messages next to its fields and adds nothing":
    uk: "Хибна чернетка показує повідомлення біля поля й нічого не додає"
    en: "An invalid draft shows a message next to its field and adds nothing"
  "a valid draft adds a card, clears the form and the messages and updates the summary":
    uk: "Правильна чернетка додає картку, очищає форму й повідомлення та оновлює підсумок"
    en: "A valid draft adds a card, clears the form and the messages and updates the summary"
  "a task without a due date shows the no-due-date text, and a title with markup stays text":
    uk: "Справа без терміну показує «%%noDueDate%%», а назва з розміткою лишається текстом"
    en: "A task without a due date shows “%%noDueDate%%”, and a title with markup stays text"
  "a new task keeps the done box":
    uk: "Нова справа зберігає позначку «%%doneFieldLabel%%» з форми"
    en: "A new task keeps the “%%doneFieldLabel%%” box from the form"
  "Edit fills the form and saving changes only that task":
    uk: "«%%editLabel%%» заповнює форму, а збереження змінює лише цю справу"
    en: "“%%editLabel%%” fills the form, and saving changes only that task"
  "Delete asks for confirmation and Cancel keeps the task":
    uk: "«%%deleteLabel%%» просить підтвердження, а «%%cancelLabel%%» лишає справу"
    en: "“%%deleteLabel%%” asks for confirmation, and “%%cancelLabel%%” keeps the task"
  "confirming the delete removes only that task":
    uk: "«%%confirmDeleteLabel%%» прибирає лише цю справу"
    en: "“%%confirmDeleteLabel%%” removes only that task"
  "tasks stays the starting list":
    uk: "`tasks` після всіх дій лишається тими самими шістьма справами"
    en: "`tasks` is still the same six tasks after all actions"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки; інакше не працюють сторінка й решта перевірок. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там `TypeError` про `null` (наприклад, `reading 'addEventListener'`), то `document.querySelector` не знайшов елемент: селектор має збігатися з `id` в `index.html`."
      en: "This check expects the script to run to the end without an error; otherwise the page and the other checks do not work. The “Console” tab shows the error name and the line of code. If it shows a `TypeError` about `null` (for example `reading 'addEventListener'`), `document.querySelector` found no element: the selector must match an `id` in `index.html`."
  - when: { test: "the form has labeled fields and a submit button" }
    message:
      uk: "Ця перевірка шукає в `<form>` поля, доступна назва яких містить «%%nameLabel%%», «%%valueLabel%%» (`type=\"date\"`), «%%priorityFieldLabel%%» (`<select>`) і «%%doneFieldLabel%%» (прапорець), та кнопку надсилання. Підпис дає полю назву, коли `for` у `<label>` збігається з `id` поля."
      en: "This check looks in the `<form>` for fields whose accessible name holds “%%nameLabel%%”, “%%valueLabel%%” (`type=\"date\"`), “%%priorityFieldLabel%%” (a `<select>`) and “%%doneFieldLabel%%” (a checkbox), and for a submit button. A label names a field when the `for` of the `<label>` matches the field's `id`."
  - when: { test: "every task is a card with its title, due date, priority, state and named buttons" }
    message:
      uk: "Ця перевірка шукає в `#tasks` шість карток з `data-id` від `t-01` до `t-06`: у кожній назва, термін чи «%%noDueDate%%», пріоритет словом, позначка «%%doneMark%%» лише у виконаних і кнопки «%%editLabel%%» та «%%deleteLabel%%», у доступних назвах яких є назва справи. Картки з’являються, коли `render()` виконується під час завантаження."
      en: "This check looks in `#tasks` for six cards with `data-id` from `t-01` to `t-06`: each with the title, the due date or “%%noDueDate%%”, the priority as a word, the mark “%%doneMark%%” only on done tasks, and the buttons “%%editLabel%%” and “%%deleteLabel%%” whose accessible names hold the task's title. The cards appear when `render()` runs while the page loads."
  - when: { test: "an invalid draft shows messages next to its fields and adds nothing" }
    message:
      uk: "Ця перевірка надсилає форму з порожньою назвою, а потім із назвою з 81 символу, і чекає, що надсилання скасовано (`preventDefault`), карток не додалося, а в елементі, який поле назви називає в `aria-describedby`, з’являються «%%requiredMessage%%», а потім «%%tooLongMessage%%»."
      en: "This check submits the form with an empty title and then with a title of 81 characters, and expects the submit to be prevented (`preventDefault`), no card to be added, and “%%requiredMessage%%” and then “%%tooLongMessage%%” to appear in the element the title field names in `aria-describedby`."
  - when: { test: "a valid draft adds a card, clears the form and the messages and updates the summary" }
    message:
      uk: "Ця перевірка вводить «%%newName%%», термін `2026-03-01` і пріоритет `high`, надсилає форму й чекає одну нову картку із цими значеннями, порожнє поле назви, зникле повідомлення та підсумок «%%dueSummary%% 2026-03-02» із числом `3`."
      en: "This check enters “%%newName%%”, the due date `2026-03-01` and the priority `high`, submits the form and expects one new card with these values, an empty title field, no old message and the summary “%%dueSummary%% 2026-03-02” with the number `3`."
  - when: { test: "a new task keeps the done box" }
    message:
      uk: "Ця перевірка додає справу «Sort the mail» з позначеним прапорцем «%%doneFieldLabel%%» і чекає її картку з позначкою «%%doneMark%%». Значення потрапляє в новий запис, коли `addTask` бере `done` із чернетки."
      en: "This check adds the task “Sort the mail” with the “%%doneFieldLabel%%” box ticked and expects its card with the mark “%%doneMark%%”. The value reaches the new record when `addTask` takes `done` from the draft."
  - when: { test: "a task without a due date shows the no-due-date text, and a title with markup stays text" }
    message:
      uk: "Ця перевірка додає справу з назвою `<b>Bold</b>` і порожнім полем дати й чекає картку, що показує цю назву буквально, без елемента `<b>`, і «%%noDueDate%%». Порожнє поле дати дає порожній текст `\"\"`, а договір проєкту позначає відсутній термін `null`."
      en: "This check adds a task titled `<b>Bold</b>` with an empty date field and expects a card showing this title literally, without a `<b>` element, and “%%noDueDate%%”. An empty date field gives the empty text `\"\"`, while the project's contract marks a missing due date with `null`."
  - when: { test: "Edit fills the form and saving changes only that task" }
    message:
      uk: "Ця перевірка натискає «%%editLabel%%» у картці `t-02` і чекає в полях її назву й термін `2026-03-01`; потім обирає пріоритет `low`, ставить прапорець «%%doneFieldLabel%%» і зберігає: картка `t-02` показує «%%priorityLow%%» і «%%doneMark%%», карток не побільшало, інші не змінилися. Якщо з’явилася друга картка з тією самою назвою, збереження додало нову справу замість зміни."
      en: "This check presses “%%editLabel%%” on the card `t-02` and expects its title and the due date `2026-03-01` in the fields; then it picks the priority `low`, ticks “%%doneFieldLabel%%” and saves: the card `t-02` shows “%%priorityLow%%” and “%%doneMark%%”, there are no more cards than before, and the others did not change. If a second card with the same title appeared, saving added a new task instead of changing it."
  - when: { test: "Delete asks for confirmation and Cancel keeps the task" }
    message:
      uk: "Ця перевірка натискає «%%deleteLabel%%» у картці `t-03` і чекає, що картка лишилася й показує кнопку «%%confirmDeleteLabel%%»; після «%%cancelLabel%%» картка на місці, а кнопок підтвердження немає."
      en: "This check presses “%%deleteLabel%%” on the card `t-03` and expects the card to stay and show a “%%confirmDeleteLabel%%” button; after “%%cancelLabel%%” the card is still there and the confirmation buttons are gone."
  - when: { test: "confirming the delete removes only that task" }
    message:
      uk: "Ця перевірка натискає «%%deleteLabel%%», а потім «%%confirmDeleteLabel%%» у картці `t-03` і чекає, що зникла лише вона. Якщо кнопки нових карток не реагують, обробник висить на кнопках, які `render()` уже замінив, а не на списку `#tasks`."
      en: "This check presses “%%deleteLabel%%” and then “%%confirmDeleteLabel%%” on the card `t-03` and expects only that card to be gone. If the buttons of new cards do not react, the handler hangs on buttons `render()` already replaced instead of on the list `#tasks`."
  - when: { test: "tasks stays the starting list" }
    message:
      uk: "Ця перевірка чекає, що `tasks` на верхньому рівні `app.js` після всіх дій на сторінці — ті самі шість справ із тими самими полями: поточний список живе в окремій змінній, а кожна дія дає новий масив."
      en: "This check expects `tasks` at the top level of `app.js` to be the same six tasks with the same fields after all actions on the page: the current list lives in a separate variable, and every action gives a new array."
