# Capstone step of unit JS-06 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-06-16-capstone-ui from this file.
unit: JS-06
mode: in-platform
entry: index.html
title:
  uk: "Перший справжній інтерфейс: картки й форма"
  en: "The first real interface: cards and a form"
intro:
  uk: |
    Досі сторінка лише показувала результати обчислень. Тепер вона стає застосунком: записи — це картки, які код в `app.js` будує з даних, а форма з підписаними полями додає й змінює записи. Помилки з функції перевірки з’являються біля своїх полів, а видалення спершу просить підтвердження.

    Усе тримається на одній ідеї: **дані — головні, сторінка — їхнє відображення**. Кнопки й форма не змінюють картки напряму: вони обчислюють новий список чистими функціями з попередніх кроків, а функція `render` заново будує картки із цього списку. Одна обробка подій на списку обслуговує кнопки всіх карток — і тих, що з’являться пізніше. Текст записів потрапляє на сторінку як текст, а не як розмітка.

    Після кожного перемальовування фокус клавіатури має опинитися в зрозумілому місці: людина, яка працює без миші, не повинна шукати, де вона.
  en: |
    So far the page only showed the results of computations. Now it becomes an app: the records are cards the script builds from the data, and a form with labeled fields adds and changes records. Errors from the check function appear next to their fields, and a delete first asks for confirmation.

    Everything rests on one idea: **the data leads, the page displays it**. The buttons and the form do not change the cards directly: they compute a new list with the pure functions of the earlier steps, and a `render` function builds the cards again from that list. One event handler on the list serves the buttons of all cards — including the ones that appear later. The records' text reaches the page as text, not as markup.

    After every re-render the keyboard focus must land in a sensible place: a person working without a mouse should not have to search for it.
purpose:
  uk: "Це крок твого проєкту: DOM, події, форми й фокус із цього розділу ти застосовуєш до власного списку — на основі функцій із попередніх кроків. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply this unit's DOM, events, forms and focus to your own list — on top of the functions of the earlier steps. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Будувати картки записів зі списку даних, виводячи значення як текст, і перебудовувати їх після кожної зміни."
    en: "Build the record cards from the list of data, putting values in as text, and rebuild them after every change."
  - uk: "Додавати й змінювати записи через форму з підписаними полями, показуючи помилки функції перевірки біля відповідних полів."
    en: "Add and change records through a form with labeled fields, showing the check function's errors next to the matching fields."
  - uk: "Обробляти кнопки всіх карток одним делегованим обробником і просити підтвердження перед видаленням."
    en: "Handle the buttons of all cards with one delegated handler and ask for confirmation before a delete."
  - uk: "Після кожної дії переводити фокус клавіатури в зрозуміле місце й не змінювати початковий список даних."
    en: "Move the keyboard focus to a sensible place after every action and never change the starting list of data."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередні кроки не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
