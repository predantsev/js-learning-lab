# Wishlist variant of step JS-06. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  formTitle: { uk: "Додати чи змінити бажання", en: "Add or change a wish" }
  listTitle: { uk: "Усі бажання", en: "All wishes" }
  categoryFieldLabel: { uk: "Категорія", en: "Category" }
  acquiredFieldLabel: { uk: "Уже отримано", en: "Already acquired" }
  saveLabel: { uk: "Зберегти", en: "Save" }
  editLabel: { uk: "Редагувати", en: "Edit" }
  deleteLabel: { uk: "Видалити", en: "Delete" }
  confirmQuestion: { uk: "Видалити це бажання?", en: "Delete this wish?" }
  confirmDeleteLabel: { uk: "Так, видалити", en: "Yes, delete" }
  cancelLabel: { uk: "Скасувати", en: "Cancel" }
instructions:
  uk: |
    Тепер сторінка стає застосунком: бажання — картки, а форма додає й змінює їх. Функції з попередніх кроків лишаються; змінюється лише те, що робить сторінка.

    **Дані.** `items` — початкові шість бажань — більше ніколи не змінюється. Поточний список тримай в окремій змінній `let` (наприклад, `current`); кожна дія дає новий список через `addItem`, `updateItem` чи `removeItem` і заново малює сторінку. `addItem` тепер бере із чернетки ще й `category` (`null`, якщо порожньо) та `acquired`.

    **Розмітка.** Прибери з `<main>` абзаци з попередніх кроків, крім підсумку `summary`, — їх замінюють форма й список:

    - форма з атрибутом `novalidate` і полями з підписами «%%nameLabel%%» (текст), «%%valueLabel%%» (число), «%%categoryFieldLabel%%» (текст, не більше 30 символів) і «%%acquiredFieldLabel%%» (прапорець), а також кнопка надсилання «%%saveLabel%%»; біля полів назви й ціни — елемент для повідомлення, пов’язаний із полем через `aria-describedby`;
    - під формою — абзац підсумку, заголовок списку «%%listTitle%%» з `tabindex="-1"` і порожній список `<ul id="items">`.

    **Картки.** Функція `render()` будує з поточного списку по картці `<li data-id="…">` на кожне бажання: назва, ціна або «%%noPrice%%», категорія (якщо є), позначка «%%acquiredMark%%» (якщо отримане) і дві кнопки «%%editLabel%%» та «%%deleteLabel%%». У доступній назві кожної кнопки є й назва бажання, наприклад «%%editLabel%%: %%fixture1Name%%». Усі значення потрапляють у картку як текст. Той самий `render()` оновлює підсумок через `summarizeItems`.

    **Форма.** Надсилання (кнопкою чи Enter) не перезавантажує сторінку. Чернетка з полів: порожня ціна — `null`, інакше число; порожня категорія — `null`. Її перевіряє `validateItem`:

    - є помилки — нічого не додається, біля полів з’являються тексти з `messageFor`, фокус переходить на перше хибне поле;
    - помилок немає — повідомлення зникають, бажання додається (або зберігається зміна), форма очищається, фокус — у поле назви.

    **Кнопки карток.** Один обробник `click` на `#items` обслуговує кнопки всіх карток, також доданих пізніше.

    - «%%editLabel%%» заповнює форму цим бажанням і ставить фокус у поле назви; наступне збереження змінює саме його.
    - «%%deleteLabel%%» не видаляє одразу: картка показує питання «%%confirmQuestion%%» і кнопки «%%confirmDeleteLabel%%» та «%%cancelLabel%%» (теж із назвою бажання), фокус — на «%%cancelLabel%%». Вбудований `confirm()` у перегляді недоступний, тож підтвердження будується на сторінці.
    - «%%cancelLabel%%» повертає картку як була, фокус — на її «%%deleteLabel%%».
    - «%%confirmDeleteLabel%%» видаляє бажання; фокус — на «%%deleteLabel%%» наступної картки, якщо її немає — попередньої, якщо список порожній — на заголовок списку.

    **Як перевірятиметься:** платформа, як людина, по черзі надсилає хибну чернетку (порожня назва, ціна `-5`), додає «%%newName%%» за `30` бажання з назвою `<b>Bold</b>` без ціни та бажання з категорією й позначеним прапорцем «%%acquiredFieldLabel%%», редагує «%%fixture2Name%%», скасовує й підтверджує видалення «%%fixture3Name%%» — і після кожного кроку дивиться на картки, поля, повідомлення й підсумок. Наприкінці `items` має лишитися тими самими шістьма бажаннями. Фокус платформа не перевіряє: пройди всі дії самою клавіатурою (Tab, Enter, пробіл) і переконайся, що він щоразу там, де описано.
  en: |
    Now the page becomes an app: the wishes are cards, and a form adds and changes them. The functions of the earlier steps stay; only what the page does changes.

    **Data.** `items` — the six starting wishes — never changes again. Keep the current list in a separate `let` variable (for example `current`); every action makes a new list with `addItem`, `updateItem` or `removeItem` and draws the page again. `addItem` now also takes `category` (`null` when empty) and `acquired` from the draft.

    **Markup.** Remove the paragraphs of the earlier steps from `<main>`, except the summary `summary` — the form and the list replace them:

    - a form with the `novalidate` attribute and fields labeled “%%nameLabel%%” (text), “%%valueLabel%%” (number), “%%categoryFieldLabel%%” (text, 30 characters at most) and “%%acquiredFieldLabel%%” (a checkbox), and a submit button “%%saveLabel%%”; next to the name and price fields, an element for a message, tied to its field with `aria-describedby`;
    - below the form, the summary paragraph, the list heading “%%listTitle%%” with `tabindex="-1"` and an empty list `<ul id="items">`.

    **Cards.** A `render()` function builds a card `<li data-id="…">` from the current list for every wish: the name, the price or “%%noPrice%%”, the category (if any), the mark “%%acquiredMark%%” (if acquired) and two buttons “%%editLabel%%” and “%%deleteLabel%%”. The accessible name of every button also holds the wish's name, for example “%%editLabel%%: %%fixture1Name%%”. Every value goes into the card as text. The same `render()` updates the summary with `summarizeItems`.

    **Form.** Submitting (with the button or Enter) does not reload the page. The draft from the fields: an empty price is `null`, otherwise a number; an empty category is `null`. `validateItem` checks it:

    - there are errors — nothing is added, the texts from `messageFor` appear next to the fields, focus moves to the first wrong field;
    - there are none — the messages disappear, the wish is added (or the change saved), the form is cleared, focus goes to the name field.

    **Card buttons.** One `click` handler on `#items` serves the buttons of all cards, also of the ones added later.

    - “%%editLabel%%” fills the form with this wish and puts focus into the name field; the next save changes exactly this wish.
    - “%%deleteLabel%%” does not delete at once: the card shows the question “%%confirmQuestion%%” and the buttons “%%confirmDeleteLabel%%” and “%%cancelLabel%%” (also with the wish's name), focus goes to “%%cancelLabel%%”. The built-in `confirm()` is not available in the preview, so the confirmation is built on the page.
    - “%%cancelLabel%%” restores the card, focus goes to its “%%deleteLabel%%”.
    - “%%confirmDeleteLabel%%” deletes the wish; focus goes to “%%deleteLabel%%” of the next card, if there is none — of the previous one, if the list is empty — to the list heading.

    **How it is checked:** like a person, the platform submits an invalid draft (an empty name, the price `-5`), adds “%%newName%%” for `30` , a wish named `<b>Bold</b>` without a price and a wish with a category and the “%%acquiredFieldLabel%%” box ticked, edits “%%fixture2Name%%”, cancels and then confirms deleting “%%fixture3Name%%” — and after every step it looks at the cards, the fields, the messages and the summary. At the end `items` must still be the same six wishes. The platform does not check focus: go through all actions with the keyboard only (Tab, Enter, Space) and make sure it is where described every time.
nudge:
  uk: "Згадай урок про рендеринг списку: одна функція будує елемент для одного запису, а `replaceChildren` ставить нові елементи замість старих. У делегованому обробнику `event.target.closest(\"button\")` знаходить кнопку, навіть якщо клацнули по тексту всередині неї, а `closest(\"[data-id]\")` від кнопки — її картку. Стан «яке бажання зараз редагується» чи «чиє видалення чекає підтвердження» зручно тримати в змінних `let` і читати в `render()`."
  en: "Recall the lesson on rendering a list: one function builds the element for one record, and `replaceChildren` puts the new elements in place of the old ones. In a delegated handler, `event.target.closest(\"button\")` finds the button even when the click landed on text inside it, and `closest(\"[data-id]\")` from the button finds its card. State such as “which wish is being edited” or “whose delete waits for confirmation” is handy to keep in `let` variables and read in `render()`."
testTitles:
  "the script runs without errors":
    uk: "Код у `app.js` працює без помилок"
    en: "The script runs without errors"
  "the form has labeled fields and a submit button":
    uk: "Форма має підписані поля «%%nameLabel%%», «%%valueLabel%%», «%%categoryFieldLabel%%», «%%acquiredFieldLabel%%» і кнопку надсилання"
    en: "The form has the labeled fields “%%nameLabel%%”, “%%valueLabel%%”, “%%categoryFieldLabel%%”, “%%acquiredFieldLabel%%” and a submit button"
  "every wish is a card with its name, price, category and named buttons":
    uk: "Кожне бажання — картка з назвою, ціною, категорією й кнопками, що називають бажання"
    en: "Every wish is a card with its name, price, category and buttons that name the wish"
  "an invalid draft shows messages next to its fields and adds nothing":
    uk: "Хибна чернетка показує повідомлення біля полів і нічого не додає"
    en: "An invalid draft shows messages next to its fields and adds nothing"
  "a valid draft adds a card, clears the form and the messages and updates the summary":
    uk: "Правильна чернетка додає картку, очищає форму й повідомлення та оновлює підсумок"
    en: "A valid draft adds a card, clears the form and the messages and updates the summary"
  "a wish without a price shows the no-price text, and a name with markup stays text":
    uk: "Бажання без ціни показує «%%noPrice%%», а назва з розміткою лишається текстом"
    en: "A wish without a price shows “%%noPrice%%”, and a name with markup stays text"
  "a new wish keeps its category and the acquired box":
    uk: "Нове бажання зберігає категорію з форми й позначку «%%acquiredFieldLabel%%»"
    en: "A new wish keeps the category from the form and the “%%acquiredFieldLabel%%” box"
  "Edit fills the form and saving changes only that wish":
    uk: "«%%editLabel%%» заповнює форму, а збереження змінює лише це бажання"
    en: "“%%editLabel%%” fills the form, and saving changes only that wish"
  "Delete asks for confirmation and Cancel keeps the wish":
    uk: "«%%deleteLabel%%» просить підтвердження, а «%%cancelLabel%%» лишає бажання"
    en: "“%%deleteLabel%%” asks for confirmation, and “%%cancelLabel%%” keeps the wish"
  "confirming the delete removes only that wish":
    uk: "«%%confirmDeleteLabel%%» прибирає лише це бажання"
    en: "“%%confirmDeleteLabel%%” removes only that wish"
  "items stays the starting list":
    uk: "`items` після всіх дій лишається тими самими шістьма бажаннями"
    en: "`items` is still the same six wishes after all actions"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки; інакше не працюють сторінка й решта перевірок. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там `TypeError` про `null` (наприклад, `reading 'addEventListener'`), то `document.querySelector` не знайшов елемент: селектор має збігатися з `id` в `index.html`."
      en: "This check expects the script to run to the end without an error; otherwise the page and the other checks do not work. The “Console” tab shows the error name and the line of code. If it shows a `TypeError` about `null` (for example `reading 'addEventListener'`), `document.querySelector` found no element: the selector must match an `id` in `index.html`."
  - when: { test: "the form has labeled fields and a submit button" }
    message:
      uk: "Ця перевірка шукає в `<form>` поля, доступна назва яких містить «%%nameLabel%%», «%%valueLabel%%», «%%categoryFieldLabel%%» і «%%acquiredFieldLabel%%» (останнє — прапорець), та кнопку надсилання. Підпис дає полю назву, коли `for` у `<label>` збігається з `id` поля."
      en: "This check looks in the `<form>` for fields whose accessible name holds “%%nameLabel%%”, “%%valueLabel%%”, “%%categoryFieldLabel%%” and “%%acquiredFieldLabel%%” (the last one a checkbox), and for a submit button. A label names a field when the `for` of the `<label>` matches the field's `id`."
  - when: { test: "every wish is a card with its name, price, category and named buttons" }
    message:
      uk: "Ця перевірка шукає в `#items` шість карток з `data-id` від `w-01` до `w-06`: у кожній назва, ціна чи «%%noPrice%%», категорія, позначка «%%acquiredMark%%» лише в отриманих і кнопки «%%editLabel%%» та «%%deleteLabel%%», у доступних назвах яких є назва бажання. Картки з’являються, коли `render()` виконується під час завантаження."
      en: "This check looks in `#items` for six cards with `data-id` from `w-01` to `w-06`: each with the name, the price or “%%noPrice%%”, the category, the mark “%%acquiredMark%%” only on acquired wishes, and the buttons “%%editLabel%%” and “%%deleteLabel%%” whose accessible names hold the wish's name. The cards appear when `render()` runs while the page loads."
  - when: { test: "an invalid draft shows messages next to its fields and adds nothing" }
    message:
      uk: "Ця перевірка вводить порожню назву й ціну `-5`, надсилає форму й чекає, що надсилання скасовано (`preventDefault`), карток не додалося, а в елементах, які поля називають в `aria-describedby`, з’явилися «%%requiredMessage%%» і «%%invalidMessage%%»."
      en: "This check enters an empty name and the price `-5`, submits the form and expects the submit to be prevented (`preventDefault`), no card to be added, and “%%requiredMessage%%” and “%%invalidMessage%%” to appear in the elements the fields name in `aria-describedby`."
  - when: { test: "a valid draft adds a card, clears the form and the messages and updates the summary" }
    message:
      uk: "Ця перевірка вводить «%%newName%%» і ціну `30`, надсилає форму й чекає одну нову картку із цими значеннями, порожнє поле назви, зниклі повідомлення та підсумок, де після «%%summaryWantedTotal%%» стоїть `395`."
      en: "This check enters “%%newName%%” and the price `30`, submits the form and expects one new card with these values, an empty name field, no old messages and a summary with `395` after “%%summaryWantedTotal%%”."
  - when: { test: "a new wish keeps its category and the acquired box" }
    message:
      uk: "Ця перевірка додає бажання «Garden chair» за `60` з категорією `Outdoor` і позначеним прапорцем «%%acquiredFieldLabel%%» та чекає його картку з категорією `Outdoor` і позначкою «%%acquiredMark%%». Обидва значення потрапляють у новий запис, коли `addItem` бере `category` і `acquired` із чернетки."
      en: "This check adds the wish “Garden chair” for `60` with the category `Outdoor` and the “%%acquiredFieldLabel%%” box ticked and expects its card with the category `Outdoor` and the mark “%%acquiredMark%%”. Both values reach the new record when `addItem` takes `category` and `acquired` from the draft."
  - when: { test: "a wish without a price shows the no-price text, and a name with markup stays text" }
    message:
      uk: "Ця перевірка додає бажання з назвою `<b>Bold</b>` і порожньою ціною й чекає картку, що показує цю назву буквально, без елемента `<b>`, і «%%noPrice%%». Якщо замість «%%noPrice%%» там `0`, то порожнє поле ціни стало числом: `Number(\"\")` дає `0`."
      en: "This check adds a wish named `<b>Bold</b>` with an empty price and expects a card showing this name literally, without a `<b>` element, and “%%noPrice%%”. If it shows `0` instead of “%%noPrice%%”, the empty price field became a number: `Number(\"\")` gives `0`."
  - when: { test: "Edit fills the form and saving changes only that wish" }
    message:
      uk: "Ця перевірка натискає «%%editLabel%%» у картці `w-02` і чекає в полях її назву й ціну `45`; потім вводить `50`, ставить прапорець «%%acquiredFieldLabel%%» і зберігає: картка `w-02` показує `50` і «%%acquiredMark%%», карток не побільшало, інші не змінилися. Якщо з’явилася друга картка з тією самою назвою, збереження додало нове бажання замість зміни."
      en: "This check presses “%%editLabel%%” on the card `w-02` and expects its name and the price `45` in the fields; then it enters `50`, ticks “%%acquiredFieldLabel%%” and saves: the card `w-02` shows `50` and “%%acquiredMark%%”, there are no more cards than before, and the others did not change. If a second card with the same name appeared, saving added a new wish instead of changing it."
  - when: { test: "Delete asks for confirmation and Cancel keeps the wish" }
    message:
      uk: "Ця перевірка натискає «%%deleteLabel%%» у картці `w-03` і чекає, що картка лишилася й показує кнопку «%%confirmDeleteLabel%%»; після «%%cancelLabel%%» картка на місці, а кнопок підтвердження немає."
      en: "This check presses “%%deleteLabel%%” on the card `w-03` and expects the card to stay and show a “%%confirmDeleteLabel%%” button; after “%%cancelLabel%%” the card is still there and the confirmation buttons are gone."
  - when: { test: "confirming the delete removes only that wish" }
    message:
      uk: "Ця перевірка натискає «%%deleteLabel%%», а потім «%%confirmDeleteLabel%%» у картці `w-03` і чекає, що зникла лише вона. Якщо кнопки нових карток не реагують, обробник висить на кнопках, які `render()` уже замінив, а не на списку `#items`."
      en: "This check presses “%%deleteLabel%%” and then “%%confirmDeleteLabel%%” on the card `w-03` and expects only that card to be gone. If the buttons of new cards do not react, the handler hangs on buttons `render()` already replaced instead of on the list `#items`."
  - when: { test: "items stays the starting list" }
    message:
      uk: "Ця перевірка чекає, що `items` на верхньому рівні `app.js` після всіх дій на сторінці — ті самі шість бажань із тими самими полями: поточний список живе в окремій змінній, а кожна дія дає новий масив."
      en: "This check expects `items` at the top level of `app.js` to be the same six wishes with the same fields after all actions on the page: the current list lives in a separate variable, and every action gives a new array."
