# Capstone step of unit RE-08 — the checkpoint CP-RE (wording shared by the four capstones; the
# enhancement of each capstone is in <capstone>/task.yaml). An assessment: the intro and the task say
# what must be true and how each rubric row is checked, never how to build the enhancement; the
# reference/ is the complete model solution.
# The compiler also writes the syllabus lesson of kind capstone-step of RE-08 from this file.
# A local step: done in the learner's editor, terminal and browser; no platform checks.
# Teaching order: RE-08 comes after RE-11, so the reference continues the RE-11 reference.
# Every command was run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome 154) in a scratch home on
# all four projects. The CP-JS data row was run in headless Chrome: records saved by the storage code of
# the CP-JS commit, packed as data/exported-storage.json, restored with tools/restore-data.html on
# 127.0.0.1:4310 and opened in the RE-08 version. The cleanup row: the list query's abort cleanup removed
# on a copy, tests.html run. Quoted output is from the wishlist run.
unit: RE-08
mode: local
entry: index.html
title:
  uk: "Контрольна точка CP-RE"
  en: "Checkpoint CP-RE"
intro:
  uk: |
    Контрольна точка React-етапу. Без підказок додай до проєкту одне покращення, доведи кожен рядок рубрики CP-RE своїм доказом і поясни поведінку state й closures у власному коді. Що саме побудувати — у завданні твого проєкту; **як** — вирішуєш ти: тут лише те, що має бути правдою, і як це перевірити.

    | Проєкт | Покращення |
    |---|---|
    | Список бажань | маршрут категорій: бажання за `category` і сума ще бажаного в кожній |
    | Планувальник | маршрут прострочених: невиконані з `dueDate` до переданого дня, за `priority` |
    | Трекер звичок | історія звички: 14 днів до переданого дня, виконано чи пропущено, поточна серія |
    | Трекер витрат | маршрут місяця: суми категорій в `amountMinor` за вибраний місяць |

    **Твій проєкт — не шаблон Vite.** Урок про локальну перевірку показував команди на тестовому проєкті Vite (`npm run dev`, `http://localhost:5173`, `tsc -b`). Твій проєкт зібраний у цих кроках інакше, тож докази беруться так:

    | Рядок рубрики | Команда чи місце | Що маєш побачити |
    |---|---|---|
    | Поведінка | `npm start`, потім `http://127.0.0.1:4310/tests.html` | тести дій користувача під `<StrictMode>` (вони працюють лише в браузері): усі `✓`, `не пройшли: 0`; новий тест покращення серед них |
    | Поведінка (логіка) | `npm test`, `echo $?` | тести Node.js без DOM (домен, сховище, reducer, схема): `не пройшли: 0` і `0` |
    | Типи | `npm run typecheck`, `echo $?` | лише `> tsc -p .` у заголовку і `0` |
    | Cleanup ефектів | тест, що падає без cleanup | без cleanup ефекту, який він перевіряє, — `✗` у `tests.html`; поверни рядок |
    | Доступні маршрути | клавіатура на `http://127.0.0.1:4310/` | Tab і Enter досягають покращення; після переходу фокус на заголовку |
    | Дані CP-JS | та сама адреса, що й у CP-JS | записи CP-JS без змін |

    Перевірено на macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2, Chrome 154) на всіх чотирьох проєктах; нижче — вивід «Списку бажань».

    **1. Стан на початку.** `cd ~/js-course/wishlist`, `git status` — чисто, `git log --oneline -1` — commit кроку про межу сервера й клієнта. `npm run dev` тут не існує: `npm error Missing script: "dev"`. Сервер — `npm start` (збирає застосунок і тести, потім `http://127.0.0.1:4310/`).

    **2. Покращення.** Побудуй його за описом у завданні проєкту. `domain/` і `storage/` не змінюються. Додай щонайменше один тест дій користувача в `tests/ui.test.tsx`, який падає, якщо зламати групування, порядок чи підсумок. Ми перевірили свій еталон саме так: зламаний підсумок, порядок, напрям списку днів і фільтр місяця — кожен дав `✗` свого тесту.

    **3. Поведінка й типи.** `npm run typecheck`, `echo $?` — `> tsc -p .` і `0`. `npm test`, `echo $?` — у нас `Пройшли: 37 · не пройшли: 0` і `0`; у тебе число інше. `npm start` і `http://127.0.0.1:4310/tests.html` — у нас 13 рядків `✓` і `Пройшли: 13 · не пройшли: 0`.

    **4. Cleanup ефектів.** Назви ефект, що відкриває щось ззовні, і тест, що без його cleanup падає. Доказ: тимчасово прибери cleanup, `npm run build:tests`, перезавантаж `tests.html` — рядок `✗` цього тесту з його повідомленням (сусідні тести можуть упасти теж: виправляй перший червоний рядок). Поверни рядок через `git restore` і переконайся, що знову `не пройшли: 0`.

    **5. Доступні маршрути.** Лише клавіатурою: від списку до покращення, назад, до запису з покращення. Після кожного переходу фокус на заголовку нового екрана, а вкладка показує його назву.

    **6. Дані CP-JS.** React-версія працює на тій самій адресі, що й CP-JS (`http://127.0.0.1:4310`), і читає той самий ключ сховища (`jsll.wishlist.v1`) тим самим `storage/`, тож записи, збережені там, уже на місці. Якщо дані CP-JS лишилися в платформі, `http://127.0.0.1:4310/tools/restore-data.html` → «Відновити дані» (сторінка каже `Дані буде записано для адреси http://127.0.0.1:4310.`). У нашій перевірці сім записів, збережених кодом сховища CP-JS і відновлених так, відкрилися в React-версії як сім карток у тому самому порядку, а збережений текст не змінився.

    **7. Пояснення.** `docs/state-and-closures.md`: два місця твого коду з файлом і рядком, де обробник чи ефект бачить знімок state або значення з closure. Кожне твердження перевір тимчасовим `console.log` (`npm start`, дія в браузері, Console) і процитуй вивід; потім прибери `console.log`. Вивід — це рядки Console, наприклад `назва: значення …`, які показують, яке значення бачить саме цей обробник чи ефект.

    **8. Commit.** `git status --short` — лише твої зміни, без тимчасових `console.log`. `git add -A`, `git commit -m "CP-RE: add the checkpoint enhancement with user-action tests"` — у нас `[main 65a9a13] CP-RE: add the checkpoint enhancement with user-action tests`; `git status` — чисто.

    **Самоперевірка — рубрика CP-RE:** поведінка — `tests.html` без `✗` і новий тест падає на зламаному покращенні; логіка — `npm test` і `0`; типи — `npm run typecheck` і `0`; cleanup — названий тест падає без cleanup; маршрути — увесь шлях клавіатурою, фокус на заголовках; дані CP-JS — ті самі записи на `127.0.0.1:4310`; пояснення — два місця з рядками й виводом Console.

    **Якщо щось пішло не так:** `tests.html` показує старі тести — сервер збирає тести лише під час `npm start`: `npm run build:tests` і перезавантаж сторінку. Список порожній, хоча в CP-JS були записи, — сторінку відкрито не на `http://127.0.0.1:4310` (інша адреса — інше сховище) або дані CP-JS лишилися в платформі: відновлення з кроку 6.

    Еталон кроку — `Завантажити: RE-08 — Контрольна точка CP-RE` після експорту; відкривай його після власної спроби. Команди виконано лише на macOS і в Chrome; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    The checkpoint of the React stage. Without hints, add one enhancement to the project, prove every row of the CP-RE rubric with its own evidence and explain state and closure behaviour in your own code. What exactly to build is in your project's task; **how** is up to you: here is only what must be true and how to check it.

    | Project | Enhancement |
    |---|---|
    | Wishlist | a categories route: wishes by `category` and the still-wanted total of each |
    | Planner | an overdue route: pending tasks with `dueDate` before the given day, by `priority` |
    | Habit tracker | a habit history: 14 days up to the given day, done or missed, the current streak |
    | Expense tracker | a month route: category totals in `amountMinor` for the chosen month |

    **Your project is not the Vite template.** The lesson on local verification showed the commands on a Vite test project (`npm run dev`, `http://localhost:5173`, `tsc -b`). Your project was built differently in these steps, so the evidence comes from here:

    | Rubric row | Command or place | What you must see |
    |---|---|---|
    | Behaviour | `npm start`, then `http://127.0.0.1:4310/tests.html` | the user-action tests under `<StrictMode>` (they run only in the browser): all `✓`, `failed: 0`; your new enhancement test among them |
    | Behaviour (logic) | `npm test`, `echo $?` | the Node.js tests without a DOM (domain, storage, reducer, schema): `failed: 0` and `0` |
    | Types | `npm run typecheck`, `echo $?` | only `> tsc -p .` in the header and `0` |
    | Effect cleanup | a test that fails without the cleanup | without the cleanup of the effect it checks — `✗` in `tests.html`; put the line back |
    | Accessible routes | the keyboard at `http://127.0.0.1:4310/` | Tab and Enter reach the enhancement; after a navigation focus is on the heading |
    | CP-JS data | the same address as in CP-JS | the CP-JS records unchanged |

    Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2, Chrome 154) on all four projects; below is the output of the wishlist.

    **1. The starting state.** `cd ~/js-course/wishlist`, `git status` — clean, `git log --oneline -1` — the commit of the server–client boundary step. `npm run dev` does not exist here: `npm error Missing script: "dev"`. The server is `npm start` (it builds the app and the tests, then `http://127.0.0.1:4310/`).

    **2. The enhancement.** Build it from the description in your project's task. `domain/` and `storage/` do not change. Add at least one user-action test to `tests/ui.test.tsx` that fails when the grouping, the order or the total is broken. We checked our reference exactly so: a broken total, order, direction of the day list and month filter — each gave a `✗` of its test.

    **3. Behaviour and types.** `npm run typecheck`, `echo $?` — `> tsc -p .` and `0`. `npm test`, `echo $?` — for us `Passed: 37 · failed: 0` and `0`; your number differs. `npm start` and `http://127.0.0.1:4310/tests.html` — for us 13 `✓` lines and `Passed: 13 · failed: 0`.

    **4. Effect cleanup.** Name an effect that opens something outside and a test that fails without its cleanup. The evidence: remove the cleanup for a moment, `npm run build:tests`, reload `tests.html` — the `✗` line of that test with its message (neighbouring tests may fail too: fix the first red line). Put the line back with `git restore` and make sure it is `failed: 0` again.

    **5. Accessible routes.** With the keyboard alone: from the list to the enhancement, back, to a record from the enhancement. After every navigation focus is on the new screen's heading, and the tab shows its name.

    **6. CP-JS data.** The React version runs at the same address as CP-JS (`http://127.0.0.1:4310`) and reads the same storage key (`jsll.wishlist.v1`) with the same `storage/`, so the records saved there are already in place. If the CP-JS data stayed in the platform, `http://127.0.0.1:4310/tools/restore-data.html` → “Restore data” (the page says the data will be written for `http://127.0.0.1:4310`). In our check, seven records saved by the CP-JS storage code and restored this way opened in the React version as seven cards in the same order, and the stored text did not change.

    **7. The explanation.** `docs/state-and-closures.md`: two places in your code with a file and a line where a handler or an effect sees a state snapshot or a value from a closure. Check every claim with a temporary `console.log` (`npm start`, the action in the browser, the Console) and quote the output; then remove the `console.log`. The output is Console lines, for example `name: value …`, that show which value exactly this handler or effect sees.

    **8. Commit.** `git status --short` — only your changes, no temporary `console.log`. `git add -A`, `git commit -m "CP-RE: add the checkpoint enhancement with user-action tests"` — for us `[main d013fb1] CP-RE: add the checkpoint enhancement with user-action tests`; `git status` — clean.

    **Self-check — the CP-RE rubric:** behaviour — `tests.html` without `✗` and the new test fails on a broken enhancement; logic — `npm test` and `0`; types — `npm run typecheck` and `0`; cleanup — the named test fails without the cleanup; routes — the whole path by keyboard, focus on the headings; CP-JS data — the same records at `127.0.0.1:4310`; explanation — two places with lines and Console output.

    **If something goes wrong:** `tests.html` shows old tests — the server builds the tests only on `npm start`: `npm run build:tests` and reload the page. The list is empty although CP-JS had records — the page is not open at `http://127.0.0.1:4310` (another address is another storage) or the CP-JS data stayed in the platform: the restore of step 6.

    The step's reference is `Download: RE-08 — Checkpoint CP-RE` after the export; open it after your own attempt. The commands were run on macOS and in Chrome only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це контрольна точка твого проєкту: без підказок ти застосовуєш маршрути, state, ефекти, тести дій користувача й типи React-етапу до нового покращення і доводиш кожен рядок рубрики CP-RE. Платформа цей крок не перевіряє: доказ — команди, `tests.html`, пояснення й commit."
  en: "This is the checkpoint of your project: without hints you apply the React stage's routes, state, effects, user-action tests and types to a new enhancement and prove every row of the CP-RE rubric. The platform does not check this step: the evidence is the commands, `tests.html`, the explanation and the commit."
objectives:
  - uk: "Без підказок додати до проєкту одне покращення, досяжне з клавіатури й покрите тестом дій користувача, не змінюючи збережених даних CP-JS."
    en: "Without hints add one enhancement to the project, keyboard-reachable and covered by a user-action test, without changing the saved CP-JS data."
  - uk: "Довести кожен рядок рубрики CP-RE справжніми командами проєкту й пояснити поведінку state і closures у власному коді з рядками й виводом Console."
    en: "Prove every row of the CP-RE rubric with the project's real commands and explain state and closure behaviour in your own code with lines and Console output."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й браузері на твоєму комп’ютері: що має бути правдою, як це перевірити й рубрика самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and a browser on your computer: what must be true, how to check it and the self-check rubric are above and on the step's page in your project."
