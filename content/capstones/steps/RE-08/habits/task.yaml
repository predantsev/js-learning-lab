# Habit tracker variant of step RE-08 (a local step: done in the learner's editor, terminal and browser, no
# platform checks). Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2,
# Chrome) on the scratch project of this capstone after RE-11.
strings:
  historyLinkLabel: { uk: "Останні 14 днів", en: "Last 14 days" }
  historyTitle: { uk: "останні 14 днів", en: "the last 14 days" }
  historyDoneLabel: { uk: "виконано днів", en: "days done" }
  doneDayMark: { uk: "виконано", en: "done" }
  missedDayMark: { uk: "пропущено", en: "missed" }
  backToHabitLabel: { uk: "← До звички", en: "← To the habit" }
instructions:
  uk: |
    Контрольна точка CP-RE — без підказок: що має бути правдою і як це перевіряється; як побудувати — вирішуєш ти. Платформа цей крок не перевіряє.

    1. Покращення: маршрут `#/habits/:id/history` (посилання «%%historyLinkLabel%%» на сторінці звички): 14 днів до переданого дня включно (той самий `today`, не з годинника), найновіший першим, кожен — дата й «%%doneDayMark%%» або «%%missedDayMark%%» за `completions`; над списком — поточна серія для цього дня й скільки з 14 днів виконано; неіснуючий id — екран «не знайдено».
    2. Доступність: усе досяжне й виконуване лише з клавіатури; після переходу фокус на заголовку нового екрана, `document.title` — його назва.
    3. Поведінка: щонайменше один новий тест дій користувача в `tests/ui.test.tsx` (під `<StrictMode>`, як решта) перевіряє покращення так, як його бачить людина, і падає, якщо зламати групування, порядок чи підсумок.
    4. Дані CP-JS: застосунок працює на тій самій адресі, що й у CP-JS (`npm start` → `http://127.0.0.1:4310`), і записи, збережені тоді, відкриваються без змін; `domain/` і `storage/` не змінюються.
    5. Перевірка: `npm run typecheck` і `npm test` завершуються з кодом `0` (`npm test` — 38 тестів, без браузера); `http://127.0.0.1:4310/tests.html` — 13 рядків `✓` і `не пройшли: 0`; без cleanup в ефекті, який перевіряє твій тест cleanup, цей тест падає.
    6. Пояснення: `docs/state-and-closures.md` — два місця твого коду (файл і рядок), де обробник чи ефект бачить знімок state або значення з closure, що має значення; кожне твердження спирається на рядок коду або на вивід Console.
    7. Commit з покращенням, тестом і поясненням; `git status` після нього — чисто.
  en: |
    Checkpoint CP-RE — without hints: what must be true and how it is checked; how to build it is up to you. The platform does not check this step.

    1. The enhancement: a route `#/habits/:id/history` (a link “%%historyLinkLabel%%” on the habit page): the 14 days up to and including the given day (the same `today`, not the clock), newest first, each a date and “%%doneDayMark%%” or “%%missedDayMark%%” from `completions`; above the list the current streak for that day and how many of the 14 days are done; an unknown id gives the not-found screen.
    2. Accessibility: everything reachable and operable with the keyboard alone; after a navigation focus is on the new screen's heading and `document.title` is its name.
    3. Behaviour: at least one new user-action test in `tests/ui.test.tsx` (under `<StrictMode>`, like the others) checks the enhancement the way a person sees it and fails when the grouping, the order or the total is broken.
    4. CP-JS data: the app runs at the same address as in CP-JS (`npm start` → `http://127.0.0.1:4310`), and the records saved then open unchanged; `domain/` and `storage/` do not change.
    5. Check: `npm run typecheck` and `npm test` finish with the code `0` (`npm test` — 38 tests, no browser); `http://127.0.0.1:4310/tests.html` — 13 `✓` lines and `failed: 0`; without the cleanup of the effect your cleanup test checks, that test fails.
    6. Explanation: `docs/state-and-closures.md` — two places in your code (a file and a line) where a handler or an effect sees a state snapshot or a value from a closure in a way that matters; every claim rests on a line of code or on Console output.
    7. A commit with the enhancement, the test and the explanation; `git status` after it — clean.
