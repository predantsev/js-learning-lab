# Expense tracker variant of step RE-03 (a local step: done in the learner's editor, terminal and browser, no
# platform checks). Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2,
# Chrome) on the scratch project of this capstone after RE-02.
instructions:
  uk: |
    Збережи список `~/js-course/expenses` у `localStorage` одним ефектом, не змінюючи `domain/` і `storage/`. Платформа цей крок не перевіряє; доказ — перевірка в браузері й commit.

    1. `main.tsx`: `const startingExpenses: Expense[] = loadExpenses(localStorage).ok ? [] : await loadFixtures();` і `<StrictMode><App startingExpenses={startingExpenses} … /></StrictMode>`.
    2. В `App` — лінивий ініціалізатор: `useState<Expense[]>(() => { const saved = loadExpenses(localStorage); return saved.ok ? saved.expenses : startingExpenses; })`.
    3. Один ефект: `useEffect(() => { saveExpenses(localStorage, expenses); }, [expenses]);` — записує весь список `{ schemaVersion: 1, records }` під ключем `jsll.expenses.v1`; cleanup не потрібен.
    4. `npm run typecheck` і `npm run lint` — без зауважень; `npm test` — 29 тестів і `не пройшли: 0`.
    5. `npm start`, `http://127.0.0.1:4310/`, DevTools → Application → Local Storage: з порожнім сховищем ключ `jsll.expenses.v1` одразу містить шість записів із різними `id` (StrictMode не подвоює їх); нові записи, зміни й видалення переживають перезавантаження, а `amountMinor` кожної витрати не губляться; зміна фільтра нічого не записує; пошкоджені дані дають початковий список і копію під `jsll.expenses.v1.backup`.
    6. `git add -A`, `git commit -m "Save the list with one effect"`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.
  en: |
    Save the list of `~/js-course/expenses` to `localStorage` with one effect, without changing `domain/` and `storage/`. The platform does not check this step; the evidence is the check in the browser and the commit.

    1. `main.tsx`: `const startingExpenses: Expense[] = loadExpenses(localStorage).ok ? [] : await loadFixtures();` and `<StrictMode><App startingExpenses={startingExpenses} … /></StrictMode>`.
    2. In `App`, a lazy initializer: `useState<Expense[]>(() => { const saved = loadExpenses(localStorage); return saved.ok ? saved.expenses : startingExpenses; })`.
    3. One effect: `useEffect(() => { saveExpenses(localStorage, expenses); }, [expenses]);` — it writes the whole list `{ schemaVersion: 1, records }` under the key `jsll.expenses.v1`; no cleanup is needed.
    4. `npm run typecheck` and `npm run lint` — no findings; `npm test` — 29 tests and `failed: 0`.
    5. `npm start`, `http://127.0.0.1:4310/`, DevTools → Application → Local Storage: with an empty storage the key `jsll.expenses.v1` holds six records with different `id`s right away (StrictMode does not double them); new records, changes and deletes survive a reload, and the `amountMinor` of every expense are not lost; a filter change writes nothing; damaged data gives the starting list and a copy under `jsll.expenses.v1.backup`.
    6. `git add -A`, `git commit -m "Save the list with one effect"`; `git diff HEAD~1 --stat -- domain storage` prints nothing.
