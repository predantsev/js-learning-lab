# Capstone step of unit RE-03 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson re-03-09-capstone-persist-effect from this file.
# A local step: done in the learner's editor, terminal and browser; no platform checks. The project page
# shows only the intro of a local step, so the intro carries the whole procedure.
# Every command was run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome) in a scratch home on
# all four projects, continuing the RE-02 scratch projects. The browser checks counted
# localStorage.setItem calls of the project's key with a wrapper installed before the page loaded; the
# troubleshooting rows were reproduced on a copy of the wishlist project. Quoted output is from the
# wishlist run (Ukrainian output in the uk text, English output in the en text).
# reference/ holds the same file set as RE-01 (export- and npm-generated files excluded).
unit: RE-03
mode: local
entry: index.html
title:
  uk: "Ефект збереження"
  en: "The persistence effect"
intro:
  uk: |
    Після попереднього кроку зміни зникають після перезавантаження. Тепер список синхронізується з `localStorage` — [[external-system|зовнішньою системою]] — через **один** [[use-effect|ефект]]: після кожної зміни списку він записує весь список `{ schemaVersion: 1, records }` під ключем проєкту. Збережені записи читає один раз [[lazy-initializer|лінивий ініціалізатор]] `useState(() => …)`, а перевіряє їх функція `load…` з `storage/`, яка вже вміє відкидати пошкоджені дані. Сторінку обгортає [[react-strict-mode|StrictMode]] — і саме він доводить, що ефект можна повторювати. `domain/` і `storage/` не змінюються.

    | Проєкт | Ключ | Читання (у лінивому ініціалізаторі) | Запис (в ефекті) | Залежність ефекту |
    |---|---|---|---|---|
    | Список бажань | `jsll.wishlist.v1` | `loadItems(localStorage)` → `saved.items` | `saveItems(localStorage, items)` | `[items]` |
    | Планувальник | `jsll.planner.v1` | `loadTasks(localStorage)` → `saved.tasks` | `saveTasks(localStorage, tasks)` | `[tasks]` |
    | Трекер звичок | `jsll.habits.v1` | `loadHabits(localStorage)` → `saved.habits` | `saveHabits(localStorage, habits)` | `[habits]` |
    | Трекер витрат | `jsll.expenses.v1` | `loadExpenses(localStorage)` → `saved.expenses` | `saveExpenses(localStorage, expenses)` | `[expenses]` |

    Нижче — «Список бажань»; для свого проєкту підстав назви з таблиці. Перевірено на macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2, Chrome) на всіх чотирьох проєктах.

    **1. Стан на початку.** `cd ~/js-course/wishlist`, `git status` — чисто, `git log --oneline -1` — commit кроку про інтерактивний стан.

    **2. `main.tsx`.** Сховище тепер читає `App`, а `main.tsx` лише довантажує початкові записи, коли збереженого немає, і обгортає сторінку в `StrictMode`:

    ```tsx
    import { StrictMode } from "react";
    // …
    const startingItems: Wish[] = loadItems(localStorage).ok ? [] : await loadFixtures();

    createRoot(document.getElementById("root")!).render(
      <StrictMode>
        <App startingItems={startingItems} />
      </StrictMode>,
    );
    ```

    `loadFixtures` — це `fetch`, а ініціалізатор `useState` чекати не вміє, тож очікування лишається тут, до першого рендеру.

    **3. Лінивий ініціалізатор.** В `App` prop тепер зветься `startingItems`, а стан починається так:

    ```tsx
    const [items, setItems] = useState<Wish[]>(() => {
      const saved = loadItems(localStorage);
      return saved.ok ? saved.items : startingItems;
    });
    ```

    Функцію React викликає лише під час першого рендеру (у розробці StrictMode — двічі, і це безпечно: функція нічого не змінює, окрім копії пошкоджених даних під ключем `….backup`, яку `loadItems` пише щоразу ту саму). Читати сховище в ефекті й потім викликати `setItems` не треба: це зайвий рендер, а з дописуванням — дублікати (див. нижче).

    **4. Один ефект запису.**

    ```tsx
    useEffect(() => {
      saveItems(localStorage, items);
    }, [items]);
    ```

    Ефект читає лише `items`, тож [[dependency-array|масив залежностей]] — `[items]`: ефект запускається після кожної зміни списку й не запускається від фільтра чи чернетки форми. `saveItems` щоразу записує **весь** список замість попереднього, тому повторний запуск з тим самим списком нічого не псує. [[effect-cleanup|Cleanup]] тут не потрібен: запис нічого не вмикає, що треба було б вимкнути. Не прибирай `StrictMode`, щоб «полагодити» дубль, — виправляй ефект.

    **5. Перевірка інструментами.** `npm run typecheck` і `npm run lint` — лише рядки заголовка; `npm run build` — `dist/app.js      1.2mb ⚠️` і `⚡ Done in 41ms`; `npm test` — `Пройшли: 30 · не пройшли: 0`.

    **6. Перевірка в браузері** (`npm start`, `http://127.0.0.1:4310/`). У DevTools відкрий **Application → Local Storage → `http://127.0.0.1:4310`** і стеж за ключем `jsll.wishlist.v1`. Ми перевіряли з порожнім сховищем (`localStorage.clear()` у Console, потім перезавантаження):

    - одразу після завантаження під ключем `{"schemaVersion":1,"records":[…]}` з **шістьма** записами й шістьма різними `id` — хоча в розробці StrictMode запускає ефект двічі (ми нарахували два записи `setItem` під час монтування), записів не стало дванадцять;
    - нове бажання, перемикання «отримано» й видалення з підтвердженням — після перезавантаження всі три зміни на місці, а «отримано» й категорія не губляться;
    - зміна фільтра нічого не записує (нуль викликів `setItem`): фільтр — не залежність ефекту;
    - пошкоджені дані (`localStorage.setItem("jsll.wishlist.v1", "{broken")` у Console і перезавантаження) — сторінка показує шість початкових бажань, а текст `{broken` лежить під ключем `jsll.wishlist.v1.backup`;
    - у Console немає червоних повідомлень.

    **7. Commit.** `git status --short` — ` M main.tsx` і ` M ui/App.tsx`. `git add -A`, `git commit -m "Save the list with one effect"` — `[main 13695db] Save the list with one effect` і `2 files changed, 31 insertions(+), 11 deletions(-)`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.

    **Самоперевірка:** кожен пункт кроку 6 справджується; ефект у `App` один, з масивом `[items]`; сховище читається лише в ініціалізаторі `useState` (і в `main.tsx` перед першим рендером); `npm run typecheck`, `npm run lint` — без зауважень, `npm test` — `не пройшли: 0`.

    **Якщо щось пішло не так** (усе відтворено на «Списку бажань»):

    - Зміни зникають після перезавантаження, а Console мовчить — у ефекту масив `[]`: він записав лише перший список. Залежність — сам список.
    - Зміна фільтра теж записує сховище (у нас — один зайвий `setItem`) — у ефекту немає масиву залежностей, і він запускається після кожного рендеру.
    - Після першого ж завантаження карток дванадцять замість шести, а в Console ``Encountered two children with the same key`` — збережені записи читаються в ефекті й **дописуються** до списку: StrictMode запускає такий ефект двічі. Читай у лінивому ініціалізаторі й записуй весь список.

    Еталон кроку — `Завантажити: RE-03 — Ефект збереження` у розділі «Еталони для завантаження» після експорту. Команди виконано лише на macOS; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    After the previous step changes vanish after a reload. Now the list is synchronized with `localStorage` — an [[external-system]] — through **one** [[use-effect|effect]]: after every change of the list it writes the whole list `{ schemaVersion: 1, records }` under the project's key. The saved records are read once by a [[lazy-initializer]] `useState(() => …)`, and they are checked by the `load…` function of `storage/`, which already rejects damaged data. [[react-strict-mode|StrictMode]] wraps the page — and it is what proves that the effect can be repeated. `domain/` and `storage/` do not change.

    | Project | Key | Reading (in the lazy initializer) | Writing (in the effect) | Effect dependency |
    |---|---|---|---|---|
    | Wishlist | `jsll.wishlist.v1` | `loadItems(localStorage)` → `saved.items` | `saveItems(localStorage, items)` | `[items]` |
    | Planner | `jsll.planner.v1` | `loadTasks(localStorage)` → `saved.tasks` | `saveTasks(localStorage, tasks)` | `[tasks]` |
    | Habit tracker | `jsll.habits.v1` | `loadHabits(localStorage)` → `saved.habits` | `saveHabits(localStorage, habits)` | `[habits]` |
    | Expense tracker | `jsll.expenses.v1` | `loadExpenses(localStorage)` → `saved.expenses` | `saveExpenses(localStorage, expenses)` | `[expenses]` |

    Below is the wishlist; for your project use the names from the table. Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2, Chrome) on all four projects.

    **1. The starting state.** `cd ~/js-course/wishlist`, `git status` — clean, `git log --oneline -1` — the commit of the interactive state step.

    **2. `main.tsx`.** `App` reads the storage now, and `main.tsx` only fetches the starting records when nothing is saved and wraps the page in `StrictMode`:

    ```tsx
    import { StrictMode } from "react";
    // …
    const startingItems: Wish[] = loadItems(localStorage).ok ? [] : await loadFixtures();

    createRoot(document.getElementById("root")!).render(
      <StrictMode>
        <App startingItems={startingItems} />
      </StrictMode>,
    );
    ```

    `loadFixtures` is a `fetch`, and a `useState` initializer cannot wait, so the waiting stays here, before the first render.

    **3. The lazy initializer.** In `App` the prop is now called `startingItems`, and the state starts like this:

    ```tsx
    const [items, setItems] = useState<Wish[]>(() => {
      const saved = loadItems(localStorage);
      return saved.ok ? saved.items : startingItems;
    });
    ```

    React calls the function only during the first render (twice in development under StrictMode, which is safe: the function changes nothing except the copy of damaged data under the `….backup` key, which `loadItems` writes the same every time). Do not read the storage in an effect and then call `setItems`: that is an extra render, and with appending it gives duplicates (see below).

    **4. One write effect.**

    ```tsx
    useEffect(() => {
      saveItems(localStorage, items);
    }, [items]);
    ```

    The effect reads only `items`, so the [[dependency-array]] is `[items]`: the effect runs after every change of the list and not after a filter or form-draft change. `saveItems` always writes the **whole** list in place of the previous one, so running it again with the same list breaks nothing. No [[effect-cleanup|cleanup]] is needed here: the write switches nothing on that would have to be switched off. Do not remove `StrictMode` to “fix” a duplicate — fix the effect.

    **5. Check with the tools.** `npm run typecheck` and `npm run lint` — only the header lines; `npm run build` — `dist/app.js      1.2mb ⚠️` and `⚡ Done in 40ms`; `npm test` — `Passed: 30 · failed: 0`.

    **6. Check in the browser** (`npm start`, `http://127.0.0.1:4310/`). In DevTools open **Application → Local Storage → `http://127.0.0.1:4310`** and watch the key `jsll.wishlist.v1`. We checked with an empty storage (`localStorage.clear()` in the Console, then a reload):

    - right after loading, the key holds `{"schemaVersion":1,"records":[…]}` with **six** records and six different `id`s — although StrictMode runs the effect twice in development (we counted two `setItem` writes during the mount), the records did not become twelve;
    - a new wish, an “acquired” toggle and a confirmed delete — after a reload all three changes are there, and neither “acquired” nor the category is lost;
    - a filter change writes nothing (zero `setItem` calls): the filter is not a dependency of the effect;
    - damaged data (`localStorage.setItem("jsll.wishlist.v1", "{broken")` in the Console and a reload) — the page shows the six starting wishes, and the text `{broken` is kept under the key `jsll.wishlist.v1.backup`;
    - the Console has no red messages.

    **7. Commit.** `git status --short` — ` M main.tsx` and ` M ui/App.tsx`. `git add -A`, `git commit -m "Save the list with one effect"` — `[main 9c973ec] Save the list with one effect` and `2 files changed, 31 insertions(+), 11 deletions(-)`; `git diff HEAD~1 --stat -- domain storage` prints nothing.

    **Self-check:** every item of step 6 holds; `App` has one effect, with the array `[items]`; the storage is read only in the `useState` initializer (and in `main.tsx` before the first render); `npm run typecheck`, `npm run lint` — no findings, `npm test` — `failed: 0`.

    **If something goes wrong** (all reproduced on the wishlist):

    - Changes vanish after a reload, and the Console is silent — the effect has the array `[]`: it wrote only the first list. The dependency is the list itself.
    - A filter change writes the storage too (one extra `setItem` for us) — the effect has no dependency array, so it runs after every render.
    - Right after the first load there are twelve cards instead of six, and the Console says ``Encountered two children with the same key`` — the saved records are read in an effect and **appended** to the list: StrictMode runs such an effect twice. Read in the lazy initializer and write the whole list.

    The step's reference is `Download: RE-03 — The persistence effect` in the “References to download” section after the export. The commands were run on macOS only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це крок твого проєкту: ефекти, масив залежностей, лінивий ініціалізатор і StrictMode з цього розділу ти застосовуєш, щоб власний застосунок зберігав список у `localStorage` і нічого не дублював. Платформа цей крок не перевіряє: доказ — перевірка в браузері й commit."
  en: "This is a step of your project: you apply this unit's effects, dependency arrays, lazy initializer and StrictMode so that your own app keeps its list in `localStorage` and duplicates nothing. The platform does not check this step: the evidence is the check in the browser and the commit."
objectives:
  - uk: "Читати збережені записи один раз — лінивим ініціалізатором `useState` з перевіркою функцією `load…` зі `storage/`."
    en: "Read the saved records once — with a lazy `useState` initializer that checks them with the `load…` function of `storage/`."
  - uk: "Записувати весь список `{ schemaVersion: 1, records }` під ключем проєкту одним ефектом із залежністю від списку й пояснити, чому йому не потрібен cleanup."
    en: "Write the whole list `{ schemaVersion: 1, records }` under the project's key with one effect that depends on the list, and explain why it needs no cleanup."
  - uk: "Переконатися в браузері, що під StrictMode записи не дублюються й не губляться, а зміна фільтра нічого не записує."
    en: "Confirm in the browser that under StrictMode records are neither duplicated nor lost, and that a filter change writes nothing."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й браузері на твоєму комп’ютері: що змінити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and a browser on your computer: what to change, the expected output and the self-check list are above and on the step's page in your project."
