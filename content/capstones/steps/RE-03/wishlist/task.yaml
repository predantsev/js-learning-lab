# Wishlist variant of step RE-03 (a local step: done in the learner's editor, terminal and browser, no
# platform checks). Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2,
# Chrome) on the scratch project of this capstone after RE-02.
instructions:
  uk: |
    Збережи список `~/js-course/wishlist` у `localStorage` одним ефектом, не змінюючи `domain/` і `storage/`. Платформа цей крок не перевіряє; доказ — перевірка в браузері й commit.

    1. `main.tsx`: `const startingItems: Wish[] = loadItems(localStorage).ok ? [] : await loadFixtures();` і `<StrictMode><App startingItems={startingItems} … /></StrictMode>`.
    2. В `App` — лінивий ініціалізатор: `useState<Wish[]>(() => { const saved = loadItems(localStorage); return saved.ok ? saved.items : startingItems; })`.
    3. Один ефект: `useEffect(() => { saveItems(localStorage, items); }, [items]);` — записує весь список `{ schemaVersion: 1, records }` під ключем `jsll.wishlist.v1`; cleanup не потрібен.
    4. `npm run typecheck` і `npm run lint` — без зауважень; `npm test` — 30 тестів і `не пройшли: 0`.
    5. `npm start`, `http://127.0.0.1:4310/`, DevTools → Application → Local Storage: з порожнім сховищем ключ `jsll.wishlist.v1` одразу містить шість записів із різними `id` (StrictMode не подвоює їх); нові записи, зміни й видалення переживають перезавантаження, а «%%acquiredMark%%» і категорія не губляться; зміна фільтра нічого не записує; пошкоджені дані дають початковий список і копію під `jsll.wishlist.v1.backup`.
    6. `git add -A`, `git commit -m "Save the list with one effect"`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.
  en: |
    Save the list of `~/js-course/wishlist` to `localStorage` with one effect, without changing `domain/` and `storage/`. The platform does not check this step; the evidence is the check in the browser and the commit.

    1. `main.tsx`: `const startingItems: Wish[] = loadItems(localStorage).ok ? [] : await loadFixtures();` and `<StrictMode><App startingItems={startingItems} … /></StrictMode>`.
    2. In `App`, a lazy initializer: `useState<Wish[]>(() => { const saved = loadItems(localStorage); return saved.ok ? saved.items : startingItems; })`.
    3. One effect: `useEffect(() => { saveItems(localStorage, items); }, [items]);` — it writes the whole list `{ schemaVersion: 1, records }` under the key `jsll.wishlist.v1`; no cleanup is needed.
    4. `npm run typecheck` and `npm run lint` — no findings; `npm test` — 30 tests and `failed: 0`.
    5. `npm start`, `http://127.0.0.1:4310/`, DevTools → Application → Local Storage: with an empty storage the key `jsll.wishlist.v1` holds six records with different `id`s right away (StrictMode does not double them); new records, changes and deletes survive a reload, and “%%acquiredMark%%” and the category are not lost; a filter change writes nothing; damaged data gives the starting list and a copy under `jsll.wishlist.v1.backup`.
    6. `git add -A`, `git commit -m "Save the list with one effect"`; `git diff HEAD~1 --stat -- domain storage` prints nothing.
