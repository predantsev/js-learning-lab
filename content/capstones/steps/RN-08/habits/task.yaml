# Habit tracker variant of step RN-08 — the checkpoint CP-RN (a local step: done in the learner's editor,
# terminal and on the declared native target; no platform checks). An assessment: the instructions say
# what must be true and how it is proved, not how to build it; reference/ is the model solution, checked
# on macOS (Node.js 25.2.1, Expo SDK 57) with the course runner and Jest; nothing was run on a device.
strings:
  savedOnDeviceNote: { uk: "Збережено лише на цьому пристрої.", en: "Saved on this device only." }
  weekLinkLabel: { uk: "Останні 7 днів", en: "Last 7 days" }
  weekTitle: { uk: "Останні 7 днів", en: "The last 7 days" }
  weekRateLabel: { uk: "Виконано за тиждень", en: "Done this week" }
instructions:
  uk: |
    Контрольна точка CP-RN — без підказок, приблизно за годину: що має бути правдою і як це доводиться; як — вирішуєш ти. Платформа цей крок не перевіряє.

    1. Покращення: екран «%%weekTitle%%» (кнопка «%%weekLinkLabel%%» на списку): для кожної звички сім днів, що закінчуються сьогоднішнім днем з адаптера годинника, найстаріший перший, кожен — виконано чи ні з `completions`; «%%weekRateLabel%%» у відсотках через `summarizeHabit` за ці сім днів.
    2. Дані: покращення читає збережені записи на кожному фокусі — зміна, зроблена деінде, офлайн чи перед перезапуском, видна в ньому; екран каже, що дані лише на цьому пристрої.
    3. Доступність: кожен елемент керування підписаний і має роль; кожна клітинка звучить датою й «%%doneDayMark%%» чи «%%missedDayMark%%».
    4. Тести: правило покращення — у модулі без React Native з тестом під курсовим runner; щонайменше один тест Jest бачить покращення як людина й падає, якщо зламати групування, порядок чи підсумок. `npx tsc --noEmit` — жодного рядка; `npm test` — без невдалих (у нашому еталоні 60 тести runner і 5 Jest).
    5. Шість перевірок на випускній збірці RN-11 на заявленій цілі: restart, offline, lifecycle, security, a11y, performance.
    6. Записи: `EVIDENCE.md`, розділ «RN-08», і `evidence/records.js` з `evidence/evidence.js` уроку про походження — по запису на кожну перевірку й пропуск іншої платформи; тест: `judge` не відкидає жодного запису; пропуск — без результату.
    7. Commit; `git status` — чисто; копії `domain/`, `data/model.ts` і reducer'а без змін.
  en: |
    Checkpoint CP-RN — without hints, in about an hour: what must be true and how it is proved; how is up to you. The platform does not check this step.

    1. The enhancement: a screen “%%weekTitle%%” (a “%%weekLinkLabel%%” button on the list): for every habit the seven days that end on today of the clock adapter, the oldest first, each done or not from `completions`; “%%weekRateLabel%%” in percent through `summarizeHabit` over these seven days.
    2. Data: the enhancement reads the saved records on every focus — a change made elsewhere, offline or before a restart shows in it; the screen says the data is on this device only.
    3. Accessibility: every control is labeled and has a role; every cell is read as its date and “%%doneDayMark%%” or “%%missedDayMark%%”.
    4. Tests: the enhancement's rule lives in a module without React Native with a test under the course runner; at least one Jest test sees the enhancement as a person does and fails when the grouping, the order or the total is broken. `npx tsc --noEmit` — not a single line; `npm test` — no failures (60 runner tests and 5 Jest tests in our reference).
    5. Six checks on the RN-11 release build on the declared target: restart, offline, lifecycle, security, a11y, performance.
    6. Records: `EVIDENCE.md`, a section “RN-08”, and `evidence/records.js` with `evidence/evidence.js` of the provenance lesson — one record per check and a skip of the other platform; a test: `judge` rejects no record; a skip has no result.
    7. A commit; `git status` — clean; the copies of `domain/`, `data/model.ts` and the reducer unchanged.
