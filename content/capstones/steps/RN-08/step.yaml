# Capstone step of unit RN-08 — the native checkpoint CP-RN (wording shared by the four capstones; the
# enhancement of each capstone is in <capstone>/task.yaml). An assessment: the intro and the task say what
# must be true and how each check is proved, never how to build the enhancement; the reference/ is the
# complete model solution.
# The compiler also writes the syllabus lesson of kind capstone-step of RN-08 from this file.
# Teaching order: …, RN-11, RN-08 — this step continues the RN-11 reference (build 1.0.1 (2)).
# A local step: done in the learner's editor, terminal and on the declared native target; no platform checks.
# Every computer-side command was run on macOS (Node.js 25.2.1, npm 11.6.2, Expo SDK 57) in a scratch home
# on all four projects, continuing the RN-11 scratch projects: tsc, `npm test` (the course runner with the
# enhancement's rule and the judged records of evidence/records.js, then Jest with a test of the
# enhancement as a person sees it; Ukrainian and English strings), expo export for android and ios, the
# commit. Deliberately wrong variants failed the tests: the group without a category first, the overdue
# order without priority, a category filter that does nothing, a skip record that claims a result. No
# check of the six was performed on a native target: the reference's records are all skips, judged
# "skipped" by the course's evidence.js. Quoted output is from the wishlist run.
# reference/ is the native project after the checkpoint without the files the template generates and the
# platform cannot carry (assets/*.png, LICENSE, package-lock.json, node_modules/).
unit: RN-08
mode: local
entry: App.tsx
title:
  uk: "Контрольна точка CP-RN"
  en: "Checkpoint CP-RN"
intro:
  uk: |
    Контрольна точка React Native-етапу. Без підказок і приблизно за годину додай до нативного проєкту одне покращення на заявленій цілі, проведи його через шість перевірок і запиши кожен результат із походженням — зокрема перевірки, яких твій комп’ютер не підтримує. Що побудувати — у завданні твого проєкту; **як** — вирішуєш ти.

    | Проєкт | Покращення |
    |---|---|
    | Список бажань | фільтр категорій: кількість у кожній, сума ще бажаних із ціною, бажання без ціни — окремо |
    | Планувальник | прострочені: невиконані з терміном до переданого дня, спершу високий пріоритет |
    | Трекер звичок | сітка семи днів для кожної звички з `completions` і частка виконаних за тиждень |
    | Трекер витрат | місячний підсумок категорій в `amountMinor` з фільтром категорії |

    | Перевірка | Що зробити на заявленій цілі | Доказ |
    |---|---|---|
    | restart | змінити дані, повністю закрити застосунок, відкрити знову | зміни на місці, покращення показує їх |
    | offline | режим польоту, змінити дані, перезапустити | зміни на місці; екран каже, що дані лише на цьому пристрої |
    | lifecycle | фон і назад, вийти з екрана й повернутися | свіжі дані, без подвоєних оновлень |
    | security | — | жодного секрету в коді, конфігурації чи бандлі випуску (`git grep`, `grep -c -a` у бандлі) |
    | a11y | покращення з TalkBack чи VoiceOver | кожен елемент керування й кожне значення має назву й роль |
    | performance | один вимір на випускній збірці RN-11, не debug | рядок у `docs/PERF.md` |

    Запис кожної перевірки — у `EVIDENCE.md` і як дані в `evidence/records.js` за правилами уроку про походження (`evidence/evidence.js` з того уроку без змін): виконана — ціль, збірка (commit, `versionName (versionCode)`, відбиток підпису), що зроблено, що побачено, `pass` чи `fail`, походження `learner-authored` чи `assisted`; невиконана — `provenance: 'skipped'`, причина й шлях назад, **без результату**. Чужий доказ — `supplied`, і він не твій pass. Пропуск ніколи не стає «passed».

    Перевірено на macOS (Node.js 25.2.1, Expo SDK 57) на всіх чотирьох проєктах: еталонне покращення, тести й записи. Цілі на тому комп’ютері не було: усі шість записів еталона — пропуски, і `judge` з `evidence.js` визнає кожен `skipped`, жодного `rejected`.

    **1. Стан на початку.** `cd ~/js-course/wishlist-native`, `git status` — чисто, `git log --oneline -1` — commit збірки 2 з RN-11. Обсяг — три рядки: що будуєш, чого воно торкається (екран, доменна функція, сховище), які перевірки й які з них будуть пропусками. Не вміщається в три рядки — завелике для години.

    **2. Покращення.** Побудуй його за завданням проєкту. Копії `domain/`, `data/model.ts` і reducer не змінюються. Щонайменше один новий тест у Jest перевіряє покращення так, як його бачить людина, і падає, якщо зламати групування, порядок чи підсумок; правило покращення — у модулі без React Native з тестом під курсовим runner.

    **3. Перевірка на комп’ютері.** `npx tsc --noEmit` — жодного рядка; `npm test` — курсовий runner `не пройшли: 0` (у нашому еталоні 57 тестів), потім Jest без `✕` (у нас `Tests: 5 passed, 5 total`); `npx expo export --platform android` — у нас `Android Bundled 2495ms index.ts (948 modules)`.

    **4. Шість перевірок.** На випускній збірці, встановленій на заявлену ціль (кроки RN-11), — кожна за таблицею вище. Збірка змінилася — перевірки, зроблені на старій, не рахуються для нової: новий versionCode, нові перевірки.

    **5. Записи.** `EVIDENCE.md` — розділ «RN-08»: по запису на кожну із шести перевірок і пропуск іншої платформи; ті самі записи — в `evidence/records.js` з тестом, що жоден не `rejected`. Невдала перевірка лишається `fail`, доки не полагоджена й не перевірена знову. Без цілі всі перевірки на ній — пропуски; тоді на сторінці кроку — «У мене немає емулятора чи пристрою», а не «Цей крок виконано».

    **6. Commit.** `git add -A`, `git commit -m "CP-RN: add the checkpoint enhancement and record the evidence and skips"` — у нас `15 files changed`; `git status` — чисто.

    **Самоперевірка — рубрика CP-RN:** покращення працює на заявленій цілі або чесно записане як невиконане; новий тест падає на зламаному покращенні; кожна із шести перевірок має запис, і `judge` не відкидає жодного; жоден пропуск не має `observed` чи `outcome`; копії домену й контракту без змін; секретів у репозиторії й бандлі немає.

    Еталон кроку — `Завантажити: RN-08 — Контрольна точка CP-RN` після експорту, лише після власної спроби (без `assets/*.png`, `LICENSE`, `package-lock.json` і `node_modules/` — див. крок RN-01). Команди виконано лише на macOS; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    The checkpoint of the React Native stage. Without hints and in about an hour, add one enhancement to the native project on the declared target, take it through six checks and record every result with its provenance — including the checks your computer does not support. What to build is in your project's task; **how** is up to you.

    | Project | Enhancement |
    |---|---|
    | Wishlist | a category filter: the count of each, the total of wanted wishes with a price, the wishes without a price apart |
    | Planner | overdue: pending tasks due before the given day, the high priority first |
    | Habit tracker | a seven-day grid per habit from `completions` and the share done this week |
    | Expense tracker | a monthly summary of the categories in `amountMinor` with a category filter |

    | Check | What to do on the declared target | Evidence |
    |---|---|---|
    | restart | change data, close the app completely, reopen it | the changes are there, the enhancement shows them |
    | offline | airplane mode, change data, restart | the changes are there; the screen says the data is on this device only |
    | lifecycle | background and back, leave the screen and return | fresh data, no doubled updates |
    | security | — | no secret in the code, the config or the release bundle (`git grep`, `grep -c -a` in the bundle) |
    | a11y | the enhancement with TalkBack or VoiceOver | every control and every value has a name and a role |
    | performance | one measurement on the release build of RN-11, not debug | a line in `docs/PERF.md` |

    The record of every check goes into `EVIDENCE.md` and, as data, into `evidence/records.js` by the rules of the provenance lesson (`evidence/evidence.js` of that lesson, unchanged): a performed check — the target, the build (commit, `versionName (versionCode)`, signer fingerprint), what was done, what was seen, `pass` or `fail`, the provenance `learner-authored` or `assisted`; a check not performed — `provenance: 'skipped'`, the reason and the way back, **with no result**. Someone else's evidence is `supplied`, and it is not your pass. A skip never becomes “passed”.

    Checked on macOS (Node.js 25.2.1, Expo SDK 57) on all four projects: the reference enhancement, the tests and the records. There was no target on that computer: all six records of the reference are skips, and `judge` of `evidence.js` accepts every one as `skipped`, none `rejected`.

    **1. The starting state.** `cd ~/js-course/wishlist-native`, `git status` — clean, `git log --oneline -1` — the build 2 commit of RN-11. The scope — three lines: what you build, what it touches (a screen, a domain function, the storage), which checks and which of them will be skips. If it does not fit into three lines, it is too big for an hour.

    **2. The enhancement.** Build it as your project's task says. The copies of `domain/`, `data/model.ts` and the reducer do not change. At least one new Jest test checks the enhancement the way a person sees it and fails when the grouping, the order or the total is broken; the enhancement's rule lives in a module without React Native with a test under the course runner.

    **3. The check on the computer.** `npx tsc --noEmit` — not a single line; `npm test` — the course runner `failed: 0` (57 tests in our reference), then Jest without `✕` (ours: `Tests: 5 passed, 5 total`); `npx expo export --platform android` — for us `Android Bundled 2495ms index.ts (948 modules)`.

    **4. Six checks.** On the release build installed on the declared target (the RN-11 steps) — each as the table above says. When the build changes, checks made on the old one do not count for the new one: a new versionCode, new checks.

    **5. The records.** `EVIDENCE.md` — a section “RN-08”: one record for each of the six checks and a skip of the other platform; the same records in `evidence/records.js` with a test that none is `rejected`. A failed check stays `fail` until it is fixed and checked again. Without a target, every check on it is a skip; then, on the step's page, “I have no emulator or device”, not “I have done this step”.

    **6. Commit.** `git add -A`, `git commit -m "CP-RN: add the checkpoint enhancement and record the evidence and skips"` — for us `15 files changed`; `git status` — clean.

    **Self-check — the CP-RN rubric:** the enhancement works on the declared target or is honestly recorded as not performed; the new test fails on a broken enhancement; each of the six checks has a record, and `judge` rejects none; no skip has `observed` or `outcome`; the copies of the domain and the contract are unchanged; no secrets in the repository or the bundle.

    The step's reference is `Download: RN-08 — Checkpoint CP-RN` after the export, only after your own attempt (without `assets/*.png`, `LICENSE`, `package-lock.json` and `node_modules/` — see step RN-01). The commands were run on macOS only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це контрольна точка твого проєкту на етапі React Native: покращення на заявленій цілі, шість перевірок і чесні записи з походженням ти робиш без підказок. Платформа цей крок не перевіряє: доказ — тести, `EVIDENCE.md`, `evidence/records.js` і commit."
  en: "This is the checkpoint of your project at the React Native stage: an enhancement on the declared target, six checks and honest records with provenance, done without hints. The platform does not check this step: the evidence is the tests, `EVIDENCE.md`, `evidence/records.js` and the commit."
objectives:
  - uk: "Без підказок і приблизно за годину побудувати одне нативне покращення проєкту з тестом, що бачить його як людина."
    en: "Build, without hints and in about an hour, one native enhancement of the project with a test that sees it as a person does."
  - uk: "Провести покращення через перевірки restart, offline, lifecycle, security, a11y і performance на заявленій цілі й записати кожну з походженням, а непідтримувані — як пропуски з причиною й шляхом назад."
    en: "Take the enhancement through the restart, offline, lifecycle, security, a11y and performance checks on the declared target and record each with its provenance, the unsupported ones as skips with a reason and a way back."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й на заявленій нативній цілі: що має бути правдою, як це довести й рубрика — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and on the declared native target: what must be true, how to prove it and the rubric are above and on the step's page in your project."
