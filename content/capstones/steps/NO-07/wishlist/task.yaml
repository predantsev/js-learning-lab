# Wishlist variant of step NO-07 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS on the scratch project of this capstone after NO-05, in a Ukrainian and an English workspace,
# on Node.js 25.2.1 and 22.13.1 (curl 8.7.1): npm test (36 tests), the curl requests of the intro and the log
# lines. Wrong variants run against npm test, each failed at least one test: Content-Length only, no fast path,
# 413 without Connection: close, no server timeouts, errors objects with a prototype (validate, list), unknown
# or repeated query parameters ignored, the limit read with Number(), no id pattern, the route logged with the
# query, the body logged, every line at level info, any incoming request id trusted or every one ignored, the
# error message in the log, HOST defaulting to 0.0.0.0, no warning off loopback, the category length not
# checked. Not run on Linux or Windows.
instructions:
  uk: |
    Зміцни межу API: розмір і час, ключі без прототипу, список параметрів, форма `id`, loopback, логи з request id. Платформа цей крок не перевіряє.

    1. `src/body.ts`: швидкий шлях за `Content-Length`, лічильник частин, `413` з `Connection: close`.
    2. `src/server.ts`: `LIMITS` і `createRecordsServer(repository, log, limits)` з `headersTimeout`, `requestTimeout`, `connectionsCheckingInterval`; `start()` слухає `host` і попереджає поза loopback.
    3. `src/validate.ts`, `src/list.ts`: `errors` — `Object.create(null)`; `PARAMS` = `acquired`, `sort`, `limit`, `cursor` — `unknown-param`, `repeated`.
    4. `src/api.ts`: `V1Context`, `handleV1(req, res, context)`, `ID_PATTERN` = `/^w-\d{2,}$/`.
    5. `src/config.ts`: `HOST` (за замовчуванням `127.0.0.1`), `hostWarning`; `src/log.ts`: `requestIdOf`, `levelFor`, `errorLine`, `writeJsonLine`.
    6. `tests/hardening.test.ts` — правила бажання на межі: порожня після `trim` чи 81 символ `name`, від’ємна чи дробова `price`, `category` з 31 символу — кожне `400`, нічого не збережено; у лозі немає ні назви, ні ціни.
    7. Прогін з інтро; запит, що порушує кожне правило полів:

       ```text
       curl -sS http://127.0.0.1:4311/v1/records -H "content-type: application/json" -d '{"name":"   ","price":1.5,"category":"Подарунки для всієї родини на свята"}'
       {"error":{"code":"VALIDATION_FAILED","messageKey":"errors.validationFailed","details":{"name":"required","price":"not-whole","category":"too-long"},"requestId":"…"}}
       ```

    8. `docs/server.md`, розділ «NO-07»; `git commit -m "Harden the API edge: body and time limits, safe keys and paths, loopback, request-id logs"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ tests 36`, `ℹ fail 0`.
    - Тіло з 5000 символів `chunked` — `413`, `connection: close`; `..%2Fpackage.json` — `400` `{"id":"malformed"}`; `?limit=1e1&page=2` — обидві причини.
    - `{"__proto__":…}` — `"__proto__":"unknown-field"` у `details`.
    - Свій `x-request-id` форми `support-ticket-0042` повертається у відповіді й у рядку логу; рядок логу — сім полів, без `?` і тіла.
    - `npm run typecheck` — жодного рядка; `npm run check` і `npm run check:server` — усі `✔`.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Harden the API edge: size and time, keys without a prototype, a parameter allowlist, the `id` shape, loopback, logs with request ids. The platform does not check this step.

    1. `src/body.ts`: the fast path by `Content-Length`, the chunk counter, a `413` with `Connection: close`.
    2. `src/server.ts`: `LIMITS` and `createRecordsServer(repository, log, limits)` with `headersTimeout`, `requestTimeout`, `connectionsCheckingInterval`; `start()` listens on `host` and warns off loopback.
    3. `src/validate.ts`, `src/list.ts`: `errors` is `Object.create(null)`; `PARAMS` = `acquired`, `sort`, `limit`, `cursor` — `unknown-param`, `repeated`.
    4. `src/api.ts`: `V1Context`, `handleV1(req, res, context)`, `ID_PATTERN` = `/^w-\d{2,}$/`.
    5. `src/config.ts`: `HOST` (`127.0.0.1` by default), `hostWarning`; `src/log.ts`: `requestIdOf`, `levelFor`, `errorLine`, `writeJsonLine`.
    6. `tests/hardening.test.ts` — the wish rules at the edge: a `name` empty after `trim` or of 81 characters, a negative or fractional `price`, a `category` of 31 characters — each a `400`, nothing stored; neither the name nor the price in the log.
    7. The run of the intro; a request that breaks every field rule:

       ```text
       curl -sS http://127.0.0.1:4311/v1/records -H "content-type: application/json" -d '{"name":"   ","price":1.5,"category":"Gifts for the whole family on holidays"}'
       {"error":{"code":"VALIDATION_FAILED","messageKey":"errors.validationFailed","details":{"name":"required","price":"not-whole","category":"too-long"},"requestId":"…"}}
       ```

    8. `docs/server.md`, a section “NO-07”; `git commit -m "Harden the API edge: body and time limits, safe keys and paths, loopback, request-id logs"`.

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ tests 36`, `ℹ fail 0`.
    - A `chunked` body of 5000 characters — `413`, `connection: close`; `..%2Fpackage.json` — `400` `{"id":"malformed"}`; `?limit=1e1&page=2` — both reasons.
    - `{"__proto__":…}` — `"__proto__":"unknown-field"` in `details`.
    - Your own `x-request-id` of the shape `support-ticket-0042` comes back in the answer and in the log line; a log line is seven fields, no `?` and no body.
    - `npm run typecheck` — not a single line; `npm run check` and `npm run check:server` — every check `✔`.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
