# Habit tracker variant of step NO-07 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS on the scratch project of this capstone after NO-05, in a Ukrainian and an English workspace,
# on Node.js 25.2.1 and 22.13.1 (curl 8.7.1): npm test (44 tests), the curl requests of the intro and the log
# lines. Wrong variants run against npm test, each failed at least one test: the 18 of the wishlist except the
# category one, plus a non-real completion accepted (also on a create only, and by "done today"), no
# completions limit (also on "done today"), the habit name in the log (also of a refused create).
# Not run on Linux or Windows.
instructions:
  uk: |
    Зміцни межу API: розмір і час, ключі без прототипу, список параметрів, форма `id`, loopback, логи з request id. Платформа цей крок не перевіряє.

    1. `src/body.ts`: швидкий шлях за `Content-Length`, лічильник частин, `413` з `Connection: close`.
    2. `src/server.ts`: `LIMITS` і `createRecordsServer(repository, log, limits)` з `headersTimeout`, `requestTimeout`, `connectionsCheckingInterval`; `start()` слухає `host` і попереджає поза loopback.
    3. `src/validate.ts`, `src/list.ts`: `errors` — `Object.create(null)`; `PARAMS` = `active`, `sort`, `limit`, `cursor` — `unknown-param`, `repeated`.
    4. `src/api.ts`: `V1Context`, `handleV1(req, res, context)`, `ID_PATTERN` = `/^h-\d{2,}$/`.
    5. `src/config.ts`: `HOST` (за замовчуванням `127.0.0.1`), `hostWarning`; `src/log.ts`: `requestIdOf`, `levelFor`, `errorLine`, `writeJsonLine`.
    6. `tests/hardening.test.ts` — правила звички на межі: невідома `frequency`, порожня чи 81 символ `name`, `completions` не різні й не за зростанням, день, якого не буває (`2026-02-30` — `bad-date`, також у `POST /v1/records/:id/completions`), більше за `MAX_COMPLETIONS` = 1000 днів — `too-many` (і «зроблено сьогодні» не пройде межу); назви звичок у лозі немає.
    7. Прогін з інтро; запит, що порушує кожне правило полів:

       ```text
       curl -sS http://127.0.0.1:4311/v1/records -H "content-type: application/json" -d '{"name":"   ","frequency":"щомісяця","completions":["2026-02-30","2026-02-30"]}'
       {"error":{"code":"VALIDATION_FAILED","messageKey":"errors.validationFailed","details":{"name":"required","frequency":"unknown","completions":"bad-date"},"requestId":"…"}}
       ```

    8. `docs/server.md`, розділ «NO-07»; `git commit -m "Harden the API edge: body and time limits, safe keys and paths, loopback, request-id logs"`.

    **Спробуй зламати (крок «Спробуй зламати» інтро), назви тестів цього проєкту:** прибери лічильник частин — `✖ a body over 4096 bytes without Content-Length (chunked) is 413 with Connection: close, and nothing is stored`; поверни `const errors = {}` у `validate.ts` — `✖ __proto__ and constructor in a body are unknown fields, and no prototype changes`; пиши в лог `req.url` — `✖ one JSON log line per request: request id, method, route without the query, status, duration — never the body`; приймай будь-який вхідний `X-Request-Id` — `✖ a well-formed incoming X-Request-Id is kept; a malformed one is replaced by the server's own`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ tests 44`, `ℹ fail 0`.
    - Тіло з 5000 символів `chunked` — `413`, `connection: close`; `..%2Fpackage.json` — `400` `{"id":"malformed"}`; `?limit=1e1&page=2` — обидві причини.
    - `{"__proto__":…}` — `"__proto__":"unknown-field"` у `details`.
    - Свій `x-request-id` форми `support-ticket-0042` повертається у відповіді й у рядку логу; рядок логу — сім полів, без `?` і тіла.
    - `npm run typecheck` — жодного рядка; `npm run check` і `npm run check:server` — усі `✔`.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Harden the API edge: size and time, keys without a prototype, a parameter allowlist, the `id` shape, loopback, logs with request ids. The platform does not check this step.

    1. `src/body.ts`: the fast path by `Content-Length`, the chunk counter, a `413` with `Connection: close`.
    2. `src/server.ts`: `LIMITS` and `createRecordsServer(repository, log, limits)` with `headersTimeout`, `requestTimeout`, `connectionsCheckingInterval`; `start()` listens on `host` and warns off loopback.
    3. `src/validate.ts`, `src/list.ts`: `errors` is `Object.create(null)`; `PARAMS` = `active`, `sort`, `limit`, `cursor` — `unknown-param`, `repeated`.
    4. `src/api.ts`: `V1Context`, `handleV1(req, res, context)`, `ID_PATTERN` = `/^h-\d{2,}$/`.
    5. `src/config.ts`: `HOST` (`127.0.0.1` by default), `hostWarning`; `src/log.ts`: `requestIdOf`, `levelFor`, `errorLine`, `writeJsonLine`.
    6. `tests/hardening.test.ts` — the habit rules at the edge: an unknown `frequency`, an empty or 81-character `name`, `completions` that are not different and ascending, a day that does not exist (`2026-02-30` — `bad-date`, also in `POST /v1/records/:id/completions`), more than `MAX_COMPLETIONS` = 1000 days — `too-many` (and "done today" cannot pass the limit); no habit name in the log.
    7. The run of the intro; a request that breaks every field rule:

       ```text
       curl -sS http://127.0.0.1:4311/v1/records -H "content-type: application/json" -d '{"name":"   ","frequency":"every month","completions":["2026-02-30","2026-02-30"]}'
       {"error":{"code":"VALIDATION_FAILED","messageKey":"errors.validationFailed","details":{"name":"required","frequency":"unknown","completions":"bad-date"},"requestId":"…"}}
       ```

    8. `docs/server.md`, a section “NO-07”; `git commit -m "Harden the API edge: body and time limits, safe keys and paths, loopback, request-id logs"`.

    **Try to break it (the intro's "Try to break it" step), with this project's test names:** remove the chunk counter — `✖ a body over 4096 bytes without Content-Length (chunked) is 413 with Connection: close, and nothing is stored`; bring back `const errors = {}` in `validate.ts` — `✖ __proto__ and constructor in a body are unknown fields, and no prototype changes`; log `req.url` — `✖ one JSON log line per request: request id, method, route without the query, status, duration — never the body`; accept any incoming `X-Request-Id` — `✖ a well-formed incoming X-Request-Id is kept; a malformed one is replaced by the server's own`.

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ tests 44`, `ℹ fail 0`.
    - A `chunked` body of 5000 characters — `413`, `connection: close`; `..%2Fpackage.json` — `400` `{"id":"malformed"}`; `?limit=1e1&page=2` — both reasons.
    - `{"__proto__":…}` — `"__proto__":"unknown-field"` in `details`.
    - Your own `x-request-id` of the shape `support-ticket-0042` comes back in the answer and in the log line; a log line is seven fields, no `?` and no body.
    - `npm run typecheck` — not a single line; `npm run check` and `npm run check:server` — every check `✔`.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
