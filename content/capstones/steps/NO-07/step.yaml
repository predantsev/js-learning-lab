# Capstone step of unit NO-07 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson of kind capstone-step of NO-07 from this file.
# A local step: done in the learner's editor and terminal; no platform checks. The project page shows only
# the intro of a local step, so the intro carries the whole procedure.
# Every command was run on macOS in a scratch home on all four projects, continuing the NO-05 references, in a
# Ukrainian and an English workspace, on Node.js 25.2.1 (npm 11.6.2, curl 8.7.1) and on Node.js 22.13.1
# (npm 10.9.2, with NODE_OPTIONS=--experimental-strip-types): npm start, the curl requests of the intro, the
# JSON log lines, npm test, npm run check, npm run check:server, npm run typecheck. Deliberately wrong
# variants were run against npm test on all four; each failed at least one test (listed in the task files'
# headers and in the hand-back). Quoted output is from the wishlist run in the Ukrainian workspace on Node.js
# 25.2.1. Not run: Linux, Windows.
# reference/ is the NO-05 reference plus the files of this step (without node_modules/, package-lock.json and
# the runtime folders server/data/ and server/.check/); sample names in tests/ are fixture strings.
unit: NO-07
