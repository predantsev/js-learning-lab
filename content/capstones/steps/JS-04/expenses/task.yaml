# Expense tracker variant of step JS-04. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect). The six expenses are the
# synthetic fixtures of content/capstones/domains.yaml.
strings:
  fixture1Name: { uk: "Продукти на тиждень", en: "Weekly groceries" }
  fixture2Name: { uk: "Проїзний", en: "Transit pass" }
  fixture3Name: { uk: "Кава з друзями", en: "Coffee with friends" }
  fixture4Name: { uk: "Лампочки", en: "Light bulbs" }
  fixture5Name: { uk: "Квитки в кіно", en: "Cinema tickets" }
  fixture6Name: { uk: "Обід", en: "Lunch" }
  newName: { uk: "Таксі", en: "Taxi" }
instructions:
  uk: |
    Тепер у проєкті з’являється весь список витрат. Заміни дві окремі витрати з попередніх кроків (`firstExpense` і `secondExpense`) масивом `expenses` з усіма шістьма витратами — скопіюй його в `app.js`:

    ```js
    const expenses = [
      { id: "e-01", label: "%%fixture1Name%%", amountMinor: 84550, date: "2026-03-01", category: "food" },
      { id: "e-02", label: "%%fixture2Name%%", amountMinor: 52000, date: "2026-03-01", category: "transport" },
      { id: "e-03", label: "%%fixture3Name%%", amountMinor: 18000, date: "2026-02-28", category: "fun" },
      { id: "e-04", label: "%%fixture4Name%%", amountMinor: 9990, date: "2026-02-27", category: "home" },
      { id: "e-05", label: "%%fixture5Name%%", amountMinor: 30000, date: "2026-02-27", category: "fun" },
      { id: "e-06", label: "%%fixture6Name%%", amountMinor: 21050, date: "2026-03-02", category: "food" },
    ];
    ```

    Потім напиши на верхньому рівні `app.js` три функції. Параметр `list` — будь-який список витрат, не лише `expenses`. Жодна з функцій не змінює ні масив, який отримала, ні витрати в ньому.

    1. **`addExpense(list, id, input)`** повертає **новий** масив: усі витрати з `list` і в кінці нова. Чернетку `input` спершу перевіряє твоя `validateExpense`: якщо вона повертає `ok: false`, `addExpense` повертає список без змін. Нова витрата — запис із полями `id` (з параметра), `label`, `amountMinor`, `date` і `category` (з `value`, яке повернула перевірка).
    2. **`updateExpense(list, id, changes)`** повертає **новий** масив, у якому витрата з цим `id` замінена **новим** записом: усі поля старої витрати, а поверх них — поля з `changes`. Інші витрати переходять у новий масив тими самими об’єктами. Якщо витрати з таким `id` немає, у новому масиві ті самі витрати.
    3. **`removeExpense(list, id)`** повертає **новий** масив без витрати з цим `id`; решта — ті самі об’єкти в тому самому порядку.

    **Сторінка.** У `index.html` заміни абзаци `first-label` і `second-label` двома порожніми абзацами з `id` `list-before` і `list-after`; абзаци повідомлень чернетки залиш. Наприкінці `app.js`:

    - зроби по черзі три зміни, кожна з яких дає новий список: додай витрату `"e-07"` з виправленої чернетки `{ label: "%%newName%%", amountMinor: 15050, date: "2026-03-02", category: "transport" }`, постав витраті `"e-04"` суму `10990` і видали витрату `"e-03"`;
    - у `list-before` запиши підписи всіх витрат з `expenses` одним текстом, наприклад через `; `, а в `list-after` — так само підписи списку після трьох змін.

    **Як перевірятиметься:** на сторінці є список до змін — шість назв по порядку, «%%fixture4Name%%» ще із сумою `99%%decimalMark%%90` — і список після змін: «%%fixture1Name%%», «%%fixture2Name%%», «%%fixture4Name%%», «%%fixture5Name%%», «%%fixture6Name%%» і в кінці «%%newName%%», без «%%fixture3Name%%», а «%%fixture4Name%%» — із сумою `109%%decimalMark%%90`; `expenses` після цього лишається тими самими шістьма витратами. Ще платформа викликає твої функції з різними списками — і з порожнім, — з правильною й хибною чернеткою та з невідомим `id` і перевіряє: результат — новий масив, незмінені витрати — ті самі об’єкти (`===`), змінена витрата — новий об’єкт зі старими полями, а отриманий список і його витрати не змінилися.

    Перш ніж перевіряти, виведи через `console.log`, що дає `===` між витратами старого й нового списку після `updateExpense`, і подивись на вкладку «Консоль»: для незмінених витрат має бути `true`, для зміненої — `false`.
  en: |
    Now the project gets the whole list of expenses. Replace the two separate expenses from the previous steps (`firstExpense` and `secondExpense`) with the array `expenses` holding all six expenses — copy it into `app.js`:

    ```js
    const expenses = [
      { id: "e-01", label: "%%fixture1Name%%", amountMinor: 84550, date: "2026-03-01", category: "food" },
      { id: "e-02", label: "%%fixture2Name%%", amountMinor: 52000, date: "2026-03-01", category: "transport" },
      { id: "e-03", label: "%%fixture3Name%%", amountMinor: 18000, date: "2026-02-28", category: "fun" },
      { id: "e-04", label: "%%fixture4Name%%", amountMinor: 9990, date: "2026-02-27", category: "home" },
      { id: "e-05", label: "%%fixture5Name%%", amountMinor: 30000, date: "2026-02-27", category: "fun" },
      { id: "e-06", label: "%%fixture6Name%%", amountMinor: 21050, date: "2026-03-02", category: "food" },
    ];
    ```

    Then write three functions at the top level of `app.js`. The parameter `list` is any list of expenses, not only `expenses`. None of the functions changes the array it receives or the expenses in it.

    1. **`addExpense(list, id, input)`** returns a **new** array: all expenses of `list` and the new one at the end. Your `validateExpense` checks the draft `input` first: when it returns `ok: false`, `addExpense` returns the list unchanged. The new expense is a record with the fields `id` (from the parameter), `label`, `amountMinor`, `date` and `category` (from the `value` the check returned).
    2. **`updateExpense(list, id, changes)`** returns a **new** array in which the expense with this `id` is replaced by a **new** record: all fields of the old expense, with the fields of `changes` on top. The other expenses move into the new array as the same objects. When there is no expense with this `id`, the new array holds the same expenses.
    3. **`removeExpense(list, id)`** returns a **new** array without the expense with this `id`; the rest are the same objects in the same order.

    **The page.** In `index.html`, replace the paragraphs `first-label` and `second-label` with two empty paragraphs with the `id`s `list-before` and `list-after`; keep the draft message paragraphs. At the end of `app.js`:

    - make three changes in turn, each giving a new list: add the expense `"e-07"` from the corrected draft `{ label: "%%newName%%", amountMinor: 15050, date: "2026-03-02", category: "transport" }`, give the expense `"e-04"` the amount `10990` and remove the expense `"e-03"`;
    - write the labels of all expenses of `expenses` into `list-before` as one text, for example separated by `; `, and the labels of the list after the three changes into `list-after` in the same way.

    **How it is checked:** the page has the list before the changes — the six labels in order, “%%fixture4Name%%” still with the amount `99%%decimalMark%%90` — and the list after the changes: “%%fixture1Name%%”, “%%fixture2Name%%”, “%%fixture4Name%%”, “%%fixture5Name%%”, “%%fixture6Name%%” and “%%newName%%” at the end, without “%%fixture3Name%%”, and “%%fixture4Name%%” with the amount `109%%decimalMark%%90`; after this `expenses` is still the same six expenses. The platform also calls your functions with different lists — an empty one too — with a valid and an invalid draft and with an unknown `id`, and checks: the result is a new array, untouched expenses are the same objects (`===`), a changed expense is a new object with the old fields, and the received list and its expenses did not change.

    Before checking, print with `console.log` what `===` gives between the expenses of the old and the new list after `updateExpense`, and look at the “Console” tab: it should be `true` for untouched expenses and `false` for the changed one.
nudge:
  uk: "Новий масив можна зібрати з порожнього: обійди отриманий список циклом `for...of` і клади в новий те, що має в ньому бути. Згадай і spread: `[...colors, \"red\"]` дає новий масив з ще одним кольором, а `{ ...settings, theme: \"dark\" }` — новий об’єкт налаштувань з іншою темою; старі `colors` і `settings` лишаються такими, як були."
  en: "A new array can be built from an empty one: go through the received list with a `for...of` loop and put into the new one what belongs there. Recall spread too: `[...colors, \"red\"]` gives a new array with one more color, and `{ ...settings, theme: \"dark\" }` gives a new settings object with another theme; the old `colors` and `settings` stay as they were."
testTitles:
  "the script runs without errors":
    uk: "Скрипт працює без помилок"
    en: "The script runs without errors"
  "the page shows the list before the changes":
    uk: "Сторінка показує список до змін: шість витрат, «%%fixture4Name%%» ще із сумою `99%%decimalMark%%90`"
    en: "The page shows the list before the changes: six expenses, “%%fixture4Name%%” still with the amount `99%%decimalMark%%90`"
  "the page shows the list after the changes":
    uk: "Сторінка показує список після змін: з «%%newName%%», без «%%fixture3Name%%», «%%fixture4Name%%» — із сумою `109%%decimalMark%%90`"
    en: "The page shows the list after the changes: with “%%newName%%”, without “%%fixture3Name%%”, “%%fixture4Name%%” with the amount `109%%decimalMark%%90`"
  "expenses holds the six expenses and stays unchanged":
    uk: "`expenses` — ті самі шість витрат і після роботи сторінки"
    en: "`expenses` is still the same six expenses after the page script"
  "addExpense adds a checked expense to the end of a new list":
    uk: "`addExpense` додає перевірену витрату в кінець нового масиву"
    en: "`addExpense` adds a checked expense to the end of a new array"
  "addExpense keeps the list for a draft that fails the check":
    uk: "`addExpense` не додає чернетку, яку не прийняла `validateExpense`"
    en: "`addExpense` does not add a draft that `validateExpense` rejects"
  "updateExpense changes only the given fields of one expense":
    uk: "`updateExpense` змінює лише вказані поля однієї витрати — у новому об’єкті"
    en: "`updateExpense` changes only the given fields of one expense — in a new object"
  "updateExpense with a new category keeps the label and the date":
    uk: "`updateExpense` з новою категорією зберігає назву й дату"
    en: "`updateExpense` with a new category keeps the label and the date"
  "updateExpense with an unknown id keeps every expense":
    uk: "`updateExpense` з невідомим `id` чи порожнім списком нічого не змінює"
    en: "`updateExpense` with an unknown `id` or an empty list changes nothing"
  "removeExpense removes only that expense":
    uk: "`removeExpense` прибирає лише одну витрату, а інші лишає тими самими об’єктами"
    en: "`removeExpense` removes only one expense and keeps the others as the same objects"
  "removeExpense with an unknown id keeps every expense":
    uk: "`removeExpense` з невідомим `id` чи порожнім списком нічого не змінює"
    en: "`removeExpense` with an unknown `id` or an empty list changes nothing"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що скрипт виконається до кінця без помилки; інакше не проходять і перевірки сторінки. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль». Якщо там `ReferenceError` про `firstExpense` чи `secondExpense`, то код сторінки ще звертається до записів, яких уже немає."
      en: "This check expects the script to run to the end without an error; otherwise the page checks fail too. The “Console” tab shows the error name and the line of code where it happened. If it shows a `ReferenceError` about `firstExpense` or `secondExpense`, the page code still uses records that are gone."
  - when: { test: "the page shows the list before the changes" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого всі шість назв з `expenses` ідуть по порядку, а «%%fixture4Name%%» ще із сумою `99%%decimalMark%%90`. Якщо там уже `109%%decimalMark%%90`, то список до змін показує змінену витрату — а старий список має лишатися таким, як був."
      en: "This check looks inside `<main>` for an element whose text has all six labels of `expenses` in order, with “%%fixture4Name%%” still at the amount `99%%decimalMark%%90`. If it already shows `109%%decimalMark%%90`, the list before the changes shows a changed expense — but the old list must stay as it was."
  - when: { test: "the page shows the list after the changes" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого по порядку йдуть «%%fixture1Name%%», «%%fixture2Name%%», «%%fixture4Name%%», «%%fixture5Name%%», «%%fixture6Name%%» і в кінці «%%newName%%», немає «%%fixture3Name%%», а «%%fixture4Name%%» має суму `109%%decimalMark%%90`."
      en: "This check looks inside `<main>` for an element whose text has “%%fixture1Name%%”, “%%fixture2Name%%”, “%%fixture4Name%%”, “%%fixture5Name%%”, “%%fixture6Name%%” in order and “%%newName%%” at the end, has no “%%fixture3Name%%”, and has “%%fixture4Name%%” with the amount `109%%decimalMark%%90`."
  - when: { test: "expenses holds the six expenses and stays unchanged" }
    message:
      uk: "Ця перевірка чекає, що масив `expenses` на верхньому рівні `app.js` — саме ті шість витрат із завдання з тими самими полями, і після роботи сторінки теж. Якщо поля змінилися, то `expenses` або його витрати змінено на місці, а кожна зміна має давати новий список."
      en: "This check expects the array `expenses` at the top level of `app.js` to be exactly the six expenses of the task with the same fields, also after the page script ran. If fields changed, `expenses` or its expenses were changed in place, while every change must give a new list."
  - when: { test: "addExpense adds a checked expense to the end of a new list" }
    message:
      uk: "Ця перевірка викликає `addExpense(list, \"e-10\", { label: \"  Taxi \", amountMinor: 15050, date: \"2026-03-02\", category: \"transport\" })` і чекає новий масив із сімома витратами: перші шість — ті самі об’єкти, а в кінці `{ id: \"e-10\", label: \"Taxi\", amountMinor: 15050, date: \"2026-03-02\", category: \"transport\" }`. Отриманий список не змінюється, а з порожнього списку виходить масив з однією витратою."
      en: "This check calls `addExpense(list, \"e-10\", { label: \"  Taxi \", amountMinor: 15050, date: \"2026-03-02\", category: \"transport\" })` and expects a new array of seven expenses: the first six are the same objects, and `{ id: \"e-10\", label: \"Taxi\", amountMinor: 15050, date: \"2026-03-02\", category: \"transport\" }` comes at the end. The received list does not change, and an empty list gives an array with one expense."
  - when: { test: "addExpense keeps the list for a draft that fails the check" }
    message:
      uk: "Ця перевірка чекає, що чернетку із сумою `150.5` і порожньою категорією, яку не приймає `validateExpense`, `addExpense` не додає: у результаті ті самі шість витрат."
      en: "This check expects `addExpense` not to add the draft with the amount `150.5` and an empty category, which `validateExpense` rejects: the result holds the same six expenses."
  - when: { test: "updateExpense changes only the given fields of one expense" }
    message:
      uk: "Ця перевірка викликає `updateExpense(list, \"e-04\", { amountMinor: 10990 })` і чекає новий масив, у якому `e-04` — новий об’єкт з усіма старими полями й `amountMinor: 10990`, інші витрати — ті самі об’єкти, а отриманий список і його витрати не змінилися. Якщо змінилася й витрата `e-04` в отриманому списку, нове значення записано у спільний об’єкт."
      en: "This check calls `updateExpense(list, \"e-04\", { amountMinor: 10990 })` and expects a new array in which `e-04` is a new object with all old fields and `amountMinor: 10990`, the other expenses are the same objects, and the received list and its expenses did not change. If the expense `e-04` of the received list changed too, the new value was written into the shared object."
  - when: { test: "updateExpense with a new category keeps the label and the date" }
    message:
      uk: "Ця перевірка чекає, що `updateExpense(list, \"e-03\", { category: \"food\" })` дає витрату `e-03` з категорією `\"food\"` і тими самими назвою, сумою та датою, а в отриманому списку категорія лишається `\"fun\"`."
      en: "This check expects `updateExpense(list, \"e-03\", { category: \"food\" })` to give the expense `e-03` with the category `\"food\"` and the same label, amount and date, while the category stays `\"fun\"` in the received list."
  - when: { test: "updateExpense with an unknown id keeps every expense" }
    message:
      uk: "Ця перевірка чекає, що невідомий `id` нічого не змінює й нічого не ламає: у результаті ті самі шість витрат, а для порожнього списку — порожній масив."
      en: "This check expects an unknown `id` to change and break nothing: the result holds the same six expenses, and an empty list gives an empty array."
  - when: { test: "removeExpense removes only that expense" }
    message:
      uk: "Ця перевірка викликає `removeExpense(list, \"e-03\")` і чекає новий масив без `e-03`, де решта витрат — ті самі об’єкти в тому самому порядку, а отриманий список не змінився."
      en: "This check calls `removeExpense(list, \"e-03\")` and expects a new array without `e-03`, in which the other expenses are the same objects in the same order, while the received list did not change."
  - when: { test: "removeExpense with an unknown id keeps every expense" }
    message:
      uk: "Ця перевірка чекає для невідомого `id` ті самі шість витрат, а для порожнього списку — порожній масив."
      en: "This check expects the same six expenses for an unknown `id`, and an empty array for an empty list."
