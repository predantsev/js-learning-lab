  "the script runs without errors":
    uk: "Скрипт працює без помилок"
    en: "The script runs without errors"
  "the page shows the list before the changes":
    uk: "Сторінка показує список до змін: шість бажань, «%%fixture2Name%%» ще без «%%acquiredMark%%»"
    en: "The page shows the list before the changes: six wishes, “%%fixture2Name%%” still without “%%acquiredMark%%”"
  "the page shows the list after the changes":
    uk: "Сторінка показує список після змін: з «%%newName%%», без «%%fixture6Name%%», «%%fixture2Name%%» — з «%%acquiredMark%%»"
    en: "The page shows the list after the changes: with “%%newName%%”, without “%%fixture6Name%%”, “%%fixture2Name%%” with “%%acquiredMark%%”"
  "items holds the six wishes and stays unchanged":
    uk: "`items` — ті самі шість бажань і після роботи сторінки"
    en: "`items` is still the same six wishes after the page script"
  "addItem adds a checked wish to the end of a new list":
    uk: "`addItem` додає перевірене бажання в кінець нового масиву"
    en: "`addItem` adds a checked wish to the end of a new array"
  "addItem keeps the list for a draft that fails the check":
    uk: "`addItem` не додає чернетку, яку не прийняла `validateItem`"
    en: "`addItem` does not add a draft that `validateItem` rejects"
  "updateItem changes only the given fields of one wish":
    uk: "`updateItem` змінює лише вказані поля одного бажання — у новому об’єкті"
    en: "`updateItem` changes only the given fields of one wish — in a new object"
  "updateItem with a new price keeps the name and the category":
    uk: "`updateItem` з новою ціною зберігає назву й категорію"
    en: "`updateItem` with a new price keeps the name and the category"
  "updateItem with an unknown id keeps every wish":
    uk: "`updateItem` з невідомим `id` чи порожнім списком нічого не змінює"
