# Wishlist variant of step JS-04. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect). The six wishes are the
# synthetic fixtures of content/capstones/domains.yaml.
strings:
  fixture1Name: { uk: "Навушники", en: "Headphones" }
  fixture2Name: { uk: "Настільна лампа", en: "Desk lamp" }
  fixture3Name: { uk: "Велосипед", en: "Bicycle" }
  fixture4Name: { uk: "Книжка про JavaScript", en: "A book about JavaScript" }
  fixture5Name: { uk: "Квитки на концерт", en: "Concert tickets" }
  fixture6Name: { uk: "Термочашка", en: "Travel mug" }
  techCategory: { uk: "Техніка", en: "Tech" }
  homeCategory: { uk: "Дім", en: "Home" }
  sportCategory: { uk: "Спорт", en: "Sport" }
  booksCategory: { uk: "Книжки", en: "Books" }
  newName: { uk: "Рюкзак", en: "Backpack" }
instructions:
  uk: |
    Тепер у проєкті з’являється весь список бажань. Заміни два окремі бажання з попередніх кроків (`firstItem` і `secondItem`) масивом `items` з усіма шістьма бажаннями — скопіюй його в `app.js`:

    ```js
    const items = [
      { id: "w-01", name: "%%fixture1Name%%", price: 80, acquired: false, category: "%%techCategory%%" },
      { id: "w-02", name: "%%fixture2Name%%", price: 45, acquired: false, category: "%%homeCategory%%" },
      { id: "w-03", name: "%%fixture3Name%%", price: 240, acquired: false, category: "%%sportCategory%%" },
      { id: "w-04", name: "%%fixture4Name%%", price: 25, acquired: true, category: "%%booksCategory%%" },
      { id: "w-05", name: "%%fixture5Name%%", price: null, acquired: false, category: null },
      { id: "w-06", name: "%%fixture6Name%%", price: 18, acquired: true, category: "%%homeCategory%%" },
    ];
    ```

    Потім напиши на верхньому рівні `app.js` три функції. Параметр `list` — будь-який список бажань, не лише `items`. Жодна з функцій не змінює ні масив, який отримала, ні бажання в ньому.

    1. **`addItem(list, id, input)`** повертає **новий** масив: усі бажання з `list` і в кінці нове. Чернетку `input` спершу перевіряє твоя `validateItem`: якщо вона повертає `ok: false`, `addItem` повертає список без змін. Нове бажання — запис із полями `id` (з параметра), `name` і `price` (з `value`, яке повернула перевірка), `acquired: false` і `category: null`.
    2. **`updateItem(list, id, changes)`** повертає **новий** масив, у якому бажання з цим `id` замінене **новим** записом: усі поля старого бажання, а поверх них — поля з `changes`. Інші бажання переходять у новий масив тими самими об’єктами. Якщо бажання з таким `id` немає, у новому масиві ті самі бажання.
    3. **`removeItem(list, id)`** повертає **новий** масив без бажання з цим `id`; решта — ті самі об’єкти в тому самому порядку.

    **Сторінка.** У `index.html` заміни абзаци `first-label` і `second-label` двома порожніми абзацами з `id` `list-before` і `list-after`; абзаци повідомлень чернетки залиш. Наприкінці `app.js`:

    - зроби по черзі три зміни, кожна з яких дає новий список: додай бажання `"w-07"` з чернетки `{ name: "%%newName%%", price: 30 }`, познач бажання `"w-02"` отриманим (`acquired: true`) і видали бажання `"w-06"`;
    - у `list-before` запиши підписи всіх бажань з `items` одним текстом, наприклад через `; `, а в `list-after` — так само підписи списку після трьох змін.

    **Як перевірятиметься:** на сторінці є список до змін — шість назв по порядку, «%%fixture2Name%%» ще без «%%acquiredMark%%» — і список після змін: від «%%fixture1Name%%» до «%%fixture5Name%%», у кінці «%%newName%%», без «%%fixture6Name%%», а «%%fixture2Name%%» — з «%%acquiredMark%%»; `items` після цього лишається тими самими шістьма бажаннями. Ще платформа викликає твої функції з різними списками — і з порожнім, — з правильною й хибною чернеткою та з невідомим `id` і перевіряє: результат — новий масив, незмінені бажання — ті самі об’єкти (`===`), змінене бажання — новий об’єкт зі старими полями, а отриманий список і його бажання не змінилися.

    Перш ніж перевіряти, виведи через `console.log`, що дає `===` між бажаннями старого й нового списку після `updateItem`, і подивись на вкладку «Консоль»: для незмінених бажань має бути `true`, для зміненого — `false`.
  en: |
    Now the project gets the whole list of wishes. Replace the two separate wishes from the previous steps (`firstItem` and `secondItem`) with the array `items` holding all six wishes — copy it into `app.js`:

    ```js
    const items = [
      { id: "w-01", name: "%%fixture1Name%%", price: 80, acquired: false, category: "%%techCategory%%" },
      { id: "w-02", name: "%%fixture2Name%%", price: 45, acquired: false, category: "%%homeCategory%%" },
      { id: "w-03", name: "%%fixture3Name%%", price: 240, acquired: false, category: "%%sportCategory%%" },
      { id: "w-04", name: "%%fixture4Name%%", price: 25, acquired: true, category: "%%booksCategory%%" },
      { id: "w-05", name: "%%fixture5Name%%", price: null, acquired: false, category: null },
      { id: "w-06", name: "%%fixture6Name%%", price: 18, acquired: true, category: "%%homeCategory%%" },
    ];
    ```

    Then write three functions at the top level of `app.js`. The parameter `list` is any list of wishes, not only `items`. None of the functions changes the array it receives or the wishes in it.

    1. **`addItem(list, id, input)`** returns a **new** array: all wishes of `list` and the new one at the end. Your `validateItem` checks the draft `input` first: when it returns `ok: false`, `addItem` returns the list unchanged. The new wish is a record with the fields `id` (from the parameter), `name` and `price` (from the `value` the check returned), `acquired: false` and `category: null`.
    2. **`updateItem(list, id, changes)`** returns a **new** array in which the wish with this `id` is replaced by a **new** record: all fields of the old wish, with the fields of `changes` on top. The other wishes move into the new array as the same objects. When there is no wish with this `id`, the new array holds the same wishes.
    3. **`removeItem(list, id)`** returns a **new** array without the wish with this `id`; the rest are the same objects in the same order.

    **The page.** In `index.html`, replace the paragraphs `first-label` and `second-label` with two empty paragraphs with the `id`s `list-before` and `list-after`; keep the draft message paragraphs. At the end of `app.js`:

    - make three changes in turn, each giving a new list: add the wish `"w-07"` from the draft `{ name: "%%newName%%", price: 30 }`, mark the wish `"w-02"` as acquired (`acquired: true`) and remove the wish `"w-06"`;
    - write the labels of all wishes of `items` into `list-before` as one text, for example separated by `; `, and the labels of the list after the three changes into `list-after` in the same way.

    **How it is checked:** the page has the list before the changes — the six names in order, “%%fixture2Name%%” still without “%%acquiredMark%%” — and the list after the changes: from “%%fixture1Name%%” to “%%fixture5Name%%”, “%%newName%%” at the end, without “%%fixture6Name%%”, and “%%fixture2Name%%” with “%%acquiredMark%%”; after this `items` is still the same six wishes. The platform also calls your functions with different lists — an empty one too — with a valid and an invalid draft and with an unknown `id`, and checks: the result is a new array, untouched wishes are the same objects (`===`), a changed wish is a new object with the old fields, and the received list and its wishes did not change.

    Before checking, print with `console.log` what `===` gives between the wishes of the old and the new list after `updateItem`, and look at the “Console” tab: it should be `true` for untouched wishes and `false` for the changed one.
nudge:
  uk: "Новий масив можна зібрати з порожнього: обійди отриманий список циклом `for...of` і клади в новий те, що має в ньому бути. Згадай і spread: `[...colors, \"red\"]` дає новий масив з ще одним кольором, а `{ ...settings, theme: \"dark\" }` — новий об’єкт налаштувань з іншою темою; старі `colors` і `settings` лишаються такими, як були."
  en: "A new array can be built from an empty one: go through the received list with a `for...of` loop and put into the new one what belongs there. Recall spread too: `[...colors, \"red\"]` gives a new array with one more color, and `{ ...settings, theme: \"dark\" }` gives a new settings object with another theme; the old `colors` and `settings` stay as they were."
