  "removeItem removes only that wish":
    uk: "`removeItem` прибирає лише одне бажання, а інші лишає тими самими об’єктами"
    en: "`removeItem` removes only one wish and keeps the others as the same objects"
  "removeItem with an unknown id keeps every wish":
    uk: "`removeItem` з невідомим `id` чи порожнім списком нічого не змінює"
    en: "`removeItem` with an unknown `id` or an empty list changes nothing"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що скрипт виконається до кінця без помилки; інакше не проходять і перевірки сторінки. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль». Якщо там `ReferenceError` про `firstItem` чи `secondItem`, то код сторінки ще звертається до записів, яких уже немає."
      en: "This check expects the script to run to the end without an error; otherwise the page checks fail too. The “Console” tab shows the error name and the line of code where it happened. If it shows a `ReferenceError` about `firstItem` or `secondItem`, the page code still uses records that are gone."
  - when: { test: "the page shows the list before the changes" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого всі шість назв з `items` ідуть по порядку, а «%%fixture2Name%%» ще без «%%acquiredMark%%». Якщо позначка там уже є, то список до змін показує змінене бажання — а старий список має лишатися таким, як був."
      en: "This check looks inside `<main>` for an element whose text has all six names of `items` in order, with “%%fixture2Name%%” still without “%%acquiredMark%%”. If the mark is already there, the list before the changes shows a changed wish — but the old list must stay as it was."
  - when: { test: "the page shows the list after the changes" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого по порядку йдуть назви від «%%fixture1Name%%» до «%%fixture5Name%%» і в кінці «%%newName%%», немає «%%fixture6Name%%», а «%%fixture2Name%%» має позначку «%%acquiredMark%%»."
      en: "This check looks inside `<main>` for an element whose text has the names from “%%fixture1Name%%” to “%%fixture5Name%%” in order and “%%newName%%” at the end, has no “%%fixture6Name%%”, and has “%%fixture2Name%%” with the mark “%%acquiredMark%%”."
  - when: { test: "items holds the six wishes and stays unchanged" }
    message:
      uk: "Ця перевірка чекає, що масив `items` на верхньому рівні `app.js` — саме ті шість бажань із завдання з тими самими полями, і після роботи сторінки теж. Якщо поля змінилися, то `items` або його бажання змінено на місці, а кожна зміна має давати новий список."
      en: "This check expects the array `items` at the top level of `app.js` to be exactly the six wishes of the task with the same fields, also after the page script ran. If fields changed, `items` or its wishes were changed in place, while every change must give a new list."
  - when: { test: "addItem adds a checked wish to the end of a new list" }
    message:
      uk: "Ця перевірка викликає `addItem(list, \"w-10\", { name: \"  Backpack \", price: 30 })` і чекає новий масив із сімома бажаннями: перші шість — ті самі об’єкти, а в кінці `{ id: \"w-10\", name: \"Backpack\", price: 30, acquired: false, category: null }`. Отриманий список не змінюється, а з порожнього списку виходить масив з одним бажанням."
      en: "This check calls `addItem(list, \"w-10\", { name: \"  Backpack \", price: 30 })` and expects a new array of seven wishes: the first six are the same objects, and `{ id: \"w-10\", name: \"Backpack\", price: 30, acquired: false, category: null }` comes at the end. The received list does not change, and an empty list gives an array with one wish."
  - when: { test: "addItem keeps the list for a draft that fails the check" }
    message:
      uk: "Ця перевірка чекає, що чернетку `{ name: \"\", price: -5 }`, яку не приймає `validateItem`, `addItem` не додає: у результаті ті самі шість бажань."
      en: "This check expects `addItem` not to add the draft `{ name: \"\", price: -5 }`, which `validateItem` rejects: the result holds the same six wishes."
  - when: { test: "updateItem changes only the given fields of one wish" }
    message:
      uk: "Ця перевірка викликає `updateItem(list, \"w-02\", { acquired: true })` і чекає новий масив, у якому `w-02` — новий об’єкт з усіма старими полями й `acquired: true`, інші бажання — ті самі об’єкти, а отриманий список і його бажання не змінилися. Якщо змінилося й бажання `w-02` в отриманому списку, нове значення записано у спільний об’єкт."
      en: "This check calls `updateItem(list, \"w-02\", { acquired: true })` and expects a new array in which `w-02` is a new object with all old fields and `acquired: true`, the other wishes are the same objects, and the received list and its wishes did not change. If the wish `w-02` of the received list changed too, the new value was written into the shared object."
  - when: { test: "updateItem with a new price keeps the name and the category" }
    message:
      uk: "Ця перевірка чекає, що `updateItem(list, \"w-01\", { price: 70 })` дає бажання `w-01` з ціною `70` і тими самими назвою, категорією та `acquired`, а в отриманому списку ціна лишається `80`."
      en: "This check expects `updateItem(list, \"w-01\", { price: 70 })` to give the wish `w-01` with the price `70` and the same name, category and `acquired`, while the price stays `80` in the received list."
  - when: { test: "updateItem with an unknown id keeps every wish" }
    message:
      uk: "Ця перевірка чекає, що невідомий `id` нічого не змінює й нічого не ламає: у результаті ті самі шість бажань, а для порожнього списку — порожній масив."
      en: "This check expects an unknown `id` to change and break nothing: the result holds the same six wishes, and an empty list gives an empty array."
  - when: { test: "removeItem removes only that wish" }
    message:
      uk: "Ця перевірка викликає `removeItem(list, \"w-05\")` і чекає новий масив без `w-05`, де решта бажань — ті самі об’єкти в тому самому порядку, а отриманий список не змінився."
      en: "This check calls `removeItem(list, \"w-05\")` and expects a new array without `w-05`, in which the other wishes are the same objects in the same order, while the received list did not change."
  - when: { test: "removeItem with an unknown id keeps every wish" }
    message:
      uk: "Ця перевірка чекає для невідомого `id` ті самі шість бажань, а для порожнього списку — порожній масив."
      en: "This check expects the same six wishes for an unknown `id`, and an empty array for an empty list."
