# Capstone step of unit JS-04 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-04-13-capstone-records-crud from this file.
unit: JS-04
mode: in-platform
entry: index.html
title:
  uk: "Список записів: додавання, зміна, видалення"
  en: "The record list: add, update, remove"
intro:
  uk: |
    Досі проєкт працював з окремими записами. Тепер у ньому з’являється список — [[array|масив]] усіх записів, — а з ним три головні дії: додати запис, змінити його поля й видалити його ([[crud]]).

    Кожна дія — функція, яка **повертає новий масив** і не змінює ні масив, який отримала, ні записи в ньому. Записи, яких дія не стосується, просто переходять у новий масив — це ті самі [[object|об’єкти]]. Змінений запис стає новим об’єктом зі старими полями й новими значеннями. Так виглядає [[immutable-update|оновлення без мутацій]]: старий список лишається таким, як був, і його можна порівняти з новим.

    Перед додаванням чернетку перевіряє функція валідації з попереднього кроку: неправильний запис у список не потрапляє. А сторінка показує список до змін і після них.
  en: |
    So far the project worked with single records. Now it gets a list — an [[array]] of all records — and with it the three main actions: add a record, change its fields and remove it ([[crud]]).

    Every action is a function that **returns a new array** and changes neither the array it received nor the records in it. Records the action does not touch simply move into the new array — they are the same [[object|objects]]. A changed record becomes a new object with the old fields and the new values. This is an [[immutable-update|update without mutation]]: the old list stays as it was and can be compared with the new one.

    Before adding, the check function from the previous step validates the draft: an invalid record does not get into the list. And the page shows the list before and after the changes.
purpose:
  uk: "Це крок твого проєкту: масиви, об’єкти, цикли й оновлення без мутацій із цього розділу ти застосовуєш до власного списку записів. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply this unit's arrays, objects, loops and updates without mutation to your own list of records. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Описати список записів проєкту як масив об’єктів і показати його на сторінці."
    en: "Describe the project's list of records as an array of objects and show it on the page."
  - uk: "Написати функції додавання, зміни й видалення запису, які повертають новий масив і не змінюють ні отриманий масив, ні його записи."
    en: "Write functions that add, change and remove a record and return a new array without changing the received array or its records."
  - uk: "Додавати запис лише після перевірки функцією валідації з попереднього кроку."
    en: "Add a record only after the check function from the previous step accepts it."
  - uk: "Показати через `===`, що незмінені записи переходять у новий масив, а змінений запис — новий об’єкт."
    en: "Show with `===` that untouched records move into the new array while a changed record is a new object."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередні кроки не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
