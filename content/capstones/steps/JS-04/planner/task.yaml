# Planner variant of step JS-04. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect). The six tasks are the
# synthetic fixtures of content/capstones/domains.yaml.
strings:
  fixture1Name: { uk: "Полити квіти", en: "Water the plants" }
  fixture2Name: { uk: "Здати книжки в бібліотеку", en: "Return library books" }
  fixture3Name: { uk: "Написати бабусі", en: "Write to grandma" }
  fixture4Name: { uk: "Оплатити інтернет", en: "Pay the internet bill" }
  fixture5Name: { uk: "Записатися до стоматолога", en: "Book a dentist visit" }
  fixture6Name: { uk: "Розібрати шафу", en: "Tidy the wardrobe" }
  newName: { uk: "Купити хліб", en: "Buy bread" }
instructions:
  uk: |
    Тепер у проєкті з’являється весь список справ. Заміни дві окремі справи з попередніх кроків (`firstTask` і `secondTask`) масивом `tasks` з усіма шістьма справами — скопіюй його в `app.js`:

    ```js
    const tasks = [
      { id: "t-01", title: "%%fixture1Name%%", dueDate: "2026-03-02", done: false, priority: "normal" },
      { id: "t-02", title: "%%fixture2Name%%", dueDate: "2026-03-01", done: false, priority: "high" },
      { id: "t-03", title: "%%fixture3Name%%", dueDate: null, done: false, priority: "low" },
      { id: "t-04", title: "%%fixture4Name%%", dueDate: "2026-02-27", done: true, priority: "high" },
      { id: "t-05", title: "%%fixture5Name%%", dueDate: "2026-03-10", done: false, priority: "normal" },
      { id: "t-06", title: "%%fixture6Name%%", dueDate: "2026-03-05", done: true, priority: "low" },
    ];
    ```

    Потім напиши на верхньому рівні `app.js` три функції. Параметр `list` — будь-який список справ, не лише `tasks`. Жодна з функцій не змінює ні масив, який отримала, ні справи в ньому.

    1. **`addTask(list, id, input)`** повертає **новий** масив: усі справи з `list` і в кінці нова. Чернетку `input` спершу перевіряє твоя `validateTask`: якщо вона повертає `ok: false`, `addTask` повертає список без змін. Нова справа — запис із полями `id` (з параметра), `title`, `dueDate` і `priority` (з `value`, яке повернула перевірка) та `done: false`.
    2. **`updateTask(list, id, changes)`** повертає **новий** масив, у якому справа із цим `id` замінена **новим** записом: усі поля старої справи, а поверх них — поля з `changes`. Інші справи переходять у новий масив тими самими об’єктами. Якщо справи з таким `id` немає, у новому масиві ті самі справи.
    3. **`removeTask(list, id)`** повертає **новий** масив без справи із цим `id`; решта — ті самі об’єкти в тому самому порядку.

    **Сторінка.** У `index.html` заміни абзаци `first-label` і `second-label` двома порожніми абзацами з `id` `list-before` і `list-after`; абзаци повідомлень чернетки залиш. Наприкінці `app.js`:

    - зроби по черзі три зміни, кожна з яких дає новий список: додай справу `"t-07"` із чернетки `{ title: "%%newName%%", dueDate: "2026-03-03", priority: "normal" }`, постав справі `"t-05"` пріоритет `"high"` і видали справу `"t-06"`;
    - у `list-before` запиши підписи всіх справ з `tasks` одним текстом, наприклад через `; `, а в `list-after` — так само підписи списку після трьох змін.

    **Як перевірятиметься:** на сторінці є список до змін — шість назв по порядку, «%%fixture5Name%%» ще з пріоритетом «%%priorityNormal%%» — і список після змін: від «%%fixture1Name%%» до «%%fixture5Name%%», у кінці «%%newName%%», без «%%fixture6Name%%», а «%%fixture5Name%%» — з «%%priorityHigh%%»; `tasks` після цього лишається тими самими шістьма справами. Ще платформа викликає твої функції з різними списками — і з порожнім, — з правильною й хибною чернеткою та з невідомим `id` і перевіряє: результат — новий масив, незмінені справи — ті самі об’єкти (`===`), змінена справа — новий об’єкт зі старими полями, а отриманий список і його справи не змінилися.

    Перш ніж перевіряти, виведи через `console.log`, що дає `===` між справами старого й нового списку після `updateTask`, і подивись на вкладку «Консоль»: для незмінених справ має бути `true`, для зміненої — `false`.
  en: |
    Now the project gets the whole list of tasks. Replace the two separate tasks from the previous steps (`firstTask` and `secondTask`) with the array `tasks` holding all six tasks — copy it into `app.js`:

    ```js
    const tasks = [
      { id: "t-01", title: "%%fixture1Name%%", dueDate: "2026-03-02", done: false, priority: "normal" },
      { id: "t-02", title: "%%fixture2Name%%", dueDate: "2026-03-01", done: false, priority: "high" },
      { id: "t-03", title: "%%fixture3Name%%", dueDate: null, done: false, priority: "low" },
      { id: "t-04", title: "%%fixture4Name%%", dueDate: "2026-02-27", done: true, priority: "high" },
      { id: "t-05", title: "%%fixture5Name%%", dueDate: "2026-03-10", done: false, priority: "normal" },
      { id: "t-06", title: "%%fixture6Name%%", dueDate: "2026-03-05", done: true, priority: "low" },
    ];
    ```

    Then write three functions at the top level of `app.js`. The parameter `list` is any list of tasks, not only `tasks`. None of the functions changes the array it receives or the tasks in it.

    1. **`addTask(list, id, input)`** returns a **new** array: all tasks of `list` and the new one at the end. Your `validateTask` checks the draft `input` first: when it returns `ok: false`, `addTask` returns the list unchanged. The new task is a record with the fields `id` (from the parameter), `title`, `dueDate` and `priority` (from the `value` the check returned) and `done: false`.
    2. **`updateTask(list, id, changes)`** returns a **new** array in which the task with this `id` is replaced by a **new** record: all fields of the old task, with the fields of `changes` on top. The other tasks move into the new array as the same objects. When there is no task with this `id`, the new array holds the same tasks.
    3. **`removeTask(list, id)`** returns a **new** array without the task with this `id`; the rest are the same objects in the same order.

    **The page.** In `index.html`, replace the paragraphs `first-label` and `second-label` with two empty paragraphs with the `id`s `list-before` and `list-after`; keep the draft message paragraphs. At the end of `app.js`:

    - make three changes in turn, each giving a new list: add the task `"t-07"` from the draft `{ title: "%%newName%%", dueDate: "2026-03-03", priority: "normal" }`, give the task `"t-05"` the priority `"high"` and remove the task `"t-06"`;
    - write the labels of all tasks of `tasks` into `list-before` as one text, for example separated by `; `, and the labels of the list after the three changes into `list-after` in the same way.

    **How it is checked:** the page has the list before the changes — the six titles in order, “%%fixture5Name%%” still with the priority “%%priorityNormal%%” — and the list after the changes: from “%%fixture1Name%%” to “%%fixture5Name%%”, “%%newName%%” at the end, without “%%fixture6Name%%”, and “%%fixture5Name%%” with “%%priorityHigh%%”; after this `tasks` is still the same six tasks. The platform also calls your functions with different lists — an empty one too — with a valid and an invalid draft and with an unknown `id`, and checks: the result is a new array, untouched tasks are the same objects (`===`), a changed task is a new object with the old fields, and the received list and its tasks did not change.

    Before checking, print with `console.log` what `===` gives between the tasks of the old and the new list after `updateTask`, and look at the “Console” tab: it should be `true` for untouched tasks and `false` for the changed one.
nudge:
  uk: "Новий масив можна зібрати з порожнього: обійди отриманий список циклом `for...of` і клади в новий те, що має в ньому бути. Згадай і spread: `[...colors, \"red\"]` дає новий масив із ще одним кольором, а `{ ...settings, theme: \"dark\" }` — новий об’єкт налаштувань з іншою темою; старі `colors` і `settings` лишаються такими, як були."
  en: "A new array can be built from an empty one: go through the received list with a `for...of` loop and put into the new one what belongs there. Recall spread too: `[...colors, \"red\"]` gives a new array with one more color, and `{ ...settings, theme: \"dark\" }` gives a new settings object with another theme; the old `colors` and `settings` stay as they were."
testTitles:
  "the script runs without errors":
    uk: "Код у `app.js` працює без помилок"
    en: "The script runs without errors"
  "the page shows the list before the changes":
    uk: "Сторінка показує список до змін: шість справ, «%%fixture5Name%%» ще без «%%priorityHigh%%»"
    en: "The page shows the list before the changes: six tasks, “%%fixture5Name%%” still without “%%priorityHigh%%”"
  "the page shows the list after the changes":
    uk: "Сторінка показує список після змін: з «%%newName%%», без «%%fixture6Name%%», «%%fixture5Name%%» — з «%%priorityHigh%%»"
    en: "The page shows the list after the changes: with “%%newName%%”, without “%%fixture6Name%%”, “%%fixture5Name%%” with “%%priorityHigh%%”"
  "tasks holds the six tasks and stays unchanged":
    uk: "`tasks` — ті самі шість справ і після роботи сторінки"
    en: "`tasks` is still the same six tasks after the page script"
  "addTask adds a checked task to the end of a new list":
    uk: "`addTask` додає перевірену справу в кінець нового масиву"
    en: "`addTask` adds a checked task to the end of a new array"
  "addTask keeps the list for a draft that fails the check":
    uk: "`addTask` не додає чернетку, яку не прийняла `validateTask`"
    en: "`addTask` does not add a draft that `validateTask` rejects"
  "updateTask changes only the given fields of one task":
    uk: "`updateTask` змінює лише вказані поля однієї справи — у новому об’єкті"
    en: "`updateTask` changes only the given fields of one task — in a new object"
  "updateTask with a new priority keeps the title and the due date":
    uk: "`updateTask` з новим пріоритетом зберігає назву й термін"
    en: "`updateTask` with a new priority keeps the title and the due date"
  "updateTask with an unknown id keeps every task":
    uk: "`updateTask` з невідомим `id` чи порожнім списком нічого не змінює"
    en: "`updateTask` with an unknown `id` or an empty list changes nothing"
  "removeTask removes only that task":
    uk: "`removeTask` прибирає лише одну справу, а інші лишає тими самими об’єктами"
    en: "`removeTask` removes only one task and keeps the others as the same objects"
  "removeTask with an unknown id keeps every task":
    uk: "`removeTask` з невідомим `id` чи порожнім списком нічого не змінює"
    en: "`removeTask` with an unknown `id` or an empty list changes nothing"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки; інакше не проходять і перевірки сторінки. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль». Якщо там `ReferenceError` про `firstTask` чи `secondTask`, то код сторінки ще звертається до записів, яких уже немає."
      en: "This check expects the script to run to the end without an error; otherwise the page checks fail too. The “Console” tab shows the error name and the line of code where it happened. If it shows a `ReferenceError` about `firstTask` or `secondTask`, the page code still uses records that are gone."
  - when: { test: "the page shows the list before the changes" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого всі шість назв з `tasks` ідуть по порядку, а «%%fixture5Name%%» ще без «%%priorityHigh%%». Якщо там уже «%%priorityHigh%%», то список до змін показує змінену справу — а старий список має лишатися таким, як був."
      en: "This check looks inside `<main>` for an element whose text has all six titles of `tasks` in order, with “%%fixture5Name%%” still without “%%priorityHigh%%”. If “%%priorityHigh%%” is already there, the list before the changes shows a changed task — but the old list must stay as it was."
  - when: { test: "the page shows the list after the changes" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого по порядку йдуть назви від «%%fixture1Name%%» до «%%fixture5Name%%» і в кінці «%%newName%%», немає «%%fixture6Name%%», а «%%fixture5Name%%» має пріоритет «%%priorityHigh%%»."
      en: "This check looks inside `<main>` for an element whose text has the titles from “%%fixture1Name%%” to “%%fixture5Name%%” in order and “%%newName%%” at the end, has no “%%fixture6Name%%”, and has “%%fixture5Name%%” with the priority “%%priorityHigh%%”."
  - when: { test: "tasks holds the six tasks and stays unchanged" }
    message:
      uk: "Ця перевірка чекає, що масив `tasks` на верхньому рівні `app.js` — саме ті шість справ із завдання з тими самими полями, і після роботи сторінки теж. Якщо поля змінилися, то `tasks` або його справи змінено на місці, а кожна зміна має давати новий список."
      en: "This check expects the array `tasks` at the top level of `app.js` to be exactly the six tasks of the task description with the same fields, also after the page script ran. If fields changed, `tasks` or its tasks were changed in place, while every change must give a new list."
  - when: { test: "addTask adds a checked task to the end of a new list" }
    message:
      uk: "Ця перевірка викликає `addTask(list, \"t-10\", { title: \"  Buy bread \", dueDate: \"2026-03-03\" })` і чекає новий масив із сімома справами: перші шість — ті самі об’єкти, а в кінці `{ id: \"t-10\", title: \"Buy bread\", dueDate: \"2026-03-03\", done: false, priority: \"normal\" }`. Отриманий список не змінюється, а з порожнього списку виходить масив з однією справою."
      en: "This check calls `addTask(list, \"t-10\", { title: \"  Buy bread \", dueDate: \"2026-03-03\" })` and expects a new array of seven tasks: the first six are the same objects, and `{ id: \"t-10\", title: \"Buy bread\", dueDate: \"2026-03-03\", done: false, priority: \"normal\" }` comes at the end. The received list does not change, and an empty list gives an array with one task."
  - when: { test: "addTask keeps the list for a draft that fails the check" }
    message:
      uk: "Ця перевірка чекає, що чернетку `{ title: \"\", priority: \"urgent\" }`, яку не приймає `validateTask`, `addTask` не додає: у результаті ті самі шість справ."
      en: "This check expects `addTask` not to add the draft `{ title: \"\", priority: \"urgent\" }`, which `validateTask` rejects: the result holds the same six tasks."
  - when: { test: "updateTask changes only the given fields of one task" }
    message:
      uk: "Ця перевірка викликає `updateTask(list, \"t-01\", { done: true })` і чекає новий масив, у якому `t-01` — новий об’єкт з усіма старими полями й `done: true`, інші справи — ті самі об’єкти, а отриманий список і його справи не змінилися. Якщо змінилася й справа `t-01` в отриманому списку, нове значення записано у спільний об’єкт."
      en: "This check calls `updateTask(list, \"t-01\", { done: true })` and expects a new array in which `t-01` is a new object with all old fields and `done: true`, the other tasks are the same objects, and the received list and its tasks did not change. If the task `t-01` of the received list changed too, the new value was written into the shared object."
  - when: { test: "updateTask with a new priority keeps the title and the due date" }
    message:
      uk: "Ця перевірка чекає, що `updateTask(list, \"t-05\", { priority: \"high\" })` дає справу `t-05` з пріоритетом `\"high\"` і тими самими назвою, терміном та `done`, а в отриманому списку пріоритет лишається `\"normal\"`."
      en: "This check expects `updateTask(list, \"t-05\", { priority: \"high\" })` to give the task `t-05` with the priority `\"high\"` and the same title, due date and `done`, while the priority stays `\"normal\"` in the received list."
  - when: { test: "updateTask with an unknown id keeps every task" }
    message:
      uk: "Ця перевірка чекає, що невідомий `id` нічого не змінює й нічого не ламає: у результаті ті самі шість справ, а для порожнього списку — порожній масив."
      en: "This check expects an unknown `id` to change and break nothing: the result holds the same six tasks, and an empty list gives an empty array."
  - when: { test: "removeTask removes only that task" }
    message:
      uk: "Ця перевірка викликає `removeTask(list, \"t-03\")` і чекає новий масив без `t-03`, де решта справ — ті самі об’єкти в тому самому порядку, а отриманий список не змінився."
      en: "This check calls `removeTask(list, \"t-03\")` and expects a new array without `t-03`, in which the other tasks are the same objects in the same order, while the received list did not change."
  - when: { test: "removeTask with an unknown id keeps every task" }
    message:
      uk: "Ця перевірка чекає для невідомого `id` ті самі шість справ, а для порожнього списку — порожній масив."
      en: "This check expects the same six tasks for an unknown `id`, and an empty array for an empty list."
