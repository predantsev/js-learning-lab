# Habit tracker variant of step JS-04. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect). The six habits are the
# synthetic fixtures of content/capstones/domains.yaml.
strings:
  fixture1Name: { uk: "Ранкова зарядка", en: "Morning exercise" }
  fixture2Name: { uk: "Читати 20 хвилин", en: "Read for 20 minutes" }
  fixture3Name: { uk: "Пити воду", en: "Drink water" }
  fixture4Name: { uk: "Прибирання", en: "Tidy up" }
  fixture5Name: { uk: "Вчити англійські слова", en: "Learn English words" }
  fixture6Name: { uk: "Прогулянка", en: "Go for a walk" }
  newName: { uk: "Медитація", en: "Meditation" }
instructions:
  uk: |
    Тепер у проєкті з’являється весь список звичок — і з ним дати виконань: `completions` кожної звички — це масив дат `"РРРР-ММ-ДД"` за зростанням. Заміни дві окремі звички з попередніх кроків (`firstHabit` і `secondHabit`) масивом `habits` з усіма шістьма звичками — скопіюй його в `app.js`:

    ```js
    const habits = [
      { id: "h-01", name: "%%fixture1Name%%", frequency: "daily", active: true, completions: ["2026-02-27", "2026-02-28", "2026-03-01"] },
      { id: "h-02", name: "%%fixture2Name%%", frequency: "daily", active: true, completions: ["2026-02-26", "2026-02-28", "2026-03-01"] },
      { id: "h-03", name: "%%fixture3Name%%", frequency: "daily", active: true, completions: ["2026-03-01"] },
      { id: "h-04", name: "%%fixture4Name%%", frequency: "weekly", active: true, completions: ["2026-02-22", "2026-03-01"] },
      { id: "h-05", name: "%%fixture5Name%%", frequency: "daily", active: false, completions: ["2026-02-20"] },
      { id: "h-06", name: "%%fixture6Name%%", frequency: "daily", active: true, completions: [] },
    ];
    ```

    Потім напиши на верхньому рівні `app.js` чотири функції. Параметр `list` — будь-який список звичок, не лише `habits`. Жодна з функцій не змінює ні масив, який отримала, ні звички в ньому, ні їхні масиви `completions`.

    1. **`addHabit(list, id, input)`** повертає **новий** масив: усі звички з `list` і в кінці нова. Чернетку `input` спершу перевіряє твоя `validateHabit`: якщо вона повертає `ok: false`, `addHabit` повертає список без змін. Нова звичка — запис із полями `id` (з параметра), `name` і `frequency` (з `value`, яке повернула перевірка), `active: true` і `completions` — власний порожній масив.
    2. **`updateHabit(list, id, changes)`** повертає **новий** масив, у якому звичка із цим `id` замінена **новим** записом: усі поля старої звички, а поверх них — поля з `changes`. Інші звички переходять у новий масив тими самими об’єктами. Якщо звички з таким `id` немає, у новому масиві ті самі звички.
    3. **`removeHabit(list, id)`** повертає **новий** масив без звички із цим `id`; решта — ті самі об’єкти в тому самому порядку.
    4. **`completeHabit(list, id, day)`** позначає, що звичку виконано в день `day`. Вона повертає **новий** масив, у якому ця звичка — новий запис із **новим** масивом `completions`: старі дати й у кінці `day`. Якщо `day` уже є серед дат, другий раз його не додають. Припущення: `day` — сьогоднішня дата, вона ніколи не раніша за збережені, тож дата в кінці зберігає порядок за зростанням.

    **Сторінка.** У `index.html` заміни абзаци `first-label` і `second-label` двома порожніми абзацами з `id` `list-before` і `list-after`; абзаци повідомлень чернетки залиш. Наприкінці `app.js`:

    - зроби по черзі чотири зміни, кожна з яких дає новий список: додай звичку `"h-07"` із чернетки `{ name: "%%newName%%", frequency: "daily" }`, постав звичку `"h-02"` на паузу (`active: false`), познач звичку `"h-03"` виконаною `"2026-03-02"` і видали звичку `"h-06"`;
    - у `list-before` запиши підписи всіх звичок з `habits` одним текстом, наприклад через `; `, а в `list-after` — так само підписи списку після чотирьох змін.

    **Як перевірятиметься:** на сторінці є список до змін — шість назв по порядку, «%%fixture2Name%%» ще без «%%pausedMark%%» — і список після змін: від «%%fixture1Name%%» до «%%fixture5Name%%», у кінці «%%newName%%», без «%%fixture6Name%%», а «%%fixture2Name%%» — з «%%pausedMark%%»; `habits` після цього лишається тими самими шістьма звичками з тими самими датами. Ще платформа викликає твої функції з різними списками — і з порожнім, — з правильною й хибною чернеткою, з новою й уже позначеною датою та з невідомим `id` і перевіряє: результат — новий масив, незмінені звички — ті самі об’єкти (`===`), змінена звичка — новий об’єкт зі старими полями, у позначеної звички — новий масив дат, а отриманий список, його звички та їхні дати не змінилися.

    Підпис звички дат не показує. Щоб побачити, що зробила `completeHabit`, виведи через `console.log` дати звички `"h-03"` у старому й новому списку та що дає `===` між цими масивами, і подивись на вкладку «Консоль».
  en: |
    Now the project gets the whole list of habits — and with it the completion dates: the `completions` of each habit is an array of `"YYYY-MM-DD"` dates in ascending order. Replace the two separate habits from the previous steps (`firstHabit` and `secondHabit`) with the array `habits` holding all six habits — copy it into `app.js`:

    ```js
    const habits = [
      { id: "h-01", name: "%%fixture1Name%%", frequency: "daily", active: true, completions: ["2026-02-27", "2026-02-28", "2026-03-01"] },
      { id: "h-02", name: "%%fixture2Name%%", frequency: "daily", active: true, completions: ["2026-02-26", "2026-02-28", "2026-03-01"] },
      { id: "h-03", name: "%%fixture3Name%%", frequency: "daily", active: true, completions: ["2026-03-01"] },
      { id: "h-04", name: "%%fixture4Name%%", frequency: "weekly", active: true, completions: ["2026-02-22", "2026-03-01"] },
      { id: "h-05", name: "%%fixture5Name%%", frequency: "daily", active: false, completions: ["2026-02-20"] },
      { id: "h-06", name: "%%fixture6Name%%", frequency: "daily", active: true, completions: [] },
    ];
    ```

    Then write four functions at the top level of `app.js`. The parameter `list` is any list of habits, not only `habits`. None of the functions changes the array it receives, the habits in it or their `completions` arrays.

    1. **`addHabit(list, id, input)`** returns a **new** array: all habits of `list` and the new one at the end. Your `validateHabit` checks the draft `input` first: when it returns `ok: false`, `addHabit` returns the list unchanged. The new habit is a record with the fields `id` (from the parameter), `name` and `frequency` (from the `value` the check returned), `active: true` and `completions` — its own empty array.
    2. **`updateHabit(list, id, changes)`** returns a **new** array in which the habit with this `id` is replaced by a **new** record: all fields of the old habit, with the fields of `changes` on top. The other habits move into the new array as the same objects. When there is no habit with this `id`, the new array holds the same habits.
    3. **`removeHabit(list, id)`** returns a **new** array without the habit with this `id`; the rest are the same objects in the same order.
    4. **`completeHabit(list, id, day)`** marks the habit as completed on the day `day`. It returns a **new** array in which this habit is a new record with a **new** `completions` array: the old dates and `day` at the end. When `day` is already among the dates, it is not added a second time. Assumption: `day` is today's date and never earlier than the stored ones, so a date at the end keeps the ascending order.

    **The page.** In `index.html`, replace the paragraphs `first-label` and `second-label` with two empty paragraphs with the `id`s `list-before` and `list-after`; keep the draft message paragraphs. At the end of `app.js`:

    - make four changes in turn, each giving a new list: add the habit `"h-07"` from the draft `{ name: "%%newName%%", frequency: "daily" }`, pause the habit `"h-02"` (`active: false`), mark the habit `"h-03"` as completed on `"2026-03-02"` and remove the habit `"h-06"`;
    - write the labels of all habits of `habits` into `list-before` as one text, for example separated by `; `, and the labels of the list after the four changes into `list-after` in the same way.

    **How it is checked:** the page has the list before the changes — the six names in order, “%%fixture2Name%%” still without “%%pausedMark%%” — and the list after the changes: from “%%fixture1Name%%” to “%%fixture5Name%%”, “%%newName%%” at the end, without “%%fixture6Name%%”, and “%%fixture2Name%%” with “%%pausedMark%%”; after this `habits` is still the same six habits with the same dates. The platform also calls your functions with different lists — an empty one too — with a valid and an invalid draft, with a new and an already marked date and with an unknown `id`, and checks: the result is a new array, untouched habits are the same objects (`===`), a changed habit is a new object with the old fields, a completed habit has a new array of dates, and the received list, its habits and their dates did not change.

    A habit's label does not show its dates. To see what `completeHabit` did, print with `console.log` the dates of the habit `"h-03"` in the old and the new list and what `===` gives between these arrays, and look at the “Console” tab.
nudge:
  uk: "Новий масив можна зібрати з порожнього: обійди отриманий список циклом `for...of` і клади в новий те, що має в ньому бути. Згадай і spread: `[...colors, \"red\"]` дає новий масив із ще одним кольором, а `{ ...settings, theme: \"dark\" }` — новий об’єкт налаштувань з іншою темою; старі `colors` і `settings` лишаються такими, як були. Копія `{ ...habit }` — поверхнева: її `completions` — той самий масив, що й у старої звички."
  en: "A new array can be built from an empty one: go through the received list with a `for...of` loop and put into the new one what belongs there. Recall spread too: `[...colors, \"red\"]` gives a new array with one more color, and `{ ...settings, theme: \"dark\" }` gives a new settings object with another theme; the old `colors` and `settings` stay as they were. The copy `{ ...habit }` is shallow: its `completions` is the same array as the old habit's."
