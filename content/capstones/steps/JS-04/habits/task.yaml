    en: "The script runs without errors"
  "the page shows the list before the changes":
    uk: "Сторінка показує список до змін: шість звичок, «%%fixture2Name%%» ще без «%%pausedMark%%»"
    en: "The page shows the list before the changes: six habits, “%%fixture2Name%%” still without “%%pausedMark%%”"
  "the page shows the list after the changes":
    uk: "Сторінка показує список після змін: з «%%newName%%», без «%%fixture6Name%%», «%%fixture2Name%%» — з «%%pausedMark%%»"
    en: "The page shows the list after the changes: with “%%newName%%”, without “%%fixture6Name%%”, “%%fixture2Name%%” with “%%pausedMark%%”"
  "habits holds the six habits and stays unchanged":
    uk: "`habits` — ті самі шість звичок із тими самими датами і після роботи сторінки"
    en: "`habits` is still the same six habits with the same dates after the page script"
  "addHabit adds a checked habit to the end of a new list":
    uk: "`addHabit` додає перевірену звичку з власним порожнім масивом дат у кінець нового масиву"
