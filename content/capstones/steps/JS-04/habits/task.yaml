    en: "`completeHabit` with an unknown `id` changes nothing"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки; інакше не проходять і перевірки сторінки. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль». Якщо там `ReferenceError` про `firstHabit` чи `secondHabit`, то код сторінки ще звертається до записів, яких уже немає."
      en: "This check expects the script to run to the end without an error; otherwise the page checks fail too. The “Console” tab shows the error name and the line of code where it happened. If it shows a `ReferenceError` about `firstHabit` or `secondHabit`, the page code still uses records that are gone."
  - when: { test: "the page shows the list before the changes" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого всі шість назв з `habits` ідуть по порядку, а «%%fixture2Name%%» ще без «%%pausedMark%%». Якщо позначка там уже є, то список до змін показує змінену звичку — а старий список має лишатися таким, як був."
      en: "This check looks inside `<main>` for an element whose text has all six names of `habits` in order, with “%%fixture2Name%%” still without “%%pausedMark%%”. If the mark is already there, the list before the changes shows a changed habit — but the old list must stay as it was."
  - when: { test: "the page shows the list after the changes" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент, у тексті якого по порядку йдуть назви від «%%fixture1Name%%» до «%%fixture5Name%%» і в кінці «%%newName%%», немає «%%fixture6Name%%», а «%%fixture2Name%%» має позначку «%%pausedMark%%»."
      en: "This check looks inside `<main>` for an element whose text has the names from “%%fixture1Name%%” to “%%fixture5Name%%” in order and “%%newName%%” at the end, has no “%%fixture6Name%%”, and has “%%fixture2Name%%” with the mark “%%pausedMark%%”."
  - when: { test: "habits holds the six habits and stays unchanged" }
    message:
      uk: "Ця перевірка чекає, що масив `habits` на верхньому рівні `app.js` — саме ті шість звичок із завдання з тими самими полями й датами, і після роботи сторінки теж. Якщо змінилися поля чи дати, то `habits`, його звички або їхні масиви дат змінено на місці, а кожна зміна має давати новий список."
      en: "This check expects the array `habits` at the top level of `app.js` to be exactly the six habits of the task with the same fields and dates, also after the page script ran. If fields or dates changed, `habits`, its habits or their date arrays were changed in place, while every change must give a new list."
  - when: { test: "addHabit adds a checked habit to the end of a new list" }
    message:
      uk: "Ця перевірка викликає `addHabit(list, \"h-10\", { name: \"  Stretching \", frequency: \"weekly\" })` і чекає новий масив із сімома звичками: перші шість — ті самі об’єкти, а в кінці `{ id: \"h-10\", name: \"Stretching\", frequency: \"weekly\", active: true, completions: [] }`. Без частоти нова звичка отримує `\"daily\"`, а дві нові звички мають два різні масиви `completions`."
      en: "This check calls `addHabit(list, \"h-10\", { name: \"  Stretching \", frequency: \"weekly\" })` and expects a new array of seven habits: the first six are the same objects, and `{ id: \"h-10\", name: \"Stretching\", frequency: \"weekly\", active: true, completions: [] }` comes at the end. Without a frequency the new habit gets `\"daily\"`, and two new habits have two different `completions` arrays."
  - when: { test: "addHabit keeps the list for a draft that fails the check" }
    message:
      uk: "Ця перевірка чекає, що чернетку `{ name: \"\", frequency: \"monthly\" }`, яку не приймає `validateHabit`, `addHabit` не додає: у результаті ті самі шість звичок."
      en: "This check expects `addHabit` not to add the draft `{ name: \"\", frequency: \"monthly\" }`, which `validateHabit` rejects: the result holds the same six habits."
  - when: { test: "updateHabit changes only the given fields of one habit" }
    message:
      uk: "Ця перевірка викликає `updateHabit(list, \"h-02\", { active: false })` і чекає новий масив, у якому `h-02` — новий об’єкт з усіма старими полями й `active: false`, інші звички — ті самі об’єкти, а отриманий список і його звички не змінилися. Якщо змінилася й звичка `h-02` в отриманому списку, нове значення записано у спільний об’єкт."
      en: "This check calls `updateHabit(list, \"h-02\", { active: false })` and expects a new array in which `h-02` is a new object with all old fields and `active: false`, the other habits are the same objects, and the received list and its habits did not change. If the habit `h-02` of the received list changed too, the new value was written into the shared object."
  - when: { test: "updateHabit with a new frequency keeps the name and the completions" }
    message:
      uk: "Ця перевірка чекає, що `updateHabit(list, \"h-04\", { frequency: \"daily\" })` дає звичку `h-04` із частотою `\"daily\"` і тими самими назвою, `active` та датами, а в отриманому списку частота лишається `\"weekly\"`."
      en: "This check expects `updateHabit(list, \"h-04\", { frequency: \"daily\" })` to give the habit `h-04` with the frequency `\"daily\"` and the same name, `active` and dates, while the frequency stays `\"weekly\"` in the received list."
  - when: { test: "updateHabit with an unknown id keeps every habit" }
    message:
      uk: "Ця перевірка чекає, що невідомий `id` нічого не змінює й нічого не ламає: у результаті ті самі шість звичок, а для порожнього списку — порожній масив."
      en: "This check expects an unknown `id` to change and break nothing: the result holds the same six habits, and an empty list gives an empty array."
  - when: { test: "removeHabit removes only that habit" }
    message:
      uk: "Ця перевірка викликає `removeHabit(list, \"h-05\")` і чекає новий масив без `h-05`, де решта звичок — ті самі об’єкти в тому самому порядку, а отриманий список не змінився."
      en: "This check calls `removeHabit(list, \"h-05\")` and expects a new array without `h-05`, in which the other habits are the same objects in the same order, while the received list did not change."
  - when: { test: "removeHabit with an unknown id keeps every habit" }
    message:
      uk: "Ця перевірка чекає для невідомого `id` ті самі шість звичок, а для порожнього списку — порожній масив."
      en: "This check expects the same six habits for an unknown `id`, and an empty array for an empty list."
  - when: { test: "completeHabit adds the day to a new completions array" }
    message:
      uk: "Ця перевірка викликає `completeHabit(list, \"h-03\", \"2026-03-02\")` і чекає новий масив, у якому `h-03` — новий об’єкт з датами `[\"2026-03-01\", \"2026-03-02\"]` у новому масиві, інші звички — ті самі об’єкти, а в отриманому списку `h-03` має лише `[\"2026-03-01\"]`. Якщо там з’явилась і нова дата, її записано в спільний масив дат."
      en: "This check calls `completeHabit(list, \"h-03\", \"2026-03-02\")` and expects a new array in which `h-03` is a new object with the dates `[\"2026-03-01\", \"2026-03-02\"]` in a new array, the other habits are the same objects, and in the received list `h-03` still has only `[\"2026-03-01\"]`. If the new date appeared there too, it was written into the shared array of dates."
  - when: { test: "completeHabit does not add a day twice" }
    message:
      uk: "Ця перевірка чекає, що `completeHabit(list, \"h-01\", \"2026-03-01\")` не додає дату, яка вже є серед дат `h-01`: дати лишаються `[\"2026-02-27\", \"2026-02-28\", \"2026-03-01\"]`."
      en: "This check expects `completeHabit(list, \"h-01\", \"2026-03-01\")` not to add a date that is already among the dates of `h-01`: the dates stay `[\"2026-02-27\", \"2026-02-28\", \"2026-03-01\"]`."
  - when: { test: "completeHabit with an unknown id keeps every habit" }
    message:
      uk: "Ця перевірка чекає для невідомого `id` ті самі шість звичок тими самими об’єктами, а отриманий список — без змін."
      en: "This check expects the same six habits as the same objects for an unknown `id`, and the received list unchanged."
