# Capstone step of unit RN-04 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson of kind capstone-step of RN-04 from this file.
# A local step: done in the learner's editor, terminal and on the declared native target; no platform
# checks. The project page shows only the intro of a local step, so the intro carries the whole procedure.
# Every computer-side command was run on macOS (Node.js 25.2.1, npm 11.6.2, Expo SDK 57) in a scratch home
# on all four projects, continuing the RN-03 scratch projects: expo install of React Navigation 7, tsc, the
# course test runner (Ukrainian and English strings), expo export for android and ios, the commit. The
# scheme in app.json was checked with `npx expo prebuild --no-install` (the generated AndroidManifest.xml
# has `<data android:scheme="courselab"/>`, Info.plist has `courselab`); prebuild also rewrote
# package.json and app.json, so those changes and the ignored android/ and ios/ folders were thrown away
# and the learner is not asked to run it here. A deliberately wrong link parser (an empty path treated as
# a link) failed the tests. Nothing was run on an emulator, a simulator or a phone. Quoted output is
# from the wishlist run.
# reference/ is the native project after the step without the files the template generates and the
# platform cannot carry (assets/*.png, LICENSE, package-lock.json, node_modules/).
unit: RN-04
mode: local
entry: App.tsx
title:
  uk: "Список, деталі й редагування: стек екранів"
  en: "List, detail and edit: a stack of screens"
intro:
  uk: |
    Один екран стає стеком із чотирьох: список, деталі запису, його редагування й «не знайдено». Екран отримує лише `id` запису й сам читає збережений список, тож посилання, крок назад чи повернення з редагування ніколи не показують застарілих даних. Змінений запис не губиться без питання, синтетичне посилання відкриває один запис, а підписки на події застосунку не множаться.

    | Проєкт | Посилання | Питання перед виходом, коли змінено | Що оновлюється |
    |---|---|---|---|
    | Список бажань | `…/wish/w-03` | назву, ціну (і категорію) | список — на кожному фокусі екрана |
    | Планувальник | `…/task/t-02` | назву, термін (і пріоритет) | «Треба зробити станом на …» — після повернення в застосунок |
    | Трекер звичок | `…/habit/h-01` | назву, частоту | «Сьогодні виконано» — після повернення в застосунок |
    | Трекер витрат | `…/expense/e-02` | назву, суму (і дату, категорію) | підсумки категорій — на кожному фокусі екрана |

    Список у всіх чотирьох перечитується на кожному фокусі; у планувальнику й трекері звичок «сьогодні» ще й питається в годинника щоразу, коли застосунок повертається на передній план.

    Нижче — «Список бажань». Команди на комп’ютері виконано на macOS (Node.js 25.2.1, Expo SDK 57, React Navigation 7) на всіх чотирьох проєктах. Емулятора, симулятора й телефона не було: крок 9 описано за документацією React Navigation 7, Expo SDK 57 і уроками розділу, його виводу тут немає.

    **1. Стан на початку.** `cd ~/js-course/wishlist-native`, `git status` — чисто, `git log --oneline -1` — commit списку з адаптерами.

    **2. Навігація.** `npx expo install @react-navigation/native @react-navigation/native-stack react-native-screens` — у нас `› Installing 1 SDK 57.0.0 compatible native module and 2 other packages using npm`, у `package.json` — `^7.5.0`, `^7.20.0` і `~4.26.0` (`react-native-safe-area-context` уже є). У `app.json` додай `"scheme": "courselab"` — він діє лише в окремій збірці застосунку; в Expo Go посилання має вигляд `exp://<адреса з npm start>/--/wish/w-03`.

    **3. Одне джерело списку.** `src/snapshot.ts` отримує `loadSnapshot(storage)`: збережений текст → `JSON.parse` → `schemaVersion: 1` → `parseItemList`; нічого придатного — `null`. `src/repository.ts`: `createRepository(storage, startingItems)` з `readAll()` (збережений список або стартовий) і `apply(action)` (прочитати, `itemsReducer`, зберегти, лише якщо список змінився). Усе це без `react-native`, тож `tests/repository.test.js` у Node.js перевіряє: читання нічого не зберігає, прийнята дія зберігається й видна новому репозиторію, відхилена — ні. `src/services.tsx` — контекст із репозиторієм і форматом ціни, який `App.tsx` ставить над навігатором.

    **4. Стек.** `src/navigation.ts`: тип `RootStackParamList` — `List`, `Detail: { id }`, `Edit: { id }`, `NotFound`. `App.tsx`: `createNativeStackNavigator<RootStackParamList>()`, `NavigationContainer` з `ref` з `createNavigationContainerRef`, чотири `Stack.Screen` із заголовками. Шапку тепер малює стек, тож власна шапка з `insets.top` зникає; знизу й з боків відступи з `insets` лишаються.

    **5. Список і деталі.** `ItemsScreen` тримає список у стані й читає його з `useFocusEffect(useCallback(() => { let active = true; … return () => { active = false; }; }, [repository]))`: перше відкриття, повернення з деталей чи редагування — новий `readAll()`, а відповідь, що прийшла після втрати фокуса, нічого не змінює. Тут немає слухача, якого треба знімати. Натиск на рядок — `navigation.navigate('Detail', { id: item.id })`. `DetailScreen` знаходить бажання через `indexById` на кожному фокусі; невідомий `id` — власний стан «Такого бажання немає» і «← До списку».

    **6. Питання перед виходом.** `src/draft.ts`: `hasUnsavedChanges(draft, saved)` — пробіли по краях не рахуються (тест — `tests/draft.test.js`). `ItemForm` отримує `onDraftChange`, а `EditScreen` викликає `usePreventRemove(dirty, ({ data }) => Alert.alert('Є незбережені зміни. Піти без збереження?', undefined, [{ text: 'Лишитися', style: 'cancel' }, { text: 'Піти без збереження', style: 'destructive', onPress: () => navigation.dispatch(data.action) }]))`. Так питання ставлять і кнопка «назад» у шапці, і кнопка «Назад» Android, і жест iOS — без окремого обробника кожного. Збереження спершу вимикає питання (`saved`), а вже потім `navigation.goBack()`.

    **7. Синтетичне посилання.** `src/links.ts`: `parseRecordLink(url)` приймає `courselab://wish/w-03` і `exp://…/--/wish/w-03`, адресу без шляху (так Expo Go відкриває застосунок) повертає як `null`, а посилання іншого вигляду чи з поламаним `id` веде на `NotFound` і ніколи не кидає винятку (`tests/links.test.js`). В `App.tsx`: `onReady={() => void Linking.getInitialURL().then(openFromLink)}` для холодного старту й `useEffect` з `Linking.addEventListener('url', …)` і `return () => subscription.remove()` для посилання, що приходить під час роботи.

    **8. Перевірка на комп’ютері.** `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — жодного рядка; `npm test` — `Пройшли: 37 · не пройшли: 0`; `npx expo export --platform android` — у нас `Android Bundled 1876ms index.ts (838 modules)`.

    **9. На заявленій цілі.** `npm start`. Рядок → деталі → «Редагувати» → зміни ціну → кнопка «назад» у шапці питає «Є незбережені зміни…»; «Лишитися» лишає форму, «Піти без збереження» — повертає до деталей зі старою ціною; те саме з кнопкою «Назад» Android чи жестом iOS. «Зберегти» — без питання, деталі й список показують нову ціну. Посилання з комп’ютера (емулятор або симулятор): `npx uri-scheme open "exp://<адреса з npm start>/--/wish/w-03" --android` (чи `--ios`) — і коли застосунок закритий, і коли він відкритий: деталі «Велосипед». `…/wish/w-99` — «Такого бажання немає», `…/wish/` — екран «не знайдено». На телефоні без емулятора посилання з комп’ютера не відкрити: цей пункт — «не виконано». Цих екранів ми не бачили.

    **10. Доказ і commit.** У `EVIDENCE.md` — розділ «RN-04»: рядки кроку 8 і побачене на цілі, або запис «не виконано» (що, ціль, чому, що потрібно, щоб повернутися; тоді на сторінці кроку — «У мене немає емулятора чи пристрою», а не «Цей крок виконано»). `git status --short` — серед іншого `?? src/DetailScreen.tsx`, `?? src/EditScreen.tsx`, `?? src/links.ts`, `?? src/repository.ts`. `git add -A`, `git commit -m "Add detail and edit screens, a deep link and focus-aware reloading"` — у нас `21 files changed`.

    **Самоперевірка:** параметри екранів — лише `id`; кожен `addEventListener` має `remove()` у прибиранні того самого ефекту; `useFocusEffect` отримує функцію з `useCallback`; `src/links.ts`, `src/repository.ts` і `src/draft.ts` не імпортують `react-native`; копії домену, контракту й reducer без змін.

    **Якщо щось пішло не так:** питання не з’являється при жесті iOS чи кнопці Android — замість `usePreventRemove` стоїть власний `beforeRemove`: з `native-stack` він працює ненадійно. Після збереження все одно питає — `goBack()` викликано до того, як вимкнено питання. Посилання відкриває екран двічі або не відкриває після першого разу — слухач `url` не знято в прибиранні чи додано поза `useEffect`. Холодний старт з посиланням показує лише список — `getInitialURL` викликано до `onReady`.

    Еталон кроку — `Завантажити: RN-04 — Список, деталі й редагування: стек екранів` після експорту (без `assets/*.png`, `LICENSE`, `package-lock.json` і `node_modules/` — див. крок RN-01). Команди виконано лише на macOS; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    One screen becomes a stack of four: the list, a record's detail, its edit and “not found”. A screen receives only the record's `id` and reads the saved list itself, so a link, a back step or a return from the edit never shows stale data. A changed record is not lost without a question, a synthetic link opens one record, and the subscriptions to app events do not multiply.

    | Project | Link | Question before leaving when changed | What is refreshed |
    |---|---|---|---|
    | Wishlist | `…/wish/w-03` | name, price (and category) | the list — on every focus of the screen |
    | Planner | `…/task/t-02` | title, due date (and priority) | “Due as of …” — after a return to the app |
    | Habit tracker | `…/habit/h-01` | name, frequency | “Completed today” — after a return to the app |
    | Expense tracker | `…/expense/e-02` | label, amount (and date, category) | the category totals — on every focus of the screen |

    In all four the list is read again on every focus; in the planner and the habit tracker “today” is also asked of the clock whenever the app returns to the foreground.

    Below is the wishlist. The computer commands were run on macOS (Node.js 25.2.1, Expo SDK 57, React Navigation 7) on all four projects. There was no emulator, simulator or phone: step 9 follows the documentation of React Navigation 7, Expo SDK 57 and this unit's lessons, and no output of it is quoted here.

    **1. The starting state.** `cd ~/js-course/wishlist-native`, `git status` — clean, `git log --oneline -1` — the commit of the list with adapters.

    **2. Navigation.** `npx expo install @react-navigation/native @react-navigation/native-stack react-native-screens` — for us `› Installing 1 SDK 57.0.0 compatible native module and 2 other packages using npm`, and `package.json` has `^7.5.0`, `^7.20.0` and `~4.26.0` (`react-native-safe-area-context` is already there). Add `"scheme": "courselab"` to `app.json` — it works only in a separate build of the app; in Expo Go a link looks like `exp://<address of npm start>/--/wish/w-03`.

    **3. One source of the list.** `src/snapshot.ts` gets `loadSnapshot(storage)`: the saved text → `JSON.parse` → `schemaVersion: 1` → `parseItemList`; nothing usable — `null`. `src/repository.ts`: `createRepository(storage, startingItems)` with `readAll()` (the saved list or the starting one) and `apply(action)` (read, `itemsReducer`, save only when the list changed). All of it without `react-native`, so `tests/repository.test.js` checks in Node.js: a read saves nothing, an accepted action is saved and seen by a new repository, a refused one is not. `src/services.tsx` — a context with the repository and the price format, which `App.tsx` puts above the navigator.

    **4. The stack.** `src/navigation.ts`: the type `RootStackParamList` — `List`, `Detail: { id }`, `Edit: { id }`, `NotFound`. `App.tsx`: `createNativeStackNavigator<RootStackParamList>()`, a `NavigationContainer` with a `ref` from `createNavigationContainerRef`, four `Stack.Screen`s with titles. The stack draws the header now, so the own header with `insets.top` goes away; the bottom and side paddings from `insets` stay.

    **5. The list and the detail.** `ItemsScreen` keeps the list in state and reads it from `useFocusEffect(useCallback(() => { let active = true; … return () => { active = false; }; }, [repository]))`: the first opening, a return from the detail or the edit — a new `readAll()`, and an answer that arrives after the focus was lost changes nothing. There is no listener here to remove. Pressing a row — `navigation.navigate('Detail', { id: item.id })`. `DetailScreen` finds the wish through `indexById` on every focus; an unknown `id` — its own state “There is no such wish” and “← To the list”.

    **6. The question before leaving.** `src/draft.ts`: `hasUnsavedChanges(draft, saved)` — spaces at the edges do not count (the test is in `tests/draft.test.js`). `ItemForm` gets `onDraftChange`, and `EditScreen` calls `usePreventRemove(dirty, ({ data }) => Alert.alert('There are unsaved changes. Leave without saving?', undefined, [{ text: 'Stay', style: 'cancel' }, { text: 'Leave without saving', style: 'destructive', onPress: () => navigation.dispatch(data.action) }]))`. So the header's back button, Android's Back button and the iOS gesture all ask — without a separate handler for each. A save first turns the question off (`saved`) and only then calls `navigation.goBack()`.

    **7. The synthetic link.** `src/links.ts`: `parseRecordLink(url)` accepts `courselab://wish/w-03` and `exp://…/--/wish/w-03`, returns an address without a path (that is how Expo Go opens the app) as `null`, and a link of another form or with a broken `id` leads to `NotFound` and never throws (`tests/links.test.js`). In `App.tsx`: `onReady={() => void Linking.getInitialURL().then(openFromLink)}` for the cold start, and a `useEffect` with `Linking.addEventListener('url', …)` and `return () => subscription.remove()` for a link that arrives while the app runs.

    **8. The check on the computer.** `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — not a single line; `npm test` — `Passed: 37 · failed: 0`; `npx expo export --platform android` — for us `Android Bundled 1876ms index.ts (838 modules)`.

    **9. On the declared target.** `npm start`. A row → the detail → “Edit” → change the price → the header's back button asks “There are unsaved changes…”; “Stay” keeps the form, “Leave without saving” returns to the detail with the old price; the same with Android's Back button or the iOS gesture. “Save” — no question, the detail and the list show the new price. A link from the computer (an emulator or a simulator): `npx uri-scheme open "exp://<address of npm start>/--/wish/w-03" --android` (or `--ios`) — both when the app is closed and when it is open: the detail of “Bicycle”. `…/wish/w-99` — “There is no such wish”, `…/wish/` — the not-found screen. On a phone without an emulator a link from the computer cannot be opened: that item is “not performed”. We have not seen these screens.

    **10. Evidence and commit.** In `EVIDENCE.md`, a section “RN-04”: the lines of step 8 and what you saw on the target, or a “not performed” record (what, the target, why, what it takes to come back; then, on the step's page, “I have no emulator or device”, not “I have done this step”). `git status --short` — among others `?? src/DetailScreen.tsx`, `?? src/EditScreen.tsx`, `?? src/links.ts`, `?? src/repository.ts`. `git add -A`, `git commit -m "Add detail and edit screens, a deep link and focus-aware reloading"` — for us `21 files changed`.

    **Self-check:** the screens' params are only an `id`; every `addEventListener` has its `remove()` in the cleanup of the same effect; `useFocusEffect` gets a function from `useCallback`; `src/links.ts`, `src/repository.ts` and `src/draft.ts` do not import `react-native`; the copies of the domain, the contract and the reducer are unchanged.

    **If something goes wrong:** no question on the iOS gesture or the Android button — an own `beforeRemove` stands instead of `usePreventRemove`: with `native-stack` it is unreliable. It still asks after a save — `goBack()` was called before the question was turned off. A link opens the screen twice or no longer after the first time — the `url` listener is not removed in the cleanup or was added outside `useEffect`. A cold start with a link shows only the list — `getInitialURL` was called before `onReady`.

    The step's reference is `Download: RN-04 — List, detail and edit: a stack of screens` after the export (without `assets/*.png`, `LICENSE`, `package-lock.json` and `node_modules/` — see step RN-01). The commands were run on macOS only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це крок твого проєкту: стек екранів із параметрами, питання перед втратою змін, фокус екрана й стан застосунку, прибирання підписок і посилання із цього розділу ти застосовуєш до власного застосунку. Платформа цей крок не перевіряє: доказ — вивід команд, тести, `EVIDENCE.md` і commit."
  en: "This is a step of your project: you apply this unit's stack with params, the question before losing changes, screen focus and app state, subscription cleanup and links to your own app. The platform does not check this step: the evidence is the command output, the tests, `EVIDENCE.md` and the commit."
objectives:
  - uk: "Побудувати стек список → деталі → редагування, де екран отримує лише `id`, а вихід зі зміненої форми будь-яким способом спершу питає."
    en: "Build a list → detail → edit stack in which a screen receives only an `id`, and leaving a changed form in any way asks first."
  - uk: "Відкрити один запис синтетичним посиланням на холодному старті й під час роботи та оновлювати дані на фокусі чи після повернення в застосунок без зайвих підписок."
    en: "Open one record from a synthetic link on a cold start and while the app runs, and refresh the data on focus or after a return to the app without extra subscriptions."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й на заявленій нативній цілі: що зробити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and on the declared native target: what to do, the expected output and the self-check list are above and on the step's page in your project."
