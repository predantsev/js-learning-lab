# Habit tracker variant of step RN-04 (a local step: done in the learner's editor, terminal and on the
# declared native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1,
# Expo SDK 57, React Navigation 7) on the scratch project of this capstone; nothing was run on an
# emulator, a simulator or a phone.
strings:
  detailTitle: { uk: "Звичка", en: "Habit" }
instructions:
  uk: |
    Перетвори екран на стек список → деталі → редагування з питанням перед втратою змін, відкрий звичку `h-01` синтетичним посиланням і оновлюй стан «сьогодні», коли застосунок повертається на передній план. Платформа цей крок не перевіряє.

    1. `npx expo install @react-navigation/native @react-navigation/native-stack react-native-screens`; `"scheme": "courselab"` в `app.json`.
    2. `src/snapshot.ts`: `loadSnapshot`; `src/repository.ts`: `createRepository(storage, startingHabits)` з `readAll()` і `apply(action)`; `src/services.tsx`: контекст із репозиторієм і годинником; тест `tests/repository.test.js`.
    3. `src/navigation.ts`: `RootStackParamList` (`List`, `Detail: { id }`, `Edit: { id }`, `NotFound`); у `App.tsx` — `NavigationContainer` з `ref` і чотири екрани з заголовками «%%projectTitle%%», «%%detailTitle%%», «%%editTitle%%», «%%notFoundTitle%%».
    4. `HabitsScreen`: `useFocusEffect(useCallback(…))` з `readAll()`; `today` у стані з `clock.today()` і `AppState.addEventListener('change', …)`, що на `active` питає годинник знову, з `remove()` у прибиранні; «%%doneTodayMark%%» і «%%markTodayLabel%%» залежать від цього `today`. `DetailScreen`: звичка через `indexById`, «%%completionsLabel%%», невідомий `id` — «%%notFoundTitle%%».
    5. `hasUnsavedChanges(draft, saved)` у `src/draft.ts` з тестом; `HabitForm` з `onDraftChange`; `EditScreen` — `usePreventRemove` з `Alert.alert` «%%unsavedQuestion%%», «%%stayLabel%%» / «%%leaveLabel%%»; збереження спершу вимикає питання, потім `goBack()`.
    6. `src/links.ts`: `parseRecordLink` (`courselab://habit/h-01`, `exp://…/--/habit/h-01`, адреса без шляху — `null`, поламане — `NotFound`) з `tests/links.test.js`; в `App.tsx` — `getInitialURL` в `onReady` і слухач `url` з `remove()` у прибиранні.
    7. `EVIDENCE.md`, розділ «RN-04»; `git commit -m "Add detail and edit screens, a deep link and focus-aware reloading"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — жодного рядка; `npm test` — 37 тестів, «не пройшли: 0».
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі: рядок → «%%detailTitle%%» → «%%editLabel%%»; змінена частота й «назад» у шапці — «%%unsavedQuestion%%»; «%%leaveLabel%%» повертає зі старою частотою; так само кнопка «Назад» Android або жест iOS; «%%saveLabel%%» — без питання.
    - На цілі: `npx uri-scheme open "exp://<адреса з npm start>/--/habit/h-01" --android` (чи `--ios`) і на закритому, і на відкритому застосунку — деталі «%%fixture1Name%%»; `…/habit/h-99` — «%%notFoundTitle%%».
    - На цілі: «%%markTodayLabel%%» → «%%doneTodayMark%%»; застосунок у фоні через північ (або зміна дати пристрою), повернення — позначка зникає, кнопка знову є.

    **Доказ:** commit і `EVIDENCE.md` — рядки команд і те, що ти бачив на цілі, або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися (посилання з комп’ютера потребує емулятора чи симулятора).
  en: |
    Turn the screen into a list → detail → edit stack with a question before losing changes, open the habit `h-01` from a synthetic link, and refresh the “today” state when the app returns to the foreground. The platform does not check this step.

    1. `npx expo install @react-navigation/native @react-navigation/native-stack react-native-screens`; `"scheme": "courselab"` in `app.json`.
    2. `src/snapshot.ts`: `loadSnapshot`; `src/repository.ts`: `createRepository(storage, startingHabits)` with `readAll()` and `apply(action)`; `src/services.tsx`: a context with the repository and the clock; the test `tests/repository.test.js`.
    3. `src/navigation.ts`: `RootStackParamList` (`List`, `Detail: { id }`, `Edit: { id }`, `NotFound`); in `App.tsx` — a `NavigationContainer` with a `ref` and four screens titled “%%projectTitle%%”, “%%detailTitle%%”, “%%editTitle%%”, “%%notFoundTitle%%”.
    4. `HabitsScreen`: `useFocusEffect(useCallback(…))` with `readAll()`; `today` in state from `clock.today()` and an `AppState.addEventListener('change', …)` that asks the clock again on `active`, with `remove()` in the cleanup; “%%doneTodayMark%%” and “%%markTodayLabel%%” depend on that `today`. `DetailScreen`: the habit through `indexById`, “%%completionsLabel%%”, an unknown `id` — “%%notFoundTitle%%”.
    5. `hasUnsavedChanges(draft, saved)` in `src/draft.ts` with a test; `HabitForm` with `onDraftChange`; `EditScreen` — `usePreventRemove` with `Alert.alert` “%%unsavedQuestion%%”, “%%stayLabel%%” / “%%leaveLabel%%”; a save first turns the question off, then `goBack()`.
    6. `src/links.ts`: `parseRecordLink` (`courselab://habit/h-01`, `exp://…/--/habit/h-01`, an address without a path — `null`, a broken one — `NotFound`) with `tests/links.test.js`; in `App.tsx` — `getInitialURL` in `onReady` and a `url` listener with `remove()` in the cleanup.
    7. `EVIDENCE.md`, a section “RN-04”; `git commit -m "Add detail and edit screens, a deep link and focus-aware reloading"`.

    **Self-check — confirm every item yourself:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — not a single line; `npm test` — 37 tests, “failed: 0”.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target: a row → “%%detailTitle%%” → “%%editLabel%%”; a changed frequency and the header's back — “%%unsavedQuestion%%”; “%%leaveLabel%%” returns with the old frequency; the same with Android's Back button or the iOS gesture; “%%saveLabel%%” — no question.
    - On the target: `npx uri-scheme open "exp://<address of npm start>/--/habit/h-01" --android` (or `--ios`) on a closed and on an open app — the detail of “%%fixture1Name%%”; `…/habit/h-99` — “%%notFoundTitle%%”.
    - On the target: “%%markTodayLabel%%” → “%%doneTodayMark%%”; the app in the background across midnight (or a changed device date), then back — the mark is gone and the button is there again.

    **Evidence:** the commit and `EVIDENCE.md` — the command lines and what you saw on the target, or a “not performed” record: what, on which target, why, what it takes to come back (a link from the computer needs an emulator or a simulator).
