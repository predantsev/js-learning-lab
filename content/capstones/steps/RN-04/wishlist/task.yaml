# Wishlist variant of step RN-04 (a local step: done in the learner's editor, terminal and on the declared
# native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1, Expo SDK
# 57, React Navigation 7) on the scratch project of this capstone; nothing was run on an emulator, a
# simulator or a phone.
strings:
  detailTitle: { uk: "Бажання", en: "Wish" }
instructions:
  uk: |
    Перетвори екран на стек список → деталі → редагування з питанням перед втратою змін, відкрий бажання `w-03` синтетичним посиланням і перечитуй список на кожному фокусі. Платформа цей крок не перевіряє.

    1. `npx expo install @react-navigation/native @react-navigation/native-stack react-native-screens`; `"scheme": "courselab"` в `app.json`.
    2. `src/snapshot.ts`: `loadSnapshot`; `src/repository.ts`: `createRepository(storage, startingItems)` з `readAll()` і `apply(action)`; `src/services.tsx`: контекст із репозиторієм і форматом; тест `tests/repository.test.js`.
    3. `src/navigation.ts`: `RootStackParamList` (`List`, `Detail: { id }`, `Edit: { id }`, `NotFound`); у `App.tsx` — `NavigationContainer` з `ref` і чотири екрани із заголовками «%%projectTitle%%», «%%detailTitle%%», «%%editTitle%%», «%%notFoundTitle%%».
    4. `ItemsScreen`: `useFocusEffect(useCallback(…))` з `readAll()` і прапорцем `active` у прибиранні; рядок відкриває `Detail` з `id`. `DetailScreen`: бажання через `indexById`, невідомий `id` — «%%notFoundTitle%%» і «%%backToListLabel%%».
    5. `hasUnsavedChanges(draft, saved)` у `src/draft.ts` з тестом; `ItemForm` з `onDraftChange`; `EditScreen` — `usePreventRemove` з `Alert.alert` «%%unsavedQuestion%%», «%%stayLabel%%» / «%%leaveLabel%%» (`navigation.dispatch(data.action)`); збереження спершу вимикає питання, потім `goBack()`.
    6. `src/links.ts`: `parseRecordLink` (`courselab://wish/w-03`, `exp://…/--/wish/w-03`, адреса без шляху — `null`, поламане — `NotFound`) з `tests/links.test.js`; в `App.tsx` — `getInitialURL` в `onReady` і слухач `url` з `remove()` у прибиранні.
    7. `EVIDENCE.md`, розділ «RN-04»; `git commit -m "Add detail and edit screens, a deep link and focus-aware reloading"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — жодного рядка; `npm test` — 37 тестів, «не пройшли: 0».
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі: рядок → «%%detailTitle%%» → «%%editLabel%%»; змінена ціна й «назад» у шапці — «%%unsavedQuestion%%»; «%%stayLabel%%» лишає форму, «%%leaveLabel%%» повертає зі старою ціною; так само кнопка «Назад» Android або жест iOS.
    - На цілі: «%%saveLabel%%» — без питання, деталі й список показують нову ціну.
    - На цілі: `npx uri-scheme open "exp://<адреса з npm start>/--/wish/w-03" --android` (чи `--ios`) і на закритому, і на відкритому застосунку — деталі «%%fixture3Name%%»; `…/wish/w-99` — «%%notFoundTitle%%».
    - На цілі: нове бажання, додане на списку, видно після «назад» із деталей іншого; список не мерехтить і не дублюється.

    **Доказ:** commit і `EVIDENCE.md` — рядки команд і те, що ти бачив на цілі, або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися (посилання з комп’ютера потребує емулятора чи симулятора). Без цілі натисни на цій сторінці «У мене немає емулятора чи пристрою», а не «Цей крок виконано».
  en: |
    Turn the screen into a list → detail → edit stack with a question before losing changes, open the wish `w-03` from a synthetic link, and read the list again on every focus. The platform does not check this step.

    1. `npx expo install @react-navigation/native @react-navigation/native-stack react-native-screens`; `"scheme": "courselab"` in `app.json`.
    2. `src/snapshot.ts`: `loadSnapshot`; `src/repository.ts`: `createRepository(storage, startingItems)` with `readAll()` and `apply(action)`; `src/services.tsx`: a context with the repository and the format; the test `tests/repository.test.js`.
    3. `src/navigation.ts`: `RootStackParamList` (`List`, `Detail: { id }`, `Edit: { id }`, `NotFound`); in `App.tsx` — a `NavigationContainer` with a `ref` and four screens titled “%%projectTitle%%”, “%%detailTitle%%”, “%%editTitle%%”, “%%notFoundTitle%%”.
    4. `ItemsScreen`: `useFocusEffect(useCallback(…))` with `readAll()` and an `active` flag in the cleanup; a row opens `Detail` with the `id`. `DetailScreen`: the wish through `indexById`, an unknown `id` — “%%notFoundTitle%%” and “%%backToListLabel%%”.
    5. `hasUnsavedChanges(draft, saved)` in `src/draft.ts` with a test; `ItemForm` with `onDraftChange`; `EditScreen` — `usePreventRemove` with `Alert.alert` “%%unsavedQuestion%%”, “%%stayLabel%%” / “%%leaveLabel%%” (`navigation.dispatch(data.action)`); a save first turns the question off, then `goBack()`.
    6. `src/links.ts`: `parseRecordLink` (`courselab://wish/w-03`, `exp://…/--/wish/w-03`, an address without a path — `null`, a broken one — `NotFound`) with `tests/links.test.js`; in `App.tsx` — `getInitialURL` in `onReady` and a `url` listener with `remove()` in the cleanup.
    7. `EVIDENCE.md`, a section “RN-04”; `git commit -m "Add detail and edit screens, a deep link and focus-aware reloading"`.

    **Self-check — confirm every item yourself:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — not a single line; `npm test` — 37 tests, “failed: 0”.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target: a row → “%%detailTitle%%” → “%%editLabel%%”; a changed price and the header's back — “%%unsavedQuestion%%”; “%%stayLabel%%” keeps the form, “%%leaveLabel%%” returns with the old price; the same with Android's Back button or the iOS gesture.
    - On the target: “%%saveLabel%%” — no question, the detail and the list show the new price.
    - On the target: `npx uri-scheme open "exp://<address of npm start>/--/wish/w-03" --android` (or `--ios`) on a closed and on an open app — the detail of “%%fixture3Name%%”; `…/wish/w-99` — “%%notFoundTitle%%”.
    - On the target: a new wish added on the list is there after “back” from another wish's detail; the list neither flickers nor doubles.

    **Evidence:** the commit and `EVIDENCE.md` — the command lines and what you saw on the target, or a “not performed” record: what, on which target, why, what it takes to come back (a link from the computer needs an emulator or a simulator). Without a target, press “I have no emulator or device” on this page, not “I have done this step”.
