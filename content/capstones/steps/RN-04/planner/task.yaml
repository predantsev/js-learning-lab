# Planner variant of step RN-04 (a local step: done in the learner's editor, terminal and on the declared
# native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1, Expo SDK
# 57, React Navigation 7) on the scratch project of this capstone; nothing was run on an emulator, a
# simulator or a phone.
strings:
  detailTitle: { uk: "Справа", en: "Task" }
instructions:
  uk: |
    Перетвори екран на стек список → деталі → редагування з питанням перед втратою змін, відкрий справу `t-02` синтетичним посиланням і перераховуй справи на сьогодні, коли застосунок повертається на передній план. Платформа цей крок не перевіряє.

    1. `npx expo install @react-navigation/native @react-navigation/native-stack react-native-screens`; `"scheme": "courselab"` в `app.json`.
    2. `src/snapshot.ts`: `loadSnapshot`; `src/repository.ts`: `createRepository(storage, startingTasks)` з `readAll()` і `apply(action)`; `src/services.tsx`: контекст із репозиторієм, форматом дати й годинником; `src/adapters.ts` отримує `createSystemClock()` і `createFixedClock(day)`; тести `tests/repository.test.js` і лічильника з фіксованим годинником.
    3. `src/navigation.ts`: `RootStackParamList` (`List`, `Detail: { id }`, `Edit: { id }`, `NotFound`); у `App.tsx` — `NavigationContainer` з `ref` і чотири екрани із заголовками «%%projectTitle%%», «%%detailTitle%%», «%%editTitle%%», «%%notFoundTitle%%».
    4. `TasksScreen`: `useFocusEffect(useCallback(…))` з `readAll()`; `today` у стані з `clock.today()` і `AppState.addEventListener('change', …)`, що на `active` питає годинник знову, з `remove()` у прибиранні; рядок «%%dueSummary%% <день>: <число>» з `countDueTasks(tasks, today)`. `DetailScreen`: справа через `indexById`, невідомий `id` — «%%notFoundTitle%%».
    5. `hasUnsavedChanges(draft, saved)` у `src/draft.ts` з тестом; `TaskForm` з `onDraftChange`; `EditScreen` — `usePreventRemove` з `Alert.alert` «%%unsavedQuestion%%», «%%stayLabel%%» / «%%leaveLabel%%»; збереження спершу вимикає питання, потім `goBack()`.
    6. `src/links.ts`: `parseRecordLink` (`courselab://task/t-02`, `exp://…/--/task/t-02`, адреса без шляху — `null`, поламане — `NotFound`) з `tests/links.test.js`; в `App.tsx` — `getInitialURL` в `onReady` і слухач `url` з `remove()` у прибиранні.
    7. `EVIDENCE.md`, розділ «RN-04»; `git commit -m "Add detail and edit screens, a deep link and focus-aware reloading"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — жодного рядка; `npm test` — 39 тестів, «не пройшли: 0».
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі: рядок → «%%detailTitle%%» → «%%editLabel%%»; змінений термін і «назад» у шапці — «%%unsavedQuestion%%»; «%%leaveLabel%%» повертає зі старим терміном; так само кнопка «Назад» Android або жест iOS; «%%saveLabel%%» — без питання.
    - На цілі: `npx uri-scheme open "exp://<адреса з npm start>/--/task/t-02" --android` (чи `--ios`) і на закритому, і на відкритому застосунку — деталі «%%fixture2Name%%»; `…/task/t-99` — «%%notFoundTitle%%».
    - На цілі: «%%dueSummary%%» показує сьогоднішню дату; застосунок у фоні, повернення — дата й число з годинника знову (перевір через північ або зміною дати в налаштуваннях пристрою й назад).

    **Доказ:** commit і `EVIDENCE.md` — рядки команд і те, що ти бачив на цілі, або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися (посилання з комп’ютера потребує емулятора чи симулятора). Без цілі натисни на цій сторінці «У мене немає емулятора чи пристрою», а не «Цей крок виконано».
  en: |
    Turn the screen into a list → detail → edit stack with a question before losing changes, open the task `t-02` from a synthetic link, and count the tasks due today again when the app returns to the foreground. The platform does not check this step.

    1. `npx expo install @react-navigation/native @react-navigation/native-stack react-native-screens`; `"scheme": "courselab"` in `app.json`.
    2. `src/snapshot.ts`: `loadSnapshot`; `src/repository.ts`: `createRepository(storage, startingTasks)` with `readAll()` and `apply(action)`; `src/services.tsx`: a context with the repository, the date format and the clock; `src/adapters.ts` gets `createSystemClock()` and `createFixedClock(day)`; the tests `tests/repository.test.js` and the count with a fixed clock.
    3. `src/navigation.ts`: `RootStackParamList` (`List`, `Detail: { id }`, `Edit: { id }`, `NotFound`); in `App.tsx` — a `NavigationContainer` with a `ref` and four screens titled “%%projectTitle%%”, “%%detailTitle%%”, “%%editTitle%%”, “%%notFoundTitle%%”.
    4. `TasksScreen`: `useFocusEffect(useCallback(…))` with `readAll()`; `today` in state from `clock.today()` and an `AppState.addEventListener('change', …)` that asks the clock again on `active`, with `remove()` in the cleanup; a line “%%dueSummary%% <day>: <number>” from `countDueTasks(tasks, today)`. `DetailScreen`: the task through `indexById`, an unknown `id` — “%%notFoundTitle%%”.
    5. `hasUnsavedChanges(draft, saved)` in `src/draft.ts` with a test; `TaskForm` with `onDraftChange`; `EditScreen` — `usePreventRemove` with `Alert.alert` “%%unsavedQuestion%%”, “%%stayLabel%%” / “%%leaveLabel%%”; a save first turns the question off, then `goBack()`.
    6. `src/links.ts`: `parseRecordLink` (`courselab://task/t-02`, `exp://…/--/task/t-02`, an address without a path — `null`, a broken one — `NotFound`) with `tests/links.test.js`; in `App.tsx` — `getInitialURL` in `onReady` and a `url` listener with `remove()` in the cleanup.
    7. `EVIDENCE.md`, a section “RN-04”; `git commit -m "Add detail and edit screens, a deep link and focus-aware reloading"`.

    **Self-check — confirm every item yourself:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — not a single line; `npm test` — 39 tests, “failed: 0”.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target: a row → “%%detailTitle%%” → “%%editLabel%%”; a changed due date and the header's back — “%%unsavedQuestion%%”; “%%leaveLabel%%” returns with the old due date; the same with Android's Back button or the iOS gesture; “%%saveLabel%%” — no question.
    - On the target: `npx uri-scheme open "exp://<address of npm start>/--/task/t-02" --android` (or `--ios`) on a closed and on an open app — the detail of “%%fixture2Name%%”; `…/task/t-99` — “%%notFoundTitle%%”.
    - On the target: “%%dueSummary%%” shows today's date; the app in the background, then back — the date and the number come from the clock again (check across midnight or by changing the device's date in the settings and back).

    **Evidence:** the commit and `EVIDENCE.md` — the command lines and what you saw on the target, or a “not performed” record: what, on which target, why, what it takes to come back (a link from the computer needs an emulator or a simulator). Without a target, press “I have no emulator or device” on this page, not “I have done this step”.
