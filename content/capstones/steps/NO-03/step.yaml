# Capstone step of unit NO-03 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson of kind capstone-step of NO-03 from this file.
# A local step: done in the learner's editor and terminal; no platform checks. The project page shows only
# the intro of a local step, so the intro carries the whole procedure.
# Every command was run on macOS (Node.js 25.2.1, npm 11.6.2, TypeScript 7.0.2, curl 8.7.1) in a scratch home on
# all four projects, continuing the NO-02 scratch projects, in a Ukrainian and an English workspace: npm start,
# curl -i for /records, an unknown path and DELETE /records, a second copy on the same port (EADDRINUSE),
# SIGINT, curl against the stopped server, a change while the server was stopped, the restart, npm run
# check:server (6 of 6), npm run typecheck, npm run lint of the web project, the commit. Deliberately wrong
# variants were run against npm run check:server on the wishlist and failed it: a 404 sent as 200, a 404 branch
# that never ends the answer (also blocks the stop), a plain-text 404, a 405 without Allow, routing by req.url
# with ===, no SIGINT handler, a SIGINT handler without server.close(), Content-Length in characters, an
# answer that is not the stored file. Not run: Node.js 22, Linux, Windows. Quoted output is from the wishlist
# run in the Ukrainian workspace.
# reference/ is the NO-02 reference plus the files of this step (without node_modules/, package-lock.json and
# the runtime folders server/data/ and server/.check/).
unit: NO-03
mode: local
entry: index.html
title:
  uk: "Перший endpoint: GET /records на 127.0.0.1"
  en: "The first endpoint: GET /records on 127.0.0.1"
intro:
  uk: |
    Твій проєкт отримує справжній HTTP-сервер. `server/src/server.ts` на `127.0.0.1` і порті з `loadConfig` (за замовчуванням `4311`, поруч із `4310` вебзастосунку) відповідає на `GET /records` записами з файлового репозиторію; будь-яка інша адреса — JSON-помилка `404`, інший метод на `/records` — `405` з `Allow: GET`. Кожна відповідь іде через `sendJson`. Ти надсилаєш справжні запити, зупиняєш сервер через Ctrl+C і запускаєш знову.

    | Проєкт | `GET /records` — масив записів із полями |
    |---|---|
    | Список бажань | `id`, `name`, `price`, `acquired`, `category` |
    | Планувальник | `id`, `title`, `dueDate`, `done`, `priority` |
    | Трекер звичок | `id`, `name`, `frequency`, `active`, `completions` |
    | Трекер витрат | `id`, `label`, `amountMinor` (ціле, копійки), `date`, `category` |

    Перевірено на macOS (Node.js 25.2.1, curl 8.7.1) на всіх чотирьох проєктах; нижче — «Список бажань» в українському проєкті. На Node.js 22, Linux і Windows не перевірялося; у PowerShell команда — `curl.exe`.

    **1. Стан на початку.** `cd ~/js-course/wishlist`, `git status` — чисто, `git log --oneline -1` — commit `Store records in server/data with atomic writes and a crash rehearsal`.

    **2. Порт у конфігурації.** `loadConfig` отримує `port`: `PORT` — лише цифри, від 1 до 65535, без неї — `4311`. У планувальнику й трекері звичок `TODAY` тепер необов’язкова в `loadConfig` (серверу дата не потрібна), а скрипти, що рахують за днем, вимагають її через `requireToday` — з тим самим повідомленням `TODAY is required, for example TODAY=2026-03-01`.

    **3. `src/server.ts`.** `sendJson(res, status, value)` ставить статус, `content-type: application/json; charset=utf-8` і `content-length` у **байтах** (`Buffer.byteLength`: українська літера — два байти), потім `res.end(text)`. `createRecordsServer(repository, log)` повертає `http.Server`, що ще не слухає: маршрут за `new URL(req.url, "http://localhost").pathname`, тож `/records?view=all` — теж `/records`; кожна гілка закінчується `sendJson`; збій усередині — `500` з `{ "error": "internal error" }`, подробиці лише в терміналі. Рядок `res.on("finish", …)` друкує `GET /records → 200`.

    **4. Запуск лише з `node`.** Унизу файла — частина, що виконується тільки для `node src/server.ts`: `process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href`. Вона читає конфігурацію, відкриває репозиторій через `openRepository` (прибирає `*.tmp`, на першому старті засіває файл), слухає `server.listen(port, "127.0.0.1")` і на `SIGINT` викликає `server.close()`. У `server/package.json` — `"start": "node src/server.ts"`.

    **5. Справжні запити.** `cd server`, `npm start` — у нас `Records server listening on http://127.0.0.1:4311` і `Stop it with Ctrl+C.`. У другому терміналі:

    ```text
    $ curl -i http://127.0.0.1:4311/records
    HTTP/1.1 200 OK
    content-type: application/json; charset=utf-8
    content-length: 595
    …
    [{"id":"w-01","name":"Навушники","price":80,"acquired":false,"category":"Техніка"},…
    ```

    `curl -i http://127.0.0.1:4311/nothing-here` — `HTTP/1.1 404 Not Found` і `{"error":"not found"}`; `curl -i -X DELETE http://127.0.0.1:4311/records` — `HTTP/1.1 405 Method Not Allowed`, `allow: GET` і `{"error":"method not allowed"}`. Друга копія сервера на тому самому порті падає з `Error: listen EADDRINUSE: address already in use 127.0.0.1:4311`.

    **6. Зупинка.** Ctrl+C у терміналі сервера — у нас `SIGINT received: closing the server…` і `Server closed. Bye.`, процес закінчився сам. `curl -sS http://127.0.0.1:4311/records` тепер — `curl: (7) Failed to connect to 127.0.0.1 port 4311 …: Couldn't connect to server`.

    **7. Перезапуск.** Поки сервер зупинено, зміни запис скриптом попереднього кроку (`npm run acquire -- w-02`). `npm start` знову — `curl -sS http://127.0.0.1:4311/records` повертає ті самі бажання, а w-02 — з `"acquired":true`: сервер читає файл, а не пам’ять.

    **8. Перевірка.** `npm run check:server` (`src/check-server.ts`) запускає `node src/server.ts` окремим процесом на вільному порті з власною текою даних, надсилає запити з тайм-аутом 2 с, зупиняє його сигналом `SIGINT` і запускає знову: у нас `6 of 6 checks passed`. Спробуй зламати: відповідай на невідому адресу `200` — `✖ GET /nothing-here → 404, JSON — status 200`; забудь `sendJson` у гілці 404 — та сама перевірка падає з тайм-аутом, а ще `✖ … still running 3 s after SIGINT`: відкрита відповідь не дає `server.close()` закінчитися; прибери `server.close()` з обробника `SIGINT` — `still running 3 s after SIGINT`; порівнюй `req.url === "/records"` — `✖ GET /records?view=all → 200 (routing by pathname)`.

    **9. Доказ і commit.** `npm run typecheck` — жодного рядка. У `docs/server.md` — розділ «NO-03» з виводом кроків 5–8. `cd ..`, `git add -A`, `git commit -m "Serve GET /records from the file repository on 127.0.0.1"`.

    **Самоперевірка:** сервер слухає лише `127.0.0.1`; кожна гілка обробника закінчується `sendJson`; невідома адреса — `404` JSON, інший метод — `405` з `Allow`; `content-length` — у байтах; Ctrl+C закриває сервер, і процес закінчується сам; після перезапуску `GET /records` — дані з файла; `npm run check:server` — усі перевірки `✔`.

    **Якщо щось не так:** `EADDRINUSE` — на `4311` уже слухає інша копія: зупини її Ctrl+C у її терміналі або візьми інший порт (`PORT=4312 npm start`). Після Ctrl+C видно `SIGINT received…`, але не `Server closed` — `server.close()` чекає на з’єднання, чий запит ще не закінчено (так буває, коли гілка обробника не відповіла): зупини того клієнта. `curl` висить без відповіді — у якійсь гілці немає `sendJson`/`res.end()`; `curl -i --max-time 2` на кількох адресах швидко покаже, на якій.

    Референс кроку — `Завантажити: NO-03 — Перший endpoint: GET /records на 127.0.0.1` після експорту; відкрий його після власної спроби.
  en: |
    Your project gets a real HTTP server. `server/src/server.ts` on `127.0.0.1` and the port from `loadConfig` (`4311` by default, next to the web app's `4310`) answers `GET /records` with the records of the file repository; any other address is a JSON `404` error, another method on `/records` is a `405` with `Allow: GET`. Every answer goes through `sendJson`. You send real requests, stop the server with Ctrl+C and start it again.

    | Project | `GET /records` — an array of records with the fields |
    |---|---|
    | Wishlist | `id`, `name`, `price`, `acquired`, `category` |
    | Planner | `id`, `title`, `dueDate`, `done`, `priority` |
    | Habit tracker | `id`, `name`, `frequency`, `active`, `completions` |
    | Expense tracker | `id`, `label`, `amountMinor` (whole, kopiykas), `date`, `category` |

    Checked on macOS (Node.js 25.2.1, curl 8.7.1) on all four projects; below is the Wishlist in a Ukrainian project. Not checked on Node.js 22, Linux or Windows; in PowerShell the command is `curl.exe`.

    **1. The starting state.** `cd ~/js-course/wishlist`, `git status` — clean, `git log --oneline -1` — the commit `Store records in server/data with atomic writes and a crash rehearsal`.

    **2. The port in the configuration.** `loadConfig` gets `port`: `PORT` — digits only, from 1 to 65535, `4311` without it. In the planner and the habit tracker `TODAY` is now optional in `loadConfig` (the server needs no date), and the scripts that count by day require it through `requireToday` — with the same message `TODAY is required, for example TODAY=2026-03-01`.

    **3. `src/server.ts`.** `sendJson(res, status, value)` sets the status, `content-type: application/json; charset=utf-8` and a `content-length` in **bytes** (`Buffer.byteLength`: a Ukrainian letter takes two bytes), then `res.end(text)`. `createRecordsServer(repository, log)` returns an `http.Server` that is not listening yet: it routes by `new URL(req.url, "http://localhost").pathname`, so `/records?view=all` is `/records` too; every branch ends with `sendJson`; a failure inside is a `500` with `{ "error": "internal error" }`, the details only in the terminal. The line `res.on("finish", …)` prints `GET /records → 200`.

    **4. Started only by `node`.** At the bottom of the file is the part that runs only for `node src/server.ts`: `process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href`. It reads the configuration, opens the repository through `openRepository` (removes the `*.tmp`, fills the file on the first start), listens with `server.listen(port, "127.0.0.1")` and calls `server.close()` on `SIGINT`. `server/package.json` gets `"start": "node src/server.ts"`.

    **5. Real requests.** `cd server`, `npm start` — for us `Records server listening on http://127.0.0.1:4311` and `Stop it with Ctrl+C.`. In a second terminal:

    ```text
    $ curl -i http://127.0.0.1:4311/records
    HTTP/1.1 200 OK
    content-type: application/json; charset=utf-8
    content-length: 595
    …
    [{"id":"w-01","name":"Навушники","price":80,"acquired":false,"category":"Техніка"},…
    ```

    `curl -i http://127.0.0.1:4311/nothing-here` — `HTTP/1.1 404 Not Found` and `{"error":"not found"}`; `curl -i -X DELETE http://127.0.0.1:4311/records` — `HTTP/1.1 405 Method Not Allowed`, `allow: GET` and `{"error":"method not allowed"}`. A second copy of the server on the same port fails with `Error: listen EADDRINUSE: address already in use 127.0.0.1:4311`.

    **6. The stop.** Ctrl+C in the server's terminal — for us `SIGINT received: closing the server…` and `Server closed. Bye.`, and the process ended by itself. `curl -sS http://127.0.0.1:4311/records` now gives `curl: (7) Failed to connect to 127.0.0.1 port 4311 …: Couldn't connect to server`.

    **7. The restart.** While the server is stopped, change a record with the script of the previous step (`npm run acquire -- w-02`). `npm start` again — `curl -sS http://127.0.0.1:4311/records` returns the same wishes, and w-02 with `"acquired":true`: the server reads the file, not its memory.

    **8. The check.** `npm run check:server` (`src/check-server.ts`) starts `node src/server.ts` as a separate process on a free port with its own data folder, sends requests with a 2-second timeout, stops it with `SIGINT` and starts it again: for us `6 of 6 checks passed`. Try to break it: answer an unknown address with `200` — `✖ GET /nothing-here → 404, JSON — status 200`; forget `sendJson` in the 404 branch — the same check fails with a timeout, and also `✖ … still running 3 s after SIGINT`: the open answer keeps `server.close()` from finishing; remove `server.close()` from the `SIGINT` handler — `still running 3 s after SIGINT`; compare `req.url === "/records"` — `✖ GET /records?view=all → 200 (routing by pathname)`.

    **9. Evidence and the commit.** `npm run typecheck` — not a single line. In `docs/server.md` — a section “NO-03” with the output of steps 5–8. `cd ..`, `git add -A`, `git commit -m "Serve GET /records from the file repository on 127.0.0.1"`.

    **Self-check:** the server listens only on `127.0.0.1`; every branch of the handler ends with `sendJson`; an unknown address is a JSON `404`, another method a `405` with `Allow`; `content-length` is in bytes; Ctrl+C closes the server and the process ends by itself; after a restart `GET /records` is the data of the file; `npm run check:server` — every check `✔`.

    **If something goes wrong:** `EADDRINUSE` — another copy already listens on `4311`: stop it with Ctrl+C in its terminal or take another port (`PORT=4312 npm start`). After Ctrl+C you see `SIGINT received…` but no `Server closed` — `server.close()` waits for a connection whose request is not finished (this happens when a branch of the handler never answered): stop that client. `curl` hangs without an answer — some branch lacks `sendJson`/`res.end()`; `curl -i --max-time 2` on a few addresses shows which one within seconds.

    The step's reference is `Download: NO-03 — The first endpoint: GET /records on 127.0.0.1` after the export; open it after your own attempt.
purpose:
  uk: "Це крок твого проєкту: справжній HTTP-сервер, статуси й заголовки, маршрутизацію за адресою та чисту зупинку із цього розділу ти застосовуєш до власних записів — вони вперше доступні через мережу, поки що лише на твоєму комп’ютері. Платформа цей крок не перевіряє: доказ — вивід `curl`, `npm run check:server`, `docs/server.md` і commit."
  en: "This is a step of your project: you apply this unit's real HTTP server, statuses and headers, routing by address and clean stop to your own records — for the first time they are reachable over the network, so far only on your computer. The platform does not check this step: the evidence is the `curl` output, `npm run check:server`, `docs/server.md` and the commit."
objectives:
  - uk: "Запустити сервер на `127.0.0.1` і порті з `loadConfig`, що відповідає на `GET /records` записами з файлового репозиторію через `sendJson`, а невідомій адресі й іншому методу — JSON-помилками `404` і `405` з `Allow`."
    en: "Start a server on `127.0.0.1` and the port from `loadConfig` that answers `GET /records` with the records of the file repository through `sendJson`, and an unknown address and another method with JSON `404` and `405` errors with `Allow`."
  - uk: "Надіслати справжні запити `curl -i`, зупинити сервер через Ctrl+C так, щоб процес закінчився сам, перезапустити й показати, що повертаються дані з файла."
    en: "Send real `curl -i` requests, stop the server with Ctrl+C so that the process ends by itself, restart it and show that the data of the file comes back."
transfer:
  uk: "Цей крок виконується в редакторі й терміналі на твоєму комп’ютері: що зробити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor and a terminal on your computer: what to do, the expected output and the self-check list are above and on the step's page in your project."
