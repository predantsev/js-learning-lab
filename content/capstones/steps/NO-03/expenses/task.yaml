# Expense tracker variant of step NO-03 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS (Node.js 25.2.1, curl 8.7.1) on the scratch project of this capstone after NO-02, in a
# Ukrainian and an English workspace; not run on Linux or Windows (the review of 2026-10-05 ran check:server of
# the wishlist on Node.js 22.13.1 and 22.23.3: 6 of 6).
instructions:
  uk: |
    Запусти справжній HTTP-сервер проєкту, що віддає збережені записи. Платформа цей крок не перевіряє.

    1. `loadConfig`: `port` із `PORT` (лише цифри, 1–65535, за замовчуванням `4311`).
    2. `src/server.ts`: `sendJson(res, status, value)` і `createRecordsServer(repository, log)` — `GET /records` з `await repository.list()`, інша адреса — `404` `{ "error": … }`, інший метод на `/records` — `405` з `allow: GET`, збій — `500` без подробиць.
    3. Частина лише для `node src/server.ts`: `openRepository`, `server.listen(port, "127.0.0.1")`, `SIGINT` → `server.close()`; `"start": "node src/server.ts"`.
    4. `src/check-server.ts` (`npm run check:server`): сервер окремим процесом на вільному порті, запити, `SIGINT`, перезапуск.
    5. `docs/server.md`, розділ «NO-03»; `git commit -m "Serve GET /records from the file repository on 127.0.0.1"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `curl -i http://127.0.0.1:4311/records` — `200`, `content-type: application/json; charset=utf-8`, масив із семи записів (шість стартових і `e-07` з кроку NO-02) із полями `id`, `label`, `amountMinor`, `date`, `category`.
    - `curl -i http://127.0.0.1:4311/nothing-here` — `404` і `{"error":"not found"}`; `curl -i -X DELETE http://127.0.0.1:4311/records` — `405` і `allow: GET`.
    - Поки сервер працює, `lsof -nP -iTCP:4311 -sTCP:LISTEN` — `TCP 127.0.0.1:4311 (LISTEN)`, а не `*:4311`.
    - Ctrl+C — `Server closed. Bye.`, і процес закінчився сам.
    - `npm run add -- "Кава" 6500 food 2026-03-02` при зупиненому сервері — після `npm start` `GET /records` показує вісім записів, останній — `e-08`.
    - `npm run check:server` — `6 of 6 checks passed`; `npm run typecheck` — жодного рядка; `git status` після commit — чисто.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Start a real HTTP server for the project that serves the stored records. The platform does not check this step.

    1. `loadConfig`: `port` from `PORT` (digits only, 1–65535, `4311` by default).
    2. `src/server.ts`: `sendJson(res, status, value)` and `createRecordsServer(repository, log)` — `GET /records` from `await repository.list()`, another address — `404` `{ "error": … }`, another method on `/records` — `405` with `allow: GET`, a failure — `500` without details.
    3. The part only for `node src/server.ts`: `openRepository`, `server.listen(port, "127.0.0.1")`, `SIGINT` → `server.close()`; `"start": "node src/server.ts"`.
    4. `src/check-server.ts` (`npm run check:server`): the server as a separate process on a free port, requests, `SIGINT`, a restart.
    5. `docs/server.md`, a section “NO-03”; `git commit -m "Serve GET /records from the file repository on 127.0.0.1"`.

    **Self-check — confirm every item yourself:**

    - `curl -i http://127.0.0.1:4311/records` — `200`, `content-type: application/json; charset=utf-8`, an array of seven records (the six starting ones and `e-07` from step NO-02) with the fields `id`, `label`, `amountMinor`, `date`, `category`.
    - `curl -i http://127.0.0.1:4311/nothing-here` — `404` and `{"error":"not found"}`; `curl -i -X DELETE http://127.0.0.1:4311/records` — `405` and `allow: GET`.
    - While the server runs, `lsof -nP -iTCP:4311 -sTCP:LISTEN` — `TCP 127.0.0.1:4311 (LISTEN)`, not `*:4311`.
    - Ctrl+C — `Server closed. Bye.`, and the process ended by itself.
    - `npm run add -- "Кава" 6500 food 2026-03-02` while the server is stopped — after `npm start` `GET /records` shows eight records, the last one `e-08`.
    - `npm run check:server` — `6 of 6 checks passed`; `npm run typecheck` — not a single line; `git status` after the commit — clean.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
