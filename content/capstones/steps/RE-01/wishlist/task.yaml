# Wishlist variant of step RE-01 (a local step: done in the learner's terminal, editor and browser, no
# platform checks). Commands were run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome) from a
# real export of the JS-17 reference of this project with the JS-10 tooling.
strings:
  formShellNote: { uk: "Форма запрацює на наступному кроці: поки що кнопка вимкнена.", en: "The form starts working in the next step: for now the button is disabled." }
instructions:
  uk: |
    Перенеси сторінку `~/js-course/wishlist` у типізовані компоненти React, не змінюючи `domain/` і `storage/`. Платформа цей крок не перевіряє; доказ — вивід команд, самоперевірка й commit.

    1. `git status` — чисто. `npm install react react-dom`, потім `npm install --save-dev typescript @types/react @types/react-dom`; `npx tsc --version` — `Version 7.0.2`.
    2. У `tsconfig.json` додай `"jsx": "react-jsx"` і `"allowJs": true`, а в `include` — `"ui/**/*.tsx"` і `"main.tsx"`.
    3. Скрипти: `build` — `esbuild main.tsx --bundle --sourcemap --format=esm --outfile=dist/app.js` (без `--minify`, щоб React був версією для розробки), `start` — `npm run build && node --env-file=.env serve.mjs`, `typecheck` — `tsc -p .`, `format` — `prettier --write main.tsx ui`.
    4. `<body>` в `index.html`: лише `<div id="root"></div>` і `<script type="module" src="dist/app.js"></script>`.
    5. `main.tsx`: `loadItems(localStorage)`; якщо `ok` — `saved.items`, інакше `await loadFixtures()`; потім `createRoot(document.getElementById("root")!).render(<App items={items} />)`.
    6. У `ui/`: `ItemCard({ item }: { item: Wish })` — `<li className="card">` з назвою, ціною через `formatPrice(item.price, LOCALE)` або «%%noPrice%%», категорією (якщо є) і `<p className="badge">%%acquiredMark%%</p>` для отриманого бажання; `ItemList({ items })` — «%%emptyMessage%%» або `<ul className="cards">` з `key={item.id}`; `ItemForm({ categories })` — оболонка форми зі старими підписами, підказками категорій із `categoriesInUse` і вимкненою кнопкою «%%saveLabel%%»; `App({ items })` — заголовок, опис, зображення, форма, рядок `summarizeItems`, заголовок «%%listTitle%%» і список. У `ui/format.js` додай `export const LOCALE = "%%formatLocale%%";`.
    7. `rm app.js ui/page.js`.
    8. `npm run typecheck` і `npm run lint` — без зауважень; `npm run build` — `dist/app.js` і `dist/app.js.map`; `npm test` — 30 тестів і `не пройшли: 0`.
    9. `npm start`, `http://127.0.0.1:4310/`: ті самі бажання й зведення, що й до кроку (з порожнім сховищем — шість карток і «%%summaryCount%%: 6»), кнопка вимкнена, у Console немає попередження про `key`.
    10. `git add -A`, `git commit -m "Move the UI into typed React components"`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.
  en: |
    Move the page of `~/js-course/wishlist` into typed React components without changing `domain/` and `storage/`. The platform does not check this step; the evidence is the command output, the self-check and the commit.

    1. `git status` — clean. `npm install react react-dom`, then `npm install --save-dev typescript @types/react @types/react-dom`; `npx tsc --version` — `Version 7.0.2`.
    2. In `tsconfig.json` add `"jsx": "react-jsx"` and `"allowJs": true`, and add `"ui/**/*.tsx"` and `"main.tsx"` to `include`.
    3. Scripts: `build` — `esbuild main.tsx --bundle --sourcemap --format=esm --outfile=dist/app.js` (no `--minify`, so React is the development version), `start` — `npm run build && node --env-file=.env serve.mjs`, `typecheck` — `tsc -p .`, `format` — `prettier --write main.tsx ui`.
    4. The `<body>` of `index.html`: only `<div id="root"></div>` and `<script type="module" src="dist/app.js"></script>`.
    5. `main.tsx`: `loadItems(localStorage)`; if `ok`, `saved.items`, otherwise `await loadFixtures()`; then `createRoot(document.getElementById("root")!).render(<App items={items} />)`.
    6. In `ui/`: `ItemCard({ item }: { item: Wish })` — an `<li className="card">` with the name, the price through `formatPrice(item.price, LOCALE)` or “%%noPrice%%”, the category (when there is one) and `<p className="badge">%%acquiredMark%%</p>` for an acquired wish; `ItemList({ items })` — “%%emptyMessage%%” or a `<ul className="cards">` with `key={item.id}`; `ItemForm({ categories })` — the form shell with the old labels, category suggestions from `categoriesInUse` and a disabled “%%saveLabel%%” button; `App({ items })` — the heading, the pitch, the image, the form, the `summarizeItems` line, the “%%listTitle%%” heading and the list. Add `export const LOCALE = "%%formatLocale%%";` to `ui/format.js`.
    7. `rm app.js ui/page.js`.
    8. `npm run typecheck` and `npm run lint` — no findings; `npm run build` — `dist/app.js` and `dist/app.js.map`; `npm test` — 30 tests and `failed: 0`.
    9. `npm start`, `http://127.0.0.1:4310/`: the same wishes and summary as before the step (with an empty storage, six cards and “%%summaryCount%%: 6”), the button is disabled, the Console has no warning about `key`.
    10. `git add -A`, `git commit -m "Move the UI into typed React components"`; `git diff HEAD~1 --stat -- domain storage` prints nothing.
