# Habit tracker variant of step RE-01 (a local step: done in the learner's terminal, editor and browser,
# no platform checks). Commands were run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome) from a
# real export of the JS-17 reference of this project with the JS-10 tooling.
strings:
  formShellNote: { uk: "Форма запрацює на наступному кроці: поки що кнопка вимкнена.", en: "The form starts working in the next step: for now the button is disabled." }
instructions:
  uk: |
    Перенеси сторінку `~/js-course/habits` у типізовані компоненти React, не змінюючи `domain/` і `storage/`. Платформа цей крок не перевіряє; доказ — вивід команд, самоперевірка й commit.

    1. `git status` — чисто. `npm install react react-dom`, потім `npm install --save-dev typescript @types/react @types/react-dom`; `npx tsc --version` — `Version 7.0.2`.
    2. У `tsconfig.json` додай `"jsx": "react-jsx"` і `"allowJs": true`, а в `include` — `"ui/**/*.tsx"` і `"main.tsx"`.
    3. Скрипти: `build` — `esbuild main.tsx --bundle --sourcemap --format=esm --outfile=dist/app.js` (без `--minify`, щоб React був версією для розробки), `start` — `npm run build && node --env-file=.env serve.mjs`, `typecheck` — `tsc -p .`, `format` — `prettier --write main.tsx ui`.
    4. `<body>` в `index.html`: лише `<div id="root"></div>` і `<script type="module" src="dist/app.js"></script>`.
    5. `main.tsx`: `loadHabits(localStorage)`; якщо `ok` — `saved.habits`, інакше `await loadFixtures()`; потім `createRoot(document.getElementById("root")!).render(<App habits={habits} today="2026-03-02" days={["2026-02-26", "2026-02-27", "2026-02-28", "2026-03-01"]} />)` (сталі дні, як у старій сторінці).
    6. У `ui/`: `HabitCard({ habit, today }: { habit: Habit; today: string })` — `<li className="card">` з назвою, частотою через `frequencyText`, «%%completionsLabel%%: …», останнім днем через `formatDay(…, LOCALE)` (якщо він є), «%%doneTodayMark%%», коли в `completions` є `today`, і `<p className="badge">%%pausedMark%%</p>` для неактивної звички; `HabitList({ habits, today })` — «%%emptyMessage%%» або `<ul className="cards">` з `key={habit.id}`; `HabitForm()` — оболонка форми зі старими підписами (позначка «%%activeFieldLabel%%» з `defaultChecked`) і вимкненою кнопкою «%%saveLabel%%»; `App({ habits, today, days })` — заголовок, опис, зображення, `Section` «%%formTitle%%» з формою, рядок `formatRates(sortHabitsByName(filterHabits(habits, "active")), days)`, `Section` «%%listTitle%%» зі списком. `Section({ title, children }: { title: string; children: ReactNode })` — `<section>` з `<h2>{title}</h2>` і children; `App` ставить у нього форму (тепер без власного заголовка) і список. У `ui/format.js` додай `export const LOCALE = "%%formatLocale%%";`.
    7. `rm app.js ui/page.js`.
    8. `npm run typecheck` і `npm run lint` — без зауважень; `npm run build` — `dist/app.js` і `dist/app.js.map`; `npm test` — 29 тестів і `не пройшли: 0`.
    9. `npm start`, `http://127.0.0.1:4310/`: ті самі звички й частки виконань, що й до кроку (з порожнім сховищем — шість карток), кнопка вимкнена, у Console немає попередження про `key`.
    10. `git add -A`, `git commit -m "Move the UI into typed React components"`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.
  en: |
    Move the page of `~/js-course/habits` into typed React components without changing `domain/` and `storage/`. The platform does not check this step; the evidence is the command output, the self-check and the commit.

    1. `git status` — clean. `npm install react react-dom`, then `npm install --save-dev typescript @types/react @types/react-dom`; `npx tsc --version` — `Version 7.0.2`.
    2. In `tsconfig.json` add `"jsx": "react-jsx"` and `"allowJs": true`, and add `"ui/**/*.tsx"` and `"main.tsx"` to `include`.
    3. Scripts: `build` — `esbuild main.tsx --bundle --sourcemap --format=esm --outfile=dist/app.js` (no `--minify`, so React is the development version), `start` — `npm run build && node --env-file=.env serve.mjs`, `typecheck` — `tsc -p .`, `format` — `prettier --write main.tsx ui`.
    4. The `<body>` of `index.html`: only `<div id="root"></div>` and `<script type="module" src="dist/app.js"></script>`.
    5. `main.tsx`: `loadHabits(localStorage)`; if `ok`, `saved.habits`, otherwise `await loadFixtures()`; then `createRoot(document.getElementById("root")!).render(<App habits={habits} today="2026-03-02" days={["2026-02-26", "2026-02-27", "2026-02-28", "2026-03-01"]} />)` (fixed days, as on the old page).
    6. In `ui/`: `HabitCard({ habit, today }: { habit: Habit; today: string })` — an `<li className="card">` with the name, the frequency through `frequencyText`, “%%completionsLabel%%: …”, the last day through `formatDay(…, LOCALE)` (when there is one), “%%doneTodayMark%%” when `completions` has `today`, and `<p className="badge">%%pausedMark%%</p>` for an inactive habit; `HabitList({ habits, today })` — “%%emptyMessage%%” or a `<ul className="cards">` with `key={habit.id}`; `HabitForm()` — the form shell with the old labels (the “%%activeFieldLabel%%” box with `defaultChecked`) and a disabled “%%saveLabel%%” button; `App({ habits, today, days })` — the heading, the pitch, the image, a “%%formTitle%%” `Section` with the form, the `formatRates(sortHabitsByName(filterHabits(habits, "active")), days)` line, a “%%listTitle%%” `Section` with the list. `Section({ title, children }: { title: string; children: ReactNode })` — a `<section>` with `<h2>{title}</h2>` and the children; `App` puts the form (now without its own heading) and the list into it. Add `export const LOCALE = "%%formatLocale%%";` to `ui/format.js`.
    7. `rm app.js ui/page.js`.
    8. `npm run typecheck` and `npm run lint` — no findings; `npm run build` — `dist/app.js` and `dist/app.js.map`; `npm test` — 29 tests and `failed: 0`.
    9. `npm start`, `http://127.0.0.1:4310/`: the same habits and completion rates as before the step (with an empty storage, six cards), the button is disabled, the Console has no warning about `key`.
    10. `git add -A`, `git commit -m "Move the UI into typed React components"`; `git diff HEAD~1 --stat -- domain storage` prints nothing.
