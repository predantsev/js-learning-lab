# Capstone step of unit RE-01 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson re-01-10-capstone-components from this file.
# A local step: it is done in the learner's terminal, editor and browser and has no platform checks. The
# project page shows only the intro of a local step, so the intro carries the whole procedure.
# Every command was run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome) in a scratch home on
# all four projects, starting from a real export of the JS-17 reference with the JS-10 tooling
# (ESLint 10.12.0, Prettier 3.9.9, esbuild 0.28.2) and adding React 19.3.0, react-dom 19.3.0,
# TypeScript 7.0.2, @types/react 19.3.0 and @types/react-dom 19.3.0. Quoted output is from the wishlist run
# (Ukrainian output in the uk text, English output in the en text).
# reference/ holds every project file after the step except what the export and npm generate for each
# learner (serve.mjs, tools/, jsll-manifest.json, data/exported-storage.json, EXPORT-README.md,
# README.md, .env, .env.example, package-lock.json, node_modules/, dist/).
unit: RE-01
mode: local
entry: index.html
title:
  uk: "Компоненти React"
  en: "React components"
intro:
  uk: |
    Тепер сторінку проєкту малює React. Ти переносиш її в типізовані [[component|компоненти]]: список, картку, оболонку форми й спільну рамку з заголовком. Модулі `domain/` і `storage/` не змінюються жодним байтом — компоненти лише показують те, що обчислюють доменні функції. Крок виконується в теці `~/js-course/<проєкт>`; платформа його не перевіряє, а доказ — вивід команд, список самоперевірки й твій commit.

    **Чому тепер потрібне збирання.** Браузер не виконує TypeScript, але `serve.mjs` з експорту віддає файли `.ts` без типів (їх прибирає сам Node.js; на першому запиті до `.ts` Node.js 25.2.1 один раз друкує `ExperimentalWarning: stripTypeScriptTypes is an experimental feature and might change at any time`), тож до цього кроку `npm start` показує робочу сторінку. З React так уже не вийде: компоненти пишуть у файлах `.tsx` з JSX, а JSX — не JavaScript; `serve.mjs` віддає `.tsx` як `application/octet-stream`, а `import { createRoot } from "react-dom/client"` браузер сам не знайде в `node_modules`. Тому на цьому кроці esbuild (він у проєкті з розділу про експорт) збирає `main.tsx` і все, що той імпортує, — `.tsx`, `.ts`, `.js` і пакети React, — в один [[bundle|bundle]] `dist/app.js`.

    **Що буде на сторінці.** Ті самі записи й те саме зведення, що й до кроку, але поки менше можливостей: форма — лише оболонка з вимкненою кнопкою, на картках немає кнопок, немає фільтра. Форма, фільтр і зміни записів повернуться на наступному кроці, збереження — на кроці про ефекти, фокус після видалення — на кроці про reducer, маршрути — на кроці про маршрути, завантаження з повторною спробою — на кроці про асинхронні дані. Пошук, сторінки «Показати ще», вигляд списку в адресі й додаткові рядки зведення в етапі React не переносяться; старий код лишається в історії Git: `git show HEAD~1:ui/page.js` після commit.

    | Проєкт | Компоненти в `ui/` (і спільний `Section`) | Що показує картка | Що обчислює `App` |
    |---|---|---|---|
    | Список бажань | `ItemList`, `ItemCard`, `ItemForm` | назву; ціну через `formatPrice` або «без ціни»; категорію, якщо вона є; «отримано» | `summarizeItems(items)`; підказки категорій для форми — `categoriesInUse(items)` |
    | Планувальник | `TaskList`, `TaskCard`, `TaskForm` | назву; термін через `formatDay` або «без терміну»; пріоритет через `priorityText`; «виконано» | `countDueTasks(tasks, today)` для `today` = `"2026-03-02"` |
    | Трекер звичок | `HabitList`, `HabitCard`, `HabitForm` | назву; частоту через `frequencyText`; кількість виконань; останній день; «Сьогодні виконано»; «на паузі» | `formatRates(sortHabitsByName(filterHabits(habits, "active")), days)` за чотири дні до `"2026-03-02"` |
    | Трекер витрат | `ExpenseList`, `ExpenseCard`, `ExpenseForm` | назву; суму `formatMoney(amountMinor, LOCALE)` — гривні лише для показу; дату; категорію через `categoryText` | `totalsByCategory(expenses)` і `totalOf(expenses)` |

    Команди нижче написано для «Списку бажань»; для свого проєкту підстав його теку, назви з таблиці й назви з його модулів `domain/` і `storage/`. Їх виконано на macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome) з React 19.3.0, TypeScript 7.0.2 і esbuild 0.28.2.

    **1. Стан на початку.** `cd ~/js-course/wishlist`, потім `git status` — `nothing to commit, working tree clean`. Якщо там є зміни (наприклад, ти щойно переніс еталон JS-17), спершу зроби commit.

    **2. React і типи.** React потрібен сторінці, тож це звичайна [[dependency|залежність]]; TypeScript і типи React читає лише `tsc`, тож це [[dev-dependency|dev-залежності]]:

    ```sh
    npm install react react-dom
    npm install --save-dev typescript @types/react @types/react-dom
    npx tsc --version
    ```

    Перша команда друкує `added 3 packages, and audited 86 packages in 592ms`, друга — `added 5 packages, and audited 91 packages in 1s` (числа можуть відрізнятися), третя — `Version 7.0.2`.

    **3. `tsconfig.json`.** Заміни вміст файла цим. Нове тут: `"jsx": "react-jsx"` дозволяє JSX у файлах `.tsx`, `"allowJs": true` дозволяє `tsc` читати типи з модулів `.js`, які імпортують компоненти (`ui/format.js`, `data/fixtures.js`), а `include` додає `main.tsx` і компоненти.

    ```json
    {
      "compilerOptions": {
        "strict": true,
        "noEmit": true,
        "target": "es2023",
        "lib": ["es2023", "dom"],
        "module": "esnext",
        "moduleResolution": "bundler",
        "moduleDetection": "force",
        "verbatimModuleSyntax": true,
        "allowImportingTsExtensions": true,
        "jsx": "react-jsx",
        "allowJs": true,
        "types": []
      },
      "include": ["domain/**/*.ts", "storage/**/*.ts", "ui/**/*.tsx", "main.tsx"]
    }
    ```

    **4. Скрипти.** Чотири [[npm-script|скрипти]] замінюють або додають команди:

    ```sh
    npm pkg set scripts.build="esbuild main.tsx --bundle --sourcemap --format=esm --outfile=dist/app.js"
    npm pkg set scripts.start="npm run build && node --env-file=.env serve.mjs"
    npm pkg set scripts.typecheck="tsc -p ."
    npm pkg set scripts.format="prettier --write main.tsx ui"
    ```

    `build` тепер починається з `main.tsx` і збирає **без** `--minify`: тоді esbuild бере версію React для розробки — з попередженнями в Console, які знадобляться далі. Із `--minify` у bundle потрапляє production-версія (`react-dom-client.production.js` замість `react-dom-client.development.js`), і попереджень немає. `start` спершу збирає, тож сторінка завжди отримує свіжий `dist/app.js`. `typecheck` — перевірка типів; esbuild типів не перевіряє. `format` більше не називає видалений `app.js` (зі старим скриптом Prettier завершується з `[error] No files matching the pattern were found: "app.js".`) і не чіпає `domain` та `storage`.

    **5. `index.html`.** Залиш `<head>` як є, а весь вміст `<body>` заміни двома рядками коду: тепер сторінку малює React, а підключається зібраний файл.

    ```html
    <div id="root"></div>
    <script type="module" src="dist/app.js"></script>
    ```

    Тег `<script>` для `run-tests.js` теж зникає: тести запускає `npm test`, і сторінка більше не друкує їх у Console.

    **6. `main.tsx` у корені проєкту** читає записи один раз і передає їх React. Читання сховища лишається тут, поза компонентами.

    ```tsx
    import { createRoot } from "react-dom/client";
    import { App } from "./ui/App.tsx";
    import { loadItems } from "./storage/wishes.ts";
    import type { Wish } from "./domain/wishes.ts";
    import { loadFixtures } from "./data/fixtures.js";

    const saved = loadItems(localStorage);
    const items: Wish[] = saved.ok ? saved.items : await loadFixtures();

    createRoot(document.getElementById("root")!).render(<App items={items} />);
    ```

    Збережені записи мають перевагу, а без них (чи замість пошкоджених) сторінка показує початкові записи з `data/`. `await` на верхньому рівні модуля чекає на них до першого рендеру. `!` — [[non-null-assertion|твердження, що значення не null]]: елемент `#root` точно є в `index.html`. У планувальнику функція зветься `loadTasks`, поле — `saved.tasks`, а `App` отримує ще `today="2026-03-02"`; у трекері звичок — `loadHabits`, `saved.habits`, `today` і `days` (`["2026-02-26", "2026-02-27", "2026-02-28", "2026-03-01"]`); у трекері витрат — `loadExpenses` і `saved.expenses`.

    **7. Компоненти** в теці `ui/`, кожен у своєму файлі `.tsx` з типом props:

    - `ItemCard` отримує `{ item: Wish }` і повертає `<li className="card">` з полями з таблиці; позначка «отримано» — `<p className="badge">`. Для мови чисел додай у `ui/format.js` рядок коду `export const LOCALE = "uk-UA";` (в англійському проєкті — `"en-US"`, як у старому `ui/page.js`).
    - `ItemList` отримує `{ items: Wish[] }`, для порожнього списку повертає текст «Бажань поки немає…» зі старого `index.html`, інакше `<ul className="cards">` з `ItemCard` для кожного запису й [[list-key|ключем]] `key={item.id}`.
    - `ItemForm` — оболонка: ті самі підписи й поля, що були в старій формі (`htmlFor` замість `for`), кнопка `Зберегти` з `disabled` і примітка, що форма запрацює на наступному кроці. Стану й обробників ще немає, а заголовок форми дає `Section`. У планувальнику стара форма має `<option value="normal" selected>`, а в трекері звичок — `<input … checked>`: у JSX замість них пишуть `defaultValue="normal"` на `<select>` і `defaultChecked` на полі — значення, з якого поле починає, а далі його змінює людина (докладно — у розділі про форми).
    - `Section` отримує `{ title: string; children: ReactNode }` і повертає `<section>` із `<h2>{title}</h2>` та [[children-prop|children]] під ним. Тип `ReactNode` імпортуй з `react` через `import type`.
    - `App` отримує `{ items: Wish[] }` і складає сторінку: заголовок, опис, зображення, `Section` з `ItemForm`, рядок зведення й `Section` з `ItemList`.

    Тексти, які бачить людина, бери зі старого `index.html` і `ui/page.js`. Тип запису імпортуй через `import type`.

    **8. Старі файли.** `app.js` і `ui/page.js` більше ніхто не імпортує: `rm app.js ui/page.js`. `storage/repository.js` і `ui/address.js` залишаються — їх перевіряють твої тести.

    **9. Перевірка інструментами.**

    ```sh
    npm run typecheck
    npm run build
    npm test
    npm run lint
    ```

    `typecheck` і `lint` друкують лише по два рядки заголовка (`> … typecheck` і `> tsc -p .`, `> … lint` і `> eslint .`). `build` друкує `dist/app.js      1.1mb ⚠️`, `dist/app.js.map  1.8mb` і `⚡ Done in 35ms`: позначка ⚠️ лише каже, що файл великий, — версія React для розробки важить більше, ніж production (з `--minify` — близько 224kb). `npm test` закінчується `Пройшли: 30 · не пройшли: 0` (планувальник — 31, звички й витрати — 29): тести домену й сховища ті самі.

    **10. Перевірка в браузері.** `npm start` спершу збирає, потім друкує `Проєкт працює: http://127.0.0.1:4310/`. Відкрий цю адресу.

    **11. Commit.**

    ```sh
    git status --short
    git add -A
    git commit -m "Move the UI into typed React components"
    git diff HEAD~1 --stat -- domain storage
    ```

    `git status --short` показує ` D app.js`, ` M index.html`, ` M package-lock.json`, ` M package.json`, ` M tsconfig.json`, ` M ui/format.js`, ` D ui/page.js` і `??` перед `main.tsx` та п’ятьма новими файлами в `ui/`. Commit: `[main f1420f3] Move the UI into typed React components` і `13 files changed, 590 insertions(+), 493 deletions(-)` (числа рядків залежать від твоїх `package.json` і `package-lock.json`). Остання команда не друкує нічого: `domain/` і `storage/` не змінилися.

    **Самоперевірка** — познач для себе кожен пункт:

    - сторінка показує ті самі записи й те саме зведення, що й до кроку: після відновлення даних на кроці CP-JS — твої збережені записи; з порожнім сховищем «Список бажань» показує шість початкових карток і `Бажань: 6 · Ще хочу на суму: 365 грн · Без ціни: 1`;
    - кожна картка показує поля з таблиці, а над формою й над списком стоять заголовки з `Section`;
    - кнопка `Зберегти` вимкнена, а в Console немає червоних повідомлень (зокрема попередження про `key`) — лише інформаційний рядок React `Download the React DevTools for a better development experience: …`;
    - `npm run typecheck` і `npm run lint` — без зауважень, `npm test` — `не пройшли: 0`;
    - у commit немає файлів із `domain/` і `storage/`, а повідомлення — `Move the UI into typed React components`.

    **Якщо щось пішло не так** (усі повідомлення — з реальних запусків):

    - Порожня сторінка, а в Console `Failed to load resource: the server responded with a status of 404 (Not Found)` — немає `dist/app.js` (його не зібрано, або це свіжий клон: `dist/` не потрапляє в Git) чи `index.html` досі підключає видалений `app.js`. Запускай проєкт через `npm start` — він збирає сам — і звір тег `<script>` із кроком 5.
    - `Failed to load module script: … MIME type of "application/octet-stream"` — `index.html` підключає не `dist/app.js`, а файл, який браузер не виконує (наприклад, `main.tsx`).
    - `✘ [ERROR] Could not resolve "react-dom/client"` під час збирання — у цій теці не встановлено React: виконай команди кроку 2 (у свіжому клоні — `npm ci`).
    - `error TS17004: Cannot use JSX unless the '--jsx' flag is provided.` — у `tsconfig.json` немає `"jsx": "react-jsx"`.
    - `error TS7016: Could not find a declaration file for module './format.js'` — у `tsconfig.json` немає `"allowJs": true`.
    - `error TS2741: Property 'categories' is missing in type '{}' but required in type 'ItemFormProps'.` — компонент викликано без обов’язкового prop. `npm run build` такий код збирає без жодного слова, бо esbuild типів не перевіряє: тому й потрібен `npm run typecheck`.
    - У Console `Each child in a list should have a unique "key" prop.` — у `ItemList` бракує `key={item.id}`.
    - У Console ``Use the `defaultValue` or `value` props on <select> instead of setting `selected` on <option>.`` — у JSX лишився `selected`; початковий пункт задає `defaultValue` на `<select>`.
    - У Console ``You provided a `checked` prop to a form field without an `onChange` handler. This will render a read-only field. …`` — у JSX лишився `checked`; початкову позначку задає `defaultChecked`.
    - У Console ``Invalid DOM property `class`. Did you mean `className`?`` — у JSX написано `class`; `tsc` каже те саме: `Property 'class' does not exist … Did you mean 'className'?`.

    **Еталон.** Після експорту на екрані проєкту в розділі «Еталони для завантаження» є кнопка `Завантажити: RE-01 — Компоненти React`. В архіві — усі файли проєкту після кроку, крім тих, що створюють експорт і npm (`serve.mjs`, `tools/`, `jsll-manifest.json`, `data/exported-storage.json`, README, `package-lock.json`). Розпакуй його в окрему теку й порівнюй, не копіюй поверх своїх файлів. Файли інструментів (`package.json`, `eslint.config.mjs`, `.gitignore`) у порівнянні з JS-17 позначено як нові, бо еталон платформи їх не мав (`tsconfig.json` там уже був, тож його показано зміненим); версії в `package.json` у тебе можуть бути новішими.

    Команди виконано лише на macOS. У Linux вони ті самі; у Windows виконуй їх у Git Bash. Вивід для Linux і Windows ми не записували, тож він може трохи відрізнятися.
  en: |
    From now on React draws the project page. You move it into typed [[component|components]]: a list, a card, a form shell and a shared frame with a heading. The `domain/` and `storage/` modules do not change by a single byte — the components only show what the domain functions compute. The step is done in the folder `~/js-course/<project>`; the platform does not check it, and the evidence is the command output, the self-check list and your commit.

    **Why a build is needed now.** The browser does not run TypeScript, but the exported `serve.mjs` serves `.ts` files with their types removed (by Node.js itself; on the first request for a `.ts` file Node.js 25.2.1 prints `ExperimentalWarning: stripTypeScriptTypes is an experimental feature and might change at any time` once), so before this step `npm start` shows a working page. With React that no longer works: components are written in `.tsx` files with JSX, and JSX is not JavaScript; `serve.mjs` serves `.tsx` as `application/octet-stream`, and the browser cannot find `import { createRoot } from "react-dom/client"` in `node_modules` by itself. So in this step esbuild (in the project since the export unit) bundles `main.tsx` and everything it imports — `.tsx`, `.ts`, `.js` and the React packages — into one [[bundle]] `dist/app.js`.

    **What the page will have.** The same records and the same summary as before the step, but fewer features for now: the form is only a shell with a disabled button, the cards have no buttons, there is no filter. The form, the filter and record changes come back in the next step, saving in the effects step, focus after a delete in the reducer step, routes in the routes step, and loading with a retry in the async data step. Search, the "Show more" pages, the list view in the address and the extra summary lines are not moved in the React stage; the old code stays in the Git history: `git show HEAD~1:ui/page.js` after the commit.

    | Project | Components in `ui/` (and the shared `Section`) | What the card shows | What `App` computes |
    |---|---|---|---|
    | Wishlist | `ItemList`, `ItemCard`, `ItemForm` | the name; the price through `formatPrice` or “no price”; the category when there is one; “acquired” | `summarizeItems(items)`; the form's category suggestions — `categoriesInUse(items)` |
    | Planner | `TaskList`, `TaskCard`, `TaskForm` | the title; the due date through `formatDay` or “no due date”; the priority through `priorityText`; “done” | `countDueTasks(tasks, today)` for `today` = `"2026-03-02"` |
    | Habit tracker | `HabitList`, `HabitCard`, `HabitForm` | the name; the frequency through `frequencyText`; the number of completions; the last day; “Completed today”; “paused” | `formatRates(sortHabitsByName(filterHabits(habits, "active")), days)` over the four days before `"2026-03-02"` |
    | Expense tracker | `ExpenseList`, `ExpenseCard`, `ExpenseForm` | the label; the amount `formatMoney(amountMinor, LOCALE)` — hryvnias only for the display; the date; the category through `categoryText` | `totalsByCategory(expenses)` and `totalOf(expenses)` |

    The commands below are written for the wishlist; for your project use its folder, the names from the table and the names from its own `domain/` and `storage/` modules. They were run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome) with React 19.3.0, TypeScript 7.0.2 and esbuild 0.28.2.

    **1. The starting state.** `cd ~/js-course/wishlist`, then `git status` — `nothing to commit, working tree clean`. If there are changes (for example, you have just moved in the JS-17 reference), commit them first.

    **2. React and the types.** The page needs React, so it is an ordinary [[dependency]]; TypeScript and React's types are read only by `tsc`, so they are [[dev-dependency|dev dependencies]]:

    ```sh
    npm install react react-dom
    npm install --save-dev typescript @types/react @types/react-dom
    npx tsc --version
    ```

    The first command prints `added 3 packages, and audited 86 packages in 510ms`, the second `added 5 packages, and audited 91 packages in 548ms` (the numbers may differ), the third `Version 7.0.2`.

    **3. `tsconfig.json`.** Replace the file's content with this. What is new: `"jsx": "react-jsx"` allows JSX in `.tsx` files, `"allowJs": true` lets `tsc` read the types of the `.js` modules the components import (`ui/format.js`, `data/fixtures.js`), and `include` adds `main.tsx` and the components.

    ```json
    {
      "compilerOptions": {
        "strict": true,
        "noEmit": true,
        "target": "es2023",
        "lib": ["es2023", "dom"],
        "module": "esnext",
        "moduleResolution": "bundler",
        "moduleDetection": "force",
        "verbatimModuleSyntax": true,
        "allowImportingTsExtensions": true,
        "jsx": "react-jsx",
        "allowJs": true,
        "types": []
      },
      "include": ["domain/**/*.ts", "storage/**/*.ts", "ui/**/*.tsx", "main.tsx"]
    }
    ```

    **4. Scripts.** Four [[npm-script|scripts]] replace or add commands:

    ```sh
    npm pkg set scripts.build="esbuild main.tsx --bundle --sourcemap --format=esm --outfile=dist/app.js"
    npm pkg set scripts.start="npm run build && node --env-file=.env serve.mjs"
    npm pkg set scripts.typecheck="tsc -p ."
    npm pkg set scripts.format="prettier --write main.tsx ui"
    ```

    `build` now starts from `main.tsx` and bundles **without** `--minify`: then esbuild takes React's development version — with warnings in the Console that you will need later. With `--minify` the production version goes into the bundle (`react-dom-client.production.js` instead of `react-dom-client.development.js`), and there are no warnings. `start` builds first, so the page always gets a fresh `dist/app.js`. `typecheck` checks the types; esbuild does not check them. `format` no longer names the removed `app.js` (with the old script Prettier ends with `[error] No files matching the pattern were found: "app.js".`) and leaves `domain` and `storage` alone.

    **5. `index.html`.** Keep the `<head>` as it is and replace the whole content of `<body>` with two lines of code: React draws the page now, and the page loads the built file.

    ```html
    <div id="root"></div>
    <script type="module" src="dist/app.js"></script>
    ```

    The `<script>` tag for `run-tests.js` goes away too: `npm test` runs the tests, and the page no longer prints them in the Console.

    **6. `main.tsx` at the project root** reads the records once and hands them to React. Reading the storage stays here, outside the components.

    ```tsx
    import { createRoot } from "react-dom/client";
    import { App } from "./ui/App.tsx";
    import { loadItems } from "./storage/wishes.ts";
    import type { Wish } from "./domain/wishes.ts";
    import { loadFixtures } from "./data/fixtures.js";

    const saved = loadItems(localStorage);
    const items: Wish[] = saved.ok ? saved.items : await loadFixtures();

    createRoot(document.getElementById("root")!).render(<App items={items} />);
    ```

    Saved records win, and without them (or instead of damaged ones) the page shows the starting records from `data/`. `await` at the top level of a module waits for them before the first render. `!` is a [[non-null-assertion]]: the `#root` element is certainly in `index.html`. In the planner the function is `loadTasks`, the field `saved.tasks`, and `App` also gets `today="2026-03-02"`; in the habit tracker — `loadHabits`, `saved.habits`, `today` and `days` (`["2026-02-26", "2026-02-27", "2026-02-28", "2026-03-01"]`); in the expense tracker — `loadExpenses` and `saved.expenses`.

    **7. The components** go into the `ui/` folder, each in its own `.tsx` file with a props type:

    - `ItemCard` gets `{ item: Wish }` and returns `<li className="card">` with the fields from the table; the “acquired” mark is a `<p className="badge">`. For the language of numbers add the line of code `export const LOCALE = "en-US";` to `ui/format.js` (`"uk-UA"` in a Ukrainian project, as in the old `ui/page.js`).
    - `ItemList` gets `{ items: Wish[] }`, returns the “There are no wishes yet…” text from the old `index.html` for an empty list, and otherwise a `<ul className="cards">` with an `ItemCard` for every record and the [[list-key|key]] `key={item.id}`.
    - `ItemForm` is a shell: the same labels and fields as the old form (`htmlFor` instead of `for`), a `Save` button with `disabled` and a note that the form starts working in the next step. It has no state and no handlers yet, and `Section` gives the form its heading. In the planner the old form has `<option value="normal" selected>`, and in the habit tracker `<input … checked>`: in JSX you write `defaultValue="normal"` on the `<select>` and `defaultChecked` on the field instead — the value the field starts with, which the person then changes (more in the forms unit).
    - `Section` gets `{ title: string; children: ReactNode }` and returns a `<section>` with `<h2>{title}</h2>` and the [[children-prop|children]] under it. Import the `ReactNode` type from `react` with `import type`.
    - `App` gets `{ items: Wish[] }` and puts the page together: the heading, the pitch, the image, a `Section` with `ItemForm`, the summary line and a `Section` with `ItemList`.

    Take the text people see from the old `index.html` and `ui/page.js`. Import the record type with `import type`.

    **8. The old files.** Nothing imports `app.js` and `ui/page.js` any more: `rm app.js ui/page.js`. `storage/repository.js` and `ui/address.js` stay — your tests check them.

    **9. Check with the tools.**

    ```sh
    npm run typecheck
    npm run build
    npm test
    npm run lint
    ```

    `typecheck` and `lint` print only two header lines each (`> … typecheck` and `> tsc -p .`, `> … lint` and `> eslint .`). `build` prints `dist/app.js      1.1mb ⚠️`, `dist/app.js.map  1.8mb` and `⚡ Done in 35ms`: the ⚠️ mark only says that the file is large — React's development version weighs more than the production one (about 224kb with `--minify`). `npm test` ends with `Passed: 30 · failed: 0` (planner 31, habits and expenses 29): the domain and storage tests are the same.

    **10. Check in the browser.** `npm start` builds first, then prints `The project is running: http://127.0.0.1:4310/`. Open that address.

    **11. Commit.**

    ```sh
    git status --short
    git add -A
    git commit -m "Move the UI into typed React components"
    git diff HEAD~1 --stat -- domain storage
    ```

    `git status --short` shows ` D app.js`, ` M index.html`, ` M package-lock.json`, ` M package.json`, ` M tsconfig.json`, ` M ui/format.js`, ` D ui/page.js` and `??` before `main.tsx` and the five new files in `ui/`. The commit: `[main 26e0074] Move the UI into typed React components` and `13 files changed, 590 insertions(+), 493 deletions(-)` (the line counts depend on your `package.json` and `package-lock.json`). The last command prints nothing: `domain/` and `storage/` did not change.

    **Self-check** — tick every item for yourself:

    - the page shows the same records and the same summary as before the step: after the data restore of the CP-JS step, your saved records; with an empty storage the wishlist shows the six starting cards and `Wishes: 6 · Still wanted, total: UAH 365 · Without a price: 1`;
    - every card shows the fields from the table, and the form and the list have the headings of `Section` above them;
    - the `Save` button is disabled, and the Console has no red messages (no warning about `key` either) — only React's info line `Download the React DevTools for a better development experience: …`;
    - `npm run typecheck` and `npm run lint` have no findings, `npm test` — `failed: 0`;
    - the commit has no files from `domain/` and `storage/`, and its message is `Move the UI into typed React components`.

    **If something goes wrong** (every message is from a real run):

    - A blank page, and the Console says `Failed to load resource: the server responded with a status of 404 (Not Found)` — there is no `dist/app.js` (it was not built, or this is a fresh clone: `dist/` does not go into Git), or `index.html` still loads the removed `app.js`. Run the project with `npm start` — it builds by itself — and compare the `<script>` tag with step 5.
    - `Failed to load module script: … MIME type of "application/octet-stream"` — `index.html` loads a file the browser does not run (for example `main.tsx`) instead of `dist/app.js`.
    - `✘ [ERROR] Could not resolve "react-dom/client"` while building — React is not installed in this folder: run the commands of step 2 (in a fresh clone, `npm ci`).
    - `error TS17004: Cannot use JSX unless the '--jsx' flag is provided.` — `tsconfig.json` has no `"jsx": "react-jsx"`.
    - `error TS7016: Could not find a declaration file for module './format.js'` — `tsconfig.json` has no `"allowJs": true`.
    - `error TS2741: Property 'categories' is missing in type '{}' but required in type 'ItemFormProps'.` — a component is called without a required prop. `npm run build` bundles such code without a word, because esbuild does not check types: that is why `npm run typecheck` is needed.
    - The Console says `Each child in a list should have a unique "key" prop.` — `ItemList` lacks `key={item.id}`.
    - The Console says ``Use the `defaultValue` or `value` props on <select> instead of setting `selected` on <option>.`` — the JSX still has `selected`; `defaultValue` on the `<select>` sets the starting option.
    - The Console says ``You provided a `checked` prop to a form field without an `onChange` handler. This will render a read-only field. …`` — the JSX still has `checked`; `defaultChecked` sets the starting tick.
    - The Console says ``Invalid DOM property `class`. Did you mean `className`?`` — the JSX says `class`; `tsc` says the same: `Property 'class' does not exist … Did you mean 'className'?`.

    **The reference.** After the export the project screen has a `Download: RE-01 — React components` button in the “References to download” section. The archive holds every project file after the step except those the export and npm create (`serve.mjs`, `tools/`, `jsll-manifest.json`, `data/exported-storage.json`, the READMEs, `package-lock.json`). Unpack it into a separate folder and compare; do not copy it over your files. In the comparison with JS-17 the tool files (`package.json`, `eslint.config.mjs`, `.gitignore`) are marked as new, because the platform reference did not have them (`tsconfig.json` was already there, so it is shown as changed); the versions in your `package.json` may be newer.

    The commands were run on macOS only. On Linux they are the same; on Windows run them in Git Bash. We did not record the output on Linux and Windows, so it may differ a little.
purpose:
  uk: "Це крок твого проєкту: компоненти, JSX, типізовані props і ключі списку з цього розділу ти застосовуєш, щоб перенести сторінку власного застосунку в React, не змінюючи доменних функцій. Платформа цей крок не перевіряє: ти робиш його у своїй теці, а доказ — вивід команд і commit."
  en: "This is a step of your project: you apply this unit's components, JSX, typed props and list keys to move your own app's page into React without changing the domain functions. The platform does not check this step: you do it in your own folder, and the evidence is the command output and the commit."
objectives:
  - uk: "Додати до локального проєкту React, перевірку типів `tsc` і збирання `main.tsx` через esbuild у `dist/app.js`."
    en: "Add React, a `tsc` type check and an esbuild build of `main.tsx` into `dist/app.js` to the local project."
  - uk: "Написати типізовані компоненти списку, картки й оболонки форми, які викликають доменні функції без змін, і показати записи з ключами за `id`."
    en: "Write typed list, card and form-shell components that call the domain functions unchanged, and show the records keyed by `id`."
  - uk: "Переконатися в браузері й інструментами, що сторінка показує ті самі записи, а `domain/` і `storage/` не змінилися, і зафіксувати крок у commit."
    en: "Confirm in the browser and with the tools that the page shows the same records while `domain/` and `storage/` did not change, and record the step in a commit."
