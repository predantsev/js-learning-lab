# Planner variant of step RE-01 (a local step: done in the learner's terminal, editor and browser, no
# platform checks). Commands were run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome) from a
# real export of the JS-17 reference of this project with the JS-10 tooling.
strings:
  formShellNote: { uk: "Форма запрацює на наступному кроці: поки що кнопка вимкнена.", en: "The form starts working in the next step: for now the button is disabled." }
instructions:
  uk: |
    Перенеси сторінку `~/js-course/planner` у типізовані компоненти React, не змінюючи `domain/` і `storage/`. Платформа цей крок не перевіряє; доказ — вивід команд, самоперевірка й commit.

    1. `git status` — чисто. `npm install react react-dom`, потім `npm install --save-dev typescript @types/react @types/react-dom`; `npx tsc --version` — `Version 7.0.2`.
    2. У `tsconfig.json` додай `"jsx": "react-jsx"` і `"allowJs": true`, а в `include` — `"ui/**/*.tsx"` і `"main.tsx"`.
    3. Скрипти: `build` — `esbuild main.tsx --bundle --sourcemap --format=esm --outfile=dist/app.js` (без `--minify`, щоб React був версією для розробки), `start` — `npm run build && node --env-file=.env serve.mjs`, `typecheck` — `tsc -p .`, `format` — `prettier --write main.tsx ui`.
    4. `<body>` в `index.html`: лише `<div id="root"></div>` і `<script type="module" src="dist/app.js"></script>`.
    5. `main.tsx`: `loadTasks(localStorage)`; якщо `ok` — `saved.tasks`, інакше `await loadFixtures()`; потім `createRoot(document.getElementById("root")!).render(<App tasks={tasks} today="2026-03-02" />)` (день — сталий, як у старій сторінці).
    6. У `ui/`: `TaskCard({ task }: { task: Task })` — `<li className="card">` з назвою, терміном через `formatDay(task.dueDate, LOCALE)` або «%%noDueDate%%», пріоритетом через `priorityText` і `<p className="badge">%%doneMark%%</p>` для виконаної справи; `TaskList({ tasks })` — «%%emptyMessage%%» або `<ul className="cards">` з `key={task.id}`; `TaskForm()` — оболонка форми зі старими підписами (у списку пріоритетів `defaultValue="normal"`) і вимкненою кнопкою «%%saveLabel%%»; `App({ tasks, today })` — заголовок, опис, зображення, форма, рядок «%%dueSummary%% …» з `countDueTasks(tasks, today)`, заголовок «%%listTitle%%» і список. У `ui/format.js` додай `export const LOCALE = "%%formatLocale%%";`.
    7. `rm app.js ui/page.js`.
    8. `npm run typecheck` і `npm run lint` — без зауважень; `npm run build` — `dist/app.js` і `dist/app.js.map`; `npm test` — 31 тест і `не пройшли: 0`.
    9. `npm start`, `http://127.0.0.1:4310/`: ті самі справи й те саме число справ до терміну, що й до кроку (з порожнім сховищем — шість карток і `2`), кнопка вимкнена, у Console немає попередження про `key`.
    10. `git add -A`, `git commit -m "Move the UI into typed React components"`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.
  en: |
    Move the page of `~/js-course/planner` into typed React components without changing `domain/` and `storage/`. The platform does not check this step; the evidence is the command output, the self-check and the commit.

    1. `git status` — clean. `npm install react react-dom`, then `npm install --save-dev typescript @types/react @types/react-dom`; `npx tsc --version` — `Version 7.0.2`.
    2. In `tsconfig.json` add `"jsx": "react-jsx"` and `"allowJs": true`, and add `"ui/**/*.tsx"` and `"main.tsx"` to `include`.
    3. Scripts: `build` — `esbuild main.tsx --bundle --sourcemap --format=esm --outfile=dist/app.js` (no `--minify`, so React is the development version), `start` — `npm run build && node --env-file=.env serve.mjs`, `typecheck` — `tsc -p .`, `format` — `prettier --write main.tsx ui`.
    4. The `<body>` of `index.html`: only `<div id="root"></div>` and `<script type="module" src="dist/app.js"></script>`.
    5. `main.tsx`: `loadTasks(localStorage)`; if `ok`, `saved.tasks`, otherwise `await loadFixtures()`; then `createRoot(document.getElementById("root")!).render(<App tasks={tasks} today="2026-03-02" />)` (a fixed day, as on the old page).
    6. In `ui/`: `TaskCard({ task }: { task: Task })` — an `<li className="card">` with the title, the due date through `formatDay(task.dueDate, LOCALE)` or “%%noDueDate%%”, the priority through `priorityText` and `<p className="badge">%%doneMark%%</p>` for a done task; `TaskList({ tasks })` — “%%emptyMessage%%” or a `<ul className="cards">` with `key={task.id}`; `TaskForm()` — the form shell with the old labels (`defaultValue="normal"` on the priority list) and a disabled “%%saveLabel%%” button; `App({ tasks, today })` — the heading, the pitch, the image, the form, the “%%dueSummary%% …” line with `countDueTasks(tasks, today)`, the “%%listTitle%%” heading and the list. Add `export const LOCALE = "%%formatLocale%%";` to `ui/format.js`.
    7. `rm app.js ui/page.js`.
    8. `npm run typecheck` and `npm run lint` — no findings; `npm run build` — `dist/app.js` and `dist/app.js.map`; `npm test` — 31 tests and `failed: 0`.
    9. `npm start`, `http://127.0.0.1:4310/`: the same tasks and the same due count as before the step (with an empty storage, six cards and `2`), the button is disabled, the Console has no warning about `key`.
    10. `git add -A`, `git commit -m "Move the UI into typed React components"`; `git diff HEAD~1 --stat -- domain storage` prints nothing.
