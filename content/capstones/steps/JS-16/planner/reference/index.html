<!doctype html>
<html lang="%%htmlLang%%">
<head>
  <meta charset="utf-8">
  <title>%%projectTitle%%</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>%%projectTitle%%</h1>
    <p class="pitch">%%pitch%%</p>
    <img src="images/task.svg" alt="%%imageAlt%%">

    <form id="task-form" novalidate>
      <h2>%%formTitle%%</h2>
      <div class="field">
        <label for="task-title">%%nameLabel%%</label>
        <input id="task-title" name="title" aria-describedby="task-title-error">
        <p id="task-title-error" class="error"></p>
      </div>
      <div class="field">
        <label for="task-due-date">%%valueLabel%%</label>
        <input id="task-due-date" name="dueDate" type="date">
      </div>
      <div class="field">
        <label for="task-priority">%%priorityFieldLabel%%</label>
        <select id="task-priority" name="priority">
          <option value="low">%%priorityLow%%</option>
          <option value="normal" selected>%%priorityNormal%%</option>
          <option value="high">%%priorityHigh%%</option>
        </select>
      </div>
      <div class="field field-check">
        <input id="task-done" name="done" type="checkbox">
        <label for="task-done">%%doneFieldLabel%%</label>
      </div>
      <button id="task-save" type="submit">%%saveLabel%%</button>
    </form>

    <p id="status" role="status"></p>
    <p id="load-message" role="status"></p>
    <button id="retry-load" type="button" hidden>%%retryLoadLabel%%</button>
    <p id="summary"></p>
    <p id="priorities"></p>
    <h2 id="list-title" tabindex="-1">%%listTitle%%</h2>
    <div class="field">
      <label for="search">%%searchLabel%%</label>
      <input id="search" type="search">
    </div>
    <div class="field">
      <label for="list-filter">%%filterLabel%%</label>
      <select id="list-filter">
        <option value="all">%%filterAll%%</option>
        <option value="pending">%%filterPending%%</option>
        <option value="done">%%filterDone%%</option>
      </select>
    </div>
    <ul id="tasks" class="cards"></ul>
    <button id="show-more" type="button" hidden>%%moreLabel%%</button>
    <p id="empty-message" hidden>%%emptyMessage%%</p>
  </main>
  <script type="module" src="app.js"></script>
  <!-- run-tests.js runs the tests in tests/ and prints one line per test in the console. -->
  <script type="module" src="run-tests.js"></script>
</body>
</html>
