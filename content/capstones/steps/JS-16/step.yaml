# Capstone step of unit JS-16 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-16-11-capstone-web-boundary from this file.
# The step is checked in the platform and continues from the JS-14 reference. Measured in the
# sandbox (Chrome): history.replaceState works in the project frame, and its address already has
# parameters of the platform (id, net), so the page changes only q and show.
unit: JS-16
mode: in-platform
entry: index.html
title:
  uk: "Межа вебу: адреса, мережа, текст"
  en: "The web boundary: address, network, text"
intro:
  uk: |
    Усе, що приходить ззовні, — [[untrusted-input|недовірені дані]]: адреса сторінки, відповідь сервера, файл із даними. На цьому кроці проєкт перетинає цю [[trust-boundary|межу довіри]] обережно.

    - **Адреса тримає вигляд списку.** Пошук і фільтр записуються в [[query-string|рядок запиту]] адреси сторінки (`?q=…&show=…`) через `URL` і `searchParams`, які [[percent-encoding|кодують]] кожне значення, — тож «Дім & сад» чи `#1` після перезавантаження повертаються без змін. Читаючи адресу, сторінка не довіряє їй: фільтр береться лише зі списку відомих значень.
    - **Мережа може зникнути.** Якщо запит початкових даних не дійшов (`fetch` відхилено з `TypeError`), сторінка один раз пробує ще — це [[bounded-retry|обмежений повтор]]. Відповідь зі статусом помилки чи скасований запит не повторюються.
    - **Текст лишається текстом.** Назви з файлу й з адреси потрапляють на сторінку лише через [[safe-sink|безпечні приймачі]] — `textContent` і `value`, тож розмітка в даних не виконується ([[xss|XSS]]).
    - **Жодних секретів у браузері.** Усе, що є в коді сторінки й у `localStorage`, може прочитати кожен, хто її відкрив ([[client-side-secret|секрет на клієнті]]). Тож сторінка зберігає лише власні записи й нічого не надсилає з ключами чи паролями.

    > [!note]
    > Якщо ти вже експортував проєкт (контрольна точка CP-JS), твої локальні файли — головні, і платформа їх не змінює. Тоді спершу зроби commit у своїй теці, завантаж еталон цього кроку з екрана проєкту й перенеси зміни вручну, звіряючи файли, як у уроках розділу JS-10.
  en: |
    Everything that comes from outside is [[untrusted-input]]: the page address, a server's answer, a data file. In this step the project crosses this [[trust-boundary]] carefully.

    - **The address keeps the view of the list.** The search and the filter are written into the [[query-string]] of the page address (`?q=…&show=…`) through `URL` and `searchParams`, which [[percent-encoding|encode]] every value — so “Дім & сад” or `#1` come back unchanged after a reload. Reading the address, the page does not trust it: the filter is taken only from a list of known values.
    - **The network can go away.** If the request for the starting data did not get through (`fetch` rejected with a `TypeError`), the page tries once more — a [[bounded-retry]]. An answer with an error status or an aborted request is not repeated.
    - **Text stays text.** Names from the file and from the address reach the page only through [[safe-sink|safe sinks]] — `textContent` and `value`, so markup in the data does not run ([[xss|XSS]]).
    - **No secrets in the browser.** Everything in the page's code and in `localStorage` can be read by anyone who opened it ([[client-side-secret]]). So the page stores only its own records and sends nothing with keys or passwords.

    > [!note]
    > If you have already exported the project (checkpoint CP-JS), your local files are the main ones, and the platform does not change them. Then first make a commit in your folder, download this step's reference from the project screen and carry the changes over by hand, comparing the files, as in the lessons of unit JS-10.
purpose:
  uk: "Це крок твого проєкту: рядок запиту й кодування, обробку мережевих збоїв, безпечні приймачі тексту й правило «жодних секретів у клієнті» із цього розділу ти застосовуєш до власного застосунку. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply this unit's query strings and encoding, handling of network failures, safe text sinks and the rule “no secrets in the client” to your own app. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Записувати й читати стан списку в рядку запиту адреси через `URL` і `URLSearchParams`, приймаючи з адреси лише відомі значення."
    en: "Write and read the state of the list in the address query through `URL` and `URLSearchParams`, accepting only known values from the address."
  - uk: "Один раз повторювати запит після мережевого збою й не повторювати відповідь зі статусом помилки чи скасований запит."
    en: "Repeat a request once after a network failure and not repeat an answer with an error status or an aborted request."
  - uk: "Показувати недовірений текст лише через безпечні приймачі й не зберігати в браузері нічого, крім власних записів."
    en: "Show untrusted text only through safe sinks and store nothing in the browser but the app's own records."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередні кроки не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
