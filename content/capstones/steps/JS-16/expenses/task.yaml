feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там помилка про `ui/address.js`, то файл лежить не в теці `ui/` або в `import` бракує `./address.js`."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. If it shows an error about `ui/address.js`, the file is not in the folder `ui/` or the `import` lacks `./address.js`."
  - when: { test: "readView reads the search and the filter of an address" }
    message:
      uk: "Ця перевірка чекає іменований експорт `readView` в `ui/address.js`: для закодованих `q=Дім & сад #1` і `show=fun` — `{ query: \"Дім & сад #1\", filter: \"fun\" }`, для адреси лише з `id` і `net` чи порожньої — `{ query: \"\", filter: \"all\" }`, для `show=<b>x</b>` — `filter: \"all\"`, а `?q=a%2Bb+c` дає пошук `a+b c`. Розкодовує значення `URLSearchParams`."
      en: "This check expects a named export `readView` in `ui/address.js`: for the encoded `q=Дім & сад #1` and `show=fun` — `{ query: \"Дім & сад #1\", filter: \"fun\" }`, for an address with only `id` and `net` or an empty one — `{ query: \"\", filter: \"all\" }`, for `show=<b>x</b>` — `filter: \"all\"`, and `?q=a%2Bb+c` gives the search `a+b c`. `URLSearchParams` decodes the values."
  - when: { test: "viewAddress writes the view and keeps the rest of the address" }
    message:
      uk: "Ця перевірка викликає `viewAddress` для адреси з `id=7&net=lab` і вигляду з пошуком `Дім & сад #1 100%` і чекає ту саму адресу й ті самі `id` і `net`, жодного фрагмента (`#` закодовано) і той самий вигляд, прочитаний назад через `readView`; порожній пошук і `\"all\"` мають прибрати `q` і `show`."
      en: "This check calls `viewAddress` for an address with `id=7&net=lab` and a view with the search `Дім & сад #1 100%`, and expects the same path and the same `id` and `net`, no fragment (the `#` is encoded) and the same view read back with `readView`; an empty search and `\"all\"` must remove `q` and `show`."
  - when: { test: "the search and the filter go into the page address" }
    message:
      uk: "Ця перевірка вводить у пошук назву «%%fixture5Name%%», запускає таймер і чекає її в параметрі `q` адреси сторінки (`location.search`), потім вибирає фільтр `fun` і чекає `show=fun`, а параметр платформи `id` має лишитися. Викликай `history.replaceState` з адресою від `viewAddress(location.href, …)`. Ще вона чекає, що жоден виклик `history.pushState` не додав запис в історію: адресу змінює `history.replaceState`."
      en: "This check types the name “%%fixture5Name%%” into the search, runs the timer and expects it in the parameter `q` of the page address (`location.search`), then chooses the filter `fun` and expects `show=fun`, and the platform's parameter `id` must stay. Call `history.replaceState` with the address from `viewAddress(location.href, …)`. It also expects that no `history.pushState` call added a history entry: `history.replaceState` changes the address."
  - when: { test: "a restart shows the view written in the address" }
    message:
      uk: "Ця перевірка ставить в адресу сторінки `q` з назвою «%%fixture5Name%%», викликає `start(storage)` і чекає лише картку `e-05` і цю назву в полі пошуку; потім `show=fun` — і лише картки `e-03` і `e-05` та фільтр `fun`. `start` має брати вигляд з `readView(location.search, FILTERS)`."
      en: "This check puts `q` with the name “%%fixture5Name%%” into the page address, calls `start(storage)` and expects only the card `e-05` and this name in the search field; then `show=fun` — and only the cards `e-03` and `e-05` and the filter `fun`. `start` must take the view from `readView(location.search, FILTERS)`."
  - when: { test: "an address with markup or an unknown filter is not trusted" }
    message:
      uk: "Ця перевірка ставить в адресу `q` з розміткою `<img … onerror=…>` і `show=<b>x</b>`, викликає `start(storage)` і чекає фільтр `all`, ту саму розмітку як текст у полі пошуку (`value`), жодного нового елемента `img` і жодного запуску коду з розмітки."
      en: "This check puts `q` with the markup `<img … onerror=…>` and `show=<b>x</b>` into the address, calls `start(storage)` and expects the filter `all`, the same markup as text in the search field (`value`), no new `img` element and no code from the markup run."
  - when: { test: "loadFixtures tries once more after a network failure" }
    message:
      uk: "Ця перевірка підміняє `fetch` і рахує запити: мережевий збій, потім файл — `loadFixtures` має повернути шість записів після двох запитів; збій щоразу — відхилитися з `TypeError` після двох запитів; статус `500` — відхилитися після одного запиту, без повтору."
      en: "This check replaces `fetch` and counts the requests: a network failure, then the file — `loadFixtures` must return six records after two requests; a failure every time — reject with a `TypeError` after two requests; the status `500` — reject after one request, without another try."
  - when: { test: "an aborted load is not tried again" }
    message:
      uk: "Ця перевірка скасовує `loadFixtures` через `AbortController`, поки відповідь ще йде, і чекає відхилення з `AbortError` після одного запиту. Скасування — не мережевий збій: перевір `signal.aborted` перед повтором або повторюй лише для `TypeError`."
      en: "This check aborts `loadFixtures` through an `AbortController` while the answer is still on its way, and expects a rejection with an `AbortError` after one request. An abort is not a network failure: check `signal.aborted` before another try, or repeat only for a `TypeError`."
  - when: { test: "a name with markup from the file stays text" }
    message:
      uk: "Ця перевірка відповідає на запит `data/expenses.json` записами, де поле `label` у `e-01` містить розмітку `<img … onerror=…><b>!</b>`, і чекає цей текст у заголовку картки, жодного `img` чи `b` у картці й жодного запуску коду з розмітки. Показуй дані через `textContent`, не `innerHTML`."
      en: "This check answers the request for `data/expenses.json` with records where the field `label` of `e-01` holds the markup `<img … onerror=…><b>!</b>`, and expects this text in the card heading, no `img` or `b` in the card and no code from the markup run. Show data with `textContent`, not `innerHTML`."
  - when: { test: "the page stores nothing but its own records" }
    message:
      uk: "Ця перевірка зберігає новий запис через форму, шукає й вибирає фільтр і чекає в сховищі ключ `jsll.expenses.v1` і жодного іншого, крім `jsll.expenses.v1.backup`. Пошук і фільтр живуть в адресі сторінки, а не в `localStorage`."
      en: "This check saves a new record through the form, searches and chooses a filter, and expects the key `jsll.expenses.v1` in the storage and no other one except `jsll.expenses.v1.backup`. The search and the filter live in the page address, not in `localStorage`."
  - when: { test: "your address tests pass with a correct address module" }
    message:
      uk: "Ця перевірка запускає `tests/address.test.js` з `ui/address.js` від курсу й раннером курсу та чекає хоча б один тест і жодного, що впав. Повідомлення внизу називає тест, що впав, або помилку. Якщо там «there is no file tests/address.test.js», то файл лежить не в теці `tests/` або має іншу назву."
      en: "This check runs `tests/address.test.js` with the course's `ui/address.js` and the course runner, and expects at least one test and none that fails. The message below names the failed test or the error. If it says “there is no file tests/address.test.js”, the file is not in the folder `tests/` or has another name."
  - when: { test: "your tests catch an address written without encoding" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `ui/address.js`. Потім вона підставляє версію, де `viewAddress` приклеює до адреси `q=` і пошук без кодування, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому пошук з `&` чи `#` записано й прочитано назад."
      en: "This check first expects all your tests to pass with the correct `ui/address.js`. Then it puts in a version where `viewAddress` glues `q=` and the search to the address without encoding, and expects at least one of your tests to fail. A test in which a search with `&` or `#` is written and read back notices this defect."
  - when: { test: "your tests catch a readView that trusts any filter" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `ui/address.js`. Потім вона підставляє версію, де `readView` бере будь-яке значення `show` з адреси, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому невідомий фільтр дає `\"all\"`."
      en: "This check first expects all your tests to pass with the correct `ui/address.js`. Then it puts in a version where `readView` takes any value of `show` from the address, and expects at least one of your tests to fail. A test in which an unknown filter gives `\"all\"` notices this defect."
  - when: { test: "run-tests.js runs the address tests too" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести адреси проходять із правильним модулем. Потім вона двічі виконує `run-tests.js` з підробленим `process` (як у Node.js): із правильним `ui/address.js` `process.exitCode` не має стати `1`, а з тим, що не кодує, — має. Для цього `run-tests.js` імпортує `./tests/address.test.js`."
      en: "This check first expects all your address tests to pass with the correct module. Then it runs `run-tests.js` twice with a stand-in `process` (as in Node.js): with the correct `ui/address.js` `process.exitCode` must not become `1`, with the one that does not encode it must. For that `run-tests.js` imports `./tests/address.test.js`."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
