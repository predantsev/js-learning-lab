# Expenses variant of step JS-16. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  homeAndGardenQuery: { uk: "Дім & сад", en: "Home & garden" }
instructions:
  uk: |
    Сторінка перетинає межу довіри в трьох місцях: адреса, мережа й текст із даних.

    **1. Модуль `ui/address.js`** — дві чисті функції (іменовані експорти):

    - `readView(search, filters)` — з рядка запиту адреси (`location.search`, наприклад `"?q=%D0%94%D1%96%D0%BC&show=fun"`) повертає `{ query, filter }`. Читай його через `new URLSearchParams(search)`: `query` — значення `q` або `""`, `filter` — значення `show`, **лише** якщо воно є в масиві `filters`, інакше `"all"`. Адресу може написати будь-хто, тож невідоме значення не приймається.
    - `viewAddress(href, view)` — повертає адресу `href` із записаним `view`: через `new URL(href)` і `url.searchParams.set("q", …)` для непорожнього пошуку (порожній — `delete("q")`) і `set("show", …)` для фільтра, крім `"all"` (тоді `delete("show")`). Інші параметри адреси лишаються: у платформі в адресі сторінки вже є її власні `id` і `net`. `searchParams` кодує кожне значення, тож `"%%homeAndGardenQuery%% #1"` повертається без змін, а `#` не стає початком фрагмента.

    **2. Сторінка тримає вигляд в адресі.** У `ui/page.js` додай `const FILTERS = ["food", "transport", "home", "fun"];`. Коли пошук спрацьовує (після паузи) і коли змінюється фільтр, викликай `history.replaceState(history.state, "", viewAddress(location.href, { query, filter }))` — адреса змінюється без нового запиту й без нового запису в історії. А `start(storage)` замість порожніх значень бере `readView(location.search, FILTERS)` і ставить їх у поле пошуку (`value`) і фільтр.

    **3. Один повтор після мережевого збою.** У `data/fixtures.js` перейменуй наявну функцію на `loadOnce` (без експорту), а новий експорт `loadFixtures(signal)` викликає її і, якщо `fetch` відхилено з `TypeError` (відповіді немає зовсім), а запит не скасовано (`signal.aborted` не `true`), пробує ще раз — лише раз. Відповідь зі статусом помилки, пошкоджений файл і скасування не повторюються: інша спроба дала б те саме.

    **4. Текст лишається текстом, секретів немає.** Назви з `data/expenses.json` і пошук з адреси вже потрапляють на сторінку через `textContent` і `value` — не змінюй цього й не вставляй їх через `innerHTML`. Сторінка зберігає лише свої записи (`jsll.expenses.v1` і резервну копію) і не тримає в коді чи в `localStorage` жодних ключів доступу чи паролів: усе це може прочитати кожен, хто відкрив сторінку.

    **5. Тести `tests/address.test.js`** (імпортуй його в `run-tests.js`): пошук із `&`, `#` і пробілами, записаний `viewAddress` і прочитаний `readView`, повертається без змін, а інший параметр адреси лишається; порожній пошук і фільтр `"all"` не додають параметрів; невідомий фільтр з адреси дає `"all"`.

    **Як перевірятиметься.** Перевірки викликають `readView` і `viewAddress` з різними адресами, вводять пошук і вибирають фільтр (таймери — на годиннику перевірок) і читають адресу сторінки, а потім ставлять у неї `q` і `show` та перезапускають сторінку викликом `start(storage)` — також із розміткою й невідомим фільтром. Після кожної такої перевірки адреса повертається до початкової. `fetch` перевірки підміняють своїми відповідями: мережевий збій, статус `500`, скасування, назва з розміткою у файлі. Ще вони дивляться, які ключі лишилися в сховищі. Твої тести запускаються з `ui/address.js` від курсу (усі мають пройти) і з двома зламаними версіями: адреса без кодування й `readView`, що приймає будь-який фільтр, — з кожною хоча б один тест має впасти.
  en: |
    The page crosses the trust boundary in three places: the address, the network and the text in the data.

    **1. The module `ui/address.js`** — two pure functions (named exports):

    - `readView(search, filters)` — from the query of an address (`location.search`, for example `"?q=%D0%94%D1%96%D0%BC&show=fun"`) returns `{ query, filter }`. Read it with `new URLSearchParams(search)`: `query` is the value of `q` or `""`, `filter` is the value of `show` **only** if it is in the array `filters`, otherwise `"all"`. Anyone can write an address, so an unknown value is not accepted.
    - `viewAddress(href, view)` — returns the address `href` with `view` written into it: through `new URL(href)` and `url.searchParams.set("q", …)` for a search that is not empty (an empty one — `delete("q")`) and `set("show", …)` for the filter, except `"all"` (then `delete("show")`). The other parameters of the address stay: on the platform the page address already has its own `id` and `net`. `searchParams` encodes every value, so `"%%homeAndGardenQuery%% #1"` comes back unchanged, and `#` does not start a fragment.

    **2. The page keeps the view in its address.** In `ui/page.js` add `const FILTERS = ["food", "transport", "home", "fun"];`. When the search runs (after the pause) and when the filter changes, call `history.replaceState(history.state, "", viewAddress(location.href, { query, filter }))` — the address changes without a new request and without a new history entry. And `start(storage)`, instead of empty values, takes `readView(location.search, FILTERS)` and puts them into the search field (`value`) and the filter.

    **3. One more try after a network failure.** In `data/fixtures.js` rename the existing function to `loadOnce` (not exported), and the new export `loadFixtures(signal)` calls it and, if `fetch` was rejected with a `TypeError` (there is no answer at all) and the request was not aborted (`signal.aborted` is not `true`), tries once more — only once. An answer with an error status, a damaged file and an abort are not repeated: another try would give the same result.

    **4. Text stays text, no secrets.** Names from `data/expenses.json` and the search from the address already reach the page through `textContent` and `value` — do not change that and do not insert them with `innerHTML`. The page stores only its own records (`jsll.expenses.v1` and the backup copy) and keeps no access keys or passwords in its code or in `localStorage`: anyone who opened the page can read all of that.

    **5. Tests `tests/address.test.js`** (import it in `run-tests.js`): a search with `&`, `#` and spaces, written by `viewAddress` and read by `readView`, comes back unchanged, and another parameter of the address stays; an empty search and the filter `"all"` add no parameters; an unknown filter from the address gives `"all"`.

    **How it is checked.** The checks call `readView` and `viewAddress` with different addresses, type a search and choose a filter (the timers run on the checks' clock) and read the page address, then put `q` and `show` into it and restart the page by calling `start(storage)` — also with markup and an unknown filter. After each such check the address goes back to the original one. The checks replace `fetch` with answers of their own: a network failure, the status `500`, an abort, a label with markup in the file. They also look at which keys are left in the storage. Your tests run with the course's `ui/address.js` (all must pass) and with two broken versions: an address without encoding, and a `readView` that accepts any filter — with each, at least one test must fail.
nudge:
  uk: "`URLSearchParams` сам розкодовує й кодує значення, тож не склеюй адресу з `\"?q=\" + query` — так `&` у пошуку розірве його на два параметри. Для тесту запиши вигляд через `viewAddress`, прочитай назад через `readView(new URL(адреса).search, …)` і порівняй з початковим."
  en: "`URLSearchParams` decodes and encodes values itself, so do not glue the address from `\"?q=\" + query` — then an `&` in the search splits it into two parameters. For the test, write the view with `viewAddress`, read it back with `readView(new URL(address).search, …)` and compare it with the original."
