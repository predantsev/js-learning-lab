# Wishlist variant of step NO-11 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS on the scratch project of this capstone after NO-07, in a Ukrainian and an English workspace,
# on Node.js 25.2.1 and 22.13.1 (curl 8.7.1): npm test (46 tests, the streams tests 15 times in a row), the run of
# the intro on a fresh data folder. Wrong variants run against npm test, each failed at least one test: write()
# answer ignored, a line written again after 'drain', the export straight into the destination, the temp file
# left after an error, the signal not handed to pipeline, insert instead of upsert, valid lines written before
# the whole input is checked, the first problem only, line numbers lost (blank lines), a duplicate id in the
# file accepted, no record budget, no line length limit, a client abort ignored, an unbounded import queue, no
# Retry-After, the slot not freed after a failed job, no retry of a passing write failure, the body piped
# straight into the job, the rest of a refused body not dropped, the export fields in stored order.
# Not run on Linux or Windows.
instructions:
  uk: |
    Експортуй і імпортуй бажання як JSON lines: потоком, з backpressure, як обмежену задачу, яку можна скасувати й повторити без дублів. Платформа цей крок не перевіряє.

    1. `src/jsonl.ts`: `wishLine` (`{id, name, price, acquired, category}`), `toJsonLines`, `writeJsonLines`, `exportToFile`, `splitLines`.
    2. `src/jobs.ts`: `createJobQueue`, `QueueFull`, `retry`.
    3. `src/importer.ts`: `importJsonLines`, `IMPORT_LIMITS` (`maxRecords` 20 000, `maxLineBytes` 4096, `maxBytes` 8 000 000, `batchSize` 500); `src/fileRepository.ts`: `upsertMany` (бажання з рядка замінює збережене з тим самим `id`, нове — в кінець), `MAX_DATA_BYTES` 10 000 000.
    4. `src/api.ts`: `GET /v1/export`, `POST /v1/import` (`IMPORT_BUSY` у `src/api-errors.ts`); `src/server.ts`: черга імпорту й параметр `importLimits`.
    5. `src/synth.ts`, `src/export-store.ts`, `src/import-store.ts` і скрипти `"synth"`, `"export"`, `"import"`; `"allowJs": true` у `tsconfig.json`.
    6. `tests/streams.test.ts`.
    7. Прогін з інтро на свіжій теці `data/` (зупини сервер і перенеси стару теку за межі проєкту, щоб `git add -A` не додав її в Git: `mv data ~/js-course/wishlist-data-before-no11`, а тоді `mkdir data` — без теки перша команда, `npm run -s synth -- 10000 > data/import.jsonl`, падає з `no such file or directory: data/import.jsonl`). `data/bad.jsonl`:

       ```text
       {"id":"w-01","name":"Навушники","price":80,"acquired":false,"category":"Техніка"}
       {"id":"w-02","name":"Настільна лампа","price":12.5,"acquired":false,"category":"Дім"}
       {"id":"w-03","name":"Велосипед"
       {"id":"../w-04","name":"Книжка","price":25,"acquired":true,"category":null}
       ```

    8. `docs/server.md`, розділ «NO-11»; `git commit -m "Stream the records out and in as JSON lines: a bounded, cancellable import job that upserts by id"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ tests 46`, `ℹ fail 0`; запусти кілька разів — стабільно.
    - Імпорт 10 000 рядків двічі — `10000 new wishes`, потім `0 new wishes, 10000 updated`; у сховищі 10 006, а не 20 006.
    - `GET /v1/export` — `application/x-ndjson` і 10 006 рядків; `data/bad.jsonl` — `400` з номерами рядків 2, 3, 4, сховище не змінилося.
    - Другий імпорт під час повільного — `503` і `retry-after: 1`; після `kill %1` кількість записів та сама.
    - `npm run typecheck` — жодного рядка; `npm run check` і `npm run check:server` — усі `✔`.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Export and import the wishes as JSON lines: streamed, with backpressure, as a bounded job that can be cancelled and retried without duplicates. The platform does not check this step.

    1. `src/jsonl.ts`: `wishLine` (`{id, name, price, acquired, category}`), `toJsonLines`, `writeJsonLines`, `exportToFile`, `splitLines`.
    2. `src/jobs.ts`: `createJobQueue`, `QueueFull`, `retry`.
    3. `src/importer.ts`: `importJsonLines`, `IMPORT_LIMITS` (`maxRecords` 20,000, `maxLineBytes` 4096, `maxBytes` 8,000,000, `batchSize` 500); `src/fileRepository.ts`: `upsertMany` (the wish of a line replaces the stored one with the same `id`, a new one goes to the end), `MAX_DATA_BYTES` 10,000,000.
    4. `src/api.ts`: `GET /v1/export`, `POST /v1/import` (`IMPORT_BUSY` in `src/api-errors.ts`); `src/server.ts`: the import queue and the `importLimits` parameter.
    5. `src/synth.ts`, `src/export-store.ts`, `src/import-store.ts` and the scripts `"synth"`, `"export"`, `"import"`; `"allowJs": true` in `tsconfig.json`.
    6. `tests/streams.test.ts`.
    7. The run of the intro on a fresh `data/` folder (stop the server and move the old folder out of the project, so that `git add -A` does not put it into Git: `mv data ~/js-course/wishlist-data-before-no11`, then `mkdir data` — without the folder the first command, `npm run -s synth -- 10000 > data/import.jsonl`, fails with `no such file or directory: data/import.jsonl`). `data/bad.jsonl`:

       ```text
       {"id":"w-01","name":"Headphones","price":80,"acquired":false,"category":"Tech"}
       {"id":"w-02","name":"Desk lamp","price":12.5,"acquired":false,"category":"Home"}
       {"id":"w-03","name":"Bicycle"
       {"id":"../w-04","name":"A book","price":25,"acquired":true,"category":null}
       ```

    8. `docs/server.md`, a section “NO-11”; `git commit -m "Stream the records out and in as JSON lines: a bounded, cancellable import job that upserts by id"`.

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ tests 46`, `ℹ fail 0`; run it several times — stable.
    - Importing 10,000 lines twice — `10000 new wishes`, then `0 new wishes, 10000 updated`; the store holds 10,006, not 20,006.
    - `GET /v1/export` — `application/x-ndjson` and 10,006 lines; `data/bad.jsonl` — a `400` with the line numbers 2, 3, 4, the store unchanged.
    - A second import during the slow one — `503` and `retry-after: 1`; after `kill %1` the record count is the same.
    - `npm run typecheck` — not a single line; `npm run check` and `npm run check:server` — every check `✔`.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
