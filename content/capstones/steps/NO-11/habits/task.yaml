# Habit tracker variant of step NO-11 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS on the scratch project of this capstone after NO-07, in a Ukrainian and an English workspace,
# on Node.js 25.2.1 and 22.13.1 (curl 8.7.1): npm test (57 tests, five runs in a row), the run of the intro on a
# fresh data folder. Wrong variants run against npm test, each failed at least one test: the 20 of the wishlist
# adapted, plus completions replaced instead of merged, completions concatenated without dedupe (also sorted), the line fields ignored, no limit on the merged completions, a non-real day accepted, no per-line 1000-day check, maxLineBytes back at 4096. Not run on Linux or Windows.
instructions:
  uk: |
    Експортуй і імпортуй звички як JSON lines: потоком, з backpressure, як обмежену задачу, яку можна скасувати й повторити без дублів. Платформа цей крок не перевіряє.

    1. `src/jsonl.ts`: `habitLine` (`{id, name, frequency, active, completions}`), `toJsonLines`, `writeJsonLines`, `exportToFile`, `splitLines`.
    2. `src/jobs.ts`: `createJobQueue`, `QueueFull`, `retry`.
    3. `src/importer.ts`: `importJsonLines`, `IMPORT_LIMITS` (`maxRecords` 20 000, `maxLineBytes` 16 384 — звичка з 1000 днів займає близько 13 КБ, `maxBytes` 8 000 000, `batchSize` 500); `src/fileRepository.ts`: `upsertMany` (звичка з рядка замінює збережену з тим самим `id`, а `completions` зливаються: відсортована множина різних днів збереженого й рядка (`uniqueSortedDays`); нова — в кінець), `MAX_DATA_BYTES` 16 000 000 (10 006 звичок по 30 днів — 5,67 МБ); злиття, що вивело б звичку за `MAX_COMPLETIONS`, відмовляє весь імпорт (`400`, нічого не записано).
    4. `src/api.ts`: `GET /v1/export`, `POST /v1/import` (`IMPORT_BUSY` у `src/api-errors.ts`); `src/server.ts`: черга імпорту й параметр `importLimits`.
    5. `src/synth.ts`, `src/export-store.ts`, `src/import-store.ts` і скрипти `"synth"`, `"export"`, `"import"`; `"allowJs": true` у `tsconfig.json`.
    6. `tests/streams.test.ts`: кожен рядок — контракт сховища, форма `id`, справжні дні й `MAX_COMPLETIONS` (як у NO-07); правило проєкту — той самий файл двічі не подвоює виконань, а день, виконаний між двома імпортами, лишається.
    7. Прогін з інтро на свіжій теці `data/` (зупини сервер і перенеси стару теку за межі проєкту, щоб `git add -A` не додав її в Git: `mv data ~/js-course/habits-data-before-no11`, а тоді `mkdir data` — без теки перша команда, `npm run -s synth -- 10000 > data/import.jsonl`, падає з `no such file or directory: data/import.jsonl`). `data/bad.jsonl`:

       ```text
       {"id":"h-01","name":"Ранкова зарядка","frequency":"daily","active":true,"completions":["2026-02-27","2026-02-28","2026-03-01"]}
       {"id":"h-02","name":"Читати 20 хвилин","frequency":"daily","active":true,"completions":["2026-02-30"]}
       {"id":"h-03","name":"Пити"
       {"id":"../h-04","name":"Прибирання","frequency":"weekly","active":true,"completions":[]}
       ```

    8. `docs/server.md`, розділ «NO-11»; `git commit -m "Stream the records out and in as JSON lines: a bounded, cancellable import job that upserts by id"`.

    **Спробуй зламати (крок «Спробуй зламати» інтро), назви тестів цього проєкту:** ігноруй відповідь `write()` — `✖ writeJsonLines waits for 'drain': the writer's queue never holds more than its limit plus one line`; пиши рядки в сховище до кінця перевірки — `✖ every line is checked and named by its number; one bad line and nothing is written`; встав запис замість upsert — `✖ 10,000 synthetic habits import once; the same file imported again duplicates nothing`; прибери `controller.abort()` у `close` — `✖ a client that goes away in the middle aborts the import: nothing is written, the next import runs`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ tests 57`, `ℹ fail 0`; запусти кілька разів — стабільно.
    - Імпорт 10 000 рядків двічі — `10000 new habits`, потім `0 new habits, 10000 updated`; у сховищі 10 006, а не 20 006.
    - `GET /v1/export` — `application/x-ndjson` і 10 006 рядків; `data/bad.jsonl` — `400` з номерами рядків 2, 3, 4, сховище не змінилося.
    - Другий імпорт під час повільного — `503` і `retry-after: 1`; після `kill %1` кількість записів та сама.
    - `npm run typecheck` — жодного рядка; `npm run check` і `npm run check:server` — усі `✔`.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Export and import the habits as JSON lines: streamed, with backpressure, as a bounded job that can be cancelled and retried without duplicates. The platform does not check this step.

    1. `src/jsonl.ts`: `habitLine` (`{id, name, frequency, active, completions}`), `toJsonLines`, `writeJsonLines`, `exportToFile`, `splitLines`.
    2. `src/jobs.ts`: `createJobQueue`, `QueueFull`, `retry`.
    3. `src/importer.ts`: `importJsonLines`, `IMPORT_LIMITS` (`maxRecords` 20,000, `maxLineBytes` 16,384 — a habit with 1000 days takes about 13 KB, `maxBytes` 8,000,000, `batchSize` 500); `src/fileRepository.ts`: `upsertMany` (the habit of a line replaces the stored one with the same `id`, and `completions` are merged: the sorted set of different days of the stored one and the line (`uniqueSortedDays`); a new one goes to the end), `MAX_DATA_BYTES` 16,000,000 (10,006 habits of 30 days take 5.67 MB); a merge that would take a habit past `MAX_COMPLETIONS` refuses the whole import (`400`, nothing written).
    4. `src/api.ts`: `GET /v1/export`, `POST /v1/import` (`IMPORT_BUSY` in `src/api-errors.ts`); `src/server.ts`: the import queue and the `importLimits` parameter.
    5. `src/synth.ts`, `src/export-store.ts`, `src/import-store.ts` and the scripts `"synth"`, `"export"`, `"import"`; `"allowJs": true` in `tsconfig.json`.
    6. `tests/streams.test.ts`: every line — the storage contract, the `id` shape, real days and `MAX_COMPLETIONS` (as in NO-07); the project rule — the same file twice never doubles a completion, and a day completed between the two imports stays.
    7. The run of the intro on a fresh `data/` folder (stop the server and move the old folder out of the project, so that `git add -A` does not put it into Git: `mv data ~/js-course/habits-data-before-no11`, then `mkdir data` — without the folder the first command, `npm run -s synth -- 10000 > data/import.jsonl`, fails with `no such file or directory: data/import.jsonl`). `data/bad.jsonl`:

       ```text
       {"id":"h-01","name":"Morning exercise","frequency":"daily","active":true,"completions":["2026-02-27","2026-02-28","2026-03-01"]}
       {"id":"h-02","name":"Read for 20 minutes","frequency":"daily","active":true,"completions":["2026-02-30"]}
       {"id":"h-03","name":"Drink"
       {"id":"../h-04","name":"Tidy up","frequency":"weekly","active":true,"completions":[]}
       ```

    8. `docs/server.md`, a section “NO-11”; `git commit -m "Stream the records out and in as JSON lines: a bounded, cancellable import job that upserts by id"`.

    **Try to break it (the intro's "Try to break it" step), with this project's test names:** ignore the answer of `write()` — `✖ writeJsonLines waits for 'drain': the writer's queue never holds more than its limit plus one line`; write the lines to the store before the check ends — `✖ every line is checked and named by its number; one bad line and nothing is written`; insert instead of an upsert — `✖ 10,000 synthetic habits import once; the same file imported again duplicates nothing`; remove `controller.abort()` from `close` — `✖ a client that goes away in the middle aborts the import: nothing is written, the next import runs`.

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ tests 57`, `ℹ fail 0`; run it several times — stable.
    - Importing 10,000 lines twice — `10000 new habits`, then `0 new habits, 10000 updated`; the store holds 10,006, not 20,006.
    - `GET /v1/export` — `application/x-ndjson` and 10,006 lines; `data/bad.jsonl` — a `400` with the line numbers 2, 3, 4, the store unchanged.
    - A second import during the slow one — `503` and `retry-after: 1`; after `kill %1` the record count is the same.
    - `npm run typecheck` — not a single line; `npm run check` and `npm run check:server` — every check `✔`.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
