# Capstone step of unit NO-11 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson of kind capstone-step of NO-11 from this file.
# A local step: done in the learner's editor and terminal; no platform checks. The project page shows only
# the intro of a local step, so the intro carries the whole procedure.
# Every command was run on macOS in a scratch home on all four projects, continuing the NO-07 references, in a
# Ukrainian and an English workspace, on Node.js 25.2.1 (npm 11.6.2, curl 8.7.1) and on Node.js 22.13.1
# (npm 10.9.2, with NODE_OPTIONS=--experimental-strip-types), on a fresh data folder: npm run synth, npm run
# import (twice), npm run export, npm start with the curl requests of the intro (export, import, a bad file, a
# slow import plus a second one, the slow one cancelled), npm test, npm run check, npm run check:server, npm run
# typecheck. Deliberately wrong variants were run against npm test on all four; each failed at least one test
# (listed in the task files' headers and in the hand-back). Quoted output is from the wishlist run in the
# Ukrainian workspace on Node.js 25.2.1. Not run: Linux, Windows.
# reference/ is the NO-07 reference plus the files of this step (without node_modules/, package-lock.json and
# the runtime folders server/data/ and server/.check/); sample names in tests/ are fixture strings.
