# Expense tracker variant of step NO-11 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS on the scratch project of this capstone after NO-07, in a Ukrainian and an English workspace,
# on Node.js 25.2.1 and 22.13.1 (curl 8.7.1): npm test (48 tests, five runs in a row), the run of the intro on a
# fresh data folder. Wrong variants run against npm test, each failed at least one test: the 20 of the wishlist
# adapted, plus an upsert that adds the amount instead of replacing it (doubles a category total). Not run on Linux or Windows.
instructions:
  uk: |
    Експортуй і імпортуй витрати як JSON lines: потоком, з backpressure, як обмежену задачу, яку можна скасувати й повторити без дублів. Платформа цей крок не перевіряє.

    1. `src/jsonl.ts`: `expenseLine` (`{id, label, amountMinor, date, category}`), `toJsonLines`, `writeJsonLines`, `exportToFile`, `splitLines`.
    2. `src/jobs.ts`: `createJobQueue`, `QueueFull`, `retry`.
    3. `src/importer.ts`: `importJsonLines`, `IMPORT_LIMITS` (`maxRecords` 20 000, `maxLineBytes` 4096, `maxBytes` 8 000 000, `batchSize` 500); `src/fileRepository.ts`: `upsertMany` (витрата з рядка замінює збережену з тим самим `id`, нова — в кінець), `MAX_DATA_BYTES` 10 000 000.
    4. `src/api.ts`: `GET /v1/export`, `POST /v1/import` (`IMPORT_BUSY` у `src/api-errors.ts`); `src/server.ts`: черга імпорту й параметр `importLimits`.
    5. `src/synth.ts`, `src/export-store.ts`, `src/import-store.ts` і скрипти `"synth"`, `"export"`, `"import"`; `"allowJs": true` у `tsconfig.json`.
    6. `tests/streams.test.ts`: кожен рядок — контракт сховища (`amountMinor` додатне ціле, `category` зі списку, `label` до 80) і форма `id`; правило проєкту — суми за категоріями (`summarizeExpenses(…).byCategory`) після того самого файлу двічі — ті самі, що після одного разу.
    7. Прогін з інтро на свіжій теці `data/` (зупини сервер і перейменуй стару теку: `mv data data-before-no11`). `data/bad.jsonl`:

       ```text
       {"id":"e-01","label":"Продукти на тиждень","amountMinor":84550,"date":"2026-03-01","category":"food"}
       {"id":"e-02","label":"Таксі","amountMinor":12.5,"date":"2026-03-02","category":"transport"}
       {"id":"e-03","label":"Кіно"
       {"id":"../e-04","label":"Кава","amountMinor":9000,"date":"2026-03-03","category":"fun"}
       ```

    8. `docs/server.md`, розділ «NO-11»; `git commit -m "Stream the records out and in as JSON lines: a bounded, cancellable import job that upserts by id"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ tests 48`, `ℹ fail 0`; запусти кілька разів — стабільно.
    - Імпорт 10 000 рядків двічі — `10000 new expenses`, потім `0 new expenses, 10000 updated`; у сховищі 10 006, а не 20 006.
    - `GET /v1/export` — `application/x-ndjson` і 10 006 рядків; `data/bad.jsonl` — `400` з номерами рядків 2, 3, 4, сховище не змінилося.
    - Другий імпорт під час повільного — `503` і `retry-after: 1`; після `kill %1` кількість записів та сама.
    - `npm run typecheck` — жодного рядка; `npm run check` і `npm run check:server` — усі `✔`.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Export and import the expenses as JSON lines: streamed, with backpressure, as a bounded job that can be cancelled and retried without duplicates. The platform does not check this step.

    1. `src/jsonl.ts`: `expenseLine` (`{id, label, amountMinor, date, category}`), `toJsonLines`, `writeJsonLines`, `exportToFile`, `splitLines`.
    2. `src/jobs.ts`: `createJobQueue`, `QueueFull`, `retry`.
    3. `src/importer.ts`: `importJsonLines`, `IMPORT_LIMITS` (`maxRecords` 20,000, `maxLineBytes` 4096, `maxBytes` 8,000,000, `batchSize` 500); `src/fileRepository.ts`: `upsertMany` (the expense of a line replaces the stored one with the same `id`, a new one goes to the end), `MAX_DATA_BYTES` 10,000,000.
    4. `src/api.ts`: `GET /v1/export`, `POST /v1/import` (`IMPORT_BUSY` in `src/api-errors.ts`); `src/server.ts`: the import queue and the `importLimits` parameter.
    5. `src/synth.ts`, `src/export-store.ts`, `src/import-store.ts` and the scripts `"synth"`, `"export"`, `"import"`; `"allowJs": true` in `tsconfig.json`.
    6. `tests/streams.test.ts`: every line — the storage contract (`amountMinor` a positive whole number, `category` from the list, `label` up to 80) and the `id` shape; the project rule — the totals per category (`summarizeExpenses(…).byCategory`) after the same file twice equal those after once.
    7. The run of the intro on a fresh `data/` folder (stop the server and rename the old folder: `mv data data-before-no11`). `data/bad.jsonl`:

       ```text
       {"id":"e-01","label":"Weekly groceries","amountMinor":84550,"date":"2026-03-01","category":"food"}
       {"id":"e-02","label":"Taxi","amountMinor":12.5,"date":"2026-03-02","category":"transport"}
       {"id":"e-03","label":"Cinema"
       {"id":"../e-04","label":"Coffee","amountMinor":9000,"date":"2026-03-03","category":"fun"}
       ```

    8. `docs/server.md`, a section “NO-11”; `git commit -m "Stream the records out and in as JSON lines: a bounded, cancellable import job that upserts by id"`.

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ tests 48`, `ℹ fail 0`; run it several times — stable.
    - Importing 10,000 lines twice — `10000 new expenses`, then `0 new expenses, 10000 updated`; the store holds 10,006, not 20,006.
    - `GET /v1/export` — `application/x-ndjson` and 10,006 lines; `data/bad.jsonl` — a `400` with the line numbers 2, 3, 4, the store unchanged.
    - A second import during the slow one — `503` and `retry-after: 1`; after `kill %1` the record count is the same.
    - `npm run typecheck` — not a single line; `npm run check` and `npm run check:server` — every check `✔`.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
