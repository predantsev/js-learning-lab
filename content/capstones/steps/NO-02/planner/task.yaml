# Planner variant of step NO-02 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS (Node.js 25.2.1, TypeScript 7.0.2) on the scratch project of this capstone after NO-01, in a
# Ukrainian and an English workspace, with a real SIGKILL between the temp-file write and the rename; not run
# on Node.js 22, Linux or Windows.
instructions:
  uk: |
    Перенеси записи в `server/data/planner.json` через файловий репозиторій з атомарним записом і доведи, що навмисний збій нічого не псує. Платформа цей крок не перевіряє.

    1. `loadConfig`: `dataDir` (за замовчуванням `server/data` від `import.meta.dirname`, `DATA_DIR` — для перевірок) і `crashBeforeRename` (`CRASH_BEFORE_RENAME=1`, інше значення — помилка).
    2. `src/files.ts`: `resolveInside`, `readTextBounded`, `writeAtomic`, `removeStaleTemps`.
    3. `src/fileRepository.ts`: `createFileRepository(dataDir, { maxBytes, beforeRename })` — `{ schemaVersion: 1, records }` у `planner.json`, прочитане проходить `parseTaskList`; `list`, `get`, `save`, `remove`, `recover`, `seed`.
    4. `src/open.ts`: `openRepository(config)` — `recover()`, потім `seed` стартовими записами; зі збоєм — `process.kill(process.pid, "SIGKILL")` перед `rename`.
    5. `src/complete-task.ts` (`npm run complete -- t-01`) позначає справу виконаною; `summary.ts` читає збережені записи; `src/check-repository.ts` (`npm run check`).
    6. `server/data/` і `server/.check/` — у `.gitignore`; `docs/server.md`, розділ «NO-02»; `git commit -m "Store records in server/data with atomic writes and a crash rehearsal"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - Перший `npm run summary` створює `server/data/planner.json` зі стартовими записами.
    - `CRASH_BEFORE_RENAME=1 TODAY=2026-03-02 npm run complete -- t-01; echo "exit $?"` — `exit 137`; `ls data` — `planner.json` і один `*.tmp`.
    - Наступний `npm run summary` прибирає `*.tmp` і показує останній повний файл: з `TODAY=2026-03-02` — 2 справи, «%%fixture1Name%%» (t-01) ще серед них, з тими самими `dueDate` і `priority`; після зміни без збою — 1.
    - `TODAY=2026-03-02 npm run complete -- t-01` без прапорця — зміна збережена й видна в `npm run summary`.
    - `npm run check` — `8 of 8 checks passed`; `npm run typecheck` — жодного рядка; `git status` після commit — чисто.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Move the records into `server/data/planner.json` through a file repository with atomic writes and prove that a deliberate crash damages nothing. The platform does not check this step.

    1. `loadConfig`: `dataDir` (`server/data` from `import.meta.dirname` by default, `DATA_DIR` — for the checks) and `crashBeforeRename` (`CRASH_BEFORE_RENAME=1`, any other value is an error).
    2. `src/files.ts`: `resolveInside`, `readTextBounded`, `writeAtomic`, `removeStaleTemps`.
    3. `src/fileRepository.ts`: `createFileRepository(dataDir, { maxBytes, beforeRename })` — `{ schemaVersion: 1, records }` in `planner.json`, what is read passes `parseTaskList`; `list`, `get`, `save`, `remove`, `recover`, `seed`.
    4. `src/open.ts`: `openRepository(config)` — `recover()`, then `seed` with the starting records; with the crash flag — `process.kill(process.pid, "SIGKILL")` before the `rename`.
    5. `src/complete-task.ts` (`npm run complete -- t-01`) marks a task as done; `summary.ts` reads the stored records; `src/check-repository.ts` (`npm run check`).
    6. `server/data/` and `server/.check/` — in `.gitignore`; `docs/server.md`, a section “NO-02”; `git commit -m "Store records in server/data with atomic writes and a crash rehearsal"`.

    **Self-check — confirm every item yourself:**

    - The first `npm run summary` creates `server/data/planner.json` with the starting records.
    - `CRASH_BEFORE_RENAME=1 TODAY=2026-03-02 npm run complete -- t-01; echo "exit $?"` — `exit 137`; `ls data` — `planner.json` and one `*.tmp`.
    - The next `npm run summary` removes the `*.tmp` and shows the last complete file: with `TODAY=2026-03-02` — 2 tasks, “%%fixture1Name%%” (t-01) still among them, with the same `dueDate` and `priority`; after the change without a crash — 1.
    - `TODAY=2026-03-02 npm run complete -- t-01` without the flag — the change is saved and visible in `npm run summary`.
    - `npm run check` — `8 of 8 checks passed`; `npm run typecheck` — not a single line; `git status` after the commit — clean.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
