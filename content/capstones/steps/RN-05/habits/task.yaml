# Habit tracker variant of step RN-05 (a local step: done in the learner's editor, terminal and on the
# declared native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1,
# Expo SDK 57, async-storage 2.2.0) on the scratch project of this capstone; nothing was run on an
# emulator, a simulator or a phone.
instructions:
  uk: |
    Збережи звички на пристрої у знімку з версією: вони переживають перезапуск, наданий знімок v0 мігрує, а пошкоджений лягає під резервний ключ із повідомленням. Платформа цей крок не перевіряє.

    1. `npx expo install @react-native-async-storage/async-storage`; `src/nativeStorage.ts` — `nativeStorage` з трьома методами `AsyncStorage`; в `App.tsx` — `createRepository(nativeStorage, …)`.
    2. `src/snapshot.ts`: `CURRENT_VERSION = 1`, `BACKUP_KEY = "jsll.habits.v1.backup"`, `migrate` (мапа `steps`, у кроці `0` `completions` проходять через `uniqueSortedDays` з домену), `restoreSnapshot` (`JSON.parse` → `migrate` → `parseHabitList`), `loadSnapshot` (мігрований — зберегти одразу; невідновний — спершу копія під `BACKUP_KEY`).
    3. Репозиторій: `readAll()` → `{ records, recovered }`, після відновлення зберігає стартовий список. Список показує «%%loadErrorMessage%%»; якщо сховище не відповіло — «%%listLoadFailedMessage%%» і «%%retryLoadLabel%%».
    4. Наданий знімок — створи файл `data/legacy-v0.json` саме з таким вмістом:

    ```json
    {
      "schemaVersion": 0,
      "records": [
        { "id": "h-01", "name": "%%fixture1Name%%", "frequency": "daily", "active": true, "completions": ["2026-03-01", "2026-02-27", "2026-03-01", "2026-02-28"] },
        { "id": "h-04", "name": "%%fixture4Name%%", "frequency": "weekly", "active": true, "completions": ["2026-03-01", "2026-02-22"] },
        { "id": "h-06", "name": "%%fixture6Name%%", "frequency": "daily", "active": true, "completions": [] }
      ]
    }
    ```

    5. `src/seed.ts`: `SEED` (`'none'` / `'legacy-v0'` / `'corrupt'`) і `applySeed`; `App.tsx` у `__DEV__` спершу записує знімок; у commit — `'none'`. Тести — `tests/snapshot.test.js` у `run-tests.js`.
    6. `EVIDENCE.md`, розділ «RN-05»; `git commit -m "Persist records on the device with a versioned snapshot, migration and recovery"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — жодного рядка; `npm test` — 43 тестів, «не пройшли: 0».
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі: «%%markTodayLabel%%», повне закриття застосунку й новий запуск — зміна на місці.
    - На цілі: `SEED = 'legacy-v0'`, `r` — три звички; у деталях «%%fixture1Name%%» — «%%completionsLabel%%: 3» замість чотирьох дат із повтором.
    - На цілі: `SEED = 'corrupt'`, `r` — стартовий список і «%%loadErrorMessage%%», застосунок не падає; після ще одного `r` з `SEED = 'none'` повідомлення немає.

    **Доказ:** commit і `EVIDENCE.md` — рядки команд і те, що ти бачив на цілі (перезапуск, міграція, відновлення), або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися. Без цілі натисни на цій сторінці «У мене немає емулятора чи пристрою», а не «Цей крок виконано».
  en: |
    Save the habits on the device in a versioned snapshot: they survive a restart, the supplied v0 snapshot migrates, and a damaged one goes under a backup key with a notice. The platform does not check this step.

    1. `npx expo install @react-native-async-storage/async-storage`; `src/nativeStorage.ts` — `nativeStorage` with the three methods of `AsyncStorage`; in `App.tsx` — `createRepository(nativeStorage, …)`.
    2. `src/snapshot.ts`: `CURRENT_VERSION = 1`, `BACKUP_KEY = "jsll.habits.v1.backup"`, `migrate` (a `steps` map, in step `0` the `completions` go through `uniqueSortedDays` of the domain), `restoreSnapshot` (`JSON.parse` → `migrate` → `parseHabitList`), `loadSnapshot` (a migrated one is saved at once; one that cannot be restored is first copied under `BACKUP_KEY`).
    3. The repository: `readAll()` → `{ records, recovered }`, after a recovery it saves the starting list. The list shows “%%loadErrorMessage%%”; when the storage did not answer — “%%listLoadFailedMessage%%” and “%%retryLoadLabel%%”.
    4. The supplied snapshot — create the file `data/legacy-v0.json` with exactly this content:

    ```json
    {
      "schemaVersion": 0,
      "records": [
        { "id": "h-01", "name": "%%fixture1Name%%", "frequency": "daily", "active": true, "completions": ["2026-03-01", "2026-02-27", "2026-03-01", "2026-02-28"] },
        { "id": "h-04", "name": "%%fixture4Name%%", "frequency": "weekly", "active": true, "completions": ["2026-03-01", "2026-02-22"] },
        { "id": "h-06", "name": "%%fixture6Name%%", "frequency": "daily", "active": true, "completions": [] }
      ]
    }
    ```

    5. `src/seed.ts`: `SEED` (`'none'` / `'legacy-v0'` / `'corrupt'`) and `applySeed`; in `__DEV__`, `App.tsx` writes the snapshot first; in the commit — `'none'`. The tests — `tests/snapshot.test.js` in `run-tests.js`.
    6. `EVIDENCE.md`, a section “RN-05”; `git commit -m "Persist records on the device with a versioned snapshot, migration and recovery"`.

    **Self-check — confirm every item yourself:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — not a single line; `npm test` — 43 tests, “failed: 0”.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target: “%%markTodayLabel%%”, a complete close of the app and a new start — the change is there.
    - On the target: `SEED = 'legacy-v0'`, `r` — three habits; the details of “%%fixture1Name%%” show “%%completionsLabel%%: 3” instead of four dates with a repeat.
    - On the target: `SEED = 'corrupt'`, `r` — the starting list and “%%loadErrorMessage%%”, the app does not crash; after one more `r` with `SEED = 'none'` there is no notice.

    **Evidence:** the commit and `EVIDENCE.md` — the command lines and what you saw on the target (restart, migration, recovery), or a “not performed” record: what, on which target, why, what it takes to come back. Without a target, press “I have no emulator or device” on this page, not “I have done this step”.
