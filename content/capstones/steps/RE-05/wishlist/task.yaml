# Wishlist variant of step RE-05 (a local step: done in the learner's editor, terminal and browser, no
# platform checks). Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2,
# Chrome) on the scratch project of this capstone after RE-04.
strings:
  notFoundTitle: { uk: "Такого бажання немає", en: "There is no such wish" }
  backToListLabel: { uk: "← До списку", en: "← To the list" }
  editTitle: { uk: "Редагування бажання", en: "Editing a wish" }
  unsavedQuestion: { uk: "Є незбережені зміни. Піти без збереження?", en: "There are unsaved changes. Leave without saving?" }
  stayLabel: { uk: "Лишитися", en: "Stay" }
  leaveLabel: { uk: "Піти без збереження", en: "Leave without saving" }
  wantedMark: { uk: "ще бажане", en: "still wanted" }
  screenErrorMessage: { uk: "Цей екран не вдалося показати.", en: "This screen could not be shown." }
  tryAgainLabel: { uk: "Спробувати ще раз", en: "Try again" }
instructions:
  uk: |
    Додай до `~/js-course/wishlist` маршрути `#/items`, `#/items/:id` і `#/items/:id/edit`, стани завантаження й охорону незбережених змін. `domain/` і `storage/` не змінюються. Платформа цей крок не перевіряє; доказ — перевірка в браузері й commit.

    1. `ui/router.tsx` — маршрутизатор курсу з типами й `createHashHistory("/items")` (історія вкладки після `#`; «Назад» браузера не охороняється).
    2. `useItems()` повертає `{ items, load, dispatch, retry }`: без збережених записів ефект завантажує `data/wishes.json` з `AbortController`, action `loaded` замінює список, помилка дає `failed` з текстом, запис у сховище — лише в стані `ready`; контекст для екранів. `main.tsx` лише рендерить `<App />` у `StrictMode`.
    3. `App`: макет `/items` (заголовок, `<p role="status">` зі станом, «%%retryLoadLabel%%», `ScreenBoundary key={path}` навколо `Outlet`) з екранами `ItemsScreen`, `ItemDetail`, `ItemEdit`, а `"*"` — `NotFound` («%%notFoundTitle%%»).
    4. Кожен екран — `useHeadingFocus(назва)`: `document.title` і фокус на заголовку після переходу. Назва картки — `Link` на запис, «%%editLabel%%» — `Link` на форму.
    5. Збереження — `navigate(page, { replace: true, skipGuard: true })`, «%%cancelEditLabel%%» — `navigate(page, { replace: true })`.
    6. Форма: помилки назви й ціни — з `aria-invalid` і `aria-describedby`, фокус на першому полі з помилкою після невдалого збереження; `useBlocker(isDirty)` з питанням «%%unsavedQuestion%%» («%%stayLabel%%» / «%%leaveLabel%%») і `beforeunload`, поки є зміни.
    7. `npm run typecheck` і `npm run lint` — без зауважень; `npm test` — 33 тести і `не пройшли: 0`.
    8. `npm start`: переходи без перезавантаження з фокусом на заголовку; помилки форми чути; питання перед виходом; після збереження «Назад» не повертає в форму; `#/items/x-99` — «%%notFoundTitle%%»; перезавантаження на `#/items/w-01` показує запис; без `data/wishes.json` і з порожнім сховищем — помилка й «%%retryLoadLabel%%».
    9. `git add -A`, `git commit -m "Add list, detail and edit routes"`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.
  en: |
    Add the routes `#/items`, `#/items/:id` and `#/items/:id/edit`, loading states and an unsaved-changes guard to `~/js-course/wishlist`. `domain/` and `storage/` do not change. The platform does not check this step; the evidence is the check in the browser and the commit.

    1. `ui/router.tsx` — the course router with types and `createHashHistory("/items")` (the tab's history after `#`; the browser's Back is not guarded).
    2. `useItems()` returns `{ items, load, dispatch, retry }`: without saved records an effect loads `data/wishes.json` with an `AbortController`, the `loaded` action replaces the list, an error gives `failed` with a text, the storage write happens only in the `ready` state; a context for the screens. `main.tsx` only renders `<App />` in `StrictMode`.
    3. `App`: the `/items` layout (the heading, a `<p role="status">` with the state, “%%retryLoadLabel%%”, `ScreenBoundary key={path}` around `Outlet`) with the screens `ItemsScreen`, `ItemDetail`, `ItemEdit`, and `"*"` — `NotFound` (“%%notFoundTitle%%”).
    4. Every screen calls `useHeadingFocus(title)`: `document.title` and focus on the heading after a navigation. A card's name is a `Link` to the record, “%%editLabel%%” a `Link` to the form.
    5. Saving — `navigate(page, { replace: true, skipGuard: true })`, “%%cancelEditLabel%%” — `navigate(page, { replace: true })`.
    6. The form: name and price errors with `aria-invalid` and `aria-describedby`, focus on the first invalid field after a failed save; `useBlocker(isDirty)` with the question “%%unsavedQuestion%%” (“%%stayLabel%%” / “%%leaveLabel%%”) and `beforeunload` while there are edits.
    7. `npm run typecheck` and `npm run lint` — no findings; `npm test` — 33 tests and `failed: 0`.
    8. `npm start`: navigation without a reload with focus on the heading; form errors are heard; a question before leaving; after a save “Back” does not return into the form; `#/items/x-99` — “%%notFoundTitle%%”; a reload at `#/items/w-01` shows the record; without `data/wishes.json` and with an empty storage — the error and “%%retryLoadLabel%%”.
    9. `git add -A`, `git commit -m "Add list, detail and edit routes"`; `git diff HEAD~1 --stat -- domain storage` prints nothing.
