# Capstone step of unit RE-05 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson re-05-10-capstone-routes from this file.
# A local step: done in the learner's editor, terminal and browser; no platform checks. The project page
# shows only the intro of a local step, so the intro carries the whole procedure.
# Every command was run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome) in a scratch home on
# all four projects, continuing the RE-04 scratch projects. The browser checks drove Chrome through every
# route, read document.activeElement and location.hash, dispatched a cancelable beforeunload event, and
# answered data/<records>.json with 404 and with an 800 ms delay through request interception. The
# troubleshooting rows were reproduced on a copy of the wishlist project.
# ui/router.tsx is the course router of lessons re-05-01…09 (router.jsx), typed, with the in-memory
# history replaced by the tab's history behind "#", because serve.mjs is a static server.
# reference/ holds the same file set as RE-01 (export- and npm-generated files excluded).
unit: RE-05
mode: local
entry: index.html
title:
  uk: "Маршрути та стани"
  en: "Routes and states"
intro:
  uk: |
    Досі весь проєкт — одна сторінка. Тепер у нього три [[route|маршрути]]: список, один запис і форма редагування, а також екран «не знайдено». Переходи між ними — [[client-side-routing|без перезавантаження сторінки]], Back і Forward браузера працюють, а адресу запису можна перезавантажити чи надіслати. Дані з хука розділу про reducer отримують чесні стани: завантаження, порожній список і помилка з повторною спробою. Форма показує помилки так, що їх чує й скрінрідер, а вихід із незбереженими змінами спершу питає. `domain/` і `storage/` не змінюються.

    **Маршрутизатор.** Візьми маршрутизатор курсу з уроків цього розділу (`router.jsx`: `Router`, `Routes`, `Link`, `useNavigate`, `useParams`, `Outlet`, `useBlocker`) і поклади його в `ui/router.tsx` з типами. Одна зміна: у пісочниці стек історії жив у пам’яті, а тут це історія вкладки. Шлях лежить в адресі після `#` (`http://127.0.0.1:4310/#/items/w-02`): `serve.mjs` — статичний сервер, і адресу `/items/w-02` без `#` після перезавантаження він не знайшов би. `createHashHistory("/items")` замість `createMemoryHistory`: `push` і `replace` — це `history.pushState` / `history.replaceState` з `"#" + path`, а Back і Forward браузера приходять подією `popstate`, яку `subscribe` слухає, поки є підписник (і знімає, коли його немає). Як і в уроках, маршрутизатор охороняє переходи **в застосунку**; кнопка «Назад» самого браузера не охороняється — `popstate` приходить, коли адреса вже змінилась.

    | Проєкт | Маршрути (`#/…`) | Екрани в `ui/` | Помилки форми, які озвучуються |
    |---|---|---|---|
    | Список бажань | `/items`, `/items/:id`, `/items/:id/edit` | `ItemsScreen`, `ItemDetail`, `ItemEdit`, `NotFound` | назва, ціна (наприклад `12.5` — не ціле) |
    | Планувальник | `/tasks`, `/tasks/:id`, `/tasks/:id/edit` | `TasksScreen`, `TaskDetail`, `TaskEdit`, `NotFound` | назва (поле терміну типу `date` не дає ввести неправильну дату) |
    | Трекер звичок | `/habits`, `/habits/:id`, `/habits/:id/edit` | `HabitsScreen`, `HabitDetail` (дати виконання або порожній стан «Виконань ще немає…»), `HabitEdit`, `NotFound` | назва (частоту вибирають зі списку) |
    | Трекер витрат | `/expenses`, `/expenses/:id`, `/expenses/:id/edit` | `ExpensesScreen`, `ExpenseDetail`, `ExpenseEdit`, `NotFound` | назва, сума (наприклад `12,345`), дата, категорія |

    Нижче — «Список бажань»; для свого проєкту підстав назви з таблиці. Перевірено на macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2, Chrome) на всіх чотирьох проєктах.

    **1. Стан на початку.** `cd ~/js-course/wishlist`, `git status` — чисто, `git log --oneline -1` — commit кроку про reducer.

    **2. Стани завантаження в хуку.** `main.tsx` більше не чекає початкових записів: він лише рендерить `<StrictMode><App /></StrictMode>`. `useItems()` повертає `{ items, load, dispatch, retry }`, де `load` — `{ kind: "loading" }`, `{ kind: "ready" }` або `{ kind: "failed"; message: string }`. Є збережені бажання — `ready` одразу. Немає — `loading`, і ефект із залежністю `[load.kind]` викликає `loadFixtures(controller.signal)`: успіх — `dispatch({ type: "loaded", items })` (новий action, який замінює список) і `ready`; помилка — `failed` з текстом зі старої сторінки (код відповіді, немає з’єднання чи пошкоджений файл); cleanup — `controller.abort()`, і скасування — не помилка. Ефект запису пише список лише в стані `ready`, щоб порожній список під час завантаження не затер збереженого. `retry` повертає `loading`. Хук віддає все це через контекст `ItemsContext` і `useItemsData()`.

    **3. Маршрути в `App`.** `const [history] = useState(() => createHashHistory("/items"));` і таблиця маршрутів: макет `/items` з дочірніми `""`, `":id"`, `":id/edit"`, а `"*"` — `NotFound`. Макет `ItemsLayout` показує заголовок проєкту, рядок `<p role="status">` зі станом завантаження (або текстом помилки), кнопку «Завантажити ще раз» після помилки, а екрани — лише в стані `ready`. `Outlet` обгорни в [[error-boundary|межу помилок]] `ScreenBoundary` (класовий компонент, як в уроці) з `key={path}`: якщо екран упаде під час рендеру, лишиться заголовок і повідомлення з кнопкою «Спробувати ще раз».

    **4. Екрани.** Кожен викликає `useHeadingFocus(назва)`: ефект пише `document.title`, а після переходу (не під час першого завантаження) переводить фокус на заголовок екрана з `tabIndex={-1}`.

    - `ItemsScreen` — колишня сторінка: форма нового бажання, зведення, фільтр (тепер — стан цього екрана) і картки з фокусом після видалення. На картці назва — `<Link to={"/items/" + item.id}>`, а «Редагувати» — `Link` на `/items/:id/edit`.
    - `ItemDetail` читає `const { id } = useParams();` — це лише текст: запис шукають у списку, і невідомий `id` показує `NotFound`.
    - `ItemEdit` показує форму з `key={item.id}`. «Зберегти» відправляє `updated` і переходить `navigate(page, { replace: true, skipGuard: true })`: `replace` замінює запис історії форми, тож «Назад» ніколи не повертає в уже збережену форму, а `skipGuard` — бо збережене не треба охороняти. «Скасувати редагування» — `navigate(page, { replace: true })`, з охороною.
    - `NotFound` — заголовок «Такого бажання немає» і посилання «← До списку».

    **5. Форма.** Помилки: `aria-invalid`, а `aria-describedby` з `id` повідомлення — лише коли повідомлення є, щоб опис не вказував у порожнечу. Після невдалого «Зберегти» фокус іде на перше поле з помилкою — ефектом із залежністю `failedSubmits` (лічильник невдалих спроб), бо поле з’являється з повідомленням лише після commit. Незбережені зміни: `isDirty` — чернетка відрізняється від тієї, з якої форма почала; `useBlocker(isDirty)` затримує перехід, і форма показує `role="alertdialog"` з питанням і кнопками «Лишитися» (отримує фокус) та «Піти без збереження»; слухач `beforeunload` (`event.preventDefault()`) живе в ефекті з залежністю `[isDirty]` лише поки є зміни.

    **6. Перевірка інструментами.** `npm run typecheck` і `npm run lint` — лише рядки заголовка; `npm run build` — `⚡ Done in 41ms`; `npm test` — `Пройшли: 33 · не пройшли: 0` (без змін).

    **7. Перевірка в браузері** (`npm start`). Ми перевіряли з порожнім сховищем:

    - `http://127.0.0.1:4310/` стає `…/#/items`; клік на «Навушники» — `#/items/w-01`, сторінка не перезавантажується, фокус на заголовку «Навушники»;
    - «Редагувати» — `#/items/w-01/edit`, фокус на «Редагування бажання»; порожня назва й «Зберегти» — фокус на полі назви, яке описує текст `Вкажи назву бажання`; ціна `12.5` — фокус на ціні й `Ціна — ціле число гривень, без копійок`;
    - змінена назва й «Скасувати редагування» — питання з фокусом на «Лишитися»; «Лишитися» — чернетка на місці; «Піти без збереження» — сторінка бажання без змін;
    - ціна 90 і «Зберегти» — сторінка бажання показує 90; три «Назад» браузера — `#/items/w-01`, `#/items/w-01`, `#/items`, і жодного разу в форму;
    - `#/items/w-99` і `#/nowhere` — «Такого бажання немає»; перезавантаження на `#/items/w-01` показує це бажання;
    - стани: перейменуй `data/wishes.json`, очисти сховище (`localStorage.clear()`) і перезавантаж — `Початкові бажання не завантажилися. Код відповіді: 404` і кнопка «Завантажити ще раз»; поверни назву й натисни кнопку — шість карток (з повільною мережею в DevTools видно `Завантажую початкові бажання…`); порожній список — видали всі картки — «Бажань поки немає…»;
    - у Console немає червоних повідомлень, крім `404` для `data/wishes.json`, поки файл перейменовано.

    **8. Commit.** `git status --short` — ` M` для `main.tsx`, `ui/App.tsx`, `ui/ItemCard.tsx`, `ui/ItemForm.tsx`, `ui/ItemList.tsx`, `ui/itemsReducer.ts`, `ui/useItems.ts` і `??` для `ui/ItemDetail.tsx`, `ui/ItemEdit.tsx`, `ui/ItemsScreen.tsx`, `ui/NotFound.tsx`, `ui/ScreenBoundary.tsx`, `ui/focus.ts`, `ui/router.tsx`. `git add -A`, `git commit -m "Add list, detail and edit routes"` — `[main 714dd53] Add list, detail and edit routes` і `14 files changed, 676 insertions(+), 145 deletions(-)`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.

    **Самоперевірка:** кожен пункт кроку 7 справджується; переходи всередині застосунку — лише `Link` і `navigate`; `npm run typecheck`, `npm run lint` — без зауважень, `npm test` — `не пройшли: 0`.

    **Якщо щось пішло не так** (усе відтворено на «Списку бажань»):

    - Після «Зберегти» «Назад» браузера повертає в форму (`#/items/w-01/edit`) — збереження переходить без `replace: true`.
    - Після «Зберегти» з’являється питання про незбережені зміни — у переході після збереження немає `skipGuard: true`: охорона ще стоїть, бо ефект `useBlocker` знімає її лише після наступного commit.
    - Клік на назву картки під час набору нового бажання не питає нічого — на картці звичайний `<a href="#/items/w-01">` замість `Link`: перехід через адресу оминає охорону маршрутизатора.
    - На `#/items/w-99` замість «Такого бажання немає» — `Цей екран не вдалося показати. (Cannot read properties of undefined (reading 'name'))` — `id` з адреси вважається записом: бракує перевірки `item === undefined`. Без межі помилок сторінка була б зовсім порожня.

    Еталон кроку — `Завантажити: RE-05 — Маршрути та стани` у розділі «Еталони для завантаження» після експорту. Команди виконано лише на macOS; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    So far the whole project is one page. Now it gets three [[route|routes]]: the list, one record and the edit form, plus a not-found screen. Moving between them happens [[client-side-routing|without a page reload]], the browser's Back and Forward work, and a record's address can be reloaded or sent. The data of the reducer step's hook gets honest states: loading, an empty list and an error with a retry. The form shows its errors so that a screen reader hears them too, and leaving with unsaved edits asks first. `domain/` and `storage/` do not change.

    **The router.** Take the course router from this unit's lessons (`router.jsx`: `Router`, `Routes`, `Link`, `useNavigate`, `useParams`, `Outlet`, `useBlocker`) and put it into `ui/router.tsx` with types. One change: in the sandbox the history stack lived in memory, and here it is the tab's history. The path lives in the address after `#` (`http://127.0.0.1:4310/#/items/w-02`): `serve.mjs` is a static server, and it would not find the address `/items/w-02` without `#` after a reload. `createHashHistory("/items")` instead of `createMemoryHistory`: `push` and `replace` are `history.pushState` / `history.replaceState` with `"#" + path`, and the browser's Back and Forward arrive as the `popstate` event, which `subscribe` listens to while there is a subscriber (and removes when there is none). As in the lessons, the router guards navigations **inside the app**; the browser's own Back button is not guarded — `popstate` arrives when the address has already changed.

    | Project | Routes (`#/…`) | Screens in `ui/` | Form errors that are announced |
    |---|---|---|---|
    | Wishlist | `/items`, `/items/:id`, `/items/:id/edit` | `ItemsScreen`, `ItemDetail`, `ItemEdit`, `NotFound` | name, price (for example `12.5` — not whole) |
    | Planner | `/tasks`, `/tasks/:id`, `/tasks/:id/edit` | `TasksScreen`, `TaskDetail`, `TaskEdit`, `NotFound` | title (the `date` field of the due date lets no wrong date in) |
    | Habit tracker | `/habits`, `/habits/:id`, `/habits/:id/edit` | `HabitsScreen`, `HabitDetail` (the completion days or the empty state “No completions yet…”), `HabitEdit`, `NotFound` | name (the frequency is picked from a list) |
    | Expense tracker | `/expenses`, `/expenses/:id`, `/expenses/:id/edit` | `ExpensesScreen`, `ExpenseDetail`, `ExpenseEdit`, `NotFound` | label, amount (for example `12.345`), date, category |

    Below is the wishlist; for your project use the names from the table. Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2, Chrome) on all four projects.

    **1. The starting state.** `cd ~/js-course/wishlist`, `git status` — clean, `git log --oneline -1` — the commit of the reducer step.

    **2. Loading states in the hook.** `main.tsx` no longer waits for the starting records: it only renders `<StrictMode><App /></StrictMode>`. `useItems()` returns `{ items, load, dispatch, retry }`, where `load` is `{ kind: "loading" }`, `{ kind: "ready" }` or `{ kind: "failed"; message: string }`. With saved wishes — `ready` at once. Without them — `loading`, and an effect with the dependency `[load.kind]` calls `loadFixtures(controller.signal)`: success — `dispatch({ type: "loaded", items })` (a new action that replaces the list) and `ready`; an error — `failed` with the text of the old page (the response status, no connection or a damaged file); the cleanup — `controller.abort()`, and an abort is not an error. The write effect writes the list only in the `ready` state, so the empty list of a load in progress never overwrites the saved one. `retry` goes back to `loading`. The hook hands all of it out through the context `ItemsContext` and `useItemsData()`.

    **3. Routes in `App`.** `const [history] = useState(() => createHashHistory("/items"));` and the route table: the `/items` layout with the children `""`, `":id"`, `":id/edit"`, and `"*"` — `NotFound`. The `ItemsLayout` layout shows the project heading, a `<p role="status">` line with the loading state (or the error text), a “Load again” button after an error, and the screens only in the `ready` state. Wrap `Outlet` in an [[error-boundary]] `ScreenBoundary` (a class component, as in the lesson) with `key={path}`: if a screen fails while rendering, the heading stays, with a message and a “Try again” button.

    **4. Screens.** Each one calls `useHeadingFocus(title)`: an effect writes `document.title`, and after a navigation (not on the first load) moves focus to the screen's heading with `tabIndex={-1}`.

    - `ItemsScreen` is the former page: the form for a new wish, the summary, the filter (now this screen's state) and the cards with focus after a delete. On a card the name is a `<Link to={"/items/" + item.id}>`, and “Edit” is a `Link` to `/items/:id/edit`.
    - `ItemDetail` reads `const { id } = useParams();` — that is only text: the record is looked up in the list, and an unknown `id` shows `NotFound`.
    - `ItemEdit` shows the form with `key={item.id}`. “Save” sends `updated` and navigates with `navigate(page, { replace: true, skipGuard: true })`: `replace` replaces the form's history entry, so “Back” never returns into a form that is already saved, and `skipGuard` because a saved draft needs no guard. “Cancel editing” is `navigate(page, { replace: true })`, guarded.
    - `NotFound` is the heading “There is no such wish” and a “← To the list” link.

    **5. The form.** Errors: `aria-invalid`, and `aria-describedby` with the message's `id` — only while there is a message, so the description never points at nothing. After a failed “Save” focus goes to the first field with an error — through an effect with the dependency `failedSubmits` (a counter of failed attempts), because the field gets its message only after the commit. Unsaved edits: `isDirty` — the draft differs from the one the form started with; `useBlocker(isDirty)` holds a navigation back, and the form shows a `role="alertdialog"` with the question and the buttons “Stay” (it gets focus) and “Leave without saving”; the `beforeunload` listener (`event.preventDefault()`) lives in an effect with the dependency `[isDirty]` only while there are edits.

    **6. Check with the tools.** `npm run typecheck` and `npm run lint` — only the header lines; `npm run build` — `⚡ Done in 45ms`; `npm test` — `Passed: 33 · failed: 0` (unchanged).

    **7. Check in the browser** (`npm start`). We checked with an empty storage (the names below are those of an English project; we ran the checks in a Ukrainian one):

    - `http://127.0.0.1:4310/` becomes `…/#/items`; a click on “Headphones” — `#/items/w-01`, the page does not reload, focus is on the heading “Headphones”;
    - “Edit” — `#/items/w-01/edit`, focus on “Editing a wish”; an empty name and “Save” — focus on the name field, which is described by the text `Enter a name for the wish`; the price `12.5` — focus on the price and `The price is a whole number of hryvnias, no kopiykas`;
    - a changed name and “Cancel editing” — the question with focus on “Stay”; “Stay” — the draft is still there; “Leave without saving” — the wish's page, unchanged;
    - the price 90 and “Save” — the wish's page shows 90; three browser “Back”s — `#/items/w-01`, `#/items/w-01`, `#/items`, and never into the form;
    - `#/items/w-99` and `#/nowhere` — “There is no such wish”; a reload at `#/items/w-01` shows that wish;
    - states: rename `data/wishes.json`, clear the storage (`localStorage.clear()`) and reload — `The starting wishes did not load. Response status: 404` and a “Load again” button; give the file its name back and press the button — six cards (with a slow network in DevTools you see `Loading the starting wishes…`); an empty list — delete every card — “There are no wishes yet…”;
    - the Console has no red messages except a `404` for `data/wishes.json` while the file is renamed.

    **8. Commit.** `git status --short` — ` M` for `main.tsx`, `ui/App.tsx`, `ui/ItemCard.tsx`, `ui/ItemForm.tsx`, `ui/ItemList.tsx`, `ui/itemsReducer.ts`, `ui/useItems.ts` and `??` for `ui/ItemDetail.tsx`, `ui/ItemEdit.tsx`, `ui/ItemsScreen.tsx`, `ui/NotFound.tsx`, `ui/ScreenBoundary.tsx`, `ui/focus.ts`, `ui/router.tsx`. `git add -A`, `git commit -m "Add list, detail and edit routes"` — `[main 2be78e6] Add list, detail and edit routes` and `14 files changed, 676 insertions(+), 145 deletions(-)`; `git diff HEAD~1 --stat -- domain storage` prints nothing.

    **Self-check:** every item of step 7 holds; navigation inside the app is only `Link` and `navigate`; `npm run typecheck`, `npm run lint` — no findings, `npm test` — `failed: 0`.

    **If something goes wrong** (all reproduced on the wishlist):

    - After “Save” the browser's “Back” returns into the form (`#/items/w-01/edit`) — the save navigates without `replace: true`.
    - After “Save” the unsaved-changes question appears — the navigation after saving has no `skipGuard: true`: the guard is still up, because the `useBlocker` effect removes it only after the next commit.
    - A click on a card's name while typing a new wish asks nothing — the card has a plain `<a href="#/items/w-01">` instead of `Link`: a navigation through the address bypasses the router's guard.
    - At `#/items/w-99`, instead of “There is no such wish”: `This screen could not be shown. (Cannot read properties of undefined (reading 'name'))` — the `id` from the address is treated as a record: the `item === undefined` check is missing. Without the error boundary the page would be completely empty.

    The step's reference is `Download: RE-05 — Routes and states` in the “References to download” section after the export. The commands were run on macOS only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це крок твого проєкту: маршрути з параметрами, історію, доступну валідацію, фокус після переходу, охорону незбережених змін і стани завантаження з цього розділу ти застосовуєш до власного застосунку. Платформа цей крок не перевіряє: доказ — перевірка з клавіатури й у браузері та commit."
  en: "This is a step of your project: you apply this unit's routes with params, history, accessible validation, focus after a navigation, the unsaved-changes guard and the loading states to your own app. The platform does not check this step: the evidence is the keyboard and browser check and the commit."
objectives:
  - uk: "Додати маршрути списку, запису й редагування на маршрутизаторі курсу з історією вкладки, з екраном «не знайдено» й правильною поведінкою «Назад» після збереження."
    en: "Add list, record and edit routes on the course router with the tab's history, with a not-found screen and correct Back behavior after saving."
  - uk: "Показувати помилки форми доступно (`aria-invalid`, `aria-describedby`, фокус на першому полі з помилкою) і питати перед виходом із незбереженими змінами — у застосунку й через `beforeunload`."
    en: "Show form errors accessibly (`aria-invalid`, `aria-describedby`, focus on the first invalid field) and ask before leaving unsaved edits — in the app and through `beforeunload`."
  - uk: "Показувати стани завантаження, порожнього списку й помилки з повторною спробою та перевірити кожен у браузері."
    en: "Show loading, empty and error states with a retry and check each of them in the browser."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й браузері на твоєму комп’ютері: що змінити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and a browser on your computer: what to change, the expected output and the self-check list are above and on the step's page in your project."
