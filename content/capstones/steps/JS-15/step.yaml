# Capstone step of unit JS-15 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-15-15-capstone-local-home from this file.
# A local step: it is done in the learner's terminal and has no platform checks. The project page
# shows only the intro of a local step, so the intro carries the whole procedure for all four projects.
# Commands and outputs below were run on macOS (zsh/bash, Git 2.51.0, Node.js 25.2.1) in a scratch home.
unit: JS-15
mode: local
entry: index.html
title:
  uk: "Локальний дім проєкту"
  en: "The project's local home"
intro:
  uk: |
    Файли твого проєкту поки що живуть на платформі. У розділі про експорт ти перенесеш їх на свій комп’ютер — і вже зараз можна приготувати для них місце: теку `~/js-course/<проєкт>` із Git-репозиторієм на гілці `main` і першим commit, у якому лежить [[readme|README]] з описом проєкту. Цей крок виконується в терміналі; платформа його не перевіряє, доказом є вивід `git log --oneline`.

    | Проєкт | Тека | Перший рядок README | Поля запису в README |
    |---|---|---|---|
    | Список бажань | `wishlist` | `# Список бажань` | name, price, acquired, category |
    | Планувальник | `planner` | `# Планувальник` | title, dueDate, done, priority |
    | Трекер звичок | `habits` | `# Трекер звичок` | name, frequency, active, completions |
    | Трекер витрат | `expenses` | `# Трекер витрат` | label, amountMinor, date, category — і примітка, що суми зберігаються в цілих копійках |

    Команди нижче написано для «Списку бажань»; для свого проєкту підстав його теку й текст README з таблиці. Їх виконано на macOS (Git 2.51.0, Node.js 25.2.1). У Linux команди ті самі, а шлях у виводі починається з `/home/…`. У Windows виконуй їх у Git Bash, а не в PowerShell: там `mkdir -p` і `printf` поводяться інакше. Вивід для Linux і Windows ми не записували, тож він може трохи відрізнятися.

    1. Перевір інструменти: `node --version` має показати 22.13 або новішу версію, `git --version` — 2.28 або новішу (`git init -b` з’явився саме в 2.28). `git config --global user.name` має надрукувати твоє ім’я; якщо він нічого не друкує, спершу виконай налаштування з уроку про перший commit.
    2. Створи теку й репозиторій:

       ```sh
       mkdir -p ~/js-course
       cd ~/js-course
       mkdir wishlist
       cd wishlist
       git init -b main
       ```

       Очікуваний вивід: `Initialized empty Git repository in /Users/you/js-course/wishlist/.git/` (з твоїм шляхом). `mkdir -p` не скаржиться, якщо `js-course` уже є з розділу про термінал.
    3. Опиши проєкт у `README.md` і зафіксуй його. `printf` записує текст у файл, а `\n` — це перенесення рядка:

       ```sh
       printf '# Список бажань\n\nПоля бажання: name, price, acquired, category.\n' > README.md
       git add README.md
       git commit -m "Describe the project in a README"
       ```

       Очікуваний вивід: `[main (root-commit) a3f417e] Describe the project in a README`, потім `1 file changed, 3 insertions(+)` і `create mode 100644 README.md` (номер commit у тебе інший).
    4. Збережи доказ: `git log --oneline` показує один рядок `a3f417e Describe the project in a README`, а `git status` — `On branch main` і `nothing to commit, working tree clean`.

    Якщо щось пішло не так:

    - `mkdir: wishlist: File exists` — тека вже є. Нічого не видаляй: перейди в неї (`cd wishlist`) і виконай `git log --oneline`. Якщо там уже є commit із README, крок виконано.
    - `fatal: not a git repository (or any of the parent directories): .git` — ти в теці без `git init`: перевір `pwd` і перейди в `~/js-course/wishlist`.
    - Git просить сказати, хто ти, — виконай налаштування імені й пошти з уроку про перший commit і повтори `git commit`.

    Більше нічого в теку не клади: у розділі про експорт файли з платформи ляжуть поруч із цим README, а в уроці про відкриття експорту ти побачиш, що цю теку можна не створювати вдруге.
  en: |
    Your project's files still live on the platform. In the export unit you will move them to your computer — and you can prepare a place for them now: the folder `~/js-course/<project>` with a Git repository on the branch `main` and a first commit that holds a [[readme|README]] describing the project. This step is done in a terminal; the platform does not check it, and the output of `git log --oneline` is the evidence.

    | Project | Folder | First line of the README | Record fields in the README |
    |---|---|---|---|
    | Wishlist | `wishlist` | `# Wishlist` | name, price, acquired, category |
    | Planner | `planner` | `# Planner` | title, dueDate, done, priority |
    | Habit tracker | `habits` | `# Habit tracker` | name, frequency, active, completions |
    | Expense tracker | `expenses` | `# Expense tracker` | label, amountMinor, date, category — and a note that amounts are stored as whole minor units (kopiykas) |

    The commands below are written for the wishlist; for your project use its folder and the README text from the table. They were run on macOS (Git 2.51.0, Node.js 25.2.1). On Linux the commands are the same, and the path in the output starts with `/home/…`. On Windows run them in Git Bash, not in PowerShell: there `mkdir -p` and `printf` behave differently. We did not record the output on Linux and Windows, so it may differ a little.

    1. Check the tools: `node --version` must show 22.13 or newer, `git --version` 2.28 or newer (`git init -b` arrived in 2.28). `git config --global user.name` must print your name; if it prints nothing, first do the setup from the lesson on the first commit.
    2. Create the folder and the repository:

       ```sh
       mkdir -p ~/js-course
       cd ~/js-course
       mkdir wishlist
       cd wishlist
       git init -b main
       ```

       Expected output: `Initialized empty Git repository in /Users/you/js-course/wishlist/.git/` (with your own path). `mkdir -p` does not complain if `js-course` already exists from the terminal unit.
    3. Describe the project in `README.md` and commit it. `printf` writes the text into the file, and `\n` is a line break:

       ```sh
       printf '# Wishlist\n\nA wish has: name, price, acquired, category.\n' > README.md
       git add README.md
       git commit -m "Describe the project in a README"
       ```

       Expected output: `[main (root-commit) c4e6f2a] Describe the project in a README`, then `1 file changed, 3 insertions(+)` and `create mode 100644 README.md` (your commit number differs).
    4. Keep the evidence: `git log --oneline` shows one line `c4e6f2a Describe the project in a README`, and `git status` shows `On branch main` and `nothing to commit, working tree clean`.

    If something goes wrong:

    - `mkdir: wishlist: File exists` — the folder is already there. Delete nothing: go into it (`cd wishlist`) and run `git log --oneline`. If it already has a commit with a README, the step is done.
    - `fatal: not a git repository (or any of the parent directories): .git` — you are in a folder without `git init`: check `pwd` and go to `~/js-course/wishlist`.
    - Git asks who you are — do the name and email setup from the lesson on the first commit and repeat `git commit`.

    Put nothing else into the folder: in the export unit the files from the platform will land next to this README, and the lesson on opening the export will tell you that this folder does not need to be created again.
purpose:
  uk: "Це крок твого проєкту: термінал, шляхи й перший commit із цього розділу ти застосовуєш, щоб приготувати власному застосунку локальну теку з Git-репозиторієм. Платформа цей крок не перевіряє: ти робиш його у своєму терміналі."
  en: "This is a step of your project: you apply this unit's terminal, paths and first commit to prepare a local folder with a Git repository for your own app. The platform does not check this step: you do it in your own terminal."
objectives:
  - uk: "Перевірити версії Node.js і Git та створити теку проєкту `~/js-course/<проєкт>` з Git-репозиторієм на гілці `main`."
    en: "Check the Node.js and Git versions and create the project folder `~/js-course/<project>` with a Git repository on the branch `main`."
  - uk: "Написати README з назвою проєкту й полями його запису, зафіксувати його першим commit і показати `git log --oneline` як доказ."
    en: "Write a README with the project's name and the fields of its record, record it in the first commit and show `git log --oneline` as evidence."
transfer:
  uk: "Цей крок виконується в терміналі на твоєму комп’ютері: команди й очікуваний вивід — вище і на сторінці кроку в проєкті. Файли проєкту лишаються на платформі до розділу про експорт."
  en: "This step is done in a terminal on your computer: the commands and the expected output are above and on the step's page in your project. The project files stay on the platform until the export unit."
