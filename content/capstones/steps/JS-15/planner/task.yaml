# Planner variant of step JS-15 (a local step: done in the learner's terminal, no platform checks).
# Commands and outputs were run on macOS (Git 2.51.0) in a scratch home.
instructions:
  uk: |
    Цей крок виконується в терміналі на твоєму комп’ютері; платформа його не перевіряє. Наприкінці в тебе є тека `~/js-course/planner` з Git-репозиторієм на гілці `main` і одним commit, у якому лежить `README.md`.

    1. Перевір інструменти: `node --version` (22.13 або новіша), `git --version` (2.28 або новіша) і `git config --global user.name` (має надрукувати твоє ім’я; якщо нічого не друкує, виконай налаштування з уроку про перший commit).
    2. Створи теку й репозиторій:

       ```sh
       mkdir -p ~/js-course
       cd ~/js-course
       mkdir planner
       cd planner
       git init -b main
       ```

       Вивід: `Initialized empty Git repository in /Users/you/js-course/planner/.git/` (з твоїм шляхом).
    3. Опиши проєкт у README і зафіксуй його:

       ```sh
       printf '# Планувальник\n\nПоля справи: title, dueDate, done, priority.\n' > README.md
       git add README.md
       git commit -m "Describe the project in a README"
       ```

       Вивід: `[main (root-commit) …] Describe the project in a README` і `1 file changed, 3 insertions(+)`.
    4. Доказ: `git log --oneline` показує один рядок `… Describe the project in a README`, а `git status` — `On branch main` і `nothing to commit, working tree clean`.

    Якщо тека вже є (`mkdir: planner: File exists`), нічого не видаляй: `cd planner` і `git log --oneline`. Якщо там уже є commit із README, крок виконано.
  en: |
    This step is done in a terminal on your computer; the platform does not check it. At the end you have the folder `~/js-course/planner` with a Git repository on the branch `main` and one commit that holds `README.md`.

    1. Check the tools: `node --version` (22.13 or newer), `git --version` (2.28 or newer) and `git config --global user.name` (must print your name; if it prints nothing, do the setup from the lesson on the first commit).
    2. Create the folder and the repository:

       ```sh
       mkdir -p ~/js-course
       cd ~/js-course
       mkdir planner
       cd planner
       git init -b main
       ```

       Output: `Initialized empty Git repository in /Users/you/js-course/planner/.git/` (with your own path).
    3. Describe the project in the README and commit it:

       ```sh
       printf '# Planner\n\nA task has: title, dueDate, done, priority.\n' > README.md
       git add README.md
       git commit -m "Describe the project in a README"
       ```

       Output: `[main (root-commit) …] Describe the project in a README` and `1 file changed, 3 insertions(+)`.
    4. Evidence: `git log --oneline` shows one line `… Describe the project in a README`, and `git status` shows `On branch main` and `nothing to commit, working tree clean`.

    If the folder already exists (`mkdir: planner: File exists`), delete nothing: `cd planner` and `git log --oneline`. If it already has a commit with a README, the step is done.
