# Expense tracker variant of step NO-05 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS on the scratch project of this capstone after NO-04, in a Ukrainian and an English workspace,
# on Node.js 25.2.1 and 22.13.1: npm test (25 tests), the whole procedure of the intro. Wrong variants run against
# npm test, each failed at least one test: the 17 of the wishlist adapted (bad dates or labels quarantined
# instead of stopping the migration, in place of a missing acquired), plus invalid rows dropped instead of
# quarantined and an existing quarantine file overwritten. Not run on Linux or Windows.
instructions:
  uk: |
    Дай серверу надійне сховище: контракт, міграцію 1 → 2, перевірені резервні копії, відновлення на старті й чергу записів. Платформа цей крок не перевіряє.

    1. `src/contract.ts`: `parseStore`, `checkStore`, `checkRecords`, `storeText`, `ContractError` — рівно поля `id`, `label`, `amountMinor`, `date`, `category` (правила — `parseExpense`).
    2. `src/lock.ts` (`createWriteLock`); `src/fileRepository.ts` — читання й запис через контракт, усі зміни в черзі, нові `create(build)` і `update(id, change)`; `src/api.ts` — `POST`, `PUT`, `PATCH` через них, `src/add-expense.ts` — через `create`.
    3. `src/migrate.ts`: `migrate1to2` → `{ store, quarantined }` — запис, у якого **лише** `amountMinor` не додатне ціле чи `category` не зі списку, іде в карантин `data/expenses.quarantine.json` (`{ fromSchemaVersion: 1, records: [{ record, problems }] }`, пишеться до сховища; наявний файл карантину не перезаписується), будь-яка інша проблема зупиняє міграцію; `facts` (кількість, `id`, суми за категоріями), `dryRun` (залишені + у карантині = було); `src/migrate-store.ts` — `"migrate": "node src/migrate-store.ts"`.
    4. `src/backup.ts`: `backupStore`, `verifyBackup`, `recoverStore`, `stampOf`; `src/backup-store.ts` — `"backup": "node src/backup-store.ts"`.
    5. `src/open.ts`: `initStore` замість колишнього `openRepository`; `src/server.ts` (`start()`), `src/summary.ts`, `src/add-expense.ts` — через нього.
    6. `tests/storage.test.ts`; у `src/check-repository.ts` файли для перевірок — версії 2.
    7. Прогін з інтро. Сума `e-05` у старій, неправильній формі і пошкодження (у `server/`):

       ```text
       node -e 'const fs = require("fs"); const f = "data/expenses.json"; const store = JSON.parse(fs.readFileSync(f, "utf8")); const expense = store.records.find((one) => one.id === "e-05"); expense.amountMinor = 12.5; fs.writeFileSync(f, JSON.stringify(store, null, 2) + "\n"); console.log(JSON.stringify(expense));'
       node -e 'const fs = require("fs"); const f = "data/expenses.json"; fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace(/"amountMinor": (\d+)/, "\"amountMinor\": \"$1\""));'
       ```

    8. `docs/server.md`, розділ «NO-05»; `git commit -m "Give the server a durable store: a contract, a tested migration, verified backups and recovery"`.

    **Спробуй зламати (крок «Спробуй зламати» інтро), назви тестів цього проєкту:** прибери перевірку «вже є записи» в `seed` — `✖ the first start seeds six expenses; an expense deleted later does not come back after a restart`; сортуй копії від найстарішої — `✖ a damaged store is moved aside and the newest VERIFIED backup restored; the report names the lost expenses`; перейменуй файл до того, як знайдено копію — `✖ a damaged store without a verified backup refuses the start and stays where it is`; обери `id` до черги — `✖ twenty creates at the same moment get twenty different ids, and all of them are stored`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ tests 25`, `ℹ fail 0`.
    - `npm start` на файлі версії 1 — `Cannot start: … run "npm run migrate" first`; `npm run migrate` — `Quarantined 1 expense in data/expenses.quarantine.json: e-05 (amountMinor: notPositiveWhole)`, у сховищі `e-05` немає, у файлі карантину він такий, яким був; повторний `npm run migrate` — `already schemaVersion 2`.
    - `npm run backup` — `Verified by a restore into a scratch folder: …`, у `data/backups/` — копія й `….manifest.json` із сумами за категоріями.
    - Пошкоджене сховище на старті — `moved aside as … restored … from …` і `Not in the backup: …`; без `data/backups` — `refusing to start`, `exit 1`, файл на місці.
    - `node try-api.mjs` — як у NO-04; `npm run typecheck` — жодного рядка; `npm run check` і `npm run check:server` — усі `✔`.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Give the server a durable store: a contract, a 1 → 2 migration, verified backups, recovery on start and a write queue. The platform does not check this step.

    1. `src/contract.ts`: `parseStore`, `checkStore`, `checkRecords`, `storeText`, `ContractError` — exactly the fields `id`, `label`, `amountMinor`, `date`, `category` (the rules are `parseExpense`).
    2. `src/lock.ts` (`createWriteLock`); `src/fileRepository.ts` — reads and writes through the contract, every change in the queue, the new `create(build)` and `update(id, change)`; `src/api.ts` — `POST`, `PUT`, `PATCH` through them, `src/add-expense.ts` through `create`.
    3. `src/migrate.ts`: `migrate1to2` → `{ store, quarantined }` — a record whose **only** problems are an `amountMinor` that is not a positive whole number or a `category` outside the list goes to the quarantine `data/expenses.quarantine.json` (`{ fromSchemaVersion: 1, records: [{ record, problems }] }`, written before the store; an existing quarantine file is not overwritten), any other problem stops the migration; `facts` (count, `id`s, totals per category), `dryRun` (kept + quarantined = before); `src/migrate-store.ts` — `"migrate": "node src/migrate-store.ts"`.
    4. `src/backup.ts`: `backupStore`, `verifyBackup`, `recoverStore`, `stampOf`; `src/backup-store.ts` — `"backup": "node src/backup-store.ts"`.
    5. `src/open.ts`: `initStore` instead of the former `openRepository`; `src/server.ts` (`start()`), `src/summary.ts`, `src/add-expense.ts` — through it.
    6. `tests/storage.test.ts`; in `src/check-repository.ts` the files of the checks are version 2.
    7. The run of the intro. The amount of `e-05` in an old, wrong form, and the damage (in `server/`):

       ```text
       node -e 'const fs = require("fs"); const f = "data/expenses.json"; const store = JSON.parse(fs.readFileSync(f, "utf8")); const expense = store.records.find((one) => one.id === "e-05"); expense.amountMinor = 12.5; fs.writeFileSync(f, JSON.stringify(store, null, 2) + "\n"); console.log(JSON.stringify(expense));'
       node -e 'const fs = require("fs"); const f = "data/expenses.json"; fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace(/"amountMinor": (\d+)/, "\"amountMinor\": \"$1\""));'
       ```

    8. `docs/server.md`, a section “NO-05”; `git commit -m "Give the server a durable store: a contract, a tested migration, verified backups and recovery"`.

    **Try to break it (the intro's "Try to break it" step), with this project's test names:** remove the "there are records already" check from `seed` — `✖ the first start seeds six expenses; an expense deleted later does not come back after a restart`; sort the backups oldest first — `✖ a damaged store is moved aside and the newest VERIFIED backup restored; the report names the lost expenses`; rename the file before a backup is found — `✖ a damaged store without a verified backup refuses the start and stays where it is`; pick the `id` outside the queue — `✖ twenty creates at the same moment get twenty different ids, and all of them are stored`.

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ tests 25`, `ℹ fail 0`.
    - `npm start` on a version 1 file — `Cannot start: … run "npm run migrate" first`; `npm run migrate` — `Quarantined 1 expense in data/expenses.quarantine.json: e-05 (amountMinor: notPositiveWhole)`, the store has no `e-05`, the quarantine file holds it as it was; a second `npm run migrate` says `already schemaVersion 2`.
    - `npm run backup` — `Verified by a restore into a scratch folder: …`, `data/backups/` holds the copy and `….manifest.json` with the totals per category.
    - A damaged store on start — `moved aside as … restored … from …` and `Not in the backup: …`; without `data/backups` — `refusing to start`, `exit 1`, the file still there.
    - `node try-api.mjs` — as in NO-04; `npm run typecheck` — not a single line; `npm run check` and `npm run check:server` — every check `✔`.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
