# Planner variant of step NO-05 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS on the scratch project of this capstone after NO-04, in a Ukrainian and an English workspace,
# on Node.js 25.2.1 and 22.13.1: npm test (27 tests), the whole procedure of the intro with TODAY=2026-03-02.
# Wrong variants run against npm test, each failed at least one test: the 17 of the wishlist adapted (a missing
# priority migrated as high instead of a missing acquired), plus an empty dueDate accepted by the contract, a
# due date that is not a real day migrated, raw facts counting an empty dueDate as due, verifyBackup counting
# for today instead of the manifest's day. Not run on Linux or Windows.
instructions:
  uk: |
    Дай серверу надійне сховище: контракт, міграцію 1 → 2, перевірені резервні копії, відновлення на старті й чергу записів. Платформа цей крок не перевіряє.

    1. `src/contract.ts`: `parseStore`, `checkStore`, `checkRecords`, `storeText`, `ContractError` — рівно поля `id`, `title`, `dueDate`, `done`, `priority` (правила — `parseTask`), `dueDate: ""` — проблема `empty`.
    2. `src/lock.ts` (`createWriteLock`); `src/fileRepository.ts` — читання й запис через контракт, усі зміни в черзі, нові `create(build)` і `update(id, change)`; `src/api.ts` — `POST`, `PUT`, `PATCH` через них.
    3. `src/migrate.ts`: `migrate1to2` (без `priority` → `"normal"`, `dueDate: ""` → `null`; дата, якої не буває, як `2026-02-31`, зупиняє міграцію), `facts` (кількість, `id`, невиконані з терміном до дня `day` — доменна `countDueTasks`), `dryRun(store, day)`; `src/migrate-store.ts` — `"migrate": "node src/migrate-store.ts"`.
    4. `src/backup.ts`: `backupStore` (маніфест зберігає `day`), `verifyBackup` (рахує на день із маніфесту, не на сьогодні), `recoverStore`, `stampOf`; `src/backup-store.ts` — `"backup": "node src/backup-store.ts"`. День — `TODAY`, без нього — сьогоднішній.
    5. `src/open.ts`: `initStore` замість колишнього `openRepository`; `src/server.ts` (`start()`), `src/summary.ts`, `src/complete-task.ts` — через нього.
    6. `tests/storage.test.ts`; у `src/check-repository.ts` файли для перевірок — версії 2.
    7. Прогін з інтро з `TODAY=2026-03-02` перед кожною командою `npm` (або `export TODAY=2026-03-02`). Стара форма справи (без `priority`; якщо в неї немає терміну — ще й `dueDate: ""`) і пошкодження (у `server/`):

       ```text
       node -e 'const fs = require("fs"); const f = "data/planner.json"; const store = JSON.parse(fs.readFileSync(f, "utf8")); const task = store.records.find((one) => one.dueDate === null && one.priority === "normal") ?? store.records.find((one) => one.priority === "normal"); delete task.priority; if (task.dueDate === null) { task.dueDate = ""; } fs.writeFileSync(f, JSON.stringify(store, null, 2) + "\n"); console.log(JSON.stringify(task));'
       node -e 'const fs = require("fs"); const f = "data/planner.json"; fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace("\"done\": false", "\"done\": \"no\""));'
       ```

    8. `docs/server.md`, розділ «NO-05»; `git commit -m "Give the server a durable store: a contract, a tested migration, verified backups and recovery"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ tests 27`, `ℹ fail 0`.
    - `npm start` на файлі версії 1 — `Cannot start: … run "npm run migrate" first`; після `npm run migrate` у зміненої справи — `"priority": "normal"`; повторний `npm run migrate` — `already schemaVersion 2`.
    - `npm run backup` — `Verified by a restore into a scratch folder: …`, у `data/backups/` — копія й `….manifest.json` з `day`.
    - Пошкоджене сховище на старті — `moved aside as … restored … from …` і `Not in the backup: …`; без `data/backups` — `refusing to start`, `exit 1`, файл на місці.
    - `node try-api.mjs` — як у NO-04; `npm run typecheck` — жодного рядка; `npm run check` і `npm run check:server` — усі `✔`.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Give the server a durable store: a contract, a 1 → 2 migration, verified backups, recovery on start and a write queue. The platform does not check this step.

    1. `src/contract.ts`: `parseStore`, `checkStore`, `checkRecords`, `storeText`, `ContractError` — exactly the fields `id`, `title`, `dueDate`, `done`, `priority` (the rules are `parseTask`), `dueDate: ""` is the problem `empty`.
    2. `src/lock.ts` (`createWriteLock`); `src/fileRepository.ts` — reads and writes through the contract, every change in the queue, the new `create(build)` and `update(id, change)`; `src/api.ts` — `POST`, `PUT`, `PATCH` through them.
    3. `src/migrate.ts`: `migrate1to2` (no `priority` → `"normal"`, `dueDate: ""` → `null`; a date that does not exist, such as `2026-02-31`, stops the migration), `facts` (count, `id`s, pending tasks due by the day `day` — the domain's `countDueTasks`), `dryRun(store, day)`; `src/migrate-store.ts` — `"migrate": "node src/migrate-store.ts"`.
    4. `src/backup.ts`: `backupStore` (the manifest keeps the `day`), `verifyBackup` (counts on the manifest's day, not on today), `recoverStore`, `stampOf`; `src/backup-store.ts` — `"backup": "node src/backup-store.ts"`. The day is `TODAY`, without it today's date.
    5. `src/open.ts`: `initStore` instead of the former `openRepository`; `src/server.ts` (`start()`), `src/summary.ts`, `src/complete-task.ts` — through it.
    6. `tests/storage.test.ts`; in `src/check-repository.ts` the files of the checks are version 2.
    7. The run of the intro with `TODAY=2026-03-02` before every `npm` command (or `export TODAY=2026-03-02`). The old shape of a task (no `priority`; if it has no due date, also `dueDate: ""`) and the damage (in `server/`):

       ```text
       node -e 'const fs = require("fs"); const f = "data/planner.json"; const store = JSON.parse(fs.readFileSync(f, "utf8")); const task = store.records.find((one) => one.dueDate === null && one.priority === "normal") ?? store.records.find((one) => one.priority === "normal"); delete task.priority; if (task.dueDate === null) { task.dueDate = ""; } fs.writeFileSync(f, JSON.stringify(store, null, 2) + "\n"); console.log(JSON.stringify(task));'
       node -e 'const fs = require("fs"); const f = "data/planner.json"; fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace("\"done\": false", "\"done\": \"no\""));'
       ```

    8. `docs/server.md`, a section “NO-05”; `git commit -m "Give the server a durable store: a contract, a tested migration, verified backups and recovery"`.

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ tests 27`, `ℹ fail 0`.
    - `npm start` on a version 1 file — `Cannot start: … run "npm run migrate" first`; after `npm run migrate` the changed task has `"priority": "normal"`; a second `npm run migrate` says `already schemaVersion 2`.
    - `npm run backup` — `Verified by a restore into a scratch folder: …`, `data/backups/` holds the copy and `….manifest.json` with the `day`.
    - A damaged store on start — `moved aside as … restored … from …` and `Not in the backup: …`; without `data/backups` — `refusing to start`, `exit 1`, the file still there.
    - `node try-api.mjs` — as in NO-04; `npm run typecheck` — not a single line; `npm run check` and `npm run check:server` — every check `✔`.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
