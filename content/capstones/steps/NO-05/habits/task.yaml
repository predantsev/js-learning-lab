# Habit tracker variant of step NO-05 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS on the scratch project of this capstone after NO-04, in a Ukrainian and an English workspace,
# on Node.js 25.2.1 and 22.13.1: npm test (29 tests), the whole procedure of the intro with TODAY=2026-03-01.
# Wrong variants run against npm test, each failed at least one test: the 17 of the wishlist adapted (a missing
# frequency migrated as weekly instead of a missing acquired), plus completions kept with duplicates, a day that
# does not exist migrated, raw facts counting duplicate days, verifyBackup counting the streaks on today, the
# streaks not compared. Not run on Linux or Windows.
instructions:
  uk: |
    Дай серверу надійне сховище: контракт, міграцію 1 → 2, перевірені резервні копії, відновлення на старті й чергу записів. Платформа цей крок не перевіряє.

    1. `src/contract.ts`: `parseStore`, `checkStore`, `checkRecords`, `storeText`, `ContractError` — рівно поля `id`, `name`, `frequency`, `active`, `completions` (правила — `parseHabit`); версія 2 нічого не лагодить: день двічі чи не за порядком — проблема.
    2. `src/lock.ts` (`createWriteLock`); `src/fileRepository.ts` — читання й запис через контракт, усі зміни в черзі, нові `create(build)` і `update(id, change)`; `src/api.ts` — `POST`, `PUT`, `PATCH` і `POST /v1/records/:id/completions` через них.
    3. `src/migrate.ts`: `migrate1to2` (без `frequency` → `"daily"`, `completions` — через доменну `uniqueSortedDays`; день, якого не буває, як `2026-02-30`, зупиняє міграцію), `facts` (кількість, `id`, унікальні дні виконань, серії `streakOf` на день `day`), `dryRun(store, day)`; `src/migrate-store.ts` — `"migrate": "node src/migrate-store.ts"`.
    4. `src/backup.ts`: `backupStore` (маніфест зберігає `day`), `verifyBackup` (рахує серії на день із маніфесту, не на сьогодні), `recoverStore`, `stampOf`; `src/backup-store.ts` — `"backup": "node src/backup-store.ts"`. День — `TODAY`, без нього — сьогоднішній.
    5. `src/open.ts`: `initStore` замість колишнього `openRepository`; `src/server.ts` (`start()`), `src/summary.ts`, `src/complete-habit.ts` — через нього.
    6. `tests/storage.test.ts`; у `src/check-repository.ts` файли для перевірок — версії 2.
    7. Прогін з інтро з `TODAY=2026-03-01` перед кожною командою `npm` (або `export TODAY=2026-03-01`). Стара форма першої щоденної звички з двома виконаннями і пошкодження (у `server/`):

       ```text
       node -e 'const fs = require("fs"); const f = "data/habits.json"; const store = JSON.parse(fs.readFileSync(f, "utf8")); const habit = store.records.find((one) => one.frequency === "daily" && one.completions.length >= 2); delete habit.frequency; habit.completions = [...habit.completions, ...habit.completions].reverse(); fs.writeFileSync(f, JSON.stringify(store, null, 2) + "\n"); console.log(JSON.stringify(habit));'
       node -e 'const fs = require("fs"); const f = "data/habits.json"; fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace(/"active": (true|false)/, "\"active\": \"$1\""));'
       ```

    8. `docs/server.md`, розділ «NO-05»; `git commit -m "Give the server a durable store: a contract, a tested migration, verified backups and recovery"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ tests 29`, `ℹ fail 0`.
    - `npm start` на файлі версії 1 — `Cannot start: … run "npm run migrate" first`; після `npm run migrate` у зміненої звички — `"frequency": "daily"` і кожен день один раз, за зростанням; повторний `npm run migrate` — `already schemaVersion 2`.
    - `npm run backup` — `Verified by a restore into a scratch folder: …`, у `data/backups/` — копія й `….manifest.json` з `day`.
    - Пошкоджене сховище на старті — `moved aside as … restored … from …` і `Not in the backup: …`; без `data/backups` — `refusing to start`, `exit 1`, файл на місці.
    - `sh try-api` — як у NO-04; `npm run typecheck` — жодного рядка; `npm run check` і `npm run check:server` — усі `✔`.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Give the server a durable store: a contract, a 1 → 2 migration, verified backups, recovery on start and a write queue. The platform does not check this step.

    1. `src/contract.ts`: `parseStore`, `checkStore`, `checkRecords`, `storeText`, `ContractError` — exactly the fields `id`, `name`, `frequency`, `active`, `completions` (the rules are `parseHabit`); version 2 repairs nothing: a day twice or out of order is a problem.
    2. `src/lock.ts` (`createWriteLock`); `src/fileRepository.ts` — reads and writes through the contract, every change in the queue, the new `create(build)` and `update(id, change)`; `src/api.ts` — `POST`, `PUT`, `PATCH` and `POST /v1/records/:id/completions` through them.
    3. `src/migrate.ts`: `migrate1to2` (no `frequency` → `"daily"`, `completions` through the domain's `uniqueSortedDays`; a day that does not exist, such as `2026-02-30`, stops the migration), `facts` (count, `id`s, unique completion days, `streakOf` streaks on the day `day`), `dryRun(store, day)`; `src/migrate-store.ts` — `"migrate": "node src/migrate-store.ts"`.
    4. `src/backup.ts`: `backupStore` (the manifest keeps the `day`), `verifyBackup` (counts the streaks on the manifest's day, not on today), `recoverStore`, `stampOf`; `src/backup-store.ts` — `"backup": "node src/backup-store.ts"`. The day is `TODAY`, without it today's date.
    5. `src/open.ts`: `initStore` instead of the former `openRepository`; `src/server.ts` (`start()`), `src/summary.ts`, `src/complete-habit.ts` — through it.
    6. `tests/storage.test.ts`; in `src/check-repository.ts` the files of the checks are version 2.
    7. The run of the intro with `TODAY=2026-03-01` before every `npm` command (or `export TODAY=2026-03-01`). The old shape of the first daily habit with two completions, and the damage (in `server/`):

       ```text
       node -e 'const fs = require("fs"); const f = "data/habits.json"; const store = JSON.parse(fs.readFileSync(f, "utf8")); const habit = store.records.find((one) => one.frequency === "daily" && one.completions.length >= 2); delete habit.frequency; habit.completions = [...habit.completions, ...habit.completions].reverse(); fs.writeFileSync(f, JSON.stringify(store, null, 2) + "\n"); console.log(JSON.stringify(habit));'
       node -e 'const fs = require("fs"); const f = "data/habits.json"; fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace(/"active": (true|false)/, "\"active\": \"$1\""));'
       ```

    8. `docs/server.md`, a section “NO-05”; `git commit -m "Give the server a durable store: a contract, a tested migration, verified backups and recovery"`.

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ tests 29`, `ℹ fail 0`.
    - `npm start` on a version 1 file — `Cannot start: … run "npm run migrate" first`; after `npm run migrate` the changed habit has `"frequency": "daily"` and every day once, ascending; a second `npm run migrate` says `already schemaVersion 2`.
    - `npm run backup` — `Verified by a restore into a scratch folder: …`, `data/backups/` holds the copy and `….manifest.json` with the `day`.
    - A damaged store on start — `moved aside as … restored … from …` and `Not in the backup: …`; without `data/backups` — `refusing to start`, `exit 1`, the file still there.
    - `sh try-api` — as in NO-04; `npm run typecheck` — not a single line; `npm run check` and `npm run check:server` — every check `✔`.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
