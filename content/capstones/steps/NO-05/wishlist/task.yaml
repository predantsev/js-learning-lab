# Wishlist variant of step NO-05 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS on the scratch project of this capstone after NO-04, in a Ukrainian and an English workspace,
# on Node.js 25.2.1 and 22.13.1: npm test (24 tests), the whole procedure of the intro (migrate, backup, start,
# damage, restore, refusal). Wrong variants run against npm test, each failed at least one test: seed on every
# start, a damaged file read as no records, a migration that mutates its input, drops a record or migrates a
# missing acquired as true, dryRun without the facts compare, verifyBackup without sha256 or throwing on a
# missing manifest, the oldest backup first, the newest backup unverified, quarantine before a backup is found,
# the damaged file deleted, recovery trusting the version number, the id picked outside the queue, no queue,
# unknown fields accepted, a version 1 store started without the migration. Not run on Linux or Windows.
instructions:
  uk: |
    Дай серверу надійне сховище: контракт, міграцію 1 → 2, перевірені резервні копії, відновлення на старті й чергу записів. Платформа цей крок не перевіряє.

    1. `src/contract.ts`: `parseStore`, `checkStore`, `checkRecords`, `storeText`, `ContractError` — рівно поля `id`, `name`, `price`, `acquired`, `category` (правила — `parseItem`), `category: ""` — проблема `empty`.
    2. `src/lock.ts` (`createWriteLock`); `src/fileRepository.ts` — читання й запис через контракт, усі зміни в черзі, нові `create(build)` і `update(id, change)`; `src/api.ts` — `POST`, `PUT`, `PATCH` через них.
    3. `src/migrate.ts`: `migrate1to2` (без `acquired` → `false`, `category: ""` → `null`), `facts` (кількість, `id`, `wantedTotal`), `dryRun`; `src/migrate-store.ts` — `"migrate": "node src/migrate-store.ts"`.
    4. `src/backup.ts`: `backupStore`, `verifyBackup`, `recoverStore`, `stampOf`; `src/backup-store.ts` — `"backup": "node src/backup-store.ts"`.
    5. `src/open.ts`: `initStore` замість колишнього `openRepository`; `src/server.ts` (`start()`), `src/summary.ts`, `src/acquire.ts` — через нього.
    6. `tests/storage.test.ts`; у `src/check-repository.ts` файли для перевірок — версії 2.
    7. Прогін з інтро. Стара форма запису `w-05` і пошкодження (у `server/`):

       ```text
       node -e 'const fs = require("fs"); const f = "data/wishlist.json"; const store = JSON.parse(fs.readFileSync(f, "utf8")); const wish = store.records.find((one) => one.id === "w-05"); delete wish.acquired; wish.category = ""; fs.writeFileSync(f, JSON.stringify(store, null, 2) + "\n"); console.log(JSON.stringify(wish));'
       node -e 'const fs = require("fs"); const f = "data/wishlist.json"; fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace("\"price\": 80", "\"price\": \"80\""));'
       ```

    8. `docs/server.md`, розділ «NO-05»; `git commit -m "Give the server a durable store: a contract, a tested migration, verified backups and recovery"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ tests 24`, `ℹ fail 0`.
    - `npm start` на файлі версії 1 — `Cannot start: … run "npm run migrate" first`; після `npm run migrate` у `w-05` — `"acquired": false` і `"category": null`, а повторний `npm run migrate` — `already schemaVersion 2`.
    - `npm run backup` — `Verified by a restore into a scratch folder: …`, у `data/backups/` — копія й `….manifest.json`.
    - Пошкоджене сховище на старті — `moved aside as … restored … from …` і `Not in the backup: …`; без `data/backups` — `refusing to start`, `exit 1`, файл на місці.
    - `sh try-api` — як у NO-04; `npm run typecheck` — жодного рядка; `npm run check` і `npm run check:server` — усі `✔`.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Give the server a durable store: a contract, a 1 → 2 migration, verified backups, recovery on start and a write queue. The platform does not check this step.

    1. `src/contract.ts`: `parseStore`, `checkStore`, `checkRecords`, `storeText`, `ContractError` — exactly the fields `id`, `name`, `price`, `acquired`, `category` (the rules are `parseItem`), `category: ""` is the problem `empty`.
    2. `src/lock.ts` (`createWriteLock`); `src/fileRepository.ts` — reads and writes through the contract, every change in the queue, the new `create(build)` and `update(id, change)`; `src/api.ts` — `POST`, `PUT`, `PATCH` through them.
    3. `src/migrate.ts`: `migrate1to2` (no `acquired` → `false`, `category: ""` → `null`), `facts` (count, `id`s, `wantedTotal`), `dryRun`; `src/migrate-store.ts` — `"migrate": "node src/migrate-store.ts"`.
    4. `src/backup.ts`: `backupStore`, `verifyBackup`, `recoverStore`, `stampOf`; `src/backup-store.ts` — `"backup": "node src/backup-store.ts"`.
    5. `src/open.ts`: `initStore` instead of the former `openRepository`; `src/server.ts` (`start()`), `src/summary.ts`, `src/acquire.ts` — through it.
    6. `tests/storage.test.ts`; in `src/check-repository.ts` the files of the checks are version 2.
    7. The run of the intro. The old shape of the record `w-05` and the damage (in `server/`):

       ```text
       node -e 'const fs = require("fs"); const f = "data/wishlist.json"; const store = JSON.parse(fs.readFileSync(f, "utf8")); const wish = store.records.find((one) => one.id === "w-05"); delete wish.acquired; wish.category = ""; fs.writeFileSync(f, JSON.stringify(store, null, 2) + "\n"); console.log(JSON.stringify(wish));'
       node -e 'const fs = require("fs"); const f = "data/wishlist.json"; fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace("\"price\": 80", "\"price\": \"80\""));'
       ```

    8. `docs/server.md`, a section “NO-05”; `git commit -m "Give the server a durable store: a contract, a tested migration, verified backups and recovery"`.

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ tests 24`, `ℹ fail 0`.
    - `npm start` on a version 1 file — `Cannot start: … run "npm run migrate" first`; after `npm run migrate` the wish `w-05` has `"acquired": false` and `"category": null`, and a second `npm run migrate` says `already schemaVersion 2`.
    - `npm run backup` — `Verified by a restore into a scratch folder: …`, `data/backups/` holds the copy and `….manifest.json`.
    - A damaged store on start — `moved aside as … restored … from …` and `Not in the backup: …`; without `data/backups` — `refusing to start`, `exit 1`, the file still there.
    - `sh try-api` — as in NO-04; `npm run typecheck` — not a single line; `npm run check` and `npm run check:server` — every check `✔`.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
