# Capstone step of unit RE-06 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson re-06-11-capstone-async-data from this file.
# A local step: done in the learner's editor, terminal and browser; no platform checks. The project page
# shows only the intro of a local step, so the intro carries the whole procedure.
# Every command was run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome) in a scratch home on
# all four projects, continuing the RE-05 scratch projects. tests.html ran in Chrome; every project's six
# user-action tests passed on the reference, and deliberately wrong versions (no loading text, no
# invalidation, no optimistic change, no rollback, no abort, no retry limit) each failed at least one.
# The RE-05 browser check (routes, guard, not-found, 404 and retry) was re-run on the RE-06 wishlist.
# tests/ui-testing.js is the course runner with React helpers of lesson re-06-10 (bookmarks/starter/testing.js).
# reference/ holds the same file set as RE-01 (export- and npm-generated files excluded).
unit: RE-06
mode: local
entry: index.html
title:
  uk: "Асинхронний шар даних"
  en: "An async data layer"
intro:
  uk: |
    Досі записи жили поруч зі сторінкою. Тепер між ними стоїть затриманий **API-фікстура** — модуль `data/api.ts`, який грає сервер: відповідає за `settings.delayMs` (300 мс), уміє за наказом відповісти помилкою й зупиняється, коли [[ignore-flag|запит скасовано]]. Сторінка розмовляє з ним [[data-query|запитами]] й [[data-mutation|змінами]]: список для фільтра скасовує старий запит, після кожного запису кеш [[cache-invalidation|інвалідується]] й список перечитується, повторна спроба — лише з кнопки й з лімітом, а одна зміна вашого домену стає [[optimistic-update|оптимістичною]] з [[optimistic-rollback|відкатом]]. Перевіряють це [[user-action-test|тести дій користувача]] на окремій сторінці `tests.html`. `domain/` і `storage/` не змінюються: «сервер» зберігає записи тими самими функціями `storage/` у `localStorage`.

    | Проєкт | Оптимістична зміна й відкат | Що перечитується після запису |
    |---|---|---|
    | Список бажань | `toggleAcquired(item)`: позначка «отримано» одразу; помилка — лише це бажання повертається, повідомлення називає його | списки фільтрів і зведення |
    | Планувальник | `toggleDone(task)`: позначка «виконано» одразу; помилка — лише ця справа повертається | списки фільтрів і число справ на сьогодні |
    | Трекер звичок | `markDay(habit, today)`: сьогоднішній день у `completions` одразу; помилка — звичка повертається до запису з усіма іншими днями | списки фільтрів і частки виконань |
    | Трекер витрат | `removeOptimistic(expense)`: картка й її сума зникають одразу; помилка — витрата повертається на своє місце в кожному списку разом із сумами в `amountMinor` | списки категорій і суми за категоріями |

    Нижче — «Список бажань»; для свого проєкту підстав назви з таблиці. Перевірено на macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2, Chrome) на всіх чотирьох проєктах.

    **1. Стан на початку.** `cd ~/js-course/wishlist`, `git status` — чисто, `git log --oneline -1` — commit кроку про маршрути.

    **2. API-фікстура `data/api.ts`.** Запит `listItems(filter, signal)` і зміни `createItem(fields)`, `saveItem(id, fields)`, `deleteItem(id)`. Кожна функція чекає `settings.delayMs`; `settings.failNextRead` / `settings.failNextWrite` — скільки наступних читань чи записів відповідають помилкою `ApiError` зі статусом 503. Запис — це action `itemsReducer` з кроку про reducer: «сервер» застосовує його до свого списку й зберігає `saveItems`; невідомий `id` — 404, відмова reducer (той самий список) — 400. Без збережених записів «сервер» починає з `data/wishes.json`. `requests` записує кожен запит списку і як він скінчився (`answered`, `failed`, `aborted`), а `resetApi(list)` дає тестам свіжий «сервер» у пам’яті з відповідями за 20 мс. Старий хук `ui/useItems.ts` видали.

    **3. Кеш і запит — `ui/itemsCache.tsx`.** `ItemsCacheProvider` тримає відповіді під [[cache-key|ключем]] із фільтром (`"items:all"`, `"items:wanted"`, `"items:acquired"`) і лічильник `version`. `useItemsList(filter)` — ефект із залежностями `[key, cache.version, attempt]`: створює `AbortController`, кличе `listItems(filter, controller.signal)`, кладе відповідь у кеш, а cleanup — `controller.abort()`, тож відповідь для старого фільтра вже не прийде; скасування — не помилка. Результат — `{ items, status, message, retriesLeft, retry }`: `loading` (ще нічого), `refreshing` (старі записи лишаються на екрані, поки йде новий запит — так список перечитується й щоразу, коли екран відкривається знову), `ready` або `failed`. `retry()` працює лише з кнопки, не під час запиту й не більше трьох разів підряд; `QueryState` показує стан у `<p role="status">` і кнопку «Завантажити ще раз».

    **4. Зміни — `useItemMutations()`.** `create`, `save`, `remove` запускаються лише з обробників і повертають `{ ok: true }` або `{ ok: false, message }`; після успіху `cache.invalidate()` збільшує `version`, і всі запити `"items:…"` читають знову — списки й зведення. `toggleAcquired(item)` спершу міняє бажання в кожному списку кешу, потім чекає API, а в разі помилки повертає **лише це бажання** таким, яким воно було, і повідомлення називає його.

    **5. Екрани.** `App` обгортає маршрутизатор у `ItemsCacheProvider`; макет більше не чекає завантаження — кожен екран показує свій стан. `ItemsScreen` має два запити: список вибраного фільтра для карток і `"all"` для зведення; відповідь про зміну — у своєму `<p role="status">`. `ItemDetail` і `ItemEdit` знаходять запис за `id` у кешованому списку `"all"` — одне джерело для всіх екранів. `ItemForm.onSave` тепер повертає `Promise<boolean>`: поки йде запис, «Зберегти» вимкнена, а невдалий запис лишає чернетку.

    **6. Тести дій користувача.** Скопіюй `testing.js` з уроку про тести дій користувача в `tests/ui-testing.js`. `tests/ui.test.tsx` рендерить увесь `App` у `StrictMode` після `resetApi(START)` і перевіряє за підписами, ролями й текстом: стан завантаження, потім картки; нове бажання після «Зберегти»; невдале перемикання — позначка одразу, а після помилки її немає, повідомлення називає бажання, інше бажання не змінилося; помилка читання — повідомлення й «Завантажити ще раз», після якої картки є; три невдалі повторні спроби — кнопки більше немає, а є «Спроби вичерпано…»; швидка зміна фільтра — запит для старого фільтра `aborted`. `tests/ui-run.tsx` запускає їх і пише результат на сторінку `tests.html`. Цим тестам потрібен DOM, тож у Node.js (`npm test`) вони не запускаються:

    ```sh
    npm pkg set scripts.build:tests="esbuild tests/ui-run.tsx --bundle --sourcemap --format=esm --outfile=dist/tests.js"
    npm pkg set scripts.start="npm run build && npm run build:tests && node --env-file=.env serve.mjs"
    ```

    У `tsconfig.json` в `include` додай `"data/**/*.ts"` і `"tests/**/*.tsx"`.

    **7. Перевірка.** `npm run typecheck` і `npm run lint` — лише рядки заголовка; `npm test` — `Пройшли: 33 · не пройшли: 0`; `npm run build:tests` — `dist/tests.js      1.2mb ⚠️` і `⚡ Done in 47ms`. Після `npm start` відкрий `http://127.0.0.1:4310/tests.html`:

    ```text
    ✓ the list shows the loading state, then the wishes of the API
    ✓ a new wish appears in the list after saving
    ✓ a failed acquired toggle rolls back that wish and says which one was not saved
    ✓ a failed load shows the error, and the retry button loads the list
    ✓ after three failed retries the retry button is gone
    ✓ a quick filter change aborts the older request and shows the last filter
    Пройшли: 6 · не пройшли: 0
    ```

    Потім `http://127.0.0.1:4310/` з порожнім сховищем: спершу `Завантажую список…`, за 300 мс — шість карток; «Зберегти» вимкнена, поки бажання зберігається; позначка «отримано» з’являється одразу після кліку; зміна фільтра показує `Завантажую список…`, а потім лише свої картки; після видалення фокус на «Видалити» наступної картки; після перезавантаження нове бажання, позначка й видалення на місці. У Console немає червоних повідомлень.

    **8. Commit.** `git add -A`, `git commit -m "Load the list through a delayed fixture API"` — `[main eca718e] Load the list through a delayed fixture API` і `18 files changed, 780 insertions(+), 151 deletions(-)`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.

    **Самоперевірка:** `tests.html` — `не пройшли: 0`; зламай навмисно одну річ (прибери `controller.abort()` у cleanup, відкат чи `cache.invalidate()`) — відповідний тест падає, поверни; кожен пункт кроку 7 справджується; `npm run typecheck`, `npm run lint`, `npm test` — без зауважень.

    **Якщо щось пішло не так** (усе відтворено на «Списку бажань»):

    - `✗ a new wish appears in the list after saving — на екрані немає "Рюкзак"` — після успішного запису немає `cache.invalidate()`, і список не перечитується.
    - `✗ a failed acquired toggle … — the mark right after the click: очікувалося true, отримано false` — зміна не оптимістична: кеш оновлюється лише після відповіді API.
    - `✗ a failed acquired toggle … — the mark after the failure: очікувалося null, отримано <p>` — після помилки бажання не повертається (немає відкату).
    - `✗ a quick filter change … — the outcome of the request for the acquired wishes: очікувалося ["aborted"], отримано ["answered"]` — ефект запиту не повертає `() => controller.abort()`.
    - `✗ after three failed retries the retry button is gone — на екрані немає "Спроби вичерпано: перезавантаж сторінку пізніше."` — `retry()` не має межі.
    - `✗ the list shows the loading state … — the loading text right after the start: очікувалося true, отримано false` — стан `loading` нічого не показує.
    - `tests.html` лишається на `Тести виконуються…`, а в Console `404` для `dist/tests.js` — тестовий bundle не зібрано: запускай через `npm start` або `npm run build:tests`.

    Коли один тест падає посеред дії, наступний іноді падає теж (у нас без `abort()` падають ще й обидва тести повторної спроби): виправляй перший червоний рядок.

    Еталон кроку — `Завантажити: RE-06 — Асинхронний шар даних` у розділі «Еталони для завантаження» після експорту. Команди виконано лише на macOS; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    So far the records lived next to the page. Now a delayed **fixture API** stands between them — the module `data/api.ts`, which plays a server: it answers after `settings.delayMs` (300 ms), can answer with an error on command and stops when [[ignore-flag|the request is canceled]]. The page talks to it with [[data-query|queries]] and [[data-mutation|mutations]]: the list of a filter aborts the older request, after every write the cache is [[cache-invalidation|invalidated]] and the list is read again, a retry happens only from a button and with a limit, and one change of your domain becomes an [[optimistic-update]] with a [[optimistic-rollback|rollback]]. [[user-action-test|User-action tests]] on a page of their own, `tests.html`, check all of it. `domain/` and `storage/` do not change: the “server” keeps the records in `localStorage` with the same `storage/` functions.

    | Project | The optimistic change and its rollback | What is read again after a write |
    |---|---|---|
    | Wishlist | `toggleAcquired(item)`: the “acquired” mark at once; on an error only this wish goes back, and the message names it | the filter lists and the summary |
    | Planner | `toggleDone(task)`: the “done” mark at once; on an error only this task goes back | the filter lists and the due count for today |
    | Habit tracker | `markDay(habit, today)`: today in `completions` at once; on an error the habit goes back to its record with every other day | the filter lists and the completion rates |
    | Expense tracker | `removeOptimistic(expense)`: the card and its amount go at once; on an error the expense goes back to its place in every list, together with the totals in `amountMinor` | the category lists and the category totals |

    Below is the wishlist; for your project use the names from the table. Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2, Chrome) on all four projects.

    **1. The starting state.** `cd ~/js-course/wishlist`, `git status` — clean, `git log --oneline -1` — the commit of the routes step.

    **2. The fixture API `data/api.ts`.** The query `listItems(filter, signal)` and the mutations `createItem(fields)`, `saveItem(id, fields)`, `deleteItem(id)`. Every function waits `settings.delayMs`; `settings.failNextRead` / `settings.failNextWrite` say how many of the next reads or writes answer with an `ApiError` of status 503. A write is an action of the reducer step's `itemsReducer`: the “server” applies it to its list and saves it with `saveItems`; an unknown `id` — 404, a refusal of the reducer (the same list) — 400. Without saved records the “server” starts from `data/wishes.json`. `requests` records every list request and how it ended (`answered`, `failed`, `aborted`), and `resetApi(list)` gives the tests a fresh in-memory “server” that answers in 20 ms. Delete the old hook `ui/useItems.ts`.

    **3. The cache and the query — `ui/itemsCache.tsx`.** `ItemsCacheProvider` keeps the answers under a [[cache-key]] with the filter (`"items:all"`, `"items:wanted"`, `"items:acquired"`) and a `version` counter. `useItemsList(filter)` is an effect with the dependencies `[key, cache.version, attempt]`: it creates an `AbortController`, calls `listItems(filter, controller.signal)`, puts the answer into the cache, and its cleanup is `controller.abort()`, so the answer for an old filter never arrives; an abort is not an error. The result is `{ items, status, message, retriesLeft, retry }`: `loading` (nothing yet), `refreshing` (the old records stay on screen while a new request is on its way — this is also how the list is read again every time the screen opens), `ready` or `failed`. `retry()` works only from a button, not during a request and at most three times in a row; `QueryState` shows the state in a `<p role="status">` and the “Load again” button.

    **4. Mutations — `useItemMutations()`.** `create`, `save`, `remove` start only from handlers and return `{ ok: true }` or `{ ok: false, message }`; after a success `cache.invalidate()` increases `version`, and every `"items:…"` query reads again — the lists and the summary. `toggleAcquired(item)` first changes the wish in every cached list, then waits for the API, and on an error puts back **only this wish** as it was, with a message that names it.

    **5. Screens.** `App` wraps the router in `ItemsCacheProvider`; the layout no longer waits for a load — every screen shows its own state. `ItemsScreen` has two queries: the list of the chosen filter for the cards and `"all"` for the summary; the answer about a change goes into its own `<p role="status">`. `ItemDetail` and `ItemEdit` find the record by `id` in the cached `"all"` list — one source for every screen. `ItemForm.onSave` now returns a `Promise<boolean>`: while the write is on its way “Save” is disabled, and a failed write keeps the draft.

    **6. User-action tests.** Copy `testing.js` of the lesson on user-action tests into `tests/ui-testing.js`. `tests/ui.test.tsx` renders the whole `App` in `StrictMode` after `resetApi(START)` and checks by labels, roles and text: the loading state, then the cards; a new wish after “Save”; a failed toggle — the mark at once, gone after the error, a message that names the wish, the other wish unchanged; a failed read — the message and “Load again”, after which the cards are there; three failed retries — the button is gone and “No retries left…” is shown; a quick filter change — the request for the older filter is `aborted`. `tests/ui-run.tsx` runs them and writes the result onto the page `tests.html`. These tests need a DOM, so they do not run in Node.js (`npm test`):

    ```sh
    npm pkg set scripts.build:tests="esbuild tests/ui-run.tsx --bundle --sourcemap --format=esm --outfile=dist/tests.js"
    npm pkg set scripts.start="npm run build && npm run build:tests && node --env-file=.env serve.mjs"
    ```

    In `tsconfig.json` add `"data/**/*.ts"` and `"tests/**/*.tsx"` to `include`.

    **7. Check.** `npm run typecheck` and `npm run lint` — only the header lines; `npm test` — `Passed: 33 · failed: 0`; `npm run build:tests` — `dist/tests.js      1.2mb ⚠️` and `⚡ Done in 47ms`. After `npm start` open `http://127.0.0.1:4310/tests.html`:

    ```text
    ✓ the list shows the loading state, then the wishes of the API
    ✓ a new wish appears in the list after saving
    ✓ a failed acquired toggle rolls back that wish and says which one was not saved
    ✓ a failed load shows the error, and the retry button loads the list
    ✓ after three failed retries the retry button is gone
    ✓ a quick filter change aborts the older request and shows the last filter
    Passed: 6 · failed: 0
    ```

    Then `http://127.0.0.1:4310/` with an empty storage: first `Loading the list…`, after 300 ms six cards; “Save” is disabled while the wish is being saved; the “acquired” mark appears right after the click; a filter change shows `Loading the list…`, then only its own cards; after a delete focus is on “Delete” of the next card; after a reload the new wish, the mark and the delete are all there. The Console has no red messages.

    **8. Commit.** `git add -A`, `git commit -m "Load the list through a delayed fixture API"` — `[main 58195df] Load the list through a delayed fixture API` and `18 files changed, 780 insertions(+), 151 deletions(-)`; `git diff HEAD~1 --stat -- domain storage` prints nothing.

    **Self-check:** `tests.html` — `failed: 0`; break one thing on purpose (remove `controller.abort()` from the cleanup, the rollback or `cache.invalidate()`) — the matching test fails; put it back; every item of step 7 holds; `npm run typecheck`, `npm run lint`, `npm test` — no findings.

    **If something goes wrong** (all reproduced on the wishlist):

    - `✗ a new wish appears in the list after saving — not on the screen: "Backpack"` — a successful write is not followed by `cache.invalidate()`, so the list is not read again.
    - `✗ a failed acquired toggle … — the mark right after the click: expected true, got false` — the change is not optimistic: the cache changes only after the API answers.
    - `✗ a failed acquired toggle … — the mark after the failure: expected null, got <p>` — the wish does not go back after the error (no rollback).
    - `✗ a quick filter change … — the outcome of the request for the acquired wishes: expected ["aborted"], got ["answered"]` — the query effect does not return `() => controller.abort()`.
    - `✗ after three failed retries the retry button is gone — not on the screen: "No retries left: reload the page later."` — `retry()` has no limit.
    - `✗ the list shows the loading state … — the loading text right after the start: expected true, got false` — the `loading` state shows nothing.
    - `tests.html` stays at `The tests are running…`, and the Console has a `404` for `dist/tests.js` — the test bundle is not built: start with `npm start` or run `npm run build:tests`.

    When one test fails in the middle of an action, the next one sometimes fails too (for us, without `abort()` both retry tests fail too): fix the first red line.

    The step's reference is `Download: RE-06 — An async data layer` in the “References to download” section after the export. The commands were run on macOS only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це крок твого проєкту: життєвий цикл запиту, скасування, повторну спробу, запити й зміни, інвалідацію кешу, оптимістичне оновлення з відкатом і тести дій користувача з цього розділу ти застосовуєш до шару даних власного застосунку. Платформа цей крок не перевіряє: доказ — сторінка тестів, перевірка в браузері й commit."
  en: "This is a step of your project: you apply this unit's request lifecycle, cancellation, retry, queries and mutations, cache invalidation, optimistic update with rollback and user-action tests to your own app's data layer. The platform does not check this step: the evidence is the test page, the browser check and the commit."
objectives:
  - uk: "Читати список через затриманий API-фікстуру запитом, який скасовує застарілий запит, показує стани й дозволяє обмежену повторну спробу з кнопки."
    en: "Read the list through a delayed fixture API with a query that aborts a stale request, shows its states and allows a bounded retry from a button."
  - uk: "Запускати зміни з обробників, інвалідувати після запису лише кешовані списки записів і зробити одну зміну домену оптимістичною з відкатом лише цього запису й озвученим повідомленням."
    en: "Start mutations from handlers, invalidate only the cached record lists after a write, and make one domain change optimistic with a rollback of only that record and an announced message."
  - uk: "Перевірити шар даних тестами дій користувача — завантаження, створення, невдала зміна з відкатом і скасування — і переконатися, що кожен ловить свою навмисну помилку."
    en: "Check the data layer with user-action tests — loading, creating, a failed change with its rollback and the cancellation — and make sure each catches its deliberate mistake."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й браузері на твоєму комп’ютері: що змінити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and a browser on your computer: what to change, the expected output and the self-check list are above and on the step's page in your project."
