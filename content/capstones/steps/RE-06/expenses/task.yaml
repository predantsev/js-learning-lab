# Expense tracker variant of step RE-06 (a local step: done in the learner's editor, terminal and browser, no
# platform checks). Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2,
# Chrome) on the scratch project of this capstone after RE-05; tests.html passed and caught five
# deliberately wrong versions.
