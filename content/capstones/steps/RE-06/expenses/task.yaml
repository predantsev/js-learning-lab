instructions:
  uk: |
    Проведи дані `~/js-course/expenses` через затриманий API-фікстуру з кешем, скасуванням, обмеженою повторною спробою, інвалідацією й однією оптимістичною зміною, і перевір це тестами дій користувача. `domain/` і `storage/` не змінюються. Платформа цей крок не перевіряє; доказ — `tests.html`, перевірка в браузері й commit.

    1. `data/api.ts`: `listExpenses`, `createExpense`, `saveExpense`, `deleteExpense` з `settings.delayMs` (300), `settings.failNextRead` / `failNextWrite`, `AbortSignal`, записами через reducer і `saveX` зі `storage/`, журналом `requests` і `resetApi(list)` для тестів. Видали `ui/useExpenses.ts`.
    2. `ui/expensesCache.tsx`: провайдер кешу з ключами "expenses:all", "expenses:food", … і `version`; `useExpensesList(filter)` — ефект з `AbortController` і cleanup `abort()`, стани `loading` / `refreshing` / `ready` / `failed`, `retry()` лише з кнопки й не більше трьох разів; `useExpenseMutations()` — зміни з `{ ok }`, після успіху `invalidate()` (суми за категоріями теж перечитуються).
    3. Оптимістична зміна: `removeOptimistic(expense)` — картка й її сума зникають одразу, помилка повертає витрату на її місце в кожному списку разом із сумами в `amountMinor` і повідомленням «%%removeFailedMessage%%».
    4. Екрани: провайдер у `App`, у списку — два запити (фільтр і `"all"`), `QueryState` зі станом у `role="status"`; деталі й редагування шукають запис у `"all"`; форма вимикає «%%saveLabel%%», поки запис іде, і лишає чернетку після помилки.
    5. `tests/ui-testing.js` (з уроку), `tests/ui.test.tsx` (завантаження, створення, невдала оптимістична зміна з відкатом, скасування старого запиту фільтра), `tests/ui-run.tsx`, `tests.html`; скрипти `build:tests` і `start` (`npm run build && npm run build:tests && node --env-file=.env serve.mjs`); `"data/**/*.ts"` і `"tests/**/*.tsx"` у `include`.
    6. `npm run typecheck`, `npm run lint` — без зауважень; `npm test` — 32 тести і `не пройшли: 0`; `npm start`, `http://127.0.0.1:4310/tests.html` — чотири рядки `✓` і `не пройшли: 0`.
    7. У застосунку: `%%loadingListMessage%%`, потім картки; оптимістична зміна видна одразу; зміни переживають перезавантаження.
    8. `git add -A`, `git commit -m "Load the list through a delayed fixture API"`; `git diff HEAD~1 --stat -- domain storage` нічого не друкує.
  en: |
    Route the data of `~/js-course/expenses` through a delayed fixture API with a cache, cancellation, a bounded retry, invalidation and one optimistic change, and check it with user-action tests. `domain/` and `storage/` do not change. The platform does not check this step; the evidence is `tests.html`, the browser check and the commit.

    1. `data/api.ts`: `listExpenses`, `createExpense`, `saveExpense`, `deleteExpense` with `settings.delayMs` (300), `settings.failNextRead` / `failNextWrite`, an `AbortSignal`, writes through the reducer and the `saveX` of `storage/`, a `requests` log and `resetApi(list)` for the tests. Delete `ui/useExpenses.ts`.
    2. `ui/expensesCache.tsx`: a cache provider with the keys "expenses:all", "expenses:food", … and `version`; `useExpensesList(filter)` — an effect with an `AbortController` and the cleanup `abort()`, the states `loading` / `refreshing` / `ready` / `failed`, `retry()` only from a button and at most three times; `useExpenseMutations()` — mutations with `{ ok }`, `invalidate()` after a success (the category totals is read again too).
    3. The optimistic change: `removeOptimistic(expense)` — the card and its amount go at once; an error puts the expense back to its place in every list, together with the totals in `amountMinor`, with the message “%%removeFailedMessage%%”.
    4. Screens: the provider in `App`, two queries on the list screen (the filter and `"all"`), `QueryState` with the state in `role="status"`; the detail and edit screens find the record in `"all"`; the form disables “%%saveLabel%%” while the write is on its way and keeps the draft after an error.
    5. `tests/ui-testing.js` (from the lesson), `tests/ui.test.tsx` (loading, creating, a failed optimistic change with its rollback, the abort of the older filter request), `tests/ui-run.tsx`, `tests.html`; the scripts `build:tests` and `start` (`npm run build && npm run build:tests && node --env-file=.env serve.mjs`); `"data/**/*.ts"` and `"tests/**/*.tsx"` in `include`.
    6. `npm run typecheck`, `npm run lint` — no findings; `npm test` — 32 tests and `failed: 0`; `npm start`, `http://127.0.0.1:4310/tests.html` — four `✓` lines and `failed: 0`.
    7. In the app: `%%loadingListMessage%%`, then the cards; the optimistic change shows at once; changes survive a reload.
    8. `git add -A`, `git commit -m "Load the list through a delayed fixture API"`; `git diff HEAD~1 --stat -- domain storage` prints nothing.
