# Habit tracker variant of step RN-10 (a local step: done in the learner's editor, terminal and on the
# declared native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1,
# Expo SDK 57, react-native-gesture-handler 2.32.0) on the scratch project of this capstone; nothing was
# run on an emulator, a simulator or a phone.
strings:
  undoLabel: { uk: "Повернути", en: "Undo" }
  measureLabel: { uk: "Виміряти прокручування", en: "Measure scrolling" }
instructions:
  uk: |
    Свайп ліворуч по рядку виконує головну дію, рухається обмежено (або лише згасає з «зменшенням руху») і має «%%undoLabel%%»; потім виміряй довгий синтетичний список у випускній збірці й виправ одну виміряну проблему. Платформа цей крок не перевіряє.

    1. `npx expo install react-native-gesture-handler`; `GestureHandlerRootView` зі `style={{ flex: 1 }}` навколо всього в `App.tsx`.
    2. `src/swipe.ts`: `isSwipe` (напрямок, потім `-120` точок або `-800` точок/с) з тестами.
    3. `src/SwipeRow.tsx`: `Gesture.Pan()` з `activeOffsetX([-12, 12])`, `failOffsetY([-8, 8])`, `runOnJS(true)` і `onEnd((event, success) => …)`; `Animated.timing` на native driver (зсув або, з «зменшенням руху», прозорість); дія в колбеку `start`; `stop()` у прибиранні; `accessibilityActions` з тією самою дією.
    4. Дія свайпу: `completionAdded` із `clock.today()` (лише активна звичка, ще не позначена сьогодні; `enabled` вимикає жест і дію доступності для решти); одразу `repository.apply`, попередній список — для `src/UndoBar.tsx` (5 с, `clearTimeout` у прибиранні) і `repository.restore`.
    5. `src/useReducedMotion.ts` — один раз на екрані списку, значення передається рядкам.
    6. `data/synthetic.js` з `../habits` (`makeSyntheticHabits`), `SYNTHETIC_COUNT` у `src/devConfig.ts`, `src/perfTools.ts`, «%%measureLabel%%»; `docs/PERF.md`: збірка, ціль, 500 записів, сценарій, медіана трьох запусків до й після однієї виправленої проблеми.
    7. `EVIDENCE.md`, розділ «RN-10»; `SYNTHETIC_COUNT = 0`; `git commit -m "Swipe a row with undo, reduced motion and a measured long list"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — жодного рядка; `npm test` — 53 тестів, «не пройшли: 0».
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі: свайп по «%%fixture1Name%%» — рядок виїжджає й повертається з «%%doneTodayMark%%», знизу «%%announceMarked%%» з назвою і «%%undoLabel%%»; свайп по звичці на паузі нічого не робить.
    - На цілі: короткий рух угору-вниз прокручує список; з TalkBack чи VoiceOver та сама дія є в меню дій рядка.
    - На цілі з «зменшенням руху»: рядок лише згасає, результат той самий.
    - На цілі у випускній збірці: `docs/PERF.md` з числами до й після, назвою збірки й цілі.

    **Доказ:** commit, `docs/PERF.md` і `EVIDENCE.md` — рядки команд і те, що ти бачив на цілі, або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися.
  en: |
    A swipe to the left on a row performs the main action, moves in a bounded way (or only fades with “reduce motion”) and has “%%undoLabel%%”; then measure a long synthetic list in a release build and fix one measured problem. The platform does not check this step.

    1. `npx expo install react-native-gesture-handler`; `GestureHandlerRootView` with `style={{ flex: 1 }}` around everything in `App.tsx`.
    2. `src/swipe.ts`: `isSwipe` (the direction, then `-120` points or `-800` points/s) with tests.
    3. `src/SwipeRow.tsx`: `Gesture.Pan()` with `activeOffsetX([-12, 12])`, `failOffsetY([-8, 8])`, `runOnJS(true)` and `onEnd((event, success) => …)`; `Animated.timing` on the native driver (a shift or, with “reduce motion”, the opacity); the action in the `start` callback; `stop()` in the cleanup; `accessibilityActions` with the same action.
    4. The swipe's action: `completionAdded` with `clock.today()` (only an active habit not marked today; `enabled` turns the gesture and the accessibility action off for the rest); `repository.apply` at once, the previous list kept for `src/UndoBar.tsx` (5 s, `clearTimeout` in the cleanup) and `repository.restore`.
    5. `src/useReducedMotion.ts` — once on the list screen, the value passed to the rows.
    6. `data/synthetic.js` from `../habits` (`makeSyntheticHabits`), `SYNTHETIC_COUNT` in `src/devConfig.ts`, `src/perfTools.ts`, “%%measureLabel%%”; `docs/PERF.md`: the build, the target, 500 records, the script, the median of three runs before and after one fixed problem.
    7. `EVIDENCE.md`, a section “RN-10”; `SYNTHETIC_COUNT = 0`; `git commit -m "Swipe a row with undo, reduced motion and a measured long list"`.

    **Self-check — confirm every item yourself:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — not a single line; `npm test` — 53 tests, “failed: 0”.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target: a swipe on “%%fixture1Name%%” — the row slides out and comes back with “%%doneTodayMark%%”, at the bottom “%%announceMarked%%” with the name and “%%undoLabel%%”; a swipe on a paused habit does nothing.
    - On the target: a short move up or down scrolls the list; with TalkBack or VoiceOver the same action is in the row's actions menu.
    - On the target with “reduce motion”: the row only fades, the result is the same.
    - On the target in a release build: `docs/PERF.md` with the numbers before and after, the build's and the target's names.

    **Evidence:** the commit, `docs/PERF.md` and `EVIDENCE.md` — the command lines and what you saw on the target, or a “not performed” record: what, on which target, why, what it takes to come back.
