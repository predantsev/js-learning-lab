# Capstone step of unit RN-10 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson of kind capstone-step of RN-10 from this file.
# Teaching order: RN-09, RN-10, RN-07, … — this step continues the RN-06 reference.
# A local step: done in the learner's editor, terminal and on the declared native target; no platform
# checks. The project page shows only the intro of a local step, so the intro carries the whole procedure.
# Every computer-side command was run on macOS (Node.js 25.2.1, npm 11.6.2, Expo SDK 57) in a scratch home
# on all four projects, continuing the RN-06 scratch projects: expo install of react-native-gesture-handler,
# tsc, the course test runner (Ukrainian and English strings), expo export for android and ios, the commit.
# The lesson's perfTools.ts did not pass tsc in this project (no DOM types: `Cannot find name
# 'performance'`), so the project's copy starts the meter at the first frame instead. Deliberately wrong
# variants failed the tests: a swipe rule without the direction check, an undo that does not save.
# Nothing was run on an emulator, a simulator or a phone: no gesture, animation or measurement was seen,
# and docs/PERF.md holds no numbers. Quoted output is from the wishlist run.
# reference/ is the native project after the step without the files the template generates and the
# platform cannot carry (assets/*.png, LICENSE, package-lock.json, node_modules/).
unit: RN-10
mode: local
entry: App.tsx
title:
  uk: "Свайп, анімація без зайвого руху й виміряний довгий список"
  en: "A swipe, motion that can be reduced, and a measured long list"
intro:
  uk: |
    Рядок списку отримує жест: свайп ліворуч виконує головну дію домену, і цю саму дію можна зробити меню дій читача екрана. Рядок відповідає однією обмеженою анімацією — виїжджає, а з увімкненим «зменшенням руху» лише згасає, — і панель «Повернути» дає п’ять секунд, щоб передумати. Потім ти міряєш довгий синтетичний список у випускній збірці на заявленій цілі й виправляєш одну виміряну проблему.

    | Проєкт | Свайп ліворуч | Рядок | Повернути |
    |---|---|---|---|
    | Список бажань | `acquiredToggled`: отримано ↔ ще бажане | виїжджає й повертається з новою позначкою | попередній список |
    | Планувальник | `doneToggled`: виконано ↔ ні | виїжджає й повертається з новим станом | попередній список |
    | Трекер звичок | `completionAdded` із сьогоднішньою датою (лише для активної, ще не позначеної) | виїжджає й повертається з «Сьогодні виконано» | попередній список |
    | Трекер витрат | `removed` | виїжджає й зникає; підсумки категорій рахуються з нового списку | попередній список |

    Нижче — «Список бажань». Команди на комп’ютері виконано на macOS (Node.js 25.2.1, Expo SDK 57, react-native-gesture-handler 2.32.0) на всіх чотирьох проєктах. Емулятора, симулятора й телефона не було: жодного жесту, анімації чи виміру ми не бачили, кроки 8–9 описано за уроками розділу й документацією React Native 0.86 і react-native-gesture-handler 2.32.

    **1. Стан на початку.** `cd ~/js-course/wishlist-native`, `git status` — чисто, `git log --oneline -1` — commit екрана записів із сервісу.

    **2. Жести.** `npx expo install react-native-gesture-handler` — у нас `› Installing 1 SDK 57.0.0 compatible native module using npm` і `"react-native-gesture-handler": "~2.32.0"`. В `App.tsx` усе дерево — усередині `GestureHandlerRootView` зі `style={{ flex: 1 }}`: без нього жодний жест не працює. Reanimated цьому кроку не потрібен: рух іде через `Animated` на native driver.

    **3. Правило свайпу.** `src/swipe.ts`: `isSwipe({ translationX, velocityX })` — спершу напрямок (лише ліворуч), потім відстань (`-120` точок) або швидкість (`-800` точок за секунду); тести в `tests/swipe.test.js`.

    **4. Рядок, що реагує на свайп.** `src/SwipeRow.tsx`: `Gesture.Pan().activeOffsetX([-12, 12]).failOffsetY([-8, 8]).runOnJS(true).onEnd((event, success) => …)` — жест забирає дотик лише після 12 точок убік і віддає його після 8 точок угору чи вниз, тож список і далі прокручується; JavaScript працює лише в кінці жесту. Тоді одна анімація `Animated.timing(…, { useNativeDriver: true })`: зсув ліворуч або, із «зменшенням руху», лише прозорість. Дія — у колбеку `start(…)`, який спрацьовує один раз і тоді, коли анімацію зупинили (`finished: false`): свайп не губиться. Рядок, що лишається в списку, повертається з новим станом. `accessibilityActions={[{ name: 'swipe', label: … }]}` і `onAccessibilityAction` виконують ту саму дію без жесту. Прибирання: `useEffect(() => () => running.current?.stop(), [])`.

    **5. Зменшення руху — один раз на екран.** `src/useReducedMotion.ts`: `AccessibilityInfo.isReduceMotionEnabled()` і `addEventListener('reduceMotionChanged', …)` з `remove()` у прибиранні. Хук викликає екран списку, а не кожен рядок, і передає значення рядкам: довгий список не відкриває по слухачу на рядок.

    **6. Повернути.** Екран зберігає дію одразу (`repository.apply`) і пам’ятає список до неї; `src/UndoBar.tsx` показує «Позначено отриманим: Навушники» і «Повернути» п’ять секунд (таймер з `clearTimeout` у прибиранні); «Повернути» — `repository.restore(previous)`, нова функція репозиторію, що зберігає попередній список.

    **7. Що міряти.** `data/synthetic.js` — копія з React-проєкту (`makeSyntheticWishes`), рядок у `docs/shared-code.md`. `SYNTHETIC_COUNT` у `src/devConfig.ts`: більше нуля — застосунок стартує з такою кількістю синтетичних записів у сховищі в пам’яті (збережені не читаються й не перезаписуються) і показує «Виміряти прокручування». `src/perfTools.ts` — лічильник кадрів JS і фіксований сценарій прокручування з уроку про профілювання; у нашому проєкті без типів DOM урок у вигляді «як є» дав `Cannot find name 'performance'`, тож копія починає лік із першого кадру. Рядок звіту: `PROD JS · 1000 rows · … JS fps · … long frames · worst … ms`. У комміті — `SYNTHETIC_COUNT = 0`.

    **8. Перевірка на комп’ютері.** `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — жодного рядка; `npm test` — `Пройшли: 53 · не пройшли: 0`; `npx expo export --platform android` — у нас `Android Bundled 2136ms index.ts (944 modules)`.

    **9. На заявленій цілі.** `npm start`: свайп ліворуч по «Навушники» — рядок виїжджає й повертається з «отримано», знизу «Позначено отриманим: Навушники» і «Повернути»; «Повернути» — знову ще бажане. Короткий рух угору-вниз прокручує список, а не рухає рядок. З TalkBack чи VoiceOver — та сама дія в меню дій рядка. Увімкни «зменшення руху» в налаштуваннях — рядок лише згасає. Потім `SYNTHETIC_COUNT = 1000`, випускна збірка (`npx expo run:android --variant release` чи `npx expo run:ios --configuration Release`; в Expo Go — `npx expo start --no-dev --minify`, і це «production JS in Expo Go», не release), «Виміряти прокручування» тричі, медіана — у `docs/PERF.md`. Знайди одну виміряну проблему, виправ, виміряй знову так само. Цього ми не бачили: наш `docs/PERF.md` каже «не виміряно» й називає зміну, яку зробив еталон (одна підписка на «зменшення руху» на екран, JavaScript лише в кінці жесту).

    **10. Доказ і commit.** У `EVIDENCE.md` — розділ «RN-10»: рядки кроку 8, побачене на цілі й таблиця з `docs/PERF.md`, або запис «не виконано» (тоді на сторінці кроку — «У мене немає емулятора чи пристрою», а не «Цей крок виконано»). `git add -A`, `git commit -m "Swipe a row with undo, reduced motion and a measured long list"` — у нас `17 files changed`.

    **Самоперевірка:** у кожного свайпу є дія доступності з тим самим результатом; JavaScript жесту працює лише в кінці; анімація на native driver і зупиняється в прибиранні; «зменшення руху» прибирає рух, але не результат; «Повернути» відновлює саме попередній список; `docs/PERF.md` називає збірку, ціль, набір даних і сценарій; `SYNTHETIC_COUNT = 0` у комміті.

    **Якщо щось пішло не так:** жест не спрацьовує ніде — немає `GestureHandlerRootView` над навігатором. Свайп заважає прокручуванню — немає `failOffsetY`. Після повернення на екран рядок лишився зсунутим — анімацію не зупинено в прибиранні або колбек не повертає значення. Числа в debug і release дуже різні — так і має бути: порівнюй лише release з release.

    Еталон кроку — `Завантажити: RN-10 — Свайп, анімація без зайвого руху й виміряний довгий список` після експорту (без `assets/*.png`, `LICENSE`, `package-lock.json` і `node_modules/` — див. крок RN-01). Команди виконано лише на macOS; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    A list row gets a gesture: a swipe to the left performs the domain's main action, and the screen reader's actions menu performs the same action. The row answers with one bounded animation — it slides out, or with “reduce motion” on only fades — and an “Undo” bar gives five seconds to change your mind. Then you measure a long synthetic list in a release build on the declared target and fix one measured problem.

    | Project | Swipe to the left | The row | Undo |
    |---|---|---|---|
    | Wishlist | `acquiredToggled`: acquired ↔ still wanted | slides out and comes back with the new mark | the previous list |
    | Planner | `doneToggled`: done ↔ not | slides out and comes back with the new state | the previous list |
    | Habit tracker | `completionAdded` with today's date (only an active habit not marked yet) | slides out and comes back with “Completed today” | the previous list |
    | Expense tracker | `removed` | slides out and is gone; the category totals come from the new list | the previous list |

    Below is the wishlist. The computer commands were run on macOS (Node.js 25.2.1, Expo SDK 57, react-native-gesture-handler 2.32.0) on all four projects. There was no emulator, simulator or phone: we have seen no gesture, animation or measurement; steps 8–9 follow this unit's lessons and the documentation of React Native 0.86 and react-native-gesture-handler 2.32.

    **1. The starting state.** `cd ~/js-course/wishlist-native`, `git status` — clean, `git log --oneline -1` — the commit of the service records screen.

    **2. Gestures.** `npx expo install react-native-gesture-handler` — for us `› Installing 1 SDK 57.0.0 compatible native module using npm` and `"react-native-gesture-handler": "~2.32.0"`. In `App.tsx` the whole tree sits inside `GestureHandlerRootView` with `style={{ flex: 1 }}`: without it no gesture works. This step does not need Reanimated: the movement goes through `Animated` on the native driver.

    **3. The swipe rule.** `src/swipe.ts`: `isSwipe({ translationX, velocityX })` — the direction first (only to the left), then the distance (`-120` points) or the speed (`-800` points per second); tests in `tests/swipe.test.js`.

    **4. A row that reacts to a swipe.** `src/SwipeRow.tsx`: `Gesture.Pan().activeOffsetX([-12, 12]).failOffsetY([-8, 8]).runOnJS(true).onEnd((event, success) => …)` — the gesture claims the touch only after 12 points to the side and gives it up after 8 points up or down, so the list still scrolls; JavaScript runs only at the end of the gesture. Then one animation `Animated.timing(…, { useNativeDriver: true })`: a shift to the left or, with “reduce motion”, only the opacity. The action is in the callback of `start(…)`, which fires once also when the animation was stopped (`finished: false`): a swipe is never lost. A row that stays in the list comes back with its new state. `accessibilityActions={[{ name: 'swipe', label: … }]}` and `onAccessibilityAction` perform the same action without a gesture. Cleanup: `useEffect(() => () => running.current?.stop(), [])`.

    **5. Reduce motion — once per screen.** `src/useReducedMotion.ts`: `AccessibilityInfo.isReduceMotionEnabled()` and `addEventListener('reduceMotionChanged', …)` with `remove()` in the cleanup. The list screen calls the hook, not every row, and passes the value to the rows: a long list does not open one listener per row.

    **6. Undo.** The screen saves the action at once (`repository.apply`) and keeps the list from before; `src/UndoBar.tsx` shows “Marked as acquired: Headphones” and “Undo” for five seconds (a timer with `clearTimeout` in the cleanup); “Undo” — `repository.restore(previous)`, a new repository function that saves the previous list.

    **7. What to measure.** `data/synthetic.js` — a copy from the React project (`makeSyntheticWishes`), a row in `docs/shared-code.md`. `SYNTHETIC_COUNT` in `src/devConfig.ts`: above zero, the app starts with that many synthetic records in a memory storage (the saved ones are neither read nor overwritten) and shows “Measure scrolling”. `src/perfTools.ts` — the JS frame meter and the fixed scroll script of the profiling lesson; in our project without the DOM types the lesson's file as it is gave `Cannot find name 'performance'`, so the copy starts counting at the first frame. The report line: `PROD JS · 1000 rows · … JS fps · … long frames · worst … ms`. In the commit — `SYNTHETIC_COUNT = 0`.

    **8. The check on the computer.** `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — not a single line; `npm test` — `Passed: 53 · failed: 0`; `npx expo export --platform android` — for us `Android Bundled 2136ms index.ts (944 modules)`.

    **9. On the declared target.** `npm start`: a swipe to the left on “Headphones” — the row slides out and comes back with “acquired”, at the bottom “Marked as acquired: Headphones” and “Undo”; “Undo” — still wanted again. A short move up or down scrolls the list instead of moving the row. With TalkBack or VoiceOver — the same action in the row's actions menu. Turn on “reduce motion” in the settings — the row only fades. Then `SYNTHETIC_COUNT = 1000`, a release build (`npx expo run:android --variant release` or `npx expo run:ios --configuration Release`; in Expo Go `npx expo start --no-dev --minify`, which is “production JS in Expo Go”, not release), “Measure scrolling” three times, the median into `docs/PERF.md`. Find one measured problem, fix it, measure again the same way. We have not seen this: our `docs/PERF.md` says “not measured” and names the change the reference made (one reduce-motion subscription per screen, JavaScript only at the end of the gesture).

    **10. Evidence and commit.** In `EVIDENCE.md`, a section “RN-10”: the lines of step 8, what you saw on the target and the table of `docs/PERF.md`, or a “not performed” record (then, on the step's page, “I have no emulator or device”, not “I have done this step”). `git add -A`, `git commit -m "Swipe a row with undo, reduced motion and a measured long list"` — for us `17 files changed`.

    **Self-check:** every swipe has an accessibility action with the same result; the gesture's JavaScript runs only at its end; the animation is on the native driver and stops in the cleanup; “reduce motion” removes the movement, not the result; “Undo” restores exactly the previous list; `docs/PERF.md` names the build, the target, the dataset and the script; `SYNTHETIC_COUNT = 0` in the commit.

    **If something goes wrong:** no gesture works anywhere — there is no `GestureHandlerRootView` above the navigator. The swipe gets in the way of scrolling — there is no `failOffsetY`. After a return to the screen a row stays shifted — the animation is not stopped in the cleanup, or the callback does not reset the value. Debug and release numbers differ a lot — that is expected: compare release only with release.

    The step's reference is `Download: RN-10 — A swipe, motion that can be reduced, and a measured long list` after the export (without `assets/*.png`, `LICENSE`, `package-lock.json` and `node_modules/` — see step RN-01). The commands were run on macOS only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це крок твого проєкту: жест із доступною альтернативою, обмежену анімацію з прибиранням і шляхом без руху та вимір у випускній збірці із цього розділу ти застосовуєш до власного застосунку. Платформа цей крок не перевіряє: доказ — вивід команд, тести, `docs/PERF.md`, `EVIDENCE.md` і commit."
  en: "This is a step of your project: you apply this unit's gesture with an accessible alternative, a bounded animation with cleanup and a reduced-motion path, and a release-build measurement to your own app. The platform does not check this step: the evidence is the command output, the tests, `docs/PERF.md`, `EVIDENCE.md` and the commit."
objectives:
  - uk: "Додати свайп рядка з дією доступності, повтором «Повернути», анімацією на native driver, що зупиняється в прибиранні, і шляхом без руху."
    en: "Add a row swipe with an accessibility action, an “Undo”, an animation on the native driver that stops in the cleanup, and a path without movement."
  - uk: "Виміряти довгий синтетичний список у випускній збірці на заявленій цілі, виправити одну виміряну проблему й записати числа до й після."
    en: "Measure a long synthetic list in a release build on the declared target, fix one measured problem and record the numbers before and after."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й на заявленій нативній цілі: що зробити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and on the declared native target: what to do, the expected output and the self-check list are above and on the step's page in your project."
