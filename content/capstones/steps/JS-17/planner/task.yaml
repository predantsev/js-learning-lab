# Planner variant of step JS-17. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  byDayLabel: { uk: "Невиконані за днями", en: "Pending by day" }
  announceDone: { uk: "Позначено виконаною: {name}", en: "Marked as done: {name}" }
  announcePending: { uk: "Повернуто в невиконані: {name}", en: "Back to pending: {name}" }
instructions:
  uk: |
    **1. Синтетичні дані.** Новий модуль `data/synthetic.js` експортує `makeSyntheticTasks(count)` — `count` справ з `id` `"s-1"`, `"s-2"`, …: назва однієї з шести початкових і номер, термін — один із 28 днів лютого 2026 (`"2026-02-" + день із двох цифр`, кожна сьома без терміну), кожна четверта виконана, пріоритети по черзі. Жодних `Math.random`: той самий виклик завжди дає ті самі записи, і кожен проходить `isUsableTask`.

    **2. Повільна версія як еталон.** Ось повільна версія перетворення, яке ти пришвидшиш:

    ```js
    function slowDueCountsByDay(list) {
      const days = [...new Set(list.filter((task) => !task.done && task.dueDate !== null).map((task) => task.dueDate))].sort();
      return new Map(days.map((day) => [day, list.filter((task) => !task.done && task.dueDate === day).length]));
    }
    ```

    Створи `tests/performance.test.js` (і імпортуй його в `run-tests.js`): скопіюй туди повільну версію й напиши [[characterization-test|характеризаційні тести]] — нова функція дає те саме, що повільна, на кількох сотнях синтетичних записів і на маленьких прикладах, написаних вручну. Ці тести мають пройти й до зміни, і після неї.

    **3. Індекс замість повторних проходів.** `dueCountsByDay(list)` у `domain/tasks.ts` повертає `Map` від дня `"YYYY-MM-DD"` до кількості невиконаних справ із цим терміном, дні за зростанням. Повільна версія для кожного дня знову фільтрує весь список. Напиши швидку: один прохід, що додає 1 до лічильника дня в `Map`, а потім сортування лише кількох різних днів. Підпис функції не змінюється. Виміряй час у DevTools (вкладка Performance) до й після зміни на тисячах синтетичних записів — як у уроках розділу.

    **4. Сторінка.** Під рядком пріоритетів додай `<p id="by-day"></p>`: `render()` пише туди «%%byDayLabel%%: » і для кожного дня з `dueCountsByDay(current)` `formatDay(день, LOCALE) + ": " + кількість`, через « · » (порожній текст, коли таких днів немає).

    **5. Аудит доступності.**

    - Оголошення: після кліку «%%markDoneLabel%%» / «%%markPendingLabel%%» напиши в `#status` (у нього вже є `role="status"`) «%%announceDone%%» чи «%%announcePending%%», підставивши назву замість `{name}`. Додай у `ui/page.js` маленьку функцію `announce(text)`, що пише текст у `#status`.
    - Поля з помилкою: `showErrors` ставить полям `#task-title` `aria-invalid="true"`, коли в них помилка, і `"false"`, коли немає. Повідомлення під полем уже пов’язане з ним через `aria-describedby`, тож скринрідер читає його, щойно поле отримує фокус.

    **Як перевірятиметься.** Роботу перевірки міряють **кількістю прочитань**, а не часом: прочитань поля `dueDate` на 2 000 синтетичних справ — не більше 8 000. Прочитання рахує getter чи `Proxy`, підставлений замість поля, а результат порівнюється з власним підрахунком перевірок. Ще перевірки викликають генератор, дивляться на сторінку, на області `role="status"` після головної дії й на `aria-invalid` і `aria-describedby` поля назви після порожньої чернетки. Твої тести запускаються з `domain/tasks.ts` від курсу (з прибраними типами) — усі мають пройти — і з версією, що рахує й виконані справи: з нею хоча б один тест має впасти.
  en: |
    **1. Synthetic data.** The new module `data/synthetic.js` exports `makeSyntheticTasks(count)` — `count` tasks with the `id`s `"s-1"`, `"s-2"`, …: the title of one of the six starting tasks and a number, the due date one of the 28 days of February 2026 (`"2026-02-" + a two-digit day`, every seventh without a due date), every fourth done, the priorities in turn. No `Math.random`: the same call always gives the same records, and every one passes `isUsableTask`.

    **2. The slow version as the reference.** Here is the slow version of the transform you will speed up:

    ```js
    function slowDueCountsByDay(list) {
      const days = [...new Set(list.filter((task) => !task.done && task.dueDate !== null).map((task) => task.dueDate))].sort();
      return new Map(days.map((day) => [day, list.filter((task) => !task.done && task.dueDate === day).length]));
    }
    ```

    Create `tests/performance.test.js` (and import it in `run-tests.js`): copy the slow version into it and write [[characterization-test|characterization tests]] — the new function gives the same as the slow one on a few hundred synthetic records and on small examples written by hand. These tests must pass both before the change and after it.

    **3. An index instead of repeated passes.** `dueCountsByDay(list)` in `domain/tasks.ts` returns a `Map` from a day `"YYYY-MM-DD"` to the number of pending tasks due on it, the days in ascending order. The slow version filters the whole list again for every day. Write a fast one: one pass that adds 1 to the day’s counter in a `Map`, then a sort of only the few distinct days. The function's signature does not change. Measure the time in DevTools (the Performance tab) before and after the change on thousands of synthetic records — as in this unit's lessons.

    **4. The page.** Under the priorities line add `<p id="by-day"></p>`: `render()` writes “%%byDayLabel%%: ” into it and for every day of `dueCountsByDay(current)` `formatDay(day, LOCALE) + ": " + count`, joined with “ · ” (empty text when there are no such days).

    **5. Accessibility audit.**

    - Announcement: after a click on “%%markDoneLabel%%” / “%%markPendingLabel%%” write “%%announceDone%%” or “%%announcePending%%” into `#status` (it already has `role="status"`), with the title in place of `{name}`. Add a small function `announce(text)` to `ui/page.js` that writes the text into `#status`.
    - Fields with an error: `showErrors` gives the fields `#task-title` `aria-invalid="true"` when they have an error and `"false"` when they do not. The message under a field is already linked to it through `aria-describedby`, so a screen reader reads it as soon as the field gets focus.

    **How it is checked.** The checks measure work by **the number of reads**, not by time: reads of the field `dueDate` for 2,000 synthetic tasks — at most 8,000. A getter or a `Proxy` put in place of the field counts the reads, and the result is compared with the checks' own count. The checks also call the generator, look at the page, at the `role="status"` regions after the main action and at `aria-invalid` and `aria-describedby` of the name field after an empty draft. Your tests run with the course's `domain/tasks.ts` (with the types removed) — all must pass — and with a version that also counts done tasks: with it, at least one test must fail.
nudge:
  uk: "Повільна версія повторює прохід по списку для кожного запису чи дня. Швидка проходить один раз і щоразу питає `Map` чи `Set` — `get`, `has`, `set` не переглядають усіх записів. Характеризаційний тест пиши ще до зміни: тоді він доводить, що поведінка лишилася тією самою."
  en: "The slow version repeats the pass over the list for every record or day. The fast one goes through once and asks a `Map` or a `Set` each time — `get`, `has` and `set` do not look through all the records. Write the characterization test before the change: then it proves that the behaviour stayed the same."
