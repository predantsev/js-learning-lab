feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там помилка завантаження `data/synthetic.js` чи `tests/performance.test.js`, то файл лежить не в тій теці або має іншу назву."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. If it shows a loading error for `data/synthetic.js` or `tests/performance.test.js`, the file is in another folder or has another name."
  - when: { test: "the synthetic generator makes 20,000 valid records, the same every time" }
    message:
      uk: "Ця перевірка викликає генератор з `data/synthetic.js` для 20 000 записів і чекає 20 000 різних `id`, жодного запису, який відхиляє `isUsableHabit`, і однакові записи від двох однакових викликів. `Math.random` і поточна дата дають щоразу інші дані."
      en: "This check calls the generator of `data/synthetic.js` for 20,000 records and expects 20,000 different `id`s, no record that `isUsableHabit` refuses, and the same records from two identical calls. `Math.random` and the current date give different data every time."
  - when: { test: "summarizeHabit reads each completion only a few times" }
    message:
      uk: "Ця перевірка рахує прочитання елементів `completions` (через `Proxy`) під час `summarizeHabit` для звички з 1 000 дат за 1 000 днів і чекає не більше 3 000 — і той самий `{ count, rate }`, що дає підрахунок перевірки. З `includes` для кожного дня прочитань сотні тисяч."
      en: "This check counts the reads of the items of `completions` (through a `Proxy`) during `summarizeHabit` for a habit with 1,000 dates over 1,000 days and expects at most 3,000 — and the same `{ count, rate }` as the check’s own count. With `includes` for every day there are hundreds of thousands of reads."
  - when: { test: "summarizeHabit counts only the completions inside the days" }
    message:
      uk: "Ця перевірка чекає від `summarizeHabit` для `h-04` за дні з 26 лютого по 1 березня `{ count: 1, rate: 0.25 }` (виконання 22 лютого поза цими днями), а для порожнього масиву днів — `{ count: 0, rate: 0 }`."
      en: "This check expects `summarizeHabit` to give `{ count: 1, rate: 0.25 }` for `h-04` over the days from February 26 to March 1 (the completion on February 22 is outside these days), and `{ count: 0, rate: 0 }` for an empty array of days."
  - when: { test: "the summary still shows the completion rates" }
    message:
      uk: "Ця перевірка перезапускає сторінку з порожнім сховищем і чекає в підсумку «%%fixture1Name%% — 75%», як і до зміни `summarizeHabit`."
      en: "This check restarts the page with an empty storage and expects “%%fixture1Name%% — 75%” in the summary, as before the change of `summarizeHabit`."
  - when: { test: "the main action is announced in a status region" }
    message:
      uk: "Ця перевірка натискає «%%markTodayLabel%%» у картці `h-03` і чекає в області `role=\"status\"` (чи `aria-live`) рівно «%%announceMarked%%» з назвою `h-03` замість `{name}`."
      en: "This check presses “%%markTodayLabel%%” in the card `h-03` and expects exactly “%%announceMarked%%” with the name of `h-03` in place of `{name}` in a `role=\"status\"` (or `aria-live`) region."
  - when: { test: "a field with an error is marked invalid and linked to its message" }
    message:
      uk: "Ця перевірка надсилає форму з порожньою назвою й чекає в поля «%%nameLabel%%» `aria-invalid=\"true\"` і «%%requiredMessage%%» у тексті елемента, на який указує його `aria-describedby`; після правильної чернетки `aria-invalid` має бути `\"false\"` або зникнути."
      en: "This check submits the form with an empty name and expects `aria-invalid=\"true\"` on the field “%%nameLabel%%” and “%%requiredMessage%%” in the text of the element its `aria-describedby` names; after a valid draft `aria-invalid` must be `\"false\"` or gone."
  - when: { test: "your performance tests pass with a correct domain module" }
    message:
      uk: "Ця перевірка запускає `tests/performance.test.js` з `domain/habits.ts` від курсу (з прибраними типами) і раннером курсу та чекає хоча б один тест і жодного, що впав. Повідомлення внизу називає тест, що впав, або помилку. Якщо там «there is no file tests/performance.test.js», то файл лежить не в теці `tests/` або має іншу назву."
      en: "This check runs `tests/performance.test.js` with the course's `domain/habits.ts` (with the types removed) and the course runner, and expects at least one test and none that fails. The message below names the failed test or the error. If it says “there is no file tests/performance.test.js”, the file is not in the folder `tests/` or has another name."
  - when: { test: "your tests catch a summary that counts completions outside the days" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.ts`. Потім вона підставляє версію, де `summarizeHabit` рахує всі виконання, і ті, що поза переданими днями, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у даних якого є виконання поза переданими днями."
      en: "This check first expects all your tests to pass with the correct `domain/habits.ts`. Then it puts in a version where `summarizeHabit` counts every completion, also those outside the given days, and expects at least one of your tests to fail. A test whose data has completions outside the given days notices this defect."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
