    uk: "Проєкт запускається без помилок"
    en: "The project starts without errors"
  "the synthetic generator makes 20,000 valid records, the same every time":
    uk: "Генератор дає 20 000 правильних записів, щоразу однакових"
    en: "The generator makes 20,000 valid records, the same every time"
  "summarizeHabit reads each completion only a few times":
    uk: "`summarizeHabit` читає кожну дату виконання лише кілька разів і дає той самий результат"
    en: "`summarizeHabit` reads every completion date only a few times and gives the same result"
  "summarizeHabit counts only the completions inside the days":
    uk: "`summarizeHabit` рахує лише виконання в межах переданих днів"
    en: "`summarizeHabit` counts only the completions inside the given days"
  "the summary still shows the completion rates":
    uk: "Підсумок, як і раніше, показує частки виконання"
    en: "The summary still shows the completion rates"
  "the main action is announced in a status region":
    uk: "Результат головної дії оголошується в області `role=\"status\"`"
    en: "The result of the main action is announced in a `role=\"status\"` region"
  "a field with an error is marked invalid and linked to its message":
    uk: "Поле з помилкою позначено `aria-invalid` і пов’язано з повідомленням"
