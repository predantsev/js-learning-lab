# Habits variant of step JS-17. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  announceMarked: { uk: "Позначено на сьогодні: {name}", en: "Marked for today: {name}" }
instructions:
  uk: |
    **1. Синтетичні дані.** Новий модуль `data/synthetic.js` експортує `makeSyntheticHabits(count, days)` — `count` звичок з `id` `"s-1"`, `"s-2"`, …, де звичка номер `i` виконана кожного `(i % 3 + 1)`-го дня з `days` днів від `2023-01-01`; дату дає `dayAfterStart(offset)` — `new Date(Date.UTC(2023, 0, 1 + offset)).toISOString().slice(0, 10)` (у UTC кожна доба має 24 години, часових поясів тут немає). Експортуй обидві функції. Жодних `Math.random`: той самий виклик завжди дає ті самі записи, і кожен проходить `isUsableHabit`.

    **2. Повільна версія як еталон.** Ось повільна версія перетворення, яке ти пришвидшиш — нинішня `summarizeHabit`:

    ```js
    function slowSummarizeHabit(habit, days) {
      const count = days.filter((day) => habit.completions.includes(day)).length;
      return { count: count, rate: days.length === 0 ? 0 : count / days.length };
    }
    ```

    Створи `tests/performance.test.js` (і імпортуй його в `run-tests.js`): скопіюй туди повільну версію й напиши [[characterization-test|характеризаційні тести]] — нова функція дає те саме, що повільна, на кількох сотнях синтетичних записів і на маленьких прикладах, написаних вручну. Ці тести мають пройти й до зміни, і після неї.

    **3. Індекс замість повторних проходів.** `summarizeHabit(habit, days)` у `domain/habits.ts` зараз для кожного дня викликає `completions.includes(day)` — прохід по всіх датах виконання. Перепиши її: один раз поклади `completions` у `Set`, а потім для кожного дня — `has(day)`. Результат той самий: `{ count, rate }`. Підпис — той самий, що в повільної версії з тестів: той самий параметр і той самий тип результату. Зручно спершу вставити в модуль повільну версію під цією назвою, переконатися, що характеризаційні тести проходять, а тоді переписати її. Виміряй час у DevTools (вкладка Performance) до й після зміни на тисячах синтетичних записів — як у уроках розділу.

    **4. Сторінка.** Підсумок сторінки вже користується `summarizeHabit` через `formatRates` — він має показувати ті самі частки, що й раніше.

    **5. Аудит доступності.**

    - Оголошення: після кліку «%%markTodayLabel%%» напиши в `#status` (у нього вже є `role="status"`) «%%announceMarked%%», підставивши назву замість `{name}`. Додай у `ui/page.js` маленьку функцію `announce(text)`, що пише текст у `#status`.
    - Поля з помилкою: `showErrors` ставить полю `#habit-name` `aria-invalid="true"`, коли в ньому помилка, і `"false"`, коли немає. Повідомлення під полем уже пов’язане з ним через `aria-describedby`, тож скринрідер читає його, щойно поле отримує фокус.

    **Як перевірятиметься.** Роботу перевірки міряють **кількістю прочитань**, а не часом: прочитань елементів `completions` для звички з 1 000 датами за 1 000 днів — не більше 3 000. Прочитання рахує getter чи `Proxy`, підставлений замість поля, а результат порівнюється з власним підрахунком перевірок. Ще перевірки викликають генератор, дивляться на сторінку, на області `role="status"` після головної дії й на `aria-invalid` і `aria-describedby` поля назви після порожньої чернетки. Твої тести запускаються з `domain/habits.ts` від курсу (з прибраними типами) — усі мають пройти — і з версією, що рахує всі виконання, і ті, що поза переданими днями: з нею хоча б один тест має впасти.
  en: |
    **1. Synthetic data.** The new module `data/synthetic.js` exports `makeSyntheticHabits(count, days)` — `count` habits with the `id`s `"s-1"`, `"s-2"`, …, where habit number `i` was completed on every `(i % 3 + 1)`-th day of `days` days from `2023-01-01`; the date comes from `dayAfterStart(offset)` — `new Date(Date.UTC(2023, 0, 1 + offset)).toISOString().slice(0, 10)` (in UTC every day has 24 hours, there are no time zones here). Export both functions. No `Math.random`: the same call always gives the same records, and every one passes `isUsableHabit`.

    **2. The slow version as the reference.** Here is the slow version of the transform you will speed up — the current `summarizeHabit`:

    ```js
    function slowSummarizeHabit(habit, days) {
      const count = days.filter((day) => habit.completions.includes(day)).length;
      return { count: count, rate: days.length === 0 ? 0 : count / days.length };
    }
    ```

    Create `tests/performance.test.js` (and import it in `run-tests.js`): copy the slow version into it and write [[characterization-test|characterization tests]] — the new function gives the same as the slow one on a few hundred synthetic records and on small examples written by hand. These tests must pass both before the change and after it.

    **3. An index instead of repeated passes.** `summarizeHabit(habit, days)` in `domain/habits.ts` now calls `completions.includes(day)` for every day — a pass over all the completion dates. Rewrite it: put `completions` into a `Set` once, then `has(day)` for every day. The result is the same: `{ count, rate }`. The signature is the same as that of the slow version in the tests: the same parameter and the same type of result. It helps to put the slow version into the module under this name first, see the characterization tests pass, and then rewrite it. Measure the time in DevTools (the Performance tab) before and after the change on thousands of synthetic records — as in this unit's lessons.

    **4. The page.** The page summary already uses `summarizeHabit` through `formatRates` — it must show the same shares as before.

    **5. Accessibility audit.**

    - Announcement: after a click on “%%markTodayLabel%%” write “%%announceMarked%%” into `#status` (it already has `role="status"`), with the name in place of `{name}`. Add a small function `announce(text)` to `ui/page.js` that writes the text into `#status`.
    - Fields with an error: `showErrors` gives the fields `#habit-name` `aria-invalid="true"` when they have an error and `"false"` when they do not. The message under a field is already linked to it through `aria-describedby`, so a screen reader reads it as soon as the field gets focus.

    **How it is checked.** The checks measure work by **the number of reads**, not by time: reads of the items of `completions` for a habit with 1,000 dates over 1,000 days — at most 3,000. A getter or a `Proxy` put in place of the field counts the reads, and the result is compared with the checks' own count. The checks also call the generator, look at the page, at the `role="status"` regions after the main action and at `aria-invalid` and `aria-describedby` of the name field after an empty draft. Your tests run with the course's `domain/habits.ts` (with the types removed) — all must pass — and with a version that counts every completion, also those outside the given days: with it, at least one test must fail.
nudge:
  uk: "Повільна версія повторює прохід по списку для кожного запису чи дня. Швидка проходить один раз і щоразу питає `Map` чи `Set` — `get`, `has`, `set` не переглядають усіх записів. Характеризаційний тест пиши ще до зміни: тоді він доводить, що поведінка лишилася тією самою."
  en: "The slow version repeats the pass over the list for every record or day. The fast one goes through once and asks a `Map` or a `Set` each time — `get`, `has` and `set` do not look through all the records. Write the characterization test before the change: then it proves that the behaviour stayed the same."
testTitles:
