<!doctype html>
<html lang="%%htmlLang%%">
<head>
  <meta charset="utf-8">
  <title>%%projectTitle%%</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>%%projectTitle%%</h1>
    <p class="pitch">%%pitch%%</p>
    <img src="images/habit.svg" alt="%%imageAlt%%">

    <form id="habit-form" novalidate>
      <h2>%%formTitle%%</h2>
      <div class="field">
        <label for="habit-name">%%nameLabel%%</label>
        <input id="habit-name" name="name" aria-describedby="habit-name-error">
        <p id="habit-name-error" class="error"></p>
      </div>
      <div class="field">
        <label for="habit-frequency">%%valueLabel%%</label>
        <select id="habit-frequency" name="frequency">
          <option value="daily" selected>%%daily%%</option>
          <option value="weekly">%%weekly%%</option>
        </select>
      </div>
      <div class="field field-check">
        <input id="habit-active" name="active" type="checkbox" checked>
        <label for="habit-active">%%activeFieldLabel%%</label>
      </div>
      <button id="habit-save" type="submit">%%saveLabel%%</button>
    </form>

    <p id="status" role="status"></p>
    <p id="load-message" role="status"></p>
    <button id="retry-load" type="button" hidden>%%retryLoadLabel%%</button>
    <p id="summary"></p>
    <h2 id="list-title" tabindex="-1">%%listTitle%%</h2>
    <div class="field">
      <label for="search">%%searchLabel%%</label>
      <input id="search" type="search">
    </div>
    <div class="field">
      <label for="list-filter">%%filterLabel%%</label>
      <select id="list-filter">
        <option value="all">%%filterAll%%</option>
        <option value="active">%%filterActive%%</option>
        <option value="paused">%%filterPaused%%</option>
      </select>
    </div>
    <ul id="habits" class="cards"></ul>
    <button id="show-more" type="button" hidden>%%moreLabel%%</button>
    <p id="empty-message" hidden>%%emptyMessage%%</p>
  </main>
  <script type="module" src="app.js"></script>
  <!-- run-tests.js runs the tests in tests/ and prints one line per test in the console. -->
  <script type="module" src="run-tests.js"></script>
</body>
</html>
